<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>奕诚-数学</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>

img src=\"https://dati.gwzpks.com/uploads/20260729/YzjR2rTZ20Q2jw7NZrf55g2ADPPI7Zad46NOIOoP.png\"><\/p>", "l3": "数学", "l4": "第13章", "ap": [false, false, false, false, false, false]}, {"id": "38832", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260729/7LXVSdO8REu8IPMxViZCvkMVGWK99I9GX2WxrvEa.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260729/rXGGmPwZXE1gHmFi7APxaP5GsoL2CNhQrZeXL7pB.png\"><\/p>", "l3": "数学", "l4": "第13章", "ap": [false, false, false, false, false, false]}, {"id": "38833", "t": 3, "q": "在实际问题中求某参数的置信区间时，总是希望置信水平愈高愈好，而置信区间的长度愈小愈好。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】本题考查13章，2节，知识点3。\n【难度】中等+计算\n【解析】考察知识点： 置信水平与区间长度存在制衡关系：样本容量固定时，置信水平越高，分位数越大，置信区间越长； 若想要同时高置信水平、小区间长度，只能增大样本量。 解析： 题目表述“总是希望置信水平愈高愈好，置信区间长度愈小愈好”，仅从需求角度描述主观期望，无逻辑错误。 \n1.实际分析目标：希望区间可靠度高（置信水平高），同时估计精度高（区间窄）；\n2.二者在样本量固定时相互制约，但主观期望本身无错误，只是无法同时实现，需增加样本量兼顾。 因此该说法正确。 答案：A", "l3": "数学", "l4": "第13章", "ap": [false, false, false, false, false, false]}, {"id": "38834", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260729/XgNIyoLzbgCAqO6FB8gViBRvsE2jBEiuDnVTYpH1.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260729/mGRidk3xOwTp8pb5EHo8YfzdP8jsdui3jH8sey9G.png\"><\/p>", "l3": "数学", "l4": "第13章", "ap": [false, false, false, false, false, false]}, {"id": "38835", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260729/ZjbBmkh5vV26n2BJEtfaPUqVncs6zdIg1AlwG4CS.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260729/cJVVTpBgQcdO7gLt07reuLCt8sx93zLFWOOVpes9.png\"><\/p>", "l3": "数学", "l4": "第13章", "ap": [false, false, false, false, false, false]}, {"id": "38836", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260729/JXFyjWkXV024THdZQmL3yf9WnMsQQlsFHJhNt8Ry.png\"><\/p>", "a": ["<p>正 14章14.1 机器学习基本概念-知识点1：机器学习基础概念\nA.训练集准确率仅反映模型在训练数据表现，与未知数据无关，错误 \nB.泛化能力定义为模型对未知新数据的预测能力，正确 \nC.偏差代表预测与真实值平均误差，高偏差对应欠拟合，错误 \nD.方差代表不同训练集预测波动，高方差对应过拟合，错误.答案：B.", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38972", "t": 1, "q": "处理量纲差异悬殊的数值特征，最优预处理方法是（     ）。", "a": ["独热编码", "Z-score标准化", "标签编码", "直接删除特征", "", ""], "r": "B", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点3：数据预处理-特征缩放\nA.独热编码用于类别特征，无法消除量纲差异，错误 \nB.标准化将特征映射为均值0、方差1，统一量纲，正确 \nC.标签编码用于有序类别转换，不处理数值量纲，错误 \nD.删除特征会丢失有效信息，并非最优方案，错误答案：B。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38973", "t": 1, "q": "下列损失函数仅适用于回归任务的是（     ）。", "a": ["交叉熵损失", "Hinge损失", "平方差MSE损失", "KL散度损失", "", ""], "r": "C", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念，知识点5：损失函数-各损失适用任务\nA.交叉熵损失为分类任务主流损失，错误 \nB.Hinge损失用于SVM二分类，错误 \nC.平方差MSE专门衡量回归预测误差，正确 \nD.KL散度用于概率分布对齐，多用于分类、生成模型，错误，答案：C.", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38974", "t": 1, "q": "疾病筛查任务中，想要尽可能减少患病样本漏诊，核心优化指标是（     ）。", "a": ["准确率", "精确率Precision", "召回率Recall", "F1值", "", ""], "r": "C", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点8：模型评估指标-分类指标业务含义，漏诊：真实正样本未被检出，对应召回率定义 \nA.疾病数据集正负样本不均衡，准确率无参考意义，错误 \nB.精确率控制误诊，无法减少漏诊，错误 \nC.召回率衡量全部正样本中被正确识别比例，正确 \nD.F1为精确率与召回率调和平均，平衡指标非优先目标，错误答案：C。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38975", "t": 1, "q": "关于L1、L2正则化，描述错误的是（     ）。", "a": ["L1正则可实现特征自动筛选", "L2正则能够抑制模型过拟合", "L1正则会让全部参数无限趋近于0", "L2正则又被称为权重衰减", "", ""], "r": "C", "e": "【难度】3\n【解析】考察第14章14.1 机器学习基本概念-知识点7：正则化-L1与L2正则特性区分\nA.L1惩罚项生成稀疏参数，部分参数置零，可筛选特征，正确 \nB.L2限制参数幅值，降低模型复杂度，缓解过拟合，正确 \nC.L1仅令部分参数等于0；L2才使全部参数趋近0，错误 \nD.L2正则等价权重衰减算法，该说法成立，正确\n答案：C", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38976", "t": 1, "q": "以下属于无监督学习任务的是（     ）。", "a": ["基于用户标签训练商品分类模型", "使用K-MeA.ns对客户做用户分群", "利用历史数据预测股票收盘价", "训练人脸识别模型区分不同人员", "", ""], "r": "B", "e": "【难度】1\n【解析】考察第14章14.2 监督与无监督学习-知识点1：无监督学习算法\nA.带类别标签训练分类模型，属于监督学习，错误 \nB.K-Means聚类无标签，自动划分样本群体，无监督学习，正确 \nC.数值预测回归任务，带标签，监督学习，错误 \nD.人脸分类任务，存在标注身份标签，监督学习，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38977", "t": 1, "q": "模型训练集精度极高、测试集精度大幅下降，该现象称为（     ）。", "a": ["欠拟合", "过拟合", "高偏差", "数据均衡", "", ""], "r": "B", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点6：过拟合与欠拟合-现象区分\nA.欠拟合表现为训练、测试精度均偏低，错误 \nB.过拟合特征：训练效果极好，泛化测试效果差，正确 \nC.高偏差对应欠拟合，与题干现象不符，错误 \nD.数据均衡描述样本分布，和模型拟合无关，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38978", "t": 1, "q": "下列算法不属于无约束优化算法的是（     ）。", "a": ["最小二乘法", "梯度下降法", "线性规划", "牛顿法", "", ""], "r": "C", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点4：无约束优化算法-约束优化区分\nA、B、D：仅优化目标函数，无等式、不等式约束，无约束优化，正确 \nC.线性规划带有变量约束条件，属于约束优化问题，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38979", "t": 1, "q": "哪种聚类算法无需预先设定簇的数量K（     ）。", "a": ["K-Means", "DBSCAN", "线性回归", "逻辑回归", "", ""], "r": "B", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点9：经典监督学习算法-聚类算法特性\nA.K-Means必须提前指定簇数量K，错误 \nBDBSCAN基于密度聚类，自动识别簇，无需指定K，正确 \n&C、D：线性、逻辑回归为监督回归/分类算法，非聚类，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38980", "t": 1, "q": "关于随机森林集成算法描述错误的是（     ）。", "a": ["属于Bagging并行集成框架", "基学习器为决策树", "各决策树独立并行训练", "训练过程前后树存在依赖关系", "", ""], "r": "D", "e": "【难度】3\n【解析】考察第14章14.2 监督与无监督学习-知识点2：集成学习-Bagging随机森林\nA.随机森林是Bagging典型实现，并行集成，正确 \nB.随机森林基础单元为决策树，正确 \nC.Bagging各基模型独立采样、独立训练，无依赖，正确 \nD.前后树无依赖，串行有依赖是Boosting特征，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38981", "t": 1, "q": "下列模型中可直接输出概率值用于二分类的是（     ）。", "a": ["线性回归", "逻辑回归", "K-Means", "DBSCAN", "", ""], "r": "B", "e": "【难度】1\n【解析】考察第14章14.1 机器学习基本概念-知识点9：经典监督学习算法-逻辑回归特性\nA.线性回归输出连续数值，仅用于回归任务，错误 \nB.逻辑回归通过sigmoid 映射输出0到1概率，适用于二分类，正确 \n&C.、D.：K-Means、DBSCAN为无监督聚类算法，无法输出分类概率，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38982", "t": 1, "q": "下列操作属于正则化，用于缓解过拟合的是（     ）。", "a": ["对特征做Z-Score标准化", "损失函数添加L_2惩罚项", "使用3σ原则剔除异常值", "采用PCA对特征降维", "", ""], "r": "B", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点7：正则化-正则化作用与区分\nA.标准化属于特征缩放预处理，不具备正则化效果，错误 \nB.L_2正则惩罚大权重参数，降低模型复杂度，抑制过拟合，正确 \nC.异常值处理属于数据清洗，和正则化无关，错误 \nD.PCA是无监督降维方法，不属于正则化手段，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38983", "t": 1, "q": "下列不属于监督学习集成算法的是（     ）。", "a": ["XGBoost", "LightGBM", "DBSCAN", "随机森林", "", ""], "r": "C", "e": "【难度】2\n【解析】考察第14章14.2 监督与无监督学习-知识点2：集成学习、无监督聚类算法区分\n&A、B：XGBoost、LightGBM属于Boosting监督集成算法，正确 \nC.DBSCAN是密度聚类无监督算法，不属于集成学习，错误 \nD.随机森林属于Bagging监督集成算法，正确", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38984", "t": 1, "q": "神经网络中用来引入非线性拟合能力的组件是（     ）。", "a": ["激活函数", "Dropout", "反向传播", "Adma优化器", "", ""], "r": "A", "e": "【难度】2\n【解析】考察第14章14.2 监督与无监督学习-知识点3：深度学习基础-激活函数作用\nA.激活函数打破线性叠加，为网络引入非线性表达，正确 \nB.Dropout是正则化手段，作用为防止过拟合，错误 \nC.反向传播是梯度更新参数的训练流程，错误 \nD.Adma是参数更新优化器，仅控制收敛过程，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38985", "t": 1, "q": "关于数据集划分描述错误的是（     ）。", "a": ["训练集用于模型拟合学习数据规律", "验证集用于调整超参数，选择最优模型", "测试集可参与参数调优，提升整体精度", "测试集仅用于模型最终泛化性能评估", "", ""], "r": "C", "e": "【难度】3\n【解析】考察第14章14.1 机器学习基本概念-知识点1：机器学习基础概念-数据集划分规则\nA.训练集核心作用是模型学习数据分布，正确 \nB.验证集独立用于网格搜索、调参，筛选最优模型，正确 \nC.测试集不能参与调参，否则会造成信息泄露，泛化评估失真，错误 \nD.测试集全程隔离，仅做最终模型效果客观评估，正确", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38986", "t": 1, "q": "下列任务属于强化学习范畴的是（     ）。", "a": ["根据房屋特征预测房价", "智能小车自主避障寻路", "电商商品图片二分类", "客户消费数据聚类分群", "", ""], "r": "B", "e": "【难度】1\n【解析】考察第14章14.1 机器学习基本概念-知识点2：机器学习三大范式-强化学习应用场景\nA.房价预测为回归任务，属于监督学习，错误 \nB.智能小车与环境交互、最大化奖励，典型强化学习场景，正确 \nC.图片分类带标签，属于监督学习，错误 \nD.客户聚类无标签，属于无监督学习，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38987", "t": 1, "q": "处理性别、颜色这类离散类别文本特征，优先使用的编码方法是（     ）。", "a": ["标准化Z-Score", "独热编码", "3σ异常值处理", "最小-最大归一化", "", ""], "r": "B", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点3：数据预处理-类别特征编码\n&A、D：标准化、归一化用于数值特征缩放，无法处理文本类别，错误 \nB.独热编码将无序类别转为数值特征，适配分类特征，正确 \nC.3σ原则用于剔除数值异常样本，与编码无关，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38988", "t": 1, "q": "SVM分类器对应的损失函数是（     ）。", "a": ["Hinge损失", "平方差损失", "交叉熵损失", "KL散度损失", "", ""], "r": "A", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念知识点5：损失函数-各类损失对应模型\nA.Hinge损失最大化分类间隔，是SVM核心损失，正确 \nB.平方差损失用于线性回归等回归模型，错误 \nC.交叉熵损失多用于逻辑回归、深度学习分类，错误 \nD.KL散度用于概率分布对齐，多用于生成模型，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38989", "t": 1, "q": "用于衡量回归模型对原始数据解释力度的指标是（     ）。", "a": ["<p>召回率<\/p>", "<p>精确率<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260730/Hzj2UOFjwwnoowzyngzuzOELDrhfZVijVGEcub7W.png\"><\/p>", "<p>AUC<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260730/GycxrfZftGNppizqSh21cgo57XILXUgjRObi6JKA.png\"><\/p>", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38990", "t": 1, "q": "下列关于梯度下降与牛顿法对比，说法错误的是（     ）。", "a": ["梯度下降仅利用一阶导数迭代", "牛顿法借助二阶Hessian矩阵收敛更快", "梯度下降计算开销远大于牛顿法", "牛顿法求解Hessian矩阵计算成本高", "", ""], "r": "C", "e": "【难度】3\n【解析】考察第14章14.1 机器学习基本概念-知识点4：无约束优化算法-梯度下降、牛顿法对比\nA.梯度下降依靠一阶负梯度更新参数，正确 \nB.牛顿法引入二阶信息，迭代次数更少，收敛更快，正确 \nC.梯度下降仅计算一阶梯度，开销更小；牛顿法开销更大，错误 \nD.Hessian矩阵求解复杂度高，牛顿法计算成本高，正确", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38991", "t": 1, "q": "以下哪一种不属于无监督学习算法（     ）。", "a": ["PCA", "K-Means", "逻辑回归", "DBSCAN", "", ""], "r": "C", "e": "【难度】1\n【解析】考察第14章14.2 监督与无监督学习-知识点1：机器学习三大范式、无监督学习算法\n&A、B、D：PCA降维、K-Means、DBSCAN聚类均为无监督算法，正确 \nC.逻辑回归是带标签的二分类监督学习算法，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38992", "t": 1, "q": "下列哪种方法不能缓解模型过拟合（     ）。", "a": ["L2正则化", "Dropout", "减少训练样本数量", "数据增强", "", ""], "r": "C", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点6：过拟合与欠拟合-过拟合解决手段\nA.L2正则惩罚权重，降低模型复杂度，缓解过拟合，正确 \nB.Dropout随机屏蔽神经元，抑制过拟合，正确 \nC.训练样本变少会加剧过拟合，无法缓解，错误 \nD.数据增强扩充训练数据，减少过拟合，正确", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38993", "t": 1, "q": "Boosting类集成算法的核心特点是（     ）。", "a": ["各基学习器并行独立训练", "串行迭代，不断修正前一轮模型误差", "仅能使用决策树作为基模型", "主要降低模型方差", "", ""], "r": "B", "e": "【难度】2\n【解析】考察第14章14.2 监督与无监督学习-知识点2：集成学习-Boosting与Bagging区别\nA.并行训练是Bagging特征，Boosting串行，错误 \nB.Boosting串行训练，重点拟合前序模型错分样本，正确 \nC.Boosting基模型不限制必须为决策树，错误 \nD.Boosting降低偏差，Bagging主要降低方差，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38994", "t": 1, "q": "用来衡量二分类模型整体区分正负样本能力的指标是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260730/Vdmjy7l7IXAfdZelRR4BpncGkSmj4TlKdU9tqcoR.png\"><\/p>", "<p>AUC<\/p>", "<p>MSE<\/p>", "<p>召回率<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260730/qgiXZVwusXrlm0XsdKuGTBgAaRHkNUrre4zvwmTT.png\"><\/p>", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38995", "t": 1, "q": "关于最小二乘法描述错误的是（     ）。", "a": ["最小化误差平方和求解参数", "存在闭式解析解，无需迭代", "对异常值具备强鲁棒性", "仅适用于线性回归模型", "", ""], "r": "C", "e": "【难度】3\n【解析】考察第14章14.1 机器学习基本概念-知识点4：无约束优化算法-最小二乘法特性\nA.最小二乘法优化目标为误差平方和，正确 \nB.线性最小二乘可直接矩阵求解，无需迭代，正确 \nC.平方误差放大异常值影响，对异常值敏感，鲁棒性差，错误 \nD.经典最小二乘仅适配线性模型，非线性无法直接求解，正确", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38996", "t": 2, "q": "下列属于机器学习三大范式的有（     ）。", "a": ["监督学习", "无监督学习", "强化学习", "线性规划", "", ""], "r": "ABC", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点2：机器学习三大范式\n&A、B、C：监督、无监督、强化学习是机器学习三大范式，正确 \nD.线性规划属于约束优化算法，不属于学习范式，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38997", "t": 2, "q": "下列方法能够缓解模型过拟合的有（     ）。", "a": ["L1正则化", "L2正则化", "Dropout", "扩充训练数据集", "", ""], "r": "ABCD", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点6：过拟合与欠拟合\n&A、B：L1、L2正则通过惩罚权重降低模型复杂度，缓解过拟合，正确 \nC.Dropout随机屏蔽神经元，抑制过拟合，正确 \nD.更多训练数据减少噪声干扰，降低过拟合风险，正确", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38998", "t": 2, "q": "下列属于无约束优化算法的是（     ）。", "a": ["最小二乘法", "梯度下降法", "牛顿法", "逻辑规划", "", ""], "r": "ABC", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点4：无约束优化算法\n&A、B、C.：最小二乘、梯度下降、牛顿法均无约束条件，属于无约束优化，正确 \nD.逻辑规划带有约束条件，属于约束优化，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "38999", "t": 2, "q": "下列损失函数可用于分类任务的是（     ）。", "a": ["交叉熵损失", "Hinge损失", "KL散度损失", "平方差MSE损失", "", ""], "r": "ABC", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念知识点5：损失函数适用场景\nA.交叉熵是分类任务主流损失，正确 \nB.Hinge损失为SVM分类专用损失，正确 \nC.KL散度可对齐分类概率分布，用于分类模型，正确 \nD.MSE平方差主要用于回归任务，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39000", "t": 2, "q": "下列属于Bagging集成特点的是（     ）。", "a": ["基学习器并行独立训练", "代表模型为随机森林", "主要降低模型方差，抑制过拟合", "串行迭代修正前一轮误差", "", ""], "r": "ABC", "e": "【难度】2\n【解析】考察第14章14.2 监督与无监督学习-知识点2：集成学习-Bagging与Boosting区分\nA.Bagging各基树独立采样并行训练，正确 \nB.随机森林是Bagging典型实现，正确 \nC.并行平均降低方差，缓解过拟合，正确 \nD.串行迭代是Boosting特征，Bagging无依赖，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39001", "t": 2, "q": "数据预处理中特征缩放的常用方法包含（     ）。", "a": ["Z-Score标准化", "Min-Max归一化", "独热编码", "3σ异常值剔除", "", ""], "r": "AB", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点3：数据预处理-特征缩放\nA.标准化统一特征均值0方差1，属于特征缩放，正确 \nB.归一化将特征映射到固定区间，属于特征缩放，正确 \nC.独热编码处理类别特征，不缩放数值，错误 \nD.3σ用于异常值清洗，不属于特征缩放，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39002", "t": 2, "q": "下列属于无监督学习算法的有（     ）。", "a": ["K-Means", "DBSCAN", "PCA", "逻辑回归", "", ""], "r": "ABC", "e": "【难度】2\n【解析】考察第14章14.2 监督与无监督学习-知识点1：无监督学习算法\n&A、B：K-Means、DBSCAN为聚类无监督算法，正确 \nC.PCA降维属于无监督学习，正确 \nD.逻辑回归是监督二分类算法，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39003", "t": 2, "q": "关于数据集划分，说法正确的是（     ）。", "a": ["训练集用于模型拟合学习数据规律", "验证集用于网格搜索调超参数", "测试集可参与模型参数调优", "测试集仅用于最终泛化能力评估", "", ""], "r": "ABD", "e": "【难度】3\n【解析】考察第14章14.1 机器学习基本概念-知识点1：机器学习基础概念-数据集划分\nA.训练集是模型学习的核心数据，正确 \nB.验证集独立用于超参数筛选，正确 \nC.测试集参与调参会造成数据泄露，评估失真，错误 \nD.测试集全程隔离，仅做最终客观评估，正确", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39004", "t": 2, "q": "下列属于分类任务评估指标的是（     ）。", "a": ["精确率Precision", "召回率ReCAll", "AUC ", "均方误差MSE", "", ""], "r": "ABC", "e": "【难度】3\n【解析】考察第14章14.1 机器学习基本概念-知识点8：模型评估指标\nA.精确率衡量分类预测正样本准确度，分类指标，正确 \nB.召回率衡量正样本检出能力，分类指标，正确 \nC.AUC 评价二分类模型区分能力，分类指标，正确 \nD.MSE均方误差是回归任务损失评估指标，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39005", "t": 2, "q": "关于梯度下降与牛顿法，描述正确的有（     ）。", "a": ["梯度下降仅使用一阶导数迭代更新参数", "牛顿法利用二阶Hessian矩阵，收敛速度更快", "梯度下降计算开销更小，适合大规模数据", "牛顿法不存在局部最优问题", "", ""], "r": "ABC", "e": "【难度】3\n【解析】考察第14章14.1 机器学习基本概念-知识点4：无约束优化算法\nA.梯度下降基于一阶梯度更新参数，正确 \nB.牛顿法引入二阶曲率信息，迭代步数更少，收敛更快，正确 \nC.梯度下降无需计算Hessian矩阵，开销更低，适配大数据，正确 \nD.牛顿法同样会陷入局部最优，无全局最优保证，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39006", "t": 2, "q": "属于深度学习正则化、缓解过拟合的手段有（     ）。", "a": ["Dropout", "L_2权重衰减", "数据增强", "ReLU激活函数", "", ""], "r": "ABC", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点6：过拟合与欠拟合\nA.Dropout随机屏蔽神经元，抑制过拟合，正确 \nB.L_2正则限制权重大小，降低模型复杂度，正确 \nC.扩充训练样本，减少噪声带来的过拟合，正确 \nD.ReLU仅引入非线性，无正则化作用，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39007", "t": 2, "q": "下列属于监督学习算法的是（     ）。", "a": ["逻辑回归", "决策树", "随机森林", "K-Means", "", ""], "r": "ABC", "e": "【难度】2\n【解析】考察第14章14.2 监督与无监督学习-知识点1：无监督学习算法\n&A、B、C：逻辑回归、决策树、随机森林均需要标签训练，监督学习，正确 \nD.K-Means聚类无标签，无监督学习，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39008", "t": 2, "q": "强化学习的核心组成要素包含（     ）。", "a": ["智能体Agent", "环境Environment", "奖励RewArD ", "标签LABel", "", ""], "r": "ABC", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点2：机器学习三大范式-强化学习基础构成\n&A、B、C：智能体、环境、奖励是强化学习三大核心要素，正确 \nD.标签是监督学习独有，强化学习不需要标注标签，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39009", "t": 2, "q": "下列关于KNN算法说法正确的有（     ）。", "a": ["无需提前训练模型，惰性学习算法", "预测速度随样本量增大而变慢", "高维特征下距离度量容易失效", "属于无监督聚类算法", "", ""], "r": "ABC", "e": "【难度】3\n【解析】考察第14章14.1 机器学习基本概念-知识点9：经典监督学习算法-KNN特性\nA.KNN无训练过程，预测时遍历样本，惰性学习，正确 \nB.样本越多，距离计算量越大，预测变慢，正确 \nC.高维空间样本距离趋同，距离度量失效，正确 \nD.KNN是带标签监督分类/回归算法，不是聚类，错误", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39010", "t": 2, "q": "下列操作会造成模型泛化能力变差的是（     ）。", "a": ["使用测试集数据调整超参数", "训练样本数量过少", "对模型施加L_1正则", "模型结构设计过于复杂", "", ""], "r": "ABD", "e": "【难度】3\n【解析】第14章14.1 机器学习基本概念-知识点6：过拟合与欠拟合-泛化能力、过拟合、数据集划分规范\nA.测试集调参造成数据泄露，泛化评估失真，泛化变差，正确 \nB.样本过少，模型容易学习噪声，过拟合，泛化差，正确 \nC.L_1正则抑制过拟合，提升泛化能力，错误 \nD.模型过于复杂极易过拟合，泛化能力下降，正确", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39011", "t": 3, "q": "泛化能力指模型在训练数据集上的预测准确率。（     ）", "a": ["正确 ", "错误", "", "", "", ""], "r": "B", "e": "【难度】1\n【解析】考察第14章14.1 机器学习基本概念-知识点2：机器学习三大范式-泛化能力定义\n泛化能力是模型对未知全新数据的预测性能，而非训练集，表述错误。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39012", "t": 3, "q": "K-Means聚类属于无监督学习，不需要样本标签。（     ）", "a": ["正确 ", "错误", "", "", "", ""], "r": "A", "e": "【难度】1\n【解析】考察第14章14.2 监督与无监督学习-知识点1：无监督学习算法-K-Means\nK-Means依靠样本距离自动划分簇，无标签参与训练，表述正确。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39013", "t": 3, "q": "交叉熵损失函数主要用于回归预测任务。（     ）", "a": ["正确 ", "错误", "", "", "", ""], "r": "B", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念知识点5：损失函数\n交叉熵损失为分类任务专用，平方差MSE才用于回归，表述错误。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39014", "t": 3, "q": "L2正则化也叫权重衰减，可以有效缓解模型过拟合。（     ）", "a": ["正确 ", "错误", "", "", "", ""], "r": "A", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点7：正则化-L2正则特性\nL_2惩罚大权重参数，降低模型复杂度，抑制过拟合，又称权重衰减，表述正确。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39015", "t": 3, "q": "Boosting集成学习中各基决策树并行独立训练，互不影响。（     ）", "a": ["正确 ", "错误", "", "", "", ""], "r": "B", "e": "【难度】2\n【解析】考察第14章14.2 监督与无监督学习-知识点2：集成学习-Boosting与Bagging区分\nBoosting串行训练，后一棵树修正前一棵树误差；并行是Bagging随机森林，表述错误。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39016", "t": 3, "q": "疾病诊断场景中，召回率指标用于衡量漏诊样本的检出水平。（     ）", "a": ["正确 ", "错误", "", "", "", ""], "r": "A", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点8：模型评估指标-召回率业务含义\n召回率=真实正样本中被预测为正的比例，直接控制漏诊数量，表述正确。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39017", "t": 3, "q": "梯度下降法属于约束优化算法，求解时需要满足变量约束条件。（     ）", "a": ["正确 ", "错误", "", "", "", ""], "r": "B", "e": "【难度】2\n【解析】考察第14章14.1 机器学习基本概念-知识点4：无约束优化算法-梯度下降\n梯度下降仅最小化目标函数，无额外约束，属于无约束优化，表述错误。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39018", "t": 3, "q": "PCA主成分分析是无监督降维算法，能够压缩高维特征。（     ）", "a": ["正确 ", "错误", "", "", "", ""], "r": "A", "e": "【难度】2\n【解析】考察第14章14.2 监督与无监督学习-知识点1：无监督学习算法-PCA\nPCA无标签，通过正交变换保留最大方差实现特征降维，表述正确。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39019", "t": 3, "q": "测试集数据可以参与超参数调优，能提升模型泛化性能。（     ）", "a": ["正确 ", "错误", "", "", "", ""], "r": "B", "e": "【难度】3\n【解析】考察第14章14.2 监督与无监督学习-知识点2：集成学习-数据集划分规则\n测试集参与调参会造成数据泄露，评估结果失真，泛化能力评估不可靠，表述错误。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}, {"id": "39020", "t": 3, "q": "牛顿法利用二阶Hessian矩阵迭代，收敛速度比梯度下降更快，但计算开销更大。（     ）", "a": ["正确 ", "错误", "", "", "", ""], "r": "A", "e": "【难度】3\n【解析】考察第14章14.1 机器学习基本概念-知识点4：无约束优化算法-梯度下降、牛顿法对比\n牛顿法引入二阶曲率信息，迭代步数更少；Hessian矩阵求解计算成本高，表述正确。", "l3": "数学", "l4": "第14章", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = !!ans;
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
