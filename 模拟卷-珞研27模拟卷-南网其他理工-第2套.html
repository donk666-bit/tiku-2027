=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">最适合做这段文字标题的是（）。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">让火星宜居转化为现实还要走多远<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">人类提高火星整体温度的全新尝试<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">二氧化硅气凝胶或让火星变得宜居<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">火星的局部地区性改造需要新思路<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】文段首先指出人们一直梦想着重塑火星气候，使其适合人类居住，但一直不能实现；然后介绍研究人员提出一种在火星局部进行的新方法，即在火星表面区域添加一层薄薄的二氧化硅气凝胶，并对这个新方法的优势展开详细论述；最后专家表示这种方法相对容易实现。由此可知，文段主要说明的是为了使火星气候适宜居住，研究人员提出了重塑火星气候的新方法，即在火星表面区域添加二氧化硅气凝胶，该方法具有较强的可行性。标题应体现这一内容，<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项表述与此一致。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A<font face=\"宋体\">项错误，<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">转化为现实还要走多远<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">文段未提及，且该项未提及关键词<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">二氧化硅气凝胶<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，作为标题不恰当，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B<font face=\"宋体\">项错误，文段介绍的是一种在火星局部进行的新方法，<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">提高火星整体温度<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">与文段内容相悖，作为标题不恰当，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D<font face=\"宋体\">项错误，文段表达的是为了使火星气候适合人类居住，研究人员提出了在局部进行的新方法，而该项并未具体指出这一方法，且其主要强调火星的局部改造需要新思路，未体现<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">适宜人类居住<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">故本题选<\/font>C<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf63e297b8f68xcljsc969635", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">某市电视台推出了一个面向老年观众的养生节目。这个节目在试播时组织了许多老年人观看，获得一致好评。但在正式播出后，收视率非常不理想。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下最能够解释上述矛盾现象的一项是：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">一些老年人认为节目内容对于养生作用不大<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">节目的包装过于娱乐化，与老年人的需求不符<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">看电视时间过长不利于老年人的身体健康<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">节目播出时间过晚，此时大多数老年人已经休息<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】题干要解释的是试播时期的好评与播出后收视率不理想的矛盾，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项说明是由于选择的播出时段不适合老年人观看，从而影响了收视率，解释了这一矛盾；<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\"> y:'Times New Roman';\r\nfont-size:11.0000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><b><span style=\"font-family:宋体;font-weight:bold;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">奇数项：<\/font><font face=\"Times New Roman\">3<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">6<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">11<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">18<\/font><font face=\"宋体\">→一级差为<\/font><font face=\"Times New Roman\">3<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">5<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">7<\/font><font face=\"宋体\">（公差<\/font><font face=\"Times New Roman\">2<\/font><font face=\"宋体\">的等差数列），下一项差<\/font><font face=\"Times New Roman\">=9<\/font><font face=\"宋体\">→<\/font><font face=\"Times New Roman\">18+9=27<\/font><font face=\"宋体\">；偶数项：<\/font><font face=\"Times New Roman\">-5<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">-9<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">-15<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">-23<\/font><font face=\"宋体\">→规律独立，不影响奇数项答案<\/font><\/b><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "数字推理"}, {"id": "18caf63e299a13e9xcpdsc793914", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">从社会治理的角度看，占用消防通道的行为之所以屡禁不止，除了违法者缺乏公共安全观念、对生命和法律缺乏敬畏以及监管不到位等因素之外，也有停车难的深层原因。随着我国汽车保有量的不断攀升，一些居民区逐渐面临停车位紧缺的问题。这也是一些地方占用消防通道的现象反复出现，治理举措管得了一阵子，却无法管长期、管根本的原因所在。就此而言，保持消防通道畅通、有效解决停车难题，既要管要堵，更要疏要导，这考验着基层社会治理的有效性和精准度。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">这段文字接下来最可能讲的是：（）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">加大处罚力度、提高违法成本等措施<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">在纾解停车难问题上进行的有益探索<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">占用消防通道现象反复出现的原因<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">探讨停车难问题的深层次原因<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】文段首先指出占用消防通道的行为屡禁不止的深层原因是停车难；然后介绍了停车位紧缺问题是一些地方占用消防通道的现象难治理的根本原因所在；最后以“就此而言”进行总结，针对如何解决停车难问题提出建议，即“要管要堵，更要疏要导”。尾句针对停车难问题提出建议，下文应继续围绕此话题展开论述。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项未提及停车难的问题，且“加大处罚力度，提高违法成本”与尾句“要管要堵，更要疏要导”的建议不符，与文段衔接不恰当，排除。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项，“在纾解停车难问题上进行的有益探索”与文段尾句话题衔接恰当，当选。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项，“占用消防通道现象反复出现的原因”在文段已有论述，属于本文信息，排除。<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项，“探讨……原因”与尾句论述的如何解<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">决问题的观点衔接不当，排除。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e299a13e8xcpdsc130768", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">大脑中有许多不同类型的细胞，例如传递信号的神经元和支持神经功能的神经胶质细胞。尽管所有这些细胞都包含相同的基因组，但不同类型的细胞表达这些基因的方式不同。通俗来说，人们可以将基因组想象成钢琴上的<\/font>88<font face=\"宋体\">个键，每个细胞使用的都并非全部琴键，因此每个细胞<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">弹奏<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">的那部分琴键决定了细胞的类型下丘脑是包括人类在内的所有脊椎动物大脑的基本区域。研究表明，下丘脑内一个特定的区域腹膜下丘脑的腹侧部分，包含控制侵略行为的细胞。在这些研究中，即使在没有任何威胁的情况下，对雄性和雌性小鼠脑中这些神经元进行强刺激，都会使它们立即变得具有攻击性。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">这段文字主要讲的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">人类下丘脑包含控制侵略的细胞<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">不同的大脑细胞类型具有特定的功能<\/font><span style=\"font-family:'Times New dsc023068", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">晨练是一种好习惯，但未必人人适合。从人的生理特点来看，早上<\/font><font face=\"Times New Roman\">6<\/font><font face=\"宋体\">点左右，人体的血压开始升高，心率逐渐加快，上午<\/font><font face=\"Times New Roman\">10<\/font><font face=\"宋体\">点左右达到峰值，如果有冠心病、高血压的人此时锻炼，尤其是进行剧烈运动，就有可能发生意外。清晨<\/font><font face=\"Times New Roman\">6<\/font><font face=\"宋体\">点到<\/font><font face=\"Times New Roman\">8<\/font><font face=\"宋体\">点，人体血小板的凝聚力明显增强，血液相对黏稠，这段时间运动可能会使心脑血管梗塞率增大。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">这段文字意在强调：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">（）。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">晨练总的来说还是弊大于利<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">晨练不宜选在<\/font><font face=\"Times New Roman\">6<\/font><font face=\"宋体\">至<\/font><font face=\"Times New Roman\">8<\/font><font face=\"宋体\">点之间<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">晨练应尽可能避免剧烈运动<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">晨练时间和强度要因人而异<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont- -height:150%;font-size:10.5000pt;\"><font face=\"宋体\">宅经济指的是在家中上班、办公或在家中从事商务工作的一种新经济形势。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，下列除哪项外均属于宅经济？（）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">经济环境紧张之后，某甲难以找到工作，于是在家里帮助老婆照看孩子，同时精心打理自家果园<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">因疫情期间诊所关闭，牙科医生某丁在家中利用微信群为有需要的病患提供相关咨询服务，赚了不少红包<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">在餐馆工作的厨师某丙，在家时录制烘焙教学视频并在某平台发布，由于获得了较高的点击播放量，<\/font><font face=\"Times New Roman\">5<\/font><font face=\"宋体\">天时间挣了<\/font><font face=\"Times New Roman\">800<\/font><font face=\"宋体\">元<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">路途酷热难耐，在软件公司上班的某乙不想出门，他开发了一个协同软件，他和他的团队在家中就可以完成公司的开发任务<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">答案】<\/font>A<font face=\"宋体\">【解析】宅经济定义的关键信息：在家中上班、办公或从事商务工作。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\  style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">近期一项调查显示，吃辣跟死亡率之间存在着某种关联。对将近<\/font>20<font face=\"宋体\">万名<\/font><font face=\"Times New Roman\">60<\/font><font face=\"宋体\">岁以上的男性、<\/font><font face=\"Times New Roman\">29<\/font><font face=\"宋体\">万名<\/font><font face=\"Times New Roman\">60<\/font><font face=\"宋体\">岁以上的女性平均七年随访数据说明，相比饮食最为清淡，即平均每周吃辣不到一次的人来说，每周吃了三次以上的人死亡率降低了<\/font><font face=\"Times New Roman\">14%<\/font><font face=\"宋体\">，一，而且这一趋势在女性中更为明显，死亡率降低最多竟达<\/font><font face=\"Times New Roman\">22%<\/font><font face=\"宋体\">。另外，相比于干辣椒、辣椒油或辣椒酱，吃新鲜辣椒的人死亡率降低更为明显。这说明吃辣可以降低死亡率。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能削弱上述结论？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">正是因为被调查者身体健康，在饮食上才没有太多禁忌<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">被调查者中，女性吃辣的能力明显低于男性<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">新鲜辣椒所含辣椒素更丰富<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">科学研究发现辣椒素有利于缓解疼痛和降低血压<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-heigh t-size:10.5000pt;\">B.<font face=\"宋体\">李先生、赵先生、孙先生、钱先生<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">李先生、孙先生、赵先生、钱先生<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">孙先生、李先生、赵先生、钱先生<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>A<font face=\"宋体\">【解析】由<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">和<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">可知，孙先生和李先生不可能同时是第一名和第三名，排除<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项；由<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">和<\/font><font face=\"Times New Roman\">③<\/font><font face=\"宋体\">可知，孙先生和李先生都不是第二名，排除<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">两项。故答案选<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e299a13e9xcyjsc224728", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">大数据时代，正是通过挖掘个人选择偏好、生活轨迹、金融信用等数据，把握社会整体的需要、供给和趋势，进而更好地造福社会。有了大数据，企业可以据此实现颠覆式创新，创造个性化、定制化的产品。政府部门可以据此提高治理效能，相关政策可以更好辨证施治。对于个人而言，大数据带来的是更方便、更精准、更有效率。可以说<\/font><font face=\"Times New Roman\">________________<\/font><font face=\"宋体\">，正在成为现代社会最重要的进步动力之一。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">填入画横线部分最恰当的一项是：（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">大数据使得统计上显著的相关关系越来越多<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">大数据日益改变着人类日益普及的网络行为<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">大数据利用信息技术创造持久有力的竞争优势<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">大数据将信息从知识的载体进化为智慧的源泉<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】由“更好地造福社会”“正在成为现代社会最重要的进步动力之一”可知，文段高度赞扬了大数据对社会的积极影响。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项指出大数据使关系越来越多，<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项指出大数据改变了人类的网络行为，二者均无法与“社会进步”构成因果关系，排除。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项的“竞争优势”主要针对企业而言，未体现大数据对政府、个人的影响，排除。<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项的“智慧的源泉”与“最重要的进步动力之一”构成呼应，填入句中衔接恰当。故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e298ad1a8xclbsc690306", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">锦上添花：雪上加霜<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">美不胜收：目不暇接<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">耀武扬威：弃甲曳兵<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">水滴石穿：磨棒成针<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">雨后春笋：每况愈下<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>B<font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">本题考察反义词关系及成语知识积累。由反义词关系可迅速排除<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">选项。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">选项耀武扬威和弃甲曳兵说得意和失意。<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">选项雨后春笋比喻新生事物迅速大量地涌现出 种则是家长感觉到自己教育孩子出现了问题，宁愿将孩子送出去教育，也不从自己的教育理念上找原因，这实际上是一种推脱责任的表现<\/font><font face=\"Times New Roman\">;<\/font><font face=\"宋体\">此外还有来源于白领阶层日常工作模式中铸就的“自我实现”价值观，使年轻的父母在教育孩子过程中过于焦虑，这也是导致培训班火热的原因。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">接下来最可能讨论的是：（）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">选择情商培训班的方法<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">儿童情商培训现在的状态<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">如何理性认识情商培训<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">情商教育对孩子成长的重要意义<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">【解析】由“当下，越来越多的家长逐渐意识到情商的重要性”可知，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项关于情商教育对孩子成长意义的介绍应在前文论述，属于前文信息，排除。由“一年动辄几万的学费也挡不住他们的热情”可知，<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项儿童情商培训现在的火热状态文中已有介绍，属于本文信息，排除。文段首先介绍了许多家长对于儿童情商培训的热衷现象，然后对引发这一现象的原因进行了分析。由“这实际上是一种推脱责任的表现”“年轻的父母在教育孩子过程中过于焦虑”等表述可知，家长对待情商教育的态度不够理性。因此下文最有可能就如何理性认识情商培训进行论述，<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项与文段衔接更加紧密。所以本题答案选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e297b8f68xcljsc022094", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">一些研究发现，女性相对于男性不仅在识别脸部的能力方面更好，而且在观察脸部时，大脑中与面部识别相关的区域具有更强的反应，在这些区域中有更密集的细胞组织。这些发现似乎印证了一个观点：一般情况下，女性比男性更擅长认人。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能削弱上述观点？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">参加实验的男性平均年龄为<\/font><font face=\"Times New Roman\">30<\/font><font face=\"宋体\">岁，高出女性平均年龄<\/font><font face=\"Times New Roman\">2<\/font><font face=\"宋体\">岁<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">一般来说，女性更注重细节，因此对于人的面孔的特征，女性观察得更为细致<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">男性在识别人的面孔时速度较慢，但在时间充足的情况下有更准确的识别率<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">在一些类似刑侦的特殊职业中，男性与女性在识别面孔的表现中没有显著差别<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】题干观点是，一般情况下，女性比男性更擅长认人。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项仅说明参加实验的男性平均年龄高于女性，并没有体现年龄和擅长认人之间的关系，无法削弱题干观点；<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项说明女性比男性在观察人的面孔时更为细致，一定程度上支持了题干观点；<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项说明男性比女性的识别率更准确，只不过速度较慢，直接质疑了题干观点；<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项属于特殊现象，削弱力度有限，不如<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。故本题选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e297b8f68xcljsc594147", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">一个充电宝品牌越大、容量越大，给手机充电次数越多。<\/font>12000<font face=\"宋体\">毫安的某大品牌充电宝容量大于<\/font><font face=\"Times New Roman\">8000<\/font><font face=\"宋体\">毫安的某小品牌充电宝容量。所以，<\/font><font face=\"Times New Roman\">12000<\/font><font face=\"宋体\">毫安某大品牌的充电宝比<\/font><font face=\"Times New Roman\">8000<\/font><font face=\"宋体\">毫安某小品牌的充电宝给同一手机充电次数多。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">下列与上述推理最为类似的是：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">一个人越喜欢锻炼身体，他的身体越健康。小王比小张爱跑步，所以，小王身体比小张健康<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">钻石体积越大，它的总价越高。甲的钻石比乙的钻石体积大，因此，甲的钻石比乙的钻石贵<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">今年跳远冠军的成绩比前年跳远冠军的成绩好。张华是今年的跳远冠军，因此，他今年的跳远成绩比他前年的好<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">产品质量越高并且广告投入越多，产品需求就越大。甲公司产品质量和投入的广告费比乙公司的好且多，因此，甲公司产品的需求量比乙公司的需求量大<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】题干是前件为联言命题的充分条件假言命题，其结构为：如果<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">（品牌大）且<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">（容量大），那么<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">（充电次数多）。<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">的品牌和容量都比 <\/font><font face=\"Times New Roman\">E <\/font><font face=\"宋体\">大，即<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">满足<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">且<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">，因此<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">满足<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">，即<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">比 <\/font><font face=\"Times New Roman\">E <\/font><font face=\"宋体\">的充电次数多。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项为充分条件假言命题，其结构为：如果<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">（喜欢锻炼身体），那么<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">（身体健康）。小王比小张更喜欢锻炼身体，小王满足<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">，因此小王满足<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">，即小王比小张身体更健康。但该项推理的前件并非联言命题，与题干推理不一致。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项为充分条件假言命题，其结构为：如果<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">（体积大），那么<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">（总价高）。甲的钻石比乙的钻石体积大，甲的钻石满足<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">，因此甲的钻石满足<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">，即甲的钻石比乙的钻石总价高。但该项推理的前件并非联言命题，与题干推理不一致。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项前面比较的是今年跳远冠军和前年跳远冠军的成绩，而后面比较的是张华和他前年的成绩，明显与题干推理不一致。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项是前件为联言命题的充分条件假言命题，其结构为：如果<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">（质量高）且<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">（广告投入多），那么<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">（需求大）。甲的质量比乙好，广告投入也比乙多，甲满足<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">且<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">，因此甲满足<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">，即甲比乙需求大。与题干推理一致。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e298ad1a9xcdysc460666", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">预期社会化，是一种指向未来角色的社会学习过程，人们要学习的不是现在要扮演的角色，而是将来要扮演的角色。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，下列属于预期社会化的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">为了能出国读大学，中学生小李努力学习英语准备托福考试<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">初为人母的小张开始学习给婴儿喂奶、洗澡、换尿布等<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">为了更好的适应今后的生活，退休后的老赵开始学习太极拳和书法<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">小明的理想是当一名厨师，刚上初中就开始钻研菜谱<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">定义关键词：<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">人们要学习的不是现在要扮演的角色，而是将来要扮演的角色<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A<font face=\"宋体\">项：为了出国读大学而准备托福考试体现的是准备考试，不是将来要扮演的角色，不符合定义，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B<font face=\"宋体\">项：初为人母学习给婴儿喂奶、洗澡、换尿布是学习现在扮演的角色，不符合定义，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C<font face=\"宋体\">项：老赵在退休后开始学习太极拳和书法，是学习现在扮演的角色，不符合定义，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D<font face=\"宋体\">项：初中就学习以后想要扮演厨师的菜谱，体现了<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">学习将来要扮演的角色<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">，符合定义，当选。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">故正确答案为<\/font>D<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "定义判断"}]}, {"k": "数学", "n": "数学（14 题）", "qs": [{"id": "189cacc1286f7520gssc582627", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:9.0000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">设随机变量<\/font><img width=\"84\" height=\"24\" src=\"https://idapic.luoyanedu.com/tiku/20260315140323_t5z/10-题库文档12453.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">则随着<\/font><img width=\"15\" height=\"14\" src=\"https://idapic.luoyanedu.com/tiku/20260315140323_t5z/10-题库文档12483.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">的增大，<\/font><img width=\"84\" height=\"24\" src=\"https://idapic.luoyanedu.com/tiku/20260315140323_t5z/10-题库文档12513.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;&nbsp font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">2<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:110%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\"><font face=\"宋体\">三相星形接线的电源或负载的线电压是相电压的<\/font><img width=\"22\" height=\"22\" src=\"https://idapic.luoyanedu.com/tiku/20260315122251_6so/3-答案文档5267.png\"><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\"><font face=\"宋体\">，线电流与相电流相等，答案选【<\/font>A<font face=\"宋体\">】。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\">", "l3": "电工技术", "l4": "2027南网电工技术第3章"}, {"id": "189cace056737420dgjssc807810", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">列网孔电流<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">方程<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">时，对电路中电源的处理正确的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">有伴电压源需等效成有伴电流源代到方程中<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">当无伴电压源不属于两个网孔共有时，该网孔电流为已知量，可省去一个<\/font>KVL<font face=\"宋体\">方程<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">若电路中含有受控源，可将该受控源看作独立电源，再将该受控源的控制量用网孔电流表示<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">若存在无伴电流源，将与其串联的元件（如果有）直接略去后正常处理<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:110%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\"><font face=\"宋体\">有伴电压源不需要等效成有伴电流源代到方程中；当无伴电流源不属于两个网孔共有时，则该网孔电流为已知量，可省去一个<\/font>KVL<font face=\"宋体\">方程；在回路电流法中，若存在无伴电流源，与其串联的元件（如果有）不能直接略去。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\"><font face=\"宋体\">答案选【<\/font>C<font face=\"宋体\">】。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\">", "l3": "电工技术", "l4": "2027南网电工技术第2章"}, {"id": "189cace35543c660dgjssc234108", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">已知某用电设备的复阻抗<\/font><i><span style=\"font-family:'Times New Roman';\r\nfont-style:italic;font-size:10.5000pt;\">Z<\/i><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">=<font face=\"宋体\">（<\/font><font face=\"Times New Roman\">3+<\/font><i><span style=\"font-family:'Times New Roman';\r\nfont-style:italic;font-size:10.5000pt;\">j<\/i><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">4<font face=\"宋体\">）<\/font><font face=\"Times New Roman\">Ω<\/font><font face=\"宋体\">，则其功率因数<\/font><font face=\"Times New Roman\">λ<\/font><font face=\"宋体\">为（）。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">0.5<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">0.6<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">0.8<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">1<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:110%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\"><font face=\"宋体\">由题可得阻抗模为<\/font>5Ω<font face=\"宋体\">，根据<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">阻抗三角形<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\"><font face=\"宋体\">可得功率因数<\/font><font face=\"Times New Roman\">λ=<\/font><img width=\"33\" height=\"17\" src=\"https://idapic.luoyanedu.com/tiku/20260315122251_6so/3-答案文档4949.png\"><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\">=3/5=0.6<font face=\"宋体\">。答案选【<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">】。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\">", "l3": "电工技术", "l4": "2027南网电工技术第3章"}, {"id": "189cace35543c660dgjssc107943", "t": "1", "q": "<span style=\"font-family:宋体;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">对称三相电路中负载三角形连接时，线电流和相电流的相位关系为（）。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">A.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">相位一致<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">B.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">线电流超前相电流<\/font>90°<span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">C.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">线电流超前相电流<\/font>90°<span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">D.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">相电流超前线电流<\/font>30°<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:12.0000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:宋体;font-size:10.5000pt;\"><span style=\"font-family:Calibri;font-size:12.0000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Calibri\">D<\/font><span style=\"font-family:Calibri;font-size:12.0000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">对称三相电路中负载三角形连接时，负载相电流超前线电流<\/font>30°<font face=\"宋体\">。<\/font><span style=\"font-family:Calibri;font-size:12.0000pt;\">", "l3": "电工技术", "l4": "2027南网电工技术第3章"}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
