<script>
const DATA = {"id": "mock-36711069", "name": "珞研27模拟卷-南网其他理工-第1套", "chapters": [{"k": "行测", "n": "行测（60 题）", "qs": [{"id": "18caf63e297b8f68xcljsc022094", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">一些研究发现，女性相对于男性不仅在识别脸部的能力方面更好，而且在观察脸部时，大脑中与面部识别相关的区域具有更强的反应，在这些区域中有更密集的细胞组织。这些发现似乎印证了一个观点：一般情况下，女性比男性更擅长认人。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能削弱上述观点？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">参加实验的男性平均年龄为<\/font><font face=\"Times New Roman\">30<\/font><font face=\"宋体\">岁，高出女性平均年龄<\/font><font face=\"Times New Roman\">2<\/font><font face=\"宋体\">岁<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">一般来说，女性更注重细节，因此对于人的面孔的特征，女性观察得更为细致<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">男性在识别人的面孔时速度较慢，但在时间充足的情况下有更准确的识别率<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">在一些类似刑侦的特殊职业中，男性与女性在识别面孔的表现中没有显著差别<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】题干观点是，一般情况下，女性比男性更擅长认人。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项仅说明参加实验的男性平均年龄高于女性，并没有体现年龄和擅长认人之间的关系，无法削弱题干观点；<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项说明女性比男性在观察人的面孔时更为细致，一定程度上支持了题干观点；<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项说明男性比女性的识别率更准确，只不过速度较慢，直接质疑了题干观点；<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项属于特殊现象，削弱力度有限，不如<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。故本题选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e295d0ae8atsc811225", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">3<font face=\"宋体\">，<\/font><font face=\"Times New Roman\">7<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">17<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">43<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">113<\/font><font face=\"宋体\">，<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">A.307<span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">B.373<span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">C.417<span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">" n\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】从每行来看，前两个图形叠加得到第三个图形，叠加规律为黑<\/font><font face=\"Times New Roman\">+<\/font><font face=\"宋体\">黑<\/font><font face=\"Times New Roman\">=<\/font><font face=\"宋体\">白<\/font><font face=\"Times New Roman\">+<\/font><font face=\"宋体\">白<\/font><font face=\"Times New Roman\">=<\/font><font face=\"宋体\">黑，黑<\/font><font face=\"Times New Roman\">+<\/font><font face=\"宋体\">白<\/font><font face=\"Times New Roman\">=<\/font><font face=\"宋体\">白，由此选择<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e298ad1a8xclbsc830892", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">申请：批准<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">监督：检查<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font e-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e299a13e8xcpdsc726477", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">研究表明，进入雷云的宇宙射线，使得雷云中的空气<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">产生电离，进而便在周围产生出许多悬浮的自由电子，已在云层中的电场，则使自由电子带有更高的能量。当空气中的现有电子和水分子碰撞时，释放出更多的电子，研究者将其称之为高能量微粒的雪暴，最终产生一次<\/font><font face=\"宋体\">“逃逸崩溃”，这种放电过程就是人们所认为的闪电。<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">下列说法与原文不符的是：<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">闪电因宇宙射线而产生<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">雪暴放电过程产生闪电<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">闪电因云朵碰撞而产生<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">电子与水分子碰撞引起闪电<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】由首句<\/font><span style=\"font-family:宋体;lin "font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf63e299a13e9xcpdsc793914", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">从社会治理的角度看，占用消防通道的行为之所以屡禁不止，除了违法者缺乏公共安全观念、对生命和法律缺乏敬畏以及监管不到位等因素之外，也有停车难的深层原因。随着我国汽车保有量的不断攀升，一些居民区逐渐面临停车位紧缺的问题。这也是一些地方占用消防通道的现象反复出现，治理举措管得了一阵子，却无法管长期、管根本的原因所在。就此而言，保持消防通道畅通、有效解决停车难题，既要管要堵，更要疏要导，这考验着基层社会治理的有效性和精准度。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">这段文字接下来最可能讲的是：（）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">加大处罚力度、提高违法成本等措施<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">在纾解停车难问题上进行的有益探索<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">占用消防通道现象反复出现的原因<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">探讨停车难问题的深层次原因<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】文段首先指出占用消防通道的行为屡禁不止的深层原因是停车难；然后介绍了停车位紧缺问题是一些地方占用消防通道的现象难治理的根本原因所在；最后以“就此而言”进行总结，针对如何解决停车难问题提出建议，即“要管要堵，更要疏要导”。尾句针对停车难问题提出建议，下文应继续围绕此话题展开论述。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项未提及停车难的问题，且“加大处罚力度，提高违法成本”与尾句“要管要堵，更要疏要导”的建议不符，与文段衔接不恰当，排除。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项，“在纾解停车难问题上进行的有益探索”与文段尾句话题衔接恰当，当选。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项，“占用消防通道现象反复出现的原因”在文段已有论述，属于本文信息，排除。<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项，“探讨……原因”与尾句论述的如何解<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">决问题的观点衔接不当，排除。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e299a13e8xcpdsc973213", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">为了帮助贫困地区脱贫，长期以来，社会各界以多种形式开展帮扶，扶贫思路更加清晰，扶贫手段更加多样，文化扶贫、旅游扶贫、电商扶贫等新方式效果显著，脱贫攻坚实现换挡提速。但一些尚未脱贫的地区，因为自然条件恶劣，发展脱贫产业难度较大。要啃下扶贫的<\/font><font face=\"宋体\">“硬骨头”，还需打好科技牌。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">最适合做这段文字标题的是：<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">打好脱贫攻坚科技牌<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">啃下扶贫的“硬骨头”<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">选好脱贫攻坚新方式<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">脱贫攻坚实现换挡提速<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>A<font face=\"宋体\">【解析】文段首先指出脱贫攻坚事业实现了换挡提速，接着以<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">但<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">转折，说明一些地区因自然条件恶劣，发展脱贫产业难度大，进而提出对策，要啃下扶贫的<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">硬骨头<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，还要打好科技牌。因此<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">科技牌<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">扶贫攻坚<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">是文段的主题词，要在标题中有所体现。<\/font>A<font face=\"宋体\">项包含两个主题词，且对文段主旨概括恰当，作为标题恰当。<\/font><font face=\"Times New Roman\">B<\/ <\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"404\" height=\"170\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档1525.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/font><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">元素组成不同，且无明显属性规律，优先考虑数量规律。观察发现，题干图形均为一笔画图形，故？处应选择一个一笔画图形。<\/font>A<font face=\"宋体\">项为两笔画图形，<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项为两笔画图形，<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项为两笔画图形，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项为一笔画图形，只有<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项符合。故正确答案为<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e299a13e9xcpdsc177609", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">我国自古以农业为立国之本，历代都有许多诗人喜爱田园生活，热衷务农，甚至躬耕自资。东晋诗人陶渊明，厌恶为五斗米折腰的官宦生活，回归农村田园，在《归园田居》中写出了<\/font><font face=\"宋体\">“种豆南山下，草盛豆苗稀。晨兴理荒秽，带月荷锄归”的名句。在诗人的笔下，不仅有反映社会政治文化的诗词，还有许多咏及农村、农民、农业、农事的诗词，这些诗词或诗句，为我们提供了研究古代农村形态、生产模式、农学思想、农业科技的宝贵资料。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">这段文字接下来最可能讲的是（）。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">常写农村生活场景的诗人<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">古代诗词中体现出的农学<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">我国古代农业技术的发展<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">古诗词对现代农业的启发<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>B<font face=\"宋体\">【解析】文段首先指出我国农业的重要性；接着指出历代许多诗人都喜爱田园生活，并以陶渊明为例说明许多诗人热衷务农；最后尾句指出诗人笔下那些咏及农村、农民、农业、农事的诗词，为我们提供了研究古代农村形态、生产模式、农学思想、农业科技的宝贵资料。尾提出一个结论，按照话题一致原则，下文应围绕尾句提出的结论进行具体论述，即古代诗词中体现的农学，<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项正确。<\/font><font face=\"Times New Roman\">A<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">、<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C<font face=\"宋体\">两项没有提及关键词<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">古诗词<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，属于无关信息，排除。<\/font>D<font face=\"宋体\">项，文段尾句强调的是古诗词对古代农村、农学的启发，<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">现代农业<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">脱离<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">古代农业<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">这个话题，不可能在下文论述，排除。故本题选<\/font>B<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e297b8f68xcljsc549058", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">某市实体零售店的数量由<\/font>2013<font face=\"宋体\">年的<\/font><font face=\"Times New Roman\">3800<\/font><font face=\"宋体\">家，增加到了<\/font><font face=\"Times New Roman\">2017<\/font><font face=\"宋体\">年的<\/font><font face=\"Times New Roman\">4500<\/font><font face=\"宋体\">家。但这几年来，该市实体零售店的销售额在整个零售业中所占的比例并没有增加，反而有所下降。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项为真，最不能解释上述现象？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">这几年来该市实体零售店的整体销售额显著下降<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">这几年来该市非实体零售店的整体销售额迅速增加<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">这几年来该市零售业的整体销售额有了大幅度的提升<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">这几年来该市非实体零售店数量的增长速度快于实体零售店<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】题干中的矛盾是实体零售店的数量增加，而销售额占整个零售业的比例却不升反降。由于实体零售店销售额占整个零售业的比例＝实体零售店销售额<\/font><font face=\"Times New Roman\">/<\/font><font face=\"宋体\">整个零售业销售额＝实体零售店销售额<\/font><font face=\"Times New Roman\">/<\/font><font face=\"宋体\">（实体零售店销售额＋非实体零售店销售额），<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项指出分子减少，<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项指出分母增加，均能解释该比例不升反降的现象；<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项是说零售店的数量，不涉及销售额，为无关项。故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e297b8f68xcljsc234458", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">啤酒与人类健康的关系向来受到科学家关注。由于女性的手指骨骼会最先出现骨质疏松症状，研究人员选择对她们的指骨进行超声波成像扫描。扫描结果显示，常喝啤酒的女性和不喝啤酒的女性骨密度有显著差异，前者的骨密度高于后者。所以，研究人员认为喝啤酒有助于女性预防骨质疏松。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">以下如果为真，最能削弱上述结论的是：<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">有喝啤酒习惯的女性大多喜欢参加体育运动，身体健壮，骨骼密度本来就相对较高<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">啤酒中含有的黄豆芽苷元是否能有效防止骨骼老化还有待于进一步研究<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">啤酒中的酒精不利于钙质的吸收，而缺钙容易导致骨骼发育不良<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">每天喝<\/font><font face=\"Times New Roman\">200<\/font><font face=\"宋体\">毫升啤酒的女性，其骨骼密度高于每天喝<\/font><font face=\"Times New Roman\">500<\/font><font face=\"宋体\">毫升啤酒的女性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】题干结论是“喝啤酒有助于女性预防骨质疏松”，论据是“常喝啤酒的女性和不喝啤酒的女性骨密度有显著差异，前者的骨密度高于后者”。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项说明这些女性骨骼密度高是因为喜欢运动，而不是喝啤酒，属于“另有他因”；<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项中的“老化”、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项中的“缺钙”并不等同于骨质疏松，故<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项无关；<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项中喝啤酒的多少与是否喝啤酒并不是同一概念，故不能削弱题干论证。答案选<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e297b8f69xctxsc366496", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">左边给定的是纸盒的外表面，下列哪一项能由它折叠而成？<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"554\" height=\"145\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档3287.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/font><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">A<span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">B<span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">项中右侧面上的阴影三角形与顶面的阴影不相接，错误；<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">C<span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">项，假设顶面与右侧面正确，正面的三角形应只有一边与边线重合，错误；<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">D<span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">项，正面中阴影四边形的方位错误。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">A<span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">可由题干图形折叠而成。<\/font><span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e299a13e9xcyjsc102801", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">中国的茶、饮茶方式、斗茶风气，茶具等传入日本后，逐渐与日本本土文化相结合，到了<\/font>16<font face=\"宋体\">世纪，形成了日本独特的茶文化<\/font><font face=\"Times New Roman\">——<\/font><font face=\"宋体\">茶道。<\/font><u><span style=\"font-family:宋体;line-height:150%;\r\ntext-decoration:underline;text-underline:single;font-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">。不过，日本茶道实际上是中日文化交流的结晶，如果没有中国茶树及茶文化的引入，茶道这个日本的国粹也就无从谈起了。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">填入画横线部分最恰当的一句是：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">日本原先既无茶树，也没有饮茶的习惯<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">现代日本茶道中所用的抹茶，最初就是从中国引入的<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">日本茶道数百年来持续发展，已经成为日本文化的一个象征<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">唐代，大批日本使节来到中国学习，并把中国文化带回日本<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】空缺处句子位于句中，应起到承上启下的作用。前文主要论述了中国的茶文化传人日本后形成了日本的茶道，后文以<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">不过<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">转折指出日本茶道实际上是中日文化交流的结晶。空缺处句子应承接前文<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">茶道<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">的话题，且能与后文构成转折关系。<\/font>A<font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">两项脱离了<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">茶道<\/f e=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">2<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">外观设计以产品的形状、图案和色彩等为要素，以美感目的为核心，而不去追求实用目的。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">3<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">外观设计必须适用于工业应用，这里所谓的工业应用就是指该外观设计可以通过工业手段大量复制。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，下列各项中属于外观设计的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">设计师专为某世界知名品牌的珠宝设计的绿色三叶草形包装盒<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">由某位画家手工绘制的花鸟图案的<\/font><font face=\"Times New Roman\">T<\/font><font face=\"宋体\">恤衫<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.5<font face=\"宋体\">名大学生设计的能同时供多人使用的乒乓球自动发球机<\/font><span style=\"font-family:'Times New }, {"id": "18caf63e297b8f69xctxsc960011", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性：<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"553\" height=\"228\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档1678.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/font><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】每个图形中的小圆都含有三种不同的填充方式，选项中只有<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">符合这一特征。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e297b8f68xcljsc559878", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">近期一项调查显示，吃辣跟死亡率之间存在着某种关联。对将近<\/font>20<font face=\"宋体\">万名<\/font><font face=\"Times New Roman\">60<\/font><font face=\"宋体\">岁以上的男性、<\/font><font face=\"Times New Roman\">29<\/font><font face=\"宋体\">万名<\/font><font face=\"Times New Roman\">60<\/font><font face=\"宋体\">岁以上的女性平均七年随访数据说明，相比饮食最为清淡，即平均每周吃辣不到一次的人来说，每周吃了三次以上的人死亡率降低了<\/font><font face=\"Times New Roman\">14%<\/font><font face=\"宋体\">，一，而且这一趋势在女性中更为明显，死亡率降低最多竟达<\/font><font face=\"Times New Roman\">22%<\/font><font face=\"宋体\">。另外，相比于干辣椒、辣椒油或辣椒酱，吃新鲜辣椒的人死亡率降低更为明显。这说明吃辣可以降低死亡率。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能削弱上述结论？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">正是因为被调查者身体健康，在饮食上才没有太多禁忌<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">被调查者中，女性吃辣的能力明显低于男性<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">新鲜辣椒所含辣椒素更丰富<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">科学研究发现辣椒素有利于缓解疼痛和降低血压<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>A<font face=\"宋体\">【解析】题干由调查数据得出观点：吃辣可以降低死亡率。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项指出被调查的对象身体健康，才在饮食上没有太多顾忌，即吃辣更多，因此题干的论证为因果倒置，最能削弱题干结论。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项为无关项，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项在一定程度上支持了题干结论。故答案为<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e295d0ae8atsc571774", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">7<font face=\"宋体\">，<\/font><font face=\"Times New Roman\">8<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">9<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">11<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">17<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">41<\/font><font face=\"宋体\">，<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">A.86<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">B.123<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-famil nt face=\"Times New Roman\">:41+120=161<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "数字推理"}, {"id": "18caf63e298ad1a9xcdysc545523", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">证实偏差是指无论合乎事实与否，个人都会倾向于支持自己的成见或猜想。当个人在主观上认为某种观点正确的时候，往往倾向于寻找那些能够支持这一观点的信息，而忽略掉那些可能推翻这一观点的信息。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，下列属于证实偏差的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">小陆毕业后找工作不顺利，他父母劝他考研，他明知研究生学历对找工作有帮助，他的学长研究生毕业后工作都不错，但他却说读研也一样找不到工作<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">小宋发现最近公司有人离职，还有几个同事被主管叫去谈话，他觉得公司很可能在裁员，结果第二天和人事部同事聊天，证实了这一情况<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">小赵参加了某基金会的慈善捐款，后听闻该组织存在诈捐行为，他很生气，再遇到类似的捐款时，他就很难相信<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">小林丢了一部手机，他觉得是同屋的小何拿的，再观察小何时，总觉得他说话比较含糊，行动也好像鬼鬼祟祟的，怎么看都觉得是他做的<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">答案】<\/font>D<font face=\"宋体\">【解析】证实偏差的定义要点：<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">倾向于支持自己的成见或猜想；<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">倾向于寻找那些能够支持自己观点的信息，而忽略推翻观点的信息。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项，并未体现小陆寻找支持自己观点的信息，不符合要点<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项不符合要点<\/font><font face=\"Times New Roman\">①②<\/font><font face=\"宋体\">。<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项通过寻找小何的其他行为来证实自己对其的怀疑，符合定义。故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "定义判断"}, {"id": "18caf63e298ad1a9xcdysc790953", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">排污交易权是指在一定区域内，在污染物排放总量不超过允许排放量的前提下，内部各污染源之间通过货币交换的方式相互调剂排污量，就是建立合法的污染物排放权，允许这种权利像商品那样被买入或卖出，从而达到污染物的排放控制。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，下列哪项属于排污交易？（）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">包装厂今年二氧化碳的排放量预计为<\/font><font face=\"Times New Roman\">1600<\/font><font face=\"宋体\">吨，超过了规定的<\/font><font face=\"Times New Roman\">1300<\/font><font face=\"宋体\">吨，但该厂向同区域内的电厂购买了其剩余的<\/font><font face=\"Times New Roman\">300<\/font><font face=\"宋体\">吨排放量<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">造纸厂<\/font><font face=\"Times New Roman\">2005<\/font><font face=\"宋体\">年规定排出二氧化碳的上限为<\/font><font face=\"Times New Roman\">1000<\/font><font face=\"宋体\">吨，而实际上每年排出的总量不超过<\/font><font face=\"Times New Roman\">800<\/font><font face=\"宋体\">吨，于是将剩余的<\/font><font face=\"Times New Roman\">200<\/font><font face=\"宋体\">吨二氧化碳的排放量送给了旁边的炼铁厂<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">印刷厂今年排放二氧化碳的总量为<\/font><font face=\"Times New Roman\">1300<\/font><font face=\"宋体\">吨，超过了规定的<\/font><font face=\"Times New Roman\">1000<\/font><font face=\"宋体\">吨，但该厂只向污水处理厂购买了区域内仅剩的<\/font><font face=\"Times New Roman\">200<\/font><font face=\"宋体\">吨二氧化碳的排放量<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">按照规定，轮船厂今年二氧化碳的排放总量是<\/font><font face=\"Times New Roman\">1500<\/font><font face=\"宋体\">吨，而由于业务拓展，实际排放量要达到<\/font><font face=\"Times New Roman\">2000<\/font><font face=\"宋体\">吨，于是打算购买<\/font><font face=\"Times New Roman\">500<\/font><font face=\"宋体\">吨该厂明年的二氧化碳排放量<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">在一定区域内，污染物排放总量不超过允许排放量的前提下<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">内部各污染源之间通过货币交换的方式相互调剂排污量<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A<font face=\"宋体\">项：包装厂规定有<\/font><font face=\"Times New Roman\">1300<\/font><font face=\"宋体\">吨排放量，又向同区域内的电厂购买了其剩余的<\/font><font face=\"Times New Roman\">300<\/font><font face=\"宋体\">吨，污染物排放总量没有超过允许排放量，而且是通过货币交换的方式相互调剂排污量，符合定义，当选。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B<font face=\"宋体\">项：造纸厂将剩余的<\/font><font face=\"Times New Roman\">200<\/font><font face=\"宋体\">吨二氧化碳的排放量送给旁边的炼铁厂，不是通过货币交换的方式相互调剂排污量，不符合定义，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C<font face=\"宋体\">项：印刷厂超规排放<\/font><font face=\"Times New Roman\">300<\/font><font face=\"宋体\">吨，购买了区域内仅剩的<\/font><font face=\"Times New Roman\">200<\/font><font face=\"宋体\">吨排放量，污染物排放总量仍超过允许排放量<\/font><font face=\"Times New Roman\">100<\/font><font face=\"宋体\">吨，不符合定义，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D<font face=\"宋体\">项：购买自身明年的二氧化碳排放量，只涉及自身一个污染源，不存在<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">各污染源之间<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">，不符合定义，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">故正确答案为<\/font>A<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "定义判断"}, {"id": "18caf63e297b8f69xctxsc049852", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性（）。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"425\" height=\"195\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档2375.png\"><b><span style=\"font-family:'Times New Roman';font-size:10.5000pt;\">\n \n &nbsp;\n <\/b>", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/fon 0pt;\"><font face=\"宋体\">比喻长时间保持旺盛的势头。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">炙手可热<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">比喻权势很大，气焰很盛，使人不敢接近。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">长盛不衰<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">填人符合语境，排除<\/font>D<font face=\"宋体\">。验证第一空，<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">鲜明的符号<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">搭配恰当。故本题选<\/font>A<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑填空"}, {"id": "18caf63e297b8f68xcljsc325181", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">在我们这个高速发展的社会，拆迁和建设的速度早已超出了人们的想象。而城市的发展总是伴随着城市的拆迁和建设，因此，有人认为，城市的发展是导致城市拆迁和建设的根本原因。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能削弱上述结论：<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">很少进行拆迁和建设的城市，往往都会发展得比较缓慢<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">除城市发展外，工业化也是导致城市拆迁和建设的原因<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">城市的发展过程必然会带来了很多正面的和负面的影响<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">经济发展水平的提高，促进城市发展，带动城市的拆迁和建设<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】题干论据：城市的发展总是伴随着城市的拆迁和建设。结论：城市的发展是导致城市拆迁和建设的根本原因。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项，指出很少拆迁和建设的城市，发展比较缓慢，从反面说明城市发展与城市拆迁和建设之间确实有伴随的关系，但是并没有说明城市发展与城市拆迁和建设之间是否具有因果关系，也不能确定城市的发展是否是导致城市拆迁和建设的根本原因，不能削弱题干结论，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项，指出工业化也是导致城市拆迁和建设的原因，但不能说明城市发展不是根本原因，不能削弱题干结论，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项，指出城市发展会带来正面和负面的影响，但影响是否包括城市拆迁和建设不能确定，不能确定城市的发展是否是导致城市拆迁和建设的根本原因，不能削弱题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项，指出城市发展与城市拆迁和建设都是经济发展水平提高带来的结果，说明经济发展水平的提高才是城市拆迁和建设的根本原因，削弱了题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">故答案选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e297b8f68xcljsc023068", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">基于对牙齿残骸的详细研究，科学家们发现，鳄鱼的古老种群，包括现存或已灭绝的鳄鱼的远古祖先，与今天我们所熟知的肉食性动物并不相同，已灭绝的鳄形类动物拥有更复杂的牙齿，因此，它们很有可能是植食性动物。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，不能支持上述结论？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">现存的鳄鱼是肉食性动物，有着相对简单的圆锥形牙齿<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">肉食性动物有着简单的牙齿，而植食性动物的牙齿更加复杂一些<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">在哺乳动物和爬行动物身上都发现了饮食习惯与牙齿形成的对应特征<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">已经灭绝的鳄形类动物比已经灭绝的植食性恐龙的牙齿结构更简单<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【解析】思路点拨：本题要求选择不能支持题干结论的一项，需首先明确题干的论证结构，找到论据和结论。题干结论为<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">因此<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">后面的内容，其他内容为论据。要支持该结论，只需说明牙齿的复杂程度和动物的饮食习惯之间的关系即可。在分析选项时，如果是支持项则排除，剩余的就是正确答案。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">完整【解析】题干论据：与今天我们所熟知的肉食性动物并不相同，已灭绝的鳄形类动物拥有更复杂的牙齿。题干结论：已灭绝的鳄形类动物可能是植食性动物。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">A<font face=\"宋体\">项，指出现存的肉食性鳄鱼有着相对简单的圆锥形牙齿，而已灭绝的鳄形类动物的牙齿更复杂，因此已灭绝的鳄形类动物与现存的鳄鱼饮食习惯可能并不相同，其可能是植食性动物，可以支持题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">B<font face=\"宋体\">项，指出植食性动物的牙齿比肉食性动物的牙齿结构更加复杂一些，而已灭绝的鳄形类动物拥有更复杂的牙齿，因此已灭绝的鳄形类动物可能是植食性动物，可以支持题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">C<font face=\"宋体\">项，指出在哺乳动物和爬行动物身上都发现了饮食习惯与牙齿的特征相关，说明通过牙齿特征可以判断动物的饮食习惯，在论据和结论之间建立了联系，可以支持题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">D<font face=\"宋体\">项，指出已经灭绝的鳄形类动物比已经灭绝的植食性恐龙的牙齿结构更简单，但已经灭绝的植食性恐龙的牙齿结构和饮食习惯的关系无法得知，无法进行判断，不能支持题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">故本题选<\/font>D<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e299a13e8xcpdsc634335", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">很多书法名篇其实都是书写的诗文草稿，书写者心中吞吐珠玉，笔下挥墨成文。颜真卿所书《祭侄文稿》，国恨家仇郁结于胸，一注笔端，写至最后已无意点画，满腔愤懑倾泻而下，文辞沉郁痛切，书法润后复枯，这正是作者的情感达于文辞、形诸笔墨的结果。而《兰亭序》则是作者信笔拈来，盎然之意形成了流转丰美的文辞表达，书法也形成一种灵动晓畅、节奏鲜明的特色。情势之不同，影响着文辞的表达，同时也影响了用笔的力量与笔势，这赋予书法以生命的气息，形成了各不相同的书法风格。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">这段文字意在强调（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">书法家首先要精于诗文创作<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">书法家的心理状态会影响作品风格<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">书法创作上反对理性化的刻意安排<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">《祭侄文稿》和《兰亭序》异曲同工<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>B<font face=\"宋体\">【解析】文段首先指出很多书法都是书写的诗文草稿；接着用颜真卿的《祭侄文稿》和《兰亭序》两个书法作品举例说明书法作品的写成源于作者情感的表达；最后总结指出情势之不同，影响着文辞的表达、用笔的力量与笔势，这赋予了书法生命的气息，使其书法风格各不相同。故文段意在强调的是书法家的心理状态对作品风格的影响。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项与此相符。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项强调书法家的必备素质，偏离重点，排除。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">理性化的刻意安排<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">无中生有，排除。<\/font>D<font face=\"宋体\">项只是举的例子，非文段重点，排除。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf63e298ad1aaxcxcsc806795", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">楹联堪称我国传统文化的一大精粹。在浩瀚的<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">联海<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">中，有关清廉为官的对联<\/font><u><span style=\"font-family:宋体;line-height:150%;\r\ntext-decoration:underline;text-underline:single;fo       <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
</html>
