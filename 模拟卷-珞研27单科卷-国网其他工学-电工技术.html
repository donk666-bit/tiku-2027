"><font face=\"Times New Roman\">D.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">各线圈自感系数<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "ABD", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:110%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\"><font face=\"宋体\">互感系数与线圈中的电流无关，与线圈的几何位置、空间媒质、各线圈自感系数有关。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\"><font face=\"宋体\">答案选【<\/font>ABD<font face=\"宋体\">】。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\">", "l3": "电工技术", "l4": "2027国网电工技术第3章"}, {"id": "189ce6a72d302bd4dgjssc362818", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">当开关<\/font>S<font face=\"宋体\">闭合后，电流表读数将<\/font><span style=\"font-family:宋体;line-height:110%;\r\nletter-spacing:0.0000pt;font-style:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\">\n <img width=\"235\" height=\"158\" src=\"https://idapic.luoyanedu.com/tiku/20260315142205_8qo/电工技术强化题库-题库文档8452.png\"><span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\">A.<font face=\"宋体\">减小<\/font><span style=\"font-family:宋体;line-height:110%;\r\nletter-spacing:0.0000pt;font-style:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\">B.<span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">增大<\/font><span style=\"font-family:宋体;line-height:110%;\r\nletter-spacing:0.0000pt;font-style:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\">C.<span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">不变<\/font><span style=\"font-family:宋体;line-height:110%;\r\nletter-spacing:0.0000pt;font-style:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\">D.<span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">不确定<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;\r\nfont-style:normal;font-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;font-weight:normal;\r\nfont-style:normal;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:110%;color:rgb(0,0,0);letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;color:rgb(0,0,0);letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\">C<span style=\"font-family:'Times New Roman';\r\nline-height:110%;color:rgb(0,0,0);letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;font-weight:normal;\r\nfont-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">由题可得该电路中电流恒等于电流源大小，故开关闭合后不会改变电流表读数。答案选【<\/font>C<font face=\"宋体\">】。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;letter-spacing:0.0000pt;font-weight:normal;\r\nfont-style:normal;font-size:10.5000pt;\">", "l3": "电工技术", "l4": "2027国网电工技术强化题库"}, {"id": "189ce5a5a06ffdd4dgjsmc268877", "t": "2", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">正弦电路的功率因数，下列说法错误的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">A.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">功率因数<\/font>=<font face=\"宋体\">有功功率<\/font><font face=\"Times New Roman\">/<\/font><font face=\"宋体\">复功率<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">B.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">功率因数<\/font>=<font face=\"宋体\">有功功率<\/font><font face=\"Times New Roman\">/<\/font><font face=\"宋体\">无功功率<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">C.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">功率因数<\/font>=<font face=\"宋体\">有功功率<\/font><font face=\"Times New Roman\">/<\/font><font face=\"宋体\">视在功率<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">D.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\"><font face=\"宋体\">功率因数<\/font>=<font face=\"宋体\">视在功率<\/font><font face=\"Times New Roman\">/<\/font><font face=\"宋体\">有功功率<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "", ""], "r": "ABD", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:110%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\"><font face=\"宋体\">在正弦交流电路中，功率因数满足公式<\/font><img width=\"38\" height=\"36\" src=\"https://idapic.luoyanedu.com/tiku/20260315142510_pnz/3-答案文档8497.png\"><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\"><font face=\"宋体\">，即功率因数<\/font>=<font face=\"宋体\">有功功率<\/font><font face=\"Times New Roman\">/<\/font><font face=\"宋体\">视在功率。答案选【<\/font><font face=\"Times New Roman\">ABD<\/font><font face=\"宋体\">】。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:110%;font-size:10.5000pt;\">", "l3": "电工技术", "l4": "2027国网电工技术第3章"}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
