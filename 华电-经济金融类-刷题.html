 "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650196995", "t": 3, "q": "债券的信用风险是指债券发行人无法按时支付利息和本金的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "信用风险本质上就是违约风险，对于债券而言，发行人不能按时支付利息和偿还本金就是违约。所以“债券的信用风险是指债券发行人无法按时支付利息和本金的风险”这一表述是正确的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650196996", "t": 3, "q": "工程项目投资的静态投资回收期越长，说明项目的盈利能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静态投资回收期是收回初始投资所需时间，回收期越长，意味着收回投资越慢，资金周转效率低，项目盈利能力通常越弱。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650196997", "t": 3, "q": "工程项目经济评价中，净现值（NPV）大于零，说明项目的实际收益率大于折现率，项目可行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "净现值是将项目各年净现金流量折现到基准年的现值之和。NPV＞0 意味着按给定折现率计算时，项目收益超过成本，即实际收益率高于折现率，项目在经济上可行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650196998", "t": 3, "q": "套利定价模型的核心逻辑是无套利均衡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "套利定价模型基于市场不存在套利机会的假设，通过无套利均衡原理来确定资产价格，所以核心逻辑是无套利均衡。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650196999", "t": 3, "q": "证券投资的基本面分析更适用于弱式有效市场。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "弱式有效市场中技术分析失效，但基本面分析能获取超额收益，所以基本面分析适用于弱式有效市场。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197000", "t": 3, "q": "马科维茨证券投资组合理论认为，组合的风险是单个资产风险的简单加权平均。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "马科维茨理论中，证券组合的风险不仅取决于单个资产风险及权重，还与资产间的相关性有关，并非单个资产风险的简单加权平均。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197001", "t": 3, "q": "资本资产定价模型的应用不受市场有效性的影响，即使市场非有效，也可用于资产定价。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。资本资产定价模型建立在市场有效等一系列假设基础上，市场有效性是其重要前提，若市场非有效，资产价格不能反映所有信息，该模型就难以准确用于资产定价。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197002", "t": 3, "q": "证券投资的技术分析认为，市场行为涵盖一切信息，价格沿趋势移动，历史会重演。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是技术分析的三大假设，是技术分析理论的基础。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197003", "t": 3, "q": "投资组合绩效评价的夏普比率越高，说明组合的单位系统风险带来的超额收益越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "夏普比率衡量的是单位总风险带来的超额收益，而非单位系统风险带来的超额收益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197004", "t": 3, "q": "看跌期权的买方在标的资产价格上涨时获利。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "看跌期权是指期权买方有权在约定时间以约定价格卖出标的资产。当标的资产价格上涨时，买方按约定价格卖出就会亏损，而不是获利。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197005", "t": 3, "q": "债券的凸性始终为正，说明债券价格与利率的关系曲线是向上凸的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "债券凸性一般为正，正凸性意味着债券价格 - 利率关系曲线是向上凸的，即利率下降带来的价格上升幅度大于利率上升带来的价格下降幅度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197006", "t": 3, "q": "看涨期权的内在价值永远大于零，看跌期权的内在价值可能为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "看涨期权和看跌期权内在价值都可能为零。当标的资产价格小于执行价格时，看涨期权内在价值为零；当标的资产价格大于执行价格时，看跌期权内在价值为零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197007", "t": 3, "q": "期货合约的买方和卖方都有义务在到期日履行合约，而期权合约的买方只有权利，没有义务。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "期货合约双方在到期时需按约定履行合约，期权合约买方支付权利金后有行权权利但无必须行权义务。", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197008", "t": 3, "q": "证券投资分析中，基本面分析和技术分析不能结合使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在证券投资分析里，基本面分析和技术分析各有优劣，二者结合使用能更全面地分析证券情况，为投资决策提供更可靠依据，所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197009", "t": 3, "q": "债券的久期越长，其价格对利率变动的敏感度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "久期衡量了债券价格对利率变动的敏感度，久期越长，意味着债券价格受利率波动影响越大，即对利率变动敏感度越高。", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197010", "t": 3, "q": "工程项目的内部收益率（IRR）是使NPV等于0的折现率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "内部收益率（IRR）的定义就是使项目净现值（NPV）等于0时的折现率。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197011", "t": 3, "q": "资本资产定价模型中，无风险利率通常以短期国债利率作为替代。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在资本资产定价模型里，短期国债以国家信用为担保，违约风险极低，能较好代表无风险情况，所以常以短期国债利率替代无风险利率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197012", "t": 3, "q": "工程项目的基准收益率越高，项目的净现值（NPV）越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "净现值NPV与基准收益率成反向关系，基准收益率越高，NPV越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197013", "t": 3, "q": "并购估值中，市盈率法适用于所有行业的企业估值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不同行业有不同的特点和发展模式，市盈率法有其局限性，并非适用于所有行业，如新兴行业、业绩波动大的行业等难以用市盈率法准确估值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197014", "t": 3, "q": "技术分析的核心假设是市场行为涵盖一切信息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "技术分析有三大假设，“市场行为涵盖一切信息”是基础假设，是技术分析的核心，它认为市场所有影响价格的因素最终都会反映在市场行为中。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197015", "t": 3, "q": "单因子套利定价模型的核心因子是市场组合收益率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197016", "t": 3, "q": "期货合约的交易双方都必须缴纳保证金。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "期货交易实行保证金制度，无论买方还是卖方都需缴纳保证金，以确保合约的履行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197017", "t": 3, "q": "期货合约的交割方式只有实物交割一种。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "期货合约交割方式有实物交割和现金交割两种，并非只有实物交割一种。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197018", "t": 3, "q": "并购交易中的协同效应是指并购后企业的价值大于并购前两家企业价值之和。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "协同效应就是通过并购整合使企业整体效益大于并购前各部分效益之和，即并购后企业价值大于并购前两家企业价值之和。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197019", "t": 3, "q": "债券的久期越长，其价格对利率变动的敏感度越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "债券久期与价格对利率变动敏感度正相关，久期越长，价格对利率变动越敏感。", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197020", "t": 3, "q": "债券的久期等于其剩余到期期限。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般情况下，只有零息债券的久期等于其剩余到期期限，附息债券久期通常小于剩余到期期限。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197021", "t": 3, "q": "特雷诺比率衡量的是单位非系统性风险的超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "特雷诺比率衡量的是单位系统性风险的超额收益，而非单位非系统性风险的超额收益。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197022", "t": 3, "q": "基金投资中，ETF基金的交易价格始终等于其基金净值，不会出现折价或溢价。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "ETF基金交易价格会受市场供求关系影响，可能与基金净值出现偏离，会有折价或溢价情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197023", "t": 3, "q": "指数基金的投资目标是超越标的指数的收益率，通过主动选股和择时获得超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "指数基金以跟踪标的指数为目标，追求与标的指数收益率一致，是被动投资，并非主动选股和择时去超越标的指数获超额收益。", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197024", "t": 3, "q": "资本资产定价模型中，β系数为零的资产预期收益率等于无风险利率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资本资产定价模型公式为「test/yiwen_img/importSubject/2034818549440188416.png」，当「test/yiwen_img/importSubject/2034818549696040960.png」时，「test/yiwen_img/importSubject/2034818549800898560.png」，即资产预期收益率等于无风险利率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197025", "t": 3, "q": "资本资产定价模型适用于所有类型的市场，包括非有效市场。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资本资产定价模型建立在市场有效等一系列假设基础上，在非有效市场中，其假设条件不成立，所以并不适用于非有效市场。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197026", "t": 3, "q": "基金管理人的主要职责是保管基金资产。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基金管理人的主要职责是运用和管理基金资产，而保管基金资产是基金托管人的职责。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197027", "t": 3, "q": "工程项目的投资回收期越长，项目的盈利能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "投资回收期指收回初始投资所需时间，回收期越长意味着资金回笼慢，盈利所需时间久，盈利能力通常越弱，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197028", "t": 3, "q": "基金的管理费是向基金托管人支付的费用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基金管理费是支付给基金管理人的费用，用于管理和运作基金资产，并非支付给基金托管人。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197029", "t": 3, "q": "债券组合的免疫策略需要同时匹配资产和负债的久期和凸性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "债券组合免疫策略目的是使资产和负债的价值变动相互抵消，要达到较好免疫效果，需同时匹配资产和负债的久期和凸性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197030", "t": 3, "q": "资本资产定价模型中的贝塔系数为负，说明该资产的收益率与市场组合收益率呈反向变动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "贝塔系数衡量资产收益率相对市场组合收益率的变动情况，系数为负意味着资产收益率变动方向和市场组合收益率变动方向相反。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197031", "t": 3, "q": "债券的久期越长，其价格对利率变动的敏感度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "久期衡量了债券价格对利率变动的敏感性，久期越长，意味着债券价格受利率变动影响越大，即价格对利率变动的敏感度越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197032", "t": 3, "q": "工程项目投资的内部收益率（IRR）越高，说明项目的盈利能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "内部收益率是使项目净现值为零时的折现率，它反映了项目实际能达到的投资收益水平，IRR越高意味着项目在经济上更具吸引力，盈利能力越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197033", "t": 3, "q": "工程项目投资的动态评价指标考虑了资金的时间价值，比静态评价指标更科学、更全面。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "动态评价指标考虑资金时间价值，能更准确反映项目在整个寿命期内的真实经济效果，相比不考虑时间价值的静态评价指标，确实更科学、全面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197034", "t": 3, "q": "贝塔系数为负数的资产，其预期收益率低于无风险收益率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据资本资产定价模型，贝塔系数为负时，资产预期收益率与市场组合收益率反向变动，会低于无风险收益率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197035", "t": 3, "q": "资本资产定价模型中，市场组合的贝塔系数为1。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "贝塔系数衡量的是一种证券或一个投资组合相对总体市场的波动性。市场组合本身与自身波动完全同步，所以其贝塔系数设定为1。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650197036", "t": 3, "q": "证券投资的技术分析基于\"历史会重演\"的假设。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "技术分析有三大假设，“历史会重演”是其中之一，该假设认为市场参与者的心理和行为模式会重复出现，过去的价格走势和交易情况会在相似条件下再次出现，所以技术分析可借助历史数据预测未来。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第4章 投资学（2）", "n": "基础练习题【含解析】 / 第4章 投资学（2）", "qs": [{"id": "2034818562190872576", "t": 1, "q": "投资组合绩效评价的夏普比率，其计算公式为（组合收益率-无风险利率）/组合标准差，该指标衡量的是？", "a": ["单位系统风险带来的超额收益", "单位总风险带来的超额收益", "单位非系统风险带来的超额收益", "组合的绝对收益率水平", "", ""], "r": "B", "e": "夏普比率中分母是组合标准差，代表总风险，分子是组合收益率与无风险利率之差即超额收益，所以它衡量的是单位总风险带来的超额收益。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872577", "t": 1, "q": "某债券面额100元，票面利率5%，每年付息一次，剩余期限3年，市场折现率为6%，该债券的当前价格最接近（　）", "a": ["97.33元", "102.72元", "100元", "95.03元", "", ""], "r": "A", "e": "本题可根据债券定价公式计算债券当前价格。债券价格等于各期利息的现值与到期本金的现值之和。每年利息「test/yiwen_img/importSubject/2034818558655074304.png」元，本金F = 100元，市场折现率「test/yiwen_img/importSubject/2034818558860595200.png」，期限n = 3年。根据债券定价公式「test/yiwen_img/importSubject/2034818558948675584.png」，即「test/yiwen_img/importSubject/2034818559015784448.png」，计算可得「test/yiwen_img/importSubject/2034818559078699008.png」元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872578", "t": 1, "q": "资本资产定价模型中，某证券的贝塔系数为1.5，市场风险溢价为8%，无风险收益率为3%，则该证券的预期收益率为（　）", "a": ["12%", "15%", "14%", "13%", "", ""], "r": "B", "e": "根据资本资产定价模型公式：预期收益率 = 无风险收益率+贝塔系数×市场风险溢价，即3% + 1.5×8% = 15%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872579", "t": 1, "q": "下列属于系统性风险的是（　）", "a": ["公司管理层变动", "行业竞争加剧", "宏观经济衰退", "公司财务造假被曝光", "", ""], "r": "C", "e": "系统性风险是影响整个市场的风险，宏观经济衰退会影响整个市场，属于系统性风险。而公司管理层变动、行业竞争加剧、公司财务造假被曝光主要影响个别公司或行业，属于非系统性风险。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872580", "t": 1, "q": "马科维茨有效边界上的投资组合具有的特点是（　）", "a": ["相同风险下收益最低", "相同收益下风险最高", "相同风险下收益最高，相同收益下风险最低", "风险和收益均最低", "", ""], "r": "C", "e": "马科维茨有效边界是在既定风险水平下能提供最高预期收益，以及在既定预期收益水平下风险最小的投资组合的集合。所以选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872581", "t": 1, "q": "期权交易中，期权买方的最大损失是（　）", "a": ["标的资产价格与执行价格的差额", "无限大", "期权费", "标的资产的市场价格", "", ""], "r": "C", "e": "期权买方支付期权费获得权利，即便市场不利也最多损失已付期权费。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872582", "t": 1, "q": "资本资产定价模型中，贝塔系数为0的资产，其预期收益率等于（　）", "a": ["市场组合收益率", "无风险收益率", "市场风险溢价", "零", "", ""], "r": "B", "e": "资本资产定价模型公式为「test/yiwen_img/importSubject/2034818559187750912.png」 ，当「test/yiwen_img/importSubject/2034818559254859776.png」时，「test/yiwen_img/importSubject/2034818559292608512.png」 ，「test/yiwen_img/importSubject/2034818559372300288.png」是无风险收益率。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872583", "t": 1, "q": "证券投资分析中，技术分析的三大假设不包括以下哪项？", "a": ["市场行为涵盖一切信息", "价格沿趋势移动", "历史会重演", "公司价值决定价格", "", ""], "r": "D", "e": "技术分析三大假设是市场行为涵盖一切信息、价格沿趋势移动、历史会重演。公司价值决定价格是基本面分析相关理念，并非技术分析假设。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872584", "t": 1, "q": "并购估值中，现金流折现法（DCF）的核心是预测目标公司的（　）", "a": ["会计利润", "自由现金流", "销售收入", "资产负债率", "", ""], "r": "B", "e": "现金流折现法是通过预测未来的现金流并折现来评估企业价值，其核心是预测目标公司的自由现金流。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872585", "t": 1, "q": "在证券投资组合理论中，投资者仅关心投资组合的期望收益率和标准差，这种假设对应的投资者偏好特征是（　）", "a": ["风险厌恶且效用函数为二次函数", "风险中性且追求收益最大化", "风险偏好且忽视风险水平", "风险厌恶且仅关注系统性风险", "", ""], "r": "A", "e": "在证券投资组合理论里，风险厌恶投资者会关注风险与收益，二次效用函数下投资者仅关心期望收益率和标准差。B项风险中性不关注风险，C项风险偏好更重收益忽视风险，D项仅关注系统性风险不符合仅关心期望收益率和标准差。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872586", "t": 1, "q": "马科维茨证券投资组合理论中，有效前沿的核心特征是在相同风险水平下具有最高收益率，相同收益率水平下具有最低风险，其构建的关键变量不包括以下哪项？", "a": ["各证券的预期收益率", "各证券的标准差", "各证券的上市时间", "各证券间的相关系数", "", ""], "r": "C", "e": "构建有效前沿需考虑能反映收益、风险及证券间关联的变量，预期收益率体现收益，标准差衡量风险，相关系数反映证券间关联，而上市时间与有效前沿构建无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872587", "t": 1, "q": "债券的到期收益率与票面利率的关系是（　）", "a": ["当债券平价发行时，到期收益率等于票面利率", "当债券溢价发行时，到期收益率高于票面利率", "当债券折价发行时，到期收益率低于票面利率", "到期收益率与票面利率无关", "", ""], "r": "A", "e": "平价发行时，债券价格等于面值，到期收益率等于票面利率；溢价发行时，到期收益率低于票面利率；折价发行时，到期收益率高于票面利率。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872588", "t": 1, "q": "投资组合的有效边界是指（　）", "a": ["风险最低的投资组合集合", "收益最高的投资组合集合", "在给定风险水平下收益最高，或给定收益水平下风险最低的组合集合", "由所有可行投资组合构成的集合", "", ""], "r": "C", "e": "有效边界体现的是投资组合的最优状态，即在一定风险下追求最大收益，或一定收益下追求最小风险。A只强调风险最低，B只强调收益最高，D是所有可行组合集合并非有效边界。所以答案选C。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872589", "t": 1, "q": "在马科维茨证券投资组合理论中，有效边界的核心特征是（　）", "a": ["给定风险水平下收益率最低，给定收益率水平下风险最高", "给定风险水平下收益率最高，给定收益率水平下风险最低", "风险与收益率呈线性正相关", "仅考虑系统性风险的最优配置", "", ""], "r": "B", "e": "有效边界是在给定风险水平下能获得最高收益率，在给定收益率水平下风险最低的投资组合集合。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872590", "t": 1, "q": "下列关于证券投资技术分析的说法，正确的是（　）", "a": ["基于有效市场假说中的强式有效假设", "认为市场行为包含一切信息", "注重分析公司的财务指标", "不考虑历史交易数据的影响", "", ""], "r": "B", "e": "技术分析基于市场行为包含一切信息、价格沿趋势移动、历史会重演三大假设。A选项，技术分析基于弱式有效假设；C选项，注重分析公司财务指标是基本分析的内容；D选项，技术分析会考虑历史交易数据。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872591", "t": 1, "q": "电力企业的融资方式中，属于直接融资的是（　）", "a": ["向商业银行贷款", "发行企业债券", "融资租赁", "应付账款", "", ""], "r": "B", "e": "直接融资是资金供求双方直接进行资金融通。发行企业债券是企业直接向投资者募集资金，属于直接融资。而向商业银行贷款、融资租赁、应付账款都通过了金融中介等间接渠道。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872592", "t": 1, "q": "某工程项目的净现值（NPV）为正数，表明该项目（　）", "a": ["投资回报率低于基准收益率", "投资回报率高于基准收益率", "投资回收期短于行业平均水平", "内部收益率低于无风险收益率", "", ""], "r": "B", "e": "净现值为正意味着项目按基准收益率折现后收益大于成本，即投资回报率高于基准收益率。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872593", "t": 1, "q": "资本资产定价模型的核心假设不包括（　）", "a": ["投资者是风险厌恶的", "市场上存在无风险资产", "投资者具有相同的预期", "市场无交易成本和税收", "投资者可以无限卖空", ""], "r": "E", "e": "资本资产定价模型核心假设包括投资者风险厌恶、存在无风险资产、投资者预期相同、无交易成本和税收等。而无限卖空并非其核心假设。答案选E。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872594", "t": 1, "q": "期权合约中，看涨期权的买方最大损失是（　）", "a": ["标的资产的市场价格与执行价格的差额", "无限大", "支付的权利金", "标的资产的市场价格", "", ""], "r": "C", "e": "看涨期权买方支付权利金获得权利，若市场不利可不执行期权，最大损失就是支付的权利金。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872595", "t": 1, "q": "在证券投资技术分析中，\"价格沿趋势移动\"是哪一理论的核心假设（　）", "a": ["道氏理论", "波浪理论", "江恩理论", "量价理论", "", ""], "r": "A", "e": "道氏理论是技术分析的基础，其核心假设之一就是价格沿趋势移动。波浪理论主要是关于股价波动形态；江恩理论侧重时间和价格的关系；量价理论关注成交量和价格的关联。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872596", "t": 1, "q": "工程项目投资中，可行性研究阶段的经济评价重点是？", "a": ["确定项目的建设规模", "分析项目的盈利能力和偿债能力", "选择项目的建设地点", "制定项目的施工方案", "", ""], "r": "B", "e": "可行性研究阶段经济评价主要是从经济角度判断项目是否可行，重点是分析盈利能力和偿债能力。A选项确定建设规模、C选项选择建设地点、D选项制定施工方案并非经济评价重点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872597", "t": 1, "q": "开放式基金的赎回价格通常基于（　）", "a": ["基金的面值", "基金的净值", "市场供求关系", "基金的累计净值", "", ""], "r": "B", "e": "开放式基金赎回价格按基金净值计算，因为开放式基金可随时申购赎回，其交易价格主要反映基金资产的实际价值即净值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872598", "t": 1, "q": "投资组合绩效评价中的特雷诺比率，其分母是（　）", "a": ["组合标准差", "组合β系数", "无风险收益率", "市场收益率", "", ""], "r": "B", "e": "特雷诺比率公式为（投资组合收益率 - 无风险收益率）/组合β系数，分母是组合β系数。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872599", "t": 1, "q": "工程项目投资的资金来源中，属于权益资金的是？", "a": ["银行长期贷款", "发行企业债券", "企业自有资金", "融资租赁", "", ""], "r": "C", "e": "权益资金是企业所有者投入的资金。A银行长期贷款、B发行企业债券、D融资租赁都属于债务资金，企业需偿还本息。而C企业自有资金是所有者投入，属于权益资金。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872600", "t": 1, "q": "工程项目经济评价中，用于衡量项目盈利能力的动态指标是（　）", "a": ["投资回收期", "净现值（NPV）", "投资利润率", "资本金利润率", "", ""], "r": "B", "e": "投资回收期、投资利润率、资本金利润率多为静态指标，净现值是考虑资金时间价值的动态盈利能力指标。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872601", "t": 1, "q": "下列关于资本资产定价模型的应用，说法错误的是？", "a": ["可用于评估资产的合理定价", "可用于确定投资组合的预期收益率", "可用于计算资产的非系统风险", "可用于指导投资者的资产配置", "", ""], "r": "C", "e": "资本资产定价模型能评估资产合理定价、确定投资组合预期收益率、指导资产配置，但它主要衡量系统风险，而非计算非系统风险。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872602", "t": 1, "q": "根据有效市场假说，若某市场属于半强式有效，下列哪种行为无法获得超额收益（　）", "a": ["利用公司年报披露的盈利数据进行投资决策", "利用未公开的公司并购信息进行交易", "利用历史股价走势构建投资策略", "利用行业政策变动信息进行投资", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872603", "t": 1, "q": "套利定价模型中，当存在套利机会时，投资者会通过（　）来获取无风险收益", "a": ["买入低估资产，卖出高估资产", "买入高估资产，卖出低估资产", "同时买入两种相关资产", "同时卖出两种相关资产", "", ""], "r": "A", "e": "当存在套利机会，意味着资产价格出现偏离，低估资产价格低于其合理价值，高估资产价格高于合理价值。投资者买入低估资产待其价格上升，卖出高估资产待其价格下降，就能获取无风险收益。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872604", "t": 1, "q": "并购估值中，市盈率法的适用场景是（　）", "a": ["亏损企业", "盈利稳定且可比公司较多的企业", "资产密集型企业", "现金流波动较大的企业", "", ""], "r": "B", "e": "市盈率法需参考盈利和可比公司，盈利稳定且可比公司多的企业能较好运用该法。亏损企业无盈利数据，资产密集型企业更适合用资产基础法等，现金流波动大企业用现金流折现法更合适。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872605", "t": 1, "q": "马科维茨投资组合理论认为，通过分散投资可以降低的风险是？", "a": ["系统风险", "非系统风险", "市场风险", "利率风险", "", ""], "r": "B", "e": "马科维茨理论中，分散投资可降低非系统风险，它是个别公司或行业特有的风险。而系统风险、市场风险、利率风险是不可通过分散投资降低的。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872606", "t": 1, "q": "下列关于有效市场假说的表述中，正确的是（　）", "a": ["弱式有效市场中，技术分析有效但基本面分析无效", "半强式有效市场中，内幕信息无法获得超额收益", "强式有效市场中，所有公开和内幕信息都已反映在价格中", "弱式有效市场中，股价仅反映历史交易数据和公开信息", "", ""], "r": "C", "e": "有效市场分弱式、半强式和强式。弱式有效市场股价仅反映历史交易数据，技术分析无效；半强式有效市场股价反映历史数据和公开信息，内幕信息可获超额收益；强式有效市场中所有公开和内幕信息都反映在价格里。A选项弱式市场技术分析无效；B选项半强式市场内幕信息可获超额收益；D选项弱式市场只反映历史交易数据。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872607", "t": 1, "q": "套利定价模型（APT）与资本资产定价模型（CAPM）的主要区别在于？", "a": ["APT考虑多因子影响，CAPM仅考虑市场组合一个因子", "APT适用于所有投资者，CAPM仅适用于风险厌恶投资者", "APT无需假设市场有效性，CAPM必须假设市场有效", "APT可用于定价单个资产，CAPM仅能定价投资组合", "", ""], "r": "A", "e": "套利定价模型（APT）是多因素模型，考虑多个因子影响；资本资产定价模型（CAPM）是单因素模型，仅考虑市场组合这一个因子。B选项中CAPM也适用于所有投资者；C选项两者都有市场有效等假设；D选项两者都能对单个资产和投资组合定价。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872608", "t": 1, "q": "下列关于证券投资基金的说法，错误的是（　）", "a": ["基金管理人负责基金的投资运作", "基金托管人负责保管基金资产", "开放式基金的份额总额固定不变", "封闭式基金的份额在交易所交易", "", ""], "r": "C", "e": "开放式基金份额总额不固定，投资者可随时申购和赎回，所以C选项说法错误。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872609", "t": 1, "q": "并购估值中，可比公司法的核心是参考（　）确定目标公司价值", "a": ["目标公司的历史盈利", "可比公司的市场估值指标", "目标公司的未来现金流", "并购方的资金成本", "", ""], "r": "B", "e": "可比公司法就是选取与目标公司具有可比性的公司，参考其市场估值指标来确定目标公司价值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872610", "t": 1, "q": "工程项目投资中，建设期利息的计算基数是（　）", "a": ["工程费用", "工程建设其他费用", "预备费", "已投入的本金", "", ""], "r": "D", "e": "建设期利息是指项目借款在建设期内发生并计入固定资产的利息，其计算基数是已投入的本金。工程费用、工程建设其他费用、预备费是构成建设投资的部分，并非建设期利息计算基数。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818562190872611", "t": 1, "q": "下列属于工程项目经济评价中动态评价指标的是？", "a": ["投资回收期（静态）", "净现值（NPV）", "投资利润率", "资本金利润率", "", ""], "r": "B", "e": "动态评价指标考虑资金时间价值，净现值（NPV）考虑了资金时间价值，属于动态评价指标；投资回收期（静态）、投资利润率、资本金利润率未考虑资金时间价值，是静态评价指标。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999296", "t": 2, "q": "基金投资的风险包括（　）", "a": ["市场风险", "流动性风险", "管理风险", "汇率风险（QDII基金）", "", ""], "r": "ABCD", "e": "基金投资面临多种风险。市场波动会影响基金净值，存在市场风险；若基金资产难以快速变现，会有流动性风险；基金管理人的管理能力不同，会带来管理风险；QDII基金投资境外市场，会受汇率波动影响，有汇率风险。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999297", "t": 2, "q": "下列属于证券投资技术分析指标的有（　）", "a": ["移动平均线（MA）", "相对强弱指数（RSI）", "市盈率（P/E）", "随机指标（KDJ）", "", ""], "r": "ABD", "e": "技术分析指标用于分析证券价格走势等。移动平均线（MA）、相对强弱指数（RSI）、随机指标（KDJ）都是常见技术分析指标。而市盈率（P/E）是衡量股票投资价值的基本分析指标。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999298", "t": 2, "q": "下列关于有效市场假说的说法，正确的有（　）", "a": ["有效市场假说由法玛提出", "市场有效性是一个连续谱，而非绝对状态", "弱式有效市场是最低级别的有效市场", "强式有效市场在现实中普遍存在", "", ""], "r": "ABC", "e": "有效市场假说是法玛提出的，市场有效性呈连续谱，弱式有效市场是级别最低的。而强式有效市场要求市场信息完全对称且无交易成本等，现实中很难满足，并非普遍存在。所以ABC正确。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999299", "t": 2, "q": "以下属于证券投资技术分析的指标有（　）", "a": ["移动平均线", "市盈率", "相对强弱指数（RSI）", "市净率", "", ""], "r": "AC", "e": "技术分析指标是用于分析证券价格走势等的工具。移动平均线和相对强弱指数（RSI）是常见的技术分析指标，用于判断股价趋势、买卖信号等。而市盈率和市净率是基本面分析中衡量公司估值的指标。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999300", "t": 2, "q": "债券的付息方式包括（　）", "a": ["零息债券", "附息债券", "累息债券", "浮动利率债券", "", ""], "r": "ABCD", "e": "零息债券不支付利息，按面值折价发行；附息债券按约定利率定期付息；累息债券到期一次还本付息；浮动利率债券利息随市场利率变动。它们都是债券不同的付息方式。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999301", "t": 2, "q": "下列关于CAPM中β系数的说法，正确的有（　）", "a": ["β系数为1时，证券收益与市场收益同步变动", "β系数大于1时，证券为防御型证券", "β系数小于1时，证券为进攻型证券", "β系数为0时，证券无系统性风险", "", ""], "r": "AD", "e": "β系数衡量证券系统性风险，β为1，证券收益与市场同步；β大于1是进攻型证券，β小于1是防御型证券；β为0则无系统性风险。答案：AD", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999302", "t": 2, "q": "影响债券价格的因素包括？", "a": ["市场利率", "债券的票面利率", "债券的剩余期限", "债券的信用评级", "", ""], "r": "ABCD", "e": "市场利率变动会使债券价值反向变动；票面利率决定债券利息支付，影响债券吸引力；剩余期限影响债券现金流的时间分布和风险；信用评级反映债券违约风险，都对债券价格有影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999303", "t": 2, "q": "有效市场假说的三种形式包括（　）", "a": ["弱式有效", "半弱式有效", "半强式有效", "强式有效", "", ""], "r": "ACD", "e": "有效市场假说三种形式为弱式有效、半强式有效和强式有效。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999304", "t": 2, "q": "电力企业投融资的特殊性主要体现在（　）", "a": ["投资规模大，回收周期长", "对政策依赖性强", "以短期融资为主", "项目具有公益性和商业性双重属性", "", ""], "r": "ABD", "e": "电力项目建设需大量资金投入且回报慢，投资规模大、回收周期长；其发展受国家政策影响大，对政策依赖性强；同时有保障民生的公益属性和获取收益的商业属性。而电力企业通常以长期融资为主满足项目建设需求，C选项错误。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999305", "t": 2, "q": "工程项目经济评价的基准收益率确定时，需要考虑的因素有（　）", "a": ["资金成本", "投资风险", "行业平均收益率", "通货膨胀率", "", ""], "r": "ABCD", "e": "基准收益率确定需综合多方面因素。资金成本是取得资金的代价，影响基准收益率；投资有风险，需考虑风险补偿；行业平均收益率可作为参考；通货膨胀会使货币贬值，也需考虑。ABCD选项均是确定基准收益率要考虑的因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999306", "t": 2, "q": "期货、期权及衍生品市场的主要功能包括（　）", "a": ["套期保值", "价格发现", "投机", "融资", "", ""], "r": "ABC", "e": "期货、期权及衍生品市场能为企业提供套期保值工具来规避风险；通过交易集中反映供求信息实现价格发现；也允许投资者进行投机获利。而融资并非其主要功能。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999307", "t": 2, "q": "并购交易中，目标公司估值的考虑因素包括（　）", "a": ["目标公司的盈利能力", "协同效应", "行业发展前景", "目标公司的负债水平", "", ""], "r": "ABCD", "e": "目标公司估值需综合多方面，盈利能力体现其自身赚钱能力；协同效应影响并购后整体效益；行业前景关乎公司未来发展；负债水平影响公司实际价值。ABCD 都是重要考虑因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999308", "t": 2, "q": "工程项目经济评价的动态指标包括（　）", "a": ["净现值（NPV）", "内部收益率（IRR）", "投资回收期", "净年值（NAV）", "", ""], "r": "ABD", "e": "动态指标考虑资金时间价值。净现值、内部收益率、净年值都考虑了资金时间价值。投资回收期分静态和动态，这里没明确是动态投资回收期。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999309", "t": 2, "q": "并购估值分析中，常用的估值方法有（　）", "a": ["现金流折现法（DCF）", "可比公司法", "可比交易法", "资产基础法", "", ""], "r": "ABCD", "e": "在并购估值分析里，现金流折现法（DCF）通过预测未来现金流并折现来估值；可比公司法利用类似公司的指标进行估值；可比交易法依据类似交易的价格进行估值；资产基础法以企业资产价值为基础估值，这几种都是常用方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999310", "t": 2, "q": "资本资产定价模型的应用包括（　）", "a": ["估算证券的预期收益率", "确定基金的业绩评价基准", "计算证券的系统性风险", "评估企业的融资成本", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999311", "t": 2, "q": "债券投资的风险主要包括（　）", "a": ["利率风险", "信用风险", "流动性风险", "通胀风险", "", ""], "r": "ABCD", "e": "债券投资中，利率变动会影响债券价格产生利率风险；发行方可能违约产生信用风险；债券变现存在难易程度即流动性风险；通胀会使债券实际收益降低产生通胀风险。ABCD四个选项都是债券投资常见风险。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999312", "t": 2, "q": "并购估值的常用方法包括（　）", "a": ["现金流折现法（DCF）", "市盈率法（P/E）", "市净率法（P/B）", "重置成本法", "", ""], "r": "ABCD", "e": "这几种都是并购估值常用方法，现金流折现法考虑未来现金流；市盈率法用股价与每股收益关系估值；市净率法看股价与每股净资产；重置成本法评估资产重置成本。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999313", "t": 2, "q": "证券投资分析中，技术分析的局限性包括（　）", "a": ["对基本面变化反应滞后", "不适用于弱式有效市场", "无法解释突发重大事件的影响", "分析结果具有主观性", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999314", "t": 2, "q": "电力企业的绿色融资方式包括（　）", "a": ["发行绿色债券", "申请绿色信贷", "发行绿色股票", "绿色基金投资", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999315", "t": 2, "q": "资本资产定价模型中，β系数的含义包括（　）", "a": ["衡量资产的系统性风险", "反映资产收益率与市场组合收益率的相关性", "β大于1说明资产风险高于市场平均风险", "β小于0说明资产与市场组合收益反向变动", "", ""], "r": "ABCD", "e": "β系数衡量资产系统性风险，体现资产收益率与市场组合收益率相关性，β大于1资产风险高于市场平均，β小于0资产与市场组合收益反向变动。ABCD表述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999316", "t": 2, "q": "工程项目的资金来源包括（　）", "a": ["权益资金", "债务资金", "财政拨款", "融资租赁", "", ""], "r": "ABCD", "e": "工程项目资金来源主要分权益和债务两类。权益资金是所有者投入，债务资金是借入资金。财政拨款属权益资金，融资租赁属债务资金。ABCD都可作为工程项目资金来源。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999317", "t": 2, "q": "衍生品市场的参与者包括（　）", "a": ["套期保值者", "投机者", "套利者", "监管机构", "", ""], "r": "ABC", "e": "衍生品市场中，套期保值者利用衍生品规避风险，投机者通过预测价格波动获利，套利者利用价差获利，他们都是市场参与者；而监管机构是对市场进行监督管理的，并非市场参与者。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999318", "t": 2, "q": "投资组合绩效评价的常用指标有（　）", "a": ["夏普比率", "特雷诺比率", "詹森阿尔法", "贝塔系数", "", ""], "r": "ABC", "e": "夏普比率、特雷诺比率、詹森阿尔法都是衡量投资组合绩效的常用指标，贝塔系数衡量的是系统性风险，并非绩效评价指标。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999319", "t": 2, "q": "投资组合绩效评价的詹森α指标，反映的是（　）", "a": ["组合的超额收益", "组合收益率与CAPM预测收益率的差额", "单位风险的超额收益", "组合的绝对收益", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999320", "t": 2, "q": "债券组合管理的积极策略包括（　）", "a": ["利率预期策略", "免疫策略", "债券互换策略", "指数化策略", "", ""], "r": "AC", "e": "积极策略是主动寻求超越市场表现。利率预期策略通过预测利率变动调整组合；债券互换策略通过交换债券以提高收益，都属于积极策略。免疫策略和指数化策略是追求与市场同步或降低风险，属于消极策略。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999321", "t": 2, "q": "有效市场假说中，半强式有效市场的特点有（　）", "a": ["价格反映历史交易信息", "价格反映所有公开信息", "基本面分析无效", "内幕交易可能获得超额收益", "", ""], "r": "BCD", "e": "半强式有效市场中，价格能反映所有公开信息，此时依靠公开信息的基本面分析无法获取超额收益即基本面分析无效，但内幕交易可能因利用未公开信息获得超额收益。A选项是弱式有效市场特点。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999322", "t": 2, "q": "工程项目投资的静态评价指标的优点包括？", "a": ["计算简便", "无需考虑资金时间价值", "能反映项目的长期盈利能力", "便于快速决策", "", ""], "r": "ABD", "e": "静态评价指标不考虑资金时间价值，计算简单，能在短时间得出结果，利于快速决策，但不能反映长期盈利能力。A计算简便、B无需考虑资金时间价值是其特点，D便于快速决策是优点体现。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999323", "t": 2, "q": "并购估值中，可比公司法的核心步骤包括（　）", "a": ["选择可比公司", "确定估值乘数", "计算目标公司估值", "预测目标公司未来现金流", "", ""], "r": "ABC", "e": "可比公司法核心是先选可比公司，再确定估值乘数，最后据此算目标公司估值。而预测目标公司未来现金流是现金流折现法内容。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999324", "t": 2, "q": "资本资产定价模型中，贝塔系数的计算需要用到的变量包括？", "a": ["单个资产的收益率", "市场组合的收益率", "单个资产与市场组合的协方差", "市场组合的方差", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999325", "t": 2, "q": "工程项目经济评价的基本原则包括？", "a": ["效益与费用计算口径一致原则", "动态分析与静态分析相结合原则", "定量分析与定性分析相结合原则", "宏观效益与微观效益相结合原则", "", ""], "r": "ABCD", "e": "工程项目经济评价需遵循多项原则，效益与费用计算口径一致能确保评价准确性；动态结合静态、定量结合定性可全面评估项目情况；考虑宏观和微观效益兼顾不同层面利益。四个选项均是其基本原则。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999326", "t": 2, "q": "期货交易与远期交易的区别包括？", "a": ["期货合约是标准化的，远期合约是非标准化的", "期货交易在交易所进行，远期交易多在场外进行", "期货交易有保证金制度，远期交易通常无保证金制度", "期货交易的违约风险高于远期交易", "", ""], "r": "ABC", "e": "期货合约标准化、在交易所交易且有保证金制度，能降低违约风险；远期合约非标准化、多在场外交易且常无保证金制度，违约风险相对高。所以A、B、C正确，D错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999327", "t": 2, "q": "基金投资中，封闭式基金的特点包括？", "a": ["基金份额固定，在封闭期内不能赎回", "基金份额可以在交易所上市交易", "基金管理人可根据市场情况调整基金规模", "交易价格由供求关系决定，可能偏离基金净值", "", ""], "r": "ABD", "e": "封闭式基金份额固定，封闭期内不能赎回，可在交易所上市交易，交易价由供求定，可能偏离净值，其规模在封闭期固定，管理人不能调。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999328", "t": 2, "q": "电力企业的融资方式包括（　）", "a": ["银行贷款", "发行企业债券", "发行股票", "融资租赁", "", ""], "r": "ABCD", "e": "银行贷款、发行企业债券、发行股票、融资租赁都是常见的企业融资方式，电力企业也可以采用这些方式来获取资金。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818565042999329", "t": 2, "q": "下列关于期权的说法，正确的有（　）", "a": ["看涨期权的买方有权在到期日以执行价格买入标的资产", "看跌期权的卖方有义务在到期日以执行价格买入标的资产", "期权的内在价值不可能为负", "期权的时间价值随到期日临近而增加", "", ""], "r": "ABC", "e": "A选项，看涨期权买方有按执行价买资产权利；B选项，看跌期权卖方到期需按执行价买资产；C选项，内在价值最低为0，不会为负；D选项，期权时间价值随到期日临近而减少。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710784", "t": 3, "q": "有效市场假说认为，市场价格总是能准确反映所有可用信息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "有效市场假说核心观点是资产价格能迅速且充分反映所有可用信息，市场价格总体上是对资产内在价值的准确体现。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710785", "t": 3, "q": "资本资产定价模型假设市场中存在交易成本和税收。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资本资产定价模型的假设之一是市场不存在交易成本和税收等摩擦因素。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710786", "t": 3, "q": "强式有效市场下，即使是内幕信息持有者，也无法通过内幕交易获得超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "强式有效市场中，所有信息（包括内幕信息）都已反映在股价中，所以内幕信息持有者也不能通过内幕交易获超额收益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710787", "t": 3, "q": "因子模型中，因子载荷越大，证券对该因子的敏感度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在因子模型里，因子载荷反映了证券收益率对因子变动的敏感程度，因子载荷越大，意味着证券收益率受该因子变动的影响越大，即敏感度越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710788", "t": 3, "q": "衍生品的交易双方都面临无限的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "衍生品交易中并非双方都面临无限风险。比如买入看涨期权，买方最大损失是期权费，风险有限；卖方则可能面临无限风险。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710789", "t": 3, "q": "有效市场假说的强式有效形态是最理想的市场状态，现实中难以达到。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "强式有效市场意味着所有信息（包括公开和内幕信息）都已反映在股价中，投资者无法通过任何信息获取超额收益，这在现实中由于信息不对称、内幕交易等因素很难实现，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710790", "t": 3, "q": "工程项目的内部收益率（IRR）越大，说明项目的盈利能力越强，项目越可行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "内部收益率是使项目净现值为零时的折现率，IRR越大，意味着项目在经济上更具吸引力，盈利能力更强，当IRR大于基准收益率时项目可行。所以此说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710791", "t": 3, "q": "系统性风险可以通过分散投资完全消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统性风险是由整体政治、经济、社会等环境因素对证券价格所造成的影响，这种风险不能通过分散投资完全消除。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710792", "t": 3, "q": "詹森阿尔法大于零，说明投资组合的实际收益率高于资本资产定价模型预测的收益率，组合跑赢市场。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "詹森阿尔法衡量的是投资组合的实际收益率与资本资产定价模型预测收益率的差值，大于零就表明实际收益率更高，意味着组合表现优于市场。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710793", "t": 3, "q": "投资组合的夏普比率越高，说明其单位风险带来的超额收益越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "夏普比率衡量的就是投资组合在承担单位风险时所能获得的超过无风险收益的额外收益，比率越高，意味着单位风险带来的超额收益越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710794", "t": 3, "q": "并购估值的现金流折现法中，折现率通常采用企业的加权平均资本成本（WACC）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在并购估值的现金流折现法里，加权平均资本成本（WACC）考虑了债务和股权成本，能综合反映企业的融资成本，常被用作折现率来计算未来现金流的现值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710795", "t": 3, "q": "套利定价模型认为，当市场存在套利机会时，投资者会大量套利，直至套利机会消失，此时资产价格达到均衡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "套利定价模型基本原理就是市场有套利机会，投资者会进行套利操作，随着大量套利活动，套利机会不断减少直至消失，资产价格也会趋向均衡。", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710796", "t": 3, "q": "马科维茨证券投资组合理论认为，组合的风险可以完全消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "马科维茨证券投资组合理论中，组合只能分散非系统性风险，而系统性风险无法通过组合消除，所以组合的风险不能完全消除。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710797", "t": 3, "q": "指数基金的收益率通常与所跟踪的指数收益率高度相关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "指数基金以特定指数为跟踪对象，通过投资指数成分股来复制指数表现，所以其收益率通常和所跟踪指数收益率高度相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710798", "t": 3, "q": "证券投资组合的非系统性风险可以通过增加组合中证券的数量完全消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710799", "t": 3, "q": "证券投资组合的有效边界上的所有组合，其风险-收益特征都是最优的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "有效边界是在既定风险水平下收益最高，或既定收益水平下风险最低的投资组合集合，所以其风险 - 收益特征是最优的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710800", "t": 3, "q": "投资组合的特雷诺比率衡量的是单位非系统性风险带来的超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "特雷诺比率衡量的是单位系统性风险带来的超额收益，而非单位非系统性风险带来的超额收益。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710801", "t": 3, "q": "有效市场假说认为，股价是随机波动的，无法通过任何分析方法预测未来价格走势。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "有效市场假说认为市场充分反映所有信息，股价呈随机游走，技术分析和基本分析等常规方法难以预测未来价格走势。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710802", "t": 3, "q": "工程项目的净现值（NPV）小于零，表明项目一定不可行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "净现值小于零意味着项目预期收益不能弥补成本，无法达到预期的收益水平，通常项目不可行，但存在特殊情况，如考虑战略意义等因素时，即便净现值小于零项目也可能实施。不过从常规经济评价角度判断，此说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710803", "t": 3, "q": "电力企业的投融资活动不受国家能源政策的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国家能源政策会对能源行业整体进行规划和引导，电力企业作为能源行业重要组成部分，其投融资活动必然受国家能源政策影响，比如政策鼓励新能源发展，电力企业投融资会向新能源倾斜等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710804", "t": 3, "q": "电力企业的融资租赁属于权益融资方式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "融资租赁是债务融资方式，企业通过租赁获得资产使用权并支付租金，需承担债务责任，并非权益融资。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710805", "t": 3, "q": "系统性风险可以通过分散投资来完全消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统性风险是由整体政治、经济、社会等环境因素对证券价格所造成的影响，这种风险不能通过分散投资来完全消除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710806", "t": 3, "q": "期货交易实行保证金制度，投资者只需缴纳少量保证金即可参与交易，具有杠杆效应。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "期货交易确实实行保证金制度，投资者按一定比例缴纳少量保证金就能控制较大价值合约，具备杠杆效应。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710807", "t": 3, "q": "开放式基金的交易价格由市场供求关系决定，可能高于或低于基金份额净值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开放式基金交易价格一般以基金份额净值为基础，不会由市场供求关系决定出现大幅高于或低于基金份额净值情况，所以本题说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710808", "t": 3, "q": "套利定价模型（APT）不需要像资本资产定价模型（CAPM）那样严格的假设条件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "APT 对市场的假设更宽松，不像 CAPM 有众多严格假设，如投资者同质预期、市场无摩擦等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710809", "t": 3, "q": "电力企业的项目融资通常具有无限追索权。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电力企业项目融资多为有限追索权，项目贷款人仅在特定阶段或范围内对项目借款人进行追索，并非无限追索。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710810", "t": 3, "q": "半强式有效市场中，内幕信息仍可帮助投资者获得超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "半强式有效市场中，股价反映了所有公开信息，但内幕信息未被反映，掌握内幕信息的投资者能利用其获得超额收益。", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710811", "t": 3, "q": "工程项目的净现值为负数时，该项目一定不可行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "净现值为负意味着项目预期收益不能达到预定折现率要求，无法弥补初始投资成本，从经济评价角度看通常不可行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710812", "t": 3, "q": "期权的内在价值可以为负数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "期权内在价值是期权立即行权时能获得的收益，最小为0，不可能为负数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710813", "t": 3, "q": "基金的单位净值始终等于累计单位净值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基金单位净值是当前每一份基金的价值，累计单位净值是在单位净值基础上加上过往分红等收益。当基金有分红等情况时，累计单位净值会大于单位净值，并非始终相等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710814", "t": 3, "q": "证券投资的基本面分析主要关注股票的历史价格走势和成交量，以此预测未来价格变动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基本面分析主要是对宏观经济、行业和公司基本情况进行分析，包括公司经营状况、财务状况等，而关注股票历史价格走势和成交量来预测未来价格变动是技术分析的内容。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710815", "t": 3, "q": "基金的单位净值是指基金资产总值减去负债后的净资产除以基金总份额。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "基金单位净值的计算就是用基金净资产（即基金资产总值减去负债）除以基金总份额。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710816", "t": 3, "q": "CAPM中的市场风险溢价是固定不变的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "市场风险会随经济环境、市场波动等因素变化，所以CAPM中的市场风险溢价并非固定不变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710817", "t": 3, "q": "并购估值中的可比交易法是参考可比公司的当前市场估值来确定目标公司价值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "可比交易法是参考同类并购交易的价格来确定目标公司价值，而非参考可比公司的当前市场估值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710818", "t": 3, "q": "债券的价格与市场利率呈正向变动关系。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "债券价格与市场利率呈反向变动关系。市场利率上升，债券的相对吸引力下降，价格下跌；市场利率下降，债券相对更有吸引力，价格上升。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710819", "t": 3, "q": "投资组合的绩效评价仅需考虑组合的收益率大小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "投资组合绩效评价不能仅考虑收益率大小，还需考虑风险等其他因素，因为不同投资组合可能收益率相同，但承担的风险差异很大。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710820", "t": 3, "q": "开放式基金的申购价格通常等于基金资产净值加上申购费。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "开放式基金申购采用“未知价”原则，申购价格以申请当日收市后计算的基金份额净值为基础，再加上申购费。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710821", "t": 3, "q": "看涨期权的买方有权在约定时间按约定价格卖出标的资产。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "看涨期权买方有权在约定时间按约定价格买入而非卖出标的资产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710822", "t": 3, "q": "工程项目的净现值（NPV）小于0时，项目仍然可以接受。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "净现值（NPV）小于0意味着项目预期收益不能覆盖成本，经济上不可行，通常不应接受。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710823", "t": 3, "q": "开放式基金的规模是固定不变的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开放式基金可随时申购和赎回，规模会随投资者的申赎情况而变动，并非固定不变。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710824", "t": 3, "q": "电力企业的融资渠道主要以股权融资为主，债务融资为辅。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电力企业前期建设需大量资金且回报周期长，债务融资成本相对低，能满足资金需求，所以其融资渠道通常以债务融资为主，股权融资为辅。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710825", "t": 3, "q": "套利定价理论认为，当市场存在套利机会时，投资者会持续套利直到套利机会消失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "套利定价理论核心就是市场存在套利机会时，投资者会利用此机会不断套利，随着套利行为增加，资产价格变化使套利机会最终消失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710826", "t": 3, "q": "技术分析的三大假设包括\"市场行为涵盖一切信息\"\"价格沿趋势移动\"和\"投资者是理性的\"。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "技术分析三大假设是“市场行为涵盖一切信息”“价格沿趋势移动”“历史会重演”，并非“投资者是理性的”，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710827", "t": 3, "q": "弱式有效市场中，历史价格信息已充分反映在证券价格中。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "弱式有效市场假说认为，市场价格已充分反映出所有过去历史的证券价格信息，也就是历史价格信息已充分反映在证券价格中。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818567022710828", "t": 3, "q": "APT的风险因子数量必须大于CAPM。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第4章 投资学（3）", "n": "基础练习题【含解析】 / 第4章 投资学（3）", "qs": [{"id": "2034818571019882496", "t": 1, "q": "某证券的β系数为0.8，无风险收益率为3%，市场组合收益率为8%，根据CAPM，该证券的预期收益率为（　）", "a": ["7%", "6%", "8%", "11%", "", ""], "r": "A", "e": "根据CAPM公式：预期收益率=无风险收益率+β系数×(市场组合收益率 - 无风险收益率)，即3% + 0.8×(8% - 3%) = 7%。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882497", "t": 1, "q": "因子模型中，影响资产收益率的宏观经济因子不包括以下哪项？", "a": ["国内生产总值（GDP）增长率", "通货膨胀率", "公司管理层变动", "利率水平", "", ""], "r": "C", "e": "宏观经济因子是影响整个经济环境的因素，A、B、D都属于宏观经济范畴，而公司管理层变动是单个公司的微观层面因素。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882498", "t": 1, "q": "某证券的β系数为0.8，市场组合的预期收益率为12%，无风险利率为4%，根据资本资产定价模型，该证券的预期收益率应为（　）", "a": ["9.6%", "10.4%", "14.4%", "16.0%", "", ""], "r": "B", "e": "根据资本资产定价模型公式：证券预期收益率=无风险利率+β系数×（市场组合预期收益率 - 无风险利率），即4% + 0.8×(12% - 4%) = 10.4%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882499", "t": 1, "q": "债券投资中，衡量债券价格对利率变动敏感度的指标是（　）", "a": ["票面利率", "到期收益率", "久期", "凸性", "", ""], "r": "C", "e": "久期是衡量债券价格对利率变动敏感度的指标。票面利率是债券利息与票面金额的比率；到期收益率是使债券未来现金流现值等于当前价格的贴现率；凸性是对债券价格利率敏感性的二阶估计。所以选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882500", "t": 1, "q": "债券资产组合管理中，\"免疫策略\"的核心目的是（　）", "a": ["最大化组合收益率", "最小化组合流动性风险", "规避利率风险", "规避信用风险", "", ""], "r": "C", "e": "免疫策略主要是通过资产负债的恰当安排，使资产组合在利率变动时能保持价值稳定，核心就是规避利率风险。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882501", "t": 1, "q": "有效市场假说中，半强式有效市场的信息集合不包括以下哪项？（　）", "a": ["历史价格信息", "公开的财务报表信息", "内幕信息", "宏观经济数据", "", ""], "r": "C", "e": "半强式有效市场的信息集合包含历史信息和所有公开信息，A历史价格信息属历史信息，B公开财务报表信息和D宏观经济数据是公开信息。而内幕信息不包含在半强式有效市场信息集合里。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882502", "t": 1, "q": "根据资本资产定价模型（CAPM），某证券的预期收益率高于无风险收益率的部分取决于（　）", "a": ["该证券的非系统性风险和市场风险溢价", "该证券的贝塔系数和市场风险溢价", "该证券的标准差和市场组合收益率", "该证券的协方差和无风险收益率", "", ""], "r": "B", "e": "资本资产定价模型公式为「test/yiwen_img/importSubject/2034818567697993728.png」，「test/yiwen_img/importSubject/2034818567907708928.png」，即某证券预期收益率高于无风险收益率部分取决于贝塔系数和市场风险溢价「test/yiwen_img/importSubject/2034818568054509568.png」。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882503", "t": 1, "q": "根据有效市场假说，若市场达到强式有效，下列哪种行为无法获得超额收益（　）", "a": ["分析历史股价走势", "解读公司年报", "利用内幕信息进行交易", "分析宏观经济数据", "", ""], "r": "C", "e": "强式有效市场中，所有信息（包括内幕信息）都已反映在股价中，利用任何信息都无法获得超额收益。选项C利用内幕信息交易在强式有效市场也不能获取超额收益；而A分析历史股价走势（弱式有效市场就无效）、B解读公司年报、D分析宏观经济数据（半强式有效市场就无效）都不行。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882504", "t": 1, "q": "并购估值中，使用现金流折现法（DCF）时，折现率应选择（　）", "a": ["无风险收益率", "市场平均收益率", "目标公司的加权平均资本成本（WACC）", "行业平均收益率", "", ""], "r": "C", "e": "现金流折现法中，折现率要反映目标公司的资金成本和风险，目标公司的加权平均资本成本（WACC）符合这一要求。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882505", "t": 1, "q": "在两资产构成的投资组合中，当两种资产的相关系数为-1时，该组合的方差达到（　）", "a": ["最大值", "最小值", "等于两种资产方差的平均值", "等于两种资产方差的加权平均值", "", ""], "r": "B", "e": "相关系数为 -1 时，两种资产变动方向完全相反，可最大程度分散风险，使组合方差最小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882506", "t": 1, "q": "并购估值中，基于公司未来现金流折现的估值方法是（　）", "a": ["市盈率法", "市净率法", "现金流折现法（DCF）", "可比公司法", "", ""], "r": "C", "e": "选项中只有现金流折现法（DCF）是基于公司未来现金流折现来进行估值的。市盈率法是用市盈率乘以盈利估值；市净率法是用市净率乘以净资产估值；可比公司法是参考可比公司来估值。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882507", "t": 1, "q": "基金投资中，指数基金的投资策略核心是？", "a": ["主动选择被低估的股票构建组合", "复制标的指数的成分股及权重", "频繁调整组合以捕捉市场热点", "聚焦特定行业或主题的股票", "", ""], "r": "B", "e": "指数基金旨在跟踪特定指数表现，其核心就是复制标的指数的成分股及权重。A选项是主动型基金策略；C选项频繁调整不符合指数基金被动投资特点；D选项聚焦特定行业或主题并非指数基金核心投资策略。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882508", "t": 1, "q": "资本资产定价模型的假设条件不包括（　）", "a": ["投资者是价格接受者", "市场存在交易成本和税收", "所有投资者具有相同的预期", "资产可以无限分割", "", ""], "r": "B", "e": "资本资产定价模型假设市场是完美的，无交易成本和税收等摩擦因素，B选项说存在交易成本和税收不符合其假设。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882509", "t": 1, "q": "若某市场中所有公开信息都已充分反映在证券价格中，投资者无法通过分析公开信息获得超额收益，该市场符合有效市场假说的（　）", "a": ["弱式有效", "半强式有效", "强式有效", "无效市场", "", ""], "r": "B", "e": "半强式有效市场中，证券价格充分反映了所有公开信息，投资者不能通过分析公开信息获取超额收益。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882510", "t": 1, "q": "根据资本资产定价模型（CAPM），某资产的预期收益率等于无风险收益率加上（　）", "a": ["该资产的方差乘以市场风险溢价", "该资产的贝塔系数乘以市场风险溢价", "市场组合的收益率乘以贝塔系数", "该资产的标准差乘以市场风险溢价", "", ""], "r": "B", "e": "资本资产定价模型公式为：某资产预期收益率=无风险收益率+贝塔系数×（市场组合收益率 - 无风险收益率），（市场组合收益率 - 无风险收益率）就是市场风险溢价。所以某资产的预期收益率等于无风险收益率加上该资产的贝塔系数乘以市场风险溢价。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882511", "t": 1, "q": "工程项目投资中，流动资金投资属于（　）", "a": ["固定资产投资", "建设期投资", "运营期投资", "无形资产投资", "", ""], "r": "C", "e": "流动资金是在运营期用于周转的资金，所以流动资金投资属于运营期投资。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882512", "t": 1, "q": "下列关于内部收益率（IRR）的说法，正确的是（　）", "a": ["IRR是使项目净现值大于零的折现率", "IRR是使项目净现值等于零的折现率", "当IRR小于基准收益率时，项目可行", "IRR不受项目现金流量分布的影响", "", ""], "r": "B", "e": "内部收益率定义就是使项目净现值等于零的折现率；当IRR小于基准收益率，项目不可行；IRR受项目现金流量分布影响。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882513", "t": 1, "q": "有效市场假说中，若市场达到强式有效，那么投资者通过以下哪种方式无法获得超额收益（　）", "a": ["分析历史股价走势", "解读公司财务报表", "利用内幕信息进行交易", "分析行业发展趋势", "", ""], "r": "C", "e": "强式有效市场中所有信息都已反映在股价里，包括内幕信息。A项分析历史股价、B项解读财报、D项分析行业趋势获取信息都无法获超额收益，而C选项利用内幕交易在强式有效市场也不能获取超额收益。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882514", "t": 1, "q": "债券资产组合管理中的\"免疫策略\"主要目的是规避（　）", "a": ["信用风险", "利率风险", "通胀风险", "流动性风险", "", ""], "r": "B", "e": "免疫策略的核心是通过构建债券组合，使债券组合的价格波动与再投资收益的波动相互抵消，从而降低利率波动对债券组合价值的影响，主要目的是规避利率风险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882515", "t": 1, "q": "电力企业的长期投融资项目中，最常见的融资方式是？", "a": ["短期银行借款", "发行短期融资券", "发行长期债券", "商业信用", "", ""], "r": "C", "e": "长期投融资项目需长期资金，发行长期债券能满足其长期资金需求，是常见融资方式。而短期银行借款、发行短期融资券是短期融资方式；商业信用通常期限短且规模有限，不适合长期投融资。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882516", "t": 1, "q": "基金投资中，指数基金的投资策略主要是（　）", "a": ["主动选择优质股票构建组合", "复制某一指数的成分股及权重", "集中投资于某一行业龙头企业", "基于量化模型进行高频交易", "", ""], "r": "B", "e": "指数基金是被动型基金，其投资策略是复制某一指数的成分股及权重来跟踪指数表现。A是主动型基金策略；C不符合指数基金分散投资特点；D高频交易不是指数基金主要策略。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882517", "t": 1, "q": "工程项目投资中，以下哪项不属于权益资金来源？（　）", "a": ["实收资本", "资本公积", "长期借款", "盈余公积", "", ""], "r": "C", "e": "权益资金是企业所有者投入的资金，包括实收资本、资本公积、盈余公积等。长期借款是企业的债务资金，需到期偿还本息。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882518", "t": 1, "q": "开放式基金的赎回价格计算基础是（　）", "a": ["基金资产净值（NAV）", "市场供求关系", "基金份额面值", "市场利率水平", "", ""], "r": "A", "e": "开放式基金赎回价格以基金资产净值为基础计算，它反映基金真实价值。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882519", "t": 1, "q": "套利定价模型的核心逻辑是？", "a": ["投资者都是风险厌恶的", "市场存在无风险套利机会时，投资者会套利直至机会消失", "资产收益率仅由市场组合决定", "资产的价格等于其内在价值", "", ""], "r": "B", "e": "套利定价模型基于市场无套利均衡原理，当存在无风险套利机会，投资者会进行套利操作，使价格回归均衡，直至套利机会消失。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882520", "t": 1, "q": "并购估值分析中，市净率（PB）估值法适用于以下哪种类型的企业？", "a": ["资产规模较大，净资产稳定的企业", "高成长性、盈利不稳定的初创企业", "盈利稳定，现金流充沛的成熟企业", "亏损企业或无盈利记录的企业", "", ""], "r": "A", "e": "市净率是每股股价与每股净资产的比率，适合资产规模大且净资产稳定的企业，这样能较合理体现企业价值。初创企业、亏损或无盈利记录企业用市净率估值意义不大；成熟企业更常用市盈率等方法。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882521", "t": 1, "q": "资本资产定价模型中，贝塔系数为0的证券，其预期收益率等于（　）", "a": ["市场组合收益率", "无风险收益率", "市场风险溢价", "零", "", ""], "r": "B", "e": "根据资本资产定价模型公式「test/yiwen_img/importSubject/2034818568176144384.png」，当「test/yiwen_img/importSubject/2034818568272613376.png」时，「test/yiwen_img/importSubject/2034818568398442496.png」，即预期收益率等于无风险收益率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882522", "t": 1, "q": "下列关于证券投资组合风险的表述，正确的是（　）", "a": ["组合风险等于单个证券风险的加权平均", "组合风险仅取决于单个证券的风险", "适当分散投资可降低非系统性风险", "系统性风险可通过分散投资完全消除", "", ""], "r": "C", "e": "证券投资组合中，适当分散投资能降低非系统性风险，C正确。组合风险并非单个证券风险简单加权平均，还受证券间相关性等影响，A错误；组合风险不仅取决于单个证券风险，还和证券间关系有关，B错误；系统性风险不能通过分散投资完全消除，D错误。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882523", "t": 1, "q": "电力企业进行固定资产投资时，若项目建设期为2年，生产期为10年，该项目的计算期为（　）", "a": ["2年", "10年", "12年", "8年", "", ""], "r": "C", "e": "项目计算期包括建设期和生产期，本题建设期2年，生产期10年，计算期就是2 + 10 = 12年。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882524", "t": 1, "q": "工程项目投资的资金来源中，属于权益资金的是（　）", "a": ["银行长期借款", "发行企业债券", "企业自有资金", "融资租赁", "", ""], "r": "C", "e": "权益资金是企业所有者投入的资金。A银行长期借款、B发行企业债券、D融资租赁都属于债务资金，需到期偿还。C企业自有资金是企业所有者投入的，属于权益资金。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882525", "t": 1, "q": "下列选项中，不属于系统性风险的是（　）", "a": ["利率风险", "通货膨胀风险", "公司经营风险", "政策风险", "", ""], "r": "C", "e": "系统性风险影响整个市场，非系统性风险仅影响个别公司或行业。公司经营风险是特定公司自身经营状况导致的，属于非系统性风险；而利率、通货膨胀、政策风险会对整个市场产生影响，是系统性风险。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882526", "t": 1, "q": "工程项目经济评价中，净现值（NPV）大于零表明（　）", "a": ["项目的收益率低于基准收益率", "项目的收益率高于基准收益率", "项目的投资回收期短于行业平均水平", "项目的内部收益率小于零", "", ""], "r": "B", "e": "净现值（NPV）大于零，意味着项目的收益超过了按基准收益率折现的成本，即项目的收益率高于基准收益率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882527", "t": 1, "q": "套利定价模型的核心逻辑是（　）", "a": ["风险与收益成正比", "无套利均衡", "投资者是风险厌恶的", "市场组合是有效组合", "", ""], "r": "B", "e": "套利定价模型基于无套利均衡的思想，即市场不存在套利机会时资产价格达到均衡。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882528", "t": 1, "q": "套利定价模型（APT）与资本资产定价模型（CAPM）的主要区别在于（　）", "a": ["APT不考虑风险因素", "APT允许存在多个风险因子", "CAPM适用于所有市场，APT仅适用于有效市场", "APT假设投资者是风险厌恶的，CAPM无此假设", "", ""], "r": "B", "e": "套利定价模型（APT）允许存在多个风险因子来解释资产收益率，而资本资产定价模型（CAPM）主要关注市场风险这一个因子。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882529", "t": 1, "q": "以下哪种证券投资分析方法认为市场价格已反映所有历史交易信息？（　）", "a": ["弱式有效市场下的技术分析", "半强式有效市场下的基本面分析", "弱式有效市场下的基本面分析", "强式有效市场下的内幕交易分析", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882530", "t": 1, "q": "电力企业的权益融资方式不包括（　）", "a": ["发行普通股", "发行优先股", "向银行借款", "留存收益转增资本", "", ""], "r": "C", "e": "权益融资是企业通过发行股票、留存收益等方式获取资金，资金属于企业所有者权益。A发行普通股、B发行优先股、D留存收益转增资本都属于权益融资。而C向银行借款属于债务融资，不是权益融资方式。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818571019882531", "t": 1, "q": "债券投资中，久期的主要作用是衡量债券（　）", "a": ["票面利率的敏感度", "到期收益率的敏感度", "价格对利率变动的敏感度", "违约风险的大小", "", ""], "r": "C", "e": "久期是衡量债券价格对利率变动敏感度的指标。债券价格与利率呈反向变动关系，久期越大，债券价格对利率变动越敏感。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808512", "t": 2, "q": "下列属于开放式基金与封闭式基金区别的有（　）", "a": ["份额总额是否固定", "交易场所是否固定", "价格形成机制不同", "赎回限制不同", "", ""], "r": "ABCD", "e": "开放式和封闭式基金在多方面存在差异。开放式基金份额不固定可随时申购赎回，封闭式基金份额总额固定；开放式在场外交易等，封闭式多在交易所交易；开放式价格由净值决定，封闭式受供求等影响；开放式可按净值赎回，封闭式有一定限制。ABCD选项都体现了两者区别。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808513", "t": 2, "q": "下列属于系统性风险的有（　）", "a": ["利率变动风险", "通货膨胀风险", "战争风险", "公司经营风险", "", ""], "r": "ABC", "e": "系统性风险是影响整个市场的风险，不可通过分散投资消除。利率、通胀、战争会影响整个市场，属于系统性风险；公司经营风险是个别公司的，可通过分散投资降低，属于非系统性风险。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808514", "t": 2, "q": "下列属于因子模型中常见的因子的有？", "a": ["规模因子（小盘股vs大盘股）", "价值因子（低市净率vs高市净率）", "动量因子（过去涨vs过去跌）", "波动率因子（高波动vs低波动）", "", ""], "r": "ABCD", "e": "在因子模型里，规模、价值、动量、波动率等都是常见的因子，A体现规模差异，B体现价值差异，C体现动量差异，D体现波动率差异。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808515", "t": 2, "q": "电力企业项目融资的特点有（　）", "a": ["以项目未来现金流为还款来源", "融资额度大、期限长", "风险分担机制复杂", "对项目发起人信用依赖度高", "", ""], "r": "ABC", "e": "电力企业项目融资主要依据项目未来现金流还款，项目建设需大量资金且周期长，涉及多方参与使风险分担机制复杂；而项目融资更看重项目本身而非发起人信用。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808516", "t": 2, "q": "下列属于因子模型中常见风险因子的有（　）", "a": ["市场因子", "利率因子", "通胀因子", "公司规模因子", "", ""], "r": "ABCD", "e": "因子模型中，市场、利率、通胀、公司规模等都是常见风险因子。ABCD四个选项均符合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808517", "t": 2, "q": "基金的运作费用包括（　）", "a": ["管理费", "托管费", "申购费", "赎回费", "", ""], "r": "AB", "e": "基金运作费用是基金在运作过程中发生的费用，主要包括管理费和托管费。而申购费和赎回费是投资者在申购和赎回基金时支付的费用，不属于运作费用。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808518", "t": 2, "q": "资本资产定价模型的局限性包括（　）", "a": ["假设条件过于严格，与现实不符", "仅考虑市场风险一个因子", "无法解释小盘股效应、价值股效应等异常现象", "对参数估计的敏感性高", "", ""], "r": "ABCD", "e": "资本资产定价模型假设市场是完美的等，条件严苛与现实差距大；它只聚焦市场风险这一因子；对于小盘股、价值股等异常现象难以解释；且对参数估计很敏感，ABCD四个选项均是其局限性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808519", "t": 2, "q": "债券资产组合管理的策略包括（　）", "a": ["免疫策略", "指数化策略", "积极管理策略", "分散化策略", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808520", "t": 2, "q": "投资组合构建中，当增加组合中证券的数量时，以下说法正确的有？", "a": ["组合的非系统风险会逐渐降低", "组合的系统风险会逐渐降低", "组合的总风险会逐渐降低", "组合的总风险最终会趋近于市场风险", "", ""], "r": "ACD", "e": "非系统风险可通过分散投资降低，增加证券数量即分散投资，非系统风险会逐渐降低；系统风险由市场整体因素决定，无法通过增加证券数量降低；总风险包含系统和非系统风险，非系统风险降低使总风险降低，但系统风险不变，所以总风险最终趋近系统风险即市场风险。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808521", "t": 2, "q": "债券资产组合的主动管理策略包括？", "a": ["利率预期策略", "信用利差策略", "骑乘收益率曲线策略", "指数化策略", "", ""], "r": "ABC", "e": "指数化策略是被动管理策略，而利率预期策略、信用利差策略、骑乘收益率曲线策略是主动根据市场情况调整组合的策略。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808522", "t": 2, "q": "证券投资组合的非系统性风险可以通过以下哪些方式降低？（　）", "a": ["增加组合中资产的数量", "选择相关性低的资产进行组合", "集中投资于单一行业", "选择贝塔系数高的资产", "", ""], "r": "AB", "e": "非系统性风险是个别资产特有的风险，可通过分散投资降低。增加资产数量能分散风险；选相关性低的资产组合，可使一种资产不利变动被其他资产有利变动抵消，也能分散风险。集中投资单一行业无法分散，会加大非系统性风险；贝塔系数高反映系统风险，与非系统性风险降低无关。所以答案是AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808523", "t": 2, "q": "工程项目投资的可行性研究报告应包括的内容有（　）", "a": ["市场分析", "技术方案分析", "财务评价", "风险分析", "", ""], "r": "ABCD", "e": "可行性研究报告需对项目多方面进行研究分析。市场分析可明确项目产品或服务的市场前景；技术方案分析确保项目技术可行；财务评价判断项目经济合理性；风险分析评估可能面临的风险。ABCD选项都是可行性研究报告应涵盖内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808524", "t": 2, "q": "影响证券投资组合风险的因素有（　）", "a": ["单个资产的风险水平", "资产之间的相关系数", "资产在组合中的权重", "市场的平均风险水平", "", ""], "r": "ABC", "e": "证券投资组合风险受单个资产风险、资产间相关系数、资产在组合中权重影响。单个资产风险高，组合风险可能高；相关系数决定资产波动协同性，影响组合风险分散程度；资产权重不同，对组合风险影响不同。而市场平均风险水平与特定投资组合风险无直接关联。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808525", "t": 2, "q": "投资组合绩效评价的常用指标有（　）", "a": ["夏普比率", "特雷诺比率", "詹森阿尔法", "贝塔系数", "", ""], "r": "ABC", "e": "夏普比率衡量承担单位总风险所获得的超额收益；特雷诺比率衡量承担单位系统风险所获得的超额收益；詹森阿尔法衡量投资组合在承担系统风险时超出市场收益的部分，这三者均是投资组合绩效评价常用指标。而贝塔系数主要衡量系统性风险大小，并非绩效评价指标。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808526", "t": 2, "q": "电力企业的投融资特点包括（　）", "a": ["投资规模大", "回收周期长", "融资需求稳定", "受政策影响大", "", ""], "r": "ABCD", "e": "电力行业建设需大量资金，所以投资规模大；电力项目建设和成本回收时间长，回收周期长；电力是基础产业，发展较稳定，融资需求稳定；且电力行业与国家能源战略等政策紧密相关，受政策影响大。ABCD四项均符合电力企业投融资特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808527", "t": 2, "q": "资本资产定价模型的局限性包括？", "a": ["假设条件过于严格，与现实市场存在差距", "无法解释小盘股效应、价值股效应等市场异象", "仅考虑单一因子，忽略了其他影响收益率的因素", "不能用于单个资产的定价", "", ""], "r": "ABC", "e": "资本资产定价模型有诸多局限性，它假设条件严苛脱离现实，只考虑市场单一因子，还无法解释一些市场异常现象，但它能用于单个资产定价。所以ABC是其局限性。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808528", "t": 2, "q": "以下属于宏观经济风险因子的有（　）", "a": ["通货膨胀率", "利率水平", "公司经营状况", "汇率变动", "", ""], "r": "ABD", "e": "宏观经济风险因子是影响整个宏观经济的因素。A通货膨胀率、B利率水平、D汇率变动都会对宏观经济产生影响。而C公司经营状况是微观层面，是单个公司的情况。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808529", "t": 2, "q": "投资组合构建的步骤包括（　）", "a": ["确定投资目标", "选择资产类别", "确定资产权重", "监控和调整组合", "", ""], "r": "ABCD", "e": "投资组合构建先明确投资目标，再选资产类别，接着确定各资产权重，最后要监控和调整组合。ABCD四个步骤都是构建投资组合的必要环节。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808530", "t": 2, "q": "工程项目经济评价方法中，静态评价指标有（　）", "a": ["投资回收期", "净现值", "内部收益率", "投资收益率", "", ""], "r": "AD", "e": "静态评价指标不考虑资金时间价值。投资回收期和投资收益率是静态指标；净现值和内部收益率考虑了资金时间价值，是动态指标。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808531", "t": 2, "q": "投资组合绩效评价的风险调整后收益指标包括？", "a": ["夏普比率", "特雷诺比率", "詹森阿尔法", "总资产收益率（ROA）", "", ""], "r": "ABC", "e": "夏普比率、特雷诺比率、詹森阿尔法都是考虑了风险因素来衡量投资组合绩效的风险调整后收益指标。而总资产收益率（ROA）未考虑风险调整。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808532", "t": 2, "q": "下列关于证券投资组合分散化效应的说法，正确的有？", "a": ["组合中证券的相关性越低，分散化效应越明显", "组合中证券的数量越多，分散化效应越明显（直至极限）", "完全正相关的证券组合无法产生分散化效应", "完全负相关的证券组合可完全消除风险", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808533", "t": 2, "q": "期权的时间价值受到哪些因素影响（　）", "a": ["标的资产价格与执行价格的差额", "到期期限", "波动率", "无风险收益率", "", ""], "r": "ABCD", "e": "期权时间价值受标的资产价格与执行价格差额、到期期限、波动率、无风险收益率等因素影响。ABCD选项均符合。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808534", "t": 2, "q": "并购估值分析中，相对估值法的常用指标包括？", "a": ["市盈率（P/E）", "市净率（P/B）", "市销率（P/S）", "净现值（NPV）", "", ""], "r": "ABC", "e": "相对估值法是利用类似企业的市场定价来估计目标企业价值的一种方法，常用指标有市盈率、市净率、市销率等。而净现值是绝对估值法中的指标。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808535", "t": 2, "q": "有效市场假说对投资策略的启示有（　）", "a": ["弱式有效市场下，技术分析无效", "半强式有效市场下，基本面分析无效", "强式有效市场下，主动投资策略无效", "无论市场是否有效，分散投资都能降低风险", "", ""], "r": "ABCD", "e": "不同有效市场下，对应分析方法和投资策略有效性不同。弱式有效市场技术分析无用；半强式有效市场基本面分析无效；强式有效市场主动投资策略无效，且分散投资能降低非系统风险，与市场有效性无关。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808536", "t": 2, "q": "期货市场的主要功能有（　）", "a": ["套期保值", "价格发现", "投机", "套利", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808537", "t": 2, "q": "工程项目经济评价中，基准收益率的确定需要考虑的因素有（　）", "a": ["资金成本", "投资风险", "通货膨胀率", "行业平均收益率", "", ""], "r": "ABCD", "e": "基准收益率确定需综合多因素，资金成本是筹资费用和使用费用；投资有风险需考虑风险补偿；通货膨胀会影响资金价值；行业平均收益率反映行业整体盈利水平。ABCD四个选项都是确定基准收益率要考虑的因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808538", "t": 2, "q": "下列关于期权的说法，正确的是？", "a": ["看涨期权的买方有权在约定时间以约定价格卖出标的资产", "看跌期权的卖方有义务在约定时间以约定价格买入标的资产", "期权的买方需要缴纳保证金，卖方无需缴纳", "期权的权利金是买方获得权利的成本，一旦支付不可退还", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808539", "t": 2, "q": "套利定价理论（APT）与资本资产定价模型（CAPM）的区别在于（　）", "a": ["风险因子的数量", "假设条件的严格程度", "适用范围", "定价逻辑", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808540", "t": 2, "q": "期货、期权及衍生品市场的主要功能有（　）", "a": ["套期保值", "价格发现", "投机", "融资", "", ""], "r": "ABC", "e": "期货、期权及衍生品市场能为企业提供套期保值工具来规避风险，还能通过交易形成反映供求关系的价格，即价格发现功能，同时也吸引投机者参与，活跃市场。而融资并非其主要功能。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808541", "t": 2, "q": "工程项目经济评价中，内部收益率（IRR）的特点包括？", "a": ["是使项目净现值为0的折现率", "反映项目的实际收益率水平", "IRR大于基准收益率时，项目可行", "适用于所有类型的工程项目评价", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808542", "t": 2, "q": "工程项目投资中，无形资产投资包括（　）", "a": ["土地使用权", "专利权", "设备购置", "商标权", "", ""], "r": "ABD", "e": "无形资产是指企业拥有或者控制的没有实物形态的可辨认非货币性资产。土地使用权、专利权、商标权都符合无形资产特征；而设备购置是固定资产投资。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808543", "t": 2, "q": "工程项目投资的资金筹措方案需考虑的因素包括？", "a": ["资金成本", "资金期限", "偿债能力", "资金来源的可靠性", "", ""], "r": "ABCD", "e": "资金成本影响项目成本和收益；资金期限关系到资金使用安排和还款计划；偿债能力决定项目能否按时还款；资金来源可靠性确保资金稳定供应，这些都是资金筹措方案要考虑的重要因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808544", "t": 2, "q": "债券的久期与下列哪些因素正相关？", "a": ["债券的剩余期限", "债券的票面利率", "债券的到期收益率", "债券的付息频率", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818572399808545", "t": 2, "q": "开放式基金与封闭式基金的主要区别有（　）", "a": ["开放式基金规模不固定，封闭式基金规模固定", "开放式基金可随时申购赎回，封闭式基金在封闭期内不可", "开放式基金交易价格由净值决定，封闭式基金由供求关系决定", "开放式基金投资门槛高于封闭式基金", "", ""], "r": "ABC", "e": "开放式基金规模不固定，可随时申购赎回，交易价格由净值决定；封闭式基金规模固定，封闭期内不可申购赎回，交易价格受供求关系影响。通常开放式基金投资门槛低于封闭式基金。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963712", "t": 3, "q": "工程项目投资的自有资金无需偿还，也无需支付利息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "自有资金属于投资者自己的资金，使用时无需偿还给他人，也不用支付利息。", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963713", "t": 3, "q": "看涨期权的买方只有权利没有义务，看跌期权的卖方只有义务没有权利。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "期权的买方支付权利金获得权利，无义务；卖方收取权利金，只有履约义务。看涨期权和看跌期权都遵循此规则。所以原说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963714", "t": 3, "q": "电力企业的短期融资主要用于补充流动资金，长期融资主要用于固定资产投资项目。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "短期融资期限短，能快速补充企业日常经营所需流动资金；长期融资期限长，能为固定资产投资等大型项目提供稳定资金支持。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963715", "t": 3, "q": "电力企业的项目投资中，流动资金在项目结束时会全部回收。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流动资金是项目运营过程中用于周转的资金，项目结束时，其占用的存货等变现，资金可全部回收。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963716", "t": 3, "q": "工程项目投资的静态投资回收期越短，说明项目的盈利能力越强，投资风险越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963717", "t": 3, "q": "电力企业的留存收益转增资本属于内部融资。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "留存收益是企业从历年实现的利润中提取或留存于企业的内部积累，用留存收益转增资本，资金来源于企业内部，属于内部融资。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963718", "t": 3, "q": "债券的凸性是衡量债券价格对利率变动敏感度的二次指标。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "凸性是对债券价格利率敏感性的二阶估计，也就是衡量债券价格对利率变动敏感度的二次指标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963719", "t": 3, "q": "工程项目经济评价中的投资回收期指标考虑了资金的时间价值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静态投资回收期不考虑资金时间价值，动态投资回收期考虑，但题目没明确是哪种，一般说投资回收期常指静态，所以通常认为不考虑资金时间价值。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963720", "t": 3, "q": "套利定价模型中的套利是指无风险套利。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "套利定价模型中的套利就是无风险套利，投资者可利用资产定价的差异，在不增加风险且不占用自有资金的情况下获取利润。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963721", "t": 3, "q": "有效市场假说认为，市场价格始终等于其内在价值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963722", "t": 3, "q": "看跌期权的买方有权在到期日以执行价格卖出标的资产。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "看跌期权赋予买方在到期日或之前按执行价格卖出标的资产的权利。所以题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963723", "t": 3, "q": "封闭式基金的交易价格始终等于其基金资产净值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "封闭式基金的交易价格受市场供求关系等因素影响，并非始终等于其基金资产净值，会出现折价或溢价情况。", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963724", "t": 3, "q": "期货交易的保证金制度可以降低交易的违约风险，提高市场的流动性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保证金制度要求交易者在交易时缴纳一定比例保证金，违约时保证金可弥补损失，从而降低违约风险；同时降低了交易成本和资金占用，能吸引更多交易者参与，提高市场流动性。", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963725", "t": 3, "q": "并购后的整合阶段对并购成功与否影响不大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。并购后的整合阶段至关重要，涉及战略、业务、人员、文化等多方面整合，整合效果直接关系到能否实现协同效应、提升企业竞争力和价值，对并购成败影响极大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963726", "t": 3, "q": "资本资产定价模型中的市场组合是指包含所有风险资产的组合，其收益率是所有风险资产收益率的加权平均。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资本资产定价模型里的市场组合理论上包含所有风险资产，其收益率就是这些风险资产收益率的加权平均，权重为各资产市值占总市值的比例。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963727", "t": 3, "q": "投资组合的绩效评价仅需考虑组合的收益率，无需考虑组合的风险水平。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "投资组合绩效评价不能仅看收益率，风险水平也很关键，不同风险下相同收益率的投资组合，其优劣不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963728", "t": 3, "q": "现金流折现法是并购估值中最准确的方法，适用于所有并购场景。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现金流折现法虽常用且重要，但并非适用于所有并购场景，比如一些初创企业或经营不稳定企业，未来现金流难以准确预测，该方法就有局限性，所以说适用于所有并购场景错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963729", "t": 3, "q": "证券投资的技术分析认为市场是有效的，价格已反映所有信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。技术分析认为市场是无效的，它通过研究证券价格的历史走势、成交量等技术指标来预测未来价格变动，并不认为价格已反映所有信息；而有效市场假说才认为市场是有效的，价格已反映所有信息。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963730", "t": 3, "q": "并购估值中，相对估值法的核心是找到可比公司，通过可比指标估算目标公司价值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "相对估值法就是选取与目标公司具有可比性的公司，利用可比指标来估算目标公司价值，这是其核心要点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963731", "t": 3, "q": "债券投资的免疫策略是通过调整组合的久期，使组合的利率风险为零，从而锁定投资收益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "债券免疫策略核心就是通过调整资产组合久期，让资产和负债的久期相匹配，以降低利率波动对资产价值的影响，使组合利率风险近似为零，进而锁定投资收益。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963732", "t": 3, "q": "马科维茨投资组合理论仅适用于股票组合，不适用于债券组合或混合资产组合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "马科维茨投资组合理论可用于多种资产组合，包括股票、债券及混合资产组合，并非仅适用于股票组合。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963733", "t": 3, "q": "并购交易中，股票支付方式可以减轻并购方的现金流压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "股票支付是用股票作为支付手段完成并购，无需大量现金支出，能减轻并购方现金流压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963734", "t": 3, "q": "债券的凸性为正，意味着当利率下降时，债券价格的上涨幅度大于利率上升时价格的下跌幅度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "凸性衡量债券价格 - 收益率曲线的弯曲程度，凸性为正说明曲线是向上凸的，利率下降时债券价格上涨幅度会大于利率上升时价格下跌幅度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963735", "t": 3, "q": "并购估值中，现金流折现法（DCF）的估值结果不受折现率选择的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现金流折现法（DCF）中，折现率是关键参数，不同折现率会使未来现金流现值不同，从而影响估值结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963736", "t": 3, "q": "证券投资组合的分散化效应在资产数量增加到一定程度后会边际递减。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "随着资产数量增加，分散化能降低非系统性风险，不过当资产数量增加到一定程度，可分散的非系统性风险越来越少，分散化效应就会边际递减。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963737", "t": 3, "q": "有效市场假说认为，投资者无法通过任何方式获得超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "有效市场假说分为弱式、半强式和强式有效市场。在弱式和半强式有效市场中，投资者可分别通过分析历史信息、内幕信息获得超额收益，并非无法通过任何方式获得。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963738", "t": 3, "q": "工程项目的内部收益率越高，说明项目的盈利能力越弱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "内部收益率越高，意味着项目在运营过程中能获得更高的收益，盈利能力越强，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963739", "t": 3, "q": "并购交易中的协同效应包括经营协同和财务协同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963740", "t": 3, "q": "贝塔系数大于1的证券，其系统性风险低于市场组合的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "贝塔系数衡量证券系统性风险，贝塔系数大于1表明该证券系统性风险高于市场组合风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963741", "t": 3, "q": "有效市场假说的三种形态中，强式有效市场的信息反映程度最高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "有效市场假说分弱式、半强式和强式三种形态，强式有效市场包含了所有信息，信息反映程度最高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963742", "t": 3, "q": "债券资产组合的免疫策略可以完全消除利率风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "免疫策略只能降低利率风险，不能完全消除，因为现实中存在诸多不确定因素，如市场环境变化、信用风险等会影响债券价值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963743", "t": 3, "q": "有效市场假说中，半强式有效市场的价格已经反映了所有公开信息和内幕信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "半强式有效市场价格反映所有公开信息，但不反映内幕信息，只有强式有效市场价格才反映所有公开和内幕信息。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963744", "t": 3, "q": "资本资产定价模型中，市场风险溢价是市场组合收益率与无风险收益率的差额。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资本资产定价模型里，市场风险溢价的确是市场组合收益率减去无风险收益率得到的差额。", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963745", "t": 3, "q": "套利定价模型不需要假设投资者是风险厌恶的，仅需要假设市场存在套利机会。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "套利定价模型的推导依赖于无套利均衡原理，即市场不存在套利机会。并且它假设投资者会利用套利机会获利。题干说假设市场存在套利机会错误，同时该模型虽对投资者风险偏好假设弱于资本资产定价模型，但并非完全不考虑投资者对收益和风险的权衡，所以“不需要假设投资者是风险厌恶的”表述也不严谨。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963746", "t": 3, "q": "套利定价模型认为，证券的收益率仅受单一因子影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "套利定价模型认为证券收益率受多个因子影响，并非仅受单一因子影响。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963747", "t": 3, "q": "并购估值中，相对估值法的优点是计算简便、直观，缺点是受可比公司选择的影响较大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "相对估值法通过参考可比公司数据来评估目标公司价值，计算不复杂且容易理解，所以计算简便、直观是其优点；而该方法依赖可比公司选择，若可比公司选取不当会严重影响估值结果，所以受可比公司选择影响大是其缺点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963748", "t": 3, "q": "投资组合的β系数是组合中各证券β系数的加权平均值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "投资组合的β系数等于组合中各证券β系数以其投资比重为权数的加权平均值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963749", "t": 3, "q": "证券投资组合的系统性风险可以通过分散投资完全消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统性风险是由整体政治、经济、社会等环境因素对证券价格所造成的影响，无法通过分散投资消除，非系统性风险才可以通过分散投资降低或消除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963750", "t": 3, "q": "强式有效市场下，即使掌握内幕信息，投资者也无法获得超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "强式有效市场中，所有信息（包括内幕信息）都已反映在股价中，所以即便掌握内幕信息也不能获得超额收益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963751", "t": 3, "q": "工程项目投资的净现值（NPV）小于零，说明项目一定不可行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "净现值小于零意味着项目预期收益不能达到基准收益率要求，从经济角度通常判定项目不可行，但在一些特殊情况下，如考虑战略意义等，即便净现值小于零项目也可能实施。不过仅从常规经济评价角度，一般认为不可行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963752", "t": 3, "q": "债券的票面利率越高，其久期越长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "票面利率与久期呈反向关系，票面利率越高，久期越短。因为高票面利率能更快收回现金流，使债券平均收回期限缩短。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963753", "t": 3, "q": "CAPM中的无风险收益率通常以短期国债利率为代表。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在资本资产定价模型（CAPM）里，无风险收益率需满足无违约风险和无再投资风险等条件，短期国债由政府发行，违约风险极低，且期限短再投资风险小，常被用来代表无风险收益率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963754", "t": 3, "q": "证券投资的基本面分析更适用于短期投资决策。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基本面分析主要是对宏观经济、行业和公司基本情况进行研究，以评估证券的内在价值，其结果通常反映的是证券的长期发展趋势。而短期投资决策更注重市场的短期波动、技术指标等因素。所以证券投资的基本面分析更适用于长期投资决策，该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963755", "t": 3, "q": "半强式有效市场中，投资者可以通过分析内幕信息获得超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "半强式有效市场中，股价已反映所有公开信息，而内幕信息未公开，掌握内幕信息的投资者能利用其获取超额收益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818575230963756", "t": 3, "q": "资本资产定价模型中的市场组合是指包含所有风险资产的最优组合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资本资产定价模型里的市场组合理论上是包含所有风险资产且按其市值比例构成的组合，是最优风险组合。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第4章 投资学（4）", "n": "基础练习题【含解析】 / 第4章 投资学（4）", "qs": [{"id": "2034818581052657664", "t": 1, "q": "套利定价模型的核心逻辑是（　）", "a": ["投资者都是风险厌恶的", "无套利机会存在", "市场完全竞争", "风险与收益成正比", "", ""], "r": "B", "e": "套利定价模型基于无套利原理，即市场不存在套利机会，以此来确定资产价格。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657665", "t": 1, "q": "下列不属于债券定价基本要素的是（　）", "a": ["票面利率", "到期期限", "市场利率", "债券面额", "", ""], "r": "C", "e": "债券定价基本要素有票面金额（即债券面额）、票面利率、到期期限等。市场利率是影响债券价格的外部因素，并非定价基本要素。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657666", "t": 1, "q": "有效市场假说中，强式有效市场的特征是？", "a": ["股价反映历史交易信息", "股价反映所有公开信息", "股价反映所有信息（含内幕信息）", "股价无法反映任何信息", "", ""], "r": "C", "e": "强式有效市场是市场有效性的最高层次，在该市场中，股价能反映所有信息，包括内幕信息。A选项是弱式有效市场特征，B选项是半强式有效市场特征，D选项说法错误。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657667", "t": 1, "q": "套利定价模型（APT）与CAPM的主要区别在于（　）", "a": ["APT不考虑风险溢价", "APT允许存在多个风险因子", "APT仅适用于单个证券，不适用于组合", "APT假设市场完全有效", "", ""], "r": "B", "e": "CAPM假定只有市场一个风险因子，而APT允许存在多个风险因子。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657668", "t": 1, "q": "投资组合绩效评价中，夏普比率的计算公式分子是（　）", "a": ["投资组合收益率-无风险收益率", "投资组合收益率-市场组合收益率", "投资组合超额收益率/投资组合标准差", "投资组合超额收益率/投资组合贝塔系数", "", ""], "r": "A", "e": "夏普比率衡量的是承担单位风险所获得的超过无风险收益的额外收益，其分子是投资组合收益率与无风险收益率的差值，即投资组合超额收益率。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657669", "t": 1, "q": "电力企业作为资本密集型行业，其投融资的主要特点是（　）", "a": ["融资期限短，融资成本高", "以股权融资为主，债务融资为辅", "项目投资规模大，回收周期长", "主要依赖短期银行借款", "", ""], "r": "C", "e": "电力企业属资本密集型，项目建设需大量资金投入，且建设和运营周期长，所以项目投资规模大、回收周期长。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657670", "t": 1, "q": "电力企业项目融资中，最常用的债务融资方式是（　）", "a": ["短期商业票据", "长期银行贷款", "发行普通股", "发行优先股", "", ""], "r": "B", "e": "债务融资是指企业通过向个人或机构投资者出售债券、票据筹集营运资金或资本开支。电力企业项目一般周期长，长期银行贷款能满足其资金需求且相对稳定，是常用债务融资方式。A短期商业票据期限短；C发行普通股和D发行优先股属于权益融资。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657671", "t": 1, "q": "某看跌期权的执行价格为50元，标的资产当前价格为45元，期权费为3元，该期权的内在价值为（　）", "a": ["5元", "3元", "2元", "0元", "", ""], "r": "A", "e": "看跌期权内在价值=执行价格 - 标的资产当前价格，即50 - 45 = 5元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657672", "t": 1, "q": "债券的凸性是衡量债券价格对利率变动敏感性的补充指标，以下关于凸性的说法正确的是？", "a": ["所有债券的凸性均为正值", "凸性越大，债券价格对利率变动的敏感性越弱", "零息债券的凸性小于附息债券", "利率下降时，凸性对债券价格的影响为负", "", ""], "r": "A", "e": "大部分债券凸性为正，A正确；凸性越大，债券价格对利率变动敏感性越强，B错误；零息债券凸性大于附息债券，C错误；利率下降时，凸性使债券价格上升，影响为正，D错误。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657673", "t": 1, "q": "根据有效市场假说，若投资者能通过分析公司年报获得超额收益，说明该市场属于？", "a": ["弱式有效市场", "半强式有效市场", "强式有效市场", "非有效市场", "", ""], "r": "D", "e": "有效市场假说中，半强式有效市场下，股价已反映所有公开信息，投资者无法通过分析公开信息如公司年报获超额收益；强式有效市场连内幕信息也反映在股价里，更不能靠年报获利。弱式有效市场股价反映历史信息，分析年报有可能获超额收益，但本题能靠年报获超额收益说明市场未有效反映公开信息，所以是非有效市场。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657674", "t": 1, "q": "债券的凸性反映了债券价格与利率之间的（　）", "a": ["线性关系", "非线性关系", "反向关系", "正向关系", "", ""], "r": "B", "e": "凸性描述的是债券价格和利率的非线性关系。线性关系一般用久期衡量，而凸性体现了价格 - 利率曲线的弯曲程度，是非线性的。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657675", "t": 1, "q": "期货交易中，套期保值者的主要目的是（　）", "a": ["赚取期货合约的价格差价", "规避现货资产的价格风险", "参与期货市场的投机活动", "扩大资产的收益空间", "", ""], "r": "B", "e": "套期保值的核心就是通过期货市场来对冲现货市场价格波动带来的风险。A选项赚取差价是投机者目的；C选项套期保值不是投机；D选项套期保值主要是避险而非扩大收益空间。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657676", "t": 1, "q": "证券投资基本面分析的核心是分析（　）", "a": ["证券的历史价格走势", "市场资金流向", "公司的内在价值", "技术指标的形态", "", ""], "r": "C", "e": "基本面分析是通过对宏观经济、行业和公司基本情况等研究来评估证券价值。其核心就是确定公司的内在价值，看证券价格是否合理。A是技术分析关注，B市场资金流向也非基本面分析核心，D技术指标形态是技术分析内容。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657677", "t": 1, "q": "下列关于弱式有效市场的说法，正确的是（　）", "a": ["投资者可以通过基本面分析获得超额收益", "投资者可以通过技术分析获得超额收益", "投资者无法通过技术分析获得超额收益", "股票价格与公司盈利无关", "", ""], "r": "C", "e": "弱式有效市场中，股价已反映了历史信息，技术分析失去作用，投资者无法通过技术分析获得超额收益。基本面分析仍可能有用，股票价格与公司盈利有关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657678", "t": 1, "q": "投资组合的夏普比率越高，表明（　）", "a": ["组合的风险调整后收益越高", "组合的系统性风险越低", "组合的非系统性风险越低", "组合的绝对收益越高", "", ""], "r": "A", "e": "夏普比率反映了资产在承担单位风险时所能获得的超过无风险收益的额外收益，比率越高，意味着风险调整后收益越高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657679", "t": 1, "q": "某期货合约的保证金比例为10%，投资者以10万元保证金买入合约，该合约的价值为（　）", "a": ["10万元", "100万元", "90万元", "110万元", "", ""], "r": "B", "e": "保证金比例=保证金/合约价值，已知保证金为10万元，保证金比例10%，则合约价值=保证金÷保证金比例=10÷10% = 100万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657680", "t": 1, "q": "开放式基金的净值披露频率通常为（　）", "a": ["每个交易日披露", "每周披露一次", "每月披露一次", "每季度披露一次", "", ""], "r": "A", "e": "开放式基金每个交易日开放申赎，需反映当日价值，所以净值要每个交易日披露。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657681", "t": 1, "q": "电力企业投融资的特点不包括以下哪项？", "a": ["投资规模大，回收周期长", "受政策调控影响显著", "以短期融资为主，长期融资为辅", "项目现金流相对稳定", "", ""], "r": "C", "e": "电力企业建设需大量资金且回报慢，投资规模大、回收周期长，A正确；其发展受国家政策影响大，B正确；因项目建设周期长，需长期稳定资金，应是长期融资为主，C错误；电力需求较稳定，项目现金流也相对稳定，D正确。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657682", "t": 1, "q": "期货合约与远期合约的最主要区别在于（　）", "a": ["期货合约标准化，远期合约非标准化", "期货合约无杠杆，远期合约有杠杆", "期货合约不涉及实物交割，远期合约必须实物交割", "期货合约由双方私下签订，远期合约在交易所交易", "", ""], "r": "A", "e": "期货合约是标准化合约，在交易所交易；远期合约是非标准化的，一般是双方私下签订。B选项期货合约有杠杆；C选项期货和远期都可实物交割；D选项说反了。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657683", "t": 1, "q": "工程项目经济评价中，内部收益率（IRR）是使项目净现值为零时的（　）", "a": ["贷款利率", "基准收益率", "折现率", "通货膨胀率", "", ""], "r": "C", "e": "内部收益率是指使项目净现值为零时的折现率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657684", "t": 1, "q": "多因子模型中，规模因子通常用（　）衡量", "a": ["公司市值", "公司净利润", "公司资产总额", "公司营业收入", "", ""], "r": "A", "e": "规模因子一般用公司市值衡量，它能体现公司规模大小。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657685", "t": 1, "q": "下列属于证券基本面分析的核心指标的是（　）", "a": ["移动平均线", "相对强弱指数（RSI）", "市盈率（P/E）", "随机指标（KDJ）", "", ""], "r": "C", "e": "基本面分析关注宏观经济、行业和公司基本情况等，市盈率反映公司盈利和股价关系，是基本面分析核心指标。而移动平均线、相对强弱指数、随机指标是技术分析工具。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657686", "t": 1, "q": "资本资产定价模型（CAPM）中，贝塔系数（β）衡量的是证券的（　）", "a": ["总风险", "非系统性风险", "系统性风险", "公司特有风险", "", ""], "r": "C", "e": "贝塔系数衡量的是证券或投资组合的系统性风险，系统性风险是不可分散风险。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657687", "t": 1, "q": "电力企业投融资的主要特点不包括（　）", "a": ["项目投资规模大、回收周期长", "受政策调控和行业规划影响显著", "融资渠道以股权融资为主，债务融资为辅", "现金流相对稳定，受宏观经济波动影响较小", "", ""], "r": "C", "e": "电力企业融资渠道通常以债务融资为主，股权融资为辅，C选项说法错误。A、B、D是电力企业投融资常见特点。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657688", "t": 1, "q": "资本资产定价模型中，市场组合的贝塔系数值为？", "a": ["0", "1", "大于1", "小于1", "", ""], "r": "B", "e": "市场组合的波动与自身完全同步，其贝塔系数定义为1。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657689", "t": 1, "q": "套利定价理论（APT）认为，资产的预期收益率取决于（　）", "a": ["单一市场风险因子", "多个宏观经济风险因子", "资产的非系统性风险", "市场组合的收益率", "", ""], "r": "B", "e": "套利定价理论（APT）假设资产的收益率受多个宏观经济风险因子影响。A项单一市场风险因子是资本资产定价模型；C项资产非系统性风险可分散，不是APT决定预期收益率因素；D项市场组合收益率是CAPM关键要素。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657690", "t": 1, "q": "投资组合绩效评价中，夏普比率衡量的是（　）", "a": ["单位系统性风险带来的超额收益", "单位总风险带来的超额收益", "投资组合的绝对收益率", "投资组合与市场组合的收益差异", "", ""], "r": "B", "e": "夏普比率是用投资组合的超额收益除以总风险，衡量单位总风险带来的超额收益。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657691", "t": 1, "q": "投资组合绩效评价的特雷诺比率，其分母是（　）", "a": ["投资组合标准差", "投资组合贝塔系数", "无风险收益率", "市场组合收益率", "", ""], "r": "B", "e": "特雷诺比率公式为（投资组合收益率 - 无风险收益率）/投资组合贝塔系数，分母是投资组合贝塔系数。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657692", "t": 1, "q": "根据马科维茨证券投资组合理论，投资者在构建有效边界时，核心考虑的两个指标是（　）", "a": ["预期收益率和非系统性风险", "预期收益率和系统性风险", "预期收益率和总风险", "实际收益率和总风险", "", ""], "r": "C", "e": "马科维茨证券投资组合理论构建有效边界时，核心考虑预期收益率和总风险，投资者要在二者间权衡。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657693", "t": 1, "q": "基金投资中
