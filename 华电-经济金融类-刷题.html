<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>华电-经济金融类</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <button class="btn" id="back" style="display:none">‹ 返回</button>
  <h1 id="hTitle">珞研刷题</h1>
  <button class="star" id="star" style="display:none">★</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const DATA = {"id": "yw2033827475703861248", "name": "华电-经济金融类", "chapters": [{"k": "基础练习题【含解析】||第1章 经济学基础（1）", "n": "基础练习题【含解析】 / 第1章 经济学基础（1）", "qs": [{"id": "2034818422835122176", "t": 1, "q": "经济增长的源泉不包括", "a": ["资本积累", "劳动力增长", "技术进步", "通货膨胀", "", ""], "r": "D", "e": "资本积累、劳动力增长、技术进步都能推动经济增长，而通货膨胀是物价持续上涨现象，不是经济增长源泉。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122177", "t": 1, "q": "在开放经济的IS-LM模型中，本币贬值会导致", "a": ["IS曲线向右移动", "IS曲线向左移动", "LM曲线向右移动", "LM曲线向左移动", "", ""], "r": "A", "e": "本币贬值会使本国产品更便宜，出口增加、进口减少，净出口增加，总需求上升。IS曲线反映产品市场均衡，总需求增加会使IS曲线向右移动。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122178", "t": 1, "q": "寡头垄断市场的主要特征是", "a": ["厂商数量众多，产品同质", "厂商数量较少，存在相互依存关系", "厂商数量众多，产品有差异", "厂商数量唯一，产品无替代品", "", ""], "r": "B", "e": "寡头垄断市场中厂商数量少，且各厂商之间相互影响、相互依存。A选项是完全竞争市场特征；C选项是垄断竞争市场特征；D选项是完全垄断市场特征。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122179", "t": 1, "q": "根据新古典增长模型，稳态时的人均产出增长率取决于", "a": ["人均资本存量", "储蓄率", "人口增长率", "技术进步率", "", ""], "r": "D", "e": "新古典增长模型中，稳态时人均资本和人均产出不再变化，但技术进步会推动人均产出持续增长，人均产出增长率取决于技术进步率。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122180", "t": 1, "q": "在其他条件不变的情况下，消费者预期某商品未来价格会上涨，则当前该商品的需求曲线会发生什么变动？", "a": ["向左平移", "向右平移", "保持不变", "斜率变为正值", "", ""], "r": "B", "e": "消费者预期商品未来价格上涨，会在当前增加购买，即当前该商品的需求增加。需求增加会使需求曲线向右平移。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122181", "t": 1, "q": "消费者实现效用最大化的均衡条件是", "a": ["每种商品的边际效用相等", "每种商品的边际效用与价格之比相等", "总效用达到最大", "消费者的预算线与无差异曲线相切且边际效用为零", "", ""], "r": "B", "e": "消费者效用最大化均衡条件是在既定收入下，消费者购买各种商品的边际效用与价格之比相等，此时预算线与无差异曲线相切。A选项边际效用相等不是均衡条件；C选项总效用最大表述不准确；D选项边际效用为零错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122182", "t": 1, "q": "完全垄断厂商实现利润最大化时，价格与边际成本的关系是？", "a": ["价格等于边际成本", "价格大于边际成本", "价格小于边际成本", "价格与边际成本无关", "", ""], "r": "B", "e": "完全垄断厂商追求利润最大化时，依据MR = MC原则确定产量，再根据需求曲线确定价格。由于需求曲线向右下方倾斜，此时价格会高于边际成本。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122183", "t": 1, "q": "下列哪种情况会导致短期总需求曲线向左平移？", "a": ["政府购买增加", "税收减少", "消费者信心下降", "货币供给增加", "", ""], "r": "C", "e": "总需求曲线向左平移意味着总需求减少。政府购买增加、税收减少、货币供给增加都会使总需求增加，曲线右移；而消费者信心下降会使消费减少，总需求减少，曲线左移。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122184", "t": 1, "q": "消费者剩余是指", "a": ["消费者实际支付的价格与愿意支付的最高价格之间的差额", "消费者愿意支付的最高价格与实际支付价格之间的差额", "商品的总效用与边际效用之间的差额", "商品的边际效用与价格之比", "", ""], "r": "B", "e": "消费者剩余就是消费者愿意为商品支付的最高价格减去其实际支付价格的差值。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122185", "t": 1, "q": "下列关于经济周期的说法正确的是", "a": ["经济周期是指经济总量的长期持续增长", "经济周期包括繁荣、衰退、萧条、复苏四个阶段", "经济周期的持续时间固定不变", "经济周期是由单一因素导致的", "", ""], "r": "B", "e": "经济周期有繁荣、衰退、萧条、复苏四个阶段；A选项经济周期不是经济总量长期持续增长；C选项经济周期持续时间不固定；D选项经济周期由多种因素导致。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122186", "t": 1, "q": "当边际成本小于平均成本时，平均成本会", "a": ["上升", "下降", "保持不变", "先下降后上升", "", ""], "r": "B", "e": "边际成本小于平均成本时，新增一单位产品的成本低于当前平均成本，会拉低平均成本。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122187", "t": 1, "q": "下列关于边际消费倾向的说法正确的是", "a": ["边际消费倾向大于一", "边际消费倾向小于零", "边际消费倾向在零和一之间", "边际消费倾向等于平均消费倾向", "", ""], "r": "C", "e": "边际消费倾向是增加的消费与增加的收入之比率，增加的消费不可能超过增加的收入，所以其取值在0到1之间。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122188", "t": 1, "q": "宏观经济政策的四大目标不包括", "a": ["经济增长", "充分就业", "物价稳定", "完全竞争", "", ""], "r": "D", "e": "宏观经济政策四大目标是经济增长、充分就业、物价稳定和国际收支平衡。完全竞争是一种市场结构，并非宏观经济政策目标。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122189", "t": 1, "q": "下列属于垄断竞争市场特征的是", "a": ["厂商数量极少，相互依存", "产品无差异，完全同质", "厂商进出市场较容易", "存在明显的进入壁垒", "", ""], "r": "C", "e": "垄断竞争市场厂商数量较多，产品有差异，进出较容易，无明显进入壁垒。A选项是寡头垄断特征；B选项是完全竞争特征；D选项不符合垄断竞争特点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122190", "t": 1, "q": "短期生产中，当平均产量达到最大值时，边际产量与平均产量的关系是", "a": ["边际产量大于平均产量", "边际产量等于平均产量", "边际产量小于平均产量", "边际产量为零", "", ""], "r": "B", "e": "在短期生产中，当边际产量大于平均产量时，平均产量递增；当边际产量小于平均产量时，平均产量递减；所以当平均产量达到最大值时，边际产量等于平均产量。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122191", "t": 1, "q": "在长期平均成本曲线的递减阶段，厂商的生产处于", "a": ["规模报酬递增", "规模报酬递减", "规模报酬不变", "边际报酬递减", "", ""], "r": "A", "e": "长期平均成本曲线递减阶段，意味着生产规模扩大时成本下降，这对应规模报酬递增。规模报酬递减会使长期平均成本上升，规模报酬不变时长期平均成本不变，边际报酬递减是短期概念。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122192", "t": 1, "q": "当商品的替代效应与收入效应方向相反，且替代效应小于收入效应时，该商品是？", "a": ["正常商品", "吉芬商品", "低档商品", "奢侈品", "", ""], "r": "B", "e": "正常商品替代效应和收入效应同向；低档商品替代效应和收入效应反向，但一般替代效应大于收入效应；吉芬商品替代效应与收入效应方向相反，且替代效应小于收入效应；奢侈品属于一种特殊的正常商品。所以答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122193", "t": 1, "q": "下列哪种政策属于扩张性财政政策？", "a": ["提高税率", "减少政府购买", "增加转移支付", "减少国债发行", "", ""], "r": "C", "e": "扩张性财政政策是要刺激经济，增加社会总需求。提高税率会使企业和个人可支配收入减少，抑制需求，A错误；减少政府购买直接降低了社会总需求，B错误；增加转移支付能使居民可支配收入增加，刺激消费和投资，属于扩张性财政政策，C正确；减少国债发行意味着政府从市场筹集资金减少，用于投资等支出也会受限，不利于刺激经济，D错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122194", "t": 1, "q": "短期总供给曲线向右上方倾斜的原因是？", "a": ["价格粘性", "工资弹性", "技术进步", "资本存量增加", "", ""], "r": "A", "e": "短期总供给曲线向右上方倾斜，主要是由于价格粘性。价格粘性使得价格不能迅速调整，当物价水平上升时，企业产品价格相对提高，利润增加，会增加产出，所以供给曲线向右上方倾斜。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122195", "t": 1, "q": "某商品的需求价格弹性系数为2.5，若厂商想提高销售收入，应采取的策略是", "a": ["提高价格", "降低价格", "保持价格不变", "先提价后降价", "", ""], "r": "B", "e": "需求价格弹性系数大于1，说明商品需求富有弹性。对于富有弹性的商品，降低价格会使需求量增加的幅度大于价格下降的幅度，进而使销售收入增加。所以厂商应降低价格。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122196", "t": 1, "q": "成本推动型通货膨胀的主要原因是", "a": ["总需求过度增长", "工资上涨或原材料价格上升", "货币供应量过多", "政府支出增加", "", ""], "r": "B", "e": "成本推动型通胀是因生产成本增加而引发的物价上涨。工资上涨和原材料价格上升会使企业成本上升，推动物价上涨。A选项总需求过度增长是需求拉动型通胀原因；C选项货币供应量过多也主要引发需求拉动型通胀；D选项政府支出增加通常也是刺激总需求导致需求拉动型通胀。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122197", "t": 1, "q": "寡头垄断市场的主要特征是？", "a": ["厂商数量众多，产品同质", "厂商数量较少，相互依存", "厂商数量众多，产品有差异", "厂商数量唯一，产品无替代品", "", ""], "r": "B", "e": "寡头垄断市场厂商数量少，且各厂商之间相互影响、相互依存。A是完全竞争市场特征；C是垄断竞争市场特征；D是完全垄断市场特征。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122198", "t": 1, "q": "垄断竞争市场中，厂商实现短期均衡的条件是", "a": ["边际收益等于边际成本", "边际收益等于平均成本", "价格等于边际成本", "价格等于平均成本", "", ""], "r": "A", "e": "厂商无论在何种市场结构下，实现短期均衡的条件都是边际收益等于边际成本。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122199", "t": 1, "q": "在IS-LM模型中，扩张性货币政策会导致", "a": ["IS曲线向右移动", "IS曲线向左移动", "LM曲线向右移动", "LM曲线向左移动", "", ""], "r": "C", "e": "扩张性货币政策使货币供给增加，在货币需求不变时，利率会下降，相同收入水平下利率降低意味着LM曲线向右移动。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122200", "t": 1, "q": "下列哪种情况属于正外部性？", "a": ["工厂排放污水污染河流", "吸烟危害他人健康", "研发新技术带来的技术溢出效应", "深夜施工影响居民休息", "", ""], "r": "C", "e": "正外部性是指某个经济行为个体的活动使他人或社会受益，而受益者无须花费代价。A、B、D选项都是给他人带来不利影响，属于负外部性；C选项研发新技术的技术溢出效应使他人受益，属于正外部性。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122201", "t": 1, "q": "生产函数Q=LK（L为劳动，K为资本）体现的是", "a": ["规模报酬递增", "规模报酬递减", "规模报酬不变", "边际报酬递减", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122202", "t": 1, "q": "厂商的边际成本（MC）曲线与平均总成本（ATC）曲线的交点是？", "a": ["ATC曲线的最低点", "ATC曲线的最高点", "MC曲线的最低点", "MC曲线的最高点", "", ""], "r": "A", "e": "边际成本低于平均总成本时，平均总成本下降；边际成本高于平均总成本时，平均总成本上升，所以二者交点是平均总成本曲线最低点。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122203", "t": 1, "q": "无差异曲线凸向原点的原因是？", "a": ["边际替代率递增", "边际替代率递减", "消费者偏好不变", "商品边际效用递增", "", ""], "r": "B", "e": "无差异曲线凸向原点是因为边际替代率递减规律，即随着一种商品消费数量增加，消费者为获得额外一单位该商品而愿意放弃的另一种商品数量逐渐减少。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122204", "t": 1, "q": "在其他条件不变的情况下，消费者收入增加对劣质商品的需求曲线产生的影响是", "a": ["需求曲线向右平移", "需求曲线向左平移", "需求曲线斜率变大", "需求曲线斜率变小", "", ""], "r": "B", "e": "劣质商品的需求随消费者收入增加而减少，所以收入增加会使劣质商品需求下降，需求曲线向左平移。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122205", "t": 1, "q": "实际GDP与名义GDP的区别在于？", "a": ["实际GDP包含进出口，名义GDP不包含", "实际GDP以不变价格计算，名义GDP以当年价格计算", "实际GDP计入政府转移支付，名义GDP不计入", "实际GDP以当年价格计算，名义GDP以不变价格计算", "", ""], "r": "B", "e": "名义GDP是用生产物品和劳务的当年价格计算的全部最终产品的市场价值，实际GDP是用从前某一年作为基期的价格计算出来的全部最终产品的市场价值，即实际GDP以不变价格计算。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122206", "t": 1, "q": "通货膨胀率是指？", "a": ["货币发行量增长率", "物价水平增长率", "利率增长率", "国内生产总值增长率", "", ""], "r": "B", "e": "通货膨胀表现为物价持续而普遍的上涨，通货膨胀率衡量的是物价水平的增长情况。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122207", "t": 1, "q": "囚徒困境中，两个囚徒的占优策略均衡结果是？", "a": ["双方都不坦白", "双方都坦白", "一方坦白一方不坦白", "无法确定", "", ""], "r": "B", "e": "在囚徒困境里，每个囚徒为使自身利益最大化，不管对方是否坦白，自己坦白都是更优选择，所以最终双方都会选择坦白。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122208", "t": 1, "q": "导致市场失灵的原因不包括", "a": ["公共物品的存在", "完全竞争市场的存在", "外部性的存在", "信息不对称", "", ""], "r": "B", "e": "完全竞争市场能实现资源有效配置，不会导致市场失灵；而公共物品、外部性、信息不对称会使市场机制无法有效发挥作用，造成市场失灵。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122209", "t": 1, "q": "下列哪种情况属于道德风险问题", "a": ["投保人在购买医疗保险后更频繁地就医", "保险公司无法区分高风险和低风险投保人", "消费者在购买商品前不了解商品质量", "生产者为追求利润降低产品质量", "", ""], "r": "A", "e": "道德风险是指在信息不对称的情况下，一方因另一方的行为改变而利益受损。A选项中，投保人买了医保后就医更频繁，是因为有保险保障改变了自身行为，这符合道德风险特征。B是信息不对称下的逆向选择；C是信息不对称，但不是因一方行为改变带来的；D是生产者为逐利的行为，不属于道德风险。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818422835122210", "t": 1, "q": "下列属于准公共物品的是", "a": ["国防", "灯塔", "教育", "法律法规", "", ""], "r": "C", "e": "准公共物品兼具公共和私人物品特性，有一定排他性和竞争性。国防、灯塔、法律法规是纯公共物品，具有非排他性和非竞争性。教育有一定排他性和竞争性，属于准公共物品。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517184", "t": 2, "q": "影响需求价格弹性的因素有", "a": ["商品的可替代性", "商品的用途广泛性", "商品的消费支出在总支出中的比重", "商品的生产周期", "", ""], "r": "ABC", "e": "需求价格弹性受商品可替代性、用途广泛性、消费支出占总支出比重等影响。可替代性越强、用途越广泛、消费支出占比越大，弹性越大。而商品生产周期影响的是供给，并非需求价格弹性。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517185", "t": 2, "q": "博弈论中，纳什均衡的特征有", "a": ["给定其他参与者的策略，每个参与者的策略都是最优的", "参与者无法通过单独改变策略提高自身收益", "一定是占优策略均衡", "可能存在多个纳什均衡", "", ""], "r": "ABD", "e": "纳什均衡指给定其他参与者策略时，每个参与者策略最优，且单独改变策略无法提高自身收益，博弈中可能存在多个纳什均衡，但纳什均衡不一定是占优策略均衡。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517186", "t": 2, "q": "消费者均衡的实现条件包括", "a": ["预算线与无差异曲线相切", "两种商品的边际替代率等于其价格之比", "边际效用为零", "总效用达到最大", "", ""], "r": "ABD", "e": "消费者均衡是指在既定收入和商品价格下，消费者实现效用最大化的状态。此时预算线与无差异曲线相切，切点处两种商品边际替代率等于价格之比，且总效用达到最大。而边际效用为零是总效用达到最大的特殊情况，不是消费者均衡实现条件。所以答案是ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517187", "t": 2, "q": "影响供给变动的非价格因素包括？", "a": ["生产要素价格", "技术水平", "生产者预期", "商品自身价格", "", ""], "r": "ABC", "e": "商品自身价格影响的是供给量变动，而生产要素价格、技术水平、生产者预期等非价格因素会使供给曲线发生移动，影响供给变动。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517188", "t": 2, "q": "下列属于长期成本曲线的有？", "a": ["长期平均成本曲线", "长期边际成本曲线", "长期总成本曲线", "平均固定成本曲线", "", ""], "r": "ABC", "e": "长期成本曲线包括长期总成本曲线、长期平均成本曲线和长期边际成本曲线。平均固定成本曲线是短期成本曲线相关概念。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517189", "t": 2, "q": "消费者的无差异曲线具有的特征有", "a": ["向右下方倾斜", "凸向原点", "任意两条无差异曲线不相交", "离原点越远的无差异曲线代表效用越高", "", ""], "r": "ABCD", "e": "无差异曲线表示能给消费者带来相同效用水平的两种商品的不同组合。它向右下方倾斜体现两种商品替代关系；凸向原点是边际替代率递减规律的反映；任意两条不相交保证效用的唯一性；离原点越远代表商品组合数量越多，效用越高。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517190", "t": 2, "q": "经济增长的衡量指标包括", "a": ["实际国内生产总值增长率", "人均实际国内生产总值增长率", "国民生产总值增长率", "人均国民收入增长率", "", ""], "r": "ABCD", "e": "经济增长衡量指标通常用实际产出增长情况体现，实际国内生产总值、人均实际国内生产总值、国民生产总值、人均国民收入的增长率都能在不同角度反映经济增长。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517191", "t": 2, "q": "下列计入GDP的有？", "a": ["企业生产的用于销售的产品", "居民提供劳务获得的收入", "政府购买的办公用品", "居民购买的股票", "", ""], "r": "ABC", "e": "GDP是国内生产总值，核算的是市场价值的最终产品和服务。A企业生产用于销售的产品有市场价值，算入GDP；B居民提供劳务获得收入，劳务有价值，计入GDP；C政府购买办公用品是政府支出，计入GDP；D居民购买股票是产权转移，未产生新的产品和服务价值，不计入GDP。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517192", "t": 2, "q": "消费者的预算线取决于", "a": ["消费者的收入", "商品的价格", "消费者的偏好", "商品的效用", "", ""], "r": "AB", "e": "预算线表示在消费者的收入和商品价格给定的条件下，消费者的全部收入所能购买到的两种商品的各种组合。所以预算线取决于消费者收入和商品价格。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517193", "t": 2, "q": "短期经济波动的主要影响因素有", "a": ["总需求变动", "总供给变动", "技术进步", "自然灾害", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517194", "t": 2, "q": "边际效用递减规律的适用条件有", "a": ["消费者偏好不变", "商品消费数量连续增加", "商品为单一品种", "消费者收入不变", "", ""], "r": "ABC", "e": "边际效用递减规律是在消费者偏好不变、商品为单一品种且消费数量连续增加的条件下，随着对某商品消费量的增加，消费者从该商品连续增加的每一消费单位中所得到的效用增量即边际效用是递减的。消费者收入并非该规律适用的必要条件。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517195", "t": 2, "q": "下列属于外部经济的有", "a": ["企业研发新技术带动行业技术进步", "养蜂人养蜂促进果树授粉", "工厂排放污水污染河流", "居民在小区种植花草美化环境", "", ""], "r": "ABD", "e": "外部经济是指个体经济活动使他人或社会受益，而受益者无需花费代价。A企业研发带动行业进步、B养蜂促进果树授粉、D居民美化小区环境都使他人或社会受益且受益者未付出代价；C工厂污染河流是外部不经济。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517196", "t": 2, "q": "货币的职能包括", "a": ["价值尺度", "流通手段", "贮藏手段", "支付手段", "", ""], "r": "ABCD", "e": "货币具有价值尺度、流通手段、贮藏手段、支付手段和世界货币五大职能。本题ABCD选项均是货币职能。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517197", "t": 2, "q": "下列属于正外部性的例子有？", "a": ["研发新技术并申请专利", "接种疫苗", "教育", "工厂排放废水", "", ""], "r": "BC", "e": "正外部性是指某个经济行为个体的活动使他人或社会受益，而受益者无须花费代价。 A研发新技术申请专利有排他性，利于自身，不完全体现对社会正外部性。 B接种疫苗不仅保护自己，还降低他人感染风险，有正外部性。 C教育提升个人素质，也有利于社会发展，有正外部性。 D工厂排放废水是负外部性。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517198", "t": 2, "q": "完全竞争市场的条件有", "a": ["厂商数量众多", "产品完全同质", "进出市场自由", "信息完全对称", "", ""], "r": "ABCD", "e": "完全竞争市场需具备厂商数量多、产品同质、进出自由、信息对称等特征。ABCD选项均符合其条件。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517199", "t": 2, "q": "技术进步对经济增长的影响体现在", "a": ["提高生产效率", "增加产品种类", "降低生产成本", "促进产业升级", "", ""], "r": "ABCD", "e": "技术进步能改进生产方法、优化流程，从而提高生产效率，A 正确；可凭借新技术研发出更多新产品，增加产品种类，B 正确；通过技术革新能减少生产中的人力、物力消耗，降低生产成本，C 正确；还能推动传统产业向高端化、智能化等方向发展，促进产业升级，D 正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517200", "t": 2, "q": "完全垄断市场的形成原因有", "a": ["政府特许经营", "专利技术垄断", "自然垄断", "厂商合并形成的垄断", "", ""], "r": "ABCD", "e": "政府特许经营、专利技术垄断、自然垄断以及厂商合并形成的垄断都能使市场形成完全垄断。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517201", "t": 2, "q": "影响需求变动的非价格因素有", "a": ["消费者收入", "商品自身价格", "消费者偏好", "相关商品价格", "", ""], "r": "ACD", "e": "商品自身价格影响的是需求量变动，而不是需求变动。消费者收入、偏好和相关商品价格等非价格因素会使需求曲线发生移动，影响需求变动。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517202", "t": 2, "q": "下列属于紧缩性财政政策的措施有", "a": ["提高个人所得税税率", "减少政府转移支付", "增加国防支出", "发行国债", "", ""], "r": "AB", "e": "紧缩性财政政策是减少政府支出、增加税收以抑制总需求。A提高个人所得税税率会使居民可支配收入减少，消费等需求降低；B减少政府转移支付，居民和企业可获得资金减少，需求也会降低，二者都符合紧缩性财政政策。C增加国防支出是增加政府支出，属扩张性财政政策；D发行国债一般是为筹集资金用于支出，也多是扩张性举措。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517203", "t": 2, "q": "下列关于内生增长理论的说法，正确的有？", "a": ["强调技术进步的内生性", "认为资本积累可以无限增长", "重视人力资本的作用", "认为经济增长是外生因素决定的", "", ""], "r": "ABC", "e": "内生增长理论强调技术进步是内生变量，重视人力资本作用，认为资本积累可推动持续增长。而经济增长由外生因素决定是外生增长理论观点。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517204", "t": 2, "q": "宏观经济的核心指标有", "a": ["国内生产总值", "通货膨胀率", "失业率", "汇率", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517205", "t": 2, "q": "下列关于外部性的说法正确的有", "a": ["正外部性是指私人收益小于社会收益", "负外部性是指私人成本小于社会成本", "正外部性会导致产品供给不足", "负外部性会导致产品供给过多", "", ""], "r": "ABCD", "e": "正外部性中私人收益小于社会收益，会使产品供给不足；负外部性里私人成本小于社会成本，会造成产品供给过多。ABCD表述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517206", "t": 2, "q": "导致市场失灵的因素有？", "a": ["垄断", "外部性", "公共物品", "信息不对称", "", ""], "r": "ABCD", "e": "垄断会限制竞争、外部性使成本或收益外溢、公共物品具有非排他性和非竞争性易搭便车、信息不对称会导致逆向选择和道德风险，这些都会使市场机制不能有效配置资源，造成市场失灵。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517207", "t": 2, "q": "影响失业率的因素有", "a": ["劳动力供给", "劳动力需求", "经济周期", "人口结构", "", ""], "r": "ABCD", "e": "劳动力供给增加可能使失业率上升，需求增加则会降低失业率；经济周期影响企业生产和用工需求，进而影响失业率；人口结构变化如不同年龄段劳动力占比改变也会影响失业率。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517208", "t": 2, "q": "财政政策的工具包括？", "a": ["税收", "政府购买", "转移支付", "国债", "", ""], "r": "ABCD", "e": "财政政策工具是政府为实现既定的政策目标所选择的操作手段。税收可调节经济主体收入；政府购买直接影响社会总需求；转移支付能调节居民收入分配和促进社会公平；国债可筹集资金、调节货币流通。ABCD 四个选项均是财政政策工具。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517209", "t": 2, "q": "通货膨胀的成因包括？", "a": ["需求拉上型通货膨胀", "成本推动型通货膨胀", "结构性通货膨胀", "货币供给不足", "", ""], "r": "ABC", "e": "需求拉上、成本推动、结构因素变动都会引发通胀，而货币供给不足一般会导致通缩而非通胀。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517210", "t": 2, "q": "经济增长的源泉包括", "a": ["资本积累", "劳动力增长", "技术进步", "制度创新", "", ""], "r": "ABCD", "e": "经济增长源泉主要有要素投入增加和生产效率提高。资本积累能提供更多生产资料，劳动力增长增加人力投入，技术进步提升生产效率，制度创新营造良好发展环境促进经济增长。ABCD四个选项都符合。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517211", "t": 2, "q": "下列属于市场机制的核心要素有", "a": ["价格机制", "供求机制", "竞争机制", "风险机制", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517212", "t": 2, "q": "寡头垄断市场的定价方式包括？", "a": ["卡特尔定价", "价格领导制", "弯折的需求曲线模型", "边际成本定价", "", ""], "r": "ABC", "e": "寡头垄断市场定价方式有卡特尔（企业联合制定价格）、价格领导制（一家企业率先定价其他企业跟随）、弯折的需求曲线模型（解释价格刚性）。边际成本定价一般不是寡头垄断市场典型定价方式。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517213", "t": 2, "q": "影响供给的因素有", "a": ["商品自身价格", "生产要素价格", "生产技术水平", "生产者预期", "", ""], "r": "ABCD", "e": "商品自身价格影响供给量，生产要素价格、生产技术水平、生产者预期都会影响供给。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517214", "t": 2, "q": "下列属于货币政策传导机制的环节有？", "a": ["中央银行调整货币政策工具", "货币供应量发生变化", "利率水平发生变化", "总需求和总供给发生变化", "", ""], "r": "ABCD", "e": "货币政策传导机制是中央银行运用货币政策工具影响中介指标，进而最终实现既定政策目标的传导途径与作用机理。央行先调整货币政策工具，接着货币供应量变化，然后利率改变，最后影响总需求和总供给。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517215", "t": 2, "q": "解决信息不对称的方法有", "a": ["政府监管", "信号传递", "第三方认证", "市场自发调节", "", ""], "r": "ABC", "e": "信息不对称会导致市场失灵等问题。政府监管可规范市场信息披露，减少信息不对称；信号传递能让拥有信息的一方把信息传达给缺乏信息的一方；第三方认证可凭借专业权威给出客观信息，降低信息不对称。而市场自发调节在信息不对称情况下常难以有效解决问题。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517216", "t": 2, "q": "消费者偏好的基本假设包括？", "a": ["完备性", "传递性", "非饱和性", "对称性", "", ""], "r": "ABC", "e": "消费者偏好有三个基本假设，完备性指消费者能对所有可能消费组合排序；传递性保证偏好逻辑连贯；非饱和性意味着消费者总偏好更多商品。而对称性并非基本假设。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818424311517217", "t": 2, "q": "下列关于资本边际效率的说法正确的有？", "a": ["资本边际效率是预期利润率", "资本边际效率随着投资增加而递减", "资本边际效率大于利率时，厂商会进行投资", "资本边际效率与投资需求正相关", "", ""], "r": "ABCD", "e": "资本边际效率是一种贴现率，可视为预期利润率，投资增加会使资本边际效率递减，当它大于利率时厂商会投资，且它与投资需求正相关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404608", "t": 3, "q": "厂商的隐成本是指厂商购买生产要素所支付的货币成本。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "厂商的隐成本是指厂商自己所拥有的且被用于该企业生产过程的那些生产要素的总价格，并非购买生产要素支付的货币成本，购买生产要素支付的货币成本是显成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404609", "t": 3, "q": "交叉价格弹性为正值的两种商品互为互补品。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "交叉价格弹性为正值，意味着一种商品价格上升，另一种商品需求量增加，这两种商品是替代品，而非互补品。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404610", "t": 3, "q": "外部经济会导致产品的供给量不足，资源配置效率低下。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外部经济意味着私人收益小于社会收益，生产者由于无法获得全部社会收益，生产积极性受影响，会使产品供给量低于社会最优水平，造成资源配置效率低下。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404611", "t": 3, "q": "完全竞争厂商的长期均衡条件是边际收益等于边际成本，且价格等于平均成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完全竞争厂商长期中，通过调整生产规模及厂商进入退出行业，最终实现均衡时，边际收益等于边际成本以实现利润最大化，同时价格等于平均成本，此时经济利润为零，厂商达到长期稳定状态。", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404612", "t": 3, "q": "寡头垄断厂商之间的合作是稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "寡头垄断厂商各有利益考量，都有通过违约获取更大利益的动机，所以合作往往不稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404613", "t": 3, "q": "需求价格弹性为零的商品，其需求曲线是垂直的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "需求价格弹性为零意味着无论价格如何变动，需求量都固定不变。在坐标图中，需求量不变即对应同一需求量，不同价格对应相同需求量的点连接起来的需求曲线是垂直于横轴的。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404614", "t": 3, "q": "无差异曲线越陡峭，说明消费者对横轴商品的边际替代率越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边际替代率是无差异曲线斜率的绝对值，无差异曲线越陡峭，其斜率绝对值越大，即消费者为获得一单位横轴商品愿意放弃的纵轴商品数量越多，也就是对横轴商品的边际替代率越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404615", "t": 3, "q": "政府购买支出乘数大于转移支付乘数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "政府购买支出直接形成总需求，转移支付先形成居民可支配收入，部分会用于储蓄，对总需求拉动小，所以政府购买支出乘数大于转移支付乘数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404616", "t": 3, "q": "索洛模型中，储蓄率的提高会使稳态人均产出水平提高，但不会改变稳态人均产出增长率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "索洛模型里，储蓄率提高会增加人均资本，从而提高稳态人均产出水平。而在稳态时，人均产出增长率仅取决于技术进步，储蓄率变动不影响稳态人均产出增长率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404617", "t": 3, "q": "菲利普斯曲线在长期是向右下方倾斜的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "长期菲利普斯曲线是垂直的，表明长期中失业与通货膨胀之间不存在替代关系。而向右下方倾斜的是短期菲利普斯曲线。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404618", "t": 3, "q": "纳什均衡一定是占优策略均衡。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "占优策略均衡是指无论其他参与者选择什么策略，某参与者的最优策略都是唯一的，而纳什均衡是指在给定其他参与者策略的情况下，每个参与者都选择了自己的最优策略。存在纳什均衡但不是占优策略均衡的情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404619", "t": 3, "q": "垄断竞争厂商的长期均衡条件是边际收益等于边际成本，且价格等于平均总成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在垄断竞争市场，厂商长期中可自由进出。当有超额利润时新厂商进入，有亏损时部分厂商退出，最终达到长期均衡，此时边际收益等于边际成本以实现利润最大化，同时价格等于平均总成本，经济利润为零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404620", "t": 3, "q": "政府对垄断厂商征税会导致垄断厂商的产量减少，价格上升。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404621", "t": 3, "q": "边际消费倾向越大，乘数效应越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边际消费倾向越大，乘数公式k = 1/(1 - MPC)（MPC为边际消费倾向）中，分母越小，乘数越大，即乘数效应越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404622", "t": 3, "q": "垄断厂商可以任意制定商品价格，不受任何约束。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "垄断厂商虽有定价权，但并非任意定价。其要考虑市场需求、消费者购买力、政府监管等因素，若定价过高，消费者需求会下降，且政府也会对垄断价格进行调控。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404623", "t": 3, "q": "边际收益产品是指增加一单位要素投入所增加的产量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边际收益产品是指增加一单位要素投入所增加的收益，而增加一单位要素投入所增加的产量是边际产量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404624", "t": 3, "q": "完全竞争厂商在长期均衡时只能获得正常利润。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在完全竞争市场，若厂商短期有超额利润，会吸引新厂商进入，市场供给增加使价格下降，利润减少；若短期亏损，部分厂商会退出，市场供给减少使价格上升，亏损减少。长期中，厂商只能获得正常利润，此时经济利润为零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404625", "t": 3, "q": "平均产量达到最大值时，边际产量等于平均产量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在生产理论中，边际产量曲线与平均产量曲线相交于平均产量曲线的最高点，即平均产量达到最大值时，边际产量等于平均产量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404626", "t": 3, "q": "汇率上升（本币升值）会导致出口增加，进口减少。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "汇率上升（本币升值）时，以外币计价的本国商品变贵，外国对本国商品需求降低，出口会减少；而以本币计价的外国商品变便宜，本国对外国商品需求增加，进口会增多。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404627", "t": 3, "q": "生产函数反映的是产量与生产要素投入量之间的技术关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "生产函数就是描述在一定技术条件下，生产要素投入量与所能生产出的最大产量之间的对应关系，体现了产量和生产要素投入量的技术联系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404628", "t": 3, "q": "经济增长的本质是人均产出的持续增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "经济增长通常是指在一个较长的时间跨度上，一个国家人均产出（或人均收入）水平的持续增加。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404629", "t": 3, "q": "长期平均成本曲线是所有短期平均成本曲线的最低点连线。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "长期平均成本曲线是短期平均成本曲线的包络线，并非所有短期平均成本曲线最低点的连线。因为只有在长期平均成本曲线的最低点，才与短期平均成本曲线最低点相切。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404630", "t": 3, "q": "政府发行公债会直接增加货币供应量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "政府发行公债本身不会直接增加货币供应量。公债是政府向社会筹集资金的一种方式，发行公债只是资金在不同主体间的转移，并非创造新货币。若央行直接购买公债，才会增加基础货币从而增加货币供应量，但题干说的是“直接”，这种常规发行公债情况并非直接增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404631", "t": 3, "q": "需求的交叉价格弹性为正，说明两种商品是互补品。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "需求交叉价格弹性为正，意味着一种商品价格上升，另一种商品需求量增加，二者是替代关系，而非互补关系。互补品需求交叉价格弹性为负。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404632", "t": 3, "q": "货币的交易需求与利率正相关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币的交易需求主要取决于收入，人们为满足日常交易而持有的货币量随收入增加而增加，与利率负相关，利率上升时，持有货币机会成本增加，交易需求会减少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404633", "t": 3, "q": "垄断竞争市场中，厂商的产品是完全同质的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "垄断竞争市场中厂商的产品存在差别，并非完全同质，完全同质是完全竞争市场产品的特点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404634", "t": 3, "q": "帕累托最优状态是指社会总福利达到最大的状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "帕累托最优是指资源分配的一种理想状态，即任何改变都不可能使至少一个人的状况变好而又不使任何人的状况变坏，并非社会总福利达到最大的状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404635", "t": 3, "q": "纳什均衡一定是占优策略均衡，但占优策略均衡不一定是纳什均衡。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "占优策略均衡一定是纳什均衡，但纳什均衡不一定是占优策略均衡。因为占优策略是无论其他参与者如何选择，某参与者的最优策略都是固定的，这种情况下达成的均衡必然是纳什均衡；而纳什均衡是在给定其他参与者策略时，每个参与者的策略都是最优的，但不一定是占优策略。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404636", "t": 3, "q": "IS-LM模型中，LM曲线向右上方倾斜表示货币市场均衡时，利率与国民收入呈正相关关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在IS - LM模型里，LM曲线反映货币市场均衡，其方程推导表明利率上升会使投机性货币需求减少，为维持货币市场均衡，交易性货币需求需增加，这意味着国民收入要增加，所以利率与国民收入呈正相关，曲线向右上方倾斜。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404637", "t": 3, "q": "市场失灵时，政府干预一定能提高资源配置效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "市场失灵时，政府干预不一定能提高资源配置效率。政府干预也可能存在信息不充分、决策失误、寻租等问题，导致政府干预失效，无法实现资源的有效配置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404638", "t": 3, "q": "基尼系数越大，说明收入分配越平等。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基尼系数是衡量居民收入分配差异程度的指标，其值越大，表明收入分配差距越大、越不平等。", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404639", "t": 3, "q": "失业率是指失业人口占总人口的比重。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "失业率是指失业人口占劳动人口的比重，而非总人口，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404640", "t": 3, "q": "政府购买支出乘数小于转移支付乘数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "政府购买支出乘数「test/yiwen_img/importSubject/2034818420477923328.png」，转移支付乘数「test/yiwen_img/importSubject/2034818420725387264.png」 （b为边际消费倾向且0 < b < 1），显然政府购买支出乘数大于转移支付乘数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404641", "t": 3, "q": "外部不经济会导致产品的供给量过多，资源配置效率低下。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外部不经济指生产或消费给他人带来损失却不用补偿。生产者仅考虑私人成本，不考虑外部成本，会使产量超过社会最优水平，造成供给过多、资源配置低效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404642", "t": 3, "q": "扩张性货币政策会导致利率上升，投资减少。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "扩张性货币政策是增加货币供应量，市场上货币变多，资金供给增加，会使利率下降。利率下降会降低企业的融资成本，从而刺激投资增加。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404643", "t": 3, "q": "纳什均衡一定是帕累托最优状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "纳什均衡是指在给定其他参与者策略的情况下，每个参与者都选择了最优策略；而帕累托最优是指资源分配的一种理想状态，在不使任何人境况变坏的情况下，不可能再使某些人的处境变好。存在纳什均衡并非帕累托最优的情况，如囚徒困境，其纳什均衡就不是帕累托最优。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404644", "t": 3, "q": "索洛增长模型认为，储蓄率的提高只能在短期提高经济增长率，长期无法影响稳态增长率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "索洛模型中，储蓄率提高会使人均资本增加，短期内产出和经济增长率上升，但长期经济会达到稳态，稳态下经济增长率只取决于技术进步等外生因素，储蓄率不再影响稳态增长率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404645", "t": 3, "q": "经济增长必然带来经济发展。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "经济增长侧重数量，指GDP等总量增加；经济发展内涵更丰富，包括经济结构优化、生活质量提升等。有经济增长不一定有全面的经济发展，比如可能出现“有增长无发展”情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404646", "t": 3, "q": "市场机制能自动解决外部性问题，无需政府干预。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外部性会导致市场失灵，市场机制无法自动有效解决外部性问题，需要政府通过税收、补贴等手段进行干预。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404647", "t": 3, "q": "正外部性导致市场产量高于社会最优产量，负外部性导致市场产量低于社会最优产量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "正外部性下，市场主体未得到全部收益，导致市场产量低于社会最优产量；负外部性下，市场主体未承担全部成本，会使市场产量高于社会最优产量，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404648", "t": 3, "q": "长期中，经济增长的唯一源泉是技术进步。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404649", "t": 3, "q": "边际产量递减规律意味着总产量会一直递减。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边际产量递减规律指在其他条件不变时，一种要素投入增加到一定程度后，边际产量会递减，但在边际产量为正的时候，总产量是递增的，只有当边际产量为负时，总产量才会递减，并非一直递减。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404650", "t": 3, "q": "规模报酬递增意味着长期平均成本曲线递减。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "规模报酬递增指产出增加比例大于要素投入增加比例。这时候增加投入会使平均成本降低，所以长期平均成本曲线是递减的。该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404651", "t": 3, "q": "资本的边际产量递减是边际产量递减规律的体现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边际产量递减规律是指在其他条件不变时，一种投入要素连续等量增加，到一定产值后，所提供的产品的增量就会下降。资本作为一种投入要素，其边际产量递减正是该规律的体现。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404652", "t": 3, "q": "政府购买支出乘数大于转移支付乘数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "政府购买支出直接形成总需求，而转移支付要先形成居民可支配收入，再部分用于消费，对总需求的拉动作用小于政府购买支出，所以政府购买支出乘数大于转移支付乘数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404653", "t": 3, "q": "厂商的边际成本曲线与平均总成本曲线的交点是平均总成本曲线的最低点，也是厂商的收支相抵点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在经济学中，边际成本低于平均总成本时，平均总成本下降；边际成本高于平均总成本时，平均总成本上升，所以二者交点是平均总成本曲线最低点。此时厂商的总收益等于总成本，即收支相抵。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404654", "t": 3, "q": "完全竞争市场中，厂商的平均收益等于边际收益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完全竞争市场里，厂商是价格接受者，价格固定。平均收益是总收益除以产量，即价格；边际收益是增加一单位产量所增加的收益，也等于价格，所以平均收益等于边际收益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404655", "t": 3, "q": "紧缩性货币政策的核心是减少货币供给，提高利率，抑制总需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "紧缩性货币政策通过减少货币供应量，使市场上货币变“紧俏”，资金使用成本上升即利率提高，进而抑制投资和消费等总需求。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404656", "t": 3, "q": "总需求曲线向右下方倾斜是因为利率效应、财富效应和汇率效应。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "利率效应指物价上升使货币需求增加，利率上升，投资减少，总需求降低；财富效应指物价上升使人们持有的财富实际价值下降，消费减少，总需求下降；汇率效应指物价上升使国内产品相对国外产品变贵，净出口减少，总需求减少。这三种效应使得总需求曲线向右下方倾斜。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818426014404657", "t": 3, "q": "边际效用递减规律适用于所有商品，无例外情况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边际效用递减规律并非适用于所有商品，存在一些特殊商品不遵循该规律，如集邮、收藏等，随着拥有数量增加，其边际效用可能递增。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 经济学基础（2）", "n": "基础练习题【含解析】 / 第1章 经济学基础（2）", "qs": [{"id": "2034818429965438976", "t": 1, "q": "消费者剩余是指？", "a": ["消费者实际支付的价格与愿意支付的最高价格之间的差额", "消费者实际获得的效用与期望效用之间的差额", "消费者总收入与总支出之间的差额", "消费者购买商品的总效用与总支出之间的差额", "", ""], "r": "A", "e": "消费者剩余就是消费者愿意支付的最高价格和实际支付价格的差值。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438977", "t": 1, "q": "下列关于外部经济的说法正确的是", "a": ["私人成本大于社会成本", "私人收益大于社会收益", "会导致产品供给过多", "会导致产品需求过多", "", ""], "r": "A", "e": "外部经济时私人成本大于社会成本，私人收益小于社会收益，会使产品供给过少。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438978", "t": 1, "q": "根据序数效用论，消费者对不同商品组合的偏好排序依据是", "a": ["商品的总效用", "商品的边际效用", "商品的效用等级", "商品的价格水平", "", ""], "r": "C", "e": "序数效用论强调消费者能对不同商品组合进行排序，依据是商品的效用等级，而非具体效用数值。A总效用、B边际效用是基数效用论概念；D价格水平与偏好排序无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438979", "t": 1, "q": "下列哪种通货膨胀类型与货币供应量过度增长直接相关", "a": ["成本推动型通货膨胀", "需求拉上型通货膨胀", "结构性通货膨胀", "输入型通货膨胀", "", ""], "r": "B", "e": "需求拉上型通货膨胀是指总需求超过总供给所引起的价格水平的持续显著上涨，货币供应量过度增长会使总需求增加，易引发此类通胀。而成本推动型是成本上升导致，结构性是经济结构变动导致，输入型是国外通胀输入导致。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438980", "t": 1, "q": "中央银行通过卖出有价证券调节货币供应量，属于哪种货币政策工具？", "a": ["法定存款准备金率", "再贴现率", "公开市场业务", "道义劝告", "", ""], "r": "C", "e": "公开市场业务是央行通过买卖有价证券来调节货币供应量。法定存款准备金率是规定商业银行存款准备金比例；再贴现率是央行对商业银行再贴现时的利率；道义劝告是央行的一种非强制性指导。本题央行卖有价证券符合公开市场业务操作。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438981", "t": 1, "q": "消费者效用最大化的均衡条件中，边际替代率MRSxy与商品价格Px、Py的关系是？", "a": ["MRSxy=Px/Py", "MRSxy=Py/Px", "MRSxy=Px+Py", "MRSxy=Px-Py", "", ""], "r": "A", "e": "消费者效用最大化均衡条件是在既定预算约束下，消费者选择的商品组合使得两种商品的边际替代率等于它们的价格之比。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438982", "t": 1, "q": "下列哪项不属于货币政策的中介目标", "a": ["货币供应量", "利率", "基础货币", "国内生产总值", "", ""], "r": "D", "e": "货币政策中介目标需可测、可控且与最终目标密切相关。货币供应量、利率、基础货币都符合这些特点，可作为中介目标。而国内生产总值是宏观经济指标，不是货币政策直接调控和监测的中介目标。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438983", "t": 1, "q": "公共物品的主要特征是？", "a": ["竞争性和排他性", "非竞争性和非排他性", "竞争性和非排他性", "非竞争性和排他性", "", ""], "r": "B", "e": "公共物品具有非竞争性，即一个人消费不影响其他人消费；还具有非排他性，很难排除他人消费。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438984", "t": 1, "q": "在短期总需求-总供给模型中，总需求曲线向右下方倾斜的原因不包括", "a": ["财富效应", "利率效应", "汇率效应", "替代效应", "", ""], "r": "D", "e": "总需求曲线向右下方倾斜基于财富效应、利率效应和汇率效应。替代效应一般用于分析消费者对商品的选择，不是总需求曲线向右下倾斜原因。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438985", "t": 1, "q": "宏观经济政策的\"挤出效应\"是指", "a": ["政府支出增加导致私人投资减少", "税收增加导致私人消费减少", "货币供应量增加导致利率下降", "进口增加导致出口减少", "", ""], "r": "A", "e": "“挤出效应”主要指政府支出增加引起利率上升，进而使私人投资减少。B选项说的是税收影响消费，C选项是货币量与利率关系，D选项是进出口关系，均不符合“挤出效应”概念。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438986", "t": 1, "q": "无差异曲线凸向原点的原因是？", "a": ["商品边际效用递减", "商品边际替代率递减", "消费者偏好不变", "商品价格不变", "", ""], "r": "B", "e": "无差异曲线凸向原点是因为商品边际替代率递减规律，它表明在维持效用水平不变的前提下，随着一种商品消费数量的连续增加，消费者为得到每一单位的这种商品所需要放弃的另一种商品的消费数量是递减的。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438987", "t": 1, "q": "在要素市场中，厂商雇佣劳动的利润最大化原则是？", "a": ["劳动的边际产量等于工资率", "劳动的边际收益产品等于工资率", "劳动的边际成本等于产品价格", "劳动的平均产量等于工资率", "", ""], "r": "B", "e": "厂商雇佣劳动实现利润最大化的条件是劳动的边际收益产品（MRP）等于劳动的边际成本（MCL），在完全竞争要素市场中，劳动的边际成本就是工资率，所以厂商雇佣劳动的利润最大化原则是劳动的边际收益产品等于工资率。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438988", "t": 1, "q": "结构性失业的原因是？", "a": ["经济周期波动", "劳动力供给与需求在技能、地域上不匹配", "工资刚性导致劳动力供给大于需求", "劳动者自愿放弃工作", "", ""], "r": "B", "e": "结构性失业是由于劳动力供给和需求在技能、地域等方面不匹配造成的。A选项经济周期波动导致的是周期性失业；C选项工资刚性致供大于求多是古典失业；D选项劳动者自愿放弃工作是自愿失业。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438989", "t": 1, "q": "下列属于紧缩性货币政策工具的是", "a": ["降低法定存款准备金率", "降低再贴现率", "公开市场上卖出有价证券", "扩大政府购买支出", "", ""], "r": "C", "e": "紧缩性货币政策是减少货币供应量。A降低法定存款准备金率、B降低再贴现率会增加货币供给；D扩大政府购买支出是财政政策，不是货币政策；C公开市场卖出有价证券会回笼货币，减少货币供应量，属紧缩性货币政策。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438990", "t": 1, "q": "下列哪项不属于市场失灵的原因？", "a": ["公共物品", "外部性", "完全竞争", "信息不对称", "", ""], "r": "C", "e": "市场失灵是指市场无法有效率地分配商品和服务的情况，公共物品、外部性、信息不对称都会导致市场机制不能正常发挥作用从而出现市场失灵。而完全竞争是一种理想的市场状态，能实现资源的有效配置，不会导致市场失灵。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438991", "t": 1, "q": "生产要素的边际收益产品是指", "a": ["增加一单位要素投入带来的总产量增加量", "增加一单位要素投入带来的总收益增加量", "增加一单位要素投入带来的平均收益增加量", "要素的边际产量与产品价格的乘积", "", ""], "r": "B", "e": "边际收益产品指增加一单位要素投入所带来的总收益增加量。A选项是边际产量；C选项表述错误；D选项是边际产品价值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438992", "t": 1, "q": "下列哪种情况会导致均衡价格上升，均衡数量减少", "a": ["需求增加，供给减少", "需求减少，供给增加", "需求增加，供给增加", "需求减少，供给减少", "", ""], "r": "A", "e": "需求增加会使需求曲线右移，推动价格上升、数量增加；供给减少会使供给曲线左移，推动价格上升、数量减少。二者共同作用会使均衡价格上升，均衡数量变化不确定，但在本题条件下是减少。而B会使价格下降、数量不确定；C会使数量增加、价格不确定；D会使数量减少、价格不确定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438993", "t": 1, "q": "内生增长理论与索洛模型的主要区别在于？", "a": ["是否考虑资本积累", "是否考虑人口增长", "是否将技术进步内生化", "是否考虑折旧", "", ""], "r": "C", "e": "索洛模型假设技术进步是外生给定的，而内生增长理论将技术进步内生化。A、B、D选项在两者中都有涉及。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438994", "t": 1, "q": "在博弈论中，\"囚徒困境\"的均衡结果属于", "a": ["占优策略均衡", "纳什均衡", "混合策略均衡", "子博弈完美均衡", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438995", "t": 1, "q": "下列哪种市场结构中，厂商的需求曲线与行业需求曲线重合", "a": ["完全竞争市场", "垄断竞争市场", "寡头垄断市场", "完全垄断市场", "", ""], "r": "D", "e": "完全垄断市场中只有一家厂商，它控制了整个行业的生产和销售，所以该厂商的需求曲线就等同于行业需求曲线。而其他市场结构中，厂商众多或有较多替代品等，厂商需求曲线和行业需求曲线不同。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438996", "t": 1, "q": "货币主义学派认为，影响经济增长的关键因素是", "a": ["货币供应量的稳定增长", "政府对经济的干预", "财政政策的积极运用", "技术进步和人力资本积累", "", ""], "r": "A", "e": "货币主义学派强调货币在经济中的重要作用，认为货币供应量的稳定增长对经济增长至关重要。而B选项政府干预、C选项财政政策积极运用是凯恩斯主义强调的；D选项技术进步和人力资本积累是新经济增长理论关注内容。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438997", "t": 1, "q": "等成本线的斜率取决于？", "a": ["商品的价格之比", "生产要素的价格之比", "边际技术替代率", "边际产量之比", "", ""], "r": "B", "e": "等成本线表示既定成本和生产要素价格下，生产者所能购买到的两种生产要素数量的各种组合。其斜率为两种生产要素价格之比的负值。所以等成本线斜率取决于生产要素的价格之比。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438998", "t": 1, "q": "帕累托改进是指", "a": ["一种状态的改变使至少一个人的福利增加，同时没有其他人的福利减少", "一种状态的改变使所有人的福利都增加", "一种状态的改变使部分人的福利增加，部分人的福利减少，但总福利增加", "达到了无法再改善任何人福利的状态", "", ""], "r": "A", "e": "帕累托改进定义为一种状态改变，能让至少一人福利增加，且无其他人福利减少。B选项“所有人福利都增加”要求过高，不符定义；C选项“部分人福利减少”不符合概念；D选项是帕累托最优，并非帕累托改进。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965438999", "t": 1, "q": "IS-LM模型中，IS曲线向右移动的原因可能是？", "a": ["货币供给增加", "政府购买支出增加", "利率上升", "税收增加", "", ""], "r": "B", "e": "IS曲线反映产品市场均衡。政府购买支出增加会使总需求上升，进而使国民收入增加，推动IS曲线右移。货币供给增加影响LM曲线；利率上升是IS曲线移动带来的结果而非原因；税收增加会使总需求下降，IS曲线左移。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439000", "t": 1, "q": "消费者在既定收入下，实现效用最大化时，其预算线与无差异曲线的位置关系是", "a": ["相交", "相切", "相离", "重合", "", ""], "r": "B", "e": "当预算线与无差异曲线相切时，在既定收入下，消费者能获得最大满足即实现效用最大化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439001", "t": 1, "q": "短期总需求曲线向左移动的原因是", "a": ["政府购买增加", "货币供应量增加", "消费者信心下降", "价格水平下降", "", ""], "r": "C", "e": "总需求曲线左移意味着总需求减少。政府购买增加、货币供应量增加会使总需求上升，曲线右移；价格水平下降是沿需求曲线移动；而消费者信心下降会使消费减少，总需求降低，曲线左移。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439002", "t": 1, "q": "某厂商的生产函数为产量等于劳动的零点五次方乘以资本的零点五次方，该厂商的规模报酬类型是", "a": ["规模报酬递增", "规模报酬递减", "规模报酬不变", "无法确定", "", ""], "r": "C", "e": "对于生产函数「test/yiwen_img/importSubject/2034818427255918592.png」，设劳动和资本都变为原来的t倍（t>1），则新产量「test/yiwen_img/importSubject/2034818427507576832.png」，产量与要素同比例变化，所以规模报酬不变。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439003", "t": 1, "q": "下列属于货币政策工具的是", "a": ["税收", "政府购买", "公开市场操作", "转移支付", "", ""], "r": "C", "e": "货币政策工具是中央银行为达到货币政策目标而采取的手段，公开市场操作是央行常用货币政策工具。而税收、政府购买、转移支付属于财政政策手段。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439004", "t": 1, "q": "下列哪种情况实现了帕累托最优？", "a": ["在不使他人福利下降的情况下，无法使任何一个人的福利上升", "社会总福利达到最大", "边际效用等于边际成本", "市场均衡状态", "", ""], "r": "A", "e": "帕累托最优指资源分配的一种理想状态，即在不使任何人境况变坏的情况下，不可能再使某些人的处境变好。A选项符合该定义。社会总福利最大不一定意味着达到帕累托最优；边际效用等于边际成本是厂商利润最大化条件；市场均衡状态也不一定就是帕累托最优。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439005", "t": 1, "q": "当某种商品的互补品价格上升时，该商品的需求曲线会", "a": ["向右平移", "向左平移", "保持不变", "向右上方倾斜", "", ""], "r": "B", "e": "互补品价格上升，会使互补品需求下降，进而该商品需求也下降。需求下降表现为需求曲线向左平移。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439006", "t": 1, "q": "消费者对某商品的需求函数为Q=100-2P，当价格P=20时，需求价格弹性系数为", "a": ["0.5", "0.8", "1.2", "2", "", ""], "r": "B", "e": "需求价格弹性系数公式为「test/yiwen_img/importSubject/2034818427599851520.png」。对Q = 100 - 2P求导得「test/yiwen_img/importSubject/2034818427692126208.png」，当P = 20时，Q = 100 - 2×20 = 60，代入公式可得「test/yiwen_img/importSubject/2034818427822149632.png」，最接近0.8。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439007", "t": 1, "q": "完全垄断厂商的停止生产点是", "a": ["价格低于平均成本", "价格低于平均可变成本", "边际收益小于边际成本", "边际收益等于边际成本", "", ""], "r": "B", "e": "厂商停止生产的关键是看能否弥补可变成本，当价格低于平均可变成本时，生产连可变成本都无法覆盖，继续生产亏损更大，所以会停止生产。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439008", "t": 1, "q": "下列哪种市场结构中，厂商的需求曲线与边际收益曲线重合？", "a": ["垄断竞争市场", "寡头垄断市场", "完全垄断市场", "完全竞争市场", "", ""], "r": "D", "e": "在完全竞争市场中，单个厂商是价格接受者，其面临的需求曲线是一条水平直线，价格等于边际收益，所以厂商的需求曲线与边际收益曲线重合。而垄断竞争、寡头垄断、完全垄断市场，厂商有市场势力，需求曲线向右下方倾斜，边际收益曲线位于需求曲线下方。答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439009", "t": 1, "q": "囚徒困境中，两个囚徒的占优策略均衡结果是？", "a": ["双方都坦白", "双方都不坦白", "一方坦白一方不坦白", "无法确定", "", ""], "r": "A", "e": "在囚徒困境里，无论对方如何选择，每个囚徒选择坦白都能使自己获得相对更优结果，所以双方都会选择坦白。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439010", "t": 1, "q": "国内生产总值（GDP）核算中，下列哪项不计入当期GDP？", "a": ["当期生产的面包", "二手房屋的交易价格", "当期销售的新车", "企业当期生产未销售的存货", "", ""], "r": "B", "e": "GDP是指一定时期内生产的最终产品和服务的市场价值。二手房屋是过去生产的，其交易价格不计入当期GDP；A选项当期生产面包、C选项当期销售新车是当期生产的最终产品，D选项企业当期生产未销售存货也属于当期生产成果，都应计入当期GDP。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818429965439011", "t": 1, "q": "菲利普斯曲线最初反映的是？", "a": ["通货膨胀率与失业率的负相关关系", "通货膨胀率与经济增长率的正相关关系", "失业率与经济增长率的负相关关系", "利率与通货膨胀率的正相关关系", "", ""], "r": "A", "e": "菲利普斯曲线最初表明失业率与货币工资变动率（后延伸为通货膨胀率）呈负相关关系。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445376", "t": 2, "q": "扩张性财政政策可能产生的效应有？", "a": ["刺激经济增长", "增加就业", "引发通货膨胀", "导致贸易逆差扩大", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445377", "t": 2, "q": "下列属于宏观经济失衡的表现有", "a": ["通货膨胀率过高", "失业率高于自然失业率", "国际收支逆差过大", "实际GDP偏离潜在GDP", "", ""], "r": "ABCD", "e": "宏观经济失衡指总供给与总需求不平衡。通货膨胀率过高、失业率高于自然失业率、国际收支逆差过大都体现了宏观经济的不稳定与失衡；实际GDP偏离潜在GDP也表明经济未达理想均衡状态。ABCD四个选项都属于宏观经济失衡的表现。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445378", "t": 2, "q": "下列关于边际效用递减规律的说法，正确的有？", "a": ["边际效用递减是普遍存在的现象", "边际效用递减意味着总效用递减", "边际效用递减规律适用于短期", "边际效用为正时，总效用递增", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445379", "t": 2, "q": "下列计入GDP的项目有？", "a": ["企业生产并销售的汽车", "居民购买的二手房", "政府支付的公务员工资", "企业购买的原材料", "", ""], "r": "AC", "e": "GDP是指一定时期内一个国家（或地区）生产的最终产品和服务的市场价值。A企业生产并销售的汽车是最终产品，计入GDP；C政府支付公务员工资是政府购买服务，计入GDP。B二手房是过去生产的，不计入当期GDP；D企业购买原材料是中间产品，不计入GDP。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445380", "t": 2, "q": "生产要素包括", "a": ["劳动", "资本", "土地", "企业家才能", "", ""], "r": "ABCD", "e": "生产要素是进行生产经营活动时所需要的各种社会资源，劳动、资本、土地和企业家才能都属于生产要素。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445381", "t": 2, "q": "下列关于国民生产总值（GNP）与国内生产总值（GDP）的关系说法正确的有", "a": ["GNP等于GDP加上本国居民在国外的收入减去外国居民在本国的收入", "GDP等于GNP加上外国居民在本国的收入减去本国居民在国外的收入", "GNP衡量的是地域范围的产出", "GDP衡量的是国民范围的产出", "", ""], "r": "AB", "e": "GNP是国民概念，是一个国民范围的产出衡量，等于GDP加上本国居民在国外的收入减去外国居民在本国的收入；GDP是地域概念，衡量的是地域范围的产出。AB表述符合GNP和GDP关系，CD概念说反。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445382", "t": 2, "q": "宏观经济政策的目标包括？", "a": ["经济增长", "充分就业", "物价稳定", "国际收支平衡", "", ""], "r": "ABCD", "e": "宏观经济政策目标主要是为了实现经济稳定、良好运行，经济增长能提升国家经济实力，充分就业可使劳动力资源有效利用、增加居民收入，物价稳定利于经济平稳运行，国际收支平衡对开放经济下的国家经济稳定很关键。ABCD四个选项均是宏观经济政策目标。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445383", "t": 2, "q": "下列属于公共物品的有？", "a": ["国防", "路灯", "义务教育", "电影院放映的电影", "", ""], "r": "ABC", "e": "公共物品具有非竞争性和非排他性。国防、路灯、义务教育都具备这两个特性，是公共物品。而电影院放映的电影具有排他性，不买票不能看，不是公共物品。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445384", "t": 2, "q": "宏观经济政策中的财政政策工具包括", "a": ["政府购买支出", "税收", "公债", "法定存款准备金率", "", ""], "r": "ABC", "e": "财政政策工具是政府为实现一定财政政策目标而采取的各种财政手段和措施。政府购买支出、税收、公债都属于财政政策工具。而法定存款准备金率是货币政策工具，由央行调节。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445385", "t": 2, "q": "下列属于短期成本曲线的有", "a": ["平均固定成本曲线", "平均可变成本曲线", "长期平均成本曲线", "边际成本曲线", "", ""], "r": "ABD", "e": "短期成本曲线包含平均固定成本、平均可变成本、边际成本等曲线。长期平均成本曲线是长期成本相关曲线。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445386", "t": 2, "q": "扩张性宏观经济政策包括", "a": ["降低税率", "增加政府购买", "降低法定存款准备金率", "提高再贴现率", "", ""], "r": "ABC", "e": "扩张性政策是刺激经济增长的政策。A降低税率能让企业和个人留更多钱用于投资和消费；B增加政府购买直接拉动需求；C降低法定存款准备金率，银行可放贷资金增多，刺激经济。而D提高再贴现率会使商业银行融资成本上升，信贷规模收缩，是紧缩性政策。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445387", "t": 2, "q": "下列关于无差异曲线的说法，正确的有？", "a": ["无差异曲线向右下方倾斜", "同一平面上两条无差异曲线不会相交", "无差异曲线越远离原点，效用水平越高", "无差异曲线的斜率为正", "", ""], "r": "ABC", "e": "无差异曲线是用来表示两种商品不同数量组合给消费者带来相同效用的曲线。它向右下方倾斜，斜率为负，意味着增加一种商品消费时要减少另一种商品消费来维持效用不变；同一平面上两条无差异曲线不会相交，否则会违背偏好的可传递性；离原点越远的无差异曲线代表的商品组合数量越多，效用水平越高。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445388", "t": 2, "q": "下列关于边际收益产品的说法正确的有", "a": ["边际收益产品等于边际产量乘以边际收益", "边际收益产品是厂商雇佣要素的边际收益", "边际收益产品曲线是厂商的要素需求曲线", "边际收益产品与边际产品价值是同一概念", "", ""], "r": "ABC", "e": "边际收益产品（MRP）=边际产量（MP）×边际收益（MR），它是厂商增加一单位要素使用所增加的收益，即厂商雇佣要素的边际收益，其曲线反映了厂商在不同要素价格下愿意雇佣的要素数量，是厂商的要素需求曲线。而边际产品价值（VMP）=边际产量（MP）×产品价格（P），只有在完全竞争市场中，MR = P 时，边际收益产品才与边际产品价值相等，二者不是同一概念。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445389", "t": 2, "q": "下列属于古诺模型假设条件的有？", "a": ["市场上只有两家厂商", "厂商生产同质产品", "厂商同时决策产量", "厂商边际成本为零", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445390", "t": 2, "q": "完全垄断市场的形成原因有", "a": ["政府特许经营", "自然垄断", "专利技术垄断", "产品差异化", "", ""], "r": "ABC", "e": "政府特许、自然条件导致的自然垄断、专利技术保护都能形成完全垄断，而产品差异化是垄断竞争的特征，并非完全垄断形成原因。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445391", "t": 2, "q": "菲利普斯曲线的政策含义包括", "a": ["短期内可通过牺牲通货膨胀率降低失业率", "长期内通货膨胀率与失业率无替代关系", "短期内可通过提高通货膨胀率降低失业率", "长期内菲利普斯曲线是垂直的", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445392", "t": 2, "q": "影响供给变动的因素有", "a": ["生产要素价格", "生产技术水平", "商品自身价格", "生产者预期", "", ""], "r": "ABD", "e": "生产要素价格影响生产成本，进而影响供给；生产技术水平提高会增加供给；生产者预期会影响其生产决策从而影响供给。而商品自身价格影响的是供给量变动，不是供给变动。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445393", "t": 2, "q": "短期生产函数中，总产量、平均产量和边际产量的关系包括？", "a": ["边际产量为零时，总产量达到最大值", "边际产量大于平均产量时，平均产量递增", "边际产量小于平均产量时，平均产量递减", "边际产量曲线穿过平均产量曲线的最高点", "", ""], "r": "ABCD", "e": "边际产量为 0 时，意味着增加投入不再使总产量增加，此时总产量达最大；边际产量大于平均产量，会拉高平均产量使其递增，小于则拉低使其递减；边际产量曲线与平均产量曲线相交于平均产量最高点。ABCD 表述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445394", "t": 2, "q": "垄断厂商的定价策略包括", "a": ["单一定价", "一级价格歧视", "二级价格歧视", "三级价格歧视", "", ""], "r": "ABCD", "e": "垄断厂商定价策略多样，单一定价指对所有消费者定统一价格；一级、二、三级价格歧视分别按消费者意愿支付价格、购买数量、不同市场群体来定价。ABCD选项都是常见策略。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445395", "t": 2, "q": "下列属于吉芬商品的特点有", "a": ["是劣质商品", "需求曲线向右上方倾斜", "价格上涨时需求量增加", "收入效应大于替代效应", "", ""], "r": "ABCD", "e": "吉芬商品是一种特殊的劣质商品，其需求曲线向右上方倾斜，意味着价格上涨时需求量增加，这是因为收入效应大于替代效应，导致消费者在价格上升时反而增加购买。ABCD选项均符合吉芬商品特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445396", "t": 2, "q": "下列属于经济增长模型的有", "a": ["哈罗德-多马模型", "索洛模型", "菲利普斯曲线模型", "IS-LM模型", "", ""], "r": "AB", "e": "哈罗德 - 多马模型和索洛模型是经典的经济增长模型，分别从不同角度探讨经济增长。菲利普斯曲线反映失业与通胀关系，IS - LM模型分析产品市场和货币市场均衡，都不属于经济增长模型。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445397", "t": 2, "q": "下列关于洛伦兹曲线和基尼系数的说法正确的有？", "a": ["基尼系数越大，收入分配越不平等", "洛伦兹曲线是衡量收入分配平等程度的曲线", "基尼系数介于0和1之间", "洛伦兹曲线与对角线重合时，基尼系数为1", "", ""], "r": "ABC", "e": "洛伦兹曲线衡量收入分配平等程度，基尼系数介于0和1间，越大越不平等。当洛伦兹曲线与对角线重合，收入完全平等，基尼系数为0。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445398", "t": 2, "q": "下列属于宏观经济政策目标的有", "a": ["经济增长", "物价稳定", "充分就业", "国际收支平衡", "", ""], "r": "ABCD", "e": "宏观经济政策目标主要有四个，即经济增长、物价稳定、充分就业和国际收支平衡。ABCD四个选项均符合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445399", "t": 2, "q": "下列属于消费者均衡条件的有", "a": ["两种商品的边际效用之比等于其价格之比", "边际替代率等于两种商品的价格之比", "总效用达到最大", "消费者的收入全部用于购买商品", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445400", "t": 2, "q": "下列关于规模报酬的说法正确的有", "a": ["规模报酬递增是指产量增加的比例大于要素投入增加的比例", "规模报酬递减是指产量增加的比例小于要素投入增加的比例", "规模报酬不变是指产量增加的比例等于要素投入增加的比例", "规模报酬的变化与边际产量的变化是同一概念", "", ""], "r": "ABC", "e": "规模报酬分递增、递减、不变三种情况，分别对应产量增加比例大于、小于、等于要素投入增加比例，而规模报酬和边际产量是不同概念。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445401", "t": 2, "q": "完全垄断厂商的需求曲线的特点包括？", "a": ["向右下方倾斜", "与边际收益曲线重合", "是市场需求曲线", "斜率为负", "", ""], "r": "ACD", "e": "完全垄断市场中只有一个厂商，所以厂商需求曲线就是市场需求曲线，市场需求曲线一般向右下方倾斜，斜率为负。而边际收益曲线在需求曲线下方，不重合。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445402", "t": 2, "q": "自动稳定器的作用机制包括", "a": ["税收的自动调节", "政府转移支付的自动调节", "公债的自动调节", "货币供给的自动调节", "", ""], "r": "AB", "e": "自动稳定器是经济系统本身存在的一种会减少各种干扰对国民收入冲击的机制，主要通过税收和政府转移支付来实现自动调节。税收在经济繁荣时增加、衰退时减少；政府转移支付在经济衰退时增加、繁荣时减少，以此稳定经济。公债和货币供给并非自动稳定器的作用机制。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445403", "t": 2, "q": "下列属于周期性失业的原因有", "a": ["经济衰退导致需求不足", "技术进步淘汰落后岗位", "劳动力流动导致的短期失业", "经济繁荣期后企业裁员", "", ""], "r": "AD", "e": "周期性失业与经济周期相关。A选项经济衰退需求不足、D选项经济繁荣期后企业裁员，都和经济周期变动有关，是周期性失业原因；B是结构性失业，C是摩擦性失业。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445404", "t": 2, "q": "完全竞争市场的条件包括？", "a": ["大量买者和卖者", "产品同质无差异", "厂商进出市场自由", "信息完全对称", "", ""], "r": "ABCD", "e": "完全竞争市场需具备大量买者和卖者，使单个主体无法影响价格；产品同质无差异，消费者无偏好差异；厂商进出市场自由，资源能自由流动；信息完全对称，交易双方了解各种情况。ABCD选项均符合其条件。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445405", "t": 2, "q": "下列关于通货膨胀的说法正确的有？", "a": ["通货膨胀会导致货币购买力下降", "温和的通货膨胀可能促进经济增长", "恶性通货膨胀会破坏经济秩序", "通货膨胀一定是货币供应量过多导致的", "", ""], "r": "ABC", "e": "通货膨胀表现为物价持续上涨，会使货币购买力下降；温和通胀一定程度上能刺激消费和投资，促进经济增长；恶性通胀会使经济陷入混乱，破坏经济秩序。但通货膨胀不一定仅由货币供应量过多导致，还有需求拉动、成本推动等因素。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445406", "t": 2, "q": "垄断竞争市场的特征有", "a": ["厂商数量较多", "产品存在差异化", "厂商进出市场较容易", "存在一定的市场势力", "", ""], "r": "ABCD", "e": "垄断竞争市场是一种既有竞争又有垄断特点的市场结构。厂商数量多，产品有差异，进出市场较容易，且因产品差异厂商有一定市场势力。ABCD四个选项均符合其特征。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445407", "t": 2, "q": "下列关于消费者剩余的说法正确的有？", "a": ["消费者剩余是消费者实际支付价格与愿意支付价格的差额", "消费者剩余衡量了消费者从交易中获得的额外收益", "需求曲线以下、价格线以上的面积代表消费者剩余", "消费者剩余越大，说明消费者对商品的评价越低", "", ""], "r": "ABC", "e": "消费者剩余是消费者愿意支付价格与实际支付价格的差额，能体现消费者交易额外收益，需求曲线下价格线上面积即代表它，且消费者剩余越大说明对商品评价越高。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445408", "t": 2, "q": "宏观经济政策的\"挤出效应\"是指", "a": ["政府支出增加导致私人投资减少", "政府支出增加导致私人消费减少", "税收增加导致私人投资减少", "税收增加导致私人消费减少", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445409", "t": 2, "q": "信息不对称可能导致的问题有？", "a": ["逆向选择", "道德风险", "市场垄断", "公共物品供给不足", "", ""], "r": "AB", "e": "信息不对称易使掌握信息少的一方做出不利选择即逆向选择，也会让拥有信息优势方做出损人利己行为即道德风险。市场垄断主要源于市场结构等因素，公共物品供给不足和公共物品特性及政府政策相关，与信息不对称关联不大。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818431433445410", "t": 2, "q": "短期总供给曲线的移动因素包括？", "a": ["原材料价格变动", "工资水平变动", "技术进步", "物价水平变动", "", ""], "r": "ABC", "e": "原材料价格、工资水平变动会影响生产成本，技术进步会改变生产效率，这些都会使短期总供给曲线移动；而物价水平变动是沿着短期总供给曲线移动，并非使曲线移动的因素。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399872", "t": 3, "q": "新古典增长模型认为，储蓄率的提高只能带来短期经济增长，无法影响长期经济增长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "新古典增长模型中，储蓄率提高会使人均资本增加，短期内推动经济增长，但长期中经济会达到稳态，人均资本和总产出增长率不再受储蓄率影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399873", "t": 3, "q": "边际替代率递减规律意味着无差异曲线凸向原点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边际替代率递减指在维持效用水平不变时，随着一种商品消费数量增加，消费者为得到一单位该商品所愿意放弃的另一种商品数量递减。这使得无差异曲线斜率绝对值越来越小，呈现凸向原点的形状。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399874", "t": 3, "q": "通货膨胀会导致实际利率上升，名义利率下降。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "通货膨胀情况下，名义利率等于实际利率加上通货膨胀率，通胀时名义利率上升，实际利率通常下降。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399875", "t": 3, "q": "边际消费倾向越大，乘数效应越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "乘数k = 1/(1 - 边际消费倾向)，边际消费倾向越大，分母1 - 边际消费倾向越小，乘数越大，即乘数效应越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399876", "t": 3, "q": "充分就业预算盈余可以消除经济周期对预算盈余的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "充分就业预算盈余是基于充分就业产出水平来计算的预算盈余，排除了实际产出因经济周期波动偏离充分就业产出对预算盈余的影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399877", "t": 3, "q": "失业率为零时，说明经济达到了充分就业。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "充分就业并非意味着失业率为零，因为存在摩擦性失业、结构性失业等自然失业情况，即使经济处于充分就业状态，失业率也不会为零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399878", "t": 3, "q": "GDP是衡量一个国家经济福利的完美指标。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "GDP有局限性，未考虑非市场活动、环境质量、收入分配等影响经济福利的因素，所以不是衡量经济福利的完美指标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399879", "t": 3, "q": "需求价格弹性的绝对值越大，说明商品的需求对价格变动越不敏感。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "需求价格弹性绝对值越大，意味着价格变动一点，需求量变动幅度大，即需求对价格变动越敏感。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399880", "t": 3, "q": "短期中，厂商的平均可变成本曲线是U形的，原因是边际报酬递减规律。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边际报酬递减规律指在其他条件不变时，一种可变要素投入到一定程度后，边际产量会递减。在短期生产中，开始时随着可变要素投入增加，边际产量递增，平均可变成本下降；当可变要素投入超过一定程度，边际产量递减，平均可变成本上升，所以平均可变成本曲线呈U形。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399881", "t": 3, "q": "博弈论中的\"囚徒困境\"表明，个人理性可能导致集体非理性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在“囚徒困境”里，每个囚徒从自身利益出发做出理性选择，最终结果却是整体状况不佳，体现个人理性会引发集体非理性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399882", "t": 3, "q": "正常商品的替代效应和收入效应方向相同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "正常商品价格下降时，替代效应使消费者增加购买，收入效应也使消费者增加购买，二者方向相同；价格上升时同理，替代效应和收入效应都使购买量减少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399883", "t": 3, "q": "短期平均成本曲线总是位于长期平均成本曲线的上方，长期平均成本曲线是短期平均成本曲线的最低点连线。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。长期平均成本曲线是短期平均成本曲线的包络线，但不是短期平均成本曲线最低点的连线。短期平均成本曲线在长期平均成本曲线下方或与它相切，并非总是在其上方。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399884", "t": 3, "q": "短期总供给曲线垂直，长期总供给曲线向上倾斜。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。短期总供给曲线是向上倾斜的，因为短期内价格和工资具有黏性，物价上升时企业会增加供给。而长期总供给曲线是垂直的，因为长期中经济的产出取决于技术、劳动和资本等因素，与物价水平无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399885", "t": 3, "q": "正外部性会导致产品的供给量不足。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "正外部性指某个经济行为个体的活动使他人或社会受益，而受益者无须花费代价。由于正外部性使得私人收益小于社会收益，生产者按私人收益决策时，供给量会低于社会最优水平，导致产品供给量不足。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399886", "t": 3, "q": "摩擦性失业是由于经济结构调整导致的失业，无法通过政策消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "摩擦性失业是劳动者在正常流动过程中产生的失业，如换工作期间的暂时失业，并非经济结构调整导致。且可通过完善就业信息平台等政策减少。题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399887", "t": 3, "q": "名义GDP是用实际价格计算的GDP，实际GDP是用不变价格计算的GDP。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "名义GDP是用生产物品和劳务的当年价格计算的全部最终产品的市场价值；实际GDP是用从前某一年作为基期的价格计算出来的全部最终产品的市场价值，即不变价格。题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399888", "t": 3, "q": "国内生产总值（GDP）是衡量一个国家经济总量的唯一指标。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国内生产总值（GDP）是衡量国家经济状况的重要指标，但不是唯一指标，还有如国民生产总值（GNP）、人均收入、人类发展指数等也可衡量经济总量等情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399889", "t": 3, "q": "要素市场的均衡条件是要素的边际收益产品等于要素的边际成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "厂商使用要素的原则是利润最大化，即要素的边际收益产品（增加一单位要素所增加的收益）等于要素的边际成本（增加一单位要素所增加的成本），此时要素市场达到均衡。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399890", "t": 3, "q": "边际成本曲线一定穿过平均可变成本曲线和平均成本曲线的最低点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边际成本反映每增加一单位产量所增加的成本。当边际成本小于平均可变成本或平均成本时，会拉低它们；当边际成本大于平均可变成本或平均成本时，会抬高它们，所以边际成本曲线必然穿过平均可变成本曲线和平均成本曲线的最低点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399891", "t": 3, "q": "公共物品的供给曲线是个人需求曲线的水平加总。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。公共物品供给曲线是由生产公共物品的边际成本曲线决定，而个人需求曲线水平加总是私人物品的市场需求曲线推导方式。公共物品需求曲线是个人需求曲线垂直加总。所以答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399892", "t": 3, "q": "短期总供给曲线是垂直的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "短期总供给曲线一般是向右上方倾斜的，因为在短期内，价格和工资具有粘性，随着物价水平上升，企业会增加产出。而垂直的是长期总供给曲线，它表示在长期中，经济的产出取决于技术、劳动、资本等要素，与物价水平无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399893", "t": 3, "q": "完全垄断厂商的平均收益曲线与需求曲线重合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完全垄断厂商面临的需求曲线就是市场需求曲线，平均收益等于总收益除以产量，总收益是价格乘以产量，所以平均收益就等于价格，即平均收益曲线与需求曲线重合。", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399894", "t": 3, "q": "政府购买支出乘数大于转移支付乘数，因为政府购买直接计入总需求，而转移支付间接影响总需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "政府购买支出直接形成对产品和服务的需求，直接作用于总需求；转移支付是先成为居民可支配收入，再部分用于消费从而影响总需求，存在漏出。所以政府购买支出乘数大于转移支付乘数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399895", "t": 3, "q": "经济增长的本质是人均产出的持续增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "经济增长通常表现为人均产出的持续增加，它是衡量经济发展的关键指标，反映了生产能力和生活水平的提升。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399896", "t": 3, "q": "边际产量曲线与平均产量曲线相交于平均产量曲线的最低点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边际产量曲线与平均产量曲线相交于平均产量曲线的最高点，而非最低点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399897", "t": 3, "q": "无差异曲线的斜率绝对值是边际替代率，反映消费者愿意用一种商品替代另一种商品的比率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "无差异曲线斜率绝对值就是边际替代率，它体现了在维持效用水平不变时，消费者愿意用一种商品去替代另一种商品的比率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399898", "t": 3, "q": "公共物品的非排他性意味着无法阻止他人免费使用该物品。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "非排他性就是指不能排除其他人消费该物品，即无法阻止他人免费使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399899", "t": 3, "q": "纳什均衡是指在给定其他参与者策略的情况下，每个参与者都选择了最优策略，且没有参与者愿意单独改变策略。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这准确描述了纳什均衡的定义，即各参与者在给定其他参与者策略时选最优策略，且无单独改变策略的意愿。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399900", "t": 3, "q": "等产量线凸向原点是因为边际技术替代率递增。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "等产量线凸向原点是因为边际技术替代率递减，而非递增。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399901", "t": 3, "q": "短期总供给曲线的斜率为正，长期总供给曲线的斜率为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "短期总供给曲线斜率为正，反映物价水平与总供给量同向变动；长期总供给曲线是垂直的，斜率无穷大而非零，它表示长期中总供给不受物价水平影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399902", "t": 3, "q": "长期来看，经济增长的唯一源泉是技术进步。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在长期中，技术进步能提高生产效率、推动产业升级，是经济持续增长的关键因素，虽然资本、劳动等要素也有作用，但技术进步是经济增长的核心和唯一可持续的源泉。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399903", "t": 3, "q": "要素的边际收益产品等于边际产量乘以产品价格。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "要素的边际收益产品（MRP）等于边际产量（MP）乘以边际收益（MR），而非产品价格（P），只有在完全竞争市场中，边际收益等于产品价格，此时该等式才成立，但题干未明确是完全竞争市场。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399904", "t": 3, "q": "消费者的边际效用递减意味着总效用一定递减。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边际效用递减是指在一定时间内，在其他商品的消费数量保持不变的条件下，随着消费者对某种商品消费量的增加，消费者从该商品连续增加的每一消费单位中所得到的效用增量即边际效用是递减的。但只要边际效用为正，总效用就会增加，当边际效用为负时，总效用才会递减。所以仅边际效用递减不能得出总效用一定递减的结论，该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399905", "t": 3, "q": "国际收支平衡表中的经常项目包括贸易收支、劳务收支和资本转移。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际收支平衡表经常项目包括贸易收支、劳务收支、单方面转移，资本转移属于资本和金融项目，并非经常项目。", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399906", "t": 3, "q": "需求价格弹性为无穷大的商品，其需求曲线是水平的，价格微小变动会导致需求量大幅变动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "需求价格弹性无穷大意味着价格稍有变动，需求量就会有极大变化，此时需求曲线呈水平状。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399907", "t": 3, "q": "囚徒困境的均衡结果是帕累托最优的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "囚徒困境中，双方都选择不合作的均衡结果并非帕累托最优，存在其他能使双方状况更好的结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399908", "t": 3, "q": "消费者均衡时，无差异曲线与预算线相切。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在消费者均衡状态下，消费者实现了效用最大化，此时无差异曲线代表消费者偏好的满足程度，预算线表示消费者的购买能力，只有当无差异曲线与预算线相切时，才能达到这种最优状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399909", "t": 3, "q": "生产函数反映的是生产要素投入量与最大产量之间的技术关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "生产函数就是描述在一定技术条件下，各种生产要素投入量的组合与所能生产的最大产量之间的对应关系。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399910", "t": 3, "q": "垄断竞争厂商的产品是完全同质的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "垄断竞争厂商的产品存在差异，并非完全同质，这些差异包括质量、外观、包装、品牌、销售服务等方面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399911", "t": 3, "q": "自然垄断行业的边际成本始终低于平均成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "自然垄断行业规模经济显著，产量增加时平均成本持续下降，边际成本低于平均成本且长期如此。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399912", "t": 3, "q": "替代效应是指商品价格变动导致消费者实际收入变动，进而引起的需求量变动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。替代效应是指一种商品价格变动，会使消费者以相对便宜的商品替代相对昂贵的商品，从而对该商品需求量产生影响，而因商品价格变动导致消费者实际收入变动进而引起的需求量变动是收入效应。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399913", "t": 3, "q": "扩张性财政政策和扩张性货币政策搭配使用，会导致利率上升，刺激经济增长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "扩张性财政政策会使IS曲线右移，导致利率上升、国民收入增加；扩张性货币政策会使LM曲线右移，导致利率下降、国民收入增加。二者搭配使用，国民收入增加刺激经济增长，但利率变动不确定，取决于两种政策力度。所以题干说利率上升错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399914", "t": 3, "q": "消费者均衡时，每种商品的边际效用与价格之比相等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "消费者均衡的条件就是在既定收入和商品价格下，消费者使自己购买的各种商品的边际效用与价格之比相等，这样能实现效用最大化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399915", "t": 3, "q": "总供给曲线在短期是垂直的，在长期是向右上方倾斜的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "总供给曲线在短期是向右上方倾斜的，因为短期内价格和工资调整具有黏性；在长期是垂直的，因为长期中价格和工资能充分调整，产出取决于技术、资本和劳动等因素，与价格水平无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399916", "t": 3, "q": "短期菲利普斯曲线表明，失业率与通货膨胀率之间存在正向相关关系。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "短期菲利普斯曲线表明失业率与通货膨胀率之间存在负向相关关系，即失业率高时，通货膨胀率低；失业率低时，通货膨胀率高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399917", "t": 3, "q": "垄断竞争市场中，厂商的需求曲线是水平的，与完全竞争市场相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "完全竞争市场中厂商是价格接受者，需求曲线是水平的；而垄断竞争市场中厂商有一定的市场势力，能影响价格，其需求曲线是向右下方倾斜的，并非水平。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399918", "t": 3, "q": "公共物品的非排他性意味着任何人都可以免费使用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399919", "t": 3, "q": "寡头垄断市场中，厂商之间的决策是相互独立的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "寡头垄断市场中，厂商数量较少，一家厂商的决策会对其他厂商产生重大影响，所以厂商之间决策相互依存而非独立。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399920", "t": 3, "q": "消费函数中，自发消费与收入水平无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "自发消费是指不取决于收入的那部分消费，即使收入为零也会存在，所以与收入水平无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818432792399921", "t": 3, "q": "转移支付计入GDP。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "GDP是指一定时期内一个国家（或地区）生产的最终产品和服务的市场价值总和。转移支付只是资金的单方面转移，不对应生产活动，没有产生新的价值，所以不计入GDP。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 经济学基础（3）", "n": "基础练习题【含解析】 / 第1章 经济学基础（3）", "qs": [{"id": "2034818435501920256", "t": 1, "q": "下列项目中，不计入国内生产总值（GDP）的是", "a": ["企业生产并销售的机器设备", "居民购买的二手住房", "政府提供的公共教育服务", "居民购买的新汽车", "", ""], "r": "B", "e": "GDP是指一定时期内一个国家（或地区）生产的最终产品和服务的市场价值总和。二手住房在其首次销售时已计入当年GDP，再次交易时不算入，避免重复计算。而企业生产销售的机器设备、政府公共教育服务、居民购买新汽车都属于当期生产的最终产品或服务，应计入GDP。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920257", "t": 1, "q": "实际GDP与名义GDP的区别在于？", "a": ["是否计入政府转移支付", "是否剔除物价变动的影响", "是否计入二手商品交易", "是否计入出口商品", "", ""], "r": "B", "e": "名义GDP按当年价格计算，实际GDP是按基期价格计算，二者区别在于是否剔除物价变动影响。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920258", "t": 1, "q": "根据菲利普斯曲线，短期内通货膨胀率与失业率之间的关系是", "a": ["正相关", "负相关", "无相关", "先正相关后负相关", "", ""], "r": "B", "e": "菲利普斯曲线表明短期内通货膨胀率和失业率存在替代关系，即通货膨胀率上升时失业率下降，二者呈负相关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920259", "t": 1, "q": "下列哪项不属于市场失灵的原因", "a": ["公共物品", "垄断", "完全竞争", "外部性", "", ""], "r": "C", "e": "市场失灵指市场无法有效率地分配商品和劳务的情况，原因包括公共物品、垄断、外部性等。而完全竞争市场中，资源能实现有效配置，不会导致市场失灵。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920260", "t": 1, "q": "在博弈论中，\"子博弈完美纳什均衡\"的核心是", "a": ["排除不可信的威胁", "双方都实现最优策略", "策略组合具有稳定性", "考虑所有可能的策略", "", ""], "r": "A", "e": "子博弈完美纳什均衡是将纳什均衡中包含的不可置信的威胁策略剔除，强调在每个子博弈上都构成纳什均衡，重点在于排除不可信的威胁。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920261", "t": 1, "q": "当商品的需求收入弹性系数为负且绝对值大于1时，该商品属于？", "a": ["正常品中的奢侈品", "正常品中的必需品", "劣等品中的吉芬商品", "劣等品中的普通劣等品", "", ""], "r": "C", "e": "需求收入弹性系数为负说明是劣等品。系数绝对值大于1意味着收入变动引起的需求变动幅度大，吉芬商品是一种特殊劣等品，价格和需求同方向变动且收入效应超过替代效应，需求变动受收入影响大，符合此特征。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920262", "t": 1, "q": "下列属于扩张性财政政策的是", "a": ["提高税率", "减少政府购买支出", "增加转移支付", "提高法定存款准备金率", "", ""], "r": "C", "e": "扩张性财政政策是增支减税。A提高税率会增加财政收入但抑制经济，属紧缩；B减少政府购买支出也是紧缩；C增加转移支付能增加居民可支配收入，刺激消费和经济，是扩张性财政政策；D提高法定存款准备金率是货币政策手段。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920263", "t": 1, "q": "已知某商品的需求价格弹性系数为2.5，当该商品价格下降10%时，其需求量变动情况为？", "a": ["增加25%", "减少25%", "增加2.5%", "减少2.5%", "", ""], "r": "A", "e": "需求价格弹性系数=需求量变动率/价格变动率。已知弹性系数为2.5，价格下降10%，设需求量变动率为x，可得2.5 = x/10%，解得x = 25%。价格下降需求增加，所以需求量增加25%。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920264", "t": 1, "q": "在两部门经济中，国民收入均衡的条件是", "a": ["消费等于储蓄", "投资等于储蓄", "消费等于投资", "总需求等于总供给", "", ""], "r": "B", "e": "两部门经济中，总需求由消费和投资构成，总供给由消费和储蓄构成，国民收入均衡时总需求等于总供给，即消费+投资=消费+储蓄，化简后就是投资等于储蓄。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920265", "t": 1, "q": "政府为了矫正外部不经济，可采取的政策是", "a": ["对生产者给予补贴", "对生产者征税", "降低产品价格", "增加产品供给", "", ""], "r": "B", "e": "外部不经济指生产或消费给他人带来损失却未补偿。对生产者征税可增加其成本，促使其减少产量，降低外部不经济影响。A项补贴会鼓励生产，加剧外部不经济；C项降低价格和D项增加供给都可能使生产规模扩大，加剧问题。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920266", "t": 1, "q": "根据帕累托最优状态的条件，交换的帕累托最优是指", "a": ["两种商品的边际替代率等于其边际转换率", "两种商品的边际替代率对所有消费者都相等", "两种要素的边际技术替代率对所有生产者都相等", "商品的边际收益等于边际成本", "", ""], "r": "B", "e": "交换的帕累托最优强调在交换中，所有消费者对于两种商品的边际替代率相等时实现最优。A是生产和交换的帕累托最优条件；C是生产的帕累托最优条件；D是厂商利润最大化条件。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920267", "t": 1, "q": "国民收入核算中，个人可支配收入等于", "a": ["国内生产总值减去折旧", "国民收入减去个人所得税", "个人收入减去个人所得税", "国民生产总值减去转移支付", "", ""], "r": "C", "e": "个人可支配收入是个人收入扣除个人所得税后可自由支配的部分。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920268", "t": 1, "q": "厂商的平均可变成本（AVC）曲线与平均总成本（ATC）曲线的关系是？", "a": ["AVC曲线始终在ATC曲线上方", "ATC曲线始终在AVC曲线上方", "两曲线相交于AVC曲线的最低点", "两曲线相交于ATC曲线的最高点", "", ""], "r": "B", "e": "平均总成本（ATC）等于平均可变成本（AVC）加上平均固定成本（AFC），平均固定成本始终大于0，所以ATC曲线始终在AVC曲线上方。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920269", "t": 1, "q": "下列属于垄断竞争市场特征的是？", "a": ["产品同质无差异", "厂商进出市场困难", "存在非价格竞争", "只有少数几家厂商", "", ""], "r": "C", "e": "垄断竞争市场产品有差异，厂商进出较容易，有较多厂商，存在非价格竞争如广告等。A是完全竞争市场产品特点；B不符合垄断竞争进出较易特点；D是寡头垄断特点。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920270", "t": 1, "q": "完全竞争市场中，厂商的短期供给曲线是", "a": ["平均成本曲线的上升部分", "平均可变成本曲线的上升部分", "边际成本曲线高于平均可变成本曲线的部分", "边际成本曲线高于平均成本曲线的部分", "", ""], "r": "C", "e": "完全竞争厂商短期生产中，只要价格高于平均可变成本，厂商就会继续生产，此时边际成本曲线高于平均可变成本曲线的部分能反映厂商在不同价格下愿意提供的产量，即短期供给曲线。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920271", "t": 1, "q": "边际效用递减规律是指？", "a": ["随着消费者收入增加，边际效用递增", "随着商品消费量增加，边际效用逐渐减少", "随着商品消费量增加，总效用逐渐减少", "随着商品价格下降，边际效用递增", "", ""], "r": "B", "e": "边际效用递减规律核心是消费商品数量增加时，每增加一单位商品带来的边际效用会逐渐减少。A选项收入与边际效用无此关联；C选项消费量增加总效用一般先增后减，不是逐渐减少；D选项价格与边际效用没有这种必然递增关系。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920272", "t": 1, "q": "根据凯恩斯的消费理论，边际消费倾向的取值范围是", "a": ["大于1", "等于1", "0到1之间", "小于0", "", ""], "r": "C", "e": "边际消费倾向是增加的消费与增加的收入之比率，人们一般不会把增加的收入全用于消费，也不会消费比增加的收入更多，所以其取值在0到1之间。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920273", "t": 1, "q": "当商品的需求弹性为1时，厂商提高价格会导致", "a": ["销售收入增加", "销售收入减少", "销售收入不变", "销售收入先增后减", "", ""], "r": "C", "e": "需求弹性为1时，价格变动的百分比与需求量变动的百分比相同。厂商提高价格，需求量会等比例下降，二者相互抵消，所以销售收入不变。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920274", "t": 1, "q": "凯恩斯短期经济波动模型中，总需求曲线向右下方倾斜的原因不包括？", "a": ["财富效应", "利率效应", "汇率效应", "挤出效应", "", ""], "r": "D", "e": "财富、利率、汇率效应是总需求曲线向右下方倾斜原因；挤出效应是政府支出增加使私人投资减少，与总需求曲线向右下倾斜无关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920275", "t": 1, "q": "索洛增长模型中，稳态时人均产出的增长率取决于？", "a": ["储蓄率", "人口增长率", "技术进步率", "资本折旧率", "", ""], "r": "C", "e": "在索洛增长模型稳态下，人均资本和人均产出不再变化，但技术进步会使人均产出持续增长，所以稳态时人均产出增长率取决于技术进步率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920276", "t": 1, "q": "下列哪项指标能反映一个国家居民的整体收入水平？", "a": ["国内生产总值（GDP）", "人均国内生产总值（人均GDP）", "国民生产总值（GNP）", "人均可支配收入", "", ""], "r": "D", "e": "人均可支配收入是居民可用于最终消费支出和储蓄的总和，能直接体现居民个体可自由支配的收入状况，可反映国家居民整体收入水平。GDP、GNP衡量的是经济总量，人均GDP侧重于平均经济产出，不能精准反映居民实际收入。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920277", "t": 1, "q": "完全竞争市场中，厂商短期均衡的条件是？", "a": ["价格等于平均成本", "价格等于边际成本", "价格等于平均可变成本", "边际收益等于平均收益", "", ""], "r": "B", "e": "完全竞争市场中，厂商利润最大化即短期均衡的条件是边际收益等于边际成本，而完全竞争市场中价格等于边际收益，所以厂商短期均衡条件是价格等于边际成本。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920278", "t": 1, "q": "当两种商品为互补品时，它们的交叉价格弹性系数为？", "a": ["正值", "负值", "零", "无法确定", "", ""], "r": "B", "e": "互补品是指两种商品必须互相配合才能满足消费者的某种需要。一种商品价格上升，会使另一种商品需求量下降，交叉价格弹性系数为负。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920279", "t": 1, "q": "完全竞争市场中，厂商的短期供给曲线是", "a": ["平均成本曲线的上升部分", "平均可变成本曲线的上升部分", "边际成本曲线高于平均可变成本曲线的部分", "边际成本曲线高于平均成本曲线的部分", "", ""], "r": "C", "e": "在完全竞争市场，厂商短期生产决策依据是P≥AVC（价格大于等于平均可变成本），此时厂商才会继续生产。而厂商按MR=MC（边际收益等于边际成本）确定产量，所以短期供给曲线是边际成本曲线高于平均可变成本曲线的部分。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920280", "t": 1, "q": "在短期生产函数中，边际产量曲线与平均产量曲线相交时", "a": ["边际产量达到最大值", "平均产量达到最大值", "总产量达到最大值", "边际产量为零", "", ""], "r": "B", "e": "边际产量曲线与平均产量曲线相交时，平均产量达到最大值。当边际产量大于平均产量时，平均产量递增；当边际产量小于平均产量时，平均产量递减。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920281", "t": 1, "q": "若某国经济处于凯恩斯主义短期波动模型的萧条区间，此时政府采取的扩张性财政政策的主要效果是", "a": ["提高价格水平", "增加国民收入", "提高利率水平", "减少货币供给", "", ""], "r": "B", "e": "在凯恩斯主义短期波动模型的萧条区间，总供给曲线是水平的。扩张性财政政策会使总需求曲线右移，由于供给曲线水平，产出会增加，即增加国民收入，而价格水平不变。提高利率水平是扩张性财政政策可能带来的副作用，但不是主要效果；扩张性财政政策和货币供给无直接关联。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920282", "t": 1, "q": "垄断厂商实行三级价格歧视的前提是", "a": ["不同市场的边际成本相等", "不同市场的需求价格弹性不同", "市场可以被分割且消费者无法套利", "厂商拥有绝对的市场势力", "", ""], "r": "C", "e": "三级价格歧视需市场能分割且消费者无法套利，否则价格差异无法维持。不同市场需求价格弹性不同是实行价格歧视的依据，但前提是市场可分割与无套利。不同市场边际成本相等不是必要前提，厂商有市场势力不一定就满足三级价格歧视条件。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920283", "t": 1, "q": "在其他条件不变的情况下，若某商品的需求价格弹性系数大于一，下列做法能增加厂商总收益的是", "a": ["提高商品价格", "降低商品价格", "保持价格不变", "大幅提高生产成本", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920284", "t": 1, "q": "一般均衡理论的核心是说明？", "a": ["单个市场的均衡状态", "多个市场同时达到均衡的状态", "要素市场的均衡状态", "产品市场的均衡状态", "", ""], "r": "B", "e": "一般均衡理论研究的是所有市场相互联系下多个市场同时达到均衡的情况。A选项单个市场均衡不是其核心；C要素市场和D产品市场均衡只是部分市场均衡，并非核心。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920285", "t": 1, "q": "边际效用递减规律是指", "a": ["随着某种商品消费量的增加，总效用不断减少", "随着某种商品消费量的增加，边际效用不断减少", "随着某种商品消费量的增加，边际效用先增加后减少", "随着某种商品消费量的增加，总效用先减少后增加", "", ""], "r": "B", "e": "边际效用递减规律核心是消费量增加时边际效用不断减少。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920286", "t": 1, "q": "根据菲利普斯曲线，短期内通货膨胀率与失业率的关系是", "a": ["正相关", "负相关", "不相关", "先正相关后负相关", "", ""], "r": "B", "e": "菲利普斯曲线表明短期内，通货膨胀率和失业率之间存在替代关系，即通货膨胀率上升时失业率下降，二者呈负相关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920287", "t": 1, "q": "当边际产量大于平均产量时，平均产量的变化趋势是？", "a": ["递增", "递减", "保持不变", "先增后减", "", ""], "r": "A", "e": "边际产量大于平均产量时，新增加的产量拉高了整体平均水平，所以平均产量递增。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920288", "t": 1, "q": "菲利普斯曲线最初描述的是失业率与哪种经济变量的关系？", "a": ["通货膨胀率", "经济增长率", "利率", "物价水平", "", ""], "r": "A", "e": "菲利普斯曲线最初反映的是失业率和通货膨胀率之间的交替关系。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920289", "t": 1, "q": "下列哪种情况会导致需求曲线向左移动", "a": ["商品自身价格下降", "消费者偏好增强", "相关商品价格上升", "消费者收入减少（正常商品）", "",
