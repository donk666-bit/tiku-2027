中的\"区块链技术\"具有去中心化、不可篡改等特征，其在金融领域的应用不包括？", "a": ["跨境支付结算", "供应链金融确权", "股票价格预测", "数字资产发行与管理", "", ""], "r": "C", "e": "区块链主要用于保证数据安全、透明、可追溯等，跨境支付结算、供应链金融确权、数字资产发行与管理都能借助其特征提升效率和安全性。而股票价格受多种复杂因素影响，难以用区块链技术进行预测。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391649", "t": 1, "q": "货币制度中，规定货币单位的名称和货币单位的价值标准的是（　）", "a": ["货币材料", "货币单位", "通货的铸造、发行与流通", "准备金制度", "", ""], "r": "B", "e": "货币单位规定了货币单位的名称和货币单位的价值标准。货币材料是规定用什么材料充当货币；通货的铸造、发行与流通是关于货币流通的相关规定；准备金制度是为保证货币发行等的相关制度。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391650", "t": 1, "q": "下列关于利息率与货币需求关系的表述中，正确的是？", "a": ["利率上升，货币交易需求增加", "利率上升，货币投机需求减少", "利率下降，货币预防需求减少", "利率下降，货币总需求减少", "", ""], "r": "B", "e": "利率与货币投机需求呈反向变动，利率上升，债券价格下降，人们更倾向持有债券，货币投机需求减少。交易需求和预防需求主要与收入相关。利率下降，货币总需求一般会增加。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391651", "t": 1, "q": "某企业从银行贷款100万元，年利率为6%，按复利计算，3年后应偿还的本利和为（　）", "a": ["118万元", "119.1016万元", "18万元", "118.5408万元", "", ""], "r": "B", "e": "复利本利和公式为「test/yiwen_img/importSubject/2034818495128145920.png」，其中P是本金，r是年利率，n是年数。本题中P = 100万，「test/yiwen_img/importSubject/2034818495430135808.png」，n = 3，代入公式可得「test/yiwen_img/importSubject/2034818495543382016.png」万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442496", "t": 2, "q": "下列金融市场中，属于资本市场的有", "a": ["股票市场", "债券市场", "同业拆借市场", "融资租赁市场", "", ""], "r": "ABD", "e": "资本市场是长期资金市场，交易期限长、风险大、收益高。股票市场、债券市场和融资租赁市场都属于长期资金融通的市场，符合资本市场特征。而同业拆借市场是短期资金市场。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442497", "t": 2, "q": "下列属于资本市场的特点的有？", "a": ["期限长", "流动性强", "风险高", "收益稳定", "", ""], "r": "AC", "e": "资本市场是长期资金市场，期限长，投资时间久不确定性大所以风险高。而流动性强一般是货币市场特点，资本市场流动性相对弱；资本市场受多种因素影响，收益不稳定。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442498", "t": 2, "q": "中央银行的业务活动原则包括？", "a": ["非营利性", "流动性", "主动性", "公开性", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442499", "t": 2, "q": "金融科技在银行业的应用场景包括？", "a": ["智能投顾", "智能风控", "移动支付", "数字货币发行", "", ""], "r": "ABC", "e": "金融科技在银行业应用广泛，智能投顾可借助算法为客户提供投资建议；智能风控利用技术评估和管理风险；移动支付方便客户进行资金交易，这三者都是常见应用场景。而数字货币发行主要由央行主导，并非银行业常规应用场景。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442500", "t": 2, "q": "系统性金融风险的特征包括（　）", "a": ["传染性", "全局性", "突发性", "可控性", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442501", "t": 2, "q": "金融科技的核心技术包括（　）", "a": ["大数据（海量数据处理与分析）", "区块链（分布式账本与去中心化）", "人工智能（智能风控、语音识别）", "云计算（分布式计算与存储）", "", ""], "r": "ABCD", "e": "金融科技核心技术涵盖大数据、区块链、人工智能、云计算等。大数据可处理分析海量数据；区块链是分布式账本且去中心化；人工智能用于智能风控等；云计算能进行分布式计算与存储。ABCD选项均是金融科技核心技术。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442502", "t": 2, "q": "下列属于货币市场工具的有？", "a": ["国库券", "商业票据", "股票", "同业拆借", "", ""], "r": "ABD", "e": "货币市场是短期资金市场，货币市场工具期限短、流动性强、风险低。国库券是短期政府债券；商业票据是企业短期融资工具；同业拆借是金融机构间短期资金融通。而股票无期限，属于资本市场工具。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442503", "t": 2, "q": "利率市场化改革的核心内容包括（　）", "a": ["央行放松对存贷款利率的直接管制", "由市场供求决定利率水平", "央行通过政策工具引导市场利率", "完全取消央行对利率的调控", "", ""], "r": "ABC", "e": "利率市场化是让市场在利率形成中起决定性作用，核心是央行放松对存贷款利率直接管制，由市场供求决定利率水平，央行再通过政策工具引导市场利率，而非完全取消调控。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442504", "t": 2, "q": "下列金融机构中，属于我国政策性银行的有？", "a": ["中国进出口银行", "中国农业发展银行", "国家开发银行", "中国工商银行", "中国邮政储蓄银行", ""], "r": "ABC", "e": "我国政策性银行包括中国进出口银行、中国农业发展银行和已转型为开发性金融机构的国家开发银行。中国工商银行和中国邮政储蓄银行是商业银行。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442505", "t": 2, "q": "下列属于移动支付的特点的有？", "a": ["便捷性", "即时性", "安全性", "地域性", "", ""], "r": "ABC", "e": "移动支付不受地域限制，可随时随地进行，D选项错误；其具有便捷、即时、安全等特点。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442506", "t": 2, "q": "下列关于利息计算方法的表述中，正确的有？", "a": ["单利计息是指仅对本金计算利息，利息不再生息", "复利计息是指本金和前期产生的利息均计算利息", "相同本金和利率下，复利计息的利息总额大于单利计息", "我国商业银行存款均采用单利计息，贷款均采用复利计息", "复利计息仅适用于长期融资，单利计息仅适用于短期融资", ""], "r": "ABC", "e": "A选项单利定义正确；B选项复利定义正确；C选项，相同条件下复利利息总额会大于单利；D我国商业银行存款、贷款都有单利和复利计息情况；E单利、复利长短融资都适用。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442507", "t": 2, "q": "下列属于货币政策传导机制的有（　）", "a": ["利率传导机制", "信贷传导机制", "资产价格传导机制", "汇率传导机制", "", ""], "r": "ABCD", "e": "货币政策传导机制是指货币管理当局确定货币政策目标后，从选用一定的货币政策工具进行操作开始，到实现其最终目标之间，所经过的各种中间环节相互之间的有机联系及因果关系的总和。利率、信贷、资产价格、汇率传导机制都是常见且重要的货币政策传导途径。所以ABCD全选。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442508", "t": 2, "q": "金融风险按来源可分为？", "a": ["信用风险", "市场风险", "操作风险", "流动性风险", "", ""], "r": "ABCD", "e": "金融风险按来源可分为信用风险、市场风险、操作风险等。信用风险是交易对手违约风险；市场风险源于市场价格波动；操作风险由不完善或有问题的内部程序、人为失误等引发。ABCD选项所列举的都是按来源划分的金融风险类型。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442509", "t": 2, "q": "金融风险识别的方法包括（　）", "a": ["财务报表分析法（通过报表识别风险）", "风险清单法（列出常见风险类型）", "情景分析法（模拟不同风险情景）", "历史数据分析法（基于历史数据识别风险）", "", ""], "r": "ABCD", "e": "ABCD选项所描述的方法均是金融风险识别的常见方法。财务报表分析法能从报表发现潜在风险；风险清单法可系统列出各类风险；情景分析法模拟情景来识别可能风险；历史数据分析法依据历史数据判断风险。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442510", "t": 2, "q": "中央银行的一般性货币政策工具包括", "a": ["法定存款准备金率", "公开市场业务", "再贴现率", "消费者信用控制", "", ""], "r": "ABC", "e": "一般性货币政策工具主要有法定存款准备金率、公开市场业务、再贴现率。消费者信用控制属于选择性货币政策工具。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442511", "t": 2, "q": "金融监管的基本原则包括（　）", "a": ["依法监管原则", "适度竞争原则", "风险为本原则", "完全自由原则", "", ""], "r": "ABC", "e": "金融监管需在一定规则下进行，完全自由原则会使金融市场缺乏约束易引发混乱，不符合监管要求。而依法监管可保证监管有法可依；适度竞争能促进金融市场健康发展；风险为本可有效防控金融风险。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442512", "t": 2, "q": "货币政策的最终目标之间可能存在冲突的有（　）", "a": ["稳定物价与充分就业（菲利普斯曲线:通胀与失业反向）", "稳定物价与经济增长（短期增长可能伴随通胀）", "经济增长与国际收支平衡（增长可能增加进口，导致逆差）", "充分就业与国际收支平衡（就业增加可能扩大进口）", "", ""], "r": "ABCD", "e": "ABCD选项所涉及的货币政策最终目标之间都存在冲突。A中稳定物价和充分就业呈反向关系；B短期经济增长易伴随通胀；C经济增长会增加进口影响国际收支平衡；D充分就业会扩大进口影响国际收支。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442513", "t": 2, "q": "中央银行的职能包括（　）", "a": ["发行的银行", "银行的银行", "政府的银行", "企业的银行", "", ""], "r": "ABC", "e": "中央银行有三大职能，即发行的银行（垄断货币发行权）、银行的银行（为商业银行等金融机构提供服务）、政府的银行（为政府提供金融服务等）。企业的银行并非央行职能。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442514", "t": 2, "q": "商业银行的核心业务包括", "a": ["存款业务", "贷款业务", "中间业务", "表外业务", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442515", "t": 2, "q": "下列金融风险中，属于非系统性风险的有", "a": ["信用风险", "操作风险", "利率风险", "流动性风险", "", ""], "r": "ABD", "e": "非系统性风险是个别金融机构或金融资产特有的风险。信用风险是交易对手违约风险，操作风险源于内部管理等问题，流动性风险指资产变现困难等，它们都具有个体性。而利率风险受宏观因素影响，是系统性风险。所以选ABD。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442516", "t": 2, "q": "货币政策的中介目标应具备的特性有（　）", "a": ["可测性", "可控性", "相关性", "抗干扰性", "", ""], "r": "ABCD", "e": "货币政策中介目标需能被准确测量（可测性），央行能对其进行有效控制（可控性），要与最终目标有紧密联系（相关性），且要能抵抗外部干扰，以保证货币政策的有效性。所以ABCD全选。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442517", "t": 2, "q": "金融科技在银行业的行业实践包括（　）", "a": ["智能客服（AI语音/文字服务）", "线上信贷（大数据风控审批）", "区块链跨境汇款", "传统人工柜台取款", "", ""], "r": "ABC", "e": "金融科技强调利用新技术提升金融服务，A的智能客服、B的线上信贷大数据风控审批、C的区块链跨境汇款都运用了科技手段；而D传统人工柜台取款未体现金融科技。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442518", "t": 2, "q": "操作风险的主要成因包括？", "a": ["人为失误", "系统故障", "流程缺陷", "市场波动", "", ""], "r": "ABC", "e": "操作风险是源于不完善或有问题的内部程序、人为失误、系统故障或外部事件所引发的损失风险。市场波动主要影响市场风险，并非操作风险主要成因。ABC选项均属于操作风险主要成因。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442519", "t": 2, "q": "货币均衡的实现条件包括（　）", "a": ["货币供给与货币需求总量平衡", "货币供给与货币需求结构平衡", "利率水平合理", "物价水平稳定", "", ""], "r": "ABC", "e": "货币均衡是货币供给与货币需求的一种对比关系，包括总量和结构的平衡，同时合理的利率水平能调节货币供求实现均衡。物价稳定是货币均衡的表现而非实现条件。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442520", "t": 2, "q": "关于利息本质的理论包括（　）", "a": ["马克思的\"剩余价值分割论\"（利息是剩余价值的一部分）", "西尼尔的\"节欲论\"（利息是节欲的报酬）", "庞巴维克的\"时差论\"（利息是时间偏好的补偿）", "凯恩斯的\"流动性偏好论\"（利息是放弃流动性的报酬）", "", ""], "r": "ABCD", "e": "这几个选项都是不同学者关于利息本质提出的理论。马克思认为利息是剩余价值一部分；西尼尔提出利息是节欲的报酬；庞巴维克提出利息是时间偏好的补偿；凯恩斯认为利息是放弃流动性的报酬。所以ABCD全选。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442521", "t": 2, "q": "金融监管协调机制的作用包括（　）", "a": ["避免监管重叠（如银行与证券业务交叉领域）", "防止监管真空（新兴金融业务无监管）", "统一监管标准（不同机构监管口径一致）", "完全替代各监管机构职能", "", ""], "r": "ABC", "e": "金融监管协调机制可解决监管重叠、真空问题以及统一监管标准，但不能完全替代各监管机构职能。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442522", "t": 2, "q": "金融科技监管的原则包括？", "a": ["包容审慎", "分类监管", "协同监管", "放任自流", "", ""], "r": "ABC", "e": "金融科技监管需兼顾创新与风险防控。包容审慎能鼓励创新并把控风险；分类监管可针对不同类型金融科技业务精准施策；协同监管可整合各方监管力量形成合力。而放任自流会使金融科技行业无序发展，引发风险，不是监管原则。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442523", "t": 2, "q": "影响利率水平的因素包括？", "a": ["平均利润率", "通货膨胀率", "货币政策", "国际利率水平", "", ""], "r": "ABCD", "e": "平均利润率是利率的上限，影响利率高低；通货膨胀率会使实际利率变化，影响名义利率；货币政策如央行调整政策工具会影响利率；国际利率水平会通过资金流动等影响国内利率。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442524", "t": 2, "q": "金融机构的类型包括（　）", "a": ["商业银行", "证券公司", "保险公司", "信托公司", "", ""], "r": "ABCD", "e": "商业银行、证券公司、保险公司、信托公司都属于金融机构不同类型。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442525", "t": 2, "q": "\"金融深化\"的主要内容包括（　）", "a": ["放松利率管制，实现利率市场化", "减少政府对金融市场的干预", "扩大金融机构经营范围", "抑制货币化进程", "", ""], "r": "ABC", "e": "金融深化是指政府放弃对金融市场和金融体系的过度干预，放松对利率和汇率的严格管制，使利率和汇率为反映资金供求和外汇供求对比变化的信号，从而有利于增加储蓄和投资，促进经济增长。A放松利率管制实现利率市场化、B减少政府干预、C扩大金融机构经营范围都符合金融深化内容；D抑制货币化进程与金融深化相悖，金融深化是促进货币化等金融发展。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442526", "t": 2, "q": "下列属于中央银行\"银行的银行\"职能的有？", "a": ["集中保管商业银行的存款准备金", "为商业银行提供再贴现服务", "代理国库收支", "组织商业银行间的清算", "垄断货币发行权", ""], "r": "ABD", "e": "“银行的银行”体现央行与商业银行的关系。A集中保管准备金、B提供再贴现、D组织清算都属于此类。C代理国库收支是“政府的银行”职能，E垄断货币发行权是“发行的银行”职能。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442527", "t": 2, "q": "金融风险度量的常用方法包括", "a": ["方差-协方差法", "历史模拟法", "蒙特卡洛模拟法", "压力测试法", "", ""], "r": "ABCD", "e": "方差 - 协方差法、历史模拟法、蒙特卡洛模拟法和压力测试法都是金融风险度量的常用方法。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442528", "t": 2, "q": "下列属于商业银行业务的有？", "a": ["吸收公众存款", "发放短期、中期和长期贷款", "代理发行、代理兑付政府债券", "办理票据承兑与贴现", "代理买卖外汇", ""], "r": "ABCDE", "e": "这些选项均是商业银行常见业务，A是负债业务，B是资产业务，CDE是中间业务。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442529", "t": 2, "q": "下列属于金融科技监管重点关注的风险领域有？", "a": ["数据安全与个人信息保护风险", "技术漏洞导致的操作风险", "业务创新引发的监管套利风险", "跨境业务带来的监管协同风险", "传统金融业务中的信用风险", ""], "r": "ABCD", "e": "金融科技融合了金融与科技，ABCD四个选项是金融科技发展中特有的风险，是监管重点关注领域。而传统金融业务中的信用风险并非金融科技监管重点关注的独特风险。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818502862442530", "t": 2, "q": "中央银行的货币政策最终目标包括？", "a": ["稳定物价", "充分就业", "经济增长", "国际收支平衡", "", ""], "r": "ABCD", "e": "这四个都是中央银行货币政策最终目标，稳定物价可维持经济平稳；充分就业能促进经济健康发展；经济增长是宏观经济重要目标；国际收支平衡利于经济稳定和汇率稳定。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056576", "t": 3, "q": "根据凯恩斯货币需求理论，当市场利率上升时，人们对货币的投机需求会减少。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "凯恩斯认为，投机动机的货币需求与利率呈反向变动。市场利率上升，债券价格下降，人们预期债券价格会上升，会更多购买债券，减少货币持有，即对货币的投机需求减少。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056577", "t": 3, "q": "市场利率是由政府或中央银行规定的利率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "市场利率是由市场资金供求关系决定的利率，而由政府或中央银行规定的利率是官定利率。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056578", "t": 3, "q": "信用风险是金融市场中最常见、最基本的风险类型。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056579", "t": 3, "q": "商业信用是现代信用体系的基础，银行信用是在商业信用基础上发展起来的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "商业信用是企业之间在商品交易中以延期付款或预收货款等形式提供的信用，它是最早出现的信用形式，是现代信用体系的基础。银行信用是银行等金融机构以货币形式提供的信用，它克服了商业信用在规模、方向和期限上的局限性，是在商业信用基础上发展起来的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056580", "t": 3, "q": "金融市场的风险管理功能仅针对金融机构，与个人无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融市场风险管理功能对金融机构和个人都有作用，个人可通过金融市场分散、转移风险等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056581", "t": 3, "q": "中央银行的\"最后贷款人\"职能，是指央行在商业银行出现流动性危机时，向其提供贷款，以避免银行倒闭引发系统性风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "此表述准确概括了央行“最后贷款人”职能，即央行在商业银行流动性不足面临危机时提供贷款，防止银行倒闭带来系统性风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056582", "t": 3, "q": "中央银行以盈利为主要经营目标，通过开展存贷款业务获取利润。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "中央银行是国家金融管理机构，主要职能是制定和执行货币政策、维护金融稳定等，并非以盈利为目的，不开展存贷款业务获取利润。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056583", "t": 3, "q": "中央银行可以直接对企业和个人发放贷款，以支持实体经济发展。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "中央银行主要职能是制定和执行货币政策、维护金融稳定等，不对企业和个人直接发放贷款，其业务对象主要是金融机构等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056584", "t": 3, "q": "票据贴现是商业银行的资产业务，贴现利率通常低于同期限的贷款利率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "票据贴现是银行买入未到期票据，属于资产业务；因贴现风险相对贷款小，且银行提前扣除利息，所以贴现利率通常低于同期限贷款利率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056585", "t": 3, "q": "货币需求与收入水平呈正相关关系，收入越高，货币需求越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "收入越高，人们的消费、储蓄等经济活动规模通常越大，对货币的交易性、预防性等需求也会增加，所以货币需求与收入水平呈正相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056586", "t": 3, "q": "官定利率是由市场供求关系决定的利率，央行不对其进行干预。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "官定利率是由政府金融管理部门或中央银行确定的利率，并非由市场供求关系决定，会受央行干预。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056587", "t": 3, "q": "大数据技术在金融领域的应用主要是为了提高金融交易的速度，与风险控制无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。大数据技术在金融领域不仅能提高金融交易速度，还在风险控制方面发挥着关键作用。通过对海量数据的分析，可以识别潜在风险、评估信用状况等，辅助金融机构进行风险管控。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056588", "t": 3, "q": "消费信用仅包括商业银行向消费者发放的住房按揭贷款，不涵盖信用卡透支。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "消费信用是指企业、银行和其他金融机构向消费者个人提供的用于生活消费目的的信用，信用卡透支和住房按揭贷款都属于消费信用的范畴。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056589", "t": 3, "q": "不良贷款率越高，说明金融机构的资产质量越好，风险越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不良贷款率是衡量金融机构资产质量的重要指标，不良贷款率越高，意味着金融机构的不良贷款占比越大，资产质量越差，面临的风险越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056590", "t": 3, "q": "再贴现率是中央银行对商业银行发放再贷款时收取的利率，也是央行重要的货币政策工具。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "再贴现是商业银行将未到期票据向央行贴现，再贴现率即央行对商业银行办理再贴现时的利率，它是央行重要货币政策工具，通过调整影响货币供应量等。该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056591", "t": 3, "q": "公开市场业务是中央银行通过调整商业银行法定存款准备金率来调节货币供应量的工具。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "公开市场业务是央行在金融市场买卖有价证券等调节货币量，调整法定存款准备金率是另一货币政策工具，并非公开市场业务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056592", "t": 3, "q": "系统性金融风险具有传染性，单个金融机构的风险可能通过关联交易扩散至整个体系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "系统性金融风险的特点之一就是具有传染性，单个金融机构出现风险，会通过各种关联交易、资金链条等在金融体系内扩散，影响整个体系稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056593", "t": 3, "q": "金融风险的预警是指通过监测风险指标，提前识别风险信号，及时发出预警，为风险处置争取时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融风险预警就是借助对各类风险指标的监测，识别潜在风险信号并提前预警，从而为风险处置预留时间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056594", "t": 3, "q": "货币政策的\"时滞效应\"包括内部时滞和外部时滞，其中内部时滞是指从政策制定到政策实施的时间，外部时滞是指从政策实施到产生效果的时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币政策时滞确实分为内部时滞和外部时滞，题干对二者含义的表述准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056595", "t": 3, "q": "金融发展与经济增长呈正相关关系，即金融发展水平越高，经济增长速度一定越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融发展与经济增长总体呈正相关，但不是绝对的，金融发展水平高时，可能因金融市场不稳定、监管缺失等导致经济增长受影响，并非金融发展水平越高经济增长速度就一定越快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056596", "t": 3, "q": "金融监管的首要目标是促进金融机构盈利。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融监管首要目标是维护金融体系的安全与稳定，而非促进金融机构盈利。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056597", "t": 3, "q": "法定存款准备金率调整对货币供给的影响是即时且剧烈的，因此央行较少频繁使用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "法定存款准备金率变动会引起货币乘数大幅变动，对货币供给影响迅速且力度大，频繁调整易引发经济波动，所以央行较少频繁使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056598", "t": 3, "q": "金融风险的\"风险价值（VaR）\"指标可以预测极端市场情况下的最大损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VaR 是在一定置信水平和持有期内，衡量正常市场情况下可能的最大损失，难以预测极端市场情况的最大损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056599", "t": 3, "q": "公开市场业务是中央银行最灵活、最常用的货币政策工具。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "公开市场业务可由央行主动操作，能根据经济形势微调货币供应量，且操作规模和方向易于控制，所以是央行最灵活、常用的货币政策工具。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056600", "t": 3, "q": "金融风险的\"客观性\"是指金融风险是金融活动的必然产物，只要存在金融活动，就一定存在金融风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融风险是金融活动的内在属性，只要有金融活动，风险就客观存在，无法完全消除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056601", "t": 3, "q": "货币乘数与法定存款准备金率呈正相关关系，法定准备金率越高，货币乘数越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币乘数与法定存款准备金率呈负相关关系，法定准备金率越高，银行可用于放贷的资金越少，货币创造能力越弱，货币乘数越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056602", "t": 3, "q": "金融风险的度量只能采用定量方法，定性方法无效。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融风险度量既可用定量方法，也可用定性方法，二者各有优势，定性方法并非无效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056603", "t": 3, "q": "本位币具有无限法偿能力，即无论支付金额大小，收款人都不得拒绝接受。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "本位币是一个国家的基本货币，在该国具有无限法偿能力，这意味着在任何交易中，不论支付数额多大，用本位币支付时，收款人都必须接受。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056604", "t": 3, "q": "金融抑制是指金融体系发展过度，金融机构数量过多导致的市场混乱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融抑制是政府对金融活动和金融体系过多干预抑制金融发展，而非金融体系发展过度、金融机构数量过多致市场混乱。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056605", "t": 3, "q": "金融科技中的大数据技术，主要用于分析金融数据的结构化信息，对非结构化信息（如客户行为日志）无法处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据技术不仅能处理金融数据的结构化信息，也能处理非结构化信息，像客户行为日志这类非结构化信息也可通过大数据技术进行分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056606", "t": 3, "q": "利息是资金的时间价值，在无风险情况下，利息仅由资金的使用期限决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在无风险情况下，利息不仅取决于资金使用期限，还与本金、利率相关，利息=本金×利率×期限 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056607", "t": 3, "q": "中央银行的货币发行是通过购买政府债券、向商业银行贷款等方式注入市场的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "中央银行主要通过公开市场业务（如购买政府债券）、再贷款（向商业银行贷款）等渠道将货币投入市场。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056608", "t": 3, "q": "法定存款准备金率是央行最常用的货币政策工具，因为其调整对货币供给的影响较为温和，且灵活性高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "法定存款准备金率调整对货币供给影响强烈，缺乏灵活性，不是央行最常用货币政策工具，常用的是公开市场操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056609", "t": 3, "q": "M1的流动性低于M2，因为M2包含了M1以外的定期存款等流动性较差的资产。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "M1流动性高于M2，M1包含流通中现金和企事业单位活期存款等，可直接用于支付；M2包含M1以及定期存款等流动性相对差的资产。所以题干表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056610", "t": 3, "q": "根据货币数量论，若货币流通速度和物价水平不变，货币供给增长率等于经济增长率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币数量论公式为MV = PY （M是货币供给，V是货币流通速度，P是物价水平，Y是实际产出即经济规模）。当V和P不变时，M的增长率就等于Y的增长率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056611", "t": 3, "q": "商业信用是现代经济中最主要的信用形式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现代经济中最主要的信用形式是银行信用，商业信用有一定局限性，如规模和方向受限等，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056612", "t": 3, "q": "信托公司属于商业银行的子公司，主要从事吸收存款和发放贷款业务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信托公司和商业银行是不同类型金融机构，信托公司并非商业银行子公司，且其主要业务是基于信任，管理和运用信托财产，并非吸收存款和发放贷款。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056613", "t": 3, "q": "选择性货币政策工具的作用范围是整个金融体系，而非特定领域。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "选择性货币政策工具是针对某些特殊领域进行调节的政策工具，并非作用于整个金融体系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056614", "t": 3, "q": "商业信用是银行信用的基础，银行信用的出现进一步拓展了商业信用的规模和范围。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "商业信用先于银行信用产生，是银行信用的基础。银行信用克服了商业信用的局限性，在规模、范围和期限上都进一步拓展了商业信用。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056615", "t": 3, "q": "存款保险制度覆盖所有存款类型，包括企业定期存款和居民活期存款，且对所有存款全额赔付。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "存款保险制度并非覆盖所有存款类型，如金融机构同业存款等不在覆盖范围，且不是全额赔付，有最高偿付限额。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056616", "t": 3, "q": "货币乘数与法定存款准备金率呈正相关关系，法定准备金率越高，货币乘数越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。货币乘数与法定存款准备金率呈负相关关系，法定准备金率越高，银行可用于放贷的资金越少，创造货币的能力越弱，货币乘数越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056617", "t": 3, "q": "金融市场的核心功能是资金融通和风险定价。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "本题可根据金融市场核心功能的相关知识来判断。金融市场有多种功能，其中最核心的功能就是资金融通和风险定价。资金融通能使资金从盈余方流向短缺方，实现资源的有效配置；风险定价则是对金融资产的风险进行评估和定价，为投资者提供决策依据。所以“金融市场的核心功能是资金融通和风险定价”这一表述是正确的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056618", "t": 3, "q": "金融发展水平越高，经济增长速度就一定越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融发展水平与经济增长速度并非简单的线性关系，金融发展水平高可能促进经济增长，但还受产业结构、政策、科技创新等多种因素影响，所以不是金融发展水平越高经济增长速度就一定越快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056619", "t": 3, "q": "国家信用的债务人是国家或政府，债权人是社会公众或国外政府。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国家信用是以国家为主体进行的一种信用活动，国家或政府作为债务人通过发行债券等方式向社会公众或国外政府等债权人筹集资金。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818506092056620", "t": 3, "q": "同业拆借市场的利率是金融市场上的基准利率之一，其变动会影响其他金融资产的利率水平。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "同业拆借市场利率能及时反映资金供求关系，是金融市场上具有代表性的利率，常作为基准利率，其变动会对其他金融资产利率产生影响。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 国际金融（1）", "n": "基础练习题【含解析】 / 第3章 国际金融（1）", "qs": [{"id": "2034818511951499264", "t": 1, "q": "根据国际收支的弹性论，货币贬值改善贸易收支的条件是（　）", "a": ["进口需求弹性大于1", "出口需求弹性大于1", "进出口需求弹性之和大于1", "进出口供给弹性之和大于1", "", ""], "r": "C", "e": "弹性论中，货币贬值改善贸易收支需满足马歇尔 - 勒纳条件，即进出口需求弹性之和大于1。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499265", "t": 1, "q": "东南亚金融危机中，导致泰国铢等货币大幅贬值的主要直接原因是", "a": ["国内通货膨胀过高", "国际游资大规模抛售本币", "贸易逆差持续扩大", "经济增长速度放缓", "", ""], "r": "B", "e": "国际游资大规模抛售泰铢等本币，使市场上本币供给大增，供大于求导致货币大幅贬值，这是东南亚金融危机中泰国铢等货币贬值的直接原因。A国内通胀高、C贸易逆差扩大、D经济增速放缓是一些影响因素，但不是直接导致货币大幅贬值的原因。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499266", "t": 1, "q": "国际收支平衡表的记账原则是", "a": ["收付实现制", "权责发生制", "复式记账法", "单式记账法", "", ""], "r": "C", "e": "国际收支平衡表采用复式记账法，即每笔交易都要同时记录借方和贷方，以反映资金的来源和去向。收付实现制和权责发生制是会计核算基础；单式记账法只记录一方，不能准确全面反映国际收支情况。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499267", "t": 1, "q": "下列汇率制度中，本国货币与某一篮子货币保持固定比价的是（　）", "a": ["钉住单一货币汇率制", "爬行钉住汇率制", "篮子钉住汇率制", "管理浮动汇率制", "", ""], "r": "C", "e": "篮子钉住汇率制就是本国货币与某一篮子货币保持固定比价。A选项钉住单一货币汇率制是钉住一种货币；B选项爬行钉住汇率制是汇率按预先宣布的固定范围做较小的定期调整；D选项管理浮动汇率制是汇率有一定浮动且受管理。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499268", "t": 1, "q": "热钱流入对一国经济的主要影响不包括", "a": ["推动资产价格上涨", "增加本币升值压力", "改善国际收支逆差", "增强货币政策独立性", "", ""], "r": "D", "e": "热钱流入会带来大量外币兑换本币，使本币需求增加，推动资产价格上升、加大本币升值压力、改善国际收支逆差，但会干扰国内货币政策实施，削弱货币政策独立性。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499269", "t": 1, "q": "根据国际收支说，若外国价格水平上升，会导致本币（　）", "a": ["升值", "贬值", "不变", "无法判断", "", ""], "r": "A", "e": "外国价格水平上升，外国商品相对变贵，本国商品相对便宜，外国对本国商品需求增加，本国出口增加，外汇供给增多，本币需求增加，本币升值。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499270", "t": 1, "q": "外汇掉期交易中，\"近端交割\"是指（　）", "a": ["交易当日的交割", "交易后第一个营业日的交割", "交易后第二个营业日的交割", "远期期限的交割", "", ""], "r": "C", "e": "外汇掉期交易中，近端交割通常是交易后第二个营业日的交割。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499271", "t": 1, "q": "世界银行的主要贷款对象是", "a": ["发达国家政府", "发展中国家政府", "跨国企业", "国际组织", "", ""], "r": "B", "e": "世界银行宗旨是向成员国提供长期贷款，以促进成员国经济发展，主要贷款对象是发展中国家政府。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499272", "t": 1, "q": "下列不属于外汇风险管理内部策略的是", "a": ["调整贸易结算货币", "优化资产负债结构", "使用外汇期货套期保值", "改变进出口合同条款", "", ""], "r": "C", "e": "外汇风险管理内部策略是企业自身通过经营、财务等手段管理外汇风险。A调整贸易结算货币、B优化资产负债结构、D改变进出口合同条款都属于企业内部可自主操作的策略。而C使用外汇期货套期保值是借助金融市场工具，属于外部策略。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499273", "t": 1, "q": "下列属于长期国际资本流动的是（　）", "a": ["国际短期信贷", "跨国公司直接投资", "外汇投机交易", "短期国债买卖", "", ""], "r": "B", "e": "长期国际资本流动是指期限在一年以上的资本流动。跨国公司直接投资是长期的、稳定的资本投入，属于长期国际资本流动。而国际短期信贷、外汇投机交易、短期国债买卖期限通常较短。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499274", "t": 1, "q": "根据抛补利率平价，若本国利率为5%，外国利率为3%，则本国货币远期汇率的贴水率约为（　）", "a": ["2%", "-2%", "8%", "-8%", "", ""], "r": "A", "e": "抛补利率平价公式表明，本国货币远期贴水率约等于本国利率与外国利率之差。本题中本国利率5%，外国利率3%，两者差值为2%，即本国货币远期汇率贴水率约为2%。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499275", "t": 1, "q": "外汇期权的时间价值会随着到期日的临近而（　）", "a": ["增加", "减少", "不变", "先增后减", "", ""], "r": "B", "e": "外汇期权时间价值是期权价格中超出内在价值的部分，临近到期日，期权可利用的时间变少，不确定性降低，时间价值会减少。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499276", "t": 1, "q": "国际收支平衡表中，货物贸易属于", "a": ["经常账户", "资本账户", "金融账户", "错误与遗漏账户", "", ""], "r": "A", "e": "经常账户包括货物贸易、服务贸易、收益和经常转移，所以货物贸易属于经常账户。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499277", "t": 1, "q": "浮动汇率制度下，汇率变动的主要直接决定因素是", "a": ["政府政策干预", "国际收支状况", "市场外汇供求关系", "两国通货膨胀率差异", "", ""], "r": "C", "e": "在浮动汇率制度下，汇率由市场机制决定。市场外汇供求关系直接影响汇率变动，供大于求时本币升值，供小于求时本币贬值。而政府政策干预并非直接决定因素；国际收支状况会影响外汇供求，但不是直接决定因素；两国通货膨胀率差异是影响汇率的长期因素，也非直接决定因素。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499278", "t": 1, "q": "下列国际资本流动中，属于证券投资的是（　）", "a": ["跨国企业在海外设立子公司", "购买外国政府债券", "向外国企业提供中长期贷款", "跨国企业间的技术转让", "", ""], "r": "B", "e": "证券投资是指投资者通过购买股票、债券、基金等有价证券获得收益。选项B购买外国政府债券属于证券投资。A是直接投资；C是国际信贷；D与资本流动的证券投资无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499279", "t": 1, "q": "根据利率平价理论，若本国利率高于外国利率，则本国货币远期汇率将（　）", "a": ["升水", "贴水", "平价", "无法判断", "", ""], "r": "B", "e": "利率平价理论中，高利率货币远期会贬值，低利率货币远期会升值。本国利率高于外国利率，意味着本国货币远期贬值，外币相对升值，本国货币远期汇率贴水。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499280", "t": 1, "q": "一国国际储备的最优规模应满足（　）", "a": ["能覆盖3个月进口额", "能覆盖6个月进口额", "能覆盖1年进口额", "越多越好", "", ""], "r": "A", "e": "国际储备规模要适度，并非越多越好。一般认为能覆盖3个月进口额是国际储备的最优规模。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499281", "t": 1, "q": "根据资产组合平衡模型，若本国政府增加债券供给，会导致本国债券价格（　）", "a": ["上升，本币升值", "上升，本币贬值", "下降，本币升值", "下降，本币贬值", "", ""], "r": "D", "e": "本国政府增加债券供给，债券市场供大于求，债券价格下降。债券价格下降，本国资产吸引力降低，资金外流，对本币需求减少，本币贬值。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499282", "t": 1, "q": "国际收支平衡表中，单方面转移属于", "a": ["经常账户", "资本账户", "金融账户", "储备资产账户", "", ""], "r": "A", "e": "经常账户包括货物、服务、收入和单方面转移等项目。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499283", "t": 1, "q": "下列汇率制度中，汇率由市场供求决定，但央行偶尔干预的是（　）", "a": ["自由浮动汇率制度", "管理浮动汇率制度", "钉住汇率制度", "爬行钉住汇率制度", "", ""], "r": "B", "e": "管理浮动汇率制度下，汇率由市场供求决定，同时货币当局会根据需要适时干预。自由浮动无央行干预；钉住汇率是钉住某货币保持固定汇率；爬行钉住是汇率根据特定指标小幅度调整。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499284", "t": 1, "q": "下列汇率理论中，属于资产市场说的是（　）", "a": ["弹性价格货币模型", "国际收支说", "购买力平价理论", "利率平价理论", "", ""], "r": "A", "e": "资产市场说强调资产市场在汇率决定中的作用，弹性价格货币模型是资产市场说中重要的理论。而国际收支说从国际收支角度分析汇率，购买力平价理论基于物价水平，利率平价理论基于利率差异，它们不属于资产市场说。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499285", "t": 1, "q": "购买力平价理论认为，汇率的变动源于", "a": ["两国利率水平的差异", "两国物价水平的差异", "两国国际收支状况的差异", "两国货币供应量的差异", "", ""], "r": "B", "e": "购买力平价理论核心是两种货币的汇率由两国货币在各自国内的购买力之比决定，而物价水平影响货币购买力。物价差异会使汇率变动以平衡购买力。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499286", "t": 1, "q": "外汇掉期交易的核心是", "a": ["同时进行两笔方向相反、期限不同的外汇交易", "同时进行两笔方向相同、期限不同的外汇交易", "先买入后卖出同一币种的外汇", "先卖出后买入同一币种的外汇", "", ""], "r": "A", "e": "外汇掉期是在买入或卖出即期外汇的同时，卖出或买入远期外汇，也就是同时进行两笔方向相反、期限不同的外汇交易。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499287", "t": 1, "q": "国际储备中流动性最强的是", "a": ["外汇储备", "黄金储备", "特别提款权", "在IMF的储备头寸", "", ""], "r": "A", "e": "外汇储备可随时用于国际支付和交易，能快速兑换成其他货币，流动性最强。黄金储备变现相对复杂；特别提款权使用受限；在IMF的储备头寸使用也有一定条件。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499288", "t": 1, "q": "国际货币基金组织（IMF）的主要职能不包括（　）", "a": ["促进汇率稳定", "提供短期贷款缓解国际收支失衡", "制定国际贸易规则", "推动国际货币合作", "", ""], "r": "C", "e": "制定国际贸易规则是世界贸易组织的职能，而促进汇率稳定、提供短期贷款缓解国际收支失衡、推动国际货币合作是国际货币基金组织的职能。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499289", "t": 1, "q": "特别提款权的价值是由（　）种货币加权平均计算得出的", "a": ["3", "4", "5", "6", "", ""], "r": "C", "e": "特别提款权货币篮子由美元、欧元、人民币、日元和英镑5种货币组成，其价值由这5种货币加权平均计算得出。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499290", "t": 1, "q": "下列哪种情况会导致一国国际收支顺差（　）", "a": ["进口大于出口", "资本大量外流", "出口大于进口且资本流入增加", "经常转移支出增加", "", ""], "r": "C", "e": "国际收支顺差意味着收入大于支出。出口和资本流入是收入，进口和资本流出是支出。A选项进口大于出口是逆差；B选项资本大量外流会使支出增加，不利于顺差；D选项经常转移支出增加也会使支出增多。而C选项出口大于进口且资本流入增加，会使收入大于支出，导致国际收支顺差。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499291", "t": 1, "q": "根据利率平价理论，若本国利率低于外国利率，且远期汇率为平价，则投资者会（　）", "a": ["在本国投资", "在外国投资", "无套利机会", "不确定", "", ""], "r": "B", "e": "利率平价理论中，当本国利率低于外国利率且远期汇率为平价时，在外国投资能获得更高收益，所以投资者会在外国投资。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499292", "t": 1, "q": "外汇远期合约的约定汇率称为", "a": ["即期汇率", "远期汇率", "交割汇率", "协议汇率", "", ""], "r": "B", "e": "外汇远期合约中约定未来交割时使用的汇率就是远期汇率。即期汇率是当下交易的汇率；交割汇率并非专业术语；协议汇率概念不准确。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499293", "t": 1, "q": "固定汇率制度下，政府维持汇率稳定的主要工具不包括", "a": ["外汇储备干预", "调整国内利率", "实行外汇管制", "任由市场供求决定汇率", "", ""], "r": "D", "e": "固定汇率制度下政府要维持汇率稳定，会采取多种措施。A选项外汇储备干预可调节外汇市场供求稳定汇率；B选项调整国内利率能影响资本流动进而稳定汇率；C选项实行外汇管制可限制外汇交易来维持汇率。而D选项任由市场供求决定汇率是浮动汇率制度的特点，不是固定汇率制度下政府维持汇率稳定的工具。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499294", "t": 1, "q": "短期资本流动中，套利资本流动的主要驱动因素是", "a": ["两国利率差异", "两国物价差异", "汇率变动预期", "经济增长差异", "", ""], "r": "A", "e": "套利资本流动主要是为了获取利差收益，其驱动因素是两国利率差异。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499295", "t": 1, "q": "IMF的主要职能不包括", "a": ["促进汇率稳定", "提供短期贷款弥补国际收支逆差", "制定国际贸易规则", "推动国际货币合作", "", ""], "r": "C", "e": "IMF即国际货币基金组织，主要职能有促进汇率稳定、推动国际货币合作、提供短期贷款弥补国际收支逆差等。而制定国际贸易规则是世界贸易组织（WTO）的职能。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499296", "t": 1, "q": "关于外汇市场的无形市场，下列说法正确的是", "a": ["交易场所固定，有明确的交易时间", "主要通过电话、电报、网络等方式进行交易", "参与者仅限于金融机构", "交易成本高于有形市场", "", ""], "r": "B", "e": "无形市场无固定交易场所和明确交易时间，A错误；其参与者广泛，并非仅限于金融机构，C错误；无形市场交易成本低于有形市场，D错误；无形市场主要通过电话、电报、网络等方式交易，B正确。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499297", "t": 1, "q": "下列不属于国际储备管理原则的是（　）", "a": ["安全性", "流动性", "盈利性", "投机性", "", ""], "r": "D", "e": "国际储备管理要考虑资产安全、能随时变现以及获取收益，所以有安全性、流动性和盈利性原则。而投机性违背了储备管理的稳健要求。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818511951499298", "t": 1, "q": "外汇期权交易中，期权买方最大的损失是", "a": ["合约约定的汇率与市场汇率的差额", "无限额损失", "支付的期权费", "合约金额的一定比例", "", ""], "r": "C", "e": "外汇期权买方购买期权时支付期权费，若市场走势不利，买方可以选择不执行期权，最大损失就是支付的期权费。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562624", "t": 2, "q": "固定汇率制度的优点包括（　）", "a": ["稳定汇率预期", "减少汇率波动风险", "促进国际贸易和投资", "增强货币政策独立性", "", ""], "r": "ABC", "e": "固定汇率制度下汇率相对稳定，能稳定市场对汇率的预期，减少波动风险，利于国际贸易和投资开展。但固定汇率会使货币政策独立性受限。所以ABC是优点。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562625", "t": 2, "q": "短期国际资本流动的特点有（　）", "a": ["流动性强", "期限短", "投机性强", "稳定性高", "", ""], "r": "ABC", "e": "短期国际资本流动时间短，能快速流动和转移，所以流动性强、期限短；其目的常是获取短期差价，投机性强。而稳定性高不符合短期资本流动易受各种因素影响快速变动的特点。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562626", "t": 2, "q": "下列属于外汇市场参与者的有", "a": ["中央银行", "商业银行", "跨国企业", "个人投资者", "", ""], "r": "ABCD", "e": "外汇市场参与者众多。中央银行会参与外汇市场进行汇率调控等；商业银行是外汇交易的重要中介和参与者；跨国企业因国际业务有外汇需求和交易；个人投资者也会参与外汇买卖等交易。ABCD四个选项都属于外汇市场参与者。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562627", "t": 2, "q": "下列属于外汇市场功能的有（　）", "a": ["套期保值", "投机获利", "国际结算", "价格发现", "", ""], "r": "ABCD", "e": "外汇市场有多种功能。套期保值可规避汇率风险；投机获利是投资者利用汇率波动赚取利润；国际结算能满足国际间资金收付；价格发现可形成合理汇率价格。ABCD四个选项均是外汇市场的功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562628", "t": 2, "q": "外汇风险的类型主要有", "a": ["交易风险", "会计风险", "经济风险", "操作风险", "", ""], "r": "ABC", "e": "外汇风险主要包括交易风险、会计风险和经济风险。操作风险是因不完善或有问题的内部程序、员工和信息科技系统，以及外部事件所造成损失的风险，并非外汇风险类型。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562629", "t": 2, "q": "外汇风险管理的外部工具包括", "a": ["外汇远期合约", "外汇期货", "外汇期权", "调整结算货币", "", ""], "r": "ABC", "e": "ABC是金融衍生工具，属于外汇风险管理外部工具；D调整结算货币是企业自身可采取的内部管理手段。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562630", "t": 2, "q": "国际金融危机的传导途径包括（　）", "a": ["贸易传导", "金融传导", "预期传导", "政策传导", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562631", "t": 2, "q": "国际收支平衡表的记账原则包括（　）", "a": ["复式记账原则", "权责发生制原则", "市场价格原则", "单一货币记账原则", "", ""], "r": "ABCD", "e": "国际收支平衡表记账时采用复式记账，每笔交易都要在两个或以上账户记录；按权责发生制记录交易发生时间；用市场价格衡量交易价值；用单一货币（通常是美元）记账。ABCD选项都符合其记账原则。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562632", "t": 2, "q": "影响外汇期权价格的因素包括（　）", "a": ["即期汇率", "执行价格", "到期期限", "汇率波动率", "", ""], "r": "ABCD", "e": "外汇期权价格受多种因素影响。即期汇率变动会改变期权内在价值；执行价格决定期权是否会被执行及收益情况；到期期限越长，期权时间价值越大；汇率波动率越大，期权潜在获利可能性越大，价值越高。ABCD四个选项都会影响外汇期权价格。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562633", "t": 2, "q": "下列关于爬行钉住汇率制的说法，正确的有（　）", "a": ["汇率按预先宣布的固定幅度定期调整", "汇率调整频率较高", "能较好应对通货膨胀差异", "属于固定汇率制的一种", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562634", "t": 2, "q": "下列属于短期国际资本流动的有（　）", "a": ["套利资本流动", "投机资本流动", "直接投资", "贸易融资资本流动", "", ""], "r": "ABD", "e": "短期国际资本流动是指期限为一年或一年以内的资本流动，套利、投机、贸易融资资本流动期限通常较短。而直接投资属于长期资本流动。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562635", "t": 2, "q": "购买力平价理论的主要形式包括", "a": ["绝对购买力平价", "相对购买力平价", "弱购买力平价", "强购买力平价", "", ""], "r": "AB", "e": "购买力平价理论主要有绝对购买力平价和相对购买力平价两种形式。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562636", "t": 2, "q": "根据国际收支说，影响汇率变动的因素有（　）", "a": ["国民收入", "价格水平", "利率", "预期汇率", "", ""], "r": "ABCD", "e": "国际收支说认为，汇率由外汇市场上的供求关系决定，而影响外汇供求的因素包括国民收入、价格水平、利率和预期汇率等。国民收入变动影响进口，价格水平影响进出口竞争力，利率影响资本流动，预期汇率影响投资者决策。所以ABCD选项都对。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513377562637", "t": 2, "q": "次贷危机的传导路径包括", "a": ["房地产市场泡沫破裂", "次级抵押贷款违约率上升", "金融机构资产负债表恶化", "全球流动性紧缩", "", ""], "r": "ABCD", "e": "房地产市场泡沫破裂引发次级抵押贷款违约率上升，进而使金融机构资产负债表恶化，最终导致全球流动性紧缩，这是次贷危机传导路径的逻辑顺序。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756928", "t": 2, "q": "下列属于外汇市场参与者的有（　）", "a": ["中央银行", "商业银行", "跨国公司", "个人投资者", "", ""], "r": "ABCD", "e": "外汇市场参与者众多，中央银行参与以稳定汇率等；商业银行是主要参与者，进行外汇交易等业务；跨国公司因跨国经营有外汇需求；个人投资者也会参与外汇投资等活动。ABCD选项主体都会参与外汇市场交易等。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756929", "t": 2, "q": "外汇风险管理的内部措施包括（　）", "a": ["调整计价货币", "提前或延期结汇", "外汇期权交易", "转移定价", "", ""], "r": "ABD", "e": "外汇风险管理内部措施是企业自身可采取的方法。A调整计价货币、B提前或延期结汇、D转移定价都可由企业自主操作来管理外汇风险。而C外汇期权交易是借助金融市场工具的外部措施。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756930", "t": 2, "q": "下列属于即期外汇交易特点的有", "a": ["交割期限短", "交易金额固定", "汇率由市场供求决定", "主要用于投机目的", "", ""], "r": "AC", "e": "即期外汇交易是指在外汇买卖成交后，原则上在两个工作日内办理交割的外汇交易。其特点是交割期限短，汇率由市场供求决定。交易金额不固定，且主要用于贸易和投资等实际需求而非投机目的。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756931", "t": 2, "q": "外汇远期交易的应用场景包括（　）", "a": ["进出口企业锁定汇率", "投资者对冲汇率风险", "银行调整外汇头寸", "投机者博取汇率差价", "", ""], "r": "ABCD", "e": "外汇远期交易可让进出口企业按约定汇率交易，锁定成本和收益；投资者能借此对冲汇率波动风险；银行可调整外汇头寸，避免汇率变动损失；投机者可根据汇率预期买卖合约博取差价。ABCD选项都属于外汇远期交易的应用场景。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756932", "t": 2, "q": "国际收支平衡表的资本与金融账户包括", "a": ["直接投资", "证券投资", "储备资产", "经常转移", "", ""], "r": "ABC", "e": "资本与金融账户包括资本账户和金融账户，直接投资、证券投资属于金融账户，储备资产是金融账户一部分；经常转移属于经常账户。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756933", "t": 2, "q": "下列属于国际储备资产的有（　）", "a": ["黄金储备", "外汇储备", "特别提款权", "国际货币基金组织储备头寸", "", ""], "r": "ABCD", "e": "国际储备资产包括货币性黄金、外汇储备、特别提款权、在国际货币基金组织的储备头寸。ABCD选项均符合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756934", "t": 2, "q": "国际储备的作用有", "a": ["弥补国际收支逆差", "稳定本国货币汇率", "增强本国国际信誉", "充当对外借款的担保", "", ""], "r": "ABCD", "e": "国际储备可在国际收支出现逆差时用于弥补；能在外汇市场干预以稳定本币汇率；充足储备体现国家经济实力，增强国际信誉；还可作为对外借款担保增强债权人信心。ABCD选项表述均正确。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756935", "t": 2, "q": "国际金融合作的形式包括（　）", "a": ["货币政策协调", "汇率政策协调", "金融监管合作", "国际救援机制", "", ""], "r": "ABCD", "e": "国际金融合作旨在促进全球金融稳定与发展，货币政策协调可避免各国政策冲突，汇率政策协调能稳定汇率，金融监管合作保障金融体系安全，国际救援机制在危机时提供支持，ABCD选项均是常见国际金融合作形式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756936", "t": 2, "q": "国际金融合作的主要领域包括（　）", "a": ["汇率协调", "国际收支调节", "金融监管合作", "货币合作", "", ""], "r": "ABCD", "e": "国际金融合作旨在稳定国际金融秩序等，汇率协调可避免汇率大幅波动，国际收支调节维持各国收支平衡，金融监管合作防范金融风险跨国传导，货币合作利于货币稳定和经济交流。ABCD选项均是重要领域。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756937", "t": 2, "q": "外汇远期交易与外汇期货交易的区别在于", "a": ["合约标准化程度", "交易场所", "交割方式", "信用风险", "", ""], "r": "ABCD", "e": "外汇远期交易是场外交易，合约非标准化，交割和信用风险由双方承担；外汇期货交易在交易所进行，合约标准化，有结算机构降低信用风险，交割多通过对冲。ABCD选项都体现了二者区别。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756938", "t": 2, "q": "国际收支平衡表中的经常账户包括", "a": ["货物贸易收支", "服务贸易收支", "直接投资收支", "单方面转移收支", "", ""], "r": "ABD", "e": "经常账户包括货物贸易收支、服务贸易收支、收益和单方面转移收支等。直接投资收支属于资本和金融账户。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756939", "t": 2, "q": "国际收支平衡表中，经常账户的构成包括（　）", "a": ["货物贸易", "服务贸易", "直接投资", "单方面转移", "", ""], "r": "ABD", "e": "经常账户主要反映一国与他国之间实际资源的转移，包括货物贸易、服务贸易、收益和单方面转移。直接投资属于资本与金融账户。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756940", "t": 2, "q": "国际储备的来源包括（　）", "a": ["国际收支顺差", "中央银行外汇干预买入的外汇", "IMF分配的特别提款权", "政府对外借款", "", ""], "r": "ABCD", "e": "国际收支顺差会使外汇储备增加；央行外汇干预买入外汇直接增加储备；IMF分配的特别提款权是储备构成；政府对外借款也能增加储备。ABCD四个选项均是国际储备的来源。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756941", "t": 2, "q": "下列属于固定汇率制优点的有（　）", "a": ["稳定汇率预期", "减少汇率波动风险", "有利于国际贸易和投资", "增强货币政策独立性", "", ""], "r": "ABC", "e": "固定汇率制下汇率相对固定，利于稳定汇率预期，减少汇率波动带来的风险，对国际贸易和投资有积极作用。而固定汇率制会削弱货币政策独立性。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756942", "t": 2, "q": "影响国际储备适度规模的因素有（　）", "a": ["国际收支波动幅度", "对外开放程度", "汇率制度类型", "国际融资能力", "", ""], "r": "ABCD", "e": "国际收支波动大、对外开放程度高、汇率制度稳定性差、国际融资能力弱时，都需要更多国际储备。ABCD选项均会影响国际储备适度规模。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756943", "t": 2, "q": "导致金融危机的内部因素有（　）", "a": ["金融机构过度杠杆化", "资产价格泡沫", "汇率制度不合理", "国际资本大规模撤离", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756944", "t": 2, "q": "下列属于外汇交易中的衍生工具的有（　）", "a": ["外汇远期", "外汇期货", "外汇期权", "外汇即期", "", ""], "r": "ABC", "e": "外汇即期是指外汇买卖成交后，交易双方于当天或两个交易日内办理交割手续的一种交易行为，不属于衍生工具。而外汇远期、外汇期货、外汇期权是在外汇基础上衍生出来的金融工具。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756945", "t": 2, "q": "国际收支经常账户包括的子账户有（　）", "a": ["货物账户", "服务账户", "收入账户", "经常转移账户", "", ""], "r": "ABCD", "e": "国际收支经常账户反映一国与他国之间实际资源的转移，包括货物、服务、收入和经常转移四个子账户。ABCD四个选项都符合。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756946", "t": 2, "q": "外汇期权的要素包括", "a": ["期权买方", "期权卖方", "执行价格", "到期日", "", ""], "r": "ABCD", "e": "外汇期权交易涉及买卖双方，期权买方有权按约定行事，卖方有履约义务；执行价格是期权行使时的交易价格；到期日规定了期权的有效期限，这四个都是外汇期权要素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818513381756947", "t": 2, "q": "影响汇率制度选择的因素有", "a": ["经济开放度", "经济规模", "通货膨胀率差异", "金融市场发育程度", "", ""], "r": "ABCD", "e": "经济开放度高、经济规模小、通胀率差异大、金融市场发育程度低等情况会影响汇率制度的选择。ABCD选项分别从不同方面对汇率制度选择产生影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577280", "t": 3, "q": "外债负债率是指外债余额与当年出口外汇收入的比率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外债负债率是外债余额与国内生产总值的比率，而外债余额与当年出口外汇收入的比率是外债偿债率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577281", "t": 3, "q": "IMF的贷款主要用于弥补成员国的财政赤字", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "IMF（国际货币基金组织）贷款主要是帮助成员国调节国际收支失衡，稳定汇率等，并非主要用于弥补财政赤字。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577282", "t": 3, "q": "资产市场说认为，汇率是所有金融资产市场均衡的结果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资产市场说将汇率看成是一种资产价格，认为汇率由资产市场供求决定，是所有金融资产市场均衡的结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577283", "t": 3, "q": "外汇储备是国际储备的唯一形式", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际储备包括外汇储备、黄金储备、特别提款权、在国际货币基金组织的储备头寸等多种形式，并非只有外汇储备。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577284", "t": 3, "q": "会计风险是指企业在进行会计报表折算时，由于汇率变动导致资产负债表项目账面价值变动的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计风险就是企业在进行会计报表折算时，因汇率变动使资产负债表项目账面价值发生变动而带来的风险。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577285", "t": 3, "q": "爬行钉住汇率制度下，汇率调整的幅度较大且频繁。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "爬行钉住汇率制度下，汇率是按预先宣布的固定范围做较小的、经常性的调整，并非幅度较大且频繁。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577286", "t": 3, "q": "国际直接投资的核心是控制权", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际直接投资本质上是投资者对国外企业拥有控制权，能在经营管理等方面施加影响，所以核心是控制权。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577287", "t": 3, "q": "资产市场说将汇率视为资产的价格", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资产市场说把汇率看成是一种资产价格，认为汇率由资产市场供求决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577288", "t": 3, "q": "国际收支平衡表中的错误与遗漏账户是人为设置的，用于抵消统计误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际收支平衡表在统计过程中会因资料来源不一、统计时间和计价标准不同等产生误差，所以人为设置错误与遗漏账户来抵消这些统计误差。", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577289", "t": 3, "q": "远期汇率高于即期汇率时称为贴水", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "远期汇率高于即期汇率时称为升水，低于即期汇率才称为贴水。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577290", "t": 3, "q": "自由浮动汇率制下，政府完全不干预外汇市场。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577291", "t": 3, "q": "折算风险只影响企业的会计报表，不影响实际经营成果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "折算风险主要是因汇率变动对企业会计报表进行外币折算时产生的账面损益，不涉及企业真实的现金流量和实际经营交易，所以不影响实际经营成果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577292", "t": 3, "q": "利率平价理论认为，高利率货币远期升水", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "利率平价理论中，高利率货币远期是贴水，低利率货币远期升水，所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577293", "t": 3, "q": "国际货币基金组织的贷款主要用于解决成员国的长期国际收支困难和经济发展资金需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际货币基金组织的贷款主要是为成员国提供短期资金，帮助其解决国际收支的暂时困难，而非长期国际收支困难和经济发展资金需求。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577294", "t": 3, "q": "国际收支平衡表的经常账户差额与资本与金融账户差额之和始终为零，无需误差与遗漏账户调节。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "按照国际收支平衡表的编制原则，理论上经常账户差额与资本与金融账户差额之和应为零，但实际中由于数据来源多样、统计时间和口径差异等，会存在统计误差，所以需要误差与遗漏账户来进行调节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577295", "t": 3, "q": "外汇期货交易的违约风险高于远期外汇交易。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇期货交易有交易所作为中介，有保证金制度等保障履约，违约风险低；而远期外汇交易是买卖双方直接交易，缺乏有效担保机制，违约风险高。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577296", "t": 3, "q": "根据利率平价理论，无抛补利率平价更适用于有套期保值需求的投资者。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "有套期保值需求的投资者会进行抛补操作，抛补利率平价更适用于他们；无抛补利率平价适用于无套期保值需求、根据自己对未来汇率变动的预期来进行投资的投资者。所以该表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577297", "t": 3, "q": "金融危机一定伴随着货币贬值", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融危机有多种类型，并非所有金融危机都会导致货币贬值，比如一些局部金融机构危机等可能不直接引发货币贬值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577298", "t": 3, "q": "外汇期权的卖方需要支付期权费，同时享有是否执行合约的选择权。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇期权中，买方支付期权费并享有是否执行合约的选择权，卖方收取期权费但有义务按约定履约。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577299", "t": 3, "q": "长期资本流动的期限通常在一年以上，包括直接投资、证券投资和国际贷款等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "长期资本流动指期限在一年以上的资本流动，其主要形式有直接投资、证券投资和国际贷款等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577300", "t": 3, "q": "国际收支顺差会导致本国货币升值压力，进而抑制出口。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际收支顺差意味着外汇供给增加，外汇供大于求会使外汇价格下降，本币相对升值。本币升值后，以外币计价的本国商品变贵，外国购买成本增加，从而抑制出口。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577301", "t": 3, "q": "国际收支平衡表中，贷方记录资产的增加", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际收支平衡表中，贷方记录资产的减少、负债的增加；借方记录资产的增加、负债的减少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577302", "t": 3, "q": "篮子钉住汇率制下，本币与多种货币的汇率保持固定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577303", "t": 3, "q": "国际储备中的黄金储备在现代经济中仍具有保值避险功能，是各国储备的重要组成部分。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "黄金具有稳定的物理和化学性质，在全球范围内被广泛认可，能抵御通货膨胀和政治经济动荡带来的风险，是各国国际储备的重要组成部分。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577304", "t": 3, "q": "外汇期权的内在价值不可能为负数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇期权内在价值是期权立即行权能获得的收益，收益最小为0，不会是负数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577305", "t": 3, "q": "国际收支平衡是指经常账户与资本账户同时平衡", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际收支平衡是指自主性交易的差额为零，并非要求经常账户与资本账户同时平衡，实际中经常账户和资本账户往往一顺一逆相互补充。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577306", "t": 3, "q": "长期资本流动的期限通常在一年以上", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "长期资本流动指的就是期限在一年以上或未规定期限（如股票）的资本流动。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577307", "t": 3, "q": "国际收支平衡表中的资本账户主要记录直接投资、证券投资等金融资产的跨境流动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际收支平衡表中资本账户主要记录资本转移和非生产、非金融资产的收买或放弃，金融资产跨境流动是金融账户记录内容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577308", "t": 3, "q": "外汇即期交易的交割日通常为交易当天（T+0）或交易后第一个工作日（T+1）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇即期交易交割日一般是交易后第二个工作日（T + 2），而非交易当天（T+0）或交易后第一个工作日（T+1）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577309", "t": 3, "q": "浮动汇率制度下，国际收支失衡可通过汇率自动调节。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在浮动汇率制度下，当国际收支出现失衡时，外汇市场供求变化会使汇率相应变动。如国际收支逆差，外汇需求增加，本币贬值，会刺激出口、抑制进口，从而改善国际收支；国际收支顺差则反之，所以可通过汇率自动调节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577310", "t": 3, "q": "短期国际资本流动对流入国的经济稳定不利，没有任何积极作用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "短期国际资本流动并非没有任何积极作用，它能在一定程度上增加流入国的资金供给、促进金融市场发展等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577311", "t": 3, "q": "直接投资是指投资者直接参与被投资企业的经营管理，属于长期资本流动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "直接投资中投资者会拥有被投资企业一定控制权，直接参与其经营管理，且通常是长期的资金投入，属于长期资本流动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577312", "t": 3, "q": "国际资本流动会加剧东道国的金融波动", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际资本流入可能使东道国资产价格上升、信贷扩张等，流出时又会导致资产价格下跌、流动性紧张等，易加剧金融市场波动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577313", "t": 3, "q": "国际金融合作的核心目标是消除各国汇率波动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际金融合作核心目标并非单纯消除汇率波动，而是促进国际货币合作、稳定国际金融秩序、推动国际贸易和投资等。汇率波动难以完全消除，适度波动也是市场调节表现。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577314", "t": 3, "q": "汇率制度的选择取决于一国的经济规模、开放程度、通胀水平等因素。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "汇率制度选择是个复杂过程，会受经济规模、开放程度、通胀水平等多因素综合影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577315", "t": 3, "q": "外汇期货交易的交割方式以实物交割为主。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇期货交易大多通过对冲平仓来了结头寸，而非以实物交割为主。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577316", "t": 3, "q": "固定汇率制度下，国际收支失衡主要通过汇率变动调节。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "固定汇率制度下，汇率基本固定，不会轻易变动，国际收支失衡主要通过国内经济变量（如收入、物价等）调节，而非汇率变动。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577317", "t": 3, "q": "国际收支平衡表中，储备资产的增加记入贷方。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在国际收支平衡表中，储备资产增加意味着本国对外资产增加，相当于资金流出，应记入借方，而非贷方。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577318", "t": 3, "q": "国际收支的吸收论认为，贸易收支差额等于国民收入减去吸收。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际收支吸收论基本公式为B=Y - A，其中B代表贸易收支差额，Y是国民收入，A是国内吸收，即贸易收支差额等于国民收入减去吸收。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577319", "t": 3, "q": "外汇远期合约是标准化的场外交易合约。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇远期合约是非标准化的，可根据交易双方具体需求协商合约条款，且在场外交易。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577320", "t": 3, "q": "固定汇率制度下，汇率的波动幅度被限制在一个较小的区间内，政府需通过干预维持。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "固定汇率制度就是将汇率基本固定，波动幅度限制在较小范围，当汇率波动接近或超出规定区间，政府会运用外汇储备等手段干预外汇市场来维持汇率稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577321", "t": 3, "q": "国际收支平衡表中，经常转移属于资本与金融账户。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "经常转移属于经常账户，并非资本与金融账户。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577322", "t": 3, "q": "中央银行在外汇市场上买入外汇，会导致本国货币供应量增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "央行买入外汇时，要用本币支付，这会使市场上本币投放增多，从而导致本国货币供应量增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577323", "t": 3, "q": "资本流动管制能完全阻止短期资本的跨境流动，有效防范金融风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资本流动管制虽能在一定程度上限制短期资本跨境流动，但无法做到完全阻止，也不能绝对有效防范金融风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818515428577324", "t": 3, "q": "离岸外汇市场的交易货币不包括所在国货币", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离岸外汇市场是指在非本国货币发行国进行该国货币交易的市场，交易货币不涉及所在国货币，比如在伦敦进行美元交易的市场，伦敦是离岸市场，交易货币美元不是英国的货币。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 国际金融（2）", "n": "基础练习题【含解析】 / 第3章 国际金融（2）", "qs": [{"id": "2034818522428870656", "t": 1, "q": "企业签订进口合同后，预计未来外汇汇率上升，为规避支付成本增加的风险，应采取的策略是（　）", "a": ["卖出远期外汇", "买入远期外汇", "买入外汇看跌期权", "卖出外汇看涨期权", "", ""], "r": "B", "e": "预计未来外汇汇率上升，意味着未来购买外汇成本增加。企业为规避支付成本增加风险，应提前锁定未来购买外汇的价格，即买入远期外汇。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870657", "t": 1, "q": "购买力平价理论认为，汇率的变动主要源于两国之间", "a": ["利率水平的差异", "通货膨胀率的差异", "国际收支的差额", "经济增长速度的差异", "", ""], "r": "B", "e": "购买力平价理论强调汇率由两国货币购买力决定，而货币购买力与物价相关，通货膨胀率体现物价变动。所以汇率变动主要源于两国通货膨胀率差异。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870658", "t": 1, "q": "按照汇率制度的分类，当前人民币汇率制度属于", "a": ["自由浮动汇率制度", "传统钉住汇率制度", "爬行钉住汇率制度", "参考一篮子货币进行调节的有管理的浮动汇率制度", "", ""], "r": "D", "e": "2005 年我国开始实行以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。答案选 D，而 A 自由浮动汇率无政府干预；B 传统钉住汇率是钉住单一货币或货币篮子；C 爬行钉住汇率是按预先宣布比率逐步调整，均不符合人民币汇率制度特点。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870659", "t": 1, "q": "企业采用\"提前收付汇\"策略时，若预期本币升值，应（　）", "a": ["提前收汇，推迟付汇", "提前付汇，推迟收汇", "提前收汇和付汇", "推迟收汇和付汇", "", ""], "r": "A", "e": "本币升值意味着外币相对贬值，提前收汇能按当前汇率多换本币，推迟付汇可等外币贬值后用更少本币换外币支付。所以应提前收汇，推迟付汇。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870660", "t": 1, "q": "下列关于外汇远期合约与外汇期货合约的表述，正确的是（　）", "a": ["两者均需缴纳保证金", "两者的交易对手方均为交易所", "远期合约的流动性高于期货合约", "期货合约的违约风险低于远期合约", "", ""], "r": "D", "e": "外汇远期合约是场外交易，无需缴纳保证金，交易对手是交易双方，流动性差、违约风险高；外汇期货合约在交易所交易，需缴纳保证金，交易对手是交易所，流动性好、违约风险低。A 选项远期合约不缴保证金；B 选项远期合约对手不是交易所；C 选项远期合约流动性低于期货合约。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870661", "t": 1, "q": "下列哪种外汇风险源于未来汇率变动对资产负债表的影响", "a": ["交易风险", "会计风险", "经济风险", "操作风险", "", ""], "r": "B", "e": "会计风险主要是指因汇率变动对企业资产负债表的影响。交易风险是交易中汇率变动带来的风险；经济风险是汇率变动对企业未来现金流量的影响；操作风险与汇率变动对资产负债表无关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870662", "t": 1, "q": "一国国际储备不足，可能导致的后果是（　）", "a": ["本币汇率升值", "无法应对国际收支逆差", "国际贸易顺差扩大", "国内利率下降", "", ""], "r": "B", "e": "国际储备可用于弥补国际收支逆差，储备不足就难以应对逆差。A项储备不足本币易贬值而非升值；C项储备不足和贸易顺差扩大无必然联系；D项储备不足时，为吸引外资，利率可能上升而非下降。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870663", "t": 1, "q": "下列关于特别提款权的表述，错误的是（　）", "a": ["可用于成员国之间的债务清偿", "可直接用于国际贸易支付", "其价值由一篮子货币决定", "是IMF的记账单位", "", ""], "r": "B", "e": "特别提款权是IMF创设的记账单位，价值由一篮子货币决定，可用于成员国间债务清偿，但不能直接用于国际贸易支付。所以错误表述是B。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870664", "t": 1, "q": "当一国出现货币危机时，通常会伴随（　）", "a": ["本币大幅升值", "本币大幅贬值", "外汇储备增加", "利率下降", "", ""], "r": "B", "e": "货币危机时，市场对本币信心下降，大量抛售本币，本币供大于求，会大幅贬值。本币贬值会使外汇储备减少，为稳定汇率可能提高利率。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870665", "t": 1, "q": "管理浮动汇率制度又称为", "a": ["清洁浮动汇率制度", "肮脏浮动汇率制度", "钉住浮动汇率制度", "爬行浮动汇率制度", "", ""], "r": "B", "e": "管理浮动汇率制度是政府或货币当局会干预外汇市场，这种有干预的浮动被形象称为“肮脏浮动”。清洁浮动是无干预的自由浮动。钉住浮动和爬行浮动有各自特点，与管理浮动特征不同。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870666", "t": 1, "q": "短期国际资本流动中，\"热钱\"的主要特征是（　）", "a": ["期限短、流动性强", "期限长、稳定性高", "主要用于实业投资", "受利率影响小", "", ""], "r": "A", "e": "“热钱”追求快速获利，会迅速流入流出市场，所以具有期限短、流动性强的特征。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870667", "t": 1, "q": "下列汇率制度中，对汇率波动幅度限制最严格的是（　）", "a": ["货币局制度", "爬行钉住汇率制度", "管理浮动汇率制度", "汇率目标区制度", "", ""], "r": "A", "e": "货币局制度要求本币与某一确定的外国货币之间按照固定汇率进行兑换，汇率波动幅度极小近乎无波动，限制最严格。而其他几种制度汇率波动幅度限制相对宽松。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870668", "t": 1, "q": "国际收支平衡表中，\"货物出口\"应记入（　）", "a": ["借方", "贷方", "资本账户", "错误与遗漏账户", "", ""], "r": "B", "e": "在国际收支平衡表中，出口意味着资金流入，应记入贷方。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870669", "t": 1, "q": "当一国国际收支出现逆差时，央行抛售外汇储备会导致（　）", "a": ["本币汇率上升", "本币汇率下降", "外汇汇率下降", "本币供给增加", "", ""], "r": "B", "e": "答案：B当一国国际收支出现逆差时，意味着该国的进口额超过出口额，外汇需求增加。为了平衡外汇供求关系，央行可以抛售外汇储备。抛售外汇储备会增加市场上的外汇供应，从而降低外汇汇率。同时，由于外汇汇率下降，本币相对于其他货币的价值也会下降，即本币汇率下降。因此，选项B正确。选项A、C和D与央行抛售外汇储备的影响相反或无关。", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870670", "t": 1, "q": "下列属于外汇掉期交易的特点是（　）", "a": ["只进行一次货币交换", "进行两次方向相反的货币交换", "到期必须实物交割", "合约标准化", "", ""], "r": "B", "e": "外汇掉期是指在买入或卖出即期外汇的同时，卖出或买进同一货币的远期外汇。也就是进行两次方向相反的货币交换。A选项只进行一次货币交换错误；外汇掉期可根据约定选择是否实物交割，C选项到期必须实物交割错误；外汇掉期是非标准化合约，D选项合约标准化错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870671", "t": 1, "q": "应对外汇风险的\"提前错后\"策略中，\"错后\"是指（　）", "a": ["提前收汇", "推迟收汇", "提前付汇", "推迟付汇", "", ""], "r": "D", "e": "答案：D“提前错后”策略是应对汇率风险的一种方法。“提前”是指提前收汇或提前付汇，“错后”是指推迟收汇或推迟付汇。本题中问的是“错后”，所以是指推迟收汇或推迟付汇，又因为选项中只有D是推迟付汇，故选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870672", "t": 1, "q": "特别提款权的分配依据是（　）", "a": ["各国的GDP规模", "各国的外汇储备规模", "各国在IMF的份额", "各国的贸易总额", "", ""], "r": "C", "e": "特别提款权是国际货币基金组织（IMF）根据各成员国在IMF的份额进行分配的。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870673", "t": 1, "q": "企业面临外汇经济风险时，可采取的管理策略是（　）", "a": ["签订远期外汇合约", "调整生产经营布局", "提前收付汇", "使用外汇期权保值", "", ""], "r": "B", "e": "外汇经济风险是指由于汇率变动对企业未来现金流量造成影响。A、C、D选项主要是针对交易风险的管理手段。而调整生产经营布局可从根源上降低外汇经济风险对企业的影响，比如改变原材料采购地、产品销售地等。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870674", "t": 1, "q": "企业在签订进出口合同时，选择以本国货币计价结算，这种外汇风险管理方法属于（　）", "a": ["风险对冲", "风险规避", "风险转移", "风险补偿", "", ""], "r": "B", "e": "企业选本国货币计价结算，直接避免了外汇风险。风险规避就是通过回避来消除风险。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870675", "t": 1, "q": "下列属于固定汇率制度的是", "a": ["货币局制度", "管理浮动汇率制度", "自由浮动汇率制度", "爬行钉住汇率制度", "", ""], "r": "A", "e": "货币局制度是一种严格的固定汇率制。管理浮动和自由浮动都属于浮动汇率制度，爬行钉住虽有固定汇率特征但灵活性大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870676", "t": 1, "q": "爬行钉住汇率制度的特点是", "a": ["汇率固定不变", "汇率在狭窄区间内波动", "汇率定期小幅调整", "汇率完全由市场决定", "", ""], "r": "C", "e": "爬行钉住汇率制度下，汇率会根据预先宣布的固定幅度或根据某些量化指标的变化，定期小幅度调整。A选项固定不变不符合；B是可调整钉住汇率制度特点；D完全由市场决定是浮动汇率制度特点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870677", "t": 1, "q": "2008年次贷危机的根源是", "a": ["国际油价大幅上涨", "美国房地产市场泡沫破裂", "欧元区债务违约", "发展中国家贸易保护主义抬头", "", ""], "r": "B", "e": "2008年次贷危机源于美国次级抵押贷款市场，由于美国房地产市场泡沫破裂，导致次级贷款违约率大幅上升，进而引发金融市场动荡。A国际油价上涨不是根源；C欧元区债务违约是后续影响；D发展中国家贸易保护主义抬头与次贷危机根源无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870678", "t": 1, "q": "根据相对购买力平价，若A国通货膨胀率高于B国，则A国货币对B国货币的汇率会（　）", "a": ["升值", "贬值", "不变", "先升后贬", "", ""], "r": "B", "e": "相对购买力平价理论指出，通胀率较高国家的货币会贬值。A国通胀率高于B国，意味着A国货币购买力下降更快，A国货币对B国货币汇率会贬值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870679", "t": 1, "q": "外汇远期与外汇掉期的本质区别在于", "a": ["交易双方的权利义务", "是否涉及两笔不同期限的交易", "是否需要缴纳保证金", "交割方式的不同", "", ""], "r": "B", "e": "外汇远期是单一期限的外汇交易，而外汇掉期涉及两笔不同期限的交易，这是二者本质区别。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870680", "t": 1, "q": "国际金融市场上，用于衡量一国偿还外债能力的指标是（　）", "a": ["外汇储备规模", "外债负债率", "国际收支顺差", "GDP增长率", "", ""], "r": "B", "e": "外债负债率是指外债余额与国内生产总值的比率，它能直观反映一国对外债的依赖程度和偿还外债的能力。外汇储备规模主要体现应对外部风险等能力；国际收支顺差反映国际收支状况；GDP增长率体现经济增长情况。所以衡量一国偿还外债能力的指标是外债负债率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870681", "t": 1, "q": "外汇掉期交易的核心特征是", "a": ["只进行一笔外汇交易", "两笔方向相反、期限不同的外汇交易同时进行", "交割价格相同", "无需约定交割日期", "", ""], "r": "B", "e": "外汇掉期是同时进行两笔方向相反、期限不同的外汇交易。A选项只进行一笔交易不符合；C选项掉期交易两笔交易交割价格通常不同；D选项需要约定交割日期。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870682", "t": 1, "q": "外汇期权交易中，期权买方支付的期权费是（　）", "a": ["保证金", "履约保证金", "获得选择权的成本", "合约本金的一部分", "", ""], "r": "C", "e": "期权买方支付期权费获得期权合约赋予的选择权，这是获得选择权的成本。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870683", "t": 1, "q": "下列关于外汇远期汇率的表述，正确的是（　）", "a": ["远期汇率一定高于即期汇率", "远期汇率一定低于即期汇率", "远期汇率由市场供求和利率差异决定", "远期汇率与即期汇率无关", "", ""], "r": "C", "e": "远期汇率由市场供求和利率差异等因素决定。远期汇率与即期汇率有关，且可能高于、低于或等于即期汇率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870684", "t": 1, "q": "在直接标价法下，汇率数值上升意味着（　）", "a": ["本币升值，外币贬值", "本币贬值，外币升值", "本币与外币同时升值", "本币与外币同时贬值", "", ""], "r": "B", "e": "直接标价法是以一定单位的外国货币为标准，折合若干单位的本国货币。汇率数值上升，意味着用更多本币换相同外币，即本币贬值，外币升值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870685", "t": 1, "q": "下列不属于外汇风险类型的是（　）", "a": ["交易风险", "会计风险", "信用风险", "经济风险", "", ""], "r": "C", "e": "外汇风险类型主要有交易风险、会计风险和经济风险。信用风险是指交易对手未能履行约定契约中的义务而造成经济损失的风险，不属于外汇风险类型。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870686", "t": 1, "q": "在间接标价法下，1单位本国货币可兑换的外国货币数额增加，说明（　）", "a": ["本币升值", "本币贬值", "外币升值", "无法判断", "", ""], "r": "A", "e": "间接标价法下，1单位本国货币能兑换的外国货币数额增加，意味着同样的本币能换更多外币，即本币更值钱了，也就是本币升值。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870687", "t": 1, "q": "某企业进口货物需在3个月后支付美元货款，为规避汇率上涨风险，应采取的外汇交易是", "a": ["卖出3个月期美元远期合约", "买入3个月期美元远期合约", "卖出3个月期人民币远期合约", "买入3个月期人民币远期合约", "", ""], "r": "B", "e": "企业3个月后要支付美元货款，担心美元汇率上涨，就应提前锁定未来购买美元的价格。买入3个月期美元远期合约，能在3个月后按约定价格买入美元，规避美元汇率上涨风险。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870688", "t": 1, "q": "中国外汇市场上，由央行授权的外汇指定银行之间进行外汇交易的市场是（　）", "a": ["零售外汇市场", "批发外汇市场", "远期外汇市场", "外汇期权市场", "", ""], "r": "B", "e": "外汇指定银行间的外汇交易规模大，属于批发性质，所以授权银行间进行外汇交易的市场是批发外汇市场。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870689", "t": 1, "q": "下列属于国际直接投资的是", "a": ["购买外国政府债券", "购买外国上市公司股票（持股比例5%）", "在外国设立全资子公司", "购买外国企业发行的债券", "", ""], "r": "C", "e": "国际直接投资是指投资者以控制企业经营管理为核心，获取利润为目的的对外投资活动。选项A、D购买债券主要是获取固定收益，不涉及对企业经营管理的控制；选项B持股比例5%难以对企业经营管理形成有效控制。而在外国设立全资子公司，投资者能完全掌控企业的经营管理，属于国际直接投资。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870690", "t": 1, "q": "国际收支平衡表中，货物贸易收支应计入", "a": ["经常账户", "资本账户", "金融账户", "误差与遗漏账户", "", ""], "r": "A", "e": "经常账户包括货物贸易收支、服务、收入和经常转移等，所以货物贸易收支应计入经常账户。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818522428870691", "t": 1, "q": "下列不属于国际储备构成的是", "a": ["外汇储备", "黄金储备", "本国货币储备", "特别提款权", "", ""], "r": "C", "e": "国际储备是一国货币当局持有的、用于国际支付、平衡国际收支和维持其货币汇率的各种形式的国际储备资产的总称，包括外汇储备、黄金储备、特别提款权等，本国货币不能作为国际储备。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094784", "t": 2, "q": "国际金融监管合作的主要平台包括（　）", "a": ["二十国集团（G20）", "金融稳定理事会（FSB）", "国际货币基金组织（IMF）", "世界贸易组织（WTO）", "", ""], "r": "ABC", "e": "二十国集团、金融稳定理事会、国际货币基金组织都是国际金融监管合作重要平台，而世界贸易组织是负责管理世界经济和贸易秩序的国际组织，与金融监管合作关系不大。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094785", "t": 2, "q": "金融危机的传导机制包括", "a": ["贸易传导", "金融传导", "预期传导", "政策传导", "", ""], "r": "ABCD", "e": "金融危机传导机制有多种，贸易方面，危机使一国需求下降影响他国出口；金融上，通过金融市场、机构等传导风险；预期上，恐慌情绪会扩散；政策上，各国政策变动也会相互影响。所以ABCD都属于金融危机传导机制。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094786", "t": 2, "q": "汇率制度选择的影响因素包括", "a": ["经济开放程度", "经济规模", "通货膨胀率", "国际资本流动状况", "", ""], "r": "ABCD", "e": "经济开放程度高、规模小，宜采用固定汇率制；通货膨胀率差异影响汇率稳定，需考虑；国际资本流动状况也会影响汇率制度选择。ABCD四个因素都会影响汇率制度选择。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094787", "t": 2, "q": "下列属于区域金融合作组织的有（　）", "a": ["欧洲中央银行", "亚洲开发银行", "国际清算银行", "东盟与中日韩（10+3）金融合作机制", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094788", "t": 2, "q": "外汇远期与外汇期货的区别有（　）", "a": ["交易场所不同", "合约标准化程度不同", "履约方式不同", "信用风险不同", "", ""], "r": "ABCD", "e": "外汇远期是场外交易，合约非标准化，履约多实际交割，信用风险高；外汇期货是场内交易，合约标准化，履约多对冲平仓，信用风险低。ABCD选项分别从交易场所、合约标准化程度、履约方式、信用风险方面体现了两者区别。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094789", "t": 2, "q": "国际收支顺差的负面影响包括", "a": ["本币升值压力增大", "引发贸易摩擦", "国内通货膨胀压力上升", "外汇储备闲置浪费", "", ""], "r": "ABCD", "e": "国际收支顺差意味着出口多、外汇收入多，外汇供大于求会使本币有升值压力，A对；顺差可能引发贸易伙伴不满从而产生贸易摩擦，B对；大量外汇流入会增加货币供给，带来通胀压力，C对；大量外汇储备闲置还会带来机会成本等浪费问题，D对。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094790", "t": 2, "q": "利率平价理论的假设条件包括", "a": ["资本完全自由流动", "无交易成本和税收", "汇率预期稳定", "各国利率水平相同", "", ""], "r": "AB", "e": "利率平价理论假设资本完全自由流动，交易无成本和税收，这样资金才能根据利率差异自由套利。而各国利率水平相同就不存在套利基础了，且汇率预期稳定并非该理论假设条件。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094791", "t": 2, "q": "浮动汇率制度的优点包括", "a": ["增强货币政策独立性", "自动调节国际收支", "减少外汇储备消耗", "避免汇率大幅波动", "", ""], "r": "ABC", "e": "浮动汇率下，一国货币当局无需维持汇率稳定，货币政策自主性更强，A正确；汇率随市场供求变动，能自动调节国际收支，B正确；不用大量外汇储备干预汇率，可减少储备消耗，C正确。而浮动汇率受市场影响大，易大幅波动，D错误。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094792", "t": 2, "q": "国际金融监管合作的内容包括（　）", "a": ["统一监管标准", "信息共享", "跨境监管协作", "危机处置协调", "", ""], "r": "ABCD", "e": "国际金融监管合作旨在应对金融全球化带来的挑战，统一监管标准可减少监管套利；信息共享利于各方掌握全面金融信息；跨境监管协作能解决跨国金融活动监管难题；危机处置协调可在危机时协同行动。ABCD四个选项都是国际金融监管合作的重要内容。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094793", "t": 2, "q": "下列属于外汇风险类型的有（　）", "a": ["交易风险", "折算风险", "经济风险", "信用风险", "", ""], "r": "ABC", "e": "外汇风险主要有交易风险、折算风险和经济风险。交易风险是外汇交易中汇率变动带来的风险；折算风险是会计处理时汇率变动产生的风险；经济风险是汇率变动对企业未来现金流量的影响。而信用风险是指交易对手违约的风险，不属于外汇风险类型。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094794", "t": 2, "q": "资本流动管制的主要措施包括", "a": ["限制外资流入规模", "征收资本利得税", "规定外汇交易额度", "禁止短期资本流动", "", ""], "r": "ABCD", "e": "资本流动管制措施多样，A限制外资流入规模、B征收资本利得税、C规定外汇交易额度、D禁止短期资本流动都可对资本流动进行管控。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094795", "t": 2, "q": "下列汇率理论中，属于现代汇率决定理论的有（　）", "a": ["购买力平价理论", "利率平价理论", "资产组合平衡理论", "货币主义汇率理论", "", ""], "r": "CD", "e": "购买力平价理论和利率平价理论是传统汇率决定理论，资产组合平衡理论和货币主义汇率理论属于现代汇率决定理论。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094796", "t": 2, "q": "影响汇率变动的长期因素有（　）", "a": ["通货膨胀率差异", "经济增长率差异", "利率差异", "国际收支状况", "", ""], "r": "ABD", "e": "通货膨胀率差异、经济增长率差异、国际收支状况会在较长时间影响一国货币供求和经济实力，从而对汇率产生长期影响；而利率差异主要是短期影响汇率。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094797", "t": 2, "q": "国际资本流动对流入国的积极影响有（　）", "a": ["弥补资金短缺", "促进技术转移", "推动产业升级", "加剧金融市场波动", "", ""], "r": "ABC", "e": "ABC选项都是国际资本流入对流入国的积极影响，能弥补资金缺口、带来先进技术、推动产业进步；D选项加剧金融市场波动是消极影响。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094798", "t": 2, "q": "国际收支平衡表中，属于资本与金融账户的项目有（　）", "a": ["直接投资", "证券投资", "储备资产", "单方面转移", "", ""], "r": "ABC", "e": "资本与金融账户包括资本账户和金融账户，其中金融账户又包含直接投资、证券投资等，储备资产也属于金融账户。而单方面转移属于经常账户。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094799", "t": 2, "q": "下列属于外汇投机交易的特点是（　）", "a": ["主动承担汇率风险", "以获取价差收益为目的", "不涉及实际货物交割", "期限多为短期", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094800", "t": 2, "q": "IMF的贷款特点有", "a": ["短期性", "条件性", "针对性", "无息性", "", ""], "r": "ABC", "e": "IMF（国际货币基金组织）贷款主要是帮助成员国解决短期国际收支失衡问题，有严格贷款条件以确保资金合理使用，有一定针对性。但贷款是收取利息的。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094801", "t": 2, "q": "企业使用货币互换工具的主要目的是（　）", "a": ["对冲汇率风险", "对冲利率风险", "筹集低成本资金", "投机汇率波动", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094802", "t": 2, "q": "影响汇率变动的长期因素有（　）", "a": ["经济增长水平", "通货膨胀率", "利率水平", "国际收支状况", "", ""], "r": "ABD", "e": "经济增长水平、通货膨胀率、国际收支状况是影响汇率变动的长期因素。经济增长影响综合实力和货币吸引力；通胀率差异改变商品竞争力和货币价值；国际收支反映外汇供求。而利率水平主要影响短期资本流动，对汇率影响较短期。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094803", "t": 2, "q": "金融危机的主要表现形式有", "a": ["货币危机", "银行危机", "债务危机", "流动性危机", "", ""], "r": "ABCD", "e": "金融危机是金融领域的危机，货币危机、银行危机、债务危机、流动性危机都是其常见表现形式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094804", "t": 2, "q": "下列属于长期国际资本流动的类型有（　）", "a": ["直接投资", "证券投资", "国际贷款", "短期外汇拆借", "", ""], "r": "ABC", "e": "长期国际资本流动是期限在1年以上的资本流动，包括直接投资、证券投资、国际贷款。而短期外汇拆借期限短，属于短期国际资本流动。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094805", "t": 2, "q": "短期国际资本流动的负面影响有", "a": ["加剧汇率波动", "引发资产泡沫", "干扰货币政策实施", "导致国际收支失衡", "", ""], "r": "ABCD", "e": "短期国际资本流动规模大、流动速度快，易冲击金融市场。它频繁进出会使汇率大起大落，加剧波动；大量流入会推高资产价格形成泡沫；会使货币供应量不稳定，干扰货币政策；还会影响国际收支平衡。ABCD四个选项均是其负面影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094806", "t": 2, "q": "国际收支逆差的调节政策包括（　）", "a": ["紧缩性财政政策", "紧缩性货币政策", "本币贬值", "进口关税提高", "", ""], "r": "ABCD", "e": "国际收支逆差意味着支出大于收入。紧缩性财政政策可减少国内支出，减少进口，改善逆差；紧缩性货币政策使利率上升，吸引外资流入，改善国际收支；本币贬值能使本国商品更便宜，利于出口，改善逆差；提高进口关税可限制进口，利于改善逆差。ABCD四个选项措施都能调节国际收支逆差。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094807", "t": 2, "q": "国际资本流动的负面影响包括（　）", "a": ["加剧金融市场波动", "引发货币危机", "导致国际收支失衡", "促进资源优化配置", "", ""], "r": "ABC", "e": "ABC选项都是国际资本流动可能带来的负面结果，而D选项促进资源优化配置是正面影响。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094808", "t": 2, "q": "国际金融合作的主要形式有", "a": ["建立国际金融组织", "签订双边或多边金融协议", "开展跨境金融监管合作", "统一各国货币政策", "", ""], "r": "ABC", "e": "国际金融合作可通过建立国际金融组织、签订双边或多边金融协议、开展跨境金融监管合作等形式实现。而各国国情不同，难以统一货币政策。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094809", "t": 2, "q": "引发金融危机的内部因素有", "a": ["金融体系脆弱性", "宏观经济失衡", "汇率制度不合理", "监管缺失", "", ""], "r": "ABCD", "e": "ABCD选项均是引发金融危机的内部因素。金融体系脆弱易受冲击；宏观经济失衡会破坏经济稳定；不合理汇率制度可能导致货币危机；监管缺失会使金融市场乱象丛生。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094810", "t": 2, "q": "国际金融监管合作的必要性体现在", "a": ["金融全球化的发展", "金融风险的跨境传导", "各国监管标准差异", "维护国际金融体系稳定", "", ""], "r": "ABCD", "e": "金融全球化使各国金融联系紧密，风险易跨境传导，且各国监管标准有差异，这些都需要国际金融监管合作，而最终目的是维护国际金融体系稳定。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094811", "t": 2, "q": "外汇掉期交易的主要类型包括", "a": ["即期对远期掉期", "远期对远期掉期", "即期对即期掉期", "远期对即期掉期", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094812", "t": 2, "q": "国际储备的作用包括（　）", "a": ["调节国际收支", "稳定汇率", "增强国际清偿能力", "弥补财政赤字", "", ""], "r": "ABC", "e": "国际储备可用于平衡国际收支、稳定本币汇率、增强对外支付能力。而弥补财政赤字是国债的作用。所以ABC是国际储备作用。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094813", "t": 2, "q": "下列属于国际储备的作用有（　）", "a": ["弥补国际收支逆差", "稳定本币汇率", "充当对外偿债保证", "促进国际贸易发展", "", ""], "r": "ABC", "e": "国际储备可在国际收支逆差时使用以弥补缺口；可用于干预外汇市场稳定本币汇率；也是对外偿债的信用保证。而促进国际贸易发展并非国际储备直接作用。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094814", "t": 2, "q": "国际货币基金组织（IMF）的贷款特点包括", "a": ["贷款期限较短", "贷款用于解决短期国际收支困难", "贷款附带一定政策条件", "贷款利率较高", "", ""], "r": "ABC", "e": "IMF贷款主要是为成员国解决短期国际收支困难，期限短，且附带政策条件来确保资金合理使用，贷款利率并不高。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094815", "t": 2, "q": "固定汇率制度的优点有", "a": ["汇率稳定，降低交易成本", "减少汇率波动风险", "有利于国际贸易和投资", "增强货币政策独立性", "", ""], "r": "ABC", "e": "固定汇率制度下汇率相对稳定，降低了交易中因汇率变动带来的成本和风险，有利于国际贸易和投资。但固定汇率会使货币政策独立性受限。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094816", "t": 2, "q": "下列汇率制度中，属于中间汇率制度的是（　）", "a": ["货币局制度", "自由浮动汇率制度", "爬行钉住汇率制度", "管理浮动汇率制度", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094817", "t": 2, "q": "外汇掉期交易的应用场景包括", "a": ["对冲汇率风险", "调整外汇资产期限结构", "获取利差收益", "满足短期外汇资金需求", "", ""], "r": "ABCD", "e": "外汇掉期可在买入或卖出即期外汇同时卖出或买入远期外汇，能对冲汇率风险、调整资产期限结构、利用不同市场利差获收益，也可满足短期外汇资金需求。ABCD选项均符合外汇掉期交易应用场景。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818524031094818", "t": 2, "q": "下列属于长期国际资本流动的驱动因素有（　）", "a": ["跨国公司的全球布局", "各国技术差距", "利率短期波动", "汇率长期趋势", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551808", "t": 3, "q": "国际收支顺差会导致外汇市场上外汇供给大于需求，央行购入外汇会增加外汇储备。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际收支顺差意味着出口等收入的外汇多，外汇市场上外汇供给增加，供大于求。央行通常会在这种情况下购入外汇，从而使外汇储备增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551809", "t": 3, "q": "巴塞尔协议Ⅱ的核心是引入了最低资本要求、监管当局的监督检查和市场纪律三大支柱。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "巴塞尔协议Ⅱ的确提出了最低资本要求、监管当局的监督检查和市场纪律这三大支柱，它们构成了该协议的核心框架。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551810", "t": 3, "q": "国际收支逆差会导致外汇储备减少，本币汇率贬值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当出现国际收支逆差时，意味着对外支出大于收入，需要更多外汇来支付，会使外汇储备减少。同时，外汇需求增加，本币供大于求，本币相对外币价值下降，即本币汇率贬值。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551811", "t": 3, "q": "货币互换交易中，交易双方交换的是两种货币的本金和利息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币互换是指两笔金额相同、期限相同、计算利率方法相同，但货币不同的债务资金之间的调换，同时也进行不同利息额的货币调换，即交换两种货币本金和利息。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551812", "t": 3, "q": "国际储备中的黄金储备具有较高的流动性和收益性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "黄金储备流动性较低，变现需特定渠道和流程；同时其收益不稳定，受多种因素影响，所以说具有较高流动性和收益性错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551813", "t": 3, "q": "爬行钉住汇率制度属于固定汇率制度", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "爬行钉住汇率制度是一种介于固定汇率和浮动汇率之间的汇率制度。它允许汇率在一定范围内波动，且汇率会根据预先设定的指标定期小幅调整，并非像固定汇率制度那样汇率基本固定。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551814", "t": 3, "q": "管理浮动汇率制度下，政府会根据经济形势偶尔干预外汇市场，维持汇率相对稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "管理浮动汇率制是指政府对外汇市场进行一定干预，根据经济形势适时调节汇率，以维持汇率相对稳定。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551815", "t": 3, "q": "固定汇率制度下，货币政策的独立性更强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "固定汇率制度下，为维持汇率稳定，本国货币政策需配合维持既定汇率，独立性受限；浮动汇率制度下货币政策独立性更强。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551816", "t": 3, "q": "外汇市场的有形市场主要集中在北美地区，无形市场则以欧洲为核心。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇市场的有形市场主要集中在欧洲大陆，无形市场以英、美为核心。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551817", "t": 3, "q": "爬行钉住汇率制度允许汇率在固定区间内小幅波动，属于浮动汇率制度的一种。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "爬行钉住汇率制度虽允许汇率在一定区间波动，但它是将汇率钉住某种平价，根据一组预先设定的指标定期小幅调整，本质是固定汇率制度，并非浮动汇率制度。所以答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551818", "t": 3, "q": "国际收支平衡表的借方总额始终等于贷方总额，因此不存在收支失衡。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际收支平衡表采用复式记账法，借方总额和贷方总额必然相等，但这只是会计意义上的平衡。实际上，国际收支是否失衡看的是特定账户的收支情况，如经常账户、资本与金融账户等，这些账户可能存在收支不相等的情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551819", "t": 3, "q": "外汇期权的买方盈利潜力无限，亏损仅限于支付的权利金。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇期权买方付出权利金获得权利，行情有利时可按约定价格交易获利，盈利随市场波动可无限；不利时可选择不行权，最大损失就是支付的权利金。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551820", "t": 3, "q": "国际资本流动的\"羊群效应\"会加剧金融市场的波动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“羊群效应”指投资者在信息环境不确定时，行为受其他投资者影响，模仿他人决策。在国际资本流动中，这种盲目跟随会使市场波动被放大，加剧金融市场的不稳定和波动程度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551821", "t": 3, "q": "世界银行的主要资金来源包括成员国的认缴股本、在国际金融市场的借款以及贷款利息收入。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "世界银行资金来源主要有成员国认缴股本、在国际金融市场借款、贷款利息收入等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551822", "t": 3, "q": "企业采用\"推迟收付汇\"策略时，若预期本币贬值，应推迟收汇、提前付汇。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "本币贬值意味着未来收汇换到的本币会更少，所以应提前收汇；而未来付汇时同样金额外币需更多本币，所以应推迟付汇。题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551823", "t": 3, "q": "交易风险是企业最常见的外汇风险", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "交易风险在企业涉外经济活动中广泛存在，因外汇汇率波动影响交易金额，是企业日常经营中常面临的外汇风险类型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551824", "t": 3, "q": "国际收支平衡表中的误差与遗漏账户是为了平衡借贷双方差额而人为设置的账户。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际收支平衡表编制中因资料不完整、统计时间和计价标准不一致等，会使借贷双方出现差额，误差与遗漏账户就是为平衡这一差额人为设置的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551825", "t": 3, "q": "国际收支逆差会导致外汇储备减少", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际收支逆差意味着进口等对外支出大于出口等收入，为弥补逆差需动用外汇储备支付，所以会使外汇储备减少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551826", "t": 3, "q": "外汇期权的买方在到期日之前可以随时执行合约，无需等到到期日。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇期权分为美式期权和欧式期权，美式期权买方能在到期日前随时行权，而欧式期权只能在到期日行权，题干未明确期权类型，表述不准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551827", "t": 3, "q": "折算风险会对企业的实际现金流产生影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "折算风险只是会计账面上的汇率风险，主要影响财务报表数据，不直接影响企业实际的现金流入和流出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551828", "t": 3, "q": "布雷顿森林体系属于金本位制下的固定汇率制度", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "布雷顿森林体系是美元与黄金挂钩，其他货币与美元挂钩的汇率制度，它是一种以美元为中心的国际货币体系，并非传统金本位制。传统金本位制下货币直接与黄金挂钩。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551829", "t": 3, "q": "国际资本流动中的证券投资属于长期资本流动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "证券投资一般期限可长可短，短期证券投资较多，不属于长期资本流动。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551830", "t": 3, "q": "根据三元悖论，固定汇率制度下，一国货币政策的独立性会受到限制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三元悖论指一国货币政策独立性、汇率稳定和资本自由流动三个目标不能同时实现，在固定汇率制度下，若资本自由流动，为维持汇率稳定，货币政策需配合，独立性受限。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551831", "t": 3, "q": "国际储备中的外汇储备必须是可自由兑换的货币。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇储备作为国际储备的重要组成部分，需能在国际间自由兑换和交易，以满足国际支付、调节国际收支等需求，所以必须是可自由兑换货币。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551832", "t": 3, "q": "世界银行与IMF的成立时间相同", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "世界银行和国际货币基金组织（IMF）都是在1944年布雷顿森林会议后成立，1945年正式运作。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551833", "t": 3, "q": "外汇期权的卖方拥有是否行权的选择权", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇期权中，买方支付期权费，拥有是否行权的选择权，卖方收取期权费，有义务按约定行事。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551834", "t": 3, "q": "外汇远期交易双方都有义务在到期日交割", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇远期交易是双方约定在未来某一特定日期，按照约定的汇率买卖一定金额外汇的交易。在合约到期时，交易双方都有义务按照约定进行交割。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551835", "t": 3, "q": "外汇期货合约的标准化程度高于远期外汇合约，流动性也更强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇期货合约是标准化合约，在交易所集中交易，有统一的规格和交易规则，便于转让，流动性强；远期外汇合约是交易双方私下协商达成的非标准化合约，转让困难，流动性差。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551836", "t": 3, "q": "货币危机不仅发生在发展中国家，发达国家也可能面临货币危机。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币危机是指对货币的信心产生动摇，引发货币大幅贬值等情况。无论是发展中国家还是发达国家，在特定经济环境下，如经济结构失衡、外部冲击、政策失误等，都可能面临货币危机。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551837", "t": 3, "q": "次贷危机是由美国次级抵押贷款市场的信用危机引发的全球性金融危机。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "美国次级抵押贷款市场上，因大量信用较差的借款人违约，引发金融机构资金链断裂等一系列问题，进而演变成全球性金融危机。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551838", "t": 3, "q": "外汇互换交易同时涉及汇率风险和利率风险的转移。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇互换是交易双方约定在未来某一时期相互交换某种资产的交易形式，在交易过程中既涉及不同货币兑换带来的汇率变动风险，也涉及不同货币资金借贷产生的利率变动风险，所以会同时转移这两种风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551839", "t": 3, "q": "外汇储备是国际储备中规模最大、流动性最强的资产。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际储备包括外汇储备、黄金储备、特别提款权等，外汇储备是国际储备中最主要的组成部分，规模大且能随时兑换成其他资产，流动性强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551840", "t": 3, "q": "经常账户顺差意味着该国是净债权国。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "经常账户顺差只是表明在一定时期内货物、服务等交易收入大于支出。而净债权国是指对外金融资产大于对外金融负债。经常账户顺差不一定就意味着是净债权国，因为还需考虑资本和金融账户等情况。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551841", "t": 3, "q": "外汇远期合约的违约风险高于外汇期货合约。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇远期合约是场外交易，没有标准化和保证金制度等约束，交易双方直接承担对方违约风险。而外汇期货合约是在交易所交易，有严格的保证金制度等，违约风险由交易所承担，所以外汇远期合约违约风险高于外汇期货合约。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551842", "t": 3, "q": "外汇市场上，商业银行是最主要的做市商和交易中介。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在外汇市场里，商业银行凭借其广泛的业务网络、雄厚资金实力和专业交易能力，为市场提供买卖报价，促成交易，是最主要的做市商和交易中介。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551843", "t": 3, "q": "会计风险不影响企业的实际现金流", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计风险主要是因汇率变动对企业资产负债表等会计报表中项目价值产生影响，它是一种账面的、非实际交易的风险，不涉及实际的现金流入或流出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551844", "t": 3, "q": "浮动汇率制度下，政府无需干预外汇市场", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "浮动汇率制度下，汇率由市场供求决定，但政府为了维持宏观经济稳定、避免汇率过度波动等情况，仍可能会干预外汇市场。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551845", "t": 3, "q": "金融危机的本质是金融市场的流动性危机。", "a":
