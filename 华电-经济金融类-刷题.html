 ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551846", "t": 3, "q": "根据资产组合平衡模型，外币资产收益率上升会导致本币升值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产组合平衡模型中，外币资产收益率上升，投资者会增加外币资产持有，减少本币资产，使本币需求下降，导致本币贬值而非升值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551847", "t": 3, "q": "管理浮动汇率制下，政府对汇率的干预是无限制的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "管理浮动汇率制下，政府虽会干预汇率，但干预是有限制的，并非无限制，要考虑经济、政策等多方面因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551848", "t": 3, "q": "即期外汇交易的交割日通常为交易后的第二个营业日。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "即期外汇交易是指买卖双方成交后，在两个营业日内办理交割的外汇交易，所以交割日通常是交易后的第二个营业日。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551849", "t": 3, "q": "区域货币联盟是国际金融合作的高级形式", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "区域货币联盟在国际金融合作中，涉及成员国在货币发行、货币政策等多方面的深度协调与统一，超越了一般的合作形式，是高级形式。", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551850", "t": 3, "q": "区域货币联盟的核心是成员国使用统一的货币。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "区域货币联盟是指一定地区内的有关国家和地区在货币金融领域进行协调与合作，核心内容包括成员国使用统一货币、统一货币政策等，使用统一货币是关键特征，体现了区域货币联盟的本质。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551851", "t": 3, "q": "国际收支逆差会导致外汇市场上本币供给大于需求，从而产生本币贬值压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际收支逆差意味着进口大于出口等，对外币需求增加，要换外币就会增加本币供给，使得本币供给大于需求，本币有贬值压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818525314551852", "t": 3, "q": "国际储备的规模越大，对一国经济的稳定作用越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际储备规模需适度，并非越大越好。规模过大可能导致资源闲置浪费、本币超发引发通胀等问题，所以并非规模越大对一国经济稳定作用就越强。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 国际金融（3）", "n": "基础练习题【含解析】 / 第3章 国际金融（3）", "qs": [{"id": "2034818536039387136", "t": 1, "q": "根据货币主义的国际收支理论，国际收支失衡的根本原因是（　）", "a": ["货币供求失衡", "进出口弹性不足", "利率差异", "收入水平差异", "", ""], "r": "A", "e": "货币主义国际收支理论认为，国际收支本质上是一种货币现象，国际收支失衡根本原因是货币供求失衡。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387137", "t": 1, "q": "货币危机的预警指标不包括", "a": ["外汇储备大幅下降", "经常账户逆差扩大", "国内利率持续下降", "本币汇率过度高估", "", ""], "r": "C", "e": "外汇储备大幅下降、经常账户逆差扩大、本币汇率过度高估都可能是货币危机的预警信号。而国内利率持续下降不一定直接预示货币危机，且在不同经济情况下利率下降有不同原因。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387138", "t": 1, "q": "一国国际储备的最优规模取决于多种因素，下列不属于其决定因素的是", "a": ["国际贸易规模", "汇率制度类型", "国内通货膨胀率", "国际收支调节能力", "", ""], "r": "C", "e": "国际储备最优规模主要与对外经济活动相关。国际贸易规模影响外汇需求，汇率制度类型影响储备需求策略，国际收支调节能力强弱也影响储备需求。而国内通货膨胀率主要反映国内物价情况，与国际储备最优规模没有直接关联。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387139", "t": 1, "q": "当一国国际收支出现逆差时，央行抛售外汇储备干预市场，会导致", "a": ["本国货币供应量增加", "本国货币供应量减少", "本币汇率贬值", "外汇储备增加", "", ""], "r": "B", "e": "央行抛售外汇储备，收回本币，市场上本币减少，即本国货币供应量减少。抛售外汇会使外汇供给增加，本币汇率升值，同时外汇储备减少。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387140", "t": 1, "q": "下列不属于国际储备的是", "a": ["外汇储备", "黄金储备", "本国商业银行的外汇资产", "特别提款权", "", ""], "r": "C", "e": "国际储备是一国货币当局持有的、用于国际支付等目的的资产。外汇储备、黄金储备、特别提款权都属于国际储备。而本国商业银行的外汇资产是商业银行自有资产，并非货币当局持有，不属于国际储备。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387141", "t": 1, "q": "中国目前实行的汇率制度是（　）", "a": ["自由浮动汇率制度", "管理浮动汇率制度", "钉住美元汇率制度", "爬行钉住汇率制度", "", ""], "r": "B", "e": "中国实行以市场供求为基础、参考一篮子货币进行调节、有管理的浮动汇率制度。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387142", "t": 1, "q": "下列属于外汇期权交易买方权利的是", "a": ["必须在到期日执行合约", "有权在到期日或之前选择是否执行合约", "需要承担合约交割的义务", "需向卖方支付保证金", "", ""], "r": "B", "e": "外汇期权买方支付期权费获得权利，有权在到期日或之前选择是否执行合约。A选项，买方不是必须执行合约；C选项，承担交割义务的是卖方；D选项，支付保证金的是卖方。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387143", "t": 1, "q": "一国货币成为国际储备货币的关键条件不包括（　）", "a": ["币值稳定", "发行国经济实力强", "汇率固定", "国际清偿能力充足", "", ""], "r": "C", "e": "成为国际储备货币需币值稳定、发行国经济实力强、有充足国际清偿能力等。而汇率固定并非关键条件，现代国际货币体系中很多国际储备货币汇率是浮动的。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387144", "t": 1, "q": "外汇零售市场的主要参与者是（　）", "a": ["中央银行", "商业银行", "个人和中小企业", "非银行金融机构", "", ""], "r": "C", "e": "外汇零售市场是个人和企业为了自身需求进行外汇交易的市场，主要参与者就是个人和中小企业。中央银行主要参与外汇批发市场进行宏观调控；商业银行和非银行金融机构也是外汇批发市场的重要参与者。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387145", "t": 1, "q": "国际收支平衡表中，记录一国与他国之间实际资源转移的账户是（　）", "a": ["资本与金融账户", "经常账户", "储备资产账户", "错误与遗漏账户", "", ""], "r": "B", "e": "经常账户记录货物、服务、收入和经常转移等实际资源转移。资本与金融账户记录资本转移和非生产、非金融资产的收买或放弃等。储备资产账户是官方储备变动。错误与遗漏账户是为平衡收支而设。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387146", "t": 1, "q": "下列汇率理论中，强调利率差异对汇率影响的是（　）", "a": ["购买力平价理论", "利率平价理论", "国际收支说", "资产市场说", "", ""], "r": "B", "e": "利率平价理论认为，两国之间的利率差异会引起资金在两国间的流动，进而影响外汇市场的供求关系，最终导致汇率变动，强调利率差异对汇率的影响。而购买力平价理论强调物价水平对汇率的影响；国际收支说主要从国际收支角度分析汇率决定；资产市场说从资产市场角度研究汇率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387147", "t": 1, "q": "一国政府为稳定本币汇率，卖出外汇储备买入本币，这一操作会导致该国（　）", "a": ["货币供应量增加", "货币供应量减少", "利率下降", "物价上涨", "", ""], "r": "B", "e": "卖出外汇储备买入本币，市场上本币被回收，货币供应量减少。货币供应量减少会使得可贷资金减少，利率上升，进而抑制投资和消费，物价也会受到抑制。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387148", "t": 1, "q": "下列哪种方法属于外汇风险的事前管理", "a": ["外汇远期合约套期保值", "外汇期权合约套期保值", "调整合同计价货币", "外汇期货合约套期保值", "", ""], "r": "C", "e": "事前管理是在交易发生前采取措施防范风险。调整合同计价货币是在交易前就对货币选择进行安排来降低外汇风险，属于事前管理。而外汇远期、期权、期货合约套期保值多是在交易发生后为规避风险进行的操作。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387149", "t": 1, "q": "企业以外币计价的应收账款面临汇率下跌风险，为规避该风险，可采取的措施是（　）", "a": ["提前收取应收账款", "延迟收取应收账款", "买入远期外汇", "卖出外汇看跌期权", "", ""], "r": "A", "e": "汇率下跌会使外币应收账款兑换本币的金额减少。提前收取应收账款，能在汇率未进一步下跌时拿到款项，减少损失。延迟收款会因汇率继续下跌损失更大；买入远期外汇是应对外币升值风险；卖出外汇看跌期权不能规避汇率下跌风险。所以选A。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387150", "t": 1, "q": "下列属于远期外汇交易与外汇期货交易区别的是", "a": ["远期交易是标准化合约，期货交易是非标准化合约", "远期交易无需缴纳保证金，期货交易需缴纳保证金", "远期交易的交割率低于期货交易", "远期交易的风险低于期货交易", "", ""], "r": "B", "e": "远期外汇交易是非标准化合约，无需缴纳保证金，交割率高，风险大；外汇期货交易是标准化合约，需缴纳保证金，交割率低。所以A、C、D错误，B正确。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387151", "t": 1, "q": "金融危机中\"道德风险\"问题主要源于", "a": ["信息不对称", "利率过高", "汇率波动", "通货膨胀", "", ""], "r": "A", "e": "道德风险是指在信息不对称的情况下，一方利用信息优势做出不利于另一方的行为。利率、汇率、通货膨胀并非“道德风险”主要根源。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387152", "t": 1, "q": "利率平价理论的核心观点是", "a": ["汇率由两国物价水平之比决定", "汇率变动由两国利率差异决定", "汇率由国际收支状况决定", "汇率变动由经济增长速度差异决定", "", ""], "r": "B", "e": "利率平价理论强调汇率变动与两国利率差异有关，利率高的国家货币远期会贬值，利率低的国家货币远期会升值。A选项是购买力平价理论观点；C选项国际收支状况是国际收支说影响汇率的因素；D选项经济增长速度差异并非利率平价理论核心。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387153", "t": 1, "q": "亚洲金融危机中，主要受冲击的汇率制度类型是", "a": ["自由浮动汇率制度", "管理浮动汇率制度", "钉住汇率制度", "货币局制度", "", ""], "r": "C", "e": "亚洲金融危机中，实行钉住汇率制度的国家和地区因汇率缺乏弹性，难以应对外部冲击，遭受较大冲击。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387154", "t": 1, "q": "下列不属于国际金融合作形式的是（　）", "a": ["区域货币联盟", "双边货币互换协议", "跨国公司并购", "国际金融监管协调", "", ""], "r": "C", "e": "国际金融合作是国家间或国际组织在金融领域的协调协作，区域货币联盟、双边货币互换协议、国际金融监管协调都属于此范畴。而跨国公司并购是企业层面的商业活动，并非国际金融合作形式。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387155", "t": 1, "q": "根据国际收支的吸收论，货币贬值改善贸易收支的前提是（　）", "a": ["贬值能提高本国国民收入", "贬值能降低本国吸收水平", "贬值能提高本国出口弹性", "贬值能降低本国进口弹性", "", ""], "r": "B", "e": "吸收论认为贸易收支差额等于国民收入与国内吸收之差，即B = Y - A（B为贸易收支，Y为国民收入，A为国内吸收）。货币贬值要改善贸易收支，要么提高国民收入，要么降低国内吸收水平。本题选B，因为在吸收论里强调了降低吸收水平是货币贬值改善贸易收支的一个重要前提。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387156", "t": 1, "q": "下列关于外汇远期合约的说法，正确的是（　）", "a": ["合约标准化，流动性强", "交易双方必须在到期日交割", "由交易所集中交易", "违约风险较高", "", ""], "r": "D", "e": "外汇远期合约是非标准化的，由交易双方在场外自行协商确定，无交易所集中交易，灵活性强但流动性差，双方可协商是否在到期日交割，因缺乏第三方担保，违约风险较高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387157", "t": 1, "q": "根据国际收支平衡表的记账规则，进口商品应记入（　）", "a": ["贷方", "借方", "经常账户贷方", "资本账户借方", "", ""], "r": "B", "e": "国际收支平衡表中，进口意味着资金流出，按记账规则，资金流出记借方，进口商品属于经常账户，所以进口商品应记入经常账户借方。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387158", "t": 1, "q": "国际储备中流动性最强的资产是", "a": ["外汇储备", "黄金储备", "特别提款权", "在IMF的储备头寸", "", ""], "r": "A", "e": "外汇储备可随时用于国际支付，能迅速变现，流动性最强。黄金储备变现相对复杂，特别提款权使用受限，在IMF储备头寸也有一定使用条件。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387159", "t": 1, "q": "国际收支平衡表中，个人汇款、捐赠等单方面转移收支属于", "a": ["经常账户", "资本账户", "金融账户", "误差与遗漏账户", "", ""], "r": "A", "e": "经常账户包括货物、服务、初次收入和二次收入等，个人汇款、捐赠等单方面转移收支属于二次收入，所以属于经常账户。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387160", "t": 1, "q": "外汇掉期交易中，即期汇率与远期汇率的差额称为（　）", "a": ["利差", "汇差", "掉期率", "期权费", "", ""], "r": "C", "e": "外汇掉期交易里，即期汇率和远期汇率的差额叫掉期率。利差是利率差异；汇差一般不是该特定差额的称呼；期权费是期权交易费用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387161", "t": 1, "q": "当一国货币贬值时，下列行业中受益的是（　）", "a": ["进口导向型行业", "出口导向型行业", "依赖进口原材料的行业", "外债较多的行业", "", ""], "r": "B", "e": "货币贬值，本国商品在国际市场更便宜，利于出口，所以出口导向型行业受益。而进口导向型行业、依赖进口原材料的行业因货币贬值进口成本增加受损；外债较多的行业，还款时需用更多本币换外币偿债，也受损。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387162", "t": 1, "q": "次贷危机爆发的直接原因是", "a": ["美联储加息", "房地产泡沫破裂", "欧元升值", "国际贸易逆差扩大", "", ""], "r": "B", "e": "次贷危机中大量次级抵押贷款者违约，而这与房地产泡沫破裂密切相关，房价下跌使很多人无力还贷，引发危机。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387163", "t": 1, "q": "国际收支说认为，影响汇率的核心因素是", "a": ["两国货币购买力差异", "两国利率差异", "国际收支状况", "两国资产收益率差异", "", ""], "r": "C", "e": "国际收支说强调汇率由国际收支状况决定。国际收支状况变化会引起外汇供求变动，进而影响汇率。A是购买力平价理论关注的，B是利率平价理论要点，D并非国际收支说核心。所以答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387164", "t": 1, "q": "国际收支平衡表中，贷方记录的是（　）", "a": ["资产增加和负债减少", "资产减少和负债增加", "收入减少和支出增加", "进口增加和出口减少", "", ""], "r": "B", "e": "国际收支平衡表中贷方记录资产减少、负债增加等情况。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387165", "t": 1, "q": "亚洲基础设施投资银行（AIIB）的主要出资方是", "a": ["美国", "欧盟", "中国", "日本", "", ""], "r": "C", "e": "中国是亚投行的发起国且是最大出资方。美国、日本未加入亚投行，欧盟并非主要出资主体。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387166", "t": 1, "q": "根据粘性价格货币模型，长期货币供给增加会导致本币（　）", "a": ["升值", "贬值", "回到初始汇率水平", "持续贬值", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387167", "t": 1, "q": "下列外汇交易中，交易双方约定在未来某一特定日期以约定汇率交换一定金额的两种货币，且仅在到期日进行一次交割的是（　）", "a": ["即期外汇交易", "远期外汇交易", "外汇掉期交易", "外汇期权交易", "", ""], "r": "B", "e": "远期外汇交易是交易双方约定在未来某一特定日期以约定汇率交换一定金额的两种货币，且仅在到期日一次交割。即期是现汇交易；掉期是在不同日期进行方向相反的两次外汇交易；期权是赋予期权买方在未来特定时间按约定价格买卖外汇的权利。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387168", "t": 1, "q": "热钱流动的主要特征是", "a": ["期限长、稳定性强", "期限短、流动性强、投机性强", "主要用于实体经济投资", "受贸易收支驱动", "", ""], "r": "B", "e": "热钱为追求高回报而在市场快速流动。它通常短期进出市场，所以期限短、流动性强，且以投机获利为目的，投机性强。而A选项期限长、稳定性强与热钱特点不符；C选项热钱多在金融市场等投机，并非主要用于实体经济投资；D选项热钱流动主要受利差、汇率等因素驱动，而非贸易收支。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387169", "t": 1, "q": "外汇期货交易中，保证金制度的主要作用是（　）", "a": ["增加交易成本", "防范信用风险", "提高交易杠杆", "限制交易规模", "", ""], "r": "B", "e": "保证金制度能让交易双方在违约时用保证金弥补损失，主要作用是防范信用风险。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818536039387170", "t": 1, "q": "巴塞尔协议Ⅲ的核心监管要求不包括", "a": ["提高资本充足率", "引入流动性覆盖率指标", "限制金融机构的经营范围", "建立宏观审慎监管框架", "", ""], "r": "C", "e": "巴塞尔协议Ⅲ主要聚焦资本、流动性及宏观审慎等监管。A提高资本充足率、B引入流动性覆盖率指标、D建立宏观审慎监管框架都是其核心内容。而限制金融机构经营范围并非巴塞尔协议Ⅲ核心监管要求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725184", "t": 2, "q": "国际金融合作的必要性包括（　）", "a": ["经济全球化的客观要求", "防范跨境金融风险", "促进国际贸易和投资", "维护汇率稳定", "", ""], "r": "ABCD", "e": "经济全球化下国际经济联系紧密，需金融合作；防范跨境金融风险、促进国际贸易和投资、维护汇率稳定都需要各国通过金融合作来达成。ABCD 选项均是国际金融合作的必要性体现。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725185", "t": 2, "q": "世界银行的主要业务包括", "a": ["提供长期开发贷款", "提供技术援助", "促进国际贸易自由化", "协调成员国货币政策", "", ""], "r": "AB", "e": "世界银行主要为发展中国家提供长期开发贷款和技术援助等。A选项提供长期开发贷款是其核心业务之一；B选项技术援助也是其重要工作内容。C选项促进国际贸易自由化主要是世界贸易组织的职责；D选项协调成员国货币政策是国际货币基金组织的职能。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725186", "t": 2, "q": "系统性金融危机的特征包括（　）", "a": ["传染性强", "影响范围广", "破坏力大", "仅影响金融领域", "", ""], "r": "ABC", "e": "系统性金融危机涉及整个金融体系，会蔓延至实体经济等多领域，不只是影响金融领域。而其具有传染性强、影响范围广、破坏力大等特征。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725187", "t": 2, "q": "根据购买力平价理论，影响汇率长期变动的关键因素有（　）", "a": ["两国物价水平差异", "两国利率水平差异", "两国货币供给量增长率差异", "两国贸易收支差额", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725188", "t": 2, "q": "国际金融合作的主要形式包括", "a": ["建立国际金融组织", "签订双边货币互换协议", "推进区域货币合作", "制定国际金融规则", "", ""], "r": "ABCD", "e": "国际金融合作有多种形式，建立国际金融组织能协调全球金融事务；双边货币互换协议可促进两国间金融合作；区域货币合作能加强区域内金融稳定；制定国际金融规则利于规范国际金融秩序。ABCD都是常见主要形式。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725189", "t": 2, "q": "下列属于管理浮动汇率制的特点有（　）", "a": ["汇率由市场供求决定", "政府不干预外汇市场", "政府偶尔进行适度干预", "汇率波动幅度相对较小", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725190", "t": 2, "q": "汇率制度的类型包括（　）", "a": ["固定汇率制度", "浮动汇率制度", "管理浮动汇率制度", "爬行钉住汇率制度", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725191", "t": 2, "q": "国际收支顺差对一国经济的负面影响包括（　）", "a": ["本币升值压力增大", "贸易摩擦加剧", "国内通胀压力上升", "外汇储备缩水", "", ""], "r": "ABC", "e": "国际收支顺差意味着出口多、外汇流入多，会使本币需求增加，有升值压力；顺差易引发他国不满，加剧贸易摩擦；外汇流入多会增加货币供应量，带来通胀压力。而顺差会使外汇储备增加而非缩水。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725192", "t": 2, "q": "国际收支顺差的影响包括（　）", "a": ["本币升值压力", "外汇储备增加", "国内货币供给增加", "贸易摩擦加剧", "", ""], "r": "ABCD", "e": "国际收支顺差意味着出口大于进口，外汇流入增多。外汇流入多会使外汇储备增加，同时市场上外汇供大于求，本币有升值压力。央行为稳定汇率购入外汇，会投放本币，使国内货币供给增加。顺差过大易引发贸易摩擦。ABCD选项均符合顺差影响。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725193", "t": 2, "q": "利率平价理论的假设条件包括", "a": ["资本完全自由流动", "无交易成本", "无套利机会", "物价水平稳定", "", ""], "r": "ABC", "e": "利率平价理论假设资本能完全自由流动，交易无成本，且市场不存在套利机会，这样才能使不同货币的利率和汇率达到均衡关系。而物价水平稳定并非利率平价理论的核心假设条件。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725194", "t": 2, "q": "下列属于外汇期货交易的独特机制有（　）", "a": ["保证金制度", "逐日盯市制度", "合约标准化", "协商定价机制", "", ""], "r": "ABC", "e": "外汇期货交易采用集中公开竞价的方式，并非协商定价机制。而保证金制度、逐日盯市制度、合约标准化都是外汇期货交易的独特机制。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725195", "t": 2, "q": "国际金融合作中，货币政策协调的主要内容包括（　）", "a": ["利率政策协调", "货币供给量协调", "汇率政策协调", "财政政策协调", "", ""], "r": "ABC", "e": "货币政策协调围绕货币政策工具和相关变量，利率、货币供给量、汇率是重要方面；而财政政策与货币政策是不同类型政策，不属于货币政策协调内容。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725196", "t": 2, "q": "国际储备管理的基本原则包括", "a": ["安全性原则", "流动性原则", "盈利性原则", "充足性原则", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725197", "t": 2, "q": "国际储备的主要作用有", "a": ["弥补国际收支逆差", "维持本币汇率稳定", "充当对外举债的信用保证", "促进国内经济增长", "", ""], "r": "ABC", "e": "国际储备可用于弥补收支逆差、稳定汇率、作为对外举债信用保证。而促进国内经济增长并非其主要作用。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725198", "t": 2, "q": "影响汇率变动的长期因素包括", "a": ["通货膨胀率差异", "经济增长速度差异", "利率水平差异", "国际收支状况", "", ""], "r": "ABD", "e": "通货膨胀率差异、经济增长速度差异和国际收支状况对汇率的影响是长期的。而利率水平差异主要产生短期影响。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725199", "t": 2, "q": "导致金融危机的内部因素有", "a": ["金融体系脆弱性", "宏观经济失衡", "汇率制度不合理", "国际游资冲击", "", ""], "r": "ABC", "e": "A、B、C属于内部因素，金融体系脆弱易引发危机，宏观经济失衡会破坏经济稳定，不合理汇率制度也会带来风险；D国际游资冲击是外部因素。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725200", "t": 2, "q": "国际储备的主要来源有", "a": ["国际收支顺差", "中央银行外汇干预购入的外汇", "IMF分配的特别提款权", "政府对外借款", "", ""], "r": "ABCD", "e": "国际收支顺差会使外汇储备增加；央行外汇干预购入外汇直接增加储备；IMF分配的特别提款权是国际储备的一部分；政府对外借款也能增加国际储备。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725201", "t": 2, "q": "外汇期权交易的核心要素包括", "a": ["期权费", "执行价格", "到期日", "交割方式", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725202", "t": 2, "q": "固定汇率制度的缺点包括（　）", "a": ["货币政策独立性丧失", "易受投机攻击", "国际收支调节压力大", "汇率波动剧烈", "", ""], "r": "ABC", "e": "固定汇率下，央行需维持汇率稳定，货币政策受限制，独立性丧失；汇率固定易引发投机者攻击；国际收支失衡时，缺乏汇率自动调节机制，调节压力大。而固定汇率制度汇率相对稳定，并非波动剧烈。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725203", "t": 2, "q": "下列属于国际储备资产的有", "a": ["美元外汇储备", "黄金储备", "特别提款权", "企业持有的海外资产", "", ""], "r": "ABC", "e": "国际储备资产包括货币性黄金、外汇储备、在IMF的储备头寸和特别提款权。A美元外汇储备是外汇储备的一种；B黄金储备属于货币性黄金；C特别提款权是国际储备一部分。而D企业持有的海外资产不属于国家层面的国际储备资产。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725204", "t": 2, "q": "短期国际资本流动的特点有（　）", "a": ["流动性强", "投机性强", "期限短", "稳定性高", "", ""], "r": "ABC", "e": "短期国际资本流动期限短，能快速转移，所以流动性强，且常为获取短期差价进行投机，投机性强。而因其短期逐利，稳定性低。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725205", "t": 2, "q": "固定汇率制度下，国际收支逆差的调节机制包括（　）", "a": ["外汇储备减少", "货币供给收缩", "利率上升", "本币贬值", "", ""], "r": "ABC", "e": "固定汇率制下国际收支逆差，央行需动用外汇储备维持汇率，会使外汇储备减少；外汇储备减少会导致货币供给收缩；货币供给收缩会使利率上升。而固定汇率制下本币汇率固定，不会贬值。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725206", "t": 2, "q": "国际货币基金组织的贷款类型包括（　）", "a": ["普通贷款", "备用安排", "中期贷款", "应急融资贷款", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725207", "t": 2, "q": "长期国际资本流动包括", "a": ["国际直接投资", "国际证券投资（期限1年以上）", "国际贷款（期限1年以上）", "热钱流动", "", ""], "r": "ABC", "e": "长期国际资本流动指期限在1年以上的资本流动，国际直接投资、期限1年以上的国际证券投资和国际贷款都属于长期资本流动，而热钱流动是短期投机性资金流动。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725208", "t": 2, "q": "国际资本流动的驱动因素包括", "a": ["利差", "汇率预期", "风险差异", "政策导向", "", ""], "r": "ABCD", "e": "利差会吸引资本流向高收益地区；汇率预期影响资本对不同货币资产的配置；风险差异使资本倾向流向低风险区域；政策导向也会引导资本流动。ABCD 选项都是国际资本流动的驱动因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725209", "t": 2, "q": "下列汇率理论中，考虑了资产供求因素的有（　）", "a": ["资产组合平衡理论", "货币主义汇率理论", "购买力平价理论", "利率平价理论", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725210", "t": 2, "q": "国际金融监管合作的主要内容包括（　）", "a": ["统一监管标准", "信息共享", "跨境风险处置", "汇率政策协调", "", ""], "r": "ABC", "e": "国际金融监管合作旨在应对跨境金融活动带来的风险等问题。统一监管标准能让不同国家和地区监管要求一致；信息共享利于各方掌握金融动态；跨境风险处置可协同应对跨国金融风险。而汇率政策协调主要属于国际货币政策协调范畴，并非金融监管合作主要内容。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725211", "t": 2, "q": "资产市场说将汇率视为资产价格，其包含的理论有（　）", "a": ["弹性价格货币模型", "粘性价格货币模型", "资产组合平衡模型", "购买力平价模型", "", ""], "r": "ABC", "e": "资产市场说包含弹性价格货币模型、粘性价格货币模型、资产组合平衡模型。购买力平价模型是从商品角度解释汇率决定，不属于资产市场说。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725212", "t": 2, "q": "企业应对交易风险的常用方法有（　）", "a": ["远期外汇交易保值", "外汇期权交易保值", "调整合同计价货币", "提前或推迟收付汇", "", ""], "r": "ABCD", "e": "ABCD四个选项都是企业应对交易风险的常用方法。远期外汇交易保值能锁定汇率；外汇期权交易保值可灵活应对汇率变动；调整合同计价货币可降低汇率风险；提前或推迟收付汇能利用汇率波动减少损失。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725213", "t": 2, "q": "国际收支顺差的影响包括", "a": ["外汇储备增加", "本币面临升值压力", "促进经济增长", "可能引发贸易摩擦", "", ""], "r": "ABCD", "e": "国际收支顺差意味着出口大于进口，外汇收入增多，会使外汇储备增加，A正确；外汇增多会使本币需求增加，面临升值压力，B正确；出口增加能带动经济增长，C正确；顺差可能引发他国不满，导致贸易摩擦，D正确。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725214", "t": 2, "q": "外汇风险的事后管理方法有", "a": ["外汇远期合约对冲", "外汇期货合约对冲", "外汇掉期交易", "调整经营策略消化汇率损失", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725215", "t": 2, "q": "根据资产组合平衡模型，影响汇率的因素包括（　）", "a": ["本国资产供给", "外国资产供给", "资产预期收益率", "风险偏好", "", ""], "r": "ABCD", "e": "资产组合平衡模型认为，汇率由本国资产和外国资产的供求决定。本国资产供给、外国资产供给会改变资产市场的供求状况，影响汇率。资产预期收益率会影响投资者对资产的需求，风险偏好也会使投资者在不同资产间的配置发生变化，进而影响汇率。ABCD四个选项都会影响汇率。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725216", "t": 2, "q": "下列属于国际收支平衡表中\"误差与遗漏\"项目产生原因的有（　）", "a": ["统计误差", "资本外逃", "数据来源不同", "记账货币转换差异", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818537557725217", "t": 2, "q": "区域金融合作的主要内容包括", "a": ["货币互换", "区域金融市场发展", "金融监管协调", "汇率政策协调", "", ""], "r": "ABCD", "e": "区域金融合作旨在加强区域内金融联系与稳定，货币互换可增强流动性、降低汇率风险；发展区域金融市场能提升金融资源配置效率；金融监管协调可防范金融风险跨区域传导；汇率政策协调利于维持区域汇率稳定。ABCD选项均是区域金融合作的主要内容。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770176", "t": 3, "q": "特别提款权是IMF发行的储备资产", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "特别提款权是国际货币基金组织（IMF）创设的一种储备资产和记账单位。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770177", "t": 3, "q": "外汇掉期交易的两笔交易汇率相同", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇掉期交易包含一笔即期交易和一笔远期交易，二者汇率通常不同。因为远期汇率会受到利率差异、市场预期等多种因素影响。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770178", "t": 3, "q": "国际储备的盈利性是其管理的首要原则。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际储备管理的首要原则是安全性，而非盈利性。因为国际储备要能随时用于弥补国际收支逆差、稳定汇率等，必须保证储备资产安全可靠。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770179", "t": 3, "q": "短期国际资本流动的稳定性高于长期国际资本流动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "短期国际资本流动受各种因素影响大，流动性强、易逆转，而长期国际资本流动通常基于长期投资目的，稳定性更好，所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770180", "t": 3, "q": "爬行钉住汇率制下，汇率调整的幅度和频率是固定不变的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "爬行钉住汇率制下，汇率会根据一组选定的指标频繁地、小幅度地调整，调整幅度和频率并非固定不变，而是可根据实际情况灵活变动。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770181", "t": 3, "q": "国际金融监管合作的核心是统一各国的金融监管法律。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际金融监管合作核心是应对金融全球化带来的系统性风险、加强跨境监管协调等，并非单纯统一各国金融监管法律，各国国情不同，法律难以完全统一。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770182", "t": 3, "q": "资产组合平衡理论认为，投资者会根据资产的收益和风险调整资产组合，从而影响汇率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资产组合平衡理论明确提出投资者为实现最优投资组合，会综合考量资产收益与风险来调整资产配置，而此过程会对货币供求产生作用，进而影响汇率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770183", "t": 3, "q": "即期外汇交易的交割日是交易当天", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "即期外汇交易交割日通常是交易日后的第二个营业日，并非交易当天。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770184", "t": 3, "q": "外汇批发市场的交易规模远大于零售外汇市场。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇批发市场主要是银行间等金融机构间的交易，单笔交易金额大、交易频繁，而零售外汇市场主要是个人和中小企业参与，交易规模小。所以外汇批发市场交易规模远大于零售外汇市场。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770185", "t": 3, "q": "流动性危机的核心是金融机构的支付困难", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流动性危机主要体现为金融机构资金流动性不足，难以满足支付需求，核心就是支付困难。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770186", "t": 3, "q": "金融危机的外部传导主要通过贸易渠道", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770187", "t": 3, "q": "购买力平价理论更适用于短期汇率预测", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "购买力平价理论基于商品价格和货币购买力来解释汇率，但其成立依赖诸多严格假设，现实中短期内市场会受多种因素如投机、政治局势等冲击，难以满足其假设条件，所以该理论更适用于长期汇率预测而非短期。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770188", "t": 3, "q": "外汇掉期交易中，近端汇率与远端汇率的差额称为利差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇掉期交易中，近端汇率与远端汇率的差额称为掉期点，并非利差，利差是指不同货币利率之间的差异。", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770189", "t": 3, "q": "外汇期货交易的交割比例远高于远期外汇交易。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇期货交易实际交割比例很低，而远期外汇交易通常会按约定进行交割，所以外汇期货交易交割比例远低于远期外汇交易。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770190", "t": 3, "q": "国际金融合作的主要目标是维护国际金融体系的稳定，促进全球经济平衡发展。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际金融合作就是为应对国际金融问题、稳定金融秩序、推动全球经济协调发展而开展的，主要目标确实是维护国际金融体系稳定和促进全球经济平衡发展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770191", "t": 3, "q": "热钱具有流动速度快、投机性强的特点，其流动缺乏稳定性和长期性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热钱是为追求高回报而在市场上迅速流动的短期资金，流动速度快，以投机获利为目的，不会长期稳定地停留在一个市场。所以题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770192", "t": 3, "q": "交易风险是企业面临的最主要的外汇风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "交易风险涉及企业在以外币计价的各类交易中，因汇率变动导致实际收益或成本与预期出现差异，对企业现金流和利润影响显著，是企业面临的最主要外汇风险。", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770193", "t": 3, "q": "货币互换交易不仅可以对冲汇率风险，还可以对冲利率风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币互换是指两笔金额相同、期限相同、计算利率方法相同，但货币不同的债务资金之间的调换，同时也进行不同利息额的货币调换。它既涉及不同货币的兑换，能对冲汇率风险，也涉及不同利率的交换，可对冲利率风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770194", "t": 3, "q": "外汇风险管理的投机策略是企业应对汇率风险的主要方式，适用于各类企业。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇风险管理的投机策略有很大不确定性和高风险性，并非企业应对汇率风险主要方式，也不适用于各类企业。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770195", "t": 3, "q": "外汇期权的卖方盈利潜力无限，亏损仅限于收取的权利金。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇期权卖方盈利仅限于收取的权利金，而亏损可能无限，因为市场走向不利时需按约定履行义务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770196", "t": 3, "q": "即期外汇交易的交割日通常为交易后的第二个营业日。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "即期外汇交易是指买卖双方成交后，在两个营业日内办理交割的外汇交易，所以交割日通常是交易后的第二个营业日。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770197", "t": 3, "q": "国际储备越多对一国越有利", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际储备并非越多越好。储备过多会使持有成本上升，造成资源闲置浪费，还可能引发国内通货膨胀等问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770198", "t": 3, "q": "固定汇率制度下，国际收支顺差会导致货币供给收缩。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "固定汇率制度下，国际收支顺差时，外汇供大于求，本币有升值压力。为维持汇率稳定，货币当局会买入外汇，投放本币，这会使得货币供给增加，而不是收缩。", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770199", "t": 3, "q": "浮动汇率制度下，汇率由市场供求决定，央行不会进行干预。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "浮动汇率制下，央行虽不进行固定汇率干预，但为维护经济稳定等，会在必要时对汇率进行一定干预。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770200", "t": 3, "q": "一国货币贬值一定会改善该国的贸易收支。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币贬值改善贸易收支需满足一定条件，如马歇尔 - 勒纳条件，且存在 J 曲线效应，即短期内贬值可能使贸易收支恶化，并非一定会改善。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770201", "t": 3, "q": "特别提款权的分配与各国的国际贸易额直接挂钩。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "特别提款权的分配是按照成员国在国际货币基金组织的份额进行的，并非与各国国际贸易额直接挂钩。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770202", "t": 3, "q": "次贷危机是典型的债务危机", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770203", "t": 3, "q": "国际收支顺差意味着一国的经济状况良好，没有任何负面影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。国际收支顺差虽在一定程度上反映经济实力和出口竞争力，但也有负面影响，如会使本币面临升值压力、引发贸易摩擦、导致国内货币供给增加引发通胀等。所以题干说没有任何负面影响表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770204", "t": 3, "q": "国际储备中的IMF储备头寸是成员国向IMF缴纳的份额中未动用的部分。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "IMF储备头寸就是成员国向IMF缴纳份额里未动用的部分，该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770205", "t": 3, "q": "购买力平价理论的核心假设是一价定律成立。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "购买力平价理论认为在无交易成本等条件下，同样的商品在不同国家以相同货币衡量价格应相同，这就是一价定律，它是购买力平价理论的核心假设。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770206", "t": 3, "q": "提前或推迟收付属于外汇风险的中和策略", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "提前或推迟收付是外汇风险的一种管理方法，但它不属于中和策略，中和策略通常涉及多种货币搭配等方式来平衡外汇风险。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770207", "t": 3, "q": "国际收支平衡表的记账原则是权责发生制", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际收支平衡表采用复式记账法，其记账原则是权责发生制，以交易所有权变更时间为准记录国际经济交易。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770208", "t": 3, "q": "特别提款权可以直接用于国际贸易的支付。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "特别提款权是国际货币基金组织创设的一种储备资产和记账单位，不是真正货币，不能直接用于国际贸易支付。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770209", "t": 3, "q": "根据购买力平价理论，两国物价水平之比等于汇率水平。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770210", "t": 3, "q": "直接投资属于短期国际资本流动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "直接投资是投资者为了在国外获得长期的投资效益并拥有对企业或公司的控制权和经营管理权而进行的投资，属于长期国际资本流动，并非短期。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770211", "t": 3, "q": "国际收支逆差必然导致本币汇率贬值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际收支逆差时，外汇需求大于供给，理论上本币有贬值压力，但汇率还受多种因素影响，如政府干预、经济基本面、市场预期等，所以国际收支逆差不一定必然导致本币汇率贬值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770212", "t": 3, "q": "黄金储备是各国国际储备的主要组成部分", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际储备主要由货币性黄金、外汇储备、在IMF的储备头寸和特别提款权构成，其中外汇储备是各国国际储备的主要组成部分，而非黄金储备。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770213", "t": 3, "q": "短期资本流动对一国经济的影响具有两面性，既有积极作用也有消极影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "短期资本流动能带来资金、促进市场活跃等积极作用，也会造成金融市场波动、冲击汇率等消极影响，所以具有两面性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770214", "t": 3, "q": "外汇期权的卖方享有是否执行合约的选择权，买方需承担履约义务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇期权中是买方享有是否执行合约的选择权，卖方承担履约义务，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770215", "t": 3, "q": "外汇期货交易实行保证金制度", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇期货交易为降低违约风险、保障交易正常进行，实行保证金制度，交易者需按规定缴纳一定比例保证金。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770216", "t": 3, "q": "远期外汇交易的汇率是由市场供求关系决定的，与即期汇率无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "远期外汇交易汇率与即期汇率有关，它是在即期汇率基础上，考虑利率差异、期限等因素确定的，并非只由市场供求决定且与即期汇率无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770217", "t": 3, "q": "金融传导是国际金融危机最主要的传导途径。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际金融危机的传导途径主要有贸易传导、金融传导、预期传导等。金融传导在危机传导过程中作用显著，因为在经济全球化背景下，各国金融市场联系紧密，一国金融市场波动会通过资本流动、信贷收缩等渠道迅速扩散至其他国家，是国际金融危机最主要的传导途径。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770218", "t": 3, "q": "远期外汇合约是双边合约，交易双方均有义务在到期日按照约定汇率进行交割。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "远期外汇合约是交易双方达成的在未来某一特定日期按约定汇率买卖一定数量外汇的合约，双方都有按约定在到期日进行交割的义务。", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770219", "t": 3, "q": "特别提款权是国际货币基金组织发行的有形资产，可直接用于国际贸易支付。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "特别提款权是国际货币基金组织创设的一种储备资产和记账单位，并非有形资产，也不能直接用于国际贸易支付。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818538702770220", "t": 3, "q": "外汇交易风险是指企业在会计报表折算时因汇率波动导致的账面损益。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。外汇交易风险是指企业或个人在以外币进行的各类交易中，因汇率变动使折算为本币的数额增加或减少的风险。而企业在会计报表折算时因汇率波动导致的账面损益是外汇折算风险，并非交易风险。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 国际金融（4）", "n": "基础练习题【含解析】 / 第3章 国际金融（4）", "qs": [{"id": "2034818545585623040", "t": 1, "q": "东盟与中日韩（10+3）的金融合作不包括", "a": ["亚洲债券市场倡议", "清迈倡议多边化", "建立区域货币联盟", "货币互换协议", "", ""], "r": "C", "e": "东盟与中日韩（10 + 3）金融合作包括亚洲债券市场倡议、清迈倡议多边化、货币互换协议等。目前尚未建立区域货币联盟。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623041", "t": 1, "q": "国际储备中，流动性最强的资产是（　）", "a": ["黄金储备", "外汇储备", "特别提款权", "IMF储备头寸", "", ""], "r": "B", "e": "外汇储备可随时用于国际支付和干预外汇市场，流动性最强。黄金储备变现相对复杂；特别提款权使用有一定限制；IMF储备头寸使用也不如外汇灵活。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623042", "t": 1, "q": "外汇远期合约的交割价格是", "a": ["合约签订时的即期汇率", "合约到期时的即期汇率", "合约签订时约定的未来交割汇率", "合约到期时的远期汇率", "", ""], "r": "C", "e": "外汇远期合约是交易双方约定在未来某一特定日期，按事先约定的价格（即约定的未来交割汇率）买卖一定数量外汇的合约。A选项合约签订时的即期汇率不是交割价格；B选项合约到期时的即期汇率与约定的交割价格无关；D选项合约到期时的远期汇率也不是交割价格。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623043", "t": 1, "q": "特别提款权的定值货币篮子不包括（　）", "a": ["美元", "欧元", "日元", "卢布", "", ""], "r": "D", "e": "特别提款权定值货币篮子包含美元、欧元、人民币、日元和英镑，不包括卢布。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623044", "t": 1, "q": "根据绝对购买力平价，若A国物价水平高于B国，则A国货币对B国货币的汇率应（　）", "a": ["升值", "贬值", "平价", "波动", "", ""], "r": "B", "e": "绝对购买力平价理论认为汇率由两国物价水平决定，物价高的国家货币购买力低，货币会贬值。A国物价水平高于B国，所以A国货币对B国货币应贬值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623045", "t": 1, "q": "国际收支平衡表中，记录金融资产跨国转移的账户是（　）", "a": ["经常账户", "资本与金融账户", "储备资产账户", "经常转移账户", "", ""], "r": "B", "e": "国际收支平衡表中，资本与金融账户记录资产在居民与非居民之间的转移，也就是金融资产跨国转移。经常账户记录货物、服务等交易；储备资产账户是对储备资产增减变化的记录；经常转移账户记录单方面的、无对等回报的转移。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623046", "t": 1, "q": "一国国际储备的适度规模通常与该国的", "a": ["人口数量正相关", "经济开放度正相关", "通货膨胀率正相关", "利率水平正相关", "", ""], "r": "B", "e": "经济开放度越高，对外贸易、资本流动等国际经济活动越频繁，面临的国际收支波动风险越大，就需要更多国际储备来应对，所以国际储备适度规模与经济开放度正相关。而人口数量、通货膨胀率、利率水平与国际储备适度规模无直接正相关关系。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623047", "t": 1, "q": "当一国货币升值时，对其进出口贸易的影响是（　）", "a": ["出口增加，进口减少", "出口减少，进口增加", "进出口均增加", "进出口均减少", "", ""], "r": "B", "e": "货币升值意味着本国货币更值钱了，外国购买本国商品变贵，所以出口减少；而本国购买外国商品更便宜了，进口会增加。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623048", "t": 1, "q": "下列不属于外汇远期交易特点的是", "a": ["合约条款标准化", "交易双方协商确定汇率", "交割期限灵活", "主要用于套期保值", "", ""], "r": "A", "e": "外汇远期交易是交易双方协商达成的非标准化合约。而合约条款标准化是外汇期货交易的特点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623049", "t": 1, "q": "下列属于国际储备中储备货币的是（　）", "a": ["特别提款权", "本国发行的国债", "企业持有的外国债券", "商业银行的外汇存款", "", ""], "r": "A", "e": "国际储备包括货币性黄金、外汇储备、IMF储备头寸和特别提款权。特别提款权是储备货币。本国国债不是国际储备；企业持有的外国债券和商业银行外汇存款不属于官方国际储备范畴。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623050", "t": 1, "q": "导致20世纪90年代亚洲金融危机的主要国际资本流动类型是（　）", "a": ["长期直接投资", "短期投机性资本", "官方援助资本", "跨国公司内部资金流动", "", ""], "r": "B", "e": "20世纪90年代亚洲金融危机中，短期投机性资本大量涌入和快速撤离，冲击了亚洲国家的金融市场，引发危机。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623051", "t": 1, "q": "利率平价理论中，远期汇率与即期汇率的差异取决于", "a": ["两国物价水平差异", "两国利率水平差异", "两国国际收支差异", "两国经济增长差异", "", ""], "r": "B", "e": "利率平价理论认为，远期汇率与即期汇率的差异主要由两国利率水平差异决定，资金会从低利率国家流向高利率国家，从而影响汇率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623052", "t": 1, "q": "外汇期权的买方在到期日之前，有权决定是否执行合约，这种权利体现了期权的（　）", "a": ["杠杆性", "风险性", "灵活性", "收益性", "", ""], "r": "C", "e": "外汇期权买方能在到期日前决定是否执行合约，可根据市场情况灵活操作，这体现了灵活性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623053", "t": 1, "q": "外汇期权交易中，期权买方支付的权利金的作用是（　）", "a": ["作为履约保证金", "获得在约定时间买卖外汇的权利", "锁定未来汇率", "弥补卖方的交易成本", "", ""], "r": "B", "e": "期权买方支付权利金是为获得在约定时间按约定价格买卖外汇的权利。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623054", "t": 1, "q": "根据购买力平价理论，若一国发生通货膨胀，而外国通胀率为零，则该国货币汇率会（　）", "a": ["升值，幅度等于通胀率", "贬值，幅度等于通胀率", "升值，幅度大于通胀率", "贬值，幅度小于通胀率", "", ""], "r": "B", "e": "购买力平价理论中，通胀使本国货币购买力下降。一国通胀而外国无通胀，该国货币会贬值，且贬值幅度等于通胀率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623055", "t": 1, "q": "根据利率平价理论，若本国利率高于外国利率，则远期汇率会呈现（　）", "a": ["升水", "贴水", "平价", "无法确定", "", ""], "r": "B", "e": "利率平价理论中，本国利率高于外国利率时，资金会流入本国，本币在远期市场上供大于求，导致远期本币贬值，即远期汇率贴水。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623056", "t": 1, "q": "国际收支逆差时，该国货币汇率通常会", "a": ["升值", "贬值", "保持不变", "先升值后贬值", "", ""], "r": "B", "e": "国际收支逆差意味着该国对外支出大于收入，外汇需求大于供给，本币供大于求，所以本币会贬值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623057", "t": 1, "q": "在国际收支平衡表中，错误与遗漏账户的设立是为了（　）", "a": ["记录无法归类的交易", "弥补统计误差，使账户平衡", "反映国际储备的变动", "记录短期资本流动", "", ""], "r": "B", "e": "国际收支平衡表理论上借贷双方应相等，但实际统计中会有误差，错误与遗漏账户就是为了弥补这些统计误差，让账户达到平衡。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623058", "t": 1, "q": "在外汇市场中，交易者为规避未来汇率波动风险而进行的交易是（　）", "a": ["即期外汇交易", "远期外汇交易", "投机性外汇交易", "套汇交易", "", ""], "r": "B", "e": "远期外汇交易是买卖双方先签订合同，规定买卖外汇的币种、数额、汇率和将来交割的时间，到规定的交割日期，再按合同规定，卖方交汇，买方付款的外汇交易。可用于规避未来汇率波动风险。即期外汇交易是现汇交易，不能规避未来风险；投机性外汇交易是为获利；套汇交易是利用不同市场汇率差异获利。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623059", "t": 1, "q": "国际货币基金组织（IMF）的主要职能不包括", "a": ["提供短期贷款缓解国际收支困难", "促进汇率稳定和国际收支平衡", "制定国际贸易规则", "监督成员国的经济和金融政策", "", ""], "r": "C", "e": "制定国际贸易规则是世界贸易组织（WTO）的职能，而国际货币基金组织主要是提供短期贷款、促进汇率稳定和国际收支平衡、监督成员国经济和金融政策。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623060", "t": 1, "q": "外汇期货交易与远期外汇交易的主要区别在于（　）", "a": ["是否有避险功能", "是否标准化合约", "是否涉及实际外汇交割", "是否由银行作为交易对手", "", ""], "r": "B", "e": "外汇期货交易是标准化合约，在交易所集中交易；远期外汇交易是非标准化合约，由双方协商确定条款。二者都有避险功能，都可能涉及实际外汇交割，银行也都可能作为交易对手。所以主要区别在于是否为标准化合约。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623061", "t": 1, "q": "企业面临的外汇交易风险是指", "a": ["汇率变动对已实现的外汇收支的影响", "汇率变动对未来外汇收支的影响", "汇率变动对资产负债表的影响", "汇率变动对企业战略决策的影响", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623062", "t": 1, "q": "下列汇率制度中，汇率由市场供求决定但政府偶尔干预的是（　）", "a": ["固定汇率制", "自由浮动汇率制", "管理浮动汇率制", "爬行钉住汇率制", "", ""], "r": "C", "e": "管理浮动汇率制下汇率由市场供求决定，但政府会偶尔进行干预。固定汇率制汇率基本固定；自由浮动汇率制政府不干预；爬行钉住汇率制是汇率按预先宣布的固定范围做较小的定期调整。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623063", "t": 1, "q": "即期外汇交易的交割期限通常是", "a": ["交易当日", "交易后第一个工作日", "交易后第二个工作日", "交易后一周内", "", ""], "r": "C", "e": "即期外汇交易是指在外汇买卖成交后，原则上在两个工作日内办理交割的外汇交易。所以其交割期限通常是交易后第二个工作日。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623064", "t": 1, "q": "当一国国际收支出现巨额顺差时，央行可能采取的干预措施是（　）", "a": ["抛售本币，买入外汇", "抛售外汇，买入本币", "提高利率", "降低法定存款准备金率", "", ""], "r": "A", "e": "国际收支巨额顺差意味着外汇供大于求，本币有升值压力。央行要缓解这一情况，应增加外汇需求、减少本币需求。抛售本币、买入外汇可使外汇需求增加，本币供给增加，缓解本币升值压力。B选项会使外汇减少、本币升值；C提高利率会吸引外资流入，加剧顺差；D降低法定存款准备金率会使货币供给增加，加剧顺差。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623065", "t": 1, "q": "关于外汇市场的离岸市场，下列说法正确的是", "a": ["交易货币必须包含所在国货币", "交易活动受所在国金融监管严格约束", "主要为非居民之间的外汇交易提供服务", "伦敦离岸外汇市场是全球最大的在岸市场", "", ""], "r": "C", "e": "离岸市场主要为非居民之间的外汇交易提供服务，不局限于所在国货币，且交易活动受所在国金融监管约束小。伦敦离岸外汇市场是全球最大的离岸市场。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623066", "t": 1, "q": "跨国公司在不同国家子公司之间进行商品交易时采用的内部定价方式，目的是规避外汇风险和税收的是（　）", "a": ["市场定价", "转移定价", "成本定价", "协议定价", "", ""], "r": "B", "e": "转移定价是跨国公司在不同国家子公司间商品交易的内部定价方式，可借此规避外汇风险和税收。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623067", "t": 1, "q": "浮动汇率制度下，汇率的主要决定因素是", "a": ["政府干预", "外汇市场供求关系", "黄金储备量", "国际协议约定", "", ""], "r": "B", "e": "浮动汇率制度下，汇率不受官方干预，由外汇市场供求关系决定。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623068", "t": 1, "q": "折算风险的产生源于（　）", "a": ["不同货币的兑换", "会计报表的货币折算", "实际交易的结算", "汇率的即期波动", "", ""], "r": "B", "e": "折算风险主要是在将国外子公司等的会计报表进行货币折算成母国货币时产生的。A选项不同货币兑换是交易等环节，并非折算风险主因；C选项实际交易结算对应交易风险；D选项汇率即期波动不是折算风险根源。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623069", "t": 1, "q": "根据购买力平价理论，若一国通货膨胀率高于外国，则该国货币汇率将（　）", "a": ["升值", "贬值", "不变", "不确定", "", ""], "r": "B", "e": "购买力平价理论下，通胀率高意味着该国物价上升快，货币购买力下降。相比外国，该国货币变得更“不值钱”，所以货币汇率会贬值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623070", "t": 1, "q": "下列属于外汇市场干预的直接干预方式有（　）", "a": ["抛售外汇储备", "调整法定存款准备金率", "改变再贴现率", "发表政策声明", "", ""], "r": "A", "e": "直接干预是指政府直接入市买卖外汇。抛售外汇储备是政府直接在市场上买卖外汇来影响汇率，属于直接干预；B调整法定存款准备金率、C改变再贴现率是货币政策工具，通过影响货币供应量等间接影响外汇市场；D发表政策声明是通过影响市场预期间接干预。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623071", "t": 1, "q": "汇率变动对一国对外直接投资的影响表现为（　）", "a": ["本币升值，有利于对外直接投资", "本币升值，不利于对外直接投资", "本币贬值，有利于对外直接投资", "本币贬值，对对外直接投资无影响", "", ""], "r": "A", "e": "本币升值意味着同样数量本币能兑换更多外币，可在国外以更低成本进行投资，所以有利于对外直接投资。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623072", "t": 1, "q": "下列不属于长期资本流动的是", "a": ["直接投资", "证券投资", "短期贸易融资", "国际贷款", "", ""], "r": "C", "e": "长期资本流动是指期限在一年以上的资本流动。直接投资、证券投资、国际贷款通常都是长期的资本流动形式。而短期贸易融资期限一般在一年以内，不属于长期资本流动。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623073", "t": 1, "q": "短期资本流动中，基于利差的流动属于", "a": ["贸易性资本流动", "投机性资本流动", "套利性资本流动", "保值性资本流动", "", ""], "r": "C", "e": "套利性资本流动是利用各国金融市场利率差异，从低利率市场流向高利率市场以赚取利差收益。题干基于利差的流动符合套利性资本流动特点。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623074", "t": 1, "q": "根据粘性价格货币模型，短期内货币供给增加会导致本币（　）", "a": ["升值", "贬值", "不变", "先升后贬", "", ""], "r": "B", "e": "粘性价格货币模型中，短期内价格粘性，货币供给增加使利率下降，资金外流，本币贬值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818545585623075", "t": 1, "q": "国际货币基金组织的主要职能不包括（　）", "a": ["促进汇率稳定", "提供短期贷款", "制定国际贸易规则", "监督国际收支", "", ""], "r": "C", "e": "国际货币基金组织职责是稳定国际汇率、提供短期贷款、监督成员国国际收支等。制定国际贸易规则是世界贸易组织的职能。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373120", "t": 2, "q": "常见的外汇交易类型包括", "a": ["即期外汇交易", "远期外汇交易", "外汇掉期交易", "外汇期权交易", "", ""], "r": "ABCD", "e": "以上选项所涉及的即期、远期、掉期、期权交易均是常见外汇交易类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373121", "t": 2, "q": "国际资本流动的积极影响包括", "a": ["促进资源全球配置", "弥补东道国资金缺口", "促进技术转移和扩散", "加剧东道国金融市场波动", "", ""], "r": "ABC", "e": "A选项国际资本流动可使资源在全球范围更合理配置；B选项能为东道国带来资金，弥补资金缺口；C选项资本流动常伴随技术转移扩散。而D选项加剧东道国金融市场波动是消极影响。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373122", "t": 2, "q": "国际收支平衡表的经常账户包括", "a": ["货物贸易", "服务贸易", "要素收入", "单方面转移", "", ""], "r": "ABCD", "e": "国际收支平衡表的经常账户是记录实际资源流动的账户，涵盖货物贸易、服务贸易、要素收入和单方面转移等内容。ABCD四个选项都属于经常账户范畴。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373123", "t": 2, "q": "国际收支平衡表的资本与金融账户包括", "a": ["资本账户", "直接投资", "证券投资", "储备资产", "", ""], "r": "ABCD", "e": "国际收支平衡表的资本与金融账户分为资本账户和金融账户，金融账户又包含直接投资、证券投资、储备资产等。所以ABCD选项都符合资本与金融账户包含的内容。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373124", "t": 2, "q": "货币危机的应对措施包括", "a": ["提高国内利率", "动用外汇储备干预市场", "实行外汇管制", "调整汇率制度", "", ""], "r": "ABCD", "e": "提高国内利率可吸引外资、稳定本币；动用外汇储备干预市场能影响外汇供求稳定汇率；实行外汇管制可限制资本流动稳定汇率；调整汇率制度能从制度层面应对危机。这些都是常见应对货币危机措施。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373125", "t": 2, "q": "汇率制度的分类标准包括", "a": ["汇率变动的灵活性", "政府干预的程度", "货币锚的选择", "汇率的波动幅度", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373126", "t": 2, "q": "根据利率平价理论，影响远期汇率的因素有（　）", "a": ["即期汇率", "本国利率", "外国利率", "通货膨胀率", "", ""], "r": "ABC", "e": "利率平价理论中，远期汇率与即期汇率、本国利率、外国利率相关。公式为F=S×(1 + i_d)/(1 + i_f) ，F是远期汇率，S是即期汇率，i_d是本国利率，i_f是外国利率。而通货膨胀率不是直接影响远期汇率的因素。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373127", "t": 2, "q": "下列关于特别提款权的说法，正确的有（　）", "a": ["是IMF创设的账面资产", "可用于成员国之间的结算", "可兑换成自由兑换货币", "是成员国的法定货币", "", ""], "r": "ABC", "e": "特别提款权是IMF创设的账面资产，可用于成员国间结算，能兑换成自由兑换货币，但不是成员国法定货币。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373128", "t": 2, "q": "外汇交易的基本类型包括（　）", "a": ["即期外汇交易", "远期外汇交易", "外汇衍生交易", "套汇交易", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373129", "t": 2, "q": "外汇风险管理中的\"对冲\"策略包括（　）", "a": ["远期外汇交易", "外汇期货交易", "外汇期权交易", "货币互换交易", "", ""], "r": "ABCD", "e": "以上选项中的远期外汇交易、外汇期货交易、外汇期权交易、货币互换交易都可用于外汇风险管理的对冲策略，能帮助企业或投资者降低外汇风险。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373130", "t": 2, "q": "下列属于长期国际资本流动的有（　）", "a": ["直接投资", "证券投资", "国际贷款", "投机性资本流动", "", ""], "r": "ABC", "e": "长期国际资本流动包括直接投资、证券投资和国际贷款。投机性资本流动属于短期国际资本流动。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373131", "t": 2, "q": "金融危机的主要类型包括", "a": ["货币危机", "银行危机", "债务危机", "次贷危机", "", ""], "r": "ABC", "e": "金融危机按类型主要有货币危机、银行危机、债务危机和流动性危机等。次贷危机是债务危机中较有代表性的一种，可包含在债务危机里。ABC属常见主要类型。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373132", "t": 2, "q": "外汇风险管理的基本原则包括", "a": ["风险识别原则", "风险分散原则", "成本收益原则", "完全规避原则", "", ""], "r": "ABC", "e": "外汇风险管理要先识别风险，遵循成本收益考量管理成本与收益，同时分散风险降低单一风险影响。但完全规避风险不现实，也可能错过机会。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373133", "t": 2, "q": "国际收支逆差的调节政策包括", "a": ["紧缩性财政政策", "本币贬值政策", "外汇管制政策", "扩张性货币政策", "", ""], "r": "ABC", "e": "国际收支逆差时，需减少进口、增加出口来改善。紧缩性财政政策可抑制国内需求，减少进口；本币贬值能使本国商品更便宜，利于出口；外汇管制政策可限制外汇流出，改善收支。而扩张性货币政策会增加国内需求，使进口增加，不利于改善逆差。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373134", "t": 2, "q": "下列属于特别提款权（SDR）篮子货币的有", "a": ["美元", "欧元", "日元", "人民币", "", ""], "r": "ABCD", "e": "特别提款权（SDR）篮子货币目前包括美元、欧元、人民币、日元和英镑。ABCD选项中的货币都在其中。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373135", "t": 2, "q": "下列关于外汇期货与外汇期权的区别，说法正确的有（　）", "a": ["期货买方必须履约，期权买方可选择是否履约", "期货无需支付权利金，期权需支付权利金", "期货风险对称，期权风险不对称", "期货是标准化合约，期权是非标准化合约", "", ""], "r": "ABC", "e": "外汇期货买方需按合约履约，期权买方有是否履约的选择权；期货交易不支付权利金，期权买方要支付权利金；期货交易买卖双方风险对称，期权买方损失有限、卖方风险大，风险不对称；期货和期权都是标准化合约。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373136", "t": 2, "q": "企业面临的交易风险主要产生于（　）", "a": ["进出口贸易合同", "外币借款合同", "外币投资", "资产负债表折算", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373137", "t": 2, "q": "金融危机的类型包括（　）", "a": ["货币危机", "银行危机", "债务危机", "系统性金融危机", "", ""], "r": "ABCD", "e": "金融危机包括货币危机、银行危机、债务危机和系统性金融危机等常见类型。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373138", "t": 2, "q": "远期外汇交易的适用场景包括", "a": ["进口企业规避本币贬值风险", "出口企业规避本币升值风险", "投资者进行短期汇率投机", "跨国公司对冲外汇收支风险", "", ""], "r": "ABD", "e": "远期外汇交易可锁定未来汇率，规避汇率波动风险。进口企业怕本币贬值，出口企业怕本币升值，跨国公司有外汇收支需对冲风险，而短期汇率投机不属远期交易适用场景。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373139", "t": 2, "q": "折算风险的影响因素包括（　）", "a": ["折算方法", "外币资产负债规模", "汇率波动幅度", "交易结算方式", "", ""], "r": "ABC", "e": "折算风险受折算方法、外币资产负债规模、汇率波动幅度影响。交易结算方式主要影响交易风险而非折算风险。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373140", "t": 2, "q": "企业管理外汇风险的常用方法有", "a": ["外汇远期套期保值", "调整进出口合同结算货币", "外汇期权对冲", "提前或推迟收付汇", "", ""], "r": "ABCD", "e": "这些选项都是企业管理外汇风险的常见手段。A通过远期合约锁定汇率；B改变结算货币可降低风险；C期权可灵活应对汇率变动；D提前或推迟收付汇能利用汇率波动。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373141", "t": 2, "q": "属于中间汇率制度的有", "a": ["爬行钉住汇率制度", "汇率目标区制度", "管理浮动汇率制度", "货币局制度", "", ""], "r": "ABC", "e": "中间汇率制度是介于固定汇率和浮动汇率之间的汇率制度。爬行钉住、汇率目标区、管理浮动都有一定灵活性又非完全自由浮动，属于中间汇率制度；货币局制度是固定汇率制度。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373142", "t": 2, "q": "短期资本流动的主要类型包括", "a": ["套利资本流动", "套汇资本流动", "投机资本流动", "直接投资资本流动", "", ""], "r": "ABC", "e": "短期资本流动是指期限为一年或一年以内的资本流动，套利、套汇、投机资本流动都具有短期性特点。而直接投资资本流动通常是长期的，用于对企业进行实质性控制等。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373143", "t": 2, "q": "影响国际储备需求的因素有（　）", "a": ["国际收支波动幅度", "汇率制度类型", "对外开放程度", "国际融资能力", "", ""], "r": "ABCD", "e": "国际收支波动幅度大、对外开放程度高会使国际储备需求增加；固定汇率制比浮动汇率制需要更多储备；国际融资能力强则可减少对储备的依赖。ABCD四个选项均会影响国际储备需求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373144", "t": 2, "q": "影响国际储备需求的因素有（　）", "a": ["国际收支波动幅度", "汇率制度类型", "对外开放程度", "融资能力", "", ""], "r": "ABCD", "e": "国际收支波动幅度大需更多储备应对；不同汇率制度对储备需求不同，如固定汇率制需更多储备维持汇率；开放程度高，对外经济交易多，储备需求大；融资能力强，可在需要时融资，对储备需求小。ABCD都影响国际储备需求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373145", "t": 2, "q": "下列属于外汇衍生工具的有（　）", "a": ["外汇远期", "外汇期货", "外汇期权", "外汇互换", "", ""], "r": "ABCD", "e": "外汇衍生工具是在外汇基础上派生出来的金融工具。外汇远期、外汇期货、外汇期权、外汇互换都属于外汇衍生工具。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373146", "t": 2, "q": "国际收支平衡表的记账原则包括（　）", "a": ["复式记账法", "权责发生制", "市场价格计价", "单一记账货币", "", ""], "r": "ABCD", "e": "国际收支平衡表记账遵循复式记账法，以权责发生制为依据，按市场价格计价，采用单一记账货币。ABCD选项均符合记账原则。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373147", "t": 2, "q": "购买力平价理论的局限性包括", "a": ["忽略了非贸易品的影响", "假设商品完全可贸易", "不适用于短期汇率预测", "未考虑资本流动的影响", "", ""], "r": "ABCD", "e": "购买力平价理论假设商品完全可贸易，而现实中有非贸易品，所以忽略非贸易品影响是局限；它基于商品贸易，没考虑资本流动影响；且它更适用于长期汇率分析，不适用于短期汇率预测。ABCD 均是其局限性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373148", "t": 2, "q": "国际金融危机传导的贸易渠道主要通过（　）实现", "a": ["进出口贸易额变动", "商品价格波动", "汇率波动", "贸易融资收缩", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373149", "t": 2, "q": "国际资本流动对流入国的积极影响包括（　）", "a": ["弥补资金缺口", "促进技术转移", "增加就业机会", "加剧金融市场波动", "", ""], "r": "ABC", "e": "国际资本流入能为流入国带来资金、技术等资源，可弥补资金缺口、促进技术转移，还能带动相关产业发展增加就业。而加剧金融市场波动是消极影响。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373150", "t": 2, "q": "下列属于汇率决定理论的有", "a": ["购买力平价理论", "利率平价理论", "国际收支说", "资产市场说", "", ""], "r": "ABCD", "e": "购买力平价理论从货币购买力角度解释汇率决定；利率平价理论强调利率对汇率的影响；国际收支说从国际收支角度分析汇率；资产市场说从资产市场供求解释汇率，它们都是常见的汇率决定理论。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373151", "t": 2, "q": "国际收支顺差的不利影响包括（　）", "a": ["本币升值压力增大", "引发贸易摩擦", "国内通货膨胀压力上升", "资源闲置", "", ""], "r": "ABC", "e": "国际收支顺差意味着出口多、外汇流入多。外汇流入多会增加本币需求，使本币有升值压力，A正确；出口多易引发贸易摩擦，B正确；外汇流入增加货币供给，会带来国内通胀压力，C正确；顺差表明资源得到利用，而非闲置，D错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373152", "t": 2, "q": "外汇市场的主要参与者包括", "a": ["中央银行", "商业银行", "跨国公司", "个人投资者", "", ""], "r": "ABCD", "e": "外汇市场参与者众多，中央银行参与调节汇率等；商业银行进行外汇交易和结算等业务；跨国公司因跨国经营有外汇需求；个人投资者也可参与外汇买卖。ABCD 选项都是外汇市场主要参与者。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373153", "t": 2, "q": "一国国际储备不足可能导致的后果是（　）", "a": ["本币汇率大幅贬值", "无法应对国际收支逆差", "丧失货币政策独立性", "引发债务危机", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818547242373154", "t": 2, "q": "下列属于外汇市场参与者的有（　）", "a": ["中央银行", "商业银行", "企业", "个人", "", ""], "r": "ABCD", "e": "外汇市场参与者广泛，中央银行可干预外汇市场；商业银行进行外汇交易等业务；企业因进出口等有外汇需求；个人也会参与换汇等活动。ABCD 选项主体都可参与外汇市场。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640896", "t": 3, "q": "国际收支平衡表中，货物贸易差额是经常账户差额的核心组成部分。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货物贸易在国际经济交往中规模大且占比高，是经常账户中最重要的部分，其差额对经常账户差额影响显著，所以货物贸易差额是经常账户差额的核心组成部分。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640897", "t": 3, "q": "国际资本流动的规模越大，对一国经济的影响越积极。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际资本流动规模并非越大越积极。大规模流入可能带来经济过热、资产泡沫等问题；大规模流出可能引发金融动荡、货币贬值、企业融资困难等负面后果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640898", "t": 3, "q": "国际收支说强调经常账户对汇率的影响", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国际收支说认为汇率是由外汇供求决定的，而外汇供求又源于国际收支，经常账户是国际收支的重要组成部分，该理论强调了经常账户收支状况对汇率的影响。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640899", "t": 3, "q": "利率平价理论认为，高利率货币的远期汇率会升水。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "利率平价理论指出，高利率货币在远期市场上会贴水，低利率货币远期会升水，因为高利率货币吸引资金流入，使即期汇率上升，远期为平衡利差会贴水。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640900", "t": 3, "q": "购买力平价理论更适用于解释短期汇率变动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "购买力平价理论基于商品套利机制，强调物价水平对汇率的影响，但短期内汇率受多种因素如利率、政治局势、市场预期等影响，物价变动对汇率影响不明显。该理论更适合解释长期汇率变动。所以此说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640901", "t": 3, "q": "货币局制度下，货币发行量与外汇储备完全挂钩", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币局制度是一种汇率机制，在该制度下，货币发行要以一定的外汇储备为基础，货币发行量严格按固定汇率与外汇储备挂钩。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640902", "t": 3, "q": "企业通过提前结汇可以规避外汇汇率下跌的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "提前结汇是把外汇提前兑换成本币，当外汇汇率下跌时意味着单位外汇能兑换的本币减少，提前结汇可避免之后汇率下跌损失更多本币，所以能规避外汇汇率下跌风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640903", "t": 3, "q": "特别提款权的价值由单一货币决定", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "特别提款权的价值是由多种货币组成的货币篮子决定，并非单一货币。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640904", "t": 3, "q": "外汇风险的套期保值策略可以完全消除风险", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "套期保值策略能降低外汇风险，但由于市场的不确定性、基差风险等因素，很难完全消除风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640905", "t": 3, "q": "国际金融合作的核心是实现各国货币政策的统一。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际金融合作核心并非实现各国货币政策统一，各国经济情况不同，货币政策需因地制宜，国际金融合作更侧重于协调政策、稳定金融市场等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640906", "t": 3, "q": "购买力平价理论因忽略资本流动等因素，更适用于长期汇率预测而非短期。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "购买力平价理论基于商品价格决定汇率，未考虑资本流动、市场预期等短期因素影响，这些短期因素会使汇率短期波动较大，而从长期看商品价格对汇率的影响更显著，所以该理论更适用于长期汇率预测。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640907", "t": 3, "q": "国际收支的弹性论认为，货币贬值一定能改善贸易收支。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际收支弹性论指出，只有满足马歇尔 - 勒纳条件，即进出口需求价格弹性之和大于 1 时，货币贬值才会改善贸易收支，并非货币贬值一定能改善。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640908", "t": 3, "q": "间接标价法下，本币汇率上升意味着外币汇率下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在间接标价法下，是以一定单位的本国货币为标准，折算成若干单位的外国货币。本币汇率上升，意味着一定单位本币能兑换更多外币，即外币相对本币贬值，也就是外币汇率下降。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640909", "t": 3, "q": "国际金融合作仅包括国家之间的合作，不涉及国际组织。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际金融合作既包括国家之间的合作，也涉及国际组织，像国际货币基金组织、世界银行等国际组织在国际金融合作中发挥着重要作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640910", "t": 3, "q": "远期外汇交易的合约条款（金额、汇率、期限）可以由交易双方协商确定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "远期外汇交易灵活性大，合约条款如金额、汇率、期限等可由交易双方根据自身需求协商确定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640911", "t": 3, "q": "外汇掉期交易中，两笔交易的汇率通常不同，差额体现了期限溢价或折价。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇掉期是同时买入和卖出不同期限的外汇，两笔交易汇率常不同，其差额反映了不同期限的资金成本差异等，也就是期限溢价或折价。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640912", "t": 3, "q": "IMF的主要贷款对象是陷入主权债务危机的国家。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "IMF主要为成员国提供短期资金借贷，以帮助成员国调整国际收支失衡等，并非主要针对陷入主权债务危机的国家。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640913", "t": 3, "q": "货币主义汇率理论认为，汇率是两国货币供求关系的反映。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币主义汇率理论强调货币供求在汇率决定中的作用，认为汇率是由两国货币供求关系决定的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640914", "t": 3, "q": "根据国际收支说，本国国民收入增加会导致本币升值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际收支说中，本国国民收入增加会使进口需求上升，若出口不变，会导致经常账户逆差，外汇需求增加，本币有贬值压力而非升值。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640915", "t": 3, "q": "外汇风险管理的套期保值策略只能对冲部分汇率风险，无法完全消除风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "套期保值策略通过在金融市场进行反向操作来降低汇率风险，但由于基差风险、市场不完全有效等因素，通常只能对冲部分风险，难以完全消除。", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640916", "t": 3, "q": "经济风险是三种外汇风险中最难管理的一种。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "经济风险会对企业未来现金流量产生长期影响，涉及企业经营的多个方面且难以准确预见和量化，相比交易风险和折算风险，其不确定性更高、影响更广泛，所以是最难管理的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640917", "t": 3, "q": "纯粹浮动汇率制度下，政府完全不干预外汇市场，汇率由市场供求自由决定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "纯粹浮动汇率制的定义就是政府对外汇市场不采取任何干预措施，汇率完全由市场的供求关系决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640918", "t": 3, "q": "在直接标价法下，汇率数值越小，说明本币升值幅度越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "直接标价法是以一定单位的外国货币为标准来计算应付出多少单位本国货币。汇率数值越小，意味着用更少本币就能兑换一定单位外币，即本币升值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640919", "t": 3, "q": "国际资本流动的根本动力是各国的利率差异。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际资本流动根本动力是追求利润最大化，利率差异只是影响因素之一。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640920", "t": 3, "q": "购买力平价理论认为，汇率的变动取决于两国利率水平的差异。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "购买力平价理论强调汇率由两国货币购买力之比决定，即取决于两国物价水平差异，而非两国利率水平差异。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640921", "t": 3, "q": "黄金储备的流动性较差，但价值相对稳定，是国际储备中的\"最终支付手段\"。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "黄金储备因难以快速变现导致流动性差 ，其价值一般不受一国经济变动影响，相对稳定，且在国际交易中可作为最后的支付保障，是国际储备“最终支付手段”。", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640922", "t": 3, "q": "根据抛补利率平价，远期汇率与即期汇率的差异等于两国的利率差异。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抛补利率平价理论认为，远期汇率与即期汇率的差异近似等于两国的利率差异。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640923", "t": 3, "q": "热钱流动有助于稳定汇率", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热钱具有投机性强、流动性快等特点，它为追求高回报而在市场间快速流动，会使汇率大幅波动，不利于汇率稳定。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640924", "t": 3, "q": "爬行钉住汇率制度下，汇率会在一个固定区间内波动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "爬行钉住汇率制度是将汇率钉住某种平价，但根据一组选定的指标频繁地、小幅度地调整所钉住平价的汇率制度，并非在固定区间内波动。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640925", "t": 3, "q": "金融危机的传导具有区域性和全球性特征，某一国家的危机可能扩散至周边国家乃至全球。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融危机确实有传导性，会从局部地区扩散至周边甚至全球，比如2008年美国次贷危机引发全球金融危机。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640926", "t": 3, "q": "外汇批发市场的交易价格是零售市场价格的基础。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇批发市场是银行间进行外汇交易的市场，其交易量大、交易频繁，形成的价格反映了外汇市场的供求关系和基本价格水平，是零售市场价格的基础。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640927", "t": 3, "q": "购买力平价理论的核心是一价定律，即同种商品在不同国家的价格经汇率折算后应相等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "购买力平价理论基础就是一价定律，其认为在无贸易摩擦等理想情况下，同种商品在不同国家以相同货币衡量价格应相等。所以表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640928", "t": 3, "q": "利率平价理论认为，高利率货币远期会升值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "利率平价理论指出，高利率货币在远期会贬值，以平衡不同货币因利率差异带来的收益，而不是升值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640929", "t": 3, "q": "国际储备的规模越大越好，充足的储备能完全抵御各类外部冲击。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国际储备并非规模越大越好，储备过多会带来机会成本增加等问题，且充足储备也不能完全抵御各类外部冲击，外部冲击复杂多样。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640930", "t": 3, "q": "外汇期权交易中，期权费的高低与期权的到期期限正相关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "到期期限越长，期权买方行使权利的机会更多，卖方承担的风险更大，所以期权费越高，二者正相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640931", "t": 3, "q": "汇率制度的选择与一国的经济开放度正相关", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "经济开放度高的国家，更倾向于采用固定汇率制度以稳定贸易和投资环境，所以汇率制度选择和经济开放度存在一定关联，通常呈正相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640932", "t": 3, "q": "IMF的备用安排是为成员国提供的长期贷款。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "IMF的备用安排主要是为成员国提供短期资金支持，以帮助解决短期国际收支问题，并非长期贷款。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640933", "t": 3, "q": "国际收支平衡表中，贷方记录资产增加或负债减少，借方记录资产减少或负债增加。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。国际收支平衡表中，贷方记录资产减少或负债增加，借方记录资产增加或负债减少。  ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640934", "t": 3, "q": "外汇期货交易的合约是标准化的，由交易所统一制定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外汇期货交易的显著特点就是合约标准化，由交易所统一制定其交易单位、最小变动价位、每日价格波动限制等要素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640935", "t": 3, "q": "利率平价理论认为，高利率货币的远期汇率会贴水，低利率货币的远期汇率会升水。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "利率平价理论核心就是资金会从低利率国家流向高利率国家，为平衡汇率差异，高利率货币远期会贴水，低利率货币远期会升水。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640936", "t": 3, "q": "外汇风险中的经济风险是指企业未来现金流因汇率波动受到的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "经济风险是指由于未预料到的汇率变动，使企业未来现金流量及其现值发生变化的可能性，也就是企业未来现金流因汇率波动受到的影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640937", "t": 3, "q": "特别提款权是一种具有内在价值的国际储备资产。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "特别提款权是国际货币基金组织创设的一种记账单位，本身没有内在价值，它是成员国在基金组织的账面资产，用于成员国间及与基金组织间的国际支付等。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640938", "t": 3, "q": "外汇掉期交易中，两次交割的汇率是相同的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外汇掉期交易中，前后两次交割的汇率通常不同，会根据市场情况等因素确定不同汇率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640939", "t": 3, "q": "外汇期货交易的交割方式以现金交割为主，实物交割占比极低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818548370640940", "t": 3, "q": "国际收支平衡表中，储备资产的增加记入贷方。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "储备资产增加意味着本国对外资产的增加，相当于资金流出，在国际收支平衡表中资金流出记借方，而非贷方。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第4章 投资学（1）", "n": "基础练习题【含解析】 / 第4章 投资学（1）", "qs": [{"id": "2034818551780610048", "t": 1, "q": "债券组合管理中，免疫策略的核心目的是规避（　）", "a": ["信用风险", "利率风险", "流动性风险", "通胀风险", "", ""], "r": "B", "e": "免疫策略主要是通过构建债券组合，使债券组合的价格波动与再投资收益的变化相互抵消，从而降低利率变动对债券组合价值的影响，核心目的是规避利率风险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610049", "t": 1, "q": "资本资产定价模型（CAPM）的计算公式为预期收益率=无风险利率+贝塔系数×（市场组合收益率-无风险利率），其中贝塔系数衡量的是？", "a": ["单个资产的总风险", "单个资产的非系统风险", "单个资产的系统风险", "单个资产与市场组合的协方差", "", ""], "r": "C", "e": "贝塔系数是衡量单项资产或资产组合受系统风险影响程度的指标。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610050", "t": 1, "q": "投资组合绩效评价的指标中，考虑了全部风险的是（　）", "a": ["夏普比率", "特雷诺比率", "詹森阿尔法", "信息比率", "", ""], "r": "A", "e": "夏普比率衡量的是单位总风险（全部风险）所获得的超额回报，考虑了全部风险。特雷诺比率考虑的是系统性风险；詹森阿尔法衡量的是基金超越市场基准的表现；信息比率衡量的是主动管理带来的风险调整后收益。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610051", "t": 1, "q": "因子模型中，单因子模型的\"因子\"通常是指（　）", "a": ["某一特定行业的收益率", "市场组合的收益率", "无风险利率", "通胀率", "", ""], "r": "B", "e": "单因子模型中，“因子”常指市场组合的收益率，市场组合收益率能综合反映市场整体情况并影响众多资产价格。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610052", "t": 1, "q": "债券的久期与到期期限的关系通常是（　）", "a": ["久期等于到期期限", "久期大于到期期限", "久期小于到期期限", "久期与到期期限无关", "", ""], "r": "C", "e": "久期衡量的是债券现金流的加权平均到期时间，由于债券会有利息支付等情况，使得现金流的加权平均到期时间通常小于债券的到期期限。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610053", "t": 1, "q": "资本资产定价模型的公式为Ri=Rf+βi(Rm-Rf)，其中(Rm-Rf)表示的是（　）", "a": ["无风险收益率", "市场风险溢价", "证券的预期收益率", "证券的风险收益率", "", ""], "r": "B", "e": "在资本资产定价模型公式里，Rf是无风险收益率，Rm是市场组合收益率，Rm - Rf 即市场组合收益率与无风险收益率之差，也就是市场风险溢价。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610054", "t": 1, "q": "基金投资中，ETF基金的主要特点是（　）", "a": ["只能在交易所交易，实行T+0交易制度", "既可以在交易所交易，也可以向基金公司申购赎回", "仅能通过基金公司申购赎回，不能上市交易", "投资标的仅限于债券市场", "", ""], "r": "B", "e": "ETF基金是交易型开放式指数基金，它结合了封闭式基金和开放式基金的特点，既可以在交易所像股票一样交易，也能向基金公司申购赎回。A选项说只能在交易所交易且T+0不准确；C选项与ETF可上市交易不符；D选项ETF投资标的不局限于债券市场。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610055", "t": 1, "q": "基金的净值披露频率，通常开放式基金的净值披露是（　）", "a": ["每日披露", "每周披露", "每月披露", "每季披露", "", ""], "r": "A", "e": "开放式基金每个交易日可申购赎回，需每日披露净值，让投资者了解其价值。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610056", "t": 1, "q": "投资组合绩效评价的特雷诺比率，其分母是？", "a": ["组合的标准差", "组合的贝塔系数", "组合的非系统风险", "无风险利率", "", ""], "r": "B", "e": "特雷诺比率衡量单位系统风险的超额收益，公式为（组合收益率 - 无风险利率）/组合的贝塔系数，分母是组合的贝塔系数。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610057", "t": 1, "q": "债券的久期越长，其价格对利率变动的敏感度（　）", "a": ["越低", "越高", "不变", "不确定", "", ""], "r": "B", "e": "久期衡量了债券价格对利率变动的敏感性，久期越长，意味着债券价格受利率变动影响越大，即价格对利率变动的敏感度越高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610058", "t": 1, "q": "投资组合绩效评价中，詹森阿尔法衡量的是（　）", "a": ["组合的超额收益", "组合的风险调整后收益", "组合收益率超出CAPM预测收益率的部分", "组合的绝对收益率", "", ""], "r": "C", "e": "詹森阿尔法是基于资本资产定价模型（CAPM），反映的是组合收益率超出CAPM预测收益率的部分。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551780610059", "t": 1, "q": "证券投资基本面分析中，不属于宏观经济分析指标的是（　）", "a": ["GDP增长率", "通货膨胀率", "公司资产负债率", "失业率", "", ""], "r": "C", "e": "宏观经济分析指标是反映宏观经济整体状况的，A、B、D分别从经济增长、物价、就业方面体现宏观经济情况。而公司资产负债率是针对单个公司财务状况的指标，不属于宏观经济分析指标。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804352", "t": 1, "q": "并购估值中，现金流折现法（DCF）的核心假设是（　）", "a": ["目标公司未来现金流稳定增长", "市场利率保持不变", "目标公司无负债", "并购后无协同效应", "", ""], "r": "A", "e": "现金流折现法（DCF）是通过预测目标公司未来的现金流并折现来估值，核心是假设目标公司未来现金流稳定增长，才能合理预测和折现。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804353", "t": 1, "q": "电力企业作为资金密集型行业，其融资方式中占比最高的通常是（　）", "a": ["股权融资", "银行贷款", "发行短期融资券", "内部留存收益", "", ""], "r": "B", "e": "电力企业资金需求大，银行贷款因额度大、期限长且相对稳定，能较好满足其资金需求，所以在融资方式中占比通常最高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804354", "t": 1, "q": "有效市场假说中，若市场是弱式有效，下列哪种投资策略可能有效（　）", "a": ["基于历史股价的技术分析策略", "基于公司财务数据的基本面分析策略", "基于内幕信息的交易策略", "随机选择证券的策略", "", ""], "r": "B", "e": "弱式有效市场中，股价已反映历史信息，技术分析无效。基本面分析能挖掘公开信息中的价值，可能找到被低估或高估的证券，策略有效。内幕交易虽可能获利但违法。随机选证券无依据。所以选B。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804355", "t": 1, "q": "期权交易中，买方支付期权费后获得的权利是（　）", "a": ["按约定价格卖出标的资产", "按约定价格买入标的资产", "根据市场情况决定是否行使权利", "必须在到期日行使权利", "", ""], "r": "C", "e": "期权买方付期权费后，有根据市场情况决定是否行使权利的自由，并非必须行使。A和B只是认购或认沽期权行权时的具体操作；D中买方不一定要在到期日行使权利。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804356", "t": 1, "q": "有效市场假说的三种形态中，信息反映程度最低的是（　）", "a": ["弱式有效", "半强式有效", "强式有效", "完全有效", "", ""], "r": "A", "e": "有效市场假说三种形态中，弱式有效市场仅反映历史信息，半强式有效反映历史和公开信息，强式有效反映所有信息。所以信息反映程度最低的是弱式有效。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804357", "t": 1, "q": "投资组合绩效评价中，夏普比率衡量的是（　）", "a": ["单位系统性风险的超额收益率", "单位总风险的超额收益率", "单位非系统性风险的超额收益率", "组合收益率与无风险收益率的差值", "", ""], "r": "B", "e": "夏普比率公式是（组合收益率 - 无风险收益率）/组合标准差，组合标准差衡量总风险，所以夏普比率衡量单位总风险的超额收益率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804358", "t": 1, "q": "资本资产定价模型中，市场风险溢价是指（　）", "a": ["市场组合收益率", "无风险收益率", "市场组合收益率与无风险收益率的差额", "组合收益率与无风险收益率的差额", "", ""], "r": "C", "e": "市场风险溢价是市场组合收益率超出无风险收益率的部分，即市场组合收益率与无风险收益率的差额。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804359", "t": 1, "q": "下列属于期货合约与远期合约本质区别的是（　）", "a": ["期货合约有交易对手方，远期合约没有", "期货合约是标准化合约，远期合约是非标准化合约", "期货合约涉及实物交割，远期合约不涉及", "期货合约无杠杆，远期合约有杠杆", "", ""], "r": "B", "e": "期货合约是标准化合约，有统一的规格、交易时间等，而远期合约是交易双方私下协商达成的非标准化合约，这是二者本质区别。A选项，期货和远期都有交易对手方；C选项，二者都可能涉及实物交割；D选项，期货一般有杠杆，远期也有一定杠杆性质。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804360", "t": 1, "q": "有效市场假说中，强式有效市场的检验方法通常是（　）", "a": ["检验技术分析的有效性", "检验基本面分析的有效性", "检验内幕交易的收益率", "检验历史收益率的可预测性", "", ""], "r": "C", "e": "强式有效市场认为所有信息都已反映在股价中，包括内幕信息。检验强式有效市场就看利用内幕交易能否获得超额收益，即检验内幕交易的收益率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804361", "t": 1, "q": "单因子套利定价模型中，影响证券收益率的核心因子通常是（　）", "a": ["通货膨胀率", "市场组合收益率", "利率水平", "汇率水平", "", ""], "r": "B", "e": "单因子套利定价模型假定资产收益率仅受某一个核心因子影响，这个核心因子通常是市场组合收益率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804362", "t": 1, "q": "资本资产定价模型中，市场组合的β系数为（　）", "a": ["0", "0.5", "1", "不确定", "", ""], "r": "C", "e": "市场组合的收益率与市场平均收益率完全同步，所以其β系数为1。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804363", "t": 1, "q": "证券投资的基本面分析中，宏观经济分析的核心指标不包括？", "a": ["失业率", "汇率", "公司资产负债率", "通货膨胀率", "", ""], "r": "C", "e": "宏观经济分析关注宏观层面经济状况，A失业率、B汇率、D通货膨胀率都属于宏观经济指标。而C公司资产负债率是微观层面衡量公司财务状况的指标，不属于宏观经济分析核心指标。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804364", "t": 1, "q": "基金投资中，货币市场基金的投资标的不包括（　）", "a": ["短期国债", "商业票据", "股票", "同业存单", "", ""], "r": "C", "e": "货币市场基金主要投资于短期货币工具，股票不属于短期货币工具。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804365", "t": 1, "q": "投资组合绩效评价中，夏普比率衡量的是（　）", "a": ["单位总风险对应的超额收益", "单位系统性风险对应的超额收益", "组合收益率与无风险收益率的差额", "组合收益率与市场收益率的差额", "", ""], "r": "A", "e": "夏普比率公式为（组合收益率 - 无风险收益率）/组合标准差，组合标准差衡量总风险，所以它衡量单位总风险对应的超额收益。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804366", "t": 1, "q": "某基金的单位净值为1.2元，当日累计单位净值为1.5元，该基金的历史分红情况为（　）", "a": ["每份累计分红0.3元", "每份累计分红1.5元", "每份累计分红1.2元", "未进行过分红", "", ""], "r": "A", "e": "基金累计单位净值=单位净值+每份累计分红，已知单位净值1.2元，累计单位净值1.5元，所以每份累计分红为1.5 - 1.2 = 0.3元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804367", "t": 1, "q": "某看涨期权的执行价格为50元，标的资产当前价格为55元，该期权的内在价值为（　）", "a": ["0元", "5元", "10元", "-5元", "", ""], "r": "B", "e": "看涨期权内在价值=标的资产当前价格-执行价格，即55 - 50 = 5元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804368", "t": 1, "q": "投资组合的diversification效应主要是通过（　）实现的", "a": ["选择高收益资产", "增加资产数量，降低资产间的相关性", "集中投资于同一行业资产", "选择低风险资产", "", ""], "r": "B", "e": "分散化效应主要靠增加资产数量，且降低资产间相关性能更好分散风险。A选高收益资产与分散化效应无关；C集中投资同一行业无法分散风险；D选低风险资产不是实现分散化效应的主要方式。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804369", "t": 1, "q": "封闭式基金的交易场所是（　）", "a": ["银行柜台", "证券交易所", "基金公司官网", "第三方理财平台", "", ""], "r": "B", "e": "封闭式基金份额固定，在存续期内不能赎回，它像股票一样在证券交易所上市交易。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804370", "t": 1, "q": "因子模型中，若某证券的收益率仅受市场因子和利率因子影响，该模型属于（　）", "a": ["单因子模型", "双因子模型", "多因子模型", "套利定价模型", "", ""], "r": "B", "e": "因证券收益率受市场和利率两个因子影响，含两个因子的模型为双因子模型。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804371", "t": 1, "q": "电力企业进行海外投融资时，面临的主要风险不包括（　）", "a": ["汇率风险", "政策风险", "流动性风险", "技术风险", "", ""], "r": "D", "e": "海外投融资主要涉及不同国家，汇率波动、政策变化会带来风险，资金的流动性也受影响；而电力技术相对成熟，海外投融资主要不是技术方面的问题。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804372", "t": 1, "q": "并购估值中，现金流折现法（DCF）的核心是预测企业未来的？", "a": ["会计利润", "净利润", "自由现金流", "营业收入", "", ""], "r": "C", "e": "现金流折现法（DCF）是通过预测企业未来的自由现金流并将其折现来评估企业价值，自由现金流反映企业在满足经营和投资需求后可自由支配的现金，是该方法核心考量因素。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804373", "t": 1, "q": "有效市场假说中，弱式有效市场的价格已经反映的信息是（　）", "a": ["所有公开信息", "所有公开信息和内幕信息", "历史交易价格和交易量信息", "公司财务报表信息", "", ""], "r": "C", "e": "弱式有效市场中，价格反映了历史交易价格和交易量信息。而A选项所有公开信息对应半强式有效市场；B选项涵盖公开和内幕信息对应强式有效市场；D选项公司财务报表信息属于公开信息，并非弱式有效市场价格反映范畴。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804374", "t": 1, "q": "以下哪种分析方法主要依赖于公司财务报表、行业趋势等公开信息来预测证券价格？（　）", "a": ["技术分析", "基本面分析", "量化分析", "行为金融分析", "", ""], "r": "B", "e": "基本面分析是通过分析公司财务报表、行业趋势等公开信息来评估证券的内在价值，进而预测证券价格。技术分析主要基于价格和成交量等市场数据；量化分析是运用数学模型和计算机技术；行为金融分析侧重于投资者心理和行为。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818551784804375", "t": 1, "q": "工程项目经济评价中，净现值（NPV）大于0表明（　）", "a": ["项目的收益率小于基准收益率", "项目的收益率大于基准收益率", "项目的投资回收期小于基准回收期", "项目的内部收益率小于基准收益率", "", ""], "r": "B", "e": "净现值大于0说明项目收益超过基准收益，即项目收益率大于基准收益率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479104", "t": 2, "q": "下列属于套利定价模型（APT）假设条件的有（　）", "a": ["市场上存在大量投资者", "投资者是风险厌恶的", "市场无交易成本和税收", "资产收益由多个因子共同决定", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479105", "t": 2, "q": "工程项目经济评价中，动态评价指标的优点是（　）", "a": ["考虑了资金的时间价值", "能反映项目的真实盈利能力", "计算简单，易于理解", "不受基准收益率的影响", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479106", "t": 2, "q": "下列关于期权合约的说法，正确的有（　）", "a": ["看涨期权买方有权在到期日以执行价格买入标的资产", "看跌期权卖方有义务在到期日以执行价格买入标的资产", "期权买方的损失有限，收益无限", "期权卖方的收益有限，损失无限", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479107", "t": 2, "q": "证券投资的技术分析方法包括？", "a": ["K线分析", "均线分析", "市盈率分析", "成交量分析", "", ""], "r": "ABD", "e": "K线、均线、成交量分析都属于技术分析方法，用于通过对证券市场交易数据的分析来预测价格走势。而市盈率分析是基本分析方法，通过公司盈利等基本面数据来评估股票价值。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479108", "t": 2, "q": "期权的内在价值取决于标的资产价格与执行价格的关系，下列关于期权内在价值的说法正确的有？", "a": ["看涨期权的内在价值=max（标的资产价格-执行价格，0）", "看跌期权的内在价值=max（执行价格-标的资产价格，0）", "实值期权的内在价值大于0", "虚值期权的内在价值小于0", "", ""], "r": "ABC", "e": "期权内在价值不能为负，虚值期权内在价值为0。A选项是看涨期权内在价值公式，B选项是看跌期权内在价值公式，实值期权内在价值大于0。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479109", "t": 2, "q": "证券投资技术分析的主要指标包括（　）", "a": ["移动平均线（MA）", "相对强弱指数（RSI）", "市盈率（P/E）", "随机指标（KDJ）", "", ""], "r": "ABD", "e": "技术分析主要研究市场行为，通过价格、成交量等数据来预测走势。移动平均线（MA）、相对强弱指数（RSI）、随机指标（KDJ）都是常见技术分析指标。而市盈率（P/E）是衡量股票投资价值的基本分析指标。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479110", "t": 2, "q": "基金投资中，按照投资标的分类，基金可分为（　）", "a": ["股票型基金", "债券型基金", "混合型基金", "开放式基金", "", ""], "r": "ABC", "e": "投资标的即投资对象。股票型、债券型、混合型基金分别以股票、债券、股票和债券等混合资产为投资标的。而开放式基金是按基金运作方式分类，不是按投资标的分类。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479111", "t": 2, "q": "根据证券投资组合理论，当增加组合中证券的数量时，下列说法正确的是（　）", "a": ["非系统性风险逐渐降低", "系统性风险逐渐降低", "组合的标准差逐渐降低", "组合的期望收益率逐渐提高", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479112", "t": 2, "q": "基金投资的特点包括（　）", "a": ["集合投资", "专业理财", "分散风险", "收益固定", "", ""], "r": "ABC", "e": "基金是将众多投资者资金集合，由专业基金管理人运作，通过投资多种资产分散风险。但基金收益不固定，会随市场波动。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479113", "t": 2, "q": "以下属于系统性风险的有（　）", "a": ["利率风险", "通胀风险", "行业风险", "市场风险", "", ""], "r": "ABD", "e": "系统性风险是影响整个市场的风险，不可通过分散投资消除。利率、通胀、市场变动会影响整个金融市场，属于系统性风险；行业风险仅影响特定行业，是非系统性风险。答案为ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479114", "t": 2, "q": "多因子套利定价模型中，常见的因子包括（　）", "a": ["规模因子", "价值因子", "动量因子", "质量因子", "", ""], "r": "ABCD", "e": "多因子套利定价模型中，规模、价值、动量、质量因子都是常见因子。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479115", "t": 2, "q": "下列属于债券资产组合管理策略的有（　）", "a": ["被动管理策略", "主动管理策略", "免疫策略", "指数化策略", "", ""], "r": "ABCD", "e": "债券资产组合管理策略包括被动和主动管理策略。其中被动管理又有免疫策略和指数化策略等。ABCD选项均符合。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479116", "t": 2, "q": "证券投资技术分析的核心假设是（　）", "a": ["市场行为涵盖一切信息", "价格沿趋势移动", "历史会重演", "投资者是理性的", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479117", "t": 2, "q": "根据有效市场假说，若某市场属于半强式有效，那么投资者无法通过以下哪种信息获得超额收益？", "a": ["公司最新发布的季度财报", "股票过去一年的价格走势", "行业政策调整公告", "未公开的公司并购计划", "", ""], "r": "ABC", "e": "半强式有效市场中，所有公开信息已反映在股价里，投资者无法靠公开信息获超额收益。A公司财报、C行业政策公告是公开信息；B股票过去价格走势属历史信息，半强式有效市场也已反映历史信息。而D未公开的公司并购计划属于内幕信息，利用内幕信息可能获超额收益。所以不能靠A、B、C信息获超额收益。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479118", "t": 2, "q": "并购估值的主要方法包括（　）", "a": ["现金流折现法", "相对估值法", "资产基础法", "市场法", "", ""], "r": "ABCD", "e": "并购估值常用现金流折现法评估企业未来现金流现值；相对估值法通过与类似企业对比估值；资产基础法以企业资产为基础评估；市场法依据市场交易数据评估。ABCD 都是主要方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479119", "t": 2, "q": "债券的凸性特征是指（　）", "a": ["债券价格与利率呈线性关系", "债券价格与利率呈非线性关系", "利率下降时价格上涨幅度大于利率上升时价格下跌幅度", "利率变动对价格的影响程度随利率水平变化", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479120", "t": 2, "q": "影响债券久期的因素包括（　）", "a": ["债券的到期期限", "债券的票面利率", "债券的付息频率", "市场利率水平", "", ""], "r": "ABCD", "e": "债券久期受到期期限、票面利率、付息频率、市场利率水平等多因素影响。到期期限长、票面利率低、付息频率低、市场利率低，久期通常长。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479121", "t": 2, "q": "并购估值中，现金流折现法的关键参数包括？", "a": ["未来自由现金流", "折现率", "预测期长度", "可比公司的市盈率", "", ""], "r": "ABC", "e": "现金流折现法是通过预测企业未来的自由现金流，用合适的折现率将其折现到当前来估算企业价值。未来自由现金流、折现率和预测期长度都是该方法的关键参数。而可比公司的市盈率是相对估值法的参数。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479122", "t": 2, "q": "资本资产定价模型中，无风险利率的选择需满足的条件包括？", "a": ["没有违约风险", "没有流动性风险", "期限与投资组合的持有期匹配", "收益率固定", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479123", "t": 2, "q": "套利定价模型与资本资产定价模型的共同点包括？", "a": ["都考虑了风险与收益的关系", "都可用于资产定价和收益率预测", "都假设投资者是风险厌恶的", "都以有效市场为前提", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479124", "t": 2, "q": "并购交易中，现金支付方式的优点是（　）", "a": ["对并购方现金流压力小", "交易完成速度快", "目标公司股东能立即获得确定收益", "无需承担股价波动风险", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479125", "t": 2, "q": "投资组合绩效评价的指标包括（　）", "a": ["夏普比率", "特雷诺比率", "詹森α", "市盈率", "", ""], "r": "ABC", "e": "夏普比率、特雷诺比率、詹森α都是用于投资组合绩效评价的指标，而市盈率主要用于衡量股票估值，并非投资组合绩效评价指标。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479126", "t": 2, "q": "下列属于期权衍生品的有（　）", "a": ["远期合约", "期货合约", "看涨期权", "看跌期权", "", ""], "r": "CD", "e": "期权衍生品包括看涨期权和看跌期权，而远期合约和期货合约不属于期权衍生品。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479127", "t": 2, "q": "电力企业的权益融资方式包括（　）", "a": ["发行普通股", "发行优先股", "留存收益转增资本", "发行可转换债券", "", ""], "r": "ABC", "e": "权益融资是企业通过出让股权来筹集资金。发行普通股、优先股都是向投资者发售股权获得资金；留存收益转增资本是将企业内部留存的收益转化为股本，属于权益融资。而发行可转换债券在未转换前是债务融资，转换后才变为权益融资，通常不单纯作为权益融资方式。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479128", "t": 2, "q": "下列属于马科维茨证券投资组合理论假设条件的有（　）", "a": ["投资者以预期收益率和方差衡量收益和风险", "投资者是风险厌恶的", "市场中不存在交易成本和税收", "证券市场是强式有效的", "", ""], "r": "ABC", "e": "马科维茨理论假设投资者用预期收益率和方差衡量收益与风险，且是风险厌恶的，同时假设市场无交易成本和税收。强式有效市场并非其假设条件。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479129", "t": 2, "q": "下列属于期货市场功能的有？", "a": ["套期保值", "价格发现", "投机", "融资", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479130", "t": 2, "q": "电力企业项目融资的特点有（　）", "a": ["融资主体是项目公司", "以项目未来现金流作为还款来源", "通常具有有限追索权", "融资期限短于项目回收期", "", ""], "r": "ABC", "e": "电力企业项目融资主体一般是项目公司，依靠项目未来现金流还款，多为有限追索权。而项目融资期限通常长于项目回收期。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479131", "t": 2, "q": "有效市场假说的三种形式包括（　）", "a": ["弱式有效市场", "半弱式有效市场", "半强式有效市场", "强式有效市场", "", ""], "r": "ACD", "e": "有效市场假说三种形式为弱式、半强式和强式有效市场，不存在半弱式有效市场。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479132", "t": 2, "q": "下列关于有效市场的说法，正确的有（　）", "a": ["弱式有效市场中，技术分析无效", "半强式有效市场中，基本面分析无效", "强式有效市场中，内幕交易无效", "有效市场中，所有投资者都能获得超额收益", "", ""], "r": "ABC", "e": "在弱式有效市场，股价已反映历史信息，技术分析无法获取超额收益即无效；半强式有效市场股价反映公开信息，基本面分析无用；强式有效市场股价反映所有信息，内幕交易也无法获利。而有效市场中并非所有投资者都能获超额收益。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479133", "t": 2, "q": "基金投资的优势包括（　）", "a": ["专业管理", "分散投资", "流动性强", "税负较低", "", ""], "r": "ABCD", "e": "基金由专业基金经理管理，能发挥专业优势，A正确；通过投资多只标的分散风险，B正确；开放式基金可随时申购赎回，流动性强，C正确；部分基金投资有税收优惠，税负较低，D正确。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479134", "t": 2, "q": "基金投资中，混合型基金的特点包括？", "a": ["同时投资于股票、债券等多种资产", "资产配置比例灵活", "风险和收益介于股票型基金和债券型基金之间", "只能投资于单一类型资产", "", ""], "r": "ABC", "e": "混合型基金可同时投资股票、债券等多种资产，资产配置比例灵活，风险和收益处于股票型与债券型基金之间，并非只能投资单一类型资产。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479135", "t": 2, "q": "套利定价模型与CAPM的共同点有（　）", "a": ["都考虑风险与收益的关系", "都以有效市场为前提", "都可用于资产定价", "都假设单一风险因子", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479136", "t": 2, "q": "证券投资组合理论中，投资者选择最优组合的依据包括（　）", "a": ["自身的风险偏好", "组合的有效边界", "无风险利率水平", "市场的平均收益率", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818553202479137", "t": 2, "q": "工程项目经济评价中，净现值（NPV）大于零表明（　）", "a": ["项目的收益率大于基准收益率", "项目的盈利能力达到预期", "项目可行", "项目的投资回收期较短", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650196992", "t": 3, "q": "电力企业的绿色融资仅包括发行绿色债券一种方式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电力企业绿色融资方式多样，不止发行绿色债券这一种，还有绿色信贷、绿色基金投资等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650196993", "t": 3, "q": "电力企业的投融资活动不受国家能源政策的调控。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国家能源政策会从宏观层面引导能源行业发展，电力企业作为能源领域重要组成部分，其投融资活动会受国家能源政策调控，以保障能源供应、促进能源结构优化等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818556650196994", "t": 3, "q": "债券的凸性越大，说明债券价格对利率变动的敏感性越强，利率变动时债券价格的波动幅度越大。", "a": ["正确", "错误", "",
