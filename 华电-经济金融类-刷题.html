，ETF基金（交易型开放式指数基金）的特点不包括？", "a": ["可以在交易所上市交易", "可以进行实物申购赎回", "实行T+0交易制度（部分除外）", "只能通过基金公司申购赎回", "", ""], "r": "D", "e": "ETF可在交易所上市交易，能进行实物申购赎回，部分实行T+0交易。而只能通过基金公司申购赎回是普通开放式基金特点，不是ETF特点。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657694", "t": 1, "q": "根据有效市场假说，若市场达到强式有效，以下哪种投资策略无法获得超额收益？（　）", "a": ["基于历史价格的技术分析", "基于公开信息的基本面分析", "基于内幕信息的交易", "以上均无法获得", "", ""], "r": "D", "e": "强式有效市场中，所有信息（包括历史信息、公开信息和内幕信息）都已反映在股价中。技术分析依赖历史价格，基本面分析基于公开信息，在强式有效市场都无用；内幕信息也不能带来超额收益。所以以上策略均无法获得超额收益。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657695", "t": 1, "q": "有效市场假说的实证检验中，若发现技术分析能获得超额收益，则市场可能处于（　）", "a": ["弱式有效状态", "半强式有效状态", "非弱式有效状态", "强式有效状态", "", ""], "r": "C", "e": "有效市场中，弱式有效市场技术分析无法获得超额收益，若技术分析能获超额收益，说明不满足弱式有效，即市场处于非弱式有效状态。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657696", "t": 1, "q": "债券投资中，久期是衡量债券价格对利率变动敏感性的指标，以下关于久期的说法错误的是？", "a": ["债券剩余期限越长，久期通常越长", "票面利率越高，久期通常越短", "零息债券的久期等于其剩余期限", "久期与债券的到期收益率正相关", "", ""], "r": "D", "e": "久期与债券到期收益率负相关，到期收益率越高，久期越短。A选项剩余期限长，久期通常长；B选项票面利率高，现金流回收快，久期短；C选项零息债券只有到期一次现金流，久期等于剩余期限。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657697", "t": 1, "q": "套利定价模型（APT）与资本资产定价模型（CAPM）的主要区别在于（　）", "a": ["APT假设投资者是风险厌恶的，而CAPM假设风险中性", "APT不需要市场组合的存在，而CAPM依赖市场组合", "APT仅考虑系统性风险，而CAPM考虑所有风险", "APT适用于单个证券，而CAPM适用于投资组合", "", ""], "r": "B", "e": "CAPM依赖市场组合来确定资产的预期收益率，而APT通过多个因素来解释资产收益，不需要市场组合的存在。A选项中两者都假设投资者风险厌恶；C选项两者都主要考虑系统性风险；D选项两者对单个证券和投资组合都适用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657698", "t": 1, "q": "债券投资中，免疫策略的核心目的是？", "a": ["最大化债券组合的收益率", "最小化债券组合的利率风险", "捕捉债券市场的价差收益", "优化债券组合的流动性", "", ""], "r": "B", "e": "免疫策略是通过资产负债的匹配来减少利率波动对债券组合价值的影响，其核心是最小化利率风险。A选项最大化收益率并非免疫策略核心；C选项捕捉价差收益不是免疫策略重点；D选项优化流动性也不是其核心目的。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818581052657699", "t": 1, "q": "工程项目投资中，属于自有资金来源的是（　）", "a": ["银行长期贷款", "企业留存收益", "发行公司债券", "融资租赁", "", ""], "r": "B", "e": "自有资金是企业自身拥有的资金。银行长期贷款、发行公司债券、融资租赁都是外部融资方式，不属于自有资金。而企业留存收益是企业经营成果积累，属于自有资金。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612160", "t": 2, "q": "资本资产定价模型（CAPM）的假设条件包括（　）", "a": ["存在无风险资产", "投资者具有相同的预期", "市场是完全竞争的", "允许卖空", "", ""], "r": "ABCD", "e": "资本资产定价模型（CAPM）有多个假设条件，ABCD四个选项都是其假设内容。存在无风险资产方便构建投资组合；投资者具有相同预期能使模型更具一致性；市场完全竞争保证价格由市场决定；允许卖空可丰富投资策略。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612161", "t": 2, "q": "下列关于投资组合的说法，正确的有？", "a": ["有效组合一定在有效前沿上", "有效前沿上的组合都是可行组合", "可行组合一定是有效组合", "投资者的最优组合是有效前沿与无差异曲线的切点", "", ""], "r": "ABD", "e": "有效前沿是所有有效组合构成的集合，所以有效组合一定在有效前沿上，A对；有效前沿是可行集中收益-风险的最优集合，其组合属于可行组合，B对；可行组合众多，并非都是有效组合，C错；投资者最优组合就是在有效前沿找到与无差异曲线切点的那个组合，D对。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612162", "t": 2, "q": "有效市场假说的理论基础包括？", "a": ["理性投资者假设", "随机漫步理论", "信息对称假设", "套利均衡假设", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612163", "t": 2, "q": "电力企业投融资项目的风险特征包括？", "a": ["政策风险高（受能源政策调控）", "技术风险低（电力技术成熟）", "资金风险高（投资规模大、回收周期长）", "市场风险低（电力需求稳定）", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612164", "t": 2, "q": "工程项目投资的资金来源包括（　）", "a": ["自有资金", "银行贷款", "发行债券", "国家财政拨款", "", ""], "r": "ABCD", "e": "工程项目投资资金来源多样，自有资金是投资者自己拥有的资金；银行贷款是从银行借入的款项；发行债券是通过向社会发行债券筹集资金；国家财政拨款是国家给予的资金支持。ABCD 选项均是常见资金来源。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612165", "t": 2, "q": "工程项目经济评价的静态指标包括（　）", "a": ["投资回收期", "净现值", "投资利润率", "内部收益率", "", ""], "r": "AC", "e": "静态指标不考虑资金时间价值。投资回收期、投资利润率不考虑资金时间价值属静态指标；净现值、内部收益率考虑资金时间价值属动态指标。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612166", "t": 2, "q": "基本面分析的主要内容包括（　）", "a": ["宏观经济分析", "行业分析", "公司分析", "技术指标分析", "", ""], "r": "ABC", "e": "基本面分析是对影响证券投资的基本因素进行分析，宏观经济、行业、公司情况都会影响证券价值，所以ABC属于基本面分析内容。而技术指标分析是利用图表和技术指标来研究证券价格走势等，不属于基本面分析。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612167", "t": 2, "q": "投资组合绩效评价的詹森阿尔法（Jensen's Alpha）指标的特点包括？", "a": ["衡量组合的超额收益", "以资本资产定价模型为基准", "阿尔法大于0说明组合跑赢市场", "仅考虑组合的非系统风险", "", ""], "r": "ABC", "e": "詹森阿尔法基于资本资产定价模型，衡量组合实际收益与模型预期收益的差值即超额收益，阿尔法大于0意味着组合表现优于市场。它考虑的是系统风险而非非系统风险。所以ABC正确，D错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612168", "t": 2, "q": "债券投资中，免疫策略的目的是（　）", "a": ["规避利率风险", "获取超额收益", "匹配资产和负债的期限", "最大化债券组合的收益率", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612169", "t": 2, "q": "下列关于期货与期权的区别，说法正确的有（　）", "a": ["期货合约双方都有履约义务，期权买方只有权利无义务", "期货交易需缴纳保证金，期权买方无需缴纳保证金", "期货合约的收益对称，期权合约的收益不对称", "期货的标的物只能是商品，期权的标的物只能是金融资产", "", ""], "r": "ABC", "e": "A选项，期货合约双方到期都要履约，期权买方有权利不行使，无履约义务；B选项，期货交易双方都要交保证金，期权买方不用交；C选项，期货盈亏理论上对等，期权买方损失有限收益可能大，卖方收益有限损失可能大，收益不对称；D选项，期货和期权标的物都可以是商品和金融资产。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612170", "t": 2, "q": "工程项目投资的资金来源包括（　）", "a": ["权益资金", "债务资金", "政府补助资金", "租赁资金", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612171", "t": 2, "q": "电力企业的股权融资方式包括（　）", "a": ["首次公开募股（IPO）", "增发股票", "发行企业债券", "配股", "", ""], "r": "ABD", "e": "股权融资是企业通过出让股权来筹集资金。A首次公开募股、B增发股票、D配股都是通过发行股票获取资金，属于股权融资。而C发行企业债券是债务融资，不是股权融资。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612172", "t": 2, "q": "债券投资的风险包括（　）", "a": ["利率风险", "信用风险", "流动性风险", "汇率风险", "", ""], "r": "ABCD", "e": "债券投资会面临多种风险，利率变动影响债券价格产生利率风险；发行方可能违约带来信用风险；债券买卖难易程度涉及流动性风险；涉及外币债券时存在汇率风险。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612173", "t": 2, "q": "下列关于期货与期权的区别，说法正确的是？", "a": ["期货合约双方都有履约义务，期权买方只有权利无义务", "期货合约是标准化的，期权合约是非标准化的", "期货交易无需缴纳保证金，期权交易需要缴纳保证金", "期货的收益与风险对称，期权的收益与风险不对称", "", ""], "r": "AD", "e": "期货合约双方都要按约定履约，期权买方支付权利金后有行权权利无义务；期货和期权合约一般都是标准化的；期货交易双方都要交保证金，期权卖方需交保证金；期货盈亏随价格波动，收益风险对称，期权买方最大损失是权利金，收益可能很大，风险收益不对称。答案：AD", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612174", "t": 2, "q": "工程项目投资的资金来源中，属于长期债务资金的有（　）", "a": ["长期银行贷款", "发行长期债券", "股东投入资本", "融资租赁", "", ""], "r": "ABD", "e": "长期债务资金包括长期借款、发行长期债券、融资租赁等。A长期银行贷款属长期借款；B发行长期债券是典型债务资金；D融资租赁也是债务资金形式。而C股东投入资本属于权益资金。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612175", "t": 2, "q": "投资组合的非系统性风险可以通过以下方式消除（　）", "a": ["增加组合中证券的数量", "选择相关性低的证券", "分散投资于不同行业", "增加组合的β系数", "", ""], "r": "ABC", "e": "非系统性风险是个别公司或行业特有的风险，可通过分散投资降低或消除。增加组合中证券数量、选相关性低证券、分散投资不同行业都能分散风险。而增加组合β系数是增加系统风险，不能消除非系统性风险。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612176", "t": 2, "q": "弱式有效市场下，投资者可以采用的投资策略有？", "a": ["基本面分析策略", "技术分析策略", "内幕交易策略（若存在内幕信息）", "被动投资策略", "", ""], "r": "ACD", "e": "弱式有效市场中，股价已反映历史信息，技术分析无用。基本面分析能挖掘未反映在股价中的公开信息，可采用；若存在内幕信息，利用内幕交易能获取超额收益；被动投资策略不依赖市场分析，也可行。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612177", "t": 2, "q": "债券资产组合管理的策略包括（　）", "a": ["被动管理策略", "主动管理策略", "免疫策略", "指数化策略", "", ""], "r": "ABCD", "e": "债券资产组合管理策略分为被动和主动管理策略。免疫策略和指数化策略都属于被动管理策略。所以答案涵盖ABCD。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612178", "t": 2, "q": "电力企业的权益融资方式包括？", "a": ["发行普通股", "留存收益转增资本", "发行优先股", "发行企业债券", "", ""], "r": "ABC", "e": "权益融资是企业通过出让部分股权来获得资金。发行普通股、优先股都属于直接向投资者发售股权来融资；留存收益转增资本是企业将自身积累的留存收益转化为股本，也属于权益融资。而发行企业债券是债务融资，企业需到期还本付息。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612179", "t": 2, "q": "期权的价值由以下哪些部分构成？（　）", "a": ["内在价值", "时间价值", "票面价值", "市场价值", "", ""], "r": "AB", "e": "期权价值包含内在价值和时间价值。内在价值是期权立即行权能获得的收益，时间价值反映了到期前因标的资产价格波动可能带来额外收益的价值。票面价值一般与债券等有关，市场价值是资产在市场上的价格，并非期权价值构成部分。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612180", "t": 2, "q": "电力企业固定资产投资的特点包括（　）", "a": ["投资规模大", "建设周期长", "流动性强", "风险较高", "", ""], "r": "ABD", "e": "电力企业固定资产投资通常需要大量资金，所以投资规模大；从建设到投入使用时间跨度长，建设周期长；且固定资产一旦形成就相对固定，流动性弱；同时受多种因素影响，风险较高。C选项流动性强不符合其特点。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612181", "t": 2, "q": "下列关于套利的说法，正确的有？", "a": ["套利是无风险的", "套利需要同时买入和卖出相关资产", "套利的目的是获取超额收益", "套利行为会使资产价格回归合理水平", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612182", "t": 2, "q": "下列关于期货交易与期权交易的区别，说法正确的有（　）", "a": ["期货交易双方均有履约义务，期权交易仅卖方有履约义务", "期货交易保证金要求高，期权交易仅卖方需缴纳保证金", "期货交易收益和损失对称，期权交易收益和损失不对称", "期货交易标的范围窄，期权交易标的范围广", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612183", "t": 2, "q": "开放式基金与封闭式基金的区别在于（　）", "a": ["基金份额是否可赎回", "基金规模是否固定", "交易场所不同", "定价方式不同", "", ""], "r": "ABCD", "e": "开放式基金份额可赎回、规模不固定，可在场外申购赎回，价格按基金净值；封闭式基金份额不可赎回、规模固定，多在证券交易所交易，有市场价格和净值。ABCD四个选项均是二者区别。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612184", "t": 2, "q": "并购交易中，协同效应的主要来源包括（　）", "a": ["经营协同效应", "财务协同效应", "管理协同效应", "市场协同效应", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612185", "t": 2, "q": "半强式有效市场下，下列哪些信息已反映在股价中？", "a": ["公司的盈利预告", "股票的历史成交量", "行业研究报告", "未公开的重大合同信息", "", ""], "r": "ABC", "e": "半强式有效市场中，股价反映了所有公开信息。A公司盈利预告、B股票历史成交量、C行业研究报告都属于公开信息，会反映在股价中；而D未公开的重大合同信息是非公开信息，不会反映在股价中。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612186", "t": 2, "q": "下列关于期货保证金制度的表述，正确的是（　）", "a": ["保证金是期货交易的履约担保", "保证金比例由期货交易所统一规定", "保证金可以是现金或有价证券", "保证金比例越高，杠杆效应越强", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612187", "t": 2, "q": "期货市场的功能包括（　）", "a": ["套期保值", "价格发现", "投机", "融资", "", ""], "r": "ABC", "e": "期货市场有套期保值、价格发现、投机等功能。套期保值可规避价格波动风险；期货价格能反映供求关系实现价格发现；投资者可通过买卖期货合约投机获利。融资并非其主要功能。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612188", "t": 2, "q": "债券的到期收益率受哪些因素影响（　）", "a": ["债券的票面利率", "债券的面值", "债券的市场价格", "债券的剩余期限", "", ""], "r": "ABCD", "e": "债券到期收益率是使债券未来现金流现值等于当前市场价格的折现率，票面利率、面值决定未来现金流，市场价格是计算依据，剩余期限影响现金流时间分布，这些都会影响到期收益率。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612189", "t": 2, "q": "并购后的整合包括（　）", "a": ["战略整合", "财务整合", "人力资源整合", "文化整合", "", ""], "r": "ABCD", "e": "并购后整合是使并购发挥协同效应的关键，涵盖多方面，战略、财务、人力资源和文化整合都是重要方面。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612190", "t": 2, "q": "下列属于证券投资基本面分析的内容有（　）", "a": ["宏观经济分析", "行业分析", "公司财务分析", "K线图分析", "", ""], "r": "ABC", "e": "基本面分析是对宏观经济、行业和公司基本情况等进行分析。A宏观经济分析、B行业分析、C公司财务分析都属于基本面分析范畴。而D K线图分析是技术分析方法。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612191", "t": 2, "q": "证券投资基本面分析的主要内容包括（　）", "a": ["宏观经济分析", "行业分析", "公司财务分析", "技术指标分析", "", ""], "r": "ABC", "e": "基本面分析是从宏观、中观、微观层面来研究影响证券价值和价格的基本因素。宏观经济分析是宏观层面，行业分析是中观层面，公司财务分析是微观层面。而技术指标分析是基于证券价格和成交量等交易数据进行分析，不属于基本面分析。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612192", "t": 2, "q": "资本资产定价模型（CAPM）的基本假设包括（　）", "a": ["投资者都是风险厌恶型", "市场上存在无风险资产", "投资者具有相同的预期", "市场是完全竞争的", "", ""], "r": "ABCD", "e": "资本资产定价模型有多个基本假设，投资者风险厌恶、市场存在无风险资产、投资者预期相同、市场完全竞争等都是其常见假设内容。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818582411612193", "t": 2, "q": "基金的分类中，根据投资对象不同可分为（　）", "a": ["股票基金", "债券基金", "混合基金", "封闭式基金", "", ""], "r": "ABC", "e": "基金按投资对象不同分为股票基金、债券基金、混合基金等。而封闭式基金是按基金运作方式分类。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628672", "t": 3, "q": "期货合约的交易双方都有义务在到期日按约定履行合约。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "期货合约是标准化的，交易双方在合约到期时都有按约定履行合约的义务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628673", "t": 3, "q": "并购估值中，市盈率法适用于所有类型的企业。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "市盈率法有一定局限性，并非适用于所有类型企业，如亏损企业、新兴行业高成长但盈利不稳定企业等难以适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628674", "t": 3, "q": "有效市场假说中，弱式有效市场下，技术分析无法获得超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "弱式有效市场中，股价已反映了历史信息，技术分析基于历史价格等信息，在这种市场下其分析结果已包含在当前股价中，所以无法靠技术分析获得超额收益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628675", "t": 3, "q": "因子模型中，资产的超额收益率等于各因子暴露度乘以因子收益率之和，再加上随机误差项。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这符合因子模型对资产超额收益率的基本表达。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628676", "t": 3, "q": "有效市场假说中，弱式有效市场是最高级别的有效市场。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "有效市场假说中，强式有效市场才是最高级别的有效市场，弱式有效市场是最低级别。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628677", "t": 3, "q": "工程项目投资的资金来源中，债务资金的成本通常低于权益资金的成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "债务资金有固定利息且可税前扣除，利息负担和风险小于权益资金，投资者要求回报低，所以成本通常低于权益资金成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628678", "t": 3, "q": "套利定价模型中的因子必须是可交易的风险因子。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "套利定价模型中的因子可以是可交易的风险因子，但并非必须，也可以是宏观经济变量等不可交易的因子。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628679", "t": 3, "q": "开放式基金的规模会随着投资者的申购和赎回而变化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "开放式基金不限制发行规模，投资者可随时申购或赎回基金份额，这会直接使基金规模相应增加或减少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628680", "t": 3, "q": "期货市场的价格发现功能是指期货价格能反映市场未来的供求关系和价格走势。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "期货市场具有价格发现功能，众多参与者通过交易形成的期货价格，能对未来市场供求关系和价格走势作出预期反映。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628681", "t": 3, "q": "并购估值中，市销率（P/S）估值法适用于盈利稳定、现金流充沛的成熟企业。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "市销率（P/S）估值法适用于销售成本率较低、销售收入稳定的企业，尤其是尚未盈利的初创企业；盈利稳定、现金流充沛的成熟企业更适合用市盈率（P/E）等估值法。所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628682", "t": 3, "q": "套利定价模型（APT）要求投资者是风险厌恶的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "套利定价模型（APT）并不要求投资者是风险厌恶的，它基于无套利原则，不依赖投资者风险偏好假设。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628683", "t": 3, "q": "电力企业的融资需求主要集中在项目建设阶段，运营阶段几乎无融资需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电力企业运营阶段也会有融资需求，比如设备更新、技术升级、日常资金周转等，并非几乎无融资需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628684", "t": 3, "q": "基本面分析主要关注证券的历史交易价格和成交量等数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基本面分析主要研究宏观经济、行业状况、公司经营等基本因素，技术分析才关注证券历史交易价格和成交量等数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628685", "t": 3, "q": "因子模型中的因子必须是宏观经济变量，不能是公司层面的微观变量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "因子模型中的因子既可以是宏观经济变量，也可以是公司层面的微观变量，如公司规模、市盈率等微观变量也能作为因子。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628686", "t": 3, "q": "马科维茨证券投资组合理论认为，投资者的最优投资组合是唯一的，与投资者的风险偏好无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "马科维茨理论中，投资者最优投资组合是在有效边界上结合自身风险偏好确定的，不同风险偏好投资者会有不同最优组合。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628687", "t": 3, "q": "基本面分析主要适用于半强式有效市场和弱式有效市场。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628688", "t": 3, "q": "弱式有效市场中，投资者可以通过分析历史股价走势获得超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在弱式有效市场中，股价已反映了所有历史信息，技术分析失去作用，投资者无法通过分析历史股价走势获得超额收益。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628689", "t": 3, "q": "混合型基金的资产配置比例固定，不能根据市场情况调整股票和债券的投资比例。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混合型基金资产配置比例不固定，可依据市场情况调整股票和债券投资比例。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628690", "t": 3, "q": "基金的管理费是由基金托管人收取的费用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基金管理费是基金管理人因管理基金资产而向基金收取的费用，并非由基金托管人收取。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628691", "t": 3, "q": "债券资产组合的免疫策略是通过调整组合的久期，使组合的久期与投资期限匹配，从而规避利率风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "免疫策略核心就是通过调整债券组合久期，让其与投资期限一致，这样在利率变动时，债券价格变动和再投资收益变动相互抵消，可有效规避利率风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628692", "t": 3, "q": "资本资产定价模型中的市场组合是指包含所有风险资产的最优组合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资本资产定价模型里的市场组合理论上是包含所有风险资产且按其市值比重构成的组合，是最优风险组合。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628693", "t": 3, "q": "资本资产定价模型中的无风险利率通常采用短期国债利率，因为短期国债几乎没有违约风险和流动性风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "短期国债安全性高，几乎无违约风险，且交易活跃流动性好，常被用作无风险利率代表，所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628694", "t": 3, "q": "债券的久期等于债券的剩余期限，零息债券的久期小于其剩余期限。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般债券久期小于剩余期限，零息债券久期等于其剩余期限。所以题干表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628695", "t": 3, "q": "电力企业的投融资项目多为固定资产投资，具有投资规模大、回收周期长、现金流稳定的特点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电力企业开展的投融资项目大多是用于建设电厂、电网等固定资产，这些项目通常需要大量资金投入，所以投资规模大；从建设到产生收益收回成本需要较长时间，回收周期长；而且电力作为基础能源，需求相对稳定，项目运营后现金流也较为稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583577628696", "t": 3, "q": "开放式基金的交易价格由基金管理人根据市场供求关系确定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开放式基金交易价格取决于基金单位资产净值，而非由基金管理人根据市场供求关系确定。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822976", "t": 3, "q": "套利定价模型（APT）认为，资产的预期收益率仅由市场风险因子决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "套利定价模型（APT）认为资产的预期收益率受多种因素影响，并非仅由市场风险因子决定。", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822977", "t": 3, "q": "期权的时间价值随着到期日的临近而逐渐增加。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "期权的时间价值是指期权权利金扣除内涵价值的剩余部分，随着到期日临近，时间流逝，不确定性降低，时间价值会逐渐减少，而不是增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822978", "t": 3, "q": "夏普比率越高，说明投资组合的绩效越好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "夏普比率反映了资产在承担单位风险时所能获得的超过无风险收益的额外收益，比率越高意味着在同等风险下能获得更多回报，即投资组合绩效更好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822979", "t": 3, "q": "有效市场假说中，弱式有效市场下，技术分析无法获得超额收益，但基本面分析可能获得超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在弱式有效市场中，股价已反映过去的交易信息，技术分析依据历史数据，所以无法获取超额收益。而基本面分析基于公司经营、财务等信息，这些信息未完全反映在股价中，有可能获得超额收益。", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822980", "t": 3, "q": "期货市场的价格发现功能是指期货价格能反映未来现货价格的走势。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "期货市场价格发现功能就是通过公开、公平、高效、竞争的期货交易运行机制，形成具有真实性、预期性、连续性和权威性价格的过程，能反映未来现货价格走势。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822981", "t": 3, "q": "技术分析中的MACD指标属于趋势类指标。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "MACD指标通过对不同周期移动平均线的差值分析，来判断股价趋势，属于趋势类指标。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822982", "t": 3, "q": "基金管理人负责基金资产的保管，基金托管人负责基金的投资运作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基金管理人负责基金的投资运作，基金托管人负责基金资产的保管。题干表述职责颠倒。", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822983", "t": 3, "q": "资本资产定价模型（CAPM）中的市场组合是指包含所有风险资产的组合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资本资产定价模型里的市场组合理论上是包含所有风险资产的组合，该组合中每种风险资产的投资比例等于其相对市值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822984", "t": 3, "q": "债券的价格与市场利率呈正相关关系，市场利率上升，债券价格上涨;市场利率下降，债券价格下跌。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。债券价格与市场利率呈负相关关系。当市场利率上升时，新发行债券的利率提高，旧债券相对吸引力下降，其价格会下跌；反之，市场利率下降，旧债券相对更有吸引力，价格会上涨。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822985", "t": 3, "q": "半强式有效市场下，投资者通过分析公司的财务报表无法获得超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "半强式有效市场中，股价已反映了所有公开信息，公司财务报表属于公开信息，所以投资者仅通过分析财务报表不能获得超额收益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822986", "t": 3, "q": "债券的票面利率越高，其到期收益率一定越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "债券到期收益率不仅取决于票面利率，还受债券价格、持有期限等多种因素影响。票面利率高，但如果债券价格偏离面值较大等情况，到期收益率不一定高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822987", "t": 3, "q": "市盈率越高，说明公司的投资价值越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "市盈率是股价除以每股收益，高市盈率可能意味着股价被高估，存在较大投资风险，不一定投资价值就高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822988", "t": 3, "q": "债券的凸性为正，意味着利率下降时债券价格上涨的幅度大于利率上升时价格下跌的幅度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "凸性衡量债券价格 - 收益率曲线的弯曲程度，凸性为正，利率与债券价格呈反向变动，且利率下降时债券价格上涨幅度大于利率上升时价格下跌幅度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822989", "t": 3, "q": "强式有效市场中，基本面分析仍然有效。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在强式有效市场中，所有信息（包括公开和内幕信息）都已反映在股价中，基本面分析无法获取额外的超额收益，所以基本面分析无效。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822990", "t": 3, "q": "投资组合的非系统风险可以通过增加组合中证券的数量完全消除，系统风险则无法消除。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "非系统风险是个别公司或行业特有的风险，可通过分散投资，即增加组合中证券数量来降低直至完全消除；而系统风险源于宏观因素，影响所有证券，无法通过分散投资消除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822991", "t": 3, "q": "夏普比率衡量的是单位系统性风险带来的超额收益。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "夏普比率衡量的是单位总风险带来的超额收益，而非单位系统性风险带来的超额收益，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822992", "t": 3, "q": "期权的内在价值不可能为负数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "期权内在价值是期权立即行权能获得的收益，最小为 0，不会是负数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822993", "t": 3, "q": "夏普比率和特雷诺比率的区别在于，前者使用总风险衡量，后者使用系统性风险衡量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "夏普比率公式中分母是标准差，衡量的是总风险；特雷诺比率公式中分母是贝塔系数，衡量的是系统性风险。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822994", "t": 3, "q": "证券组合的相关系数越接近1，分散化效应越明显;相关系数越接近-1，分散化效应越弱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。证券组合相关系数越接近 -1，分散化效应越明显，因为此时两种证券走势相反，能更好地分散风险；而相关系数越接近 1，分散化效应越弱，意味着证券走势相近，难以通过组合分散风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818583581822995", "t": 3, "q": "工程项目经济评价的静态指标不考虑资金的时间价值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "静态指标的特点就是不考虑资金时间价值，动态指标才考虑资金时间价值。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 保险学（1）", "n": "基础练习题【含解析】 / 第5章 保险学（1）", "qs": [{"id": "2034818585813192704", "t": 1, "q": "下列关于保险职能的说法中，属于保险派生职能的是", "a": ["分散风险职能", "补偿损失职能", "资金融通职能", "经济保障职能", "", ""], "r": "C", "e": "保险的基本职能是分散风险和补偿损失，经济保障是保险的总体作用。而资金融通是保险在基本职能基础上发展出的派生职能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192705", "t": 1, "q": "保险合同中，保险人承担赔偿或者给付保险金责任的最高限额是（　）", "a": ["保险价值", "保险金额", "保险费", "赔偿限额", "", ""], "r": "B", "e": "保险金额是保险人承担赔偿或给付保险金责任的最高限额。保险价值是保险标的价值；保险费是投保人向保险人支付的费用；赔偿限额表述不准确。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192706", "t": 1, "q": "保险数理基础中，用于衡量风险发生可能性大小的指标是", "a": ["损失程度", "风险频率", "保额", "保险费率", "", ""], "r": "B", "e": "风险频率指一定时期内风险发生的次数，能衡量风险发生可能性大小。损失程度是损失的严重情况；保额是保险金额；保险费率是计算保险费的比率。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192707", "t": 1, "q": "新型电力系统保险中，针对光伏电站组件衰减风险提供保障的险种属于", "a": ["财产损失保险", "责任保险", "信用保险", "保证保险", "", ""], "r": "A", "e": "光伏电站组件衰减会导致组件财产价值降低，属于财产损失情况，所以针对该风险提供保障的险种属于财产损失保险。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192708", "t": 1, "q": "保险法中规定的\"不可抗辩条款\"主要是为了保护", "a": ["保险人的利益", "投保人的利益", "被保险人的利益", "受益人的利益", "", ""], "r": "C", "e": "不可抗辩条款限制了保险人解除合同的权利，防止保险人随意以投保人不如实告知等理由拒赔，保障了长期合同中被保险人在合同生效一定时间后的保险权益。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192709", "t": 1, "q": "下列关于近因原则的说法中，正确的是", "a": ["近因是指导致损失发生的最直接、最有效、起决定性作用的原因", "近因是指时间上最接近损失发生的原因", "近因是指空间上最接近损失发生的原因", "近因原则仅适用于财产保险", "", ""], "r": "A", "e": "近因是导致损失发生的最直接、最有效、起决定性作用的原因，而非时间或空间上接近损失发生的原因，且近因原则适用于所有保险。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192710", "t": 1, "q": "下列关于保险合同射幸性的表述，正确的是", "a": ["仅投保人承担射幸风险", "仅保险人承担射幸风险", "投保人和保险人双方均承担射幸风险", "射幸性仅体现在财产保险合同中", "", ""], "r": "C", "e": "射幸合同是指合同的效果在订约时不能确定的合同。保险合同中，投保人支付保费，能否获得保险金不确定；保险人收取保费，是否需支付保险金也不确定，所以投保人和保险人双方均承担射幸风险。且射幸性不仅体现在财产保险合同，人身保险合同也有。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192711", "t": 1, "q": "根据保险法，投保人故意不履行如实告知义务的，保险人对于保险合同解除前发生的保险事故（　）", "a": ["不承担赔偿或者给付保险金的责任，不退还保险费", "不承担赔偿或者给付保险金的责任，但退还保险费", "承担赔偿或者给付保险金的责任", "承担部分赔偿或者给付保险金的责任", "", ""], "r": "A", "e": "投保人故意不履行如实告知义务，保险人对合同解除前事故不担责且不退还保费，这是为惩戒故意隐瞒行为。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192712", "t": 1, "q": "保险利益原则要求投保人在什么时间具有保险利益（　）", "a": ["投保时", "保险事故发生时", "投保时和保险事故发生时", "保险合同有效期内", "", ""], "r": "C", "e": "财产保险要求在保险事故发生时具有保险利益，人身保险要求在投保时具有保险利益。综合来看，保险利益原则要求投保人在投保时和保险事故发生时都具有保险利益。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192713", "t": 1, "q": "人身保险合同中，投保人申报的被保险人年龄不真实，并且其真实年龄不符合合同约定的年龄限制的，保险人可以解除合同，这一规定体现的是", "a": ["保险利益原则", "最大诚信原则", "损失补偿原则", "近因原则", "", ""], "r": "B", "e": "投保人申报被保险人年龄不真实违背诚信，保险人据此解除合同体现最大诚信原则。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192714", "t": 1, "q": "在保险经营中，保险人根据风险的性质和程度，对投保人提出的保险申请进行审核、评估并决定是否承保的过程称为", "a": ["保险核保", "保险理赔", "保险承保", "保险续保", "", ""], "r": "A", "e": "保险核保就是保险人对投保申请审核、评估并决定是否承保的过程；保险理赔是在保险事故发生后处理赔偿事宜；保险承保是签订保险合同的过程；保险续保是在保险合同期满后续签。所以本题描述的是保险核保。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192715", "t": 1, "q": "电力企业海外投资保险中，承保因投资所在国政府采取汇兑限制措施，导致投资者无法将投资收益汇回本国的风险是", "a": ["征收风险", "汇兑限制风险", "战争风险", "违约风险", "", ""], "r": "B", "e": "题目明确提到“因投资所在国政府采取汇兑限制措施，导致投资者无法将投资收益汇回本国”，这显然是汇兑限制风险的表现。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818585813192716", "t": 1, "q": "新型电力系统中，储能电站因电池故障导致的损失，最可能由下列哪种保险承保（　）", "a": ["火灾保险", "电池专项保险", "货物运输险", "职业责任险", "", ""], "r": "B", "e": "题目说的是储能电站电池故障导致的损失，电池专项保险就是专门针对电池相关风险和损失的保险。而火灾保险主要保火灾相关损失；货物运输险保货物运输途中风险；职业责任险保职业人员因工作失误等造成损失。所以选电池专项保险合适。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387008", "t": 1, "q": "某企业为其生产的设备投保财产综合险，在保险期限内，设备因雷击导致短路起火受损，同时引发车间其他设备被烟熏损坏，该事故中导致损失的近因是", "a": ["雷击", "短路", "火灾", "烟熏", "", ""], "r": "A", "e": "近因是指在风险和损失之间，导致损失的最直接、最有效、起决定作用的原因。本题中雷击引发短路起火，进而导致其他设备受损，雷击是最初的、起决定性作用的因素。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387009", "t": 1, "q": "保险市场中，负责对保险条款和保险费率进行审批或备案的监管机构是", "a": ["中国人民银行", "中国银行保险监督管理委员会", "中国证券监督管理委员会", "国家市场监督管理总局", "", ""], "r": "B", "e": "中国银行保险监督管理委员会负责对保险市场进行监管，包括审批或备案保险条款和费率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387010", "t": 1, "q": "社会保险的基本原则不包括", "a": ["强制性", "自愿性", "公平性", "互济性", "", ""], "r": "B", "e": "社会保险具有强制性、公平性、互济性等特点，是国家强制实施的保障制度，并非自愿参加。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387011", "t": 1, "q": "保险法规定，人寿保险的被保险人或者受益人向保险人请求给付保险金的诉讼时效期间为", "a": ["1年", "2年", "3年", "5年", "", ""], "r": "D", "e": "依据保险法，人寿保险被保险人或受益人请求给付保险金诉讼时效是5年。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387012", "t": 1, "q": "下列关于保险最大诚信原则中告知义务的表述，错误的是", "a": ["投保人需主动告知与保险标的相关的重要事实", "保险人需向投保人说明保险合同的条款内容", "投保人未履行告知义务的，保险人一律解除合同", "保险人未履行说明义务的，免责条款不生效", "", ""], "r": "C", "e": "投保人未履行告知义务，保险人并非一律解除合同，只有在符合法定情形时才可行使解除权，C选项说法太绝对。A是投保人告知义务体现；B是保险人说明义务体现；D符合法律规定。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387013", "t": 1, "q": "电力企业海外投资中，因投资所在国汇率波动导致的损失，属于（　）", "a": ["政治风险", "商业风险", "操作风险", "信用风险", "", ""], "r": "B", "e": "本题主要考查各类风险的区分。汇率波动属于企业在商业运营中面临的市场因素，由市场因素带来的风险归为商业风险。所以因投资所在国汇率波动导致的损失，属于商业风险。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387014", "t": 1, "q": "新型电力系统中，分布式光伏电站保险的承保重点是", "a": ["光伏组件的盗窃风险", "光伏组件的冰雹、雷击风险", "光伏电站的政策变更风险", "光伏电站的市场价格波动风险", "", ""], "r": "B", "e": "分布式光伏电站多处于户外，光伏组件易受自然灾害影响，冰雹、雷击会对其造成直接损坏，是承保重点。盗窃风险概率相对低；政策变更和市场价格波动不属于保险常规承保的物质损失风险范畴。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387015", "t": 1, "q": "近因原则中，近因是指（　）", "a": ["时间上最接近损失的原因", "空间上最接近损失的原因", "造成损失的最直接、最有效、起决定作用的原因", "造成损失的第一个原因", "", ""], "r": "C", "e": "近因并非指时间或空间上接近损失的原因，也不是造成损失的第一个原因，而是造成损失的最直接、最有效、起决定作用的原因。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387016", "t": 1, "q": "下列机构中，不属于保险市场中介机构的是", "a": ["保险代理人", "保险经纪人", "保险公司", "保险公估人", "", ""], "r": "C", "e": "保险市场中介机构是连接保险人和投保人的中间组织，保险代理人、保险经纪人、保险公估人都属于此类。而保险公司是直接提供保险服务的主体，并非中介。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387017", "t": 1, "q": "下列关于最大诚信原则中告知义务的表述，错误的是", "a": ["投保人需如实告知与保险标的有关的重要事实", "保险人需如实说明保险合同条款内容", "投保人未履行告知义务仅导致保险合同无效", "保险人未履行说明义务可能导致免责条款无效", "", ""], "r": "C", "e": "投保人未履行告知义务，后果不只是保险合同无效，还可能使保险人不承担赔偿或给付保险金责任等。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387018", "t": 1, "q": "保险理赔中，保险人收到被保险人或者受益人的赔偿或者给付保险金的请求后，应当及时作出核定;情形复杂的，应当在一定期限内作出核定，该期限是（　）", "a": ["30日", "60日", "90日", "180日", "", ""], "r": "A", "e": "法律规定保险人对于复杂情形应在30日内作出核定，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387019", "t": 1, "q": "电力企业海外投资保险中，承保因投资所在国政府采取国有化、征收等措施导致投资损失的是", "a": ["征收风险保险", "战争风险保险", "汇兑限制风险保险", "违约风险保险", "", ""], "r": "A", "e": "题干明确提到因所在国政府采取国有化、征收等措施致投资损失，对应征收风险保险。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387020", "t": 1, "q": "保险合同的解释原则中，不利于保险人的解释原则适用于（　）", "a": ["保险合同条款模糊不清时", "保险合同条款明确具体时", "投保人对条款有异议时", "保险人对条款有异议时", "", ""], "r": "A", "e": "当保险合同条款模糊不清，双方理解有分歧时，为保护投保人利益，采用不利于保险人的解释原则。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387021", "t": 1, "q": "下列不属于人身保险合同特有条款的是", "a": ["不可抗辩条款", "宽限期条款", "代位求偿条款", "复效条款", "", ""], "r": "C", "e": "代位求偿条款是财产保险合同中的重要原则，目的是防止被保险人获得双重赔偿，而不可抗辩、宽限期、复效条款是人身保险合同特有的。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387022", "t": 1, "q": "根据我国保险法规定，保险合同成立的时间是", "a": ["投保人提出投保申请时", "保险人同意承保时", "保险单签发时", "投保人缴纳保险费时", "", ""], "r": "B", "e": "《保险法》规定，投保人提出保险要求，经保险人同意承保，保险合同成立。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387023", "t": 1, "q": "电力企业海外投资保险中，承保因投资所在国发生战争、革命等政治风险导致投资损失的保险是", "a": ["海外工程保险", "海外投资政治风险保险", "海外责任保险", "海外信用保险", "", ""], "r": "B", "e": "题干明确提到承保政治风险导致投资损失，海外投资政治风险保险就是针对这类政治风险进行保障的。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387024", "t": 1, "q": "保险利益原则要求，投保人对保险标的的保险利益必须具备的特征不包括", "a": ["合法性", "经济性", "确定性", "公开性", "", ""], "r": "D", "e": "保险利益需合法、能带来经济价值且确定。公开性并非保险利益必须具备特征。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387025", "t": 1, "q": "下列选项中，属于财产保险特有条款的是", "a": ["受益人条款", "宽限期条款", "重复保险分摊条款", "不可抗辩条款", "", ""], "r": "C", "e": "财产保险中可能存在重复投保情况，所以有重复保险分摊条款。受益人、宽限期、不可抗辩条款多在人身保险中。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387026", "t": 1, "q": "在保险基本原则中，要求投保人在订立保险合同时对保险标的具有保险利益的原则是", "a": ["最大诚信原则", "保险利益原则", "近因原则", "损失补偿原则", "", ""], "r": "B", "e": "保险利益原则规定投保人在订立保险合同时要对保险标的具有保险利益。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387027", "t": 1, "q": "新型电力系统中，特高压输电线路因雷击造成的设备损坏，属于下列哪种风险类型（　）", "a": ["自然风险", "人为风险", "操作风险", "信用风险", "", ""], "r": "A", "e": "雷击是自然现象，因雷击造成特高压输电线路设备损坏属于自然风险。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387028", "t": 1, "q": "下列关于损失补偿原则的例外情况，表述正确的是", "a": ["人身保险不适用损失补偿原则", "定值保险不适用损失补偿原则", "重置价值保险不适用损失补偿原则", "比例保险不适用损失补偿原则", "", ""], "r": "A", "e": "损失补偿原则的例外情况包括人身保险、定值保险、重置价值保险等。人身保险的标的是人的生命或身体，无法用货币衡量损失，不适用损失补偿；定值保险按约定价值赔付，不考虑实际损失；重置价值保险按重置成本赔偿，也突破了实际损失限制。比例保险是损失补偿原则下确定赔偿金额的方式，适用损失补偿原则。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818585817387029", "t": 1, "q": "人身保险中，以被保险人死亡为给付保险金条件的合同，自合同成立或者合同效力恢复之日起一定期限内，被保险人自杀的，保险人不承担给付保险金责任，该期限是（　）", "a": ["1年", "2年", "3年", "5年", "", ""], "r": "B", "e": "在人身保险里，以被保险人死亡为给付条件的合同，自合同成立或效力恢复起2年内被保险人自杀，保险人不承担给付责任。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033280", "t": 2, "q": "财产保险的保险标的包括（　）", "a": ["有形财产", "无形财产", "相关利益", "人的生命和身体", "", ""], "r": "ABC", "e": "财产保险是以财产及其相关利益为保险标的，财产包括有形财产和无形财产。人的生命和身体是人身保险的标的。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033281", "t": 2, "q": "新型电力系统中，新能源发电保险的保险责任包括", "a": ["设备本身的自然磨损", "雷击、暴雨等自然灾害造成的损失", "人为操作失误造成的设备损坏", "战争、军事冲突造成的损失", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033282", "t": 2, "q": "电力企业海外投资保险的作用包括", "a": ["保障海外投资安全", "降低政治风险损失", "促进海外电力项目投资", "替代商业保险的所有保障", "", ""], "r": "ABC", "e": "电力企业海外投资面临政治等风险，海外投资保险可保障投资安全、降低政治风险损失，进而促进海外电力项目投资，但它不能替代商业保险所有保障。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033283", "t": 2, "q": "下列关于电力储能保险的说法中，正确的有", "a": ["保障储能设备的财产损失", "保障储能运营过程中的责任风险", "保障储能设备的自然损耗", "保障储能项目的运营中断损失", "", ""], "r": "ABD", "e": "电力储能保险主要是针对意外等情况提供保障，财产损失、运营责任风险、运营中断损失都可能因意外等产生，属于保险可保范围；而自然损耗是正常现象，不在保险保障范畴。所以答案选ABD。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033284", "t": 2, "q": "保险数理基础中，风险的构成要素包括", "a": ["风险因素", "风险事故", "风险损失", "风险概率", "", ""], "r": "ABC", "e": "风险由风险因素、风险事故和风险损失构成。风险概率并非构成要素。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033285", "t": 2, "q": "保险理赔的流程包括", "a": ["报案受理", "现场查勘与定损", "责任认定", "赔款计算与支付", "", ""], "r": "ABCD", "e": "保险理赔基本流程就是先报案受理，接着现场查勘与定损，然后进行责任认定，最后赔款计算与支付。ABCD选项均为保险理赔流程环节。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033286", "t": 2, "q": "下列财产保险中，采用定值保险方式的有", "a": ["货物运输保险", "船舶保险", "企业财产保险", "家庭财产保险", "", ""], "r": "AB", "e": "定值保险适用于价值难以确定或易受市场价格波动影响的标的，货物运输保险和船舶保险的价值在保险合同订立时较难准确预估且风险特殊，常采用定值保险。企业和家庭财产保险一般采用不定值保险。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033287", "t": 2, "q": "保险监管的核心内容包括（　）", "a": ["市场准入监管", "业务经营监管", "偿付能力监管", "市场退出监管", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033288", "t": 2, "q": "健康保险的保险责任包括", "a": ["疾病给付", "医疗费用给付", "伤残给付", "死亡给付", "", ""], "r": "AB", "e": "健康保险是以被保险人的身体为保险标的，对被保险人因疾病或意外事故所致伤害时发生的直接费用和间接损失进行补偿的一种人身保险，主要包括疾病给付和医疗费用给付。伤残给付和死亡给付通常是人寿保险或意外伤害保险范畴。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033289", "t": 2, "q": "下列选项中，属于保险合同无效的情形有", "a": ["投保人对保险标的无保险利益", "保险合同违反法律、行政法规强制性规定", "保险合同显失公平", "保险人未履行说明义务", "", ""], "r": "AB", "e": "保险利益是保险合同生效的前提，无保险利益合同无效；违反法律、行政法规强制性规定的合同当然无效。显失公平可撤销而非无效；保险人未履行说明义务一般影响条款效力而非整个合同无效。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033290", "t": 2, "q": "保险的社会管理职能主要体现在", "a": ["社会保障管理", "社会风险管理", "社会关系管理", "社会信用管理", "", ""], "r": "ABCD", "e": "保险社会管理职能涵盖多方面，社会保障管理可补充社保；社会风险管理能降低风险损害；社会关系管理利于化解矛盾；社会信用管理可增强信用。ABCD四个选项均体现保险的社会管理职能。 答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033291", "t": 2, "q": "保险合同的主体包括", "a": ["投保人", "保险人", "被保险人", "受益人", "", ""], "r": "ABCD", "e": "保险合同主体指参与保险合同订立、履行等的相关方，投保人是与保险人订立合同并付保费的人；保险人是承担赔偿或给付责任的保险公司；被保险人是其财产或人身受合同保障的人；受益人是享有保险金请求权的人，ABCD 都是保险合同主体。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033292", "t": 2, "q": "社会保险中的失业保险，其保障内容包括", "a": ["失业保险金给付", "医疗补助金给付", "丧葬补助金给付", "职业培训补贴", "", ""], "r": "ABCD", "e": "失业保险保障内容有失业保险金给付、医疗补助金、丧葬补助金、职业培训补贴等。ABCD都属于其保障内容。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033293", "t": 2, "q": "电力企业海外投资保险中，投保人与保险人签订保险合同前，需向保险人提供的材料包括", "a": ["海外投资项目审批文件", "投资项目财务预算报告", "投资所在国政治经济环境分析报告", "保险标的价值评估报告", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033294", "t": 2, "q": "保险市场的构成要素包括", "a": ["保险供给方", "保险需求方", "保险中介方", "保险监管方", "", ""], "r": "ABCD", "e": "保险市场由保险供给方、需求方、中介方和监管方构成，四方在保险市场中发挥不同作用，共同促进保险市场的运行和发展。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033295", "t": 2, "q": "下列关于保险利益的构成要件，说法正确的有", "a": ["保险利益必须是合法的利益", "保险利益必须是确定的利益", "保险利益必须是经济上的利益", "保险利益必须是具有利害关系的利益", "", ""], "r": "ABCD", "e": "保险利益需同时满足合法、确定、经济上可衡量以及与保险标的有利害关系。ABCD四个选项分别对应这几个构成要件。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033296", "t": 2, "q": "保险合同的解释原则包括", "a": ["文义解释原则", "意图解释原则", "有利于被保险人解释原则", "专业解释原则", "", ""], "r": "ABCD", "e": "保险合同解释原则常见有文义、意图、有利于被保险人、专业等解释原则。ABCD选项均符合保险合同解释原则范畴。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033297", "t": 2, "q": "保险经纪人的主要职责包括", "a": ["为投保人提供投保咨询", "代表投保人洽谈保险合同", "承担保险赔付责任", "协助被保险人办理理赔", "", ""], "r": "ABD", "e": "保险经纪人是基于投保人利益，为其提供服务，可提供投保咨询、代表洽谈合同、协助理赔等，而承担保险赔付责任是保险公司的事。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033298", "t": 2, "q": "损失补偿原则的限制条件包括", "a": ["以保险利益为限", "以实际损失为限", "以保险金额为限", "以保险费为限", "", ""], "r": "ABC", "e": "损失补偿原则是指当被保险人因保险事故遭受损失时，保险人在其责任范围内对被保险人所遭受的实际损失进行补偿。其限制条件有以保险利益为限，即补偿不能超过被保险人对保险标的所具有的保险利益；以实际损失为限，补偿金额不能超过实际损失；以保险金额为限，保险金额是保险人承担赔偿或给付责任的最高限额。而保险费是投保人向保险人支付的费用，与补偿额度无关。所以答案选ABC。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033299", "t": 2, "q": "保险合同的书面形式包括", "a": ["保险单", "保险凭证", "暂保单", "投保单", "", ""], "r": "ABCD", "e": "保险单、保险凭证、暂保单、投保单都是保险合同常见书面形式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033300", "t": 2, "q": "电力企业海外投资保险的投保流程包括（　）", "a": ["投保申请", "风险评估", "保险合同签订", "保险费缴纳", "", ""], "r": "ABCD", "e": "电力企业海外投资保险投保，首先要提出投保申请，接着保险公司进行风险评估，之后双方签订保险合同，最后投保人缴纳保险费，这是完整的投保流程环节。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033301", "t": 2, "q": "社会保险的主要项目包括", "a": ["养老保险", "医疗保险", "失业保险", "工伤保险", "", ""], "r": "ABCD", "e": "社会保险主要项目涵盖养老、医疗、失业、工伤和生育保险。本题ABCD选项所涉及的养老保险、医疗保险、失业保险、工伤保险均属于社会保险主要项目。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033302", "t": 2, "q": "新型电力系统中，可投保的保险标的包括", "a": ["光伏电站设备", "风电发电机组", "储能电池组", "电力输送线路", "", ""], "r": "ABCD", "e": "新型电力系统包含发电、储能、输电等环节，光伏电站设备、风电发电机组、储能电池组、电力输送线路都是其中重要组成部分且具备可保性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033303", "t": 2, "q": "近因原则在保险理赔中的应用包括", "a": ["判断损失的直接原因", "判断损失的间接原因", "确定保险人是否承担赔付责任", "确定赔付金额大小", "", ""], "r": "AC", "e": "近因原则主要是找出导致损失的直接、有效、起决定性作用的原因，以此判断保险人是否承担赔付责任。B选项间接原因不是近因原则关注重点；D选项赔付金额大小与近因原则本身关联不大。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033304", "t": 2, "q": "财产保险的主要险种包括", "a": ["企业财产保险", "机动车辆保险", "人寿保险", "家庭财产保险", "", ""], "r": "ABD", "e": "财产保险是以财产及其有关利益为保险标的，A企业财产保险、B机动车辆保险、D家庭财产保险都属于财产保险范畴；而C人寿保险是以人的寿命和身体为保险标的，属于人身保险。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033305", "t": 2, "q": "新型电力系统保险的风险特点包括（　）", "a": ["风险集中度高", "技术关联性强", "损失影响范围广", "风险可预见性强", "", ""], "r": "ABC", "e": "新型电力系统结构复杂、技术集成度高，故障易集中爆发，风险集中；新技术应用多，技术关联性强；一旦受损会影响多领域，损失影响范围广。而新型电力系统受多种不确定因素影响，风险可预见性不强。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033306", "t": 2, "q": "电力企业海外投资保险的承保风险包括", "a": ["政治风险", "商业风险", "自然风险", "操作风险", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033307", "t": 2, "q": "人身保险合同中，受益人享有的权利包括（　）", "a": ["保险金请求权", "变更受益人的权利", "放弃受益权的权利", "转让受益权的权利", "", ""], "r": "AC", "e": "受益人主要权利是保险金请求权，也能放弃受益权。变更受益人是被保险人或投保人权利，人身保险受益权一般不可转让。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033308", "t": 2, "q": "人身保险合同的特点包括", "a": ["定额给付性", "储蓄性", "长期性", "补偿性", "", ""], "r": "ABC", "e": "人身保险合同中，人的生命和健康难以用货币衡量，所以多是定额给付，且具有储蓄功能，很多是长期合同。而补偿性一般是财产保险合同特点，人身保险不是补偿。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033309", "t": 2, "q": "保险的基本原则包括", "a": ["最大诚信原则", "保险利益原则", "近因原则", "损失补偿原则", "", ""], "r": "ABCD", "e": "保险四个基本原则为最大诚信原则、保险利益原则、近因原则、损失补偿原则。答案全选。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033310", "t": 2, "q": "保险费率的构成包括", "a": ["纯费率", "附加费率", "管理费率", "销售费率", "", ""], "r": "AB", "e": "保险费率由纯费率和附加费率构成。纯费率用于支付保险赔偿或给付，附加费率用于弥补保险公司经营费用等支出。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033311", "t": 2, "q": "保险的派生职能包括", "a": ["防灾防损职能", "融资职能", "补偿损失职能", "分散风险职能", "", ""], "r": "AB", "e": "保险基本职能是分散风险和补偿损失，派生职能是在此基础上衍生的。防灾防损利于减少损失，融资能让保险资金有效利用，它们是派生职能。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033312", "t": 2, "q": "新型电力系统保险的保障范围通常包括", "a": ["光伏电站设备损失", "风电项目运营中断损失", "特高压输电线路故障损失", "电力用户用电中断损失", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033313", "t": 2, "q": "下列属于财产保险中特约可保财产的有", "a": ["金银珠宝", "铁路、桥梁", "土地、矿藏", "古币、字画", "", ""], "r": "ABD", "e": "特约可保财产一般价值高、风险较特别需双方特约。A金银珠宝、D古币字画价值高且需特殊约定；B铁路、桥梁价值大也属特约范畴；而C土地、矿藏所有权归国家，不能作为财产保险标的。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818587256033314", "t": 2, "q": "电力企业海外投资保险承保的政治风险包括", "a": ["征收风险", "战争风险", "汇兑限制风险", "市场价格波动风险", "", ""], "r": "ABC", "e": "政治风险一般源于政治因素，征收、战争、汇兑限制都和政治相关。而市场价格波动风险是市场因素导致，并非政治风险。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438400", "t": 3, "q": "财产保险中，保险标的的保险价值可以由保险人单方面确定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "财产保险中，保险标的的保险价值由投保人和保险人在合同中约定，并非可由保险人单方面确定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438401", "t": 3, "q": "工伤保险由用人单位和劳动者共同缴纳保险费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工伤保险由用人单位缴纳保险费，劳动者无需缴纳。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438402", "t": 3, "q": "保险法是调整保险关系的一切法律规范的总称。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险法就是用于调整保险关系的各类法律规范的统称。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438403", "t": 3, "q": "保险责任是指保险人按照合同约定应当承担的赔偿或给付保险金的责任。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险责任就是保险合同里保险人需按约定承担赔偿或给付保险金的责任。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438404", "t": 3, "q": "损失补偿原则要求被保险人获得的赔偿金额不得超过其实际遭受的损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "损失补偿原则的核心就是让被保险人在保险事故发生后，获得的赔偿以弥补其实际损失为限，不能因保险赔偿获利，所以被保险人获得的赔偿金额不得超过其实际遭受的损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438405", "t": 3, "q": "保险金额是保险标的的实际价值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险金额是投保人对保险标的的实际投保金额，是保险人承担赔偿或给付责任的最高限额，并非保险标的实际价值。", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438406", "t": 3, "q": "人身保险合同中，不可抗辩条款适用于所有险种。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不可抗辩条款并非适用于人身保险所有险种，如短期意外险等通常不适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438407", "t": 3, "q": "新型电力系统保险需要适应新能源发电的间歇性特征。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "新能源发电具有间歇性特点，如风力发电受风力大小影响、光伏发电受光照条件影响等，这会给电力系统带来诸多不确定性和风险。新型电力系统保险要保障电力系统稳定运行，就必须适应新能源发电的间歇性特征。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438408", "t": 3, "q": "电力企业海外投资保险中，汇兑限制风险是指投资所在国货币贬值导致的损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。汇兑限制风险主要是指投资所在国政府采取措施限制投资者将投资收益等资金兑换成外币并汇出该国，而非单纯指货币贬值导致的损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438409", "t": 3, "q": "保险合同的成立与生效是同一概念。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同成立指双方就合同内容达成一致，而生效是指合同产生法律约束力，二者条件和时间可能不同，并非同一概念。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438410", "t": 3, "q": "风险大量原则是指保险人应承保尽可能多的风险单位。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "风险大量原则要求保险人承保尽可能多的风险单位，这样能使实际损失更接近预期损失，增强保险经营稳定性。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438411", "t": 3, "q": "保险法规定，保险人收到理赔请求后，应在30日内作出核定并赔付保险金。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险人收到理赔请求后，应在30日内作出核定，但不一定马上赔付，对属于保险责任的，在与被保险人或受益人达成赔偿或给付保险金协议后10日内履行赔偿或给付义务。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438412", "t": 3, "q": "人身保险合同中，被保险人必须是自然人。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "人身保险是以人的寿命和身体为保险标的，只有自然人具有寿命和身体，所以被保险人必须是自然人。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438413", "t": 3, "q": "社会保险的资金来源仅包括用人单位和职工的缴费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "社会保险资金来源除用人单位和职工缴费外，还有政府补贴等其他渠道。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438414", "t": 3, "q": "人身保险合同中，受益人可以是投保人本人。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "人身保险合同中，受益人可以是投保人、被保险人，也可以是经被保险人同意的其他人。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438415", "t": 3, "q": "保险合同成立后，保险人不得解除保险合同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般情况下，保险合同成立后保险人不得随意解除合同，但在法定情形下，如投保人故意或重大过失未履行如实告知义务等，保险人有权解除合同。所以题干表述过于绝对。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438416", "t": 3, "q": "财产保险的保险金额不得超过保险价值，超过部分无效。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据保险原理和相关规定，财产保险遵循损失补偿原则，保险金额超过保险价值会使被保险人获得额外利益，违背该原则，所以超过部分无效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438417", "t": 3, "q": "责任保险的保险标的是被保险人对第三者依法应承担的赔偿责任。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "责任保险就是以被保险人对第三者依法应负的赔偿责任为保险标的的保险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438418", "t": 3, "q": "近因原则适用于所有保险合同，包括财产保险和人身保险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "近因原则是保险理赔中判定保险责任的重要原则，广泛应用于财产保险和人身保险等各类保险合同，以确定保险事故与损失之间的因果关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438419", "t": 3, "q": "保险合同的解释应当有利于保险人。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同是格式合同，为保护处于相对弱势的投保人、被保险人利益，其解释应遵循有利于被保险人和受益人的原则，而非有利于保险人。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438420", "t": 3, "q": "重复保险是指投保人对同一保险标的、同一保险利益、同一保险事故分别与两个以上保险人订立保险合同，且保险金额总和超过保险标的实际价值的保险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是重复保险的正确定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438421", "t": 3, "q": "损失补偿原则适用于所有保险合同，包括人身保险合同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "损失补偿原则主要适用于财产保险，目的是弥补被保险人的实际损失。而人身保险的标的是人的生命和身体，其价值无法用金钱精确衡量，不存在实际损失的补偿，更多是按约定给付保险金。所以损失补偿原则并不适用于所有保险合同，该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438422", "t": 3, "q": "保险数理基础中的大数法则要求投保人数越多，保险经营的稳定性越差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。大数法则是指在随机现象的大量重复中往往出现几乎必然的规律，投保人数越多，实际损失结果就越接近预期损失结果，保险经营也就越稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438423", "t": 3, "q": "保险监管的核心是偿付能力监管。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "偿付能力关乎保险公司能否履行赔偿或给付责任，直接影响保险市场稳定和投保人权益，所以是保险监管核心。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438424", "t": 3, "q": "社会保险的保障范围覆盖全体公民。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "社会保险主要包括养老保险、医疗保险、失业保险、工伤保险和生育保险，并非覆盖全体公民，比如未就业且未参保的公民就不在保障范围内。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438425", "t": 3, "q": "新型电力系统中的储能保险不保障运营中断造成的间接损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "新型电力系统中的储能保险有可能保障运营中断造成的间接损失，并非绝对不保障。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438426", "t": 3, "q": "最大诚信原则仅要求投保人履行如实告知义务，保险人无需履行说明义务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "最大诚信原则要求投保人和保险人都要遵循诚信。投保人需如实告知，保险人也有向投保人说明保险合同条款内容等义务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438427", "t": 3, "q": "社会保险的资金来源仅包括用人单位和个人缴费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "社会保险资金来源除用人单位和个人缴费外，还有政府补贴等其他渠道。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438428", "t": 3, "q": "财产保险的保险金额可以超过保险标的的实际价值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "财产保险中，保险金额不得超过保险标的实际价值，超过部分无效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438429", "t": 3, "q": "工伤保险实行过错责任原则，职工因自身过错导致工伤的，不享受工伤保险待遇。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。工伤保险实行无过错责任原则，即无论职工是否有过错，只要符合工伤认定条件，就可享受工伤保险待遇。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438430", "t": 3, "q": "财产保险中，重复保险的各保险人赔偿保险金的总和不得超过保险价值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "财险中重复保险时，若各保险人赔偿总和超过保险价值，可能导致被保险人不当获利，为防止这种情况，规定各保险人赔偿保险金的总和不得超过保险价值，所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438431", "t": 3, "q": "投保人对保险标的不具有保险利益的，保险合同无效。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险利益原则是保险的基本原则之一，投保人对保险标的具有保险利益是保险合同生效的重要条件，缺乏保险利益，合同就不具有法律效力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438432", "t": 3, "q": "损失补偿原则适用于所有保险合同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "损失补偿原则主要适用于财产保险合同，人身保险合同大多不适用，因为人的生命和身体无法用金钱衡量损失并进行补偿。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438433", "t": 3, "q": "保险合同的变更无需征得保险人同意，投保人单方即可变更。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同变更大多需要征得保险人同意，不能由投保人单方随意变更。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438434", "t": 3, "q": "社会保险中的工伤保险仅由用人单位缴纳保险费，职工个人无需缴费。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工伤保险是为保障职工在工作中遭受事故伤害或患职业病时能获得医疗救治和经济补偿等，国家规定由用人单位缴纳保险费，职工个人不缴费。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438435", "t": 3, "q": "财产保险的保险金额可以超过保险标的的实际价值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "财产保险中，保险金额不得超过保险标的实际价值，超过部分无效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438436", "t": 3, "q": "投保人故意不履行如实告知义务的，保险人对于合同解除前发生的保险事故，不承担赔偿或者给付保险金的责任，并不退还保险费。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据保险法规定，投保人故意不履行如实告知义务，保险人对合同解除前事故不担责且不退保费。", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438437", "t": 3, "q": "保险的基本职能包括资金融通和社会管理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险基本职能是经济补偿和保险金给付，资金融通和社会管理是保险派生职能。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438438", "t": 3, "q": "保险理赔的核心是确定保险责任和赔付金额。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险理赔时，首要就是确定保险事故是否在保险责任范围内，然后根据保险合同等确定具体赔付金额，这二者是核心环节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438439", "t": 3, "q": "新型电力系统中，光伏电站的保险责任包括组件衰减导致的发电量损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438440", "t": 3, "q": "保险合同的书面形式仅包括保险单。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同书面形式除保险单外，还有保险凭证、暂保单等。所以题干说仅包括保险单错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438441", "t": 3, "q": "财产保险合同中，保险标的的保险价值可以在合同订立时确定，也可以在保险事故发生时确定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "财产保险合同中，保险价值的确定方式灵活，既能够在合同订立时确定，也可在保险事故发生时确定。", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438442", "t": 3, "q": "近因原则中，若多种原因连续发生导致损失，且前因是保险风险，后因是除外风险，则保险人应承担赔偿责任。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "近因原则下，多种原因连续发生致损，前因是保险风险、后因是除外风险时，前因是近因，保险风险作为近因，保险人需担赔偿责任。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438443", "t": 3, "q": "人身保险合同中，被保险人变更无需通知保险人。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人身保险合同中，被保险人的变更属于重要事项变动，通常需通知保险人，否则可能影响合同效力和保险人权益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818588430438444", "t": 3, "q": "保险的基本职能是资金融通和社会管理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险基本职能是经济补偿和保险金给付，资金融通和社会管理是派生职能。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 保险学（2）", "n": "基础练习题【含解析】 / 第5章 保险学（2）", "qs": [{"id": "2034818590758277120", "t": 1, "q": "保险理赔中，判断风险事故与保险标的损失之间因果关系的基本原则是", "a": ["损失补偿原则", "近因原则", "保险利益原则", "最大诚信原则", "", ""], "r": "B", "e": "近因原则用于判断风险事故与保险标的损失之间的因果关系，是保险理赔的重要原则。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277121", "t": 1, "q": "社会保险中，无需个人缴纳保险费的险种是", "a": ["养老保险", "医疗保险", "工伤保险", "失业保险", "", ""], "r": "C", "e": "工伤保险由用人单位缴纳，职工不缴纳。而养老、医疗、失业保险个人都需缴费。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277122", "t": 1, "q": "人身保险中，投保人变更受益人时，应当（　）", "a": ["书面通知保险人", "口头通知保险人", "经受益人同意", "经被保险人同意", "", ""], "r": "A", "e": "在人身保险里，投保人变更受益人需书面通知保险人，这样能有书面记录保障各方权益。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277123", "t": 1, "q": "新型电力系统中，针对风电、光伏等新能源项目的发电出力波动风险，最适合的保险产品是（　）", "a": ["财产一切险", "机器损坏险", "发电量损失保险", "公众责任险", "", ""], "r": "C", "e": "风电、光伏等新能源项目发电出力波动会导致发电量变化，发电量损失保险可应对这种风险。财产一切险保财产损失，机器损坏险保机器故障，公众责任险保第三方人身财产损失，均与发电出力波动风险关系不大。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277124", "t": 1, "q": "保险理赔中，保险人收到被保险人或者受益人的赔偿或者给付保险金的请求后，应当及时作出核定;情形复杂的，应当在一定期限内作出核定，该期限是", "a": ["30日内", "60日内", "90日内", "180日内", "", ""], "r": "A", "e": "法律规定保险人在收到请求后，情形复杂的应在30日内作出核定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277125", "t": 1, "q": "保险合同中，投保人对保险标的必须具有的法律上承认的利益被称为（　）", "a": ["保险价值", "保险利益", "保险金额", "保险责任", "", ""], "r": "B", "e": "保险利益是投保人对保险标的具有的法律上承认的利益。保险价值是保险标的价值，保险金额是赔偿最高限额，保险责任是保险公司承担的风险范围。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277126", "t": 1, "q": "下列关于新型电力系统保险的说法，错误的是", "a": ["承保范围包括新能源发电设备故障风险", "不涵盖电力系统储能设施的安全风险", "需适应新能源发电的间歇性特征", "涉及电网并网运行相关风险保障", "", ""], "r": "B", "e": "新型电力系统保险应全面保障电力系统各环节，电力系统储能设施是新型电力系统重要组成部分，其安全风险也在保险涵盖范围内，B选项说法错误。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277127", "t": 1, "q": "保险理赔管理中，\"确定保险责任\"环节的核心是判断", "a": ["保险合同是否有效", "损失是否属于保险责任范围", "被保险人是否履行通知义务", "理赔材料是否齐全", "", ""], "r": "B", "e": "确定保险责任就是要明确发生的损失是否在保险合同约定的保险责任范围内，这是该环节核心。A保险合同有效性是前提但非核心；C被保险人通知义务与确定保险责任核心关联不大；D理赔材料齐全是后续环节需考虑。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277128", "t": 1, "q": "下列社会保险项目中，不需要职工个人缴纳保险费的是（　）", "a": ["养老保险", "工伤保险", "医疗保险", "失业保险", "", ""], "r": "B", "e": "工伤保险由用人单位缴纳，职工无需缴纳保险费。而养老、医疗、失业保险职工都需缴费。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277129", "t": 1, "q": "保险合同中，投保人未履行如实告知义务，保险人有权解除合同的期限，自保险人知道有解除事由之日起计算，不得超过", "a": ["30日", "60日", "1年", "2年", "", ""], "r": "A", "e": "法律规定投保人未履行如实告知义务，保险人自知道解除事由起，解除权行使期限不超30日。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277130", "t": 1, "q": "下列属于保险合同辅助人的是", "a": ["投保人", "保险人", "保险经纪人", "被保险人", "", ""], "r": "C", "e": "保险合同辅助人包括保险代理人、保险经纪人和保险公估人等。投保人、保险人、被保险人是保险合同的当事人。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277131", "t": 1, "q": "下列不属于人身保险合同特点的是（　）", "a": ["定额给付性", "长期性", "储蓄性", "补偿性", "", ""], "r": "D", "e": "人身保险合同以人的生命或身体为保险标的，人的生命和身体价值难以用货币衡量，所以一般是定额给付，具有长期性和储蓄性。而补偿性是财产保险合同特点，财产损失可衡量，按实际损失补偿。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277132", "t": 1, "q": "在保险基本原则中，禁止被保险人通过保险获得额外利益的原则是", "a": ["最大诚信原则", "保险利益原则", "损失补偿原则", "近因原则", "", ""], "r": "C", "e": "损失补偿原则是指当被保险人发生损失时，通过保险人的补偿使被保险人的经济利益恢复到原来水平，禁止其通过保险获得额外利益。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277133", "t": 1, "q": "下列关于社会保险的说法中，错误的是", "a": ["社会保险具有强制性", "社会保险具有福利性", "社会保险由企业和个人自愿投保", "社会保险覆盖全社会劳动者", "", ""], "r": "C", "e": "社会保险是强制的，并非企业和个人自愿投保。A选项，强制性是社会保险的特点之一；B选项，它具有福利性质；D选项，覆盖全社会劳动者。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277134", "t": 1, "q": "下列关于保险市场中介的说法，错误的是（　）", "a": ["保险代理人代表保险人的利益", "保险经纪人代表投保人的利益", "保险公估人独立于保险人与投保人", "保险代理人只能为一家保险公司代理业务", "", ""], "r": "D", "e": "保险代理人有个人代理人、兼业代理人和专业代理人等，专业代理人等可以同时为多家保险公司代理业务，D说法错误。A、B、C表述均正确。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277135", "t": 1, "q": "下列选项中，属于保险基本职能的是", "a": ["防灾防损", "资金融通", "损失补偿", "社会管理", "", ""], "r": "C", "e": "保险基本职能是损失补偿和经济给付，选项中只有损失补偿符合。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277136", "t": 1, "q": "下列关于保险合同客体的说法中，正确的是", "a": ["保险合同的客体是保险标的", "保险合同的客体是保险利益", "保险合同的客体是保险金额", "保险合同的客体是保险责任", "", ""], "r": "B", "e": "保险合同的客体是投保人或被保险人对保险标的具有的法律上承认的利益，即保险利益。而保险标的是保险利益的载体，保险金额是赔偿的最高限额，保险责任是保险人承担的风险范围。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277137", "t": 1, "q": "下列保险险种中，属于财产保险的是", "a": ["养老保险", "医疗保险", "机动车辆保险", "人寿保险", "", ""], "r": "C", "e": "财产保险是以财产及其有关利益为保险标的，机动车辆属于财产，机动车辆保险是财产保险。而养老保险、医疗保险、人寿保险都以人的寿命和身体为保险标的，属于人身保险。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277138", "t": 1, "q": "下列属于商业保险与社会保险区别的是", "a": ["均以风险为承保对象", "商业保险具有营利性", "均具有强制性", "均由政府主导实施", "", ""], "r": "B", "e": "商业保险是保险公司以营利为目的经营的，社会保险是保障社会成员基本生活，不以营利为目的。A是二者共同点；社会保险有强制性，商业保险是自愿的，C错误；商业保险由保险公司主导，社会保险由政府主导，D错误。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277139", "t": 1, "q": "电力企业海外投资保险中，承保因投资所在国发生战争、革命等政治事件导致投资损失的险种是", "a": ["海外投资信用保险", "海外投资政治风险保险", "海外投资财产保险", "海外投资责任保险", "", ""], "r": "B", "e": "题目明确提到是因投资所在国发生战争、革命等政治事件导致投资损失，这类风险属于政治风险，对应的险种就是海外投资政治风险保险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277140", "t": 1, "q": "保险法中规定，保险人收到被保险人或者受益人的赔偿或者给付保险金的请求后，应当及时作出核定;情形复杂的，应当在一定期限内作出核定，该期限是", "a": ["30日", "60日", "90日", "180日", "", ""], "r": "A", "e": "保险法规定保险人在情形复杂时应在30日内作出核定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277141", "t": 1, "q": "下列关于新型电力系统保险中储能电站保险的承保范围，表述错误的是", "a": ["承保储能设备的物理损坏", "承保储能过程中的操作失误导致的损失", "不承保储能电池的自然衰减损失", "承保因电网故障导致的储能电站停运损失", "", ""], "r": "C", "e": "储能电站保险通常会承保设备物理损坏、操作失误损失、电网故障致停运损失等，而储能电池自然衰减是正常现象，一般不在承保范围内。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277142", "t": 1, "q": "下列关于人身保险中受益人指定的表述，正确的是", "a": ["受益人必须是投保人的近亲属", "受益人只能指定一人", "受益人可以是被保险人本人", "受益人变更无需通知保险人", "", ""], "r": "C", "e": "受益人可以是被保险人本人，C正确；受益人不必须是投保人近亲属，A错误；受益人可指定多人，B错误；受益人变更需通知保险人，D错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277143", "t": 1, "q": "财产保险中，保险标的的保险价值可以（　）", "a": ["由投保人和保险人约定并在合同中载明", "由保险人单方面确定", "由投保人单方面确定", "按照保险事故发生时的市场价格确定", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277144", "t": 1, "q": "财产保险中，重复保险的各保险人赔偿保险金的总和不得超过", "a": ["保险标的的实际价值", "保险金额的总和", "投保人的实际损失", "单个保险人的保险金额", "", ""], "r": "A", "e": "重复保险赔偿遵循损失补偿原则，各保险人赔偿总和不能超保险标的实际价值，避免被保险人不当得利。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277145", "t": 1, "q": "下列关于保险代理人的说法中，正确的是", "a": ["保险代理人以自己的名义从事保险代理活动", "保险代理人的代理行为后果由自己承担", "保险代理人只能为一家保险公司代理业务", "保险代理人在授权范围内开展代理活动，法律后果由保险人承担", "", ""], "r": "D", "e": "保险代理人是根据保险人的委托，在授权范围内开展代理活动，其法律后果由保险人承担。A项应以保险人名义；B项后果由保险人承担；C项个人代理人可为多家，公司代理可同时为多家财险代理等。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277146", "t": 1, "q": "某投保人投保人身意外伤害保险，保险期限内，被保险人因突发疾病死亡，保险人的正确处理方式是", "a": ["全额赔付保险金", "部分赔付保险金", "不赔付保险金", "按疾病死亡赔付保险金", "", ""], "r": "C", "e": "人身意外伤害保险的保险责任是因意外伤害导致的身故等情况，突发疾病死亡不属于意外伤害范畴。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277147", "t": 1, "q": "保险合同中，由保险人拟定、未经投保人协商的格式条款，若存在歧义，应当按照哪种方式解释", "a": ["有利于保险人", "有利于投保人", "按照通常理解", "按照法律直接规定", "", ""], "r": "B", "e": "保险合同格式条款由保险人拟定，为平衡双方利益，有歧义时应作有利于投保人的解释。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277148", "t": 1, "q": "下列关于保险合同射幸性的表述，正确的是", "a": ["仅投保人承担偶然风险", "保险人的赔付义务取决于约定保险事故是否发生", "保险合同成立即确定赔付金额", "射幸性仅存在于财产保险合同中", "", ""], "r": "B", "e": "保险合同射幸性指保险人的赔付义务取决于约定保险事故是否发生，具有不确定性。A选项双方都承担偶然风险；C选项赔付金额不是合同成立就确定；D选项射幸性存在于各类保险合同。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277149", "t": 1, "q": "下列社会保险险种中，实行个人缴费与统筹基金相结合模式的是", "a": ["工伤保险", "生育保险", "养老保险", "失业保险", "", ""], "r": "C", "e": "工伤保险和生育保险由用人单位缴费，个人不缴费；失业保险虽个人缴费，但不是个人缴费与统筹基金结合模式；养老保险实行个人缴费与统筹基金相结合。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277150", "t": 1, "q": "在保险基本原则中，要求保险人在订立保险合同时向投保人说明保险合同条款内容的是", "a": ["最大诚信原则", "保险利益原则", "损失补偿原则", "近因原则", "", ""], "r": "A", "e": "最大诚信原则要求保险人在订立合同时向投保人说明合同条款内容。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277151", "t": 1, "q": "下列关于保险经纪人的说法中，错误的是", "a": ["保险经纪人代表投保人的利益", "保险经纪人独立于保险公司", "保险经纪人可以向投保人收取佣金", "保险经纪人的行为后果由保险人承担", "", ""], "r": "D", "e": "保险经纪人代表投保人利益，独立于保险公司，可向投保人或保险人收取佣金，但保险经纪人行为后果由自己承担，并非保险人承担。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277152", "t": 1, "q": "下列选项中，不属于保险最大诚信原则具体内容的是", "a": ["告知", "保证", "弃权与禁止反言", "近因", "", ""], "r": "D", "e": "保险最大诚信原则包括告知、保证、弃权与禁止反言；近因是保险的另一个重要原则，并非最大诚信原则内容。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277153", "t": 1, "q": "财产保险中，保险标的因第三者的行为而遭受损失时，保险人在赔偿被保险人后，有权向第三者追偿的权利称为（　）", "a": ["代位求偿权", "损失补偿权", "保险金请求权", "优先受偿权", "", ""], "r": "A", "e": "保险人赔偿被保险人后向第三者追偿的权利就是代位求偿权。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818590758277154", "t": 1, "q": "社会保险基金的筹集模式中，以当期缴费收入满足当期支出需求的模式是", "a": ["现收现付制", "完全积累制", "部分积累制", "混合积累制", "", ""], "r": "A", "e": "现收现付制就是用当期缴费收入来满足当期支出需求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117696", "t": 2, "q": "下列财产保险险种中，属于综合险范畴的有", "a": ["企业财产综合险", "家庭财产综合险", "机动车辆第三者责任险", "货物运输综合险", "", ""], "r": "ABD", "e": "企业财产综合险、家庭财产综合险、货物运输综合险都涵盖多种风险保障，属于综合险。而机动车辆第三者责任险主要针对车辆事故中对第三方的责任赔偿，并非综合险范畴。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117697", "t": 2, "q": "保险法的基本原则包括", "a": ["自愿原则", "最大诚信原则", "公平原则", "守法原则", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117698", "t": 2, "q": "下列属于保险理赔中被保险人应履行的义务有（　）", "a": ["及时报案", "提供索赔单证", "协助保险人查勘定损", "不得放弃向第三者的追偿权", "", ""], "r": "ABCD", "e": "在保险理赔时，被保险人需及时报案让保险人知晓情况，提供索赔单证用于确定赔偿，协助查勘定损利于准确理赔，若放弃向第三者追偿权可能损害保险人利益，这四项都是被保险人应履行的义务。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117699", "t": 2, "q": "下列关于财产保险赔偿计算方式的有", "a": ["第一损失赔偿方式", "比例赔偿方式", "限额赔偿方式", "定值赔偿方式", "", ""], "r": "ABCD", "e": "财产保险赔偿计算方式常见的有第一损失赔偿方式、比例赔偿方式、限额赔偿方式和定值赔偿方式。ABCD四个选项均是财产保险赔偿计算方式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117700", "t": 2, "q": "保险合同的书面形式包括（　）", "a": ["保险单", "保险凭证", "暂保单", "投保单", "", ""], "r": "ABCD", "e": "保险单、保险凭证、暂保单、投保单都是保险合同常见书面形式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117701", "t": 2, "q": "保险市场的监管内容包括", "a": ["市场准入监管", "业务经营监管", "财务监管", "偿付能力监管", "", ""], "r": "ABCD", "e": "保险市场监管需从多方面进行，市场准入监管确保符合条件主体进入；业务经营监管规范业务开展；财务监管把控财务状况；偿付能力监管保障对保单的赔付能力，ABCD 都是监管内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117702", "t": 2, "q": "重复保险的分摊方式包括（　）", "a": ["比例责任制", "限额责任制", "顺序责任制", "全额责任制", "", ""], "r": "ABC", "e": "重复保险分摊方式有比例责任制、限额责任制和顺序责任制。全额责任制并非重复保险分摊方式。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117703", "t": 2, "q": "海外投资保险的承保机构包括", "a": ["商业保险公司", "专门的海外投资保险机构", "政府部门", "国际金融组织", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117704", "t": 2, "q": "社会保险的基本原则包括", "a": ["强制性原则", "公平性原则", "自愿性原则", "保障性原则", "", ""], "r": "ABD", "e": "社会保险具有强制性，是国家强制实施保障劳动者权益，同时要保障公平，让不同群体公平享受待遇，且以保障基本生活为目的。而自愿性并非其原则。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117705", "t": 2, "q": "人身保险中，保险金的给付方式包括", "a": ["一次性给付", "分期给付", "定额给付", "比例给付", "", ""], "r": "ABCD", "e": "人身保险保险金给付方式有一次性把保险金给受益人，也可按约定分期给；定额给付是人身保险常见特征，按合同约定金额给；比例给付在一些医疗保险等也存在，ABCD都属于保险金给付方式。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117706", "t": 2, "q": "保险法的基本原则包括", "a": ["自愿原则", "最大诚信原则", "保险利益原则", "近因原则", "", ""], "r": "ABCD", "e": "保险法基本原则有最大诚信原则，要求双方如实告知等；保险利益原则，投保人对保险标的须有利益；近因原则，判断保险事故与损失间因果关系；自愿原则也是保险活动应遵循的。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117707", "t": 2, "q": "保险合同的有效要件包括", "a": ["主体合格", "意思表示真实", "内容合法", "形式合法", "", ""], "r": "ABCD", "e": "保险合同有效需主体有相应能力即主体合格，双方意思表达无虚假即意思表示真实，合同内容不违法即内容合法，且符合法定形式要求即形式合法。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117708", "t": 2, "q": "社会保险与商业保险的区别在于", "a": ["实施方式不同", "资金来源不同", "保障范围不同", "经营目的不同", "", ""], "r": "ABCD", "e": "社会保险是国家强制实施，资金主要源于国家、单位和个人，保障全体公民基本生活，以保障社会稳定为目的；商业保险是自愿投保，资金来自投保人保费，保障范围依合同而定，以盈利为目的。ABCD选项从实施、资金、保障范围、经营目的上体现了两者区别。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117709", "t": 2, "q": "下列关于保险数理基础的说法，正确的有", "a": ["大数法则是保险经营的基础", "概率论用于测算保险费率", "中心极限定理用于风险评估", "小数法则适用于保险定价", "", ""], "r": "ABC", "e": "大数法则是保险经营的重要基础，大量同质风险单位的集合能使风险更具可测性；概率论可用于测算保险费率；中心极限定理可用于风险评估。而小数法则并非适用于保险定价。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117710", "t": 2, "q": "下列机构中，属于保险市场主体的有", "a": ["保险公司", "投保人", "保险经纪人", "被保险人", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117711", "t": 2, "q": "下列关于保险合同解除的表述，正确的有", "a": ["投保人在保险合同成立后可以任意解除合同", "保险人在保险合同成立后不得任意解除合同", "投保人未履行缴费义务，保险人可以解除合同", "被保险人故意制造保险事故，保险人可以解除合同", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117712", "t": 2, "q": "下列选项中，属于保险合同当事人的有（　）", "a": ["投保人", "保险人", "被保险人", "受益人", "", ""], "r": "AB", "e": "保险合同当事人是直接参与订立保险合同，确定合同权利义务的主体，包括投保人和保险人。被保险人和受益人是保险合同关系人。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117713", "t": 2, "q": "电力企业海外投资保险的承保风险包括（　）", "a": ["征收风险", "战争风险", "汇率风险", "商业违约风险", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117714", "t": 2, "q": "下列选项中，属于保险合同必备条款的有", "a": ["保险标的", "保险责任和责任免除", "保险金额", "保险期限", "", ""], "r": "ABCD", "e": "保险合同必备条款涵盖保险标的、保险责任和责任免除、保险金额、保险期限等核心要素，这些对明确双方权利义务至关重要。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117715", "t": 2, "q": "人身保险按保险责任划分，可分为", "a": ["人寿保险", "健康保险", "意外伤害保险", "信用保险", "", ""], "r": "ABC", "e": "人身保险按保险责任分主要有人寿、健康、意外伤害保险；信用保险是财产保险，不属于人身保险。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117716", "t": 2, "q": "人身保险按照保障范围可以分为", "a": ["人寿保险", "健康保险", "意外伤害保险", "养老保险", "", ""], "r": "ABC", "e": "人身保险按保障范围分为人寿保险、健康保险和意外伤害保险。养老保险属于人寿保险的一种。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117717", "t": 2, "q": "下列属于保险合同必备条款的有", "a": ["保险标的", "保险责任和责任免除", "保险期限", "违约责任", "", ""], "r": "ABC", "e": "保险合同必备条款包含保险标的、保险责任和责任免除、保险期限等核心要素，违约责任虽重要但非必备。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117718", "t": 2, "q": "保险合同无效的原因包括（　）", "a": ["违反法律、行政法规的强制性规定", "损害社会公共利益", "投保人对保险标的无保险利益", "保险合同条款显失公平", "", ""], "r": "ABC", "e": "ABC是常见导致保险合同无效的法定情形，违反法律强制规定、损害公共利益、投保人无保险利益都会使合同不具有法律效力。而D选项保险合同条款显失公平一般是可撤销合同的情形，并非无效原因。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117719", "t": 2, "q": "保险法规定的保险人免责情形包括", "a": ["被保险人故意制造保险事故", "投保人未履行如实告知义务，对保险事故发生有严重影响", "保险标的因战争导致损失，且合同约定战争为免责事由", "被保险人未履行危险增加通知义务，因危险增加导致保险事故", "", ""], "r": "ABCD", "e": "ABCD 选项均符合保险法规定的保险人免责情形。A 被保险人故意制造事故；B 投保人未如实告知且影响事故发生；C 合同约定战争免责，因战争致损可免责；D 被保险人未通知危险增加且因此致事故。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117720", "t": 2, "q": "下列关于保险利益的说法，正确的有", "a": ["保险利益必须是合法的", "保险利益必须是经济上可衡量的", "保险利益必须是确定的", "保险利益可以是虚构的", "", ""], "r": "ABC", "e": "保险利益需具备合法性、经济性、确定性，虚构的不能作为保险利益。所以ABC正确，D错误。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117721", "t": 2, "q": "保险法规定的保险人解除保险合同的法定情形包括（　）", "a": ["投保人故意未履行如实告知义务", "被保险人未履行危险增加通知义务", "投保人未按约定支付保险费", "保险标的部分损失", "", ""], "r": "ABC", "e": "ABC选项中，投保人故意不履行如实告知、被保险人不履行危险增加通知义务、投保人不按约定付保费，都会影响保险人风险评估及合同履行，保险人可依法解除合同；D选项保险标的部分损失，通常是进行理赔等操作，并非保险人解除合同的法定情形。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117722", "t": 2, "q": "保险理赔的基本原则包括", "a": ["重合同、守信用原则", "实事求是原则", "主动、迅速、准确、合理原则", "损失补偿原则", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117723", "t": 2, "q": "保险的派生职能包括", "a": ["损失补偿", "资金融通", "社会管理", "经济给付", "", ""], "r": "BC", "e": "保险基本职能是损失补偿和经济给付，派生职能有资金融通和社会管理。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117724", "t": 2, "q": "社会保险中的养老保险，其待遇领取条件通常包括", "a": ["达到法定退休年龄", "累计缴费满规定年限", "符合特殊工种提前退休条件", "按时缴纳当期保险费", "", ""], "r": "ABC", "e": "养老保险待遇领取，一般需达到法定退休年龄且累计缴费满规定年限，这是基本条件。特殊工种提前退休也是领取情形之一。而按时缴纳当期保险费不是领取待遇的必要条件。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117725", "t": 2, "q": "下列属于保险数理基础中常用的概率分布有（　）", "a": ["二项分布", "正态分布", "泊松分布", "均匀分布", "", ""], "r": "ABC", "e": "保险数理基础里，二项分布、正态分布、泊松分布是常用概率分布，均匀分布较少用于保险数理基础。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117726", "t": 2, "q": "下列选项中，属于最大诚信原则内容的有", "a": ["告知义务", "说明义务", "保证义务", "弃权与禁止反言", "", ""], "r": "ABCD", "e": "最大诚信原则要求保险合同双方在订立和履行合同中保持最大诚信。告知义务是投保人应如实告知重要事实；说明义务是保险人应向投保人说明合同条款内容；保证义务是投保人或被保险人对特定事项的作为或不作为的承诺；弃权与禁止反言限制保险人的行为。ABCD都属于最大诚信原则内容。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117727", "t": 2, "q": "保险的基本职能包括", "a": ["分散风险职能", "补偿损失职能", "资金融通职能", "社会管理职能", "", ""], "r": "AB", "e": "保险基本职能是分散风险和补偿损失，资金融通和社会管理是派生职能。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117728", "t": 2, "q": "保险理赔的流程包括", "a": ["报案受理", "现场查勘", "责任认定", "赔款计算与支付", "", ""], "r": "ABCD", "e": "保险理赔是保险人在保险标的发生风险事故后，对被保险人提出的索赔请求进行处理的行为，一般流程就是先报案受理，接着现场查勘，再进行责任认定，最后赔款计算与支付。ABCD四个选项均是保险理赔流程中的环节。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117729", "t": 2, "q": "人身保险按保险责任划分，可分为", "a": ["人寿保险", "健康保险", "意外伤害保险", "年金保险", "", ""], "r": "ABC", "e": "人身保险按保险责任划分，主要包括人寿保险、健康保险、意外伤害保险。年金保险属于人寿保险的一种。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818592201117730", "t": 2, "q": "下列关于保险法的表述，正确的有", "a": ["保险法是调整保险关系的法律规范总称", "保险法包括保险合同法和保险业法", "保险法仅适用于商业保险", "保险法不调整社会保险关系", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636736", "t": 3, "q": "保险经纪人向保险人收取佣金。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险经纪人是基于投保人的利益，为投保人与保险人订立保险合同提供中介服务，并依法收取佣金，一般是向保险人收取佣金。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636737", "t": 3, "q": "电力企业海外投资保险的保险期限通常与海外投资项目的经营期限一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "海外投资保险期限一般较长，常和海外投资项目经营期限相匹配，以保障整个投资周期。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636738", "t": 3, "q": "保险理赔中，被保险人未履行通知义务的，保险人可以拒绝赔偿。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636739", "t": 3, "q": "保险合同的客体是保险标的本身。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同的客体是投保人或被保险人对保险标的具有的法律上承认的利益，即保险利益，而非保险标的本身。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636740", "t": 3, "q": "社会保险的保障水平高于商业保险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "商业保险保障水平可根据投保人意愿和缴费灵活确定，能提供较高保障额度；社会保险是基本保障，保障水平相对较低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636741", "t": 3, "q": "健康保险属于财产保险的范畴。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "健康保险是以人的身体为保险标的，保障被保险人因疾病或意外导致的医疗费用、收入损失等，属于人身保险范畴，并非财产保险。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636742", "t": 3, "q": "人身保险中的受益人只能由投保人指定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人身保险中受益人可由被保险人指定，也可由投保人指定，但投保人指定受益人需经被保险人同意。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636743", "t": 3, "q": "意外伤害保险的保险责任包括疾病导致的死亡或伤残。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "意外伤害保险的保险责任是因意外伤害导致的死亡或伤残，疾病不属于意外伤害范畴。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636744", "t": 3, "q": "保险市场的供给者仅包括保险公司。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险市场供给者不只是保险公司，还包括再保险公司等其他主体。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636745", "t": 3, "q": "保险公估机构的主要职能是销售保险产品。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险公估机构主要是接受委托，对保险标的或者保险事故进行评估、勘验、鉴定、估损理算等业务，并非销售保险产品。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636746", "t": 3, "q": "人身保险中，被保险人同意投保人为其订立保险合同的，视为投保人对被保险人具有保险利益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据保险法规定，人身保险中，若被保险人同意投保人为其订立保险合同，就可认定投保人对被保险人具有保险利益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636747", "t": 3, "q": "新型电力系统保险不涵盖储能设施的相关风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "新型电力系统保险旨在保障电力系统各环节，储能设施是新型电力系统重要组成部分，其面临的风险也在保险涵盖范围内。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636748", "t": 3, "q": "近因原则是判断保险责任的核心原则。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "近因原则是确定保险事故与保险标的损失之间因果关系，从而确定保险赔偿责任的一项基本原则，是判断保险责任的核心原则。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636749", "t": 3, "q": "保险代理人可以同时为多家保险公司代理业务。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636750", "t": 3, "q": "人身保险合同中，被保险人必须是自然人。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "人身保险是以人的寿命和身体为保险标的的保险，只有自然人有寿命和身体，所以被保险人须是自然人。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636751", "t": 3, "q": "保险的防灾防损职能是指保险人通过采取预防措施，防止保险事故的发生。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636752", "t": 3, "q": "保险合同成立后，保险人不得解除保险合同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般情况下保险合同成立后保险人不得随意解除，但在法定情形（如投保人故意或重大过失未如实告知，足以影响保险人决定是否承保或提高保费等）下，保险人可以解除合同。所以题干说不得解除说法太绝对。", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636753", "t": 3, "q": "海外投资保险的保险期限通常与投资项目的经营期限一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "海外投资保险期限一般较长，通常与投资项目的经营期限相匹配，以保障投资者在整个投资期间的风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636754", "t": 3, "q": "社会保险具有强制性，用人单位和职工必须依法参加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "社会保险是国家通过立法强制建立的社会保障制度，旨在保障劳动者权益，用人单位和职工都有依法参加的义务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636755", "t": 3, "q": "保险合同成立的标志是保险人向投保人签发保险单。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同成立的标志是投保人与保险人就合同条款达成协议，而非保险人向投保人签发保险单，签发保险单是合同成立后的履约行为。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636756", "t": 3, "q": "保险数理基础中，风险频率越高，纯保险费率越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在保险数理基础里，风险频率越高意味着发生保险事故的可能性越大，保险公司赔付的概率和金额可能越高，所以纯保险费率应越高，而不是越低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636757", "t": 3, "q": "保险市场的监管主体是中国证券监督管理委员会。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险市场监管主体是国家金融监督管理总局，并非中国证券监督管理委员会。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636758", "t": 3, "q": "保险经纪人可以同时为多个投保人提供保险中介服务。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险经纪人是基于投保人的利益，为投保人与保险人订立保险合同提供中介服务，并依法收取佣金的机构，能同时为多个投保人服务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636759", "t": 3, "q": "保险的社会管理职能是保险的基本职能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险的基本职能是经济补偿和保险金给付，社会管理职能是保险的派生职能。", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636760", "t": 3, "q": "新型电力系统保险中，储能电站的热失控风险属于保险责任范围。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "新型电力系统保险旨在为电力系统相关设施和风险提供保障，储能电站热失控是其面临的重要且常见风险，通常在保险责任范围内。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636761", "t": 3, "q": "保险市场中的保险经纪公司代表保险人的利益。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险经纪公司代表的是投保人的利益，为其提供风险管理、保险方案设计等服务，而非保险人利益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636762", "t": 3, "q": "海外投资保险的保险期限通常较短，一般不超过1年。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "海外投资保险期限较长，一般为15 - 20年。所以题干说期限通常较短且不超过1年错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636763", "t": 3, "q": "保险理赔中，保险人收到理赔申请后，必须在30日内作出赔付决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险人收到理赔申请后，情形复杂的才需在30日内作出核定，并非必须在30日内作出赔付决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636764", "t": 3, "q": "财产保险中，代位求偿权的行使对象包括投保人的家庭成员或组成人员。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "财产保险中，除被保险人的家庭成员或者其组成人员故意造成保险事故外，保险人不得对被保险人的家庭成员或者其组成人员行使代位求偿权。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636765", "t": 3, "q": "保险法规定，人寿保险的保险费不得用诉讼方式要求投保人支付。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "《保险法》规定，保险人对人寿保险的保险费，不得用诉讼方式要求投保人支付。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636766", "t": 3, "q": "新型电力系统保险是专门为传统火电企业设计的保险产品。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "新型电力系统保险是面向新型电力系统设计的，并非专门为传统火电企业。新型电力系统强调以新能源为主体等特点，涵盖多种电源类型和电力环节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636767", "t": 3, "q": "保险合同变更无需采用书面形式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同变更通常需采用书面形式，以明确双方权利义务，避免纠纷。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636768", "t": 3, "q": "近因是指导致损失发生的最后一个原因。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "近因是指在风险和损失之间，导致损失的最直接、最有效、起决定作用的原因，而非最后一个原因。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636769", "t": 3, "q": "保险利益必须是经济上可衡量的利益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险利益是指投保人或被保险人对保险标的具有的法律上承认的利益，这种利益需能用货币来计量，否则难以确定保险赔偿的金额。所以保险利益必须是经济上可衡量的利益。", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636770", "t": 3, "q": "保险最大诚信原则仅要求投保人履行告知义务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险最大诚信原则要求保险双方都要履行如实告知等义务，并非仅要求投保人，保险人也需遵循。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636771", "t": 3, "q": "人寿保险的保险金请求权诉讼时效期间为2年。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人寿保险的保险金请求权诉讼时效期间是5年，而非2年。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636772", "t": 3, "q": "财产保险中，保险标的发生部分损失的，保险人赔偿后，保险合同终止。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "财产保险中，保险标的发生部分损失，保险人赔偿后，除合同另有约定外，保险人也可以终止合同，但并非自动终止。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636773", "t": 3, "q": "保险利益必须是经济上可以衡量的利益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险的目的是对被保险人遭受的经济损失进行补偿，若保险利益无法用经济衡量，就难以确定赔偿额度，所以保险利益须是经济上可衡量的利益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636774", "t": 3, "q": "人身保险合同中，受益人只能由投保人指定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人身保险合同中，受益人可由被保险人指定，投保人指定受益人时须经被保险人同意。所以并非只能由投保人指定。", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636775", "t": 3, "q": "保险合同的解释应遵循有利于保险人的原则。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同为格式合同，保险人在拟定条款时占主导地位，投保人较难对条款施加影响。为保护投保人、被保险人利益，保险合同解释应遵循有利于被保险人和受益人的原则，而非有利于保险人。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636776", "t": 3, "q": "保险合同的受益人只能是自然人，不能是法人或其他组织。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同受益人可以是自然人，也可以是法人或其他组织。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636777", "t": 3, "q": "保险理赔中，责任认定是核心环节。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险理赔中，责任认定决定了是否属于保险责任范围，直接关系到是否赔付，所以是核心环节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636778", "t": 3, "q": "社会保险的保障水平高于商业保险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "商业保险保障水平可根据投保人意愿和缴费能力定制，保障额度能很高；而社会保险是基本保障，保障水平相对较低。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636779", "t": 3, "q": "新型电力系统保险的保障范围不包括电力设备的运维失误导致的损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "新型电力系统保险保障范围较广，电力设备运维失误导致的损失通常是在其保障范围内的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818593291636780", "t": 3, "q": "保险代理人在授权范围内的行为后果由投保人承担。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险代理人在授权范围内的行为后果应由保险人（保险公司）承担，而非投保人。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 保险学（3）", "n": "基础练习题【含解析】 / 第5章 保险学（3）", "qs": [{"id": "2034818595489452032", "t"
