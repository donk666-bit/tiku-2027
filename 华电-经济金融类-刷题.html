""], "r": "D", "e": "需求曲线左移意味着需求减少。A项商品自身价格下降会使需求量沿曲线变动而非曲线移动；B项消费者偏好增强会使需求增加，曲线右移；C项相关商品价格上升，若为替代品会使本商品需求增加，若为互补品会使本商品需求减少，情况不明确；D项正常商品，消费者收入减少会导致需求减少，曲线左移。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920290", "t": 1, "q": "摩擦性失业是指？", "a": ["由于经济衰退导致的失业", "由于技术进步导致的失业", "由于劳动者转换工作过程中产生的失业", "由于工资刚性导致的失业", "", ""], "r": "C", "e": "摩擦性失业是劳动者在正常流动过程（如转换工作）中产生的失业。A是周期性失业，B是技术性失业，D与摩擦性失业无关。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818435501920291", "t": 1, "q": "下列属于扩张性财政政策的是？", "a": ["提高税率", "减少政府购买支出", "增加转移支付", "减少国债发行", "", ""], "r": "C", "e": "扩张性财政政策是要刺激经济，增加社会总需求。提高税率会使企业和个人交税增多，抑制需求；减少政府购买支出会降低总需求；减少国债发行意味着政府从市场拿钱少了，政府投资等也会相应减少，也不利于扩大需求。而增加转移支付能增加居民可支配收入，刺激消费需求，属于扩张性财政政策。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670336", "t": 2, "q": "完全竞争市场的条件包括？", "a": ["厂商数量众多", "产品同质无差异", "资源完全自由流动", "信息完全对称", "", ""], "r": "ABCD", "e": "完全竞争市场需满足厂商数量多、产品无差异、资源自由流动、信息对称等条件。ABCD选项均符合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670337", "t": 2, "q": "寡头垄断市场的特征有", "a": ["厂商数量少", "厂商之间相互依存", "产品可能同质也可能有差异", "进出市场困难", "", ""], "r": "ABCD", "e": "寡头垄断是少数几家厂商控制整个市场产品的生产和销售。厂商数量少才会形成少数厂商控制局面；因厂商少，彼此决策相互影响，存在依存关系；产品既可以是如钢铁等同质的，也可是如汽车有差异的；进入要面临规模、技术等障碍，退出有关停成本等，所以进出困难。ABCD都符合寡头垄断市场特征。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670338", "t": 2, "q": "菲利普斯曲线的政策含义包括？", "a": ["短期内可以通过牺牲通货膨胀来降低失业率", "短期内可以通过牺牲失业率来降低通货膨胀", "长期内菲利普斯曲线是垂直的", "长期内失业率与通货膨胀率无关", "", ""], "r": "ABCD", "e": "菲利普斯曲线表明短期内通胀与失业存在替代关系，可牺牲一方来降低另一方，长期菲利普斯曲线垂直，失业率与通胀率无关。ABCD选项分别对应短期和长期菲利普斯曲线的政策含义。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670339", "t": 2, "q": "厂商的成本包括", "a": ["显成本", "隐成本", "固定成本", "可变成本", "", ""], "r": "ABCD", "e": "厂商成本从不同角度分类有显成本和隐成本，也有固定成本和可变成本，ABCD选项均属于厂商成本范畴。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670340", "t": 2, "q": "消费者偏好的基本假设包括", "a": ["完备性", "传递性", "非饱和性", "边际替代率递减", "", ""], "r": "ABC", "e": "消费者偏好有完备性、传递性、非饱和性三大基本假设，而边际替代率递减是无差异曲线的特征。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670341", "t": 2, "q": "下列哪些因素会导致需求曲线左移？", "a": ["消费者收入减少", "相关商品价格下降（替代品）", "相关商品价格上升（互补品）", "消费者偏好增强", "", ""], "r": "ABC", "e": "需求曲线左移意味着需求减少。消费者收入减少，购买力下降，需求会减少；替代品价格下降，消费者会更多选择替代品，该商品需求减少；互补品价格上升，会使该商品需求减少。而消费者偏好增强会使需求增加，需求曲线右移。ABC选项都会使需求减少导致需求曲线左移。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670342", "t": 2, "q": "消费者的偏好具有的特性有", "a": ["完备性", "传递性", "非饱和性", "对称性", "", ""], "r": "ABC", "e": "消费者偏好有完备性（能明确比较不同商品组合）、传递性（偏好关系可传递）、非饱和性（多比少好）。对称性并非消费者偏好特性。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670343", "t": 2, "q": "下列计入GDP的有", "a": ["企业生产并销售的面包", "居民购买的新住房", "政府支付给公务员的工资", "家庭主妇的家务劳动", "", ""], "r": "ABC", "e": "GDP是指一个国家（或地区）所有常住单位在一定时期内生产活动的最终成果。企业生产销售面包是市场交易的最终产品；居民购买新住房属于投资行为；政府支付公务员的工资是政府购买服务的支出，这三项都应计入GDP。而家庭主妇的家务劳动未参与市场交换，不计入GDP。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670344", "t": 2, "q": "短期经济波动的主要原因有", "a": ["总需求变动", "总供给变动", "技术冲击", "预期变动", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670345", "t": 2, "q": "生命周期消费理论的主要观点有", "a": ["消费者一生的收入分为工作期收入和退休期收入", "消费者会平滑一生的消费", "消费取决于当期收入", "储蓄是为了退休期的消费", "", ""], "r": "ABD", "e": "生命周期消费理论认为，人们会在更长时间范围内计划生活消费开支，以达到在整个生命周期内消费的最佳配置。消费者一生收入分工作期和退休期收入，会平滑一生消费，储蓄是为退休期消费，并非取决于当期收入。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670346", "t": 2, "q": "外部性的解决方法有", "a": ["政府征税或补贴", "明确产权", "企业合并", "政府管制", "", ""], "r": "ABCD", "e": "外部性指一个经济主体的行为对另一个经济主体的福利产生影响。政府征税或补贴可调节经济主体行为，征税抑制负外部性，补贴鼓励正外部性；明确产权能让产权所有者维护自身利益，减少外部性；企业合并可将外部影响内部化；政府管制能直接规范经济主体行为。ABCD都可解决外部性问题。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670347", "t": 2, "q": "垄断竞争市场的特点有？", "a": ["厂商数量较多", "产品存在差异化", "厂商进出市场较容易", "存在一定的市场势力", "", ""], "r": "ABCD", "e": "垄断竞争市场有众多厂商，产品有差异彼此可替代，厂商进出较易，因产品差异有一定定价权即存在市场势力。ABCD表述都符合其特点。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670348", "t": 2, "q": "一般均衡的实现条件包括", "a": ["交换的帕累托最优", "生产的帕累托最优", "交换和生产的帕累托最优", "要素市场的均衡", "", ""], "r": "ABC", "e": "一般均衡要实现需满足交换、生产以及交换和生产都达到帕累托最优。要素市场均衡只是其中一部分情况，不能完整涵盖一般均衡实现条件。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670349", "t": 2, "q": "消费者均衡的条件包括？", "a": ["边际替代率等于商品价格之比", "每种商品的边际效用与价格之比相等", "消费者的预算线与无差异曲线相切", "总效用达到最大值", "", ""], "r": "ABCD", "e": "消费者均衡时，边际替代率等于商品价格之比，每种商品边际效用与价格之比相等，此时预算线与无差异曲线相切，且总效用达到最大。ABCD四个选项均是消费者均衡的条件。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670350", "t": 2, "q": "公共物品供给的方式包括？", "a": ["政府供给", "私人供给", "混合供给", "市场自发供给", "", ""], "r": "ABC", "e": "公共物品供给方式有政府供给、私人供给和混合供给。市场自发供给难以有效提供公共物品。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670351", "t": 2, "q": "经济增长的源泉包括？", "a": ["资本积累", "劳动力增长", "技术进步", "制度创新", "", ""], "r": "ABCD", "e": "资本积累能提供更多生产设备等；劳动力增长带来更多人力投入生产；技术进步可提高生产效率；制度创新能优化资源配置、激发市场活力，它们都是经济增长的重要源泉。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670352", "t": 2, "q": "下列关于失业率的说法，正确的有？", "a": ["失业率是失业人口与劳动力人口的比率", "劳动力人口包括就业人口和失业人口", "失业人口是指有劳动能力且愿意工作但未找到工作的人", "失业率能完全反映就业状况", "", ""], "r": "ABC", "e": "失业率是失业人口与劳动力人口比率，劳动力人口含就业和失业人口，失业人口是有劳动能力且愿工作却未找到工作的人，但失业率不能完全反映就业状况，存在隐性失业等情况。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670353", "t": 2, "q": "市场失灵的原因包括？", "a": ["垄断", "外部性", "公共物品", "信息不对称", "", ""], "r": "ABCD", "e": "垄断会限制竞争、影响资源有效配置；外部性使市场交易无法反映全部成本或收益；公共物品具有非排他性和非竞争性，市场难以有效提供；信息不对称会导致交易不公平、市场效率降低，这些都是市场失灵的原因。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670354", "t": 2, "q": "短期菲利普斯曲线与长期菲利普斯曲线的关系是？", "a": ["短期菲利普斯曲线是向右下方倾斜的", "长期菲利普斯曲线是垂直的", "长期菲利普斯曲线是短期菲利普斯曲线的包络线", "长期菲利普斯曲线对应的失业率是自然失业率", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670355", "t": 2, "q": "下列属于短期总供给曲线移动的因素有", "a": ["劳动力数量变动", "生产技术水平变动", "原材料价格变动", "价格水平变动", "", ""], "r": "ABC", "e": "短期总供给曲线移动受劳动、资本、技术、原材料等影响。劳动力数量、生产技术、原材料价格变动会使曲线移动，而价格水平变动是沿曲线移动。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670356", "t": 2, "q": "下列属于生产要素的有？", "a": ["劳动", "资本", "土地", "企业家才能", "", ""], "r": "ABCD", "e": "生产要素是进行社会生产经营活动时所需要的各种社会资源。劳动、资本、土地、企业家才能都是常见的生产要素。劳动是人类的体力和脑力付出；资本可表现为货币、设备等；土地涵盖各种自然资源；企业家才能负责组织、管理和创新等。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670357", "t": 2, "q": "寡头垄断市场的价格形成机制包括", "a": ["价格领袖制", "成本加成定价", "卡特尔定价", "边际成本定价", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670358", "t": 2, "q": "下列属于政府微观经济政策的有", "a": ["反垄断政策", "公共物品供给政策", "外部性矫正政策", "货币政策", "", ""], "r": "ABC", "e": "微观经济政策主要针对微观经济主体和市场机制问题。ABC选项分别针对市场垄断、公共物品配置和外部性问题，属于微观经济政策。货币政策是宏观经济政策，调控整体经济。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670359", "t": 2, "q": "厂商的停止营业点是？", "a": ["平均可变成本曲线的最低点", "边际成本曲线与平均可变成本曲线的交点", "价格等于平均可变成本的点", "价格等于边际成本的点", "", ""], "r": "ABC", "e": "厂商停止营业的决策关键在于能否弥补可变成本。当价格等于平均可变成本时，厂商生产只能收回可变成本，继续生产无意义，所以停止营业点是价格等于平均可变成本的点，同时这也是平均可变成本曲线最低点，是边际成本曲线与平均可变成本曲线交点。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670360", "t": 2, "q": "下列属于周期性失业的特点的有？", "a": ["与经济周期波动相关", "经济繁荣时失业率下降", "经济衰退时失业率上升", "由劳动力技能不匹配导致", "", ""], "r": "ABC", "e": "周期性失业和经济周期波动紧密相连，经济繁荣时企业生产扩张，需更多劳动力，失业率下降；经济衰退时生产收缩，裁员增加，失业率上升。而劳动力技能不匹配导致的是结构性失业。所以ABC是周期性失业特点，答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670361", "t": 2, "q": "下列属于短期成本的有", "a": ["平均固定成本", "边际成本", "长期边际成本", "可变成本", "", ""], "r": "ABD", "e": "短期成本包含固定成本和可变成本，平均固定成本是固定成本的平均，边际成本是每增加一单位产量所增加的成本，都属于短期成本概念。长期边际成本是长期范畴。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670362", "t": 2, "q": "下列属于外部不经济的现象有", "a": ["工厂排放废气污染环境", "邻居在阳台上种花散发香气", "企业研发新技术带来的技术溢出", "汽车尾气造成的空气污染", "", ""], "r": "AD", "e": "外部不经济指某经济行为给他人带来不利影响。A选项工厂排废气污染环境，D选项汽车尾气造成空气污染，都对他人有负面影响。B是带来愉悦，C是带来益处，属于外部经济。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670363", "t": 2, "q": "下列关于宏观经济均衡的说法正确的有？", "a": ["短期均衡是总需求等于总供给", "长期均衡是潜在产出等于实际产出", "短期均衡时物价水平可能高于或低于长期均衡水平", "长期均衡时失业率等于自然失业率", "", ""], "r": "ABCD", "e": "短期宏观经济均衡条件是总需求等于总供给；长期中经济会趋向潜在产出，此时潜在产出等于实际产出，失业率等于自然失业率；短期均衡时物价可能偏离长期均衡水平。ABCD选项说法均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670364", "t": 2, "q": "新凯恩斯主义经济学的主要观点有", "a": ["市场存在粘性价格和粘性工资", "市场自动均衡的速度缓慢", "政府干预经济是必要的", "强调货币主义的政策主张", "", ""], "r": "ABC", "e": "新凯恩斯主义认为市场存在粘性价格和粘性工资，这使得市场自动均衡速度缓慢，所以仅靠市场机制难以迅速恢复均衡，政府干预经济是必要的。而货币主义强调减少政府干预，与新凯恩斯主义不符。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670365", "t": 2, "q": "下列关于需求定理的表述，正确的有？", "a": ["商品价格上升，需求量减少", "商品价格下降，需求量增加", "需求定理的例外包括吉芬商品", "需求定理适用于所有商品", "", ""], "r": "ABC", "e": "需求定理指一般情况下，商品价格和需求量呈反向变动，即价格上升需求减少，价格下降需求增加，AB正确。吉芬商品是需求定理的例外，价格上升需求增加，C正确。需求定理并非适用于所有商品，存在吉芬商品等例外情况，D错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670366", "t": 2, "q": "财政政策的工具包括？", "a": ["税收", "政府购买", "转移支付", "公开市场操作", "", ""], "r": "ABC", "e": "财政政策工具是政府为实现既定的政策目标所选择的操作手段，税收、政府购买、转移支付都属于财政政策工具。而公开市场操作是货币政策工具。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670367", "t": 2, "q": "下列属于规范经济学的命题有", "a": ["政府应提高最低工资标准以保障低收入群体", "通货膨胀率超过5%会影响经济稳定", "税收政策应向高收入群体倾斜", "货币供应量增加会导致物价上涨", "", ""], "r": "AC", "e": "规范经济学带有价值判断，表达“应该怎样”；实证经济学描述事实，表达“是什么”。A项说政府“应”提高，C项说税收政策“应”倾斜，带有价值判断，属于规范经济学命题。B、D是对经济现象客观描述，属于实证经济学。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670368", "t": 2, "q": "下列属于正常商品的有", "a": ["奢侈品", "必需品", "劣质商品", "吉芬商品", "", ""], "r": "AB", "e": "正常商品是随消费者收入增加，需求也增加的商品。奢侈品和必需品都符合这一特征，而劣质商品、吉芬商品，消费者收入增加时需求反而减少。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818437158670369", "t": 2, "q": "下列属于负外部性的有？", "a": ["化工厂排放废气影响周边居民健康", "养蜂人养蜂使果园增产", "吸烟导致他人被动吸烟", "学生学习提高自身素质", "", ""], "r": "AC", "e": "负外部性是指某个经济行为个体的活动使他人或社会受损，而造成负外部性的人却没有为此承担成本。A选项化工厂排放废气影响周边居民健康，C选项吸烟导致他人被动吸烟，都是一方行为对他人造成损害却未承担相应成本，属于负外部性。B是正外部性，D是对自身的影响，不涉及外部性。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361600", "t": 3, "q": "IS-LM模型分析的是长期经济增长问题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "IS - LM模型是用于分析短期宏观经济中产品市场和货币市场均衡的模型，并非分析长期经济增长问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361601", "t": 3, "q": "完全垄断厂商可以任意制定商品价格，不受任何限制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "完全垄断厂商虽有定价权，但会受市场需求、消费者购买力及政府管制等因素限制，并非能任意定价。", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361602", "t": 3, "q": "通货膨胀会导致债务人受益，债权人受损。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "通货膨胀时物价上涨，货币贬值。债务人还款时货币实际价值降低，意味着其实际还款负担减轻，所以债务人受益；而债权人收回的钱实际购买力下降，遭受损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361603", "t": 3, "q": "要素的边际收益产品曲线就是要素的需求曲线。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在完全竞争产品市场和不完全竞争产品市场中，厂商利润最大化要求要素的边际收益产品等于要素价格，当要素价格变化时，厂商会根据边际收益产品等于要素价格来调整要素使用量，所以要素的边际收益产品曲线反映了要素价格与要素需求量之间的关系，就是要素的需求曲线。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361604", "t": 3, "q": "物价稳定就是指物价水平保持不变。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物价稳定并非物价水平绝对不变，而是物价总水平在短期内相对稳定，不出现大幅波动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361605", "t": 3, "q": "外部不经济会导致社会福利损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外部不经济指某经济主体的行为使他人或社会受损，却没有为此承担成本。比如工厂排污影响周边环境，社会为此承受健康、生态等方面损失，造成社会福利减少。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361606", "t": 3, "q": "摩擦性失业和结构性失业都是自然失业的组成部分，无法通过宏观经济政策消除。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "摩擦性失业是劳动者正常流动或新老交替产生的失业，结构性失业是经济结构变化等导致的劳动力供需不匹配的失业，它们都源于经济中一些难以避免的因素，宏观经济政策难以完全消除这些失业。", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361607", "t": 3, "q": "逆向选择是指交易后一方因信息不对称而采取不利于另一方的行为。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "逆向选择是交易前因信息不对称，劣质品驱逐优质品的现象；交易后一方因信息不对称采取不利于另一方的行为是道德风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361608", "t": 3, "q": "公共物品的消费具有竞争性和排他性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "公共物品消费具有非竞争性和非排他性，私人物品消费才具有竞争性和排他性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361609", "t": 3, "q": "公共物品的非排他性意味着任何人都可以免费消费公共物品，无需支付代价。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361610", "t": 3, "q": "消费者均衡时，两种商品的边际效用相等。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "消费者均衡条件是两种商品边际效用与各自价格之比相等，而非边际效用相等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361611", "t": 3, "q": "无差异曲线不能相交，是因为消费者偏好具有传递性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "若无差异曲线相交，会违背消费者偏好的传递性。比如两条相交的无差异曲线代表不同效用水平，交点处却意味着相同商品组合有不同效用排序，与传递性矛盾，所以无差异曲线不能相交。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361612", "t": 3, "q": "实际GDP增长率等于名义GDP增长率减去通货膨胀率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据公式，实际GDP增长率约等于名义GDP增长率减去通货膨胀率（这里是近似关系），在经济学常见分析中可这样理解和运用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361613", "t": 3, "q": "公共物品的供给曲线由个人需求曲线横向加总得到。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "公共物品供给曲线由生产公共物品的边际成本曲线构成，私人物品的市场需求曲线才是由个人需求曲线横向加总得到。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361614", "t": 3, "q": "边际成本曲线与平均成本曲线的交点是平均成本曲线的最低点，也是厂商的停止生产点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边际成本曲线与平均成本曲线交点是平均成本曲线最低点，但厂商停止生产点是边际成本曲线与平均可变成本曲线的交点，而非此交点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361615", "t": 3, "q": "无差异曲线不能相交，否则会违背消费者偏好的传递性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "若两条无差异曲线相交，在交点处会出现消费者对相同商品组合有不同偏好排序，与消费者偏好传递性矛盾。", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361616", "t": 3, "q": "吉芬商品是一种特殊的正常品，其需求曲线向右上方倾斜。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "吉芬商品是特殊的低档品，而非正常品，它在特定条件下需求曲线向右上方倾斜。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361617", "t": 3, "q": "凯恩斯主义认为，货币需求主要取决于收入和利率，其中利率是主要影响因素。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "凯恩斯认为货币需求取决于交易动机、预防动机和投机动机。交易和预防动机与收入相关，投机动机与利率相关，且利率是影响投机性货币需求的关键因素，整体而言利率是货币需求的主要影响因素。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361618", "t": 3, "q": "自然失业率是指经济处于充分就业时的失业率，包括摩擦性失业和结构性失业。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "自然失业率是经济在充分就业状态下存在的失业率，主要由摩擦性失业和结构性失业构成。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361619", "t": 3, "q": "序数效用论认为，效用可以用具体数值来衡量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "序数效用论认为效用无法用具体数值衡量，只能用顺序或等级来表示偏好程度，而基数效用论才认为效用可以用具体数值衡量。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361620", "t": 3, "q": "生产的帕累托最优条件是两种商品的边际替代率等于其边际转换率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。生产的帕累托最优条件是任意两种生产要素的边际技术替代率对于使用这两种要素生产的所有产品来说都相等。而两种商品的边际替代率等于其边际转换率是生产和交换的帕累托最优条件，并非生产的帕累托最优条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361621", "t": 3, "q": "短期总供给曲线的斜率为正，说明价格水平上升会导致总供给量增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "短期总供给曲线斜率为正，意味着价格水平和总供给量呈同向变动关系，即价格上升会促使企业增加生产，总供给量随之增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361622", "t": 3, "q": "序数效用论的分析工具是无差异曲线和预算线。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "序数效用论用无差异曲线表示消费者偏好，用预算线表示消费者的预算约束，通过二者结合分析消费者均衡。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361623", "t": 3, "q": "帕累托最优状态意味着社会福利达到最大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "帕累托最优是指资源分配的一种理想状态，在此状态下无法在不使任何人境况变坏的情况下，使某些人的境况变好，但这并不等同于社会福利达到最大，社会福利还受分配公平等诸多因素影响。", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361624", "t": 3, "q": "寡头垄断厂商之间的博弈中，合作共赢是最稳定的均衡结果。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "寡头垄断厂商间博弈中，合作共赢并非最稳定均衡结果。因各厂商为自身利益最大化，有违背合作协议的动机，易陷入囚徒困境，非合作均衡才更常见和稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361625", "t": 3, "q": "一般均衡理论认为，单个市场的均衡会自动扩展到整个经济，实现所有市场的同时均衡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一般均衡理论强调经济中各个市场相互关联，单个市场均衡会通过价格机制等传导，使得所有市场最终实现同时均衡。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361626", "t": 3, "q": "菲利普斯曲线在长期是一条垂直于横轴的直线。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "长期中，预期通货膨胀会随实际通货膨胀调整，失业率回到自然失业率水平，不受通货膨胀影响，所以菲利普斯曲线在长期是垂直于横轴的直线。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361627", "t": 3, "q": "垄断厂商的边际收益曲线总是位于平均收益曲线的下方。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "垄断厂商面临的需求曲线即平均收益曲线，其向右下方倾斜。根据边际量和平均量关系，当平均量下降时，边际量小于平均量，所以垄断厂商边际收益曲线在平均收益曲线下方。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361628", "t": 3, "q": "结构性通货膨胀是由于经济结构失衡导致的，与货币供应量无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然结构性通货膨胀主要源于经济结构失衡，比如部门间劳动生产率差异等导致物价变动。但货币供应量并非毫无关联，若货币供应过度，会为结构性物价上涨提供货币条件，加剧通货膨胀程度。所以说与货币供应量无关不准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361629", "t": 3, "q": "公共物品的非竞争性意味着增加一个消费者的边际成本为零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "非竞争性指的是消费者对某一种公共物品的消费并不影响其他人对该公共物品的消费，增加一个消费者不会带来成本的增加，即边际成本为零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361630", "t": 3, "q": "短期平均成本曲线的最低点总是位于长期平均成本曲线的最低点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "短期平均成本曲线最低点只有在长期平均成本曲线的最低点时才与之一致，其他情况下，短期平均成本曲线最低点并不在长期平均成本曲线最低点，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361631", "t": 3, "q": "经济增长理论中，索洛模型认为技术进步是长期经济增长的唯一源泉。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "索洛模型指出，在长期中，只有技术进步能带来人均产出持续增长，是长期经济增长的唯一源泉。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361632", "t": 3, "q": "自然失业率是指经济处于充分就业状态时的失业率，它是固定不变的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自然失业率并非固定不变，它会受人口结构、技术进步、劳动力市场制度等多种因素影响而变动。", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361633", "t": 3, "q": "长期中，完全竞争厂商可以获得经济利润。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在长期中，完全竞争市场具有自由进出的特点。若厂商能获得经济利润，会吸引新厂商进入，市场供给增加，价格下降，经济利润逐渐消失；若厂商亏损，部分厂商会退出，市场供给减少，价格上升，亏损消除。所以长期中完全竞争厂商只能获得正常利润，不能获得经济利润。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361634", "t": 3, "q": "完全竞争厂商的边际收益等于商品价格，垄断厂商的边际收益小于商品价格。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完全竞争市场中，厂商是价格接受者，增加一单位销售所增加的收益就是商品价格，所以边际收益等于价格；垄断厂商面临向下倾斜的需求曲线，要增加销量需降低价格，新增一单位销售带来的收益小于销售价格，即边际收益小于价格。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361635", "t": 3, "q": "需求的交叉弹性为正，说明两种商品是互补品。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "需求交叉弹性为正表明一种商品价格上升，另一种商品需求量增加，这意味着两种商品可相互替代，是替代品而非互补品。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361636", "t": 3, "q": "政府增加税收属于扩张性财政政策。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "扩张性财政政策是通过增加政府支出、减少税收来刺激总需求增长。而增加税收会使企业和个人可支配收入减少，抑制消费和投资，属于紧缩性财政政策，并非扩张性财政政策。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361637", "t": 3, "q": "道德风险问题发生在交易之前，逆向选择问题发生在交易之后。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。逆向选择是交易之前由于信息不对称，劣质商品或服务驱逐优质的情况；道德风险是交易之后，一方为自身利益损害另一方利益的行为。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361638", "t": 3, "q": "信息不对称会导致逆向选择和道德风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "信息不对称指交易中各方掌握信息不同，会使掌握信息少的一方做出不利选择即逆向选择，也会让掌握信息多的一方为自身利益损害对方利益产生道德风险。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361639", "t": 3, "q": "货币政策的效果在长期主要影响物价水平，在短期主要影响经济增长和就业。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在长期中，货币数量的变化主要反映在物价水平上；而在短期，货币政策通过影响利率、信贷等，能对经济增长和就业产生明显作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361640", "t": 3, "q": "规模报酬递增的厂商不可能面临边际产量递减。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "规模报酬和边际产量是不同概念。规模报酬关注所有要素同比例变化时产量变化情况，边际产量是其他要素不变时一种要素增加带来的产量变化。规模报酬递增时，也可能出现一种要素投入增加到一定程度边际产量递减。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361641", "t": 3, "q": "吉芬商品是一种特殊的正常商品。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "吉芬商品是一种特殊的低档商品，其需求曲线向右上方倾斜，与正常商品需求规律相悖，并非特殊的正常商品。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361642", "t": 3, "q": "正常商品的收入效应与替代效应方向相同，劣质商品的收入效应与替代效应方向相反。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "正常商品中价格变动时，收入效应和替代效应都使需求量与价格反向变动，方向相同；而劣质商品中，替代效应使需求量与价格反向变动，收入效应使需求量与价格同向变动，二者方向相反。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361643", "t": 3, "q": "完全竞争厂商的平均收益曲线、边际收益曲线和需求曲线是同一条线。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在完全竞争市场，厂商是价格接受者，其产品价格既定。平均收益等于总收益除以产量，即价格；边际收益是每增加一单位产量所增加的收益，也等于价格；厂商面临的需求曲线表示在每一个价格水平下消费者对该厂商产品的需求量，价格不变，所以三者重合为同一条线。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361644", "t": 3, "q": "消费者剩余是消费者实际获得的收益，生产者剩余是生产者实际获得的利润。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "消费者剩余是消费者愿意支付价格与实际支付价格的差额，并非实际获得的收益；生产者剩余是生产者实际得到的价格与愿意接受的最低价格的差额，也不是实际获得的利润。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361645", "t": 3, "q": "结构性失业是由于经济周期波动导致的失业。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "结构性失业是因经济结构变化，劳动力供给和需求不匹配导致的失业，而经济周期波动导致的失业是周期性失业。", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361646", "t": 3, "q": "扩张性财政政策会导致利率上升，挤出私人投资。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "扩张性财政政策如增加政府支出、减少税收等，会使社会总需求增加，进而使国民收入增加。国民收入增加会导致货币需求上升，在货币供给不变时，利率就会上升。利率上升会增加私人投资的成本，从而抑制私人投资，即挤出私人投资。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361647", "t": 3, "q": "在完全竞争市场中，厂商的长期均衡利润为零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完全竞争市场有大量厂商且产品同质，资源自由流动，信息完全对称。长期中，若有利润会吸引新厂商进入，使供给增加价格下降；若亏损则部分厂商退出，供给减少价格上升，最终厂商长期均衡时经济利润为零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361648", "t": 3, "q": "国内生产总值（GDP）是衡量一个国家经济总量的唯一指标。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "衡量一个国家经济总量的指标有很多，如国内生产总值（GDP）、国民生产总值（GNP）、人均收入、财政收入等，GDP 并非唯一指标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818439742361649", "t": 3, "q": "通货膨胀会导致债务人受益，债权人受损。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "通货膨胀时物价上涨、货币贬值。债务人偿还的是名义上固定数额的货币，这些货币的实际购买力下降，对债务人有利；而债权人收到的还款实际价值降低，利益受损。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 经济学基础（4）", "n": "基础练习题【含解析】 / 第1章 经济学基础（4）", "qs": [{"id": "2034818448734949376", "t": 1, "q": "消费者效用最大化的均衡条件是", "a": ["商品边际替代率等于商品价格之比", "商品边际替代率大于商品价格之比", "商品边际效用等于商品价格之比", "商品边际效用大于商品价格之比", "", ""], "r": "A", "e": "消费者效用最大化均衡条件是在一定预算约束下，为实现效用最大化，消费者应使购买各种商品的边际替代率等于商品价格之比。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949377", "t": 1, "q": "消费者剩余是指", "a": ["消费者实际支付的价格与愿意支付的最高价格之间的差额", "消费者实际支付的价格与生产成本之间的差额", "消费者愿意支付的最高价格与生产成本之间的差额", "消费者实际获得的效用与期望效用之间的差额", "", ""], "r": "A", "e": "消费者剩余就是消费者愿意为商品支付的最高价格和实际支付价格的差值。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949378", "t": 1, "q": "下列哪项属于资本的边际效率递减规律的表现", "a": ["随着投资增加，预期利润率下降", "随着资本积累，工资水平上升", "随着产量增加，边际成本上升", "随着消费增加，边际效用下降", "", ""], "r": "A", "e": "资本边际效率递减指随着投资增加，资本品供给价格上升且预期收益下降，导致预期利润率下降。A选项符合。B说的是资本积累与工资关系；C是产量与边际成本；D是消费与边际效用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949379", "t": 1, "q": "消费者的无差异曲线向右下方倾斜的依据是", "a": ["边际效用递减规律", "边际替代率递减规律", "偏好的传递性", "偏好的非饱和性", "", ""], "r": "D", "e": "无差异曲线向右下方倾斜意味着要增加一种商品消费，就需减少另一种商品消费，这基于偏好的非饱和性，即消费者总是偏好更多商品。若不减少一种商品，增加另一种商品，消费者效用会增加，就不是无差异曲线了。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949380", "t": 1, "q": "总供给曲线垂直的区域对应的经济状态是？", "a": ["萧条状态", "复苏状态", "充分就业状态", "通货膨胀状态", "", ""], "r": "C", "e": "总供给曲线垂直时意味着无论价格如何变动，产出都不会改变，此时经济已达生产能力极限，处于充分就业状态。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949381", "t": 1, "q": "公共物品的主要特征是？", "a": ["竞争性和排他性", "非竞争性和排他性", "竞争性和非排他性", "非竞争性和非排他性", "", ""], "r": "D", "e": "公共物品是大家都能使用且一个人使用不影响他人使用，即消费上不具有竞争性；同时也无法阻止他人使用，即不具有排他性。所以公共物品主要特征是非竞争性和非排他性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949382", "t": 1, "q": "下列属于静态博弈的是？", "a": ["下棋", "重复囚徒困境", "古诺模型", "斯塔克尔伯格模型", "", ""], "r": "C", "e": "静态博弈是指参与者同时选择行动或虽非同时但后行动者并不知道先行动者采取了什么具体行动。古诺模型中，寡头厂商同时决定产量，符合静态博弈特征。下棋双方依次行动且能知晓对方行动；重复囚徒困境有多次博弈过程；斯塔克尔伯格模型中领导者先行动，追随者后行动且知晓前者行动，都不属于静态博弈。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949383", "t": 1, "q": "下列属于紧缩性货币政策的是？", "a": ["降低法定存款准备金率", "降低再贴现率", "公开市场上卖出有价证券", "增加货币供给", "", ""], "r": "C", "e": "紧缩性货币政策是减少货币供应量。A降低法定存款准备金率、B降低再贴现率、D增加货币供给都会使货币供应量增加。而公开市场卖出有价证券会回笼货币，减少货币供应量，属于紧缩性货币政策。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949384", "t": 1, "q": "在要素市场中，厂商对劳动力的需求曲线本质上是", "a": ["劳动力的边际产量曲线", "劳动力的边际收益产品曲线", "劳动力的平均产量曲线", "劳动力的平均收益产品曲线", "", ""], "r": "B", "e": "厂商对劳动力的需求取决于劳动力能为其带来的边际收益，边际收益产品曲线反映了增加一单位要素投入所增加的收益，所以厂商对劳动力的需求曲线本质上是劳动力的边际收益产品曲线。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949385", "t": 1, "q": "洛伦兹曲线越偏离对角线，说明社会收入分配状况？", "a": ["越平等", "越不平等", "处于中等平等程度", "无法判断", "", ""], "r": "B", "e": "洛伦兹曲线是衡量社会收入分配公平程度的工具，对角线代表绝对平等线，洛伦兹曲线越偏离对角线，意味着收入分配差距越大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949386", "t": 1, "q": "垄断厂商实行价格歧视的前提条件不包括", "a": ["市场具有可分割性", "各市场的需求价格弹性不同", "厂商具有垄断势力", "产品具有完全替代性", "", ""], "r": "D", "e": "垄断厂商实行价格歧视需有垄断势力，能分割市场且各市场需求价格弹性不同。而产品具有完全替代性不利于价格歧视，因为消费者可轻易在不同价格处购买。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949387", "t": 1, "q": "当经济处于萧条时期，凯恩斯主义主张采取的政策是？", "a": ["紧缩性财政政策和紧缩性货币政策", "扩张性财政政策和扩张性货币政策", "紧缩性财政政策和扩张性货币政策", "扩张性财政政策和紧缩性货币政策", "", ""], "r": "B", "e": "萧条时期需刺激经济，扩张性财政政策可增加政府支出、减少税收，刺激总需求；扩张性货币政策能增加货币供给，降低利率，促进投资和消费。所以应采取扩张性财政政策和扩张性货币政策。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949388", "t": 1, "q": "国民生产总值（GNP）与国内生产总值（GDP）的区别在于", "a": ["是否包含中间产品价值", "是否包含本国居民在国外的收入", "是否包含政府转移支付", "是否包含折旧", "", ""], "r": "B", "e": "GDP是国内生产概念，衡量国内生产的最终产品和服务价值；GNP是国民生产概念，包含本国居民在国内和国外创造的价值，区别在于是否包含本国居民在国外的收入。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949389", "t": 1, "q": "政府为解决垄断造成的市场失灵，可采取的政策是？", "a": ["对垄断厂商给予补贴", "实行价格管制", "鼓励垄断厂商扩大生产", "减少市场准入限制", "", ""], "r": "B", "e": "垄断导致市场失灵，政府可通过价格管制来限制垄断厂商定价，保障市场公平和效率。给垄断厂商补贴、鼓励其扩大生产会强化垄断；减少市场准入限制虽能一定程度缓解，但价格管制更直接针对垄断定价问题。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949390", "t": 1, "q": "根据奥肯定律，失业率每高于自然失业率1个百分点，实际GDP将低于潜在GDP", "a": ["1个百分点", "2个百分点", "3个百分点", "4个百分点", "", ""], "r": "B", "e": "奥肯定律表明失业率每高于自然失业率1个百分点，实际GDP将低于潜在GDP 2个百分点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949391", "t": 1, "q": "在完全垄断市场中，厂商实现利润最大化的条件是", "a": ["边际收益等于边际成本", "边际收益大于边际成本", "价格等于边际成本", "价格等于平均成本", "", ""], "r": "A", "e": "厂商（无论何种市场结构）实现利润最大化的通用条件就是边际收益等于边际成本。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949392", "t": 1, "q": "某行业中厂商的数量较多，产品存在一定差异但差异不大，厂商进出行业较容易，该行业属于", "a": ["完全竞争市场", "垄断竞争市场", "寡头垄断市场", "完全垄断市场", "", ""], "r": "B", "e": "完全竞争市场产品无差异；寡头垄断市场厂商数量少；完全垄断市场只有一家厂商。而垄断竞争市场厂商数量多，产品有一定差异，进出较容易。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949393", "t": 1, "q": "国内生产总值（GDP）核算中，下列哪项不计入GDP？", "a": ["居民购买的新住房", "政府购买的办公用品", "企业生产的库存商品", "家庭主妇的家务劳动", "", ""], "r": "D", "e": "GDP核算的是市场活动导致的价值。家庭主妇的家务劳动未进入市场交易，没有产生市场价值，不计入GDP。而居民购买新住房、政府购买办公用品、企业生产库存商品都涉及市场交易和价值创造，应计入GDP。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949394", "t": 1, "q": "在短期总供给曲线向右上方倾斜的情况下，总需求增加会导致", "a": ["价格水平上升，国民收入增加", "价格水平上升，国民收入减少", "价格水平下降，国民收入增加", "价格水平下降，国民收入减少", "", ""], "r": "A", "e": "总需求增加，需求曲线右移。在短期总供给曲线向右上方倾斜时，新的均衡点对应的价格和国民收入都会上升。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949395", "t": 1, "q": "若某商品的需求价格弹性为0.5，供给价格弹性为1.8，此时政府对该商品征收从量税，税负主要由", "a": ["消费者承担", "生产者承担", "消费者和生产者平均承担", "无法确定", "", ""], "r": "A", "e": "需求价格弹性小，供给价格弹性大时，税负主要由需求方即消费者承担。本题需求价格弹性0.5小于供给价格弹性1.8。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949396", "t": 1, "q": "消费函数C=a+bY中，b代表的是？", "a": ["自发消费", "边际消费倾向", "平均消费倾向", "边际储蓄倾向", "", ""], "r": "B", "e": "在消费函数C=a + bY里，a是自发消费，b是边际消费倾向，表示每增加一单位收入中用于消费的比例。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949397", "t": 1, "q": "生产函数Q=LK（L为劳动，K为资本）体现的是", "a": ["规模报酬递增", "规模报酬递减", "规模报酬不变", "边际报酬递减", "", ""], "r": "A", "e": "对于生产函数Q = LK，设劳动和资本都变为原来的t倍（t>1），则新的产量「test/yiwen_img/importSubject/2034818443349463040.png」，「test/yiwen_img/importSubject/2034818443626287104.png」，产量增加比例大于要素投入增加比例，是规模报酬递增。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949398", "t": 1, "q": "根据生命周期消费理论，消费者的消费决策主要取决于", "a": ["当期收入", "永久收入", "生命周期内的总收入", "边际消费倾向", "", ""], "r": "C", "e": "生命周期消费理论认为，人们会在更长时间范围内计划生活消费开支，以达到在整个生命周期内消费的最佳配置，所以消费者消费决策主要取决于生命周期内的总收入。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949399", "t": 1, "q": "在古诺模型中，寡头厂商的决策变量是", "a": ["价格", "产量", "广告支出", "产品差异化程度", "", ""], "r": "B", "e": "古诺模型假定厂商以产量为决策变量，通过调整产量来实现利润最大化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949400", "t": 1, "q": "索洛增长模型中，稳态时的人均产出增长率取决于？", "a": ["储蓄率", "人口增长率", "技术进步率", "资本折旧率", "", ""], "r": "C", "e": "索洛模型中，稳态时人均资本和人均产出不变，但考虑技术进步后，人均产出增长率取决于技术进步率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949401", "t": 1, "q": "边际产量曲线与平均产量曲线相交于", "a": ["平均产量曲线的最高点", "边际产量曲线的最高点", "平均产量曲线的最低点", "边际产量曲线的最低点", "", ""], "r": "A", "e": "当边际产量大于平均产量时，平均产量递增；当边际产量小于平均产量时，平均产量递减，所以二者相交于平均产量曲线最高点。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949402", "t": 1, "q": "下列哪种情况属于正外部性？", "a": ["工厂排放废气污染环境", "邻居在自家院子种植花草使周边空气清新", "消费者购买商品后产生的垃圾", "企业研发新技术但未申请专利被同行模仿", "", ""], "r": "B", "e": "正外部性是指某个经济行为个体的活动使他人或社会受益，而受益者无须花费代价。B选项中邻居种花草让周边空气清新，使周边人受益且周边人无需付出代价，属于正外部性。A是负外部性，工厂污染使他人受损；C消费者产生垃圾一般是给环境带来负面影响，属于负外部性；D企业研发成果被模仿，企业利益受损，不是正外部性。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949403", "t": 1, "q": "完全竞争厂商在短期均衡时，若平均可变成本低于价格但平均成本高于价格，厂商会", "a": ["停止生产", "继续生产", "扩大生产规模", "退出行业", "", ""], "r": "B", "e": "当平均可变成本低于价格，意味着厂商生产能弥补可变成本且有部分收益可弥补固定成本，此时继续生产比停止生产损失小，所以会继续生产。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949404", "t": 1, "q": "某商品的需求价格弹性系数为0.8，若厂商想提高销售收入，应采取的策略是？", "a": ["提高价格", "降低价格", "保持价格不变", "先提价后降价", "", ""], "r": "A", "e": "需求价格弹性系数小于1，说明需求缺乏弹性。对于需求缺乏弹性的商品，价格与销售收入呈同方向变动，提价可增加销售收入。所以厂商想提高销售收入应采取提高价格的策略。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949405", "t": 1, "q": "边际消费倾向与边际储蓄倾向的关系是？", "a": ["两者之和为1", "两者之和为0", "两者之比为1", "两者之差为1", "", ""], "r": "A", "e": "收入要么用于消费，要么用于储蓄，边际消费倾向和边际储蓄倾向分别是消费和储蓄变动量与收入变动量的比率，所以二者之和为 1。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949406", "t": 1, "q": "在短期生产中，随着可变要素投入量的增加，边际产量先上升后下降的原因是", "a": ["规模报酬递减", "边际技术替代率递减", "边际报酬递减规律", "机会成本递增", "", ""], "r": "C", "e": "边际产量先升后降是边际报酬递减规律的体现，该规律指在短期生产中，其他条件不变时，连续增加一种可变要素投入，开始时边际产量递增，超过一定限度后边际产量递减。A规模报酬递减针对长期生产规模变化；B边际技术替代率递减是两种要素替代关系；D机会成本递增与边际产量变化无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949407", "t": 1, "q": "在囚徒困境博弈中，纳什均衡的结果是", "a": ["双方都选择合作，实现共同最优", "双方都选择背叛，实现个人最优但集体次优", "一方合作一方背叛，背叛者获得最大收益", "双方随机选择策略，收益不确定", "", ""], "r": "B", "e": "囚徒困境中，每个囚徒为追求个人利益最大化会选择背叛，最终双方都背叛，这对个人是最优策略，但整体收益并非最优，是集体次优。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949408", "t": 1, "q": "下列属于自动稳定器的财政政策工具是", "a": ["政府购买支出", "公债发行", "个人所得税", "政府转移支付", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949409", "t": 1, "q": "失业率的计算公式是？", "a": ["失业人数除以总人口", "失业人数除以劳动力总人口", "失业人数除以就业人数", "就业人数除以劳动力总人口", "", ""], "r": "B", "e": "失业率是指失业人口占劳动力人口的比率。劳动力人口是指年龄处于适合参加劳动的阶段，作为生产者统计的人口。所以失业率是失业人数除以劳动力总人口。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949410", "t": 1, "q": "下列属于动态博弈的是？", "a": ["囚徒困境", "古诺模型", "斯塔克尔伯格模型", "Bertrand模型", "", ""], "r": "C", "e": "动态博弈是指参与人的行动有先后顺序，且后行动者能观察到先行动者的行动。斯塔克尔伯格模型中企业行动有先后顺序，先行动企业决策后，后行动企业根据其决策再做决策，属于动态博弈。而囚徒困境、古诺模型、Bertrand模型一般是静态博弈。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818448734949411", "t": 1, "q": "国内生产总值（GDP）核算中，下列哪项不计入当期GDP", "a": ["当期生产的家电产品", "居民购买的二手住房", "政府购买的办公设备", "企业投资的新厂房", "", ""], "r": "B", "e": "GDP核算的是当期生产的最终产品和服务的价值。二手住房是过去生产的，其价值已在生产时计入过GDP，再次交易不计入当期GDP。而当期生产家电、政府购办公设备、企业投资新厂房都属于当期生产活动，计入当期GDP。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148224", "t": 2, "q": "下列属于摩擦性失业的特点有？", "a": ["失业持续时间较短", "失业者有就业意愿", "是一种正常的失业现象", "与经济周期相关", "", ""], "r": "ABC", "e": "摩擦性失业是劳动者正常流动或新加入劳动力市场等原因造成的短期失业，失业者有就业意愿，是正常现象且与经济周期无关。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148225", "t": 2, "q": "下列属于公共物品的特征有", "a": ["非排他性", "排他性", "非竞争性", "竞争性", "", ""], "r": "AC", "e": "公共物品具有非排他性和非竞争性的特征。非排他性指无法排除他人使用，非竞争性指一个人使用不影响他人使用。而排他性和竞争性是私人物品的特点。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148226", "t": 2, "q": "影响汇率变动的因素有", "a": ["两国通货膨胀率差异", "两国利率差异", "国际收支状况", "政府干预", "", ""], "r": "ABCD", "e": "通货膨胀率差异影响货币购买力和商品竞争力从而影响汇率；利率差异会引起资本流动影响汇率；国际收支状况反映外汇供求影响汇率；政府可通过政策干预汇率。ABCD 选项都会影响汇率变动。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148227", "t": 2, "q": "下列属于市场机制发挥作用的条件有？", "a": ["产权明晰", "市场竞争充分", "信息对称", "不存在外部性", "", ""], "r": "ABCD", "e": "市场机制要有效发挥作用，产权明晰能明确市场主体权责，保障交易正常进行；充分的市场竞争可促使资源优化配置；信息对称能让市场主体做出合理决策；不存在外部性可避免市场失灵。这四个条件都利于市场机制发挥作用。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148228", "t": 2, "q": "公共物品的特征有", "a": ["非排他性", "排他性", "非竞争性", "竞争性", "", ""], "r": "AC", "e": "公共物品具有非排他性，即无法排除他人使用；还具有非竞争性，即一个人使用不影响他人使用。而排他性和竞争性是私人物品的特征。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148229", "t": 2, "q": "博弈论中，构成一个博弈的基本要素包括？", "a": ["参与者", "策略", "支付", "均衡", "", ""], "r": "ABC", "e": "博弈的基本要素有参与者、策略和支付，均衡是博弈分析得出的结果而非基本构成要素。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148230", "t": 2, "q": "通货膨胀的成因包括", "a": ["需求拉上型通货膨胀", "成本推动型通货膨胀", "结构型通货膨胀", "货币供给过多型通货膨胀", "", ""], "r": "ABCD", "e": "通货膨胀成因多样，需求拉上、成本推动、经济结构变动以及货币供给过多都可能引发。ABCD选项分别对应不同成因类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148231", "t": 2, "q": "影响总需求的因素包括？", "a": ["消费", "投资", "政府购买", "净出口", "", ""], "r": "ABCD", "e": "总需求是指一个国家或地区在一定时期内（通常为一年）由社会可用于投资和消费的支出所实际形成的对产品和劳务的购买力总量，包括消费、投资、政府购买和净出口。ABCD四个选项均符合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148232", "t": 2, "q": "下列关于宏观经济政策目标的说法，正确的有？", "a": ["充分就业是指失业率为零", "物价稳定是指物价水平固定不变", "经济增长是指实际GDP的增长", "国际收支平衡是指进出口额相等", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148233", "t": 2, "q": "影响供给价格弹性的因素有", "a": ["生产周期长短", "生产要素的可替代性", "产品的用途多少", "厂商调整产量的难易程度", "", ""], "r": "ABD", "e": "生产周期长短影响厂商调整产量速度，生产要素可替代性影响成本调整，厂商调整产量难易程度直接关联供给对价格反应，这些都会影响供给价格弹性；而产品用途多少主要影响需求价格弹性。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148234", "t": 2, "q": "寡头垄断市场的特点有？", "a": ["厂商数量较少", "产品可能同质也可能有差异", "厂商之间相互依存", "厂商进出市场困难", "", ""], "r": "ABCD", "e": "寡头垄断市场是少数几家厂商控制整个市场产品生产和销售的市场结构，所以厂商数量少；产品可以是同质的，如钢铁等，也能有差异，如汽车；由于厂商少，一家厂商决策会影响其他厂商，所以相互依存；存在规模经济等进入障碍，厂商进出市场困难。ABCD 均符合寡头垄断市场特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148235", "t": 2, "q": "影响需求变动的非价格因素包括？", "a": ["消费者收入", "消费者偏好", "相关商品价格", "商品自身价格", "", ""], "r": "ABC", "e": "商品自身价格影响的是需求量变动，而不是需求变动。消费者收入、偏好以及相关商品价格等非商品自身价格因素会使需求曲线移动，影响需求变动。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148236", "t": 2, "q": "影响经济增长的制度因素包括？", "a": ["产权制度", "市场制度", "税收制度", "金融制度", "", ""], "r": "ABCD", "e": "产权制度明确产权归属，激励经济主体；市场制度保障市场有效运行；税收制度影响资源配置和经济主体行为；金融制度为经济提供资金支持等，这些制度都对经济增长有重要影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148237", "t": 2, "q": "完全竞争市场的特征包括", "a": ["厂商数量众多", "产品同质无差异", "厂商进出市场自由", "信息完全对称", "", ""], "r": "ABCD", "e": "完全竞争市场是一种理想化市场，其特点是厂商多，大家卖的产品一样，进出市场没障碍，信息透明对称。ABCD四个选项均符合完全竞争市场特征。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148238", "t": 2, "q": "下列属于生产要素的有？", "a": ["劳动", "资本", "土地", "企业家才能", "", ""], "r": "ABCD", "e": "生产要素是进行生产经营活动时所需要的各种社会资源。劳动、资本、土地和企业家才能是传统经济学中常见的生产要素。ABCD四个选项均符合生产要素的定义。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148239", "t": 2, "q": "经济增长的衡量指标有", "a": ["国内生产总值增长率", "人均国内生产总值增长率", "国民生产总值增长率", "通货膨胀率", "", ""], "r": "ABC", "e": "国内生产总值、人均国内生产总值、国民生产总值的增长率都能反映经济增长情况，而通货膨胀率主要体现物价变动，并非经济增长衡量指标。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148240", "t": 2, "q": "市场失灵的表现形式有", "a": ["公共物品供给不足", "垄断导致效率损失", "外部性引发资源配置失当", "信息不对称导致逆向选择", "", ""], "r": "ABCD", "e": "市场失灵是指市场机制不能充分发挥作用而导致的资源配置缺乏效率或资源配置失当的情况。公共物品因非竞争性和非排他性易供给不足；垄断阻碍竞争使效率受损；外部性影响他人利益致资源配置失当；信息不对称会引发逆向选择等问题。ABCD选项均是市场失灵的表现形式。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148241", "t": 2, "q": "货币政策的传导机制包括？", "a": ["利率传导机制", "资产价格传导机制", "汇率传导机制", "信贷传导机制", "", ""], "r": "ABCD", "e": "货币政策传导机制是指中央银行运用货币政策工具影响中介指标，进而最终实现既定政策目标的传导途径与作用机理。常见的传导机制有利率、资产价格、汇率、信贷传导机制等。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148242", "t": 2, "q": "下列属于短期成本曲线的有？", "a": ["平均固定成本曲线", "平均可变成本曲线", "边际成本曲线", "长期平均成本曲线", "", ""], "r": "ABC", "e": "短期成本曲线包含平均固定成本曲线、平均可变成本曲线、边际成本曲线等。而长期平均成本曲线是长期成本曲线，并非短期成本曲线。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148243", "t": 2, "q": "下列关于边际消费倾向的说法正确的有？", "a": ["边际消费倾向介于0和1之间", "边际消费倾向越大，乘数效应越明显", "边际消费倾向与收入水平正相关", "边际消费倾向是消费曲线的斜率", "", ""], "r": "ABD", "e": "边际消费倾向是增加的消费与增加的收入之比率，介于0和1之间，A正确；乘数与边际消费倾向有关，边际消费倾向越大，乘数效应越明显，B正确；边际消费倾向随收入增加而递减，并非与收入水平正相关，C错误；边际消费倾向就是消费曲线的斜率，D正确。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148244", "t": 2, "q": "短期总供给曲线向上倾斜的原因有", "a": ["粘性工资理论", "粘性价格理论", "错觉理论", "古典二分法", "", ""], "r": "ABC", "e": "短期总供给曲线向上倾斜可用粘性工资理论、粘性价格理论和错觉理论来解释，而古典二分法是指名义变量和实际变量的分离，与短期总供给曲线向上倾斜无关。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148245", "t": 2, "q": "下列属于成本推动型通货膨胀的类型有", "a": ["工资推动型通货膨胀", "利润推动型通货膨胀", "需求拉动型通货膨胀", "进口成本推动型通货膨胀", "", ""], "r": "ABD", "e": "成本推动型通胀是因成本上升推动物价上涨。工资、利润、进口成本上升都可能推动成本增加引发通胀。而需求拉动型通胀与成本推动是不同类型。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148246", "t": 2, "q": "影响经济增长的因素包括？", "a": ["资本积累", "劳动力数量增加", "技术进步", "制度创新", "", ""], "r": "ABCD", "e": "资本积累能提供物质基础，劳动力数量增加可提供人力支持，技术进步是关键动力，制度创新能营造良好环境，它们都对经济增长有重要影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148247", "t": 2, "q": "需求曲线向右下方倾斜的原因有", "a": ["边际效用递减规律", "替代效应", "收入效应", "规模报酬递减规律", "", ""], "r": "ABC", "e": "需求曲线向右下方倾斜表明价格与需求量呈反向变动。边际效用递减使消费者随消费数量增加愿意支付价格降低；替代效应下，价格上升消费者会用其他商品替代，需求量降低；收入效应中，价格上升实际收入下降，需求量减少。而规模报酬递减规律是关于生产的，与需求曲线无关。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148248", "t": 2, "q": "扩张性货币政策的工具包括？", "a": ["降低法定存款准备金率", "降低再贴现率", "中央银行卖出有价证券", "中央银行买入有价证券", "", ""], "r": "ABD", "e": "扩张性货币政策是增加货币供应量以刺激经济。降低法定存款准备金率，银行可放贷资金增多，货币供给增加；降低再贴现率，鼓励商业银行向央行借款，增加货币供给；中央银行买入有价证券，向市场投放货币。而卖出有价证券是回笼货币，属紧缩性政策。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148249", "t": 2, "q": "下列属于公共物品供给方式的有", "a": ["政府直接供给", "私人企业供给", "政府与私人合作供给", "社区自主供给", "", ""], "r": "ABCD", "e": "公共物品供给方式多样，政府可直接供给，也能和私人合作供给，私人企业以及社区也可参与供给。ABCD四个选项均符合。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148250", "t": 2, "q": "市场失灵的表现形式有", "a": ["公共物品供给不足", "外部性导致资源配置失当", "信息不对称导致市场效率低下", "垄断导致产量不足、价格过高", "", ""], "r": "ABCD", "e": "市场失灵是指由于市场机制不能充分地发挥作用而导致的资源配置缺乏效率或资源配置失当的情况。公共物品具有非竞争性和非排他性，会出现供给不足；外部性使私人成本与社会成本、私人收益与社会收益不一致，造成资源配置失当；信息不对称会让市场交易难以有效进行，导致效率低下；垄断企业会限制产量、抬高价格。ABCD选项都属于市场失灵的表现形式。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148251", "t": 2, "q": "影响需求价格弹性的因素有", "a": ["商品的可替代性", "商品的用途广泛性", "商品的消费支出占收入的比重", "商品的使用时间长短", "", ""], "r": "ABCD", "e": "以上四个因素都会影响需求价格弹性。可替代性越强、用途越广泛、消费支出占收入比重越大、使用时间越长，需求价格弹性通常越大。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148252", "t": 2, "q": "下列属于固定成本的有", "a": ["厂房租金", "机器设备折旧", "生产工人工资", "原材料费用", "", ""], "r": "AB", "e": "固定成本是不随产量变动而变动的成本。厂房租金和机器设备折旧不随产量变化，属于固定成本；生产工人工资和原材料费用会随产量变动，是变动成本。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148253", "t": 2, "q": "下列属于生产要素的有", "a": ["劳动", "资本", "土地", "企业家才能", "", ""], "r": "ABCD", "e": "生产要素是进行社会生产经营活动时所需要的各种社会资源。劳动、资本、土地、企业家才能均是常见的生产要素。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148254", "t": 2, "q": "下列关于帕累托改进的说法，正确的有？", "a": ["帕累托改进是指在不损害他人福利的情况下，提高至少一个人的福利", "帕累托改进存在时，资源配置未达到最优", "帕累托改进的结果是帕累托最优", "帕累托改进可以无限进行", "", ""], "r": "ABC", "e": "帕累托改进是不损人而利己的改进，存在帕累托改进说明资源配置还有优化空间，未达最优，改进到无法再改进就是帕累托最优，它不能无限进行。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148255", "t": 2, "q": "寡头垄断市场的常见模型有", "a": ["古诺模型", "斯塔克尔伯格模型", "伯特兰模型", "囚徒困境模型", "", ""], "r": "ABC", "e": "古诺、斯塔克尔伯格、伯特兰模型都是寡头垄断市场中分析企业决策和竞争的常见模型，而囚徒困境模型主要用于博弈论分析，并非寡头垄断市场常见模型。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148256", "t": 2, "q": "下列属于低档商品的有？", "a": ["劣质面粉", "二手衣物", "奢侈品", "普通大米", "", ""], "r": "AB", "e": "低档商品是指随着收入增加，需求反而减少的商品。A劣质面粉、B二手衣物通常在人们收入提高时需求会降低，属于低档商品；C奢侈品是随着收入增加需求增加的高档商品；D普通大米是生活必需品，需求较稳定，不属于低档商品。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148257", "t": 2, "q": "生产要素的需求具有的特点有", "a": ["派生性", "联合性", "引致性", "独立性", "", ""], "r": "ABC", "e": "生产要素需求是从消费者对产品的直接需求中派生出来的，具有派生性（引致性），且生产中各种生产要素需相互配合使用，具有联合性，并非独立的。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818451092148258", "t": 2, "q": "下列属于扩张性货币政策工具的有", "a": ["降低再贴现率", "公开市场上买入债券", "提高法定存款准备金率", "降低基准利率", "", ""], "r": "ABD", "e": "扩张性货币政策是增加货币供应量以刺激经济。降低再贴现率、公开市场买入债券、降低基准利率都会增加货币供给；而提高法定存款准备金率会减少货币供给。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742592", "t": 3, "q": "信息不对称会导致逆向选择和道德风险，从而降低市场效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "信息不对称时，掌握信息少的一方做出不利于自己的选择即逆向选择，拥有信息优势的一方为自身利益损害他人利益即道德风险，这两种情况都会干扰市场正常运行，降低市场效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742593", "t": 3, "q": "失业率是指失业人口与总人口的比率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "失业率是指失业人口占劳动力人口（就业人口与失业人口之和）的比率，而非与总人口的比率。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742594", "t": 3, "q": "经济增长必然导致经济发展。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "经济增长主要指数量上的增加，而经济发展除数量增长外，还包括经济结构优化、生活质量提升等多方面。有经济增长不一定就有经济结构改善等发展层面的进步。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742595", "t": 3, "q": "寡头垄断市场中，厂商之间的合作是稳定的，不会出现违约行为。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "寡头垄断市场中，厂商为自身利益最大化，有违约获取更多利润的动机，合作不稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742596", "t": 3, "q": "长期菲利普斯曲线是向右下方倾斜的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "长期菲利普斯曲线是垂直于自然失业率水平的垂线，并非向右下方倾斜。它表明在长期中，失业与通货膨胀之间不存在替代关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742597", "t": 3, "q": "内生增长理论认为，经济增长的主要动力是外生的技术进步和人口增长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "内生增长理论强调经济增长是由内生因素决定的，如技术创新、人力资本积累等，而非外生的技术进步和人口增长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742598", "t": 3, "q": "需求价格弹性的绝对值越大，说明商品的需求对价格变动越不敏感。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "需求价格弹性绝对值越大，意味着价格变动一点，需求量变动幅度大，即商品需求对价格变动越敏感，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742599", "t": 3, "q": "需求的变动与需求量的变动是同一概念，都是指商品购买数量的变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "需求变动是商品自身价格以外其他因素变化引起需求曲线的移动；需求量变动是商品自身价格变动引起沿着需求曲线的移动，二者不是同一概念。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742600", "t": 3, "q": "结构性失业是由于经济周期波动导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "结构性失业是因经济结构变化、产业兴衰转移造成劳动力供给与需求不匹配导致的，而经济周期波动导致的是周期性失业，并非结构性失业。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742601", "t": 3, "q": "经济增长的本质是潜在产出的增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "经济增长从长期看，主要体现为潜在产出的增加，潜在产出代表了一个经济体在充分利用资源和技术条件下能够持续生产的最大产出水平，经济增长的核心就是不断提升这种潜在生产能力。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742602", "t": 3, "q": "国内生产总值（GDP）是衡量一个国家经济总量的核心指标，它包括本国公民在国外创造的价值，不包括外国公民在本国创造的价值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "GDP是指一个国家（或地区）所有常住单位在一定时期内生产活动的最终成果。它包括外国公民在本国创造的价值，但不包括本国公民在国外创造的价值，本题说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742603", "t": 3, "q": "博弈论中的\"占优策略\"是指无论对方采取什么策略，对己方都是最优的策略。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是占优策略的标准定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742604", "t": 3, "q": "通货膨胀会使债权人受益，债务人受损。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "通货膨胀时物价上涨、货币贬值，债务人用贬值后的货币偿还债务，相当于少还了钱，而债权人收回的钱实际购买力下降，所以是债务人受益，债权人受损。", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742605", "t": 3, "q": "货币政策的时滞效应比财政政策更长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742606", "t": 3, "q": "需求曲线的移动是由商品自身价格变动引起的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "需求曲线移动是由商品自身价格以外的因素（如消费者收入、偏好、相关商品价格等）变动引起的，而商品自身价格变动会引起需求量沿着需求曲线移动，并非需求曲线移动。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742607", "t": 3, "q": "实际GDP等于名义GDP除以GDP平减指数，GDP平减指数反映了物价水平的变动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据公式，实际GDP = 名义GDP / GDP平减指数，且GDP平减指数是衡量物价总水平变动的指标。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742608", "t": 3, "q": "外部经济是指经济主体的行为对他人造成不利影响但未承担相应成本。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。外部经济是指经济主体的行为使他人受益，而受益者无须花费代价；题干描述的是外部不经济，即经济主体的行为对他人造成不利影响但未承担相应成本。所以答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742609", "t": 3, "q": "博弈论中的\"囚徒困境\"说明个人理性与集体理性可能存在冲突。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“囚徒困境”里，每个囚徒从个人理性出发选择对自己有利策略，但最终结果却不如双方合作，体现个人理性和集体理性冲突。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742610", "t": 3, "q": "短期中，厂商的平均可变成本最低点是停止营业点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在短期，当价格等于平均可变成本最低点时，厂商生产和不生产的损失相同，若价格低于此点，厂商生产亏损更大，会选择停止营业，所以平均可变成本最低点是停止营业点。", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742611", "t": 3, "q": "经济增长的本质是生产能力的提升，表现为实际GDP的持续增长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "经济增长核心就是生产能力不断提高，而实际GDP能排除价格因素反映产出实际变化，其持续增长是经济增长的重要表现。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742612", "t": 3, "q": "汇率贬值一定会导致出口增加、进口减少。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "汇率贬值不一定必然使出口增加、进口减少。出口增加还受国外市场需求弹性、国内产业供给能力等因素影响；进口减少也受国内对进口品需求刚性等因素制约。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742613", "t": 3, "q": "垄断厂商的平均收益曲线与需求曲线重合，边际收益曲线位于平均收益曲线下方。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "垄断厂商面临的需求曲线就是市场需求曲线，平均收益等于总收益除以产量，即 AR = TR/Q = P×Q/Q = P ，所以平均收益曲线与需求曲线重合。根据边际收益与平均收益关系，当平均收益递减时，边际收益小于平均收益，所以边际收益曲线位于平均收益曲线下方。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742614", "t": 3, "q": "消费者的预算线反映了消费者的偏好，无差异曲线反映了消费者的支付能力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "预算线反映的是消费者的支付能力，即消费者在既定收入和商品价格下能购买的商品组合；无差异曲线反映的是消费者的偏好，即能给消费者带来相同满足程度的不同商品组合。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742615", "t": 3, "q": "洛伦兹曲线越靠近对角线，基尼系数越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "洛伦兹曲线越靠近对角线，表明收入分配越趋于平等，而基尼系数是衡量收入分配不平等程度的指标，收入分配越平等，基尼系数越小。所以该表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742616", "t": 3, "q": "无差异曲线的斜率绝对值等于两种商品的边际替代率，边际替代率递减导致无差异曲线凸向原点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "无差异曲线斜率绝对值就是两种商品边际替代率，且边际替代率递减规律使得无差异曲线凸向原点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742617", "t": 3, "q": "寡头垄断市场中，厂商的决策相互独立，不受其他厂商影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "寡头垄断市场中，厂商数量较少，一家厂商的决策会对其他厂商产生重大影响，所以各厂商决策相互依存，并非相互独立。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742618", "t": 3, "q": "边际技术替代率递减规律是由于边际报酬递减规律导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边际报酬递减意味着一种要素投入增加时，其边际产量会逐渐下降。在维持产量不变时，要减少一种要素投入，需增加另一种要素投入，且随着一种要素投入不断减少，其边际产量递增，另一种要素边际产量递减，所以边际技术替代率递减，即边际技术替代率递减规律由边际报酬递减规律导致。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742619", "t": 3, "q": "外部经济会导致产品的市场供给量大于社会最优供给量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "外部经济时，私人收益小于社会收益，生产者仅考虑私人收益，生产积极性不足，会使产品的市场供给量小于社会最优供给量，而不是大于。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742620", "t": 3, "q": "中央银行提高法定存款准备金率会增加货币供应量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "法定存款准备金率提高，商业银行可用于放贷的资金减少，货币创造能力下降，会使货币供应量减少，而不是增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742621", "t": 3, "q": "政府购买支出乘数大于税收乘数，是因为政府购买直接计入总需求，而税收通过影响可支配收入间接影响总需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "政府购买支出直接作用于总需求，会使总需求等额增加；税收则是先影响居民可支配收入，再影响消费和总需求，存在传导过程。根据乘数公式，政府购买支出乘数为1/(1 - β)，税收乘数为-β/(1 - β) （β为边际消费倾向），所以政府购买支出乘数大于税收乘数。", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742622", "t": 3, "q": "洛伦兹曲线越靠近对角线，说明收入分配越不平等。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "洛伦兹曲线越靠近对角线，表明收入分配越平等；越远离对角线，收入分配越不平等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742623", "t": 3, "q": "价格歧视的实施前提是厂商拥有市场势力，且能区分不同消费者群体。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "价格歧视指厂商以不同价格销售同一种产品。厂商要实施价格歧视，首先得有市场势力来控制价格，若处于完全竞争市场只能接受既定价格，无法歧视定价。同时，需能区分不同消费者群体，了解各群体需求弹性等差异，才能对不同群体定不同价格。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742624", "t": 3, "q": "长期菲利普斯曲线表明，货币政策在长期内可以影响失业率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "长期菲利普斯曲线是垂直的，意味着长期中失业率与通货膨胀率无关，货币政策只能影响通货膨胀率，不能影响失业率。", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742625", "t": 3, "q": "边际效用递减规律说明，随着商品消费量的增加，总效用会不断减少。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边际效用递减规律指在一定时间内，在其他商品的消费数量保持不变的条件下，随着消费者对某种商品消费量的增加，消费者从该商品连续增加的每一消费单位中所得到的效用增量即边际效用是递减的，但总效用是先增加后可能不变或减少，并非随消费量增加就不断减少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742626", "t": 3, "q": "生产要素的边际收益产品曲线是向右下方倾斜的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边际收益产品等于边际产量与边际收益的乘积，由于边际报酬递减规律，随着要素投入增加，边际产量递减，所以边际收益产品也会递减，其曲线表现为向右下方倾斜。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742627", "t": 3, "q": "国民生产总值（GNP）大于国内生产总值（GDP），说明本国公民在国外创造的价值大于外国公民在本国创造的价值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GNP是国民概念，是一个国家（或地区）的国民在一定时期（通常为一年）内所生产的最终产品和服务的市场价值总和；GDP是地域概念，是一个国家（或地区）领土范围内，本国（或地区）居民和外国居民在一定时期内所生产和提供的最终产品和服务的市场价值总和。GNP = GDP+本国公民在国外创造的价值 - 外国公民在本国创造的价值，当GNP大于GDP时，意味着本国公民在国外创造的价值大于外国公民在本国创造的价值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742628", "t": 3, "q": "人力资本是指劳动者通过教育、培训等积累的知识和技能，是经济增长的重要源泉。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "人力资本的确是劳动者通过教育、培训等方式积累的知识和技能，它在推动经济增长中扮演着重要角色，是经济增长的关键要素之一。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742629", "t": 3, "q": "边际消费倾向越大，乘数效应越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边际消费倾向越大，乘数越大，乘数效应也就越大。因为乘数公式为k = 1/(1 - MPC)（MPC是边际消费倾向），MPC越大，1 - MPC越小，1/(1 - MPC)越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742630", "t": 3, "q": "帕累托最优状态是指不存在任何帕累托改进的可能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "帕累托最优就是资源分配达到一种理想状态，在这种状态下，不可能再使某些人的境况变好而不使其他人的境况变差，也就是不存在帕累托改进的可能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742631", "t": 3, "q": "需求拉上型通货膨胀是由于成本上升导致物价总水平上涨。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。需求拉上型通货膨胀是指总需求超过总供给所引起的价格水平的持续显著上涨，而成本上升导致物价总水平上涨是成本推动型通货膨胀，并非需求拉上型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742632", "t": 3, "q": "需求价格弹性为零的商品，其需求曲线是垂直的，价格变动不会引起需求量变动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "需求价格弹性为零意味着需求量对价格变动毫无反应，无论价格如何变化，需求量都固定不变，这种情况下需求曲线是垂直于横轴的直线。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742633", "t": 3, "q": "负外部性会导致产品的需求量过多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "负外部性指某经济行为给外部带来不利影响，使得社会成本大于私人成本。生产者仅考虑私人成本进行生产，会生产过多产品，对应市场上就是产品供给过多而非需求量过多。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742634", "t": 3, "q": "经济周期的繁荣阶段，失业率上升，通货膨胀率下降。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在经济周期的繁荣阶段，经济活动活跃，企业生产扩张，对劳动力需求增加，失业率会下降；同时需求旺盛，物价上涨，通货膨胀率上升，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742635", "t": 3, "q": "货币政策的时滞效应比财政政策更长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742636", "t": 3, "q": "规模报酬递减是指随着生产规模扩大，总产量不断减少。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "规模报酬递减指产量增加的比例小于生产要素增加的比例，而非总产量不断减少。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742637", "t": 3, "q": "信息不对称会导致逆向选择和道德风险问题。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "信息不对称指交易中一方比另一方拥有更多信息。这会使掌握信息少的一方做出不利选择即逆向选择，也会让掌握信息多的一方为自身利益采取不利于对方的行为即道德风险。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742638", "t": 3, "q": "市场失灵时，政府干预一定能提高资源配置效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "市场失灵时政府干预不一定能提高资源配置效率，政府干预也存在局限性，可能出现政府失灵等情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742639", "t": 3, "q": "吉芬商品的需求曲线向右上方倾斜，是因为其收入效应大于替代效应。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "吉芬商品是一种特殊的低档商品，价格上升时，替代效应使需求量减少，收入效应使需求量增加，且收入效应大于替代效应，导致总效应是需求量随价格上升而增加，所以需求曲线向右上方倾斜。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742640", "t": 3, "q": "实际GDP等于名义GDP除以GDP平减指数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GDP平减指数=名义GDP/实际GDP，经过变形可得实际GDP =名义GDP/GDP平减指数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742641", "t": 3, "q": "静态博弈中，参与者的决策顺序不影响博弈结果。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818452421742642", "t": 3, "q": "短期总需求曲线向右下方倾斜是因为价格水平上升会导致实际货币余额减少。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "价格水平上升使实际货币余额减少，利率上升，投资和消费减少，总需求下降，所以短期总需求曲线向右下方倾斜。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 金融学（1）", "n": "基础练习题【含解析】 / 第2章 金融学（1）", "qs": [{"id": "2034818457643651072", "t": 1, "q": "下列金融监管措施中，属于预防性监管的是", "a": ["对濒临破产的金融机构进行接管", "规定商业银行的资本充足率", "对金融机构违规行为进行罚款", "建立存款保险制度", "", ""], "r": "B", "e": "预防性监管是在金融机构经营出现问题前采取的监管措施，目的是防患于未然。规定商业银行的资本充足率可增强银行抵御风险能力，属于事前预防性监管。A是事后救助措施；C是对违规行为的处罚；D是事后保护存款人利益的制度。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651073", "t": 1, "q": "某投资者将1000元存入银行，年利率为5%，按单利计息，5年后可获得的利息总额为多少元？", "a": ["250", "276.28", "500", "1250", "", ""], "r": "A", "e": "单利利息公式为「test/yiwen_img/importSubject/2034818454200127488.png」，其中P为本金，r为年利率，n为年数。本题P = 1000元，「test/yiwen_img/importSubject/2034818454514700288.png」，n = 5年，代入可得利息「test/yiwen_img/importSubject/2034818454598586368.png」元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651074", "t": 1, "q": "关于金融发展与经济增长的关系，下列理论中主张\"金融发展是经济增长的必要条件\"的是？", "a": ["金融抑制理论", "金融深化理论", "理性预期理论", "有效市场假说", "", ""], "r": "B", "e": "金融深化理论强调金融发展能促进经济增长，认为金融发展是经济增长的必要条件。而金融抑制理论指出金融抑制阻碍经济增长；理性预期理论侧重于经济主体的预期；有效市场假说关注市场效率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651075", "t": 1, "q": "某金融机构因借款人违约导致贷款无法收回，该风险属于？", "a": ["市场风险", "信用风险", "操作风险", "流动性风险", "", ""], "r": "B", "e": "借款人违约无法还款是由于其信用问题，所以该风险属于信用风险。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651076", "t": 1, "q": "中央银行实施货币政策的三大传统工具不包括（　）", "a": ["法定存款准备金率", "再贴现率", "公开市场业务", "道义劝告", "", ""], "r": "D", "e": "法定存款准备金率、再贴现率、公开市场业务是央行货币政策三大传统工具，道义劝告是补充性货币政策工具。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651077", "t": 1, "q": "下列信用形式中，属于国家信用的是？", "a": ["企业发行债券", "商业银行发放贷款", "政府发行国债", "个人之间的借贷", "", ""], "r": "C", "e": "国家信用是以国家为主体进行的信用活动。政府发行国债是国家以债务人身份筹集资金，属于国家信用。企业发行债券是企业信用；商业银行发放贷款是银行信用；个人之间借贷是民间信用。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651078", "t": 1, "q": "金融科技的核心技术不包括？", "a": ["大数据", "区块链", "人工智能", "传统票据交换技术", "", ""], "r": "D", "e": "金融科技核心技术主要有大数据、区块链、人工智能等前沿技术，传统票据交换技术是传统金融手段，不属于金融科技核心技术。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651079", "t": 1, "q": "在金融风险度量中，VaR（风险价值）指标的核心是衡量", "a": ["金融资产的最大可能损失", "金融资产的平均损失", "金融资产在一定置信水平下的最大可能损失", "金融资产的损失概率", "", ""], "r": "C", "e": "VaR是指在一定的置信水平下和给定的时间区间内，利率、汇率等市场风险要素发生变化时可能对某项资金头寸、资产组合或机构造成的潜在最大损失。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651080", "t": 1, "q": "下列属于我国政策性银行的是（　）", "a": ["中国工商银行", "中国农业发展银行", "中国建设银行", "招商银行", "", ""], "r": "B", "e": "我国政策性银行有国家开发银行、中国进出口银行、中国农业发展银行。选项中中国农业发展银行是政策性银行，而中国工商银行、中国建设银行是国有商业银行，招商银行是股份制商业银行。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651081", "t": 1, "q": "下列金融风险中，属于系统性风险的是", "a": ["某银行因内部控制缺陷导致的操作风险", "某上市公司财务造假引发的信用风险", "经济衰退导致的市场整体下跌风险", "某证券公司因流动性不足引发的流动性风险", "", ""], "r": "C", "e": "系统性风险是影响整个市场的风险，无法通过分散投资来消除。A、B、D选项都是特定金融机构或企业的个别风险。而经济衰退影响市场整体，属于系统性风险。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651082", "t": 1, "q": "存款保险制度的核心作用是（　）", "a": ["防止银行挤兑，保护存款人利益", "提高银行盈利能力", "降低银行融资成本", "增加银行信贷规模", "", ""], "r": "A", "e": "存款保险制度主要是在银行出现问题时对存款人进行赔付，能避免存款人因恐慌而挤兑，保障存款人利益。而它与银行盈利能力、融资成本、信贷规模并无直接核心关联。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651083", "t": 1, "q": "下列关于金融监管与金融创新关系的表述中，错误的是？", "a": ["金融创新可能规避现有金融监管，引发监管套利", "金融监管可能抑制过度金融创新，防范金融风险", "金融监管与金融创新是完全对立的，无协调空间", "合理的金融监管可引导金融创新向合规、稳健方向发展", "", ""], "r": "C", "e": "金融监管与金融创新并非完全对立，二者存在相互促进、相互协调的关系。A项金融创新会利用监管漏洞套利，B项监管能防范过度创新带来的风险，D项合理监管可引导创新健康发展，C说法错误。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651084", "t": 1, "q": "\"金融是现代经济的核心\"这一论断表明，金融发展对经济增长的作用不包括？", "a": ["动员储蓄", "优化资源配置", "规避所有风险", "促进技术创新", "", ""], "r": "C", "e": "金融虽能在一定程度上管理和分散风险，但无法规避所有风险，这是客观现实。而动员储蓄、优化资源配置、促进技术创新都是金融对经济增长的重要作用。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651085", "t": 1, "q": "中央银行作为\"政府的银行\"，其职责不包括？", "a": ["代理国库", "制定和执行货币政策", "为企业提供贷款", "代表政府参加国际金融活动", "", ""], "r": "C", "e": "中央银行是国家金融管理机构，主要面向政府和金融机构，不为企业提供贷款。而代理国库、制定执行货币政策、代表政府参加国际金融活动都是其作为“政府的银行”的职责。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651086", "t": 1, "q": "中央银行的\"银行的银行\"职能不包括（　）", "a": ["集中存款准备金", "充当最后贷款人", "发行货币", "组织全国清算", "", ""], "r": "C", "e": "“银行的银行”体现央行与商业银行等金融机构的联系。A集中存款准备金可加强金融机构资金管理；B充当最后贷款人支持金融机构资金需求；D组织全国清算方便金融机构间交易结算，都与“银行的银行”职能相关。而C发行货币是央行“发行的银行”职能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651087", "t": 1, "q": "下列关于国家信用的说法中，正确的是？", "a": ["国家信用的债务人是企业，债权人是国家", "国家信用的主要形式是发行企业债券", "国家信用通常用于弥补财政赤字或筹集建设资金", "国家信用的风险水平高于商业信用", "", ""], "r": "C", "e": "国家信用债务人是国家，债权人是购买国债等的主体，A错误；国家信用主要形式是发行国债等，不是企业债券，B错误；国家信用有国家信誉作保障，风险低于商业信用，D错误；国家信用常用来弥补财政赤字或筹集建设资金，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651088", "t": 1, "q": "基础货币（高能货币）的构成是（　）", "a": ["流通中的现金+商业银行库存现金", "流通中的现金+商业银行法定存款准备金", "流通中的现金+商业银行超额存款准备金", "流通中的现金+商业银行存款准备金（法定+超额）", "", ""], "r": "D", "e": "基础货币由流通于银行体系之外的现金和银行体系的存款准备金构成，存款准备金包括法定和超额存款准备金。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651089", "t": 1, "q": "下列利率中，由市场供求关系决定且能反映市场资金供求状况的是？", "a": ["官定利率", "基准利率", "市场利率", "固定利率", "", ""], "r": "C", "e": "市场利率由市场供求关系决定，能反映市场资金供求状况。官定利率由政府或金融管理部门制定；基准利率是金融市场上具有普遍参照作用的利率；固定利率是在借贷期内固定不变的利率。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651090", "t": 1, "q": "某债券面值为100元，票面利率为5%，每年付息一次，剩余期限为2年，当前市场利率为4%，该债券的理论价格最接近", "a": ["98.11元", "101.89元", "103.77元", "105.65元", "", ""], "r": "B", "e": "本题可根据债券定价公式计算债券的理论价格。债券定价公式为「test/yiwen_img/importSubject/2034818454699249664.png」，其中P为债券价格，C为每年利息支付，r为市场利率，n为剩余到期年限，F为债券面值。 步骤一：计算每年利息支付C已知债券面值F = 100元，票面利率为「test/yiwen_img/importSubject/2034818454787330048.png」，根据公式“每年利息支付C =债券面值「test/yiwen_img/importSubject/2034818454858633216.png」票面利率”，可得「test/yiwen_img/importSubject/2034818454929936384.png」元。 步骤二：确定市场利率r、剩余到期年限n和债券面值F已知市场利率「test/yiwen_img/importSubject/2034818455022211072.png」，剩余到期年限n = 2年，债券面值F = 100元。 步骤三：代入公式计算债券理论价格P将C = 5元、「test/yiwen_img/importSubject/2034818455022211072.png」、n = 2年、F = 100元代入债券定价公式可得：「test/yiwen_img/importSubject/2034818455093514240.png」=5\\times\\frac{1 - 1\\div(1 + 0.04)^{2}}{0.04}+\\frac{100}{(1 + 0.04)^{2}}「test/yiwen_img/importSubject/2034818455273869312.png」=5\\times\\frac{1 - 0.9246}{0.04}+92.46「test/yiwen_img/importSubject/2034818455403892736.png」=5\\times1.885+92.46=9.425 + 92.46=101.885\\approx101.89$（元）综上，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651091", "t": 1, "q": "我国目前的金融监管体制属于（　）", "a": ["集中统一监管体制", "分业监管体制", "完全市场化监管体制", "跨国监管体制", "", ""], "r": "B", "e": "我国实行分业经营，对应的是分业监管体制，不同金融领域由不同监管机构负责。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651092", "t": 1, "q": "下列货币政策工具中，属于\"三大法宝\"且调控力度最强、最具强制性的是（　）", "a": ["公开市场操作", "法定存款准备金率", "再贴现率", "窗口指导", "", ""], "r": "B", "e": "货币政策“三大法宝”是法定存款准备金率、再贴现率和公开市场操作。法定存款准备金率调整会直接影响金融机构的资金储备和信贷投放能力，调控力度强且具有强制性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651093", "t": 1, "q": "金融机构面临的\"操作风险\"主要来源于？", "a": ["市场利率、汇率等价格波动", "内部人员操作失误或违规行为", "借款人违约导致的资产损失", "资金流动性不足无法满足支付需求", "", ""], "r": "B", "e": "操作风险主要是因内部人员操作失误、违规等引发。A是市场风险；C是信用风险；D是流动性风险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651094", "t": 1, "q": "下列关于商业信用的说法，正确的是（　）", "a": ["商业信用的债权人一定是银行", "商业信用是企业之间基于商品交易产生的信用形式", "商业信用的融资期限通常较长（超过1年）", "商业信用只能以货币形式提供", "", ""], "r": "B", "e": "商业信用是企业间基于商品交易产生的信用形式。A项债权人是企业非银行；C项融资期限较短；D项可以商品形式提供。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651095", "t": 1, "q": "货币供给层次中，M1的构成是（　）", "a": ["流通中现金+活期存款", "流通中现金+定期存款", "活期存款+定期存款", "流通中现金+储蓄存款", "", ""], "r": "A", "e": "M1是狭义货币供应量，由流通中现金和活期存款构成。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651096", "t": 1, "q": "下列属于直接金融市场的是？", "a": ["银行贷款市场", "同业拆借市场", "股票市场", "票据贴现市场", "", ""], "r": "C", "e": "直接金融市场是资金供求双方直接进行资金融通的市场。股票市场中，投资者直接购买发行公司的股票，实现资金从投资者到筹资者的直接转移。而银行贷款市场、票据贴现市场都有银行等金融中介参与，同业拆借是金融机构间的资金拆借，并非资金供求双方直接融通。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651097", "t": 1, "q": "下列关于同业拆借市场的说法，错误的是", "a": ["交易主体主要是金融机构", "交易标的主要是短期资金", "交易利率由央行统一规定", "交易目的是调剂资金头寸", "", ""], "r": "C", "e": "同业拆借市场利率是由市场供求决定的，并非央行统一规定。A选项金融机构是同业拆借主体；B选项拆借主要是短期资金；D选项目的就是调剂资金头寸。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651098", "t": 1, "q": "下列货币政策工具中，属于选择性货币政策工具的是？", "a": ["法定存款准备金率", "消费者信用控制", "公开市场业务", "再贴现率", "", ""], "r": "B", "e": "选择性货币政策工具是有选择地对某些特殊领域的信用加以调节和影响的措施。A法定存款准备金率、C公开市场业务、D再贴现率是一般性货币政策工具。B消费者信用控制是对消费者的分期付款等消费信用进行控制，属于选择性货币政策工具。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651099", "t": 1, "q": "下列关于货币层次划分的说法，错误的是", "a": ["M0通常指流通中的现金", "M1=M0+活期存款", "M2=M1+定期存款+储蓄存款+其他存款", "M2中的定期存款流动性与M1中的活期存款相当", "", ""], "r": "D", "e": "活期存款可随时支取，流动性强，而定期存款在到期前支取通常有一定限制，流动性远不如活期存款。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651100", "t": 1, "q": "金融科技的核心技术不包括（　）", "a": ["大数据", "人工智能", "区块链", "传统柜台操作技术", "", ""], "r": "D", "e": "金融科技核心技术是新兴数字化技术。大数据、人工智能、区块链都是当下推动金融创新和变革的关键技术；而传统柜台操作技术是旧有的操作模式和技术，不属于金融科技核心技术。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651101", "t": 1, "q": "在信用形式中，兼具融资期限灵活性强、融资主体为企业间直接信用特征的是哪种信用形式？", "a": ["银行信用", "商业信用", "国家信用", "消费信用", "", ""], "r": "B", "e": "商业信用是企业间直接信用，且融资期限可根据交易双方协商确定，灵活性强。银行信用主体是银行与企业等；国家信用主体是国家；消费信用是针对消费者。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651102", "t": 1, "q": "下列货币政策工具中，属于选择性货币政策工具的是（　）", "a": ["法定存款准备金率", "消费者信用控制", "公开市场业务", "再贴现率", "", ""], "r": "B", "e": "选择性货币政策工具是针对某些特殊领域的信用进行调节的工具，消费者信用控制就属于此类。而法定存款准备金率、公开市场业务、再贴现率是一般性货币政策工具。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651103", "t": 1, "q": "下列不属于金融科技在支付领域应用的是（　）", "a": ["移动支付（如支付宝、微信支付）", "区块链跨境支付", "传统柜台现金支付", "生物识别支付（如指纹支付）", "", ""], "r": "C", "e": "金融科技强调利用科技手段提升金融服务效率和体验。传统柜台现金支付未借助先进科技手段，与金融科技关联不大。而A移动支付、B区块链跨境支付、D生物识别支付都运用了相应科技。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651104", "t": 1, "q": "衡量\"金融深化\"程度的重要指标是（　）", "a": ["货币化率（M2/GDP）", "通货膨胀率", "失业率", "财政赤字率", "", ""], "r": "A", "e": "货币化率（M2/GDP）反映了经济货币化程度，是衡量金融深化程度的重要指标。B通货膨胀率衡量物价变动；C失业率衡量就业状况；D财政赤字率体现财政收支情况。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651105", "t": 1, "q": "下列金融风险控制手段中，属于\"风险转移\"的是（　）", "a": ["银行分散贷款客户行业", "企业购买信用保险", "银行加强内部风控流程", "投资者持有现金应对流动性需求", "", ""], "r": "B", "e": "风险转移是指通过合同或非合同的方式将风险转嫁给另一个人或单位的一种风险处理方式。企业购买信用保险，是把信用风险转移给了保险公司。A选项是风险分散，C选项是风险控制，D选项是应对流动性风险的储备措施，并非风险转移。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818457643651106", "t": 1, "q": "中央银行\"银行的银行\"职能不包括（　）", "a": ["集中保管商业银行存款准备金", "充当商业银行最后贷款人", "为商业银行办理清算业务", "代理政府发行国债", "", ""], "r": "D", "e": "“银行的银行”体现央行与商业银行等金融机构的关系。ABC选项都围绕央行对商业银行的业务，而D选项代理政府发行国债是“政府的银行”职能。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944960", "t": 2, "q": "影响货币需求的因素有（　）", "a": ["收入水平", "利率水平", "物价水平", "货币流通速度", "", ""], "r": "ABCD", "e": "收入水平越高、物价水平越高，对货币需求越大；利率水平影响持有货币的机会成本，进而影响货币需求；货币流通速度越快，所需货币量越少。ABCD 四个因素都影响货币需求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944961", "t": 2, "q": "影响货币需求的因素包括", "a": ["收入水平", "利率水平", "物价水平", "货币流通速度", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944962", "t": 2, "q": "金融抑制的负面影响包括？", "a": ["资金配置效率低下", "金融机构发展缓慢", "经济增长受阻", "金融创新活跃", "", ""], "r": "ABC", "e": "金融抑制会使资金不能有效配置、阻碍金融机构发展、抑制经济增长，而不是促进金融创新活跃。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944963", "t": 2, "q": "下列属于金融监管体制的有", "a": ["统一监管体制", "分业监管体制", "双峰监管体制", "多头监管体制", "", ""], "r": "ABCD", "e": "金融监管体制常见类型有统一监管体制，即由一个监管机构统一监管；分业监管体制，按不同金融行业分别监管；双峰监管体制，设置两类监管机构；多头监管体制，多个监管机构共同监管。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944964", "t": 2, "q": "下列货币政策工具中，属于直接信用控制的有", "a": ["信用配额", "利率限制", "流动性比率", "道义劝告", "", ""], "r": "ABC", "e": "直接信用控制是指中央银行以行政命令或其他方式，直接对金融机构尤其是商业银行的信用活动进行控制，包括信用配额、利率限制、流动性比率等。道义劝告是间接信用指导。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944965", "t": 2, "q": "货币供给的决定因素包括？", "a": ["基础货币", "货币乘数", "利率水平", "通货膨胀率", "", ""], "r": "AB", "e": "货币供给量等于基础货币与货币乘数之积，所以基础货币和货币乘数是决定货币供给的关键因素；利率和通胀率会影响货币需求等，并非决定货币供给的直接因素。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944966", "t": 2, "q": "下列属于金融风险控制措施的有？", "a": ["风险分散，通过多样化投资降低风险", "风险对冲，利用衍生工具对冲价格风险", "风险转移，通过保险或担保转移风险", "风险规避，拒绝参与高风险业务", "风险预警，通过指标监测提前识别风险", ""], "r": "ABCD", "e": "金融风险控制是对已识别的风险采取措施来降低或消除影响。A选项风险分散、B选项风险对冲、C选项风险转移、D选项风险规避都是直接对风险进行控制的手段。而E选项风险预警只是提前识别风险，不属于控制措施。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944967", "t": 2, "q": "货币均衡的实现条件包括（　）", "a": ["货币供给与货币需求总量相等", "货币供给与货币需求结构匹配", "总供给与总需求均衡", "财政收支平衡", "", ""], "r": "ABC", "e": "货币均衡要求货币供给和需求总量相等、结构匹配，且要以总供给与总需求均衡为前提。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944968", "t": 2, "q": "商业信用的主要形式包括", "a": ["应付账款", "应付票据", "预收账款", "预付账款", "", ""], "r": "ABC", "e": "商业信用是企业在正常的经营活动和商品交易中，由于延期付款或预收账款所形成的企业常见的信贷关系。应付账款、应付票据是企业延期付款产生的信用形式，预收账款是企业预先收取款项形成的信用形式，而预付账款是企业提前付款，不属于商业信用主要形式。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944969", "t": 2, "q": "金融科技带来的风险包括（　）", "a": ["技术风险", "数据安全风险", "监管套利风险", "系统性风险", "", ""], "r": "ABCD", "e": "金融科技融合金融与科技，科技应用会有技术故障等技术风险；涉及大量数据，存在数据安全风险；部分机构利用监管差异进行监管套利；其广泛渗透还可能引发系统性风险。ABCD四个选项均是金融科技带来的风险。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944970", "t": 2, "q": "下列属于商业信用具体形式的有？", "a": ["企业之间的应付账款", "企业发行的公司债券", "企业之间的预收货款", "商业银行向企业发放的贷款", "企业向职工发放的工资欠条", ""], "r": "AC", "e": "商业信用是企业之间在商品交易中相互提供的信用。应付账款是购买方延期付款形成的信用；预收货款是销售方提前收款形成的信用，都属于商业信用。企业发行公司债券是向社会筹资，商业银行向企业发放贷款是银行信用，企业给职工的工资欠条不属于商业信用范畴。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944971", "t": 2, "q": "下列属于消费信用的有（　）", "a": ["信用卡透支", "住房按揭贷款", "汽车消费贷款", "企业间赊销", "", ""], "r": "ABC", "e": "消费信用是指工商企业、银行和其他金融机构向消费者个人提供的、用于其消费支出的一种信用形式。A信用卡透支是银行向消费者提供的短期消费信贷；B住房按揭贷款和C汽车消费贷款都是金融机构向消费者提供的用于特定消费的贷款。而D企业间赊销属于商业信用，是企业之间的信用关系。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944972", "t": 2, "q": "下列关于金融科技行业实践的表述中，正确的有？", "a": ["移动支付通过技术手段提升了支付便捷性和效率", "智能投顾基于大数据和算法为用户提供自动化理财服务", "区块链在跨境支付中可缩短结算时间，降低中间成本", "金融科技的应用仅局限于个人金融领域，与企业金融无关", "人工智能在信贷风控中可提高风险识别的准确性和效率", ""], "r": "ABCE", "e": "A选项移动支付利用技术实现便捷快速支付；B选项智能投顾依靠大数据和算法提供自动理财；C选项区块链能优化跨境支付；E选项人工智能可提升信贷风控水平。而D选项金融科技在企业金融领域也有广泛应用，并非仅局限于个人金融。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944973", "t": 2, "q": "金融监管的主要内容包括", "a": ["市场准入监管", "业务运营监管", "市场退出监管", "从业人员监管", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944974", "t": 2, "q": "下列属于系统性金融风险特征的有？", "a": ["传染性强，易在金融体系内扩散", "影响范围广，可能引发金融危机", "仅影响个别金融机构，不波及整体", "由单个金融机构的操作失误引发", "难以通过分散投资完全规避", ""], "r": "ABE", "e": "系统性金融风险影响整个金融体系，而非个别机构，C错误；它通常不是由单个金融机构操作失误引发，D错误。A体现其传染性，B说明影响范围，E表明难以分散规避，这些都是系统性金融风险特征。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944975", "t": 2, "q": "下列关于金融机构功能的表述中，正确的有？", "a": ["商业银行主要功能是吸收存款、发放贷款和办理结算", "证券公司主要功能是代理证券发行和交易，提供投资咨询", "保险公司主要功能是分散风险，提供风险保障", "政策性银行主要功能是追求利润最大化，服务商业领域", "信托公司主要功能是财产管理，代客户进行资产运作", ""], "r": "ABCE", "e": "ABCDE中，D选项错误，政策性银行不以追求利润最大化为目标，主要是贯彻国家政策，服务特定领域而非商业领域。A、B、C、E选项对各金融机构功能表述正确。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944976", "t": 2, "q": "金融科技的核心技术包括", "a": ["大数据", "人工智能", "区块链", "云计算", "", ""], "r": "ABCD", "e": "金融科技核心技术涵盖大数据、人工智能、区块链、云计算等。它们为金融业务提供数据处理、智能决策、安全交易、高效运算等支持。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944977", "t": 2, "q": "下列可能导致货币供给增加的因素有？", "a": ["中央银行降低法定存款准备金率", "中央银行在公开市场买入政府债券", "商业银行增加超额存款准备金持有量", "公众减少现金持有，增加活期存款", "中央银行提高再贴现率", ""], "r": "ABD", "e": "降低法定存款准备金率会使银行可放贷资金增多，增加货币供给；央行在公开市场买入债券会投放货币，增加供给；银行增加超额准备金会减少可贷资金，减少供给；公众减少现金增加活期存款，银行可贷资金增加，货币供给增加；提高再贴现率会使银行借款成本增加，减少货币供给。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944978", "t": 2, "q": "下列属于金融科技行业实践的有（　）", "a": ["移动支付", "智能投顾", "区块链支付", "大数据风控", "", ""], "r": "ABCD", "e": "移动支付让支付更便捷高效；智能投顾利用人工智能提供投资建议；区块链支付借助区块链技术保障支付安全等；大数据风控依靠大数据分析评估风险，它们都是金融科技在不同领域的典型实践。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944979", "t": 2, "q": "下列属于直接融资的优点有？", "a": ["融资成本较低", "资金供求双方联系紧密", "分散风险", "融资效率高", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944980", "t": 2, "q": "下列关于货币均衡与社会总供求均衡关系的表述中，正确的有？", "a": ["货币均衡是社会总供求均衡的前提条件", "社会总供求均衡是货币均衡的结果", "货币供给大于货币需求时，可能导致总需求大于总供给", "货币供给小于货币需求时，可能导致总需求小于总供给", "货币均衡与社会总供求均衡是完全独立的，无关联", ""], "r": "ABCD", "e": "货币均衡和社会总供求均衡相互影响，货币均衡利于社会总供求均衡，货币供给与需求的不同情况会影响总供求关系。A选项，货币均衡能为社会总供求均衡创造条件，是前提；B选项，社会总供求均衡是货币均衡等多种因素作用的结果；C选项，货币供给大于需求，会使购买力增强，可能造成总需求大于总供给；D选项，货币供给小于需求，购买力下降，可能导致总需求小于总供给；E选项错误，二者有关联。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944981", "t": 2, "q": "中央银行一般性货币政策工具包括？", "a": ["法定存款准备金率", "再贴现政策", "公开市场操作", "消费者信用控制", "证券市场信用控制", ""], "r": "ABC", "e": "ABC是一般性货币政策工具，作用对象是整体经济和金融活动。DE属于选择性货币政策工具，针对某些特殊领域。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944982", "t": 2, "q": "商业银行的资产业务包括（　）", "a": ["发放贷款", "购买国债", "吸收居民存款", "办理票据贴现", "", ""], "r": "ABD", "e": "商业银行资产业务是运用资金的业务。A发放贷款是银行把资金借给客户，是资产运用；B购买国债是银行用资金买债券，属资产配置；D办理票据贴现是银行提前把资金给持票人，也是资产运用。而C吸收居民存款是负债业务，是银行资金来源。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944983", "t": 2, "q": "下列属于国家信用工具的有？", "a": ["国库券", "国家重点建设债券", "企业债券", "政府担保债券", "银行承兑汇票", ""], "r": "ABD", "e": "国家信用工具是国家为了筹措资金而发行的信用凭证。国库券、国家重点建设债券是国家直接发行的；政府担保债券虽由其他主体发行但有政府担保，本质与国家信用相关。企业债券是企业发行的，银行承兑汇票是商业信用工具。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944984", "t": 2, "q": "下列属于货币市场特征的有？", "a": ["融资期限短，通常在1年以内", "融资工具流动性强，风险较低", "参与者主要是金融机构和企业", "交易目的是解决长期资金需求", "金融工具种类少，仅有同业拆借一种", ""], "r": "ABC", "e": "货币市场是短期资金市场，期限短，通常1年以内，工具流动性强、风险低，参与者多为金融机构和企业。其交易目的是解决短期资金需求，且金融工具不止同业拆借一种。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944985", "t": 2, "q": "货币政策中介目标选择的标准包括？", "a": ["可测性", "可控性", "相关性", "稳定性", "", ""], "r": "ABC", "e": "货币政策中介目标选择需具备可测性，以便能准确衡量；要有可控性，央行可以有效控制；还得有相关性，与最终目标紧密相关。稳定性并非中介目标选择标准。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944986", "t": 2, "q": "金融监管的主要目标包括？", "a": ["维护金融体系稳定", "保护投资者和存款人利益", "促进金融机构公平竞争", "提高金融服务效率", "实现金融机构利润最大化", ""], "r": "ABCD", "e": "金融监管主要是为保障金融体系健康，维护稳定、保护相关者利益、营造公平竞争环境、提升服务效率。而金融机构利润最大化是其自身经营目标，非监管主要目标。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944987", "t": 2, "q": "下列关于基准利率的说法正确的有（　）", "a": ["基准利率是利率体系的核心", "基准利率是其他利率制定的参考标准", "我国目前的基准利率是LPR", "基准利率由市场自主决定无需调控", "", ""], "r": "ABC", "e": "基准利率是利率体系核心，是其他利率制定参考标准；我国目前贷款基准利率是LPR；基准利率虽受市场影响，但也需央行调控。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944988", "t": 2, "q": "下列属于货币需求的决定因素的有？", "a": ["收入水平", "利率水平", "物价水平", "货币流通速度", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944989", "t": 2, "q": "金融监管的主要内容包括？", "a": ["市场准入监管", "业务运营监管", "市场退出监管", "盈利能力监管", "", ""], "r": "ABC", "e": "金融监管主要围绕金融机构从进入到运营再到退出的全过程。市场准入监管确保符合条件的机构进入市场；业务运营监管保障机构合规开展业务；市场退出监管处理机构退出事宜。而盈利能力是金融机构自身经营成果体现，并非金融监管主要内容。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944990", "t": 2, "q": "下列关于中央银行独立性的表述中，正确的有？", "a": ["中央银行独立性是指其独立于政府，不受政府干预", "适度的独立性有助于央行制定和执行稳定的货币政策", "完全独立于政府的中央银行不利于配合财政政策", "中央银行独立性越强，货币政策效果越好", "我国中央银行在国务院领导下开展工作，具有相对独立性", ""], "r": "BCE", "e": "A说法太绝对，央行独立性并非完全不受政府干预；B正确，适度独立利于制定执行稳定货币政策；C正确，完全独立难以与财政政策配合；D错误，独立性过强不一定货币政策效果就好；E正确，我国央行在国务院领导下有相对独立性。答案：BCE ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944991", "t": 2, "q": "选择性货币政策工具包括（　）", "a": ["消费者信用控制", "证券市场信用控制", "不动产信用控制", "法定存款准备金率", "", ""], "r": "ABC", "e": "选择性货币政策工具是针对某些特殊领域进行调控的工具。ABC选项分别针对消费者、证券市场、不动产领域，属于选择性工具；法定存款准备金率是一般性货币政策工具，对整个金融体系货币量进行调节。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944992", "t": 2, "q": "下列关于利息本质的理论中，属于古典利息理论的有", "a": ["节欲论", "时差论", "流动性偏好论", "剩余价值论", "", ""], "r": "AB", "e": "古典利息理论强调储蓄和投资决定利息。节欲论认为利息是对节欲的报酬；时差论指出利息是对人们放弃现在消费、等待未来消费的补偿，二者都属古典利息理论。流动性偏好论是凯恩斯的理论，剩余价值论是马克思的理论，不属于古典利息理论。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818462139944993", "t": 2, "q": "金融市场的功能包括", "a": ["资金融通功能", "价格发现功能", "风险管理功能", "资源配置功能", "", ""], "r": "ABCD", "e": "金融市场具有多种重要功能。资金融通可实现资金从盈余方到短缺方的流动；价格发现能通过交易形成合理价格；风险管理可让市场参与者分散和转移风险；资源配置可引导资金流向效益好的领域。ABCD四个选项均是金融市场的功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874176", "t": 3, "q": "商业银行是唯一能吸收活期存款并创造派生存款的金融机构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "商业银行具有信用创造功能，能吸收活期存款并创造派生存款，其他金融机构一般不具备此能力，所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874177", "t": 3, "q": "货币均衡是指货币供给与货币需求在数量上完全相等，结构无关紧要。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。货币均衡并非指货币供给与货币需求在数量上完全相等，且结构很重要。现实中货币供给与需求很难做到数量完全相等，而且货币供求的结构合理对经济正常运行至关重要。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874178", "t": 3, "q": "国家信用的债务人是各级政府，债权人只能是国内居民和企业，不包括国外主体。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。国家信用中债务人通常是各级政府，不过债权人可以是国内居民、企业，也可以是国外主体，比如政府在国际市场发行债券，国外投资者就成为其债权人。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874179", "t": 3, "q": "金融机构的\"流动性覆盖率（LCR）\"旨在衡量其短期（30天内）应对流动性危机的能力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流动性覆盖率（LCR）是指优质流动性资产储备与未来30日的资金净流出量之比，目的就是衡量金融机构短期（30天内）应对流动性危机的能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874180", "t": 3, "q": "选择性货币政策工具的调控范围覆盖整个金融体系，一般性货币政策工具仅针对特定领域的金融活动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般性货币政策工具调控范围覆盖整个金融体系，选择性货币政策工具仅针对特定领域金融活动，题干说法混淆了二者概念。", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874181", "t": 3, "q": "信用的本质是价值的双向转移。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信用的本质是价值的单方面转移，而非双向转移。在信用活动中，授信方将商品或货币的使用权暂时让渡给受信方，受信方在约定时间偿还，这体现的是价值的单向流动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874182", "t": 3, "q": "同业拆借市场是商业银行之间进行短期资金融通的市场，属于货币市场范畴。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "同业拆借是金融机构之间短期资金融通行为，期限短，符合货币市场短期资金市场的特征，所以同业拆借市场是货币市场一部分，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874183", "t": 3, "q": "《巴塞尔协议I》首次提出了资本充足率要求，规定商业银行总资本充足率不低于8%。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "《巴塞尔协议I》核心内容就是首次提出资本充足率要求，明确商业银行总资本充足率不得低于8%。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874184", "t": 3, "q": "金融监管中的\"穿透式监管\"核心是透过金融产品的表面形式，监管其背后的实际风险承担主体。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "穿透式监管就是要穿透金融产品的表象，识别背后实际的风险承担主体等实质内容，以实现有效监管。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874185", "t": 3, "q": "信用风险是金融机构面临的最主要风险，其发生不仅会导致直接损失，还可能引发流动性风险、声誉风险等次生风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "信用风险是指借款人或交易对手未能履行合同约定导致损失的风险，是金融机构面临的主要风险之一，且一旦发生可能像多米诺骨牌一样引发一系列次生风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874186", "t": 3, "q": "信用评级机构对债券的评级结果是投资者决策的唯一依据，具有强制约束力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信用评级结果只是投资者决策的参考，并非唯一依据，也不具有强制约束力。投资者还需综合多方面因素进行决策。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874187", "t": 3, "q": "货币政策的最终目标包括稳定物价、充分就业、经济增长、国际收支平衡，这四个目标之间不存在冲突，可同时实现。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币政策的四个最终目标之间存在矛盾和冲突，比如稳定物价与充分就业、经济增长与国际收支平衡等都难以同时兼顾，无法同时实现。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874188", "t": 3, "q": "货币均衡是一种动态的均衡，而非静态的绝对平衡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币均衡并不要求货币供给与货币需求绝对相等，在现实中二者很难完全一致，它是一个动态过程，会随经济变化而调整以保持相对平衡。", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874189", "t": 3, "q": "金融机构的流动性风险是指无法及时变现资产以偿还债务的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false
