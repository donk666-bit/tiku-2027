: 1, "q": "保险经营中，保险人将其承担的保险业务，部分转移给其他保险人的经营行为称为", "a": ["保险承保", "保险理赔", "再保险", "共同保险", "", ""], "r": "C", "e": "再保险是保险人将自己承担的部分保险业务转移给其他保险人。A保险承保是保险人接受投保申请并与之签订合同；B保险理赔是处理保险事故赔偿；D共同保险是多个保险人共同承保同一标的。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452033", "t": 1, "q": "保险理赔的核心环节是", "a": ["报案受理", "现场查勘", "责任认定", "赔款支付", "", ""], "r": "C", "e": "责任认定直接决定是否赔付及赔付多少，是保险理赔的关键，其他环节都围绕此展开。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452034", "t": 1, "q": "保险利益原则要求投保人对保险标的具有保险利益的时间节点是", "a": ["保险合同订立时", "保险事故发生时", "保险合同订立时和保险事故发生时", "保险合同履行完毕时", "", ""], "r": "C", "e": "对于人身保险，要求投保人在保险合同订立时对被保险人具有保险利益；财产保险则要求被保险人在保险事故发生时对保险标的具有保险利益。综合来看，保险利益原则要求投保人对保险标的具有保险利益的时间节点是保险合同订立时和保险事故发生时。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452035", "t": 1, "q": "下列关于保险合同变更的说法，正确的是", "a": ["保险合同变更无需通知保险人", "保险合同变更必须采用书面形式", "投保人变更受益人无需被保险人同意", "保险标的用途变更无需告知保险人", "", ""], "r": "B", "e": "保险合同变更需通知保险人，标的用途变更等重要情况也应告知，投保人变更受益人需被保险人同意，而保险合同变更通常要书面形式。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452036", "t": 1, "q": "保险的基本职能中，通过集合众多投保人的保费，对少数被保险人的损失进行补偿的职能是", "a": ["分散风险职能", "补偿损失职能", "防灾防损职能", "融资职能", "", ""], "r": "B", "e": "题干描述的是集合保费对少数损失者补偿，这体现的就是补偿损失职能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452037", "t": 1, "q": "保险法规定，保险合同成立后，投保人可以解除合同，保险人不得解除合同的情形是", "a": ["投保人未按时缴纳保险费", "被保险人未履行危险增加通知义务", "人身保险合同成立超过2年", "保险标的发生部分损失", "", ""], "r": "C", "e": "依据保险法“不可抗辩条款”，人身保险合同成立超过2年，保险人不得解除合同。A、B情形保险人可解除合同，D项保险标的部分损失，保险人在特定条件下也有解除权。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452038", "t": 1, "q": "保险的数理基础是", "a": ["概率论和大数法则", "微积分", "线性代数", "统计学", "", ""], "r": "A", "e": "保险以概率论和大数法则为数理基础来预测风险、合理厘定费率等。微积分、线性代数与保险数理基础关联不大，统计学是工具但不是核心数理基础。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452039", "t": 1, "q": "下列选项中，不属于保险市场构成要素的是", "a": ["保险供给者", "保险需求者", "保险监管机构", "保险中介机构", "", ""], "r": "C", "e": "保险市场构成要素主要有保险供给者、保险需求者和保险中介机构。保险监管机构是对保险市场进行监管的部门，并非保险市场本身的构成要素。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452040", "t": 1, "q": "下列人身保险产品中，以被保险人死亡为给付保险金条件，且保险期限为终身的是", "a": ["定期寿险", "终身寿险", "两全保险", "年金保险", "", ""], "r": "B", "e": "定期寿险期限非终身；两全保险有期满生存和死亡给付两种情况，并非单纯以死亡为给付条件且强调终身；年金保险是按约定分期给付生存金。而终身寿险是以被保险人死亡为给付条件，且保险期限为终身。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452041", "t": 1, "q": "某投保人投保了家庭财产保险，保险金额为10万元，保险期间内发生保险事故，造成损失8万元，出险时保险标的的实际价值为12万元，按照比例赔偿方式，保险人应赔偿的金额是", "a": ["6.67万元", "8万元", "10万元", "12万元", "", ""], "r": "A", "e": "比例赔偿方式下，赔偿金额=损失金额×（保险金额÷保险标的实际价值），即8×（10÷12）≈6.67万元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452042", "t": 1, "q": "下列关于保险职能的说法中，属于保险派生职能的是（　）", "a": ["风险分散", "经济补偿", "资金融通", "损失分摊", "", ""], "r": "C", "e": "保险基本职能是风险分散、损失分摊和经济补偿，派生职能有资金融通等。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452043", "t": 1, "q": "下列人身保险险种中，具有储蓄性的是", "a": ["定期寿险", "终身寿险", "意外伤害保险", "医疗保险", "", ""], "r": "B", "e": "储蓄性保险意味着在提供保障的同时，还具有一定的储蓄功能。定期寿险只有在保险期间内身故或全残才赔付，期满未发生保险事故保费不返还，无储蓄性；意外伤害保险和医疗保险是消费型险种，主要是在意外或患病时提供保障，无储蓄功能。终身寿险保障终身，无论何时身故或全残都会赔付，且具有现金价值，可视为一种储蓄方式。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452044", "t": 1, "q": "下列关于损失补偿原则的说法中，错误的是", "a": ["损失补偿原则适用于财产保险", "损失补偿原则不适用于人身保险", "损失补偿以保险标的的实际损失为限", "损失补偿可以超过保险金额", "", ""], "r": "D", "e": "损失补偿原则就是对赔偿额度进行限制，以避免不当得利，其赔偿不能超过保险金额，所以选项D说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452045", "t": 1, "q": "保险理赔的核心环节是", "a": ["报案受理", "现场查勘", "责任认定", "赔款支付", "", ""], "r": "C", "e": "责任认定决定了是否属于保险责任范围以及赔偿的比例等，是保险理赔中最关键的，直接影响理赔结果。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452046", "t": 1, "q": "保险数理基础中，计算纯保险费率的关键依据是", "a": ["保额损失率", "附加费率", "管理费用率", "利润率", "", ""], "r": "A", "e": "纯保险费率主要依据保额损失率来计算，它反映了保险标的损失的概率和程度。附加费率用于涵盖经营费用等；管理费用率是经营成本相关；利润率并非计算纯保险费率关键。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452047", "t": 1, "q": "下列机构中，属于保险市场监管主体的是（　）", "a": ["保险公司", "保险经纪公司", "银保监会", "保险行业协会", "", ""], "r": "C", "e": "保险市场监管主体是对保险市场进行监督管理的机构，银保监会承担监管保险市场的职责。而保险公司、保险经纪公司是保险市场的经营主体，保险行业协会是自律组织。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452048", "t": 1, "q": "某企业投保财产一切险，保险期限内，企业仓库因被保险人雇员的过失导致火灾，造成货物损失，保险人的赔付责任是", "a": ["全额赔付", "按过失比例赔付", "不予赔付", "扣除免赔额后赔付", "", ""], "r": "D", "e": "财产一切险承保因自然灾害或意外事故造成保险标的的损失，被保险人雇员过失导致火灾属意外事故，通常在保险范围内。一般会扣除免赔额后赔付。答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452049", "t": 1, "q": "下列关于最大诚信原则中告知义务的说法，正确的是（　）", "a": ["投保人只需告知重要事实", "保险人无需履行告知义务", "投保人的告知义务仅限于书面询问", "保险人的告知义务包括明确说明免责条款", "", ""], "r": "D", "e": "投保人要告知重要事实，A表述不严谨；保险人也有告知义务，B错误；投保人告知不限于书面询问，C错误；保险人告知义务包含明确说明免责条款，D正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452050", "t": 1, "q": "保险市场中，专门从事保险标的评估、勘验、鉴定等业务的机构属于", "a": ["保险经营机构", "保险中介机构", "保险监管机构", "保险消费者组织", "", ""], "r": "B", "e": "专门从事保险标的评估、勘验、鉴定等业务的机构是连接保险人和投保人等的桥梁和纽带，属于保险中介机构。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452051", "t": 1, "q": "人身保险中，以被保险人死亡为给付保险金条件的合同，自成立之日起满一定期限后，被保险人自杀的，保险人可以按照合同给付保险金，该期限是", "a": ["1年", "2年", "3年", "5年", "", ""], "r": "B", "e": "为防止道德风险，避免被保险人通过自杀获取保险金，法律规定以被保险人死亡为给付条件的人身保险合同，自成立之日起满2年后被保险人自杀，保险人按合同给付保险金。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452052", "t": 1, "q": "财产保险中，保险标的的保险价值可以由投保人和保险人约定并在合同中载明，也可以按照保险事故发生时保险标的的什么价值确定", "a": ["重置价值", "账面价值", "实际价值", "市场价值", "", ""], "r": "C", "e": "财产保险里，若未约定保险价值，通常按保险事故发生时保险标的实际价值确定。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452053", "t": 1, "q": "电力企业海外投资保险中，承保因东道国政府征用、没收保险标的而导致损失的风险是", "a": ["战争风险", "征收风险", "汇兑风险", "违约风险", "", ""], "r": "B", "e": "题干明确说的是东道国政府征用、没收保险标的致损，这对应征收风险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452054", "t": 1, "q": "社会保险中，覆盖范围最广、保障对象最多的险种是", "a": ["养老保险", "医疗保险", "失业保险", "工伤保险", "", ""], "r": "B", "e": "医疗保险可涵盖各类人群，包括城镇职工、城乡居民等，覆盖范围极广，保障对象众多。而养老保险有参保条件限制，失业保险针对失业人群，工伤保险针对特定职业人群，覆盖范围相对较窄。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452055", "t": 1, "q": "社会保险的缴费主体不包括", "a": ["国家", "用人单位", "劳动者个人", "保险中介机构", "", ""], "r": "D", "e": "社会保险缴费主体主要是国家、用人单位和劳动者个人，保险中介机构并非缴费主体。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452056", "t": 1, "q": "在损失补偿原则中，保险人支付的赔偿金额不得超过", "a": ["保险标的的重置价值", "保险金额", "被保险人的实际损失", "保险标的的市场价值", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452057", "t": 1, "q": "保险法规定，人寿保险的被保险人或者受益人向保险人请求给付保险金的诉讼时效期间为", "a": ["1年", "2年", "3年", "5年", "", ""], "r": "D", "e": "依据保险法，人寿保险的被保险人或受益人请求给付保险金诉讼时效是5年。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452058", "t": 1, "q": "保险经营的首要原则是", "a": ["风险大量原则", "风险分散原则", "风险选择原则", "风险同质原则", "", ""], "r": "A", "e": "风险大量原则是保险经营的首要原则，只有承保大量风险单位，才能用大数法则预测损失，合理厘定费率，保证保险经营稳定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452059", "t": 1, "q": "下列财产保险险种中，采用不定值保险方式承保的是", "a": ["企业财产保险", "海上货物运输保险", "机动车辆保险", "工程保险", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452060", "t": 1, "q": "某企业投保财产综合险，保险期限内发生地震导致厂房损毁，保险人拒绝赔付，其依据是", "a": ["近因原则", "损失补偿原则", "保险利益原则", "最大诚信原则", "", ""], "r": "A", "e": "地震是导致厂房损毁的近因，而财产综合险通常将地震列为除外责任，保险人依据近因原则拒绝赔付。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452061", "t": 1, "q": "保险数理基础中，计算纯保险费率的关键依据是", "a": ["保险金额", "保险期限", "风险损失概率", "附加费率", "", ""], "r": "C", "e": "纯保险费率是用于补偿保险损失的费率，其确定主要依据风险损失概率，因为只有知道风险损失概率，才能合理计算出应收取的纯保费。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452062", "t": 1, "q": "在保险基本原则中，要求投保人在订立合同时对保险标的具有保险利益的原则是", "a": ["近因原则", "损失补偿原则", "保险利益原则", "最大诚信原则", "", ""], "r": "C", "e": "保险利益原则要求投保人在订立合同时对保险标的具有保险利益。近因原则是判断风险事故与损失之间因果关系；损失补偿原则是对损失进行补偿；最大诚信原则强调双方如实告知等。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452063", "t": 1, "q": "在保险数理基础中，用来衡量风险发生频率的指标是", "a": ["损失概率", "损失程度", "标准差", "方差", "", ""], "r": "A", "e": "损失概率体现风险发生频率；损失程度是损失大小；标准差和方差衡量风险离散程度。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452064", "t": 1, "q": "保险数理基础中，用于衡量风险损失程度集中趋势的指标是", "a": ["方差", "标准差", "期望值", "离散系数", "", ""], "r": "C", "e": "期望值是对随机变量取值的一种加权平均，能反映风险损失程度的集中趋势。方差和标准差衡量的是数据的离散程度，离散系数是标准差与均值的比，也是反映离散情况。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452065", "t": 1, "q": "新型电力系统中，针对特高压输电线路雷击风险的保险保障，属于", "a": ["工程保险", "责任保险", "信用保险", "农业保险", "", ""], "r": "A", "e": "特高压输电线路属于工程项目，对其雷击风险提供保障属于工程保险范畴。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818595489452066", "t": 1, "q": "下列关于社会保险与商业保险的区别，说法错误的是", "a": ["社会保险具有强制性，商业保险具有自愿性", "社会保险的保障水平较高，商业保险的保障水平较低", "社会保险的资金来源包括财政补贴，商业保险不依赖财政补贴", "社会保险的经营主体是政府，商业保险的经营主体是保险公司", "", ""], "r": "B", "e": "商业保险保障水平可根据投保人需求和缴费情况灵活确定，能提供较高保障，而社会保险是基本保障，保障水平相对有限，B选项说法错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378048", "t": 2, "q": "保险理赔的基本原则包括", "a": ["重合同、守信用原则", "实事求是原则", "主动、迅速、准确、合理原则", "代位求偿原则", "", ""], "r": "ABC", "e": "保险理赔需按合同履行，要实事求是处理，还要做到主动、迅速、准确、合理，而代位求偿是损失补偿原则派生的权益转让原则内容，并非理赔基本原则。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378049", "t": 2, "q": "下列选项中，属于保险理赔应当遵循的原则有", "a": ["重合同、守信用原则", "实事求是原则", "主动、迅速、准确、合理原则", "有利于保险人原则", "", ""], "r": "ABC", "e": "保险理赔需遵循既定规则，重合同守信用保证按约定履行；实事求是确保依据实际情况处理；主动迅速准确合理能高效公正理赔。而理赔应公平公正，并非有利于保险人。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378050", "t": 2, "q": "保险合同的主体包括", "a": ["投保人", "保险人", "被保险人", "受益人", "", ""], "r": "ABCD", "e": "保险合同主体指参与保险合同订立等活动的人，投保人是与保险人订立合同并支付保费的人，保险人是承担赔偿或给付责任的保险公司，被保险人是其财产或人身受保险合同保障的人，受益人是享有保险金请求权的人，ABCD 都是保险合同主体。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378051", "t": 2, "q": "海外投资保险中，政治风险的具体表现形式包括（　）", "a": ["政府征收", "战争、内乱", "外汇管制", "政府违约", "", ""], "r": "ABCD", "e": "海外投资保险的政治风险主要指与东道国政治、法律有关的风险，ABCD选项所涉及的政府征收、战争内乱、外汇管制、政府违约都属于此类风险表现。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378052", "t": 2, "q": "保险的基本原则包括", "a": ["保险利益原则", "最大诚信原则", "近因原则", "损失补偿原则", "", ""], "r": "ABCD", "e": "保险利益、最大诚信、近因、损失补偿原则都是保险的基本原则。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378053", "t": 2, "q": "人身保险按保险责任划分，可分为（　）", "a": ["人寿保险", "健康保险", "意外伤害保险", "养老保险", "", ""], "r": "ABC", "e": "人身保险按保险责任划分，主要包括人寿保险、健康保险、意外伤害保险。养老保险属人寿保险范畴。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378054", "t": 2, "q": "保险公估人的主要职能包括", "a": ["评估职能", "鉴定职能", "公证职能", "代理职能", "", ""], "r": "ABC", "e": "保险公估人主要对保险标的进行评估、鉴定，以公正立场处理保险业务相关问题，具有评估、鉴定、公证职能。而代理职能并非其主要职能。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378055", "t": 2, "q": "下列关于保险利益原则的适用范围，表述正确的有", "a": ["财产保险中，保险利益需在保险事故发生时存在", "人身保险中，保险利益需在订立合同时存在", "财产保险中，保险利益需在订立合同时存在", "人身保险中，保险利益需在保险事故发生时存在", "", ""], "r": "AB", "e": "财产保险强调保险利益在保险事故发生时存在；人身保险强调保险利益在订立合同时存在。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378056", "t": 2, "q": "下列关于保险经纪人的表述，正确的有", "a": ["保险经纪人独立于保险人", "保险经纪人向投保人收取佣金", "保险经纪人对投保人的损失承担赔偿责任", "保险经纪人需为投保人提供专业的保险咨询服务", "", ""], "r": "AD", "e": "保险经纪人独立于保险人开展业务；为投保人服务并提供专业保险咨询；一般向保险人收取佣金，通常不对投保人损失担责。A选项正确，B应是向保险人收佣金，C说法错误。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378057", "t": 2, "q": "我国社会保险的基本原则包括", "a": ["强制性原则", "公平性原则", "保障性原则", "互助性原则", "", ""], "r": "ABCD", "e": "社会保险具有强制性，由国家法律强制实施；强调公平性，保障不同群体权益；以保障公民基本生活为目的，体现保障性；还通过互助共济来分散风险，具备互助性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378058", "t": 2, "q": "下列关于保险合同变更的说法中，正确的有", "a": ["保险合同变更需经双方协商一致", "保险合同变更可以采用书面形式", "保险合同变更可以采用口头形式", "保险合同变更无需通知保险人", "", ""], "r": "ABC", "e": "保险合同变更需双方协商一致，可书面也可口头，但变更通常要通知保险人。答案：ABC 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378059", "t": 2, "q": "新型电力系统中，风电项目保险的承保风险包括", "a": ["台风、暴雨等自然灾害风险", "风机叶片断裂风险", "电网接入故障导致的停运风险", "政策补贴取消风险", "", ""], "r": "ABC", "e": "新型电力系统中风电项目面临多种风险。A选项，台风、暴雨等自然灾害会对风电设备造成损害；B选项，风机叶片断裂会影响风机正常运行；C选项，电网接入故障会使风电项目停运。而政策补贴取消属于政策层面影响收益，并非承保风险。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378060", "t": 2, "q": "社会保险的特征包括（　）", "a": ["强制性", "福利性", "互济性", "自愿性", "", ""], "r": "ABC", "e": "社会保险是国家强制实行的保障制度，具有强制性，并非自愿性，所以D错误。它有福利性质，旨在保障公民基本生活，体现福利性；通过众人缴费来帮助有需要的人，具有互济性。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378061", "t": 2, "q": "保险理赔的流程包括", "a": ["报案与受理", "现场查勘与定损", "责任认定与赔款计算", "赔款支付与结案", "", ""], "r": "ABCD", "e": "保险理赔是指保险人依据保险合同或有关法律法规的规定，受理被保险人提出的保险赔偿请求，进行查勘、定损、理算和实行赔偿的业务活动。其流程通常先报案受理，接着现场查勘定损，然后进行责任认定与赔款计算，最后赔款支付并结案。ABCD选项涵盖了保险理赔完整流程。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378062", "t": 2, "q": "电力企业海外投资保险的保险责任包括", "a": ["东道国政府违约", "战争、革命导致的损失", "被保险人的经营亏损", "东道国汇兑限制导致的资金无法汇回", "", ""], "r": "ABD", "e": "海外投资保险主要保障政治风险。A选项东道国政府违约、B选项战争革命损失、D选项东道国汇兑限制资金无法汇回都属于政治风险范畴，是保险责任范围；而C选项被保险人经营亏损是自身经营问题，并非海外投资保险所保的政治风险。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378063", "t": 2, "q": "下列属于保险基本原则中最大诚信原则内容的有", "a": ["告知", "保证", "弃权", "禁止反言", "", ""], "r": "ABCD", "e": "最大诚信原则要求保险活动当事人在订立和履行保险合同的过程中，必须最大限度地诚实守信。告知是投保人或被保险人应如实向保险人陈述有关保险标的的重要事实；保证是投保人或被保险人对某些特定事项的作为或不作为的承诺；弃权是保险人放弃其在保险合同中可以主张的某种权利；禁止反言是保险人既然放弃了某项权利，日后就不得再向被保险人主张这种权利。ABCD四个选项均是最大诚信原则的内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378064", "t": 2, "q": "保险法规定，保险合同应当包括的法定条款有", "a": ["保险标的", "保险责任和责任免除", "保险期间和保险责任开始时间", "保险金额和保险费及其支付办法", "", ""], "r": "ABCD", "e": "保险合同法定条款包含保险标的、保险责任与责任免除、保险期间与责任开始时间、保险金额及保费支付办法等关键内容。ABCD选项均是保险合同应有的法定条款。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378065", "t": 2, "q": "保险理赔的基本原则包括（　）", "a": ["重合同、守信用", "实事求是", "主动、迅速、准确、合理", "先赔偿、后追偿", "", ""], "r": "ABC", "e": "保险理赔需遵循重合同守信用，按合同履行义务；要实事求是，客观处理；做到主动、迅速、准确、合理，保障被保险人权益。先赔偿后追偿是某些保险业务流程，并非基本原则。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378066", "t": 2, "q": "损失补偿原则的派生原则有（　）", "a": ["代位求偿权", "重复保险分摊原则", "近因原则", "最大诚信原则", "", ""], "r": "AB", "e": "损失补偿原则的派生原则主要是代位求偿权和重复保险分摊原则。代位求偿权可防止被保险人获得双重赔偿；重复保险分摊原则能合理分摊赔偿责任。近因原则是判断保险责任的原则，最大诚信原则是保险活动基本准则。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378067", "t": 2, "q": "人身保险合同中，被保险人的权利包括", "a": ["指定受益人", "变更受益人", "请求给付保险金", "解除保险合同", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378068", "t": 2, "q": "健康保险的保险责任通常包括", "a": ["疾病治疗费用", "伤残给付", "死亡给付", "生育相关费用", "", ""], "r": "AD", "e": "健康保险主要保障与健康相关的费用等。疾病治疗费用是健康保险常见保险责任，生育相关费用在一些健康险中也会涵盖。伤残和死亡给付一般是人寿保险范畴。所以答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378069", "t": 2, "q": "新型电力系统保险的创新点包括（　）", "a": ["风险评估技术创新", "保险产品定制化", "理赔服务数字化", "保险责任范围扩大", "", ""], "r": "ABCD", "e": "新型电力系统保险在多方面创新，风险评估技术创新可更精准评估风险；产品定制化能契合不同电力系统需求；理赔服务数字化提升效率；保险责任范围扩大保障更全面。ABCD选项均是其创新点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378070", "t": 2, "q": "下列关于工伤保险的说法中，正确的有", "a": ["工伤保险由用人单位缴纳，职工不缴纳", "工伤保险实行无过错责任原则", "工伤保险的保障范围包括因工作原因受到的伤害", "工伤保险待遇包括医疗救治和经济补偿", "", ""], "r": "ABCD", "e": "工伤保险由用人单位缴费，职工不缴，A对；实行无过错责任，即不论职工有无过错都可获赔，B对；保障因工作原因受的伤害，C对；待遇含医疗救治和经济补偿，D对。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378071", "t": 2, "q": "下列关于保险代理人的表述，正确的有", "a": ["保险代理人必须在保险人授权范围内从事保险业务", "保险代理人的行为后果由保险人承担", "保险代理人可以同时为多家保险公司代理业务", "保险代理人需具备相应的从业资格", "", ""], "r": "ABD", "e": "保险代理人需在保险人授权范围内开展业务，其行为后果由保险人担责，且要具备从业资格，不过个人保险代理人一般不得同时为多家保险公司代理业务。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378072", "t": 2, "q": "保险中介机构包括", "a": ["保险代理人", "保险经纪人", "保险公估人", "保险公司", "", ""], "r": "ABC", "e": "保险中介机构是连接保险人和投保人的桥梁，包括保险代理人、保险经纪人、保险公估人。而保险公司是直接提供保险服务的主体，并非中介机构。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378073", "t": 2, "q": "保险理赔的基本原则包括", "a": ["重合同、守信用", "实事求是", "主动、迅速、准确、合理", "自愿原则", "", ""], "r": "ABC", "e": "保险理赔基本原则有重合同守信用，即按合同约定处理；实事求是，客观公正处理；主动、迅速、准确、合理，高效理赔。而自愿原则是保险订立原则。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378074", "t": 2, "q": "保险法规定，保险人可以解除保险合同的情形包括", "a": ["投保人故意隐瞒事实，不履行如实告知义务", "投保人因重大过失未履行如实告知义务，足以影响保险人决定是否同意承保", "被保险人未履行危险增加通知义务", "投保人未按时缴纳保险费", "", ""], "r": "ABC", "e": "A选项投保人故意隐瞒不履行如实告知，B选项重大过失未如实告知且影响承保，C选项被保险人未履行危险增加通知义务，这些都影响保险人风险评估和权益，保险人可解除合同；而D选项投保人未按时缴费，一般是先催告、宽限期等处理，不会直接解除合同。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378075", "t": 2, "q": "保险市场的构成要素包括（　）", "a": ["保险供给者", "保险需求者", "保险中介", "保险监管机构", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378076", "t": 2, "q": "下列属于新型电力系统核心设备的保险标的有（　）", "a": ["风电发电机组", "光伏组件", "特高压变压器", "储能电池", "", ""], "r": "ABCD", "e": "新型电力系统强调清洁低碳、安全可控等，风电、光伏是新能源发电代表，特高压变压器用于高效输电，储能电池能解决新能源不稳定问题，它们都是新型电力系统核心设备，都可作为保险标的。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378077", "t": 2, "q": "下列险种中，属于财产保险的有", "a": ["企业财产保险", "货物运输保险", "责任保险", "信用保险", "", ""], "r": "ABCD", "e": "财产保险是以财产及其有关利益为保险标的的保险，企业财产保险保企业财产，货物运输保险保运输货物，责任保险保被保险人的民事损害赔偿责任，信用保险保信用风险，这些都属于财产保险范畴。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378078", "t": 2, "q": "社会保险与商业保险的共同点包括", "a": ["都具有风险转移功能", "都以盈利为目的", "都需要建立保险基金", "都具有保障功能", "", ""], "r": "ACD", "e": "社会保险是保障公民基本生活等，不以盈利为目的；商业保险以盈利为目的。二者都能转移风险、建立保险基金、具有保障功能。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378079", "t": 2, "q": "下列属于健康保险承保范围的有", "a": ["疾病导致的医疗费用支出", "疾病导致的收入损失", "意外伤害导致的医疗费用支出", "意外伤害导致的残疾给付", "", ""], "r": "AB", "e": "健康保险主要保障因健康原因带来的损失，包括疾病医疗费用、疾病导致的收入损失等。意外伤害导致的医疗费用和残疾给付一般属于意外伤害保险范畴。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378080", "t": 2, "q": "保险合同的辅助人包括（　）", "a": ["保险代理人", "保险经纪人", "保险公估人", "保险人", "", ""], "r": "ABC", "e": "保险代理人、保险经纪人和保险公估人是协助保险合同订立、履行等的辅助人，保险人是保险合同的一方当事人，并非辅助人。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378081", "t": 2, "q": "最大诚信原则要求投保人履行的义务包括", "a": ["如实告知", "缴纳保费", "危险增加通知", "防灾防损", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818596869378082", "t": 2, "q": "保险合同的书面形式包括", "a": ["保险单", "保险凭证", "暂保单", "口头协议", "", ""], "r": "ABC", "e": "保险合同书面形式有保险单、保险凭证、暂保单等，而口头协议不属于书面形式。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731264", "t": 3, "q": "投保人故意不履行如实告知义务的，保险人对于合同解除前发生的保险事故，不承担赔偿责任，但应退还保险费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "投保人故意不履行如实告知义务，保险人对合同解除前发生的保险事故不承担赔偿责任，且不退还保险费。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731265", "t": 3, "q": "保险经纪人可以同时为多家保险公司代理业务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731266", "t": 3, "q": "被保险人故意制造保险事故的，保险人仍需承担给付保险金责任。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "若被保险人故意制造保险事故，这违背保险诚信原则和基本原理，保险人无需担责。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731267", "t": 3, "q": "投保人未履行如实告知义务，保险人一定有权解除合同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "投保人未履行如实告知义务，保险人并非一定有权解除合同。若保险人在知道有解除事由之日起三十日内未行使解除权，或自合同成立之日起超过二年的，保险人不得解除合同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731268", "t": 3, "q": "新型电力系统保险仅保障新能源发电设备的损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "新型电力系统保险保障范围广泛，不只是新能源发电设备损失，还涉及电网运行、电力交易等多方面风险。", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731269", "t": 3, "q": "近因原则中的\"近因\"是指导致损失发生的最后一个原因。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "近因原则里的“近因”并非指导致损失发生的最后一个原因，而是指造成损失的最直接、最有效、起决定性作用的原因。", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731270", "t": 3, "q": "保险代位求偿权仅适用于财产保险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险代位求偿权是指保险人在赔偿被保险人损失后，取得在其赔付金额限度内要求被保险人转让其对造成损失的第三人追偿的权利，此制度目的在于防止被保险人获得双重赔偿，避免不当得利，主要适用于财产保险，人身保险中因人身无价，一般不存在代位求偿情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731271", "t": 3, "q": "健康保险既包括医疗费用保险，也包括疾病给付保险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "健康保险是以被保险人的身体为保险标的，使被保险人在疾病或意外事故所致伤害时发生的费用或损失获得补偿的一种保险，涵盖医疗费用保险和疾病给付保险等类型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731272", "t": 3, "q": "社会保险基金实行专款专用，不得挪作他用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "社会保险基金关乎参保人员权益和社会保障体系稳定，专款专用是其核心原则，挪作他用会损害参保人利益、破坏社保制度运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731273", "t": 3, "q": "财产保险合同均为补偿性合同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "财产保险的目的是补偿被保险人因保险标的遭受损失而产生的经济损失，以实际损失为限进行赔偿，所以财产保险合同均为补偿性合同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731274", "t": 3, "q": "保险合同的客体是保险标的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同的客体是投保人或被保险人对保险标的所具有的保险利益，而非保险标的本身。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731275", "t": 3, "q": "损失补偿原则适用于所有保险业务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "损失补偿原则主要适用于财产保险等补偿性保险业务，人身保险大多具有给付性，不适用损失补偿原则。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731276", "t": 3, "q": "保险经纪人代表保险人的利益开展保险业务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险经纪人是基于投保人的利益，为投保人与保险人订立保险合同提供中介服务，并依法收取佣金的机构，并非代表保险人利益。", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731277", "t": 3, "q": "最大诚信原则仅要求投保人履行如实告知义务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "最大诚信原则要求保险合同双方都要遵守，不仅投保人要履行如实告知义务，保险人也需履行说明义务、及时全面支付保险金等，并非仅针对投保人。", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731278", "t": 3, "q": "保险费率的纯费率主要用于覆盖保险公司的运营费用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "纯费率是用于支付保险赔款或给付保险金的费率，并非覆盖保险公司运营费用，运营费用由附加费率覆盖。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731279", "t": 3, "q": "保险经纪人是基于保险人的利益，为投保人与保险人订立保险合同提供中介服务的机构。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。保险经纪人是基于投保人的利益，为投保人与保险人订立保险合同提供中介服务的机构，而不是基于保险人利益，所以该题答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731280", "t": 3, "q": "保险合同的客体是保险标的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同的客体是投保人或被保险人对保险标的所具有的保险利益，而非保险标的本身。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731281", "t": 3, "q": "保险的损失补偿原则适用于所有保险合同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "损失补偿原则主要适用于财产保险合同，人身保险合同大多不适用，因为人的生命和身体价值难以用货币衡量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731282", "t": 3, "q": "保险合同成立后，投保人可以任意解除合同，保险人不得解除合同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般情况下，保险合同成立后投保人有解除合同的权利，但保险人在法定情形下也可解除合同，并非不得解除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731283", "t": 3, "q": "社会保险基金实行统收统支，不得进行任何形式的投资运营。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。社会保险基金并非不得进行任何形式投资运营，在保证安全的前提下，部分社保基金可以通过合法合规方式进行投资运营以实现保值增值，如基本养老保险基金就可开展市场化投资运营。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731284", "t": 3, "q": "最大诚信原则中的告知义务是指投保人需告知所有与保险标的相关的事实。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "告知义务并非要求投保人告知所有与保险标的相关事实，而是重要事实。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731285", "t": 3, "q": "损失补偿原则的例外情况包括定值保险、重置价值保险和人身保险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "定值保险在发生保险事故时按约定价值赔付，不考虑实际损失；重置价值保险按重置成本赔偿，不局限于实际损失；人身保险的标的是人的生命和身体，无法用货币衡量损失，这三种情况都不严格遵循损失补偿原则，属于损失补偿原则的例外。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731286", "t": 3, "q": "新型电力系统保险仅保障光伏、风电等新能源发电项目的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "新型电力系统保险保障范围不局限于光伏、风电等新能源发电项目风险，还涵盖电力系统多个环节的风险。", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731287", "t": 3, "q": "新型电力系统保险的风险主要来源于设备老化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "新型电力系统保险的风险来源是多方面的，除了设备老化，还包括极端天气、自然灾害、网络攻击、新能源接入带来的不稳定等多种因素。所以仅说风险主要来源于设备老化是错误的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731288", "t": 3, "q": "保险合同的射幸性意味着投保人必然会获得保险金赔付。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "射幸性指保险合同履行的结果具有不确定性，投保人是否能获保险金赔付取决于保险事故是否发生，并非必然能获得。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731289", "t": 3, "q": "电力企业海外投资保险仅承保政治风险，不承保商业风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731290", "t": 3, "q": "保险经纪人代表保险人的利益开展保险业务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险经纪人是基于投保人的利益，为投保人与保险人订立保险合同提供中介服务，并依法收取佣金的机构，并非代表保险人利益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731291", "t": 3, "q": "保险经纪人是基于保险人的利益开展保险中介业务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险经纪人是基于投保人的利益，为投保人与保险人订立保险合同提供中介服务，并依法收取佣金的机构，并非基于保险人利益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731292", "t": 3, "q": "保险合同成立后，投保人可以任意解除合同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据保险法规定，保险合同成立后，投保人一般可以解除合同，但并非“任意”，如货物运输保险合同和运输工具航程保险合同，在保险责任开始后，投保人不得解除合同。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731293", "t": 3, "q": "保险的分散风险职能是通过将少数人的损失由多数人分担实现的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险的分散风险职能就是把集中在某一单位或个人身上的风险损失，通过收取保险费的方式平均分摊给众多的被保险人，也就是少数人的损失由多数人分担。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731294", "t": 3, "q": "重复保险的投保人应当将重复保险的有关情况通知各保险人。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "重复保险时，投保人有义务将重复保险的有关情况通知各保险人，这是为了让保险人能准确评估风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731295", "t": 3, "q": "健康保险既可以采用定额给付方式，也可以采用补偿方式。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "健康保险中像一些特定疾病保险可采用定额给付，而医疗费用保险常采用补偿方式，所以健康保险既可用定额给付方式，也可用补偿方式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731296", "t": 3, "q": "新型电力系统中的风电项目保险，不承保风机叶片的自然老化损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731297", "t": 3, "q": "最大诚信原则仅要求投保人履行如实告知义务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "最大诚信原则要求保险合同双方都要履行如实告知等义务，并非仅针对投保人。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731298", "t": 3, "q": "人身保险的保险金请求权自其知道保险事故发生之日起5年不行使而消灭。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据保险法规定，人寿保险的保险金请求权，自被保险人或受益人知道保险事故发生之日起5年不行使而消灭，而人身保险包含人寿保险、健康险、意外险等，并非所有人身保险都适用5年时效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731299", "t": 3, "q": "保险合同的无效分为绝对无效和相对无效。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险合同无效的确可分为绝对无效和相对无效，绝对无效是指合同自始不发生效力等，相对无效通常存在可撤销等情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731300", "t": 3, "q": "投保人未履行如实告知义务，即使保险事故与未告知事项无关，保险人也可以解除合同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据保险法规定，若投保人故意或因重大过失未履行如实告知义务，足以影响保险人决定是否同意承保或提高保险费率的，保险人有权解除合同。且只有当未告知事项对保险事故的发生有严重影响时，保险人对于合同解除前发生的保险事故才不承担赔偿或给付保险金的责任。所以即便投保人未履行如实告知义务，若保险事故与未告知事项无关，保险人不一定能解除合同。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731301", "t": 3, "q": "保险的数理基础是大数法则和概率论。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数法则和概率论是保险经营的重要数理基础，保险公司依据此科学计算风险发生概率和损失程度，合理厘定费率等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731302", "t": 3, "q": "风险损失概率与损失程度成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "风险损失概率和损失程度并无必然的正比关系，损失概率高时损失程度不一定高，反之亦然。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731303", "t": 3, "q": "社会保险具有强制性，所有劳动者必须参加各项社会保险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731304", "t": 3, "q": "保险市场的供给方包括保险公司、保险中介机构和保险监管机构。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险市场供给方主要是保险公司，提供保险产品和服务。保险中介机构是连接供需双方的桥梁，保险监管机构是对保险市场进行监督管理的，并非供给方。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731305", "t": 3, "q": "定值保险合同中，保险标的的保险价值在合同订立时确定，发生损失时按约定价值赔偿。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "定值保险合同就是在订立合同时确定保险标的价值，出险时按约定价值赔偿。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731306", "t": 3, "q": "新型电力系统保险中，储能电站的电池衰减损失属于保险责任范围。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731307", "t": 3, "q": "保险合同解除后，保险人应当退还投保人已缴纳的全部保险费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同解除的情况多样，并非所有解除情形下保险人都要退还投保人已缴全部保险费。比如因投保人故意不履行如实告知义务，保险人解除合同的，不退还保险费。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034818597934731308", "t": 3, "q": "健康保险既可以采用补偿型保险方式，也可以采用定额给付型保险方式。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "健康保险中，像医疗费用保险通常采用补偿型，依据实际花费报销；而一些疾病保险等可采用定额给付型，确诊符合合同约定疾病就按约定金额给付。所以该说法正确。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 保险学（4）", "n": "基础练习题【含解析】 / 第5章 保险学（4）", "qs": [{"id": "2034818600174489600", "t": 1, "q": "在保险数理基础中，用来衡量风险发生频率的指标是（　）", "a": ["损失程度", "损失概率", "风险系数", "保额损失率", "", ""], "r": "B", "e": "损失概率用于衡量风险发生的频率。损失程度侧重损失大小；风险系数衡量风险大小；保额损失率反映赔偿金额与保额关系。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489601", "t": 1, "q": "新型电力系统保险中，针对光伏电站设备因雷击造成的损坏提供保障的险种属于", "a": ["财产损失保险", "责任保险", "信用保险", "保证保险", "", ""], "r": "A", "e": "光伏电站设备因雷击损坏是财产受损，财产损失保险是对财产因自然灾害或意外事故导致的损失提供保障。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489602", "t": 1, "q": "下列属于保险合同格式条款的是", "a": ["投保单中的个性化填写内容", "保险单中的保险金额约定", "保险条款中的免责条款", "批单中的补充约定内容", "", ""], "r": "C", "e": "格式条款是预先拟定且未与对方协商的条款，免责条款是保险合同预先设定好的，属于格式条款。投保单个性化填写、保险金额约定、批单补充约定都不是预先拟定未协商的格式内容。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489603", "t": 1, "q": "下列人身保险产品中，兼具保障和储蓄功能的是", "a": ["定期寿险", "终身寿险", "意外伤害保险", "健康保险", "", ""], "r": "B", "e": "定期寿险只有保障功能，意外伤害保险和健康保险主要是提供保障。终身寿险不仅能在被保险人死亡或全残时提供保障，还具有一定的储蓄性，能积累现金价值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489604", "t": 1, "q": "下列社会保险项目中，实行个人账户与统筹账户相结合制度的是（　）", "a": ["工伤保险", "生育保险", "养老保险", "失业保险", "", ""], "r": "C", "e": "养老保险实行个人账户与统筹账户相结合制度，而工伤保险、生育保险全部由单位缴费，没有个人账户；失业保险虽有个人缴费，但未实行此结合制度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489605", "t": 1, "q": "社会保险体系中，不属于我国法定社会保险的是", "a": ["养老保险", "失业保险", "商业医疗保险", "工伤保险", "", ""], "r": "C", "e": "法定社会保险是国家强制实施的保障制度，包括养老、失业、工伤、医疗、生育等。商业医疗保险是商业保险公司提供的保险服务，并非法定社会保险。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489606", "t": 1, "q": "某企业投保财产综合险，保险金额为100万元，保险标的实际价值为120万元，发生保险事故造成损失80万元，按比例赔偿方式，保险人应赔偿的金额是（　）", "a": ["66.67万元", "80万元", "100万元", "120万元", "", ""], "r": "A", "e": "比例赔偿方式下，赔偿金额=损失金额×（保险金额÷保险标的实际价值），即80×（100÷120）≈66.67万元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489607", "t": 1, "q": "下列选项中，不属于保险基本原则的是（　）", "a": ["最大诚信原则", "近因原则", "公平竞争原则", "损失补偿原则", "", ""], "r": "C", "e": "保险基本原则有最大诚信、近因、损失补偿等原则，公平竞争原则是市场活动原则，并非保险基本原则。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489608", "t": 1, "q": "人身保险中，投保人对下列人员不具有保险利益的是", "a": ["本人", "配偶、子女、父母", "与投保人有劳动关系的劳动者", "投保人的朋友（无法律上的利害关系）", "", ""], "r": "D", "e": "在人身保险里，投保人对本人、配偶、子女、父母以及与投保人有劳动关系的劳动者具有保险利益，而对无法律上利害关系的朋友不具有保险利益。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489609", "t": 1, "q": "保险合同中，投保人对保险标的不具有保险利益时，保险合同的效力状态是", "a": ["有效", "无效", "可撤销", "效力待定", "", ""], "r": "B", "e": "根据保险法规定，投保人对保险标的不具有保险利益的，保险合同无效。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489610", "t": 1, "q": "社会保险的保障水平是（　）", "a": ["满足被保险人的基本生活需求", "满足被保险人的较高生活需求", "由被保险人的缴费水平决定", "与商业保险保障水平一致", "", ""], "r": "A", "e": "社会保险旨在保障公民基本生活，提供基本保障。B选项较高生活需求不是其保障范畴；C选项缴费水平会影响待遇但不是决定保障水平本质；D选项商业保险保障水平多样，和社会保险不同。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489611", "t": 1, "q": "保险市场中，负责设计保险产品、承担保险责任的主体是", "a": ["保险中介机构", "保险人", "投保人", "被保险人", "", ""], "r": "B", "e": "保险人即保险公司，负责设计保险产品并承担保险责任。保险中介是连接保险人与投保人的桥梁；投保人是与保险人订立合同并支付保费的人；被保险人是受保险合同保障的人。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489612", "t": 1, "q": "电力企业海外投资保险的承保机构通常是", "a": ["商业保险公司", "政府专属保险机构", "国际保险联盟", "投资所在国保险公司", "", ""], "r": "B", "e": "电力企业海外投资面临政治、经济等多方面风险，商业保险一般不愿承担。政府专属保险机构能从国家层面给予支持，有能力和意愿承保此类风险。所以电力企业海外投资保险的承保机构通常是政府专属保险机构。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489613", "t": 1, "q": "人身保险合同中，被保险人死亡后，保险金作为被保险人的遗产，由保险人依照《中华人民共和国继承法》的规定履行给付保险金义务的情形是", "a": ["受益人指定不明无法确定的", "受益人先于被保险人死亡，没有其他受益人的", "受益人依法丧失受益权或者放弃受益权，没有其他受益人的", "以上都是", "", ""], "r": "D", "e": "当出现受益人指定不明无法确定、先于被保险人死亡且无其他受益人、依法丧失或放弃受益权且无其他受益人的情况时，保险金会作为被保险人遗产处理。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489614", "t": 1, "q": "新型电力系统中，针对电网因极端天气导致的大面积停电提供保障的保险属于", "a": ["财产保险", "责任保险", "工程保险", "巨灾保险", "", ""], "r": "D", "e": "巨灾保险主要是针对因重大自然灾害等极端事件（如极端天气导致大面积停电）造成的巨大损失提供保障。财产保险主要保财产本身；责任保险保的是法律责任；工程保险针对工程项目。所以选巨灾保险。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489615", "t": 1, "q": "新型电力系统中，分布式光伏电站保险的保险责任不包括", "a": ["自然灾害导致的设备损坏", "人为破坏导致的设备损失", "发电效率未达预期的收益损失", "意外事故导致的供电中断损失", "", ""], "r": "C", "e": "分布式光伏电站保险主要保设备物理损坏及意外事故供电中断等损失，发电效率受多种复杂因素影响，未达预期属经营风险，不在保险责任内。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489616", "t": 1, "q": "下列不属于财产保险承保标的的是", "a": ["企业厂房", "运输工具", "被保险人的生命", "家庭财产", "", ""], "r": "C", "e": "财产保险承保的是财产及其相关利益，生命属于人身范畴，不是财产保险承保标的。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489617", "t": 1, "q": "保险理赔中，被保险人向保险人请求赔偿或者给付保险金的诉讼时效期间为（　）", "a": ["1年", "2年", "3年", "5年", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489618", "t": 1, "q": "保险合同的客体是", "a": ["保险标的", "保险利益", "保险金额", "保险责任", "", ""], "r": "B", "e": "保险合同的客体是投保人或被保险人对保险标的具有的法律上承认的利益，即保险利益。保险标的是保险利益的载体。保险金额是赔偿的额度，保险责任是保险人承担的风险范围。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489619", "t": 1, "q": "在人身保险中，被保险人故意犯罪导致自身伤残或死亡的，保险人的处理方式是", "a": ["全额给付保险金", "部分给付保险金", "不承担给付保险金责任", "退还保险费", "", ""], "r": "C", "e": "被保险人故意犯罪致自身伤残或死亡违背保险风险控制原则，保险人无需承担给付责任。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489620", "t": 1, "q": "保险的基本职能不包括", "a": ["分散风险", "损失补偿", "资金融通", "防灾防损", "", ""], "r": "C", "e": "保险基本职能是分散风险和损失补偿。资金融通是派生职能，防灾防损是辅助职能。所以不包括的是资金融通和防灾防损，但题目是单选题，资金融通是更典型不属基本职能的选项。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489621", "t": 1, "q": "下列不属于财产保险的是", "a": ["家庭财产保险", "工程保险", "健康保险", "农业保险", "", ""], "r": "C", "e": "财产保险是以财产及其有关利益为保险标的的保险。家庭财产保险保家庭财产，工程保险保工程项目，农业保险保农业生产相关财产。而健康保险是以人的身体为保险标的，属于人身保险，并非财产保险。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489622", "t": 1, "q": "保险理赔管理中，保险人收到被保险人或者受益人的赔偿或者给付保险金的请求后，应当及时作出核定;情形复杂的，应当在一定期限内作出核定，该期限是", "a": ["30日", "60日", "90日", "180日", "", ""], "r": "A", "e": "法律规定保险人收到请求后，情形复杂的应在30日内作出核定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489623", "t": 1, "q": "保险合同中，投保人对保险标的所具有的法律上承认的利益被称为", "a": ["保险价值", "保险金额", "保险利益", "保险责任", "", ""], "r": "C", "e": "保险利益就是投保人对保险标的所具有的法律上承认的利益。保险价值是保险标的价值；保险金额是保险人承担赔偿或给付保险金责任的最高限额；保险责任是保险人应承担的赔偿或给付保险金责任的范围。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489624", "t": 1, "q": "电力企业海外投资保险中，承保因投资所在国政府征收、国有化等行为造成损失的保险是（　）", "a": ["政治风险保险", "商业风险保险", "工程延误保险", "第三者责任险", "", ""], "r": "A", "e": "征收、国有化等行为属于政治范畴，这类风险由政治风险保险承保。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489625", "t": 1, "q": "电力企业海外投资保险的承保风险不包括", "a": ["政治风险", "商业风险", "战争风险", "汇兑限制风险", "", ""], "r": "B", "e": "海外投资保险主要承保政治风险，如战争风险、汇兑限制风险等，商业风险一般不属于海外投资保险承保范围。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489626", "t": 1, "q": "保险合同的客体是", "a": ["保险标的", "保险利益", "保险责任", "保险金额", "", ""], "r": "B", "e": "保险合同的客体是投保人或被保险人对保险标的具有的法律上承认的利益，即保险利益。保险标的是保险利益的载体。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489627", "t": 1, "q": "在财产保险中，当保险标的发生部分损失后，投保人要求解除合同的，保险人应当将保险标的未受损失部分的保险费，按照合同约定扣除自保险责任开始之日起至合同解除之日止应收的部分后", "a": ["全额退还", "不予退还", "退还剩余部分", "双倍退还", "", ""], "r": "C", "e": "投保人解除部分损失的财产保险合同，保险人应扣除已承担责任期间保费后退还剩余部分保费。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489628", "t": 1, "q": "保险的数理基础主要基于", "a": ["正态分布", "大数法则", "小数法则", "中心极限定理", "", ""], "r": "B", "e": "保险经营中依据大数法则，通过大量风险单位的集合，使风险发生的偶然性趋于稳定性，从而合理计算费率等。正态分布、中心极限定理和保险数理基础关联不大，小数法则并非保险数理基础。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489629", "t": 1, "q": "电力企业海外投资保险中，承保因投资所在国政府征收、国有化导致损失的险种是", "a": ["战争险", "征收险", "汇兑险", "违约险", "", ""], "r": "B", "e": "题目问的是承保因投资所在国政府征收、国有化导致损失的险种，征收险就是针对这种情况的保险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489630", "t": 1, "q": "社会保险的缴费模式中，由雇主和雇员共同缴费，政府给予适当补贴的模式是", "a": ["现收现付制", "完全积累制", "部分积累制", "三方分担制", "", ""], "r": "D", "e": "三方分担制就是由雇主、雇员共同缴费，政府给予适当补贴。现收现付制是用当期缴费支付当期待遇；完全积累制是个人缴费完全积累；部分积累制是介于现收现付和完全积累之间。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489631", "t": 1, "q": "保险理赔的核心环节是（　）", "a": ["报案受理", "损失核定", "责任认定", "保险金给付", "", ""], "r": "C", "e": "责任认定是确定是否属于保险责任范围，是理赔关键，决定是否赔付，是核心环节。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489632", "t": 1, "q": "下列选项中，不属于人身保险合同常见条款的是", "a": ["代位求偿条款", "宽限期条款", "复效条款", "受益人变更条款", "", ""], "r": "A", "e": "代位求偿是财产保险补偿原则派生的代位原则内容，不适用于人身保险；宽限期、复效、受益人变更条款在人身保险合同中常见。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489633", "t": 1, "q": "下列关于保险市场主体的表述，错误的是", "a": ["保险人是保险市场的供给方", "投保人是保险市场的需求方", "保险经纪人代表保险人的利益", "保险代理人代表保险人的利益", "", ""], "r": "C", "e": "保险经纪人是基于投保人的利益，为投保人与保险人订立保险合同提供中介服务并依法收取佣金的机构，并非代表保险人利益。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818600174489634", "t": 1, "q": "根据保险法规定，保险合同成立的时间是（　）", "a": ["投保人提出投保申请时", "保险人同意承保时", "保险单签发时", "投保人缴纳保险费时", "", ""], "r": "B", "e": "保险合同是诺成合同，保险人同意承保意味着双方就保险事宜达成合意，此时合同成立。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524480", "t": 2, "q": "人身保险合同中，受益人变更的有效条件包括", "a": ["经被保险人同意", "书面通知保险人", "投保人单独决定", "无需通知保险人", "", ""], "r": "AB", "e": "人身保险合同中，受益人变更需经被保险人同意，且要书面通知保险人。投保人不能单独决定，不通知保险人变更无效。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524481", "t": 2, "q": "社会保险中的养老保险，其资金来源包括", "a": ["用人单位缴费", "个人缴费", "财政补贴", "保险基金投资收益", "", ""], "r": "ABCD", "e": "养老保险资金来源多样，用人单位缴费、个人缴费是常规主要来源，财政补贴用于弥补资金缺口等，保险基金投资收益也会充实资金。ABCD选项均是养老保险资金来源。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524482", "t": 2, "q": "健康保险的保险责任包括（　）", "a": ["疾病给付", "医疗费用补偿", "伤残给付", "死亡给付", "", ""], "r": "AB", "e": "健康保险主要保障与健康相关的风险，包括因疾病导致的给付和对医疗费用的补偿。伤残和死亡给付通常是人寿保险或意外伤害保险范畴。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524483", "t": 2, "q": "电力企业海外投资保险承保的政治风险包括", "a": ["战争风险", "征收风险", "汇兑限制风险", "商业违约风险", "", ""], "r": "ABC", "e": "海外投资保险的政治风险通常指与政治因素相关的风险，战争、征收、汇兑限制都属于政治风险范畴；而商业违约风险是商业活动中交易方违约导致的风险，不属于政治风险。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524484", "t": 2, "q": "下列关于社会保险基金的表述，正确的有", "a": ["实行专款专用", "主要来源于单位和个人缴费", "可用于资本市场投资运营", "由个人完全承担缴费责任", "", ""], "r": "ABC", "e": "社会保险基金专款专用，主要由单位和个人缴费构成，部分可进行资本市场投资运营，并非个人完全承担缴费责任。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524485", "t": 2, "q": "下列选项中，属于财产保险损失补偿方式的有", "a": ["比例赔偿方式", "第一危险赔偿方式", "限额赔偿方式", "全额赔偿方式", "", ""], "r": "ABC", "e": "财产保险损失补偿方式常见有比例赔偿、第一危险赔偿、限额赔偿等。比例赔偿按保险金额与保险价值比例计算赔偿；第一危险赔偿在保额限度内按实际损失赔偿；限额赔偿按约定限额赔偿。全额赔偿不是常见损失补偿方式。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524486", "t": 2, "q": "电力企业海外投资保险的承保风险包括", "a": ["政治风险", "商业风险", "自然风险", "信用风险", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524487", "t": 2, "q": "财产保险中，保险事故发生的近因包括（　）", "a": ["单一原因", "多种原因同时发生", "多种原因连续发生", "多种原因间断发生", "", ""], "r": "ABCD", "e": "财产保险中，保险事故发生近因有单一原因、多种原因同时发生、连续发生和间断发生多种情况。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524488", "t": 2, "q": "下列关于保险利益的说法，正确的有（　）", "a": ["保险利益必须是合法的利益", "保险利益必须是确定的利益", "保险利益必须是经济上的利益", "保险利益可以是未来的利益", "", ""], "r": "ABCD", "e": "保险利益需具有合法性、确定性、经济性，且可以是现有利益，也可以是期待的未来利益。ABCD选项均符合保险利益的特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524489", "t": 2, "q": "新型电力系统保险的特点包括", "a": ["风险集中度高", "保障范围广", "专业性强", "与电力政策关联度高", "", ""], "r": "ABCD", "e": "新型电力系统涉及众多复杂设备和技术，运行风险大且集中，需专业知识评估风险，保障涵盖发输配用等多环节，同时受电力政策引导和约束。ABCD选项均符合其特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524490", "t": 2, "q": "下列属于保险合同无效的情形有", "a": ["投保人对保险标的无保险利益", "保险合同条款违反法律、行政法规强制性规定", "保险人未履行说明义务", "投保人故意隐瞒重要事实", "", ""], "r": "AB", "e": "保险利益是保险合同有效前提，无保险利益合同无效；合同条款违反法律、行政法规强制性规定也会导致合同无效。保险人未履行说明义务一般影响合同效力认定但不一定无效；投保人故意隐瞒重要事实是可使保险人解除合同，并非直接导致合同无效。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524491", "t": 2, "q": "保险市场的主体包括", "a": ["保险人", "投保人", "被保险人", "保险经纪人", "", ""], "r": "ABCD", "e": "保险市场主体指参与保险市场交易的各类参与者，保险人是提供保险服务的一方，投保人是与保险人订立保险合同并支付保费的人，被保险人是受保险合同保障的人，保险经纪人是为投保人与保险人订立保险合同提供中介服务的人，ABCD 都是保险市场主体。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524492", "t": 2, "q": "保险的派生职能包括", "a": ["资金融通", "防灾防损", "分散风险", "损失补偿", "", ""], "r": "AB", "e": "保险基本职能是分散风险和损失补偿，派生职能有资金融通、防灾防损等。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524493", "t": 2, "q": "下列关于最大诚信原则的说法，正确的有（　）", "a": ["投保人的告知义务是无限告知", "保险人的告知义务包括明确说明免责条款", "投保人违反告知义务可能导致合同解除", "保险人违反告知义务可能导致赔偿责任", "", ""], "r": "BCD", "e": "A项投保人告知一般为询问告知非无限告知；B项保险人有明确说明免责条款等告知义务；C项投保人若违反如实告知义务，保险人有权解除合同；D项保险人违反告知义务，可能需承担赔偿责任。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524494", "t": 2, "q": "保险合同的主体包括", "a": ["保险人", "投保人", "被保险人", "保险标的", "", ""], "r": "ABC", "e": "保险合同主体指参与保险合同订立、享有权利和承担义务的人，包括保险人、投保人、被保险人等。保险标的是保险合同指向的对象，并非主体。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524495", "t": 2, "q": "新型电力系统保险的保障范围包括", "a": ["新能源发电设备损失", "电网输电线路故障损失", "电力储能设备损坏", "电力企业运营中断损失", "", ""], "r": "ABCD", "e": "新型电力系统保险保障与新型电力系统各环节相关风险，ABCD选项涉及的新能源发电、电网输电、电力储能以及电力企业运营等方面损失都在保障范围内。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524496", "t": 2, "q": "健康保险按保障期限划分，可分为（　）", "a": ["短期健康保险", "长期健康保险", "终身健康保险", "定期健康保险", "", ""], "r": "AB", "e": "健康保险按保障期限分主要是短期和长期。短期健康保险保障期限通常在一年及以下；长期健康保险保障期限一般超过一年。终身健康保险和定期健康保险并非按保障期限划分的主流类别。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524497", "t": 2, "q": "损失补偿原则的限制条件包括", "a": ["以保险利益为限", "以保险金额为限", "以实际损失为限", "以保险价值为限", "", ""], "r": "ABC", "e": "损失补偿原则要求被保险人获得的补偿不能超过其实际损失等。以保险利益确定了补偿的基础范围，以保险金额确定了补偿上限，以实际损失明确了补偿的真实额度。所以限制条件包括以保险利益为限、以保险金额为限、以实际损失为限。而保险价值并非普遍适用的损失补偿限制条件。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524498", "t": 2, "q": "下列关于损失补偿原则的说法，正确的有（　）", "a": ["损失补偿以保险责任范围内的损失发生为前提", "损失补偿以被保险人的实际损失为限", "损失补偿不超过保险金额", "损失补偿可以使被保险人获得额外利益", "", ""], "r": "ABC", "e": "损失补偿原则是指当保险事故发生使被保险人遭受损失时，保险人必须在保险责任范围内对被保险人所受的损失进行补偿，以保险责任范围内损失发生为前提，且以实际损失和保险金额为限，不能让被保险人获额外利益。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524499", "t": 2, "q": "财产保险中，损失补偿原则的限制条件包括", "a": ["以保险金额为限", "以实际损失为限", "以保险利益为限", "以保险费为限", "", ""], "r": "ABC", "e": "损失补偿原则是指当被保险人因保险事故遭受损失时，保险人在其责任范围内对被保险人所遭受的实际损失进行赔偿。赔偿要以实际损失、保险金额、保险利益为限，不能超过这些范围。而保险费是投保人支付给保险人的费用，与损失补偿的限制无关。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524500", "t": 2, "q": "保险的基本原则包括（　）", "a": ["最大诚信原则", "近因原则", "损失补偿原则", "保险利益原则", "", ""], "r": "ABCD", "e": "保险的基本原则涵盖最大诚信、近因、损失补偿和保险利益原则。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524501", "t": 2, "q": "下列选项中，属于意外伤害保险承保条件的有", "a": ["非本意的", "外来的", "突然的", "疾病导致的", "", ""], "r": "ABC", "e": "意外伤害需满足非本意、外来、突发等特征，疾病导致不属于意外伤害。ABC符合意外伤害保险承保条件里意外伤害的定义，D不符合。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524502", "t": 2, "q": "保险合同的书面形式包括", "a": ["投保单", "保险单", "保险凭证", "批单", "", ""], "r": "ABCD", "e": "投保单是投保人向保险人申请订立保险合同的书面要约；保险单是保险合同的主要书面表现形式；保险凭证是一种简化的保险单；批单是对原保险合同进行修改、补充或增删内容的书面文件，它们都属于保险合同书面形式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524503", "t": 2, "q": "保险市场的构成要素包括", "a": ["保险供给者", "保险需求者", "保险中介", "保险监管机构", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524504", "t": 2, "q": "根据我国保险法，保险合同的解除情形包括", "a": ["投保人单方解除", "保险人单方解除", "双方协商解除", "司法解除", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524505", "t": 2, "q": "保险的数理基础建立在概率论和大数法则之上，大数法则的作用包括", "a": ["消除个别风险的不确定性", "预测风险损失的总体趋势", "为保险费率的厘定提供依据", "提高保险经营的稳定性", "", ""], "r": "BCD", "e": "大数法则可使大量同质风险单位的损失趋向稳定，能预测风险损失总体趋势，为费率厘定提供依据，提高保险经营稳定性，但不能消除个别风险不确定性。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524506", "t": 2, "q": "新型电力系统保险的特点包括", "a": ["风险集中度高", "技术专业性强", "保障范围广", "政策依赖性强", "", ""], "r": "ABCD", "e": "新型电力系统涉及大量先进技术和复杂设备，技术专业性强；其涵盖发电、输电、变电等多个环节，保障范围广；电力行业受政策影响大，保险对政策依赖性强；同时电力系统故障等风险可能集中在特定区域或设备，风险集中度高。ABCD选项均符合新型电力系统保险特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524507", "t": 2, "q": "保险市场的构成要素包括", "a": ["保险主体", "保险客体", "保险价格", "保险监管机构", "", ""], "r": "ABC", "e": "保险市场构成要素主要有保险主体（参与保险活动的各类主体）、保险客体（保险标的）、保险价格（保费）。保险监管机构并非保险市场构成的基础要素。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524508", "t": 2, "q": "下列关于损失补偿原则的适用范围，说法正确的有", "a": ["适用于财产保险", "适用于人身保险中的健康保险", "不适用于人身保险中的人寿保险", "适用于所有保险业务", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524509", "t": 2, "q": "社会保险与商业保险的区别在于", "a": ["实施方式不同", "保障范围不同", "资金来源不同", "经营目的不同", "", ""], "r": "ABCD", "e": "社会保险具有强制性、保障基本生活、资金多渠道（政府、单位、个人）、以保障为目的；商业保险自愿参保、保障范围多样、资金主要来自投保人保费、以营利为目的，ABCD选项均体现了两者区别。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524510", "t": 2, "q": "人身保险按保险责任划分，包括", "a": ["人寿保险", "健康保险", "意外伤害保险", "财产保险", "", ""], "r": "ABC", "e": "人身保险是以人的生命和身体为保险标的，按保险责任划分有人寿保险、健康保险、意外伤害保险；财产保险与人身保险是不同类别。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524511", "t": 2, "q": "下列属于保险基本原则中近因原则判定方法的有", "a": ["顺推法", "逆推法", "排除法", "比例法", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524512", "t": 2, "q": "下列属于定值保险合同的适用场景有", "a": ["海上货物运输保险", "艺术品保险", "机动车辆保险", "古董保险", "", ""], "r": "ABD", "e": "定值保险适用于价值难以确定或波动大的标的。海上货物运输保险中货物价值在运输中较难准确衡量；艺术品和古董价值主观且波动大，难以在事故发生时准确评估实际价值。而机动车辆保险一般采用不定值保险。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524513", "t": 2, "q": "下列选项中，属于保险最大诚信原则中\"告知\"义务主体的有", "a": ["投保人", "保险人", "被保险人", "保险代理人", "", ""], "r": "ABC", "e": "在保险最大诚信原则里，投保人、被保险人对保险标的情况最了解，有义务向保险人如实告知；保险人也需向投保人说明合同内容等。而保险代理人主要是协助办理保险业务，并非“告知”义务主体。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818601621524514", "t": 2, "q": "社会保险与商业保险的区别在于（　）", "a": ["实施方式不同", "保障水平不同", "资金来源不同", "经营目的不同", "", ""], "r": "ABCD", "e": "社会保险是强制实施、保障基本生活、资金多渠道、以社会公益为目的；商业保险是自愿投保、保障水平多样、资金主要来自投保人保费、以盈利为目的，ABCD四个选项均体现了两者区别。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128960", "t": 3, "q": "财产保险中，保险标的的保险价值可以由投保人和保险人约定并在合同中载明。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "财产保险中，保险标的的保险价值可由投保人与保险人约定并在合同中载明，也可按照保险事故发生时保险标的的实际价值确定。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128961", "t": 3, "q": "保险代理人在授权范围内的行为后果由投保人承担。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险代理人在授权范围内的行为后果应由保险人承担，而非投保人。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128962", "t": 3, "q": "保险理赔的核心是确定保险责任和赔偿金额。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险理赔过程中，首要就是明确事故是否在保险责任范围内，然后在此基础上确定赔偿金额，这二者是理赔关键，所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128963", "t": 3, "q": "重复保险的投保人可以就保险标的的全部损失向各保险人请求全额赔偿。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重复保险中各保险人按比例承担赔偿责任，投保人不能就全部损失向各保险人请求全额赔偿，否则会获超额赔偿。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128964", "t": 3, "q": "社会保险具有强制性，由国家立法强制实施。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "社会保险是国家为了保障公民在年老、疾病、工伤、失业、生育等情况下依法从国家和社会获得物质帮助的权利而建立的社会保障制度，通过国家立法强制实施，用人单位和劳动者都必须依法参加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128965", "t": 3, "q": "保险公估人作出的公估报告具有法律强制力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险公估人作出的公估报告主要起参考作用，并不具有法律强制力。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128966", "t": 3, "q": "保险法规定，保险合同的免责条款无需向投保人说明，自动生效。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险法要求保险人对保险合同中的免责条款要向投保人进行明确说明，否则该免责条款不产生效力，并非自动生效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128967", "t": 3, "q": "人身保险合同中，受益人由被保险人或投保人指定，投保人指定受益人时无需经被保险人同意。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在人身保险合同里，投保人指定受益人时必须经被保险人同意，这是为了保障被保险人利益，防止道德风险。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128968", "t": 3, "q": "保险公估人作出的评估结论具有法律强制力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险公估人的评估结论主要是一种专业意见，不具有法律强制力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128969", "t": 3, "q": "海外投资保险的保险期限一般较短。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "海外投资保险主要是为长期海外投资提供风险保障，保险期限通常较长，一般在 15 - 20 年。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128970", "t": 3, "q": "电力企业海外投资保险主要承保商业风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电力企业海外投资保险主要承保的是政治风险，而非商业风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128971", "t": 3, "q": "保险的基本职能是分散风险和资金融通。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险基本职能是分散风险和补偿损失，资金融通是派生职能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128972", "t": 3, "q": "保险利益原则要求投保人在保险事故发生时必须对保险标的具有保险利益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128973", "t": 3, "q": "人身保险的保险利益必须在保险事故发生时存在。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人身保险的保险利益要求在保险合同订立时存在，不要求在保险事故发生时存在。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128974", "t": 3, "q": "保险利益原则仅适用于财产保险合同，不适用于人身保险合同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险利益原则既适用于财产保险合同，也适用于人身保险合同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128975", "t": 3, "q": "保险合同的成立时间与生效时间一定是一致的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同成立是双方达成合意，而生效需满足约定或法定条件，两者时间不一定相同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128976", "t": 3, "q": "人身保险中，保险金可以作为被保险人的遗产进行继承。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人身保险中，一般在没有指定受益人、受益人先于被保险人死亡且无其他受益人、受益人丧失或放弃受益权且无其他受益人等特定情形下，保险金才会作为被保险人的遗产进行继承，并非所有情况都如此。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128977", "t": 3, "q": "电力企业海外投资保险仅承保政治风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电力企业海外投资保险除了承保政治风险，还可能承保其他风险，并非仅承保政治风险。", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128978", "t": 3, "q": "保险数理基础中，损失概率是指某一风险单位在一定时期内发生损失的可能性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在保险数理基础里，损失概率就是描述某一风险单位在特定时期内发生损失的可能性大小的指标。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128979", "t": 3, "q": "电力企业海外投资保险中，征收风险是指投资所在国政府对投资项目实行国有化的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128980", "t": 3, "q": "保险理赔中，被保险人未及时报案的，保险人可以拒绝赔偿。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "被保险人未及时报案，保险人并非直接就可拒绝赔偿，需视未及时报案是否影响保险人确定事故性质、原因、损失程度等情况，若不影响则不能拒赔。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128981", "t": 3, "q": "社会保险的待遇标准由各用人单位根据自身效益确定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "社会保险待遇标准由国家法律法规统一规定，并非由各用人单位根据自身效益确定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128982", "t": 3, "q": "社会保险的保障水平高于商业保险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "商业保险保障水平可根据投保人意愿和缴费情况灵活调整，能提供较高额度保障；社会保险是基本保障，保障水平相对较低。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128983", "t": 3, "q": "海外投资保险的投保人只能是境内企业。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128984", "t": 3, "q": "商业保险的经营主体是政府，不以营利为目的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "商业保险经营主体是保险公司等商业机构，以营利为目的；而经营主体是政府、不以营利为目的的是社会保险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128985", "t": 3, "q": "保险法规定，保险人收到赔偿请求后，应当在30日内作出核定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险法规定，保险人收到被保险人或者受益人的赔偿或者给付保险金的请求后，应当及时作出核定；情形复杂的，应当在三十日内作出核定，但合同另有约定的除外。题干未提及“情形复杂”及“合同另有约定”等情况，表述不准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128986", "t": 3, "q": "损失补偿原则要求保险人赔偿金额不得超过被保险人的实际损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "损失补偿原则核心就是使被保险人在经济上恢复到受损前状态，所以赔偿金额不能超实际损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128987", "t": 3, "q": "社会保险的缴费基数由用人单位自行确定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "社会保险缴费基数一般是根据当地上一年度全口径城镇单位就业人员平均工资来确定上下限，用人单位需在规定范围内为职工申报，并非自行确定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128988", "t": 3, "q": "损失补偿原则的核心是被保险人获得的赔偿金额不超过其实际损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "损失补偿原则旨在使被保险人在遭受损失后，通过保险赔偿恢复到损失发生前的经济状态，核心就是赔偿金额不超实际损失，避免不当得利。", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128989", "t": 3, "q": "社会保险具有强制性，用人单位和劳动者必须依法参加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "社会保险是国家强制实施的社会保障制度，用人单位和劳动者都有依法参加的法定义务，这是保障劳动者权益和维护社会稳定的重要举措。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128990", "t": 3, "q": "近因原则中的\"近因\"是指导致损失发生的最后一个原因。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。近因原则中的“近因”并非指导致损失发生的最后一个原因，而是指在风险和损失之间，导致损失的最直接、最有效、起决定作用的原因。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128991", "t": 3, "q": "人身保险合同中，受益人只能是自然人。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人身保险合同中，受益人可以是自然人，也可以是法人等其他组织。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128992", "t": 3, "q": "保险的基本职能包括风险分散和资金融通。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险基本职能是风险分散与损失补偿，资金融通是保险派生职能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128993", "t": 3, "q": "保险法规定，保险人对保险合同中的免责条款未作提示或者明确说明的，该条款不产生效力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是《保险法》的明确规定，目的是保障投保人、被保险人权益，避免保险人利用免责条款逃避责任。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128994", "t": 3, "q": "保险合同的射幸性意味着投保人必然会获得保险金赔偿。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同射幸性指合同履行结果具有不确定性，投保人是否获赔取决于保险事故是否发生，并非必然获赔。", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128995", "t": 3, "q": "社会保险的缴费基数由用人单位自行确定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "社会保险缴费基数有明确规定，不能由用人单位自行确定，一般是根据职工工资等情况，在当地规定的上下限范围内确定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128996", "t": 3, "q": "健康保险的保险责任包括因意外事故导致的医疗费用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "健康保险是以被保险人的身体为保险标的，保障被保险人因疾病或意外事故所产生的医疗费用等损失。所以健康保险的保险责任包含因意外事故导致的医疗费用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128997", "t": 3, "q": "保险合同的客体是保险标的本身。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同的客体是投保人或被保险人对保险标的所具有的可保利益，而非保险标的本身。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128998", "t": 3, "q": "医疗保险属于人身保险的范畴。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "医疗保险是以人的身体为保险标的，当被保险人因疾病或意外伤害需要治疗时，由保险人按约定给付保险金，属于人身保险范畴。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649128999", "t": 3, "q": "社会保险基金实行专款专用，不得挪作他用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "社会保险基金关系到广大参保人员的切身利益和社会保障制度的稳定运行，专款专用能确保其安全和有效使用，防止被滥用。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649129000", "t": 3, "q": "投保人对保险标的不具有保险利益的，保险合同无效。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "保险利益原则是保险的基本原则之一，投保人对保险标的具有保险利益是保险合同生效的重要前提，若不具有保险利益，保险合同不具有法律效力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649129001", "t": 3, "q": "电力企业海外投资保险承保的风险主要是商业风险，如市场价格波动风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电力企业海外投资保险承保的主要是政治风险，如战争、征收、汇兑限制等，而非商业风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649129002", "t": 3, "q": "海外投资保险的承保范围不包括商业风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649129003", "t": 3, "q": "社会保险的缴费基数由用人单位自行确定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "社会保险缴费基数一般是根据当地上年度全口径城镇单位就业人员平均工资来确定上下限，职工以本人上年度月平均工资作为缴费基数，并非由用人单位自行确定。", "ap": [false, false, false, false, false, false]}, {"id": "2034818602649129004", "t": 3, "q": "保险合同的格式条款有歧义时，应作出有利于保险人的解释。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保险合同是格式合同，为保护处于相对弱势的投保人、被保险人利益，当格式条款有歧义时，应作出有利于被保险人和受益人的解释，而非保险人。 ", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = !!ans;
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
