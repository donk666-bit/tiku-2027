, false, false, false]}, {"id": "2034818464253874190", "t": 3, "q": "商业银行是唯一能够创造存款货币的金融机构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "商业银行具有信用创造功能，能通过存贷业务创造存款货币，而其他金融机构一般不具备此功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874191", "t": 3, "q": "货币政策中介目标中的\"基础货币\"可控性强，但与最终目标的相关性较弱。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874192", "t": 3, "q": "基础货币由中央银行控制，是货币供给创造的基础，其规模决定了货币供应量的最大可能规模。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "基础货币由央行掌控，它是货币创造的源头，货币供应量以基础货币为基础通过货币乘数放大，所以基础货币规模决定了货币供应量的最大可能规模。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874193", "t": 3, "q": "信用的本质是一种价值运动，无需偿还和支付利息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信用是一种以偿还和付息为条件的价值运动。偿还和支付利息是信用的基本特征，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874194", "t": 3, "q": "中央银行的\"最后贷款人\"职能仅在商业银行出现流动性危机时才会履行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“最后贷款人”职能是央行重要职责，不仅在商业银行流动性危机时履行，在金融体系面临系统性风险、市场资金紧张等多种情况下都会发挥作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874195", "t": 3, "q": "中央银行在公开市场上买入政府债券，会导致市场利率上升，货币供应量减少。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "央行在公开市场买入政府债券，会向市场投放货币，使货币供应量增加；货币增多会使市场资金更充裕，导致市场利率下降，而不是上升。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874196", "t": 3, "q": "复利计息方式下，利息的计算不仅基于本金，还包括以前年度产生的利息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "复利就是利滚利，利息计算时会把以前年度产生的利息加入本金再计算新的利息。", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874197", "t": 3, "q": "金融深化意味着金融机构数量越多，金融市场规模越大，金融发展水平就越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融深化不只是金融机构数量和市场规模的简单增加，还涉及金融效率、市场机制完善、金融服务质量等多方面。仅依据机构数量和市场规模判断金融发展水平是片面的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874198", "t": 3, "q": "风险价值（VaR）能够衡量在极端市场条件下的最大损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VaR是在正常市场条件和一定置信水平下，衡量在给定时间区间内可能遭受的最大损失，不能衡量极端市场条件下的最大损失。", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874199", "t": 3, "q": "货币市场主要解决短期资金融通问题，资本市场主要解决中长期资金融通问题，二者的界限绝对，不存在资金流动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币市场和资本市场界限并非绝对，二者存在资金流动，比如一些机构会根据市场情况在两个市场间调配资金。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874200", "t": 3, "q": "金融风险的\"不确定性\"是指金融风险发生的时间、地点、损失程度均无法提前预测。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融风险的不确定性就是指风险发生的时间、地点以及损失程度难以提前精准预知。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874201", "t": 3, "q": "消费信用是指企业或金融机构向消费者提供的用于购买消费品的信用形式。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "消费信用的定义就是企业、金融机构等向消费者提供的用于购买消费品的信用形式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874202", "t": 3, "q": "货币供求均衡是总供求均衡的前提，若货币供求失衡，总供求必然失衡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币供求均衡对总供求均衡很关键，货币供求失衡会通过影响消费、投资等经济活动，进而破坏总供求的平衡。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874203", "t": 3, "q": "金融监管的\"骆驼评级体系（CAMELS）\"中，\"C\"代表的是\"资本充足率\"，是核心评价指标之一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在骆驼评级体系（CAMELS）里，“C”的确代表资本充足率，它是核心评价指标之一。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874204", "t": 3, "q": "金融机构的流动性风险是指无法以合理成本及时获得充足资金，以应对资产增长或到期债务支付的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该表述符合流动性风险的定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874205", "t": 3, "q": "货币政策的最终目标中，物价稳定与充分就业之间存在\"菲利普斯曲线\"描述的替代关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "菲利普斯曲线表明失业率与通货膨胀率之间存在反向变动关系，物价稳定与充分就业分别对应低通胀和低失业，二者存在替代关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874206", "t": 3, "q": "货币需求与收入水平呈正相关关系，收入越高，货币需求越多。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一般来说，收入水平提高，人们的消费、投资等经济活动规模会扩大，对交易媒介和价值储存手段的货币需求也会随之增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874207", "t": 3, "q": "利率市场化是指利率水平完全由市场供求关系决定，政府不再进行任何干预。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。利率市场化是让市场在利率形成中起决定性作用，但并不意味着政府完全不干预。政府可通过货币政策等手段对利率进行宏观调控，以维持金融稳定和经济健康发展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874208", "t": 3, "q": "货币均衡的核心是货币供给与货币需求在数量上完全相等，二者无任何偏离。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币均衡并非要求货币供给与货币需求在数量上完全相等、无任何偏离，而是指货币供给与货币需求大体相适应。现实中很难实现绝对相等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874209", "t": 3, "q": "中央银行提高再贴现率，会导致商业银行的融资成本上升，从而收缩信贷规模。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "再贴现率是央行向商业银行提供资金时的利率，提高再贴现率，商业银行从央行融资成本增加，为控制成本会减少从央行融资，进而收缩信贷规模。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874210", "t": 3, "q": "货币政策的传导机制是指中央银行运用政策工具影响中介目标，进而实现最终目标的过程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币政策传导机制的定义就是央行运用政策工具影响中介目标，最终达成最终目标。所以该表述符合定义。", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874211", "t": 3, "q": "金融监管的目的是限制金融创新，防止金融机构过度竞争。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融监管目的是维护金融体系稳定、保护投资者利益、促进金融市场公平有效运行等，并非限制金融创新和防止过度竞争，合理的金融创新和竞争能提升金融市场活力和效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874212", "t": 3, "q": "金融创新必然推动金融发展，不会对金融稳定产生负面影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融创新是把双刃剑，虽然能推动金融发展，但也可能带来新的风险，对金融稳定产生负面影响，比如复杂金融衍生品可能引发系统性风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874213", "t": 3, "q": "移动支付通过将金融与移动通信技术结合，实现了资金实时划转，是金融科技的典型应用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "移动支付借助金融与移动通信技术融合达成资金实时划转，这体现了金融与科技的结合，属于金融科技典型应用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874214", "t": 3, "q": "货币的支付手段职能是指货币作为商品交换的媒介，如用现金购买商品。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币作为商品交换媒介是流通手段职能，而支付手段是用于清偿债务、支付赋税、租金、工资等，题干表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874215", "t": 3, "q": "货币政策传导渠道仅包括利率渠道，其他渠道（如信贷渠道、资产价格渠道）不具有实际作用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币政策传导渠道有多种，利率渠道只是其中之一，信贷渠道、资产价格渠道等也都在货币政策传导中发挥着重要实际作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874216", "t": 3, "q": "名义利率一定高于实际利率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "当通货膨胀率为负（即通货紧缩）时，实际利率会高于名义利率，所以名义利率不一定高于实际利率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874217", "t": 3, "q": "中央银行是发行的银行，拥有唯一的货币发行权。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "中央银行的职能之一就是作为发行的银行，在一个国家中，中央银行通常被赋予唯一的货币发行权，以此来保证货币发行的集中统一和货币流通的稳定。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874218", "t": 3, "q": "中央银行的\"最后贷款人\"职能是指在商业银行面临流动性危机时提供资金支持。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当商业银行面临流动性危机时，中央银行作为最后贷款人，会通过再贴现、再贷款等方式为其提供资金支持，以维护金融稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874219", "t": 3, "q": "中央银行提高再贴现率，会导致商业银行融资成本上升，进而收缩信贷规模。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "再贴现率是央行对商业银行的放款利率，提高再贴现率，商业银行从央行融资成本增加，为控制成本会减少从央行借款，资金减少后就会收缩信贷规模。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818464253874220", "t": 3, "q": "区块链技术的\"不可篡改\"特征，是指区块链上的数据一旦记录，就无法修改或删除，确保了数据的真实性和安全性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "区块链通过哈希算法和分布式账本等技术，使得数据一旦记录就难以被篡改或删除，保障了数据真实安全。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 金融学（2）", "n": "基础练习题【含解析】 / 第2章 金融学（2）", "qs": [{"id": "2034818471606489088", "t": 1, "q": "在货币供求均衡分析中，若货币供给不变，人们对货币的交易需求和预防需求增加，而投机需求不变，则均衡利率水平会", "a": ["上升", "下降", "保持不变", "无法确定", "", ""], "r": "A", "e": "交易和预防需求增加，货币总需求上升，而货币供给不变，货币供不应求，利率作为货币的价格会上升。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489089", "t": 1, "q": "某债券票面利率为5%，当年通货膨胀率为3%，则该债券的实际利率最接近？", "a": ["1.94%", "2%", "8%", "1.5%", "", ""], "r": "A", "e": "根据费雪方程式，实际利率=（1 + 名义利率）÷（1 + 通货膨胀率）- 1 。本题中名义利率即票面利率5%，通货膨胀率3%，代入公式可得实际利率约为1.94%。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489090", "t": 1, "q": "凯恩斯的货币需求理论认为，人们持有货币的动机不包括？", "a": ["交易动机", "预防动机", "投机动机", "储蓄动机", "", ""], "r": "D", "e": "凯恩斯认为人们持有货币动机有交易、预防和投机动机，不包含储蓄动机。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489091", "t": 1, "q": "中央银行在公开市场上卖出政府债券，其主要目的是？", "a": ["增加货币供给，刺激经济增长", "减少货币供给，抑制通货膨胀", "调节利率水平，降低融资成本", "弥补财政赤字，增加财政收入", "", ""], "r": "B", "e": "央行卖出政府债券，会回笼市场上的资金，使市场上货币供给减少，从而抑制通货膨胀。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489092", "t": 1, "q": "下列不属于中央银行\"银行的银行\"职能的是？", "a": ["集中存款准备金", "发行货币", "充当最后贷款人", "组织全国清算", "", ""], "r": "B", "e": "“银行的银行”职能体现为央行与商业银行等金融机构的业务往来。集中存款准备金、充当最后贷款人、组织全国清算都是央行对银行的业务。而发行货币是央行“发行的银行”职能。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489093", "t": 1, "q": "我国货币供应量层次中，M1的构成是（　）", "a": ["流通中的现金+单位活期存款", "流通中的现金+单位定期存款", "流通中的现金+居民储蓄存款", "单位活期存款+单位定期存款", "", ""], "r": "A", "e": "M1是狭义货币供应量，其构成为流通中的现金加上单位活期存款。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489094", "t": 1, "q": "使用VAR模型度量金融风险时，其核心是估计在一定置信水平下的？", "a": ["最大损失", "平均损失", "预期收益", "风险敞口", "", ""], "r": "A", "e": "VAR（Value at Risk）即风险价值，指在一定的置信水平下，某一金融资产或证券组合在未来特定的一段时间内的最大可能损失。所以VAR模型核心是估计一定置信水平下的最大损失。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489095", "t": 1, "q": "下列金融市场中，属于资本市场的是？", "a": ["国库券市场", "同业拆借市场", "股票市场", "票据市场", "", ""], "r": "C", "e": "资本市场是长期资金市场，交易期限长、流动性相对低。股票市场主要进行股票发行和交易，是典型长期投资市场，属资本市场。而国库券市场、同业拆借市场、票据市场期限短、流动性高，属货币市场。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489096", "t": 1, "q": "下列关于金融科技在支付领域应用的说法，正确的是", "a": ["移动支付依赖传统银行账户，无法实现匿名支付", "区块链支付无需第三方机构参与，可直接完成点对点交易", "生物识别支付的安全性完全依赖于技术本身，与用户操作无关", "数字货币支付与电子支付的本质相同，均属于法定货币支付", "", ""], "r": "B", "e": "A选项移动支付有匿名支付方式；C选项生物识别支付安全性与用户操作有关，如保管好个人生物信息；D选项数字货币是法定货币，电子支付只是支付方式，本质不同。而区块链支付利用分布式账本等技术可直接点对点交易，无需第三方机构参与。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489097", "t": 1, "q": "在货币供给的决定因素中，商业银行的\"超额存款准备金率\"变动会直接影响？", "a": ["基础货币总量", "货币乘数大小", "流通中的现金数量", "法定存款准备金率", "", ""], "r": "B", "e": "超额存款准备金率是影响货币乘数的重要因素，它变动会直接改变货币乘数大小。基础货币由央行控制，超额存款准备金率不直接影响基础货币总量；其变动与流通中现金数量无直接关联；法定存款准备金率由央行规定，不受商业银行超额存款准备金率影响。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489098", "t": 1, "q": "我国当前的金融监管体制属于（　）", "a": ["统一监管体制", "分业监管体制", "混合监管体制", "完全市场化监管体制", "", ""], "r": "B", "e": "我国目前是一行两会分领域监管金融行业，属于分业监管体制。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489099", "t": 1, "q": "根据《商业银行资本管理办法》，商业银行的核心一级资本不包括", "a": ["实收资本", "资本公积", "超额贷款损失准备", "盈余公积", "", ""], "r": "C", "e": "核心一级资本包括实收资本、资本公积、盈余公积等，超额贷款损失准备属于二级资本，并非核心一级资本。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489100", "t": 1, "q": "金融监管的\"依法监管原则\"要求监管机构？", "a": ["根据市场变化随时调整监管规则，无需法律依据", "严格依据法律法规开展监管，确保监管行为合法合规", "仅对金融机构的违法行为进行处罚，不干预正常经营", "在监管中优先考虑金融机构利益，保障其盈利水平", "", ""], "r": "B", "e": "依法监管原则强调监管机构要依据法律法规来开展监管工作，以保证监管行为合法合规。A选项不依法律随时调整规则错误；C选项仅处罚违法不干预正常经营并非依法监管核心；D选项优先考虑金融机构利益违背监管公正原则。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489101", "t": 1, "q": "下列关于金融监管\"双峰模式\"的说法，正确的是", "a": ["由一个监管机构负责所有金融业务监管", "分别由两个机构负责审慎监管和行为监管", "主要关注金融机构的市场准入监管", "起源于美国的金融监管体系", "", ""], "r": "B", "e": "“双峰模式”核心特点是设置两个监管机构，一个负责审慎监管，另一个负责行为监管。A选项是单一监管模式；C选项“双峰模式”不止关注市场准入；D选项起源于澳大利亚。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489102", "t": 1, "q": "下列金融机构中，不属于存款类金融机构的是？", "a": ["村镇银行", "农村信用合作社", "证券公司", "城市商业银行", "", ""], "r": "C", "e": "存款类金融机构主要是吸收公众存款的金融机构。村镇银行、农村信用合作社、城市商业银行都可吸收存款。而证券公司主要从事证券经纪、承销等业务，并非存款类金融机构。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489103", "t": 1, "q": "在金融风险预警指标体系中，下列指标中可用于预警商业银行流动性风险的是？", "a": ["不良贷款率", "资本充足率", "存贷比", "拨备覆盖率", "", ""], "r": "C", "e": "存贷比反映银行贷款占存款的比例，能体现银行资金流动性情况，可预警流动性风险。不良贷款率反映资产质量，资本充足率衡量资本稳健性，拨备覆盖率是衡量银行风险抵补能力，均与流动性风险关联不大。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489104", "t": 1, "q": "下列属于中央银行\"最后贷款人\"职能具体体现的是？", "a": ["制定和执行货币政策", "为陷入流动性危机的商业银行提供紧急融资", "负责金融统计与分析", "监督管理金融机构合规经营", "", ""], "r": "B", "e": "“最后贷款人”指央行在商业银行资金周转困难时提供紧急资金支持。A是央行宏观调控职能；C是统计分析工作；D是监管职能。B符合“最后贷款人”体现。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489105", "t": 1, "q": "下列信用工具中，属于\"远期票据\"的是（　）", "a": ["支票", "本票", "汇票", "银行卡", "", ""], "r": "C", "e": "远期票据是付款人见票后在一定期限或特定日期付款的票据。汇票是由出票人签发，委托付款人在见票时或者在指定日期无条件支付确定的金额给收款人或者持票人的票据，有远期汇票。支票是见票即付，本票一般也是见票即付，银行卡不是票据。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489106", "t": 1, "q": "下列属于货币政策\"中介目标\"的是（　）", "a": ["稳定物价", "充分就业", "货币供应量", "经济增长", "", ""], "r": "C", "e": "货币政策中介目标是连接货币政策工具与最终目标的桥梁。稳定物价、充分就业、经济增长是货币政策最终目标。货币供应量可被央行调控，能反映货币政策实施效果，是中介目标。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489107", "t": 1, "q": "金融发展理论中，金融抑制的主要表现不包括？", "a": ["利率管制", "汇率高估", "金融市场开放", "信贷配给", "", ""], "r": "C", "e": "金融抑制是指政府对金融活动和金融体系过多干预，限制金融市场发展。利率管制、汇率高估、信贷配给都是常见的金融抑制手段，而金融市场开放是促进金融市场发展的举措，不属于金融抑制表现。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489108", "t": 1, "q": "中央银行在实施紧缩性货币政策时，若采用再贴现政策，通常会", "a": ["降低再贴现率", "提高再贴现率", "扩大再贴现范围", "放松再贴现资格要求", "", ""], "r": "B", "e": "紧缩性货币政策是为减少货币供给。提高再贴现率会使商业银行向央行贴现成本上升，减少贴现，进而减少货币供给。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489109", "t": 1, "q": "下列关于信用评级的说法，错误的是", "a": ["信用评级主要评估债务人的偿债能力和意愿", "投资级评级的债券违约风险低于投机级评级", "信用评级结果由评级机构永久有效", "信用评级可帮助投资者做出决策", "", ""], "r": "C", "e": "信用评级结果并非永久有效，会随被评级对象的经营、财务等状况变化而调整。A选项，偿债能力和意愿是信用评级核心考量；B选项，投资级债券质量高、违约风险低；D选项，信用评级能为投资者提供参考辅助决策。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489110", "t": 1, "q": "货币供给层次中，M1与M2的差额是？", "a": ["流通中现金", "活期存款", "定期存款+储蓄存款+其他存款", "狭义货币", "", ""], "r": "C", "e": "M1是狭义货币，包括流通中现金和活期存款，M2是广义货币，等于M1加上定期存款、储蓄存款和其他存款，所以M1与M2差额就是定期存款+储蓄存款+其他存款。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489111", "t": 1, "q": "下列关于实际利率与名义利率的关系表述正确的是（　）", "a": ["实际利率=名义利率+通货膨胀率", "名义利率=实际利率-通货膨胀率", "实际利率=名义利率-通货膨胀率", "实际利率与名义利率无关", "", ""], "r": "C", "e": "名义利率是未剔除通货膨胀影响的利率，实际利率是剔除了通货膨胀影响后的利率，二者关系为实际利率=名义利率-通货膨胀率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489112", "t": 1, "q": "中央银行在公开市场上买入政府债券，对货币供给的影响是", "a": ["货币供给减少", "货币供给增加", "货币供给不变", "货币供给先减少后增加", "", ""], "r": "B", "e": "央行在公开市场买入政府债券，会向市场投放货币，所以货币供给增加。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489113", "t": 1, "q": "金融科技监管的核心要求不包括（　）", "a": ["鼓励创新", "防范风险", "垄断经营", "保护消费者权益", "", ""], "r": "C", "e": "金融科技监管目的是营造良好金融环境，鼓励创新能推动行业发展，防范风险保障金融稳定，保护消费者权益维护市场公平，而垄断经营不利于市场竞争和健康发展，不是监管核心要求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489114", "t": 1, "q": "假设某年度名义利率为8%，通货膨胀率为3%，则根据费雪效应，该年度实际利率约为（　）", "a": ["3%", "4.85%", "5%", "11%", "", ""], "r": "B", "e": "答案：B分析：费雪效应是指名义利率与实际利率之间的关系，具体来说，实际利率等于名义利率减去通货膨胀率。公式如下：实际利率 ≈ 名义利率 - 通货膨胀率根据题目提供的数据：名义利率 = 8%通货膨胀率 = 3%将这些数值代入公式：实际利率 ≈ 8% - 3% = 5%但是，由于费雪效应公式中实际利率的计算通常会考虑复利的影响，因此需要用更精确的公式来计算：实际利率 ≈ (1 + 名义利率) / (1 + 通货膨胀率) - 1代入数据：实际利率 ≈ (1 + 0.08) / (1 + 0.03) - 1 ≈ 1.08 / 1.03 - 1 ≈ 1.0485 - 1 ≈ 0.0485，即4.85%因此，正确答案是B. 4.85%。", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489115", "t": 1, "q": "下列哪种风险属于金融机构的系统性风险（　）", "a": ["某银行单笔贷款违约风险", "局部地区企业破产引发的风险", "宏观经济衰退导致的全行业风险", "某证券公司操作失误引发的风险", "", ""], "r": "C", "e": "系统性风险是影响整个金融市场或行业的风险。A选项是单笔贷款违约，D选项是证券公司操作失误，都只是个别机构的个别情况；B选项局部地区企业破产影响范围有限。而C选项宏观经济衰退会导致全行业风险，影响整个金融系统，属于系统性风险。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489116", "t": 1, "q": "金融市场按交易期限划分，可分为货币市场和资本市场，下列属于资本市场的是（　）", "a": ["同业拆借市场", "票据贴现市场", "债券市场", "短期国库券市场", "", ""], "r": "C", "e": "资本市场是长期资金市场，期限在一年以上。ABD选项的同业拆借市场、票据贴现市场、短期国库券市场期限一般都在一年以内，属于货币市场。债券市场有长期债券，是资本市场。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489117", "t": 1, "q": "《巴塞尔协议III》中，为增强银行体系稳定性，提出的核心监管指标不包括（　）", "a": ["普通股一级资本充足率", "一级资本充足率", "风险加权资产收益率", "总资本充足率", "", ""], "r": "C", "e": "《巴塞尔协议III》核心监管指标有普通股一级资本充足率、一级资本充足率、总资本充足率，风险加权资产收益率不是其核心监管指标。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489118", "t": 1, "q": "下列不属于货币制度构成要素的是？", "a": ["货币材料的确定", "货币单位的规定", "货币流通速度的测算", "本位币与辅币的铸造、发行与流通程序", "", ""], "r": "C", "e": "货币制度构成要素包括货币材料、货币单位、本位币与辅币的铸造发行流通等。而货币流通速度测算并非货币制度构成要素。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489119", "t": 1, "q": "信用活动中，借贷双方所形成的债权债务关系的核心是？", "a": ["商品交换", "价值单方面转移", "货币流通", "等价交换", "", ""], "r": "B", "e": "信用活动中，贷方将资金贷出，借方获得资金，是价值单方面转移，形成债权债务关系。商品交换、货币流通并非核心，等价交换也不符。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489120", "t": 1, "q": "下列关于商业信用与银行信用关系的说法中，错误的是", "a": ["商业信用是银行信用产生的基础", "银行信用可以克服商业信用规模有限的缺陷", "银行信用与商业信用在一定条件下可以相互转化", "商业信用的期限通常长于银行信用的期限", "", ""], "r": "D", "e": "商业信用期限一般较短，银行信用可根据不同需求提供长短不同期限贷款，通常商业信用期限短于银行信用期限。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471606489121", "t": 1, "q": "以下不属于我国政策性金融机构的是（　）", "a": ["国家开发银行", "中国进出口银行", "中国农业发展银行", "中国工商银行", "", ""], "r": "D", "e": "政策性金融机构是由政府创立、参股或保证，专门为贯彻、配合政府社会经济政策或意图而开展活动的金融机构。国家开发银行、中国进出口银行、中国农业发展银行是我国三大政策性银行。而中国工商银行是大型国有商业银行。答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818471610683392", "t": 1, "q": "金融监管中的\"骆驼评级体系\"主要评价金融机构的五个方面，不包括？", "a": ["资本充足性", "资产质量", "盈利能力", "市场占有率", "", ""], "r": "D", "e": "“骆驼评级体系”评价金融机构的五个方面为资本充足性、资产质量、管理水平、盈利水平和流动性，不涉及市场占有率。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473074495488", "t": 2, "q": "下列属于信用风险的防控措施有？", "a": ["建立信用评级体系", "加强贷后管理", "分散授信", "提高利率水平", "", ""], "r": "ABC", "e": "建立信用评级体系可评估信用风险、加强贷后管理能及时发现潜在风险、分散授信可降低集中风险，这些都有助于防控信用风险。提高利率水平主要影响收益和资金供求等，并非信用风险防控核心措施。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818473074495489", "t": 2, "q": "中央银行的\"发行的银行\"职能体现在？", "a": ["垄断货币发行权", "制定货币发行制度", "调节货币供应量", "代理国库", "", ""], "r": "ABC", "e": "“发行的银行”核心是央行对货币发行的掌控。A选项垄断货币发行权是央行作为“发行的银行”最根本体现；B制定制度也是为保障垄断发行；C调节供应量是基于发行权来实现；而D代理国库是“政府的银行”职能。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473074495490", "t": 2, "q": "影响利率水平的因素有（　）", "a": ["平均利润率", "借贷资金供求状况", "通货膨胀预期", "中央银行货币政策", "", ""], "r": "ABCD", "e": "平均利润率是利率的上限；借贷资金供求影响利率高低；通货膨胀预期使利率相应调整；中央银行货币政策通过调控货币量等影响利率。ABCD选项均会影响利率水平。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689792", "t": 2, "q": "金融科技在银行业的应用场景包括", "a": ["智能投顾", "数字信贷", "移动支付", "区块链跨境结算", "", ""], "r": "ABCD", "e": "金融科技是技术驱动的金融创新，ABCD选项均是其在银行业的典型应用场景。智能投顾借助算法提供投资建议；数字信贷利用大数据等进行信贷业务；移动支付方便客户交易；区块链跨境结算提升跨境支付效率和安全性。答案为ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689793", "t": 2, "q": "金融风险预警的核心指标包括（　）", "a": ["银行不良贷款率（越高风险越大）", "流动性覆盖率（LCR，越低流动性风险越大）", "资本充足率（越低抗风险能力越弱）", "股价指数（越高风险越大）", "", ""], "r": "ABC", "e": "银行不良贷款率高、流动性覆盖率低、资本充足率低都意味着金融风险大，而股价指数高并不直接等同于风险大。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689794", "t": 2, "q": "下列属于国家信用的作用的有？", "a": ["弥补财政赤字", "调节经济运行", "筹集建设资金", "提供消费信贷", "", ""], "r": "ABC", "e": "国家信用是以国家为主体进行的信用活动。弥补财政赤字、调节经济运行、筹集建设资金都是国家信用常见作用。而提供消费信贷一般是金融机构面向个人消费者的业务，并非国家信用作用。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689795", "t": 2, "q": "商业信用的局限性主要体现在（　）", "a": ["规模受企业自身资本限制", "期限受商品流转周期限制", "范围局限于有业务往来的企业", "可提供的信用形式仅为货币", "", ""], "r": "ABC", "e": "商业信用是企业间以商品形式提供的信用。其规模取决于企业自身资本量，流转周期决定了信用期限，且一般在有业务往来企业间开展。商业信用形式多样，不只是货币。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689796", "t": 2, "q": "下列属于金融监管基本原则的有？", "a": ["依法监管原则", "审慎监管原则", "公开、公平、公正原则", "效率原则", "完全自由放任原则", ""], "r": "ABCD", "e": "金融监管需在一定规则下进行，E选项完全自由放任原则与监管相悖。A依法监管保证监管有法可依；B审慎监管利于防控风险；C公开、公平、公正原则保障市场秩序；D效率原则可提升监管效果。所以答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689797", "t": 2, "q": "下列属于货币制度类型的有？", "a": ["银本位制", "金银复本位制", "金本位制", "纸币本位制", "信用本位制", ""], "r": "ABCDE", "e": "这些选项都是不同历史时期出现过的货币制度类型。银本位制以白银作为本位货币；金银复本位制同时以金银作为本位币；金本位制以黄金为本位货币；纸币本位制是以纸币作为本位币；信用本位制主要依靠国家信用发行货币。答案全选。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689798", "t": 2, "q": "下列属于我国利率体系构成部分的有（　）", "a": ["央行政策利率（如MLF利率）", "市场利率（如同业拆借利率）", "官定利率（如存款基准利率）", "国际市场利率（如LIBOR）", "", ""], "r": "ABC", "e": "我国利率体系包括央行政策利率、市场利率、官定利率等。A选项MLF利率是央行政策利率；B选项同业拆借利率是市场利率；C选项存款基准利率属于官定利率。而D选项LIBOR是伦敦银行间同业拆借利率，是国际市场利率，不属于我国利率体系构成部分。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689799", "t": 2, "q": "下列利率中，属于基准利率的有？", "a": ["中国人民银行基准利率", "伦敦银行间同业拆借利率", "企业债券利率", "商业银行存款利率", "", ""], "r": "AB", "e": "基准利率是金融市场上具有普遍参照作用的利率。中国人民银行基准利率是我国金融市场的核心参考利率；伦敦银行间同业拆借利率是国际金融市场重要基准利率。企业债券利率由企业自身信用等多种因素决定；商业银行存款利率受基准利率等影响。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689800", "t": 2, "q": "金融发展对经济增长的促进作用体现在？", "a": ["优化资源配置", "促进技术创新", "动员社会储蓄", "加剧经济波动", "", ""], "r": "ABC", "e": "金融发展能将资金导向更有效率的领域，实现优化资源配置；为技术创新提供资金支持，促进技术创新；吸引社会资金形成储蓄并转化为投资。而加剧经济波动是金融发展可能带来的负面效应，并非促进作用。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689801", "t": 2, "q": "商业银行的资本包括", "a": ["核心一级资本", "其他一级资本", "二级资本", "三级资本", "", ""], "r": "ABC", "e": "商业银行资本包括核心一级资本、其他一级资本和二级资本。不存在三级资本的说法。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689802", "t": 2, "q": "影响货币乘数的因素包括", "a": ["法定存款准备金率", "超额存款准备金率", "现金漏损率", "定期存款与活期存款比率", "", ""], "r": "ABCD", "e": "货币乘数受多个因素影响，法定存款准备金率、超额存款准备金率、现金漏损率、定期存款与活期存款比率都会改变货币创造过程中的资金留存或流通情况，进而影响货币乘数。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689803", "t": 2, "q": "资本市场的主要金融工具包括（　）", "a": ["股票", "中长期国债（期限10年）", "短期商业票据（期限6个月）", "企业债券（期限5年）", "", ""], "r": "ABD", "e": "资本市场是长期资金市场，交易期限通常在一年以上。选项A股票无到期期限，可长期持有；选项B中长期国债期限10年、选项D企业债券期限5年，均属一年以上长期金融工具。而选项C短期商业票据期限6个月，是货币市场金融工具。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689804", "t": 2, "q": "影响货币需求的主要因素有？", "a": ["国民收入水平", "利率水平", "物价水平", "货币流通速度", "金融资产收益率", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689805", "t": 2, "q": "下列关于金融市场功能的表述中，正确的有？", "a": ["资金融通功能是金融市场的核心功能", "价格发现功能通过市场交易形成资产合理价格", "风险管理功能通过金融工具帮助参与者转移和分散风险", "流动性功能为金融资产提供便捷的变现渠道", "信息传递功能通过市场价格变动反映经济运行状况", ""], "r": "ABCDE", "e": "各选项表述均符合金融市场对应功能的特点。资金融通是核心，价格发现能形成合理价格，风险管理可转移分散风险，流动性提供变现渠道，信息传递通过价格反映经济。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689806", "t": 2, "q": "非银行金融机构包括（　）", "a": ["证券公司", "保险公司", "信托公司", "国有商业银行", "", ""], "r": "ABC", "e": "国有商业银行属于银行金融机构，而证券公司、保险公司、信托公司是非银行金融机构。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689807", "t": 2, "q": "区块链技术的主要特征包括", "a": ["去中心化", "不可篡改", "透明性", "匿名性", "", ""], "r": "ABCD", "e": "区块链通过分布式节点记账，不依赖单一中心机构，具有去中心化特点；其数据一旦记录就难以更改，保证不可篡改；所有交易信息对参与节点公开透明；用户身份信息加密，有匿名性。ABCD四个选项均是区块链技术主要特征。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689808", "t": 2, "q": "金融风险的度量方法包括（　）", "a": ["方差法", "VaR法", "压力测试", "情景分析", "", ""], "r": "ABCD", "e": "方差法可衡量风险波动，VaR法衡量潜在损失，压力测试和情景分析评估极端情况风险，它们都是常见金融风险度量方法。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689809", "t": 2, "q": "中央银行的中间目标包括", "a": ["货币供应量", "利率", "基础货币", "汇率", "", ""], "r": "ABCD", "e": "中央银行中间目标要具有可测性、可控性和相关性等特点。货币供应量、利率、基础货币、汇率都可作为中间目标。ABCD选项均符合。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689810", "t": 2, "q": "商业票据的特点包括", "a": ["期限短", "流动性强", "风险低", "无担保", "", ""], "r": "ABCD", "e": "商业票据是短期无担保的信用凭证，期限短、流动性强、风险较低。ABCD选项均符合商业票据特点。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689811", "t": 2, "q": "下列属于货币政策中介目标选择标准的有？", "a": ["可测性，即指标能被准确测量", "可控性，即央行能有效调节该指标", "相关性，即与最终目标密切相关", "稳定性，即指标数值长期保持不变", "独立性，即与其他经济指标无关联", ""], "r": "ABC", "e": "货币政策中介目标的选择标准有可测性、可控性和相关性。可测性便于准确获取数据，可控性能让央行有效操作调节，相关性确保与最终目标关联去实现调控目的。指标数值不会长期不变，也不能与其他经济指标无关联。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689812", "t": 2, "q": "以下属于金融市场的基本功能的有（　）", "a": ["资金融通功能", "风险管理功能", "价格发现功能", "宏观调控功能", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689813", "t": 2, "q": "下列货币政策工具中，属于直接信用控制的有？", "a": ["信用配额", "利率限制", "道义劝告", "窗口指导", "", ""], "r": "AB", "e": "直接信用控制是指中央银行以行政命令或其他方式，直接对金融机构尤其是商业银行的信用活动进行控制，信用配额和利率限制属于直接信用控制手段；道义劝告和窗口指导属于间接信用指导。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689814", "t": 2, "q": "中央银行作为\"政府的银行\"的职能包括", "a": ["代理国库", "制定和执行货币政策", "向政府提供贷款", "保管外汇储备", "", ""], "r": "ACD", "e": "答案：ACD中央银行作为“政府的银行”，其职能主要包括代理国库、向政府提供贷款以及保管外汇储备等。这些职能体现了中央银行在金融体系中的特殊地位，以及它在宏观经济调控和金融稳定方面的重要作用。而制定和执行货币政策虽然是中央银行的重要职能，但这一职能更多体现的是中央银行作为“银行的银行”的角色，而非特指其作为“政府的银行”的职能，因此B选项不符合题意。", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689815", "t": 2, "q": "下列关于信用在经济中的作用的表述中，正确的有？", "a": ["信用促进资金融通，提高资金使用效率", "信用加速商品流通，降低交易成本", "信用可能引发信用风险，加剧经济波动", "信用完全消除了经济活动中的风险", "信用仅对经济增长有促进作用，无负面影响", ""], "r": "ABC", "e": "信用能促进资金融通、提高资金使用效率，加速商品流通、降低交易成本，但也会引发信用风险、加剧经济波动，经济活动风险无法靠信用完全消除，信用有负面影响并非只有促进作用。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689816", "t": 2, "q": "金融风险按风险来源可分为？", "a": ["信用风险", "市场风险", "操作风险", "流动性风险", "系统性风险", ""], "r": "ABCD", "e": "金融风险按风险来源分为信用风险、市场风险、操作风险、流动性风险等，系统性风险是按影响范围等划分的。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689817", "t": 2, "q": "下列可能导致流动性风险的因素有？", "a": ["商业银行资产负债期限结构不匹配", "市场恐慌导致存款人集中取款", "商业银行不良贷款率大幅上升", "金融市场波动导致资产变现困难", "中央银行提高法定存款准备金率", ""], "r": "ABDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689818", "t": 2, "q": "金融监管的主要目标有？", "a": ["维护金融体系稳定", "保护投资者利益", "促进金融机构盈利", "提高金融市场效率", "", ""], "r": "ABD", "e": "金融监管核心是保障金融体系安全稳定、保护投资者，以及提升金融市场效率。而促进金融机构盈利并非监管主要目标。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689819", "t": 2, "q": "下列关于货币政策传导机制的表述中，正确的有？", "a": ["央行调整政策工具→影响操作目标→影响中介目标→实现最终目标", "利率传导机制中，利率变动会影响投资和消费，进而影响总需求", "汇率传导机制中，货币供给变动会影响汇率，进而影响进出口", "货币政策传导机制不受金融市场发育程度的影响", "所有货币政策工具的传导路径完全相同", ""], "r": "ABC", "e": "货币政策传导是央行调整工具，经操作目标、中介目标实现最终目标；利率变动会影响投资消费和总需求；货币供给变动会影响汇率和进出口。金融市场发育程度会影响传导机制，不同货币政策工具传导路径不同。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689820", "t": 2, "q": "下列属于\"直接信用\"形式的有（　）", "a": ["企业发行股票", "企业发行债券", "银行发放贷款", "政府发行国债", "", ""], "r": "ABD", "e": "直接信用是资金供求双方直接进行资金融通，不通过金融中介。企业发行股票、债券，政府发行国债都是资金供求双方直接交易。银行发放贷款是通过银行这一金融中介，属于间接信用。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689821", "t": 2, "q": "下列属于金融市场的基本要素的有？", "a": ["交易主体", "交易工具", "交易价格", "交易场所", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689822", "t": 2, "q": "下列属于存款性金融机构的有", "a": ["商业银行", "信用合作社", "保险公司", "村镇银行", "", ""], "r": "ABD", "e": "存款性金融机构是能吸收存款并发放贷款的金融机构。商业银行、信用合作社、村镇银行都可吸收公众存款并开展贷款等业务。而保险公司主要经营保险业务，并非存款性金融机构。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818473078689823", "t": 2, "q": "信用的基本特征包括？", "a": ["偿还性", "付息性", "单方面转移", "等价交换", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123392", "t": 3, "q": "实际利率是指剔除通货膨胀因素后的利率，实际利率=名义利率-通货膨胀率是近似计算公式。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "实际利率是剔除通胀因素后的利率，“实际利率 = 名义利率 - 通货膨胀率”是在通胀率较低时的近似计算公式。", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123393", "t": 3, "q": "弗里德曼的货币需求理论认为，货币需求函数是稳定的，货币政策应实行\"单一规则\"（如固定货币增长率）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "弗里德曼强调货币需求函数具有稳定性，受多种因素影响但变动不大。基于此，他反对相机抉择的货币政策，主张实行“单一规则”，即按固定比率增加货币供给。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123394", "t": 3, "q": "操作风险的损失完全由人为操作失误导致，与技术系统无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "操作风险的损失原因多样，既有人为操作失误因素，也可能与技术系统故障、外部事件等有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123395", "t": 3, "q": "金融科技监管的\"监管沙盒\"模式允许创新业务在可控范围内试点，平衡创新与风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“监管沙盒”就是为金融科技创新提供一个安全的测试环境，让创新业务在特定范围和条件下开展试点，能在推动创新的同时有效控制风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123396", "t": 3, "q": "货币供给的内生性是指货币供给由中央银行完全控制，不受经济体系内其他因素影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。货币供给的内生性指货币供给并非由央行完全控制，而是受经济体系内诸多因素如公众持币意愿、商业银行放贷行为等影响。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123397", "t": 3, "q": "金融发展与经济增长之间存在单向的促进关系，即金融发展必然推动经济增长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。金融发展与经济增长并非单向促进关系，金融发展不一定必然推动经济增长。若金融发展过度、结构不合理等，可能引发金融风险甚至危机，阻碍经济增长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123398", "t": 3, "q": "金融监管应坚持\"监管沙盒\"模式，在鼓励创新的同时防范风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“监管沙盒”能为金融创新提供安全空间，在推动创新发展的同时有效防范风险，是一种被认可的监管模式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123399", "t": 3, "q": "操作风险仅由金融机构内部人员失误导致，与外部因素无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。操作风险是指由不完善或有问题的内部程序、员工和信息科技系统，以及外部事件所造成损失的风险。所以操作风险不只是由金融机构内部人员失误导致，还与外部因素有关，比如外部欺诈等外部事件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123400", "t": 3, "q": "政策性银行的资金来源主要是吸收公众活期存款，用于支持特定领域发展。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "政策性银行资金主要通过发行金融债券、向央行借款等渠道筹集，并非吸收公众活期存款。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123401", "t": 3, "q": "中央银行作为\"政府的银行\"，其核心职责是为政府提供信贷支持，弥补财政赤字。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。中央银行作为“政府的银行”，核心职责是代理国库、制定和执行货币政策等。为政府提供信贷支持弥补财政赤字可能引发通货膨胀等问题，不是核心职责。答案为错。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123402", "t": 3, "q": "货币供给是中央银行完全可以自主控制的外生变量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币供给并非完全由央行自主控制，除央行政策外，还受商业银行的存款创造、公众持币意愿等多种因素影响，所以它不是纯粹外生变量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123403", "t": 3, "q": "分业监管体制适用于金融混业经营模式，统一监管体制适用于金融分业经营模式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。通常分业监管体制适用于金融分业经营模式，不同金融业务由不同监管机构监管；而统一监管体制适用于金融混业经营模式，由一个监管机构对多种金融业务进行统一监管。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123404", "t": 3, "q": "货币的支付手段职能是指货币作为商品交换的媒介，用于一手交钱、一手交货的交易。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币作为商品交换媒介，用于一手交钱、一手交货交易的是流通手段职能；而支付手段是随着赊账买卖出现的，如清偿债务、支付赋税、租金、工资等。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123405", "t": 3, "q": "金融风险的度量是指识别金融风险的类型和来源的过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融风险度量是对风险发生的可能性、损失程度等进行量化测算，而识别金融风险的类型和来源是金融风险识别的过程，并非度量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123406", "t": 3, "q": "同业拆借市场属于资本市场，主要解决金融机构长期资金周转需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "同业拆借市场是短期金融市场，属于货币市场，主要解决金融机构短期资金周转需求，并非资本市场和长期资金需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123407", "t": 3, "q": "同业拆借市场是金融机构之间进行短期资金融通的市场，属于资本市场。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资本市场是长期资金市场，而同业拆借市场是金融机构间短期资金融通市场，属于货币市场，并非资本市场。", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123408", "t": 3, "q": "信用风险是系统性风险，无法通过分散投资来降低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信用风险属于非系统性风险，可通过分散投资降低，并非系统性风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123409", "t": 3, "q": "商业银行的核心一级资本充足率不得低于4.5%，一级资本充足率不得低于6%，总资本充足率不得低于8%，这是《商业银行资本管理办法》的规定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "《商业银行资本管理办法》确实规定商业银行核心一级资本充足率不得低于4.5%，一级资本充足率不得低于6%，总资本充足率不得低于8%。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123410", "t": 3, "q": "金融监管的\"双峰监管\"模式是指分别设立审慎监管机构和行为监管机构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“双峰监管”模式核心就是将监管职能划分为审慎监管和行为监管，分别设立相应机构。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123411", "t": 3, "q": "货币供给的外生性是指货币供给由经济体系内部因素（如收入、物价）决定，央行无法主动调控。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。货币供给外生性是指货币供给是由中央银行的货币政策决定的，央行能主动调控，而不是由经济体系内部因素决定。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123412", "t": 3, "q": "商业信用的客体是商品资本，银行信用的客体是货币资本，因此二者在融资对象上完全不重叠。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "商业信用和银行信用虽客体不同，但存在重叠。企业通过商业信用赊购商品后，若资金紧张可能向银行贷款，此时融资对象就有重叠。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123413", "t": 3, "q": "M0是指流通中的现金，M1=M0+定期存款。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。M0 是流通中的现金没错，但 M1 = M0 +企业活期存款 +机关团体部队存款+农村存款+个人持有的信用卡类存款，并非 M0 加定期存款。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123414", "t": 3, "q": "金融科技的发展会完全取代传统金融机构的作用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融科技虽带来变革和冲击，但传统金融机构有其独特优势，如信用基础、线下服务等，二者会相互融合发展，不会被完全取代。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123415", "t": 3, "q": "债券市场属于直接融资市场，资金需求方直接向资金供给方融资，无需金融中介。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "债券市场中，资金需求者通过发行债券直接向资金供给者融资，不存在金融中介参与资金借贷的核心环节，属于直接融资市场。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123416", "t": 3, "q": "金融科技的发展降低了金融服务的门槛，提高了金融服务的普惠性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融科技借助技术创新，如移动支付、大数据风控等，让更多人能便捷获得金融服务，降低了服务门槛，增强了普惠性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123417", "t": 3, "q": "资本市场的交易期限均在1年以上，货币市场的交易期限均在1年以内。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资本市场是长期资金市场，交易期限通常在1年以上，货币市场是短期资金市场，交易期限一般在1年以内。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123418", "t": 3, "q": "央行在实施扩张性货币政策时，会提高再贴现率，以鼓励商业银行向央行借款。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "扩张性货币政策是要增加货币供应量。提高再贴现率会使商业银行借款成本增加，会减少向央行借款，不利于增加货币供应，这是紧缩性货币政策手段，并非扩张性货币政策做法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123419", "t": 3, "q": "金融科技的监管应遵循\"包容审慎\"原则，即在鼓励创新的同时，防范金融风险，促进金融科技健康发展。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融科技发展具有创新性和不确定性，“包容审慎”的监管原则既能给创新留出空间，鼓励金融科技创新，又能有效防控金融风险，保障金融科技行业健康可持续发展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123420", "t": 3, "q": "凯恩斯的货币需求理论认为，投机动机与利率呈正相关关系。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "凯恩斯认为投机动机的货币需求与利率呈负相关关系，利率高时，人们预期利率会下降，债券价格会上升，更愿意持有债券而非货币，投机性货币需求减少；反之则增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123421", "t": 3, "q": "中央银行的\"政府的银行\"职能包括代理国库、发行国债等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“政府的银行”指中央银行代表政府管理金融事务，代理国库、发行国债等都是其履行该职能的体现。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123422", "t": 3, "q": "金融监管中的市场准入监管主要是审核金融机构的注册资本和从业人员资质。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123423", "t": 3, "q": "移动支付中的\"条码支付\"，其安全性主要依赖于条码的加密技术和用户的身份验证，与支付金额大小无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "条码支付安全性不仅依赖条码加密技术和用户身份验证，支付金额大小也会影响其安全策略，金额较大时往往有更严格的风控措施。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123424", "t": 3, "q": "金融监管的\"监管套利\"是指金融机构利用不同监管机构的监管规则差异，选择监管较松的领域开展业务，以规避监管。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“监管套利”就是金融机构钻不同监管规则差异的空子，选监管宽松处开展业务来逃避监管，题干表述准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123425", "t": 3, "q": "中央银行\"政府的银行\"职能体现在代理国库、为政府提供信贷支持、代表政府参与国际金融事务。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "中央银行“政府的银行”职能包含代理国库、为政府提供信贷支持、代表政府参与国际金融事务等内容。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123426", "t": 3, "q": "风险分散策略仅适用于非系统性风险，对系统性风险无效。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "非系统性风险是个别公司或行业特有的风险，可通过分散投资把风险分散掉；而系统性风险是影响整个市场的风险，无法通过分散投资消除。所以风险分散策略仅对非系统性风险有效，对系统性风险无效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123427", "t": 3, "q": "金融发展的水平可以通过金融相关比率（FIR）衡量，FIR是指金融资产总额与国民生产总值的比值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融相关比率（FIR）的确是衡量金融发展水平的指标，其定义就是金融资产总额与国民生产总值的比值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123428", "t": 3, "q": "信托公司属于存款类金融机构，主要业务是吸收存款和发放贷款。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信托公司不属于存款类金融机构，它主要是受人之托、代人理财，并非靠吸收存款和发放贷款开展业务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123429", "t": 3, "q": "资本市场的主要功能是满足金融机构的短期资金周转需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资本市场是长期资金市场，主要满足长期投资和融资需求，而满足金融机构短期资金周转需求是货币市场的功能。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123430", "t": 3, "q": "货币政策中介目标的选择需满足可测性、可控性、相关性三大标准。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币政策中介目标是连接货币政策工具与最终目标的桥梁，为满足有效传导货币政策等要求，其选择必须符合可测性（能准确数据衡量）、可控性（央行能有效控制）、相关性（与最终目标密切关联）三大标准。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123431", "t": 3, "q": "债券的票面利率越高，其市场价格对利率变动的敏感度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般来说，票面利率越高，债券前期现金流回收越快，久期越短，而久期越短，债券价格对利率变动的敏感度越低。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123432", "t": 3, "q": "信用评级的主要目的是为投资者提供关于债务人违约风险的信息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "信用评级核心就是评估债务人信用状况，重点反映其违约风险，为投资者决策提供关键信息。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123433", "t": 3, "q": "IS-LM模型中，IS曲线右移意味着商品市场均衡时，利率不变的情况下收入增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "IS曲线右移代表在相同利率水平下，投资、政府支出等增加使总需求上升，从而均衡收入增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123434", "t": 3, "q": "名义利率是指剔除通货膨胀因素后的利率，实际利率是指包含通货膨胀因素的利率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。名义利率是包含通货膨胀因素的利率，实际利率是剔除通货膨胀因素后的利率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123435", "t": 3, "q": "金融科技中的\"大数据风控\"通过分析客户多维度数据，可降低信贷审批中的信息不对称风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数据风控能收集并分析客户多维度数据，让金融机构更全面了解客户情况，减少因信息不足导致的信息不对称，进而降低信贷审批风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818474232123436", "t": 3, "q": "在复利计息方式下，相同本金、相同利率、相同期限的情况下，每年计息次数越多，最终的本利和越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "复利计息时，每年计息次数越多，意味着利息滚动计算的频率越高，会产生更多的利息，所以最终本利和越大。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 金融学（3）", "n": "基础练习题【含解析】 / 第2章 金融学（3）", "qs": [{"id": "2034818480972369920", "t": 1, "q": "某企业获得银行贷款后，将资金用于股票投资，这种行为属于？", "a": ["信用风险", "操作风险", "道德风险", "市场风险", "", ""], "r": "C", "e": "道德风险指交易一方在签约后为谋取自身利益而损害另一方利益的行为，企业获贷后未按约定用途使用资金去炒股，损害银行利益，属道德风险。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369921", "t": 1, "q": "金融风险度量中，\"风险价值（VaR）\"的含义是（　）", "a": ["在一定置信水平下，特定时期内可能的最大损失", "实际发生的损失金额", "风险发生的概率", "风险的严重程度等级", "", ""], "r": "A", "e": "VaR是指在一定置信水平下，特定时期内可能的最大损失。B选项实际发生损失金额并非VaR含义；C选项风险发生概率不是VaR；D选项风险严重程度等级也不是VaR的定义。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369922", "t": 1, "q": "某企业从银行获得一笔年利率为6%的贷款，贷款期限为3年，按复利计算，若企业每年年末偿还等额本息，该等额本息金额对应的现值系数应选用", "a": ["（P/A，6%，3）", "（P/F，6%，3）", "（F/A，6%，3）", "（F/P，6%，3）", "", ""], "r": "A", "e": "本题是已知每年年末偿还等额本息，要求计算该等额本息金额对应的现值系数。 选项A：(P/A, i, n)是年金现值系数，其中i是利率，n是期数。本题中每年年末偿还等额本息，这是一个普通年金的形式，要计算这些等额本息在当前时刻的现值，就需要使用年金现值系数「test/yiwen_img/importSubject/2034818476140531712.png」，所以选项A正确。 选项B：(P/F, i, n)是复利现值系数，用于计算未来某一笔款项的现值，而本题是等额系列款项，并非单笔款项，所以该选项错误。 选项C：(F/A, i, n)是年金终值系数，用于计算等额系列款项在未来某一时刻的终值，而本题是求现值，所以该选项错误。 选项D：(F/P, i, n)是复利终值系数，用于计算现在的一笔款项在未来某一时刻的终值，与本题求等额本息现值的需求不符，所以该选项错误。综上，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369923", "t": 1, "q": "货币政策的最终目标不包括（　）", "a": ["稳定物价", "充分就业", "国际收支平衡", "汇率固定", "", ""], "r": "D", "e": "货币政策最终目标有稳定物价、充分就业、经济增长、国际收支平衡。汇率固定并非货币政策最终目标。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369924", "t": 1, "q": "中央银行\"发行的银行\"职能主要体现在（　）", "a": ["集中保管商业银行存款准备金", "垄断货币发行权", "代理国库收支", "充当最后贷款人", "", ""], "r": "B", "e": "“发行的银行”核心是拥有货币发行权，中央银行垄断货币发行权体现了这一职能。A选项是“银行的银行”职能体现；C选项是“政府的银行”职能体现；D选项也是“银行的银行”职能体现。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369925", "t": 1, "q": "货币均衡的实现前提是（　）", "a": ["总供给等于总需求", "货币供给等于货币需求", "财政收入等于财政支出", "进出口贸易平衡", "", ""], "r": "B", "e": "货币均衡指货币供给与货币需求基本相适应的货币流通状态，所以其实现前提是货币供给等于货币需求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369926", "t": 1, "q": "中央银行在公开市场上卖出政府债券，其目的是（　）", "a": ["增加货币供应量", "降低市场利率", "减少货币供应量", "刺激经济增长", "", ""], "r": "C", "e": "央行卖出政府债券，会回笼货币，市场上货币量减少。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369927", "t": 1, "q": "下列金融机构中，主要从事中长期资金融通的是", "a": ["货币市场基金", "商业银行", "投资银行", "同业拆借市场", "", ""], "r": "C", "e": "货币市场基金和同业拆借市场是短期资金融通市场；商业银行短期、中长期业务都有；投资银行主要为企业的并购、重组等提供中长期融资服务，侧重中长期资金融通。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369928", "t": 1, "q": "根据\"金融发展与经济增长\"的相关理论，下列哪种金融发展状况更有利于促进经济增长？", "a": ["金融机构单一，金融服务覆盖面窄", "金融市场效率低下，资金配置不合理", "金融体系运行稳健，资金流向高效益产业", "金融管制过度，金融创新能力弱", "", ""], "r": "C", "e": "经济增长需要金融体系有效配置资金，C选项中金融体系运行稳健且资金流向高效益产业，能推动经济发展；A选项金融机构单一、覆盖面窄不利于经济；B选项市场效率低、资金配置不合理阻碍经济；D选项金融管制过度、创新弱也会限制经济。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369929", "t": 1, "q": "以下关于金融监管的原则表述错误的是（　）", "a": ["依法监管原则", "适度竞争原则", "监管主体单一化原则", "协同监管原则", "", ""], "r": "C", "e": "金融监管需多元主体参与，并非单一化，单一化不利于全面有效监管。依法监管、适度竞争、协同监管都是金融监管的重要原则。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369930", "t": 1, "q": "根据IS-LM模型，利率的决定取决于（　）", "a": ["货币供求均衡", "商品市场与货币市场同时均衡", "商品市场均衡", "财政政策与货币政策的松紧", "", ""], "r": "B", "e": "在IS - LM模型中，IS曲线代表商品市场均衡，LM曲线代表货币市场均衡，两条曲线的交点同时满足商品市场和货币市场均衡，该交点决定了均衡利率和均衡产出。所以利率的决定取决于商品市场与货币市场同时均衡。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369931", "t": 1, "q": "在金融市场分类中，下列属于货币市场工具的是（　）", "a": ["股票", "公司债券（期限5年）", "同业拆借", "中长期国债（期限10年）", "", ""], "r": "C", "e": "货币市场是短期资金市场，期限一年以内。同业拆借期限短，属货币市场工具；A股和BD项的债券期限都较长，属于资本市场工具。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369932", "t": 1, "q": "金融科技发展对传统商业银行的影响不包括", "a": ["加剧行业竞争", "推动业务数字化转型", "降低风险管理难度", "改变客户服务模式", "", ""], "r": "C", "e": "金融科技发展会使更多参与者进入金融领域，加剧行业竞争；促使银行推动业务数字化转型；也会改变客户服务模式。但金融科技带来新风险和新挑战，增加了风险管理难度，而非降低。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369933", "t": 1, "q": "中央银行实施货币政策时，最常用的一般性货币政策工具是？", "a": ["法定存款准备金率", "公开市场业务", "再贴现率", "道义劝告", "", ""], "r": "B", "e": "公开市场业务是中央银行最常用的一般性货币政策工具，操作灵活、可微调、可连续操作。法定存款准备金率调整效果猛烈，不常使用；再贴现率被动性较强；道义劝告属间接信用控制手段，并非一般性货币政策工具。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369934", "t": 1, "q": "在我国金融市场体系中，属于货币市场的是？", "a": ["股票市场", "债券市场", "同业拆借市场", "证券投资基金市场", "", ""], "r": "C", "e": "货币市场是短期资金市场。同业拆借是金融机构间短期资金融通，属于货币市场。而股票市场、债券市场、证券投资基金市场主要是长期资金交易场所，属于资本市场。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369935", "t": 1, "q": "根据内生增长理论，金融发展促进经济增长的主要机制不包括", "a": ["提高储蓄率", "优化资源配置效率", "促进技术创新", "直接增加物质资本存量", "", ""], "r": "D", "e": "内生增长理论中，金融发展可通过提高储蓄率、优化资源配置效率、促进技术创新等促进经济增长。而金融发展不能直接增加物质资本存量，只是在资本形成等方面起到间接作用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369936", "t": 1, "q": "下列金融机构中，不属于存款性金融机构的是", "a": ["村镇银行", "农村信用合作社", "证券公司", "城市商业银行", "", ""], "r": "C", "e": "存款性金融机构主要是通过吸收存款来获取资金并开展业务，村镇银行、农村信用合作社、城市商业银行都可吸收公众存款。而证券公司主要从事证券经纪、承销、投资咨询等业务，并非存款性金融机构。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369937", "t": 1, "q": "某金融机构采用VaR（风险价值）模型度量自身面临的市场风险，VaR的核心含义是？", "a": ["在一定置信水平下，特定时间段内可能发生的最大损失", "在一定置信水平下，特定时间段内可能获得的最大收益", "金融机构过去一段时间内实际发生的平均损失", "金融机构未来一段时间内预期发生的平均收益", "", ""], "r": "A", "e": "VaR是衡量市场风险的指标，它是在一定置信水平和特定时间段下，对可能发生的最大损失的度量。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369938", "t": 1, "q": "某企业发行的债券票面利率为6%，同期市场无风险利率为3%，该债券的信用风险溢价最接近", "a": ["2%", "3%", "6%", "9%", "", ""], "r": "B", "e": "信用风险溢价是债券利率与无风险利率的差值。本题中债券票面利率6%，无风险利率3%，信用风险溢价=6% - 3% = 3%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369939", "t": 1, "q": "关于金融发展与经济增长的关系，下列理论中认为\"金融发展是经济增长的必要条件\"的是", "a": ["金融抑制理论", "金融深化理论", "理性预期理论", "有效市场假说", "", ""], "r": "B", "e": "金融深化理论强调金融发展能促进经济增长，认为金融发展是经济增长的必要条件；金融抑制理论指出金融抑制阻碍经济增长；理性预期理论关注预期对经济的影响；有效市场假说主要探讨市场效率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369940", "t": 1, "q": "货币均衡的核心条件是？", "a": ["货币供给等于货币需求", "利率水平稳定", "物价水平稳定", "汇率水平稳定", "", ""], "r": "A", "e": "货币均衡指货币供给与货币需求基本相适应的货币流通状态，核心就是货币供给等于货币需求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369941", "t": 1, "q": "下列关于资本市场的说法，错误的是（　）", "a": ["融资期限长（通常≥1年）", "主要工具包括股票、债券", "风险较低，收益稳定", "为长期投资提供资金", "", ""], "r": "C", "e": "资本市场融资期限长，为长期投资提供资金，主要工具是股票、债券，但其风险高、收益不稳定。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369942", "t": 1, "q": "若某国出现通货膨胀，央行可能采取的货币政策措施是", "a": ["降低法定存款准备金率", "降低再贴现率", "在公开市场卖出债券", "扩大信贷规模", "", ""], "r": "C", "e": "通货膨胀时需收紧货币流通量。A、B、D选项都会增加货币供应量，C选项央行在公开市场卖出债券，会回笼货币，减少市场货币量。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369943", "t": 1, "q": "中央银行提高法定存款准备金率的直接效果是？", "a": ["增加货币供应量", "减少货币供应量", "提高利率水平", "降低利率水平", "", ""], "r": "B", "e": "法定存款准备金率提高，商业银行可用于放贷的资金减少，货币创造能力下降，会直接使货币供应量减少。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369944", "t": 1, "q": "下列属于银行信用与商业信用区别的是？", "a": ["银行信用是直接信用，商业信用是间接信用", "银行信用的融资期限通常短于商业信用", "银行信用的融资规模通常大于商业信用", "银行信用的债权人是企业，商业信用的债权人是银行", "", ""], "r": "C", "e": "商业信用是企业间直接信用，银行信用是通过银行等金融机构的间接信用；银行信用融资期限有长有短，商业信用期限一般较短；银行信用能聚集社会资金，融资规模通常大于商业信用；银行信用债权人是银行等金融机构，商业信用债权人是企业。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369945", "t": 1, "q": "货币政策传导机制中，\"利率渠道\"的核心逻辑是（　）", "a": ["央行调整利率→企业投资、居民消费变化→总需求变化→经济增长", "央行调整货币供应量→物价变化→经济增长", "央行调整准备金率→银行信贷变化→企业融资→经济增长", "央行调整汇率→进出口变化→经济增长", "", ""], "r": "A", "e": "“利率渠道”主要是央行通过调整利率，影响企业投资和居民消费，进而使总需求改变，最终作用于经济增长。A选项符合“利率渠道”核心逻辑。B是货币供应量影响物价传导，C是准备金率影响信贷传导，D是汇率影响进出口传导。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369946", "t": 1, "q": "下列金融机构中，主要承担农业政策性金融服务职能，且不以盈利为主要目标的是？", "a": ["中国农业银行", "中国农业发展银行", "农村商业银行", "中国邮政储蓄银行", "", ""], "r": "B", "e": "中国农业发展银行是我国的农业政策性银行，主要承担农业政策性金融服务职能，不以盈利为主要目标。而中国农业银行、农村商业银行、中国邮政储蓄银行都是商业性金融机构，以盈利为目的。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369947", "t": 1, "q": "金融监管中的\"审慎监管原则\"核心是要求金融机构？", "a": ["严格遵守法律法规，杜绝违法违规行为", "保持充足的资本和流动性，抵御潜在风险", "公平对待所有客户，维护市场公平竞争", "公开披露经营信息，保障投资者知情权", "", ""], "r": "B", "e": "审慎监管原则重点在于确保金融机构稳健运营，核心是让其保持充足资本和流动性，以此抵御潜在风险。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369948", "t": 1, "q": "若货币供给增长率高于经济增长率与物价上涨率之和，根据货币数量论，可能出现的情况是", "a": ["货币流通速度加快", "货币流通速度减慢", "货币购买力上升", "商品供给过剩", "", ""], "r": "B", "e": "根据货币数量论，货币供给增长快于经济增长与物价上涨率之和，意味着货币相对过多。过多货币追逐一定量商品，货币流通速度会减慢。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369949", "t": 1, "q": "下列金融市场中，属于资本市场且以中长期资金融通为主要功能的是？", "a": ["票据贴现市场", "同业拆借市场", "国债期货市场", "公司债券市场", "", ""], "r": "D", "e": "资本市场是中长期资金市场。A、B项均为货币市场，期限短。国债期货市场主要是风险管理和价格发现，不是以中长期资金融通为主。而公司债券市场可让企业筹集长期资金，是资本市场且具中长期资金融通功能。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369950", "t": 1, "q": "移动支付业务的开展主要依赖的金融科技技术是？", "a": ["大数据分析", "移动互联网+身份认证技术", "区块链技术", "量子计算技术", "", ""], "r": "B", "e": "移动支付需要依托移动互联网来实现支付操作，同时身份认证技术能保障支付安全，是开展移动支付业务的关键。大数据分析主要用于数据处理和决策参考；区块链技术多用于特定场景的分布式账本等；量子计算技术目前在移动支付中应用较少。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369951", "t": 1, "q": "关于金融发展与经济增长的关系，下列说法正确的是（　）", "a": ["金融发展必然促进经济增长", "经济增长必然带动金融发展", "二者存在相互作用，但需合理匹配", "二者无任何关联", "", ""], "r": "C", "e": "金融发展和经济增长相互影响，但不是一方必然带动另一方，它们需要合理匹配才能实现良性互动。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369952", "t": 1, "q": "下列关于金融科技监管要求的表述中，正确的是？", "a": ["金融科技业务无需遵守传统金融监管规则，可灵活创新", "金融科技监管应坚持\"技术中立\"原则，不对特定技术偏好", "金融科技监管仅需关注技术风险，无需关注金融风险", "金融科技监管应完全依赖国际规则，无需结合本国实际", "", ""], "r": "B", "e": "A选项，金融科技业务也要遵守传统金融监管规则；C选项，金融科技监管需同时关注技术和金融风险；D选项，金融科技监管要结合本国实际。B选项，“技术中立”是合理的监管原则，不偏向特定技术。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369953", "t": 1, "q": "关于金融发展与经济增长的\"需求跟随型\"关系，下列说法正确的是", "a": ["金融发展先于经济增长，为经济增长提供支撑", "经济增长产生对金融服务的需求，推动金融发展", "金融发展与经济增长相互独立，无明显关联", "金融发展与经济增长同步推进，相互促进", "", ""], "r": "B", "e": "“需求跟随型”强调经济增长是金融发展的动因。即经济增长会产生对金融服务的需求，进而推动金融发展。A选项说金融发展先于经济增长，不符合“需求跟随型”；C选项两者无关联，错误；D选项同步推进也不符合“需求跟随型”特点。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818480972369954", "t": 1, "q": "中央银行作为\"银行的银行\"，其核心职能不包括", "a": ["集中保管商业银行的存款准备金", "充当商业银行的最后贷款人", "代理国库收支", "组织全国银行间的清算", "", ""], "r": "C", "e": "“银行的银行”职能主要围绕与银行相关的业务，如保管准备金、提供贷款、组织清算等。代理国库收支是“政府的银行”职能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844800", "t": 2, "q": "下列属于金融风险预警指标的有？", "a": ["不良贷款率", "资本充足率", "存贷比", "市盈率", "", ""], "r": "ABC", "e": "不良贷款率反映银行信贷资产质量风险；资本充足率衡量银行应对风险损失能力；存贷比体现银行流动性风险；这些都是重要金融风险预警指标。市盈率主要用于评估股价和企业盈利关系，并非金融风险预警指标。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844801", "t": 2, "q": "下列属于金融抑制现象的有", "a": ["利率管制", "信贷配额", "金融机构垄断", "资本市场开放", "", ""], "r": "ABC", "e": "金融抑制是指政府对金融体系过多干预，限制金融发展。利率管制限制了利率自由调节，信贷配额人为分配信贷资源，金融机构垄断阻碍市场竞争，这些都体现金融抑制。而资本市场开放是促进金融市场发展的举措，不属于金融抑制。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844802", "t": 2, "q": "影响货币需求的因素有（　）", "a": ["收入水平（收入越高，交易需求越大）", "利率水平（利率越高，投机需求越小）", "物价水平（物价越高，名义货币需求越大）", "金融资产收益率（收益率越高，货币需求越小）", "", ""], "r": "ABCD", "e": "ABCD选项分别从不同方面阐述了影响货币需求的因素，A中收入与交易需求正相关；B利率与投机需求负相关；C物价与名义货币需求正相关；D金融资产收益率与货币需求负相关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844803", "t": 2, "q": "金融市场的功能包括（　）", "a": ["资金融通功能（调剂资金余缺）", "价格发现功能（形成资产价格）", "风险管理功能（通过衍生品对冲风险）", "宏观调控功能（央行通过市场调节经济）", "", ""], "r": "ABCD", "e": "金融市场可实现资金的融通，能形成资产价格，可利用衍生品等进行风险管理，央行也能借助金融市场调节经济。ABCD四个选项分别对应了金融市场的资金融通、价格发现、风险管理和宏观调控功能。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844804", "t": 2, "q": "金融发展促进经济增长的途径包括？", "a": ["优化资金配置，提高资本使用效率", "促进储蓄向投资转化，增加资本积累", "提供风险管理工具，降低经济活动风险", "提升支付结算效率，降低交易成本", "抑制金融创新，维护金融体系稳定", ""], "r": "ABCD", "e": "A能让资金用在更有效率处推动经济；B增加资本积累利于经济发展；C降低风险可保障经济活动稳定；D提高支付结算效率可促进交易活跃。而E抑制金融创新不利于经济发展，不是促进经济增长途径。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844805", "t": 2, "q": "金融监管的目标包括（　）", "a": ["维护金融体系稳定", "保护存款人利益", "促进金融机构公平竞争", "推动金融创新发展", "", ""], "r": "ABCD", "e": "金融监管旨在保障金融系统稳定、保护相关主体利益、营造公平竞争环境和推动行业创新。ABCD四个选项分别从体系稳定、存款人权益、机构竞争和行业发展方面阐述了金融监管目标。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844806", "t": 2, "q": "下列关于金融深化与金融抑制的表述中，正确的有？", "a": ["金融抑制表现为利率管制、信贷配额等", "金融深化主张放松金融管制，实现金融自由化", "金融抑制会导致资金配置效率低下，阻碍经济增长", "金融深化必然导致金融风险完全消除", "金融深化要求完全取消金融监管", ""], "r": "ABC", "e": "A金融抑制会有利率管制等表现；B金融深化就是要放松管制实现自由化；C金融抑制不利于资金配置和经济增长。而D金融深化不能完全消除金融风险；E金融深化也需要适度监管，不是完全取消。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844807", "t": 2, "q": "下列属于金融机构的功能有？", "a": ["支付结算", "资金融通", "风险管理", "信息中介", "", ""], "r": "ABCD", "e": "金融机构具有多种功能。支付结算能实现资金转移；资金融通可促进资金从盈余方到短缺方；风险管理可帮助客户降低风险；信息中介能提供金融信息。ABCD选项均为金融机构的功能。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844808", "t": 2, "q": "操作风险的主要成因包括", "a": ["内部流程缺陷", "人员失误", "系统故障", "外部事件冲击", "", ""], "r": "ABCD", "e": "操作风险是指由不完善或有问题的内部程序、人为失误、系统故障以及外部事件所引发的损失风险。ABCD四个选项分别对应了操作风险的不同主要成因。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844809", "t": 2, "q": "金融发展促进经济增长的机制有（　）", "a": ["优化资源配置", "降低交易成本", "促进技术创新", "分散金融风险", "", ""], "r": "ABCD", "e": "金融发展能让资金流向更有效率的领域，实现优化资源配置；提供金融服务和工具降低交易成本；为技术创新提供资金支持促进其发展；通过多种方式分散金融风险，这四个方面都是金融发展促进经济增长的机制。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844810", "t": 2, "q": "金融监管的基本原则包括", "a": ["依法监管原则", "适度竞争原则", "审慎监管原则", "协同监管原则", "", ""], "r": "ABCD", "e": "金融监管有依法监管、适度竞争、审慎监管、协同监管等基本原则。依法监管确保监管有法可依；适度竞争维持金融市场活力；审慎监管防控金融风险；协同监管加强部门协作。答案全选。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844811", "t": 2, "q": "信用的主要形式包括（　）", "a": ["商业信用", "银行信用", "国家信用", "消费信用", "", ""], "r": "ABCD", "e": "信用形式多样，商业信用是企业间的信用；银行信用以银行为媒介；国家信用是国家举债；消费信用用于消费者消费。ABCD 都是常见主要信用形式。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844812", "t": 2, "q": "金融监管的主要内容包括（　）", "a": ["市场准入监管", "业务运营监管", "市场退出监管", "从业人员监管", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844813", "t": 2, "q": "中央银行的清算业务包括（　）", "a": ["集中办理商业银行间的同城清算", "办理商业银行间的异地清算", "为商业银行办理资金转账", "吸收商业银行存款准备金", "", ""], "r": "ABC", "e": "中央银行清算业务主要是为金融机构提供清算服务，包括同城和异地清算以及资金转账等。D选项吸收存款准备金不属于清算业务。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844814", "t": 2, "q": "影响利率水平的因素包括", "a": ["平均利润率", "资金供求状况", "货币政策", "国际利率水平", "", ""], "r": "ABCD", "e": "平均利润率是利率的上限，资金供求影响利率高低，货币政策可调节利率，国际利率水平会通过资金流动等影响国内利率。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844815", "t": 2, "q": "区块链技术在金融领域的应用包括？", "a": ["跨境支付", "供应链金融", "数字货币", "信用评级", "", ""], "r": "ABCD", "e": "区块链具有去中心化、不可篡改等特性，在跨境支付中可提升效率与透明度；能助力供应链金融解决信任和信息共享问题；是数字货币的底层技术；也可用于信用评级以增强数据可靠性。ABCD选项均是区块链在金融领域的应用。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844816", "t": 2, "q": "下列金融机构中，属于非银行金融机构的有？", "a": ["保险公司", "信托公司", "村镇银行", "基金管理公司", "", ""], "r": "ABD", "e": "非银行金融机构是除银行外的金融机构，保险公司经营保险业务，信托公司从事信托业务，基金管理公司管理基金，它们都不是银行。而村镇银行属于银行金融机构。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844817", "t": 2, "q": "我国货币供给层次中，M2包括（　）", "a": ["M1（流通现金+单位活期存款）", "单位定期存款", "居民储蓄存款", "其他存款（如货币市场基金）", "", ""], "r": "ABCD", "e": "M2是广义货币供应量，M1属于M2的一部分，同时单位定期存款、居民储蓄存款、其他存款（如货币市场基金）也包含在M2里。所以ABCD选项都正确。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844818", "t": 2, "q": "金融发展促进经济增长的机制包括", "a": ["储蓄转化为投资", "优化资源配置", "促进技术创新", "增加通货膨胀", "", ""], "r": "ABC", "e": "金融发展可将储蓄转化为投资，让资金有效利用；能优化资源配置，引导资金流向高效领域；还能为技术创新提供资金支持促进其发展。而增加通货膨胀并非金融促进经济增长的机制。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844819", "t": 2, "q": "货币市场的子市场包括（　）", "a": ["同业拆借市场", "票据市场", "股票市场", "短期国债市场", "", ""], "r": "ABD", "e": "货币市场是短期资金市场，同业拆借、票据交易、短期国债交易都属短期资金融通，而股票市场是长期资本市场。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844820", "t": 2, "q": "货币供给的创造机制中，商业银行的信用创造需具备的条件有（　）", "a": ["部分准备金制度", "非现金结算制度", "央行垄断货币发行", "商业银行完全垄断市场", "", ""], "r": "AB", "e": "商业银行信用创造依赖部分准备金制度，银行不用将所有存款作为准备金，可用于放贷创造信用；非现金结算制度下，通过银行转账完成交易，利于信用扩张。央行垄断货币发行与商业银行信用创造条件无关，商业银行也并非完全垄断市场。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844821", "t": 2, "q": "下列关于金融发展与经济增长关系的表述中，正确的有", "a": ["金融发展能促进经济增长", "经济增长能推动金融发展", "金融过度发展可能阻碍经济增长", "金融发展与经济增长无必然联系", "", ""], "r": "ABC", "e": "金融与经济相互影响，金融发展能为经济提供资金等支持促进经济增长，经济增长也会推动金融需求和发展，但金融过度发展会带来泡沫等问题阻碍经济。所以ABC正确，D错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844822", "t": 2, "q": "中央银行的资产业务包括（　）", "a": ["购买政府债券", "对商业银行发放再贷款", "吸收商业银行存款准备金", "外汇储备", "", ""], "r": "ABD", "e": "资产业务是央行运用资金的业务。购买政府债券、对商业银行发放再贷款、持有外汇储备都属于央行资金运用。而吸收商业银行存款准备金是负债业务。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844823", "t": 2, "q": "下列属于\"一般性货币政策工具\"的有（　）", "a": ["法定存款准备金率", "公开市场操作", "再贴现率", "消费者信用控制", "", ""], "r": "ABC", "e": "一般性货币政策工具主要包括法定存款准备金率、公开市场操作和再贴现率。消费者信用控制属于选择性货币政策工具。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844824", "t": 2, "q": "内生增长理论认为，金融发展通过哪些途径促进技术创新", "a": ["为研发活动提供融资支持", "分散创新风险", "促进知识溢出", "提高储蓄率", "", ""], "r": "ABC", "e": "金融发展能为研发提供资金、分散创新风险、促进知识交流传播，这些都利于技术创新；而提高储蓄率并非直接促进技术创新的途径。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844825", "t": 2, "q": "中央银行的负债业务包括（　）", "a": ["流通中的现金", "商业银行存款准备金", "政府存款", "对商业银行再贷款", "", ""], "r": "ABC", "e": "中央银行负债业务是资金来源业务，ABC选项都是央行资金来源，流通中现金是央行对公众负债，商业银行存款准备金是对商业银行负债，政府存款是对政府负债；而对商业银行再贷款是央行资产业务。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844826", "t": 2, "q": "下列属于\"系统性金融风险\"的有（　）", "a": ["金融危机引发的全行业流动性危机", "利率大幅波动导致的全市场损失", "单个银行因内部诈骗导致的倒闭", "汇率剧烈变动引发的跨境金融风险", "", ""], "r": "ABD", "e": "系统性金融风险影响整个金融体系或市场。A选项全行业流动性危机、B选项全市场损失、D选项跨境金融风险都涉及大范围金融领域。而C选项单个银行因内部诈骗倒闭是个别机构问题，不属系统性风险。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844827", "t": 2, "q": "金融发展理论的主要流派包括（　）", "a": ["金融深化理论（麦金农、肖）", "金融约束理论（斯蒂格利茨）", "金融自由化理论", "传统货币数量论", "", ""], "r": "ABC", "e": "金融发展理论主要有金融深化理论、金融约束理论等。金融自由化理论也与金融发展相关。而传统货币数量论主要探讨货币数量与物价等关系，不属于金融发展理论流派。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844828", "t": 2, "q": "下列属于金融科技核心技术支撑的有？", "a": ["大数据技术", "人工智能技术", "区块链技术", "云计算技术", "传统纸质记账技术", ""], "r": "ABCD", "e": "金融科技核心技术主要包括大数据、人工智能、区块链、云计算等新兴技术，而传统纸质记账技术已不能适应现代金融科技发展需求，不属于核心技术支撑。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844829", "t": 2, "q": "下列影响利率水平的因素有？", "a": ["平均利润率水平", "货币供求状况", "通货膨胀预期", "中央银行货币政策", "国际利率水平", ""], "r": "ABCDE", "e": "平均利润率是利率的上限，影响利率；货币供求影响资金价格即利率；通货膨胀预期会使利率调整；央行货币政策可直接调控利率；国际利率水平会通过资金流动等影响国内利率。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844830", "t": 2, "q": "金融监管的主要措施包括（　）", "a": ["资本充足率要求", "流动性监管（如LCR、NSFR）", "现场检查与非现场监管", "建立存款保险制度", "", ""], "r": "ABCD", "e": "ABCD 选项都是常见金融监管措施，资本充足率保障银行抵御风险能力；LCR、NSFR等流动性监管确保金融机构资金流动性；现场与非现场监管能全面掌握金融机构情况；存款保险制度保护储户利益、维护金融稳定。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844831", "t": 2, "q": "货币均衡的实现条件包括？", "a": ["货币供给与货币需求总量均衡", "货币供给与货币需求结构均衡", "利率水平合理", "物价水平稳定", "", ""], "r": "ABC", "e": "货币均衡要求货币供给与需求在总量和结构上都均衡，同时合理的利率能调节货币供求实现均衡。物价稳定是货币均衡的结果而非实现条件。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844832", "t": 2, "q": "货币供给的层次划分中，M2包括", "a": ["流通中的现金", "活期存款", "定期存款", "储蓄存款", "", ""], "r": "ABCD", "e": "M2是广义货币供应量，包含流通中的现金、活期存款、定期存款、储蓄存款等。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844833", "t": 2, "q": "货币政策的最终目标包括", "a": ["稳定物价", "充分就业", "经济增长", "国际收支平衡", "", ""], "r": "ABCD", "e": "货币政策最终目标是央行通过货币政策的操作要达到的宏观经济目标，稳定物价、充分就业、经济增长、国际收支平衡是其四大最终目标。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034818485040844834", "t": 2, "q": "货币供给的主要渠道有（　）", "a": ["中央银行通过公开市场操作投放基础货币", "商业银行通过信贷创造派生货币", "政府直接发行货币", "企业自行印制货币", "", ""], "r": "AB", "e": "货币供给渠道主要是央行和商业银行。央行通过公开市场操作投放基础货币，商业银行通过信贷创造派生货币。政府不能直接发行货币，企业更不允许自行印制货币。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488064937984", "t": 3, "q": "根据内生增长理论，金融发展通过促进人力资本积累和技术进步，推动经济实现长期持续增长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "内生增长理论强调经济增长是由经济系统内部因素决定的。金融发展能为人力资本投资和技术研发提供资金支持等，促进人力资本积累和技术进步，进而推动经济长期持续增长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488064937985", "t": 3, "q": "票据贴现业务中，贴现利率越高，企业实际获得的融资额越多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "贴现利率越高，企业需支付的贴现利息越多，实际获得的融资额就越少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488064937986", "t": 3, "q": "区块链技术具有去中心化特征，因此无需任何监管。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "区块链虽有去中心化特点，但在金融安全、数据隐私、市场秩序等多方面存在风险和挑战，仍需要合理监管以保障健康发展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488064937987", "t": 3, "q": "根据金融深化理论，人为压低利率会导致资金需求过度和资金配置效率低下。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融深化理论指出，人为压低利率，会使资金价格低于均衡水平，此时资金需求方会因成本低而过度需求资金；同时低利率无法有效筛选出最有效率的资金使用者，导致资金配置效率低下。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488064937988", "t": 3, "q": "金融监管的核心目标是促进金融机构实现利润最大化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融监管核心目标是维护金融体系稳定、保护投资者和存款人利益等，并非促进金融机构利润最大化，因为仅追求利润可能引发风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488064937989", "t": 3, "q": "金融机构的\"拨备覆盖率\"越高，说明其应对不良资产损失的能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "拨备覆盖率是贷款损失准备对不良贷款的比率，它反映银行对贷款损失的弥补能力和对贷款风险的防范能力，拨备覆盖率越高，意味着银行计提的准备金越充足，越能应对不良资产损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132288", "t": 3, "q": "金融监管的\"依法监管\"原则，意味着监管机构必须严格按照法律规定开展监管，不能根据实际情况灵活调整监管措施。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。“依法监管”原则要求监管机构依据法律开展监管，但并不意味着不能根据实际情况灵活调整监管措施。法律具有一定的稳定性和概括性，实际金融市场复杂多变，监管机构需在法律框架内，结合实际情况灵活运用监管手段和措施，以更好地实现监管目标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132289", "t": 3, "q": "金融风险的\"传染性\"是指某一金融机构的风险会通过业务关联、市场预期等途径扩散到其他金融机构，引发系统性风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融风险“传染性”的定义就是某金融机构风险会经业务关联、市场预期等渠道扩散至其他金融机构，可能引发系统性风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132290", "t": 3, "q": "国际收支平衡是货币政策的最终目标之一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "货币政策最终目标一般包括稳定物价、充分就业、经济增长和国际收支平衡。所以国际收支平衡是货币政策最终目标之一。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132291", "t": 3, "q": "区块链技术的\"去中心化\"特征意味着其无需任何机构参与管理，完全自治。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "区块链虽有“去中心化”特点，但并非无需任何机构参与管理和完全自治，在实际应用中，仍需要监管机构等参与保障其合规性等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132292", "t": 3, "q": "信用风险仅存在于商业银行的贷款业务中，其他金融机构无此类风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信用风险并非仅存在于商业银行贷款业务，其他金融机构如证券公司、保险公司等在业务开展中也会面临交易对手违约等信用风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132293", "t": 3, "q": "商业信用的期限通常与商品的生产和流通周期一致，融资期限具有自偿性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "商业信用是企业之间以商品赊销或预付货款等形式提供的信用，其期限由商品生产和流通周期决定，在商品销售完成后资金回笼可偿还信用，具有自偿性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132294", "t": 3, "q": "消费信用（如信用卡透支、消费贷款）能够刺激居民消费，促进经济增长，但也可能导致居民债务过高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "消费信用能让居民提前消费，增加当期消费支出，从而刺激消费、促进经济增长；同时若过度使用，居民易背负过高债务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132295", "t": 3, "q": "中央银行在公开市场买入外汇，会导致基础货币增加，进而扩大货币供给。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "央行公开市场买入外汇，要用本币支付，这使得市场上本币增多，基础货币增加。基础货币增加会通过货币乘数作用，进一步扩大货币供给。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132296", "t": 3, "q": "法定存款准备金率的调整具有灵活性高、作用温和的特点，是央行常用的货币政策工具。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "法定存款准备金率调整缺乏灵活性，作用较为猛烈，不是常用工具，常用的是公开市场业务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132297", "t": 3, "q": "本票与汇票的主要区别在于，本票是出票人承诺自己付款，汇票是出票人委托他人付款。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "本题可根据本票和汇票的定义来判断。本票是出票人签发的，承诺自己在见票时无条件支付确定的金额给收款人或者持票人的票据；汇票是由出票人签发，委托付款人在见票时，或者在指定日期无条件支付确定的金额给收款人或者持票人的票据。所以本票是出票人承诺自己付款，汇票是出票人委托他人付款，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132298", "t": 3, "q": "同业存单是商业银行向非金融机构发行的短期融资工具，属于货币市场工具。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "同业存单是商业银行在银行间市场发行的、向其他金融机构募集资金的短期融资工具。题干说向非金融机构发行错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132299", "t": 3, "q": "金融监管的首要目标是促进金融机构盈利增长，保障金融行业发展规模。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融监管首要目标是维护金融体系的安全与稳定，而非促进金融机构盈利增长和保障行业规模。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132300", "t": 3, "q": "金融科技的发展会完全取代传统金融机构，因为其在效率、成本、便捷性上均优于传统金融。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融科技虽在效率、成本、便捷性上有优势，但传统金融机构有深厚客户基础、广泛网点和专业风险管理能力等，二者各有优势，金融科技不会完全取代传统金融机构。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132301", "t": 3, "q": "根据金融深化理论，发展中国家存在的\"金融抑制\"现象（如利率管制、信贷配额）会促进储蓄向投资转化，推动经济增长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融抑制（如利率管制、信贷配额）会扭曲金融市场，限制资金有效配置，阻碍储蓄向投资的高效转化，不利于经济增长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132302", "t": 3, "q": "金融发展与经济增长之间是单向促进关系，仅金融发展促进经济增长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融发展与经济增长是相互促进的双向关系，经济增长也会为金融发展提供良好基础和需求，并非单向促进。", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132303", "t": 3, "q": "中央银行代理国库收支，是其作为\"发行的银行\"职能的体现。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "中央银行代理国库收支是“政府的银行”职能体现，“发行的银行”主要指央行垄断货币发行权。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132304", "t": 3, "q": "金融科技\"沙盒监管\"允许企业在无监管约束的环境中进行创新测试，无需承担风险责任。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“沙盒监管”并非无监管约束，它是在可控环境下让企业测试创新，且企业需承担一定风险责任。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132305", "t": 3, "q": "资本市场中的股票市场是直接融资市场，债券市场是间接融资市场。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "股票市场和债券市场都是直接融资市场，资金供求双方直接进行交易，不通过金融中介机构。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132306", "t": 3, "q": "货币供给的内生性是指货币供给由中央银行完全控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "货币供给的内生性强调货币供给并非由中央银行完全控制，而是由经济体系内诸多因素共同决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132307", "t": 3, "q": "金融机构的流动性风险是指金融机构无法以合理成本及时获得充足资金，以满足资产增长或到期债务支付需求的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该表述准确符合流动性风险的定义。", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132308", "t": 3, "q": "金融风险的度量是指通过一定方法确定金融风险发生的概率和损失程度，为风险控制提供依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融风险度量的核心就是确定风险发生概率与损失程度，以此为风险控制提供关键依据，该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132309", "t": 3, "q": "金融科技的发展会完全取代传统金融机构。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融科技虽带来创新与变革，但传统金融机构有自身优势，如广泛的实体网点、深厚的客户基础、严格的风险管控体系等，二者会相互融合、协同发展，而非金融科技完全取代传统金融机构。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132310", "t": 3, "q": "根据费雪效应，名义利率等于实际利率加上通货膨胀率，因此实际利率一定为正。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "费雪效应中名义利率等于实际利率加通货膨胀率，但通货膨胀率可能高于名义利率，此时实际利率为负，并非一定为正。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132311", "t": 3, "q": "货币市场的风险低于资本市场，因此货币市场工具的收益也一定低于资本市场工具。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般而言，风险与收益成正比，货币市场风险低于资本市场，通常其工具收益也低于资本市场工具。不过在特殊市场环境等情况下，可能出现短期波动，货币市场工具收益不一定绝对低于资本市场工具。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132312", "t": 3, "q": "金融债券是商业银行在资本市场发行的长期融资工具，属于资本市场工具。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融债券是金融机构在金融市场发行的债券，商业银行是常见发行主体，期限一般在1年以上，资本市场是期限1年以上资金融通市场，所以金融债券属于资本市场工具。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132313", "t": 3, "q": "法定存款准备金率调整对货币供给的影响较为猛烈，被称为\"猛药\"。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "法定存款准备金率的微小变动会通过货币乘数效应引起货币供给量的大幅变动，对经济影响大且迅速，所以被称为“猛药”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132314", "t": 3, "q": "中央银行作为政府的银行，需要为政府提供信贷支持，可无限制购买政府债券。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "中央银行虽要为政府提供一定信贷支持，但不能无限制购买政府债券。无限制购买会导致货币超发，引发通货膨胀等严重问题，破坏金融稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132315", "t": 3, "q": "按复利计息时，若年利率相同，计息周期越短（如从年缩短至月），则年末本利和越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "复利计息下，年利率相同，计息周期越短，意味着复利次数越多，利息再生利息的机会就更多，年末本利和会越大，而不是越小。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132316", "t": 3, "q": "金融监管的\"适度竞争原则\"是指监管机构应创造公平竞争环境，允许金融机构自由竞争，无需限制竞争行为。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。“适度竞争原则”强调在金融监管中要营造一个既鼓励竞争又避免过度竞争的环境。金融市场需要一定竞争来提升效率和创新，但完全自由竞争、不限制竞争行为会导致市场混乱，如恶意竞争、垄断等问题，损害金融市场稳定和消费者利益。所以监管机构需对竞争行为进行合理限制和引导。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132317", "t": 3, "q": "商业银行的表外业务是指商业银行所从事的、不列入资产负债表且不影响资产负债总额的业务，因此不会产生风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。表外业务虽不列入资产负债表、不影响资产负债总额，但并非无风险。比如担保类表外业务，若被担保人违约，银行需承担代偿责任；金融衍生品类业务受市场波动影响大，会使银行面临市场、信用等多种风险。  ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132318", "t": 3, "q": "系统性金融风险是指单个金融机构或单个金融产品出现风险，不会影响整个金融体系。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统性金融风险是指由于金融体系的内在关联性，单个金融机构或产品的风险可能引发连锁反应，影响整个金融体系的稳定。题干表述与系统性金融风险的定义不符。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132319", "t": 3, "q": "存款保险制度的建立会导致商业银行道德风险上升，因此无需建立该制度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然存款保险制度可能会使商业银行道德风险上升，如银行可能更倾向从事高风险业务，但它也有诸多积极作用，比如保护存款人利益、维护金融稳定等。不能因存在道德风险就否定其必要性，综合权衡利大于弊，所以还是需要建立该制度。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132320", "t": 3, "q": "金融发展与经济增长是单向促进关系，即金融发展必然推动经济增长，经济增长对金融发展无影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。金融发展与经济增长是相互促进的双向关系。金融发展能为经济增长提供资金支持等推动经济增长；而经济增长会产生更多金融服务需求，促进金融市场规模扩大、金融产品创新等，推动金融发展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132321", "t": 3, "q": "凯恩斯认为，交易动机和预防动机的货币需求与收入正相关，投机动机的货币需求与利率负相关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "凯恩斯提出货币需求的三种动机，交易动机和预防动机主要取决于收入，收入越高需求越大，呈正相关；投机动机则与利率有关，利率高时人们更倾向储蓄，投机性货币需求低，呈负相关。", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132322", "t": 3, "q": "金融科技监管应坚持\"包容审慎\"原则，在鼓励创新的同时，防范系统性金融风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融科技发展具有创新性和不确定性，“包容审慎”原则既能为创新提供空间，又可通过监管防范系统性金融风险，保障金融稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132323", "t": 3, "q": "金融科技的本质是\"科技赋能金融\"，并未改变金融的核心功能（如资金融通、风险管理）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金融科技就是利用科技手段来提升金融服务的效率和质量，其核心还是围绕金融的基本功能，没有改变资金融通、风险管理等金融核心功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132324", "t": 3, "q": "区块链技术的\"透明性\"是指区块链上的所有交易信息对所有节点公开，任何人都可查询，确保交易的公开公正。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "区块链技术的透明性确实是指链上交易信息对所有节点公开，任何人都能查询，这有助于保证交易公开公正。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132325", "t": 3, "q": "金融发展与经济增长呈正相关关系，金融规模越大，经济增长速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金融发展与经济增长一般呈正相关，但并非金融规模越大经济增长速度就越快。金融规模过度扩张可能引发金融泡沫、资源错配等问题，反而阻碍经济增长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818488069132326", "t": 3, "q": "在通货膨胀时期，固定利率债券的持有者会面临实际收益下降的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "通货膨胀时物价上涨，货币购买力下降。固定利率债券利息固定，其收益实际价值会因通胀降低。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 金融学（4）", "n": "基础练习题【含解析】 / 第2章 金融学（4）", "qs": [{"id": "2034818497745391616", "t": 1, "q": "中央银行作为\"发行的银行\"，其核心职责是？", "a": ["制定和执行货币政策", "垄断货币发行权，统一全国货币流通", "监督管理金融机构", "为政府提供金融服务", "", ""], "r": "B", "e": "“发行的银行”强调的是央行在货币发行方面的职能。选项B明确指出垄断货币发行权、统一全国货币流通，这是“发行的银行”核心职责。A是央行作为“银行的银行”和“政府的银行”的重要职能；C是金融监管职责；D是“政府的银行”职能。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391617", "t": 1, "q": "下列关于信用的表述，错误的是（　）", "a": ["信用是一种债权债务关系", "信用以偿还和支付利息为条件", "信用只存在于金融机构之间", "信用是价值运动的特殊形式", "", ""], "r": "C", "e": "信用存在于各种经济主体之间，并非只存在于金融机构之间。A选项，信用本质是债权债务关系；B选项，信用一般需偿还且支付利息；D选项，信用是价值运动特殊形式。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391618", "t": 1, "q": "下列金融风险中，源于借款人或交易对手未能履行合同约定义务的风险是（　）", "a": ["市场风险", "信用风险", "操作风险", "流动性风险", "", ""], "r": "B", "e": "信用风险就是借款人或交易对手不履行合同义务带来的风险。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391619", "t": 1, "q": "金融科技的核心技术中，区块链技术的\"去中心化\"特征主要体现在", "a": ["数据存储采用集中式数据库", "交易验证需依赖中央机构", "网络中各节点拥有同等权限", "数据修改需经第三方授权", "", ""], "r": "C", "e": "“去中心化”意味着不依赖单一中心，各节点地位平等。A选项集中式数据库是集中管理非去中心化；B选项依赖中央机构验证也不符合；D选项数据修改需第三方授权同样体现有中心化的管理。而C选项网络中各节点拥有同等权限，体现“去中心化”。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391620", "t": 1, "q": "在货币均衡的实现机制中，中央银行通过调节基础货币来影响货币供给，进而实现货币供求均衡，这一机制主要依赖于？", "a": ["货币乘数效应", "利率传导效应", "汇率传导效应", "收入传导效应", "", ""], "r": "A", "e": "中央银行调节基础货币，借助货币乘数效应影响货币供给量，最终实现货币供求均衡。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391621", "t": 1, "q": "下列关于金融科技内涵的表述中，错误的是？", "a": ["金融科技以技术创新为核心驱动力", "金融科技的应用范围仅局限于支付结算领域", "大数据、人工智能是金融科技的重要技术支撑", "金融科技旨在提升金融服务效率与质量", "", ""], "r": "B", "e": "金融科技应用范围广泛，不局限于支付结算领域，B选项说法错误。A、C、D选项对金融科技内涵表述正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391622", "t": 1, "q": "下列属于直接信用的是（　）", "a": ["企业发行债券", "银行发放贷款", "银行吸收存款", "保险公司提供保险", "", ""], "r": "A", "e": "直接信用是资金供求双方直接进行资金融通。企业发行债券是企业直接向投资者融资，属直接信用。银行存贷及保险公司业务都有金融机构作为中介参与，是间接信用。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391623", "t": 1, "q": "在货币供给层次划分中，M1的构成是？", "a": ["流通中的现金+活期存款", "流通中的现金+定期存款", "流通中的现金+活期存款+定期存款", "流通中的现金+活期存款+其他存款", "", ""], "r": "A", "e": "M1是狭义货币供应量，由流通中的现金和活期存款构成。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391624", "t": 1, "q": "下列关于金融发展与经济增长关系的表述，正确的是（　）", "a": ["金融发展与经济增长完全无关", "金融发展必然抑制经济增长", "适度的金融发展能促进经济增长", "经济增长必然导致金融衰退", "", ""], "r": "C", "e": "金融发展与经济增长密切相关，适度金融发展能为经济提供资金支持等，促进经济增长；而不是毫无关系、必然抑制增长或随经济增长金融就衰退。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391625", "t": 1, "q": "某商业银行因借款人到期无法偿还贷款本息，导致银行资产质量下降，该银行面临的此类风险属于？", "a": ["市场风险", "信用风险", "操作风险", "流动性风险", "", ""], "r": "B", "e": "借款人到期无法偿还贷款本息，这是由于借款人信用问题导致银行面临损失，属于信用风险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391626", "t": 1, "q": "区块链技术的核心特征不包括？", "a": ["去中心化", "不可篡改", "集中管控", "透明可追溯", "", ""], "r": "C", "e": "区块链强调去中心化，其特点是去中心化、不可篡改、透明可追溯，而集中管控与区块链去中心化理念相悖。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391627", "t": 1, "q": "金融科技的核心技术支撑不包括（　）", "a": ["大数据", "区块链", "人工智能", "传统纸质记账技术", "", ""], "r": "D", "e": "金融科技依托先进技术，大数据、区块链、人工智能都是其核心技术支撑。而传统纸质记账技术是较为落后的方式，并非金融科技核心技术。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391628", "t": 1, "q": "在货币均衡实现机制中，\"利率机制\"的作用是", "a": ["通过利率变动调节货币供求", "通过价格变动调节货币供求", "通过收入变动调节货币供求", "通过汇率变动调节货币供求", "", ""], "r": "A", "e": "利率机制主要是借助利率变动来对货币供求进行调节。价格、收入、汇率变动并非利率机制的作用方式。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391629", "t": 1, "q": "当市场利率上升时，债券的市场价格通常会？", "a": ["上升", "下降", "不变", "先升后降", "", ""], "r": "B", "e": "市场利率与债券价格呈反向变动关系，市场利率上升，债券相对收益降低，吸引力下降，价格通常会下降。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391630", "t": 1, "q": "根据金融深化理论，下列哪种情况会阻碍金融发展与经济增长的良性互动？", "a": ["放松对利率的管制，使利率反映市场供求", "减少金融机构准入限制，促进市场竞争", "实行严格的外汇管制，限制资本跨境流动", "完善金融基础设施，提升金融服务覆盖面", "", ""], "r": "C", "e": "金融深化理论强调让金融市场自由、高效运行以促进金融与经济良性互动，A放松利率管制、B减少金融机构准入限制、D完善金融基础设施都利于此，而C实行严格外汇管制，限制资本跨境流动会阻碍资金合理配置和金融市场开放，不利于金融发展与经济增长良性互动。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391631", "t": 1, "q": "金融风险预警指标中，反映金融机构流动性状况的指标是（　）", "a": ["不良贷款率", "存贷比", "资本充足率", "拨备覆盖率", "", ""], "r": "B", "e": "存贷比可体现金融机构贷款资金和存款资金的比例关系，能反映其流动性状况。不良贷款率反映资产质量；资本充足率衡量资本稳健性；拨备覆盖率衡量风险抵补能力。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391632", "t": 1, "q": "金融监管的\"三道防线\"中，第一道防线是？", "a": ["审慎监管", "市场约束", "金融机构内部控制", "行业自律", "", ""], "r": "C", "e": "金融机构内部控制是金融监管“三道防线”的基础，能从内部对金融机构运营进行管控，是第一道防线。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391633", "t": 1, "q": "下列不属于金融监管原则的是？", "a": ["依法监管原则", "审慎监管原则", "盈利性原则", "公开、公正、公平原则", "", ""], "r": "C", "e": "金融监管主要是为维护金融体系稳定、保护投资者等，并非以盈利为目的。依法、审慎、公开公正公平都是常见金融监管原则。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391634", "t": 1, "q": "下列关于利息的本质，马克思主义认为是？", "a": ["货币的时间价值", "剩余价值的转化形式", "风险的补偿", "资金使用权的价格", "", ""], "r": "B", "e": "马克思认为利息是职能资本家使用借贷资本而让渡给借贷资本家的一部分剩余价值，是剩余价值的转化形式。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391635", "t": 1, "q": "在金融风险预警中，\"单一指标预警法\"的主要缺陷是", "a": ["指标选择难度大", "无法反映风险的综合状况", "预警信号滞后", "计算过程复杂", "", ""], "r": "B", "e": "单一指标预警法只依据单个指标判断风险，不能全面反映风险的综合状况。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391636", "t": 1, "q": "金融科技\"沙盒监管\"的特点是（　）", "a": ["对所有金融科技产品全面禁止测试", "在可控环境中试点测试，降低创新风险", "无需监管，完全自由创新", "仅对大型企业开放测试", "", ""], "r": "B", "e": "“沙盒监管”是在可控环境开展创新测试，能降低创新风险。A全面禁止测试错误；C无需监管错误；D并非仅对大型企业开放。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391637", "t": 1, "q": "下列不属于系统性金融风险特征的是？", "a": ["传染性", "全局性", "个别性", "复杂性", "", ""], "r": "C", "e": "系统性金融风险影响广泛，涉及整个金融体系，具有传染性、全局性和复杂性。而个别性与系统性相对，不属于系统性金融风险特征。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391638", "t": 1, "q": "货币均衡的核心条件是（　）", "a": ["货币供给等于货币需求", "利率水平稳定", "物价水平稳定", "汇率水平稳定", "", ""], "r": "A", "e": "货币均衡指货币供给与货币需求基本相适应的货币流通状态，核心就是货币供给等于货币需求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391639", "t": 1, "q": "下列金融机构中，主要负责吸收公众存款、发放贷款，并创造存款货币的是（　）", "a": ["中央银行", "商业银行", "政策性银行", "证券公司", "", ""], "r": "B", "e": "商业银行的基本业务是吸收公众存款、发放贷款，且能通过存贷业务创造存款货币。中央银行主要制定和执行货币政策等；政策性银行是为特定领域提供政策性融资；证券公司主要从事证券业务。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391640", "t": 1, "q": "下列货币政策工具中，属于\"选择性货币政策工具\"的是？", "a": ["法定存款准备金率", "再贴现政策", "公开市场操作", "消费者信用控制", "", ""], "r": "D", "e": "ABC 是一般性货币政策工具，对货币总量进行调节，D 消费者信用控制是有选择地对某些特殊领域的信用加以调节和影响，属于选择性货币政策工具。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391641", "t": 1, "q": "下列货币政策工具中，属于央行选择性货币政策工具的是", "a": ["法定存款准备金率", "消费者信用控制", "公开市场业务", "再贴现率", "", ""], "r": "B", "e": "选择性货币政策工具是央行针对某些特殊领域进行调控的工具，消费者信用控制属于此类。而法定存款准备金率、公开市场业务、再贴现率是一般性货币政策工具。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391642", "t": 1, "q": "凯恩斯的流动性偏好理论认为，人们持有货币的动机不包括（　）", "a": ["交易动机", "预防动机", "投机动机", "投资动机", "", ""], "r": "D", "e": "凯恩斯认为人们持有货币动机有交易、预防和投机动机，不包括投资动机。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391643", "t": 1, "q": "当社会总需求大于总供给，出现通货膨胀压力时，中央银行适宜采取的货币政策操作是？", "a": ["降低法定存款准备金率", "降低再贴现率", "提高法定存款准备金率", "在公开市场买入债券", "", ""], "r": "C", "e": "社会总需求大于总供给、有通胀压力时，应采取紧缩性货币政策。A降低法定存款准备金率、B降低再贴现率、D在公开市场买入债券都会增加货币供应量，属扩张性政策；C提高法定存款准备金率会减少货币供应量，是紧缩性操作。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391644", "t": 1, "q": "下列金融风险中，属于操作风险的是", "a": ["因市场利率变动导致债券价格下跌的风险", "因借款人违约导致的贷款损失风险", "因系统故障导致交易无法完成的风险", "因汇率变动导致的外汇资产损失风险", "", ""], "r": "C", "e": "操作风险是由不完善或有问题的内部程序、人员和信息科技系统，以及外部事件所造成损失的风险。C选项系统故障属于信息科技系统问题，会导致操作风险。A、D是市场风险，B是信用风险。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391645", "t": 1, "q": "下列哪种利率是由市场供求关系决定的（　）", "a": ["官定利率", "公定利率", "市场利率", "基准利率", "", ""], "r": "C", "e": "市场利率是由市场供求关系决定的利率。官定利率由政府金融管理部门或中央银行确定；公定利率是由非政府部门的民间金融组织确定；基准利率是在多种利率并存条件下起决定作用的利率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391646", "t": 1, "q": "某企业从银行借款100万元，年利率为6%，按季度复利计息，一年后该企业应偿还的本利和为多少万元？", "a": ["106.00", "106.09", "106.14", "106.17", "", ""], "r": "C", "e": "本题可先根据季度利率与年利率的关系求出季度利率，再根据复利终值公式计算一年后该企业应偿还的本利和。### 步骤一：计算季度利率已知年利率「test/yiwen_img/importSubject/2034818494780018688.png」，一年按季度复利计息，一年有4个季度，则季度利率「test/yiwen_img/importSubject/2034818495031676928.png」。### 步骤二：计算复利次数一年按季度复利计息，一年有4个季度，所以复利次数n = 4。 ### 步骤三：根据复利终值公式计算本利和复利终值公式为「test/yiwen_img/importSubject/2034818495128145920.png」，其中F为本利和，P为本金，r为利率，n为复利次数。已知本金P = 100万元，季度利率「test/yiwen_img/importSubject/2034818495233003520.png」，复利次数n = 4，将数据代入公式可得：「test/yiwen_img/importSubject/2034818495321083904.png」（万元）综上，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391647", "t": 1, "q": "金融机构在金融市场中扮演的角色不包括（　）", "a": ["资金供给者", "资金需求者", "中介机构", "唯一监管者", "", ""], "r": "D", "e": "金融机构可提供资金成为供给者，也有自身资金需求，还能作为中介连接供需双方。而金融市场监管是多主体的，并非由金融机构唯一监管。所以答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034818497745391648", "t": 1, "q": "金融科技
