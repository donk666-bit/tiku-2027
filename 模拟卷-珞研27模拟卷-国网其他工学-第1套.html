nt-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">腹泻灾害<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">医生土壤<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">发烧降雨<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">代<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">入排除：<\/font>A<font face=\"宋体\">项：病毒是导致流感的原因，二者为因果对应关系，重力是导致滑坡的原因，二者为因果对应关系，但前后两组词语设置先后顺序不同，排除；<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B<font face=\"宋体\">项：感染流感后可能出现腹泻的症状，二者为因果对应关系，滑坡是一种地质灾害，二者为种属关系，前后逻辑关系不一致，排除；<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C<font face=\"宋体\">项：医生治疗流感，二者为治疗者与治疗对象的对应关系，滑坡的主体是土壤，二者为现象与主体的对应关系，前后逻辑关系不一致，排除；<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D<font face=\"宋体\">项：感染流感后可能出现发烧的症状，二者为因果对应关系，降雨可能会诱发山体滑坡，二者为因果对应关系，前后逻辑关系一致，当选。故正确答案为<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "类比推理"}, {"id": "18caf5c42910e729xcpdsc820689", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">随着通信技术的进步，政府执政的舆论环境已发生了明显的变化，各种舆论可以借助网络、短信等方式跨越时空迅速传递，使意见空间加大、力度增强，而决策透明度的增加和公民民主参与意识的增强，又加大了政府的舆论压力。因此政府对<\/font><font face=\"宋体\">“舆情危机”的处理，需要改变以往的被动方式，针对新出现的情况，及时采取新的方式来应对。<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">对这段文字概括最准确的是（）。<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">强调政府在新舆论环境下有必要转变应对方式<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">对比不同时期政府的舆论宣传环境与工作方式<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">剖析政府执政的舆论压力不断增大的外在原因<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">分析通信技术发展与舆论环境变化之间的关系<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】文段第一句告诉我们通信技术对政府的影响，第二句得出结论政府需要如何去做，结论为对策，表达出作者对这件事情的观点，所以重点为果，即政府需要改变以往的被动方式，同义转述答案选择<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42901a4e8xcljsc677121", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">近日，一项研究指出，完全杜绝胆固醇的摄入并不能改善心脑血管疾病。他们的依据是一份实验报告，报告显示实验中的被试人员（均为心脑血管病患者）每天摄入适量胆固醇的同时达到了改善心脑血管疾病的目的。研究人员解释说，这是由于人体内的胆固醇分为<\/font><font face=\"宋体\">“好”胆固醇与“坏”胆固醇，“好”胆固醇对改善心脑血管疾病是有益的。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，能削弱研究人员的观点？<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">每天摄入适量的胆固醇有助于人体营养均衡，提高身体的免疫力<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">被试人员停止摄入胆固醇后，心脑血管疾病的病情又有加重的迹象<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">每天摄入胆固醇会增加健康人罹患糖尿病的风险<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">没有摄入胆固醇与每天摄入胆固醇的心脑血管疾病患者相比，病情改善的程度更好<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】题干观点是第一句，依据是摄入适量胆固醇的人改善了心脑血管疾病。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项加强了题干观点，<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项与题干无关。<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项若为真，则表明完全杜绝胆固醇的摄入更能改善心脑血管疾病，有力地削弱了题干观点。故答案选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf5c42901a4e9xctxsc156831", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">从所给的四个选项中选择最合适的一个填入问号处，使之呈现一定的规律。（）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"415\" height=\"173\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档161.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/font><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font yle=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">A.28<span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">B.29<span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">C.30<span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">D.31<span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:11.0000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】观察发现：<\/font><font face=\"Times New Roman\">2+4-0=6<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">4+6-1=9<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">6+9-2=13<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">9+13-3=19<\/font><font face=\"宋体\">，规律为：第一项<\/font><font face=\"Times New Roman\">+<\/font><font face=\"宋体\">第二项<\/font><font face=\"Times New Roman\">-<\/font><font face=\"宋体\">修正项<\/font><font face=\"Times New Roman\">=<\/font><font face=\"宋体\">第三项，修正项依次为<\/font><font face=\"Times New Roman\">0<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">2<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">3<\/font><font face=\"宋体\">，是公差为<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">的等差数列，修正项下一项为<\/font>< ly:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">A.5.25<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">B.6.42<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">C.12.24<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">D.15.45<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:'Times New Roman';\nfont-size:11.0000pt;\"><p>【答案】B【解析】整数X倍数=小数部分规律。2X2=4,1X3=3,3X4=12,7X5=35,9X6=54(倍数为连续自然数)，下一个倍数为7，选项中6X7=42符合整数X倍数小数\"特征，对应6.42。<\/p>", "l3": "行测", "l4": "数字推理"}, {"id": "18caf5c42910e729xcpdsc028596", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">在一些英语国家，人们长期以来存在语言优越感，其外语能力并不能令人满意。比如，在第二次世界大战后，因为英语地位优越，美国人一直很自负，不重视外语人才的培养，结果在伊拉克战争中吃了亏。类似的经验教训启示我们，不应只把眼睛盯在英语等少数几种使用范围广泛、使用人数众多的语言上。国家在制定语言人才培养政策时，要有统筹规划的意识，应充分考虑各国、各民族的语言和文化，像保护濒危动物和生物多样性那样保护濒危语言、保护文化多样性。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">这段文字意在强调（）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">应以尊重、谦虚的态度面对语言的多样性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">国家的语言政策应当与时俱进、不断调整<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-si ><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">A.<font face=\"宋体\">字长<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">B.<font face=\"宋体\">主频<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">C.<font face=\"宋体\">内存容量<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">D.<font face=\"宋体\">显示器品牌<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "ABC", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABC<\/font><font face=\"宋体\">【解析】计算机的主要性能指标包括运算速度、主频、字长、存储器容量、存取周期、<\/font><font face=\"Times New Roman\">I/O<\/font><font face=\"宋体\">速度等。字长是<\/font><font face=\"Times New Roman\">CPU<\/font><font face=\"宋体\">一次能够处理的二进制数据的位数，决定了计算机的计算精度和处理效率，是核心性能指标。主频是<\/font><font face=\"Times New Roman\">CPU<\/font><font face=\"宋体\">的时钟频率，单位是<\/font><font face=\"Times New Roman\">MHz<\/font><font face=\"宋体\">或<\/font><font face=\"Times New Roman\">GHz<\/font><font face=\"宋体\">，主频越高通常意味着<\/font><font face=\"Times New Roman\">CPU<\/font><font face=\"宋体\">处理数据的速度越快。内存容量反映了计算机即时存储信息的能力，直接影响可同时运行的程序规模和复杂程度。显示器品牌仅代表显示器的制造商，如三星、<\/font><font face=\"Times New Roman\">LG<\/font><font face=\"宋体\">、戴尔等，它并不反映计算机本身的计算性能，同品牌显示器可以配置在不同性能的计算机上。因此，选项<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">不应选入。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第1章"}, {"id": "189cad0b4e4f32e0jsjjd750326", "t": "3", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\">编译程序是将高级语言源程序一次性全部翻译成目标代码，然后执行目标代码<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:Calibri;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:Calibri;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Calibri\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Calibri\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:Calibri;font-size:10.5000pt;\">", "", "", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】编译是将所要翻译的程序代码作为一个整体翻译，并之后运行内部格式，这个翻译过程称为编译。一个编译器可以将一个可阅读的程序文本（源代码）作为输入的数据，然后输出可执行文件（目标代码）。所输出的可执行文件可能是机器语言，由计算机的中央处理器直接运行。编译过程不执行程序，只生成目标代码文件，执行是后续独立的过程。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第2章"}, {"id": "189cad077b014b60jsjmc034719", "t": "2", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">下列哪些是计算机的输出设备？<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">显示器<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">打印机<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">鼠标<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">音箱<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "ABD", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABD<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">显示器、打印机和音箱是输出设备，鼠标是输入设备。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第1章"}, {"id": "189cad0b4e4f32e0jsjsc516345", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">在批处理操作系统中，用户提交作业后<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">需要全程干预作业的运行<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">可以通过终端与系统交互<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">不需要干预，由操作系统自动控制运行<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">必须实时响应每个指令<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">【解析】批处理是指用户将一批作业提交给操作系统后就不再干预，由操作系统控制它们自动运行。这种采用批量处理作业技术的操作系统称为批处理操作系统。批处理操作系统的最大特点是无交互性，用户无法在程序运行过程中进行干预或实时输入。选项<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">“需要全程干预”和选项<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">“可以通过终端与系统交互”都是分时操作系统或实时操作系统的特征。选项<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">“必须实时响应每个指令”是实时操作系统的特征。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第2章"}, {"id": "189cad1573b37320jsjmc595223", "t": "2", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">大数据主要面向的数据类型包含<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">结构化数据<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">半结构化数据<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">非结构化数据<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">描述性数据<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "ABC", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABC<\/font><font face=\"宋体\">【解析】大数据包括结构化、半结构化和非结构化数据，非结构化数据越来越成为数据的主要部分。结构化数据如关系数据库中的数据；半结构化数据如<\/font><font face=\"Times New Roman\">XML<\/font><font face=\"宋体\">数据格式文件；非结构化数据如图片、音频和视频。描述性数据不是大数据分类的标准术语。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第5章"}, {"id": "189cad19084d1ba0jsjsc096935", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">下列传输介质中，采用电磁波沿直线传输，障碍物会严重影响通信质量的是<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">双绞线<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">同轴电缆<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">光纤<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">微波<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】微波只能沿直线传输，因此障碍物会妨碍微波通信。微波通信的特点是沿直线传输，中间设备越高（天线），则覆盖的范围越大。选项<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">都是有线传输介质，不受障碍物直线传播的限制（光纤虽然也是直线传播，但它是通过光信号在纤芯中全反射传播，不受外界障碍物影响）。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad19084d1ba0jsjsc348609", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">IPv6<\/font><font face=\"宋体\">地址由<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">位二进制数组成。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.128<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.32<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.64<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\ font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABCD<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">公有云是由云服务提供商为多个用户提供的云计算服务；私有云是企业或组织自己构建和使用的云环境；混合云是公有云和私有云的结合；社区云是为特定社区或行业的用户提供服务的云，它们都是云计算的部署模式。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第5章"}, {"id": "189cad19084d1ba0jsjsc321291", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">并行计算的主要目的是（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">降低硬件成本<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">以最快的速度求解数字庞大且过程繁杂的计算过程<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">实现设备间的无线通信<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">存储海量数据<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】并行计算是指在并行计算机或分布式计算机等一些高性能计算系统上所做的计算，其硬件基础是高性能的计算机。并行计算的主要目的是以最快的速度求解数字庞大且过程繁杂的计算过程。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad077b014b60jsjsc318647", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机辅助设计的英文缩写是<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.CAD<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.CAM<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.CAI<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.CAT<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">CAD<font face=\"宋体\">（<\/font><font face=\"Times New Roman\">Computer Aided Design<\/font><font face=\"宋体\">）即计算机辅助设计，用于帮助设计人员进行工程设计等工作。<\/font><font face=\"Times New Roman\">CAM<\/font><font face=\"宋体\">（<\/font><font face=\"Times New Roman\">Computer Aided Manufacturing<\/font><font face=\"宋体\">）是计算机辅助制造；<\/font><font face=\"Times New Roman\">CAI<\/font><font face=\"宋体\">（<\/font><font face=\"Times New Roman\">Computer Aided Instruction<\/font><font face=\"宋体\">）是计算机辅助教学；<\/font><font face=\"Times New Roman\">CAT<\/font><font face=\"宋体\">（<\/font><font face=\"Times New Roman\">Computer Aided Testing<\/font><font face=\"宋体\">）是计算机辅助测试。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第1章"}, {"id": "189cad19084d1ba0jsjsc205875", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">下列<\/font>IP<font face=\"宋体\">地址中，属于<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">类地址的是<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.127.0.0.1<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.192.168.1.1<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.10.0.0.1<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.224.0.0.1<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C<font face=\"宋体\">类<\/font><font face=\"Times New Roman\">IP<\/font><font face=\"宋体\">地址的范围是<\/font><font face=\"Times New Roman\">192.0.0.0 - 223.255.255.255<\/font><font face=\"宋体\">。<\/font><font face=\"Times New Roman\">127.0.0.1<\/font><font face=\"宋体\">是回环地址，用于本地主机测试；<\/font><font face=\"Times New Roman\">10.0.0.1<\/font><font face=\"宋体\">属于<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">类地址（<\/font><font face=\"Times New Roman\">1.0.0.0 - 127.255.255.255<\/font><font face=\"宋体\">）；<\/font><font face=\"Times New Roman\">224.0.0.1<\/font><font face=\"宋体\">属于<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">类地址（<\/font><font face=\"Times New Roman\">224.0.0.0 - 239.255.255.255<\/font><font face=\"宋体\">），主要用于组播。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad0b4e4f32e0jsjsc447103", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">以下关于软件工程的说法，正确的是<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">软件工程就是编写程序<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">软件工程只关注软件的开发过程<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">软件工程强调用工程化的方法来开发和维护软件<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">软件工程不需要考虑软件的成本<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">软件工程不仅仅是编写程序，它涵盖了软件从需求分析、设计、开发、测试、维护到退役的整个生命周期，强调用工程化的方法来开发和维护软件，同时也需要考虑软件的成本、质量等多方面因素。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第2章"}, {"id": "189cad0f39b1a760jsjjd292871", "t": "3", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机网络中的<\/font>UDP<font face=\"宋体\">协议是一种可靠的传输协议，它保证数据的有序传输。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:12.0000pt;\">", "<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "", "", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">UDP<font face=\"宋体\">（用户数据报协议）是一种不可靠的传输协议，它不保证数据的可靠传输，也不保证数据的有序到达。<\/font><font face=\"Times New Roman\">UDP<\/font><font face=\"宋体\">在传输数据时，不建立连接，直接将数据发送出去，具有传输速度快、开销小的特点，适用于一些对实时性要求较高但对数据准确性要求相对较低的应用场景，如视频直播、语音通话等。而<\/font><font face=\"Times New Roman\">TCP<\/font><font face=\"宋体\">（传输控制协议）是可靠的传输协议，通过确认、重传等机制保证数据的可靠传输和有序到达。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}, {"id": "189cad19084d1ba0jsjjd927947", "t": "3", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">数据预处理中的数据清洗通常由计算机自动完成，不需要人工干预（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", "", "", ""], "r": "A", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】数据清洗”中的明确阐述，录入后的数据清洗一般是由计算机而不是人工完成。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad0f39b1a760jsjmc605863", "t": "2", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">.<font face=\"宋体\">下列哪些是计算机网络的传输介质？<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">双绞线<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">光纤<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">同轴电缆<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">红外线<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "ABCD", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABCD<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">双绞线、光纤和同轴电缆<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">、<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">红外线<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">均<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">是常见的网络传输介质，双绞线、光纤和同轴电缆<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">属于有限<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">传输介质<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">，<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">红外线通常用于无线通信。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}, {"id": "189cad19084d1ba0jsjsc545051", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">冯洛依曼结构，计算机的数据<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">以哪种方式存储<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">存储传输<\/font><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(51,51,51);font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;color:rgb(51,51,51);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">【<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"Times New Roman\">2026<\/font><font face=\"宋体\">国网其他工学类一批】<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">二进制储存<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">十进制储存<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">八进制储存<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">十六进制储存<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-weight:normal;font-style:normal;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">冯<\/font><font face=\"宋体\">·诺依曼体系结构的核心特征包括：<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font><font face=\"Calibri\">1<\/font><font face=\"宋体\">）程序与数据统一存储<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font><font face=\"Calibri\">2<\/font><font face=\"宋体\">）采用二进制表示<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font><font face=\"Calibri\">3<\/font><font face=\"宋体\">）顺序执行指令<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font><font face=\"Calibri\">4<\/font><font face=\"宋体\">）五大组成部分：运算器、控制器、存储器、输入设备、输出设备<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">采用二进制优势：物理实现简单（高低电平）；抗干扰能力强；逻辑运算方便<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad0f39b1a760jsjsc516420", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">在<\/font>URL<font face=\"宋体\">地址<\/font><a href=\"http://www.edu.cn/index.html\"><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">http://www.edu.cn/index.html<\/a><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">中，<\/font><font face=\"Times New Roman\">“http”<\/font><font face=\"宋体\">代表的是<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">A.<font face=\"宋体\">协议类型<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">B.<font face=\"宋体\">主机域名<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">C.<font face=\"宋体\">路径<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">D.<font face=\"宋体\">文件名<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
