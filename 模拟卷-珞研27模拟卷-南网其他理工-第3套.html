tyle=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">手机垃圾短信息有<\/font><font face=\"宋体\">“骚扰型”，多为恶作剧、“黄段子”、小道消息：有“陷阱型”，多是骗取用户钱财<\/font><font face=\"Times New Roman\">;<\/font><font face=\"宋体\">有广告短信。短信业务的确给运营商们带来了丰厚的利润，但有些短信正成为一种“信息公害”，让人不堪其扰。一些急于开发新客户的新企业群发不少短信广告，绝大多数的垃圾短信制造者是运营商、“三无”产品经营者、诈骗者。现在应尽快完善相关监管法规。先管住短信服务提供者，垃圾短信这颗毒瘤，迟早是会被根除的。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">最适合做这段文字标题的是：（）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">垃圾短信成为信息公害<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">切实治理垃圾短信<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">垃圾短信为何屡禁不止<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">法律监管垃圾短信尚未到位<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">通过文段的阅读，发现题干中讲的是关于社会上的现象<\/font><font face=\"宋体\">“垃圾短信”，作者也就此表达了自己的看法。很显然这是一个议论性的文段。那我们的标题要尽量的体现出主旨观点，换言之也就是对表达作者主观倾向的句子进行概括。“现在应尽快完善相关监管法规。先管住短信服务提供者，垃圾短信这颗毒瘤，迟早是会被根除的。”对以上的句子进行概括，既可以的到文段的标题。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf63e299a13e9xcyjsc409241", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">瑞士等北欧国家发现和出土的大量石斧、石制矛头、箭头和其他石制<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">工具以及用树干造出的独木舟便是遗证<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">②陆地上的积冰融化后，很快就出现了苔藓、地衣和细草，这些冻土原始植物引来<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">了驯鹿等动物<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">③又常年受着从西面和西南面刮来的大西洋暖湿气流的影响，很适合生物的生长<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">④动物又吸引居住在中欧的猎人在夏天来到北欧狩猎<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑤北欧虽说处于高纬度地区，但这一带正是北大西洋暖流流经的地方<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑥这大约发生在公元前 <\/font><font face=\"Times New Roman\">8000 <\/font><font face=\"宋体\">年到公元前 <\/font><font face=\"Times New Roman\">6000 <\/font><font face=\"宋体\">年的中石器时代<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">将以上<\/font> <font face=\"Times New Roman\">6 <\/font><font face=\"宋体\"> ace=\"宋体\">。本题正确答案选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e299a13e9xcpdsc122174", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">教育上有一个传统，就是在课程设计中把科学与文学、历史对立起来。这种对立是容易从历史上来解释的。在实验科学以前，文学、语言和哲学已经在所有高等学校占领了牢固的地位，实验科学自然必须奋力前进。没有一个筑有堡垒的和坚固的势力集团会轻易放弃它可能占有的垄断地位。但是，无论哪一方面，都认为语言和文学全部是人文主义性质的，而科学则纯粹是属于自然界的。这是一个错误的观念。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">接下来最可能要讲的是：（）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">文学、历史在高等学校的传统地位<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">实验科学是如何迅猛发展起来的<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">人文学科的垄断地位是如何被打破的<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">将科学与人文对立为什么是不应该的<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】文段尾句提到，语言和文学全部是人文主义性质的，科学纯粹是属于自然界的这种观念是错误的，按照话题一致原则，下文应承接尾句论述，即讨论为什么这一观念是错误的，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项与此相符。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项“文学、历史在高等学校的传统地位”为已有信息，排除。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项内容与尾句无关，排除。故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e297b8f68xcljsc559878", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">近期一项调查显示，吃辣跟死亡率之间存在着某种关联。对将近<\/font>20<font face=\"宋体\">万名<\/font><font face=\"Times New Roman\">60<\/font><font face=\"宋体\">岁以上的男性、<\/font><font face=\"Times New Roman\">29<\/font><font face=\"宋体\">万名<\/font><font face=\"Times New Roman\">60<\/font><font face=\"宋体\">岁以上的女性平均七年随访数据说明，相比饮食最为清淡，即平均每周吃辣不到一次的人来说，每周吃了三次以上的人死亡率降低了<\/font><font face=\"Times New Roman\">14%<\/font><font face=\"宋体\">，一，而且这一趋势在女性中更为明显，死亡率降低最多竟达<\/font><font face=\"Times New Roman\">22%<\/font><font face=\"宋体\">。另外，相比于干辣椒、辣椒油或辣椒酱，吃新鲜辣椒的人死亡率降低更为明显。这说明吃辣可以降低死亡率。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能削弱上述结论？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">正是因为被调查者身体健康，在饮食上才没有太多禁忌<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">被调查者中，女性吃辣的能力明显低于男性<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">新鲜辣椒所含辣椒素更丰富<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">科学研究发现辣椒素有利于缓解疼痛和降低血压<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>A<font face=\"宋体\">【解析】题干由调查数据得出观点：吃辣可以降低死亡率。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项指出被调查的对象身体健康，才在饮食上没有太多顾忌，即吃辣更多，因此题干的论证为因果倒置，最能削弱题干结论。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项为无关项，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项在一定程度上支持了题干结论。故答案为<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e299a13e8xcpdsc559878", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">重点国有景区门票降价，不但直接触及景区的经济利益，而且伤及一些景区长期形成的<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">门票依赖<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150% =\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\">B<span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】图形中直线数多于曲线数，<\/font><span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\">B<span style=\"font-family:'Times New Roman';line-height:150%;color:rgb(0,0,0);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">符合。<\/font><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e297b8f69xctxsc322272", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性（）。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"230\" height=\"252\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档2839.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/font><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】元素组成相似，优先考虑样式规律。九宫格横向观察，发现第一行第一个图形整体顺时针旋转<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">90<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">°<\/font><font face=\"宋体\">和第二个图形去同存异（保留各自不同的部分），得到第三个图形；第二行验证此规律成立，第三行应用此规律，通过观察已知图形发现，第二个图形和第三个图形最左边都有一条竖线，因此证明该条竖线并非前两个图的相同部分，即第一个图形整体顺时针旋转<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">90<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">°<\/font><font face=\"宋体\">后最左边不能出现一条竖线。观察四个选项可以看出，<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">三项整体顺时针旋转<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">90<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">°<\/font><font face=\"宋体\">后最左边都有一条竖线，排除。故正确答案为<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e298ad1a9xcdysc938126", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">耶克斯<\/font>-<font face=\"宋体\">多德森定律，指各种活动都存在一个最佳的动机水平，动机不足或过分强烈，都会使工作效率下降。研究还发现，动机的最佳水平随任务性质的不同而不同。一般来说，在比较容易的任务中，工作效率随动机的提高而上升；随着任务难度的增加，动机最佳水平有逐渐下降的趋势。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，下列情形符合耶克斯<\/font>-<font face=\"宋体\">多德森定律的是：（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">越是面对难度大的任务，小超越是感到兴奋<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">不管任务难易，小强每天的工作积极性都很高<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">小军连续学习了<\/font><font face=\"Times New Roman\">12<\/font><font face=\"宋体\">个小时，学习效率明显下降<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">小风很想在奥赛中获奖，反而没发挥出正常水平<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">答案】<\/font>D<font face=\"宋体\">【解析】耶克斯﹣多德森定律的关键信息：动机不足或过分强烈都会使工作效率下降。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A<font face=\"宋体\">项，面对难度大的任务，小超会感到更兴奋，未体现工作效率和动机之间的关系，不符合定义。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B<font face=\"宋体\">项，不管任务难易，小强的工作积极性都很高，未体现工作效率和动机之间的关系，不符合定义。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C<font face=\"宋体\">项，小军因为长时间连续学习导致学习效率下降，未体现动机水平，不符合定义<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D<font face=\"宋体\">项，小风很想在奥赛中获奖，说明他的动机过分强烈而没发挥出正常水平，说明了动机过强烈会使工作效率下降，符合定义。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "定义判断"}, {"id": "18caf63e299a13e9xcyjsc996908", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">①这条河贯穿南北，盯着一条河看，其实就是纲举目张，在打量一个辽阔而古老<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">的中国<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">②它与空间一起支撑起一个勘探世界奥秘的坐标<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">③时间是历史，也是文化，还是解决一个个疑问的真相<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">④世界沿着运河像布匹一样在我的想象里展开<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑤在时空交错的坐标里探寻一条河，我相信我看见的是一个复杂、浩瀚的世界<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑥它还给了我另一个想象世界的维度，那就是时间<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">将以上<\/font> <font face=\"Times New Roman\">6 <\/font><font face=\"宋体\">个句子重新排列，语序正确的是：（ &nbsp;&nbsp;）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">①⑤⑥③②④<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">④⑥③②⑤①<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">⑤①④⑥②③<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">③②⑤④⑥①<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>B<font face=\"宋体\">【解析】<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">中含有指代词<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">这<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">，放在首句指代不明，排除<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">中的<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">这条河<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">指的是在<\/font><font face=\"Times New Roman\">⑤<\/font><font face=\"宋体\">中提到的在时空交错的坐标里探寻一条河，故<\/font><font face=\"Times New Roman\">⑤①<\/font><font face=\"宋体\">应前后紧密相连，排除Ｄ。<\/font><font face=\"Times New Roman\">⑥<\/font><font face=\"宋体\">末尾提到<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">时间<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">③<\/font><font face=\"宋体\">开头为<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">时间<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">，构成顶针结构，两句应紧密相连，排除<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e299a13e9xcyjsc990152", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">①<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">在唐朝之前我们国家都没有菠菜的记载。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">②<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">虽说菠菜有一种浓浓的乡土味道，但是它们真不是原产中土之物。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">③<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">如今学界比较公认的菠菜传播路径是，先由波斯传入印度，之后大约公元<\/font>647<font face=\"宋体\">年的时候，才经尼泊尔传入中国。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">④<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">曾经有学者认为菠菜是在张骞出使西域的时候就带回中国了，却没有实际的证据来支持这种说法。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">⑤<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">至于菠菜的名字，有个说法就是从<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">波斯菜<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">演化而来，就跟它的来源有关。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">⑥<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">菠菜的老家在波斯，也就是今天的伊朗及其周边区域。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">将以上六个句子重新排序，语序正确的是（<\/font> <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">①⑤④⑥③②<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">②①⑥⑤④③<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">②④⑤③①⑥<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">⑥③④⑤②①<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>B<font face=\"宋体\">【解析】阅读<\/font><font face=\"Times New Roman\">6<\/font><font face=\"宋体\">句话可知，文段主要在论述外来之物菠菜的来历。选项分别以<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">⑥<\/font><font face=\"宋体\">作为首句，<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">说的是我国唐朝之前没有关于菠菜的记载，<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">说的是菠菜其实不是原产中土之物，<\/font><f ;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">小杨是水手<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">小孙是老师<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">小杜不是司机<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">小胡不是画家<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>A<font face=\"宋体\">【解析】题干条件：<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">小孙是老师<\/font><font face=\"Times New Roman\">&#x21d2;<\/font><font face=\"宋体\">小胡不是画家；<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">小钱或者小孙是老师；<\/font><font face=\"Times New Roman\">③<\/font><font face=\"宋体\">小胡不是画家<\/font><font face=\"Times New Roman\">&#x21d2;<\/font><font face=\"宋体\">小杜不是司机；<\/font><font face=\"Times New Roman\">④<\/font><font face=\"宋体\">小杨是水手<\/font><font face=\"Times New Roman\">&#x21d2;<\/font><font face=\"宋体\">小杜是司机。<\/font><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">代入<\/font>A<font face=\"宋体\">项，小杨是水手，根据<\/font><font face=\"Times New Roman\">④<\/font><font face=\"宋体\">肯定前件可以推出肯定的后件，可得小杜是司机；根据<\/font><font face=\"Times New Roman\">③<\/font><font face=\"宋体\">否定后件可以推出否定的前件，可得小胡是画家；根据<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">否定后件可以推出否定的前件，可得小孙不是老师；根据<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">可得小钱是老师。能够得出<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">小钱是老师<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">的结论，该项正确。<\/font><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">代入<\/font>B<font face=\"宋体\">项，小孙是老师，根据<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">肯定前件可以推出肯定的后件，可得小胡不是画家；根据<\/font><font face=\"Times New Roman\">③<\/font><font face=\"宋体\">肯定前件可以推出肯定的后件，可得小杜不是司机；根据<\/font><font face=\"Times New Roman\">④<\/font><font face=\"宋体\">否定的后件可以推出否定的前件，可得小杨不是水手，无法得到其他结论，得不出<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">小钱是老师<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">的结论，该项错误。<\/font><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">代入<\/font>C<font face=\"宋体\">项，小杜不是司机，根据<\/font><font face=\"Times New Roman\">④<\/font><font face=\"宋体\">否定后件可以推出否定的前件，可得小杨不是水手，无法得到其他结论，得不出<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">小钱是老师<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">的结论，该项错误。<\/font><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">代入<\/font>D<font face=\"宋体\">项，小胡不是画家，根据<\/font><font face=\"Times New Roman\">③<\/font><font face=\"宋体\">肯定前件可以肯定的后件，可得小杜不是司机；根据<\/font><font face=\"Times New Roman\">④<\/font><font face=\"宋体\">否定的后件可以推出否定的前件，可得小杨不是水手，无法得到其他结论，得不出<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">小钱是老师<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">的结论，该项错误。<\/font><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">故本题选<\/font>A<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e295d0ae8atsc967505", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">2.4<font face=\"宋体\">，<\/font><font face=\"Times New Roman\">1.3<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">3.12<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">7.35<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">9.54<\/font><font face=\"宋体\">，<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><i><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">\n <\/i>", "a": ["<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">A.5.25<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">B.6.42<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">C.12.24<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">D.15.45<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:'Times New Roman';\nfont-size:11.0000pt;\"><p>【答案】B【解析】整数X倍数=小数部分规律。2X2=4,1X3=3,3X4=12,7X5=35,9X6=54(倍数为连续自然数)，下一个倍数为7，选项中6X7=42符合整数X倍数小数\"特征，对应6.42。<\/p>", "l3": "行测", "l4": "数字推理"}, {"id": "18caf63e299a13e9xcyjsc250652", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">除了人类以外的灵长类动物都学不会发声，没有模仿所听到声音的能力<\/font><font face=\"宋体\">——这种能力对于说话而言必不可少。但近日，研究者表示，灵长类动物能以近乎交谈的方式互相呼喊，因为它们会等待对方呼喊结束再发声。如果这种技能是后天习得的，那么它更接近人类的类似技能，因为婴儿是在咿呀学语的过程中学会这种技能的。这一发现或可帮助我们<\/font><font face=\"Times New Roman\">________________<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">填入画横线部分最恰当的一项是：（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">更好地分析人类交往的方式<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">更好地理解人类语言的起源<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">更好地解决人类交流的障碍<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">更好地探索人类文明的起源<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】文段首先指出除了人类之外的灵长类动物都不具备说话必备的能力，然后以“但”引出研究者的最新发现——灵长类动物具备能以近乎交谈的方式互相呼喊的技能，而人类的类似技能是在学习语言过程中学会的。空缺处所填句子是对这一发现意义的阐述。对应文段中出现的“发声”“说话”“学语”等词汇可知，科学家的发现应与“语言”相关，即通过对灵长类动物呼喊、发声技能的研究，探索人类语言的起源。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e295d0ae8atsc069659", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">数列：（<\/font>3<font face=\"宋体\">，<\/font><font face=\"Times New Roman\">5<\/font><font face=\"宋体\">），（<\/font><font face=\"Times New Roman\">5<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">7<\/font><font face=\"宋体\">），（<\/font><font face=\"Times New Roman\">11<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">13<\/font><font face=\"宋体\">），（<\/font><font face=\"Times New Roman\">17<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">19<\/font><font face=\"宋体\">），（<\/font><font face=\"Times New Roman\">29<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">31<\/font><font face=\"宋体\">），<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">A.<font face=\"宋体\">（<\/font><font face=\"Times New Roman\">41<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">43<\/font><font face=\"宋体\">）<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">B.<font face=\"宋体\">（<\/font><font face=\"Times New Roman\">57<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">59<\/font><font face=\"宋体\">）<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">C.<font face=\"宋体\">（<\/font><font face=\"Times New Roman\">61<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">65<\/font><font face=\"宋体\">）<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">D.<font face=\"宋体\">（<\/font><font face=\"Times New Roman\">71<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">73<\/font><font face=\"宋体\">）<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:11.0000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】孪生素数对规律（相差<\/font><font face=\"Times New Roman\">2<\/font><font face=\"宋体\">的两个质数）；数列内数对：<\/font><font face=\"Times New Roman\">(3,5)<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">(5,7)<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">(11,13)<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">(17,19)<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">(29,31)<\/font><font face=\"宋体\">均为李生素数；<\/font><font face=\"Times New Roman\">31<\/font><font face=\"宋体\">之后的下一对李生素数为（<\/font><font face=\"Times New Roman\">41,43<\/font><font face=\"宋体\">）（<\/font><font face=\"Times New Roman\">37<\/font><font face=\"宋体\">与<\/font><font face=\"Times New Roman\">39<\/font><font face=\"宋体\">中<\/font><font face=\"Times New Roman\">39<\/font><font face=\"宋体\">非质数，排除）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "数字推理"}, {"id": "18caf63e298ad1a9xcdysc709626", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">善意取得是指无权处分他人动产或不动产的占有人，不法将动产或不动产转让给第三人以后，如果受让人在取得该动产或不动产时出于善意，就可以依法取得对该动产或不动产的所有权。受让人在取得动产或不动产的所有权以后，原所有人不得要求受让人返还财产，而只能请求转让人（占有人）赔偿损失。这里的第三人被称为善意第三人。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，以下判断正确的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">甲欠乙<\/font><font face=\"Times New Roman\">50<\/font><font face=\"宋体\">万元，将自己的别墅抵押给乙，后来甲又将该套别墅卖给丙，并办理了过户登记，乙作为善意第三人可以要求甲对自己进行赔偿<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">王某花了<\/font><font face=\"Times New Roman\">100<\/font><font face=\"宋体\">万元从李某处购买了一幅名画，后王某以<\/font><font face=\"Times New Roman\">150<\/font><font face=\"宋体\">万元的价格将此画转卖给韩某，后证实该画为赝品，韩某属于被侵害利益的善意第三人<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">魏某因欠张某十万元，将自己所有的一块高档手表交给张某作为担保，张某未经魏某同意，将手表卖给不知情的孙某，孙某属于善意第三人<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">老吴典当了自家的祖传香炉，其妻以自己不知情且香炉属于夫妻共同财产为名，要求典当行退还该香炉，老吴的妻子属于不知情的善意第三人<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】善意取得的定义要点：<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">无权处分他人动产或不动产的占有人，不法将动产或不动产转让给第三人；<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">受让人<\/font><font face=\"Times New Roman\">(<\/font><font face=\"宋体\">善意第三人<\/font><font face=\"Times New Roman\">)<\/font><font face=\"宋体\">在取得该动产或不动产时出于善意则取得对该动产或不动产的所有权。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A<font face=\"宋体\">项，甲将自己的别墅抵押给乙，未经过乙的同意，甲将别墅卖给丙，受让人是丙，而非乙，所以乙不是善意第三人，判断错误。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B<font face=\"宋体\">项，王某从李某处购买了名画，名画是属于王某的资产，王某有权将自己的画转卖给韩某，不涉及善意取得，所以韩某不是善意第三人，判断错误。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C<font face=\"宋体\">项，魏某将自己的手表交给张某作为担保物，手表的所有权还是属于魏某，所以张某无权处置魏某的手表；张某私自将手表卖给不知情的孙某，孙某属于善意第三人，判断正确。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D<font face=\"宋体\">项，老吴将祖传香炉典当给典当行，受让人并非老吴的妻子，所以老吴的妻子不是善意第三人，判断错误。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">本故本题选<\/font>C<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "定义判断"}, {"id": "18caf63e297b8f68atsc634335", "t": " t-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e297b8f68xcljsc167957", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">如果一个人在<\/font>A<font face=\"宋体\">城市乱扔垃圾就会被认为没有道德；一个人如果没有道德，<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">城市里就没有人和他做朋友；一个人如果在<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">城市没有朋友就寸步难行，无法继续留在这里。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">从上述叙述中，可以推出以下哪项结论？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">一个人在<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">城市乱扔垃圾但是仍然可以留在<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">城市<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">如果一个人道德修养很高，那么他就能留在<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">城市<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">生活在<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">城市的小李在过马路时将西瓜皮扔在地上，那么他将难以再留在<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">城市<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">小王没有留在<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">城市说明他缺乏道德修养<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】题干推理为：在<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">城市乱扔垃圾<\/font><font face=\"Times New Roman\">&#x21d2;<\/font><font face=\"宋体\">没有道德<\/font><font face=\"Times New Roman\">&#x21d2;<\/font><font face=\"宋体\">没有朋友<\/font><font face=\"Times New Roman\">&#x21d2;<\/font><font face=\"宋体\">无法继续留在<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">城市。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项由这个推理可以推出。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">城市与此无关；否前不能否后，<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项错误；肯后不能肯前，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项错误。<\/font><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e297b8f69xctxsc156831", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">从所给的四个选项中选择最合适的一个填入问号处，使之呈现一定的规律。（）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"415\" height=\"173\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档161.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/font><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>B<font face=\"宋体\">【解析】题干第一个、第三个、第五个图形既是轴对称图形又是中心对称图形，第二个、第四个、第六个图形仅是中心对称图形，只有<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项符合。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e299a13e8xcpdsc470234", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">水、土地是人类赖以生存的三大必需条件，然而相对于大气污染和水环境污染，公众对土壤污染并不够重视，防治意识要弱很多，这很大程度上是由于土壤污染具有隐蔽性、滞后性。雾霾来了我们能看到，河水变臭我们能闻到，可我们并不知道自己吃的大米、蔬菜是什么样的土里种出来的，含有什么不该有的元素。更可怕的是，土壤污染一旦发生便很难恢复，如果今年这片地里种出的庄稼有毒，明年也必定带毒，若想恢复如初，需要付出巨大的代价，需要漫长的时间。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">这段文字意在强调：（）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">土壤污染与其他生态污染有哪些不同<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">公众应重视土壤污染并提高防治意识<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">土壤污染危害的发现为何具有滞后性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">土壤污染治理应舍得投入时间和财力<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:TimesNewRomanPSMT;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">文段先介绍目前存在的问题<\/font><font face=\"宋体\">——与大气污染和水污染相比，人们对于土壤污染不够重视，然后介绍不重视土壤污染所带来的危害，如果我们直接把直接对文段所描述的问题及其危害进行总结，会发现并没有对应的选项，因此作者通过描述对土壤污染不够重视及这一问题的危害，其实是想告诉人们应该重视并去解决这一问题，从而避免带来危害。了解这一点，即可选出答案<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf63e299a13e8xcpdsc973213", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">为了帮助贫困地区脱贫，长期以来，社会各界以多种形式开展帮扶，扶贫思路更加清晰，扶贫手段更加多样，文化扶贫、旅游扶贫、电商扶贫等新方式效果显著，脱贫攻坚实现换挡提速。但一些尚未脱贫的地区，因为自然条件恶劣，发展脱贫产业难度较大。要啃下扶贫的<\/font><font face=\"宋体\">“硬骨头”，还需打好科技牌。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">最适合做这段文字标题的是：<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">打好脱贫攻坚科技牌<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">啃下扶贫的“硬骨头”<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">选好脱贫攻坚新方式<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">脱贫攻坚实现换挡提速<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>A<font face=\"宋体\">【解析】文段首先指出脱贫攻坚事业实现了换挡提速，接着以<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">但<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">转折，说明一些地区因自然条件恶劣，发展脱贫产业难度大，进而提出对策，要啃下扶贫的<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">硬骨头<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，还要打好科技牌。因此<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">科技牌<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">扶贫攻坚<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">是文段的主题词，要在标题中有所体现。<\/font>A<font face=\"宋体\">项包含两个主题词，且对文段主旨概括恰当，作为标题恰当。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项均未体现主题词<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">科技牌<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font>D<font face=\"宋体\">项是文段转折前的内容，非文段重点。故本题选<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf63e299a13e9xcyjsc018420", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">①近年来，人们对甜味零食、含糖饮料的需求越来越大，摄入的添加糖也与日俱增<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">②碳水化合物是一系列只由碳、氢、氧三种元素构成的物质，糖类就是种类繁多的碳水化合物中的一类<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">③许多食物（比如水果）中天然都含有糖，我们吃下这些含有糖类的食物后，可以吸收并释放能量，支持身体 的正常生命活动<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">④添加糖的形式很多，我们熟知的白砂糖、红糖、冰糖、糖浆都属于添加糖<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑤这对我们的身体来说，可不是一个好消息<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑥“添加糖”与天然糖相对应，顾名思义，就是为了增加食物的甜味而额外添加进食物中的糖<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">将以上<\/font><font face=\"Times New Roman\">6<\/font><font face=\"宋体\">个句子重新排列，语序正确的是（ &nbsp;&nbsp;）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">①⑤⑥④②③<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">②③⑥④①⑤<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">③②⑥⑤①④<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">④①⑤③②⑥<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>B<font face=\"宋体\">【解析】观察<\/font><font face=\"Times New Roman\">6<\/font><font face=\"宋体\">个句子，从句子之间的逻辑关系和话题一致性入手解题。<\/font><font face=\"Times New Roman\">④<\/font><font face=\"宋体\">介绍添加糖的形式，<\/font><font face=\"Times New Roman\">⑥<\/font><font face=\"宋体\">介绍添加糖的定义，按照一般的逻辑顺序，应先介绍定义再介绍形式，排除<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">，且两句论述话题一致，应相连，排除<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。比较<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">两项，二者的区别是<\/font><font face=\"Times New Roman\">①⑤<\/font><font face=\"宋体\">和<\/font><font face=\"Times New Roman\">②③<\/font><font face=\"宋体\">的位置，<\/font><font face=\"Times New Roman\">②③<\/font><font face=\"宋体\">由<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">碳水化合物<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">引出糖类，说许多食物都含有糖类。<\/font><font face=\"Times New Roman\">①⑤<\/font><font face=\"宋体\">说的是添加糖的内容，添加糖是糖类的一种。由逻辑顺序可知，应先引出糖类的概念，后面再具体介绍糖类中的添加糖，显然<\/font><font face=\"Times New Roman\">②③<\/font><font face=\"宋体\">应排在最前面，排除<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e298ad1a9xcdysc111345", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">外观设计也被称为工业品外观设计，或者简称为工业设计。它是指关于产品的形状、图案、色彩或者其结合所提出的富有美感并适用于工业上应用的新设计。它具有以下几个特点：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">1<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">外观设计必须以具体的产品为依托。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">2<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">外观设计以产品的形状、图案和色彩等为要素，以美感目的为核心，而不去追求实用目的。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">3<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">外观设计必须适用于工业应用，这里所谓的工业应用就是指该外观设计可以通过工业手段大量复制。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，下列各项中属于外观设计的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">设计师专为某世界知名品牌的珠宝设计的绿色三叶草形包装盒<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">由某位画家手工绘制的花鸟图案的<\/font><font face=\"Times New Roman\">T<\/font><font face=\"宋体\">恤衫<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.5<font face=\"宋体\">名大学生设计的能同时供多人使用的乒乓球自动发球机<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">某乐器制造厂设计并生产的以熊猫为造型的中国传统吹奏乐器<\/font><font face=\"Times New Roman\">——<\/font><font face=\"宋体\">埙<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】定义关键词<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">：<\/font><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">以具体的产品为依托<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">、<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">以美感目的为核心，而不去追求实用目的<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">、<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">通过工业手段大量复制<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A<font face=\"宋体\">项：产品是珠宝，而三叶草形状的包装盒是产品的外包装，而不是对于产品本身做的设计，不属于<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">以具体的产品为依托<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，不符合定义，排除；<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B<font face=\"宋体\">项：画家手工绘制的图案不可能<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">通过工业手段大量复制<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，不符合定义，排除；<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C<font face=\"宋体\">项：乒乓球自动发球机追求的是实用目的，而不是以美感为目的，不符合定义，排除；<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D<font face=\"宋体\">项：乐器制造厂制作的这个乐器，可以<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">通过工业手段大量复制，<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">而且设计成熊猫的造型，目的是为了美观好看，符合定义，当选。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">故正确答案为<\/font>D<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "定义判断"}, {"id": "18caf63e297b8f69xctxsc768161", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:12.0000pt;\"><span style=\"font-family:宋体;color:rgb(51,51,51);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">把下面的六个图形分为两类，使每一类图形都有各自的共同特征或规律，分类正确的一项是：（）<\/font><span style=\"font-family:微软雅黑;color:rgb(51,51,51);\r\nfont-size:10.5000pt;\">\n <img width=\"503\" height=\"147\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档2018.png\"><span style=\"font-family:微软雅黑;color:rgb(51,51,51);\r\nfont-size:12.0000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/font><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:Calibri;font-size:12.0000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Calibri\">D<\/font><span style=\"font-family:宋体;font-size:12.0000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】每幅图中均出现了小黑点，可以考虑小黑点和主图形的相对位置。图形②④⑥中黑点位于直线交点处，图形①③⑤中黑点不在交点处，故正确答案选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e297b8f69xctxsc828493", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">从所给四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性：<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"554\" height=\"208\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档3925.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/font><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】每组第二个和第三个图形组合构成第一个图形。第二组中第二个图形与第三个图形应该凹凸相合，观察对比，应选择<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e299a13e9xcyjsc049368", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">相关研究表明，<\/font><font face=\"Times New Roman\">________________<\/font><font face=\"宋体\">：由于气候变暖，中国冬小麦的安全种植北界已由长城沿线向北扩展了<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">至<\/font><font face=\"Times New Roman\">2<\/font><font face=\"宋体\">个纬度；华北地区冬小麦正由冬性向半冬性过渡，东北地区粮食产量显著提高，水稻面积和总产量迅速增加；喜温作物玉米目前已经成为中国第一大作物。除了利好消息，气候变化也有不利影响：各种极端天气事件增多，各种病虫害危害加重，都会导致农业减产。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">填入划横线部分最恰当的一句是：<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">气候变化给中国农业带来的影响以好处居多<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">气候变暖对农业的影响并不像想象的那么悲观<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">各种气象灾害对农业生产的影响日益突出<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">中国主要农作物的种植面积正在日益扩大<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】由“除了利好消息，气候变化也有不利影响”可知，前文主要讲的是气候变化的积极影响，据此排除<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">两项。对应“中国冬小麦”“华北地区冬小麦”“东北地区粮食产量”“中国第一大作物”等表述可知，此处主要强调的是对“中国农业”的影响，<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项未提到“中国”这一主体，故不如<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项恰当。本题选<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e297b8f68xcljsc325181", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">在我们这个高速发展的社会，拆迁和建设的速度早已超出了人们的想象。而城市的发展总是伴随着城市的拆迁和建设，因此，有人认为，城市的发展是导致城市拆迁和建设的根本原因。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能削弱上述结论：<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">很少进行拆迁和建设的城市，往往都会发展得比较缓慢<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">除城市发展外，工业化也是导致城市拆迁和建设的原因<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">城市的发展过程必然会带来了很多正面的和负面的影响<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">经济发展水平的提高，促进城市发展，带动城市的拆迁和建设<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】题干论据：城市的发展总是伴随着城市的拆迁和建设。结论：城市的发展是导致城市拆迁和建设的根本原因。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项，指出很少拆迁和建设的城市，发展比较缓慢，从反面说明城市发展与城市拆迁和建设之间确实有伴随的关系，但是并没有说明城市发展与城市拆迁和建设之间是否具有因果关系，也不能确定城市的发展是否是导致城市拆迁和建设的根本原因，不能削弱题干结论，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项，指出工业化也是导致城市拆迁和建设的原因，但不能说明城市发展不是根本原因，不能削弱题干结论，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项，指出城市发展会带来正面和负面的影响，但影响是否包括城市拆迁和建设不能确定，不能确定城市的发展是否是导致城市拆迁和建设的根本原因，不能削弱题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项，指出城市发展与城市拆迁和建设都是经济发展水平提高带来的结果，说明经济发展水平的提高才是城市拆迁和建设的根本原因，削弱了题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">故答案选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e299a13e8xcpdsc594147", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">现在很多人对于甜味和吃糖感到排斥和恐惧，因为他们很惧怕发胖，仿佛吃一小块糖果就会胖一圈似的。其实，真正使人发胖的并不是那一小块糖果，而是每天吃的食物所包含的能量超出了消耗的能量。馒头、面条、米饭或者玉米面窝头中都有淀粉，即不甜的糖。淀粉<\/font><font face=\"Times New Roman\">(<\/font><font face=\"宋体\">不管来自哪一种粮食，细粮还是粗粮<\/font><font face=\"Times New Roman\">)<\/font><font face=\"宋体\">在人体内氧化所放出的热量与蔗糖基本上没有差别。要控制发胖，主要在于控制摄入的总热量，而不在于食物的口味是不是甜的。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">最适合做这段文字标题的一项是<\/font><font face=\"Times New Roman\">:<\/font><font face=\"宋体\">（）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">吃糖与发胖<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">淀粉与发胖<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">发胖的“真凶”<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">不发胖的“秘诀”<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】文段首先指出人们对于糖的恐惧是因为害怕发胖，然后说明真正让人发胖的原因是所吃食物的能量超出了消耗的能量。接着说明很多食物都有淀粉即不甜的糖，去表明其实我们很多时候都在“吃糖”。最后表达要控制发胖主要的做法应该是控制摄入的总热量。所以文段的重点内容应该是告诉我们控制发胖的正确做法。<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项能够表达出主要内容，且“秘诀”二字能够让人产生联想，吸引人。当选。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项，吃糖与发胖是转折之前的内容，非文段的主旨，排除。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项，淀粉与发胖是文段转折之后谈到的，但文段的重点应该是如何去控制发胖，而不是谈淀粉与发胖的关系，排除。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项，该项表述的是发胖的原因，一样不是文段的主要内容，排除。本题答案为<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">选项。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf63e297b8f68xcljsc222337", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">对于春秋时期的某国，如果仓廪实或衣食足，则民知礼节或知荣辱。如果民知礼节或知荣辱，则或者国富，或者民强。如果民强，则百业兴。事实上该国并非国富，而且并非百业兴。由此可推出：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">该国仓廪实但并非衣食足<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">该国并非仓廪实但衣食足<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">该国仓廪实且衣食足<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-s
