es New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">的羽毛是制作<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">羽毛球<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">的材料，二者是原材料的对应关系。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A<font face=\"宋体\">项，<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">象牙<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">是<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">大象<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">的组成部分，二者是组成关系，与题干逻辑关系不一致，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B<font face=\"宋体\">项，<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">鸡<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">和<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">鸡尾酒<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">之间无明显的逻辑关系，与题干逻辑关系不一致，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C<font face=\"宋体\">项，<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">狐狸<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">的皮毛是制作<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">皮草<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">的材料，二者为原材料的对应关系，与题干逻辑关系一致，当选。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D<font face=\"宋体\">项，<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">狼图腾<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">表达的是古代原始部落对<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">狼<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">的崇拜，与题干逻辑关系不一致，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">故正确答案为<\/font>C<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "类比推理"}, {"id": "18caf5c42901a4e8xcljsc427318", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">相比早期生活在农村的孩子，城市里的孩子更容易出现过敏性疾病，与此同时，早期生活在城市的孩子其呼吸系统内微生物群的发育较为迟缓和不充分，而农村孩子的发育较为成熟。因此研究认为，儿童体内微生物群发育不良是过敏性疾病出现的主要原因。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能支持上述结论（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">城市化水平越高，儿童出现空气过敏源致敏的概率就越高<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">在城市的孩子比生活在农村的孩子胃肠道内微生物群发育更迟缓<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">过敏性疾病与人体免疫功能有关，微生物群是形成良好免疫功能的重要因素<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">过敏性疾病的儿童患者体内白细胞介素较少<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】题干论据：早期生活在城市的孩子其呼吸系统内微生物群的发育较为迟缓和不充分，而农村孩子的发育较为成熟。题干结论：儿童体内微生物群发育不良是过敏性疾病出现的主要原因。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A<font face=\"宋体\">项，指出城市化水平越高，儿童出现空气过敏源致敏的概率就越高，并未说明儿童体内微生物群与过敏性疾病之间的关系，不能支持题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B<font face=\"宋体\">项，指出在城市的孩子比生活在农村的孩子胃肠道内微生物群发育更迟缓，与题干论述无关，不能支持题于结论。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C<font face=\"宋体\">项，指出过敏性疾病与人体免疫功能有关，微生物群是形成良好免疫功能的重要因素，说明微生物群的形成与过敏性疾病的确有重要关联，即儿童体内微生物群发育不良是过敏性疾病出现的主要原因，支持了题<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">了<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">结论。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D<font face=\"宋体\">项，指出过敏性疾病的儿童患者体内白细胞介素较少，但白细胞介素多少与过敏性疾病之间的关系不明确，不能支持题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">故本题选<\/font>C<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf5c42901a4ebxcdysc518929", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">差异性市场营销指的是面对已经细分的市场，企业选择两个或两个以上的子市场作为市场目标，分别对每个子市场提供针对性的产品和服务以及相应的销售措施。企业根据子市场的特点，分别制定产品策略、价格策略、分销策略以及促销策略并予以实施。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，下列哪项属于差异性市场营销？（）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">某快捷酒店的休息阅览区既有双人座，也有单人座；既有单纯书刊阅读的座位，还有提供网络查询的座位<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">某公司针对市场生产出<\/font><font face=\"Times New Roman\">11<\/font><font face=\"宋体\">个品牌的洗衣粉，既有强力去污但价格较高的，也有去污较强但价格适中的，还有物美价廉的<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">在北京某尾货市场，既有大量的服装摊位，也有不少办公用品摊位，甚至还有各种电器厂家在此直销<\/font><span sty nfont-size:10.5000pt;\">C<font face=\"宋体\">。第二空，由<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">虽<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">……<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">但<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">的句式可知，所填词语应表示<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">两条道<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">偶有交叉的意思。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">相似<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">指相像，与句意无关，排除<\/font>D<font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">交叠<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">填人恰当。故本题选<\/font>A<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑填空"}, {"id": "18caf5c42910e72axcyjsc990152", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">①<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">在唐朝之前我们国家都没有菠菜的记载。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">②<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">虽说菠菜有一种浓浓的乡土味道，但是它们真不是原产中土之物。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">③<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">如今学界比较公认的菠菜传播路径是，先由波斯传入印度，之后大约公元<\/font>647<font face=\"宋体\">年的时候，才经尼泊尔传入中国。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">④<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">曾经有学者认为菠菜是在张骞出使西域的时候就带回中国了，却没有实际的证据来支持这种说法。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">⑤<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">至于菠菜的名字，有个说法就是从<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">波斯菜<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">演化而来，就跟它的来源有关。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">⑥<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">菠菜的老家在波斯，也就是今天的伊朗及其周边区域。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">将以上六个句子重新排序，语序正确的是（<\/font> <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">①⑤④⑥③②<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">②①⑥⑤④③<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">②④⑤③①⑥<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">⑥③④⑤②①<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>B<font face=\"宋体\">【解析】阅读<\/font><font face=\"Times New Roman\">6<\/font><font face=\"宋体\">句话可知，文段主要在论述外来之物菠菜的来历。选项分别以<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">⑥<\/font><font face=\"宋体\">作为首句，<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">说的是我国唐朝之前没有关于菠菜的记载，<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">说的是菠菜其实不是原产中土之物，<\/font><font face=\"Times New Roman\">⑥<\/font><font face=\"宋体\">说的是菠菜的真正原产地。分析可知，<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">作为首句引出菠菜不是原产中土之物这个话题，然后<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">和<\/font><font face=\"Times New Roman\">⑥<\/font><font face=\"宋体\">对此进行具体说明，排除<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><font face=\"Times New Roman\">③<\/font><font face=\"宋体\">论述菠菜传人中国的传播路径，<\/font><font face=\"Times New Roman\">④<\/font><font face=\"宋体\">论述有学者认为菠菜是张骞出使西域的时候带回中国的。两句都在论述菠菜是如何传人中国的，话题一致，应捆绑，排除<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">故本题选<\/font>B<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf5c428e32068atsc058031", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><img width=\"18\" height=\"21\" src=\"https://idapic.luoyanedu.com/tiku/20260414180602_d69/1数字推理-题库文档920.png\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">，<\/font><img width=\"24\" height=\"19\" src=\"https://idapic.luoyanedu.com/tiku/20260414180602_d69/1数字推理-题库文档922.png\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">，<\/font>9<font face=\"宋体\">，<\/font><font face=\"Times New Roman\">18<\/font><font face=\"宋体\">，<\/font><img width=\"31\" height=\"19\" src=\"https://idapic.luoyanedu.com/tiku/20260414180602_d69/1数字推理-题库文档929.png\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">，<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">A.27<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">B.<img width=\"31\" height=\"19\" src=\"https://idapic.luoyanedu.com/tiku/20260414180602_d69/1数字推理-题库文档944.png\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">C.<img width=\"31\" height=\"19\" src=\"https://idapic.luoyanedu.com/tiku/20260414180602_d69/1数字推理-题库文档948.png\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">D.54<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">整理为<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">：<\/font><img width=\"186\" height=\"21\" src=\"https://idapic.luoyanedu.com/tiku/20260414180604_jl3/1数字推理-答案文档1357.png\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">，则下一项：<\/font><img width=\"31\" height=\"19\" src=\"https://idapic.luoyanedu.com/tiku/20260414180604_jl3/1数字推理-答案文档1364.png\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "数字推理"}, {"id": "18caf5c42910e72axcpdsc430892", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">政党组织和其他社会成员必须按照特定的规则运行和活动，这是法治的应有之义。在当代中国，规范国家权力运行和社会成员活动的各类规则可谓浩如烟海，但国家法律体系和党内法规体系显然是最有影响力和最为重要的规则体系。十八届四中全会审议通过的《中共中央关于推进依法治国若干重大问题的决定》将形成<\/font><font face=\"宋体\">“完备的法律规范体系”和“完善的党内法规体系”纳入建设中国特色社会主义法治体系，确立了推进依法治国的总目标。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">这段文字之后作者最有可能阐述的是：（）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">中国特色社会主义法治体系的建构<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">依法治国建设小康社会的构想<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">党内法规与国家法律的衔接和协调<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">建立健全党内法规体系的对应措施<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">【解析】文段首先由法治的应有之义引出我国法律规则多的现象，然后以“但”做转折强调国家法律体系和党内法规体系是最有影响力和最为重要的规则体系，最后以《决定》将二者纳入建设中国特色社会主义法治体系进一步验证了其重要性。由此可知，“国家法律体系和党内法规体系”应是文段论述的对象，下文也应延续这一话题。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项表述笼统，文段着重论述的是中国特色社会主义法治体系中的“国家法律体系和党内法规体系”部分；<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项的建设小康社会”文段未涉及，属无关信息；<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项仅提到“党内法规体系”，不。所以本题答案选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><b><span style=\"font-family:宋体;line-height:150%;\r\nfont-weight:bold;font-size:12.0000pt;\">\n <\/b>", "l3": "行测", "l4": "语句表达"}, {"id": "18caf5c42901a4e9xctxsc482230", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">请从所给的四个选项中选择最合适的一个填入问号处，使之呈现一定的规律。（）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"464\" height=\"178\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档1857.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10 e=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "类比推理"}, {"id": "18caf5c42901a4e8xcljsc222337", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">对于春秋时期的某国，如果仓廪实或衣食足，则民知礼节或知荣辱。如果民知礼节或知荣辱，则或者国富，或者民强。如果民强，则百业兴。事实上该国并非国富，而且并非百业兴。由此可推出：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">该国仓廪实但并非衣食足<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">该国并非仓廪实但衣食足<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">该国仓廪实且衣食足<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">该国并非仓廪实且并非衣食足<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>D<font face=\"宋体\">【解析】题干的逻辑关系可整理如下：<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">仓廪实或衣食足<\/font><font face=\"Times New Roman\">&#x21d2;<\/font><font face=\"宋体\">知礼节或知荣辱<\/font><font face=\"Times New Roman\">&#x21d2;<\/font><font face=\"宋体\">或者国富或者民强；<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">民强<\/font><font face=\"Times New Roman\">&#x21d2;<\/font><font face=\"宋体\">百业兴。题干已知<\/font><font face= 因为婴儿是在咿呀学语的过程中学会这种技能的。这一发现或可帮助我们<\/font><font face=\"Times New Roman\">________________<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">填入画横线部分最恰当的一项是：（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">更好地分析人类交往的方式<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">更好地理解人类语言的起源<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">更好地解决人类交流的障碍<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">更好地探索人类文明的起源<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】文段首先指出除了人类之外的灵长类动物都不具备说话必备的能力，然后以“但”引出研究者的最新发现——灵长类动物具备能以近乎交谈的方式互相呼喊的技能，而人类的类似技能是在学习语言过程中学会的。空缺处所填句子是对这一发现意义的阐述。对应文段中出现的“发声”“说话”“学语”等词汇可知，科学家的发现应与“语言”相关，即通过对灵长类动物呼喊、发声技能的研究，探索人类语言的起源。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf5c42910e729xcpdsc866423", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">手机垃圾短信息有<\/font><font face=\"宋体\">“骚扰型”，多为恶作剧、“黄段子”、小道消息：有“陷阱型”，多是骗取用户钱财<\/font><font face=\"Times New Roman\">;<\/font><font face=\"宋体\">有广告短信。短信业务的确给运营商们带来了丰厚的利润，但有些短信正成为一种“信息公害”，让人不堪其扰。一些急于开发新客户的新企业群发不少短信广告，绝大多数的垃圾短信制造者是运营商、“三无”产品经营者、诈骗者。现在应尽快完善相关监管法规。先管住短信服务提供者，垃圾短信这颗毒瘤，迟早是会被根除的。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">最适合做这段文字标题的是：（）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">垃圾短信成为信息公害<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">切实治理垃圾短信<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">垃圾短信为何屡禁不止<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">法律监管垃圾短信尚未到位<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">通过文段的阅读，发现题干中讲的是关于社会上的现象<\/font><font face=\"宋体\">“垃圾短信”，作者也就此表达了自己的看法。很显然这是一个议论性的文段。那我们的标题要尽量的体现出主旨观点，换言之也就是对表达作者主观倾向的句子进行概括。“现在应尽快完善相关监管法规。先管住短信服务提供者，垃圾短信这颗毒瘤，迟早是会被根除的。”对以上的句子进行概括，既可以的到文段的标题。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42901a4eaxclbsc475394", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">锤打：盆浴<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">推敲：斟酌<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">纸箱：铁桶<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">刀刻：针织<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">炼钢：采茶<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\">【答案】C【解析】题干“锤打：盆浴”考查构词方式，“锤打”是用锤子打，“盆浴”是用盆洗浴，二者都是“工具/器具＋动作”的结构。C项“刀刻”是用刀刻，“针织”是用针织，也都是“工具＋动作”，与题干关系一致。A项“推敲”和“斟酌”是近义关系，B项“纸箱”和“铁桶”是“材料＋物品”，D项“炼钢”和“采茶”是“动作＋对象”，均与题干不一致。因此选C。", "l3": "行测", "l4": "类比推理"}, {"id": "18caf5c42910e72axcyjsc938126", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">宝石颜色有三个影响要素，即光源、宝石和观察者。不同的光源具有不同的光谱能量分布，因而照射到宝石上会使宝石呈现出不同的颜色；宝石由于自身内部的致色离子对光源光波的选择性吸收、反射、透射而呈现出不同的颜色；对于观察者而言，虽然人眼具有对可见光的灵敏分辨力，但对具体波长可见光的感知是因人而异的。也就是说，对同一宝石品种与观察者来说，<\/font><u><span style=\"font-family:宋体;text-decoration:underline;\r\ntext-underline:single;font-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">&nbsp;<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">填入画横线部分最恰当的一句是（<\/font> <span style=\"font-family:宋体;font-size:10.5000pt;\">&nbsp;&nbsp;<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">宝石颜色会随照明光源的不同而发生改变<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">标准光源的选定对宝石颜色评价尤为关键<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">提高观察者对可见光的灵敏分辨力十分必要<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选择透光性好的宝石能获得更高的市场利润<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】文段提到了影响宝石颜色的三个要素——光源、宝石和观察者。末句指出，对同一宝石品种与观察者来说，这就意味着，影响宝石颜色的三个要素中宝石和观察者是确定的，这种情况下宝石的颜色主要受光源的影响。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项着眼于“观察者”<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项着眼于“宝石”，均与横线前二者确定的条件不符，排除；<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项指出照明光源会影响宝石颜色，这一点前文已作了论述，末句不应再次强调，排除。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf5c42901a4ebxcdysc197207", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">国际贸易按商品形式的不同，可分为有形贸易和无形贸易。有形贸易指的是买卖那些看得见、摸得着的物质性商品的活动；无形贸易指的是因劳务或其他非实物商品进出口而发生的收入与支出。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，以下哪项一定属于有形贸易？（）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.2014<font face=\"宋体\">年上半年，中国液化天然气进口量<\/font><font face=\"Times New Roman\">992.56<\/font><font face=\"宋体\">万吨，同比增长<\/font><font face=\"Times New Roman\">19.06%<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.2011<font face=\"宋体\">年，中国某国际货运集团营业收入<\/font><font face=\"Times New Roman\">1031.13<\/font><font face=\"宋体\">亿元<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">据统计，<\/font><font face=\"Times New Roman\">2014<\/font><font face=\"宋体\">年我国出境游破<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">亿人次，逆差超千亿美元<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">某公司《<\/font><font face=\"Times New Roman\">2010<\/font><font face=\"宋体\">年年度报告》显示，<\/font><font face=\"Times New Roman\">2010<\/font><font face=\"宋体\">年实现海外投资净利润<\/font><font face=\"Times New Roman\">515.6<\/font><font face=\"宋体\">亿美元，全年全球投资收益率达到<\/font><font face=\"Times New Roman\">11.7%<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>A<font face=\"宋体\">【解析】有形贸易定义的关键信息：买卖那些看得见、摸得着的物质性商品的活动。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项货运是一种服务、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项旅游是一种体验、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项是金钱投资，主要业务均不是物质性商品；<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项中的商品液化天然气是物质性商品。故本题选<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "定义判断"}, {"id": "18caf5c42910e729xcpdsc820689", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">随着通信技术的进步，政府执政的舆论环境已发生了明显的变化，各种舆论可以借助网络、短信等方式跨越时空迅速传递，使意见空间加大、力度增强，而决策透明度的增加和公民民主参与意识的增强，又加大了政府的舆论压力。因此政府对<\/font><font face=\"宋体\">“舆情危机”的处理，需要改变以往的被动方式，针对新出现的情况，及时采取新的方式来应对。<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">对这段文字概括最准确的是（）。<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">强调政府在新舆论环境下有必要转变应对方式<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">对比不同时期政府的舆论宣传环境与工作方式<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">剖析政府执政的舆论压力不断增大的外在原因<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">分析通信技术发展与舆论环境变化之间的关系<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】文段第一句告诉我们通信技术对政府的影响，第二句得出结论政府需要如何去做，结论为对策，表达出作者对这件事情的观点，所以重点为果，即政府需要改变以往的被动方式，同义转述答案选择<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42910e72axcyjsc440327", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">①员工一般通过深层扮演和表层扮演这两种方式来实现情绪劳动<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">②情绪劳动是指员工为了给顾客提供更为优质的服务而表达出组织所需情绪的行为<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">③此时员工的情绪体验并没有改变，改变的只是对其服务对象的情绪表达<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">④从本质上来 就是很少有游客真的想当不文明的典型，更没有人想故意去给国家和民族形象抹黑。无论是政府部门，还是旅行社，对文明旅游方面的宣传和提醒基本为<\/font><font face=\"宋体\">“零”，多数游客是无心而为。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">根据这段文字，接下来会说明：（）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">外界对国人形成不文明出游的印象可能存在误解<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">国人能否养成文明出游的习惯与整体国民素质高低有关<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">对不文明旅游行为的谴责和重罚带来的效果只是一时的<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">培养国人文明旅游的意识需要加大宣传教育和引导<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】文段首先指出，以往人们多将国人不文明旅游现象归结为国民素质低，提出的对策不是谴责就是重罚；接着指出中国游客并非故意给国家和民族形象抹黑，大多是无心而为；最后指出原因，政府部门、旅行社没有进行文明旅游的提醒和宣传。故接下来最可能说明的是文明旅游需要加强宣传教育和引导，与此相符的是<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf5c42901a4e9xctxsc322272", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><spa s New Roman';\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">°<\/font><font face=\"宋体\">和第二个图形去同存异（保留各自不同的部分），得到第三个图形；第二行验证此规律成立，第三行应用此规律，通过观察已知图形发现，第二个图形和第三个图形最左边都有一条竖线，因此证明该条竖线并非前两个图的相同部分，即第一个图形整体顺时针旋转<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">90<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">°<\/font><font face=\"宋体\">后最左边不能出现一条竖线。观察四个选项可以看出，<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">三项整体顺时针旋转<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">90<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">°<\/font><font face=\"宋体\">后最左边都有一条竖线，排除。故正确答案为<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf5c42901a4e8xcljsc969635", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">某市电视台推出了一个面向老年观众的养生节目。这个节目在试播时组织了许多老年人观看，获得一致好评。但在正式播出后，收视率非常不理想。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下最能够解释上述矛盾现象的一项是：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">一些老年人认为节目内容对于养生作用不大<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">节目的包装过于娱乐化，与老年人的需求不符<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">看电视时间过长不利于老年人的身体健康<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">节目播出时间过晚，此时大多数老年人已经休息<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】题干要解释的是试播时期的好评与播出后收视率不理想的矛盾，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项说明是由于选择的播出时段不适合老年人观看，从而影响了收视率，解释了这一矛盾；<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">三项均不能解释试播时期的好评。故答案选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf5c42901a4ebxcdysc111345", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">外观设计也被称为工业品外观设计，或者简称为工业设计。它是指关于产品的形状、图案、色彩或者其结合所提出的富有美感并适用于工业上应用的新设计。它具有以下几个特点：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">1<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">外观设计必须以具体的产品为依托。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">2<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">外观设计以产品的形状、图案和色彩等为要素，以美感目的为核心，而不去追求实用目的。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">3<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">外观设计必须适用于工业应用，这里所谓的工业应用就是指该外观设计可以通过工业手段大量复制。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据上述定义，下列各项中属于外观设计的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">设计师专为某世界知名品牌的珠宝设计的绿色三叶草形包装盒<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\" 宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">在军事应用中具有广泛适用性<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">.<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">被各国作为新型电池大力发展<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">.<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">是未来战场动力源的发展方向<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】文段先引出锂离子电池的话题，后文围绕锂离子电池应用的优势和不足展开论述。最后指出未来还需要继续研发锂离子电池满足地面装备的任务需求。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项，根据“不过，对大型地面装备来说锂离子电池功率偏弱是制约其进一步应用的主要因素”可知，锂离子电池在大型装备应用方面存在不足，选项表述正确，当选。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项，根据“对大型地面装备来说锂离子电池功率偏弱是制约其进一步应用的主要因素”可知，锂离子电池在大型地面装备中应用有限，“广泛适用性”范围过大，排除；<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项，根据文段“多国军队都加大了……锂离子电池模块的研发力度”，可知并非“各国”，表述绝对，排除；<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项，文中并未提及“未来战场动力源的发展方向”，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项表述错误，排除。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">故正确答案为<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42910e729xcpdsc969635", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">人们一直梦想着重塑火星气候，使其适合人类居住，科学家提出了各种方法，但都不能实现。现在，来自美国和英国的研究人员提出了一种在局部进行的新方法：在火星表面区域添加一层薄薄的二氧化硅气凝胶。通过建模和实验，研究人员证明，一块<\/font><font face=\"Times New Roman\">2-<\/font><font face=\"宋体\">厘米厚的二氧化硅气凝胶就可以传输足够的可见光用于光合作用，阻挡有害的紫外线辐射，并将其下的温度永久地升高到水的熔点之上，且实现所有这些都不需要任何内部热源。有专家表示，这种使火星宜居的区域方法比改变火星整个大气更容易实现，而且使用的都是现有的材料和技术。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">最适合做这段文字标题的是（）。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">让火星宜居转化为现实还要走多远<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">人类提高火星整体温度的全新尝试<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">二氧化硅气凝胶或让火星变得宜居<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">火星的局部地区性改造需要新思路<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】文段首先指出人们一直梦想着重塑火星气候，使其适合人类居住，但一直不能实现；然后介绍研究人员提出一种在火星局部进行的新方法，即在火星表面区域添加一层薄薄的二氧化硅气凝胶，并对这个新方法的优势展开详细论述；最后专家表示这种方法相对容易实现。由此可知，文段主要说明的是为了使火星气候适宜居住，研究人员提出了重塑火星气候的新方法，即在火星表面区域添加二氧化硅气凝胶，该方法具有较强的可行性。标题应体现这一内容，<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项表述与此一致。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A<font face=\"宋体\">项错误，<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">转化为现实还要走多远<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">文段未提及，且该项未提及关键词<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">二氧化硅气凝胶<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，作为标题不恰当，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B<font face=\"宋体\">项错误，文段介绍的是一种在火星局部进行的新方法，<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">提高火星整体温度<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">与文段内容相悖，作为标题不恰当，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D<font face=\"宋体\">项错误，文段表达的是为了使火星气候适合人类居住，研究人员提出了在局部进行的新方法，而该项并未具体指出这一方法，且其主要强调火星的局部改造需要新思路，未体现<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">适宜人类居住<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">故本题选<\/font>C<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42910e729xcpdsc222337", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">老年人的味觉功能有所减退，常常是食而无味，总喜欢吃口味重的食物来增强食欲，这样无意中就增加了盐的摄入量，盐吃多了会加重肾的负担，可能降低口腔黏膜的屏障作用，增加感冒病毒在上呼吸道生存和扩散的几率。因此，老年人每天的食盐摄入量应控制在<\/font><font face=\"Times New Roman\">5<\/font><font face=\"宋体\">克左右，同时要少吃酱肉和其他咸食。<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">这段文字意在说明：（）。<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">老年人饮食要多加青菜<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">老年人饮食品种要齐全<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">老年人饮食要注意清淡<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">老年人饮食要注意质量<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">【解析】由末句的“食盐摄入量应控制在<\/font><font face=\"Times New Roman\">5<\/font><font face=\"宋体\">克左右，同时要少吃酱肉和其他咸食”可知，文段强调的是饮食要清淡。故本题选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
