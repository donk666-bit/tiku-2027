设计和逻辑实现，后端设计才涉及版图布局与布线。需求分析与规格定义、逻辑综合、RTL代码编写都属于前端设计流程。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507872", "t": 1, "q": "集成电路设计中，“设计规则检查（DRC）”的主要目的是以下哪项?", "a": ["确保芯片的时序性能满足设计约束", "确保版图的物理尺寸（如线宽、线间距、过孔大小）符合制造工艺的要求，避免制造缺陷", "确保芯片的功耗不超过设计指标", "确保版图的逻辑功能与原理图一致", "", ""], "r": "B", "e": "设计规则检查（DRC）主要是对版图物理尺寸等进行检查，保证其符合制造工艺要求，防止制造缺陷。A选项是时序分析目的；C选项是功耗分析相关；D选项是版图与原理图一致性检查目的。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507873", "t": 1, "q": "集成电路设计中，“时序收敛”是后端设计的重要目标，其核心是确保以下哪项要求得到满足?", "a": ["芯片的良率达到预期目标", "芯片的功耗不超过设计指标", "芯片内所有信号的传输延迟满足时序约束（如建立时间、保持时间）", "芯片的面积不超过设计指标", "", ""], "r": "C", "e": "时序收敛核心就是保证芯片内信号传输延迟符合时序约束。A选项良率与信号传输延迟无关；B选项功耗和D选项面积也并非时序收敛核心关注。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507874", "t": 1, "q": "集成电路设计中，“时序约束”的核心内容不包括以下哪项?", "a": ["输入输出延迟（I/O Delay）", "建立时间（Setup Time）和保持时间（Hold Time）", "时钟周期（Clock Period）", "信号的最大扇出数（Maximum Fanout）", "", ""], "r": "D", "e": "时序约束主要针对与时间相关的参数，以确保电路能在规定时间内正确工作。输入输出延迟、建立和保持时间、时钟周期都和时间相关。而信号的最大扇出数是关于逻辑门负载能力的指标，并非时序约束核心内容。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507875", "t": 1, "q": "集成电路设计中，\"时钟树综合（Clock Tree Synthesis, CTS）\"的核心目的是以下哪项?", "a": ["减少芯片的静态功耗", "增加芯片的工作频率", "优化芯片的面积", "确保时钟信号到达所有时序单元（如触发器）的延迟一致（时钟skew最小化）", "", ""], "r": "D", "e": "时钟树综合主要是为了让时钟信号能以相同延迟到达各时序单元，使时钟偏差最小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507876", "t": 1, "q": "集成电路设计中，“物理验证”阶段不包含以下哪项验证内容?", "a": ["逻辑等效性检查（LEC）", "天线效应检查（Antenna Check）", "设计规则检查（DRC）", "版图与原理图一致性检查（LVS）", "", ""], "r": "A", "e": "物理验证主要关注芯片物理版图相关的规则和一致性等。天线效应检查、设计规则检查、版图与原理图一致性检查都属于物理验证范畴。而逻辑等效性检查（LEC）是验证逻辑功能是否一致，不属于物理验证内容。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507877", "t": 1, "q": "集成电路制造工艺中，\"光刻胶\"的作用是以下哪项?", "a": ["作为掩膜版，阻挡紫外光照射晶圆", "在晶圆表面形成导电层，用于后续金属化", "作为光敏材料，在紫外光照射下发生化学变化，实现图形转移", "保护晶圆表面免受离子注入的损伤", "", ""], "r": "C", "e": "光刻胶是一种光敏材料，在紫外光照射下会发生化学变化，通过显影等操作能将掩膜版上的图形转移到晶圆上。A选项掩膜版和光刻胶功能不同；B选项光刻胶不用于形成导电层；D选项光刻胶并非用于保护晶圆免受离子注入损伤。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507878", "t": 1, "q": "集成电路制造工艺中，\"化学机械抛光（CMP）\"工序的主要作用是以下哪项?", "a": ["对晶圆进行清洗以去除杂质", "去除晶圆表面的光刻胶", "使晶圆表面或金属互连层达到全局平坦化", "在晶圆表面生长氧化硅层", "", ""], "r": "C", "e": "化学机械抛光（CMP）是一种结合化学腐蚀和机械磨削的抛光方法，在集成电路制造工艺中有着特定的作用。我们来看每个选项：A. 对晶圆进行清洗以去除杂质 - 这不是CMP的主要目的。虽然过程中可能有清洗的效果，但主要目标并非清洗杂质。B. 去除晶圆表面的光刻胶 - 这也不是CMP的主要功能。光刻胶的去除通常在其他工艺步骤中进行。C. 使晶圆表面或金属互连层达到全局平坦化 - 这是CMP的关键作用。在集成电路制造中，为了确保芯片上的多层结构能够精确对准和良好接触，需要CMP来平坦化晶圆表面或金属互连层。D. 在晶圆表面生长氧化硅层 - 这与CMP无关。生长氧化硅层是其他工艺步骤，如热氧化等。综上所述，CMP的主要作用是使晶圆表面或金属互连层达到全局平坦化，以确保集成电路的精确制造。所以，正确答案是C：“使晶圆表面或金属互连层达到全局平坦化”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507879", "t": 1, "q": "集成电路制造工艺中，“金属化”工序的主要作用是以下哪项?", "a": ["在芯片表面形成引脚，实现芯片与外部电路的连接", "在晶圆表面形成半导体器件的有源区", "为芯片提供机械保护", "形成芯片内部的金属互连线路，实现不同器件间的电连接", "", ""], "r": "D", "e": "金属化工序主要就是在芯片内部形成金属互连线路，让不同器件能实现电连接。A选项形成引脚不是金属化工序主要作用；B选项形成有源区和金属化工序无关；C选项提供机械保护也不是金属化的作用。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507880", "t": 1, "q": "集成电路制造中，“后端布线”工序分为“全局布线”和“详细布线”，以下哪项属于“详细布线”的工作内容?", "a": ["构建时钟信号的传输树，优化时钟skew", "检查版图与原理图的一致性", "将全局布线规划的路径细化为具体的金属导线，确保满足最小线宽、线间距等设计规则", "规划芯片内主要功能模块的位置和互连路径的大致走向", "", ""], "r": "C", "e": "详细布线是在全局布线基础上，把路径细化为具体导线并满足设计规则。A是时钟信号处理，B是版图与原理图检查，D是全局布线中规划模块位置和大致走向。C将全局布线路径细化为具体金属导线并确保符合设计规则，属于详细布线内容。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507881", "t": 1, "q": "集成电路制造中，\"化学气相沉积（CVD）\"工艺的主要目的是以下哪项?", "a": ["将晶圆表面的薄膜刻蚀成特定图形", "在晶圆表面沉积薄膜（如多晶硅、氮化硅、金属层）", "对晶圆进行掺杂以形成PN结", "去除晶圆表面的氧化层", "", ""], "r": "B", "e": "化学气相沉积（CVD）是利用气态物质在固体表面进行化学反应，生成固态沉积物，也就是在晶圆表面沉积薄膜。A选项刻蚀是另一工艺；C选项掺杂有专门的掺杂工艺；D选项去除氧化层有对应的清洗等工艺。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507882", "t": 1, "q": "集成电路制造中，“扩散工艺”与“离子注入工艺”相比，最显著的特点是以下哪项?", "a": ["掺杂浓度更高", "掺杂深度更深且均匀性更好", "可实现更精确的局部掺杂", "掺杂过程中晶圆温度更低", "", ""], "r": "B", "e": "扩散工艺靠热运动使杂质原子进入半导体，能形成较深且均匀的掺杂层；离子注入虽可精确局部掺杂，但掺杂深度浅。选项A，离子注入浓度也可高；选项C是离子注入优点；选项D，扩散需高温。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507883", "t": 1, "q": "集成电路制造中，\"离子注入\"工序的主要目的是以下哪项?", "a": ["去除晶圆表面的污染物", "向晶圆特定区域注入杂质离子，精确控制掺杂浓度和深度", "在晶圆表面形成金属互连层", "在晶圆表面形成绝缘层", "", ""], "r": "B", "e": "离子注入就是向晶圆特定区域注入杂质离子，能精准控制掺杂浓度和深度。A选项去除污染物不是离子注入目的；C选项形成金属互连层与离子注入无关；D选项形成绝缘层也并非离子注入的主要目的。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507884", "t": 1, "q": "集成电路制造中，\"浅沟槽隔离（STI）\"工艺的主要作用是以下哪项?", "a": ["隔离芯片内相邻的半导体器件（如晶体管），防止漏电", "实现不同金属层之间的电连接", "提高半导体器件的开关速度", "在晶圆表面形成氧化层以保护器件", "", ""], "r": "A", "e": "答案：A浅沟槽隔离（STI）工艺的主要作用是在集成电路制造中隔离芯片内相邻的半导体器件（如晶体管），防止漏电。", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507885", "t": 1, "q": "集成电路制造中，\"铜互连工艺\"相比传统的\"铝互连工艺\"，最显著的优势是以下哪项?", "a": ["铜的电阻率更低，可降低互连延迟和功耗", "铜的熔点更高，适合更高温度的制造工艺", "铜与光刻胶的兼容性更好", "铜的抗电迁移能力更弱", "", ""], "r": "A", "e": "在集成电路中，降低互连延迟和功耗很重要，铜电阻率低于铝，能显著降低互连线电阻，进而降低互连延迟和功耗，这是铜互连工艺最显著优势。答案选A。综上，答案为A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507886", "t": 1, "q": "集成电路制造中，\"掩膜版\"的主要作用是以下哪项?", "a": ["在离子注入过程中，阻挡杂质离子进入晶圆的特定区域", "在光刻过程中，作为图形模板，控制紫外光照射晶圆的区域", "保护晶圆表面免受化学腐蚀", "作为晶圆切割的定位模板", "", ""], "r": "B", "e": "“掩膜版”是光刻工艺的关键部件，光刻时它像图形模板，控制紫外光照射晶圆区域来实现图形转移。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507887", "t": 1, "q": "集成电路制造中，“氧化工艺”的主要目的是以下哪项?", "a": ["将晶圆表面的硅材料转换为其他半导体材料（如锗）", "在晶圆表面形成金属层，用于互连", "在晶圆表面形成氧化硅（SiO2）层，作为绝缘层、掩蔽层或器件的栅极绝缘层", "去除晶圆表面的杂质和污染物", "", ""], "r": "C", "e": "氧化工艺是在晶圆表面把硅氧化成氧化硅（SiO₂），其氧化硅层可作绝缘、掩蔽层或器件栅极绝缘层。A选项不是转换为锗；B选项形成金属层不是氧化工艺目的；D选项去除杂质和污染物不是氧化工艺主要目的。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803839097507888", "t": 1, "q": "某光电探测器在可见光范围内响应度较高，且需要外加反向偏压才能正常工作，该探测器最可能是以下哪种类型?", "a": ["雪崩光电二极管（APD）", "光电导探测器", "热释电探测器", "光伏探测器（无偏压型）", "", ""], "r": "A", "e": "雪崩光电二极管（APD）需外加较高反向偏压，在可见光范围响应度高；光电导探测器工作无需反向偏压；热释电探测器是基于热效应，与反向偏压和可见光响应特点不符；光伏探测器（无偏压型）不用外加反向偏压。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647872", "t": 2, "q": "半导体材料的\"禁带宽度\"会影响以下哪些器件特性?", "a": ["器件的最高工作温度", "半导体器件的导电类型（N型或P型）", "光电探测器的响应波长范围", "二极管的正向导通电压", "", ""], "r": "ACD", "e": "禁带宽度影响载流子激发，与器件最高工作温度、光电探测器响应波长范围、二极管正向导通电压相关；而导电类型由杂质决定。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647873", "t": 2, "q": "半导体功率器件的额定电流是其选型的关键，以下哪些因素会影响功率器件的额定电流?", "a": ["器件的反向击穿电压", "器件的导电面积（电流通道面积）", "器件的散热能力", "器件的导通电阻", "", ""], "r": "BCD", "e": "导电面积大利于电流通过可影响额定电流；散热能力好能承受更大电流；导通电阻小，发热少也能影响额定电流承载能力。而反向击穿电压与额定电流并无直接关联。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647874", "t": 2, "q": "半导体功率器件的散热设计至关重要，以下哪些措施可有效提高功率半导体器件的散热能力?", "a": ["采用铜基散热器（导热系数高）", "减小器件的工作电流", "在器件与散热器间涂抹导热硅脂", "增大器件的散热面积", "", ""], "r": "ACD", "e": "A选项铜基散热器导热系数高利于散热；C选项导热硅脂可填充间隙增强热传导；D选项增大散热面积能加快热量散发。B选项减小工作电流是减少产热而非提高散热能力。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647875", "t": 2, "q": "半导体功率器件需承受高压、大电流，其结构设计与小信号器件有显著差异，以下哪些结构特点是功率MOSFET特有的?", "a": ["漂移区（低掺杂N区）", "栅极氧化层加厚", "源极、漏极位于晶圆同一表面", "垂直导电结构", "", ""], "r": "ACD", "e": "功率MOSFET（金属氧化物半导体场效应晶体管）在设计上确实与小信号器件有显著的不同，主要是为了承受更高的电压和更大的电流。以下是对各个选项的A. 漂移区（低掺杂N区）：这是功率MOSFET的一个特有结构，主要用于提高耐压能力。通过增加漂移区的长度，可以有效降低电场强度，从而提高器件的耐压性能。B. 栅极氧化层加厚：这并不是功率MOSFET特有的结构特点。栅极氧化层的厚度主要取决于器件的工作电压和工作频率，小信号器件和高压器件都可能需要加厚的栅极氧化层。C. 源极、漏极位于晶圆同一表面：这是功率MOSFET的一个显著特点，尤其是在横向双扩散MOSFET（LDMOS）中。这种结构有助于减小器件的导通电阻，提高功率密度。D. 垂直导电结构：这也是功率MOSFET的一个重要特点，尤其是在垂直双扩散MOSFET（VDMOS）中。垂直导电结构可以有效减小导通电阻，提高功率处理能力。综上所述，功率MOSFET特有的结构特点是A.漂移区（低掺杂N区）、C.源极、漏极位于晶圆同一表面和D.垂直导电结构。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647876", "t": 2, "q": "半导体双极结型晶体管（BJT）的电流放大系数β是重要参数，以下哪些因素会导致BJT的β值发生变化?", "a": ["发射结正向偏置电压的变化", "集电极电流IC的变化", "工作温度的变化", "基极电流IB的变化", "", ""], "r": "AC", "e": "半导体双极结型晶体管（BJT）的电流放大系数β描述了基极电流变化时集电极电流如何相应地成比例变化。以下是对各选项的简要分析：A. 发射结正向偏置电压的变化：发射结的偏置电压直接影响基区的载流子注入效率，从而影响电流放大系数。因此，这个因素会导致BJT的β值发生变化。B. 集电极电流IC的变化：集电极电流的变化是BJT放大作用的结果，而不是导致β值变化的原因。但值得注意的是，在某些情况下，如集电极电流过大可能导致器件进入非线性区域，间接影响β值。然而，此选项表述的是集电极电流本身的变化，并不直接导致β变化。C. 工作温度的变化：温度会影响半导体材料的载流子迁移率和寿命，从而影响BJT的电流放大系数。因此，工作温度的变化会导致BJT的β值发生变化。D. 基极电流IB的变化：基极电流是控制BJT工作状态的基础，但其本身的变化并不导致β值的变化。β值是描述在基极电流单位变化时集电极电流如何变化的参数，因此基极电流的变化是β值定义的一部分，而不是导致其变化的原因。综上所述，发射结正向偏置电压的变化和工作温度的变化是导致BJT的β值发生变化的因素。所以，正确答案是AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647877", "t": 2, "q": "半导体双极结型晶体管（BJT）的反向击穿包括多种类型，以下哪些属于BJT的反向击穿类型，且击穿后器件可能永久损坏?", "a": ["热击穿", "二次击穿", "雪崩击穿", "齐纳击穿", "", ""], "r": "AB", "e": "热击穿和二次击穿会使器件永久损坏，雪崩击穿和齐纳击穿一般是可逆的，不造成永久损坏。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647878", "t": 2, "q": "半导体双极结型晶体管（BJT）的频率特性是其高频应用的关键，以下哪些参数可用于评价BJT的高频性能?", "a": ["最大振荡频率（fmax，器件可振荡的最高频率）", "特征频率（fT，电流增益β=1时的频率）", "静态电流放大系数（β0，低频电流增益）", "截止频率（fβ，电流增益β下降到低频值0.707倍时的频率）", "", ""], "r": "ABD", "e": "最大振荡频率、特征频率和截止频率都与BJT高频下工作特性相关，可用于评价高频性能；静态电流放大系数是低频下特性，与高频性能无关。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647879", "t": 2, "q": "半导体双极结型晶体管（BJT）工作在放大区时，需满足以下哪些条件?", "a": ["集电结反向偏置", "发射结正向偏置", "集电极电流IC与基极电流IB成正比（IC=βIB）", "基极电流IB>0", "", ""], "r": "ABCD", "e": "BJT工作在放大区需发射结正偏、集电结反偏，且集电极电流与基极电流成β倍关系，基极电流大于0也需满足，ABCD四个条件都符合放大区要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647880", "t": 2, "q": "半导体MOSFET存在不同工作区域，其工作区域的划分与栅源电压（VGS）、漏源电压（VDS）相关，以下哪些条件可使N沟道增强型MOSFET工作在饱和区?", "a": ["VGS<阈值电压Vth", "VGS>阈值电压Vth", "VDS<VGS-Vth", "VDS≥VGS-Vth", "", ""], "r": "BD", "e": "N沟道增强型MOSFET工作在饱和区需满足两个条件，一是VGS大于阈值电压Vth以形成导电沟道，二是VDS大于等于VGS - Vth。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647881", "t": 2, "q": "半导体MOSFET的导通电阻（Ron）会影响其开关损耗，以下哪些因素会导致MOSFET的导通电阻增大?", "a": ["栅极氧化层厚度（tox）增大", "栅源电压（VGS）减小（仍大于Vth）", "沟道宽度（W）增大", "沟道长度（L）增大", "", ""], "r": "ABD", "e": "MOSFET导通电阻Ron与栅极氧化层厚度、栅源电压、沟道宽度和长度有关。tox增大、VGS减小、L增大使Ron增大，W增大使Ron减小。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647882", "t": 2, "q": "半导体MOSFET的沟道类型（N沟道或P沟道）由哪些因素决定?", "a": ["栅极材料的功函数", "源极和漏极的掺杂类型（N型或P型）", "衬底的掺杂类型（N型或P型）", "栅源电压的极性", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647883", "t": 2, "q": "半导体MOSFET的开关速度是其数字应用的关键，以下哪些措施可提高MOSFET的开关速度?", "a": ["减小沟道长度（L）", "增大漏源电压（VDS）", "增大栅源驱动电压（VGS）", "减小栅极电容（Cgs、Cgd）", "", ""], "r": "ACD", "e": "减小沟道长度能缩短载流子传输时间，增大栅源驱动电压可加快载流子迁移，减小栅极电容能减少充放电时间，都有助于提高开关速度；而增大漏源电压对开关速度提升作用不大。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647884", "t": 2, "q": "半导体MOSFET的性能参数中，以下哪些参数会影响其开关速度和高频特性?", "a": ["导通电阻Ron", "栅极电容Cgs、Cgd", "沟道长度调制系数λ", "阈值电压Vth", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647885", "t": 2, "q": "半导体MOSFET的阈值电压（Vth）是其核心参数，以下哪些因素会影响MOSFET的阈值电压?", "a": ["衬底的掺杂浓度（NA/ND）", "栅极氧化层的厚度（tox）", "工作温度", "栅极材料的功函数（Φm）", "", ""], "r": "ABCD", "e": "衬底掺杂浓度、栅极氧化层厚度、工作温度、栅极材料功函数都会改变半导体MOSFET内部电学特性从而影响阈值电压。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647886", "t": 2, "q": "半导体PN结的单向导电性是其核心特性，以下哪些物理过程是PN结单向导电的本质原因?", "a": ["正向偏置时，内电场削弱，载流子扩散运动主导", "反向偏置时，少数载流子少量越过结区", "正向偏置时，多数载流子大量越过结区", "反向偏置时，内电场增强，载流子漂移运动主导", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647887", "t": 2, "q": "半导体PN结的电容会影响器件的高频响应，以下哪些条件会导致PN结的总电容增大?", "a": ["反向偏置电压增大", "半导体材料的介电常数增大", "PN结的面积增大", "正向偏置电压增大", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647888", "t": 2, "q": "半导体PN结的电容效应会影响器件的高频特性，PN结的总电容主要由以下哪些部分组成?", "a": ["寄生电容（CP）", "势垒电容（CB）", "扩散电容（CD）", "氧化层电容（COX）", "", ""], "r": "BC", "e": "PN结总电容主要由势垒电容和扩散电容组成。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647889", "t": 2, "q": "半导体PN结的反向击穿电压是器件耐压的关键指标，以下哪些因素会提高PN结的反向击穿电压?", "a": ["降低PN结的掺杂浓度（特别是低掺杂区）", "增加PN结的结深", "减小PN结的面积", "采用异质结结构（如GaAlAs/GaAs）", "", ""], "r": "AD", "e": "降低低掺杂区掺杂浓度，耗尽层变宽，击穿电压提高；结深一般不直接影响击穿电压；结面积大小与击穿电压无直接关联；异质结结构能优化电场分布等提高击穿电压。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647890", "t": 2, "q": "半导体PN结的光生伏特效应可用于多种应用，以下哪些器件基于光生伏特效应工作?", "a": ["光伏电池", "光电导探测器", "光电池（用于光强测量）", "零偏置PIN光电二极管（用于光电压探测）", "", ""], "r": "ACD", "e": "光生伏特效应是指半导体在受到光照射时产生电动势的现象。光伏电池是将光能转化为电能，靠光生伏特效应工作；用于光强测量的光电池，也是基于光照产生电压来反映光强，利用光生伏特效应；零偏置PIN光电二极管用于光电压探测，同样依靠光生伏特效应产生电压。而光电导探测器是基于半导体材料的光电导效应，即光照下材料电导率改变实现探测。所以基于光生伏特效应工作的是A、C、D。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647891", "t": 2, "q": "半导体PN结的温度特性会影响器件稳定性，以下哪些参数会随温度升高而增大?", "a": ["正向漏电流（正向偏置时的微小电流）", "反向击穿电压（齐纳击穿型）", "反向漏电流（反向偏置时的微小电流）", "正向导通电压", "", ""], "r": "AC", "e": "温度升高，半导体中载流子运动加剧。正向漏电流和反向漏电流都会因热激发产生更多载流子而增大；齐纳击穿型反向击穿电压随温度升高而减小；正向导通电压随温度升高而降低。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647892", "t": 2, "q": "半导体PN结的正向导通电压具有温度依赖性，以下哪些现象与PN结正向导通电压的负温度系数相关?", "a": ["硅稳压管（齐纳击穿型）的稳压值随温度升高而减小", "硅二极管正向导通电压随温度升高而减小（约-2mV/℃）", "发光二极管（LED）的发光强度随温度升高而降低", "半导体激光器的阈值电流随温度升高而增大", "", ""], "r": "AB", "e": "首先，我们来理解题目中的关键概念。PN结的正向导通电压具有负温度系数，意味着随着温度的升高，正向导通电压会减小。这是半导体材料的一个基本特性。现在，我们逐一分析每个选项与这一特性的关系：A. 硅稳压管（齐纳击穿型）的稳压值实际上是与PN结的正向导通电压相关的。当温度升高时，由于正向导通电压的减小，硅稳压管的稳压值也会随之减小。因此，这个现象与PN结正向导通电压的负温度系数直接相关。B. 硅二极管正向导通电压随温度升高而减小，这正是负温度系数的直接体现。所以，这个选项也是正确的。C. 发光二极管（LED）的发光强度随温度升高而降低，这主要是因为温度升高会导致半导体材料的能级结构发生变化，进而影响发光效率。虽然这个现象与温度有关，但它并不直接反映PN结正向导通电压的负温度系数。D. 半导体激光器的阈值电流随温度升高而增大，这主要是因为温度升高会导致半导体材料的载流子浓度增加，从而需要更大的电流才能达到激光发射的阈值。这个现象同样与温度有关，但同样不直接反映PN结正向导通电压的负温度系数。综上所述，与PN结正向导通电压的负温度系数直接相关的现象是A和B两个选项。所以，正确答案是AB。", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647893", "t": 2, "q": "半导体PN结的正向电流由多种成分组成，以下哪些属于PN结正向电流的组成部分?", "a": ["漂移电流（少数载流子漂移形成）", "扩散电流（多数载流子扩散形成）", "隧道电流（重掺杂时量子隧道效应形成）", "复合电流（载流子在结区复合形成）", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647894", "t": 2, "q": "半导体PN结的正向伏安特性具有以下哪些特点（忽略串联电阻影响）?", "a": ["正向偏置电压增大时，正向电流与电压呈线性关系", "正向偏置电压较小时，正向电流很小（死区）", "正向偏置时，反向电流随电压增大而显著增大", "正向偏置电压超过死区电压后，正向电流随电压指数增长", "", ""], "r": "BD", "e": "PN结正向偏置电压较小时，电流极小即存在死区；超过死区电压后，电流随电压指数增长。正向电流与电压并非线性关系，正向偏置时反向电流极小且基本不随正向电压变化。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647895", "t": 2, "q": "光电探测器的暗电流会影响其探测灵敏度，以下哪些措施可有效降低光电探测器的暗电流?", "a": ["增大探测器的反向偏置电压", "减小探测器的受光面积", "降低探测器的工作温度", "选择本征载流子浓度低的半导体材料", "", ""], "r": "CD", "e": "暗电流主要由热激发产生的载流子形成。降低温度可减少热激发，选择本征载流子浓度低的材料也能减少暗电流。增大反向偏置电压会增大暗电流；减小受光面积对暗电流无直接影响。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647896", "t": 2, "q": "光电探测器的响应度是重要性能指标，以下哪些因素会影响光电探测器的响应度?", "a": ["入射光的强度", "探测器的反向偏置电压", "入射光的波长", "探测器的量子效率", "", ""], "r": "ABCD", "e": "答案：ABCD光电探测器的响应度受多个因素影响：A. 入射光的强度直接影响光电流的大小，从而影响响应度。B. 探测器的反向偏置电压会改变其内部电场，影响载流子的收集效率，进而影响响应度。C. 不同波长的光对应不同的光电转换效率，因此入射光的波长会影响响应度。D. 量子效率是描述探测器将入射光子转换为电子的效率，显然直接影响响应度。", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647897", "t": 2, "q": "光电探测器的响应速度是衡量其高频性能的关键指标，以下哪些因素会显著影响光电探测器的响应速度?", "a": ["探测器的半导体材料（载流子迁移率）", "探测器的结电容大小", "入射光的强度大小", "探测器的反向偏置电压大小", "", ""], "r": "ABD", "e": "载流子迁移率影响载流子运动速度，影响响应速度；结电容会影响充放电时间从而影响响应；反向偏置电压会改变耗尽层宽度等影响载流子运动，也影响响应。而入射光强度主要影响光电流大小，对响应速度无显著影响。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647898", "t": 2, "q": "集成电路光刻工艺的质量直接影响电路图形的精度，以下哪些参数是光刻工艺中需严格控制的关键指标?", "a": ["图形的线宽精度", "光刻胶的灵敏度", "晶圆的掺杂浓度", "图形的套刻精度", "", ""], "r": "ABD", "e": "光刻工艺主要是将掩膜版上的图形转移到晶圆上，线宽精度和套刻精度直接关乎电路图形精度；光刻胶灵敏度影响光刻效率和质量。而晶圆掺杂浓度是在其他工艺环节控制，并非光刻工艺关键指标。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647899", "t": 2, "q": "集成电路后端设计阶段需完成多项关键工作，以确保芯片物理实现满足设计要求，以下哪些属于后端设计的核心步骤?", "a": ["逻辑综合（Logic Synthesis）", "布局规划（Floorplan）", "详细布线（Detailed Routing）", "时钟树综合（CTS）", "", ""], "r": "BCD", "e": "逻辑综合是前端设计步骤，布局规划、详细布线、时钟树综合是后端设计核心步骤。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647900", "t": 2, "q": "集成电路设计中，低功耗设计需从多个层面入手，以下哪些属于集成电路低功耗设计的常用技术?", "a": ["静态CMOS逻辑设计（仅开关时消耗动态功耗）", "多电压域设计（不同模块采用不同供电电压）", "时钟门控（Clock Gating，关闭空闲模块时钟）", "增加器件尺寸以降低电流密度", "", ""], "r": "ABC", "e": "A选项静态CMOS仅开关时有动态功耗，利于降低功耗；B选项多电压域设计按需供压可节能；C选项时钟门控关闭空闲模块时钟能减少不必要功耗；而D选项增加器件尺寸通常会增加面积和功耗。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647901", "t": 2, "q": "集成电路设计中，静态时序分析（STA）需检查多种时序路径，以确保芯片时序收敛，以下哪些属于STA中需分析的关键时序路径?", "a": ["触发器时钟端到输出端口（C2O）", "触发器时钟端到数据端（C2D，寄存器到寄存器）", "输入端口到输出端口（I2O，组合逻辑路径）", "输入端口到触发器数据端（I2D）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647902", "t": 2, "q": "集成电路设计中，逻辑等效性检查（LEC）是确保设计一致性的重要步骤，以下哪些场景下需要进行LEC检查?", "a": ["详细布线后（布局后网表与布线后网表一致性）", "逻辑综合后（RTL代码与门级网表一致性）", "时序仿真后（仿真结果与设计规格一致性）", "布局规划后（门级网表与布局后网表一致性）", "", ""], "r": "ABD", "e": "逻辑等效性检查（LEC）主要是检查不同阶段设计表示的逻辑是否一致。选项A、B、D都是不同阶段网表或代码间逻辑一致性检查，符合LEC应用场景；而C是仿真结果与设计规格一致性，并非逻辑等效性检查范畴。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647903", "t": 2, "q": "集成电路设计中，时序约束的设置需结合芯片应用需求，以下哪些属于常见的时序约束类型?", "a": ["建立时间约束（Setup Time，数据提前稳定时间）", "面积约束（Area Constraint，芯片最大面积）", "时钟周期约束（Clock Period，定义时钟频率）", "保持时间约束（Hold Time，数据延迟稳定时间）", "", ""], "r": "ACD", "e": "常见的时序约束类型主要围绕时间和时钟相关，建立时间约束、时钟周期约束、保持时间约束都与芯片时序相关，而面积约束主要是对芯片物理面积的限制，不属于时序约束类型。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647904", "t": 2, "q": "集成电路设计中，时钟树综合（CTS）的目标是优化时钟信号传输，以下哪些是CTS的核心优化目标?", "a": ["最小化时钟skew（时钟到达不同触发器的时延差异）", "最大化时钟频率", "最小化时钟latency（时钟从源端到触发器的总时延）", "最小化时钟树的功耗", "", ""], "r": "ACD", "e": "时钟树综合主要是为让时钟信号能更好传输，最小化时钟skew可确保不同触发器在相近时间接收到时钟信号，保证电路同步；最小化时钟latency能减少传输总时延；最小化时钟树功耗可降低能耗。而最大化时钟频率不是CTS核心目标。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647905", "t": 2, "q": "集成电路设计中，以下哪些措施可有效降低芯片的静态功耗（待机功耗）?", "a": ["降低芯片的工作电压", "关闭空闲模块的电源（Power Gating）", "减少时钟树的缓冲器数量", "采用高阈值电压（High-Vth）器件", "", ""], "r": "BD", "e": "A选项降低工作电压主要降低动态功耗；B选项关闭空闲模块电源，能切断其静态电流，降低静态功耗；C选项减少时钟树缓冲器数量主要影响动态功耗；D选项高阈值电压器件漏电小，可降低静态功耗。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647906", "t": 2, "q": "集成电路设计中，以下哪些属于\"前端设计\"的核心步骤，主要关注逻辑功能实现?", "a": ["详细布线（实现物理互连）", "功能仿真（验证逻辑正确性）", "RTL代码编写（寄存器传输级描述）", "逻辑综合（转换为门级网表）", "", ""], "r": "BCD", "e": "前端设计聚焦逻辑功能实现。功能仿真用于验证逻辑正确性，RTL代码编写是进行寄存器传输级描述，逻辑综合将其转换为门级网表，这三者都围绕逻辑功能。而详细布线是物理层面互连，属于后端设计。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647907", "t": 2, "q": "集成电路设计中，以下哪些属于\"设计规则\"的内容，用于确保版图可制造?", "a": ["最小线间距（相邻导线的最小距离）", "最小线宽（导线的最小宽度）", "最小过孔尺寸（过孔的最小直径）", "最大时钟频率（芯片的最高工作频率）", "", ""], "r": "ABC", "e": "设计规则是为确保版图可制造而对版图几何图形的限制。A最小线间距、B最小线宽、C最小过孔尺寸都属于版图几何图形相关的限制内容。而最大时钟频率是芯片性能方面的指标，与版图可制造性的设计规则无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647908", "t": 2, "q": "集成电路设计中，以下哪些属于\"物理综合\"（Physical Synthesis）的工作内容，结合物理信息优化设计?", "a": ["考虑寄生电容影响优化时序", "基于布局信息调整门级网表", "基于布线资源优化门的位置", "RTL代码的语法检查", "", ""], "r": "ABC", "e": "物理综合要结合物理信息优化设计。A考虑寄生电容影响优化时序，寄生电容是物理因素；B基于布局信息调整门级网表，布局信息是物理相关；C基于布线资源优化门的位置，布线资源属于物理范畴。而D的RTL代码语法检查主要是代码层面，和物理信息无关。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647909", "t": 2, "q": "集成电路设计中，以下哪些验证工作属于\"物理验证\"，用于确保版图可制造且性能达标?", "a": ["天线效应检查", "版图与原理图一致性检查（LVS）", "逻辑等效性检查（LEC）", "设计规则检查（DRC）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647910", "t": 2, "q": "集成电路制造工艺中，以下哪些工序属于\"前道工艺\"(Front-End-of-Line,FEOL)，主要用于形成半导体器件的有源区?", "a": ["金属化工艺", "离子注入工艺", "氧化工序", "光刻工艺（用于器件图形定义）", "", ""], "r": "BCD", "e": "前道工艺主要是形成半导体器件有源区。离子注入是精确控制杂质浓度和分布形成有源区；氧化工序为后续工艺提供氧化层基础；光刻用于定义器件图形。而金属化工艺是后道工艺用于连接器件。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647911", "t": 2, "q": "集成电路制造中，光刻工艺的分辨率是关键指标，以下哪些措施可提高光刻工艺的分辨率?", "a": ["采用分辨率增强技术（如光学邻近校正OPC）", "增大数值孔径（NA）的透镜系统", "减小光刻胶的厚度", "减小曝光光源的波长（如从紫外到深紫外）", "", ""], "r": "ABD", "e": "分辨率增强技术（如OPC）可校正光刻图形误差提高分辨率；增大数值孔径（NA）能提升分辨率；减小曝光光源波长能使光刻更精细从而提高分辨率；而减小光刻胶厚度主要影响光刻的其他性能而非直接提高分辨率。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647912", "t": 2, "q": "集成电路制造中，光刻工艺需使用多种材料，以下哪些材料是光刻工艺的核心耗材?", "a": ["显影液", "掩膜版", "掺杂离子源", "光刻胶", "", ""], "r": "ABD", "e": "光刻工艺是集成电路制造的关键步骤，核心耗材是直接参与光刻成像过程的材料。显影液用于显影光刻胶，掩膜版决定光刻图形，光刻胶是光刻成像的基础材料，它们都是光刻工艺核心耗材。而掺杂离子源主要用于离子注入工艺，并非光刻核心耗材。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647913", "t": 2, "q": "集成电路制造中，后端物理验证需覆盖多种潜在问题，以下哪些属于物理验证的内容?", "a": ["设计规则检查（DRC，如线宽、线间距违规）", "逻辑功能仿真（Functional Simulation）", "静电放电（ESD）防护检查", "天线效应检查（Antenna Effect，避免等离子体损伤）", "", ""], "r": "ACD", "e": "物理验证主要针对集成电路物理设计方面的检查。A项设计规则检查是对版图设计是否符合规则进行验证；C项静电放电防护检查是确保电路有良好的静电防护；D项天线效应检查可避免等离子体损伤。而B项逻辑功能仿真是对电路逻辑功能的验证，不属于物理验证内容。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647914", "t": 2, "q": "集成电路制造中，化学机械抛光（CMP）工艺常用于晶圆表面平坦化，以下哪些层的制备过程中需要使用CMP工艺?", "a": ["晶圆衬底的初始表面", "金属互连的铜布线层", "MOSFET的栅极氧化层", "浅沟槽隔离（STI）的氧化硅填充层", "", ""], "r": "BD", "e": "CMP用于使晶圆表面平坦，金属互连铜布线层沉积后需CMP实现平坦化；浅沟槽隔离的氧化硅填充层填充后表面不平整，也需CMP。晶圆衬底初始表面一般通过其他方式处理；MOSFET栅极氧化层主要关注厚度和质量，非CMP重点。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647915", "t": 2, "q": "集成电路制造中，金属化工艺用于形成器件间的互连，以下哪些金属材料可用于集成电路的互连层?", "a": ["铜（Cu）", "钨（W）", "铝（Al）", "金（Au）", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647916", "t": 2, "q": "集成电路制造中，离子注入工艺是实现精确掺杂的关键步骤，以下哪些参数是离子注入工艺中需精确控制的?", "a": ["注入离子的剂量", "晶圆的旋转速度", "注入离子的能量", "注入离子的种类（如硼、磷、砷）", "", ""], "r": "ACD", "e": "离子注入工艺需精确控制注入离子的剂量、能量和种类，以实现精确掺杂，晶圆旋转速度并非关键控制参数。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647917", "t": 2, "q": "集成电路制造中，以下哪些工序属于\"后道工艺\"（Back-End-of-Line,BEOL），主要用于形成器件间的互连?", "a": ["化学机械抛光（CMP，平坦化金属层）", "光刻工艺（定义互连图形）", "金属化工艺（沉积金属层）", "离子注入工艺（形成有源区）", "", ""], "r": "ABC", "e": "后道工艺主要是形成器件间互连。离子注入形成有源区是前道工艺，D 不符合。化学机械抛光用于平坦化金属层、光刻定义互连图形、金属化工艺沉积金属层，都与互连形成相关，属于后道工艺。答案是ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647918", "t": 2, "q": "集成电路制造中，以下哪些工艺步骤可用于\"去除晶圆表面的光刻胶\"?", "a": ["干法刻蚀工艺", "湿法腐蚀工艺（使用光刻胶剥离液）", "灰化工艺（等离子体处理）", "化学机械抛光（CMP）工艺", "", ""], "r": "BC", "e": "在集成电路制造中，去除晶圆表面的光刻胶通常涉及特定的工艺步骤。以下是对各选项的简要A. 干法刻蚀工艺 - 此工艺主要用于通过等离子体或气体束来刻蚀材料，而不是专门用于去除光刻胶。B. 湿法腐蚀工艺（使用光刻胶剥离液） - 这是一种常用的方法，通过特定的化学溶剂（光刻胶剥离液）来溶解并去除光刻胶。C. 灰化工艺（等离子体处理） - 灰化工艺使用等离子体来去除有机物质，包括光刻胶，是另一种有效的去除光刻胶的方法。D. 化学机械抛光（CMP）工艺 - CMP主要用于平坦化晶圆表面，而非专门用于去除光刻胶。综上所述，B和C选项是专门用于去除晶圆表面光刻胶的工艺步骤。所以，正确答案是BC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647919", "t": 2, "q": "集成电路制造中，以下哪些工艺步骤可用于\"形成半导体器件的绝缘层\"?", "a": ["物理气相沉积（PVD，沉积Al）", "化学气相沉积（CVD，沉积Si3N4）", "氧化工艺（生长SiO2）", "浅沟槽隔离（STI，填充SiO2）", "", ""], "r": "BCD", "e": "A选项物理气相沉积Al是沉积金属，不是形成绝缘层；B选项化学气相沉积Si₃N₄、C选项氧化工艺生长SiO₂、D选项浅沟槽隔离填充SiO₂，Si₃N₄和SiO₂都是常见绝缘材料，可用于形成绝缘层。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803842381647920", "t": 2, "q": "集成电路制造中，以下哪些工艺步骤需要使用\"掩膜版\"?", "a": ["离子注入工艺（定义掺杂区域）", "金属化工艺（定义互连图形）", "化学机械抛光（CMP，平坦化）", "光刻工艺（定义器件图形）", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632192", "t": 3, "q": "半导体功率器件的额定电压主要由其PN结的击穿电压决定，击穿电压越高，器件能承受的反向电压越大，额定电压越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "半导体功率器件的额定电压的确主要取决于PN结的击穿电压，击穿电压高意味着能承受更大反向电压，对应额定电压也越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632193", "t": 3, "q": "半导体功率IGBT（绝缘栅双极晶体管）结合了MOSFET的电压控制特性和BJT的大电流特性，因此IGBT具有输入阻抗高、开关速度快、电流承载能力强的优点，适合高压大电流应用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "IGBT确实结合了MOSFET电压控制和BJT大电流特性，具备输入阻抗高、开关速度快、电流承载能力强等优点，常用于高压大电流场景。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632194", "t": 3, "q": "半导体功率MOSFET采用垂直导电结构，其漏极位于晶圆背面，源极和栅极位于正面，可增大电流通道面积，提高电流承载能力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "半导体功率MOSFET垂直导电结构特点就是漏极在晶圆背面，源极和栅极在正面，这种结构能增大电流通道面积，进而提高电流承载能力。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632195", "t": 3, "q": "半导体双极结型晶体管（BJT）的电流放大系数β随集电极电流的增大而单调增大，集电极电流越大，β值越高，电流放大能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BJT的电流放大系数β并非随集电极电流增大而单调增大，在集电极电流较小时β随电流增大而增大，达到一定值后，集电极电流继续增大β会减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632196", "t": 3, "q": "半导体双极结型晶体管（BJT）工作在饱和区时，发射结和集电结均正向偏置，集电极电流随基极电流增大而增大，具有电流放大作用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BJT工作在饱和区时，发射结和集电结均正偏，但此时集电极电流不再随基极电流增大而线性增大，失去电流放大作用。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632197", "t": 3, "q": "半导体BJT的反向饱和电流Is随温度升高而增大，因为温度升高使半导体本征载流子浓度增大，少数载流子数量增多，反向漏电流增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "温度升高时，本征载流子浓度增加，BJT中少数载流子数量增多，反向饱和电流本质是由少数载流子漂移形成，所以反向饱和电流Is会随温度升高而增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632198", "t": 3, "q": "半导体BJT的特征频率fT是指电流放大系数β下降到1时的频率，fT值越高，说明BJT在高频下的电流放大能力越强，越适合高频应用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "特征频率fT是β降至1时的频率，fT越高意味着BJT能在更高频率下保持一定电流放大能力，也就更适合高频应用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632199", "t": 3, "q": "半导体BJT工作在放大区时，集电极电流IC仅由基极电流IB决定（IC=βIB），与集电极电压VCE无关（忽略沟道长度调制效应）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在半导体BJT工作于放大区且忽略沟道长度调制效应时，满足电流分配关系IC = βIB，集电极电流主要由基极电流决定，和集电极电压无关。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632200", "t": 3, "q": "半导体MOSFET的衬底偏置效应（体效应）会使阈值电压增大，当衬底与源极之间加反向偏置电压时，体效应增强，阈值电压进一步升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在半导体MOSFET中，衬底偏置效应（体效应）的确会使阈值电压增大，给衬底与源极间加反向偏置电压，会使耗尽层变宽，体效应增强，阈值电压进一步升高。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632201", "t": 3, "q": "半导体MOSFET的导通电阻随栅源电压的增大而减小，因为栅源电压越大，导电沟道的载流子浓度越高，沟道电阻越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在半导体MOSFET中，栅源电压能控制导电沟道的形成与载流子浓度，电压越大，沟道载流子浓度越高，沟道电阻越小，从而导通电阻减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632202", "t": 3, "q": "半导体MOSFET的沟道长度调制效应是指饱和区中，漏源电压增大使沟道夹断点向源极移动，有效沟道长度减小，导致漏源电流随漏源电压增大而略有增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该描述符合半导体MOSFET沟道长度调制效应的定义。在饱和区，漏源电压增加使夹断点向源极移动，有效沟道长度减小，漏源电流会随漏源电压增大而略有增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632203", "t": 3, "q": "半导体MOSFET的阈值电压是指栅源电压增大到使漏源电流开始显著增大时的栅源电压，与漏源电压无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "MOSFET阈值电压是使半导体表面形成强反型层时的栅源电压，它与漏源电压有关，题干说与漏源电压无关错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632204", "t": 3, "q": "半导体MOSFET的栅极电流极小（近似为零），因为栅极与沟道之间是绝缘的氧化层，无电流通路，属于电压控制电流器件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "MOSFET栅极与沟道间有绝缘氧化层，基本无电流通路，所以栅极电流极小近似为零，且它通过栅源电压控制漏极电流，是电压控制电流器件。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632205", "t": 3, "q": "半导体MOSFET的栅极氧化层厚度越薄，栅极电容Cgs越大，器件的开关速度越快，因为栅极充放电电流更大，充放电时间更短。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632206", "t": 3, "q": "半导体MOSFET工作在饱和区时，漏源电流ID与漏源电压VDS成正比，VDS越大，ID越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "MOSFET工作在饱和区时，漏源电流ID基本不随漏源电压VDS变化，而是由栅源电压VGS等因素决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632207", "t": 3, "q": "半导体MOSFET工作在截止区时，栅源电压小于阈值电压，导电沟道未形成，漏源电流为零（忽略泄漏电流）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "MOSFET截止条件就是栅源电压小于阈值电压，此时导电沟道无法形成，在忽略泄漏电流情况下，漏源间无电流通过。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632208", "t": 3, "q": "半导体PN结的电容效应在高频应用中可以忽略，因为高频信号的周期远小于PN结的充放电时间，电容无法及时充放电，对信号影响极小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "高频信号周期远小于PN结充放电时间时，电容来不及充放电，电容效应会显著影响信号，不能忽略。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632209", "t": 3, "q": "半导体PN结的反向击穿电压是指反向电流开始急剧增大时的反向电压，所有类型的反向击穿（齐纳、雪崩）均为可逆击穿，不会损坏器件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并非所有类型的反向击穿都是可逆的，雪崩击穿通常可逆，但齐纳击穿在电流过大时可能导致器件过热损坏，是不可逆的。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632210", "t": 3, "q": "半导体PN结的反向漏电流主要由少数载流子的漂移形成，温度升高时，少数载流子浓度增大，反向漏电流减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "半导体PN结反向漏电流由少子漂移形成，温度升高，少子浓度增大，反向漏电流应增大而非减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632211", "t": 3, "q": "半导体PN结的光生伏特效应产生的前提是入射光的光子能量必须大于半导体材料的禁带宽度，否则无法激发电子从价带跃迁到导带，无法产生光生载流子。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "只有入射光光子能量大于半导体禁带宽度，才能使电子获得足够能量从价带跃迁到导带，产生光生载流子，进而产生光生伏特效应。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632212", "t": 3, "q": "半导体PN结的光生伏特效应是指光照使PN结产生内建电动势，若将PN结两端短路，会产生光生电流;若开路，则产生光生电压。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "半导体PN结在光照下，光生载流子的运动形成内建电动势，短路时会有光生电流，开路时会产生光生电压，该描述符合光生伏特效应原理。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632213", "t": 3, "q": "半导体PN结的结电容包括势垒电容和扩散电容，正向偏置时势垒电容为主，反向偏置时扩散电容为主。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "半导体PN结正向偏置时扩散电容为主，反向偏置时势垒电容为主，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632214", "t": 3, "q": "半导体PN结的势垒电容可视为平行板电容器，其电容值与空间电荷区的宽度成反比，因此反向偏置电压增大时，空间电荷区变宽，势垒电容减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "半导体PN结势垒电容类似平行板电容器，电容与空间电荷区宽度成反比，反向偏置电压增大，空间电荷区变宽，依据反比关系，势垒电容减小。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632215", "t": 3, "q": "半导体PN结的正向导通电流主要由少数载流子的漂移运动形成，反向漏电流主要由多数载流子的扩散运动形成。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "半导体PN结正向导通电流由多数载流子扩散运动形成，反向漏电流由少数载流子漂移运动形成，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632216", "t": 3, "q": "半导体PN结的正向导通电压具有正温度系数，温度升高时，正向导通电压增大，因为内电场随温度升高而增强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。半导体PN结的正向导通电压具有负温度系数，温度升高时，本征载流子浓度增加，削弱内电场，使正向导通电压减小，并非正向导通电压增大、内电场增强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632217", "t": 3, "q": "半导体PN结的正向电流-电压特性符合欧姆定律，正向电流与正向电压成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "半导体PN结是非线性元件，其正向电流 - 电压特性不遵循欧姆定律，电流与电压不是简单的正比关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632218", "t": 3, "q": "半导体PN结的正向死区电压是指正向偏置电压较小时，正向电流极小，几乎为零的电压区间，硅管的死区电压约为0.2~0.3V，锗管约为0.7V。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "说法中死区电压对应的半导体材料弄反了，硅管死区电压约0.5V，导通电压约0.7V；锗管死区电压约0.1V，导通电压约0.2 - 0.3V。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632219", "t": 3, "q": "半导体PN结正向偏置时，扩散电流是主要导电电流，反向偏置时，漂移电流是主要导电电流。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PN结正向偏置时，外电场削弱内电场，多子扩散运动加强，扩散电流是主要导电电流；反向偏置时，外电场加强内电场，少子漂移运动加强，漂移电流是主要导电电流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632220", "t": 3, "q": "根据奈奎斯特采样定理，只要采样频率大于信号最高频率的2倍，就能完全恢复原始连续信号，无需其他条件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。奈奎斯特采样定理除要求采样频率大于信号最高频率的2倍外，还要求原始信号必须是带限信号，即信号的最高频率是有限的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632221", "t": 3, "q": "光电导探测器（光敏电阻）的电阻值随入射光强度的增大而增大，因为光照使半导体的载流子浓度增加，电导率增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。光电导探测器（光敏电阻）电阻值随入射光强度增大而减小，光照使半导体载流子浓度增加，电导率增大，根据电阻与电导率成反比关系，电阻应减小。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632222", "t": 3, "q": "光电导探测器的光谱响应范围仅由半导体材料的禁带宽度决定，禁带宽度越小，响应的波长范围越宽，能探测的光波长越长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "光电导探测器光谱响应受半导体材料禁带宽度影响，禁带宽度与能吸收光子能量相关，禁带宽度小，能吸收低能量长波长光子，所以响应波长范围宽，能探测光波长更长。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632223", "t": 3, "q": "光电导探测器的响应度随入射光强度的增大而增大，因为光强越大，产生的光生载流子越多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "光电导探测器的响应度在一定范围内会随光强增大而增大，但当光强达到一定程度后会出现饱和现象，并非一直随光强增大而增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632224", "t": 3, "q": "光电导探测器的响应速度主要取决于半导体材料的载流子寿命，载流子寿命越长，探测器接收光信号后产生的光电流持续时间越长，响应速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "载流子寿命越长，光电流持续时间长，但响应速度是变慢而非变快，因为响应速度和载流子寿命成反比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632225", "t": 3, "q": "光电二极管的量子效率不可能超过100%，因为一个光子最多只能激发一个电子-空穴对，产生一个光生载流子。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632226", "t": 3, "q": "光电二极管的响应度与入射光波长相关，波长越长，响应度越高，因为长波长光子的能量更大，更容易激发载流子。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "光子能量与波长成反比，长波长光子能量小而非大。且光电二极管响应度并非波长越长越高，存在最佳响应波长范围。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632227", "t": 3, "q": "光电二极管工作在反向偏置状态时，光电流大小与入射光强度成正比，与反向偏置电压（未击穿前）无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "光电二极管反向偏置时，光照产生的光生载流子被电场加速形成光电流，光电流大小取决于入射光强度，在未击穿前与反向偏置电压无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632228", "t": 3, "q": "光电二极管工作在光伏模式（零偏置）时，输出的光电压与入射光强度成正比，适合用于光强的精确测量;工作在光电导模式（反向偏置）时，输出的光电流与入射光强度成正比，适合用于高速光信号探测。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632229", "t": 3, "q": "光电探测器的暗电流是指在无光照条件下，仅由反向偏置电压产生的反向电流，暗电流越大，探测器的探测灵敏度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "暗电流是无光照时反向偏置电压产生的反向电流，暗电流越大意味着探测器噪声越大，会降低探测灵敏度，而不是提高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632230", "t": 3, "q": "光电探测器的暗电流随反向偏置电压的增大而增大（未击穿前），因为反向偏置增大使空间电荷区电场增强，少数载流子的漂移速度加快，漏电流增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在未击穿前，增大光电探测器反向偏置电压，会使空间电荷区电场增强，加快少数载流子漂移速度，导致暗电流（漏电流）增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632231", "t": 3, "q": "光电探测器的量子效率是指入射光子数与探测器产生的光生载流子数的比值，其值最大为1（100%），不可能超过1。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632232", "t": 3, "q": "光电探测器的量子效率与响应度成正比，量子效率越高，响应度越大，因为更多的光子被转换为光生载流子，光电流越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "光电探测器的响应度和量子效率关系密切，量子效率体现光子转换为光生载流子的能力，量子效率高意味着更多光子变成光生载流子，进而光电流增大，响应度也就越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632233", "t": 3, "q": "光电探测器的探测下限（最小可探测光功率）仅由探测器的暗电流决定，暗电流越小，探测下限越低，探测灵敏度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "光电探测器的探测下限不只由暗电流决定，还受噪声等多种因素影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632234", "t": 3, "q": "光电探测器的响应时间是指探测器从接收到光信号到输出电信号达到稳定值的时间，通常用上升时间（10%<sub>90%峰值）和下降时间（90%<\/sub>10%峰值）表示。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "光电探测器响应时间的定义及常用表示方法与题目描述一致。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632235", "t": 3, "q": "光电探测器的响应时间与反向偏置电压无关，仅由半导体材料的载流子寿命和器件结构决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "光电探测器响应时间受反向偏置电压影响，并非仅由半导体材料载流子寿命和器件结构决定。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632236", "t": 3, "q": "集成电路设计中，版图与原理图一致性检查（LVS）通过对比版图提取的网表与前端设计的门级网表，确保版图的物理连接与原理图的逻辑连接完全一致，避免因版图绘制错误导致逻辑功能异常。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "LVS就是通过对比版图提取网表和前端设计门级网表，来保证版图物理连接和原理图逻辑连接相符，防止逻辑功能出错。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632237", "t": 3, "q": "集成电路设计中，低功耗设计的时钟门控技术通过在时钟路径中插入门控单元，当模块空闲时关闭时钟信号，减少模块的动态功耗（开关功耗）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "时钟门控技术确实是在时钟路径插入门控单元，在模块空闲时关闭时钟信号，避免不必要的翻转，从而降低动态功耗。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632238", "t": 3, "q": "集成电路设计中，电源完整性（PI）分析的目的是确保芯片各模块的供电电压稳定，避免因电源噪声（如电压跌落、纹波）导致芯片逻辑功能异常或时序违规。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电源完整性分析就是为保证芯片各模块供电电压稳定，防止电源噪声引发芯片逻辑和时序问题。", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632239", "t": 3, "q": "集成电路设计中，多阈值电压（Multi-Vth）技术通过在芯片中同时使用高阈值电压（High-Vth）和低阈值电压（Low-Vth）器件，实现性能与功耗的平衡，其中High-Vth器件用于对速度要求低、对功耗敏感的模块。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多阈值电压技术确实是在芯片中同时用高、低阈值电压器件来平衡性能与功耗，高阈值电压器件漏电小、速度慢，适合对速度要求低、对功耗敏感的模块。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632240", "t": 3, "q": "集成电路设计中，静态时序分析（STA）需要输入测试向量，通过仿真分析所有时序路径的延迟，确保满足时序约束。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静态时序分析（STA）不需要输入测试向量，它是基于电路的拓扑结构和器件参数，通过计算分析所有时序路径的延迟，确保满足时序约束。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803845338632241", "t": 3, "q": "集成电路设计中，逻辑综合的主要任务是将寄存器传输级（RTL）代码转换为门级网表，并完成门级网表到版图的映射。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "逻辑综合主要是把RTL代码转成门级网表，但完成门级网表到版图映射的是物理设计阶段，并非逻辑综合任务。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第10章 电子信息（2）", "n": "基础练习题【含解析】 / 第10章 电子信息（2）", "qs": [{"id": "2034803856197685248", "t": 1, "q": "某信号处理系统需对采集到的离散信号进行频谱分析，以下哪种变换是实现该功能的核心数学工具?", "a": ["傅里叶变换", "Z变换", "离散傅里叶变换（DFT）", "拉普拉斯变换", "", ""], "r": "C", "e": "对离散信号进行频谱分析，离散傅里叶变换（DFT）是核心工具，它把离散信号从时域转换到频域。傅里叶变换用于连续信号；Z变换多用于离散系统分析；拉普拉斯变换用于连续系统分析。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879552", "t": 1, "q": "以下哪种半导体器件的工作原理基于\"光生伏特效应\"，可将光能直接转换为电能，且无需外加偏置电压?", "a": ["雪崩光电二极管（APD）", "光伏电池（太阳能电池）", "光电导探测器（光敏电阻）", "光电三极管", "", ""], "r": "B", "e": "光生伏特效应是指半导体在受到光照射时产生电动势的现象，光伏电池正是基于该效应，能把光能直接转化为电能，且不用外加偏置电压。而雪崩光电二极管、光电导探测器、光电三极管工作通常需要外加偏置电压。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879553", "t": 1, "q": "以下哪种半导体器件的工作原理基于\"压电效应\"，而非内光电效应或PN结特性?", "a": ["光电三极管", "压电陶瓷传感器", "稳压二极管", "压敏电阻", "", ""], "r": "B", "e": "压电效应是某些电介质在沿一定方向上受到外力的作用而变形时，其内部会产生极化现象。选项中只有压电陶瓷传感器基于压电效应工作。光电三极管基于内光电效应，稳压二极管基于PN结特性，压敏电阻是基于材料的非线性伏安特性。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879554", "t": 1, "q": "以下哪种光电探测器属于\"成像型探测器\"，可将二维光信号转换为二维电信号，用于数字成像（如相机、摄像头）?", "a": ["光电导探测器（光敏电阻）", "光电二极管", "雪崩光电二极管（APD）", "电荷耦合器件（CCD）", "", ""], "r": "D", "e": "前三者多为将光信号转换为电信号用于检测光强等，而电荷耦合器件（CCD）能把二维光信号转换为二维电信号，用于数字成像。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879555", "t": 1, "q": "在光电传感技术中，\"量子效率\"是评价光电探测器性能的重要指标，其定义是以下哪项?", "a": ["入射光子数与探测器产生的光生载流子数之比", "探测器输出的电信号功率与入射光功率之比", "探测器响应的波长范围宽度", "探测器产生的光生载流子数与入射光子数之比", "", ""], "r": "D", "e": "量子效率反映的是探测器将入射光子转化为光生载流子的能力，所以是探测器产生的光生载流子数与入射光子数之比。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879556", "t": 1, "q": "在光电传感技术中，以下哪种探测器的响应波宽范围主要在紫外波段，且禁带宽度较大?", "a": ["氮化镓（GaN）基光电探测器", "硅基光电二极管", "锗基光电二极管", "硫化铅（PbS）光电探测器", "", ""], "r": "A", "e": "氮化镓（GaN）基光电探测器禁带宽度大，响应波宽主要在紫外波段。硅基、锗基、硫化铅探测器响应波段不在紫外为主。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879557", "t": 1, "q": "在光电传感技术中，以下哪种现象是光电导探测器的工作基础?", "a": ["塞贝克效应", "光生伏特效应", "压电效应", "光电导效应", "", ""], "r": "D", "e": "光电导探测器基于光电导效应工作，光照使材料电导率改变。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879558", "t": 1, "q": "在光电传感技术中，以下哪种应用场景主要利用了光电导探测器的特性?", "a": ["工业控制中的光控开关（如自动门感应）", "红外热成像仪中的温度探测", "光纤通信中的光信号接收", "数字相机中的图像传感器", "", ""], "r": "A", "e": "光电导探测器是基于内光电效应，光照使材料电导率改变。工业光控开关利用其特性，光照变化使探测器电导率变化来控制开关。B用热探测器；C用PIN或APD探测器；D用CMOS或CCD等图像传感器。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879559", "t": 1, "q": "在光电传感技术中，以下哪种应用主要利用了发光二极管（LED）的\"电致发光效应\"，而非光电探测效应?", "a": ["红外遥控器的信号发射", "光控开关中的光探测单元", "LED显示屏的像素单元", "光纤通信中的光信号发送端", "", ""], "r": "A", "e": "这是一道关于光电传感技术中LED应用的选择题。我们需要识别哪种应用主要利用了LED的“电致发光效应”，而非光电探测效应。首先，我们来了解两个关键概念：1. 电致发光效应：指的是当电流通过LED时，LED发出光线的现象。2. 光电探测效应：是指材料在受到光照时产生电流或电压变化的效应，通常用于光探测。接下来，我们逐一分析选项：A. 红外遥控器的信号发射：红外遥控器通过LED发出红外光信号来控制设备。这里LED主要起发光作用，利用的是电致发光效应。B. 光控开关中的光探测单元：光控开关通过检测光线来控制电路的通断。这里的重点是光的探测，即光电探测效应，而非LED的发光。C. LED显示屏的像素单元：LED显示屏通过控制每个像素单元的发光来显示图像。这里LED主要起发光作用，利用的是电致发光效应。D. 光纤通信中的光信号发送端：在光纤通信中，LED用于发出光信号，通过光纤传输信息。这里LED同样起发光作用，利用的是电致发光效应。综上所述，题目要求识别主要利用LED的电致发光效应的应用，而非光电探测效应。因此，B选项“光控开关中的光探测单元”主要利用的是光电探测效应，不符合题目要求。其他选项A、C和D均主要利用LED的电致发光效应。如果必须选择一个最符合题意的答案，那么A选项“红外遥控器的信号发射”是最典型的利用LED电致发光效应的应用场景，因为它直接涉及到使用LED发出控制信号。所以，正确答案是A选项：“红外遥控器的信号发射”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879560", "t": 1, "q": "在光电探测技术中，以下哪种探测器的响应速度最慢，主要用于探测红外光，且无需冷却?", "a": ["热释电探测器", "光电二极管", "电荷耦合器件（CCD）", "雪崩光电二极管", "", ""], "r": "A", "e": "热释电探测器响应速度慢，主要用于红外光探测，且无需冷却。光电二极管、雪崩光电二极管响应快，CCD常用于可见光成像。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879561", "t": 1, "q": "在光电探测中，\"暗电流\"是评价探测器性能的重要指标，其定义是以下哪项?", "a": ["探测器在强光照射下的输出电流", "探测器在无光照条件下，仅由偏置电压产生的反向电流", "探测器输出电流与入射光功率的比值", "探测器在标准光照条件下的输出电流", "", ""], "r": "B", "e": "暗电流是指无光照时的电流，是探测器在无光照条件下，仅由偏置电压产生的反向电流。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879562", "t": 1, "q": "在光电探测中，\"光谱响应\"是评价探测器性能的重要指标，其定义是以下哪项?", "a": ["探测器输出信号随时间的变化关系", "探测器对不同频率光信号的响应能力", "探测器输出信号与入射光功率的比值（响应度）随入射光波长的变化关系", "探测器对不同强度光信号的响应能力", "", ""], "r": "C", "e": "光谱响应主要体现的是探测器响应度随入射光波长的变化情况。A选项说的是输出信号随时间变化，与光谱响应无关；B选项表述不准确，不是对不同频率光信号响应能力；D选项是对不同强度光信号响应能力，并非光谱响应定义。所以答案选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879563", "t": 1, "q": "在光电探测中，\"量子效率\"与\"响应度\"的关系是以下哪项（已知电子电荷量e，普朗克常数h，光速c，入射光波长λ）?", "a": ["量子效率QE=(eλ)/(h c)*响应度R", "响应度R=(h c)/(eλ)*量子效率QE", "响应度R=(eλ)/(h c)*量子效率QE", "量子效率QE=(h c)/(eλ)*响应度R", "", ""], "r": "C", "e": "根据量子效率和响应度的定义及关系推导可得：响应度R与量子效率QE的关系为「test/yiwen_img/importSubject/2034803849461633024.png」 。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879564", "t": 1, "q": "在光电探测中，\"响应度\"是评价探测器光-电转换能力的指标，其单位通常是以下哪项?", "a": ["V/W（伏/瓦）", "W/V（瓦/伏）", "A/W（安/瓦）", "W/A（瓦/安）", "", ""], "r": "C", "e": "响应度是探测器输出信号与输入光功率之比，输出信号一般是电流或电压，输入是光功率（瓦），若输出电流，单位就是A/W；若输出电压，单位就是V/W ，常用A/W衡量探测器的光 - 电转换能力。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879565", "t": 1, "q": "在光电探测中，“响应时间”是评价探测器速度的重要指标，其定义是以下哪项?", "a": ["探测器输出电信号从峰值的10%上升到90%（或从90%下降到10%）的时间", "探测器对不同波长光信号的响应差异程度", "探测器从接收到光信号到输出电信号的时间间隔", "探测器输出电信号的幅值达到稳定值所需的时间", "", ""], "r": "A", "e": "响应时间指探测器输出电信号从峰值的10%上升到90%（或从90%下降到10%）的时间。B是光谱响应相关；C不是响应时间定义；D也不符合响应时间定义。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879566", "t": 1, "q": "在光电探测中，\"雪崩倍增效应\"是以下哪种探测器的核心工作机制，可显著提高探测灵敏度?", "a": ["普通光电二极管", "光伏电池", "热释电探测器", "雪崩光电二极管（APD）", "", ""], "r": "D", "e": "雪崩光电二极管（APD）利用雪崩倍增效应工作，能显著提高探测灵敏度。普通光电二极管、光伏电池、热释电探测器都没有以此为核心机制。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879567", "t": 1, "q": "在光电探测中，以下哪种探测器基于\"内光电效应\"工作，且响应速度快（纳秒级），常用于光通信领域?", "a": ["热电偶", "光电二极管", "热释电探测器", "光电倍增管", "", ""], "r": "B", "e": "内光电效应探测器有光电二极管等。热电偶和热释电探测器基于热效应，不是内光电效应；光电倍增管虽响应快但基于外光电效应。光电二极管基于内光电效应且响应速度快适用于光通信。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879568", "t": 1, "q": "在集成电路制造工艺中，\"光刻\"工序的主要作用是以下哪项?", "a": ["将晶圆切割成独立的芯片", "将掩膜版上的电路图形转移到晶圆表面", "对晶圆进行掺杂以形成半导体器件", "在晶圆表面形成氧化层", "", ""], "r": "B", "e": "光刻是集成电路制造关键步骤，其核心就是把掩膜版上的电路图形转移到晶圆表面。A选项是切割工序作用；C选项掺杂有专门的掺杂工艺；D选项形成氧化层有氧化工艺。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879569", "t": 1, "q": "在模拟信号处理中，以下哪种放大器的输入阻抗最高、输出阻抗最低，适合作为传感器信号的前置放大器（传感器输出信号微弱且源阻抗高）?", "a": ["差分放大器", "共基极放大器", "共射极放大器", "共集电极放大器（射极跟随器）", "", ""], "r": "D", "e": "共集电极放大器输入阻抗高、输出阻抗低，能很好匹配高源阻抗的传感器，适合作为前置放大器来放大微弱信号。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879570", "t": 1, "q": "在数字信号处理中，快速傅里叶变换（FFT）是离散傅里叶变换（DFT）的快速算法，其计算复杂度与DFT相比，以下描述正确的是（设信号长度为N）?", "a": ["两者复杂度均为O(Nlog₂N)", "两者复杂度均为O(N²)", "FFT复杂度为O(N²)，DFT复杂度为O(Nlog₂N)", "FFT复杂度为O(Nlog₂N)，DFT复杂度为O(N²)", "", ""], "r": "D", "e": "离散傅里叶变换（DFT）直接计算复杂度是O(N²) ，快速傅里叶变换（FFT）利用DFT的对称性等特性，将复杂度降低到O(Nlog₂N) 。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879571", "t": 1, "q": "在数字信号处理中，以下哪种编码方式可有效压缩信号的数据量，常用于音频、图像信号的压缩存储（如JPEG、MP3）?", "a": ["不归零码（NRZ）", "脉冲编码调制（PCM）", "曼彻斯特编码", "差分脉冲编码调制（DPCM）", "", ""], "r": "D", "e": "DPCM是在PCM基础上发展而来，它考虑相邻样值的相关性，通过预测差值编码，能有效减少冗余信息，从而压缩数据量，常用于音频、图像信号压缩存储。NRZ用于数字信号传输；PCM是基本的模数转换编码，数据量大；曼彻斯特编码用于数据传输的同步。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879572", "t": 1, "q": "在数字信号处理中，以下哪种操作可将时域信号的能量集中到频域的一个窄带内，常用于信号的调制或加密?", "a": ["卷积运算", "离散余弦变换（DCT）", "频谱搬移（混频）", "傅里叶变换", "", ""], "r": "C", "e": "频谱搬移能把时域信号的能量集中到频域窄带内，常用于信号调制或加密。卷积主要用于线性时不变系统的分析；离散余弦变换常用于图像等数据的压缩；傅里叶变换是将时域信号转换到频域，但不涉及能量集中到窄带这一特点。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879573", "t": 1, "q": "在数字信号处理中，以下哪种窗函数的主瓣宽度最窄，但旁瓣电平较高，适用于对频率分辨率要求高、对旁瓣抑制要求较低的场景?", "a": ["矩形窗", "汉宁窗", "汉明窗", "布莱克曼窗", "", ""], "r": "A", "e": "矩形窗主瓣宽度最窄，不过旁瓣电平高，适合对频率分辨率要求高、旁瓣抑制要求低的场景。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879574", "t": 1, "q": "在数字信号处理中，以下哪种现象是由于信号的频谱在频域上不满足奈奎斯特采样定理，导致采样后不同频率成分重叠产生的?", "a": ["噪声叠加", "信号衰减", "混叠", "码间串扰", "", ""], "r": "C", "e": "奈奎斯特采样定理不满足时，采样后不同频率成分重叠会产生混叠现象。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879575", "t": 1, "q": "在信号处理中，“傅里叶变换的线性性质”是指以下哪项?", "a": ["若信号f(t)的傅里叶变换为F(ω)，则f(t-t0)的傅里叶变换为e^(-jωt0)F(ω)", "若信号f(t)的傅里叶变换为F(ω)，则f(at)的傅里叶变换为(1/|a|)F(ω/a)", "若信号f(t)的傅里叶变换为F(ω)，则f(t)*g(t)的傅里叶变换为F(ω)G(ω)", "若信号f1(t)的傅里叶变换为F1(ω)，f2(t)的傅里叶变换为F2(ω)，则a f1(t)+b f2(t)的傅里叶变换为a F1(ω)+b F2(ω)", "", ""], "r": "D", "e": "傅里叶变换线性性质体现为对信号线性组合进行变换时，等于各信号变换结果的线性组合。选项D符合该性质描述。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879576", "t": 1, "q": "在信号处理中，\"卷积运算\"在时域上的物理意义是以下哪项?", "a": ["一个信号对另一个信号的加权求和，实现信号的平滑或滤波", "将信号从频域转换到时域", "两个信号的相乘", "将信号从时域转换到频域", "", ""], "r": "A", "e": "卷积在时域上是一个信号对另一个信号加权求和，可用于信号平滑或滤波。B选项频域到时域转换一般用逆变换；C选项两信号相乘不是卷积物理意义；D选项时域到频域转换用傅里叶变换。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879577", "t": 1, "q": "在信号处理中，\"自适应滤波\"与\"固定系数滤波\"相比，最显著的特点是以下哪项?", "a": ["仅能用于去除特定频率的噪声", "滤波系数固定不变，设计更简单", "计算复杂度更低", "滤波系数可根据输入信号的统计特性实时调整，以优化滤波效果", "", ""], "r": "D", "e": "“自适应滤波”重点在“自适应”，即其滤波系数能根据输入信号统计特性实时调整来优化滤波效果，而固定系数滤波系数固定。A选项不是自适应滤波显著特点；B选项说滤波系数固定不变是固定系数滤波特点；C选项自适应滤波计算复杂度通常更高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879578", "t": 1, "q": "在信号处理中，若需将连续时间信号转换为离散时间信号，且确保转换后的信号能完全恢复原始信号，除满足奈奎斯特采样定理外，还需在采样前增加以下哪项处理?", "a": ["放大处理", "解调处理", "调制处理", "滤波处理（低通滤波）", "", ""], "r": "D", "e": "为避免采样时出现混叠现象，在将连续时间信号转换为离散时间信号前，需用低通滤波器滤除高于奈奎斯特频率的信号成分。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879579", "t": 1, "q": "在信号处理中，以下哪种滤波方式属于\"非线性滤波\"，对脉冲噪声（如椒盐噪声）的去除效果显著优于线性滤波?", "a": ["巴特沃斯低通滤波", "中值滤波", "椭圆低通滤波", "切比雪夫低通滤波", "", ""], "r": "B", "e": "中值滤波是典型的非线性滤波，能有效去除脉冲噪声，而巴特沃斯、椭圆、切比雪夫低通滤波都属于线性滤波。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879580", "t": 1, "q": "在信号处理中，以下哪种滤波算法可有效去除信号中的随机噪声，且能较好保留信号的突变边缘信息?", "a": ["均值滤波", "中值滤波", "高通滤波", "低通滤波", "", ""], "r": "B", "e": "均值滤波会模糊边缘，低通滤波主要保留低频信号、平滑信号也会模糊边缘，高通滤波主要提取高频突变但不能有效去噪。中值滤波可有效去除随机噪声且能较好保留信号突变边缘信息。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879581", "t": 1, "q": "在信号传输过程中，以下哪种调制方式可通过改变载波的频率来携带数字基带信号的信息?", "a": ["频移键控（FSK）", "正交振幅调制（QAM）", "幅移键控（ASK）", "相移键控（PSK）", "", ""], "r": "A", "e": "频移键控（FSK）是通过改变载波频率来携带数字基带信号信息。正交振幅调制（QAM）是通过载波的幅度和相位同时变化来传输信息；幅移键控（ASK）是改变载波幅度；相移键控（PSK）是改变载波相位。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879582", "t": 1, "q": "在信号传输中，\"差分传输\"与\"单端传输\"相比，最显著的优势是以下哪项?", "a": ["抗共模干扰能力更强", "所需传输介质更少", "传输距离更远", "传输速率更高", "", ""], "r": "A", "e": "差分传输是利用两根信号线传输信号，能有效抑制共模干扰，这是它相对单端传输的显著优势。单端传输只需一根信号线和地线，所需传输介质少；传输距离和速率受多种因素影响，并非差分传输的显著优势。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879583", "t": 1, "q": "在信号传输中，“传输线效应”开始显著影响信号质量的条件是以下哪项?", "a": ["传输线长度接近或大于信号波长的1/10", "传输线长度等于信号波长", "传输线长度远小于信号波长的1/10", "传输线长度远大于信号波长", "", ""], "r": "A", "e": "当传输线长度接近或大于信号波长的1/10时，“传输线效应”会开始显著影响信号质量。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879584", "t": 1, "q": "在信号传输中，\"调制\"的主要目的是以下哪项?", "a": ["将基带信号的频谱搬移到高频段，利于传输（如减少天线尺寸、避免频段干扰）", "将模拟信号转换为数字信号", "将数字信号转换为模拟信号", "增强信号的抗噪声能力", "", ""], "r": "A", "e": "调制是把基带信号频谱搬移到高频段，这样利于传输，比如能减少天线尺寸、避免频段干扰等。B选项模拟转数字是编码等操作；C选项数字转模拟是数模转换；D选项增强抗噪声能力不是调制主要目的。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879585", "t": 1, "q": "在信号传输中，“码间串扰”是影响传输质量的重要因素，其产生的主要原因是以下哪项?", "a": ["信号的调制方式选择不当", "传输介质的衰减", "传输介质的带宽有限，导致不同频率分量的信号传输延迟不同（群时延失真）", "外部电磁干扰", "", ""], "r": "C", "e": "码间串扰主要是因传输介质带宽有限，使不同频率分量信号传输延迟不同，造成前后码元波形相互重叠干扰。选项A调制方式不直接导致码间串扰；选项B传输介质衰减主要影响信号强度；选项D外部电磁干扰会引入噪声，但不是码间串扰主因。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879586", "t": 1, "q": "在信号传输中，“衰减”是传输介质的重要特性，其定义是以下哪项?", "a": ["信号在传输过程中频率发生偏移的程度", "信号在传输过程中相位发生偏移的程度", "信号在传输过程中产生噪声的程度", "信号在传输过程中幅值（或功率）减小的程度", "", ""], "r": "D", "e": "衰减指的是信号在传输过程中幅值或功率减小。A选项频率偏移、B选项相位偏移、C选项产生噪声都不是衰减的定义。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879587", "t": 1, "q": "在信号传输中，\"信噪比（SNR）\"是衡量传输质量的重要指标，其定义是以下哪项?", "a": ["信号带宽与噪声带宽的比值", "信号电压与噪声电压的比值", "信号功率与噪声功率的比值", "信号频率与噪声频率的比值", "", ""], "r": "C", "e": "信噪比是指信号功率与噪声功率的比值。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879588", "t": 1, "q": "在信号传输中，\"阻抗匹配\"的主要目的是以下哪项?", "a": ["降低信号的传输衰减", "增强信号的抗电磁干扰能力", "提高信号的传输速率", "减少信号在传输线两端的反射，最大化功率传输", "", ""], "r": "D", "e": "阻抗匹配能让信号源、传输线和负载的阻抗达到合适关系，减少信号在传输线两端反射，实现功率最大传输。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879589", "t": 1, "q": "在信号传输中，以下哪种编码方式可实现\"自同步\"，即接收端无需额外的同步信号就能从接收信号中提取时钟信息?", "a": ["归零码（RZ）", "差分曼彻斯特编码", "曼彻斯特编码", "非归零码（NRZ）", "", ""], "r": "C", "e": "曼彻斯特编码每个码元中间都会有电平跳变，可利用该跳变提取时钟信号实现自同步。而归零码、非归零码无此特性；差分曼彻斯特编码虽有跳变但主要用于抗干扰，不是自同步的典型方式。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879590", "t": 1, "q": "在信号传输中，以下哪种传输介质的抗电磁干扰能力最强，常用于工业自动化现场的高速信号传输?", "a": ["光纤", "双绞线", "屏蔽电缆", "同轴电缆", "", ""], "r": "A", "e": "光纤以光信号传输，不受电磁干扰影响，抗干扰能力最强，常用于工业自动化现场高速信号传输。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879591", "t": 1, "q": "在信号获取的预处理阶段，若需抑制信号中的50Hz工频干扰，最适合采用以下哪种滤波器?", "a": ["带阻滤波器", "高通滤波器", "带通滤波器", "低通滤波器", "", ""], "r": "A", "e": "50Hz工频干扰是特定频率干扰，要抑制它需阻止该频率信号通过。带阻滤波器能阻止特定频段信号，适合抑制50Hz工频干扰。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879592", "t": 1, "q": "在信号获取过程中，为避免采样后信号发生混叠，根据奈奎斯特采样定理，采样频率fs与信号最高频率fm的关系应满足以下哪项?", "a": ["fs < fm", "fs > 2fm", "fs = fm", "fs < 2fm", "", ""], "r": "B", "e": "奈奎斯特采样定理指出，为避免采样后信号发生混叠，采样频率应大于信号最高频率的2倍。即fs > 2fm。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879593", "t": 1, "q": "在信号获取中，“采样保持电路”的主要作用是以下哪项?", "a": ["在AD转换器转换期间，保持输入模拟信号的幅值稳定，避免转换误差", "对采样后的信号进行滤波，去除混叠噪声", "将离散时间信号转换为连续时间信号", "将模拟信号放大到AD转换器的输入范围内", "", ""], "r": "A", "e": "采样保持电路主要是在AD转换期间让输入模拟信号幅值稳定，防止因信号变化产生转换误差。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879594", "t": 1, "q": "在信号获取中，\"传感器的灵敏度\"是指以下哪项?", "a": ["传感器输出信号与输入信号的比值（如输出电压/输入压力）", "传感器对输入信号变化的响应速度", "传感器能探测到的最小输入信号（如最小光强、最小压力）", "传感器输出信号的稳定性（如长时间漂移）", "", ""], "r": "A", "e": "灵敏度是指传感器输出量与输入量的比值。B选项说的是响应速度；C选项是能探测的最小输入信号；D选项是输出信号稳定性，均不是灵敏度的定义。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879595", "t": 1, "q": "在信号获取中，“多通道数据采集系统”的“通道串扰”是指以下哪项现象?", "a": ["信号与时钟信号之间的干扰", "输入信号与输出信号之间的干扰", "不同通道之间的信号相互干扰，导致通道间信号串混", "同一通道内不同时刻的信号相互干扰", "", ""], "r": "C", "e": "“通道串扰”关键在于“通道”，强调不同通道间的问题，C选项准确描述了不同通道之间信号相互干扰串混的情况。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879596", "t": 1, "q": "在信号获取中，“模拟-to-数字转换器（ADC）”的“分辨率”是指以下哪项?", "a": ["ADC的输入电压范围", "ADC能区分的最小模拟电压变化量", "ADC输出数字信号的位数", "ADC转换模拟信号的最大速率", "", ""], "r": "B", "e": "ADC分辨率指其能区分的最小模拟电压变化量。A选项输入电压范围不是分辨率；C选项输出数字信号位数与分辨率有关但不是定义；D选项转换最大速率和分辨率无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879597", "t": 1, "q": "在信号获取中，\"信号调理\"的核心目的是以下哪项?", "a": ["将数字信号转换为模拟信号", "将模拟信号转换为数字信号", "对采集到的原始信号进行放大、滤波、线性化等处理，使其满足后续处理要求", "将信号从低频段转换到高频段以利于传输", "", ""], "r": "C", "e": "信号调理就是对原始信号处理，像放大、滤波、线性化等，让其符合后续处理要求。A是数模转换；B是模数转换；D说法错误。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879598", "t": 1, "q": "在信号获取中，若传感器输出的是电流信号（如压电传感器），且信号微弱，以下哪种调理电路最适合将其转换为电压信号并放大?", "a": ["电流-电压转换器（互阻放大器）", "反相比例放大器", "同相比例放大器", "电压-电流转换器（互导放大器）", "", ""], "r": "A", "e": "本题需要将电流信号转换为电压信号并放大。 选项A：电流 - 电压转换器（互阻放大器）能将输入的电流信号转换为电压信号，适合处理微弱电流信号并将其转换放大，符合要求。 选项B：反相比例放大器是对电压信号进行反相放大，不能将电流信号转换为电压信号。 选项C：同相比例放大器也是对电压信号进行同相放大，不能实现电流到电压的转换。 选项D：电压 - 电流转换器（互导放大器）是将电压信号转换为电流信号，与需求相反。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803856201879599", "t": 1, "q": "在信号获取中，若传感器输出信号为差分信号（如应变片电桥），以下哪种放大器最适合作为前置放大器，以抑制共模噪声并放大差模信号?", "a": ["反相比例放大器", "同相比例放大器", "电压跟随器", "仪表放大器（Instrumentation Amplifier）", "", ""], "r": "D", "e": "仪表放大器专门用于放大差分信号，能有效抑制共模噪声并放大差模信号。而反相比例、同相比例放大器和电压跟随器主要用于单端信号处理，对差分信号和共模抑制能力不如仪表放大器。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180352", "t": 2, "q": "集成电路制造中，以下哪些因素会影响芯片的良率（可正常工作的芯片比例）?", "a": ["光刻工艺的图形精度", "金属化工艺的布线缺陷（如开路、短路）", "离子注入的掺杂均匀性", "芯片的工作频率", "", ""], "r": "ABC", "e": "ABC选项中的光刻图形精度不佳、金属化工艺布线缺陷、离子注入掺杂不均匀都会在芯片制造过程中引入问题，影响芯片正常功能，降低良率。而芯片工作频率是芯片设计和制造完成后的性能指标，不影响制造时的良率。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180353", "t": 2, "q": "以下哪些半导体器件属于\"功率半导体器件\"，主要用于高压、大电流的电力电子变换场景?", "a": ["小信号双极结型晶体管（BJT）", "功率金属-氧化物-半导体场效应晶体管（Power MOSFET）", "晶闸管（SCR）", "绝缘栅双极晶体管（IGBT）", "", ""], "r": "BCD", "e": "功率半导体器件用于高压、大电流场景。A选项小信号BJT主要用于小信号处理。B、C、D常用于高压、大电流的电力电子变换。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180354", "t": 2, "q": "在光电传感技术中，以下哪些探测器可用于红外光信号的探测?", "a": ["硅基PIN光电二极管", "微测辐射热计（Microbolometer）", "硫化镉（CdS）光电导探测器", "碲镉汞（HgCdTe）光电探测器", "", ""], "r": "BD", "e": "硅基PIN用于可见光和近红外；微测辐射热计用于长波红外探测；硫化镉用于可见光；碲镉汞是常用红外探测器。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180355", "t": 2, "q": "在光电传感技术中，以下哪些因素会影响光电探测器的探测下限（能探测的最小光功率）?", "a": ["探测器的暗电流", "入射光的波长", "后续电路的噪声", "探测器的量子效率", "", ""], "r": "ACD", "e": "暗电流会产生噪声，影响探测下限；后续电路噪声也会干扰信号，影响最小可探测光功率；量子效率影响探测器对光的转换能力，进而影响探测下限；而入射光波长主要影响探测器的响应度等，并非直接影响探测下限。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180356", "t": 2, "q": "在光电传感技术中，以下哪些应用场景需要使用具有高量子效率和低暗电流的光电探测器?", "a": ["工业控制中的光控开关（强光检测）", "光纤通信中的微弱光信号接收", "红外热成像中的温度探测", "生物医学中的微弱荧光信号探测", "", ""], "r": "BD", "e": "在需要检测微弱光信号的场景下，才需要高量子效率以高效转换光为电信号，低暗电流减少噪声干扰。选项B光纤通信微弱光信号、D生物医学微弱荧光信号都属于微弱光检测。而A工业强光检测、C红外热成像温度探测并非主要依赖微弱光检测特性。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180357", "t": 2, "q": "在光电传感技术中，以下哪些应用利用了光电探测器的\"光控开关\"特性（光信号控制电路通断）?", "a": ["激光通信系统（光信号传输数据）", "烟雾报警器（烟雾散射光触发报警）", "路灯自动控制（天黑时开灯，天亮时关灯）", "自动门感应系统（遮挡光信号触发开门）", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180358", "t": 2, "q": "在光电传感技术中，以下哪些应用需要利用光电探测器的高灵敏度特性（能探测微弱光信号）?", "a": ["工业生产线的产品外观检测（强光照射）", "生物荧光成像（微弱荧光信号）", "激光测距系统的接收端", "星光探测（天文观测）", "", ""], "r": "BD", "e": "需高灵敏度特性是为探测微弱光信号。B生物荧光成像的荧光信号微弱，D星光探测中星光也很微弱，都需高灵敏度光电探测器。A工业生产线产品外观检测是强光照射，不依赖高灵敏度；C激光测距系统接收端主要关注信号准确接收，对微弱光探测灵敏度要求非关键。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180359", "t": 2, "q": "在光电传感系统中，为实现对特定波长光信号的探测，需选择具有匹配光谱响应的探测器，以下哪些探测器的光谱响应范围主要覆盖近红外波段（700nm-2500nm）?", "a": ["氮化镓（GaN）光电探测器", "锗基光电二极管（Ge-PD）", "硅基雪崩光电二极管（Si-APD）", "硫化铅（PbS）光电导探测器", "", ""], "r": "BD", "e": "氮化镓探测器常用于紫外波段；硅基雪崩光电二极管光谱响应主要在可见光到近红外短波段；锗基光电二极管和硫化铅光电导探测器光谱响应主要覆盖近红外波段。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180360", "t": 2, "q": "在光电探测技术中，以下哪些探测器的工作原理基于\"内光电效应\"?", "a": ["雪崩光电二极管（APD）", "热释电探测器", "光电导探测器（光敏电阻）", "光电二极管", "", ""], "r": "ACD", "e": "内光电效应是指光照射半导体使内部电子状态改变产生导电载流子。雪崩光电二极管、光电导探测器、光电二极管都基于内光电效应工作；热释电探测器基于热释电效应。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180361", "t": 2, "q": "在光电探测中，以下哪些探测器的响应速度可达到纳秒（ns）级别，适用于高频光信号探测?", "a": ["热释电探测器", "雪崩光电二极管（APD）", "PIN光电二极管", "光电三极管", "", ""], "r": "BC", "e": "热释电探测器响应速度慢，不适用于高频光信号探测。雪崩光电二极管（APD）响应速度快，可达纳秒级别，适合高频光信号探测；PIN光电二极管响应速度也较快，能用于高频；光电三极管响应速度相对较慢。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180362", "t": 2, "q": "在光电探测中，以下哪些探测器属于\"光伏型探测器\"（基于光生伏特效应工作）?", "a": ["光伏电池（太阳能电池）", "光电导探测器（光敏电阻）", "PIN光电二极管（零偏置工作）", "雪崩光电二极管（APD，反向偏置）", "", ""], "r": "AC", "e": "光伏型探测器基于光生伏特效应工作。光伏电池是典型利用光生伏特效应将光能转化为电能；PIN光电二极管零偏置工作时也是基于光生伏特效应。而光电导探测器基于光电导效应，雪崩光电二极管主要是利用雪崩倍增效应。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180363", "t": 2, "q": "在光电探测中，以下哪些探测器需要外加偏置电压才能正常工作（非零偏置）?", "a": ["光电导探测器（光敏电阻）", "雪崩光电二极管（APD）", "PIN光电二极管（用于光电流探测）", "光伏电池（用于电能输出）", "", ""], "r": "BC", "e": "答案：BC在光电探测中，不同类型的探测器有不同的工作原理和偏置要求。A. 光电导探测器（光敏电阻）：这种探测器不需要外加偏置电压，其电阻值会随光照强度变化而改变。B. 雪崩光电二极管（APD）：需要外加较高的反向偏置电压才能正常工作，利用雪崩倍增效应放大光电流。C. PIN光电二极管（用于光电流探测）：通常需要外加一定的反向偏置电压以提高探测效率和响应速度。D. 光伏电池（用于电能输出）：不需要外加偏置电压，它通过光电效应直接将光能转换为电能。综上所述，需要外加偏置电压才能正常工作的探测器是B.雪崩光电二极管（APD）和C.PIN光电二极管（用于光电流探测）。", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180364", "t": 2, "q": "在光电探测中，以下哪些现象会导致光电探测器的响应度下降?", "a": ["探测器的工作温度升高", "探测器表面污染（光反射增加）", "探测器的反向偏置电压降低（仍在正常工作范围）", "入射光波长超出探测器的光谱响应范围", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180365", "t": 2, "q": "在光电探测中，以下哪些因素会导致光电探测器的量子效率降低?", "a": ["探测器表面的反射损失（光未进入探测器）", "探测器体内的载流子复合（未被收集）", "探测器体内的光吸收不完全", "探测器的反向偏置电压增大", "", ""], "r": "ABC", "e": "A选项反射损失使光未进入探测器无法产生光生载流子，会降低量子效率；B选项载流子复合未被收集，减少了有效载流子数量，降低量子效率；C选项光吸收不完全，产生的光生载流子少，降低量子效率；D选项反向偏置电压增大通常有利于载流子收集，不会降低量子效率。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180366", "t": 2, "q": "在模拟信号处理中，运算放大器构成的有源滤波器具有良好的滤波性能，以下哪些属于有源滤波器的典型类型?", "a": ["RC无源滤波器", "切比雪夫滤波器", "巴特沃斯滤波器", "椭圆滤波器", "", ""], "r": "BCD", "e": "RC无源滤波器不属于有源滤波器，而切比雪夫、巴特沃斯、椭圆滤波器是有源滤波器典型类型。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180367", "t": 2, "q": "在数字信号处理中，以下哪些操作可用于减少信号的频谱混叠?", "a": ["对采样前的信号进行幅度放大", "提高采样频率，使其大于2倍信号最高频率", "采样前使用抗混叠低通滤波器，滤除高于1/2采样频率的信号成分", "对采样后的信号进行插值处理", "", ""], "r": "BC", "e": "频谱混叠是因采样频率不足导致的。根据奈奎斯特采样定理，采样频率应大于2倍信号最高频率，同时采样前用抗混叠低通滤波器滤除高于1/2采样频率信号成分可减少混叠。A选项幅度放大与频谱混叠无关；D选项插值处理是对采样后信号处理，不能减少混叠。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180368", "t": 2, "q": "在数字信号传输中，为提高传输的可靠性，常采用差错控制编码技术，以下哪些编码方式属于检错编码（仅能检测错误，不能纠正错误）?", "a": ["循环冗余校验码（CRC）", "汉明码", "奇偶校验码", "卷积码", "", ""], "r": "AC", "e": "循环冗余校验码和奇偶校验码只能检测错误，无法纠正错误；汉明码和卷积码既能检错也能纠错。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180369", "t": 2, "q": "在信号处理中，傅里叶变换具有多种重要性质，以下哪些属于傅里叶变换的基本性质?", "a": ["微分性质（时域微乘对应频域相乘）", "时移性质（时域平移对应频域相位变化）", "尺度变换性质（时域压缩对应频域展宽）", "线性性质（叠加原理）", "", ""], "r": "ABCD", "e": "傅里叶变换有线性、时移、尺度变换、微分等基本性质。线性性质即满足叠加原理；时移性质是时域平移对应频域相位变化；尺度变换性质是时域压缩对应频域展宽；微分性质是时域微分对应频域乘 jω 。ABCD 选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180370", "t": 2, "q": "在信号处理中，以下哪些变换可用于将时域信号转换到频域，实现频谱分析?", "a": ["离散余弦变换（DCT）", "Z变换", "离散傅里叶变换（DFT）", "傅里叶变换", "", ""], "r": "CD", "e": "在信号处理中，将时域信号转换到频域以实现频谱分析的变换主要有傅里叶变换及其变种。A. 离散余弦变换（DCT）主要用于图像和音频压缩等领域，虽然与傅里叶变换有一定联系，但不是主要用于频谱分析。B. Z变换主要用于离散时间信号的时域和复频域之间的转换，更多用于系统分析和设计，而非直接的频谱分析。C. 离散傅里叶变换（DFT）是将离散时间信号转换到频域的标准方法，适用于数字信号的频谱分析。D. 傅里叶变换是将连续时间信号转换到频域的基本工具，在信号处理中广泛用于频谱分析。综上所述，C和D选项是正确的。所以，正确答案是CD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180371", "t": 2, "q": "在信号处理中，以下哪些变换可用于信号的压缩，减少数据存储量?", "a": ["离散小波变换（DWT，如音频压缩）", "傅里叶变换（频谱分析）", "离散余弦变换（DCT，如JPEG图像压缩）", "小波变换（如JPEG2000图像压缩）", "", ""], "r": "ACD", "e": "离散小波变换、离散余弦变换、小波变换都能用于信号压缩以减少数据存储量，傅里叶变换主要用于频谱分析。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180372", "t": 2, "q": "在信号处理中，以下哪些方法可用于信号的平滑处理（减少随机噪声，保留趋势）?", "a": ["指数加权移动平均滤波", "中值滤波", "移动平均滤波", "高通滤波", "", ""], "r": "ABC", "e": "指数加权移动平均滤波、中值滤波、移动平均滤波都能平滑信号，减少随机噪声并保留趋势。高通滤波主要是让高频信号通过，会滤掉低频趋势成分，不能用于平滑处理。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180373", "t": 2, "q": "在信号处理中，以下哪些滤波方式可用于增强信号中的特定频率成分?", "a": ["带通滤波（保留特定频段）", "带阻滤波（滤除特定频段）", "高通滤波（保留高频成分）", "低通滤波（保留低频成分）", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180374", "t": 2, "q": "在信号处理中，以下哪些滤波技术可用于分离信号中的不同频率成分?", "a": ["带通滤波（保留特定频段，滤除其他频段）", "高通滤波（保留高频，滤除低频）", "自适应滤波（动态调整滤波系数）", "低通滤波（保留低频，滤除高频）", "", ""], "r": "ABD", "e": "带通、高通、低通滤波都是按频率范围来处理信号，能分离不同频率成分；自适应滤波主要是根据信号变化动态调整系数优化滤波效果，并非直接用于分离不同频率成分。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180375", "t": 2, "q": "在信号处理中，以下哪些滤波算法属于\"线性滤波\"，满足叠加原理?", "a": ["中值滤波", "均值滤波", "巴特沃斯低通滤波", "切比雪夫高通滤波", "", ""], "r": "BCD", "e": "线性滤波是指输出与输入满足线性叠加原理的滤波。中值滤波是取排序后中值，输出和输入不满足叠加原理，是非线性滤波。均值滤波利用邻域像素均值，巴特沃斯低通滤波和切比雪夫高通滤波基于线性的数学运算，都满足叠加原理，是线性滤波。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180376", "t": 2, "q": "在信号处理中，以下哪些属于非线性信号处理技术，不满足叠加原理?", "a": ["中值滤波（基于排序选择）", "阈值处理（信号超过阈值则截断）", "小波变换（线性变换）", "傅里叶变换（线性变换）", "", ""], "r": "AB", "e": "线性变换满足叠加原理，小波变换和傅里叶变换是线性变换。中值滤波基于排序选择、阈值处理对超过阈值的信号截断，它们不满足叠加原理，属于非线性信号处理技术。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180377", "t": 2, "q": "在信号处理中，以下哪些属于数字信号的预处理步骤，可改善后续处理效果?", "a": ["信号的归一化处理（将幅度归一到特定范围）", "信号的滤波去噪处理", "信号的去趋势处理（去除直流分量或缓慢变化分量）", "信号的频谱分析（转换到频域）", "", ""], "r": "ABC", "e": "归一化、滤波去噪、去趋势处理都能优化信号质量，为后续处理打基础；频谱分析是分析手段，非预处理步骤。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180378", "t": 2, "q": "在信号处理中，有限长单位冲激响应（FIR）滤波器的设计需考虑多个因素，以下哪些是FIR滤波器的典型设计方法?", "a": ["窗函数法", "双线性变换法", "脉冲响应不变法", "频率采样法", "", ""], "r": "AD", "e": "窗函数法和频率采样法是FIR滤波器典型设计方法。双线性变换法和脉冲响应不变法是IIR滤波器设计方法。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180379", "t": 2, "q": "在信号处理中，自适应滤波可根据信号特性动态调整滤波系数，以下哪些应用场景适合采用自适应滤波技术?", "a": ["固定频率干扰（如50Hz工频）的抑制", "生物医学信号（如心电图）的噪声去除", "音频信号的均衡处理", "通信系统中的回声消除", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180380", "t": 2, "q": "在信号传输过程中，以下哪些因素会导致信号产生\"失真\"?", "a": ["外部电磁干扰叠加到信号上", "传输线阻抗不匹配导致信号反射", "传输介质的带宽有限，导致不同频率分量延迟不同（群时延失真）", "传输介质的衰减随频率变化（幅频失真）", "", ""], "r": "ABCD", "e": "ABCD四个选项情况都会使信号产生失真。外部电磁干扰叠加改变信号原有特征；传输线阻抗不匹配使反射信号与原信号叠加；介质带宽有限让不同频率分量延迟不同；介质衰减随频率变化改变信号幅度。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180381", "t": 2, "q": "在信号传输中，不同传输介质的抗电磁干扰能力存在差异，以下哪些传输介质适用于工业强电磁干扰环境下的信号传输?", "a": ["非屏蔽双绞线（UTP）", "屏蔽同轴电缆", "多模光纤", "单模光纤", "", ""], "r": "BCD", "e": "在信号传输中，当面临工业强电磁干扰环境时，选择合适的传输介质至关重要。首先，我们来看A选项，非屏蔽双绞线（UTP）。这种线缆没有屏蔽层，因此在强电磁干扰环境下，其信号容易受到干扰，不适合用于此类环境。接下来是B选项，屏蔽同轴电缆。这种电缆具有屏蔽层，能够有效抵抗外界电磁干扰，保证信号的稳定传输，因此适用于工业强电磁干扰环境。再看C选项，多模光纤。光纤传输是通过光信号进行的，不受电磁干扰的影响，且多模光纤适用于短距离通信，也适合在强电磁干扰环境中使用。最后是D选项，单模光纤。同样基于光纤传输的原理，单模光纤也不受电磁干扰影响，且适用于长距离通信，因此在强电磁干扰环境下同样适用。综上所述，屏蔽同轴电缆（B选项）、多模光纤（C选项）和单模光纤（D选项）都适用于工业强电磁干扰环境下的信号传输。所以，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180382", "t": 2, "q": "在信号传输中，传输线的特性阻抗是关键参数，以下哪些因素会影响传输线的特性阻抗（Z0）?", "a": ["传输线的导体宽度", "传输线周围的介质介电常数（εr）", "传输线的导体厚度", "传输线的长度", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180383", "t": 2, "q": "在信号传输中，调制解调技术可实现基带信号的远距离传输，以下哪些调制方式属于数字调制技术（用于数字基带信号传输）?", "a": ["频移键控（FSK）", "调幅（AM）", "幅移键控（ASK）", "正交振幅调制（QAM）", "", ""], "r": "ACD", "e": "数字调制是用数字信号去调制载波，常见数字调制方式有频移键控（FSK）、幅移键控（ASK）、正交振幅调制（QAM）等；调幅（AM）是模拟调制方式。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180384", "t": 2, "q": "在信号传输中，为延长传输距离，以下哪些措施可有效补偿信号的传输衰减?", "a": ["减小传输信号的频率", "在传输路径中增加信号放大器", "提高传输信号的幅度", "采用低损耗传输介质（如单模光纤）", "", ""], "r": "BD", "e": "增加信号放大器可放大信号补偿衰减；采用低损耗传输介质能减少传输过程中的信号损耗来补偿衰减。减小频率不一定能有效补偿衰减，提高信号幅度未解决传输过程中的衰减问题。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180385", "t": 2, "q": "在信号传输中，以下哪些编码方式可减少数字信号的直流分量，利于通过交流耦合传输介质（如电容耦合）?", "a": ["差分曼彻斯特编码", "非归零码（NRZ）", "曼彻斯特编码", "非归零反相码（NRZI）", "", ""], "r": "AC", "e": "非归零码（NRZ）和非归零反相码（NRZI）存在直流分量，不利于交流耦合传输。差分曼彻斯特编码和曼彻斯特编码在每个比特周期内都有电平跳变，可减少直流分量，利于交流耦合传输。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180386", "t": 2, "q": "在信号传输中，以下哪些编码方式可实现\"无直流分量\"，适合通过电容或变压器耦合的传输介质?", "a": ["差分编码（如差分NRZ）", "曼彻斯特编码", "非归零码（NRZ）", "归零码（RZ）", "", ""], "r": "AB", "e": "答案：AB差分编码（如差分NRZ）和曼彻斯特编码在信号传输中可以实现\\", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180387", "t": 2, "q": "在信号传输中，以下哪些编码方式可实现信号的\"自同步\"（接收端无需额外同步信号）?", "a": ["脉冲编码调制（PCM，量化编码）", "差分曼彻斯特编码（跳变表示逻辑变化）", "非归零码（NRZ，无跳变表示连续相同码元）", "曼彻斯特编码（每个码元中间跳变）", "", ""], "r": "BD", "e": "答案：BD分析：差分曼彻斯特编码和曼彻斯特编码都通过在每个码元中间的电平跳变来实现自同步，而脉冲编码调制和非归零码不具备这种特性。", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180388", "t": 2, "q": "在信号传输中，以下哪些传输介质可用于高速数字信号的长距离传输（传输速率≥1Gbps，距离≥100m）?", "a": ["非屏蔽双绞线（CAT5e）", "屏蔽双绞线（CAT6A）", "单模光纤", "多模光纤（OM4）", "", ""], "r": "BCD", "e": "答案：BCD在信号传输中，对于高速数字信号的长距离传输（传输速率≥1Gbps，距离≥100m），需要选用能够支持高带宽和长距离的传输介质。* B. 屏蔽双绞线（CAT6A）：CAT6A 是一种高性能的双绞线，支持高达 10 Gbps 的传输速率，并且可以支持长达 100m 的距离，适用于高速数字信号的长距离传输。* C. 单模光纤：单模光纤具有极高的带宽和极低的信号衰减，非常适合长距离的高速数据传输。它可以支持数十公里的传输距离，同时保持高速率。* D. 多模光纤（OM4）：OM4 是一种高性能的多模光纤，支持高达 10 Gbps 的传输速率，并且在短距离内（通常数百米到一公里）可以实现高速数据传输。虽然其传输距离不如单模光纤，但仍然满足题目中≥100m的要求。A. 非屏蔽双绞线（CAT5e）虽然常用，但其最高传输速率为 1 Gbps，且通常建议的最大传输距离为 100m，在高速长距离传输场景下不是最佳选择。", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180389", "t": 2, "q": "在信号传输中，以下哪些属于\"平衡传输\"方式，具有较强的抗共模干扰能力?", "a": ["同轴电缆传输", "差分信号传输（如RS485、LVDS）", "双绞线传输（如以太网）", "光纤传输（单模）", "", ""], "r": "BC", "e": "平衡传输利用两根信号线传输大小相等、相位相反的信号，能有效抑制共模干扰。差分信号传输靠两根信号线的差值表示信号，双绞线传输中两根线也传输相反信号，二者都属平衡传输。同轴电缆传输和单模光纤传输不属于平衡传输方式。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180390", "t": 2, "q": "在信号传输中，以下哪些现象会导致数字信号出现码间串扰?", "a": ["传输线阻抗不匹配导致信号反射", "外部电磁干扰叠加到信号上", "传输介质的带宽有限，不同频率分量时延不同（群时延失真）", "传输介质的衰减随频率变化（幅频失真）", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180391", "t": 2, "q": "在信号传输中，以下哪些因素会导致信号的传输衰减增大?", "a": ["传输信号的频率升高", "传输介质的导电率降低", "传输介质的介电常数增大", "传输距离延长", "", ""], "r": "ABD", "e": "答案：ABD信号在传输过程中会受到多种因素的影响而导致衰减增大。以下是对各选项的简要分析：A. 传输信号的频率升高：高频信号在传输过程中更容易受到衰减，因为高频信号的能量更集中在较小的区域内，容易与传输介质发生相互作用而导致能量损失。B. 传输介质的导电率降低：导电率低的介质对电流的传导能力差，信号在传输过程中能量损失较大，从而导致衰减增大。C. 传输介质的介电常数增大：介电常数增大通常会增加信号的电容效应，可能会导致信号速度减慢，但对信号的衰减影响较小，因此这个选项不是主要导致信号衰减增大的原因。D. 传输距离延长：信号在传输过程中随着距离的增加，能量会逐渐分散和衰减，因此传输距离延长会直接导致信号衰减增大。综上所述，选项A、B和D是导致信号传输衰减增大的主要因素。", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180392", "t": 2, "q": "在信号调理电路中，为将传感器输出的微弱非线性信号转换为线性电压信号，以下哪些电路模块是必要的?", "a": ["线性化校正电路", "有源低通滤波器", "低噪声前置放大器", "电压跟随器", "", ""], "r": "AC", "e": "要把微弱非线性信号转为线性电压信号，首先需低噪声前置放大器放大微弱信号，再用线性化校正电路将非线性信号校正为线性信号。有源低通滤波器主要用于滤除高频噪声，电压跟随器起隔离和缓冲作用，并非必要。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180393", "t": 2, "q": "在信号获取过程中，为实现高质量的信号采集，以下哪些措施可有效抑制噪声干扰?", "a": ["降低采样频率以减少噪声采样", "采用差分信号传输方式", "在传感器输出端增加低噪声前置放大器", "在采样前使用抗混叠低通滤波器", "", ""], "r": "BCD", "e": "降低采样频率可能造成信号失真，不能有效抑制噪声，A错误；差分信号传输可抑制共模噪声，B正确；低噪声前置放大器能放大信号同时减少自身引入的噪声，C正确；抗混叠低通滤波器可滤除高频噪声，D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180394", "t": 2, "q": "在信号获取中，“模拟-to-数字转换器（ADC）”的性能指标中，以下哪些会影响其转换精度?", "a": ["分辨率", "积分非线性（INL）", "微分非线性（DNL）", "转换速率", "", ""], "r": "ABC", "e": "分辨率体现对输入信号的分辨能力，INL反映实际转换特性与理想特性的积分偏差，DNL衡量相邻量化台阶的实际大小偏差，它们都影响转换精度；转换速率主要影响转换速度而非精度。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180395", "t": 2, "q": "在信号获取中，采样保持电路的性能会影响AD转换精度，以下哪些是采样保持电路的关键性能指标?", "a": ["保持时间（保持电压稳定的时间）", "下垂率（保持阶段电压的下降速率）", "转换速率（AD转换的速度）", "采样时间（从采样到保持的过渡时间）", "", ""], "r": "ABD", "e": "采样保持电路主要作用是采集信号并在AD转换期间保持信号稳定。保持时间、下垂率和采样时间都直接关系到其对信号的采集和保持性能，而转换速率是AD转换器的指标，并非采样保持电路的关键性能指标。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180396", "t": 2, "q": "在信号获取中，传感器的非线性误差会影响测量精度，以下哪些方法可用于补偿传感器的非线性误差?", "a": ["在调理电路中增加非线性校正电路", "提高传感器的供电电压稳定性", "采用分段线性插值算法", "使用最小二乘法拟合非线性曲线", "", ""], "r": "ACD", "e": "A通过非线性校正电路可直接对非线性误差补偿；C分段线性插值算法能近似处理非线性特性；D最小二乘法拟合可得到更准确曲线来补偿误差。B提高供电电压稳定性主要影响传感器输出稳定性，不能补偿非线性误差。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180397", "t": 2, "q": "在信号获取中，多通道数据采集系统需解决通道间干扰问题，以下哪些措施可有效降低多通道间的串扰?", "a": ["降低各通道的信号增益", "增加通道间的物理距离", "采用同步采样方式", "在各通道间设置接地屏蔽层", "", ""], "r": "BCD", "e": "在信号获取中，多通道数据采集系统面临的一个主要问题是通道间的干扰或串扰。为了有效降低这种串扰，我们可以从减少信号传播的干扰、隔离信号路径以及增强信号的抗干扰能力等方面来考虑。A. 降低各通道的信号增益：虽然降低增益可以减少信号的强度，但同时也降低了信号的信噪比，使得信号更难以被准确检测和处理。因此，这不是一个有效的解决串扰的方法。B. 增加通道间的物理距离：增加物理距离可以有效减少信号从一个通道传播到另一个通道的可能性，从而降低串扰。C. 采用同步采样方式：同步采样可以确保所有通道在同一时间点进行采样，这样可以避免由于采样时间不同步而导致的串扰问题。D. 在各通道间设置接地屏蔽层：接地屏蔽层可以有效地隔离不同通道之间的电磁干扰，从而降低串扰。综上所述，选项B、C和D都是有效降低多通道间串扰的措施。所以，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180398", "t": 2, "q": "在信号获取中，以下哪些传感器的输出信号属于模拟信号，需要通过AD转换器转换为数字信号?", "a": ["热电偶（输出电压与温度成正比）", "旋转编码器（输出脉冲数与转角成正比）", "应变片（组成电桥，输出电压与应变成正比）", "光电二极管（输出电流与光强成正比）", "", ""], "r": "ACD", "e": "模拟信号是连续变化的信号，数字信号是离散的。热电偶输出连续变化的电压、应变片电桥输出连续变化的电压、光电二极管输出连续变化的电流，它们输出的都是模拟信号，需AD转换。旋转编码器输出脉冲数是离散的数字信号。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180399", "t": 2, "q": "在信号获取中，以下哪些属于传感器的静态特性指标，用于评价传感器的稳态性能?", "a": ["灵敏度（输出与输入的比值）", "重复性（多次测量的一致性）", "线性度（输出与输入的线性程度）", "响应时间（动态响应速度）", "", ""], "r": "ABC", "e": "灵敏度、重复性、线性度是描述传感器在稳态下性能的静态特性指标；响应时间是反映动态响应速度的动态特性指标。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180400", "t": 2, "q": "在信号获取中，以下哪些因素会导致AD转换器的转换误差增大?", "a": ["AD转换器的分辨率过低", "采样保持电路的下垂率过大", "输入信号的噪声过大", "AD转换器的参考电压不稳定", "", ""], "r": "ABCD", "e": "分辨率低会使量化误差大；下垂率大影响采样值准确性；输入信号噪声大干扰转换；参考电压不稳定也导致转换误差。ABCD都会使AD转换器转换误差增大。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803859662180401", "t": 2, "q": "在信号获取中，以下哪些AD转换器的转换速率可达到兆赫兹（MHz）级别，适用于高速信号采集?", "a": ["并行比较型AD转换器（Flash ADC）", "流水线型AD转换器（Pipeline ADC）", "逐次逼近型AD转换器（SAR ADC）", "Σ-Δ型AD转换器（Sigma-Delta ADC）", "", ""], "r": "AB", "e": "并行比较型AD转换器转换速度最快，可达兆赫兹级别；流水线型AD转换器速度也较快，能满足高速信号采集需求。逐次逼近型和Σ - Δ型AD转换器速度相对较慢。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580416", "t": 3, "q": "集成电路设计中，时序仿真（Timing Simulation）需要考虑版图寄生参数（如寄生电阻、电容），通过仿真验证芯片在实际工作条件下的时序性能，确保无时序违规。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "时序仿真要模拟芯片在实际工作时的时序情况，版图寄生的电阻、电容会影响信号传输时间等时序参数，所以需考虑这些寄生参数，以验证时序性能、避免时序违规。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580417", "t": 3, "q": "集成电路设计中，时序收敛是指通过布局布线优化，使芯片内所有时序路径的延迟均满足时序约束（建立时间、保持时间），无时序违规。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该描述准确概括了集成电路设计中时序收敛的定义，即通过布局布线等操作让芯片内各时序路径延迟符合时序约束，不存在时序违规情况。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580418", "t": 3, "q": "集成电路设计中，时钟树综合（CTS）的主要目的是构建时钟信号的传输路径，使时钟信号到达所有时序单元（如触发器）的延迟尽可能一致，最小化时钟skew。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "时钟树综合就是为了构建时钟传输路径，让时钟信号到各时序单元延迟尽量一致，从而最小化时钟偏斜（skew）。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580419", "t": 3, "q": "集成电路设计中，时钟skew是指时钟信号到达不同时序单元（如触发器）的时间差异，时钟skew越小，时序路径的建立时间和保持时间越容易满足，时序收敛越容易实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "时钟skew确实指时钟信号到达不同时序单元的时间差异，较小的时钟skew有利于减少时序路径上建立时间和保持时间裕量的紧张程度，让这两个时间要求更容易达成，进而更易实现时序收敛。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580420", "t": 3, "q": "集成电路设计中，物理验证的设计规则检查（DRC）主要检查版图的逻辑功能是否与原理图一致，确保无逻辑错误。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设计规则检查（DRC）主要是检查版图是否满足制造工艺要求的设计规则，如线宽、间距等，并非检查版图逻辑功能与原理图是否一致，后者是版图与原理图一致性检查（LVS）的工作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580421", "t": 3, "q": "集成电路设计中，物理综合（Physical Synthesis）是在逻辑综合过程中引入版图的物理信息（如布局区域、布线资源），直接生成可用于布局布线的门级网表，减少后续时序收敛的难度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "物理综合就是在逻辑综合时引入版图物理信息，可直接生成适合布局布线的门级网表，能有效降低后续时序收敛难度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580422", "t": 3, "q": "集成电路制造中，光刻工艺的分辨率仅由曝光光源的波长决定，波长越短，分辨率越高，与光刻胶性能、透镜系统无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。光刻工艺的分辨率并非仅由曝光光源的波长决定，光刻胶性能、透镜系统等也会对其产生影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580423", "t": 3, "q": "集成电路制造中，光刻胶的分辨率越高，越适合用于先进工艺（如7nm、5nm）的光刻工序，因为高分辨率光刻胶能更好地复制掩膜版上的精细图形。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "光刻胶分辨率越高，越能精准复制掩膜版上的精细图形，满足先进工艺（如7nm、5nm）对精细度的要求，所以适合用于这些先进工艺的光刻工序。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580424", "t": 3, "q": "集成电路制造中，化学机械抛光（CMP）工艺的主要目的是去除晶圆表面的多余材料，使晶圆表面达到全局平坦化，为后续光刻工艺提供平整基底。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "化学机械抛光（CMP）在集成电路制造里，就是通过化学和机械作用去除晶圆表面多余材料，实现全局平坦化，给后续光刻工艺创造平整基底。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580425", "t": 3, "q": "集成电路制造中，化学气相沉积（CVD）工艺沉积的薄膜质量（如均匀性、致密性）仅与反应气体的种类有关，与沉积温度、压力无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "集成电路制造里，化学气相沉积（CVD）工艺沉积薄膜质量受多种因素影响，不只是反应气体种类，沉积温度、压力等也会对薄膜均匀性、致密性等质量指标产生重要作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580426", "t": 3, "q": "集成电路制造中，金属化工艺沉积的金属层厚度越厚，导线的导通电阻越小，电流承载能力越强，但金属层过厚会增加光刻难度和芯片成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属层厚使导线横截面积大，根据电阻定律，电阻变小，电流承载能力增强；而厚金属层在光刻时对工艺要求高，且用料多，会增加光刻难度和芯片成本。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580427", "t": 3, "q": "集成电路制造中，金属化工艺通常先沉积金属层（如铝、铜），再通过光刻和刻蚀工艺定义金属互连图形，形成器件间的导线。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在集成电路制造里，金属化工艺一般就是先沉积金属层，之后利用光刻和刻蚀工艺来确定金属互连图形，从而形成器件间导线，该描述符合实际工艺过程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580428", "t": 3, "q": "集成电路制造中，离子注入工艺的掺杂深度随注入离子能量的增大而增大，因为能量越大，离子在晶圆内的穿透能力越强，能到达更深的位置。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在集成电路制造里，离子注入能量与掺杂深度正相关，能量高时离子穿透能力强，可到达晶圆更深位置。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580429", "t": 3, "q": "集成电路制造中，离子注入工艺后通常需要进行退火处理，其目的是激活注入的杂质离子（使杂质离子电离，产生载流子），同时修复离子注入造成的晶圆晶格损伤。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离子注入会损伤晶圆晶格且注入杂质离子多处于非激活状态，退火能激活杂质离子产生载流子，还可修复晶格损伤。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580430", "t": 3, "q": "集成电路制造中，离子注入工艺可实现精确的区域掺杂，通过控制注入离子的能量和剂量，可精确控制掺杂深度和掺杂浓度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离子注入是集成电路制造中常用的掺杂技术，能精确控制注入区域，且可通过控制离子能量和剂量来精准调控掺杂深度与浓度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580431", "t": 3, "q": "集成电路制造中，前道工艺（FEOL）主要负责形成半导体器件的有源区，后道工艺（BEOL）主要负责形成器件间的金属互连。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "集成电路制造里，前道工艺确实是聚焦于形成半导体器件的有源区，而后道工艺主要工作就是构建器件间的金属互连。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580432", "t": 3, "q": "集成电路制造中，浅沟槽隔离（STI）工艺通过在晶圆表面刻蚀浅沟槽，填充绝缘材料（如氧化硅），实现相邻半导体器件的电学隔离，替代传统的局部氧化隔离（LOCOS）工艺。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在集成电路制造里，STI工艺确实是在晶圆表面刻蚀浅沟槽并填充绝缘材料来达成相邻半导体器件的电学隔离，且因其优势，逐渐替代了传统的LOCOS工艺。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580433", "t": 3, "q": "集成电路制造中，铜互连工艺相比铝互连工艺的主要劣势是铜的抗电迁移能力更弱，容易导致导线因电流迁移而出现开路或短路故障。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "铜互连工艺中铜的抗电迁移能力比铝强，这是铜互连工艺相对铝互连工艺的优势，并非劣势。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580434", "t": 3, "q": "集成电路制造中，掩膜版是光刻工艺的核心模板，其表面的电路图形与晶圆上最终形成的电路图形完全一致（1:1比例）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在集成电路制造光刻工艺里，掩膜版表面电路图形与晶圆上最终形成的电路图形并非1:1比例，通常会采用缩小投影光刻技术，掩膜版图形尺寸会比晶圆上最终图形大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580435", "t": 3, "q": "数字信号处理中，有限长单位冲激响应（FIR）滤波器的相位特性一定是线性的，因为其冲激响应是有限长的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "FIR 滤波器相位特性不一定是线性的，冲激响应有限长不是其相位特性一定线性的原因，只有满足一定条件（如单位冲激响应满足偶对称或奇对称）时，FIR 滤波器才具有线性相位。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580436", "t": 3, "q": "信号处理中，离散余弦变换（DCT）常用于图像和音频压缩，因为DCT能将信号的能量集中到少数低频系数上，通过丢弃高频系数实现数据压缩，且主观失真较小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离散余弦变换（DCT）确实常用于图像和音频压缩，它可把信号能量集中到低频系数，丢弃高频系数来压缩数据，同时主观失真小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580437", "t": 3, "q": "信号处理中，中值滤波是线性滤波技术，通过对滑动窗口内的信号取平均值，实现对随机噪声的去除，同时保留信号边缘。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "中值滤波是非线性滤波技术，它是取滑动窗口内信号的中值而非平均值来去除随机噪声并保留信号边缘。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580438", "t": 3, "q": "信号处理中，自适应滤波器的收敛速度越快，说明滤波器能越快地调整滤波系数以适应信号特性变化，但收敛速度过快可能导致滤波器对噪声过于敏感，稳定性下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "自适应滤波器收敛速度快意味着能快速调整系数适应信号变化，不过速度过快时会把噪声当作信号变化来响应，从而对噪声更敏感，稳定性也随之降低。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580439", "t": 3, "q": "信号处理中，Butterworth低通滤波器的幅频特性在通带内具有最大平坦特性，但阻带衰减速率比Chebyshev低通滤波器慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Butterworth低通滤波器通带内幅频特性确实是最大平坦的，且其阻带衰减速率比Chebyshev低通滤波器慢。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580440", "t": 3, "q": "信号传输中，差分传输方式通过两根导线传输幅度相等、极性相反的信号，接收端取两者差值恢复信号，可有效抑制共模干扰。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "差分传输就是利用两根导线传输幅度相等、极性相反信号，接收端通过取差值恢复信号，能很好地抑制共模干扰。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580441", "t": 3, "q": "信号传输中，差分信号的共模抑制比（CMRR）越高，说明差分对两根导线的对称性越好，对共模干扰的抑制能力越强，信号传输质量越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "共模抑制比高意味着差分电路能更好区分差模信号和共模信号，反映出差分对两根导线对称性好，可有效抑制共模干扰，进而提升信号传输质量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580442", "t": 3, "q": "信号传输中，传输线的衰减随传输距离的增大而增大，随传输信号频率的升高而减小，因为高频信号的趋肤效应更明显，导体损耗更小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "传输线的衰减随传输距离增大而增大正确，但随传输信号频率升高是增大而非减小，高频信号趋肤效应明显会使导体等效电阻增大，导体损耗增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580443", "t": 3, "q": "信号传输中，传输线的特性阻抗与传输线的长度相关，长度越长，特性阻抗越小，信号衰减越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "传输线的特性阻抗由传输线的结构和材料决定，与长度无关。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580444", "t": 3, "q": "信号传输中，非屏蔽双绞线（UTP）的抗电磁干扰能力优于屏蔽双绞线（STP），因为UTP无屏蔽层，信号传输不受屏蔽层电容影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "屏蔽双绞线有屏蔽层能减少外界电磁干扰，抗干扰能力优于非屏蔽双绞线，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580445", "t": 3, "q": "信号传输中，光纤传输的信号带宽主要受光纤的色散（模式色散、材料色散、波导色散）限制，色散会导致不同频率或模式的光信号传输延迟不同，从而限制传输带宽和距离。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在光纤信号传输里，色散（包含模式色散、材料色散、波导色散）会使不同频率或模式光信号传输延迟有差异，进而对传输带宽和距离造成限制。所以该描述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580446", "t": 3, "q": "信号传输中，光纤传输的信号衰减主要来源于光纤的吸收损耗和散射损耗，其中吸收损耗主要由光纤材料的杂质（如OH-离子）引起，散射损耗主要由光纤的折射率不均匀引起。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "此描述符合光纤传输信号衰减的原理，吸收损耗常因材料杂质（像OH - 离子），散射损耗多源于折射率不均匀。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580447", "t": 3, "q": "信号传输中，码间串扰的产生仅与传输介质的带宽有限有关，与信号的调制方式、传输速率无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "码间串扰产生不仅与传输介质带宽有限有关，还和信号调制方式、传输速率等有关。不同调制方式频谱特性不同，传输速率过快也会使码元脉冲展宽导致串扰。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580448", "t": 3, "q": "信号传输中，曼彻斯特编码的每个码元中间都有一个跳变，该跳变既表示数据信息，又作为时钟同步信号，实现自同步，无需额外同步信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "曼彻斯特编码特点就是每个码元中间有跳变，此跳变能同时表示数据和提供时钟同步信号，可实现自同步，不用额外同步信号。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580449", "t": 3, "q": "信号传输中，同轴电缆的特性阻抗主要由内导体直径、外导体内径和介质介电常数决定，与电缆的长度和传输信号的频率无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "同轴电缆特性阻抗的确由内导体直径、外导体内径和介质介电常数决定，和电缆长度、传输信号频率无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580450", "t": 3, "q": "信号传输中，正交振幅调制（QAM）通过同时改变载波的幅度和相位来携带数字信息，相比幅移键控（ASK）或频移键控（FSK），在相同带宽下能传输更高的比特率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "QAM 确实是同时改变载波幅度和相位来携带信息，而 ASK 只改变幅度、FSK 只改变频率，QAM 能在相同带宽下利用幅度和相位组合传输更多信息，比特率更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803860987580451", "t": 3, "q": "信号传输中，阻抗匹配是指使传输线的特性阻抗与源阻抗、负载阻抗相等，此时信号在传输线两端无反射，信号能量全部传输到负载，无能量损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "阻抗匹配就是让传输线特性阻抗和源阻抗、负载阻抗相等，能消除反射，使信号能量全到负载，理论上无能量损失。", "ap": [false, false, false, false, false, false]}
