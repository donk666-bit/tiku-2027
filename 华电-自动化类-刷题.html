alse, false]}, {"id": "2034803713801064467", "t": 3, "q": "火电机组中测量烟气流量时，采用皮托管流量计的测量精度高于超声波流量计，因为其测量点更多，平均流速计算更准确。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在火电机组测量烟气流量时，超声波流量计测量精度高于皮托管流量计，皮托管易受磨损、积灰等影响，且安装位置有限测量点少，而超声波可多点测量平均流速。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064468", "t": 3, "q": "火电机组中测量主蒸汽流量时，采用标准孔板节流装置，若蒸汽压力升高，而差压不变，则实际流量会减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064469", "t": 3, "q": "开尔文温标（K）的零点为绝对零度（-273.15℃），且1K与1℃的温度间隔相等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "开尔文温标以绝对零度（-273.15℃）为零点，且开尔文与摄氏度的温度间隔是相等的，即温度变化1K和1℃是一样的。", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064470", "t": 3, "q": "某测量系统的最大允许误差为±0.2MPa，测量范围为0-20MPa，则该系统的精度等级为1.0级。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "精度等级计算是用最大允许误差除以量程再乘以 100% 。本题中（0.2÷20）×100% = 1% ，精度等级常以百分数表示，所以该系统精度等级为 1.0 级，此说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064471", "t": 3, "q": "某温度仪表的指示值为300℃，真值为300.3℃，则该仪表的示值误差为+0.3℃。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "示值误差 = 指示值 - 真值，本题中指示值300℃，真值300.3℃，示值误差为300 - 300.3 = -0.3℃，不是+0.3℃。所以答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064472", "t": 3, "q": "某压力仪表的量程为0-10MPa，精度等级为0.5级，则该仪表在5MPa测量点的最大允许误差为±0.05MPa。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "仪表精度等级 0.5 级，引用误差 = 最大允许绝对误差 / 量程 ×100%。<br />最大允许绝对误差 = 量程 × 精度等级 % =10MPa × 0.5% = ±0.05MPa。<br />压力仪表的最大允许误差按**全量程**计算，和被测点 5MPa 数值无关，所以该仪表任何测量点的最大允许误差均为 ±0.05MPa。题干表述正确。因此选 A。", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064473", "t": 3, "q": "汽轮机排汽温度测量中，采用多支热电偶并联测量的主要目的是提高测量精度，而非增加可靠性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多支热电偶并联测量主要是为增加可靠性，当其中一支损坏时不影响整体测量，并非提高测量精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064474", "t": 3, "q": "汽轮机排汽压力升高会导致排汽温度升高，因为排汽压力对应的饱和温度随压力升高而升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "汽轮机排汽是湿饱和蒸汽，其排汽温度与排汽压力下的饱和温度对应，排汽压力升高，对应的饱和温度自然升高，所以排汽温度也升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064475", "t": 3, "q": "汽轮机润滑油压力测量中，若润滑油温度升高，会导致测量值偏低，因为油温升高使油的粘度降低，压力损失增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064476", "t": 3, "q": "汽轮机轴承温度测量中，采用铂热电阻（PT100）的测量精度高于铜热电阻（Cu50），因为铂的电阻温度系数更稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "铂热电阻（PT100）的化学稳定性好，电阻温度系数更稳定，测量精度比铜热电阻（Cu50）高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064477", "t": 3, "q": "汽轮机轴承温度超过70℃时，应发出报警信号，超过80℃时应触发停机保护，以防止轴承损坏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在汽轮机运行中，通常轴承温度超过规定值会有相应保护动作。一般来说，规定轴承温度超70℃报警、超80℃触发停机保护是为了避免因轴承温度过高导致损坏等严重后果，该表述符合常见的汽轮机运行安全要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064478", "t": 3, "q": "汽轮机轴承振动测量中，振动速度的有效值（mm/s）是评价轴承振动烈度的主要指标，而非振动位移的峰峰值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在汽轮机轴承振动测量里，振动速度有效值是衡量轴承振动烈度的关键指标，不是振动位移峰峰值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064479", "t": 3, "q": "汽轮机轴向位移测量中，电涡流传感器的输出信号电压与传感器和转子之间的间隙成线性关系。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电涡流传感器输出信号电压和传感器与转子间间隙并非简单线性关系，而是在一定范围内近似线性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064480", "t": 3, "q": "汽轮机轴向位移测量中，若传感器安装倾斜，会导致测量值偏大，因为倾斜会使传感器感受到的位移大于实际轴向位移。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064481", "t": 3, "q": "汽轮机轴向位移的允许值通常为±0.5-1.0mm，若轴向位移超过允许值，会导致汽轮机动静部件摩擦损坏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "汽轮机轴向位移有一定允许范围，一般是±0.5 - 1.0mm 左右，当超过该范围，动静部件间的间隙改变，易引发摩擦损坏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064482", "t": 3, "q": "汽轮机转速保护系统中，当转速超过额定转速的110%（如3300r/min，额定3000r/min）时，应触发紧急停机保护。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在汽轮机转速保护系统里，为保障设备安全，当转速超过额定转速的110%时，会触发紧急停机保护，避免因转速过高引发危险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064483", "t": 3, "q": "汽轮机转速测量中，采用三套独立的转速传感器（如磁电式、光电式、电涡流式）进行冗余测量，可提高转速测量的可靠性，防止单传感器故障导致保护失效。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "使用三套独立不同原理的转速传感器进行冗余测量，当其中一个传感器出现故障时，另外两个仍能正常工作，可避免单传感器故障使保护失效，能提高转速测量可靠性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064484", "t": 3, "q": "汽轮机转速测量中，磁电式转速传感器无需外部电源供电，属于自发电型传感器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "磁电式转速传感器是基于电磁感应原理工作，转动时产生感应电动势，无需外部电源供电，是自发电型传感器。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064485", "t": 3, "q": "汽轮机转速测量中，光电式转速传感器的输出信号为脉冲信号，其脉冲频率与转速成正比，且不受环境温度的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064486", "t": 3, "q": "汽轮机转速测量中，若传感器与齿轮的间隙过小，会导致传感器磨损;而间隙过大，则会导致输出信号幅值减小，甚至无信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在汽轮机转速测量里，传感器与齿轮间隙过小，运转时易产生摩擦使传感器磨损；间隙过大，磁场变化弱，输出信号幅值会减小，过大时可能无信号。", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064487", "t": 3, "q": "热电偶的分度号（如K型、S型）由热电偶的材质决定，不同分度号的热电偶其热电势-温度特性不同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热电偶分度号的确由材质决定，不同材质的热电偶其热电势与温度的对应关系不同，即热电势 - 温度特性不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064488", "t": 3, "q": "热电偶的冷端温度补偿方法中，补偿导线的作用是将热电偶的冷端从现场迁移到温度稳定的控制室，而非直接补偿冷端温度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "补偿导线本质就是能把热电偶冷端移到温度稳定处，它本身不直接补偿冷端温度。", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064489", "t": 3, "q": "热电偶的冷端温度若高于0℃，且未进行补偿，会导致测量值偏高，因为冷端温度升高使热电势减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热电偶测量时，冷端温度高于0℃且未补偿，冷端温度升高热电势减小，测量值会偏低而非偏高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064490", "t": 3, "q": "热电偶温度计测量高温时，若保护套管损坏，会导致热电势减小，测量值偏低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064491", "t": 3, "q": "热电偶温度计的热电势大小仅与热电偶的材质和两端温度差有关，与热电偶的丝径无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热电偶的热电势由其材料特性和两端温度差决定，丝径不影响热电势大小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064492", "t": 3, "q": "热电偶温度计的热电势与温度呈线性关系，可直接通过热电势计算温度，无需修正。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热电偶温度计的热电势与温度并非严格线性关系，实际应用中通常需要进行修正。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064493", "t": 3, "q": "热电阻温度计采用三线制接线的主要目的是消除连接导线电阻变化对测量结果的影响，因为三线制可使导线电阻被引入电桥的相邻桥臂，相互抵消。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热电阻测量中，连接导线电阻会影响测量精度，三线制接线能让导线电阻分别接入电桥相邻桥臂，在电桥平衡计算时可相互抵消其影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064494", "t": 3, "q": "热电阻温度计采用四线制接线的主要目的是消除连接导线电阻的影响，适用于高精度测量场合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热电阻温度计采用四线制接线时，测量电流和测量电压分开，能有效消除连接导线电阻对测量结果的影响，常用于高精度测量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064495", "t": 3, "q": "热电阻温度计的测量范围由热电阻的材质决定，铂热电阻（PT100）的测量范围宽于铜热电阻（Cu50）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热电阻材质不同测量范围有差异，铂热电阻化学稳定性好等，能承受更高温度，测量范围比铜热电阻宽。", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064496", "t": 3, "q": "热电阻温度计的测量误差主要来源于热电阻的自热效应，即通过热电阻的电流过大导致其自身发热，使测量值偏高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热电阻温度计中，电流过大产生自热效应，热电阻自身发热，测量值会比实际值高，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064497", "t": 3, "q": "热电阻温度计的电阻温度系数是指温度每变化1℃时，热电阻阻值的变化量与0℃时阻值的比值，该系数越大，灵敏度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热电阻温度计电阻温度系数定义就是温度每变化1℃时热电阻阻值变化量与0℃时阻值比值，系数越大意味着温度微小变化会引起阻值更大变化，即灵敏度越高。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第4章 过程参数检测技术（2）", "n": "基础练习题【含解析】 / 第4章 过程参数检测技术（2）", "qs": [{"id": "2034803720683917312", "t": 1, "q": "下列哪种热电偶的热电势最大，灵敏度最高（如测量微小温度变化）?", "a": ["S型（铂铑10-铂）", "K型（镍铬-镍硅）", "E型（镍铬-铜镍）", "B型（铂铑30-铂铑6）", "", ""], "r": "C", "e": "不同类型热电偶中，E型热电偶的热电势大、灵敏度高，适合测量微小温度变化。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917313", "t": 1, "q": "下列哪种热电偶适用于测量中低温（-200℃至800℃），且线性度较好（如汽轮机低压缸温度）?", "a": ["K型（镍铬-镍硅）", "E型（镍铬-铜镍）", "B型（铂铑30-铂铑6）", "S型（铂铑10-铂）", "", ""], "r": "B", "e": "E型热电偶热电势大、灵敏度高，线性度好，适合测量中低温。K型适用于中高温；B型和S型适用于高温。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917314", "t": 1, "q": "下列哪种温标换算关系正确（T为开尔文温度，t为摄氏温度）?", "a": ["T=t+273.15", "T=t-273.15", "t=T-273.15", "t=(T-273.15)×9/5+32", "", ""], "r": "A", "e": "开尔文温度与摄氏温度的换算公式是T = t + 273.15 。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917315", "t": 1, "q": "下列哪种温标是我国法定计量单位中用于日常生活和工业测量的常用温标?", "a": ["摄氏温标", "开尔文温标", "华氏温标", "列氏温标", "", ""], "r": "A", "e": "我国法定计量单位中，日常生活和工业测量常用摄氏温标。开尔文温标多用于科学研究；华氏温标主要在美英等国使用；列氏温标使用较少。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917316", "t": 1, "q": "下列哪种温标在1标准大气压下，水的冰点为0℃，沸点为100℃?", "a": ["列氏温标", "摄氏温标", "华氏温标", "开尔文温标", "", ""], "r": "B", "e": "摄氏温标规定在1标准大气压下，水的冰点是0℃，沸点是100℃。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917317", "t": 1, "q": "下列哪种温标在我国不用于工业过程参数测量?", "a": ["开尔文温标", "华氏温标", "摄氏温标", "列氏温标", "", ""], "r": "D", "e": "我国工业过程参数测量常用摄氏温标，开尔文温标在科学研究等多领域有应用。华氏温标主要在美等国使用，列氏温标已较少使用，在我国工业过程参数测量中基本不用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917318", "t": 1, "q": "下列哪种温度测量仪表的测量原理基于\"不同金属导体组成的闭合回路，当两端温度不同时产生热电势\"?", "a": ["热电偶温度计", "辐射式温度计", "热电阻温度计", "双金属温度计", "", ""], "r": "A", "e": "热电偶温度计是基于“不同金属导体组成的闭合回路，当两端温度不同时产生热电势”原理工作。辐射式温度计利用热辐射原理；热电阻温度计基于导体电阻随温度变化特性；双金属温度计利用双金属片热膨胀不同原理。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917319", "t": 1, "q": "下列哪种压力测量仪表基于\"压电晶体在压力作用下产生电荷\"的原理?", "a": ["电容式压力传感器", "弹性式压力计", "压电式压力传感器", "应变式压力传感器", "", ""], "r": "C", "e": "压电式压力传感器是基于压电晶体在压力作用下产生电荷的原理工作的。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917320", "t": 1, "q": "下列哪种压力测量原理基于\"压力变化导致电容极板间距或面积变化，进而电容值变化\"?", "a": ["弹性式压力测量", "应变式压力测量", "压电式压力测量", "电容式压力测量", "", ""], "r": "D", "e": "电容式压力测量就是利用压力变化使电容极板间距或面积改变，从而导致电容值变化来测量压力。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917321", "t": 1, "q": "下列温标中，被国际计量大会确定为热力学温度基本温标，且其零点为绝对零度的是?", "a": ["摄氏温标（℃）", "开尔文温标（K）", "列氏温标（°Ré）", "华氏温标（℉）", "", ""], "r": "B", "e": "开尔文温标是国际计量大会确定的热力学温度基本温标，其零点是绝对零度。而摄氏、列氏、华氏温标都不是热力学温度基本温标。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917322", "t": 1, "q": "在火电机组过程参数测量中，某压力仪表多次测量同一稳定压力值，得到的测量值与真值的偏差呈现随机分布，且无法通过校准消除，该偏差属于哪种误差类型?", "a": ["系统误差", "粗大误差", "随机误差", "静态误差", "", ""], "r": "C", "e": "随机误差是指在重复性条件下，对同一被测量进行无限多次测量所得结果的平均值与被测量的真值之差，其特点是多次测量同一稳定值时，测量值与真值的偏差随机分布且无法通过校准消除。而系统误差可通过校准等方法消除，粗大误差是明显偏离实际值的误差，静态误差是在静态测量时的误差。所以该偏差属于随机误差。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917323", "t": 1, "q": "在火电机组自动化系统中，模拟信号（如4-20mA电流信号）从现场仪表传输至控制室时，常因电缆敷设路径与动力电缆平行导致干扰，该干扰类型属于?", "a": ["接地干扰", "共模干扰", "电磁感应干扰", "静电干扰", "", ""], "r": "C", "e": "电缆敷设路径与动力电缆平行，动力电缆产生的交变磁场会在信号电缆中感应出电动势，属于电磁感应干扰。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917324", "t": 1, "q": "在汽轮机凝汽器液位测量中，若凝汽器内存在大量蒸汽且温度较高，下列哪种液位测量方法可有效避免蒸汽对测量的影响?", "a": ["电容式液位测量", "浮筒式液位测量", "雷达式液位测量", "差压式液位测量（带冷凝罐）", "", ""], "r": "D", "e": "在汽轮机凝汽器液位测量中，当凝汽器内存在大量蒸汽且温度较高时，需要选择一种能够有效避免蒸汽对测量影响的液位测量方法。A. 电容式液位测量：电容式液位计通过测量电容的变化来确定液位，但在高温蒸汽环境中，电容式液位计可能受到干扰，影响测量准确性。B. 浮筒式液位测量：浮筒式液位计通过浮筒的位置变化来测量液位，但在高温蒸汽环境中，浮筒可能受到热膨胀的影响，导致测量误差。C. 雷达式液位测量：雷达式液位计利用电磁波反射原理测量液位，但在高温蒸汽环境中，电磁波可能受到干扰，影响测量准确性。D. 差压式液位测量（带冷凝罐）：差压式液位计通过测量液体产生的静压力来确定液位，带冷凝罐的设计可以有效冷凝蒸汽，避免蒸汽对测量的影响，因此在高温蒸汽环境中具有较高的测量准确性。综上所述，正确答案是D选项：“差压式液位测量（带冷凝罐）”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917325", "t": 1, "q": "在信号传输抗干扰技术中，\"采用平衡传输方式（如双绞线）\"的主要目的是?", "a": ["降低线路电阻", "抑制差模干扰", "提高传输速度", "抑制共模干扰", "", ""], "r": "D", "e": "平衡传输方式（如双绞线）可使两根线受干扰程度相近，能有效抑制共模干扰。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917326", "t": 1, "q": "在信号传输抗干扰技术中，\"采用屏蔽电缆并将屏蔽层两端接地\"的措施主要用于抑制哪种干扰?", "a": ["共模干扰", "电磁感应干扰", "差模干扰", "静电干扰", "", ""], "r": "A", "e": "屏蔽电缆屏蔽层两端接地可有效抑制共模干扰，共模干扰是在信号线与地之间传输的干扰。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917327", "t": 1, "q": "在信号传输抗干扰技术中，\"将信号电缆的屏蔽层一端接地，另一端悬空\"的接地方式主要用于抑制哪种干扰?", "a": ["共模干扰", "电磁感应干扰", "差模干扰", "静电干扰", "", ""], "r": "A", "e": "在信号传输抗干扰技术中，接地方式的选择对于抑制不同类型的干扰至关重要。首先，我们来了解题目中涉及的几种干扰类型：* 共模干扰：指信号线上共有的干扰信号，通常是由电磁干扰引起的，这种干扰同时作用于信号线的正负两极。* 电磁感应干扰：由于电磁场的变化而在导线中产生的感应电流，这种干扰通常通过电磁屏蔽来减少。* 差模干扰：指信号线正负两极之间的干扰，通常是由电路内部的噪声或外部电磁干扰引起的。* 静电干扰：由静电场引起的干扰，通常通过静电屏蔽和接地来减少。接下来，我们分析题目中的接地方式：“将信号电缆的屏蔽层一端接地，另一端悬空”。这种接地方式被称为单点接地或浮地接地，它主要用于抑制共模干扰。当信号线受到共模干扰时，由于屏蔽层的一端接地，干扰电流会通过接地线流入大地，从而减少对信号的干扰。而另一端悬空则可以防止干扰电流通过屏蔽层形成回路，进一步减少干扰。因此，正确答案是A.共模干扰。", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917328", "t": 1, "q": "在信号传输抗干扰技术中，“在信号电缆两端并联电容”的措施主要用于抑制哪种干扰?", "a": ["高频干扰", "共模干扰", "静电干扰", "低频干扰", "", ""], "r": "A", "e": "电容对高频信号有旁路作用，在信号电缆两端并联电容可将高频干扰信号旁路到地，从而抑制高频干扰。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917329", "t": 1, "q": "在信号传输抗干扰技术中，“在信号回路中串联电感”的措施主要用于抑制哪种干扰?", "a": ["低频干扰", "静电干扰", "高频干扰", "共模干扰", "", ""], "r": "C", "e": "电感对不同频率信号的阻抗不同，对高频信号阻抗大，能抑制高频信号通过，“在信号回路中串联电感”主要用于抑制高频干扰。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917330", "t": 1, "q": "在信号传输抗干扰技术中，\"在仪表电源端加装电源滤波器\"的主要目的是?", "a": ["稳定仪表输出信号", "提高电源电压", "抑制电源引入的干扰", "抑制信号传输干扰", "", ""], "r": "C", "e": "电源滤波器主要作用是过滤电源中的干扰信号，在仪表电源端加装就是为抑制电源引入的干扰。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917331", "t": 1, "q": "在信号传输中，\"将现场仪表的信号地与控制室的接地系统分开，不共地\"的接地方式称为?", "a": ["单点接地", "浮地", "多点接地", "屏蔽接地", "", ""], "r": "B", "e": "浮地是将现场仪表信号地与控制室接地系统分开不共地；单点接地是所有电路的地线接到公共点；多点接地是多个接地点；屏蔽接地主要是针对屏蔽层接地。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917332", "t": 1, "q": "在信号传输中，4-20mA电流信号相比0-10V电压信号的主要优势是?", "a": ["测量精度更高", "传输距离更远", "抗干扰能力更强", "线路损耗更小", "", ""], "r": "C", "e": "在信号传输中，4-20mA电流信号与0-10V电压信号相比，主要的优势体现在抗干扰能力上。电流信号在传输过程中，其大小不会受到线路电阻、接触电阻等因素的影响，因此能够保持信号的稳定性和准确性。相比之下，电压信号在传输过程中容易受到线路电阻、接触电阻等因素的影响，从而导致信号衰减和失真。此外，电流信号还具有一定的抗电磁干扰能力，能够在复杂的电磁环境中保持信号的稳定性。因此，正确答案是C.抗干扰能力更强。", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917333", "t": 1, "q": "在信号传输中，采用\"信号隔离器\"的主要目的是?", "a": ["抑制共模干扰", "提高信号幅值", "转换信号类型", "延长传输距离", "", ""], "r": "A", "e": "信号隔离器主要作用是将输入信号进行隔离，有效抑制共模干扰。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917334", "t": 1, "q": "在信号传输中，采用双绞线传输4-20mA模拟信号，相比单芯线，其主要优势是?", "a": ["抑制共模干扰", "抑制差模干扰", "传输距离更远", "降低线路损耗", "", ""], "r": "A", "e": "双绞线能将两根导线扭在一起，使它们受外界干扰的情况相似，可有效抑制共模干扰，而单芯线无此优势。答案：A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917335", "t": 1, "q": "在信号传输中，若信号电缆长度超过1000米，下列哪种信号类型更适合传输?", "a": ["模拟信号（mV级）", "0-10V电压信号", "数字信号（RS485）", "4-20mA电流信号", "", ""], "r": "C", "e": "模拟信号（mV级）和0 - 10V电压信号抗干扰能力弱，长距离传输易衰减。4 - 20mA电流信号适合一定距离传输，但距离远不如数字信号。RS485数字信号抗干扰能力强、传输距离远，适合超1000米传输。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917336", "t": 1, "q": "在信号传输中，数字信号（如RS485）相比模拟信号（4-20mA）的主要优势是?", "a": ["接线更简单", "测量精度更高", "传输距离更远", "抗干扰能力更强", "", ""], "r": "D", "e": "数字信号在传输过程中以离散的二进制代码表示信息，受外界干扰时不容易失真，抗干扰能力比模拟信号强。接线简单、测量精度高、传输距离远并非数字信号相对模拟信号的主要优势。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917337", "t": 1, "q": "在液位测量中，\"测量范围受安装高度限制，无法测量过高液位\"是下列哪种方法的局限性?", "a": ["差压式液位测量", "浮筒式液位测量", "雷达式液位测量", "电容式液位测量", "", ""], "r": "B", "e": "浮筒式液位测量的浮筒需安装在一定高度，测量范围受此安装高度限制，难以测量过高液位。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917338", "t": 1, "q": "在液位测量中，\"当液体密度发生变化时，测量结果会产生偏差\"是下列哪种液位测量方法的主要局限性?", "a": ["浮子式液位测量", "超声波式液位测量", "差压式液位测量", "雷达式液位测量", "", ""], "r": "C", "e": "差压式液位测量原理与液体密度相关，密度变化会使差压与液位对应关系改变，导致测量偏差。而浮子式、超声波式、雷达式受液体密度变化影响小。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917339", "t": 1, "q": "在液位测量中，差压式液位计若测量的是敞口容器液位，其负压端应?", "a": ["接容器底部", "接容器顶部（通大气）", "封闭", "接其他容器", "", ""], "r": "B", "e": "对于敞口容器液位测量，差压式液位计负压端需通大气，这样才能准确测量液位产生的压力差。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917340", "t": 1, "q": "在液位测量中，差压式液位计若负压端导压管堵塞，会导致测量值?", "a": ["偏低", "不变", "波动", "偏高", "", ""], "r": "D", "e": "差压式液位计测量液位基于两端压力差。负压端导压管堵塞，负压端压力增大，差压减小，但仪表会误判差压增大，从而使测量值偏高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917341", "t": 1, "q": "在液位测量中，超声波液位计若用于测量含大量泡沫的液体液位，会导致测量值?", "a": ["无规律波动", "偏高", "偏低", "不变", "", ""], "r": "B", "e": "超声波遇到泡沫会发生散射、反射等，部分信号无法正常传播到液面再返回，使接收到的信号延迟或减弱，导致测量的液位比实际液位偏高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917342", "t": 1, "q": "在液位测量中，导波雷达液位计与普通雷达液位计相比，其主要优势是?", "a": ["可测量有搅拌或泡沫的介质", "不受介质介电常数影响", "安装要求更低", "测量精度更高", "", ""], "r": "A", "e": "导波雷达液位计通过导波杆等引导微波传播，能更好应对有搅拌或泡沫的介质，普通雷达液位计易受这些情况干扰。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917343", "t": 1, "q": "在液位测量中，电容式液位计的测量原理是基于\"液体与气体的哪种物理参数差异\"?", "a": ["折射率", "介电常数", "导热系数", "密度", "", ""], "r": "B", "e": "电容式液位计是利用液体和气体介电常数不同，液位变化时会导致电容值改变来测量液位。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917344", "t": 1, "q": "在液位测量中，电容式液位计若测量的液体介电常数随温度变化，会导致测量值?", "a": ["不变", "波动", "偏高", "偏低", "", ""], "r": "B", "e": "电容式液位计测量原理与液体介电常数有关，介电常数随温度变化，测量值会不稳定而波动。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917345", "t": 1, "q": "在液位测量中，浮筒式液位计若浮筒被腐蚀导致重量减轻，会使测量值?", "a": ["不变", "波动", "偏低", "偏高", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917346", "t": 1, "q": "在液位测量中，浮子式液位计若浮子被卡住，会导致测量值?", "a": ["不变", "偏低", "偏高", "跳跃", "", ""], "r": "A", "e": "浮子式液位计靠浮子随液位变化来测量液位，浮子被卡住就不能随液位变化而移动，其指示的测量值就不会改变。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917347", "t": 1, "q": "在液位测量中，雷达液位计的测量范围主要受哪种因素限制?", "a": ["介质密度", "安装高度", "介质介电常数", "环境温度", "", ""], "r": "C", "e": "这道题问的是在液位测量中，雷达液位计的测量范围主要受哪种因素的限制。首先，我们来了解一下雷达液位计的工作原理。雷达液位计是通过发射微波信号，然后接收从液面反射回来的信号来测量液位的。这个过程中，微波信号的传播和反射情况会受到介质特性的影响。现在，我们逐项看一下各个选项：A. 介质密度：虽然介质密度会对微波信号的传播有一定影响，但它并不是雷达液位计测量范围的主要限制因素。B. 安装高度：安装高度主要影响的是测量的起点，而对测量范围本身的影响有限。C. 介质介电常数：介质的介电常数直接影响微波信号的反射强度。如果介质的介电常数过低或过高，都可能导致微波信号反射不佳，从而影响雷达液位计的测量准确性和范围。因此，这是影响雷达液位计测量范围的关键因素。D. 环境温度：环境温度主要影响设备的稳定性和寿命，而对测量范围的直接影响相对较小。综上所述，介质介电常数是影响雷达液位计测量范围的主要因素。所以，正确答案是C选项：“介质介电常数”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917348", "t": 1, "q": "在液位测量中，雷达液位计若用于测量挥发性强的液体（如氨水溶液），会导致测量值?", "a": ["偏高", "偏低", "准确", "无规律", "", ""], "r": "A", "e": "挥发性强的液体会在液面上形成蒸汽层，雷达波在蒸汽层中传播速度改变，使测量的距离变长，导致测量值偏高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917349", "t": 1, "q": "CEMS（烟气排放连续监测系统）中，测量烟气中二氧化硫浓度时，常用的差分吸收光谱法（DOAS）的核心原理是?", "a": ["基于气体浓度与电容值的关系", "基于气体浓度与导热系数的关系", "基于不同气体对特定波长光的吸收强度差异", "基于气体浓度与折射率的关系", "", ""], "r": "C", "e": "差分吸收光谱法（DOAS）是利用不同气体对特定波长光的吸收强度差异来测量气体浓度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917350", "t": 1, "q": "CEMS中，为保证测量数据的准确性，需定期对仪表进行校准，下列哪种校准方式属于\"动态校准\"?", "a": ["用标准气体通入仪表进行校准", "用标准电阻模拟信号进行校准", "用标准电压信号进行校准", "用标准电流表进行校准", "", ""], "r": "A", "e": "动态校准需在实际运行状态下用真实物质输入来校准。A选项用标准气体通入仪表，模拟真实测量环境下气体的流动和反应，属于动态校准；B、C、D是用电学标准模拟信号校准，未涉及实际物质输入，不是动态校准。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917351", "t": 1, "q": "CEMS中，为去除烟气中的水分和粉尘，在分析仪前通常设置哪种预处理装置?", "a": ["加热器和风扇", "泵和阀门", "流量计和压力表", "过滤器和冷凝器", "", ""], "r": "D", "e": "过滤器可去除烟气中的粉尘，冷凝器能去除烟气中的水分，符合去除水分和粉尘的需求。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917352", "t": 1, "q": "CEMS中，下列哪种参数不属于必测的烟气排放参数?", "a": ["氮氧化物", "颗粒物", "二氧化硫", "二氧化碳", "", ""], "r": "D", "e": "CEMS主要监测对大气环境有重要影响的污染物，氮氧化物、颗粒物、二氧化硫是常见污染物，属于必测参数。二氧化碳虽影响气候，但通常不是CEMS必测的烟气排放参数。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917353", "t": 1, "q": "CEMS中，烟气采样系统的加热管线温度通常需控制在多少以上，以防止烟气中的水分冷凝?", "a": ["80℃", "120℃", "150℃", "100℃", "", ""], "r": "B", "e": "为防止烟气中水分冷凝，CEMS烟气采样系统加热管线温度一般要控制在120℃以上。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917354", "t": 1, "q": "CEMS中，氧化锆氧量计的工作温度通常需要控制在多少以上，以保证其正常工作?", "a": ["800℃", "600℃", "700℃", "500℃", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917355", "t": 1, "q": "CEMS中测量烟气含湿量时，常用的冷凝法的测量原理是?", "a": ["通过冷却烟气使水汽冷凝，测量冷凝水量计算含湿量", "通过测量烟气的相对湿度和温度计算含湿量", "通过测量烟气的介电常数计算含湿量", "通过测量烟气的导热系数计算含湿量", "", ""], "r": "A", "e": "冷凝法是将烟气冷却使水汽冷凝，通过测量冷凝水量来计算烟气含湿量。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917356", "t": 1, "q": "CEMS中测量烟气流量时，若烟气成分变化导致流速分布不均匀，会影响哪种流量计的测量精度?", "a": ["电磁流量计", "皮托管流量计", "涡街流量计", "椭圆齿轮流量计", "", ""], "r": "B", "e": "皮托管流量计测量原理依赖于烟气流速分布均匀，流速分布不均匀会影响其测量精度。而电磁流量计测导电性流体，涡街流量计基于流体振荡，椭圆齿轮流量计用于测量液体，它们受烟气流速分布影响小。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917357", "t": 1, "q": "CEMS中测量烟气温度时，为避免烟气中粉尘对传感器的磨损，通常采用哪种安装方式?", "a": ["螺纹式固定", "直接插入式（带保护套管）", "间接接触式", "法兰式固定", "", ""], "r": "B", "e": "为避免粉尘磨损传感器，采用带保护套管的直接插入式可保护传感器，同时能准确测量烟气温度。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917358", "t": 1, "q": "CEMS中测量烟气中氮氧化物（NOx）浓度时，常用的化学发光法（CLD）的核心原理是?", "a": ["NOx的电容值与浓度成正比", "NOx与臭氧反应产生荧光，荧光强度与浓度成正比", "NOx对特定波长光的吸收强度与浓度成正比", "NOx的导热系数与浓度成正比", "", ""], "r": "B", "e": "化学发光法（CLD）测NOx是基于NO与臭氧反应产生荧光，荧光强度和NOx浓度成正比。A选项电容值与浓度无关；C是分光光度法原理；D是热导法原理。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917359", "t": 1, "q": "CEMS中测量烟气中二氧化硫浓度时，若烟气中存在高浓度粉尘，会影响哪种测量方法的精度?", "a": ["红外吸收法", "紫外荧光法", "电化学法", "差分吸收光谱法（DOAS）", "", ""], "r": "A", "e": "高浓度粉尘会对光的传播产生散射、吸收等影响，红外吸收法是基于对特定波长红外光吸收来测浓度，粉尘会干扰红外光传播和吸收测量。而紫外荧光法、电化学法、差分吸收光谱法受粉尘影响相对较小。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917360", "t": 1, "q": "CEMS中测量烟气中颗粒物浓度时，常用的β射线吸收法的原理是?", "a": ["颗粒物对β射线的吸收量与浓度成正比", "颗粒物的β射线辐射强度与浓度成正比", "颗粒物对β射线的反射量与浓度成正比", "颗粒物的β射线穿透率与浓度成正比", "", ""], "r": "A", "e": "β射线吸收法原理是颗粒物对β射线有吸收作用，吸收量和颗粒物浓度成正比。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034803720683917361", "t": 1, "q": "CEMS中测量烟气中氧气浓度时，常用的氧化锆氧量计的核心部件是?", "a": ["氧化锆陶瓷管", "加热丝", "过滤器", "铂电极", "", ""], "r": "A", "e": "氧化锆氧量计利用氧化锆陶瓷管在高温下的氧离子传导特性来测量氧气浓度，它是核心部件。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891520", "t": 2, "q": "下列哪些压力测量仪表属于电测式压力仪表?", "a": ["弹簧管压力计", "压电式压力传感器", "电容式压力传感器", "应变式压力传感器", "", ""], "r": "BCD", "e": "电测式压力仪表是利用压力作用下产生的电信号来测量压力。压电、电容、应变式压力传感器都是基于电信号变化测压力，而弹簧管压力计是利用弹性元件变形测压力，不属于电测式。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891521", "t": 2, "q": "下列哪些压力仪表可用于测量\"脉动压力\"（如汽轮机进汽压力波动），且误差较小?", "a": ["弹簧管压力计（机械阻尼大）", "电容式压力传感器（抗干扰强）", "应变式压力传感器（动态特性好）", "压电式压力传感器（响应频率高）", "", ""], "r": "CD", "e": "测量脉动压力需仪表有良好动态响应。弹簧管压力计机械阻尼大，响应慢；电容式压力传感器抗干扰强但非测量脉动关键；应变式压力传感器动态特性好可测脉动压力；压电式压力传感器响应频率高，适合测快速变化的脉动压力。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891522", "t": 2, "q": "下列哪些氧量计可用于火电机组锅炉烟气含氧量测量?", "a": ["磁氧分析仪", "氧化锆氧量计", "电化学氧量计", "红外吸收式氧量计", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891523", "t": 2, "q": "下列哪些因素会导致测量仪表的粗大误差?", "a": ["仪表突然受到冲击", "测量环境突发干扰", "仪表校准不准确", "操作人员读数错误", "", ""], "r": "ABD", "e": "粗大误差是明显超出规定条件下预期的误差，仪表突然受冲击、测量环境突发干扰、操作人员读数错误都会使测量结果出现明显偏差形成粗大误差；而仪表校准不准确属于系统误差。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891524", "t": 2, "q": "下列哪些因素会导致热电阻温度计的\"自热误差\"，即热电阻自身发热影响测量?", "a": ["环境温度过高（散热条件差）", "被测介质流速过低（散热差）", "热电阻阻值过大（如PT1000）", "通过热电阻的电流过大（通常超过10mA）", "", ""], "r": "ABD", "e": "热电阻“自热误差”与散热和自身发热有关。环境温度高、介质流速低会使散热差；通过电流大，根据焦耳定律热电阻自身发热多，都会导致“自热误差”。而热电阻阻值大小不是导致“自热误差”的直接因素。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891525", "t": 2, "q": "下列哪些因素会影响电容式压力传感器的测量精度?", "a": ["安装应力变化", "介质介电常数变化", "环境温度变化", "环境湿度变化", "", ""], "r": "ABC", "e": "电容式压力传感器的测量精度可能受多种因素影响。以下是对各选项的A. 安装应力变化：安装过程中产生的应力可能导致传感器结构变形，从而影响电容值和测量精度。B. 介质介电常数变化：电容式传感器的测量原理依赖于介质的介电常数。如果介质介电常数发生变化，会直接影响传感器的电容值和测量精度。C. 环境温度变化：温度变化会导致传感器材料的尺寸和介电常数发生变化，从而影响电容值和测量精度。D. 环境湿度变化：虽然湿度变化可能对某些电子设备和传感器有影响，但对电容式压力传感器的影响相对较小，主要影响在于可能导致传感器表面形成水膜，从而影响测量精度，但这种影响相比于其他因素较小。综合上述分析，影响电容式压力传感器测量精度的主要因素包括安装应力变化、介质介电常数变化和环境温度变化。所以，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891526", "t": 2, "q": "下列哪些因素会影响热电阻温度计的测量精度?", "a": ["被测介质的流速", "热电阻的自热效应", "环境温度变化", "连接导线的电阻变化", "", ""], "r": "BCD", "e": "热电阻温度计测量精度受多种因素影响。自热效应会使热电阻自身温度改变，影响测量；环境温度变化会干扰测量结果；连接导线电阻变化会使测量值产生偏差。而被测介质流速一般不直接影响热电阻温度计测量精度。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891527", "t": 2, "q": "下列哪些因素会影响压电式压力传感器的测量精度?", "a": ["被测压力的频率", "环境湿度变化", "电源电压波动", "环境温度变化", "", ""], "r": "ACD", "e": "压电式压力传感器受环境温度变化影响，会产生热释电效应影响测量精度；电源电压波动会干扰传感器信号处理，影响测量；被测压力频率超出范围也会使测量不准确。环境湿度变化对其影响相对较小。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891528", "t": 2, "q": "在火电机组测量误差处理中，下列哪些方法可用于消除或减小系统误差?", "a": ["采用修正公式进行补偿", "多次测量取平均值", "仪表定期校准", "改进测量方法（如更换测量原理）", "", ""], "r": "ACD", "e": "系统误差可通过特定方法消除或减小。采用修正公式补偿能校正已知误差；仪表定期校准可确保测量准确，减少因仪表不准确产生的误差；改进测量方法能避免原方法带来的系统误差。而多次测量取平均值主要是减小随机误差。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891529", "t": 2, "q": "在火电机组过程参数测量中，随机误差的基本特性包括下列哪些?", "a": ["有界性（误差绝对值不会超过一定范围）", "对称性（正负误差出现概率相等）", "抵偿性（多次测量后误差平均值趋近于零）", "单峰性（误差绝对值越小，出现概率越大）", "", ""], "r": "ABCD", "e": "随机误差具有有界性、对称性、抵偿性和单峰性等基本特性。有界性指误差绝对值不会超一定范围；对称性是正负误差出现概率相等；抵偿性为多次测量后误差平均值趋近于零；单峰性是误差绝对值越小出现概率越大。ABCD选项均符合随机误差特性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891530", "t": 2, "q": "在温标换算中，下列哪些换算关系正确（T为开尔文，t为摄氏，tF为华氏）?", "a": ["tF=1.8t+32", "T=t+273.15", "t=(tF-32)/1.8", "t=T-273.15", "", ""], "r": "ABCD", "e": "温标换算中，华氏温度和摄氏温度换算关系为tF = 1.8t + 32，变形可得t=(tF - 32)/1.8；摄氏温度和开尔文温度换算关系为T=t + 273.15，变形可得t=T - 273.15。ABCD选项换算关系均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891531", "t": 2, "q": "在信号传输抗干扰技术中，\"接地系统\"的设计要求包括下列哪些?", "a": ["信号地、电源地、保护地分开设置（避免相互干扰）", "接地线截面积≥2.5mm²（减少接地电阻）", "接地电阻≤4Ω（保证接地效果）", "采用单点接地（高频信号）或多点接地（低频信号）", "", ""], "r": "ABCD", "e": "接地系统设计中，为避免干扰信号地、电源地、保护地应分开；足够的接地线截面积可减少接地电阻，一般要求≥2.5mm²；接地电阻≤4Ω能保证接地效果；不同频率信号采用不同接地方式，高频单点、低频多点。ABCD选项均是“接地系统”设计要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891532", "t": 2, "q": "在信号传输抗干扰技术中，\"滤波技术\"的类型包括下列哪些，适用于不同干扰频率?", "a": ["高通滤波器（抑制低频干扰）", "低通滤波器（抑制高频干扰）", "带阻滤波器（抑制特定频率干扰）", "带通滤波器（只允许特定频率信号通过）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891533", "t": 2, "q": "在信号传输抗干扰技术中，屏蔽电缆的屏蔽层类型包括下列哪些，适用于不同干扰场景?", "a": ["编织屏蔽层（抗低频干扰）", "复合屏蔽层（编织+铝箔，抗宽频干扰）", "铜带屏蔽层（抗强电磁干扰）", "铝箔屏蔽层（抗高频干扰）", "", ""], "r": "ABCD", "e": "不同屏蔽层有不同特性，编织屏蔽层适合抗低频干扰，复合屏蔽层结合编织与铝箔能抗宽频干扰，铜带屏蔽层可抗强电磁干扰，铝箔屏蔽层利于抗高频干扰。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891534", "t": 2, "q": "在信号传输抗干扰技术中，下列哪些措施可用于抑制差模干扰?", "a": ["在信号回路中加装滤波器", "提高信号幅值", "缩短信号传输距离", "采用双绞线传输信号", "", ""], "r": "AD", "e": "答案：AD差模干扰是信号线之间的干扰。A 选项，在信号回路中加装滤波器可滤除特定频率的干扰信号，包括差模干扰。D 选项，采用双绞线传输信号，两根线产生的磁场相互抵消，能抑制差模干扰。B 选项，提高信号幅值不能抑制干扰。C 选项，缩短信号传输距离可减少干扰的影响程度，但不属于抑制差模干扰的措施。", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891535", "t": 2, "q": "在信号传输抗干扰技术中，下列哪些措施可用于抑制电磁感应干扰?", "a": ["信号电缆与动力电缆保持安全距离", "采用屏蔽电缆并两端接地", "在信号回路中加装滤波器", "采用双绞线传输信号", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891536", "t": 2, "q": "在信号传输抗干扰技术中，下列哪些措施可用于抑制共模干扰?", "a": ["使用信号隔离器", "采用平衡传输（双绞线）", "采用浮地接地方式", "在信号端并联电容", "", ""], "r": "ABC", "e": "信号隔离器可切断共模干扰的传播路径，平衡传输能使共模干扰相互抵消，浮地接地可避免地环路引入共模干扰，而在信号端并联电容主要用于滤波等，对抑制共模干扰作用不大。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891537", "t": 2, "q": "在信号传输抗干扰技术中，下列哪些措施可用于抑制静电干扰?", "a": ["在仪表外壳接地", "采用绝缘材料包裹电缆", "保持信号电缆与带电体的距离", "采用屏蔽电缆并单端接地", "", ""], "r": "ACD", "e": "信号传输抗干扰技术中，抑制静电干扰主要涉及到如何避免或减少静电的积累和放电对信号的影响。A选项提到“在仪表外壳接地”，这是正确的。接地可以提供一个低阻抗的路径，使静电能够迅速泄放，从而减少静电的积累。B选项“采用绝缘材料包裹电缆”实际上可能会增加静电的积累，因为绝缘材料不容易导电，静电不易泄放。C选项“保持信号电缆与带电体的距离”也是有效的抑制静电干扰的方法。通过增加距离，可以减少静电场的影响，降低放电的可能性。D选项“采用屏蔽电缆并单端接地”同样正确。屏蔽电缆可以有效地阻挡外部静电场的影响，而单端接地则能确保屏蔽层上的静电能够顺利泄放。综上所述，A、C、D选项都是抑制静电干扰的有效措施，而B选项则不是。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891538", "t": 2, "q": "在信号传输中，下列哪些属于\"模拟信号\"的缺点?", "a": ["抗干扰能力弱（易受电磁影响）", "传输距离短（信号衰减大）", "无法进行数据校验（无错误检测）", "易受量化误差影响（数字转换时）", "", ""], "r": "ABC", "e": "模拟信号波形易受电磁干扰、传输中信号衰减大也限制了传输距离，且没有错误检测机制不能进行数据校验。而量化误差是数字信号处理中模拟信号转数字信号时的问题，并非模拟信号本身缺点。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891539", "t": 2, "q": "在信号传输中，下列哪些属于\"信号调理\"的内容，以提高测量精度?", "a": ["信号滤波（去除干扰信号）", "信号隔离（消除地电位差）", "信号放大（将mV级信号放大至标准信号）", "信号转换（如电流信号转电压信号）", "", ""], "r": "ABCD", "e": "信号调理是为提高测量精度对原始信号进行处理，A滤波可去除干扰、B隔离能消除地电位差、C放大可将小信号放大到标准范围、D转换可满足不同需求，这些都是常见信号调理内容。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891540", "t": 2, "q": "在信号传输中，下列哪些属于4-20mA电流信号的优点?", "a": ["传输距离较远", "可实现两线制供电", "抗干扰能力强", "易受线路电阻影响", "", ""], "r": "ABC", "e": "4 - 20mA电流信号传输距离远，能两线制供电，抗干扰能力强，不易受线路电阻影响。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891541", "t": 2, "q": "在信号传输中，下列哪些属于数字信号传输的特点?", "a": ["抗干扰能力强", "可进行数据校验", "易实现多路传输", "传输距离远", "", ""], "r": "ABC", "e": "数字信号通过二进制编码传输，抗干扰能力强，能通过特定算法进行数据校验，还可采用时分复用等技术易实现多路传输，不过它本身传输距离并不远，需中继设备。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891542", "t": 2, "q": "在信号传输中，下列哪些属于RS485数字信号的特点?", "a": ["传输距离可达1200米", "半双工通信", "抗干扰能力强", "可连接32个节点", "", ""], "r": "ABCD", "e": "RS485是工业上常用的通信接口标准。它采用差分传输，抗干扰能力强；支持半双工通信；理论上一条总线上可连接32个节点；传输距离可达1200米。ABCD选项均符合RS485数字信号特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891543", "t": 2, "q": "在液位测量中，差压式液位计的安装注意事项包括下列哪些?", "a": ["正负压端导压管长度一致（减少温度影响）", "测量粘稠介质时，加装隔离罐（防止导压管堵塞）", "测量汽液两相介质时，负压端加装冷凝罐（平衡温度）", "安装位置远离搅拌器（避免压力波动）", "", ""], "r": "ABCD", "e": "A选项保证正负压端导压管长度一致可减少温度对测量的影响；B选项测量粘稠介质时加装隔离罐能防止导压管堵塞；C选项测量汽液两相介质时，负压端加冷凝罐可平衡压力；D选项安装位置远离搅拌器可避免压力波动影响测量。ABCD四个选项均是差压式液位计安装的注意事项。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891544", "t": 2, "q": "在液位测量中，电容式液位计的选型需考虑下列哪些介质特性?", "a": ["介质腐蚀性（选择耐腐蚀材质）", "介质介电常数（影响电容变化量）", "介质温度（选择耐高温电极）", "介质粘度（避免电极粘污）", "", ""], "r": "ABCD", "e": "电容式液位计选型要综合考虑介质多方面特性，腐蚀性影响材质选择，介电常数关系电容变化，温度影响电极耐高温性能，粘度可能造成电极粘污。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891545", "t": 2, "q": "在液位测量中，浮筒式液位计的维护要点包括下列哪些?", "a": ["检查浮筒连接部件（防止松动导致卡涩）", "检查导向装置（确保浮筒垂直移动）", "定期清理浮筒表面（防止结垢影响浮力）", "校准浮筒的零点和量程（避免漂移）", "", ""], "r": "ABCD", "e": "浮筒式液位计维护时，检查连接部件可防松动卡涩，检查导向装置能保证浮筒垂直移动，清理浮筒表面可防结垢影响浮力，校准零点和量程可避免漂移。ABCD选项都是其维护要点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891546", "t": 2, "q": "在液位测量中，雷达液位计的选型需考虑下列哪些因素?", "a": ["容器压力（选择耐压型仪表）", "容器内障碍物（避免信号遮挡）", "介质温度（选择耐高温天线）", "介质介电常数（≥1.8，保证反射信号）", "", ""], "r": "ABCD", "e": "雷达液位计选型时，容器压力高要选耐压型，有障碍物会遮挡信号需考虑，介质温度高要选耐高温天线，介质介电常数需≥1.8 保证反射信号，ABCD 因素都要考虑。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891547", "t": 2, "q": "在液位测量中，下列哪些方法的测量范围不受容器高度限制?", "a": ["电容式液位测量", "超声波式液位测量", "雷达式液位测量", "差压式液位测量", "", ""], "r": "BC", "e": "这道题问的是在液位测量中，哪些方法的测量范围不受容器高度限制。我们来看每一个选项：A. 电容式液位测量：这种测量方式是通过测量电容的变化来反映液位的高低。但电容式液位计的测量范围会受到容器形状、介质特性等因素的影响，特别是容器高度可能会对其产生影响。B. 超声波式液位测量：超声波液位计是通过发射超声波并接收反射回来的波来计算液位的。只要超声波能够穿透容器并正确反射回来，其测量范围就不受容器高度的限制。C. 雷达式液位测量：雷达液位计使用电磁波来测量液位，其工作原理与超声波类似，也是通过发射并接收反射波来计算液位。因此，雷达式液位测量的范围同样不受容器高度的限制。D. 差压式液位测量：差压式液位计是通过测量液柱产生的压力差来确定液位的。显然，这种方式会受到容器高度的限制，因为液柱的高度直接决定了压力差的大小。综合上述分析，我们可以得出结论：超声波式液位测量（B）和雷达式液位测量（C）的方法测量范围不受容器高度限制。所以，正确答案是BC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891548", "t": 2, "q": "在液位测量中，下列哪些方法的测量结果受介质介电常数变化影响?", "a": ["电容式液位测量", "差压式液位测量", "雷达式液位测量", "超声波式液位测量", "", ""], "r": "AC", "e": "电容式液位测量是基于电容与介电常数相关，介电常数变化会影响测量结果；雷达式液位测量利用电磁波反射，介质介电常数变化会影响电磁波传播，进而影响测量。差压式靠压力差测量，超声波式靠超声波传播测量，不受介质介电常数影响。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891549", "t": 2, "q": "在液位测量中，下列哪些方法的测量结果受介质密度变化影响?", "a": ["差压式液位测量", "雷达式液位测量", "浮筒式液位测量", "电容式液位测量", "", ""], "r": "AC", "e": "差压式和浮筒式液位测量原理与介质密度相关，密度变化会影响测量结果；雷达式靠电磁波、电容式靠电容量变化测量，不受介质密度影响。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891550", "t": 2, "q": "在液位测量中，下列哪些方法可用于测量有搅拌的液体液位（如浆液罐液位）?", "a": ["电容式液位测量", "浮子式液位测量", "雷达式液位测量", "差压式液位测量", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891551", "t": 2, "q": "在液位测量中，下列哪些方法适用于\"易挥发液体\"的液位测量（如氨水储罐）?", "a": ["电容式液位测量（密封电极，防挥发气体腐蚀）", "雷达式液位测量（非接触，不受挥发影响）", "浮筒式液位测量（密封浮筒，防挥发影响浮力）", "差压式液位测量（带隔离罐，防挥发气体进入仪表）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891552", "t": 2, "q": "在液位测量中，下列哪些方法适用于测量腐蚀性液体的液位（如脱硫浆液液位）?", "a": ["浮筒式液位测量（耐腐蚀材质）", "电容式液位测量（耐腐蚀电极）", "雷达式液位测量", "差压式液位测量（耐腐蚀膜片）", "", ""], "r": "ABCD", "e": "ABCD选项中的测量方法通过采用耐腐蚀材质或部件，都能用于测量腐蚀性液体液位。浮筒用耐腐蚀材质、电容式用耐腐蚀电极、雷达式不受液体腐蚀性影响、差压式用耐腐蚀膜片。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891553", "t": 2, "q": "在液位测量中，下列哪些方法适用于测量高温液体的液位（如锅炉汽包液位）?", "a": ["浮筒式液位测量（耐高温材质）", "差压式液位测量（带冷凝罐）", "雷达式液位测量", "电容式液位测量（耐高温电极）", "", ""], "r": "ABCD", "e": "浮筒式用耐高温材质可测高温液体；差压式带冷凝罐能避免高温影响；雷达式非接触测量不受高温影响；电容式用耐高温电极也可测高温。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891554", "t": 2, "q": "在液位测量中，下列哪些方法适用于测量高压容器的液位（如锅炉汽包液位）?", "a": ["浮筒式液位测量", "电容式液位测量", "雷达式液位测量", "差压式液位测量（带冷凝罐）", "", ""], "r": "CD", "e": "在液位测量中，针对高压容器（如锅炉汽包）的液位测量需求，需要选用能够承受高压且测量准确的方法。A. 浮筒式液位测量：通常不适用于高压环境，因为浮筒可能因高压而变形，影响测量准确性。B. 电容式液位测量：虽然可以用于某些液位测量，但在极高压力下可能不适用，因为电容传感器可能受到压力和温度的影响。C. 雷达式液位测量：雷达式液位计通过发射微波并接收反射回来的信号来测量液位，它不受压力、温度等介质特性的影响，因此非常适合用于高压容器的液位测量。D. 差压式液位测量（带冷凝罐）：差压式液位计通过测量容器上下两点之间的压力差来确定液位，但通常需要冷凝罐来处理蒸汽或高温液体，适用于高压锅炉汽包液位的测量。综上所述，C和D选项是适用于测量高压容器液位的。所以，正确答案是CD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891555", "t": 2, "q": "在液位测量中，下列哪些方法适用于测量易结晶液体的液位（如锅炉给水）?", "a": ["雷达式液位测量", "浮筒式液位测量（带吹扫）", "差压式液位测量（带反吹）", "电容式液位测量", "", ""], "r": "ABC", "e": "易结晶液体测量需避免结晶影响测量元件。雷达式通过电磁波测量不接触介质；浮筒带吹扫可防止结晶附着；差压式带反吹能避免结晶堵塞取压口。而电容式液位测量电极易受结晶影响。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891556", "t": 2, "q": "CEMS（烟气排放连续监测系统）中，下列哪些属于其核心组成部分?", "a": ["数据采集与处理系统", "校准系统", "采样系统", "分析系统", "", ""], "r": "ACD", "e": "CEMS核心是对烟气进行采样、分析并处理数据。采样系统负责获取烟气样本，分析系统检测样本成分，数据采集与处理系统处理分析得到的数据，这三者是关键。校准系统是保障准确性的辅助部分。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891557", "t": 2, "q": "CEMS数据有效性判断的依据包括下列哪些，以确保数据可靠?", "a": ["采样系统正常（无堵塞、泄漏）", "仪表校准合格（在有效期内）", "数据波动符合工艺规律（无异常跳变）", "测量值在量程范围内（非超量程）", "", ""], "r": "ABCD", "e": "数据可靠需保证采样正常、仪表状态良好、数据波动合理且测量值在量程内，ABCD四个选项都对CEMS数据有效性判断有影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891558", "t": 2, "q": "CEMS中，采样系统的主要功能包括下列哪些?", "a": ["加热烟气防止冷凝", "从烟道中抽取烟气样品", "去除烟气中的粉尘和水分", "调节烟气流量和压力", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891559", "t": 2, "q": "CEMS中，测量烟气流量的方法包括下列哪些，以计算污染物排放总量?", "a": ["差压式流量计法（基于节流原理）", "涡街流量计法（直接测量体积流量）", "皮托管测速法（多点测量平均流速）", "超声波流速法（非接触测量）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891560", "t": 2, "q": "CEMS中，分析系统常用的分析方法包括下列哪些?", "a": ["差分吸收光谱法（DOAS）", "β射线吸收法", "紫外荧光法", "红外吸收法", "", ""], "r": "ACD", "e": "差分吸收光谱法、紫外荧光法、红外吸收法都是CEMS（烟气排放连续监测系统）分析系统常用方法，β射线吸收法主要用于颗粒物浓度监测等，并非CEMS分析系统常用分析气体成分的方法。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891561", "t": 2, "q": "CEMS中，分析仪的定期维护内容包括下列哪些?", "a": ["检查气路密封性（防止漏气）", "清洗光学部件（如光源、检测器）", "更换过滤器滤芯（防止粉尘堵塞）", "校准零点和跨度（保证测量精度）", "", ""], "r": "ABCD", "e": "CEMS 分析仪定期维护需保证气路正常、部件清洁、过滤有效及测量准确，A防止漏气、B清洗光学部件、C更换过滤器滤芯、D校准零点和跨度都属于该范畴。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891562", "t": 2, "q": "CEMS中，数据采集与处理系统的主要功能包括下列哪些?", "a": ["存储和传输数据", "对数据进行有效性判断", "采集仪表测量数据", "生成排放报表", "", ""], "r": "ABCD", "e": "数据采集与处理系统要先采集仪表测量数据，对采集的数据进行有效性判断，之后存储和传输数据，最后生成排放报表。ABCD四个选项都是其主要功能。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891563", "t": 2, "q": "CEMS中，下列哪些气体属于常规监测的有害气体?", "a": ["一氧化碳（CO）", "氮氧化物（NOx）", "二氧化碳（CO2）", "二氧化硫（SO2）", "", ""], "r": "ABD", "e": "CEMS主要监测排放烟气中的有害气体，CO、NOx、SO2是常见的大气污染物，属于有害气体且是CEMS常规监测对象，而CO2是温室气体但不属于有害污染物。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891564", "t": 2, "q": "CEMS中，下列哪些情况会导致测量数据\"无效\"，需标记并剔除?", "a": ["仪表校准期间（数据未稳定）", "烟气流量波动超过±20%（超出正常范围）", "采样系统堵塞（无烟气进入分析仪）", "分析仪故障报警（如光源失效）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891565", "t": 2, "q": "CEMS中，校准系统的校准方式包括下列哪些?", "a": ["零点校准", "动态校准", "跨度校准", "静态校准", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891566", "t": 2, "q": "CEMS中，烟气预处理系统的组成部件包括下列哪些?", "a": ["冷凝器（脱水）", "加热器（防冷凝）", "蠕动泵（排冷凝水）", "过滤器（除尘）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803723942891567", "t": 2, "q": "CEMS中测量烟气颗粒物浓度的常用方法包括下列哪些?", "a": ["光散射法", "β射线吸收法", "红外吸收法", "重量法", "", ""], "r": "ABD", "e": "光散射法、β射线吸收法、重量法都是CEMS中测量烟气颗粒物浓度常用方法，红外吸收法主要用于测量气体成分。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959936", "t": 3, "q": "容积式流量计（如椭圆齿轮流量计）的测量精度不受流体粘度变化的影响，因为其直接计量流体体积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959937", "t": 3, "q": "涡街流量计的测量原理是基于流体流经漩涡发生体时产生的卡门涡街，其输出信号频率与流量成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "涡街流量计正是依据流体流经漩涡发生体产生卡门涡街的原理工作，输出信号频率和流量确实成正比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959938", "t": 3, "q": "涡街流量计的输出信号为脉冲信号，其脉冲数与流过的流体体积成正比，可直接用于累计流量计量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "涡街流量计输出脉冲信号，脉冲数和流体体积成正相关，所以能直接用于累计流量计量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959939", "t": 3, "q": "涡街流量计的压力损失大于孔板流量计，因为其漩涡发生体对流体的阻碍作用更强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "涡街流量计压力损失小于孔板流量计，孔板对流体阻碍大，压力损失大。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959940", "t": 3, "q": "涡轮流量计的测量精度高于涡街流量计，因为其受流体粘度、密度变化的影响更小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959941", "t": 3, "q": "压力传感器的响应时间是指传感器从感受到压力变化到输出信号达到稳定值的63.2%所需的时间，响应时间越短，适合测量动态压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压力传感器响应时间的定义表述正确，且响应时间短意味着能快速跟随压力变化，所以适合测量动态压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959942", "t": 3, "q": "压力仪表的精度等级是指仪表在全量程范围内的最大允许误差占量程的百分比，精度等级数值越小，仪表精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压力仪表精度等级定义就是全量程最大允许误差占量程百分比，且精度等级数值越小表示测量越准确，即精度越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959943", "t": 3, "q": "压力仪表的零点漂移是指仪表在无输入压力时，输出信号随时间变化的现象，属于系统误差，可通过定期校准消除。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "零点漂移就是无输入压力时输出信号随时间改变，它是系统误差，能通过定期校准来消除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959944", "t": 3, "q": "压力仪表的线性度是指仪表输出信号与输入压力之间的线性关系程度，线性度误差越小，仪表精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性度体现输出信号和输入压力线性关系程度，线性度误差小意味着实际输出更接近理想线性输出，能更准确反映压力值，所以仪表精度越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959945", "t": 3, "q": "压力仪表的重复性是指在相同条件下，多次测量同一压力值，测量结果的一致性程度。重复性越好，仪表精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959946", "t": 3, "q": "在火电机组过程参数测量中，系统误差可以通过多次测量取平均值的方法来消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统误差是由某些固定原因造成的，具有重复性、单向性，多次测量取平均值不能消除系统误差，只能减小随机误差。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959947", "t": 3, "q": "在信号传输抗干扰技术中，差模干扰是指干扰信号存在于两根信号线之间，可通过在信号端并联电容来抑制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959948", "t": 3, "q": "在信号传输抗干扰技术中，电源滤波器的作用是抑制从电源线路引入的高频干扰，保护仪表正常工作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电源滤波器主要功能就是抑制从电源线路引入的高频干扰，避免其对仪表等设备产生不良影响，保障仪表正常工作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959949", "t": 3, "q": "在信号传输抗干扰技术中，浮地接地方式是指将仪表的信号地与大地完全隔离，不连接，以避免地电位差引起的共模干扰。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "浮地接地方式确实是把仪表信号地和大地完全隔离不连接，目的就是防止地电位差造成共模干扰。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959950", "t": 3, "q": "在信号传输抗干扰技术中，共模干扰是指干扰信号同时存在于两根信号线与大地之间，可通过采用平衡传输（双绞线）来抑制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "共模干扰确实是干扰信号同时存在于两根信号线与大地之间，而平衡传输（双绞线）能有效抑制共模干扰。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959951", "t": 3, "q": "在信号传输抗干扰技术中，屏蔽电缆的屏蔽层两端接地比单端接地更能有效抑制电磁感应干扰。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "屏蔽电缆单端接地能避免形成地环路，抑制电磁感应干扰效果更好，两端接地易形成地环路引入干扰。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959952", "t": 3, "q": "在信号传输抗干扰技术中，在信号回路中串联电感主要用于抑制低频干扰，并联电容主要用于抑制高频干扰。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电感对低频信号阻碍小、对高频信号阻碍大，串联电感可抑制高频干扰；电容对高频信号容抗小、对低频信号容抗大，并联电容可抑制低频干扰。所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959953", "t": 3, "q": "在信号传输中，4-20mA电流信号相比0-10V电压信号，更适合长距离传输，因为其受线路电阻的影响更小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在长距离传输中，线路存在电阻，电压信号会因线路电阻分压导致信号衰减。而电流信号只要回路电阻在一定范围内，电流值稳定，受线路电阻影响小。所以4 - 20mA电流信号更适合长距离传输。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959954", "t": 3, "q": "在信号传输中，采用双绞线传输模拟信号的主要目的是抑制共模干扰，因为双绞线的两根导线电流方向相反，产生的磁场相互抵消。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在信号传输里，双绞线两根导线电流方向相反，产生的磁场相互抵消，能有效抑制共模干扰，这也是用它传输模拟信号的主要目的之一。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959955", "t": 3, "q": "在信号传输中，模拟信号的传输距离受线路电阻影响，4-20mA电流信号的最大传输距离通常为1000米，超过时需加装信号放大器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "模拟信号传输受线路电阻影响，4 - 20mA电流信号在实际应用中最大传输距离通常会因线路材质、环境等因素而不同，一般来说1000米是常见的最大传输距离限制，超过后信号易衰减，常需加装信号放大器。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959956", "t": 3, "q": "在信号传输中，模拟信号的量化误差是指将模拟信号转换为数字信号时，由于离散化处理导致的误差，该误差属于系统误差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959957", "t": 3, "q": "在信号传输中，数字信号（如RS485）的抗干扰能力强于模拟信号（如4-20mA），因为数字信号采用离散的电平表示信息，不易受干扰影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数字信号用离散电平表示信息，在传输中可通过编码、校验等方式纠错，能有效抵御干扰；模拟信号易受外界干扰使信号发生畸变。所以数字信号抗干扰能力强于模拟信号。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959958", "t": 3, "q": "在信号传输中，数字信号的传输速率越高，传输距离越远，因为高速信号抗干扰能力更强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字信号传输速率越高，意味着单位时间内传输的信息量越大，信号的变化就越快，这会增加信号失真和衰减的可能性，反而不利于长距离传输，且高速信号抗干扰能力不一定更强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959959", "t": 3, "q": "在信号传输中，RS485数字信号可实现多机通信，最多可连接32个从设备，传输距离可达1200米。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RS485接口支持多机通信，通常最多可连接32个从设备，传输距离理论上可达1200米。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959960", "t": 3, "q": "在液位测量中，差压式液位计测量敞口容器液位时，其负压端应与大气相通，以消除大气压的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "差压式液位计测敞口容器液位，负压端通大气可消除大气压对测量的影响，使测量更准确反映液位情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959961", "t": 3, "q": "在液位测量中，超声波液位计测量含大量泡沫的液体液位时，测量值会偏高，因为泡沫会提前反射超声波信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "含大量泡沫时，泡沫提前反射超声波信号，会让仪器误判液位位置，使测量值比实际液位高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959962", "t": 3, "q": "在液位测量中，超声波液位计的测量精度受环境温度影响，温度变化会导致声速变化，需进行温度补偿。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超声波液位计是通过测量超声波传播时间来确定液位，声速会随环境温度变化，进而影响测量精度，所以需要温度补偿。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959963", "t": 3, "q": "在液位测量中，电容式液位计测量易结晶液体液位时，若电极表面结垢，会导致测量值偏低，因为结垢层改变了介电常数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电极表面结垢，结垢层改变了介电常数，会使电容值变化从而让测量值偏高而非偏低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959964", "t": 3, "q": "在液位测量中，电容式液位计的电极形式（如杆式、缆式）应根据容器直径和液位范围选择，缆式电极适合大直径容器和高液位测量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电容式液位计电极形式需结合容器直径和液位范围选，缆式电极因长度可灵活调整，能适应大直径容器和高液位测量。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959965", "t": 3, "q": "在液位测量中，电容式液位计若测量的液体介电常数小于空气介电常数，会导致无法测量，因为电容值随液位升高而减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般电容式液位计利用液体和空气介电常数差异测量液位，正常是液体介电常数大于空气，液位升高电容值增大。若液体介电常数小于空气，电容值随液位升高减小，测量原理基础改变，但不是无法测量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959966", "t": 3, "q": "在液位测量中，浮筒式液位计的测量范围由浮筒的长度决定，浮筒越长，测量范围越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "浮筒式液位计利用浮筒浸在液体中所受浮力变化来测量液位，其测量范围取决于浮筒长度，浮筒长则能测量的液位变化区间大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959967", "t": 3, "q": "在液位测量中，浮筒式液位计的测量精度不受液体密度变化的影响，因为其基于浮力平衡原理，密度变化会被浮筒浸入深度变化抵消。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "浮筒式液位计测量精度受液体密度变化影响，它是基于杠杆原理，并非浮力平衡原理，且密度变化不能被浮筒浸入深度变化抵消。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959968", "t": 3, "q": "在液位测量中，浮筒式液位计的浮筒若被腐蚀减重，会导致测量值偏高，因为浮筒浮力不变时，减重会使浮筒浸入深度增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "浮筒被腐蚀减重，浮力不变，根据受力平衡，浮筒浸入深度会增加，而测量值是根据浮筒浸入深度来的，所以测量值会偏高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959969", "t": 3, "q": "在液位测量中，浮子式液位计的浮子密度必须小于被测液体密度，才能保证浮子浮在液体表面。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据浮力原理，只有浮子密度小于被测液体密度时，浮子所受浮力大于自身重力，才能浮在液体表面进行液位测量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959970", "t": 3, "q": "在液位测量中，雷达液位计的测量范围仅取决于仪表自身的量程，与被测液体的密度和粘度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "雷达液位计是通过发射电磁波并接收反射波来测量液位，其测量范围主要由仪表自身的性能决定，和被测液体的密度、粘度没有关联。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959971", "t": 3, "q": "在液位测量中，雷达液位计的介电常数补偿功能可修正被测液体介电常数变化对测量的影响，提高精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "雷达液位计的介电常数补偿功能就是为了应对被测液体介电常数变化对测量产生的影响，通过该功能可对测量结果进行修正，从而提高测量精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959972", "t": 3, "q": "在液位测量中，雷达液位计的盲区是指传感器天线附近无法准确测量的区域，盲区范围内的液位无法检测。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "雷达液位计工作时，天线附近存在信号干扰等情况，导致该区域无法准确测量液位，此区域就是盲区，盲区液位确实无法检测。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959973", "t": 3, "q": "CEMS（烟气排放连续监测系统）中，测量烟气中二氧化硫浓度时，紫外荧光法的测量精度不受烟气中粉尘含量的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "紫外荧光法测量二氧化硫浓度时，粉尘会对测量产生干扰，比如吸附、散射等作用影响测量精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959974", "t": 3, "q": "CEMS中，采样系统的过滤器滤芯应定期更换，若滤芯堵塞会导致进入分析仪的烟气流量减小，测量值偏低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在CEMS中，滤芯堵塞会阻碍烟气流通，使进入分析仪的烟气流量减小，因参与测量的烟气量不足，会造成测量值偏低，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959975", "t": 3, "q": "CEMS中，测量烟气含湿量的冷凝法是通过冷却烟气使水汽冷凝，测量冷凝水量和干烟气流量，进而计算含湿量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冷凝法测烟气含湿量就是将烟气冷却使水汽冷凝，通过测量冷凝水量和干烟气流量来计算含湿量。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959976", "t": 3, "q": "CEMS中，分析仪的跨度校准是用已知浓度的标准气体通入分析仪，调整仪表输出，使测量值与标准气体浓度一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "跨度校准就是将已知浓度标准气通入分析仪，通过调整让测量值和标准气浓度相符，该描述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959977", "t": 3, "q": "CEMS中，分析仪的零点校准应每周进行一次，跨度校准应每月进行一次，以保证测量精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959978", "t": 3, "q": "CEMS中，红外吸收法测量烟气中氮氧化物（NOx）浓度时，其核心是利用NOx对特定波长红外光的选择性吸收，吸收强度与浓度成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "红外吸收法测NOx浓度原理就是基于NOx对特定波长红外光选择性吸收，且遵循朗伯 - 比尔定律，吸收强度和浓度成正比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959979", "t": 3, "q": "CEMS中，若分析仪显示的二氧化硫浓度为负值，通常是由于零点漂移导致的，需重新进行零点校准。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在CEMS（烟气排放连续监测系统）里，分析仪显示二氧化硫浓度为负值，零点漂移是常见原因，重新零点校准可解决该问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959980", "t": 3, "q": "CEMS中，若烟气中含氧量测量值偏低，会导致二氧化硫浓度计算值偏高，因为含氧量用于将浓度折算为标准状态下的干基浓度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在CEMS中，用含氧量将浓度折算为标准状态下干基浓度时，含氧量与折算浓度成反比，含氧量测量值偏低，二氧化硫浓度计算值会偏高。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959981", "t": 3, "q": "CEMS中，烟气采样管线的长度应尽可能短（通常≤10米），以减少烟气在传输过程中的损失和滞后。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "较短的采样管线可减少烟气传输损失与滞后，一般要求采样管线长度通常≤10米。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959982", "t": 3, "q": "CEMS中，烟气采样系统的加热管线温度应控制在120℃以上，以防止烟气中的水分冷凝导致二氧化硫溶解损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "为防止烟气中水分冷凝使二氧化硫溶解损失，CEMS中烟气采样系统加热管线温度通常需控制在120℃以上。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959983", "t": 3, "q": "CEMS中，烟气含湿量的测量结果会影响污染物浓度的计算，因为浓度需折算为干基浓度，含湿量越高，干基浓度越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "污染物浓度折算为干基浓度时，含湿量越高，干基浓度越小，并非越大。", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959984", "t": 3, "q": "CEMS中，烟气流量测量的准确性直接影响污染物排放总量的计算，因为排放总量=烟气流量×污染物浓度×时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据排放总量计算公式，烟气流量是计算污染物排放总量的关键参数之一，其测量准确性会直接影响排放总量计算结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803725217959985", "t": 3, "q": "CEMS中，β射线吸收法测量烟气颗粒物浓度时，其测量结果不受烟气温度和压力变化的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "β射线吸收法测量烟气颗粒物，是基于β射线穿过颗粒物时被吸收，吸收量与颗粒物质量相关，原理上不依赖烟气温度和压力，测量结果不受其变化影响。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 过程控制系统（1）", "n": "基础练习题【含解析】 / 第5章 过程控制系统（1）", "qs": [{"id": "2034803729840082944", "t": 1, "q": "串级控制系统中，副回路的调节精度要求通常比主回路（　）", "a": ["相同", "低", "无要求", "高", "", ""], "r": "D", "e": "串级控制系统是由主回路和副回路组成的双闭环控制系统。在这种系统中，副回路主要起到快速、准确地跟踪主回路设定值变化的作用，从而减小主回路的负荷变化，提高系统的稳定性和响应速度。对于副回路来说，由于其需要快速响应并准确跟踪主回路的设定值变化，因此对其调节精度有较高的要求。相比之下，主回路更注重整体的稳定性和控制效果，对调节精度的要求相对较低。综上所述，副回路的调节精度要求通常比主回路高。所以，正确答案是D选项：“高”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082945", "t": 1, "q": "串级控制系统中，副回路的主要作用是（　）", "a": ["延长主回路的调节时间", "快速克服进入副回路的扰动", "提高主回路的放大系数", "稳定主被控变量", "", ""], "r": "B", "e": "副回路能快速响应并克服进入副回路的扰动，减少其对主被控变量的影响。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082946", "t": 1, "q": "串级控制系统中，若副被控变量是流量，主被控变量是温度，则副回路的调节周期通常比主回路（　）", "a": ["短", "无法比较", "长", "相等", "", ""], "r": "A", "e": "副回路响应快，调节周期短，主回路响应慢，调节周期长。本题中副被控变量是流量，主被控变量是温度，副回路调节周期通常比主回路短。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082947", "t": 1, "q": "串级控制系统中，若副调节器采用比例控制，当副回路存在扰动时，副调节器的输出会（　）", "a": ["随偏差积分变化，消除静差", "随偏差成比例变化，快速克服扰动", "随偏差微分变化，提前调节", "保持不变，无法克服扰动", "", ""], "r": "B", "e": "比例控制的输出与偏差成比例关系，副回路采用比例控制可快速应对扰动，使输出随偏差成比例变化来快速克服扰动。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082948", "t": 1, "q": "串级控制系统中，若副调节器采用反作用，副执行器为气关式，当副测量值大于副设定值时，副执行器会（　）", "a": ["保持不变", "开大", "关小", "先开大后关小", "", ""], "r": "C", "e": "在串级控制系统中，副调节器的作用是根据副测量值与副设定值的偏差来调节副执行器的动作。副调节器采用反作用意味着当副测量值大于副设定值时，副调节器会输出一个减小偏差的信号。副执行器为气关式，表示当接收到减小信号的时，执行器会关闭，即关小。因此，当副测量值大于副设定值时，副调节器会输出减小的信号，气关式的副执行器会关小，以减少副测量值。所以，正确答案是C.关小。", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082949", "t": 1, "q": "串级控制系统中，若副回路的扰动通道时间常数远小于主回路扰动通道时间常数，则副回路对（　）的抑制效果更显著。", "a": ["无扰动", "副回路的扰动", "所有扰动", "主回路的扰动", "", ""], "r": "B", "e": "副回路能快速克服其自身的扰动，当副回路扰动通道时间常数远小于主回路时，副回路可及时消除自身扰动，对副回路扰动抑制效果更显著。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082950", "t": 1, "q": "串级控制系统中，若主被控变量是汽包水位，副被控变量是给水流量，则副回路的操纵变量是（　）", "a": ["汽包水位", "给水流量", "给水阀门开度", "蒸汽流量", "", ""], "r": "C", "e": "在串级控制系统里，操纵变量是用来改变被控变量的物理量。副回路中被控变量是给水流量，通过改变给水阀门开度来调节给水流量。所以副回路操纵变量是给水阀门开度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082951", "t": 1, "q": "串级控制系统中，若主回路的扰动进入主对象，会导致（　）", "a": ["副被控变量变化，主被控变量不变", "主、副被控变量均变化", "主被控变量变化，副被控变量不变", "主、副被控变量均不变", "", ""], "r": "B", "e": "主回路扰动进入主对象会影响主被控变量，主控制器输出变化使副控制器给定值改变，进而影响副被控变量，所以主、副被控变量均变化。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082952", "t": 1, "q": "串级控制系统中，主调节器的控制规律通常采用（　）", "a": ["比例微分（PD）控制", "比例（P）控制", "比例积分（PI）控制", "比例积分微分（PID）控制", "", ""], "r": "C", "e": "串级控制系统中主调节器要消除余差，比例积分（PI）控制能实现这一目的。比例积分控制结合了比例控制的快速响应和积分控制消除余差的特点。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082953", "t": 1, "q": "串级控制系统中，主调节器的输出作为（　）", "a": ["执行器的直接控制信号", "副调节器的设定值", "主被控变量的反馈信号", "副调节器的测量值", "", ""], "r": "B", "e": "串级控制系统中，主调节器输出是副调节器的设定值。主调节器根据主被控变量偏差输出信号，这个信号作为副调节器的给定值，副调节器再根据此设定值和副被控变量的偏差进行调节。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082954", "t": 1, "q": "单回路控制系统中，若被控对象存在较大纯滞后，会导致系统（　）", "a": ["稳定性下降", "调节速度加快", "静差消除加快", "超调量减小", "", ""], "r": "A", "e": "纯滞后会使控制作用不能及时影响被控变量，导致系统响应不及时，稳定性变差。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082955", "t": 1, "q": "单回路控制系统中，若被控对象为反作用（输入增→输出减），执行器为气开式，控制器应设为（　）", "a": ["反作用", "无作用", "任意作用", "正作用", "", ""], "r": "D", "e": "系统要实现负反馈控制。被控对象反作用，气开式执行器是正作用，为保证系统负反馈，控制器应设为正作用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082956", "t": 1, "q": "单回路控制系统中，若被控对象为正作用（输入增→输出增），执行器为气关式（输入增→阀门关），则控制器应设为（　）", "a": ["无作用", "正作用（测量值>设定值→输出增）", "反作用（测量值>设定值→输出减）", "任意作用", "", ""], "r": "C", "e": "系统要稳定，整个回路作用方向需为负。被控对象正作用、执行器气关式为反作用，所以控制器应是反作用。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082957", "t": 1, "q": "单回路控制系统中，若测量元件的滞后时间增大，会导致系统（　）", "a": ["调节及时，超调量减小", "调节滞后，超调量增大", "静差增大，稳定性下降", "静差减小，稳定性提高", "", ""], "r": "B", "e": "测量元件滞后时间增大，会使系统获取信息延迟，调节变得滞后，不能及时响应偏差，容易导致超调量增大。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082958", "t": 1, "q": "单回路控制系统中，若测量值等于设定值，控制器的输出会（　）", "a": ["等于最小值", "等于最大值", "等于稳态输出值", "等于零", "", ""], "r": "C", "e": "在单回路控制系统中，当测量值等于设定值时，系统处于稳定状态，此时控制器的输出为稳态输出值。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082959", "t": 1, "q": "单回路控制系统中，若控制器采用反作用，当测量值大于设定值时，控制器输出会（　）", "a": ["减小", "不变", "增大", "先增大后减小", "", ""], "r": "A", "e": "反作用控制器，测量值大于设定值即偏差为正，此时控制器输出减小。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082960", "t": 1, "q": "单回路控制系统中，若控制器采用正作用，当被控变量低于设定值时，控制器输出会（　）", "a": ["不变", "先增大后减小", "减小", "增大", "", ""], "r": "C", "e": "正作用控制器，被控变量低于设定值，偏差为负，控制器输出与偏差同向变化，所以输出会减小。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082961", "t": 1, "q": "单回路控制系统中，若执行器故障导致阀门卡在全开位置，当被控变量高于设定值时，系统会（　）", "a": ["控制器输出不变，被控变量保持不变", "被控变量自动下降至设定值", "通过控制器输出减小，试图关小阀门，但无效，被控变量持续升高", "通过控制器输出增大，试图开大阀门，被控变量进一步升高", "", ""], "r": "C", "e": "阀门卡在全开，被控变量高于设定值时，控制器会按控制规律输出减小信号来关阀，但阀门无法动作，被控变量会因输入量不变等因素持续升高。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082962", "t": 1, "q": "单回路控制系统中，若执行器为气关式，当控制器输出信号中断时，阀门会（　）", "a": ["随机动作", "全开", "保持原位", "全关", "", ""], "r": "B", "e": "气关式执行器，信号中断即失去控制信号，阀门会恢复到全开状态。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082963", "t": 1, "q": "单回路控制系统中，若执行器为气开式（当输入信号增大时阀门开大），控制器为反作用（当测量值大于设定值时输出减小），则被控对象应满足（　）", "a": ["输入变化时，输出不变", "输入增大时，输出增大", "输入增大时，输出减小", "输入与输出无关", "", ""], "r": "C", "e": "单回路控制系统要稳定，整个闭环系统的总增益极性应为正。气开式执行器增益为正，反作用控制器增益为负，所以被控对象增益应为负，即输入增大时，输出减小。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082964", "t": 1, "q": "单回路控制系统中，执行器的气开/气关类型选择依据是（　）", "a": ["介质的流动方向", "工艺安全要求（故障时阀门位置）", "控制器的作用方向", "被控对象的特性", "", ""], "r": "B", "e": "执行器气开/气关类型主要是从工艺安全角度考虑，即故障时阀门所处位置要保障工艺安全。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082965", "t": 1, "q": "给水控制系统中，当汽包水位低于设定值时，若采用单回路控制，控制器应（　）", "a": ["减小输出，开大给水阀门", "增大输出，关小给水阀门", "增大输出，开大给水阀门", "减小输出，关小给水阀门", "", ""], "r": "C", "e": "汽包水位低于设定值，需增加给水量。单回路控制中，控制器应增大输出，使给水阀门开大来增加给水量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082966", "t": 1, "q": "给水控制系统中，当汽包压力突然升高时，汽包水位会（　）", "a": ["升高", "降低", "先降低后升高", "不变", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082967", "t": 1, "q": "给水控制系统中，当汽轮机负荷突然增加时，汽包水位会先出现（　）", "a": ["持续上升", "下降（虚假水位），随后上升", "持续下降", "上升（虚假水位），随后下降", "", ""], "r": "B", "e": "这是一道关于给水控制系统中汽包水位变化的问题。我们需要根据汽轮机负荷变化对汽包水位的影响来判断。首先，理解题目中的关键信息：汽轮机负荷突然增加时，汽包水位会如何变化。1. 汽轮机负荷增加的影响： 当汽轮机负荷突然增加时，蒸汽流量会迅速增大。 这会导致汽包内的水被更快地转化为蒸汽，短时间内蒸汽产量大于给水量。2. 汽包水位的变化： 初始阶段，由于蒸汽产量的迅速增加，汽包内的水位会暂时下降，形成所谓的“虚假水位”。 随后，控制系统会检测到水位下降并增加给水量，以维持水位稳定。 因此，在负荷增加后的短暂时间内，水位会先下降（虚假水位），然后随着给水量的增加而上升。综上所述，当汽轮机负荷突然增加时，汽包水位会先出现下降（虚假水位），随后上升。所以，正确答案是B选项：“下降（虚假水位），随后上升”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082968", "t": 1, "q": "给水控制系统中，若给水管道泄漏，会导致给水流量（　），汽包水位（　）", "a": ["减小，升高", "增大，降低", "增大，升高", "减小，降低", "", ""], "r": "D", "e": "给水管道泄漏，水漏出去了，进入系统的有效给水流量减小；而进入汽包的水少了，汽包水位会降低。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082969", "t": 1, "q": "给水控制系统中，若汽包水位控制器输出增大，对气开式给水阀门的影响是（　）", "a": ["阀门不变", "阀门关小", "阀门开大", "阀门先开大后关小", "", ""], "r": "C", "e": "气开式阀门，控制器输出增大时阀门开度增大。所以汽包水位控制器输出增大，气开式给水阀门会开大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082970", "t": 1, "q": "给水控制系统中，三冲量给水控制的\"三冲量\"是指（　）", "a": ["汽包水位、给水流量、蒸汽流量", "汽包压力、给水流量、蒸汽流量", "汽包压力、给水温度、蒸汽温度", "汽包水位、给水温度、蒸汽温度", "", ""], "r": "A", "e": "三冲量给水控制是为提高汽包水位控制质量而设置，“三冲量”就是汽包水位、给水流量、蒸汽流量。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082971", "t": 1, "q": "给水控制系统中，三冲量控制的控制器输出是根据（　）计算得出的。", "a": ["给水流量反馈信号", "汽包水位偏差、蒸汽流量前馈信号和给水流量反馈信号的综合", "汽包水位偏差", "蒸汽流量前馈信号", "", ""], "r": "B", "e": "三冲量控制综合考虑多个因素，其控制器输出是基于汽包水位偏差、蒸汽流量前馈信号和给水流量反馈信号来计算的。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082972", "t": 1, "q": "给水控制系统中，三冲量控制相比单冲量控制的主要优势是（　）", "a": ["能提前克服蒸汽流量扰动，减少虚假水位影响", "仅需测量一个参数，维护方便", "调节速度更慢，稳定性更好", "结构简单，成本低", "", ""], "r": "A", "e": "单冲量是仅依据水位控制，而三冲量结合水位、蒸汽流量、给水流量，能提前根据蒸汽流量变化调节，减少虚假水位影响。B选项三冲量要测多个参数；C选项三冲量调节速度更快；D选项三冲量结构更复杂。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082973", "t": 1, "q": "过程控制系统动态特性的阶跃响应中，调节时间ts是指系统输出从阶跃输入开始到进入稳态值的（　）范围内所需的时间。", "a": ["±5%或±10%", "±2%或±5%", "±1%或±3%", "±10%或±15%", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082974", "t": 1, "q": "过程控制系统动态特性的描述方法中，不属于时域分析方法的是（　）", "a": ["频率特性分析", "脉冲响应分析", "过渡过程曲线分析", "阶跃响应分析", "", ""], "r": "A", "e": "时域分析是研究系统在时间域内的响应，而频率特性分析是在频域研究系统特性，不属于时域分析方法。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082975", "t": 1, "q": "过程控制系统中，传递函数的分母多项式称为（　）", "a": ["特征方程", "输入方程", "输出方程", "传递方程", "", ""], "r": "A", "e": "在过程控制系统里，传递函数分母多项式等于零的方程就是特征方程。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082976", "t": 1, "q": "过程控制系统中，二阶系统的衰减比n是指（　）", "a": ["调节时间与振荡周期的比值", "上升时间与调节时间的比值", "第一个超调量与第二个超调量的比值", "第一个峰值与稳态值的比值", "", ""], "r": "C", "e": "二阶系统衰减比是指第一个超调量与第二个超调量的比值。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082977", "t": 1, "q": "过程控制系统中，二阶系统的阻尼比ζ反映了系统的（　）", "a": ["响应速度", "静态精度", "抗干扰能力", "稳定性", "", ""], "r": "D", "e": "阻尼比ζ是二阶系统的重要参数，主要影响系统稳定性。ζ取值不同，系统响应特性不同，对稳定性影响大。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082978", "t": 1, "q": "过程控制系统中，阶跃响应的上升时间tr是指系统输出从稳态值的（　）上升到（　）所需的时间。", "a": ["10%，90%", "0%，100%", "5%，95%", "20%，80%", "", ""], "r": "A", "e": "在过程控制系统中，阶跃响应上升时间tr定义为系统输出从稳态值10%上升到90%所需时间。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082979", "t": 1, "q": "过程控制系统中，阶跃响应的稳态误差是指（　）", "a": ["输出变化量与输入变化量的比值", "输出稳态值与输入值的差值", "输出最小值与稳态值的差值", "输出最大值与稳态值的差值", "", ""], "r": "B", "e": "稳态误差是系统达到稳态后，输出稳态值与输入值的差值。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082980", "t": 1, "q": "过程控制系统中，阶跃响应曲线的超调量σ%反映了系统的（　）", "a": ["抗干扰能力", "稳定性", "响应速度", "静态精度", "", ""], "r": "B", "e": "超调量是指系统响应超过稳态值的最大偏离量与稳态值之比，它体现系统响应偏离稳态的程度，超调量越小，系统越稳定，所以超调量反映了系统的稳定性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082981", "t": 1, "q": "过程控制系统中，频率特性分析中，幅频特性反映了系统输出与输入的（　）之比随频率的变化。", "a": ["相位", "时间", "偏差", "幅值", "", ""], "r": "D", "e": "幅频特性关注的是幅值相关内容，它体现的是系统输出与输入的幅值之比随频率的变化。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082982", "t": 1, "q": "过程控制系统中，若被控对象存在正反馈特性，会导致系统（　）", "a": ["稳定性增强", "稳定性减弱，易振荡", "静差增大", "静差减小", "", ""], "r": "B", "e": "正反馈会使偏差不断增大，导致系统不稳定、易振荡。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082983", "t": 1, "q": "过程控制系统中，若被控对象的放大系数K增大，系统的静态增益会（　）", "a": ["增大，输出对输入的静态响应更灵敏", "不变，仅动态响应变化", "减小，输出对输入的静态响应更迟钝", "先增大后减小", "", ""], "r": "A", "e": "系统静态增益与被控对象放大系数 K 相关，K 增大，系统静态增益增大，输出对输入的静态响应更灵敏。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082984", "t": 1, "q": "过程控制系统中，若被控对象的时间常数T增大，系统的阶跃响应会（　）", "a": ["超调量减小，稳定性提高", "响应减慢，调节时间延长", "超调量增大，稳定性下降", "响应加快，调节时间缩短", "", ""], "r": "B", "e": "时间常数T反映系统响应速度，T增大，系统响应变慢，调节时间会延长。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082985", "t": 1, "q": "过程控制系统中，若被控对象的滞后时间τ与时间常数T的比值τ/T增大，系统的控制难度会（　）", "a": ["先增大后减小", "减小", "增大", "不变", "", ""], "r": "C", "e": "在过程控制系统中，τ/T 比值增大意味着对象的纯滞后相对时间常数占比变大，纯滞后会使控制作用不能及时影响被控变量，导致系统控制难度增大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082986", "t": 1, "q": "过程控制系统中，若系统存在纯滞后τ，会使系统的稳定裕量（　）", "a": ["减小", "先增大后减小", "增大", "不变", "", ""], "r": "A", "e": "纯滞后会使系统的相位滞后增大，从而使系统的稳定裕量减小。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082987", "t": 1, "q": "过程控制系统中，若系统的开环增益增大，系统的稳定性会（　）", "a": ["不变", "增强", "减弱", "先增强后减弱", "", ""], "r": "C", "e": "开环增益增大，系统特征方程根的分布会改变，使系统更易不稳定，稳定性减弱。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082988", "t": 1, "q": "过程控制系统中，若系统的衰减比n=4:1，说明系统（　）", "a": ["稳定性好，超调量适中", "等幅振荡，临界稳定", "稳定性差，易振荡", "无超调，响应缓慢", "", ""], "r": "A", "e": "衰减比反映系统稳定性和超调情况，n = 4:1是工程上理想值，表明系统稳定性好且超调量适中。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082989", "t": 1, "q": "过程控制系统中，若系统的特征方程所有根的实部均小于零，则系统（　）", "a": ["不稳定", "临界稳定", "无法判断", "稳定", "", ""], "r": "D", "e": "在过程控制系统中，系统稳定的充要条件是特征方程所有根的实部均小于零。所以本题系统是稳定的。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082990", "t": 1, "q": "过程控制系统中，一阶系统阶跃响应的稳态值等于（　）", "a": ["放大系数K", "时间常数T", "时间常数T与阶跃输入幅值的乘积", "放大系数K与阶跃输入幅值的乘积", "", ""], "r": "D", "e": "对于一阶系统，其阶跃响应的稳态值是放大系数K与阶跃输入幅值的乘积。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082991", "t": 1, "q": "过程控制系统中，滞后时间τ的存在会导致系统（　）", "a": ["调节动作提前，超调量减小", "调节动作滞后，超调量增大", "静态精度提高，静差减小", "静态精度降低，静差增大", "", ""], "r": "B", "e": "滞后时间τ使调节动作不能及时进行，出现滞后，进而会使系统超调量增大。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082992", "t": 1, "q": "燃烧控制系统中，当燃料量突然增加时，为防止炉膛缺氧，应（　）", "a": ["先减少送风量，再增加燃料量", "同时增加送风量和燃料量", "先增加送风量，再增加燃料量", "先增加燃料量，再增加送风量", "", ""], "r": "C", "e": "为防止炉膛缺氧，燃料增加时需保证有充足空气，所以应先增加送风量使炉膛有足够氧气，再增加燃料量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803729840082993", "t": 1, "q": "燃烧控制系统中，空燃比过低会导致（　）", "a": ["燃料不完全燃烧，产生黑烟和积碳", "蒸汽温度过高", "燃料充分燃烧，热效率高", "炉膛压力过高", "", ""], "r": "A", "e": "空燃比是指空气与燃料的比例，空燃比过低意味着燃料多、空气少。燃料因空气不足不能充分燃烧，会产生黑烟和积碳。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181184", "t": 2, "q": "串级控制系统的主要特点包括（　）", "a": ["提高主被控变量的控制精度", "结构比单回路控制系统复杂", "副回路能抑制进入副回路的扰动", "能快速克服进入副回路的扰动", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181185", "t": 2, "q": "串级控制系统中，副调节器通常采用比例（P）控制的主要原因有（　）", "a": ["显著提高副回路的调节精度", "简化控制算法，降低调试难度", "响应速度快，能快速克服扰动", "避免积分饱和现象发生", "", ""], "r": "BCD", "e": "串级控制系统中，副调节器的作用主要是快速、准确地跟踪主调节器的设定值变化，以及克服进入副回路的扰动。现在来分析各个选项：A. 显著提高副回路的调节精度 - 虽然比例控制可以提供一定的调节精度，但它并非主要通过比例控制来实现精度的显著提升。比例控制更多的是影响系统的响应速度和稳定性。B. 简化控制算法，降低调试难度 - 比例控制是最基本的控制方式，其算法相对简单。在串级控制系统中，副调节器采用比例控制确实可以简化整个控制系统，使得调试和维护更为容易。C. 响应速度快，能快速克服扰动 - 这正是比例控制在串级控制系统中被广泛应用的主要原因。比例控制能够迅速响应设定值的变化或扰动的出现，从而及时调整副回路的输出，确保主回路的稳定。D. 避免积分饱和现象发生 - 积分饱和是积分控制中的一个常见问题，而比例控制不涉及积分环节，因此自然不存在积分饱和的问题。但这不是副调节器采用比例控制的主要原因，而是其一个附带的优势。综上所述，副调节器在串级控制系统中采用比例控制的主要原因是响应速度快，能快速克服扰动（C选项），以及简化控制算法，降低调试难度（B选项）。同时，D选项描述的避免积分饱和现象虽然也是比例控制的一个特点，但不是主要原因。A选项则不是比例控制的主要优势。因此，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181186", "t": 2, "q": "串级控制系统中，副回路的抗干扰能力强的原因包括（　）", "a": ["副回路的放大系数大", "副回路响应速度快", "副回路的滞后时间小", "副回路能优先克服扰动", "", ""], "r": "BCD", "e": "副回路响应速度快、滞后时间小，能优先克服扰动，这些特点使得副回路抗干扰能力强，放大系数大并非主要原因。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181187", "t": 2, "q": "串级控制系统中，副回路的设计原则包括（　）", "a": ["副被控变量应易测量、易调节", "将主要扰动纳入副回路", "副回路的时间常数应远小于主回路", "副回路应包含主被控变量", "", ""], "r": "ABC", "e": "串级控制副回路选副被控变量要易测量调节，把主要扰动纳入可快速克服，副回路时间常数小能快速响应。副回路不包含主被控变量。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181188", "t": 2, "q": "串级控制系统中，副回路的优点包括（　）", "a": ["提高系统的抗干扰能力", "减小主回路的滞后", "简化系统结构", "快速克服副回路扰动", "", ""], "r": "ABD", "e": "串级控制系统是由主控制器和副控制器串联组成的系统。副回路的设计主要是为了快速响应和抑制局部扰动，从而改善整个控制系统的性能。以下是对各选项的简要分析：A. 提高系统的抗干扰能力：副回路可以迅速响应局部扰动，从而减少这些扰动对主回路的影响，进而提高系统的抗干扰能力。B. 减小主回路的滞后：副回路通过快速响应局部变化，可以有效减小主回路的滞后效应。C. 简化系统结构：串级控制系统实际上增加了系统的复杂性，而不是简化系统结构。因此，这个选项是不正确的。D. 快速克服副回路扰动：副回路的主要作用就是快速响应和抑制副回路的扰动，确保系统稳定。综上所述，正确的选项是A、B和D。所以，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181189", "t": 2, "q": "串级控制系统中，副回路设计时需避免的情况有（　）", "a": ["副回路时间常数与主回路接近", "副回路包含过多扰动", "副执行器调节范围不足", "副被控变量无法准确测量", "", ""], "r": "ABCD", "e": "副回路时间常数应与主回路有适当差异，若接近会使系统稳定性变差；副回路包含过多扰动不利于控制；副执行器调节范围不足无法有效调节；副被控变量无法准确测量会影响控制效果。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181190", "t": 2, "q": "串级控制系统中，主、副调节器作用方向的确定需考虑（　）", "a": ["主被控对象的特性", "主执行器的类型（气开/气关）", "副执行器的类型（气开/气关）", "副被控对象的特性", "", ""], "r": "ABCD", "e": "串级控制系统中，主、副调节器作用方向的确定主要基于系统的稳定性和控制效果。考虑以下关键因素：* 主被控对象的特性对于整个系统的稳定性至关重要。根据对象的特性来确定主调节器的作用方向，可以确保系统在受到扰动时能够迅速且准确地恢复到设定值。* 副执行器的类型（气开/气关）同样重要。副执行器直接控制副回路的操作，其类型决定了当信号增加或减少时，执行机构的动作方向。这直接影响到副回路的响应，进而影响整个系统的稳定性。综合考虑，主被控对象的特性和副执行器的类型是确定串级控制系统中主、副调节器作用方向的关键因素。所以，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181191", "t": 2, "q": "串级控制系统中，主被控变量选择的原则包括（　）", "a": ["直接反映工艺生产指标或安全指标", "能间接反映工艺要求（当直接指标不可测时）", "具有较好的可测性和可控性", "必须与副被控变量为同一物理量", "", ""], "r": "ABC", "e": "主被控变量应能直接或间接反映工艺要求，且要有好的可测可控性，而主副被控变量不必是同一物理量。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181192", "t": 2, "q": "串级控制系统中，主调节器采用PID控制的情况适用于（　）", "a": ["副回路调节精度较高", "主回路存在较多扰动", "主被控变量要求无静差", "主被控对象滞后较大", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181193", "t": 2, "q": "串级控制系统中，主调节器的控制规律选择依据是（　）", "a": ["主执行器的类型", "主被控变量的滞后大小", "主被控变量的控制精度要求", "副回路的调节效果", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181194", "t": 2, "q": "单回路控制系统中，被控对象为反作用时的特征包括（　）", "a": ["操纵变量减小，被控变量增大", "输入信号增大，输出信号减小", "操纵变量增大，被控变量减小", "输入信号减小，输出信号增大", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181195", "t": 2, "q": "单回路控制系统中，测量元件的选择需考虑的因素包括（　）", "a": ["响应速度与系统动态特性匹配", "环境适应性（温度、压力、腐蚀性）", "测量精度满足控制要求", "测量范围与工艺参数匹配", "", ""], "r": "ABCD", "e": "单回路控制系统中，测量元件要能准确反映被控参数，其响应速度应与系统动态特性匹配，要适应环境，测量精度要满足控制要求，测量范围也需与工艺参数匹配。ABCD四个选项都是选择测量元件需考虑的因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181196", "t": 2, "q": "单回路控制系统中，测量滞后对系统的影响包括（　）", "a": ["静差增大", "系统超调量增大", "调节时间延长", "系统稳定性下降", "", ""], "r": "BCD", "e": "测量滞后会使控制器不能及时获取准确的被控变量信息，导致控制作用不及时，使系统超调量增大、调节时间延长、系统稳定性下降。静差主要与系统的控制规律等有关，和测量滞后关系不大。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181197", "t": 2, "q": "单回路控制系统中，控制器参数整定的目标包括（　）", "a": ["调节时间短，响应快", "静差满足工艺要求", "系统稳定，无剧烈振荡", "超调量小，稳定性好", "", ""], "r": "ABCD", "e": "控制器参数整定目标是使控制系统达到好的控制效果，需让系统稳定（无剧烈振荡）、响应快（调节时间短）、超调量小以保证稳定性，同时静差要满足工艺要求。ABCD选项均符合。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181198", "t": 2, "q": "单回路控制系统中，控制器作用方向的确定依据是（　）", "a": ["被控对象的特性（正/反作用）", "工艺对被控变量的控制要求", "测量元件的类型", "执行器的类型（气开/气关）", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181199", "t": 2, "q": "单回路控制系统中，执行器的选择需考虑的因素包括（　）", "a": ["控制器的作用方向", "被控对象的特性", "介质的性质（如温度、压力、腐蚀性）", "工艺对阀门故障位置的要求", "", ""], "r": "BCD", "e": "执行器选择要考虑被控对象特性来适配控制，介质性质会影响执行器材质等，工艺对阀门故障位置要求决定执行器故障时状态。而控制器作用方向是控制系统整体逻辑，非执行器选择考虑因素。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181200", "t": 2, "q": "单回路控制系统中，执行器故障时的安全设计需考虑（　）", "a": ["执行器的材质强度", "故障时对被控变量的影响", "故障时阀门的位置（开/关）", "故障信号的报警功能", "", ""], "r": "BCD", "e": "答案：BCD执行器故障时，需要关注故障对被控变量的影响、阀门的位置以及故障信号的报警功能，而与执行器的材质强度关系不大。", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181201", "t": 2, "q": "单回路控制系统中，执行器为气开式时的应用场景包括（　）", "a": ["故障时需打开阀门保护设备（如给水阀）", "工艺要求阀门常关", "工艺要求阀门常开", "故障时需关闭阀门保护设备（如蒸汽阀）", "", ""], "r": "AC", "e": "答案：AC执行器为气开式时，当气源中断或故障时，阀门会自动关闭。因此，如果故障时需要打开阀门来保护设备，那么应该选择气开式执行器，这样在正常情况下阀门是关闭的，故障时气源中断，阀门会打开，起到保护设备的作用。所以选项A是正确的。同理，如果工艺要求阀门常开，那么也应该选择气开式执行器，因为气源正常时阀门会打开，满足工艺要求。所以选项C也是正确的。选项B和D描述的情况更适合使用气关式执行器。", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181202", "t": 2, "q": "给水控制系统中，汽包水位的控制要求包括（　）", "a": ["避免水位过高导致蒸汽带水", "避免水位过低导致锅炉干烧", "负荷变化时，能快速跟踪水位变化", "正常运行时，水位波动在允许范围内", "", ""], "r": "ABCD", "e": "汽包水位过高会使蒸汽带水，水位过低会导致锅炉干烧，这两种情况都很危险；正常运行水位要在允许范围波动；负荷变化时系统需快速跟踪水位变化以保证水位稳定。答案为ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181203", "t": 2, "q": "给水控制系统中，汽包水位过低的危害包括（　）", "a": ["锅炉水循环破坏，导致管壁过热", "蒸汽产量增加", "锅炉干烧，引发安全事故", "蒸汽温度升高", "", ""], "r": "ACD", "e": "答案：ACD汽包水位过低会带来以下危害：A. 水位过低可能导致锅炉水循环被破坏，使得部分管壁得不到足够的冷却而过热。C. 严重缺水时可能造成锅炉干烧，从而引发安全事故。D. 水位低会使蒸汽空间增大，导致蒸汽带出的热量增多，从而使蒸汽温度升高。B 选项蒸汽产量增加不是汽包水位过低的危害。", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181204", "t": 2, "q": "给水控制系统中，汽包水位过高的危害包括（　）", "a": ["蒸汽带水，影响汽轮机安全", "蒸汽温度升高", "过热器结垢，降低传热效率", "锅炉水循环破坏", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181205", "t": 2, "q": "给水控制系统中，汽包水位控制的难点包括（　）", "a": ["存在虚假水位现象", "测量误差大", "负荷变化频繁", "被控对象滞后大", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181206", "t": 2, "q": "给水控制系统中，三冲量控制的优点包括（　）", "a": ["减少虚假水位的影响", "能提前克服蒸汽流量扰动", "结构简单，维护方便", "控制精度高于单冲量控制", "", ""], "r": "ABD", "e": "三冲量控制引入蒸汽流量和给水流量信号，可提前克服蒸汽流量扰动，减少虚假水位影响，且控制精度高于单冲量控制。结构并不简单。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181207", "t": 2, "q": "给水控制系统中，三冲量控制相比双冲量控制的优势在于（　）", "a": ["减少虚假水位的影响", "简化控制系统结构", "增加给水流量反馈，校正给水侧扰动", "提高对给水压力波动的抑制能力", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181208", "t": 2, "q": "给水控制系统中，三冲量信号各自的作用包括（　）", "a": ["蒸汽流量: 作为前馈信号，提前补偿负荷变化", "汽包压力: 作为扰动信号，补偿压力波动影响", "汽包水位: 作为主反馈信号，控制水位稳定", "给水流量: 作为反馈校正信号，修正给水偏差", "", ""], "r": "ACD", "e": "在给水控制系统三冲量中，蒸汽流量作前馈，提前应对负荷变化；汽包水位是主反馈，保证水位稳定；给水流量为反馈校正，修正给水偏差。汽包压力不是三冲量信号。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181209", "t": 2, "q": "给水控制系统中，虚假水位产生的原因包括（　）", "a": ["汽包压力突然变化", "炉膛温度突然变化", "蒸汽流量突然变化", "给水流量突然变化", "", ""], "r": "AC", "e": "答案：AC虚假水位是指在锅炉运行中，由于某些原因造成的水位计读数与实际水位不符的现象。主要原因是汽包压力的突然变化和蒸汽流量的突然变化。汽包压力的变化会影响水的沸点，从而影响水位；蒸汽流量的变化会直接影响锅炉内的水位平衡。因此，正确答案是A和C。", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181210", "t": 2, "q": "给水控制系统中，虚假水位对控制的影响包括（　）", "a": ["延长调节时间", "直接导致汽包缺水或满水", "增大系统超调量", "导致控制器误动作", "", ""], "r": "ACD", "e": "这是一道关于给水控制系统中虚假水位影响的选择题。我们不需要逐个分析每个选项的详细情况，而是可以通过理解虚假水位的基本特性及其对控制系统的影响来快速判断。虚假水位是指在锅炉运行中，由于某些原因（如负荷突变）导致水位计显示的水位与实际水位不符的现象。这种虚假信号会传递给控制系统，从而影响控制效果。现在，我们简要分析每个选项：A. 延长调节时间：虚假水位会导致控制系统接收到错误的水位信号，从而可能进行不必要的或反向的调节操作，这自然会延长系统达到稳定状态所需的时间。因此，A选项正确。B. 直接导致汽包缺水或满水：虚假水位本身并不会直接导致汽包的实际缺水或满水，它只是提供了一个错误的水位信号。实际的缺水或满水状态是由多种因素共同决定的。因此，B选项不正确。C. 增大系统超调量：由于虚假水位导致的错误调节，系统可能会超出其正常调节范围，从而产生较大的超调量。这意味着系统在达到稳定状态前会经历更大的波动。因此，C选项正确。D. 导致控制器误动作：虚假水位作为一个错误的输入信号，很容易使控制器做出错误的判断和动作，即误动作。这是控制系统中最常见的影响之一。因此，D选项正确。综上所述，虚假水位对给水控制系统的影响主要包括延长调节时间、增大系统超调量和导致控制器误动作。因此，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181211", "t": 2, "q": "给水控制系统中，影响汽包水位的主要因素包括（　）", "a": ["给水流量", "炉膛温度", "蒸汽流量", "汽包压力", "", ""], "r": "AC", "e": "汽包水位受给水流量、蒸汽流量影响，给水流量增加水位上升，蒸汽流量增加水位下降。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181212", "t": 2, "q": "过程控制系统动态特性的时域描述参数包括（　）", "a": ["衰减比", "超调量", "幅频特性", "调节时间", "", ""], "r": "ABD", "e": "时域描述参数用于描述系统在时间域的动态特性，衰减比、超调量、调节时间都属于时域描述参数；幅频特性是频域描述参数。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181213", "t": 2, "q": "过程控制系统中，传递函数的基本性质包括（　）", "a": ["与系统的输入信号类型无关", "只与系统本身的结构和参数有关", "与系统的初始条件无关", "反映系统的动态特性", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181214", "t": 2, "q": "过程控制系统中，传递函数的零点和极点对系统性能的影响包括（　）", "a": ["极点影响系统的振荡特性", "极点决定系统的稳定性", "零点影响系统的响应速度", "雍点不直接影响系统的静态增益", "", ""], "r": "ABC", "e": "极点决定系统稳定性，影响系统振荡特性；零点影响系统响应速度和动态性能，不直接影响静态增益。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181215", "t": 2, "q": "过程控制系统中，传递函数的推导依据包括（　）", "a": ["基尔霍夫定律（电学系统）", "牛顿运动定律（机械系统）", "质量守恒定律（液位系统）", "能量守恒定律（温度系统）", "", ""], "r": "ABCD", "e": "在过程控制系统推导传递函数时，电学系统常依据基尔霍夫定律，机械系统依据牛顿运动定律，液位系统依据质量守恒定律，温度系统依据能量守恒定律。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181216", "t": 2, "q": "过程控制系统中，二阶系统的动态特性由（　）决定。", "a": ["放大系数K", "固有频率ωn", "阻尼比ζ", "滞后时间τ", "", ""], "r": "BC", "e": "二阶系统动态特性主要由固有频率ωn和阻尼比ζ决定。放大系数K影响稳态值，滞后时间τ是滞后环节参数。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181217", "t": 2, "q": "过程控制系统中，阶跃响应曲线的主要参数包括（　）", "a": ["稳态值", "调节时间", "上升时间", "峰值时间", "", ""], "r": "ABCD", "e": "阶跃响应曲线主要参数用于描述系统响应特性，稳态值体现系统最终达到的稳定状态，调节时间反映系统过渡到稳定所需时长，上升时间、峰值时间也都是衡量响应过程关键指标。ABCD选项内容均为阶跃响应曲线主要参数。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181218", "t": 2, "q": "过程控制系统中，描述被控对象动态特性的核心参数有（　）", "a": ["放大系数K", "滞后时间τ", "时间常数T", "阻尼比ζ", "", ""], "r": "ABC", "e": "放大系数K、滞后时间τ、时间常数T是描述被控对象动态特性的核心参数，阻尼比ζ主要用于描述二阶系统的振荡特性，并非描述被控对象动态特性核心参数。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181219", "t": 2, "q": "过程控制系统中，频率特性的相频特性反映了（　）", "a": ["幅值比随输入信号频率的变化规律", "输出信号与输入信号的幅值比", "输出信号与输入信号的相位差", "相位差随输入信号频率的变化规律", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181220", "t": 2, "q": "过程控制系统中，频率特性分析的优点包括（　）", "a": ["适合分析高阶系统和有滞后的系统", "计算简单，无需建立数学模型", "能直接判断系统的稳定性", "可通过实验方法获取频率特性", "", ""], "r": "ACD", "e": "频率特性分析适合高阶和有滞后系统，可通过实验获取特性，能直接判断稳定性。虽可在一定程度避免复杂数学建模，但并非无需建立。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181221", "t": 2, "q": "过程控制系统中，频率特性分析的主要参数包括（　）", "a": ["相频特性", "截止频率", "谐振频率", "幅频特性", "", ""], "r": "AD", "e": "频率特性分析主要参数有幅频特性和相频特性。截止频率和谐振频率是基于幅频特性等衍生出的特定频率点。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181222", "t": 2, "q": "过程控制系统中，时域分析的优点包括（　）", "a": ["直观，易理解", "计算简单", "能直接得到系统的动态性能指标", "适合分析高阶系统", "", ""], "r": "AC", "e": "时域分析以时间为变量研究系统响应，直观易懂，还能直接得出系统动态性能指标。它计算较复杂，且不适合高阶系统分析。答案选AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181223", "t": 2, "q": "过程控制系统中，系统不稳定的表现形式包括（　）", "a": ["阶跃响应衰减振荡", "阶跃响应单调发散", "阶跃响应无超调趋近稳态", "阶跃响应发散振荡", "", ""], "r": "BD", "e": "系统稳定的阶跃响应是衰减收敛的，不稳定则是发散的。单调发散和发散振荡都体现了系统输出不收敛，属于不稳定表现形式。而衰减振荡最终会收敛，无超调趋近稳态也是稳定状态。所以答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181224", "t": 2, "q": "过程控制系统中，系统的动态性能指标包括（　）", "a": ["调节时间", "超调量", "上升时间", "稳态误差", "", ""], "r": "ABC", "e": "控制系统动态性能指标描述系统过渡过程特性，调节时间、超调量、上升时间都属于动态性能指标；稳态误差是衡量系统稳态性能的指标。本题问动态性能指标，答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181225", "t": 2, "q": "过程控制系统中，系统的静态性能指标包括（　）", "a": ["衰减比", "静态增益", "稳态误差", "超调量", "", ""], "r": "BC", "e": "静态性能指标描述系统在稳态时的性能，静态增益反映系统输入输出的静态比例关系，稳态误差体现系统稳定时的误差情况，它们属于静态性能指标；而衰减比和超调量是描述系统动态响应特性的指标。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181226", "t": 2, "q": "过程控制系统中，系统稳定的必要条件包括（　）", "a": ["开环传递函数的幅频特性在相频特性为-180度时，幅值小于1", "系统阶跃响应无超调", "系统存在正反馈", "特征方程所有根的实部均小于零", "", ""], "r": "AD", "e": "这是一道关于过程控制系统稳定性的选择题。为了简化解析，我们可以从系统稳定性的基本概念出发。首先，系统稳定性通常要求系统的特征方程的所有根的实部都小于零，这保证了系统不会发散。这是系统稳定的一个核心条件。接下来，我们逐一考虑各个选项：A. 开环传递函数的幅频特性在相频特性为-180度时，幅值小于1。这个条件与系统的稳定性密切相关。当相频特性达到-180度时，如果幅值仍然大于1，系统可能会变得不稳定。因此，这个条件是确保系统稳定的重要因素。B. 系统阶跃响应无超调。虽然无超调是系统性能的一个好指标，但它并不是系统稳定的必要条件。系统可以在有超调的情况下仍然保持稳定。C. 系统存在正反馈。正反馈通常会导致系统不稳定，因为它会放大系统的偏差，而不是减小它。因此，这个选项明显与系统稳定相悖。D. 特征方程所有根的实部均小于零。这是系统稳定的基本条件，如前所述，它保证了系统不会发散。综上所述，A和D选项是系统稳定的必要条件。所以，正确答案是AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181227", "t": 2, "q": "过程控制系统中，系统稳定的充分必要条件包括（　）", "a": ["特征方程所有根的实部均小于零", "系统阶跃响应无超调", "系统存在负反馈", "开环奈奎斯特曲线不包围（-1,j0）点", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181228", "t": 2, "q": "过程控制系统中，一阶对象的阶跃响应曲线具有的特点是（　）", "a": ["最终趋于稳态值", "存在等幅振荡", "单调上升", "无超调", "", ""], "r": "ACD", "e": "一阶对象阶跃响应曲线，输出随时间单调变化，最终趋于稳态值，无超调。B选项等幅振荡不是一阶对象特点。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181229", "t": 2, "q": "过程控制系统中，一阶系统的时间常数T对响应的影响包括（　）", "a": ["T越大，响应速度越慢", "T越小，响应速度越快", "T越大，调节时间越长", "T越小，超调量越大", "", ""], "r": "ABC", "e": "对于一阶系统，时间常数T反映系统响应速度，T越大，系统响应越慢、调节时间越长；T越小，响应速度越快。而一阶系统无超调。所以ABC正确，D错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181230", "t": 2, "q": "过程控制系统中，一阶系统阶跃响应的特点包括（　）", "a": ["初始响应速度最快", "响应曲线单调上升", "最终趋近于稳态值", "无超调现象", "", ""], "r": "BCD", "e": "一阶系统阶跃响应无超调，响应曲线单调上升，最终趋近稳态值，初始响应速度并非最快。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181231", "t": 2, "q": "燃烧控制系统的主要子系统包括（　）", "a": ["汽包水位控制系统", "送风量控制系统", "燃料量控制系统", "引风量控制系统", "", ""], "r": "BCD", "e": "燃烧控制系统主要是对燃烧过程进行控制，送风量、燃料量、引风量是燃烧控制的关键要素，分别对应供风、燃料供给和烟气排放控制。而汽包水位控制系统主要是维持汽包水位稳定，与燃烧控制无直接关联。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803732713181232", "t": 2, "q": "燃烧控制系统中，空燃比控制的目的包括（　）", "a": ["提高锅炉热效率", "保证燃料充分燃烧", "控制汽包水位", "减少污染物排放", "", ""], "r": "ABD", "e": "合理控制空燃比能让燃料充分燃烧，提高锅炉热效率，还可减少污染物排放。而控制汽包水位与空燃比无关。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142080", "t": 3, "q": "串级控制系统中，副调节器通常采用PID控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级控制系统中，副调节器一般采用P控制，因为副回路要快速动作克服干扰，积分作用会使响应变慢，微分作用在副回路中也不是必需的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142081", "t": 3, "q": "串级控制系统中，副回路的调节周期比主回路长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级控制系统中副回路调节速度快、周期短，主回路调节相对慢、周期长。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142082", "t": 3, "q": "串级控制系统中，副回路的放大系数越大，抗干扰能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在串级控制系统副回路里，放大系数适当增大可增强抗干扰能力，因为它能使副控制器输出变化更显著，加快
