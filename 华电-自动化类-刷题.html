性系统，非线性系统不能简单直接线性化用此方法。而基于神经网络、非线性最小二乘法（如高斯 - 牛顿法）、基于模糊逻辑的方法都可用于非线性系统的辨识。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258469", "t": 2, "q": "模型参数辨识中，当被控对象是时变系统时，可采用的辨识方法包括（　）", "a": ["加权最小二乘法", "遗忘因子递推最小二乘法", "自适应辨识方法", "递推最小二乘法", "", ""], "r": "BC", "e": "时变系统参数随时间变化，普通递推最小二乘法难以跟踪变化，而遗忘因子递推最小二乘法通过引入遗忘因子能更关注近期数据，适应参数变化；自适应辨识方法也能根据系统变化自动调整辨识参数。加权最小二乘法常用于处理测量噪声特性不同的情况；普通递推最小二乘法适用于定常系统。所以答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258470", "t": 2, "q": "模型参数辨识中，当辨识数据存在有色噪声时，可采用的改进方法包括（　）", "a": ["梯度下降法（不做任何改进）", "辅助变量法", "扩展最小二乘法（增广误差模型）", "普通最小二乘法（直接使用）", "", ""], "r": "BC", "e": "当辨识数据存在有色噪声时，普通最小二乘法直接使用会导致参数估计有偏差，梯度下降法不做改进也难以处理有色噪声问题。而辅助变量法和扩展最小二乘法可用于处理存在有色噪声的情况。所以答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258471", "t": 2, "q": "模型参数辨识中，递推最小二乘法的递推公式包括（　）", "a": ["参考模型输出更新公式", "参数估计值更新公式", "误差协方差矩阵更新公式", "增益矩阵更新公式", "", ""], "r": "BCD", "e": "递推最小二乘法递推公式主要有参数估计值更新公式、误差协方差矩阵更新公式和增益矩阵更新公式。参考模型输出更新公式不属于递推最小二乘法递推公式。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258472", "t": 2, "q": "模型参数辨识中，递推最小二乘法相比普通最小二乘法的优势有（　）", "a": ["可在线实时辨识", "辨识精度更高", "计算量更小", "无需存储所有历史数据", "", ""], "r": "AD", "e": "递推最小二乘法可在新数据到来时实时更新参数，能在线实时辨识，且不用存所有历史数据。而普通最小二乘法需一次性处理所有数据。递推最小二乘法计算量不一定小，精度也不必然更高。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258473", "t": 2, "q": "模型参数辨识中，抗差最小二乘法（如M估计）的特点包括（　）", "a": ["通过修改目标函数降低异常值的影响", "辨识精度高于普通最小二乘法", "计算复杂度比普通最小二乘法高", "对异常值（粗大误差）的鲁棒性强", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258474", "t": 2, "q": "模型参数辨识中，输入信号的选择应满足的条件包括（　）", "a": ["具有充分的激励性（能激发系统的所有模态）", "任意信号均可，无需考虑激励性", "信号的频率范围覆盖系统的带宽", "信号的幅值应在系统的线性工作范围内", "", ""], "r": "ACD", "e": "模型参数辨识时，输入信号要有充分激励性以激发系统所有模态，频率范围需覆盖系统带宽，幅值要在系统线性工作范围内，并非任意信号都行。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258475", "t": 2, "q": "模型参数辨识中，遗忘因子递推最小二乘法的遗忘因子选择应遵循（　）", "a": ["系统时变速率越快，遗忘因子应越小（更重视新数据）", "遗忘因子可取值为1（退化为普通递推最小二乘法）", "遗忘因子取值在(0,1]之间", "系统时变速率越慢，遗忘因子应越接近1（新老数据权重接近）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258476", "t": 2, "q": "模型参数辨识中，影响辨识精度的因素包括（　）", "a": ["噪声信号的强度", "辨识数据的长度", "输入信号的激励充分性", "辨识方法的选择", "", ""], "r": "ABCD", "e": "噪声信号强度大、辨识数据长度不足、输入信号激励不充分、辨识方法选择不当都会影响模型参数辨识精度。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258477", "t": 2, "q": "模型参数辨识中，最小二乘法的基本假设包括（　）", "a": ["噪声信号与输入信号不相关", "被控对象是线性时不变的", "噪声信号是零均值的", "噪声信号是高斯白噪声", "", ""], "r": "ABC", "e": "最小二乘法用于模型参数辨识，基本假设含噪声信号零均值、与输入信号不相关、被控对象线性时不变等。高斯白噪声不是其必需要求的基本假设。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258478", "t": 2, "q": "神经网络控制中，常用的神经网络类型有（　）", "a": ["BP神经网络", "PID神经网络", "RBF神经网络", "模糊规则网络", "", ""], "r": "AC", "e": "BP神经网络和RBF神经网络是神经网络控制中常用类型。PID是控制算法不是神经网络类型；模糊规则网络和神经网络有区别。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258479", "t": 2, "q": "神经网络控制中，基于神经网络的预测控制的核心步骤包括（　）", "a": ["用神经网络构建被控对象的预测模型", "利用反馈校正修正神经网络预测模型的输出", "直接用神经网络输出控制量，无需优化", "通过滚动优化求解最优控制量序列", "", ""], "r": "ABD", "e": "基于神经网络的预测控制，先构建预测模型，再反馈校正，最后滚动优化求最优控制量序列，而不是无需优化，C错误。答案为ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803772714258480", "t": 2, "q": "神经网络控制中，基于神经网络的PID参数自整定控制的特点包括（　）", "a": ["无需训练神经网络", "用神经网络在线调整PID的Kp、Ki、Kd参数", "适用于线性和非线性系统", "无需知道被控对象的精确模型", "", ""], "r": "BCD", "e": "基于神经网络的PID参数自整定控制需训练神经网络，A错；它利用神经网络在线调整PID的Kp、Ki、Kd参数，B对；可用于线性和非线性系统，且无需知道被控对象精确模型，C、D对。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887680", "t": 3, "q": "改进PID控制中的变积分PID，其积分系数Ki随偏差的增大而增大，随偏差的减小而减小，以平衡快速响应与积分饱和。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "变积分PID的积分系数Ki是随偏差的增大而减小，随偏差的减小而增大，并非题干所说的随偏差增大而增大，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887681", "t": 3, "q": "改进PID控制中的串级PID，副回路的积分时间常数应大于主回路的积分时间常数，以保证副回路响应速度快于主回路。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级PID中副回路积分时间常数应小于主回路，这样副回路响应才快，题中说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887682", "t": 3, "q": "改进PID控制中的串级PID，副控制器的控制周期应大于主控制器的控制周期，以保证副回路快速响应，抑制副回路内的干扰。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级PID中副控制器控制周期应小于主控制器控制周期，这样副回路才能快速响应，抑制副回路内干扰。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887683", "t": 3, "q": "改进PID控制中的串级PID，主控制器的输出作为副控制器的设定值，因此主控制器的控制精度直接决定副回路的控制性能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级PID中主控制器的输出是副控制器设定值，但副回路控制性能还受副控制器自身特性、副回路对象特性及干扰等影响，并非仅由主控制器控制精度决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887684", "t": 3, "q": "改进PID控制中的积分分离PID，其积分分离阈值应根据系统的超调量要求设定，阈值越大，积分作用投入越早，系统超调量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "积分分离阈值越大，积分作用投入越晚而非越早，积分作用投入晚一般会使系统超调量增大而非减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887685", "t": 3, "q": "改进PID控制中的积分分离PID，在系统偏差较大时引入积分作用以加快响应，偏差较小时切除积分作用以避免积分饱和。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "积分分离PID是在系统偏差较大时切除积分作用，避免积分饱和；偏差较小时引入积分作用以消除稳态误差。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887686", "t": 3, "q": "改进PID控制中的抗积分饱和PID，无论采用积分分离法还是限幅法，其核心都是通过限制积分项的增长，避免控制器输出超出执行器范围。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抗积分饱和的积分分离法是在偏差大时不进行积分，偏差小时进行积分；限幅法是对积分项进行限幅，二者核心都是限制积分项增长，防止控制器输出超执行器范围。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887687", "t": 3, "q": "改进PID控制中的微分先行PID，将微分环节移至反馈通道，对系统输出进行微分，可有效避免设定值突变导致的微分冲击。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "微分先行PID把微分环节移到反馈通道，对系统输出微分，这样设定值突变时，微分环节不会受其影响，能避免微分冲击。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887688", "t": 3, "q": "改进PID控制中的智能PID（如模糊PID），无需整定任何参数，可直接投入使用，因此比常规PID更易工程实现。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智能PID（如模糊PID）虽有优势，但仍需整定参数，并非无需整定就能直接使用，所以说更易工程实现不准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887689", "t": 3, "q": "改进PID控制中的Smith预估控制，若被控对象的纯滞后时间未知，可通过在线辨识滞后时间，实时调整预估模型，仍能实现有效的滞后补偿。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Smith预估控制的关键在于准确预估纯滞后时间来补偿滞后影响，当被控对象纯滞后时间未知时，可通过在线辨识获取并实时调整预估模型，进而实现有效滞后补偿。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887690", "t": 3, "q": "改进PID控制中的Smith预估控制，若被控对象的增益发生变化，预估模型的增益也需相应调整，否则补偿效果会显著下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Smith预估控制依赖于精确的预估模型，当被控对象增益变化，预估模型增益不相应调整，会使预估与实际偏差大，补偿效果显著下降。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887691", "t": 3, "q": "改进PID控制中的Smith预估控制，适用于所有含纯滞后的系统，无论系统是线性还是非线性，均能有效补偿滞后。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "Smith预估控制是一种针对线性含纯滞后系统设计的控制方法，对非线性含纯滞后系统不能有效补偿滞后。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887692", "t": 3, "q": "模糊控制的规则库若满足完备性，即任意输入模糊集合都能找到对应的控制规则，则无需考虑规则的一致性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "完备性和一致性是模糊控制规则库的两个不同重要特性，满足完备性不能忽略一致性。若规则不一致，会使控制结果混乱。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887693", "t": 3, "q": "模糊控制的模糊规则若采用\"if e is A and ec is B then u is C\"的形式，则该规则属于双输入单输出规则，是模糊控制中最常用的规则形式。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在该规则“if e is A and ec is B then u is C”里，“e”和“ec”是输入变量，有两个输入；“u”是输出变量，为单输出，此形式是模糊控制常用规则形式。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887694", "t": 3, "q": "模糊控制中，解模糊的最大隶属度法计算简单、实时性好，但可能丢失模糊输出集合的部分信息，导致控制精度较低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最大隶属度法在模糊控制解模糊时确实计算简单、实时性好，它仅取隶属度最大元素代表模糊集合，会丢失部分信息，使控制精度受影响。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887695", "t": 3, "q": "模糊控制中，隶属度函数的参数（如三角形的顶点）一旦确定，便不可修改，否则会导致控制规则失效。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "隶属度函数参数可根据实际情况调整优化，调整后重新设计控制规则或对规则微调，并非不可修改，修改也不一定导致控制规则失效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887696", "t": 3, "q": "模糊控制中，隶属度函数的论域范围应与输入变量的实际物理范围完全一致，否则会导致模糊化误差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "隶属度函数论域范围不一定要和输入变量实际物理范围完全一致，可通过比例变换等处理，不一定就会导致模糊化误差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887697", "t": 3, "q": "模糊控制中，隶属度函数的模糊子集划分越多，控制规则越精细，控制精度越高，但对系统参数变化的鲁棒性越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "隶属度函数模糊子集划分多，控制规则精细、精度高，但会使系统对参数变化更敏感，鲁棒性变弱而非变强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887698", "t": 3, "q": "模糊控制中，隶属度函数的形状越尖锐，控制精度越高，同时系统的鲁棒性也越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "模糊控制中，隶属度函数形状越尖锐，控制精度越高，但系统鲁棒性会变差，因为尖锐的隶属度函数对输入变化更敏感。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887699", "t": 3, "q": "模糊控制中，模糊规则的\"if-then\"形式仅适用于单输入单输出系统，双输入单输出系统需采用其他规则形式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "模糊规则的“if - then”形式可用于单输入单输出、双输入单输出等多种系统，并非仅适用于单输入单输出系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887700", "t": 3, "q": "模糊控制中，模糊规则的数量取决于输入变量的模糊子集个数，若双输入变量各划分为5个模糊子集，则规则数量为5×5=25条，无需额外增减。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "模糊控制中，双输入变量模糊规则数量通常是各输入变量模糊子集个数相乘，若双输入变量各划分为5个模糊子集，理论上规则数量是 5×5 = 25条，一般无特殊情况无需额外增减。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887701", "t": 3, "q": "模糊控制中，模糊推理的结果是精确的控制量，无需经过解模糊环节即可直接作用于被控对象。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "模糊推理结果是模糊量，需经解模糊环节转化为精确控制量才能作用于被控对象。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887702", "t": 3, "q": "在模糊控制中，若输入变量的偏差e和偏差变化率ec均为\"零（ZO）\"，则模糊规则的输出控制量u通常也为\"零（ZO）\"，以维持系统稳态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在模糊控制里，当输入的偏差e和偏差变化率ec都为“零（ZO）”，意味着系统处于相对稳定状态，通常会输出“零（ZO）”的控制量来维持稳态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887703", "t": 3, "q": "模糊控制中，输入变量的量化等级越多，模糊子集划分越细，控制规则数量越多，控制精度越高，因此量化等级应尽可能多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然量化等级多会使模糊子集划分细、控制规则多、控制精度高，但量化等级过多会增加计算量和系统复杂度，甚至可能导致系统性能下降，所以并非量化等级应尽可能多。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887704", "t": 3, "q": "模型参考自适应控制（MRAC）中，参考模型的输出是系统的设定值，可调系统的输出只需跟踪该设定值即可实现自适应控制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887705", "t": 3, "q": "模型参考自适应控制中，波波夫超稳定性理论不要求系统的非线性部分满足李普希茨条件，因此适用范围比李雅普诺夫稳定性理论更广。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "波波夫超稳定性理论不要求非线性部分满足李普希茨条件，在模型参考自适应控制里适用范围比需该条件的李雅普诺夫稳定性理论广。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887706", "t": 3, "q": "模型参考自适应控制中，采用李雅普诺夫稳定性理论设计自适应律，可保证参考模型与可调系统的输出偏差渐近收敛到零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "李雅普诺夫稳定性理论是分析系统稳定性的重要工具，在模型参考自适应控制里，用其设计自适应律能确保参考模型与可调系统输出偏差渐近收敛到零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887707", "t": 3, "q": "模型参考自适应控制中，参考模型的阶数必须与被控对象的阶数相同，否则可调系统无法实现输出跟踪。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。模型参考自适应控制中，参考模型阶数不一定要与被控对象阶数相同，通过自适应机制可使可调系统输出尽可能跟踪参考模型输出，并非阶数不同就无法实现输出跟踪。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887708", "t": 3, "q": "模型参考自适应控制中，参考模型的输出与可调系统的输出偏差为零时，自适应律的更新信号为零，参数调整停止，系统进入稳态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在模型参考自适应控制里，参考模型输出和可调系统输出偏差为零，意味着系统达到期望状态，此时自适应律更新信号为零，参数停止调整，系统进入稳态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887709", "t": 3, "q": "模型参考自适应控制中，可调系统的结构必须与参考模型完全一致，否则无法通过自适应律实现输出跟踪。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "模型参考自适应控制中，可调系统和参考模型结构不一定要完全一致，只要能通过自适应律调整可调系统参数，使可调系统输出跟踪参考模型输出即可。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887710", "t": 3, "q": "模型参考自适应控制中，李雅普诺夫函数的选择唯一，若选择不当，无法保证系统的稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "李雅普诺夫函数的选择不唯一，只要能满足相关条件即可用于分析系统稳定性。所以题干说选择唯一错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887711", "t": 3, "q": "在模型参考自适应控制系统中，如果被控对象受到高频干扰的影响，这将导致自适应律的更新速度增加，并可能引起系统输出的振荡。基于此情况，在输入端加入低通滤波器是一种有效的解决策略。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "高频干扰使自适应律更新快、系统输出振荡，低通滤波器可滤除高频干扰，稳定系统，所以加入低通滤波器是有效策略。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887712", "t": 3, "q": "模型参考自适应控制中，若参考模型的动态特性设计过慢（如响应时间过长），会导致可调系统的跟踪误差增大，稳态精度下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "参考模型动态特性过慢，可调系统跟踪时难以快速匹配，会使跟踪误差增大，进而影响稳态精度。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887713", "t": 3, "q": "模型参考自适应控制中，若参考模型的输出存在测量噪声，会导致自适应律的更新信号包含噪声，参数调整震荡，需对参考模型输出进行滤波。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "参考模型输出有测量噪声时，会使自适应律更新信号带噪声，进而造成参数调整震荡，对参考模型输出滤波可减少噪声影响。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887714", "t": 3, "q": "模型参考自适应控制中，若可调系统的参数收敛到参考模型的参数，则可调系统的动态特性与参考模型完全一致，输出偏差为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887715", "t": 3, "q": "模型参考自适应控制中，若可调系统的参数收敛到真实值，则参考模型与可调系统的输出偏差一定收敛到零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在模型参考自适应控制里，当可调系统参数收敛到真实值，意味着可调系统逼近理想状态，此时参考模型与可调系统输出偏差会收敛到零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887716", "t": 3, "q": "模型参考自适应控制中，自适应律的增益选择越大，可调系统参数的调整速度越快，因此增益应尽可能大，以加快跟踪速度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自适应律增益并非越大越好，过大的增益会使系统产生过大的控制作用，导致系统不稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887717", "t": 3, "q": "模型参数辨识的遗忘因子递推最小二乘法中，遗忘因子取值越接近1，对旧数据的权重越大，越适合跟踪快速时变的被控对象。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "遗忘因子越接近1，旧数据权重越大，更适合平稳、变化慢的对象，而不是快速时变对象。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887718", "t": 3, "q": "在模型参数辨识的最小二乘法中，若噪声信号与输入信号相关，则参数估计量是有偏的，无法保证估计精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最小二乘法中，当噪声信号与输入信号相关时，会破坏估计量无偏性的条件，导致参数估计量有偏，影响估计精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887719", "t": 3, "q": "在模型参数辨识中，当被控对象是时变系统时，普通递推最小二乘法因对新老数据权重相同，无法有效跟踪参数的时变趋势，需采用遗忘因子递推最小二乘法。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "普通递推最小二乘法对新老数据权重相同，对于时变系统，不能突出新数据作用，难以跟踪参数时变趋势，而遗忘因子递推最小二乘法可加大新数据权重，能有效跟踪时变参数。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887720", "t": 3, "q": "模型参数辨识中，递推最小二乘法的计算量随数据量的增加而线性增加，因此适合在线实时辨识。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "递推最小二乘法通过不断利用新数据更新估计值，计算量不随数据量大幅增加，能实时更新参数，适合在线实时辨识。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887721", "t": 3, "q": "在模型参数辨识中，辅助变量法通过引入与输入相关、但与噪声不相关的辅助变量，可以有效解决有色噪声导致的最小二乘估计有偏问题。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "辅助变量法的核心就是引入与输入相关且和噪声不相关的辅助变量，以此克服有色噪声影响，解决最小二乘估计有偏问题。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887722", "t": 3, "q": "模型参数辨识中，加权最小二乘法的权重应根据数据的可靠性设定，可靠性高的数据权重小，可靠性低的数据权重大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在加权最小二乘法中，为让可靠性高的数据在拟合中起更大作用，应给可靠性高的数据赋予大权重，可靠性低的数据赋予小权重。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887723", "t": 3, "q": "模型参数辨识中，扩展最小二乘法通过将噪声模型的参数纳入辨识范围（增广误差模型），可将有色噪声转化为白噪声处理，从而获得无偏估计。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "扩展最小二乘法确实是把噪声模型参数纳入辨识范围形成增广误差模型，进而能将有色噪声转化为白噪声处理以得到无偏估计。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887724", "t": 3, "q": "在模型参数辨识过程中，如果被控对象的输出信号中混有高频噪声，可以通过增加采样周期（即降低采样频率）的方式，来滤除这些高频噪声，从而达到提高辨识精度的目的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "增加采样周期降低采样频率，可使高频噪声在采样中被平均化或衰减，减少其对数据的影响，进而提高辨识精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887725", "t": 3, "q": "模型参数辨识中，若被控对象的输入信号为阶跃信号，由于阶跃信号的激励频率单一，无法辨识出对象的全部动态特性，需采用多频率的输入信号（如正弦扫频信号）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "阶跃信号激励频率单一，不能覆盖对象的全部频率特性，所以难以辨识对象全部动态特性，而多频率输入信号能更好地激发对象不同频率响应，可用于辨识全部动态特性。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887726", "t": 3, "q": "模型参数辨识中，若辨识数据存在异常值（粗大误差），普通最小二乘法会对异常值敏感，导致估计偏差增大，需采用抗差最小二乘法（如M估计）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "普通最小二乘法在数据存在异常值时，会受到异常值较大影响，使得估计偏差增大，而抗差最小二乘法能有效降低异常值的影响。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887727", "t": 3, "q": "在模型参数辨识过程中，输入信号的激励充分性指的是该信号的频率范围应当覆盖被控对象的整个带宽;若不满足这一条件，则无法完全辨识出对象的所有动态特性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "输入信号激励充分才能全面激发对象动态特性，频率范围覆盖被控对象整个带宽是激励充分的要求，不满足就无法完整辨识对象所有动态特性。", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887728", "t": 3, "q": "在模型参数辨识中，遗忘因子递推最小二乘法的遗忘因子取值不能小于0.5，否则会导致辨识参数发散。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "遗忘因子递推最小二乘法中遗忘因子取值范围是0到1，当遗忘因子过小时确实可能使辨识参数发散，但说不能小于0.5太绝对。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803775490887729", "t": 3, "q": "线性定常离散系统的状态转移矩阵Φ(k)=A^k，其中A是系统矩阵，k为采样步数，因此Φ(k)与A的幂运算结果完全一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常离散系统状态转移矩阵Φ(k)定义就是A^k，所以其与A的幂运算结果必然完全一致。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第7章 先进控制（2）", "n": "基础练习题【含解析】 / 第7章 先进控制（2）", "qs": [{"id": "2034803781778149376", "t": 1, "q": "线性定常系统的能控性判据中，能控性矩阵的秩等于（　）时，系统完全能控", "a": ["系统的输入维数", "系统的状态维数", "系统的传递函数阶数", "系统的输出维数", "", ""], "r": "B", "e": "线性定常系统完全能控的充要条件是能控性矩阵的秩等于系统的状态维数。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149377", "t": 1, "q": "线性定常系统的状态空间模型若能控且能观，则其传递函数矩阵（　）", "a": ["存在零极点抵消", "不存在零极点抵消", "一定是对角矩阵", "一定是满秩矩阵", "", ""], "r": "B", "e": "线性定常系统能控且能观时，其传递函数矩阵不存在零极点抵消。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149378", "t": 1, "q": "线性定常系统的状态空间模型转换为约旦标准型的目的是（　）", "a": ["使系统矩阵A成为对角矩阵（当无重极点时）", "简化系统的能控性和能观性分析", "改变系统的传递函数", "增加系统的复杂度", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149379", "t": 1, "q": "预测控制的滚动优化窗口中，控制时域N_u和预测时域N_p的关系通常是（　）", "a": ["N_u>N_p", "无固定关系", "N_u=N_p", "N_u<N_p", "", ""], "r": "D", "e": "预测时域要包含控制时域，即控制时域是预测时域的一部分，所以通常N_u<N_p。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149380", "t": 1, "q": "预测控制中，反馈校正的修正系数选择过大会导致（　）", "a": ["系统稳态误差增大", "系统鲁棒性增强", "系统响应速度减慢", "系统对模型误差敏感，输出震荡", "", ""], "r": "D", "e": "反馈校正修正系数过大，会使系统对模型误差更敏感，易导致输出震荡。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149381", "t": 1, "q": "预测控制中，反馈校正的作用是利用（　）修正预测模型的输出，提高预测精度。", "a": ["自适应律的更新量", "参考模型的输出", "被控对象的实际输出与预测输出的偏差", "被控对象的输入信号", "", ""], "r": "C", "e": "反馈校正就是用被控对象实际输出和预测输出的偏差来修正预测模型输出，提升预测精度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149382", "t": 1, "q": "预测控制中，滚动优化的\"滚动\"是指（　）", "a": ["预测模型的滚动更新", "优化目标函数的滚动更新", "在每个采样周期，优化窗口向前移动一个周期，重新优化", "控制量的滚动存储", "", ""], "r": "C", "e": "滚动优化就是在每个采样周期，优化窗口向前移动一个周期并重新优化。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149383", "t": 1, "q": "预测控制中，滚动优化的目标函数通常采用（　）形式", "a": ["输入输出乘积的二次型函数", "仅考虑输出偏差的线性函数", "仅考虑控制量变化的线性函数", "输出偏差的二次型函数（如加权偏差平方和）", "", ""], "r": "D", "e": "预测控制中滚动优化目标函数常以输出偏差的二次型函数（如加权偏差平方和）来衡量系统性能，能综合考虑多种因素使系统优化。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149384", "t": 1, "q": "预测控制中，控制时域N_u的选择过大会导致（　）", "a": ["系统稳态误差减小", "控制量计算量减小，系统实时性提高", "控制量计算量增大，系统实时性下降", "系统稳定性增强", "", ""], "r": "C", "e": "控制时域N_u越大，意味着要考虑更多时刻的控制作用，计算量会增大，计算时间变长，系统实时性就会下降。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149385", "t": 1, "q": "预测控制中，若采用动态矩阵控制（DMC），其预测模型基于（　）", "a": ["状态空间模型", "脉冲响应模型", "阶跃响应模型", "传递函数模型", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149386", "t": 1, "q": "预测控制中，若采用反馈校正，通常采用的校正方式是（　）", "a": ["用偏差修正预测模型的参数", "用偏差对预测输出进行线性修正（如预测输出+修正系数×偏差）", "用偏差直接替换预测输出", "用偏差调整设定值", "", ""], "r": "B", "e": "反馈校正常通过偏差对预测输出进行线性修正，像预测输出加上修正系数与偏差的乘积这种形式。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149387", "t": 1, "q": "预测控制中，若预测模型为阶跃响应模型，其预测输出的计算是基于（　）", "a": ["当前及未来控制量对阶跃响应的叠加", "当前控制量对阶跃响应的单独作用", "过去控制量对阶跃响应的叠加", "未来控制量对阶跃响应的单独作用", "", ""], "r": "A", "e": "预测控制中阶跃响应模型的预测输出是把当前及未来控制量对阶跃响应进行叠加来计算的。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149388", "t": 1, "q": "预测控制中，预测时域N_p的选择过大会导致（　）", "a": ["预测模型精度降低，计算量增大", "预测模型精度提高，计算量减小", "系统稳定性提高", "系统响应速度加快", "", ""], "r": "A", "e": "N_p过大，预测步数多，模型难以精准描述长时段动态，精度降低，同时计算量也会增大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149389", "t": 1, "q": "在常用模型相互转换中，若离散系统的z传递函数存在零极点抵消，转换为状态空间模型时会导致系统（　）", "a": ["既不能控也不能观", "能观但不能控", "能控但不能观", "能控能观性无法确定", "", ""], "r": "D", "e": "当离散系统的z传递函数存在零极点抵消时，会丢失系统的部分信息，导致系统的能控能观性无法仅根据传递函数来确定。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149390", "t": 1, "q": "在离散系统常用模型中，差分方程与z传递函数相互转换的核心依据是（　）", "a": ["拉普拉斯变换的线性性质", "傅里叶变换的卷积定理", "z变换的时移性质", "拉普拉斯变换的微分性质", "", ""], "r": "C", "e": "差分方程与z传递函数相互转换主要借助z变换的时移性质，它能把差分方程转化为代数方程，从而得到z传递函数。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149391", "t": 1, "q": "在模糊控制规则库的设计中，若输入为\"偏差e\"和\"偏差变化率ec\"，输出为\"控制量u\"，则模糊规则的一般形式是（　）", "a": ["if e is A or ec is B then u is C", "if e is A and ec is B then u is C", "if ec is B then u is C", "if e is A then u is C", "", ""], "r": "B", "e": "模糊规则要同时考虑偏差e和偏差变化率ec对控制量u的影响，需用“and”连接e和ec的条件。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149392", "t": 1, "q": "在模型参考自适应控制（MRAC）中，参考模型的作用是（　）", "a": ["生成自适应控制律", "补偿被控对象的纯滞后", "提供系统期望的动态响应特性", "在线辨识被控对象的参数", "", ""], "r": "C", "e": "参考模型用于给出系统期望的动态响应特性，让被控对象的输出尽量跟踪参考模型的输出。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149393", "t": 1, "q": "在模型参数辨识的梯度下降法中，步长（学习率）的选择至关重要，若步长过大，会导致（　）", "a": ["参数无法更新", "参数收敛速度过慢", "参数收敛到局部极小值", "参数更新过程震荡，甚至发散", "", ""], "r": "D", "e": "步长过大时，每次更新参数的幅度大，容易越过最优值，使参数更新过程震荡，甚至不收敛而发散。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149394", "t": 1, "q": "在模型参数辨识中，当被控对象存在较大噪声时，下列辨识方法中鲁棒性相对较强的是（　）", "a": ["递推最小二乘法", "普通最小二乘法", "加权最小二乘法", "梯度下降法", "", ""], "r": "C", "e": "在存在较大噪声时，加权最小二乘法可通过合理加权降低噪声影响，鲁棒性相对较强。而递推最小二乘法、普通最小二乘法对噪声较敏感，梯度下降法主要用于优化，并非典型参数辨识方法。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149395", "t": 1, "q": "在模型参数辨识中，当被控对象是非线性系统时，若采用线性辨识方法，需满足（　）", "a": ["必须先将非线性系统线性化，且线性化误差为零", "非线性程度足够大", "无需任何条件，直接辨识", "系统工作在小偏差范围内，可近似为线性系统", "", ""], "r": "D", "e": "对于非线性系统用线性辨识方法，是在系统工作在小偏差范围内，此时可近似为线性系统来处理。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149396", "t": 1, "q": "在模型参数辨识中，当被控对象是时变系统时，应采用（　）", "a": ["普通最小二乘法", "加权最小二乘法", "遗忘因子递推最小二乘法", "递推最小二乘法", "", ""], "r": "C", "e": "时变系统参数随时间变化，需要能实时跟踪参数变化的方法。遗忘因子递推最小二乘法可通过遗忘旧数据突出新数据，适应时变系统参数变化。普通最小二乘法适用于静态系统；加权最小二乘法主要解决数据精度不同问题；递推最小二乘法未突出对时变系统的适应性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149397", "t": 1, "q": "在模型参数辨识中，当辨识数据存在异常值（粗大误差）时，应采用（　）", "a": ["普通最小二乘法", "递推最小二乘法", "加权最小二乘法", "抗差最小二乘法（如M估计）", "", ""], "r": "D", "e": "普通、递推和加权最小二乘法对异常值敏感，抗差最小二乘法能有效处理异常值。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149398", "t": 1, "q": "在模型参数辨识中，递推最小二乘法的递推公式中，新的参数估计值等于（　）", "a": ["新的误差信号-增益矩阵×旧的参数估计值", "旧的参数估计值-增益矩阵×新的误差信号", "旧的参数估计值+增益矩阵×新的误差信号", "新的误差信号+增益矩阵×旧的参数估计值", "", ""], "r": "C", "e": "递推最小二乘法中，新的参数估计值是在旧的参数估计值基础上，加上增益矩阵与新的误差信号的乘积来更新的。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149399", "t": 1, "q": "在模型参数辨识中，加权最小二乘法的权重选择依据是（　）", "a": ["数据的可靠性（如噪声小的数据权重高）", "输入信号的大小", "输出信号的大小", "参数的初始估计值", "", ""], "r": "A", "e": "加权最小二乘法中，权重是根据数据的可靠性来选择的，可靠性高（如噪声小）的数据权重高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149400", "t": 1, "q": "在模型参数辨识中，最小二乘法的估计量是无偏估计的前提是（　）", "a": ["噪声信号与输入信号不相关", "辨识数据足够多", "噪声信号是高斯白噪声", "被控对象是线性时不变的", "", ""], "r": "A", "e": "最小二乘法估计量为无偏估计的前提是噪声信号与输入信号不相关。答案选A。  ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149401", "t": 1, "q": "在模型参数辨识中，最小二乘法的基本思想是使（　）达到最小", "a": ["系统输入与模型输入的误差平方和", "系统输出与模型输出的绝对误差之和", "系统输入与模型输入的绝对误差之和", "系统输出与模型输出的误差平方和", "", ""], "r": "D", "e": "最小二乘法是通过最小化误差的平方和寻找数据的最佳函数匹配，在模型参数辨识里，就是让系统输出与模型输出的误差平方和最小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149402", "t": 1, "q": "在模型算法控制（MAC）中，预测模型采用的是（　）", "a": ["阶跃响应模型", "传递函数模型", "脉冲响应模型", "状态空间模型", "", ""], "r": "C", "e": "模型算法控制（MAC）是一种基于脉冲响应的预测控制算法，其预测模型采用脉冲响应模型。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149403", "t": 1, "q": "在神经网络控制中，采用神经网络实现模型参考自适应控制时，神经网络通常用于（　）", "a": ["替代模糊推理环节", "直接输出控制量，无需反馈", "构建参考模型", "在线辨识被控对象模型或设计自适应律", "", ""], "r": "D", "e": "在神经网络控制的模型参考自适应控制里，神经网络可根据系统运行情况在线调整参数，常用来在线辨识被控对象模型或设计自适应律。A选项与模型参考自适应控制无关；B项神经网络控制需反馈；C项参考模型一般是预先设定的，并非神经网络构建。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149404", "t": 1, "q": "在神经网络控制中，监督式学习的特点是（　）", "a": ["仅需要输出信号，无需输入信号", "仅需要输入信号，无需输出信号", "不需要教师信号，网络自主学习", "需要教师信号（期望输出）指导权重更新", "", ""], "r": "D", "e": "监督式学习是有教师信号的学习方式，教师信号即期望输出，网络根据它来指导权重更新。A、B选项输入输出信号都需，C选项是无监督学习的特点。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149405", "t": 1, "q": "自校正控制（STC）与模型参考自适应控制（MRAC）的关键区别在于（　）", "a": ["STC在线辨识被控对象模型，而MRAC不进行这样的辨识", "MRAC需要一个参考模型来指导其控制过程，而STC不需要", "STC需要依赖于外部提供的参考模型来进行控制，这与MRAC不同", "MRAC通过在线辨识被控对象的方式来调整控制器参数，而STC则采用不同的策略", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149406", "t": 1, "q": "自校正控制的\"自校正\"体现在（　）", "a": ["自动调整参考模型的参数", "自动辨识被控对象模型，并用辨识结果调整控制律", "自动补偿外部干扰的影响", "自动调整系统的设定值", "", ""], "r": "B", "e": "自校正控制核心是自动对被控对象模型进行辨识，然后依据辨识结果调整控制律。A选项调整参考模型参数并非自校正控制“自校正”体现；C选项补偿外部干扰影响不是其“自校正”本质；D选项调整系统设定值也不是“自校正”的体现。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149407", "t": 1, "q": "自校正控制中，极点配置控制律的设计目标是使闭环系统的极点位于（　）", "a": ["任意位置，无需考虑稳定性", "虚轴上（连续系统）或单位圆上（离散系统）的期望位置", "左半s平面（连续系统）或单位圆内（离散系统）的期望位置", "右半s平面（连续系统）或单位圆外（离散系统）的期望位置", "", ""], "r": "C", "e": "为保证闭环系统稳定，极点应在能使系统稳定的区域，连续系统是左半s平面，离散系统是单位圆内，且要满足期望性能，极点需在期望位置。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149408", "t": 1, "q": "自校正控制中，若被控对象存在纯滞后，采用最小方差控制时，需要引入（　）", "a": ["参考模型", "Smith预估器", "滞后补偿项到控制律中", "模糊推理环节", "", ""], "r": "B", "e": "这道题目考察的是自校正控制中处理纯滞后问题的方法。在自校正控制中，当被控对象存在纯滞后时，采用最小方差控制策略需要特别处理。我们来逐一简要分析选项：A. 参考模型 - 这主要用于对比和跟踪期望的输出，并不直接解决纯滞后问题。B. Smith预估器 - 这是一种常用的处理纯滞后问题的方法。它通过预估未来的输出来补偿由于纯滞后造成的控制延迟，从而使控制器能够更及时地作出反应。C. 滞后补偿项到控制律中 - 虽然这听起来像是直接解决滞后问题的方法，但在最小方差控制的背景下，这不是标准做法。滞后补偿通常在其他控制策略中使用。D. 模糊推理环节 - 这属于模糊控制的一部分，用于处理不确定性和非线性问题，并非专门针对纯滞后。综上所述，为了在最小方差控制中处理纯滞后问题，最恰当的方法是引入Smith预估器。所以，正确答案是B：“Smith预估器”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149409", "t": 1, "q": "自校正控制中，若被控对象是非最小相位系统，最小方差控制可能会出现（　）问题", "a": ["系统响应速度变慢", "控制器输出无界", "系统稳态误差增大", "系统稳定性下降", "", ""], "r": "B", "e": "对于非最小相位系统，最小方差控制可能使控制器输出无界。因为非最小相位系统零点在单位圆外，最小方差控制设计未考虑此情况会引发该问题。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149410", "t": 1, "q": "自校正控制中，若采用最小方差控制，其适用的系统是（　）", "a": ["非线性系统", "最小相位系统", "非最小相位系统", "任意线性系统", "", ""], "r": "B", "e": "最小方差控制适用于最小相位系统。因为最小相位系统保证了系统逆稳定，能使最小方差控制有效实施。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149411", "t": 1, "q": "自校正控制中，若系统存在测量噪声，为提高辨识精度，通常需要在辨识环节前加入（　）", "a": ["低通滤波器", "高通滤波器", "微分环节", "积分环节", "", ""], "r": "A", "e": "测量噪声一般为高频信号，低通滤波器可让低频信号通过，阻挡高频的测量噪声，从而提高辨识精度。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149412", "t": 1, "q": "自校正控制中，若系统是多输入多输出（MIMO）系统，其辨识和控制的复杂度相比单输入单输出（SISO）系统会（　）", "a": ["降低", "显著增加", "无法确定", "不变", "", ""], "r": "B", "e": "多输入多输出（MIMO）系统变量更多、耦合关系更复杂，其辨识和控制的复杂度相比单输入单输出（SISO）系统会显著增加。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149413", "t": 1, "q": "自校正控制中，若在线辨识的采样周期过短，会导致（　）", "a": ["系统响应速度减慢", "辨识数据量增加，计算量增大，可能导致实时性下降", "辨识数据量减少，精度降低", "系统稳态误差增大", "", ""], "r": "B", "e": "采样周期过短会使辨识数据量增多，计算量随之增大，可能影响实时性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149414", "t": 1, "q": "自校正控制中，若在线辨识的模型精度较低，会导致（　）", "a": ["自适应律更新速率加快", "控制律设计不准确，系统控制性能下降", "预测时域缩短", "参考模型输出偏差增大", "", ""], "r": "B", "e": "在线辨识模型精度低，意味着得到的模型不能准确反映系统特性，基于此设计的控制律自然不准确，进而会使系统控制性能下降。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149415", "t": 1, "q": "最小方差自校正控制中，控制律设计的目标是使（　）最小", "a": ["被控对象输入与输出乘积的方差", "被控对象输出与设定值偏差的方差", "被控对象输出的方差", "被控对象输入的方差", "", ""], "r": "B", "e": "最小方差自校正控制目的是让系统输出尽可能接近设定值，所以其控制律设计目标是使被控对象输出与设定值偏差的方差最小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149416", "t": 1, "q": "BP神经网络的动量项的作用是（　）", "a": ["仅在输入层起作用", "增加计算量", "加快收敛速度，避免陷入局部极小值", "降低网络精度", "", ""], "r": "C", "e": "在BP神经网络中，动量项可使网络在训练时加快收敛速度，还能避免陷入局部极小值。而它并非仅在输入层起作用，也不会增加过多计算量和降低网络精度。所以答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149417", "t": 1, "q": "BP神经网络的反向传播过程中，误差信号的传播方向是（　）", "a": ["从输入层到隐含层再到输出层", "仅在隐含层内部传播", "仅在输出层内部传播", "从输出层到隐含层再到输入层", "", ""], "r": "D", "e": "BP神经网络反向传播是为了修正各层权重以减小误差，其误差信号从输出层开始，向隐含层、输入层传播来调整权重。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149418", "t": 1, "q": "BP神经网络的收敛速度受多种因素影响，下列措施中不能加快收敛速度的是（　）", "a": ["增加隐含层神经元个数", "采用动量项", "采用自适应学习率", "选择合适的学习率（步长）", "", ""], "r": "A", "e": "增加隐含层神经元个数主要影响网络的复杂度和表达能力，不一定能加快收敛速度，甚至可能因网络复杂导致收敛变慢；采用动量项、自适应学习率、选择合适学习率都有助于加快收敛。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149419", "t": 1, "q": "BP神经网络的隐含层神经元个数选择，下列说法正确的是（　）", "a": ["与问题复杂度无关，固定选择某个数量", "个数越少越好，可减少计算量", "个数越多越好，可提高网络精度", "需根据问题复杂度合理选择，过多易过拟合，过少易欠拟合", "", ""], "r": "D", "e": "BP神经网络隐含层神经元个数不能固定选、也不是越少或越多越好，要依据问题复杂度合理选，个数过多会过拟合，过少会欠拟合。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149420", "t": 1, "q": "PID神经网络控制中，网络的输出层神经元通常对应（　）", "a": ["被控对象的输入", "PID控制器的比例、积分、微分系数", "被控对象的输出", "系统的偏差和偏差变化率", "", ""], "r": "B", "e": "在PID神经网络控制里，输出层神经元一般对应PID控制器的比例、积分、微分系数。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149421", "t": 1, "q": "RBF神经网络的径向基函数通常具有（　）特性", "a": ["全局逼近", "局部逼近", "仅对负输入有响应", "仅对正输入有响应", "", ""], "r": "B", "e": "RBF神经网络的径向基函数具有局部逼近特性，它只在局部范围内对输入产生响应。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149422", "t": 1, "q": "RBF神经网络的输出层通常采用（　）激活函数", "a": ["阶跃函数", "sigmoid函数", "径向基函数", "线性激活函数", "", ""], "r": "D", "e": "RBF神经网络输出层一般用线性激活函数，将隐层输出进行线性组合得到最终输出。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149423", "t": 1, "q": "RBF神经网络的学习过程通常分为（　）两个阶段", "a": ["输入层参数学习和输出层权重学习", "输入层参数学习和隐含层参数学习", "仅输出层权重学习", "隐含层参数（中心、宽度）学习和输出层权重学习", "", ""], "r": "D", "e": "RBF神经网络学习分隐含层参数（中心、宽度）学习和输出层权重学习两阶段。先确定隐含层参数，再调整输出层权重。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149424", "t": 1, "q": "RBF神经网络的中心和宽度参数的确定，通常第一步是（　）", "a": ["随机设定，无需调整", "由被控对象的输入范围直接确定", "通过聚类算法（如K-均值聚类）确定", "通过梯度下降法优化", "", ""], "r": "C", "e": "RBF神经网络中心和宽度参数确定时，常先用聚类算法（如K - 均值聚类）确定中心等初始参数。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803781778149425", "t": 1, "q": "RBF神经网络与BP神经网络相比，主要优势在于（　）", "a": ["需要更多的训练样本", "训练速度更快，不易陷入局部极小值", "只能处理线性问题", "结构更复杂", "", ""], "r": "B", "e": "RBF神经网络采用径向基函数作为激活函数，训练速度快，且不易陷入局部极小值，这是其相对BP神经网络的主要优势。而它不需要更多训练样本，能处理非线性问题，结构也不更复杂。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695040", "t": 2, "q": "神经网络控制中，基于RBF神经网络的模型参考自适应控制，RBF网络可用于（　）", "a": ["在线辨识被控对象的未知非线性环节", "设计自适应律，调整可调系统参数", "作为控制器直接输出控制量，但需要反馈环节", "替代参考模型生成期望输出", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695041", "t": 2, "q": "神经网络控制中，监督式学习的特点包括（　）", "a": ["通过误差信号调整网络权重", "需要教师信号（期望输出）", "可实现精确的函数逼近", "无需输入信号", "", ""], "r": "ABC", "e": "监督式学习需教师信号来明确期望输出，通过误差（期望输出与实际输出的差值）调整网络权重，能实现精确函数逼近，且肯定需要输入信号。D选项错误。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695042", "t": 2, "q": "神经网络控制中，监督式学习的训练样本应满足（　）", "a": ["样本数量足够多，避免过拟合", "样本覆盖系统的主要工作工况", "样本需要经过适当的预处理，以提高模型性能", "样本中输入输出数据对应关系正确", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695043", "t": 2, "q": "神经网络控制中，无选学习的应用场景包括（　）", "a": ["需要精确跟踪期望输出的场合", "系统自适应调整的初始阶段", "数据聚类与特征提取", "被控对象模型未知，无期望输出的场合", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695044", "t": 2, "q": "神经网络控制中，无监督学习神经网络在控制中的应用包括（　）", "a": ["精确跟踪期望输出（需教师信号）", "自适应控制的初始参数整定", "故障诊断（识别异常数据模式）", "系统建模（通过聚类提取对象特征）", "", ""], "r": "CD", "e": "无监督学习神经网络无需教师信号，A选项需教师信号不符合。B选项初始参数整定与无监督学习特性关联不大。无监督学习可通过聚类等方式对数据进行处理，能识别异常数据模式用于故障诊断，也能通过聚类提取对象特征用于系统建模。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695045", "t": 2, "q": "神经网络控制中，自适应神经网络控制的应用场景包括（　）", "a": ["被控对象模型精确已知的系统", "被控对象存在干扰的系统", "被控对象存在非线性的系统", "被控对象参数慢时变的系统", "", ""], "r": "BCD", "e": "自适应神经网络控制适用于对象模型未知、有干扰、非线性、参数时变等复杂情况。A选项对象模型精确已知不需要自适应控制。B、C、D都符合其应用场景。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695046", "t": 2, "q": "神经网络控制中，PID神经网络相比常规PID控制器的优势在于（　）", "a": ["能适应被控对象的非线性和时变特性", "可在线自整定Kp、Ki、Kd参数", "结构更简单，无需任何训练", "对外部干扰的鲁棒性更强", "", ""], "r": "ABD", "e": "神经网络控制中的PID神经网络结合了神经网络的适应性和PID控制的传统优点。我们逐一考虑各个选项：A. PID神经网络由于其学习和自适应能力，能够更好地适应被控对象的非线性和时变特性，这是传统PID控制器难以做到的。B. PID神经网络可以通过在线学习来调整其参数，这相当于可在线自整定Kp、Ki、Kd参数，而传统PID控制器通常需要手动调整或基于经验的设定。C. PID神经网络虽然具有自适应性，但其结构并不比传统PID控制器简单，且需要进行一定的训练。因此，这一选项是不正确的。D. 由于神经网络的自学习和调整能力，PID神经网络对于外部干扰的鲁棒性更强，能够更好地应对环境的变化。综上所述，PID神经网络相比常规PID控制器的优势在于其能适应被控对象的非线性和时变特性（A），可在线自整定参数（B），以及对外部干扰的鲁棒性更强（D）。因此，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695047", "t": 2, "q": "线性定常离散系统的状态转移矩阵Φ(k)具有的性质包括（　）", "a": ["Φ(0)=I（单位矩阵）", "Φ(k1+k2)=Φ(k1)Φ(k2)（k1,k2为非负整数）", "Φ(k)与系统矩阵A的关系为Φ(k)=e^(Ak)（当A为常数矩阵时）", "Φ(-k)=[Φ(k)]^(-1)（逆矩阵）", "", ""], "r": "ABD", "e": "本题可根据线性定常离散系统状态转移矩阵的性质逐一分析选项。### 选项A根据线性定常离散系统状态转移矩阵的定义，当k = 0时，系统状态没有发生转移，即「test/yiwen_img/importSubject/2034803778162659328.png」（单位矩阵），所以选项A正确。### 选项B线性定常离散系统的状态转移矩阵具有「test/yiwen_img/importSubject/2034803778368180224.png」（「test/yiwen_img/importSubject/2034803778468843520.png」为非负整数）的性质，该性质表明状态转移矩阵满足乘法结合律，所以选项B正确。 ### 选项C对于线性定常连续系统，状态转移矩阵「test/yiwen_img/importSubject/2034803778548535296.png」；而对于线性定常离散系统，状态转移矩阵「test/yiwen_img/importSubject/2034803778640809984.png」，并非「test/yiwen_img/importSubject/2034803778737278976.png」，所以选项C错误。### 选项D根据状态转移矩阵的性质，「test/yiwen_img/importSubject/2034803778829553664.png」，即状态转移矩阵的逆矩阵等于其负时间的状态转移矩阵，所以选项D正确。综上，答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695048", "t": 2, "q": "线性定常离散系统的z传递函数转换为状态空间模型时，需考虑的因素包括（　）", "a": ["是否存在零极点抵消", "系统是否为最小相位系统", "系统的采样周期", "期望的状态空间标准型（如能控、能观）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695049", "t": 2, "q": "线性定常系统常用的数学模型包括（　）", "a": ["差分方程（离散系统）", "状态空间模型", "传递函数", "模糊规则库", "", ""], "r": "BC", "e": "线性定常系统常用数学模型有状态空间模型、传递函数等，差分方程用于离散系统，模糊规则库是模糊系统相关，并非线性定常系统常用模型。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695050", "t": 2, "q": "线性定常系统的传递函数具有的性质包括（　）", "a": ["与系统的初始条件无关", "反映系统输入与输出的复频域关系", "适用于线性时不变系统", "可以间接反映系统的能控性和能观性", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695051", "t": 2, "q": "线性定常系统的能观性矩阵Rank[C;CA;CA²;...;CA^(n-1)]=n，表明（　）", "a": ["可设计状态观测器估计全部状态", "系统的任意状态可通过有限时间内的输出测量值重构", "系统的传递函数矩阵不存在零极点抵消（若同时能控）", "无法通过输出判断系统的内部状态", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695052", "t": 2, "q": "线性定常系统的能观性判据包括（　）", "a": ["约旦标准型中，每个约旦块对应的输出矩阵列向量不全为零", "能控性矩阵的秩等于系统的状态维数", "能观性矩阵的秩等于系统的状态维数", "传递函数矩阵不存在零极点抵消", "", ""], "r": "ACD", "e": "线性定常系统能观性判据有能观性矩阵的秩等于系统状态维数；约旦标准型中，每个约旦块对应的输出矩阵列向量不全为零；传递函数矩阵不存在零极点抵消。能控性矩阵秩等于系统状态维数是能控性判据。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695053", "t": 2, "q": "线性定常系统的能控性矩阵Rank[B AB A²B...A^(n-1)B]=n（n为状态维数），表明（　）<br />A.", "a": ["..A^(n-1)B]=n（n为状态维数），表明（　）", "系统的任意初始状态可在有限时间内转移到任意期望状态", "可通过状态反馈控制任意配置闭环系统的极点", "系统的任意初始状态可在有限时间内转移到零状态", "系统的传递函数矩阵存在零极点抵消", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695054", "t": 2, "q": "线性定常系统的状态反馈控制中，状态反馈矩阵K的设计依据包括（　）", "a": ["系统的能控性（需完全能控）", "控制量的约束范围", "系统的能观性（需考虑）", "闭环系统的期望极点位置", "", ""], "r": "ABD", "e": "在线性定常系统的状态反馈控制中，设计状态反馈矩阵K时主要依据以下几点：1. 系统的能控性：为了实现完全控制，系统必须是完全能控的。如果系统不能完全控制，则无法通过状态反馈实现任意轨迹的跟踪。2. 控制量的约束范围：实际系统中，控制量往往有物理限制，因此设计时需要考虑控制量的约束范围，以确保系统在实际操作中的可行性。3. 闭环系统的期望极点位置：状态反馈的一个重要目的是调整系统的动态性能，通过设定闭环系统的期望极点位置来实现这一点。系统的能观性虽然在很多控制问题中很重要，但在状态反馈的设计中并不是直接的依据，因为状态反馈不依赖于测量输出，而是直接使用状态变量。综上所述，正确答案是ABD。所以，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695055", "t": 2, "q": "线性定常系统的状态空间模型（A,B,C,D）中，能控性矩阵的构成包括（　）", "a": ["B", "AB", "A²B", "CA", "", ""], "r": "ABC", "e": "线性定常系统能控性矩阵由「test/yiwen_img/importSubject/2034803778917634048.png」构成，包含A、B、C选项元素。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695056", "t": 2, "q": "线性定常系统的状态空间模型完全能控且完全能观，意味着（　）", "a": ["系统的模型阶数是最低的", "可通过状态观测器重构全部状态", "系统的传递函数矩阵不存在零极点抵消", "可通过状态反馈任意配置闭环系统极点", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695057", "t": 2, "q": "线性定常系统的状态空间模型中，状态向量的选择应遵循的原则包括（　）", "a": ["能完全描述系统的动态特性", "任意选择变量即可", "选择容易测量的物理量", "选择数量最少且能完全描述系统动态特性的变量", "", ""], "r": "AD", "e": "这是一道关于线性定常系统状态空间模型中状态向量选择原则的题目。我们来简化解析一下：首先，状态向量的选择对于线性定常系统的状态空间模型至关重要。它需要满足几个关键原则以确保模型的有效性和实用性。A选项提到“能完全描述系统的动态特性”，这是状态向量的核心要求。状态向量必须能够全面反映系统的状态变化，从而准确描述系统的动态行为。B选项“任意选择变量即可”显然是不正确的。状态向量的选择不是随意的，而是需要遵循一定的原则和标准。C选项“选择容易测量的物理量”虽然在实际应用中很重要，但它并不是状态向量选择的首要或唯一原则。状态向量的选择更侧重于其描述系统动态特性的能力，而非仅仅基于测量的便利性。D选项“选择数量最少且能完全描述系统动态特性的变量”则综合了有效性和简洁性的考虑。它强调在满足描述系统动态特性需求的前提下，尽可能减少状态向量的数量，从而提高模型的效率和实用性。综上所述，A和D选项共同构成了状态向量选择的原则：既要能完全描述系统的动态特性（A），又要选择数量最少且能达到这一目的的变量（D）。所以，正确答案是AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695058", "t": 2, "q": "预测控制的核心环节包括（　）", "a": ["滚动优化", "预测模型", "自适应律", "反馈校正", "", ""], "r": "ABD", "e": "预测控制核心环节有预测模型、滚动优化和反馈校正。预测模型用于描述系统动态，滚动优化在每个采样时刻进行优化计算，反馈校正则利用实际输出与预测输出的偏差修正后续预测。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695059", "t": 2, "q": "预测控制中，常用的预测模型类型包括（　）", "a": ["状态空间模型", "脉冲响应模型", "模糊规则模型", "阶跃响应模型", "", ""], "r": "ABCD", "e": "预测控制中，预测模型的选择对于系统的性能至关重要。不同的模型有不同的适用场景和特点。首先，我们来看各个选项：A. 状态空间模型 - 这是一个通过状态变量来描述系统动态行为的模型，能够提供系统内部状态的详细信息，是预测控制中常用的一种模型。B. 脉冲响应模型 - 它描述了系统对脉冲输入信号的响应，能够反映系统的动态特性，也常被用于预测控制。C. 模糊规则模型 - 基于模糊逻辑的模型，适用于处理不确定性和模糊性较强的系统，同样在预测控制中有其应用价值。D. 阶跃响应模型 - 描述系统对阶跃输入信号的响应，是分析和设计控制系统的一种常用模型，也适用于预测控制。综上所述，这四个选项都是预测控制中常用的预测模型类型。所以，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695060", "t": 2, "q": "预测控制中，动态矩阵控制（DMC）的特点包括（　）", "a": ["采用滚动优化和反馈校正", "适用于线性稳定系统", "可以处理控制量的约束", "基于阶跃响应模型", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695061", "t": 2, "q": "预测控制中，动态矩阵控制（DMC）的优化目标函数通常包含（　）", "a": ["系统输出与设定值的偏差平方和", "参考模型的输出偏差", "控制量的变化量平方和（避免控制量剧烈波动）", "自适应律的更新误差", "", ""], "r": "AC", "e": "DMC优化目标是使系统输出跟踪设定值，同时避免控制量剧烈波动，目标函数包含系统输出与设定值的偏差平方和以及控制量的变化量平方和。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695062", "t": 2, "q": "预测控制中，反馈校正的常用方式包括（　）", "a": ["用偏差调整预测模型的参数（如修正模型系数）", "忽略偏差，仅依赖预测模型", "用实际输出与预测输出的偏差修正未来预测输出", "直接替换预测模型为实际对象模型", "", ""], "r": "AC", "e": "反馈校正需利用偏差来改进预测。A通过偏差调整模型参数，C用偏差修正未来预测输出，这两种方式合理；B忽略偏差不可取；D直接替换模型不是常用反馈校正方式。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695063", "t": 2, "q": "预测控制中，反馈校正的作用包括（　）", "a": ["增强系统的鲁棒性", "替代滚动优化环节", "提高预测输出的精度", "补偿预测模型的误差", "", ""], "r": "ACD", "e": "反馈校正可利用实际输出与预测输出的偏差来调整后续预测，能补偿模型误差、提高预测精度、增强系统鲁棒性，但不能替代滚动优化环节。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695064", "t": 2, "q": "预测控制中，滚动优化的目标函数通常需考虑的因素包括（　）", "a": ["控制量的变化量", "系统输出与设定值的偏差", "未来一段时间内的预测误差", "参考模型的输出", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695065", "t": 2, "q": "预测控制中，控制时域N_u的选择应考虑（　）", "a": ["系统的动态响应速度（响应快可减小N_u）", "预测时域N_p的大小（通常N_u<N_p）", "控制量的约束（避免过多控制量导致超约束）", "计算量的大小（N_u越大，计算量越大）", "", ""], "r": "ABCD", "e": "控制时域N_u选择需综合多方面因素，系统动态响应快可减小N_u；通常应满足N_u<N_p；要考虑控制量约束防止超约束；N_u越大计算量越大。ABCD都对。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695066", "t": 2, "q": "预测控制中，若反馈校正的修正系数选择过小，会导致（　）", "a": ["系统对模型误差的鲁棒性下降", "反馈校正作用微弱，无法有效补偿模型误差", "预测输出与实际输出偏差增大", "系统响应速度加快", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695067", "t": 2, "q": "预测控制中，若预测模型为状态空间模型，其预测输出的计算基于（　）", "a": ["当前状态估计值", "参考模型的输出", "未来控制量序列", "自适应律的更新量", "", ""], "r": "AC", "e": "预测控制是一种基于模型的控制方法，它利用预测模型来预测未来的系统行为。在状态空间模型中，系统的动态行为可以通过状态方程和观测方程来描述。A. 当前状态估计值：状态空间模型需要知道当前的状态估计值来进行预测。这是预测输出计算的基础。B. 参考模型的输出：参考模型的输出是期望的系统行为，但它不是直接用于计算预测输出的。C. 未来控制量序列：预测控制会根据未来的控制量序列来预测系统的未来行为，这也是预测输出计算的一个重要因素。D. 自适应律的更新量：自适应律的更新量用于调整模型的参数，但它不是直接用于计算预测输出的。综上所述，预测输出的计算主要基于当前状态估计值和未来控制量序列。所以，正确答案是AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695068", "t": 2, "q": "预测控制中，预测时域N_p的选择应考虑的因素包括（　）", "a": ["控制量的个数", "模型的精度", "计算量的大小", "系统的动态响应速度", "", ""], "r": "BCD", "e": "预测时域N_p选择需综合考量多方面。模型精度影响预测准确性，计算量大小会限制N_p取值，系统动态响应速度也决定合适的N_p范围。而控制量个数与预测时域N_p选择无直接关联。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695069", "t": 2, "q": "自校正控制（STC）的主要特点包括（　）", "a": ["需要参考模型", "无需预先知道被控对象的精确模型", "在线辨识被控对象模型", "基于辨识模型在线设计控制律", "", ""], "r": "BCD", "e": "自校正控制不依赖被控对象精确模型，能在线辨识对象模型，再基于辨识模型在线设计控制律。参考模型是模型参考自适应控制特点，不是自校正控制主要特点。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695070", "t": 2, "q": "自校正控制中，常用的控制律设计方法包括（　）", "a": ["极点配置控制", "模型参考控制", "模糊控制", "最小方差控制", "", ""], "r": "ABD", "e": "自校正控制常用控制律设计方法有极点配置控制、模型参考控制、最小方差控制等。模糊控制不属于自校正控制常用控制律设计方法。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695071", "t": 2, "q": "自校正控制中，极点配置控制的设计步骤包括（　）", "a": ["构建参考模型", "根据期望极点位置设计控制律", "调整自适应律的增益", "在线辨识被控对象的模型参数", "", ""], "r": "BD", "e": "极点配置控制主要是先在线辨识被控对象模型参数，再根据期望极点位置设计控制律。构建参考模型是模型参考自适应控制内容，调整自适应律增益也不是极点配置控制核心步骤。答案为BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695072", "t": 2, "q": "自校正控制中，极点配置控制律设计需预先确定的参数包括（　）", "a": ["控制量的约束范围", "被控对象的阶数", "参考模型的传递函数", "闭环系统的期望极点位置", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695073", "t": 2, "q": "自校正控制中，若采用极点配置控制，期望极点的选择应考虑（　）", "a": ["系统的稳定性（极点在左半s平面/单位圆内）", "系统的动态响应要求（如阻尼比、无超调）", "系统的稳态精度（如极点包含原点附近极点）", "被控对象的未建模动态（避免极点过靠近虚轴）", "", ""], "r": "ABCD", "e": "期望极点选择要兼顾系统稳定性、动态响应、稳态精度，同时考虑被控对象未建模动态，ABCD选项都是需考虑因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695074", "t": 2, "q": "自校正控制中，若系统存在测量噪声，可采取的措施包括（　）", "a": ["在辨识环节前加入低通滤波器", "减小控制时域", "采用鲁棒性更强的辨识方法", "增大采样周期", "", ""], "r": "AC", "e": "自校正控制是一种通过在线参数估计和调整来实现系统性能优化的方法。当系统存在测量噪声时，需要采取措施来减少噪声对系统性能的影响。以下是对各选项的简要A. 在辨识环节前加入低通滤波器：低通滤波器可以有效去除高频噪声，保留低频信号，从而减少测量噪声对系统辨识的影响。这是一个有效的措施。B. 减小控制时域：减小控制时域可能会增加系统的响应速度，但对测量噪声的处理没有直接帮助，反而可能加剧噪声的影响。C. 采用鲁棒性更强的辨识方法：鲁棒性强的辨识方法能够更好地应对噪声和其他不确定性，从而提高系统的稳定性和性能。这也是一个有效的措施。D. 增大采样周期：增大采样周期可能会降低系统的响应速度，并且在噪声存在的情况下，可能会引入更多的噪声累积，不利于噪声的抑制。综上所述，A和C是有效的措施。所以，正确答案是AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695075", "t": 2, "q": "自校正控制中，若系统存在未建模动态（模型无法完全描述对象），可采取的措施包括（　）", "a": ["忽略未建模动态，维持原控制律", "增大控制量，强行克服未建模动态", "采用鲁棒性更强的辨识方法", "在控制律中引入鲁棒项，抑制未建模动态影响", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695076", "t": 2, "q": "自校正控制中，若系统的采样周期选择不当（如过长），会导致（　）", "a": ["辨识模型无法捕捉系统的快速动态特性", "辨识数据量减少，但精度不会提高", "系统可能出现不稳定", "控制律更新不及时，系统响应滞后", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695077", "t": 2, "q": "自校正控制中，若系统是离散系统，其辨识模型通常采用的形式包括（　）", "a": ["模糊规则模型", "状态空间模型", "z传递函数", "差分方程", "", ""], "r": "BCD", "e": "自校正控制是一种自动调整控制器参数以适应系统变化的控制方法。在离散系统中，辨识模型的选择对于系统的性能至关重要。首先，我们简要介绍题目中的各个选项：* A. 模糊规则模型：这是一种基于模糊逻辑的模型，主要用于处理不确定性和模糊性。它不是离散系统辨识的常用模型。* B. 状态空间模型：状态空间模型是一种描述系统动态行为的数学模型，适用于连续和离散系统。在离散系统中，它通常用于表示系统的状态变化。* C. z传递函数：z传递函数是离散系统的一种数学表示，用于描述系统输入和输出之间的关系。它是离散系统辨识中常用的一种形式。* D. 差分方程：差分方程是描述离散系统动态行为的基本工具，它表示了系统在不同时间步的输入和输出之间的关系。在离散系统辨识中，差分方程也是一种常用的模型形式。对于离散系统的自校正控制，其辨识模型通常采用的形式包括状态空间模型、z传递函数和差分方程。因此，正确答案是BCD。综上所述，自校正控制中，若系统是离散系统，其辨识模型通常采用的形式包括状态空间模型、z传递函数和差分方程。", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695078", "t": 2, "q": "自校正控制中，最小方差控制的实现步骤包括（　）", "a": ["构建参考模型，确定期望输出", "在线辨识被控对象的CARMA模型参数", "根据辨识模型推导最小方差控制律", "实时计算控制量，作用于被控对象", "", ""], "r": "BCD", "e": "最小方差控制需先在线辨识被控对象的CARMA模型参数，再根据辨识模型推导控制律，最后实时计算控制量作用于对象。A选项构建参考模型确定期望输出不是最小方差控制实现步骤。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695079", "t": 2, "q": "自校正控制中，最小方差控制的特点包括（　）", "a": ["对非最小相位系统易导致控制量无界", "以最小化输出与设定值偏差的方差为目标", "适用于最小相位系统", "无需在线辨识被控对象模型", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695080", "t": 2, "q": "BP神经网络的动量项作用包括（　）", "a": ["使权重更新过程更平滑（抑制突变）", "减少网络陷入局部极小值的概率", "加快网络的收敛速度", "增大网络的训练误差", "", ""], "r": "ABC", "e": "动量项能让权重更新更平滑，避免突变，减少陷入局部极小值的可能性，还可加快网络收敛速度，不会增大训练误差。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695081", "t": 2, "q": "BP神经网络的基本结构包括（　）", "a": ["模糊规则层", "隐含层", "输入层", "输出层", "", ""], "r": "BCD", "e": "BP神经网络基本结构包含输入层、隐含层和输出层。模糊规则层不是其基本结构。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695082", "t": 2, "q": "BP神经网络的学习率选择对训练过程的影响包括（　）", "a": ["学习率过大，易导致参数震荡或发散", "学习率与收敛速度无关", "学习率过小，收敛速度慢", "学习率越大，辨识精度越高", "", ""], "r": "AC", "e": "学习率是BP神经网络重要参数，过大易使参数震荡或发散，过小会使收敛速度慢；学习率和收敛速度有关，且不是越大辨识精度越高。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695083", "t": 2, "q": "BP神经网络的训练过程中，可能出现的问题包括（　）", "a": ["无需调整参数即可收敛", "收敛速度慢", "过拟合", "容易陷入局部极小值", "", ""], "r": "BCD", "e": "BP神经网络训练时，通常需调整参数，A错误。其训练中存在收敛慢、易过拟合、易陷入局部极小值等问题。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695084", "t": 2, "q": "BP神经网络的隐含层神经元个数选择需考虑的因素包括（　）", "a": ["训练样本的数量和质量", "输入层和输出层的神经元个数", "网络的泛化能力（避免过拟合或欠拟合）", "被控对象的复杂程度（如线性/非线性、阶数）", "", ""], "r": "ABCD", "e": "隐含层神经元个数受多方面影响，训练样本情况、输入输出层神经元个数、网络泛化能力以及被控对象复杂程度都会对其选择产生作用。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695085", "t": 2, "q": "RBF神经网络的径向基函数应满足的条件包括（　）", "a": ["在原点处取得最大值", "径向对称性", "随着输入与中心距离的增大而单调递减", "必须是高斯函数", "", ""], "r": "ABC", "e": "RBF神经网络的径向基函数需在原点取最大值、有径向对称性且随输入与中心距离增大单调递减，但不必须是高斯函数。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695086", "t": 2, "q": "RBF神经网络的输出层权重学习通常采用的方法包括（　）", "a": ["梯度下降法", "遗传算法", "最小二乘法（因输出层为线性，可直接求解）", "随机赋值法，无需学习", "", ""], "r": "AC", "e": "RBF神经网络输出层是线性的，最小二乘法可直接求解输出层权重，是常用方法。梯度下降法也可用于权重学习。遗传算法可优化权重但不是通常采用的主要方法。随机赋值法无法有效学习权重。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695087", "t": 2, "q": "RBF神经网络的中心选择方法包括（　）", "a": ["随机选择", "无需选择，固定不变", "K-均值聚类算法", "根据被控对象的输入输出数据选择", "", ""], "r": "ACD", "e": "RBF神经网络中心选择方法多样，随机选择可快速确定中心；K - 均值聚类算法能基于数据分布找到合适中心；也可根据被控对象输入输出数据选中心。而中心不是固定不变的。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695088", "t": 2, "q": "RBF神经网络相比BP神经网络的差异包括（　）", "a": ["RBF训练速度更快，易收敛到全局最优", "RBF是局部逼近网络，BP是全局逼近网络", "RBF无需调整参数，BP需大量参数调整", "RBF隐含层神经元激活函数为径向基函数，BP多为sigmoid函数", "", ""], "r": "ABD", "e": "RBF是局部逼近网络，BP是全局逼近网络；RBF隐含层神经元激活函数是径向基函数，BP常用sigmoid函数；RBF训练速度快且易收敛到全局最优。但RBF也需要调整参数。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803783732695089", "t": 2, "q": "RBF神经网络相比BP神经网络的优势有（　）", "a": ["不易陷入局部极小值", "泛化能力更强", "训练速度更快", "结构更复杂", "", ""], "r": "ABC", "e": "RBF神经网络采用局部逼近的方式，训练时不易陷入局部极小值，训练速度相对快，泛化能力也较强；而它结构并不复杂，相比BP更简单。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861696", "t": 3, "q": "线性定常离散系统的z传递函数转换为状态空间模型时，若存在零极点抵消，则转换后的状态空间模型一定是不完全能控且不完全能观的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861697", "t": 3, "q": "线性定常系统的传递函数阶数等于系统的状态维数（最小阶实现），因此传递函数阶数越高，系统的状态维数越大，动态特性越复杂。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于线性定常系统，在最小阶实现下，传递函数阶数等于系统状态维数。一般来说，阶数越高意味着系统包含更多的储能元件等，状态变量增多，动态特性就越复杂。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861698", "t": 3, "q": "线性定常系统的传递函数若存在零极点抵消，则其对应的状态空间模型一定是不完全能控或不完全能观的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统传递函数存在零极点抵消时，意味着系统存在不能控或不能观的模态，所以对应的状态空间模型一定是不完全能控或不完全能观的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861699", "t": 3, "q": "线性定常系统的传递函数转换为状态空间模型时，能控标准型和能观标准型的状态矩阵完全相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统传递函数转换为能控标准型和能观标准型时，状态矩阵互为转置，并非完全相同。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861700", "t": 3, "q": "线性定常系统的能观性是指通过有限时间内的输出测量值，能够唯一确定系统的初始状态，与系统是否能控无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统能观性定义就是通过有限时间内输出测量值唯一确定系统初始状态，且能观性和能控性是系统两个独立性质，相互无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861701", "t": 3, "q": "线性定常系统的能控标准型和能观标准型是系统的最小阶实现，即状态维数等于传递函数的阶数，无冗余状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统的能控标准型和能观标准型是系统的最小阶实现，其状态维数等于传递函数的阶数，不存在冗余状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861702", "t": 3, "q": "线性定常系统的能控性和能观性是系统的内在特性，与系统的输入输出维数无关，仅由系统矩阵A、B、C决定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统的能控性和能观性确实是系统的内在属性，其只取决于系统矩阵 A、B、C，与输入输出维数无关联。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861703", "t": 3, "q": "线性定常系统的状态反馈控制，若系统不完全能控，则无法通过状态反馈改善系统的稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统不完全能控时，不能通过状态反馈任意配置所有极点，但可以对能控子系统进行极点配置来改善系统稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861704", "t": 3, "q": "线性定常系统的状态观测器的极点配置越靠近复平面的原点，状态估计的响应速度越慢，但对测量噪声的抑制能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在状态观测器中，极点位置影响性能。极点越靠近复平面原点，系统响应慢，因远离原点时状态变化率大响应快；且极点靠近原点对测量噪声抑制能力强，噪声多为高频信号，靠近原点低频段能更好过滤。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861705", "t": 3, "q": "线性定常系统的状态观测器设计，仅需系统完全能观，与系统是否能控无关，观测器的极点可任意配置。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861706", "t": 3, "q": "线性定常系统的状态转移矩阵Φ(t)（连续系统）满足Φ(t1+t2)=Φ(t1)Φ(t2)，因此Φ(t)是半群算子，具有指数特性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统状态转移矩阵Φ(t)满足Φ(t1 + t2)=Φ(t1)Φ(t2)，这是半群算子的性质，同时也体现了指数特性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861707", "t": 3, "q": "线性定常系统若完全能控，则一定可以通过状态反馈将闭环系统的极点配置到复平面上的任意期望位置（包括右半s平面）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861708", "t": 3, "q": "预测控制的滚动优化是指在每个采样周期，优化整个控制时域内的控制量并全部实施，以保证系统长期最优。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "滚动优化是在每个采样周期，只实施本时刻的控制量，并非优化整个控制时域内的控制量并全部实施。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861709", "t": 3, "q": "预测控制的预测时域N_p选择越大，预测模型的精度越高，系统控制性能越好，因此N_p应尽可能大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "N_p过大时，计算量会显著增加，导致控制实时性变差，且模型误差也会累积，反而不利于系统控制，并非越大越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861710", "t": 3, "q": "预测控制中，动态矩阵控制（DMC）的动态矩阵是由阶跃响应系数构成的下三角矩阵，其维度等于预测时域N_p。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DMC动态矩阵由系统阶跃响应系数构成下三角矩阵，维度等于预测时域N_p。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861711", "t": 3, "q": "预测控制中，动态矩阵控制（DMC）基于阶跃响应模型，因此仅适用于稳定的线性系统，无法处理不稳定或非线性系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "DMC 虽基于阶跃响应模型，通常用于稳定线性系统，但它也可通过一定策略处理不稳定系统，并且结合非线性处理方法也能应对部分非线性系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861712", "t": 3, "q": "预测控制中，反馈校正的修正系数通常取0到1之间的值，取值越大，反馈校正作用越强，系统对模型误差的鲁棒性越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861713", "t": 3, "q": "预测控制中，反馈校正的修正系数通常通过离线仿真整定，无需在线调整，因此无法适应系统参数的时变。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然反馈校正的修正系数可通过离线仿真整定，但在实际预测控制中，也可根据系统运行情况进行在线调整，能适应系统参数的时变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861714", "t": 3, "q": "在预测控制中，滚动优化的目标函数仅需考虑系统输出与设定值的偏差，无需考虑控制量的变化量，控制量变化对系统性能无影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在预测控制里，滚动优化的目标函数既要考虑系统输出与设定值的偏差，也要考虑控制量的变化量，因为控制量变化会影响系统性能，如可能导致超调、振荡等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861715", "t": 3, "q": "预测控制中，控制时域N_u选择为1时，意味着每个采样周期仅计算一个控制量，系统的灵活性降低，但计算量最小，实时性最好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "控制时域「test/yiwen_img/importSubject/2034803779009908736.png」为1，即每个采样周期算一个控制量，因可调整的控制量少灵活性降低，计算量也相应最小，实时性最佳。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861716", "t": 3, "q": "预测控制中，若采用反馈校正后，系统的控制性能仍不理想，可通过增大预测时域N_p或控制时域N_u，提高优化精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在预测控制里，增大预测时域 「test/yiwen_img/importSubject/2034803779085406208.png」 能获得更多未来信息，增大控制时域 「test/yiwen_img/importSubject/2034803779009908736.png」 可增加控制自由度，二者都有助于提高优化精度，改善控制性能。所以当反馈校正后控制性能不理想时，可通过增大 「test/yiwen_img/importSubject/2034803779085406208.png」 或 「test/yiwen_img/importSubject/2034803779009908736.png」 来改善。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861717", "t": 3, "q": "预测控制中，若采用阶跃响应模型作为预测模型，其预测输出是当前及未来控制量变化引起的阶跃响应的叠加，与过去控制量无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861718", "t": 3, "q": "预测控制中，若预测模型为状态空间模型，则预测输出的计算需基于卡尔曼滤波器估计的系统状态，以减小测量噪声的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在预测控制里，当预测模型是状态空间模型时，利用卡尔曼滤波器估计系统状态来计算预测输出确实能减小测量噪声的影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861719", "t": 3, "q": "预测控制中的反馈校正，是利用被控对象的实际输出与预测输出的偏差，直接修改预测模型的结构，以提高后续预测精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "反馈校正是利用偏差修正预测值而非直接修改预测模型结构。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861720", "t": 3, "q": "自校正控制（STC）通过在线辨识被控对象模型，并基于辨识模型实时调整控制律，因此无需预先知道被控对象的任何信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自校正控制虽能在线辨识模型并调整控制律，但还是需要被控对象的一些先验信息，如模型结构等，并非无需预先知道任何信息。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861721", "t": 3, "q": "自校正控制中，若被控对象的纯滞后时间大于采样周期，最小方差控制的控制量会包含未来的偏差信息，需通过预测实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在自校正控制里，当被控对象纯滞后时间大于采样周期时，最小方差控制的控制量确实会涉及未来偏差信息，需要通过预测来达成。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861722", "t": 3, "q": "自校正控制中，若被控对象是非最小相位系统，采用极点配置控制律时，需避免将闭环极点配置在右半s平面，以保证系统稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "非最小相位系统采用极点配置控制律时，把闭环极点配置在右半 s 平面会使系统不稳定，所以要避免。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861723", "t": 3, "q": "自校正控制中，若控制量存在幅值约束（如执行器最大输出限制），在设计控制律时无需考虑约束，仅需在控制量输出时进行限幅即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在自校正控制中，仅在输出时限幅可能使系统性能变差甚至不稳定，设计控制律时就应考虑控制量约束以优化控制效果。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861724", "t": 3, "q": "自校正控制中，若系统存在纯滞后，最小方差控制需引入滞后补偿项，将滞后环节纳入模型，否则无法实现有效的方差最小化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在自校正控制里，当系统有纯滞后情况时，最小方差控制确实要引入滞后补偿项并把滞后环节纳入模型，不然难以达成有效的方差最小化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861725", "t": 3, "q": "自校正控制中，若系统的测量噪声强度增大，在线辨识的模型精度会下降，此时应增大控制律的增益，以抵消噪声的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "测量噪声强度增大使在线辨识模型精度下降时，增大控制律增益会放大噪声影响，而不是抵消，会让系统性能变差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861726", "t": 3, "q": "自校正控制中，若在线辨识的采样周期过短，会导致辨识数据包含过多高频噪声，降低模型辨识精度，需在辨识前加入低通滤波器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "采样周期过短，数据会包含过多高频噪声，影响模型辨识精度，加低通滤波器可滤除高频噪声提高精度。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861727", "t": 3, "q": "自校正控制中，若在线辨识的模型阶数高于被控对象的真实阶数，会导致辨识参数冗余，计算量增大，但不影响控制律的设计精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在线辨识模型阶数高于真实阶数时，不仅会使辨识参数冗余、计算量增大，还会影响控制律设计精度，因为多余的参数可能引入误差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861728", "t": 3, "q": "自校正控制中，若在线辨识的模型与被控对象的真实模型存在偏差，只要偏差在允许范围内，控制律仍能保证系统稳定运行，体现鲁棒性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "鲁棒性强调系统在模型存在一定偏差等不确定性因素下仍能保持稳定运行。自校正控制里，在允许偏差范围内，控制律可保证系统稳定，这正体现了鲁棒性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861729", "t": 3, "q": "自校正控制中，最小方差控制仅适用于最小相位系统，若用于非最小相位系统，会导致控制量剧烈波动，甚至无界。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最小方差控制要求系统是最小相位的，用于非最小相位系统时会使控制量出现剧烈波动甚至无界。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861730", "t": 3, "q": "自校正控制中的极点配置控制，若期望极点全部位于复平面的原点附近，会导致系统响应速度变慢，但稳态精度提高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861731", "t": 3, "q": "自校正控制中的最小方差控制，其控制量的幅值随系统噪声强度的增大而增大，因此在强噪声环境下可能导致控制量超出执行器约束。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最小方差控制里控制量幅值和噪声强度正相关，强噪声时控制量易超执行器约束。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861732", "t": 3, "q": "自校正控制中的最小方差控制，其目标是使被控对象输出的方差最小，与输出是否跟踪设定值无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861733", "t": 3, "q": "BP神经网络的动量项系数通常选择0到1之间的值，系数越大，动量项对权重更新的影响越强，越能抑制震荡，加快收敛。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "BP神经网络中动量项系数在0到1间，系数大时，动量项影响变强，可抑制震荡、加快收敛。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861734", "t": 3, "q": "BP神经网络的反向传播过程是将输出层的误差从输入层向输出层反向传递，用于调整各层神经元的权重和阈值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BP神经网络反向传播是将输出层误差从输出层向输入层反向传递来调整权重和阈值，而不是从输入层向输出层。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861735", "t": 3, "q": "BP神经网络的学习率选择过大，会导致权重更新过程震荡，甚至发散;学习率选择过小，则会导致收敛速度过慢，但最终能收敛到全局最优解。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "学习率过大易使权重更新震荡、发散；但学习率过小虽收敛慢，不一定能收敛到全局最优解，可能陷入局部最优。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861736", "t": 3, "q": "BP神经网络的训练误差达到预设阈值后，即可停止训练，此时网络的泛化能力一定最优。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "训练误差达预设阈值停止训练时，网络可能出现过拟合或欠拟合情况，泛化能力不一定最优。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861737", "t": 3, "q": "BP神经网络的隐含层神经元个数越多，网络的逼近能力越强，因此隐含层神经元个数应尽可能多，以提高控制精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "隐含层神经元个数并非越多越好，过多会导致网络训练时间长、易过拟合等问题。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861738", "t": 3, "q": "BP神经网络的隐含层数量通常选择1-2层，若选择3层及以上，会导致网络复杂度急剧增加，泛化能力下降，因此不推荐使用深层BP网络。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861739", "t": 3, "q": "RBF神经网络的径向基函数通常选择高斯函数，因其具有光滑性好、局部性强、计算简单等优点，且高斯函数的宽度参数越大，局部性越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "高斯函数宽度参数越大，其影响范围越广，局部性越弱，并非越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861740", "t": 3, "q": "RBF神经网络的输出是隐含层神经元输出的线性组合，因此RBF网络是一种线性逼近器，无法逼近非线性函数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "RBF神经网络虽输出是隐含层神经元输出的线性组合，但隐含层到输出层是线性的，而隐含层神经元本身具有非线性映射能力，所以它能逼近非线性函数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861741", "t": 3, "q": "RBF神经网络的中心和宽度参数通常通过K-均值聚类算法确定，输出层权重则通过最小二乘法求解，因此训练过程分为两个独立阶段。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RBF神经网络训练时，常先用K - 均值聚类算法确定中心和宽度参数，再用最小二乘法求输出层权重，这两个步骤相互独立。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861742", "t": 3, "q": "RBF神经网络的中心数量越多，网络的逼近能力越强，因此中心数量应尽可能多，以覆盖所有可能的输入空间。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然RBF神经网络中心数量增多会增强逼近能力，但过多会导致计算复杂度大幅上升、过拟合等问题，并非要尽可能多来覆盖所有输入空间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861743", "t": 3, "q": "RBF神经网络是全局逼近网络，其隐含层神经元的激活函数对所有输入信号都有较强响应，因此泛化能力强于BP神经网络。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "RBF神经网络是局部逼近网络，不是全局逼近网络，它的隐含层神经元的激活函数只对局部输入信号有较强响应。而BP神经网络是全局逼近网络。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861744", "t": 3, "q": "RBF神经网络相比BP神经网络，训练速度更快，是因为RBF的隐含层与输出层权重训练可分离，且输出层权重可通过最小二乘法直接求解，无需迭代。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RBF 神经网络隐含层与输出层权重训练可分离，输出层权重能用最小二乘法直接求，不用迭代，所以训练速度比 BP 神经网络快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803787880861745", "t": 3, "q": "Smith预估控制的核心是通过构建预估模型补偿被控对象的纯滞后，因此即使预估模型与实际对象存在较大偏差，也能显著改善系统控制性能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "Smith预估控制依赖预估模型补偿纯滞后，若预估模型与实际对象偏差大，补偿效果会变差，无法显著改善系统控制性能。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第8章 顺序控制（1）", "n": "基础练习题【含解析】 / 第8章 顺序控制（1）", "qs": [{"id": "2034803792830140416", "t": 1, "q": "梯形图中，“线圈的串联”的说法正确的有", "a": ["若多个线圈串联，只有第一个线圈能正常工作，后续线圈无法正常通电", "线圈串联在梯形图中不允许，因为线圈相当于负载，串联会导致电压分配不足", "线圈可随意串联，不影响正常工作", "线圈串联会导致PLC输出模块过载，损坏模块", "", ""], "r": "B", "e": "在梯形图里，线圈相当于负载，串联会使电压分配不足，所以不允许线圈串联。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140417", "t": 1, "q": "功能模块图（FBD）设计中，功能块的连接方式遵循的原则是", "a": ["功能块的输出端子可直接与左侧母线连接", "信号只能从功能块的输入端子流入，从输出端子流出，遵循从左到右的流向", "只能通过输入端子接收信号，输出端子发送信号，但信号流向无明确要求", "功能块的输入端子可直接与其他功能块的输入端子连接", "", ""], "r": "B", "e": "功能模块图设计里，信号流向是固定的，从功能块输入端子流入、输出端子流出，且遵循从左到右原则。A选项输出端子不能直接连左侧母线；C选项信号流向有明确从左到右要求；D选项输入端子不能直接连其他输入端子。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140418", "t": 1, "q": "功能模块图中，\"比较器\"功能块的输出是", "a": ["两个输入值的差值", "两个输入值的平均值", "根据比较结果输出\"1\"或\"0\"（如A>B时输出1，否则0）", "两个输入值的和值", "", ""], "r": "C", "e": "比较器主要作用是比较两个输入值大小，通常按比较结果输出“1”或“0”。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140419", "t": 1, "q": "功能模块图中，“乘法器”功能块的应用场景是", "a": ["比较两个温度信号的大小", "计算流量信号与时间信号的乘积（得到累积流量）", "实现两个信号的逻辑或运算", "将开关量信号转换为模拟量信号", "", ""], "r": "B", "e": "乘法器作用是进行乘法运算，计算流量信号与时间信号的乘积符合乘法运算场景。A选项是比较大小，C选项是逻辑或运算，D选项是信号转换，均与乘法无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140420", "t": 1, "q": "功能模块图中，“除法器”功能块的注意事项是", "a": ["输出结果始终为整数", "除数不能为零，否则会导致功能块故障", "仅能对整数进行除法运算", "被除数可以为零", "", ""], "r": "B", "e": "除法运算中除数为零无意义，会导致功能故障，这是除法器的重要注意点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140421", "t": 1, "q": "功能模块图中，\"触发器\"功能块（如RS触发器）的特点是", "a": ["输出状态不仅由当前输入信号决定，还与历史状态有关（具有记忆功能）", "输出状态仅由当前输入信号决定，与历史状态无关", "输出状态始终为\"1\"", "仅能接收一个输入信号", "", ""], "r": "A", "e": "触发器是具有记忆功能的逻辑单元，其输出状态不仅取决于当前输入信号，还和历史状态有关。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140422", "t": 1, "q": "功能模块图中，“定时器”功能块的输入参数不包括", "a": ["触发信号", "计时时间设定值", "复位信号", "被控设备的输出状态", "", ""], "r": "D", "e": "定时器主要用于根据设定时间和触发、复位等信号进行计时操作。触发信号用于启动计时，计时时间设定值确定计时时长，复位信号用于重置定时器。而被控设备的输出状态与定时器本身的计时功能无关，不是其输入参数。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140423", "t": 1, "q": "功能模块图中，\"加法器\"功能块的输出是", "a": ["两个输入值的算术和", "两个输入值的最大值", "两个输入值的逻辑与结果", "两个输入值的最小值", "", ""], "r": "A", "e": "加法器的作用就是对输入的数值进行加法运算，输出结果为两个输入值的算术和。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140424", "t": 1, "q": "功能模块图中，\"取反器\"功能块的输出逻辑是", "a": ["输入为\"1\"时，输出为\"1\";输入为\"0\"时，输出为\"1\"", "输入为\"1\"时，输出为\"1\";输入为\"0\"时，输出为\"0\"", "输入为\"1\"时，输出为\"0\";输入为\"0\"时，输出为\"1\"", "输入为\"1\"时，输出为\"0\";输入为\"0\"时，输出为\"0\"", "", ""], "r": "C", "e": "取反器就是将输入的逻辑状态取反。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140425", "t": 1, "q": "功能模块图中，“与”功能块的输出逻辑是", "a": ["所有输入均为\"1\"时，输出为\"1\";否则为\"0\"", "输出状态始终与第一个输入状态一致", "任一输入为\"1\"时，输出为\"1\";否则为\"0\"", "输入为\"1\"时输出为\"0\"，输入为\"0\"时输出为\"1\"", "", ""], "r": "A", "e": "“与”逻辑的规则就是所有输入都为“1”时，输出才为“1”，只要有一个输入为“0”，输出就是“0”。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140426", "t": 1, "q": "功能模块图中，\"RS触发器\"的\"置1端（S）\"和\"复位端（R）\"同时为\"1\"时，输出状态是", "a": ["输出为\"0\"", "输出保持原状态", "输出状态不确定（需看触发器类型，如SR触发器禁止同时为1）", "输出为\"1\"", "", ""], "r": "C", "e": "RS触发器中，S和R同时为1时，不同触发器情况不同，SR触发器禁止这种输入，所以输出状态不确定。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140427", "t": 1, "q": "关于开关量变送器的功能，下列描述错误的是", "a": ["能将非电物理量（如压力、温度）的阈值变化转换为开关量信号", "可直接实现对被控设备的连续调节控制", "常用于火电厂中设备状态的监测与触发信号生成", "输出信号通常为通/断两种状态", "", ""], "r": "B", "e": "开关量变送器输出是通断两种状态，用于设备状态监测和触发信号生成，能把非电物理量阈值变化转开关量信号，但它无法实现对被控设备连续调节控制，连续调节控制一般由模拟量控制实现。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140428", "t": 1, "q": "火电厂中，“除氧器系统功能组”的顺序控制停止逻辑中，最后执行的动作是", "a": ["关闭除氧器出口阀门", "检测除氧器压力是否降至安全值", "停止除氧器给水泵", "停止除氧器进汽阀门", "", ""], "r": "A", "e": "停止顺序一般是先停进汽、进水等源头，再停泵，最后关闭出口阀门，且要检测压力是否安全。最后执行的动作通常是关闭出口阀门，防止介质倒流等情况。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140429", "t": 1, "q": "火电厂中，\"锅炉燃烧系统功能组\"的顺序控制逻辑中，下列动作顺序正确的是", "a": ["送风机启动→引风机启动→点火→燃料投入", "点火→燃料投入→引风机启动→送风机启动", "引风机启动→送风机启动→点火→燃料投入", "燃料投入→点火→引风机启动→送风机启动", "", ""], "r": "C", "e": "火电厂锅炉燃烧系统需先启动引风机建立负压，再启动送风机送入空气，之后点火，最后投入燃料。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140430", "t": 1, "q": "火电厂中，\"锅炉水位控制系统\"（虽含模拟量，但SCS含联锁）的顺序控制联锁中，当水位低至\"低低水位\"时，应触发的动作是", "a": ["启动备用给水泵", "紧急停炉", "开启放水阀门", "关闭给水阀门", "", ""], "r": "B", "e": "水位低至“低低水位”是很危险的情况，为避免锅炉损坏等严重后果需紧急停炉。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140431", "t": 1, "q": "火电厂中，“凝汽器真空系统”的顺序控制中，当真空度低于“低真空”阈值时，应触发的联锁动作是", "a": ["开启凝汽器放气阀门", "启动真空泵", "停止汽轮机", "关闭凝汽器入口阀门", "", ""], "r": "B", "e": "真空度低于“低真空”阈值时，需要提高真空度，启动真空泵可实现此目的。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140432", "t": 1, "q": "火电厂中，“汽轮机润滑油系统功能组”的顺序控制启动逻辑中，首先执行的动作是", "a": ["启动润滑油泵", "检测润滑油箱油位是否正常", "开启润滑油箱出口阀门", "启动润滑油冷却器", "", ""], "r": "B", "e": "在汽轮机润滑油系统功能组顺序控制启动逻辑里，要先确保系统有足够的油，所以需先检测润滑油箱油位是否正常，若油位不正常后续操作无法正常进行。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140433", "t": 1, "q": "火电厂中，\"送风机系统\"的顺序控制启动前，需检测的\"风门状态\"是", "a": ["送风机入口风门全开，出口风门全关", "送风机入口风门全开，出口风门全开", "送风机入口风门全关，出口风门全开", "送风机入口风门全关，出口风门全关", "", ""], "r": "A", "e": "送风机启动前，入口风门全开可保证有足够空气进入，出口风门全关可避免启动瞬间气流冲击等问题。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140434", "t": 1, "q": "火电厂中，顺序控制系统对\"给水泵\"的控制中，下列不属于运行中监控联锁条件的是", "a": ["给水泵入口阀门关闭状态", "给水泵出口压力低报警", "给水泵轴承振动大报警", "给水泵电机电流高报警", "", ""], "r": "A", "e": "运行中监控联锁条件一般是关注运行状态是否异常。给水泵入口阀门关闭状态应在启动前检查，不是运行中监控联锁重点，而出口压力低、轴承振动大、电机电流高都反映运行时可能出现的问题。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140435", "t": 1, "q": "火电厂中，顺序控制系统控制\"引风机启动\"时，下列不属于启动前联锁条件的是", "a": ["引风机轴承温度正常（无高报警）", "引风机入口挡板处于关闭状态", "引风机出口挡板处于打开状态", "炉膛负压在允许范围内", "", ""], "r": "C", "e": "引风机启动前，出口挡板应关闭，防止启动时气流异常，所以“引风机出口挡板处于打开状态”不属于启动前联锁条件。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140436", "t": 1, "q": "火电厂SCS的\"控制优先级\"从高到低排序正确的是", "a": ["就地手动控制→集控室自动控制→集控室手动控制", "集控室自动控制→集控室手动控制→就地手动控制", "集控室手动控制→就地手动控制→集控室自动控制", "就地手动控制→集控室手动控制→集控室自动控制", "", ""], "r": "D", "e": "就地手动控制是最直接且优先的，能在现场直接干预设备；集控室手动控制其次，可在集控室手动操作；集控室自动控制优先级最低，按预设程序运行。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140437", "t": 1, "q": "火电厂SCS的\"联锁解除\"功能的使用条件是", "a": ["仅在设备故障检修时，为避免联锁误动作解除联锁，且需授权", "任何情况下均可随意解除联锁", "仅在系统正常运行时，为方便操作解除联锁", "仅在机组启停过程中解除联锁", "", ""], "r": "A", "e": "“联锁解除”不能随意进行，正常运行和机组启停时一般不能随意解除，主要是设备故障检修时，为防联锁误动作才解除且需授权。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140438", "t": 1, "q": "火电厂SCS的\"冗余配置\"不包括下列哪项", "a": ["双电源模块", "双I/O模块", "双被控设备（如两台给水泵）", "双CPU模块", "", ""], "r": "C", "e": "冗余配置是为提高系统可靠性，对关键部件进行备份。双电源、双I/O模块、双CPU模块都是常见冗余配置方式。而双被控设备是为满足生产需求或备用等情况，不属于控制系统冗余配置概念。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140439", "t": 1, "q": "火电厂SCS的\"事件记录\"功能不包括下列哪项", "a": ["记录操作员的操作记录（如谁在何时切换手动模式）", "记录控制指令的发送时间和内容（如启动引风机）", "记录设备状态变化的时间和状态（如引风机从停到开）", "记录被控设备的机械磨损程度", "", ""], "r": "D", "e": "“事件记录”主要围绕操作、指令及设备状态变化等事件。而被控设备的机械磨损程度属于设备自身物理状态，并非事件，不在“事件记录”功能范畴。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140440", "t": 1, "q": "火电厂SCS中，“故障自诊断”功能不包括下列哪项", "a": ["检测PLC CPU故障", "检测输入信号的断线故障", "检测I/O模块与CPU的通信故障", "检测被控设备的机械故障（如轴承卡涩）", "", ""], "r": "D", "e": "故障自诊断主要针对控制系统自身部件及通信等故障，被控设备机械故障不属于控制系统故障自诊断范畴。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140441", "t": 1, "q": "火电厂SCS中，“冗余设计”的主要目的是", "a": ["简化系统结构，便于维护", "防止单一设备或部件故障导致整个控制系统失效，提高可靠性", "减少系统成本，降低设备投资", "增加系统控制精度，提高被控量的稳定性", "", ""], "r": "B", "e": "冗余设计是增加额外设备或部件，当主设备故障时备用设备能接替工作，防止单一设备故障使整个控制系统失效，从而提高可靠性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140442", "t": 1, "q": "火电厂SCS中，“手动/自动”切换的原则是", "a": ["自动状态下，可直接切换到手动状态，无需任何条件", "切换过程中，被控设备的状态会突变", "手动状态下，必须满足自动投入条件（如无故障、参数正常）才能切换到自动状态", "手动状态下，无论何种情况均可直接切换到自动状态", "", ""], "r": "C", "e": "在火电厂SCS中，手动切自动需满足条件，如无故障、参数正常等；自动切手动一般可直接进行；切换时应保证被控设备状态平稳无突变。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140443", "t": 1, "q": "火电厂SCS中，“手动控制模式”下，操作员的操作权限是", "a": ["仅能发送启动指令，不能发送停止指令", "能发送控制指令，但需满足联锁条件（如无故障）", "仅能监视设备状态，不能发送控制指令", "能发送控制指令，无需满足任何联锁条件", "", ""], "r": "B", "e": "在火电厂SCS的“手动控制模式”下，操作员可发控制指令，但设备运行要保障安全，所以需满足联锁条件（如无故障）。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140444", "t": 1, "q": "火电厂SCS中，“自动控制模式”下，控制指令的生成依据是", "a": ["预设的控制逻辑（如根据参数阈值、时序）和现场反馈信号", "仅根据历史运行数据生成指令", "操作员手动输入的指令", "随机生成的指令", "", ""], "r": "A", "e": "自动控制模式依靠预设控制逻辑，结合现场反馈信号来生成控制指令，以实现自动调节。B仅靠历史数据无法实时适应现场情况；C手动输入是手动控制；D随机生成指令不能满足控制要求。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140445", "t": 1, "q": "开关量变送器的\"动作值\"与\"复位值\"之间的差值称为", "a": ["回差", "分辨率", "量程", "精度", "", ""], "r": "A", "e": "开关量变送器“动作值”和“复位值”差值就是回差。分辨率是能分辨的最小变化量；量程是测量范围；精度是测量结果与真实值接近程度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140446", "t": 1, "q": "开关量变送器的\"额定电压\"是指", "a": ["变送器输入信号的最大电压", "变送器输出信号的电压", "变送器正常工作时，其电源的规定电压", "变送器能承受的最大破坏电压", "", ""], "r": "C", "e": "额定电压一般指设备正常工作时电源的规定电压，开关量变送器也如此。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140447", "t": 1, "q": "开关量变送器的\"返回误差\"是指", "a": ["变送器多次测量同一值的误差", "变送器输出信号与标准信号之间的误差", "变送器动作值与复位值之间的差值", "变送器在相同测量条件下，正行程（被测量增加）与反行程（被测量减少）的误差", "", ""], "r": "C", "e": "返回误差就是指开关量变送器动作值与复位值之间的差值。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140448", "t": 1, "q": "开关量变送器的\"防护等级\"（如IP65）中，第一位数字的含义是", "a": ["防高温的等级", "防液体侵入的等级", "防固体异物侵入的等级", "防冲击的等级", "", ""], "r": "C", "e": "IP防护等级中，第一位数字代表防固体异物侵入的等级。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140449", "t": 1, "q": "开关量变送器的\"工作温度范围\"是指", "a": ["被控设备的工作温度范围", "变送器能测量的被测量的温度范围", "变送器输出信号能承受的温度范围", "变送器自身正常工作的环境温度范围", "", ""], "r": "D", "e": "工作温度范围一般指设备自身正常工作所适应的环境温度范围，开关量变送器的“工作温度范围”就是其自身正常工作的环境温度范围。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140450", "t": 1, "q": "开关量变送器的\"精度等级\"是指", "a": ["变送器的防护能力", "变送器输出信号的通断状态的准确性", "变送器响应时间的快慢", "变送器测量值与真实值之间的最大允许误差占量程的百分比", "", ""], "r": "D", "e": "精度等级是衡量测量仪器准确性的指标，指测量值与真实值间最大允许误差占量程百分比。选项D符合此定义。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140451", "t": 1, "q": "开关量变送器的\"输出方式\"不包括下列哪种", "a": ["直流电流输出（如4-20mA DC，开关量通常为20mA/0mA）", "交流电流输出（如5A AC）", "直流电压输出（如24V DC，通为24V，断为0V）", "干接点输出（无电源，仅提供触点通断）", "", ""], "r": "B", "e": "开关量变送器一般不用交流电流方式输出，交流电流输出多适用于模拟量相关场景。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140452", "t": 1, "q": "开关量变送器的\"响应时间\"是指", "a": ["变送器从检测到被测量达到动作值到输出信号变化的时间", "变送器从通电到正常工作的时间", "变送器从输出信号变化到恢复初始状态的时间", "变送器输出信号的持续时间", "", ""], "r": "A", "e": "开关量变送器响应时间就是从检测到被测量达到动作值到输出信号变化的时长。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140453", "t": 1, "q": "开关量继电器控制回路中，“联锁保护”功能的实现主要依赖", "a": ["通过改变继电器的线圈电压等级实现", "仅依赖单一继电器的动作，无需触点组合", "继电器线圈的通断直接控制被控设备", "通过继电器触点的串并联组合，实现逻辑判断（如与、或、非）", "", ""], "r": "D", "e": "联锁保护功能需进行逻辑判断，是通过继电器触点串并联组合来实现与、或、非等逻辑关系达成的。A选项改变线圈电压等级与联锁保护逻辑判断无关；B选项单一继电器动作无法实现复杂的联锁保护逻辑；C选项未体现出联锁保护的逻辑判断功能。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140454", "t": 1, "q": "开关量继电器控制回路中，“自锁”功能的实现是通过", "a": ["将继电器的线圈与停止按钮串联", "将继电器的常闭辅助触点与启动按钮串联", "将继电器的常开辅助触点与启动按钮并联", "将多个继电器的线圈并联", "", ""], "r": "C", "e": "在开关量继电器控制回路里，“自锁”是靠把继电器常开辅助触点和启动按钮并联达成的，按下启动按钮，继电器吸合，常开辅助触点闭合，即使启动按钮松开，电路仍能保持接通。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140455", "t": 1, "q": "开关量控制回路中，“互锁”功能的作用是", "a": ["减少控制回路的电线用量", "提高设备动作速度", "保持设备动作状态，避免误断开", "防止两个相互排斥的设备同时动作（如电机正反转接触器不能同时吸合）", "", ""], "r": "D", "e": "互锁主要是为了避免相互排斥的设备同时动作，防止出现危险或故障，如电机正反转接触器同时吸合会造成短路等问题。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140456", "t": 1, "q": "开关量控制中，\"保持\"逻辑的实现方式不包括", "a": ["利用继电器的自锁触点", "利用顺序功能图的步状态", "利用PLC的寄存器（如中间继电器M）存储状态", "利用PLC的定时器", "", ""], "r": "D", "e": "“保持”逻辑是要维持状态，A选项继电器自锁触点可维持状态，B选项顺序功能图步状态能保持，C选项PLC寄存器可存储并维持状态。而PLC定时器主要用于定时，并非实现“保持”逻辑。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140457", "t": 1, "q": "开关量控制中，\"禁止\"逻辑的作用是", "a": ["提高控制指令的执行速度", "简化控制逻辑", "在禁止条件满足时，强制执行控制指令", "在禁止条件满足时，阻止控制指令的执行（如设备检修时禁止启动）", "", ""], "r": "D", "e": "“禁止”逻辑主要就是在禁止条件达成时，不让控制指令执行，像设备检修时禁止启动就是典型例子。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140458", "t": 1, "q": "开关量控制中，\"联锁触发\"的优先级高于\"手动控制\"的原因是", "a": ["联锁触发的逻辑更简单", "联锁触发是为了设备安全（如故障保护），需优先于手动操作", "联锁触发更及时，手动控制有延迟", "联锁触发的控制精度更高", "", ""], "r": "B", "e": "联锁触发通常是为保障设备安全，在出现故障等情况时及时动作，所以优先级要高于手动控制。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140459", "t": 1, "q": "开关量控制中，\"脉冲信号\"控制的特点是", "a": ["输出信号持续为\"0\"，设备不动作", "输出信号为短暂的\"1\"脉冲，使设备执行单次动作（如单次启动）", "输出信号随时间周期性变化，频率固定", "输出信号持续为\"1\"，使设备持续动作", "", ""], "r": "B", "e": "脉冲信号是短暂的信号，在开关量控制里，短暂的“1”脉冲能让设备执行单次动作。A说持续为“0”不涉及脉冲特点；C中周期性变化、频率固定不是脉冲信号控制的典型特点；D持续为“1”也不符合脉冲短暂的特性。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140460", "t": 1, "q": "开关量控制中，“三取二”逻辑的作用是", "a": ["简化控制逻辑，便于编程", "提高控制精度，确保被控量稳定", "提高可靠性，避免单一信号故障导致误动作（三个信号中两个一致时才触发）", "减少信号数量，降低成本", "", ""], "r": "C", "e": "“三取二”逻辑是指三个信号中两个一致时才触发，这样能避免单一信号故障导致误动作，提高系统可靠性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140461", "t": 1, "q": "开关量控制中，\"延时闭合\"触点的动作逻辑是", "a": ["触发信号为\"1\"时，触点延迟闭合;触发信号为\"0\"时，延迟断开", "触发信号为\"1\"时，延迟一段时间后触点闭合;触发信号为\"0\"时，触点立即断开", "触发信号为\"1\"时，触点立即闭合;触发信号为\"0\"时，延迟断开", "触发信号为\"1\"时，触点立即闭合;触发信号为\"0\"时，立即断开", "", ""], "r": "B", "e": "“延时闭合”就是触发信号为“1”时，不会马上闭合，而是延迟一段时间后触点闭合；触发信号变回“0”时，触点无需延迟，立即断开。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140462", "t": 1, "q": "开关量控制中，\"延时断开\"触点的动作逻辑是", "a": ["触发信号为\"1\"时，延迟断开;触发信号为\"0\"时，立即闭合", "触发信号为\"1\"时，立即断开;触发信号为\"0\"时，延迟闭合", "触发信号为\"1\"时，触点立即闭合;触发信号为\"0\"时，延迟一段时间后断开", "触发信号为\"1\"时，延迟闭合;触发信号为\"0\"时，立即断开", "", ""], "r": "C", "e": "“延时断开”意味着触发信号使触点闭合后，当触发信号消失，触点不会马上断开而是延迟断开。即触发信号为“1”时，触点立即闭合；触发信号为“0”时，延迟一段时间后断开。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140463", "t": 1, "q": "顺序功能图（SFC）中，\"步\"的状态变化触发条件是", "a": ["需同时满足前一步为\"活动\"状态且对应的\"转换\"条件成立", "无需任何条件，按固定时间顺序切换", "仅需满足对应的\"转换\"条件", "仅需满足前一步的\"活动\"状态", "", ""], "r": "A", "e": "顺序功能图里，步的状态发生变化，要前一步处于“活动”状态，且对应的“转换”条件成立才行。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803792830140464", "t": 1, "q": "顺序功能图应用于火电厂\"凝结水系统\"时，下列属于\"转换条件\"的是", "a": ["凝结水泵启动步", "凝结水水位达到设定值（高水位）", "凝结水阀门关闭动作", "凝结水系统运行步", "", ""], "r": "B", "e": "转换条件是使系统从一个步进入另一个步的条件。凝结水水位达到设定值（高水位）可作为系统状态转换的依据。而启动步、运行步是顺序功能图中的步，阀门关闭动作是执行动作，都不是转换条件。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308928", "t": 2, "q": "功能模块图（FBD）设计的特点包括", "a": ["可直接将功能块的输出端子连接到左侧母线", "功能块的输入端子接收信号，输出端子发送信号，端子不可随意连接", "信号流向明确，通常从左到右、从上到下", "以功能块为基本单元，每个功能块实现特定运算或逻辑（如与、或、定时器）", "", ""], "r": "BCD", "e": "功能模块图（FBD）以功能块为基本单元，各功能块实现特定运算或逻辑；信号流向明确，一般从左到右、从上到下；功能块输入接收信号、输出发送信号，端子连接有规则；且功能块输出不能直接连到左侧母线。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308929", "t": 2, "q": "功能模块图中，\"比较器\"功能块的常用比较类型有", "a": ["等于（A=B）", "小于（A<B）", "不等于（A≠B）", "大于（A>B）", "", ""], "r": "ABCD", "e": "比较器功能块常见的比较类型包含等于、小于、不等于、大于等情况。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308930", "t": 2, "q": "功能模块图中，\"程序的可读性\"设计措施包括", "a": ["功能块随意排列，无需规律", "对功能块的输入/输出端子标注信号名称（如\"AI0.0-炉膛温度\"）", "为功能块添加注释，说明功能块的作用（如\"引风机启动定时器\"）", "按控制流程排列功能块，信号流向清晰（从左到右、从上到下）", "", ""], "r": "BCD", "e": "提高程序可读性需有规律、清晰标注与说明。A选项功能块随意排列不利于阅读；B标注信号名称、C添加注释、D按流程排列都可增强可读性。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308931", "t": 2, "q": "功能模块图中，\"触发器\"功能块的类型包括", "a": ["T触发器:可以实现翻转功能，即在每个时钟脉冲到来时改变一次状态。", "JK触发器:可实现置1、复位、翻转、保持四种功能。", "RS触发器:通过置1（S）和复位（R）信号控制输出状态，但不允许同时激活。", "D触发器:输出状态跟随输入（D）信号，在时钟脉冲触发时更新。", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308932", "t": 2, "q": "功能模块图中，\"定时器\"功能块的输入参数包括", "a": ["时间设定值（PT）: 设定定时器的目标计时时间", "触发信号（IN）: 触发定时器开始计时", "复位信号（R）: 清除计时值，使定时器复位", "输出状态（Q）: 表示定时器是否计时完成", "", ""], "r": "ABC", "e": "输入参数是用于控制功能块运行的信号，A是设定时间，B是触发计时，C是复位操作，都属于输入参数；而D输出状态是功能块运行后给出的结果，不是输入参数。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308933", "t": 2, "q": "功能模块图中，\"定时器\"与\"计数器\"的区别在于", "a": ["定时器的输入是时间信号，计数器的输入是脉冲信号", "定时器和计数器功能相同，仅名称不同", "定时器按时间计时，计数器按事件计数（如脉冲次数）", "定时器的输出由时间决定，计数器的输出由计数次数决定", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308934", "t": 2, "q": "功能模块图中，\"功能块的连接错误\"包括", "a": ["端子连接错误:如功能块的输入接另一功能块的输入", "信号流向错误:如功能块的输出接另一功能块的输出", "未连接必要端子:如定时器的复位端子未接，无法复位", "逻辑关系错误:如使用了不正确的逻辑门导致控制逻辑失效", "", ""], "r": "ABC", "e": "功能块的连接错误主要指连接方式、信号流向等物理连接方面的问题。A选项输入接输入、B选项输出接输出属于连接错误；C选项未连必要端子也是连接问题。D选项逻辑关系错误是逻辑设计层面，并非连接错误。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308935", "t": 2, "q": "功能模块图中，“逻辑运算功能块”包括", "a": ["加法器（ADD）:输入为1时输出为2", "非门（NOT）:输入为1时输出为0，输入为0时输出为1", "或门（OR）:任一输入为1时，输出为1", "与门（AND）:所有输入为1时，输出为1", "", ""], "r": "BCD", "e": "逻辑运算主要有非、或、与等基本运算。选项A的加法器是算术运算，不是逻辑运算。B是非运算，C是或运算，D是与运算，都属于逻辑运算。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308936", "t": 2, "q": "功能模块图中，“模拟量处理功能块”包括", "a": ["开关量转换块（DI）:将模拟量转换为开关量", "模拟量输出块（AO）:将数字量转换为现场模拟量信号", "模拟量缩放块（SCALE）:将模拟量信号按比例缩放（如4-20mA转为0-100℃）", "模拟量输入块（AI）:将现场模拟量信号转换为数字量", "", ""], "r": "BCD", "e": "功能模块图中的“模拟量处理功能块”主要涉及模拟量的输入、输出和处理。我们逐一分析选项：A. 开关量转换块（DI）：这个选项描述的是将模拟量转换为开关量，但实际上DI块是将数字量转换为开关量，与模拟量处理功能块不符。B. 模拟量输出块（AO）：此选项描述的是将数字量转换为现场模拟量信号，这确实是模拟量处理的一部分。C. 模拟量缩放块（SCALE）：此选项描述的是将模拟量信号按比例缩放，这也是模拟量处理功能块中的一个重要功能。D. 模拟量输入块（AI）：此选项描述的是将现场模拟量信号转换为数字量，这同样是模拟量处理功能块的一部分。综上所述，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308937", "t": 2, "q": "功能模块图中，\"算术运算功能块\"包括", "a": ["减法器（SUB）:计算两个输入值的差", "乘法器（MUL）:计算两个输入值的积", "加法器（ADD）:计算两个输入值的和", "比较器（CMP）:比较两个输入值的大小", "", ""], "r": "ABC", "e": "算术运算通常指加、减、乘、除等基本运算，比较器进行的是大小比较，不属于算术运算。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308938", "t": 2, "q": "关于PLC子程序的说法，正确的有", "a": ["子程序可嵌套调用（即一个子程序调用另一个子程序）", "子程序需通过调用指令（如CALL）触发执行，不调用时不执行", "同一子程序在同一程序循环中只能被调用一次", "子程序执行完毕后，程序流程返回至主程序的调用点继续执行", "", ""], "r": "ABD", "e": "PLC子程序可嵌套调用，需用调用指令触发，执行完返回主程序调用点，同一子程序在同一程序循环可多次调用。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308939", "t": 2, "q": "火电厂\"除氧器系统功能组\"的顺序控制停止流程包括", "a": ["停止除氧器进汽，降低除氧器压力", "检测除氧器水位是否降至安全值，再关闭排气阀", "关闭除氧器出口阀门，防止回水", "停止除氧器给水泵，切断给水", "", ""], "r": "ABCD", "e": "火电厂除氧器系统功能组停止时，先停止进汽降压，再检测水位关排气阀，接着关出口阀防回水，最后停给水泵切断给水。这是符合系统停止逻辑顺序的。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308940", "t": 2, "q": "火电厂\"给水泵系统功能
