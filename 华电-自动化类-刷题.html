<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>华电-自动化类-刷题</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>

<script>
const DATA = {"id": "yw2033827305717108736", "name": "华电-自动化类", "chapters": [{"k": "基础练习题【含解析】||第1章 自动控制理论（1）", "n": "基础练习题【含解析】 / 第1章 自动控制理论（1）", "qs": [{"id": "2034803627662643200", "t": 1, "q": "离散系统中，若系统的闭环极点位于z平面的负实轴上，且模<1，对应的暂态响应项为", "a": ["衰减序列", "发散序列", "振荡序列", "等幅序列", "", ""], "r": "A", "e": "当离散系统闭环极点位于z平面负实轴且模小于1时，其暂态响应是正负交替且幅值逐渐减小的，表现为衰减振荡，属于衰减序列。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643201", "t": 1, "q": "描述函数法中，下列非线性特性的描述函数为实数的有", "a": ["理想继电特性（无死区）", "死区特性", "饱和特性", "间隙特性", "", ""], "r": "A", "e": "这是一道关于非线性特性描述函数性质的问题。在描述函数法中，不同非线性特性的描述函数具有不同的性质，包括是否为实数。我们逐一分析这些特性：A. 理想继电特性（无死区）：这种特性在描述函数中通常表示为一个确定的实数值，因为它具有明确的开关行为，没有模糊区域。因此，其描述函数为实数。B. 死区特性：死区特性指的是输入信号在一定范围内变化时，输出保持不变的情况。这种特性在描述函数中可能涉及复数形式，因为它反映了系统对输入信号的非线性响应，包括相位和幅值的变化。所以，其描述函数不一定为实数。C. 饱和特性：饱和特性是指系统输出达到一定上限后不再随输入增加而增加的情况。在描述函数中，饱和特性通常导致非线性的实数响应，因为它直接关联到输出的实数值限制。然而，其描述函数的实数性可能受具体饱和方式和系统状态的影响，不一定总是实数。D. 间隙特性：间隙特性类似于死区特性，但表现为输出在特定输入范围外的跳跃。这种跳跃行为在描述函数中可能导致复数形式，特别是当考虑系统的相位响应时。因此，其描述函数也不一定为实数。综上所述，只有理想继电特性（无死区）的描述函数明确为实数。其他特性在不同情况下可能涉及复数形式。所以，正确答案是A：“理想继电特性（无死区）”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643202", "t": 1, "q": "超前校正装置的对数幅频特性在最大相移角对应的频率ωm处的幅值为", "a": ["10lgα", "20lgα", "10lg√α", "20lg√α", "", ""], "r": "B", "e": "超前校正装置的对数幅频特性在最大相移角对应的频率ωm处的幅值计算公式为20lgα。对数幅频特性的单位是dB（分贝），而分贝的计算通常涉及到20倍的对数运算。在超前校正装置中，当考虑最大相移角对应的频率时，其幅值变化与α（一个与校正装置相关的系数）的20倍对数成正比。简单地说，分贝是用于描述声音或信号强度的对数单位，而在电路和控制系统分析中，也常用分贝来表示幅频特性的变化。在这种情况下，20lgα正确地表示了超前校正装置在最大相移角对应的频率处的幅值。所以，正确答案是B选项：“20lgα”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643203", "t": 1, "q": "超前校正装置的最大相移角φm与装置参数α（α=T1/T2>1）的关系是", "a": ["φm=arctan(α)", "φm=arctan(√α)", "φm=arcsin((α-1)/(α+1))", "φm=arccos((α-1)/(α+1))", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643204", "t": 1, "q": "单位负反馈系统的开环传递函数为G（　）=10/(s(0.2s+1))，其闭环系统的阻尼比ζ约为", "a": ["0.5", "0.32", "0.8", "0.16", "", ""], "r": "B", "e": "本题可先根据单位负反馈系统的开环传递函数求出闭环传递函数，再根据闭环传递函数的标准形式确定阻尼比。### 步骤一：求闭环传递函数对于单位负反馈系统，其闭环传递函数「test/yiwen_img/importSubject/2034803616174444544.png」，已知开环传递函数「test/yiwen_img/importSubject/2034803616476434432.png」，将其代入闭环传递函数公式可得：「test/yiwen_img/importSubject/2034803616585486336.png」将其化为标准二阶系统闭环传递函数形式「test/yiwen_img/importSubject/2034803616686149632.png」，给「test/yiwen_img/importSubject/2034803616791007232.png」分子分母同时除以0.2，得到「test/yiwen_img/importSubject/2034803616895864832.png」。### 步骤二：确定阻尼比「test/yiwen_img/importSubject/2034803616979750912.png」对比标准二阶系统闭环传递函数「test/yiwen_img/importSubject/2034803616686149632.png」与「test/yiwen_img/importSubject/2034803616895864832.png」，可得「test/yiwen_img/importSubject/2034803617122357248.png」，「test/yiwen_img/importSubject/2034803617239797760.png」。由「test/yiwen_img/importSubject/2034803617122357248.png」，可得「test/yiwen_img/importSubject/2034803617327878144.png」，将「test/yiwen_img/importSubject/2034803617327878144.png」代入「test/yiwen_img/importSubject/2034803617239797760.png」，可得「test/yiwen_img/importSubject/2034803617415958528.png」，则「test/yiwen_img/importSubject/2034803617516621824.png」，最接近0.32。综上，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643205", "t": 1, "q": "对于离散系统，若系统的开环传递函数G(z)在z=1处有两个极点，则该系统对单位斜坡输入的稳态误差ess为", "a": ["无穷大", "常数", "0", "与开环增益有关", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643206", "t": 1, "q": "二阶系统的超调量σ%与阻尼比ζ的关系是", "a": ["ζ与σ%无关", "ζ增大，σ%先增大后减小", "ζ增大，σ%减小", "ζ增大，σ%增大", "", ""], "r": "C", "e": "二阶系统中，超调量σ%只与阻尼比ζ有关，且ζ增大时，超调量σ%会减小。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643207", "t": 1, "q": "二阶系统的单位脉冲响应g(t)的表达式为", "a": ["g(t)=ωn²e^(-ζωn t)sin(ωd t+φ)", "g(t)=ωn/√(1-ζ²)e^(-ζωn t)cos(ωd t)", "g(t)=ωn²e^(-ζωn t)cos(ωd t)", "g(t)=ωn/√(1-ζ²)e^(-ζωn t)sin(ωd t)", "", ""], "r": "D", "e": "二阶系统单位脉冲响应公式为「test/yiwen_img/importSubject/2034803617604702208.png」，其中「test/yiwen_img/importSubject/2034803617759891456.png」 。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643208", "t": 1, "q": "二阶系统的调节时间ts与阻尼比ζ、无阻尼自然频率ωn的关系是（±5%误差）", "a": ["ts≈3/(ζωn)", "ts≈2π/(ζωn)", "ts≈4/(ζωn)", "ts≈π/(ζωn)", "", ""], "r": "A", "e": "二阶系统在±5%误差带时调节时间经验公式为ts≈3/(ζωn) 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643209", "t": 1, "q": "二阶系统的无阻尼自然频率ωn增大，系统的单位阶跃响应", "a": ["振荡性增强", "振荡性减弱", "快速性变好", "快速性变差", "", ""], "r": "C", "e": "二阶系统无阻尼自然频率ωn增大，系统响应速度加快，快速性变好；而振荡性由阻尼比决定。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643210", "t": 1, "q": "二阶系统的谐振频率ωr与无阻尼自然频率ωn、阻尼比ζ的关系是", "a": ["ωr=ωn", "ωr=ωn√(1-2ζ²)", "ωr=ωn/(√(1-2ζ²))", "ωr=ωn√(1-ζ²)", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643211", "t": 1, "q": "二阶系统的阻尼比ζ=0.707，该系统的单位阶跃响应", "a": ["超调量约为4.3%", "超调量约为16.3%", "无超调", "等幅振荡", "", ""], "r": "A", "e": "二阶系统中，当阻尼比ζ = 0.707时，属于欠阻尼情况。超调量公式为σ% = e^(-ζπ/√(1 - ζ²))×100% ，将ζ = 0.707代入可得超调量约为4.3%。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643212", "t": 1, "q": "离散系统的闭环传递函数Φ(z)=(z+0.5)/(z²-1.2z+0.6)，该系统的稳定性为", "a": ["无法判断", "临界稳定", "不稳定", "稳定", "", ""], "r": "D", "e": "根据离散系统稳定性判据，需判断闭环特征方程z² - 1.2z + 0.6 = 0的根是否都在单位圆内。求根公式可得根为「test/yiwen_img/importSubject/2034803617843777536.png」，其根的模都小于1，所以系统稳定。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643213", "t": 1, "q": "离散系统的闭环极点为z1=0.8，z2=-0.9，z3=1.1，该系统的稳定性为", "a": ["临界稳定", "不稳定", "无法判断", "稳定", "", ""], "r": "B", "e": "离散系统稳定的条件是闭环极点都在单位圆内，本题中z3 = 1.1在单位圆外，所以系统不稳定。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643214", "t": 1, "q": "离散系统的采样周期T=0.1s，系统的闭环极点z=e^(-0.5)，该极点对应的暂态响应项为", "a": ["e^(-5n)", "e^(-0.5n)", "e^(-0.5nT)", "e^(-5nT)", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643215", "t": 1, "q": "离散系统的采样周期T=0.2s，连续系统传递函数G（　）=1/(s+5)，则其z变换G(z)为", "a": ["z/(z-e^(-1))", "z/(z-e^(-0.2))", "z/(z-e^(-5))", "z/(z-e^(-10))", "", ""], "r": "A", "e": "本题可根据连续系统传递函数求其脉冲响应，再对脉冲响应进行z变换得到离散系统的z传递函数。 步骤一：求连续系统传递函数G(s)的拉普拉斯反变换g(t)。已知连续系统传递函数「test/yiwen_img/importSubject/2034803617965412352.png」，根据拉普拉斯变换表可知「test/yiwen_img/importSubject/2034803618053492736.png」，所以G(s)的拉普拉斯反变换「test/yiwen_img/importSubject/2034803618141573120.png」。 步骤二：对g(t)进行采样，得到g(kT)。已知采样周期T = 0.2s，将t = kT=0.2k代入g(t)中，可得「test/yiwen_img/importSubject/2034803618238042112.png」。 步骤三：求g(kT)的z变换G(z)。根据z变换定义「test/yiwen_img/importSubject/2034803618372259840.png」，将「test/yiwen_img/importSubject/2034803618493894656.png」代入可得：「test/yiwen_img/importSubject/2034803618594557952.png」这是一个首项为1，公比为「test/yiwen_img/importSubject/2034803618737164288.png」的等比数列求和，根据等比数列求和公式「test/yiwen_img/importSubject/2034803618804273152.png」（其中「test/yiwen_img/importSubject/2034803618904936448.png」为首项，q为公比，「test/yiwen_img/importSubject/2034803618976239616.png」）可得：「test/yiwen_img/importSubject/2034803619051737088.png」综上，答案是A选项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643216", "t": 1, "q": "离散系统的开环传递函数G(z)=(0.6)/(z-1)(z-0.8)，该系统对单位斜坡输入的稳态误差ess为", "a": ["无穷大", "0.4", "0", "0.8", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643217", "t": 1, "q": "离散系统的开环传递函数G(z)=(0.8z)/[(z-1)(z-0.5)]，该系统的型别是", "a": ["II型", "I型", "III型", "0型", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643218", "t": 1, "q": "离散系统的z变换中，单位阶跃序列r(n)=1(n)（n≥0）的z变换R(z)为", "a": ["z/(z-1)", "1/(z+1)", "1/(z-1)", "z/(z+1)", "", ""], "r": "A", "e": "根据z变换定义求单位阶跃序列r(n)=1(n)（n≥0）的z变换，「test/yiwen_img/importSubject/2034803619139817472.png」，这是首项为1，公比为「test/yiwen_img/importSubject/2034803619274035200.png」的等比级数，根据等比级数求和公式「test/yiwen_img/importSubject/2034803618804273152.png」（|q|<1），这里「test/yiwen_img/importSubject/2034803619345338368.png」，「test/yiwen_img/importSubject/2034803619412447232.png」，可得「test/yiwen_img/importSubject/2034803619517304832.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643219", "t": 1, "q": "离散系统中，采样定理（香农定理）要求采样频率fs与信号最高频率fm的关系是", "a": ["fs≥fm", "fs≥3fm", "fs≥2fm", "fs≥4fm", "", ""], "r": "C", "e": "香农采样定理规定，为了能从采样信号中无失真地恢复原信号，采样频率fs必须大于等于信号最高频率fm的2倍。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643220", "t": 1, "q": "离散系统中，若采样周期T=0.1s，连续信号f(t)=e^(-10t)，则其采样信号f*(t)的z变换F(z)为", "a": ["z/(z-e^(-0.01))", "z/(z-e^(-1))", "z/(z-e^(-0.1))", "z/(z-e^(-10))", "", ""], "r": "B", "e": "连续信号 f(t) = e^(-10t) 的采样信号为 f*(t) = e^(-10nT)，其中 T = 0.1s。代入得：f*(nT) = e^(-10 × 0.1n) = e^(-n) = (e^(-1))^n<br />对离散序列 (e^(-1))^n 求 z 变换，利用公式 Z[a^n] = z/(z-a)，其中 a = e^(-1)，得到：F(z) = z/(z - e^(-1))<br />因此，正确答案为 B。", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643221", "t": 1, "q": "离散系统中，若采样周期T减小，系统的动态响应速度通常会", "a": ["变慢", "变快", "保持不变", "与T无关", "", ""], "r": "B", "e": "采样周期T减小，意味着系统获取信息的频率增加，能更及时地对系统状态进行调整，所以系统动态响应速度通常会变快。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643222", "t": 1, "q": "离散系统中，若采样周期T增大，系统的稳定性通常会", "a": ["与T无关", "变好", "变差", "不变", "", ""], "r": "C", "e": "采样周期T增大，会使系统的采样频率降低，离散系统丢失的信息增多，不利于系统稳定，所以稳定性通常变差。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643223", "t": 1, "q": "离散系统中，若系统的闭环极点在z平面上的位置位于单位圆外，该系统的稳定性为", "a": ["临界稳定", "无法判断", "稳定", "不稳定", "", ""], "r": "D", "e": "离散系统稳定的充要条件是闭环极点都在z平面单位圆内，有极点在单位圆外则系统不稳定。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643224", "t": 1, "q": "离散系统中，若系统的闭环极点在z平面上位于单位圆上且为单极点，该系统的稳定性为", "a": ["不稳定", "稳定", "临界稳定", "无法判断", "", ""], "r": "C", "e": "离散系统闭环极点在 z 平面单位圆上且为单极点时，系统处于临界稳定状态。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643225", "t": 1, "q": "离散系统中，若系统的闭环极点在z平面上位于原点，该极点对系统响应的影响是", "a": ["使响应发散", "使响应快速衰减", "使响应等幅振荡", "使响应保持不变", "", ""], "r": "D", "e": "这是一道关于离散系统闭环极点影响的问题。在离散时间系统中，闭环极点的位置决定了系统响应的特性。首先，我们简要梳理一下关键概念：1. 闭环极点：在离散系统中，闭环极点是系统特征方程的根，它决定了系统响应的动态行为。2. z平面：离散系统的频率响应是在z平面上分析的，其中z是复变量，代表系统的离散时间指数。接下来，分析题目中的关键信息：* 闭环极点位于z平面的原点。现在，我们根据这些关键信息分析各个选项：A. 使响应发散：当闭环极点位于z平面的原点时，系统的响应并不会发散。实际上，这种极点配置会导致系统响应趋于稳定，但不是以发散的形式。B. 使响应快速衰减：这个选项也不正确。位于原点的闭环极点不会导致响应快速衰减。相反，它会导致响应保持一种稳定的状态。C. 使响应等幅振荡：这个选项同样不准确。等幅振荡通常与特定的极点配置相关，但不是位于z平面原点的极点。D. 使响应保持不变：这是正确的选项。当离散系统的闭环极点位于z平面原点时，系统的稳态响应将保持为一个常数，即响应不会随时间变化。这是因为原点处的极点对应一个恒定的输出值，不随输入信号的变化而改变。综上所述，当离散系统的闭环极点位于z平面上位于原点时，该极点会使系统的响应保持不变。所以，正确答案是D选项：“使响应保持不变”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643226", "t": 1, "q": "离散系统中，若系统的开环传递函数G(z)在z=1处有3个极点，则该系统的型别是", "a": ["IV型", "III型", "II型", "I型", "", ""], "r": "B", "e": "在离散系统中，开环传递函数G(z)在z = 1处极点的个数就是系统的型别。已知在z = 1处有3个极点，所以系统是III型。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643227", "t": 1, "q": "离散系统中，若系统的开环z变换G(z)在z=1处有1个极点，则该系统对单位抛物线输入的稳态误差ess为", "a": ["无穷大", "0", "常数", "与采样周期有关", "", ""], "r": "A", "e": "系统开环 z 变换在 z = 1 处有 1 个极点，为Ⅰ型系统，Ⅰ型系统对单位抛物线输入的稳态误差是无穷大。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643228", "t": 1, "q": "利用劳斯判据分析三阶系统s³+2s²+3s+K=0的稳定性，当K为何值时系统临界稳定", "a": ["K=6", "K=3", "K=2", "K=1", "", ""], "r": "A", "e": "对于三阶系统「test/yiwen_img/importSubject/2034803619601190912.png」（本题「test/yiwen_img/importSubject/2034803619697659904.png」，「test/yiwen_img/importSubject/2034803619794128896.png」，「test/yiwen_img/importSubject/2034803619890597888.png」，「test/yiwen_img/importSubject/2034803619961901056.png」），根据劳斯判据，系统临界稳定时劳斯表某一行元素全为零。三阶系统劳斯表第一列元素为「test/yiwen_img/importSubject/2034803620096118784.png」，「test/yiwen_img/importSubject/2034803620171616256.png」，「test/yiwen_img/importSubject/2034803620238725120.png」，「test/yiwen_img/importSubject/2034803620330999808.png」 ，令「test/yiwen_img/importSubject/2034803620402302976.png」，即「test/yiwen_img/importSubject/2034803620490383360.png」，解得K = 6。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643229", "t": 1, "q": "利用劳斯判据分析线性定常系统稳定性时，若劳斯阵列某一行所有元素均为零，需引入辅助多项式求解，辅助多项式的次数通常是", "a": ["与系统开环传递函数的阶次相同", "为偶数，且对应系统的对称极点", "为奇数，且对应系统的实轴极点", "等于零元素行上方相邻行的最高次项次数", "", ""], "r": "D", "e": "劳斯判据是一种用于分析线性定常系统稳定性的方法。当劳斯阵列中的某一行所有元素都为零时，意味着系统存在重根或特殊情况，这时需要引入辅助多项式来进一步分析。辅助多项式的次数通常是与零元素行上方相邻行的最高次项次数相同。这是因为辅助多项式的作用是为了找到系统的辅助方程，进而确定系统的稳定性。通过引入辅助多项式，可以将原系统的特征方程转化为一个更容易分析的形式。具体来说： A选项提到的“系统开环传递函数的阶次”并不直接决定辅助多项式的次数。 B选项中的“偶数，且对应系统的对称极点”没有直接关系。 C选项中的“奇数，且对应系统的实轴极点”也不符合辅助多项式的定义。 D选项“等于零元素行上方相邻行的最高次项次数”是正确的，因为这确保了辅助多项式能够正确反映系统的动态特性。综上所述，正确答案是D选项：“等于零元素行上方相邻行的最高次项次数”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643230", "t": 1, "q": "利用奈奎斯特判据判断系统稳定性时，若开环系统稳定（P=0），且开环频率特性G(jω)H(jω)顺时针包围(-1,j0)点2次，则闭环系统右半s平面极点个数Z为", "a": ["0", "-2", "1", "2", "", ""], "r": "D", "e": "根据奈奎斯特判据Z = P + N，已知P = 0，顺时针包围(-1,j0)点2次，N = 2，所以Z = 0 + 2 = 2。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643231", "t": 1, "q": "利用奈奎斯特判据判断最小相位系统稳定性时，若开环对数幅频特性在截止频率ωc处的相角裕度γ>0，则系统", "a": ["临界稳定", "无法确定", "稳定", "不稳定", "", ""], "r": "C", "e": "奈奎斯特判据是一种用于判断线性时不变系统稳定性的方法，特别适用于分析闭环系统的稳定性。在奈奎斯特判据中，系统的稳定性可以通过开环传递函数的奈奎斯特图来判断。对于最小相位系统，其开环对数幅频特性在截止频率ωc处的相角裕度γ是一个关键指标。相角裕度γ定义为在截止频率处，开环传递函数的相位角与-180°之间的差值。根据奈奎斯特判据： 如果γ > 0，则系统是稳定的。 如果γ = 0，则系统是临界稳定的。 如果γ < 0，则系统是不稳定的。在本题中，已知开环对数幅频特性在截止频率ωc处的相角裕度γ > 0，因此根据奈奎斯特判据，系统是稳定的。所以，正确答案是C. 稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643232", "t": 1, "q": "描述函数法分析非线性系统时，要求非线性环节的输入输出特性满足", "a": ["偶对称性", "线性特性", "单调递增特性", "奇对称性", "", ""], "r": "D", "e": "描述函数法分析非线性系统时，要求非线性环节输入输出特性满足奇对称性，这样才能保证在正弦输入下输出的直流分量为零。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643233", "t": 1, "q": "描述函数法中，\"自激振荡\"的频率由哪个因素决定", "a": ["交点处的ω值", "非线性环节的描述函数N(A)", "开环传递函数G(jω)", "交点处的A值", "", ""], "r": "A", "e": "在描述函数法中，自激振荡的频率由奈奎斯特曲线与负倒描述函数曲线交点处的ω值决定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643234", "t": 1, "q": "描述函数法中，非线性环节的描述函数N(A)为纯虚数，说明该非线性特性", "a": ["产生的输出基波分量与输入同相", "是偶对称的", "是奇对称的", "产生的输出基波分量与输入反相90°", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643235", "t": 1, "q": "描述函数法中，非线性环节的描述函数N(A)与下列哪个因素有关", "a": ["系统的开环增益", "系统的阻尼比", "输入信号的频率", "输入信号的幅值", "", ""], "r": "D", "e": "描述函数法中，非线性环节的描述函数N(A)是输入信号幅值A的函数，与系统开环增益、阻尼比和输入信号频率无关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643236", "t": 1, "q": "描述函数法中，非线性环节的输入为正弦信号x(t)=A sinωt，其输出的基波分量振幅为", "a": ["A×Im(N(A))", "|N(A)|/A", "A×Re(N(A))", "A×|N(A)|", "", ""], "r": "D", "e": "在描述函数法里，非线性环节输入正弦信号x(t)=A sinωt 时，输出基波分量振幅是 A×|N(A)| 。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643237", "t": 1, "q": "描述函数法中，若-1/G(jω)的轨迹完全位于非线性环节描述函数N(A)的右侧，则系统", "a": ["不稳定", "临界稳定", "存在自激振荡", "稳定", "", ""], "r": "D", "e": "这是一道关于控制系统稳定性的题目，具体涉及到描述函数法的应用。首先，我们来简要解释一下相关概念：* 描述函数法：这是一种用于分析非线性系统稳定性的方法。* 「test/yiwen_img/importSubject/2034803620607823872.png」：这通常代表系统的开环频率响应的倒数。* N(A)：非线性环节的描述函数，它描述了非线性环节的输入输出关系。接下来，我们分析题目中的关键信息：* 若「test/yiwen_img/importSubject/2034803620607823872.png」的轨迹完全位于非线性环节描述函数N(A)的右侧。这个条件实际上是在描述系统的稳定性。在描述函数法中，如果「test/yiwen_img/importSubject/2034803620607823872.png」的轨迹始终在N(A)的右侧，那么系统对于任何输入都将保持稳定，不会出现振荡或发散的情况。现在，我们逐一考虑各个选项：A. 不稳定：根据题目描述，系统实际上是稳定的，所以这个选项是不正确的。B. 临界稳定：临界稳定意味着系统处于稳定和不稳定的边缘，但根据题目条件，系统是明确稳定的，因此这个选项也是不正确的。C. 存在自激振荡：如果系统存在自激振荡，那么「test/yiwen_img/importSubject/2034803620607823872.png」的轨迹会与N(A)有交点或在某些区域内交叉，但题目明确指出轨迹完全位于N(A)的右侧，因此不存在自激振荡，这个选项是不正确的。D. 稳定：根据前面的分析，这个选项是正确的。因为「test/yiwen_img/importSubject/2034803620607823872.png」的轨迹完全位于N(A)的右侧，所以系统对于任何输入都将保持稳定。综上所述，正确答案是D.稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643238", "t": 1, "q": "描述函数法中，若-1/G(jω)的轨迹与非线性环节描述函数N(A)的轨迹相切，则系统存在", "a": ["无自激振荡", "稳定的自激振荡", "临界稳定的自激振荡", "不稳定的自激振荡", "", ""], "r": "C", "e": "在描述函数法中，当-1/G(jω)的轨迹与非线性环节描述函数N(A)的轨迹相切时，意味着系统在该点处的响应处于临界稳定状态。临界稳定指的是系统在该条件下可能产生振荡，但振荡的幅度保持不变，既不会逐渐增大也不会逐渐减小。这种情况对应于系统存在稳定的自激振荡，因为振荡能够持续存在而不发散。所以，正确答案是C：“临界稳定的自激振荡”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643239", "t": 1, "q": "描述函数法中，若-1/G(jω)轨迹完全位于非线性环节N(A)的左侧，系统可能出现", "a": ["发散振荡", "无振荡", "衰减振荡", "等幅振荡", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643240", "t": 1, "q": "描述函数法中，若非线性环节的描述函数N(A)随幅值A增大而增大，则该非线性特性可能是", "a": ["死区特性", "间隙特性", "饱和特性", "理想继电特性", "", ""], "r": "D", "e": "这是一道关于非线性环节描述函数特性的问题。描述函数N(A)是描述非线性环节动态特性的数学工具，其值随输入幅值A的变化而变化。1. 死区特性：通常表现为在输入信号较小时，输出没有响应，即存在一个“死区”。在这个区域内，描述函数N(A)的值不会随A的增大而显著变化。2. 间隙特性：这种特性表现为在特定的输入范围内，输出没有响应或响应很小，形成一个“间隙”。类似于死区特性，在这个间隙内，描述函数的值也不会随输入幅值的增大而明显变化。3. 饱和特性：在这种特性下，当输入信号增大到一定程度时，输出信号将达到其极限值并不再继续增大。这意味着随着输入幅值A的增加，描述函数N(A)的值会在某一点后趋于稳定，不会一直增大。4. 理想继电特性：这种特性表现为当输入信号超过某个阈值时，输出会发生突变，且随着输入信号的进一步增大，输出保持恒定或按某一固定斜率增加。在这种情况下，描述函数N(A)会随着输入幅值A的增大而增大。根据题目描述，“非线性环节的描述函数N(A)随幅值A增大而增大”，这一特性最符合理想继电特性的描述。综上所述，正确答案是D.理想继电特性。", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643241", "t": 1, "q": "描述函数法中，若非线性环节的描述函数N(A)与-1/G(jω)的轨迹相交，且交点处满足\"自激振荡条件\"，则系统存在", "a": ["无振荡", "衰减振荡", "等幅振荡", "发散振荡", "", ""], "r": "C", "e": "当描述函数N(A)与 -1/G(jω)轨迹相交且满足自激振荡条件时，系统会产生等幅振荡。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643242", "t": 1, "q": "描述函数法中，若非线性环节的描述函数N(A)与-1/G(jω)的轨迹有两个交点，则系统可能存在", "a": ["两个自激振荡（一个稳定，一个不稳定）", "一个不稳定的自激振荡", "无自激振荡", "一个稳定的自激振荡", "", ""], "r": "A", "e": "在描述函数法里，当N(A)与 -1/G(jω)轨迹有两个交点时，系统会有两个自激振荡，且一个稳定一个不稳定。所以答案选A。", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643243", "t": 1, "q": "某单位负反馈系统的开环传递函数为G（　）=K/(s(0.5s+1)(s+1))，若要求系统闭环稳定，K的取值范围是", "a": ["K>6", "0<K<3", "3<K<6", "K>0", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643244", "t": 1, "q": "某二阶系统的单位阶跃响应曲线呈现等幅振荡，该系统的阻尼比ζ为", "a": ["0<ζ<1", "ζ>1", "ζ=1", "ζ=0", "", ""], "r": "D", "e": "二阶系统中，阻尼比ζ = 0 时系统无阻尼，单位阶跃响应会呈现等幅振荡。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803627662643245", "t": 1, "q": "某二阶系统的单位阶跃响应无超调，且响应速度最快，该系统的阻尼比ζ为", "a": ["ζ=1", "0<ζ<1", "ζ=0", "ζ>1", "", ""], "r": "A", "e": "二阶系统单位阶跃响应无超调时，阻尼比ζ≥1。响应速度最快对应临界阻尼状态，此时ζ = 1。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745984", "t": 2, "q": "二阶系统单位阶跃响应的超调量σ%=0的情况有", "a": ["ζ=0（无阻尼）", "ζ=1（临界阻尼）", "ζ>1（过阻尼）", "ωn→∞", "", ""], "r": "BC", "e": "超调量是指系统阶跃响应中，输出超过稳态值的最大偏离量与稳态值之比。二阶系统超调量公式与阻尼比ζ有关，当ζ≥1时，系统阶跃响应无超调，ζ = 1为临界阻尼，ζ>1为过阻尼。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745985", "t": 2, "q": "二阶系统的单位阶跃响应特性受哪些参数影响", "a": ["采样周期T", "阻尼比ζ", "开环增益K", "无阻尼自然频率ωn", "", ""], "r": "BD", "e": "二阶系统单位阶跃响应特性主要由阻尼比ζ和无阻尼自然频率ωn决定。采样周期T是离散系统概念，开环增益K不是直接决定二阶系统单位阶跃响应特性的关键参数。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745986", "t": 2, "q": "二阶系统中，若系统的闭环传递函数为Φ（　）=9/(s²+3s+9)，则其性能指标包括", "a": ["超调量σ%≈16.3%", "阻尼比ζ=0.5", "调节时间ts≈2s（±5%误差）", "无阻尼自然频率ωn=3rad/s", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745987", "t": 2, "q": "二阶系统中，若系统的调节时间ts减小，可能的原因包括", "a": ["无阻尼自然频率ωn增大", "开环增益减小", "阻尼比ζ增大（当ζ较小时）", "增加了超前校正装置", "", ""], "r": "ACD", "e": "调节时间「test/yiwen_img/importSubject/2034803620729458688.png」与无阻尼自然频率「test/yiwen_img/importSubject/2034803620800761856.png」和阻尼比「test/yiwen_img/importSubject/2034803616979750912.png」有关，「test/yiwen_img/importSubject/2034803620729458688.png」减小意味着系统响应变快。「test/yiwen_img/importSubject/2034803620800761856.png」增大可使响应加快；超前校正装置能改善系统动态性能，加快响应；当「test/yiwen_img/importSubject/2034803616979750912.png」较小时增大「test/yiwen_img/importSubject/2034803616979750912.png」也会使「test/yiwen_img/importSubject/2034803620729458688.png」减小，而开环增益减小一般会使系统响应变慢。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745988", "t": 2, "q": "二阶系统中，若系统的相角裕度γ增大，可能的原因包括", "a": ["增加了超前校正装置", "开环增益减小", "阻尼比ζ增大", "无阻尼自然频率ωn增大", "", ""], "r": "ABC", "e": "相角裕度γ增大意味着系统的稳定性增强。超前校正装置可增加相角，使相角裕度增大；开环增益减小、阻尼比ζ增大都会使系统稳定性变好，相角裕度增大。而无阻尼自然频率ωn增大对相角裕度影响复杂，不一定使其增大。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745989", "t": 2, "q": "二阶系统中，若阻尼比ζ=0.6，无阻尼自然频率ωn增大，会导致", "a": ["超调量σ%减小", "调节时间ts减小", "稳态误差ess不变", "峰值时间tp减小", "", ""], "r": "BD", "e": "二阶系统中，超调量只与阻尼比有关，ζ不变则超调量不变；调节时间与ζ和ωn有关，ωn增大，ts减小；稳态误差与系统类型、输入信号等有关，题干未提及变化情况；峰值时间tp与ζ和ωn有关，ωn增大，tp减小。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745990", "t": 2, "q": "二阶系统中，谐振峰值Mr存在的条件是", "a": ["ζ<√2/2（≈0.707）", "系统为欠阻尼系统", "0<ζ<1", "ωn>0", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745991", "t": 2, "q": "离散系统的闭环极点若位于z平面的下列位置，系统可能稳定的有", "a": ["单位圆上（模=1，单极点）", "单位圆外（模>1）", "单位圆上（模=1，多重极点）", "单位圆内（模<1）", "", ""], "r": "AD", "e": "离散系统稳定的充要条件是闭环极点都在 z 平面单位圆内；单位圆上单极点临界稳定，多重极点不稳定；单位圆外极点系统不稳定。所以可能稳定的是单位圆内和单位圆上单极点情况。答案：AD", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745992", "t": 2, "q": "离散系统稳定的充要条件包括", "a": ["闭环所有极点的模均小于1", "朱利阵列第一列所有元素均为正", "开环所有极点均位于z平面单位圆内", "闭环所有极点均位于z平面单位圆内", "", ""], "r": "AD", "e": "这是一道关于离散系统稳定性的选择题。在离散时间系统中，稳定性是一个关键的概念，它关系到系统是否能够对输入信号进行稳定的响应。首先，我们来看选项A，它提到“闭环所有极点的模均小于1”。这是离散系统稳定的一个充分必要条件。在z平面上，如果闭环系统的所有极点都位于单位圆内（即极点的模小于1），那么系统就是稳定的。接着是选项B，“朱利阵列第一列所有元素均为正”。朱利阵列是判断离散系统稳定性的一种方法，但如果只是第一列元素为正，并不能保证系统的稳定性。因此，B选项是不正确的。再来看选项C，“开环所有极点均位于z平面单位圆内”。这个条件并不足以保证闭环系统的稳定性。开环极点的位置虽然对系统稳定性有影响，但不是决定性的，因此C选项也是不正确的。最后是选项D，“闭环所有极点均位于z平面单位圆内”。这与选项A的描述是一致的，只是表述方式略有不同。这个条件确实是离散系统稳定的充要条件。综上所述，离散系统稳定的充要条件是闭环所有极点的模均小于1，或者等价地说，闭环所有极点均位于z平面单位圆内。因此，正确答案应该是A和D。所以，正确答案是AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745993", "t": 2, "q": "离散系统稳定的朱利判据中，需要检查的条件包括", "a": ["闭环特征方程的系数全为正", "闭环特征方程在z=-1处的值（n为阶次，n为偶数时大于0，n为奇数时小于0）", "闭环特征方程在z=1处的值大于0", "朱利阵列第一列所有元素均为正", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745994", "t": 2, "q": "离散系统中，采样定理的作用包括", "a": ["避免采样信号发生混叠", "确定采样周期的上限", "保证采样信号能恢复原连续信号", "确定采样频率的下限", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745995", "t": 2, "q": "离散系统中，采样信号f*(t)的特点包括", "a": ["采样信号是连续信号", "采样时刻的值等于连续信号f(t)在该时刻的值", "采样信号是离散信号", "仅在采样时刻有值", "", ""], "r": "BCD", "e": "采样信号f*(t)是对连续信号f(t)在采样时刻进行采样得到，仅在采样时刻有值，是离散信号，其采样时刻的值等于连续信号f(t)在该时刻的值。A选项中采样信号不是连续信号。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745996", "t": 2, "q": "离散系统中，单位负反馈系统的闭环传递函数Φ(z)与开环传递函数G(z)的关系为", "a": ["Φ(z)=1/(1+G(z))", "开环传递函数G(z)=Φ(z)/(1-Φ(z))", "开环传递函数G(z)=(1-Φ(z))/Φ(z)", "Φ(z)=G(z)/(1+G(z))", "", ""], "r": "BD", "e": "对于单位负反馈离散系统，闭环传递函数「test/yiwen_img/importSubject/2034803620867870720.png」与开环传递函数G(z)的关系推导是基于闭环传递函数定义，「test/yiwen_img/importSubject/2034803620985311232.png」，由此还能推导出「test/yiwen_img/importSubject/2034803621115334656.png」。答案是BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745997", "t": 2, "q": "离散系统中，若采样周期T=0.1s，连续信号f(t)=sin(10t)，则采样信号f*(t)的采样频率fs和信号最高频率fm满足", "a": ["fs=10Hz", "fs<2fm", "fs≥2fm", "fm=10/(2π)Hz≈1.59Hz", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745998", "t": 2, "q": "离散系统中，若采样周期T增大，可能导致的后果包括", "a": ["系统动态响应变慢", "系统稳定性变差", "采样信号发生混叠", "系统稳态误差增大", "", ""], "r": "ABC", "e": "采样周期T增大，采样频率降低，会使系统获取信息变慢，动态响应变慢；稳定性会变差；当采样频率低于信号最高频率两倍时会发生混叠；稳态误差与采样周期无直接必然联系。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888745999", "t": 2, "q": "离散系统中，若系统的闭环传递函数为Φ(z)=(z+0.3)/(z²-0.8z+0.2)，则系统的稳定性和极点位置包括", "a": ["闭环极点的模均小于1", "闭环极点为z1=0.4+j0.2，z2=0.4-j0.2", "系统不稳定", "系统稳定", "", ""], "r": "AD", "e": "1. 对于离散系统稳定性的判定： 离散系统稳定的充要条件是闭环极点均位于z = 0的单位圆内，即「test/yiwen_img/importSubject/2034803621199220736.png」，「test/yiwen_img/importSubject/2034803621283106816.png」。 已知闭环传递函数「test/yiwen_img/importSubject/2034803621354409984.png」，令分母「test/yiwen_img/importSubject/2034803621471850496.png」。 根据求根公式「test/yiwen_img/importSubject/2034803621568319488.png」。 计算极点的模「test/yiwen_img/importSubject/2034803621648011264.png」。2. 结论： 由于闭环极点的模均小于1，所以系统是稳定的。所以答案为AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746000", "t": 2, "q": "离散系统中，若系统的开环传递函数G(z)=(K(z+0.5))/((z-1)(z-0.6))，则系统的型别和开环增益相关参数包括", "a": ["系统型别v=2", "系统型别v=1", "静态速度误差系数Kv=lim(z→1)(z-1)G(z)=K(1.5)/(0.4)", "静态位置误差系数Kp=lim(z→1)G(z)不存在", "", ""], "r": "BC", "e": "开环传递函数分母含(z - 1)一次方，所以系统型别v = 1；静态速度误差系数「test/yiwen_img/importSubject/2034803621740285952.png」。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746001", "t": 2, "q": "离散系统中，若系统的开环传递函数G(z)=K/((z-1)(z-0.5))，则系统对不同输入的稳态误差包括", "a": ["单位阶跃输入ess=0", "单位脉冲输入ess=0", "单位斜坡输入ess=1/(Kv)，其中Kv=lim(z→1)(z-1)G(z)=2K", "单位抛物线输入ess=∞", "", ""], "r": "ABCD", "e": "本题可根据离散系统稳态误差的相关知识来进行分析。### 1. 离散系统稳态误差的相关结论离散系统的稳态误差与系统的型别和输入信号的类型有关，对于开环脉冲传递函数 G(z)，可根据其极点情况判断系统型别，再结合不同输入信号来计算稳态误差。### 2. 分析各输入信号下的稳态误差 单位脉冲输入：单位脉冲输入时，其 z 变换 R(z)=1，根据稳态误差的计算公式 「test/yiwen_img/importSubject/2034803621824172032.png」，将 R(z)=1 代入可得 「test/yiwen_img/importSubject/2034803621912252416.png」。 单位阶跃输入：单位阶跃输入时，其 z 变换 「test/yiwen_img/importSubject/2034803622012915712.png」，系统开环传递函数 「test/yiwen_img/importSubject/2034803622130356224.png」，系统为Ⅰ型系统，Ⅰ型系统对单位阶跃输入的稳态误差 「test/yiwen_img/importSubject/2034803621912252416.png」。 单位斜坡输入：单位斜坡输入时，其 z 变换 「test/yiwen_img/importSubject/2034803622289739776.png」，速度误差系数 「test/yiwen_img/importSubject/2034803622373625856.png」，将 「test/yiwen_img/importSubject/2034803622130356224.png」 代入可得 「test/yiwen_img/importSubject/2034803622461706240.png」，稳态误差 「test/yiwen_img/importSubject/2034803622616895488.png」（本题未提及 T ，默认 T = 1 ），即 「test/yiwen_img/importSubject/2034803622717558784.png」。 单位抛物线输入：单位抛物线输入时，其 z 变换 「test/yiwen_img/importSubject/2034803622826610688.png」，系统为Ⅰ型系统，对单位抛物线输入的稳态误差 「test/yiwen_img/importSubject/2034803623006965760.png」。综上，ABCD 四个选项的描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746002", "t": 2, "q": "离散系统中，下列关于采样周期T的说法，正确的有", "a": ["T越小，离散系统越接近连续系统", "T过大可能导致系统不稳定", "T的选择与系统最高工作频率有关", "T增大时，系统的调节时间通常增大", "", ""], "r": "ABCD", "e": "采样周期T越小，离散信号越接近连续信号，离散系统就越接近连续系统；T过大信息丢失严重，可能使系统不稳定；T选择要根据香农采样定理，与系统最高工作频率有关；T增大，系统响应慢，调节时间通常增大。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746003", "t": 2, "q": "离散系统中，下列关于单位阶跃响应c(n)的说法，正确的有", "a": ["c(n)的z变换C(z)=Φ(z)×Z[1(n)]=Φ(z)×z/(z-1)", "c(n)反映系统的动态性能和稳态性能", "c(n)是系统对单位阶跃序列1(n)的零状态响应", "c(n)的稳态值可由终值定理求得:c(∞)=lim(z→1)(z-1)C(z)", "", ""], "r": "ABCD", "e": "单位阶跃响应是系统对单位阶跃序列的零状态响应，其z变换是系统闭环传递函数Φ(z)与单位阶跃序列z变换z/(z - 1)的乘积，单位阶跃响应能反映系统动态和稳态性能，稳态值可由终值定理计算。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746004", "t": 2, "q": "离散系统中，下列关于z域与s域映射关系的说法，正确的有", "a": ["s平面的原点映射到z平面的z=1点", "s平面的右半平面映射到z平面的单位圆外", "s平面的虚轴映射到z平面的单位圆上", "s平面的左半平面映射到z平面的单位圆内", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746005", "t": 2, "q": "离散系统中，下列信号的z变换错误的有", "a": ["单位斜坡序列n的z变换为z/(z-1)²", "单位脉冲序列δ(n-1)的z变换为z⁻¹", "单位阶跃序列1(n)的z变换为z/(z-1)", "指数序列e<sup>(-anT)的z变换为z/(z-e<\/sup>(-aT))", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746006", "t": 2, "q": "离散系统中，z变换的性质包括", "a": ["终值定理", "时移性质", "线性性质", "卷积定理", "", ""], "r": "BCD", "e": "这是一道关于离散系统中z变换性质的选择题。在离散系统分析和信号处理中，z变换是一个非常重要的工具，它具有一系列有用的性质。首先，我们简要概述下题目中的各个选项所代表的性质：A. 终值定理：这个定理在z变换中并不总是成立，因为它要求系统的单位脉冲响应必须是因果的且稳定的，这在所有情况下并不总是满足。B. 时移性质：这是z变换的一个重要性质。它表明，如果一个序列的z变换存在，那么该序列时移后的z变换也可以通过简单的数学操作从原z变换得到。C. 线性性质：这也是z变换的一个基本性质。它说明，两个序列的z变换之和等于这两个序列分别进行z变换后再求和的结果。D. 卷积定理：在z变换中，卷积定理表明两个序列的卷积的z变换等于这两个序列z变换的乘积。综上所述，离散系统中z变换的性质包括时移性质（B）、线性性质（C）和卷积定理（D）。终值定理（A）并不总是适用，因此不包括在内。所以，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746007", "t": 2, "q": "利用劳斯判据分析四阶系统s⁴+a s³+b s²+c s+d=0（a,b,c,d>0）稳定性时，劳斯阵列第一列元素包括", "a": ["a", "1", "d", "(ab-c)/a", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746008", "t": 2, "q": "利用劳斯判据分析五阶系统稳定性时，劳斯阵列的行数为", "a": ["5行", "比系统阶次多1行", "与系统阶次相同", "6行", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746009", "t": 2, "q": "利用劳斯判据分析系统时，若劳斯阵列某一行所有元素均为零，需进行的操作包括", "a": ["用导数多项式的系数替换零元素行", "继续构造劳斯阵列，判断稳定性", "对辅助多项式求导，得到导数多项式", "由零元素行上方一行元素构成辅助多项式", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746010", "t": 2, "q": "利用劳斯判据分析系统时，若系统特征方程为s³+4s²+5s+2=0，其劳斯阵列和稳定性判断包括", "a": ["系统存在右半s平面极点", "系统稳定", "劳斯阵列第一列元素全正", "劳斯阵列第一列元素为1、4、4.5、2", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746011", "t": 2, "q": "利用劳斯判据分析系统时，若系统特征方程有纯虚根，可能出现的情况有", "a": ["辅助多项式的根为纯虚根", "系统临界稳定", "劳斯阵列某一行所有元素均为零", "系统不稳定", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746012", "t": 2, "q": "利用劳斯判据分析系统稳定性时，若劳斯阵列第一列出现负元素，说明", "a": ["系统存在右半s平面极点", "需进一步计算辅助多项式确定极点位置", "系统不稳定", "负元素的个数等于右半s平面极点的个数", "", ""], "r": "ACD", "e": "劳斯判据中，若劳斯阵列第一列出现负元素，表明系统特征方程有正实部根，即系统存在右半s平面极点，系统不稳定。而劳斯阵列第一列负元素变号次数等于右半s平面极点个数。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746013", "t": 2, "q": "利用奈奎斯特判据判断系统稳定性时，需要知道的信息有", "a": ["开环频率特性G(jω)H(jω)包围(-1,j0)点的次数N", "开环传递函数G（　）H（　）", "闭环传递函数Φ（　）", "开环右半s平面极点个数P", "", ""], "r": "ABD", "e": "奈奎斯特判据判断系统稳定性依据公式Z = P - 2N，其中Z是闭环右半s平面极点个数，P是开环右半s平面极点个数，N是开环频率特性G(jω)H(jω)包围(-1,j0)点的次数，要使用该判据需知道N和P，且P需由开环传递函数确定。所以需要知道开环频率特性G(jω)H(jω)包围(-1,j0)点的次数N、开环传递函数G(s)H(s)以确定P。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746014", "t": 2, "q": "描述函数法分析非线性系统时，需满足的假设条件有", "a": ["输入信号为正弦信号", "线性部分具有低通滤波特性", "非线性环节输入输出特性为奇对称", "系统中只有一个非线性环节", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746015", "t": 2, "q": "描述函数法中，辅助线性化的核心是", "a": ["将非线性环节等效为线性环节（描述函数N(A)）", "仅考虑非线性环节输出的基波分量", "假设输入信号为正弦信号", "忽略非线性环节输出的高次谐波", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746016", "t": 2, "q": "描述函数法中，系统存在自激振荡的条件包括", "a": ["在交点处，满足∠G(jω)N(A)=-180°", "在交点处，满足|G(jω)N(A)|=1", "非线性环节的描述函数N(A)与-1/G(jω)轨迹相交", "在交点处，随着输入幅值A增大，-1/G(jω)轨迹从N(A)的右侧进入左侧", "", ""], "r": "ABC", "e": "系统存在自激振荡需非线性环节的描述函数N(A)与 -1/G(jω)轨迹相交，且满足∠G(jω)N(A)= -180°和|G(jω)N(A)| = 1 。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746017", "t": 2, "q": "描述函数法中，下列非线性特性的描述函数N(A)与输入幅值A有关的有", "a": ["理想继电特性", "理想线性特性", "死区特性", "饱和特性", "", ""], "r": "ACD", "e": "这是一道关于非线性特性描述函数的选择题。在描述函数法中，非线性特性的描述函数N(A)与输入幅值A的关系是判断的关键。首先，我们简要梳理题目中的关键信息和涉及的概念：* 描述函数法：用于分析和处理非线性系统的一种方法。* 非线性特性：系统的输出与输入之间不满足线性关系的特性。* 描述函数N(A)：用于描述非线性系统特性的函数，与输入幅值A有关或无关。接下来，针对每个选项进行简要分析：A. 理想继电特性：这种特性在输入达到一定阈值后会有跳跃，其描述函数与输入幅值A有关。B. 理想线性特性：线性系统的输出与输入成正比，其描述函数为常数，与输入幅值A无关。C. 死区特性：在输入的一定范围内，系统无输出，这种特性的描述函数与输入幅值A有关，因为死区的范围可能随输入幅值变化。D. 饱和特性：当输入超过一定范围时，系统输出达到饱和值，不再随输入增加而增加，其描述函数与输入幅值A有关。综上所述，与输入幅值A有关的非线性特性描述函数包括理想继电特性（A）、死区特性（C）和饱和特性（D）。理想线性特性（B）的描述函数与输入幅值A无关。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746018", "t": 2, "q": "描述函数法中，下列非线性系统可能存在自激振荡的有", "a": ["-1/G(jω)轨迹完全位于N(A)左侧", "N(A)与-1/G(jω)轨迹无交点", "N(A)与-1/G(jω)轨迹相交", "N(A)与-1/G(jω)轨迹相切", "", ""], "r": "CD", "e": "在描述函数法中，判断非线性系统是否存在自激振荡主要依据N(A)与-1/G(jω)轨迹的相对位置关系。如果N(A)与-1/G(jω)轨迹无交点，意味着系统在该频率范围内不存在使幅值增大的相互作用，所以不会产生自激振荡。当N(A)与-1/G(jω)轨迹相交时，表明在某些频率下两者之间存在相互作用，但一般不足以导致持续的自激振荡。而当N(A)与-1/G(jω)轨迹相切时，意味着在该特定频率下，系统的反馈作用达到临界状态，有可能引发并维持自激振荡。轨迹完全位于一侧的情况通常也不会导致自激振荡。综上所述，可能存在自激振荡的是轨迹相交和相切的情况。所以，正确答案是CD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746019", "t": 2, "q": "描述函数法中，下列关于\"高次谐波忽略\"的假设，正确的有", "a": ["高次谐波对系统响应的影响可忽略不计", "若线性部分低通特性差，描述函数法的误差会增大", "线性部分具有低通滤波特性，能衰减高次谐波", "该假设是描述函数法近似性的主要来源", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746020", "t": 2, "q": "描述函数法中，下列关于自激振荡稳定性的判断，正确的有", "a": ["若在交点处，A增大时-1/G(jω)进入N(A)左侧，振荡不稳定", "稳定振荡的幅值会自发维持在交点对应的A值", "若在交点处，A增大时-1/G(jω)进入N(A)右侧，振荡稳定", "不稳定振荡的幅值会随时间增大或减小", "", ""], "r": "BD", "e": "在描述函数法自激振荡稳定性判断中，稳定振荡幅值能自发维持在交点对应A值，不稳定振荡幅值会随时间增大或减小。A选项，A增大时 -1/G(jω)进入N(A)左侧，振荡稳定；C选项，A增大时 -1/G(jω)进入N(A)右侧，振荡不稳定。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746021", "t": 2, "q": "时域指标中，反映系统振荡性的指标有", "a": ["调节时间ts", "峰值时间tp", "超调量σ%", "阻尼比ζ", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746022", "t": 2, "q": "下列典型环节中，传递函数分子含有s的有", "a": ["比例-微分环节", "积分环节", "微分环节", "惯性环节", "", ""], "r": "AC", "e": "比例 - 微分环节传递函数为G(s)=K(1 + Ts)=K + KTs，分子含s；积分环节「test/yiwen_img/importSubject/2034803623078268928.png」；微分环节G(s)=s；惯性环节「test/yiwen_img/importSubject/2034803623166349312.png」。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746023", "t": 2, "q": "下列典型环节中，阶跃输入下输出能达到稳态值的有", "a": ["惯性环节", "积分环节", "比例环节", "微分环节", "", ""], "r": "AC", "e": "惯性环节在阶跃输入下输出会逐渐达到稳态值；积分环节输出随时间不断上升无稳态值；比例环节输出与输入成比例，阶跃输入下能立即达到稳态值；微分环节在阶跃输入瞬间有输出，之后为 0 无稳态输出。所以能达到稳态值的有惯性环节和比例环节。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034803632888746024", "t": 2, "q": "下列典型环节中，阶跃输入下输出有超调的有", "a": ["临界阻尼二阶系统（ζ=1）", "无阻尼二阶系统（ζ=0）", "过阻尼二阶系统（ζ>1）", "欠阻尼二阶系统（0<ζ<1）", "", ""], "r": "BD", "e": "超调是指系统响应超出稳态值的现象。二阶系统中，无阻尼（ζ = 0）和欠阻尼（0 < ζ < 1）情况下，阶跃输入输出有超调；临界阻尼（ζ = 1）和过阻尼（ζ > 1）无超调。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363776", "t": 3, "q": "0型系统的奈奎斯特曲线在ω→0+时，起点为(开环增益K,0)点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "0型系统开环传递函数分母和分子中s的零次幂项系数比为开环增益K，其奈奎斯特曲线ω→0⁺时，起点为(开环增益K,0)点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363777", "t": 3, "q": "饱和特性的描述函数N(A)随输入幅值A的增大而增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "饱和特性的描述函数N(A)随输入幅值A的增大而减小，并非增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363778", "t": 3, "q": "比例-积分（PI）校正装置会降低系统的相角裕度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PI校正装置可改善系统稳态性能，一般会增加系统相角裕度而非降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363779", "t": 3, "q": "比例-微分（PD）校正装置属于滞后校正。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "比例 - 微分（PD）校正装置是超前校正，不是滞后校正。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363780", "t": 3, "q": "比例环节的阶跃输入下，输出瞬时达到输入幅值的K倍并保持（K为比例系数）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "比例环节的输出与输入成比例关系，在阶跃输入时，输出会瞬间按比例系数K放大，达到输入幅值的K倍并保持。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363781", "t": 3, "q": "并联校正通常串联在控制器与被控对象之间。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并联校正一般是通过反馈的方式与被控对象或部分环节并联，而不是串联在控制器与被控对象之间，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363782", "t": 3, "q": "采样信号f*(t)是连续信号f(t)在采样时刻的取值序列，属于连续信号。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "采样信号f*(t)是对连续信号f(t)在采样时刻取值得到的离散序列，并非连续信号。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363783", "t": 3, "q": "超调量σ%越小，说明自动控制系统的动态性能越好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超调量反映了系统动态过程中输出超出稳态值的程度，超调量越小，意味着系统在动态响应中偏离稳态值的幅度越小，系统能更快、更平稳地达到稳态，所以动态性能越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363784", "t": 3, "q": "超前校正装置的最大相移角φm与参数α（α=T1/T2>1）的关系为φm=arcsin((α-1)/(α+1))。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是超前校正装置最大相移角与参数α关系的基本公式，该公式表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363785", "t": 3, "q": "超前校正装置可降低系统的截止频率ωc。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超前校正装置可增大系统的截止频率ωc ，而非降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363786", "t": 3, "q": "单位斜坡序列n（n≥0）的z变换为z²/(z-1)²。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据z变换性质，单位斜坡序列「test/yiwen_img/importSubject/2034803623313149952.png」（「test/yiwen_img/importSubject/2034803623388647424.png」）的z变换公式为「test/yiwen_img/importSubject/2034803623472533504.png」，并非「test/yiwen_img/importSubject/2034803623589974016.png」。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363787", "t": 3, "q": "二阶系统的超调量σ%仅与阻尼比ζ有关，与无阻尼自然频率ωn无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "二阶系统超调量公式为「test/yiwen_img/importSubject/2034803623699025920.png」，可见超调量只与阻尼比「test/yiwen_img/importSubject/2034803616979750912.png」有关，和无阻尼自然频率「test/yiwen_img/importSubject/2034803620800761856.png」无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363788", "t": 3, "q": "二阶系统的调节时间ts与无阻尼自然频率ωn成反比（阻尼比ζ不变时）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "二阶系统调节时间「test/yiwen_img/importSubject/2034803620729458688.png」公式中，当阻尼比「test/yiwen_img/importSubject/2034803616979750912.png」不变时，「test/yiwen_img/importSubject/2034803620729458688.png」与无阻尼自然频率「test/yiwen_img/importSubject/2034803620800761856.png」成反比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363789", "t": 3, "q": "二阶系统的峰值时间tp随无阻尼自然频率ωn的增大而减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "二阶系统峰值时间公式为「test/yiwen_img/importSubject/2034803623791300608.png」（「test/yiwen_img/importSubject/2034803623883575296.png」为有阻尼自然频率，「test/yiwen_img/importSubject/2034803617759891456.png」 ），可看出「test/yiwen_img/importSubject/2034803623963267072.png」与「test/yiwen_img/importSubject/2034803620800761856.png」成反比，所以「test/yiwen_img/importSubject/2034803620800761856.png」增大，「test/yiwen_img/importSubject/2034803623963267072.png」减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363790", "t": 3, "q": "二阶系统的无阻尼自然频率ωn由系统的结构和参数共同决定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "二阶系统的无阻尼自然频率ωn的表达式与系统的结构（如传递函数形式）和所包含的参数（如弹簧刚度、质量等）相关，所以它由系统结构和参数共同决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363791", "t": 3, "q": "二阶系统的无阻尼自然频率ωn越大，系统的响应速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在二阶系统中，无阻尼自然频率ωn反映了系统响应的快速性，ωn越大，系统响应越快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363792", "t": 3, "q": "二阶系统的谐振峰值Mr存在的条件是阻尼比ζ>√2/2（≈0.707）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二阶系统谐振峰值Mr存在的条件是0 < ζ < √2/2 ，而不是ζ>√2/2。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363793", "t": 3, "q": "二阶系统的阻尼比ζ越大，系统的振荡性越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二阶系统阻尼比ζ越大，系统振荡性越弱，当ζ≥1时系统无振荡。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363794", "t": 3, "q": "非最小相位系统的奈奎斯特判据应用方法与最小相位系统相同，只需确定开环右半s平面极点个数P和包围次数N。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "非最小相位系统奈奎斯特判据应用时，除确定开环右半 s 平面极点个数 P 和包围次数 N 外，还需考虑系统的非最小相位特性等情况，与最小相位系统应用方法不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363795", "t": 3, "q": "幅值裕度是开环频率特性在相角穿越频率ωg处的幅值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "幅值裕度是开环频率特性在相角穿越频率ωg处幅值的倒数。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363796", "t": 3, "q": "幅值裕度越小，系统的相对稳定性越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "幅值裕度是衡量系统相对稳定性的指标，幅值裕度越大，系统越不容易进入不稳定状态，相对稳定性越好，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363797", "t": 3, "q": "幅值裕度Kg=10时，对应的幅值裕度dB值为20dB。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "幅值裕度dB值是「test/yiwen_img/importSubject/2034803624047153152.png」，当「test/yiwen_img/importSubject/2034803624143622144.png」时，「test/yiwen_img/importSubject/2034803624265256960.png」dB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363798", "t": 3, "q": "幅值裕度Kg>1（Kg(dB)>0）表示系统在相角穿越频率ωg处的开环幅值小于1。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363799", "t": 3, "q": "惯性环节的幅频特性在高频段（ω>>1/T）时，幅值趋近于0，相角趋近于-90°。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "惯性环节传递函数为「test/yiwen_img/importSubject/2034803623166349312.png」，其幅频特性「test/yiwen_img/importSubject/2034803624365920256.png」，当「test/yiwen_img/importSubject/2034803624474972160.png」即「test/yiwen_img/importSubject/2034803624563052544.png」时，「test/yiwen_img/importSubject/2034803624672104448.png」趋近于0；相频特性「test/yiwen_img/importSubject/2034803624802127872.png」，当「test/yiwen_img/importSubject/2034803624474972160.png」时，「test/yiwen_img/importSubject/2034803624953122816.png」趋近于 - 90°。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363800", "t": 3, "q": "惯性环节的阶跃输入下，输出按指数规律趋于稳态值，无超调。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "惯性环节的传递函数为「test/yiwen_img/importSubject/2034803625037008896.png」，在阶跃输入下其输出响应是按指数规律变化，最终趋于稳态值，且无超调。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363801", "t": 3, "q": "惯性环节的时间常数T越大，其阶跃响应达到稳态值的时间越长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "惯性环节阶跃响应达到稳态的时间与时间常数T相关，T越大，响应速度越慢，达到稳态值时间就越长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363802", "t": 3, "q": "积分环节的传递函数为G（　）=1/Ts（T>0）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363803", "t": 3, "q": "积分环节的阶跃输入下，输出随时间线性增长，无稳态值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "积分环节输出是输入信号的积分，阶跃输入积分后输出与时间成正比，会随时间线性增长，不会稳定到一个固定值，即无稳态值。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363804", "t": 3, "q": "间隙特性满足描述函数法的奇对称性要求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "描述函数法要求非线性特性具有奇对称性，间隙特性不满足奇对称性。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363805", "t": 3, "q": "开环对数幅频特性的低频段斜率由系统的开环增益决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在控制工程中，开环对数幅频特性（伯德图）的低频段渐近线斜率由系统的积分环节或微分环节的个数（即<br />系统的“型\"或“无差度”ν)决定，而不是由开环增益决定。<br />·低频段的斜率：为-20νdB/dec(ν为积分环节个数)。<br />·开环增益的作用：开环增益决定的是低频段渐近线（或其延长线）的高度（位置），而不是斜率。<br />因此，题干说“低频段斜率由开环增益决定”是错误的。", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363806", "t": 3, "q": "开环对数幅频特性的中频段斜率通常为-40dB/dec，以保证系统有足够的相角裕度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开环对数幅频特性的中频段（通常指穿越频率Wc附近的区段）对系统的动态性能和稳定性起着决定性作用。<br />为了保证系统具有足够的相角裕度、良好的动态平稳性以及较好的抗干扰能力，中频段通常期望以-20dB/dec的斜率穿过0dB线，并且该斜率占据一定的频率宽度。<br />如果中频段斜率为-40dB/dec(对应两个积分/惯性环节叠加)，相角会迅速下降，导致相角裕度变小，系统动态响应容易出现严重的振荡甚至不稳定。因此，中频段通常应避免采用-40dB/dec的斜率，题干表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363807", "t": 3, "q": "开环控制系统存在反馈回路。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开环控制系统的特点是不存在反馈回路，有反馈回路的是闭环控制系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363808", "t": 3, "q": "开环频率特性G(jω)H(jω)在ω→∞时，相角趋近于-90°×n（n为系统开环阶次）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363809", "t": 3, "q": "开环系统的右半s平面极点个数P=2，奈奎斯特曲线逆时针包围(-1,j0)点2次（N=2），则闭环系统稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据奈奎斯特稳定判据，闭环系统稳定的条件是N = -P。本题中P = 2，N = 2，不满足N = -P，所以闭环系统不稳定。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363810", "t": 3, "q": "劳斯阵列出现全零行时，辅助多项式的次数为奇数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "劳斯阵列出现全零行时，辅助多项式的次数为偶数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363811", "t": 3, "q": "劳斯阵列出现全零行时，辅助多项式的根是系统的不稳定极点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "劳斯阵列出现全零行时，辅助多项式的根是系统的共轭虚极点或实部为零的重极点，不一定是不稳定极点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363812", "t": 3, "q": "离散系统的闭环极点z=-0.8，对应的暂态响应项为正负交替的衰减序列。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离散系统闭环极点z的实部为负且|z|<1时，暂态响应是正负交替的衰减序列，z = -0.8满足条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363813", "t": 3, "q": "离散系统的闭环极点z=0.9，对应的暂态响应项为衰减序列。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离散系统中，当闭环极点的模小于1时，对应的暂态响应项为衰减序列，极点z = 0.9，其模|0.9|＜1。", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363814", "t": 3, "q": "离散系统的采样周期T越小，系统越接近连续系统，稳定性越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般来说，离散系统采样周期T越小，系统越接近连续系统，但采样周期过小可能引入高频噪声等问题，不一定稳定性就越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363815", "t": 3, "q": "离散系统稳定的充要条件是闭环所有极点均位于z平面的单位圆内。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在离散系统中，闭环系统稳定的充要条件就是其闭环所有极点都在z平面的单位圆内。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363816", "t": 3, "q": "离散系统中，采样定理要求采样频率fs≥2fm（fm为信号最高频率），以避免混叠。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在离散系统里，采样定理明确规定采样频率fs需大于等于信号最高频率fm的2倍，这样才能防止信号频谱混叠。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363817", "t": 3, "q": "离散系统中，采样周期T的选择仅需满足采样定理（fs≥2fm），与系统动态性能无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然采样定理要求采样频率fs≥2fm ，但采样周期T的选择并非仅由采样定理决定，还和系统动态性能有关。如果T选得过大，会影响系统动态性能，使系统控制质量下降甚至不稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363818", "t": 3, "q": "离散系统中，单位阶跃序列1(n)的z变换为z/(z-1)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据z变换定义和常用序列z变换公式，单位阶跃序列1(n)的z变换就是z/(z - 1) ，|z|>1。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363819", "t": 3, "q": "离散系统中，若闭环极点位于z平面的单位圆上且为单极点，系统临界稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在离散系统里，当闭环极点位于z平面单位圆上且为单极点时，系统响应会维持等幅振荡，符合临界稳定的定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363820", "t": 3, "q": "离散系统中，应用z变换终值定理求稳态误差时，无需考虑系统的稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。应用z变换终值定理求离散系统稳态误差时，必须要保证系统是稳定的，只有稳定系统求稳态误差才有意义。若不考虑稳定性直接用终值定理，可能得出错误结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363821", "t": 3, "q": "理想继电特性（无死区，输出幅值K）的描述函数N(A)与输入幅值A成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "理想继电特性的描述函数 「test/yiwen_img/importSubject/2034803625179615232.png」，其与输入幅值 A 成反比，并非成正比。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363822", "t": 3, "q": "利用劳斯判据分析三阶系统s³+2s²+3s+4=0时，系统稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803634348363823", "t": 3, "q": "利用劳斯判据分析三阶系统s³+3s²-2s+1=0时，该系统稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "劳斯判据中，系统稳定的必要条件是特征方程各项系数均大于零。此三阶系统特征方程s³ + 3s² - 2s + 1 = 0中s一次项系数为-2<0，不满足稳定必要条件，所以系统不稳定。答案为错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 自动控制理论（2）", "n": "基础练习题【含解析】 / 第1章 自动控制理论（2）", "qs": [{"id": "2034803646205661184", "t": 1, "q": "某二阶系统的阻尼比ζ=0.5，无阻尼自然频率ωn=10rad/s，其阶跃响应的超调量σ%约为", "a": ["30.9%", "25.4%", "4.3%", "16.3%", "", ""], "r": "A", "e": "二阶系统超调量公式为「test/yiwen_img/importSubject/2034803639624798208.png」，将「test/yiwen_img/importSubject/2034803639876456448.png」代入可得结果。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661185", "t": 1, "q": "某二阶系统阶跃响应的超调量σ%=25%，调节时间ts（±5%）=0.5s，其无阻尼自然频率ωn约为", "a": ["20rad/s", "15rad/s", "5rad/s", "10rad/s", "", ""], "r": "D", "e": "超调量和调节时间与无阻尼自然频率、阻尼比有关，根据超调量公式可先求阻尼比，再结合调节时间公式求出无阻尼自然频率。本题已知超调量σ%=25%，可算出阻尼比，再由调节时间ts（±5%）=0.5s和调节时间公式求出ωn约为10rad/s。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661186", "t": 1, "q": "某三阶系统的闭环极点为s1=-2，s2=-1+j√3，s3=-1-j√3，该系统的主导极点是", "a": ["s1=-2", "s2和s3", "无主导极点", "三个极点都是", "", ""], "r": "B", "e": "主导极点是距离虚轴最近且附近无零点的极点。s2=-1 + j√3和s3=-1 - j√3距离虚轴的距离为1，s1=-2距离虚轴距离为2，s2和s3离虚轴更近，为该系统的主导极点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661187", "t": 1, "q": "某系统的闭环传递函数为Φ（　）=10/(s²+6s+10)，该系统的相角裕度γ约为", "a": ["30°", "60°", "45°", "75°", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661188", "t": 1, "q": "某系统的开环传递函数为G（　）=10/(s²(1+0.1s))，该系统对单位阶跃输入的稳态误差ess为", "a": ["无穷大", "10", "0", "常数", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661189", "t": 1, "q": "某系统的开环传递函数为G（　）=K/(s(1+0.5s)(1+s))，其开环对数幅频特性的低频段斜率为", "a": ["-20dB/dec", "-40dB/dec", "-60dB/dec", "0dB/dec", "", ""], "r": "A", "e": "对于开环传递函数，低频段斜率取决于开环传递函数中积分环节的个数。开环传递函数「test/yiwen_img/importSubject/2034803640010674176.png」中有1个积分环节，积分环节个数为1时，低频段斜率是-20dB/dec。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661190", "t": 1, "q": "某系统的开环传递函数为G（　）=K/(s(1+s)(1+2s))，若系统的幅值裕度Kg=10dB，则对应的|G(jωg)|为", "a": ["3.16", "0.1", "1", "0.316", "", ""], "r": "A", "e": "这是一道关于控制系统分析的问题，具体涉及开环传递函数和幅值裕度的计算。首先，我们来简要解析题目中的关键信息。题目给出了一个系统的开环传递函数G(s) = K / (s(1+s)(1+2s))，并告知系统的幅值裕度Kg=10dB。幅值裕度是控制系统分析中的一个重要指标，它表示系统在特定频率下（通常是穿越频率或截止频率）的幅值与1的比值，以分贝(dB)为单位表示。题目要求我们找出对应的|G(jωg)|的值。在控制系统分析中，幅值裕度Kg与|G(jωg)|的关系可以通过以下数学公式表示：Kg = 20 * log10(|G(jωg)|)，其中log10是以10为底的对数函数。这个公式允许我们从已知的幅值裕度计算出|G(jωg)|的值。现在，我们来应用这个公式解决问题。已知Kg=10dB，我们可以将其代入上述公式，得到：10 = 20 * log10(|G(jωg)|)。解这个方程，我们可以找到|G(jωg)|的值。简单计算后，我们发现|G(jωg)|等于 3.162（约等于3.16，因为通常我们会进行四舍五入到小数点后两位）。这是对应于10dB幅值裕度的|G(jωg)|的值。综上所述，根据题目给出的条件和控制系统分析的相关知识，我们可以确定对应的|G(jωg)|的值为3.16。所以，正确答案是A.3.16。", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661191", "t": 1, "q": "某系统的开环传递函数为G（　）H（　）=K/(s²(0.1s+1))，该系统的型别是", "a": ["III型", "I型", "II型", "0型", "", ""], "r": "C", "e": "系统型别由开环传递函数中积分环节个数决定，此函数分母有s²，即有2个积分环节。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661192", "t": 1, "q": "某系统的开环对数幅频特性的截止频率ωc1=10rad/s，相角裕度γ1=30°;校正后ωc2=5rad/s，γ2=60°，该校正类型可能是", "a": ["滞后校正", "比例校正", "超前校正", "滞后-超前校正", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661193", "t": 1, "q": "某系统的开环对数幅频特性在低频段的延长线过(1,20dB)点，该系统的开环增益K为", "a": ["10", "100", "1", "0.1", "", ""], "r": "A", "e": "对于开环对数幅频特性，低频段延长线过(1, 20lgK)点。已知过(1, 20dB)点，即20lgK = 20，可得K = 10。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661194", "t": 1, "q": "某系统的开环对数幅频特性在截止频率ωc处的幅值为0dB，相角为-150°，则该系统的相角裕度γ为", "a": ["30°", "150°", "180°", "60°", "", ""], "r": "A", "e": "相角裕度γ = 180° + φ(ωc) ，已知相角φ(ωc)= -150°，代入可得γ = 180° + (-150°) = 30°。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661195", "t": 1, "q": "某自动控制系统中，环节的传递函数为G（　）=1/(Ts)（T>0），该环节阶跃输入下的输出特性是", "a": ["输出瞬时达到输入幅值的1/T倍并保持", "输出先快速上升，后趋于稳定值1/T", "输出随时间线性增长，增长速率为1/T", "输出随时间按指数规律逐渐增加至稳态值", "", ""], "r": "D", "e": "这是一道关于自动控制系统中环节传递函数特性的问题。给定的传递函数是 G(s) = 1/(Ts)，其中 T > 0。这是一个典型的惯性环节传递函数。1. 传递函数解读： G(s) = 1/(Ts) 表示一个惯性环节，其中 T 是时间常数。 惯性环节的特点是输出响应随时间按指数规律逐渐增加至稳态值。2. 选项分析： A选项：输出瞬时达到输入幅值的1/T倍并保持。这是错误的，因为惯性环节的输出不可能瞬时达到稳态值。 B选项：输出先快速上升，后趋于稳定值1/T。这是错误的描述，因为稳定值不是1/T，而是输入信号的幅值。 C选项：输出随时间线性增长，增长速率为1/T。这是错误的，因为惯性环节的输出是按指数规律增长的，而不是线性增长。 D选项：输出随时间按指数规律逐渐增加至稳态值。这是正确的描述，符合惯性环节的特性。综上所述，D选项正确描述了该惯性环节在阶跃输入下的输出特性。所以，正确答案是D选项：“输出随时间按指数规律逐渐增加至稳态值”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661196", "t": 1, "q": "某最小相位系统的开环对数幅频特性在低频段的斜率为-20dB/dec，且延长线过(1,0)点，该系统的开环传递函数类型是", "a": ["III型系统", "I型系统", "0型系统", "II型系统", "", ""], "r": "B", "e": "这是一道关于控制系统分类的问题。首先，我们需要理解最小相位系统的开环对数幅频特性及其与系统类型的关系。1. 开环对数幅频特性斜率： 在低频段，-20dB/dec的斜率通常对应于I型系统。这是因为I型系统在低频段有一个-20dB/dec的斜率，这是由其积分环节（即1/s）决定的。2. 延长线过(1,0)点： 这一点进一步确认了系统的类型。对于I型系统，其开环对数幅频特性曲线在低频段延长线会通过(1,0)点。综合以上两点，我们可以确定该系统的开环传递函数类型为I型系统。所以，正确答案是B.I型系统。", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661197", "t": 1, "q": "奈奎斯特判据适用于分析哪种系统的稳定性", "a": ["时变系统", "离散系统", "非线性系统", "线性定常系统", "", ""], "r": "D", "e": "奈奎斯特判据是基于频率特性来判断系统稳定性的方法，它主要针对线性定常系统。时变系统、离散系统和非线性系统有各自不同的稳定性分析方法。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661198", "t": 1, "q": "奈奎斯特判据中，开环频率特性G(jω)H(jω)的轨迹包围(-1,j0)点的方向，逆时针为", "a": ["零", "负", "无法确定", "正", "", ""], "r": "D", "e": "在奈奎斯特判据中，开环频率特性G(jω)H(jω)的轨迹包围(-1,j0)点的方向，逆时针为正。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661199", "t": 1, "q": "奈奎斯特判据中，开环频率特性G(jω)H(jω)的轨迹是从", "a": ["ω=∞到ω=0", "ω=0到ω=∞，再关于实轴对称到ω=-∞", "ω=0到ω→∞", "ω=-∞到ω→∞", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661200", "t": 1, "q": "奈奎斯特判据中，开环频率特性G(jω)H(jω)的轨迹与负实轴交点处的相角为", "a": ["0°", "-90°", "-270°", "-180°", "", ""], "r": "D", "e": "奈奎斯特判据里，开环频率特性G(jω)H(jω)轨迹与负实轴交点处相角是 -180°。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661201", "t": 1, "q": "奈奎斯特判据中，开环频率特性G(jω)H(jω)的轨迹与虚轴交点处的频率为", "a": ["幅值穿越频率ωc", "谐振频率ωr", "截止频率ωc", "相角穿越频率ωg", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661202", "t": 1, "q": "奈奎斯特判据中，若开环系统稳定（P=0），且开环频率特性G(jω)H(jω)不包围(-1,j0)点，则闭环系统", "a": ["无法判断", "临界稳定", "稳定", "不稳定", "", ""], "r": "C", "e": "奈奎斯特判据中，当开环系统稳定即P = 0时，闭环系统稳定的充要条件是开环频率特性G(jω)H(jω)不包围(-1,j0)点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661203", "t": 1, "q": "奈奎斯特判据中，若开环系统有1个右半s平面极点（P=1），且开环频率特性G(jω)H(jω)顺时针包围(-1,j0)点1次（N=-1），则闭环系统右半s平面极点个数Z为", "a": ["-1", "0", "1", "2", "", ""], "r": "B", "e": "根据奈奎斯特判据公式Z = P + N，已知P = 1，N = -1，代入可得Z = 1 + (-1) = 0。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661204", "t": 1, "q": "奈奎斯特判据中，若开环系统有2个右半s平面极点（P=2），且开环频率特性G(jω)H(jω)逆时针包围(-1,j0)点2次（N=2），则闭环系统右半s平面极点个数Z为", "a": ["-2", "2", "0", "4", "", ""], "r": "C", "e": "根据奈奎斯特判据公式Z = P - N，已知P = 2，N = 2，则Z=2 - 2 = 0。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661205", "t": 1, "q": "奈奎斯特曲线中，开环频率特性G(jω)H(jω)从ω=0到ω→∞的轨迹与负实轴的交点处，对应的频率是", "a": ["相角穿越频率ωg", "截止频率ωc", "谐振频率ωr", "幅值穿越频率ωc", "", ""], "r": "A", "e": "相角穿越频率是开环频率特性相角为 -180°时的频率，此时轨迹与负实轴相交。截止频率是闭环幅频特性下降到零频值的 0.707 倍时对应的频率；谐振频率是闭环幅频特性出现峰值时的频率。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661206", "t": 1, "q": "系统校正时，若原系统稳态误差过大，但相角裕度满足要求，应优先选择", "a": ["滞后校正", "超前校正", "超前-滞后校正", "微分校正", "", ""], "r": "A", "e": "原系统稳态误差大需提高低频增益，相角裕度满足要求不用大幅改变相角。滞后校正可提高低频增益且对相角影响小。所以选A。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661207", "t": 1, "q": "系统校正时，若原系统相角裕度不足，但稳态精度满足要求，应优先选择", "a": ["超前校正", "滞后校正", "比例-积分校正", "比例-微分校正", "", ""], "r": "A", "e": "原系统相角裕度不足，需增加相角裕度，超前校正可增加系统的相角裕度，且稳态精度已满足要求，适合用超前校正。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661208", "t": 1, "q": "系统校正中，超前校正装置的主要作用是", "a": ["增加系统的相角裕度，提高稳定性", "减小系统的阻尼比，增强振荡性", "降低系统的截止频率ωc", "提高系统的稳态精度", "", ""], "r": "A", "e": "超前校正装置可提供正相角，增加系统相角裕度，进而提高系统稳定性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661209", "t": 1, "q": "下列典型环节中，传递函数为G（　）=K*e^(-τs)（K为常数，τ>0）的是", "a": ["微分环节", "积分环节", "比例环节", "延迟环节", "", ""], "r": "D", "e": "传递函数「test/yiwen_img/importSubject/2034803640102948864.png」是延迟环节的典型形式，其中K是比例系数，「test/yiwen_img/importSubject/2034803640228777984.png」是延迟时间。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661210", "t": 1, "q": "下列典型环节中，传递函数为G（　）=K/(Ts+1)（T>0）的是", "a": ["积分环节", "惯性环节", "比例环节", "微分环节", "", ""], "r": "B", "e": "该传递函数是惯性环节的标准形式。积分环节传递函数是1/s ，比例环节是K ，微分环节是s 。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661211", "t": 1, "q": "下列典型环节中，输出对输入的变化率敏感的是", "a": ["比例环节", "积分环节", "惯性环节", "微分环节", "", ""], "r": "D", "e": "微分环节的输出与输入的变化率成正比，所以输出对输入的变化率敏感。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661212", "t": 1, "q": "下列典型环节中，属于动态环节的是", "a": ["比例环节", "以上都是", "积分环节", "延迟环节", "", ""], "r": "C", "e": "动态环节输出会随时间变化而变化。比例环节输出与输入成固定比例，无动态特性；积分环节输出是输入对时间的积分，随时间变化，是动态环节；延迟环节输出是输入延迟一定时间后的结果，也是动态环节。答案选C，C和D都为动态环节，但题目要求单选，积分环节是典型动态环节代表。 答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661213", "t": 1, "q": "下列非线性特性中，不满足描述函数法奇对称性要求的是", "a": ["死区特性", "理想继电特性（无死区）", "饱和特性", "间隙特性", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661214", "t": 1, "q": "下列关于自动控制系统\"反馈\"的说法，正确的是", "a": ["正反馈有利于提高系统稳定性", "开环系统必然存在反馈", "反馈仅存在于离散系统中", "负反馈可减小系统的稳态误差", "", ""], "r": "D", "e": "正反馈会使系统偏离目标，不利于系统稳定，A错；开环系统无反馈，B错；反馈在连续和离散系统都存在，C错；负反馈能纠正偏差，减小系统稳态误差。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661215", "t": 1, "q": "下列关于自动控制系统\"扰动\"的说法，正确的是", "a": ["闭环系统无法抑制扰动的影响", "扰动会导致系统输出偏离期望值", "扰动的频率越高，对系统输出的影响越大", "扰动仅作用于系统的输入端", "", ""], "r": "B", "e": "扰动会破坏系统平衡，使输出偏离期望值；闭环系统可在一定程度抑制扰动；扰动影响大小和频率无必然联系；扰动可在系统多个位置作用。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661216", "t": 1, "q": "下列哪种情况会导致线性定常系统出现临界稳定", "a": ["系统闭环极点全部位于左半s平面", "开环频率特性G(jω)H(jω)恰好经过(-1,j0)点", "描述函数N(A)与-1/G(jω)无交点", "劳斯阵列第一列有且仅有一个零元素", "", ""], "r": "B", "e": "开环频率特性G(jω)H(jω)恰好经过(-1,j0)点时，系统处于临界稳定状态。A选项系统闭环极点全在左半s平面是稳定状态；C选项描述函数N(A)与 -1/G(jω)无交点是系统稳定；D选项劳斯阵列第一列有且仅有一个零元素需进一步分析，不一定是临界稳定。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661217", "t": 1, "q": "下列校正方法中，能同时提高系统的相角裕度和稳态精度的是", "a": ["滞后-超前校正", "超前校正", "比例校正", "滞后校正", "", ""], "r": "A", "e": "这是一道关于控制系统校正方法的选择题。在控制系统中，不同的校正方法会对系统的相角裕度和稳态精度产生不同的影响。首先，我们简要介绍题目中涉及的几种校正方法：* 滞后-超前校正：结合了滞后校正和超前校正的特点，能在提高系统稳定性的同时，改善系统的动态性能。* 超前校正：主要用来提高系统的相角裕度，但对稳态精度的改善有限。* 比例校正：主要用于调整系统的增益，对相角裕度和稳态精度的直接影响较小。* 滞后校正：主要用于提高系统的稳态精度，但对相角裕度的改善有限。接下来，我们分析题目要求：找出能同时提高系统的相角裕度和稳态精度的校正方法。* A选项（滞后-超前校正）：由于结合了滞后和超前的特点，既能提高相角裕度又能改善稳态精度，符合题目要求。* B选项（超前校正）：主要提高相角裕度，不符合稳态精度的要求。* C选项（比例校正）：对相角裕度和稳态精度的直接影响较小，不符合题目要求。* D选项（滞后校正）：主要提高稳态精度，不符合相角裕度的要求。综上所述，A选项（滞后-超前校正）是唯一能同时满足题目要求的校正方法。所以，正确答案是A：“滞后-超前校正”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661218", "t": 1, "q": "下列校正装置中，属于积分校正的是", "a": ["Gc（　）=1/(T1s)", "Gc（　）=(1+T1s)/(1+T2s)（T1>T2）", "Gc（　）=1+T1s", "Gc（　）=(1+T1s)/(1+T2s)（T2>T1）", "", ""], "r": "A", "e": "积分校正的传递函数形式为「test/yiwen_img/importSubject/2034803640329441280.png」。选项A符合该形式。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661219", "t": 1, "q": "下列信号中，属于典型输入信号且能反映系统跟踪匀速变化输入能力的是", "a": ["单位阶跃信号", "单位斜坡信号", "单位抛物线信号", "单位脉冲信号", "", ""], "r": "B", "e": "单位斜坡信号的变化率是常数，能反映系统跟踪匀速变化输入的能力。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661220", "t": 1, "q": "线性定常系统的传递函数分母多项式的根称为", "a": ["零点", "特征根", "闭环极点", "极点", "", ""], "r": "D", "e": "线性定常系统传递函数分母多项式的根是使传递函数趋于无穷大的点，被定义为极点。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661221", "t": 1, "q": "线性定常系统的传递函数仅取决于", "a": ["系统的初始条件", "系统的输出信号类型", "系统的结构和参数", "系统的输入信号类型", "", ""], "r": "C", "e": "传递函数是描述线性定常系统动态特性的一种数学模型，它只与系统的结构和参数有关，与初始条件、输入输出信号类型无关。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661222", "t": 1, "q": "线性定常系统的单位阶跃响应c(t)与单位脉冲响应g(t)的关系是", "a": ["c(t)是g(t)的导数", "g(t)是c(t)的积分", "g(t)是c(t)的导数", "c(t)是g(t)的积分", "", ""], "r": "D", "e": "根据线性定常系统单位阶跃响应和单位脉冲响应关系，单位阶跃响应是单位脉冲响应的积分。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661223", "t": 1, "q": "线性定常系统的单位脉冲响应g(t)与传递函数G（　）的关系是", "a": ["g(t)是G（　）的z变换", "G（　）是g(t)的z变换", "g(t)是G（　）的拉普拉斯逆变换", "G（　）是g(t)的拉普拉斯变换", "", ""], "r": "D", "e": "根据线性定常系统的性质，传递函数是单位脉冲响应的拉普拉斯变换。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661224", "t": 1, "q": "线性定常系统的稳定性仅取决于", "a": ["系统的输入信号", "系统的输出信号", "系统的初始条件", "系统闭环极点的位置", "", ""], "r": "D", "e": "线性定常系统稳定性由系统本身特性决定，与输入、输出及初始条件无关，而闭环极点位置决定系统稳定性。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661225", "t": 1, "q": "线性系统的叠加原理适用于", "a": ["系统的稳态响应", "系统的任意响应", "系统的零状态响应", "系统的零输入响应", "", ""], "r": "B", "e": "线性系统的叠加原理是指，对于线性系统，当输入信号是多个信号的叠加时，系统的输出也是这些信号单独作用时输出的叠加。这一原理适用于系统的任意响应，因为线性系统的特性不随时间变化，且满足叠加性和齐次性。选项分析：A. 系统的稳态响应：仅描述了系统在长时间后的状态，不全面。B. 系统的任意响应：正确，因为线性叠加原理适用于系统的所有响应。C. 系统的零状态响应：仅描述了系统在没有初始条件时的响应，不全面。D. 系统的零输入响应：仅描述了系统在没有外部输入时的响应，不全面。综上所述，正确答案是B选项：“系统的任意响应”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661226", "t": 1, "q": "线性系统的频率特性是指系统对哪种输入信号的稳态响应", "a": ["单位阶跃信号", "正弦信号", "单位斜坡信号", "单位脉冲信号", "", ""], "r": "B", "e": "线性系统的频率特性是系统对正弦输入信号的稳态响应特性。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661227", "t": 1, "q": "在时域指标中，反映系统响应快速性的指标是", "a": ["峰值时间tp", "超调量σ%", "稳态误差ess", "调节时间ts", "", ""], "r": "A", "e": "这是一道关于控制系统时域指标的理解题。在控制系统中，不同的时域指标反映了系统的不同性能特点。首先，我们简要概述各个选项代表的含义：A. 峰值时间tp：指系统响应达到第一个峰值所需的时间。它主要反映了系统响应的快速性，即系统从起始状态到达最大响应值所需的时间。B. 超调量σ%：表示系统响应超过其稳态值的最大偏离程度。它更多地反映了系统的稳定性而非快速性。C. 稳态误差ess：指系统在稳态时输出的期望值与实际值之间的差。这主要反映了系统的准确度，与快速性无直接关联。D. 调节时间ts：指系统响应从起始状态到达并保持在稳态值的一定范围内（通常是±2%或±5%）所需的最短时间。它综合反映了系统的稳定性、快速性和准确性，但并非单纯反映快速性。综上所述，要反映系统响应的快速性，最直接的指标是峰值时间tp，因为它直接衡量了系统从起始到达最大响应值的速度。所以，正确答案是A选项：“峰值时间tp”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661228", "t": 1, "q": "滞后校正装置的传递函数为Gc（　）=(1+T1s)/(1+T2s)（T2>T1>0），其对数幅频特性的特点是", "a": ["全频段幅值均不变", "低频段幅值衰减，中高频段幅值不变", "低频段幅值不变，中高频段幅值衰减", "全频段幅值均衰减", "", ""], "r": "C", "e": "滞后校正装置的传递函数为 「test/yiwen_img/importSubject/2034803640434298880.png」 （其中 「test/yiwen_img/importSubject/2034803640534962176.png」）。其对数幅频特性（Bode图）的特点可以通过分析传递函数的频率响应来确定。1. 低频段：当频率 「test/yiwen_img/importSubject/2034803640639819776.png」 时，传递函数近似为 「test/yiwen_img/importSubject/2034803640711122944.png」，即低频段的幅值不变。2. 高频段：当频率 「test/yiwen_img/importSubject/2034803640799203328.png」 时，传递函数近似为 「test/yiwen_img/importSubject/2034803640916643840.png」，由于 「test/yiwen_img/importSubject/2034803641096998912.png」，所以高频段的幅值会衰减。3. 中频段：在中频段，传递函数的幅值会从低频段的1逐渐过渡到高频段的 「test/yiwen_img/importSubject/2034803641214439424.png」，呈现出衰减的趋势。综上所述，滞后校正装置的对数幅频特性特点是低频段幅值不变，中高频段幅值衰减。所以，正确答案是C选项：“低频段幅值不变，中高频段幅值衰减”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661229", "t": 1, "q": "自动控制系统中，“闭环控制”的核心特征是", "a": ["系统有反馈回路，利用偏差调节输出", "系统输出与输入无关", "系统无反馈回路", "系统输出仅由输入决定", "", ""], "r": "A", "e": "闭环控制区别于开环控制的关键就是有反馈回路，能利用偏差来调节输出。B选项输出与输入无关错误；C选项无反馈回路是开环特征；D选项仅由输入决定也是开环特点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661230", "t": 1, "q": "自动控制系统中，\"动态响应\"是指系统在输入作用下，输出从", "a": ["初始状态到零的变化过程", "初始状态到稳态的变化过程", "任意状态到任意状态的变化过程", "稳态到初始状态的变化过程", "", ""], "r": "B", "e": "动态响应是研究系统在输入作用下，输出从初始状态达到稳态的变化过程。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661231", "t": 1, "q": "自动控制系统中，\"稳态误差\"是指系统在输入作用下，输出的", "a": ["初始值与输入的稳态值之差", "稳态值与输入的稳态值之差", "初始值与稳态值之差", "瞬时值与稳态值之差", "", ""], "r": "B", "e": "稳态误差是衡量系统控制精度的指标，指系统达到稳态后，输出的稳态值与输入的稳态值的差值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803646205661232", "t": 1, "q": "自动控制系统中，\"无静差系统\"是指系统对哪种输入信号的稳态误差为零", "a": ["单位阶跃信号", "单位脉冲信号", "所有输入信号", "特定类型的输入信号", "", ""], "r": "D", "e": "“无静差系统”并非对所有输入信号稳态误差为零，而是对特定类型输入信号稳态误差为零。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856832", "t": 2, "q": "下列关于幅值裕度的说法，正确的有", "a": ["幅值裕度Kg是开环相角为-180°时，开环幅值的倒数", "幅值裕度越小，系统的相对稳定性越好", "Kg(dB)=20lgKg", "Kg>1（Kg(dB)>0）表示系统在相角穿越频率处幅值小于1", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856833", "t": 2, "q": "下列关于开环对数幅频特性（波特图）的说法，正确的有", "a": ["波特图的叠加性适用于多个环节串联的系统", "低频段斜率由系统型别决定（-20v dB/dec，v为积分环节个数）", "高频段斜率主要受系统中最高阶次项的影响", "中频段斜率通常为-20dB/dec，并且该段包含了截止频率ωc", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856834", "t": 2, "q": "下列关于开环频率特性的说法，正确的有", "a": ["开环相频特性反映系统对不同频率输入的相位滞后能力", "最小相位系统的开环幅频特性与相频特性一一对应", "非最小相位系统的开环幅频特性与相频特性也是一一对应的", "开环幅频特性反映系统对不同频率输入信号的幅值放大或衰减程度", "", ""], "r": "ABD", "e": "A选项，开环相频特性体现系统对不同频率输入的相位滞后情况；B选项，最小相位系统中开环幅频和相频特性存在一一对应关系；D选项，开环幅频特性反映对不同频率输入信号幅值的放大或衰减程度。而C选项，非最小相位系统开环幅频与相频特性并非一一对应。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856835", "t": 2, "q": "下列关于离散系统稳态误差的说法，正确的有", "a": ["开环增益越大，稳态误差越小（同型别系统）", "系统型别越高，稳态误差越小", "单位抛物线输入的稳态误差与Ka有关", "单位阶跃输入的稳态误差与Kp有关", "", ""], "r": "ABCD", "e": "同型别系统，开环增益越大稳态误差越小；系统型别越高对特定输入稳态误差越小；单位抛物线输入稳态误差与加速度误差系数Ka有关；单位阶跃输入稳态误差与位置误差系数Kp有关。ABCD选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856836", "t": 2, "q": "下列关于离散系统z变换的说法，正确的有", "a": ["线性离散系统的z变换满足叠加定理", "z变换的收敛域与系统的稳定性无关", "z变换是拉普拉斯变换的离散形式", "单位脉冲序列的z变换为1", "", ""], "r": "ACD", "e": "线性离散系统z变换满足叠加定理；z变换收敛域与系统稳定性有关；z变换是拉普拉斯变换在离散系统的推广形式；单位脉冲序列的z变换为1。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856837", "t": 2, "q": "下列关于奈奎斯特判据的应用，正确的有", "a": ["可判断系统是否存在自激振荡", "需绘制开环频率特性的奈奎斯特曲线", "适用于线性定常系统", "需知道开环右半s平面极点个数P", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856838", "t": 2, "q": "下列关于奈奎斯特判据中\"包围次数N\"的说法，正确的有", "a": ["N与开环系统的极点位置无关", "逆时针包围次数记为正，顺时针记为负", "N=逆时针包围次数-顺时针包围次数", "N是开环频率特性G(jω)H(jω)绕(-1,j0)点的净包围次数", "", ""], "r": "BCD", "e": "奈奎斯特判据里，N是开环频率特性G(jω)H(jω)绕(-1,j0)点的净包围次数，逆时针包围次数记为正，顺时针记为负，N等于逆时针包围次数减去顺时针包围次数，且N与开环系统极点位置有关。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856839", "t": 2, "q": "下列关于奈奎斯特判据中\"开环右半极点个数P\"的说法，正确的有", "a": ["P=0表示开环系统稳定", "P>0表示开环系统不稳定", "P的数值可通过求解开环特征方程G（　）H（　）=0的根确定", "P是开环传递函数G（　）H（　）在右半s平面的极点个数", "", ""], "r": "CD", "e": "开环右半极点个数P指开环传递函数在右半s平面的极点个数，可通过求解开环特征方程根确定，P = 0不能直接说明开环系统稳定，P>0也不能简单说开环系统不稳定。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856840", "t": 2, "q": "下列关于奈奎斯特曲线的绘制，正确的有", "a": ["ω从0到∞的奈奎斯特曲线与ω从-∞到0的奈奎斯特曲线关于实轴对称", "奈奎斯特曲线是ω从-∞到+∞时，G(jω)H(jω)在复平面上的轨迹", "绘制奈奎斯特曲线需计算不同ω下G(jω)H(jω)的幅值和相角", "奈奎斯特曲线的起点（ω→0+）由系统型别和开环增益决定", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856841", "t": 2, "q": "下列关于奈奎斯特曲线的说法，正确的有", "a": ["最小相位系统的奈奎斯特曲线与非最小相位系统的奈奎斯特曲线形状可能不同", "开环增益增大时，奈奎斯特曲线整体向外扩张", "奈奎斯特曲线关于实轴对称（ω从-∞到∞）", "奈奎斯特曲线与负实轴的交点对应相角为-180°", "", ""], "r": "ABCD", "e": "A选项，最小与非最小相位系统特性不同，曲线形状可能不同；B选项，开环增益增大，幅值增大，曲线整体向外扩张；C选项，奈奎斯特曲线（ω从 -∞到∞）关于实轴对称；D选项，奈奎斯特曲线与负实轴交点相角是 -180°。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856842", "t": 2, "q": "下列关于奈奎斯特曲线与系统稳定性的关系，正确的有", "a": ["开环稳定（P=0），奈奎斯特曲线包围(-1,j0)点1圈（N=1），系统不稳定（Z=1）", "开环不稳定（P=2），奈奎斯特曲线包围(-1,j0)点1圈（N=1），系统稳定（Z=1）", "开环稳定（P=0），奈奎斯特曲线不包围(-1,j0)点（N=0），系统稳定", "开环不稳定（P=1），奈奎斯特曲线包围(-1,j0)点1圈（N=1），系统稳定（Z=0）", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856843", "t": 2, "q": "下列关于系统校正的目的，正确的有", "a": ["使系统结构更复杂", "使系统满足稳态性能要求（如稳态误差）", "使系统满足动态性能要求（如超调量、调节时间）", "使系统满足稳定性要求", "", ""], "r": "BCD", "e": "系统校正目的是改善系统性能，让系统满足稳定性、稳态和动态性能等要求，而非让系统结构更复杂。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856844", "t": 2, "q": "下列关于系统校正的说法，正确的有", "a": ["校正装置通常串联或并联在系统中", "串联校正通常接在控制器与被控对象之间", "校正装置的设计需结合系统的性能指标要求", "并联校正通常接在系统的局部反馈回路中", "", ""], "r": "ABCD", "e": "校正装置在系统中常见串联或并联方式；串联校正一般接在控制器与被控对象间；设计校正装置要依据系统性能指标；并联校正常接在局部反馈回路。ABCD说法均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856845", "t": 2, "q": "下列关于系统校正的说法，正确的有", "a": ["滞后-超前校正可同时改善系统的稳定性和稳态精度", "超前校正可提高系统的相角裕度", "滞后校正可提高系统的稳态精度", "比例校正主要用于调整系统的开环增益，对相角裕度影响较小", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856846", "t": 2, "q": "下列关于相角裕度与幅值裕度的说法，正确的有", "a": ["最小相位系统中，相角裕度γ>0且幅值裕度Kg>1时，系统稳定", "仅用相角裕度或幅值裕度可能无法全面判断系统稳定性", "相角裕度越小，系统的相对稳定性越好", "相角裕度和幅值裕度均为衡量系统相对稳定性的指标", "", ""], "r": "ABD", "e": "最小相位系统稳定要求相角裕度γ>0且幅值裕度Kg>1，A正确；相角裕度和幅值裕度需结合判断系统稳定性，仅用其一可能无法全面判断，B正确；相角裕度越大系统相对稳定性越好，C错误；二者都是衡量系统相对稳定性指标，D正确。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856847", "t": 2, "q": "下列属于动态环节的典型环节有", "a": ["惯性环节", "微分环节", "积分环节", "比例环节", "", ""], "r": "ABC", "e": "动态环节的典型环节有惯性、微分、积分等环节，比例环节输出与输入成比例关系，无动态特性。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856848", "t": 2, "q": "下列属于自动控制系统典型输入信号的有", "a": ["单位斜坡信号", "单位抛物线信号", "正弦信号", "单位阶跃信号", "", ""], "r": "ABCD", "e": "自动控制系统典型输入信号有单位阶跃信号、单位斜坡信号、单位抛物线信号、正弦信号等。ABCD选项均符合。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856849", "t": 2, "q": "下列属于自动控制系统基本组成部分的有", "a": ["反馈环节", "被控对象", "输入信号", "控制器", "", ""], "r": "ABD", "e": "自动控制系统基本组成包括被控对象、控制器、反馈环节等。输入信号是系统的作用量，并非基本组成部分。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856850", "t": 2, "q": "下列校正方法中，能提高系统稳态精度的有", "a": ["增大开环增益", "超前校正", "增加积分环节（如PI校正）", "滞后校正", "", ""], "r": "AC", "e": "这是一道关于控制系统校正方法对稳态精度影响的问题。在控制系统中，不同的校正方法会对系统的稳定性、响应速度和稳态精度产生不同的影响。首先，我们简要分析各个选项对系统稳态精度的影响：A. 增大开环增益：开环增益的增大可以提高系统的稳态精度。因为增益的增加会使得系统对输入信号的响应更加敏感，从而减小稳态误差。B. 超前校正：超前校正主要是用来改善系统的动态性能，如减小超调量和加快响应速度。它并不直接提高系统的稳态精度。C. 增加积分环节（如PI校正）：积分环节可以消除系统的稳态误差，从而提高稳态精度。PI校正中的积分部分能够对误差进行累积，使得系统在稳态时能够精确跟踪输入信号。D. 滞后校正：滞后校正主要用于改善系统的稳定性和抑制噪声干扰，对稳态精度的直接影响有限。综上所述，能提高系统稳态精度的方法包括增大开环增益（A）和增加积分环节（C）。所以，正确答案是AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856851", "t": 2, "q": "下列校正装置中，传递函数含有积分环节的有", "a": ["PD校正（比例-微分）", "PID校正（比例-积分-微分）", "滞后校正", "PI校正（比例-积分）", "", ""], "r": "BD", "e": "积分环节传递函数形式为1/s。PID校正和PI校正传递函数中包含积分项，有积分环节；PD校正无积分环节；滞后校正虽有类似积分作用，但传递函数无标准积分环节形式。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856852", "t": 2, "q": "下列校正装置中，能降低系统截止频率ωc的有", "a": ["积分校正（PI校正）", "超前校正", "滞后校正", "滞后-超前校正的滞后部分", "", ""], "r": "CD", "e": "积分校正会使系统稳定性变差，不直接影响截止频率；超前校正提高截止频率；滞后校正主要作用是改善稳态性能，会降低系统截止频率；滞后 - 超前校正的滞后部分也会降低截止频率。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856853", "t": 2, "q": "下列校正装置中，能提高系统相角裕度的有", "a": ["比例-积分校正（PI校正）", "超前校正", "比例-微分校正（PD校正）", "滞后-超前校正", "", ""], "r": "BCD", "e": "PI校正会使系统相角裕度减小；超前校正、PD校正和滞后 - 超前校正都能增加系统的相角裕度。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856854", "t": 2, "q": "下列校正装置中，属于滞后校正或具有滞后校正特性的有", "a": ["Gc（　）=(1+0.1s)/(1+0.05s)", "Gc（　）=(1+5s)/(1+20s)", "Gc（　）=(1+3s)/(1+10s)", "Gc（　）=s/(1+0.5s)", "", ""], "r": "BC", "e": "滞后校正的传递函数形式为「test/yiwen_img/importSubject/2034803641310908416.png」（「test/yiwen_img/importSubject/2034803641445126144.png」）。选项B中「test/yiwen_img/importSubject/2034803641562566656.png」，「test/yiwen_img/importSubject/2034803641675812864.png」；选项C中「test/yiwen_img/importSubject/2034803641759698944.png」，「test/yiwen_img/importSubject/2034803641847779328.png」，符合滞后校正形式。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856855", "t": 2, "q": "线性定常系统的传递函数具有的性质有", "a": ["与系统输入信号类型无关", "仅由系统结构和参数决定", "与系统初始条件无关", "分母多项式的次数等于系统阶次", "", ""], "r": "ABCD", "e": "传递函数是零初始条件下系统输出拉氏变换与输入拉氏变换之比，它仅取决于系统结构和参数，与输入信号类型、初始条件无关，且分母多项式次数等于系统阶次。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856856", "t": 2, "q": "线性定常系统的传递函数零点的作用包括", "a": ["改变系统的稳定性", "改变系统的稳态误差", "改变系统的超调量和调节时间", "改变系统的单位脉冲响应的幅值和相位", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856857", "t": 2, "q": "线性定常系统的传递函数零点影响", "a": ["系统的稳定性", "系统的单位脉冲响应", "系统的稳态性能", "系统的动态性能", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856858", "t": 2, "q": "线性定常系统的单位脉冲响应g(t)的特点包括", "a": ["g(t)的积分等于系统的单位阶跃响应c(t)", "g(t)是系统对单位脉冲输入δ(t)的零状态响应", "g(t)反映系统的动态特性", "g(t)的拉普拉斯变换等于系统的传递函数G（　）", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856859", "t": 2, "q": "线性定常系统的动态性能指标包括", "a": ["峰值时间tp", "稳态误差ess", "调节时间ts", "超调量σ%", "", ""], "r": "ACD", "e": "峰值时间、调节时间和超调量是衡量线性定常系统动态响应快速性和稳定性的动态性能指标，而稳态误差是衡量系统稳态精度的稳态性能指标。答案为ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856860", "t": 2, "q": "线性定常系统的频率特性包括", "a": ["相频特性", "幅频特性", "对数频率特性", "幅相特性", "", ""], "r": "ABCD", "e": "线性定常系统频率特性有幅频特性（描述输出与输入幅值比随频率变化）、相频特性（描述输出与输入相位差随频率变化）、幅相特性（将幅频和相频结合以复数形式表示）、对数频率特性（用对数坐标表示幅频和相频）。ABCD选项都属于线性定常系统的频率特性。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856861", "t": 2, "q": "线性定常系统的频率特性与传递函数的关系包括", "a": ["传递函数是频率特性的复变函数推广", "频率特性G(jω)是传递函数G（　）在s=jω处的取值", "G(jω)=G（　）|s=jω", "频率特性是传递函数的频域表示", "", ""], "r": "BCD", "e": "线性定常系统中，频率特性是传递函数在s = jω时的特殊情况，即频率特性G(jω)是传递函数G(s)在s = jω处的取值，可表示为G(jω)=G(s)|s=jω ，频率特性是传递函数在频域的表示形式。答案为BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856862", "t": 2, "q": "线性定常系统的频率特性G(jω)具有的性质包括", "a": ["G(jω)是ω的复函数", "G(jω)的相频特性是ω的奇函数", "若系统为最小相位系统，G(jω)的幅频特性与相频特性一一对应", "G(jω)的幅频特性是ω的偶函数", "", ""], "r": "ABCD", "e": "线性定常系统频率特性G(jω)是ω的复函数，幅频特性是ω的偶函数，相频特性是ω的奇函数，最小相位系统中幅频特性与相频特性一一对应。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856863", "t": 2, "q": "线性定常系统的稳定性与下列哪些因素无关", "a": ["系统的输入信号类型", "系统的初始条件", "系统的闭环极点位置", "系统的开环增益", "", ""], "r": "AB", "e": "线性定常系统稳定性由系统自身结构和参数决定，与输入信号类型和初始条件无关。闭环极点位置和开环增益会影响系统稳定性。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856864", "t": 2, "q": "线性定常系统的稳态误差与下列哪些因素有关", "a": ["系统的阻尼比", "系统的开环增益", "系统的型别", "输入信号的类型", "", ""], "r": "BCD", "e": "线性定常系统稳态误差与系统开环增益、型别以及输入信号类型有关，阻尼比主要影响系统动态性能，与稳态误差无关。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856865", "t": 2, "q": "线性定常系统稳定的充要条件包括", "a": ["劳斯阵列第一列所有元素均为正", "闭环系统所有极点均位于左半s平面", "奈奎斯特曲线不包围(-1,j0)点（开环稳定时）", "开环系统所有极点均位于左半s平面", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856866", "t": 2, "q": "自动控制系统的基本要求包括", "a": ["系统要能抑制外部扰动", "系统的稳态误差要小", "系统要稳定", "系统的动态响应要快速、平稳", "", ""], "r": "ABCD", "e": "自动控制系统基本要求可概括为稳、准、快。“稳”指系统要稳定，这是系统正常工作的基础；“准”要求系统的稳态误差要小，保证控制精度；“快”表示系统的动态响应要快速、平稳，能及时跟踪输入变化。同时，系统也需要具备抑制外部扰动的能力。ABCD选项均符合自动控制系统基本要求。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856867", "t": 2, "q": "自动控制系统中，被控量是指", "a": ["输入信号对应的物理量", "反馈环节测量的物理量", "系统需要控制的物理量", "系统的输出量", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856868", "t": 2, "q": "自动控制系统中，反馈环节的作用包括", "a": ["将被控量转换为与输入信号同类型的信号", "将反馈信号送回输入端与输入信号比较", "测量被控量", "直接调节被控量", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856869", "t": 2, "q": "自动控制系统中，负反馈的作用包括", "a": ["增大系统增益", "提高系统稳定性", "抑制扰动影响", "减小稳态误差", "", ""], "r": "BCD", "e": "负反馈可提高系统稳定性、抑制扰动影响、减小稳态误差，但会减小系统增益。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856870", "t": 2, "q": "自动控制系统中，开环控制与闭环控制的区别在于", "a": ["开环控制抗干扰能力弱，闭环控制抗干扰能力强", "开环控制精度低，闭环控制精度高", "开环控制结构简单，闭环控制结构复杂", "开环控制无反馈环节，闭环控制有反馈环节",
