降低锅炉出力）：这是锅炉侧的调整策略，而不是汽轮机侧。\t* B选项（减小调门开度，减少蒸汽流量）：当主蒸汽压力过高时，汽轮机侧可以通过减小调门开度来减少进入汽轮机的蒸汽流量，从而降低蒸汽压力，使其回到设定值。这是一个合理的调整策略。\t* C选项（增大燃料量，提高锅炉出力）：这会增加蒸汽压力，与题目要求相反。\t* D选项（增大调门开度，增加蒸汽流量）：这同样会增加蒸汽压力，不符合题目要求。综上所述，为了降低过高的主蒸汽压力，在“机跟炉”模式下，汽轮机侧应采取的策略是减小调门开度，减少蒸汽流量。所以，正确答案是B选项：“减小调门开度，减少蒸汽流量”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360579", "t": 1, "q": "系统辨识中，“递推最小二乘法”的递推公式中，新参数估计值与旧参数估计值、新数据的关系是?", "a": ["新参数估计值=旧参数估计值+新数据带来的修正项", "新参数估计值仅依赖旧参数，与新数据无关", "新参数估计值=旧参数估计值-新数据带来的修正项", "新参数估计值仅依赖新数据，与旧参数无关", "", ""], "r": "A", "e": "递推最小二乘法的核心就是在已有参数估计基础上，结合新数据进行修正得到新的参数估计值，新参数估计值等于旧参数估计值加上新数据带来的修正项。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360580", "t": 1, "q": "系统辨识中，“可观测性”是判断系统能否辨识的重要依据，下列关于可观测性的说法正确的是?", "a": ["线性系统一定可观测", "可观测性与模型结构无关", "可观测性仅与系统的输入信号有关", "若系统所有状态均可通过输出信号间接反映，则系统可观测", "", ""], "r": "D", "e": "可观测性指系统所有状态能否通过输出信号间接反映，若能则系统可观测。线性系统不一定都可观测，可观测性与模型结构和系统状态等有关，并非仅和输入信号有关。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360581", "t": 1, "q": "系统辨识中，\"模型参数估计\"的结果是否可靠，主要取决于?", "a": ["计算设备的运算速度", "模型结构的正确性和输入输出数据的质量", "输入信号的幅值大小", "模型阶数的高低", "", ""], "r": "B", "e": "模型参数估计可靠与否，关键在于模型结构是否正确以及输入输出数据质量如何。若模型结构不对，估计结果必然不准；数据质量差，也会影响估计可靠性。而计算设备运算速度、输入信号幅值大小、模型阶数高低并非主要决定因素。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360582", "t": 1, "q": "系统辨识中，\"模型降阶\"常用的方法是?", "a": ["仅保留模型的稳态项，删除动态项", "基于误差准则（如最小二乘误差）简化模型，保证精度", "直接删除模型中的高阶项，无需验证", "将模型参数全部置零", "", ""], "r": "B", "e": "模型降阶要在保证一定精度的前提下简化模型，基于误差准则（如最小二乘误差）简化模型可实现这一目的。A仅保留稳态项删除动态项会损失很多信息；C直接删高阶项不验证可能导致精度严重下降；D将参数全置零就没有模型了。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360583", "t": 1, "q": "系统辨识中，“模型降阶”的主要目的是?", "a": ["提高模型的复杂度，以反映系统所有细节", "在保证精度的前提下，简化模型，降低仿真计算量", "消除模型中的纯延迟环节", "将非线性模型转化为线性模型", "", ""], "r": "B", "e": "模型降阶是为了在保证一定精度时让模型更简单，减少仿真计算量。A选项提高复杂度与降阶目的相悖；C选项消除纯延迟环节不是降阶主要目的；D选项将非线性转线性也并非降阶主要意图。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360584", "t": 1, "q": "系统辨识中，\"模型结构误选\"（如将二阶系统选作一阶模型）会导致的后果是?", "a": ["模型参数无法估计", "模型精度降低，无法准确反映系统动态特性", "输入输出数据完全无法匹配", "模型仅在稳态时准确，动态时完全错误", "", ""], "r": "B", "e": "选的模型结构与实际系统不匹配，就不能很好地体现系统特性，会降低模型精度。而模型参数一般仍可估计，输入输出数据也不是完全无法匹配，也并非仅稳态准确动态完全错误。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360585", "t": 1, "q": "系统辨识中，“模型验证”阶段采用“残差分析”的核心目的是?", "a": ["调整输入信号的幅值", "计算模型参数的数值大小", "确定模型的阶数", "检验模型残差（实际输出-模型输出）是否为白噪声，判断模型是否充分", "", ""], "r": "D", "e": "残差分析主要是看模型残差是否为白噪声，若为白噪声说明模型能充分描述系统，反之则不充分。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360586", "t": 1, "q": "系统辨识中，“平稳随机过程”的输入输出数据是指数据的什么特性不随时间变化?", "a": ["相位关系", "均值和方差", "幅值大小", "频率成分", "", ""], "r": "B", "e": "平稳随机过程的重要特性是其均值和方差不随时间变化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360587", "t": 1, "q": "系统辨识中，“输入信号的持续激励条件”是指输入信号的频谱需覆盖系统的?", "a": ["所有可能的频率", "仅低频范围", "稳态频率范围", "动态频率范围（感兴趣频带）", "", ""], "r": "D", "e": "输入信号的持续激励条件要求其频谱覆盖系统动态频率范围（感兴趣频带），这样才能激励出系统的动态特性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360588", "t": 1, "q": "系统辨识中，“数据采集”阶段需保证输入输出数据的“同步性”，其主要目的是?", "a": ["简化数据预处理步骤", "使输入输出数据的幅值相同", "确保数据满足平稳性要求", "避免因数据不同步导致模型参数估计偏差", "", ""], "r": "D", "e": "数据采集时保证输入输出数据同步性，核心是为让模型能准确反映系统真实特性，若不同步会使模型参数估计出现偏差。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360589", "t": 1, "q": "系统辨识中，“数据预处理”阶段去除“趋势项”（如数据随时间缓慢漂移）的主要目的是?", "a": ["消除数据中的高频噪声", "使数据满足平稳性要求，避免影响模型参数估计", "减小数据的幅值范围", "将动态数据转化为稳态数据", "", ""], "r": "B", "e": "趋势项会使数据不平稳，影响模型参数估计，去除趋势项可让数据满足平稳性要求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360590", "t": 1, "q": "系统辨识中，\"线性定常系统\"的辨识与\"线性时变系统\"的辨识主要区别在于?", "a": ["线性时变系统无法辨识", "线性时变系统的参数随时间变化，需采用递推辨识方法实时更新参数", "线性定常系统的模型结构一定是一阶的", "线性定常系统无需输入输出数据", "", ""], "r": "B", "e": "线性定常系统参数不随时间变，线性时变系统参数随时间变化，所以其辨识需递推辨识方法实时更新参数。A选项线性时变系统可辨识；C选项线性定常系统模型结构不一定是一阶；D选项线性定常系统辨识也需要输入输出数据。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360591", "t": 1, "q": "系统辨识中，\"线性回归分析\"在参数估计中的应用前提是?", "a": ["输出信号必须是稳态信号", "输入信号必须是正弦信号", "模型必须是非线性的", "模型必须是线性的（对参数线性）", "", ""], "r": "D", "e": "线性回归分析是基于线性模型来估计参数的，只有模型对参数是线性的，才能运用线性回归分析方法。所以应用前提是模型必须是线性的（对参数线性）。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360592", "t": 1, "q": "系统辨识中，\"最小二乘法\"估计模型参数时，若输入信号存在噪声，会导致的结果是?", "a": ["参数估计结果完全错误，无法使用", "参数估计结果无偏差，但精度降低", "参数估计结果出现偏差，且精度降低", "仅影响输出数据，不影响参数估计", "", ""], "r": "C", "e": "输入信号有噪声时，会使参数估计受干扰，出现偏差且估计的精度也会降低。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360593", "t": 1, "q": "系统辨识中，\"最小二乘法\"是常用的参数估计方法，其核心思想是?", "a": ["使模型输出与实际输出的最大偏差最小", "使模型输出与实际输出的偏差平方和最小", "使模型参数的绝对值之和最小", "使输入信号与输出信号的相关性最大", "", ""], "r": "B", "e": "最小二乘法核心就是让模型输出和实际输出的偏差平方和达到最小。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360594", "t": 1, "q": "系统辨识中，采用\"交叉验证法\"验证模型精度的核心思路是?", "a": ["仅用输入数据验证模型的稳定性", "通过调整模型参数使验证误差为零", "用同一组数据反复训练和验证模型", "将数据分为训练集和测试集，用训练集建模，测试集验证", "", ""], "r": "D", "e": "交叉验证法核心是把数据划分，用训练集构建模型，测试集检验模型精度。A选项只提输入数据验证稳定性，不全面；B选项验证误差很难为零；C选项不是用同一组数据反复操作。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360595", "t": 1, "q": "系统辨识中，若采集的输出数据含较大随机噪声，下列预处理方法中最适合去除高频噪声的是?", "a": ["滑动平均滤波处理", "小波变换去噪", "数据归一化处理", "数据缺失值补全处理", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360596", "t": 1, "q": "系统辨识中，若采集的输入输出数据存在\"时滞\"（输入与输出数据不同步），预处理时应采取的措施是?", "a": ["直接删除时滞部分数据", "增大输入信号幅值，掩盖时滞影响", "更换辨识方法，无需处理数据", "通过互相关分析确定时滞大小，对数据进行同步校正", "", ""], "r": "D", "e": "当输入输出数据存在时滞，关键是要确定时滞大小并校正数据使其同步，互相关分析可实现这一目的。直接删数据会损失信息；增大输入幅值不能解决时滞问题；更换辨识方法不处理数据也无法解决时滞。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360597", "t": 1, "q": "系统辨识中，若采用\"递推最小二乘法\"，其相较于普通最小二乘法的优势是?", "a": ["估计精度更高，无误差", "无需输入输出数据即可估计参数", "可实时处理新采集的数据，更新模型参数", "仅适用于线性时变系统", "", ""], "r": "C", "e": "递推最小二乘法能随着新数据到来实时更新模型参数，这是其比普通最小二乘法的优势。A选项估计无误差错误；B选项需输入输出数据；D选项也适用于线性时不变系统。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360598", "t": 1, "q": "系统辨识中，若采用\"相关分析法\"辨识系统的频率特性，其核心是利用输入输出信号的?", "a": ["均值关系", "相位关系", "互相关函数", "幅值关系", "", ""], "r": "C", "e": "相关分析法辨识系统频率特性核心是利用输入输出信号的互相关函数。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360599", "t": 1, "q": "系统辨识中，若模型参数估计结果出现\"过拟合\"现象，其主要表现是?", "a": ["模型无法收敛到稳定参数值", "模型在训练集和测试集上误差均很大", "模型参数值均为零", "模型在训练集上误差小，在测试集上误差大", "", ""], "r": "D", "e": "过拟合是指模型对训练数据拟合得太好，在训练集上误差小，但对新数据（测试集）的泛化能力差，导致在测试集上误差大。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360600", "t": 1, "q": "系统辨识中，若输入信号为\"阶跃信号\"，其主要局限性是?", "a": ["仅能激励系统的低频特性，高频特性激励不足", "仅适用于非线性系统", "信号幅值无法调整", "无法激励系统的动态特性", "", ""], "r": "A", "e": "阶跃信号变化缓慢，高频分量少，所以主要局限性是仅能激励系统的低频特性，高频特性激励不足。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360601", "t": 1, "q": "系统辨识中，若输入信号为\"伪随机二进制序列（PRBS）\"，其主要优势是?", "a": ["仅包含单一频率成分，适合测试系统谐振特性", "频谱分布均匀，可在较宽频带内激励系统", "信号幅值固定，无需调整", "仅适用于稳态系统，不适用于动态系统", "", ""], "r": "B", "e": "伪随机二进制序列频谱分布均匀，能在较宽频带内激励系统，便于全面测试系统特性。A选项它非单一频率成分；C选项信号幅值并非固定无需调整；D选项它也适用于动态系统。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360602", "t": 1, "q": "在发电过程系统辨识中，关于\"模型结构选择\"环节，下列说法正确的是?", "a": ["模型结构仅需匹配系统阶数，无需考虑非线性特性", "需结合系统机理分析与辨识目的，选择适配的模型结构（如线性/非线性、阶数）", "选择高阶模型一定比低阶模型更能准确反映系统特性", "模型结构一旦确定，无需在后续验证中调整", "", ""], "r": "B", "e": "模型结构选择要综合多方面因素，需结合系统机理分析和辨识目的来确定，包含线性或非线性、阶数等。仅匹配阶数不管非线性特性不全面，高阶模型不一定更准确，模型结构确定后也可能因验证情况进行调整。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360603", "t": 1, "q": "在热工系统建模中，\"试验数据的长度\"需满足的条件是?", "a": ["与系统动态特性无关", "越短越好，避免数据冗余", "至少包含系统3-5个过渡过程的时间", "仅需包含稳态数据，无需动态数据", "", ""], "r": "C", "e": "热工系统建模中，试验数据长度要能充分反映系统动态特性，至少应包含系统3 - 5个过渡过程的时间，这样数据才具有代表性和可靠性。A选项数据长度与系统动态特性有关；B选项不是越短越好；D选项动态数据也很重要。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360604", "t": 1, "q": "在热工系统建模中，采用四阶龙格-库塔法计算时，若需提高仿真精度，在运算速度允许的情况下，优先采取的措施是?", "a": ["减小积分步长，增加计算点密度", "更换为一阶欧拉法，减少导数计算", "降低模型的阶数，简化计算", "增大积分步长，减少计算次数", "", ""], "r": "A", "e": "四阶龙格 - 库塔法中，减小积分步长、增加计算点密度能让计算更精确地逼近真实值从而提高仿真精度。B选项一阶欧拉法精度低于四阶龙格 - 库塔法；C选项降低模型阶数会降低模型复杂度但不一定提高精度；D选项增大积分步长会降低精度。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360605", "t": 1, "q": "在热工系统建模中，若采用\"白箱建模法\"（纯机理），其主要局限性是?", "a": ["需大量试验数据", "需详细了解系统内部机理，对复杂系统（如锅炉燃烧）难以完全掌握", "仅适用于动态系统，不适用于稳态系统", "建模精度过低", "", ""], "r": "B", "e": "“白箱建模法”依靠机理搭建模型，需要详细掌握系统内部机理，而复杂系统如锅炉燃烧难以完全掌握其机理。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360606", "t": 1, "q": "在热工系统建模中，若采用\"黑箱建模法\"，其建模的核心依据是?", "a": ["系统的稳态特性，忽略动态特性", "系统的内部物理/化学机理", "输入输出数据的统计关系，无需了解内部机理", "仅需输入数据，无需输出数据", "", ""], "r": "C", "e": "“黑箱建模法”不考虑系统内部结构和机理，主要依据输入输出数据的统计关系来建模。A选项只考虑稳态忽略动态不是黑箱建模核心；B选项依据内部机理是白箱建模；D选项建模需输入输出数据。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360607", "t": 1, "q": "在热工系统建模中，若采用\"灰箱建模法\"（机理+试验结合），其相较于纯机理建模的优势是?", "a": ["完全无需了解系统内部机理", "可利用试验数据修正机理模型中的未知参数，提高精度", "仅需少量试验数据，无需机理分析", "建模过程完全自动化，无需人工干预", "", ""], "r": "B", "e": "灰箱建模法是机理与试验结合，能利用试验数据对机理模型里未知参数进行修正从而提升精度；A选项完全无需了解系统内部机理错误；C选项仅需少量试验数据且无需机理分析不符合；D选项建模过程完全自动化也不对。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360608", "t": 1, "q": "在热工系统建模中，若采用\"机理分析法\"建立锅炉汽包水位模型，下列哪项物理定律是建模的核心依据?", "a": ["热力学第一定律（能量守恒）", "质量守恒定律（水位变化与进出水量差相关）", "欧姆定律（电压与电流关系）", "牛顿第二定律（力与加速度关系）", "", ""], "r": "B", "e": "锅炉汽包水位建模，关键在于水位变化由进出水量差决定，依据是质量守恒定律。A项能量守恒不直接对应水位建模；C项欧姆定律用于电学；D项牛顿第二定律用于力学。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360609", "t": 1, "q": "在热工系统建模中，若采用\"机理分析法\"建立汽轮机功率模型，下列哪项参数是模型的核心输入变量?", "a": ["汽包水位", "炉膛温度", "主蒸汽压力和汽轮机调门开度", "凝汽器真空度", "", ""], "r": "C", "e": "汽轮机功率主要受进入汽轮机蒸汽的情况影响，主蒸汽压力决定蒸汽能量，调门开度控制进入汽轮机的蒸汽量，二者是影响汽轮机功率的关键因素，是功率模型核心输入变量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360610", "t": 1, "q": "在热工系统建模中，若采用\"试验法\"（如阶跃试验）获取数据，试验时需保证的核心条件是?", "a": ["试验时间越短越好，避免影响机组正常运行", "仅改变一个输入参数，其他参数保持不变（单变量试验）", "同时改变多个输入参数，以快速获取多工况数据", "输入参数变化幅度越大越好，以突出系统响应", "", ""], "r": "B", "e": "在热工系统建模用试验法获取数据时，单变量试验能明确输入输出的因果关系，确保数据有效性和模型准确性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360611", "t": 1, "q": "在热工系统建模中，若采用\"试验法\"获取数据时，输入信号的幅值选择需遵循的原则是?", "a": ["幅值无需考虑安全，仅需激励系统", "幅值越大越好，以突出系统响应", "幅值越小越好，避免影响机组安全", "幅值需在机组安全运行范围内，且能有效激励系统动态特性", "", ""], "r": "D", "e": "试验法获取数据时，既要保证机组安全运行，所以输入信号幅值不能太大；又要能有效激励系统动态特性，幅值太小则无法达到该目的。答案为D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360612", "t": 1, "q": "在热工系统建模中，若模型验证时发现\"残差存在明显的周期性\"，说明什么问题?", "a": ["参数估计结果准确", "输入输出数据同步性好", "模型遗漏了系统的某些动态特性（如周期性扰动），需改进模型结构", "模型结构合适，精度较高", "", ""], "r": "C", "e": "残差有明显周期性，意味着当前模型不能很好地拟合数据，很可能是遗漏了系统的某些动态特性，像周期性扰动，所以需要改进模型结构。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360613", "t": 1, "q": "在热工系统建模中，若试验数据存在\"outliers\"（异常值，如传感器故障导致的跳变数据），预处理时应采取的措施是?", "a": ["通过统计方法（如3σ准则）识别并剔除或修正异常值", "忽略异常值，直接用于建模", "保留异常值，因可能反映系统特殊特性", "将异常值替换为相邻数据的平均值，无需验证", "", ""], "r": "A", "e": "异常值会对建模结果产生较大干扰，不能直接忽略或保留，B、C错误；把异常值简单替换为相邻数据平均值且不验证可能会引入新问题，D错误；应通过统计方法如3σ准则识别并合理剔除或修正异常值，A正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360614", "t": 1, "q": "在热工系统建模中，若系统模型为非线性，通常采用\"小偏差线性化\"方法处理，其适用条件是?", "a": ["系统工作点附近偏差较小，非线性特性可近似为线性", "无需确定工作点", "系统偏差可以任意大", "仅适用于一阶系统", "", ""], "r": "A", "e": "“小偏差线性化”是在系统工作点附近，当偏差较小时把非线性特性近似为线性。B选项需确定工作点；C选项偏差不能任意大；D选项并非仅适用于一阶系统。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360615", "t": 1, "q": "在数值积分法中，\"截断误差\"是指数值解与真实解之间的偏差，其产生的主要原因是?", "a": ["积分过程中对被积函数进行了近似（如泰勒展开截断）", "输入输出数据存在噪声", "计算设备的舍入误差", "模型结构错误", "", ""], "r": "A", "e": "截断误差主要是在数值计算时对函数进行近似处理导致的，像积分中对被积函数做泰勒展开截断等。B选项输入输出数据噪声产生的是测量误差；C选项计算设备舍入误差是舍入造成的；D选项模型结构错误与截断误差无关。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360616", "t": 1, "q": "在数值积分法中，\"龙格-库塔法\"的阶数通常指的是?", "a": ["截断误差的量级（如四阶龙格-库塔法截断误差为O(h^5)）", "数值积分过程中使用的被积函数导数的点数", "积分步长的调整次数", "对应的系统模型的阶数（如一阶、二阶）", "", ""], "r": "A", "e": "龙格 - 库塔法阶数指的是截断误差的量级，例如四阶龙格 - 库塔法截断误差为O(h^5) 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360617", "t": 1, "q": "在数值积分法中，\"龙格-库塔法\"相较于梯形法的主要优势是?", "a": ["仅适用于线性系统", "计算量更小", "精度更高（高阶龙格-库塔法截断误差量级更低）", "无需初始条件", "", ""], "r": "C", "e": "龙格 - 库塔法是一种高精度的数值积分方法，高阶龙格 - 库塔法截断误差量级更低，精度比梯形法高。它并非仅适用于线性系统，计算量通常比梯形法大，且需要初始条件。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360618", "t": 1, "q": "在数值积分法中，\"舍入误差\"是指由于计算设备的精度限制（如浮点数表示）导致的误差，下列说法正确的是?", "a": ["舍入误差可通过增大积分步长完全消除", "舍入误差在多次迭代计算后可能累积，影响仿真结果", "舍入误差仅存在于显式欧拉法，隐式欧拉法无舍入误差", "舍入误差与模型结构无关，因此无需考虑", "", ""], "r": "B", "e": "舍入误差因设备精度产生，会在多次迭代中累积从而影响结果。增大步长不能消除舍入误差；各种数值积分法都有舍入误差；舍入误差虽与模型结构关系不大，但会影响结果所以要考虑。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360619", "t": 1, "q": "在数值积分法中，\"四阶龙格-库塔法\"的计算过程中，通常需要计算几次被积函数的值?", "a": ["1次", "4次", "2次", "3次", "", ""], "r": "B", "e": "四阶龙格 - 库塔法在每次迭代计算中，需计算4次被积函数的值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360620", "t": 1, "q": "在数值积分法中，\"梯形法\"相较于欧拉法的主要改进是?", "a": ["仅适用于线性系统", "计算量更小", "无需初始条件", "利用区间两端的导数信息，提高积分精度", "", ""], "r": "D", "e": "梯形法利用了区间两端的导数信息，相比只利用区间一端导数信息的欧拉法，能提高积分精度。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360621", "t": 1, "q": "在数值积分法中，“显式欧拉法”的递推公式为x(t+h)=x(t)+h×f(t,x(t))，其中f(t,x(t))代表的是?", "a": ["积分步长", "被积函数的导数（dx/dt）", "系统的输入信号", "系统的输出信号", "", ""], "r": "B", "e": "显式欧拉法基于导数定义，f(t,x(t))对应被积函数的导数dx/dt 。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360622", "t": 1, "q": "在数值积分法中，\"隐式欧拉法\"相较于\"显式欧拉法\"的主要优势是?", "a": ["精度更高，截断误差量级更低", "稳定性更好，适用于刚性系统（快变与慢变过程共存）", "无需初始条件即可计算", "计算量更小，无需求解方程组", "", ""], "r": "B", "e": "显式欧拉法简单但稳定性差，隐式欧拉法通过迭代求解，虽然计算复杂，但稳定性更好，适合处理刚性系统。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360623", "t": 1, "q": "在数值积分法中，积分步长的选择需在\"精度\"和\"计算效率\"之间权衡，下列说法正确的是?", "a": ["步长与精度、计算效率均无关", "步长越大，精度越高，计算效率越低", "步长越小，精度越高，计算效率越高", "步长越小，精度越高，计算效率越低", "", ""], "r": "D", "e": "积分步长越小，对函数的逼近越精细，精度越高，但计算次数增多，计算效率降低。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360624", "t": 1, "q": "在数值积分法中，若采用\"变步长积分\"，其步长调整的依据通常是?", "a": ["系统模型的阶数", "前一步计算的误差（如误差超阈值则减小步长）", "输出信号的稳态值", "输入信号的幅值", "", ""], "r": "B", "e": "变步长积分是根据计算误差来调整步长的，当误差超过阈值时减小步长以提高计算精度。所以步长调整依据是前一步计算的误差。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360625", "t": 1, "q": "在数值积分法中，若系统为\"刚性系统\"（如锅炉汽水系统，快变与慢变过程共存），下列积分方法中最适合的是?", "a": ["梯形法", "隐式欧拉法", "显式欧拉法", "四阶显式龙格-库塔法", "", ""], "r": "B", "e": "刚性系统要求积分方法具有较好的稳定性。显式方法稳定性较差，显式欧拉法和四阶显式龙格 - 库塔法属于显式方法不合适；梯形法有一定局限性；隐式欧拉法稳定性好，适合刚性系统。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891072", "t": 2, "q": "系统辨识中，\"参数估计偏差\"的产生原因包括（　）", "a": ["输入输出数据不同步（时滞导致偏差）", "模型结构错误（如阶数误选）", "参数估计方法精度有限（实际方法存在精度限制）", "数据含噪声（噪声干扰估计）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891073", "t": 2, "q": "系统辨识中，\"残差分析\"的主要内容包括（　）", "a": ["仅计算残差的最大幅值，无需统计分析", "检验残差均值是否接近零（无系统偏差）", "检验残差与输入信号是否相关（若相关，模型遗漏输入影响）", "检验残差是否为白噪声（无未提取的系统特性）", "", ""], "r": "BCD", "e": "残差分析要从多方面进行，需检验残差均值是否接近零以判断有无系统偏差，检验残差与输入信号是否相关看是否遗漏输入影响，检验残差是否为白噪声确定有无未提取的系统特性，不是仅计算残差最大幅值。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891074", "t": 2, "q": "系统辨识中，“持续激励条件”的数学表达包括（　）", "a": ["输入信号的频谱在系统动态频带内非零", "输入信号为正弦波形，且频率覆盖了系统的动态频带", "输入信号的自相关矩阵非奇异（对线性系统）", "输入信号的能量随时间保持不变", "", ""], "r": "AC", "e": "持续激励条件确保系统输入信号能充分激发系统动态特性。A选项，输入信号频谱在系统动态频带内非零，可提供足够信息用于辨识；C选项，对线性系统，输入信号自相关矩阵非奇异能保证参数估计的可辨识性。B项输入信号不一定只能是正弦波；D项输入信号能量不一定要随时间保持不变。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891075", "t": 2, "q": "系统辨识中，\"递推最小二乘法\"的递推公式包括（　）", "a": ["参数估计更新（θ(k)=θ(k-1)+K(k)(y(k)-φ(k)^Tθ(k-1))）", "增益矩阵计算（K(k)=P(k-1)φ(k)/(1+φ(k)^T P(k-1)φ(k))）", "协方差矩阵更新（P(k)=(I-K(k)φ(k)^T)P(k-1)）", "仅需输入数据，无需输出数据（错误，需输出y(k)）", "", ""], "r": "ABC", "e": "递推最小二乘法的递推公式包含参数估计更新、增益矩阵计算和协方差矩阵更新等公式。A选项是参数估计更新公式，B选项是增益矩阵计算公式，C选项是协方差矩阵更新公式，而D选项表述错误。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891076", "t": 2, "q": "系统辨识中，\"递推最小二乘法\"的适用场景包括（　）", "a": ["数据量大且需分批处理（避免一次性存储所有数据）", "线性时变系统辨识（参数随时间缓慢变化，需递推更新）", "仅适用于离线辨识（无法处理实时数据）", "实时在线辨识（需持续更新模型参数，如机组变工况时）", "", ""], "r": "ABD", "e": "递推最小二乘法可避免一次性存储大量数据，适合数据量大且分批处理；能递推更新参数，适用于线性时变系统；还可实时更新模型参数，用于实时在线辨识。而它并非仅适用于离线辨识。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891077", "t": 2, "q": "系统辨识中，\"非线性系统辨识\"与\"线性系统辨识\"的区别包括（　）", "a": ["非线性参数估计需用非线性最小二乘法（迭代求解）", "两者无区别，可通用辨识方法", "非线性系统需选择非线性模型结构（如Volterra模型、神经网络）", "非线性系统辨识对数据量要求更高（需覆盖非线性特性）", "", ""], "r": "ACD", "e": "线性和非线性系统特性不同，不能通用辨识方法，B错误。非线性系统有自身特点，参数估计常用非线性最小二乘法迭代求解，要选非线性模型结构，且对数据量要求更高以覆盖非线性特性。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891078", "t": 2, "q": "系统辨识中，\"可辨识性\"的分类包括（　）", "a": ["设备可辨识性（基于设备型号判断，与模型无关）", "数据可辨识性（给定数据下，参数是否可估计）", "参数可辨识性（模型结构已知时，参数是否唯一确定）", "结构可辨识性（模型结构是否唯一，如阶数是否确定）", "", ""], "r": "BCD", "e": "系统辨识中可辨识性主要有结构可辨识性关注模型结构是否唯一，参数可辨识性指模型结构已知时参数能否唯一确定，数据可辨识性是在给定数据下参数能否估计。A选项设备可辨识性不属于系统辨识“可辨识性”分类。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891079", "t": 2, "q": "系统辨识中，\"可辨识性\"的判定条件包括（　）", "a": ["系统满足可控性和可观测性（线性定常系统）", "输入信号满足持续激励条件（频谱覆盖系统动态频带）", "输入输出数据无噪声干扰（含噪声则不可辨识）", "模型结构已知且正确（如选择与系统匹配的阶数和类型）", "", ""], "r": "ABD", "e": "可辨识性判定条件：线性定常系统需满足可控可观测；输入信号要满足持续激励条件；模型结构要已知且正确。实际中输入输出数据很难无噪声干扰，有噪声也可进行辨识。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891080", "t": 2, "q": "系统辨识中，“离线辨识”与“在线辨识”的区别包括（　）", "a": ["在线辨识无需参数估计", "离线辨识无需模型验证", "离线辨识: 数据采集后统一处理，适用于慢变系统", "在线辨识: 实时采集数据、更新模型，适用于时变系统", "", ""], "r": "CD", "e": "离线辨识是数据采集后统一处理，适合慢变系统；在线辨识是实时采集数据并更新模型，适用于时变系统。A选项在线辨识需要参数估计；B选项离线辨识需要模型验证。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891081", "t": 2, "q": "系统辨识中，\"模型过拟合\"的产生原因包括（　）", "a": ["训练数据量过少，无法反映系统真实特性", "模型阶数过高（如将一阶系统建模为三阶，过度拟合噪声）", "模型阶数过低（如将三阶系统建模为一阶，无法拟合特性）", "训练数据含大量噪声，模型误将噪声视为系统特性", "", ""], "r": "ABD", "e": "过拟合是指模型对训练数据拟合得过于精确，把噪声等也当作系统特性，通常是因训练数据少、模型阶数高、数据含大量噪声等导致。选项C模型阶数过低会导致欠拟合。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891082", "t": 2, "q": "系统辨识中，\"模型降阶\"的常用方法包括（　）", "a": ["最小二乘降阶法（使降阶模型与原模型的误差平方和最小）", "劳斯-赫尔维茨法（用于稳定性分析，非降阶）", "主导极点法（保留对动态影响大的极点，删除小极点）", "脉冲响应匹配法（使降阶模型与原模型脉冲响应接近）", "", ""], "r": "ACD", "e": "劳斯 - 赫尔维茨法主要用于系统稳定性分析，并非模型降阶方法；而最小二乘降阶法、主导极点法、脉冲响应匹配法都是常用的模型降阶方法。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891083", "t": 2, "q": "系统辨识中，\"模型结构选择\"的方法包括（　）", "a": ["随机选择法", "阶跃响应法", "信息准则法", "频率响应法", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891084", "t": 2, "q": "系统辨识中，\"模型外推性\"的含义包括（　）", "a": ["模型在试验工况范围内的精度", "外推性仅与模型阶数有关", "模型在试验工况范围外的精度（外推精度）", "外推性好: 工况变化时模型精度仍高", "", ""], "r": "CD", "e": "“模型外推性”重点强调的是模型在试验工况范围外的表现，也就是外推精度，且外推性好意味着工况变化时模型精度仍高。A选项说的是试验工况范围内精度，不符合；B选项外推性并非仅与模型阶数有关。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891085", "t": 2, "q": "系统辨识中，\"模型验证\"的常用方法包括（　）", "a": ["残差分析法（检验模型残差是否满足白噪声特性，判断模型充分性）", "交叉验证法（将数据分为训练集与测试集，验证模型泛化能力）", "使用独立验证集进行验证（通过未参与训练的数据评估模型性能）", "阶跃响应对比法（将模型阶跃响应与实际系统阶跃响应对比）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891086", "t": 2, "q": "系统辨识中，“输入信号选择”需遵循的原则包括（　）", "a": ["信号幅值越大越好，以突出系统响应", "信号幅值需在机组安全运行范围内（防参数超限）", "信号需满足持续激励条件（频谱覆盖系统动态频带）", "信号类型需适配辨识目的（如阶跃信号适用于慢变系统，PRBS适用于宽频系统）", "", ""], "r": "BCD", "e": "输入信号幅值不能越大越好，要在机组安全运行范围，同时要满足持续激励条件且信号类型适配辨识目的。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891087", "t": 2, "q": "系统辨识中，\"数据去趋势项\"的方法包括（　）", "a": ["多项式趋势去除（拟合高阶多项式并减去）", "线性趋势去除（如最小二乘法拟合线性趋势并减去）", "无需去趋势项，直接建模", "直接删除趋势项数据", "", ""], "r": "AB", "e": "数据去趋势项常用多项式趋势去除和线性趋势去除，C选项不处理趋势项不符合去趋势要求，D选项直接删除数据不合理。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891088", "t": 2, "q": "系统辨识中，\"数据同步性\"的重要性包括（　）", "a": ["同步性仅影响稳态数据，不影响动态数据", "若输入输出数据不同步，会导致模型参数估计偏差（如纯延迟误判）", "无需处理同步性，直接建模即可", "同步性差会使残差增大，模型验证不通过", "", ""], "r": "BD", "e": "这是一道关于系统辨识中“数据同步性”重要性的选择题。我们来简化并分析题目及其选项：首先，理解“数据同步性”的基本含义：在系统辨识过程中，数据同步性指的是输入数据与输出数据在时间上的对齐程度。这是确保准确建模的关键因素。现在，我们逐项审视（但不深入分析每个选项的细节）：A选项提到同步性“仅影响稳态数据”，这忽略了同步性对动态数据同样重要的可能性，因此可以排除。B选项指出“若输入输出数据不同步，会导致模型参数估计偏差”，这是正确的方向，因为不同步的数据确实会导致模型参数的不准确估计，特别是像纯延迟这样的关键参数。C选项声称“无需处理同步性，直接建模即可”，这明显错误，因为忽视数据同步性会严重影响建模的准确性。D选项说明“同步性差会使残差增大，模型验证不通过”，这也是正确的。残差是实际观测值与模型预测值之间的差距，如果数据同步性差，这个差距很可能会增大，导致模型验证失败。综上所述，B和D选项正确描述了数据同步性的重要性。所以，正确答案是BD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891089", "t": 2, "q": "系统辨识中，\"数据预处理\"的目的包括（　）", "a": ["提高数据质量，减少噪声、时滞、趋势项对辨识的影响", "简化模型结构，降低计算量", "使数据满足辨识方法要求（如平稳性、同步性）", "删除无效数据，保留有效信息", "", ""], "r": "ACD", "e": "数据预处理主要是对原始数据进行处理，提高其质量，让数据符合辨识要求并去除无效信息。A可减少干扰，C能满足方法要求，D能筛选信息，而简化模型结构并非数据预处理目的。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891090", "t": 2, "q": "系统辨识中，\"线性定常系统\"的辨识步骤包括（　）", "a": ["模型验证（交叉验证、残差分析）", "模型结构选择（确定阶数、有无纯延迟）", "数据采集与预处理（滤波、同步、去趋势项）", "参数估计（如最小二乘法估计传递函数参数）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891091", "t": 2, "q": "系统辨识中，\"信息准则法\"（AIC、BIC）的核心思想包括（　）", "a": ["精度越高、复杂度越低，准则函数值越小", "兼顾模型精度（残差小）和模型复杂度（参数少）", "仅追求复杂度低，不考虑精度", "仅追求精度，不考虑复杂度", "", ""], "r": "AB", "e": "信息准则法（AIC、BIC）的核心就是要平衡模型精度和复杂度。既要让模型能较好地拟合数据（残差小，精度高），又要使模型尽可能简单（参数少，复杂度低）。选项A体现了这种平衡下的准则函数特点；选项B直接说明了核心思想；选项C只追求复杂度低不符合；选项D只追求精度也不符合。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891092", "t": 2, "q": "系统辨识中，\"最小二乘法\"的局限性包括（　）", "a": ["无法用于非线性系统参数估计（需非线性最小二乘法）", "当数据量不足时，估计结果不唯一（多组参数满足偏差平方和最小）", "能够完全消除模型误差，使得估计精度无上限", "对输入数据噪声敏感，易导致参数估计偏差", "", ""], "r": "ABD", "e": "系统辨识中的“最小二乘法”是一种常用的参数估计方法，但它确实存在一些局限性。首先，我们来看选项A：“无法用于非线性系统参数估计”。这是正确的，因为标准的“最小二乘法”是基于线性模型的，对于非线性系统，需要采用“非线性最小二乘法”。接着是选项B：“当数据量不足时，估计结果不唯一”。这也是正确的。在数据量较少的情况下，可能存在多组参数都能使得偏差平方和达到最小，从而导致估计结果的不唯一性。然后是选项C：“能够完全消除模型误差，使得估计精度无上限”。这是不正确的。最小二乘法无法完全消除模型误差，估计精度总是受到数据质量、模型选择等多种因素的影响。最后是选项D：“对输入数据噪声敏感，易导致参数估计偏差”。这是正确的。最小二乘法对噪声比较敏感，噪声较大的情况下容易导致参数估计出现偏差。综上所述，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891093", "t": 2, "q": "系统辨识中，\"PRBS（伪随机二进制序列）\"作为输入信号的优势包括（　）", "a": ["仅含单一频率成分，适用于谐振特性测试", "信号幅值可控，易在安全范围内调整", "可重复生成，试验可复现", "频谱分布均匀，可在较宽频带内激励系统", "", ""], "r": "BCD", "e": "PRBS幅值可根据需要设置，能在安全范围内调整；可按特定规则重复生成，使试验可复现；频谱分布均匀，能在较宽频带内激励系统。它并非仅含单一频率成分。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891094", "t": 2, "q": "下列关于发电过程中\"纯延迟环节\"的说法正确的有（　）", "a": ["热工系统中，蒸汽、烟气的流动过程是产生纯延迟的主要原因之一", "纯延迟环节可通过增大数值积分步长消除", "纯延迟的大小（τ）可能受机组负荷、介质流速等工况影响", "纯延迟环节的输出与输入波形相同，仅在时间上滞后τ", "", ""], "r": "ACD", "e": "热工系统中蒸汽、烟气流动会产生纯延迟；纯延迟大小受机组负荷、介质流速等工况影响；纯延迟环节输出与输入波形相同只是时间滞后。而增大数值积分步长不能消除纯延迟环节。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891095", "t": 2, "q": "下列关于发电过程中\"一阶惯性环节\"的说法正确的有（　）", "a": ["单位阶跃响应无超调，单调趋近稳态值", "传递函数为1/(Ts+1)，其中T的单位为秒（时间量纲）", "可描述所有热工系统动态特性（如过热器温度、汽轮机转速）", "时间常数T越大，响应速度越慢（达到稳态时间越长）", "", ""], "r": "ABD", "e": "一阶惯性环节单位阶跃响应无超调，单调趋近稳态值；传递函数是1/(Ts + 1)，T是时间常数，单位为秒；它不能描述所有热工系统动态特性；时间常数T越大，响应越慢，达到稳态时间越长。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891096", "t": 2, "q": "下列属于发电过程中常见动态过程数学模型（如一阶惯性、二阶振荡）共同特性的有（　）", "a": ["多数模型可通过小偏差线性化方法处理非线性特性", "均需基于输入输出数据才能建立，无法通过机理分析建立", "模型参数（如T、ζ、ωn）在一定范围内可视为常数，但随工况变化可能会有所调整", "均包含动态特性（如惯性、振荡），可描述参数随时间的变化", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891097", "t": 2, "q": "在热工系统建模采用数值积分法时，下列关于\"隐式欧拉法\"的说法正确的有（　）", "a": ["截断误差量级与显式欧拉法相同（均为O(h)）", "稳定性优于显式欧拉法，适用于刚性系统", "计算过程中需求解非线性方程组（针对非线性模型）", "无需初始条件即可进行积分计算", "", ""], "r": "BC", "e": "1. 分析 对于隐式欧拉法： A选项：隐式欧拉法的截断误差量级为「test/yiwen_img/importSubject/2034803695128023040.png」，而显式欧拉法的截断误差量级为O(h)，所以A错误。 B选项：隐式欧拉法在稳定性方面优于显式欧拉法，并且更适合用于刚性系统的建模，这是因为它的稳定性好，B正确。 C选项：当热工系统模型是非线性模型时，在计算过程中，由于隐式欧拉法是隐式的迭代形式，所以需要求解非线性方程组，C正确。 D选项：任何数值积分方法都需要初始条件才能进行积分计算，隐式欧拉法也不例外，D错误。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891098", "t": 2, "q": "在热工系统建模中，\"多变量系统建模\"与\"单变量系统建模\"的区别包括（　）", "a": ["多变量系统需考虑输入间的耦合关系（如燃料量与送风量耦合）", "多变量系统模型结构更复杂（如状态空间模型、传递函数矩阵）", "两者无区别，可按单变量方法分别建模", "多变量系统辨识需多输入多输出数据（MIMO）", "", ""], "r": "ABD", "e": "多变量系统中输入间存在耦合关系、模型结构更为复杂，且辨识需多输入多输出数据，和单变量系统有明显差别。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891099", "t": 2, "q": "在热工系统建模中，\"黑箱建模法\"的局限性包括（　）", "a": ["无法解释系统内部机理（仅知输入输出关系）", "需大量试验数据，建模周期长", "模型外推性差（仅在试验工况范围内有效，变工况误差大）", "适用于所有热工系统，无局限性", "", ""], "r": "ABC", "e": "黑箱建模法通过输入输出关系建模，不知系统内部机理，需大量试验数据且建模久，模型仅在试验工况有效，变工况误差大。D选项说无局限性错误。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891100", "t": 2, "q": "在热工系统建模中，\"灰箱建模法\"（机理+试验结合）的实施步骤包括（　）", "a": ["基于物理机理建立初步模型（如质量守恒、能量守恒）", "利用参数估计方法（如最小二乘法）修正模型未知参数", "完全依赖试验数据，无需机理分析", "通过试验（如阶跃试验）采集输入输出数据", "", ""], "r": "ABD", "e": "灰箱建模法是机理与试验结合，C选项完全依赖试验数据、无需机理分析不符合。其步骤是先基于物理机理建初步模型，再通过试验采集数据，最后用参数估计方法修正未知参数，即ABD顺序。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891101", "t": 2, "q": "在热工系统建模中，\"机理分析法\"的优势包括（　）", "a": ["无需大量试验数据，建模周期短", "适用于所有热工系统，无误差", "模型外推性好（适用于多工况，变工况误差小）", "可解释系统内部物理/化学过程（知其然且知其所以然）", "", ""], "r": "ACD", "e": "答案：ACD\\", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891102", "t": 2, "q": "在热工系统建模中，\"试验法\"采集数据的注意事项包括（　）", "a": ["无需记录试验过程，仅需最终数据", "单变量试验（一次仅变一个输入，排除干扰）", "试验前需稳定工况（避免初始条件波动影响数据）", "试验工况覆盖机组常用负荷范围（保证模型适用性）", "", ""], "r": "BCD", "e": "试验法采集数据需记录试验过程，A错误；单变量试验可排除干扰，试验前稳定工况可避免初始条件影响，试验工况覆盖常用负荷范围能保证模型适用性，B、C、D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891103", "t": 2, "q": "在热工系统数值积分中，\"变步长积分\"的适用场景包括（　）", "a": ["刚性系统（快变与慢变共存，需调整步长）", "系统为稳态", "对精度和效率要求均高（需权衡）", "系统动态特性变化大（如启动、甩负荷工况）", "", ""], "r": "ACD", "e": "变步长积分可根据系统情况调整步长，刚性系统快变与慢变共存需调整步长，系统动态特性变化大时也需灵活调整步长，且能在对精度和效率要求均高时权衡。而系统稳态不需要变步长。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891104", "t": 2, "q": "在热工系统数值积分中，\"步长选择\"需考虑的因素包括（　）", "a": ["精度要求（精度高需小步长）", "计算效率（效率高需大步长，权衡精度）", "系统动态特性（快变系统需小步长，慢变可大步长）", "模型阶数（模型复杂度影响计算量，但与步长无直接关联）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891105", "t": 2, "q": "在热工系统数值积分中，\"定步长积分\"的适用场景包括（　）", "a": ["实时仿真系统", "系统为刚性系统", "系统动态特性平缓", "对计算效率要求不高，允许固定步长", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891106", "t": 2, "q": "在热工系统数值积分中，\"积分方法选择\"的依据包括（　）", "a": ["系统动态特性（刚性→隐式，慢变→显式）", "输入信号类型", "计算效率要求（高效率→显式/大步长，低效率→隐式/小步长）", "精度要求（高精度→高阶龙格-库塔，低精度→欧拉）", "", ""], "r": "ACD", "e": "热工系统数值积分中，积分方法选择要考虑系统动态特性，刚性系统适合隐式，慢变适合显式；要考虑计算效率，高效率选显式或大步长，低效率选隐式或小步长；还要考虑精度要求，高精度用高阶龙格 - 库塔，低精度用欧拉。输入信号类型并非主要依据。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891107", "t": 2, "q": "在热工系统数值积分中，\"截断误差\"的影响因素包括（　）", "a": ["输入信号的幅值", "积分步长", "系统模型的阶数", "积分方法的阶数", "", ""], "r": "BD", "e": "截断误差是用近似公式代替精确公式所产生的误差。在数值积分中，积分步长和积分方法阶数会影响截断误差，步长越小、积分方法阶数越高，截断误差通常越小。而输入信号幅值和系统模型阶数并非截断误差的直接影响因素。所以答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891108", "t": 2, "q": "在热工系统数值积分中，\"龙格-库塔法\"与\"欧拉法\"的区别包括（　）", "a": ["龙格-库塔法精度高（高阶）;欧拉法精度低（一阶）", "龙格-库塔法对步长敏感性低;欧拉法敏感性高", "龙格-库塔法计算量大;欧拉法计算量小", "龙格-库塔法和欧拉法均适用于线性和非线性问题", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891109", "t": 2, "q": "在热工系统数值积分中，\"欧拉法\"的两种形式（显式、隐式）的区别包括（　）", "a": ["显式欧拉法精度高于隐式欧拉法", "显式欧拉法计算简单，无需迭代;隐式欧拉法则由于非线性需要进行迭代", "显式欧拉法稳定性较差;隐式欧拉法稳定性较好", "显式欧拉法仅使用t时刻的导数来预测x(t+h);隐式欧拉法则需要用到t+h时刻的导数", "", ""], "r": "BCD", "e": "显式欧拉法计算简单无需迭代，用t时刻导数预测x(t + h)，稳定性差；隐式欧拉法因非线性需迭代，用t + h时刻导数，稳定性好，且隐式精度更高。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891110", "t": 2, "q": "在热工系统数值积分中，\"舍入误差\"的影响因素包括（　）", "a": ["迭代计算次数（次数多→误差累积大）", "系统模型的阶数", "计算设备的精度（精度低→舍入误差大）", "积分步长（步长小→迭代次数多→误差累积大）", "", ""], "r": "ACD", "e": "舍入误差与迭代次数、计算设备精度等有关。迭代次数多会使误差累积变大；计算设备精度低，舍入误差就大；积分步长小会使迭代次数增多，进而导致误差累积增大。而系统模型阶数和舍入误差没有直接关系。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891111", "t": 2, "q": "在热工系统数值积分中，\"隐式欧拉法\"的计算步骤包括（　）", "a": ["对非线性系统，采用迭代法求解x(t+h)（如牛顿迭代）", "直接计算x(t+h)，无需迭代", "建立隐式方程:x(t+h)=x(t)+h*f(t+h,x(t+h))", "仅需t时刻导数，无需t+h时刻导数", "", ""], "r": "AC", "e": "隐式欧拉法要先建立隐式方程x(t+h)=x(t)+h*f(t+h,x(t+h))，对非线性系统需用迭代法求x(t+h) 。B项不能直接算需迭代；D项需t+h时刻导数。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891112", "t": 2, "q": "在热工系统数值积分中，\"隐式欧拉法\"的适用场景包括（　）", "a": ["仅适用于线性系统", "对稳定性要求高的系统（如汽轮机调门快变动态）", "刚性系统（如锅炉汽水系统，快变与慢变过程共存）", "对计算效率要求高，允许精度较低的系统", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891113", "t": 2, "q": "在热工系统数值积分中，导致\"数值误差\"的主要原因包括（　）", "a": ["输入数据噪声（采集的输入信号含随机干扰）", "舍入误差（计算设备精度限制，如浮点数运算偏差）", "截断误差（积分公式对被积函数近似导致，如欧拉法泰勒展开截断）", "模型结构误差（如将非线性模型简化为线性模型）", "", ""], "r": "ABC", "e": "热工系统数值积分中，输入数据噪声、舍入误差、截断误差都会导致数值误差。模型结构误差主要是模型构建方面问题，不属于数值积分中数值误差的主要原因。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891114", "t": 2, "q": "在数值积分法选择中，\"四阶显式龙格-库塔法\"相较于\"显式欧拉法\"的优势有（　）", "a": ["适用于刚性系统（快变与慢变过程共存），稳定性更好", "对步长的适应性更强，可在较大步长下仍保持较好精度", "计算量更小，无需多次计算导数", "截断误差量级更低（四阶为h5，欧拉法为h2），精度更高", "", ""], "r": "BD", "e": "1. 解析 对于选项A：四阶显式龙格 - 库塔法虽然比显式欧拉法精度高，但对于刚性系统（快变与慢变过程共存），它的稳定性并不一定好，刚性系统往往需要特殊的数值方法（如隐式方法等）来保证稳定性。 对于选项B：四阶显式龙格 - 库塔法对步长的适应性比显式欧拉法强，能在相对较大的步长下保持较好的精度。 对于选项C：四阶显式龙格 - 库塔法的计算量比显式欧拉法大，因为它在每一步计算需要更多的函数求值，并非计算量更小。 对于选项D：四阶显式龙格 - 库塔法的截断误差量级为「test/yiwen_img/importSubject/2034803695346126848.png」，显式欧拉法的截断误差量级为「test/yiwen_img/importSubject/2034803695413235712.png」，所以四阶显式龙格 - 库塔法精度更高。2. 答案 正确答案为BD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891115", "t": 2, "q": "在数值积分法中，\"变步长积分\"的调整原则包括（　）", "a": ["若当前步长计算的误差远小于阈值，增大步长（提高效率）", "步长调整需权衡精度与计算效率", "若当前步长计算的误差超过阈值，减小步长（保证精度）", "无论系统动态快慢，步长保持固定（此为定步长）", "", ""], "r": "ABC", "e": "变步长积分会根据计算误差调整步长，误差小增大步长提高效率，误差超阈值减小步长保证精度，且要权衡精度与效率。而D选项说步长固定是定步长特点，不是变步长调整原则。答案选ABC。 <br />B选项正确。变步长积分的核心在于根据实际情况灵活调整步长大小，既不能一味追求高精度而忽视了计算成本，也不能为了节省资源而牺牲必要的准确性。因此，在实际应用过程中必须综合考量这两个因素之间的平衡关系。<br />C选项正确。如果通过某一步长得到的结果误差较大，超过了允许范围，则应考虑减小步长以获得更准确的结果。这是变步长积分算法中最基本也是最重要的一个调整策略之一。<br />D选项错误。该描述实际上是指定步长积分方法的特点，而非变步长积分。变步长积分正是为了克服定步长方法在处理不同特性函数或复杂系统时可能出现的问题而设计出来的技术。", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891116", "t": 2, "q": "在数值积分法中，\"龙格-库塔法\"的阶数划分依据包括（　）", "a": ["输入信号的频率", "系统模型的阶数", "截断误差的量级（如一阶龙格-库塔法截断误差为O(h2)，四阶为O(h5)）", "计算导数的次数（如四阶方法需进行多次函数值计算）", "", ""], "r": "CD", "e": "答案：CD龙格 - 库塔法的阶数划分主要依据截断误差的量级和计算导数的次数。截断误差的量级决定了方法的精度，计算导数的次数会影响计算的复杂度。输入信号频率和系统模型阶数通常不是直接决定龙格 - 库塔法阶数划分的因素。", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891117", "t": 2, "q": "在数值积分法中，\"四阶龙格-库塔法\"的计算步骤包括（　）", "a": ["计算k1=f(t,x(t))（t时刻导数）", "计算k2=f(t+h/2,x(t)+h*k1/2)（t+h/2时刻导数，用k1近似）", "计算k3=f(t+h/2,x(t)+h*k2/2)（t+h/2时刻导数，用k2近似）", "计算k4=f(t+h,x(t)+hk3)（t+h时刻导数，用k3近似），最终x(t+h)=x(t)+h(k1+2k2+2k3+k4)/6", "", ""], "r": "ABCD", "e": "四阶龙格 - 库塔法计算步骤包含A、B、C、D各选项内容。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891118", "t": 2, "q": "在数值积分法中，\"梯形法\"的特点包括（　）", "a": ["计算过程需用到区间两端的函数值信息（f(t,x(t))和f(t+h,x(t+h)））", "计算量大于显式欧拉法", "截断误差量级为h^2，精度高于显式欧拉法（h）", "对非线性系统，需迭代求解（因x(t+h)含在导数中）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891119", "t": 2, "q": "在数值积分法中，\"稳定性\"的含义包括（　）", "a": ["所有积分方法稳定性相同", "稳定性仅与积分方法有关，与系统模型无关", "当积分步长在一定范围内时，数值解不会随迭代发散", "数值解随时间增长仍能保持在合理范围（无无限增大/减小）", "", ""], "r": "CD", "e": "数值积分法中稳定性指积分步长在一定范围时，数值解不会随迭代发散，且能保持在合理范围不无限增大或减小。不同积分方法稳定性不同，且稳定性与系统模型有关。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803701557891120", "t": 2, "q": "在数值积分法中，\"显式欧拉法\"的局限性包括（　）", "a": ["计算量小，效率高", "仅适用于稳态系统，不适用于动态系统", "稳定性差，步长过大易发散", "截断误差大，精度低", "", ""], "r": "CD", "e": "显式欧拉法计算量小、效率高是优点，A不符合；它可用于动态系统，B错误；其局限性主要是稳定性差，步长过大易发散，截断误差大、精度低。所以答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377920", "t": 3, "q": "数值积分中，步长选择仅需考虑系统动态特性，无需参考积分方法的精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "步长选择不仅要考虑系统动态特性，如系统的变化速率等，还需参考积分方法的精度，不同积分方法精度不同，对步长要求也不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377921", "t": 3, "q": "数值积分中，定步长积分适用于系统动态特性变化大的工况（如机组启动），因步长固定易控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "定步长积分步长固定，难以适应系统动态特性变化大的工况，变步长积分更适合这种情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377922", "t": 3, "q": "数值积分中，刚性系统（如锅炉汽水系统）采用显式龙格-库塔法时，需选择极小步长才能保证稳定，导致计算效率极低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "刚性系统的特点是系统中存在不同时间尺度的变化，显式龙格 - 库塔法稳定性较差，用于刚性系统时，为保证计算稳定需极小步长，这会大幅增加计算量，使计算效率极低。", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377923", "t": 3, "q": "数值积分中，龙格-库塔法仅适用于线性系统，无法处理非线性热工系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "龙格 - 库塔法是一种用于求解常微分方程数值解的方法，它既适用于线性系统，也能处理非线性系统包括非线性热工系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377924", "t": 3, "q": "数值积分中，舍入误差会随迭代次数增加而累积，对长时间仿真结果影响更大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数值积分里，每次迭代都会有舍入误差，迭代次数增多，误差会不断累积，在长时间仿真时，累积的误差作用更明显，对结果影响更大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377925", "t": 3, "q": "数值积分中，舍入误差是由积分公式对被积函数近似导致的，与计算设备精度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。舍入误差是在数值计算中因计算设备精度有限，对数据进行舍入操作产生的，并非由积分公式对被积函数近似导致。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377926", "t": 3, "q": "数值积分中，四阶龙格-库塔法的截断误差量级为h5，精度高于显式欧拉法（h2）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "四阶龙格 - 库塔法截断误差量级是「test/yiwen_img/importSubject/2034803695530676224.png」，显式欧拉法截断误差量级是「test/yiwen_img/importSubject/2034803695128023040.png」，截断误差量级越小精度越高。", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377927", "t": 3, "q": "数值积分中，四阶龙格-库塔法的精度高于梯形法，因前者截断误差量级（h5）低于后者（h3）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数值积分里，截断误差量级越低精度越高，四阶龙格 - 库塔法截断误差量级为「test/yiwen_img/importSubject/2034803695530676224.png」，梯形法截断误差量级为「test/yiwen_img/importSubject/2034803695622950912.png」，所以四阶龙格 - 库塔法精度高于梯形法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377928", "t": 3, "q": "数值积分中，四阶龙格-库塔法需计算4次被积函数的值（而非导数），其单步计算量大于显式欧拉法。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "四阶龙格 - 库塔法确实要计算4次被积函数值，显式欧拉法只计算1次，所以单步计算量四阶龙格 - 库塔法更大。", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377929", "t": 3, "q": "数值积分中，梯形法的截断误差为O(h^2)，是二阶精度方法;显式欧拉法的截断误差为O(h)，是一阶精度方法。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数值积分和常微分方程数值解法中，梯形法截断误差是「test/yiwen_img/importSubject/2034803695128023040.png」，为二阶精度方法；显式欧拉法截断误差是O(h)，是一阶精度方法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377930", "t": 3, "q": "数值积分中，梯形法的精度高于显式欧拉法，因前者利用了区间两端的导数信息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梯形法在数值积分时考虑了区间两端的函数值，相当于利用了两端的导数信息，相比只考虑区间起点导数信息的显式欧拉法，精度更高。", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377931", "t": 3, "q": "数值积分中，梯形法对非线性系统无需迭代，可直接求解x(t+h)。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梯形法是数值积分方法，对于非线性系统，一般需要迭代才能求解x(t + h)，并非可直接求解。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377932", "t": 3, "q": "数值积分中，显式欧拉法的稳定性条件为步长h≤2/T（T为一阶系统时间常数），否则易发散。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377933", "t": 3, "q": "数值积分中，显式欧拉法计算简单，无需迭代，适用于对稳定性要求高的刚性系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "显式欧拉法计算简单、无需迭代，但稳定性较差，刚性系统对稳定性要求高，显式欧拉法并不适用于刚性系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377934", "t": 3, "q": "数值积分中，隐式欧拉法的计算量小于显式欧拉法，因无需计算导数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "隐式欧拉法需求解非线性方程，计算量通常大于显式欧拉法，且都要涉及导数计算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377935", "t": 3, "q": "数值积分中，隐式欧拉法的稳定性优于显式欧拉法，适用于刚性系统。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "隐式欧拉法在数值积分里，其稳定性比显式欧拉法好，能有效处理刚性系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377936", "t": 3, "q": "数值积分中，隐式欧拉法对所有步长均稳定（A-稳定），适用于各类热工系统。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "隐式欧拉法是A - 稳定的，即对所有步长均稳定，能较好处理刚性问题，热工系统常存在刚性，所以适用于各类热工系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377937", "t": 3, "q": "数值积分中，隐式欧拉法求解非线性系统时，需采用迭代法（如牛顿-拉夫逊法）求解x(t+h)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "隐式欧拉法在求解非线性系统时，由于方程是关于未知量x(t + h)的非线性方程，通常不能直接求解，需用迭代法（像牛顿 - 拉夫逊法）来求解x(t + h)。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377938", "t": 3, "q": "系统辨识的\"可辨识性\"仅与系统本身特性有关，与输入信号无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统辨识的“可辨识性”不仅和系统本身特性有关，也与输入信号有关，合适的输入信号能更好地满足可辨识条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377939", "t": 3, "q": "系统辨识中，残差均值不为零时，说明模型存在系统偏差，需改进模型结构或重新估计参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在系统辨识里，残差均值反映模型预测值与实际值的总体偏差情况，不为零意味着模型有系统偏差，通常就需要改进模型结构或重新估计参数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377940", "t": 3, "q": "系统辨识中，递推最小二乘法可实时处理新数据，更新模型参数，适用于在线辨识。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "递推最小二乘法能不断利用新数据实时更新模型参数，符合在线辨识需实时处理数据的要求，所以适用于在线辨识。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377941", "t": 3, "q": "系统辨识中，离线辨识需存储所有历史数据，一次性处理;在线辨识无需存储数据，实时更新。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377942", "t": 3, "q": "系统辨识中，模型过拟合是指模型在训练集上误差大，在测试集上误差小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统辨识中，模型过拟合是指模型在训练集上误差小，在测试集上误差大。而题干描述与之相反。", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377943", "t": 3, "q": "系统辨识中，模型降阶的目的是在保证精度的前提下，简化模型结构，降低仿真计算量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "系统辨识时模型降阶就是在尽量保证模型精度基础上，简化其结构，进而减少仿真计算量。", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377944", "t": 3, "q": "系统辨识中，模型结构误选（如将二阶系统选作一阶）会导致参数估计偏差，即使数据质量高也无法弥补。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "模型结构误选会使模型与实际系统不匹配，本质上就存在缺陷，即便数据质量高，也不能改变模型结构错误带来的问题，必然会导致参数估计偏差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377945", "t": 3, "q": "系统辨识中，模型验证的残差分析若发现残差为白噪声，说明模型充分，可用于后续分析。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在系统辨识里，残差是实际输出与模型输出的差值。若残差为白噪声，意味着模型能捕捉系统的主要特征，未出现明显未建模动态，可认为模型充分，能用于后续分析。", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377946", "t": 3, "q": "系统辨识中，模型验证的交叉验证法需将数据分为训练集、验证集、测试集，多次验证泛化能力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "交叉验证法是把数据划分成训练集和验证集，多次划分验证泛化能力，一般不涉及测试集。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377947", "t": 3, "q": "系统辨识中，若输出数据含随机噪声，最小二乘法估计的模型参数仍为无偏估计。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377948", "t": 3, "q": "系统辨识中，输入信号的持续激励条件是指输入信号的频谱在系统所有可能频率范围内非零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "持续激励条件要求输入信号频谱能覆盖系统感兴趣的频率范围且不为零，题干表述基本符合其定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377949", "t": 3, "q": "系统辨识中，输入信号的幅值越大，辨识精度越高，因此应尽可能增大输入幅值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "输入信号幅值过大会使系统进入非线性区，导致模型不准确，并非幅值越大辨识精度越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377950", "t": 3, "q": "在系统辨识过程中，当输入信号为阶跃信号时，能够激励出系统的所有动态特性，因此适用于宽频带辨识。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "阶跃信号频谱集中在低频段，不能激励出系统所有动态特性，不适用于宽频带辨识。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377951", "t": 3, "q": "系统辨识中，数据滤波的目的是去除高频噪声，保留系统真实动态特性，不改变数据趋势。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据滤波就是为了减少或消除高频噪声干扰，让数据更能体现系统真实动态，且通常不会改变数据整体趋势。", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377952", "t": 3, "q": "系统辨识中，数据同步性差（输入输出不同步）会导致模型参数估计偏差，如纯延迟时间误判。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据同步性差时，输入输出的对应关系被破坏，会干扰对系统特性的准确判断，易造成模型参数估计偏差，像纯延迟时间就可能误判。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377953", "t": 3, "q": "系统辨识中，数据预处理的\"去趋势项\"是为了使数据满足平稳性要求，避免影响参数估计。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "去趋势项能消除数据中的趋势成分，让数据更平稳，而平稳数据对准确进行参数估计很关键，可避免趋势项对参数估计造成不良影响。", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377954", "t": 3, "q": "系统辨识中，线性定常系统的辨识需经历数据预处理、模型结构选择、参数估计、模型验证四个步骤。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统辨识的一般流程就是数据预处理、模型结构选择、参数估计、模型验证这四个步骤。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377955", "t": 3, "q": "系统辨识中，线性时变系统的参数随时间变化，需采用递推最小二乘法实时更新参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性时变系统参数随时间变化，递推最小二乘法可利用新数据实时更新参数估计，适合处理此类系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377956", "t": 3, "q": "系统辨识中，相关分析法通过计算输入输出信号的互相关函数，可估计系统的纯延迟时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在系统辨识里，相关分析法确实能通过计算输入输出信号的互相关函数来估计系统的纯延迟时间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377957", "t": 3, "q": "系统辨识中，信息准则法（如AIC）通过最小化\"拟合误差+模型复杂度惩罚项\"选择最优模型结构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "信息准则法（像AIC）的核心思想就是在模型拟合效果和复杂度间权衡，通过最小化“拟合误差 + 模型复杂度惩罚项”来挑选最优模型结构。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377958", "t": 3, "q": "系统辨识中，最小二乘法的核心思想是使模型输出与实际输出的偏差平方和最小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最小二乘法就是通过最小化误差的平方和来寻找数据的最佳函数匹配，在系统辨识里，就是让模型输出和实际输出的偏差平方和最小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377959", "t": 3, "q": "系统辨识中，最小二乘法估计的参数方差随数据量增加而减小，辨识精度提高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在系统辨识里，依据最小二乘法原理，数据量增多时能提供更多信息，可降低估计误差，使参数方差减小，进而提高辨识精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377960", "t": 3, "q": "一阶惯性环节的传递函数1/(Ts+1)中，T的物理意义是系统响应达到稳态值63.2%所需的时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于一阶惯性环节传递函数1/(Ts + 1)，它在单位阶跃输入下，其响应曲线达到稳态值63.2%所需时间就是时间常数T。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377961", "t": 3, "q": "一阶惯性环节的传递函数为1/(Ts+1)，其中T的单位为秒，反映系统的惯性大小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一阶惯性环节标准传递函数就是1/(Ts + 1)，T是时间常数，单位是秒，T越大系统惯性越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377962", "t": 3, "q": "一阶惯性环节的传递函数与输入信号类型无关，仅由系统本身特性（如容积、流速）决定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "传递函数是在零初始条件下，系统输出的拉氏变换与输入的拉氏变换之比，它反映的是系统本身的固有特性，和输入信号类型无关，一阶惯性环节传递函数同样如此，由系统自身特性决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377963", "t": 3, "q": "一阶惯性环节的单位阶跃响应初始时刻的导数最大，随后逐渐减小至零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一阶惯性环节单位阶跃响应表达式求导后，初始时刻导数为1/T（T为时间常数），此后导数随时间增加逐渐减小到零。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377964", "t": 3, "q": "一阶惯性环节的单位阶跃响应达到稳态值98%所需的时间约为2T。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377965", "t": 3, "q": "一阶惯性环节的单位阶跃响应曲线为S型，无拐点，单调递增。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一阶惯性环节单位阶跃响应单调递增，但不是S型且无拐点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377966", "t": 3, "q": "一阶惯性环节的单位阶跃响应稳态值等于输入阶跃值与放大系数K的乘积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一阶惯性环节单位阶跃响应稳态时，输出值等于输入阶跃值与放大系数K的乘积。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377967", "t": 3, "q": "一阶惯性环节的放大系数K越大，系统响应速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一阶惯性环节响应速度主要取决于时间常数T，T越小响应越快，放大系数K不影响响应速度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803704439377968", "t": 3, "q": "一阶惯性环节的幅频特性随频率ω增大而单调衰减，相频特性随ω增大而单调滞后。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于一阶惯性环节「test/yiwen_img/importSubject/2034803695736197120.png」，其频率特性「test/yiwen_img/importSubject/2034803695862026240.png」 ，幅频特性「test/yiwen_img/importSubject/2034803695971078144.png」，随「test/yiwen_img/importSubject/2034803696096907264.png」增大，分母增大，「test/yiwen_img/importSubject/2034803696180793344.png」单调衰减；相频特性「test/yiwen_img/importSubject/2034803696273068032.png」 ，「test/yiwen_img/importSubject/2034803696096907264.png」增大时「test/yiwen_img/importSubject/2034803696386314240.png」增大，「test/yiwen_img/importSubject/2034803696482783232.png」单调滞后。所以该说法正确。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第4章 过程参数检测技术（1）", "n": "基础练习题【含解析】 / 第4章 过程参数检测技术（1）", "qs": [{"id": "2034803710357540864", "t": 1, "q": "下列哪些温标属于国际单位制（SI）中的温标?", "a": ["华氏温标（℉）", "摄氏温标（℃）", "开尔文温标（K）", "列氏温标（°Ré）", "", ""], "r": "C", "e": "国际单位制（SI）中的温标是开尔文温标。华氏、摄氏、列氏温标都不是国际单位制温标。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540865", "t": 1, "q": "火电机组氧量计用于测量锅炉烟气中的含氧量，其核心测量原理基于哪种物理现象?", "a": ["磁氧效应", "光电效应", "霍尔效应", "热磁效应", "", ""], "r": "A", "e": "这道题目考察的是火电机组氧量计的核心测量原理。氧量计用于测量锅炉烟气中的含氧量，其关键在于理解不同物理现象的应用。A. 磁氧效应：这是氧气在磁场中表现出的特殊性质，能够被特定传感器检测，从而测量氧含量。B. 光电效应：主要涉及光照射到物质上产生电子的现象，与氧量测量无直接关联。C. 霍尔效应：是磁场作用下电流在导体中产生的侧向电压，同样与氧量测量无关。D. 热磁效应：涉及物质的热学和磁学性质变化，但不适用于氧量的直接测量。火电机组氧量计正是基于磁氧效应来工作的，它利用氧气在磁场中的特殊反应来准确测量烟气中的含氧量。因此，正确答案是A选项：“磁氧效应”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540866", "t": 1, "q": "火电机组中测量锅炉给水流量时，若给水含气量较高，下列哪种流量仪表的测量误差会最大?", "a": ["电磁流量计", "涡街流量计", "差压式流量计（孔板）", "超声波流量计", "", ""], "r": "B", "e": "这道题考察的是对不同流量仪表在特定条件下测量误差的理解。在火电机组中测量锅炉给水流量时，若给水含气量较高，我们需要考虑哪种流量仪表受气体影响最大。1. 电磁流量计：主要基于导电性液体在磁场中的感应电势来测量流量。由于气体不导电，其存在对电磁流量计的影响相对较小。2. 涡街流量计：通过测量流体通过旋涡发生体产生的频率来确定流量。气体的存在会干扰旋涡的形成和稳定，从而导致较大的测量误差。3. 差压式流量计（孔板）：基于流体通过孔板时产生的差压来测量流量。虽然气体可能影响流体的连续性，但其影响相对较小，主要影响还是在流体状态变化时。4. 超声波流量计：通过测量超声波在流体中的传播时间差来确定流量。气体的存在会对超声波的传播路径和时间产生一定影响，但相较于涡街流量计，其误差可能较小。综上所述，当给水含气量较高时，涡街流量计由于气体对旋涡形成的干扰，其测量误差会最大。所以，正确答案是B.涡街流量计。", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540867", "t": 1, "q": "火电机组中测量锅炉给水流量时，若给水温度变化较大（如启停炉阶段），下列哪种流量仪表的测量误差最小?", "a": ["差压式流量计（孔板）", "电磁流量计", "涡街流量计", "科里奥利质量流量计", "", ""], "r": "D", "e": "差压式、涡街流量计受流体密度等影响大，温度变化会带来较大误差；电磁流量计只能测导电液体，且受流体温度等物性影响；科里奥利质量流量计直接测量质量流量，不受温度、压力、密度等变化影响，测量误差最小。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540868", "t": 1, "q": "火电机组中测量锅炉过热蒸汽压力时，因蒸汽温度较高（约540℃），压力仪表的测量元件需采取哪种措施?", "a": ["加装隔离液", "采用耐高温材质", "加装冷凝管", "加装散热器", "", ""], "r": "C", "e": "测量高温蒸汽压力时，为防止高温蒸汽直接进入压力仪表损坏测量元件，需加装冷凝管，使蒸汽冷却成冷凝水后再作用于测量元件。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540869", "t": 1, "q": "火电机组中测量锅炉炉膛温度时，因温度极高且有火焰辐射，下列哪种测温仪表最适用?", "a": ["双金属温度计", "红外辐射温度计", "热电阻温度计", "热电偶温度计", "", ""], "r": "B", "e": "对于高温且有火焰辐射的锅炉炉膛温度测量，需选能适应此环境的仪表。双金属温度计、热电阻温度计一般用于中低温测量；热电偶温度计虽能测较高温度，但在有火焰辐射的高温环境不如红外辐射温度计合适，红外辐射温度计可通过接收物体辐射的红外线来测量高温，适合高温有辐射的场景。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540870", "t": 1, "q": "火电机组中测量锅炉炉膛压力时，若炉膛压力出现瞬间负压（如灭火时），下列哪种压力仪表不会损坏?", "a": ["压电式压力传感器", "弹性式压力计（弹簧管）", "液柱式压力计（水）", "应变式压力传感器", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540871", "t": 1, "q": "火电机组中测量锅炉炉膛压力时，因炉膛压力接近大气压且波动较小，下列哪种压力测量原理最适用?", "a": ["压电式压力测量原理", "弹性式压力测量原理", "应变式压力测量原理", "液柱式压力测量原理", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540872", "t": 1, "q": "火电机组中测量锅炉再热蒸汽流量时，若再热蒸汽压力较低（约4MPa），下列哪种流量仪表最适用?", "a": ["差压式流量计（喷嘴）", "容积式流量计", "涡街流量计", "电磁流量计", "", ""], "r": "C", "e": "再热蒸汽是气体，容积式流量计用于测量液体，电磁流量计用于导电液体，可排除B、D；差压式流量计适用于高温高压流体测量，但压力较低时，涡街流量计更合适，它对压力要求没那么高且能较好测量气体流量。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540873", "t": 1, "q": "火电机组中测量锅炉蒸汽流量时，若蒸汽压力波动较大，下列哪种流量仪表的测量误差最大?", "a": ["电磁流量计", "科里奥利质量流量计", "差压式流量计（孔板）", "涡街流量计", "", ""], "r": "C", "e": "差压式流量计（孔板）测量流量与流体密度有关，蒸汽压力波动大时，蒸汽密度变化大，会使测量误差显著增大。而电磁流量计测导电液体，不受压力影响；科里奥利质量流量计直接测质量流量，受压力影响小；涡街流量计主要受流速等影响，压力影响相对小。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540874", "t": 1, "q": "火电机组中测量炉膛负压时，若采用U型管压力计，当环境温度升高导致管内工作液体（如水）密度减小，会产生哪种误差?", "a": ["粗大误差", "动态误差", "系统误差", "随机误差", "", ""], "r": "C", "e": "环境温度升高使管内工作液体密度减小，这种误差会按照一定规律变化，属于系统误差。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540875", "t": 1, "q": "火电机组中测量炉膛压力时，若采用差压式压力变送器，其正压端应接?", "a": ["炉膛外部", "其他容器", "炉膛内部", "大气", "", ""], "r": "C", "e": "测量炉膛压力用差压式压力变送器时，正压端应接被测量压力处，即炉膛内部。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540876", "t": 1, "q": "火电机组中测量凝汽器液位时，若凝汽器内压力变化较大，下列哪种液位计的测量误差最小?", "a": ["浮子式液位计", "电容式液位计", "差压式液位计（带压力补偿）", "雷达式液位计", "", ""], "r": "C", "e": "因凝汽器内压力变化大，需选受压力影响小的液位计。差压式液位计若带压力补偿可消除压力变化对测量的影响；浮子式受压力影响大；电容式受压力变化也会有一定测量误差；雷达式虽受压力影响小，但有蒸汽等情况时测量会受干扰，综合来看带压力补偿的差压式最优。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540877", "t": 1, "q": "火电机组中测量凝汽器真空度时，真空度的定义是?", "a": ["凝汽器内表压的绝对值", "凝汽器内绝对压力的对数", "大气压与凝汽器内绝对压力的差值", "凝汽器内绝对压力与大气压的比值", "", ""], "r": "C", "e": "真空度是指大气压与系统绝对压力的差值。凝汽器真空度即大气压与凝汽器内绝对压力的差值。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540878", "t": 1, "q": "火电机组中测量循环水流量时，若循环水含有大量杂质（如泥沙），下列哪种流量仪表最耐用?", "a": ["差压式流量计（孔板）", "涡街流量计", "电磁流量计", "超声波流量计", "", ""], "r": "C", "e": "这道题考察的是对不同流量仪表在特定应用场景下的耐用性的理解。首先，我们简要介绍题目中涉及的四种流量仪表：* 差压式流量计（孔板）：通过测量流体通过孔板时产生的差压来确定流量。它对流体的纯净度有一定要求，因为杂质可能会堵塞孔板，影响测量精度。* 涡街流量计：利用流体通过特定形状的物体时产生的涡街信号来测量流量。它对流体的纯净度要求也相对较高，杂质可能会干扰涡街信号的稳定。* 电磁流量计：基于法拉第电磁感应定律，通过测量流体在磁场中的感应电势来确定流量。它适用于导电流体，且对流体的纯净度要求不高，因为不依赖于流体的物理特性。* 超声波流量计：利用超声波在流体中的传播速度来测量流量。虽然它对流体的纯净度有一定要求，但相对于差压式流量计和涡街流量计，其受杂质影响较小。接下来，我们分析题目中的关键信息：火电机组中测量循环水流量，且循环水含有大量杂质（如泥沙）。在这种情况下，我们需要选择一种对杂质耐受性强的流量仪表。综合以上信息，我们可以得出以下结论：* 差压式流量计和涡街流量计对流体的纯净度要求较高，容易受到杂质的影响，因此不是最佳选择。* 超声波流量计虽然受杂质影响较小，但相比之下，电磁流量计对流体的纯净度要求更低，更适用于含有大量杂质的流体测量。* 电磁流量计不依赖于流体的物理特性，而是基于电磁感应原理进行测量，因此对杂质的耐受性更强。所以，正确答案是C.电磁流量计。", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540879", "t": 1, "q": "火电机组中测量主蒸汽流量时，若采用标准节流装置（如孔板），其测量原理基于下列哪项物理定律?", "a": ["牛顿第二定律", "伯努利方程", "质量守恒定律", "能量守恒定律", "", ""], "r": "B", "e": "标准节流装置测量流量是依据流体在节流件前后的压力差与流量的关系，这一关系推导基于伯努利方程。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540880", "t": 1, "q": "某测量系统对汽轮机转速进行测量，采用光电式转速传感器，若传感器与旋转部件之间的间隙过大，会导致测量值偏低，该误差属于哪种误差来源?", "a": ["环境误差", "仪表本身误差", "人为误差", "安装误差", "", ""], "r": "D", "e": "传感器与旋转部件间隙过大是安装方面问题导致测量值偏差。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540881", "t": 1, "q": "某测量仪表的精度等级为1.0级，量程为0-5MPa，其在2.5MPa测量点的最大允许误差为?", "a": ["±0.05MPa", "±0.025MPa", "±0.5MPa", "±0.25MPa", "", ""], "r": "A", "e": "精度等级为1.0级表示最大引用误差为±1.0%，最大允许误差=量程×精度等级，即5MPa×1.0% = ±0.05MPa 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540882", "t": 1, "q": "某测量仪表的量程为0-10MPa，精度等级为0.5级，其最大绝对误差为?", "a": ["5MPa", "0.5MPa", "0.005MPa", "0.05MPa", "", ""], "r": "D", "e": "精度等级为引用误差，最大允许绝对误差 = 量程 × 精度等级 %。量程 10MPa，0.5 级，最大绝对误差 = 10×0.5%=0.05MPa。因此选 D。", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540883", "t": 1, "q": "某测量仪表的指示值为20MPa，真值为20.02MPa，该仪表的相对误差为?", "a": ["0.02MPa", "0.1%", "-0.1%", "-0.02MPa", "", ""], "r": "C", "e": "相对误差=（指示值 - 真值）÷真值×100%，即(20 - 20.02)÷20.02×100%≈ - 0.1%。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540884", "t": 1, "q": "某测量仪表的指示值为100℃，真值为100.5℃，该仪表的示值误差为?", "a": ["-0.5%", "0.5℃", "0.5%", "-0.5℃", "", ""], "r": "D", "e": "示值误差 = 指示值 - 真值，即100 - 100.5 = -0.5℃。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540885", "t": 1, "q": "某温度仪表的测量范围为-50℃至500℃，精度等级为0.5级，其最大允许误差为?", "a": ["±2.75℃", "±0.25℃", "±0.5℃", "±2.5℃", "", ""], "r": "A", "e": "精度等级百分比乘量程即最大允许误差，量程是500 - (-50)=550℃，0.5%×550 = 2.75℃。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540886", "t": 1, "q": "某温度仪表的测量范围为0-800℃，当测量600℃时，实际温度为602℃，该仪表的相对误差为?", "a": ["2℃", "-2℃", "0.33%", "-0.33%", "", ""], "r": "D", "e": "示值 = 600℃，真实值 = 602℃。相对误差 =（测量值−真实值）/ 真实值 ×100% = (600−602)/602≈−0.33%。A、B 是绝对误差；C 符号错误。因此选 D。", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540887", "t": 1, "q": "某温度仪表的精度等级为0.1级，量程为0-1000℃，其在500℃测量点的最大允许误差为?", "a": ["±0.5℃", "±0.1℃", "±1℃", "±10℃", "", ""], "r": "C", "e": "精度等级对应的最大允许误差=量程×精度等级百分数，即1000×0.1% = ±1℃，与测量点无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540888", "t": 1, "q": "某压力仪表的量程为0-16MPa，精度等级为0.2级，其最大绝对误差为?", "a": ["±0.32MPa", "±0.16MPa", "±0.032MPa", "±0.016MPa", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540889", "t": 1, "q": "某压力仪表的量程为0-25MPa，精度等级为0.5级，其最大允许误差为?", "a": ["±1.25MPa", "±2.5MPa", "±0.25MPa", "±0.125MPa", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540890", "t": 1, "q": "某压力仪表的指示值为5.0MPa，经校准得知其真值为5.05MPa，该仪表的示值误差为?", "a": ["0.05MPa", "0.05%", "-0.05MPa", "-0.05%", "", ""], "r": "C", "e": "示值误差 = 指示值 - 真值，即5.0 - 5.05 = -0.05MPa。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540891", "t": 1, "q": "某压力仪表的指示值为8.0MPa，经校准得知其最大绝对误差为±0.08MPa，该仪表的精度等级为?", "a": ["0.1级", "0.5级", "1.0级", "0.01级", "", ""], "r": "C", "e": "精度等级是最大引用误差去掉正负号后的数值。最大引用误差=最大绝对误差/量程×100% ，本题未提及量程默认按指示值算，即最大引用误差=0.08/8×100% = 1%，对应精度等级为1.0级。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540892", "t": 1, "q": "汽轮机高压缸进口温度测量中，若采用多支热电偶并联测量，其目的是?", "a": ["扩大测量范围", "提高测量灵敏度", "提高测量精度", "增加测量可靠性（冗余）", "", ""], "r": "D", "e": "多支热电偶并联，一支损坏不影响整体测量，能保证测量的正常进行，主要是为了增加测量可靠性（冗余）。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540893", "t": 1, "q": "汽轮机高压缸排汽压力测量中，若采用应变式压力传感器，其核心敏感元件是?", "a": ["弹性膜片", "电容极板", "压电晶体", "应变片", "", ""], "r": "D", "e": "应变式压力传感器核心敏感元件是应变片，当压力作用使弹性元件变形时，应变片阻值改变来测量压力。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540894", "t": 1, "q": "汽轮机排汽温度测量中，若采用多个热电偶测点进行平均测量，其主要目的是?", "a": ["消除粗大误差", "消除系统误差", "提高测量灵敏度", "减小随机误差", "", ""], "r": "D", "e": "多个热电偶测点平均测量可使随机误差相互抵消从而减小。粗大误差可通过数据处理剔除；系统误差要通过修正等方法消除；平均测量和提高灵敏度无关。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540895", "t": 1, "q": "汽轮机排汽压力测量中，若排汽含湿量较高，下列哪种压力仪表会出现测量误差?", "a": ["电容式压力传感器", "应变式压力传感器", "压电式压力传感器", "弹性式压力计（弹簧管）", "", ""], "r": "A", "e": "排汽含湿量高时，水汽易进入电容式压力传感器内部，影响电容值测量产生误差。而应变式、压电式一般用于动态压力测量，受含湿量影响小；弹性式压力计有一定抗水能力。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540896", "t": 1, "q": "汽轮机润滑油压力测量中，若润滑油中含有杂质，会影响哪种压力仪表的正常工作?", "a": ["弹性式压力计（弹簧管）", "应变式压力传感器", "压电式压力传感器", "电容式压力传感器", "", ""], "r": "A", "e": "润滑油含杂质易堵塞弹性式压力计（弹簧管）的弹簧管，影响其正常工作。其他几种传感器主要是通过电信号原理工作，受杂质影响相对小。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540897", "t": 1, "q": "汽轮机轴承温度测量中，常用的铂热电阻（如PT100）的电阻值在0℃时为?", "a": ["100Ω", "0Ω", "50Ω", "10Ω", "", ""], "r": "A", "e": "PT100 铂热电阻中的“100”代表其在 0℃时电阻值为 100Ω。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540898", "t": 1, "q": "汽轮机轴承振动测量中，常用的压电式振动传感器测量的是哪种振动参数?", "a": ["加速度", "速度", "位移", "频率", "", ""], "r": "A", "e": "压电式振动传感器基于压电效应工作，主要测量振动的加速度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540899", "t": 1, "q": "汽轮机轴向位移测量中，常用的电涡流传感器的测量范围通常为?", "a": ["0-5mm", "-50mm至+50mm", "-10mm至+10mm", "0-20mm", "", ""], "r": "C", "e": "电涡流传感器测量汽轮机轴向位移时，测量范围一般是 -10mm 至 +10mm ，这个范围能满足汽轮机轴向位移监测需求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540900", "t": 1, "q": "汽轮机轴向位移测量中，电涡流传感器的测量精度主要受哪种因素影响?", "a": ["传感器与被测件的材质", "被测件的转速", "介质压力", "环境温度", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540901", "t": 1, "q": "汽轮机转速测量中，若采用磁电式转速传感器，其输出信号的哪种参数与转速成正比?", "a": ["相位", "电压幅值", "电流幅值", "频率", "", ""], "r": "D", "e": "磁电式转速传感器基于电磁感应原理，其输出信号频率与汽轮机转速成正比。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540902", "t": 1, "q": "汽轮机转速测量中，若采用光电式转速传感器，其核心部件是?", "a": ["应变片和弹性元件", "电容极板和介质", "磁钢和线圈", "发光二极管（LED）和光敏三极管", "", ""], "r": "D", "e": "光电式转速传感器利用光的发射和接收来测量转速，核心是能实现光发射和接收的部件。选项D中发光二极管可发射光，光敏三极管能接收光，符合其核心部件要求。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540903", "t": 1, "q": "汽轮机转速测量中，若转速传感器的电源电压波动，会导致输出信号的哪种参数变化?", "a": ["相位", "频率", "幅值", "周期", "", ""], "r": "C", "e": "转速传感器电源电压波动会影响输出信号的幅值，电源电压变化时，传感器输出信号强弱改变即幅值改变。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540904", "t": 1, "q": "下列哪种测温仪表的测量精度最高，适用于作为温度标准器具（如实验室校准）?", "a": ["铂铑-铂热电偶", "双金属温度计", "红外辐射温度计", "铂热电阻", "", ""], "r": "D", "e": "本题考查的是测温仪表的测量精度及适用场景。在实验室校准等需要高精度温度测量的场合，通常会选择精度高、稳定性好的测温仪表。A. 铂铑-铂热电偶：虽然精度较高，但主要用于高温测量，且价格昂贵，不是首选的温度标准器具。B. 双金属温度计：精度相对较低，主要用于工业过程控制，不适用于高精度测量。C. 红外辐射温度计：测量的是物体发射的红外辐射能量，受环境因素影响较大，精度不稳定，不适用于作为温度标准器具。D. 铂热电阻：具有高精度、高稳定性特点，广泛应用于精密测量和温度标准器具。综上所述，铂热电阻因其高精度和高稳定性，最适合作为温度标准器具。所以，正确答案是D.铂热电阻。", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540905", "t": 1, "q": "下列哪种测温仪表的响应速度最快，适用于测量快速变化的温度（如汽轮机排气温度波动）?", "a": ["热电偶温度计", "热电阻温度计", "红外辐射温度计", "双金属温度计", "", ""], "r": "A", "e": "这道题目考察的是对不同类型测温仪表响应速度的理解和应用场景的知识。首先，我们来简单介绍下这四种测温仪表： A. 热电偶温度计：利用热电效应测量温度，响应速度快，适用于高温和快速变化的温度测量。 B. 热电阻温度计：通过测量电阻值变化来确定温度，响应速度相对较慢。 C. 红外辐射温度计：非接触式测量，响应速度较快，但受环境因素影响较大。 D. 双金属温度计：利用两种金属片膨胀系数的差异来测量温度，响应速度慢。在这四种测温仪表中，热电偶温度计因其工作原理，能够提供最快的响应速度，非常适合用于测量快速变化的温度，如汽轮机排气温度波动。因此，正确答案是A.热电偶温度计。", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540906", "t": 1, "q": "下列哪种测温仪表适用于测量锅炉炉膛内的高温（1000℃以上），且为非接触式测量?", "a": ["双金属温度计", "铂热电阻", "红外辐射温度计", "铂铑-铂热电偶", "", ""], "r": "C", "e": "非接触式测量高温的仪表选红外辐射温度计。双金属温度计、铂热电阻、铂铑 - 铂热电偶一般是接触式测量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540907", "t": 1, "q": "下列哪种流量测量方法的测量结果不受流体密度、粘度变化的影响?", "a": ["超声波流量计", "电磁流量计", "差压式流量计", "容积式流量计", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540908", "t": 1, "q": "下列哪种流量测量仪表属于容积式流量仪表，适用于测量粘度较大的油类介质流量?", "a": ["超声波流量计", "涡街流量计", "椭圆齿轮流量计", "电磁流量计", "", ""], "r": "C", "e": "容积式流量仪表是通过测量流体在固定容积内的充满次数来计量流量。椭圆齿轮流量计是典型的容积式流量仪表，适合测量粘度大的油类。而超声波、涡街、电磁流量计都不属于容积式。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540909", "t": 1, "q": "下列哪种流量仪表的测量原理基于\"流体在旋转部件作用下产生科里奥利力，力的大小与质量流量成正比\"?", "a": ["科里奥利质量流量计", "差压式流量计", "涡街流量计", "电磁流量计", "", ""], "r": "A", "e": "根据题干中“流体在旋转部件作用下产生科里奥利力，力的大小与质量流量成正比”这一测量原理，对应的是科里奥利质量流量计。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540910", "t": 1, "q": "下列哪种流量仪表基于\"电磁感应定律\"，适用于测量导电液体的流量（如锅炉给水）?", "a": ["椭圆齿轮流量计", "涡街流量计", "电磁流量计", "超声波流量计", "", ""], "r": "C", "e": "电磁流量计依据电磁感应定律工作，可测导电液体流量。椭圆齿轮流量计靠齿轮旋转测量；涡街流量计基于流体振荡原理；超声波流量计利用超声波在流体中传播特性测量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540911", "t": 1, "q": "下列哪种流量仪表适用于测量大口径管道的流量（如循环水管道），且压损小?", "a": ["差压式流量计（孔板）", "涡街流量计", "超声波流量计", "电磁流量计", "", ""], "r": "C", "e": "差压式（孔板）压损大；涡街对大口径测量有局限且成本较高；电磁要求流体导电且大口径价格高；超声波流量计适合大口径管道，压损小。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540912", "t": 1, "q": "下列哪种流量仪表属于速度式流量仪表，通过测量流体流速计算流量?", "a": ["科里奥利质量流量计", "差压式流量计", "椭圆齿轮流量计", "电磁流量计", "", ""], "r": "D", "e": "速度式流量仪表通过测量流体流速计算流量。电磁流量计基于电磁感应原理测流速算流量，是速度式；科里奥利质量流量计测质量流量；差压式流量计是利用差压与流量关系；椭圆齿轮流量计是容积式。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034803710357540913", "t": 1, "q": "下列哪种热电偶的测温范围最广，可用于测量1600℃以上的高温（如锅炉炉膛温度）?", "a": ["镍铬-镍硅热电偶（K型）", "镁铬-铜镍热电偶（E型）", "铂铑10-铂热电偶（S型）", "铂铑30-铂铑6热电偶（B型）", "", ""], "r": "D", "e": "B型热电偶测温范围广，能测量1600℃以上高温。K型一般用于中温测量；E型适用于中低温；S型常用于1300℃左右测量。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389696", "t": 2, "q": "火电机组中，高温高压蒸汽参数测量（如主蒸汽）的仪表选型要求包括下列哪些?", "a": ["仪表响应时间≤1s（适应参数波动）", "仪表精度等级≥0.5级（满足工艺要求）", "仪表材质耐高温高压（如不锈钢316L）", "仪表防护等级≥IP65（防止粉尘水汽）", "", ""], "r": "ACD", "e": "主蒸汽参数测量，因蒸汽高温高压，仪表材质需耐高温高压，C正确；为防止粉尘水汽影响，防护等级要≥IP65，D正确；要适应参数波动，响应时间≤1s，A正确；精度等级应是≤0.5级，B错误。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389697", "t": 2, "q": "火电机组中，过程参数测量的\"安全防护\"要求包括下列哪些，以保护仪表和人员?", "a": ["高温测点仪表加装隔热罩（防止仪表超温）", "高空安装仪表设置防护栏（防止人员坠落）", "腐蚀性介质测点采用防腐仪表（防止腐蚀）", "高压测点仪表采用耐压仪表（防止超压损坏）", "", ""], "r": "ABCD", "e": "ABCD选项均是火电机组过程参数测量“安全防护”措施。A可防仪表超温，B能防人员坠落，C可防仪表被腐蚀，D可防仪表超压损坏。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389698", "t": 2, "q": "火电机组中，炉膛压力测量的测点选择要求包括下列哪些?", "a": ["远离喷燃器（避免局部气流扰动）", "对称布置多个测点（取平均，减少波动）", "布置在炉膛上部（避免底部积灰影响）", "靠近炉膛出口（反映实际排烟压力）", "", ""], "r": "ABC", "e": "为准确测量炉膛压力，测点要远离喷燃器以防局部气流扰动；需对称设多个测点取平均减少波动；布置在炉膛上部可避免底部积灰影响。而靠近炉膛出口测的是炉膛出口压力并非实际全面的炉膛压力。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389699", "t": 2, "q": "火电机组中，温度测量的冗余配置方式包括下列哪些，以提高可靠性?", "a": ["不同原理仪表测量同一参数（如热电偶+红外测温）", "重要测点（如轴承温度）采用2支热电阻并联", "关键测点（如主蒸汽温度）采用3支热电偶并联", "同一参数不同位置布置测点（如炉膛多点温度）", "", ""], "r": "AD", "e": "A用不同原理仪表测量同一参数可避免同种原理仪表失效问题；D同一参数不同位置布置测点可避免单点故障，二者都能提高测量可靠性。而B中热电阻并联精度易受影响，且不能有效判断故障；C中热电偶并联不仅不能提高可靠性，还不利于判断异常，反而会造成测量混乱。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389700", "t": 2, "q": "火电机组中，下列哪些参数测量需要采用非接触式测量方法?", "a": ["凝汽器液位", "炉膛火焰检测", "汽轮机叶片振动", "锅炉炉膛温度", "", ""], "r": "BCD", "e": "凝汽器液位一般可用接触式测量；炉膛火焰检测、汽轮机叶片振动、锅炉炉膛温度因工况复杂、环境恶劣，采用非接触式测量更合适。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389701", "t": 2, "q": "火电机组中，下列哪些参数测量需要进行温度补偿?", "a": ["氧量测量（如烟气氧量）", "流量测量（如蒸汽流量）", "液位测量（如汽包液位）", "压力测量（如蒸汽压力）", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389702", "t": 2, "q": "火电机组中，下列哪些容器的液位测量需要考虑介质的相变（如汽液两相）?", "a": ["除氧器", "给水箱", "凝汽器", "锅炉汽包", "", ""], "r": "ACD", "e": "除氧器、凝汽器、锅炉汽包内都存在汽液两相状态，液位测量需考虑介质相变。给水箱通常以液态水为主。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389703", "t": 2, "q": "火电机组中，循环水流量测量的难点包括下列哪些，需针对性选择仪表?", "a": ["介质含泥沙（易磨损仪表）", "管道口径大（通常1-3m）", "介质温度低（20-40℃，无特殊影响）", "流量范围宽（启停炉时变化大）", "", ""], "r": "ABD", "e": "循环水含泥沙会磨损仪表，大口径管道对仪表安装和测量有挑战，流量范围宽在启停炉时变化大，这些都增加了循环水流量测量的难度，而介质温度在20 - 40℃无特殊影响，不是测量难点。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389704", "t": 2, "q": "火电机组中，压力仪表的定期校验内容包括下列哪些?", "a": ["重复性检查（多次测量同一点，误差是否一致）", "零点校准（调整仪表零位）", "线性度检查（验证各点误差是否符合等级）", "量程校准（调整仪表满量程）", "", ""], "r": "ABCD", "e": "压力仪表定期校验需保证测量准确可靠，重复性检查可确保多次测量稳定性，零点校准保证零位准确，线性度检查验证全量程误差是否达标，量程校准保证满量程测量准确，ABCD四个选项都是校验的必要内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389705", "t": 2, "q": "火电机组中测量炉膛压力时，下列哪些因素会导致测量误差?", "a": ["炉膛压力波动剧烈", "环境温度变化", "导压管堵塞", "测量点选择不当（如靠近喷燃器）", "", ""], "r": "ACD", "e": "答案：ACD炉膛压力波动剧烈会导致测量值不稳定，产生误差；导压管堵塞会影响压力的传导，从而导致测量误差；测量点选择不当，如靠近喷燃器，可能会受到局部高温、高压的影响，使测量结果偏离真实值。而环境温度变化对炉膛压力的测量影响相对较小，不是主要导致测量误差的因素。", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389706", "t": 2, "q": "火电机组中测量压力时，导压管的安装要求包括下列哪些，以避免测量误差?", "a": ["避免靠近高温设备（防止介质汽化）", "导压管内径选择合适（通常6-10mm）", "弯曲处采用缓弯（减少压力损失）", "导压管坡度≥1:100（便于排液或排气）", "", ""], "r": "ABCD", "e": "A避免高温防止介质汽化影响测量；B合适内径保证压力传递；C缓弯减少压力损失保障测量；D一定坡度利于排液排气，均是为避免测量误差的安装要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389707", "t": 2, "q": "火电机组中测量压力时，下列哪些压力属于相对压力测量?", "a": ["汽轮机润滑油压力", "凝汽器真空度", "锅炉汽包压力", "炉膛负压", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389708", "t": 2, "q": "火电机组中测量压力时，下列哪些因素会导致系统误差?", "a": ["测量元件安装倾斜", "测量介质密度变化", "环境温度变化导致仪表特性漂移", "仪表校准不准确", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389709", "t": 2, "q": "火电机组中测量蒸汽流量时，若采用标准节流装置，需配套测量下列哪些参数以进行流量补偿?", "a": ["节流装置前后差压（流量计算）", "蒸汽含湿量（干度补偿）", "蒸汽温度（密度补偿）", "蒸汽压力（密度补偿）", "", ""], "r": "ACD", "e": "测量蒸汽流量用标准节流装置时，流量与节流装置前后差压有关，蒸汽密度会随温度和压力变化，需对密度补偿，所以要测温度和压力。含湿量一般不是常规流量补偿需测量的参数。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389710", "t": 2, "q": "火电机组中测量蒸汽流量时，下列哪些因素会影响差压式流量计的测量精度?", "a": ["节流装置安装偏差", "蒸汽压力变化", "蒸汽温度变化", "蒸汽含湿量变化", "", ""], "r": "ABCD", "e": "节流装置安装偏差会使测量的差压不准确，影响精度；蒸汽压力、温度变化会改变蒸汽密度，含湿量变化会改变蒸汽性质，都会影响差压式流量计基于密度等参数的测量。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389711", "t": 2, "q": "火电机组中测量蒸汽温度时，下列哪些测温仪表的测量精度较高?", "a": ["铂热电阻", "铂铑-铂热电偶", "双金属温度计", "红外辐射温度计", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389712", "t": 2, "q": "汽轮机参数测量中，下列哪些参数属于必测的关键参数?", "a": ["排汽压力", "轴承温度", "轴向位移", "转速", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389713", "t": 2, "q": "汽轮机排汽温度测量的目的包括下列哪些?", "a": ["保护汽轮机末级叶片", "监测凝汽器工作状态", "计算汽轮机热效率", "判断汽轮机是否发生水冲击", "", ""], "r": "ABCD", "e": "排汽温度过高可能影响末级叶片，可通过监测排汽温度保护末级叶片；排汽温度能反映凝汽器冷却效果，可监测其工作状态；排汽温度是计算热效率的参数之一；水冲击时排汽温度会有变化，能辅助判断。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389714", "t": 2, "q": "汽轮机润滑油系统参数测量中，除润滑油压力外，还需测量下列哪些参数?", "a": ["润滑油油位（防止油泵吸空）", "润滑油污染度（反映油清洁度）", "润滑油粘度（反映油质状态）", "润滑油温度（防止油膜破坏）", "", ""], "r": "ABCD", "e": "测量润滑油油位可防止油泵吸空，污染度反映油清洁度，粘度体现油质状态，温度能避免油膜破坏，这些参数对汽轮机润滑油系统都很重要。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389715", "t": 2, "q": "汽轮机真空系统参数测量中，除凝汽器真空度外，还需测量下列哪些参数以监控系统状态?", "a": ["真空泵入口压力", "凝汽器排汽温度", "真空系统漏空气量", "凝汽器水位", "", ""], "r": "ABCD", "e": "测量真空泵入口压力可了解真空泵工作状态；凝汽器排汽温度能反映凝汽效果；真空系统漏空气量直接体现系统密封性；凝汽器水位对真空系统运行也有重要影响，这些参数都有助于监控汽轮机真空系统状态。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389716", "t": 2, "q": "汽轮机振动测量中，\"振动烈度\"的测量参数包括下列哪些，以综合评价振动状态?", "a": ["振动位移（峰峰值，μm）", "振动频率（Hz）", "振动加速度（峰值，m/s²）", "振动速度（有效值，mm/s）", "", ""], "r": "ACD", "e": "答案：ACD在汽轮机振动测量中，“振动烈度”是一个综合评价振动状态的指标。它通常包括振动位移（峰峰值，μm）、振动加速度（峰值，m/s²）和振动速度（有效值，mm/s）这三个测量参数。这些参数能够全面反映振动的幅度、速度和加速度特性，从而更准确地评估设备的振动状态。而振动频率（Hz）虽然也是振动的一个重要参数，但它更多地用于分析振动的特性和来源，而不是直接用于评价振动烈度。因此，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389717", "t": 2, "q": "汽轮机轴承温度测量中，常用的测温元件包括下列哪些?", "a": ["镍铬-镍硅热电偶（K型）", "铂热电阻（PT100）", "镍铬-铜镍热电偶（E型）", "铜热电阻（Cu50）", "", ""], "r": "AB", "e": "汽轮机轴承温度测量要求测温元件精度高、稳定性好。铂热电阻（PT100）精度高、性能稳定，常用于轴承温度测量；镍铬 - 镍硅热电偶（K型）测温范围广、性能可靠，也常用。而镍铬 - 铜镍热电偶（E型）一般用于低温测量，铜热电阻（Cu50）精度和稳定性相对较差，较少用于汽轮机轴承温度测量。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389718", "t": 2, "q": "汽轮机轴承振动测量中，常用的振动传感器类型包括下列哪些?", "a": ["压电式传感器", "电涡流传感器", "电容式传感器", "磁电式传感器", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389719", "t": 2, "q": "汽轮机轴向位移测量的目的包括下列哪些?", "a": ["判断汽轮机负荷变化", "监测汽轮机转子的膨胀情况", "防止动静部件摩擦", "保护汽轮机推力轴承", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389720", "t": 2, "q": "汽轮机轴向位移测量中，电涡流传感器的安装要求包括下列哪些?", "a": ["传感器轴线与转子端面垂直（避免角度误差）", "远离强磁场（避免电磁干扰）", "传感器与转子间隙符合要求（通常0.5-1.0mm）", "安装支架刚性足够（防止振动导致间隙变化）", "", ""], "r": "ABCD", "e": "电涡流传感器用于汽轮机轴向位移测量，A选项保证测量准确性；B选项防止外界磁场影响测量信号；C选项间隙在合适范围才能正常工作；D选项确保安装稳定避免因振动使测量不准。这些都是安装的必要要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389721", "t": 2, "q": "汽轮机转速保护系统中，转速测量的冗余设计包括下列哪些?", "a": ["传感器信号送不同的PLC模块（避免单模块故障）", "设置超速保护定值（如3300r/min）", "采用3套独立的转速传感器（如磁电式+光电式）", "定期校准转速传感器（保证精度）", "", ""], "r": "AC", "e": "冗余设计目的是提高系统可靠性，当部分部件故障时仍能正常工作。A将信号送不同PLC模块、C采用3套独立转速传感器，都能在部分部件故障时维持系统对转速的测量，属于冗余设计。B设置超速保护定值是保护功能，D定期校准传感器是保证测量精度，都不属于冗余设计。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389722", "t": 2, "q": "汽轮机转速测量的精度要求包括下列哪些?", "a": ["动态转速测量响应时间≤100ms", "分辨率≤1r/min", "稳态转速测量误差≤±0.1%", "量程覆盖0-3600r/min（常用）", "", ""], "r": "ABCD", "e": "汽轮机转速测量需满足多方面精度要求，A选项动态响应时间短可及时反映转速变化；B选项分辨率高利于精确测量；C选项稳态测量误差小保证测量准确性；D选项合适量程能满足常用工况测量。答案ABCD涵盖了这些精度要求方面。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389723", "t": 2, "q": "下列哪些测量误差属于\"动态误差\"，即与测量信号的变化速度相关?", "a": ["热电偶测量快速变化温度时的滞后误差", "压力传感器测量脉冲压力时的响应误差", "液位仪表测量静态液位时的示值误差", "流量仪表测量瞬时流量波动时的跟随误差", "", ""], "r": "ABD", "e": "动态误差与测量信号变化速度相关。A选项热电偶测快速变温的滞后、B选项压力传感器测脉冲压力的响应误差、D选项流量仪表测瞬时流量波动的跟随误差，都和测量信号变化速度有关；而C选项是测量静态液位的误差，与信号变化速度无关。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389724", "t": 2, "q": "下列哪些测量仪表的\"量程调整\"方式属于\"硬件调整\"，而非软件补偿?", "a": ["电容式液位计调整电极长度（改变测量范围）", "差压式流量计更换不同孔径的孔板", "弹簧管压力计调整游丝张力（改变量程）", "热电偶温度计更换不同分度号的补偿导线", "", ""], "r": "ABC", "e": "硬件调整指通过改变仪表实际物理结构来调整量程。A调整电极长度、B更换孔板、C调整游丝张力都是改变了仪表物理结构。而D更换补偿导线主要是为补偿热电偶冷端温度，不是调整量程的硬件操作。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389725", "t": 2, "q": "下列哪些测量仪表的\"误差来源\"包括\"安装误差\"，即安装不当导致的误差?", "a": ["差压式流量计（孔板安装偏心）", "磁电式转速传感器（传感器与齿轮间隙过大）", "电容式液位计（电极与容器壁距离不均）", "热电偶温度计（安装方向与介质流向不一致）", "", ""], "r": "ABCD", "e": "各选项均是因安装不当产生误差，A孔板安装偏心、B传感器与齿轮间隙过大、C电极与容器壁距离不均、D安装方向与介质流向不一致都属于安装误差。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389726", "t": 2, "q": "下列哪些测温仪表的\"冷端处理\"方式适用于热电偶温度计，以消除冷端温度影响?", "a": ["冷端恒温法（如将冷端置于恒温槽）", "冷端迁移法（如软件修正冷端温度）", "冷端补偿法（如采用补偿导线+补偿电桥）", "冷端接地法（将冷端接地避免干扰）", "", ""], "r": "ABC", "e": "热电偶温度计需处理冷端温度影响，冷端恒温法可使冷端温度恒定，冷端迁移法可通过软件修正，冷端补偿法用补偿导线和电桥来补偿，而冷端接地主要防干扰，并非处理冷端温度。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389727", "t": 2, "q": "下列哪些测温仪表适用于火电机组不同温度范围的测量，匹配正确的有?", "a": ["镍铬-镍硅热电偶（K型）——-200-1300℃（锅炉给水温度）", "红外辐射温度计——1000-2000℃（锅炉火焰温度）", "铂热电阻——0-500℃（汽轮机轴承温度）", "铂铑30-铂铑6热电偶（B型）——600-1800℃（锅炉炉膛温度）", "", ""], "r": "BCD", "e": "逐一分析各选项： A项：锅炉给水温度一般在100 - 200℃左右，K型热电偶适用范围虽广，但此匹配场景不合理。 B项：红外辐射温度计可测高温，能用于测锅炉火焰温度，范围也相符。 C项：汽轮机轴承温度通常在几十到一百多度，铂热电阻适用范围合适。 D项：B型热电偶适用于高温测量，锅炉炉膛温度高，此匹配合理。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389728", "t": 2, "q": "下列哪些流量测量仪表的测量原理与\"流体流动时的漩涡现象\"相关?", "a": ["孔板流量计", "涡轮流量计", "旋进漩涡流量计", "涡街流量计", "", ""], "r": "CD", "e": "A孔板流量计基于流体流经节流装置时产生压差；B涡轮流量计靠流体推动涡轮旋转测量；C旋进漩涡流量计和D涡街流量计都与流体流动时的漩涡现象相关。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389729", "t": 2, "q": "下列哪些流量测量仪表属于速度式流量仪表?", "a": ["超声波流量计", "电磁流量计", "涡街流量计", "椭圆齿轮流量计", "", ""], "r": "ABC", "e": "速度式流量仪表是通过测量流体的速度来计算流量。A超声波流量计利用超声波在流体中的传播特性测流速；B电磁流量计基于电磁感应原理测流速；C涡街流量计是利用流体振荡测流速。而D椭圆齿轮流量计是容积式流量仪表，通过测量流体的容积来确定流量。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389730", "t": 2, "q": "下列哪些流量仪表的测量结果不受介质粘度变化的影响?", "a": ["超声波流量计", "椭圆齿轮流量计", "科里奥利质量流量计", "电磁流量计", "", ""], "r": "ACD", "e": "超声波流量计基于超声波在流体中的传播特性测量，科里奥利质量流量计利用流体在振动管中流动产生的科里奥利力测量，电磁流量计依据电磁感应原理测量，它们测量结果不受介质粘度影响；椭圆齿轮流量计靠齿轮与流体相互作用测量，受粘度影响大。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389731", "t": 2, "q": "下列哪些流量仪表的测量结果需要进行\"压力补偿\"，以修正压力变化的影响?", "a": ["涡街流量计（测量蒸汽流量）", "差压式流量计（测量气体流量）", "超声波流量计（测量气体流量）", "电磁流量计（测量液体流量）", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389732", "t": 2, "q": "下列哪些流量仪表可用于测量气体流量（如锅炉烟气流量）?", "a": ["涡街流量计", "差压式流量计（孔板）", "皮托管流量计", "电磁流量计", "", ""], "r": "ABC", "e": "涡街、差压（孔板）、皮托管流量计都可测气体流量；电磁流量计基于电磁感应原理，只能测导电液体，不能测气体。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389733", "t": 2, "q": "下列哪些流量仪表适用于测量大流量流体的流量（如循环水流量）?", "a": ["超声波流量计", "差压式流量计（孔板）", "涡街流量计", "电磁流量计", "", ""], "r": "AD", "e": "超声波流量计可用于大管径、大流量测量，安装方便且不影响流体流动；差压式（孔板）在大流量时压力损失大、精度受限；涡街流量计一般适用于中小管径；电磁流量计对大流量测量也适用，且精度高、压力损失小。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389734", "t": 2, "q": "下列哪些流量仪表适用于测量导电液体的流量（如锅炉给水）?", "a": ["电磁流量计", "差压式流量计", "科里奥利质量流量计", "超声波流量计", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389735", "t": 2, "q": "下列哪些流量仪表适用于测量低流速流体的流量（如润滑油流量）?", "a": ["电磁流量计", "热式质量流量计", "容积式流量计", "椭圆齿轮流量计", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389736", "t": 2, "q": "下列哪些流量仪表属于\"非侵入式\"测量仪表，即不与被测流体直接接触?", "a": ["电磁流量计", "外夹式超声波流量计", "插入式涡街流量计", "雷达流量计", "", ""], "r": "BD", "e": "外夹式超声波流量计安装在管道外部，雷达流量计通过发射电磁波测量，二者都不与被测流体直接接触。电磁流量计电极需与流体接触，插入式涡街流量计探头插入流体中。所以答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389737", "t": 2, "q": "下列哪些流量仪表属于质量流量仪表?", "a": ["热式质量流量计", "差压式流量计（带密度补偿）", "电磁流量计（带密度补偿）", "科里奥利质量流量计", "", ""], "r": "AD", "e": "质量流量仪表是直接测量流体质量流量的仪表。以下是对各选项的A. 热式质量流量计 - 直接测量质量流量，基于流体通过加热元件时的温度变化来计算流量，属于质量流量仪表。B. 差压式流量计（带密度补偿） - 原理上差压式流量计测量的是体积流量，但通过密度补偿可以转换为质量流量。然而，它本质上仍是基于体积测量的，只是经过补偿后可用于质量流量计算。C. 电磁流量计（带密度补偿） - 电磁流量计同样是测量体积流量的仪表，即使加上密度补偿，也只是间接计算质量流量，并非直接测量。D. 科里奥利质量流量计 - 直接测量质量流量，利用科里奥利力原理来确定流体的质量流量，是典型的质量流量仪表。综上所述，直接测量质量流量的仪表是热式质量流量计和科里奥利质量流量计。所以，正确答案是AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389738", "t": 2, "q": "下列哪些热电偶的热电势与温度呈线性关系较好?", "a": ["T型（铜-铜镍）", "E型（镍铬-铜镍）", "S型（铂铑10-铂）", "K型（镍铬-镍硅）", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389739", "t": 2, "q": "下列哪些热电偶适用于高温测量（1000℃以上）?", "a": ["R型（铂铑13-铂）", "S型（铂铑10-铂）", "B型（铂铑30-铂铑6）", "K型（镍铬-镍硅）", "", ""], "r": "ABC", "e": "R、S、B型热电偶都是铂铑系列热电偶，常用于高温测量，其中B型热电偶可测1600℃高温，适用于1000℃以上；K型热电偶测量范围一般为 -200℃～1300℃，常用于中温测量。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389740", "t": 2, "q": "下列哪些温标可用于火电机组的工业温度测量?", "a": ["华氏温标", "开尔文温标", "列氏温标", "摄氏温标", "", ""], "r": "BD", "e": "答案：BD火电机组工业温度测量通常使用国际上广泛认可的标准温标。开尔文温标是国际单位制中的基本温标，摄氏温标则是基于开尔文温标的常用温标，它们在工业领域包括火电机组中都得到广泛应用。华氏温标主要用于美国等少数国家的日常生活和工业中，而在国际标准和大多数工业应用中不常用。列氏温标则更为古老且已较少使用，不是火电机组工业温度测量的常用温标。", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389741", "t": 2, "q": "下列哪些温度测量仪表属于接触式测温仪表?", "a": ["热电阻温度计", "热电偶温度计", "红外辐射温度计", "双金属温度计", "", ""], "r": "ABD", "e": "接触式测温需与被测物体接触，热电阻、热电偶、双金属温度计都要和被测对象接触来测温；红外辐射温度计是通过接收物体红外辐射来测温度，无需接触。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389742", "t": 2, "q": "下列哪些压力测量误差与\"测量介质的物理状态变化\"相关?", "a": ["测量蒸汽压力时，导压管内蒸汽冷凝导致的误差", "测量腐蚀性介质时，介质腐蚀传感器导致的误差", "测量粘稠介质时，介质堵塞导压管导致的误差", "测量高温油压力时，介质汽化导致的误差", "", ""], "r": "AD", "e": "A选项蒸汽冷凝、D选项介质汽化都属于测量介质物理状态变化，B是介质腐蚀，C是介质堵塞，均与介质物理状态变化无关。答案：AD", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389743", "t": 2, "q": "下列哪些压力测量仪表基于弹性形变原理工作?", "a": ["波纹管压力计", "膜片式压力计", "应变式压力传感器", "弹簧管压力计", "", ""], "r": "ABD", "e": "波纹管、膜片、弹簧管在压力作用下会产生弹性形变，可用于压力测量；应变式压力传感器是基于电阻应变效应工作。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803712383389744", "t": 2, "q": "下列哪些压力测量仪表适用于测量负压（如炉膛负压）?", "a": ["差压式压力变送器", "压电式压力传感器", "弹性式压力计（弹簧管）", "电容式压力传感器", "", ""], "r": "ACD", "e": "差压式压力变送器可通过测量差压来测负压；弹性式压力计（弹簧管）有真空表可测负压；电容式压力传感器利用电容变化测压力，能测负压。而压电式压力传感器主要用于动态压力测量，不适用于稳定的负压测量。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064448", "t": 3, "q": "差压式流量计的测量范围可通过更换不同孔径的节流件（如孔板）来调整，孔径越小，测量量程越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "差压式流量计更换不同孔径节流件可调整测量范围，孔径越小，流体通过节流件时的阻力越大，能测量的流量范围下限越低，上限也越低，即测量量程越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064449", "t": 3, "q": "差压式流量计的节流件（如孔板）必须安装在水平管道上，不能安装在垂直管道上，否则会影响测量精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "差压式流量计的节流件并非只能安装在水平管道，也可安装在垂直管道，只要满足一定安装要求和条件，不会必然影响测量精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064450", "t": 3, "q": "差压式液位计测量闭口容器液位时，若容器内压力高于大气压，其正负压端的差压仅由液位高度决定，与容器内压力无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "差压式液位计测量闭口容器液位，容器内压力高于大气压时，正负压端差压等于液位高度产生的压力加上容器内压力，并非仅由液位高度决定。", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064451", "t": 3, "q": "电磁流量计的测量精度不受流体流速分布的影响，因为其测量的是管道截面的平均流速。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电磁流量计基于法拉第电磁感应定律，测量的是管道内平均流速，测量精度的确不受流体流速分布的影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064452", "t": 3, "q": "电磁流量计只能测量导电液体的流量，不能测量气体或绝缘液体（如油类）的流量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电磁流量计基于电磁感应原理工作，需要流体导电才能产生感应电动势来测量流量，气体和绝缘液体不导电无法用其测量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064453", "t": 3, "q": "电容式压力传感器的测量原理是基于压力变化导致电容极板间距变化，进而使电容值变化，与介质介电常数无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电容式压力传感器不仅与极板间距有关，介质介电常数也会影响电容值，题干说与介质介电常数无关错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064454", "t": 3, "q": "电容式液位计的测量精度不受被测液体介电常数变化的影响，因为其仅与液位高度相关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电容式液位计测量与被测液体介电常数有关，介电常数变化会影响测量精度，并非仅与液位高度相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064455", "t": 3, "q": "火电机组中，过程参数测量的仪表量程选择应使正常测量值处于量程的1/3-2/3范围内，以保证测量精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在火电机组里，为保证测量精度，过程参数测量仪表量程选择通常要让正常测量值处于量程的1/3 - 2/3范围。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064456", "t": 3, "q": "火电机组中，过程参数测量的仪表选型时，应优先选择数字式仪表，因为其抗干扰能力强，便于数据通信。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数字式仪表抗干扰能力强且便于数据通信等优点突出，在火电机组过程参数测量仪表选型时优先选它合理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064457", "t": 3, "q": "火电机组中，压力仪表的安装高度应与测量点高度一致，若存在高度差，需进行液位差修正，以消除静压力误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在火电机组里，压力仪表安装高度和测量点高度不一致时，液柱会产生静压力影响测量结果，所以要进行液位差修正消除误差。", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064458", "t": 3, "q": "火电机组中测量锅炉给水流量时，若给水含气量较高，电磁流量计的测量值会偏高，因为气体气泡导致导电率降低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电磁流量计是基于电磁感应原理工作，测量导电液体体积流量。给水含气量高时，气体不导电且气泡会占据一定空间，使参与切割磁感线的导电介质减少，测量值会偏低，并非偏高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064459", "t": 3, "q": "火电机组中测量锅炉炉膛负压时，采用U型管压力计的测量精度高于应变式压力传感器。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "应变式压力传感器精度高、响应快、测量范围广且能实现自动记录和远传等，而U型管压力计受人为读数等因素影响，精度较低。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064460", "t": 3, "q": "火电机组中测量锅炉炉膛温度时，采用红外辐射温度计的测量精度高于铂铑-铂热电偶，因为其无需接触高温介质，无热惯性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064461", "t": 3, "q": "火电机组中测量锅炉汽包压力时，导压管的安装坡度应≥1:100，且应向汽包方向倾斜，以便冷凝水回流。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064462", "t": 3, "q": "火电机组中测量锅炉汽汽包液位时，采用雷达液位计比差压式液位计更适合，因为其不受汽包压力和温度变化的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "雷达液位计利用电磁波测量液位，确实不受汽包压力和温度变化影响，而差压式液位计受汽包压力和温度影响较大，所以火电机组测量锅炉汽包液位，雷达液位计更合适。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064463", "t": 3, "q": "火电机组中测量凝汽器真空度时，真空度的数值等于大气压与凝汽器内绝对压力的差值，单位通常为kPa。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "真空度定义就是大气压与绝对压力差值，火电机组凝汽器真空度也如此，单位常用kPa 。", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064464", "t": 3, "q": "火电机组中测量循环水流量时，采用电磁流量计的测量精度高于涡街流量计，因为循环水含泥沙，涡街流量计易磨损。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "循环水含泥沙，涡街流量计的检测元件易被磨损影响测量，而电磁流量计不受此影响，测量精度相对更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064465", "t": 3, "q": "火电机组中测量循环水流量时，外夹式超声波流量计比插入式电磁流量计更适合，因为其无需停水安装，且不受水中泥沙的磨损影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外夹式超声波流量计安装时确实无需停水，也不会受水中泥沙磨损影响，在火电机组测量循环水流量场景中，相比插入式电磁流量计有这些优势，所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034803713801064466", "t": 3, "q": "火电机组中测量压力时，若导压管内存在气体（测量液体压力时），会导致测量值偏高，因为气体压缩性使压力传递滞后。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, f
