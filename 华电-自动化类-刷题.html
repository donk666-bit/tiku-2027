"", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856871", "t": 2, "q": "自动控制系统中，控制器的作用包括", "a": ["对偏差信号进行处理（如放大、积分、微分）", "直接控制被控对象", "产生控制信号，驱动执行机构", "接收偏差信号", "", ""], "r": "ACD", "e": "控制器接收偏差信号，对其处理（如放大、积分、微分）后产生控制信号驱动执行机构，不直接控制被控对象。答案为ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803647828856872", "t": 2, "q": "自动控制系统中，扰动信号的作用位置可能包括", "a": ["反馈环节输入端", "被控对象输入端", "控制器输出端", "输入信号输入端", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228416", "t": 3, "q": "利用劳斯判据分析四阶系统时，若劳斯阵列出现全零行，则系统存在纯虚根。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228417", "t": 3, "q": "利用劳斯判据分析四阶系统s⁴+2s³+3s²+4s+5=0时，该系统稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "劳斯判据中，系统稳定的必要条件是特征方程各项系数均大于零，此方程满足；但劳斯表第一列元素需均为正系统才稳定，列出该四阶系统劳斯表，第一列元素会出现负数，不满足稳定条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228418", "t": 3, "q": "利用劳斯判据分析系统时，若劳斯阵列第一列出现负元素，则系统不稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "劳斯判据中，系统稳定的充要条件是劳斯阵列第一列元素均为正，所以若第一列出现负元素，系统不稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228419", "t": 3, "q": "利用劳斯判据分析系统时，若劳斯阵列某一行所有元素均为零，则系统存在对称极点（关于实轴或原点对称）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "劳斯阵列某一行所有元素为零是系统存在对称于原点的根（包括实轴和虚轴上对称、共轭复根对称等）的标志。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228420", "t": 3, "q": "利用劳斯判据分析系统稳定性时，若劳斯阵列第一列所有元素均为正，则系统稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "劳斯判据表明，系统稳定的充要条件是劳斯阵列第一列所有元素均为正。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228421", "t": 3, "q": "两个线性定常系统串联，总传递函数为两个系统传递函数的乘积（零初始条件下）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在零初始条件下，线性定常系统串联时，总传递函数等于各串联系统传递函数的乘积，这是线性定常系统串联的基本性质。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228422", "t": 3, "q": "描述函数法分析非线性系统时，假设非线性环节的输入为正弦信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "描述函数法是基于谐波线性化的理论，分析非线性系统时，通常假设非线性环节的输入是正弦信号，再研究其输出的基波分量。", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228423", "t": 3, "q": "描述函数法是一种精确分析非线性系统的方法。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "描述函数法是一种近似分析非线性系统的方法，并非精确分析方法。", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228424", "t": 3, "q": "描述函数法要求线性部分具有高通滤波特性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "描述函数法要求线性部分具有低通滤波特性，这样才能使非线性环节输出中的高次谐波被充分衰减，便于用基波分量近似输出。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228425", "t": 3, "q": "描述函数法中，非线性环节的描述函数N(A)与输入信号的频率有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "描述函数法中，非线性环节的描述函数N(A)只与输入信号的幅值A有关，与输入信号的频率无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228426", "t": 3, "q": "描述函数法中，非线性环节的输入输出特性需满足奇对称性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在描述函数法里，为使分析简化，通常要求非线性环节的输入输出特性满足奇对称性，这样可消除输出中的直流分量，便于后续计算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228427", "t": 3, "q": "描述函数法中，若-1/G(jω)轨迹完全位于非线性环节描述函数N(A)的右侧，则系统存在自激振荡。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在描述函数法里，若 -1/G(jω) 轨迹完全位于非线性环节描述函数 N(A) 右侧，系统是稳定的，不存在自激振荡。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228428", "t": 3, "q": "描述函数法中，若非线性环节的描述函数N(A)与-1/G(jω)轨迹相交，则系统一定存在自激振荡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228429", "t": 3, "q": "奈奎斯特判据适用于非线性系统的稳定性分析。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "奈奎斯特判据是针对线性定常系统的稳定性分析方法，并非用于非线性系统。", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228430", "t": 3, "q": "奈奎斯特判据中，开环频率特性G(jω)H(jω)包围(-1,j0)点的次数N与闭环右半s平面极点个数Z的关系为Z=P-N（P为开环右半极点个数）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是奈奎斯特判据中关于开环频率特性包围点次数、闭环右半 s 平面极点个数与开环右半极点个数关系的基本定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228431", "t": 3, "q": "奈奎斯特判据中，开环频率特性G(jω)H(jω)的轨迹关于实轴对称（ω从-∞到∞）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据奈奎斯特判据相关知识，开环频率特性「test/yiwen_img/importSubject/2034803641944248320.png」满足「test/yiwen_img/importSubject/2034803642032328704.png」，所以其轨迹关于实轴对称（「test/yiwen_img/importSubject/2034803642116214784.png」从「test/yiwen_img/importSubject/2034803642191712256.png」到「test/yiwen_img/importSubject/2034803642263015424.png」）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228432", "t": 3, "q": "奈奎斯特判据中，开环系统稳定（P=0）时，若奈奎斯特曲线不包围(-1,j0)点（N=0），则闭环系统稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据奈奎斯特判据，闭环系统稳定的条件是Z = P - 2N，当P = 0且N = 0时，Z = 0，闭环系统稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228433", "t": 3, "q": "若闭环系统右半s平面极点个数Z=0，则系统稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据奈奎斯特稳定判据，闭环系统稳定的充要条件是Z = 0（Z为闭环系统右半s平面极点个数）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228434", "t": 3, "q": "若线性定常系统对输入r1(t)的零状态响应为c1(t)，对输入r2(t)的零状态响应为c2(t)，则系统对输入r1(t)+r2(t)的零状态响应为c1(t)+c2(t)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统满足叠加性，即若系统对不同输入的零状态响应分别为对应响应，那么对这些输入之和的零状态响应就是各响应之和。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228435", "t": 3, "q": "微分环节的阶跃输入下，输出为无穷大，随后迅速衰减至零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228436", "t": 3, "q": "微分环节可提高系统的抗干扰能力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "微分环节对噪声干扰有放大作用，会降低系统抗干扰能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228437", "t": 3, "q": "稳态误差是衡量自动控制系统动态性能的指标。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "稳态误差是衡量系统控制精度的指标，属于稳态性能，而非动态性能。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228438", "t": 3, "q": "系统校正中，超前校正装置的主要作用是提高系统的稳态精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超前校正装置主要是利用其相角超前特性，增大系统的相位裕度，改善系统动态性能，而提高系统稳态精度主要靠积分环节等，并非超前校正装置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228439", "t": 3, "q": "系统校正中，滞后-超前校正可同时提高系统的相角裕度和稳态精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "滞后 - 超前校正结合了滞后校正和超前校正的优点，超前部分可增加相角裕度提高稳定性，滞后部分能提高稳态精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228440", "t": 3, "q": "系统型别由开环传递函数中积分环节的个数决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228441", "t": 3, "q": "线性定常系统的传递函数分母多项式的次数称为系统的阶次。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在控制理论中，线性定常系统传递函数分母多项式的次数就是定义为系统的阶次。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228442", "t": 3, "q": "线性定常系统的传递函数与系统的初始条件有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "传递函数是在零初始条件下，系统输出量的拉氏变换与输入量的拉氏变换之比。它只取决于系统的结构和参数，与系统的初始条件无关。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228443", "t": 3, "q": "线性定常系统的单位脉冲响应g(t)的拉普拉斯变换等于系统的传递函数G（　）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据传递函数定义，线性定常系统的传递函数是零初始条件下系统输出的拉普拉斯变换与输入的拉普拉斯变换之比。单位脉冲输入的拉普拉斯变换为1，系统单位脉冲响应g(t)的拉普拉斯变换就是系统输出拉普拉斯变换，所以其等于系统传递函数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228444", "t": 3, "q": "线性定常系统的叠加原理适用于系统的所有响应。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统的叠加原理只适用于系统的零状态响应，不适用于包含初始状态影响的全响应。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228445", "t": 3, "q": "线性定常系统的幅频特性是频率ω的奇函数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统幅频特性是频率ω的偶函数，不是奇函数。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228446", "t": 3, "q": "线性定常系统的零点不影响系统的稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统的稳定性由系统极点决定，零点影响系统的动态响应形状等，但不影响稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228447", "t": 3, "q": "线性定常系统的零输入响应与系统的初始条件有关，与输入信号无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统零输入响应是指输入信号为零，仅由系统初始条件引起的响应，所以其只与初始条件有关，和输入信号无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228448", "t": 3, "q": "线性定常系统的稳定性仅由系统的闭环极点位置决定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统稳定性取决于系统特征方程根的分布，也就是闭环极点位置，若闭环极点都位于左半 s 平面，系统稳定，否则不稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228449", "t": 3, "q": "相角裕度是开环频率特性在截止频率ωc处的相角与-180°的差值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "相角裕度定义就是开环频率特性在截止频率ωc处的相角与 -180°的差值。", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228450", "t": 3, "q": "相角裕度γ是开环频率特性在截止频率ωc处的相角与-180°之差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "相角裕度γ的定义就是开环频率特性在截止频率ωc处的相角与 - 180°之差。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228451", "t": 3, "q": "正反馈常用于改善自动控制系统的稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "正反馈会使系统输出偏离目标值越来越大，不利于系统稳定，负反馈才常用于改善自动控制系统的稳定性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228452", "t": 3, "q": "滞后-超前校正装置的滞后部分主要用于提高系统的相角裕度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "滞后 - 超前校正装置中，超前部分主要用于提高系统的相角裕度，滞后部分主要用于改善系统的稳态性能。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228453", "t": 3, "q": "滞后校正装置的传递函数为(1+T1s)/(1+T2s)，其中T1<T2。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "滞后校正装置的传递函数标准形式是(1 + βT s)/(1 + T s) （β>1），也就是分子时间常数小于分母时间常数。题中T1 < T2符合这一特征，所以表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228454", "t": 3, "q": "滞后校正装置会降低系统的截止频率ωc。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "滞后校正装置主要作用是在不影响系统稳态性能的前提下，降低系统的截止频率ωc，提高系统的相角裕度，增强系统稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228455", "t": 3, "q": "自动控制系统中，被控对象是指需要控制其物理量的设备或过程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "自动控制系统里，被控对象的确是需对其物理量进行控制的设备或过程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228456", "t": 3, "q": "自动控制系统中，闭环控制的抗干扰能力弱于开环控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "闭环控制能根据输出结果反馈调整，可有效应对干扰；开环控制无反馈，无法针对干扰调整。所以闭环控制抗干扰能力强于开环控制，该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228457", "t": 3, "q": "自动控制系统中，负反馈会增大系统的稳态误差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "负反馈能减小系统的稳态误差，提高系统的控制精度，而不是增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228458", "t": 3, "q": "自动控制系统中，开环控制的精度通常高于闭环控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "闭环控制有反馈环节，能根据输出与期望的偏差不断调整，精度更高；开环控制无反馈，精度较低。", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228459", "t": 3, "q": "自动控制系统中，扰动信号只会降低系统的控制精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "扰动信号不一定只会降低系统控制精度，有些情况下系统可通过自身调节抵消扰动影响，甚至利用扰动来优化控制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228460", "t": 3, "q": "自动控制系统中的被控量是系统的输入信号。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自动控制系统中，被控量是系统的输出信号，而输入信号是外界给系统的作用，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228461", "t": 3, "q": "阻尼比ζ=0.707的二阶系统，其单位阶跃响应的超调量σ%约为16.3%。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228462", "t": 3, "q": "最小相位系统的开环幅频特性与相频特性一一对应。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最小相位系统是指在右半 s 平面上既无极点也无零点的系统，其开环幅频特性与相频特性存在一一对应关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803649175228463", "t": 3, "q": "最小相位系统的相角裕度γ<0时，系统稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "对于最小相位系统，相角裕度γ>0时系统稳定，γ<0时系统不稳定。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 现代控制理论（1）", "n": "基础练习题【含解析】 / 第2章 现代控制理论（1）", "qs": [{"id": "2034803658067152896", "t": 1, "q": "对于线性定常非齐次状态方程x_dot=A x+B u，其解的组成部分不包括", "a": ["系统矩阵A的特征值引起的暂态响应", "输出矩阵C引起的稳态响应", "初始状态引起的自由响应", "输入信号引起的强迫响应", "", ""], "r": "B", "e": "线性定常非齐次状态方程解包含初始状态引起的自由响应和输入信号引起的强迫响应，自由响应与系统矩阵A特征值有关会产生暂态响应。而输出矩阵C用于输出方程，不影响状态方程解的组成。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152897", "t": 1, "q": "对于线性定常系统，若状态转移矩阵Φ(t)满足Φ(t₀,t₁)Φ(t₁,t₀)=I（I为单位矩阵），则Φ(t₀,t₁)表示的是", "a": ["从时刻t₀到t₁的状态转移", "从时刻t₁到t₁的状态转移", "从时刻t₁到t₀的状态转移", "从时刻t₀到t₀的状态转移", "", ""], "r": "A", "e": "状态转移矩阵Φ(t₀,t₁) 中，前面的 t₀ 是起始时刻，后面的 t₁ 是终止时刻，所以它表示从时刻 t₀ 到 t₁ 的状态转移。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152898", "t": 1, "q": "对于线性定常系统（A,C）的能观性，以下关于能观性矩阵O=[C;C A;C A²;...;C A^(n-1)]（n为系统阶数，分号表示行堆叠）的说法正确的是", "a": ["系统能观的充要条件是O的秩等于系统阶数n", "系统能观的充要条件是O为方阵", "系统能观的充要条件是O的秩等于输入变量个数p", "系统能观的充要条件是O为满行秩矩阵", "", ""], "r": "A", "e": "线性定常系统（A，C）能观的充要条件是能观性矩阵O的秩等于系统阶数n。B选项O为方阵不是能观充要条件；C选项应是秩等于系统阶数n而非输入变量个数p；D选项不是满行秩矩阵。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152899", "t": 1, "q": "对于线性定常系统的状态空间表达式x_dot=A x+B u，y=C x+D u，其中矩阵A的维度取决于", "a": ["系统状态变量的个数", "系统输入变量的个数", "系统扰动变量的个数", "系统输出变量的个数", "", ""], "r": "A", "e": "在状态空间表达式中，矩阵A是状态矩阵，其维度是n×n，n为系统状态变量的个数。所以矩阵A的维度取决于系统状态变量的个数。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152900", "t": 1, "q": "构造线性定常系统的状态变量时，以下说法正确的是", "a": ["状态变量的个数等于系统的阶数，与输入输出个数无关", "状态变量的个数必须等于系统的输入变量个数", "状态变量可以是物理上不可直接测量的变量", "状态变量的个数必须等于系统的输出变量个数", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152901", "t": 1, "q": "经典控制理论的主要研究对象，在以下选项中最准确的是", "a": ["多输入多输出非线性时变系统", "单输入单输出非线性定常系统", "单输入单输出线性定常系统", "多输入多输出线性时变系统", "", ""], "r": "C", "e": "经典控制理论主要采用时域法、根轨迹法和频域法等，其研究对象主要是单输入单输出的线性定常系统。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152902", "t": 1, "q": "经典控制理论与现代控制理论的共同点是", "a": ["均以控制系统的稳定性、动态性能、稳态性能为分析设计目标", "均采用频域分析法", "均以状态空间模型为核心", "均能处理多输入多输出非线性系统", "", ""], "r": "A", "e": "经典控制和现代控制理论都是为分析设计控制系统，目标都是稳定性、动态和稳态性能。经典控制用频域法，现代控制用状态空间法；经典控制核心不是状态空间模型；经典控制难处理多输入多输出非线性系统。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152903", "t": 1, "q": "经典控制理论与现代控制理论在建模方法上的区别是", "a": ["经典控制理论建立离散模型，现代控制理论建立连续模型", "经典控制理论建立内部模型，现代控制理论建立外部模型", "经典控制理论建立非线性模型，现代控制理论建立线性模型", "经典控制理论建立输入输出模型，现代控制理论建立状态空间模型", "", ""], "r": "D", "e": "经典控制理论主要基于输入输出关系建模，而现代控制理论采用状态空间模型来描述系统。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152904", "t": 1, "q": "经典控制理论中，系统的动态性能主要通过阶跃响应的指标（如超调量、调节时间）衡量，这些指标在现代控制理论中对应的是", "a": ["李雅普诺夫函数的特性", "能控性矩阵的秩", "状态转移矩阵的特性", "系统矩阵A的特征值分布", "", ""], "r": "D", "e": "系统矩阵A的特征值分布决定了系统的稳定性和动态特性，与经典控制理论中阶跃响应的超调量、调节时间等动态性能指标相关。李雅普诺夫函数用于判断系统稳定性；能控性矩阵的秩用于判断系统能控性；状态转移矩阵用于描述系统状态随时间的变化。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152905", "t": 1, "q": "经典控制理论中，系统的稳定性判定主要采用劳斯判据、奈奎斯特判据等，这些判据的核心是基于", "a": ["系统的状态空间模型", "系统的传递函数", "系统的状态转移矩阵", "系统的李雅普诺夫函数", "", ""], "r": "B", "e": "劳斯判据、奈奎斯特判据等经典控制理论中的稳定性判定方法，都是以系统的传递函数为基础来分析系统稳定性的。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152906", "t": 1, "q": "经典控制理论中的\"传递函数\"与现代控制理论中的\"状态空间表达式\"之间的关系，说法正确的是", "a": ["传递函数包含的系统信息比状态空间表达式更丰富", "一个传递函数只能对应一个状态空间表达式", "一个状态空间表达式可以对应多个传递函数", "状态空间表达式无法描述的系统，传递函数可以描述", "", ""], "r": "C", "e": "经典控制理论中的传递函数和现代控制理论中的状态空间表达式是两种不同的系统描述方式。传递函数主要描述系统输入和输出之间的关系，是一种基于频域的分析方法。而状态空间表达式则描述了系统内部的状态变量随时间的变化情况，是一种基于时域的分析方法。一个传递函数通常对应一个特定的系统输入输出关系，但一个状态空间表达式可以对应多个不同的传递函数，因为状态空间表达式包含了更多的系统内部状态信息。状态空间表达式能够描述更广泛的系统，包括一些传递函数难以描述的复杂系统。因此，选项A、B和D的描述都是不准确的。综上所述，正确答案是C选项：“一个状态空间表达式可以对应多个传递函数”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152907", "t": 1, "q": "经典控制理论中的\"根轨迹法\"与现代控制理论中的\"极点配置\"的共同目标是", "a": ["调整系统的输入输出关系", "调整系统的闭环极点位置", "调整系统的李雅普诺夫函数", "调整系统的状态变量", "", ""], "r": "B", "e": "根轨迹法通过改变系统参数绘制闭环极点轨迹来分析系统性能，极点配置是按要求配置闭环极点。二者共同目标都是调整系统的闭环极点位置。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152908", "t": 1, "q": "经典控制理论中的\"频率响应法\"主要分析系统在什么输入下的输出特性", "a": ["脉冲输入", "斜坡输入", "阶跃输入", "正弦输入", "", ""], "r": "D", "e": "频率响应法是研究系统对不同频率正弦输入的稳态响应特性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152909", "t": 1, "q": "控制系统中，状态变量的选择原则不包括", "a": ["状态变量需能完全描述系统的动态行为", "状态变量的个数等于系统的阶数", "状态变量必须是线性无关的", "状态变量必须是物理上可测量的", "", ""], "r": "D", "e": "状态变量不一定要物理上可测量，只要能满足完全描述系统动态行为、个数等于系统阶数且线性无关即可。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152910", "t": 1, "q": "控制系统中\"状态\"的定义，本质上反映了系统的什么属性", "a": ["反映系统外部环境对系统的影响程度", "反映系统过去、现在和未来行为的最小信息集合", "仅反映系统过去时刻的输入特性", "仅反映系统当前时刻的输出特性", "", ""], "r": "B", "e": "系统状态是描述系统所需的最小信息集合，它能体现系统过去、现在和未来行为。A选项说的是外部环境影响程度，并非状态本质；C选项仅关注过去输入特性太片面；D选项仅关注当前输出特性也不全面。所以答案选B。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152911", "t": 1, "q": "李雅普诺夫第二方法的核心优势是", "a": ["仅能判定渐近稳定，无法判定不稳定", "无需求解系统微分方程，直接构造V(x)判定稳定性", "仅适用于线性系统，计算简单", "必须知道系统的特征值", "", ""], "r": "B", "e": "李雅普诺夫第二方法的关键在于无需解系统微分方程，通过直接构造李雅普诺夫函数V(x)来判断系统稳定性。A选项它能判定不稳定；C选项它也适用于非线性系统；D选项不一定要知道系统特征值。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152912", "t": 1, "q": "李雅普诺夫第二方法中，构造李雅普诺夫函数V(x)时，以下哪种函数形式是常用的?", "a": ["二次函数V(x)=x^T P x（P为正定对称矩阵）", "三次函数V(x)=a₁x₁³+a₂x₂³+...+aₙxₙ³", "一次函数V(x)=a₁x₁+a₂x₂+...+aₙxₙ", "指数函数V(x)=e^(a₁x₁+...+aₙxₙ)", "", ""], "r": "A", "e": "李雅普诺夫第二方法中，二次型函数「test/yiwen_img/importSubject/2034803652392259584.png」（P为正定对称矩阵）是常用的李雅普诺夫函数形式，其性质便于分析系统稳定性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152913", "t": 1, "q": "李雅普诺夫第二方法中，若存在李雅普诺夫函数V(x)正定，且V_dot(x)正定，则系统平衡状态是", "a": ["不稳定", "无法判定", "稳定", "渐近稳定", "", ""], "r": "A", "e": "李雅普诺夫第二方法里，V(x)正定且V_dot(x)正定，系统平衡状态不稳定。答案：A <br />本题中提到V_dot(x)正定，这意味着V_dot(x)>0，这与上述条件2相矛盾。当V_dot(x)为正时，说明能量函数V(x)随时间增加，表明系统偏离平衡点的趋势增强，因此系统处于不稳定状态。选项A正确。而选项B、C、D均不符合这一情况下的系统稳定性结论。", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152914", "t": 1, "q": "李雅普诺夫第二方法中，若V(x)为正定函数，V_dot(x)为半负定函数，且存在某个初始状态使得V_dot(x)恒等于0，则系统平衡状态是", "a": ["不稳定", "稳定但非渐近稳定", "全局稳定", "渐近稳定", "", ""], "r": "B", "e": "当V(x)正定，V_dot(x)半负定且存在初始状态使V_dot(x)恒为0，意味着系统状态不会无限增大，但也不会收敛到平衡状态，符合稳定但非渐近稳定的定义。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152915", "t": 1, "q": "李雅普诺夫第二方法中，若V(x)为正定函数，V_dot(x)为零函数（对所有x，V_dot(x)=0），则系统平衡状态是", "a": ["无法判定", "不稳定", "稳定但非渐近稳定", "渐近稳定", "", ""], "r": "C", "e": "李雅普诺夫第二方法里，当V(x)正定且V_dot(x)为零函数时，系统平衡状态稳定但不会渐近收敛到平衡状态。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152916", "t": 1, "q": "李雅普诺夫第一方法不适用于以下哪种系统", "a": ["非线性定常系统", "线性定常系统", "线性时变系统", "线性离散系统", "", ""], "r": "D", "e": "李雅普诺夫第一方法是通过系统状态方程的解来判断系统稳定性，主要用于线性系统和可线性化的非线性定常系统。线性离散系统通常用李雅普诺夫第二方法分析。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152917", "t": 1, "q": "李雅普诺夫第一方法分析线性系统稳定性时，需先求解系统矩阵A的", "a": ["特征值", "伴随矩阵", "逆矩阵", "秩", "", ""], "r": "A", "e": "李雅普诺夫第一方法分析线性系统稳定性，要通过求解系统矩阵A的特征值，根据特征值实部情况判断稳定性。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152918", "t": 1, "q": "李雅普诺夫稳定性分析中，\"不稳定\"的平衡状态是指", "a": ["所有初始状态下，系统状态均发散到无穷远", "系统状态对初始条件敏感，微小扰动导致状态变化", "存在某个初始状态，使得系统状态随时间发散到无穷远", "系统状态始终在平衡状态邻域内，但不收敛", "", ""], "r": "C", "e": "李雅普诺夫稳定性中，不稳定是指存在某个初始状态，会让系统状态随时间发散到无穷远。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152919", "t": 1, "q": "李雅普诺夫稳定性分析中，“渐近稳定”的定义要求系统在平衡状态附近满足", "a": ["系统状态从任意初始状态出发都能收敛到平衡状态", "仅当t→∞时，系统状态收敛到平衡状态", "系统状态对初始条件和扰动不敏感", "系统状态始终在平衡状态的邻域内，且t→∞时收敛到平衡状态", "", ""], "r": "D", "e": "渐近稳定要求系统状态不仅始终在平衡状态邻域内，且当t趋于无穷时能收敛到平衡状态。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152920", "t": 1, "q": "李雅普诺夫稳定性分析中，\"全局渐近稳定\"的定义是", "a": ["平衡状态渐近稳定，且所有初始状态出发的轨迹均收敛到平衡状态", "平衡状态渐近稳定，且初始状态仅在小邻域内时轨迹收敛", "平衡状态稳定，且轨迹收敛到平衡状态", "平衡状态不稳定，但存在部分初始状态轨迹收敛", "", ""], "r": "A", "e": "全局渐近稳定要求平衡状态渐近稳定，且从所有初始状态出发的轨迹都能收敛到平衡状态。B选项说初始状态仅在小邻域内轨迹收敛，这是局部渐近稳定；C选项只说稳定且轨迹收敛，没强调全局所有初始状态；D选项平衡状态不稳定不符合全局渐近稳定定义。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152921", "t": 1, "q": "李雅普诺夫稳定性分析中，\"一致渐近稳定\"的平衡状态在什么情况下与\"渐近稳定\"等价", "a": ["非线性时变系统", "线性定常系统", "线性时变系统", "非线性定常系统", "", ""], "r": "B", "e": "在线性定常系统中，一致渐近稳定和渐近稳定等价。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152922", "t": 1, "q": "李雅普诺夫稳定性分析中，“一致稳定”的定义比“稳定”多了一个什么条件", "a": ["状态始终在平衡状态邻域内", "状态收敛到平衡状态", "稳定性与初始时刻t₀无关", "稳定性与初始状态无关", "", ""], "r": "C", "e": "“稳定”定义中稳定性可能与初始时刻「test/yiwen_img/importSubject/2034803652610363392.png」有关，“一致稳定”要求稳定性与初始时刻「test/yiwen_img/importSubject/2034803652610363392.png」无关。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152923", "t": 1, "q": "李雅普诺夫稳定性分析中，平衡状态x_e的\"稳定\"定义是指", "a": ["对任意ε>0，存在δ>0，当||x(0)-x_e||<δ时，有lim(t→∞)||x(t)-x_e||=0", "对任意ε>0，存在δ>0，当||x(0)-x_e||<δ时，对所有t≥0有||x(t)-x_e||<ε", "存在ε>0，对任意δ>0，当||x(0)-x_e||<δ时，有||x(t)-x_e||<ε对所有t≥0成立", "对任意δ>0，存在ε>0，当||x(0)-x_e||<δ时，有||x(t)-x_e||<ε对所有t≥0成立", "", ""], "r": "B", "e": "李雅普诺夫稳定性中平衡状态“稳定”的定义就是对于任意给定的正数ε，能找到正数δ，当初始状态与平衡状态的距离小于δ时，在所有t≥0时刻，状态与平衡状态的距离小于ε。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152924", "t": 1, "q": "李雅普诺夫稳定性分析中，若平衡状态x_e是不稳定的，则", "a": ["系统状态收敛到x_e", "存在至少一个初始状态，系统状态随时间发散", "所有初始状态下系统状态均发散", "系统状态始终在x_e的邻域内", "", ""], "r": "B", "e": "不稳定意味着不是所有情况都能稳定，存在至少一个初始状态会使系统状态随时间发散。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152925", "t": 1, "q": "李雅普诺夫稳定性分析中，若平衡状态x_e是渐近稳定的，则它一定是", "a": ["一致渐近稳定的", "不稳定的", "全局渐近稳定的", "稳定的", "", ""], "r": "D", "e": "渐近稳定的平衡状态满足稳定的定义，所以一定是稳定的。而渐近稳定不一定是一致渐近稳定、全局渐近稳定的，渐近稳定也不是不稳定。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152926", "t": 1, "q": "判断线性定常系统（A,B）能控性的秩判据中，需构造能控性矩阵C=[B AB A²B...A^(n-1)B]（n为系统阶数），系统能控的充要条件是<br />A.", "a": ["..A^(n-1)B]（n为系统阶数），系统能控的充要条件是", "矩阵C的秩等于系统阶数n", "矩阵C的秩大于输入变量的个数p", "矩阵C为满列秩矩阵", "矩阵C的秩等于输出变量的个数q", ""], "r": "A", "e": "根据线性定常系统能控性秩判据，系统能控的充要条件是能控性矩阵C的秩等于系统阶数n。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152927", "t": 1, "q": "使用李雅普诺夫第二方法（直接法）分析线性定常系统x_dot=Ax的平衡状态稳定性时，需构造李雅普诺夫函数V(x)，以下对V(x)的要求错误的是", "a": ["V(x)是连续可微的标量函数", "V(x)必须是二次型函数", "V(0)=0，且对所有x≠0有V(x)>0（正定）", "V_dot(x)=dV(x)/dt对所有x≠0有V_dot(x)<0（负定）", "", ""], "r": "B", "e": "李雅普诺夫函数V(x)只需满足连续可微、V(0)=0且x≠0时V(x)>0、V_dot(x)负定等条件，不必须是二次型函数。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152928", "t": 1, "q": "使用李雅普诺夫第二方法分析非线性系统稳定性时，李雅普诺夫函数V(x)的V_dot(x)若为半负定，且满足\"对任意x≠0，V_dot(x)不恒等于0\"，则系统平衡状态是", "a": ["无法判定", "渐近稳定", "稳定但非渐近稳定", "不稳定", "", ""], "r": "B", "e": "在李雅普诺夫第二方法中，当V(x)正定，V_dot(x)半负定且对任意x≠0，V_dot(x)不恒等于0时，系统平衡状态是渐近稳定的。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152929", "t": 1, "q": "现代控制理论的特点不包括以下哪一项", "a": ["仅适用于线性定常系统的分析设计", "可处理多变量、时变、非线性系统", "采用时域分析方法，直接处理时间变量", "以状态为核心，建立系统内部模型", "", ""], "r": "A", "e": "现代控制理论能处理多变量、时变、非线性系统，采用时域分析，以状态为核心建内部模型，并非仅适用于线性定常系统。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152930", "t": 1, "q": "现代控制理论与经典控制理论相比，其核心优势不包括以下哪一项", "a": ["可建立系统内部状态的数学模型", "仅依赖系统的输入输出数据建模", "可分析时变系统的动态特性", "能处理多输入多输出系统", "", ""], "r": "B", "e": "经典控制理论依赖系统的输入输出数据建模，现代控制理论核心优势是能建立系统内部状态数学模型、分析时变系统动态特性、处理多输入多输出系统。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152931", "t": 1, "q": "现代控制理论与经典控制理论在分析方法上的核心区别是", "a": ["现代控制理论用状态变量，经典控制理论用输出变量", "现代控制理论用矩阵运算，经典控制理论用微积分运算", "现代控制理论侧重于系统内部状态的描述，而经典控制理论侧重于系统的输入输出关系", "现代控制理论用时域法，经典控制理论用频域法", "", ""], "r": "C", "e": "现代控制理论与经典控制理论核心区别在于分析侧重点，前者侧重于系统内部状态描述，后者侧重于系统输入输出关系。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152932", "t": 1, "q": "现代控制理论中，“观测器”设计的核心前提是系统满足", "a": ["能控性", "渐近稳定性", "能观性", "一致稳定性", "", ""], "r": "C", "e": "观测器用于估计系统状态，其设计的核心前提是系统具有能观性，只有系统能观才能通过输出信息估计出系统状态。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152933", "t": 1, "q": "现代控制理论中，\"极点配置\"设计方法的核心前提是系统满足", "a": ["能观性", "能控性", "渐近稳定性", "一致稳定性", "", ""], "r": "B", "e": "极点配置设计的核心前提是系统具有能控性，只有系统能控才能通过状态反馈任意配置极点。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152934", "t": 1, "q": "现代控制理论中，\"最优控制\"的设计目标是在满足约束条件下，使某个性能指标", "a": ["达到最大", "保持恒定", "跟踪参考信号", "达到最小", "", ""], "r": "D", "e": "最优控制目的是在给定约束下，找到使性能指标最优的控制策略，通常是让性能指标达到最小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152935", "t": 1, "q": "现代控制理论中，分析离散系统时，状态空间表达式的形式为", "a": ["x_dot(k)=A x(k)+B u(k)，y(k)=C x(k)+D u(k)", "x(k+1)=A x(k)+B u(k+1)，y(k)=C x(k)+D u(k)", "x(k)=A x(k-1)+B u(k)，y(k)=C x(k)+D u(k-1)", "x(k+1)=A x(k)+B u(k)，y(k)=C x(k)+D u(k)", "", ""], "r": "D", "e": "离散系统状态空间表达式中，状态方程描述状态变量在离散时刻的递推关系，一般是下一时刻状态与当前时刻状态和输入的关系，输出方程是当前时刻输出与当前状态和输入的关系。选项D符合离散系统状态空间表达式的标准形式。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152936", "t": 1, "q": "现代控制理论中，分析系统稳定性的核心方法是", "a": ["根轨迹法", "奈奎斯特判据", "劳斯判据", "李雅普诺夫稳定性分析", "", ""], "r": "D", "e": "根轨迹法、奈奎斯特判据、劳斯判据是经典控制理论分析稳定性的方法，李雅普诺夫稳定性分析是现代控制理论分析系统稳定性的核心方法。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152937", "t": 1, "q": "现代控制理论中，状态空间表达式的建立过程不依赖以下哪项信息", "a": ["系统内部状态变量的选择", "系统输入变量和输出变量的定义", "系统的频率响应特性", "系统各环节的物理或数学模型", "", ""], "r": "C", "e": "状态空间表达式建立需选状态变量、定义输入输出变量，且要依据系统各环节物理或数学模型。而频率响应特性主要用于频域分析，并非建立状态空间表达式必需。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152938", "t": 1, "q": "线性定常非齐次状态方程的解中，强迫响应部分取决于", "a": ["初始状态x(0)和系统矩阵A", "输入u(t)和系统矩阵A、输入矩阵B", "初始状态x(0)和输入u(t)", "输出矩阵C和输入u(t)", "", ""], "r": "B", "e": "线性定常非齐次状态方程的强迫响应是由输入激励产生的响应，其表达式与输入u(t)、系统矩阵A和输入矩阵B有关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152939", "t": 1, "q": "线性定常非齐次状态方程的解中，自由响应部分由什么决定", "a": ["输入u(t)和输入矩阵B", "输出矩阵C和初始状态x(0)", "输入u(t)和系统矩阵A", "初始状态x(0)和系统矩阵A", "", ""], "r": "D", "e": "线性定常非齐次状态方程自由响应部分是系统在无输入作用时，仅由初始状态引起的响应，由初始状态x(0)和系统矩阵A决定。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152940", "t": 1, "q": "线性定常非齐次状态方程x_dot=A x+B u，若输入u(t)为单位阶跃函数u(t)=1（t≥0），初始状态x(0)=0，则其解x(t)为", "a": ["Φ(t)x(0)", "∫₀ᵗΦ(t-τ)A B dτ", "∫₀ᵗΦ(t-τ)B dτ", "A∫₀ᵗΦ(t-τ)B dτ", "", ""], "r": "C", "e": "线性定常非齐次状态方程在初始状态x(0)=0，输入u(t)为单位阶跃函数时，其解的公式为「test/yiwen_img/importSubject/2034803652752969728.png」，因为「test/yiwen_img/importSubject/2034803652878798848.png」，所以「test/yiwen_img/importSubject/2034803652966879232.png」。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152941", "t": 1, "q": "线性定常齐次状态方程(\\dot{x} = Ax)，若初始状态(x(0) = [1;0])，状态转移矩阵(\\Phi(t) = [[e^{-t}, 0]; [0, e^{-2t}]])，则(t)时刻的状态(x(t))为", "a": ["([e{-t};e{-2t}])", "([0;e^{-2t}])", "([e^{-t};0])", "([e{-2t};e{-t}])", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152942", "t": 1, "q": "线性定常齐次状态方程x_dot=Ax，若初始状态x(0)=[2;3]，状态转移矩阵Φ(t)=[[e(-t),te(-t)],[0,e^(-t)]]，则t时刻的状态x(t)为", "a": ["[2te(-t)+3e(-t);3e^(-t)]", "[2e(-t)+3te(-t);3e^(-t)]", "[2e(-t)+3te(-t);2e(-t)+3e(-t)]", "[2e(-t);3te(-t)+3e^(-t)]", "", ""], "r": "B", "e": "根据线性定常齐次状态方程解的公式「test/yiwen_img/importSubject/2034803653084319744.png」，将「test/yiwen_img/importSubject/2034803653172400128.png」与x(0)相乘：\\[\\begin{align*}x(t)\\u0026=\\begin{bmatrix}e^{-t}\\u0026te^{-t}\\\\0\\u0026e^{-t}\\end{bmatrix}\\begin{bmatrix}2\\\\3\\end{bmatrix}\\\\\\u0026=\\begin{bmatrix}2e^{-t}+3te^{-t}\\\\3e^{-t}\\end{bmatrix}\\end{align*}\\]答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152943", "t": 1, "q": "线性定常齐次状态方程x_dot=Ax，若A=[[0,1],[-2,-3]]，则其状态转移矩阵Φ(t)的导数dΦ(t)/dt在t=0时的值为", "a": ["系统矩阵A", "单位矩阵I", "逆矩阵A⁻¹", "零矩阵", "", ""], "r": "A", "e": "状态转移矩阵「test/yiwen_img/importSubject/2034803653172400128.png」满足「test/yiwen_img/importSubject/2034803653268869120.png」，当t = 0时，「test/yiwen_img/importSubject/2034803653373726720.png」，所以「test/yiwen_img/importSubject/2034803653461807104.png」。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803658067152944", "t": 1, "q": "线性定常齐次状态方程x_dot=Ax，若A的特征值均为纯虚数且互异，则系统的平衡状态x_e=0是", "a": ["全局稳定", "稳定但非渐近稳定", "渐近稳定", "不稳定", "", ""], "r": "B", "e": "当A的特征值均为纯虚数且互异时，系统响应是等幅振荡的，不会发散但也不会收敛到平衡状态。答案：B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401792", "t": 2, "q": "对线性定常系统进行非奇异线性变换x=Pz（P为可逆矩阵）后，保持不变的系统特性有", "a": ["系统的传递函数矩阵G（　）=C(sI-A)⁻¹B+D", "系统的完全能控性", "系统的完全能观性", "系统矩阵A的特征值（极点）", "", ""], "r": "ABCD", "e": "非奇异线性变换不改变系统的传递函数矩阵、能控性、能观性和系统矩阵的特征值。答案涵盖ABCD选项所涉及的系统特性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401793", "t": 2, "q": "根据李雅普诺夫第二方法，线性或非线性系统平衡状态渐近稳定的充分条件包括", "a": ["存在连续可微的标量函数V(x)，且V(x)为正定函数（V(0)=0，x≠0时V(x)>0）", "V(x)的导数V_dot(x)=dV(x)/dt为负定函数（x≠0时V_dot(x)<0）", "V(x)的导数V_dot(x)为半负定函数，且对任意x≠0，V_dot(x)不恒等于0", "V(x)的取值范围为0≤V(x)<∞（径向无界性，针对全局渐近稳定）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401794", "t": 2, "q": "经典控制理论的主要局限性体现在", "a": ["无法利用李雅普诺夫方法判定系统稳定性", "仅适用于线性定常系统，无法处理线性时变系统和非线性系统", "仅能有效处理单输入单输出（SISO）系统，难以处理多输入多输出（MIMO）系统", "仅关注系统输入输出的外部特性，无法分析系统内部状态的行为", "", ""], "r": "BCD", "e": "经典控制理论主要基于传递函数，局限在于多方面。它处理对象多是线性定常系统，对时变和非线性系统能力有限；主要针对单输入单输出系统，处理多输入多输出系统较难；且侧重于输入输出外部特性，难以分析内部状态。而李雅普诺夫方法并非经典控制理论主要局限性体现。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401795", "t": 2, "q": "经典控制理论与现代控制理论的主要区别体现在", "a": ["分析方法: 经典为频域法，现代为时域法", "建模方法: 经典为输入输出模型，现代为状态空间模型", "关注重点: 经典关注系统外部输入输出特性，现代关注系统内部状态特性", "处理系统类型: 经典适用于单输入单输出线性定常系统，现代适用于多变量、时变、非线性系统", "", ""], "r": "ABCD", "e": "经典控制理论和现代控制理论在多方面存在区别，A选项频域法是经典控制常用分析方法，时域法是现代控制常用；B选项经典用输入输出模型，现代用状态空间模型；C选项经典关注外部输入输出，现代关注内部状态；D选项经典适合单输入单输出线性定常系统，现代适合多变量、时变、非线性系统。四个选项都准确体现了二者主要区别。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401796", "t": 2, "q": "经典控制理论中的\"根轨迹法\"与现代控制理论中的\"极点配置\"的异同点，正确的有", "a": ["相同点: 均以调整系统闭环极点位置为核心目标，改善系统性能", "不同点: 根轨迹法适用于SISO系统，而极点配置方法不仅限于MIMO系统，也可应用于SISO系统", "不同点: 根轨迹法通过改变单一参数绘制极点移动路径，极点配置则是通过状态反馈直接指定期望的极点位置", "相同点: 两者都要求系统必须是完全能控的（否则无法实现对所有极点的调整）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401797", "t": 2, "q": "控制系统中\"状态\"的基本属性包括", "a": ["通过初始状态和输入可确定系统未来行为", "包含系统当前时刻的所有信息，而不仅仅是输出信息", "是描述系统动态行为的最小变量集合", "状态变量的选择具有非唯一性", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401798", "t": 2, "q": "李雅普诺夫第二方法（直接法）分析系统稳定性时，对李雅普诺夫函数V(x)的基本要求包括", "a": ["V(x)必须是二次型函数", "V_dot(x)=dV(x)/dt是负定或半负定的", "V(0)=0，且对所有x≠0有V(x)>0（正定）", "V(x)是连续可微的标量函数", "", ""], "r": "BCD", "e": "李雅普诺夫函数V(x)不必须是二次型函数；V_dot(x)负定或半负定是稳定性判断要求；V(0)=0且x≠0时V(x)>0（正定）以及V(x)是连续可微标量函数是对V(x)基本要求。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401799", "t": 2, "q": "李雅普诺夫第二方法应用于非线性系统时的优势及注意事项，正确的有", "a": ["李雅普诺夫函数V(x)的构造具有非唯一性，需结合系统特性选择", "可分析系统在大范围内的稳定性（全局稳定性），而非仅小邻域内的局部稳定性", "无需对非线性系统线性化，可直接分析原系统的稳定性（避免线性化误差）", "若未找到合适的V(x)，不能直接判定系统不稳定（仅说明该方法未找到稳定条件）", "", ""], "r": "ABCD", "e": "李雅普诺夫第二方法用于非线性系统时，V(x)构造不唯一要结合系统特性选；能分析全局稳定性；可直接分析原系统免线性化误差；没找到合适V(x)不能判定系统不稳定。ABCD选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401800", "t": 2, "q": "李雅普诺夫第二方法应用于非线性系统时的注意事项，正确的有", "a": ["若非线性系统存在多个平衡状态，需分别分析每个平衡状态的稳定性（不同平衡状态稳定性可能不同）", "不能直接将线性系统的二次型V(x)推广到非线性系统，需验证V(x)对非线性系统的正定及V_dot负定", "李雅普诺夫函数V(x)的构造无通用方法，需结合非线性项特性（如多项式、指数项）设计", "仅能判定平衡状态的稳定性，无法分析非线性系统的极限环、混沌等复杂行为", "", ""], "r": "ABCD", "e": "非线性系统可能有多个平衡状态，各状态稳定性可能不同，A正确；线性系统二次型不能直接用于非线性系统，要验证正定和负定，B正确；李雅普诺夫函数构造没通用法，要结合非线性项特性，C正确；该方法主要判断平衡态稳定性，难以分析极限环、混沌等复杂行为，D正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401801", "t": 2, "q": "李雅普诺夫第二方法中，构造二次型李雅普诺夫函数V(x)=x^T P x的步骤，正确的有", "a": ["若P不正定，则需更换Q重新求解", "验证P是否为正定对称矩阵，若是则V(x)=x^T P x为有效李雅普诺夫函数", "求解李雅普诺夫方程A^T P+P A=-Q，得到矩阵P", "选择任意正定对称矩阵Q（如单位矩阵I）", "", ""], "r": "BCD", "e": "为了判断李雅普诺夫第二方法中构造二次型李雅普诺夫函数「test/yiwen_img/importSubject/2034803652392259584.png」的步骤，我们不需要逐个分析每个选项，而是可以通过逻辑推理来确定正确答案。1. 选项A：若P不正定，则需更换Q重新求解。 这个选项是错误的，因为P的正定性是通过求解李雅普诺夫方程「test/yiwen_img/importSubject/2034803653558276096.png」来保证的，而不是直接选择Q来保证P的正定性。2. 选项B：验证P是否为正定对称矩阵，若是则「test/yiwen_img/importSubject/2034803652392259584.png」为有效李雅普诺夫函数。 这个选项是正确的，因为李雅普诺夫函数的有效性依赖于P的正定性和对称性。3. 选项C：求解李雅普诺夫方程「test/yiwen_img/importSubject/2034803653558276096.png」，得到矩阵P。 这个选项是正确的，因为求解这个方程是构造李雅普诺夫函数的关键步骤。4. 选项D：选择任意正定对称矩阵Q（如单位矩阵I）。 这个选项是正确的，因为在构造李雅普诺夫函数时，Q的选择是任意的，只要它是正定的。综上所述，正确的选项是B、C和D。正确答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401802", "t": 2, "q": "李雅普诺夫第二方法中，构造李雅普诺夫函数V(x)的常用方法包括", "a": ["克拉索夫斯基法: 针对非线性系统，利用系统雅可比矩阵构造V(x)=f^T(x)f(x)（f(x)为非线性状态方程右边项）", "经验法: 根据系统特性（如能量、误差）构造物理意义明确的正定函数", "变量梯度法: 通过假设V(x)的梯度形式，推导V(x)并验证正定及V_dot负定", "二次型函数法: V(x)=x^T P x（P为正定对称矩阵），适用于线性系统", "", ""], "r": "ABCD", "e": "这几种都是李雅普诺夫第二方法中构造李雅普诺夫函数V(x)的常用方法。克拉索夫斯基法利用雅可比矩阵构造；经验法依据系统特性构造；变量梯度法先设梯度形式再推导；二次型函数法适用于线性系统。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401803", "t": 2, "q": "李雅普诺夫第二方法中，李雅普诺夫函数V(x)需满足的基本性质（针对渐近稳定），正确的有", "a": ["V(0)=0，且对所有x≠0，V(x)>0（正定）", "V(x)是连续可微的标量函数", "对于所有的x,V(x)随时间单调递增", "V_dot(x)=dV(x)/dt<0（x≠0时负定），或V_dot(x)≤0且不恒为0（半负定）", "", ""], "r": "ABD", "e": "李雅普诺夫第二方法判断渐近稳定时，V(x)要正定即V(0)=0且x≠0时V(x)>0，是连续可微标量函数，其导数V_dot(x)在x≠0时负定或半负定且不恒为0，而不是V(x)随时间单调递增。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401804", "t": 2, "q": "李雅普诺夫第二方法中，V_dot(x)为半负定且恒为零的情况，对应的稳定性结论及原因，正确的有", "a": ["系统平衡状态稳定但非渐近稳定", "原因:V_dot(x)=0意味着V(x)恒为常数，状态轨迹始终在V(x)=C（常数）的曲面上，不会收敛到平衡状态", "若V(x)为径向无界函数，则系统为全局稳定但非全局渐近稳定", "此时系统可能存在周期运动（如极限环）", "", ""], "r": "ABCD", "e": "李雅普诺夫第二方法里，当「test/yiwen_img/importSubject/2034803653642162176.png」半负定且恒为零，意味着V(x)不变，状态轨迹在等势面V(x)=C上，不收敛到平衡态，系统稳定非渐近稳定；若V(x)径向无界则全局稳定非全局渐近稳定；这种情况下系统可能存在周期运动。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401805", "t": 2, "q": "李雅普诺夫第二方法中\"径向无界性\"的作用及应用场景，正确的有", "a": ["若仅满足V(x)正定、V_dot(x)负定，但V(x)非径向无界，则系统仅为\"局部渐近稳定\"", "径向无界性对\"稳定\"或\"渐近稳定\"（非全局）的判定无影响", "径向无界性是判定系统平衡状态\"全局渐近稳定\"的必要条件之一", "径向无界性是指当||x||→∞时，V(x)→∞（||x||为x的范数）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401806", "t": 2, "q": "李雅普诺夫第一方法（间接法）的适用范围及分析步骤，正确的有", "a": ["核心步骤:先求解系统矩阵（或线性化后的雅可比矩阵）的特征值，再根据特征值实部符号判断稳定性", "适用于线性定常系统、线性时变系统和非线性系统的线性化模型", "无需构造李雅普诺夫函数，直接通过系统动态方程的解或特征值特性判定稳定性", "适用于非线性系统的线性化模型（围绕平衡状态线性化后分析）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401807", "t": 2, "q": "李雅普诺夫第一方法（间接法）分析线性定常系统稳定性的计算步骤，正确的有", "a": ["确定系统的平衡状态x_e（通常取x_e=0，若x_e≠0，可通过变量替换x'=x-x_e转化为原点平衡状态）", "若存在Re(λ_i)=0且有重特征值，判定系统不稳定（约当块导致状态发散）", "根据特征值实部符号判定稳定性:所有Re(λ_i)<0→渐近稳定;存在Re(λ_i)>0→不稳定;仅Re(λ_i)=0且无重特征值→临界稳定", "写出系统的状态方程x_dot=Ax，求解系统矩阵A的所有特征值λ₁,λ₂,...,λₙ", "", ""], "r": "ACD", "e": "李雅普诺夫第一方法（间接法）用于分析线性定常系统的稳定性，主要步骤包括：1. 确定平衡状态：找到系统的平衡点x_e，如果x_e不是原点，则通过变量替换将其转化为原点平衡状态。2. 写出状态方程并求解特征值：将系统的状态方程写为x_dot=Ax的形式，并求解矩阵A的所有特征值。3. 根据特征值的实部判断稳定性： 如果所有特征值的实部都小于0，则系统是渐近稳定的。 如果存在特征值的实部大于0，则系统是不稳定的。 如果只有特征值的实部等于0且无重特征值，则系统是临界稳定的。对于选项B，约当块的存在并不直接导致系统不稳定，而是需要结合特征值的实部来判断。因此，B选项的描述不完全准确。综上所述，正确的步骤包括确定平衡状态、写出状态方程并求解特征值、以及根据特征值的实部判断稳定性，对应选项ACD。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401808", "t": 2, "q": "李雅普诺夫第一方法分析非线性系统稳定性的步骤及局限性，正确的有", "a": ["若线性化模型存在实部>0的特征值，则原非线性系统在平衡状态附近不稳定", "步骤:将非线性系统在平衡状态附近线性化，得到线性化模型;求解线性化模型的特征值，判定稳定性", "局限性:仅能分析平衡状态附近的局部稳定性，无法分析全局稳定性;若线性化模型存在实部=0的特征值，无法判定原系统稳定性", "若线性化模型的所有特征值实部<0，则原非线性系统在平衡状态附近局部渐近稳定", "", ""], "r": "ABCD", "e": "李雅普诺夫第一方法先把非线性系统在平衡状态附近线性化，求线性化模型特征值来判断稳定性。特征值实部全小于 0，原系统在平衡状态附近局部渐近稳定；有实部大于 0 的特征值，原系统在平衡状态附近不稳定；若有实部等于 0 的特征值，无法判定原系统稳定性，且该方法只能分析局部稳定性。ABCD 选项均符合这些内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401809", "t": 2, "q": "李雅普诺夫第一方法分析线性定常系统稳定性的结论，正确的有", "a": ["若系统矩阵A的特征值均为纯虚数（实部=0）且互不相同，则平衡状态x_e=0稳定但非渐近稳定", "若系统矩阵A存在实部大于0的特征值，则平衡状态x_e=0不稳定", "若系统矩阵A存在实部等于0的特征值且对应约当块阶数大于1，则平衡状态x_e=0不稳定", "若系统矩阵A的所有特征值实部均小于0，则平衡状态x_e=0渐近稳定", "", ""], "r": "ABCD", "e": "线性定常系统稳定性与系统矩阵A特征值相关。实部小于0，渐近稳定；有实部大于0的，不稳定；实部为0且单特征根稳定非渐近稳定，实部为0且对应约当块阶数大于1不稳定。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401810", "t": 2, "q": "李雅普诺夫函数V(x)的常见物理意义，正确的有", "a": ["在热力系统中，V(x)可表示系统的温度偏差平方和，V_dot(x)表示温度偏差的变化率（负定则温度趋于稳定）", "在机械系统中，V(x)可表示系统的总机械能（动能+势能），V_dot(x)表示机械能的变化率（负定则机械能衰减，系统稳定）", "在控制系统中，V(x)可表示状态误差的二次型（如V(x)=x^T P x，x为误差向量），V_dot(x)表示误差的变化率（负定则误差衰减）", "在电气系统中，V(x)可表示系统的电磁能量（电感储能+电容储能），V_dot(x)表示能量耗散率（负定则能量耗散，系统稳定）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401811", "t": 2, "q": "李雅普诺夫稳定性分析的局限性，正确的有", "a": ["李雅普诺夫函数V(x)的构造无通用算法（依赖经验和系统特性，部分系统难以找到合适的V(x)）", "高阶系统（n≥5）的V(x)构造难度极大，且验证V(x)正定、V_dot负定的计算量庞大", "对线性时变系统和非线性系统，稳定性分析结果通常是充分条件而非必要条件（找到V(x)可判定稳定，找不到不能判定不稳定）", "仅能判定平衡状态的稳定性（稳定、渐近稳定、不稳定），无法给出定量的动态性能指标（如调节时间、超调量）", "", ""], "r": "ABCD", "e": "A选项指出李雅普诺夫函数构造无通用算法，很多系统找合适函数难；B选项说明高阶系统V(x)构造难且验证计算量大；C选项表明对一些系统分析结果多为充分条件；D选项说明只能判定平衡状态稳定性，不能给出动态性能定量指标。这些都是李雅普诺夫稳定性分析的局限性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401812", "t": 2, "q": "李雅普诺夫稳定性分析中，\"不稳定\"平衡状态的判定条件（充分条件）包括", "a": ["V(x)的导数V_dot(x)在上述x₀对应的轨迹上满足V_dot(x(t))>0（t≥0）", "存在连续可微的标量函数V(x)，且V(0)=0", "在平衡状态x_e=0的任意小邻域内，存在x₀≠0使得V(x₀)>0", "V(x)为正定函数", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401813", "t": 2, "q": "李雅普诺夫稳定性分析中，\"渐近稳定\"与\"全局渐近稳定\"的区别，正确的有", "a": ["\"渐近稳定\"是局部概念（仅初始状态在平衡状态小邻域内），\"全局渐近稳定\"是全局概念（任意初始状态）", "线性定常系统中，\"渐近稳定\"等价于\"全局渐近稳定\"（因二次型李雅普诺夫函数天然径向无界）", "\"渐近稳定\"无需径向无界性，\"全局渐近稳定\"需V(x)径向无界（||x||→∞时V(x)→∞）", "\"渐近稳定\"仅保证小邻域内状态收敛到平衡状态，\"全局渐近稳定\"保证所有初始状态均收敛", "", ""], "r": "ABCD", "e": "渐近稳定是局部性质，初始状态在平衡状态小邻域内；全局渐近稳定是全局性质，对任意初始状态都成立。线性定常系统中二者等价，全局渐近稳定要求V(x)径向无界，渐近稳定无此要求，且渐近稳定只保证小邻域状态收敛，全局渐近稳定保证所有初始状态收敛。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401814", "t": 2, "q": "李雅普诺夫稳定性分析中，\"临界稳定\"（也叫边界稳定）的特点，正确的有", "a": ["线性定常系统中，临界稳定的充要条件是系统矩阵A的特征值均为纯虚数（实部=0）且无重特征值", "临界稳定状态下，系统状态会围绕平衡状态做等幅振荡（无衰减也无发散）", "系统平衡状态满足\"稳定\"的定义，但不满足\"渐近稳定\"的定义", "工程中临界稳定通常不被接受（振荡会导致系统性能下降，扰动可能使系统发散）", "", ""], "r": "ABCD", "e": "A选项，线性定常系统临界稳定充要条件就是系统矩阵A特征值均为纯虚数且无重特征值；B选项，临界稳定时系统状态会等幅振荡；C选项，临界稳定满足稳定定义但不满足渐近稳定定义；D选项，工程中临界稳定因振荡及可能受扰动发散通常不被接受。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401815", "t": 2, "q": "李雅普诺夫稳定性分析中，\"全局渐近稳定\"的充要条件（针对线性定常系统），正确的有", "a": ["存在正定对称矩阵P，满足李雅普诺夫方程A^T P+PA=-Q（Q为任意正定对称矩阵）", "李雅普诺夫函数V(x)=x^T P x为径向无界函数", "系统完全能控且完全能观", "系统矩阵A的所有特征值实部均小于0", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401816", "t": 2, "q": "李雅普诺夫稳定性分析中，\"稳定\"平衡状态的定义（ε-δ语言），正确的表述有", "a": ["稳定的核心是状态始终在平衡状态的邻域内，不发散", "对任意给定的ε>0，存在δ>0（δ与ε、t₀有关）", "当||x(0)-x_e||<δ时，对所有t≥t₀，有||x(t)-x_e||<ε", "稳定的平衡状态可能存在振荡，但振幅有界", "", ""], "r": "ABCD", "e": "李雅普诺夫稳定性中，稳定意味着状态始终在平衡状态邻域内不发散，定义为对任意给定的ε>0，存在δ>0（δ与ε、t₀有关），当初始状态与平衡状态距离小于δ时，后续所有时刻状态与平衡状态距离小于ε，且稳定平衡状态可能有有界振荡。ABCD表述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401817", "t": 2, "q": "李雅普诺夫稳定性分析中，“一致稳定”与“稳定”的区别及适用场景，正确的有", "a": ["对线性时变系统或非线性系统，“稳定”不一定是“一致稳定”", "“稳定”的定义与初始时刻t₀有关，“一致稳定”的定义与t₀无关", "对线性定常系统，“稳定”与“一致稳定”等价", "“一致稳定”是“一致渐近稳定”的必要前提", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401818", "t": 2, "q": "能控性与能观性对偶原理的工程应用，正确的有", "a": ["验证系统模型的正确性（若原系统能控，则对偶系统应能观，可交叉验证）", "通过分析对偶系统的能控性，间接判定原系统的能观性（无需直接构造原系统的能观性矩阵）", "简化多变量系统的控制器与观测器联合设计（利用对偶性，减少重复计算）", "将观测器设计问题转化为控制器设计问题（利用对偶系统，观测器增益L对应控制器增益K的转置）", "", ""], "r": "ABCD", "e": "能控性与能观性对偶原理可用于多方面，A可交叉验证系统模型；B能通过对偶系统能控性间接判原系统能观性；C可简化联合设计；D能将观测器设计转化为控制器设计。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401819", "t": 2, "q": "现代控制理论的主要研究内容包括", "a": ["系统的稳定性分析（李雅普诺夫方法）", "系统的最优控制和观测器设计", "系统的状态空间建模", "系统的能控性和能观性分析", "", ""], "r": "ABCD", "e": "现代控制理论以状态空间法为基础，核心内容包含系统状态空间建模、能控能观性分析、稳定性分析（常用李雅普诺夫方法）以及最优控制和观测器设计等。ABCD选项均为其主要研究内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401820", "t": 2, "q": "现代控制理论相较于经典控制理论，具有的优势包括", "a": ["仅依赖系统的输入输出数据进行建模", "可处理多输入多输出系统", "可处理线性时变和非线性系统", "可分析系统的内部状态特性", "", ""], "r": "BCD", "e": "经典控制理论多针对单输入单输出、线性定常系统，依赖输入输出数据建模。现代控制理论能处理多输入多输出、线性时变和非线性系统，还可分析系统内部状态特性。A是经典控制理论特点，B、C、D是现代控制理论优势。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401821", "t": 2, "q": "现代控制理论相较于经典控制理论，在控制系统设计方面的优势包括", "a": ["可处理多变量系统的耦合问题，实现多变量协调控制", "可结合李雅普诺夫方法，确保控制系统的稳定性（尤其是非线性系统）", "可设计观测器，利用输出估计不可测状态，拓展控制应用场景", "可设计状态反馈控制器，比输出反馈控制器拥有更多控制自由度", "", ""], "r": "ABCD", "e": "经典控制理论主要针对单输入单输出系统，现代控制理论能处理多变量、非线性等复杂系统。A可解决多变量耦合；B用李雅普诺夫方法保障稳定；C能设计观测器估计状态；D状态反馈控制自由度更多，这些都是现代控制理论优势。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401822", "t": 2, "q": "现代控制理论与经典控制理论在工程应用中的结合方式，正确的有", "a": ["用现代控制理论（如状态反馈）设计核心控制器，用经典控制理论（如频率响应法）整定控制器参数，增强鲁棒性", "用经典控制理论（如PID）实现系统的基本稳定控制，用现代控制理论（如观测器）估计不可测状态，提升控制精度", "对多变量系统，用现代控制理论解耦后，再用经典控制理论对每个单变量子系统设计控制器", "用经典控制理论分析系统的频域特性（如相位裕度、增益裕度），用现代控制理论设计抗扰动策略（如前馈控制）", "", ""], "r": "ABCD", "e": "A项利用现代控制设计核心控制器，经典理论整定参数增强鲁棒性合理；B项经典PID实现基本稳定，现代观测器估计状态提升精度可行；C项多变量系统现代解耦后用经典设计单变量控制器符合实际；D项经典分析频域特性，现代设计抗扰动策略也正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401823", "t": 2, "q": "现代控制理论在电力系统中的具体应用，正确的有", "a": ["电力系统频率控制: 利用观测器估计不可测的频率偏差，实现精准调频", "配电网络优化控制: 结合最优控制，实现负荷分配和能耗最小化", "柔性交流输电系统（FACTS）控制: 通过多变量控制策略，调节电压、功率因数", "发电机励磁控制: 利用状态反馈实现励磁电流的最优控制，改善电力系统稳定", "", ""], "r": "ABCD", "e": "各选项均是现代控制理论在电力系统中的典型应用，A可精准调频，B能优化配电网络，C可调节FACTS相关参数，D利于改善系统稳定。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401824", "t": 2, "q": "现代控制理论在机器人控制系统中的应用，正确的有", "a": ["机器人关节位置控制: 采用状态反馈（位置、速度为状态），实现关节位置的精准跟踪", "机器人轨迹规划: 结合最优控制，在满足关节力矩约束下，使轨迹跟踪误差最小", "机器人负载扰动补偿: 设计观测器估计负载扰动（不可测），通过前馈控制抵消扰动影响", "机器人协调控制（多机器人协作）: 利用多变量状态空间模型，实现多机器人的同步运动", "", ""], "r": "ABCD", "e": "各选项均符合现代控制理论在机器人控制系统中的应用原理。A利用状态反馈实现关节位置精准控制；B结合最优控制优化轨迹规划；C用观测器估计负载扰动并补偿；D通过多变量状态空间模型实现多机器人协调。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401825", "t": 2, "q": "现代控制理论中，状态反馈控制与输出反馈控制的区别，正确的有", "a": ["状态反馈需获取所有状态变量的信息（可测或通过观测器估计），输出反馈仅需获取输出变量信息", "状态反馈易受状态测量噪声影响，输出反馈因仅用输出，噪声影响相对较小", "状态反馈需系统完全能控才能实现任意极点配置，输出反馈需系统完全能观才能实现稳定控制", "状态反馈的控制自由度更高（可任意配置闭环极点，需系统能控），输出反馈控制自由度较低（难以任意配置极点）", "", ""], "r": "ABCD", "e": "A选项，状态反馈要掌握所有状态变量信息，输出反馈只需输出信息；B选项，状态反馈因涉及状态变量测量，更易受噪声影响，输出反馈用输出信息，噪声影响小；C选项，状态反馈实现任意极点配置需系统完全能控，输出反馈实现稳定控制需系统完全能观；D选项，状态反馈控制自由度高可任意配置极点（系统能控时），输出反馈难以任意配置极点。ABCD选项表述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401826", "t": 2, "q": "现代控制理论中\"观测器\"的类型及设计要点，正确的有", "a": ["降维观测器: 阶数通常为n-q（q为输出个数），利用已知输出减少估计维度", "全维观测器: 阶数与原系统阶数n相同，可估计所有状态变量", "观测器的核心是使估计状态与真实状态的误差随时间收敛到零", "观测器设计的必要前提是系统完全能观（能通过输出反推状态）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401827", "t": 2, "q": "现代控制理论中\"极点配置\"技术的相关说法，正确的有", "a": ["状态反馈实现任意极点配置的必要且充分条件是系统完全能控", "核心目标是通过反馈（如状态反馈、输出反馈）将系统闭环极点配置到期望位置", "极点配置的目的是改善系统动态性能（如降低超调、缩短调节时间）和稳定性", "输出反馈实现任意极点配置的条件比状态反馈更宽松", "", ""], "r": "ABC", "e": "状态反馈能任意配置极点的充要条件是系统完全能控，极点配置就是通过反馈把闭环极点放到期望位置以改善系统性能和稳定性，而输出反馈实现任意极点配置条件比状态反馈更严格。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401828", "t": 2, "q": "现代控制理论中\"鲁棒控制\"的基本概念及与李雅普诺夫方法的结合，正确的有", "a": ["鲁棒控制的目标是使系统在参数摄动、外部扰动下仍保持稳定和良好性能。", "鲁棒控制的设计需考虑系统的能控性和能观性（确保扰动下仍能控制和观测状态）。", "可利用李雅普诺夫第二方法，构造对参数摄动不敏感的李雅普诺夫函数V(x)。", "常用的鲁棒控制方法包括H∞控制、μ综合法，均需结合稳定性分析。", "", ""], "r": "ABCD", "e": "鲁棒控制旨在应对参数摄动和外部扰动保证系统稳定和性能，设计要考虑能控能观性，可借助李雅普诺夫第二方法构造合适函数，常用方法需结合稳定性分析。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401829", "t": 2, "q": "现代控制理论中\"模型预测控制（MPC）\"的基本原理及与状态空间的结合，正确的有", "a": ["MPC的预测模型通常采用线性定常或非线性状态空间模型", "MPC通过滚动优化，在每个时刻求解有限时域内的最优控制问题", "MPC的约束处理能力强，可直接考虑输入、状态的硬约束", "MPC需利用当前状态（或状态估计值）预测未来状态轨迹，依赖系统的能观性（状态估计）", "", ""], "r": "ABCD", "e": "MPC预测模型常用线性定常或非线性状态空间模型；它通过滚动优化在各时刻求解有限时域最优控制问题；能很好处理约束，可直接考虑输入、状态硬约束；且需用当前状态或估计值预测未来轨迹，依赖系统能观性。ABCD选项描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401830", "t": 2, "q": "现代控制理论中\"最优控制\"的基本概念及设计目标，正确的有", "a": ["最优控制是在满足系统约束（如状态方程、输入约束）的前提下，寻找控制律u*(t)", "最优控制的实现通常需要系统完全能控（确保控制律能调整状态满足性能指标）", "常用的最优控制方法包括庞特里亚金极小值原理和贝尔曼动态规划", "设计目标是使某个性能指标J（如误差积分、控制能耗、响应时间）达到最小值", "", ""], "r": "ABCD", "e": "ABCD选项都符合最优控制的基本概念和设计目标，A说明了最优控制是找控制律的前提；B强调实现最优控制的系统条件；C列举了常用方法；D明确设计目标。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401831", "t": 2, "q": "线性定常非齐次状态方程x_dot=Ax+Bu的解包含的组成部分及影响因素有", "a": ["直接传输矩阵D对状态方程的解有直接影响", "强迫响应（零状态响应）:仅由输入u(t)、系统矩阵A和输入矩阵B决定", "自由响应（零输入响应）:仅由初始状态x(0)和系统矩阵A决定", "输出矩阵C对状态方程的解有直接影响", "", ""], "r": "BC", "e": "线性定常非齐次状态方程解由自由响应和强迫响应组成。自由响应只与初始状态和系统矩阵有关；强迫响应由输入、系统矩阵和输入矩阵决定。直接传输矩阵D和输出矩阵C不直接影响状态方程的解。所以答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401832", "t": 2, "q": "线性定常非齐次状态方程x_dot=A x+B u的解的表达式及计算要点，正确的有", "a": ["第一项Φ(t)x(0)是零输入响应（自由响应）", "解的表达式为x(t)=Φ(t)x(0)+∫₀ᵗΦ(t-τ)B u(τ)dτ（Φ(t)为状态转移矩阵）", "第二项∫₀ᵗΦ(t-τ)B u(τ)dτ是零状态响应（强迫响应）", "若u(t)为阶跃输入u(t)=U₀（常数），则强迫响应可简化为Φ(t)B U₀", "", ""], "r": "ABC", "e": "线性定常非齐次状态方程解的表达式为「test/yiwen_img/importSubject/2034803653751214080.png」，其中「test/yiwen_img/importSubject/2034803653839294464.png」是零输入响应，「test/yiwen_img/importSubject/2034803653956734976.png」是零状态响应；当「test/yiwen_img/importSubject/2034803654053203968.png」（常数），强迫响应是「test/yiwen_img/importSubject/2034803654149672960.png」并非「test/yiwen_img/importSubject/2034803654241947648.png」。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401833", "t": 2, "q": "线性定常离散系统的状态空间表达式及能控性判定，正确的有", "a": ["能控性矩阵为C_d=[B AB A²", "..A^(n-1)B]（与连续系统形式不同）", "离散系统能控性与采样周期有关（相同连续系统离散化后，采样周期不同可能导致能控性变化）", "标准状态方程为x(k+1)=Ax(k)+Bu(k)（k为离散时间步长）", "系统完全能控的充要条件是能控性矩阵C_d的秩等于n", ""], "r": "BCD", "e": "A选项能控性矩阵形式与连续系统相同；B选项离散系统能控性与采样周期有关；C选项标准状态方程表述正确；D选项系统完全能控充要条件是能控性矩阵秩等于n。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401834", "t": 2, "q": "线性定常离散系统的状态转移矩阵Φ(k)（k为离散时间步长）的特性，正确的有", "a": ["Φ(k₁+k₂)=Φ(k₁)Φ(k₂)（半群性，k₁、k₂为非负整数）", "Φ(k)=A^k（系统矩阵A的k次幂）", "Φ(-k)=Φ⁻¹(k)=(A<sup>k)⁻¹=(A⁻¹)<\/sup>k（可逆性，A可逆时）", "Φ(0)=I（单位矩阵）", "", ""], "r": "ACD", "e": "1. 分析 对于线性定常离散系统，状态转移矩阵「test/yiwen_img/importSubject/2034803654355193856.png」具有以下特性： 半群性：「test/yiwen_img/importSubject/2034803654447468544.png」，其中「test/yiwen_img/importSubject/2034803654560714752.png」为非负整数，这是状态转移矩阵的基本性质，反映了系统状态的迭代关系。 可逆性：当系统矩阵A可逆时，「test/yiwen_img/importSubject/2034803654636212224.png」，因为「test/yiwen_img/importSubject/2034803654728486912.png」（当A为系统矩阵时），根据矩阵的幂运算性质可得其逆矩阵的关系。 初始值：「test/yiwen_img/importSubject/2034803653373726720.png」，表示初始时刻系统状态没有发生变化。 选项B中「test/yiwen_img/importSubject/2034803654728486912.png」的前提是系统矩阵A是状态转移矩阵「test/yiwen_img/importSubject/2034803654355193856.png」在k = 1时的情况，并且这里没有明确这个前提条件，所以选项B不完全正确。2. 答案 正确答案为ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401835", "t": 2, "q": "线性定常离散系统状态方程x(k+1)=Ax(k)+Bu(k)的解的组成及特性，正确的有", "a": ["解的表达式为x(k)=A^k x(0)+∑_{i=0}<sup>{k-1}A<\/sup>(k-1-i)B u(i)（k≥1）", "离散系统解的收敛性取决于A的特征值模值（若模值小于1则自由响应衰减，若模值大于1则发散）", "第一项A^k x(0)代表零输入响应（自由响应），由系统的初始状态决定", "第二项∑_{i=0}<sup>{k-1}A<\/sup>(k-1-i)B u(i)代表零状态响应（强迫响应），由外部输入序列决定", "", ""], "r": "ABCD", "e": "这是关于线性定常离散系统状态方程解的知识点。A是解的表达式；B中系统收敛确实取决于A特征值模值，模值小于1自由响应衰减，大于1发散；C中A^k x(0)就是零输入响应，只和初始状态有关；D中∑_{i=0}^{k - 1}A^{k - 1 - i}B u(i)是零状态响应，由外部输入决定。ABCD表述都正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401836", "t": 2, "q": "线性定常连续系统离散化后的能控性与能观性，正确的说法有", "a": ["采样周期T越小，离散化系统越接近连续系统，能控性/能观性保持的可能性越大", "连续系统能观，离散化后不一定能观（与采样周期T有关）", "若连续系统的极点满足λ_i-λ_j≠2kπj/T（k为整数，j为虚数单位），则离散化后能控性/能观性与连续系统一致", "连续系统能控，离散化后不一定能控（与采样周期T有关）", "", ""], "r": "ABCD", "e": "采样周期T对离散化系统的能控性和能观性有影响，T越小越接近连续系统，能控/能观性保持可能性大；连续系统能控或能观时，离散化后不一定能控或能观，与T有关；当连续系统极点满足特定条件，离散化后能控/能观性与连续系统一致。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803661418401837", "t": 2, "q": "线性定常齐次状态方程x_dot=Ax的解x(t)=Φ(t)x(0)，其中状态转移矩阵Φ(t)需满足的性质有", "a": ["dΦ(t)/dt=AΦ(t)=Φ(t)A", "Φ(0)=单位矩阵I", "Φ(t₁+t₂)=Φ(t₁)Φ(t₂)（t₁,t₂≥0）", "Φ(-t)=Φ⁻¹(t)", "", ""], "r": "ABCD", "e": "状态转移矩阵Φ(t)具有上述ABCD所描述的全部性质，A选项体现其与矩阵A的导数关系，B选项是初始条件，C选项为可加性，D选项说明其逆的性质。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950656", "t": 3, "q": "经典控制理论仅能处理单输入单输出线性定常系统，无法处理多输入多输出或时变系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950657", "t": 3, "q": "经典控制理论中的传递函数包含了系统的所有动态信息，能完全描述系统的内部行为。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "传递函数是基于系统输入输出关系建立的，不能反映系统内部中间变量的变化，不能完全描述系统内部行为。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950658", "t": 3, "q": "经典控制理论中的根轨迹法与现代控制理论中的极点配置，均以调整系统的闭环极点位置为目标。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根轨迹法是根据系统开环零极点分布绘制闭环极点随参数变化的轨迹，通过调整参数改变闭环极点位置；极点配置是通过状态反馈将闭环系统的极点配置到期望位置。二者都围绕调整闭环极点位置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950659", "t": 3, "q": "经典控制理论中的劳斯判据和现代控制理论中的李雅普诺夫第一方法，均需通过求解系统的特征值来判定稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "劳斯判据是通过构造劳斯表来判定系统稳定性，无需求解特征值；李雅普诺夫第一方法需要求解系统的特征值来判定稳定性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950660", "t": 3, "q": "经典控制理论中的频率响应法和现代控制理论中的状态空间法，均属于时域分析方法。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "频率响应法是频域分析方法，状态空间法是时域分析方法，并非二者都属于时域分析方法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950661", "t": 3, "q": "控制系统的\"状态\"是指系统当前时刻的输出变量集合，仅需输出变量即可完全描述系统的未来行为。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "控制系统的“状态”是指能完全描述系统运动状态的一个最小变量组，不只是输出变量集合，仅靠输出变量通常不能完全描述系统未来行为。", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950662", "t": 3, "q": "李雅普诺夫第二方法应用于非线性系统时，若系统存在多个平衡状态，需分别为每个平衡状态构造李雅普诺夫函数，不能共用一个V(x)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于存在多个平衡状态的非线性系统，不同平衡状态的特性不同，通常要分别为每个平衡状态构造合适的李雅普诺夫函数来判断稳定性，不能共用一个V(x)。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950663", "t": 3, "q": "李雅普诺夫第二方法应用于线性定常系统时，如果李雅普诺夫方程(A^T P + PA = -Q)的解P存在且唯一，并且给定的矩阵Q是正定的，则可以推导出P也是正定的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于线性定常系统，当李雅普诺夫方程「test/yiwen_img/importSubject/2034803653558276096.png」解P存在且唯一，且Q正定，根据李雅普诺夫稳定性理论可推出P正定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950664", "t": 3, "q": "李雅普诺夫第二方法应用于线性定常系统时，若存在正定对称矩阵P满足A^T P + P A = -Q（Q为正定对称矩阵），则系统平衡状态是渐近稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是李雅普诺夫第二方法用于线性定常系统的稳定性判据，当存在正定对称矩阵P使「test/yiwen_img/importSubject/2034803653558276096.png」（Q正定对称）时，系统平衡状态渐近稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950665", "t": 3, "q": "在李雅普诺夫第二方法中，李雅普诺夫函数V(x)必须是二次型函数（如V(x)=x^T P x），非二次型函数无法作为V(x)。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "李雅普诺夫函数并不局限于二次型函数，非二次型函数也可以作为李雅普诺夫函数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950666", "t": 3, "q": "李雅普诺夫第二方法中，若存在正定函数V(x)且其导数V_dot(x)为负定，则系统平衡状态一定是渐近稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是李雅普诺夫第二方法判定系统渐近稳定的基本定理内容。当存在正定函数V(x)且其导数V_dot(x)为负定时，可判定系统平衡状态渐近稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950667", "t": 3, "q": "在李雅普诺夫第二方法中，若未找到合适的李雅普诺夫函数V(x)，则可判定系统平衡状态是不稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在李雅普诺夫第二方法里，没找到合适的李雅普诺夫函数V(x)，不能判定系统平衡状态不稳定，可能只是没找到合适的函数而已。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950668", "t": 3, "q": "在李雅普诺夫第二方法中，若系统平衡状态是不稳定的，则一定存在正定函数V(x)且其导数V_dot(x)为正定函数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "李雅普诺夫第二方法里，系统平衡状态不稳定时，不存在正定函数V(x)使得其导数「test/yiwen_img/importSubject/2034803653642162176.png」为正定函数。", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950669", "t": 3, "q": "李雅普诺夫第二方法中，若V(x)为正定函数且V_dot(x)为半负定，且对任意x≠0，V_dot(x)不恒为零，则系统平衡状态是稳定但非渐近稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950670", "t": 3, "q": "在李雅普诺夫第二方法中，若V(x)为正定函数且V_dot(x)为零函数（对所有x，V_dot(x)=0），则系统平衡状态是渐近稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在李雅普诺夫第二方法中，若V(x)正定且「test/yiwen_img/importSubject/2034803653642162176.png」为零函数，系统平衡状态是李雅普诺夫意义下稳定，但不是渐近稳定，渐近稳定要求「test/yiwen_img/importSubject/2034803653642162176.png」负定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950671", "t": 3, "q": "李雅普诺夫第二方法中，V(x)的径向无界性是判定系统全局渐近稳定的必要条件（无径向无界性，系统无法全局渐近稳定）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在李雅普诺夫第二方法里，V(x)径向无界性是判定系统全局渐近稳定的必要条件，若不满足此条件，系统不能全局渐近稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950672", "t": 3, "q": "李雅普诺夫第一方法（间接法）适用于所有非线性系统的稳定性分析，无需对系统进行线性化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "李雅普诺夫第一方法（间接法）需对系统进行线性化，且并非适用于所有非线性系统稳定性分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950673", "t": 3, "q": "李雅普诺夫第一方法分析非线性系统稳定性时，若线性化模型的所有特征值实部均小于0，则原非线性系统的平衡状态是全局渐近稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "李雅普诺夫第一方法中，线性化模型所有特征值实部均小于0时，原非线性系统的平衡状态是局部渐近稳定，而非全局渐近稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950674", "t": 3, "q": "李雅普诺夫第一方法分析线性定常系统稳定性时，若系统矩阵A的所有特征值实部均小于0，则系统平衡状态是全局渐近稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于线性定常系统，根据李雅普诺夫第一方法，当系统矩阵A的所有特征值实部均小于0时，系统的平衡状态满足全局渐近稳定的条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950675", "t": 3, "q": "李雅普诺夫第一方法分析线性时变系统稳定性时，需求解系统矩阵A(t)的特征值，若所有特征值实部均小于0，则系统渐近稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "李雅普诺夫第一方法分析线性时变系统稳定性，不能仅通过求解系统矩阵A(t)的特征值判断，该方法主要针对线性定常系统，用特征值判断稳定性，对线性时变系统不适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950676", "t": 3, "q": "李雅普诺夫第一方法中，若线性化模型存在实部大于0的特征值，则原非线性系统的平衡状态是不稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "李雅普诺夫第一方法规定，当线性化模型存在实部大于 0 的特征值时，原非线性系统平衡状态不稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950677", "t": 3, "q": "在李雅普诺夫稳定性分析中，\"不稳定\"的平衡状态是指所有初始状态下，系统状态均会发散到无穷远。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“不稳定”平衡状态并非指所有初始状态下系统状态都发散到无穷远，只要存在某个初始状态使系统状态不收敛到平衡状态，就称平衡状态不稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950678", "t": 3, "q": "在李雅普诺夫稳定性分析中，\"渐近稳定\"的平衡状态对初始条件不敏感，任意初始状态下系统均能收敛到平衡状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "渐近稳定要求系统不仅在平衡状态附近有李雅普诺夫意义下的稳定，且从平衡状态附近出发的状态轨迹最终要收敛到平衡状态，但不是任意初始状态，只是平衡状态附近的初始状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950679", "t": 3, "q": "在李雅普诺夫稳定性分析中，\"渐近稳定\"的平衡状态一定是\"稳定\"的，但\"稳定\"的平衡状态不一定是\"渐近稳定\"的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "渐近稳定要求系统不仅稳定，还会随时间趋于平衡状态，所以渐近稳定必然稳定；而稳定状态可能只是在平衡状态附近有界波动，不一定会趋于平衡状态，即稳定不一定渐近稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950680", "t": 3, "q": "李雅普诺夫稳定性分析中，\"临界稳定\"的平衡状态在工程中是可接受的，因其状态不会发散。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在工程实际中，临界稳定状态下系统受微小扰动后，状态虽不发散但可能持续等幅振荡，这会使系统性能变差甚至无法正常工作，通常是不可接受的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950681", "t": 3, "q": "在李雅普诺夫稳定性分析中，“全局渐近稳定”的平衡状态一定是“渐近稳定”的，但“渐近稳定”的平衡状态不一定是“全局渐近稳定”的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950682", "t": 3, "q": "李雅普诺夫稳定性分析中，“稳定”的平衡状态允许状态在平衡状态邻域内振荡，但振荡振幅必须有界。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在李雅普诺夫稳定性定义里，稳定的平衡状态下，系统受扰动偏离平衡状态后，其状态在平衡状态邻域内变化，振荡振幅有界。", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950683", "t": 3, "q": "在李雅普诺夫稳定性分析中，\"一致渐近稳定\"的平衡状态在线性定常系统中与\"渐近稳定\"等价。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在线性定常系统里，平衡状态的“一致渐近稳定”和“渐近稳定”概念是等价的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950684", "t": 3, "q": "在李雅普诺夫稳定性分析中，“一致稳定”的平衡状态与“稳定”的平衡状态的区别在于，一致稳定的稳定性与初始时刻t₀无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在李雅普诺夫稳定性分析里，稳定的平衡状态可能与初始时刻t₀有关，而一致稳定强调稳定性不依赖于初始时刻t₀。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950685", "t": 3, "q": "李雅普诺夫稳定性分析中，平衡状态的稳定性是指系统在受到扰动后，状态能恢复到平衡状态的能力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950686", "t": 3, "q": "在李雅普诺夫稳定性分析中，若V(x)为正定函数且V_dot(x)为正定函数，则系统平衡状态是稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在李雅普诺夫稳定性分析里，要求V(x)正定，V_dot(x)负定，系统平衡状态才稳定，题中V_dot(x)为正定不符合稳定条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950687", "t": 3, "q": "在李雅普诺夫稳定性分析中，V(x)必须是正定函数，负定函数不能作为李雅普诺夫函数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在李雅普诺夫稳定性分析里，V(x)可以是正定函数，也可以是负定函数，负定函数同样能作为李雅普诺夫函数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950688", "t": 3, "q": "若线性定常系统的传递函数存在零极点对消，则该系统一定是不完全能控或不完全能观的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统传递函数存在零极点对消，意味着系统状态空间描述中存在不能控或不能观的状态分量，所以系统一定是不完全能控或不完全能观的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950689", "t": 3, "q": "现代控制理论的核心是状态空间分析与设计，所有现代控制方法（如极点配置、观测器、最优控制）均基于状态空间模型。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "现代控制理论以状态空间分析与设计为核心，众多现代控制方法像极点配置、观测器、最优控制等都是基于状态空间模型来展开的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950690", "t": 3, "q": "现代控制理论仅适用于线性系统，无法处理非线性系统的分析与控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现代控制理论不仅能处理线性系统，也可用于非线性系统的分析与控制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950691", "t": 3, "q": "现代控制理论与经典控制理论的核心区别在于，现代控制理论关注系统内部状态，经典控制理论仅关注系统输入输出关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "现代控制理论以状态空间法为基础，着重研究系统内部状态；经典控制理论主要基于传递函数，重点关注系统输入输出关系，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950692", "t": 3, "q": "现代控制理论与经典控制理论是相互独立的，无法在同一控制系统中结合应用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现代控制理论和经典控制理论并非相互独立、不能结合，实际中可根据系统特点，在同一控制系统里结合二者优势来设计控制方案。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950693", "t": 3, "q": "现代控制理论在电力系统中的应用，仅包括发电机励磁控制，不涉及电力系统稳定控制、调频控制等。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现代控制理论在电力系统中的应用广泛，除了发电机励磁控制，还涉及电力系统稳定控制、调频控制等多个方面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950694", "t": 3, "q": "现代控制理论中的鲁棒控制，其核心是使系统在参数摄动、外部扰动下仍保持稳定，与李雅普诺夫稳定性分析无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "鲁棒控制核心是让系统在参数摄动、外部扰动下保持稳定，而李雅普诺夫稳定性分析是研究系统稳定性的重要方法，鲁棒控制的分析和设计常借助李雅普诺夫稳定性理论，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950695", "t": 3, "q": "现代控制理论中的模型预测控制（MPC），其核心是通过滚动优化，在每个时刻求解有限时域内的最优控制问题，无需考虑系统的能控性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "模型预测控制虽通过滚动优化求解有限时域最优控制问题，但系统的能控性是实现有效控制的基础，若系统不能控，就无法通过控制输入使系统达到期望状态，所以必须考虑系统能控性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950696", "t": 3, "q": "现代控制理论中的最优控制，必须基于系统的状态空间模型，无法基于经典的传递函数模型设计。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950697", "t": 3, "q": "现代控制理论中的最优控制，其目标是在满足系统约束的前提下，使某个性能指标（如误差积分）达到最大值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "最优控制目标是在满足系统约束下让某个性能指标达到最优，通常是最小值而非最大值，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950698", "t": 3, "q": "线性定常非齐次状态方程x_dot=Ax+Bu的解由两部分组成:初始状态引起的自由响应和输入引起的强迫响应。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常非齐次状态方程的解确实是由初始状态激励下的自由响应和输入激励下的强迫响应这两部分构成。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950699", "t": 3, "q": "线性定常离散系统的稳定性判定中，若系统矩阵A的所有特征值模值均小于1，则系统平衡状态是渐近稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在线性定常离散系统稳定性判定里，系统矩阵A所有特征值模值小于1是系统平衡状态渐近稳定的充要条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950700", "t": 3, "q": "线性定常离散系统的稳定性判定中，若系统矩阵A的特征值模值等于1，则系统平衡状态是临界稳定的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常离散系统稳定的充要条件是系统矩阵A的所有特征值模值都小于1，当有特征值模值等于1时，系统是不稳定的，并非临界稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950701", "t": 3, "q": "线性定常离散系统的状态方程解x(k)=A<sup>kx(0)+∑_{i=0}<\/sup>{k-1}A^(k-1-i)Bu(i)，其中∑项是输入引起的强迫响应。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在离散系统状态方程解的表达式中，「test/yiwen_img/importSubject/2034803654841733120.png」是零输入响应，「test/yiwen_img/importSubject/2034803654934007808.png」是由输入u(i)引起的强迫响应。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950702", "t": 3, "q": "线性定常离散系统的状态方程x(k+1)=Ax(k)+Bu(k)，若A为单位矩阵，则系统的状态x(k)=x(0)+∑_{i=0}^{k-1}Bu(i)（积分特性）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当A为单位矩阵时，根据线性定常离散系统状态方程递推可得x(1)=Ax(0)+Bu(0)=x(0)+Bu(0)，x(2)=Ax(1)+Bu(1)=x(1)+Bu(1)=x(0)+Bu(0)+Bu(1)，以此类推，「test/yiwen_img/importSubject/2034803655026282496.png」。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950703", "t": 3, "q": "线性定常离散系统的状态转移矩阵Φ(k)，若A为对角矩阵diag(λ₁,λ₂,...,λₙ)，则Φ(k)=diag(λ₁<sup>k,λ₂<\/sup>k,...,λₙ^k)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于线性定常离散系统，当系统矩阵A为对角矩阵「test/yiwen_img/importSubject/2034803655110168576.png」时，状态转移矩阵「test/yiwen_img/importSubject/2034803654728486912.png」，而对角矩阵的k次幂等于对角元素分别取k次幂，即「test/yiwen_img/importSubject/2034803655244386304.png」，题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803664106950704", "t": 3, "q": "线性定常离散系统的状态转移矩阵Φ(k) = A^k，其中A是系统矩阵，k是离散时间步长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于线性定常离散系统，其状态转移矩阵Φ(k) 可由定义推出表达式为 A^k 。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 现代控制理论（2）", "n": "基础练习题【含解析】 / 第2章 现代控制理论（2）", "qs": [{"id": "2034803675012141056", "t": 1, "q": "线性定常齐次状态方程x_dot=Ax，若A的特征值为λ₁和λ₂（λ₁≠λ₂），则其状态转移矩阵Φ(t)的形式为", "a": ["P[[e(λ₁t),0],[0,e(λ₂t)]]P⁻¹（P为A的特征向量矩阵）", "[[e(λ₁t),0],[0,e(λ₂t)]]", "[[λ₁e(λ₁t),0],[0,λ₂e(λ₂t)]]", "P[[λ₁e(λ₁t),0],[0,λ₂e(λ₂t)]]P⁻¹", "", ""], "r": "A", "e": "对于线性定常齐次状态方程x_dot = Ax，当A有n个互异特征值时，状态转移矩阵Φ(t)=e^(At)=Pdiag(e^(λ₁t),e^(λ₂t),…,e^(λₙt))P⁻¹，这里n = 2。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141057", "t": 1, "q": "线性定常齐次状态方程x_dot=Ax，若A为奇异矩阵（det(A)=0），则其平衡状态的个数为", "a": ["0个", "无穷多个", "与系统阶数n相等", "1个（仅x_e=0）", "", ""], "r": "B", "e": "对于线性定常齐次状态方程「test/yiwen_img/importSubject/2034803668544524288.png」，平衡状态满足Ax = 0。A为奇异矩阵即「test/yiwen_img/importSubject/2034803668754239488.png」，意味着A不满秩，齐次线性方程组Ax = 0有非零解，且解有无穷多个，也就是平衡状态有无穷多个。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141058", "t": 1, "q": "线性定常齐次状态方程x_dot=Ax的解，其表达式正确的是（x(0)为初始状态，Φ(t)为状态转移矩阵）", "a": ["x(t)=Φ(t)x(0)+∫₀ᵗΦ(t-τ)B u(τ)dτ", "x(t)=Φ(t)x(0)", "x(t)=Φ(t)A x(0)", "x(t)=AΦ(t)x(0)", "", ""], "r": "B", "e": "线性定常齐次状态方程不含输入项，其解就是初始状态经状态转移矩阵变换得到，即x(t)=Φ(t)x(0)。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141059", "t": 1, "q": "线性定常系统（A,B,C）的传递函数矩阵G（　）的表达式为", "a": ["(s I-A)⁻¹B C+D", "A(s I-C)⁻¹B+D", "C(s I-A)⁻¹B+D", "C B(s I-A)⁻¹+D", "", ""], "r": "C", "e": "线性定常系统（A,B,C）传递函数矩阵G(s)推导得出表达式为C(sI - A)⁻¹B + D 。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141060", "t": 1, "q": "线性定常系统（A,B）能控，若对系统进行状态反馈u=-Kx+v（v为参考输入），则闭环系统的能控性为", "a": ["一定能控", "一定不能控", "取决于反馈矩阵K的选择", "取决于参考输入v的形式", "", ""], "r": "A", "e": "状态反馈不改变系统的能控性，已知原线性定常系统（A,B）能控，进行状态反馈u = -Kx + v后，闭环系统一定能控。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141061", "t": 1, "q": "线性定常系统（A,B）能控，若输入矩阵B的秩为p（p为输入个数），则能控性矩阵C的秩至少为", "a": ["1", "p", "q（输出个数）", "n（系统阶数）", "", ""], "r": "B", "e": "根据线性定常系统能控性相关知识，若系统（A,B）能控，输入矩阵B秩为p，能控性矩阵C的秩至少为p 。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141062", "t": 1, "q": "线性定常系统（A,C）能观，若对系统设计全维观测器，观测器的阶数为", "a": ["n-q", "p（输入个数）", "q（输出个数）", "n（系统阶数）", "", ""], "r": "D", "e": "全维观测器是要重构系统的所有状态，系统状态的维数是n，所以全维观测器阶数就是n。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141063", "t": 1, "q": "线性定常系统（A,C）能观性的物理意义是", "a": ["输入能否控制系统状态的变化", "输出能否唯一确定系统的初始状态", "输出能否跟踪输入的变化", "状态能否影响系统的输出", "", ""], "r": "B", "e": "能观性研究的是根据系统输出能否确定系统初始状态。A选项说的是能控性；C选项与能观性概念无关；D选项不是能观性的物理意义。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141064", "t": 1, "q": "线性定常系统的能观性矩阵O=[C; CA; ...; CA^(n-1)]，若系统能观，则O的秩为", "a": ["n（系统阶数）", "p（输入个数）", "q（输出个数）", "nq", "", ""], "r": "A", "e": "根据线性定常系统能观性判据，系统能观的充要条件是能观性矩阵O的秩为系统阶数n。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141065", "t": 1, "q": "线性定常系统的能控性和能观性之间的关系，以下说法正确的是", "a": ["能控性和能观性同时存在或同时不存在", "能控的系统一定能观", "能观的系统一定能控", "能控性和能观性是相互独立的，一个系统可能能控不能观，或能观不能控", "", ""], "r": "D", "e": "线性定常系统中，能控性和能观性相互独立，系统情况多样，可能能控不能观，也可能能观不能控。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141066", "t": 1, "q": "线性定常系统的状态转移矩阵Φ(t)，当t=0时的值为", "a": ["系统矩阵A", "零矩阵", "逆矩阵Φ⁻¹(t)", "单位矩阵I", "", ""], "r": "D", "e": "根据状态转移矩阵性质，线性定常系统的状态转移矩阵Φ(t)在t = 0时，系统状态未发生转移，所以Φ(0)为单位矩阵I。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141067", "t": 1, "q": "线性定常系统能观性的秩判据中，能观性矩阵O的维度是", "a": ["n×q", "q×n", "n×nq", "nq×n（n为系统阶数，q为输出个数）", "", ""], "r": "B", "e": "线性定常系统的能观性判据涉及到能观性矩阵O。能观性矩阵O是由系统的输出矩阵C和状态转移矩阵φ(t,t0)构成的，具体形式为O=[C φ(t,t0)C φ(t,t0)^2C ... φ(t,t0)^(n-1)C]，其中n是系统的阶数，也就是状态变量的个数。输出矩阵C的维度是q×n，状态转移矩阵φ(t,t0)的维度是n×n，因此能观性矩阵O的维度是q×n乘以n×n的矩阵相乘，结果是q×n^2。但是，这里的表述可能有误，因为通常我们说的能观性矩阵O的维度是指输出矩阵C乘以状态转移矩阵的幂次构成的矩阵的维度，即q×n。所以，正确答案是B.q×n。", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141068", "t": 1, "q": "线性定常系统能观性的秩判据中，若系统阶数n=2，输出个数q=2，则能观性矩阵的维度为", "a": ["2×1", "2×2", "2×4", "4×2", "", ""], "r": "D", "e": "能观性矩阵维度是nq×n，已知n = 2，q = 2，则维度为4×2。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141069", "t": 1, "q": "线性定常系统能控性的物理意义对应的工程应用是", "a": ["设计输出反馈调整输出特性", "设计观测器估计不可测状态", "设计状态反馈实现极点配置", "设计滤波器抑制噪声", "", ""], "r": "C", "e": "线性定常系统能控性意味着可通过控制输入使系统状态在有限时间内从任意初始状态转移到任意期望状态，这是设计状态反馈实现极点配置的基础。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141070", "t": 1, "q": "线性定常系统能控性的物理意义是", "a": ["系统能否抵抗外部扰动", "系统能否跟踪参考输入", "输出能否反映系统的状态", "输入能否在有限时间内将系统从任意初始状态转移到任意目标状态", "", ""], "r": "D", "e": "线性定常系统能控性指的就是输入能否在有限时间内把系统从任意初始状态转移到任意目标状态。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141071", "t": 1, "q": "线性定常系统能控性的秩判据中，能控性矩阵包含的块矩阵个数为", "a": ["n个（n为系统阶数）", "p个（p为输入个数）", "np个", "q个（q为输出个数）", "", ""], "r": "A", "e": "线性定常系统能控性秩判据里，能控性矩阵包含的块矩阵个数是系统阶数n个。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141072", "t": 1, "q": "线性定常系统能控性的秩判据中，能控性矩阵的维度是", "a": ["n×n（n为系统阶数）", "np×n", "n×q（q为输出变量个数）", "n×np（p为输入变量个数）", "", ""], "r": "D", "e": "线性定常系统能控性矩阵为「test/yiwen_img/importSubject/2034803668859097088.png」，其中A是「test/yiwen_img/importSubject/2034803668963954688.png」矩阵，B是「test/yiwen_img/importSubject/2034803669068812288.png」矩阵，所以「test/yiwen_img/importSubject/2034803669140115456.png」是「test/yiwen_img/importSubject/2034803669224001536.png」矩阵。答案选D。 <br />正确答案为D，即能控性矩阵的维度应为 \\(n \times np\\)，其中 \\(n\\) 是系统的阶数，\\(p\\) 是输入向量的维数。这反映了所有可能通过输入影响的状态变化情况。", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141073", "t": 1, "q": "线性定常系统能控性的秩判据中，若系统阶数n=3，输入个数p=2，则能控性矩阵的维度为", "a": ["3×3", "2×3", "6×3", "3×6", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141074", "t": 1, "q": "线性定常系统能控性的秩判据中，若系统阶数n=4，输入个数p=1，则能控性矩阵包含的块矩阵个数为", "a": ["16个", "1个", "4个", "5个", "", ""], "r": "C", "e": "对于线性定常系统能控性秩判据，当系统阶数为n，输入个数为p时，能控性矩阵包含的块矩阵个数为n。本题n = 4，所以包含4个块矩阵。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141075", "t": 1, "q": "已知线性定常系统的能观性矩阵O=[C;CA]（n=2），若C=[1,0]，A=[[0,1],[1,0]]，则该系统的能观性为", "a": ["部分能观", "无法判定", "能观", "不能观", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141076", "t": 1, "q": "已知线性定常系统的能控性矩阵C=[B AB]（n=2），若B=[1;0]，A=[[0,1],[0,0]]，则该系统的能控性为", "a": ["无法判定", "不能控", "部分能控", "能控", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141077", "t": 1, "q": "已知线性定常系统的系统矩阵A=[[-1,0],[0,-2]]，则其状态转移矩阵Φ(t)为", "a": ["[[1,e(-t)],[e(-2t),0]]", "[[et,0],[0,e(2t)]]", "[[e(-t),0],[0,e(-2t)]]", "[[e(-t),1],[0,e(-2t)]]", "", ""], "r": "C", "e": "对于系统矩阵为对角阵的线性定常系统，状态转移矩阵Φ(t)是由系统矩阵对角元素取指数构成的对角阵。本题系统矩阵A对角元素为 -1 和 -2，所以状态转移矩阵Φ(t)对角元素为 e^(-t) 和 e^(-2t) 。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141078", "t": 1, "q": "已知线性定常系统的系统矩阵A为2×2矩阵，状态转移矩阵Φ(t)的行列式det(Φ(t))的值始终满足", "a": ["det(Φ(t))=e^(tr(A)t)（tr(A)为A的迹）", "det(Φ(t))=tr(A)e^(t)", "det(Φ(t))=1", "det(Φ(t))=0", "", ""], "r": "A", "e": "根据线性定常系统状态转移矩阵的性质，det(Φ(t)) = e^(tr(A)t) ，tr(A) 是系统矩阵 A 的迹。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141079", "t": 1, "q": "已知线性定常系统x_dot=Ax的平衡状态x_e=0是渐近稳定的，根据李雅普诺夫第一方法（间接法），其充要条件是", "a": ["系统矩阵A的所有特征值均为纯虚数", "系统矩阵A的所有特征值实部均大于0", "系统矩阵A的所有特征值模值均小于1", "系统矩阵A的所有特征值实部均小于0", "", ""], "r": "D", "e": "根据李雅普诺夫第一方法，线性定常系统x_dot = Ax的平衡状态x_e = 0渐近稳定的充要条件是系统矩阵A的所有特征值实部均小于0。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141080", "t": 1, "q": "以下关于经典控制理论局限性的说法，错误的是", "a": ["仅适用于线性定常系统", "难以处理多输入多输出系统", "无法分析系统的内部状态", "无法判定系统的稳定性", "", ""], "r": "D", "e": "经典控制理论可通过劳斯判据、奈奎斯特判据等判定系统稳定性，D选项说法错误。经典控制理论确实主要适用于线性定常系统，处理多输入多输出系统较难，且主要基于外部输入输出特性，难以分析系统内部状态。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141081", "t": 1, "q": "以下关于经典控制理论与现代控制理论的比较，说法错误的是", "a": ["经典控制理论适用于时变系统，而现代控制理论主要针对定常系统", "经典控制理论难以处理多变量系统，现代控制理论则能有效处理多变量系统", "经典控制理论侧重于研究系统的输入输出关系，而现代控制理论更注重系统内部状态的分析", "经典控制理论常用频域分析方法，现代控制理论则更多采用状态空间法（时域分析）", "", ""], "r": "A", "e": "经典控制理论主要针对定常系统，现代控制理论适用于时变系统等更复杂系统，A说法错误。B、C、D选项对经典与现代控制理论特点描述均正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141082", "t": 1, "q": "以下关于能控性和能观性的判定，说法正确的是", "a": ["若系统能观，则其所有输出均可通过状态确定", "若系统能控，则其所有状态均可通过输入控制", "若系统能观，则其能观性矩阵一定是满列秩", "若系统能控，则其能控性矩阵一定是满行秩", "", ""], "r": "C", "e": "这是一道关于线性系统能控性和能观性的选择题。我们可以根据能控性和能观性的基本定义和性质，对每个选项进行简要分析：A. 若系统能观，则其所有输出均可通过状态确定。 这个说法是正确的，但它不是本题要考察的关键点。能观性意味着系统的状态可以通过输出来完全确定。B. 若系统能控，则其所有状态均可通过输入控制。 这个说法也是正确的，但它同样不是本题的核心考察点。能控性意味着系统的状态可以通过输入来任意改变。C. 若系统能观，则其能观性矩阵一定是满列秩。 这个说法是正确的，并且是本题的关键考察点。系统的能观性可以通过能观性矩阵来判断，若能观性矩阵是满列秩的，则系统是能观的。这是因为满列秩意味着矩阵的列向量线性无关，从而保证了系统的状态可以通过输出完全确定。D. 若系统能控，则其能控性矩阵一定是满行秩。 虽然这个说法在一般情况下是正确的，但它不是本题要考察的重点。能控性矩阵的满行秩是系统能控的一个充分条件，但不是必要条件。综上所述，本题主要考察的是能观性矩阵的性质，因此正确答案是C：若系统能观，则其能观性矩阵一定是满列秩。", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141083", "t": 1, "q": "以下关于现代控制理论发展背景的说法，正确的是", "a": ["仅基于数学理论推导，无实际工程需求", "无法应用于工业控制系统", "仅为解决电力系统控制问题而发展", "由于经典控制理论无法处理多变量、时变系统等复杂问题而发展", "", ""], "r": "D", "e": "经典控制理论有局限性，难以处理多变量、时变系统等复杂问题，现代控制理论因此发展起来。A项现代控制理论有实际工程需求；B项它可用于工业控制系统；C项不只是为解决电力系统控制问题。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141084", "t": 1, "q": "以下关于现代控制理论应用的说法，正确的是", "a": ["仅用于线性系统的控制设计", "可用于航空航天、机器人、化工等多领域的控制系统设计", "无法用于离散系统的控制设计", "仅用于电力系统的控制", "", ""], "r": "B", "e": "现代控制理论应用广泛，并非局限于特定系统或领域。它可用于线性、非线性、连续、离散等多种系统，在航空航天、机器人、化工等众多领域的控制系统设计中都有应用。A选项“仅用于线性系统”、C选项“无法用于离散系统”、D选项“仅用于电力系统”表述均错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141085", "t": 1, "q": "以下关于线性定常系统能观性的说法，错误的是", "a": ["能观性描述输出对状态的反映能力", "能观性是系统的固有属性，与输入无关", "若系统能观，则其能观性矩阵的秩等于状态变量个数n", "能观性在非奇异线性变换下保持不变", "", ""], "r": "C", "e": "本题可根据线性定常系统能观性的相关知识来逐一分析选项。 选项A：能观性就是研究系统的输出能否反映系统状态的问题，即描述输出对状态的反映能力，该选项说法正确。 选项B：能观性是系统的一种固有属性，它只取决于系统的结构和参数，与输入信号无关，该选项说法正确。 选项C：系统能观的充要条件是其能观性矩阵的秩等于状态变量个数n，而不是“若系统能观，则其能观性矩阵的秩等于状态变量个数n”这种简单的表述逻辑错误，应该是能观性矩阵秩等于n则系统能观，该选项说法错误。 选项D：能观性在非奇异线性变换下保持不变，这是能观性的一个重要性质，该选项说法正确。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141086", "t": 1, "q": "以下关于线性定常系统能控性和能观性的关系，说法正确的是", "a": ["能控性和能观性由系统的传递函数完全决定", "能观的系统一定能控", "能控的系统一定能观", "能控性和能观性反映系统不同的固有属性，相互独立", "", ""], "r": "D", "e": "系统能控性和能观性是反映系统不同的固有属性，二者相互独立，传递函数不能完全决定能控性和能观性，能控不一定能观，能观也不一定能控。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141087", "t": 1, "q": "以下关于线性定常系统状态转移矩阵的说法，错误的是", "a": ["Φ(t)是可逆矩阵", "Φ(-t)=Φ⁻¹(t)", "Φ(t)的行列式值恒为1", "Φ(t₁+t₂)=Φ(t₁)Φ(t₂)", "", ""], "r": "C", "e": "线性定常系统状态转移矩阵性质有可逆，即Φ(t)可逆且Φ(-t)=Φ⁻¹(t)，满足Φ(t₁ + t₂)=Φ(t₁)Φ(t₂) ，但行列式值不一定恒为1。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141088", "t": 1, "q": "以下关于线性定常系统状态转移矩阵的运算，正确的是", "a": ["Φ(t₁)+Φ(t₂)=Φ(t₁+t₂)", "Φ(t)Φ(-t)=I", "Φ(t)=Φ(t+T)（T为周期，对任意t）", "Φ(t₁)Φ(t₂)=Φ(t₁t₂)", "", ""], "r": "B", "e": "状态转移矩阵有性质：Φ(t)Φ(-t)=I 。A选项，状态转移矩阵不满足加法等于时间相加的关系；C选项，线性定常系统状态转移矩阵一般不是周期函数；D选项，状态转移矩阵相乘不是时间相乘的关系。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141089", "t": 1, "q": "以下关于状态转移矩阵的说法，正确的是", "a": ["Φ(t)的逆矩阵不存在", "Φ(t)仅与系统矩阵A有关，与初始时刻无关", "Φ(t)是对称矩阵", "Φ(t,t₀)仅与时间差t-t₀有关，与t₀无关（对定常系统）", "", ""], "r": "D", "e": "状态转移矩阵逆矩阵存在，A错；它与初始时刻有关，B错；不一定是对称矩阵，C错；定常系统中Φ(t,t₀)仅与时间差t - t₀有关，与t₀无关，D正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141090", "t": 1, "q": "以下关于状态转移矩阵的运算性质，说法正确的是", "a": ["Φ(t₂-t₁)=Φ(t₂)Φ(-t₁)", "Φ(t₁-t₂)=Φ(t₁)Φ(-t₂)", "Φ(t)=Φ(-t)", "dΦ(t)/dt=Φ(t)A", "", ""], "r": "A", "e": "状态转移矩阵有性质：Φ(t₂ - t₁)=Φ(t₂)Φ(-t₁) ，A正确；B选项形式错误；一般Φ(t)≠Φ(-t) ，C错误；dΦ(t)/dt = AΦ(t) ，D错误。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141091", "t": 1, "q": "以下关于状态转移矩阵与系统矩阵A的关系，说法正确的是", "a": ["Φ(t)是微分方程dΦ/dt=AΦ(t)的解，且Φ(0)=I", "Φ(t)=e<sup>(At)=I+At+(At)<\/sup>2/2!+...（无穷级数）", "Φ(t)与A一定不满足交换律（Φ(t)A≠AΦ(t)）", "Φ(t)=A∫₀ᵗΦ(τ)dτ", "", ""], "r": "A", "e": "状态转移矩阵Φ(t)是微分方程dΦ/dt = AΦ(t)的解且Φ(0)=I；其可展开为Φ(t)=e^(At)=I + At+(At)²/2!+...；一般情况下Φ(t)与A满足交换律；而正确关系是Φ(t)=I + A∫₀ᵗΦ(τ)dτ 。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141092", "t": 1, "q": "以下哪种情况的线性定常系统一定是不能控的", "a": ["系统矩阵A为对角矩阵且所有特征值互异", "输入矩阵B为满列秩矩阵", "能控性矩阵C=[B AB]（n=2）的秩为2", "能控性矩阵C=[B AB A²B]（n=3）的秩为2", "", ""], "r": "D", "e": "线性定常系统能控的充要条件是能控性矩阵满秩。选项D中能控性矩阵（n = 3）秩为2不满秩，所以一定不能控。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141093", "t": 1, "q": "以下哪种情况会导致线性定常系统不能观?", "a": ["输出矩阵C为满行秩矩阵", "系统存在某个状态，其对输出无任何影响", "系统矩阵A的特征值均互异", "能观性矩阵O的秩等于系统阶数n", "", ""], "r": "B", "e": "系统不能观意味着存在状态对输出无影响。A选项输出矩阵C满行秩通常利于可观；C选项系统矩阵A特征值互异与能观性无必然直接联系；D选项能观性矩阵O秩等于系统阶数n是系统能观的充要条件。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141094", "t": 1, "q": "以下哪种系统无法用现代控制理论的状态空间方法进行分析", "a": ["无任何输入输出的孤立系统", "线性定常离散系统", "线性时变多输入多输出系统", "非线性定常单输入单输出系统", "", ""], "r": "A", "e": "现代控制理论的状态空间方法分析需要系统有输入输出关系。无任何输入输出的孤立系统，没有输入输出信息，无法用状态空间方法分析。而线性定常离散系统、线性时变多输入多输出系统、非线性定常单输入单输出系统都有输入输出可进行状态空间分析。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141095", "t": 1, "q": "状态变量的线性变换x=Pz（P为非奇异矩阵），以下关于变换后系统能控性的说法，正确的是", "a": ["变换后系统能控性与原系统不同", "变换后系统能控性与原系统相同（能控性是线性变换下的不变性）", "变换后能控性矩阵C'=PC（C为原能控性矩阵）", "变换后能控性矩阵C'=CP", "", ""], "r": "B", "e": "系统的能控性是线性变换下的不变性，即状态变量经线性变换后，系统能控性与原系统相同。能控性矩阵经变换后为「test/yiwen_img/importSubject/2034803669345636352.png」 。所以正确答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141096", "t": 1, "q": "状态变量的选择具有非唯一性，以下关于不同状态变量选择的说法，正确的是", "a": ["不同状态变量对应的状态转移矩阵Φ(t)不同，但描述的状态转移关系等价", "不同状态变量对应的能控性和能观性不同", "不同状态变量对应的系统矩阵A的特征值不同", "不同状态变量对应的状态空间表达式描述的系统外部特性（输入输出关系）不同", "", ""], "r": "A", "e": "状态变量选择非唯一时，不同状态变量间存在线性变换关系，能控性、能观性、系统矩阵特征值、系统外部特性不变，只是状态转移矩阵不同但状态转移关系等价。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141097", "t": 1, "q": "状态空间表达式的线性变换x=Pz（P为非奇异矩阵），变换后系统的系统矩阵A'为", "a": ["A P", "P⁻¹A P", "P A P⁻¹", "P A", "", ""], "r": "B", "e": "对于状态空间表达式经线性变换x = Pz，系统矩阵A变换后为「test/yiwen_img/importSubject/2034803669442105344.png」 。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141098", "t": 1, "q": "状态空间表达式中，输出矩阵C的维度是", "a": ["n×q（n为系统阶数，q为输出个数）", "q×n", "p×q（p为输入个数）", "q×p", "", ""], "r": "B", "e": "在状态空间表达式里，输出矩阵C用于将状态向量与输出向量关联，其维度是输出个数q行、系统阶数n列，即q×n 。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141099", "t": 1, "q": "状态空间表达式中，输出矩阵C的行数等于", "a": ["输入变量个数p", "状态变量个数n", "输出变量个数q", "系统阶数n", "", ""], "r": "C", "e": "在状态空间表达式里，输出矩阵C用于将状态变量映射到输出变量，其行数对应输出变量个数。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141100", "t": 1, "q": "状态空间表达式中，输入矩阵B的列数等于", "a": ["输出变量个数q", "输入变量个数p", "状态变量个数n", "系统阶数n", "", ""], "r": "B", "e": "输入矩阵B是联系输入变量与状态变量的矩阵，其列数等于输入变量个数p。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141101", "t": 1, "q": "状态空间表达式中，输入矩阵B的维度是", "a": ["n×q（q为输出个数）", "n×p（n为系统阶数，p为输入个数）", "p×n", "q×n", "", ""], "r": "B", "e": "在状态空间表达式里，输入矩阵B作用是将输入向量映射到状态变量，其维度是n×p，n为系统阶数，p为输入个数。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141102", "t": 1, "q": "状态空间表达式中，系统矩阵A的物理意义是", "a": ["描述状态对输出的影响", "描述状态之间的耦合关系及状态的自身变化特性", "描述输入对状态的影响", "描述输入对输出的直接影响", "", ""], "r": "B", "e": "系统矩阵A在状态空间表达式里，体现的是状态变量之间的相互关系以及状态自身的变化特性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141103", "t": 1, "q": "状态空间表达式中，直接传输矩阵D的物理意义是", "a": ["状态对输入的直接影响", "输入对输出的直接影响（不经过状态）", "输入对状态的直接影响", "状态对输出的直接影响", "", ""], "r": "B", "e": "在状态空间表达式里，直接传输矩阵D体现的是输入信号不经状态变量直接对输出产生的影响。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141104", "t": 1, "q": "状态转移矩阵Φ(t,t₀)表示的是", "a": ["从t₀时刻到t时刻的状态转移关系", "t₀时刻的状态与t时刻输出的关系", "t时刻的状态与t₀时刻输入的关系", "从t时刻到t₀时刻的状态转移关系", "", ""], "r": "A", "e": "状态转移矩阵Φ(t,t₀)是描述系统状态随时间变化的矩阵，它反映了系统从一个时刻的状态转移到另一个时刻状态的关系。A选项描述了从t₀时刻到t时刻的状态转移关系，这与状态转移矩阵的定义相符。B选项描述的是状态与输出的关系，而不是状态转移矩阵的功能。C选项描述的是时刻的状态与另一时刻输入的关系，这同样不是状态转移矩阵所描述的。D选项描述的方向与状态转移矩阵相反，状态转移矩阵是从t₀时刻到t时刻，而不是从t时刻到t₀时刻。综上所述，正确答案是A选项：“从t₀时刻到t时刻的状态转移关系”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803675012141105", "t": 1, "q": "状态转移矩阵Φ(t)需满足的基本条件不包括以下哪一项", "a": ["Φ(t)=A e^(At)", "Φ(t₁+t₂)=Φ(t₁)Φ(t₂)（t₁,t₂≥0）", "Φ(0)=I（单位矩阵）", "dΦ(t)/dt=AΦ(t)", "", ""], "r": "A", "e": "状态转移矩阵Φ(t)满足Φ(0)=I、Φ(t₁ + t₂)=Φ(t₁)Φ(t₂)、dΦ(t)/dt = AΦ(t)。而Φ(t)=e^(At)，不是A e^(At)。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317824", "t": 2, "q": "线性定常齐次状态方程x_dot=A x的平衡状态x_e（满足A x_e=0）的特性，正确的有", "a": ["若A为非奇异矩阵（det(A)≠0），则仅有x_e=0一个平衡状态", "平衡状态的稳定性与输入矩阵B无关", "平衡状态的个数由系统矩阵A的奇异性决定", "若A为奇异矩阵（det(A)=0），则存在无穷多个平衡状态（解空间为A的零空间）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317825", "t": 2, "q": "线性定常系统（A,C）能观性的判定方法包括", "a": ["状态反馈判据: 能设计状态反馈实现极点配置", "特征值判据: 对A的每个特征值λ，矩阵[λI-A;C]的秩等于n", "传递函数判据: 传递函数矩阵无零极点对消", "秩判据: 能观性矩阵O=[C;C A;...;C A^(n-1)]的秩等于n", "", ""], "r": "BD", "e": "本题可根据线性定常系统能观性的判定方法来逐一分析各选项。### 选项A状态反馈判据主要用于判断系统的能控性，能设计状态反馈实现极点配置是系统能控的充要条件，而非能观性的判定方法，所以A选项错误。### 选项B特征值判据：对于线性定常系统(A,C)，对A的每个特征值「test/yiwen_img/importSubject/2034803669530185728.png」，矩阵「test/yiwen_img/importSubject/2034803669601488896.png」的秩等于n（n为系统的阶数），这是系统能观性的判定方法之一，所以B选项正确。 ### 选项C传递函数判据：传递函数矩阵无零极点对消是系统能控且能观的判据，而不是单纯能观性的判定方法，所以C选项错误。### 选项D秩判据：能观性矩阵「test/yiwen_img/importSubject/2034803669702152192.png」的秩等于n，这是线性定常系统能观性的基本判定方法，所以D选项正确。综上，答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317826", "t": 2, "q": "线性定常系统传递函数存在零极点对消的影响，正确的有", "a": ["若对消的是不稳定极点（实部>0），则系统虽传递函数稳定，但实际存在不稳定的不能控或不能观状态，系统整体不稳定", "传递函数仅能描述系统能控且能观部分的动态特性，丢失了不能控或不能观部分的信息", "对消后的传递函数阶数降低，无法完全反映原系统的动态行为（如阶跃响应可能存在稳态误差差异）", "零极点对消会导致系统的能控性或能观性丧失（至少一项丧失）", "", ""], "r": "ABCD", "e": "线性定常系统传递函数零极点对消会有诸多影响。若对消不稳定极点，系统有潜在不稳定因素；传递函数只能描述能控且能观部分，会丢失其他信息；对消后阶数降低不能完全反映原系统行为；且会导致能控性或能观性至少一项丧失。四个选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317827", "t": 2, "q": "线性定常系统的传递函数与状态空间表达式之间的转换，正确的方法有", "a": ["若传递函数存在零极点对消，则其最小实现（阶数最低）是能控且能观的", "由传递函数求状态空间表达式（实现问题）: 可通过直接分解法、能控标准形实现、能观标准形实现等", "由状态空间表达式求传递函数: G（　）=C(sI-A)⁻¹B+D（零初始条件下拉普拉斯变换）", "传递函数的实现不唯一（对应不同的状态空间表达式）", "", ""], "r": "BCD", "e": "A选项，若传递函数存在零极点对消，最小实现可能不能控或不能观；B是常见由传递函数求状态空间表达式的方法；C是由状态空间表达式求传递函数的公式；D传递函数实现确实不唯一。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317828", "t": 2,
