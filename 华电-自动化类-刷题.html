克服干扰。但放大系数过大，系统会不稳定，所以不是越大越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142083", "t": 3, "q": "串级控制系统中，副回路的抗干扰能力与副回路的响应速度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "副回路响应速度越快，能越快克服干扰，抗干扰能力越强，二者有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142084", "t": 3, "q": "串级控制系统中，副回路的时间常数与主回路时间常数之比宜为1:3-1:10。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在串级控制系统设计中，为使副回路快速克服干扰且主副回路工作协调，副回路的时间常数与主回路时间常数之比通常在1:3 - 1:10 。", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142085", "t": 3, "q": "串级控制系统中，副回路能快速克服进入主回路的扰动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级控制系统的副回路可快速克服进入副回路的扰动，而不是主回路的扰动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142086", "t": 3, "q": "串级控制系统中，若副调节器采用反作用，副执行器为气关式，则副被控变量增大时，副执行器开度增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "副调节器反作用，副执行器气关式，副被控变量增大时，副调节器输出减小，气关式执行器开度减小而非增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142087", "t": 3, "q": "串级控制系统中，主被控变量的控制精度主要由副回路保证。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级控制系统中主被控变量的控制精度主要由主控制器保证，副回路起辅助控制、快速克服进入副回路扰动的作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142088", "t": 3, "q": "串级控制系统中，主调节器的输出作为副调节器的测量值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级控制系统中，主调节器的输出是副调节器的给定值，而非测量值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142089", "t": 3, "q": "串级控制系统中，主回路的扰动对副被控变量无影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "主回路扰动虽主要影响主被控变量，但也会经主控制器作用于副回路进而影响副被控变量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142090", "t": 3, "q": "单回路控制系统中，被控对象的时间常数越大，系统的响应速度越慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "时间常数反映被控对象受到阶跃输入作用后，被控变量达到新稳态值的快慢。时间常数越大，被控变量变化越慢，系统响应速度也就越慢。", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142091", "t": 3, "q": "单回路控制系统中，被控对象的滞后时间越大，系统稳定性越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在单回路控制系统中，被控对象滞后时间越大，会使控制作用不及时，系统超调量增大、振荡加剧，系统稳定性变差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142092", "t": 3, "q": "单回路控制系统中，被控对象为正作用时，操纵变量增大，被控变量减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "正作用被控对象，操纵变量增大，被控变量应增大，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142093", "t": 3, "q": "单回路控制系统中，测量值等于设定值时，控制器的输出为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在单回路控制系统中，测量值等于设定值时系统处于稳态，但控制器输出不一定为零，它要维持执行器合适的开度以保持这种平衡。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142094", "t": 3, "q": "单回路控制系统中，控制器为正作用时，测量值大于设定值，输出减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单回路控制系统里，正作用控制器特性是测量值大于设定值时输出增大，而不是减小。", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142095", "t": 3, "q": "单回路控制系统中，若控制器为反作用，执行器为气开式，则被控对象应为正作用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "单回路控制系统要使系统稳定，控制器、执行器、被控对象三者作用方向乘积应为正。已知控制器反作用（负），执行器气开式（正），所以被控对象应为正作用才能使乘积为正。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142096", "t": 3, "q": "单回路控制系统中，执行器的气开/气关类型由控制器的作用方向决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "执行器气开/气关类型由工艺安全等要求决定，而非控制器作用方向。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142097", "t": 3, "q": "单回路控制系统中，执行器为气关式时，故障时阀门全开。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "气关式执行器在失去气源等故障情况下，阀门会全开，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142098", "t": 3, "q": "单回路控制系统中，执行器为气开式时，控制器输出增大，阀门开度增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "气开式执行器的特性就是控制器输出增大时，阀门开度增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142099", "t": 3, "q": "给水控制系统中，给水管道泄漏会导致给水流量测量值增大，实际进入汽包的水量减少。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142100", "t": 3, "q": "给水控制系统中，汽包水位的允许波动范围通常为±50mm。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在给水控制系统里，汽包水位允许波动范围一般是±50mm 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142101", "t": 3, "q": "给水控制系统中，汽包水位过高会导致蒸汽带水，影响汽轮机安全运行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "汽包水位过高时，汽水分离空间减小，蒸汽容易携带水分，而带水蒸汽进入汽轮机，会冲击叶片等部件，影响汽轮机安全运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142102", "t": 3, "q": "给水控制系统中，汽包水位控制器输出增大，对气关式给水阀门的影响是开度减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "气关式阀门特点是信号增大阀门开度减小。汽包水位控制器输出增大是信号增大情况，所以气关式给水阀门开度减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142103", "t": 3, "q": "给水控制系统中，汽包压力突然升高会导致虚假水位下降。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142104", "t": 3, "q": "给水控制系统中，三冲量包括汽包水位、给水流量和蒸汽流量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在给水控制系统里，三冲量的确是指汽包水位、给水流量和蒸汽流量，这是常见的控制参数组合。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142105", "t": 3, "q": "给水控制系统中，三冲量控制比单冲量控制更能有效抑制虚假水位的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "单冲量控制仅依据水位控制，难以应对虚假水位。三冲量控制综合了水位、蒸汽流量和给水流量三个信号，能更好地识别虚假水位并调节，抑制效果更佳。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142106", "t": 3, "q": "给水控制系统中，三冲量控制的静态精度低于单冲量控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "三冲量控制综合了水位、蒸汽流量和给水流量三个信号，能更好地克服干扰，控制精度比仅依据水位信号的单冲量控制高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142107", "t": 3, "q": "给水控制系统中，三冲量控制的控制器输出仅由汽包水位偏差决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "三冲量控制综合考虑汽包水位、蒸汽流量和给水流量三个信号，并非仅由汽包水位偏差决定控制器输出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142108", "t": 3, "q": "给水控制系统中，蒸汽流量突然增大时，汽包水位先上升后下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当蒸汽流量突然增大，因汽水混合物比容增大，水位短时间“虚假上升”，随后因蒸汽量增加，水蒸发快，水位下降。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142109", "t": 3, "q": "过程控制系统中，传递函数的分母多项式称为特征多项式。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在过程控制系统里，传递函数的分母多项式就是特征多项式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142110", "t": 3, "q": "过程控制系统中，传递函数仅与系统的输入信号类型有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "传递函数反映系统固有特性，仅取决于系统的结构和参数，与输入信号类型无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142111", "t": 3, "q": "过程控制系统中，二阶系统的固有频率ωn越大，响应速度越慢。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二阶系统中，固有频率ωn越大，系统响应速度越快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142112", "t": 3, "q": "过程控制系统中，二阶系统的阻尼比ζ=1时，系统处于欠阻尼状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二阶系统阻尼比ζ=1时是临界阻尼状态，ζ＜1才是欠阻尼状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142113", "t": 3, "q": "过程控制系统中，二阶系统的阻尼比ζ越小，超调量越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在二阶系统中，超调量和阻尼比ζ相关，阻尼比ζ越小，超调量就越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142114", "t": 3, "q": "过程控制系统中，阶跃响应的超调量为零的系统一定是稳定系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142115", "t": 3, "q": "过程控制系统中，阶跃响应的上升时间是指输出从0上升到稳态值的时间。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "上升时间是指输出从稳态值的10%上升到90%所需的时间，并非从0上升到稳态值的时间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142116", "t": 3, "q": "过程控制系统中，频率特性的幅频特性反映输出与输入的相位差随频率的变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "过程控制系统中，幅频特性反映的是输出与输入的幅值比随频率的变化，而相频特性才反映输出与输入的相位差随频率的变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142117", "t": 3, "q": "过程控制系统中，频率特性分析适合分析有纯滞后的高阶系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142118", "t": 3, "q": "过程控制系统中，系统的调节时间是指输出进入稳态值±10%范围内的时间。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "过程控制系统中，系统的调节时间是指输出进入稳态值±5%（或±2%）范围内的时间，并非±10%。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142119", "t": 3, "q": "过程控制系统中，系统的调节时间越长，响应速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "调节时间长意味着系统从受到干扰到恢复稳定所需时间久，响应速度是慢的，并非越快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142120", "t": 3, "q": "过程控制系统中，系统的开环增益越大，稳定性越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在过程控制系统里，开环增益过大易使系统变得不稳定，并非开环增益越大稳定性越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142121", "t": 3, "q": "过程控制系统中，系统的衰减比为1:1时，系统处于临界稳定状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "衰减比是衡量系统稳定性的指标，衰减比为1:1意味着系统输出做等幅振荡，此时系统处于临界稳定状态。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142122", "t": 3, "q": "过程控制系统中，系统的衰减比越大，稳定性越差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在过程控制系统里，衰减比越大，意味着系统过渡过程越接近等幅振荡的程度越低，系统越稳定。所以题目说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142123", "t": 3, "q": "过程控制系统中，系统的稳态误差为零的系统一定是无静差系统。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据定义，稳态误差为零的系统就是无静差系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142124", "t": 3, "q": "过程控制系统中，系统的稳态误差越小，静态精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稳态误差体现了系统控制精度，稳态误差越小，意味着系统控制结果与期望结果越接近，即静态精度越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142125", "t": 3, "q": "过程控制系统中，系统稳定的必要条件是特征方程所有根的实部均小于零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在过程控制系统里，系统稳定的充要条件就是特征方程所有根的实部都小于零，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142126", "t": 3, "q": "过程控制系统中，一阶对象的阶跃响应曲线存在超调量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一阶对象的阶跃响应曲线是单调变化的，不会出现超调，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142127", "t": 3, "q": "过程控制系统中，一阶系统的放大系数K越大，输出对输入的静态响应越灵敏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在一阶系统里，放大系数K体现了系统的稳态特性，K越大，输出对输入的静态响应就越灵敏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803735540142128", "t": 3, "q": "过程控制系统中，一阶系统阶跃响应的稳态值等于放大系数与阶跃输入幅值的乘积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于一阶系统，其阶跃响应的稳态值确实等于放大系数与阶跃输入幅值的乘积。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 过程控制系统（2）", "n": "基础练习题【含解析】 / 第5章 过程控制系统（2）", "qs": [{"id": "2034803740220985344", "t": 1, "q": "燃烧控制系统中，炉膛压力控制的操纵变量通常是（　）", "a": ["引风量", "送风量", "蒸汽量", "燃料量", "", ""], "r": "A", "e": "炉膛压力主要通过调节引风量来控制，引风量大小直接影响炉膛内的压力平衡。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985345", "t": 1, "q": "燃烧控制系统中，炉膛压力控制的设定值通常为（　）", "a": ["微负压", "正压", "零压", "负压绝对值较大的值", "", ""], "r": "A", "e": "炉膛压力控制设定为微负压可防止高温烟气外冒影响安全和环境，同时避免外界冷空气大量进入降低热效率。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985346", "t": 1, "q": "燃烧控制系统中，若炉膛压力低于设定值，引风控制器应（　）", "a": ["减小输出，开大引风阀门", "减小输出，关小引风阀门", "增大输出，开大引风阀门", "增大输出，关小引风阀门", "", ""], "r": "C", "e": "炉膛压力低于设定值，需加大引风使压力恢复，应增大引风控制器输出，开大引风阀门。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985347", "t": 1, "q": "燃烧控制系统中，若燃料量不变，送风量突然增大，会导致（　）", "a": ["炉膛压力升高", "蒸汽温度降低", "炉膛温度升高，热效率提高", "炉膛温度降低，热效率降低", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985348", "t": 1, "q": "燃烧控制系统中，若送风量不足，会导致烟气中的（　）含量升高。", "a": ["氮气", "二氧化碳", "氧气", "一氧化碳", "", ""], "r": "D", "e": "送风量不足时燃料不能充分燃烧，会产生一氧化碳，所以烟气中一氧化碳含量升高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985349", "t": 1, "q": "燃烧控制系统中，若引风量突然减小，炉膛压力会（　）", "a": ["升高", "降低", "不变", "先降低后升高", "", ""], "r": "A", "e": "引风量突然减小，意味着排出炉膛的烟气量减少，而炉内产生的烟气继续增加，会使炉膛内压力升高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985350", "t": 1, "q": "燃烧控制系统中，送风量调节的依据是（　）", "a": ["汽包水位", "蒸汽温度", "炉膛压力", "燃料量和空燃比设定值", "", ""], "r": "D", "e": "送风量需根据燃料量及合适的空燃比设定值来调节，以保证燃料充分燃烧。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985351", "t": 1, "q": "燃烧控制系统中，为保证燃料充分燃烧，通常需维持的关键参数关系是（　）", "a": ["燃料量与炉膛压力成正比", "引风量与送风量成固定比例", "燃料量与蒸汽流量成正比", "送风量与燃料量成固定比例", "", ""], "r": "D", "e": "要保证燃料充分燃烧，需使空气量（送风量）与燃料量匹配，即送风量与燃料量成固定比例。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985352", "t": 1, "q": "在给水控制系统中，以汽包水位为被控变量，给水流量为操纵变量的控制方案，属于（　）", "a": ["前馈控制", "复合控制", "单回路反馈控制", "串级控制", "", ""], "r": "C", "e": "本题以汽包水位为被控变量，给水流量为操纵变量，只有一个被控变量和一个操纵变量组成一个闭环回路，符合单回路反馈控制的特征。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985353", "t": 1, "q": "在过程控制系统动态特性分析中，某一阶对象的传递函数为G（　）=K/(Ts+1)，其中T代表的是（　）", "a": ["放大系数", "滞后时间", "时间常数", "衰减系数", "", ""], "r": "C", "e": "在一阶对象传递函数G(s)=K/(Ts + 1)中，K是放大系数，T是时间常数。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985354", "t": 1, "q": "在蒸汽温度控制系统中，当采用喷水减温控制时，若蒸汽温度偏高，以下调节动作正确的是（　）", "a": ["增加蒸汽流量", "增加减温水流量", "减少蒸汽流量", "减少减温水流量", "", ""], "r": "B", "e": "蒸汽温度偏高，要降温就需增加减温水流量来带走热量。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985355", "t": 1, "q": "蒸汽温度控制系统中，采用烟气挡板调节时，若想提高蒸汽温度，应采取的动作是（　）", "a": ["开大过热器侧烟气挡板，关小省煤器侧烟气挡板", "同时关小过热器和省煤器侧烟气挡板", "关小过热器侧烟气挡板，开大省煤器侧烟气挡板", "同时开大过热器和省煤器侧烟气挡板", "", ""], "r": "A", "e": "要提高蒸汽温度，需让更多烟气通过过热器。开大过热器侧烟气挡板、关小省煤器侧烟气挡板可使更多烟气流向过热器，提高蒸汽温度。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985356", "t": 1, "q": "蒸汽温度控制系统中，过热器的散热损失会导致蒸汽温度（　）", "a": ["升高", "先升高后降低", "保持不变", "降低", "", ""], "r": "D", "e": "过热器散热损失会使蒸汽热量减少，温度降低。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985357", "t": 1, "q": "蒸汽温度控制系统中，若过热器结垢，会导致蒸汽温度（　）", "a": ["不变", "升高", "降低", "波动增大", "", ""], "r": "B", "e": "过热器结垢会使热阻增大，传热效率降低，燃料燃烧产生的热量不能有效传递给蒸汽，为达到设定蒸汽温度，会增加燃料量，从而使蒸汽温度升高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985358", "t": 1, "q": "蒸汽温度控制系统中，若过热器入口蒸汽温度升高，会导致过热器出口蒸汽温度（　）", "a": ["降低", "不变", "先降低后升高", "升高", "", ""], "r": "D", "e": "入口蒸汽温度升高，在过热器中进一步加热后，出口蒸汽吸收更多热量，温度会随之升高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985359", "t": 1, "q": "蒸汽温度控制系统中，若减温水阀门故障关死，蒸汽温度会（　）", "a": ["保持不变", "急剧降低", "先降低后升高", "急剧升高", "", ""], "r": "D", "e": "减温水阀门关死，无法注入减温水，不能对蒸汽降温，蒸汽温度会急剧升高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985360", "t": 1, "q": "蒸汽温度控制系统中，若烟气温度突然升高，蒸汽温度会（　）", "a": ["先降低后升高", "降低", "保持不变", "升高", "", ""], "r": "D", "e": "烟气温度升高，其传递给蒸汽的热量增多，蒸汽温度会升高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985361", "t": 1, "q": "蒸汽温度控制系统中，若蒸汽流量突然增大，蒸汽温度会（　）", "a": ["先升高后降低", "升高", "降低", "不变", "", ""], "r": "C", "e": "蒸汽流量突然增大，意味着更多低温蒸汽进入系统，会使蒸汽温度降低。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985362", "t": 1, "q": "蒸汽温度控制系统中，为克服蒸汽流量变化对温度的影响，通常需引入（　）", "a": ["汽包水位反馈信号", "蒸汽流量前馈信号", "炉膛压力前馈信号", "给水流量反馈信号", "", ""], "r": "B", "e": "前馈控制可针对干扰提前采取措施，蒸汽流量是影响蒸汽温度的干扰因素，引入蒸汽流量前馈信号能克服其对温度的影响。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985363", "t": 1, "q": "蒸汽温度控制系统中，再热蒸汽温度控制通常采用（　）", "a": ["喷水减温控制", "烟气挡板调节或烟气再循环调节", "改变给水流量控制", "改变蒸汽流量控制", "", ""], "r": "B", "e": "再热蒸汽温度控制一般不用喷水减温控制，因会降低机组热经济性。改变给水流量主要用于控制主蒸汽温度，改变蒸汽流量对再热蒸汽温度控制效果不佳。而烟气挡板调节或烟气再循环调节是再热蒸汽温度控制常用方法。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985364", "t": 1, "q": "DEH系统中，电液伺服阀的输入信号来自（　）", "a": ["汽轮机转速传感器", "电液转换器", "阀门位置传感器", "数字控制器", "", ""], "r": "D", "e": "DEH系统中数字控制器根据控制策略输出信号，该信号作为电液伺服阀的输入信号。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985365", "t": 1, "q": "DEH系统中，电液转换器的核心功能是（　）", "a": ["将液压信号转换为数字控制信号", "将数字控制信号转换为液压执行信号", "测量汽轮机转速并反馈给控制器", "直接驱动汽轮机阀门动作", "", ""], "r": "B", "e": "DEH系统中电液转换器主要是把控制系统输出的数字控制信号转换为液压执行信号，推动油动机等执行机构动作。A选项顺序反了；C是转速测量装置功能；D电液转换器不直接驱动阀门，而是转换信号。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985366", "t": 1, "q": "DEH系统中，阀门管理功能的主要作用是（　）", "a": ["控制汽轮机转速", "控制汽轮机负荷", "优化阀门开关顺序和开度，减少节流损失", "监测阀门故障并报警", "", ""], "r": "C", "e": "阀门管理功能主要是对阀门开关顺序和开度进行优化，以此减少蒸汽通过阀门时的节流损失，提高机组效率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985367", "t": 1, "q": "DEH系统中，阀门位置反馈信号的作用是（　）", "a": ["与控制器输出信号比较，实现阀门位置闭环控制", "与设定转速比较，产生偏差", "直接控制阀门开度", "与设定负荷比较，产生偏差", "", ""], "r": "A", "e": "阀门位置反馈信号是用于和控制器输出信号对比，以此实现阀门位置闭环控制。B选项中与设定转速比较产生偏差和阀门位置反馈信号作用无关；C选项阀门位置反馈信号不直接控制阀门开度；D选项与设定负荷比较产生偏差也不是其作用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985368", "t": 1, "q": "DEH系统中，负荷控制模式下，控制器的输入信号主要是（　）", "a": ["汽轮机转速信号", "电网负荷指令信号", "蒸汽压力信号", "阀门位置反馈信号", "", ""], "r": "B", "e": "在DEH系统的负荷控制模式下，目的是根据电网需求调整汽轮机功率，所以控制器主要依据电网负荷指令信号来动作。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985369", "t": 1, "q": "DEH系统中，手动控制模式下，汽轮机阀门的开度由（　）直接控制。", "a": ["转速反馈信号", "操作员手动输入信号", "数字控制器", "负荷反馈信号", "", ""], "r": "B", "e": "手动控制模式就是让操作员直接干预，所以汽轮机阀门开度由操作员手动输入信号控制。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985370", "t": 1, "q": "DEH系统中，液压油系统的作用是（　）", "a": ["提供液压动力，驱动阀门执行机构", "控制蒸汽压力", "为控制系统提供冷却", "测量汽轮机转速", "", ""], "r": "A", "e": "DEH 系统中液压油系统主要是提供液压动力，以此驱动阀门执行机构。控制蒸汽压力靠的是调节系统相关控制逻辑；为控制系统提供冷却不是液压油系统主要作用；测量汽轮机转速有专门的转速测量装置。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985371", "t": 1, "q": "DEH系统中，转速测量通常采用（　）", "a": ["压力传感器", "磁阻式转速传感器", "温度传感器", "液位传感器", "", ""], "r": "B", "e": "DEH系统测转速需用转速传感器，磁阻式转速传感器可测转速，而压力、温度、液位传感器分别测压力、温度、液位，不能测转速。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985372", "t": 1, "q": "DEH系统中，转速反馈信号的作用是（　）", "a": ["测量阀门位置", "直接驱动阀门动作", "测量蒸汽压力", "与设定转速比较，产生转速偏差信号", "", ""], "r": "D", "e": "DEH系统中转速反馈信号主要是和设定转速对比得出转速偏差信号，以实现对转速的控制。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985373", "t": 1, "q": "DEH系统中，转速控制的核心目标是使汽轮机转速稳定在（　）", "a": ["任意设定转速", "额定转速", "额定转速的105%", "额定转速的95%", "", ""], "r": "B", "e": "DEH系统转速控制主要是让汽轮机稳定在额定转速运行，以保障发电等工作正常进行。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985374", "t": 1, "q": "PID调节器参数整定时，经验法的核心是根据（　）初步设定参数，再逐步调整。", "a": ["系统阶跃响应曲线", "被控对象的类型和工艺经验", "系统等幅振荡周期", "系统临界比例度", "", ""], "r": "B", "e": "经验法是依据被控对象的类型和工艺经验来初步设定PID调节器参数，再逐步调整。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985375", "t": 1, "q": "PID调节器参数整定时，临界比例度法的关键是找到系统发生（　）时的比例度和振荡周期。", "a": ["衰减比为10:1的振荡", "无振荡的临界状态", "衰减比为4:1的振荡", "等幅振荡", "", ""], "r": "D", "e": "临界比例度法关键是找出系统发生等幅振荡时的比例度和振荡周期。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985376", "t": 1, "q": "PID调节器参数整定时，若系统超调量过大，应采取的调整措施是（　）", "a": ["增大比例度，减小微分时间", "减小比例度，减小积分时间", "减小比例度，增大微分时间", "增大比例度，增大积分时间", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985377", "t": 1, "q": "PID调节器参数整定时，若系统存在较大噪声干扰，应采取的调整措施是（　）", "a": ["增大比例度", "减小微分时间", "减小积分时间", "增大微分时间", "", ""], "r": "B", "e": "系统存在较大噪声干扰时，微分作用会放大噪声影响，所以应减小微分时间。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740220985378", "t": 1, "q": "PID调节器参数整定时，若系统调节时间过长，应采取的调整措施是（　）", "a": ["减小比例度，减小积分时间", "增大比例度，增大积分时间", "减小比例度，增大微分时间", "增大比例度，减小微分时间", "", ""], "r": "A", "e": "调节时间过长说明系统响应慢、控制作用弱。减小比例度可增强比例作用，加快响应；减小积分时间可加快积分作用消除余差的速度。所以应减小比例度、减小积分时间。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179648", "t": 1, "q": "PID调节器参数整定时，若系统静差过大，应采取的调整措施是（　）", "a": ["减小比例度", "增大比例度", "减小积分时间", "增大微分时间", "", ""], "r": "C", "e": "系统静差过大，可通过增强积分作用来消除。减小积分时间能增强积分作用。减小比例度是增强比例作用，主要影响响应速度和稳定性；增大比例度会减弱比例作用；增大微分时间主要是改善系统动态特性，抑制振荡。所以应选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179649", "t": 1, "q": "PID调节器参数整定时，若系统静差合格但超调量过大，应（　）", "a": ["减小积分时间，保持比例度不变", "增大积分时间，保持比例度不变", "减小比例度，保持积分时间不变", "增大比例度，保持积分时间不变", "", ""], "r": "D", "e": "超调量大需减小系统增益，比例度增大能减小系统增益，且题干说静差合格，积分时间可不调整。所以应增大比例度，保持积分时间不变，答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179650", "t": 1, "q": "PID调节器参数整定时，若系统振荡剧烈，应采取的调整措施是（　）", "a": ["增大积分时间", "减小微分时间", "减小比例度", "增大比例度", "", ""], "r": "D", "e": "系统振荡剧烈说明系统响应过于灵敏，需降低系统的灵敏度。增大比例度可减小比例作用，降低系统灵敏度，缓解振荡。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179651", "t": 1, "q": "PID调节器参数整定时，响应曲线法的第一步是获取被控对象的（　）", "a": ["振荡响应曲线", "脉冲响应曲线", "阶跃响应曲线", "频率响应曲线", "", ""], "r": "C", "e": "响应曲线法整定PID调节器参数，第一步是获取被控对象的阶跃响应曲线。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179652", "t": 1, "q": "PID调节器中，比例微分（PD）调节的特点是（　）", "a": ["不能消除静差，响应速度慢", "能消除静差，响应速度慢", "不能消除静差，响应速度快", "能消除静差，响应速度快", "", ""], "r": "C", "e": "PD调节引入微分作用可加快系统响应速度，但比例调节不能消除静差。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179653", "t": 1, "q": "PID调节器中，比例作用的输出与偏差的（　）成正比。", "a": ["积分", "平方", "瞬时值", "微分", "", ""], "r": "C", "e": "PID调节器中比例作用输出和偏差瞬时值相关，比例系数乘以偏差瞬时值就是比例作用输出。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179654", "t": 1, "q": "PID调节器中，积分饱和的产生原因是（　）", "a": ["比例度过小，比例作用过强", "微分时间过长，微分作用过强", "积分时间过长，积分作用过弱", "系统存在持续偏差，积分作用持续累积导致输出超出量程", "", ""], "r": "D", "e": "积分饱和是因为系统存在持续偏差，积分项会不断累积，最终使输出超出量程。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179655", "t": 1, "q": "PID调节器中，积分作用的输出与（　）成正比。", "a": ["偏差对时间的积分", "偏差的变化率", "偏差的平方", "偏差的瞬时值", "", ""], "r": "A", "e": "积分作用输出与偏差对时间的积分成正比。这是积分控制的基本原理。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179656", "t": 1, "q": "PID调节器中，积分作用的主要功能有（　）", "a": ["消除系统静差", "加快系统响应速度", "增强系统稳定性", "减小系统超调量", "", ""], "r": "A", "e": "积分作用能对偏差进行积分累积，可消除系统静差。而加快系统响应速度主要靠比例作用；增强系统稳定性、减小系统超调量主要靠微分作用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179657", "t": 1, "q": "PID调节器中，能有效消除系统静差的调节作用是（　）", "a": ["比例作用", "微分作用", "比例微分作用", "积分作用", "", ""], "r": "D", "e": "积分作用能对误差进行积分累积，只要有误差存在，积分就会不断积累并输出控制量，直到误差消除，所以能有效消除系统静差。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179658", "t": 1, "q": "PID调节器中，若积分时间Ti减小，积分作用会（　）", "a": ["增强，消除静差速度加快，但稳定性降低", "减弱，消除静差速度减慢，但稳定性提高", "增强，消除静差速度加快，但易振荡", "减弱，消除静差速度加快，但易振荡", "", ""], "r": "C", "e": "积分时间Ti减小，积分作用增强，能更快消除静差，但会使系统稳定性降低，易出现振荡。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179659", "t": 1, "q": "PID调节器中，若积分时间Ti趋近于无穷大，积分作用会（　）", "a": ["随机变化", "保持不变", "增强至最大", "减弱至零", "", ""], "r": "D", "e": "积分时间Ti越大，积分作用越弱。当Ti趋近于无穷大时，积分作用减弱至零。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179660", "t": 1, "q": "PID调节器中，若微分时间Td增大，微分作用会（　）", "a": ["减弱，对偏差变化的反应更灵敏，易放大噪声", "增强，对偏差变化的反应更灵敏，易放大噪声", "减弱，对偏差变化的反应更迟钝，不易放大噪声", "增强，对偏差变化的反应更迟钝，不易放大噪声", "", ""], "r": "B", "e": "在PID调节器中，Td是微分时间，Td增大时，微分作用增强，能更灵敏地对偏差变化做出反应，但也容易放大噪声。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179661", "t": 1, "q": "PID调节器中，若想减弱微分作用，应（　）", "a": ["增大积分时间Ti", "减小积分时间Ti", "减小微分时间Td", "增大微分时间Td", "", ""], "r": "C", "e": "在PID调节器中，微分时间Td决定微分作用强弱，Td越小，微分作用越弱。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179662", "t": 1, "q": "PID调节器中，若想增强比例作用，应（　）", "a": ["减小积分时间", "减小比例度", "增大比例度", "增大积分时间", "", ""], "r": "B", "e": "比例度越小，比例作用越强。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803740225179663", "t": 1, "q": "PID调节器中，微分作用的调节规律是（　）", "a": ["输出与偏差成正比", "输出与偏差及其积分成正比", "输出与偏差的积分成正比", "输出与偏差的变化率成正比", "", ""], "r": "D", "e": "PID调节器中，微分作用主要是针对偏差的变化率进行调节。A选项是比例作用规律；B选项不是单纯微分作用规律；C选项是积分作用规律。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542464", "t": 2, "q": "燃烧控制系统中，炉膛压力控制的难点包括（　）", "a": ["炉膛压力测量的波动", "与蒸汽温度控制的协调", "燃料量变化的间接影响", "送风量与引风量的耦合干扰", "", ""], "r": "ACD", "e": "燃烧控制系统中，炉膛压力控制是一个复杂的过程，涉及多个因素的相互作用。我们需要从以下几个方面进行简要分析：1. 炉膛压力测量的波动：炉膛压力的测量本身可能会受到各种因素的影响，导致测量值波动。这种波动会影响控制系统的稳定性和准确性。2. 与蒸汽温度控制的协调：虽然蒸汽温度控制和炉膛压力控制都是燃烧系统的重要部分，但题目问的是炉膛压力控制的难点，并没有特别强调与蒸汽温度控制的协调问题。3. 燃料量变化的间接影响：燃料量的变化会直接影响燃烧过程，从而间接影响炉膛压力。控制系统需要能够快速响应燃料量的变化，以维持炉膛压力的稳定。4. 送风量与引风量的耦合干扰：送风量和引风量的调整是控制炉膛压力的重要手段，但这两者之间的耦合关系会使控制变得更加复杂。任何一方的调整都可能对另一方产生影响，增加了控制的难度。综合以上分析，炉膛压力控制的难点主要包括：炉膛压力测量的波动、燃料量变化的间接影响以及送风量与引风量的耦合干扰。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542465", "t": 2, "q": "燃烧控制系统中，炉膛压力控制的主要扰动包括（　）", "a": ["引风量变化", "蒸汽流量变化", "送风量变化", "燃料量变化", "", ""], "r": "ACD", "e": "引风量直接影响炉膛内气体排出，引风量变化会使炉膛压力改变；送风量变化会改变炉膛内空气量，进而影响压力；燃料量变化会改变燃烧强度和产生的烟气量，影响炉膛压力。蒸汽流量变化主要影响蒸汽侧参数，对炉膛压力不是主要扰动。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542466", "t": 2, "q": "燃烧控制系统中，燃料量控制的难点包括（　）", "a": ["与送风量的协调配合", "燃料输送管道的滞后", "燃料量测量精度低（如煤粉）", "燃料热值波动大", "", ""], "r": "ABCD", "e": "燃料量控制要考虑与送风量协调避免燃烧问题；燃料输送管道有滞后影响控制及时性；煤粉等燃料量测量难精度低；燃料热值波动大也增加控制难度。ABCD选项都属于燃料量控制难点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542467", "t": 2, "q": "燃烧控制系统中，燃料量控制的主要扰动包括（　）", "a": ["送风量变化", "燃料压力变化", "蒸汽负荷变化", "燃料热值变化", "", ""], "r": "BCD", "e": "燃料压力变化会直接影响进入系统的燃料量，燃料热值变化会改变相同燃料量下释放的热量，蒸汽负荷变化会促使调整燃料量来维持工况，而送风量主要影响燃烧的充分程度，并非燃料量控制主要扰动。答案为BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542468", "t": 2, "q": "燃烧控制系统中，燃料量突然减少的影响包括（　）", "a": ["炉膛温度降低", "蒸汽产量减少", "炉膛压力降低", "烟气中氧气含量升高", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542469", "t": 2, "q": "燃烧控制系统中，送风量调节的主要依据有（　）", "a": ["工艺设定的空燃比数值", "蒸汽温度的偏差信号", "燃料量的实际变化信号", "炉膛压力的反馈信号", "", ""], "r": "AC", "e": "送风量调节要保证合适的空气和燃料比例，主要依据工艺设定空燃比数值和燃料量实际变化信号。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542470", "t": 2, "q": "燃烧控制系统中，引风量过大的影响包括（　）", "a": ["锅炉热效率下降", "炉膛温度降低", "烟气带走热量增加", "炉膛压力过低", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542471", "t": 2, "q": "燃烧控制系统中，引风量控制的主要目的包括（　）", "a": ["防止空气过多进入炉膛", "防止烟气外漏", "控制蒸汽温度", "维持炉膛微负压", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542472", "t": 2, "q": "在串级蒸汽温度控制系统中，属于主回路扰动的有（　）", "a": ["减温水管道压力波动", "燃料热值发生变化", "炉膛烟气温度整体升高", "蒸汽负荷突然增大", "", ""], "r": "BCD", "e": "主回路扰动是对主被控变量产生影响的扰动。A项减温水管道压力波动主要影响副回路控制的减温水量。B、C、D项中燃料热值变化、炉膛烟气温度升高、蒸汽负荷突然增大都直接影响主被控变量蒸汽温度，属于主回路扰动。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542473", "t": 2, "q": "蒸汽温度控制系统中，采用喷水减温调节时，需重点关注的问题有（　）", "a": ["减温水的流量调节范围", "减温水的压力稳定性", "蒸汽的压力变化", "减温水与蒸汽的混合效果", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542474", "t": 2, "q": "蒸汽温度控制系统中，常用的调节手段有（　）", "a": ["烟气再循环调节", "喷水减温调节", "烟气挡板调节", "改变给水流量调节", "", ""], "r": "ABC", "e": "这是一道关于蒸汽温度控制系统调节手段的选择题。在蒸汽温度控制系统中，主要关注如何精确地调节温度以满足工艺需求。现在我们来分析各个选项：A. 烟气再循环调节 - 这是一种通过调整烟气流动来影响蒸汽温度的方法，属于常用的调节手段之一。B. 喷水减温调节 - 通过直接向蒸汽中喷水来降低其温度，也是蒸汽温度控制中常用且有效的手段。C. 烟气挡板调节 - 通过调整烟气挡板的开度来控制烟气的流量和温度，从而间接影响蒸汽温度，这也是一种常见的调节方式。D. 改变给水流量调节 - 虽然给水流量的变化最终会影响蒸汽的温度，但这种方法更多地被用于控制蒸汽的压力而非温度，因此在蒸汽温度控制的直接手段中并不常用。综上所述，烟气再循环调节、喷水减温调节和烟气挡板调节都是蒸汽温度控制系统中常用的调节手段，而改变给水流量调节在此情境下并非直接相关。所以，正确答案是ABC选项：“烟气再循环调节、喷水减温调节、烟气挡板调节”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542475", "t": 2, "q": "蒸汽温度控制系统中，过热器的传热特性影响因素包括（　）", "a": ["过热器的结垢程度", "蒸汽温度和流速", "烟气温度和流速", "给水的硬度", "", ""], "r": "ABC", "e": "过热器传热受自身状况、蒸汽和烟气情况影响。结垢影响传热；蒸汽温度和流速改变传热效率；烟气温度和流速是重要热源因素。给水硬度主要影响锅炉内部结垢等，和过热器传热特性无直接关联。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542476", "t": 2, "q": "蒸汽温度控制系统中，过热器的类型包括（　）", "a": ["半辐射式过热器", "对流式过热器", "辐射式过热器", "直流式过热器", "", ""], "r": "ABC", "e": "过热器按传热方式可分为辐射式、半辐射式和对流式过热器。直流式不是过热器类型。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542477", "t": 2, "q": "蒸汽温度控制系统中，喷水减温阀的选型需考虑（　）", "a": ["减温水的压力等级", "减温水的流量调节范围", "阀门的密封性能", "蒸汽的温度等级", "", ""], "r": "ABC", "e": "答案：ABC【解析】本题考查的是蒸汽温度控制系统中喷水减温阀的选型要点。选项A，减温水的压力等级是选择喷水减温阀时的重要考虑因素，因为阀门需要能够承受减温水的压力，确保系统的安全运行，故选项A正确。选项B，减温水的流量调节范围决定了阀门对蒸汽温度的控制精度，因此也是选型时必须考虑的因素，所以选项B正确。选项C，阀门的密封性能对于防止减温水泄漏至关重要，直接影响系统的稳定性和安全性，因此选项C正确。选项D，蒸汽的温度等级虽然重要，但在选择喷水减温阀时，主要关注的是阀门对蒸汽温度的控制能力，而非蒸汽本身的温度等级，因此选项D错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542478", "t": 2, "q": "蒸汽温度控制系统中，喷水减温控制的缺点包括（　）", "a": ["调节范围有限", "调节滞后大", "易导致蒸汽带水", "降低机组热效率", "", ""], "r": "ABCD", "e": "喷水减温是往蒸汽里喷水降温。喷水过多易使蒸汽带水，且喷水相当于额外加入低温水，会降低机组热效率。其调节范围有限，调节时也存在较大滞后。ABCD选项都是其缺点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542479", "t": 2, "q": "蒸汽温度控制系统中，烟气再循环调节的工作原理包括（　）", "a": ["调节给水的温度", "改变流过过热器的烟气流量", "改变蒸汽的流量", "调整过热器的吸热量", "", ""], "r": "BD", "e": "烟气再循环是将一部分低温烟气送回炉膛，改变了流过过热器的烟气流量，进而调整过热器吸热量来控制蒸汽温度。A选项调节给水温度与烟气再循环无关；C选项不是改变蒸汽流量。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542480", "t": 2, "q": "蒸汽温度控制系统中，影响蒸汽温度的主要扰动包括（　）", "a": ["减温水流量变化", "蒸汽流量变化", "炉膛压力变化", "烟气温度变化", "", ""], "r": "ABD", "e": "减温水流量、蒸汽流量、烟气温度变化都会显著影响蒸汽温度，炉膛压力变化对蒸汽温度影响较小。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542481", "t": 2, "q": "蒸汽温度控制系统中，再热蒸汽温度控制的难点包括（　）", "a": ["再热器体积大，滞后时间长", "再热蒸汽流量随负荷变化显著", "再热器位于烟温较低区域，吸热量波动大", "喷水减温会降低机组热效率", "", ""], "r": "ABCD", "e": "ABCD选项均是再热蒸汽温度控制的难点。A中再热器体积大导致滞后时间长影响控制及时性；B里再热蒸汽流量随负荷变化显著增加控制难度；C中再热器在烟温低区域且吸热量波动大不利于稳定控温；D喷水减温降低机组热效率，这也是控制中需考虑的难点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542482", "t": 2, "q": "蒸汽温度控制系统中，再热蒸汽温度控制优先采用烟气调节的原因有（　）", "a": ["烟气调节范围更广", "烟气调节响应速度更快", "避免喷水减温降低机组热效率", "避免再热器腐蚀", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542483", "t": 2, "q": "DEH系统的核心组成部分包括（　）", "a": ["转速传感器", "电液转换器", "电液伺服阀", "数字控制器", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542484", "t": 2, "q": "DEH系统中，电液伺服阀的工作特点包括（　）", "a": ["对液压油清洁度要求高", "能直接测量转速", "响应速度快", "控制精度高", "", ""], "r": "ACD", "e": "电液伺服阀是电液转换元件，将电信号转换为液压信号。它对油液清洁度要求高，响应速度快，控制精度高。它不能直接测量转速。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542485", "t": 2, "q": "DEH系统中，电液转换器的主要技术指标包括（　）", "a": ["转换精度", "温度系数", "响应速度", "线性度", "", ""], "r": "ACD", "e": "电液转换器是将电信号转换为液压信号的关键部件，转换精度、响应速度和线性度都是衡量其性能的重要指标。温度系数虽也会影响设备，但并非主要技术指标。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542486", "t": 2, "q": "DEH系统中，阀门位置闭环控制的关键组成部分有（　）", "a": ["偏差比较器（指令与反馈比较）", "转速传感器", "阀门位置传感器", "电液伺服阀", "", ""], "r": "ACD", "e": "阀门位置闭环控制需将指令与实际阀门位置对比，再调节。偏差比较器用于对比指令与反馈；阀门位置传感器获取阀门实际位置；电液伺服阀根据偏差调节阀门开度。转速传感器与阀门位置闭环控制无直接关联。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542487", "t": 2, "q": "DEH系统中，防止汽轮机超速的保护功能包括（　）", "a": ["危急遮断系统（ETS）", "转速反馈调节功能", "阀门管理功能", "超速保护控制（OPC）", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542488", "t": 2, "q": "DEH系统中，数字控制器的硬件组成包括（　）", "a": ["微处理器", "存储器", "电液转换器", "输入/输出接口模块", "", ""], "r": "ABD", "e": "数字控制器是数字系统核心，微处理器是运算控制核心，存储器用于存储程序和数据，输入/输出接口模块负责数据输入输出，它们都是数字控制器硬件组成。而电液转换器是将电信号转换为液压信号的装置，不属于数字控制器硬件。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542489", "t": 2, "q": "DEH系统中，数字控制器的主要功能包括（　）", "a": ["实现PID调节算法", "直接驱动电液伺服阀", "计算阀门开度指令", "接收转速、负荷等指令信号", "", ""], "r": "ACD", "e": "数字控制器接收转速、负荷等指令信号，经计算得出阀门开度指令，还实现PID调节算法；而直接驱动电液伺服阀不是其主要功能。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542490", "t": 2, "q": "DEH系统中，液压油的质量要求包括（　）", "a": ["低水分含量", "高杂质含量", "良好的抗氧化性", "合适的粘度", "", ""], "r": "ACD", "e": "液压油需低杂质含量，B选项错误；低水分、良好抗氧化性和合适粘度都是液压油质量要求。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542491", "t": 2, "q": "DEH系统中，转速控制的主要功能包括（　）", "a": ["电网频率波动时的转速调节", "汽轮机负荷控制", "正常运行时的转速稳定控制", "汽轮机启停时的转速控制", "", ""], "r": "ACD", "e": "转速控制要保证汽轮机启停、正常运行时转速稳定，同时要应对电网频率波动时的调节。B选项负荷控制并非转速控制主要功能。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542492", "t": 2, "q": "DEH系统中，转速控制模式切换的条件包括（　）", "a": ["当前转速稳定在目标转速附近", "蒸汽压力稳定", "阀门位置反馈正常", "无转速保护信号触发", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542493", "t": 2, "q": "PID调节器参数整定的常用方法有（　）", "a": ["响应曲线法", "试凑法", "经验法", "临界比例度法", "", ""], "r": "ABCD", "e": "PID调节器参数整定常用方法有响应曲线法、试凑法、经验法、临界比例度法等。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542494", "t": 2, "q": "PID调节器参数整定时，临界比例度法的适用条件包括（　）", "a": ["系统为线性定常系统", "系统为二阶或近似二阶系统", "系统无纯滞后", "系统存在等幅振荡的临界状态", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542495", "t": 2, "q": "PID调节器参数整定时，若系统存在较大噪声，应采取的调整措施包括（　）", "a": ["减小积分时间Ti", "增大比例度δ", "增大积分时间Ti", "减小微分时间Td", "", ""], "r": "BCD", "e": "系统存在较大噪声时，为避免积分作用对噪声的累积，应增大积分时间Ti；微分作用对噪声敏感，要减小微分时间Td；增大比例度δ可降低系统的灵敏度。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542496", "t": 2, "q": "PID调节器参数整定时，响应曲线法的实施步骤包括（　）", "a": ["给被控对象施加阶跃输入信号", "记录被控对象的阶跃响应曲线", "根据经验公式计算PID参数", "计算对象的放大系数、时间常数和滞后时间", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542497", "t": 2, "q": "PID调节器参数整定时，需考虑的系统性能指标包括（　）", "a": ["准确性（静差）", "快速性", "鲁棒性", "稳定性", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542498", "t": 2, "q": "PID调节器中，比例度对系统性能的影响包括（　）", "a": ["比例度增大，系统静差增大", "比例度减小，系统响应加快", "比例度增大，系统稳定性增强", "比例度减小，系统超调量增大", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542499", "t": 2, "q": "PID调节器中，比例度与比例系数的关系包括（　）", "a": ["比例度δ越小，比例系数Kp越大", "比例度δ越大，比例作用越弱", "比例度δ与比例系数Kp成反比", "比例系数Kp越大，比例作用越强", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542500", "t": 2, "q": "PID调节器中，比例积分（PI）控制的特点包括（　）", "a": ["响应速度比P控制慢", "超调量比P控制大", "能消除静差", "稳定性比P控制好", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542501", "t": 2, "q": "PID调节器中，比例微分（PD）控制适用于以下哪些场合（　）", "a": ["工艺要求系统响应速度快", "被控对象存在较大纯滞后", "系统噪声干扰信号较弱", "工艺不允许系统存在静差", "", ""], "r": "AC", "e": "PD控制能加快系统响应速度，适用于响应速度要求快的场合；噪声干扰会因微分作用被放大，所以适合噪声弱的环境。B选项纯滞后用PD控制效果不佳；D选项消除静差靠积分作用，PD无此功能。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542502", "t": 2, "q": "PID调节器中，比例作用的优点包括（　）", "a": ["调节及时", "响应速度快", "结构简单", "能消除静差", "", ""], "r": "ABC", "e": "比例作用是根据偏差大小成比例地调节输出，能及时响应偏差变化，调节及时、响应速度快，且结构简单。但比例作用不能消除静差。所以ABC正确，D错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542503", "t": 2, "q": "PID调节器中，积分饱和现象可能导致的危害有（　）", "a": ["快速消除系统静差", "执行器卡涩在极限位置", "调节动作出现滞后", "系统超调量显著增大", "", ""], "r": "BD", "e": "积分饱和时，积分项不断累积，会使执行器达到极限位置并卡住，系统超调量也会显著增大。A选项快速消除静差是积分作用的正常好处；C选项调节动作滞后不是积分饱和主要导致的危害。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542504", "t": 2, "q": "PID调节器中，积分时间对系统性能的影响包括（　）", "a": ["积分时间增大，系统调节时间延长", "积分时间减小，系统超调量增大", "积分时间减小，消除静差速度加快", "积分时间增大，系统稳定性增强", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542505", "t": 2, "q": "PID调节器中，积分时间Ti对系统的影响包括（　）", "a": ["Ti越大，系统稳定性越好", "Ti越小，消除静差速度越快", "Ti越大，积分作用越弱", "Ti越小，系统振荡越剧烈", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542506", "t": 2, "q": "PID调节器中，积分作用过强可能导致的问题有（　）", "a": ["调节时间延长", "静差增大", "系统振荡加剧", "超调量增大", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542507", "t": 2, "q": "PID调节器中，能影响系统稳定性的调节作用有（　）", "a": ["微分作用", "积分作用", "比例作用", "前馈作用", "", ""], "r": "ABC", "e": "比例作用过大会使系统稳定性变差；积分作用会使系统稳定性降低；微分作用能改善系统稳定性。前馈作用主要用于补偿干扰，与系统稳定性无直接关联。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542508", "t": 2, "q": "PID调节器中，微分时间对系统性能的影响包括（　）", "a": ["微分时间增大，系统超调量减小", "微分时间增大，系统响应速度加快", "微分时间增大，系统对噪声的敏感性增强", "微分时间增大，系统稳定性减弱", "", ""], "r": "ABC", "e": "微分作用可预测偏差变化趋势，加快系统响应速度、减小超调量，但会增强系统对噪声的敏感性，微分时间增大时ABC表述都对；微分作用能改善系统稳定性，D错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542509", "t": 2, "q": "PID调节器中，微分作用的局限性包括（　）", "a": ["无法消除系统静差", "会增大系统超调量", "对噪声干扰信号敏感", "在偏差恒定的情况下无输出", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542510", "t": 2, "q": "PID调节器中，微分作用的主要特点包括（　）", "a": ["对噪声信号敏感，易放大噪声", "能消除系统静差", "能提前调节，减小超调量", "响应速度快", "", ""], "r": "AC", "e": "微分作用能根据偏差变化趋势提前调节，可减小超调量；但对噪声信号敏感，易放大噪声。积分作用能消除系统静差，比例作用响应速度快。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803743492542511", "t": 2, "q": "PID调节器中，影响积分作用强弱的参数有（　）", "a": ["积分增益Ki（与Ti成反比）", "比例度δ", "微分时间Td", "积分时间Ti", "", ""], "r": "AD", "e": "积分作用强弱与积分时间Ti和积分增益Ki有关，积分增益Ki与Ti成反比，Ti越大积分作用越弱，Ki越大积分作用越强。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336192", "t": 3, "q": "燃烧控制系统中，空燃比的设定值应根据燃料的热值进行调整。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "不同热值的燃料完全燃烧所需的空气量不同，为实现高效、稳定燃烧，需依据燃料热值来调整空燃比设定值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336193", "t": 3, "q": "燃烧控制系统中，空燃比过高会导致燃料不完全燃烧。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "空燃比是指空气与燃料的质量比，空燃比过高意味着空气量相对燃料过多，此时燃料能更充分地与氧气接触反应，是有助于完全燃烧的，而不是导致燃料不完全燃烧。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336194", "t": 3, "q": "燃烧控制系统中，燃料量不变时，送风量增大会使炉膛温度升高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "送风量增大，会使燃烧更充分，但同时也会带走更多热量。当燃料量不变时，送风量过大反而会使炉膛温度降低，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336195", "t": 3, "q": "燃烧控制系统中，燃料量控制与送风量控制需协调进行，保证空燃比稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在燃烧控制系统里，燃料量和送风量相互关联，只有协调控制二者，才能确保合适的空燃比，维持稳定燃烧。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336196", "t": 3, "q": "燃烧控制系统中，燃料量突然增加时，应先增加送风量再增加燃料量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在燃烧控制系统中，为保证燃料充分燃烧且避免不安全情况，当燃料量突然增加时，应先增加送风量再增加燃料量，这样能提供足够氧气，保障燃烧正常。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336197", "t": 3, "q": "燃烧控制系统中，燃料热值降低会导致炉膛温度升高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "燃料热值降低意味着单位质量燃料释放的热量减少，在相同条件下炉膛获得的热量变少，炉膛温度应降低而非升高。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336198", "t": 3, "q": "燃烧控制系统中，送风量不足会导致烟气中一氧化碳含量升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当送风量不足时，燃料不能充分燃烧，会产生不完全燃烧产物一氧化碳，从而使烟气中一氧化碳含量升高。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336199", "t": 3, "q": "燃烧控制系统中，送风量突然增大会导致烟气中氧气含量降低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "送风量突然增大，意味着进入燃烧系统的氧气增多，会使烟气中氧气含量升高，而不是降低，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336200", "t": 3, "q": "燃烧控制系统中，引风量控制的目标是维持炉膛微负压。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在燃烧控制系统里，引风量控制主要就是为了让炉膛保持微负压状态，以确保燃烧过程安全稳定且高效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336201", "t": 3, "q": "燃烧控制系统中，引风量突然减小会导致炉膛压力降低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336202", "t": 3, "q": "蒸汽温度控制系统中，过热器的散热损失会导致蒸汽温度升高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "过热器散热损失意味着热量散失，会使蒸汽温度降低而非升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336203", "t": 3, "q": "蒸汽温度控制系统中，过热器结垢会导致蒸汽温度升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336204", "t": 3, "q": "蒸汽温度控制系统中，过热器入口蒸汽温度升高会导致出口蒸汽温度升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在蒸汽温度控制系统里，过热器入口蒸汽温度是影响出口蒸汽温度的重要因素，入口温度升高，在过热器的加热作用下，出口蒸汽温度通常也会升高。", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336205", "t": 3, "q": "蒸汽温度控制系统中，减温水阀门故障关死会导致蒸汽温度降低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "减温水是用来降低蒸汽温度的，阀门关死意味着无法注入减温水，蒸汽温度不会降低，反而会升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336206", "t": 3, "q": "蒸汽温度控制系统中，减温水压力突然升高会导致蒸汽温度降低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "减温水压力突然升高，会使减温水流量增大，更多低温的减温水进入系统冷却蒸汽，所以蒸汽温度会降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336207", "t": 3, "q": "蒸汽温度控制系统中，喷水减温调节的响应速度比烟气挡板调节慢。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "喷水减温是直接对蒸汽进行降温，响应快；烟气挡板调节是通过改变烟气流量和热量传递来间接调节蒸汽温度，响应慢。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336208", "t": 3, "q": "蒸汽温度控制系统中，烟气温度突然降低会导致蒸汽温度降低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "蒸汽温度靠烟气加热维持，烟气温度突然降低，提供给蒸汽的热量减少，蒸汽温度会随之降低。", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336209", "t": 3, "q": "蒸汽温度控制系统中，烟气再循环调节的原理是改变烟气的温度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蒸汽温度控制系统中，烟气再循环调节原理是改变烟气量，而非烟气温度。", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336210", "t": 3, "q": "蒸汽温度控制系统中，再热蒸汽温度控制优先采用喷水减温调节。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336211", "t": 3, "q": "蒸汽温度控制系统中，蒸汽流量突然减小会导致蒸汽温度降低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蒸汽流量突然减小，意味着单位时间内传递的热量减少，在其他条件不变时，蒸汽温度会升高而非降低。", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336212", "t": 3, "q": "DEH系统的阀门管理功能可优化阀门开关顺序，减少节流损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DEH（数字电液控制系统）的阀门管理功能能够根据机组运行工况，合理优化阀门的开关顺序，这样能有效减少蒸汽在阀门处的节流损失，提高机组效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336213", "t": 3, "q": "DEH系统中，超速保护控制（OPC）在汽轮机转速超过额定值10%时动作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336214", "t": 3, "q": "DEH系统中，电液伺服阀对液压油的清洁度要求较低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电液伺服阀是DEH系统的关键部件，内部有非常精密的结构，微小的杂质颗粒都可能影响其正常工作甚至导致故障，所以对液压油清洁度要求极高。该题说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336215", "t": 3, "q": "DEH系统中，电液转换器的功能是将数字控制信号转换为液压执行信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DEH（数字电液控制系统）里，电液转换器就是把数字控制信号转变为液压执行信号，从而驱动油动机动作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336216", "t": 3, "q": "DEH系统中，阀门位置反馈信号用于校正阀门开度指令。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在DEH（数字电液控制系统）里，阀门位置反馈信号能实时反映阀门实际开度，将其与阀门开度指令对比，可对指令进行校正，保证阀门按要求动作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336217", "t": 3, "q": "DEH系统中，手动控制模式下，阀门开度由数字控制器自动计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "手动控制模式下阀门开度是由运行人员手动设定的，并非数字控制器自动计算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336218", "t": 3, "q": "DEH系统中，数字控制器的软件功能包括PID调节算法。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DEH（数字电液控制系统）中，数字控制器软件具备多种功能，PID调节算法是其重要功能之一，用于对控制参数进行精准调节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336219", "t": 3, "q": "DEH系统中，危急遮断系统（ETS）动作后，汽轮机阀门迅速关闭。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "危急遮断系统（ETS）是保障汽轮机安全的重要系统，当它动作时，会触发保护机制使汽轮机阀门迅速关闭，防止设备损坏等事故发生。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336220", "t": 3, "q": "DEH系统中，液压油的粘度随温度升高而增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般情况下，液压油的粘度随温度升高而减小，并非增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336221", "t": 3, "q": "DEH系统中，转速传感器的作用是将汽轮机转速转换为电信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DEH（数字电液控制系统）中，转速传感器就是把汽轮机的转速物理量转化为便于处理的电信号，以实现对汽轮机转速的监测和控制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336222", "t": 3, "q": "PID调节器参数整定时，临界比例度法需找到系统发生衰减振荡时的比例度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "临界比例度法是要找到系统发生等幅振荡时的比例度，而非衰减振荡，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336223", "t": 3, "q": "PID调节器参数整定时，若系统噪声大，应增大微分时间。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统噪声大时，增大微分时间会使噪声被放大，导致系统不稳定，此时应减小微分时间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336224", "t": 3, "q": "PID调节器的比例度与比例系数成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PID调节器中比例度与比例系数成反比关系，并非正比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336225", "t": 3, "q": "PID调节器的比例度越大，系统的静差越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "比例度越大，比例作用越弱，系统克服干扰能力变差，静差就会越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336226", "t": 3, "q": "PID调节器的比例度越小，比例作用越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "比例度与比例作用成反比，比例度越小，比例作用越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336227", "t": 3, "q": "PID调节器的比例作用能加快系统的响应速度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "比例作用是按偏差大小成比例地调节输出，能快速响应偏差，加快系统响应速度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336228", "t": 3, "q": "PID调节器的比例作用越强，系统的超调量越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336229", "t": 3, "q": "PID调节器的积分饱和现象是由于积分时间过大导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "积分饱和现象主要因长时间存在偏差，积分项不断累积造成，而非积分时间过大。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336230", "t": 3, "q": "PID调节器的积分时间趋近于无穷大时，积分作用消失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "积分时间无穷大，意味着积分项的作用几乎为零，相当于积分作用消失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336231", "t": 3, "q": "PID调节器的积分时间越小，积分作用越弱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PID调节器中，积分时间越小，积分速度越快，积分作用越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336232", "t": 3, "q": "PID调节器的积分作用能加快系统的动态响应。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "积分作用主要是用于消除系统的稳态误差，它会使系统响应变慢，而不是加快动态响应。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336233", "t": 3, "q": "PID调节器的积分作用能有效消除系统的静差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PID调节器中积分作用的特点就是对误差进行积分累积，能不断调整输出以减小或消除系统的静差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336234", "t": 3, "q": "PID调节器的积分作用越强，系统的稳定性越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PID调节器积分作用越强，会使系统消除稳态误差能力增强，但会使系统响应速度变慢，超调增大，稳定性变差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336235", "t": 3, "q": "PID调节器的积分作用在系统启动初期易导致超调。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PID调节器积分作用是对偏差的累积，系统启动初期偏差大，积分累积快，会使控制作用增强，易导致超调。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336236", "t": 3, "q": "PID调节器的微分时间越大，微分作用越弱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PID调节器中，微分时间越大，微分作用越强，而不是越弱。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336237", "t": 3, "q": "PID调节器的微分作用能减小系统的调节时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PID调节器中微分作用能预测偏差变化趋势，提前给出调节作用，加快系统响应速度，从而减小系统的调节时间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336238", "t": 3, "q": "PID调节器的微分作用在偏差恒定的情况下无输出。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PID调节器中微分作用是根据偏差的变化率来输出的。当偏差恒定时，其变化率为零，微分作用的输出就为零，即无输出。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336239", "t": 3, "q": "PID调节器的PD控制能消除系统静差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PD控制是比例 - 微分控制，只有积分（I）控制能消除系统静差，PD控制不能消除静差。", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336240", "t": 3, "q": "PID调节器的PD控制适用于不允许有静差的场合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PD控制是比例 - 微分控制，有微分作用虽能改善系统动态特性，但不能消除静差，不适用于不允许有静差的场合。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803744675336241", "t": 3, "q": "PID调节器的PI控制比P控制的超调量小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PI控制在P控制基础上增加了积分环节，积分作用可消除稳态误差，使系统响应更平稳，相比P控制能减小超调量。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第6章 计算机控制系统（1）", "n": "基础练习题【含解析】 / 第6章 计算机控制系统（1）", "qs": [{"id": "2034803748429238272", "t": 1, "q": "在测量数据数字化设计中，采样保持器的作用包括下列哪些?", "a": ["提高A/D转换器的转换速度", "在A/D转换期间保持输入模拟信号的幅值稳定", "将模拟信号转换为数字信号", "减少A/D转换过程中的量化误差", "", ""], "r": "B", "e": "采样保持器是在A/D转换期间使输入模拟信号幅值稳定，以便A/D准确转换。A项它不能提高转换速度；C项将模拟信号转换为数字信号是A/D转换器的功能；D项它与减少量化误差无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238273", "t": 1, "q": "在数据认证中，确保数据不可否认性的技术手段包括下列哪些?", "a": ["哈希函数", "数字签名", "数字证书", "身份认证", "", ""], "r": "B", "e": "数字签名可用于确保数据发送者不能否认发送过该数据，保障不可否认性。哈希函数主要用于数据完整性验证；数字证书用于证明身份；身份认证是确认用户身份。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238274", "t": 1, "q": "计算机控制系统的I/O通道中，采样保持器的主要作用是?", "a": ["滤除输入信号中的干扰", "在A/D转换期间保持输入信号稳定，减少转换误差", "放大输入信号", "将模拟信号转换为数字信号", "", ""], "r": "B", "e": "采样保持器能在A/D转换期间使输入信号保持稳定，避免因信号变化导致转换误差。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238275", "t": 1, "q": "计算机控制系统的I/O通道中，若某通道的输出信号为开关量，用于控制电机的启停，该通道属于?", "a": ["数字量输出通道", "数字量输入通道", "模拟量输入通道", "模拟量输出通道", "", ""], "r": "A", "e": "开关量是数字信号，控制电机启停是输出操作，所以该通道是数字量输出通道。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238276", "t": 1, "q": "计算机控制系统的I/O通道中，若某通道的输入信号为开关量（如阀门开/关状态），且信号电平为24V DC，该通道属于?", "a": ["模拟量输入通道（4-20mA）", "数字量输入通道（24V DC）", "模拟量输出通道（0-10V）", "数字量输出通道（24V DC）", "", ""], "r": "B", "e": "开关量属于数字量，输入的是24V DC信号，所以该通道是数字量输入通道。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238277", "t": 1, "q": "计算机控制系统的I/O通道中，若某通道用于控制变频器的转速，输出信号为4-20mA电流信号，该通道属于?", "a": ["数字量输出通道", "模拟量输入通道", "模拟量输出通道", "数字量输入通道", "", ""], "r": "C", "e": "控制变频器转速需输出信号，所以是输出通道；4 - 20mA电流信号是模拟信号，因此该通道是模拟量输出通道。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238278", "t": 1, "q": "计算机控制系统的I/O通道中，数字量输出通道的主要作用是?", "a": ["实现数字量与模拟量的转换", "输出模拟量控制信号", "采集现场开关量信号", "输出开关量控制信号，驱动现场执行机构（如继电器、指示灯）", "", ""], "r": "D", "e": "数字量输出通道主要是将计算机处理后的数字信号转换为开关量去控制现场执行机构。选项A是数模转换功能；选项B输出模拟量控制信号是模拟量输出通道的作用；选项C采集现场开关量信号是数字量输入通道的功能。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238279", "t": 1, "q": "计算机控制系统的I/O通道中，为了减少现场强电信号对计算机系统的干扰，通常在I/O模块与现场设备之间设置的保护组件是?", "a": ["熔断器", "继电器", "接触器", "光电耦合器", "", ""], "r": "D", "e": "光电耦合器可实现电 - 光 - 电转换，能有效隔离现场强电信号，减少对计算机系统干扰。而熔断器用于过流保护，继电器和接触器主要用于电路通断控制。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238280", "t": 1, "q": "计算机控制系统的I/O通道中，为了将计算机输出的数字量控制信号转换为现场执行机构可接收的模拟量信号（如4-20mA电流信号），需使用的组件是?", "a": ["信号调理器", "采样保持器", "D/A转换器", "A/D转换器", "", ""], "r": "C", "e": "要把计算机输出的数字量转换为模拟量，应使用D/A转换器。信号调理器用于信号处理；采样保持器是为了保持采样信号；A/D转换器是把模拟量转数字量。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238281", "t": 1, "q": "计算机控制系统的I/O通道中，信号调理器的主要作用是?", "a": ["实现数字量与模拟量的转换", "对现场输入信号进行放大、滤波、隔离", "存储采集到的测量数据", "向现场执行机构发送控制指令", "", ""], "r": "B", "e": "信号调理器主要是对现场输入信号进行处理，像放大、滤波、隔离等操作，以满足后续系统要求。A是A/D、D/A转换器作用；C是存储器功能；D是控制指令输出功能。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238282", "t": 1, "q": "计算机控制系统结构中，“操作站-控制站-I/O单元”的三级结构是下列哪种系统的典型结构?", "a": ["DCS系统", "PLC控制系统", "嵌入式控制系统", "单片机控制系统", "", ""], "r": "A", "e": "典型的DCS（分布式控制系统）采用“操作站 - 控制站 - I/O单元”三级结构。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238283", "t": 1, "q": "计算机控制系统结构中，“现场设备层-控制层-监控层-管理层”的四层结构是下列哪种控制系统的典型架构?", "a": ["单片机控制系统", "PLC控制系统", "DCS系统", "嵌入式控制系统", "", ""], "r": "C", "e": "DCS系统采用“现场设备层 - 控制层 - 监控层 - 管理层”的四层结构。单片机、嵌入式控制系统一般不具备这样典型的四层结构，PLC控制系统主要侧重于工业逻辑控制，也不是这种四层架构。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238284", "t": 1, "q": "计算机控制系统结构中，分布式结构与分散式结构的主要区别是?", "a": ["分布式结构控制功能集中，分散式结构分散", "分布式结构中各控制器协同工作，分散式结构独立工作", "分布式结构无通信网络，分散式结构有", "分布式结构中各控制器无数据交互，分散式结构有", "", ""], "r": "B", "e": "分布式结构中各控制器协同工作以完成整体控制任务，分散式结构各控制器独立工作。A选项功能集中或分散并非主要区别；C选项分布式结构有通信网络；D选项分布式结构各控制器有数据交互。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238285", "t": 1, "q": "计算机控制系统结构中，分级式结构的特点是?", "a": ["各层级之间无数据交互", "无明确的层级划分", "下一层级接受上一层级的指令，完成具体控制任务", "所有控制任务集中在上一层级", "", ""], "r": "C", "e": "分级式结构有明确层级，下一层级接受上一层级指令并完成具体控制任务，各层级间有数据交互，并非所有任务集中在上层。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238286", "t": 1, "q": "计算机控制系统结构中，若控制器与现场设备之间通过通信网络实现数据交互，无需大量电缆连接，且现场设备具备一定智能处理能力，该结构类型是?", "a": ["分布式结构", "现场总线结构", "分散式结构", "集中式结构", "", ""], "r": "B", "e": "现场总线结构通过通信网络实现控制器与现场设备数据交互，减少电缆连接，且现场设备有智能处理能力。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238287", "t": 1, "q": "计算机控制系统结构中，若系统的控制功能由多个独立的控制器分别实现，每个控制器负责一个子系统，且控制器之间通过通信交换数据，该结构是?", "a": ["分布式结构", "分级式结构", "集中式结构", "分散式结构", "", ""], "r": "A", "e": "分布式结构中控制功能由多个独立控制器分别实现，各负责子系统且通过通信交换数据；分级式结构有明显层级；集中式结构控制集中；分散式强调分散但没分布式这种协作通信特点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238288", "t": 1, "q": "计算机控制系统结构中，若现场设备直接与控制器连接，无中间通信网络，且控制器集中处理所有控制任务，该结构是?", "a": ["分布式结构", "分散式结构", "现场总线结构", "集中式结构", "", ""], "r": "D", "e": "集中式结构现场设备直接连控制器，且由控制器集中处理控制任务，符合本题描述。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238289", "t": 1, "q": "计算机控制系统结构中，现场总线结构与传统I/O结构的主要区别是?", "a": ["现场总线结构无控制器，传统I/O结构有", "现场总线结构控制功能集中，传统I/O结构分散", "现场总线结构用通信网络连接设备，传统I/O结构用电缆直接连接", "现场总线结构无需I/O模块，传统I/O结构需要", "", ""], "r": "C", "e": "现场总线结构是通过通信网络来连接各种设备，而传统I/O结构是用电缆直接将设备连接到控制器等。A选项两者一般都有控制器；B选项现场总线结构控制功能分散，传统I/O结构集中；D选项现场总线结构也需要I/O模块。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238290", "t": 1, "q": "某火电厂采用计算机控制系统进行锅炉水位控制，在工程调试阶段，需要模拟现场不同负荷下的水位变化信号，验证系统控制逻辑的正确性，此时应选用的调试工具是?", "a": ["频谱分析仪", "万用表", "示波器", "信号发生器", "", ""], "r": "D", "e": "本题是要模拟现场不同负荷下的水位变化信号来验证系统控制逻辑，需要能产生模拟信号的工具。 选项A：频谱分析仪主要用于分析信号的频谱特性，不能产生模拟水位变化信号，故A错误。 选项B：万用表主要用于测量电压、电流、电阻等基本电学参数，无法产生模拟信号，故B错误。 选项C：示波器主要用于观察电信号的波形等，不能产生模拟水位变化信号，故C错误。 选项D：信号发生器可以产生各种类型的模拟信号，能模拟现场不同负荷下的水位变化信号，故D正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238291", "t": 1, "q": "某计算机控制系统用于风力发电场的风机控制，需实现多台风机的协调控制和数据集中监控，该系统的工程应用模式属于?", "a": ["远程遥控", "单机独立控制", "分布式协同控制", "集中式统一控制", "", ""], "r": "C", "e": "要实现多台风机协调控制和数据集中监控，多台风机需协同工作，分布式协同控制符合这种多设备协同运行的特点。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238292", "t": 1, "q": "某计算机控制系统用于控制化工反应釜的温度，在工程应用中，为防止因传感器故障导致系统误动作，需设计的安全措施是?", "a": ["故障报警", "参数整定", "冗余设计", "联锁保护", "", ""], "r": "C", "e": "冗余设计是增加额外的传感器等设备，当一个传感器故障时，其他备用设备可继续工作，防止系统因传感器故障误动作。故障报警只是告知故障，不能防止误动作；参数整定是调整参数；联锁保护主要针对设备间逻辑关系。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238293", "t": 1, "q": "某计算机控制系统在电力系统中，用于发电机的励磁控制，根据发电机的转速、电压等实时参数，自动调整励磁电流，维持电压稳定，该控制属于?", "a": ["微分控制", "PID综合控制", "积分控制", "比例控制", "", ""], "r": "B", "e": "在电力系统发电机励磁控制中，常采用PID综合控制来根据发电机的转速、电压等实时参数自动调整励磁电流以维持电压稳定。PID控制结合了比例、积分、微分控制的优点，能更精准有效地实现控制目标。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238294", "t": 1, "q": "某计算机控制系统在发电站中，需实时监测电网频率、电压等参数，当参数超出范围时，快速调整发电机出力，该系统的核心要求是?", "a": ["高实时性", "高集成性", "高可靠性", "高安全性", "", ""], "r": "A", "e": "系统要实时监测参数并在参数超出范围时快速调整，强调的是时间上的即时反应，核心要求是高实时性。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238295", "t": 1, "q": "某计算机控制系统在工程应用中，需要实现与企业管理信息系统（MIS）的数据交互，共享生产实时数据和历史数据，此时应采用的通信方式是?", "a": ["无线通信", "工业以太网通信", "串口通信", "现场总线通信", "", ""], "r": "B", "e": "企业管理信息系统（MIS）与计算机控制系统交互，需高速、稳定传输数据。工业以太网通信速度快、兼容性好，适合企业内不同系统间大数据量传输。无线通信易受干扰；串口通信速率低；现场总线多用于工业现场设备连接。所以选B。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238296", "t": 1, "q": "某计算机控制系统在锅炉控制工程应用中，当炉膛压力低于安全阈值时，系统自动打开引风机挡板，该控制逻辑属于?", "a": ["比例控制", "积分控制", "微分控制", "联锁控制", "", ""], "r": "D", "e": "联锁控制是为保证设备安全，当关键工艺参数超出安全阈值时自动采取相应保护动作。本题炉膛压力低于阈值自动打开引风机挡板符合联锁控制特征。而比例、积分、微分控制主要是基于偏差对控制量进行计算调节。 答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238297", "t": 1, "q": "某计算机控制系统在化工间歇反应过程中，需严格控制反应温度随时间按预设曲线变化，该控制方式属于?", "a": ["程序控制", "随动控制", "比值控制", "定值控制", "", ""], "r": "A", "e": "程序控制是按预先设定的程序来控制，本题要严格控制反应温度随时间按预设曲线变化，符合程序控制特点。随动控制是被控量跟随输入变化；比值控制是使两个或多个参数保持一定比值；定值控制是使被控量保持定值。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238298", "t": 1, "q": "某计算机控制系统在化工生产过程中，为确保反应釜温度不超过150℃，当温度达到150℃时，系统立即关闭加热装置，该控制逻辑属于?", "a": ["紧急停车控制", "开环控制", "顺序控制", "闭环控制", "", ""], "r": "D", "e": "系统根据反应釜实际温度（反馈）来决定是否关闭加热装置以控制温度，这符合闭环控制有反馈环节的特点。紧急停车控制一般指突发危险全面停止；开环控制无反馈；顺序控制是按预定顺序执行。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238299", "t": 1, "q": "某计算机控制系统在石油开采中，为防止井口压力过高导致爆炸，当压力超过安全值时，系统立即关闭井口阀门，该功能属于?", "a": ["联锁保护", "参数监控", "过程控制", "故障诊断", "", ""], "r": "A", "e": "当压力超过安全值（参数异常）就立即关闭井口阀门防止爆炸，这是一种联锁保护机制，通过联锁动作保障系统安全。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238300", "t": 1, "q": "某计算机控制系统在食品加工中，需根据产品的生产进度，自动切换不同的加工工序，且每个工序的参数可单独设置，该控制方式属于?", "a": ["连续控制", "批量控制", "离散控制", "顺序控制", "", ""], "r": "D", "e": "顺序控制是按照预先规定的顺序，根据生产进度自动切换不同工序，符合本题描述。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238301", "t": 1, "q": "某计算机控制系统在水处理工程中，需根据水质指标（如pH值、浊度）自动调节加药泵的流量，该工程应用属于?", "a": ["批量控制", "运动控制", "逻辑控制", "过程控制", "", ""], "r": "D", "e": "过程控制是对连续生产过程进行自动控制，水处理工程根据水质指标自动调节加药泵流量，属于对连续生产过程的控制。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238302", "t": 1, "q": "某计算机控制系统在水处理过程中，根据进水流量的变化，自动调整过滤器的反冲洗频率，该控制逻辑属于?", "a": ["比值控制", "定值控制", "程序控制", "随动控制", "", ""], "r": "D", "e": "随动控制是使被控量按给定信号的变化而变化，本题中过滤器反冲洗频率随进水流量变化而自动调整，符合随动控制特点。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238303", "t": 1, "q": "某计算机控制系统在新能源电站中，需根据电网调度指令，实时调整光伏逆变器的输出功率，该工程应用的核心是计算机控制系统的?", "a": ["扩展性", "稳定性", "实时性", "准确性", "", ""], "r": "C", "e": "要根据电网调度指令实时调整光伏逆变器输出功率，重点在于“实时”，强调系统能及时响应并处理。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238304", "t": 1, "q": "某计算机控制系统在冶金生产中，需按照预设的步骤依次完成高炉上料、布料、点火、冶炼等操作，该控制方式属于?", "a": ["连续控制", "离散控制", "顺序控制", "自适应控制", "", ""], "r": "C", "e": "题目强调按预设步骤依次完成操作，顺序控制就是按照预先规定的顺序进行操作。连续控制一般是对连续变化的量进行控制；离散控制侧重于处理离散信号；自适应控制是能适应环境变化自动调整控制策略。答案为顺序控制符合题意。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238305", "t": 1, "q": "某计算机控制系统在制药生产中，需对药品批次的生产过程进行严格监控，记录每一批次的生产参数、时间、操作人员等信息，该工程应用的核心需求是?", "a": ["实时控制", "参数优化", "过程追溯", "故障诊断", "", ""], "r": "C", "e": "题目强调记录生产参数、时间、操作人员等信息，目的是便于后续追溯生产过程。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238306", "t": 1, "q": "某计算机控制系统在智能制造工厂中，需与机器人控制系统、仓储管理系统进行数据交互，实现生产流程的自动化集成，该工程应用体现了计算机控制系统的?", "a": ["集成性", "可靠性", "独立性", "实时性", "", ""], "r": "A", "e": "题目强调计算机控制系统与其他系统进行数据交互、实现生产流程自动化集成，这体现的是系统的集成性。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238307", "t": 1, "q": "在测量数据处理中，对于存在粗大误差（如传感器突发故障导致的异常数据）的测量值，常采用的剔除方法是?", "a": ["加权平均法", "3σ准则", "算术平均法", "低通滤波法", "", ""], "r": "B", "e": "3σ准则是判断粗大误差并剔除异常数据的常用方法。加权平均法和算术平均法用于数据的平均计算，低通滤波法主要用于信号滤波，不是专门剔除粗大误差的方法。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238308", "t": 1, "q": "在测量数据处理中，对于存在系统误差（如传感器零点漂移）的测量数据，常采用的修正方法是?", "a": ["滤波处理", "剔除异常值", "偏差修正", "平均处理", "", ""], "r": "C", "e": "存在系统误差如传感器零点漂移时，用偏差修正可消除或减小其影响。滤波处理主要是去除噪声干扰；剔除异常值针对测量中违背统计规律的错误数据；平均处理用于降低随机误差。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238309", "t": 1, "q": "在测量数据处理中，滑动平均滤波法的窗口大小选择应考虑?", "a": ["兼顾信号变化速度和干扰程度，信号快则窗口小，干扰重则窗口大", "仅考虑干扰的严重程度，干扰重则窗口大", "仅考虑信号的变化速度，速度快则窗口大", "与信号和干扰无关，固定窗口大小", "", ""], "r": "A", "e": "滑动平均滤波法窗口大小需综合考虑信号变化速度和干扰程度。信号变化快时窗口小，能及时跟上信号变化；干扰严重时窗口大，可更好地平滑干扰。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238310", "t": 1, "q": "在测量数据处理中，加权平均滤波法与算术平均滤波法的主要区别是?", "a": ["加权平均滤波法对所有采样值赋予相同权重", "加权平均滤波法对近期采样值赋予较大权重，远期赋予较小权重", "算术平均滤波法对近期采样值赋予较大权重", "算术平均滤波法适用于快速变化的信号", "", ""], "r": "B", "e": "算术平均滤波法对所有采样值权重相同，适用于缓慢变化信号；加权平均滤波法对不同采样值赋予不同权重，通常近期采样值权重较大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238311", "t": 1, "q": "在测量数据处理中，卡尔曼滤波算法的主要优势是?", "a": ["仅能处理静态测量数据", "只能抑制随机误差，无法处理系统误差", "计算简单，无需系统模型", "可在存在噪声的动态系统中，实时估计系统状态", "", ""], "r": "D", "e": "卡尔曼滤波用于动态系统，能在有噪声的情况下实时估计系统状态。A选项它可处理动态数据；B选项能处理系统误差；C选项需要系统模型。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238312", "t": 1, "q": "在测量数据处理中，若测量数据存在明显的线性系统误差（如测量值始终比真实值大2V），可采用的修正方法是?", "a": ["采用滑动平均滤波", "减去固定偏差值2V", "使用3σ准则剔除", "多次测量取平均值", "", ""], "r": "B", "e": "线性系统误差特点是测量值始终比真实值大固定值，修正方法就是减去这个固定偏差值。而滑动平均滤波用于平滑数据；3σ准则用于剔除粗大误差；多次测量取平均值可减小随机误差。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238313", "t": 1, "q": "在测量数据处理中，若测量数据的随机误差服从正态分布，其分布曲线的形状由下列哪个参数决定?", "a": ["极差", "标准差", "均值", "中位数", "", ""], "r": "B", "e": "正态分布曲线形状由标准差决定，标准差越大曲线越“矮胖”，越小越“瘦高”。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238314", "t": 1, "q": "在测量数据处理中，为了提高测量数据的准确性，对同一物理量进行多次重复测量后，取测量值的平均值作为最终结果，该方法主要抑制的误差类型是?", "a": ["系统误差", "随机误差", "固有误差", "粗大误差", "", ""], "r": "B", "e": "随机误差具有随机性，多次测量取平均值可使正负误差相互抵消，从而减小随机误差。系统误差是由测量仪器、测量方法等因素导致的，多次测量取平均不能消除；固有误差是仪器本身的特性，与多次测量取平均无关；粗大误差是明显错误的测量值，应剔除而不是用取平均的方法处理。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238315", "t": 1, "q": "在测量数据处理中，为了抑制随机干扰信号对测量结果的影响，同时尽可能保留有用信号的变化趋势，常采用的数字滤波方法是?", "a": ["限幅滤波法", "滑动平均滤波法", "中位值滤波法", "算术平均滤波法", "", ""], "r": "B", "e": "滑动平均滤波法能抑制随机干扰，还可保留有用信号变化趋势，其他几种滤波法各有特点但在该方面不如它。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238316", "t": 1, "q": "在测量数据数字化设计中，若某模拟信号的满量程为0-10V，A/D转换器的位数为12位，忽略量化误差，该A/D转换器的量化间隔（即最小分辨电压）是多少?", "a": ["9.77mV", "2.44mV", "19.53mV", "4.88mV", "", ""], "r": "B", "e": "A/D 转换器量化间隔 = 满量程电压 / 「test/yiwen_img/importSubject/2034803745426116608.png」（n 为位数），这里满量程是 10V，n = 12，「test/yiwen_img/importSubject/2034803745640026112.png」，「test/yiwen_img/importSubject/2034803745728106496.png」。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238317", "t": 1, "q": "在测量数据数字化设计中，若某模拟信号的最高频率为50Hz，为避免采样失真，采样频率至少应设置为?", "a": ["150Hz", "200Hz", "100Hz", "50Hz", "", ""], "r": "C", "e": "根据采样定理，采样频率应至少为模拟信号最高频率的2倍，此模拟信号最高频率为50Hz，所以采样频率至少为100Hz。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238318", "t": 1, "q": "在测量数据数字化设计中，若需提高A/D转换器的转换速度，同时兼顾一定的转换精度，适合选择的A/D转换器类型是?", "a": ["并行比较型A/D转换器", "逐次逼近型A/D转换器", "Σ-Δ型A/D转换器", "积分型A/D转换器", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238319", "t": 1, "q": "在测量数据数字化设计中，若A/D转换器的位数从10位提升到12位，其他条件不变，其量化间隔会如何变化?", "a": ["变为原来的2倍", "变为原来的1/2", "变为原来的4倍", "变为原来的1/4", "", ""], "r": "D", "e": "量化间隔与「test/yiwen_img/importSubject/2034803745426116608.png」成反比（n为A/D转换器位数），位数从10位提升到12位，「test/yiwen_img/importSubject/2034803745837158400.png」，则量化间隔变为原来的1/4。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238320", "t": 1, "q": "在测量数据数字化设计中，为了避免因采样频率过低导致模拟信号波形失真，需遵循的采样定理是?", "a": ["傅里叶采样定理", "香农采样定理", "拉普拉斯采样定理", "奈奎斯特采样定理", "", ""], "r": "D", "e": "答案：D在测量数据数字化设计中，为避免采样频率过低导致模拟信号波形失真，需遵循的采样定理是奈奎斯特采样定理（Nyquist Sampling Theorem）。该定理规定了为了避免混叠（aliasing）并能完全恢复原始模拟信号，采样频率必须至少是信号最高频率的两倍。", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238321", "t": 1, "q": "在测量数据数字化设计中，信号调理器中的隔离电路主要作用是?", "a": ["放大微弱信号", "滤除高频干扰信号", "将模拟信号转换为数字信号", "防止现场强电信号窜入计算机系统，保护设备", "", ""], "r": "D", "e": "隔离电路主要是起到隔离作用，避免现场强电信号进入计算机系统而损坏设备。A选项放大微弱信号是放大器作用；B选项滤除高频干扰信号是滤波器功能；C选项模拟转数字是模数转换器的功能。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803748429238322", "t": 1, "q": "在测量数据数字化设计中，A/D转换器的转换精度除了与位数相关外，还与下列哪项指标密切相关?", "a": ["输出电平", "转换速度", "输入阻抗", "线性度", "", ""], "r": "D", "e": "A/D转换器转换精度除与位数有关，线性度也密切影响精度，线性度好能更准确转换。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234560", "t": 2, "q": "计算机控制系统的典型结构类型包括下列哪些?", "a": ["分散式结构", "集中式结构", "现场总线结构", "分布式结构", "", ""], "r": "BCD", "e": "计算机控制系统典型结构有集中式、分布式、现场总线结构。分散式并非典型结构类型。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234561", "t": 2, "q": "计算机控制系统的分布式结构的特点包括下列哪些?", "a": ["控制功能分散在多个控制器上", "适合大型、复杂的控制场景", "系统可靠性高，单一控制器故障不影响其他控制器", "控制器之间通过通信网络实现数据交互和协同控制", "", ""], "r": "ABCD", "e": "分布式结构将控制功能分散于多个控制器，能应对大型复杂场景，单一控制器故障不影响整体，且各控制器通过通信网络交互协同。ABCD选项均符合其特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234562", "t": 2, "q": "计算机控制系统的分布式结构的优势包括下列哪些?", "a": ["系统可靠性高，单一控制器故障仅影响局部", "便于系统扩展，新增控制对象只需增加相应控制器", "无需通信网络，减少系统复杂度", "控制功能分散，减少单个控制器的负载", "", ""], "r": "ABD", "e": "分布式结构中各控制器相对独立，单一故障影响局部，可靠性高；扩展时添加对应控制器即可；控制功能分散减轻单个控制器负载。而分布式结构需要通信网络连接各部分。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234563", "t": 2, "q": "计算机控制系统的集中式结构的适用场景包括下列哪些?", "a": ["对实时性要求极高的单一控制对象", "小型污水处理设备的本地控制", "控制点数少、控制逻辑简单的小型系统", "大型化工园区的多装置协同控制", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234564", "t": 2, "q": "计算机控制系统的集中式结构的特点包括下列哪些?", "a": ["系统可靠性高，单一故障不影响整体", "适合小型、简单的控制场景", "现场设备与控制器直接连接，电缆用量大", "控制功能集中在一个控制器上", "", ""], "r": "BD", "e": "答案：BD集中式结构的特点是控制功能集中在一个控制器上（选项D），因此适合小型、简单的控制场景（选项B）。选项A错误，因为集中式结构的系统可靠性较低，单一故障可能会影响整体。选项C错误，因为现场设备与控制器直接连接，电缆用量相对较少，而不是大。", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234565", "t": 2, "q": "计算机控制系统的结构设计中，需考虑的因素包括下列哪些?", "a": ["系统的实时性", "系统的可靠性", "系统的成本", "系统的扩展性", "", ""], "r": "ABCD", "e": "计算机控制系统结构设计时，实时性确保系统能及时响应处理；可靠性保证系统稳定运行；成本是经济考量；扩展性利于系统后续升级。ABCD 选项均是要考虑的因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234566", "t": 2, "q": "计算机控制系统的现场总线结构的优势包括下列哪些?", "a": ["现场设备具备智能诊断功能，便于维护", "减少现场布线，降低安装成本", "控制功能完全集中在中央控制器，便于管理", "支持多主站通信，提高系统灵活性", "", ""], "r": "ABD", "e": "现场总线结构使现场设备智能化，可自我诊断便于维护，还能减少布线降低成本，且支持多主站通信提升灵活性；而其控制功能是分散的并非集中在中央控制器。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234567", "t": 2, "q": "计算机控制系统的I/O通道中，模拟量输出通道的核心功能包括下列哪些?", "a": ["将计算机输出的数字控制信号转换为模拟信号", "滤除模拟输出信号中的高频纹波，保证信号平滑", "对模拟输出信号进行功率放大，驱动现场执行机构", "采集现场模拟量信号并传输给计算机", "", ""], "r": "ABC", "e": "模拟量输出通道主要是把计算机输出的数字控制信号转成模拟信号，再经过滤波使信号平滑，最后功率放大去驱动现场执行机构。D选项采集现场模拟量信号并传输给计算机是模拟量输入通道的功能。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234568", "t": 2, "q": "计算机控制系统的I/O通道中，模拟量输出通道的主要组成部分包括下列哪些?", "a": ["低通滤波器", "信号放大器", "D/A转换器", "采样保持器", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234569", "t": 2, "q": "计算机控制系统的I/O通道中，模拟量输入通道的信号调理器需完成的处理包括下列哪些?", "a": ["将现场微弱信号放大到A/D转换器的输入范围", "将电流信号转换为电压信号（如4-20mA转0-5V）", "将数字信号转换为模拟信号", "滤除现场信号中的高频干扰", "", ""], "r": "ABD", "e": "模拟量输入通道信号调理器主要是对现场模拟信号处理，A可让信号适配A/D转换器；B能将常见电流信号转换为合适电压信号；D可去除高频干扰保证信号质量。而C是D/A转换器功能，不是信号调理器的。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234570", "t": 2, "q": "计算机控制系统的I/O通道中，数字量输出通道的主要功能包括下列哪些?", "a": ["对输出信号进行电气隔离", "对输出信号进行功率放大，驱动执行机构", "实现数字量到模拟量的转换", "输出开关量控制信号（如电机启停）", "", ""], "r": "ABD", "e": "数字量输出通道主要是输出开关量信号控制设备，同时为保证安全需电气隔离，且要功率放大来驱动执行机构。C选项数字量到模拟量转换是D/A转换功能，不是数字量输出通道主要功能。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234571", "t": 2, "q": "计算机控制系统的I/O通道中，数字量输入通道的主要功能包括下列哪些?", "a": ["实现模拟量到数字量的转换", "对输入信号进行电平转换", "对输入信号进行电气隔离", "采集现场开关量信号（如阀门开/关）", "", ""], "r": "BCD", "e": "数字量输入通道主要是采集现场开关量信号，同时要对输入信号进行电平转换和电气隔离。A选项实现模拟量到数字量转换是模拟量输入通道功能。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234572", "t": 2, "q": "计算机控制系统的I/O通道中，数字量输入通道需处理的现场信号类型包括下列哪些?", "a": ["电机的运行/停止状态信号（干接点）", "压力测量信号（0-10V）", "阀门的开/关状态信号（24V DC）", "温度测量信号（4-20mA）", "", ""], "r": "AC", "e": "数字量输入通道处理的是开关量信号。A选项电机运行/停止状态、C选项阀门开/关状态都属于开关量信号；B选项0 - 10V压力测量信号、D选项4 - 20mA温度测量信号属于模拟量信号。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234573", "t": 2, "q": "计算机控制系统的I/O通道中，提高通道抗干扰能力的措施包括下列哪些?", "a": ["在通道中增加RC滤波电路", "提高A/D转换器的转换位数", "采用光电耦合器实现电气隔离", "选用屏蔽性能好的传输电缆", "", ""], "r": "ACD", "e": "RC滤波电路可滤除干扰信号；光电耦合器能实现电气隔离，阻断干扰传播；屏蔽电缆可减少外界电磁干扰。而提高A/D转换器转换位数主要是提高转换精度，与抗干扰无关。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234574", "t": 2, "q": "计算机控制系统的I/O通道中，影响通道抗干扰能力的因素包括下列哪些?", "a": ["A/D转换器的位数", "是否采用滤波电路", "是否采用电气隔离", "通道的布线方式", "", ""], "r": "BCD", "e": "滤波电路可滤除干扰信号，电气隔离能阻断干扰传播，通道布线方式合理可减少干扰，而A/D转换器位数主要影响精度非抗干扰能力。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234575", "t": 2, "q": "计算机控制系统在城市污水处理的工程应用中，需实现的控制功能包括下列哪些?", "a": ["沉淀池污泥排放控制", "进水流量控制", "曝气池溶解氧控制", "出水水质指标控制", "", ""], "r": "ABCD", "e": "在城市污水处理中，沉淀池污泥排放、进水流量、曝气池溶解氧以及出水水质指标都需要进行控制，计算机控制系统可实现这些功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234576", "t": 2, "q": "计算机控制系统在风力发电场的工程应用中，需实现的控制功能包括下列哪些?", "a": ["风机转速控制", "电网并网控制", "风机偏航控制", "风机变桨距控制", "", ""], "r": "ABCD", "e": "在风力发电场计算机控制系统中，风机转速、电网并网、风机偏航、风机变桨距控制都是需要实现的重要控制功能。ABCD选项均符合要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234577", "t": 2, "q": "计算机控制系统在风力发电场的工程应用中，应对阵风干扰的控制措施包括下列哪些?", "a": ["风机偏航角度的实时调整", "风机转速的PID调节", "快速变桨距控制", "电网并网开关的快速切断", "", ""], "r": "ABC", "e": "阵风干扰会使风力突变，快速变桨距控制可迅速改变桨叶角度来应对，能调节风能捕获；风机转速的PID调节可根据风速变化调整转速；风机偏航角度实时调整能让风机更好对准风向。而电网并网开关快速切断是故障等极端情况操作，非应对阵风干扰措施。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234578", "t": 2, "q": "计算机控制系统在工业锅炉控制的工程应用中，通常需要实现的控制功能包括下列哪些?", "a": ["温度控制", "水位控制", "压力控制", "流量控制", "", ""], "r": "ABCD", "e": "工业锅炉运行中，温度、水位、压力和流量都是重要参数，需要计算机控制系统对这些参数进行控制以保证锅炉安全稳定运行。所以ABCD选项都属于通常需实现的控制功能。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234579", "t": 2, "q": "计算机控制系统在光伏电站的工程应用中，需实现的核心控制功能包括下列哪些?", "a": ["光伏逆变器并网控制", "最大功率点跟踪（MPPT）控制", "电网频率调节控制", "电池板温度控制", "", ""], "r": "AB", "e": "光伏逆变器并网控制能让逆变器与电网稳定连接；最大功率点跟踪（MPPT）控制可使光伏电池在不同光照等条件下输出最大功率，这两者是计算机控制系统在光伏电站应用中的核心功能。电网频率调节一般由电网侧统一调控，并非光伏电站计算机控制系统核心。电池板温度控制不是核心控制功能。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234580", "t": 2, "q": "计算机控制系统在化工间歇反应的工程应用中，需实现的控制功能包括下列哪些?", "a": ["反应温度控制", "原料进料顺序控制", "反应时间控制", "反应压力控制", "", ""], "r": "ABCD", "e": "化工间歇反应中，温度、压力会影响反应进行，需控制；原料进料顺序会影响反应产物和过程，也需精准控制；反应时间同样是关键因素，会决定反应程度。所以ABCD四个选项的控制功能都需要实现。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234581", "t": 2, "q": "计算机控制系统在化工连续生产的工程应用中，需满足的控制要求包括下列哪些?", "a": ["生产批次的可追溯性", "控制过程的无扰切换（如手动/自动切换）", "紧急情况下的快速联锁保护", "控制参数的长期稳定性", "", ""], "r": "BCD", "e": "化工连续生产中，控制过程要能无扰切换保证生产稳定；紧急情况需快速联锁保护避免危险；控制参数长期稳定确保产品质量。而生产批次可追溯性主要针对离散生产追溯产品信息，并非连续生产的控制要求。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234582", "t": 2, "q": "计算机控制系统在化工生产过程的工程应用中，为确保生产安全，常采用的安全措施包括下列哪些?", "a": ["参数整定", "联锁保护", "冗余设计", "故障报警", "", ""], "r": "BCD", "e": "参数整定主要是调整控制器参数以优化控制性能，并非安全措施。联锁保护可在异常时自动采取措施避免危险；冗余设计通过备用设备保证系统在故障时仍能正常运行；故障报警能及时告知人员系统故障。所以B、C、D是确保生产安全的措施。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234583", "t": 2, "q": "计算机控制系统在火力发电厂的工程应用中，针对锅炉的控制功能包括下列哪些?", "a": ["给水流量控制", "汽轮机转速控制", "燃料量控制", "送风量控制", "", ""], "r": "ACD", "e": "锅炉控制主要围绕其运行的关键参数，给水流量、燃料量、送风量都是与锅炉运行密切相关的控制内容，而汽轮机转速控制主要针对汽轮机，并非锅炉控制功能。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234584", "t": 2, "q": "计算机控制系统在火力发电厂的工程应用中，针对汽轮机的控制功能包括下列哪些?", "a": ["汽轮机真空度控制", "锅炉水位控制", "汽轮机转速控制", "汽轮机进汽阀开度控制", "", ""], "r": "CD", "e": "A项真空度控制非主要控制功能；B项锅炉水位控制与汽轮机无关。汽轮机控制主要是转速和进汽阀开度控制，转速控制是核心要求，进汽阀开度控制能调节蒸汽流量从而影响汽轮机运行。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234585", "t": 2, "q": "计算机控制系统在新能源微电网的工程应用中，需实现的控制功能包括下列哪些?", "a": ["微电网与大电网的并网/离网切换控制", "分布式电源（光伏、储能）的协同控制", "大电网的频率和电压调节控制", "微电网内部负荷的功率分配控制", "", ""], "r": "ABD", "e": "新能源微电网工程应用中，要实现并网离网切换、分布式电源协同、内部负荷功率分配的控制。而大电网频率和电压调节并非计算机控制系统在新能源微电网工程应用要实现的功能，其主体是大电网相关调控体系。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234586", "t": 2, "q": "计算机控制系统在冶金炼钢的工程应用中，需实现的控制功能包括下列哪些?", "a": ["炼钢炉的温度控制", "锅炉的水位控制", "轧钢机的轧制力控制", "钢水的成分分析与控制", "", ""], "r": "ACD", "e": "冶金炼钢过程中，炼钢炉温度、轧钢机轧制力、钢水成分都需要精确控制，而锅炉水位控制不属于冶金炼钢直接需实现的控制功能。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234587", "t": 2, "q": "计算机控制系统在冶金轧钢生产的工程应用中，需实现的控制功能包括下列哪些?", "a": ["钢板冷却速度控制", "钢坯加热温度控制", "钢板厚度控制", "轧辊转速控制", "", ""], "r": "ABCD", "e": "在冶金轧钢生产中，钢板冷却速度、钢坯加热温度、钢板厚度和轧辊转速都是重要的控制参数。计算机控制系统要对这些参数精准控制，以保证生产质量和效率，ABCD选项所涉及内容均为需实现的控制功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234588", "t": 2, "q": "计算机控制系统在制药间歇生产的工程应用中，需实现的功能包括下列哪些?", "a": ["批次生产完成后的自动清场提示", "批次间的生产参数快速切换", "连续稳定的生产过程控制", "每一批次生产参数的记录与存储", "", ""], "r": "ABD", "e": "制药间歇生产有批次性特点，A可保障生产环境，B能适应不同批次参数变化，D利于追溯管理；而间歇生产并非连续稳定生产，C不符合。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234589", "t": 2, "q": "计算机控制系统在制药生产的工程应用中，需满足的特殊要求包括下列哪些?", "a": ["控制参数的精确性", "系统的防爆性能", "生产过程的可追溯性", "数据的安全性和完整性", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234590", "t": 2, "q": "计算机控制系统在智能制造的工程应用中，体现的技术特点包括下列哪些?", "a": ["具备数据采集和分析能力", "与其他系统（如MES、ERP）的集成性", "具备自主决策和自适应控制能力", "基于工业以太网的通信能力", "", ""], "r": "ABCD", "e": "计算机控制系统在智能制造中，要处理大量生产数据，需具备数据采集分析能力；要融入整个制造体系，需与MES、ERP等系统集成；复杂生产环境下要有自主决策和自适应控制能力以优化生产；也需要工业以太网保证通信，ABCD都是其技术特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234591", "t": 2, "q": "计算机控制系统在智能制造工厂的工程应用中，与机器人控制系统的交互内容包括下列哪些?", "a": ["机器人运行状态的采集（如位置、速度）", "机器人故障信息的上报", "生产任务的下发（如零件加工指令）", "工厂电力系统的电压调节", "", ""], "r": "ABC", "e": "计算机控制系统与机器人控制系统交互主要围绕机器人本身运行及任务相关。A采集运行状态、B上报故障信息、C下发生产任务都和机器人直接相关；而D工厂电力系统电压调节与机器人控制系统无直接交互。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234592", "t": 2, "q": "在测量数据处理中，常用的数字滤波方法有哪些?", "a": ["滑动平均滤波法", "3σ准则滤波法", "中位值滤波法", "算术平均滤波法", "", ""], "r": "ACD", "e": "测量数据处理中的数字滤波主要用于去除噪声或异常值，以得到更准确的数据。常见的数字滤波方法应该能够平滑数据、减少随机误差的影响。A. 滑动平均滤波法 - 这种方法通过计算最近几个数据的平均值来平滑数据，是常用的滤波方法之一。C. 中位值滤波法 - 它通过取一系列数据的中位数来去除异常值，也是一种有效的滤波手段。D. 算术平均滤波法 - 类似于滑动平均，但可能不考虑数据的时效性或权重，仍然是基本的滤波方法。B. 3σ准则滤波法 - 实际上，3σ准则主要用于判断数据是否为异常值（离群点），而不是直接用于滤波。它并不是一个滤波“方法”，而是一种异常值检测的准则。综上所述，选项B与其他三项在性质上有所不同，不是直接用于滤波的方法。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234593", "t": 2, "q": "在测量数据处理中，常用的统计分析方法包括下列哪些?", "a": ["计算测量数据的中位数", "采用滑动平均滤波法", "计算测量数据的标准差", "计算测量数据的均值", "", ""], "r": "ACD", "e": "在测量数据处理中，中位数、标准差、均值都是常用统计量，可用于分析数据特征；滑动平均滤波法是一种数据平滑处理方法，不属于统计分析方法。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234594", "t": 2, "q": "在测量数据处理中，处理系统误差的常用方法包括下列哪些?", "a": ["对称测量法", "3σ准则法", "校准法", "偏差修正法", "", ""], "r": "ACD", "e": "对称测量法可消除随时间线性变化的系统误差；校准法能通过与标准器具对比找出误差来修正；偏差修正法可对已知系统误差进行修正。而3σ准则法是用于判断粗大误差的。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234595", "t": 2, "q": "在测量数据处理中，粗大误差的产生原因包括下列哪些?", "a": ["测量仪器的零点漂移", "传感器突发故障（如瞬时短路）", "操作人员的误操作（如误读、误录）", "测量信号受到强电磁干扰的瞬时冲击", "", ""], "r": "BCD", "e": "粗大误差是明显超出规定条件下预期的误差，多由错误操作、突发故障、强干扰冲击等造成。A选项零点漂移属系统误差。B传感器突发故障、C操作人员误操作、D强电磁干扰冲击都会产生粗大误差。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234596", "t": 2, "q": "在测量数据处理中，粗大误差的剔除条件包括下列哪些?", "a": ["测量值始终比其他值大固定偏差", "测量值与相邻测量值偏差过大", "测量值超出均值±3σ范围", "测量值明显不符合物理规律", "", ""], "r": "BCD", "e": "答案：BCD粗大误差是明显歪曲测量结果的误差，剔除条件主要有：测量值与相邻测量值偏差过大（B选项）；测量值超出均值±3σ范围（C选项），其中σ是标准差；测量值明显不符合物理规律（D选项）。A选项中的“测量值始终比其他值大固定偏差”描述的是系统误差，而不是粗大误差，因此不选。", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234597", "t": 2, "q": "在测量数据处理中，卡尔曼滤波的优势包括下列哪些?", "a": ["无需建立系统数学模型，直接处理测量数据", "计算量小，适合工业控制的实时性要求", "可在存在测量噪声的情况下，提高估计精度", "适用于动态系统的实时状态估计", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234598", "t": 2, "q": "在测量数据处理中，适合处理快速变化信号的数字滤波方法包括下列哪些?", "a": ["滑动平均滤波法（小窗口）", "算术平均滤波法（大窗口）", "加权平均滤波法（近期权重高）", "中位值滤波法", "", ""], "r": "AC", "e": "在测量数据处理中，对于快速变化信号的数字滤波，关键在于选择能够迅速响应信号变化的滤波方法。A. 滑动平均滤波法（小窗口）：小窗口意味着每次只考虑信号的一小部分，因此能够更快速地反映信号的变化。这种方法适合处理快速变化的信号。B. 算术平均滤波法（大窗口）：大窗口会考虑信号的大部分历史数据，导致响应速度较慢，不适合处理快速变化的信号。C. 加权平均滤波法（近期权重高）：给予近期数据更高的权重意味着更重视信号的当前变化，因此能够更快地响应信号的变化。这种方法也适合处理快速变化的信号。D. 中位值滤波法：这种方法主要用于去除噪声，尤其是脉冲噪声，而不是特别针对快速变化的信号。综上所述，适合处理快速变化信号的数字滤波方法包括滑动平均滤波法（小窗口）和加权平均滤波法（近期权重高）。所以，正确答案是AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234599", "t": 2, "q": "在测量数据处理中，随机误差的特性包括下列哪些?", "a": ["单峰性", "抵偿性", "确定性", "对称性", "", ""], "r": "ABD", "e": "随机误差具有单峰性、抵偿性、对称性和有界性。确定性不是随机误差特性。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234600", "t": 2, "q": "在测量数据处理中，系统误差的来源包括下列哪些?", "a": ["传感器的零点漂移", "测量环境温度的变化", "操作人员的偶然读数误差", "测量仪器的刻度偏差", "", ""], "r": "ABD", "e": "系统误差是由某些固定原因造成的，具有重复性、单向性。A选项传感器零点漂移、B选项测量环境温度变化、D选项测量仪器刻度偏差都会导致测量出现固定的偏差，属于系统误差；而C选项操作人员偶然读数误差是随机的，属于随机误差。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234601", "t": 2, "q": "在测量数据数字化设计中，参考电压对A/D转换器的影响包括下列哪些?", "a": ["参考电压的幅值决定A/D转换器的输入信号范围", "参考电压的波形影响A/D转换的线性度", "参考电压的频率影响A/D转换的速度", "参考电压的稳定性影响A/D转换的精度", "", ""], "r": "AD", "e": "参考电压幅值确定A/D转换器输入信号范围；其稳定性会影响转换精度。而参考电压一般无波形和频率影响转换线性度和速度之说。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234602", "t": 2, "q": "在测量数据数字化设计中，低通滤波器的主要作用包括下列哪些?", "a": ["放大输入信号的幅值", "防止采样过程中出现频率混叠", "将模拟信号转换为数字信号", "滤除输入信号中的高频干扰信号", "", ""], "r": "BD", "e": "低通滤波器允许低频信号通过，抑制高频信号，可滤除高频干扰信号，同时根据采样定理，使用低通滤波器能限制信号最高频率，防止采样时出现频率混叠。它不用于放大信号幅值，模拟信号转数字信号是模数转换器的功能。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234603", "t": 2, "q": "在测量数据数字化设计中，信号调理器的主要功能包括下列哪些?", "a": ["信号滤波", "信号放大", "信号转换（如电流转电压）", "信号隔离", "", ""], "r": "ABCD", "e": "信号调理器可对输入信号进行处理，常见功能有滤波去除干扰、放大信号以便后续处理、进行信号转换以及实现信号隔离。ABCD选项都属于其主要功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234604", "t": 2, "q": "在测量数据数字化设计中，选择采样频率时需考虑的因素包括下列哪些?", "a": ["测量系统的噪声水平", "被测量信号的最高频率成分", "后续数据处理算法的要求（如滤波算法）", "A/D转换器的转换位数", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234605", "t": 2, "q": "在测量数据数字化设计中，选择A/D转换器时需考虑的技术指标包括下列哪些?", "a": ["转换位数", "输出接口类型", "转换速度", "输入电压范围", "", ""], "r": "ACD", "e": "答案：ACD在选择 A/D 转换器时，转换位数决定了转换的精度；转换速度影响数据采集的实时性；输入电压范围要符合被测量的信号范围。而输出接口类型并非是选择 A/D 转换器时重点考虑的技术指标。", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234606", "t": 2, "q": "在测量数据数字化设计中，影响A/D转换器转换精度的因素包括下列哪些?", "a": ["线性度", "转换位数", "输入阻抗", "转换速度", "", ""], "r": "AB", "e": "A/D转换器转换精度受线性度、转换位数等影响。线性度反映实际转换特性与理想特性的接近程度；转换位数越多，量化误差越小，精度越高。输入阻抗主要影响信号输入情况，转换速度影响转换快慢，与转换精度无直接关联。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034803750199234607", "t": 2, "q": "在测量数据数字化设计中，A/D转换器的转换时间与下列哪些因素相关?", "a": ["转换原理（如逐次逼近型、并行比较型）", "转换位数", "参考电压的大小", "输入信号的幅值", "", ""], "r": "AB", "e": "A/D转换器转换时间与转换原理有关，不同原理转换速度不同；转换位数越多，转换所需时间通常越长。参考电压和输入信号幅值主要影响转换结果，而非转换时间。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034803752443187200", "t": 3, "q": "工业控制网络安全防护中，定期备份工控系统的组态文件、程序代码和历史数据，是应对系统故障或恶意攻击的重要恢复手段。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "定期备份工控系统的相关文件和数据，在系统遭遇故障或恶意攻击时，能利用备份进行恢复，保障系统的正常运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803752443187201", "t": 3, "q": "工业控制网络安全防护中，禁止工控设备接入互联网是防止外部恶意攻击的有效措施，可完全避免网络安全风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "禁止工控设备接入互联网能降低外部恶意攻击风险，但不能完全避免，如内部人员误操作、设备自身漏洞等仍会带来安全风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803752443187202", "t": 3, "q": "工业控制网络安全防护中，漏洞扫描工具可自动修复工控设备中所有检测到的安全漏洞，无需人工干预。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "漏洞扫描工具主要功能是检测安全漏洞，并非能自动修复所有检测到的漏洞，很多情况下需要人工干预来完成修复。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803752443187203", "t": 3, "q": "工业控制网络安全防护中，入侵检测系统（IDS）可主动阻止非法访问行为，防止恶意攻击对工控系统造成破坏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "入侵检测系统（IDS）主要是对网络中的异常行为进行检测和报警，它是被动的监测系统，本身不能主动阻止非法访问行为，主动阻止非法访问的是防火墙等设备。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803752443187204", "t": 3, "q": "工业控制网络安全防护中，身份认证仅需验证操作员的用户名和密
