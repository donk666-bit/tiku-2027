组\"的联锁保护包括", "a": ["给水泵入口阀门关闭:停止给水泵，防止空转", "给水泵电机电流高:仅报警，不停止设备", "给水泵出口压力低:启动备用给水泵", "给水泵轴承温度高:触发报警，温度超高时停止给水泵", "", ""], "r": "ACD", "e": "给水泵入口阀门关闭，继续运行会使泵空转损坏，应停止泵；电机电流高可能损坏设备，通常不止报警还会停设备；出口压力低需启动备用泵保障供水；轴承温度高先报警，超高时为防设备损坏要停泵。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308941", "t": 2, "q": "火电厂\"锅炉燃烧系统功能组\"的顺序控制启动流程中，需执行的步骤包括", "a": ["点燃点火器，检测火焰是否建立", "投入主燃料，调节燃料量与送风量匹配", "启动送风机，调节送风量至设定值", "启动引风机，检测炉膛负压是否正常", "", ""], "r": "ABCD", "e": "火电厂锅炉燃烧系统功能组启动，首先要建立通风，启动引风机检测炉膛负压正常，再启动送风机调节送风量，之后点燃点火器，最后投入主燃料。所以顺序是D→C→A→B。答案选ABCD。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308942", "t": 2, "q": "火电厂\"凝汽器真空系统功能组\"的顺序控制包括的动作有", "a": ["真空度达到设定值后，停止备用真空泵", "真空度超上限值时，开启放气阀泄压", "启动真空泵，检测真空度是否上升", "真空度低于下限值时，启动备用真空泵", "", ""], "r": "ACD", "e": "凝汽器真空系统顺序控制通常是先启动真空泵检测真空度上升情况，真空度达设定值停备用泵，低了启备用泵。超上限开启放气阀不属于顺序控制常规动作。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308943", "t": 2, "q": "火电厂\"汽轮机润滑油系统功能组\"的顺序控制包括的功能有", "a": ["启动前检测:油位、油温、油压是否正常", "故障时停止油泵，关闭所有阀门", "启动润滑油泵，检测油压是否达到设定值", "启动润滑油冷却器，调节油温至正常范围", "", ""], "r": "ACD", "e": "汽轮机润滑油系统功能组顺序控制需先进行启动前检测，确认油位、油温、油压正常，接着启动油泵并检测油压，之后启动冷却器调节油温。故障时停止油泵关闭阀门不是顺序控制包含的常规功能。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308944", "t": 2, "q": "火电厂\"脱硫系统功能组\"的顺序控制启动流程包括", "a": ["启动氧化风机，向吸收塔通入氧气", "投入脱硫剂，调节脱硫剂用量与烟气量匹配", "启动搅拌器，防止吸收塔内浆液沉淀", "启动工艺水泵，建立工艺水回路", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308945", "t": 2, "q": "火电厂\"引风机系统功能组\"的顺序控制包括的阶段有", "a": ["启动阶段:启动引风机，检测状态", "运行阶段:监控电流、温度、负压，调节挡板", "停机阶段:按顺序停止引风机，关闭挡板", "故障阶段:故障时紧急停机，报警", "", ""], "r": "ABCD", "e": "火电厂“引风机系统功能组”顺序控制通常涵盖启动、运行、停机和故障处理等阶段，ABCD选项分别对应了这些不同阶段的操作内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308946", "t": 2, "q": "火电厂顺序控制系统（SCS）的控制原则有", "a": ["冗余设计（如双CPU、双I/O模块，提高可靠性）", "分层控制（就地控制、远方控制、集控室控制，优先级从高到低）", "手动/自动切换（自动模式优先于手动模式）", "联锁保护（如故障时自动停机，防止设备损坏）", "", ""], "r": "ABD", "e": "SCS控制原则包括冗余设计保障可靠性、分层控制且就地控制优先级最高、手动/自动切换是手动优先，还有联锁保护防止设备损坏。C选项自动模式优先错误。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308947", "t": 2, "q": "火电厂SCS的\"故障自诊断\"功能可检测的故障类型包括", "a": ["通信故障（如CPU与I/O模块、PLC与上位机通信中断）", "PLC CPU故障（如运算错误、程序丢失）", "I/O模块故障（如模块离线、信号断线）", "被控设备机械故障（如轴承磨损、齿轮卡涩）", "", ""], "r": "ABC", "e": "火电厂SCS（顺序控制系统）的故障自诊断主要针对系统自身软硬件相关故障，通信、PLC CPU、I/O模块故障都在其可检测范围内，而被控设备机械故障超出了SCS故障自诊断能力。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308948", "t": 2, "q": "火电厂SCS的\"控制优先级\"设计需遵循的原则有", "a": ["故障联锁控制优先级高于所有手动控制，确保设备安全", "集控室手动控制优先级低于就地手动，但高于集控室自动", "就地手动控制优先级最高，确保紧急情况下可直接操作设备", "集控室自动控制优先级最低，在无其他操作时执行", "", ""], "r": "ACD", "e": "故障联锁控制是为保障安全，优先级高于其他控制；就地手动在紧急时直接操作设备，优先级最高；集控室手动高于集控室自动；集控室自动在无其他操作时执行，优先级最低。B中集控室手动应高于就地手动说法错误。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308949", "t": 2, "q": "火电厂SCS的\"控制指令\"的类型包括", "a": ["停止指令:控制设备从\"开\"到\"停\"", "复位指令:清除设备故障状态或报警信号", "启动指令:控制设备从\"停\"到\"开\"", "紧急停机指令:设备故障时强制停止", "", ""], "r": "ABCD", "e": "火电厂SCS（顺序控制系统）中，停止指令让设备从运行到停止，复位指令可清除故障或报警，启动指令使设备从停止到运行，紧急停机指令在设备故障时强制停止设备，ABCD选项均是控制指令类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308950", "t": 2, "q": "火电厂SCS的\"联锁解除\"的管理要求包括", "a": ["联锁解除需记录，包括解除时间、原因、操作人员", "联锁解除需授权，仅值班人员或维护人员可操作", "联锁解除后需加强监控，避免设备异常", "联锁解除后可长期保持，无需恢复", "", ""], "r": "ABC", "e": "联锁解除要记录、授权，解除后加强监控且不能长期保持，需及时恢复。D选项错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308951", "t": 2, "q": "火电厂SCS的\"联锁逻辑修改\"的流程包括", "a": ["申请:提交修改申请，说明修改原因、内容", "执行:在未经审核的情况下直接修改并投入运行", "测试:修改后进行离线或在线测试，验证逻辑正确性", "审核:由技术人员对修改方案的合理性及安全性进行审核", "", ""], "r": "ACD", "e": "答案：ACD火电厂 SCS 的“联锁逻辑修改”流程通常需要先申请（说明修改原因和内容），然后由技术人员审核修改方案的合理性和安全性，审核通过后进行修改并进行测试（离线或在线）以验证逻辑正确性，而不能在未经审核的情况下就直接修改并投入运行，所以 B 选项错误，ACD 正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308952", "t": 2, "q": "火电厂SCS的\"日常维护\"内容包括", "a": ["检查接线:紧固松动端子，检查线缆老化", "清洁PLC柜:去除灰尘，检查散热", "测试联锁功能:定期模拟联锁条件，验证动作正确", "无需维护，系统稳定运行", "", ""], "r": "ABC", "e": "火电厂SCS系统需要日常维护，D选项错误。A选项检查接线、B选项清洁PLC柜、C选项测试联锁功能都是常见的日常维护内容。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308953", "t": 2, "q": "火电厂SCS的\"事件记录\"功能需记录的内容包括", "a": ["操作员操作记录:如操作员登录/退出时间、操作内容", "设备状态记录:如设备从\"停\"到\"开\"的状态变化时间、原因", "故障记录:如故障发生时间、故障类型（CPU故障、I/O故障）", "控制指令记录:如启动/停止指令的发送时间、发送来源（手动/自动）", "", ""], "r": "ABCD", "e": "火电厂SCS（顺序控制系统）的“事件记录”要全面记录与系统运行相关重要信息，ABCD选项涵盖了人员操作、设备状态、故障情况和控制指令等关键方面。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308954", "t": 2, "q": "火电厂SCS的\"手动/自动切换\"需满足的条件包括", "a": ["切换后，之前的控制指令自动失效，需重新发送", "自动切手动:无强制条件，可直接切换，但需确保切换平稳", "切换过程中，被控设备的状态应保持不变，无突变", "手动切自动:需被控设备无故障、反馈信号正常、参数在允许范围", "", ""], "r": "BCD", "e": "火电厂SCS手动/自动切换时，要保证被控设备状态稳定无突变，自动切手动无强制条件但要平稳，手动切自动需设备无故障等条件，且切换后原指令一般不会自动失效。答案为BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308955", "t": 2, "q": "火电厂SCS的\"性能指标\"包括", "a": ["可靠性: 平均无故障时间（MTBF）长，故障少", "准确性: 控制动作与设定逻辑一致，无误动作", "可维护性: 故障易排查，模块易更换", "响应速度: 控制指令和联锁动作的执行时间短", "", ""], "r": "ABCD", "e": "火电厂SCS（顺序控制系统）的性能指标涵盖可靠性、准确性、可维护性和响应速度等方面，ABCD选项分别从不同维度体现了这些指标。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308956", "t": 2, "q": "火电厂SCS中，“冗余设计”的实现方式包括", "a": ["双I/O模块（同一信号接入两个I/O模块，故障时切换）", "双电源模块（主备供电，防止断电）", "双通信链路（如以太网、Profibus，故障时切换）", "双CPU模块（主备切换，故障时备机投入）", "", ""], "r": "ABCD", "e": "冗余设计是为提高系统可靠性，采用多重备份方式。ABCD选项分别从I/O模块、电源模块、通信链路、CPU模块方面进行双备份，故障时可切换，都属于“冗余设计”实现方式。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308957", "t": 2, "q": "开关量变送器的\"回差\"的作用有", "a": ["延长变送器的使用寿命（减少动作次数）", "防止被控量在动作值附近小幅波动导致变送器频繁动作（如压力小幅波动）", "简化变送器的结构", "提高变送器的测量精度", "", ""], "r": "AB", "e": "回差可避免被控量在动作值附近小范围波动时变送器频繁动作，减少动作次数也能在一定程度延长使用寿命。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308958", "t": 2, "q": "开关量变送器的\"精度等级\"与\"回差\"的关系是", "a": ["精度等级越高，回差越小", "精度等级反映变送器测量值与真实值的误差，回差反映动作值与复位值的差值", "精度等级与回差无直接必然联系，需分别考量", "精度等级和回差均是变送器的重要技术指标，共同影响控制效果", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308959", "t": 2, "q": "开关量变送器的\"输出故障\"的表现包括", "a": ["无输出信号:如干接点始终断开，无通断动作", "输出信号不稳定:如通断频繁，无规律", "输出信号常通:如干接点始终闭合，无法断开", "输出信号与被控量一致:正常状态，非故障", "", ""], "r": "ABC", "e": "输出故障指输出不符合正常要求，A无输出、B不稳定、C常通都属于故障情况，而D输出与被控量一致是正常状态不是故障。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308960", "t": 2, "q": "开关量变送器的\"输出信号\"需满足的要求包括", "a": ["输出信号的电压/电流范围在PLC输入模块的允许范围内", "与PLC输入模块的信号类型匹配（如干接点匹配数字量输入）", "输出信号可同时接入多个PLC输入模块，实现冗余", "输出信号的响应时间满足控制要求，无过大延迟", "", ""], "r": "ABD", "e": "开关量变送器输出信号要能被PLC接收和处理，需电压/电流范围在PLC输入模块允许范围，信号类型匹配，响应时间满足控制要求；而通常不强调输出信号同时接入多个PLC输入模块实现冗余。答案选ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308961", "t": 2, "q": "开关量变送器的\"维护\"内容包括", "a": ["定期更换变送器，无需检查", "定期检查接线，防止松动或腐蚀", "定期清洁变送器外壳，去除灰尘和杂物", "定期校准动作值和复位值，确保精度", "", ""], "r": "BCD", "e": "开关量变送器维护需保证接线可靠、设备清洁、动作准确。A选项只换不查不合理；B检查接线可防故障；C清洁外壳利于设备稳定；D校准动作和复位值保证精度。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308962", "t": 2, "q": "开关量变送器的\"响应时间\"过大会导致的问题包括", "a": ["与其他设备的动作时序不匹配，导致控制逻辑混乱", "被控设备频繁动作，影响使用寿命", "测量精度降低，误差增大", "控制动作延迟，无法及时响应被控量变化（如压力超限时，变送器未及时输出信号）", "", ""], "r": "AD", "e": "响应时间过大意味着信号传输和处理慢。A选项中与其他设备动作时序不匹配、D选项控制动作延迟无法及时响应，都符合响应时间大的影响；B选项被控设备频繁动作和响应时间大无关；C选项响应时间和测量精度无直接关联。所以答案选AD。答案：AD", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308963", "t": 2, "q": "开关量变送器的\"选型误区\"包括", "a": ["考虑测量对象，选择对应类型变送器", "不匹配输出方式与PLC输入模块（如干接点变送器接模拟量输入）", "不考虑现场环境，选择通用型变送器（如高温环境用普通变送器）", "不考虑回差，导致变送器频繁动作", "", ""], "r": "BCD", "e": "A选项是正确的选型做法，而B、C、D选项都是选型时易陷入的错误情况。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308964", "t": 2, "q": "开关量变送器的选型需考虑的因素包括", "a": ["动作值与复位值（回差），避免频繁动作", "现场环境（如高温、潮湿，选择对应防护等级）", "测量对象（如压力、温度、液位，选择对应类型变送器）", "输出方式（如干接点、直流电压，匹配PLC输入模块）", "", ""], "r": "ABCD", "e": "开关量变送器选型要综合多方面因素，动作值与复位值影响工作稳定性，现场环境决定防护等级，测量对象对应合适类型，输出方式需与PLC匹配。ABCD选项均是选型需考虑因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308965", "t": 2, "q": "开关量变送器的主要技术参数包括", "a": ["输出方式（如干接点、24V DC）", "动作值与复位值（回差）", "测量范围（如压力0-1MPa，温度0-100℃）", "防护等级（如IP65）", "", ""], "r": "ABD", "e": "开关量变送器的主要技术参数通常涉及其输出方式、动作与复位特性以及防护等级，而不直接涉及具体的测量范围，因为开关量变送器主要用于检测状态而非连续量的测量。以下是对各选项的简要分析：A. 输出方式是开关量变送器的关键参数，它决定了变送器如何输出信号，如干接点或24V DC等，这是必要的技术参数。B. 动作值与复位值（回差）描述了变送器在何种条件下动作以及复位，这是评估变送器性能的重要指标。C. 测量范围通常用于连续量测量仪表，如压力变送器或温度变送器。对于开关量变送器，它更多地是检测一个阈值而不是连续的范围，因此这不是其主要技术参数。D. 防护等级描述了变送器对外部环境的抵抗能力，如防尘防水等级，这对于确保变送器在恶劣环境中可靠工作至关重要。综上所述，开关量变送器的主要技术参数不包括具体的测量范围（C选项），而包括输出方式（A）、动作值与复位值（B）以及防护等级（D）。所以，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308966", "t": 2, "q": "开关量继电器控制回路中，“自锁”与“互锁”的区别在于", "a": ["自锁通过继电器常开辅助触点实现，互锁通过继电器常闭辅助触点实现", "自锁回路中，停止按钮需串联;互锁回路中，互斥设备的常闭触点需串联在对方线圈回路", "自锁用于保持设备动作状态（如启动后保持通电），互锁用于防止互斥设备同时动作（如正反转接触器）", "自锁和互锁功能完全相同，仅实现方式不同", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308967", "t": 2, "q": "开关量继电器控制回路中，实现\"联锁保护\"功能的常用方式有", "a": ["利用继电器的自锁触点实现联锁", "将联锁条件对应的常开触点并联在被控设备线圈回路（条件满足时接通回路）", "将联锁条件对应的常闭触点串联在被控设备线圈回路（条件不满足时切断回路）", "采用\"三取二\"逻辑（三个信号中两个一致时触发联锁）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308968", "t": 2, "q": "开关量控制的\"双位控制\"的特点有", "a": ["被控量仅在两个设定值（上限、下限）之间波动", "控制器输出只有\"开\"和\"关\"两种状态", "适用于对控制精度要求不高的场合（如水箱液位控制）", "能实现被控量的连续稳定控制", "", ""], "r": "ABC", "e": "双位控制中控制器输出是“开”“关”两种状态，被控量在上下限间波动，适合对精度要求不高的场合，不能实现连续稳定控制。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308969", "t": 2, "q": "开关量控制回路中，“禁止逻辑”的实现方式包括", "a": ["在PLC程序中，用禁止信号的逻辑状态封锁控制指令输出", "通过继电器的互锁触点实现禁止", "将禁止信号的常开触点并联在停止按钮两端，禁止时强制停止", "将禁止信号（如检修信号）的常闭触点串联在控制回路，禁止时切断回路", "", ""], "r": "ABD", "e": "禁止逻辑可在PLC程序中用禁止信号封锁输出，也能通过继电器互锁、串联常闭触点切断回路等方式实现，而C选项并联常开触点在禁止时不能达到禁止目的。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308970", "t": 2, "q": "开关量控制与顺序控制的联系包括", "a": ["顺序控制以开关量控制为基础，依赖开关量信号实现逻辑触发", "开关量控制可独立实现简单控制，顺序控制实现复杂多步控制", "顺序控制的每一步动作通常通过开关量控制实现（如启停设备）", "开关量控制与顺序控制无任何联系，独立运行", "", ""], "r": "ABC", "e": "顺序控制是基于开关量信号来触发逻辑的，其每一步动作常由开关量控制实现，开关量控制能独立完成简单控制，顺序控制用于复杂多步控制，说明二者有紧密联系。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308971", "t": 2, "q": "开关量控制中，\"互锁逻辑\"的常见应用包括", "a": ["风机启停控制: 自锁触点并联在启动按钮两端", "水泵启停控制: 启动按钮常开触点串入停止按钮常闭触点", "电机正反转控制: 正转接触器常闭触点串入反转线圈，防止同时吸合", "阀门开关控制: 开阀接触器常闭触点串入关阀线圈，防止同时动作", "", ""], "r": "CD", "e": "互锁逻辑是为防止两个设备同时动作而设。A项是自锁逻辑；B项表述不是互锁；C和D选项都是通过常闭触点串入对方线圈，防止同时吸合或动作，属于互锁逻辑。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308972", "t": 2, "q": "开关量控制中，\"联锁逻辑\"的设计原则包括", "a": ["联锁逻辑需考虑所有可能的故障场景，确保无遗漏", "联锁逻辑应具有一定的灵活性，但不可随意修改以适应不同运行工况", "联锁动作需迅速，避免延误导致设备损坏", "联锁逻辑需简洁明了，避免复杂嵌套，便于调试和维护", "", ""], "r": "ACD", "e": "A要考虑故障场景避免遗漏保障安全；B联锁逻辑可根据运行工况合理修改；C迅速动作能防止设备受损；D简洁便于调试维护。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308973", "t": 2, "q": "开关量控制中，“逻辑错误”的常见类型包括", "a": ["联锁条件遗漏（如未考虑设备故障信号，导致联锁失效）", "触点接反（如常开触点误接为常闭触点，导致逻辑相反）", "定时器时间设定错误（如设定10秒误设为100秒，导致动作延迟）", "线圈编号重复（如两个线圈用同一编号，导致动作冲突）", "", ""], "r": "ABCD", "e": "ABCD选项均是开关量控制中“逻辑错误”的常见类型。A选项联锁条件遗漏会使控制逻辑不完整；B选项触点接反会使原本逻辑关系改变；C选项定时器时间设置错误影响动作时间，产生延迟；D选项线圈编号重复会引发动作冲突。答案是ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308974", "t": 2, "q": "开关量控制中，\"脉冲控制\"的应用场景包括", "a": ["电机的连续运行控制（输出持续高电平）", "报警灯的闪烁控制（周期性脉冲，使灯闪烁）", "计数器的计数触发（每一个脉冲触发一次计数）", "火电厂阀门的单次开关控制（输出短暂脉冲，避免阀门长时间带电）", "", ""], "r": "BCD", "e": "脉冲控制特点是有间断的信号。A选项电机连续运行需持续高电平，不是脉冲控制；B选项报警灯闪烁靠周期性脉冲实现；C选项计数器靠脉冲触发计数；D选项阀门单次开关用短暂脉冲避免长时间带电。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308975", "t": 2, "q": "开关量控制中，“三取二”逻辑的适用场景包括", "a": ["火电厂锅炉水位保护（三个水位开关，两个检测到低水位时触发停炉）", "引风机故障判断（三个故障信号，两个触发时判定故障）", "汽轮机超速保护（三个转速传感器，两个检测到超速时触发停机）", "简单的照明控制（一个开关控制，无需冗余）", "", ""], "r": "ABC", "e": "“三取二”逻辑是为增加可靠性，取三个信号中两个相同信号作为判断依据。A、B、C选项都涉及重要设备的保护或故障判断，采用“三取二”可避免单个信号误触发，提高可靠性。D选项简单照明控制无需冗余，不适用“三取二”逻辑。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803796093308976", "t": 2, "q": "开关量控制中，“双位控制”与“三位控制”的区别在于", "a": ["双位控制被控量在2个设定值间波动，三位控制被控量在3个设定值间调节", "双位控制无需反馈信号，三位控制需反馈信号", "双位控制输出2种状态（开/关），三位控制输出3种状态（高/中/低或开/停/关）", "双位控制适用于精度要求低的场合，三位控制适用于精度要求稍高的场合", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045696", "t": 3, "q": "功能模块图（FBD）中，信号需从功能块的输入端子流入，从输出端子流出，遵循从左到右的流向。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "功能模块图（FBD）里信号确实从功能块输入端子流入、输出端子流出，且一般遵循从左到右流向。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045697", "t": 3, "q": "功能模块图中，\"RS触发器\"的\"置1端（S）\"和\"复位端（R）\"同时为\"1\"时，输出状态固定为\"1\"，不会出现不确定情况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "RS触发器中，当置1端（S）和复位端（R）同时为“1”时，会出现不确定状态，并非输出固定为“1”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045698", "t": 3, "q": "功能模块图中的\"比较器\"功能块，输出为两个输入值的差值，用于判断数值大小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "比较器通常根据两个输入值大小关系输出特定结果，不是简单输出差值来判断大小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045699", "t": 3, "q": "功能模块图中的\"乘法器\"功能块，可用于计算流量信号与时间信号的乘积，得到累积流量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流量乘以时间可得到累积流量，乘法器功能块能实现两信号相乘，所以该说法合理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045700", "t": 3, "q": "功能模块图中的\"除法器\"功能块，允许除数为零，此时输出为最大限值，不会导致故障。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在数学运算里，除数不能为零，在实际功能模块中，除数为零会引发错误或异常，并非输出最大限值且不导致故障。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045701", "t": 3, "q": "功能模块图中的\"定时器\"功能块，其输入参数包括计时时间设定值、触发信号和复位信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在功能模块图里，定时器功能块通常确实需要计时时间设定值来确定计时时长，触发信号用于启动计时，复位信号用于停止或重置计时。所以该描述是正确的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045702", "t": 3, "q": "功能模块图中的\"加法器\"功能块，用于比较两个输入值的大小，输出逻辑判断结果。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "加法器的功能是进行加法运算，并非比较两个输入值大小并输出逻辑判断结果。", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045703", "t": 3, "q": "功能模块图中的\"取反器\"功能块，输入为\"1\"时输出为\"0\"，输入为\"0\"时输出为\"1\"，实现逻辑非运算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "取反器的作用就是进行逻辑非运算，输入为 1 输出为 0，输入为 0 输出为 1。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045704", "t": 3, "q": "功能模块图中的\"与\"功能块，仅当所有输入均为\"1\"时，输出才为\"1\"，否则为\"0\"。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“与”逻辑的规则就是所有输入都为“1”时输出才为“1”，否则为“0”，功能模块图中的“与”功能块遵循此逻辑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045705", "t": 3, "q": "功能模块图中的\"RS触发器\"具有记忆功能，输出状态不仅与当前输入有关，还与历史状态有关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RS触发器是基本的时序逻辑电路，能存储一位二进制信息，其输出状态由当前输入和历史状态共同决定，有记忆功能。", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045706", "t": 3, "q": "火电厂除氧器系统停止时，应先停止除氧器给水泵，再停止进汽，最后检测压力是否降至安全值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "火电厂除氧器系统停止时，应先停止进汽，再停止除氧器给水泵，最后检测压力是否降至安全值，题干顺序错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045707", "t": 3, "q": "火电厂给水泵运行中，监控的联锁条件包括出口压力低、轴承振动大、电机电流高，不包括入口阀门状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "给水泵运行时，入口阀门状态至关重要，阀门状态异常会影响进水，进而影响泵的正常工作，所以入口阀门状态是需要监控的联锁条件，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045708", "t": 3, "q": "火电厂锅炉燃烧系统的顺序控制启动流程，应遵循\"引风机→送风机→点火→燃料投入\"的顺序。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "火电厂锅炉燃烧系统启动时，先启动引风机建立负压，再启动送风机提供助燃空气，之后点火，最后投入燃料，此启动流程正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045709", "t": 3, "q": "火电厂锅炉水位低至\"低低水位\"时，SCS应触发紧急停炉，防止锅炉干烧损坏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "锅炉水位低至“低低水位”是非常危险的情况，继续运行会导致锅炉干烧，严重损坏设备，所以SCS（顺序控制系统）应触发紧急停炉来保障安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045710", "t": 3, "q": "火电厂凝汽器真空系统中，当真空度低于\"低真空\"阈值时，SCS应立即触发停止汽轮机的联锁动作，确保设备安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在火电厂凝汽器真空系统里，真空度低于“低真空”阈值会威胁设备安全，SCS（顺序控制系统）通常会立即触发停止汽轮机的联锁动作来保障安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045711", "t": 3, "q": "火电厂汽轮机润滑油系统启动前，需先检测润滑油箱油位、油温是否正常，再执行后续启动动作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "润滑油箱油位和油温对汽轮机润滑油系统正常运行至关重要，启动前检测其是否正常是必要步骤，能避免因油位异常或油温不适影响系统及设备。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045712", "t": 3, "q": "火电厂送风机启动前，需确保入口风门和出口风门均处于关闭状态，降低启动负载，保护电机。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045713", "t": 3, "q": "火电厂脱硫系统的顺序控制核心目标包括根据烟气流量自动调节脱硫剂用量，确保脱硫效率达标。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "火电厂脱硫系统顺序控制的核心目标之一就是依据烟气流量自动调节脱硫剂用量，以保障脱硫效率达到标准，这是脱硫系统有效运行的常见要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045714", "t": 3, "q": "火电厂SCS的\"故障自诊断\"功能可检测被控设备的机械故障（如轴承卡涩），无需专用传感器。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "火电厂SCS的“故障自诊断”功能检测被控设备机械故障（如轴承卡涩）通常需要专用传感器来获取相关信息，仅靠SCS自身难以在无专用传感器情况下检测此类故障。", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045715", "t": 3, "q": "火电厂SCS的\"联锁解除\"功能可在任何情况下随意使用，无需授权和记录。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“联锁解除”功能涉及火电厂设备运行安全，不能随意使用，需授权并记录。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045716", "t": 3, "q": "火电厂SCS的\"冗余配置\"包括双CPU、双I/O模块、双被控设备，确保系统无故障运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "火电厂SCS（顺序控制系统）冗余配置一般为双CPU、双I/O模块等，目的是提高系统可靠性和安全性，但不能确保系统无故障运行，因为故障难以完全杜绝。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045717", "t": 3, "q": "火电厂SCS的\"事件记录\"功能可详细记录被控设备的机械磨损程度，为设备维护提供依据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "火电厂SCS（顺序控制系统）的“事件记录”功能主要记录设备的启停状态、故障信息、操作时间等事件，并非记录被控设备的机械磨损程度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045718", "t": 3, "q": "在火电厂SCS（顺序控制系统）的分层控制中，集控室自动控制的优先级高于就地手动控制，确保自动逻辑优先执行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在火电厂SCS分层控制中，就地手动控制优先级高于集控室自动控制，这样能在紧急或特殊情况时让现场人员直接操作设备。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045719", "t": 3, "q": "火电厂SCS的控制优先级从高到低为:就地手动控制→集控室手动控制→集控室自动控制，符合安全操作原则。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在火电厂SCS中，这种控制优先级设置合理，就地手动控制可在紧急等特殊情况直接操作设备，优先级别最高；集控室手动控制次之；集控室自动控制需依赖系统程序，优先级最低，符合安全操作原则。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045720", "t": 3, "q": "火电厂SCS的冗余设计（如双CPU），主要目的是提高系统控制精度，确保被控量稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "火电厂SCS冗余设计（如双CPU）主要目的是提高系统可靠性，当一个CPU出现故障时，另一个能继续工作，而非提高系统控制精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045721", "t": 3, "q": "火电厂SCS的手动/自动切换中，手动切自动时，无需满足任何条件，可直接切换。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "火电厂SCS手动切自动需满足一定条件，如设备状态正常、参数在允许范围等，不能直接切换。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045722", "t": 3, "q": "火电厂SCS的手动控制模式下，操作员可发送任意控制指令，无需满足联锁条件，确保操作灵活。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在火电厂SCS手动控制模式下，操作也需满足联锁条件，并非可发送任意控制指令，否则会引发安全问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045723", "t": 3, "q": "火电厂SCS的自动控制模式下，控制指令仅根据预设逻辑生成，无需参考现场反馈信号。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "火电厂SCS自动控制模式需结合现场反馈信号来调整控制指令，以确保系统稳定运行，并非仅依据预设逻辑生成。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045724", "t": 3, "q": "火电厂SCS控制引风机启动时，启动前需确保引风机出口挡板处于打开状态，以减少启动负载。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "引风机启动前应关闭出口挡板来减少启动负载，而不是打开。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045725", "t": 3, "q": "开关量变送器的\"额定电压\"是指其输出信号的电压等级，与电源电压无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开关量变送器额定电压通常指工作电源电压，并非输出信号电压等级。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045726", "t": 3, "q": "开关量变送器的\"返回误差\"是指变送器动作值与复位值之间的差值，用于衡量变送器的重复性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "开关量变送器的“返回误差”确实是动作值与复位值差值，能反映其重复性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045727", "t": 3, "q": "开关量变送器的\"工作温度范围\"是指其能测量的被控量的温度范围，与环境温度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开关量变送器的“工作温度范围”指的是变送器正常工作时所处的环境温度范围，并非能测量的被控量的温度范围。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045728", "t": 3, "q": "开关量变送器的\"回差\"是指其动作值与复位值之间的差值，可防止被控量小幅波动导致变送器频繁动作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "开关量变送器“回差”就是动作值与复位值差值，设置回差能避免被控量小波动时变送器频繁动作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045729", "t": 3, "q": "开关量变送器的\"精度等级\"是指其输出信号通断状态的准确性，与测量值误差无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开关量变送器精度等级不仅和输出信号通断状态准确性有关，也与测量值误差相关，测量值误差会影响通断状态判断。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045730", "t": 3, "q": "开关量变送器的\"响应时间\"是指变送器从通电到正常输出信号的时间，与被控量变化无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开关量变送器的响应时间是指从输入信号发生变化到输出信号相应变化的时间，和被控量变化有关，并非从通电到正常输出信号的时间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045731", "t": 3, "q": "开关量变送器的防护等级IP65中，第一位数字\"6\"表示防液体侵入的等级，第二位数字\"5\"表示防固体侵入的等级。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "IP防护等级中，第一位数字表示防固体侵入的等级，第二位数字表示防液体侵入的等级，本题说法数字含义弄反。", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045732", "t": 3, "q": "开关量变送器的输出方式包括干接点、直流电压、直流电流和交流电流，可根据现场需求任意选择。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开关量变送器输出通常是干接点等开关信号，直流电压、直流电流和交流电流一般是模拟量信号，并非开关量变送器的输出方式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045733", "t": 3, "q": "开关量变送器能实现对被控设备的连续调节控制，输出为连续变化的模拟量信号。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开关量变送器输出的是开关信号，用于表示设备的通断等两种状态，不能实现对被控设备的连续调节控制，也不会输出连续变化的模拟量信号。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045734", "t": 3, "q": "开关量继电器控制的联锁保护功能，主要通过继电器触点的串并联组合实现逻辑判断。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "开关量继电器控制中，就是利用继电器触点的串并联组合来实现各种逻辑关系，从而达到联锁保护功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045735", "t": 3, "q": "开关量继电器控制回路的\"自锁\"功能，是通过将继电器的常开辅助触点与启动按钮并联实现的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在开关量继电器控制回路中，把继电器常开辅助触点与启动按钮并联，启动按钮按下使继电器得电吸合，常开辅助触点闭合，即使启动按钮松开，由于辅助触点闭合仍能维持继电器通电，这就是“自锁”功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045736", "t": 3, "q": "开关量控制回路的\"互锁\"功能，可防止两个相互排斥的设备同时动作（如电机正反转接触器）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "开关量控制回路中“互锁”就是利用相互制约关系避免相互排斥设备同时动作，电机正反转接触器就需互锁防止同时吸合造成短路。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045737", "t": 3, "q": "开关量控制是顺序控制的核心组成部分，顺序控制需通过开关量信号的按序触发实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "开关量只有开和关两种状态，顺序控制往往依据一系列开关量信号按特定顺序触发来完成，所以开关量控制是顺序控制核心部分。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045738", "t": 3, "q": "开关量控制中的\"保持\"逻辑，可通过继电器自锁、PLC寄存器、顺序功能图的步状态实现，与定时器无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“保持”逻辑可通过继电器自锁、PLC 寄存器、顺序功能图的步状态实现，但定时器也可用于实现保持逻辑，比如利用定时器的延时功能来维持一定时间的状态。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045739", "t": 3, "q": "在开关量控制中的\"禁止逻辑\"，当禁止条件满足时，允许控制指令正常执行，仅发出报警信号。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“禁止逻辑”中，当禁止条件满足时，应禁止控制指令执行，而不是允许其正常执行，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045740", "t": 3, "q": "开关量控制中的\"联锁触发\"优先级高于手动控制，是因为联锁触发为安全保护动作，需优先执行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "联锁触发是为保障系统安全，在特定异常情况时立即动作避免危险，所以优先级高于手动控制。", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045741", "t": 3, "q": "开关量控制中的\"脉冲信号\"控制，输出信号为短暂的\"1\"脉冲，使设备执行单次动作，如阀门单次开关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "脉冲信号是一种短暂的电信号，在开关量控制里，输出短暂“1”脉冲能让设备执行单次动作，像阀门单次开关就符合这种控制情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045742", "t": 3, "q": "开关量控制中的\"三取二\"逻辑，是指三个信号中至少有两个满足时才触发动作，以此来提高系统的可靠性和安全性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045743", "t": 3, "q": "开关量控制中的\"双位控制\"，其被控量能稳定在设定值，输出为连续调节信号。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "双位控制中，被控量不能稳定在设定值，而是在设定值附近波动，且输出是只有两个状态的开关信号，并非连续调节信号，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045744", "t": 3, "q": "开关量控制中的\"延时闭合\"触点，在触发信号为\"1\"时立即闭合，为\"0\"时延迟断开。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“延时闭合”触点是触发信号为“1”时延迟闭合，为“0”时立即断开，题中说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803797318045745", "t": 3, "q": "开关量控制中的\"延时断开\"触点，在触发信号为\"1\"时延迟一段时间闭合，在触发信号为\"0\"时立即断开。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“延时断开”触点是触发信号为“1”时立即闭合，触发信号为“0”时延迟一段时间断开，题干说法错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第8章 顺序控制（2）", "n": "基础练习题【含解析】 / 第8章 顺序控制（2）", "qs": [{"id": "2034803806155444224", "t": 1, "q": "顺序功能图应用于火电厂\"脱硫系统\"时，下列不属于该系统顺序控制的核心目标是", "a": ["确保各设备启动顺序满足工艺要求（如先搅拌后加脱硫剂）", "根据烟气流量自动调节脱硫剂用量（模拟量调节，非顺序控制）", "按步骤启动脱硫泵、搅拌器、吸收塔等设备", "系统故障时按顺序停止设备，保护系统", "", ""], "r": "B", "e": "顺序控制强调按一定顺序执行操作，而模拟量调节是根据变量实时调整，不属于顺序控制。B选项是根据烟气流量自动调节脱硫剂用量，属于模拟量调节。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444225", "t": 1, "q": "顺序功能图中，并行序列的特点是", "a": ["并行序列中只能包含2个并行步", "在转换条件满足后，多个步同时激活，各自独立执行", "并行序列的结束必须依赖同一个转换条件", "多个步只能依次激活，不能同时激活", "", ""], "r": "B", "e": "并行序列是在转换条件满足后，多个步同时激活且各自独立执行。A选项并行序列可包含多个并行步；C选项并行序列结束各分支有各自转换条件；D选项与并行序列特点相悖。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444226", "t": 1, "q": "顺序功能图中，并行序列的合并条件是", "a": ["需合并转换条件满足，与并行分支的步状态无关", "仅需其中一个并行分支的最后一步激活", "无需任何条件，自动合并", "需所有并行分支的最后一步均激活，且合并转换条件满足", "", ""], "r": "D", "e": "并行序列合并时，要所有并行分支最后一步都激活且合并转换条件满足才行。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444227", "t": 1, "q": "顺序功能图中，\"步的编号\"的作用是", "a": ["用于在程序中引用步的状态（如判断步是否激活）", "用于设置步的动作时间", "仅用于图形标识，无实际编程意义", "用于决定步的激活顺序", "", ""], "r": "A", "e": "步的编号可在程序里被引用以判断步是否激活。B选项设置动作时间与编号无关；C选项编号有编程意义；D选项步的激活顺序由转移条件决定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444228", "t": 1, "q": "顺序功能图中，\"步的动作\"的修改方式是", "a": ["需修改转换条件", "直接修改步的编号即可", "需重新绘制整个顺序功能图", "需修改步对应的动作指令（如启动泵、开阀门）", "", ""], "r": "D", "e": "步的动作指步激活时执行的操作，修改步的动作就是修改其对应的动作指令。转换条件与步动作修改无关；仅改步编号不影响动作；也无需重新绘制整个顺序功能图。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444229", "t": 1, "q": "顺序功能图中，\"步的动作\"的执行方式不包括", "a": ["步激活时执行一次，步失活时不执行（单次动作）", "步激活时执行，步失活时继续执行（永久动作）", "步激活时执行，步失活时停止（持续动作）", "步激活时延迟执行，步失活时立即停止（延迟动作）", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444230", "t": 1, "q": "顺序功能图中，\"步的动作\"分为\"立即动作\"和\"延迟动作\"，下列属于\"延迟动作\"的是", "a": ["步激活后，动作持续执行直至步失活", "步激活后，动作仅执行一次", "步激活后，动作立即执行", "步激活后，需等待设定时间才执行动作", "", ""], "r": "D", "e": "延迟动作关键在于有等待设定时间才执行的特点，D选项符合。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444231", "t": 1, "q": "顺序功能图中，\"步的激活\"与\"动作的执行\"的关系是", "a": ["步激活后，动作是否执行与步的状态无关", "步激活后，动作仅执行一次，与步的激活持续时间无关", "步激活后，其所有动作立即执行", "步激活后，仅需满足动作自身的条件（如延迟时间），动作才执行", "", ""], "r": "D", "e": "顺序功能图里，步激活后，动作执行除了步激活，还需满足自身条件（如延迟时间等）。A选项动作执行与步状态有关；B选项动作可能持续执行并非仅一次；C选项不是立即执行，要满足自身条件。所以答案选D。答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444232", "t": 1, "q": "顺序功能图中，\"步的失活\"条件是", "a": ["无需条件，按固定时间失活", "当前步的动作完成且下一步的转换条件满足", "仅当前步的动作完成", "仅下一步的转换条件满足", "", ""], "r": "B", "e": "顺序功能图里，步要失活，需当前步动作完成且下一步的转换条件满足，这样才能进行步的切换。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444233", "t": 1, "q": "顺序功能图中，\"初始步\"的作用是", "a": ["仅用于显示，无实际控制功能", "系统故障时自动跳转的步，用于故障处理", "顺序控制循环的最后一步，用于触发下一轮循环", "系统启动时自动激活的第一步，是顺序控制的起点", "", ""], "r": "D", "e": "初始步是顺序控制开始的标志，系统启动时它会自动激活。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444234", "t": 1, "q": "顺序功能图中，\"初始步的激活条件\"是", "a": ["需系统无任何故障才能激活", "需操作员手动触发激活", "系统上电后自动激活，无需其他条件", "需满足第一个转换条件才能激活", "", ""], "r": "C", "e": "初始步是顺序功能图中程序运行的起始步，系统上电后会自动激活初始步，无需其他额外条件。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444235", "t": 1, "q": "顺序功能图中，\"空步\"的作用是", "a": ["无任何作用，仅用于图形美观", "用于暂停顺序控制流程，等待手动触发", "用于替代故障步，避免系统停机", "用于表示两个转换之间的过渡，无实际动作，但需满足转换条件", "", ""], "r": "D", "e": "顺序功能图里，“空步”主要起过渡作用，在两个转换间无实际动作，但要满足转换条件。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444236", "t": 1, "q": "顺序功能图中，\"选择序列\"的特点是", "a": ["多个分支中，同时满足多个转换条件时，多个分支同时激活", "多个分支中，仅当一个分支的转换条件满足时，该分支激活，其他分支不激活", "选择序列中只能有2个分支", "选择序列的转换条件必须是模拟量信号", "", ""], "r": "B", "e": "选择序列是多个分支中，仅一个分支转换条件满足时该分支激活，其他分支不激活。A选项多个分支同时激活是并行序列特点；C选项选择序列分支数量不限；D选项转换条件不一定是模拟量信号。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444237", "t": 1, "q": "顺序功能图中，\"选择序列的合并\"特点是", "a": ["多个分支合并时，需所有分支的转换条件同时满足", "多个分支合并时，仅需一个分支的转换条件满足", "合并后只能激活一个后续步", "合并后会激活多个后续步", "", ""], "r": "B", "e": "答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444238", "t": 1, "q": "顺序功能图中，\"转换\"的表示方式是", "a": ["用矩形框表示，框内标注转换条件", "用箭头表示，箭头旁标注转换条件", "用圆形表示，圆内标注转换条件", "用线段表示，线段旁标注转换条件", "", ""], "r": "B", "e": "在顺序功能图里，“转换”用箭头表示，且在箭头旁标注转换条件。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444239", "t": 1, "q": "顺序功能图中，\"转换条件\"的表达式不包括下列哪种形式", "a": ["模拟量信号的阈值判断（如AI0.0>50）", "多个开关量信号的逻辑组合（如I0.0=1且I0.1=0）", "单一开关量信号（如I0.0=1）", "程序的扫描周期数", "", ""], "r": "D", "e": "顺序功能图转换条件通常基于信号状态判断，扫描周期数不是常见转换条件形式。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444240", "t": 1, "q": "梯形图编程中，\"定时器\"的工作原理是", "a": ["无需触发信号，通电后立即开始持续计时", "触发信号为\"1\"时开始计时，计时时间到后输出变为\"1\";触发信号为\"0\"时，计时复位", "计时时间仅由硬件决定，无法通过程序设置", "仅在触发信号为\"1\"时，开始计时，计时时间到后输出状态不变", "", ""], "r": "B", "e": "梯形图中定时器触发信号为“1”时开始计时，计时时间到输出变为“1”，触发信号为“0”时计时复位。A选项需触发信号才计时；C选项计时时间可通过程序设置；D选项计时到输出状态会改变。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444241", "t": 1, "q": "梯形图编程中，下列关于\"线圈\"的编程规则，正确的是", "a": ["线圈可以直接接在左侧母线处", "同一编号的线圈在同一梯形图程序中可以出现多次", "线圈可以与其他线圈串联连接", "线圈只能接在梯形图的最右侧，且右侧不能再连接其他元件", "", ""], "r": "D", "e": "在梯形图编程里，线圈不能直接接左侧母线，同一编号线圈一般不能多次出现，线圈不能与其他线圈串联。而线圈只能接在梯形图最右侧，右侧不能再连其他元件。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444242", "t": 1, "q": "梯形图中，并联触点的逻辑关系是", "a": ["任一并联触点闭合时，支路即导通（逻辑或）", "并联触点的数量越多，导通电阻越小", "并联触点的状态与支路导通无关", "所有并联触点均闭合时，支路才导通（逻辑与）", "", ""], "r": "A", "e": "在梯形图里，并联触点遵循“逻辑或”关系，也就是只要任一并联触点闭合，支路就会导通。B选项导通电阻不是梯形图并联触点主要考虑的；C选项触点状态和支路导通有关；D选项描述的是串联触点“逻辑与”关系。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444243", "t": 1, "q": "梯形图中，\"常开触点\"的动作逻辑是", "a": ["无论输入信号状态如何，触点始终闭合", "对应输入信号为\"1\"时，触点断开;为\"0\"时，触点闭合", "无论输入信号状态如何，触点始终断开", "对应输入信号为\"1\"时，触点闭合;为\"0\"时，触点断开", "", ""], "r": "D", "e": "梯形图里常开触点特性是输入信号为“1”即有信号时闭合，输入为“0”无信号时断开。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444244", "t": 1, "q": "梯形图中，\"串联\"触点的逻辑关系是", "a": ["所有串联触点均闭合时，支路才导通（逻辑与）", "任一串联触点闭合时，支路即导通（逻辑或）", "串联触点的数量越多，导通电流越大", "串联触点的状态与支路导通无关", "", ""], "r": "A", "e": "在梯形图里，“串联”触点遵循逻辑与关系，即所有串联触点都闭合，支路才导通。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444245", "t": 1, "q": "梯形图中，\"定时器的复位\"与\"定时器的停止\"的区别是", "a": ["复位和停止均会清除计时值，无区别", "复位和停止均仅暂停计时，保留计时值", "复位会清除计时值，停止仅暂停计时，保留计时值", "复位仅暂停计时，停止会清除计时值", "", ""], "r": "C", "e": "定时器复位会将计时值清零，而停止只是暂停计时，计时值会保留。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444246", "t": 1, "q": "梯形图中，\"复位指令\"对定时器的作用是", "a": ["延长定时器的计时时间", "使定时器立即完成计时，输出变为\"1\"", "暂停定时器计时，保持当前计时值", "清除定时器的当前计时值，使定时器回到初始状态，停止计时", "", ""], "r": "D", "e": "复位指令就是让定时器恢复初始状态，清除当前计时值并停止计时。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444247", "t": 1, "q": "梯形图中，\"计数器\"的计数方式是", "a": ["仅对上升沿（信号从0变1）计数", "可选择对上升沿、下降沿或两者都计数，由程序设置", "对信号的持续高电平计数，高电平时间越长计数越多", "仅对下降沿（信号从1变0）计数", "", ""], "r": "B", "e": "梯形图中计数器计数方式可根据程序设置，能选择对上升沿、下降沿或两者都计数。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444248", "t": 1, "q": "梯形图中，\"计数器的计数\"与\"计数器的累加\"的关系是", "a": ["计数和累加是同一概念，无区别", "累加是计数的一种，计数包括上升沿、下降沿等多种方式", "计数是累加的一种，累加仅指对上升沿计数", "计数是减少数值，累加是增加数值", "", ""], "r": "B", "e": "计数器计数可包含上升沿、下降沿等多种计数方式，累加是计数的一种具体形式。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444249", "t": 1, "q": "梯形图中，\"线圈的并联\"连接方式是", "a": ["线圈并联时，每个线圈需单独串联触点控制", "多个线圈不能并联，只能串联", "多个线圈可直接并联在同一支路上，同时受该支路触点控制", "线圈并联时，必须串联一个公共电阻", "", ""], "r": "C", "e": "在梯形图里，多个线圈可直接并联在同一支路上，能同时受该支路触点控制。A选项说每个线圈单独串联触点控制并非并联特点；B选项多个线圈可以并联；D选项线圈并联无需串联公共电阻。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444250", "t": 1, "q": "梯形图中，\"主控触点\"的作用是", "a": ["控制整个梯形图程序的启动与停止", "控制其下方一组触点的通断，当主控触点闭合时，下方触点才能正常工作", "增加触点的负载能力", "提高触点的通断速度", "", ""], "r": "B", "e": "主控触点用于控制其下方一组触点通断，闭合时下方触点正常工作。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444251", "t": 1, "q": "用顺序功能图描述火电厂\"锅炉给水系统功能组\"时，下列不属于该功能组\"步\"的是", "a": ["给水泵启动指令发送", "给水流量达到设定值保持", "给水阀开到位检测", "系统无故障报警信号", "", ""], "r": "D", "e": "顺序功能图中“步”代表系统的状态，通常是动作或状态的转变。A是启动指令发送动作，B是流量保持状态，C是阀门位置检测状态，都属于“步”。而D系统无故障报警信号是系统的一种条件，并非系统状态的转变，不属于“步”。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444252", "t": 1, "q": "在火电厂顺序控制系统（SCS）的控制原则中，\"分层控制\"的核心是", "a": ["仅在集控室实现所有设备的控制，取消就地控制", "将控制功能按设备类型（如泵、阀、风机）分层，同一类型设备集中控制", "将控制功能按机组负荷（如低负荷、满负荷）分层，不同负荷下采用相同控制逻辑", "将控制功能按控制级别（如就地控制、远方控制、集控室控制）分层，不同级别有明确权限和优先级", "", ""], "r": "D", "e": "分层控制主要是按控制级别分层，明确不同级别（就地、远方、集控室）的权限和优先级。A取消就地控制错误；B按设备类型分层不是分层控制核心；C按机组负荷分层且不同负荷用相同逻辑不符合分层控制概念。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444253", "t": 1, "q": "在开关量控制与顺序控制的关系中，下列说法正确的是", "a": ["顺序控制完全不依赖开关量控制", "开关量控制仅用于简单回路，与复杂的顺序控制无关", "开关量控制是顺序控制的核心组成部分，顺序控制通过按预设逻辑触发开关量信号实现", "顺序控制的逻辑判断不涉及开关量信号的状态变化", "", ""], "r": "C", "e": "顺序控制是按预设逻辑依次执行操作，其实现依赖开关量信号的触发，开关量控制是顺序控制的核心组成部分。A选项顺序控制依赖开关量控制；B选项开关量控制可用于复杂顺序控制；D选项顺序控制逻辑判断涉及开关量信号状态变化。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444254", "t": 1, "q": "在开关量控制中，\"双位控制\"的特点是", "a": ["被控量在两个设定值之间波动，控制器输出仅为\"开\"或\"关\"两种状态", "控制动作延迟时间固定，与被控量变化无关", "被控量能连续稳定在设定值，输出为连续调节信号", "仅根据被控量的上限值触发控制动作，下限值无作用", "", ""], "r": "A", "e": "双位控制是使控制器输出只有“开”“关”两种状态，被控量在两个设定值间波动。B项控制动作延迟与双位控制无关；C项被控量连续稳定及输出连续调节信号不是双位控制特点；D项双位控制上下限值都起作用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444255", "t": 1, "q": "在可编程控制器（PLC）的构成中，负责存储系统程序和用户程序的部件是", "a": ["电源模块", "中央处理单元（CPU）", "存储器模块", "输入/输出（I/O）模块", "", ""], "r": "C", "e": "存储器的功能就是存储数据和程序，在PLC里存储系统程序和用户程序的就是存储器模块。电源模块提供电力；CPU是核心运算控制；I/O模块负责输入输出信号。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444256", "t": 1, "q": "PLC的\"存储器\"中，\"系统程序存储器\"的特点是", "a": ["断电后数据会丢失", "用户可修改其中的程序", "用于存储用户编写的控制程序", "由PLC厂家固化，存储系统运行所需的程序（如指令解释程序），用户不可修改", "", ""], "r": "D", "e": "系统程序存储器由厂家固化，存系统运行程序，用户不能改。A选项，断电数据不丢；B选项，用户不能修改；C选项，存储系统程序非用户编写的控制程序。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444257", "t": 1, "q": "PLC的\"输出刷新阶段\"的作用是", "a": ["执行用户程序，计算输出结果", "存储用户程序到存储器", "将输出映像区的状态（如Q0.0=1）输出到现场输出设备（如接触器）", "读取输入映像区的状态", "", ""], "r": "C", "e": "输出刷新阶段就是把输出映像区状态输出到现场输出设备。A是程序执行阶段作用；B存储程序和此阶段无关；D是输入采样阶段作用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444258", "t": 1, "q": "PLC的\"输入采样阶段\"的作用是", "a": ["将现场输入设备的状态（如开关闭合/断开）读入PLC的输入映像区", "执行用户程序中的逻辑运算", "将用户程序从存储器读入CPU", "将输出映像区的状态输出到现场设备", "", ""], "r": "A", "e": "输入采样阶段就是把现场输入设备状态读进PLC输入映像区。B是程序执行阶段作用；C不是输入采样阶段任务；D是输出刷新阶段作用。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444259", "t": 1, "q": "PLC的扫描周期主要由下列哪项决定", "a": ["电源模块的输出电压", "输入/输出模块的数量", "存储器的容量大小", "用户程序的长度和复杂程度", "", ""], "r": "D", "e": "PLC扫描周期受用户程序影响大，程序越长、越复杂，扫描时间就越长。而电源模块输出电压、输入输出模块数量、存储器容量对扫描周期影响小。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444260", "t": 1, "q": "PLC的输出模块选型中，若被控设备为交流接触器（220V AC），应选择的输出模块类型是", "a": ["以上三种均可", "晶体管输出型", "晶闸管输出型", "继电器输出型", "", ""], "r": "D", "e": "继电器输出型适用于交直流负载，晶闸管输出型适用于交流负载，晶体管输出型一般用于直流负载。被控设备为220V AC交流接触器，继电器输出型和晶闸管输出型都可行，但继电器输出应用更广泛。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444261", "t": 1, "q": "PLC的输出模块中，\"继电器输出\"与\"晶体管输出\"的主要区别是", "a": ["继电器输出的寿命比晶体管输出短（有机械触点磨损）", "继电器输出的负载能力比晶体管输出小", "继电器输出的响应速度比晶体管输出快", "继电器输出只能驱动直流负载，晶体管输出只能驱动交流负载", "", ""], "r": "A", "e": "继电器有机械触点，会有磨损，寿命相对短；继电器输出负载能力大，响应速度慢，可驱动交直流负载，晶体管输出响应快，一般用于驱动直流负载。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444262", "t": 1, "q": "PLC的输入模块中，“光电隔离”的主要作用是", "a": ["降低输入模块的功耗", "提高输入信号的灵敏度", "防止现场强电干扰信号进入PLC内部，保护CPU等核心部件", "增加输入信号的传输距离", "", ""], "r": "C", "e": "光电隔离利用光作为媒介传输信号，能阻断电气连接，避免现场强电干扰信号进入PLC内部，保护CPU等核心部件。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444263", "t": 1, "q": "PLC的用户程序下载到PLC后，若需修改程序，下列操作正确的是", "a": ["无需切换状态，修改后直接下载覆盖", "需先将PLC切换到停止状态，修改后下载，再切换到运行状态", "只能重新编写程序，不能修改原有程序", "直接在PLC运行状态下修改", "", ""], "r": "B", "e": "修改PLC已下载程序时，为避免运行中修改引发异常，需先将PLC切换到停止状态，修改后下载，再切换回运行状态。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444264", "t": 1, "q": "PLC的用户程序中，\"中断程序\"的执行时机是", "a": ["与主程序同时并行执行", "仅在用户手动触发时执行", "仅在主程序执行完一次循环后执行", "在触发中断事件（如外部信号、定时器溢出）发生时，暂停主程序，优先执行中断程序", "", ""], "r": "D", "e": "PLC中断程序是在触发中断事件（像外部信号、定时器溢出）出现时，会暂停主程序，优先执行中断程序。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444265", "t": 1, "q": "PLC的用户程序中，下列关于\"子程序\"的说法正确的是", "a": ["子程序调用需满足特定条件（如触点触发），调用时执行子程序内容，执行完返回主程序", "子程序执行时，主程序暂停运行，子程序执行完毕后主程序继续从断点处运行", "子程序只能被主程序调用一次，不能重复调用", "子程序无需定义，可直接在主程序中编写", "", ""], "r": "A", "e": "子程序调用通常需特定条件触发，调用时执行子程序内容，完后返回主程序；子程序执行时主程序不停，可重复调用且需先定义。B选项主程序不暂停，C选项可重复调用，D选项需先定义。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444266", "t": 1, "q": "PLC的CPU在执行用户程序时，采用的工作方式是", "a": ["单步执行方式，需手动触发每一步执行", "中断优先方式，仅在中断触发时执行程序", "随机执行方式，无固定顺序", "连续循环扫描方式", "", ""], "r": "D", "e": "PLC的CPU执行用户程序是按连续循环扫描方式工作，不断循环扫描输入采样、程序执行、输出刷新等阶段。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444267", "t": 1, "q": "PLC的I/O地址分配中，若输入信号为\"引风机故障信号\"，合理的地址分配是", "a": ["随机分配在未使用的地址即可，无需分类", "与引风机启动指令的输出地址分配在同一区域", "与其他风机的故障信号地址集中分配在同一区域", "分配在输出地址区域（如Q区）", "", ""], "r": "C", "e": "输入信号应分配在输入地址区域，且为便于管理和维护，同类信号应集中分配。引风机故障信号是输入信号，应和其他风机故障信号这类同类信号集中分配。A不分类不合理；B输入和输出地址不应混；D应在输入区非输出区。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444268", "t": 1, "q": "PLC的I/O点数确定后，进行地址分配时，下列原则错误的是", "a": ["故障信号、紧急停止信号的I/O地址应单独分配，便于快速定位", "同类设备的I/O地址应尽量集中分配，便于编程和维护", "输入地址和输出地址可随意混合分配，无需区分", "需预留一定的备用地址，用于后期设备扩展", "", ""], "r": "C", "e": "PLC地址分配时，输入和输出地址必须区分，不能随意混合分配，A、B、D选项的原则都是正确的。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444269", "t": 1, "q": "PLC的I/O设计中，\"数字量I/O\"与\"模拟量I/O\"的主要区别是", "a": ["数字量I/O的精度高于模拟量I/O", "数字量I/O处理连续信号，模拟量I/O处理通/断信号", "数字量I/O的传输距离短于模拟量I/O", "数字量I/O仅处理通/断信号（0/1），模拟量I/O处理连续变化的信号（如4-20mA）", "", ""], "r": "D", "e": "数字量I/O是处理通/断这类离散信号（用0/1表示），模拟量I/O处理像4 - 20mA这种连续变化的信号。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444270", "t": 1, "q": "PLC的I/O设计中，若输出信号需控制\"大功率加热器\"（如10kW），应采取的措施是", "a": ["通过继电器或接触器转接，PLC输出模块控制继电器线圈，继电器触点驱动加热器", "提高PLC输出模块的供电电压", "直接用PLC输出模块驱动加热器", "减少PLC输出模块的其他负载", "", ""], "r": "A", "e": "PLC输出模块功率通常较小，难以直接驱动大功率加热器，通过继电器或接触器转接，利用PLC控制继电器线圈，再由继电器触点驱动加热器是常用做法。提高供电电压、直接驱动、减少其他负载都不能从根本上解决驱动大功率负载问题。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444271", "t": 1, "q": "PLC的I/O设计中，若输入信号为\"紧急停止按钮\"，应采用的接线方式是", "a": ["既可常开也可常闭，无区别", "常开触点接线（按钮按下时输入为\"1\"）", "常闭触点接线（按钮按下时输入为\"0\"）", "需同时接入常开和常闭触点", "", ""], "r": "C", "e": "“紧急停止按钮”采用常闭触点接线，按下按钮时电路断开输入为“0”，能确保在紧急情况有效切断控制，保障安全。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444272", "t": 1, "q": "PLC的I/O设计中，若现场设备与PLC的距离较远（如100米），选择输入模块时应优先考虑", "a": ["高灵敏度输入模块", "具有信号放大功能的输入模块", "低功耗输入模块", "高防护等级输入模块", "", ""], "r": "B", "e": "距离远信号易衰减，具有信号放大功能的输入模块可补偿信号损失。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444273", "t": 1, "q": "PLC的I/O设计中，输出模块的负载能力是指", "a": ["输出模块能连接的最大输入点数", "输出模块能承受的最大输入信号电压", "输出模块能驱动的最大负载电流或功率", "输出模块能传输的最大信号距离", "", ""], "r": "C", "e": "负载能力主要指输出模块驱动负载的能力，即能驱动的最大负载电流或功率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803806155444274", "t": 1, "q": "PLC的I/O设计中，下列关于输入模块选型的考虑因素，错误的是", "a": ["需考虑输入信号的电压等级（如24V DC、220V AC）", "根据输入信号类型（如直流、交流）选择对应模块", "需考虑现场环境（如高温、潮湿）对模块防护等级的要求", "无需考虑输入点数冗余，按实际需求选择即可", "", ""], "r": "D", "e": "在PLC的I/O设计中，为应对未来可能的扩展需求，输入点数通常需要有一定冗余，不能仅按实际需求选择。A、B、C选项都是输入模块选型需考虑的因素。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435456", "t": 2, "q": "开关量控制中，\"延时控制\"的实现方式包括", "a": ["利用接触器的自锁触点", "利用RC电路（电阻电容组成的延时电路）", "利用PLC的定时器指令（如TON、TOF）", "利用继电器延时触点（如延时闭合、延时断开触点）", "", ""], "r": "BCD", "e": "A选项接触器自锁触点用于保持电路通电，非延时控制。B选项RC电路可通过电容充放电实现延时。C选项PLC定时器指令能方便设置延时。D选项继电器延时触点本身就具备延时功能。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435457", "t": 2, "q": "可编程控制器（PLC）的核心构成部件包括", "a": ["输入/输出（I/O）模块", "电源模块", "存储器模块（系统程序、用户程序）", "中央处理单元（CPU）", "", ""], "r": "ACD", "e": "可编程控制器（PLC）的核心构成部件主要包括中央处理单元（CPU）、存储器模块以及输入/输出（I/O）模块。电源模块虽然也是PLC的重要组成部分，但它不属于核心构成部件。* CPU是PLC的大脑，负责执行程序指令和处理数据。* 存储器模块用于存储系统程序和用户程序，是PLC运行的基础。* I/O模块负责与外部设备进行数据交换，是PLC与外界沟通的桥梁。综上所述，可编程控制器（PLC）的核心构成部件包括输入/输出（I/O）模块、存储器模块（系统程序、用户程序）和中央处理单元（CPU）。因此，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435458", "t": 2, "q": "顺序功能图（SFC）的基本组成部分包括", "a": ["动作（步激活时执行的操作，如启动泵、开阀门）", "初始步（系统启动时自动激活的第一步）", "步（表示控制状态或动作阶段，用矩形框表示）", "转换（连接步的箭头，标注触发条件）", "", ""], "r": "ABCD", "e": "顺序功能图（SFC）由步、初始步、动作、转换等组成，ABCD选项分别对应了其基本组成部分的不同方面。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435459", "t": 2, "q": "顺序功能图中，并行序列的特点有", "a": ["并行序列的结束需所有分支的最后一步均激活，且合并转换条件满足", "并行序列中可以包含两个或更多并行分支", "各并行分支的步独立执行，互不影响", "转换条件满足后，多个步同时激活", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435460", "t": 2, "q": "顺序功能图中，并行序列的合并条件包括", "a": ["无需合并转换条件，自动合并", "合并转换条件满足（如所有分支动作完成）", "所有并行分支的最后一步均处于激活状态", "至少一个并行分支的最后一步处于激活状态", "", ""], "r": "BC", "e": "并行序列合并需满足合并转换条件，且所有并行分支的最后一步均要处于激活状态。A选项自动合并错误；D选项至少一个不满足要求。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435461", "t": 2, "q": "顺序功能图中，并行序列的应用场景包括", "a": ["火电厂锅炉启动:同时启动引风机和送风机（并行）", "风机控制:先启动风机，再开出口挡板（顺序）", "脱硫系统运行:同时运行工艺水泵和搅拌器（并行）", "给水泵控制:启动#1给水泵后，再启动#2给水泵（顺序）", "", ""], "r": "AC", "e": "并行序列是指多个动作同时进行。A选项火电厂锅炉启动时引风机和送风机同时启动，C选项脱硫系统运行时工艺水泵和搅拌器同时运行，都属于并行情况；B选项先启动风机再开出口挡板、D选项启动#1给水泵后再启动#2给水泵是顺序动作。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435462", "t": 2, "q": "顺序功能图中，\"步的编号\"的设计原则包括", "a": ["步的编号需唯一，不可重复", "步的编号可随意设定，无需规律", "步的编号可按控制顺序递增，便于程序阅读", "初始步的编号通常从0或1开始，便于识别", "", ""], "r": "ACD", "e": "步的编号要唯一，按控制顺序递增利于程序阅读，初始步编号常从0或1开始方便识别，不能随意无规律设定。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435463", "t": 2, "q": "顺序功能图中，\"步的动作\"的类型包括", "a": ["永久动作:步激活时执行，步失活后仍持续执行（如报警灯常亮）", "单次动作:步激活时仅执行一次，步失活时不重复（如阀门开指令）", "持续动作:步激活时执行，步失活时停止（如泵运行）", "延迟动作:步激活后，延迟设定时间再执行（如延迟开阀门）", "", ""], "r": "ABCD", "e": "顺序功能图中步的动作有多种类型，ABCD选项分别涵盖了永久、单次、持续、延迟这几种常见动作类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435464", "t": 2, "q": "顺序功能图中，\"步的动作的修改\"方式包括", "a": ["修改动作的执行条件（如增加延时时间、增加联锁条件）", "修改步对应的输出指令（如将Q0.0改为Q0.1，更换控制设备）", "增加或删除步的动作（如增加报警动作、删除冗余动作）", "通过修改步的编号来直接实现动作修改", "", ""], "r": "ABC", "e": "步的动作修改可从执行条件、输出指令、增减动作等方面进行，而修改步编号不能直接实现动作修改。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435465", "t": 2, "q": "顺序功能图中，\"步的激活异常\"的原因包括", "a": ["转换条件故障: 如传感器故障，导致条件无法满足", "前一步未失活: 前一步持续激活，使得当前步无法激活", "初始步未激活: 系统上电后初始步未能正常激活，流程因此无法启动", "步的动作冲突: 例如两个步骤试图控制同一设备，造成动作上的冲突", "", ""], "r": "ABCD", "e": "ABCD选项均会造成“步的激活异常”，A中转换条件故障使步激活所需条件不满足；B前一步未失活会阻碍当前步激活；C初始步未激活流程无法启动；D步的动作冲突会干扰步的正常激活。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435466", "t": 2, "q": "顺序功能图中，“步的激活与失活”的规律包括", "a": ["多个并行步可同时激活，独立执行", "当前步激活且下一步转换条件满足时，当前步失活", "前一步激活且转换条件满足时，当前步激活", "选择序列中，多个分支的步可同时激活", "", ""], "r": "ABC", "e": "顺序功能图中，并行步可同时激活独立执行；前一步激活且转换条件满足，当前步激活；当前步激活且下一步转换条件满足，当前步失活。而选择序列中多个分支步只能激活一个。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435467", "t": 2, "q": "顺序功能图中，\"初始步\"的设计要求包括", "a": ["初始步可包含必要的初始化动作（如阀门复位、参数清零）", "一个顺序功能图中只能有一个初始步", "初始步无需转换条件即可激活", "系统上电或复位后自动激活，是控制流程的起点", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435468", "t": 2, "q": "顺序功能图中，\"复杂流程的简化\"方法包括", "a": ["使用选择序列，避免流程分支过多", "使用并行序列，减少流程步骤", "将重复的动作序列编写为子序列，通过转换条件调用", "增加空步，简化转换条件", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435469", "t": 2, "q": "顺序功能图中，\"空步\"的应用场景包括", "a": ["仅用于美化图形，无实际功能", "用于两个转换之间的逻辑过渡，避免转换条件过于复杂", "用于故障处理流程中，等待故障确认信号", "用于分隔不同的控制阶段（如启动阶段与运行阶段之间）", "", ""], "r": "BCD", "e": "答案：BCD“空步”在顺序功能图中不执行任何操作，但起到辅助作用。B 选项，能避免转换条件过于复杂，实现逻辑过渡。C 选项，在故障处理流程中可等待确认信号。D 选项，可用于不同控制阶段的分隔。A 选项说仅用于美化图形无实际功能是错误的，“空步”有实际的应用作用，并非仅仅是为了美化图形。", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435470", "t": 2, "q": "顺序功能图中，\"选择序列\"的应用场景包括", "a": ["引风机启动:必须先启动引风机A，再启动引风机B（顺序执行）", "脱硫系统运行:可选择石膏脱水系统投入或不投入（二选一）", "锅炉给水调节:可选择自动调节或手动调节（二选一）", "火电厂给水泵启动:可选择启动#1给水泵或#2给水泵（二选一）", "", ""], "r": "BCD", "e": "选择序列是在多个分支中选其一执行。A是顺序执行，不是选择；B、C、D都是在多个选项中进行二选一，属于选择序列应用场景。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435471", "t": 2, "q": "顺序功能图中，\"转换条件\"的构成形式包括", "a": ["多个开关量信号的逻辑组合（如I0.0=1且I0.1=0，与逻辑）", "单一开关量信号（如I0.0=1，表示某个阀门开到位）", "定时器或计数器的状态（如T37=1，表示计时时间到）", "模拟量信号的阈值判断（如AI0.0>80，表示温度超上限）", "", ""], "r": "ABCD", "e": "顺序功能图中转换条件构成形式多样，单一开关量信号、多个开关量信号逻辑组合、定时器或计数器状态、模拟量信号阈值判断都可作为转换条件。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435472", "t": 2, "q": "顺序功能图中，\"转换条件不满足\"的原因包括", "a": ["传感器故障:如开关量传感器未触发，无信号输入", "转换条件的信号断线:如信号线断路，无信号输入", "逻辑组合错误:如与逻辑误设为或逻辑，条件无法满足", "前一步未激活:转换条件需前一步激活才能生效", "", ""], "r": "ABCD", "e": "ABCD选项所描述的情况都会导致“转换条件不满足”。传感器故障、信号断线会使无信号输入，无法满足转换条件；逻辑组合错误会造成条件设置不合理而无法满足；前一步未激活，转换条件生效前提缺失也会不满足。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435473", "t": 2, "q": "顺序功能图中，\"转换条件的触发方式\"包括", "a": ["下降沿触发:信号从1变0时触发（如按钮松开瞬间）", "上升沿触发:信号从0变1时触发（如按钮按下瞬间）", "无触发方式，自动触发", "电平触发:信号保持1状态时持续触发", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435474", "t": 2, "q": "顺序功能图中，\"转换条件的逻辑组合\"可采用的逻辑关系包括", "a": ["异或逻辑: 两个条件不同时满足（如I0.0=1且I0.1=0，或I0.0=0且I0.1=1）", "非逻辑: 条件不满足时触发（如I0.0=0）", "与逻辑: 多个条件同时满足（如I0.0=1且I0.1=1）", "或逻辑: 多个条件任一满足（如I0.0=1或I0.1=1）", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435475", "t": 2, "q": "顺序功能图中，\"转换条件的优先级\"的设计原则包括", "a": ["正常运行转换条件优先级相同，按程序顺序执行", "紧急停止转换条件优先级最高，可中断任何其他转换", "在设计时需要考虑转换条件的优先级，不能仅按触发顺序执行", "故障转换条件优先级高于正常运行转换条件（如故障时优先切换到故障步）", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435476", "t": 2, "q": "梯形图编程中，下列属于合法编程规则的有", "a": ["线圈可直接接在左侧母线处", "线圈只能接在梯形图最右侧，右侧无其他元件", "同一编号的线圈在同一程序中只能出现一次", "触点可串联或并联，数量无严格限制（受PLC资源限制）", "", ""], "r": "BCD", "e": "答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435477", "t": 2, "q": "梯形图中，\"程序的优化\"措施包括", "a": ["随意增加触点和线圈，确保逻辑全面", "减少不必要的触点和线圈，简化逻辑", "将频繁使用的逻辑组合编写为子程序，减少重复代码", "合理使用中间继电器，避免复杂的触点串并联", "", ""], "r": "BCD", "e": "程序优化要简化逻辑、减少重复、合理利用资源。A随意增加会使程序复杂，不是优化措施；B减少不必要元件可简化程序；C编写子程序能减少重复代码；D合理用中间继电器可让逻辑更清晰。答案为BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435478", "t": 2, "q": "梯形图中，\"定时器的常见故障\"包括", "a": ["定时器不计时:触发信号未接通或复位信号常通", "定时器无法复位:复位信号未接通或定时器故障", "计时时间不准:时间设定错误或定时器故障", "定时器频繁复位:触发信号不稳定，频繁通断", "", ""], "r": "ABCD", "e": "ABCD选项分别从定时器不计时、无法复位、计时不准、频繁复位几个方面阐述了常见故障及原因，均合理。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435479", "t": 2, "q": "梯形图中，\"定时器与计数器的联合应用\"场景包括", "a": ["液位控制: 计数器记录液位开关动作次数，定时器设定检测间隔", "火电厂排水泵控制: 定时器设定运行时间，计数器记录运行次数，次数达标后报警", "简单的灯控: 仅用定时器控制灯的开关时间", "风机启动控制: 定时器设定延时启动时间，计数器记录启动失败次数，失败超次停机", "", ""], "r": "ABD", "e": "C选项仅用定时器，未体现定时器与计数器联合应用；A、B、D选项都将定时器和计数器结合用于不同控制场景。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435480", "t": 2, "q": "梯形图中，\"计数器的常见故障\"包括", "a": ["计数不准:触发信号频繁通断或计数器故障", "计数溢出:计数值超过最大值，未处理", "无法复位:复位信号未接通或计数器故障", "不计数:触发信号未接通或计数方向错误", "", ""], "r": "ABCD", "e": "ABCD选项分别描述了计数器可能出现的计数不准、计数溢出、无法复位、不计数等常见故障及原因。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435481", "t": 2, "q": "梯形图中，“线圈并联”的编程规则包括", "a": ["线圈并联时，支路右侧可再连接其他触点或线圈", "并联线圈的编号必须不同，不可重复", "线圈并联的数量受PLC输出点数和负载能力限制", "多个线圈可并联在同一支路上，受同一组触点控制", "", ""], "r": "BCD", "e": "梯形图（Ladder Diagram）是PLC编程中常用的一种图形表示方法。在梯形图中，线圈并联的编程规则主要涉及线圈的连接方式和限制。我们逐一分析每个选项：A. 线圈并联时，支路右侧可再连接其他触点或线圈 这是不正确的。在梯形图中，线圈并联时，支路右侧不能再连接其他触点或线圈。线圈并联是指多个线圈在同一支路的右侧并列连接。B. 并联线圈的编号必须不同，不可重复 这是正确的。每个线圈在梯形图中必须有唯一的编号，不能重复。C. 线圈并联的数量受PLC输出点数和负载能力限制 这是正确的。PLC的输出点数和负载能力决定了可以并联的线圈数量，不能超过PLC的硬件限制。D. 多个线圈可并联在同一支路上，受同一组触点控制 这是正确的。多个线圈可以在同一支路上并联，并且可以受同一组触点的控制。综上所述，正确的选项是B、C和D。所以，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435482", "t": 2, "q": "梯形图中，\"中间继电器（M）\"的应用场景包括", "a": ["实现复杂逻辑组合（如多个触点控制一个中间继电器，再控制线圈）", "扩展触点数量（一个中间继电器有多个常开/常闭触点，可控制多个回路）", "直接驱动大功率负载（如电机、加热器）", "隔离强电与弱电（中间继电器线圈接弱电，触点接强电）", "", ""], "r": "ABD", "e": "中间继电器可用于实现复杂逻辑组合、扩展触点数量以及隔离强电与弱电，但它触点容量小，不能直接驱动大功率负载。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435483", "t": 2, "q": "梯形图中，\"主控触点\"的应用场景包括", "a": ["简化程序，减少重复触点的使用（如多个回路共用同一组条件）", "控制多个线圈回路的通断（如某一系统的所有设备，主控触点闭合时才能操作）", "实现紧急停止功能（主控触点断开时，所有相关设备停止）", "直接驱动大功率负载（如加热器、电机）", "", ""], "r": "ABC", "e": "主控触点可简化程序、控制多线圈回路通断、实现紧急停止功能。但它不能直接驱动大功率负载，需通过接触器等中间元件。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435484", "t": 2, "q": "梯形图中，定时器的主要参数包括", "a": ["定时时间设定值（如10秒、100毫秒）", "触发信号（触点信号，决定定时器是否开始计时）", "复位信号（复位指令，清除计时值）", "计时单位（如毫秒、秒、分钟）", "", ""], "r": "ABCD", "e": "定时器要正常工作，需设定定时时间值，明确计时单位，有触发信号来启动计时，复位信号来清除计时值，ABCD 都是其主要参数。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435485", "t": 2, "q": "梯形图中，计数器的工作模式包括", "a": ["减计数（每触发一次，计数值减1）", "随机计数（计数值随机变化）", "增计数（每触发一次，计数值加1）", "增减计数（可加可减，由方向信号控制）", "", ""], "r": "ACD", "e": "计数器常见工作模式有增计数，触发一次计数值加1；减计数，触发一次计数值减1；还有增减计数，可通过方向信号控制计数方向。不存在随机计数模式。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435486", "t": 2, "q": "下列关于开关量控制与顺序控制关系的说法，正确的有", "a": ["开关量控制可独立实现简单控制（如单一设备启停），顺序控制需多步开关量控制协同", "开关量控制是顺序控制的基础，顺序控制需依赖开关量信号实现逻辑触发", "顺序控制完全不涉及开关量控制，仅依赖模拟量信号", "顺序控制是开关量控制的一种应用形式，通过预设逻辑顺序触发开关量控制动作", "", ""], "r": "ABD", "e": "开关量控制能独立完成简单控制，顺序控制是多步开关量控制协同，且依赖开关量信号触发逻辑，它是开关量控制按预设逻辑顺序的应用。C选项说顺序控制完全不涉及开关量控制错误。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435487", "t": 2, "q": "用顺序功能图描述火电厂\"锅炉给水系统功能组\"时，该功能组包含的\"步\"可能有", "a": ["给水阀开到位检测步（确认阀门状态）", "给水泵启动步（执行给水泵启动指令）", "系统故障停机步（故障时执行停机）", "给水流量调节步（持续监控流量）", "", ""], "r": "ABCD", "e": "锅炉给水系统功能组的运行包含多个环节，阀门状态确认、给水泵启动、故障停机处理以及流量调节都是其重要步骤。答案ABCD选项分别对应了这些不同环节。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435488", "t": 2, "q": "PLC的\"程序备份\"的重要性包括", "a": ["便于维护:更换PLC时，可快速下载备份程序", "防止程序丢失:如PLC存储器故障，可恢复程序", "提高运行效率:备份程序可以优化PLC的处理速度", "便于版本管理:保存不同版本程序，追溯修改记录", "", ""], "r": "ABD", "e": "程序备份主要是为维护、防丢失和版本管理等，备份程序本身不会优化处理速度。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435489", "t": 2, "q": "PLC的\"程序调试\"的步骤包括", "a": ["离线调试:在计算机上模拟输入信号，检查程序逻辑是否正确", "故障模拟:人为模拟故障（如断开输入信号），测试故障处理程序", "直接运行:无需调试，下载程序后直接投入运行", "在线调试:将程序下载到PLC，连接现场设备，测试实际动作", "", ""], "r": "ABD", "e": "PLC程序调试一般先离线模拟检查逻辑，再模拟故障测试处理程序，最后在线连接现场设备测试实际动作，不能不调试直接运行。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435490", "t": 2, "q": "PLC的\"电源模块故障\"的原因包括", "a": ["输入电压超出允许范围（如220V AC输入接380V AC）", "电源模块与CPU模块通信中断", "电源模块散热不良（如风扇故障、灰尘过多）", "电源模块负载过大（如连接过多I/O模块，超出功率）", "", ""], "r": "ACD", "e": "输入电压超范围、散热不良、负载过大都可能导致电源模块故障，而电源模块与CPU模块通信中断主要影响通信，并非电源模块故障原因。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435491", "t": 2, "q": "PLC的\"故障处理程序\"的设计内容包括", "a": ["故障处理: 故障时执行安全动作（如停止设备、切换备用）", "故障检测: 通过指令检测CPU、I/O、通信故障", "故障记录: 记录故障类型、时间、位置，便于分析", "故障报警: 故障时输出报警信号（如声光报警）", "", ""], "r": "ABCD", "e": "PLC故障处理程序设计需涵盖故障检测、处理、记录与报警等方面，ABCD四个选项分别对应了这些关键内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435492", "t": 2, "q": "PLC的\"冗余配置\"的优势包括", "a": ["提高系统可靠性:单一模块故障时，备用模块自动投入，无停机", "降低维护成本:冗余模块可在线更换，无需停机", "增强系统稳定性:避免因单点故障导致控制中断", "提高控制精度:冗余模块可修正测量误差", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435493", "t": 2, "q": "PLC的\"扫描周期\"受影响的因素包括", "a": ["输入/输出点数:点数越多，输入采样和输出刷新时间越长", "程序复杂程度:复杂逻辑（如嵌套、循环）越多，扫描周期越长", "电源电压稳定性:电压波动越大，扫描周期越长", "用户程序长度:程序越长，扫描周期越长", "", ""], "r": "ABD", "e": "PLC扫描周期与输入/输出点数、程序复杂程度、用户程序长度有关，点数多、程序复杂、程序长都会使扫描周期变长，而电源电压稳定性主要影响PLC正常工作，不直接影响扫描周期。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435494", "t": 2, "q": "PLC的\"输入信号故障\"的排查步骤包括", "a": ["检查输出模块是否正常，与输入无关", "检查现场传感器是否正常（如开关是否闭合，有无信号）", "检查输入模块是否正常（如模块指示灯、故障代码）", "检查输入信号线是否松动、短路或断路", "", ""], "r": "BCD", "e": "排查PLC输入信号故障，需先查现场传感器有无信号，再看输入信号线连接情况，最后检查输入模块。A选项说与输入无关错误。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435495", "t": 2, "q": "PLC的\"通信功能\"的应用包括", "a": ["与其他PLC通信:实现多PLC协同控制（如机组间联动）", "与智能仪表通信:采集仪表数据（如温度、压力）", "与上位机通信:上传设备状态、故障信息，接收上位机指令", "与现场总线设备通信:连接变频器、传感器等（如Profibus、Modbus）", "", ""], "r": "ABCD", "e": "PLC通信功能可与多种设备通信，A可实现多PLC协同，B能采集仪表数据，C可与上位机交互信息，D能连接现场总线设备，ABCD均是其通信功能应用。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435496", "t": 2, "q": "PLC的\"系统程序\"与\"用户程序\"的区别在于", "a": ["系统程序由PLC厂家固化，用于控制PLC基本运行（如指令解释、I/O管理）", "系统程序存储在ROM中（断电不丢失），用户程序通常存储在RAM中（需电池备份）", "用户程序由用户编写，用于实现特定控制逻辑（如顺序控制、联锁）", "系统程序不可随意修改，而用户程序可以根据需要进行修改", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435497", "t": 2, "q": "PLC的\"用户程序的存储\"方式包括", "a": ["存储在计算机硬盘中:PLC运行时读取硬盘数据", "存储在EEPROM中:无需备份，断电后数据永久保存", "存储在ROM中:用户不可修改，用于存储固定程序", "存储在RAM中:需锂电池备份，断电后数据不丢失（电池没电则丢失）", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435498", "t": 2, "q": "PLC的\"I/O模块故障\"的处理步骤包括", "a": ["检查模块与CPU的通信是否正常，有无通信中断", "检查模块电源是否正常，有无断电或电压异常", "检查模块接线是否松动、短路或断路", "直接更换模块，无需排查原因", "", ""], "r": "ABC", "e": "处理PLC的“I/O模块故障”应先排查可能原因，如通信、电源、接线等问题，而不是直接更换模块。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435499", "t": 2, "q": "PLC的\"I/O映像区\"的特点包括", "a": ["输入映像区的状态在输入采样阶段更新，程序执行阶段不改变", "I/O映像区的大小与PLC的I/O点数有关", "程序执行时，CPU直接访问I/O映像区，而非现场设备", "输出映像区的状态在程序执行阶段更新，输出刷新阶段输出到设备", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435500", "t": 2, "q": "PLC的CPU工作过程包括的阶段有", "a": ["输入采样阶段（读取输入信号到输入映像区）", "输出刷新阶段（将输出映像区结果送到输出设备）", "程序执行阶段（按顺序执行用户程序，计算输出结果）", "故障诊断阶段（检测CPU、存储器、I/O模块故障）", "", ""], "r": "ABC", "e": "PLC的CPU工作过程主要有输入采样、程序执行、输出刷新阶段，输入采样读取输入信号存于输入映像区，程序执行按序算结果，输出刷新把结果送输出设备。故障诊断非CPU正常工作流程的主要阶段。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435501", "t": 2, "q": "PLC的I/O地址分配原则包括", "a": ["同类设备的I/O地址集中分配（如所有泵的输入/输出地址集中）", "预留备用地址（通常10%-20%），用于后期扩展或故障替换", "故障信号、紧急停止信号的地址单独分配，便于快速定位", "输入地址（I区）和输出地址（Q区）严格区分，不混合分配", "", ""], "r": "ABCD", "e": "ABCD选项均为PLC的I/O地址分配原则，A可方便管理和维护同类设备；B预留备用地址能应对后期变化；C单独分配故障等信号地址利于快速排查；D严格区分输入输出地址避免混淆。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435502", "t": 2, "q": "PLC的I/O接线设计需遵循的原则包括", "a": ["输入信号线与动力线分开敷设，避免电磁干扰", "所有I/O接线无需标识，只要连接正确即可", "输出信号线需根据负载类型选择合适截面积的导线（如大功率负载选粗线）", "输入/输出回路需加装熔断器或断路器，实现过流保护", "", ""], "r": "ACD", "e": "A可防止干扰；C根据负载选导线合理；D加保护装置能保障安全。而B选项，I/O接线需清晰标识，方便维护检修，不标识是错误的。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435503", "t": 2, "q": "PLC的I/O设计中，输入模块选型需考虑的因素有", "a": ["输入点数及冗余量（通常预留10%-20%）", "输入信号类型（直流/交流、开关量/模拟量）", "输入信号电压等级（如24V DC、220V AC）", "现场环境条件（如温度、湿度、干扰）", "", ""], "r": "ABCD", "e": "输入模块选型时，输入点数及冗余量可保证系统扩展性；输入信号类型决定模块适配性；输入信号电压等级要与信号匹配；现场环境条件会影响模块稳定性。ABCD都是需考虑因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435504", "t": 2, "q": "PLC输出模块的类型包括", "a": ["晶体管输出型:适用于直流负载，无触点，响应速度快", "晶闸管输出型:适用于交流负载，无触点，适合高频动作", "继电器输出型:适用于交直流负载，有机械触点，寿命较短", "光电耦合输出型:适用于信号隔离，提供电气隔离", "", ""], "r": "ABC", "e": "PLC（可编程逻辑控制器）的输出模块主要有三种类型，根据不同的应用需求选择不同类型的输出模块。A选项描述的是晶体管输出型，这种类型的输出适用于直流负载，因为它使用无触点的电子开关，所以响应速度非常快。B选项描述的是晶闸管输出型，这种输出适用于交流负载，同样是无触点设计，能够处理高频动作。C选项描述的是继电器输出型，这种输出可以适用于交直流负载，但是它使用的是有机械触点的开关，因此相比于晶体管和晶闸管输出型，寿命较短。D选项描述的光电耦合输出型实际上并不是PLC输出模块的一种类型，而是用于信号隔离的一种技术，虽然在PLC系统中也常用到光电耦合器来实现输入输出信号的电气隔离，但它本身并不构成一种输出模块的类型。综上所述，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803808076435505", "t": 2, "q": "PLC输入模块的\"光电隔离\"技术的作用包括", "a": ["实现输入信号的双向传输", "减少现场电磁干扰对输入信号的影响，提高信号可靠性", "隔离现场强电信号与PLC内部弱电信号，防止强电干扰损坏CPU", "提高输入模块的负载能力，可驱动更大功率的设备", "", ""], "r": "BC", "e": "光电隔离技术主要功能是隔离强电与弱电，减少电磁干扰，保护PLC内部元件。A选项双向传输不是其主要作用；D选项提高负载能力并非光电隔离作用。BC正确说明了其作用。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299456", "t": 3, "q": "顺序功能图（SFC）中，步的激活仅需满足对应的转换条件，与前一步是否激活无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "顺序功能图里，步的激活需前一步激活且对应转换条件满足。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299457", "t": 3, "q": "顺序功能图的\"并行序列\"中，转换条件满足后，多个步依次激活，按顺序执行各自流程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在顺序功能图的“并行序列”里，转换条件满足后，多个步是同时激活，并行执行各自流程，并非依次激活按顺序执行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299458", "t": 3, "q": "顺序功能图的\"初始步\"是系统故障时自动跳转的步，用于故障处理流程的起点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "顺序功能图的初始步是系统启动时激活的步，并非系统故障时自动跳转用于故障处理流程的起点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299459", "t": 3, "q": "顺序功能图的\"初始步\"需操作员手动触发才能激活，无法在系统上电后自动激活。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "初始步可在系统上电后自动激活，并非需操作员手动触发。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299460", "t": 3, "q": "顺序功能图的\"选择序列\"中，多个分支的转换条件可同时满足，多个分支同时激活。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "顺序功能图的“选择序列”中，多个分支的转换条件不会同时满足，只能激活其中一个分支。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299461", "t": 3, "q": "顺序功能图应用于火电厂凝结水系统时，\"凝结水水位达到高水位\"属于\"步\"的范畴，而非转换条件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“凝结水水位达到高水位”是一个能使系统状态发生改变的条件，应属于转换条件，而非“步”。“步”代表系统的一个稳定状态。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299462", "t": 3, "q": "顺序功能图中，并行序列的合并需所有并行分支的最后一步均激活，且合并转换条件满足，才能触发合并。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "顺序功能图里并行序列合并规则就是所有并行分支最后一步都要激活，同时合并转换条件满足才可触发合并。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299463", "t": 3, "q": "顺序功能图中，步的编号仅用于图形标识，无实际编程意义，可随意设定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。顺序功能图中步的编号有实际编程意义，在编程时要依据步编号来编写程序指令和逻辑关系，不能随意设定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299464", "t": 3, "q": "顺序功能图中，步的动作包括持续动作、单次动作、延迟动作，不存在永久动作（步失活后仍执行）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "顺序功能图里步的动作主要有持续动作、单次动作、延迟动作等，确实不存在步失活后还继续执行的永久动作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299465", "t": 3, "q": "顺序功能图中，步的失活需当前步的动作完成且下一步的转换条件满足，二者同时具备。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "顺序功能图里，步的失活确实需要当前步动作完成且下一步转换条件满足这两个条件同时具备。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299466", "t": 3, "q": "顺序功能图中，步激活后，其所有动作立即执行，无需考虑动作自身的条件（如延迟）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "顺序功能图中，步激活后，动作是否执行还需考虑动作自身条件，并非立即执行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299467", "t": 3, "q": "顺序功能图中，修改\"步的编号\"即可改变步的动作内容，无需修改对应的控制指令。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "顺序功能图中，步的编号只是标识，步的动作内容由对应的控制指令决定，修改步的编号不会改变动作内容，还需修改控制指令。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299468", "t": 3, "q": "顺序功能图中，选择序列的合并需所有分支的转换条件同时满足，才能触发合并，激活后续步。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299469", "t": 3, "q": "顺序功能图中的\"持续动作\"与步的状态同步，步激活时动作执行，步失活时动作立即停止。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "顺序功能图里持续动作确实和步的状态同步，步激活动作执行，步失活动作马上停止。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299470", "t": 3, "q": "顺序功能图中的\"空步\"无实际功能，仅用于分隔不同的步，使图形更美观。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299471", "t": 3, "q": "顺序功能图中的\"延迟动作\"，是指步激活后，无需任何条件立即执行动作，步失活时停止。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "顺序功能图中“延迟动作”并非步激活后无需条件立即执行，而是要经过一定延迟时间才执行动作，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299472", "t": 3, "q": "顺序功能图中的\"转换\"用矩形框表示，框内标注转换条件，连接不同的步。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "顺序功能图中“转换”用有向线段上的短横线表示，并非矩形框。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299473", "t": 3, "q": "顺序功能图中的\"转换条件\"只能是单一开关量信号，不能是模拟量阈值或逻辑组合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "顺序功能图中的“转换条件”可以是单一开关量信号，也可以是模拟量阈值或逻辑组合。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299474", "t": 3, "q": "梯形图编程中，同一编号的线圈在同一程序中可出现多次，实现多个回路控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梯形图编程里，同一编号的线圈在同一程序中一般不允许多次出现，否则会造成逻辑混乱。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299475", "t": 3, "q": "梯形图中，\"定时器的复位\"会暂停计时并保留当前计时值，\"定时器的停止\"会清除计时值并回到初始状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该描述中定时器复位和停止的效果说反了，实际是“定时器的复位”会清除计时值回到初始状态，“定时器的停止”会暂停计时并保留当前计时值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299476", "t": 3, "q": "梯形图中，\"计数\"是\"累加\"的一种表现形式，所有计数动作均为增加计数值，不存在减少计数值的情况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "计数不只是累加，也有递减计数的情况，所以题干说所有计数动作均为增加计数值错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299477", "t": 3, "q": "梯形图中，触点并联的逻辑关系为\"与\"，即所有触点闭合，支路才能导通。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梯形图中触点并联是“或”逻辑关系，只要有一个触点闭合，支路就导通；“与”逻辑关系是触点串联时的情况。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299478", "t": 3, "q": "梯形图中，触点串联的逻辑关系为\"或\"，即任一触点闭合，支路即可导通。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梯形图中触点串联逻辑关系是“与”，需所有串联触点都闭合支路才导通，而“或”是触点并联的逻辑关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299479", "t": 3, "q": "梯形图中，多个线圈可直接并联在同一支路上，受同一组触点控制，同时通电或断电。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在梯形图中，多个线圈是可以直接并联在同一支路上，当这一支路受同一组触点控制时，触点状态改变，这些并联线圈会同时通电或断电。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299480", "t": 3, "q": "梯形图中的\"常开触点\"，在对应输入信号为\"1\"时闭合，为\"0\"时断开，符合逻辑与规则。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梯形图中常开触点在对应输入信号为“1”时闭合，为“0”时断开，逻辑上与“与”规则相符，当所有输入都为“1”结果才为“1”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299481", "t": 3, "q": "梯形图中的\"定时器\"，在触发信号为\"1\"时开始计时，计时时间到后输出变为\"1\";触发信号为\"0\"时，计时复位。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梯形图里定时器触发信号为“1”开始计时，时间到输出“1”，触发信号为“0”计时复位，此描述符合定时器工作原理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299482", "t": 3, "q": "梯形图中的\"复位指令\"对定时器的作用是暂停计时，保持当前计时值，待触发信号再次有效时继续计时。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "复位指令对定时器的作用是将定时器的当前计时值清零并停止计时，并非暂停计时和保持当前计时值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299483", "t": 3, "q": "梯形图中的\"计数器\"，只能对输入信号的上升沿进行计数，无法对下降沿计数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梯形图中的计数器有多种类型，部分计数器不仅能对输入信号上升沿计数，也能对下降沿计数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299484", "t": 3, "q": "梯形图中的\"主控触点\"用于控制其下方一组触点的通断，主控触点闭合时，下方触点才能正常工作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在梯形图里，主控触点确实用于控制下方一组触点通断，只有主控触点闭合，下方触点才能正常工作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299485", "t": 3, "q": "用顺序功能图描述火电厂功能组时，\"步\"不仅包括设备动作指令，还包括状态检测和保持。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "顺序功能图中“步”代表系统的一个稳定状态，在火电厂功能组描述里，“步”除设备动作指令外，确实包含状态检测和保持，以确保系统按顺序稳定运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299486", "t": 3, "q": "PLC的\"输出刷新阶段\"，CPU会将输入映像区的状态读取到CPU内部，用于下一轮程序执行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在“输出刷新阶段”，CPU是将输出映像寄存器的内容送到输出模块，而不是将输入映像区状态读取到CPU内部用于下一轮程序执行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299487", "t": 3, "q": "PLC的\"输入采样阶段\"，CPU会将现场输入设备的状态持续读入输入映像区，直至程序执行完毕。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "输入采样阶段，CPU仅在该阶段将现场输入设备状态读入输入映像区，而非持续读入直至程序执行完毕。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299488", "t": 3, "q": "PLC的\"数字量I/O\"处理通/断状态信号（如0/1）,\"模拟量I/O\"处理连续变化的信号（如4-20mA），二者功能不可互换。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299489", "t": 3, "q": "PLC的\"系统程序存储器\"由用户编写，用于存储用户的控制逻辑，可随时修改。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统程序存储器存储的是PLC厂家编写的系统程序，用户不能编写和随意修改，用户编写存储控制逻辑的是用户程序存储器。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299490", "t": 3, "q": "PLC的\"中断程序\"在中断事件触发时，会暂停主程序执行，优先执行中断程序，执行完后返回主程序断点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这符合PLC中断程序的工作机制，当有中断事件触发，主程序暂停，先执行中断程序，结束后回到主程序断点处继续执行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299491", "t": 3, "q": "PLC的继电器输出型模块，其响应速度比晶体管输出型模块慢，寿命比晶体管输出型短。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299492", "t": 3, "q": "PLC的扫描周期主要由输入/输出模块的数量决定，模块数量越多，扫描周期越长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC扫描周期受程序长度、指令执行时间等多因素影响，并非主要由输入/输出模块数量决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299493", "t": 3, "q": "PLC的输出模块中，晶体管输出型适用于交流负载，继电器输出型适用于直流负载。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC输出模块中，晶体管输出型适用于直流负载，继电器输出型交直流负载都适用。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299494", "t": 3, "q": "PLC的输出信号控制大功率加热器时，可直接用PLC输出模块驱动，无需转接设备。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC输出模块驱动能力有限，大功率加热器功率大、电流大，直接用PLC输出模块驱动会超出其负载能力，需转接设备，如继电器等进行功率放大。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299495", "t": 3, "q": "PLC的输入信号为\"紧急停止按钮\"时，应采用常开触点接线，按钮按下时输入信号为\"1\"，触发急停。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC输入信号为“紧急停止按钮”时，应采用常闭触点接线，这样在按钮按下（断开）时输入信号为“0”触发急停，若用常开触点，按钮未按是“0”，按下才“1”，不符合急停安全设计逻辑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299496", "t": 3, "q": "PLC的用户程序下载到PLC后，若需修改，可在PLC运行状态下直接修改并下载，无需停止PLC。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "通常在PLC运行状态下直接修改并下载程序可能会引发异常，影响PLC控制的设备正常运行，很多情况下需停止PLC再进行修改和下载。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299497", "t": 3, "q": "PLC的中央处理单元（CPU）负责存储系统程序和用户程序，是PLC的核心部件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299498", "t": 3, "q": "PLC的子程序只能被主程序调用一次，重复调用会导致程序错误。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC的子程序可被主程序多次调用，不会因重复调用导致程序错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299499", "t": 3, "q": "PLC的CPU采用中断优先工作方式，仅在中断事件触发时才执行用户程序。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC的CPU一般采用循环扫描工作方式，不断循环执行用户程序，并非仅在中断事件触发时才执行，且不是中断优先工作方式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299500", "t": 3, "q": "PLC的I/O地址分配中，将同类设备的I/O地址集中分配，可便于编程和故障排查。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "同类设备I/O地址集中分配，能让程序结构更清晰，编程时逻辑更连贯，排查故障时也能快速定位同类设备相关地址，便于操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299501", "t": 3, "q": "PLC的I/O地址分配中，输入地址和输出地址可混合分配，无需严格区分，以方便记忆。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC 的 I/O 地址分配需严格区分输入和输出地址，不能混合，这是为保证系统正常运行和准确控制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299502", "t": 3, "q": "PLC的I/O设计中，输出模块的负载能力是指其能驱动的最大负载电压，与负载电流无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "输出模块负载能力既与能驱动的最大负载电压有关，也和负载电流有关，题干说与负载电流无关错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299503", "t": 3, "q": "PLC的I/O设计中，输入点数无需预留冗余，按实际需求选择即可满足长期使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。在PLC的I/O设计中，为了应对未来可能的功能扩展、设备升级等情况变化，输入点数通常需要预留一定冗余，不能仅按实际需求选择，否则难以满足长期使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299504", "t": 3, "q": "在PLC的I/O设计中，当现场设备与PLC之间的距离较远时，需要选择具有信号放大功能的输入模块来确保信号传输的可靠性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "距离远信号会衰减，有信号放大功能的输入模块可增强信号，能确保信号传输可靠性。", "ap": [false, false, false, false, false, false]}, {"id": "2034803809649299505", "t": 3, "q": "PLC输入模块的\"光电隔离\"技术，可防止现场强电干扰进入PLC内部，保护CPU等核心部件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "光电隔离利用光信号传递信息，能有效阻断电气连接，从而防止现场强电干扰进入PLC内部，保护CPU等核心部件。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第9章 系统工程导论（1）", "n": "基础练习题【含解析】 / 第9章 系统工程导论（1）", "qs": [{"id": "2034803814716018688", "t": 1, "q": "霍尔三维结构中，\"逻辑维\"的核心是（　）", "a": ["划分系统的层级结构", "提供系统工程所需的知识支持", "解决系统工程的思维过程问题", "确定系统工程的时间阶段", "", ""], "r": "C", "e": "霍尔三维结构中逻辑维是解决系统工程的思维过程问题。划分层级结构对应空间相关，知识支持对应知识维，时间阶段对应时间维。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018689", "t": 1, "q": "霍尔三维结构中，知识维与逻辑维的关系是（　）", "a": ["相互独立，无关联", "知识维为逻辑维提供理论支持", "逻辑维为知识维提供方法指导", "知识维包含逻辑维", "", ""], "r": "B", "e": "在霍尔三维结构里，知识维涵盖各专业知识，逻辑维是解决问题的步骤，知识维为逻辑维提供理论依据。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018690", "t": 1, "q": "能源系统工程的理论基础中，\"能源市场分析\"基于的理论是（　）", "a": ["动态分析理论", "优化理论", "市场经济学理论", "可靠性理论", "", ""], "r": "C", "e": "能源市场分析主要是研究能源市场的供需、价格等经济现象，其理论基础是市场经济学理论。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018691", "t": 1, "q": "能源系统工程的理论基础中，\"能源投入产出分析\"基于的理论是（　）", "a": ["环境影响评价理论", "系统优化理论", "投入产出理论", "动态分析理论", "", ""], "r": "C", "e": "能源投入产出分析自然是基于投入产出理论。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018692", "t": 1, "q": "能源系统工程的理论基础中，\"能源系统可靠性分析\"基于的理论是（　）", "a": ["可靠性理论", "动态分析理论", "供需平衡理论", "优化理论", "", ""], "r": "A", "e": "能源系统可靠性分析自然是基于可靠性理论来开展的。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018693", "t": 1, "q": "能源系统工程的理论基础中，用于分析能源系统各环节随时间变化规律的是（　）", "a": ["生命周期理论", "投入产出理论", "静态分析理论", "动态分析理论", "", ""], "r": "D", "e": "动态分析理论重点在于研究系统随时间的变化规律，能用于分析能源系统各环节随时间的变化。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018694", "t": 1, "q": "能源系统工程中，\"能源回弹效应\"指的是（　）", "a": ["能源价格上涨导致能源消费量减少", "能源效率提高反而可能因需求增加导致能源消费量上升", "能源价格下降导致能源消费量上升", "能源效率提高导致能源消费量减少", "", ""], "r": "B", "e": "能源回弹效应核心是能源效率提高后，因需求等因素能源消费未降反升。A、C是价格对消费的影响，D与回弹效应意思相悖。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018695", "t": 1, "q": "能源系统工程中，\"能源效率\"的计算方式通常是（　）", "a": ["能源消费量/GDP", "总能源输入/有用能输出", "GDP/能源消费量", "有用能输出/总能源输入", "", ""], "r": "D", "e": "能源效率体现能源利用的有效程度，是有用能输出与总能源输入的比值。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018696", "t": 1, "q": "能源系统工程中，\"碳达峰、碳中和\"目标对能源系统的要求是（　）", "a": ["忽视能源安全", "仅依靠节能，不发展新能源", "增加碳排放", "降低化石能源消费，发展零碳能源", "", ""], "r": "D", "e": "“碳达峰、碳中和”是要减少碳排放，实现绿色低碳发展。A选项忽视能源安全显然不可行；B选项仅依靠节能不发展新能源无法达成目标；C选项增加碳排放与目标相悖。而降低化石能源消费，发展零碳能源符合“双碳”目标对能源系统的要求。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018697", "t": 1, "q": "能源系统工程中，基于线性规划方法优化能源配置时，其目标函数通常是（　）", "a": ["能源生产总量最大化", "能源供应成本最小化", "能源消费量最大化", "能源传输损耗最小化", "", ""], "r": "B", "e": "线性规划优化能源配置，一般是为了以最小投入获取最大效益，能源供应成本最小化符合这一目标。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018698", "t": 1, "q": "能源系统工程中，用于分析能源产业链各环节（如煤炭开采→发电→用电）价值分配的理论是（　）", "a": ["优化理论", "供需平衡理论", "建模理论", "产业链价值理论", "", ""], "r": "D", "e": "题干明确提到分析能源产业链各环节价值分配，产业链价值理论正适用于此。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018699", "t": 1, "q": "能源系统工程中，用于分析能源政策对能源系统影响的理论基础是（　）", "a": ["能源政策分析理论", "能源供需平衡理论", "能源优化理论", "能源建模理论", "", ""], "r": "A", "e": "能源政策分析理论是专门用于分析能源政策对能源系统影响的理论基础。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018700", "t": 1, "q": "能源系统工程中，用于评估能源项目对环境影响的理论基础是（　）", "a": ["能源经济学理论", "环境影响评价理论", "能源安全理论", "能源效率理论", "", ""], "r": "B", "e": "要评估能源项目对环境的影响，需用专门进行环境影响评估的理论。选项中只有环境影响评价理论符合这一需求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018701", "t": 1, "q": "能源系统工程中，用于评估能源项目对社会影响的理论基础是（　）", "a": ["环境评价理论", "经济评价理论", "社会影响评价理论", "技术评价理论", "", ""], "r": "C", "e": "题目问评估能源项目对社会影响的理论基础，自然是社会影响评价理论。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018702", "t": 1, "q": "能源系统工程中，用于评估能源项目经济可行性的指标是（　）", "a": ["能源利用率", "碳排放强度", "投资回收期", "能源产量", "", ""], "r": "C", "e": "投资回收期是衡量投资项目收回初始投资所需时间的指标，能评估能源项目经济可行性。能源利用率衡量能源利用效率；碳排放强度关注碳排放情况；能源产量体现能源产出数量，均与经济可行性评估无直接关联。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018703", "t": 1, "q": "能源系统工程中，用于优化能源传输网络（如电网、管网）布局的方法是（　）", "a": ["专家打分法", "系统动力学方法", "德尔菲法", "网络优化方法", "", ""], "r": "D", "e": "网络优化方法可对能源传输网络的布局进行优化，找到最优的网络结构。专家打分法和德尔菲法主要用于决策评估等；系统动力学方法侧重于研究系统动态变化。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018704", "t": 1, "q": "能源系统工程中，用于优化能源生产结构（如化石能源、新能源占比）的方法是（　）", "a": ["同行评议法", "系统动力学方法", "线性规划方法", "德尔菲法", "", ""], "r": "C", "e": "线性规划方法可用于优化资源分配，在能源系统工程里能对能源生产结构中不同能源占比进行优化。同行评议法主要用于学术成果评价；系统动力学方法侧重研究系统动态行为；德尔菲法用于专家意见收集和预测。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018705", "t": 1, "q": "能源系统工程中，用于预测未来能源需求量的方法是（　）", "a": ["层次分析法", "德尔菲法", "线性规划方法", "系统动力学方法", "", ""], "r": "B", "e": "德尔菲法是一种定性预测方法，常被用于预测未来能源需求量等。层次分析法主要用于多目标决策；线性规划方法用于资源优化配置等；系统动力学方法侧重于研究系统动态变化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018706", "t": 1, "q": "能源系统建模中，\"自上而下\"建模方法的优点是（　）", "a": ["可反映系统整体趋势", "数据需求量大，操作复杂", "细节描述丰富", "适合分析个体行为", "", ""], "r": "A", "e": "“自上而下”建模是从宏观整体出发构建模型。其能把握系统整体情况，反映系统整体趋势。B选项是缺点；C和D是“自下而上”建模的特点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018707", "t": 1, "q": "能源系统建模中，\"自下而上\"建模方法的特点是（　）", "a": ["从系统整体出发，忽略个体细节", "从系统个体（如设备、用户）出发，逐步整合为系统模型", "仅考虑能源需求侧，不考虑供应侧", "仅考虑能源供应侧，不考虑需求侧", "", ""], "r": "B", "e": "“自下而上”建模方法是从系统个体开始，逐步整合形成系统模型。A选项是“自上而下”特点；C、D选项说法错误，该方法供需两侧都考虑。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018708", "t": 1, "q": "能源系统建模中，用于描述能源在不同区域间流动情况的模型是（　）", "a": ["区域能源流模型", "能源转换模型", "集中参数模型", "分布参数模型", "", ""], "r": "A", "e": "从题目可知要找描述能源在不同区域间流动情况的模型，A选项“区域能源流模型”明显契合这一描述。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018709", "t": 1, "q": "能源系统中，\"分布式能源系统\"的主要优势是（　）", "a": ["仅能使用化石能源", "靠近用户，能源利用效率高", "能源传输损耗大", "依赖大电网，灵活性差", "", ""], "r": "B", "e": "分布式能源系统靠近用户端，能减少能源传输距离，提高能源利用效率。A选项它可使用多种能源非仅化石能源；C选项传输损耗小；D选项不依赖大电网，灵活性好。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018710", "t": 1, "q": "能源系统中，\"可再生能源消纳\"的核心问题是（　）", "a": ["可再生能源技术不成熟", "可再生能源生产成本过高", "可再生能源波动性与电网稳定性的矛盾", "可再生能源资源分布不均", "", ""], "r": "C", "e": "可再生能源如风能、太阳能等具有波动性，而电网需要稳定运行，二者矛盾是“可再生能源消纳”的核心问题。技术、成本、资源分布虽有影响但非核心。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018711", "t": 1, "q": "能源系统中，\"能源安全\"的核心评价指标不包括（　）", "a": ["能源供应稳定性", "能源对外依存度", "能源生产总量", "能源价格波动幅度", "", ""], "r": "C", "e": "能源安全核心关注供应稳定、对外依赖及价格波动等方面。能源生产总量不能直接体现能源安全状况，它与能源安全核心关联不大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018712", "t": 1, "q": "能源系统中，\"能源存储技术\"的主要作用是（　）", "a": ["仅用于存储化石能源", "解决可再生能源波动性与电网稳定性的矛盾", "增加能源生产总量", "减少能源消费总量", "", ""], "r": "B", "e": "可再生能源有波动性，能源存储技术可将多余能量存储起来，在需要时释放，以此解决其与电网稳定性的矛盾。A项能源存储技术不只是存化石能源；C项它不能直接增加能源生产总量；D项也不能直接减少能源消费总量。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018713", "t": 1, "q": "能源系统中，\"能源梯级利用\"的理论依据是（　）", "a": ["牛顿运动定律", "能源守恒定律", "电磁感应定律", "热力学第二定律", "", ""], "r": "D", "e": "热力学第二定律表明能量传递具有方向性，能源梯级利用正是基于此，让能源在不同温度、压力等条件下实现高效利用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018714", "t": 1, "q": "能源系统中，\"能源转型\"的核心方向是（　）", "a": ["减少能源生产总量", "从化石能源为主转向可再生能源为主", "增加化石能源消费", "仅发展风能，不发展太阳能", "", ""], "r": "B", "e": "能源转型主要是为应对环境和可持续发展问题，核心是改变能源结构。化石能源有污染且不可再生，可再生能源清洁可持续，所以转型核心是从化石能源为主转向可再生能源为主。A减少能源生产总量不是转型核心；C增加化石能源消费与转型相悖；D仅发展风能不发展太阳能不符合多元化能源发展要求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018715", "t": 1, "q": "能源系统中，\"热电联产\"模式的主要优势是基于（　）", "a": ["能源梯级利用理论", "能源安全理论", "能源供需平衡理论", "能源建模理论", "", ""], "r": "A", "e": "热电联产是将发电和供热联合生产，能使能源按品质高低进行梯级利用，提高能源利用效率。所以“热电联产”模式主要基于能源梯级利用理论，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018716", "t": 1, "q": "能源系统中，\"智能电网\"的核心特征不包括（　）", "a": ["与用户互动性强", "仅依赖传统化石能源发电", "高度自动化", "可再生能源消纳能力强", "", ""], "r": "B", "e": "智能电网强调与用户互动、自动化程度高且可再生能源消纳能力强，不应仅依赖传统化石能源发电。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018717", "t": 1, "q": "系统分析的基本步骤中，在明确系统目标之后，下一步应进行的是（　）", "a": ["系统环境分析", "系统方案设计", "系统评价指标确定", "系统模型构建", "", ""], "r": "A", "e": "系统分析基本步骤中，明确目标后要了解系统所处环境等情况来为后续分析做铺垫，所以下一步是系统环境分析。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018718", "t": 1, "q": "下列不属于系统工程霍尔三维结构中\"知识维\"包含的学科领域是（　）", "a": ["工程技术", "管理科学", "时间规划", "系统论", "", ""], "r": "C", "e": "霍尔三维结构知识维涵盖各类学科知识用于解决系统问题，工程技术、管理科学、系统论都符合，而时间规划属于时间维内容。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018719", "t": 1, "q": "下列关于系统工程概念的描述，错误的是（　）", "a": ["系统工程是一门跨学科的工程技术", "系统工程仅关注系统的技术层面，不涉及管理层面", "系统工程运用定量与定性相结合的方法分析系统", "系统工程以实现系统最优为目标", "", ""], "r": "B", "e": "系统工程不仅关注技术层面，也十分重视管理层面，B选项描述错误。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018720", "t": 1, "q": "在系统的基本特征中，某一系统要素发生变化会导致其他相关要素乃至整个系统状态改变，这体现的是系统的哪一特征?", "a": ["整体性", "动态性", "关联性", "层次性", "", ""], "r": "C", "e": "关联性强调系统要素间相互联系相互影响，一个要素变化会引发其他要素及整个系统改变，符合题意。整体性侧重系统作为整体的功能特性；动态性突出系统的发展变化；层次性指系统有不同层次结构。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018721", "t": 1, "q": "在系统工程方法中，主要用于解决\"不良结构\"系统问题，强调\"学习\"与\"改进\"过程的方法是（　）", "a": ["层次分析法", "切克兰德方法", "系统动力学方法", "霍尔三维结构", "", ""], "r": "B", "e": "切克兰德方法主要针对“不良结构”系统问题，注重“学习”与“改进”过程。而层次分析法用于多目标决策；系统动力学侧重研究系统动态行为；霍尔三维结构适用于“良结构”系统。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018722", "t": 1, "q": "系统分析中，\"方案设计\"的核心是（　）", "a": ["提出解决系统问题的多个可行方案", "分析系统的环境因素", "验证系统模型的准确性", "确定系统的最优方案", "", ""], "r": "A", "e": "方案设计就是要提出多种解决系统问题的可行方案，为后续决策提供选择。分析环境因素是系统分析前期工作；验证模型准确性与方案设计核心无关；确定最优方案是在提出多个可行方案后进行的。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018723", "t": 1, "q": "系统分析中，\"环境分析\"的主要内容是（　）", "a": ["分析系统内部要素间的联系", "分析系统外部因素对系统的影响", "分析系统的未来趋势", "分析系统的历史数据", "", ""], "r": "B", "e": "环境是系统外部的，环境分析就是分析系统外部因素对系统的影响。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803814716018724", "t": 1, "q": "系统分析中，\"可行性分析\"的核心是评估系统方案的（　）", "a": ["仅环境可行性", "仅技术可行性", "技术可行性、经济可行性、环境可行性", "仅经济可行性", "", ""], "r"
