"q": "线性定常系统的能控性与能观性对系统传递函数矩阵的影响，正确的有", "a": ["若系统完全能控且完全能观，则传递函数矩阵无零极点对消", "零极点对消的存在表明系统存在不能控或不能观的状态", "传递函数矩阵仅描述系统能控且能观部分的动态特性", "若系统不完全能控或不完全能观，则传递函数矩阵可能存在零极点对消（消去的是不能控或不能观的极点）", "", ""], "r": "ABCD", "e": "系统能控且能观时无零极点对消；有零极点对消说明有不能控或不能观状态；传递函数矩阵只描述能控且能观部分；不完全能控或能观时可能有零极点对消。ABCD表述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317829", "t": 2, "q": "线性定常系统的系统矩阵A的特征值与系统动态性能的关系，正确的有", "a": ["特征值虚部Im(λ)的绝对值越大，系统响应的振荡频率越高（超调量可能越大）", "若特征值为共轭复根（Re(λ)≠0，Im(λ)≠0），系统响应为衰减振荡（Re(λ)<0）或发散振荡（Re(λ)>0）", "若特征值为实根（Im(λ)=0），系统响应无振荡（单调衰减或发散）", "特征值实部Re(λ)的绝对值越大，系统响应的衰减速度越快（调节时间越短）", "", ""], "r": "ABCD", "e": "系统矩阵A的特征值实部和虚部对系统动态性能有不同影响。虚部影响振荡频率，实部决定衰减或发散情况。ABCD选项均准确描述了特征值与系统动态性能的关系。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317830", "t": 2, "q": "线性定常系统的状态空间表达式x_dot=A x+B u，y=C x+D u中，各矩阵的维度正确的有", "a": ["输入矩阵B:n×p（p为输入个数）", "直接传输矩阵D:p×q", "输出矩阵C:q×n（q为输出个数）", "系统矩阵A:n×n（n为系统阶数）", "", ""], "r": "ACD", "e": "在状态空间表达式中，系统矩阵 A 是 n×n（n 为系统阶数）；输入矩阵 B 是 n×p（p 为输入个数）；输出矩阵 C 是 q×n（q 为输出个数）；直接传输矩阵 D 是 q×p 。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317831", "t": 2, "q": "线性定常系统能观性的工程判定方法，适用于实际系统的有", "a": ["通过物理机理分析:若每个状态变量的变化均能通过输出直接或间接反映，则系统能观", "通过秩判据计算能观性矩阵的秩:秩=n则能观", "通过实验测试:改变初始状态，观测输出是否能唯一区分不同初始状态，能则判定能观", "通过传递函数测试:若传递函数无零极点对消，则系统能控且能观", "", ""], "r": "ABC", "e": "本题考察的是线性定常系统能观性的工程判定方法。首先，我们来了解什么是系统的能观性。能观性是指系统的状态能否通过其输出被完全确定。换句话说，如果我们知道系统的输出，是否能唯一地确定系统的当前状态。接下来，我们逐一分析每个选项：A. 通过物理机理分析来判断系统的能观性是一种直观的方法。如果每个状态变量的变化都能通过输出直接或间接地反映出来，那么显然系统是能观的。因此，A选项描述的方法是适用的。B. 秩判据是一种数学方法，通过计算能观性矩阵的秩来判断系统的能观性。如果秩等于系统的状态数n，则系统是能观的。但这种方法更侧重于理论计算，而非直接应用于实际系统。然而，从工程实际的角度，如果可以通过实验或仿真得到能观性矩阵并计算其秩，那么这种方法也是可行的。所以B选项描述的方法在实际中也是适用的。C. 通过实验测试来判断系统的能观性是一种非常实用的方法。具体来说，就是改变系统的初始状态，然后观测输出是否能唯一地区分不同的初始状态。如果能，则说明系统是能观的。这种方法直接基于系统的实际表现，因此在工程中是非常适用的。C选项描述的方法是正确的。D. 传递函数测试主要用于判断系统的稳定性、能控性和能观性。但是，仅仅通过传递函数无零极点对消来判断系统能控且能观是不全面的。因为即使传递函数没有零极点对消，系统也可能因为其他原因（如状态空间的某些特殊结构）而不满足能观性条件。因此，D选项描述的方法是不准确的。综上所述，适用于实际系统的线性定常系统能观性的工程判定方法有A、B和C三个选项描述的方法。所以，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317832", "t": 2, "q": "线性定常系统能观性的特征值判据（PBH判据），正确的表述有", "a": ["PBH判据与能观性秩判据的判定结果完全等价", "对系统矩阵A的每个特征值λ，矩阵[λI-A;C]的秩等于系统阶数n（分号表示行堆叠）", "PBH判据适用于线性定常连续系统和离散系统", "若存在某个特征值λ，使得矩阵[λI-A;C]的秩小于n，则系统不完全能观", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317833", "t": 2, "q": "线性定常系统能观性的物理意义及工程应用场景包括", "a": ["是设计状态反馈控制器实现极点配置的必要前提", "是设计观测器估计不可测状态的必要前提（能观才能通过输出反推状态）", "可用于判断系统是否能通过有限时间内的输出和输入唯一确定初始状态", "描述输出信号对系统内部状态的反映能力，即输出能否体现状态", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317834", "t": 2, "q": "线性定常系统能观性矩阵O=[C;C A;C A²;...;C A^(n-1)]的特性及应用，正确的有", "a": ["系统完全能观的充要条件是能观性矩阵的秩等于系统阶数n", "能观性矩阵的秩在非奇异线性变换（x=Pz，P可逆）下保持不变", "若输出个数q=1，则能观性矩阵为n×n方阵，此时系统能观等价于能观性矩阵可逆", "矩阵维度为nq×n（n为系统阶数，q为输出变量个数）", "", ""], "r": "ABCD", "e": "这几个选项都是线性定常系统能观性矩阵的基本性质。A选项是系统完全能观的判定充要条件；B选项非奇异线性变换不改变能观性矩阵秩；C选项单输出时能观性矩阵是方阵，能观就等价于矩阵可逆；D选项矩阵维度计算正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317835", "t": 2, "q": "线性定常系统能观性Gram矩阵的定义及应用，正确的有", "a": ["对线性定常系统，Gram矩阵与能观性秩判据的判定结果等价", "Gram矩阵仅适用于线性定常系统", "能观性Gram矩阵W_o(t₀,t₁)=∫ₜ₀ᵗ¹Φ<sup>T(τ,t₀)C<\/sup>T CΦ(τ,t₀)dτ", "系统完全能观的充要条件是存在t₁>t₀，使得W_o(t₀,t₁)为正定矩阵", "", ""], "r": "ACD", "e": "A选项，定常系统Gram矩阵和能观性秩判据判定结果等价；B选项，Gram矩阵也可用于时变系统；C选项，能观性Gram矩阵表达式正确；D选项，系统完全能观充要条件表述正确。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317836", "t": 2, "q": "线性定常系统能控能观分解后，系统可划分为的子系统类型包括", "a": ["不能控且不能观子系统", "不能控但能观子系统", "能控且能观子系统", "能控但不能观子系统", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317837", "t": 2, "q": "线性定常系统能控性的工程判定方法，适用于实际系统的有", "a": ["通过实验测试:施加不同输入，观测状态是否能跟踪期望轨迹，能则判定能控", "通过传递函数测试:若传递函数无零极点对消，则系统能控且能观", "通过物理机理分析:若每个状态变量均能通过输入直接或间接控制，则系统能控", "通过秩判据计算能控性矩阵的秩:秩=n则能控", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317838", "t": 2, "q": "线性定常系统能控性的特征值判据（PBH判据），正确的表述有", "a": ["PBH判据适用于线性定常连续系统和离散系统", "若存在某个特征值λ，使得矩阵[λI-A B]的秩小于n，则系统不完全能控", "PBH判据与能控性秩判据的判定结果完全等价", "对系统矩阵A的每个特征值λ，矩阵[λI-A B]的秩等于系统阶数n", "", ""], "r": "BC", "e": "PBH 判据主要用于线性定常连续系统，不适用于离散系统，A 错误；若存在某个特征值λ使[λI - A  B]的秩小于 n，则系统不完全能控，B 正确；PBH 判据与能控性秩判据结果等价，C 正确；对系统矩阵 A 的每个特征值λ，[λI - A  B]的秩等于 n 时系统才能控，D 错误。正确答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317839", "t": 2, "q": "线性定常系统能控性的物理意义及工程应用场景包括", "a": ["描述输入信号对系统内部状态的控制能力，即输入能否改变状态", "是设计观测器估计不可测状态的必要前提", "可用于判断系统是否能在有限时间内从任意初始状态转移到任意目标状态", "是设计状态反馈控制器实现极点配置的必要前提（能控才能通过反馈调整所有极点）", "", ""], "r": "ACD", "e": "线性定常系统能控性体现输入对状态的控制能力，能控时可使系统在有限时间从任意初态到目标态，且是设计状态反馈控制器极点配置的必要条件。而设计观测器估计不可测状态对应的是能观性。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317840", "t": 2, "q": "线性定常系统能控性与能观性的对偶原理，正确的表述有", "a": ["对偶系统的传递函数矩阵满足G₂（　）=G₁^T（　）（转置关系）", "对偶原理可将能控性问题转化为能观性问题分析，简化判定过程", "若系统S₁=(A,B,C)完全能观，则其对偶系统S₂=(A<sup>T,C<\/sup>T,B^T)完全能控", "若系统S₁=(A,B,C)完全能控，则其对偶系统S₂=(A<sup>T,C<\/sup>T,B^T)完全能观", "", ""], "r": "BCD", "e": "对偶原理可将能控性与能观性问题相互转化以简化判定，且若系统S₁=(A,B,C)完全能控，其对偶系统S₂=(Aᵀ,Cᵀ,Bᵀ)完全能观；若系统S₁完全能观，其对偶系统S₂完全能控，对偶系统传递函数矩阵满足G₂(s)=G₁ᵀ(-s) 。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317841", "t": 2, "q": "线性定常系统能控性与能观性的工程意义，正确的有", "a": ["能观性决定了是否能通过输出监测系统所有状态，是实现状态监测和故障诊断的前提", "若系统不完全能观，则需要确保不能观部分的状态对系统的整体性能没有负面影响", "能控性决定了是否能通过输入调整系统所有状态，是实现精准控制的前提", "若系统不完全能控，则必须保证不能控部分的状态处于稳定状态以避免影响整个系统的稳定性", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317842", "t": 2, "q": "线性定常系统能控性秩判据的计算步骤，正确的有", "a": ["确定系统阶数n和输入变量个数p", "构造能控性矩阵C=[B AB A²B...A^(n-1)B]（维度n×np）", "计算能控性矩阵的秩rank(C)", "若rank(C)=n，判定系统完全能控;若rank(C)<n，判定系统不完全能控", "", ""], "r": "ABCD", "e": "线性定常系统能控性秩判据，需先明确系统阶数n和输入变量个数p，再构造能控性矩阵，接着算其秩，最后根据秩与阶数关系判断能控性，ABCD 步骤均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317843", "t": 2, "q": "线性定常系统能控性Gram矩阵的定义及应用，正确的有", "a": ["Gram矩阵适用于线性定常系统和线性时变系统", "对线性定常系统，Gram矩阵与能控性秩判据的判定结果等价", "系统完全能控的充要条件是存在t₁>t₀，使得W_c(t₀,t₁)为正定矩阵", "能控性Gram矩阵W_c(t₀,t₁)=∫ₜ₀ᵗ¹Φ(τ,t₀)BB<sup>TΦ<\/sup>T(τ,t₀)dτ", "", ""], "r": "BCD", "e": "Gram矩阵一般用于线性时变系统，线性定常系统常用秩判据，A错误；线性定常系统Gram矩阵判定结果和能控性秩判据等价，B正确；系统完全能控充要条件是Gram矩阵正定，C正确；D是Gram矩阵定义式。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317844", "t": 2, "q": "线性定常系统全维观测器的设计步骤，正确的有", "a": ["写出观测器的状态方程: ẑ=(A-LC)ẑ+Bu+Ly（ẑ为估计状态，y为实际输出），确保误差e=x-ẑ收敛到0", "确定观测器的期望极点（根据误差收敛速度要求，选择实部绝对值足够大的极点）", "验证系统的能观性（需系统完全能观，否则无法估计所有状态）", "构造观测器的特征方程det(λI-(A-LC))=0，将期望极点代入，求解观测器增益矩阵L", "", ""], "r": "ABCD", "e": "设计线性定常系统全维观测器，首先要验证系统能观性，这是估计所有状态的前提（C）；接着确定期望极点以满足误差收敛速度要求（B）；然后写出观测器状态方程保证误差收敛到0（A）；最后构造特征方程并代入期望极点求解观测器增益矩阵L（D）。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317845", "t": 2, "q": "线性定常系统状态方程x_dot=A x+B u的解的存在性与唯一性，正确的说法有", "a": ["解的存在性与唯一性仅与系统矩阵A有关，与输入u(t)无关", "若A、B是常矩阵，u(t)是分段连续函数，则解存在且唯一", "若u(t)是不连续函数（如脉冲函数），则解仍存在但可能不唯一", "解的存在性与唯一性是系统分析和控制设计的前提（无唯一解则无法确定状态轨迹）", "", ""], "r": "BD", "e": "线性定常系统中，当A、B为常矩阵，u(t)分段连续时，状态方程解存在且唯一；解的存在与唯一是后续分析和设计基础；解的情况与A和u(t)都有关，当u(t)不连续解可能不存在。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317846", "t": 2, "q": "线性定常系统状态空间表达式的\"最小实现\"的定义及特性，正确的有", "a": ["最小实现的充分必要条件是系统完全能控且完全能观", "同一个传递函数的所有最小实现的阶数相同", "最小实现是指阶数最低的状态空间表达式（n最小）", "最小实现可通过能控能观分解，剔除不能控或不能观部分得到", "", ""], "r": "ABCD", "e": "最小实现就是阶数最低的状态空间表达式，其充分必要条件是系统完全能控且完全能观，同一传递函数所有最小实现阶数相同，也可通过能控能观分解剔除不能控或不能观部分得到。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317847", "t": 2, "q": "线性定常系统状态空间表达式的标准形式包括", "a": ["能观标准形", "约当标准形（A为约当矩阵）", "能控标准形", "对角标准形（A为对角矩阵）", "", ""], "r": "ABCD", "e": "线性定常系统状态空间表达式的标准形式有能控标准形、能观标准形、对角标准形（A为对角矩阵）、约当标准形（A为约当矩阵）。ABCD选项均符合要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317848", "t": 2, "q": "线性定常系统状态空间表达式中，系统矩阵A的特征值的物理意义及影响，正确的有", "a": ["特征值的模值（离散系统）决定系统的衰减特性（模值<1渐近稳定）", "特征值的虚部决定系统响应的振荡频率（虚部越大，振荡频率越高）", "特征值实部的符号决定系统的稳定性（实部<0稳定，实部>0不稳定）", "特征值决定系统的固有动态特性（如衰减速度、振荡频率）", "", ""], "r": "ABCD", "e": "ABCD四个选项均正确。系统矩阵A的特征值对系统有重要影响，离散系统中特征值模值与衰减特性相关，模值小于1渐近稳定；特征值虚部影响系统响应振荡频率，虚部越大频率越高；实部符号决定稳定性，实部小于0稳定、大于0不稳定；特征值整体决定系统固有动态特性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317849", "t": 2, "q": "线性定常系统状态空间表达式中，直接传输矩阵D的特性及作用，正确的有", "a": ["D的存在不影响状态方程的解（x(t)仍由A、B、x(0)、u(t)决定）", "D描述输入信号对输出信号的直接影响，不经过状态变量的耦合", "D的维度为q×p（q为输出个数，p为输入个数）", "若D=0，则输出y(t)仅由状态变量x(t)决定（y=C x）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317850", "t": 2, "q": "线性定常系统状态空间建模的基本步骤包括", "a": ["根据系统的物理规律（如牛顿定律、基尔霍夫定律）或数学关系，建立状态方程（x_dot与x、u的关系）", "确定系统的输入变量u(t)和输出变量y(t)", "根据输出定义，建立输出方程（y与x、u的关系）", "选择能完全描述系统动态行为的状态变量x(t)", "", ""], "r": "ABCD", "e": "线性定常系统状态空间建模，首先要选能描述系统动态的状态变量，接着确定输入和输出变量，再根据物理或数学关系建状态方程，最后依输出定义建输出方程。答案顺序为D、B、A、C。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317851", "t": 2, "q": "线性定常系统状态转移矩阵Φ(t)的求解方法包括", "a": ["微分方程求解法: 通过求解x_dot = A x 的通解反推Φ(t)", "拉普拉斯变换法: Φ(t) = L⁻¹[(sI-A)⁻¹]（L⁻¹表示拉普拉斯逆变换）", "矩阵指数法: Φ(t) = e^(At) = I + At + (A²t²)/2! + (A³t³)/3! + ...（无穷级数）", "特征值分解法: 若A可对角化（特征值互异），则Φ(t) = P[e<sup>(λ₁t),0;0,e<\/sup>(λ₂t)]P⁻¹（P为特征向量矩阵）", "", ""], "r": "ABCD", "e": "以上A、B、C、D四个选项所提及的方法均是线性定常系统状态转移矩阵Φ(t)常见的求解方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317852", "t": 2, "q": "选择线性定常系统的状态变量时，需遵循的原则包括", "a": ["状态变量之间必须线性无关", "状态变量的个数等于系统的阶数（即系统微分方程的最高阶数）", "状态变量必须是物理上可直接测量的变量", "状态变量需能完全描述系统的动态行为（给定初始状态和输入可确定未来状态）", "", ""], "r": "ABD", "e": "状态变量要能完整描述系统动态，其个数应等于系统阶数且相互线性无关，并非必须物理上可直接测量。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317853", "t": 2, "q": "以下关于经典控制理论中\"PID控制\"与现代控制理论中\"状态反馈控制\"的对比，正确的有", "a": ["PID控制适用于SISO线性定常系统;状态反馈适用于MIMO、线性时变甚至非线性系统", "PID控制对不可测扰动的抑制能力较弱;状态反馈可通过观测器估计扰动，增强抗扰能力", "PID控制基于输出误差的比例、积分、微分调节，属于输出反馈;状态反馈基于所有状态变量，控制自由度更多", "PID控制参数整定依赖经验或试凑;状态反馈参数可通过极点配置等方法系统设计", "", ""], "r": "ABCD", "e": "A选项，PID一般用于SISO线性定常系统，状态反馈可用于MIMO、线性时变及非线性系统；B选项，PID对不可测扰动抑制能力弱，状态反馈可借观测器估计扰动提升抗扰能力；C选项，PID基于输出误差调节属输出反馈，状态反馈用所有状态变量，控制自由度更多；D选项，PID参数靠经验或试凑，状态反馈参数可用极点配置等系统设计。各选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317854", "t": 2, "q": "以下关于经典控制理论中传递函数与现代控制理论中状态空间表达式的对比，正确的有", "a": ["状态空间表达式可描述系统内部状态，包含的系统信息更丰富", "一个传递函数可对应多个状态空间表达式（状态变量选择不同）", "传递函数仅描述系统输入输出的外部关系，无法体现内部状态", "一个状态空间表达式仅对应一个传递函数（消去状态变量后唯一）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317855", "t": 2, "q": "以下关于能观性秩判据的适用范围，正确的有", "a": ["适用于线性定常连续系统", "适用于线性时变连续系统（需构造能观性Gram矩阵，非秩判据）", "不适用于非线性系统（非线性系统无统一的能观性秩判据）", "适用于线性定常离散系统", "", ""], "r": "ACD", "e": "能观性秩判据适用于线性定常连续系统和线性定常离散系统，线性时变连续系统一般用能观性Gram矩阵判断，非线性系统没有统一的能观性秩判据。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317856", "t": 2, "q": "以下关于能控性秩判据的适用范围，正确的有", "a": ["适用于线性定常离散系统", "不适用于非线性系统（非线性系统无统一的能控性秩判据）", "适用于线性时变连续系统（需构造能控性Gram矩阵，非秩判据）", "适用于线性定常连续系统", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317857", "t": 2, "q": "以下关于现代控制理论与经典控制理论在稳定性分析上的对比，正确的有", "a": ["经典控制理论的稳定性判据（如劳斯判据）是代数方法，而现代控制理论中的李雅普诺夫方法是一种直接方法。", "经典控制理论可以用来分析系统的全局稳定性，而现代控制理论仅限于局部稳定性的分析。", "经典控制理论适用于线性定常系统的稳定性分析，相比之下，现代控制理论能够处理线性时变及非线性系统的稳定性问题。", "在进行稳定性判断时，经典控制理论主要依赖于传递函数的极点位置或系统的频率响应特性;而现代控制理论则更多地依靠李雅普诺夫函数或是系统状态矩阵的特征值来进行分析。", "", ""], "r": "ACD", "e": "经典控制理论稳定性判据是代数方法，现代控制理论李雅普诺夫方法是直接法；经典控制理论适用于线性定常系统，现代控制理论能处理线性时变及非线性系统；经典控制理论靠传递函数极点或频率响应判断，现代控制理论靠李雅普诺夫函数或状态矩阵特征值分析。且现代控制理论可分析全局稳定性，经典控制理论多是局部分析。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317858", "t": 2, "q": "以下关于现代控制理论在工程领域应用的说法，正确的有", "a": ["在化工领域，可用于反应过程温度、压力等参数的过程控制", "在航空航天领域，可用于飞行器姿态控制、轨道跟踪控制", "在电力系统中，可用于发电机励磁控制、电力系统稳定控制", "在机器人领域，可用于机器人关节运动控制、路径规划控制", "", ""], "r": "ABCD", "e": "现代控制理论可广泛应用于各工程领域，A选项化工领域对反应过程参数控制、B选项航空航天领域飞行器姿态与轨道控制、C选项电力系统中发电机励磁与稳定控制、D选项机器人关节运动与路径规划控制，都能借助现代控制理论实现，四个选项说法均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317859", "t": 2, "q": "以下关于线性定常离散系统稳定性的判定方法，正确的有", "a": ["能控性矩阵判据:能控性矩阵秩等于n，则系统渐近稳定", "特征值判据:系统矩阵A的所有特征值模值均小于1，则平衡状态渐近稳定", "传递函数判据:离散传递函数的所有极点模值均小于1，则系统渐近稳定（针对能控能观系统）", "李雅普诺夫第二方法:构造正定V(x(k))，使ΔV(x(k))=V(x(k+1))-V(x(k))负定", "", ""], "r": "BCD", "e": "能控性矩阵判据和系统稳定性无直接关系，A错误；特征值判据中，系统矩阵A所有特征值模值小于1时，平衡状态渐近稳定，B正确；传递函数判据，对能控能观系统，离散传递函数所有极点模值小于1，系统渐近稳定，C正确；李雅普诺夫第二方法，构造正定V(x(k))，使ΔV(x(k))负定可判定渐近稳定，D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317860", "t": 2, "q": "以下关于线性定常系统能观标准形的说法，正确的有", "a": ["能观标准形便于观测器的设计（观测器增益矩阵计算更简便）", "能观标准形是通过非奇异线性变换，将能观系统的状态空间表达式转化为的标准形式", "能观标准形的输出矩阵C_o具有[1;0;...;0]的形式（第一行为1，其余为0）", "能观标准形的系统矩阵A_o是能控标准形系统矩阵A_c的转置（A_o=A_c^T）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317861", "t": 2, "q": "以下关于线性定常系统能观性的说法，错误的有", "a": ["若系统输出个数q≥n（n为系统阶数），则系统一定完全能观", "若系统存在某个状态x₀，其变化对输出y(t)无任何影响，则系统不完全能观", "若系统能观，则其能观性矩阵的行向量一定线性无关", "能观性与系统的稳定性无关（能观系统可能不稳定，不稳定系统可能能观）", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317862", "t": 2, "q": "以下关于线性定常系统能控标准形的说法，正确的有", "a": ["能控标准形是通过非奇异线性变换，将能控系统的状态空间表达式转化为的标准形式。", "能控标准形便于极点配置控制器的设计（反馈增益矩阵计算更简便）。", "能控标准形的系统矩阵A_c具有友矩阵形式（最后一行为特征多项式的系数的负值，其余行仅次对角线为1）。", "能控标准形的输入矩阵B_c具有[0;0;...;1]的形式（最后一行为1，其余为0）。", "", ""], "r": "ABCD", "e": "能控标准形是对能控系统经非奇异线性变换得到的标准形式，它便于极点配置设计，其系统矩阵是友矩阵，输入矩阵为最后一行是1其余为0的形式。ABCD选项均正确反映了能控标准形的性质。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317863", "t": 2, "q": "以下关于线性定常系统能控标准形与能观标准形的对偶关系，正确的有", "a": ["能观标准形系统的对偶系统是能控标准形系统", "能控标准形的系统矩阵A_c与能观标准形的系统矩阵A_o满足A_o=A_c^T", "能控标准形系统的对偶系统是能观标准形系统", "能控标准形的输入矩阵B_c与能观标准形的输出矩阵C_o满足C_o=B_c^T", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317864", "t": 2, "q": "以下关于线性定常系统状态转移矩阵Φ(t)的性质，错误的有", "a": ["Φ(t)的导数dΦ(t)/dt=AΦ(t)", "若A为奇异矩阵，则Φ(t)也为奇异矩阵", "Φ(t)的行列式值恒等于1", "Φ(t)与任意矩阵B均满足交换律（Φ(t)B=BΦ(t)）", "", ""], "r": "BCD", "e": "A 是状态转移矩阵基本性质；C 中 det(Φ(t)) = exp(∫tr(A)dt)，不一定恒为 1；D 中状态转移矩阵一般不与任意矩阵满足交换律；对于 B，可通过反例证明其错误，如 A 奇异时，Φ(t)=e^(At)不一定奇异。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317865", "t": 2, "q": "以下关于线性定常系统状态转移矩阵Φ(t)的运算性质，正确的有", "a": ["Φ(t₁+t₂)=Φ(t₁)Φ(t₂)（对任意实数t₁、t₂均成立）", "Φ(t)与系统矩阵A满足交换律:Φ(t)A=AΦ(t)", "Φ(-t)=Φ⁻¹(t)（Φ(t)为可逆矩阵）", "Φ(t)的行列式值det(Φ(t))=e^(tr(A)t)（tr(A)为A的迹，即对角线元素之和）", "", ""], "r": "ABCD", "e": "本题可根据线性定常系统状态转移矩阵「test/yiwen_img/importSubject/2034803669798621184.png」的性质逐一分析选项。### 选项A对于线性定常系统，状态转移矩阵「test/yiwen_img/importSubject/2034803669798621184.png」满足「test/yiwen_img/importSubject/2034803669886701568.png」（对任意实数「test/yiwen_img/importSubject/2034803669974781952.png」、「test/yiwen_img/importSubject/2034803670041890816.png」均成立），这是状态转移矩阵的基本性质之一，所以选项A正确。### 选项B因为「test/yiwen_img/importSubject/2034803670138359808.png」，根据矩阵指数函数的性质「test/yiwen_img/importSubject/2034803670218051584.png」，即「test/yiwen_img/importSubject/2034803670327103488.png」，所以「test/yiwen_img/importSubject/2034803669798621184.png」与系统矩阵A满足交换律，选项B正确。 ### 选项C由于「test/yiwen_img/importSubject/2034803670444544000.png」，所以「test/yiwen_img/importSubject/2034803670549401600.png」，且「test/yiwen_img/importSubject/2034803669798621184.png」为可逆矩阵，选项C正确。### 选项D根据凯莱 - 哈密顿定理，「test/yiwen_img/importSubject/2034803670658453504.png」，其中「test/yiwen_img/importSubject/2034803670742339584.png」为A的迹，即对角线元素之和，选项D正确。综上，ABCD四个选项均正确。故答案为ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317866", "t": 2, "q": "以下关于状态变量线性变换的目的及作用，正确的有", "a": ["减少状态变量的个数，降低系统复杂度", "将能控性矩阵或能观性矩阵变换为标准形（如能控标准形、能观标准形），便于控制器/观测器设计", "使状态变量具有更明确的物理意义，便于工程实现", "将系统矩阵A对角化或约当标准化，简化状态方程求解", "", ""], "r": "BCD", "e": "状态变量线性变换不改变系统本质特性，不能减少状态变量个数，A错误；可将能控、能观矩阵变标准形利于控制器/观测器设计，B正确；线性变换可让状态变量物理意义更明确，方便工程实现，C正确；能把系统矩阵A对角化或约当标准化，简化状态方程求解，D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317867", "t": 2, "q": "以下关于状态变量选择的非唯一性及影响，正确的有", "a": ["不同状态变量对应的系统矩阵A的特征值相同（特征值是系统固有属性）", "不同状态变量对应的状态转移矩阵Φ(t)形式可能不同，但描述的状态转移关系等价", "不同状态变量对应的状态空间表达式描述的是同一个系统（外部输入输出特性相同）", "不同状态变量对应的能控性和能观性相同（线性变换不改变能控能观性）", "", ""], "r": "ABCD", "e": "状态变量选择非唯一，系统特征值是系统固有属性，不同状态变量对应的A特征值相同；状态转移矩阵形式可能因状态变量不同有差异，但状态转移关系等价；不同状态变量描述同一系统，外部输入输出特性相同；线性变换不改变系统能控能观性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317868", "t": 2, "q": "以下属于现代控制理论核心研究内容的有", "a": ["系统的状态空间建模（连续、离散、线性、非线性）", "系统的控制策略设计（状态反馈、观测器、最优控制）", "系统的能控性与能观性分析", "系统的稳定性分析（李雅普诺夫第一、第二方法）", "", ""], "r": "ABCD", "e": "现代控制理论以状态空间法为基础，核心研究涵盖系统建模、控制策略设计、能控能观性分析及稳定性分析等。ABCD选项分别对应这些方面，都是其核心研究内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803678858317869", "t": 2, "q": "状态空间表达式线性变换（x=Pz，P为非奇异矩阵）的数学依据及特性，正确的有", "a": ["变换后系统的状态向量z与原状态向量x线性相关（z=P⁻¹x），描述同一系统的不同状态表示形式", "数学依据: 非奇异矩阵P可逆，线性变换是向量空间的一一映射（不丢失状态信息）", "变换后系统的闭环极点（A'=P⁻¹AP的特征值）与原系统极点（A的特征值）相同（特征值是相似变换下的不变量）", "变换后系统的输入矩阵B'=P⁻¹B，输出矩阵C'=CP，直接传输矩阵D'=D（D不受线性变换影响）", "", ""], "r": "ABCD", "e": "本题可根据状态空间表达式线性变换的相关知识，对各选项进行分析判断。### 选项A已知x = Pz，由于P为非奇异矩阵，即P可逆，那么两边同时左乘「test/yiwen_img/importSubject/2034803670817837056.png」可得「test/yiwen_img/importSubject/2034803670918500352.png」，这表明变换后系统的状态向量z与原状态向量x线性相关，它们只是描述同一系统的不同状态表示形式，所以选项A正确。### 选项B因为P是非奇异矩阵，所以P可逆。线性变换x = Pz是向量空间的一一映射，这意味着在变换过程中不会丢失状态信息，所以该线性变换有其数学依据，选项B正确。 ### 选项C对于状态空间表达式的线性变换，变换后系统矩阵「test/yiwen_img/importSubject/2034803669442105344.png」，由于矩阵的特征值是相似变换下的不变量，即A'和A相似，它们具有相同的特征值，也就是变换后系统的闭环极点与原系统极点相同，选项C正确。### 选项D在状态空间表达式线性变换x = Pz下，变换后系统的输入矩阵「test/yiwen_img/importSubject/2034803670998192128.png」，输出矩阵C' = CP，直接传输矩阵D' = D（因为D表示输入到输出的直接传输关系，不受状态变量线性变换的影响），选项D正确。综上，ABCD四个选项均正确。答案：ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350848", "t": 3, "q": "线性定常离散系统的状态转移矩阵Φ(k)满足Φ(k₁+k₂)=Φ(k₁)Φ(k₂)，其中k₁、k₂为非负整数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于线性定常离散系统，状态转移矩阵「test/yiwen_img/importSubject/2034803671098855424.png」有性质「test/yiwen_img/importSubject/2034803671182741504.png」 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350849", "t": 3, "q": "线性定常齐次状态方程(\\dot{x} = Ax)，若系统矩阵(A)为奇异矩阵（即(\\det(A) = 0)），则系统仅有(x_e = 0)一个平衡状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "对于线性定常齐次状态方程「test/yiwen_img/importSubject/2034803671295987712.png」，平衡状态满足「test/yiwen_img/importSubject/2034803671367290880.png」。当「test/yiwen_img/importSubject/2034803668754239488.png」时，Ax = 0有非零解，意味着除「test/yiwen_img/importSubject/2034803671455371264.png」外还有其他平衡状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350850", "t": 3, "q": "线性定常齐次状态方程(\\dot{x}=Ax)的解(x(t)=\\Phi(t)x(0))，其中状态转移矩阵(\\Phi(t))满足(\\Phi(0)=)单位矩阵(I)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于线性定常齐次状态方程「test/yiwen_img/importSubject/2034803671295987712.png」，其解为「test/yiwen_img/importSubject/2034803671526674432.png」，状态转移矩阵「test/yiwen_img/importSubject/2034803669798621184.png」有性质「test/yiwen_img/importSubject/2034803671635726336.png」。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350851", "t": 3, "q": "线性定常系统（A,B）能控的充要条件是能控性矩阵C=[B AB...A^(n-1)B]的秩等于状态变量个数n。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350852", "t": 3, "q": "线性定常系统（A,C）能观的充要条件是能观性矩阵O=[C;CA;...;CA^(n-1)]的秩等于系统阶数n。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是线性定常系统能观性的基本判定定理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350853", "t": 3, "q": "线性定常系统的传递函数存在零极点对消，若对消的是稳定极点（实部<0），则系统整体是稳定的（虽存在不能控或不能观状态，但不影响稳定性）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统零极点对消稳定极点时，系统存在不能控或不能观状态，稳定性由未对消的极点决定，若未对消极点都稳定，系统整体稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350854", "t": 3, "q": "线性定常系统的传递函数矩阵G（　）=C(sI-A)⁻¹B+D，其中D矩阵描述了输入对输出的直接影响，与状态变量无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在传递函数矩阵表达式中，D矩阵体现的就是输入对输出的直接关联，不涉及系统状态变量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350855", "t": 3, "q": "线性定常系统的传递函数实现不唯一，不同的实现对应的系统能控性和能观性可能不同（有的能控能观，有的不完全能控或能观）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统传递函数的实现存在多种方式，且不同实现下系统的能控性和能观性会有差异。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350856", "t": 3, "q": "线性定常系统的观测器误差方程为e_dot=(A-LC)e，其中L是观测器增益。若(A-LC)的所有特征值实部均小于0，则误差e会收敛到0。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于线性定常系统的观测器误差方程「test/yiwen_img/importSubject/2034803671728001024.png」，这是一个齐次线性微分方程。根据线性系统稳定性理论，当矩阵(A - LC)的所有特征值实部均小于0时，该系统是渐近稳定的，意味着误差e会随着时间收敛到0。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350857", "t": 3, "q": "线性定常系统的能观性观测器，其核心作用是估计系统的不可测状态变量，使估计状态与真实状态的误差收敛到零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统能观性观测器的主要功能就是估计不可测的状态变量，并且能让估计状态和真实状态的误差渐近收敛到零。", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350858", "t": 3, "q": "线性定常系统的能观性观测器设计中，观测器的阶数必须与原系统阶数相同（全维观测器），无法设计阶数更低的观测器。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。线性定常系统除了全维观测器（阶数与原系统阶数相同），还可以设计降维观测器，即阶数低于原系统阶数的观测器。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350859", "t": 3, "q": "线性定常系统的能观性观测器设计中，观测器增益矩阵L的选择唯一，不同的L会导致误差收敛速度相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统能观性观测器设计里，观测器增益矩阵L不唯一，不同的L会使误差收敛速度不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350860", "t": 3, "q": "线性定常系统的能观性矩阵O=[C;CA;...;CA^(n-1)]，若系统完全能观，则O的行向量线性无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统完全能观的充要条件是能观性矩阵O的秩为n，即O的列向量线性无关，而非行向量线性无关。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350861", "t": 3, "q": "线性定常系统的能观性矩阵O=[C;CA;...;CA^(n-1)]的维度为nq×n，其中n是系统阶数，q是输出个数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "能观性矩阵 O 中，C 是 q×n 矩阵，CA 是 q×n 矩阵，……，CA^(n - 1) 是 q×n 矩阵，将它们按行堆叠，共有 n 个 q×n 矩阵，所以维度为 nq×n。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350862", "t": 3, "q": "线性定常系统的能观性矩阵O的秩小于系统阶数n时，系统存在不能观的状态，这些不能观状态的变化无法通过输出反映。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统能观性判断依据为能观性矩阵O的秩，当秩等于系统阶数n，系统完全能观；秩小于n，存在不能观状态，不能观状态的变化确实无法从输出反映。", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350863", "t": 3, "q": "线性定常系统的能观性是设计观测器的必要前提（系统不完全能观，则无法设计观测器估计所有状态）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "观测器设计目的是估计系统所有状态，若系统不完全能观，部分状态信息无法从输出获取，就不能设计观测器估计所有状态，所以能观性是设计观测器的必要前提。", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350864", "t": 3, "q": "线性定常系统的能控能观分解中，能控但不能观的子系统对应的极点，会在系统的传递函数中出现（因传递函数包含该部分信息）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统能控能观分解中，系统传递函数只反映能控又能观子系统的动力学特性，能控但不能观子系统对应的极点不会在传递函数中出现。", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350865", "t": 3, "q": "线性定常系统的能控性和能观性对偶原理，可用于将观测器设计问题转化为控制器设计问题，简化设计过程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统的能控性和能观性对偶原理建立了系统能控性和能观性之间的联系，利用该原理可将观测器设计问题转化为对应的控制器设计问题，从而简化设计。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350866", "t": 3, "q": "线性定常系统的能控性和能观性对偶原理指出，若系统S=(A,B,C)完全能控，则其对偶系统S'=(A<sup>T,C<\/sup>T,B^T)完全能观。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统能控性和能观性对偶原理表明，系统S=(A,B,C)完全能控等价于其对偶系统「test/yiwen_img/importSubject/2034803671828664320.png」完全能观。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350867", "t": 3, "q": "线性定常系统的能控性和能观性是系统的固有属性，与系统的输入、输出无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "能控性和能观性反映的是系统自身的结构和参数特性，描述系统状态能否被控制以及能否由输出观测到，不依赖于输入、输出的具体情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350868", "t": 3, "q": "线性定常系统的能控性和能观性是相互独立的，一个系统可能完全能控但不完全能观，也可能完全能观但不完全能控。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统能控性和能观性描述的是系统不同方面的特性，二者相互独立，存在能控但不能观、能观但不能控的系统。", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350869", "t": 3, "q": "线性定常系统的能控性矩阵C=[B AB...A^(n-1)B]的维度为n×np，其中n是系统阶数，p是输入个数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350870", "t": 3, "q": "线性定常系统的能控性矩阵C的秩小于系统阶数n时，系统存在不能控的状态，这些不能控状态的动态行为不受输入影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统能控性的判定依据是能控性矩阵的秩，当能控性矩阵秩小于系统阶数n，就表明系统存在不能控状态，这些状态的动态行为确实不受输入影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350871", "t": 3, "q": "线性定常系统的能控性在非奇异线性变换（x=Pz，P可逆）下会发生改变（原系统能控，变换后可能不能控）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统的能控性在非奇异线性变换下是保持不变的，这是线性系统理论的基本性质。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350872", "t": 3, "q": "线性定常系统的能控性秩判据适用于所有线性系统（包括定常、时变、连续、离散系统）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统的能控性秩判据仅适用于线性定常系统，并非适用于所有线性系统（时变系统有专门的时变系统能控性判据等）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350873", "t": 3, "q": "线性定常系统的能控性Gram矩阵(W_c=\\int_0<sup>T\\Phi(<\/sup><sup>\tau)BB<\/sup>T\\Phi^T(\tau)d\tau)，若系统完全能控，则对任意(T>0)，(W_c)均为正定矩阵。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据线性定常系统能控性Gram矩阵的性质，若系统完全能控，对于任意的T>0，能控性Gram矩阵「test/yiwen_img/importSubject/2034803671916744704.png」必定是正定矩阵。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350874", "t": 3, "q": "线性定常系统的能控性Gram矩阵(W_c=\\int_0<sup>T\\Phi(<\/sup><sup>\tau)BB<\/sup>T\\Phi^T(\tau)d\tau)，若(W_c)为正定矩阵，则系统完全能控。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于线性定常系统，能控性Gram矩阵 「test/yiwen_img/importSubject/2034803671983853568.png」 ，当 「test/yiwen_img/importSubject/2034803671916744704.png」 为正定矩阵时，满足系统状态能控性的充分必要条件，所以可判定系统完全能控。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350875", "t": 3, "q": "线性定常系统的输出反馈控制，无法实现系统闭环极点的任意配置（即使系统完全能控能观）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350876", "t": 3, "q": "线性定常系统的输出反馈控制会改变系统的能观性（原系统能观，加入输出反馈后可能不能观）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统的输出反馈控制不改变系统的能观性，原系统能观，加入输出反馈后依然能观。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350877", "t": 3, "q": "线性定常系统的输出反馈控制中，反馈信号仅来自输出变量，无需估计状态变量，因此比状态反馈控制更易于工程实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "输出反馈信号仅源于输出变量，不用像状态反馈那样估计状态变量，在工程中实现起来相对简单。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350878", "t": 3, "q": "线性定常系统的系统矩阵A的特征值与系统的极点是同一概念，特征值即极点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统中，系统矩阵A的特征值就是系统传递函数的极点，二者概念一致。", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350879", "t": 3, "q": "线性定常系统的系统矩阵A为对角矩阵时，其状态变量之间相互独立（无耦合），每个状态变量的动态行为仅由自身和对应的输入决定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当线性定常系统的系统矩阵A为对角矩阵时，状态方程中各状态变量的导数只与自身状态变量和对应输入有关，不存在其他状态变量的耦合影响，所以状态变量相互独立。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350880", "t": 3, "q": "线性定常系统的状态变量必须是物理上可测量的变量（如电压、电流、位置），不可测量的变量不能作为状态变量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统状态变量不一定要是物理上可测量的变量，不可测量的变量也能作为状态变量。", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350881", "t": 3, "q": "线性定常系统的状态变量线性变换x=Pz（P为非奇异矩阵），变换后系统的系统矩阵A'=PAP⁻¹。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350882", "t": 3, "q": "线性定常系统的状态变量选择是唯一的，不同的状态变量选择会导致系统的动态特性改变。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统的状态变量选择不唯一，不同状态变量选择只是描述方式不同，系统动态特性由系统本身决定，不会改变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350883", "t": 3, "q": "线性定常系统的状态反馈控制器设计中，反馈增益矩阵K的选择唯一，不同的K会导致系统的动态特性改变。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线性定常系统状态反馈控制器设计中，反馈增益矩阵K不唯一，可根据不同性能指标设计不同的K，不同K会使系统动态特性改变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350884", "t": 3, "q": "线性定常系统的状态反馈控制中，若系统完全能控，则可通过选择合适的反馈增益矩阵K，将闭环系统的极点配置到任意期望位置。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统能控性是极点任意配置的充要条件，系统完全能控时，就可通过合适反馈增益矩阵K把闭环系统极点配置到任意期望位置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350885", "t": 3, "q": "线性定常系统的状态反馈控制中，引入参考输入v后，闭环系统的状态方程为x_dot=(A-BK)x+Bv，其中K是反馈增益矩阵。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350886", "t": 3, "q": "线性定常系统的状态空间表达式\"最小实现\"是指阶数最低的实现，其充分必要条件是系统完全能控且完全能观。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统“最小实现”就是阶数最低的实现，而系统能达到最小实现的充要条件就是完全能控且完全能观。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350887", "t": 3, "q": "线性定常系统的状态空间表达式中，系统矩阵A的迹（tr(A)）等于所有特征值的和，行列式（det(A)）等于所有特征值的积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在矩阵理论中，对于任意方阵，其迹等于所有特征值之和，行列式等于所有特征值之积，线性定常系统的系统矩阵A是方阵，所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350888", "t": 3, "q": "线性定常系统的状态空间表达式中，当直接传输矩阵D=0时，输出y(t)仅由状态变量x(t)决定（y=Cx），与输入u(t)无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统状态空间表达式中，输出方程一般为y = Cx+Du，当D = 0时，输出方程变为y = Cx，此时输出y(t)只与状态变量x(t)有关，与输入u(t)无直接关联。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350889", "t": 3, "q": "线性定常系统的状态空间表达式x_dot=Ax+Bu，y=Cx+Du中，系统矩阵A的维度由输入变量个数决定（输入个数越多，A的维度越大）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统矩阵A的维度由系统的状态变量个数决定，而非输入变量个数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350890", "t": 3, "q": "线性定常系统的状态转移矩阵Φ(t)，若A为零矩阵，则Φ(t)=I（单位矩阵）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统状态转移矩阵「test/yiwen_img/importSubject/2034803670138359808.png」，当A为零矩阵时，根据矩阵指数定义「test/yiwen_img/importSubject/2034803672084516864.png」，此时At为零矩阵，那么「test/yiwen_img/importSubject/2034803672172597248.png」。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350891", "t": 3, "q": "线性定常系统的状态转移矩阵Φ(t)的导数dΦ(t)/dt=AΦ(t)=Φ(t)A，即Φ(t)与A满足交换律。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于线性定常系统，状态转移矩阵「test/yiwen_img/importSubject/2034803669798621184.png」满足「test/yiwen_img/importSubject/2034803672243900416.png」，这表明「test/yiwen_img/importSubject/2034803669798621184.png」与A在乘法运算中满足交换律。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350892", "t": 3, "q": "线性定常系统的状态转移矩阵Φ(t)仅与系统矩阵A有关，与输入矩阵B、输出矩阵C无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性定常系统状态转移矩阵Φ(t)由系统矩阵A通过矩阵指数运算得到，即Φ(t)=e^(At)，与输入矩阵B、输出矩阵C无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350893", "t": 3, "q": "线性定常系统的状态转移矩阵Φ(t)满足Φ(t₁+t₂)=Φ(t₁)Φ(t₂)，对任意实数t₁、t₂均成立。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据线性定常系统状态转移矩阵性质，Φ(t₁ + t₂) = Φ(t₁)Φ(t₂) 对任意实数 t₁、t₂ 均成立。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350894", "t": 3, "q": "线性定常系统的状态转移矩阵Φ(t)是可逆矩阵，其逆矩阵为Φ(-t)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据线性定常系统状态转移矩阵性质，Φ(t)Φ(-t)=I，满足可逆矩阵定义，且逆矩阵为Φ(-t)。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350895", "t": 3, "q": "状态反馈控制会改变线性定常系统的能控性（原系统能控，加入状态反馈后可能不能控）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "状态反馈控制不改变线性定常能控系统的能控性。若原系统能控，加入状态反馈后系统依然能控。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350896", "t": 3, "q": "状态空间表达式的线性变换x=Pz（P为非奇异矩阵），会改变系统的传递函数矩阵G（　）（原系统与变换后系统的G（　）不同）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "状态空间表达式经线性变换x = Pz（P为非奇异矩阵），系统本质特性不变，传递函数矩阵也不变。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803681190350897", "t": 3, "q": "状态转移矩阵Φ(t)的行列式det(Φ(t))=e^(tr(A)t)，其中tr(A)是系统矩阵A的迹（对角线元素之和）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是线性系统理论中状态转移矩阵的一个重要性质，即状态转移矩阵Φ(t)的行列式等于e的tr(A)t次幂，tr(A)是系统矩阵A的迹。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 发电过程建模与辨识（1）", "n": "基础练习题【含解析】 / 第3章 发电过程建模与辨识（1）", "qs": [{"id": "2034803687091736576", "t": 1, "q": "采用欧拉法对热工系统微分方程进行数值积分时，若系统为快变过程（如汽轮机调门动态），选择过大步长会导致什么问题?", "a": ["仅影响稳态解精度，不影响动态解", "数值解与真实解偏差增大，甚至出现数值振荡", "无法求解非线性系统方程", "计算量显著增加，降低仿真效率", "", ""], "r": "B", "e": "欧拉法步长过大时，误差积累会使数值解与真实解偏差增大，严重时会出现数值振荡，快变过程对步长更敏感。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736577", "t": 1, "q": "采用数值积分法求解热工系统微分方程时，若系统模型为非线性（如锅炉燃烧非线性），下列说法正确的是?", "a": ["需采用变步长积分，以适应非线性带来的动态变化", "非线性模型的数值积分精度与线性模型完全相同", "仅能采用显式欧拉法，无法采用龙格-库塔法", "非线性模型无需数值积分，可直接求解析解", "", ""], "r": "A", "e": "非线性系统动态变化复杂，变步长积分能根据系统变化调整步长以适应其动态，A正确；非线性模型和线性模型数值积分精度不同，B错误；非线性模型可采用龙格 - 库塔法等多种方法，C错误；多数非线性模型难以直接求解析解，需数值积分，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736578", "t": 1, "q": "对于二阶欠阻尼动态模型，其单位阶跃响应的\"调整时间ts\"（通常取5%或2%误差带）主要与下列哪项参数相关?", "a": ["纯延迟时间τ", "放大系数K", "阻尼比ζ和固有频率ωn", "时间常数T", "", ""], "r": "C", "e": "二阶欠阻尼动态模型单位阶跃响应调整时间ts公式与阻尼比ζ和固有频率ωn相关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736579", "t": 1, "q": "对于二阶振荡环节动态模型，其\"阻尼振荡频率ωd\"与固有频率ωn、阻尼比ζ的关系是?", "a": ["ωd=ωn×√(1-ζ²)", "ωd=ωn×ζ", "ωd=ωn×√(ζ²-1)", "ωd=ωn/ζ", "", ""], "r": "A", "e": "二阶振荡环节中阻尼振荡频率ωd 与固有频率ωn、阻尼比ζ 的关系是ωd = ωn×√(1 - ζ²)。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736580", "t": 1, "q": "对于二阶振荡环节动态模型（传递函数为ωn²/(s²+2ζωns+ωn²)），当阻尼比ζ=0时，其单位阶跃响应特点是?", "a": ["发散振荡，无法稳定", "等幅振荡，无稳态值", "无超调，单调趋近稳态值", "衰减振荡，超调量最大", "", ""], "r": "B", "e": "二阶振荡环节阻尼比ζ = 0时，系统无阻尼，单位阶跃响应会呈现等幅振荡，不会稳定到某个稳态值。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736581", "t": 1, "q": "对于发电过程中的纯延迟环节（传递函数为e^(-τs)），下列描述正确的是?", "a": ["纯延迟环节可通过增大数值积分步长消除", "纯延迟环节的输出幅值随延迟时间τ增大而减小", "纯延迟环节的输出与输入波形相同，仅在时间上滞后τ", "纯延迟环节的动态特性受系统负荷影响，τ随负荷增大而减小", "", ""], "r": "C", "e": "纯延迟环节特点就是输出与输入波形一样，只是时间上滞后延迟时间τ 。A选项，纯延迟环节无法通过增大数值积分步长消除；B选项，输出幅值不受延迟时间影响；D选项，纯延迟环节动态特性不受系统负荷影响。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736582", "t": 1, "q": "发电过程中，二阶振荡环节动态模型的\"固有频率ωn\"反映了系统的什么特性?", "a": ["系统的阻尼程度", "系统响应的振荡频率快慢", "系统的纯延迟大小", "系统的稳态输出幅值", "", ""], "r": "B", "e": "固有频率ωn体现系统响应振荡的快慢，值越大振荡越快。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736583", "t": 1, "q": "发电过程中，二阶振荡环节动态模型的\"固有频率ωn\"增大，对其单位阶跃响应的影响是?", "a": ["响应速度加快，振荡频率升高", "超调量减小，稳态值降低", "响应速度减慢，振荡频率降低", "超调量增大，稳态值升高", "", ""], "r": "A", "e": "固有频率ωn增大，系统响应速度加快，且振荡频率与ωn相关，ωn增大振荡频率升高。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736584", "t": 1, "q": "发电过程中，二阶振荡环节动态模型的单位阶跃响应\"无振荡\"的条件是?", "a": ["ζ≥1", "0<ζ<1", "阻尼比ζ<0", "ζ=0", "", ""], "r": "A", "e": "二阶振荡环节单位阶跃响应特性与阻尼比ζ有关，当ζ≥1 时响应无振荡。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736585", "t": 1, "q": "发电过程中，二阶振荡环节动态模型的单位阶跃响应出现\"衰减振荡\"的条件是?", "a": ["0<ζ<1", "ζ=1", "ζ>1", "阻尼比ζ=0", "", ""], "r": "A", "e": "在发电过程中，二阶振荡环节动态模型的单位阶跃响应出现“衰减振荡”的条件主要与阻尼比ζ有关。阻尼比ζ决定了系统的稳定性和响应特性。 当0<ζ<1时，系统处于欠阻尼状态，单位阶跃响应会出现衰减振荡。 当ζ=1时，系统处于临界阻尼状态，单位阶跃响应不会出现振荡，而是单调上升。 当ζ>1时，系统处于过阻尼状态，单位阶跃响应也是单调上升，但上升速度更慢。 当ζ=0时，系统处于无阻尼状态，单位阶跃响应会出现等幅振荡，而不是衰减振荡。综上所述，只有当0<ζ<1时，单位阶跃响应才会出现衰减振荡。所以，正确答案是A选项：“0<ζ<1”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736586", "t": 1, "q": "发电过程中，二阶振荡环节动态模型的阻尼比ζ=1时，其单位阶跃响应称为?", "a": ["临界阻尼响应", "无阻尼响应", "过阻尼响应", "欠阻尼响应", "", ""], "r": "A", "e": "当二阶振荡环节动态模型的阻尼比ζ = 1时，其单位阶跃响应是临界阻尼响应。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736587", "t": 1, "q": "发电过程中，二阶振荡环节动态模型的阻尼比ζ在0<ζ<1范围内时，其单位阶跃响应的超调量σ%随ζ增大的变化趋势是?", "a": ["σ%增大", "σ%不变", "σ%先增大后减小", "σ%减小", "", ""], "r": "D", "e": "二阶振荡环节超调量公式「test/yiwen_img/importSubject/2034803682209566720.png」 ，在「test/yiwen_img/importSubject/2034803682423476224.png」范围，ζ 增大时超调量「test/yiwen_img/importSubject/2034803682540916736.png」会减小。答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736588", "t": 1, "q": "发电过程中，描述给煤机给煤量动态特性的模型常为一阶惯性环节，若给煤机的转速阶跃升高，给煤量的响应特点是?", "a": ["瞬间达到最大给煤量", "先快速升高，再缓慢趋近稳态给煤量", "缓慢升高，无超调，最终达到稳态给煤量", "先超调，再衰减至稳态给煤量", "", ""], "r": "B", "e": "一阶惯性环节的特点是当输入发生变化时，输出会先快速响应，然后逐渐趋于稳定，不会超过其最终稳态值。在给煤机的例子中，当转速阶跃升高时，给煤量会先快速增加，然后由于系统的惯性，增加速度会放缓，最终稳定在一个新的给煤量上。A选项描述的是瞬间达到最大值，这不符合一阶惯性环节的特性，因为系统会有一个过渡过程。B选项描述的是先快速升高，再缓慢趋近稳态给煤量，这符合一阶惯性环节的动态特性。C选项描述的是缓慢升高，无超调，这与一阶惯性环节的快速响应特性不符。D选项描述的是先超调，再衰减至稳态给煤量，这通常是一阶系统带有延迟或二阶系统可能出现的情况，并不符合一阶惯性环节的特性。综上所述，B选项最符合一阶惯性环节在转速阶跃升高时给煤量的响应特点。所以，正确答案是B选项：“先快速升高，再缓慢趋近稳态给煤量”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736589", "t": 1, "q": "发电过程中，描述给水泵流量动态特性的模型常为一阶惯性环节，若给水泵出口阀门开度阶跃增大，其流量响应的特点是?", "a": ["缓慢上升，无超调，最终达到稳态流量", "先快速上升，再缓慢趋近稳态流量", "瞬间达到最大流量，无延迟", "先超调，再衰减振荡至稳态流量", "", ""], "r": "A", "e": "一阶惯性环节的响应特点是系统输出不会瞬间变化，而是缓慢上升，无超调，最终达到稳态值。给水泵流量动态特性为一阶惯性环节，当出口阀门开度阶跃增大，流量会缓慢上升，无超调，最终达到稳态流量。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736590", "t": 1, "q": "发电过程中，描述过热器出口温度动态特性的模型常含纯延迟环节，其纯延迟产生的主要原因是?", "a": ["过热器管道的散热损失", "燃料燃烧的反应时间", "汽轮机调门的动作延迟", "蒸汽在过热器管道内的流动时间", "", ""], "r": "D", "e": "纯延迟主要是由于蒸汽在过热器管道内流动需要时间，导致输入变化不能立即反映到输出上。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736591", "t": 1, "q": "发电过程中，描述过热器减温喷水动态特性的模型常为一阶惯性环节，若减温喷水量阶跃增大，过热器出口温度的响应特点是?", "a": ["保持不变，因喷水不影响温度", "瞬间降至最低", "先降低再升高，出现超调", "缓慢降低，无超调，最终达到稳态温度", "", ""], "r": "D", "e": "过热器减温喷水模型为一阶惯性环节，其特点是输出响应不会突变。减温喷水量阶跃增大时，出口温度会缓慢降低，无超调，最终达到稳态温度。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736592", "t": 1, "q": "发电过程中，描述炉膛压力动态特性的模型常为一阶惯性环节，若引风机挡板开度阶跃增大，炉膛压力的响应特点是?", "a": ["缓慢降低，无超调，最终达到稳态值", "瞬间降至最低，再回升至稳态值", "保持不变，因炉膛压力不受引风机影响", "先降低再升高，出现超调后稳定", "", ""], "r": "A", "e": "引风机挡板开度阶跃增大，引风量增加，炉膛压力会降低。一阶惯性环节的响应特点是无超调，压力缓慢变化最终达到稳态值。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736593", "t": 1, "q": "发电过程中，描述磨煤机出口煤粉浓度动态特性的模型常为一阶惯性环节，其时间常数T较大的原因是?", "a": ["磨煤机内煤粉的混合、输送过程存在较大惯性", "磨煤机转速过低", "煤粉浓度测量仪表响应慢", "给煤量波动小", "", ""], "r": "A", "e": "磨煤机内煤粉混合、输送有较大惯性，导致煤粉浓度变化滞后，使模型时间常数T较大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736594", "t": 1, "q": "发电过程中，描述磨煤机出力动态特性的模型多为一阶惯性环节，其时间常数T较大的主要原因是?", "a": ["给煤机的给煤量波动小", "磨煤机出口煤粉浓度检测滞后", "磨煤机转速固定，无法调整", "煤的破碎、干燥过程存在较大惯性", "", ""], "r": "D", "e": "磨煤机时间常数T较大是因为煤的破碎、干燥过程复杂，存在较大惯性，影响磨煤机出力动态响应。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736595", "t": 1, "q": "发电过程中，描述凝汽器真空度动态特性的模型常含纯延迟环节，其纯延迟主要源于?", "a": ["凝汽器冷却水量的变化延迟", "汽轮机排汽量变化到真空度变化的传递延迟", "循环水泵的启动延迟", "真空度测量仪表的响应延迟", "", ""], "r": "B", "e": "纯延迟是指输入变化后，输出需经过一段时间才开始变化。在发电过程中，汽轮机排汽量变化到真空度变化存在传递延迟，这就是凝汽器真空度动态特性模型中纯延迟的主要来源。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736596", "t": 1, "q": "发电过程中，描述汽轮机调门动态特性的模型常为一阶惯性环节，其时间常数T较小的原因是?", "a": ["调门的测量延迟小", "调门动作由伺服机构控制，响应速度快", "调门的惯性与机组负荷无关", "调门不受蒸汽压力影响", "", ""], "r": "B", "e": "汽轮机调门由伺服机构控制，能快速响应控制信号，动作迅速，所以时间常数T较小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736597", "t": 1, "q": "发电过程中，描述汽轮机转速动态特性的模型常与一阶惯性环节结合，其核心原因是?", "a": ["转速控制无需考虑稳定性", "转速测量存在较大纯延迟", "汽轮机转速不受负荷影响", "汽轮机的转动惯量导致转速变化存在惯性", "", ""], "r": "D", "e": "汽轮机有转动惯量，这使得其转速变化不能瞬间完成，存在惯性，所以描述其转速动态特性的模型常与一阶惯性环节结合。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736598", "t": 1, "q": "发电过程中，一阶惯性环节动态模型的\"时间常数T\"与系统响应速度的关系是?", "a": ["T越大，响应速度越快（达到稳态时间短）", "T越小，响应速度越快", "T越大，响应速度先快后慢", "T与响应速度无关，仅与稳态值相关", "", ""], "r": "B", "e": "时间常数T反映系统响应速度，T越小系统响应越快，达到稳态时间越短。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736599", "t": 1, "q": "发电过程中，一阶惯性环节动态模型的传递函数1/(Ts+1)中，“放大系数K”的物理意义是?", "a": ["系统的阻尼程度", "系统的纯延迟大小", "系统输出稳态值与输入稳态值的比值", "系统响应速度的快慢", "", ""], "r": "C", "e": "放大系数K表示系统输出稳态值与输入稳态值的比值。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736600", "t": 1, "q": "发电过程中，一阶惯性环节动态模型的传递函数1/(Ts+1)中，时间常数T的单位通常是?", "a": ["帕斯卡（Pa）", "米（　）", "秒（　）", "千瓦（kW）", "", ""], "r": "C", "e": "时间常数描述的是系统响应的时间特性，单位是时间单位。选项中只有秒是时间单位。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736601", "t": 1, "q": "发电过程中，一阶惯性环节动态模型的单位阶跃响应达到稳态值63.2%所需的时间是?", "a": ["3T", "T", "T/2", "2T", "", ""], "r": "B", "e": "一阶惯性环节单位阶跃响应达到稳态值63.2%所需时间为时间常数T。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736602", "t": 1, "q": "发电过程中，一阶惯性环节动态模型的单位阶跃响应达到稳态值98%所需的时间约为?", "a": ["3T", "4T", "2T", "5T", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736603", "t": 1, "q": "关于系统辨识的\"可辨识性\"，下列说法正确的是?", "a": ["可辨识性仅与系统本身特性有关，与输入信号无关", "只要采集足够多的输入输出数据，任何系统都可辨识", "线性定常系统的可辨识性需满足输入信号持续激励条件", "若系统存在不可观测状态，该系统一定不可辨识", "", ""], "r": "C", "e": "线性定常系统要能被辨识，输入信号需满足持续激励条件。A 项可辨识性与输入信号有关；B 项并非采集足够多数据任何系统都可辨识；D 项系统存在不可观测状态，不一定不可辨识。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736604", "t": 1, "q": "机炉协调控制系统控制模型中，锅炉侧的\"热量信号\"通常由哪些参数综合计算得到，以反映锅炉的实际供热能力?", "a": ["炉膛温度和烟气含氧量", "主蒸汽流量和主蒸汽压力", "汽包水位和给水流量", "燃料量、送风量和给水量", "", ""], "r": "D", "e": "机炉协调控制系统中的锅炉侧“热量信号”主要是用来反映锅炉的实际供热能力。为了得到这个信号，我们需要考虑哪些参数能够综合反映锅炉的热量产生情况。A选项中的炉膛温度和烟气含氧量，虽然可以反映燃烧的情况，但不足以全面代表锅炉的热量信号。B选项的主蒸汽流量和主蒸汽压力，更多地是反映锅炉的输出状态，而不是锅炉的热量产生。C选项的汽包水位和给水流量，与锅炉的水循环和给水情况有关，但并不直接反映锅炉的热量信号。D选项的燃料量、送风量和给水量，则直接关联到锅炉的燃烧过程和热量产生。燃料量决定了热量的基本输入，送风量影响燃烧的效率和完全度，而给水量则与锅炉的蒸发量相关，这三者综合起来可以较好地反映锅炉的实际供热能力。因此，正确答案是D选项：“燃料量、送风量和给水量”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736605", "t": 1, "q": "机炉协调控制系统中，\"协调控制\"模式下，当负荷指令提升时，汽轮机调门和锅炉燃烧率的调整策略是?", "a": ["两者同时调整，锅炉燃烧率调整幅度更大", "锅炉燃烧率先增加，汽轮机调门滞后开大", "两者同时调整，汽轮机调门调整幅度更大", "汽轮机调门先开大，锅炉燃烧率滞后增加", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736606", "t": 1, "q": "机炉协调控制系统中，当主蒸汽压力实际值低于设定值时，若采用\"炉跟机\"模式，锅炉侧的调整策略是?", "a": ["增大汽轮机调门开度，增加蒸汽流量", "减小燃料量，降低锅炉出力", "增大燃料量和给水量，提高锅炉出力", "减小送风量，降低燃烧效率", "", ""], "r": "C", "e": "主蒸汽压力实际值低于设定值，需提高压力，“炉跟机”模式下应调整锅炉。增大燃料量和给水量可提高锅炉出力，进而提升蒸汽压力。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736607", "t": 1, "q": "机炉协调系统控制模型中，\"反馈控制\"的核心作用是?", "a": ["简化模型结构，降低计算量", "仅控制系统的稳态特性，不控制动态特性", "提前补偿已知扰动的影响", "消除系统因扰动或模型误差导致的偏差", "", ""], "r": "D", "e": "反馈控制是将系统输出结果反馈回来与设定值比较，以消除因扰动或模型误差导致的偏差。A选项简化模型结构不是反馈控制核心作用；B选项反馈控制对动态和稳态特性都有控制；C选项提前补偿已知扰动是前馈控制作用。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736608", "t": 1, "q": "机炉协调系统控制模型中，“负荷指令”经过“负荷指令管理回路”修正后，输出的指令称为?", "a": ["锅炉负荷指令", "汽轮机负荷指令", "电网负荷指令", "实际负荷指令（或机组负荷指令）", "", ""], "r": "D", "e": "“负荷指令”经“负荷指令管理回路”修正后得到的是实际负荷指令（或机组负荷指令）。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736609", "t": 1, "q": "机炉协调系统控制模型中，“负荷指令的变化率限制”主要是为了防止?", "a": ["主蒸汽温度过低", "汽轮机转速过高", "锅炉侧参数（如燃料量、给水量）调整过快，导致参数波动过大", "凝汽器真空度过高", "", ""], "r": "C", "e": "负荷指令变化率限制目的是避免锅炉侧参数调整过快，防止参数大幅波动。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736610", "t": 1, "q": "机炉协调系统控制模型中，“锅炉侧的惯性”主要体现在哪些环节?", "a": ["凝汽器真空度变化和循环水泵动作", "发电机电压调整和电流变化", "汽轮机调门动作和转速变化", "燃料燃烧、传热和汽水流动过程", "", ""], "r": "D", "e": "锅炉侧惯性主要源于燃料燃烧、传热和汽水流动这些过程，它们相对复杂且有延迟。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736611", "t": 1, "q": "机炉协调系统控制模型中，“锅炉侧控制子模型”的核心控制变量不包括下列哪项?", "a": ["汽轮机调门开度", "给水量", "送风量", "燃料量", "", ""], "r": "A", "e": "锅炉侧主要控制给水量、送风量、燃料量来调节锅炉工况，汽轮机调门开度是汽轮机侧控制变量。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736612", "t": 1, "q": "机炉协调系统控制模型中，\"汽轮机侧控制子模型\"的主要控制目标不包括?", "a": ["控制凝汽器水位", "维持主蒸汽压力", "跟踪负荷指令", "控制汽轮机转速（并网前）", "", ""], "r": "A", "e": "汽轮机侧控制子模型主要围绕负荷、压力和并网前转速控制，凝汽器水位控制并非其主要控制目标。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736613", "t": 1, "q": "机炉协调系统控制模型中，“前馈控制”的主要作用是?", "a": ["替代反馈控制，简化控制结构", "消除系统的稳态误差", "提前补偿可测扰动（如负荷指令变化）的影响", "抑制随机噪声对系统的干扰", "", ""], "r": "C", "e": "前馈控制是针对可测扰动，在扰动影响被控变量之前就进行调节，提前补偿其影响。A选项前馈不能替代反馈；B选项消除稳态误差是反馈控制的作用；D选项抑制随机噪声主要靠反馈控制。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736614", "t": 1, "q": "机炉协调系统控制模型中，\"主蒸汽压力偏差\"是指什么?", "a": ["主蒸汽压力实际值与汽轮机调门开度的差值", "主蒸汽压力实际值与主蒸汽温度实际值的差值", "主蒸汽压力设定值与负荷指令的差值", "主蒸汽压力实际值与设定值的差值", "", ""], "r": "D", "e": "偏差通常是实际值与设定值的差异，主蒸汽压力偏差就是主蒸汽压力实际值与设定值的差值。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736615", "t": 1, "q": "机炉协调系统控制模型中，若锅炉侧的惯性增大（如受热面结垢导致传热惯性增加），对协调控制品质的影响是?", "a": ["负荷响应速度不变，仅主蒸汽温度波动增大", "负荷响应速度减慢，压力波动增大", "负荷响应速度加快，压力波动减小", "负荷响应速度加快，压力稳定性提高", "", ""], "r": "B", "e": "锅炉侧惯性增大，意味着其响应外界负荷变化的能力变弱。当需要改变负荷时，锅炉不能及时跟上，会使负荷响应速度减慢。同时，由于锅炉调节不及时，会造成压力波动增大。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736616", "t": 1, "q": "机炉协调系统控制模型中，若汽轮机侧的响应速度变慢（如调门卡涩），对协调控制的影响是?", "a": ["负荷响应速度不变，仅主蒸汽温度波动", "负荷响应速度加快，压力波动减小", "负荷响应速度加快，压力稳定性提高", "负荷响应速度减慢，压力波动增大", "", ""], "r": "D", "e": "汽轮机侧响应速度变慢，意味着其对负荷需求的响应能力下降，所以负荷响应速度会减慢；同时，由于不能及时调节，会导致压力难以稳定，波动增大。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736617", "t": 1, "q": "机炉协调系统中，\"负荷指令管理回路\"的主要功能是?", "a": ["根据机组运行限制（如最大负荷、升负荷率）修正电网负荷指令", "直接控制汽轮机调门的开度", "计算主蒸汽压力的设定值", "检测主蒸汽温度的偏差并进行修正", "", ""], "r": "A", "e": "负荷指令管理回路主要作用是依据机组运行限制条件，对电网下达的负荷指令加以修正。B选项直接控制调门开度不是其主要功能；C选项主蒸汽压力设定值计算并非其功能；D选项检测主蒸汽温度偏差修正也不是该回路主要功能。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736618", "t": 1, "q": "机炉协调系统中，“机跟炉”控制模式适用于什么工况?", "a": ["机组高负荷运行，需快速响应负荷", "汽轮机调门需要快速动作", "电网负荷要求快速变化", "锅炉燃烧不稳定，需优先维持主蒸汽压力", "", ""], "r": "D", "e": "“机跟炉”模式下，锅炉控制主蒸汽压力，汽轮机控制负荷。当锅炉燃烧不稳定时，优先维持主蒸汽压力，采用此模式合适。A、B、C情况更适合“炉跟机”模式。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736619", "t": 1, "q": "机炉协调系统中，“炉跟机”控制模式适用于什么工况?", "a": ["电网负荷变化频繁且幅度大，需快速响应", "汽轮机调门故障，无法调整", "机组低负荷运行，需保证稳定性", "锅炉燃烧不稳定，需优先控制压力", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736620", "t": 1, "q": "机炉协调系统中，“协调控制”模式的核心优势是?", "a": ["同时兼顾负荷响应速度和压力稳定性", "仅关注压力稳定性，忽略负荷响应速度", "仅关注负荷响应速度，忽略压力稳定性", "无需考虑锅炉和汽轮机的特性差异", "", ""], "r": "A", "e": "协调控制模式要平衡锅炉和汽轮机的运行，既保证负荷能快速响应，又维持压力稳定。答案选A。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736621", "t": 1, "q": "机炉协调系统中，“协调控制策略”选择的核心依据是?", "a": ["汽轮机的型号", "机组的运行工况（如负荷水平、扰动类型）", "电网的电压等级", "锅炉的容量", "", ""], "r": "B", "e": "机炉协调系统需根据机组不同运行工况来调整控制策略，以实现机炉间协调配合。选项B中机组运行工况（如负荷水平、扰动类型）是选择“协调控制策略”的核心依据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736622", "t": 1, "q": "机炉协调系统中，\"主蒸汽压力设定值\"通常根据什么因素动态调整?", "a": ["锅炉燃料量的大小", "机组当前负荷（负荷高，压力设定值高）", "主蒸汽温度的偏差", "汽轮机调门的开度", "", ""], "r": "B", "e": "机组负荷与主蒸汽压力设定值相关，一般负荷越高，主蒸汽压力设定值越高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736623", "t": 1, "q": "机炉协调系统中，当电网负荷指令缓慢变化时，协调控制模型通常会采用什么策略以兼顾精度和稳定性?", "a": ["快速调整汽轮机调门和锅炉燃料量，跟踪指令", "缓慢调整，避免参数波动过大", "仅调整汽轮机调门，不调整锅炉燃料量", "仅调整锅炉燃料量，不调整汽轮机调门", "", ""], "r": "B", "e": "电网负荷指令缓慢变化时，为兼顾精度和稳定性，需避免参数波动过大，应缓慢调整。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736624", "t": 1, "q": "机炉协调系统中，当电网负荷指令小幅波动时，“机跟炉”控制模式下，汽轮机的主要控制目标是?", "a": ["控制主蒸汽温度在允许范围", "快速跟踪负荷指令变化", "调节锅炉给水流量", "维持主蒸汽压力稳定", "", ""], "r": "D", "e": "“机跟炉”模式下，锅炉主控负荷，汽轮机控制主蒸汽压力。电网负荷指令小幅波动时，汽轮机主要控制目标是维持主蒸汽压力稳定。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803687091736625", "t": 1, "q": "机炉协调系统中，当锅炉发生\"结焦\"故障（受热面结焦导致传热效率降低）时，协调控制模型应采取的调整策略是?", "a": ["减小燃料量，防止炉膛温度过高", "增大燃料量，补偿传热效率下降导致的出力不足", "增大汽轮机调门开度，增加蒸汽流量", "减小给水流量，防止汽包水位过高", "", ""], "r": "A", "e": "这是一道关于机炉协调系统应对锅炉故障的策略选择题。在锅炉发生“结焦”故障时，关键是要理解这种故障对锅炉运行及整个机炉协调系统的影响。结焦故障导致受热面结焦，进而使得传热效率降低。这意味着锅炉在同样的燃料输入下，产生的蒸汽量和热量会减少。为了维持机炉协调系统的稳定运行，需要采取相应的调整策略。现在来分析各个选项：A. 减小燃料量，防止炉膛温度过高。在结焦情况下，减少燃料量可以降低炉膛温度，减轻结焦的严重程度，并防止因温度过高而进一步加剧结焦或引发其他安全问题。这是一个合理的应对策略。B. 增大燃料量，补偿传热效率下降导致的出力不足。这会增加炉膛温度，可能加剧结焦情况，不利于故障的处理。C. 增大汽轮机调门开度，增加蒸汽流量。这并不能解决锅炉传热效率下降的根本问题，反而可能因蒸汽流量的增加而加重锅炉的负担。D. 减小给水流量，防止汽包水位过高。这与结焦故障的处理无直接关联，且可能影响到锅炉的正常水循环和蒸汽品质。综上所述，为了应对锅炉的结焦故障，最合理的策略是减小燃料量，以防止炉膛温度过高并减轻结焦的严重程度。所以，正确答案是A：“减小燃料量，防止炉膛温度过高”。", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618944", "t": 2, "q": "发电过程系统辨识中，影响模型辨识精度的主要因素有（　）", "a": ["参数估计方法的选择（如最小二乘法、递推最小二乘法）", "模型结构的合理性（如阶数、线性/非线性）", "输入输出数据的质量（如噪声、同步性）", "机组的运行年限（运行年限长则精度低）", "", ""], "r": "ABC", "e": "参数估计方法、模型结构合理性、输入输出数据质量都会显著影响模型辨识精度，而机组运行年限与模型辨识精度并无直接关联。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618945", "t": 2, "q": "发电过程中，\"纯延迟环节\"的传递函数e^(-τs)的拉普拉斯变换性质包括（　）", "a": ["幅频特性:幅值恒为1（无衰减）", "时域平移性质（f(t-τ)的拉普拉斯变换为e^(-τs)F（　））", "时域响应无延迟（错误，有τ延迟）", "相频特性:相位滞后随频率ω增大而增大（-ωτ）", "", ""], "r": "ABD", "e": "纯延迟环节传递函数e^(-τs)，其幅频特性幅值恒为1无衰减；有对应的时域平移性质；时域响应有τ延迟；相频特性相位滞后 -ωτ，随频率ω增大而增大。C选项错误。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618946", "t": 2, "q": "发电过程中，\"纯延迟环节\"的阶跃响应特点包括（　）", "a": ["输出与输入的幅值比为1（无增益变化）", "输出存在超调", "τ时刻后，输出完全复现输入阶跃信号（无惯性）", "在0~τ时间内，输出为零（无响应）", "", ""], "r": "ACD", "e": "纯延迟环节阶跃响应中，幅值不变即输出与输入幅值比为1；在0 - τ时间内无响应输出为零；τ时刻后输出完全复现输入阶跃信号且无超调。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618947", "t": 2, "q": "发电过程中，\"纯延迟环节\"的τ值大小受哪些因素影响（　）", "a": ["传输距离（距离长，τ大;距离短，τ小）", "介质流速（流速快，τ小;流速慢，τ大）", "系统负荷（负荷与τ无直接关联）", "介质温度（温度影响密度，间接影响流速，进而影响τ）", "", ""], "r": "ABD", "e": "这道题目考察的是对发电过程中“纯延迟环节”的τ值（延迟时间）影响因素的理解。在电力系统中，纯延迟环节的τ值通常受到多个物理因素的影响。首先，传输距离是一个直接影响延迟时间的因素。信号或能量在传输过程中，需要经过一定的物理路径，这个路径的长度会直接影响传输所需的时间。因此，传输距离越长，τ值通常也会越大；反之，传输距离越短，τ值则越小。其次，介质流速也是一个关键因素。在流体传输系统中，流速的快慢会直接影响流体通过系统所需的时间。流速越快，流体通过系统的时间就越短，从而τ值也越小；反之，流速越慢，τ值则越大。至于系统负荷，它主要影响的是系统的运行状态和效率，而与纯延迟环节的τ值没有直接关联。系统负荷的变化可能会影响系统的整体性能，但不会直接影响信号或能量的传输延迟时间。最后，介质温度虽然不直接影响τ值，但它可以通过影响介质的密度来间接影响流速，进而影响τ值。温度的变化会导致介质密度的变化，从而影响流体的流速和传输时间。综上所述，影响纯延迟环节的τ值大小的因素包括传输距离、介质流速和介质温度（通过影响密度间接影响），而系统负荷与τ值无直接关联。所以，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618948", "t": 2, "q": "发电过程中，\"纯延迟环节\"与\"一阶惯性+纯延迟环节\"的区别包括（　）", "a": ["纯延迟环节无惯性;一阶+纯延迟有惯性", "两者无区别，可通用", "纯延迟阶跃响应:τ后突变至稳态;一阶+纯延迟:τ后缓慢趋近稳态", "纯延迟传递函数e<sup>(-τs);一阶+纯延迟1/(Ts+1)*e<\/sup>(-τs)", "", ""], "r": "ACD", "e": "纯延迟环节无惯性，阶跃响应是在延迟时间τ后突变至稳态，传递函数是e(-τs)；一阶惯性 + 纯延迟环节有惯性，阶跃响应是在延迟时间τ后缓慢趋近稳态，传递函数是1/(Ts + 1)*e(-τs) 。B选项两者有明显区别不可通用。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618949", "t": 2, "q": "发电过程中，\"纯延迟环节\"与\"一阶惯性环节\"的本质区别在于（　）", "a": ["纯延迟环节的传递函数含e^(-τs); 一阶惯性环节含1/(Ts+1)", "纯延迟环节输出无惯性，仅时间滞后; 一阶惯性环节输出有惯性，无纯延迟", "纯延迟环节可通过增大数值积分步长消除; 一阶惯性环节无法消除", "纯延迟环节的阶跃响应是延迟τ后完全复现输入; 一阶惯性环节是缓慢趋近输入", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618950", "t": 2, "q": "发电过程中，\"纯延迟环节\"在哪些热工设备动态特性中常见（　）", "a": ["磨煤机出力（煤粉输送导致延迟）", "炉膛温度（烟气流动导致延迟）", "过热器出口温度（蒸汽流动导致延迟）", "汽包水位（虚假水位是压力导致，非纯延迟）", "", ""], "r": "ABC", "e": "纯延迟环节是指输入信号加入后，输出信号要经过一段时间后才开始等量变化。磨煤机煤粉输送、炉膛烟气流动、过热器蒸汽流动都会使信号传递出现延迟。而汽包虚假水位不是纯延迟现象。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618951", "t": 2, "q": "发电过程中，\"二阶振荡环节\"的超调量σ%与阻尼比ζ的关系包括（　）", "a": ["ζ=1时，σ%=0（无超调，临界阻尼）", "ζ=0时，σ%=100%（等幅振荡，无衰减）", "ζ>1时，σ%=0（过阻尼状态，无超调现象）", "0<ζ<1时，ζ增大→σ%减小（阻尼大，超调小）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618952", "t": 2, "q": "发电过程中，\"二阶振荡环节\"的传递函数ωn²/(s²+2ζωns+ωn²)的极点包括（　）", "a": ["s=-ωn（ζ=1时，二重实极点）", "s=ωn（错误，极点实部为负，稳定）", "s=-ζωn±ωn√(ζ²-1)（ζ>1时，两个不等实极点）", "s=-ζωn±jωn√(1-ζ²)（0<ζ<1时，复极点）", "", ""], "r": "ACD", "e": "二阶振荡环节传递函数分母为零可得极点方程「test/yiwen_img/importSubject/2034803682612219904.png」，根据求根公式求解，当ζ不同取值时极点情况不同，ζ = 1时为二重实极点、ζ>1时为两个不等实极点、0<ζ<1时为复极点。答案中A、C、D描述均正确。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618953", "t": 2, "q": "发电过程中，\"二阶振荡环节\"的调整时间ts（5%误差带）与参数的关系包括（　）", "a": ["ωn增大→ts减小（固有频率大，响应快）", "ζ增大→ts减小（阻尼大，收敛快）", "ts仅与ζ相关，与ωn无关", "ζ过小（如ζ<0.3）→ts增大（振荡久，收敛慢）", "", ""], "r": "ABD", "e": "这道题考察的是二阶振荡环节的调整时间与参数的关系。二阶振荡环节的调整时间受两个主要参数影响：固有频率ωn和阻尼比ζ。1. 固有频率ωn：当ωn增大时，系统的响应速度会变快，这意味着系统能够更快地达到稳定状态，因此调整时间ts会减小。所以选项A正确。2. 阻尼比ζ：阻尼比ζ反映了系统振荡的衰减速度。当ζ增大时，系统的振荡会更快地衰减，从而更快地达到稳定状态，因此调整时间ts也会减小。所以选项B正确。3. 调整时间ts不仅与阻尼比ζ相关，还与固有频率ωn相关。因此，选项C错误。4. 当阻尼比ζ过小时（如ζ<0.3），系统的振荡会持续较长时间，收敛速度慢，因此调整时间ts会增大。所以选项D正确。综上所述，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618954", "t": 2, "q": "发电过程中，\"二阶振荡环节\"的阻尼比ζ<0时，其响应特点包括（　）", "a": ["无法稳定运行（振幅无限大）", "发散振荡（振幅随时间增大）", "系统不会出现超调现象", "响应速度逐渐加快", "", ""], "r": "AB", "e": "二阶振荡环节的阻尼比ζ决定了系统的动态特性。当ζ<0时，系统处于欠阻尼状态，这会导致系统的响应出现无限振荡的趋势。A选项提到“无法稳定运行(振幅无限大)”，但实际上，在ζ<0的情况下，虽然系统会持续振荡，但其振幅并不会无限增大，而是趋于稳定在一个固定的振荡幅度上。因此，A选项描述不准确。B选项“发散振荡(振幅随时间增大)”是准确的描述。在欠阻尼状态下，系统的振荡幅度会随时间逐渐增大，表现出发散振荡的特性。C选项提到“系统不会出现超调现象”，这是正确的。在欠阻尼系统中，由于振荡的存在，系统不会达到一个稳定的超调峰值，而是会在振荡中逐渐达到稳定状态。D选项“响应速度逐渐加快”并不准确。实际上，在欠阻尼状态下，系统的响应速度会受到影响，表现为振荡频率的增加，但并不意味着响应速度在整体上加快。综上所述，当二阶振荡环节的阻尼比ζ<0时，其响应特点主要包括发散振荡(振幅随时间增大)和系统不会出现超调现象。因此，正确答案是AB。所以，正确答案是AB。", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618955", "t": 2, "q": "发电过程中，\"二阶振荡环节\"可描述哪些设备的动态特性（　）", "a": ["汽轮机轴系振动（含振荡特性）", "过热器温度（一阶+纯延迟，无振荡）", "汽包水位（虚假水位是暂态，非持续振荡）", "锅炉炉膛压力（燃料-送风波动导致振荡）", "", ""], "r": "AD", "e": "本题考查的是对发电过程中设备动态特性的理解。首先，我们来了解一下什么是“二阶振荡环节”。在控制系统分析中，二阶振荡环节通常用来描述具有振荡特性的动态系统，这种系统往往会在受到外部扰动后产生持续的振荡。接下来，我们逐一分析每个选项：A. 汽轮机轴系振动（含振荡特性）：汽轮机轴系在运行过程中，由于各种因素的影响（如不平衡、热变形等），确实会产生振荡。这种振荡特性与二阶振荡环节的描述相符。B. 过热器温度（一阶+纯延迟，无振荡）：过热器温度的变化通常表现为一阶动态特性加上纯延迟，而不具备振荡特性。因此，这个选项与二阶振荡环节不符。C. 汽包水位（虚假水位是暂态，非持续振荡）：汽包水位的变化中，虚假水位是一种暂态现象，并非持续的振荡。因此，这个选项也不符合二阶振荡环节的描述。D. 锅炉炉膛压力（燃料-送风波动导致振荡）：锅炉炉膛压力会受到燃料供应和送风波动的影响，从而产生持续的振荡。这种振荡特性与二阶振荡环节的描述相符。综上所述，A选项（汽轮机轴系振动）和D选项（锅炉炉膛压力）描述的是具有二阶振荡环节特性的设备动态。所以，正确答案是AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618956", "t": 2, "q": "发电过程中，\"虚假水位\"现象的产生原因包括（　）", "a": ["进水流量突然增大，水位立即上升", "蒸汽流量突然增大，初期水位上升，后期下降", "蒸汽压力突然降低，导致水的体积膨胀，水位暂时上升", "蒸汽压力突然升高，导致水的体积收缩，水位暂时下降", "", ""], "r": "BCD", "e": "“虚假水位”是由于蒸汽流量、压力变化使水的体积膨胀或收缩导致水位暂时异常变化。B选项蒸汽流量突然增大，汽水混合物比容增大，初期水位上升，之后因水减少水位下降；C选项蒸汽压力突然降低，水体积膨胀水位暂时上升；D选项蒸汽压力突然升高，水体积收缩水位暂时下降，均符合“虚假水位”产生原因。A选项进水流量增大水位上升是正常水位变化，不是“虚假水位”。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618957", "t": 2, "q": "发电过程中，\"一阶惯性环节\"的传递函数1/(Ts+1)的频率特性包括（　）", "a": ["幅频特性:随频率ω增大，幅值衰减（ω=1/T时衰减3dB）", "相频特性:随频率ω增大，相位滞后增大（最大-90°）", "幅频特性:随频率ω增大，幅值增大", "相频特性:随频率ω增大，相位超前", "", ""], "r": "AB", "e": "对于一阶惯性环节传递函数1/(Ts + 1)，其幅频特性随频率「test/yiwen_img/importSubject/2034803682708688896.png」增大幅值衰减，在「test/yiwen_img/importSubject/2034803682788380672.png」时衰减3dB；相频特性随频率「test/yiwen_img/importSubject/2034803682708688896.png」增大相位滞后增大，最大滞后「test/yiwen_img/importSubject/2034803682897432576.png」。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618958", "t": 2, "q": "发电过程中，\"一阶惯性环节\"的放大系数K的物理意义包括（　）", "a": ["K为无量纲量", "反映系统的增益特性，即输入变化对输出稳态的影响程度", "K越大，系统响应速度越快", "输出稳态值与输入稳态值的比值", "", ""], "r": "BD", "e": "放大系数K反映系统增益特性，体现输入变化对输出稳态的影响，也是输出稳态值与输入稳态值的比值。K与系统响应速度无关，K是有单位的。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618959", "t": 2, "q": "发电过程中，\"一阶惯性环节\"的阶跃响应特点包括（　）", "a": ["初始时刻响应速度最快（导数最大），随后逐渐减慢", "存在纯延迟，延迟τ后开始响应", "最终趋近于输入阶跃值的K倍（K为放大系数）", "无超调，单调上升", "", ""], "r": "ACD", "e": "“一阶惯性环节”阶跃响应从初始时刻响应速度最大后逐渐减慢；无纯延迟；最终趋近输入阶跃值的K倍；且无超调单调上升。A、C、D选项符合其特点，B错误。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618960", "t": 2, "q": "发电过程中，\"一阶惯性环节\"的时间常数T可通过哪些试验数据确定（　）", "a": ["频率响应曲线:取幅频特性衰减3dB对应的频率ω=1/T，反算T", "仅通过机理分析，无需试验数据", "阶跃响应曲线:取响应达到稳态值98%对应的时间为4T，反算T", "阶跃响应曲线:取响应达到稳态值63.2%对应的时间为T", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618961", "t": 2, "q": "发电过程中，\"一阶惯性环节\"的时间常数T与哪些因素相关（　）", "a": ["输入信号的幅值", "设备的容积", "介质的流速", "设备的传热系数", "", ""], "r": "BCD", "e": "一阶惯性环节的时间常数T主要反映系统对输入信号变化的响应速度。它与系统的物理特性有关，而与输入信号的具体幅值无关。首先，我们逐项考虑各个选项：A. 输入信号的幅值：时间常数描述的是系统响应的速度，而不是响应的大小。因此，输入信号的幅值不会影响时间常数T。B. 设备的容积：设备的容积越大，其内部的物质或能量变化所需的时间就越长。因此，设备的容积是影响时间常数T的一个重要因素。C. 介质的流速：介质的流速越快，系统内部的物质交换或能量传递就越快，从而时间常数T会越小。所以，介质的流速也是影响时间常数T的因素。D. 设备的传热系数：传热系数反映了设备传递热量的能力。传热系数越大，设备传递热量的速度就越快，这也意味着时间常数T会更小。因此，设备的传热系数同样影响时间常数T。综上所述，与时间常数T相关的因素是设备的容积、介质的流速和设备的传热系数，而与输入信号的幅值无关。所以，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618962", "t": 2, "q": "发电过程中，\"一阶惯性环节\"可描述哪些设备的动态特性（　）", "a": ["给水泵流量（阀门动作→流量缓慢变化）", "引风机风量（挡板动作→风量缓慢变化）", "汽轮机调门开度（伺服机构→动作有惯性）", "过热器温度（含纯延迟，需一阶+纯延迟，非单一一阶）", "", ""], "r": "ABC", "e": "一阶惯性环节适用于描述输入变化后输出缓慢变化的过程。A选项给水泵流量在阀门动作后缓慢变化，B选项引风机风量在挡板动作后缓慢变化，C选项汽轮机调门开度因伺服机构动作有惯性，均符合一阶惯性环节特点；D选项过热器温度含纯延迟，不是单纯一阶惯性环节。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618963", "t": 2, "q": "发电过程中，二阶振荡环节的\"固有频率ωn\"增大时，其单位阶跃响应的变化包括（　）", "a": ["振荡频率升高（单位时间内振荡次数增多）", "响应速度加快（达到稳态时间缩短）", "超调量不变", "稳态值不变", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618964", "t": 2, "q": "发电过程中，二阶振荡环节的\"阻尼比ζ\"取值不同时，其单位阶跃响应类型包括（　）", "a": ["0<ζ<1: 衰减振荡（欠阻尼响应）", "ζ=0: 等幅振荡（无阻尼响应）", "ζ>1: 不发生振荡，单调趋近或过阻尼响应", "ζ=1: 无振荡，单调趋近（临界阻尼响应）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618965", "t": 2, "q": "发电过程中，二阶振荡环节动态模型（传递函数ωn²/(s²+2ζωns+ωn²)）的动态响应特性（如超调量、调整时间）主要由哪些参数决定?", "a": ["固有频率ωn", "阻尼比ζ", "纯延迟时间τ", "放大系数K（若传递函数含K则为Kωn²/(...)）", "", ""], "r": "AB", "e": "二阶振荡环节动态响应特性主要取决于阻尼比ζ和固有频率ωn ，阻尼比影响超调量等，固有频率影响响应速度等。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618966", "t": 2, "q": "发电过程中，描述\"锅炉汽包水位\"动态特性的模型需考虑的因素包括（　）", "a": ["进水流量与蒸汽流量的差值（质量守恒，决定水位变化趋势）", "汽轮机转速变化对水位的影响（实际上转速变化与水位无直接关联）", "蒸汽压力变化导致的\"虚假水位\"现象（压力变化会引起水体积变化，进而引起水位暂时性变化）", "给水温度变化对水位的影响（温度变化会导致水密度变化，从而影响到水体积及水位）", "", ""], "r": "ACD", "e": "本题主要考查描述“锅炉汽包水位”动态特性模型需考虑的因素。进水流量与蒸汽流量的差值基于质量守恒，直接决定水位变化趋势；蒸汽压力变化会引发“虚假水位”现象，影响水位；给水温度变化会使水密度改变，进而影响水位。而汽轮机转速变化与水位无直接关联，不应考虑。所以答案应选ACD。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618967", "t": 2, "q": "机炉协调系统中，“反馈控制”的局限性包括（　）", "a": ["当模型误差较大时，控制品质下降（如参数整定基于模型，误差大则效果差）", "无法完全消除不可测扰动（如燃料热值随机波动）导致的偏差", "完全无需依赖模型，仅需偏差信号", "对扰动的响应存在滞后（需偏差出现后才动作）", "", ""], "r": "ABD", "e": "反馈控制依赖模型，误差大会使控制品质下降，且对不可测扰动难完全消除偏差，对扰动响应有滞后。C选项说完全无需依赖模型错误。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618968", "t": 2, "q": "机炉协调系统中，\"负荷指令管理回路\"的主要功能包括（　）", "a": ["根据升/降负荷率限制，平滑负荷指令变化（防参数波动）", "直接控制汽轮机调门开度，跟踪负荷指令", "根据机组最大/最小负荷限制，修正电网负荷指令", "当机组故障（如锅炉结焦）时，强制降低负荷指令至安全值", "", ""], "r": "ACD", "e": "负荷指令管理回路要对负荷指令进行处理，A可平滑指令变化，C能修正指令，D在故障时可调整指令，而B中直接控制汽轮机调门开度不是负荷指令管理回路主要功能。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618969", "t": 2, "q": "机炉协调系统中，\"给水泵流量控制\"的依据包括（　）", "a": ["汽包水位信号（水位低→给水量增）", "主蒸汽压力信号", "蒸汽流量信号（蒸汽流量增→给水量增，汽水平衡）", "炉膛温度信号", "", ""], "r": "AC", "e": "给水泵流量控制主要是为维持汽包水位稳定和保证汽水平衡。汽包水位信号直接反映水位情况，水位低需增加给水量；蒸汽流量信号体现蒸汽输出量，蒸汽流量增加要相应增加给水量以维持平衡。主蒸汽压力信号和炉膛温度信号并非给水泵流量控制直接依据。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618970", "t": 2, "q": "机炉协调系统中，\"给水量控制\"的目标包括（　）", "a": ["跟随蒸汽流量变化，保证汽水平衡（蒸汽流量增→给水量增）", "维持汽包水位在设定值（±50mm内）", "确保锅炉安全运行，防止干烧或满水", "优化燃烧效率，提高热能利用率", "", ""], "r": "ABC", "e": "给水量控制主要是为保证汽水平衡、维持汽包水位稳定以及防止锅炉干烧或满水保障安全运行。D选项优化燃烧效率与给水量控制目标无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618971", "t": 2, "q": "机炉协调系统中，\"故障减负荷（RB）\"的触发条件包括（　）", "a": ["锅炉燃料量测量故障", "汽轮机调门卡涩", "给水泵单侧故障跳闸", "送风机、引风机单侧故障跳闸", "", ""], "r": "CD", "e": "RB触发条件通常是重要辅机出现故障导致机组不能维持原负荷。给水泵、送风机、引风机等单侧故障跳闸会使机组出力受限，需减负荷。而锅炉燃料量测量故障不一定马上触发RB，汽轮机调门卡涩不一定直接导致需故障减负荷。送风机、引风机单侧故障跳闸会严重影响锅炉风烟系统，给水泵单侧故障跳闸影响给水，都会触发RB。答案选CD。", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618972", "t": 2, "q": "机炉协调系统中，“锅炉侧控制子模型”的核心控制变量包括（　）", "a": ["送风量（与燃料量匹配，保证燃烧效率，防缺氧/过量空气）", "给水量（控制汽包水位，保证汽水平衡）", "汽轮机调门开度（控制蒸汽流量，属汽轮机侧）", "燃料量（控制锅炉热输入，影响产汽量）", "", ""], "r": "ABD", "e": "机炉协调系统中锅炉侧控制子模型主要控制锅炉的热输入、燃烧和汽水平衡等。燃料量决定锅炉热输入，影响产汽量；送风量要与燃料量匹配保证燃烧；给水量控制汽包水位。而汽轮机调门开度是汽轮机侧控制变量。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618973", "t": 2, "q": "机炉协调系统中，“机跟炉”控制模式的适用工况包括（　）", "a": ["电网负荷变化缓慢，对响应速度要求低", "机组低负荷运行（锅炉燃烧不稳定，需优先控压力）", "锅炉侧故障（如燃料供应波动大，无法快速调负荷）", "电网负荷变化频繁且幅度大，对响应速度要求高", "", ""], "r": "ABC", "e": "“机跟炉”模式下锅炉主控负荷，汽轮机跟随控制汽压，响应慢。适用于对负荷响应速度要求不高的工况。低负荷、锅炉故障时用此模式保稳定。而负荷变化频繁且幅度大、要求响应快时不适用。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618974", "t": 2, "q": "机炉协调系统中，\"炉膛负压控制\"的作用包括（　）", "a": ["防止炉膛正压，导致烟气外漏（污染环境，危及人身）", "避免主蒸汽温度波动过大", "防止炉膛负压过大，导致空气过量吸入（增大排烟热损失）", "保证燃料的完全燃烧", "", ""], "r": "AC", "e": "炉膛负压控制主要是维持合适的炉膛压力，压力过高（正压）会使烟气外漏，压力过低（负压过大）会使空气过量吸入。选项B主蒸汽温度波动与炉膛负压控制关系不大；选项D保证燃料完全燃烧主要和燃烧调整等有关，并非炉膛负压控制的主要作用。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618975", "t": 2, "q": "机炉协调系统中，\"汽轮机侧控制子模型\"的控制目标包括（　）", "a": ["控制主蒸汽温度", "并网前:控制汽轮机转速稳定（3000r/min）", "控制凝汽器真空度", "并网后:跟踪负荷指令（协调模式下）或维持压力稳定（机跟炉模式下）", "", ""], "r": "BD", "e": "汽轮机侧控制子模型在并网前主要控制汽轮机转速稳定在3000r/min ，并网后在协调模式跟踪负荷指令、机跟炉模式维持压力稳定。主蒸汽温度由锅炉侧控制，凝汽器真空度并非汽轮机侧控制子模型主要控制目标。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618976", "t": 2, "q": "机炉协调系统中，\"汽轮机调门控制\"的依据包括（　）", "a": ["负荷指令信号", "主蒸汽压力信号", "炉膛负压信号", "汽包水位信号", "", ""], "r": "AB", "e": "汽轮机调门控制主要根据负荷指令和主蒸汽压力来调节，保证机组输出负荷和主蒸汽压力稳定。而炉膛负压和汽包水位与汽轮机调门控制无直接关联。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618977", "t": 2, "q": "机炉协调系统中，\"前馈-反馈复合控制\"的优势包括（　）", "a": ["前馈控制提前补偿可测扰动（如负荷指令变化），减少偏差", "可降低对模型精度的要求，因反馈可修正模型误差", "反馈控制消除不可测扰动（如燃料热值波动）导致的稳态偏差", "完全替代单一反馈控制，无需调整反馈参数", "", ""], "r": "ABC", "e": "前馈控制能提前对可测扰动补偿减少偏差，反馈控制可消除不可测扰动的稳态偏差，且能修正模型误差降低对模型精度要求，但前馈 - 反馈复合控制不能完全替代单一反馈控制，仍需调整反馈参数。答案：ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618978", "t": 2, "q": "机炉协调系统中，\"前馈控制\"的设计依据包括（　）", "a": ["不可测扰动的统计特性", "反馈控制的偏差信号", "系统的动态模型（如负荷→压力的传递函数）", "可测扰动的特性（如负荷指令变化的幅值和速率）", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618979", "t": 2, "q": "机炉协调系统中，\"燃料量测量故障\"时的处理策略包括（　）", "a": ["忽略故障，继续按原指令控制", "切换至热量信号控制（用燃料量、送风量、给水量综合替代）", "直接关闭燃料供应", "降低负荷指令，维持稳定工况", "", ""], "r": "BD", "e": "答案：BD在机炉协调系统中，当发生“燃料量测量故障”时，不能忽略故障继续按原指令控制，也不能直接关闭燃料供应，这样可能会导致系统不稳定或停机。合理的处理策略是切换至热量信号控制，即利用燃料量、送风量、给水量的综合信息来替代燃料量的测量值，以保持系统的稳定性；同时，降低负荷指令，以维持稳定的工况。因此，正确答案为B和D。", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618980", "t": 2, "q": "机炉协调系统中，\"燃料量控制\"的注意事项包括（　）", "a": ["燃料量变化需与送风量同步调整（防止缺氧不完全燃烧或过量空气热损失）", "当燃料热值变化时，需修正燃料量指令（保证热输入稳定）", "燃料量调整仅需考虑负荷指令，无需考虑压力", "燃料量变化速率需限制（防止炉膛温度骤变，结焦或灭火）", "", ""], "r": "ABD", "e": "燃料量控制要综合多方面因素，A中同步调整送风量可避免燃烧问题；B修正指令能保证热输入稳定；D限制变化速率可防止炉膛异常。而C中燃料量调整需考虑压力等多种因素，并非仅考虑负荷指令。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618981", "t": 2, "q": "机炉协调系统中，“升/降负荷率限制”的取值依据包括（　）", "a": ["电网负荷需求（负荷需求急→负荷率大，非依据）", "锅炉的热惯性（惯性大→负荷率小，防压力波动）", "汽轮机的金属温度变化率（防热应力超限）", "给水泵的流量变化能力（流量能力低→负荷率小）", "", ""], "r": "BCD", "e": "升/降负荷率限制需考虑设备特性和安全。锅炉热惯性大时，负荷率要小以防压力波动；汽轮机要控制金属温度变化率防止热应力超限；给水泵流量变化能力低时，负荷率也应小。而电网负荷需求急不是升/降负荷率限制取值依据。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618982", "t": 2, "q": "机炉协调系统中，\"甩负荷\"故障时的控制策略包括（　）", "a": ["汽轮机调门快速关闭（防止转速飞升超限）", "开启汽轮机旁路系统（泄压，保护锅炉）", "锅炉快速减燃料量（防止主蒸汽压力骤升）", "锅炉维持给水量稳定（需减给水，因蒸汽流量骤降）", "", ""], "r": "ABC", "e": "甩负荷时机组工况突变，需快速关闭汽轮机调门防转速飞升，开启旁路系统泄压保护锅炉，快速减燃料量防主蒸汽压力骤升；蒸汽流量骤降应减给水，D错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618983", "t": 2, "q": "机炉协调系统中，\"送风量控制\"的目标包括（　）", "a": ["控制炉膛负压稳定", "降低排烟热损失", "与燃料量匹配，保证过剩空气系数在合理范围（1.1-1.3）", "保证燃料完全燃烧，降低不完全燃烧热损失", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618984", "t": 2, "q": "机炉协调系统中，\"协调控制\"模式与\"炉跟机\"\"机跟炉\"模式的区别在于（　）", "a": ["协调模式下，负荷指令由锅炉和汽轮机共同承担，非单一侧", "协调模式下，需同时考虑压力控制和负荷跟踪", "协调模式引入前馈控制，提前补偿负荷指令变化", "协调模式下，锅炉和汽轮机同时调整，兼顾负荷响应与压力稳定", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618985", "t": 2, "q": "机炉协调系统中，\"协调控制品质\"的评价指标包括（　）", "a": ["主蒸汽压力偏差（实际压力与设定值的偏差）", "负荷跟踪偏差（实际负荷与指令的偏差）", "调整时间（参数恢复稳态的时间）", "仅关注负荷跟踪速度，不关注压力偏差", "", ""], "r": "ABC", "e": "机炉协调系统协调控制品质需考量主蒸汽压力、负荷跟踪及参数恢复稳态时间等多方面，A主蒸汽压力偏差、B负荷跟踪偏差、C调整时间都是重要评价指标，而D仅关注负荷跟踪速度不关注压力偏差不全面。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618986", "t": 2, "q": "机炉协调系统中，\"主蒸汽温度控制\"的主要手段包括（　）", "a": ["调整过热器减温喷水量（喷水增→温度降）", "调整炉膛火焰中心高度（火焰中心上移→过热器吸热量增→温度升）", "调整给煤量（通过改变燃料量调节燃烧强度，进而影响烟气温度和过热器吸热量）", "调整一次风与二次风比例（通过调整风煤比来改变燃烧状况，从而影响烟气温度）", "", ""], "r": "AB", "e": "机炉协调系统中的“主蒸汽温度控制”主要关注如何调整以得到所需的主蒸汽温度。以下是对各选项的简要A. 调整过热器减温喷水量：这是一个直接且常用的方法来控制主蒸汽温度。增加喷水量可以降低蒸汽温度，反之则提高。B. 调整炉膛火焰中心高度：火焰中心的高度会影响过热器的吸热量，从而影响蒸汽温度。火焰中心上移会使过热器吸热量增加，导致蒸汽温度升高。C. 调整给煤量：虽然调整给煤量可以改变燃烧强度和烟气温度，但它更多地是影响锅炉的整体出力和效率，而不是直接控制主蒸汽温度的主要手段。D. 调整一次风与二次风比例：这主要是为了调整燃烧状况和烟气温度，但它对主蒸汽温度的直接影响相对较小，更多的是影响燃烧效率和污染物排放。综上所述，A和B选项是“主蒸汽温度控制”的主要手段。所以，正确答案是AB。", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618987", "t": 2, "q": "机炉协调系统中，\"主蒸汽压力控制\"的重要性包括（　）", "a": ["压力稳定是保证主蒸汽温度、汽包水位稳定的基础", "压力过低会导致汽轮机功率不足，无法跟踪负荷", "压力过高会导致锅炉、汽轮机设备超压损坏", "主蒸汽压力的合理控制有助于提高系统的整体效率", "", ""], "r": "ABCD", "e": "主蒸汽压力稳定对温度、水位稳定很关键，压力过低功率不足，过高会损坏设备，合理控制能提升系统效率。答案涵盖了压力控制多方面重要性。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618988", "t": 2, "q": "机炉协调系统中，“主蒸汽压力设定值”的确定依据包括（　）", "a": ["汽轮机设计压力（不超过设计值）", "锅炉设计压力（不超过设计值）", "机组当前负荷（负荷高→压力高，保证功率）", "电网电压等级", "", ""], "r": "ABC", "e": "主蒸汽压力设定值要考虑机组运行安全和满足负荷需求，不能超汽轮机和锅炉设计压力，且需根据机组当前负荷来设定，负荷高压力高保证功率。电网电压等级与主蒸汽压力设定无直接关联。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618989", "t": 2, "q": "机炉协调系统中，导致\"主蒸汽压力波动\"的常见扰动因素包括（　）", "a": ["汽轮机调门开度异常（调门变化导致蒸汽流量变化）", "凝汽器真空度变化（真空度变化主要影响汽轮机功率，与压力无直接关联）", "锅炉燃料量波动（燃料量变化导致产汽量变化）", "电网负荷指令变化（负荷变化导致蒸汽流量变化）", "", ""], "r": "ACD", "e": "主蒸汽压力波动和蒸汽流量、产汽量有关。A选项汽轮机调门开度异常使蒸汽流量改变；C选项锅炉燃料量波动会影响产汽量；D选项电网负荷指令变化也会让蒸汽流量改变，都能导致主蒸汽压力波动。而B选项凝汽器真空度变化主要影响汽轮机功率，和主蒸汽压力无直接关联。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618990", "t": 2, "q": "机炉协调系统中，影响\"炉跟机\"控制模式负荷响应速度的主要因素有（　）", "a": ["主蒸汽压力的设定值大小", "负荷指令的变化幅度", "汽轮机调门的动作速度（如伺服机构响应速度）", "锅炉侧的惯性（如燃烧、传热惯性）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618991", "t": 2, "q": "系统辨识的\"数据预处理\"阶段，常用的预处理方法包括（　）", "a": ["直接删除所有动态数据，仅保留稳态数据", "数据归一化（如消除量纲影响，统一幅值范围）", "数据同步校正（如修正输入输出数据时滞）", "数据滤波（如滑动平均，去除噪声）", "", ""], "r": "BCD", "e": "数据预处理是为了让数据更适合系统辨识，数据归一化可消除量纲等影响；数据同步校正能修正输入输出数据时滞；数据滤波可去除噪声，这些都是常用预处理方法。而直接删除所有动态数据仅留稳态数据不合理，会丢失很多重要信息。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034803688945618992", "t": 2, "q": "系统辨识中，\"白噪声\"残差的判定标准包括（　）", "a": ["残差自相关函数在滞后阶数≠0时接近零（无自相关）", "残差幅值随机变化", "残差均值接近零（无系统偏差）", "残差功率谱密度均匀（无明显峰值）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137984", "t": 3, "q": "纯延迟环节的传递函数为Ke^(-τs)，其中K为放大系数，通常K≠1，需根据系统特性调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "纯延迟环节传递函数是e^(-τs) ，不是Ke^(-τs) 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137985", "t": 3, "q": "二阶振荡环节的超调量σ%仅与阻尼比ζ有关，与固有频率ωn无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "二阶振荡环节超调量公式为「test/yiwen_img/importSubject/2034803682972930048.png」 ，公式中仅含阻尼比ζ，无固有频率ωn 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137986", "t": 3, "q": "二阶振荡环节的调整时间ts（5%误差带）随ωn增大而减小，随ζ增大先减小后增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二阶振荡环节调整时间「test/yiwen_img/importSubject/2034803683056816128.png」（5%误差带）公式「test/yiwen_img/importSubject/2034803683128119296.png」 ，当「test/yiwen_img/importSubject/2034803683216199680.png」增大时，「test/yiwen_img/importSubject/2034803683056816128.png」减小；当「test/yiwen_img/importSubject/2034803683279114240.png」增大时，「test/yiwen_img/importSubject/2034803683056816128.png」减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137987", "t": 3, "q": "二阶振荡环节的调整时间ts仅与阻尼比ζ有关，与固有频率ωn无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二阶振荡环节调整时间「test/yiwen_img/importSubject/2034803683056816128.png」与阻尼比「test/yiwen_img/importSubject/2034803683279114240.png」和固有频率「test/yiwen_img/importSubject/2034803683216199680.png」都有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137988", "t": 3, "q": "二阶振荡环节的固有频率ωn增大，其单位阶跃响应的振荡频率升高，响应速度加快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137989", "t": 3, "q": "二阶振荡环节的极点实部为负时，系统稳定;实部为正时，系统发散。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于二阶振荡环节，极点实部为负意味着系统响应最终会收敛，系统稳定；极点实部为正，系统响应会不断增大，系统发散。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137990", "t": 3, "q": "二阶振荡环节的阻尼比ζ=0.707时，超调量约为4.3%，调整时间较短，是工程中常用的阻尼值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "二阶振荡环节在阻尼比ζ = 0.707 时，超调量约 4.3%，此时系统响应快速且平稳性好、调整时间短，是工程常用阻尼值，该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137991", "t": 3, "q": "二阶振荡环节的阻尼比ζ>1时，其单位阶跃响应为衰减振荡，超调量随ζ增大而减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二阶振荡环节阻尼比ζ>1时为过阻尼，单位阶跃响应无振荡，是单调上升曲线，不存在超调量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137992", "t": 3, "q": "二阶振荡环节的阻尼振荡频率ωd=ωn√(1-ζ²)，仅在0<ζ<1时存在（欠阻尼）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "二阶振荡环节中，当 0<ζ<1 时为欠阻尼状态，此时系统会出现阻尼振荡，有阻尼振荡频率 ωd = ωn√(1 - ζ²)；当 ζ≥1 时，系统处于临界阻尼或过阻尼状态，不会出现阻尼振荡，也就不存在阻尼振荡频率。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137993", "t": 3, "q": "二阶振荡环节中，阻尼比ζ=0时，其单位阶跃响应为等幅振荡，无稳态值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当二阶振荡环节阻尼比ζ = 0时，系统无阻尼，单位阶跃响应是等幅振荡，不会趋于一个稳定值，无稳态值。", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137994", "t": 3, "q": "发电过程中，纯延迟环节的输出与输入波形相同，仅在时间上滞后τ，无幅值变化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "纯延迟环节的特性就是输出与输入波形一样，只是在时间上滞后一定时间τ，且幅值无变化。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137995", "t": 3, "q": "发电过程中，给水泵流量动态特性可用一阶惯性环节描述，因其阀门动作后流量无延迟，仅缓慢趋近稳态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "给水泵流量动态特性若可用一阶惯性环节描述，阀门动作后流量会有延迟且缓慢趋近稳态，而题干说无延迟，所以错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137996", "t": 3, "q": "发电过程中，过热器出口温度动态特性仅含一阶惯性环节，无纯延迟。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实际发电过程中，过热器出口温度动态特性不仅有一阶惯性环节，还存在纯延迟。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137997", "t": 3, "q": "发电过程中，过热器减温喷水动态特性可用一阶惯性环节描述，因喷水量变化后温度缓慢响应，无纯延迟。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137998", "t": 3, "q": "发电过程中，炉膛温度动态特性的纯延迟主要由燃料燃烧反应时间导致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036137999", "t": 3, "q": "发电过程中，炉膛温度动态特性含一阶惯性+纯延迟，因烟气流动有延迟，温度变化有惯性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "发电时，烟气流动确实存在延迟，而温度变化具有惯性，使得炉膛温度动态特性表现为一阶惯性加纯延迟。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138000", "t": 3, "q": "发电过程中，磨煤机出口煤粉浓度动态特性的时间常数T较大，因煤粉混合、输送过程惯性大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "磨煤机出口煤粉混合、输送过程惯性大，使得煤粉浓度变化需要较长时间才能达到稳定状态，所以其动态特性时间常数T较大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138001", "t": 3, "q": "发电过程中，磨煤机出力动态特性含纯延迟环节，主要由煤粉在管道内的输送时间导致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "磨煤机出力动态特性存在纯延迟环节，而煤粉在管道内输送需要时间，这确实是造成纯延迟的主要原因。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138002", "t": 3, "q": "发电过程中，凝汽器真空度动态特性含纯延迟，主要因汽轮机排汽量变化传递至真空度检测需时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "发电时汽轮机排汽量变化传递到真空度检测确实需要时间，这就会使凝汽器真空度动态特性存在纯延迟。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138003", "t": 3, "q": "发电过程中，汽包水位的\"虚假水位\"现象是由纯延迟导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“虚假水位”现象主要是由负荷变化时汽水比容变化等原因引起，并非纯延迟导致。", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138004", "t": 3, "q": "发电过程中，汽轮机调门动态特性的时间常数T较小，因调门由伺服机构驱动，响应速度快。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "汽轮机调门由伺服机构驱动，能快速响应，使得调门动态特性的时间常数T较小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138005", "t": 3, "q": "发电过程中，汽轮机功率动态特性与主蒸汽压力、调门开度均相关，压力越高、开度越大，功率越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在发电过程中，主蒸汽压力高意味着蒸汽携带的能量多，调门开度大则使进入汽轮机的蒸汽量增多，二者都会使汽轮机获得更多能量，进而功率增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138006", "t": 3, "q": "发电过程中，一阶惯性环节的时间常数T越大，系统响应速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在一阶惯性环节中，时间常数T越大，系统响应越慢。因为T反映了系统对输入信号的响应延迟程度，T大意味着系统达到稳态所需时间长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138007", "t": 3, "q": "发电过程中，引风机风量动态特性的时间常数T较大，因挡板动作后气流惯性大，风量变化缓慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "引风机挡板动作改变风量时，由于气流存在惯性，风量不会立刻变化，而是缓慢改变，所以其动态特性时间常数T较大。", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138008", "t": 3, "q": "发电过程中，主蒸汽流量动态特性可用一阶惯性环节描述，因蒸汽流量随调门开度变化无延迟，仅缓慢趋近。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "主蒸汽流量随调门开度变化存在一定延迟，并非无延迟，所以不能简单用一阶惯性环节描述。", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138009", "t": 3, "q": "机炉协调系统中，\"故障减负荷（RB）\"触发后，负荷降低速率由机组最大降负荷率决定，无需调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“故障减负荷（RB）”触发后，负荷降低速率并非固定由机组最大降负荷率决定且无需调整，实际中可根据具体情况对负荷降低速率进行调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138010", "t": 3, "q": "机炉协调系统中，\"故障减负荷（RB）\"触发后，应快速将负荷降至设备安全运行水平。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当机炉协调系统中“故障减负荷（RB）”触发，意味着设备出现故障，为保证设备安全，需快速把负荷降到安全运行水平。", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138011", "t": 3, "q": "机炉协调系统中，“机跟炉”控制模式适用于电网负荷变化频繁、对响应速度要求高的工况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“机跟炉”控制模式中锅炉调节负荷，汽轮机维持主汽压力，响应速度慢，不适合电网负荷变化频繁、对响应速度要求高的工况。", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138012", "t": 3, "q": "机炉协调系统中，“机跟炉”模式下，锅炉侧主要控制负荷指令，汽轮机侧控制压力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“机跟炉”模式下，锅炉侧控制主蒸汽压力，汽轮机侧控制负荷指令，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138013", "t": 3, "q": "机炉协调系统中，“炉跟机”控制模式下，汽轮机主要控制主蒸汽压力稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“炉跟机”模式下，汽轮机控制功率，锅炉控制主蒸汽压力稳定。所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138014", "t": 3, "q": "机炉协调系统中，“炉跟机”模式适用于锅炉燃烧稳定、电网负荷变化频繁的工况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138015", "t": 3, "q": "机炉协调系统中，“甩负荷”故障时，应首先快速增大锅炉燃料量，防止压力骤降。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“甩负荷”故障时，蒸汽需求急剧减少，若快速增大锅炉燃料量，会使压力进一步升高，而不是防止压力骤降，应减少燃料量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138016", "t": 3, "q": "在机炉协调系统中，“协调控制”模式下，锅炉侧和汽轮机侧均承担负荷跟踪与压力控制任务，无主次之分。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机炉协调系统“协调控制”模式下，锅炉和汽轮机相互配合，共同承担负荷跟踪与压力控制任务，无明显主次。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138017", "t": 3, "q": "机炉协调系统中，给水量控制仅需依据汽包水位信号，无需考虑蒸汽流量变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机炉协调系统中，给水量控制不仅要依据汽包水位信号，还需考虑蒸汽流量变化。因为蒸汽流量变化会影响汽包内的物质平衡和能量平衡，仅依据汽包水位信号不能准确控制给水量，易造成虚假水位等问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138018", "t": 3, "q": "机炉协调系统中，给水量控制需结合蒸汽流量前馈信号，以提前应对蒸汽流量变化，减少水位偏差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机炉协调系统里，蒸汽流量变化会影响水位，结合蒸汽流量前馈信号能提前调节给水量，有效减少水位偏差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138019", "t": 3, "q": "机炉协调系统中，炉膛负压主要由送风机控制，送风量增大则负压升高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "炉膛负压主要由引风机控制，而非送风机。送风量增大时，若引风量不变，炉膛内压力会增大，负压是降低而非升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138020", "t": 3, "q": "机炉协调系统中，汽轮机并网前的控制目标是跟踪电网负荷指令，维持负荷稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "汽轮机并网前，控制目标是维持转速稳定，而非跟踪电网负荷指令维持负荷稳定，并网后才会跟踪电网负荷指令。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138021", "t": 3, "q": "机炉协调系统中，前馈控制可完全替代反馈控制，无需依赖反馈偏差信号。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "前馈控制不能完全替代反馈控制，前馈控制是基于扰动的控制，无法对所有扰动进行全面精确的补偿，且不能修正控制过程中出现的其他误差，仍需反馈偏差信号来保证控制的准确性和稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138022", "t": 3, "q": "机炉协调系统中，燃料量变化速率无需限制，仅需快速跟踪负荷指令即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "燃料量变化速率需要限制，不能只快速跟踪负荷指令，若不限制变化速率，可能导致燃烧不稳定、设备损坏等问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138023", "t": 3, "q": "机炉协调系统中，送风量控制需保证过剩空气系数在1.0左右，以实现完全燃烧。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "过剩空气系数为1意味着理论空气量，实际中为保证完全燃烧，需有一定过量空气，送风量控制的过剩空气系数通常大于1，而不是1.0左右。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138024", "t": 3, "q": "在机炉协调系统中，送风量应与燃料量同步调整，保证过剩空气系数合理，防止不完全燃烧。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "机炉协调系统中，送风量和燃料量同步调整可维持合适的风煤比，保证过剩空气系数合理，避免不完全燃烧。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138025", "t": 3, "q": "机炉协调系统中，协调控制模式通过前馈-反馈复合控制，兼顾负荷响应与压力稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "机炉协调系统的协调控制模式运用前馈 - 反馈复合控制，能在保证负荷快速响应的同时维持压力稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138026", "t": 3, "q": "机炉协调系统中，协调控制品质的评价需同时考虑负荷跟踪精度、压力稳定精度和调整时间，三者缺一不可。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "机炉协调系统的协调控制品质受负荷跟踪精度、压力稳定精度和调整时间等多方面影响，全面考量这些因素才能准确评价其控制品质。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138027", "t": 3, "q": "机炉协调系统中，主蒸汽温度控制主要通过调整给水量实现。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "主蒸汽温度控制通常通过调整减温水量等方式，而给水量主要影响的是锅炉水位及蒸汽流量等，并非主要用于主蒸汽温度控制。", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138028", "t": 3, "q": "机炉协调系统中，主蒸汽温度设定值应固定，与负荷、压力无关，以保证设备安全。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "主蒸汽温度设定值并非固定的，它需要根据负荷、压力等工况变化进行调整，以保证机组的安全和高效运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138029", "t": 3, "q": "机炉协调系统中，主蒸汽压力偏差为正时（实际>设定），“机跟炉”模式下应增大汽轮机调门开度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在“机跟炉”模式下，主蒸汽压力偏差为正（实际>设定），说明蒸汽压力过高，此时应减小汽轮机调门开度来降低压力，而不是增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138030", "t": 3, "q": "机炉协调系统中，主蒸汽压力设定值应固定不变，与机组负荷无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机炉协调系统中，主蒸汽压力设定值会随机组负荷变化而调整，并非固定不变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138031", "t": 3, "q": "数值积分步长越小，仿真精度越高，因此步长应尽可能小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "步长小能提升仿真精度，但步长过小会使计算量大幅增加，计算时间变长，甚至可能因计算机的舍入误差等导致精度问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803690036138032", "t": 3, "q": "数值积分中，变步长积分的步长调整仅需考虑精度，无需关注计算效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "变步长积分调整步长时，既要考虑精度以满足结果的准确性要求，也要关注计算效率，避免不必要的大量计算。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 发电过程建模与辨识（2）", "n": "基础练习题【含解析】 / 第3章 发电过程建模与辨识（2）", "qs": [{"id": "2034803699150360576", "t": 1, "q": "机炉协调系统中，当机组发生\"甩负荷\"故障（电网负荷突然降至零）时，协调控制模型应优先采取的措施是?", "a": ["快速增大锅炉燃料量，维持主蒸汽压力", "快速增大给水流量，维持汽包水位", "快速关闭汽轮机调门，防止转速飞升", "快速减小送风量，降低炉膛温度", "", ""], "r": "C", "e": "机组“甩负荷”时，汽轮机输出功率瞬间远大于外界负荷，会导致汽轮机转速飞升，这是很危险的，所以应优先快速关闭汽轮机调门，防止转速飞升。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360577", "t": 1, "q": "机炉协调系统中，当机组负荷处于低负荷工况时，协调控制模型通常会偏向\"炉跟机\"还是\"机跟炉\"模式，主要原因是?", "a": ["偏向\"炉跟机\"，因低负荷时汽轮机响应更快", "偏向\"机跟炉\"，因低负荷时汽轮机调门灵敏度低", "偏向\"机跟炉\"，因低负荷时锅炉燃烧稳定性差，需优先控压力", "偏向\"炉跟机\"，因低负荷时主蒸汽压力允许波动范围大", "", ""], "r": "C", "e": "低负荷时锅炉燃烧稳定性差，为保证主蒸汽压力稳定，需优先控制压力，所以协调控制模型偏向“机跟炉”模式。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034803699150360578", "t": 1, "q": "机炉协调系统中，当主蒸汽压力实际值高于设定值时，若采用\"机跟炉\"模式，汽轮机侧的调整策略是?", "a": ["减小燃料量，降低锅炉出力", "减小调门开度，减少蒸汽流量", "增大燃料量，提高锅炉出力", "增大调门开度，增加蒸汽流量", "", ""], "r": "B", "e": "这是一道关于机炉协调系统操作策略的问题。在“机跟炉”模式下，汽轮机侧会根据锅炉的蒸汽产量进行调整。1. 理解“机跟炉”模式：在此模式下，汽轮机的运行状态跟随锅炉的状态进行调整。这意味着，如果锅炉产生的蒸汽量或压力发生变化，汽轮机将作出相应的调整以匹配这种变化。2. 分析主蒸汽压力变化：题目描述中，主蒸汽压力实际值高于设定值。这意味着锅炉产生的蒸汽压力超过了系统所需。3. 推断汽轮机侧的调整策略：\t* A选项（减小燃料量，
