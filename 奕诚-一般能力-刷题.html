", "2013-2018年全国劳动年龄人口总量逐年减少", "2018年末我国劳动年龄人口占总人口的比重高于60%", "2018年末我国受教育程度为高中的人口多于2010年末", "", ""], "r": "A", "e": "【解析】第一步，本题考查综合分析，且需选出不能推出的一项。第二步，A选项，定位材料第一段，不能明确推出某一年的增加量，所以A推不出。B选项，定位材料第二段“在2012年末我国劳动年龄人口总量达到峰值9.22亿人后增量由正转负”，所以劳动年龄人口逐年减少是对的，可以推出。C选项，定位材料第一段和第二段找到2018年末劳动年龄人口8.97亿人，2018年总人口14亿人，占比大于60%是对的，可以推出。D选项，定位材料第三段“高中及以上…2010年末达到22.9%，2018年末提高到29.3%。”和“大专及以上…2010年末为8.9%，2018年末达到13.0%”，可知，2018年高中人口占比为29.3%－13.0%=16.3%，2010年高中人口占比为22.9%－8.9%=14%，而2018年的总人口多于2010年，因此D选项是可以推出来的。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46654", "t": 1, "q": "1981-1990年这十年，全国人口总增长率是（     ）。", "a": ["<p>14.0%<\/p>", "<p>15.2%<\/p>", "<p>16.4%<\/p>", "<p>19.3%<\/p>", "", ""], "r": "B", "e": "【解析】第一步，本题考查增长率的计算。\n第二步，定位文字材料“1971年末至1980年末，我国人口由8.5亿人增加到9.9亿人，全国人口由1981年末的10.0亿人增加到1990年末的11.4亿人”。\n第三步，根据增长率=（现期量－基期量）/基期量，数据本身不大，不再截位处理，则所求增长率为（11.4－9.9）/9.9=1.5/9.9≈15.2%。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46655", "t": 1, "q": "用V1982-1990、V1990-2000、V2000-2010 分别表示四次人口普查间的全国劳动年龄人平均增长率，下列关系正确的是（     ）。", "a": ["V1982-1990>V1990-2000>V2000-2010", "V1982-1990>V2000-2010>V1990-2000", "V1990-2000>V1982-1990>V2000-2010", "V1990-2000>V2000-2010>V1982-1990", "", ""], "r": "A", "e": "【解析】第一步，本题考查年均增长率的比较。\n第二步，定位文字材料“1982年、1990年、2000年和2010年四次人口普查数据显示，我国劳动年龄人口分别为5.67亿人、6.99亿人、8.08亿人和9.16亿人。”。\n第三步，根据初期量×（1+年均增长率）^n=末期量，（1+年均增长率）^n=末期量/初期量，江苏省考年均增长率一般考虑“翻旧账”，但是本题翻旧账无数据，故不再翻旧账，则“（1+年均增长率）^n=末期量/初期量”中的“末期量/初期量”可分别表示为：1982-1990可化为6.99/5.67，1990-2000可化为8.08/6.99，2000-2010可化为9.16/8.08，直除首三位分别商123，116，113，即（1+V1982-1990）^8≈1.23、（1+V1990-2000）^10≈1.16、（1+V2000-2010）^10≈1.13，观察可知，年均增长率排序为：V1982-1990＞V1990-2000＞V2000-2010。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46656", "t": 1, "q": "全国大专及以上受教育程度人口占人口比重提高最多的时期是（     ）。", "a": ["1981-1990年", "1991-2000年", "2001-2010年", "2011-2018年", "", ""], "r": "C", "e": "【解析】第一步，本题考查已知现期量与基期量的增长量比较问题。\n第二步，定位第三段文字材料“1982年末大专及以上受教育程度人口仅占总人口的0.6%，1990年末为1.4%，2000年末为3.6%。2010年末为8.9%，2018年末达到13.0%”。\n第三步，A选项根据现有数据无法推出，故优先排除，而1991—2000年比重提高3.6%－1.4%=2.2%，2001—2010年比重提高8.9%－3.6%=5.3%，2011—2018年比重提高13%－8.9%=4.1%，则提高最多的为2001—2010年。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46657", "t": 1, "q": "2000年末全国人口为（     ）。", "a": ["11.6亿人", "12.1亿人", "12.6亿人", "13.1亿人", "", ""], "r": "C", "e": "【解析】第一步，本题考查年均增长量计算问题。\n第二步，定位文字材料第一段“全国人口由1981年末的10.0亿人增加到1990年末的11.4亿人，1991-2018年，我国人口年均增加878万人，自2001年以来年均增加711万人”。\n第三步，根据年均增长量=（末期量－初期量）/相差年数，则末期量－初期量=年均增长量×相差年数。江苏省考涉及年均增长类题目需考虑翻旧账，初期向前多考虑一个时期，则2018年末－1990年末=878×28，2018年末－2000年末=711×18，则2000年末－1990年末=878×28－711×18=11786（万人），即1.1786亿人，则2000年末人口数量为11.4＋1.1786≈12.6（亿人）。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46658", "t": 1, "q": "2019年春节期间有“餐饮消费”的受访居民中， 一定有人去（     ）。", "a": ["参加教育培训", "去旅游", "购保健产品", "购数码产品、智能家电", "", ""], "r": "A", "e": "【解析】本题考查其他计算。定位图二，2019年春节期间“餐饮消费”受访居民占比为70.2%，“参加教育培训”受访居民占比为33.2%，“去旅游”受访居民占比为27.9%，“购保健产品”受访居民占比为14.9%，“购数码产品、智能家电”受访居民占比为16.0%。\n在二集合容斥原理中，只需A+B＞100%即可满足A中一定有人去B，要想“餐饮消费”受访居民中一定有人去参加另一个消费项目，则使二者占比加和>100%即可。“餐饮消费”受访居民占比70.2%，两个项目占比满足大于100%的只有“参加教育培训”（33.2%）。故本题选A。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46659", "t": 1, "q": "受访居民中，2019年春节期间消费支出多于上年的人数与少于上年的人数相差（     ）。", "a": ["274人", "292人", "594人", "886人", "", ""], "r": "B", "e": "【解析】本题考查现期比重计算。定位文字材料“2019年2月中下旬，某市统计局随机抽取2000名在该市居住半年以上的18－65周岁居民，就其2019年春节期间的消费情况进行调查。调查结果显示，与上年春节相比，28.3%的受访居民消费支出有所增加，58%的受访居民消费支出基本持平”。\n根据消费支出减少占比=1－消费支出增加占比－消费支出持平占比，可得消费支出减少占比为1－28.3%－58%=13.7%，根据部分量=整体量×比重，整体量一致，两个部分量的差可用整体量×部分量比重差，代入数据可得2000×（28.3%－13.7%）=2000×14.6%=292（人）。故本题选B。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46660", "t": 1, "q": "2019年春节期间消费支出在2000元以下的受访居民，“发红包，给压岁钱”的至少占（     ）。", "a": ["<p>79.4%<\/p>", "<p>61%<\/p>", "<p>54.8%<\/p>", "<p>52.9%<\/p>", "", ""], "r": "D", "e": "【解析】本题考查现期比重计算。定位图一和图二可知，2000元以下受访居民占比为36.7%，“发红包，给压岁钱”占比为82.7%。\n解法一：根据部分量=整体量×比重，可得2000元以下受访居民人数为2000×36.7%=734（人），则2000元及以上和其他受访居民人数为2000－734=1266（人），“发红包，给压岁钱”受访居民人数为2000×82.7%=1654（人），要使消费支出在2000元以下的受访居民“发红包，给压岁钱”人数最少，则2000元及以上和其他受访居民全部“发红包，给压岁钱”，则2000元以下的受访居民“发红包，给压岁钱”的至少有1654－1266=388（人），根据比重=部分量÷整体量，可得比重为388÷734≈52.9%。故本题选D。\n解法二：根据集合与最值的原理，根据部分量=整体量×比重，整体量一致时，可以用占比代替真实的人数，“2000元以下受访居民”与“发红包，给压岁钱”的交集最小为36.7%+82.7%－100%=19.4%，当二者交集最小时，2000元以下受访居民中发红包，给压岁钱的占比也最小，为19.4%÷36.7%≈52.9%。故本题选D。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46661", "t": 1, "q": "2019年春节期间消费支出在5000元以上的受访居民人数有可能是（     ）。", "a": ["320人", "388人", "420人", "456人", "", ""], "r": "B", "e": "【解析】题考查现期比重计算。定位文字材料“2019年……某市统计局随机抽取2000名”，定位图一可知，“2019年春节期间，消费支出在5000—8000元、8000—11000元、11000元以上、说不清的占比分别为11.5%、4.5%、2.9%、1.6%”。根据部分量=整体量×比重，2019年春节期间消费支出在5000元以上的受访居民占比最低是11.5%+4.5%+2.9%=18.9%，最高是11.5%+4.5%+2.9%+1.6%=20.5%，故人数最低应为2000×18.9%=378（人），最多为2000×20.5%=410（人），则人数应介于378—410之间，观察选项，仅B选项符合。故本题选B。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46662", "t": 1, "q": "关于2019年春节期间消费，从上述资料中能够推出的是（     ）。", "a": ["“购买年俗食品、烟酒、服饰”的受访居民中没有人消费支出超出8000元", "消费支出与上年基本持平的受访居民中有16人消费支出为2000-5000元", "受访居民中去“看电影、滑雪、逛庙会”的比“参加教育培训”的多400人", "至少有14.9%的受访居民同时选择“购保健产品” “购数码产品、智能家电”和“去旅游”", "", ""], "r": "C", "e": "【解析】本题考查综合分析，且需选出正确的一项。\nA选项，极值类问题。定位图二可知，“购买年俗食品、烟酒、服饰”的受访居民占比为78.7%，定位图一可知“消费支出超出8000元”的占比介于4.5%+2.9%=7.4%与4.5%+2.9%+1.6%=9%之间，而78.7%+（7.4%~9%） 100%，虽无法证明”购买年俗食品、烟酒、服饰”的受访居民一定有人“消费支出超出8000元”，但也无法证明二者之间一定无交集，错误。\nB选项，求部分量。定位文字材料与图形，材料未给出消费支出与去年持平的人群中，具体支出额的占比，错误。\nC选项，求部分量。定位文字材料可知”2019年……某市统计局随机抽取2000名”，定位图二可知，“看电影、滑雪、逛庙会”与“参加教育培训”的占比分别为53.2%、33.2%，根据部分量=整体量×比重，则受访居民中去“看电影、滑雪、逛庙会”的比“参加教育培训”的多2000×（53.2%－33.2%）=2000×20%=400（人），正确。\nD选项，极值类问题。定位图二可知，“购保健产品”“购数码产品、智能家电”和“去旅游”的占比分别为：14.9%、16%、27.9%，故最多有14.9%的受访居民同时选择这三项，而非最少，错误。\n故本题选C。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46663", "t": 1, "q": "2019年上半年，东部地区各省(市)软件企业的软件业务平均利润的最大值是（     ）。", "a": ["2320万元", "2355万元", "4038万元", "4969万元", "", ""], "r": "C", "e": "【解析】第一步，本题考查现期平均数计算。\n第二步，定位表格材料。\n第三步，根据软件企业的软件业务平均利润=软件业务利润/企业数，观察表格可知，软件业务平均利润明显超过2000万元/个（分子比分母多三位及以上，且直除首位能商2及以上）的有：上海、浙江、广东，将分子单位均用亿元表示后，其平均利润分别为：389÷1679、732÷1813、1042÷4426，直除首位分别商2、4、2，量级一致，最大为浙江，浙江直除首两位商40。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46664", "t": 1, "q": "下列图形中，对2019年上半年东部地区各省(市)软件业务收入构成表示正确的是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260718/sgDH6UUJAI3cEPsS67CKsv7o6fZf6r36N8q6m2ez.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/R0Um6LhsUXMmrmNwNgINJYfpE7YXe5R4zD4gkRIj.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/usmTlbiGmhXnzRbREvNgbt8uzdeddn8s9HBtMrDF.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/I9OshcGSbSMYqUxnS0yZ7n2BfZLcup03lgIiObLK.png\"><\/p>", "", ""], "r": "B", "e": "【解析】第一步，本题考查现期比重计算。\n第二步，定位表格材料。\n第三步，根据比重=部分量/整体量，整体量一致时，部分量的大小即可代表占比的大小。北京（50031221万元）小于广东（58564688），则其占比应小于广东，A选项错误；江苏（47479657万元）低于北京（50031221万元），则其占比应低于北京，C选项错误；将数据截位舍相同处理之后，北京、江苏、山东三个省（市）占整体的比重为（500+475+275）÷2634=1250÷2634＜50%，D图中三者占比之和超过50%，D选项错误。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46665", "t": 1, "q": "部地区各省(市)中，2019年上半年软件业务收入占地区软件业务总收入的比重同比提高的有（     ）。", "a": ["5个", "6个", "7个", "8个", "", ""], "r": "D", "e": "【解析】第一步，本题考查两期比重比较。\n第二步，定位表格“省（市）”、“软件业务收入同比增长（%）”两列。\n第三步，根据两期比重比较口诀，“部分增长率a＞整体增长率b，比重上升；反之，比重下降”，问题要求今年高于去年，则需要部分的增长率a＞整体的增长率b。整体增长率为14.6%，观察发现高于这一数值的有北京（15.5%）、天津（20.3%）、河北（34.3%）、江苏（15.2%）、浙江（16.3%）、福建（15.5%）、山东（16.5%）、海南（43.8%），共计8个。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46666", "t": 1, "q": "2019年上半年，东部地区软件业务收入利润率是（     ）。", "a": ["<p>13.5%<\/p>", "<p>16.5%<\/p>", "<p>18.1%<\/p>", "<p>22.5%<\/p>", "", ""], "r": "A", "e": "【解析】第一步，本题考查现期利润率计算。\n第二步，定位表格最后一行，2019年上半年东部地区的软件业务利润为35464369万元，软件业务收入为263354838万元。\n第三步，根据现期利润率计算公式利润率=利润÷收入，选项出现首位相同，第二位不同的情况，可将分母从左向右截取前三位，则35464369÷263，直除首两位商13。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46667", "t": 1, "q": "关于2019年上半年东部地区软件业的发展情况，从上述资料不能推出的是（     ）。", "a": ["江苏信息技术服务收入同比增加额多于浙江", "软件业务收入同比增加最多的省(市)是广东", "江苏软件企业数是三个直辖市企业总和的1.3倍", "所有省(市)的信息技术服务收入同比增速都在两位数以上", "", ""], "r": "B", "e": "【解析】第一步，本题考查综合分析问题，且需选出不正确的一项。\n第二步，A选项，增长量公式比较。定位表格可知，“2019年上半年江苏信息技术服务收入为26631665万元，同比增长18.3%；浙江收入17545451万元，同比增长19.3%”，根据增长量比较口诀“大大则大，一大一小看乘积”，江苏的“现期量×增长率”明显高于浙江，故其同比增加额多于浙江，正确。\nB选项，增长量公式比较。定位表格，根据增长量比较口诀“大大则大，一大一小看乘积”，广东的“现期量×增长率”（58564688×10.3%）明显低于北京（50031221×15.5%），故其同比增加额少于北京，不是最高，错误。\nC选项，现期倍数计算。定位表格可知“2019年上半年，江苏企业数为7138个，三个直辖市分别是：北京3200个、天津623个、上海1679个”，则江苏软件企业数是三个直辖市企业总和的7138÷（3200+623+1679）≈1.3（倍），正确。\nD选项，读数比较。定位表格，表格中所有省（市）的信息技术服务收入同比增速都高于10%，故都在两位数以上，正确。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46668", "t": 1, "q": "儿童周末用于外出游玩、玩耍和锻炼的日平均用时总和比做作业的多（     ）。", "a": ["66.2分钟", "82.0分钟", "87.0分钟", "92.1分钟", "", ""], "r": "C", "e": "【解析】第一步，本题考查和差计算问题。\n第二步，定位图形材料。\n第三步，将数据简单取整可得儿童周末用于外出游玩、玩耍和锻炼的日平均用时比做作业的多118＋50＋35－116=87。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46669", "t": 1, "q": "对儿童校外生活表示“很满意”或“比较满意”的家长中，表示“很重视”的家长占比可能是（     ）。", "a": ["<p>53%<\/p>", "<p>58%<\/p>", "<p>63%<\/p>", "<p>78%<\/p>", "", ""], "r": "D", "e": "【解析】第一步，本题考查其他类问题。\n第二步，定位文字材料，对儿童校外生活表示“很重视”的家长占85%以上，表示“很满意”或“比较满意”的占60%。\n第三步，由于对儿童校外生活表示“很重视”占比为85%以上，故不重视的占比为15%以下，则在对儿童校外生活表示很满意或比较满意的家长中，不重视的占比＜15%÷60%=25%，则重视的占比＞1－25%=75%，仅D选项符合。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46670", "t": 1, "q": "在该次调查中，市区儿童占被调查儿童的比重是（     ）。", "a": ["<p>40%<\/p>", "<p>50%<\/p>", "<p>60%<\/p>", "<p>70%<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/xEy6dGaamXQdhSmdgAvhfivZYErJ2xTxKJ4AyGQB.png\"><\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46671", "t": 1, "q": "儿童周末校外活动日平均用时是上学日均用时2倍以上的活动类型有（     ）。", "a": ["2类", "3类", "4类", "5类", "", ""], "r": "B", "e": "【解析】第一步，本题考查现期倍数计算。\n第二步，定位柱状图。\n第三步，由题意知“周末日平均用时＞2×上学日日均用时”，观察柱状图，满足2倍以上的活动类型有：外出游玩118.3＞46.7×2；使用电子产品：96.3＞43.2×2；社会学习：29.4＞12.0×2，满足的有3类。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46672", "t": 1, "q": "从上述调查资料中能够推出的是（     ）。", "a": ["对儿童校外生活表示“很重视”的家长不足12000人", "市区儿童日平均使用电子产品的用时不及乡镇儿童的80%", "乡镇儿童上学日利用电子产品看动画等娱乐的平均用时17.3分钟", "儿童上学日利用电子产品学习的用时不足使用电子产品用时的三分之一", "", ""], "r": "D", "e": "【解析】第一步，本题考查综合分析问题，且需选出正确的一项。\n第二步，A选项，求部分量，定位文字材料“回收有效问卷15000份。调查结果显示：对儿童校外生活表示‘很重视’的家长占85%以上”。故家长数量＞15000×85%＞12000，错误。\nB选项，简单计算，定位文字材料可发现，只给出周末乡镇儿童与市区儿童日平均使用电子产品用时，及全部儿童上学日与周末的平均用时，无法推出市区儿童与乡镇儿童对应的日平均使用电子产品用时，错误。\nC选项，简单计算，定位文字材料可发现，只给出上学日全部儿童利用电子产品看动画等娱乐的日平均用时，无法推出乡镇儿童的平均用时。错误\nD选项，现期比值计算，定位文字材料“上学日，儿童日平均使用电子产品用时43.2分钟，其中利用电子产品学习用时13.9分钟”。13.9＜43.2×1/3＝14.4，正确。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46673", "t": 1, "q": "2018年末全国文物机构从业人员中，不具备中高级职称的有（     ）。", "a": ["<p>12.46万人<\/p>", "<p>13.22万人<\/p>", "<p>14.89万人<\/p>", "<p>15.28万人<\/p>", "", ""], "r": "B", "e": "【解析】第一步，本题考查现期比重计算，属于求部分量。\n第二步，定位文字材料第一段“2018年末，全国文物机构从业人员16.26万人，其中，高级职称占6.0%，中级职称占12.7%”。\n第三步，根据部分量＝整体量×比重，得不具备中高级职称的有16.26×（1－6.0%－12.7%）＝16.26×81.3%≈13.2（万人），与B项最接近。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46674", "t": 1, "q": "2018年末全国博物馆文物藏品、文物商店文物藏品占全国文物机构文物藏品的比重之差为（     ）。", "a": ["53.6个百分点", "55.2个百分点", "60.5个百分点", "66.3个百分点", "", ""], "r": "C", "e": "【解析】第一步，本题考查现期比重中求比重计算。\n第二步，定位文字材料第一段“2018年末全国文物机构拥有文物藏品4960.61万件，其中，博物馆文物藏品3754.25万件，文物商店文物藏品751.40万件”。\n第三步，根据比重＝部分量/整体量，分母截位处理，分子加减法考虑截位舍相同，可得\n比重之差为（375—75）÷496=300÷496，直除前两位为60，与C项最接近。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46675", "t": 1, "q": "从上述材料不能推出的是（     ）。", "a": ["2011-2018年全国文物机构数呈逐年增加的态势", "2018年末全国博物馆数量比文物保护管理机构数量多", "2017年末全国文物机构从业人员比上年末增加1100人", "2018年末全国文物机构拥有文物藏品比上年末增加100多万件", "", ""], "r": "C", "e": "【解析】第一步，本题考查综合分析问题，且需选出不正确的一项。\n第二步，A选项，读数比较，定位图形材料中折线图。通过图形可知，2011—2018年逐年增加，正确。\nB选项，读数比较，定位文字材料“2018年文物保护管理机构3550个，占34.9%；博物馆4918个，占48.4%”。则博物馆数量多于文物保护管理机构，正确。\nC选项，已知现期量和基期量的增长量计算，定位图形材料中柱状图。2017年末为161500，2016年末为151430，根据增长量=现期量－基期量，可得161500－151430=10000＋，而非1100人，错误。\nD选项，增长量计算，定位文字材料“2018年全国文物机构拥有文物藏品4960.61万件，比上年末增长2.3%”。2.3%≈1/44，根据增长量计算n＋1原则可得4960.61÷（44＋1）=4960.61÷45＞100，正确。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46676", "t": 1, "q": "2011-2018年全国文物机构数增加最多的年份是（     ）。", "a": ["2011年", "2013年", "2015年", "2017年", "", ""], "r": "B", "e": "【解析】第一步，本题考查增长量比较。\n第二步，定位折线图“2010—2017年全国文物机构数分别为：5207个，5728个，6124个，7737个，8421个，8676个，8954个，9931个”。\n第三步，根据增长量＝现期量－基期量，分别计算每个选项：2011年增量＝5728－5207＝521（个）；2013年增量＝7737－6124＝1613（个）；2015年增量＝8676－8421＝255（个）；2017年增量＝9931－8954＝977（个），可知2013年增加最多。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46677", "t": 1, "q": "2011-2018年全国文物机构从业人员年均增加（     ）。", "a": ["7516人", "7821人", "8106人", "8738 人", "", ""], "r": "A", "e": "【解析】第一步，本题考查年均增长量计算。\n第二步，定位柱状图“2010年全国文物机构从业人员数为102471人，2018年为162600人”。\n第三步，根据年均增长量＝（末期量－初期量）/相差年数，江苏省考年均增长类题目需考虑翻旧账，分子加减法考虑截位舍相同，可得2011—2018年全国文物机构从业人员年均增加（1626—1025）÷8=601÷8，直除首两位商75，只有A满足。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46678", "t": 1, "q": "2017年上半年，教辅材料与科技类图书码洋在全国图书零售市场中的占比（     ）。", "a": ["低于20%", "在20%—25%之间", "在25%—30%之间", "超过30%", "", ""], "r": "B", "e": "【解析】第一步，本题考查比重计算问题。\n第二步，定位图和表格材料。\n第三步，根据比重=部分量/整体量，选项是范围类数据，可取数据做取整处理，可得比重≈（27+17）÷（47+142）≈23%。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46679", "t": 1, "q": "如2019年上半年我国图书零售市场中，网店平均打5.5折销售，实体店平均打9折销售，则同期网店图书实际营业额约是实体店的（     ）倍。", "a": ["2.5", "3.3", "4.2", "5.4", "", ""], "r": "B", "e": "【解析】第一步，本题考查现期倍数计算问题。\n第二步，定位柱状图。\n第三步，根据实际营业额=码洋×折扣，选项数据首位不同，则可对数据做取整处理。2019年上半年我国图书零售网店实际营业额为：215×0.55≈118（亿元），2019年上半年我国图书零售实体店实际营业额为：40×0.9=36（亿元），则网店营业额是实体店营业额的倍数约为118÷36 ，直除首位商3。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46680", "t": 1, "q": "能够从上述资料中推出的是（     ）。", "a": ["2017—2019年，每年上半年实体店码洋同比下降金额逐年递增", "2017年上半年，少儿类图书码洋是科技类图书的3倍以上", "2017—2019年，文学类图书总码洋在70亿至80亿元之间", "如2019年下半年环比增速达到20%，则全年网店码洋将超过500亿元", "", ""], "r": "A", "e": "【解析】第一步，本题考查综合分析，且需选出正确的一项。\n第二步，A选项，增长量（减少量）比较，定位柱状图，根据减少量=基期量－现期量，2017年上半年实体店码洋的下降量=47.26－46.59＜1，2018年上半年实体店码洋的下降量=46.59－45.22＞1且＜2，2019年上半年实体店码洋的下降量=45.22－39.92＞5，则下降金额逐年递增，正确。\nB选项，现期倍数计算，定位表格，2017年上半年，少儿类图书码洋是科技类图书的倍数为48.16÷16.96＜3，错误。\nC选项，简单计算，定位柱状图和表格，只给出上半年的数据，未给出下半年的数据，故无法求出全年的数据，错误。\nD选项，现期量计算。定位柱状图，根据现期量=基期量×（1+增长率），2019年下半年网店码洋=215.31×（1+20%），则2019年全年=2019年上半年+2019下半年=215.31+215.31×1.2=215.31×2.2＜220×2.2=484＜500，错误。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46681", "t": 1, "q": "2017—2019年，每年上半年网店图书零售码洋同比增速（     ）。", "a": ["逐年升高", "逐年降低", "先升高后降低", "先降低后升高", "", ""], "r": "D", "e": "【解析】第一步，本题考查增长率的比较问题。\n第二步，定位柱状图。\n第三步，根据增长率=（现期量－基期量）/基期量，选项无数据，则分母从左向右截取前三位，分子为减法考虑截位舍相同，则每年上半年网店图书零售码洋同比增速分别为：2017年为（142—109）÷109≈30%，2018年为（173—142）÷142≈22%，2019年为（215—173）÷173≈24%≈24%，观察可知，增长率先降低后升高。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46682", "t": 1, "q": "2019年上半年我国图书零售市场实体店与网店码洋之和比上年高（     ）。", "a": ["不到35亿元", "35亿元至40亿元", "40亿至45亿元", "超过45亿元", "", ""], "r": "B", "e": "【解析】第一步，本题考查增长量计算问题。\n第二步，定位柱状图。\n第三步，根据增长量=现期量－基期量，选项是范围类数据，只对数据做取整处理，2019上半年我国图书零售市场实体店和网店码洋之和约为215+40=255（亿元），2018上半年我国图书零售市场实体店和网店码洋之和约为173+45=218（亿元），则2019上半年比上年高：255－218=37（亿元）。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46683", "t": 1, "q": "2018年，我国海洋经济发展支柱产业产值约为 （     ）万亿元。", "a": ["1.61", "2.36", "2.74", "3.32", "", ""], "r": "C", "e": "【解析】第一步，本题考查简单计算中的和差类。\n第二步，定位文字“滨海旅游业、海洋交通运输业和海洋渔业作为海洋经济发展的支柱产业”和表格材料。\n第三步，滨海旅游业总量16078亿元、海洋交通运输业总量6522亿元、海洋渔业总量4801亿元，选项首位相同，第二位不同，数据从左向右截取前三位，加减计算考虑截位舍相同，可得161+65+48=274，应为27400亿元，即2.74万亿元。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46684", "t": 1, "q": "以下说法正确的是（     ）。", "a": ["2017年，我国主要海洋产业中产值最小的是海洋盐业", "2015—2018年，我国海洋生产总值增量最少的是2016年", "2014—2018年，我国海洋经济在国民经济中的比重越来越大", "2018年，我国海洋科研教育管理服务业产值比上年增长超过0.2万亿元", "", ""], "r": "B", "e": "【解析】第一步，本题考查综合分析问题，且需选出正确的一项。\n第二步，A选项，基期量比较。定位表格材料。根据基期量=现期量/（1+增长率），2017年海洋盐业=39÷（1—16.6%），2017年海水利用业=17÷（1+7.9%），根据分数性质可知，前面的分数大于后面的分数，即2017年海洋盐业＞2017年海水利用业，所以海洋盐业产值不是最低，错误。\nB选项，增长量比较。定位柱状图。根据增长量=现期量－基期量，无数据，加减法考虑截位舍相同，2015—2018年的增长量分别为，2015年：655－607=48；2016年：697－655=42；2017年：767－697=70；2018年：834－767=67。2016年的增长量最少，正确。\nC选项，直接读数。定位柱状图。直读发现，比重占比不是越来越大，错误。\nD选项，增长量计算。定位表格材料。根据增长量计算n+1原则，增长率=10.2%≈1/10，所求增长量约为19356÷（10+1）=1.9356÷11（万亿元）＜0.2万亿元，错误。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46685", "t": 1, "q": "<p>2017年，我国海洋船舶工业产值约比海洋化工业产值（ ）亿元 。<\/p>", "a": ["<p>少50<\/p>", "<p>少20<\/p>", "<p>多50<\/p>", "<p>多20<\/p>", "", ""], "r": "D", "e": "【解析】第一步，本题考查基期量差值计算问题。\n第二步，定位表格材料。\n第三步，根据基期量=现期量/（1+增长率），所求差值=997÷（1—9.8%）≈20，即多了20亿元。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46686", "t": 1, "q": "2018年我国海洋生产总值较2015年增加了约（     ）。", "a": ["<p>8.7%<\/p>", "<p>19.7%<\/p>", "<p>27.3%<\/p>", "<p>37.4%<\/p>", "", ""], "r": "C", "e": "【解析】第一步，本题考查增长率计算问题。\n第二步，定位柱状图2015、2018年数据。\n第三步，根据增长率=（现期量－基期量）/基期量，选项出现首位各不相同的情况，分母从左向右截取前两位，分子加减计算考虑截位舍相同处理，选项量级一致，故无需考虑截位中量级保留问题，可得（83—66）÷66，直除首位商2。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46687", "t": 1, "q": "如果2019年我国海洋新兴产业保持2018年的增速2019年我国海洋新兴产业产值将比2017年多约，则（     ）。", "a": ["<p>22%<\/p>", "<p>27%<\/p>", "<p>23%<\/p>", "<p>27%<\/p>", "", ""], "r": "A", "e": "【解析】第一步，本题考查增长率计算问题。\n第二步，定位表格材料。\n第三步，解法一：海洋新兴产业包含海洋生物医药业和海洋电力业，则分别求两个产业的现期和基期。2019年海洋生物医药业=413×（1+9.6%）≈453，2019年海洋电力业=172×（1+12.8%）≈194，则2019年海洋新兴产业=453+194=647；2017年海洋生物医药业=413÷（1+9.6%）≈377，2017年海洋电力业=172÷（1+12.8%）≈152，则2017年海洋新兴产业=377+152=529。根据增长率=（现期量－基期量）/基期量，则所求增长率=（647—529）÷529，直除首两位商22。\n因此，选择A选项。\n解法二：海洋新兴产业包含海洋生物医药业和海洋电力业，要求海洋新兴产业（2019相比于2017年的增长率），则可分别求出海洋生物医药业（2019相比于2017年的增长率）和海洋电力业（2019相比于2017年的增长率），再根据混合增长率的思维进行求解。根据间隔增长率R=r1+r2+r1×r2，海洋生物医药业（2019相比于2017年的增长率）=9.6%+9.6%+9.6%×9.6%≈19.2%+9.6%×1/11≈20%；海洋电力业（2019相比于2017年的增长率）=12.8%+12.8%+12.8%×12.8%≈25.6%+12.8%×1/8≈27%。根据混合增长率口诀，整体增速介于部分增速之间，可得20%＜整体增长率＜27%，结合选项，只有A选项满足。\n因此，选择A选项", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46688", "t": 1, "q": "2018年，广东社会消费品零售总额同比增幅较全国平均水平约（     ）。", "a": ["高0.1个百分点", "低0.2个百分点", "低4.6个百分点", "高4.8个百分点", "", ""], "r": "B", "e": "【解析】第一步，本题考查增长率的简单和差计算。\n第二步，定位表格材料，2018年，全国社会消费品零售总额增速为9.0%，广东省社会消费品零售总额增速为8.8%。\n第三步，2018年，广东社会消费品零售总额同比增幅与全国平均水平之差为8.8%－9.0%=－0.2%，即低0.2个百分点。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46689", "t": 1, "q": "2017年广东规模以上工业增加值约占全国的（     ）。", "a": ["<p>6.6%<\/p>", "<p>8.6%<\/p>", "<p>10.6%<\/p>", "<p>12.6%<\/p>", "", ""], "r": "C", "e": "【解析】第一步，本题考查基期比重计算。\n第二步，定位表格材料数据，2018年全国规模以上工业增加值30.52亿元，增速为6.2%；广东省规模以上工业增加值3.23亿元，增速为6.3%。\n第三步，根据基期比重=A/B×（1+b）/（1+a），选项出现了首位相同第二位不同的情况，分母从左向右截取前三位，分子不做处理有（3.23÷30.5）×（1.062÷1.063），乘号前的式子直除首两位商10，乘号后的式子与1非常接近，结果应该与C最接近。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46690", "t": 1, "q": "2016年广东省三大产业结构约为（     ）。", "a": ["4.2：42.6：53.2", "4.1：41.6：54.3", "3.9：42.2：53.9", "无法推测", "", ""], "r": "A", "e": "【解析】第一步，本题考查比重比较。\n第二步，定位文字材料第二段。\n第三步，有数据，可以计算，排除D选项。根据间隔增长率R=r1+r2+r1×r2，第一产业r1=4.2%，r2=4.2%－0.7%=3.5%；第二产业r1=5.9%，r2=5.9%＋0.8%=6.7%；第三产业r1=7.8%，r2=7.8%＋0.8%=8.6%，则间隔增长率第三产业＞第二产业＞第一产业。根据混合增长率口诀“整体增长率介于部分增长率之间”，则第一产业的增长率低于整体增长率，第三产业的增长率高于整体增长率。根据两期比重比较口诀“部分增长率高于整体增长率，比重上升；反之，比重下降”，故2018年第一产业占比应低于2016年，第三产业应高于2016年；根据2018年三大产业结构约为4.0∶41.8∶54.2，则2016年第一产业结构应大于4.0，排除C选项，2016年第三产业结构应小于54.2，排除B选项。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46691", "t": 1, "q": "<p>①②③④描述的均为客观事实，其中能够从材料中得出的有（ ） 。<\/p>\n<p>①2018年广东省GDP占全国比重较2017年有所增加<\/p>\n<p>②2018年全年人民币兑美元平均汇率约为6.6<\/p>\n<p>③2018年中国总人口约为13.95亿<\/p>\n<p>④按可比价格计算，2017年广东省GDP 同比增长率达到7.5%<\/p>", "a": ["<p>①<\/p>", "<p>①③<\/p>", "<p>①②③<\/p>", "<p>①②③④<\/p>", "", ""], "r": "D", "e": "【解析】第一步，本题考查综合分析问题且需选出正确的个数。\n第二步，①考查两期比重比较，根据两期比重比较口诀，只需比较部分增速和整体增速，广东省GDP增速为6.8%＞全国GDP增速6.6%，则2018年广东省GDP占全国的比重高于上年，①正确。\n②考查比值计算，2018年人均生产总值为86412元，按年平均汇率折算，达到13058.30美元，故平均汇率为86412÷13058.3≈6.6，②正确。\n③考查平均数计算，2018年全国人均生产总值为86412－21891＝64521（元），全国的GDP为90.03万亿元，即900300亿元，那么人口数为900300÷64521≈13.954（亿人），③正确。\n④考查增长率计算，2017年广东省GDP为97277.77÷（1+6.8%）≈91084，GDP为三大产业增加值之和，2016年广东省第一、二、三产业的，产值分别约为3831.44÷（1+4.2%）÷（1+3.5%）≈3553（亿元）、40695.15÷（1+5.9%）÷（1+6.7%）≈36015（亿元）、52751.18÷（1+7.8%）÷（1+8.6%）≈45059（亿元），那么2017年广东省GDP的同比增速约为91084÷（3553+36015+45059）—1≈7.5%，④正确。\n故①②③④说法都是正确的。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46692", "t": 1, "q": "2018年全国进出口总额较2017年增加约 （     ）万亿元。", "a": ["1.2", "2.7", "4.2", "5.7", "", ""], "r": "B", "e": "【解析】第一步，本题考查增长量计算问题。\n第二步，定位表格材料全国进出口总额数据。\n第三步，根据增加量的n+1原则，9.7%≈1/10，利用增长量计算的n+1原则，则2018年全国进出口总额较2017年约增加30.51÷（10+1）≈2.8（万亿元）。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46693", "t": 1, "q": "2018年1—8月，住宅投资占全国房地产开发投资比重约为（     ）。", "a": ["<p>65%<\/p>", "<p>69%<\/p>", "<p>74%<\/p>", "<p>77%<\/p>", "", ""], "r": "C", "e": "【解析】第一步，本题考查基期比重计算。\n第二步，定位文字材料，“2019年1—8月份，全国房地产开发投资84589亿元，同比增长10.5%，增速比1—7月回落0.1个百分点。其中，住宅投资65187亿元，增长14.9%，增速回落0.2个百分点”。\n第三步，根据基期比重=A/B×（1+b）/（1+a） ，代入数据，复杂计算可截位处理数据，利用拆1法，可得652/846×（1+10.5%）/（1+14.9%）≈74%。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46694", "t": 1, "q": "下列说法错误的是（     ）。", "a": ["2019年1—8月，全国各地区商品房单价均保持上涨", "2019年1—8月，全国商品房销售额最多的是东部地区", "2018年1—8月，西部地区商品房销售面积约为27248万平方米", "2019年1—7月，全国房地产开发投资东部地区增速高于东北地区", "", ""], "r": "D", "e": "【解析】第一步，本题考查综合分析问题，且需选出错误的一项。\n第二步，A选项，两期平均数比较。定位文字材料第四段，“2019年1—8月份，东部地区商品房销售面积40303万平方米，同比下降3.6%；销售额50739亿元，增长5.5%。中部地区商品房销售面积28791万平方米，增长0.5%；销售额20682亿元，增长7.4%。西部地区商品房销售面积28284万平方米，增长3.8%；销售额20363亿元，增长9.9%。东北地区商品房销售面积4471万平方米，下降6.6%；销售额3589亿元，增长2.3%”。根据两期平均数比较口诀，分子的增长率a＞分母的增长率b，即为上涨。又根据价格=销售额/销售面积，则销售额的增长率为a，销售面积的增长率为b。分别看各个地区，东部地区a=5.5%＞－3.6%=b；中部地区a=7.4%＞0.5%=b；西部地区a=9.9%＞3.8%=b；东北地区a=2.3%＞－6.6%=b。四个地区价格均上升（或根据上题解析观察），正确。\nB选项，直接读数。定位文字材料第四段，“2019年1—8月份，东部地区商品房销售额50739亿元，中部地区商品房销售额20682亿元，西部地区商品房销售额20363亿元，东北地区商品房销售额3589亿元”。通过读数可知，东部地区商品房销售额（50739亿元）最高，正确。\nC选项，基期量计算。定位文字材料第四段，“2019年1—8月份，西部地区商品房销售面积28284万平方米，增长3.8%”，根据基期量=现期量/（1+增长率），代入数据可得28284÷（1+3.8%）≈27248（万平方米），正确。\nD选项，和差比较。定位文字材料第二段，“2019年1—8月份，东部地区房地产开发投资44857亿元，同比增长8.8%，增速比1—7月份回落0.4个百分点；东北地区投资3418亿元，增长9.7%，增速回落1.3个百分点”。2019年1—7月东部地区房地产开发投资同比增长率8.8%+0.4%=9.2%＜2019年1—7月东北地区房地产开发投资同比增长率9.7%+1.3%=11%，错误。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46695", "t": 1, "q": "2019年1—8月，房地产开发企业土地成交额与去年同期相比增长约为（     ）。", "a": ["<p>-17%<\/p>", "<p>-22%<\/p>", "<p>-27%<\/p>", "<p>1.2%<\/p>", "", ""], "r": "B", "e": "【解析】第一步，本题考查平均数增长率计算。\n第二步，定位文字材料第三段，“1—8月，房地产开发企业土地购置面积12236万平方米，同比下降25.6%，每平方米土地价格同比上涨4.5%，土地成交额6374亿元”。\n第三步，每平方米土地价格＝土地成交额÷土地购置面积，根据平均数增长率计算公式（a—b）÷（1+b），本题实际是已知平均数增长率求解增速a，代入数据可得4.5%=【a—（-25.6%）】÷【1+（-25.6%）】，解得a≈－22.3%，B选项最接近。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46696", "t": 1, "q": "2019年1—8月，下列地区中商品房价格同比增长最慢的是（     ）。", "a": ["东部地区", "西部地区", "中部地区", "东北地区", "", ""], "r": "B", "e": "【解析】第一步，本题考查平均数增长率比较。\n第二步，定位文字材料，“2019年1—8月份，东部地区商品房销售面积40303万平方米，同比下降3.6%；销售额50739亿元，增长5.5%。中部地区商品房销售面积28791万平方米，增长0.5%；销售额20682亿元，增长7.4%。西部地区商品房销售面积28284万平方米，增长3.8%；销售额20363亿元，增长9.9%。东北地区商品房销售面积4471万平方米，下降6.6%；销售额3589亿元，增长2.3%”。\n第三步，根据平均数增长率公式：（a—b）÷（1+b），代入数据，东部地区【5.5%—（-3.6%）】÷【1+（-3.6%）】＞9.1%，西部地区（9.9%—3.8%）÷（1+3.8%）＜6%，中部地区（7.4%—0.5%）÷（1+0.5%）＞6%，东北地区【2.3%—（-6.6%）】÷【1+（-6.6%）】＞9%，商品房价格同比增长最慢的是西部地区。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46697", "t": 1, "q": "2019年1-8月，西部地区投资比去年同期增长约（     ）亿元。", "a": ["2812", "2643", "2552", "2313", "", ""], "r": "C", "e": "【解析】第一步，本题考查增长量计算中的已知现期量与增长率。\n第二步，定位文字材料，“2019年1—8月份，西部地区投资18506亿元，增长16.0%，增速加快0.9个百分点”。第三步，已知现期量与增长率，计算增长量，可利用增长量计算n+1原则。根据增长率16%≈1/6.3，代入数据，可得增长量为18506÷（6.3+1），直除首两位商25。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46698", "t": 1, "q": "2021年上半年湖北省规上信息软件业中营业收入前20的企业，平均每家每月营业收入约为多少亿元?（     ）", "a": ["1.18", "2.25", "2.32", "2.96", "", ""], "r": "D", "e": "【解析】第一步，本题考查现期平均数计算。\n第二步，定位文字材料第二段，“2021年上半年，湖北省676家规上信息软件业企业中营业收入前20的企业共实现营业收入355.46亿元”。\n第三步，根据平均数=总数÷总份数，平均每家企业每月营业收入为355.46÷（20×6），首两位商29。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46699", "t": 1, "q": "2021年上半年，湖北、河南、安徽、江西四省规上信息软件业营业收入占规上服务业比重由高到低的排名与拉动规上服务业增长由高到低的排名相同的有几个省份?（     ）", "a": ["1", "2", "3", "4", "", ""], "r": "A", "e": "【解析】第一步，本题考查排序比较。\n第二步，定位表2。\n第三步，2021年上半年，湖北、河南、安徽、江西四省规上信息软件业营业收入占规上服务业比重分别为：20.6%、17.4%、25.7%、23%，排名分别为第三、第四、第一、第二；拉动规上服务业增长分别为：4.9个百分点、3.4个百分点、4.5个百分点、3.7个百分点，排名分别为第一、第四、第二、第三；因此，排名相同的有一个省份：河南（均为第四名）。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46700", "t": 1, "q": "以下四组地区中，哪组2021年上半年规上服务业营业收入之差最小?（     ）", "a": ["北京和上海", "浙江和广东", "河南和江西", "湖北和安徽", "", ""], "r": "D", "e": "【解析】第一步，本题考查现期比重计算中的求整体量。\n第二步，定位表2。\n第三步，根据整体量=部分量÷比重，统一将分母截取前三位，分子取整处理，则各选项规上服务业营业收入之差分别为：A选项（9751÷41%）—（4679÷23%）≈23800-20300=3500，B选项（6612÷34.5%）—（5587÷45.9%）≈19200-12200=7000，C选项（640÷17.4%）—（378÷23%）≈3680-1640=2040，D选项（744÷20.6%）—（556÷25.7%）≈3610-2160=1450，差值最小的为D选项。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46701", "t": 1, "q": "2020年上半年湖北省规上信息软件业主要细分行业营业收入中，应用软件开发占软件和信息技术服务业的比例比互联网其他信息服务占互联网和相关服务业的比例约低多少个百分点?（     ）", "a": ["17", "26", "31", "45", "", ""], "r": "C", "e": "【解析】第一步，本题考查基期比重计算。\n第二步，定位表1。\n第三步，根据基期比重公式A/B×（1+b）/（1+a） ，复杂计算将数据截位代入可得，2020年上半年，湖北省应用软件开发占软件和信息技术服务业的比例为192/330×（1+26.8%）/（1+33.2%）≈55.2%；2020年上半年，湖北省互联网其他信息服务占互联网和相关服务业的比例约为90/109×（1+23.5%）/（1+16.9%） ≈87.6%；故前者比后者约低87.6%-55.2%=32.4个百分点，与C选项最为接近。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46702", "t": 1, "q": "下列说法不正确的是（     ）。", "a": ["2021年上半年，北京规上服务业营业收入占全国的比例比上海多5%以内", "2020年上半年，江苏、湖北、河南、安  徽、江西五省规上信息软件业企业营业收入之和比上海低", "2021年上半年湖北比河南规上信息软件业营业收入多，规上服务业营业收入少", "2020年上半年湖北省规上信息软件业企业中营业收入前20的企业总营业收入，与2021年上半年湖北省规上信息软件业中软件和信息技术服务业营业收入的差在5亿元以内", "", ""], "r": "B", "e": "【解析】第一步，本题考查综合分析问题，且需选出不正确的一项。\n第二步，A选项，现期比重计算。定位表2，根据整体量＝部分量/比重，2021年上半年全国规上服务业营业收入为39272÷29%≈135421（亿元）；北京规上服务业营业收入为9751÷41%≈23783（亿元），上海为4679÷23%≈20343（亿元），可得北京规上服务业营业收入占比比上海多（23783—20343）÷135421＜5%，多5%以内，正确。\nB选项，基期量比较。根据基期量＝现期量/（1＋增长率），可得2020年上半年上海规上信息软件业企业营业收入为4679÷（1+30.5%）≈3572（亿元）。2021年上半年江苏、湖北、河南、安徽、江西五省规上信息软件业企业营业收入之和为2202＋744＋640＋556＋378＝4520，利用混合增速的结论可知，五省规上信息软件业企业营业收入同比增速在13.7%—25.1%之间，故2020年上半年五省规上信息软件业企业营业收入高于4520÷（1+25.1%）≈3613（亿元），故2020年上半年五省规上信息软件业企业营业收入高于上海，错误。\nC选项，其他比较。定位表2。2021年湖北规上信息软件业营业收入（744.27亿元）高于河南（639.54亿元）；根据整体量＝部分量/比重，可得湖北规上服务业营业收入为744.27÷20.6%≈3613（亿元），河南规上服务业营业收入为639.54÷17.4%%≈3676（亿元），湖北规上服务业收入比河南少，正确。\nD选项，基期量计算。定位文字材料和表1。根据基期量＝现期量/（1＋增长率），可得2020年上半年，湖北省规上信息软件业企业中营业收入前20的企业总营业收入为355.46÷（1+8.3%）≈329（亿元），与2021年上半年湖北省规上软件和信息技术服务业营业收入（329.91亿元）之差在5亿元以内，正确。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46703", "t": 1, "q": "2017年1～3月，国内手机市场手机月均出货量（     ）。", "a": ["低于0.3亿部", "在0.3～0.36亿部之间", "在0.36～0.42亿部之间", "高于0.42亿部", "", ""], "r": "C", "e": "【解析】第一步，本题考查基期平均数计算。\n第二步，定位第一段文字材料，“2018年1—3月，国内手机市场出货量8737.0万部，同比下降26.1%”。\n第三步，根据基期量=现期量/（1+增长率），8737万部=0.8737亿部，代入数据可得2017年1—3月，国内手机市场手机月均出货量为0.87÷（1—26.1%）÷3≈0.39（亿部），在C选项范围内。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46704", "t": 1, "q": "2018年1～2月上市4G 非全网通手机新机型多少款?（     ）", "a": ["19", "27", "38", "46", "", ""], "r": "A", "e": "【解析】第一步，本题考查现期比重计算中的求部分量。\n第二步，定位第二段文字材料，“2018年3月，4G上市新机型67款，其中4G全网通手机占比71.6%。2018年1—3月，4G上市新款机型156款，其中4G全网通手机占比75.6%”。\n第三步，根据材料数据可知，2018年3月上市4G非全网通手机新机型占比为1－71.6%=28.4%，2018年1—3月占比为1－75.6%=24.4%，则根据部分量=整体量×比重可得，2018年1—2月上市4G非全网通手机新机型156×24.4%－67×28.4%≈39－19=20（款），与A选项最接近。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46705", "t": 1, "q": "在①国内4G手机出货量、②国产品牌手机出货量、③智能手机出货量中，2018年1～3月出货量占全国手机出货量比重高于上年水平的有（     ）类。", "a": ["0", "1", "2", "3", "", ""], "r": "A", "e": "【解析】第一步，本题考查两期比重比较问题。\n第二步，定位前四段文字材料，“2018年1—3月，国内手机出货量8737.0万部，同比下降26.1%。4G手机出货量8195.6万部，同比下降27.1%。国产品牌手机出货量7586.4万部，同比下降27.8%。智能手机出货量为8187.0万部，同比下降27%”。\n第三步，根据两期比重比较口诀，部分量增长率a＞整体量增长率b，则比重高于上年，b=－26.1%，而部分增长率－27.1%，－27.8%和－27%均小于－26.1%，故0个符合。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46706", "t": 1, "q": "2018年1～2月，国产品牌手机出货量同比约下降了（     ）。", "a": ["<p>25.5%<\/p>", "<p>26.6%<\/p>", "<p>27.1%<\/p>", "<p>28.4%<\/p>", "", ""], "r": "C", "e": "【解析】第一步，本题考查混合增长率计算问题。\n第二步，定位第三段文字材料，“2018年3月，国产品牌手机出货量2699.5万部，同比下降29.0%；1—3月国产品牌手机出货量7586.4万部，同比下降27.8%”。\n第三步，根据混合增长率计算口诀，整体增速介于各部分之间，2018年1—3月同比减少率为27.8%，3月为29.0%，则2018年1—2月，减少率应＜27.8%，排除D选项。又根据偏向基数较大一侧，可知整体减少率应偏向1—2月的减少率，则1—2月减少率＞27.8%－（29.0%－27.8%）=27.8%－1.2%=26.6%，仅C选项符合。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46707", "t": 1, "q": "<p>以下信息中，能够从上述资料中推出的有几条?（ ）<\/p>\n<p>①2017年3月，国内手机市场上市新机型100多款<\/p>\n<p>②2018年3月，智能手机出货量高于1～3月平均水平<\/p>\n<p>③2018年3月，4G 全网通手机出货量是4G非全网通手机的16倍多<\/p>\n<p>④2018年1～3月上市的智能手机新机型中，5%以上不支持安卓操作系统<\/p>", "a": ["<p>1<\/p>", "<p>2<\/p>", "<p>3<\/p>", "<p>4<\/p>", "", ""], "r": "B", "e": "【解析】第一步，本题考查综合分析问题，且需选出正确的条数。\n第二步，①基期量计算，定位第一段文字材料，根据基期量=现期量/（1+增长率）=80÷（1—37.5%）＞100（款），正确。\n②平均数比较，定位第四段文字材料，若3月＞1—3月平均值，则3×3月＞1—3月，根据材料数据可知，2808.3×3≈2800×3=8400（万部）＞8187（万部），正确。\n③倍数计算，定位第二段文字材料，整体量已知，求部分量之间的倍数关系可用比重数据替代，则2018年3月，4G全网通手机出货量是4G非全网通的94%÷（1—94%）＜16，不是16倍多，错误。\n④现期比重计算，定位第四段文字材料，根据比重=部分量/整体量=（158—152）÷158，首位商3，应为5%以下的智能手机不支持安卓系统，错误。故有2条正确。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46708", "t": 1, "q": "设Y市文化科技融合示范区、时尚创意功能区、文化体育(会展)融合功能区和文化艺术品交易功能区规模以上法人单位2017年上半年收入同比增长率分别为X、Y、Z和N，则以下正确的是（     ）。", "a": ["X>Y>Z>N", "X>N>Z>y", "Y>Z>X>N", "Y>Z>N>X", "", ""], "r": "D", "e": "【解析】第一步，本题考查增长率读数比较。\n第二步，定位文字材料“2017年上半年，Y市文化科技融合示范区实现收入2616.1亿元，同比增长13.5%，时尚创意功能区、文化体育（会展）融合功能区、文化艺术品交易功能区分别实现收入187.9亿元、167.5亿元、52.2亿元，同比分别增长28.6%、24.1%和20.7%，均呈快速增长态势”。\n第三步，直接读数比较大小，从大到小依次是“时尚创意功能区”、“文化体育（会展）融合功能区”、“文化艺术品交易功能区”、“文化科技融合示范区”，即Y>Z>N>X。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46709", "t": 1, "q": "2017年上半年，Y市软件和信息技术服务领域规模以上法人单位收入同比增量约占全市规模以上文创产业法人单位同比增量的（     ）。", "a": ["四成", "五成", "六成", "七成", "", ""], "r": "C", "e": "【解析】第一步，本题考查其他计算。\n第二步，定位文字材料第一段和第二段“2017年上半年，规模以上文创产业法人单位实现收入6902.7亿元，同比增长8.6%......软件和信息技术服务领域实现收入2836.7亿元，增长13.4%”。\n第三步，根据公式增长量=（现期量×增长率）/（1＋增长率），8.6%≈1/11.5，分子简单取整，根据增长量计算n＋1原则，则全市规模以上文创产业法人单位同比增量为6903÷（1+11.5）≈552（亿元），同样的13.4%≈1/7.5，则Y市软件和信息技术服务领域规模以上法人单位收入同比增量2837÷（7.5+1）≈334（亿元），根据比重=部分量/整体量，则占比为334÷552≈60%。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46710", "t": 1, "q": "Y市2017年上半年固定资产投资总额为3569.7亿元。则同期旅游休闲娱乐领域之外的文化创意产业完成固定资产投资占全市投资总额的比重为（     ）。", "a": ["<p>1.7%<\/p>", "<p>2.3%<\/p>", "<p>3.1%<\/p>", "<p>4.0%<\/p>", "", ""], "r": "A", "e": "【解析】第一步，本题考查现期比重中的求比重。\n第二步，定位文字材料“2017年上半年文化创意产业完成固定资产投资141.6亿元，其中，旅游休闲娱乐领域完成投资81.3亿元”。\n第三步，根据公式比重=部分量/整体量，旅游休闲娱乐领域之外的文化创意产业完成投资额=文化创意产业完成固定资产投资额－旅游休闲娱乐领域完成投资额，选项首位不同，分母从左往右截取前两位，分子简单取整，则占比为（142—81）÷36，直除首位商1。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46711", "t": 1, "q": "2017年上半年，Y市地区生产总值同比增长6.8%。该市文化创意产业增加值占地区生产总值比重比上年提高了约（     ）个百分点。", "a": ["0.2", "0.8", "2.5", "6.2", "", ""], "r": "B", "e": "【解析】第一步，本题考查两期比重计算。\n第二步，定位文字材料第一段“2017年上半年，Y市文化创意产业实现增加值1734.7亿元，同比增长13.0%，占地区生产总值的14.0%”。\n第三步，根据两期比重计算公式A/B×（1+b）/（1+a），选项数量级不同，首位不同，分母从左往右截取前两位，分子上增长率简单取整，即14%×（13%—6.8%）÷1.1≈0.8%。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46712", "t": 1, "q": "<p>关于2017年上半年Y市文化创意产业状况，以下信息中能够从上述资料中推出的有（ ）条。<\/p>\n<p>①2季度收入同比增速快于1季度<\/p>\n<p>②按收入计算的利润率高于上年同期水平<\/p>\n<p>③新闻出版及发行服务领域实现收入比设计服务领域高2倍多<\/p>\n<p>④文化科技融合示范区实现收入增长了400多亿元<\/p>", "a": ["<p>1<\/p>", "<p>2<\/p>", "<p>3<\/p>", "<p>4<\/p>", "", ""], "r": "B", "e": "【解析】第一步，本题考查综合分析问题，且需找出其中正确的条数对应的选项。\n第二步，①混合增长率计算，定位文字材料“2017年上半年，Y市文化创意产业实现增加值1734.7亿元，同比增长13.0%，占地区生产总值的14.0%；规模以上文创产业法人单位实现收入6902.7亿元，同比增长8.6%，比上年4季度和今年1季度分别提高1.3个和0.2个百分点”，根据混合增长率口诀：整体增长率介于各部分增长率之间，且靠近基数较大的部分的增长率。上半年=1季度＋2季度，上半年整体增长率高于1季度，故应低于2季度，则2季度高于1季度，正确。\n②两期利润率比较，定位文字材料“2017年上半年，Y市规模以上文创产业法人单位实现收入6902.7亿元，同比增长8.6%......实现利润总额349.8亿元，同比增长30.6%”，利润率=利润/收入，根据两期比重比较口诀：利润增长率大于收入增长率，利润率上升，反之下降。利润增长率（30.6%）＞收入增长率（8.6%），利润率上升，正确。\n③增长率计算，定位文字材料“2017年上半年，Y市设计服务领域实现收入167.1亿元，新闻出版及发行服务领域实现收入340.6亿元”，根据公式增长率=（现期量－基期量）/基期量，数据简单取整，即（341—167）÷167＜2，错误。\n④增长量计算，定位文字材料“2017年上半年，Y市文化科技融合示范区实现收入2616.1亿元，同比增长13.5%”，13.5%≈1/7.5，对收入数据简单取整，根据增长量计算n＋1原则，其增长量为2616÷（7.5+1），直除首位商不到4，错误。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46713", "t": 1, "q": "2017年1-7月，限额以上单位消费品零售额占社会消费品零售总额比重约为（     ）。", "a": ["<p>33.4%<\/p>", "<p>37.6%<\/p>", "<p>38.5%<\/p>", "<p>39.2%<\/p>", "", ""], "r": "D", "e": "【解析】第一步，本题考查基期比重计算。\n第二步，定位第一段，“2018年1—7月份，社会消费品零售总额210752亿元，同比增长9.3%。其中，限额以上单位消费品零售额81125亿元，增长7.3%”。\n第三步，根据基期比重公式 A/B×（1+b）/（1+a），复杂计算，可将部分数据截位处理，代入数据得，2017年1—7月，限额以上单位消费品零售额占社会消费品零售总额比重约为 811/2108×（1+9.3%）/（1+7.3%）≈39%，仅  D选项符合。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46714", "t": 1, "q": "2017年1-7月，社会消费品零售总额约为（     ）亿元。", "a": ["28200", "193000", "201000", "243000", "", ""], "r": "B", "e": "【解析】第一步，本题考查基期量计算。\n第二步，定位第一段，“2018年1—7月份，社会消费品零售总额210752亿元，同比增长9.3%”。\n第三步，根据基期量＝现期量/（1+增长率），观察选项，出现了首位相同第二位不同的情况，将分母从左向右截取前三位，代入数据可得，2017年1—7月，社会消费品零售总额为 210752÷1.09，直除首位商1。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46715", "t": 1, "q": "2018年1-6月，商品零售同比增长约为（     ）。", "a": ["<p>8.6%<\/p>", "<p>9.2%<\/p>", "<p>9.3%<\/p>", "<p>9.5%<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/nXOhdcOydXDjwgPa9NriUvYSOSQje5VluSYxn0VE.png\"><\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46716", "t": 1, "q": "<p>2018年1-7月份，实物商品网上零售额同比增长约（ ）亿元。<\/p>", "a": ["<p>8128<\/p>", "<p>7256<\/p>", "<p>9133<\/p>", "<p>8977<\/p>", "", ""], "r": "A", "e": "【解析】第一步，本题考查增长量计算中的已知现期量与增长率。\n第二步，定位第四段，“2018年1—7月份，实物商品网上零售额36461亿元，同比增长29.1%”。\n第三步，29.1%略低于30%，则29.1%≈1/3.4，根据增长量计算n＋1原则，2018年1—7月份，实物商品网上零售额同比增长约36461÷（3.4+1）=36461÷4.4，直除首两位商82。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46717", "t": 1, "q": "根据上述资料下列说法正确的是（     ）。", "a": ["2018年1-7月份，在实物商品网上零售额中，吃、穿和用类商品的比重与上一年同期相比均有所上升", "2018年7月份乡村消费品零售额增幅约为7.9%", "2018年1-7月份城镇消费品零售额同比增长约14292亿元", "2018年1-7月份，吃、穿和用类商品销售额占社会消费品零售总额的比重同比没有变化", "", ""], "r": "A", "e": "【解析】第一步，本题考查综合分析，且需选出正确的一项。\n第二步，A选项，两期比重比较。定位第四段，“2018年1—7月份，实物商品网上零售额36461亿元，同比增长29.1%……在实物商品网上零售额中，吃、穿和用类商品分别增长41.6%、29.9%和29.7%”。根据两期比重比较口诀“部分增长率高于整体，比重上升，反之，比重下降”，  部分增长率（41.6%、29.9%和29.7%）均高于整体增长率（29.1%），比重均高于上年，正确。\nB选项，混合增长率计算。定位第二段与第三段，“2018年7月份，按经营单位所在地分，7月份，城镇消费品零售额26388亿元，同比增长8.6%；乡村消费品零售额4345亿元……按消费类型分，7月份，餐饮收入3343亿元，同比增长9.4%；商品零售27391亿元，同比增长8.7%”  。社会消费品零售额=城镇消费品零售额+乡村消费品零售额=餐饮收入+商品零售，根据混合增长率口诀“整体增长率介于部分增长率之间”，则整体增幅应介于8.7%与9.4%之间，城镇消费品零售额的增幅（8.6%）低于整体增长率，则乡村消费品零售额的增幅一定高于整体，因此2018年7月份乡村增幅一定高于8.7%，错误。\nC选项，增长量计算。定位第二段，“2018年1—7月份，城镇消费品零售额180480亿元，同比增长9.1%”。9.1%≈1/11，根据增长量计算n+1原则，代入数据可知，2018年1—7月份城镇消费品零售额同比增长180480÷（11+1）=15040（亿元），错误。\nD选项，两期比重比较。定位第一段和第四段，“2018年1—7月份，社会消费品零售总额210752亿元，同比增长9.3%……在实物商品网上零售额中，吃、穿和用类商品分别增长41.6%、29.9%和29.7%”。根据两期比重比较口诀“部分增长率高于整体，比重上升，反之，比重下降”，  部分增长率（41.6%、29.9%和29.7%）均高于整体增长率（9.3%），比重均高于上年，错误。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46718", "t": 1, "q": "2017年，该省单位面积产量最高的水果是（     ）。", "a": ["梨", "苹果", "桃", "猕猴桃", "", ""], "r": "D", "e": "【解析】第一步，本题考查现期平均数比较。\n第二步，定位第一段“2017年，苹果的挂果面积为726.21万亩；梨的挂果面积为61.29万亩；桃的挂果面积为45.05万亩；猕猴桃的挂果面积为64.76万亩”和第二段“2017年，苹果的产量为1153.94万吨；梨的产量为110.37万吨；桃的产量为84.61万吨；猕猴桃的产量为138.97万吨”。\n第三步，根据公式，单位面积产量＝产量/面积，对分子分母取整，结合选项，四种水果2017年单位面积产量分别为，梨：110÷61、苹果：1154÷726、桃：85÷45、猕猴桃：139÷65，直除首位分别商1、1、1、2，比较可知，猕猴桃单位面积产量最高。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46719", "t": 1, "q": "2017年，该省挂果面积同比增速最高水果的单位面积产量约为（     ）斤/亩。", "a": ["332", "445", "664", "1075", "", ""], "r": "C", "e": "【解析】第一步，本题考查现期平均数计算中的求单平均数。\n第二步，定位第一、二段。\n第三步，简单读数比较可知，2017年，挂果面积同比增速最快的为枣（12.6%），其总产量为87.23万吨，挂果面积为262.74万亩。根据公式，单位面积产量＝产量/面积，结合选项，首位不同，分子取整，分母从左向右截取前两位，单位不同影响计算结果，需进行单位换算，1吨＝1000千克＝2000斤，则2017年，枣的单位面积产量＝87.23×2000÷262.74，直除首位商6。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46720", "t": 1, "q": "2017年，单位面积产量超过1000公斤/亩的水果共有（     ）种。", "a": ["8", "9", "10", "11", "", ""], "r": "B", "e": "【解析】第一步，本题考查现期平均数比较。\n第二步，定位第一、二段。\n第三步，根据1吨＝1000公斤可知，求单位面积产量超过1000公斤/亩，即求单位面积产量超过1吨/亩，材料中已知面积单位为万亩，产量单位为万吨，根据单位面积产量＝产量/面积，可转换为求产量的数值大于面积的数值，简单比较可知，在11种水果中，只有枣（87.23＜262.74）和杏（20.21＜45.42）2种水果不符合要求，即单位面积产量未超过1000公斤/亩，则共有11－2＝9（种）水果单位面积产量超过1000公斤/亩。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46721", "t": 1, "q": "2017年，该省挂果面积最大水果的总产量是挂果面积最小水果的总产量的约（     ）倍。", "a": ["112", "84", "57", "28", "", ""], "r": "A", "e": "【解析】第一步，本题考查现期倍数计算。\n第二步，定位第一、二段。\n第三步，简单读数比较可知，2017年，挂果面积最大的为苹果（726.21万亩），其总产量为1153.94万吨；挂果面积最小的为石榴（6.51万亩），其总产量为10.34万吨。根据倍数=前/后，选项首位不同，分子取整，分母从左向右截取前两位计算，则2017年，该省挂果面积最大水果的总产量是挂果面积最小水果总产量的倍数＝1154÷10，直除首位商1。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46722", "t": 1, "q": "根据上述资料，下列说法中不正确的一项是（     ） 。", "a": ["2017年，共有5种水果的单位面积产量同比有所降低", "2017年，单位面积产量及同比增速均最低的水果是同一种水果", "2016年，单位面积产量低于柿子的水果仅有两种", "2016年，单位面积产量从高到低的水果排序是苹果、柑桔、葡萄、樱桃", "", ""], "r": "D", "e": "【解析】第一步，本题考查综合分析问题，且需选出错误一项。\n第二步，A选项，两期平均数比较，定位第一段和第二段。根据两期平均数比较规律，分子增速大于分母增速，平均数变大，反之，平均数变小，想求单位面积产量下降，则分子（产量）的增长率a＜分母（面积）的增长率b即可。读数比较可知，猕猴桃、葡萄、枣、杏、樱桃5种水果的单位面积产量同比有所下降，正确。\nB选项，现期平均数比较，定位第一段和第二段。根据104题计算结果，求单位面积产量最低的水果，只需比较单位面积产量低于1000公斤/亩的枣和杏即可，对分子分母取整处理，枣的单位面积产量为：87÷263≈0.33，杏的单位面积产量为：20÷45≈0.44，则枣的单位面积产量最低。求单位面积产量同比增速最低的水果，根据本题A选项计算结果，只需比较单位面积产量同比下降的5种水果即可，根据平均数增长率＝（a—b）÷（1+b），则五种水果单位面积产量同比增速分别为：\n猕猴桃：（5.9%—10.8%）÷（1+10.8%）=—（4.9%÷1.108），\n葡萄：（3.2%—3.5%）÷（1+3.5%）=—（0.3%÷1.035），\n枣：（5%—12.6%）÷（1+12.6%）=—（7.6%÷1.126），\n杏：（3.2%—4.1%）÷（1+4.1%）=—（0.9%÷1.041），\n樱桃：（7.3%—10.4%）÷（1+10.4%）=—（3.1%÷1.104），\n比较5个分数大小可知，葡萄和杏增速的数量级小于其他三种水果，排除，猕猴桃首位商－4，枣首位商－6，樱桃首位商－2，则枣的单位面积产量增速最小。因此，单位面积产量及同比增速最小的均为枣，正确。\nC选项，基期平均数计算，定位第一段和第二段。涉及的量过多，计算量过大，暂时跳过。\nD选项，基期平均数计算，定位第一段和第二段。根据基期平均数＝ A/B×（1+b）/（1+a），复杂计算，对部分数据进行取整处理，则水果2016年单位面积产量分别为，苹果：1154/726×（1+4.1%）/（1+4.8%）≈1.58（吨/亩），柑橘：54/40×（1+4.5%）/（1+5.9%）≈1.33（吨/亩），葡萄：68/54×（1+3.5%）/（1+3.2%）≈1.26（吨/亩），樱桃：14/11×（1+10.4%）/（1+7.3%）≈1.31（吨/亩），比较可知，葡萄（1.26吨/亩）＜樱桃（1.31吨/亩），故排序错误，错误。\n因此，选择D选项", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46723", "t": 1, "q": "2017年9月至2018年9月，轿车产量超过百万辆的月份有几个?（     ）", "a": ["7个", "6个", "5个", "3个", "", ""], "r": "A", "e": "【解析】第一步，本题考查现期平均数比较。\n第二步，定位柱状图“轿车同比增速及日均产量”。\n第三步，根据公式，平均数＝总数/总份数。轿车产量超过百万辆的月份，则大月（1、3、5、7、8、10、12月）日均产量应该＞100÷31≈3.22（万量），读数可知满足的有2017年10月、2017年12月、2018年3月、2018年5月。小月（4、6、9、11）日均产量应该＞100÷30≈3.33（万量），读数可知，满足的有2017年9月、2017年11月、2018年9月。2018年2月＝3×28＜100（万量）。故共7个月满足。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46724", "t": 1, "q": "<p>2017年9月至2018年9月，发电量最多的月份是（ ）。<\/p>", "a": ["<p>2017年12月<\/p>", "<p>2018年1月<\/p>", "<p>2018年7月<\/p>", "<p>2018年8月<\/p>", "", ""], "r": "D", "e": "【解析】第一步，本题考查现期平均数比较。\n第二步，定位“发电量同比增速及日均产量”柱状图。\n第三步，根据公式，月发电量＝日均产量×天数。观察选项给出的四个月份，12月、1月、7月、8月每个月都是31天。则比较月均发电量直接用日均产量代替比较。读数可知日均产量分别为：2017年12月（184.2亿千瓦时）、2018年1月（177.2亿千瓦时）、2018年7月（206.5亿千瓦时）、2018年8月（206.6亿千瓦时）。比较发现2018年8月（206.6亿千瓦时）最大，故2018年8月发电量最多。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46725", "t": 1, "q": "<p>9月份，下列经济类型按照增加值同比增长率由高到低排列正确的是（ ）。<\/p>", "a": ["<p>国有控股企业——集体企业——股份制企业——外商港澳台投资企业<\/p>", "<p>股份制企业——集体企业——国有控股企业——外商港澳台投资企业<\/p>", "<p>股份制企业——国有控股企业——外商港澳台投资企业——集体企业<\/p>", "<p>集体企业——外商港澳台投资企业——国有控股企业——股份制企业<\/p>", "", ""], "r": "C", "e": "【解析】第一步，本题考查简单排序比较。\n第二步，定位第三段，“2018年9月，分经济类型看，9月份，国有控股企业增加值同比增长5.6%；集体企业增长2.0%，股份制企业增长6.3%，外商及港澳台商投资企业增长3.2%”。\n第三步，读数比较可知，9月份，经济类型按照增加值同比增长率排序为：股份制企业（6.3%）＞国有控股企业增加值（5.6%）＞外商及港澳台商投资企业（3.2%）＞集体企业（2.0%）。只有C选项符合。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46726", "t": 1, "q": "<p>2018年9月水泥产量比2017年同期增加约（ ）。<\/p>", "a": ["<p>990万吨<\/p>", "<p>1039万吨<\/p>", "<p>864万吨<\/p>", "<p>948万吨<\/p>", "", ""], "r": "A", "e": "【解析】第一步，本题考查已知现期量与增长率的增长量计算。\n第二步，定位第六段，“2018年9月，水泥20781万吨，增长5.0%”。 \n第三步，根据公式，增长量＝现期量×增长率/（1+增长率），增长率＝5.0%＝1/20。根据增长量n＋1计算原则，代入数据得，2018年9月水泥产量比2017年同期增加＝20781÷（1+20）≈990（万吨）。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46727", "t": 1, "q": "以下说法中，错误的是（     ）。", "a": ["2018年8月，规模以上工业增加值同比实际增长6.1%", "2017年9月工业企业产品销售率为99.2%", "2017年9月至2018年9月规模以上工业增加值月同比增长速度都超过6%", "2018年9月轿车产量超过了8月轿车产量", "", ""], "r": "C", "e": "【解析】第一步，本题考查综合分析问题，且需选择错误的选项。\n第二步，A选项，简单和差计算，定位第一段，“2018年9月份，规模以上工业增加值同比实际增长5.8%（以下增加值增速均为扣除价格因素的实际增长率），比8月份回落0.3个百分点”。则2018年8月规模以上工业增加值同比实际增长＝5.8%＋0.3%＝6.1%，正确。\nB选项，简单和差计算，定位最后一段，“2018年9月份，工业企业产品销售率为98.8%，比上年同月下降0.4个百分点”。则2017年9月工业企业产品销售率为＝98.8%＋0.4%＝99.2%，正确。\nC选项，直接读数。定位“规模以上工业增加值同比增长速度”折线图。读数可知，2018年9月同比增长速度为5.8%6%，错误。\nD选项，简单计算。根据118题计算可知，2018年9月轿车产量超过100万辆，而2018年8月没有超过100万辆，故2018年9月轿车产量超过了8月轿车产量，正确。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46728", "t": 1, "q": "<p>下列说法不正确的有（ ）。<\/p>\n<p>①2017年脱贫人口最少是1289万人<\/p>\n<p>②2018年农村居民人均可支配收入比2017年增加994元<\/p>\n<p>③2014—2018年贫困人口年均下降量1330万人<\/p>", "a": ["<p>0个<\/p>", "<p>3 个<\/p>", "<p>2个<\/p>", "<p>1个<\/p>", "", ""], "r": "C", "e": "【解析】第一步，本题考查综合分析问题，且需选出不正确的项数。\n第二步，①，减少量计算，定位图形材料。每年脱贫人口，即每年贫困人口比上年减少的量。减少量=基期量－现期量，2017年脱贫人口为4335－3046=1289（万人），正确。\n②，增长量计算，定位文字材料“2018年全年贫困地区农村居民人均可支配收入10371 元，比上年增长10.6%，扣除价格因素，实际增长8.3%”。文中数据为贫困地区农村居民人均可支配收入，无法得知农村居民的情况，无法推出，错误。\n③，年均减少量计算，定位图形材料。根据年均减少量=总减少量/相差年数，可得（7017—1660）÷4≈1339（万人），错误。\n共计2条错误。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46729", "t": 1, "q": "2017年贫困地区农村居民人均年可支配收入为（     ）。", "a": ["9407元", "9377元", "9368元", "9102 元", "", ""], "r": "B", "e": "【解析】第一步，本题考查基期量计算问题。\n第二步，定位文字材料“2018年全年贫困地区农村居民人均可支配收入10371 元，比上年增长10.6%”。\n第三步，根据基期量=现期量/（1＋增长率），选项出现了首两位相同的情况，需精确计算，可得10371÷1.106≈9377 （元）。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46730", "t": 1, "q": "2014—2018年贫困人口年均下降率为（     ）。", "a": ["<p>20%<\/p>", "<p>25.5%<\/p>", "<p>30.3%<\/p>", "<p>32.5%<\/p>", "", ""], "r": "C", "e": "【解析】第一步，本题考查年均增长率计算问题，考虑代入排除解题。\n第二步，定位图形材料。\n第三步，根据现期量÷基期量=（1+r）^n，代入数据可得1660÷7017=（1+r）^4 ，（1+r）^4≈0.237 ，由于选项均为年均减少率，故代入时注意符号，当r=－30%，（1—30%）^4≈0.24 ，与0.237较为接近，故选择最接近的选项。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46731", "t": 1, "q": "2014—2018年脱贫人口同比降速位于第二的是（     ）。", "a": ["2015年", "2016年", "2017年", "2018年", "", ""], "r": "C", "e": "【解析】第一步，本题考查增长率计算比较问题。\n第二步，定位图形材料\n第三步，根据减少率=减少量/基期量，比较类问题，分母从左向右截取前三位，分子减法计算考虑舍相同可得2015—2018年减少率分别为（702—558）÷702＜1/4 、（558—434）÷558＜1/4 、1/4＜（434—305）÷434＜1/3 和（305—106）÷305＞1/3 ，则降速排第二的为2017年。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46732", "t": 1, "q": "2014—2018年脱贫人口最多的是（     ）。", "a": ["2015年", "2016年", "2017年", "2018年", "", ""], "r": "A", "e": "【解析】第一步，本题考查增长量做差比较问题。\n第二步，定位图形材料。\n第三步，每年脱贫人口，即每年贫困人口比上年减少的量。减少量=基期量－现期量，比较类问题，较长数据截取前三位，其他舍相同可得，2015：702－558=144，2016：558－434=124，2017：434－305=129，2018：305－166=139。脱贫人口最多的为2015年。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46733", "t": 1, "q": "2017年中国田径协会举办的A类与B类赛事占全国马拉松赛事的比例约为（     ）。", "a": ["<p>20%<\/p>", "<p>23%<\/p>", "<p>25%<\/p>", "<p>28%<\/p>", "", ""], "r": "B", "e": "【解析】第一步，本题考查现期比重计算中求比重。\n第二步，定位文字材料第一段，“2017年全国举办马拉松赛事达1102场，其中，中国田径协会举办的A类赛事223场，B类赛事33场”。\n第三步，根据 比重=部分量/整体量，则2017年中国田径协会举办的A类与B类赛事占全国举办马拉松赛事的比例为（223+33）÷1102=256÷1102，直除首两位商23。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46734", "t": 1, "q": "能够从上述资料中推出的是（     ）。", "a": ["2017年马拉松运动年度产业规模比2016年多200亿元", "2017年参加中国田径协会认证赛事的全国跑者数量少于75万人", "2011年至2016年我国马拉松赛事场次之和超过2017年赛事场次的50%", "在2016年与2017年马拉松规模赛事数量上，江苏省、北京市都有进入前三名", "", ""], "r": "C", "e": "【解析】第一步，本题考查综合分析问题，且需选出正确的一项。\n第二步，A选项，增长量计算，定位第二段文字材料，“2017年度产业总规模达700亿元，比去年同期增长约20%”，20%=1/5，利用增长量计算n＋1原则可得，所求增长量为700÷（5+1）＜200（亿元），错误。\nB选项，求整体量，定位文字材料最后一段，“2017年参加中国田径协会认证赛事中，江苏共有76469人参赛，在全国占比10.10%”，根据 整体量=部分量/比重，76469人≈7.65万人，则2017年全国跑者数量为7.65÷10.10%≈75.7（万人）75（万人），错误。\nC选项，和差类，定位柱状图，2011年至2016年马拉松赛事场次之和为22＋33＋39＋51＋134＋328=607（场），2017年赛事场次的50%为1102×50%≈551（场），前者后者，正确。\nD选项，直接读数，定位第三段文字材料，“2017年赛事规模排名前三的省份为浙江省、江苏省和广东省”，不包括北京市，错误。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46735", "t": 1, "q": "在中国田径协会认证的A类、 B类赛事中，2016年全程马拉松项目完赛人次比同期半程马拉松项目完赛人次约（     ）。", "a": ["多23万", "少23万", "多21万", "少21万", "", ""], "r": "D", "e": "【解析】第一步， 本题考查基期量差值计算。\n第二步，定位文字材料第五段，“在中国田径协会认证的A类、B类赛事中，2017年全程马拉松项目完赛26.89万人次，同比增长10.61%；半程马拉松项目完赛45.29万人次，同比减少了0.03万人次”。\n第三步， 根据  基期量=现期量/（1+增长率） 与 基期量=现期量＋减少量，将分母从左向右截取前三位，分子不动，代入数据可得，2016年全程马拉松项目完赛人次比同期半程马拉松项目完赛人次约多26.89÷1.11—（45.29+0.03）≈-21.1（万）。\n因此，选择D选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46736", "t": 1, "q": "2017年马拉松赛事参与人次的同比增速比2016年约（     ）。", "a": ["快9个百分点", "慢9个百分点", "快7个百分点", "慢7个百分点", "", ""], "r": "B", "e": "【解析】第一步，本题考查增长率计算。\n第二步，定位文字材料第一段“2017年马拉松赛事的参与人次达到了498万人次，2016年、2015年马拉松赛事的参与人次分别为280万人次、150万人次”。\n第三步，根据 增长率=（现期量-基期量）/基期量，数据本身不大，不再截位处理数据。代入数据可得：2017年同比增速与2016年同比增速的差值为：（498—280）÷280—（289—150）÷150≈-8.8%，即慢了9个百分点左右。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46737", "t": 1, "q": "在2017年马拉松运动年度产业总规模的基础上，从2018年开始，每年大约需要平均增长多少才能实现中国田径协会设置的2020年马拉松运动产业规模目标?（     ）", "a": ["<p>15%<\/p>", "<p>20%<\/p>", "<p>25%<\/p>", "<p>30%<\/p>", "", ""], "r": "B", "e": "【解析】第一步，本题考查年均增长率计算。\n第二步，定位文字材料第二段，“2017年全年马拉松年产业总规模达700亿元……中国田径协会设置的发展目标是到2020年，马拉松运动产业规模达到1200亿元”。\n第三步，根据年均增长率的计算公式：末期量/初期量=（1+年均增长率）^n，根据材料可知初期量是2017年度，产业总规模为700亿元，末期量是2020年度，产业总规模为1200亿元，相差年数n是3（2020－2017=3），代入数据后得到1200÷700=（1+r）³≈1.71，年均增长率计算可以使用代入排除法，优先代入数值大小介于中间，且方便计算的B选项，可得1.2³=1.44×1.2=1.728，最为接近。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46738", "t": 1, "q": "2011年至2017年，我国服务进出口逆差最大的年份是（     ）。", "a": ["2017年", "2016年", "2015年", "2014年", "", ""], "r": "A", "e": "【解析】第一步，本题考查简单比较中和差比较问题。\n第二步，定位表格材料“2011年至2017年我国服务进出口统计”。\n第三步，根据注释“逆差指的是在国际收支上，一定时期内支出大于收入的差额”，A选项，逆差为31584－15407＝16177；B选项，逆差为30030－13918＝16112；C选项，逆差为27127－13617＝13510；D选项，逆差为26591－13461＝13130。比较可得，A选项（16177）最大。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46739", "t": 1, "q": "2016年个人、文化和娱乐服务进口额占同期服务进口总额的比重约为（     ）。", "a": ["0.1个百分点", "0.3个百分点", "0.5个百分点", "0.7个百分点", "", ""], "r": "C", "e": "【解析】第一步，本题考查基期比重计算。\n第二步，定位表格材料“2011年至2017年我国服务进出口统计”中第二行数据，可知2016年服务进口额为30030亿元人民币，再定位表格材料2中倒数第二行最后两个数据，可知2017年个人、文化和娱乐服务进口额为186.0亿元人民币，其同比增长率为30.8%。\n第三步，根据 基期量=现期量/（1+增长率） 及2017年个人、文化和娱乐服务进口额的相关数据，将分母从左向右截取前三位，代入数据可得2016年个人、文化和娱乐服务进口额约为 186÷1.31≈142（亿元人民币）；再利用比重=部分量/整体量，将分母从左向右截取前三位可得142÷300，直除首位的商接近5，与选项C最为接近。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46740", "t": 1, "q": "能够从上述资料中推出的是（     ）。", "a": ["2011年至2017年，我国进出口总是实现逆差", "2016年我国建筑服务进出口实现顺差1039亿元人民币", "2017年我国服务进出口中，其他商业服务进出口实现的顺差最多", "2017 年我国服务进出口中，别处未提及的政府服务进出口占比最小", "", ""], "r": "C", "e": "【解析】第一步，本题考查综合分析问题，且需选出正确的一项。\n第二步，A选项，无中生有，定位表格材料“2011年至2017年我国服务进出口统计”，只给出2011—2017年我国服务业进出口一直处于逆差，但不是我国进出口一直处于逆差，无法判断，错误。\nB选项，基期量和差计算，定位表格材料“2017年我国服务分类进出口统计”，2017年我国建筑服务业进出口实现顺差＝1618－579＝1039（亿元人民币），则2016年顺差=1618÷（1+92%）—579÷（1+5.4%）＜1039，即2016年顺差小于1039亿元人民币，错误。\nC选项，和差比较，定位表格材料“2017年我国服务分类进出口统计”，2017年其他商业服务实现顺差＝4157－2895＝1262，较其他类别实现的顺差都多，正确。\nD选项，比重比较，定位表格材料“2017年我国服务分类进出口统计”，根据 比重=部分量/整体量，整体量一致，则只需找部分量即可，即转化为读数比较，2017年，个人、文化和娱乐服务的进出口额237亿元人民币＜别处未提及的政府服务的进出口额348亿元人民币，则别处未提及的政府服务的进出口额占比不是最小，错误。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46741", "t": 1, "q": "2016年我国保险和养老金服务进出口额约为（     ）。", "a": ["857亿元人民币", "1112亿元人民币", "1134亿元人民币", "1158亿元人民币", "", ""], "r": "C", "e": "【解析】第一步，本题考查基期量计算。\n第二步，定位表格材料“2017年我国服务分类进出口统计”，“2017年我国保险和养老金服务进出口额为976亿元人民币，同比增长－13.9%”。\n第三步，根据 基期量=现期量/（1+增长率），结合选项数据出现首两位相同，精确计算，则2016年我国保险和养老金服务进出口额为 976÷（1—13.9%）=976÷0.861，直除首三位商113。\n因此，选择C选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46742", "t": 1, "q": "下列关于2016年进口额大小排序错误的是（     ）。", "a": ["旅行>运输>其他商业服务", "知识产权使用费>建筑>运输", "运输>金融服务>加工服务", "建筑>金融服务>加工服务", "", ""], "r": "B", "e": "【解析】第一步，本题考查基期量比较，且需选出错误的一项。\n第二步，定位表格材料“2017年我国服务分类进出口统计”。\n第三步，根据 基期量=现期量/（1+增长率），分母大小接近，分子相差较大，只需比较分子大小即可，即“瘦死的骆驼比马大”。A选项中，旅行为17210÷（1—0.8%），运输为6278÷（1+17.3%），其他商业服务为2895÷（1+0.4%），17210＞6278＞2895，旅行＞运输＞其他商业服务，A正确。B选项中，知识产权使用费为1930÷（1+21.2%），建筑为579÷（1+5.4%），运输为6278÷（1+17.3%），6278＞1930＞579，运输＞知识产权使用费＞建筑，B错误。C选项中，运输为6278÷（1+17.3%），金融服务为109÷（1—19.1%），加工服务为12÷（1+14.2%），6278＞109＞12，运输＞金融服务＞加工服务，C正确。D选项中，建筑为579÷（1+5.4%），金融服务为109÷（1—19.1%），加工服务12÷（1+14.2%），579＞109＞12，建筑＞金融服务＞加工服务，D正确。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46743", "t": 1, "q": "<p>2018年，M省进口总值为（ &nbsp;&nbsp;&nbsp;）。<\/p>", "a": ["<p>330.9亿元<\/p>", "<p>378.6亿元<\/p>", "<p>655.8亿元<\/p>", "<p>657.9亿元<\/p>", "", ""], "r": "C", "e": "<p>【解析】考查减法计算；由第一段（2018年，M省进出口总值达到1034.4亿元，比上年增长9.9%。其中，出口378.6亿元），可得2018年M省进口总值=1034.4-378.6、尾数8，选C<\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46744", "t": 1, "q": "<p>2018年下列“一带一路”沿线国家中，与M省贸易额同比增速最快的是（ &nbsp;&nbsp;&nbsp;）。<\/p>", "a": ["<p>蒙古国<\/p>", "<p>荷兰<\/p>", "<p>德国<\/p>", "<p>越南<\/p>", "", ""], "r": "D", "e": "<p>【解析】考查读数比较；由第二段（其中对蒙古国、越南、德国、荷兰进出口分别比上年增长24.1%、1.4倍、64.2%和40.3%），可得同比增速最快的是越南，选D<\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46745", "t": 1, "q": "<p>2017年M省对“一带一路”沿线国家外贸进出口总值为多少亿元？（ &nbsp;&nbsp;&nbsp;）<\/p>", "a": ["<p>509.2<\/p>", "<p>610.2<\/p>", "<p>699.3<\/p>", "<p>819.3<\/p>", "", ""], "r": "B", "e": "<p>【解析】考查前期量的计算；由第二段（2018年M省对“一带一路”沿线国家外贸进出口699.3亿元，增长14.6%），可得699÷（1+14.6%）=699/1146，结合选项，选B<\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46746", "t": 1, "q": "<p>2018年M省边境小额贸易中，进口额约是出口额的多少倍？（ &nbsp;&nbsp;&nbsp;）<\/p>", "a": ["<p>6<\/p>", "<p>8<\/p>", "<p>11<\/p>", "<p>13<\/p>", "", ""], "r": "C", "e": "<p>【解析考查简单计算；由第一段（出口378.6亿元）、第116题（进口655.8亿元）和图表，可得（655.8×51%）÷（378.6×8%）≈330/300，选C<\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46747", "t": 1, "q": "<p>关于2018年M省进出口情况，不能从上述资料中推出的是（ &nbsp;&nbsp;&nbsp;）。<\/p>", "a": ["<p>进口总值同比增速低于10%<\/p>", "<p>对蒙古国外贸进出口总值低于对“一带一路”沿线国家外贸进出口总值的一半<\/p>", "<p>外贸出口中边境小额贸易与加工贸易所占比例相等<\/p>", "<p>钢材、机电产品、农产品三者合计出口额超过240亿元<\/p>", "", ""], "r": "D", "e": "<p>【解析】从D项开始依次进行检验；<\/p>\n<p>D项，由第一段（出口378.6亿元）和第二段（钢材、机电产品、农产品为出口值前三的商品，三者合计占同期出口总值的53.9%），可得378.6×53.9% ＜240，说法错误，选D<\/p>\n<p>C项，由图表1，可得外贸出口中边境小额贸易与加工贸易所占比例都是8%，说法正确，排除；<\/p>\n<p>B项，由第二段（2018年M省对“一带一路”沿线国家外贸进出口699.3亿元。其中对蒙古国外贸进出口327.7亿元），可得327.7＜（699.3÷2），说法正确，排除；<\/p>\n<p>A项，由第一段（2018年，M省进出口总值达到1034.4亿元，比上年增长9.9%。其中，出口378.6亿元，增长14.4%），杠杆原理可得进口总值同比增速低于9.9%，说法正确，排除；<\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46748", "t": 1, "q": "2017年，全国清洁能源消费总量约为（     ）亿吨标准煤。", "a": ["8.7", "9.3", "10.8", "12.3", "", ""], "r": "B", "e": "【解析】第一步，本题考查求部分量问题。\n第二步，定位文字材料“2018年全年能源消费总量46.4亿吨标准煤，比上年增长3.3%”以及图形材料中2017年占比为20.8%。\n第三步，根据基期量=现期量/（1+增长率）和部分量=整体量×比重，3.3%＜5%，利用化除为乘公式法求基期量，同时结合求部分量公式，可得46.4÷（1+3.3%）×20.8% ≈46.4×（1－3.3%）×20.8%≈（46.4－1.5）×20.8%=44.9×20.8%＞44.9×20%=8.98，略大于8.98，与B最接近。（或结合前面题目求出的增长量1.5直接确定2017年能源消费总量为46.4－1.5=44.9）\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46749", "t": 1, "q": "根据给定资料，可以推出的是（     ）。", "a": ["2018年，全国煤炭的消费量比上年有所上升", "2014—2018年，全国清洁能源消费量逐年上升", "2017年，煤炭消费量约占能源消费总量的57.6%", "2018年，除煤炭、清洁能源外，其他能源消费量超过9亿吨标准煤", "", ""], "r": "A", "e": "【解析】第一步，本题考查综合分析，且需选出正确的一项。\n第二步，A选项，读数比较。定位文字材料，“2018年，煤炭消费量增长1.0%”，由于2018年煤炭消费量的增长率大于0，故2018年全国煤炭消费量比上年有所上升，正确。\nB选项，读数比较。定位柱状图，根据部分量=整体量×比重，图中只给出了2014—2018年清洁能源消费量占能源消费总量的比重，并未给出2014—2016年能源消费总量的具体值，故无法推出，错误。\nC选项，简单计算。定位文字材料，“2018年，煤炭消费量占能源消费总量的59.0%，比上年下降1.4个百分点”，可知2017年煤炭消费量占能源消费总量的比重为59.0%＋1.4%＝60.4%，错误。\nD选项，求部分量。定位文字材料，“2018年全年能源消费总量46.4亿吨标准煤。煤炭消费量占能源消费总量的59.0%，定位柱状图“2018年清洁能源消费量占能源消费总量的22.1%”，根据部分量=整体量×比重，可知除煤炭、清洁能源外，其他能源消费量为46.4×（1－59.0%－22.1%）＝46.4×18.9%＜47×19%=8.93<9（亿吨标准煤），错误。\n因此，选择A选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46750", "t": 1, "q": "按照2014—2018年清洁能源消费量占能源消费总量的平均增长率，2019年清洁能源消费量占比约为（     ）。", "a": ["<p>22.8%<\/p>", "<p>23.6%<\/p>", "<p>24.3%<\/p>", "<p>24.9%<\/p>", "", ""], "r": "B", "e": "【解析】第一步本题考查年均增长率计算和现期量计算问题。\n第二步，定位柱状图。\n第三步，根据（1+年均增长率）^n＝末期量/初期量，代入数据可得（1＋r）^4=22.1%/17.0%=1.3，计算可得r最接近23.6%。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46751", "t": 1, "q": "2018年全年消费量同比增速最低的是（     ）。", "a": ["煤炭", "原油", "天然气", "电力", "", ""], "r": "A", "e": "【解析】第一步，本题考查增长率读数比较问题。\n第二步，定位文字材料“2018年，煤炭消费量增长1.0%，原油消费量增长6.5%，天然气消费量增长17.7%，电力消费量增长8.5%”。\n第三步，同比增速最低的是煤炭消费量（1%）。\n因此，选择A选项", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46752", "t": 1, "q": "2018年，全国能源消费总量同比增长约（     ）亿吨标准煤。", "a": ["0.9", "1.5", "2.1", "2.5", "", ""], "r": "B", "e": "【解析】第一步，本题考查已知现期量与增长率的增长量计算问题。\n第二步，定位文字材料“2018年全年能源消费总量46.4亿吨标准煤，比上年增长3.3%”。\n第三步，根据增长量=现期量×增长率/（1+增长率），3.3%≈1/30，利用增长量计算n＋1原则可得46.4÷31≈1.5。\n因此，选择B选项。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46753", "t": 1, "q": "2020年全国第三产业产值约为多少亿人民币？（    ）", "a": ["47125", "32584", "28956", "23200", "", ""], "r": "D", "e": "【解析】全国第三产业总产值为3016÷13%=23200，选D。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46754", "t": 1, "q": "2019年平均每场展览展出面积约为多少平方米？（    ）", "a": ["11000", "12000", "13000", "14000", "", ""], "r": "B", "e": "【解析】材料出处：2020年全国共举办展览6830场，比2019年增加9.2%；展出面积为8120万平方米，比2019年增长8.5%；2019年平均为[8120÷(1+8.5%)]÷[6830÷(1+9.2%)]≈12000，选B。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46755", "t": 1, "q": "2020年北京、上海、广州三城市举办的展览场次占全国的比重与2019年相比约（    ）。", "a": ["增加了4个百分点", "减少了4个百分点", "增加了8个百分点", "减少了8个百分点　　", "", ""], "r": "A", "e": "【解析】比重：部分增长率越大于整体增长率，所占比重提高。三城市增长率33.8%大于全国9.2%，排除B.D。2020年三城市占全国比重为20%，2019年三城市点比重为[1380÷(1+33.8%)]÷[6830÷(1+9.2%)]≈16%，选A。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46756", "t": 1, "q": "2020年，从展会的类型分析，消费类的比文化展示类的多多少场？（    ）", "a": ["1707", "1528", "1366", "1124", "", ""], "r": "C", "e": "【解析】材料出处：消费类占全国25%，文化展示类占5%，所以消费类比文化展示类多6830×(25%－5%)=1366，选C。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46757", "t": 1, "q": "根据上述材料，下列表述正确的是（    ）。", "a": ["2019年全国万人以上节庆活动场次不到6万", "在世界商展百强排行榜中，中国上榜城市中有一半为北方城市", "从组展商分析，2020年国有、集体、股份、联营以及政府或事业单位比例超过一半", "2020年，Z省出国境参展面积占全国比重超过40%", "", ""], "r": "D", "e": "【解析】材料“万人以上节庆活动6.5万场”，A表述是错误的；材料“在世界商展百强排行榜中，中国占14席，其中北京4席，上海4席，广州3席，香港2席，深圳1席。”北方城市仅有北京4席，故B表述错误；材料“国有、集体、股份、联营等占30%，政府或事业单位占15%”，共45%，不到一半，C错误；2020年Z省出国境参展面积25.9万平方米，全国出国境展览面积60万平方米，占全国接近于50%，所以选D。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46758", "t": 1, "q": "2020年主要工业产品中，增速最快的是（    ）。", "a": ["精炼铜（铜）", "成品糖", "水电", "程控交换机", "", ""], "r": "C", "e": "【解析】可以都在资料中直接找到，选择C。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46759", "t": 1, "q": "2019年，生产水电（    ）亿千瓦时。", "a": ["4653", "4852", "4890", "4985", "", ""], "r": "B", "e": "【解析】水电5851.9，增长20.6%，所以上一年的大约是5851.9÷1.2≈5852×5/6≈4880，偏大，选择B。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46760", "t": 1, "q": "2019年，纯碱产量比烧碱产量（    ）。", "a": ["高", "低", "一样", "无法判断", "", ""], "r": "A", "e": "【解析】纯碱1881.3/1.066，烧碱1852.1/1.053，利用分数比较大小的方法，可以判断出纯碱的高。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46761", "t": 1, "q": "下面说法正确的是（    ）。", "a": ["2019年，火电发电量占发电量的80.4%", "2020年，轿车产量占汽车总产量的比重比上一年上升了", "2020年，表中所列主要工业产品中，有2种产量是下降的", "2020年，减少数量最多的是程控交换机", "", ""], "r": "D", "e": "【解析】A可以算出来2020年占的比重大约是80.4%。所以上一年不可能是这个值，一定比这个要大；轿车增长5.0%，汽车增长5.1%，很显然占的比重下降了；2020年主要工业产品中，有3种产量是下降的，分别是硫 酸，乙 烯，程控交换机", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46762", "t": 1, "q": "以下几项，增长最多的是（    ）。", "a": ["纱", "布", "化学纤维", "成品糖", "", ""], "r": "D", "e": "【解析】其中纱和布很明显是纱的增量多，化学纤维和纱的量相差不多，但是增长率太小，所以增量比纱小，成品糖能达到100多，纱大概是不到100，所以是成品糖高。", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46763", "t": 1, "q": "已公布一季报的534家公司，平均每家在2019年第四季度实现营业收入约多少亿元？（    ）", "a": ["<p>0.63<\/p>", "<p>7.54<\/p>", "<p>8.56<\/p>", "<p>9.73<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/SSwTZB9xouyvXJnwELrUAg6Vr0G8y2Y7TgTt0CdM.png\"><\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46764", "t": 1, "q": "这534家公司中，平均每家中小企业板公司在2020年第一季度的净利润越是创业板公司的（    ）。", "a": ["<p>2倍<\/p>", "<p>3倍<\/p>", "<p>4倍<\/p>", "<p>5倍<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/w5YKsbPalxJmTehE7nXMKyDG4K68fUitR0jeTMYK.png\"><\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46765", "t": 1, "q": "已公布2020年一季报的房地产公司中，平均每家公司的存货比上年同期增长了约多少亿元？（    ）", "a": ["<p>5<\/p>", "<p>11<\/p>", "<p>51<\/p>", "<p>105<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/omE40P5O6dCO90lw8yS8mjNKjDVgTB4w3yrbx36o.png\"><\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46766", "t": 1, "q": "已公布一季报的钢铁板块公司2019年第四季度的净利率（净利润比营业收入）约为（    ）。", "a": ["<p>2.57%<\/p>", "<p>1.80%<\/p>", "<p>-0.96%<\/p>", "<p>-0.61%<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/NcOlIsyQfYLFyMHqNwOPOT7eemyrFpYv7b3S4YLd.png\"><\/p>", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46767", "t": 1, "q": "关于这534家公司在2020年第一季度营业状况的描述与资料相符的是（    ）。", "a": ["<p>所有公司净利润之和比2019年第四季度有所上升<\/p>", "<p>超过1\\4的净利润来自中小企业板公司<\/p>"
