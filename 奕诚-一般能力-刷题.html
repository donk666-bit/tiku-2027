<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}

  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}

<script>
const DATA = {"id": "yc80", "name": "奕诚-一般能力", "chapters": [{"k": "一般能力||1.1节", "n": "一般能力 / 1.1节", "qs": [{"id": "40753", "t": 1, "q": "<p>从本质上说，人类文明的进程就是不断脱离动物界的过程，这一过程主要包括人类体质的进化和心性的进化两个方面。从猿到人的体质进化，人类用了上百万年的时间才完成，而人类心性的进化则还要缓慢。当人类跨越石器时代、青铜时代进入铁器时代之后，动物性依然顽强地在人类身上闪现着。如何管理好人类的情感，使带有动物性的人变成理性的人，是儒家最为关注的重要课题。如果把儒家的答卷归结为一个字，那就是“礼”。对这段文字的主旨概括最准确的是（ ）。<\/p>", "a": ["<p>描述人类文明发展进化的大致过程<\/p>", "<p>对比人类体质与心性两方面的进化<\/p>", "<p>阐述儒家强调礼仪作用的社会原因<\/p>", "<p>说明儒家思想的产生根源与现实意义<\/p>", "", ""], "r": "C", "e": "文段为分总结构。概括内容可知，作者从人类文明的进程说到人类情感的管理，最后引出儒家思想中的“礼”这一课题。由此可见，作者主要想谈的是儒家思想中的“礼”。故本题答案为C。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40754", "t": 1, "q": "<p>我国历来高度重视反假币工作，始终坚持“打防并举，标本兼治”，相关部门密切配合、通力协作，反假币工作逐步深入。公安机关加大打击力度，侦破了一大批大案要案。人民银行联合相关部门，加大反假币宣传，特别是在农村偏远地区，通过各种形式，持续宣传货币防伪常识，社会公众识假辨假的意识和能力得到有效提高。下列说法准确概括文意的是（ ）。<\/p>", "a": ["<p>银行目前发现的假币越来越少<\/p>", "<p>社会公众识别假币能力提高<\/p>", "<p>我国反假币工作逐步得到深入<\/p>", "<p>公安机关打击假币力度加大<\/p>", "", ""], "r": "C", "e": "【解析】文段为总分结构。首句表明观点，论述的是反假币工作逐步深入。其后的“公安机关加大打击力度”、“人民银行加大宣传”都是“反假币工作逐步深入”的具体表现。故C项为正确答案。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40755", "t": 1, "q": "<p>旅行是什么?德波顿并不想急于提供答案;旅行为了什么?德波顿似乎也不热心去考求。但释卷之后，相信每个读者都会得到一种答案——这答案，既是思辨的，也是感性的;既酣畅淋漓，又难以言说。因为它更像是一种情绪，令人沉醉而不自知。这段文字表达的主要意思是（ ）。<\/p>", "a": ["<p>德波顿给了读者宝贵的精神享受<\/p>", "<p>读者读后会得到模糊不清的答案<\/p>", "<p>读者领略到了德波顿的淡然无为<\/p>", "<p>德波顿没有解答读者提出的问题<\/p>", "", ""], "r": "A", "e": "【解析】由文段中的“既是思辨的，也是感性的;既酣畅淋漓，又难以言说”、“更像是一种情绪，令人沉醉而不自知”可知，作者对德波顿的作品持赞赏态度。B.C.D三项的感情倾向都与此不符，只有A项“给了读者宝贵的精神享受”恰当体现了作者的态度，当选。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40756", "t": 1, "q": "<p>近年来全球油价持续上涨，随着各国原油生产能力的日益提高，全球原油储备资源日趋紧张。据分析人士预测，这一上涨趋势绝不会在短期内逆转。受此影响，尽管汽车已逐渐成为人们不可缺少的日常交通工具，但越来越多的人决定暂缓买车或者开始暂停用车。照此看来，整个汽车销售市场的经营风险在相当长一段时间里有增无减。这段文字的主旨是（ ）。<\/p>", "a": ["<p>预测未来石油行业的发展趋势<\/p>", "<p>说明汽车销售业的经营风险将会增加<\/p>", "<p>探讨能源行业与交通运输行业存在的联系<\/p>", "<p>认为能源行业将逐渐影响人们的出行方式<\/p>", "", ""], "r": "B", "e": "【解析】以上这道题中的尾句中有“照此看来”这样带有提示结论性的词语，故应对其重点关注。文段说的是油价上涨使得买车的人减少，这一情况对汽车销售市场的影响便是“经营风险在相当长一段时间里有增无减”，与此一致的为Ｂ项。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40757", "t": 1, "q": "<p>就今日中国现实而言，启蒙无疑是一个迫切的任务，就中国历史而言，它是一个没有完成就被打断的历史任务。五四新文化运动的启蒙精神虽然长期被湮没和遗忘，但这并不证明中国不需要启蒙。现代的种种挫折都在提醒着我们：在现代化进程中，启蒙的任务是不可逾越的。因为人的解放这一目标没有什么东西可以将其超越，只要这一目标还没有实现，历史就必须进行补课。这段话主要回答的问题是（ ）。<\/p>", "a": ["<p>启蒙在中国历史上的地位<\/p>", "<p>启蒙与现代化的关系<\/p>", "<p>启蒙所承载的任务<\/p>", "<p>当今中国是否需要启蒙<\/p>", "", ""], "r": "D", "e": "【解析】材料从现实和历史的角度阐述启蒙的重要性，说明了“在现代化进程中，启蒙的任务是不可逾越的”的道理，这也回答了“当今中国是否需要启蒙”的问题。故本题正确答案为D。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40758", "t": 1, "q": "<p>梵蒂冈是世界上最小的国家。它坐落于罗马城西北角的高地上，由圣彼得广场、圣彼得大教堂、后花园和博物馆组成。梵蒂冈虽小，却“五脏俱全”，不仅拥有自己的国旗、国徽、国歌、货币、行政机构，还有天文台、直升飞机和火车站。最能准确复述这段话主要意思的是（ ）。<\/p>", "a": ["<p>梵蒂冈是世界上最小的国家<\/p>", "<p>梵蒂冈虽小，却拥有自己的国旗、国徽和其他国家都有的组织机构<\/p>", "<p>梵蒂冈国家虽小，但拥有一个国家所必备的一切机构<\/p>", "<p>梵蒂冈其实不能算作真正意义上的国家<\/p>", "", ""], "r": "C", "e": "【解析】这段文字的主体是梵蒂冈这个国家。重点在后面的“梵蒂冈虽小，‘五脏俱全’”，强调了梵蒂冈虽然是最小的国家，但是具备了一个国家所必备的机构，后面举例说明了它所具有的机构，印证了它的“五脏俱全”。A项不是主要意思；D项说法本身错误；B项不如C项的表述贴切题意。正确答案为C。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40759", "t": 1, "q": "古老的问答文化中问与答的形式和寻问、拷问、追问，都孕育着我们今天的谜语这种文化形式的各种要素。在神话思维的追问下，远古的先人们一点点地积累起关于世界的解答，这也成为后来人类思维与意识的模式和底层文化。当先人们要将这些知识传授给他们的下一代时，儿童游戏中的谜语形式便诞生了。后人又把先人们的文化问答通过新颖、曲折、变形的游戏问答加以传授和衔接，谜语便应运而生了。设问与回答是后世猜谜活动的本体，一切谜语文化都是从这里出发的。\n这段文字主要说的是（     ）。", "a": ["人类思维模式深受问答文化的影响", "谜语传承了先人对世界的认识和解答", "谜语文化源于古老的问答文化", "儿童游戏是古代知识传授的重要方式", "", ""], "r": "C", "e": "【解析】文段首先阐述古老的“问答文化”孕育着今天“谜语文化”的各种要素。随后指出远古先人由“追问”积累起的“解答”成为后人思维与意识的模式和底层文化，后经更新、变形“谜语”便诞生了。尾句进一步强调“一切谜语文化都从问答出发”，文段谈论的核心话题为“问答文化”和“谜语文化”，对应C 项。A.D 两项，没有提到“谜语文化”这一主题词，排除。B 项，没有提到“问答文化”这一主题词，排除。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40760", "t": 1, "q": "我们要在科学技术上赶超世界先进水平，不但要提高高等教育的质量，而且首先要提高中小学教育的质量，按照中小学生所能接受的程度，用先进的科学知识来充实中小学教育内容。\n这段话主要强调了（     ）。", "a": ["<p>提高高等教育质量是在科学技术上赶超世界先进水平的条件<\/p>", "<p>全面提高教育质量是在科学技术上赶超世界先进水平的条件<\/p>", "<p>提高中小学的教育质量是在科学技术上赶超世界先进水平的条件<\/p>", "<p>学习先进科学知识是在科学技术上赶超世界先进水平的条件<\/p>", "", ""], "r": "C", "e": "<p>【解析】文章简短，出现了一组关联词“不但而且......”，为递进关系，重点在递进之后，因此，“而且”句为主题句，同义替换为C。<\/p>", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40761", "t": 1, "q": "《米莉茉莉丛书》是吉尔·比特专为4～8岁的儿童编写的读物，其创作灵感来自个人的生活体验及对儿童早期教育的独特理解。她以米莉、茉莉这两个肤色不同的小女孩为主人公，讲述了她们的成长故事。丛书中每一个故事都有独立的主题，蕴涵对孩子潜移默化的教育目的。作者吉尔·比特认为书中传达的这些个性和素质，对于地球上任何国家任何肤色的孩子都是适用的。\n这段话主要介绍了（     ）。", "a": ["谁适合读《米莉茉莉丛书》", "《米莉茉莉丛书》的特点", "《米莉茉莉丛书》作者对该书的评价", "《米莉茉莉丛书》的主要内容", "", ""], "r": "B", "e": "【解析】此文段较长且关联词少，较难把握重点。仔细阅读文章，第一句介绍了《米莉茉莉丛书》的年龄对象，第二句介绍了书的主要内容，第三句话介绍了书的意义，第四句介绍了作者对该书的评价。可以发现这几个方面的信息是并存同在的并列关系，因此，每句皆为重点，结合选项，答案为B。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40762", "t": 1, "q": "人工智能在从事重复性、规则性、可编程的工作内容时更加快速、高效、精确，不仅可以替代体力劳动，而且可以替代大部分脑力劳动。随着人工智能的发展，翻译、导购、司机、会计等大量职业将可能被替代。同时，许多新职业被创造出来，促进了更高质量的就业发展。这些新职业主要集中在高新技术领域、新兴产业和现代服务业，如人工智能工程技术人员、数字化管理师等，大量劳动力从第一、第二产业转向第三产业，从传统职业转向新兴职业，从重复性、低价值的岗位转向创造性、高价值的岗位。\n这段文字主要说明（     ）。", "a": ["人工智能促使就业结构深度调整", "人工智能重构社会再生产各环节", "人工智能推动了产业智能化升级", "人工智能要求大幅提升就业能力", "", ""], "r": "A", "e": "【解析】文段开篇介绍人工智能在处理一些工作时更有效率，可以替代体力劳动和大部分脑力劳动，接下来介绍可能会被替代的职业，随后通过“同时”引导并列结构，表示人工智能的发展使许多新职业被创造出来，促进了更高质量的就业发展，并对这些新职业进行具体解释说明。故文段为并列结构，重点介绍人工智能的发展代替了大部分职业，也创造出了新职业，即人工智能促使就业结构发生变化，对应A项\nB项，“重构社会再生产各环节”文段未提及，无中生有，排除;\nC项，“推动了产业智能化升级”仅对应文段后半部分，表述片面，排除;\nD项，“要求大幅提升就业能力”文段未提及，无中生有，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40763", "t": 1, "q": "作家冯骥才在描述对历史名城巴黎的观感时曾说，巴黎的卢浮宫、凯旋门和圣母院等，只是“历史的几个耀眼的顶级的象征”，而巴黎真正的历史感则表现在城中一片片的老街和老屋中，因为这些昔日的空间中有活生生的历史，有血有肉，生动而真实。历史建筑和历史街区是静态的文化，而居住其中的人无时无刻不在流动，他们的生活习惯代代相传，形成了鲜活而有温度的民俗文化，这些民俗文化非常值得发掘、铭记与保存。所以说，最好的城市记忆不仅存在于城市的标志性建筑中，更存在于城市居民的生活细节与民生故事中。城市历史文化街区内发生过或正在发生的鲜活的民生故事，如同街区无形的毛细血管，联通着城市居民的生活和情感，同时还是城市历史某个断面和城市文化某个侧面最好的写照。\n上文作家冯骥才对巴黎观感描述，是为了说明（     ）。", "a": ["城市的标志性历史建筑表现静态文化", "寻遇拥有温度的民俗文化是动态文化", "城市居民的生活细节来源于老街与老屋", "老街和老屋更能伸展出城市的历史文化", "", ""], "r": "D", "e": "【解析】作家冯骥才对巴黎观感描述”属于举例论述，意在论证文段中心，故本题为中心理解题。文段开篇举例作家冯骥才对巴黎观感描述，指出城市中的老街和老屋更能展现城市的历史文化，随后肯定了老街和老屋中潜藏的民俗文化，接下来通过结论标志词“所以说”总结上文，并通过程度词“更”强调老街和老屋中的生活细节与民生故事对于城市文化的重要性，尾句通过比喻论证阐述了老街和老屋中的生活细节与民生故事对于城市文化的作用。故文段为“分总分”的结构，重点在于中间部分的结论，对应D项。\nA项，“静态文化”为结论前内容，非重点，排除;\nB项，“有温度的民俗文化”为结论前的内容，非重点，排除;\nC项，对应结论前的内容，非重点，且文段围绕“城市的历史文化”这一主题展开，该项偏离文段核心话题，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40764", "t": 1, "q": "黄色与红色一样，是中华民族偏爱的颜色。在与“五行说”相对应的“五色论”里，黄色代表土，居于四方的中央。东汉的儒家为了抬高君权，突出了“五行”和“五方”中“土居中央”的观点，把土说成是一切元素的根本，因此中央是至高无上的，这也极大地提高了黄色的地位。三国时期的魏文帝曹丕也接受了这一说法，把黄色定为正色之首，随后的隋、唐王朝都加以效仿。从唐代起，正黄色成为皇室的专用色，滥用即会获罪。时隔千年，虽然黄色早已进入寻常百姓家，但金黄色那高贵庄严的气质依然存在。\n对这段文字概括最恰当的一项是（     ）。", "a": ["分析中华民族偏爱黄色的原因", "追溯土居中央观念的形成历史", "探讨颜色与五行观念的内在渊源", "强调皇权观念对色彩文化的影响", "", ""], "r": "A", "e": "【解析】文段开篇指出黄色是中华民族偏爱的颜色，随后通过“东汉”“三国时期”“唐代”等多个时间维度展开论述，具体解释了中华民族历来偏爱黄色的原因，故整个文段为总—分结构，重点强调中华民族历来偏爱黄色的原因，对应A项。\nB项，“土居中央”对应文段“东汉”“三国”等时期，非重点，且表述片面，排除;\nC项“颜色”、D项“色彩”主题词范围扩大，文段重点论述“黄色”，均排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40765", "t": 1, "q": "法国的乔利·贝朗13岁时干小杂工。一次在熨衣服时，不小心将油灯打翻，煤油洒到衣服上，雇主要他赔偿，但孩子没钱，只好答应白打一年工。此后，孩子把那件弄脏的衣服挂在床头作为警示。一天，他突然发现那件衣服被煤油浸过的地方不但没有脏，而且原有污渍也清除了。这个发现令他眼前一亮。他通过无数次试验，终于研究出一种干洗剂。一年后，他开了家干洗店，生意越做越大，最后终于成为世界干洗大王。\n这段文字的主要内容是（     ）。", "a": ["当一个人打翻了命运灯盏，跟前一片漆黑时，千万别捻灭了心灵的灯盏", "小聪明使人忙乱，大智慧让人安宁", "心中有一盏明灯，脚底才有行动", "乔利·贝朗如何发明了干洗剂", "", ""], "r": "D", "e": "【解析】文段看完后可以看出文段是一个记叙文，但是问法一旦有所不同那么答案也就不同了。主要内容是D;文段通过世界干洗大王乔利·贝朗的经历给人们以启示。D项是对文段主要内容的概括，故这段文字的主要内容选D项。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40766", "t": 1, "q": "《史记》的生命力源于历代读者对它的接受。它作为一条文化链，有传播者、接受者、研究者，历代不绝，乃至于形成一门学问——“史记学”。这门学问的形成过程，就是《史记》生命力延伸的过程。汉魏六朝是传播和初步研究时期，此后不断发展，20 世纪以来进入高潮时期。《史记》的生命力还来源于其世界性的传播与研究：在日本，各种形式的《史记》抄本、刻本，或选本，或全本，数量在百种以上，普及程度非常广泛；在欧美国家，《史记》也愈来愈受到重视，全版的俄语、法语版已经问世，全本的英语版也即将完成。世界范围的《史记》研究愈来愈深入，显示出《史记》永久的魅力和生命力。\n这段文字主要介绍了（     ）。", "a": ["《史记》的传播过程", "“史记学”的独特魅力", "《史记》受重视的原因", "《史记》生命力的来源", "", ""], "r": "D", "e": "【解析】由“《史记》的生命力源于……《史记》的生命力还源于……”可知文段为并列结构，需要将并列前后分句的内容进行全面概括。文段前半部分介绍《史记》的生命力源于历代读者对它的接受，接下来具体说明历代读者是如何使其形成一门学问并进行传播的；文段后半部分介绍《史记》的生命力还源于其世界性的传播和研究，接下来举例说明《史记》在全世界不同国家的传播，体现出其生命力。故整个文段重在介绍《史记》生命力来源的两个方面，对应 D 项。A 项，“《史记》的传播过程”、C 项，“《史记》受重视”均对应并列后半部分的内容，表述片面，排除。B 项，“’史记学’”对应并列前半部分的内容，表述片面，且对应解释说明的部分，非重点，排除。故正确答案为 D。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40767", "t": 1, "q": "综观自然界里的动物和植物，蓝色是一种极其罕见的颜色，我们吃的食物几乎没有蓝色的。在18世纪初普鲁士蓝被意外发明之前，蓝色颜料一直难以获得。当时画家笔下那种鲜艳.饱和的蓝色，主要来自一种名贵的矿石——阿富汗青金石。青金石研磨成粉，可以调制出稳定的蓝色颜料“群青”。这些宝贵的石头通过丝绸之路，从中亚流向欧洲和中国，成为画家笔下神秘绚烂的一抹异色。在莫高窟的壁画中，我们便可以找到这种蓝色。因为珍稀罕见，青金石在市面上流通的价格一度比黄金还要昂贵几倍。\n这段文字主要介绍（     ）。", "a": ["自然界中蓝色极其罕见的原因", "古代绘画中所使用的蓝色颜料", "青金石在莫高窟壁画中的使用情况", "丝绸之路对中西方文化交流的影响", "", ""], "r": "B", "e": "【解析】文段开篇指出蓝色在自然界的动植物中极为罕见，随后通过18世纪初普鲁士蓝被意外发明之前蓝色颜料很难获得，画家笔下的蓝色主要来自阿富汗青金石来论述蓝色颜料罕见，之后指出这种石头需要通过丝绸之路流向其他地方，并以莫高窟壁画为例进行论证，尾句再次论述蓝色颜料的原材料青金石价格昂贵。故文段主要介绍了古代绘画中所使用的蓝色颜料的相关情况，对应B项。A项，文段开篇指出“综观自然界里的动物和植物，蓝色是一种极其罕见的颜色”，但文段并未提及自然界中蓝色罕见的原因，故“罕见的原因”无中生有，且文段重点强调“蓝色颜料”，“蓝色”范围扩大，排除；C项，“莫高窟壁画”仅对应文段举例部分的内容，非重点，排除；D项，缺少文段主题词“蓝色颜料”，排除。故正确答案为B。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40768", "t": 1, "q": "传统文学自现代以来一直有纯文学和通俗文学之分。纯文学的读者往往是小众的、精英化的，通俗文学则是供更广大的人群阅读，而作者也是顺应这两个阅读方向形成了相对稳定的群体。网络文学则不同于这两者，能让更多的年轻群体参与阅读。它的多样性让更多的人能够在其间满足自己的需求，因此让原来并非文学读者的一部分大众作为文学阅读的“增量”参与到文学阅读之中，也使得许多不同身份的年轻写作者在这个空间中找到了职业写作的可能性。大量的年轻读者和作者从网络文学的入口进入了文学之中。\n这段文字重在说明（     ）。", "a": ["网络文学的出现扩大了文学作品的受众", "网络文学比传统文学更能吸引青年人群", "网络文学比传统文学更能满足各类人群的需求", "网络文学的发展扩大了文学的读者和作者群体", "", ""], "r": "D", "e": "【解析】文段开篇论述“纯文学”与“通俗文学”的受众、作者的情况。接着通过“网络文学则不同于这两者”引出文段的核心话题“网络文学”。然后通过“因此”对上文进行总结，引出结论，其中“也”表示并列，结论为网络文学使得文学读者增加，也使得不同身份的年轻作者加入文学。尾句“大量……进入了文学之中”对结论进行补充说明。故文段重点为“因此”之后引导的结论，强调网络文学使很多读者和作者进入文学，D 项“扩大了文学的读者和作者群体”概括全面，符合文意，当选。\nA项：“扩大……受众”只是网络文学带来的一方面情况，未提及作者的增加，表述片面，排除。\nB项：“青年人群”只对应“年轻写作者”，未提及一部分大众加入文学中，表述片面，排除。\nC项：“满足各类人群的需求”表述不明确，文段明确提出网络文学利于增加读者和作者，排除。故正确答案为D。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40769", "t": 1, "q": "近年来，3D 打印技术开始应用于食品、建筑、医疗卫生、航空航天等多个领域。随着3D 打印技术在金属零部件制造上取得较大进展，各国开始探讨其在武器装备制造与维修中的应用。研究表明，3D 打印对军用武器及设施维修效果显著，能直接在战场上把需要的零部件“打印”出来，及时、精准完成受 损装备的维修，快速恢复其作战能力。然而，这种方式制造的军用设备有着不可避免的缺陷，对装备材料要求极高的军用设备来说，除了尺寸受限，其强度和质量也令人担忧。受技术、成本的限制，3D 打印技术难以取代大规模流水线生产。\n这段文字主要介绍了3D 打印技术（     ）。", "a": ["广阔的应用前景", "取得的最新进展", "在军事领域的应用情况", "与大规模流水线生产的区别", "", ""], "r": "C", "e": "【解析】文段首先交代背景，引出3D 打印技术这一话题。接着指出各国探讨其在武器装备制造与维修中的应用。随后介绍其对军用武器及设施维修效果显著。最后通过转折关联词“然而”指出3D 打印技术在制造军用设备中存在不可避免的缺陷，难以取代大规模流水线生产。故文段主要介绍3D 打印技术在军事领域的应用情况，对应C 项。\nA 项：“广阔的应用前景”属于无中生有，且未提及主题词“军事领域”，排除。\nB项：“取得的最新进展”对应文段转折前的内容，非文段重点，且未提及主题词“军事领域”，排除\nD项：“与大规模流水线生产的区别”非文段重点，且未提及主题词“军事领域”，排除。\n故正确答案为C.", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40770", "t": 1, "q": "隋代书法作为南北朝书法向初唐书法变迁的转折点，对初唐书法的发展起到先导和定向的作用。从总体上看，隋代书法逐步放弃了北朝书法那种欹侧之势和大刀阔斧的用笔，吸取了南朝书风的圆润温和特征，形成了独特的“隋楷”样式。虽然它历时短暂，流传作品稀少，但却个性鲜明，成为今天了解楷书风格\n发展过程的一个重要节点和样本。\n对这段文字的大意概括最恰当的是（     ）。", "a": ["楷书是隋代书法最突出的成就类型", "初唐书法的发展直接受隋代书法影响", "隋代书法在书法历史上具有重要的地位", "隋代以后圆润温和成为书法的鲜明特点", "", ""], "r": "C", "e": "【解析】文段开篇引出“隋代书法”这一话题及其对初唐书法的作用，接下来具体介绍隋代书法的特点，尾句通过代词“它”对前文进行总结，并且通过转折关联词 “但”强调隋代书法对于今天了解楷书的重要性。故文段为“并列”结构，旨在强调隋代书法在书法发展中的重要性，对应C 项。\nA 项：“最突出的成就类型”表述过于绝对，排除。\nB 项：“初唐书法……受隋代书法影响”对应文段第一句的表述，为转折之前的内容，非重点，排除。\nD 项：“隋代以后……书法的鲜明特点”文段并未论述，无中生有，排除。故正确答案为C。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40771", "t": 1, "q": "人体严密的免疫防御系统，会在细菌入侵时引起炎症反应，白细胞和大量“防御斗士”对病原体展开攻击，防御的一方通常会胜利。理论上讲，“刺激”消除后，炎症反应会逐渐消失，组织回到正常状态。但在某些特定情况下，炎症依然会持续，这种低度炎症不像通常的炎症那样可以明显感觉到它的存在，其更像人体内未被完全熄灭的“火苗”。机体通过炎症反应抵抗病原体的过程，保障了人类的生存，但是科学家发现，这种低度炎症会缩短生命，促进许多年龄相关性症状，如认知衰退，神经变性、动脉粥样硬化等。不过，引起和维持这些变化的机制，目前尚不能明确。\n这段文字主要介绍（     ）。", "a": ["人体免疫系统的防御机制", "低度炎症的发生机制与影响", "细菌对人类生存的影响", "年龄相关性症状的研究现状", "", ""], "r": "B", "e": "【解析】文段开篇介绍人体的免疫防御系统会在细菌入侵时引起炎症反应，理论上讲，“刺激”消除后，炎症反应会逐渐消失，组织回到正常状态。接着通过转折关联词“但”指出特定情况下低度炎症会持续存在。随后解释了低度炎症的产生原理及其好、坏两方面影响。故文段主要围绕“低度炎症”展开，阐述了低度炎症的产生原理和对人类的影响，对应B 项。\nA项：文段论述的核心话题为“低度炎症”，“人体免疫系统”范围扩大，排除。\nC 项：仅对应文段首句内容，非重点，排除。\nD 项：文段论述的核心话题为“低度炎症”，“年龄相关性症状的研究现状”偏离文段中心，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40772", "t": 1, "q": "推动媒体融合发展，事关推进国家治理体系和治理能力现代化。在全媒体时代，媒体不仅是信息的提供者和传播者，而且在国家治理中也发挥着重要作用。因此，媒体融合不仅仅是一个传播命题，还是一个治理命题。\n这段文字的主旨是（     ）。", "a": ["国家治理现代化需要促进媒体融合", "媒体融合发展有利于促进信息传播", "媒体融合发展是信息技术发展的需要", "媒体在国家治理中应承担主要责任", "", ""], "r": "A", "e": "【解析】文段开篇点明推动媒体融合发展对于国家治理很重要，引出“媒体融合”这一话题。接着分析媒体对信息的提供、传播以及国家治理有重要作用。尾句通过“因此”总结前文，指出媒体融合不仅是传播命题还是治理命题。“不仅仅……还是……”更多强调媒体融合是一个治理命题。首尾呼应，故文段重点强调“媒体融合”对于国家治理很重要，对应A 项。\nB项：“信息传播”对应的是“因此”之前的内容，非重点，排除。\nC项：“信息技术发展”文段并未提及，无中生有，排除。\nD项：文段主题词为“媒体融合”而非“媒体”，偷换概念，排除。\n故正确答案为 A", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40773", "t": 1, "q": "《汉书·平帝纪》记载，元始二年，“民疾疫者，舍空 邸第，为置医药”，提出了“隔离”是防疫的重要举措。明代中期我国就出现了预防 天花的“人痘”接种术。18世纪末，英国科学家爱德华·琴纳发明了接种牛痘预防天 花的方法，经过几代科学家不懈努力，最终研制出灭活天花病毒的疫苗。随着现代医 学科技发展和公共卫生基础设施不断完善，霍乱、鼠疫、流感等曾经对人类造成巨大 危害的传染病逐渐得到了有效控制。近些年来，在抗击严重急性呼吸综合征 (SARS)、 中东呼吸综合征 (MERS) 、甲型 H1N1流感、埃博拉病毒等多次重大传染病中，科学 技术都发挥了重要作用。新中国成立以来，我国通过传染病重大科技专项研发部署，在传染病防治领域的科研水平、技术能力、平台建设、人才队伍等方面都有了明显提升。\n这段文字主要说的是（     ）。", "a": ["中西方在疫情防治理念方面存在诸多共性", "借鉴历史经验对于防控疫情具有重要意义", "疫情防控离不开国家自上而下的科学部署", "科学发展和技术创新有助于人类战胜疫情", "", ""], "r": "D", "e": "【解析】文段开篇引入防疫举措——隔离，接着举例说明古今中外通过科学技术，多次成功抗击重大传染病。因此，文段主要强调科学技术对抗疫的重要作用，对应D项。\nA项：文段没有对中西方在疫情防治理念方面的异同作比较，故“存在诸多共性”属于无中生有，排除。\nB项：“历史经验”对应文段举例内容，非文段重点，且缺少文段主题词“科学技术”，排除。\nC 项：“自上而下”文段没有提及，无中生有，且文段强调的是科学技术发展，该\n项偏离文段核心话题，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40774", "t": 1, "q": "今天的青年，有着同先辈们一样的“处处为国家着想”的 赤子之心，一样的“把有限的生命投入到无限的为人民服务中去”的凛然担当。他们 享受生活，但同时也勇于担当职责；他们关注个人权益，但同时也懂得尊重集体和他 人福祉；他们主张自主选择，但也并不缺乏家国情怀、奉献精神，一样是雷锋精神的坚定拥趸和积极行动者。\n本段文字旨在说明（     ）。", "a": ["今天的青年同样具有雷锋精神", "新时代雷锋精神具有新的阐释", "雷锋精神在本质上未发生改变", "雷锋精神已经融入到生活之中", "", ""], "r": "A", "e": "【解析】文段开篇指出“今天的青年”与先辈们具有一样的“为人民服务”的精神品质，接着通过三个并列句具体论述“今天的青年”身上是如何体现雷锋精神的。 故文段主题词是“今天的青年”，意在强调“今天的青年”与先辈们一样是雷锋精神的拥趸和行动者，对应A 项。\nB项：缺少主题词“今天的青年”，且“新的阐释”无中生有，排除。\nC项：缺少主题词“今天的青年”，排除。\nD 项：缺少主题词“今天的青年”，且“融入到生活之中”无中生有，排除。故正确答案为A", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40775", "t": 1, "q": "每天早上，小王都要躺在床上浏览700多位微信好友的朋 友圈动态、100多个公众号的订阅文章、50多个群聊的闲言碎语，再加上微博、QQ 等其他社交工具，全部浏览完要花掉他1个多小时的时间。不仅起床前，连上厕所、吃饭、等车、坐车的一切零碎时间，小王都在看手机，直到这一天结束，最后再看一眼朋友圈，他才能安心睡觉。不断浏览让他觉得充实，但到底读到了什么，他还真的回答不上来。\n这段文字所针对的现象是（     ）。", "a": ["沉迷网络社交工具带来的困惑", "对于年轻人来说读书有些奢侈", "阅读速度跟不上网络更新速度", "很多网络文章阅读价值都不大", "", ""], "r": "A", "e": "【解析】文段首先描述了小王每天在各类社交工具上花费大量时间的生活状态， 尾句通过转折关联词“但”引出文段重点，即大量的浏览并未使小王真正有所收获，A 项为文段中心的同义替换，当选。\nB 、D 两项：B 项“读书有些奢侈”、D 项“网络文章阅读价值”均为无中生有的表述，排除。\nC 项：文段并未把阅读速度与网络更新速度进行对比，“跟不上”无中生有，\n排除。故正确答案为A。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40776", "t": 1, "q": "不论是以巴尔扎克为代表的19世纪欧洲文学，还是以鲁迅为先导的中国现代文学，多半高擎现实主义大旗开垦生活，塑造典型。新时期以来的文学创作，基本也都坚守现实主义立场，比较善于揭露、针砭生活中的负面客 观真实，这是完全必要且非常宝贵的。然而，部分小说缺乏对生活中积极因素和正面 形象的塑造，缺少对正面价值和情感的呼吁。其实，现实主义创作以人道主义思想为武器，不仅注重剖析社会的阴暗面，也应注重展示生活的亮点；不仅看重批判社会阴暗面的准确性和深刻性，也更看重作家对人物命运的关怀和同情。\n这段文字主要批评了新时期以来文学创作中（     ）方面的问题。", "a": ["典型人物的塑造过于刻板单一", "作家缺乏对现实生活的关注", "缺乏对优秀文学传统的继承", "部分小说存在消极负面的倾向", "", ""], "r": "D", "e": "【解析】文段开篇交代背景，指出中国现代文学多半是现实主义文学。然后先肯定了新时期以来的文学创作揭露生活中的负面现象是正确的。紧接着通过转折关联词 “然而”强调“部分小说缺乏对生活中积极因素和正面形象的塑造，缺少对正面价值和情感的呼吁”。后文利用创作要“注重展示生活的亮点”和“看重作家对人物命运的关怀和同情”从反面论证前文观点。故文段批评的是新时期以来文学创作中“部分小说存在消极负面的倾向”，对应D 项。A 、B 、C三项：A 项“人物……刻板单一”、B 项“缺乏对现实生活的关注”、C项“缺乏……继承”均为无中生有，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}, {"id": "40777", "t": 1, "q": "随着农村人口快速向城市转移，教育资源的供给并未随之增容，如调整中小学布局，扩建、新建学校，调配师资等。单纯靠挖掘潜力“加双筷子”的办法应对教育资源不足的问题，终究难以为继。人口城市化是不可逆的趋势，促进城乡教育均衡化，不是简单把农村学生留在农村，事实上也是留不住的，应顺应城市化发展的趋势，随人口流动来配置和供给教育资源。子女教育往往是农村进城人口的第一需求，解决好农民子女进城教育的问题，也是推动农村人口就地城市化的基础。\n这段文字针对的主要问题是（     ）。", "a": ["教育资源调配与现实需求严重脱节", "人口快速流动给城市发展造成压力", "农村转移人口在城市生活中遇到障碍", "城镇化背景下教育资源供给存在矛盾", "", ""], "r": "D", "e": "【解析】文段开篇指出农村人口快速向城市转移，教育资源供给不足的问题。随 后指出单靠挖掘潜力的办法不足以解决问题。接着提出对策，即想解决问题“应顺应 城市化发展的趋势，随人口流动来配置和供给教育资源”。尾句进一步说明这样做的 好处。由于题干问的是文段针对的问题，即在农村人口大量涌入城市的背景下，城市人口越来越多，但教育资源却供给不足，对应D 项。\nA 项：缺少主题词“城市化”，偏离文段中心，排除。\nB 项：“给城市发展造成压力”与文段“教育资源供给”的话题不一致，排除。\nC 项：文段讨论的话题为城市化背景下教育资源的供给问题，“在城市生活中遇到障碍”将话题扩大，排除。\n故正确答案为 D。", "l3": "一般能力", "l4": "1.1节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.2节", "n": "一般能力 / 1.2节", "qs": [{"id": "46003", "t": 1, "q": "大数据时代的到来已经毋庸置疑。在这种情况下，数据成为一种无形的资产，但很少有人知道如何将这种资产“变现”。对于一个普通的企业而言，企业不仅拥有宝贵的客户数据，同样也拥有供应商数据以及内部财务、设计、制造、管理等数据，而在过去的数十年间，许多中国企业都已经一步步完成信息化应用，各种信息化工具正在将企业的运营数据化。但少有企业真正从纷繁复杂的数据中获取更多有价值的信息，数据成为一种资产，这在很长一段时间内其实只是停留在了表面。\n这段文字意在说明（     ）。", "a": ["企业应使用信息化工具实现运营的数据化", "企业应该进一步挖掘数据资产的潜在价值", "将数据变成资产是企业大数据应用的主要目的", "现有数据模式难以满足企业运营数据化的需要", "", ""], "r": "B", "e": "【解析】文段开篇介绍背景，即大数据时代已经到来。接着指出数据是一种无形 资产，转折关联词“但”之后强调如何“变现”少有人知。随后进一步论述数据对于 普通企业的重要性。尾句再次通过转折关联词“但”强调很少有企业从数据中获取有 价值的信息，数据只停留在表面。故文段强调企业应该进一步挖掘数据的潜在价值，对应B 项。\nA 项：对应尾句转折前的内容，非重点，且运营的数据化已经在实现过程中，用“应”强调并不恰当，排除。\nC 项：“主要目的”文段未提及，文段重点强调如何将数据变成资产充分利用，\n排除。\nD项：文段未提及“数据模式”这一概念，无中生有，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46004", "t": 1, "q": "古人形容漂亮可以用“貌比潘安”“玉树临风”“顾盼神飞”，我们只会说“高富帅”“白富美”;古人形容人难看可以用“东施效颦”“獐头鼠目”，我们只会说“矮穷姓”“颜值低”;古人表达悲伤用“我心伤悲，莫知我哀”，我们只会用“蓝瘦香菇”……也许这种对比有些极端，但如果有一天你张口闭口只会习惯性地说“高富帅”“矮穷姓”，就会遗失了祖先留给我们的宝贵的语言财富。\n这段文字意在说明（     ）。", "a": ["流行语威胁传统语言财富", "语言随着时代发展而改变", "古汉语已经被大众所厌弃", "用流行语说话更简单直白", "", ""], "r": "A", "e": "【解析】文段首先通过并列结构把古人与现代人在形容漂亮、难看和表达悲伤时使用的不同表达进行对比，接着尾句通过转折关联词“但”引出文段重点，强调如果有一天只会说流行语，就会遗失了祖先留给我们的宝贵的语言财富，即流行语会对传统语言财富造成不好的影响，对应A 项。\nB 项：“改变”表述不明确，且没有提到“传统语言”这一核心话题，排除。\nC 项：“已经”表述错误，文段仅是一种假设，尚未发生，且“厌弃”表意过于消极，排除。\nD 项：“用流行语说话更简单直白”与文意相悖，且没有提到“传统语言”这一核心话题，排除。\n故正确答案为A:", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46005", "t": 1, "q": "技术是一把“双刃剑”，应用得当可以造福社会、造福人民，应用不当会危害社会、危害人民。当前，从整个世界范围来看，网络安全威胁不断增加，信息安全问题日益突出。没有网络安全就没有国家安全，没有信息安全就谈不上让信息化更好造福人民。信息时代，人们享受着数字化生活带来的诸多便利，但网络黑客、互联网诈骗、侵犯个人隐私等又让很多人“中招”。可见，信息化应用越深入，就越要重视信息安全问题。\n这段文字意在强调（     ）。", "a": ["<p>必须完善法律法规，为数字化生活提供法治保障<\/p>", "<p>解决信息安全问题，提高数字化生活的安全系数<\/p>", "<p>降低信息化应用成本，增进人民福祉、造福社会<\/p>", "<p>提高数字化生活质量，就必须加强信息技术手段<\/p>", "", ""], "r": "B", "e": "【解析】文段首先指出“技术是一把‘双刃剑’”。随后重点描述目前网络信息安 全问题十分突出，网络信息安全关乎国家的安全和人民的切身利益。接下来通过正反 论证分析问题，指出信息时代人们享受着数字化生活带来的诸多便利，但又面临网络安全的威胁。最后，通过结论词“可见”总结前文，并提出对策“要重视信息安全问题”。故文段为“分一总”结构，意在强调当前需要重视信息安全问题，对应B 项。\nA 、C两项：A 项“完善法律法规”、C 项“降低信息化应用成本”均为无中生有，排除。\nD项：文段讨论的核心并不是“提高数字化生活质量”，而是“信息安全”问题，\n且提出的对策是“重视信息安全”，而非“加强信息技术手段”，排除。故正确答案为B。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46006", "t": 1, "q": "<p>机器学习的主旨是让计算机去模拟或实现人类的学习行为，是人工智能的核心。机器学习虽然可以在大数据训练中学到正确的工作方法，但它也很容易受到恶意干扰。通常攻击者是通过输入恶意数据来“欺骗”机器学习模型，导致其出现严重故障。近日，“Data61”机器学习小组研发出了一种机器学习的新算法。这种新算法通过类似疫苗接种的思路，帮助机器学习“修炼”出抗干扰能力。这是针对机器学习模型打造的防干扰训练，譬如，在图片识别领域，该算法能够对图片集合进行微小的修改或使其失真，激发出机器学习模型的抗干扰能力，并形成相关的自我 抗于扰训练模型。 这段文字意在说明（ ）。<\/p>", "a": ["<p>干扰机器识别图像的新方法<\/p>", "<p>新算法助机器学习抵抗干扰<\/p>", "<p>机器学习是人工智能的核心<\/p>", "<p>机器学习大数据训练的方法<\/p>", "", ""], "r": "B", "e": "【解析】文段开篇引出“机器学习”的话题。接着通过转折关联词“但”指出机器学习存在容易受到干扰的问题。随后通过学习小组的研究提出对策，即“一种机器学习的新算法”，并对对策进行具体解释说明。故文段结构为“提出问题+解决问题+解释说明”，重点在于对策，即针对机器学习防干扰的新算法，对应B 项。\nA项：文段的重点在于“防干扰”的做法，而不是“干扰”的方法，排除。\nC 项：“机器学习是人工智能的核心”对应文段开篇引出话题的内容，非重点，排除。\nD 项：“大数据训练”对应文段转折之前的内容，非重点，排除。\n故正确答案为B", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46007", "t": 1, "q": "<p>沿着什么样的法治道路前进，直接关系社会主义法治建设的成败。世界上没有放之四海而皆准的法治模式。如果脱离本国实际照抄照搬别国的法治模式，就会对经济社会发展产生消极作用。实践中，有的国家就是因为简单照抄 照搬别国的法治模式，结果不但没有实现善治，反而增加了社会不稳定因素。法治是 现代国家治理的基本特征和根本保障，任何一个国家进行法治建设，都必须探索适合自己的法治道路。 这段文字意在说明（ ）。<\/p>", "a": ["<p>法治道路直接决定法治建设成败<\/p>", "<p>法治建设离不开本国的法治实践<\/p>", "<p>应坚定探索适合自身的法治道路<\/p>", "<p>没有放之四海而皆准的法治模式<\/p>", "", ""], "r": "C", "e": "【解析】文段首句引出话题，论述了“法治道路”的重要性；随后指出世界上没有放之四海而皆准的法治模式；紧接着运用反面论证，强调脱离本国实际照抄照搬别国的法治模式会带来一系列不良影响；尾句通过“必须”提出对策，强调任何一个国家进行法治建设都必须探索适合自己的法治道路。故文段论述的重点是必须探索适合自身的法治道路，对应C 项。\nA 项：指出了法治道路的重要性，非重点，文段重点强调的是对策，排除。\nB 项：“法治实践”为举例内容，非重点，且“本国的法治实践”侧重强调已经做过的，而文段尾句的“探索”侧重强调未知的，与文意不符，排除。\nD 项：表述不明确，未明确指出文段的重点，即应探索适合自身的法治道路，排除。\n故正确答案为 C。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46008", "t": 1, "q": "与硬实力相比，软实力偏重的是一种影响力、一种精神性。一个城市的软实力是外界对这座城市吸引力、感染力的直觉反应和头脑印记，是市民对这座城市的认同与依恋，是城市管理者智慧与情怀的折射。软实力与硬实力结合，构成了一个城市的整体实力，而两者的相加并非一个常数，软实力直接影响着硬实力效能的发挥。软实力像一条软绳子，硬实力像一堆硬干柴，绳子虽软，却可以把硬干柴紧紧捆绑在一起，形成铸造一座美好城市的巨大能量。\n这段文字意在说明（     ）。", "a": ["<p>城市软实力和硬实力各有侧重<\/p>", "<p>城市软实力的内涵及其重要性<\/p>", "<p>城市整体实力的概念及其构成<\/p>", "<p>城市软实力和硬实力相得益彰<\/p>", "", ""], "r": "B", "e": "【解析】主旨概括题。文段的主语和话题是“软实力”，前两句都在讲什么是“软实力”，即软实力的“内涵”，后半段在讲软实力的作用，即其“重要性”，所以答案为B。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46009", "t": 1, "q": "<p>民之所好好之，民之所恶恶之。环境就是民生，青山就是美丽，蓝天也是幸福。发展经济是为了民生，保护生态环境同样也是为了民生。既要创造更多的物质财富和精神财富以满足人民日益增长的美好生活需要，也要提供更多优质生态产品以满足人民日益增长的优美生态环境需要。要坚持生态惠民、生态利民、生态为民，重点解决损害群众健康的突出环境问题，加快改善生态环境质量，提供更多优质生态产品，努力实现社会公平正义，不断满足人民日益增长的优美生态环境需要。 这段文字意在（ ）。<\/p>", "a": ["<p>阐释人与自然和谐共生的基本观念<\/p>", "<p>呼吁人民群众参与到生态文明建设之中<\/p>", "<p>强调良好的生态环境是民生之福祉<\/p>", "<p>揭示绿水青山就是金山银山的发展理念<\/p>", "", ""], "r": "C", "e": "【解析】文段开篇指出民之所好就是良好的生态，无论是发展经济还是保护生态  环境均是为了民生。随后通过“既要……也要…… ”进行解释说明。后文通过“要” 给出对策，并通过程度词“重点解决”引出文段重点，强调要以“民”为中心发展生   态，只有具备良好的生态环境，才能满足各个方面的民生需求，即强调“生态环境” 对于“民生”的重要性，对应 C 项，“民生之福祉”即“不断满足人民日益增长的优美生态环境需要”的同义替换。\nA 项：“基本观念”文段并未提及，无中生有，且该项未提到“民生”这一核心话题，排除。\nB 项：“呼吁人民群众参与到生态文明建设之中”文段并未提及，文段的重点是强  调良好的生态环境对于民生的重要性，并非给“人民”提出对策与做法，与文意不符，排除。\nD 项：未提及文段主题词“民生”，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46010", "t": 1, "q": "汉字经历甲骨文、金文、小篆、隶书、楷书等字体发展变化，在每种字体的书写中，都蕴含着丰富的美学价值。龟甲兽骨上清丽瘦硬的甲骨文、青铜器里圆转古朴的金文、刻石中整齐端庄的篆书，个体字符的线条、结构，整体章法 的布局、排列，都表现出鲜明的审美取向和追求。汉字在实用功能和美学价值的驱动下，形成了中国特有的文化现象——书法。书法作品中结构的疏密、行笔的缓急，更将汉字的美发挥到极致。\n这段文字意在强调（     ）。", "a": ["书法在中国传统文化中具有重要地位", "文字是一种具有审美价值的视觉符号", "汉字的形体演变反映了审美取向的变化", "书法充分发挥了汉字所蕴含的美学价值", "", ""], "r": "D", "e": "【解析】文段开篇介绍汉字字体的发展变化，指出每种字体在书写中都蕴含着美学价值，并具体介绍了汉字不同字体的美。随后说明汉字在实用功能和美学价值的驱动下形成了书法。尾句则通过程度词“更”强调书法将汉字的美发挥到极致。故文段为“分—总”结构，意在强调书法将汉字之美发挥到极致，对应D 项。\nA项：“重要地位”文段未提及，无中生有，排除。\nB 项：“文字”概念扩大，文段主题词为“汉字”，排除。\nC 项：“汉字的形体演变”对应文段开篇话题引入部分，非文段重点，排除。故正确答案为 D", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46011", "t": 1, "q": "随着世界多极化、经济全球化的深入发展，全球治理问题成为又一个重要国际话题。世界各国面临多个需要携手解决的问题，治理需求上升，然而大国间由于嫌隙不断，协调能力变弱。过去作为全球问题主要解决者的欧美国家，自身问题重重，显得有心无力。在这种局面下，世界期待中国有所作为。\n这段文字意在说明（     ）。", "a": ["全球治理问题，国国有责", "全球治理问题，欧美国家心有余而力不足", "全球治理问题，中国正在走进世界舞台中央", "全球治理问题，亟需解决", "", ""], "r": "C", "e": "【解析】文段开篇介绍背景“世界各国面临多个需要携手解决的问题”。随后通过 转折关联词“然而”引出问题，欧美国家在治理国际问题方面力不从心。最后通过 “在这种局面下”进行总结，引出文段重点，即在治理全球问题中，世界期待中国有所作为，对应C 项。\nA 项：文段重点强调中国有所作为，而非“国国有责”，且欧美国家已经自顾不暇，排除。\nB 项：该项论述欧美国家的情况，非文段重点，排除。\nD 项：“亟需”强调时间上的紧迫性，在文段中无从体现，且表述不明确，未突出中国的重要作用，排除。故正确答案为C", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46012", "t": 1, "q": "在专业越来越细分的今天，每个学者阅读的文献越来越有限，评审者的眼力总会存在盲区。用技术手段检测论文原创性不但必要而且高效，为衡量论文的学术水准提供了有效参考。但是，过于依赖“查重”的弊病也是显而易见的。论文的品质本质上不是由重复率多少决定的，“重复率”与“原创性”也并非简单的对应关系。现有的论文检测系统的原理基本相同，都是将论文切块分解后，与资源库中的内容进行匹配度检测，所谓“重复率”是以文字相同多寡为基础的。但是，在绝大部分论文中，同样数量的文字对学术创新的价值是不同的。\n这段文字意在（     ）。", "a": ["分析原创性与学术创新的关系", "说明过度依赖论文查重的局限", "介绍技术手段检测论文的现状", "阐释论文检测系统的科学原理", "", ""], "r": "B", "e": "【解析】文段首先提出“用技术手段检测论文原创性不但必要而且高效”，肯定了技术查重的好处。接下来通过转折关联词“但是”提出“过于依赖‘查重’的弊病”。后文通过具体解释说明论文检测系统的查重原理来体现其弊端。故文段重在说明过度依赖“查重”的弊端局限，对应B 项。\nA 项：“原创性”与“学术创新”的关系是具体解释说明部分的内容，非重点，排除。\nC 项：“现状”一词表述不明确，“现状”可以有好有坏，而文段重在强调过分依赖技术查重会带来弊端，排除。\nD 项：“科学原理”为具体解释说明查重弊端中的内容，排除。故正确答案为B.", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46013", "t": 1, "q": "每一个民族的文化复兴，都是从总结自己的遗产开始的。在几千年历史长河中，我国各族人民创造了丰富的历史文化财富，留下了大量文物遗存。历史文物是传统文化的重要物质载体，记录着我们历史的光辉过去，延续着我们国家和民族的精神血脉，承载着我们民族的认同感和自豪感。保护历史文物和文化遗产，是传承中华优秀传统文化、坚定文化自信的必然要求。不断加大文物保护力度，让我们的城市建筑更好地体现地域特征、民族特色和时代风貌，有助于我们传承优秀传统文化，凝聚伟大民族精神，为实现民族复兴提供正确的精神指引和强大的精神动力。\n这段文字意在强调（     ）。", "a": ["民族文化复兴的途径", "传统文化的物质载体", "城市规划要富有特色", "文物保护的深远意义", "", ""], "r": "D", "e": "【解析】文段首先介绍了民族的文化复兴是从总结遗产开始的。接着论述我国有 大量的文物遗存，并强调“历史文物”对我们国家和民族的重要性。然后引出“保护 文物”的话题，并通过“必然要求”强调保护历史文物和文化遗产的重要性。尾句进\n一步论证，论述了“加大文物保护力度”的好处，对应D 项。\nA 项：“民族文化复兴的途径”对应文段首句，起到引出话题的作用，非重点，且该项的重点在于“途径”，而文段的重点在于“意义”，排除。\nB项：“传统文化的物质载体”不及“文物保护”表述更加明确，且该项未提及保护的意义，排除。\nC 项：“城市规划”文段并未提及，无中生有，排除。\n故正确答案为 D。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46014", "t": 1, "q": "<p>国内创意产业园、主题乐园热衷于引进海外项目，或是复制国外的文化形象，看似是文化上的兼容并包，实则反映了民族文化自信的匮乏。各地对民族文化形象及其产品转换缺乏兴趣，是个值得深思的问题。表面上看，原因在于商家对于经济效益的追求，他们试图以异域文化形象刺激大众。实质上，商家的选择基于这样一个令人尴尬的事实：中国传统文化形象尚未找到同时获得大众和市场认可的表达形式。 这段文字意在强调（ ）。<\/p>", "a": ["<p>传统文化是国内文化产业繁荣发展的基础<\/p>", "<p>中国传统文化形象的价值亟待挖掘和开发<\/p>", "<p>国内主题乐园中的中西文化冲突一触即发<\/p>", "<p>国内创意产业园的建设普遍缺乏文化自信<\/p>", "", ""], "r": "B", "e": "【解析】文段首先指出我国创意产业园、主题乐园热衷于引进海外项目和复制国外文化形象，是缺乏民族文化自信的表现。接着指出缺乏对民族文化形象及其产品转换的兴趣是值得深思的问题。后文分析了这一问题产生的原因，即我国的传统文化形象还没有找到可以同时被大众和市场认可的表达形式。故文段意在强调中国传统文化形象需要被挖掘，对应B 项。\nA 项：文段未提及传统文化与国内文化产业繁荣发展间的关系，无中生有，排除。\nC 项：文段未提及“中西文化冲突”，无中生有，排除。\nD 项：属于问题表述，非文段重点，且文段强调的是我国传统文化形象面临的困境，而非国内创意产业园的建设问题，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46015", "t": 1, "q": "全社会要形成抵制网络不良信息的“防火墙”。网络文化产品直接面向社会公众，经营者是否违法经营，受众最先知道、最有发言权。对网络文化产业进行监管要依靠群众、发动群众。应健全群众举报体系，构建严密的社会监督网络，使网络文化产业发展中的违法行为无藏身之地；引导和教育广大网民增强鉴别能力，面对形形色色的网络文化产品保持清醒头脑，不受骗上当，不误入歧途；帮助网民提高自身道德修养，从思想上打造铜墙铁壁，自觉抵制通过网络传播的不良信息。\n这段文字意在强调（     ）。", "a": ["对网络文化产业进行监管要构建监督网络", "对网络文化产业进行监管要依靠群众力量", "网络文化产业经营者要自觉抵制不良信息", "网络文化产业经营者要主动接受群众监管", "", ""], "r": "B", "e": "【解析】文段开篇引出“抵制网络不良信息”这一话题，并指出受众对网络文化产品最有发言权，之后通过“要”提出对策，即“对网络文化产业进行监管要依靠群众、发动群众”。后文通过分号引导的并列结构围绕如何“依靠群众、发动群众”阐述了“健全群众举报体系”“引导和教育广大网民增强鉴别能力”“帮助网民提高自身道德修养”三方面具体内容。故文段重在强调对网络文化产业进行监管要依靠群众力量，对应B 项。\nA项：“构建监督网络”未体现“依靠群众”这一对策，偏离文段中心，排除。\nC 、D 两项：C 、D 两项的主体均为“网络文化产业经营者”，偏离“对网络文化\n产业进行监管”这一核心话题，排除。故正确答案为B。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46016", "t": 1, "q": "公共健身器材主要由政府采购、体育部门赠予、开发商自行购置后投放。按规定，受赠单位负责管理和日常维护并承担经费；各单位自行购置的则由各单位负责管理、维修和承担费用。规定很明确，但执行中常常出现各种盲区。首先，受赠方往往无配套资金，需要维修时也一问三不知；其次，日常使用和维护往往需要出厂厂家，然而对厂家缺少专门监管，厂家常常敷衍售后服务；最后，公共健身器材超出使用期，未明确拆除更换的责任方。公共健身器材的设置本是便民利民的好事，但好的出发点也要有完善的配套制度。健身器材建设好了，服务和管理工作也应跟上。\n这段文字意在强调（     ）。", "a": ["受赠单位疏于管理公共健身器材", "公共健身器材不能“重建轻管”", "维护管理公共健身器材存在盲区", "公共健身器材能让百姓切实受益", "", ""], "r": "B", "e": "【解析】文段开篇引出公共健身器材这一话题。接着具体介绍不同情况下负责管理维护公共健身器材的责任主体。随后通过转折关联词“但”指出问题，即执行中出现盲区，并通过“首先”“其次”“最后”从三方面分析问题。接着又通过转折关联词 “但”说明公共健身器材的设置缺少完善的配套制度。尾句则通过“应”提出对策，即要做好服务和管理工作。故文段意在强调对公共健身器材要做好服务和管理工作，\n对应B 项。\nA 项：“受赠单位”对应文段中“首先”之后的内容，为解释说明的部分，且“疏 于管理”为问题表述，非重点，排除。\nC项：“存在盲区”为问题表述，非重点，排除。\nD 项：“让百姓切实受益”对应文段中的“便民利民”，为转折前的内容，非重点， 排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46017", "t": 1, "q": "“互联网+”下的“荷尔蒙经济”，烧旺了网络直播产业。与 土豪粉丝一掷千金、千金买笑相伴的，是丑小鸭变天鹅、 一夜暴富的传说，让美女、靓仔、资本都趋之若鹜，但也应该在法律法规与道德伦理容许的范围内。度没把握好，问题就来了。网络直播从最初的“主要看气质”到今天的主要拼胆量，以“直播造人” 为标志，“无聊经济”“荷尔蒙经济”有低俗化、无耻化风险，受到公众诟病乃至法律惩戒是必然的。\n这段文字意在强调（     ）。", "a": ["网络直播面临的困局", "网络直播盛行的原因", "网络直播要自律更要他律", "网络直播的社会影响", "", ""], "r": "C", "e": "【解析】文段开篇论述当下网络直播盛行的现状。接着通过转折关联词“但”引出对策，即网络直播“应该在法律法规与道德伦理容许的范围内”。结尾通过反面论证进一步强调要把握好“度”，否则便会受到公众诟病乃至法律惩戒。故文段重在强调网络直播应加强约束，在法律与道德的范围内进行，对应C 项。\nA 项：“困局”为问题表述，而文段重在提出解决办法，非重点，排除。\nB 项：“原因”对应文段首句的内容，无法概括文段中心，排除。\nD 项：“影响”对应文段第二句的内容，无法概括文段中心，排除。\n故正确答案为 C。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46018", "t": 1, "q": "空气、水、土地，是人类赖以生存的三大必需条件。然而相对于大气污染和水环境污染，公众对土壤污染并不够重视，防治意识要弱很多。很大程度上是由于土壤污染具有隐蔽性、滞后性。雾霾来了我们能看到，河水变臭我们能闻到，可我们并不知道自己吃的大米、蔬菜是什么样的土里种出来的，含有什么不该有的元素。更可怕的是，土壤污染一旦发生便很难恢复，如果今年这片地里种出 的庄稼有毒，明年也必定带毒，若想恢复如初，需要付出巨大代价以及漫长时间。\n这段文字意在强调（     ）。", "a": ["土壤污染与其他生态污染有哪些不同", "公众应重视土壤污染并提高防治意识", "土壤污染危害的发现为何具有滞后性", "土壤污染治理应舍得投入时间和财力", "", ""], "r": "B", "e": "【解析】文段开篇指出空气、水、土地是人类生存的三大必需条件。接着通过转折关联词“然而”提出问题，即“公众对土壤污染并不够重视，防治意识要弱很多”。后文出现“由于”即分析问题的原因。故整个文段结构为“提出问题一分析问题”，B项“应重视土壤污染并提高防治意识”为针对文段问题提出的对策，当选。\nA项：“土壤污染与其他生态污染有哪些不同”并非文段重点，文段是要通过这些不同来引起公众对土壤污染的重视，排除。\nC 项：“为何”为分析原因的表述，非重点，文段重点谈论的是公众对土壤污染 的防治意识弱，而非“土壤污染危害”，且文段论述的是“土壤污染”自身具有滞后性，而非“土壤污染危害的发现”具有滞后性，排除。\nD 项：“投入时间和财力”文段并未提及，无中生有，排除。故正确答案为 B。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46019", "t": 1, "q": "过去几十年我们主要依靠引进外国技术实现发展，短期看这不失为加快经济发展的捷径，从长期看只靠引进是不行的，它会使我们与国外的技术差距越拉越大，将我们长期锁定在产业分工格局的低端。关键核心技术是要不来、买不来、讨不来的。为此，要加快推进国家重大科技专项，深入推进知识创新和技术创新，增强原始创新、集成创新和引进消化吸收再创新能力。\n这段文字意在说明（     ）。", "a": ["我国要不断提高自主创新能力", "我国要逐步掌握关键核心技术", "我国要依靠技术推动经济发展", "我国要减少对国外技术的依赖", "", ""], "r": "A", "e": "【解析】文段开篇指出我国与国外的技术差距变大的问题。随后指出关键核心技术靠引进是不行的。最后通过“为此”指代前文，进行总结，并通过对策引导词“要” 提出对策，即我国要深入推进创新，增强创新能力。故文段是“提出问题+解决问题”结构，尾句为文段重点，核心话题为“创新”，对应A 项。\nB 项：缺少主题词“创新”，且“核心技术”为对策之前的论述，非重点，排除。\nC 项：缺少主题词“创新”，且“依靠技术推动经济发展”对应文段开篇的论述，非重点，排除。\nD 项：缺少主题词“创新”，且“减少对国外技术的依赖”表述不明确，文段已明确表明要靠创新实现发展，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46020", "t": 1, "q": "观照历史上多次出现过的媒介融合的进程结果，媒介材料的 变更，绝不等于思想生活变现，正如汉字生产的主线，也绝不会因为纸张代替了简牍 而出现颠覆性变化一样。事实上，简牍的汉字同纸张的汉字，并无太大差别，顶多只是字体有些不同而已。不可否认媒介变化肯定会带来表达的不同，如新近出现的网言网语，肯定是互联网语境下的表达产物。但无论媒介技术怎样发展变化，任何文明主干、任何文化血脉，都是一以贯之的。\n这段文字意在强调（     ）。", "a": ["正确认识媒介革命的特殊性与普遍性，重视传统文化的传承", "媒介革命不仅涉及媒介技术，还关乎人们的思想观念等问题", "借鉴历史上简牍与纸张之媒介融合的经验，推动新媒介融合", "媒介革命必定改变人们观念，助力社会进步和提升文明层次", "", ""], "r": "A", "e": "【解析】文段首句指出媒介材料的变更不等于思想生活变现，并通过“正如”引导的纸张代替简牍没有改变汉字生产的主线的例子，论证了媒介材料变更不等于思想发生改变。接着通过“事实上”进一步说明了简牍和纸张上的汉字没有太大差别。然后论述媒介变化确实会带来表达的不同。最后通过转折关联词“但”强调无论媒介技术怎么变，都不会改变文明和文化。故文段重点在尾句，强调媒介革命会带来多种情况，但不变的是文明和文化。A 项是文段重点的同义替换，当选。\nB项：仅对应文段首句，非重点，排除。\nC项：缺乏主题词“媒介革命”，偏离文段核心话题，排除。\nD 项：“必定改变”与文意相悖，且“助力社会进步和提升文明层次”无中生有，排除。\n故正确答案为A.", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46021", "t": 1, "q": "实施全面的急诊分级制度，技术层面的储备早已完成，关键还是靠患者的认同与服从。相对于“先到先得”的机械公平，按照病情轻重排序，显然是一种更复杂的公平规则。医护人员需要不断加以说服引导并进行医学常识科普，才能让患者理解其中的道理。就诊秩序、医疗效率，从来都与患者群体的科学素养和规则意识密切相关。倘若患者还是只信赖“先到先得”，急诊分级最终多半会 不了了之。可以想见，急诊科所面临的许多问题，根源其实都在急诊科之外，这意味着急诊分级制度的推行难度比想象中还要大。\n这段文字意在强调，急诊分级制度的全面实施（     ）。", "a": ["建立在患者理解认可的基础上", "应以更公平规则的确立为前提", "有助于医疗效率的大幅提高", "有赖于医学常识的广泛普及", "", ""], "r": "A", "e": "【解析】文段首先通过程度词“关键”强调实施全面的“急诊分级制度”要靠患者的认同与服从。接着指出按病情轻重排序的规则更公平，医护人员需要不断说服患者，让其理解其中的道理。之后介绍就诊秩序等也与患者群体的科学素养和规则意识紧密相关，即从正面论证了患者的认同对“急诊分级制度”实现的重要性。随后通过反面论证强调若患者不认同，则无法实施“急诊分级制度”。最后再次强调“急诊科所面临的许多问题，根源其实都在急诊科之外”，即需要患者理解与认同。故文段重在强调“急诊分级制度”的全面实施要靠患者的理解和认同，对应A 项。\nB 项：“更公平规则”对应“按照病情轻重排序，显然是一种更复杂的公平规则”，为后文解释说明的内容，非文段重点，排除。\nC 项：“有助于医疗效率的大幅提高”文段并未提及，无中生有，排除。\nD项：“医学常识”概念扩大，文段强调的是“急诊分级制度”，且该项缺少主题词“患者”，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46022", "t": 1, "q": "贫困有时不仅是收入低下，还是能力匮乏。能力的根本是素质。文明也是一种素质，而且是更重要的素质。“贫困文化”的研究者早就提出，不但要关注穷人的生活状态，而且要关注他们的价值观念、生活态度和行为模式。这种 “亚文化”一旦形成，就会影响他们改变贫困的状况，而且会代代相传使贫困维持下去。中华民国乡村建设运动的先驱晏阳初先生，就认定乡村建设的根本之策在于治理 “愚、贫、弱、私”，以培养农民的知识力、生产力、强健力和团结力。\n这段文字意在说明（     ）。", "a": ["国民素质的提高根本在于文明的发展", "要大力提升贫困群众的发展能力", "个人能力发展的根本是文明素质", "提升贫困群众的文明素质意义重大", "", ""], "r": "D", "e": "【解析】文段开篇提到，贫困是因为能力匮乏，而能力的根本在于素质。随后通过递进关联词“而且”强调文明是更为重要的素质。接着通过“贫困文化”研究者及晏阳初先生对乡村建设的观点进一步详细说明，强调提升文明素质的重要性。故文段重点强调的是提高文明素质对于贫困人群而言非常重要，对应D 项。\nA项：“国民素质”范围过大，文段讨论的是“贫困群众的文明素质”，且“文明的发展”在文段中没有体现，排除。\nB项：“发展能力”表述不明确，没有体现“文明素质”这一主题词，排除。\nC 项：“个人能力”范围过大，文段强调的是“贫困群众”，排除。故正确答案为D。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46023", "t": 1, "q": "重大疫情面前，及时发布权威信息，公开透明回应群众关切，能够有效解决信息不对称的问题，压减谣言等虚假信息传播空间，更好地维护社会大局稳定。一段时间以来，有关部门和相关机构及时发布确诊、疑似、治愈和病亡人员数据，一些互联网企业运用大数据、云计算、可视化技术，推出“实时疫情动态”“疫情地图”“同乘患者查询系统”“发热门诊地图”等产品，同步普及科学防护知识，有效满足了民众的信息需求，引导群众理性看待疫情，增强自我防范意识和防护能力。\n这段文字意在强调（     ）。", "a": ["信息公开透明有助于疫情防护", "利用技术手段增强自我防护能力", "利用技术手段普及科学防护知识", "信息公开透明满足了人民信息需求", "", ""], "r": "A", "e": "【解析】文段开门见山提出对策“及时发布权威信息，公开透明回应群众关切” 并阐述该对策带来的意义。接着列举“有关部门和相关机构”以及“一些互联网企业” 的具体事例进行解释说明。故整个文段为“总—分”结构，首句的对策句即为中心句，对应A 项。\nB 、C 两项：“利用技术手段”是后文分述句的内容，非重点，排除。\nD 项：“信息公开透明”是为了有效引导群众抗击疫情，该项缺少文段主题词“疫情”，排除。\n故正确答案为A.", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46024", "t": 1, "q": "农村社区化建设目前尚处于探索阶段。“村改居”是 城镇化发展的具体表现，也是公共服务向农村社区延伸、让农民共享改革发展成果的 必然要求。长期以来，城乡二元结构导致城市与农村割裂发展，农村地区发展滞后， 公共服务能力薄弱。在城镇化大潮中的“村改居”，就是要打破城乡分治的制度藩篱，因地制宜地让农民也能享受到和城里人一样的社会保障和公共服务。各地经济发展水 平不一、农民对公共服务的要求各异，这就决定了“村改居”的路径、公共服务的提供种类和农村社区的保障水平等必然“因村而异”。\n这段文字意在强调（     ）。", "a": ["“村改居”是农村社区化建设的有益探索", "“村改居”顺利推进的要领在于因地制宜", "城乡共享公共服务是农村发展的关键一步", "打破城乡二元界限才能促进城镇化的发展", "", ""], "r": "B", "e": "【解析】文段首先指出农村社区化建设处于探索阶段。接着介绍了“村改居”的 意义。后文指出城乡二元结构导致农村地区公共服务能力薄弱，而“村改居”就是要 让农民能够享受到和城里人一样的社会保障和公共服务。尾句通过指代词“这”引出 结论，强调“村改居”要“因村而异”。故文段重在强调“村改居”要根据各地不同的情况采取有差异的方式，对应B 项。\nA 项：对应文段首句内容，文段重点在于尾句指代词“这”总结上文引出的结论，故首句内容非重点，排除。\nC 、D 两项：均未出现文段主题词“村改居”，偏离文段中心，文段重在阐述“村改居”要因地制宜，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46025", "t": 1, "q": "在日益现代化的时代，数字化全智能工业和目前的大工业是社会发展最仰赖的生产力，手工艺作为人类古老的生产、生活方式也能发挥它的经济辅助作用，但它的文化功能意义将日益凸显。类似于精神乌托邦的不可或缺，手工艺的存在将给现代人提供复归淳朴人性、回望人类童年的机会，传统工艺的振兴也将开启现代生活与文化创造的新境。\n这段文字意在强调（     ）。", "a": ["手工艺能够对经济发展起到辅助作用", "现代社会手工艺生产方式是不可或缺的", "文化创造与传统手工艺有着密切的关系", "手工艺的存在更在于其文化功能意义", "", ""], "r": "D", "e": "【解析】文段开篇引出话题，说明在数字化的工业时代，手工艺也能发挥自身的经济作用，并通过转折关联词“但”强调手工艺的文化功能日益凸显。后文介绍了手工艺存在的文化功能有哪些。故文段的重点在转折之后，即手工艺的存在更在于它的文化功能，对应D 项。\nA项：“对经济发展起到辅助作用”对应转折之前的内容，非重点，排除。\nB 项：“手工艺生产方式是不可或缺的”表述不明确，该项没有强调其“文化功能”，与文意不符，排除。\nC 项：“文化创造”非重点，且表述片面，仅对应文段“文化功能”的一方面，与文意不符，排除。\n故正确答案为 D。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46026", "t": 1, "q": "很多人认为，艺术创作是对自然或社会的观察与模仿，但在某些艺术史家看来，艺术家的创作其实是对传统与风格的修改和调整，是不断制作与匹配“图式”的过程。无论是意大利文艺复兴对古希腊罗马精神的再现，还是中国宋元文人画对老庄哲学的追随，都是如此。艺术家在准备好想要处理的题材之前，脑海里必然存在某些已知的图式，这些图式是过去艺术家们的成果；艺术家在画布或画纸上开始描绘时，就像置身在一个“镜子厅”或“回音廊”，旧的图式被不断唤起，题材的意义在特定的视觉秩序中，以新的图式再次展现。\n这段文字意在强调（     ）。", "a": ["艺术创新是无中生有的过程", "艺术作品间的相似缘于模仿借鉴", "艺术创作离不开已有的传统", "古典艺术作品是艺术创作的源泉", "", ""], "r": "C", "e": "【解析】文段开篇通过“很多人认为”引出他人的观点，即艺术创作是观察和模 仿，紧接着通过转折关联词“但”强调“艺术家的创作其实是对传统与风格的修改和 调整”。后文通过“意大利文艺复兴”和“中国宋元文人画”进行举例论证，同时又 通过艺术家从准备到开始作画的整个过程来论证文段的观点。故文段重点强调艺术家的创作是对传统与风格的修改和调整，即“离不开已有的传统”，对应C 项。\nA 项：文段强调的是“艺术家的创作其实是对传统与风格的修改和调整，是不断制作与匹配‘图式’的过程”，并非“无中生有的过程”，与文意相悖，排除。\nB 项：文段重点论述的是“艺术创作”，而非“艺术作品”，主题词错误，且文段并未分析艺术作品相似的原因，排除。\nD 项：“古典艺术作品”仅是“已有的传统”当中的一个方面，且“艺术创作的源泉”文段未提及，无中生有，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}, {"id": "46027", "t": 1, "q": "研究表明，语言不仅仅是人们用以交际的工具，也不仅仅 是相关文化的载体，还是人类社会的认同源泉和认知机制，是文化的生命。语言一旦失落，文化即无法继续生存和发展。 一如语言，不同文化之间的相互接触，促使不同文化共同发展繁荣，它们之间相互改造相安共存。所以，多元文化格局是人类社会持续发展所依赖的良性文化生态。语言不断灭亡，文化生态便不断遭受破坏。诚如一位学者所言：如果有一天生活在地球上的人们只说一种语言的话，那么，这个世界就走到了尽头。\n这段文字意在强调（     ）。", "a": ["人类社会的形成与发展依赖于语言的产生", "语言生态状况对文化生态状况有重要影响", "语言多样化对社会持续发展具有重要意义", "语言的民族性依赖于世界文化的多元格局", "", ""], "r": "C", "e": "【解析】文段首先通过“不仅仅是……也不仅仅是……还是……”论述了语言的 重要性，并通过反面论证突出语言对于文化的重要意义；接下来指出不同文化之间的 “相互接触”促进文化繁荣；继而通过“所以”引导结论：多元文化格局是人类社会持续发展的基础，而语言灭亡就意味着多元文化生态遭受破坏，即语言多样化直接影响到社会持续发展；尾句通过学者的话来论证语言多样化对于世界持续发展的重要性。故文段意在强调语言多样化对于社会持续发展的重要意义，对应C 项。\nA 项：“人类社会的形成”文段中并未提及，无中生有，且“依赖于”表述过于绝对，排除。\nB 项：偏离文段核心话题“语言多样化”，且文段重在论述语言多样化对于社会持续发展的重要意义，而非单纯讨论语言对文化的影响，排除。\nD 项：“民族性”文段中并未提及，无中生有，排除。故正确答案为C。", "l3": "一般能力", "l4": "1.2节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.3节", "n": "一般能力 / 1.3节", "qs": [{"id": "46053", "t": 1, "q": "看来，不只是贵族有偏见，平民也自有平民的偏见。这种偏见就是看不见每个人都应该享有人之为人的尊严和独自为人的权利。由于我们在这方面迷失太久，今天，无论是尊重自己的权利，还是尊重他者的权利，都需要经过艰苦的学习。我们要早一天学会这些东西才好。只有先学会了尊重自己和尊重他者，我们才能开始学习有尊严地生活，我们才能尊严地生活在这片大地上。\n这段话主要支持的观点是（     ）。", "a": ["尊重自己和尊重他人是自己获得尊严的前提", "不论贵族或平民，都有得到别人尊重的权利", "先尊重自己，还是先尊重他人，困扰着世人", "当今很多人都不会尊重别人，只知索取尊重", "", ""], "r": "A", "e": "【解析】文段首先说明了由于长期存在偏见，我们需要经过艰苦的学习才能学会尊重自己的权利和尊重他人的权利，然后指出只有学会这两点，我们才能有尊严地生活。由此可知，作者想要说明的是我们应该学会尊重自己和他人。故A项为正确答案。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46054", "t": 1, "q": "中国的专利申请平均每年以48%的速度增长。中国的专利实施只占专利总量的20%～30%，与国外达80%的实施率相比，专利差距很大。在中国专利申报总量中只有15%来自于企业，而发达国家的专利申请80%来自于企业。\n这段话支持了这样一种观点，即（     ）。", "a": ["中国科技创新进步势头迅猛", "中国的科技创新不仅要注重开发研究，更要加强推广和实施科技成果", "中国科技创新水平与国外相比差距很大", "中国企业不像科研院所和高校那样重视科技创新活动", "", ""], "r": "B", "e": "【解析】文段中出现了多个百分数。分析这些数字，我们可得到如下一些信息：“48%”表明我国专利的研发速度很快。20%~30%和80%与15%和80%的对比则说明，我国专利的实施率较低。综观四个选项，A项只表述了文段一个方面的内容;文中说的是中国的专利实施率低，而不是中国科技创新水平与国外差距很大，C项错误;文段没有对比中国企业与科研院所和高校在重视科技创新活动方面的不同，D项错误。故正确答案为B。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46055", "t": 1, "q": "孔子尝曰：“未知生，焉知死?”生与死自孔子时起便是中国人始终关注的问题，并得到各种回答。尤其在汉代，人们以空前的热情讨论这两个问题，不仅是出于学者的学术乐趣，亦出于普通民众生存的需要。然而，正如孔子所说，在中国思想史上，对生的问题的关注似乎远胜于对死的问题的追问。有时候人们确实觉得后者更重要，但这并非由于死本身，而是因为人们最终分析认为，死是生的延续。\n这段文字的核心观点是（     ）。", "a": ["孔子关于生死的看法对中国人产生深远影响", "生与死是中国思想史上长期受到关注的问题", "中国人对生与死的问题的讨论实际以生为旨归", "对生死问题的不同答案源自讨论者的不同观念", "", ""], "r": "C", "e": "【解析】A.D两项引申超过限度。A项说明孔子关于生死看法的深远影响，D项探讨对生死问题有不同答案的深层原因，这些在文中均不曾涉及，属过度引申。B项仅着眼于对文段第一句的理解，概括不够全面。C项点明了中国人对生死的问题的关注实际以生为旨归这一论点，当选。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46056", "t": 1, "q": "在天气、土壤、水域、生物受到严重污染的城市、工矿区以及河流与沿海地带多为各种环境性疾病的发病区。当代城市的“三废”污染与支气管炎、肺气肿、肺癌、食道癌、胃癌和心血管疾病的发病率有着密切的关系。    \n这段话主要支持了这样一种观点，即（     ）。", "a": ["沿海地带多为环境性疾病的发病区", "环境污染严重地威胁着人类的健康", "支气管炎是由“三废”污染引起的", "食道癌、肠癌、胃癌和心血管病的发病率与城市的“三废”污染有着密切的关系", "", ""], "r": "B", "e": "【解析】文段主要谈的是环境污染与人类健康的联系。A项中“沿海地带”不是文段谈论的主要观点；C项中“支气管炎”只是文段谈及的一种疾病；D顾只是文段的一个例证。ACD三项表述片面，不选。故本题正确答案选B。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46057", "t": 1, "q": "总会有些人是白手起家，总会有些人崛起于社会的底层，总会有些传奇人物从生命的低谷爬上了事业的高峰。所以有一句长盛不衰的励志口号叫：苦难成就人生。可是，我们不要忘了，泯灭于苦难之中的人何其多，升起的永远是佼佼者。苦难常常只是性格的催化剂，它使强者更强，弱者更弱，智者更智，愚者更愚。　\n作者对苦难的看法是（     ）。", "a": ["苦难能够改变命运", "苦难能够保持生命的热忱", "苦难决定人的性格", "苦难并不能成就人生", "", ""], "r": "D", "e": "【解析】文段前半句列举了很多历经苦难取得成功的人的经历，并且得出“苦难成就人生”这一结论。接着通过转折关联词“可是”带出了自己的观点，即不同于前者结论的相反观点“苦难常常只是性格的催化剂”。可见，在作者看来，“苦难并不能成就人生”，成就人生更需要的是人的性格。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46058", "t": 1, "q": "在中国，也许不是每位老人都能接受养老院作为人生的归宿，好像只要有儿女在身边就应该和他们住在一起，去养老院是无奈的选择。说来也是，我们不是一直说“养儿防老”吗?在我们的观念里几代同堂、儿孙绕膝恐怕被公认为颐养天年最幸福的生活方式。加拿大的生活情形却截然不同：只要孩子一成年便搬出去，即使不搬家也要向父母缴纳房租，从此两辈人各过各的日子。一旦当上了爷爷奶奶，老人们那股欢喜激动劲虽然绝不比我们中国人抱上孙子的心情逊色半分，可即使闲得再难受，他们也不会每天从早到晚帮儿女带孙辈的。\n从这段文字可以看出，作者对中加老人的养老观念的态度是（     ）。", "a": ["赞成中国老人的养老观念", "赞成加拿大老人的养老观", "对中加老人的养老观念都赞成", "对中加老人的养老观念都不赞成", "", ""], "r": "B", "e": "【解析】第一步，分析文段。文段先讲了中国老人的养老观念，然后通过“却截然不同”引出“加拿大老人的养老观念”，加拿大老人有自己的生活，通过“那股欢喜激动劲绝不比中国人逊色半分”，将加拿大老人的养老观念与中国老人的养老观念进行对比，作者是赞同加拿大老人的养老观念。第二步，对比选项。B项符合文意，体现出作者的观点。因此，选择B选项。A项、C项和D项：与作者观点相悖，作者的观点是“赞成加拿大老人养老观念”“不赞成中国老人养老观念”。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46059", "t": 1, "q": "推动戴口罩“入法”需防范执行难的问题。倘若戴口罩仅属于文明倡导，是否执行全凭自觉，就会显得刚性不足;倘若戴口罩“入法”的处罚过于严厉，又容易导致过犹不及。若能引导在先、首违免罚、罚则较轻、屡违重罚，刚性的法规就具备了更强的柔性约束力，从而做到刚柔并济。\n关于戴口罩“入法”，作者的态度是（     ）。", "a": ["无条件地支持", "有条件地支持", "未置可否", "坚决反对", "", ""], "r": "B", "e": "【解析】文段开篇指出“推动戴口罩‘入法’”需防范执行难的问题，随后分别从“文明倡导”和“处罚过于严厉”两个方面对问题展开进一步的分析，尾句提出对策，指出如果能够给戴口罩“入法”设置一些条件，刚性的法规就具备了更强的柔性约束力，从而刚柔并济，解决戴口罩“入法”执行难的问题，由此可知，作者对于戴口罩“入法”的态度是有条件地支持，对应B项\n　　A项“无条件地支持”、D项“坚决反对”均与作者态度相悖，排除;\n　　C项，“未置可否”强调未明确表态，而文中作者已经给出明确的态度，即戴口罩“入法”需要有一定条件支撑，与文意不符，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46060", "t": 1, "q": "移动终端的普及使得内容生产拥有众多节点，短视频生产助长了开放式、扁平式的去中心传播格局。移动终端的发展释放了大众民意，传统主流意识形态传播的身份和议题设置权被进一步削弱。内容生产与分发呈现“千人千面”的局面，用户个性化需求得到满足，不断激发民众在内容生产上创新，视频内容及题材表达由理论性、严肃性、注重内容建设，向碎片化、生活化、注重视听效果转化，多元社会思潮成为意识形态传播的重要变量，网络舆论的众声喧哗成为网络内容生产新常态，内容供给呈现去中心化趋势。\n作者不可能赞同下列（     ）观点。", "a": ["短视频会以泛娱乐表达削弱主流话语的严肃性", "立体交互传播方式将挑战网络意识形态管控力", "移动终端的普及有助于受众获得更清晰的自我意识", "网络空间中公众的情绪表达形式更加多元化", "", ""], "r": "C", "e": "【解析】A项，根据“移动终端的发展释放了大众民意，传统主流意识形态传播的身份和议题设置权被进一步削弱”及“视频内容及题材表达由理论性、严肃性、注重内容建设，向碎片化、生活化、注重视听效果转化”可知，“主流话语的严肃性”确实会被削弱，表述正确，排除;\n　B项，根据“多元社会思潮成为意识形态传播的重要变量，网络舆论的众声喧哗成为网络内容生产新常态”可知，网络意识及网络舆论多元化成为常态，故“立体交互传播方式将挑战网络意识形态管控力”表述正确，排除;\n　　C项，“受众获得更清晰的自我意识”文段未提及，无中生有，当选;\n　　D项，根据“内容生产与分发呈现‘千人千面’的局面······视频内容及题材表达······向碎片化、生活化、注重视听效果转化”及“网络舆论的众声喧哗成为网络内容生产新常态”可知，表述正确，排除。\n本题为选非题，故正确答案为C。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46061", "t": 1, "q": "在高空气球技术取得进展的同时，航空和航天技术也迎来了飞速发展时期。在大气层内，飞机是更便捷的飞行工具，而对于那些需要在大气层之上进行的科学研究，卫星提供了更加理想的环境。然而，高空气球这种历久弥新的工具却没有走出人们的视野，目前仍然是重要的科学研究工具。\n这段文字的核心观点是（     ）。", "a": ["高空气球在科学研究中有独特优势", "高空气球比飞机和卫星更重要", "古老的高空气球仍在不断发展", "高空气球可用作科学观测平台", "", ""], "r": "A", "e": "【解析】文段开篇指出在高空气球技术发展的同时，航空和航天技术也在发展，随后通过“飞机”和“卫星”具体介绍了航空航天技术的发展应用，尾句“然而”引导转折，强调高空气球依然是重要的科学研究工具，对应A项。\n　　B项，“比飞机和卫星更重要”文段并未提及，无关对比，排除;\n　　C项，“高空气球仍在不断发展”对应文段首句，为话题引入部分的内容，非重点，排除;\n　　D项，“科学观测平台”文段并未提及，无中生有，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46062", "t": 1, "q": "数字化阅读丰富了我们的文化生活，已经成为重要的阅读方式之一，也成为当下很多人尤其是年轻人学习知识和获取信息的重要途径。然而，与传统阅读方式相比，数字化阅读华丽的外表下面，却有一种触手可知的冰冷感。古人讲开卷有益，但当开卷变成了开机，当纸张变成了按键，当厚重的二十四史变成了电脑里一个小小文档，我们又该何处寻找开卷阅读的乐趣呢?\n作者对数字化阅读的态度是（     ）。", "a": ["肯定性", "否定性", "批判性", "怀疑性", "", ""], "r": "C", "e": "【解析】这道题目是隐含作者观点的类型。作者通过转折词“然而”引出关键句，“数字化阅读华丽的外表下面，却有一种触手可知的冰冷感”，由此可知作者对数字化阅读持批判的态度，作者并不认同数字化阅读的实质。末尾“我们又该如何寻找开卷阅读的乐趣呢?”再次用疑问形式强化了批判的态度，因此选C", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46063", "t": 1, "q": "水能开发除具有发电、供水等直接效益外，还可以大大缓解当地群众衣食住行对自然生态环境的巨大压力，为实现农村劳动力大规模地转移创造必要的条件，还可以促进旅游、矿业等行业的发展。总之，合理的水能开发是改变地区贫困面貌、促进流域经济社会可持续发展以及保护流域生态环境的重要举措。\n作者想表达的观点是（     ）。", "a": ["水能开发除了产生直接效益外，还会产生其他间接效益", "水能开发可促进旅游、矿业行业的发展", "水能开发产生的间接效益明显大于其直接效益", "要合理开发利用水能资源，以促进经济发展，保护生态环境", "", ""], "r": "D", "e": "【解析】文段开篇通过关联词“除······还······”介绍水能开发的“直接效益”和“间接效益”，尾句通过结论词“总之”总结前文，并以“重要举措”提出对策，强调应进行合理的水能开发。故文段为“分-总”结构，重点在总句对策上，对应D项。\n　　A项，“产生直接效益外，还会产生其他间接效益”对应文段首句，为分述句内容，非重点，排除;\n　　B项，“促进旅游、矿业行业的发展”对应水能开发的间接效益，表述片面且非重点，排除;\n　　C项，“间接效益大于直接效益”文段未提及，无关对比，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46064", "t": 1, "q": "翻译时，“直译”偏重于对原文的忠实，“意译”偏重于译文语气的顺畅。哪种译法最妥当，人们各执己见。依我看，直译和意译的分别根本不应存在。忠实的翻译必定能尽量表达原文的意思。思想感情与语言是一致的，相随而变的，一个意思只有一个精确的说法，换一个说法，意味就完全不同。所以想尽量表达原文的意思，必须尽量保持原文的语句组织。因此，直译不能不是意译，而意译也不能不是直译。\n这段文字中，作者认为（     ）。", "a": ["应随原文意思灵活选择翻译方法", "忠实于原文思想是翻译的最高艺术", "人为划分直译、意译本无必要", "翻译时应尽量减少译者个人风格的影响", "", ""], "r": "C", "e": "【解析】文段第二行直接出现“依我看……”作者观点就是：直译和意译的分别根本不应存在。同意替换就是C项。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46065", "t": 1, "q": "对后现代文化有一种概括，就是：中心变成了边缘，系统变成了断裂，整体变成了碎片，深度变成了平面，价值变成了虚无。在后现代艺术中，复制取代了原创，操作取代了想像，破碎取代了整体，取代了作品。艺术形象完全变成了模型的模型、模仿的模仿。\n这段文字反映出作者对后现代文化的态度是（     ）。", "a": ["欣然认同", "不能接受", "勉强接受", "不置可否", "", ""], "r": "B", "e": "【解析】文段未出现作者明确的态度，但是从行文描述后现代文化的词，如：“边缘、断裂、碎片……”等词，我们可以知道作者对后现代文化持反对意见。选B", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46066", "t": 1, "q": "一段时间以来，居民消费价格持续上涨，突破了通常被认为是“警戒线 ”的3%以后，更成为舆论和民情关注的热点。原因很简单———物价上涨关系到每一个消费者的切身利益，影响着相当一部分普通百姓的日常生活，并且可能给低收入家庭带来沉重压力。因此，对物价上涨不能掉以轻心。\n这段文字支持的观点是（     ）。", "a": ["物价上涨会损害到每一位百姓的切身利益", "普通百姓无法左右物价是否上涨，因此无需过多关心", "低收入家庭在物价上涨后必然会受到巨大的冲击", "物价上涨事关百姓利益，不能掉以轻心", "", ""], "r": "D", "e": "【解析】文段根据“因此，对物价上涨不能掉以轻心”一句可以得出，文段重点强调的观点即为 D项“不能对物价上涨掉以轻心”。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46067", "t": 1, "q": "今日日本，学生们最钟情的“考试服”的颜色是藏青色。学生们认为，藏青色是“吉祥色”，有助于考出高分。心理学家也认为，藏青色有助于稳定情绪，对发挥水平起积极作用。而校方说，要考好主要靠水平，与服装颜色无关。现考生们仍对藏青色“考试服”一往情深。每年考试前藏青色“考试服”都热销。\n作者认为藏青色“考试服”的时兴有无科学道理（     ）。", "a": ["作者并未评论", "有道理，因为藏青色是“吉祥色”", "有道理，因为藏青色有助于稳定情", "没道理，因为考试成绩与服装颜色无关", "", ""], "r": "A", "e": "【解析】文段中有学生、心理学家、校方对“考试服”的态度，但是没有作者的态度。因此仅是在援引他人的观点。选A。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46068", "t": 1, "q": "随着经济的发展，我国的教育投入正在逐年增加，全民的教育程度也在日益提高。然而遗憾的是，在一定条件教育成本往往与质量没有必然的关系。\n符合作者原意的一项是（     ）。", "a": ["<p>作者认为教育成本与质量没有关系<\/p>", "<p>作者感到教育质量不能提高很遗憾<\/p>", "<p>作者反对教育成本增高<\/p>", "<p>作者认为教育投入多并不保证一定取得好的成果<\/p>", "", ""], "r": "D", "e": "【解析】一道典型的态度观点题。文段难度不高，短短一句话提出作者的观点，解题的关键在于考生要把握作者隐含在语句背后的态度倾向性，重点语句在转折之后，即“然而遗憾的是.在一定条件教育成本往往与质量没有必然的关系”，换言之既然没有必然关系，那么导致的结果有可能是即使投入很多，也不见得一定会取得好的效果，D项是原文作者观点的同义替换，因此为正确答案。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46069", "t": 1, "q": "有时候律师的辩护很可能开脱了凶手，有损公共道德，但他们“完美”的法律服务没错。因为法治之法是中性的，它超越道德;而“平等对抗”的诉讼程序，须保证被告人享有他所购买的一切法律服务。即使被告人真是凶手，律师帮他胜诉获释，正义受挫，从法制“程序之治”的长远利益来看，这也还是值得的，失败了的正义可在本案之外。\n这个文段中作者认为（     ）。", "a": ["法制与道德是相互对立的", "在一个单一的案件中找不到正义", "维护法制程序的意义大于一时的伸张正义", "为了保证法制程序的实施，律师常常不得已而为之", "", ""], "r": "C", "e": "【解析】一道典型的态度观点题。整个文段都是在阐述作者的具体观点。解题的关键在于把握整个文段的倾向性，通过阅读可以发现首句用“但”这一转折词奠定了作者论述的基调“他们‘完美，的法律服务没错”，尾句又重申了作者的倾向性“从法制‘程序之治’的长远利益来看，这也还是值得的”。因此可以判断作者在整个文段中的倾向性是偏向积极的，而备选项中只有C项与这种倾向性相符，因此C项为正确答案。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46070", "t": 1, "q": "美国常驻联合国代表博尔顿说，美国从没接受过任何“地区轮任”的观点，而希望最合适、最有能力胜任的候选人当选，不论他(她)来自哪个地区。\n美国对联合国在确定秘书长人选问题上形成的“地区轮任原则”所持态度是（     ）。", "a": ["不认同", "认同", "没有明说", "不知道", "", ""], "r": "A", "e": "【解析】一道典型的态度观点题，提问方式为“所持态度”，题目难度较低。通常“×××说”就是明确引导观点的引导词，题目要求的是美国针对“地区轮任原则”所持态度是否认同，而原文中明确指出“美国从没接受过任何‘地区轮任，的观点”，即不认同，而且在文段的下一句还对此进行了进一步的阐释说明“希望最合适、最有能力胜任的候选人当选，不论他(她)来自哪个地区”，因此正确答案为A项。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46071", "t": 1, "q": "专家们对农作物的生产加工应用生物基因技术，反应不一。大部分专家认同一个严肃的想法：发展基因改良植物与“长期但确实的风险”相关。\n下列观点，与大部分专家”态度明显不一致的是（     ）。", "a": ["不能因转基因食品尚未出现严重负面影响，就说它无害", "考虑基因改良植物的负面影响，是没有什么根据的", "在还没有科学公断时，不应告诉大家某一技术是安全的", "呼吁暂缓转基因作物在大范围内种植，是有理由的", "", ""], "r": "B", "e": "【解析】一道典型的态度观点题。该文段难度不高，十分明确地提出了“大部分专家”的观点：“基因改良植物存在长期且确实的风险。”可见大部分专家对于基因改良植物的态度还是较为谨慎的，而A项、C项、D项与原文的这种态度倾向性吻合。但是B项恰好是与原文态度截然相反，认为基因改良植物没有风险，因此B项应该是正确答案。回到选项之中，由于考试的题目设置上均属于四选一的客观唯一答案，题中的A.C.D三个选项其态度在倾向性上保持一致，则意味着三个选项都不能纳入备选答案。因此通过这种方式也可以将A.C.D三个选项予以排除，再一次使用到了“排同法”。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46072", "t": 1, "q": "中国的家庭教育是，父母千方百计把自己的孩子培养成和他们一样的人，遗憾的是，他们成功了。\n作者认为中国的家庭教育成功了吗?（     ）", "a": ["成功", "不成功", "对成功与不成功不置可否", "无关紧要", "", ""], "r": "B", "e": "【解析】一道典型的态度观点题。与例8难度保持一致，短短一句话提出作者观点，解题的关键在于把握住表示倾向性的语句，即“遗憾的是”所引导的一句“他们成功了”，实际上是一种反讽的态度，因此作者对于中国的家庭教育是持否定态度的，因而选择B项。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46073", "t": 1, "q": "从1901年到1961年，诺贝尔文学奖几乎完全为欧美白人垄断;60年代以后亚、非、拉美作家居多数;90年代则完全没有欧美白人作家获奖。而60年代以后正是欧美科学技术突飞猛进的时代。这是否意味着科学技术的发展会使文学作品失去人文魅力?\n这段话作者表达的观点即（     ）。", "a": ["科技高度发展可能使文学中的人文精神走向浅薄", "不排除技术和科学的干扰，就没有优秀文学作品", "真正优秀的文学作品产生在落后的国家和地区", "科技发展是以文学作品丧失人文魅力为代价的", "", ""], "r": "A", "e": "【解析】一道典型的态度观点题。文段是一个典型的分一总式结构，通过列举种种例子，从而引出作者观点，考生阅读之时要重点把握例子之后表示观点的语句。文段首先列举了一系列文坛现状，目的在于弓1出最后一句的疑问，即“是否意味着科学技术的发展会使文学作品失去人文魅力”，也就是本文作者表达的观点。首先考生在处理这句话时要把握住作者的态度，事实上作者在此并没有非常绝对地表述是与否，而是用一种疑问的口吻引发读者的思索。但是同时考生也要注意这句话是带有倾向性的，换言之作者认为科技发展可能会使文学作品失去人文魅力，因为根据前面列举的例子我们可以判断出作者的这种倾向性。综上所述，把握了作者的观点后再进行选项的辨识。A项的“可能”恰好是一个中性化的表述，未置可否，且其倾向性与原文观点的倾向性也相符合，因此A项正确。\n【纠错】有些考生会选择B.D两项，然而根据分析可知原文“可能”表述的是一种不确定的态度，而B.D两项的表述过于肯定绝对，因此与原文含义不符，予以排除。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46074", "t": 1, "q": "在她走马上任时，全球第一所“孔子学院”在韩国首尔刚刚挂牌。而到2008年初， 已有210多所“孔子学院”在60多个国家相继建立。此时，距离提出在全球建立100 所“孔子学院”的五年目标，刚刚过去三年。 \n这段话的主要观点是（     ）。", "a": ["她上任后，工作业绩显著", "近年来，孔子学院发展迅速", "她上任后，孔子学院发展迅速", "孔子学院超规划发展", "", ""], "r": "C", "e": "【解析】文段中提到她走马上任时，第一所“孔子学院”刚刚挂牌，2008年初，用了三年的时间完成了远超五年目标的任务，在全球60多个国家相继建立了210多所“孔子学院”，由此可知，她上任后，孔子学院发展迅速。所以答案为C项。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46075", "t": 1, "q": "在一些地区的城市化发展过程中，由于劳动密集型企业和私营企业的过度发展，使城镇经济建设对流动人口产生了强烈的依赖。尽管流动人口给城市带来了生机和活力，增加了财税收入，但因为他们文化水平普遍较低，综合素质不高，因此造就了数量惊人的小商小贩和庞大的“民工”队伍。随着这些地区产业的不断升级，对简单劳动力的需求必然会越来越少，流动人口将面临失业的危险，势必会引起更严重的问题，从而阻碍这些地区城市化的进程。\n这段话支持的主要观点是（     ）。", "a": ["流动人口的增加对一些地区城市化发展具有负作用", "劳动密集型企业和私营企业的过度发展导致大量流动人口的增加", "大量低素质流动人口的存在，不利于城市化的发展", "大量流动人口的失业问题是城市化地区的潜在危机", "", ""], "r": "C", "e": "【解析】这段话是说流动人口素质不高，大量的失业会引起严重社会问题，阻碍城市化进程。正说明了C项的观点。从整体上看这段话是个转折复句，作者所要表达的观点在转折词的后面。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46076", "t": 1, "q": "能源价格高并非全是坏事，因为价格杠杆自会调节石油的流向，确保人类以剩下的石油找到更好的新能源，而不是全用到几十年前根本不存在的使夏天变凉爽的能源需求上。实际上，如果我们遵循价格杠杆，甚至无需教育消费者，人人都会做出理智的选择。那些价格杠杆不起作用的地方，多是机制本身有问题的地方，改进机制，才能使价格杠杆更有效。 \n这段文字的核心观点是：", "a": ["改革体制是充分发挥价格杠杆作用的前提", "能源的无谓浪费问题应该受到应有的重视", "提高能源价格有利于合理利用与节约能源", "要充分发挥价格杠杆调节能源流向的作用", "", ""], "r": "D", "e": "【解析】材料以能源价格高可以提高能源的使用效益为切入点，以“实际上”一词为转折，把话题落到了“价格杠杆”对能源利用的好处上，说明要充分发挥价格杠杆调节能源流向的作用。结合选项应该选择D。\n文段主要讲的是价格杠杆在调节能源流向方面的积极意义，A项没有抓住主题词“能源”；B项未提及“价格杠杆”，均可排除；C项本身表述有误，遵循价格杠杆并不是一味的提高能源价格。", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}, {"id": "46077", "t": 1, "q": "如果有能力的人不是受外界的影响去追求“完美”的解决问题的办法，而是限制自己的探索，发现满意的答案即可，那他们就能节省大量的精力。\n这段话表达了这样的一种观点（     ）。", "a": ["有能力的人不应该追求完美", "人们应当限制自己的探索", "有时候，完美的方法不一定是最经济的", "人们并不一定总要找到尽善尽美的解决问题的方法", "", ""], "r": "C", "e": "【解析】材料通过“不是…而是…”引出结论：不刻意地追求“完美”可能就会节省大量的精力，论述的是“追求完美”与“精力”的关系，即，刻意追求完美也许不是最经济的。正确答案是C。\n这段话主要强调了有能力的人在解决问题时，如果能够接受“满意”的答案而不是追求“完美”，可以节省大量的精力。\nA. 有能力的人不应该追求完美 - 这个选项过于绝对，原文并没有说不应该追求完美，而是说不必总是追求完美。\nB. 人们应当限制自己的探索 - 这个选项也过于绝对，原文只是建议在某些情况下限制探索，而不是在所有情况下都应如此。\nC. 有时候，完美的方法不一定是最经济的 - 这个选项与原文的意思相符，原文提到节省精力，即暗示了经济性的问题。\nD. 人们并不一定总要找到尽善尽美的解决问题的方法 - 这个选项也符合原文的意思，原文提到接受满意的答案即可，不必总是追求完美。\nC选项更直接地反映了原文中提到的节省精力（经济性）的观点。C更好", "l3": "一般能力", "l4": "1.3节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.4节", "n": "一般能力 / 1.4节", "qs": [{"id": "46078", "t": 1, "q": "<p>我们今天所依循的谈论中国古代绘画的文字全都出自中国文人之手，也正因为如些，中国文人已长时期主宰了绘声绘画讨论的空间，他们已惯于从自己的着眼点出发，选择对于文人艺术家有利的观点。而如今——或者早该如此——已是我们对他们提出抗衡的时候了，并且也应该质疑他们眼中所谓的好画家或好作品。许多优秀的非文人艺术家都因为文人的偏见而未能获得应有的认可，在此，我们应该一一重新给予他们客观的评价和应有的地位。 下列说法与原文相符的是（ ）。<\/p>", "a": ["<p>文人艺术家的鉴赏水平落后于他们的创作水平<\/p>", "<p>古代很多有才华的文人艺术家因偏见而被埋没<\/p>", "<p>文人在中国绘画理论领域长期居于强势地位<\/p>", "<p>古代文人画与非文人画的趣味分歧由来已久<\/p>", "", ""], "r": "C", "e": "<p>【答案】C 【解析】据提问可知此题是细节判断题。由“我们今天所依循的谈论中国古代绘画的文字全都出自中国文人之手”、“中国文人已长时期主宰了绘画讨论的空间”可知，C项的表述正确。A.D项无中生有;B项偷换概念，原文中因偏见而被埋没的是“非文人艺术家”。故正确答案为C。<\/p>", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46079", "t": 1, "q": "避讳是为了表示对封建君主和尊者的敬畏，必须避免直接说出他们的名字而采用别的方式加以表达，它是封建宗法制度的产物，又是家天下和尊祖敬宗的体现。它起源于西周，完备于秦汉，盛行于唐宋，到清代的雍正、乾隆年间发展到极致。避讳作为封建社会特有的禁忌制度目前已经消亡了，但是，不许犯忌和害怕犯忌的双向心理并没有消除，避讳已经演变为某些趋吉避凶的习俗，在现实生活中的影响依然存在。\n根据这段文字，以下说法正确的是（     ）。", "a": ["封建社会的发展使得避讳愈来愈严格", "趋吉避凶的心理使人们进行各种避讳", "在当今现实生活中仍然存在避讳现象", "避讳由统治者运用国家权力强令实行", "", ""], "r": "C", "e": "【解析】本题为细节判断题。由最后一句“避讳已经演变为某些趋吉避凶的习俗，在现实生活中的影响依然存在”可知C项正确。A项中原文意思是，随着封建社会的发展，避讳变得愈来愈严格，“封建社会的发展”并不构成其原因。B项以偏概全，“趋吉避凶的心理”是当今现实生活避讳现象存在的原因，在封建社会则是“为了表示对封建君主和尊者的敬畏”。D项内容在文中并未涉及，排除。故正确答案为C。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46080", "t": 1, "q": "颐和园附近要建的电塔工程，在一片反对的声浪中进入环保听证程序。事件到此并没有画上句号，它不仅考验着市民维护家园的决心和城市决策者的智慧，还关系到类似颐和园的众多风景名胜资源和文物的命运。\n从这段文字我们不能得出的是（     ）。", "a": ["电塔工程至此还没有正式开工", "电塔工程不是一个错误的决策", "多数市民维护家园的决心比较强", "受到此种威胁的景点不止是颐和园", "", ""], "r": "B", "e": "【解析】一道典型的细节判断题，难度不高，但要求考生自己阅读进行辨别。从“颐和园附近要建的电塔工程”的“要建”二字可以判定电塔工程还没有开工。从“一片反对的声浪中”可以判定多数市民维护家园的决心比较强。从“还关系到类似颐和园的众多风景名胜资源和文物的命运”可以判定受到此种威胁的景点不止是颐和园。只有B项在原文中没有依据，无从得出。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46081", "t": 1, "q": "中国妇女发展基金会将委托专业金融机构对中国女足发展基金进行管理和运作，其收益部分用于资助中国女子足球队改善生活和训练条件，开展交流与合作，培养选拔后备力量。\n下 列表述，符合文意的是（     ）。", "a": ["<p>中国女足发展基金，将解决中国女足所面临的问题<\/p>", "<p>广泛开展交往合作，是培养和选拔女足后备力量的保证<\/p>", "<p>中国女足的活动，由受委托的专业金融机构管理和运作<\/p>", "<p>中国女足发展基金，已确定了管理机制和运作规则<\/p>", "", ""], "r": "A", "e": "【解析】一道典型的细节判断题，选项设置也是依循“理论要点”所介绍的套路。在阅读文段的过程中考生要注意时态和概念的把握，原文的一个“将”字就明确指出其时态为将来时，而D项的表述时态“已”为过去时，从时态的角度来讲就不符合，属于典型的偷换时态。同时首句的信息还可以对C项进行判断，原文指的是对“中国妇女发展基金”进行管理和运作，而C项将其偷换成了“中国女足的活动”，属于典型的偷换概念。B项的表述则属于典型的偷换逻辑关系，根据原文“改善生活和训练条件，开展交流与合作，培养选拔后备力量”可知三者均是中国女足面临的问题，三者之间的关系属于并举，不偏不重，而B项将其偷换成了条件关系，因此表述错误。只有A项无论从时态还是内容上均与文意相符，因此A项为正确答案。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46082", "t": 1, "q": "社会焦虑突增导致青年社会责任感突减。社会环境的急剧变化，使处在竞争环境中的青年，不得不经常考虑个人的就业、住房、医疗、婚姻、教育……他们逐渐疏离社会，一种非正常的社会心理——“社会焦虑”由此产生。比如有些青年有一种对未来的潜在风险不可预测的“恐惧”和忧虑，形成一种无形的压力。\n对“社会焦虑”产生的原因理解不正确的是（     ）。", "a": ["社会环境急剧变化", "个人的就业、住房等问题", "对未来风险的不可预知", "社会责任感突减", "", ""], "r": "D", "e": "【解析】这道题目要求考生把握“社会焦虑”所产生的原因，事实上就是要求考生在文段中寻找原因表述的相关细节语句，是一道变换提问方式的考法。根据原文“社会环境的急剧变化……个人的就业、住房、医疗……‘社会焦虑，由此产生”可知A.B两项均是产生“社会焦虑”的原因。根据文章尾句“未来的潜在风险不可预测的‘恐惧’忧虑形成一种无形的压力”可知C项也是“社会焦虑”产生的原因。因此A.B.C三项均是导致“社会焦虑”的原因，所以D项为正确答案。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46083", "t": 1, "q": "夜间是重要的消费时段。发展夜间经济，不仅是拓展新的消费领域的重要抓手，也是满足人们对美好生活需要的必然选择。但也要看到，夜间经济在给城市带来活力、魅力和新的经济增长点的同时，也对城市治理水平提出了更高要求。夜间消费的\"菜单\"能否更丰富，让人们有更多选择；公共交通能否跟上，为消费者和延时下班的工作人员提供便利。可以说，这一切不仅是一道经济命题，也是一道治理考题。\n下列说法与文意不符的是（     ）。", "a": ["夜间经济将影响日间经济整体发展水平", "夜间经济考验着管理者的城市治理水平", "夜间经济的发展离不开优质的公共服务", "夜间经济繁荣将有助于经济社会的发展", "", ""], "r": "A", "e": "【解析】A项说法不符合文意，文段并未涉及\"日间经济整体发展水平\"。 B项说法符合文意，可由\"夜间经济在给城市带来活力、魅力和新的经济增长点的同时，也对城市治理水平提出了更高要求\"推断出来。C项说法符合文意，\"夜间消费的'菜单\"\"\"公共交通\"体现的都是公共服务的重要性。D项说法符合文意，可由\"发展夜间经济，不仅是拓展新的消费领域的重要抓手\"\"夜间经济在给城市带来活力、魅力和新的经济增长点\"推断出来。故本题选A。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46084", "t": 1, "q": "来自卧龙的雌性大熊猫“琳琳”和成都的雄性大熊猫“师师”将成为“基因交配”的主角。据专家透露，人工饲养场内的大熊猫许多天性已退化，让它们自然交配十分困难，圈养下能自然交配的雄性大熊猫不到10％，能受孕产崽的雌性大熊猫仅24％。“基因交流”是为了调整大熊猫的血缘关系，增加大熊猫种群的遗传多样性。\n对这段文字理解正确的一项是（     ）。", "a": ["圈养大熊猫种群的遗传缺乏多样性", "人工饲养的大熊猫已不能自然交配", "大熊猫已成功实施跨地“基因交流”", "能受孕产崽的雌性大熊猫超过四分之一", "", ""], "r": "A", "e": "【解析】一道典型的细节判断题，题目难度中等，需要考生对文段信息进行仔细辨别。整个文段在陈述一件事，即由于圈养大熊猫种群的遗传缺乏多样性，因此将尝试为一雌一雄两只熊猫进行基因交配。因此可知A项表述符合文意，为正确答案。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46085", "t": 1, "q": "观察人士指出，从全球来看。即使在美国，其航天科技成功转化为民用技术的比率依然不高，这其中既有技术的适用性问题，盥有市场接受度的因素。对当前的中国而言，航天工业逐步面向市场开放具有标志性意义，其重要性要超过初期有多少技术转化成民用产品这种数量型问题。\n对这段文字理解正确的是（     ）。", "a": ["我国航天科技转化为民用技术的比率将超越美国", "我国航天工业面向市场开放的条件目前尚不成熟", "市场接受度和技术适用性等因素限制了航天科技的发展", "现阶段我国不必过于强调航天技术转化为民用产品的比率", "", ""], "r": "D", "e": "【解析】A项无中生有，由文段无法推出“我国航天科技转化为民用技术的比率将超越美国”；B项“尚不成熟”表述错误，与文段强调“对当前的中国而言，航天工业逐步面向市场开放具有标志性意义”的论述相悖；C项“限制了航天科技的发展”表述不准确，文段说的是市场接受度和技术适用性等因素限制了航天科技转化为民用技术的比率。D项可由“其重要性要超过初期有多少技术转化成民用产品这种数量型问题”得出。故本题选D。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46086", "t": 1, "q": "在八国峰会召开前夕，英国媒体认为这次八国会议，在温室气体排放问题上，欧美都将争取中国的支持。中国现在是仅次于美国的全球第二大温室气体排放国，其温室气体排放量约占全球排放总量的15%，而且这个数字仍在上升。在联合国发起的《京都议定书》中，中国也被归类为发展中国家，因此不受该条约中减少温室气体排放要求的约束。\n对欧美要争取中国的支持的原因，表述最准确的是（     ）。", "a": ["中国的温室气体排放量居世界第二，并逐年增加", "中国具有较大世界影响力，但尚未加人《京都议定书》", "中国在发展中国家中经济最有潜力，对欧美国家经济影响巨大", "中国排放温室气体量大，但不受《京都议定书》中的条约约束", "", ""], "r": "D", "e": "【解析】该题目要求考生阅读文段后对事件原因进行解释，实质上还是在考细节判断题，只不过是换了一种问法，考查了考生对于因果关系的掌握。文段首句指出“欧美都将争取中国的支持”，接下来对首句解释说明，也就是为何要争取中国的支持。因此正确的选项只需将后两句总结归纳即可。文中第二句阐述的是中国温室气体排放量大的现象，第三句阐述中国不受《京都议定书》的约束，因此综合归纳可知D项正确。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46087", "t": 1, "q": "科学研究本质上是机会主义的，其目的不在于做或好或坏的实验，而在于解决问题，如果一个问题碰巧笨拙地解决了，那么优美的方法就永远不会找寻了。\n不符合这段话意思的是（     ）。", "a": ["科学研究不在乎方法的笨拙或优美，只要达到解决问题的目的就可以了", "科学研究的机会主义致使优美的方法永远不会被找寻", "科学研究的目的是解决问题", "优美的方法不是科学研究追求的目标", "", ""], "r": "B", "e": "【解析】一道典型的细节判断题，考生要把握文段表述的内涵。根据原文“其目的不在于做或好或坏的实验，而在于解决问题”可知A项、C项的表述均正确。D项也不难理解，“科学研究的目的在于解决问题，并非追求优美的方法”，因此D项也是正确的表述。同时A.C.D三项表述意义大致相同，根据“排同法”可知单项选择题中要将这几项意思相同的排除。B项-表述过于绝对，文意是“如果恰巧解决的方法是笨拙的……”，表达的是一种可能性，因此B项错误。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46088", "t": 1, "q": "专家认为，如果汽车行业经过长年的研发能降低3％的油耗，就可以算是非常显著的研究成果了；但即使是能降低3％的油耗，对实际生活中的消费者来说也不太明显。而且汽车生产厂家在不影响加速动力性的情况下，已经在尽量省油，目前生产的汽车在节油和动力方面的效果已经达到了最佳配置比。\n根据这段话，以下说法正确的是（     ）。", "a": ["汽车消费者对能否节约3％的汽油不在乎", "目前生产的汽车已经达到了最佳的制动效果", "无论汽车技术怎么发展，节油效果都不会很显著", "在节油和动力的最佳配置比方面再寻求突破难度很大", "", ""], "r": "D", "e": "【解析】一道典型的细节判断题，难度不高，但由于文段字数较多，需要考生仔细阅读进行辨别。根据尾句“目前生产的汽车在节油和动力方面的效果已经达到了最佳配置比”可以推知既然是最佳’再寻求突破当然难度很大，故D项正确。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46089", "t": 1, "q": "被法国人称为“地下城市”的巴黎下水道，规模很大，设施先进。巴黎下水道虽名为下水道，但还具有其他各种功能。下水道底部为水渠，上部有各种管道，管道总长度为2100公里。现在，下水道像小河一样可以行船。昼夜灯火通明，不失为旅游的好去处。巴黎的地下城’还有许多可以通行汽车的地下街道和巨大的停车场。 \n关于巴黎下水道，下面说法正确的是（     ）。", "a": ["可以在里面坐船旅游", "有地下街道和娱乐设施", "设施齐全，生活方便", "管道纵横，长有千米", "", ""], "r": "A", "e": "【解析】这是一道典型的细节判断题，关键在于选择最符合文意的一项，因此考生要进行仔细辩剐，选出最为恰当的一项。此题难度不高，关键在于与原文进行对照。根据原文“下水道像小河一样可以行船。昼夜灯火通明，不失为．旅游的好去处”可知A项正确。\n【纠错】B项的前半句“有地下街道”表述正确，但后半句“娱乐设施”在原文中没有提及。C项“设施齐全”是对原文“设施先进”的概念偷换，此外“生活方便”在原文中也没有体现。D项“管道纵横”即横纵均有，而原文的表述是“总长度”即只提到了纵，因此也不准确。有些考生会选择D项，但事实上与A项比较而言，A项更贴切原文，因此考生在选择答案时要秉承“择优原则”。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46090", "t": 1, "q": "大袋鼠是一种奇特的动物。它们平时在原野、灌木丛和森林地带活动'靠吃草为生。它们过群居生活，但没有固定的集群，常因寻找水源和食物而汇集成一个较大的群体。老鹰、蟒蛇和人们都要捕捉袋鼠，然而对袋鼠来说最大的危害莫过于干旱，幼小的袋鼠会死亡，母大袋鼠会停止孕育。\n下面说法正确的是（     ）。", "a": ["有的大袋鼠单独行动", "大袋鼠常聚集在一起寻找水和食物", "威胁大袋鼠最严重的是人们的捕捉", "遇到干旱，袋鼠都会死亡", "", ""], "r": "B", "e": "【解析】一道典型的细节判断题。根据原文“常因寻找水源和食物而汇集成一个较大的群体”可知B项正确。通过浏览原文“它们过群居生活”可知A项表述错误，属于偷换数量。原文中的“对袋鼠来说最大的危害莫过于干旱”可知C项错误，属于偷换概念。原文最后一句“幼小的袋鼠会死亡，母大袋鼠会停止孕育”可知D项错误，过于绝对，根据“相对绝对法”予以排除。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46091", "t": 1, "q": "在今天南京的清凉山西部，有一段石壁叫鬼脸城，一般认为是古代石头城的遗址。但作为六朝古迹的石头城，却可能不在这里。据专家考证，早在六朝以前，江水就已经逐渐向西迁移。211年，孙权将东吴的政治中心从京口迁到秣陵，并将秣陵改名为建业，次年营建了石头城，东吴大将周瑜曾在石头城操练水兵。这个石头城或应在今天定淮门旁边的四望山上，地势靠近长江。清凉山也叫石头山，不过，它的得名却迟至五代十国，由于江水不断向西迁徙，杨行密所建立的吴国就把石头城迁到了清凉山。\n下列说法与原文相符的是（     ）。", "a": ["历史上的石头城曾多次搬迁", "孙权营建的石头城靠近长江", "清凉山是由杨行密所命名的", "石头城始建于五代十国时期", "", ""], "r": "B", "e": "【解析】由整个文段来看，石头城并没有多次搬迁，A项错误。由第三句至第五句内容可知，B项正确。由文段的最后一句可知，C.D两项说法错误。故本题选B。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46092", "t": 1, "q": "软件在长期运行和使用中没有磨损、老化、用旧等问题。任何机械、电子设备在运行和使用中，其失效率大都遵循U型曲线(即所谓“浴缸曲线”)。那是因为刚一投入使用时各部件尚未灵活运转，常常容易出问题。经过一段运行，便可以稳定下来。而当设备已经历相当时期的运转，便会出现磨损、老化等问题，会使失效率突然提高。这意味着已经到达寿命的终点，即将报废了。\n下列陈述，不符合文意的是（     ）。", "a": ["软件在运行和使用中不遵循U型曲线(即所谓“浴缸曲线”)", "任何机械、电子设备刚一投入使用时各部件尚未灵活运转，但是越用越好用", "软件和机械、电子设备在运行和使用中的表现有很大的不同", "软件不像机械、电子设备那样运行一段时间便可以稳定下来", "", ""], "r": "B", "e": "【解析】一道典型的细节判断题，事实上原文的首句提到了软件与机械、设备的不同后，接下来的表述都是在解释何为U型曲线，因此可以推知“软件不遵循U型曲线”，而A项、C项、D项均是这句话的同义表述，所以均属正确答案，可以根据“排同法”排除。根据原文的表述可知，机械、电子设备遵循的是U型曲线，即先出现问题，然后稳定下来，最后老化失效的线形图像。而B项的表述“越用越好”用曲线表示这种情况，应该是上升的，与文中“稳定下来”相悖，属于概念的偷换，所以B项不符合文意。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46093", "t": 1, "q": "严密的逻辑论证，历史上有一个确实的来历：公开辩论。古典时代的雅典人好辩，还有一套民主选举办法，雄辩术风行，甚至还有一个奇怪的习惯：两人争辩一件事，可以有彩金，谁辩胜就得彩金。辩证法的原意本是辩论，一方说话有漏洞，对方力图辩驳，怕输，就要严密。逻辑学显然也是从这来的。\n不符合这段话意思的是（     ）。", "a": ["<p>雄辩术曾经在古典时代的雅典风行<\/p>", "<p>辩证法不仅仅是为了在和别人的论辩中取得胜利<\/p>", "<p>为一件事情争论不休在古典时代的雅典可能是很奇怪的<\/p>", "<p>逻辑学的产生可能和古典时代的雅典人好辩有关<\/p>", "", ""], "r": "C", "e": "<p>【解析】A 正确：原文 “雄辩术风行”，和选项表述一致。B 正确：辩证法原意是辩论，为了辩驳对方漏洞、追求逻辑严密，不只是单纯争输赢。C 错误：“奇怪” 指的是争辩还设置彩金这个习惯很奇怪，不是 “为事情争论不休” 这件事本身奇怪。雅典人本身就好辩，争辩是很常见的。选项偷换概念。D 正确：文段 “逻辑学显然也是从这来的”，“这” 指代雅典的公开辩论，“可能” 表述温和，符合文意。<\/p>", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46094", "t": 1, "q": "调查显示，新闻记者的职业和网络关系密切。但只占上网人数的1．8％。与大量青少年学生网民(占总数的19．3％)相比，教师和党政企事业单位的领导干部上网太少(分别占网民总数的5％和3．4％)；与月收入500元以下和500～1000元的人群(分别占网民总数的21％和29％)相比，收入较高的人们的上网比例并没有很大提高；从事商贸活动的人员上网人数只占总数的5．8％。\n对这段话理解正确的一项是（     ）。", "a": ["职业与上网没有直接关系", "网络成为现代人获取信息的主要来源", "电子商务没有在中国获得真正的发展", "收入越高，上网人数的比例越高", "", ""], "r": "A", "e": "【解析】一道典型的细节判断题，难度不高，需要考生根据文段表述进行对比及归纳。文段主要围绕“职业”和“上网”之间的关系展开论述。根据所给例子可知上网与职业并没有直接的关系，因此A项正确。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46095", "t": 1, "q": "自然资源稀缺，产权就非常重要。因为产权明确，人们再也不会超负荷放牧。到发达国家农牧业地区看过的人都知道，分割牧场使用的都是铁丝网，这完全是君子界线，堵不住小人。但是在一个法制的社会，这种防君子不防小人的界线，是具有法律权威的。难怪有一本书说铁丝网是十九世纪人类社会十大发明之一。\n下面不符合这段话所表达的意思的是（     ）。", "a": ["产权的划分要有法律来保障", "铁丝网只有在法制社会才起作用", "法律能约束君子但不能约束小人", "产权明确可以防止自然资源的过度开发", "", ""], "r": "C", "e": "【解析】一道典型的细节推断题。难度不高，仔细阅读即可得出答案。根据原文“但是在一个法制的社会……”一句可以推知A项正确。根据“分割牧场使用的都是铁丝网，这完全是君子界限，堵不住小人”可以推知B项正确。根据文中第二句可知推知D项正确。故C项错误，将原文中的“铁丝网”偷换成了“法律”，属于典型的偷换概念。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46096", "t": 1, "q": "银行委托贷款当中并不承担任何连带责任，只负责办理相关手续。一般来说，\n委托贷款的上、下家事先约定好利率、期限、还款方式，只是通过银行作为金融机构办理相关的文件。\n对这段话的意思理解不正确的是（     ）。", "a": ["银行可以帮助需要委托贷款的双方", "银行作为金融机构为双方办理相关文件", "确定委托贷款的利率、期限等与银行相关", "贷款方还款与否与银行方面无关", "", ""], "r": "C", "e": "【解析】一道典型的细节判断题，难度不高，仔细辨别即可选出正确答案。根据原文“委托贷款的上、\n下家事先约定好利率、期限、还款方式，只是通过银行作为金融机构办理相关的文件”可知银行与委托贷款的利率、期限等无关，只是行使一种办理手续，因此C项的表述与文意相悖，应该选择C项。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46097", "t": 1, "q": "从2007年4月1日起，北京居民在社区卫生服务站看病，不仅能享受到双向转诊，而且上转定点支援的二、三级医院，不再受医保定点限制，都能享受医保。目前，北京市卫生局已经与市劳动和社会保障局达成共识，放宽医保患者的定点医院报销范围。\n下列说法与这段文字不符的是（     ）。", "a": ["<p>上述规定的目的是提倡居民到社区卫生服务站看病<\/p>", "<p>4月1日前北京居民在定点医院才能享受医保<\/p>", "<p>4月1日后北京居民将不接受医保定点限制<\/p>", "<p>北京市将放宽医保患者定点医院的范围<\/p>", "", ""], "r": "D", "e": "<p>【解析】一道典型的细节判断题。实际上原文就是在陈述一个新的医疗动向，即在社区卫生服务站看病能够享受到诸多好处。其隐含着的观点即鼓励市民到社区卫生站看病，因此A项的文意与原文相符。根据原文“从2007年4月1日起……二、三级医院，不再受医保定点限制，都能享受医保”可知在2007年4月1日之前只有定点医院才能享受医保，因此B项也是正确表述，同理C项也是正确表述。因此D项表述不符合文意，答案应该是D项。<\/p>", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46098", "t": 1, "q": "世界已经飞速走向生物技术的世纪了，连科学家们也不知前景会怎么样。有些学者甚至怀疑人是否具有足够的智慧来了解自身的80000个基因是如何共同作用产生了一个可以注视自己过去与未来的生命的。但是，大家已经认识到，有一点是肯定的，即当我们进入下一个千年时，生物技术将在人类历史上写下自己的篇章。\n这段话不能给我们提供的信息是（     ）。", "a": ["科学家们也不知生物技术前景如何", "世界已经进入生物技术的世纪了", "生物技术将在未来发挥重要作用", "生物技术有其存在的价值", "", ""], "r": "B", "e": "【解析】一道典型的细节判断题，要求考生选择表述错误的一项。根据文中“连科学家们也不知前景会怎么样”一句可知A项表述正确；根据“当我们进入下一个千年时，生物技术将在人类历史上写下自己的篇章”可知C项、D项表述正确；B项表述有误，将文中“世界已经飞速走向生物技术的世纪了”一句表示正在进行的时态偷换成了“世界已经进入生物技术的世纪了”表述已然性的时态，属于典型的偷换时态，因此正确答案应该是B项", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46099", "t": 1, "q": "医药的供求不能遵循利润最大化，而应服务于社会效益最大化。因为疾病的治愈，受益的不仅是公民个人或者是个别家庭，受益更多的是整个社会——它既恢复了个体为社会创造财富的劳动能力，更重要的是防止疾病在更大的范围流传从而保护更多的人群。\n根据以上文字，下列表述不准确的一项是（     ）。", "a": ["疾病的治愈恢复了个体的劳动能力", "疾病的治愈可防止疾病在更多的人群中传播", "医药的供求不能遵循利润的最大化，应服务于社会效益最大化", "疾病最大的受益人不仅是个人和家庭，还有社会", "", ""], "r": "D", "e": "【解析】一道典型的细节判断题，要求选择表述错误的一项。根据文中首句可知C项表述正确；根据文中“疾病的治愈……恢复了个体……的劳动能力”可知A项表述正确；根据文中“更重要的是防止疾病在更大范围流传从而保护更多的人群”可知B项表述正确；而D项表述有误，文中提到的是“疾病的治愈，受益的是”，而选项D却偷换成了“疾病最大的受益人”，属于典型的偷换概念，因此D项为正确答案。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46100", "t": 1, "q": "来自俄罗斯沃罗涅什林业科学家们发明了一种新的方法，使用这种方法可使普通的劣质木材变得像石头甚至像钢材那样坚硬。这项发明将会使向来在建筑工程中很少使用的木材(山杨、白桦、白杨和赤杨)今后将不再受人冷落，并能够使它们获得比其他贵重木材更优质的性能。\n下列陈述不符合文意的是（     ）。", "a": ["俄国科学家发明了一种可使劣质木材坚硬如石如钢的新方法", "这项发明能使受人冷落的劣质木材比优质木材更贵重", "这项发明会使在建筑工程中很少使用的普通劣质木材不再受冷落", "这项发明能够使普通劣质木材获得比其他贵重木材更加优质的性能", "", ""], "r": "B", "e": "【解析】一道典型的细节判断题，要求考生选择不正确的一项。根据原文首句可知A项表述正确；原文第二句分别是C项、D项的表述，也是正确的；B项将原文中“更优质的性能”偷换为“更贵重”，属于典型的偷换概念，因此正确答案应该是B项。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46101", "t": 1, "q": "危机处理是指突如其来的一个事件爆发以后，政府怎么处理，怎么应对。危机管理则更全面，不仅包含了针对危机爆发期、持续期和消退期的处理方法，甚至包括了针对潜伏期的处理，就是当危机还没有产生的时候，政府应具有一种预警的能力，然后再具备危机处理应变的能力。\n根据这段文字，正确的一项是（     ）。", "a": ["危机处理更关键", "危机管理包含危机处理", "危机处理是危机管理的核心", "危机管理可以预防危机事件发生", "", ""], "r": "B", "e": "【解析】一道典型的细节判断题。文段首先界定了“危机处理”的概念，接下来界定了“危机管理”的概念，通过文段表述的词语“更全面”、“不仅包含……甚至包括”可以推知B项，即危机管理包含了危机处理，其内涵更加广泛。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}, {"id": "46102", "t": 1, "q": "每个人睡觉时都要做梦，人在做梦时的睡眠叫有梦睡眠。有梦睡眠时’控制四肢和躯体的神经传导被阻断，除了脚和手指有知觉外，身体其他部分均处于麻木状态。心跳和呼吸的次数与清醒时差不多，但变得不那么均匀，体温调节机制受阻，打寒颤和出汗都很难。\n根据本文，理解准确的是（     ）。", "a": ["人在做梦时，呼吸和清醒时不完全一样", "人在做梦时，心跳和清醒时是相同的", "人在做梦时，常常出汗", "人在做梦时，全身处于麻木状态", "", ""], "r": "A", "e": "【解析】一道典型的细节判断题。题目的难度不高，仔细阅读即可排除错误选项。根据原文“心跳和呼吸的次数与清醒时差不多，但变得不那么均匀”可知虽然差不多，但还不完全一样，即A项的表述正确。", "l3": "一般能力", "l4": "1.4节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.5节", "n": "一般能力 / 1.5节", "qs": [{"id": "46103", "t": 1, "q": "通常而言，鸟类坚韧而又灵活的羽毛是由角蛋白纤维构成的。这些角蛋白纤维构在一起组成一个平面，进而形成羽毛。羽毛有很多种：飞羽的各个羽支连成一片使鸟能够飞行;廓羽覆盖鸟全身，使身体呈流线型;绒羽蓬松柔软，用来保护鸟类体温。\n最适合做本段标题的是（     ）", "a": ["鸟类羽毛的使用", "鸟类的各种羽毛", "鸟类的羽毛", "鸟类羽毛的结构、种类及功能", "", ""], "r": "D", "e": "【解析】典型标题填入题。通过阅读可以推断此文段为一篇说明文类标题填入题，寻找说明的主体成为关键。通过阅读可以得知本文是以鸟类羽毛的结构、种类、功能为主体进行详尽阐述的，故答案为D。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46104", "t": 1, "q": "为什么有些领导者不愿意承担管理过程中的“教练”角色?为什么很多领导者不愿意花时间去教别人?一方面是因为辅导员工要花去大量的时间，而领导者的时间本来就是最宝贵的资源。另一个原因则在于对下属的辅导是否能够收到预期的效果，是一件很难说清的事情。因为有很多知识和方法是“只可意会、不可言传”的。而从更深的层次来说，“教练”角色要求领导者兼具心理学家和教育学家的素质，这也是一般人难以具备的。\n最适合做这段文字标题的是（     ）。", "a": ["效率低下，领导之过", "团队意识亟待增强", "员工培训，岂容忽视", "做领导易，做“教练”难", "", ""], "r": "D", "e": "【解析】典型标题填入题。通过阅读可以推断此文段为一篇议论文类标题填入题，因此找出论点成为答题关键。文段通过前两句话的层层设问的方式引出话题，即“领导者”和“教练角色”——论点关键词，之后四句话是逐步分析——论证。故选 D。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46105", "t": 1, "q": "一个人离开你的视线，只消失几秒钟，你便会给他一个评语，正视的时候却不行。聪明的人，一定把后背比前脸看得更加重要。这后背就是自己的一个雕像。雕塑是由别人操作的，材料和尺度则完全由自己提供。我们并不奢望把每个人都塑造成完人，但至少自己“走过去”别让人戳脊梁骨。\n最适合做本段文字标题的是（     ）。", "a": ["看好你的背影", "背影比前脸更重要", "人过留名，雁过留声", "背影是一个人的德行和名声", "", ""], "r": "A", "e": "【解析】本题属于非典型标题填入题，为抒情散文型标题填入题。注意问题都以“你”这一第二人称的口吻进行阐述，则应选择统一口吻的标题类型;此外，这段文字说明了背影的重要性，提醒人们要塑造好自己的背影。用“看好你的背影”做标题，新颖、独特、具有吸引力，而同时能给人以警戒和忠告。故选择A.", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46106", "t": 1, "q": "美国经济学家保罗·费德曼每拿到一个研究合同时，总会买面包圈分给大家。后来他养成了习惯，每到周末都会在办公室放一筐面包圈让大家吃。为了收回成本，他在面包筐旁放了一个篮子，标有建议价格。结果这个没人看守的收款篮收回了95%的面包钱。后来，他辞职专卖面包圈。每天一早，他将面包圈和收款篮放好。几年后，费德曼赚的钱和原来当研究分析师时一样多。\n最适合做这段文字标题的是（     ）。", "a": ["一个关于诚实的试验", "一个靠智慧赚钱的故事", "一种新的销售方式的产生", "把生意当作一种经济学实验", "", ""], "r": "A", "e": "【解析】本题属于非典型标题填入题，为叙事散文型标题填入题。关键看叙事的内容为什么。通过阅读可知这是一个过关“试验”的叙述，试验的主体是有关“诚实”，并不是“赚钱”为目的，因此B.D不选，而选A。这个文段出自经济学家的一个非常著名的假设：自私自利是人的本性。人们在从事经济活动时，都以追求自己最大的经济利益为目的。很多经济学理论都把“经济人”这个概念作为基本出发点。然而另一些人却不愿意相信赤裸裸的自私就是号称万物主宰的“人”的全部，因为人还拥有一样独一无二的天赋——道德。通过文中的“没人看守”可以看出，经济学家保罗·费德曼相信人们是“诚实的”，因此做了一个关于诚实的“无人看管的面包圈”的试验，A选项正确。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46107", "t": 1, "q": "成语中的数字运用很多，如一鼓作气、百废俱兴。非整数也进入了成语，如半途而废、半壁江山。还有两个成语：一举两得、一箭双雕。“两”和“双”是数字“2”的不同表示法。多数成语都是由四个文字组成的，数目字有时还被“连用”，如五光十色、三头六臂。也有成语纯粹由数目字组成，如三三两两、一五一十。\n最适合做这段文字标题的是（     ）。", "a": ["成语与数字的关系", "成语数字趣谈", "数字成语与成语数字", "成语用遍数目字", "", ""], "r": "B", "e": "【解析】本题属于非典型标题填入题，为杂文类标题填入题。这段文字第一句话即表述了所要阐述的主要内容——成语中的数字运用。后面文字分别举例介绍了非整数成语、“2”的变形成语、数字连用成语、纯粹数字成语等。因此最适合做这段文字标题的是“成语数字趣谈”，B选项正确。文段主要讲述成语而非数字，A选项不正确。C项和D项不是文段所涉及的。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46108", "t": 1, "q": "“80后”这个词，最早于2001年出现在网络论坛中，指的是一批活跃于网络论坛的出生于20世纪80年代的诗人。2003年开始，它更多指的是一批被商业运作出名的生于1980年以后的写手。2004年底，随着“80后作家”的批量涌现，这个词逐渐被用来指称整个20世纪80年代出生的年轻人群体。\n最适合做这段文字标题的是（     ）。", "a": ["“充满希望”的一代", "“80后”的由来", "用新视角理性看待“80后”", "“80后”引起社会的广泛关注", "", ""], "r": "B", "e": "【解析】本题属于非典型标题填入题，为杂文类标题填入题。这段文字表述的意图明确，脉络清晰。“80后”这个词，最早于2001年出现……，2003年开始……，2004年底……，由此可以看出，本文主要阐述“‘80后’的由来”。B项符合题意。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46109", "t": 1, "q": "渔人在捕鱼，一只鸟飞来，叼走了一条鱼。有无数只乌鸦看见了，便去追逐这只叼着鱼的鸟。这只鸟不论飞东飞西，满天的乌鸦就是穷追不舍，它无处可逃，只能疲惫地飞行，心神涣散时鱼就从嘴里掉了下来，那群乌鸦就朝着鱼落下的方向继续追逐。这只鸟如释重负，栖息在树枝上，内心反倒平静了下来，没有了恐惧烦恼。\n最适合这段文字的标题是（     ）。", "a": ["徒劳无功", "坚韧不拔", "损人害己", "以舍为得", "", ""], "r": "D", "e": "【解析】由\"这只鸟如释重负，栖息在树枝上，内心反倒平静了下来，没有了恐惧烦恼\"可知，鸟儿虽舍弃了嘴中的鱼，却获得了内心的平静，即文段意在说明的是舍与得的关系。只有D项体现了舍与得，当选。A.B.C三项均与文段无关。故本题选D。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46110", "t": 1, "q": "春天的气息唤醒了慵懒的细胞，满目的烂漫引导我们向往着花开四季，锦绣的人生与桃花的惊艳给了我们感官与精神的双重慰藉。我想，也许每个人的内心深处都保留着这么一丝天马行空的浪漫，每个女人都曾经将自己化身为那个自由的洛丽塔女孩，家是我们思想的延伸，装点其中便有了主人思维的精髓，内心的渴望。在这里，我们有了这样的“艳遇”。\n如果上述文字是一断广告语，那么它最适合于（     ）。", "a": ["花卉展销", "家具推介", "房屋销售", "旅游宣传", "", ""], "r": "B", "e": "【解析】“春天的气息”、“满目的烂漫”、“锦绣的人生与桃花的惊艳”为隐匿性的言语，体会到色彩、气氛等;“天马行空的浪漫”、“自由的洛丽塔女孩”为暗示性的言语，美感的暗示;这些倾向性言语创造了诗意和美的意境，引起我们内心装点家的渴望，最后一句起过渡作用，也可以看成是点题之笔。选B。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46111", "t": 1, "q": "火山喷发出的岩浆冷却后收缩，产生了裂缝，裂缝趋于六边形，最后形成了紧密排列的六棱柱形岩石，这是岩浆内部作用力达成的最稳定的结果。海龟的背甲是由骨骼的不同部分长成的，它们衔接时互相挤压，中间部位的背甲块形成了六边形的稳定结构。冬天，气态水分子受低温影响而重新排列成固态，同样是以最稳定的结构互相连接，形成了六边形的雪花冰晶。\n最适合做这段文字标题的是（     ）。", "a": ["六棱柱形火山岩石", "六边形的雪花冰晶", "六边形的海龟背甲", "大自然钟爱六边形", "", ""], "r": "D", "e": "【解析】文段首先指出岩浆冷却后产生的裂缝呈六边形的稳定结构，接着论述海龟中间部位的背甲也是稳定的六边形，最后提到雪花也是稳定的六边形结构，可知文段为并列结构，需全面概括，即大自然的不同现象中都有六边形这一稳定结构的存在，对应D项。\nA项\"火山岩石\"、B项\"雪花冰晶\"、C项\"海龟背甲\"均只能对应并列中的一个方面，表述片面，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46112", "t": 1, "q": "蝴蝶大都有觅食花卉的习性，一般来说，大型蝶种喜欢花朵大的花卉，而小型蝶种则喜欢低矮草质茎植物的花卉。翠凤蝶、蓝凤蝶喜欢觅食百合科植物的花卉。菜粉蝶、红襟粉蝶喜欢觅食十字花科植物的花卉。小豹蛱蝶则喜欢在菊花科植物的花卉觅食，它们也会偶尔换个口味，吸食发酵性食物。其实，取食花蜜、汲食树汁、嗜食发酵水果、吮吸动物尸体······蝴蝶的口味，因蝶种不同，取食也大相径庭，或是单一口味，或是五味俱全。有的还会从水中觅食，吸收自己所需“营养”，如在小溪两侧的沙滩处，人们总会看到一堆堆蝴蝶在吸水、喷水。\n最适合做这段文字标题的是（     ）。", "a": ["花为蝶开，蝶为花来", "蝴蝶对花卉也有选择", "蝴蝶的生活习性", "众口难调——蝴蝶不只为花来", "", ""], "r": "D", "e": "【解析】文段开篇指出蝴蝶大都有觅食花卉的习性，并通过列举不同蝶种的习性展开说明，随后通过转折词“其实”引出观点，即蝴蝶的口味因蝶种不同而大相径庭，并以在水中觅食的蝴蝶为例进行论证。故文段为分总分结构，重点强调蝴蝶的口味因蝶种不同而不一样，蝴蝶并非都要觅食花卉，对应D项。\n　　A项，“花为蝶开”文段并未提及，无中生有，且根据文意可知，蝴蝶并非只为花来，表述错误，排除;\n　　B项，“蝴蝶对花卉也有选择”为转折之前的内容，非重点，排除;\n　　C项，“生活习性”包含动物的饮食、作息等方面，文段只论述了蝴蝶的觅食习性，“生活习性”范围扩大，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46113", "t": 1, "q": "三江源地区人们居住分散，垃圾收集和运输成本高昂，目前除极少数市镇外，绝大多数地区严重缺乏垃圾回收、处理体系。近年来，瓶装饮料、塑料包装的各种零食成为三江源地区生活的新时尚。大量无法降解的垃圾被随意丢弃在居住地周边和草地上，又被大风和降雨带入河流体系。这些垃圾随着洪水涌入水系，源头污染上游，上游污染下游，下游污染海洋，形成了中国母亲河垃圾污染的巨大链条。\n最适合做这段文字标题的是（     ）。", "a": ["垃圾的反击：被随手丢弃，却在水源地汇集", "垃圾的告急：包装被丢弃，母亲河正在哭泣", "垃圾的侵袭：生活新时尚，困境与便利同在", "垃圾的自白：生态新危机，小细节有大影响", "", ""], "r": "A", "e": "【解析】文段开篇指出三江源绝大多数地区严重缺乏垃圾回收、处理体系，接着指出近年来瓶装饮料、塑料【解析】包装的零食成为三江源地区生活的新时尚，大量无法降解的垃圾被随意丢弃在居住地周边和草地上，然后被带入河流体系，最后通过指代词“这”总结前文，指出垃圾随着洪水涌入水系，并对其源头、上游、下游及海洋带来污染，故文段意在强调随意丢弃垃圾会对源头造成污染，A项“垃圾的反击”将垃圾拟人化，生动形象地体现了在三江源地区垃圾被随意丢弃后产生的负面作用，当选。\n　　B项，“包装”对应垃圾的其中一种，表述片面，排除;\n　　C项，“与”表示并列关系，运用反推思维，文段应为并列结构，而本文段是分总结构，重点论述垃圾的危害，排除;\n　　D项，文段并未提及垃圾是新的生态危机，故“新危机”无中生有，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46114", "t": 1, "q": "在漫长的历史进程中，中华民族始终认为暴力强权绝非国与国之间的相处之道，各国在处理邦交关系上应遵循亲仁善邻的和平之道。在中华文化中，穷兵黩武一向被斥为“霸道”。历代王朝的邦交之道大多以道义德教为价值取向，倡导“怀远以德，不闻以兵”的和平外交原则。在边疆治理中，倡导修德安民，将开边垦殖、互市交流、融合发展作为治边要务，致力于营造祥和安宁的周边环境。\n最适合作上述材料标题的是（     ）。", "a": ["<p>重道尚义，以德立国<\/p>", "<p>居安思危，有备无患<\/p>", "<p>禁暴止战，以谋取胜<\/p>", "<p>内修文德，外治武备<\/p>", "", ""], "r": "A", "e": "<p>【解析】文段开篇引出话题，即有史以来，中华民族始终认为国与国间的相处之道并非暴力强权，而是应“遵循亲仁善邻的和平之道”，剔除“穷兵黩武”的霸道，随后围绕这一对策具体展开论述，即历代王朝的邦交之道便是道义，而边疆治理也是以交流和融合为要务。故文段为总—分行文，重点强调中华民族始终崇尚重道义而反暴力的治国原则，对应A项。B项，“居安思危，有备无患”意为处在安定环境中，要想到可能出现的危难祸害，侧重强调事情发生前的忧患意识，文段未提及，排除;C项，“以谋取胜”侧重强调用智谋夺取胜利，文段并无谋略的相关论述，且未提及最终目的是取胜，排除;D项，“内修文德，外治武备”意为首先要搞好国内的政治和经济，增强国家的实力，对外才能治理武备，增强国家的威慑力量，以争取战争的胜利，文段强调治国之道而非战争战略，与文意不符，排除。故正确答案为A。<\/p>", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46115", "t": 1, "q": "口耳相传的神话传说，是史前人类的珍贵记忆，是构建民族共同体的重要基石。华夏文明拥有许多关于音乐的美丽传说。据《吕氏春秋▪古乐篇》记载，黄帝的乐官伶伦曾经不远万里来到昆仑神山，聆听凤凰鸣叫，制成12根律管，作为确定音高的标准。出自昆仑的“十二律吕体系”，历代确立的“十二律位传统”，乃至以“昆仑”为意象的文化复兴追求，奠定了中华民族音乐多元一体格局的历史基因，展现出包括中原与西域在内的各民族音乐艺术的辉煌开端。\n这是一篇文章的摘要，文章标题最可能是（     ）。", "a": ["<p>伶伦凤律：中国神话谱系与中华文化认同<\/p>", "<p>昆山凤鸣：各民族共同构建的中华文化符号<\/p>", "<p>律出昆仑：中华民族多元一体音乐文化的开端<\/p>", "<p>万山之相：民族多元一体格局视域下的昆仑文化<\/p>", "", ""], "r": "C", "e": "<p>【解析】文段开篇论述神话传说的重要性，接着指出华夏文明有许多关于音乐的传说。随后讲述昆仑音乐这一具体的传说，并强调昆仑音乐的意义，即奠定了中华民族音乐多元一体格局，展现了各民族音乐艺术的辉煌开端。因此，文段的主题词为“音乐”，重在说明昆仑音律对中华音乐文化的重要意义，对应C项。A项，“中国神话谱系与中华文化认同”偏离文段重点，文段重在介绍昆仑音律对中华音乐文化的意义，排除;B项“中华文化符号”、D项“昆仑文化”均表述不明确，未提及主题词“音乐”，排除。故正确答案为C。<\/p>", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46116", "t": 1, "q": "<p>运动不足已经成为21世纪最大的公共卫生问题。“运动医学之父”赫罗迪科斯(Herodicus)认为健康受损主要是因为饮食和身体活动之间的不平衡，因此建议严格控制饮食、持续参加身体活动和进行有规律的训练，通过这样的方式维持良好的健康。2007年，美国运动医学学会对赫罗迪科斯运动和医学相结合的理念进行了回顾总结，并和美国医学会一起将“运动是良医”这一思想作为一种学术理念和健康促进项目正式提出。2012年，中国在“运动是良医”理念的基础上进一步提出了“体医融合”概念，强调预防第一，预防和治疗同等重要。 最适合做这段文字标题的是（ ）。<\/p>", "a": ["<p>体医融合<\/p>", "<p>运动是良医<\/p>", "<p>“运动医学之父”赫罗迪科斯<\/p>", "<p>运动不足已成为最大公共卫生问题<\/p>", "", ""], "r": "B", "e": "【解析】文段首先提出21世纪存在运动不足的问题，接着提出“运动医学之父”的观点指出要通过“运动”的方式来保持身体健康。其次指出2007年“运动是良医”正式成为一种学术理念和健康促进项目，文段最后指出2012年中国在“运动是良医”的基础上提出了“体医融合”的概念。所以文段开头提出问题，后文重点围绕运动的重要性展开，主要强调运动对保持身体健康等方面的重要性。B项符合主旨句的同以替换。A项:“体医融合”概念的提出，目的是强调运动的重要性，非重点。\nC项：“赫罗迪科斯”对应文段引出“运动是良医”话题的内容，非重点。\nD项：对应开篇问题表述，非重点。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46117", "t": 1, "q": "近年来，踏足荒野、悠然自得的露营生活受到追捧，这种原本是“驴友”热衷的小众户外方式，如雨后春笋般席卷朋友圈，成了当下许多人热衷的户外项目。其中露营过程中的一些不文明现象，也引发了大家的关注，一些资深的户外爱好者呼吁，要文明出游，露营结束后应把垃圾带走，做到“无痕露营”。\n最适合做这段文字标题的是（     ）。", "a": ["<p>游客出游请带上文明的行囊<\/p>", "<p>莫给自然环境再添“负担”<\/p>", "<p>践行“无痕露营”，做环保达人<\/p>", "<p>“无痕露营”，当成文明出游标配<\/p>", "", ""], "r": "D", "e": "<p>【解析】文段首句引出露营的话题，指出踏足荒野、悠然自得的露营生活成了当下许多人热衷的户外项目，随后提出问题，即露营过程中出现了一些不文明现象，最后针对文段问题提出对策，即“要文明出游，露营结束后应把垃圾带走，做到‘无痕露营’”，故文段意在强调“无痕露营”的重要性，对应D项。 　　A.B两项，均未提及文段主题词“露营”，排除; 　　C项，“环保”仅是“无痕露营”的要求之一，表述片面，排除。 故正确答案为D。<\/p>", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46118", "t": 1, "q": "研究表明，许多动物能够探测到人类无法感知的最微小的振动、细微的大气变化甚至磁场电流。从这个意义上说，啮齿动物和狗可以听到比人类能听到的高得多的频率。大象能感知到的频率则比我们能感知的更低，而许多昆虫的腿部对振动非常敏感。许多动物通过不同的感知获得的这种特殊敏感性的集合，可能是对它们能预感灾难来临的合理解释。\n最适合做这段文字标题的是（     ）。", "a": ["<p>许多昆虫对振动非常敏感<\/p>", "<p>为什么动物能够预知灾难<\/p>", "<p>许多动物拥有敏锐的感官<\/p>", "<p>动物感知的频率远超人类<\/p>", "", ""], "r": "B", "e": "<p>【解析】文段开篇指出许多动物的感知能力强于人类，随后列举了啮齿动物、狗、大象以及昆虫的例子进行论证，尾句指出通过不同的感知获得的特殊敏感性的集合可能使动物能预感灾难来临，故文段为分总结构，重点分析了动物能预知灾难的原因，对应B项。A项“许多昆虫对振动非常敏感”、C项“许多动物拥有敏锐的感官”、D项“动物感知的频率远超人类”均属于结论前的内容，非重点，且均未提及核心话题“灾难”，排除。故正确答案为B。<\/p>", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46119", "t": 1, "q": "寺里有个小和尚，方丈让他每天去寺后两座山外的镇上买日用品，而别的小和尚都是去山前中途平坦又近的市镇，却回来得比他还晚，他们对方丈说：“我们说说笑笑，看看风景，就到这个时候了。”小和尚说：“我每天在路上都想着早去早回，由于肩上的东西重，我才更小心走，所以反而走得稳走得快。我已养成了习惯，心里只有目标，没有道路了。”方丈闻言大笑说：“道路平坦了，心反而不在目标上了。只有在坎坷的路上行走，才能磨练一个人的心志啊！”这小和尚就是日后声名远扬的玄奘法师。\n最适合做这段文字标题的是（     ）。", "a": ["路曲心直", "付出才能收获", "佛心源自坎坷路", "劣势也是优势", "", ""], "r": "A", "e": "【解析】文段通过玄奘和别的和尚的对比，说明了“只有在坎坷的路上行走，才能磨练一个人的心志”，即“路曲心直”。且“曲”与“直”的强烈对比也给读者以深刻的印象，符合标题的特点。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46120", "t": 1, "q": "仁宗天圣五年，北宋翰林医官院的医官王惟一设计并主持铸造了两具针灸铜人，被称为“天圣针灸铜人”，这是中国历史上最早的针灸铜人。这两具铜人中空，体表标有354个穴位，所有穴位都凿成小孔。每当医官院进行针灸考试，考官会将水银注入铜人体内，再将铜人体表涂上黄蜡，完全遮盖经脉穴位。应试者一旦准确扎中穴位，水银就会从穴位中流出，医学史书把这一奇特的现象称之为“针入汞出”。天圣针灸铜人的出现，不仅开创了铜人作为人体模型进行针灸教学的先河，也是中国古代针灸文化的象征，此后历代均有铜人问世。\n最适合做这段文字标题的是（     ）。", "a": ["从针灸铜人看中国针灸的传承", "北宋医官院如何进行针灸考试", "针灸铜人:古代针灸教学的人体模型", "天圣针灸铜人:中医经脉理论的结晶", "", ""], "r": "C", "e": "【解析】文段开篇提出北宋翰林医官院的医官王惟一主持铸造了两具针灸铜人，接着对这两具铜人进行了详细介绍，指出在针灸考试时，针灸铜人可以考验应试者的针灸技术，接着提出这两具针灸铜人开创了铜人作为人体模型进行针灸教学的先河，对我国古代针灸文化意义重大。故文段核心话题为“针灸铜人”，强调其在针灸教学中充当人体模型的作用，对应C项。A项，文段并未提及“中国针灸的传承”，无中生有，排除；B项，缺少文段核心话题“针灸铜人”，排除；D项，文段重点论述的是针灸铜人对针灸教学的重要性，选项未提及针灸教学，且“中医经脉理论”无中生有，排除。故正确答案为C。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46121", "t": 1, "q": "网上“恶搞”，是对“搞”的对象不加限制。和谐理念要求社会成员诚信友爱，“恶搞”则全然不顾别人的感受，“恶搞”说这是“幽默”，却不把自己作为“恶搞”的对象：和谐理念要求以理性方式表达自己的利益诉求，“恶搞”却不考虑采取的手段是否合理合法：创新在于创造新的事物．而“恶搞”热衷于把矛头指向著名人物和经典作品，恰恰说明了其创新能力的不足。“恶搞”不断冲击着社会的道德底线、法律底线和主流意识，导致文化虚无主义的产生，需要引起高度警惕。 \n最适合做本段文字标题的是（　　）。", "a": ["越来越多的网民对“恶搞”的消极影响有了清醒的认识", "网上“恶搞”有悖和谐理念", "牢固树立社会主义荣辱观．自觉抵制网上“恶搞”之风", "“恶搞”颠覆主流意识，混淆是非荣辱", "", ""], "r": "B", "e": "【解析】文段把“恶搞”的特点与和谐理念的要求相对照，说明“恶搞”的做法是与和谐理念相违背的，它会带来很多危害，因此应引起高度警惕。A.C.D三项均未涉及“和谐理念”这一重要信息，排除。本题选B。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46122", "t": 1, "q": "蓝鲸是地球上最大的哺乳动物，也有可能是效率最高的动物。根据加拿大英属哥伦比亚大学罗伯特夏德维克率领的研究小组公布的对265只蓝鲸觅食习惯的跟踪调查结果，蓝鲸从每次觅食行动中获取的能量是它在这一过程中消耗能量的90倍以上。觅食时，蓝鲸会潜到距海平面下500米深处，以每秒数米的速度将成群游动的磷虾吸入口中。此后，蓝鲸用鲸须将海水滤出，只剩下磷虾。研究者通过计算得出，蓝鲸每深潜吸食磷虾一次，大约要花掉3200千焦能量，但从战利品中获得的能量却高达3．4万一l91．2万千焦，最多可达所需能量的237倍。研究者指出，只有当海底磷虾的群落密度保持在一定水平之上时，庞然大物蓝鲸的高效率才能得到保障，因此，保护磷虾也是保护蓝鲸的重要一环。\n最适合做这段文字标题的是（　　）。", "a": ["高效率的蓝鲸", "保护蓝鲸", "保护磷虾就是保护蓝鲸", "蓝鲸", "", ""], "r": "C", "e": "【解析】首先，我们需要确定文段的中心思想或主题。文章主要讲述了蓝鲸的觅食效率以及其对磷虾的依赖性，并强调了保护磷虾对于维持蓝鲸高效能量获取的重要性。\nA选项“高效率的蓝鲸”虽然提到了蓝鲸的高效率，但没有涵盖文章提到的保护磷虾的重要性。\nB选项“保护蓝鲸”同样没有涉及到文章中关于磷虾的内容，仅关注于蓝鲸本身。\nC选项“保护磷虾就是保护蓝鲸”直接对应了文章的结论部分，即保护磷虾是保护蓝鲸的关键。\nD选项“蓝鲸”过于宽泛，没有具体指出文章的重点。\n根据以上分析，C选项“保护磷虾就是保护蓝鲸”最全面地概括了文章的主旨，既包括了蓝鲸的高效率也强调了保护磷虾的重要性。因此，最适合做这段文字标题的是C选项。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46123", "t": 1, "q": "在过去的几个月里，阿拉伯主要产油国、俄罗斯和三大石油消费国中的日本等国召开了一系列会议。他们正在计划结束长达65年的用美元进行石油贸易的“铁腕统治”。自1973年美国财政部官员秘密访问沙特阿拉伯以来，“石油美元”体系就主宰和控制了世界金融市场，但到2007年8月的房地产次贷危机时这种情况发生了变化。如今，在世界贸易中美元作为可靠储蓄货币的地位已无可挽回地下降了。最近，伊朗宣布未来将以欧元作为石油计价货币，不再使用美元。巴西将作为生产国及消费国加入其中。 \n最适合做本段文字标题的是（　　）。", "a": ["欧元有望取代美元成为石油计价货币", "次贷危机下美元渐趋势弱", "“石油美元”体系面临崩溃", "美元可能被逐出石油交易", "", ""], "r": "D", "e": "【解析】 这段文字主要介绍了在次贷危机的背景下，持续了65年的用美元进行石油贸易的体系出现松动，从多国就此问题召开的一系列会议，到伊朗、巴西的明确表态，无不证明了这一点。A项“欧元取代美元”的表述没有依据．文段主要讲的是美元地位下降．伊朗宣布以欧元作为石油计价货币并不能证明“欧元有望取代美元”，排除。B项“次贷危机下美元渐趋势弱”是事实，但是文段着重谈的是其作为石油计价货币这一方面，B项作为标题过于宽泛，没有涉及石油贸易的内容，排除。 C项“面临崩溃”在文段没有体现，属过度推测，排除。本题的正确答案为D。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46124", "t": 1, "q": "现在很多人对于甜味和吃糖感到排斥和恐惧，因为他们很惧怕发胖，吃一小块糖果就会胖一圈似的。其实，真正使人发胖的并不是那一小块糖果，而是每天吃的食物所包含的能量超出了消耗的能量。馒头、面条、米饭或者玉米面窝头中都有淀粉，即不甜的糖。淀粉在人体内氧化所放出的热量与蔗糖基本上没有差别。要控制发胖，主要在于控制摄入的总热量，而不在于食物的口味是不是甜的。\n最适合做这段文字的标题的是（     ）。", "a": ["吃糖与发胖", "淀粉与发胖", "发胖的“真凶”", "不发胖的“秘诀”", "", ""], "r": "D", "e": "【解析】第一步，分析文段。文段首句指出很多人对于甜味和吃糖感到恐惧的原因是怕发胖，接着用“其实”表转折，指出真正使人发胖的不是糖果而是食物包含的能量超出了消耗的能量，最后指出控制发胖的办法就是要控制摄入的总热量。通过分析文段可知，文段是“分—总”结构，重点在尾句提出的对策，如何控制发胖。第二步，对比选项。D项是对文段对策的同义替换，可以作为文段的标题。因此，选择D选项。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46125", "t": 1, "q": "人类的选举制度出了问题，其间充斥了太多的金钱和毫无意义的争辩。或许我们应将目光转向大自然，从中找寻选举的内涵，纠正或改善我们的制度。昆虫学家汤姆·西利建议我们应向蜜蜂学习。西利的研究表明，蜂巢是一个真正的民主社会，当蜜蜂需要找个新家时，地点的选择是由许多蜜蜂投票的，比如根据这一地点的大小、湿度和周围鲜花多少等“质量”参数，每只蜜蜂都用舞蹈投票，当跳某种舞蹈的蜜蜂数目足够多时，大多数的意见也就倾向于该舞蹈所代表的地点。蜜蜂不仅投票决定“迁都”，在候选蜂后的决斗中，工蜂也会以某种方式干预“选举”的走向，选择对整个蜂巢的发展最有好处的那位当女王。\n下列最适合做这段文字的标题的是（     ）。", "a": ["聪明的蜜蜂", "选举的内涵", "蜜蜂的民主", "人类的榜样", "", ""], "r": "C", "e": "【解析】文段首先提到人类的选举制度存在充满金钱和无意义争辩的问题，由此引出昆虫学家的研究，首先就指出蜂巢是真正民主的社会，进一步用投票选择新家进行证明，接下来举例说明投票方式也是民主的。而后又点出不仅“选择新家”体现民主，而且“选择蜂后”也是民主的。所以作者想表达，蜜蜂的社会处处充满民主。由此确定文段的标题，应与民主紧密相关。A项文中并未着重描写聪明，不符;B项选举的内涵文中未提及，排除;C项体现了蜜蜂社会的民主，与主旨相符;D项“人类的榜样”表述不清楚，只体现了蜜蜂，并未体现民主，不符。故本题选C。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46126", "t": 1, "q": "俄罗斯防病毒软件供应商一一卡斯佩尔斯基实验室于6月15日宣布，一个名为29A的国际病毒编写小组日前制造出了世界上首例可在手机之间传播的病毒。卡斯佩尔斯基实验室说，29A 小组于15日将这个名叫“卡比尔”的
