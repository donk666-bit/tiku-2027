00元", "增加100元以上", "减少不到100元", "减少100元以上", "", ""], "r": "A", "e": "【解析】考查比重的差值；由图表第二行和第三行，可得（45700/50）-（34200/40）=914-855=59元，选A", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46821", "t": 1, "q": "2017—2020年，出境旅游平均每人次花费最多的年份是（    ）。", "a": ["2017年", "2018年", "2019年", "2020年", "", ""], "r": "C", "e": "【解析】考查比重的计算比较；由图表，可得四个选项分别为（1045/1.166）÷（1.17/1.093）=（1045/1.17）×（1093/1166）、1045/1.17、1098/1.22、1152/1.31，最大的是1098/1.22=900，选C", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46822", "t": 1, "q": "能够从上述资料中推出的是（    ）。", "a": ["2019年，入境旅游人数增速比2018年降低1.7个百分点", "2020年，旅游业直接就业占直接和间接就业的比重不到30%", "2018—2020年，全国旅游业对GDP的综合贡献同比增速逐年增大", "2018—2020年，每年出境旅游花费同比增速都高于国际旅游收入同比增速", "", ""], "r": "A", "e": "【解析】从D项开始依次进行检验；\nD项， 由图表，可得2019年出境旅游花费同比增速5.1%＜国际旅游收入同比增速5.6%，说法错误，排除；\nC项， 由图表，可得2020年全国旅游业对GDP的综合贡献同比增速11.5%＜2019年11.6%，说法错误，排除；\nB项，由图表，可得2825÷7990 ＞30%，说法错误，排除；\nA项，由图表，可得3%-4.7%=-1.7%，说法正确，选A", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46823", "t": 1, "q": "2018年全国房地产开发投资额为多少亿元？（    ）", "a": ["71790.8", "67835.2", "31248.1", "24156.3", "", ""], "r": "A", "e": "【解析】考查隔年前期；由第一段（2020年，全国房地产开发投资95036亿元，比上年增长10.5%，增速比2019年回落9.3个百分点），可得R1=10.5%、R2=10.5%+9.3%=19.8%，隔年增长率=R1+R2+R1×R2=10.5%+19.8%+10.5%×19.8%≈32.4%，2012年全国房地产开发投资额=95036÷（1+32.4%），结合选项，选A", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46824", "t": 1, "q": "2020年，全国商品房销售面积比上年减少多少万平方米？（    ）", "a": ["10004.7", "9923.5", "9014.2", "8799.3", "", ""], "r": "B", "e": "【解析】考查增长量的计算；由第二段（2020年，全国商品房销售面积120649万平方米，比上年下降7.6%≈1/13），份数法可得同比减少量=120649/12，结合选项，排除CD；假设减少量为10000，可得真实减少量=（120649+10000）×7.6%≈9929，选B", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46825", "t": 1, "q": "2019年西部地区商品房销售价格为（    ）。", "a": ["3694元/平方米", "4674元/平方米", "4888元/平方米", "5008元/平方米", "", ""], "r": "C", "e": "【解析】考查前期平均数；由第三段（西部地区商品房销售面积32068万平方米，增长0.6%；销售额16127亿元，增长3.5%），可得2019年西部地区商品房销售价格=（16127/1.035）÷（32068/1.006）≈（1612/3206）×（1006/1035），结合选项，选C", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46826", "t": 1, "q": "2019年，东部地区住宅投资占投资额的比重约为（    ）。", "a": ["<p>72%<\/p>", "<p>68%<\/p>", "<p>52%<\/p>", "<p>48%<\/p>", "", ""], "r": "B", "e": "【解析】考查前期比重；由图表，可得2019年东部地区住宅投资占投资额的比重=（35477/1.085）÷（52941/1.104）≈（354/529）×（1104/1085），结合选项，选B", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}, {"id": "46827", "t": 1, "q": "能够从上述资料中推出的是（    ）。", "a": ["2019年东部地区的商品房销售额超过50000亿元", "2020年我国东部地区住宅投资额低于中、西部地区之和", "2020年我国东部地区房地产投资额是西部地区的3倍多", "2020年住宅投资占房地产开发投资的比重不到七成", "", ""], "r": "D", "e": "【解析】从D项开始依次进行检验；\nD项，由第一段（2020年，全国房地产开发投资95036亿元。其中，住宅投资64352亿元），可得64352÷95036 ＜70%，说法正确，选D\nC项，由图表，可得52941÷21433 ＜3，说法错误，排除；\nB项，由图表，可得35477 ＞（14552+14323），说法错误，排除；\nA项，由最后一段（2020年，东部地区销售额43607亿元，下降11.6），可得43607÷（1-11.6%） ＜50000，说法错误，排除；", "l3": "一般能力", "l4": "1.资料分析", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||2.篇章阅读", "n": "一般能力 / 2.篇章阅读", "qs": [{"id": "46828", "t": 1, "q": "第1段中的“这个角度”指的是（     ）。", "a": ["高票房有可能一举扭转中国电影市场的惨淡现状", "原著给电影剧本留下了丰富的再创作线索和空间", "电影体现出了有史以来中国科幻电影的最好水平", "科普与文学意识在中国科幻文学创作中相得益彰", "", ""], "r": "B", "e": "【解析】定位原文第一段，“这个角度”指代前文的内容，文段开篇阐述电影讲述的故事在小说原著中只是几小段文字，这为中国科幻提供了一个宏阔的背景。接着均是在具体阐述电影是通过时间来体现宏阔的背景。最后通过“也就是说”表总结，强调《流浪地球》所展现出的无限可能性以及不断拓展的想象力。故“这个角度”指的是小说原著为电影剧本所留下的广阔空间，对应Ｂ项。\nＡ项“扭转……惨淡现状”、Ｃ项“有史以来……最好水平”在第一段中均未提及，无中生有，排除；\nＤ项“相得益彰”强调的是两者结合发挥更好的作用，而文段只是提及小说为电影提供了一个宏阔的背景，与文意不符合，排除。\n故正确答案为Ｂ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46829", "t": 1, "q": "“既看到长处也看到短板，既不棒杀也不捧杀，才能激励文化产品质量的进一步提升。”这句话应放到最\n后一段中的（     ）。", "a": ["①处", "②处", "③处", "④处", "", ""], "r": "C", "e": "【解析】题干文字表意为要对文化产品客观公正地看待才能提升质量，且题干文字要与上下文连接紧密。分析可知，③处之前介绍观众要多提中肯建议，题干文字可以对其进行进一步解释，③处之后进一步提到指出不足和给予支持的意义，题干放在③处与上下文连接紧密，Ｃ项当选\nＡ项，若放在①句处，不能与“但”之后构成转折，排除；\nＢ项，②处之前介绍了电影成为公共话题，体现观众对中国科幻的期待，与题干文字的话题连接不紧密，排除；\nＤ项，④处之前提到“迎接中国科幻真正的春天”，是对文段的总结升华，而题干内容只是提及客观评价激励文化产品质量提升，程度不及文段尾句，不宜放在④处，排除。\n故正确答案为Ｃ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46830", "t": 1, "q": "第3段作者意在强调（     ）。", "a": ["中国科幻电影发展动力强劲", "中国电影的商业前景非常可观", "中国科幻文学的发展带来了科幻电影热", "中国科幻产业的发展需要更多科幻作家", "", ""], "r": "A", "e": "【解析】定位第３段，段首说明成熟的电影需要有强大的文化体系支撑，后文通过并列，分别介绍了科幻文学的发展带来了人们对科幻的热情，以及中国电影票房的总体向好趋势。尾句“这”总结前文，强调科幻文学热和人们对电影的热情，助推人们对科幻电影充满期待，可对应Ａ项“中国科幻电影发展动力强劲”，当选。\nＢ项“中国电影”表述错误，结论句中强调的是“中国科幻电影”，排除\nＣ项“科幻文学”表述片面，仅对应文段中并列的第一个方面，未提及中国电影票房的走高趋势，排除；\nＤ项“中国科幻产业”概念扩大，文段重点在于“科幻电影”，排除。\n故正确答案为Ａ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46831", "t": 1, "q": "以下说法符合作者观点的是（     ）。", "a": ["中国式科幻的发展亟待科学知识的普及来推动", "培养年轻观众对国产科幻电影的热情卓有成效", "中国科幻电影的制作水平已达到世界一流水平", "中国科幻类文艺作品的创作遇到了最好的时代", "", ""], "r": "A", "e": "【解析】本题为细节判断题，根据文意可知，当代中国科学热情高涨，推动了中国科幻的发展，Ａ项符合文意，当选。\nＢ项“培养年轻观众”无中生有，排除；\nＣ项“已达到世界一流水平”表述绝对，与文段不符，文段中为“与经典还有一些差距”，排除；\nＤ项“最好的时代”表述绝对，根据文段尾句可知，当前还不是中国科幻真正的春天，排除。\n故正确答案为Ａ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46832", "t": 1, "q": "第2段中提到电影中体现的中国文化价值观是（     ）。", "a": ["功崇惟志，业广惟勤", "天下之本在国，国之本在家", "宰相起于州部，猛士起于卒伍", "志之所趋，无远勿届，穷山距海，不能限也", "", ""], "r": "B", "e": "【解析】定位第二段，文段首句提及《流浪地球》电影出现了许多中国元素，接着阐述这些元素均是体现了中国式的对家的向往、对故土的眷恋，对应Ｂ项“天下之本在国，国之本在家”，意为天下的基础是国，国的基础是家。\nＡ项“功崇惟志，业广惟勤”意思是取得伟大的功业，是由于有伟大的志向；完成伟大的功业，在于辛勤不懈地工作，未提及对家国的向往眷恋之情，不符合文意，排除；\nＣ项“宰相起于州部，猛士起于卒伍”意思是宰相一定从基层州部兴起，猛将一定从基层卒伍发端，强调国家的文臣武将，特别是选拔高层的官员和将领，一定要从有基层实际工作经验的人中选拔，未提及对家国的向往眷恋之情，不符合文意，排除；\nＤ项“志之所趋，无远勿届，穷山距海，不能限也”意思是一个人如果有足够的志向，他要到达的地方不论多远，他最终都能到达，穷山距海也不能限制，未提及对家国的向往眷恋之情，不符合文意，排除。\n故正确答案为Ｂ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46833", "t": 1, "q": "本文说岩芯就像地球的“起居注”，与这里的“起居注”意思最接近的是（     ）。", "a": ["年轮", "副本", "扫描仪", "刻度尺", "", ""], "r": "B", "e": "【解析】“起居注”处于第二段。文段介绍岩芯就像地球的“起居注”，并说明岩芯的作用，即是一天不落地记录了地球的生活作息和成长经历。后文则对岩芯的记录功能进行了解释说明。故“起居注”即体现岩芯对地球的生活作息和成长经历的记录功能。Ｂ项“副本”的作用即是复制，能体现出原主体的生活作息和成长经历，当选。\nＡ项，“年轮”仅能记录年岁，无法记录地球的生活作息和成长经历，选项与文意不符，排除；\nＣ项，“扫描仪”是一种捕获事物影像的装置，无法体现地球的生活作息和成长经历，选项与文意不\n符，排除；\nＤ项，“刻度尺”的功能是测量物体长度，选项与文意无关，排除。\n故正确答案为Ｂ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46834", "t": 1, "q": "关于“地壳一号”，下列说法不正确的是（     ）。", "a": ["我国拥有自主知识产权", "整个操作流程无需人工干预", "钻机设备总重量超过一千五百吨", "钻深可超珠穆朗玛峰的海拔高度", "", ""], "r": "B", "e": "【解析】定位文段，“地壳一号”出现在第３、４段。\nＢ项，根据第３段“工人只需在操作室触动按钮和监测，钻地设备就可自动完成全套动作”可知，运行过程中需要人工参与，故“无需人工干预”表述错误，当选。\nＡ项，根据第３段“我国虽然起步较晚，但地理环境可谓得天独厚终于研制成功了属于自己的钻探利器‘地壳一号”，故“我国拥有自主知识产权”符合文意，排除。\nＣ项，根据第３段“组装前的钻机设备总体积6000余立方米，总重量1500多吨”可知，“钻机设备总重量超过一千五百吨”符合文意，排除。\nＤ项，根据第3段“钻机钻深预计可达万米”可知，钻深可以超过珠穆朗玛峰的海拔高度，符合文意，排除。\n本题正确答案为Ｂ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46835", "t": 1, "q": "“地壳一号”之所以选择大庆油田进行钻探是因为（     ）。", "a": ["油田有雄厚的技术力量", "油田技术人员全程参与研发", "交通运输条件非常便利", "当地有比较理想的地质构造", "", ""], "r": "D", "e": "【解析】定位文段，“大庆油田”出现在第４自然段。根据第４自然段“地壳一号’所在的大庆油田‘松科２井’将与已经完成的‘松科１井’钻探成果一起，构成完整的白垩系岩芯”及第２自然段“岩芯就像地球的‘起居注’，一天不落地记录了地球的生活作息和成长经历”可知，大庆油田具有可供研究的“岩芯”，即“比较理想的地质构造”，对应Ｄ项。\nＡ项“雄厚的技术力量”，Ｂ项“油田技术人员全程参与研发”，Ｃ项“运输条件非常便利”文段均未提及，无中生有，故排除Ａ、Ｂ、Ｃ三项。\n故正确答案为Ｄ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46836", "t": 1, "q": "“地壳一号”的预期成果将与下列哪项研究关系最为密切（     ）。", "a": ["全球气候", "物种灭绝", "机械制造", "地球构造", "", ""], "r": "A", "e": "【解析】A项，对应文章第四段“将对我们今天的全球气候变化研究意义重大”，内容相符；\nB项“物种灭绝”、C项“机械制造”以及D项”地球构造“都不是文段当中所提及的“预期成果”，排除。\n故正确答案为Ａ", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46837", "t": 1, "q": "如果本文的副标题为“‘地壳一号’成功研制”，主标题最恰当的是（     ）。", "a": ["从“上天”到“入地”", "从“地表”到“地心”", "从“凿井取水”到“万米钻探”", "从“一穷二白”到“世界领先”", "", ""], "r": "C", "e": "【解析】篇章第一段交代我国古代“凿井取水”的历史，第二段说明科学家对于研究岩芯充满了好奇，第三段引出了我国的钻探利器“地壳一号”并对其性能进行具体解释说明，同时说明该机器探测深度“可达万米”，第四段说明“地壳一号”可能带来的研究成果。故该文段实际上为沿时间线展开的脉络，若取主标题可将古今两方面进行概括，即“凿井取水”到“万米钻探”对应Ｃ项。\nＡ项未提及文段主题词“凿井取水”，且“上天”文段未提及，无中生有，排除；\nＢ项，文段未提及研究“地表”，且文段重点讨论的是“岩芯”而非“地心”，排除；\nＤ项“世界领先”文段未提及，且“地壳一号”探测深度“预计可达万米”，而目前世界上最深的钻可达12262米，确实也不属于“领先”的状态，排除。\n故正确答案为Ｃ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46838", "t": 1, "q": "填入文中画横线处最恰当的是（     ）。", "a": ["原理和特性", "产生与发展", "运用与前景", "方法和用途", "", ""], "r": "A", "e": "【解析】本题为语句填空题，横线出现在第一段中间，需结合上下文。文段开篇论述索引是揭示人类知识内在关联的认知方式，指出了索引是什么，即检索工具的原理，横线后论述了索引的三个功能，指出“传统的检索工具，其实是人类认知思维的外在表现”，即索引的功能特点，故横线处指的是索引所具有的原理和特征，对应Ａ项。\nＢ项索引的“发展”、Ｃ项索引的“前景”、Ｄ项索引的“方法”本段均未提及，属于无中生有，排除。故正确答案为Ａ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46839", "t": 1, "q": "作者认为检索工具产生的根本原因在于（     ）。", "a": ["学者需要将其作为学术研究的工具", "学者需要将其作为学术评价的标准", "人们需要这样一种构建庞大知识体系的基本规则", "人们需要这样一种揭示知识内在关联的认知方式", "", ""], "r": "D", "e": "【解析】根据第一段“索引以及一切检索工具，本质上都是揭示人类知识内在关联的认知方式，而且完全符合人类的认识习惯”可知，检索工具产生的根本原因在于它是一种帮助人类揭示知识内在关联的认知方式，对应Ｄ项。\nＡ项，“学术研究的工具”可对应“学术进阶的工具”，属于索引的功能，而非产生原因，排除；\nＢ项，“学术评价的标准”为索引的功能，与其产生原因无关，排除；\nＣ项，“构建庞大知识体系的基本规则”可对应“构建新媒体时代人类知识体系的基础”，为索引揭示的知识规则，并非其产生的根本原因，排除。\n故正确答案为Ｄ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46840", "t": 1, "q": "根据文意，索引的“知识扩展”有两种形式，其区别主要在于（     ）。", "a": ["关键词跳转方式是否可以循环", "是闭合式扩展还是开放式扩展", "涉及的文献是有限还是无限的", "知识扩展的模型是否受到限制", "", ""], "r": "B", "e": "【解析】“索引的‘知识扩展’有两种形式”出现在第二段，根据文意可知，索引有知识扩展和模式识别两种形态。知识扩展又分为两种形式，其一是在一个文献内部进行关键词的检索，是一种闭合循环的知识扩展模型；其二是检索关键词时，可以从一本书跳转至多种文献，是一种开放式的知识扩展模型，故两种形式的主要区别就在于一个是一本书内部的闭合式扩展，另一个是开放式的向外扩展，对应Ｂ项。\nＡ项，知识扩展的第二种形式仅指出其为开放性向外扩展的，未提及其能否进行“关键词跳转循环”，故无法判断其是否为两者的主要区别，排除；\nＣ项，文段并未提及涉及的文献的数量，属于无中生有，排除；\nＤ项，文段并未阐述知识模型是否受限制，属于无中生有，排除。\n故正确答案为Ｂ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46841", "t": 1, "q": "下列关于“知识图谱”的描述不符合文意的是（     ）。", "a": ["其架构被称为生物分子模型", "是相关知识有序形成的体系", "就像是将知识点有序串联起来的项链", "可以帮助人类更好地认识主客观世界", "", ""], "r": "A", "e": "【解析】Ａ项，根据第四段“知识图谱的综合架构有点像生物分子模型”可知，文中仅指出知识图谱的架构有点像生物分子模型，并非指出其被称为生物分子模型，故表述有误，当选。\nＢ、Ｃ两项，根据第三段“由此形成的知识图谱，是有关联的、有序的知识集合。这个知识集合中，\n所有知识点都在一个相互关联的网络体系中，不是单个的珠子，而是固定在一串项链上”可知，该\n两项均表述正确，排除；\nＤ项，根据第五段“这种知识管理方案·…深入地认识主观世界和客观世界”可知，“这种知识管理方案”应当指代前文知识图谱管理方案，故知识图谱可以帮助人类更好地认识主客观世界，表述\n正确，排除。\n本题正确答案为Ａ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46842", "t": 1, "q": "下列最适合做文章标题的是（     ）。", "a": ["学术检索不可或缺的工具——索引", "索引——人类记忆能力的延续", "索引的作用与意义", "文献处理离不开索引", "", ""], "r": "C", "e": "【解析】文章开篇引出“索引”这一话题，第一段指出“索引”的本质及其存在的意义和功能。第二段，介绍“索引”的两种形态，并论述了其功能原理；第三段到第五段，指出“索引”的两种形态将形成“知识图谱”并指出其原理和作用。故本篇文章围绕“索引”，强调索引可以形成知识图谱发挥作用，对人类认识世界有积极影响，对应Ｃ项。\nＡ项强调索引在“学术检索”中的作用，Ｄ项强调索引在“文献处理”中的作用，根据“索引…本质上都是揭示人类知识内在关联的认知方式”“辅助人类更广阔、深入地认识主观世界和客观世界”可知，“索引”并非单纯使用于“学术”“文献”领域，故均表述片面，排除；\nＢ项，“人类记忆能力的延续”，文段并未提及，无中生有，排除。\n故正确答案为Ｃ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46843", "t": 1, "q": "文中划线部分“这个原理”是指（     ）。", "a": ["植物生长需要的养分是矿物质而非有机质", "矿物质出现的时间早于植物分解产生的腐殖质", "有机肥料被作物吸收必须先经过矿化过程", "有机物向矿物质转化时需要微生物的介入", "", ""], "r": "C", "e": "【解析】“这个原理”指代前文，前文指出，植物生长需要矿物质，而有机肥料施入土壤都要经历矿化过程，分解为矿物质，最终被植物吸收，并详细介绍了这一过程。故“这个原理”所指的是有机肥料需要经过矿化过程才能被植物根系吸收，对应Ｃ项。\nＡ项，是有机肥料需要经历矿化过程的大前提，并非“这个原理”所指代的过程，排除；\nＢ项，在文中的作用是论证植物生长需要的氧分是矿物质，并非“这个原理”所指代的内容，排除；\nＤ项，位于第一段结尾，在“这个原理”之后，不属于其所指代的内容，排除。\n故正确答案为Ｃ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46844", "t": 1, "q": "关于复合肥，下列说法与文章不符的是（     ）。", "a": ["技术上是可以实现微量元素添加", "施用后产生的也是有机农产品", "有助于降低施肥时的劳动成本", "同时含有氮磷钾三种养分", "", ""], "r": "D", "e": "【解析】Ａ项，对应第二段所述，“有的复合功效专用肥甚至还加了一些微量元素”，表述正确，排除；\nＢ项，对应第三段开头，“值得指出的是，施用有机肥和化肥生产出来的农产品都是有机的”，表述正确，排除；\nＣ项，对应第二段所述，“更主要是为了降低施肥的劳动成本，许多化肥厂家生产出了多种复合肥”，表述正确，排除；\nＤ项，第二段指出复合肥是“含有两种及两种以上养分的化肥”，并不一定同时含有三种养分，表述错误，当选。\n本题正确答案为Ｄ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46845", "t": 1, "q": "根据文意，下列说法正确的是（     ）。", "a": ["有机肥所含矿物质繁多更能满足作物快速生长需求", "大部分土壤并不需要补充氮磷钾外的其他养分", "种植过程中施用有机肥能够有效提升农产品的口感", "土壤肥料科学研究否认了有机小分子化合物的存在", "", ""], "r": "B", "e": "【解析】Ａ项，对应第四段“而且一般来说，化肥能够提供高浓度的速效养分，可以及时快速满足作物生长旺盛时期对养分的大量需求”，并没有指出有机肥能够满足作物快速生长需求，排除；\nＢ项，对应第二段“其实，除了某些区域缺乏某种营养元素外，其他矿质养分，其在土壤中的含量（由岩石矿物风化而来和通过生物小循环聚集）基本能够满足作物生产需要，不需要单独施用”，表述正确，当选；\nＣ项，对应第三段，很多人抱怨化肥生产出来的农产品“没有味道”，但随后解释说，更可能是因为施用化肥生产，导致作物还没有“性成熟”就被采摘，并非“有机肥能够有效提升农产品的口感”，排除；\nＤ项，对应第三段“这也许是因为某些目前土壤肥料科学还没有证实的有机肥中的有机官能团或简单的有机小分子化合物进入瓜果蔬农产品所起到的作用”，文意是目前的土壤肥料科学还没有能够证实有机小分子化合物起到的作用，但并非否认有机小分子化合物的存在，排除。\n故正确答案为Ｂ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46846", "t": 1, "q": "根据文意，不属于鼓励施用有机肥目的的是（     ）。", "a": ["减少焚烧秸秆引发的空气污染", "通过资源循环利用降低生产成本", "促进畜禽养殖废弃物的资源化", "改善土壤品质以提升农产品质量", "", ""], "r": "D", "e": "【解析】Ａ项，对应第四段最后“鼓励和推广有机肥的主要目的，并非为了生产‘有机食品’，而是要把作物生产过程所产生的‘有机废弃物’，包括秸秆和人畜排泄物，进行资源再利用，减少化肥的使用量，减少排放，还有利于环境保护”，属于目的，排除。Ｂ项，对应第二段“更主要是为了降低施肥的劳动成本，许多化肥厂家生产出了多种复合肥”，且结合第四段最后所述，使用有机肥可以“进行资源再利用”，属于目的，排除。Ｃ项，对应第四段尾句“包括秸秆和人畜排泄物，\n进行资源再利用”，属于目的，排除。Ｄ项，文中没有提到“改善土壤品质”“提升农产品质量”，无中生有，当选。本题为选非题，故正确答案为Ｄ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46847", "t": 1, "q": "最适合做文章标题的是（     ）。", "a": ["正确认识有机肥和化肥", "有机肥和化肥孰优孰劣", "什么是植物真正需要的养分", "揭秘“有机产品”背后的真相", "", ""], "r": "A", "e": "【解析】文章第一段介绍了有机肥堆腐的原理，第二段比较化肥和有机肥能够提供的营养元素，并介绍了复合肥的养分，第三段介绍有机肥和化肥生产出来的农产品并无太大差别，第四段分别介绍了化肥和有机肥的优势。故文章围绕“有机肥和化肥”进行了较为全面的介绍，对应Ａ项。\nＢ项，文章并没有重点比较二者的优劣，且根据第二、三、四段的首句可以看出，作者更倾向于认\n为二者区别不大，排除；\nＣ项，文章的核心话题是化肥和有机肥，而非植物所需的养分，排除；\nＤ项，“有机产品”并非文段核心话题，排除。\n故正确答案为Ａ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46848", "t": 1, "q": "填入第3段画横线处最恰当的一句是（     ）。", "a": ["学而不思则罔，思而不学则殆", "德之不修，虽学有道，其行不远", "非淡泊无以明志，非宁静无以致远", "博学之，审问之，慎思之，明辨之，笃行之", "", ""], "r": "B", "e": "【解析】横线处于文段中间，由“所谓”可知横线处语句与前文形成对应关系。第３段首先提出保持价值标准的一致性是学理和学品的要求，接着提到学者内心修为不够、没有反思自己的悟性，会影响学业修为的提高，即是强调德行对学业能力的影响，故横线应该体现出德行的重要性，对应Ｂ项，意为德行修为不够，即便是有学问也不能长久提升，符合文意。\nＡ项强调学习与思考的相互关系，与前文无关，排除；\nＣ项是指一个人须恬淡寡欲方有明确的志向，须寂寞清静才能达到深远的境界，文中没有提到“清心寡欲”和“宁静寂寞”，排除；\nＤ项是关于治学的名言，没有提到德行的重要性，排除。\n故正确答案为Ｂ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46849", "t": 1, "q": "作者最不可能赞同下列哪一说法？（     ）", "a": ["学者要做到能说真话必须说真话", "知识分子是一个国家的良心", "学者需通晓各门学问才能传道授业解惑", "学者治学需要知行合一", "", ""], "r": "C", "e": "【解析】由最后一段“辨别学者的理论观点只有一个办法，就是看其能否保持价值标准的一致性，能够言行一致的就是真学，不能言行一致的就是伪学”可知，作者认为学者要说话行动标准统一，对真实知识执着说真话，Ａ项与作者观点一致，排除；\n由第二段“学者作为一个社会的文化传承者和文明守望者”、第四段“学品如人品”可知，作者认为学者对国家社会尤为重要，而学者的德行、知行合一直接影响了一个国家的文化文明发展，故Ｂ项与作者观点相符，排除；\n由第一段“学者以学问立身，并不主要看其涉猎学科领域、通晓概念术语的多少，而是看其是否具有稳定的价值系统，立言立行是否具有一以贯之的标准”可知，作者认为，学者重要的是价值标准统一，而非是涉猎多少学科领域通晓多少学问，Ｃ项表述错误，当选；\n由第四段“辨别学者的理论观点只有一个办法，就是看其能否保持价值标准的一致性，能够言行一致的就是真学，不能言行一致的就是伪学”可知，学者治学要知行合一，Ｄ项与作者观点相符，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46850", "t": 1, "q": "作者认为当今难以出现宗师大家的原因不包括（     ）。", "a": ["学科划分细化", "学说流派多样", "知识总量膨胀", "学者人浮于事", "", ""], "r": "D", "e": "【解析】当今难以出现宗师大家的原因对应第一段。\nＡ项“学科划分细化”，对应文段“门类越来越细化”，表述正确，排除；\nＢ项“学说流派多样”，对应文段“各种学说流派、各种观点五花八门”，表述正确，排除；\nＣ项“知识总量膨胀”，对应文段“社会知识总量的快速膨胀，带来了学科间的认知障碍”，表述正确，排除。\nＤ项“人浮于事”在文段中并未提及，无中生有，当选。\n本题正确答案为Ｄ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46851", "t": 1, "q": "作者眼中的“聪明人”具有下列哪一特征？（     ）", "a": ["学得快也忘得快", "价值标准不统一", "对学业的理解空泛肤浅", "经常在学术上追新求异", "", ""], "r": "B", "e": "【解析】由第二段“这恰恰是精于利益算计、价值标准游移不定的‘聪明人’做不来的”可知，文中的“聪明人”对价值标准存在变化不统一的情况，对应Ｂ项。\nＡ项“学得快也忘得快”、Ｃ项“对学业的理解空泛肤浅”、Ｄ项“在学术上追新求异”均为无中生有，不是文段所强调的聪明人，排除。\n故正确答案为Ｂ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46852", "t": 1, "q": "最适合作为本文标题的是（     ）。", "a": ["学者、学问与学品", "学者、学问与学识", "学问、学识与学品", "学者、学问与学业", "", ""], "r": "A", "e": "【解析】文章开篇指出很难再出现通晓各门学问的宗师大家，然后以转折关联词“但”强调学者以学问立身，重点不在于懂得多少知识，而是其立言立行是否具有一以贯之的标准，引出“学者”、“学问”这两个话题，之后第二段介绍了学者所应具备的特点，第三段论述稳定的价值标准对学品的重要性，第四段进一步论述学品，强调学品对于学者的重要性，故整个文段讨论的就是学者、学问与学品之间的关系，对应Ａ项。\nＢ项，未涉及“学品”，偏离文段中心，排除；\nＣ项，缺少主体“学者”，排除；\nＤ项，“学业”仅为第三段中涉及的内容，非重点，且没有提及“学品”，排除。\n故正确答案为Ａ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46853", "t": 1, "q": "“笼统地说，记忆的形成和神经元之间特定的电活动有关。”这句话最适合填入文中第1段哪个位置？（     ）", "a": ["①", "②", "③", "④", "", ""], "r": "B", "e": "【解析】题干句子由“笼统地说”对前文进行了总结，并介绍记忆的形成与神经元活动有关，分析第一段，②处之前论述记忆的形成机制不清楚，②处之后论述记忆离不开神经元的活动，将题干填在此处，“笼统地说”即为对前文形成机制不清楚的简单概括，并由此引出后文的话题“记忆与神经元间的活动有关”，衔接恰当，对应Ｂ项。\nＡ项，①处前后句子均未提到“记忆与神经元活动的关系”，话题不一致，排除；\nＣ项，③处“这一过程”即指代前文的过程，与题干衔接不恰当，排除；\nＤ项，前文对记忆与神经元活动间的关系给了很具体的阐述，故题干中的“笼统地说”衔接在此处不恰当，排除。\n故正确答案为Ｂ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46854", "t": 1, "q": "本文可用于反驳以下哪项观点？（     ）", "a": ["早晨记忆力最好", "幼儿阶段是一生中记忆最强的", "人们遗忘的速度是先快后慢", "重复有助于强化记忆", "", ""], "r": "A", "e": "【解析】文段开篇指出记忆的形成机制尚没有确切的结论，如何衡量记忆的效果也是众说纷纭，更不要说对何时的记忆更高效进行判定和解析了，然后指出记忆与神经元活动有关，第二段第三段指出影响记忆的多种因素，充足的睡眠、愉快的心情、生物钟等等，并进一步指出我们并不能一刀切地宣布，什么时间是记忆最好的时候，最后一段补充说明，故作者认为是无法判断何时的记忆力最好，而Ａ项和作者的观点恰恰相反，当选。\nＢ项“幼儿阶段是一生中记忆最强的”，虽然和文段所涉及的记忆有关，但文段并不强调人生当中的哪个阶段，排除；\nＣ项“遗忘速度的快慢”，Ｄ项“重复有助于强化记忆”在文章中均未涉及到，无中生有，排除。\n故正确答案为Ａ。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46855", "t": 1, "q": "下列哪项可以作为支持第2段观点的例证？（     ）", "a": ["盘旋在支架上的牵牛花的藤在旋转时，一律按逆时针方向盘旋而上，如果人为地将其缠成左旋，它生出新藤后仍不改右旋特性", "奥地利生物学家孟德尔发现，把一种开紫花的豌豆种和一种开白花的豌豆种结合在一起，第一次结出来的豌豆开紫花，第二次紫白相间，第三次全白", "18世纪法国科学家德梅朗发现，含羞草叶片在恒定的黑暗环境下仍表现出24小时的波动性变化", "山东济宁府北宋土层中出土的莲子“沉睡千年”后在浙江杭州复活，生出了嫩绿茎叶", "", ""], "r": "C", "e": "【解析】根据文章第２段，开头指出人体存在相对合适的状态，接着对其进行进一步解释，然后通过指代词“这”对前文总结强调生物体存在节律性。接着列举科学家的例子进行解释说明，强调“生物体的状态随着时间的进展，受到内源性的调节”，最后通过指代词“这”对前文进行总结，强调生物体存在周期性的24小时的生物节律。对应Ｃ项，含羞草片在黑暗环境下的仍24小时波动性变化符合观点中24小时的生物节律的特征。其中，“在恒定的黑暗环境下仍表现”，即不管黑暗还是光明均会发生变化，对应“随时间的进展，受到内源性的调节”，“24小时波动性变化”对应“24小时的生物节律”，可以作为观点的例证。\nＡ项，牵牛花藤的右旋特性没有体现出“24小时的生物节律”，不符合文段观点，排除；\nＢ项，豌豆开花体现出的是生物体的状态随着杂交导致的内源性变化而变化，并且没有体现出24小时的周期性调节，排除；\nＤ项，古莲子萌发，并未体现出“24小时的生物节律”，排除。\n故正确答案为Ｃ项。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46856", "t": 1, "q": "下列说法符合文意的是（     ）。", "a": ["记忆相对高效的时段并不存在", "每个人都有适合自己的记忆方法", "衡量记忆的效果有公认的标准", "自主性生物钟对记忆影响的研究可行性很高", "", ""], "r": "B", "e": "【解析】根据文章第４段“我们只要花一些时间，在不同的时间段做同样的学习，过一段时间比较效果，用这种方法摸索出适合自己记忆的方法”可知，适合自己的记忆方法可以通过自己的摸索来得出，Ｂ项符合文意，当选。\nＡ项，“记忆相对高效的时段并不存在”表述错误，根据文章第２段“虽然人体是复杂的系统，但总会存在一个相对合适的状态。这个状态合适的时间，便是记忆相对高效的时间”，只是说明相对高效的时间难以确定，并非该时段不存在，表述过于绝对，排除；\nＣ项，根据文章第１段“如何衡量记忆的效果也是众说纷纭”可知，衡量记忆的效果没有标准，与文意\n相悖，排除；\nＤ项，根据文章第３段“想要知道自主性生物钟对记忆的影响，需要先把其他所有因素都排除掉……这显然很难做到”可知，“可行性很高”与文意相悖，排除。\n故正确答案为Ｂ项。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46857", "t": 1, "q": "<p>文中提到可能影响记忆力的因素有（ ）。<\/p>\n<p>①激素水平 ②性别 ③认知风格 ④遗传基因 ⑤饮食习惯<\/p>", "a": ["<p>①③⑤<\/p>", "<p>①②③<\/p>", "<p>③④⑤<\/p>", "<p>②③④<\/p>", "", ""], "r": "A", "e": "【解析】根据文章第１段“体内激素水平的高低，都会影响记忆的形成”可知，“激素水平”是可能影响记忆力的因素；根据文章第３段“需要先把其他所有因素都排除掉……不能有个性化的情感，不能有个性化的认知，也不能有个性化的饮食”可知，“认知风格、饮食习惯”是可能影响记忆力的因素。\n①③⑤在文章中有提及，对应Ａ项。②④两项文段没有提及。\n故正确答案为Ａ项。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46858", "t": 1, "q": "填入文中最后一段画线处最恰当的一项是（     ）。", "a": ["功能互补、优势倍增", "相辅相成、锦上添花", "各具优势、分工协作", "互为表里、相得益彰", "", ""], "r": "A", "e": "【解析】横线位置居中，结合前后文。开头引出新船将与“雪龙”号组成极地科考破冰船队这一背景，接着横线前出现结论引导词“使”，故前文“将通过专业定位和分工”为其原因，再根据后文所述，“雪龙”号将充分发挥其强大的后勤补给能力，以后勤保障支撑为主，而新船将发挥其独特的综合极区海洋调查能力，以极区海洋科考调查作业为主。可见二者进行了明确的分工，发扬了各自的优势，A项“功能互补，优势倍增”体现出了二者在功能上互相补充，分工合作，从而使各自的优势更加明显，当选。\nB项，强调两者相互配合，好上加好，并未体现分工明确，排除；C项，“各具优势”是二者本身就具有的，而非“通过专业定位和分工”使二者各具优势，不能构成因果关系，排除；D项，“互为表里”指互相之间是表与里的关系，文段中“雪龙”号与新船是相互配合，并非“互为表里”，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46859", "t": 1, "q": "“新船的出现，并不意味着‘雪龙’号要退出历史舞台。”填入文中哪处最为合适？（     ）", "a": ["①", "②", "③", "④", "", ""], "r": "C", "e": "【解析】这是一道变型的语句填空题，需保证题干中的语句与上下文话题一致，衔接得当。“新船的出现，并不意味着‘雪龙’号要退出历史舞台。”围绕“新船”与“雪龙”号展开，强调“雪龙号”并未因新船的出现而被淘汰，还是能发挥作用的。\n③处，前文指出“雪龙号”无法满足需求以及“新船”可以改变现有困局；后文介绍新船和“雪龙”号组成破冰船队，“雪龙”号发挥强大的后勤补给能力，即“雪龙号”未被淘汰，仍有用武之地。题干中的句子可与上下文衔接，故答案锁定C项。\nA项，①处分析建造新船的原因，B项，②处从两个方面分析新船的作用，均与“雪龙号”仍可以发挥作用无关，无法衔接，排除A.B项；\nD项，④处强调“破冰能力更强的破冰船”，话题不一致，排除D项。\n故正确答案为C。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46860", "t": 1, "q": "文中第2段举海洋水体环境调查的例子是为了说明新一代极地科考破冰船（     ）。", "a": ["缩短了海表面科学观测的时间和周期", "调查装备和手段均达世界先进水平", "使科考作业的周期大大延长", "改变了极地海洋科学研究的调查方式", "", ""], "r": "B", "e": "【解析】文段先概括介绍建造新船的原因，并指出新船的出现“将改变我国极地科考的作业模式”。随后通过两方面详细介绍，一方面是“延长科考作业的时间窗口”，另一方面是“新船将配备国际先进的海洋环境和地球物理调查装备，还将实现国际先进的极地海洋科学综合调查手段”。随后举了“海洋水体环境调查”的例子，在例子中，突出了“新船配备的相关系统”的重要作用，故举例的目的是为了体现出新船的装备以及调查手段的先进性，B项当选。\nA项，“缩短观测时间和周期”属于无中生有，排除；\nC项，为第一方面的内容，而例子对应的是“另一方面”的内容，排除；\nD项，文段为“将改变我国极地科考的作业模式”为将来时态，选项“改变了”为过去时，与文段不符，且是前文所述的内容，与例子无直接关系，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46861", "t": 1, "q": "新一代极地科考破冰船最突出的创新之处是（     ）。", "a": ["驾驶室采用了360度视野设计", "采用了全电力推进系统", "提升了低温环境下的作业防护能力", "可以实现双向破冰", "", ""], "r": "D", "e": "【解析】根据第一段所述，“双向破冰，即船头和船尾均可破冰，是新船的最大亮点”“最大亮点”对应“最突出的创新之处”，故D项正确\nA.B.C三项均为新一代极地科考破冰船的特点，但都不值“最突出”的特点，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46862", "t": 1, "q": "最适合作为本文标题的是（     ）。", "a": ["我国自主建造的第一艘极地科考破冰船“牛”在哪?", "新一代极地科考破冰船能赶超科考船舶国际水平吗?", "最强组合：“雪龙”号与新一代极地科考破冰船", "新一代极地科考破冰船将满足快速增长的科考需求", "", ""], "r": "A", "e": "【解析】第一段介绍第一艘科考破冰船，即“新船”的亮点和功用；第二段介绍建设“新船”的原因，即“新船”能够满足快速增长的科考需要，其科考调查设备和手段均为国际领先；第三段介绍“新船”还可与“雪龙号”配合进行极地科考。可见整个文段都是围绕“新船”来论述，强调了“新船”的优势，对应A项。\nB项，文段没有将新一代冰船对比国际水平，故无中生有，排除；\nC项，“最强组合”对应第三段“新船预计2019年建成，将与‘雪龙’号组成极地科考破冰船队”，无法概括全文，排除；\nD项，对应第二段“要建造新船，是因为现有的极地破冰船难以满足快速增长的科考需求”，这只是新船建造原因的一方面，故表述片面，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46863", "t": 1, "q": "填入文中划横线处最恰当的一项是（     ）。", "a": ["探寻", "凭借", "追随", "借助", "", ""], "r": "D", "e": "【解析】所填入内容与“参考”并列，指查阅、利用有关资料帮助学习、研究或了解情况，且根据后文举例解释可知，必须了解社会学和文化人类学的研究方法以及研究成果，才能研究农村经济。A项“探寻”指找寻、寻求，C项“追随”指效仿前人的事迹，均与文意无关，排除；对比B.D两项，B项“凭借”指依靠、借用一定的手段，D项“借助”指凭借别人或事物的帮助以达到目的。可知“研究方法与研究成果”并非手段，故D项更符合语境，当选。\n故正确答案为D。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46864", "t": 1, "q": "如果把这篇文章分为三个层次，最恰当的一项是（     ）。", "a": ["①②③/④⑤⑥⑦/⑧⑨", "①②/③④⑤⑥⑦/⑧⑨", "①②/③④⑤⑥/⑦⑧⑨", "①②③/④⑤⑥/⑦⑧⑨", "", ""], "r": "B", "e": "【解析】整篇文章首先介绍研究农村的事例，说明要想研究农村，必须先深刻了解农村。并由此引出几种社会研究方法，详细加以解释说明其不同之处。最终文章通过“可以说”表总结，说明社会研究应该综合运用几种研究方法。故文段可以分为三层，①②段为介绍事例部分内容；③④⑤⑥⑦段为介绍具体研究方法内容；⑧⑨段为总结，提出对策，即研究社会应综合运用各种研究方法内容。对应选项为B项。\n故正确答案为B。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46865", "t": 1, "q": "关于“有些金融机构在农村领域获得了极大的成功”的原因，与文意不符的一项是（     ）。", "a": ["采用了适合当地农村的金融组织形式", "全面满足了农民急需的农业生产融资", "理解当地农村社会的结构方式", "懂得农民的日常社会生活方式", "", ""], "r": "B", "e": "【解析】根据文章可知，如果不能深切了解中国农民和农村的社会生活及其结构特征，就很难理解为什么有些金融机构在农村领域获得了极大的成功，故可反推知原因为“深切了解中国农民和农村的社会生活及其结构特征”，C.D两项表述正确，排除。又根据“如果不能深切了解中国农民和农村的社会生活及其结构特征，就很难了解为什么农民会选择这种金融组织形式和融资方式”可知，“这种金融组织形式”与“深切了解中国农民和农村的社会生活及结构特征有关”，故A项表述正确，排除。\nB项“满足农民急需的农业生产融资”无中生有，当选。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46866", "t": 1, "q": "作者认为“实地研究”与其他几种研究方法的主要不同点在于（     ）。", "a": ["更多体现了人文主义的研究倾向", "通过研究成果建立新的理论架构", "研究过程强调研究者的亲身参与", "更多更深入地理解当前社会现实", "", ""], "r": "A", "e": "【解析】根据文章可知，第五段提到了几种研究方法的本质区别。即“实验研究、调查研究和文献研究”为定量研究方式，集中体现了实证主义方法论的倾向，而“实地研究”为定性研究方式，集中体现了人文主义方法论的倾向。并且下文详细对这两种方法论的不同从目的、用途、具体方式几个角度加以解释说明。故可知实地研究与其他研究的主要不同点为“人文主义的研究倾向”，对应选项为A，当选。\nB项，为研究目的方面的不同，并非主要的不同点，排除；\nC项，为研究方式的不同，并非主要不同点，排除；\nD项，为研究目的方面的不同，并非主要的不同点，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46867", "t": 1, "q": "根据文意，下列对“实证主义”研究方法概括不准确的是（     ）。", "a": ["强调研究的规范性、精确性和客观性", "尽可能按照自然科学研究的方式进行", "关注整个研究过程的特殊性及深入性", "通常采用调查研究、实验研究的方法", "", ""], "r": "C", "e": "【解析】A项，根据“具有实证主义方法论的社会研究者，通常采用定量的研究方式，以凸现研究的规范性、精确性和客观性”可知正确，排除；\nB项，根据“其中每一个步骤都尽可能严格按照自然科学研究的方式进行”可知正确，排除；\nC项，根据文章可知，“关注整个研究过程的特殊性及深入性”为具有人文主义方法论的学者的研究方法，并非“实证主义”研究方法，故表述错误，当选；\nD项，根据“具有实证主义方法论的社会研究者，通常采用调查研究、实验研究以及定量的文献研究的方式”可知正确，排除。\n本题为选非题，故正确答案为C。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46868", "t": 1, "q": "以下哪项是斯坦尼·坦普尔研究结论成立的前提？（     ）", "a": ["渡渡鸟灭绝五年后，再也没有大栌榄树幼苗被发现的记载", "大栌榄树种子的外壳坚硬，必须经过渡渡鸟的消化道才能发芽", "目前发现的渡渡鸟遗骸中，大都留有大栌榄树的种子", "16世纪后期到达毛里求斯的欧洲人习惯将渡渡鸟作为美味佳肴", "", ""], "r": "B", "e": "【解析】由文段可知，斯坦尼•坦普尔研究的结论是“杀光了渡渡鸟，实际上也为大栌榄树挖掘了坟墓，即渡渡鸟和大栌榄树，是一荣俱荣、一损俱损的”，B项说明如果没有渡渡鸟，大栌榄树的种子就无法发芽，即证明了渡渡鸟和大栌榄树的共存关系，当选。\nA项没有被发现的记载不代表没有这种树，力度弱，排除；C项仅指目前发现的结果，不代表所有的都是这样，而且留有大栌榄树的种子，对大栌榄树有什么效果没说，力度较弱，排除；D项没说明渡渡鸟和大栌榄树之间的关系，不是前提，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46869", "t": 1, "q": "斯坦尼·坦普尔认为渡渡鸟和大栌榄树之间的关系是（     ）。", "a": ["一脉相承", "休戚相关", "珠联璧合", "环环相扣", "", ""], "r": "B", "e": "【解析】在文段第二段可以发现提到了“大栌榄树与渡渡鸟之间存在多种联系”，之后进一步说明了渡渡鸟在大栌榄树上休息，并且可以帮助大栌榄树生长，同时当“渡渡鸟灭绝之日，也是大栌榄树绝育之时”，可见这二者之间是祸福相依的，对应B项。\nA项的“一脉相承”比喻某种思想、行为或学说之间有继承关系；C项“珠联璧合”比喻杰出的人才或美好的事物结合在一起，多用来形容男女之间的感情；D项“环环相扣”形容连接的紧密，均无法体现“渡渡鸟与大栌榄树”之间的密切关系，排除A.C.D三项。\n故正确答案为B。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46870", "t": 1, "q": "以下哪项发现可以最有效地支持外来物种入侵导致大栌榄树灭绝的假说？（     ）", "a": ["直接种植大栌榄树的种子，数天后就可以自然发芽", "外来植物争夺大栌榄树的生长空间，使其种子数量减少", "在没有外来物种入侵的地区，还有幸存的大栌榄树", "渡渡鸟生活在低海拔地区，大栌榄树生活在高海拔地区", "", ""], "r": "C", "e": "【解析】根据提问可知所选应为最能支持外来物种入侵说的论据，A项和D项均未涉及外来物种，为无关论据，排除；B项“外来物种抢占了大栌榄树的空间，致使其数量减少”，保留；可以支持外来物种入侵说，C项表述的是“没有外来物种入侵的地方，还有幸存的大栌榄树”，是一种直接否定前提的支持，力度比B项更强，当选。\n故正确答案为C。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46871", "t": 1, "q": "根据本文，以下说法正确的是（     ）。", "a": ["大栌榄树的种子是渡渡鸟主要的食物来源", "大栌榄树也可以采用嫩枝扦插来进行繁殖", "渡渡鸟的肉味道鲜美，曾被当地人作为食物", "渡渡鸟和大栌榄树都是毛里求斯的特有物种", "", ""], "r": "D", "e": "【解析】A项，文段仅提到渡渡鸟喜欢吃大栌榄树的种子，并未论述该种子为渡渡鸟的主要食物，排除；B项，文段提到了大栌榄树的种子外边有一层硬壳，需要经过渡渡鸟的消化道，经过软化和磨损以后才能发芽，那么可见嫩枝扦插的方式不太可取，排除；C项，渡渡鸟肉质鲜美，被当做食物，属于无中生有的表述，排除；D项，根据文段第一段“渡渡鸟是仅产于毛里求斯的一种巨鸟”“和渡渡鸟一样，大栌榄树也是岛上特有的珍贵树种”可知，D项表述正确，当选。\n故正确答案为D。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46872", "t": 1, "q": "这篇文章最能体现下列哪项的观点?（     ）。", "a": ["伽利略：一切推理都必须从观察与实验得来", "达尔文：科学就是整理事实，以便从中得出普遍的规律或结论", "达芬奇：科学不问现在和过去，是对一切可能存在事物的观察，预见虽是渐进的，然而它是对即将发生事物的认识", "波普尔：不管我们已经观察到多少只白天鹅，都不能确立“所有天鹅皆为白色”的理论，只要看见一只黑天鹅就可以驳倒它", "", ""], "r": "A", "e": "【解析】通读全文可以发现斯坦尼·坦普尔的研究及假设是在他观察和实验的基础上得来的，同时文段最后提出的物种入侵说，文段说这只是个假说，还需要事实和研究来证实，可见推理是要从观察和实验中得来的，对应A项。\nB.C.D三项文段并未体现，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46873", "t": 1, "q": "填入第3段划横线部分最恰当的一组是（     ）。", "a": ["欲罢不能    老成持重", "忍俊不禁    正襟危坐", "赞不绝口    一本正经", "目不暇接    不苟言笑", "", ""], "r": "B", "e": "【解析】本题从第二空入手，根据后文“一点点走近年轻人，血脉筋骨也为之舒活”可知，文段将故宫拟人化，前后形成对比，说明故宫以前只是端坐着，没有走近年轻人和舒活筋骨，B项“正襟危坐”指整一整衣服，端正地坐着，与后文构成形象对应，符合文意，保留。\nA项“老成持重”指办事老练稳重，C项“一本正经”形容态度庄重严肃、郑重其事，D项“不苟言笑”指不随便说笑，亦形容态度庄重严肃，均无法与后文的“一点点走近年轻人，血脉筋骨也为之舒活”形成对应，排除。\n第一空，代入验证，B项“忍俊不禁”指忍不住要发笑，与后文“紧扣年轻人的笑点”对应恰当，符合语境，当选。\n故正确答案为B。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46874", "t": 1, "q": "对第4段中的“故宫模式”，理解最准确的一项是（     ）。", "a": ["“1+1>2”", "数字故宫", "文化卖萌", "跨界融合", "", ""], "r": "D", "e": "【解析】此题为词句理解题，首先定位原文，找到“故宫模式”。根据“这种‘故宫模式”可知，重点关注“故宫模式”之前的内容。根据“不仅注重博物馆与社会的融合，要把多学科的跨界融合、传统技艺和现代科技的跨界融合当作追求，……一旦这些‘完美碰撞’擦出火花，故宫就‘活’了起来、‘火’了起来，产生1+1远大于2的效果”可知，前文重点强调的是“跨界融合”，对应D项。\nA项“1+1>2”和B项“数字故宫”均是“跨界融合”带来的结果，并非一种模式，排除；C项“文化卖萌”无中生有，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46875", "t": 1, "q": "对第1段文字的主要观点概括最准确的是（     ）。", "a": ["数字技术为故宫文化的传播打开了新局面", "故宫以新颖的方法和形式融入了大众生活", "年轻人是故宫文创产品的最主要消费群体", "传统文化的时尚化表达有多种多样的形式", "", ""], "r": "B", "e": "【解析】文段首先通过“无论是……还是……抑或是……”列举出多种与故宫有关的新兴事物，省略号之前均为举例内容。尾句指出进入网络时代，故宫通过新的方式走进大众、走进年轻人，故文段重在强调故宫通过新的方式走进了公众，对应B项。\nA项，“数字技术”属于文段话题的缩小，文段指的是“网络时代”，且“新局面”表述不明确，文段尾句明确指出走进公众，排除；\nC项，“故宫文创产品”偏离文段核心话题，文段尾句围绕“故宫”这一话题展开，且“最主要消费群体”文段并未提及，无中生有，排除；\nD项，偏离文段核心话题，文段围绕“故宫”这一话题展开，且文段重在说明故宫走进公众，选项中并未提及，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46876", "t": 1, "q": "第2段旨在说明（     ）。", "a": ["应该让故宫所内蕴的丰富资源惠及大众", "如何让故宫文物古为今用是一个新课题", "传统文化资源的挖掘功在当代利在千秋", "一座故宫就是一所拥有特色资源的大学", "", ""], "r": "A", "e": "【解析】第二段首先引用习总书记的话，随后引出“故宫的资源”这一话题，接下来通过提出如何实现转化和发展的问题，之后给出答案，即“排在第一位的是‘公众’。”，即强调公众的重要性，最后通过并列结构进行加强论证。故文段的重点是强调故宫的资源要让公众受惠，对应A项。\nB.C.D三项，均未提及“公众”这一主题词，偏离中心，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46877", "t": 1, "q": "最适合做这篇短文标题的是（     ）。", "a": ["网络时代让“老年”故宫“返老还童”", "传统文化保护：是使命，也是课题", "故宫的鲜活生命力从何而来", "今日故宫，“跨界”的“网红”", "", ""], "r": "A", "e": "【解析】文章首先提出，进入网络时代，故宫开始了“逆生长”，走进了年轻人的生活。后面接着指出故宫把目光投向了年轻一代，一点一点走进年轻人，开始打造“数字故宫”，在年轻一代当中引发了数字热潮。最后一段思考怎么把一个完整的故宫交给下一个600年，让故宫永葆生命力。所以整个文段都在论述利用网络时代让故宫保持年轻，对应A项。\nB项，“传统文化保护”把“故宫”范围扩大，排除；\nC项，“从何而来”表述不明确，文段体现的是网络时代，排除；\nD项，“跨界”对应文段第四段，并不是对整个文段的概括，表述片面，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46878", "t": 1, "q": "填入第①段划横线部分最恰当的一组是（     ）。", "a": ["扩大    追捧", "提高    乐见", "增长    垂青", "飙升    青睐", "", ""], "r": "D", "e": "【解析】第一空，文段论述牛油果的进口量增长幅度很大，呈现出“爆炸式增长”的情况，横线处表示2017年的进口数量一下子增长了很多。A项“扩大”可搭配面积，与数量搭配不当，排除；B项“提高”可搭配能力、水平、素质，与数量搭配不当，排除。对比C项“增长”、D项“飙升”，二者的区别在于程度不同，D项“飙升”表示增长的幅度很大，与文段“爆炸式增长”对应更恰当，故锁定D项。\n验证第二空，D项“成了诸多健身人士青睐的健康食品”表示牛油果很受健康人士的欢迎，符合文意。\n故正确答案为D。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46879", "t": 1, "q": "“牛油果爆红的背后，是‘卡路里经济学’的兴起。”这句话是原文中独立的一段，它的最恰当位置是（     ）。", "a": ["①和②之间", "②和③之间", "③和④之间", "④和⑤之间", "", ""], "r": "A", "e": "【解析】题目中句子为“牛油果爆红的背后，是‘卡路里经济学’的兴起”，出现两个话题，即“牛油果”和“卡路里经济学”，首段已经出现“牛油果”，“兴起”说明该句引出话题“卡路里经济学”，应先引出话题，再论述关于该话题的内容，文章第③、④段均已经在论述“卡路里”，故题目中的句子应在③前，排除C.D项。\n③段“卡路里经济学’的外延，当然不止于饮食……”，接着论述“卡路里经济学”在其他方面的体现，“不止于饮食”说明第②段“碳水化合物”、“健康饮食”等论述“卡路里经济学”在饮食方面的体现，则引出话题的句子应放在②前，对应A项。\n故正确答案为A。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46880", "t": 1, "q": "以下观点，不能从原文中得出的是（     ）。", "a": ["电视广告促进了身体管理与商业的结合", "牛油果的健康标签使人们对它钟爱有加", "营养学家在客观上助推了牛油果的爆红", "流行文化是卡路里经济蓬勃发展的根源", "", ""], "r": "D", "e": "【解析】A项，根据第四段“然而，身体管理与商业的完美结合，却是很晚近的事。这其中，电视广告、营养学与运动的普及功不可没”可知，表述正确；\nB项，根据第一段“爆炸式增长，源于健康标签”可知，表述正确；\nC项，根据第二段“但也听得进营养学家建议：健康饮食不等于‘饿着’。所以，诸如牛油果、藜麦等食品异军突起，成为健康、时尚饮食观念的代名词。”可知，营养学家对牛油果等食品能够异军突起发挥了重要作用，表述正确；\nD项，根据第六段，“当然，‘卡路里经济学’之所以带来商机，也有流行文化的支持”可知，“根源”程度过重，与文意不符。\n本题正确答案为D。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46881", "t": 1, "q": "根据原文，促使大众参与身体管理的根本原因是（     ）。", "a": ["运动社交的文化心理", "大众生活水平的提高", "体育用品市场的繁荣", "健康生活理念的普及", "", ""], "r": "B", "e": "【解析】重点关注第五段，该段首句指出“大众参与到身体管理，归根到底还是因为‘仓廪实’。”，“仓廪实”本\n意为粮仓充足，意味着生活富足。随后通过一组数据进一步解释“仓廪实”，指出恩格尔系数下降，人们花费在食物上的开支比重减少了，这体现出的是人们生活水平的提高，对应B项。\nA项“文化心理”、D项“健康的生活理念”均属于精神层面，而“仓廪实”指的是物质水平的提高，排除；C项“体育用品市场”与文意无关，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46882", "t": 1, "q": "最适合做这篇文章标题的是（     ）。", "a": ["牛油果的“卡路里经济学”", "卡路里燃烧，烧热运动社交", "用仪式唤醒健康生活", "“卡路里经济”，明天值得期待", "", ""], "r": "A", "e": "【解析】篇章开篇即提出“牛油果火了”的现象，然后指出“牛油果火了”的原因与“卡路里”有关。接着篇章进一步提出“卡路里经济学”的概念，并解释说明了“卡路里经济学”蓬勃发展的原因。故篇章意在说明“牛油果火了”这一现象反映出的“卡路里经济学”，对应A项。\nB项，“运动社交”仅为“卡路里经济学”带来商机的一个方面的原因，表述片面，排除；\nC项，缺少“卡路里经济学”这一主题词，偏离文段中心，排除；\nD项，篇章已表明今天的卡路里经济学已经带来了商机，“明天值得期待”与文段时态不符，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46883", "t": 1, "q": "填入文中画横线处最恰当的一项是（     ）。", "a": ["专有和排他", "专属和高端", "独有和专业", "独创和稀缺", "", ""], "r": "A", "e": "【解析】横线所在句子在文段中间，起着承上启下的作用，应结合上下文。首句指出“知识产权广义上是……的专有权利，是通过排除他人……独占权益的制度。”强调知识产权的专有和排他的两面性。后文对“知识产权与公共领域的关系”从两方面进行介绍，横线处应体现“知识产权的属性”，结合文段可知应为A项。\nB.C两项仅提到“专有”“独有”仅属于知识产权的一方面属性，表述片面，排除。D项“独创和稀缺”为无中生有，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46884", "t": 1, "q": "这篇文章着重说明的是（     ）。", "a": ["知识产权过度保护也将造成危害", "知识产权实质上是财产权问题", "知识产权与公共领域的相互关系", "知识产权保护需注意其两面性", "", ""], "r": "D", "e": "【解析】篇章首先介绍了知识产权及其核心理论财产理论，并说明了两者间的关系，引出话题。接着文段提出观点，说明为了避免公共资源的过度使用而造成资源损耗，通过财产制度赋予主体对特定资源的所有权，可以确保资源的使用受到合理规范和控制，以此详细说明知识产权的客体智力成果依托财产理论的重要性。最后文段指出问题，财产理论并不能完全适用于知识产权，并通过“因此”给出结论，即知识产权应该在财产化的过程中兼顾其他策略来实现知识产权的制度目的。\n故篇章主要论述了知识产权需要财产理论的保护，并说明其不能只依赖财产理论的保护，否则会产生问题。即论述了用财产理论保护知识产权是把双刃剑，对应选项为D。\nA项，未提及通过财产理论保护知识产权的好处及必要性，表述片面，排除；\nB项，财产理论仅是知识产权的核心理论，且文段表明还需兼顾其他策略，故表述过于绝对，排除；\nC项，“相互关系”表述不具体明确，且文段主要论述的是知识产权与财产理论间的关系，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46885", "t": 1, "q": "对文章第一段中“公共领域作为知识产权潜在的‘对手’”理解不正确的是（     ）。", "a": ["知识产权理论上就是一种私人财产权", "公共领域的活动可能会影响知识产权实现", "知识产权作为私人财产不可用于公共领域", "权利人不希望被公共领域侵犯其权益", "", ""], "r": "C", "e": "【解析】A项，根据“财产理论成为知识产权制度的核心理论”及“权利人作为财产权主体控制其权属范围内的一切资源而排除资源自由流动的可能性”可知，表述正确，排除；\nB项、D项，根据“主张公共领域的边界和层次的发展压缩了知识产权的权属范围，限制了知识产权作为一项财产权利的功能实现”可知，此处强调权利人主张要明晰“公共领域的边界和层次”来保护其权利，故“公共领域活动”可能会侵犯权利人的权利，B.D选项表述均正确，排除；\nC项，文段并未明确指出“不可用于公共领域”，表述过于绝对，表述错误，当选。\n本题正确答案为C。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46886", "t": 1, "q": "作者认为，知识产权不受限制自由使用最终将会导致（     ）。", "a": ["智力成果的权利人无法得到相应的收益", "智力创造活动由于激励不足而无以为继", "无法形成知识产权资源收益的不断增值", "知识产权的使用缺乏合理的规范和控制", "", ""], "r": "B", "e": "【解析】根据篇章第3段“然而智力成果缺少法律制度的规范而允许不受限制的自由使用，造成的不利后果则是权利主体无法就智力成果的价值进行有效的收益，最终导致智力创造活动激励不足而无以为继”可知，最终会导致的结果是智力创造活动激励不足而无以为继，对应选项为B。\nA项“无法得到相应的收益”、C项“无法形成资源收益的增值”均为知识产权不受限制自由使用的不利后果，而并非最终会导致的结果，排除；\nD项，“缺乏合理的规范和控制”为知识产权不受限制自由使用的原因，而非结果，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46887", "t": 1, "q": "对文章最后一段中“知识产权领域也有类似的矛盾”解释不恰当的是（     ）。", "a": ["专利数量不断增加有时并未促进研发创新", "知识产权的财产化导致后续研发成本过高", "版权领域内的演绎权利只能归属于原作者", "后人从事转化性创作有时也缺乏必要空间", "", ""], "r": "C", "e": "【解析】“类似的矛盾”指代上文，即资源的财产化发展到一定程度反而会阻碍后续开发和使用行为。且后文详细介绍了这种矛盾的两种情况，一种是由于专利数量不断增加导致研发成本过高，最终阻碍发展，对应A.B两项。一种是由于坚持绝对的演绎权利，压缩了演绎作者创作的空间，抑制基于原作品的演绎行为，对应D项。\nC项，根据“类似的，版权领域内的演绎行为的权利传统上归属于作品原作者”以及后文“实践中各国在版权立法方面将滑稽戏仿规定为版权的例外并允许类似行为的实施”可知，各国允许其他作者对原作品通过丰富和发展的合理手段，进行转化性的创作，故表述错误，排除。\n本题正确答案为C。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46888", "t": 1, "q": "填入第②段中划横线部分最恰当的一项是（     ）。", "a": ["人声鼎沸        参差不齐", "熙熙攘攘        泥沙俱下", "热闹非凡        破绽百出", "众说纷纭        人云亦云", "", ""], "r": "B", "e": "【解析】第一空，根据文意可知，横线处表达网络就像“广场”，给每位网民提供了发表个人见解、与他人对话的机会，A项“人声鼎沸”指人群的声音吵吵嚷嚷；就像煮开了锅一样，B项“熙熙攘攘”形容人来人往，非常热闹，C项“热闹非凡”形容热闹的场面或景象，均可用来形容网民在网络上热情发言的场面。D项“众说纷纭”指人多嘴杂，各有各的说法，侧重强调意见不一致，文段中只强调互联网激发了网民发表言论的热情，未提及网民的言论观点是否一致，故排除。\n第二空，根据转折关联词“然而”可知，横线处与前文意思相反，强调网络带来的消极影响，B项“泥沙俱下”比喻好坏不同的人或事物混杂在一起，一同显现出来，形容“全民进入网络空间”，难免好坏都有，语义恰当，当选。A项“参差不齐”侧重长短、高低、大小不齐，C项“破绽百出”比喻说话做事漏洞非常多，均与“网络空间”搭配不当，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46889", "t": 1, "q": "<p>以下这段话本是以上文章中的一部分，其应该位于（ ）。<\/p>\n<p>但若仔细思量，网络和网络语言真不能为这扼杀青年语言能力的大祸背锅。网络语言从来没有完备的界定。从新华网上的新闻与领导讲话，到微博上面红耳赤的唇枪舌剑，再到微信公众号里的鸡汤、鸡血，它们都是活跃在网络空间里的语言信息。即使聚焦到微博微信，平台上也是从庄雅到低俗无一不包的语言生活大杂院。<\/p>", "a": ["<p>①与②之间<\/p>", "<p>②号③之间<\/p>", "<p>③与④之间<\/p>", "<p>④与⑤之间<\/p>", "", ""], "r": "A", "e": "【解析】所给文段通过转折词“但”强调了“网络和网络语言不能为扼杀青年语言能力的大祸背锅”，转折前后语义相反，那转折之前应当表明“青年语言能力下降的语言原因在于网络语言”。第①段中提及了“语言贫乏原因在于网络语言”，A项当选。\n第②段说明了网络语言带来的优势以及带来的焦虑；第③段说明了经典的文化元素会在每个时代流行，其表现方式不同而已；\n第④段说明了社会语言的提高有赖于建造良好的语言环境，给予有效的指导；\n第⑤段说明提升语言能力的对策，均未提及“语言能力下降和网络语言有关”这一内容，排除B.C.D三项。\n故正确答案为A。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46890", "t": 1, "q": "作者举出《经典咏流传》与《中华新韵》的例子，目的在于（     ）。", "a": ["说明中国传统语言具有恒久魅力的原因", "说明现代人应该从传统语言中汲取精华", "阐述经典语言在网络时代同样焕发生机", "阐述经典文化元素在每个时代都会流行", "", ""], "r": "C", "e": "【解析】重点关注第三段。《经典咏流传》和《中华新韵》在文段中是以例子的形式存在，起到的作用为加强论述前文的观点。而在例子之前，文段明确指出观点，强调在网络时代，经典语言文化在以新的方式焕发生机。接下来举了三个例子，《经典咏流传》把古诗词唱出来，用新造成语描述今人情绪，《中华新韵》让古诗体用普通话读着也有味道，夸夸群更让灵动的修辞炫出了天际。这些例子都是在加强论证前文观点，故作者引用例子目的在于指出经典语言在网络时代也能够焕发生机。C项正确。\nA项，“具有恒久魅力的原因”表述不明确，文段例子之前的观点明确指出是通过新的形式焕发生机，排除；\nB项，文段没有体现出“汲取精华”，无中生有，排除；\nD项，对应后文内容，且文段明确指出是“模因理论”告诉我们的，而非前文的例子论证的观点，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46891", "t": 1, "q": "根据以上文章，下列表述中不准确的一项是（     ）。", "a": ["四分之三以上的受访者感觉自身语言贫乏", "唐诗宋词形成于当时文人的语言生活之中", "作者并不赞同社会语言能力已经发生退化", "作者认为语言生活是无法通过规划获得的", "", ""], "r": "D", "e": "【解析】D项，对应第五段，“这实在是可喜的现象，证明全社会的语言意识正在觉醒，意识到语言和语言生活是需要规划，需要建设的”，选项与文意相悖，当选。\nA项，对应第一段“76.5%的受访者感觉自己的语言越来越贫乏了”，表述正确；\nB项，对应第三段“在唐诗宋词滥觞的岁月，它们也是因适应当时的文人语言生活才获得发展的”，表述正确；\nC项，对应第四段“因此可以说，社会的语言能力并没有退化”，表述正确；\n本题正确答案为D。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46892", "t": 1, "q": "下列各项中，最适合作为上文标题的是（     ）。", "a": ["拿什么拯救我们的语言", "让网络激发语言热情", "语言规划学的现实意义", "值得深思的调查结果", "", ""], "r": "B", "e": "【解析】篇章首先介绍了有人认为“网络语言”导致了人们语言匮乏，然后介绍了网络语言给人们带来焦虑，接着通过“语言规划学的研究”说明经典文化元素会在每个时代流行，在第四段通过“因此”提出观点，即社会的语言能力没有退化，恰恰是网络空间给了人们自由使用语言的机会，可以激发语言创造的热情，对应B项。\nA项，缺少与“网络”相关的关键词，表述不够具体明确，排除；\nC项，“规划学”相关内容为解释说明部分，非文段重点，排除；\nD项，缺少与“网络”相关的关键词，且表述不够具体明确，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46893", "t": 1, "q": "<p>同样是基于这种神秘的想象，欧洲人认为香料具有圣洁之气。在基督徒丧葬火化时，香味必须越浓越好。把香料涂抹在遗体上或者同遗体一起焚烧，有着赎罪的意涵。<\/p>\n<p>这段文字最适合放到文中哪一位置？（ ）<\/p>", "a": ["<p>①和②之间<\/p>", "<p>②和③之间<\/p>", "<p>④和⑤之间<\/p>", "<p>⑤和⑥之间<\/p>", "", ""], "r": "C", "e": "【解析】题干这段文字开头提到“同样是基于这种神秘的想象”，“同样”表示并列，可知这段文字之前要提到“神秘的想象”，只有③④两段是针对“神秘的想象”的介绍，并且这段文字是针对欧洲人对待香料的态度，⑤段通过“也”引出欧洲人对待香料的另一种态度，因此这段文字应该放在④和⑤之间，起到承上启下的作用，锁定C项。\nA.B.D三项，①②⑤句均没有提到“神秘的想象”这一话题，与这段文字话题不一致，排除。\n故正确答案为C", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46894", "t": 1, "q": "根据所给材料，以下哪一项不是哥伦布时代欧洲人渴求香料的原因？（     ）", "a": ["对天堂的想象", "对理性的诉求", "对显赫身份的向往", "对延缓衰老的渴望", "", ""], "r": "B", "e": "【解析】首先定位文段，③-⑥段是在论述哥伦布时代欧洲人渴求香料的原因。根据第③段“天堂中飘着香料的味道，基督教众神和死去的帝王们，身上也都带有香料之气”可知，A项正确，排除；根据第⑤段“香料也是欧洲贵族彰显身份的标志”可知，C项正确，排除；根据第⑥段“香料足以延缓衰老的过程”可知，D项正确，排除；B项“对理性的诉求”出现在第⑨段，并非哥伦布时代欧洲人渴求香料的原因，当选。\n本题正确答案为B", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46895", "t": 1, "q": "根据所给材料，以下哪一项是香料失宠的原因之一？（     ）", "a": ["迷恋香料使得整个社会奢靡之风盛行", "新的医疗技术颠覆了香料治病的传统", "新的烹饪偏好延长了食物的储存时间", "香料在基督教中的象征意义逐渐消失", "", ""], "r": "D", "e": "【解析】根据第⑤自然段“香料也是欧洲贵族彰显身份的标志”和第⑨自然段“随着香料在基督教中象征意义的消失和欧洲消费主义的发展，贵族们彰显地位的消费品转向了首饰、音乐、服装、住房、艺术和交通工具”可知，“香料在基督教中的象征意义逐渐消失”为香料失宠的原因，故D项表述正确，当选。\nA项“整个社会奢靡之风盛行”并非是香料失宠的原因，排除；\nB项“新的医疗技术”、C项“延长了食物的储存时间”无中生有，排除B.C两项。\n故正确答案为D", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46896", "t": 1, "q": "根据所给材料，十六、十七世纪的欧洲生活中最不可能出现的场景是（     ）。", "a": ["厨师用美洲的红辣椒代替胡椒调味", "商人通过茶叶贸易获得了大量利润", "新的音乐形式成为贵族热衷的话题", "城郊的异域风情餐厅开始受人追捧", "", ""], "r": "D", "e": "【解析】A项，根据第⑧自然段“香料失宠的另一个原因，则在于新航路开辟后，可以调和味道的蔬菜出现，取代了香料的功能”可知，“用美洲的红辣椒代替胡椒调味”可能出现，排除；\nB项，根据第⑧自然段“十六、十七世纪时，人们产生了新的嗜好，先是烟草风靡全球，随后则是咖啡和茶，这些商品比香料更加有利可图”可知，“通过茶叶贸易获得了大量利润”可能出现，排除；\nC项，根据第⑨自然段“随着香料在基督教中象征意义的消失和欧洲消费主义的发展，贵族们彰基地位的消费品转向了首饰，音乐、服装、住房、艺术和交通工具”可知，“新的音乐形式成为贵族热衷的话题”可能出现，排除；\nD项，根据第⑨自然段“随着民族意识的崛起，食物被贴上了民族的标签，香科被欧洲看作异城的标志，只有耽于感官享受的民族才会热衷于此。与之相反，欧洲理性主义时代最为贬斥的就是一味追求感官享受，而不诉诸理性”可知，异域风情餐厅在欧洲并不会受人追捧，故不可能出现，当选。\n故正确答案为D", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46897", "t": 1, "q": "最适合做所给材料标题的是（     ）。", "a": ["香料传奇：欲望创造的历史", "航海轶事：香料与神秘东方", "天堂想象：“香气氤氲”的基督教", "世界开端：大航海时代的财富追逐", "", ""], "r": "A", "e": "【解析】文章第①自然段指出香料成为改变世界的原动力，接下来第②至⑥段介绍了香料具有如此魅力且能引发极度欲望的原因，最后⑦至⑨自然段介绍了随着时间发展香料失宠的原因，故整个文段围绕“香料”的话题展开，讲述香料在历史发展过程中的重要作用，对应A项。\nB项“神秘东方”并非文段论述重点，文段仅在第③自然段提及“东方”的话题，排除；\nC项、D项，“基督教”、“财富追逐”均偏离文段主题词“香料”，故偏离文段核心话题，排除C.D两项。\n故正确答案为A", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46898", "t": 1, "q": "依次填入第④段中最合适的词语是（     ）。", "a": ["不足       鞭长莫及", "局限       微乎其微", "困难       杯水车薪", "条件       差强人意", "", ""], "r": "B", "e": "【解析】第一空，由冒号可知，后文对横线处起到解释说明作用。由“数据从分析……长达数月之久……时间较为漫长”可知，第一空想表达功能性核磁共振成像也有缺陷的意思，A项“不足”、B项“局限”均符合文意，保留；\nC项“困难”指这项技术本身有难度，不好操作，不符合文意，排除；\nD项，“条件”并不一定是缺陷，不符合文意，排除。\n第二空，由前文内容可知，病人提供反馈的时间较为漫长。所以对“专注短时间内极易变化的活动”，作用自然就比较小了。此处所填的词应该表达“小”的意思。\nB项“微乎其微”形容非常小或非常少，符合文意，当选。\nA项“鞭长莫及”比喻距离太远而无能为力，形容力量达不到，文段没有体现“距离太远”的意思，排除。\n故正确答案为B", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46899", "t": 1, "q": "布朗教授的实验最能够支持下列哪个说法？（     ）", "a": ["反馈机制可以帮助人们集中注意力", "场景比人脸通常更容易吸引注意力", "注意力在测试中比在生活中更易集中", "注意力能使大脑过滤无关紧要的信息", "", ""], "r": "A", "e": "【解析】根据文章第3段“布朗教授一直致力于通过为人们提供快速精准的反馈意见来提高他们的专注力”可知，布朗的实验，即这种精准的反馈机制目的是帮助人们提高专注力，而第9段，在阐述实验的结果时，提到“在反馈测试过程中，很多人被观察到注意力越来越集中，维持长时间注意力的能力也变得更强”，故布朗的实验，即该反馈机制是可以帮助人们提高注意力的，A项当选。\nB项，定位文章第8段，可知一开始人脸比场景更易吸引注意力，后来经过“惩罚-奖赏”机制后，他们的注意力又会渐渐被人脸吸引。所以意味着人脸比场景更易吸引注意力，选项说的是“场景比人脸通常更容易吸引注意力”，前后逻辑相反，排除。\nC项，通过文章最后一段可知，在测试中注意力表现好的参与者，在实际日常生活中的注意力也得到提高，未将二者进行对比，无中生有，排除；\nD项，对应文章第2段，属于客观规律，并非是布朗实验所支持的结论，且表述有误，文段说的是“人类的注意力非常有限，因而大脑通常过滤掉我们看到的模糊而无关紧要的东西”，而选项说的是“注意力能使”，偷换概念，排除。\n故正确答案为A", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46900", "t": 1, "q": "根据所给材料，功能性核磁共振成像技术能够（     ）。", "a": ["实时成像", "检测大脑氧气含量", "判断脑区的活跃状况", "监测带氧血红素的磁导率", "", ""], "r": "C", "e": "【解析】由“功能性核磁共振成像技术”可定位文章第三段。该段介绍了布朗教授的团队经常采用这项技术，通过检验磁场变化实现脑功能成像，给出精确的结构与功能的关系。接下来分析了脑神经活化时，血液中含氧量的变化，引起了磁场扰动，被检测出后可用来判断脑区的变化，对应C项。\nA项，“实时成像”无中生有，排除。\nB项，由“含氧血与缺氧血的变化使磁场产生扰动，从而能被检测出来”可知，被检测的是磁场扰动的变化，而非“大脑氧气含量”，排除。\nD项，由“带氧血红素与去氧血红素之间的磁导率不同，含氧血和缺氧血的变化使磁场产生扰动，从而能被检测出来”可知，被该技术检测出的是磁场发生扰动的变化，而非“带氧血红素”自身固有的磁导率，排除。\n故正确答案为C", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46901", "t": 1, "q": "在实验中，参与者不可能（     ）。", "a": ["在实验后半段得到的奖励更多", "脑区的磁场变化产生较大波动", "看到人脸占比达到60%的图像", "在图像中观察到河岸边的马群", "", ""], "r": "D", "e": "【解析】D项，根据文章第5段可知，“实验中根本就没有室外场景的画面”，所以，对于参观者来说，在图像中观察到河岸边的马群是不可能的，当选；\nA项，根据第7段“如果大脑的注意力集中在场景上，研究者就启用‘奖赏’机制，让场景越来越清晰，用这种方式对他们进行反馈”结合第9段“很多人被观察到注意力越来越集中，维持长时间注意力的能力也变得更强”可知，在实验后半段参与者得到的奖励更多，选项表述正确，排除；\nB项，根据文章第3段可知，注意力的变化会在相应脑区产生波动变化，而第8段交代“在整个过程中，参与者注意力的变化呈现波动趋势”，所以“脑区的磁场变化产生较大波动”也是可能出现的，排除；\nC项，根据文章第7段“最开始，图像中场景和人脸各自占比50%，当观察到参与者的注意力不够集中在场景上时，研究者就启用‘惩罚’机制，降低场景的占比”，可知“看到人脸占比达到60%的图像”是可能的，排除。\n本题正确答案为D", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}, {"id": "46902", "t": 1, "q": "作者接下来最可能（     ）。", "a": ["阐述人类注意力与神经系统之间的关系", "介绍“惩罚-奖赏”机制在其他领域的应用", "探讨实时脑成像技术与反馈机制的应用前景", "列举生活中注意力不集中现象造成的隐患", "", ""], "r": "C", "e": "【解析】文段重点论述了布朗的实验，目的是通过实时脑成像技术和反馈机制，帮助人们提高注意力，而最后一段给出了实验结果，即该实时脑成像技术和反馈机制，确实能够帮助人们在日常生活中显著提高注意力，说明该方法是行之有效的。故下文一定要围绕着“实时脑成像技术”和“反馈机制”继续展开谈论，论述其在未来能够带来的作用和意义，对应C项。\nA项“人类注意力与神经系统之间的关系”在文章第3段已经论述过了，下文不会继续展开谈论，排除；B项“惩罚一奖赏”机制只是布朗实验的一个方面，它是与实时脑成像技术共同作用达到实验目的的，若下文单独论述“惩罚一奖赏”机制，即为表述片面，排除；D项，文段最后的落脚点在于布朗实验带来的结果和好处，“注意力不集中现象”非文段最后论述的核心话题，下文不会围绕其展开论述，排除。\n故正确答案为C", "l3": "一般能力", "l4": "2.篇章阅读", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = !!ans;
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
