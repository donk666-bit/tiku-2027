, "本金：利率：利息", "", ""], "r": "B", "e": "【解析】题干关系为：总价一单价X数量。A项，密度一质量：体积；B项，溶质一溶液X浓度；C项，时间一路程：速度；D项，本金一利息：利率。故本题选B。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||2.3节", "n": "一般能力 / 2.3节", "qs": [{"id": "46408", "t": 1, "q": "心理契约是指个体与组织之间隐含的明文规定的双方各自的责任及对对方的期望。\n根据上述定义，下列属于建立心理契约的措施是（     ）。", "a": ["为提高员工积极性，每月业绩最好者能享受双薪", "为解决员工后顾之忧，与优秀员工签订终身合同", "为吸引优秀人才，承诺为员工提供购房免息借款", "结合企业的发展蓝图，为员工提供职业生涯设计", "", ""], "r": "D", "e": "【解析】心理契约的一个重要特点是“没有明文规定”。A项提供双薪、B项签订合同、C项承诺提供免息借款都属于明示的、双方明确约定的情况。D项通过为员工提供职业生涯设计，使员工与企业发张结合在一起，企业能与员工达成并维持一份动态平衡的“心理契约”。因此只有D项符合题目要求。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46409", "t": 1, "q": "红旗原则是指如果侵犯著作权的事实是显而易见的，网络服务商就不能装作看不见，或以下不知道侵权的理由来推脱责任。\n根据上述定义，下列适用红旗原则的情形是（     ）。", "a": ["未经用户许可，某客户端软件就能够自动扫描、获取用户个人数据", "甲某利用网络服务商提供的免费存储空间，非法经营盗版影视作品", "乙某上传正在首播的某热门电视剧，并被网站编辑推荐到下载首页", "丙某通过第三方在有下载功能的互联网电视上获取未经授权的节目", "", ""], "r": "B", "e": "【解析】A没有体现侵犯著作权，C是合法行为，D也没有涉及著作权，并且是通过第三方下载的，事实不是显而易见的。故答案选B。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46410", "t": 1, "q": "低碳经济是指在可持续发展理念指导下，通过技术创新、制度创新、产业转型、新能源开发等多种手段，尽可能地减少煤炭、石油等高碳能源消耗，减少温室气体排放，达到社会经济发展与生态环境保护双赢的一种经济发展形态。\n根据上述定义，下列不符合低碳经济理念的是（     ）。", "a": ["某粮油食品公司大力推广绿色食品", "某小区住房都安装了太阳能电池板", "在荒山、滩头、草甸兴建风力发电站", "某空调公司引进了低能耗空调生产线", "", ""], "r": "A", "e": "【解析】“低碳经济”关键在于通过减少高碳能源的消耗。A选项中的“绿色食品”是关于是健康的问题，不是否降低碳能源消耗的问题。所以选择A选项。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46411", "t": 1, "q": "制度的反功能指的是该制度实现了系统的某些功能之后而产生的副作用，诸如破坏该系统的内部协调、稳定关系，造成系统内部冲突，对系统良性运行产生破坏作用等现象。\n下列涉及此定义的是（     ）。", "a": ["某校实行绩效考核，实行一段时间后引发了教师争抢上课，乱发文章等一系列问题", "某售楼处规定销售额可以提成，结果其销售员一个月卖房近50套", "一对夫妻新婚后实行家庭消费AA制，一段时间后觉得不方便就取消", "某部门实行人性化管理，结果上班迟到现象反而比实行考勤制度是减少了", "", ""], "r": "A", "e": "【解析】A项中绩效考核实行后产生了副作用：破坏教师内部协调、稳定的关系，属于定义所指，故选A。B.D产生的是积极作用，而不是副作用，与定义不符。C中没有产生副作用，不属于题干观点。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46412", "t": 1, "q": "反向诱导是指政府、媒体等主体所采取的措施或者宣传活动，在实际的社会生活中不但没有收到预期的效果，反而导致了与预期相反的社会现象大量出现。\n根据上述定义，下列属于反向诱导的是（     ）。", "a": ["某影院为了让观众摘下帽子，在银幕上打出通告：“本院允许老年人戴帽观赏。”结果通告一出，许多观众纷纷摘下了帽子", "某单位要求员工统一着装，结果招致单位很多女员工的强烈反对，最后只好不了了之", "高温季节供水相对紧张，某市自来水公司贴出告示，告知市民近期不会停水，结果导致很多市民在家中大量囤水备用", "某电视台播放预防心理疾病的讲座，很多市民对号入座，觉得自己得了心理疾病，纷纷打电话咨询", "", ""], "r": "C", "e": "【解析】反向诱导的关键词：1. 政府、媒体等主体所采取的措施或者宣传活动；2. 没有收到预期的效果；3. 导致了与预期相反的社会现象大量出现。A不符合2，排除。B不符合3，没有导致与预期相反的社会现象大量出现，排除。D纷纷打电话，也没有导致与预期相反的社会现象大量出现，排除。C符合定义，故答案选C。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46413", "t": 1, "q": "威客模式是指一些人通过互联网把自己的智慧、知识、能力、经验转换成实际收益，他们在互联网上通过解决科学、技术、工作、尘活、学习中的问题从而让知识、经验、技能产生经济价值。\n根据上述定义，下列属于威客模式的是（     ）。", "a": ["某高校学生建立的免费回答中小学生学习问题的公益网站受到了学生和家长的好评，当地一家教育机构出资赞助扩大这个网站的规模，以帮助更多的学生", "某IT技术人员用业余时间开了一个小公司，主要在网络远程帮助他人修理电脑", "某大学毕业生在一个B2C网站上开了一家服装店，运用自己的人脉资源使网店很快就开始盈利", "某影师个人网站上的摄影作品吸引了大批网友浏览、转发，后来该摄影师依靠在该网站上发布摄影器材广告带来大量收入", "", ""], "r": "B", "e": "【解析】注意，过程是把自己的智慧、知识、能力、经验转换成实际收益，A项为公益性质，并没有产生经济价值。C项和D项只是借助网络平台，而并不是将自己的智慧、知识、能力、经验直接转化为经济收益。B项属于利用网络，是自己的技术直接转化为经济收益。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46414", "t": 1, "q": "企业社会响应是指企业受社会伦理道德标准的引导满足社会某种普遍需要。\n根据上述定义，下列选项不属于企业社会响应的是（     ）。", "a": ["某工厂发生污染事故，周边企业出资垫付事故赔偿金", "工程队在工地周围铺设防尘网，减少粉尘造成的污染", "某企业捐赠3亿股企业股票给慈善组织设立专项基金", "某公司按照《残疾人保障法》的规定安排残疾人就业", "", ""], "r": "D", "e": "【解析】注意此题目过程是指企业受社会伦理道德标准的引导满足社会某种普遍需要，而D选项是受法规的影响，不符合。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46415", "t": 1, "q": "食品污染物指不是有意加入食品中，而是在生产，制造，加工，调制，处理，填充，包装，运输和贮藏等过程中带入食品中，或是由于环境污染带入食品中的任何物质。\n根据上述定义，下列属于食品污染物的是（     ）。", "a": ["“三鹿奶粉”事件中“问题奶粉”含有三聚氰胺成分", "对肉质进行嫩化改良而使用的水瓜蛋白酶成分", "油炸食品在加工过程中由于加入增多剂而产生的铝成分", "食品腌制中，使用的添加剂中含有的对人体有害的亚硝酸盐", "", ""], "r": "C", "e": "【解析】注意此题过程是不是有意加入食品中，而是在生产，制造，加工，调制，处理，填充，包装，运输和贮藏等过程中带入食品中，或是由于环境污染带入食品中的任何物质。A是有意加入的；B过程是改良中；不符合，D也是有意的。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46416", "t": 1, "q": "知识营销是指在企业的营销过程中，使企业的广告、宣传、公关、产品注入一定的知识含量与文化内蕴，帮助消费者增加与商品相关并实用的信息与知识，提高他们的消费与生活质量，从而达到推广产品、树立形象、提升品牌竞争力的目的。\n根据上述定义，下列属于知识营销的是（     ）。", "a": ["某保健品生产企业深入社区为居民开设健康生活讲座，并在讲座中推销其保健品", "某体育用品生产企业为希望小学捐献价值20万元的体育用品，多家媒体报道了这一事迹", "某师范院校派出大学生支教团，在支教的同时宣传教育的重要性，为该校在当地的招生起到了积极作用", "某证券公司股票分析师经常受电视台邀请在电视节目中为广大股民进行股票分析", "", ""], "r": "A", "e": "【解析】注意此题的过程是“企业的营销过程中，使企业的广告、宣传、公关、产品注入一定的知识含量与文化内蕴”，B项没有“注入一定的知识含量与文化内蕴”故答案选A，C选项主体不适企业，D选项不适“企业的营销过程中”。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46417", "t": 1, "q": "获致身份是指一个人经历某种公开的、具有竞争性的奋争或因具备某种特殊本领而获得的社会地位。\n下列选项符合获致身份说法的是（     ）。", "a": ["<p>生子当如孙仲谋<\/p>", "<p>王侯将相宁有种乎<\/p>", "<p>忠臣必出老子之门<\/p>", "<p>上品无寒门、下品无士族<\/p>", "", ""], "r": "B", "e": "<p>【解析】获致身份核心：通过公开竞争性奋争、特殊本领，后天争取得到社会地位，而非血缘出身直接赋予。 A.“生子当如孙仲谋”：曹操赞叹孙权的才干，是对理想后辈的感慨评价。本句并未体现 “通过奋争去获取社会地位” 这一过程，不满足定义，排除。 B.“王侯将相宁有种乎”：质疑王侯将相的地位并非天生世袭，主张普通人可以靠奋争获取高位，契合获致身份的内涵，当选。 C.“忠臣必出孝子之门”：强调家庭门第对人才的决定作用，看重先天家世，排除。 D.“上品无寒门、下品无士族”：门阀制度，社会地位由出身决定，排除。故答案选B。<\/p>", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46418", "t": 1, "q": "地震前兆指地震发生前出现的异常现象。地震前兆很复杂，概括起来主要有两大类：一类由人的感觉器官所能直接察觉的地震前兆，统称宏观前兆；而另一类不能被人的感觉器官直接察觉的地震前兆，统称微观前兆。\n以下不属于宏观前兆的是（     ）。", "a": ["收音机声音忽大忽小，连续出现噪音", "猫狗惊慌不安，乱跑乱闹", "上空电离层内的电子总量剧增", "地下水突然浑浊冒泡，泥渣上浮", "", ""], "r": "C", "e": "【解析】根据宏观前兆是“由人的感觉器官所能直接察觉的地震前兆”可知，A.B.D项中的异常现象是人的感觉器官能直接察觉的，而C项中“电子总量剧增”不能被人感觉器官直接察觉。因此，本题答案为C选项。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46419", "t": 1, "q": "印记学习行为是指发生在动物生活的早期阶段、由直接印象形成的学习行为，印记学习行为虽发生在早期，但对晚期行为也具有一定影响。\n根据上述定义，下列不属于印记学习行为的是（     ）。", "a": ["绵羊走近并试图留在喂养过它的主人身边", "由人喂养大的斑马雀会向主人的手指求偶", "母羊用舌舐小羊的方式来标记自己的后代", "刚出生的绿头鸭跟随着一个移动的物体走", "", ""], "r": "C", "e": "【解析】印记学习发生在动物活动的早期阶段，A.B.D三项都是动物在早期形成了一种印象或者习惯，继而影响到现在的行为。C项行为的主体是母羊，而它舔小羊的行为并不是在它早期由直接印象形成的学习行为。因此本题答案选C。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46420", "t": 1, "q": "有些产品的精心设计使产品方便高效，能给客户带来舒适感，使用时不用阅读复杂的说明或是求助他人。而有些产品恰恰相反，它们的设计没有考虑用户的使用习惯和需要，因而使人们在使用过程中会遇到困难或者迷惑不解的情况，这类产品被人们称为诺曼产品。\n根据上述定义，下列属于诺曼产品的是（     ）。", "a": ["某品牌木制大衣柜的底部滑轮质量较差，用户很难将门拉开", "某款网络游戏很难通关，很多玩家在网上求助怎样破解其中的关卡", "汽车收音机按钮和其他设备开关的形状、大小都一样，用户很难分辨哪个是收音机按钮", "某科技公司的精密实验设备附有300页的说明书，一般人觉得里面术语太多，很难读懂", "", ""], "r": "C", "e": "【解析】定义的核心是“产品的设计没有考虑用户的习惯和需要，造成使用上的不便”。A项是质量问题。B项是游戏难度的设置，并没有造成使用的不便。D项说明书并不是产品本身。故本题答案选C。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46421", "t": 1, "q": "社会自组织就是指自发成立、自主发展、自行动作，具有一定规模的、以民间组织形式存在，逐步从无序走向有序的社会组织。\n根据上述定义，下列选项不属于社会自组织的是（     ）。", "a": ["<p>某市软件企业定期组织企业家联谊，进行业务交流<\/p>", "<p>一群学生通过QQ群认识，每周末一起参加敬老活动<\/p>", "<p>每周六晚上，某市政公园广场上都有年轻人在跳街舞<\/p>", "<p>一群年轻人建立动物收容所，收养各种被遗弃的宠物<\/p>", "", ""], "r": "C", "e": "<p>【解析】定义强调的关键词包括“自发成立”、“自行动作”和“以民间组织形式存在”。<br>A项：软件企业家联谊属于自发成立，自行动作，符合定义，排除；<br>B项：QQ群是学生自发成立的，属于自行动作，是以民间组织形式存在，符合定义，排除；<br>C项：跳街舞是一个随机性活动，不能确定这群跳街舞的年轻人是不是同一群人，因此也就不符合“以组织存在”，因此不符合定义，当选；<br>D项：属于自发成立、自行动作和以民间组织形式存在，符合定义，排除。选C<\/p>", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46422", "t": 1, "q": "积极错觉是指当自我由于消极的信息而使自尊心面临威胁时，用理想化的自我、不现实的乐观或夸大的可控性感知等作为缓冲嚣，来保护自己的自尊。根据上述定义。\n下列选项属于积极错觉的是（     ）。", "a": ["某人担心经理对自己印象差，每天提早到办公室上班", "很多人觉得考试时间很紧张，可小林还觉得时间足够", "某男生追求女生失败，认为对方是因为害羞不敢答应", "某男考研究生屡次失败，但其坚信天道酬勤始终获成功", "", ""], "r": "C", "e": "【解析】A选项中的“每天提早到办公室上班”和D选项中的“坚信天道酬勤始终获成功”并不属于“用理想化的自我、不现实乐观或夸大的可控性感知等作为缓冲嚣”，B选项中的“时间紧”并不是“自尊心面临威胁”不符合，只有C选项是因为“自尊心面临威胁时.不现实的乐观作为缓冲嚣.来保护自己的自尊”符合题意，故选C。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46423", "t": 1, "q": "范围经济是由厂商的经营范围而非规模带来的经济，同时生产两种产品的费用低于分别生产每一种产品的费用的经济现象。\n根据上述定义，下列属于范围经济的是（     ）。", "a": ["某啤酒制造厂收购了一个经营亏损的小型啤酒厂，生产线扩大后原料采购成本降低，两个厂区啤酒的生产效益均有提高", "某家具生产厂家实行桌子与衣柜全并生产后，相同的生产过程使成本有效降低", "因为市场需求扩大，布鞋和鞋垫的手工作坊式生产逐渐被机器生产取代，生产成本大幅下降", "某奶制品厂实行奶酪与酸奶一起生产生，二者的生产工艺相互借鉴，产品改良，销量大增", "", ""], "r": "B", "e": "【解析】“范围经营”的关键是规模经营的手段和能够降低成本的结果。D选项只是增加了销量。AC都不是规模经营的手段。所以选择B选项。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46424", "t": 1, "q": "就业平等权：指公民不论其民族、种族、性别、宗教信仰、家庭背景等的不同和差异，均享有平等获得就业机会的权利。\n根据上述定义，下列没有侵犯求职者的就业平等权的是（     ）。", "a": ["女大学生小刘，本科学历，在几次应聘中，都因为是女性而落聘", "某公司招聘时，明确规定本公司员工的亲属比其他应聘者优先录用", "小李的父亲是某县政府领导，在该县事业单位公开招聘中，小李未和其他应聘者一样参加考试，就直接被录用了", "某食品加工厂在招聘员工过程中，以食品安全为由，拒绝录用一名乙肝患者", "", ""], "r": "D", "e": "【解析】某食品加工厂在招聘员工过程中，以食品安全为由不符合“不论其民族、种族、性别、宗教信仰、家庭背景等”，故没有侵犯。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46425", "t": 1, "q": "破窗现象：一个房子如果窗户破了，没有人去修补，隔不久，其它的窗户也会莫名其妙地被人打破，所以环境中的不良现象如果被放任存在，会诱使人们仿效，甚至变本加厉。\n根据上述定义，下列不属于破窗现象的是（     ）。", "a": ["一面墙出现了一些涂鸦没有被清除，很快，墙上就布满了乱七八糟、不堪入目的东西", "一个干净的地方，人们不好意思丢垃圾，但是一旦地上有垃圾出现，人们就会毫不犹豫地跟着丢，丝毫不会惭愧", "一个村里发生了传染性疾病，由于没有及时隔离，结果很快整个村落的人都被传染上了", "一个教室里，有两个学生偷偷讲话，老师没有制止，很快大半个班级的学生都在聊天了", "", ""], "r": "C", "e": "【解析】C选项没有涉及到“会诱使人们仿效，甚至变本加厉”。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46426", "t": 1, "q": "选择性曲解是指人们面对客观事物，经常会不自觉地把外界输入的信息与头脑中早已存在的模式相结合，从而出现根据自己固有的价值体系和既定的情感好恶来解释所接受信息的倾向。\n根据上述定义，下列属于选择性曲解的是（     ）。", "a": ["爱屋及乌", "指鹿为马", "按图索骥", "度日如年", "", ""], "r": "A", "e": "【解析】抓住定义中的关键要素：不自觉，头脑中早已存在的模式，固定的价值体系和情感好恶。指鹿为马是故意所为不符合定义，按图索骥不符合早已存在的模式，度日如年不符合固定的价值体系和情感好恶。故答案选A。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46427", "t": 1, "q": "自我防御性归因是指通过强调自己对积极的、合乎期望的好结果的作用，缩小对消极的、不合乎期望的坏结果的责任来保护自尊。\n根据上述定义，下列属于自我防御性归因的是（     ）。", "a": ["很多家长认为，孩子能否具有创造力关键在于学校的教育理念是否先进", "某公司管理者在总结企业成功经验时说，一个成功的企业离不开优秀的员工和先进的管理方法", "某国GDP水平屡创新低，该国领导人表示，这是受到世界经济持续低迷的影响", "某企业因经营不善而面临破产，该企业领导承认企业领导班子在经营决策上存在失误", "", ""], "r": "C", "e": "【解析】题干关键信息：强调自己对好结果的作用；缩小坏结果的责任。选项C中某国的领导人将GDP水平屡创新低归因于世界经济持续低迷的影响，缩小了该国领导人对坏结果的责任。选项A主体错误；选项B不是坏结果；选项D承认自我责任，不属自我防御。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46428", "t": 1, "q": "前苏联研制的米格-25喷气式战斗机的许多零部件与同时期美国的战机相比都要落后得多，但因设计者考虑了整体性能，对各零部件进行了更为协调的设计，使该机在升降、速度、应急反应等方面达到当时世界一流水平。这一因组合协调而产生的令人意想不到的结果，被后人称为“米格-25效应”。\n根据上进定义，下列属于米格-25效应的是（     ）。", "a": ["一家礼品店礼品样式齐全、定价也不高，固此生意非常不错", "小方学习服装设计后，着装时从丝巾到鞋都搭配得当，给人以美感", "机关举行乒乓球混双比赛，某处的两人配合默契，以绝对优势战胜了男女单打冠军的组合", "某电脑公司开发了一款笔记本电脑，虽然内部配置不高但外观小巧精美，上市后销售情况很好", "", ""], "r": "C", "e": "【解析】题干关键信息：零件并非最先进，但组合协调而产生了令人意想不到的效果。选项A.B并非因各组成部分组合协调而产生意外效果；选项D笔记本电脑的销售情况很好是因为外观小巧精美，并非是将配置不高的零件通过组合协调而提高了性能来吸引顾客。所以选择C选项。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46429", "t": 1, "q": "冲突管理：是由冲突与管理组合而成，冲突是指人们由于某种抵触或对立状况而感知到的不一致的差异，管理者不仅要解决组织中的冲突，更要刺激功能性的冲突，以促进组织目标的达成。\n根据上述定义，下列选项不属于冲突管理的是（     ）。", "a": ["某公司营销部和技术部因产品的定位产生意见分歧，公司领导在听取技术部的意见后，采纳了他们的意见", "某公司的部门之间常有沟通和协作障碍，公司决定将各部门人员分批送到拓展机构开展团队协作训练，效果显著", "在课题论证会上，主持人鼓励大家发言，有些专家观点针锋相对，最后主持人汇总了大家的意见后提出结论性意见", "某公司人力资源部与战略部对公司目标的确定存在争议，公司领导要求各部联合论证方案的合理性，最终形成新的方案", "", ""], "r": "C", "e": "【解析】冲突管理的定义要点是：目的：①解决组织中的冲突；②促进组织目标的达成。原因：冲突是指人们由于某种抵触或对立状况而感知到的不一致的差异。A.B.D项均符合定义要点；C项是课题论证会中的观点冲突，同时主持人只是汇总了意见，并没有解决冲突，不符合要点①。故选C。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46430", "t": 1, "q": "亚健康：指处于健康和疾病之间的一种临界状态，是介于健康和疾病之间的一个特殊阶段。\n　下列属于亚健康的一项是（     ）。", "a": ["桑兰是我国一名体操运动员，她参加第四届世界友好运动会时，不幸失手严重摔伤，导致胸部以下完全瘫痪", "运动员在进行短跑或足球等无氧运动时，体内血糖进行无氧分解提供能量，运动后肌肉积累大量乳酸，引起肌肉酸痛", "王某的母亲患有严重的老年痴呆症，在患病期间卧床不起，不能行走说话", "记者小张在“两会”期间，由于采访任务繁重，身体的主要器官处于入不敷出的非正常负荷状态，过度疲劳，造成精力、体力透支", "", ""], "r": "D", "e": "【解析】亚健康是指在病态与健康之间的临界状态，也就是说，既不是病态，也不是健康状态。A项瘫痪属于病态，排除；B项属于健康状态，酸痛是运动后的自然反应，排除；C项老年痴呆属于病态，排除。D选项没有达到病态，但是过度疲劳、体力透支是非健康状态，所以小张处于亚健康状态。故本题选D。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46431", "t": 1, "q": "社会生活噪音是指人为活动所产生的除工业噪音、建筑施工噪音和交通噪音之外的干扰周围生活环境的噪音。\n　根据定义，下列选项中属于社会生活噪音的是（     ）。", "a": ["小区附近的建筑工地上施工的声音", "深夜里，楼下夫妇的吵架声", "车间里传来的机器轰鸣声", "楼对面马路传来的汽车轰鸣声", "", ""], "r": "B", "e": "【解析】 根据定义，社会生活噪音不包括工业噪音、建筑噪音和交通噪音。A项为建筑噪音，B项为除这三种以外的社会生活噪音，C项为工业噪音，D项为交通噪音。故本题选B。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46432", "t": 1, "q": "代际公平是可持续发展原则的一个重要内容，主要是指当代人为后代人类的利益保存自然资源的需求。\n　下列与“代际公平”没有直接关系的是（     ）。", "a": ["秦岭旅游区管委会最近决定，下大力气拆除景区内影响自然景观的诸多违法建设的别墅群", "某市环保局勒令该市一造纸厂立即停产整顿，因其未按规定安装污水处理系统", "某食品企业请专家研究开发了多种绿色食品", "不久前某动物保护组织集会，抗议多个国家的捕鲸行为", "", ""], "r": "C", "e": "【解析】代际公平是对自然资源而言的，A.B.D都是有利于自然资源良好发展、可持续发展的案例，C选项是开发绿色食品，与后代自然资源无关。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46433", "t": 1, "q": "在世赠与是指施赠人决定活着的时候把钱赠与子女、孙子女和其他亲属，或用于度假和建立信托基金。\n　下列选项中，属于在世赠与的是（     ）。", "a": ["李董事长将自己现有资金的80%无偿捐赠，建立慈善扶贫创业基金，扶持边远贫困地区青年创业", "张大爷让儿子在自己的房子里结婚，自己选择租房", "吴先生失踪2年后，其女儿继承了他的财产", "赵先生在其去世前立下遗嘱，将所有财产都留给自己唯一的孙子", "", ""], "r": "A", "e": "【解析】A项中李董事长活着的时候就建立了基金，符合定义。B项未提及赠与关系；C项不能确定当事人是否活着；D项为立遗嘱，属于死后继承。故本题选A。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46434", "t": 1, "q": "贸易战是指一些国家通过高筑关税壁垒和非关税壁垒，限制别国商品进入本国市场，同时又通过倾销和外汇贬值等措施争夺国外市场，由此引起的一系列报复和反报复行为。\n根据上述定义，下列属于贸易战的是（     ）。", "a": ["甲国不满乙国的市场垄断行为，把乙国告上国际法庭", "某国为了保护本国农产品的利益，禁止外国商家到该国收购农产品进行倒卖", "中国与欧盟签署关于光伏产品的市场备忘录", "美国向中国的钢铁产品与铝产品征收额外的高关税", "", ""], "r": "D", "e": "【解析】贸易战的定义要点是：①一些国家通过高筑关税壁垒和非关税壁垒限制别国商品进入本国市场；②通过倾销和外汇贬值等措施争夺国外市场，由此引起的一系列报复和反报复的行为。A项属于市场垄断，不符合定义；B项某国是为了保护本国农产品的利益，禁止外国商家到该国收购农产品进行倒卖，而不是限制别国商品进入本国市场，不符合定义；C项通过签署的备忘录，不是通过高镇关税壁垒和非关税壁垒限制别国商品进入本国市场，不符合定义；D项美国高筑关税壁垒限制中国国商品进入市场，符合定义，答案选D。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46435", "t": 1, "q": "线性文化遗产是世界遗产的一种形式，主要是指在拥有特殊文化资源集合的线形或带状区域内的物质和非物质的文化遗产族群，运河，道路以及铁路线等都是重要表现形式。\n根据上述定义，下列不属于线性文化遗产的是（     ）。", "a": ["丝绸之路", "京杭大运河", "茶马古道", "黄河故道", "", ""], "r": "D", "e": "【解析】黄河故道不属于线性文化遗产。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46436", "t": 1, "q": "旁观者现象是一种社会心理学现象，指在紧急情况时由于有他人在场而没有对受害者提供帮助的情况。在紧急事件中由于有他人在场而产生的对救助行为的抑制作用。旁观者人数越多，抑制程度越高。\n根据上述定义，下列属于旁观者现象的是（     ）。", "a": ["警察赶到抢劫现场后，迅速疏散人群并制服犯罪嫌疑人", "小李看到朋友被殴打，但因周围没有人而不敢上前帮忙", "邻居一家目击了一起暴力事件，但因怕连累而默不做声", "小王看到一起打架事件，但因有众多人围观而没有报警", "", ""], "r": "D", "e": "【解析】定义的关键是：①有他人在场为原因；②没有对受害人提供帮助为结果。A项不满足②，排除；B项不满足①，排除；C项，默不做声是因为怕连累自己，而不是因 为有他人在场，排除；D项满足定义。故本题选D。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46437", "t": 1, "q": "聚合效应是指企业和其产品成了名牌，不仅可获得较高的利益和较好的经济效益，而且还可以利用品牌资本使企业不断发展壮大。名牌企业或产品在资源方面会获得社会的认可，社会的资本、人才、管理经验甚至政策都会倾向名牌企业或产品。名牌企业或产品会稳固自己的实力，并通过加强与供应商、后续企业的关系，通过资本营运聚合社会资源使企业更进一步扩大，形成规模，进而产生规模效益。\n根据上述定义，下列属于聚合效应的是（     ）。", "a": ["某新兴品牌因符合国家扶持政策而获得大量的社会资金", "某国际知名品牌因其极高的知名度而收拢了一大批优秀设计师", "某知名品牌因质量问题导致经济效益锐减", "某知名奢侈品牌因发明一项新专利而获得大量社会资本", "", ""], "r": "B", "e": "【解析】定义的关键是：①名牌；②利用名牌资本：③获得社会资本、人才、管 政策。A项“符合国家扶持政策”不符合②；B项“名牌因知名度获得人才”，符合定义；C项不符合定义；D项“因发明一项新专利”不符合②。故本题选B。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46438", "t": 1, "q": "数码相机的噪点主要是指CCD将光线作为接收信号接收并输出的过程中所产生的图像中的粗糙部分，也指图像中不该出现的外来像素，通常由电子干扰产生。看起来就像图像被弄脏了，布满一些细小的糙点。坏点是数码相机在同一设置条件下，如果所拍的图像中杂点总是出现在同一个位置，就说明这台数码相机存在坏点，一般厂家对坏点的数量有规定，如果坏点数量超过了规定的数量，可以向经销商和厂家更换相机。假如杂点并不是出现在相同的位置.则说明这些杂点是由于使用时形成的噪点。\n下列说法中属于噪点的是（     ）。", "a": ["小明拍摄的照片总是在左上角有一个小白点", "小李拍摄到了天空中出现的一个圆盘", "拍摄出的夜空照片中总是出现一些不定位的亮点", "带有“降噪”功能的相机拍出的照片极其清晰", "", ""], "r": "C", "e": "【解析】噪点的定义关键是：图像中不该出现的外来像素且不出现在相同的位置。A项，“总是在左上角出现小白点”，不符合“不出现在相同的位置”，排除。B项，“天 空中出现的圆盘”是一个实体物，不符合“不该出现的外来像素”，排除。C项符合定义。 D项完全不符合定义，排除。故本题选C。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46439", "t": 1, "q": "怯魅，指人类在对客观世界的研究中，逐渐排除精神体作用的一个漫长过程。通过一个又一个领域的“怯魅”，自然被逐步看作纯客观的物质集合，客观世界无生命、没有喜怒哀乐，不再与价值、意义等精神现象相关，更不受人类思想感情的支配。\n根据上述定义，下列属于怯魅的是（     ）。", "a": ["古代天文学将行星运行轨道确定为正圆，是由于正圆“最能体现神的完美”", "托利拆利进行大气压实验后，认为出现这一现象的原因，是“自然不喜欢真空”", "无论你学习研究哪一门科学知识，都可以看到“不以人的意志为转移”这句定语", "牛顿发现万有引力后，认为这种超距作用之所以可能，是因为“整个自然都是上帝的身体”", "", ""], "r": "C", "e": "【解析】怯魅定义的关键词是“排除精神体” “纯客观”。A项中的“神”，B 项中的“自然不喜欢”，D项中的“上帝”都属于精神体作用，非纯客观。故本题选C。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46440", "t": 1, "q": "序列工作相互依赖，是指一个工作群体为了完成其任务必须依赖组织的其他单位的程度。序列工作相互依赖的情况是：一个群体的产品（产出）是另一群体的原材料（投入）。相互工作的依赖，是指每个群体的一些产出都成为另外群体的投入。\n根据上述定义，下列属于相互工作的依赖的是（     ）。", "a": ["车间工人在流水线上共同组装成一个产品", "市场研究职能部门进行的消费者调查结果成为广告部门促销活动设计的原始数据", "生产部门生产出来的产品由质量保证部门来检验安全性和其他标准，而质量保证部门则把那些不合标准、需要修正的产品送返生产部门", "建筑师设计的规格参数成为工程部门活动的起点", "", ""], "r": "C", "e": "【解析】相互工作的依赖的定义的关键词是“每个群体的一些产出都成为另外群体的投入”。C项，生产部门生产出的产品中的不合标准、需要修正的产品成为质量保证部门送返的对象，符合定义。A项.车间工人是一个工作群体，不涉及到另外群体，不符合定义，排除。B.D两项均符合序列工作相互依赖的定义，排除。故本题选C。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46441", "t": 1, "q": "坐诊，指医生在固定的地点进行医疗活动，等待病人上门诊治的方式。\n根据上述定义，下列属于坐诊的是（     ）。", "a": ["医生A在小区进行上门诊治活动", "护士B在门诊为病人打点滴", "医生C在医院外科室为病人看病", "医生D在诊所举办关爱老人——防治动脉硬化症宣传讲座", "", ""], "r": "C", "e": "【解析】坐诊的定义要件为：①医生；②在固定地点；③医疗活动，等病人上门 诊治。A项，“上门诊治”不符合②，排除。B项，“护士”不符合①，排除。C项符合。 D项，“宣传讲座”不符合③，排除。故本题选C。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}, {"id": "46442", "t": 1, "q": "静默安装，指手机用户在不知情的情况下，手机在后台自动完成某几款APP的下载、安装、激活、注册等操作。\n根据上述定义，下列属于静默安装的是（     ）。", "a": ["小A在手机上下载了京东APP", "小B在手机上下载百度浏览器的时候选择了安装百度清理大师", "小C下载天猫的时候中了木马", "小D在手机上玩游戏.中了病毒程序，自动为某游戏刷单", "", ""], "r": "D", "e": "【解析】定义的关键信息是①“不知情”②后台自动完成APP下载等操作。A项 不符合①②。B项不符合①②。C项“木马”不属于APP。D项符合。故本题选D。", "l3": "一般能力", "l4": "2.3节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||2.4节", "n": "一般能力 / 2.4节", "qs": [{"id": "46443", "t": 1, "q": "大学对全体新生进行了体检，没有发现乙肝患者。\n如果上述陈述为假，则以下哪项一定为真？（     ）   \nⅠ.或者有的新生没有体检，或者在新生中发现了乙肝患者。   \nⅡ.虽然有的新生没有参加体检，但还是发现了乙肝患者。    \nIII.如果对所有的新生进行了体检，则一定发现了乙肝患者。", "a": ["仅Ⅰ", "仅Ⅰ和Ⅱ", "仅III", "仅Ⅰ和III", "", ""], "r": "D", "e": "【解析】题干是一个联言命题A且B：对全体新生进行体检且没有发现乙肝。题干为假命题，则矛盾命题为真。矛盾命题：非A.或非B， 或者有的新生没有体检，或者在新生中发现了乙肝患者，即Ⅰ。对一个假的联言命题，有肯定式推理有效，即III。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46444", "t": 1, "q": "“童话里的王后并非既贤惠又美丽。”\n根据以上表述，下列哪项断定必然为真？（     ）", "a": ["如果童话里的王后不美丽，那么她一定贤惠", "如果童话里的王后美丽，那么她一定不贤惠", "童话里的王后既不贤惠，也不美丽", "童话里的王后贤惠，但不美丽", "", ""], "r": "B", "e": "【解析】联言命题“P且Q”的矛盾命题为“非P或者非Q”，故题干等价于“或者不贤惠，或者不美丽”。B项是相容选言命题的否定肯定式，正确。故答案选B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46445", "t": 1, "q": "张明说：如果选李明当选教练，那么王芳就要当领队。\n李红说：我不同意。\n以下哪项最符合李红的意思？（     ）", "a": ["<p>选李明当教练，但不能让王芳当领队<\/p>", "<p>如果选李明当教练，就不能让王芳当领队<\/p>", "<p>如果不选李明当教练，就要让王芳当领队<\/p>", "<p>不选李明当教练，也不让王芳当领队<\/p>", "", ""], "r": "A", "e": "【解析】本题考查的是充分条件假言命题的矛盾命题，A-B的矛盾命题是A且非B。A为“李明当选教练”，B为“王芳当选领队”。则A且非B为“李明当选教练，王芳不当选领队”。所以正确答案选A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46446", "t": 1, "q": "如果听从专家的意见，就能避免决策失误。\n以下哪项是对题干论述最有力的反驳？（     ）", "a": ["专家的意见有时并不一定正确", "没有听从专家的意见，也没有避免决策失误", "听从了专家的意见，避免了决策失误", "听从了专家的意见，但没能避免决策失误", "", ""], "r": "D", "e": "【解析】充分条件假言命题的矛盾是“A且非B”。所以答案选D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46447", "t": 1, "q": "有人说：“只有认识错误，才能改正错误。”\n如果以上判断是真的，可能出现的情况是（     ）。\nⅠ.某人认识了错误，没有能改正错误\nⅡ.某人没有认识错误，改正了错误\nⅢ.某人没有去认识错误，没能改正错误\nⅣ.某人认识了错误，改正了错误", "a": ["Ⅰ", "Ⅰ  Ⅱ  Ⅲ", "Ⅲ  Ⅳ", "Ⅰ  Ⅲ  Ⅳ", "", ""], "r": "D", "e": "【解析】这道题考察必要条件假言命题与肢命题真假关系。题干是一个必要条件的假言命题，前件为“认识错误”，后件为“改正错误”。根据必要条件假言命题与肢命题的真假关系可知，只有当前件假和后件真时，该命题才为假，即只有“没认识错误，改正了错误”时题干才为假，因此Ⅱ为假，其他情况都可能出现。因此，答案选D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46448", "t": 1, "q": "无论从全球范围，还是从我国的实际情况来看，人类文明都发展到了这样一个阶段，即保护生态环境，确保人与自然的和谐，使经济能够得到可持续。\n由此可以推出（     ）。", "a": ["如果经济不可持续发展，就是没有搞好环境保护", "只有搞好环境保护，才能实现经济的可持续发展", "即使没有搞好环境保护，也能实现经济的可持续", "只有实现了经济的可持续发展，环境保护才能搞得好", "", ""], "r": "B", "e": "【解析】题干可以简化为：经济发展→保护生态环境，只有B选项在形式上保持一致，所以选B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46449", "t": 1, "q": "甲说：我只有把这部电影看完，才能睡着觉。乙说：我恰恰相反。\n以下选项中哪项表达了乙的意思？（     ）", "a": ["我看完这部电影，就能睡着觉", "我看完这部电影，就不能睡着觉", "我看不完这部电影，也能睡着觉", "我看不完这部电影，也不能睡着觉", "", ""], "r": "C", "e": "【解析】乙的意思即为甲的矛盾命题，甲的话是必要条件假言命题，其矛盾命题是“非 p 且 q”，即没看完这部电影也能睡着觉，C项正确。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46450", "t": 1, "q": "某单位选派出国留学人员，条件是：业务精通，并且英语流利或者法语流利。小洪没有被选派上。\n以下哪一项解释可以从上面得出？（     ）", "a": ["小洪只有英语流利是不够的，还需要法语也比其他候选人流利", "如果小洪业务精通的话，那么她的英语和法语都不够流利", "小洪业务精通，但英语不流利", "小洪业务精通，但法语不流利", "", ""], "r": "B", "e": "【解析】根据题意，我们可知选派留学人员的条件是：业务精通，并且英语流利或者法语流利。如果小洪业务精通，那么他只需法语或者英语流利就能被选派，但事实上他没有被选派，那么就说明他的法语和英语都不流利。所以选B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46451", "t": 1, "q": "在我国初次分配领域，劳动者工资增长赶不上企业利润增长已是一个普遍现象，并且这种差距有逐渐拉大之势。不改变这种利润侵蚀工资的现象，就会扩大收入差距，影响社会和谐稳定，更不利于扩大消费、拉动内需。要改变这种利润侵蚀工资的现象，就必须提高劳动所得。\n据此，可以推出（     ）。", "a": ["要想不影响社会和谐稳定，就必须提高劳动所得", "只有改变这种利润侵蚀工资的现象，才必须提高劳动所得", "如果改变这种利润侵蚀工资的现象，就会缩小收入差距，增进社会和谐稳定", "如果扩大收入差距，影响社会和谐稳定，就不会改变这种利润侵蚀工资的现象", "", ""], "r": "A", "e": "【解析】考查复言命题推理。题干包含两个充分条件假言命题：（1）不改变利润侵蚀工资的现象→扩大收入差距，影响社会和谐稳定；（2）改变利润侵蚀工资的现象→提高劳动所得。A项，否定（1）的后件，可以否定（1）的前件，即肯定（2）的前件，可以肯定（2）的后件，A项正确；B项，误将“改变利润侵蚀工资的现象”当成“提高劳动所得”的必要条件，B项错误；C项，否定前件不能否定后件，C项错误；D项，肯定后件不能肯定前件，D项错误。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46452", "t": 1, "q": "食品安全的实现，必须有政府的有效管理。只有政府部门之间的相互协调配合，才能确保政府进行有效的管理。但是，如果没有健全的监督制约机制，是不可能实现政府各部门之间协调配合的。\n由此可以推出（     ）。", "a": ["没有健全的监督制约机制，不可能实现食品安全", "要想健全监督的机制，必须有政府的有效管理", "有了政府各部门之间的相互协调配合，就能实现食品安全", "一个不能进行有效管理的政府，即是没有建立起健全的监督制约机制的政府", "", ""], "r": "A", "e": "【解析】本题属于连锁推理类题型。题干关系为：食品安全的实现→政府的有效管理→政府各部门之间的相互协调配合→健全的监督制约机制。等价于：没有健全的监督制约机制→没有政府各部门之间的相互协调配合→没有政府的有效管理→没有食品安全的实现。所以选择A选项。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46453", "t": 1, "q": "如果程序设计没有问题，那么或者是硬件故障或者是输入有误；但是，实际上输入正确。\n根据以上陈述，可以得出（     ）。", "a": ["程序设计有问题", "如果硬件没有故障，那么程序设计有问题", "程序设计没有问题", "如果硬件有故障，那么程序设计没有问题", "", ""], "r": "B", "e": "【解析】题干是一个充分条件假言命题，而其后件又是一个相容选言命题。表示为：程序设计没有问题→或者硬件故障或者输入有误。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46454", "t": 1, "q": "如果品学兼优，就能获得奖学金。\n假设以下哪项，能得出结论：李桐学习欠优。（     ）", "a": ["李桐品行优秀，但未获得奖学金", "李桐品行优秀，并且获得了奖学金", "李桐品行欠优，未获得奖学金", "李桐品行欠优，但获得奖学金", "", ""], "r": "A", "e": "【解析】题干是一个充分条件假言命题，根据充分条件假言命题推理规则“否定后件推出否定前件”。由“李桐没有获得奖学金”可以推出“并非李桐品学兼优”，等值于“李桐品行不优秀或者李桐学习欠优”。对于这个相容选言命题来说，根据其推理规则“否定其中一个选言支就可以肯定另外一个选言肢”，因此要得到“李桐学习欠优”，必须要否定“李桐品行不优秀”。因此在“李桐品行优秀，并且没有获得奖学金”的情况下，才能得出要求的结论。因此本题目选择A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46455", "t": 1, "q": "如果今年的旱情仍在持续且人们抗旱不力，那么今年的农作物就会减产，并且农民的收入会降低。但是，多项证据表明，今年农民的收入不仅不会降低，反而会有所提高。\n据此，可以推出（     ）。", "a": ["今年的旱情仍在持续，且人们抗旱不力", "今年的旱情仍在持续，或人们抗旱不力", "今年的旱情没有持续，或人们抗旱有力", "今年的旱情没有持续，且人们抗旱有力", "", ""], "r": "C", "e": "【解析】题干推出关系是“旱情持续且抗旱不力→农作物减产且农民收入降低”因为农民没有降低可知旱情持续或抗旱不力。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46456", "t": 1, "q": "所有亲戚都不知道明明的下落。\n上述断定为假，以下判定可以确定为真的是（     ）。", "a": ["有的亲戚不知道明明的下落", "有的亲戚知道明明的下落", "没有亲戚知道明明的下落", "所有亲戚都知道明明的下落", "", ""], "r": "B", "e": "【解析】题干中“所有亲戚都不知道明明的下落”。如果该命题为假，则其矛盾命题必然为真。其矛盾命题是“有些亲戚知道明明的下落”，即B项必然为真。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46457", "t": 1, "q": "培光街道发现有保姆未办暂住证。\n如果上述断定为真，则以下哪项不能确定真假？（     ）\nⅠ.培光街道所有保姆都未办暂住证。\nⅡ.培光街道所有保姆都办了暂住证。\nⅢ.培光街道有的保姆办了暂住证。\nIV.培光街道的保姆陈秀英办了暂住证。", "a": ["I、II、III、IV", "仅I、III和IV", "仅I", "仅I和IV", "", ""], "r": "B", "e": "【解析】题只要找到和原命题等价或者矛盾的命题，再排除其就可以了。“有些是”的矛盾命题为“所有非”。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46458", "t": 1, "q": "小李、小张、小马、小王在一起讨论N 地区的廉租房建设情况，小李说：“N地区的廉租房建设得都不错。”小张说：“N 地区没有廉租房建设得好。”小马说：“N 地区有的廉租房建设得不好。”小王说：“N 地区还是有廉租房建设得不错的。”\n假如小张和小马都说错了，那么，可以推出（     ）。", "a": ["小李说错了", "小李和小王都说错了", "小王说错了", "小王说对了", "", ""], "r": "D", "e": "【解析】根据小张的话“Ｎ地区没有廉租房建设得好”为假可推出“有的廉租房建设得好”，即小王的话为真；再根据小马的话“Ｎ地区有的廉租房建设得不好”为假可以推出“Ｎ地区所有的廉租房都建设得好”，即小李的话为真。则小李和小王的话都是对的。故答案选D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46459", "t": 1, "q": "有些不能飞的动物长着翅膀。\n与以上判断等值的是（     ）。", "a": ["有些长着翅膀的动物不能飞", "有些长着翅膀的动物能飞", "有些没长翅膀的动物不能飞", "有些能飞的动物没长翅膀", "", ""], "r": "A", "e": "【解析】有些不能飞的动物长着翅膀。不能飞的动物=A，长着翅膀=B.相当于有些A是B.能推出 有些B是A，即有些长着翅膀的动物不能飞。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46460", "t": 1, "q": "超过20年使用期限的汽车都应当报废。某些超过20年使用期限的汽车存在不同程度的设计缺陷。在应当报废的汽车中有一些不是H国进口车。所有H国进口车都不存在设计缺陷。\n如果以上断定为真，则以下哪一项一定为真？（     ）", "a": ["有些H国进口车不应当报废", "有些H国进口车应当报废", "有些存在设计缺陷的汽车应当报废", "所有应当报废的汽车的使用期限都超过20年", "", ""], "r": "C", "e": "【解析】某些超过20年使用期限的汽车存在不同程度的设计缺陷=有些有缺陷的是超过20年的，超过20年使用期限的汽车都应当报废，能推出C。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46461", "t": 1, "q": "在接受颈椎病康复治疗的患者中，有人只接受针灸治疗，也有人同时接受针灸和西药双重治疗，前者可以得到与后者相同的预期治疗效果。对于上述接受西药治疗的颈椎病患者来说，此种药物对于获得预期的治疗效果是不可缺少的。\n若上述断定为真，则以下哪项一定为真？（     ）\nI.对于一部分颈椎病患者来说，要配合针灸取得治疗效果，西药治疗是不可缺少的\nII.对于一部分颈椎病患者来说，要取得治疗效果，西药治疗不是不可缺少的\nIII.对于所有的颈椎病患者来说，要取得治疗效果，针灸是不可缺少的", "a": ["只有I", "只有II", "只有III", "只有I和II", "", ""], "r": "D", "e": "【解析】颈椎病康复治疗取得相同的治疗效果有两种方式：一种为仅针灸，一种为针灸+西药。对于采用第二种方式的患者来说，西药是获得预期的治疗效果不可缺少的，I正确；对于采用第一种方式的患者来说，西药不是取得治疗效果的必要条件，II正确；由题干并不能得知对于采用第二种方式的患者来说，针灸是不是必要的，III不一定为真。故答案选D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46462", "t": 1, "q": "某省游泳队进行了为期一个月的高原集训，集训最后一 日所有队员进行了一次队内测试，几位教练预测了一下队员的成绩：\n张教练说：这次集训时间短，没人会达标。\n孙教练说：有队员会达标。\n王教练说：省运会冠军或国家队队员可达标。\n测试结束后，只有一位教练的预测是正确的。\n由此可以推出（     ）。", "a": ["没有人达标", "全队都达标了", "省运会冠军达标", "国家队队员未达标", "", ""], "r": "D", "e": "【解析】题干推理规则为：①张教练说：所有人都不达标；②孙教练说：有些队员会达标；③王教练说：省运会冠军可达标或国家队队员可达标。三句话只有一句是正确的。张教练说“没有人会达标 ”和孙教练说“有人会达标 ”，二者是矛盾关系，必然一真一假。又知道“只有一位教练的预测是正确的 ”，因此王教练的话一定为假，即省运会冠军不达标且国家队运动员不达标。我们只能推出省运会冠军和国家队运动员都不达标，但题干中没有说明高原集训的人员组成，也就不能推出是否所有人员都不达标，所以 A 不选。故本题选 D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46463", "t": 1, "q": "某智能研究所目前只有三种实验机器人 A 、B 和 C，A 不能识别颜色，B 不能识别形状，C 既不能识别颜色也不能识别形状。该智能研究所的大多数实验室里都要做识别颜色和识别形状的实验。\n如果以上陈述为真，则以下哪项一定为假（     ）。", "a": ["有的实验室里三种机器人都有", "半数实验室里只有机器人 A 和 B", "这个智能研究所正在开发新的实验机器人", "半数实验室里只有机器人 A 和 C", "", ""], "r": "D", "e": "【解析】题干推理规则为：①A 不能识别颜色；②B 不能识别形状；③C 既不能识别颜色也不能识别形状；④大多数实验室里都要做识别颜色和识别形状的实验。根据④要做识别颜色和识别形状的试验，那么 A 和 B 必须同时存在，C 是否存 在并没有要求。只有 A 或者只有 B 时无法满足要求，选项 D 只有机器人 A ，故无法满足实验要求，D 的说法一定为假，所以选 D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46464", "t": 1, "q": "厂领导：我们厂一直很重视产品质量。\n质检领导：这次检查你们厂有产品不合格。\n根据质检领导的意思，以下一定为真的是（     ）。", "a": ["是否重视质量我不确定，但这次检查你们厂有产品不合格", "多数产品合格了，少数没有合格", "有的产品合格了，有的没有合格", "重视质量与产品是否合格没有必然联系", "", ""], "r": "A", "e": "【解析】题干推理规则为：①厂领导：重视产品质量；②质检领导：有产品不合格。选项 A：不确定是否重视质量，但这次检查有产品不合格，符合题干论述，一定为真，所以选 A。选项 B：题干没说多数少数，B 不一定为真，所以 B 错。选项 C：有产品不合格不等于有产品合格了，C 不一定为真，所以 C 错。选项 D：题干没有说是否有必然联系，D 不一定为真，所以 D 错。故本题选 A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46465", "t": 1, "q": "某公司 30 岁以下的年轻员工中有一部分报名参加了公司在周末举办的外语培训 班。该公司的部门经理一致同意在本周末开展野外拓展训练。所有报名参加外语培训班的员工都反对在本周末开展拓展训练。     \n由此可以推出（     ）。", "a": ["所有部门经理年龄都在 30 岁以上", "该公司部门经理中有人报名参加了周末的外语培训班", "报名参加周末外语培训班的员工都是 30 岁以下的年轻人", "有些 30 岁以下的年轻员工不是部门经理", "", ""], "r": "D", "e": "【解析】题干推理规则为：①有的 30 岁以下年轻员工参加外语培训班；②参加外语培训班→反对拓展训练；③部门经理→ 同意拓展训练。A 选项：部门经理→30 岁以上。题干没有“部门经理 ”和“30 岁以上 ”之间的条件关系，不能推出，所以 A 错。B 选项：有的部门经理参加外语培训班。根据上述推理规则可知，部门经理→ 同意拓展训练→非参加外语培训班，即部门经理都没参加外语培训，所以 B 错。C 选项：参加外语培训班→30 岁以下年轻员工，根据①可知有的 30 岁以下年轻   员工参加外语培训班，即有的参加外语培训班是 30 岁以下年轻员工，“有的 A 是 B ”无法推出“所有 A 是 B ”，不能推出，所以C 错。D 选项：有的 30 岁以下年轻员工非部门经理。根据上述推理可知：那些参加外 语培训班的 30 岁以下年轻员工→反对拓展训练→非部门经理。可以推出有些 30 岁以下的年轻员工不是部门经理，所以选 D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46466", "t": 1, "q": "小王、小张、小李、小顾四位舍友预测某次考试的结果。\n小王：我想这次大家都能过吧！\n小张：怎么可能？你没看见我乌云密布吗？\n小李：小顾肯定是没问题的。\n小顾：拜托！要是我没问题，大家就都没问题。\n成绩公布后，证明四人中只有一个人的说法是错误的。说法错误的是（     ）。", "a": ["小王", "小张", "小李", "小顾", "", ""], "r": "B", "e": "【解析】小王认为大家都能过，小张认为自己不能过，小王和小张的话构成反对关系，不可同真，但可同假，因此必有一假。又知本题只有一人的说法为假，因此两人的话必有一真一假。本题只有一句话为假，因此小李和小顾的话是真的。由小李和小顾的话可知，大家都能过。判断突破口中两句话的真假从第二步推知，大家都能过，因此小王的话为真，小张的话为假。故正确答案为B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46467", "t": 1, "q": "某商场失窃，四名保安人员因涉嫌而被传讯，四人的口供如下：\n　甲：我们四人都没有作案。\n　乙：我们四人中有人作案。\n　丙：乙和丁至少有一人没有作案。\n　丁：我没作案。\n　如果四人中有两人说的是真话，有两人说的是假话，则以下哪项断定成立？（     ）", "a": ["<p>说真话的是甲和丙<\/p>", "<p>说真话的是乙和丁<\/p>", "<p>说真话的是乙和丙<\/p>", "<p>说真话的是丙和丁<\/p>", "", ""], "r": "C", "e": "【解析】 甲与乙说的话构成矛盾关系，必有一真一假；丁又说“我没作案”，假设丁说的是真话，那么丙说“乙和丁至少有一人没有作案”，也是真话，那么真话的数量就为3，与题干两真两假矛盾，所以丁说的是假话。丁作案了，那么乙说的是真话，甲说的自然就是假话，剩下的丙一定说了真话。答案为C。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46468", "t": 1, "q": "甲、乙、丙、丁四人讨论本班同学完成作业的情况。 甲说：班里所有同学都写完了作业。乙说：如果小李写完了作业，那么小赵就没有写完作业。丙说：小李写完了作业。丁说：班里有人没有写完作业。\n已知四人中只有一人说的不对，那么可推出下列哪项（     ）。", "a": ["<p>甲说的不对，小赵没有写完作业<\/p>", "<p>乙说的不对，小李写完了作业<\/p>", "<p>丙说的不对，小赵没有写完作业<\/p>", "<p>丁说的不对，小赵写完了作业<\/p>", "", ""], "r": "A", "e": "【解析】题干推理规则为：①甲：所有人都写完了；②乙：小李→¬小赵；③丙：小李； ④丁：有人没写完。分析可知：①④为矛盾关系，必有一真一假。已知四人中只有一人说的不对，那么②③一定真。根据③为真可知小李写完了作业；根据②为真可知小赵没有写完作业。已推出“小赵没有写完作业 ”，那么“班里有人没有写完作业 ”就为真，“班里所有同学都写完了作业 ”就为假，即①为假，④为真。综上： 甲说的不对，小赵没有写完作业。故本题选 A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46469", "t": 1, "q": "期末考试过后，四位老师对六年级（1）班的英语课成绩有如下结论：\n甲：所有学生没有及格的。\n乙：英语课代表王萌萌没有及格。\n丙：学生并不是都没有及格。\n丁：有的学生没有及格。\n如果四位老师中只有一人断定属实，那么判断属实的是（     ）。", "a": ["<p>甲<\/p>", "<p>乙<\/p>", "<p>丙<\/p>", "<p>无法判断<\/p>", "", ""], "r": "C", "e": "【解析】题干推理规则为：①甲：所有学生没及格；②乙：王萌萌没及格；③丙：有的学生及格；④丁：有的学生没及格。①③为矛盾关系，必有一真一假。根据“ 四位老师中只有一人断定属实 ”可知，②④为假。根据②为假可知，王萌萌及格了，那么“③有的学生及格 ”就为真，即丙的断定属实。故本题选 C。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46470", "t": 1, "q": "春天来了，花园里鲜花朵朵，美不胜收。\n甲说： “这种红颜色的花是桃花 ”。\n乙说： “这种红颜色的花可能是桃花 ”。\n丙说： “这种红颜色的花是杏花 ”。\n已知花园里不会同时存在桃花和杏花，这三个人中只有一人判断正确，那么判断正确的是（     ）。", "a": ["<p>甲<\/p>", "<p>乙<\/p>", "<p>丙<\/p>", "<p>无法判断<\/p>", "", ""], "r": "C", "e": "<p>【解析】题干给定约束条件：花园不会同时存在桃花和杏花，甲说桃花、丙说杏花二者不能同时成立，但并非形式逻辑上的矛盾命题。乙“可能是桃花”属于模态命题，乙为假，其矛盾命题为必然不是桃花，由此可得这株花一定不是桃花，则甲的判断为假。已知仅有一人判断正确，因此真话只能是丙。故本题选C。<\/p>", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46471", "t": 1, "q": "校军训的最后一天，甲班学生进行实弹射击表演。这时，几位教官在一起谈论甲班的射击成绩。\n李教官说：“这次军训时间太短，这个班没有人射击成绩会是优秀。”\n王教官说：“不会吧，有几个人以前训练过，他们的射击成绩会是优秀。”\n赵教官说：“我看班长或是体育委员能打出优秀成绩。”\n结果发现三位教官中只有一人说对了。\n由此可以推出以下（     ）肯定为真。", "a": ["体育委员的射击成绩不优秀", "班里所有人的射击成绩都是优秀", "班长的射击成绩是优秀", "全班所有人的射击成绩都不是优秀", "", ""], "r": "A", "e": "【解析】第一步：翻译题干。①班里所有人射击成绩不优秀；②班里有些人射击成绩优秀；③班长或体委射击成绩优秀；①和②互为矛盾命题，必有一真一假，而三个条件中只有一个是真的，因此条件③必然为假，即班长或体委射击成绩优秀这句为假，由此可知班长和体委成绩都不优秀，因此A项为真。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46472", "t": 1, "q": "甲、乙、丙和丁是同班同学。\n甲说：“我班同学都是团员”。\n乙说：“丁不是团员”。\n丙说：“我班有人不是团员”。\n丁说：“乙也不是团员”。\n已知只有一人说假话，则可推出以下哪项断定是真的？（     ）", "a": ["说假话的是甲，乙不是团员", "说假话的是乙，丙不是团员", "说假话的是丙，丁不是团员", "说假话的是丁，乙是团员", "", ""], "r": "A", "e": "【解析】第一步：找出题干矛盾关系。甲与丙所说为矛盾关系，必有一真一假。\n第二步：看其余部分。据题中条件，只有一人说假话，那么乙和丁说的是真话，由乙、丁说真话可知有的人不是团员，则丙说的是真话。因此甲说假话，乙和丁都不是团员，丙是否是团员无法判定。故正确答案为A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46473", "t": 1, "q": "单位在为雪灾地区人民捐款的活动中收到两笔没有署名的捐款，经过查找，可以断定是张、李、陈、王四人中的某两个捐的。经询问，张说：“不是我捐的。” 李说：“是王捐的。” 陈说：“是李捐的。”王说：“我肯定没有捐。”最后经过调查证实，四个人中只有一个人说的是真话。\n根据上述条件，下列哪项最有可能为真？（     ）。", "a": ["是李和王捐的", "是张和陈捐的", "是陈和王捐的", "是张和李捐的", "", ""], "r": "B", "e": "【解析】第一步：翻译题干。① -张；② 王；③ 李；④ -王；\n第二步：逐一分析选项。根据题干可知，条件②和④为矛盾关系，必有一真一假，而四个人中只有一句真话，那么其余的①和③一定为假，即小张捐款了，小李没有捐。因为收到的是两笔捐款，根据小张捐了，排除A项和C项，根据小李没捐，排除D项。故正确答案为B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46474", "t": 1, "q": "甲、乙、丙三人在一起探讨一道数学题，每个人都阐述了自己的解题思路和答案。此时，甲说：“我的思路应该不对”。乙说：“甲，你的思路没有不对，是正确的”。丙说：“应该是我的思路出现了问题”。于是他们找到老师帮忙，老师听了他们的意见后说：“你们三个人中有一个人做对了，有一个人说对了。”\n据此，可以推出（     ）。", "a": ["丙做对了，乙说对了", "丙做对了，甲说对了", "甲做对了，乙说对了", "乙做对了，丙说对了", "", ""], "r": "B", "e": "【解析】第一步：整理题干信息。①甲：-甲；②乙：甲；③丙：-丙。\n第二步：分析题干。由提问可知，本题为真假推理，先找矛盾关系。①和②为矛盾关系，必有一真一假，结合题干，只有一个人说对，说明③为假，可推出丙做对了。并且题干中提到只有一个人做对，因此甲做的不对，可以推出甲说的为真话。故正确答案为B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46475", "t": 1, "q": "小王、小李、小丁三人中，只有一人会骑马。小王说：“我会骑马。”小李说：“我不会骑马。”小丁说：“小王不会骑马。”\n如果这三个人说的话只有一句是真的，那么会骑马的是（     ）。", "a": ["小王", "小丁", "小李", "无法判断", "", ""], "r": "C", "e": "【解析】第一步：整理题干信息。①小王会骑马；②小李不会骑马；③小王不会骑马；\n第二步：分析题干。①③矛盾，必有一真一假，结合题干条件“只有一句是真的”，所以②为假，即小李会骑马。故正确答案为C。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46476", "t": 1, "q": "某公司发生一起贪污案，在对所有可能涉案人员进行排查后，四位审计人员各有如下结论：\n甲：所有人都没有贪污\n乙：陆经理没有贪污\n丙：这些涉案人员不都没有贪污\n丁：有的人没有贪污\n如果四位审计人员中只有一人断定属实，那么以下哪项是真的？（     ）", "a": ["甲断定属实，陆经理没有贪污", "丙断定属实，陆经理贪污了", "乙断定属实，陆经理没有贪污", "丁断定属实，陆经理贪污了", "", ""], "r": "B", "e": "【解析】第一步：整理题干信息。甲：所有人没有贪污；乙：-陆经理贪污；丙：-所有人没有贪污；丁：有的人没贪污；\n第二步：分析题干。由提问可知，本题为真假推理，先找矛盾关系。甲和丙的断定为矛盾关系，必有一真一假，结合提问，只有一人断定属实，说明乙、丁断定不属实。由乙的断定为假，可推出陆经理贪污，由丁的断定为假，可推出所有人都贪污了。因此甲的断定为假，丙的断定为真。故正确答案为B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46477", "t": 1, "q": "在一次考试后，小郑、小孙、小何在一起讨论考试结果。\n小郑说：“如果我能得满分，则小孙也能得满分。”\n小孙说：“我认为小郑能得满分，我得不了满分。”\n小何说：“如果我能得满分，则小孙得不了满分。”\n事实上，测评结果公布后，他们三人中只有一个人说的是真话。\n由此可以推出（     ）。", "a": ["小何说的是真话，小孙没得满分", "小郑说的是真话，小孙得了满分", "小孙说的是真话，小孙没得满分", "小何说的是假话，小郑得了满分", "", ""], "r": "B", "e": "【解析】第一步：翻译题干。①郑→孙②郑且-孙③何→-孙\n第二步：找矛盾。①和②相矛盾，由题干他们三人中只有一个人说的是真话，故①、②必有一真一假，那么③必为假，即③的矛盾命题为真，即何且孙，则小孙得满分，可推出②为假，即小孙说假话。由于小何、小孙都说假话，那么小郑说真话，小郑是否得了满分根据题干条件无法推出，故只有B项正确。\n故正确答案为B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46478", "t": 1, "q": "某高校关于选派张强和李健谁去德国访学有三种不同的意见：\n①张强去，李健就不去；②张强和李健都去；③张强不去。\n学校领导研究后，同意了一种意见，否定了两种意见，由此可以推出（     ）。", "a": ["张强去", "李健去", "张强和李健都不去", "张强和李健都去", "", ""], "r": "A", "e": "【解析】第一步：整理题干信息。①张强→-李健；②张强且李健；③-张强；\n第二步：分析题干。由题干可知，本题为真假推理，先找矛盾关系。①和②为矛盾关系，必有一真一假，又因为只有一句为真，说明③为假，即：张强去，由“张强去”无法判定①和②的真假，因此不确定李健去不去，只有A项符合。故正确答案为A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46479", "t": 1, "q": "某公司财务部共有包括主任在内的8名职员，有关这8名职员，以下三个断定中只有一个是真的：\nⅠ.有人是广东人；Ⅱ.有人不是广东人；Ⅲ.主任不是广东人。\n以下哪项为真？（     ）", "a": ["<p>8名职员都是广东人<\/p>", "<p>8名职员都不是广东人<\/p>", "<p>只有一个不是广东人<\/p>", "<p>只有一个是广东人<\/p>", "", ""], "r": "A", "e": "<p>【解析】I和II是下反对关系，两者必有一真。那么II就是假话，即“有人不是广东人”为假，其矛盾命题所有人都是广东人为真。<\/p>", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46480", "t": 1, "q": "小天鹅歌舞团有小演员45名。关于这45名小演员，甲乙丙三人有如下讨论：\n甲说：“这些小演员中有些是北京人。”\n乙说：“小演员中的李欣欣不是北京人。”\n丙说：“这些小演员中有些不是北京人。”\n事实上，甲乙丙三人的话只有一句为真。\n请问，下面哪个选项为真？（     ）", "a": ["45名小演员都不是北京人", "有些小演员不是北京人", "李欣欣不是北京人", "45名小演员都是北京人", "", ""], "r": "D", "e": "【解析】考查直言命题的对当关系。观察题干可知，甲与丙所说为下反对关系，必有一真，且仅有一句真话，所以乙的话为假，即李欣欣是北京人，所以甲所说为真，故丙所说为假，即“这些小演员中有些不是北京人”为假，则所有小演员都是北京人。故答案选D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46481", "t": 1, "q": "说明下面两个推理的正确性。\n推理I：\n有些拿着吉祥物的人是来自于广州亚运会的志愿者\n所以，有些来自于广州亚运会的志愿者是拿着吉祥物的人\n推理II：\n有些拿着吉祥物的人不是来自于广州亚运会的志愿者\n所以，有些广州亚运会的志愿者不是拿着吉祥物的人（     ）。", "a": ["<p>都正确<\/p>", "<p>都不正确<\/p>", "<p>I正确，II不正确<\/p>", "<p>II正确，I不正确<\/p>", "", ""], "r": "C", "e": "<p>【解析】由推理规则“有些A是B能推出有些B是A”所以推理一正确。由推理规则“所有A是B不能推出所有B是A”所以推理二错误，综上答案选C。<\/p>", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46482", "t": 1, "q": "说明下面两个推理的正确性\n推理I：\n有些太空中的双子星是恒星\n所以，有些恒星是太空中的双子星\n推理II：\n有些太空中的双子星不是恒星\n所以，有些恒星不是太空中的双子星（     ）。", "a": ["都正确", "都不正确", "I正确，II不正确", "II正确，I不正确", "", ""], "r": "C", "e": "【解析】推理一：相当于有些A是B能推出有些B是A.。推理二：相当于有些A不是B不能推出有些B不是A.。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46483", "t": 1, "q": "某单位共有20名工作人员。①有人是本科学历；②单位的负责人不是本科学历；③有人不是本科学历。上述三个判断中只有一个是真的。\n以下哪项正确表示了该单位具有本科学历的工作人员的人数？（     ）", "a": ["20个人都是本科学历", "只有1个人是本科学历", "20个人都不是本科学历", "只有1个人不是本科学历", "", ""], "r": "A", "e": "【解析】考查直言命题的矛盾关系。①和③是下反对关系，必有一真。由“只有一个为真的”可知，②必然为假，即可推出单位的负责人是本科学历，进而推出①为真，则③为假，可推出所有人都是本科学历。故答案选A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46484", "t": 1, "q": "教育局对本县学生假期补课情况进行普查，三名普查人员分别发表了自己的结论：\n王某说：“有的学校存在假期补课的情况。”\n张某说：“有的学校不存在假期补课情况。”\n刘某说：“一高和二高都没有补课情况。”\n如果上述结论只有一个是正确的，则一定为真的是（     ）。", "a": ["一高存在假期补课，二高不存在假期补课", "一高和二高都不存在假期补课", "一高和二高都存在假期补课", "一高不存在假期补课，二高存在假期补课", "", ""], "r": "C", "e": "【解析】王某和张某的话为反对关系，二者是不可能同时为假的，必有一真。由于上述结论只有一个是正确的，那么刘某的话一定为假，即一高和二高至少有一个存在补课情况，即：一高或二高存在补课情况。由此可知王某的话为真，根据只有一句话为正确的，可以得出张某的话一定是假的。那么“有的学校不存在假期补课情况”的矛盾命题“所有学校均存在假期补课情况”。\n故正确答案为C。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46485", "t": 1, "q": "某班级有共青团员45名，关于这45名共青团员，甲乙丙三人有如下讨论：\n甲说：“这些共青团员中有些是成都人。”\n乙说：“共青团员中的小红不是成都人。”\n丙说：“这些共青团员中有些不是成都人。”\n事实上，他们三人的话只有一句话是真的。\n由此可以推出，下列哪个选项是正确的？（     ）", "a": ["45名共青团员都不是成都人", "有些共青团员不是成都人", "45名共青团员都是成都人", "小红不是成都人", "", ""], "r": "C", "e": "【解析】第一步：找出题干反对关系命题。根据题干条件可知，甲的话和丙的话是反对关系，两组“有的”必有一真，即至少有一句话是真话，而题干说三人中只有一人的话是真的，所以说真话的人一定在甲、丙两人之中，乙说的话为假话。\n第二步：看其余。根据乙说的话为假话，可知共青团员中的小红是成都人，可知这些共青团员中有些是成都人为真，即甲说的是真话。结合甲、乙、丙三人的话只有一句为真，可知丙说的话为假，进而可知，所有45名共青团员都是成都人是真话。故正确答案为C。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46486", "t": 1, "q": "关于某单位行政部的12名员工，有如下三个判断：\nI.有人会熟练地操作电脑；\nII.有人不会熟练地操作电脑；\nIII.新来的小刘不会熟练地操作电脑。\n若这三个判断中只有一句为真，以下哪项也一定为真？（     ）", "a": ["12名员工都会熟练地操作电脑", "12名员工都不会熟练地操作电脑", "仅有一人会熟练地操作电脑", "仅有一人不会熟练地操作电脑", "", ""], "r": "A", "e": "【解析】分析题干信息。I和II属于反对关系，必有一真，而三个判断中只有一句为真，所以III必定为假，即新来的小刘不会熟练地操作电脑为假，可推出新来的小刘会熟练地操作电脑。既然小刘会熟练地操作电脑，那么可推出有人会熟练地操作电脑，所以II：有人不会熟练地操作电脑为假。有人不会熟练地操作电脑的矛盾命题为所有人都会熟练地操作电脑，即12名员工都会熟练地操作电脑为真。故正确答案为A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46487", "t": 1, "q": "某大学留学生共有100人，且满足以下条件：\n（1）有人会讲法语； （2）有人不会讲法语； （3）John不会讲法语。\n如果上述表述中只有一项为真，则以下关于该大学留学生表述正确的是（     ）。", "a": ["100人均会讲法语", "100人均不会讲法语", "仅有一人会讲法语", "不能确定", "", ""], "r": "A", "e": "【解析】第一步：分析题干。1和2是下反对关系，必有一真。真话在1和2之间，故3是假话，说明John会讲法语，由此可知，有的人会讲法语。故1为真。因为只有一句为真，故2为假。2的矛盾命题为，所有人都会讲法语。故得出结论，100人均会讲法语。第二步：再次标注答案。故正确答案为A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46488", "t": 1, "q": "夕阳红合唱团有中老年团员30名。关于这30名团员，记者小王、小李、小赵有如下讨论：\n小王说：“这些团员中有些是来自燕园小区。”\n小李说：“团员中的张大妈不是来自燕园小区。”\n小赵说：”这些团员中有些不是来自燕园小区。”\n以上陈述仅有一真，由此可以推出（     ）。", "a": ["30名团员都不是来自燕园小区", "有些团员不是来自燕园小区", "张大妈不是来自燕园小区", "30名团员都是来自燕园小区", "", ""], "r": "D", "e": "【解析】第一步：整理题干信息。①这些团员有些是来自燕园小区；②团员张大妈不是来自燕园小区；③这些团员有些不是来自燕园小区；\n第二步：分析题干。由提问可知，本题为真假推理，先找反对关系。①和③为“有些······是······”和“有些······不是······”的反对关系，必有一真，即至少有一句是真话，结合提问，只有一句真话，即①、③必有一真，②一定为假，说明说真话的一定是小王和小赵二者之一，小李一定说假话。根据②为假，可知团员中的张大妈是来自燕园小区，则①“这些团员有些是来自燕园小区”为真，即小王说的是真话，故小赵说的话为假，由③“这些团员有些不是来自燕园小区”为假，可知，所有团员都是来自燕园小区。故正确答案为D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46489", "t": 1, "q": "河南大学艺术专业有42名同学，关于这些同学，小张小李小赵有如下讨论：\n小张说：有些同学是河南人\n小李说：牛牛不是河南人\n小赵说：有些同学不是河南人\n然而三个人只有一个为真，以下哪个选项为真？（     ）。", "a": ["42名同学都是河南人", "有些同学不是河南人", "牛牛不是河南人", "42名同学都不是河南人", "", ""], "r": "A", "e": "【解析】第一步：找关系。（1）有些同学是河南人；（2）牛牛不是河南人；（3）有些同学不是河南人。条件（1）和（3）为两个“有的”，必有一真，而根据“三个人只有一个为真”可知唯一的一真在条件（1）和（3）中，那么条件（2）一定为假。\n第二步：看其余。根据条件（2）为假，那么，可知牛牛一定是河南人为真，可推知有些同学是河南人，条件（1）为真，那么条件（3）为假，那么，可知所有同学都是河南人为真。故正确答案为A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46490", "t": 1, "q": "某班的30名学生中：（1）有人喜欢听音乐；（2）班长不喜欢听音乐；（3）有人不喜欢听音乐。\n上述三个表述中只有一个是真的，则可以得出（     ）。", "a": ["30名学生都喜欢听音乐", "30名学生都不喜欢听音乐", "只有1名学生喜欢听音乐", "只有1名学生不喜欢听音乐", "", ""], "r": "A", "e": "【解析】第一步：找关系。①有的人喜欢听音乐；②班长不喜欢听音乐；③有的人不喜欢听音乐；①③属于反对关系，必有一真，根据题干条件三个表述中只有一个是真的，则②一定是假的。\n第二步：看其余。根据②是假的，可知：班长喜欢听音乐，可以推出“①有的人喜欢听音乐”为真，则“③有的人不喜欢听音乐”为假，那么③的矛盾为真：即所有人都喜欢听音乐。该班级一共30名学生，故30名学生都喜欢听音乐，对应A项。故正确答案为A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46491", "t": 1, "q": "某社区居委会开展工作满意度调查，该社区包括张某在内有3679位居民。\n有关这3679位居民，以下三个断定中只有一个是真的：\n（1）有人填写了调查问卷；（2）有人未填写调查问卷；（3）张某未填写调查问卷。\n根据这段文字，以下为真的是（     ）。", "a": ["3679位居民都填写了调查问卷", "3679位居民都未填写调查问卷", "有一位居民未填写调查问卷", "无法确定该社区填写调查问卷的人数", "", ""], "r": "A", "e": "【解析】第一步：整理题干信息。①有人填写；②有人未填写；③张某未填写。\n第二步：分析题干。由提问可知，本题为真假推理，①和②为反对关系，必有一真，结合题干信息，只有一句为真，则③必定为假，推出张某填写了调查问卷，故可以推出“①有人填写了调查问卷”为真。由于三句话中只有一句为真，故条件②为假，其矛盾关系为真，即所有人都填写了调查问卷，只有A项符合。\n故正确答案为A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46492", "t": 1, "q": "下列3句话中只有一句是假的：\n飞鸿公司所有员工都捐了款。\n飞鸿公司会计捐了款。\n飞鸿公司所有员工都没有捐款。\n由此可见（     ）。", "a": ["飞鸿公司经理和副经理都捐了款", "飞鸿公司经理和副经理都没捐款", "飞鸿公司经理捐了款，但是副经理没有捐款", "飞鸿公司副经理捐了款，但是经理没有捐款", "", ""], "r": "A", "e": "【解析】第一步：整理题干信息。①所有员工捐款；②会计捐款；③所有员工没有捐款；①“所有是”和③“所有非”必有一假，结合题干条件只有一假可知，①③为一真一假，则②为真，会计捐款了，则③为假，①为真，飞鸿公司所有员工都捐款，因此飞鸿公司经理和副经理都捐了款，A项正确。故正确答案为A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46493", "t": 1, "q": "今年春运对全市中巴客运车进行安全检查后，甲、乙、丙三名交警有如下结论：\n甲：所有中巴客运车都存在超载问题；\n乙：所有中巴客运车都不存在超载问题；\n丙：如意公司的中巴客运车和吉祥公司的中巴客运车都存在超载问题。\n如果上述三个结论只有一个错误，则以下哪项一定为真（     ）。", "a": ["如意公司的中巴客运车和吉祥公司中巴客运车都不存在超载问题", "如意公司的中巴客运车和吉祥公司的中巴客运车都存在超载问题", "如意公司的中巴客运车存在超载问题，但吉祥公司的中巴客运车不存在超载问题", "吉祥公司的中巴客运车存在超载问题，但如意公司的中巴客运车不存在超载问题", "", ""], "r": "B", "e": "【解析】本题属于真假推理题第一步：找关系。甲说“所有中巴客运车都存在超载问题”，和乙说“所有中巴客运车都不存在超载问题”，为两个“所有”，必有一假。因此唯一的假话在甲、乙之中，可以得出丙说得一定是真话。第二步：看其余。丙的结论为真，即“如意公司和吉祥公司的中巴客运车都存在超载问题”，B项正确。同时可知，甲的结论为真，乙的结论为假。故正确答案为B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46494", "t": 1, "q": "某公司的人力资源部开展野外拓展训练，由部门经理带领部门其他员工，共九人参加该活动。\n已知以下三个陈述中只有一个为真：\n（1）该野外拓展训练小组一行九人并非没有人住在营地\n（2）该野外拓展训练小组一行九人不都住在营地\n（3）经理不住在营地\n则下列说法为真的是（     ）。", "a": ["该野外拓展训练小组一行九人只有一人住在营地", "该野外拓展训练小组一行九人只有一人不住在营地", "该野外拓展训练小组一行九人都住在营地", "该野外拓展训练小组一行九人都不住在营地", "", ""], "r": "C", "e": "【解析】本题为真假推理题型，先梳理题干信息如下：（1）有的人住在营地；（2）有的人不住在营地；（3）经理不住在营地。观察题干信息可知（1）（2）为反对关系，根据反对关系至少有一真可以得出（3）为假，即经理住在营地这句话为真。进而得出（1）是真的，（2）是假的，即所有人都住在营地为真。故正确答案为C。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46495", "t": 1, "q": "某跨国公司招来20名新职员，有如下四个判断\n①有人能熟练地说法语；②有人能熟练地说英语；③有人不能熟练地说法语；④新职员小王不能熟练地说法语。\n若以上四个判断中只有一个为真，下列哪项也一定为真？（     ）", "a": ["20名新职员都能熟练地说法语", "20名新职员都能熟练地说英语", "只有一人能熟练地说法语", "只有一人能熟练地说英语", "", ""], "r": "A", "e": "【解析】第一步：整理题干信息。①有人能熟练地说法语：②有人能熟练地说英语；③有人不能熟练地说法语；④小王不能熟练地说法语。第二步：分析题干。由提问可知，本题为真假推理，但无明显矛盾关系，找反对关系。①和③为反对关系，必有一真，结合提问只有一句为真，说明②④为假，其矛盾则为真，可知：所有人都不能熟练地说英语、小王能熟练地说法语，即①为真，则③为假，说明所有人都能熟练地说法语，只有A项符合。故正确答案为A。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46496", "t": 1, "q": "德国经济在席卷全球的金融危机当中受到的冲击与其他发达国家相比较小，主要原因是德国经济建立在先进制造业的基础上，德国的机械装备和汽车制造业保持了很强的竞争力。一些人根据德国的例子得出结论：只有具备强大的制造竞争水平，一个国家的经济才有高度的稳定性。\n如果以下各项为真，哪项能够质疑上述结论？（     ）", "a": ["某国制造业不发达，该国经济一直动荡不安", "有些制造业不发达的国家在金融危机中受影响较小", "有些国家保持长期经济稳定，却没有发达的制造业", "有些国家制造业很发达，但经济并没有长期保持稳定", "", ""], "r": "C", "e": "【解析】题干中的结论是：具备强大的制造业竞争水平是一个国家经济有高度稳定性的必要条件。要质疑这个结论，就要指出具备强大的制造业竞争水平不是一个国家经济有高度。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46497", "t": 1, "q": "近来西方舆论界存在一种观点认为中国经济高速发展，除污染了地球环境外，还造成了国际上石油等能源价格的暴涨。\n以下最能反驳西方舆论界的观点的是（     ）。", "a": ["石油输出国组织的石油产量近年不断下降", "去年中国经济依然高速发展，但是国际上石油等能源价格比往年低", "西方发达国家的生产生活方式造成了国际上石油等能源价格的暴涨", "汽车业的高速发展以及汽车的普及造成了国际上石油等能源价格的暴涨", "", ""], "r": "B", "e": "【解析】ACD都属于另有他因削弱，属于削弱论证方式。题干观点是中国经济高速发展引起能源价格的暴涨，B属于核心逻辑链条上的A且非B，直接用事实去反驳。所以B力度最强。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46498", "t": 1, "q": "<p>某军事驻地有9名士兵陆续出现身体极度不适的症状。据调查，在距这9名士兵驻守点约200米处停有两辆被贫铀弹击毁的坦克。医生认为，这是由于他们吸入了贫铀弹爆炸产生的放射性粉尘。但有关专家反对说，贫铀弹击中目标后，其产生的放射性粉尘最终会沉降在爆炸点150米的范围内，因此不会影响这些士兵的身体健康。 以下哪项如果为真，能够反驳上述专家的言论？（ ）<\/p>", "a": ["<p>研究已经证明，贫铀弹会诱发各种肿瘤疾病<\/p>", "<p>该地区的风一向很大，贫铀弹爆炸产生的放射性粉尘会被风吹到40公里外的地方<\/p>", "<p>在爆炸点150米范围内吸入放射性粉尘的士兵均出现了身体不适症状<\/p>", "<p>煤炸事件发生后，路过该地的某居民没有出现明显的不适状况<\/p>", "", ""], "r": "B", "e": "【解析】专家由“贫铀弹击中目标后，其产生的放射性粉尘最终会沉降在爆炸点150米的范围内”得出结论“不会影响这士兵的身体健康”。B项说明贫铀弹会爆炸产生的放射性粉尘会被风吹到40公里以外的地方，还是会对士兵身体健康产生影响，削弱了专家的论证方式。A项“诱发各种肿瘤疾病”结论无关，不选。C项说明150米范围内的士兵出现的不适症状，与题干中200米士兵身体健康论述不一致，不选。D项既不能支持也反对专家观点，不选。故答案选B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46499", "t": 1, "q": "某调查显示：82%的小学生每天都会上网，84%的每天都会使用QQ，78%的每天都会使用QQ空间，65%的每天都会使用微博。据此有人认为，小学生已从媒介被动的受众转变为积极的参与者和传播者。\n如果以下各项为真，最能削弱上述论证（     ）。", "a": ["小学生的QQ好友或微博关注对象大多限于同学", "大多数小学生每天上网时间被控制在半小时以内", "大多数家庭的电脑中都安装了学生上网监控软件", "大多数小学生使用QQ空间和微博只是浏览信息", "", ""], "r": "D", "e": "【解析】论据：很多小学生会上网使用QQ、微博等。论点：小学生已经开始从被动的受众变成参与者和传播者。若要削弱论证，只需说明，即使大部分小学生都会上网浏览即时信息，但是并不能改变他们被动受众的身份。而D项正说明了这一点，只是浏览信息，不能让他们成为参与者和传播者。故正确答案为D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46500", "t": 1, "q": "研究发现，试管婴儿的出生缺陷约为9%，自然受孕婴儿的出生缺陷率约为6.6％。这两部分婴儿的眼部缺陷比例分别为0.3%和0.2%，心脏异常比例为5%和3%，生殖系统缺陷的比例分别为1.5%和1%。因而可以说明，试管婴儿技术导致试管婴儿比自然受孕婴儿出生缺陷率高。\n以下哪项如果为真，最能质疑该结论？（     ）", "a": ["试管婴儿要经过体外受精和胚胎移植过程，人为操作都会加大受精卵受损的风险", "选择试管婴儿技术的父母大都有生殖系统功能异常，这些异常会令此技术失败率增加", "试管婴儿在体外受精阶段可以产生很多受精卵，只有最优质的才被拣选到母体进行孕育", "试管婴儿的父母比自然受孕婴儿的父母年龄大很多，父母年龄越大，新生儿出生缺陷率越高", "", ""], "r": "D", "e": "【解析】题干中举了例子和数据来证明试管婴儿比自然受孕的出生缺陷更高。而D选项说明你做试管婴儿的父母本身年龄就大，而大龄父母生出来的儿女本来就儿童容易缺陷，说明不是试管婴儿技术的问题，而是你父母的问题。A选项属于加强项，说明确实试管婴儿容易缺陷。B选项说明是父母生殖有问题，导致技术失败率增加，那说明还是技术的原因导致婴儿缺陷。而C选项属于无关项。故答案选D。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46501", "t": 1, "q": "“断食法”在日本、台湾等亚洲的一些地区比较盛行，这种方法是一日三餐以果汁、菜汤及清水等低卡路里饮食取代固体食物，为期三至十天不等，以求达到排毒、烧脂及瘦身等效果。\n如果以下各项为真，哪项最不能削弱上述观点？（     ）", "a": ["人体每天总摄取量过低时，可能会出现血糖及血压过低的状况", "肥胖者身体摄取热量太低，会加速燃烧脂肪，肾功能会发生积极变化", "食用蔬菜可以促进肠道蠕动，但因其热量过低，过度食用会干扰新陈代谢", "低卡路里饮食会导致体内毒素因缺乏营养而丧失活性，但同时因新陈代谢遭扰乱而存在致胖风险", "", ""], "r": "B", "e": "【解析】削弱型题目。此题要求选择最不能削弱题干观点的一项。题干论点是“断食法”可以达到排毒、烧脂及瘦身的效果。A项说明“断食法”会造成血糖低的后果；C项表明过度食用蔬菜会干扰新陈代谢；D项表明扰乱新陈代谢会有致胖风险；三项均削弱了题干观点。而B项说明“断食法”会燃烧脂肪并对肾功能有积极作用，加强了题干观点。故答案选B。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}, {"id": "46502", "t": 1, "q": "现在多数大学把将近一半的课余时间用来上网，进图书阅览室的时间只有上网时间的五分之一。因此有人说当代大学生是“缺少阅读的一代”，他们的平均阅读量比30年前的大学生少得多。\n以下哪项为真，能对上述结论构成最强有力的质疑？（     ）", "a": ["现在本科毕业论文要求详尽列出参考文献目录，而过去没有这个要求", "全国每年出版的图书无论是种类还是总印数，都是30年前的好几倍", "一项调查表明，在校大学生上网时间有一半以上是用在阅读上", "青年作家韩寒的博客开通才两年多，点击量就达2亿3千多万", "", ""], "r": "C", "e": "【解析】题干由大学生课余时间用来上网，平均阅读量比以前少，推出当代大学生是“缺少阅读的一代”。如果C项为真，说明大学生的阅读方式和以前不同，课余时间用来上网也主要用于阅读，从而削弱了题干结论。A.B.D三项都是无关项，故答案选C。", "l3": "一般能力", "l4": "2.4节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||3.1节", "n": "一般能力 / 3.1节", "qs": [{"id": "46503", "t": 1, "q": "<p>1，4，7，10，（ ），16。<\/p>", "a": ["<p>11<\/p>", "<p>12<\/p>", "<p>13<\/p>", "<p>14<\/p>", "", ""], "r": "C", "e": "【解析】观察数列，相邻两项差值均为3，为等差数列，则所求项=10+3=13，代入验证：13+3=16，符合规律。故正确答案为C。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46504", "t": 1, "q": "<p>-2，1，（ ），-5，13，-29，61。<\/p>", "a": ["<p>-1<\/p>", "<p>1<\/p>", "<p>-2<\/p>", "<p>2<\/p>", "", ""], "r": "B", "e": "【解析】数列无明显特征，且作差无规律，考虑作和。相邻两项作和后得到：-1、（     ）、（     ）、8、-16、32，构成公比为的等比数列，则第二项和第三项分别为2和-4。故1+所求项=2，即所求项为2-1=1。故正确答案为B。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46505", "t": 1, "q": "<p>15，30，60，120，（ ）。<\/p>", "a": ["<p>240<\/p>", "<p>180<\/p>", "<p>360<\/p>", "<p>60<\/p>", "", ""], "r": "A", "e": "【解析】观察发现，数列为公比是2的等比数列，则所求项为120×2=240。故正确答案为A。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46506", "t": 1, "q": "<p>0，1，3，7，15，（ ）。<\/p>", "a": ["<p>30<\/p>", "<p>31<\/p>", "<p>32<\/p>", "<p>33<\/p>", "", ""], "r": "B", "e": "【解析】数列变化幅度较小且呈递增趋势，优先考虑做差。用后一项减去前一项得到新数列1、2、4、8，新数列是公比为2的等比数列，下一项为8×2=16，则原数列所求项=15+16=31。故正确答案为B。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46507", "t": 1, "q": "19，27，35，43，（     ）。", "a": ["48", "50", "51", "55", "", ""], "r": "C", "e": "【解析】题干数列无明显特征，且数字差距较小，优先考虑做差。做差后可得题干数列为公差是8的等差数列，故（     ）处数字为43+8=51。故正确答案为C。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46508", "t": 1, "q": "13，9，4，5，-1，（     ）。", "a": ["0", "-4", "4", "6", "", ""], "r": "D", "e": "【解析】观察数列可知，本题为基础数列中的简单递推数列。其规律为：第一项-第二项=第三项，即有：13-9=4，9-4=5，4-5=-1，故所求项为。5-（-1）=6故正确答案为D。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46509", "t": 1, "q": "<p>8，13，18，23，（ ）。<\/p>", "a": ["<p>27<\/p>", "<p>28<\/p>", "<p>29<\/p>", "<p>30<\/p>", "", ""], "r": "B", "e": "【解析】观察数列单调且变化幅度小，考虑作差，13-8=5，18-13=5，23-18=5，数列为公差为5的等差数列，则（  "【解析】数列无明显特征，优先考虑多级数列，做差后无规律，再考虑递推数列，3=3×1+0，7=3×2+1，23=7×3+2，所以（     ）=23×4+3=95。故正确答案为A。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46565", "t": 1, "q": "4，9，10，2，-16，（     ）", "a": ["-36", "-42", "-51", "-66", "", ""], "r": "A", "e": "【解析】观察数列无明显特征，优先考虑做差，做差无规律考虑递推数列。观察数列可知：（9-4）×2=10，（10-9）×2=2，（2-10）×2=-16；即（第二项-第一项）×2=第三项，因此所求项=（-16-2）×2=-36。故正确答案为A。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46566", "t": 1, "q": "<p>-2，1，3，6，（ ），21，63。<\/p>", "a": ["<p>12<\/p>", "<p>15<\/p>", "<p>18<\/p>", "<p>21<\/p>", "", ""], "r": "C", "e": "【解析】数列无明显特征，多级无规律，考虑递推数列。观察发现：-2+3=1，1×3=3，3+3=6，即第一项+3=第二项，第二项×3=第三项，第三项+3=第四项，+3、×3交替出现，猜测所求项=6×3=18。验证：18+3=21，21×3=63，满足规律。故正确答案为C。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46567", "t": 1, "q": "1，2，2，3，4，9，32，（     ）。", "a": ["<p>45<\/p>", "<p>68<\/p>", "<p>196<\/p>", "<p>283<\/p>", "", ""], "r": "D", "e": "<p>【解析】观察数列，无明显特征且作差作和后无明显规律，考虑递推。观察发现：1×2-0=2，2×2-1=3，2×3-2=4，3×4-3=9，4×9-4=32，递推规律为a<sub>n<\/sub>=（ ）-（n-3）（n≥3），故下一项为9×32-5=283。故正确答案为D。<\/p>", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46568", "t": 1, "q": "<p>1，2，3，8，27，（ ），5945。<\/p>", "a": ["<p>70<\/p>", "<p>85<\/p>", "<p>200<\/p>", "<p>220<\/p>", "", ""], "r": "D", "e": "【解析】观察数列无明显特征，且作差、作和均无规律，考虑递推数列。观察可得：1×2+1=3、2×3+2=8、3×8+3=27，即第一项×第二项+n，n是公差为1的等差数列。则所求项=8×27+4=220，验证下一项：27×220+5=5945，符合。故正确答案为D。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46569", "t": 1, "q": "37，18，36，38，98，（     ）。", "a": ["60", "74", "85", "87", "", ""], "r": "B", "e": "【解析】数列无明显特征，多级无规律。观察发现，数列的个位数构成新数列：7，8，6，8，8，满足7*8=56，8*6=48，6*8=48，即在递推积规律基础上取个位数字作为下一项，则所求项个位数应是8*8=64的个位数4；数列的十位数构成新数列：3，1，3，3，9，满足3*1=3，1*3=3，3*3=9，即为递推积数列，则所求项十位数满足3*9=27，参考个位数的规律保留个位数7。则原数列所求项应为74。故正确答案为B。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46570", "t": 1, "q": "8，24，16，20，18，（     ）。", "a": ["19", "20", "21", "22", "", ""], "r": "A", "e": "【解析】方法一：数列无明显特征，考虑多级作差。后项减前项，得到新数列：16，-8，4，-2，（1），构成公比为-（1/2）的等比数列，则所求项=18+1=19。故正确答案为A。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46571", "t": 1, "q": "1，1，4，13，43，142，（     ）。", "a": ["469", "369", "234", "198", "", ""], "r": "A", "e": "【解析】观察数字无明显特征，作差作和均无规律，考虑递推数列。观察发现1+1*3=4，1+4*3=13，4+13*3=43，13+43*3=142，即第一项+第二项*3=第三项，则所求项=43+142*3=469。故正确答案为A。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46572", "t": 1, "q": "6，3，5，13，2，63，（     ）。", "a": ["-36", "-37", "-38", "-39", "", ""], "r": "B", "e": "【解析】题干无明显特征，且数列波动明显，优先考虑递推数列。观察发现，13=6*3-5，2=3*5-13，63=5*13-2，即相邻四项中，第四项=第一项*第二项-第三项，则所求项=13*2-63=-37，对应B选项。故正确答案为B。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46573", "t": 1, "q": "2，2，6，10，22，（     ）。", "a": ["22", "36", "42", "49", "", ""], "r": "C", "e": "【解析】观察数列无明显特征，作差无规律考虑作和两两加和得新数列为4，8，16，32，（     ），新数列是公比为2的等比数列，则新数列中（     ）处为64，题干所求项为64-22=42。故正确答案为C。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46574", "t": 1, "q": "0，1，1，2，4，8，16，（     ）。", "a": ["24", "30", "32", "36", "", ""], "r": "C", "e": "【解析】观察数列无明显特征，多级无规律，考虑递推。发现：0+1=1，0+1+1=2，0+1+1+2=4，0+1+1+2+4=8，0+1+1+2+4+8=16，即前面所有项加和得到下一项，因此所求项=0+1+1+2+4+8+16=32。故正确答案为C。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46575", "t": 1, "q": "3，12，52，265，（     ）。", "a": ["689", "1239", "1596", "2478", "", ""], "r": "C", "e": "【解析】观察数列无明显特征，且作差作和无规律，考虑递推。观察得到：3*3+3=12，12*4+4=52，52*5+5=265，即前一项*n+n=后一项，且n构成首项为3、公差为1的等差数列，则所求项=265*6+6=1596。故正确答案为C。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46576", "t": 1, "q": "<p>2， 3， 4， 9， 32，（ ）。<\/p>", "a": ["<p>288<\/p>", "<p>283<\/p>", "<p>136<\/p>", "<p>68<\/p>", "", ""], "r": "B", "e": "<p>【解析】步骤1：观察数列特征数字变化逐渐加快，优先考虑两项递推相乘规律。尝试前两项相乘，再减去一个数得到下一项：2×3-2=4；3×4-3=9；4×9-4=32。步骤2：总结修正项规律减去的数字依次为：2、3、4，是公差为1的自然数列，下一个修正数字为5。步骤3：计算括号内数值9×32-5=288-5=283。<\/p>", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}, {"id": "46577", "t": 1, "q": "5，11，24，52，（     ）。", "a": ["88", "112", "130", "156", "", ""], "r": "B", "e": "【解析】数列无明显特征，多级无规律，考虑递推。观察发现：5*2+1=11，11*2+2=24，24*2+4=52，即前项*2+修正项=后项，修正项1，2，4，（8）构成比为2的等比数列，则所求项=52*2+8=112。故正确答案为B。", "l3": "一般能力", "l4": "3.1节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||3.2节", "n": "一般能力 / 3.2节", "qs": [{"id": "46578", "t": 1, "q": "同学们去划船，加一条船，每船坐8人，少一条船每船坐12人，问共有（     ）人。", "a": ["44", "45", "48", "50", "", ""], "r": "C", "e": "【解析】是8人与12人的倍数。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46579", "t": 1, "q": "甲区人数是全城4/13，乙区是甲区的5/6，丙区是前两区的4/11，丁区比丙区多4000人，全城（     ）人。", "a": ["18.6万", "15.6万", "21.8万", "22.3万", "", ""], "r": "B", "e": "【解析】甲区人数是全城的4/13，可知全城人数是13的倍数，只有B选项符合。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46580", "t": 1, "q": "已知甲、乙两人共有260本书，其中甲的书有13％是专业书，乙的书有12.5％是专业书，问甲有（     ）本非专业书。", "a": ["75", "87", "174", "67", "", ""], "r": "B", "e": "【解析】由“甲的书有13％是专业书”，那么甲有的非专业书是87的倍数，所以排除A.D；C项，若甲有174本非专业书，则甲有200本书，那么乙的专业书不是整数，所以排除C项。故选B。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46581", "t": 1, "q": "某公司去年有员工830人，今年男员工人数比去年减少6%，女员工人数比去年增加5%，员工总数比去年增加3人，问今年男员工有（     ）人。", "a": ["329", "350", "371", "504", "", ""], "r": "A", "e": "【解析】今年男员工比去年减少6%，说明是去年的94%，分子分母同约分，则今年男员工的人数能被47整除，只有A选项满足。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46582", "t": 1, "q": "甲、乙、丙三人绕圆形跑道赛跑。甲跑完一圈要1分钟，乙跑完一圈要1分30秒，丙跑完一圈要1分15秒。现在三个人同时同向从同一地点出发，则（     ）分钟后三人又在出发地相遇。", "a": ["3", "9", "10", "15", "", ""], "r": "D", "e": "【解析】将时间统一转换为秒，则甲跑完一圈需要60秒，乙需要90秒，丙需要75秒，求三人再次在出发地相遇的时间，即求60、90和75的最小公倍数。60、90和75的最小公倍数为900，900秒=15分钟，所以15分钟后三人又在出发地相遇。故正确答案为D。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46583", "t": 1, "q": "一袋糖，奶糖占3/5，又加10颗水果糖，奶糖占4/7，问奶糖有（     ）。", "a": ["100", "112", "120", "122", "", ""], "r": "C", "e": "【解析】奶糖占3/5，可知奶糖数是3的倍数，观察选项只有C符合。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46584", "t": 1, "q": "箱内有白黄两种球，小明一次拿出5黄3白，N次后，白球拿完了，黄剩8个，换一种拿法，每次拿出7黄3白，M次后黄完了剩下24白，问原共有（     ）个球。", "a": ["246", "258", "264", "272", "", ""], "r": "C", "e": "【解析】第一次拿球可以用8N+8表示，第二次拿球可以用10M+24表示，说明球的总数减去24是10的倍数，选择C。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46585", "t": 1, "q": "有一个白色的盒子，一个红色的盒子，从白色盒子取出1/3的球放入红色盒子内，再从红色盒子内取出1/5的球放到白色的盒子内，最后两个盒子内的球的个数都为24，问原来白色，红色盒子内各有（     ）个球。", "a": ["21，27", "27，21", "15，33", "36，12", "", ""], "r": "B", "e": "【解析】（那么这时我们可以通过两个分数进行快速的判断）白色盒子里的球数一定能被3整除，4个选项都可以；所以还要结合从白色盒子内取出1/3的球放到红色的盒子内，看红色盒子是否能被5整除，所以选B。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46586", "t": 1, "q": "某高速公路从5千米处开始每隔3千米设置一个超速监控器，并且从10千米处开始，每隔7千米设置一个应急车道监控，刚好在17千米处第一次同时设置这两种设施。那么，第二次同时设置这两种设施是在（     ）千米处。", "a": ["26", "34", "38", "59", "", ""], "r": "C", "e": "【解析】每隔3千米设置一个超速监控器，每隔7千米设置一个应急车道监控，则每隔3×7=21千米同时设置这两种设施。第一次在第17千米处同时设置这两种设施，则第二次同时设置这两种设施是在17+21=38千米处。故正确答案为C。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46587", "t": 1, "q": "任意取一个大于50的自然数，如果它是偶数，就除以2；如果它是奇数，就将它乘3之后再加1。这样反复运算，最终最小结果是（     ）。", "a": ["0", "1", "2", "3", "", ""], "r": "B", "e": "【解析】设这个数64，最终结果为1。故答案为B。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46588", "t": 1, "q": "动物园的饲养员给三群猴子分花生，如只分给第一群，则每只猴子可得12粒；如只分给第二群，则每只猴子可得15粒；如只分给第三群，则每只猴子可得20粒。那么平均给三群猴子，每只可得（     ）粒。", "a": ["5", "7", "10", "13", "", ""], "r": "A", "e": "【解析】设共有60粒花生，那么第一群猴子有5只，第二群猴子有4只，第三群猴子有3只，共12只猴子，平均分每只5粒。故选A。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46589", "t": 1, "q": "某单位共有A.B.C三个部门，三部门人员平均年龄分别为38岁、24岁、42岁。A和B两部门人员平均年龄为30岁，B和C两部门人员平均年龄为34岁。该单位全体人员的平均年龄为（     ） 岁。", "a": ["<p>34<\/p>", "<p>36<\/p>", "<p>35<\/p>", "<p>37<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/BCt1V67HMu2BpzZz0HRixVt7fhq9gG6o1dO1yxRv.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46590", "t": 1, "q": "两个大小数之和是54.758，较大数的小数点向左移动一位就等于较小数，则较大的数为（     ）。", "a": ["49.78", "49.53", "49.35", "46.78", "", ""], "r": "A", "e": "【解析】先用尾数法，排除B.C；再代入A，49.78＋4.978=54.758，故选A。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46591", "t": 1, "q": "一次数学考试共有20道题，规定：答对一题得2分，答错一题扣1分，未答的题不计分。考试结束后，小明共得23分，他想知道自己做错了几道题，但只记得未答得题的数目是个偶数。请你帮助小明计算下，他答错了（     ）道题。", "a": ["<p>3<\/p>", "<p>4<\/p>", "<p>5<\/p>", "<p>6<\/p>", "", ""], "r": "A", "e": "<p>【解析】已知“未答得题的数目是个偶数”，对题的为x，错题为y，2x-y=23，2x为偶数，23为奇数，y定为奇数，排除B.D。A项3代入方程，x=13，x＋y=16＜20，未答的题为20-16=4满足题意，答案选A。<\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46592", "t": 1, "q": "在一次射箭比赛中，已知小王与小张三次中靶环数的积都是36，且总环数相等，还已知小王的最高环数比小张的最高环数多（中箭的环数是不超过10的自然数），则小王的三次射箭的环数从小到大排列是（     ）。", "a": ["2，2，9", "3，3，4", "2，3，6", "1，6，6", "", ""], "r": "A", "e": "【解析】因为中箭的环数是不超过10的自然数，结合选项，如果小王的射箭环数为2、2、9，总和为13，则小张的射箭环数为1、6、6，符合题意。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46593", "t": 1, "q": "1分、2分和5分的硬币共100枚，价值2元，如果其中2分硬币的价值比1分硬币的价值多13分，那么三种硬币各（     ）枚。", "a": ["51、32、17", "60、20、20", "45、40、15", "54、28、18", "", ""], "r": "A", "e": "【解析】根据“如果其中2分硬币的价值比1分硬币的价值多13分”，第二项值×2-第一项值=13，直接选A。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46594", "t": 1, "q": "去超市购物，如果买9件A商品，5件B商品，1件C商品，一共需要98元。如果买13件A商品，7件B商品，1件C商品，一共需要126元。若A.B.C三种商品各买2件，共需要（     ）钱。", "a": ["76", "84", "98", "108", "", ""], "r": "B", "e": "【解析】9A+5B+C=98，13A+7B+C=126，令A=0，有B=14，C=28，2（A+B+C）=84。故答案为B。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46595", "t": 1, "q": "王支书在一次村委会选举中，需2/3的选票才能当选，当统计完3/5的选票时，他得到的选票数已经达到当选票数的3/4，他还需要得到剩下选票的（     ）才能当选。", "a": ["7/10", "8/11", "5/12", "3/10", "", ""], "r": "C", "e": "【解析】设共有60人参选，那么需要得到40张选票才能当选，统计完3/5，即36张时，他得到了30张，剩下24张，他还需要得到10张，故需要10/24=5/12。故答案为C。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46596", "t": 1, "q": "小芳有两支同等长度但粗细不同的新蜡烛。已知点完一支粗蜡烛要2小时，而点完一支细蜡烛要1小时。某天晚上突然停电，小芳同时点燃了这两支蜡烛，来电后又同时熄灭了这两支蜡烛，发现剩下的粗蜡烛长度是细蜡烛的2倍。那么，停电了（     ）分钟。", "a": ["30", "40", "48", "50", "", ""], "r": "B", "e": "【解析】本题中给出两支蜡烛长度相等及分别点完蜡烛所用的时间，故可用赋值法将两支蜡烛的长度赋值，进而求出两蜡烛燃烧的效率。根据“点完一支粗蜡烛需要2小时，点完一支细蜡烛需要1小时”，将两蜡烛长度均赋值为2，可求得粗蜡烛燃烧的效率为2÷2=1，细蜡烛燃烧的效率为2÷1=2。设停电了X小时， 根据“剩下的粗蜡烛长度是细蜡烛的2倍”得：2-X=2×（2-2X），解得X=2/3小时=40分钟。故正确答案为B。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46597", "t": 1, "q": "调研人员在一次市场调查活动中收回435份调查问卷，其中80%的调查问卷上填写了被调查的手机号码。那么调研人员至少需要从这些调查表中随机抽出（     ）份，才能保证一定能找到两个手机号码后两位相同的被调查者。", "a": ["101", "175", "188", "200", "", ""], "r": "C", "e": "【解析】最不利情况：先抽中了435×20%=87（份）没有填写手机号码的问卷，再抽中了100份手机号码后两位各不相同的问卷，总共87＋100＝187份。最不利情况再加1，188份就是答案。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46598", "t": 1, "q": "有300名求职者参加高端人才专场招聘会，其中软件设计类、市场营销类、财务管理类和人力资源管理类分别有100、80、70和50人。问至少有（     ）人找到工作，才能保证一定有70名找到工作的人专业相同。", "a": ["71", "119", "258", "277", "", ""], "r": "C", "e": "【解析】考查抽屉原理。69＋69＋69＋50＋1＝258。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46599", "t": 1, "q": "一次数学考试满分为100分，某班前六名同学的平均分为95分，排名第六的同学得86分，假如每个人得分是互不相同的整数，那么排名第三的同学最少得（     ）分。", "a": ["94", "97", "95", "96", "", ""], "r": "D", "e": "【解析】总分95×6＝570，每个人得分是互不相同的整数，要第三的最少，那么第一、第二要尽量多，第一100分，第二99分，第六86分；三、四、五名总分570－100－99－86＝285，285÷3＝95，第三、第四、第五分别为96、95、94分。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46600", "t": 1, "q": "从一副完整的扑克牌中，至少抽出（     ）张牌，才能保证至少有6张牌的花色相同。", "a": ["<p>21<\/p>", "<p>22<\/p>", "<p>23<\/p>", "<p>24<\/p>", "", ""], "r": "C", "e": "<p>【解析】最不利的情况是每个花色抽5张，以及大小王两张，这时随便再抽一张就有6张牌花色相同。至少4×5+2+1=23，选C。<\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46601", "t": 1, "q": "从一副无“王”的扑克牌，至少抽取（     ）张，方能使其至少有两张牌具有相同的点数。", "a": ["10", "11", "13", "14", "", ""], "r": "D", "e": "【解析】无“王”的情况下，总共有13种点数的牌，最不利的情况是连摸13张不同点数的牌，第14张必定有点数相同的。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46602", "t": 1, "q": "将104张桌子分步放到14个办公室，每个办公室至少放一张桌子，不管怎么分至少有（     ）个办公室的桌子数一样多。", "a": ["2", "3", "7", "无法确定", "", ""], "r": "A", "e": "【解析】题目要求办公室桌子一样多。最不利的情形：办公室的桌子数尽量不同，分别有1、2、3、4……11、12、13、14共有，（1+14）×14/2=105，而实际我们只有104张，少了一张，因此，至少有两个办公室桌子数一样多，比如，最后两个办公室都是13张。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46603", "t": 1, "q": "某区要从10位候选人中投票选举人大代表，现规定每位选举人必须从这10位中任选两位投票。问至少要（     ）位选举人参加投票，才能保证有不少于10位选举人投了相同两位候选人的票。", "a": ["<p>382位<\/p>", "<p>406位<\/p>", "<p>451位<\/p>", "<p>516位<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/TQvDbUQCVtWvzumyRf0RCc93Bpuo9rWQE0mHK3Kv.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46604", "t": 1, "q": "要将63块巧克力分别放入若干个礼品袋内（每个礼品袋内均要装且至多装5块），则巧克力数量相同的礼品袋至少有（     ）。", "a": ["<p>12个<\/p>", "<p>10个<\/p>", "<p>8个<\/p>", "<p>5个<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/DQlJzG3jqEAoOsDRgquv3VcBEDCsMFvhMMbsLyWj.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46605", "t": 1, "q": "有一水池，如果打开甲水龙头注水，需要5个小时装满水，如果打开乙水龙头注水，需要8个小时装满水，如果打开丙水龙头放水，需要6小时放空水池。现打开甲水龙头一小时，然后打开乙水龙头，过一小时后再打开丙水龙头，问再过（     ）小时可以注满水池。", "a": ["3", "4", "5", "6", "", ""], "r": "A", "e": "【解析】赋值水池装满水时的水量为 120，则甲水龙头的注水效率为120÷5=24，乙水龙头的注水效率为120÷8=15，丙水龙头的放水效率为120÷6=20。前 2 小时，甲水龙头开了 2 小时，乙水龙头开了 1 小时，注水量为24×2+15=63，则距离注满水池还需要的水量=120-63=57。打开丙水龙头之后，注水效率=24+15-20=19，则再过57÷19=3 小时可以注满水池。故正确答案为 A。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46606", "t": 1, "q": "某项任务如果由甲单独完成，需要9天。如果由乙单独完成，需要6天。现在甲和乙一起来做，期间甲因事请假几天，结果4天完成了任务。这期间甲请假的天数是（     ）。", "a": ["4天", "3天", "2天", "1天", "", ""], "r": "D", "e": "【解析】因为甲9天做完，乙6天做完，可以设总工程量为9和6的最小公倍数18，则甲每天的工作效率为18÷9=2，乙每天的工作效率为18÷6=3。设甲中途请假X天，则甲工作了（4-X）天，乙工作了4天，一同完成了工作。依此列式可得：2×（4-X）+3×4=18，解得X=1。故正确答案为D。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46607", "t": 1, "q": "甲、乙两人接到编织一张羊毛毯的订单，若甲单独编织需要35天，乙单独编织需要25天。现由甲编织第一天，从第二天起每天均由上一天未编织的人编织。问当地毯编织完成一半时，乙编织了（     ）天？", "a": ["7天", "8天", "14天", "15天", "", ""], "r": "A", "e": "【解析】赋工程总量为350，则甲的效率为350÷35=10，乙的效率为350÷25=14。由于甲、乙轮流编织，每人一天，则可将每两天作为一个周期，一个周期的效率为10+14=24。一半的工程量为350÷2=175，由于175÷24=7......7，即甲、乙两人轮流编织7个周期后，还剩余7个工程量，甲再做1天即可完成。故乙只在前7个周期中参与编织，即编织的天数为7。故正确答案为A。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46608", "t": 1, "q": "一件工作，甲做9天可以完成，乙做6天可以完成，现在甲做了3天，余下的工作由乙来继续完成，乙需要做（     ）天可以完成全部工作。", "a": ["5", "4", "3", "3.5", "", ""], "r": "B", "e": "【解析】设工程总量为18，那么甲的工作效率为2，乙的工作效率为3，甲工作了3天，完成了6，还剩下12，交给乙来做，需要12/3=4天。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46609", "t": 1, "q": "一件工程，甲单独做10天完成，乙单独做30天完成，现在两队合作，期间甲队休息了2天，乙队休息了8天（两队不在同一天休息），问开始到完工共用了（     ）天时间。", "a": ["11", "15", "20", "1", "", ""], "r": "A", "e": "【解析】设工程总量为30，甲的效率为3，乙的效率为1，甲休息的2天乙工作了2，乙休息的8天甲工作了24，30-2-24=4，还要共同做1天，故要10+1=11天。选A。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46610", "t": 1, "q": "一件工程，甲、乙两人合作36天完成，乙、丙两人合作45天完成，甲、丙两人合作要60天完成，问甲一人独做需要（     ）天完成。", "a": ["80", "90", "100", "120", "", ""], "r": "B", "e": "【解析】设工程总量为180，有甲+乙=5，乙+丙=4，甲+丙=3，解得，甲=2，甲一人独做需要90天。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46611", "t": 1, "q": "一项工程，甲一人做完需30天，甲、乙合作完成需18天，乙、丙合作完成需15天，甲、乙、丙三人共同完成该工程需（     ）。", "a": ["10天", "12天", "8天", "9天", "", ""], "r": "A", "e": "【解析】设工程总数为180，根据题意效率分别为：甲=6，甲+乙=10，乙+丙=12，可推出甲+乙+丙=18，甲乙丙三人共同完成该工程需要180/18=10。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46612", "t": 1, "q": "单独完成某项工作，甲需要16个小时，乙需要12个小时，如果按照甲，乙，甲，乙的顺序轮流工作，每次1小时，那么完成这项工作需要（     ）。", "a": ["<p>13小时40分钟<\/p>", "<p>13小时45分钟<\/p>", "<p>13小时50分钟<\/p>", "<p>14小时<\/p>", "", ""], "r": "B", "e": "【解析】设工程总量为48，甲=3，乙=4，甲乙合作一个周期为7，48/7=6……6。6个周期为12个小时。还剩下6个单位，甲做一小时后还剩3个单位，交给乙来做需要3/4小时为15分钟，所以一共需要13小时45分钟。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46613", "t": 1, "q": "某工程甲单独做要20天完成，乙单独做要12天完成，如果这件工作先由甲队做若干天，再由乙队做完，两个队共用了14天，甲做了（     ）天。", "a": ["5", "2", "4", "6", "", ""], "r": "A", "e": "【解析】设工程总量为60，甲=3，乙=5，设甲做了X天，有3X+5（14-X）=60，解得X=5。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46614", "t": 1, "q": "一件工程，甲单独完成需2天，乙单独完成需要4天，如果甲干完一天后，剩下的工程由乙单独完成，那么干完此项工程共需（     ）天。", "a": ["3天", "4天", "5天", "6天", "", ""], "r": "A", "e": "【解析】设工作总量为4，甲=2，乙=1，甲做完一天后，剩下2，乙单独完成需要2天，做完此项工程共需3天。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46615", "t": 1, "q": "完成某项工程，甲单独工作需要18小时，乙需要24小时，丙需要30小时。现按甲、乙、丙的顺序轮班工作，每人工作一小时换班。当工程完工时，乙总共干了（     ）。", "a": ["8小时", "7小时", "7小时44分钟", "6小时48分钟", "", ""], "r": "C", "e": "【解析】设工作总量为360，甲=20，乙=15，丙=12，甲乙丙合作一个周期为47，360/47=7……31。剩下31个单位甲再做一个小时后剩下11，乙还需要做11/15小时=44分钟，乙一共做了7小时44分钟。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46616", "t": 1, "q": "打开A.B.C每一个阀门，水就以各自不变的速度注入水槽。当三个阀门都打开时，注满水槽需要1小时；只打开A.、C两个阀门，需要1.5小时；只打开B.C两个阀门，需要2小时。若只打开A.B两个阀门时，需要（     ）小时注满水槽。", "a": ["1.1小时", "1.15小时", "1.2小时", "1.25小时", "", ""], "r": "C", "e": "【解析】设工程总量为6个单位，A+B+C=6，A+C=4，B+C=3，可解得A=3，B=2，C=1。A+B=5，需要6/5=1.2个小时。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46617", "t": 1, "q": "已知甲、乙两村相距60km。甲村到乙村不是上坡就是下坡，从甲村到乙村得用时3.5小时，从乙村到甲村用时4.5小时，已知上坡的速度为12，求下坡的速度为（     ）。", "a": ["<p>10<\/p>", "<p>12<\/p>", "<p>14<\/p>", "<p>20<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/IybQs5FZpZ1IJvLym3QeY8Vycdw22t6BQ8FJKdMR.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46618", "t": 1, "q": "一个产品生产线分为A.B.c三段，每个人每小时分别完成10、5、6件，现在总人数为71人，要使得完成的件数最大，71人的安排分别是（     ）。", "a": ["<p>14：28：29<\/p>", "<p>15：31：25<\/p>", "<p>16：32：23<\/p>", "<p>17：33：21<\/p>", "", ""], "r": "B", "e": "<p>【解析】<\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46619", "t": 1, "q": "一列火车穿过一条隧道，已知火车长220米，隧道长680米，火车行驶的平均速度为20米/秒，则火车通过隧道需要（     ）秒。", "a": ["<p>11<\/p>", "<p>34<\/p>", "<p>45<\/p>", "<p>52<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/7A3YPcjceuj8cO1vGRvxLA9MnCZRF3f6tXTyDbOn.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46620", "t": 1, "q": "一列火车需经过一隧道，已知该隧道长150米，车身长160米，车头在隧道外行驶时速度为144千米/小时，车头一旦进入隧道口，速度即变为108千米/小时（忽略变速时间），则该列车从进入隧道到完全通过隧道的时间是（     ）秒。", "a": ["<p>21/4<\/p>", "<p>31/3<\/p>", "<p>9<\/p>", "<p>5<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/9UmVtN1olCNTinCStIw8ENOAvR7OqlZOcnSQMM7m.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46621", "t": 1, "q": "一列长360米的火车，速度为20米/秒，经过2700米的大桥，火车完全通过这座大桥需要（     ）。", "a": ["2分02秒", "2分20秒", "2分30秒", "2分33秒", "", ""], "r": "D", "e": "【解析】火车完全过桥需要经过的路程=桥长+车长=360+2700=3060米，已知车速为20米/秒，则所需时间=3060÷20=153秒=2分33秒。故正确答案为D。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46622", "t": 1, "q": "猎人带着狗去12公里外的地方去打猎，回家时狗跑得比较快，到家后看主人没到又回头去找，碰到主人后又往家跑，就这样不断地往返跑，直到主人到家。如果猎人的步行速度为每小时3.5公里，狗奔跑的速度为每小时21公里，那么在主人到家时狗共跑了（     ）公里。", "a": ["36", "54", "72", "96", "", ""], "r": "C", "e": "【解析】由题意可知，狗和人的时间是一样，时间为12/3.5小时，而狗的速度为21，所以狗跑的路程为21*12/3.5=72", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46623", "t": 1, "q": "甲乙两车从A.B两地相向而行，在距B地54千米相遇，他们各自到达对方车站后立即返回，在距A地42千米处相遇，请问A.B两地相距（     ）千米。", "a": ["120", "100", "90", "80", "", ""], "r": "A", "e": "【解析】第一次相遇的时候，甲走了s-54，从第一次到第二次相遇，甲走了54+s-42，由多次相遇知道2（s-54）=54+s-42，可算出s=120km。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46624", "t": 1, "q": "A.B二人开车同时从甲地到乙地，A到达乙地后立即返回，在距乙地64千米处与B相遇，已知A每小时行40千米，B每小时行24千米，求甲乙两地相距（     ）千米。", "a": ["192", "256", "320", "512", "", ""], "r": "B", "e": "【解析】相遇时A比B多走了64×2=128千米，相遇时间=128/（40-24）=8小时，甲乙两地距离=40×8-64=256千米，选B。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46625", "t": 1, "q": "有一条船从上流的A点顺流而下到达B点，再马上从B点逆流而上回到A点，所花的时间为t，设船在静水的航行的速度一定，问，当水流速度v增大时，时间t的变化为（     ）。", "a": ["变大", "变小", "不变", "无法确定", "", ""], "r": "A", "e": "【解析】设水流速度增大到无穷大，那么船只无论如何也不可能回到A点，那么所需要花的时间的也是无穷大，而之前是有一个定值t，说明时间变大了。故答案为A。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46626", "t": 1, "q": "某市地铁2号线开通25个站点，每两个站点间的车程为5分钟。若运行期间，每个站点前后两列列车到达的时间相隔10分钟，双向往返行驶。则该地铁线至少要配置（     ）列列车。", "a": ["12", "16", "24", "26", "", ""], "r": "C", "e": "【解析】已知2号线共有25个站点，故单向全程所需时间t=25−1×5=120分钟；两列列车到达的时间相隔10分钟，则120÷10=12列，即单向全程需配置12列列车。2号线为双向往返行驶，则需要列车数量：12×2=24列列车。故正确答案为C。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46627", "t": 1, "q": "一列高铁火车长380米，另有一列普通火车长580米，两车速度为5：3，己知两车同向行驶交叉时间为1分钟，当它们相向而行时，两车交叉的时间是（     ）秒。", "a": ["<p>14<\/p>", "<p>15<\/p>", "<p>16<\/p>", "<p>17<\/p>", "", ""], "r": "B", "e": "<p>【解析】设高铁速度为5a米/秒，普通火车速度为3a米/秒。同向行驶是追及问题，且有（5a-3a）×60=580+380，得5a=40术/秒，3a=24米/秒。相向而行是相遇问题，则两车交叉用时为（580+380）÷（40+24）=15秒。选B。<\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46628", "t": 1, "q": "一个车队以4米/秒的速度缓缓通过一座长200米的大桥，共用115秒。已知每辆车长5米，两车间隔10米。那么这个车队共有（     ）辆车。", "a": ["15", "16", "17", "18", "", ""], "r": "D", "e": "【解析】设车队共有x辆车。由题意，车队完全过桥经过的路程=总车长+总间隔距离+桥长，根据S=V×T，可列等式：5x+10x−1+200=115×4，解得x=18。故正确答案为D。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46629", "t": 1, "q": "甲乙二人比赛爬楼梯，甲跑到4层时，乙正好跑到3层，照这样计算，甲跑到16层时，乙跑到（     ）层。", "a": ["<p>9<\/p>", "<p>11<\/p>", "<p>13<\/p>", "<p>15<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/7uYwj0FXhLAIE5RBTCgYCXXRuX0xTY5wPwG6YUoC.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46630", "t": 1, "q": "一列火车途经两个隧道和一座桥梁，第一个隧道长600米，火车通过用时18秒；第二个隧道长480米，火车通过用时15秒；桥梁长800米，火车通过时速度为原来的一半，则火车通过桥梁所需的时间为（     ）。", "a": ["20秒", "25秒", "40秒", "46秒", "", ""], "r": "D", "e": "【解析】火车过桥问题公式为（车长+桥长）=速度×时间。假设火车车长为x m，原来的速度为v m/s。\n方法一：根据题意可列方程组600+x=18v，480+x=15v，解得x=120，v=40。火车过桥时速度为原来的一半，即为20m/s，则火车通过桥梁所需的时间为800+120÷20=46秒。\n方法二：利用盈亏思想，v=600−480÷18−15=40m/s，那么车长=40×18-600=120m，通过桥梁的时间为800+120÷20=46秒。故正确答案为D。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46631", "t": 1, "q": "一辆小火车长50m，以40km/h的速度匀速穿过A隧道。用时9秒，则A隧道的长度为（     ）m。", "a": ["40", "320", "310", "50", "", ""], "r": "D", "e": "【解析】设A隧道的长度为x，火车过隧道走过的路程为：隧道长+车身长=x+50，火车速度为40km/h=100/9 m/s，根据速度×时间=路程，则，100/9 ×9=x+50，x=50m。故正确答案为D。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46632", "t": 1, "q": "某商店花10000元进了一批商品，按期望获得相当于进价25%的利润来定价，结果只销售了商品总量的30%，为尽快完成资金周转，商店决定打折销售，这样卖完全部商品后，亏本1000元，问商店是按定价打（     ）折销售的。", "a": ["<p>九折<\/p>", "<p>七五折<\/p>", "<p>六折<\/p>", "<p>四八折<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/HKcP7Z8GfnYSDRxbV5TecFiaelCM3Yh2nOgzLIgb.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46633", "t": 1, "q": "某超市购进西瓜1000个，运输途中碰裂一些，未碰裂的西瓜卖完后，利润率为40%，碰裂的西瓜只能降价出售，亏本60%，最后结时总利润率为32%，碰裂了（     ）西瓜。", "a": ["<p>80<\/p>", "<p>100<\/p>", "<p>120<\/p>", "<p>140<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/w5ESAMAXT4wiGRq3QLI6hACzjph3WQZs2RUk6E53.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46634", "t": 1, "q": "一台空调，定价为7871元，在国庆期间打8折出售，国庆过后要想恢复原价要加价百分之（     ）。", "a": ["<p>20%<\/p>", "<p>25%<\/p>", "<p>22%<\/p>", "<p>30%<\/p>", "", ""], "r": "B", "e": "【解析】本题直接计算数字有点麻烦，通过仔细观察，我们发现本题只涉及比例问题，和具体的数字无关，应此我们可以采取特殊值法，就可以马上得出答案。把定价看成100 ，折后价：100×80%=80，减少价：100-80=20  20/80×100%=25%。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46635", "t": 1, "q": "某商店将某种打印机按进价提高35%后，打出“九折优惠酬宾，外送50元出租车费”的广告，结果每台仍旧获利208元，那么每台打印机的进价是（     ）元。", "a": ["1050", "1200", "1345", "1500", "", ""], "r": "B", "e": "【解析】方程法：设进价为X，X（1＋35%）×0.9－50－X＝208。X＝1200。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46636", "t": 1, "q": "2010年某种货物的进口价是15元/公斤，2011年该货物的进口量增加了一半，进口金额增加了20%，问2011年该货物的进口价格是（     ）元/公斤。", "a": ["10", "12", "18", "24", "", ""], "r": "B", "e": "【解析】进口量增加了一半，就是原来的3/2倍。进口金额增加了1/5，就是原来的6/5倍。那么现在的单价是原来的6/5÷3/2=4/5倍，原来单价是15元/公斤，所以现在是12元/公斤，答案选B。（本解析其实就是特值法，其基本原理是设原进口量与进口金额分别为1）。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46637", "t": 1, "q": "一商品的进价比上月低了5%，但超市仍按上月售价销售，其利润率提高了6个百分点，则超市上月销售该商品的利润率为（     ）。", "a": ["<p>12%<\/p>", "<p>13%<\/p>", "<p>14%<\/p>", "<p>15%<\/p>", "", ""], "r": "C", "e": "【解析】特值法：设上月商品进价100，则这个月进价就是95，设原来的利润率为x%，那么现在的利润率为x+0.06，根据前后销售价格不变可以得到100×（1+x%）=95×（1+x%+6%）解得x=14%。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46638", "t": 1, "q": "<p>某原料供应商对其顾客实行如下优惠措施：<\/p>\n<p>①一次购买金额不超过1万元，不予优惠；<\/p>\n<p>②一次购买金额超过1万元，但不超过3万元，给九折优惠；<\/p>\n<p>③一次购买金额超过3万元，其中3万元九折优惠，超过3万元的部分八折优惠。<\/p>\n<p>某厂因库容原因，第一次在该供应商处购买原料付款8800元，第二次购买原料付款25200元。如果该厂一次购买同样数量的原料，可以少付（ ）。<\/p>", "a": ["<p>1560元<\/p>", "<p>1920元<\/p>", "<p>3800元<\/p>", "<p>4360元<\/p>", "", ""], "r": "A", "e": "<p>【解析】第一次实付8800，未到优惠门槛，原价8800；第二次实付25200，属于九折区间，原价25200/0.9=28000；原料总价：8800+28000=36800；一次性购买费用：30000×0.9+6800×0.8=32440；分开购买合计付款34000；可少付：34000-32440=1560元。<\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46639", "t": 1, "q": "某家具店购进100套桌椅，每套进价200元，按期望获利50%定价出售，卖掉60套桌椅后，店主为了提前收回资金，打折出售余下的桌椅，售完全部桌椅后，实际利润比期望利润低了18%，余下的桌椅是打（     ）出售的。", "a": ["<p>七五折<\/p>", "<p>八二折<\/p>", "<p>八五折<\/p>", "<p>九五折<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/piXiOjs9F1m9GBlqrFR8V18udooVzqoEXVXXKnc1.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46640", "t": 1, "q": "某商品按定价的80％（八折）出售，仍能获得20％的利润，问定价时期望的利润率是（     ）。", "a": ["<p>50％<\/p>", "<p>40％<\/p>", "<p>30％<\/p>", "<p>20％<\/p>", "", ""], "r": "A", "e": "【解析】设成本为1，则打八折后的价格为1×（1＋20％）＝1.2，原来的定价为1.2÷80％＝1.5，故定价时期望的利润率为（1.5－1）÷1＝50％。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46641", "t": 1, "q": "某水果店到苹果产地去收购苹果，收购价为0.84元/千克，从产地到水果店距离200千米，每吨每运1千米运费为1.20元。如果在运输及销售过程中的损耗是10%，商店想要实现的利润25%，零售价应是（     ）。", "a": ["1.50元/千克", "1.45元/千克", "1.40元/千克", "1.35元/千克", "", ""], "r": "A", "e": "【解析】0.84元/千克=840元/吨，由题意得：水果运输费用为240元/吨。水果的成本价为：（840+240）/（1-10%）=1200元/吨，故水果的定价1200（1+25%）=1500元/吨=1.50元/千克。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46642", "t": 1, "q": "某班有35个学生，每个学生至少参加英语小组、语文小组、数学小组中的一个课外活动。现已知参加英语小组的有17人，参加语文小组的有30人，参加数学小组的有13人。如果有5个学生三个小组全参加了，问有（     ）个学生只参加了一个小组。", "a": ["15人", "16人", "17人", "18人", "", ""], "r": "A", "e": "【解析】只参加一个小组的+只参加两个小组的+参加三个小组的=总人数。先求出只参加两个小组的，17+30+13-只参加两个小组的-2*参加三个小组的=35，代入可知只参加两个小组的为15人，从而得到参加一个小组的为15人。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46643", "t": 1, "q": "参加某次事业单位考试中76人，行测及格的有53，申论及格的有57人，公共基础及格的有48人，则三门都及格的至少有（     ）人。", "a": ["6人", "19人", "9人", "28人", "", ""], "r": "A", "e": "【解析】三集合极值问题，三门都及格=76+53+57-2×76=158-152=6", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46644", "t": 1, "q": "某市对52种建筑防水卷材产品进行质量抽检，其中有8种产品的低温柔度不合格，10种产品的可溶物含量不达标，9种产品的接缝剪切性能不合格，同时两项不合格的有7种，有1种产品这三项都不合格，则三项全部合格的建筑防水卷材产品有（     ）种。", "a": ["37", "36", "35", "34", "", ""], "r": "D", "e": "【解析】本题属于典型的三集合整体重复，直接套用公式：W=x+7+1 8+10+9=x×1+7×2+1×3，可以解出W=18，所以至少有一项不合格的有18种，则三项全部合格的建筑防水卷材产品有52-18=34。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46645", "t": 1, "q": "某班共有学生40名，其中喜欢打乒乓球、篮球和排球的学生分别有 35 人、33 人和 32 人。问这三项运动都喜欢的学生至少有（     ）人。", "a": ["20 人", "24 人", "28 人", "32 人", "", ""], "r": "A", "e": "【解析】第一步：分析问题\n题干中出现了“都……至少……”，故为最值问题中多集合反向构造类的题型。考虑：反向、加和、做差。\n第二步：计算过程\n要使三项运动都喜欢的学生至少，则应使不喜欢各项运动的学生人数最多，即不喜欢各项运动的学生没有交叉。（1）反向，共40名学生，喜欢打乒乓球的有35人，则不喜欢打乒乓球的有40-35=5人；喜欢打篮球的有33个，则不喜欢打篮球的有40-33=7人；喜欢打排球的有32人，则不喜欢打排球的有40-32=8人；（2）加和，不喜欢各项运动的学生人数最多为5+7+8=20；（3）做差，因此，三项运动都喜欢的学生人数至少有40-20=20人。\n第三步：再次标注答案  故正确答案为A。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46646", "t": 1, "q": "有100名同学回答A.B两个问题。都没有回答对的有10人，答对A的有75人，答对B的有83人，两题都答对的有（     ）人。", "a": ["37", "68", "79", "82", "", ""], "r": "B", "e": "【解析】利用两个对象的容斥原理： 75+83-（100-10）=68（ 人）", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46647", "t": 1, "q": "三位基金经理投资若干支股票。张经理买过其中66支，王经理买过其中40支，李经理买过23支。张经理和王经理都买过的有17支，张经理和李经理都买过的有9支，王经理和李经理都买过的有13支，三个人都买过的有6支。请问：那么这三位经理一共买过（     ）支股票。", "a": ["<p>100<\/p>", "<p>90<\/p>", "<p>96<\/p>", "<p>92<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/9mtfgRtB9hRVb2gMWdeKHjpkbsqpYzie3opCPEX6.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46648", "t": 1, "q": "某外国语学院有90%的学生精通英语，85%的学生精通韩语，70%的学生精通日语，则该校精通英语、韩语、日语三门语言的学生至少占该学院的（     ）。", "a": ["<p>55％<\/p>", "<p>45％<\/p>", "<p>15％<\/p>", "<p>10％<\/p>", "", ""], "r": "B", "e": "【解析】由于“有90%的学生精通英语，85%的学生精通韩语，70%的学生精通日语”，可知不精通英语的学生占10%，不精通韩语的学生占15%，不精通日语的学生占30%。综上可知，不精通英语、韩语、日语的学生最多占全体学生的10%+15%+30%=55%。则精通英语、韩语、日语的学生最少占全体学生的1-55%=45%。故正确答案为B。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46649", "t": 1, "q": "公司某部门80%的员工有本科以上学历，70%有销售经验，60%在生产一线工作过。该部门既有本科以上学历，又有销售经历，还在生产一线工作过的员工至少占员工的（     ）。", "a": ["<p>20％<\/p>", "<p>15％<\/p>", "<p>10％<\/p>", "<p>5％<\/p>", "", ""], "r": "C", "e": "【解析】如果总人数为100，那么有20人不是本科，30人没有销售经验，有40人没有一线工作经验，要想三者同时存在的最少，则需三者不同时存在是最多，最多为20+30+40=90人，所以至少三者都存在的比例为10%。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46650", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/7OJ47ZqN2AL366LczDW8J5b0OkFM30YaqxipAJVe.png\"><\/p>", "a": ["<p>15<\/p>", "<p>16<\/p>", "<p>14<\/p>", "<p>18<\/p>", "", ""], "r": "B", "e": "【解析】设阴影部分的面积为K，根据图形的重叠情况，减去重叠部分的面积，可知：X＋Y＋Z－24－70－36＋K＝290，将数字代入得64＋180＋160－24－70－36＋K＝290解得K＝16。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46651", "t": 1, "q": "某中学有68%的同学参加体育兴趣小组、有75%的同学参加语文兴趣小组，74%的同学参加数学兴趣小组，则该校学生中同时参加这三个兴趣小组的同学所占百分比至少是（     ）。", "a": ["<p>19％<\/p>", "<p>17％<\/p>", "<p>21％<\/p>", "<p>15<\/p>", "", ""], "r": "B", "e": "【解析】要使同时参加三个兴趣小组的同学占比最少，应使未参加兴趣小组的人数尽可能多。根据题意，未参加体育兴趣小组的为1-68%=32%，未参加语言兴趣小组的为1-75%=25%，未参加数学兴趣小组的为1-74%=26%。当未参加任意一种兴趣小组的人均不重复时，未参加兴趣小组的人最多，此时未参加这三个兴趣小组的同学为32%+25%+26%=83%，则参加这三个兴趣小组的同学所占百分比至少为1-83%=17%。故正确答案为B。", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}, {"id": "46652", "t": 1, "q": "王明家与李兰家相距3.42千米，李兰家与张红家相距10.8千米，张红家与周珊家相距5.85千米，周珊家与王明家相距1.53千米。问王明家与张红家相距（     ） 千米。", "a": ["<p>4.95<\/p>", "<p>7.38<\/p>", "<p>9.27<\/p>", "<p>10.8<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260718/9nIdvqlbxO3XSxWMZGtPPVLnbf38FRVHklLa0UCg.png\"><\/p>", "l3": "一般能力", "l4": "3.2节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.资料分析", "n": "一般能力 / 1.资料分析", "qs": [{"id": "46653", "t": 1, "q": "从上述资料不能推出的是（     ）。", "a": ["2015全国人口比上年增加711万人
