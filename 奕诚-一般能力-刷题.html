望”，而不能表述为“理想绝望”或“理想失望”，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46241", "t": 1, "q": "<p>教育与互联网的结合催生了大规模网络公开课程这一在线教育形式，使得获取教育资源更加<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，每门课程可以同时<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>的学生数量几乎没有限制，实现了优质教育资源的低成本、广覆盖。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>便利 接纳<\/p>", "<p>丰富 选择<\/p>", "<p>快捷 汇集<\/p>", "<p>多元 囊括<\/p>", "", ""], "r": "A", "e": "【解析】第一空，搭配“获取”，说明教育资源获取的情况。文段阐述了教育与互联网结合为教育带来的好处，根据后文的“实现了优质教育资源的低成本、广覆盖” 可知，教育资源获取成本降低，即容易获得。A 项“便利”、C 项“快捷”均可体现容易获得的意思，保留。B 项“丰富”、D 项“多元”均强调“多”，与文意不符，排除。\n第二空，根据后文“实现了优质教育资源的低成本、广覆盖”可知，“广覆盖” 即课程覆盖范围较大，故横线处所填词语应表示每门课程能够让很大范围内的人参与之意 。A 项“接纳”指接受个人或团体参加组织、参加活动等，可以体现每门课程惠及的学生人数多，当选。C 项“汇集”指连在一起、聚集，文段中说的是覆盖范围广，而非集中，与文意不符，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46242", "t": 1, "q": "<p>故事片的叙事及视觉语言，一个重要而基本的原则，便是隐藏起摄影机的存在。换言之，故事片叙事的最重要而基本的特征，便是<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>叙事行为的痕迹。于是，似乎是场景、事件自身在<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>呈现。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>突出 自动<\/p>", "<p>抹去 自行<\/p>", "<p>强调 客观<\/p>", "<p>忽视 主动<\/p>", "", ""], "r": "B", "e": "【解析】第一空，搭配“痕迹”，且根据“换言之”可知，文段第一句与第二句语义相近，故横线处所填词语也应该体现“隐藏”之意，表示让叙事行为的痕迹不存在之意。B 项“抹去”指擦掉、消除，符合文意，保留。A 项“突出”、C 项“强调” 指让事物更明显，二者均与“隐藏”语义相悖，排除。D 项“忽视”指不重视、不注意，体现不出让叙事行为的痕迹不存在之意，与文意不符，排除。\n第二空，代入验证。根据前文“隐藏起摄影机的存在”“抹去叙事行为的痕迹”\n可知，横线所在句子表达场景、事件自然而然地呈现之意。B 项“自行”指自己做、\n自动，符合文意，当选。\n故正确答案为B。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46243", "t": 1, "q": "<p>本地杂草野花由于经历了千百年的自然<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，对当地气候和土质都有极好的适应性，根本不需要过多额外的养护。而且，与属于外来物种的人工草坪相比，本地杂草野花还有一个<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>就是生态安全。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>洗礼 优点<\/p>", "<p>进化 长处<\/p>", "<p>选择 优势<\/p>", "<p>淘汰 好处<\/p>", "", ""], "r": "C", "e": "【解析】第一空，根据文意可知，横线处所填词语表示杂草野花经历了千百年优胜劣汰的过程。B 项“进化”、C 项“选择”、D 项“淘汰”填入横线处均符合文意，保留。A 项“洗礼”指重大斗争的锻炼和考验，无法体现杂草野花优胜劣汰的过程，且与“自然”搭配不当，排除。\n第二空，根据文段中的“与……人工草坪相比”可知，文段存在“比较”的语境 。C 项“优势”指比对方有利的形势或方面，常用在“比较”的语境中，语义恰当， 当选。B 项“长处”与D 项“好处”均仅仅从单方面强调“好”或“优”，不如C 项“优势”与文段语境的契合度更高，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46244", "t": 1, "q": "<p>医生和患者在沟通时最容易出现的<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>其实是，患者不同意或没听懂医生的建议，又因为不想被说教或觉得尴尬而没有如实反馈意见而医生也大多没有意识到这一点。这显然会大大影响临床诊疗的<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>。此外，患者还会由于不想被说教而不承认一些不良生活行为。越是健康状况差的患者，越是容易<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>一些信息，而他们恰恰是最需要高质量医疗服务的人。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>难点 结果 遗漏<\/p>", "<p>盲区 效率 隐瞒<\/p>", "<p>障碍 判断 虚构<\/p>", "<p>瓶颈 目的 回避<\/p>", "", ""], "r": "B", "e": "【解析】本题可从第二空入手。根据横线前“这”指代前文医生没有意识到患者没有如实反馈意见这件事可知，横线处所填词语应表达“这”对“临床诊疗”造成了影响 。A 项“结果”、B 项“效率”、C 项“判断”均符合文意，保留。D 项“目的”指想要得到的结果，无论是否受影响，“临床诊疗”的“目的”都应是一致的，与文意不符，排除。\n第三空，根据“患者……不承认一些不良生活行为”可知，“越是健康状况差的患者”越不想承认，故横线处所填词语应体现“不承认”之意。B 项“隐瞒”指掩盖真相不让人知道，符合文意，保留。A 项“遗漏”指应该列入或提到的因疏忽而没有列入或提到，文段强调的是患者自己不想承认而不是因为疏忽，与文意不符，排除。 C 项“虚构”指凭空捏造，文段只是说患者不承认已有的不良生活行为，未体现凭空捏造之意，与文意不符，排除。\n第一空，代入验证。B 项“盲区”能够和后文“医生也大多没有意识到这一点”形成呼应，符合文意，当选。\n故正确答案为B。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46245", "t": 1, "q": "<p>业内专家建议建立国家营养日或营养周，开展“食育进农村” 等活动，加大公益广告投入，发布适宜不同人群的膳食指南。针对农村留守儿童多的 现状，在家庭监管<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>的情况下，政府可通过购买服务，让相关社会组织走进农村，帮助农村孩子健康成长。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>缺失<\/p>", "<p>薄弱<\/p>", "<p>不力<\/p>", "<p>缺乏<\/p>", "", ""], "r": "A", "e": "【解析】根据文段可知，横线处所填词语修饰农村留守儿童“家庭监管”的情况，应体现留守儿童缺少家庭监管的意思。A 项“缺失”指缺少、失去，可做名词或动词，与“家庭监管”搭配恰当，符合文意，当选。\nB 项：“薄弱”指容易破坏或动摇，不雄厚、不坚强，为形容词，一般搭配“兵力”“意志”“基础”等，与“家庭监管”搭配不当，排除。\nC 项：“不力”指不尽力、不得力，文段并非表达留守儿童的家庭监管不得力的意思，不符合文意，排除。\nD 项：“缺乏”指(所需要的、想要的或一般应有的事物)没有或不够，为动词，\n应放在“家庭监管”之前， 一般表述为“缺乏家庭监管”，置于此处用法错误，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46246", "t": 1, "q": "<p>观察就要用专业的角度去关注、<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>周围的事物，有意识 地汲取、思索、分析，看在眼里，记在心里。丰富的想象正是来源于知识的广博和平时对生活深入细致的观察。因此，想象并不是凭空<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>的。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>体验 杜撰<\/p>", "<p>体味 虚构<\/p>", "<p>体察 臆造<\/p>", "<p>体察 虚构<\/p>", "", ""], "r": "C", "e": "【解析】第一空，根据横线前“、”可知，横线处所填词语与“关注”构成并列，且对应后文的“看在眼里”，故横线处所填词语应表达“看”的含义。C.D 两项“体察”指体验和观察，符合文意，保留。A 项“体验”指通过实践来认识周围的事物，B项“体味”指仔细体会，两项均不符合文意，排除。\n第二空，根据“丰富的想象正是来源于……观察”可知，横线处所填词语应强调 想象不是凭空想出来的。C 项“臆造”指凭主观的想法编造，符合文意，且“凭空臆 造”为常见搭配，当选。D 项“虚构”指凭想象造出来，含有“凭空构作”“凭空编造”的意思，与“凭空”语义重复，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46247", "t": 1, "q": "<p>“先天下之忧而忧，后天下之乐而乐”，激励着一代又一代仁人志士为国家富强而<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>、为民族振兴而<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>前赴后继 殚精竭力<\/p>", "<p>运筹决胜 呕心沥血<\/p>", "<p>奋不顾身 煞费苦心<\/p>", "<p>勇往直前 绞尽脑汁<\/p>", "", ""], "r": "A", "e": "【解析】第一空，“先天下之忧而忧，后天下之乐而乐”出自《岳阳楼记》，体现了一种爱国情怀，即把国家、民族的利益摆在首位，为祖国的前途、命运担忧，为天底下人民的幸福而奋斗。这句话激励着一代又一代仁人志士为国家富强而奋斗，故横线处所填词语需体现很多仁人志士为之奋斗努力的意思。A 项“前赴后继”指前面的人冲上去了，后面的人就迅速跟上去，形容奋勇前进，既能体现奋斗，又与“一代又一代”相对应得当，体现人多，符合文意，保留。B 项“运筹决胜”指在后方决定作 战策略，泛指筹划决策，文段中并未体现筹划决策之意，排除。C 项“奋不顾身”指 奋勇向前，不考虑个人安危，D 项“勇往直前”指奋勇前进、无所畏惧，二者与A项“前赴后继”相比，均无法对应“一代又一代”，体现不出人多，排除。\n第二空，代入验证。A 项“殚精竭力”指用尽精力，费尽心思，可体现为民族振兴而费心尽力，与“先天下之忧而忧，后天下之乐而乐”对应得当，当选。\n故正确答案为A。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46248", "t": 1, "q": "<p>舞台就是程式化和生活化的结合，过度的程式化表演会让观众觉得虚假，过度的生活化表演又会让观众觉得<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，因此要把握好程式化和生活化的<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，为观众呈现精彩有趣的戏曲艺术。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>庸俗 程度<\/p>", "<p>随便 平衡<\/p>", "<p>琐碎 差异<\/p>", "<p>枯燥 重心<\/p>", "", ""], "r": "B", "e": "【解析】第一空，根据“舞台就是程式化和生活化的结合，过度的程式化表演会让观众觉得虚假”可知，过度的“程式化”就没有“生活化”，即不真实、虚假，故横线所在句子应体现“过度的生活化”就没有“程式化”。B项“随便”可体现没有步骤，没有程序，符合文意，保留。A 项“庸俗”指平庸鄙俗，对立面是“高雅”，和“程式化”无关，排除。C 项“琐碎”指细小繁多，D 项“枯燥”指单调、没有趣味，二者均与缺乏“程式化”无关，排除。\n第二空，横线处所填词语体现“程式化和生活化”两者之间的关系，对应前文，过度的程式化和过度的生活化效果均不佳，故横线处所填词语应表示把握好程式化和生活化之间的“度”，不能过于程式化也不能过于生活化。B 项“平衡”符合文意，当选。\n故正确答案为B。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46249", "t": 1, "q": "<p>在过去的半个多世纪里，我们所生活的世界日益<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>到全球化的浪潮中。社会科学领域里的大多数学者认为，全球化开始于地理大发现的15世纪，其间<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>了几个世界霸权的兴衰，渐次发展到今日的<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>世界。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>融入 度过 多维<\/p>", "<p>卷入 历经 多极<\/p>", "<p>投入 见证 多边<\/p>", "<p>涌入 目睹 多元<\/p>", "", ""], "r": "B", "e": "【解析】第一空，搭配“浪潮”。A 项“融入”、B 项“卷入”、D 项“涌入”均符合文意，保留。C 项“投入”与“浪潮”搭配不当，排除。\n第二空，横线之前的主语是“全球化”。B 项“历经”符合文意，保留。A 项“度过”、D 项“目睹”搭配的主语均为人，二者均与“全球化”搭配不当，排除。\n第三空，代入验证。“多极世界”与前文“世界霸权”形成反义对应，且搭配恰当，符合文意， B 项当选。\n故正确答案为B", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46250", "t": 1, "q": "<p>向民众<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>科学知识，<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>科学精神，是科学家义不容辞的责任。但是科学家首先要致力于科研，他究竟能花多少时间来做科普，显然无法一概而论。通常，一线科学家很难花费太多的时间和精力直接参与一波又一波的科普活动。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>传输 传递<\/p>", "<p>传递 传播<\/p>", "<p>传导 传扬<\/p>", "<p>传达 传承<\/p>", "", ""], "r": "B", "e": "【解析】第一空，搭配“科学知识”，表示向民众传播科学知识之意。A项“传输” 指传递、输送，一般搭配“信息”“数据”等，与“知识”搭配恰当，保留。B 项“传递”指由一方交给另一方，填入横线处表示科学家把科学知识传播给民众，搭配恰当，且语义恰当，保留。C 项“传导”指热或电从物体的一部分传到另一部分，也指神经纤维把外界刺激传向大脑皮质，或把大脑皮质的活动传向外围神经，多用于物理学或神经学方面，与“知识”搭配不当，排除。D 项“传达”指把一方的意思告诉另一方，多与“命令”“消息”搭配，与“知识”搭配不当，排除。\n第二空，搭配“科学精神”。根据横线后的“做科普”“科普活动”可知，“科普” 即科学普及，特点是范围广、受众多，故横线处所填词语要体现范围广、受众多之意。  B 项“传播”指广泛散布，与“科学精神”搭配恰当，且与“科普活动”对应准确，当选。A 项“传递”无法体现科普活动受众多的特点，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46251", "t": 1, "q": "<p>人类命运共同体，顾名思义，就是每个民族、每个国家的前 途命运都紧紧联系在一起，应该<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>、荣辱与共，努力把我们生于斯、长于斯的这个星球建成一个和睦的大家庭，把世界各国人民对美好生活的向往变成现实。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>风流云散<\/p>", "<p>风雨同舟<\/p>", "<p>如影随形<\/p>", "<p>通同一气<\/p>", "", ""], "r": "B", "e": "【解析】横线后出现的顿号表示同义并列，故横线处所填成语应与“荣辱与共” 语义相近，表示构建人类命运共同体的做法，“荣辱与共”意思是光荣与耻辱共同分享与承担。B 项“风雨同舟”指在狂风暴雨中同乘一条船， 一起与风雨搏斗，比喻共同度过困难，与“荣辱与共”语义相近，当选。\nA 项：“风流云散”形容四散消失，与文意相悖，排除。\nC项：“如影随形”形容两个人常在一起，关系十分亲密，体现不出共同度过困难之意，且文段强调的是“共同体”“大家庭”“各国人民”，并非两个对象的关系，排除。\nD 项：“通同一气”意思是串通在一起，与文段感情色彩不符，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46252", "t": 1, "q": "<p>随着人工智能技术的不断发展，简单重复或危险的作 业将由机器执行，低端蓝领、白领阶层可能会被人工智能<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，未来人工智能对职场很可能产生颠覆性影响。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>取而代之<\/p>", "<p>越俎代庖<\/p>", "<p>鸠占鹊巢<\/p>", "<p>更弦易辙<\/p>", "", ""], "r": "A", "e": "【解析】横线前的“低端蓝领、白领阶层”属于从事简单重复或者危险的工作范畴，结合前文的“简单重复或危险的作业将由机器执行”可知，他们有可能被人工智能代替，横线处所填词语应该体现“代替”的意思。A 项“取而代之”指排除别人或别的事物而代替其位置，符合文意，当选。\nB 项：“越俎代庖”比喻超过自己的职权范围，去处理别人所管的事情，文段没有体现越权之意，排除。\nC 项：“鸠占鹊巢”比喻强占别人的房屋、土地、产业等，文段并无强行占据之意，排除。\nD项：“更弦易辙”比喻改变计划或做法，与“代替”无关，排除。\n故正确答案为A.", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.11节", "n": "一般能力 / 1.11节", "qs": [{"id": "46253", "t": 1, "q": "下列诗句按其所描写节日的先后顺序，排列正确的是（     ）。\n①桃符呵笔写，椒酒过花斜        ②九日黄花酒，登高会昔闻\n③粽包分两髻，艾束著危冠        ④马上逢寒食，途中属暮春", "a": ["④②③①", "①④③②", "②④③①", "③①②④", "", ""], "r": "B", "e": "【解析】①“桃符呵笔写，椒酒过花斜”出自南宋陆游的《已酉元旦》，诗句描写的是轻轻对着笔呵着热气来写对联，喝一口用椒浸制的酒发现新写的花已经倾斜了，写对联是春节的习俗。②“九日黄花酒，登高会昔闻”出自唐代岑参的《奉陪封大夫九日登高》，九日指农历九月初九，即重阳节。古时民间在重阳节有登高祈福、秋游赏菊、佩插茱萸、拜神祭祖等习俗。③“粽包分两髻，艾束著危冠”出自陆游的《乙卯重五诗》，意为诗人吃了两只角的粽子，高冠上插着艾蒿，即端午节。④“马上逢寒食，途中属暮春”出自唐代宋之问的《途中寒食》，意为在路途的马上度过晚春的寒食节。寒食节在清明节前一二日。因此按时间顺序排列是①④③②。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46254", "t": 1, "q": "关于兄弟行辈中长幼排行的次序排在第二位的是（     ）。", "a": ["伯", "仲", "叔", "季", "", ""], "r": "B", "e": "【解析】“伯仲叔季”出自《左传·昭公二十六年》:“亦唯伯仲叔季图之。”“伯仲叔季”是兄弟排行的次序，伯是老大，仲是第二，叔是第三，季是最小的。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46255", "t": 1, "q": "下列归类不正确的一组是（     ）。", "a": ["五音：宫、商、角、徵、羽", "五等爵：公、侯、伯、子、男", "六部：吏、户、礼、兵、刑、工", "五经：《诗》《书》《礼》《易》《论语》", "", ""], "r": "D", "e": "【解析】“五经”，指的是儒家的五部主要经典，即《周易》《尚书》《诗经》《礼记》《春秋》。本题为选非题，故正确答案为D。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46256", "t": 1, "q": "“三教九流”中的“三教”，通常是指（     ）。", "a": ["天、地、人", "儒、法、墨", "儒、释、道", "儒、道、阴阳", "", ""], "r": "C", "e": "【解析】“三教”指中国三大传统宗教儒教、道教、佛(释)教。“九流”指儒家、道家、阴阳家、法家、名家、墨家、纵横家、杂家、农家。“三才”指天、地、人。语出《易·系辞下》:“有天道焉，有人道焉，有地道焉。兼三才而两之，故六。六者非它也，三才之道也。”《三字经》:“三才者，天地人。三光者，日月星。”", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46257", "t": 1, "q": "下列关于文化常识表述不正确的是（     ）。", "a": ["岁寒三友：松、竹、梅", "花中四君子：梅、兰、竹、菊", "四库全书：经、史、诗、集", "文人四友：琴、棋、书、画", "", ""], "r": "C", "e": "【解析】A项正确，“岁寒三友”指松、竹、梅，其中松象征长青不老，竹象征君子之道，梅象征冰清玉洁。B项正确，“花中四君子”包括梅、兰、竹、菊。梅迎寒而开，是坚韧不拔的人格的象征；兰花朵色淡香清，生于幽僻之处，故常被看作谦谦君子的象征；竹经冬不凋，常被看作不同流俗的高雅之士的象征；菊艳于百花凋后，不与群芳争列，故历来被用于象征傲然不屈的品格。C项错误，《四库全书》分经、史、子、集四部，故名四库。D项正确，“文人四友”指琴、棋、书、画。在古代，弹琴、弈棋、书法、绘画是文人修身所必须掌握的技能，故合称琴棋书画，即“文人四友”。本题为选非题，故正确答案为C。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46258", "t": 1, "q": "下列关于年龄的词语与其所表示的意思对应有误的是（     ）。", "a": ["及笄——女子满十五岁", "不惑——四十岁", "期颐——百岁", "古稀——八十岁", "", ""], "r": "D", "e": "【解析】A项正确，古代女子年满十五岁结发，用笄贯之，称为及笄，指已经到了结婚的年龄。B项正确，不惑一般指四十岁。《论语·为政》有“四十而不惑”的说法。C项正确，期颐，一般指一百岁老人。“期”指期待，“颐”指供养，意为百岁老人饮食起居不能自理，一切需期待别人供养或照顾。D项错误，古稀指七十岁，语出杜甫《曲江二首·其二》:“酒债寻常行处有，人生七十古来稀。”本题为选非题，故正确答案为D。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46259", "t": 1, "q": "被誉为中国文化三大国粹的是（     ）。", "a": ["京剧、汉服、书法", "针灸、书法、八卦", "京剧、中医、国画", "戏曲、书法、太极", "", ""], "r": "C", "e": "【解析】国粹是指中国几千年文化中的精华，在中华民族的传统文化中极具代表性的东西。我国三大国粹分别是京剧、国画和中医。京剧，曾称“平剧”，腔调以西皮、二黄为主，用胡琴和锣鼓等伴奏，被视为中国国粹，位列中国戏曲三鼎甲“榜首”。国画是用毛笔蘸水、墨、彩在绢或纸上作画，题材可分人物、山水、花鸟等，技法可分工笔和写意，它的精神内核是“笔墨”。中医是研究人体生理、病理以及疾病的诊断和防治等的一门学科，诞生于原始社会，春秋战国时期中医理论已基本形成，之后历代均有总结发展。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46260", "t": 1, "q": "中华人民共和国国歌的词作者是（     ）。", "a": ["聂耳", "冼星海", "雷振邦", "田汉", "", ""], "r": "D", "e": "【解析】A项错误，D项正确，《义勇军进行曲》1935年由田汉作词，聂耳作曲，原是电影《风云儿女》的主题歌，后成为中华人民共和国国歌。田汉是剧作家、戏曲作家、电影编剧、小说家、词作家、诗人、文艺批评家、文艺活动家，中国现代戏剧三大奠基人之一。B项错误，洗星海，中国近代著名作曲家、钢琴家，有“人民音乐家”之称，其作品中《黄河大合唱》最广为人知。C项错误，雷振邦，中国著名的电影音乐人、作曲家，从1955年到1980年，他谱写的电影歌曲代表作多达一百余首，包括《刘三姐》《五朵金花》《冰山上的来客》《芦笙恋歌》《达吉和她的父亲》等40余部影片经典音乐作品。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46261", "t": 1, "q": "关于我国的传统节日与习俗，下列对应正确的是（     ）。", "a": ["上元节——猜灯谜、赛龙舟", "清明节——踏青、佩香囊", "七夕节——吃巧果、拜织女", "中秋节——登高、吃月饼", "", ""], "r": "C", "e": "【解析】A项错误，上元节，又称元宵节、小正月、元夕或灯节，为每年农历正月十五，是中国的传统节日之一，有赏花灯、吃汤圆、猜灯谜、放烟花等传统民俗活动。赛龙舟是端午节的传统民俗活动。B项错误，清明节，又称踏青节、行清节、三月节、祭祖节等，是传统的重大春祭节日，有踏青郊游、扫墓祭祖等传统民俗活动。佩香囊是端午节的传统民俗活动。C项正确，七夕节，又称七巧节、七姐节、乞巧节等，是中国民间的传统节日，经历史发展，七夕被赋予了“牛郎织女”的美丽爱情传说，成为象征爱情的节日。传统民俗活动主要有拜织女、储七夕水、吃巧果、乞求巧艺与姻缘等。D项错误，中秋节，又称月夕、秋节、仲秋节或团圆节，是流行于中国众多民族与汉字文化圈诸国的传统文化节日。传统民俗活动主要有祭月、赏月、拜月、吃月饼、赏桂花、饮桂花酒等。登高是重阳节的传统民俗活动。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46262", "t": 1, "q": "我国首个入选世界非物质文化遗产的传统节日是（     ）。", "a": ["清明节", "端午节", "重阳节", "中秋节", "", ""], "r": "B", "e": "【解析】A项错误，清明节也叫“踏青节”，它既是一个扫墓祭祖的肃穆节日，也是人们踏青游玩的欢乐节日，节期在仲春与暮春之交。2006年5月20日，清明节获批列入第一批国家级非物质文化遗产名录。B项正确，端午节也叫“龙舟节”，它不仅是人们用于拜祭龙祖、祈福辟邪的节日，也是纪念屈原跳江的节日。2009年9月，联合国教科文组织将端午节列入世界非物质文化遗产名录，端午也成为中国首个入选世界非遗的节日。C项错误，重阳节是中国传统节日之一，与除夕、清明节、盂兰盆节(中元节)并称为中国传统四大祭祖节日。2006年5月20日，重阳节被列入首批国家级非物质文化遗产名录。D项错误，中秋节也叫“拜月节”，这一天人们通过对月亮的祭祀，寄托一种思念之情。它与春节、清明节、端午节并称为中国四大传统节日。2006年5月20日，中秋节被列入首批国家级非物质文化遗产名录。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46263", "t": 1, "q": "自然能源根据是否可再生，分为可再生能源与不可再生能源。下列属于不可再生能源的是（     ）。", "a": ["生物质能", "地热能", "天然气", "太阳能", "", ""], "r": "C", "e": "【解析】A.B.D三项错误，可再生能源是指可以在自然界里源源不断地得到补充的能源，包括太阳能、水能、风能、生物质能、地热能等。C项正确，不可再生能源是指不可能在短时间从自然界得到补充的能源，包括煤、原油、天然气、油页岩、核能等。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46264", "t": 1, "q": "开发最成熟、成本最低廉，并且是世界上发展最快的绿色能源技术是（     ）。", "a": ["水力发电", "风力发电", "太阳能发电", "核能发电", "", ""], "r": "B", "e": "【解析】风电技术开发最成熟、成本最低廉，是世界上发展最快的绿色能源技术。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46265", "t": 1, "q": "（     ）泛指由生物体组成或转化的固体、液体或气体燃料。它是可再生能源开发利用的重要方向，具有良好的可贮藏性和可运输性，可提供可替代石油的燃料。", "a": ["化石燃料", "可燃冰", "生物质能", "生物燃料", "", ""], "r": "D", "e": "【解析】A项错误，化石燃料也称矿石燃料，是一种烃或烃的衍生物的混合物，是由死去的有机物和植物在地下分解而形成的，是不可再生能源。其分为煤炭类、石油、油页岩、天然气、油砂以及海下的可燃冰等。B项错误，天然气水合物是分布于深海沉积物或陆域的永久冻土中，由天然气与水在高压低温条件下形成的晶体。因其外观像冰一样且遇火可燃烧，所以又被称作“可燃冰”。C项错误，生物质是指利用大气、水、土地等通过光合作用而产生的各种有机体，即一切有生命的可以生长的有机物质统称为生物质。它包括植物、动物和微生物。生物质能就是这些生物吸收了太阳能之后，体内产生化学变化得到的能量。生物质能可转化为常规的固态、液态和气态燃料，取之不尽、用之不竭，是一种可再生能源，同时也是唯一一种可再生的碳源。D项正确，生物燃料是可再生能源开发利用的重要方向，泛指由生物体组成或转化的固体、液体或气体燃料，没有难闻的气味，并且可以替代从石油中制取的汽油、柴油。其具有多样性、物质性、可循环性、可贮藏性、可运输性和环保性等多种优势。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46266", "t": 1, "q": "人类共有（     ）染色体。", "a": ["23条", "46条", "56条", "64条", "", ""], "r": "B", "e": "【解析】人类共有46条染色体，即23对，其中22对常染色体，1对性染色体。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46267", "t": 1, "q": "DNA分子双螺旋结构的发现者是（     ）。", "a": ["沃森和克里克", "孟德尔和巴甫洛夫", "施旺和施莱登", "达尔文和赖尔", "", ""], "r": "A", "e": "【解析】1953年，沃森和克里克发现了DNA分子双螺旋结构。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46268", "t": 1, "q": "纳米技术是当今各国争相研究的热点，其既具有前沿性，又能使不同学科相互交融，下列关于纳米的说法正确的是（     ）。", "a": ["纳米是一种长度单位", "纳米是一种可食用米类", "空气中粉尘的大小属于纳米级", "纳米科技无所不能，能解决任何问题", "", ""], "r": "A", "e": "【解析】A项正确，纳米是一种长度单位，1纳米等于1米的十亿分之一。B项错误，纳米技术，是在纳米尺度范围内，研究电子、原子和分子内的运动规律和特性的一项崭新技术，跟食物无关。C项错误，空气中的粉尘，是指悬浮在空气中的固体微粒，国际标准化组织规定，粒径小于75μm的固体悬浮物定义为粉尘，不属于纳米级。D项错误，纳米科技现在已经包括纳米生物学、纳米电子学、纳米材料学、纳米机械学、纳米化学等学科，纳米科技有广阔的应用前景，但是该项中纳米科技无所不能的表述过于绝对。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46269", "t": 1, "q": "生物体内的遗传信息，被储存在（     ）。", "a": ["血液中", "细胞内", "染色体链中", "大脑中", "", ""], "r": "C", "e": "【解析】染色体是细胞核中载有遗传信息(基因)的物质，是细胞内具有遗传性质的遗传物质深度压缩形成的聚合体。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46270", "t": 1, "q": "现代生物技术的核心是（     ）。", "a": ["酶工程", "发酵工程", "细胞工程", "基因工程", "", ""], "r": "D", "e": "【解析】生物工程技术包括酶工程、发酵工程、细胞工程和基因工程。现代生物技术的核心是基因工程，它的出现带动了生物技术的全面发展。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46271", "t": 1, "q": "生物技术包括的四个领域是（     ）。", "a": ["基因工程、细胞工程、酶工程、微生物工程", "基因工程、细胞工程、蛋白质工程、酶工程", "基因工程、细胞工程、蛋白质工程、微生物工程", "基因工程、蛋白质工程、酶工程、微生物工程", "", ""], "r": "A", "e": "【解析】生物技术，是指人们以现代生命科学为基础，结合其他基础科学的科学原理，采用先进的科学技术手段，按照预先的设计改造生物体或加工生物原料，为人类生产出所需产品或达到某种目的。近些年来，以基因工程、细胞工程、酶工程、发酵工程(微生物工程)为代表的现代生物技术发展迅猛，并日益影响和改变着人们的生产和生活方式。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46272", "t": 1, "q": "克隆技术史上诞生的“多莉”是世界上首个（     ）。", "a": ["克隆人", "克隆猫", "克隆狗", "克隆羊", "", ""], "r": "D", "e": "【解析】1997年2月27日，英国爱丁堡罗斯林研究所的伊恩·维尔莫特科学研究小组向世界宣布，世界上第一只克隆羊“多莉”诞生。这一消息立刻轰动了全世界。“多莉”是用细胞核移植技术将哺乳动物的成年体细胞培育出的新个体，是第一个成功克隆的哺乳动物。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46273", "t": 1, "q": "四大生物工程技术中，（     ）是指采用现代工程技术手段，利用微生物的某些特定功能，为人类生产有用的产品。", "a": ["基因工程", "细胞工程", "发酵工程", "酶工程", "", ""], "r": "C", "e": "【解析】A项错误，基因工程又称基因拼接技术或DNA重组技术，是以分子遗传学为理论基础，以分子生物学和微生物学的现代方法为手段，将不同来源的基因按预先设计的蓝图，在体外构建杂种DNA分子，然后导入活细胞，以改变生物原有的遗传特性、获得新品种、生产新产品的遗传技术。B项错误，细胞工程是生物工程的一个重要方面。总的来说，它是应用细胞生物学和分子生物学的理论和方法，按照人们的设计蓝图，进行在细胞水平上的遗传操作及进行大规模的细胞和组织培养。通过细胞工程可以生产有用的生物产品或培养有价值的植株，并可以产生新的物种或品系。C项正确，发酵工程，是指采用现代工程技术手段，利用生物(主要是微生物)和有活性的离体酶的某些特定功能，为人类生产有用的产品，或直接把微生物应用于工业生产过程的一种新技术。D项错误，酶工程又称蛋白质工程学，是指工业上有目的地设置一定的反应器和反应条件，利用酶的催化功能，在一定条件下催化化学反应，生产人类需要的产品或服务于其他目的的一门应用技术。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46274", "t": 1, "q": "1911年，荷兰科学家昂内斯用液氦冷却水银，当温度下降到4.2K（相当于-269℃）时发现水银的电阻完全消失了，出现了“零电阻”现象。由于没有一丝一毫的电阻，因而电流能从其中毫无阻碍地穿过。这种现象被称为（     ）。", "a": ["无导电性", "超导电性", "低导电性", "高导电性", "", ""], "r": "B", "e": "【解析】超导电性是指某些物质在一定温度条件下电阻降为零的现象。1911年，荷兰物理学家昂内斯发现汞在温度降至4.2K时突然进入一种新状态，其电阻小到实际上测不出来，他把汞的这一新状态称为超导态。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46275", "t": 1, "q": "现代生物技术中有关“克隆”的说法，错误的是（     ）。", "a": ["通过体细胞进行的", "与原个体有完全相同的基因组织", "通过生殖细胞进行的", "无性繁殖", "", ""], "r": "C", "e": "【解析】克隆是指生物体通过体细胞进行的无性繁殖，以及由无性繁殖形成的基因型完全相同的后代个体组成的种群。通常是利用生物技术由无性生殖产生与原个体有完全相同基因的个体或种群。\n本题为选非题，故正确答案为C。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46276", "t": 1, "q": "物联网就是“物物相连的互联网”。下列不属于物联网应用的是（     ）。", "a": ["商品条形码", "二维码", "射频识别（RFID）", "智能制造", "", ""], "r": "D", "e": "【解析】物联网，是通过射频识别(RFID)、红外感应器、全球定位系统、激光扫描器等信息传感设备，按约定的协议，把任何物品通过物联网域名相连接，进行信息交换和通信，以实现智能化识别、定位、跟踪、监控和管理的一种网络概念。\nA项正确，条形码是由国际物品编码协会规定的，用于表示零售商品、非零售商品、物流单元、参与方位置等代码的条码标识。商品条形码的编码遵循“一物一码”原则，通过对商品条形码识别，可以将对应的商品与互联网相连接并进行信息交互，属于物联网的应用。\nB项正确，二维码，是近几年来移动设备上流行的一种编码方式，它比传统的条形码能存更多的信息，也能表示更多的数据类型。二维码遵循“一物一码”原则，通过技术识别后可以将对应物品纳入物联网，因此二维码也属于物联网的应用。\nC项正确，射频识别是一种通信技术，可通过无线电讯号识别特定目标并读写相关数据，而无需识别系统与特定目标之间建立机械或光学接触。通过射频识别，物体可以被纳入物联网的范围，因此，它属于物联网的应用。\nD项错误，智能制造是一种由智能机器和人类专家共同组成的人机一体化智能系统，它不涉及物与物的信息交互，故智能制造并非物联网的应用。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46277", "t": 1, "q": "通过在合理时间内撷取、管理、处理并整理大量数据，从而帮助企业经营决策提供更积极目的的资讯技术是（     ）。", "a": ["区块链", "大数据", "云计算", "物联网", "", ""], "r": "B", "e": "【解析】大数据，又称巨量资料，指的是所涉及的数据资料量规模巨大到无法通过人脑甚至主流软件工具，在合理时间内达到撷取、管理、处理并整理成为帮助企业经营决策更积极目的的资讯技术。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46278", "t": 1, "q": "下列属于主要人工智能研究领域的是（     ）。", "a": ["图像处理", "机器设计", "市场分析", "科学探索", "", ""], "r": "A", "e": "【解析】A项正确，人工智能的研究目标是用机器，通常为电子仪器、电脑等，尽可能地模拟人的精神活动，并且争取在这些方面最终改善并超出人的能力。图像处理中的图像分析和识别是人工智能的重要应用领域。\nB项错误，机器学习是一门人工智能的科学，而并非是单纯的机器设计。该领域的主要研究对象是人工智能，使用计算机作为工具并致力于模拟人类学习方式，并将现有内容进行知识结构划分来有效提高学习效率。\nC项错误，市场分析是对市场供需变化的各种因素及其动态、趋势的分析。其不属于人工智能研究的领域。\nD项错误，科学探索是指对自然未知部分的探索性发掘。其不属于人工智能研究的领域。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46279", "t": 1, "q": "二维码又称二维条码，常见的二维码为QRCode，QR全称QuickResponse，是一个近几年来移动设备上超流行的一种编码方式，它比传统的BarCode条形码能存更多的信息，也能表示更多的数据类型。以下关于二维码的说法错误的是（     ）。", "a": ["目前二维码大部分都是黑白两色的", "二维码为支付、购物、网络浏览等提供了方便入口", "二维码只要有轻微的破损就无法读取", "“扫一扫”加关注是目前二维码应用的重要方式", "", ""], "r": "C", "e": "【解析】A项正确，目前二维码大部分都是黑白两色的，但二维码也有彩色的。彩色二维码是特殊的二维码，具有普通黑白二维码的所有功能，又能呈现出彩色的外观。目前，彩色二维码和黑白二维码的区别仅表现为外观不同，二者承载的信息量是相同的。\nB项正确，随着智能手机的普及和网络的完善，二维码可以为网络浏览、下载、在线视频、网上购物、网上支付等提供方便的入口。\nC项错误，即使二维码的一部分被损坏或不清楚，只要完整的信息数据可以从其他部分读取和识别，二维码仍然可以被成功扫描。\nD项正确，二维码目前广泛应用于汉字、数学、图片、指纹、声音等信息的存储，“扫一扫”加关注是目前二维码应用的重要方式。\n本题为选非题，故正确答案为C。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46280", "t": 1, "q": "（     ）具有体积比较大、结构复杂、在轨道飞行时间较长、有多种功能的特点，并且能开展多而广的太空科研项目，是一种可供多名航天员巡访、长期工作和生活的载人航天器。", "a": ["空天飞机", "空间站", "载人飞船", "航天飞机", "", ""], "r": "B", "e": "【解析】A项错误，空天飞机，是航空航天飞机的简称，它是既能航空又能航天的新型飞行器，是航空技术与航天技术高度结合的飞行器，将把空间开发推向一个新的阶段。\nB项正确，空间站又称太空站、航天站，是一种在近地轨道长时间运行，可供多名航天员巡访、长期工作和生活的载人航天器。空间站具有体积比较大、结构复杂、在轨道飞行时间较长、有多种功能的特点。\nC项错误，载人飞船是能保障航天员在外层空间生活和工作以执行航天任务并返回地面的航天器。又称宇宙飞船。\nD项错误，航天飞机是一种往返于近地轨道和地面间的、可重复使用的运载工具。它既能像运载火箭那样垂直起飞，又能像飞机那样在返回大气层后在机场着陆。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46281", "t": 1, "q": "以下关于航天科技的说法不正确的是（     ）。", "a": ["在全球的载人航天中，第一个进入太空的人是阿姆斯特朗", "电视节目的转播主要通过地球同步轨道静止卫星来实现", "中国成功研制并发射的第一颗人造地球卫星是“东方红一号”", "人造地球卫星若在轨道上运行速度过慢，会被地球引力吸引回地球", "", ""], "r": "A", "e": "【解析】A项错误，世界上第一个进入太空的人是苏联的加加林，而美国的阿姆斯特朗是第一个登上月球的人。\nB项正确，同步轨道静止卫星相对于地球保持静止，主要用于陆地固定通信，如电话通信、电视节目的转播以及海上移动通信等。\nC项正确，“东方红一号”卫星是我国成功研制并发射的第一颗人造地球卫星，于1970年4月24日在酒泉卫星发射中心发射升空。我国成为继苏、美、法、日之后，世界上第五个用自制火箭发射国产卫星的国家。\nD项正确，人造地球卫星因为速度足够大，才能环绕地球运动。若其在轨道上运行速度过慢，受地球引力的作用，会被吸引回地球。\n本题为选非题，故正确答案为A。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46282", "t": 1, "q": "中国是世界上第（     ）个能够独立开展载人航天活动的国家。", "a": ["二", "三", "四", "五", "", ""], "r": "B", "e": "【解析】2003年10月15日，中国第一艘载人飞船“神舟五号”成功发射。中国首位航天员杨利伟成为浩瀚太空的第一位中国访客。“神舟五号”21小时23分钟的太空行程，标志着中国已成为世界上继俄罗斯和美国之后第三个能够独立开展载人航天活动的国家。从1992年启动载人航天工程以来，中国航天技术不断取得新突破，成为世界上第三个独立掌握载人航天技术、独立开展空间实验、独立进行出舱活动的国家。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46283", "t": 1, "q": "在整个中国航天史中，首位在太空三次出舱的航天员是（     ）。", "a": ["叶光富", "翟志刚", "刘伯明", "聂海胜", "", ""], "r": "B", "e": "【解析】A项错误，2021年10月16日，叶光富搭载神舟十三号载人飞船进入太空，并在2021年12月26日，完成了首次出舱活动。\nB项正确，2008年9月25日至27日在神舟七号飞行任务中，翟志刚担任飞船指令长，是第一位出舱活动的中国人。神舟十三号航天员乘组于2021年11月7日进行首次出舱活动，航天员翟志刚、王亚平着“飞天”舱外服进行舱外作业。2021年12月26日，神舟十三号航天员乘组进行第二次出舱活动，航天员翟志刚顺利出舱，成为首个三次出舱的中国航天员。\nC项错误，刘伯明于2008年9月执行神舟七号飞行任务，2021年6月17日，聂海胜、刘伯明、汤洪波3名航天员搭乘神舟十二号载人飞船送入太空，三人先后进入天和核心舱，标志着中国人首次进入自己的空间站。\nD项错误，2005年10月，聂海胜执行神舟六号飞行任务。2013年6月，执行神舟十号飞行任务，担任指令长。2019年12月入选神舟十二号飞行任务乘组，担任指令长。2021年8月20日，神舟十二号航天员乘组密切协同，圆满完成第二次出舱活动期间全部既定任务，航天员聂海胜、航天员刘伯明安全执行出舱任务", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46284", "t": 1, "q": "世界上拥有自主卫星导航系统的国家有（     ）。", "a": ["中国、美国、俄罗斯", "中国、印度、美国", "印度、美国、德国", "英国、法国、德国", "", ""], "r": "A", "e": "【解析】世界上拥有自主卫星导航系统的国家有3个，分别为美国、俄罗斯和中国，即美国全球定位系统(GPS)、俄罗斯格洛纳斯卫星导航系统(GLONASS)、中国北斗卫星导航系统(BDS)。此外，还有欧洲伽利略卫星导航系统。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46285", "t": 1, "q": "世界上第一颗被正式送入轨道的人造卫星是由（     ）发射的。", "a": ["美国", "苏联", "中国", "英国", "", ""], "r": "B", "e": "【解析】1957年10月4日，苏联发射了世界上第一颗人造地球卫星，这颗人造卫星被送入了轨道。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46286", "t": 1, "q": "下列有关中国航天事业的说法不正确的是（     ）。", "a": ["“东方红一号”的成功发射标志着中国进入航天时代", "我国目前已经掌握航天器海上发射技术", "中国空间站建设是我国载人航天工程“三步走”发展战略的第二步", "长征系列运载火箭起步于20世纪60年代", "", ""], "r": "C", "e": "【解析】A项正确，1970年4月24日中国第一颗人造卫星即“东方红一号”卫星的成功发射，标志着中国开始进入航天时代。\nB项正确，2019年6月5日12时06分，我国在黄海海域使用长征十一号运载火箭，成功完成“一箭七星”海上发射技术试验，这是我国首次在海上进行航天发射，填补了我国运载火箭海上发射的空白，这也使我国成为世界上第三个掌握海上发射技术的国家。\nC项错误，1992年9月，党中央决策实施载人航天工程(代号“921”工程)，并确定了我国载人航天“三步走”的发展战略：第一步，发射载人飞船，建成初步配套的试验性载人飞船工程，开展空间应用实验；第二步，突破航天员出舱活动技术、载人飞船和空间飞行器的交会对接技术，发射空间实验室，解决有一定规模的、短期有人照料的空间应用问题；第三步，建造空间站，解决有较大规模的、长期有人照料的空间应用问题。\nD项正确，长征系列运载火箭是中国自行研制的航天运载工具，起步于20世纪60年代。\n本题为选非题，故正确答案为C。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46287", "t": 1, "q": "下列关于我国五大卫星发射中心的说法有误的是（     ）。", "a": ["酒泉是我国最早的卫星发射基地", "中国东方航天港是我国唯一一个海上发射基地", "文昌卫星发射中心是我国唯一一个低纬度发射中心", "我国探月工程嫦娥一号至五号都是在文昌卫星发射基地发射的", "", ""], "r": "D", "e": "【解析】A项正确，酒泉卫星发射中心又称“东风航天城”，是中国创建最早、规模最大的综合型导弹、卫星发射中心，是测试及发射长征系列运载火箭、中低轨道的各种试验卫星、应用卫星、载人飞船和火箭导弹的主要基地。\nB项正确，中国东方航天港位于山东烟台，是我国唯一一个运载火箭海上发射母港。\nC项正确，文昌卫星发射中心位于海南省文昌市龙楼镇，是中国首个开放性滨海航天发射基地，是世界上为数不多的低纬度发射场之一，也是我国唯一一个低纬度发射中心。\nD项错误，我国探月工程嫦娥一号至四号是在西昌卫星发射中心发射成功的，而嫦娥五号是在文昌卫星发射中心发射成功的。\n本题为选非题，故正确答案为D。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46288", "t": 1, "q": "下列关于航天器的说法不正确的是（     ）。", "a": ["“玉兔号”月球车在月球上行走的动力驱动是电动机", "“长征一号”属于三级运载火箭", "“北斗二号”属于导航卫星", "“风云”系列气象卫星通过光纤实现与地面的数据传输", "", ""], "r": "D", "e": "【解析】A项正确，由于月球表面没有空气，汽油、柴油不能燃烧，而月球光照充足，太阳能电池功能是目前的最优解决方案，所以在月球上可以用太阳能电池提供电能，通过电能带动电动机，驱动月球车行走。因此“玉兔号”月球车在月球上行走的动力驱动是电动机。\nB项正确，“长征一号”是20世纪70年代初期为发射我国第一颗人造地球卫星“东方红一号”而研制的三级运载火箭。\nC项正确，“北斗二号”卫星导航系统是中国独立开发的全球卫星导航系统，该项目于2004年启动，2012年建成，向亚太地区提供服务。\nD项错误，卫星通过电磁波实现与地面的数据传输，“风云”系列气象卫星也是如此。题干中的光纤是有线的，不可能从卫星上连接到地球。\n本题为选非题，故正确答案为D。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46289", "t": 1, "q": "（     ）探测器首次实现航天器在地外天体软着陆。", "a": ["“嫦娥一号”", "“嫦娥二号”", "“嫦娥三号”", "“嫦娥四号”", "", ""], "r": "C", "e": "【解析】A项错误，“嫦娥一号”是我国首颗绕月人造卫星，于2007年10月24日在西昌卫星发射中心发射升空，2009年3月1日完成使命，撞向月球预定地点。\nB项错误，2010年10月1日，“嫦娥二号”卫星在西昌卫星发射中心发射升空，顺利进入地月转移轨道。“嫦娥二号”卫星，是中国第二颗探月卫星、第二颗人造太阳系小行星，也是中国探月工程二期的技术先导星，由中国空间技术研究院研制，是中国第一颗探月卫星“嫦娥一号”卫星的备份星。\nC项正确，“嫦娥三号”探测器于2013年12月2日在中国西昌卫星发射中心由“长征三号”乙运载火箭送入太空，当月14日成功软着陆于月球正面，这是中国第一个实现月球软着陆的无人登月探测器。\nD项错误，2018年12月8日，“嫦娥四号”探测器在西昌卫星发射中心由“长征三号”乙运载火箭成功发射。“嫦娥四号”探测器作为世界首个在月球背面软着陆和巡视探测的航天器，其主要任务是着陆月球表面，继续更深层次更加全面地科学探测月球地质、资源等方面的信息，完善月球的档案资料。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46290", "t": 1, "q": "“天琴计划”是我国航天领域的一项重要科研计划，即部署3颗全同卫星，并在太空中建成一个天文台，用以探测（     ）。", "a": ["声波", "地震波", "电磁波", "引力波", "", ""], "r": "D", "e": "【解析】“天琴计划”是2014年3月由中科院罗俊院士提出，2015年中山大学发起的一个科研计划，负责制定我国空间引力波探测计划的实施方案和路线图。该计划多项关键技术已获得重大进展，其中包括惯性传感、激光干涉测量、无拖曳控制、卫星平台等多项重大技术。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46291", "t": 1, "q": "用来检验纸币真假的不可见光是（     ）。", "a": ["无线电波", "X射线", "红外线", "紫外线", "", ""], "r": "D", "e": "【解析】A项错误，无线电波，是一种电磁波，其波长在电磁波谱中比红外线长。和其他电磁波一样，无线电波也以光速传播。在现代科技中，无线电波常用于通信。\nB项错误，X射线是一种波长极短、能量很大的电磁波，X射线的波长比可见光的波长短，它的光子能量比可见光的光子能量大几万至几十万倍。X射线常应用于医学诊断、医学治疗等。\nC项错误，红外线是波长介于微波与可见光之间的电磁波，具有热效应、穿透能力强的性质。主要应用于夜视仪、透视望远镜、热成像仪。\nD项正确，紫外线是介于可见光和X射线之间波长长度的非可见光。紫外线主要应用有医用消毒杀菌、防伪标签、日光灯、验钞机等。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46292", "t": 1, "q": "往保温瓶里倒开水，可根据声音知水量高低。不同水量的保温瓶发出的声音不同，这是由于水量增多，空气柱的长度缩短，（     ）。", "a": ["振动频率减小，音调降低", "振动频率减小，音调升高", "振动频率增大，音调降低", "振动频率增大，音调升高", "", ""], "r": "D", "e": "【解析】音调是由振动频率决定的，水越多，保温瓶内的空气柱越短，振动频率越大，音调越高，因此根据音调的高低就可以判断水位的高低。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46293", "t": 1, "q": "跳远运动员都是先助跑一段距离后再起跳，这利用的是（     ）。", "a": ["重力势能", "动量", "惯性", "摩擦力", "", ""], "r": "C", "e": "【解析】A项错误，重力势能指物体由于受到重力并处在一定高度时所具有的能量。\nB项错误，动量又称线性动量。在经典力学中，动量表示为物体的质量和速度的乘积，是与物体的质量和速度相关的物理量，指的是运动物体的作用效果。动量也是矢量，它的方向与速度的方向相同。\nC项正确，惯性即保持运动状态不变的性质。惯性大小与物体的运动状态无关，与物体质量大小有关。跳远运动员利用惯性助跑一段距离才起跳，这样会跳得更远。\nD项错误，摩擦力指两个相互接触并挤压的物体，当它们发生相对运动或具有相对运动趋势时，在接触面上产生的阻碍相对运动或相对运动趋势的力。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46294", "t": 1, "q": "“长烟一空，皓月千里，浮光跃金，静影沉璧”是范仲淹《岳阳楼记》中脍炙人口的佳句。诗中“静影沉璧”是由于（     ）造成的。", "a": ["光的色散", "光的散射", "光的反射", "光的折射", "", ""], "r": "C", "e": "【解析】A项错误，在光学中，将复色光分解成单色光的过程，叫光的色散。由两种或两种以上的单色光组成的光(由两种或两种以上的频率组成的光)，称为复色光。不能再分解的光(只有一种频率)，称为单色光。一般让白光(复色光)通过三棱镜就能发生光的色散。\nB项错误，光的散射是指光通过不均匀介质时一部分光偏离原方向传播的现象。\nC项正确，光的反射指光在传播到不同物质时，在分界面上改变传播方向又返回原来物质中的现象。光遇到水面、玻璃以及其他许多物体的表面都会发生反射。“静影沉壁”意为“静静的月影映衬在水面上，像沉人水中的玉璧\"，即水中有月亮的倒影，即光的反射。\nD项错误，光的折射是光从一种介质斜射入另一种介质时，传播方向发生改变，从而使光线在不同介质的交界处发生偏折。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46295", "t": 1, "q": "杠杆是生活中最常见的简单机械。下列属于费力杠杆的是（     ）。", "a": ["老虎钳", "鱼竿", "动滑轮", "扳手", "", ""], "r": "B", "e": "【解析】在物理学中，杠杆是在力的作用下能绕着固定点转动的硬棒。杠杆分为省力杠杆、费力杠杆和等臂杠杆。省力杠杆是动力臂大于阻力臂，平衡时动力小于阻力的杠杆；费力杠杆是动力臂小于阻力臂，平衡时动力大于阻力的杠杆；等臂杠杆是动力臂和阻力臂长度相同的杠杆。\nA项错误，老虎钳的支点在连接钳头和钳柄中间转动的圆心处(整个钳子围绕它转动)，动力是手作用在钳柄上的力，阻力是钳口处夹住的物体阻碍钳子转动的力。其工作时动力臂大于阻力臂，所以老虎钳是省力杠杆。\nB项正确，用手拿着钓鱼竿，则钓鱼竿的支点在手掌的下部，而其动力的作用点在食指与拇指之间，阻力的作用点在钓鱼竿的顶端，阻力臂远远大于动力臂，因此，钓鱼竿为费力杠杆。\nC项错误，动滑轮实质是动力臂等于2倍阻力臂的省力杠杆。它不能改变力的方向，但最多能够省一半的力。\nD项错误，扳手的动力臂大于阻力臂，所以扳手是省力杠杆。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46296", "t": 1, "q": "下列设备中，利用超声波工作的是（     ）。", "a": ["验钞机", "微波炉", "电视遥控器", "潜艇上的声呐系统", "", ""], "r": "D", "e": "【解析】A项错误，验钞机是一种验明钞票真伪以及清点钞票数目的机器，其辨伪手段通常有荧光识别、磁性分析和红外穿透三种方式。超声波并不能应用到验钞机去辨别钞票的真伪。\nB项错误，微波炉是利用食物在微波场中吸收微波能量而使自身加热的烹饪器具。微波是一种电磁波，而超声波是一种机械波，二者性质不同。\nC项错误，电视遥控器是一种运用红外线来远控电视的装置，红外线是一种不可见光，光是一种电磁波，而超声波是一种机械波，二者性质不同。\nD项正确，超声波是声波的一种，是人耳听不见、频率高于20kHz的声波。它是由物质的振动产生的，属于机械波。声呐系统利用水中声波进行探测、定位和通信，超声波恰恰具备方向性好、穿透能力强等特点，因此被广泛应用于潜水艇水下的探测、定位等工作中。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46297", "t": 1, "q": "下列常见装置对应物理原理错误的是（     ）。", "a": ["吸挂衣钩——大气压强原理", "剪刀——杠杆", "水银温度计——连通器原理", "道路急弯处观察镜——凸面镜原理", "", ""], "r": "C", "e": "【解析】A项正确，吸挂衣钩利用的是大气压强原理，吸盘压在较光滑的墙面上后，盘内空气排出，内部气压小于外界大气压，外界大气压将其压在墙壁上，吸盘处于静止状态，吸盘受到竖直向上的墙面对挂衣钩的静摩擦力和竖直向下的重力，二力大小相等，方向相反，是一对平衡力。\nB项正确，剪刀利用的是杠杆原理，中间的相交点为支点。\nC项错误，水银温度计利用的是水银的热胀冷缩原理。\nD项正确，道路急弯处观察镜利用的是凸面镜原理，可以扩大司机的视野。凸面镜对光线起发散作用，同等面积的镜子，观察范围比平面镜更大。\n本题为选非题，故正确答案为C。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46298", "t": 1, "q": "下列物理现象中属于液化的是（     ）。", "a": ["衣柜中的樟脑球变小了", "晾在户外的湿衣服干了", "北方冬天窗户上结的“冰窗花”", "从冰箱中刚拿出来的冰棍冒“白烟”", "", ""], "r": "D", "e": "【解析】A项错误，衣柜中的樟脑球变小是物质由固态直接变成气态，属于升华现象。B项错误，晾在户外的湿衣服干了，是水由液态变为水蒸气，属于汽化现象。\nC项错误，北方冬季因室外温度低，室内较高温度的水汽在窗玻璃上遇冷而形成“冰窗花”，是水由气态直接变成固态的过程，属于凝华现象。\nD项正确，冰棍冒“白烟”是空气中的水蒸气遇冷形成的小水滴，属于液化现象。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46299", "t": 1, "q": "“岸上蹄踏蹄，水中嘴对嘴”体现的光学现象是（     ）。", "a": ["光的折射", "光的散射", "光的反射", "光的衍射", "", ""], "r": "C", "e": "【解析】“岸上蹄踏蹄，水中嘴对嘴”出自宋代黄庭坚的《禅句二首·其一》，意为岸上的驴蹄对踏着水中的驴蹄，水面上的驴嘴对着水中的驴嘴。\nA项错误，光的折射是指光从一种介质斜射入另一种介质时，传播方向发生改变，从而使光线在不同介质的交界处发生偏折的现象。常见的光的折射的物理现象有水中筷子似被折弯、看到的河水比实际浅等。\nB项错误，光的散射是指光通过不均匀介质时一部分光偏离原方向传播的现象。例如无色透明的空气能呈现蔚蓝的颜色，阳光的白色会变成落日的殷红，这些都是地球周围的大气层对阳光进行散射而形成的。\nC项正确，光的反射指光在传播到不同物质时，在分界面上改变传播方向又返回原来物质中的现象。光遇到水面、玻璃以及其他许多物体的表面都会发生反射。水中月亮的倒影、黑板会反光，都属于光的反射现象。题干中的“岸上蹄踏蹄，水中嘴对嘴”体现了光的反射现象。\nD项错误，光的衍射是指光在传播过程中，遇到障碍物或小孔时，光将偏离直线传播的路径而绕到障碍物后面传播的现象。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46300", "t": 1, "q": "下列现象中，能够说明物体的分子在做无规则运动的是（     ）。", "a": ["房间几天不打扫有一层灰", "水从高处往低处流", "放在空气中的铁器过段时间后就会生锈", "一杯白开水放入盐后，过段时间会变咸", "", ""], "r": "D", "e": "【解析】A.B两项错误，是地球引力的作用造成的。\nC项错误，放在空气中的铁器过段时间会生锈，这是物质发生了化学变化。\nD项正确，白开水中放入盐后水会变咸是扩散现象，是分子运动的结果。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46301", "t": 1, "q": "在山顶烧水比在山脚时更容易沸腾，出现这种现象最可能的原因是（     ）。", "a": ["山顶湿度比山脚高", "山顶湿度比山脚低", "山顶大气压比山脚高", "山顶大气压比山脚低", "", ""], "r": "D", "e": "【解析】山顶的空气稀薄，气压小于山脚的。所以水沸腾时形成气泡所需要的饱和蒸汽压降低，只需要更低的温度就可以沸腾。水沸腾时，沸水的蒸汽压等于外界的大气压。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46302", "t": 1, "q": "声音是通过介质传播并能被人或动物听觉器官所感知的波动现象。下列选项中，声音在（     ）中的传播速度是最慢的。", "a": ["常温水", "冰", "空气", "松木", "", ""], "r": "C", "e": "【解析】声音是由物体振动产生的声波，是通过介质(空气或固体、液体)传播并能被人或动物听觉器官所感知的波动现象。声音在不同介质中传播速度一般是固体>液体>气体。声音的传播速度与介质的种类和介质的温度有关。真空不能传播声音。因此选项中声音传播速度最慢的是空气。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46303", "t": 1, "q": "发现万有引力定律的科学家是（     ）。", "a": ["亚里士多德", "伽利略", "开普勒", "牛顿", "", ""], "r": "D", "e": "【解析】A项错误，亚里士多德是世界古代史上伟大的哲学家、科学家和教育家之一。他的著作涉及伦理学、形而上学、心理学、经济学、神学、政治学、修辞学、自然科学、教育学、诗歌、风俗，以及雅典法律。亚里士多德的著作构建了西方哲学的第一个广泛系统，包含道德、美学、逻辑和科学、政治和玄学。\nB项错误，伽利略是意大利天文学家、物理学家和工程师，欧洲近代自然科学的创始人，被称为“观测天文学之父”“现代物理学之父”“科学方法之父”“现代科学之父”。伽利略研究了速度和加速度、重力和自由落体、相对论、惯性、弹丸运动原理，并从事应用科学和技术的研究，描述了摆的性质和“静水平衡”，发明了温度计和各种军事罗盘，并使用用于天体科学观测的望远镜。\nC项错误，开普勒是德国天文学家、数学家与占星家。开普勒发现了行星运动三大定律，分别是轨道定律、面积定律和周期定律，因此被誉为“天空立法者”。同时他对光学、数学也做出了重要贡献。\nD项正确，万有引力定律是牛顿发现的、于1687年在《自然哲学的数学原理》上发表的一种自然规律。牛顿的普适的万有引力定律表示如下：任意两个质点由通过连心线方向上的力相互吸引。该引力大小与它们质量的乘积成正比，与它们距离的平方成反比，与两物体的化学组成和其间的介质种类无关。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46304", "t": 1, "q": "下列关于电阻说法正确的是（     ）。", "a": ["导体中有电流，导体才有电阻", "通过导体的电流越大阻力就越大", "导体两端电压越大，电阻越大", "导体通电有电阻，不通电也有电阻", "", ""], "r": "D", "e": "【解析】A项错误，D项正确，电阻是导体的物理属性，表示导体对电流阻碍作用的大小，其大小与温度、材料、长度及横截面积有关，导体在通电时有电阻，不通电时也有电阻。\nB.C两项错误，电阻是一个只由这段导体自身性质所决定的物理量，与所加电压及通过的电流无关。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46305", "t": 1, "q": "干冰是由（     ）凝结而成。", "a": ["水", "一氧化碳", "氧气", "二氧化碳", "", ""], "r": "D", "e": "【解析】A项错误，水凝固成冰。\nB项错误，一氧化碳凝结之后是液态的一氧化碳。\nC项错误，氧气液化后是液态氧。\nD项正确，干冰是固态的二氧化碳。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46306", "t": 1, "q": "照相机的镜头相当于一个凸透镜，在底片上得到的像是（     ）。", "a": ["正立、放大的虚像", "正立、缩小的虚像", "倒立、放大的实像", "倒立、缩小的实像", "", ""], "r": "D", "e": "【解析】照相机是凸透镜成像规律的典型应用。物体距离相机一般较远，大于2倍焦距，此时成的是倒立、缩小的实像。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46307", "t": 1, "q": "现代科技中，（     ）是通过受激发射而实现光波放大。", "a": ["放射", "核裂变", "核聚变", "激光", "", ""], "r": "D", "e": "【解析】激光的本意是通过受激发射而实现光波放大。激光的原理是著名的美国物理学家爱因斯坦发现的。1964年我国按照著名科学家钱学森的建议将“光受激辐射”改称“激光”。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46308", "t": 1, "q": "“突然间远处海上隐隐传来一阵长啸之声。黄药师和欧阳锋同时心头一震……，那啸声却愈来愈近，想是有人乘船近岛。”由啸声越来越近猜想有人近岛，根据的是（     ）原理。", "a": ["声音的传播", "声音的反射和吸收", "共振引起声音的共鸣", "不同物体振动产生的声波不同", "", ""], "r": "A", "e": "【解析】A项正确，声音是由物体振动而产生的，通过介质传播，气体、液体、固体都可以充当介质。声音在空气中的传播速度约为340m/s，根据啸声传入人耳的时间，便可推算出发出啸声的声源距离人耳的远近，故啸声越来越近，猜想有人近岛，正体现了声音的传播。\nB项错误，声音的传播和光线的传播一样，遇到障碍物时会产生反射和吸收现象。坚硬、光滑的物体表面对声音有明显的反射作用；柔软、粗糙、多孔的物体表面则能吸收声音。\nC项错误，共鸣是可发声的物体之间的共振，是A发声物体发出的声音通过空气等媒介传到B发声物体，并引起它的共振，发出声音。\nD项错误，发声体产生的振动在空气或者其他物质中的传播叫作声波。不同物体振动产生的声波不同。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46309", "t": 1, "q": "下列仪器是由凹面镜原理制造的是（     ）。", "a": ["潜望镜", "观后镜", "太阳灶", "以上均不正确", "", ""], "r": "C", "e": "【解析】A项错误，潜望镜属于平面镜，运用了光的反射原理。\nB项错误，车内的观后镜是平面镜，运用了光的反射原理；外面两侧的后视镜是凸面镜，对光线有发散作用，所以有更广的视角，有利于行车安全。\nC项正确，D项错误，太阳灶属于凹面镜，对光线有汇聚作用，可以用来加热食物。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46310", "t": 1, "q": "经典物理学理论体系建立者是（     ）。", "a": ["伽利略", "牛顿", "爱因斯坦", "阿基米德", "", ""], "r": "B", "e": "【解析】A项错误，伽利略，意大利数学家、物理学家、天文学家，科学革命的先驱，是近代实验科学的奠基人之一。\nB项正确，牛顿，英国皇家学会会长，英国著名的物理学家，经典物理学理论体系建立者，百科全书式的“全才”，著有《自然哲学的数学原理》《光学》。\nC项错误，爱因斯坦为核能开发奠定了理论基础，在现代科学技术和他的深刻影响下，核能的广泛应用开创了现代科学新纪元，被公认为是继伽利略、牛顿以来最伟大的物理学家。\nD项错误，阿基米德，伟大的古希腊哲学家、百科式科学家、数学家、物理学家、力学家，静态力学和流体静力学的奠基人，并且享有“力学之父”的美称。阿基米德和高斯、牛顿并列为世界三大数学家。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46311", "t": 1, "q": "一滴红墨水滴入一个装满清水的杯子，很快一杯水都红了，这体现的是（     ）。", "a": ["磁力现象", "扩散现象", "沸腾现象", "融化现象", "", ""], "r": "B", "e": "【解析】A项错误，磁力是磁场对放入其中的磁体和电流的作用力。磁力是由电磁场传播，电磁场的传播速度是光速，磁力作用的速度也是光速。\nB项正确，扩散现象是指物质分子从高浓度区域向低浓度区域转移直到均匀分布的现象。例如清水中滴入几滴红墨水，过一段时间，水就都染上红色；又如把两块不同的金属紧压在一起，经过较长时间后，每块金属的接触面内部都可发现另一种金属的成分。扩散现象等大量事实表明，一切物质的分子都在不停地做无规则的运动。\nC项错误，沸腾是指液体受热超过其饱和温度时，在液体内部和表面同时发生剧烈汽化的现象。\nD项错误，融化是指冰或者雪由于温度或者是太阳光的照射使其化成水。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46312", "t": 1, "q": "下列关于水垢的说法，不正确的是（     ）。", "a": ["俗称“水锈、水碱”", "指硬水煮沸后所含矿质附着在容器内逐渐形成的白色块状或粉末状的物质", "水垢的导热能力很好", "按化学成分分类，可分为碳酸盐水垢、硫酸盐水垢和混合水垢等", "", ""], "r": "C", "e": "【解析】A.B两项正确，水垢俗称“水锈、水碱”，是指硬水煮沸后所含矿质附着在容器(如锅、壶等)内逐渐形成的白色块状或粉末状的物质。\nC项错误，水垢的导热能力很差，如果锅炉内形成的水垢过厚则会导致锅炉效率降低，重则会引起锅炉爆管，造成锅炉事故。\nD项正确，按化学成分分类，水垢可分为碳酸盐水垢、硫酸盐水垢、硅酸盐水垢和混合水垢等。碳酸盐水垢的主要成分是碳酸钙和碳酸镁；硫酸盐水垢和硅酸盐水垢的主要成分各为硫酸钙及硅酸化合物；混合水垢则多为以上三种水垢的混合物。\n本题为选非题，故正确答案为C。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46313", "t": 1, "q": "下列选项属于防止平面镜成像的是（     ）。", "a": ["潜水艇上使用潜望镜", "夜间行驶时，车内的灯必须关闭", "牙医借助平面镜看清牙齿的背面", "商场常利用平面镜来扩大视野", "", ""], "r": "B", "e": "【解析】A项错误，潜艇潜望镜是潜艇在水下一定深度上用于观测水面和空中目标的光电(光学)装备。潜望镜主要是利用了平面镜成像以及平面镜能改变光的传播方向这一特性。\nB项正确，汽车夜间行驶时，若驾驶室开灯，车前的挡风玻璃相当于平面镜，会把驾驶室内的灯光反射到驾驶员的眼睛里，使驾驶员看不清车前较暗的路况，容易发生交通事故，所以夜间行驶车内的灯必须关闭，这属于防止平面镜成像。\nC项错误，牙医借助平面镜看清牙齿的背面，属于利用平面镜成像原理。\nD项错误，商场常利用平面镜来扩大视野，属于利用平面镜成像原理。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46314", "t": 1, "q": "下列成语中蕴含的科学常识，解释错误的是（     ）。", "a": ["破镜难圆分子之间的距离较大时，引力很小", "如坐针黏压力一定时受力面积与压强成正比", "釜底抽薪液体达沸点后不能继续吸热则沸腾受阻", "以卵击石物体所受的压强超过限度则可能被损坏", "", ""], "r": "B", "e": "【解析】A项正确，由于镜子破裂处的绝大多数分子间距离较大，大于分子直径的10倍，分子间的作用力就十分微弱，所以“破镜不能重圆”。\nB项错误，如坐针毡指的是像针那样比较小的受力面积，在压力一定的情况下，压强会增大；所以压强与受力面积有关，受力面积越小，压强越大，二者成反比。\nC项正确，釜底抽薪利用的灭火原理是清除可燃物，灭掉火源，使液体不能继续吸热，从而使液体沸腾受阻。\nD项正确，牛顿第三定律：两个物体之间的作用力与反作用力总是大小相等、方向相反、作用在同一直线上的。因此，以卵击石，卵和石受到的力都是相同的，压力=压强×受力面积，物体承受的压强都有一定的限度，超过这个限度，物体就会被破坏。所以鸡蛋会破，石头不会破。\n本题为选非题，故正确答案为B。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46315", "t": 1, "q": "充气卤钨灯是填充气体内含有部分卤族元素或卤化物的照明灯具，在商店、橱窗、展厅、汽车等地方广泛应用。它是（     ）。", "a": ["热光源", "等离子光源", "冷光源", "激光光源", "", ""], "r": "A", "e": "【解析】卤钨灯是填充气体内含有部分卤族元素或卤化物的充气白炽灯。其发光原理为：当灯丝发热时，钨原子被蒸发后向玻璃管壁方向移动，当接近玻璃管壁时，钨蒸气被冷却到大约800℃，并和卤素原子结合在一起，形成卤化钨。卤化钨向玻璃管中央继续移动，又重新回到被氧化的灯丝上，由于卤化钨是一种很不稳定的化合物，其遇热后又会重新分解成卤素蒸气和钨，这样钨又在灯丝上沉积下来，弥补被蒸发掉的部分。通过这种再生循环过程，不仅灯丝的使用寿命得到了大大延长，同时，由于灯丝可以工作在更高温度下，从而得到了更高的亮度、更高的色温和更高的发光效率。\nA项正确，热光源是利用热能激发的光源，如白炽灯、卤钨灯等。\nB项错误，等离子体光源是一种利用等离子体焰产生的高温激发光源。\nC项错误，冷光源是几乎不含红外线光谱的发光光源，如LED光源。\nD项错误，激光光源是利用激发态粒子在受激辐射作用下发光的电光源。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46316", "t": 1, "q": "关于粒子和宇宙，下列认识正确的是（     ）。", "a": ["宇宙是一个有层次的天体系统，太阳是宇宙的中心", "光年是时间单位", "摩擦起电的实质是：物质摩擦过程中会在表面产生出电荷", "物理学家汤姆生发现了电子，从而揭示了原子是可再分的", "", ""], "r": "D", "e": "【解析】A项错误，当代天文学的研究成果表明，宇宙是有层次结构的、物质形态多样的、不断运动发展的天体系统。太阳是太阳系的中心天体，而非宇宙的中心天体。太阳系中的八大行星、小行星、流星、彗星、外海王星天体以及星际尘埃等，都围绕着太阳公转，而太阳则围绕着银河系的中心公转。\nB项错误，光年是长度单位，1光年为9.46×10¹²千米，一般被用于衡量天体之间的距离，指光在宇宙真空中一年时间沿直线经过的距离。\nC项错误，摩擦起电的实质是使正负电荷分开，并发生了电荷的转移，并不是创造了电荷。\nD项正确，汤姆生，英国物理学家，电子的发现者，以其对电子和同位素的实验著称。电子的发现证明了原子可以再分。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46317", "t": 1, "q": "组成一切能量的最小单元是（     ）。", "a": ["原子", "电子", "量子", "细胞", "", ""], "r": "C", "e": "【解析】量子是现代物理的重要概念，即一个物理量如果存在最小的不可分割的基本单位，则这个物理量是量子化的，并把最小单位称为量子。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46318", "t": 1, "q": "物理变化和化学变化的根本区别在于是否有新物质生成，如果有新物质生成，则属于化学变化，反之，则是物理变化。下列词语隐含了物理变化的是（     ）。", "a": ["腐草为萤", "春风化雨", "蜡炬成灰", "百炼成钢", "", ""], "r": "B", "e": "【解析】A项错误，腐草为萤是一句比喻，指腐草能化为萤火虫，这是中国古代的传统说法。该项有新物质的生成，属于化学变化。\nB项正确，春风化雨指适合草木生长的和风及雨水，亦用于比喻师长和蔼亲切的教导。该项没有新事物的生成，属于物理变化。\nC项错误，蜡炬成灰指蜡烛烧成了灰，比喻自己为不能相聚而痛苦，无尽无休，直到蜡烛烧成了灰。该项有新事物的生成，属于化学变化。\nD项错误，百炼成钢指铁经过反复锤炼才成为坚韧的钢，比喻经过长期艰苦的锻炼，变得非常坚强。该项有新事物的生成，属于化学变化。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46319", "t": 1, "q": "日食和月食的原理是（     ）。", "a": ["光的折射", "光的直射", "光的反射", "光的映射", "", ""], "r": "B", "e": "【解析】A项错误，光的折射是指光从一种介质斜射入另一种介质时，传播方向发生改变，从而使光线在不同介质的交界处发生偏折的现象。\nB项正确，月食是一种特殊的天文现象：当月球运行至地球的阴影部分时，在月球和地球之间的地区会因为太阳光被地球所遮蔽，在地球上看就感觉月球像是缺了一块；此时的太阳、地球、月球基本位于同一直线上。日食是月球运动到太阳和地球中间，如果三者正好处在一条直线时，月球就会挡住太阳射向地球的光，月球身后的黑影正好落到地球上，这时就会发生日食现象。由此可知，日食和月食产生的共同原理是光的直射。\nC项错误，光的反射是指光在传播到不同物质时，在分界面上改变传播方向又返回原来物质中的现象。\nD项错误，没有“光的映射”这一物理原理。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46320", "t": 1, "q": "下列关于电阻的说法错误的是（     ）。", "a": ["<p>电阻表示导体对电流阻碍作用的大小<\/p>", "<p>在电压恒定的条件下，电流与电阻成反比<\/p>", "<p>在电流恒定的条件下，电压与电阻成正比<\/p>", "<p>其大小与温度、材料、长度及横截面积无关<\/p>", "", ""], "r": "D", "e": "【解析】A.B.C三项正确，电阻指的是电荷在导体中运动时，受到分子和原子等其他粒子的碰撞与摩擦，形成导体对电流的阻碍。欧姆定律中，同一电路导体中的电流跟导体两端的电压成正比，跟导体的电阻成反比，所以在电压恒定的条件下，电流与电阻成反比；在电流恒定的条件下，电压与电阻成正比。\nD项错误，电阻是导体的物理属性，表示导体对电流阻碍作用的大小，其大小与温度、材料、长度及横截面积有关。\n本题为选非题，故正确答案为D。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46321", "t": 1, "q": "“水国蒹葭夜有霜，月寒山色共苍苍。”诗句中“霜”这种自然现象所对应的物态变化是（     ）。", "a": ["液化", "凝华", "升华", "汽化", "", ""], "r": "B", "e": "【解析】A项错误，液化是指物质由气态转变为液态的过程，这一过程中会对外界放热。常见的液化现象有：夏天，冰棒冒“白气”;雾的形成；冬天，人的口中会呼出“白气”;等等。\nB项正确，凝华是指物质直接从气态变为固态的现象。凝华过程中，物质要放热。常见的凝华现象有：碘蒸气遇冷直接变成固态碘；冬夜，室内的水蒸气常在窗玻璃上凝华成冰晶；等等。霜是水蒸气遇冷形成的，由气态直接变成了固态，是凝华现象。\nC项错误，升华是指固态物质不经液态直接变为气态的过程。常见的升华现象有：衣箱里的樟脑球逐渐变小；白炽灯的钨丝变细；等等。\nD项错误，汽化是指物质从液态变为气态的相变过程。蒸发和沸腾是物质汽化的两种形式。常见的汽化现象有：水蒸气的形成；夏天洒在地上的水一会儿变干了；锅中的沸水随着时间的延长越来越少；等等。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46322", "t": 1, "q": "金属中导电性和导热性最高的是（     ）。", "a": ["铜", "银", "铝", "钨", "", ""], "r": "B", "e": "【解析】导电性和导热性最高的金属是银，钨是熔点最高的金属，汞是熔点最低的金属。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46323", "t": 1, "q": "下列关于光的说法，错误的是（     ）", "a": ["光是一种电磁波", "光在真空中无法传播", "光是由物质中的原子产生的", "光在空气中传播的速度大于在固体和液体中的传播速度", "", ""], "r": "B", "e": "【解析】光在真空中的传播速度公认的值为299792458米每秒。\n本题为选非题，故正确答案为B。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46324", "t": 1, "q": "下列属于量子理论中的悖论的是（     ）。", "a": ["阿劳悖论", "双生子悖论", "薛定谔的猫悖论", "奥伯斯悖论", "", ""], "r": "C", "e": "【解析】A项错误，爱因斯坦16岁时就读于瑞士苏黎世附近的阿劳中学，在此期间他就思考这样的问题：如果行驶在海面上的轮船的速度与海浪的波动是同步的，那么在船上的观察者看来，海面就会是静止的，可是，考虑到光也是一种波(电磁波)，如果设想一个观察者骑在“光子”上与光子一样运动，那么在他的眼里，光的传播就会停止。然而事实上，这样的事情是不会发生的，这就是著名的“阿劳悖论”，它蕴含了光速问题的特殊性。\nB项错误，双生子悖论又称双生子佯谬，由法国物理学家P.郎之万提出，其以此质疑狭义相对论的时间膨胀效应。\nC项正确，薛定谔的猫是由奥地利物理学家薛定谔提出的一个思想实验，是指将一只猫关在装有少量镭和氰化物的密闭容器里，根据量子力学理论，由于放射性的镭处于衰变和没有衰变两种状态的叠加，猫就理应处于死猫和活猫的叠加状态。这只既死又活的猫就是所谓的“薛定谔的猫”。但是，不可能存在既死又活的猫，观察者必须在打开容器后才知道结果。这是把微观领域的量子行为扩展到宏观世界的推演。\nD项错误，奥伯斯悖论又称奥伯斯佯谬，由德国天文学家奥伯斯于1823年提出，1826年修订。他指出，一个静止、均匀、无限的宇宙模型会导致如下结论：黑夜与白天一样亮。但实际上夜空却是黑的。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46325", "t": 1, "q": "（     ）的电磁波会穿透电离层。", "a": ["长波", "中波", "短波", "微波", "", ""], "r": "D", "e": "【解析】A项错误，长波是指频率为30～300kHz的无线电波。\nB项错误，中波是指频率为300kHz～3MHz的无线电波。\nC项错误，短波是指频率为3～30MHz的无线电波。\nD项正确，微波是指频率在300MHz～300GHz之间的电磁波。电离层是指有大量离子和自由电子，足以反射电磁波的部分大气层，距地面高度约从60千米开始伸展到1000千米以上。电离层对无线电波的主要影响是使传播方向由电子密度较大区域向密度较小区域弯曲，即发生电波折射。这种影响随波段的不同而不相同。波长越长，折射越显著。30MHz以下的波被折回地面，30MHz以上的波则穿透电离层。因此只有微波的电磁波能穿透电离层。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46326", "t": 1, "q": "在标准状况下，下列均属于固体可燃物质的是（     ）。", "a": ["硫黄、石蜡", "甲烷、面粉", "乙烷、酒精", "涂料、沥青", "", ""], "r": "A", "e": "【解析】可燃物是可以燃烧的物品。可燃性固体是指容易燃烧，在运送中容易燃烧或经摩擦后有可能起火的固体。\nA项正确，硫黄，别名硫，为淡黄色脆性结晶或粉末，有特殊臭味。作为易燃固体，硫黄主要用于制造染料、农药、火柴、火药、橡胶、人造丝等。石蜡是从石油、页岩油或其他沥青矿物油的某些馏出物中提取出来的一种烃类混合物，主要成分是固体烷烃，无臭无味，为白色或淡黄色半透明固体，属于易燃固体。\nB项错误，甲烷是最简单的有机物，也是含碳量最小(含氢量最大)的烃，甲烷属于易燃气体。面粉是一种易燃易爆，遇到明火会爆炸的粉状物。\nC项错误，在标准状况下，乙烷是无色无味的可燃气体。酒精又称乙醇，常温常压下是一种易燃、易挥发的无色透明液体。\nD项错误，涂料，在中国传统名称为油漆，油漆为黏稠油性染料，未干情况下易燃，属于液体。沥青是一种有毒的易燃物，沥青是固体的、黏稠状的，还有液体状的，一般认作可熔化固体。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46327", "t": 1, "q": "夏日雷雨过后，人们会感到空气特别清新，这是因为在雷电时空气发生了化学作用，在这个过程中，生成的化学物质是（     ）。", "a": ["二氧化氮", "二氧化硫", "臭氧", "氟利昂", "", ""], "r": "C", "e": "【解析】夏日雷雨过后，人们会感到空气特别清新，是因为在雷电时空气发生了化学变化，空气中的有些氧气变成了臭氧。浓的臭氧很臭，具有很强的氧化能力，能够漂白与杀菌。稀薄的臭氧会给人以清新的感觉。雷雨过后，空气中会弥漫着少量的臭氧，因此人们会感到空气清新。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46328", "t": 1, "q": "诗歌来源于生活，下列诗歌中不涉及化学变化的是（     ）。", "a": ["粉身碎骨浑不怕，要留清白在人间", "泽中有火，上火下泽", "曾青得铁则化为铜", "日照澄洲江雾开", "", ""], "r": "D", "e": "【解析】化学变化是指相互接触的分子间发生原子或电子的转换或转移，生成新的分子并伴有能量的变化的过程。物理变化，指物质的状态虽然发生了变化，但一般来说物质本身的组成成分却没有改变。\nA项正确，“粉身碎骨浑不怕，要留清白在人间”体现的是化学变化，极形象地写出将石灰石烧成石灰粉的过程，具体原理是CaCO₃在高温的作用下生成了CaO(白色固体)和CO₂的过程，有新物质生成，属于化学变化。\nB项正确，“泽中有火，上火下泽”出自《易经》。“泽中有火”是对沼气在湖泊池沼水面上起火现象的描述，沼气的主要成分为甲烷，甲烷燃烧后生成二氧化碳和水，有新物质生成，属于化学变化。\nC项正确，“曾青得铁则化为铜”是铁和硫酸铜反应生成铜和硫酸亚铁，铜附着在铁的表面，有新物质生成，属于化学变化。\nD项错误，“日照澄洲江雾开”中雾属于胶体分散系，可见光通过时会出现丁达尔现象，即丁达尔效应，没有新物质的产生，不属于化学变化。\n本题为选非题，故正确答案为D。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46329", "t": 1, "q": "氧化还原反应存在于我们生活的各个角落，下列没有涉及氧化还原反应的是（     ）。", "a": ["酒驾检测", "利用二氧化氯对饮用水消毒", "食品包装袋里面放入硫酸亚铁", "水壶用一段时间会产生大量水垢", "", ""], "r": "D", "e": "【解析】氧化还原反应是化学反应前后元素的氧化数有变化的一类反应，其实质是电子的得失或共用电子对的偏移。自然界中的燃烧、呼吸作用、光合作用，生产生活中的化学电池、金属冶炼、火箭发射等都与氧化还原反应息息相关。\nA项正确，酒精中含有一种橙红色、具有强氧化性的物质，当它在酸性条件下酒精被还原成三价铬时，颜色变为绿色。酒驾检测正是利用了此化合物的氧化还原反应。\nB项正确，二氧化氯是一种高效氧化剂，通常被用作初级或二级消毒剂对饮用水进行消毒，还可用于铁、锰离子的氧化，颜色调节以及硫化物和酚类物质的去除等。\nC项正确，硫酸亚铁具有抗氧化作用，有较强的还原性，可与空气中的氧化物进行反应，吸收水分，起到干燥食物的作用。\nD项错误，水垢的主要成分为碳酸钙和碳酸镁等物质，通过复分解反应可得，中间没有化合价的变化以及电子的转移，所以不是氧化还原反应。\n本题为选非题，故正确答案为D。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46330", "t": 1, "q": "从天然气或原油中获取的燃料气体，可以称为（     ）。", "a": ["碳水化合物", "碳氢化合物", "氧气", "氢气", "", ""], "r": "B", "e": "【解析】石油和天然气从化学成分上来说都是碳氢化合物，因此从天然气或原油中获取的燃料气体可以称为碳氢化合物。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46331", "t": 1, "q": "关于“真金不怕火炼”说法正确的是（     ）。", "a": ["金不导热，所以不怕火", "金的质地坚硬，无法用火熔化", "不管火的温度多高都不能熔化金子", "金的熔点高，一般的火焰达不到金的熔点", "", ""], "r": "D", "e": "【解析】A项错误，金具有良好的导热性。\nB项错误，金的质地柔软，熔点为1064.4℃，可用火熔化。\nC项错误，当温度达到金的熔点后，金子便开始熔化。\nD项正确，金的熔点高，一般的火焰温度达不到金的熔点，因此给人以金不怕火的感觉。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46332", "t": 1, "q": "下列与化学有关的知识，表述不正确的是（     ）。", "a": ["食盐的主要成分氯化钠属于有机化合物", "拉瓦锡推翻了燃素说，正式确立了近代化学", "离子是带电荷的原子或分子得到或失去电子后的产物", "门捷列夫发现了化学元素的周期性，制作出了元素周期表", "", ""], "r": "A", "e": "【解析】A项错误，狭义上的有机化合物主要是指由碳元素、氢元素组成的化合物，即有机化合物一定是含碳的化合物，但是不包括碳的氧化物和硫化物、碳酸、碳酸盐等。氯化钠为典型的无机物。\nB项正确，1777年，拉瓦锡推翻了“燃素说”，建立了燃烧氧化说，正式确立了近代化学。\nC项正确，离子是指原子或原子基团失去或得到一个或几个电子而形成的带电荷的粒子。\nD项正确，1869年，俄国化学家门捷列夫制作出了第一张元素周期表，揭示了化学元素间的内在联系，成为化学发展史上的重要里程碑之一。\n本题为选非题，故正确答案为A。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46333", "t": 1, "q": "香蕉刚采摘下来时，往往是绿色的，没有成熟，但是包在袋子里面后，会慢慢变熟，这是因为在放置的时候释放了一种催熟的物质（     ）。", "a": ["甲烷", "乙烯", "氧气", "二氧化碳", "", ""], "r": "B", "e": "【解析】A项错误，甲烷是天然气、沼气、坑气等的主要成分，俗称瓦斯。它可用来作为燃料及制造氢气、炭黑、一氧化碳、乙炔、氢氰酸及甲醛等物质的原料，没有催熟功能。\nB项正确，乙烯是合成纤维、合成橡胶、合成塑料(聚乙烯及聚氯乙烯)、合成乙醇(酒精)的基本化工原料，也用于制造氯乙烯、苯乙烯、环氧乙烷、醋酸、乙醛和炸药等，尚可用作水果和蔬菜的催熟剂，是一种已证实的植物激素。\nC项错误，氧气是氧元素形成的一种单质，其化学性质比较活泼，无色无味，不易溶于水，与香蕉的催熟无关。\nD项错误，二氧化碳，在常温常压下是一种无色无味的气体，也是一种常见的温室气体，不支持燃烧，与题干无关。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46334", "t": 1, "q": "（     ）在1817年由瑞典化学家永斯·雅各布·贝采利乌斯发现，化学符号是Se，是一种非金属。它是癌细胞的有效杀伤剂，它能阻断癌细胞的重要能量来源，提高癌细胞中环腺苷酸的水平，在体内形成抑制癌细胞分裂和增殖的内环境。", "a": ["铁", "锌", "铜", "硒", "", ""], "r": "D", "e": "【解析】A项错误，铁的化学符号是Fe，原子序数是26，是铁族元素的代表。它是过渡金属的一种，是地壳中含量第二高的金属元素。\nB项错误，锌的化学符号是Zn，它的原子序数是30，是一种浅灰色的过渡金属。\nC项错误，铜的化学符号是Cu，是一种金属化学元素，也是人体所必需的一种微量元素。\nD项正确，硒是非金属元素，化学符号是Se，可以用作光敏材料、电解锰行业催化剂、动物体必需的营养元素和植物有益的营养元素等。硒的防癌抗癌作用体现在它能抑制癌细胞的生长及其DNA.RNA和蛋白质合成，抑制癌基因的转录，干扰致癌物质的代谢。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46335", "t": 1, "q": "被蚊虫叮咬后，可以用氨水、小苏打溶液或肥皂水涂抹止痒，这是利用它们的（     ）。", "a": ["表面活性", "弱酸性", "弱氧化性", "弱碱性", "", ""], "r": "D", "e": "【解析】蚊虫叮咬时会向人体注入一种酸性物质，在叮咬处涂抹氨水、小苏打溶液或肥皂水，利用它们的弱碱性，中和蚊虫释放的酸性物质，可减轻痛痒症状。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46336", "t": 1, "q": "科学揭示燃烧现象的科学家是（     ）。", "a": ["哥白尼", "牛顿", "拉瓦锡", "爱迪生", "", ""], "r": "C", "e": "【解析】1777年9月5日，法国科学家拉瓦锡向巴黎科学院提交了划时代的《燃烧概论》，系统地阐述了燃烧的氧化学说。他在英国化学家普列斯特利研究的基础上提出空气本身不是元素，而是混合物，主要由氧、氮组成，氧气是一种有利于呼吸和助燃的气体。他进一步阐明燃烧的过程在任何情况下，都是可燃物质与氧的化合，而并非施塔尔认为的是可燃物放出燃素的分解反应。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46337", "t": 1, "q": "下列哪项可用于制作冷冻麻醉剂？（     ）", "a": ["氦气", "氢气", "氨气", "氮气", "", ""], "r": "D", "e": "【解析】A项错误，氦气是一种无色无味的惰性气体，在血液中的溶解度较氮气小，因而其麻醉性低于氮气。\nB项错误，氢气是一种极易燃烧，无色透明、无臭无味且难溶于水的气体，不用于制作冷冻麻醉剂。\nC项错误，氨气是一种无色气体，有强烈的刺激性气味，能灼伤皮肤、眼睛、呼吸器官的黏膜，人吸入过多，能引起肺肿胀，以致死亡，不能用于制作冷冻麻醉剂。\nD项正确，液氮由于它的低温，以及汽化过程中可带走大量的热，所以能够使麻醉区域温度骤降，减缓兴奋的传导，使痛觉信号无法到达大脑皮层的感觉中枢，从而起到麻醉作用。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46338", "t": 1, "q": "水是由氢、氧两种元素组成的物质。所谓硬水和软水的区别，就是水中含有钙、（     ）化合物多少的程度差别。", "a": ["铁", "钾", "镁", "锰", "", ""], "r": "C", "e": "【解析】水的硬度是指水中钙、镁离子的总浓度，即钙盐与镁盐含量的多少。水中钙、镁化合物含量多的硬度大，反之则硬度小。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46339", "t": 1, "q": "关于气体在生活中的应用，下列对应错误的是（     ）。", "a": ["氮气——汽车安全气囊", "笑气——麻醉剂", "二氧化碳——人工降雨", "氨气——充填充气艇", "", ""], "r": "D", "e": "【解析】A项正确，氮气，为无色无味的气体，化学性质很不活泼，汽车安全气囊当中所装的化学物质主要是氮气。\nB项正确，一氧化二氮，又称笑气，是一种无机物，无色，有甜味，有轻微麻醉作用，医学上亦曾作麻醉剂使用，并能致人发笑，也是一种氧化剂，在一定条件下能支持燃烧，但在室温下稳定。\nC项正确，人工降水，又称人工增雨，是指根据自然界降水形成的原理，人为补充某些形成降水的必要条件，促进云滴迅速凝结或碰并增大成雨滴，降落到地面的过程。其方法是根据不同云层的物理特性，选择合适时机，用飞机、火箭向云中播撒干冰(固态二氧化碳)、碘化银、盐粉等催化剂，使云层降水或增加降水量，以解除或缓解农田干旱、增加水库灌溉水量或供水能力，或增加发电水量等。\nD项错误，充气艇，是一种充气式的冲锋舟，原来充气艇里的气体是氢气，但是由于氢气存在一定的危险性，有爆炸的风险，于是改用氦气。氦气属于稀有气体，密度比空气小，化学性质稳定，是安全的气体，化学实验或工厂里常用作保护气。\n本题为选非题，故正确答案为D。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46340", "t": 1, "q": "下列选项中，能使澄清石灰水变浑浊的气体是（     ）。", "a": ["氧气", "氮气", "氢气", "二氧化碳", "", ""], "r": "D", "e": "【解析】A项错误，氧气与澄清的石灰水不发生化学反应。\nB项错误，氮气与澄清的石灰水不发生化学反应。\nC项错误，氢气与澄清的石灰水不发生化学反应。\nD项正确，二氧化碳与氢氧化钙反应生成碳酸钙，碳酸钙不溶于水，故二氧化碳会使澄清石灰水变浑浊。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46341", "t": 1, "q": "生石灰干燥剂的主要成分为（     ），其吸水能力是通过化学反应来实现的，此吸水具有不可逆性。", "a": ["氧化钙", "碳酸钙", "硫酸钙", "氢氧化钙", "", ""], "r": "A", "e": "【解析】A项正确，碳酸钙经高温煅烧后生成氧化钙(俗称生石灰)，氧化钙吸水生成氢氧化钙(俗称熟石灰)，同时释放大量的热。生石灰干燥剂的主要成分为氧化钙。\nB项错误，碳酸钙是石灰石的主要成分，是重要的建筑材料，工业上用途甚广。\nC项错误，自然状态下硫酸钙以二水硫酸钙晶体形式存在，即CaSO₄·2H₂O，俗称石膏、生石膏，加热后，脱去部分水生成半水石膏(CaSO₄·0.5H₂O，俗称熟石膏)，进一步加热，生成无水石膏(CaSO₄)。\nD项错误，氢氧化钙，俗称熟石灰、消石灰，用于制作漂白粉、硬水软化剂，还可以改良土壤酸性等。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46342", "t": 1, "q": "食盐常会潮解是因为食盐中常含有（     ），而这一物质在空气中有潮解现象。", "a": ["氧化铜", "氯化镁", "高锰酸钾", "碳酸氢钠", "", ""], "r": "B", "e": "【解析】A项错误，氧化铜(CuO)是一种铜的黑色氧化物，无定形或结晶性粉末，略显两性，不溶于水和乙醇，稍有吸湿性，常温下比较稳定，不易产生潮解现象。主要用于制人造丝、陶瓷、电池、杀虫剂，也供制氢、催化剂、绿色玻璃等用。\nB项正确，氯化镁(MgCl₂)，纯品为无色单斜结晶，易吸潮，易溶于水，在空气中会发生潮解现象。多用于制金属镁、消毒剂、灭火剂、呈味剂。\nC项错误，高锰酸钾(KMnO₄)为黑紫色、细长的菱形结晶或颗粒，带蓝色的金属光泽，无臭，溶于水、碱液，微溶于甲醇、丙酮、硫酸，常温下稳定，不易产生潮解现象。多用于制作糖精、维生素C。\nD项错误，碳酸氢钠(NaHCO₃)，俗称小苏打，白色晶体，或不透明单斜晶系细微结晶。常温下性质稳定，在干燥空气中无变化，在潮湿空气中缓慢潮解，多用于制作食用小苏打等。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46343", "t": 1, "q": "《天工开物》记载：“凡取煤经历久者，从土面能辨有无之色，然后掘挖。深至五丈许，方始得煤。初见煤端时，毒气灼人，有将巨竹凿去中节，尖锐其末，插入炭中，其毒烟从竹中透上。”这里“毒烟”的主要成分是（     ）。", "a": ["甲烷", "乙烷", "丙烷", "丁烷", "", ""], "r": "A", "e": "【解析】A项正确，甲烷是一种有机化合物，分子式为CH₄，是最简单的有机物，也是含碳量最小(含氢量最大)的烃。甲烷在自然界分布很广，是天然气、沼气、坑气的主要成分，可作为燃料及制造氢气、炭黑、一氧化碳、乙炔、氢氰酸及甲醛等物质的原料。题干中“毒烟”即瓦斯，主要成分甲烷。\nB项错误，乙烷存在于石油气、天然气、焦炉气及石油裂解气中，经分离而得，在某些天然气中含量为5%～10%，仅次于甲烷；并以溶解状态存在于石油中。\nC项错误，丙烷为无色气体，无臭，微溶于水，溶于乙醇、乙醚，与空气混合后形成爆炸性混合物。其存在于天然气及石油热解气体中。常用作冷冻剂、内燃机燃料或有机合成原料。\nD项错误，丁烷一般指正丁烷，为无色气体，常温加压溶于水，能溶于乙醇、乙醚，易燃易爆，可用作溶剂、制冷剂和有机合成原料。油田气、湿天然气和裂化气中均含有正丁烷，经分离而得。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46344", "t": 1, "q": "中国五千年的文明史为世人呈现了灿烂的文化，酿酒、缫丝、造纸、制瓷都是中国劳动人民长期经验积累的智慧结晶，是工匠技艺与科学知识的完美融合，下列相关表述不正确的是（     ）。", "a": ["“绿蚁新醅酒，红泥小火炉”——新醅酒的主要成分是乙醛", "“春蚕到死丝方尽，蜡炬成灰泪始干”——蚕丝的主要成分是蛋白质", "“写了吟看漫卷愁，浅红笺纸小银钩”——笺纸的主要成分是纤维素", "“临行尚作半日留，满泛青瓷话离别”——青瓷的主要成分是硅酸盐", "", ""], "r": "A", "e": "【解析】A项错误，新醅酒是指新酿造的酒。酿酒是利用微生物发酵生产含一定浓度酒精饮料的过程，而酒精的主要成分是乙醇。\nB项正确，蚕丝是熟蚕结茧时所分泌丝液凝固而成的连续长纤维，也称天然丝，是一种天然纤维，也是人类利用最早的动物纤维之一。其主要是由纤维状蛋白质丝纤蛋白外包以另一种蛋白质丝胶蛋白粘结而成，此外尚含少量油脂类、色素、无机物等等。\nC项正确，笺纸，即文书用纸，由含植物纤维的原材料经过制浆、调制、抄造、加工等工艺流程制成。原料中主要含有纤维素、半纤维素、木素三大主要成分。\nD项正确，青瓷是一种表面施有青色釉的瓷器，主要是胎釉中含有一定量的氧化铁，在还原焰气氛中焙烧所致。所用原料大部分是天然的矿物或岩石，其中多为硅酸盐矿物。\n本题为选非题，故正确答案为A。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46345", "t": 1, "q": "酸雨是指pH低于5.6的大气降水，通常形成酸雨的物质是（     ）和氮氧化物。", "a": ["二氧化硫", "一氧化硫", "二氧化碳", "一氧化碳", "", ""], "r": "A", "e": "【解析】A项正确，二氧化硫是最常见的硫氧化物，是硫酸原料的主要成分，为无色气体，有强烈刺激性气味。二氧化硫溶于水中，会形成亚硫酸，也就是酸雨的主要成分。\nB项错误，一氧化硫是一种无机化合物，为无色气体，不稳定，只存在于毫秒之间，很容易发生聚合作用。\nC项错误，二氧化碳溶于水后会形成碳酸，但其pH不低于5.6，形不成酸雨。\nD项错误，一氧化碳极难溶于水，极易与血红蛋白结合，形成碳氧血红蛋白，使血红蛋白丧失携氧的能力和作用，造成组织窒息，严重时会使人死亡。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46346", "t": 1, "q": "密度最大的化学元素是（     ）。", "a": ["锇", "氢", "氧", "镉", "", ""], "r": "A", "e": "【解析】A项正确，锇是元素周期表第六周期VⅢ族元素，铂族金属成员之一，元素符号为Os，属重铂族金属，是已知的密度最大的金属。\nB项错误，氢是一种化学元素，元素符号为H，在元素周期表中位于第一位，氢气是最轻的气体。\nC项错误，氧的元素符号为O，氧位于元素周期表第二周期VIA族。氧是地壳中最丰富、分布最广的元素，也是构成生物界与非生物界最重要的元素。\nD项错误，镉，稀有金属元素，化学符号Cd，1817年发现。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46347", "t": 1, "q": "由于不同的金属和金属离子在燃烧时会呈现出不同的颜色，所以烟花在空中爆炸时，便会绽放出五彩缤纷的火花。例如，铝镁合金燃烧时会发出耀眼的（     ）光。", "a": ["橙色", "黄色", "蓝色", "白色", "", ""], "r": "D", "e": "【解析】镁，是一种银白色的轻质碱土金属，化学性质活泼，燃烧时能发出强烈的白光。铝，是一种银白色轻金属，质地坚韧而轻，燃烧时能发出刺眼的白色火焰。因此，铝镁合金燃烧时会发出耀眼的白光。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46348", "t": 1, "q": "下列化学反应不是放热反应的是（     ）。", "a": ["盐酸和氢氧化钠发生的中和反应", "钠与盐酸发生的置换反应", "碳酸钙的分解反应", "木炭在氧气中燃烧", "", ""], "r": "C", "e": "【解析】A项正确，氢氧化钠能与盐酸反应生成氯化钠和水，该反应为放热反应，氢氧化钠固体溶于水会放出大量的热。\nB项正确，钠与稀盐酸发生置换反应，生成氯化钠和氢气，化学方程式为：2Na+2HCl=2NaCl+H₂1。钠是活泼金属，活泼金属与酸发生的置换反应一般为放热反应。\nC项错误，碳酸钙受热分解是分解反应，碳酸钙在高温下分解为氧化钙和二氧化碳。大部分的分解反应都是吸热反应。\nD项正确，绝大多数的化合反应是放热反应。木炭在氧气中充分燃烧放热，生成二氧化碳，化学方程式为：C+O₂=CO₂。\n本题为选非题，故正确答案为C。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46349", "t": 1, "q": "下列不具有消毒杀菌作用的是（     ）。", "a": ["熟石灰", "双氧水", "氯气", "氢氧化铝", "", ""], "r": "D", "e": "【解析】A项正确，氢氧化钙，俗称熟石灰或消石灰，是一种白色粉末状固体。氢氧化钙是一种强碱，具有杀菌与防腐能力，对皮肤、织物有腐蚀作用。氢氧化钙在工业中有广泛的应用，它是常用的建筑材料，也用作杀菌剂和化工原料等。\nB项正确，双氧水，是过氧化氢的水溶液，医药工业用作杀菌剂、消毒剂，以及生产福美双杀虫剂和抗菌剂的氧化剂。\nC项正确，氯气是一种黄绿色、密度比空气大的气体，氯气跟水发生反应生成次氯酸，次氯酸可以起到杀菌消毒的作用。\nD项错误，氢氧化铝是一种无机物，是铝的氢氧化物。氢氧化铝是用量最大和应用最广的无机阻燃添加剂。氢氧化铝作为阻燃剂不仅能阻燃，而且可以防止发烟、不产生滴下物、不产生有毒气体。\n本题为选非题，故正确答案为D。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46350", "t": 1, "q": "<p>下图展示的是一种由60个碳原子构成的分子，化学式为Co。因其形似足球，又名足球烯。这一足球形状的分子结构由五边形和六边形组成。其中有<u>&nbsp;&nbsp;&nbsp;&nbsp;<\/u>块五边形和<u>&nbsp;&nbsp;&nbsp;&nbsp;<\/u>块六边形。填入画横线处正确的一项是（ ）。<\/p>\n<p><img src=\"https://dati.gwzpks.com/uploads/20260825/fWkl43cVSajJIds6FLKC68PtJGseYZAzCX6wZv4G.png\"><\/p>", "a": ["<p>12块20块<\/p>", "<p>14块18块<\/p>", "<p>10块22块<\/p>", "<p>16块16块<\/p>", "", ""], "r": "A", "e": "【解析】Co是一种碳原子簇，它由60个碳原子构成像足球一样的32面体，包括20块六边形，12块五边形。这60个碳原子在空间进行排列时，形成一个化学键最稳定的空间排列位置，恰好与足球表面格的排列一致。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46351", "t": 1, "q": "变色眼镜的奥秘在玻璃里，这种特殊的玻璃叫作“光致变色”玻璃，它在制造过程中，预先掺进了对光敏感的物质（     ），还有少量氧化铜催化剂，眼镜片可从没有颜色变成浅灰、茶褐色，再从黑眼镜变回到普通眼镜。", "a": ["氯化铁", "氯化铜", "氧化银", "卤化银", "", ""], "r": "D", "e": "【解析】变色眼镜是由变色玻璃做成的眼镜，在适当波长光的辐照下可改变其颜色，而移去光源时则恢复其原来颜色。\nA项错误，氯化铁是一种共价无机化合物，化学式为FeCl₃。为黑棕色结晶，也有薄片状，易溶于水并且有强烈的吸水性，能吸收空气里的水分而潮解。主要可用于金属蚀刻、污水处理。其中蚀刻包括铜、不锈钢、铝等材料的蚀刻；对低油度的原水处理，具有效果好、价格便宜等优点，但缺点是带来水色泛黄。\nB项错误，氯化铜，无机化合物，化学式为CuCl₂。氯化铜是共价化合物，为平面链状。易从空气中吸湿而变成蓝绿斜方晶体二水合物CuCl₂·2H₂O。氯化铜为黄棕色粉末，易溶于水、乙醇、丙酮，溶于氨水，稍溶于丙酮和乙酸乙酯，微溶于乙醚。其水溶液对石蕊呈酸性反应。氯化铜在自然界中以水氯铜矿形式存在。通常由碳酸铜和盐酸反应制得。通常用作有机和无机反应催化剂，媒染剂，杀虫剂，石油脱臭、脱硫和精制剂。\nC项错误，氧化银是一种无机物，化学式为Ag₂O，为棕褐色立方晶系结晶或棕黑色粉末，微溶于水，易溶于酸和氨水，受热易分解成单质，在空气中会吸收二氧化碳变为碳酸银。主要用于电子工业和有机合成。\nD项正确，变色玻璃是在玻璃原料中加入卤化银微晶制成。卤化银具有两种不同的分子或电子结构状态，在可见光区有两种不同的吸收系数，在光的作用下，可从一种结构转变到另一种结构，导致颜色的可逆变化。卤化银变色玻璃的特点是不容易疲劳，经历30万次以上明暗变化后，依然不失效，是制作变色眼镜常用的材料。变色玻璃还可用于信息存储与显示、图像转换、光强控制和调节等方面。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}, {"id": "46352", "t": 1, "q": "下列属于容易引起爆炸的粉尘的是（     ）。", "a": ["淀粉", "飞灰", "泥土", "沙石", "", ""], "r": "A", "e": "【解析】粉尘爆炸，指可燃性粉尘在爆炸极限范围内，遇到热源，瞬间剧烈燃烧，释放巨大压力和热量。常见的七类具有爆炸性的粉尘分别是：(1)金属类，如镁粉、铝粉；(2)煤炭类，如活性炭和煤；(3)粮食类，如小麦、淀粉；(4)饲料类，如血粉、鱼粉；(5)合成材料类，如塑料、染料；(6)家副产品类，如棉花、烟草；(7)林业品类，如粉纸、木粉。\nA项正确，淀粉是被外界公认的七类具有爆炸性的粉尘种类之一。\nB.C.D三项错误，飞灰、泥土、沙石的化学性质比较稳定，不易燃烧，因此不容易爆炸。", "l3": "一般能力", "l4": "1.11节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||2.1节", "n": "一般能力 / 2.1节", "qs": [{"id": "46353", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/y0BCYQM7PPAuiqhc6gi2xcZjUO2xrdlcjn7BrpPh.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/G8t5qSqSCYR1893q9brDgZNLw3B8sUwa6EJQiCL9.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/QQPDsJu0uandWV11kS8cAQvT8rYzgQhMf44TPE7D.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/lgXj0WeZtbnvzyaMRI3DnxCrILvo2499zHyntund.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/O1oA0IVXxWOjvA0bu44wbCwUsQwRgL9j4h4fJf5d.png\"><\/p>", "", ""], "r": "C", "e": "<p>【解析】观察题目图形，第一组图形中，第三个图形由前两个图形去同求异得到。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46354", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/48CsgIzvqjK9vxo5ZykZmZwaqlxF064JsaNbELE6.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ZFw6HpsaA3cBtHb3TlM0zdYgAIZUepqk6DBPookY.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/HCo1vq3BPVDOg859RJRMAzYi3QR0aACsklQmw6rk.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/nEDTqNPkB4HcC4Ejlm6d9BEGEODUy6ZTfNDr4xlq.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/jw4sSlaSuwzmtX06ENaVHCuS9X12fBol6gWF1uHU.png\"><\/p>", "", ""], "r": "B", "e": "<p>【解析】图形中的交叉点数目为3。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46355", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/VGD812KNIaj11yO7vVNnNe7e7FSvv92vIjf8QcDE.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/yHgkaYVhJDwXLmD4Z5mr0xQDukRIHNPdYnWY5TFm.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/9D2OM1dWL3x3yV7Mgv1U92wLxvrDt1a8kbbijBeg.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/3aBZ3zcbk7p334qUNQp5KYUgfCVNRkHXkj6Tl8Tv.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/go7dmWIz7S7vxYpL8WbAUex2tLgQTwgXPyTSUVJY.png\"><\/p>", "", ""], "r": "C", "e": "<p>【解析】奇数项都含有三角形，偶数项都含有圆，故选C。另解：题干图形都是一笔画图形，且奇数项都是直线图形，偶数项都是曲线图形，故选C。<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46356", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/xXEvJvmz5ocWx1yHDbMxm0bs3VORXyTSh2ZXfQGv.png\"><\/p>", "a": ["<p>①③④，②⑤⑥<\/p>", "<p>①②③，④⑤⑥<\/p>", "<p>①④⑥，②③⑤<\/p>", "<p>①②④，③⑤⑥<\/p>", "", ""], "r": "A", "e": "<p>【解析】①③④的曲线数为2，②⑤⑥的曲线数为1。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46357", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/DB4PzZdIaYuBIfz4FqUDzjnoOLLrXIYbZ8VDsmMx.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/KbaP7XPz5Cve0PZjRJRw45wXaVH3ZEiLgpa3U6Po.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/VClwHW0c1c3o2ORcBU7dOUFG7MXNUBETnb5Pvczr.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/gwJFCpuJAlP0wPoZWfGpgyNKs116vSGqqpPvcQF5.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/OqDu94iXYPc56GGhpIMpJNaLoVXvXVNzP188BN3Q.png\"><\/p>", "", ""], "r": "B", "e": "<p>【解析】封闭区域数量每行依次为1、2、3； 2、0、2； 1、1、（2）。每行前两个图形的封闭区域数之和等于第三个图形封闭区域数，故答案选择B。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46358", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/BGsaNhMxPnWUBc5SujhrIsuja7WmDaF21SbUKh9r.png\"><\/p>", "a": ["<p>①②③，④⑤⑥<\/p>", "<p>①⑤⑥，②③④<\/p>", "<p>①②⑤，③④⑥<\/p>", "<p>①②④，③⑤⑥<\/p>", "", ""], "r": "B", "e": "<p>【解析】①⑤⑥的部分数为2；②③④的部分数为1。<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46359", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/H9s3V22RecFpf4xdokTzEMl0GF9M0thk7jrlWe3y.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/afWYB8r3QIcb8j07017SruyJTwx7TA6v1SoWonGi.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/1X9alTL8HsVg3apUNt56Xn4gNbGyfGeTs42L5L0J.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/WOKfEK9jEiMw83FHiZGXW8dCQv0hfpgONe824J3Q.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/mHJd19LqCjNegE8lQUFUKa1166L7DBG08E43SqkQ.png\"><\/p>", "", ""], "r": "C", "e": "<p>【解析】图形均由两种小元素组成，考虑数元素的数量。五角星数量分别为5、4、3、2、？，小黑点数量分别为1、2、3、4、？，则？处应该为1个五角星，5个小黑点。故正确答案为C。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46360", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/YS1T1D3uJqgsd2S9BCl1J2I9qE8FfqNkThiiqSyX.png\"><\/p>", "a": ["<p>①②④，③⑤⑥<\/p>", "<p>①②⑤，③④⑥<\/p>", "<p>①③④，②⑤⑥<\/p>", "<p>①③⑤，②④⑥<\/p>", "", ""], "r": "C", "e": "<p>【解析】①③④有竖直对称轴，②⑤⑥有水平对称轴。故答案选择C。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46361", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/baDnDDEYATURNlokBMWYh13mK8IVTOviOFEFIFlb.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/g0VS1YjPxubmyZowmOWhbwakhAyIgSNvB2EQe5b3.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/4iSWhzMG2NhtlYG8uaGcIuqZ5cKtoGKRiOFraaE8.png\"><\/p>", "<p><br><img src=\"https://dati.gwzpks.com/uploads/20260717/wYdl2NqcDb1w0Ux6RxmooZJvNnuoGuoDsufkVxMU.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/8PVfSTrGrBx7Lu6vZQZOWdrPqsPviSC4E7QDPj6B.png\"><\/p>", "", ""], "r": "D", "e": "【解析】第一组图形对称轴数量为3、4、1，总量为8；第二组图形对称轴数量为（1）、3、4，总量为8。故答案选择D。", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46362", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/3QBlcfDQJn8z3nruHNpoqOiMOyQ33UIM3RThngq7.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/SZREtsZ0pFFmXktWYMp0Ti9ntRYXwI3gIjfBdn0I.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/38QOn5OvzYo3MKacqIuLrv7VRlDoWuJD2Rph2U94.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/AvhXF3VdTpzHRd5LvsV6XvtX8i4pbD94m06flNFo.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ZVA2CuDFJ372x6bZk1c73PgzO5UDWcIxEtLXTqlR.png\"><\/p>", "", ""], "r": "B", "e": "<p>【解析】图形中的直角数分别为1、2、3、4、5、（6），选B。此处仅看单个角，D项左下的直角分成了 2个角，不计算在内。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46363", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/PPuEYpgykjBinJenBwQmOzo9Cmht6Wfkx4XisEOo.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/frUqdF1ctXTmD7A0hCPx0eXizWyEOJphmpL3IMe4.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/hp7bh2xOP3AbNJu0C9LbKTmWGpDn3XOE5G6QtFPs.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/p1GIFSV089VxEFI2XO39mdK94qa7VkodESYIcnpX.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/p73Iqv8Rb7TxDtOXbrpi3Hue2sQuSCq4zzLCRal5.png\"><\/p>", "", ""], "r": "D", "e": "<p>【解析】元素组成不同，且无明显属性规律，考虑数量规律。题干图形出现日字变形、出头端点、月亮等笔画数的特征图，考虑笔画数。九宫格优先横看，前两行图形笔画数均为：1、2、3，第三行图形笔画数为：1、2、？，所以“？”处应该填入笔画数为3的图形，只有D项符合。故正确答案为D。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46364", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/JKBm3yaSmJkZcMkRr3GpSAR9obyFnVkmGUJViyyh.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/M4eZqsp3NB5XOTikf6zJQ7zX2ROwLIPSavZvq5df.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ZUD2mkthIIYehVhbQvDyviNdx71Eh2zXayXAZKxR.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2MeW3IIooqsZRZG1VP1uJybJ9pK5CGAFQlzPmYdW.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/A6uoOb3WVzDWHuoghVd16XmkAOtO9V7hPfIyG82v.png\"><\/p>", "", ""], "r": "C", "e": "<p>【解析】元素组成不同，且无属性规律，优先考虑数量规律。观察发现题干出现了日字变形图，考虑数笔画。第一组图均为一笔画图形，第二组图形前两幅图为两笔画图形，故问号处选择两笔画的图形，只有C项符合。故正确答案为C。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46365", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Drb8PwZQvyqB7dd5AMDY69JJTF8GZ4LF3L4EQK3S.png\"><\/p>", "a": ["<p>①②⑤，③④⑥<\/p>", "<p>①③⑤，②④⑥<\/p>", "<p>①④⑥，②③⑤<\/p>", "<p>①②⑥，③④⑤<\/p>", "", ""], "r": "C", "e": "<p>【解析】判断题型-------本题题干中自身特点非常明显，首先考虑找共性。①④⑥中均包含封闭区间，②③⑤中均不包含封闭区间。故本题选 C。<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46366", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ZlQya5zEyDayuz2yR2eN7kX6RDlk2Xg67a0s6v7S.png\"><\/p>", "a": ["<p>①④⑥，②③⑤<\/p>", "<p>①③⑥，②④⑤<\/p>", "<p>①②③，④⑤⑥<\/p>", "<p>①②④，③⑤⑥<\/p>", "", ""], "r": "C", "e": "<p>【解析】判断题型-------本题题干中有汉字，常考考点有结构、封闭区间、笔画等。考查汉字的封闭区域数。①②③中封闭空间均为 2，④⑤⑥中封闭空间均为 3。故本题选 C。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46367", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/OgpHYJyWYO04fKWAqMNAwQGxcDJTyINyA7NRZ99q.png\"><\/p>", "a": ["<p>①③⑥，②④⑤<\/p>", "<p>①③④，②⑤⑥<\/p>", "<p>①②③，④⑤⑥<\/p>", "<p>①③⑤，②④⑥<\/p>", "", ""], "r": "B", "e": "<p>【解析】判断题型-------本题题干图形相似，优先考虑位置关系。本题考查位置关系。本题考查小圆圈在三角形顶点处的位置变化。①③④圆的位置挨在三角形中最大的角，②⑤⑥圆的位置挨在三角形的最小的角。故本题选 B。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46368", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2AeIrU0NAKLDFjKJO6zHit4SaTNbqQswFGPDP0D0.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ZaHiA9HskLa6QsC6HBD1sOOHWLEy8Ip6uiyE08Is.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/PRFC3Fd7NRoyCDUtVsm2aF2dEjcQGl6GBVgm35bR.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/7437DWw73IJSCxL18yRBGFTBmiSaIhXgN1aXkj2n.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/zVF8g1l8iIKoBK3HN9biK8coKVKXMTtbSG56MaoO.png\"><\/p>", "", ""], "r": "C", "e": "<p>【解析】第一组前两个图形叠加，遵循黑+白=黑、黑+黑=白、白+白=白、白+黑=黑的规律，得到第三个图形；第二组图形按照此规律进行叠加，得到C项图形。<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46369", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/9XhoJLssMDjzLL0F48mXU6A3hd7WuVZmiNSv4tim.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/jPOCy6nm1330HjSo0Cp3NRkQcmZYWuXkytLqXNol.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Z4M302UBBaNjdCC57CcXCToawccwcnZwboiRtnqV.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/O0kh7xsYxgKRfbwScktlBHDVKrAhQtXU39lh6ZSq.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Ksh48CDhPbeUOJDeJpe0POZMf0B0ePM9OoB9monH.png\"><\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2qiRYKRswx0qcLkT0kMxINzfrWCXsC3hxvS7hrMd.png\"><\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46370", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/KWp28zAFlgPkDqh76vIoR27UXXMlmfndi75IkHzv.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/I7gdQpKcCijQqvoOJyy3sj6KENKBXnu5jG7KPafi.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/M4yFl3wFbI5agVQyecvS9ZNx7j9EybFO0QBemFoA.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/6WeA2dj3S7sRrMwKr7g58zSZ1hnfbWqV0a8E72TJ.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ckhQ9BEeAQ8SOTYf9hOEzMwmObqYAuYV8vHhMMUA.png\"><\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/cuKTpI8Qa95EWWbgDZasAP4gB4XFfin9BIDLK5tm.png\"><\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46371", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/d3P71Dts6alHriaHvVi3tY8ScxrpBw3XedblEqbP.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/5Jpd1lBvVHzFrKR0G9Wir2MhVkF8VrTiYrsi3QBt.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/8dFQJfhxwCFYYLMIZFhGLOE7KPkHeYpgcQCBGudd.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/AzEGCePcHEL0dA8pSS3JbXjs9Z27m6TYwi4HZxGA.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/HU9ymQU8DSI6Z3OyTxG013hVTg6bgyAuUEZgKcDP.png\"><\/p>", "", ""], "r": "A", "e": "<p>【解析】第一组中大图形内部有一个小三角形，第二组中大图形外部有一个半圆。答案选A项。&nbsp;<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}, {"id": "46372", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/qD8ZXIKGz9UUNOoKj6g3GjQniBlEmvJSKYMFLS9R.png\"><\/p>", "a": ["<p>①④⑤，②③⑥<\/p>", "<p>①④⑥，②③⑤<\/p>", "<p>①②⑥，③④⑤<\/p>", "<p>①③④，②⑤⑥<\/p>", "", ""], "r": "C", "e": "<p>【解析】判断题型-------本题题干图形相异，优先考虑数数量、一笔画、连接形式等；最后考虑找共性。本题考查图形连接形式。①②⑥图形连接形式为线连，③④⑤图形连接形式为点连。故本题选 C。<\/p>", "l3": "一般能力", "l4": "2.1节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||2.2节", "n": "一般能力 / 2.2节", "qs": [{"id": "46373", "t": 1, "q": "南辕北辙：声东击西；（     ）。", "a": ["短斤少两：指桑骂槐", "缺衣少食：东拼西凑", "穷途末路：指鹿为马", "朝发夕至：欺上瞒下", "", ""], "r": "D", "e": "【解析】题干中这两个成语不存在内容上的属性关系，就得从形式上去考量，  题干成语第一层是并列结构，“南辕”“北辙”是偏正结构，“声东”“击西”是动宾结构。且“南”和“北”、“东”和“西”相对；D项成语结构与题干最类似，且“朝”和“夕”、“上”和“下”相对。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46374", "t": 1, "q": "烟锁池塘柳：金木水火土；（     ）。", "a": ["皓月：乾坤", "氧化：人气", "四书五经：甲乙丙丁", "雾罩黄山松：东南西北中", "", ""], "r": "B", "e": "【解析】此题横向和纵向都有规律，横向的前一个词组的每一个字的偏旁在后一组中再现，而纵向的规律在于AD项是对仗严整声韵铿锵的对联，考生容易先入为主地选D。应该先考虑横向的规律，只有B选项符合规律。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46375", "t": 1, "q": "罗曼蒂克：浪漫；（     ）。", "a": ["博客：网络日志", "洗手间：厕所", "一级棒：顶好", "厚道：老实", "", ""], "r": "A", "e": "【解析】浪漫的英语是romantic，音译为罗曼蒂克；网络日志的英语是blog，音译是博客。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46376", "t": 1, "q": "岩石：矿物：成份；（     ）。", "a": ["森林：树木：木材", "粘土：沙子：石头", "器官：组织：功能", "酒精：饮料：果汁", "", ""], "r": "C", "e": "【解析】岩石由矿物构成，具有不同的成份；器官由组织构成，具有不同的功能。ABD最后一个词都是实物，与题干不符。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46377", "t": 1, "q": "秋天：季节；（     ）。", "a": ["中国人：外国人", "名人：英雄", "将军：职业", "节约：品德", "", ""], "r": "D", "e": "【解析】秋天是季节中的一个，节约是品德中的一种。C项将军是军衔中的一种，将军的职业是军人。所以正确答案选D。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46378", "t": 1, "q": "地球：行星；（     ）。", "a": ["春节：节日", "春天：天气", "地理：地质", "太阳：银河", "", ""], "r": "A", "e": "【解析】题干为属与种的关系，地球是行星中的一个，春节是节日中的一个。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46379", "t": 1, "q": "（     ）对于 原子 相当于 车轮 对于（     ）。", "a": ["夸克——气缸", "库仑——车速", "电子——汽车", "核能——火车", "", ""], "r": "C", "e": "【解析】本题考查的是组成关系。电子是原子的组成部分，车轮是汽车的组成部分。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46380", "t": 1, "q": "围湖造田：饮鸩止渴；（     ）。", "a": ["卧薪尝胆：学以致用", "忍辱偷生：削足适履", "兢兢业业：刻苦奋进", "山穷水尽：柳暗花明", "", ""], "r": "B", "e": "【解析】题干成语都是并列结构的成语，其中“围湖”、“造田”、“饮鸩”、“止渴”都是动宾结构的词语，且“围湖”是为了“造田”，“饮鸩”是为了“止渴”，只有B项符合。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46381", "t": 1, "q": "（     ）对于知识 相当于 分析对于（     ）。", "a": ["<p>书本 理论<\/p>", "<p>学习 结论<\/p>", "<p>学问 研究<\/p>", "<p>学生 研究员<\/p>", "", ""], "r": "B", "e": "<p>【解析】学习可以得到知识，分析可以得到结论。学习知识和分析结论是主谓结构并且有因果和顺承关系。<\/p>", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46382", "t": 1, "q": "臭氧层∶气候变暖；（     ）。", "a": ["偷猎∶物种灭绝", "森林∶水土流失", "干旱∶土地沙化", "酸雨∶水源污染", "", ""], "r": "B", "e": "【解析】本题考查的是对应关系。臭氧层遭到破坏会加剧气候变暖，森林遭到破坏会加剧水土流失。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46383", "t": 1, "q": "学校：大学：北京大学；（     ）。", "a": ["工业：重工业：钢铁", "工艺：手工艺：玉器", "军事：军队：海军", "建筑物：桥梁：赵州桥", "", ""], "r": "D", "e": "【解析】北京大学是大学中的一个，大学是学校中的一类；同理，赵州桥是桥梁中的一个，桥梁是建筑物中的一类。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46384", "t": 1, "q": "枕头：卧具；（     ）。", "a": ["铅笔：工具", "地球：宇宙", "宣纸：文具", "车厢：火车", "", ""], "r": "C", "e": "【解析】枕头是卧具的一种，宣纸是文具的一种。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46385", "t": 1, "q": "温度计：水银；（     ）。", "a": ["<p>发动机：汽油<\/p>", "<p>热水器：水<\/p>", "<p>衣服：扣子<\/p>", "<p>蓄电池：硫酸<\/p>", "", ""], "r": "D", "e": "<p>【解析】题干逻辑：水银是温度计的内部工作介质，是发挥测温功能的核心填充物**，二者为**物品与其内部液态工作物质**的对应关系。<br>A. 发动机：汽油 → 汽油是燃料，在发动机外部加注、燃烧供给动力，不是装在发动机内部的介质，排除。<br>B. 热水器：水 → 水是被加热的对象，不是热水器内部用来实现加热功能的介质，排除。<br>C. 衣服：扣子 → 扣子是衣服的组成配件，固体零部件，不是介质，排除。<br>D. 蓄电池：硫酸 → 硫酸是蓄电池内部的电解液，是实现储放电功能的核心液态介质，和题干逻辑一致。<\/p>", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46386", "t": 1, "q": "东北虎：熊猫：哺乳动物；（     ）。", "a": ["绘画：国画：才能", "音高：音色：音乐", "销售：销售人员：销售渠道", "老挝语：阿尔及利亚语：语言", "", ""], "r": "D", "e": "【解析】题干关系为：前两个词并列关系，同属于第三个词的一种类型。根据这种关系，老挝语和阿尔及利亚语是并列关系，都是语言的一种，因此选择D项。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46387", "t": 1, "q": "军人：教授；（     ）。", "a": ["音乐：歌曲", "农村：城市", "江河：湖泊", "商人：江苏人", "", ""], "r": "D", "e": "【解析】题干为交叉关系，教授有可能是军人，也有可能不是军人。符合这一关系的为选项D。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46388", "t": 1, "q": "旗舰店∶商店；（     ）。", "a": ["黄金水道∶航线", "劳力士∶钟表", "总统套房∶标间", "金刚钻∶瓷器", "", ""], "r": "A", "e": "【解析】本题考查的是种属关系。旗舰店是商店的一种，是最高级别的商店。黄金水道是航线的一种，是最高级别的海运航线。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46389", "t": 1, "q": "军人：医生：军医；（     ）。", "a": ["司机：警察：交警", "舞蹈：说唱：二人转", "学科：研究：科研", "汽车：电动车：电动汽车", "", ""], "r": "D", "e": "【解析】考查的是交叉关系和种属关系。军人和医生是交叉关系，军医既是军人又是医生；汽车和电动车是交叉关系，电动汽车既是汽车又是电动车。因此选D。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46390", "t": 1, "q": "（     ）对于 感时花溅泪 相当于 高兴 对于（     ）。", "a": ["伤心；含情杏花喜", "哀伤；一日看尽长安花", "多情；化作春泥更护花", "憔悴；人比黄花瘦", "", ""], "r": "B", "e": "【解析】花鸟本为娱人之物，但因感时恨别，却使诗人见了反而堕泪惊心。表现的是诗人一种哀伤之情。“春风得意马蹄疾，一日看尽长安花”出自诗人孟郊《登科后》，两句写诗人考中进士后的兴奋和得意。在这得意的日子里，趁着和煦的春风，骑着快马，一天的工夫，就赏尽了京都长安所有的鲜花美景。诗句活灵活现地描绘出诗人神采飞扬的得意之态，酣畅淋漓地抒发了他忘乎所以的喜悦心情。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46391", "t": 1, "q": "中秋节：月饼：团圆；（     ）。", "a": ["圣诞节：圣诞老人：礼物", "清明节：扫墓：踏青", "情人节：巧克力：约会", "重阳节：菊花酒：敬老", "", ""], "r": "D", "e": "【解析】考查的是对应关系。中秋节对应的是食品有月饼，该节日寓意是团圆的日子；重阳节对应的食品是菊花酒，该节日寓意是敬老的日子。因此选D。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46392", "t": 1, "q": "政通：人和；（     ）。", "a": ["狼奔：豕突", "国富：民强", "阳奉：阴违", "门当：户对", "", ""], "r": "B", "e": "【解析】政通、人和是并列结构，其中各自内部又构成主谓结构，选项B符合此关系。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46393", "t": 1, "q": "有氧运动：燃烧脂肪；（     ）。", "a": ["网络文学：文化入侵", "光速飞行：钟慢尺缩", "克隆技术：基因重组", "行业垄断：通货膨胀", "", ""], "r": "B", "e": "【解析】“有氧运动”会导致“燃烧脂肪”，“光速飞行”会导致“钟慢尺缩”。所以正确答案选B。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46394", "t": 1, "q": "长城：中国：古迹；（     ）。", "a": ["开发商：银行：金融", "教室：学生：专家", "茶杯：茶壶：茶叶", "大脑：人体：器官", "", ""], "r": "D", "e": "【解析】题干中的关系可以理解为长城是中国的古迹，符合这种排列关系的是选项D，其可以看作大脑是人体的器官。所以正确答案选D。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46395", "t": 1, "q": "（     ）对于“虚心使人进步，骄傲使人落后”相当于“有志者事竟成”对于（     ）。", "a": ["皇天不负有心人——失败是成功之母", "吃一堑，长一智——打破砂锅问到底", "先天下之忧而忧，后天下之乐而乐——世界上怕就怕“认真”二字", "满招损，谦受益——天下无难事，只怕有心人", "", ""], "r": "D", "e": "【解析】“满招损，谦受益”与“虚心使人进步，骄傲使人落后”意思相近。 “天下无难事，只怕有心人”与“有志者事竟成”意思相近，故选D。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46396", "t": 1, "q": "剪子对于（     ）相当于（     ）对于秒表。", "a": ["指甲，赛跑", "厨刀，卷尺", "剪纸，计时", "理发师，裁判", "", ""], "r": "B", "e": "【解析】考查的是并列关系。剪子和厨刀都是一种刀具，卷尺和秒表都是一种量具。因此选B。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46397", "t": 1, "q": "比赛：裁判；（     ）。", "a": ["歌唱：指挥", "诉讼：法官", "驾驶：司机", "考试：监考", "", ""], "r": "B", "e": "【解析】考查的是对应关系。在比赛中，裁判是根据规则判断胜负。在诉讼中，法官根据法律判定输赢。因此选B。A项歌唱里面未必有指挥，D项里考试应该对应监考人员，而不是监考。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46398", "t": 1, "q": "红茶：发酵：保健；（     ）。", "a": ["丝绸：染色：收藏", "石油：蒸馏：燃烧", "中药：采摘：治病", "玉镯：磨制：装饰", "", ""], "r": "D", "e": "【解析】红茶是通过茶叶发酵并且具有保健的功效，玉镯是通过玉石磨制具有装饰的功效。注意C选项中药不是通过采摘应该是后续加工过程，比如熬制等，故答案选D。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46399", "t": 1, "q": "妈妈∶舅舅∶外婆；（     ）。", "a": ["姑姑∶叔叔∶奶奶", "侄女∶外甥∶外孙", "舅妈∶婶婶∶姨夫", "表妹∶堂弟∶姐姐", "", ""], "r": "A", "e": "【解析】本题考查的是并列关系。妈妈和舅舅是兄妹，他们的母亲是外婆，都是长辈；姑姑和叔叔是兄妹，他们的母亲是奶奶，也是长辈。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46400", "t": 1, "q": "信件：邮箱：邮递员；（     ）。", "a": ["学校：教室：教师", "垃圾：垃圾桶：清洁工", "顾客：服装店：店长", "铅笔：卷笔刀：学生", "", ""], "r": "B", "e": "【解析】题干信息，信件是被投放在邮箱里面，邮递员从邮箱中提取信件。选项B，垃圾被投放在垃圾桶，清洁工从垃圾桶清理垃圾。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46401", "t": 1, "q": "安居乐业：颠沛流离；（     ）。", "a": ["吸收：放弃", "简单：杂乱", "雪中送炭：雪上加霜", "巧夺天工：鬼斧神工", "", ""], "r": "C", "e": "【解析】先看内容，题干两词为反义词，这样排除了B.D项，再从形式上去甄别，C项均为成语，与题干吻合。故排A选C。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46402", "t": 1, "q": "乐谱  对于  （     ）  相当于  （     ）  对于  分类。", "a": ["钢琴：归类", "谱曲：信息", "五线谱：商品", "演奏：标准", "", ""], "r": "D", "e": "【解析】将选项一一代入括号内，选项代入，逻辑关系为根据乐谱来演奏，根据标准来分类。符合，所以选D。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46403", "t": 1, "q": "陆离斑驳：红色；（     ）。", "a": ["重峦叠嶂：泰山", "一望无际：草原", "咫尺天涯：距离", "沧海一粟：渺小", "", ""], "r": "A", "e": "【解析】陆离斑驳形容色彩繁杂、斑斓绚丽，红色是色彩中的一种。A项，重峦叠嶂形容山峰一个接着一个，连绵不断，泰山是山峰中的一座，与题干相符。B项，一望无际形容非常辽阔，可用来形容草原，与题干不相符。C项，咫尺天涯比喻距离虽近但很难相见，周来形容距离，与题干不相符。D项，沧海一粟比喻非常渺小，微不足道，形容事物渺小，与题干不相符。故本题选A。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46404", "t": 1, "q": "宫殿：富丽堂皇；（     ）。", "a": [".游客：琳琅满目", "寺庙：晨钟暮鼓", "学校：言传身教", "酒店：珍馐美味", "", ""], "r": "B", "e": "【解析】富丽堂皇多用来形容建筑，因此可以形容宫殿。A项，琳琅满目形容美好的事物很多，不能用来形容游客。B项，晨钟暮鼓指寺庙中早晚报时的钟鼓声，可以形容寺庙。C项，言传身教指行动起模范作用，可用来形容教师，但不能形容学校。D项，珍保美 味形容美味的食品，不能用来形容酒店。故本题选B。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46405", "t": 1, "q": "司机：女人；（     ）。", "a": ["<p>医院：医生<\/p>", "<p>长江：黄河<\/p>", "<p>作家：青年<\/p>", "<p>警察：刑警<\/p>", "", ""], "r": "C", "e": "<p>【解析】分析题干逻辑，司机：女人二者是交叉关系：有的司机是女人，有的女人是司机，两个分类维度不同（职业/性别），存在重叠人群。第二步：逐一分析选项A.医院：医生：地点与职业的对应关系，不是交叉，排除。B.长江：黄河<br>两条并列的河流，并列关系，排除。 C.作家：青年，交叉关系：有的作家是青年，有的青年是作家（职业/年龄两种分类），和题干逻辑一致。D.警察：刑警，种属关系，刑警属于警察的一种，排除。<\/p>", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46406", "t": 1, "q": "异口同声：众说纷纭；（     ）。", "a": ["急功近利：急于求成", "高瞻远瞩：鼠目寸光", "不求甚解：囫囵吞枣", "前呼后拥：东倒西歪", "", ""], "r": "B", "e": "【解析】题干中“异口同声”和“众说纷纭”互为反义词。“高瞻远瞩”和“鼠 目寸光”互为反义词，与题干相符。“急功近利”和“急于求成”、“不求甚解”和“回囹吞 枣”互为近义词，排除A、C两项。“前呼后拥”和“东倒西歪”与题干对应关系不符，排 除D项。故本题选B。", "l3": "一般能力", "l4": "2.2节", "ap": [false, false, false, false, false, false]}, {"id": "46407", "t": 1, "q": "总价：单价：数量；（     ）。", "a": ["密度：质量：体积", "溶质：溶液：浓度", "时间：路程：速度"
