蠕虫病毒的代码发给了一些反病毒厂商，后者确认该病毒具备在手机之间传播的功能。\n该段文字作为一则报纸上的新闻，最适合做该段文字题目的是（     ）。", "a": ["“卡比尔”蠕虫病毒在俄诞生", "29A的国际病毒编写小组的新贡献", "世界首例在手机之间传播的病毒诞生", "反病毒厂商确认手机之间可传播病毒", "", ""], "r": "C", "e": "【解析】提问已经表明是新闻体裁，因此直接看第一句导语部分。导语主要陈述的信息为俄罗斯一个小组制造出了第一个可在手机之间传播的病毒。对应导语陈述的主要信息判定选项，C项表述信息最为接近，因此对应选择C项。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}, {"id": "46127", "t": 1, "q": "拥有120年历史的道琼斯通讯社宣布，聘请新华在线在中国独家代理其信息产品。这意味着，今后国内新闻媒体和政府机构同步使用道琼斯中文语言财经消息、评论成为可能。据悉，道琼斯通讯社以其独立、领先的财经新闻闻名于世，每24小时发布8000多则市场消息。此次，新华在线专门推出“引擎计划”，为道琼斯服务中国本土开路。它还入乡随俗，接受国内个别用户的财经信息服务要求。\n最适合做上面一段新闻标题的是（     ）。", "a": ["道琼斯通讯社大力拓展中国市场", "道琼斯通讯社以其独立、快捷的信息赢得了中国的市场", "道琼斯通讯社以其独特的服务和本土化的战略满足用户的信息需求", "新华在线为道琼斯代理信息发布", "", ""], "r": "D", "e": "【解析】根据设问我们知道这是一道典型的标题填入题，重点把握文段的首句：“拥有120年历史的道琼斯通讯社宣布，聘请新华在线在中国独家代理其信息产品”。首句当中的新闻重点在于道琼斯宣布的内容，即新华在线为道琼斯在中国的独家代理，对应D选项。A选项、B选项、C选项都没有提及首句当中的重要主体“新华在线”，只涉及了“道琼斯”，表述片面，均排除。", "l3": "一般能力", "l4": "1.5节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.6节", "n": "一般能力 / 1.6节", "qs": [{"id": "46128", "t": 1, "q": "房子是用来住的，不是用来炒的。从理论上说，买房不是刚需，居住才是刚需。但为何“宁买房不租房”?这说到底还是因为权利：人们不仅在买“产”，也在买“权”。对物权之上的受教育权、养老保障、医疗等权利的需求，有时比居住本身还强烈。越是人口流动大、业态更新快的城市，这个问题越紧迫。以租购同权为特色的房屋租赁市场改革，正是抓住了这一深层次的需求，尝试实现租屋供给不足和租屋赋权不足的双重解铃。\n这段文字中“这个问题”指的是（     ）。", "a": ["租屋供给不足的状况普遍存在", "房价超出许多刚需的购买能力", "对物权之上各项权利需求强烈", "房子长期以来被视为增值手段", "", ""], "r": "C", "e": "【解析】“这个问题”出现在文段中间。观察前文可知，文段首先指出从理论上讲， “居住才是刚需”，并提出为何不租房的问题。随后指出是“因为权利”，即“对物权之上的受教育权、养老保障、医疗等权利的需求，有时比居住本身还强烈”。故“这个问题”指代前文对物权之上的权利的需求，对应C 项。\nA项：“租屋供给不足”对应尾句，在“这个问题”之后，非其指代内容，排除。\nB 项：“房价超出许多刚需的购买能力”文段未提及，无中生有，排除。\nD 项：“被视为增值手段”对应首句“房子是用来住的，不是用来炒的”，是“这个问题”之前存在的客观情况，并非“这个问题”本身，排除。\n故正确答案为C.", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46129", "t": 1, "q": "<p>VR技术是Virtual Reality (虚拟现实技术)的英文缩写，近年来，我国的VR技术不断发展，并在医疗、教育、智能制造等行业中得到广泛的运用。5G 网络会大大提升虚拟现实体验的仿真度、沉浸感和交互性，这将促进虚拟现实产业的进一步发展。文末画横线的“这”指的是（ ）。<\/p>", "a": ["<p>中国 VR技术的不断发展<\/p>", "<p>VR 技术在各行各业中的运用<\/p>", "<p>5G 网络所带来的更完美感受<\/p>", "<p>5G 网络商用范围的扩大<\/p>", "", ""], "r": "C", "e": "【解析】根据提问方式可知，本题为词句理解题，应定位代词“这”的位置。“这” 在文段尾句中，应去前文查找其指代的内容。文段开篇引入VR 技术即虚拟现实技术这一话题，并介绍了VR技术在我国的发展和应用，然后指出5G网络可给虚拟现实体验带来更好的感受，再结合“这将促进虚拟现实产业的进一步发展”，故能促进虚拟现实产业进一步发展的应当是“5G 网络所带来的更完美感受”，对应C 项。\nA 、B两项：都是引入话题之后背景铺垫的内容，且后文“促进虚拟现实产业的 进一步发展”强调的是5G 对虚拟现实产业的促进作用，两项均没有提到文段核心话 题 5G， 排除\nD 项：文段并没有提及“5G 网络商用范围”，属于无中生有，排除。\n故正确答案为 C", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46130", "t": 1, "q": "<p>跟石头和金属相比，木质砧板从表面上看也是硬邦邦一块，可“内心”柔软，内部的植物纤维虽紧密排列，但仍有很多细微的空隙。 <span style=\"text-decoration: underline;\">这使它在受到剧烈冲击时，内部结构发生弹性微调<\/span>，既能避免与刀刃硬碰硬伤及刃口，又能吸收一部分冲击力，不会让刀刃在接触板面的一刹那，由于反弹力过大而“剑走偏锋”发生侧滑，这在连续切割，比如剁馅、切丝时尤为明显。 画横线句子中的“这”指的是木质砧板的（ ）。<\/p>", "a": ["<p>外观形态<\/p>", "<p>材料来源<\/p>", "<p>制作工艺<\/p>", "<p>结构特点<\/p>", "", ""], "r": "D", "e": "【解析】“这”指代的是“这”之前的内容，阅读前文可知，文段通过对比，引出了木质砧板的结构特点，即表面上是硬邦邦的，内部的植物纤维虽紧密排列，但仍有很多细微的空隙，对应D 项。\nA 项：表述片面，未包含“内部”，排除。\nB.C 两项：文段并未提到“材料来源”和“制作工艺”，均排除。\n故正确答案为D.", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46131", "t": 1, "q": "古代有位李姓博州太守为官极其廉洁。一天，他在烛光下办公，有人送来家书。他当即灭掉公家蜡烛，点起自家蜡烛。“公烛之下，不展家书”， 成为公私分明、严于律己的生动写照。现实中，有的人常在公私之间安装“旋转门”，公私不分。克己奉公，严以修身、俭以养德，光明正大、堂堂正正，这才是人间正道。\n在这段文字中，安装“旋转门”所反映的问题实质是（     ）。", "a": ["界限模糊", "标准不一", "职能错位", "权责不明", "", ""], "r": "A", "e": "【解析】文段首先通过李姓博州太守的事例引出公私分明的话题，强调其公事和私事的界限分得十分清楚。紧接着引出“现实中，有的人常在公私之间安装‘旋转门’，公私不分”。根据文段可知，“旋转门”使公私不分，也就是模糊了公与私之间的界限。故安装“旋转门”所反映的问题实质就是一些人模糊了公事和私事的界限对应A 项。\nB 项：“标准不一”指对待不同的事情有不同的标准，文段并未提及“标准”，无中生有，排除。\nC 项：“职能错位”指政府内部发生的职能混乱现象，文段并未提及“职能”，无中生有，排除。\nD 项：“权责不明”指权力和职责不明确，而文段反映的问题是公事和私事的界限分不清，并未提及“权责”，无中生有，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46132", "t": 1, "q": "以玩家年龄为依据分别匹配适合的网游，丰富了未成年人网络游戏保护的方式和手段。对于孩子来说，自己适合玩什么网游“被安排得明明白白”，玩得更安全。对家长来说，可以更明晰地评估一款网游适不适合孩子，管得更放心。“心情复杂”的，当属游戏企业。适龄提示规定的使用要求和场景，都与游戏企业直接相关。标识必须足够醒目，让玩家看得着、看得懂，对游戏企业是硬性要求，对那些靠打擦边球等手段吸引玩家的网游企业、网游产品，更是一种敲打。但这种“束缚”是必须的，因为保护未成年人是包括游戏企业在内的所有市场主体都必须遵守的规范，也是必须承担的社会责任。\n文中的“束缚”最可能指的是（     ）。", "a": ["下架不适宜未成年人的网络游戏", "控制游戏在线时段和时长，防止未成年人沉迷", "对网络游戏按照适合年龄进行分级并加以标识", "相关部门对游戏产品采取更加严格的审核措施", "", ""], "r": "C", "e": "【解析】“束缚”出现在文段尾句，并由指代词“这种”引导，故应从前文找指代对象。文段首句介绍以玩家年龄为依据匹配适合的网游丰富了未成年人网络游戏保护的方式和手段。接下来从“孩子”和“家长”两个角度指出了这样做的好处。紧接着引出了游戏企业需要对适龄提示规定的使用要求和场景加以标识。尾句出现“这种 ‘束缚’”。故“束缚”指代的对象是对适龄提示规定的使用要求和场景加以标识，对应C项。\nA 、B 、D三 项 ：A 项“下架不适宜未成年人的网络游戏”、B 项“控制游戏在线时段和时长”、D 项“相关部门对游戏产品采取更加严格的审核措施”文段均未提及无中生有，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46133", "t": 1, "q": "“风筝不断线”是吴冠中上世纪80年代前后提出的艺术理念，在中国当代美术史上产生了重要的影响。看上去，这是关于“形式美”与“抽象美”之间内在联系的一种阐述，实则它强调的是：艺术创作再怎么创新，再怎么放飞自我，都不能远离现实生活。在吴冠中看来，抽象绘画就像放风筝，风筝是作品，是“从生活中来的素材和感受，被作者用减法、除法或别的法”抽象成的某一种艺术形式，而观众是天空。要让风筝飞上天空，艺术家手中“须有一线联系着作品与生活中的源头”。只有“风筝不断线”，艺术才有根基，才能保持与观众的交流。\n下列观点符合“风筝不断线”理念的是（     ）。", "a": ["艺术来源于生活而高于生活", "艺术的第一目的是再现现实", "艺术创作应当以生活为基础", "艺术离开民众就失去了土壤", "", ""], "r": "C", "e": "【解析】文段开篇引出“风筝不断线”这一理念，说明其看上去是关于“形式美” 与“抽象美”之间内在联系的一种阐述，紧接着通过“实则”着重强调“艺术创作再怎么创新，再怎么放飞自我，都不能远离现实生活”，即艺术创作应以生活为基础。随后以吴冠中的观点为例，进一步说明想要保持与观众的交流，需“风筝不断线”，  即艺术家手中“须有一线联系着作品与生活中的源头”。故“风筝不断线”即指艺术创作应以生活为基础，对应C 项。\nA项：“风筝不断线”所指的理念并非强调“高于生活”，而是“以生活为基础”，与文意不符，排除。\nB 项：文段未提及“艺术的第一目的”，无中生有，排除。\nD 项：文段强调的是“以生活为基础”，而非“民众”，与文意不符，排除。故正确答案为 C。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46134", "t": 1, "q": "当炫耀式旅游成了目的，扎堆往知名景点挤，也就在意料之中，其实旅游作为一种现代的生活方式，可以有多样化的功能。如果是为了教育，可以带孩子去看名山大川、古城遗迹，帮助他们了解国家的历史和文化传统；如果是为了休闲放松，可以去海边、深山，或者就近选择市郊的农家小院，能短暂逃避 尘世喧嚣就好。理性面对旅游目的，寻找合适的度假所在，才是健康的旅游观念，才能更好地享受旅游的快乐。旅游观念转型升级，旅游市场分化，人满为患的现象才可能消失，旅行中的快乐亦会更加醇厚。\n根据这段文字，旅游观念的“转型升级”指的是（     ）。", "a": ["<p>实现多样化的功能<\/p>", "<p>理性面对旅游目的<\/p>", "<p>赋予旅游实际意义<\/p>", "<p>享受旅行中的快乐<\/p>", "", ""], "r": "B", "e": "<p>【解析】旅游观念的“转型升级”出现在文段的尾句，根据前文的内容“理性面对旅游目的，寻找合适的度假所在，才是健康的旅游观念，才能更好地享受旅游的快乐”可知，“转型升级”指的是理性面对旅游目的，对应B 项。 A 项：“实现多样化的功能”是指观念转型升级后产生的良好结果，并非观念的变化，排除。 C 项：“赋予旅游实际意义”无法体现观念的转变，排除。 D 项：“享受旅行中的快乐”仅为多样化功能中的一个方面，表述片面，且不属于观念的转变，排除。 故正确答案为B。<\/p>", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46135", "t": 1, "q": "雨果说：“下水道代表着一个城市的良心。”如今，代表良知的已不只是下水道了。随着现代化和城市化的一路高歌猛进，我们的城市变得更大更美，楼更高、路更宽，但同时城市的“系统”和“软件”也要同步升级、更新换代。没有“系统”“软件”的支撑和运转，没有它们对各种新涌现的安全风险的査杀，城市再美，也是脆弱的。\n根据以上文字，对“系统”“软件”理解最恰当的一项是（     ）。", "a": ["城市基础设施及其日常维护", "城市公共意识的培育", "城市管理体系与制度", "城市管理部门及其工作人员", "", ""], "r": "C", "e": "【解析】“城市变得更大更美，楼更高、路更宽”代表的是城市硬件的提升，与之相对，城市的“软件”也要同步升级、更新换代。A项的“基础设施”属于硬件的范畴，可首先排除。由“它们对各种新涌现的安全风险的査杀”可知，此处的“软件”应与“管理”相关，排除B。\" '系统'和'软件’的同步升级、更新换代”指的不是管理部门和人员的更替，而是管理体系和制度的完善、与时俱进，排除D。本题选C。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46136", "t": 1, "q": "在一项研究中，研究者发现由于关于慢阻肺（慢性阻塞性肺炎）的刻板印象根深蒂固，有可能导致罹患这种疾病的女性患者不能被及时确诊。研究者请192位医生诊断一批中年患者，他们是长期咳嗽以及有吸烟史的男性或女性。在初次检查中，只有49%的女性患者被诊断为慢阻肺，而男性患者则达到了64.6% 的诊断率。随后，研究者提供了指向慢阻肺的医学检验报告，这时诊断率的性别差距缩小了，但仍然没有完全消失。\n文段中“刻板印象”指的是（     ）。", "a": ["女性患慢阻肺疾病的可能性较小", "女性患慢阻肺不容易被诊断", "男性由于吸烟史导致患慢阻肺", "男性慢阻肺很容易被诊断", "", ""], "r": "A", "e": "【解析】本题是一道词语理解题，“刻板印象”一词出现在文段首句。首句说明刻板印象有可能会导致罹患慢阻肺的女性患者不能被及时确诊，后文又通过列举研究数据论述了刻板印象导致的结果，即女性被诊断为慢阻肺的比率明显低于男性，能够导致这种结果的原因为人们具有“女性患慢阻肺疾病的可能性较小”这样的观念，所以“刻板印象”就是指“女性患慢阻肺疾病的可能性较小”，对应A 项。\nB 项：“不容易被诊断”为刻板印象导致的结果，而非刻板印象本身，排除。\nC.D 两项：根据文段首句“刻板印象……有可能导致……女性患者……”可知，\n刻板印象的作用主体为女性，男性患病原因、是否容易被诊断均与女性无关，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46137", "t": 1, "q": "这一切的前提，是旅游目的地的土特产品和旅游纪念品能够满足游客的需求，能够以过硬的品质和服务赢得游客的信任。尽管现在越来越多地方拥有了属于自己的国家标志地理认证产品，可以直接转化为游客购物清单上的旅游纪念品或土特产品，但因为管理等方面的问题，产品质量良莠不齐，甚至假冒伪劣产品横行，这大大压制了游客的购买欲望，也损害了当地旅游市场的形象和信誉。\n文中的“这一切”最可能指代的是（     ）。", "a": ["导游获得游客的信任和喜爱", "地方旅游管理部门要简政放权，开放市场", "售卖旅游纪念品和土特产品的商家能实现盈利", "游客愿意花钱买喜欢的旅游纪念品和土特产品", "", ""], "r": "D", "e": "【解析】“前提”表示事物的先决条件和因素，文段开篇表明“这一切”的先决条件是旅游目的地的土特产品、旅游纪念品能够满足游客的需求，同时以过硬的品质和服务赢得游客信任。故根据话题一致原则，“这”指代的话题应该与“游客的需 求”“游客的信任”有关，并且根据“前提”可反推出“这”指代的内容应该是旅游地的纪念品和土特产品深受游客的欢迎和信赖，对应D 项。\nA 、B 、C 三项：A 项“导游”、B 项“地方旅游管理部门”、C 项“商家能实现盈\n利”均为无中生有，并非“这”指代的内容，排除。\n故正确答案为 D。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46138", "t": 1, "q": "网络时代独有的文化，可以说是一种“新集体文化”。知识之海、观念之海，在每个“集体人”的参与中更显无涯。网站“豆瓣”上，无数网友的标记、评论和打分，形成了影片、书籍、音乐的“豆瓣标准”;网站“知乎”中，许多专业人士分享的知识、经验、见解，形成了对一个问题的多角度考察。而如博客、微博、朋友圈，离开了成千上万用户的参与则会毫无意义。互联网，网聚人的力量；新集体文化，就是网聚每个人的文化。\n上述材料中“新集体文化”指的是（     ）。", "a": ["互联网把来自各行各业的人凝聚起来", "网友在网络上对问题的回答实现了标准化和多样化", "互联网上来自网友群体的各类信息的文化价值", "网友利用网络这个平台自由发表见解的文化现象", "", ""], "r": "D", "e": "【解析】文段首先指出“新集体文化”是网络时代独有的文化，是网友在“知 乎”“豆瓣”等网络平台参与分享、发表见解的一种文化现象，重点在于网友的参与\n并从自己的角度发表看法，对应D 项。\nA 项：凝聚各行业人为互联网的价值，而非文化现象，排除。\nB 项：“标准化”与文段表述相悖，排除。\nC 项：文段并未从“信息的文化价值”的角度进行说明，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46139", "t": 1, "q": "<p>目前新媒体的出版呈现出碎片化、标题化、娱乐化的趋势，内容杂乱，不成体系。这既和新媒体的内容展现方式以及人们的浅阅读习惯有关，同时也是因为新媒体的海量内容要在很短时间内处理，编辑力量跟不上，顾不上精耕细作。一且新媒体结束跑马圈地阶段，腾出手来开始培养自己的编辑队伍，或高薪聘用传统出版业的编辑，那么，<span style=\"text-decoration: underline;\">这种状况<\/span>就会得到改观。 文中画横线部分“这种状况”指的是（ ）。<\/p>", "a": ["<p>新媒体在内容生产方面的问题<\/p>", "<p>人们的浅阅读习惯<\/p>", "<p>新媒体编辑力量不足<\/p>", "<p>海量信息无法得到及时有效处理<\/p>", "", ""], "r": "A", "e": "【解析】文段首句提出问题，即新媒体出版存在的不良现状。接下来分析问题产生的原因。尾句针对问题给出对策。故“这种状况”指的是新媒体在内容方面存在的问题，对应A 项。\nB 、C 、D 三项：均是问题产生的原因，而非问题本身，且表述不够全面，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46140", "t": 1, "q": "“微创新”，这个概念正在成为中国企业尝试的新方向。今天的技术革新在很多时候已经不再是颠覆性的更新换代，任何针对用户体验的微小改变，都可能引爆整个市场。微博就可以看作是在博客基础上的微创新，用140个字拉低了用户门槛，迅速引发了全民微博潮。对于习惯了模仿的企业来说，如何不让微创新成为“山寨”的代名词，是问题的关键，特别是在互联网领域，像团购这样的一窝蜂现象屡见不鲜，然而其中很难看到“微创新”在发挥作用。\n这段文字用“团购”来说明（     ）。", "a": ["<p>盲目从众的现象<\/p>", "<p>更新换代的趋势<\/p>", "<p>复制与模仿的做法<\/p>", "<p>集体相约采购的行为<\/p>", "", ""], "r": "C", "e": "【解析】定位原文，“团购”出现在文段最后一句，分析“团购”的上下文语境。根据“像团购”可知，“团购”是例子，是为了说明“习惯了模仿的企业，存在微创新成为‘山寨’的可能性”。根据“模仿”和“山寨”（“山寨”即复制）可知，“团购”是说明“复制与模仿的做法”。A项：“盲目从众”指别人做什么自己做什么，而文段强调要“创新”。B项：“更新换代”体现的是一种良好趋势，而文段“团购”用来说明不良的现象，感情倾向与文段不符。D项：“集体相约采购的行为”是“团购”一词的本义，不是在文段语境中的意思。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46141", "t": 1, "q": "在中国文化苑内，唐诗与宋词构成一双至美无上的艺术精品，共同构成中国封建时代文化的高峰。人们对这两种文体亦颇多评论。有人认为，唐诗才是真正的艺术，精细而高雅，无论是用词还是构思，皆展示文才与思情；而宋词则或多或少有一种鄙俗的质地，类似于今天的通俗文学。有人认为，宋词才是真正的艺术，做到了雅俗共赏，非诗所能比，“梅须逊雪三分白，雪却输梅一段香”。我则以为二者各有所长，不必作无谓的比较。\n下面对“梅须逊雪三分白，雪却输梅一段香”这句话在文中所要表达的意思，理解最准确的一项是（     ）。", "a": ["唐诗比宋词更有韵味，更有雅正之质", "唐诗与宋词一样，各有所长，各有所短", "宋词比唐诗更有优势，更有广泛的社会性", "唐诗有梅香，宋词有雪白", "", ""], "r": "C", "e": "【解析】“梅须逊雪三分白，雪却输梅一段香”是文段倒数第二句的后半个分句， 结合前半个分句“宋词才是真正的艺术……非诗所能比”可知，整句话是在突出宋词 的较高地位。并且尾句以“则”进行转折提出作者的观点      “二者各有所长”，即 两者地位相同，故转折之前应该体现两者地位不同，突出的是“宋词”的较高地位，\n对应C 项\nA项：文段倒数第二句突出的是“宋词”的地位，而非“唐诗”，语义相悖，排除。\nB 项：对应尾句，是转折之后作者提出的观点，而这句诗在转折之前，与尾句的含义不同，排除。\nD 项：文段引用这句诗是将“唐诗”与“宋词”进行对比，用“梅香”和“雪白”比喻两者的特征，并非强调两者真正有“梅香”和“雪白”，与文意不符，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46142", "t": 1, "q": "《论语》中经常出现“君子”一词。“君子”原意为有地位的人。一国之主被称为君主，一村之长被称为里君。在儒教看来，即便是没有地位，但若是“有德之人”，同样可以成为君子。即便是在野之人，能以国家之责为己任，亦为君子。并且，《论语》中也有多处“君子”既可解释为在位者，也可以解释为有德才之人。\n根据以上文段，对“君子”的理解最准确的是（     ）。", "a": ["有地位的人是“君子”", "“有德之人”是“君子”", "有地位的人和有德之人是“君子”", "在野之人也可以是“君子”", "", ""], "r": "C", "e": "【解析】此题属于词语理解题。前面两个分述点明了君子是“有德之人”、君子能以“国家之责为己任”。转折关键词“并且”再次强调了“君子”既可解释为在位者，也可以解释为有德才之人。也就是说这两种关于“君子”的解释都是正确的。故正确答案为C。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46143", "t": 1, "q": "着汉服等传统服饰一次又一次地“复习”国乐跨界视频，是不少年轻人眼里的古风时尚。近些年古风逐渐被大众了解接受并喜爱。古风文化作为一个圈层文化，尤其在年轻人中间有较大的吸引力。谈到“李某为什么这么火”时，业界普遍认为，除了得益于李某在商业运作上的高超得当，也与古风在时下的流行风潮密不可分。这归根结底是年轻人对传统文化的认同和向往。\n这段文字最后一句话中的“这”指的是（     ）。", "a": ["穿着汉服等传统服饰", "年轻人喜欢并追求古风文化", "李某为什么这么火", "古风对于大众的吸引力", "", ""], "r": "B", "e": "【解析】“这”出现在文段尾句，需要结合前文理解，且应指代前文的重点。文段开篇介绍了当下年轻人眼中的古风时尚，接下来通过程度词“尤其”强调古风文化受年轻人喜欢，并以李某为例进行论证。尾句通过指代词“这”指出古风文化受年轻人喜爱的根本原因。故“这”指代的内容为古风文化受年轻人喜爱，对应B项。A项，穿汉服仅为古风时尚的一种表现，表述片面，且缺少关键词“年轻人”，排除；C项，李某为文段举例部分的内容，并非“这”指代内容，排除；D项，该项强调“对于大众的吸引力”，而文段强调的是对年轻人的吸引力，排除。故正确答案为B。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46144", "t": 1, "q": "据史料记载，从明代永乐年间开始，官窑瓷器上便有落帝王年号款的传统。然而，十五世纪中期，即明代的正统、景泰、天顺时期，帝位更迭频繁，政局动荡，至今未见任何一件有明确纪年的陶瓷器物。由于不书年款，史料记载语焉不详，这三朝的官窑面貌一直模糊不清，被称为中国陶瓷史上的“空白期”或“黑暗期”。\n这段时期之所以被称为“空白期”或“黑暗期”是因为（     ）。", "a": ["瓷器上未落帝王年号款", "帝位更迭频繁，政局动荡", "未有这三朝的陶瓷器物存世", "史料记载语焉不详", "", ""], "r": "A", "e": "【解析】文段开篇介绍背景，从明代永乐年间开始，官窑瓷器有落帝王年号款的传统。随后通过“然而”转折强调，因帝位更迭频繁、政局动荡，明代正统、景泰、天顺三朝的瓷器缺乏明确纪年。接着通过“由于”表示，因为这一时期的瓷器上没有写年款，史料记载模糊，很难明确这三朝瓷器的具体面貌，因此这一时期被称为中国陶瓷史上的“空白期”或“黑暗期”。由此可见，瓷器上没有落帝王年号款直接导致了我们无法准确找到属于这三朝的瓷器，最终造成了这一时期成为了中国陶瓷史上的“空白期”“黑暗期”，对应A项。B项，“帝位更迭频繁，政局动荡”对应转折后面官窑瓷器上不落帝王年号款的原因，并非这段时期被称为“空白期”或“黑暗期”的原因，排除;C项，文段仅论述“未见任何一件有明确纪年的陶瓷器物”，并非“未有这三朝的陶瓷器物存世”，偷换概念，排除;D项，造成“空白期”“黑暗期”的核心原因是未见到明确属于这一时期的瓷器，史料记载详实与否并非最核心的因素，排除。故正确答案为A。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46145", "t": 1, "q": "《新青年》创刊时名为《青年杂志》，因与《上海青年》杂志的名称部分雷同，从第二卷第一号开始，正式改名为《新青年》。这次更名本是被迫与无奈之举，但在陈独秀的巧妙处理下，却成为促进刊物发展的绝佳机遇。在更名后第一期杂志的篇首，刊登了陈独秀的文章，重新定义了“新青年”这一概念，提出要以“生理心理”的标准，而非“年龄”来区分新旧青年。这一期杂志还刊登了一则通告，告知读者杂志更名事宜。变被动为主动，赋予“新青年”三个字鲜明的时代意义与先锋的思想价值，也让《新青年》有了更加精准的办刊定位。\n这段文字中的“巧妙处理”指的是（     ）。", "a": ["精准定位受众，激发情感共鸣", "采取差异策略，力求独树一帜", "明晰用户心理，精准投放内容", "借助事件传播，创造全新概念", "", ""], "r": "D", "e": "【解析】首先定位“巧妙处理”位于文段的中间，结合上下文语境，上文介绍《新青年》因名称与其他杂志部分雷同而被迫更名，本是无奈之举，随后，通过关联词“但”转折，指出陈独秀“巧妙处理”，随后后文对“巧妙处理”进行详细的解释说明，即在更名后的第一期杂志中刊登了陈独秀的文章，文章重新定义了“新青年”这一概念，同时，这期杂志还刊登了一则通告，告知读者杂志更名事宜，赋予“新青年”新的意义与价值。故“巧妙处理”指借助杂志更名事件传播全新的“新青年”概念，对应D项。A项，文段并未提及“精准定位受众”和“情感共鸣”，无中生有，排除B项，文段并未论述《新青年》与其他刊物的策略区别，无中生有，排除;C项，文段并未提及“明晰用户心理”和“精准投放”，无中生有，排除。故正确答案为D。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46146", "t": 1, "q": "汉代扬雄讲“言，心声也;书，心画也;声画形，君子小人见矣”，是将书法看作是人品与人格精神的象征，中国书法艺术美学中实际上蕴含着中华传统美学的道德精神，而作为“文房四宝”的笔墨纸砚，是中国书法与中国绘画艺术之间的直接纽带，中国书画艺术实现了两者之间的审美融通和形式共生，即所谓“书画同源”。中国书法和中国绘画艺术同属中华优秀文化典范，且共同植根中华美学思想、蕴含中华道德精神。\n根据这段文字，对“书画同源”的正确理解为（     ）。", "a": ["形成于同一时期的艺术样式", "相通的笔墨丹青与审美意境", "共同的精神内涵与艺术形式", "同属于中国的独特文化范式", "", ""], "r": "C", "e": "【解析】书画同源”位于文段中间，需结合前后文内容分析。根据“书画同源”前“即所谓”可知，前句内容可以对其进行解释，中国书法、绘画艺术实现审美融通、形式共生，即二者具有共同的审美、形式，“书画同源”后介绍了中国书法、绘画艺术同属中华优秀文化典范，根植于共同的思想，蕴含相同的道德精神，故“书画同源”指的是中国书法、绘画艺术具有共同的精神内涵与艺术形式，对应C项。A项，“形成于同一时期”文段并未提及，无中生有，排除;B项，仅对应“审美融通和形式共生”，表述片面，文段还强调二者根植于共同的思想，蕴含相同的道德精神，排除;D项，仅对应“同属中华优秀文化典范”，表述片面，文段还强调二者具有共同的形式，排除。故正确答案为C。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46147", "t": 1, "q": "青藏高原是世界屋脊，也是地球第三极，更被称为“世界上最后一方净土”。青藏高原对地球生态有多重要，可以从几个维度来看——从水资源维度，它是亚洲水塔，世界上很多大江大河由此发源，深深地滋养着人类;从生态维度，这里的海拔落差超过8000米，动植物种类丰富，相当于微缩的地球;从气候维度，青藏高原是季风和西风的巨型调节器，对全球气候变化影响深远。简言之，青藏高原是我国重要的生态安全屏障，对全球生态环境具有举足轻重的影响。\n文段中“简言之”的“之”是指（     ）。", "a": ["青藏高原的生态环境", "青藏高原的价值考察维度", "青藏高原对全球气候的影响", "青藏高原对地球生态的重要性", "", ""], "r": "D", "e": "【解析】本题为词句理解题，“之”出现在文段末尾，结合上文理解指代词含义。文段先引出话题“青藏高原”，接着说明青藏高原对地球生态的重要性，并从水资源维度、生态维度、气候维度对其重要性进行解释说明。“简言之”概括上文，故“之”在这里指的是青藏高原对地球生态的重要性，对应D项A项，说的是青藏高原自身的生态环境，与文意不符，排除;B项，缺少前文核心话题“生态”，排除;C项，“全球气候”为解释说明内容，非重点，且表述片面，排除。故正确答案为D。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46148", "t": 1, "q": "中国消费信贷市场的现状，使得对中国银行业投入巨资的西方银行在信用卡业务上仍是投资，没有盈利。不过，外资银行对中国信用卡市场并没有失去信心。虽然中国的消费者没有透支消费的习惯，而这个“硬币”的另一面是中国居民的个人负债率很低，中国内地的个人消费信用市场才刚刚开始发展，这对外资银行是极具吸引力的。\n这段文字中“硬币”指代的是（     ）。", "a": ["中国银行业", "中国消费信贷市场", "中国消费者的消费习惯", "中国居民的经济状况", "", ""], "r": "C", "e": "【解析】“硬币”的特征是有正反对立的两面，而文中具有对立两面的只有中国消费习惯，一面为没有透支，直接对应的另一面就是个人负载率低，所以答案为C。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46149", "t": 1, "q": "近几年来，政府通过各类手段，促使产业结构升级，促进经济的可持续发展。但是，经济转型政策在短期内对经济增长带来的负面影响显而易见。受限制的行业在较短时期内会因政策的压力而故慢增长。同时，受扶植政策不到位、市场培育滞后、技术开发存在瓶颈等因素影响，新的产业成长将较为缓慢，无法对冲前者带来的负面影响。\n这段文字结尾处的“前者”是指（     ）。", "a": ["政府各种促使产业结构升级的政策", "政策在短期内对经济增长的负面影响", "受限制的行业在短时期内增长缓慢", "政策、市场、技术开发瓶颈等因素", "", ""], "r": "C", "e": "【解析】原文中找到并列的两个：“同时”引导的，前一个是受限制的行业会增长放慢，后一个是新的产业成长也会较为缓慢。所以前者就是指受限制的行业短期内增长缓慢，答案为C。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46150", "t": 1, "q": "体育竞技掺入越来越多的经济利益，会驱使一些人走向极端。虽然目前运动员的自然能力仍占主导，但是如果有一天科技手段足以超越自然赋予的力量，运动员在日常不需要严格训练，而是通过仪器、手术来增强体质，这与驾驶着摩托车去参加百米竞赛是否还有本质区别?这不仅是抛给体育界的问题，也将成为科学的两难。\n“这不仅是抛给体育界的问题”中的“这”指的是（     ）。", "a": ["通过仪器、手术来增强体质", "科技手段的作用超过运动员的自然能力", "让运动员的自然能力占据主导地位", "体育竞技在经济利益驱使下走向极端", "", ""], "r": "B", "e": "【解析】如果按照“就近指代”，很多同学会机械地选择A。但文段的结构很明显，第二句话引导的问题导致了“指示代词”引导的结果（最后一句），按照刚刚说的两点：第一，指代就近的论述核心，也就是第二句中的“科技手段”，仪器、手术是“科技手段”的例证；第二，看引导的结果“科学的两难”，和论述核心一致的还是B项。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46151", "t": 1, "q": "生物科技是利用科学技术和生物技术，对农业或其他方面进行改造。利用生物体、生物组织、细胞及其成分，综合应用化学、生物学和医药学各学科原理和技术方法制得的用于预防、诊断、治疗和康复保健的制品或其它现代生物技术研制的蛋白质或核酸类药物。由于药物资源有限，含量极微，因而使用高纯度的分离工艺有一定难度，且成本昂贵。用生物基因工程方法生产这些药物，就可以很好地解决这些难题。\n对“这些难题”理解最准确的一项是（     ）。", "a": ["生物科技是利用科学技术和生物技术", "高纯度的分离工艺有一定难度，成本昂贵", "药物资源有限，含量极微，高纯度的分离工艺有一定难度", "药物资源有限，含量极微，因而成本昂贵", "", ""], "r": "B", "e": "【解析】文段首先讲述了生物科技的作用是能对农业等方面进行改造，紧接着具体指出生物科技能在制得药物，但由于由于药物资源有限和含量极微导致产生高纯度分离工艺有难度和成本昂贵的问题。最后一句话点出生物基因工程方法能解决前文提到的问题。所以首先定位“这些难题”可知在最后一句，而根据最后一句话的内容可知，这些难题可以由生物基因工程解决掉，所以到前文找指代主体可知，生物基因工程能解决的问题并不是“药物资源有限且含量极微”，因为这是属于一种客观事实，是改变不了的。而生物基因工程及数真正能解决的是在“药物资源有限和含量极微”的基础上能实现高纯度的分离工艺没难度且成本不贵，故本题选B。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}, {"id": "46152", "t": 1, "q": "在旅游者途径和逗留的地方构成接待群体的居民，有权得到旅游者对他们的习俗、宗教和文化的理解和尊重，因为这些都属于人类的共同遗产。他们有权自由地使用自己的旅游资源，同时通过他们的态度和行为，使他们的自然和文化环境得到尊重。为了对这样的理解和尊重提供便利，旅游者应该尊重接待群体的习俗、传统和宗教的做法、当地的禁忌、名胜和圣地，在旅游者途径和停留的地方构成接待群体的居民，应使旅游者受到好客、礼貌和尊重。\n这段文字中，划线部分的\"他们\"指代的是（     ）。", "a": ["旅游地居民", "旅游者", "旅游资源", "人类遗产", "", ""], "r": "A", "e": "【解析】这段文字中，划线部分的\"他们\"指代的是？\"他们\"是人称代词，排除C.D。代词指代题，结合语境，向前寻找。指代的是\"在旅游者途径和逗留的地方构成接待群体的居民\"即旅游地的居民，所以答案为A。", "l3": "一般能力", "l4": "1.6节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.7节", "n": "一般能力 / 1.7节", "qs": [{"id": "46153", "t": 1, "q": "<p>①也许，除了反思民众的文化素质，不妨再问问，是什么绊住了百姓走向正规医院的脚院的脚步?是什么促使百姓寄希望于那些“神医”?<\/p>\n<p>②解决这些问题，也是防止“神医现象”再现的关键所在。<\/p>\n<p>③可是怎样既在社会制度层面、民生层面，又在精神领领域顺利完成这种“现代性转换”，这是一个系统工程。<\/p>\n<p>④实际上，作为一个转型中的拥有悠久传统文化的的古国，出现张悟本、李一等“神医现象”也算是一种“必然”。<\/p>\n<p>⑤除了医疗资源严重不足的原因，我们对病患及其家属的精神关怀是否充分?有将以人为本落到实处?<\/p>\n<p>将以上5个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>①⑤④③②<\/p>", "<p>①⑤④②③<\/p>", "<p>④③②①⑤<\/p>", "<p>④③①⑤②<\/p>", "", ""], "r": "D", "e": "【解析】此题为语句排序题。阅读题干，可知①⑤阐述“神医现象”出现的原因或引发的思考，而④则引出“神医现象”这一话题，故可知④应在①⑤之前，因此排除A.B两个选项。②应在①⑤之后，“解决这些问题”中的“这些问题”即指代上文中“医疗资源”“精神关怀”等，故排除C。④先提出“神医现象”出现是一种必然，③承接④提出“神医现象”出现的原因，①、⑤解释原因，②进行总结，呼应④。故正确答案为D。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46154", "t": 1, "q": "<p>①进行良好的时间管理，同时需要这些品质<\/p>\n<p>②把握好间隔和规律正是时间管理的内容<\/p>\n<p>③当鸡蛋越来越多，情况越来越糟的时候，你要有能力控制局面<\/p>\n<p>④进行时间管理，就好像抛鸡蛋<\/p>\n<p>⑤要做好抛鸡蛋的动作，需要耐心、毅力、练习和计划<\/p>\n<p>⑥你要不停地把手中的一只鸡蛋换成另一只，还要保持所有的鸡蛋都不落到地上<\/p>\n<p>将以上6个句子重新排序，语序正确的是（ ）。<\/p>", "a": ["<p>②④③⑥⑤①<\/p>", "<p>⑤①⑥④③②<\/p>", "<p>②④⑤⑥①③<\/p>", "<p>④⑥⑤①③②<\/p>", "", ""], "r": "D", "e": "【解析】此题为语句排序题。\n阅读题干，可以发现⑥和⑤是描述抛鸡蛋动作的，应该连在一起，故排除B.C两项;①应该是文段中间承上启下的句子，后面应该接着需要的品质，因此不是最后一个，故排除A，由此可得正确答案为D。D选项首先通过④引出时间管理和抛鸡蛋的话题，接着通过⑥、⑤来描述抛鸡蛋的要点，然后通过①引出管理时间需要的品质，是控制局面的能力③，最后用②进行总结。由此可验证D正确。\n故正确答案为D。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46155", "t": 1, "q": "<p>①由于亮度与光的强度成正比，因此行星看起来比恒星更亮<\/p>\n<p>②当我们仰望星空时，或许能分辨出哪一颗是恒星，哪一颗是行星——闪烁的是恒星，不闪烁的是行星<\/p>\n<p>③有趣的是，行星并不发光，而是反射恒星的光，但是从地球上看时，行星显得比恒星更亮<\/p>\n<p>④而我们看得到的行星距离地球相对较近，折射较少<\/p>\n<p>⑤这主要与行星和恒星到达地球的视距离有关，因为行星离地球较近，所以我们的眼睛感知行星的光的强度比离地球较远的恒星要高得多<\/p>\n<p>⑥这是因为绝大多数恒星离地球非常远，来自恒星的光经历多次折射，光速不断变化，因此产生了这种效果 将以上6个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>②⑥④③⑤①<\/p>", "<p>②④⑥③①⑤<\/p>", "<p>③⑤①②⑥④<\/p>", "<p>③①⑤②④⑥<\/p>", "", ""], "r": "A", "e": "【解析】对比选项，确定首句。首句分别为②句和③句，②句介绍仰望星空时，可分辨出恒星和行星，引出“恒星和行星”的话题，③句具体介绍有关恒星和行星的有趣现象，按照行文逻辑，应先引出话题再具体展开论述，故②句应在③句之前，②句更适合作首句，排除C.D两项。\n继续观察文段，⑥句出现指代词“这是因为”，对比A.B两项，⑥句前分别是②句和④句，②句介绍仰望星空时，可分辨出恒星和行星，⑥句分析恒星的光经过多次折射，光速不断变化，产生了闪烁效果，是对②句的原因分析，故②⑥两句可以构成捆绑，对应A项。④句指出行星离地球相对较近，折射较少，与⑥句无法构成捆绑，排除B项。\n故正确答案为A。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46156", "t": 1, "q": "<p>①对新发现的“大棚房”问题，要发现一起、处置一起，坚决做到“零容忍”<\/p>\n<p>②一方面，各地区和有关部门要建立更加严格的常态长效监督机制，形成齐抓共管的工作合力<\/p>\n<p>③另一方面，压实地方责任，全面落实粮食安全党政同责、严格粮食安全责任制考核”<\/p>\n<p>④要采取“长牙齿”的硬措施，严格监管执法，做到逢棚必查，眼见为实，对违规使用耕地行为露头就打<\/p>\n<p>⑤整治“大棚房”关键在于主管部门要多些“较真精神”<\/p>\n<p>将以上5个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>①②③④⑤<\/p>", "<p>①⑤④②③<\/p>", "<p>⑤②③①④<\/p>", "<p>⑤②④①③<\/p>", "", ""], "r": "D", "e": "【解析】结合选项，判断首句。⑤句针对“大棚房”问题，而①句针对“新发现的‘大棚房’问题”，另外①句“发现一起、处置一起，坚决做到‘零容忍’”是对⑤句“较真精神”的具体解释，因此⑤句应在①句前，排除A.B项。\n　　对比选项，判断②③句还是②④句捆绑。②句讲要严格监督，齐抓共管，④句讲严格监管，③句讲压实地方责任，党政同责、安全责任制考核，故②④话题一致，④句是对②句的解释说明，②④捆绑更合适，锁定D项。\n故正确答案为D。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46157", "t": 1, "q": "<p>①他们的研究和尝试有望引领化学走入自动化时代，加速药物研发进程，使药品的生产更加安全可靠。<\/p>\n<p>②有科学家向这一任务发起了挑战，不少科学家都在想方设法让化学合成变得更自动化。<\/p>\n<p>③目前还没有可涵盖所有合成有机化学的数字自动化标准和通用的化学操作编程语言。<\/p>\n<p>④自动化在化学领域并非新鲜事，但这些自动化合成仅囿于单一类型的化学反应或流程。<\/p>\n<p>⑤化学家的工作长期以来都通过人工方式完成，是一个非常手工的、由人力驱动的过程。<\/p>\n<p>⑥比如，克罗宁团队利用研制出的“化学计算机”，自动制备出3种高品质药用化合物。<\/p>\n<p>将以上6个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>③⑤②④⑥①<\/p>", "<p>⑤④③②⑥①<\/p>", "<p>①⑤③④②⑥<\/p>", "<p>⑤③④②①⑥<\/p>", "", ""], "r": "B", "e": "【解析】对比选项，确定首句。①句出现指代词“他们”，指代不明，不适合作首句，排除C项。③句指出化学自动化当前存在的问题，⑤句指出化学家的工作长期以来都通过人工方式完成，均适合作首句，保留A.B.D三项。继续观察发现，②句出现指代词“这一任务”，并指出科学家向其发起挑战，可知前文应论述某一任务当前无法完成，③句指出化学自动化当前存在的问题，④句指出自动化合成仅囿于单一类型的化学反应或流程，均可放在②句之前进行捆绑，⑤句论述化学家的工作是人工方式完成的，并未体现某一任务当前无法完成需要挑战，故⑤②两句无法构成捆绑，排除A项。对比B.D两项，①句和⑥句顺序不同，①句以指代词“他们”开头，指出他们的研究和尝试有望引领化学进入自动化时代，即论述研究的意义，⑥句指出克罗宁团队利用研制出的“化学计算机”，根据逻辑顺序可知，应先介绍研究，再论述研究的意义，故⑥句应在①句之前，排除D项，对应B项。故正确答案为B。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46158", "t": 1, "q": "<p>①例如位于我国四川的深地核天体物理实验室，其上覆盖的垂直岩石厚达2400米<\/p>\n<p>②因此，旨在直接探测暗物质的实验室通常会建于极深的地下或山里，尽最大可能屏蔽掉这些干扰<\/p>\n<p>③直接探测暗物质的方式类似于守株待兔<\/p>\n<p>④当然，这种能量波动极其微弱，而且宇宙中的各种射线同样也有机会与这个原子核来一场亲密的邂逅，从而对实验结果产生干扰<\/p>\n<p>⑤专家解释说，我们生活在一团暗物质云中，每秒钟可能有几百万甚至上千万的暗物质粒子穿过我们的身体<\/p>\n<p>⑥直接探测暗物质的方法之一，就是利用精密的仪器密切观察大量的原子核，如果足够幸运，某一时刻暗物质碰撞到某个原子核，会在原子核上留下残余能量 将以上6个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>⑥②①⑤③④<\/p>", "<p>⑥④⑤②③①<\/p>", "<p>③⑤⑥④②①<\/p>", "<p>③⑥②⑤①④<\/p>", "", ""], "r": "C", "e": "【解析】对比选项，确定首句，首句分别为③句和⑥句，③句引出“直接探测暗物质的方式”的话题，⑥句则具体解释了“直接探测暗物质的方法之一”，故⑥句是对③句的详细解释，根据观点+解释说明的逻辑顺序，③句更适合作首句，排除A.B两项。继续观察选项，①句出现“例如”为举例论述，之前应提出对应的观点。结合选项需判断①句之前是②句还是⑤句，②句提出直接探测暗物质的实验室通常会建于极深的地下或山里，与①句“四川的深地核天体物理实验室”衔接恰当，故②句应在①句之前，C项当选。⑤句提到暗物质粒子穿过我们的身体，与①句话题不一致，无法衔接，D项排除。故正确答案为C。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46159", "t": 1, "q": "<p>①历史时期的气候并非一成不变，气候的波动变化对文明演变产生了重要影响<\/p>\n<p>②“锦江近西烟水绿，新雨山头荔枝熟”，唐代诗人张籍的诗表明当时四川地区有荔枝分布<\/p>\n<p>③20世纪70年代，著名学者竺可桢根据历史文献记载，首次重建了我国过去5000年的温度变化曲线<\/p>\n<p>④然而在现代人的认知中，荔枝的生长区多位于南岭以南，很多人对杨贵妃能吃到荔枝表示怀疑<\/p>\n<p>⑤重建的暖季温度与同区域公海孢粉量化的降水数据，为我国过去5000年文明历史提供了更加完整的定量气候背景<\/p>\n<p>⑥不久前，科学家利用现代地学研究手段，定量重建了我国北方过去5000年中高分辨率的暖季(4月至10月)温度变化序列<\/p>\n<p>将以上6个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>③⑤⑥①②④<\/p>", "<p>⑥③⑤④①②<\/p>", "<p>①⑥⑤②④③<\/p>", "<p>②④①③⑥⑤<\/p>", "", ""], "r": "D", "e": "【解析】观察选项，对比首句。①句引入“气候”这一话题并介绍气候的波动变化对文明演变有重要影响，②句引用诗人张籍的诗介绍唐代时四川有荔枝分布这一背景，③句介绍20世纪70年代竺可桢首次重建我国的温度变化曲线，⑥句介绍不久前科学家定量重建了我国北方温度变化序列，根据日常逻辑顺序，应先引出气候变化这一话题，再介绍我国科学家对温度变化的研究，故①句应在③、⑥句之前，排除A.B两项。且根据时间顺序，③句介绍20世纪70年代的研究，⑥句介绍不久前的研究，故③句应在⑥句之前，排除C项，D项当选。\n故正确答案为D。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46160", "t": 1, "q": "<p>①其背后的机制非常多样，其中一个可能的机制是，丰富的生物多样性可以让生物之间形成比较复杂的相互牵制关系<\/p>\n<p>②然而，我们已经有许多证据充分表明，丰富的生物多样性往往可以保证一个生态系统维持较高的稳定性和抗干扰性<\/p>\n<p>③20世纪后期以来，由于人类对全球生态系统的干扰和破坏不断加剧<\/p>\n<p>④生物多样性保护成为热门研究和实践领域<\/p>\n<p>⑤从而不会让某类生物一家独大造成失衡，引发整个生态系统的破坏<\/p>\n<p>⑥由于生物圈的复杂性，时至今日，生态学界还没有发现生物多样性和地球生态系统稳定性之间存在什么简单的定律<\/p>\n<p>将以上6个句子重新排列，语序正确的一项是（ ）。<\/p>", "a": ["<p>⑥③①②⑤④<\/p>", "<p>⑥①⑤②③④<\/p>", "<p>③④⑥②①⑤<\/p>", "<p>③⑤④⑥②①<\/p>", "", ""], "r": "C", "e": "【解析】对比选项，判断首句。③句指出“人类对全球生态系统的干扰和破坏不断加剧”，⑥句指出“生态学界还没有发现生物多样性和地球生态系统稳定性之间存在什么简单的定律”，难以判断首句，寻找其他线索。\n继续观察发现，②句出现转折词“然而”，且表明已有证据能说明“丰富的生物多样性”可以保证“生态系统维持较高的稳定性和抗干扰性”，⑥句论述生态学界还没有发现“生物多样性”和“地球生态系统稳定性”之间是否存在定律，与②句可以构成转折关系，故⑥②两句构成捆绑，保留C.D两项。①句具体论述了“生物多样性”可以让生物之间形成相互牵制关系，⑤句引导了一个结果，即不会让某类生物一家独大造成失衡，⑤①两句均无法与②句构成转折关系，排除A.B两项。\n对比C.D两项的尾句，⑤句论述“不会让某类生物一家独大造成失衡”，①句表明“生物多样性”可以让生物之间形成相互牵制关系，有了相互牵制，就不会造成“某类生物一家独大”，按照逻辑顺序，①句应该放在⑤句之前，⑤句更适合作尾句，排除D项，C项当选。\n故正确答案为C。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46161", "t": 1, "q": "<p>①人们听音时，首先是要用耳朵去听而不是用仪器去测量，如何判断，依靠的就是人们的“音准感”<\/p>\n<p>②这种音准有着精确的物理意义，音是由物体的震动产生的，每个乐音震动的频率就是它的物理属性<\/p>\n<p>③另一种音准指的是人们对于音高的一种听力反应，严格来讲应该叫做“音准感”<\/p>\n<p>④而在音乐中使用的音并不是随意产生的，是人们在长期实践过程中挑选出来的<\/p>\n<p>⑤我们通常所说的音准，一般有两种含义<\/p>\n<p>⑥一种是音乐中的音高要遵循一定的规律，那就是音高的准确性，即音准<\/p>\n<p>请将上述语句重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>⑤⑥④①③②<\/p>", "<p>①③②⑤⑥④<\/p>", "<p>①⑤⑥③②④<\/p>", "<p>⑤⑥②④③①<\/p>", "", ""], "r": "D", "e": "【解析】根据选项判断首句，①句介绍人们听音时依靠的就是人们的“音准感”，⑤句最先引出“音准”，强调它有两种含义。对比之下⑤句更适合作首句，排除B.C两项。\n观察发现，②句出现指代词“这种”，指代对象为音准，且论述这种音准有着精确的物理意义，观察选项发现，②句之前分别为③句和⑥句，⑥句论述音准，介绍音高的准确性，⑥句和②句衔接很恰当，可以构成指代词捆绑，D项当选。③句论述音准感，介绍是人们对于音高的一种听力反应，与②中对“音准”精确性论述的话题无关，无法构成指代词捆绑，排除 A 项。\n故正确答案为D。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46162", "t": 1, "q": "<p>①此外，在集成高铁强国先进成熟技术的基础上，中国建立了更加完善的创新体系和试验体系，因而新车型开发周期处于全球领先水平<\/p>\n<p>②速度是反映高铁综合技术水平最主要的指标<\/p>\n<p>③在衡量高铁速度水平的四个指标中，除最高线路试验速度由法国保持外，其余三项纪录均由中国创造<\/p>\n<p>④例如，时速350公里中国标准动车组5年就完成项目立项到实际上线运营，而西门子时速280公里高速动车组从技术招标到批量采购耗时近10年 ⑤高铁已经成为中国极少数能够比肩国际技术前沿，甚至在部分领域引领全球技术发展的高技术复杂度产业<\/p>\n<p>将以上5个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>④②③①⑤<\/p>", "<p>②④③⑤①<\/p>", "<p>⑤②③①④<\/p>", "<p>③⑤①④②<\/p>", "", ""], "r": "C", "e": "【解析】对比选项，判断首句。②句指出速度是反映高铁综合技术水平最主要的指标，③句引出衡量高铁速度水平的四个指标中三项纪录由中国创造，对比②③两句，应先引出速度是反映高铁技术的最主要指标，再说明衡量高铁速度水平的指标，故③句应在②句后，排除D项;④句用“例如”举例，不适合放在首句，排除A项。⑤句介绍中国高铁在国际上的地位，②⑤两句不好判断，保留B.C两项。继续观察发现，④句举例子，对比中国标准动车组和西门子高速动车组的建设时长，表明中国标准动车组的建设时长更短，对比B.C两项，④句前分别是①②两句，①句指出中国新车型的开发周期处于全球领先水平，①④两句构成捆绑，C项当选。②句提到速度是反映高铁综合技术水平最主要的指标，并未涉及高铁建设时长，话题不一致，②④两句不能构成捆绑，排除B项。故正确答案为C。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46163", "t": 1, "q": "<p>①尤其在一个国家经历艰难转型的过渡期，这些声音会时强时弱地凸显出来<\/p>\n<p>②就像英国作家塞缪尔·约翰逊说过的，“爱国主义是无赖最后的避难所”<\/p>\n<p>③他们在爱国这个话题上所表现出来的真实情感才会凝聚出强大的精神力量<\/p>\n<p>④可是，任何社会，沉默的大多数才是主流和基石<\/p>\n<p>⑤这时，爱国主义容易被情绪化、被断章取义、被利用，从而转化为各种抵制、冲击和谩骂 ⑥任何社会都不缺偏激的叛逆者、狂热的偏执者、迷惘的盲从者、恶意的唱衰者<\/p>\n<p>将以上6个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>②⑥③①④⑤<\/p>", "<p>⑥①⑤②④③<\/p>", "<p>②⑤①④⑥③<\/p>", "<p>⑥②⑤④③①<\/p>", "", ""], "r": "B", "e": "【解析】对比选项，判断首句。②句出现“就像”，属于举例论证内容，不适合作首句，排除A.C两项。⑥句指出任何社会都不缺偏激、狂热、迷惘、恶意的人，适合作首句，保留B.D两项。\n继续观察发现。⑤句中出现指代词“这时”，根据指代词捆绑，判断⑤句前衔接①句还是②句，①句指出在一个国家经历艰难转型的过渡时期，会有时强时弱的声音凸显出来，可以与⑤句中的“这时”构成指代关系，①⑤两句构成捆绑，锁定B项。而②句通过引用塞缪尔·约翰逊的话进行举例论证，未出现表示时间的指代对象，无法和⑤句中的“这时”构成指代关系，排除D项。\n故正确答案为B。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46164", "t": 1, "q": "<p>①气候学家近些年来非常担心，北极变暖会导致最后一次冰期在西伯利亚、阿拉斯加和加拿大极地地区出现的所有永久冻土迅速消失<\/p>\n<p>②除了对自然界的影响外，这些灾难性过程还会对极地居民造成极为不利的影响<\/p>\n<p>③这些动植物残骸将开始腐烂，向大气层释放甲烷和二氧化碳，在自然火灾中燃烧，进一步加速全球变暖<\/p>\n<p>④据当前预测，西伯利亚和阿拉斯加南部地区永久冻土在本世纪末会消失三分之一左右<\/p>\n<p>⑤专家认为，永久冻土融化会释放出在数百万年冰期内冻结在土壤中、并不断累积的大量有机物质 ⑥最近，气候学家研究发现，永久冻土融化将影响俄罗斯、加拿大和美国极地城市70%以上的基础设施<\/p>\n<p>将以上六个句子重新排序，语序正确的是（ ）。<\/p>", "a": ["<p>①④⑤③②⑥<\/p>", "<p>④⑥①⑤③②<\/p>", "<p>⑤①③②⑥④<\/p>", "<p>⑥⑤①④③②<\/p>", "", ""], "r": "A", "e": "【解析】对比选项，确定首句。①句指出气候学家担心永久冻土会消失，④句论述当前预测永久冻土在本世纪末会消失三分之一左右，⑤句和⑥句均介绍了永久冻土融化的影响，按照逻辑顺序，应先说冻土消失再论述其消失后的影响，故①、④句应在⑤、⑥句前，对应A项，排除B.C.D项。故正确答案为A。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46165", "t": 1, "q": "<p>①商代晚期才有长篇铭文，其主要进步是能完整叙述一连串事件且有清晰的因果联系<\/p>\n<p>②显然，这类铭文的书写重心是“功勋”与“赏赐”，它代表着主人最有价值的荣誉，因此他希望通过铜器精确地传达给祖先或后世<\/p>\n<p>③事实上，商周铭文绝大多数内容都是围绕这一主题展开的<\/p>\n<p>④比如《小子X卣》铭文有四十七字，叙述器主参与一项军事行动有功因而受到上级的赏赐，又因此制作了铜器以祭祀、告慰其亡母<\/p>\n<p>⑤因为对当时的贵族来说，用铭文记录其所立的功劳和所受的封赏，不仅是其人生价值的展现，也是其家族政治地位的宣示和保障<\/p>\n<p>⑥最早的铜器铭文非常简单，有的仅由一个或数个名词组成，稍复杂的也仅是一个主谓句<\/p>\n<p>将以上6个句子重新排列，语序正确的一项是（ ）。<\/p>", "a": ["<p>⑥④⑤②③①<\/p>", "<p>⑥①④②③⑤<\/p>", "<p>①③④②⑤⑥<\/p>", "<p>①④⑤②③⑥<\/p>", "", ""], "r": "B", "e": "【解析】对比选项，确定首句，①句介绍商代晚期出现长篇铭文以及长篇铭文的进步之处，⑥句介绍最早的铜器铭文的特点，根据日常逻辑顺序，应先介绍最早的铜器铭文，再介绍取得进步的长篇铭文，故⑥句在①句之前，排除C.D两项。继续观察，发现④句通过“比如”进行举例，具体论述了《小子X卣》的铭文字数以及关联事件中的逻辑关系，故前文观点应与铭文字数和关联事件的逻辑关系有关，④句前有①句和⑥句，①句恰好叙述长篇铭文能够完整叙述事件的因果联系，与④句衔接恰当，B项当选。⑥句论述最早的铜器铭文非常简单，与④句语义相悖，排除A项。故正确答案为B。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46166", "t": 1, "q": "<p>①“左史记言，右史记事”，在历史的长河中，口耳相传的可靠性终究比不上卷帙浩繁的文献记录<\/p>\n<p>②古籍保护，简单来说，就是保护那些珍贵的传世文献<\/p>\n<p>③回望历史，汉代发现孔府壁中书、清末发现敦煌文书，一次次涉及历史文献的重要发现，都在丰富着人们对过去的认识<\/p>\n<p>④古籍保护的意义不只在于让饱经沧桑的书籍“重获新生”，更在于通过保护古籍，保护我们自身的文化属性<\/p>\n<p>⑤即便是在今天，考古学提供了认识历史的重要方式，但对文献进行校对、考证依然是专业研究的基本功<\/p>\n<p>⑥当我们引以为傲地畅谈中华文明的缘起时，都少不了历史文献的记载做支撑<\/p>\n<p>将以上6个句子重新排列，语序正确的一项是（ ）。<\/p>", "a": ["<p>①④②③⑥⑤<\/p>", "<p>②⑥⑤①③④<\/p>", "<p>③⑤⑥④①②<\/p>", "<p>④⑥①⑤②③<\/p>", "", ""], "r": "B", "e": "【解析】对比选项，确定首句。首句有①、②、③、④四句，①句论述文献记录能帮助我们传递历史，②句是对古籍保护下定义，引出“古籍保护”的话题，③句通过一系列例子具体论证了文献对人们认识历史的重要性，④句论述古籍保护的意义。对比①、③两句，按照逻辑顺序，应先介绍文献记录能帮助我们传递历史，再通过具体的例子进行论证，所以①句应在③句之前，排除C项。对比②、④两句，应先通过下定义引出古籍保护的话题，再具体分析古籍保护的意义，所以②句应在④句之前，排除A.D两项。验证B项，②句对“古籍保护”下定义，⑥、⑤、①三句具体介绍了文献古籍对认识历史的重要作用，③句通过例子指出文献古籍对人们认识历史的重要性，④句总结保护古籍的重要意义，逻辑通顺，当选。故正确答案为B。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46167", "t": 1, "q": "<p>①这是典型的神话宇宙观的表现<\/p>\n<p>②提起中国的神话，人们会联想到“女娲补天”“后羿射日”“嫦娥奔月”等故事<\/p>\n<p>③但神话是作为文化基因而存在的，比如构成我们国名的两个汉字，“中”和“国”，均出于神话想象，华夏先民把大地想象成四方形的，四边之外有海环绕(所谓“四海五洲”)，而自认为是大地上的中央之国(九州或神州)<\/p>\n<p>④从这个意义上讲，神话遗产，是我们进入中国传统本源的有效门径<\/p>\n<p>⑤神话是文化和文学的源头<\/p>\n<p>⑥许多人认为，与西方神话相比，中国的神话只是远古时代人类的思考与探索自然并结合自己的想象所产生的并不成体系的东西<\/p>\n<p>将以上6个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>⑥②③①④⑤<\/p>", "<p>④⑤⑥②③①<\/p>", "<p>②①⑥③⑤④<\/p>", "<p>⑤②⑥③①④<\/p>", "", ""], "r": "D", "e": "【解析】先判断首句，④句出现指代词“这个意义”，不适合作首句，排除B项。②句论述提及中国的神话会联想到一系列的故事，⑤句阐述神话的内涵，⑥句论述许多人对中国神话的看法，对比可发现，⑤句是对神话下定义，②句和⑥句均在具体阐述中国神话的内容，故⑤句更适合作首句，排除A.C两项。　　验证D项，文段先提出“神话”的话题，然后引出别人的观点认为中国的神话是不成体系的，紧接着利用转折词“但”强调神话是进入中国传统本源的有效门径，逻辑通顺，当选。故正确答案为D。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46168", "t": 1, "q": "<p>①即使是有文字记载以后的文明史，也需要通过考古工作来参考、印证、丰富、完善<\/p>\n<p>②百万年的人类起源史和上万年的人类史前文明史，主要依靠考古成果来建构<\/p>\n<p>③保护好、传承好历史文化遗产是对历史负责、对人民负责<\/p>\n<p>④考古学是一门十分重要的学科<\/p>\n<p>⑤历史文化遗产不仅生动述说着过去，也深刻影响着当下和未来;不仅属于我们，也属于子孙后代<\/p>\n<p>⑥我们要加强考古工作和历史研究，让收藏在博物馆里的文物、陈列在广阔大地上的遗产、书写在古籍里的文字都活起来，丰富全社会历史文化滋养<\/p>\n<p>将以上6个句子重新排列，语序正确的一项是（ ）。<\/p>", "a": ["<p>③⑤④②①⑥<\/p>", "<p>②⑤⑥④①③<\/p>", "<p>⑥①②④⑤③<\/p>", "<p>④②①⑤③⑥<\/p>", "", ""], "r": "D", "e": "【解析】对比选项，判断首句。②句指出“人类起源史和人类史前文明史主要依靠考古成果来建构”，④句引出“考古学”的话题，指出其重要性，⑥句提出加强考古工作的具体做法，②④⑥三句均围绕“考古学”这一话题展开论述，按逻辑顺序，应该先引出“考古学”的话题，再具体阐述考古学如何重要以及加强考古工作的具体做法，因此④句相较②⑥两句更适合作首句，排除B.C两项。③句指出“保护好、传承好历史文化遗产的必要性”，话题与“考古学”有所区别，无法判断首句，保留A.D两项。对比A.D两项，发现③⑤两句顺序不同，③句强调要保护历史文化遗产，⑤句论述历史文化遗产的重要性，应先论述历史文化遗产重要性再提及保护的话题，因此⑤句在③句之前，排除A项。故正确答案为D。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46169", "t": 1, "q": "<p>①获得相对的自由，从而充分地达到自我实现的境界<\/p>\n<p>②“美”是人生的最高境界<\/p>\n<p>③人只有满足自己和社会的需要才能达到“善”<\/p>\n<p>④“善”侧重于掌握人的需要<\/p>\n<p>⑤而“美”则侧重于在“真”“善”的前提下，超越二者的局限性<\/p>\n<p>⑥“真”侧重于人掌握客观规律<\/p>\n<p>将以上6个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>⑥④⑤③②①<\/p>", "<p>④③⑥⑤①②<\/p>", "<p>②④③⑤⑥①<\/p>", "<p>②⑥④③⑤①<\/p>", "", ""], "r": "D", "e": "【解析】根据选项判断首句，⑥句介绍了“真”的侧重，④句介绍了“善”的侧重，②句对美下定义，三者均可以作为首句，选择其他方法。⑤句强调“美”在“真”“善”的前提下能超越二者的局限性，因此⑤句在④句和⑥句之后，排除C项。②句最先引出“美”的定义，因此②句在⑤句之前，排除A项和B项。故正确答案为D。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46170", "t": 1, "q": "<p>①1994年，贝尔实验室的科学家肖尔发现，使用量子计算机可以让大数分解变得很快<\/p>\n<p>②人们能想出来的大数分解算法都有很高的复杂度，以至于人们认为也许大数分解这个计算问题本质上就很难<\/p>\n<p>③不同的计算问题难度不一样，比如两个数字相乘并不难<\/p>\n<p>④计算困难成为了现代密码学的基础，广泛应用于互联网和电子商务等领域<\/p>\n<p>⑤计算可以理解为，有一个输入，也有一个指定的输出，中间环节是计算的过程<\/p>\n<p>⑥反过来，把一个大的数字分解成两个数字，难度就大大增加了<\/p>\n<p>将以上6个句子重新排列，语序正确的一项是（ ）。<\/p>", "a": ["<p>⑤④②③⑥①<\/p>", "<p>⑤③⑥②④①<\/p>", "<p>①④②③⑥⑤<\/p>", "<p>①⑤②③④⑥<\/p>", "", ""], "r": "B", "e": "【解析】对比选项，确定首句。①句指出科学家肖尔发现使用量子计算机可提高大数分解速度，⑤句介绍对于计算的理解，引出计算的话题，按照逻辑顺序，应先引出计算的话题，再介绍如何提高计算速度，故⑤句更适合作首句，排除C.D两项。继续观察发现，⑤句之后分别为③句和④句，③句介绍不同的计算问题难度不一样，与⑤句衔接恰当，B项当选。④句介绍计算困难的应用，与⑤句衔接不当，且按照逻辑顺序，应先论述不同的计算问题难度不一样，再围绕计算困难的应用进行论述，故排除A项。故正确答案为B。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46171", "t": 1, "q": "<p>①种种乱象对青少年心理、观念、行为和健康成长容易产生消极影响。<\/p>\n<p>②青少年是人生“起步”阶段，他们的思想意识、价值观念和人格正处于养成过程中。<\/p>\n<p>③另一方面也一定要身体力行，引导孩子形成勤俭奋斗的生活习惯，要狠下心来与包办孩子的一切说“再见”。<\/p>\n<p>④为此，身为家庭教育的主角，家长一方面要注重孩子的知识教育。<\/p>\n<p>⑤只有这样，才能把孩子培养成人格健全、自信自尊自强的大写的“人”。<\/p>\n<p>⑥但目前对青少年的养成教育上，家庭、学校、社会和网络舆论之间，却不同程度地存在悖谬现象，言行背离、理论与实践脱节。<\/p>\n<p>将以上6个句子重新排列，最恰当的是（ ）。<\/p>", "a": ["<p>②④③⑥①⑤<\/p>", "<p>②⑥①④③⑤<\/p>", "<p>①⑥④③②⑤<\/p>", "<p>①②④⑤③⑥<\/p>", "", ""], "r": "B", "e": "【解析】对比选项，确定首句。①句论述乱象对于青少年价值观养成的消极影响，②句论述青少年时期是培养价值观的重要时期，应先论述培养价值观这一话题，再说明对价值观产生消极影响的因素，故②句更适合作首句，排除C.D两项。观察选项，对比④③两句与⑥①两句的前后顺序，④③两句论述家长培养孩子的具体做法，⑥①两句论述青少年养成教育中的种种问题，按照逻辑顺序，应先指出问题再提出对策，故⑥①两句应在前，④③两句在后，排除A项，锁定B项。故正确答案为B。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46172", "t": 1, "q": "<p>①它和金银、粮食一样作为重要财富，出现在历史的战争和商贸交易中，以其为中心形成了庞大的经济圈<\/p>\n<p>②原来的骑兵和车夫虽然被替代了，但这些行当中相当一部分，转换为装甲兵和司机等新行当，重新投入到社会进程中<\/p>\n<p>③随着科技的发展，这一现象彻底改变<\/p>\n<p>④同时，汽车和火车大大提高了运输能力和效率，助力石油等行业飞速发展，新的就业机会大量涌现<\/p>\n<p>⑤人类在战争中开始使用更先进的坦克和装甲车，汽车和火车将马匹挤下主干道也有100年左右的时间了<\/p>\n<p>⑥马匹在人类的社会进程中起到十分重要的作用<\/p>\n<p>将以上6个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>⑤④⑥③①②<\/p>", "<p>⑤③①⑥④②<\/p>", "<p>⑥③⑤①②④<\/p>", "<p>⑥①③⑤②④<\/p>", "", ""], "r": "D", "e": "【解析】对比选项，确定首句。⑤句介绍人类战争中的装备更迭，句中“更······”体现一种递进关系，但程度比较对象不明确;⑥句提出“马匹在人类社会进程中起到重要作用”的观点，相较⑤句，更适合作首句，排除A.B两项。结合题干，对比剩余两项。①句出现指代词“它”，并论述“它很重要”，与⑥句观点一致，且“它”恰指代前文“马匹”，故⑥①两句构成捆绑，D项当选;而⑤句指出“马匹”被“挤下主干道”，即其已不重要，与①句观点不一致，无法构成捆绑，排除C项。故正确答案为D。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46173", "t": 1, "q": "<p>①由于蛋黄的比重小于蛋白，选择将鸡蛋的大头向上直立存放，即使蛋白变稀，也不会很快发生蛋黄贴皮现象。<\/p>\n<p>②这是因为鲜鸡蛋的蛋清是浓稠的，但随着存放时间的延长以及外界温度的变化，蛋白会逐渐变稀，从而失去固定蛋黄的作用。<\/p>\n<p>③储存鸡蛋时要将鸡蛋竖着放，而且要将鸡蛋的大头朝上。<\/p>\n<p>④这样既可防止微生物侵入蛋黄，也有利于保证蛋品的质量。<\/p>\n<p>下列语句按照合理的逻辑顺序，排列正确的一项是（ ）。<\/p>", "a": ["<p>②①③④<\/p>", "<p>①④③②<\/p>", "<p>③②①④<\/p>", "<p>③④②①<\/p>", "", ""], "r": "C", "e": "【解析】观察选项，确定首句。①、②、③充当首句，②出现指代词“这是”，且没有出现指代对象，故不适合作首句，排除A项;比较①、③两句，③句提出要将“鸡蛋的大头朝上”这一话题，①句围绕这一话题进行原因的论述，故③句更适合作首句，排除B项对比C和D发现，②出现指代词“这”、关联词“因为”，属于原因分析，而③句论述了“储存时将鸡蛋的大头朝上”这一做法，②句属于对③句做法的原因分析，故③②可以构成捆绑，排除D项，C项符合逻辑，当选。故正确答案为C。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46174", "t": 1, "q": "<p>①随着时间推移，原来分散在不同地区的文明之间的交往越来越多。<\/p>\n<p>②一方面，它通过内聚力来维系自身的特质，使自身得以传承和延续。<\/p>\n<p>③在这种背景下，一种文明的开放程度和借鉴能力就成为影响其发展的重要因素。<\/p>\n<p>④文明往往是内聚力和外引力的统一体。<\/p>\n<p>⑤在这个过程中，不同文明的差异性逐渐表现出来，其互补性也会越来越强。<\/p>\n<p>⑥另一方面，它通过外引力将外部资源转化成自身养分，使自身得以开放发展。<\/p>\n<p>将以上句子重新排列，顺序最恰当的一组是（ ）。<\/p>", "a": ["<p>①②⑥⑤③④<\/p>", "<p>①⑤③④②⑥<\/p>", "<p>④②⑥①⑤③<\/p>", "<p>④②⑤⑥③①<\/p>", "", ""], "r": "C", "e": "【解析】观察选项，判断首句。①句论述分散在不同地区的文明之间交往越来越多，④句是对文明下定义，对比后可发现，④句更适合作首句，排除A.B两项。再判断句子间的逻辑顺序，⑤句出现指代词“在这个过程中”，并指出文明的差异性和互补性都会明显体现出来，可知指代的是文明两方面发展的过程，②句论述维系自身特质使得差异性增强，⑥句强调对外开放使得互补性增强，说明⑤句是对二者的总结，故②⑥句两应在⑤句之前，排除D项。故正确答案为C。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46175", "t": 1, "q": "<p>①但它可以成为专家和工程师的强大工具<\/p>\n<p>②网络和数据安全的未来，无论是否基于区块链作为重要工具<\/p>\n<p>③区块链虽然不是修复所有互联网问题的灵丹妙药<\/p>\n<p>④传统风险不断，新的威胁一直出现<\/p>\n<p>⑤开发出变革性的安全应用，赋予互联网更丰富的价值和更美好的未来<\/p>\n<p>⑥都必须拥有整体安全理念<\/p>\n<p>将以上6个句子重新排列，语序正确的是（ ）。<\/p>", "a": ["<p>④③①⑤②⑥<\/p>", "<p>③①⑤②⑥④<\/p>", "<p>③①⑤⑥②④<\/p>", "<p>④②⑥③①⑤<\/p>", "", ""], "r": "D", "e": "【解析】对比选项，判断首句，③句指出区块链不能修复所有互联网问题，④句介绍传统风险不断，新的威胁一直出现，结合选项可知，③①两句均捆绑在一起，③①两句介绍区块链对解决互联网问题具有的作用，由此可知，应先引出问题，再介绍办法，④句应在③句之前，排除B.C两项。对比A.D两项发现，选项分别对“③①⑤”“②⑥”进行捆绑，区别在于二者的顺序。分析内容可知，②⑥两句指出“区块链”不论是否作为重要工具，网络和数据安全的未来都必须拥有整体安全理念，③①⑤三句指出“区块链”能够成为专家和工程师的强大工具，开发出变革性的安全应用，赋予互联网更好的未来。③①⑤三句是对②⑥两句“网络和数据安全要拥有整体安全理念”的详细展开，且具体介绍了“区块链”对“网络和数据安全”的积极意义，故②⑥两句应在③①⑤三句之前，锁定D项。故正确答案为D。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46176", "t": 1, "q": "<p>①建议从事童书出版的机构聘请心理学、教育学、出版学等相关领域专家共同把关，为儿童读物筑牢安全防线<\/p>\n<p>②童书出版有必要设立严格门槛<\/p>\n<p>③童书出版需要认定资质、配备专业编辑，目前在这方面尚有欠缺<\/p>\n<p>④我国现有专业少儿出版社30多家，随着市场需求增长，少儿出版的队伍不断壮大<\/p>\n<p>⑤童书正在从原来的专业出版变为大众出版<\/p>\n<p>⑥目前全国583家出版社，参与少儿出版的已经超过550家<\/p>\n<p>将以上6个句子重新排序，语序正确的一项是（ ）。<\/p>", "a": ["<p>③②①④⑥⑤<\/p>", "<p>④⑥⑤②③①<\/p>", "<p>⑤④③⑥①②<\/p>", "<p>⑥②①④⑤③<\/p>", "", ""], "r": "B", "e": "【解析】对比选项，确定首句，③句论述目前童书出版存在的问题，④句论述我国少儿出版的队伍不断壮大，⑤句论述童书从专业出版变为大众出版这一变化，⑥句论述目前全国参与少儿出版的出版社的具体数据，按照逻辑顺序，应先论述少儿出版的队伍不断壮大，再具体列数据说明，故④句应在⑥句之前，排除D项。观察选项发现，与A.B两项的④⑥捆绑不同，C项为④③⑥，③句论述目前童书出版存在的问题，④⑥共同论述少儿出版的队伍不断壮大的话题，故③句不适合在④⑥中间，排除C项。继续寻找线索，对比尾句，①句为对策表述，论述建议聘请各领域专家共同把关，为儿童读物筑牢安全防线，⑤句论述童书从专业出版变为大众出版的这一变化，不及①句的对策适合作为尾句，排除A项，B项当选。故正确答案为B。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}, {"id": "46177", "t": 1, "q": "<p>①流亡到江南的侨姓士族，也不可避免面临私家藏书的散失<\/p>\n<p>②永嘉之乱导致的文献典籍流失非常严重<\/p>\n<p>③西晋荀勖《中经新簿》著录秘阁藏书有29945卷，东晋之初“渐更鸠聚”，仅存3014卷，这是朝廷藏书流失的情况<\/p>\n<p>④如藏书丰富的张嶷、傅颖根两家，永嘉之乱中“避难南行”，最初携带不少书籍，由于逃难不便，只好“料简世所稀有者，各各保录”。这种情况在当时南渡士族中是很普遍的<\/p>\n<p>⑤因此，东晋初期实际的文献状况，不像朝廷藏书的亡散那么严重<\/p>\n<p>⑥至于江南旧族的藏书，受到战乱影响相对较小，如钱塘范氏“家世好学，有书七千余卷，远近来读者恒有百余人”<\/p>\n<p>将以上6个句子重新排序，语序正确的是（ ）。<\/p>", "a": ["<p>②④①③⑥⑤<\/p>", "<p>②③①④⑥⑤<\/p>", "<p>③②①④⑥⑤<\/p>", "<p>①④②③⑥⑤<\/p>", "", ""], "r": "B", "e": "【解析】对比选项，确定首句。首句分别是①句、②句和③句，①句中的“也”，为并列的后半部分，不适合作首句，排除D项。②句论述永嘉之乱导致文献典籍流失严重，③句具体论述了朝廷藏书流失的情况，按照“观点+解释说明”的逻辑顺序，应先论述文献典籍流失严重，再具体解释说明朝廷藏书流失的情况，故③句应在②句之后，排除C项。观察题干，④句出现“如”进行举例说明，指出南渡士族家庭书籍的流失现象，结合选项，④句前分别为①句和②句，①句指出流亡到江南的侨姓士族面临私家藏书流失的情况，④句属于对①句的举例说明，衔接恰当，B项当选。②句论述永嘉之乱导致文献典籍流失严重，未提及南渡士族私家藏书流失的情况，与④句的衔接不如①句密切，排除A项。故正确答案为B。", "l3": "一般能力", "l4": "1.7节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.8节", "n": "一般能力 / 1.8节", "qs": [{"id": "46178", "t": 1, "q": "<p>提到一座城市，人们往往会想到具有代表性的文化地标：600岁的紫禁城见证着北京城的过往，拓荒牛雕塑标记着深圳的开拓进取……城市文化地标<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，成为一个城市的精神和文化象征，与人们产生紧密的情感连接、文化认同。文化地标是一个地方的文化名片，在传播城市形象方面有巨大的流量效应。近年来，文化旅游市场持续升温，各类文化地标成为热门参观地、网红打卡地。 填入画横线部分最恰当的一句是（ ）。<\/p>", "a": ["<p>大都强调人文景观与自然环境和谐共生，以形神兼备的呈现方式<\/p>", "<p>或深植于历史文化，或投射着时代风貌，以鲜明独特的符号形象<\/p>", "<p>不是凭借炫目奇特的视觉效果，或各类时髦文化元素的简单堆砌<\/p>", "<p>承载着无法替代的人文价值，满足着公众的审美旨趣和美好期待<\/p>", "", ""], "r": "B", "e": "【解析】横线出现在文段中间，需考虑与前后文的衔接。横线前引出城市文化地标的话题，指出城市文化地标具有代表性，见证着一个地方的过去，标记着一个地方的风格。横线后指出城市文化地标是一个城市的精神和文化象征，是一个地方的文化名片，并列举了当下很多城市文化地标成为当地文化名片的例子。因此横线处要承接前后文，表达城市文化地标代表了一个城市的过去及风格，且城市文化地标是一个具有城市地方特色的名片的语义，对应B 项。\nA项：“自然环境”无中生有，排除。\nC 项：“视觉效果”“各类时髦文化元素”无中生有，排除。\nD项：“满足着公众的审美旨趣和美好期待”无中生有，且没有指出城市文化地标\n“是一个地方的文化名片”的独特象征地位，无法和后文衔接，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46179", "t": 1, "q": "<p>非遗曲艺周、非遗公开课、非遗影像展等3700多项活动在全国同步展开，400多项体验传承活动在20多个省区市推出……刚刚过去的“文化和自然遗产日”，一系列精彩的活动让人们走进“养在深闺人未识”的文化遗产，感知岁月积淀的文化魅力，也让人们意识到，<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>文化遗产保护为先，还需要社会公众的高度参与<\/p>", "<p>文化遗产可以摆脱高冷的标签，飞入寻常百姓家<\/p>", "<p>如何让文化遗产“活”起来也是值得思考的话题<\/p>", "<p>我国能有如此丰富的文化遗产，得益于保护管理<\/p>", "", ""], "r": "B", "e": "【解析】横线出现在文段结尾，起到总结前文的作用。文段首先以非遗的各种活动为例引出话题，随后指出“文化和自然遗产日”的一系列精彩活动让人们走近文化遗产，感知岁月沉淀的文化魅力。横线前通过“也”表并列，故横线处所填语句也应表达各种非遗活动让平时“养在深闺人未识”的文化遗产能与普通百姓接触的意思，对应B 项。\nA 、D两项：文段未提及对文化遗产的“保护”，无中生有，排除。\nC 项：“让文化遗产‘活’起来”表述不明确，文段强调的是让平时不常见的文化\n遗产走近普通百姓，排除。\n故正确答案为B:", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46180", "t": 1, "q": "<p>经济学含有这样一种信念——人类当下的经济生活具有理性的基础。但是，只要我们承认货币是社会权力的物化形式，那么，人与人之间的感性斗争就是不可避免的。<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>。 填入画横线部分最适当的一项是（ ）。<\/p>", "a": ["<p>利益是最讲究实际的<\/p>", "<p>交换实际上是支配与被支配的关系<\/p>", "<p>这一重大发现引导哲学走向一场革命<\/p>", "<p>经济学对于理性的信念其实是一种幻想<\/p>", "", ""], "r": "D", "e": "【解析】横线出现在文段尾句，需对前文进行概括总结，保证与前文话题衔接。前文先介绍了“经济学”的一种信念，即经济生活具有理性基础；随后利用转折关联词“但是”强调人与人之间的感性斗争不可避免。故前文围绕“经济学信念”这一话题，指出在经济学中，以理性为基础很难实现，对应D 项。\nA项：“利益是最讲究实际的”与文段中的“感性斗争”无关，排除。\nB 项：文段没有论述“交换”的实质，故话题不一致，排除。\nC 项：文段讨论的是“经济学”，而非“哲学”，话题不一致，排除。\n故正确答案为D.", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46181", "t": 1, "q": "<p>.科学家们表示，年幼的残猴会学着在别的疲猴呼喊结束后再发声，这一发现或可帮助我们<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>。除了人类以外的灵长类动物都学不会发声，没有模仿所听到的声音的能力——这种能力对于说话来说必不可少。但是彼猴研究者表示，灵长类动物仍然在以近乎交谈的方式互相呼喊，因为它们会等待别人呼喊结束后再发声——而这种能力经常在语言进化的讨论中被忽略。如果这种技能是后天习得的，那么它该更接近人类的相当技能，因为婴儿是在和母亲咿咿呀呀的过程中学会这种技能的。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>更好地分析人类交往的方式<\/p>", "<p>更好地理解人类语言的起源<\/p>", "<p>更好地解决人类交流的障碍<\/p>", "<p>更好地探讨人类文明的起源<\/p>", "", ""], "r": "B", "e": "【解析】横线出现在文段首句，揭示“这一发现”的作用，故后文是对横线处所填语句的解释说明。文段首先阐述了人类以外的灵长类动物没有模仿声音的能力，并指出这种能力对于说话非常重要；接下来通过转折关联词“但是”引出研究者的观点，即灵长类动物互相呼喊的方式和人类说话及学语思维过程有相似之处。根据“说话”“学语”可知，文段主要强调这一发现对于理解人类语言的重要性，对应B 项。\nA 、C 两项：A 项“交往的方式”、C 项“交流的障碍”，无中生有，排除\nD项：“人类文明的起源”范围扩大，文段仅强调语言，排除。\n故正确答案为B", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46182", "t": 1, "q": "<p>地理结构上，中国大陆是一个面积辽阔、平坦完整的区块，是自给自足的一大片土地。南方的寮、越、高棉等，有丘陵峡谷高原等相隔，历史上从来没有北侵并造成困扰过。西边有沙漠阻绝，形成天然的屏障。零星的商旅僧人，可能往返跋涉，但是很难发生大规模的军事行动。东边是大海，在坚船利炮之前，安全是不成问题的。剩下的，只有北方来的强敌。因此，只要能挡得住北方的威胁，<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>中央政权就会有意识地排斥地方势力<\/p>", "<p>中国大地便自成体系，唯我独尊<\/p>", "<p>中原大地内部的诸多力量便取得平衡<\/p>", "<p>大一统的思维便会应运而生<\/p>", "", ""], "r": "B", "e": "【解析】横线出现在文段尾句，且为尾句中的一个分句，应与前文衔接。文段首句指出中国大陆是自给自足的土地，后文列举了中国南方、西方、东方的地形特点，表明中国的这三个方位均比较安全，只有北方存在威胁。尾句通过“因此”总结全文故可知横线处所填语句要表达的意思是只要能抵挡住北方的威胁，中国大陆便不存在任何安全问题，无所畏惧。B 项“自成体系，唯我独尊”，符合文意，当选。\nA.C.D 三 项 ：A 项“就会有意识地排斥地方势力”、C 项“诸多力量便取得平衡”、D 项“大一统的思维”，均不是对前文的总结，前文重在论述中国大陆处于十分安全的地位，不受任何威胁，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46183", "t": 1, "q": "<p>数字经济的重要意义不仅体现在对总量的贡献上，更重要的是<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>，一方面表现为数字技术赋能传统产业，另一方面表现为数字技术催生新产业。数字技术赋能传统产业，通常也被称为产业数字化，即利用数字技术对传统行业的业务进行升级，进而提升生产数量和效率。从生产流程角度看，数字技术可以通过对企业生产过程中产生的数据进行分析，将程序性业务交给计算机处理，从而降低了操作失误率。同时，企业通过数据分析，能够对业务流程进行全面而系统的监督，及时发现经营过程中的异常和隐患，大大降低风险。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>及时降低企业经营过程中的损耗与风险<\/p>", "<p>将数字化的知识和信息转化为生产要素<\/p>", "<p>对产业结构优化升级所起到的推动作用<\/p>", "<p>不断发掘与推动产业经济的新增长点<\/p>", "", ""], "r": "C", "e": "【解析】横线出现在文段开头，需要结合后文进行分析。后文通过并列结构论述了数字技术在赋能传统产业以及催生新产业两个方面的意义和好处，即数字技术对产业结构变化所起到的重要作用；然后分别从生产流程和业务流程两方面解释数字技术是如何发挥作用的。故横线处所填语句应该体现数字技术对产业结构变化起到了重要的推动作用，对应C 项。\nA 项：“降低……损耗与风险”对应后文详细展开的论述部分，表述片面且非重点，排除。\nB 项：“将……转化为生产要素”文段没有体现，无中生有，排除。\nD 项：“……产业经济的新增长点”仅对应文段“另一方面表现为数字技术催生新\n产业”，表述片面，排除。\n故正确答案为C", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46184", "t": 1, "q": "<p>一段中国的筝箫名曲，多有雨声中的幽远；一幅中国的山水古画，多有雨声中的迷蒙； 一大堆中国古代的哲学，其所谓“自足”“求诸已”“尽 其在我”一类的命题，作为几千年文明的意旨内核和情感基点，当然是事出有因<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>，它们也许都来自作者们在雨声中的独处。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>雨声会让人心中安宁静谧<\/p>", "<p>这是中国文化独有的意趣<\/p>", "<p>所谓情由境生和感由事发<\/p>", "<p>就好像“小楼一夜听春雨”<\/p>", "", ""], "r": "C", "e": "【解析】根据两个“;”可知，文段属于并列结构，前两个分句分别指出“名曲” 与“雨声”有关，“山水画”与“雨声”有关，最后一个分句阐述的是“哲学”也与 “雨声”有关。根据横线前的“事出有因”，与横线后的“来自作者们在雨声中的独处” 可知，横线处所填语句应该表达古人的哲学观与雨之间存在着因果关系。C 项中的“情”和“感”对应前文提到的哲学观，而“境”和“事”对应雨，符合文意，当选。\nA 项：强调雨声让人内心宁静，没有体现雨声与哲学观之间的因果关系，排除。\nB 项：“中国文化”概念扩大，文段中阐述的是“哲学”，排除。\nD 项：“小楼一夜听春雨”只涉及“雨”这一个方面，不能体现雨声与哲学观之间的因果关系，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46185", "t": 1, "q": "<p>在时空关系上，摄影和舞蹈是两种截然不同的艺术表现形式。舞蹈中的舞者并非如摄影作品中所呈现的那样——在空间中摆出某个单一、特定的造型，<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span><span style=\"text-decoration-line: underline;\">&nbsp;<\/span><span style=\"text-decoration: underline;\"> <\/span>。舞者根据舞蹈情节及个人情绪从空间中的一个位置运动到另一个位置，而摄影能够记录的只是舞者舞动的精彩瞬间，但这个瞬间只是舞蹈在时空中的一个切片。舞蹈如同音乐一般，本身是一个绵延的过程，这就如同欣赏一部交响乐一样，听众欣赏的是完整的旋律，而非其中的某个音符。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>而是全情投入到对舞蹈情感的诠释之中<\/p>", "<p>而是处于一种不断运动的舞蹈过程之中<\/p>", "<p>而是伴随音乐的律动做出特定舞蹈动作<\/p>", "<p>而是在动与静的交替中传达舞蹈的神韵<\/p>", "", ""], "r": "B", "e": "【解析】横线位于文段中间，需要联系上下文来判断。根据横线前句子中的“并非”可知，横线处所填语句应与“摆出某个单一、特定的造型”表述相反，强调舞者的动作不是特定的造型。并且，横线后的句子说明舞者是从一个位置运动到另一个位置的。故横线处所填句子应该强调舞者“运动”的特点，对应B 项。\nA 项：强调的是“情感”，而非“运动”，衔接不当，排除。\nC 项：“特定舞蹈动作”与横线前的句子表述一致，排除。\nD 项：文段强调的是“运动”，而非“动与静的交替”，排除。\n故正确答案为B.", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46186", "t": 1, "q": "<p>艺术生的培养目前存在一个很矛盾的现象：一方面学习艺术表 演的学生人数很多，就业压力大；另一方面却是人民群众对文艺演出的需求越来越强烈，对好的文艺作品期待值很高，这是一个不争的事实。其实各大艺术院校每年的艺术创作成果并不少，其中不乏精品，但是，<u>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/u>。因此，在艺术生的培养过程中可以给学生创造更多的社会演出机会。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>大部分艺术院校没有建立一个长效的舞台演出机制<\/p>", "<p>院校的艺术作品虽然普通，却倾注了教师与学生的心血<\/p>", "<p>艺术创作成果与人民群众生活之间缺少一个通畅的交流渠道<\/p>", "<p>每个艺术人才的培养，都需要艺术理论和舞台实践的有机结合<\/p>", "", ""], "r": "C", "e": "【解析】横线出现在文段中间，需结合前后文分析，做到承上启下。横线前介绍艺术生的培养目前存在两方面的矛盾：就业压力大和人民群众对好的作品的期待高。接着论述各大艺术院校的创作成果很多，也有很多精品，属于比较积极的一方面，接着出现转折关联词“但是”，说明前后语义相反，故横线处所填内容应该体现存在的问题。并且根据后文的总结词“因此”可知，要给学生创造更多的社会演出机会，故横线处应体现的内容为：虽然各大艺术院校有很多精品，但是学生缺少社会演出的机会，对应C 项。\nA 项：“长效的舞台演出机制”文段没有体现，无中生有，且与后文话题不一致，衔接不当，排除。\nB 项：“艺术作品虽然普通”与文意相悖，文段转折前论述的是艺术院校的很多作品是精品，排除。\nD 项：“艺术理论和舞台实践的有机结合”文段并未提及，无中生有，且前文论述\n的话题是“文艺作品”，与前文话题不一致，衔接不当，排除。\n故正确答案为C.", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46187", "t": 1, "q": "<p>当我们仔细观察当今世界上的主流火箭时，就会发现它们用的发动机、燃料箱等都是上世纪的产物。比如要在2018年首飞的太空发射系统用的是改进过的航天飞机的火箭发动机，燃料箱用的是改进过的航天飞机的外挂燃料箱，两侧的固体燃料推进器用的也是改进过的航天飞机的固体燃料推进器。<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>。火箭是非常复杂的东西，设计并制造火箭需要考虑的因素太多，就连火箭制造商们也只能去选择一些经受过时间考验的产物，从而确保产品的可靠性。 填入画横线部分最恰当的一句是（ ）。<\/p>", "a": ["<p>这是因为新技术的推广需要一定的时间<\/p>", "<p>这并不意味着火箭技术没有任何新的进展<\/p>", "<p>事实上，制造火箭的材料并不都是前沿科技产物<\/p>", "<p>也就是说，在火箭这个领域内并不是最新的就是好的<\/p>", "", ""], "r": "D", "e": "【解析】横线出现在文段中间，起到承上启下的作用。横线前介绍当今世界先进主流火箭的重要部件使用的均不是新研发的产品，而是旧的产物，并举例详细说明。横线后阐述了火箭制造商选择经过时间考验的产物是为了确保产品的可靠性，即上文现象出现的原因。横线处的内容需与上下文保持一致，即应体现火箭使用旧产物是好的、是正确的之意，对应D 项。\nA 项：将原因归结为“新技术的推广需要一定的时间”，根据后文可知，原因是确\n保产品的可靠性，与文意不符，排除。\nB 项：“新的进展”为无中生有，文段重在强调“旧的具有可靠性”，排除。\nC 项：“事实上”表转折，但前文并未具体阐述前沿科技产物，与文段衔接不当，排除。\n故正确答案为 D。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46188", "t": 1, "q": "<p>虽然树种对水分的利用规律大同小异，但不同的森林类型涵养水源的作用大小不一。科学评估显示，长江上游天然林保护工程的实施为岷江上游的水生态安全做出了明显贡献，但大面积的人工植被覆盖可能加重区域生态用水，从而降低流域产水量，且大规模集中连片种植的人工纯林引发的外来物种入侵、病虫害、生态系统健康问题凸显。因此，应首先<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>。 填入画横线部分最恰当的一句是（ ）。<\/p>", "a": ["<p>保护现存的天然林植被<\/p>", "<p>发挥森林涵养水源功能<\/p>", "<p>保障水资源和生态安全<\/p>", "<p>加强人工造林植被建设<\/p>", "", ""], "r": "A", "e": "【解析】横线出现在文段末尾，根据“因此”以及“应首先”可知，横线处所填句子为针对上文问题的解决对策。文段首先说明不同森林类型涵养水源的作用大小不一，接下来指出长江上游天然林保护工程为岷江上游的水生态安全做出了贡献。随后通过转折关联词“但”强调大面积的人工植被覆盖会带来一些问题，影响生态系统健康。故横线处所填内容需解决“大面积的人工植被覆盖”的问题，即应首先保护现有\n的天然林，而非大面积栽种人工植被，对应A 项。\nB 、D 两项：B 项“发挥森林涵养水源功能”、D 项“加强人工造林植被建设”均无法解决“大面积的人工植被覆盖”的问题，排除。\nC项：“保障水资源和生态安全”没有提及具体的保护对策，表述不明确，排除。故正确答案为A。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46189", "t": 1, "q": "<p><span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>。正如游戏要求团队协作，真正让一款游戏成为广受追捧且健康向上的产品，也需要协同的力量。如果开发团队只考虑市场效益，对游戏内容和形式放任自流，纵使在短时间内能取得佳绩，也会因过度消费用户而败下阵来。如果政府部门只在一些节点上把一把、管一管，纵使出台了一些政策文件，也不过是形式大于效力。如果家长对孩子不管不问或一封到底，纵使气急败坏也无济于事，与其关上游戏的门还不如打开疏导陪伴的窗。 填入画横线部分最恰当的一句是（ ）。<\/p>", "a": ["<p>国产游戏行业的有序发展需要多方的共同努力<\/p>", "<p>游戏监管不该只堵不疏而应树立“大监管”理念<\/p>", "<p>C.各方力量紧密合作才能让游戏成为生活的有益补充<\/p>", "<p>游戏监管需制作方、政府部门、家长三方形成合力<\/p>", "", ""], "r": "D", "e": "【解析】横线出现在文段开头，需要对文段进行总体概括。横线后指出让游戏广受追捧且健康向上需要协同的力量，接着用“如果”做出假设，从开发团队、政府部门、家长三个角度指出三方要采取措施形成合力。故横线处所填语句应介绍游戏监管\n离不开制作方、政府部门、家长三方的努力，对应D 项。\nA 项：“国产游戏行业”表述不准确，文段只是提到游戏，没有提及是不是“国 产”;且“多方的共同努力”表述不明确，文段明确指出需要游戏制作方、政府和家长三方配合，排除。\nB 项：“‘大监管’理念”无中生有，排除。\nC 项：“让游戏成为生活的有益补充”无中生有，文段只是提到“让一款游戏成为\n广受追捧且健康向上的产品”，且“各方力量紧密合作”表述不明确，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46190", "t": 1, "q": "<p>如何定义垄断，尤其是如何界定互联网平台企业的垄断，存在不小的争议。垄断的危害人所皆知，可是也有人担心，如果反垄断的限制过大，可能会影响平台企业发展，不利于产生规模效应，从而影响市场繁荣。<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>。如今，市场监管总局公布的标志性案例，证明“反垄断”已经切实成为悬在企业头上的达摩克利斯之剑，将会倒逼企业在做相关决策时，不得不三思而行。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>传统的反垄断法律规则已与平台经济领域竞争呈现出的新特点不相适应<\/p>", "<p>因此，推进互联网产业在全国层面、区域层面高度集中化发展是大势所趋<\/p>", "<p>所以要正确处理好政府与市场的关系，简政放权、优化服务，激发市场活力<\/p>", "<p>因为这种模糊性和争议性，许多互联网企业一直抱着侥幸心理，不断试探 边界<\/p>", "", ""], "r": "D", "e": "【解析】横线在文段中间，需结合前后文进行分析。横线前介绍“垄断”的定义没有明确标准，以及对如果“反垄断”的限制过大，可能会造成不良影响的担忧。横 线后的“达摩克利斯之剑”及“将会倒逼企业在做相关决策时，不得不三思而行”体 现通过公布标志性案例，如今反垄断切实发挥了作用，能够约束企业决策，解决前文存在的问题。因此横线处所填内容既要承接上文，表达“垄断”的定义没有明确标准 及“反垄断”存在争议的问题，又要引出下文的对策。结合选项分析，D 项“模糊性 和争议性”承接上文，“抱着侥幸心理，不断试探边界”提出这种模糊性引发的问题，\n对应后文的对策，符合文意，当选。\nA 项：“平台经济领域竞争呈现出的新特点”整个文段均未体现，衔接不当，排除。\nB 项：“因此”表总结，论述互联网产业未来发展方向，与全文讨论的“反垄断”的核心话题无关，排除。\nC 项：“处理好政府与市场的关系，简政放权、优化服务”后文并未体现，衔接不当，排除。\n故正确答案为 D。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46191", "t": 1, "q": "我们看物体时，物体反射的光线经过角膜，穿过瞳孔，再经过晶状体的折射，穿过玻璃体，最后汇聚到视网膜上。这样，我们就可清晰地看到物体。但对于近视的人而言，来自物体的光线在到达视网膜之前就汇聚在一起了，所以看到的物体是模糊不清的， 一个主要的原因就是角膜的曲率变了。目前传统的激光治疗近视的方法，就是将角膜雕刻成“眼镜”，虽能立竿见影且效果持久，但风险较高，因此无风险治疗近视，越来越被人们所期待。\n这段文字接下来最可能讲的是（     ）。", "a": ["不同治疗近视方法的优缺点", "无风险治疗近视取得的进展", "传统的激光治疗近视方法的弊端", "如何实现永久矫正近视患者视力", "", ""], "r": "B", "e": "【解析】根据提问方式可知，本题为接语选择题，需重点关注文段尾句。文段尾句介绍了激光治疗近视的优缺点，之后通过结论词“因此”总结上文，指出“无风险治疗近视”被更多人期待，故文段接下来应继续围绕“无风险治疗近视”这一话题并展开论述，对应B 项。\nA 、C 、D三项：均未提及文段尾句讨论的核心话题“无风险治疗近视”，故衔接不当，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46192", "t": 1, "q": "<p>“简”是一种艺术风格，也是唐宋以来我国艺术（尤其是传统绘画）的一大审美追求。某位当代著名画家在谈到中西绘画艺术异同时曾说：“西洋画是加法，中国画是减法。”这与中西方民族文化的思维方式、思想积淀的差异有 着很深的联系。“减法”之喻，颇为巧妙地点出了传统中国画在意象经营和意境创构 上追求“简”的审美个性。在古代艺术家看来，“画以简贵为尚”。究其渊源，这种以“简”为贵的思想，在构成我国传统文化之骨干的禅、道、儒三家学说里已昭然可见。 文章接下来最可能讲的是（ ）。<\/p>", "a": ["<p>唐宋时期绘画的主要艺术风格<\/p>", "<p>中国传统绘画在意境创构上的特点<\/p>", "<p>中西方绘画艺术风格和审美追求的差异<\/p>", "<p>传统文化对中国艺术尚“简”精神的影响<\/p>", "", ""], "r": "D", "e": "【解析】文段首先介绍了“简”的定义，引出关于“简”这种艺术风格的话题；接着介绍了中西绘画艺术的异同，说明传统中国画在意象经营和意境创构上倾向于做 “减法”，即追求“简”的审美个性。文段尾句指出以“简”为贵的思想在构成我国传统文化之骨干的三家学说里已经昭然可见。故后文应详细阐述“以‘简’为贵”的思想与我国传统文化之间的关系，对应D 项。\nA 、B两项：A 项“唐宋时期绘画”、B 项“中国传统绘画”均与文段尾句核心话\n题不一致，排除。\nC项：“中西方绘画艺术……的差异”为前文已经论述过的内容，不会在后文中再\n次阐述，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46193", "t": 1, "q": "远古时代，人类一天平均要移动16～22公里，他们走路、奔 跑、冲刺、攀爬、游泳、跳跃、举重……他们不得不如此，否则就难以生存。在50万年的进化中，现代人所拥有的思考型的大脑，正是从运动技能的磨炼中进化而来的，人类渐渐有了梦想、计划以及创造的能力，从而创造了现代文明。但讽刺的是，文明的前进速度如此之快，人类的身体和基因却来不及跟上——就基因而言，我们仍然是50万年前的那些狩猎采集者，我们仍然渴望最高热量的食物，但却不再需要运动。最终，久坐不动的现代生活方式成了人类长期生存的重大威胁之一。\n这段文字接下来最可能讲的是（     ）。", "a": ["热量对人体的重要意义", "运动对人类进化的好处", "基因与人类健康的关系", "运动量少对人类的危害", "", ""], "r": "D", "e": "【解析】根据提问方式可知，本题为接语选择题。通读文段，重点关注文段尾句。文段首先解释远古时代人类大量运动的原因——为了生存；接着指出运动促进了人类大脑的进化，人类进而创造了现代文明；然后通过转折关联词“但”说明由于文明的 发展，人类不再需要运动。尾句着重指出久坐不动的现代生活方式成了人类长期生存的重大威胁之一。故文段接下来应该围绕这种威胁展开论述。D 项的“运动量少”与“久坐不动”语义一致，“危害”与“威胁”对应，当选。\nA项：“热量”与文段尾句的核心话题不一致，排除。\nB 项：“运动对人类进化的好处”对应“在50万年的进化中，现代人所拥有的思 考型的大脑，正是从运动技能的磨炼中进化而来的……”，属于文段中已经论述的内容，排除。\nC 项：“基因”与文段尾句的核心话题不一致，排除。\n故正确答案为 D", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46194", "t": 1, "q": "文艺复兴一般被视为一场源自14世纪意大利而后蔓延到整个欧洲的思想与艺术运动，而殖民主义则往往同15世纪末以来欧洲开辟新航路、发现新大陆以至对亚非拉地区的政治奴役、经济剥削、军事占领等历史发展相联系。过去，两者的研究相隔甚远，但最近有学者敏锐地把握到两者实有一种隐蔽的叠合关系。\n这段文字接下来最可能讲述的是（     ）。", "a": ["文艺复兴如何为殖民主义铺路", "殖民主义相关内容的研究现状", "殖民主义对亚非拉地区的深远影响", "文艺复兴如何引发欧洲思想艺术运动", "", ""], "r": "A", "e": "【解析】根据提问方式可知，本题为接语选择题，需重点关注文段尾句。文段尾句出现转折关联词“但”，之后强调的是“两者实有一种隐蔽的叠合关系”，这里的“两者”即前文论述的“文艺复兴”和“殖民主义”，根据话题一致原则，下文应该继续围绕这一话题展开论述，阐述“文艺复兴”与“殖民主义”之间的关系，对应A 项。\nB 、C 、D 三项：B 、C 两项“殖民主义”和D 项“文艺复兴”均只涉及尾句话题的一方面，表述片面，与尾句话题不一致，排除。\n故正确答案为A", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46195", "t": 1, "q": "基础研究是整个科学体系的源头，是科技强国建设的根基。2018年，我国全社会研究与试验发展 (R&D) 经费约1.94万亿元，研发人员总量预计418万人，这些资源如果得到合理配置，可以实现更大作为。据《2017年全国科技经费投入统计公报》，2017年，我国基础研究经费975.5亿元，占R&D 经费比重的5.5%。虽然规模、强度近几年在增长，但由于投入强度长期过低，加剧了基础研究资源配置的功利性，技术源头缺失问题日益凸显。未来要实质性地强化基础研究多元投入体系，提高资源配置及使用效率。\n这段文字接下来最有可能讲述的是（     ）。", "a": ["我国基础研究存在的问题", "我国基础研究取得的进展", "如何解决技术源头缺失问题", "如何加强基础研究多元投入", "", ""], "r": "D", "e": "【解析】根据提问方式可知，本题为接语选择题，需重点关注文段尾句。文段尾句论述在未来要强化“基础研究多元投入体系，提高资源配置及使用效率”，故文段尾句核心话题为“基础研究多元投入体系”。根据话题一致的原则可知，下文应围绕这一话题展开具体论述，即如何加强基础研究多元投入体系，对应D 项。\nA 项：“基础研究存在的问题”对应文段“但由于……日益凸显”部分，属于文段\n已经论述过的内容，排除。\nB 项：“基础研究取得的进展”对应文段“规模、强度近几年在增长”，属于文段已经论述过的内容，排除。\nC 项：“技术源头缺失问题”属于文段已经论述过的基础研究存在的问题中的一个\n方面，且与文段尾句核心话题不一致，排除。\n故正确答案为D。V", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46196", "t": 1, "q": "在闽江及其支流上存在着大量的传统村镇与古厝，如琴江满族村、闽安古镇、林浦村的“泰山行宫”、大埕村“九条金带”等。它们在类型和内涵上都有相似之处，虽然得到了一定程度的保护，但开发和利用力度仍普遍不够，导致一些历史记忆有湮灭的危险。随着城市化进程的加速及旧城改造规模的不断扩大，传统村镇与古厝必然会面临如何被有效保护的问题。\n接下来作者最有可能讲述的是（     ）。", "a": ["传统村镇和古厝的招商引资", "传统村镇和古厝的文物保护", "传统村镇和古厝的开发与保护", "传统村镇和古厝的文化内涵", "", ""], "r": "C", "e": "【解析】接语选择题可先关注文段尾句，把握文段尾句的核心话题。文段尾句强 调“传统村镇与古厝必然会面临如何被有效保护的问题”，故需延续“保护传统村镇与古厝”这一核心话题，对应C 项。\nA 、B 、D三项：A 项“招商引资”、B 项“文物保护”、D 项“文化内涵”文段均未提及，无中生有，且无法与文段尾句的话题衔接，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46197", "t": 1, "q": "教育上有一个传统，就是在课程设计中把科学与文学、历史对立起来。这种对立是容易从历史上来解释的。在实验科学以前，文学、语言和哲学已经在所有高等学校占领了牢固的地位。实验科学自然必须奋力前进。没有一个筑有堡垒的和坚固的势力集团会轻易放弃它可能占有的垄断地位。但是，无论哪一方面，都认为语言和文学全部是人文主义性质的，而科学则纯粹属于自然界的，这是一个错误的观念。\n接下来最可能要讲的是（     ）。", "a": ["文学、历史在高等学校的传统地位", "实验科学是如何迅猛发展起来的", "人文学科的垄断地位是如何被打破的", "将科学与人文对立为什么是不应该的", "", ""], "r": "D", "e": "【解析】根据提问方式可知，本题为接语选择题，应重点关注文段尾句。文段尾句中的“但是”表示转折，强调“语言和文学全部是人文主义性质的，而科学则纯粹属于自然界的，这是一个错误的观念”，即将科学与人文对立是错误的。因此文段接下来最有可能讲述将科学与人文对立为什么是错误的，对应D 项。\nA 项：对应前文“文学、语言和哲学已经在所有高等学校占领了牢固的地位”，是文段已经论述过的内容，且与尾句话题不一致，排除。\nB 项：文段并未提及“实验科学是如何迅猛发展起来的”，且与尾句话题不一致，排除。\nC 项：文段并未提及人文学科的垄断地位被打破，且与尾句话题不一致，排除。\n故正确答案为D。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46198", "t": 1, "q": "从社会治理的角度看，占用消防通道的行为之所以屡禁不止，除了违法者缺乏公共安全观念、对生命和法律缺乏敬畏以及监管不到位等因素之外，也有停车难的深层原因。随着我国汽车保有量的不断攀升，一些居民区面临停车位紧 缺的问题。特别是一些老旧小区，当初设计建设的局限，使得这一矛盾愈发凸显。这也是为什么一些地方占用消防通道的现象反复出现，治理举措管得了一阵子，却无法管长期、管根本的原因所在。就此而言，保持消防通道畅通、有效解决停车难题，既要管要防，更要疏要导，这考验着基层社会治理的有效性和精准度。\n这段文字接下来最可能讲的是（     ）。", "a": ["加大处罚力度、提高违法成本等措施", "在纾解停车难问题上进行的有益探索", "占用消防通道现象反复出现的原因", "探讨停车难问题的深层次原因", "", ""], "r": "B", "e": "【解析】接语选择题可先关注文段尾句，把握文段尾句的核心话题。文段尾句通过“就此而言”得出结论，强调“保持消防通道畅通、有效解决停车难题，既要管要防，更要疏要导，这考验着基层社会治理的有效性和精准度”，故文段尾句是针对保持消防通道畅通、解决停车难题的问题提出的解决对策，后文应继续围绕解决这一问题展开阐述，对应B 项。\nA 项：“加大处罚力度、提高违法成本等措施”没有提到文段尾句核心话题“停车 难题”，排除。\nC 、D 两项：C 项“占用消防通道现象反复出现的原因”、D 项“停车难问题的深层次原因”前文均已论述过，故后文不会再论述，排除。\n故正确答案为B.", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46199", "t": 1, "q": "世界正处于大发展大变革大调整时期，和平与发展仍然是时代主题。世界多极化、经济全球化、社会信息化、文化多样化深入发展，全球治理体系和国际秩序变革加速推进，各国相互联系和依存日益加深，国际力量对比更趋平衡，和平发展大势不可逆转。同时，世界面临的不稳定性不确定性突出，世界经济增长动能不足，贫富分化日益严重，地区热点问题此起彼伏，恐怖主义、网络安全、重大传染性疾病、气候变化等非传统安全威胁持续蔓延，人类面临许多共同挑战。\n这段文字接下来最可能讲的是（     ）。", "a": ["为什么我们认为当前的世界正处于发展与激变的时代", "中国是维护世界和平、促进世界共同发展的重要力量", "正确认识和把握时代的主题才是各国制定政策的依据", "各国人民应同心协力应对我们所面临的各种风险挑战", "", ""], "r": "D", "e": "【解析】文段首先指出世界处于大发展大变革大调整时期，和平与发展仍是时代主题；接着指出“世界多极化”“经济全球化”“社会信息化”“文化多样化”等促使各国联系得更加紧密，“和平发展”是大势所趋；最后指出目前世界“经济增长动能不足”“贫富分化日益严重”“恐怖主义”等问题严重，人类面临许多共同的挑战。根据先提出问题，然后解决问题的逻辑，接下来文段应该围绕人类如何解决这些问题展开论述，对应D 项。\nA 项：“发展与激变”属于文段已经提及的内容，排除。\nB 项：“中国”无中生有，且“和平”文段已经提及，排除。\nC 项：“时代的主题”属于文段已经提及的内容，且“各国制定政策”与文段尾句话题不一致，排除\n故正确答案为D。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46200", "t": 1, "q": "古时，驾车有“五驭”，《礼记》中有“入国不驰，人里必式”等要求，说的是古人的行车之德。今天，高速公路四通八达，私家车司空见惯，国人正加速驶入汽车社会，让观念和素养追上时代的车轮，显得日益迫切。\n这段文字是一篇文章的结尾，文章最可能讲的是（     ）。", "a": ["行车中的不文明行为", "中国古代的行车礼仪", "交通规则的演变过程", "汽车社会的基本特征", "", ""], "r": "A", "e": "【解析】文段作为文章的结尾，是对整篇文章内容的总结。文段通过古今对比提出对策，即在当今的汽车社会，要让国人的观念和素养追上时代的车轮。因此前文重点阐述的应该是“国人的观念和素养”还没有追上时代的车轮，即阐述的应该是行车中的不文明行为，整篇文章为“提出问题+解决问题”的结构，对应A 项。\nB 项：“中国古代”非文段重点，排除。\nC 、D 两项：均与“行车之德”无关，偏离文段中心，排除。\n故正确答案为A.", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46201", "t": 1, "q": "近年来，众筹商业模式快速兴起，股权众筹、奖励型众筹、捐赠性众筹等不同形式的众筹如雨后春笋般蓬勃发展。但是，2016年一些中小众筹平台却没有挺过“年关”。众筹联盟最近发布的研究报告显示，截至2016年年底，平台下线或众筹业务下架的平台数量达89家，占正常运营众筹平台数量的五分之一。\n接下来最可能讲的是（     ）。", "a": ["众筹平台怎样做到“曲不断，人不散”", "火热上线的众筹平台缘何遇冷下架", "众筹市场的未来为什么不容乐观", "众筹市场如何应对新的严峻挑战", "", ""], "r": "B", "e": "【解析】文段首先指出近年来各种众筹形式蓬勃发展，而后由转折关联词“但是” 引出2016年有一些众筹平台没有挺过“年关”，下架的众筹平台数量占正常运营的众筹平台数量的五分之一。尾句围绕众筹平台遇到的问题展开阐述，故下文应继续围绕这一话题展开论述，且提出问题之后，应该先分析问题，即论述众筹平台产生问题的原因，再解决问题，对应B 项。\nA 项：“怎样做到‘曲不断，人不散’”为对策表述，对比B 项，应该放在B 项之后，排除。\nC.D 两项：均是围绕“众筹市场”进行的论述，而文段尾句是围绕“众筹平台”\n进行的阐述，话题不一致，排除。\n故正确答案为 B。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}, {"id": "46202", "t": 1, "q": "我们知道，各种物质都有气体、液体、固体三种状态，在适当的温度和压力下，这三种状态可以互相转化。但是，如果温度超过374℃，那么无论把压力增加到多大，水蒸气也无法变成水，如果压力足够高的话，它的密度会大 大高于气体而接近水的密度。这样的状态与气体、液体、固体都不同，被称为物质的第四种状态——超临界态，而374℃被确定为“超临界温度”。处于超临界状态的物质，就被称为“超临界流体”。\n这段文字之后作者最有可能说明的是（     ）。", "a": ["物质达到第四种状态的化学途径", "哪些物质不会进入“超临界状态”", "“超临界流体”的性质及相关特点", "“超临界温度”对物质形态的影响", "", ""], "r": "C", "e": "【解析】接语选择题，需重点关注文段后半部分。文段先对有关物质状态的知识进行了一系列介绍，尾句落脚点在“处于超临界状态的物质，就被称为‘超临界流 体’”。故后文应该围绕“超临界流体”这一核心话题展开，详细介绍其相关信息，对应C项。\nA.B 两项：均与文段尾句的核心话题“超临界流体”不符，排除。\nD 项：“‘超临界温度’对物质形态的影响”为文段已经论述过的内容，即“如果 温度超过374℃，那么无论把压力增加到多大，水蒸气也无法变成水，如果压力足够 高的话，它的密度会大大高于气体而接近水的密度。这样的状态与气体、液体、固体都不同”，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.8节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.9节", "n": "一般能力 / 1.9节", "qs": [{"id": "46203", "t": 1, "q": "下列各句中，画横线的成语使用正确的一项是（     ）。", "a": ["<p>故宫博物院的珍宝馆里，陈列着各种奇珍异宝、古玩文物，真是<span style=\"text-decoration: underline;\">沁人心脾<\/span><\/p>", "<p>建设中国特色的社会主义事业，要靠我们持久奋战，不可能<span style=\"text-decoration: underline;\">一蹴而就<\/span><\/p>", "<p>经过重新装修，教学楼里里外外<span style=\"text-decoration: underline;\">改头换面<\/span>，给了刚返校的师生们一个惊喜<\/p>", "<p>金庸的武打小说情节起伏跌宕、 <span style=\"text-decoration: underline;\">抑扬顿挫<\/span>，吸引了广大读者<\/p>", "", ""], "r": "B", "e": "【解析】B 项：“一蹴而就”形容事情轻而易举，一下子就能成功。句子强调的就是建设中国特色的社会主义事业要靠持久奋战，不可能一下子成功，符合文意，当选。\nA 项：“沁人心脾”形容欣赏了美好的诗文、乐曲等给人以清新、爽朗的感觉，而句子中说的是“奇珍异宝”“古玩文物”，并非“诗文”“乐曲”等，用法不当，排除。\nC 项：“改头换面”比喻只改变外表和形式，不改变内容和实质，而句子中提到里里外外都改变了，用法不当，排除。\nD 项：“抑扬顿挫”指(声音)高低起伏和停顿转折，不能用来形容小说的情节，用法不当，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46204", "t": 1, "q": "下列各句中，没有语病的一句是（     ）。", "a": ["依据车队的纪律处罚办法，队长决定给予该违纪队员停止参加今年余下所有对外比赛资格", "美国的“页岩气革命”无论是从制度上还是技术上都给很多国家提供了可借鉴的经验，全球许多国家准备在页岩气领域大干一番，这其中就包括中国", "喜爱歌唱类节目的观众越来越多，把社会各类人群的心给俘获了", "观摩了成年狮群的这次猎捕活动以后，对它们这些小狮子的猎捕水平有了很大的提高", "", ""], "r": "B", "e": "【解析 】B 项：表意明确，没有语病，当选。\nA 项：成分残缺，应改为“给予该违纪队员停止参加今年余下所有对外比赛资格的处分”，排除。\nC 项：主体错误，俘获社会各类人群的心的不应是“观众”，而是“歌唱类节目”，应改为“歌唱类节目受到越来越多观众的喜爱，把社会各类人群的心给俘获了”，排除。\nD 项：成分残缺，应改为“观摩了成年狮群的这次猎捕活动以后，小狮子的猎捕水平有了很大的提高”，排除。\n本题为选非题，故正确答案为B。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46205", "t": 1, "q": "位于印尼极西地带的锡纳朋火山大规模喷发，冲上数千英尺的高空，多个村庄被炙热的火山灰吞噬，遇难人数不断增加，灾情极为严重。\n以上句子的语病类型是（     ）。", "a": ["成分赘余", "语序不当", "动宾搭配不当", "成分残缺", "", ""], "r": "D", "e": "【解析】“冲上数千英尺的高空”缺少主语“火山灰”。故病句类型为成分残缺。故正确答案为D", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46206", "t": 1, "q": "下列语句中，有语病的一句是（     ）。", "a": ["令陈老板意想不到的是，自己苦心经营多年的企业之所以破产，竟然是因为舆情应对不力引起的", "天空高处很蓝，愈往边上愈淡，亮亮地发白，此时的未名湖畔像是一幅没有着色只有线条的钢笔画", "今年以来，各大城市都在结合自身情况，打造从垃圾产生源头到回收的整套解决方案", "理论医学并不会代替实验医学和循证医学，而是以二者的研究成果为基本研究材料", "", ""], "r": "A", "e": "【解析】A 项 ：“企业之所以破产，竟然是因为舆情应对不力引起的”中的“因为” 和“引起的”语义重复，可改为“企业之所以破产，竟然是因为舆情应对不力”或\n“企业之所以破产，竟然是舆情应对不力引起的”，故该项句式杂糅，当选。\nB 、C 、D三项：均表意明确，没有语病，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46207", "t": 1, "q": "下列各句中，没有语病的一句是（     ）。", "a": ["投资环境的好坏，服务质量的优劣，政府公务人员素质的高低，都是地区经济健康发展的重要保证。", "依据纪律处罚办法，决定给予该队员停止参加今年余下所有甲级队比赛资格，并罚款人民币4万元。", "铭文中记载有关西周王朝单氏族内容的铜器，在这27件眉县青铜器发现之前已先后出土了40多件。", "观摩了这次关于农村经营承包合同法的庭审以后，对我们这些“村官”的法律水平有了很大的提高。", "", ""], "r": "C", "e": "【解析】A项的错误比较明显，犯了一面和两面不相应的错误。B项缺少动词“给予”的宾语中心语“处罚”。D项缺少主语，主语被状语掩盖住了；或将“对”删掉，让 “法律水平”作主语。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46208", "t": 1, "q": "下列各项中，没有语病的一项是（     ）。", "a": ["据多家媒体报道，我国发射的第一艘试验飞船在完成了空间飞行试验后，于北京时间3时41 分在内蒙古中部地区安全着陆", "这位著名建筑大师在国际学术界被公认为现代派建筑的代表人物，他所有建造 在亚洲的作品既充满现代气息，又带着一种神秘的东方情调", "“垂直管理”如今是一个很热门的改革思路，最近爆出的邱晓华案，对这个问题敲响了警钟", "台湾地震发生后，中国红十字总会迅速组成了几支赴台医疗队，准备携带先进的医疗器材、药品和大陆人民的热情奔赴台湾灾区", "", ""], "r": "A", "e": "【解析】A 项：没有语病，当选。\nB 项：语序不当，应改为“他在亚洲建造的所有作品”，排除。\nC 项：搭配不当，应改为“给人们敲响了警钟”，排除。\nD项：“携带”和“大陆人民的热情”搭配不当，排除。\n本题为选非题，故正确答案为A。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46209", "t": 1, "q": "下列语句中，有语病的一句是（     ）。", "a": ["仍然有人经常问及中美科幻的差距，但现在的答案已与十年前格外大相径庭", "书是工具和媒介，它是用来传播知识的，只有被使用它才有价值", "广交会的延期举办不仅是一项经济命题，也是一项政治命题，更是一项生命命题", "红荷的红不同于桃、杏，鲜艳中显出端庄，就像白玉兰于素静中显出华贵一样", "", ""], "r": "A", "e": "【解析】A 项：“格外”即表示超过寻常，“大相径庭”比喻彼此差别很大，极为不同，两者均有超过寻常之意，可删除“格外”，该项语义重复，当选。\nB 、C 、D三项：均表意明确，没有语病，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46210", "t": 1, "q": "下列各句中，有语病的一句是（     ）。", "a": ["这次采访中一半以上的被采访者曾多年担任电商平台的客服，有极为丰富的人 际沟通经验", "我舅舅是分子人类学家，许多人以为我进入这个看似古怪的领域是受我舅舅的影响，其实不是这样的", "在话剧演出过程中与他的灵魂有过碰撞的人都清楚，所谓的“现实”中的他不像在舞台上那样，是个踌躇满志、激昂慷慨的人", "近年来，物流行业的迅猛发展和物流价格的持续上涨，引起了有关部门的高度重视", "", ""], "r": "C", "e": "【解析】C 项 ：表述有歧义，是“舞台上踌躇满志、激昂慷慨”还是“舞台下踌躇满志、激昂慷慨”不明确，当选。\nA 、B 、D三项：均表意明确，没有语病，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46211", "t": 1, "q": "下列各句中，没有语病的一句是（     ）。", "a": ["办案交警告诉记者，目前他们正在调查这起事故的原因是什么造成的，但依旧会尽可能保障该路段的正常通行", "在劳动者提供正常劳动的情况下，用人单位应支付给劳动者在剔除中班、夜班、高温、低温等特殊工作环境、条件下的津贴后，不得低于当地最低工资标准", "写论文不容易，发表论文也不容易，许多研究生的主要精力就用在这一方面", "科研工作者用半精制和实用饲料进行淡水鱼养殖的实验都表明，牛脂和鲱鱼油是饲料中优质的脂类来源", "", ""], "r": "D", "e": "【解析】D 项：语义明确，没有语病，当选。\nA项：“原因是……造成的”句式杂糅，排除。\nB 项：成分残缺，缺少主语“工资”，应改为“用人单位应支付给劳动者的工资在剔除中班、夜班、高温、低温等特殊工作环境、条件下的津贴后”，排除。\nC 项：为歧义句，指示代词“这”指代不明，不清楚指代的是“写论文”还是“发表论文”，排除。\n本题为选非题，故正确答案为 D。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46212", "t": 1, "q": "下列句子中，有语病的一句是（     ）。", "a": ["中国农业对外开放的大门不会关上，如果中美贸易摩擦不断升级，其他竞争对手将占据美国在中国失去的市场份额", "新疆地广人稀，面积166万平方公里，是中国陆地面积最大的省级行政区", "八十挂零的耄耋老翁，还能在网球场上跑动，还能跳起拦网，这多少还是能引起很多人的好奇和点赞的", "有一晚风大雨大，早上出门只见地下厚厚一层落叶被晨光照得一片金黄，抬头看树上的叶子也是一片金黄，宛如一幅巨大的立体油画", "", ""], "r": "C", "e": "【解析】C 项：“八十挂零的耄耋老翁”语义重复，“耄耋”指七八十岁的年纪，与“八十挂零”语义重复，当选。\nA.B.D 三项：均没有语病，排除。\n故正确答案为 C", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46213", "t": 1, "q": "下列各项中，有语病的一项是（     ）。", "a": ["一些地区忽视有限的环境容量，追求粗放式经济发展，引起了严重的环境问题频发，环境质量陡降", "钱学森的“系统科学观”总能被应用到不同领域而推出新的理论", "随着全社会文化自信的日益增强，中国观众更希望在电视荧屏找到文化根脉与精神的时代表达", "面对错综复杂的国际环境和艰巨繁重的国内改革发展稳定任务，我们党团结带领全国各族人民顽强拼搏、开拓创新、奋力开创了党和国家事业发展新局面", "", ""], "r": "A", "e": "【解析】A 项：“引起”和“频发”均有发生之意，语义重复，可以改为“引起了严重的环境问题”或者“严重的环境问题频发”，该项句式杂糅，当选。B 、C 、D 三项：均表意明确，没有语病，排除。\n故正确答案为A.", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46214", "t": 1, "q": "下列各项中，没有歧义的一项是（     ）。", "a": ["研究员到这里工作才一个月，好多人还不认识", "演出期间，不少人遗憾地在剧场门口等着退票", "他走了一个多钟头了", "我看见他高兴得跳了起来", "", ""], "r": "B", "e": "【解析】B 项：没有歧义，当选。\nA项：存在歧义，“好多人还不认识”可以理解为“研究员不认识其他人”，也可以理解为“其他人不认识研究员”，排除。\nC 项：“走”可以理解为“走路”，也可理解为“离开”，还可以理解为“去世”故“他走了一个多钟头了”存在歧义，排除。\nD 项：存在歧义，“高兴得跳了起来”的主语不能确定是“我”还是“他”，排除。本题为选非题，故正确答案为B。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46215", "t": 1, "q": "下列各项中，没有语病的一项是（     ）。", "a": ["在强调素质教育的今天，任何脱离学生实际去追求应试效应都是不恰当的", "想象在文学作品中的应用非常广泛，不论是虚构性的作品，还是现实性的文章，都离不开想象", "其实，胡适先生英文文章也写了不少，连同这一百几十件信札，都应该收集成书，供中外学者阅读之便", "某连锁炸鸡店在被曝光使用过期变质鸡肉原料后，上海食品监管部门通过明察暗访，终于查明这些过期劣质肉类原料来自上海FX食品公司", "", ""], "r": "B", "e": "【解析】B 项：没有语病，当选。\nA项：成分残缺，可改为“任何脱离学生实际去追求应试效应的行为都是不恰当\n的”，排除。\nC 项：“供中外学者阅读之便”句式杂糅，可改为“供中外学者阅读”或“以便中\n外学者阅读”，排除。\nD 项：“某连锁炸鸡店在被曝光使用过期变质鸡肉原料后”语序不当，可改为“在\n某连锁炸鸡店被曝光使用过期变质鸡肉原料后”，排除。\n本题为选非题，故正确答案为B。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46216", "t": 1, "q": "下列句子没有语病的是（     ）。", "a": ["科学家最新研究发现人类并不是宇宙中唯一生命，但可能是第一批智慧生命", "交通拥堵和空气污染，不仅在中国，同样是国际性的难题", "1981 年6月7日，以色列空军的战斗机悄悄地偷袭了伊拉克的原子能中心", "外贸发展不仅对稳增长、保就业至关重要，而且有利于促进中国经济与世界经济深度融合", "", ""], "r": "D", "e": "【解析】D 项 ：没有语病，当选。\nA 项：关联词搭配错误，“但”前面搭配的关联词应是“虽然”，句子应为“……虽\n然不是宇宙中唯一生命，但可能是第一批智慧生命”，排除。\nB 项：关联词搭配错误，“不仅”应该搭配“而且”，而非“同样”，排除。\nC项：语义重复，“偷袭”包含了“悄悄”的意思，排除。\n本题为选非题，故正确答案为D。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46217", "t": 1, "q": "下列各句中，有语病的一句是（     ）。", "a": ["中方敦促日方切实正视和深刻反省侵略历史，同军国主义划清界限，以实际行动取信于亚洲邻国", "到2022年，北京城将充斥着冬奥会徽章、吉祥物图案、迎奥运的各种标语和冬奥会五彩缤纷的广告牌", "在网络安全问题上，我国扮演了多重角色，是网络安全的坚定维护者，也是黑客攻击的受害国", "当代社会中，婚姻已经不是生活中的“必需品”，很多人甚至更加享受单身生活的状态", "", ""], "r": "B", "e": "【解析】B 项：“充斥”为贬义词，通常搭配消极事物，而文段提及的“冬奥会徽章、吉祥物图案、迎奥运的各种标语和冬奥会五彩缤纷的广告牌”均是积极事物，故感情色彩不符，当选。\nA 、C 、D 三项：均没有语病，排除。\n故正确答案为B:", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46218", "t": 1, "q": "<p>下面画横线的成语中，使用不当的一项是（ ）。回想以前埋首伏案于伦敦、巴黎的图书馆中摸索敦煌残卷，以及<span style=\"text-decoration: underline;\">匹马孤征<\/span>、<span style=\"text-decoration: underline;\">风尘仆仆<\/span>于惊沙大漠之间，深夜<span style=\"text-decoration: underline;\">秉烛夜游<\/span>，独自欣赏六朝以及唐人的壁画，那种“摘填索涂”“空山寂历”的情形，真是<span style=\"text-decoration: underline;\">恍如隔世<\/span>!<\/p>", "a": ["<p>匹马孤征<\/p>", "<p>风尘仆仆<\/p>", "<p>秉烛夜游<\/p>", "<p>恍如隔世<\/p>", "", ""], "r": "C", "e": "【解析】C 项：“秉烛夜游”指手拿着蜡烛在夜间游行，该成语已包含了“深夜”\n之意，故“深夜”与“秉烛夜游”语义重复，使用不当，当选。\nA 、B两项： A 项“匹马孤征”强调独自踏上征程，B 项“风尘仆仆”含有辛苦 之意，形容旅途奔波，劳累忙碌，二者均可形容行走于“大漠之间”的状态，使用正\n确，排除。\nD 项：“恍如隔世”指对时间的变迁、事物的巨大变化的感触，文段“回想以\n前……的情形”，体现的是这种感慨和感触，使用正确，排除。\n本题为选非题，故正确答案为C。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46219", "t": 1, "q": "下面一段话中，有语病的一句是（     ）。\n①长久以来，人们认为身心是分离的，进而认为读书人和体育健将是对立的：②读书人就是“充耳不闻运动事，一心只读圣贤书”，反过来，体育健将也给人一 种“坐不住板凳”的刻板印象。③但随着对“人”的理解的加深，这种观念渐渐推翻了：④一方面有些读书人对运动很痴迷，一方面好运动者不但体魄强健，头脑也不简单——他们取得运动成绩靠的不仅是健壮的身体，还有敏锐的观察和灵活的策略。", "a": ["①", "②", "③", "④", "", ""], "r": "C", "e": "解析】C 项 ：③可改为“这种观念渐渐被推翻了”，当选。\nA 、B 、D 三项：均没有语病，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46220", "t": 1, "q": "下列各项中，有语病的一项是（     ）。", "a": ["现藏于俄罗斯艾尔米塔什博物馆的中国年画《四美人图》经考证乃是金代山西平阳(今临汾)雕印的精品", "因为上色技术有限的缘故且年代久远，老年画的线条尤其是边框处的线条几乎不可能很匀称", "老年画是一块新兴的投资领域，每年价格涨幅达到20%以上", "中国年画题材丰富、色彩鲜明、雅俗共赏，千百年来，已成为中国人精神文化生活中不可缺少的组成部分", "", ""], "r": "B", "e": "【解析】B 项：“因为……的缘故”句式杂糅，可改为“因为上色技术有限且年代久远”，当选。\nA 、C 、D 三项：均没有语病，排除。\n故正确答案为B:", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46221", "t": 1, "q": "下面句子表达准确的是（     ）。", "a": ["目前世界上最快的磁悬浮列车最高时速可达600多公里/小时", "目前世界上最快的磁悬浮列车最高速度为600多公里", "目前世界上最快的磁悬浮列车最高时速为600公里", "目前世界上最快的磁悬浮列车最高速度约为600公里", "", ""], "r": "C", "e": "【解析】C 项 ：“最高时速为600公里”表述正确，当选。\nA 项：“时速”与“/小时”语义重复，成分多余，排除。\nB 项：“最高速度为600多公里”成分残缺，应为“最高速度为600多公里/小时”，排除。\nD 项：“最高速度约为600公里”成分残缺，应为“最高速度约为600公里/小时”，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46222", "t": 1, "q": "下列语句中，没有歧义的一句是（     ）。", "a": ["这个连外科主任医师王刚都不认识的人，居然被评为本院的“杰出青年”", "这本讲述了一名大学生毕业之后的支教故事的小说被放在抽屉里", "教练让我们三个人一组去完成任务，这确实是最佳方案", "小宝似乎有绘画天赋，他最喜欢的事情就是在车上画画", "", ""], "r": "B", "e": "【解析】B 项：表述无歧义，当选。\nA 项：有两种理解，分别是“王刚不认识的人”或“不认识王刚的人”，存在歧义，排除。\nC项：有两种理解，分别是“我们一共三个人”或“我们所有人每三人一组”，存在歧义，排除。\nD 项：有两种理解，分别是“小宝在车身上画画”或“小宝在车里画画”，存在歧义，排除。\n本题为选非题，故正确答案为 B。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46223", "t": 1, "q": "下面这段话中，没有语病的句子是（     ）。\n①情绪智力理论认为，情绪智力对人成功的决定作用主要表现在，能自我安慰、 摆脱焦虑、灰暗或不安，很快走出生命的低潮、重新出发。②人能否对自己的情绪加以有效控制，有一个重要前提，就是要对情绪有一个清醒的自我意识，也就是说要能够敏锐地领悟到自己的情绪反应。③一个人情绪水平的高低，主要表现为对自己的消极情绪进行有效管理。④人控制自己情绪的水平决定了他发挥自己智力能力的效度。", "a": ["①②", "①④", "②③", "③④", "", ""], "r": "B", "e": "【解析】②句存在两面对一面的错误：“能否”表示两个方面，“要对情绪有一个清醒的自我意识”仅对应“能”这一个方面。③句存在两面对一面的错误：“高低”表示两个方面，“对自己的消极情绪进行有效管理”仅对应“高”这一方面。故②③两句均有语病，没有语病的是①④两句。\n本题为选非题，故正确答案为 B。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46224", "t": 1, "q": "下列句子表达有问题的是（     ）。", "a": ["旅行是一种学习，它给你用一双婴儿的眼睛去看世界，去看不同的社会，让你变得更宽容", "随着智能机器变得越来越自动化，我们更应该担心人为错误导致的危险，而不是超级人工智能的出现", "在信息传播过程中，真相有时变得不重要了，重要的是情感和观点", "据世界卫生组织统计，到2020年，抑郁症将成为仅次于心脏病的第二大疾病", "", ""], "r": "A", "e": "【解析】A 项：“给”字使用错误，正确表述应为“它让你用一双婴儿的眼睛去看世界”，当选。\nB 、C 、D三项：均无语病，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46225", "t": 1, "q": "下列各项中，有语病的一项是（     ）。", "a": ["现在，只要打开微信、微博，各种“引人遐想”的标题和图片随即充斥手机屏幕", "我们敢想敢做，又都有一双聪明能干的手，有什么造不出来", "网络公益，如同一股暖流，正在全国各地涌动", "这个梦想不仅是我的梦想，也是中国的梦想，更是世界的梦想", "", ""], "r": "B", "e": "【解析】B 项 ：搭配不当，“聪明能干”通常搭配人，不能修饰“手”，当选。A 、C 、D 三项：均没有语病，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46226", "t": 1, "q": "下列句子中，没有语病的一句是（     ）。", "a": ["十八大以来，党和政府加大了对贪污、腐败、徇私枉法等的查处和打击，做到发现一起，查处一起", "改革公费医疗制度，实施医疗保险的问题，对于广大群众并不是一下子就能接受的，相关政府部门应耐心做好宣传、解释工作", "能否做好水资源的开源和节流，是西部开发成功的关键", "波澜壮阔的改革开放和现代化建设，为广大有志青年提供了一个驰骋、进取的广阔空间", "", ""], "r": "D", "e": "【解析】D 项：语句通顺，语义明确，没有语病，当选。\nA项：缺少宾语，应改为“加大了对贪污、腐败、徇私枉法等的查处和打击力度”，排除。\nB 项：介词滥用，“对于广大群众并不是一下子就能接受的”应删掉“对于”，排除。\nC项：存在两面对一面的错误，“能否”不能对应“成功的关键”，应把“能否做好水资源的开源和节流”中的“能否”删去，排除。\n本题为选非题，故正确答案为 D。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}, {"id": "46227", "t": 1, "q": "下列各句中，没有语病的一句是（     ）。", "a": ["韩国政府决定成立个人信息保护机构，建立关于个人信息的国家认证资格证制度，扩大个人信息争议调停委员会的功能得以拓展", "在生态脆弱的沙漠地区，竟然“冒”出耗水惊人的高尔夫球场，且未办理任何审批手续，这就是新华社记者在陕西榆林发现的咄咄怪事", "近年来，含有不洁物的饮品被消费者所举报的事件时有发生，但很少有消费者维权成功，几乎没有企业承认生产过程中存在卫生隐患C", "当豪华邮轮“泰坦尼克号”面临灭顶之灾时，它的主人约瑟夫乘坐救生船离开，有幸成为100年前发生的这场海难中的幸存者之一", "", ""], "r": "B", "e": "【解析】B 项 ：没有语病，当选。\nA 项：“扩大……功能得以拓展”句式杂糅，可以改为“扩大……的功能”或“使……的功能得以拓展”，排除。\nC项：“被……所”句式杂糅，可以改为“被……”或“为……所”的被动句式，排除。\nD 项：“有幸”与“幸存者”表意重复，应去掉“有幸”，排除。本题为选非题，故正确答案为B。", "l3": "一般能力", "l4": "1.9节", "ap": [false, false, false, false, false, false]}]}, {"k": "一般能力||1.10节", "n": "一般能力 / 1.10节", "qs": [{"id": "46228", "t": 1, "q": "<p>近年来，各地纷纷大刀阔斧地开展<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，向不担当不作为亮剑。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>整理<\/p>", "<p>整治<\/p>", "<p>修理<\/p>", "<p>梳理<\/p>", "", ""], "r": "B", "e": "【解析】横线处所填词语与“开展”搭配，根据文意可知，文段强调开展一些整顿、治理的工作来解决“不担当不作为”的问题。B 项“整治”指整顿、治理，填入横线处，与文意相符，当选。\nA项：“整理”指使有条理有秩序，文段并非强调要使“不担当不作为”这样一些问题变得有条理，而是要侧重解决这样一些不好的问题，不符合文意，排除。\nC项：“修理”指对已损坏的东西进行加工，使其恢复原来的形状或作用，多搭配 具体事物，如“修理工具”“修理门窗”等，而文段当中需要解决的是“不担当不作\n为”等一些问题，置于此处搭配不当，排除。\nD项：“梳理”比喻对事物进行归类、分析，使有条理，与文段强调解决“不担当不作为”的问题无关，不符合文意，排除。\n故正确答案为B。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46229", "t": 1, "q": "<p>秋葵原产印度，却在中国<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>已久，东汉的《说 文解字》称其为“黄葵”，《本草纲目》也有详细记载，称其为“侧金盏花”。秋葵曾是我较为<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>&nbsp;的蔬菜，在童年记忆里，家中餐桌上并未出现过它。近些年秋葵却<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>走红，长居网红零食的热门榜单，也逐渐成为寻常百姓的秋日家常菜 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>侨居 反感 意外<\/p>", "<p>流浪 向往 瞬间<\/p>", "<p>落户 不屑 莫名<\/p>", "<p>扎根 陌生 迅速<\/p>", "", ""], "r": "D", "e": "【解析】第一空，根据后文“东汉的《说文解字》称其为‘黄葵’，《本草纲目》也有详细记载”可知，横线处所填词语表示秋葵虽产自印度，但在中国存在的历史比较久之意。A 项“侨居”指在外国居住，C 项“落户”指在他乡安家，长期居住，D 项“扎根”比喻深入到人群或事物中去，打下基础，三项均符合文意，保留。B 项“流浪”指生活没有着落，到处转移，随地谋生，与文意不符，排除。\n第二空，根据后文“在童年记忆里，家中餐桌上并未出现过它”可知，横线处所填词语表达我对秋葵并不熟悉之意。D项“陌生”指生疏，不熟悉，符合文意，保留。A 项“反感”指反对或不满的情绪，C 项“不屑”指轻视、轻蔑，二者均无法体现“不熟悉”的意思，且程度过重，与文意不符，排除。\n第三空，代入验证。D 项“迅速”与“走红”搭配恰当，可体现秋葵走红速度快\n之意，当选。\n故正确答案为 D。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46230", "t": 1, "q": "<p>新的一年，我们将迎来新的历史坐标和奋斗起点，也必将 面临一定的挑战。但只要我们迈出的步伐足够<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>，前进的意志足够<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>， 奋斗路上的困难终将被克服，前进路上的沟壑终将被跨越。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>坚实 坚定<\/p>", "<p>坚固 坚强<\/p>", "<p>牢靠 强大<\/p>", "<p>牢固 奋勇<\/p>", "", ""], "r": "A", "e": "【解析】第一空，横线处所填词语搭配“步伐”，根据文意可知，横线处所填词语要体现我们走的每一步都是脚踏实地的之意。A 项“坚实”指坚固扎实，可以搭配 “步伐”，而且能体现我们的步伐是扎扎实实、非常稳固的，符合文意，保留。B项  “坚固”指事物不容易被破坏，很牢固；C 项“牢靠”指事物牢固、结实或办事稳妥、可靠；D 项“牢固”指事物坚固、结实。三项均与“步伐”搭配不当，排除。\n第二空，代入验证。“前进的意志足够坚定”，“意志坚定”是固定搭配，语义恰当， A 项当选。\n故正确答案为A。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46231", "t": 1, "q": "<p>有些作家，他们笔尖触动的生活与人性之深，文字创造力之强，令人吃惊。待到人们去<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>议论，他们又不声不响扎到什么地方去了。惟有这样才能写出真正<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>社会人生的作品来。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>捧读 知悉<\/p>", "<p>拜读 熟悉<\/p>", "<p>研读 获悉<\/p>", "<p>品读 洞悉<\/p>", "", ""], "r": "D", "e": "【解析】本题可从第二空入手。横线处所填词语搭配“社会人生”。D 项“洞悉” 指以敏锐的洞察力辨别，置于此处与“社会人生”搭配恰当，且与“他们笔尖触动的生活与人性之深”形成对应，保留。A 项“知悉”指知道、了解，通常搭配为“知悉情况”“知悉流程”等；B 项“熟悉”指了解得清楚，通常搭配为“熟悉工作”“熟悉  业务”等；C 项“获悉”指得到消息，通常用法为“从……获悉”。三项均与“社会人生”搭配不当，且体现不出了解深入之意，排除。\n第一空，代入验证。D 项“品读”填入文段，符合语境，当选。\n故正确答案为 D。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46232", "t": 1, "q": "<p>从某种意义上来说，唐卡是藏文化中第一个走产业化的门类。文化产业化的指标之一是<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，早在数百年前，唐卡就已经有了《造像度量经》，而“度量”是决定一幅唐卡价值的基本条件，一幅上乘的手绘唐卡，应该是完全按照《造像度量经》之规定绘制的。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>类型化<\/p>", "<p>标准化<\/p>", "<p>数据化<\/p>", "<p>规模化<\/p>", "", ""], "r": "B", "e": "【解析】根据后文“一幅上乘的手绘唐卡，应该是完全按照《造像度量经》之规定绘制的”可知，横线所在句子强调唐卡绘制因为有自己的标准，所以才具备走产业化的条件。B 项“标准化”指为适应科学技术发展和合理组织生产的需要，在产品质量、品种规格、零部件通用等方面规定统一的技术标准，符合文意，当选。\nA项：“类型化”指将具有共同特征的事物划到一个种类里，在文段中未体现，排除。\nC 项：“数据化”指用数值的形式将各种参数进行呈现，在文段中未体现，排除。\nD 项：“规模化”指事物的规模达到了一定的标准，在文段中未体现，排除。\n故正确答案为B:", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46233", "t": 1, "q": "<p>水电、风电与光伏是当前可再生能源的主要形式。其中水力 发电由于发展时间较长，技术相对<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>，水力发电量占亚洲可再生能源总发电量 的50%左右。但由于选址经济性下降和环境社会问题日渐凸显，未来水电发展或将变得<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>成熟 缓慢<\/p>", "<p>稳定 无序<\/p>", "<p>可靠 有限<\/p>", "<p>简单 艰难<\/p>", "", ""], "r": "A", "e": "【解析】第一空，根据前文“水力发电由于发展时间较长”以及后文“水力发电量占……50%左右”可知，水力发电技术发展较为理想。A 项“成熟”、B 项“稳定”、C 项“可靠”均能体现水力发电技术发展态势相对较好之意，保留。D 项“简单”侧重体现技术处于发展起步阶段，与文意相悖，排除。\n第二空，通过转折关联词“但”可知，前后语义相反，前文论述其发展态势好，转折后应强调各类问题的出现，所以未来水电发展的脚步相较于之前会变慢。A 项 “缓慢”强调速度变慢，符合文意，当选。B 项“无序”指没有秩序、混乱，文段并无此意，排除。C 项“有限”指有一定限度的，文段并未体现其发展有一定限度，而是侧重讲其没有之前发展得好，排除。\n故正确答案为A。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46234", "t": 1, "q": "<p>阿兹特克文明的帝国都城——特诺奇蒂特兰，在给人以神秘 感的同时，也透出一丝淡淡的忧伤。神话传说与真实故事的<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>，光辉帝国史与悲惨殖民史的<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; <\/span>，令人在心驰神往的同时，感慨时过境迁、沧海桑田…… 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>纠缠 消散<\/p>", "<p>交织 更迭<\/p>", "<p>重叠 嬗变<\/p>", "<p>合契 幻灭<\/p>", "", ""], "r": "B", "e": "【解析】第一空，表示“神话传说与真实故事”的关系。B 项“交织”指错综复杂地合为一体，D 项“合契”指相符合、融洽，二者均符合文意，保留。A 项“纠缠” 指相互缠绕、搅扰，感情色彩偏消极，且通常形容人与人的关系，不能形容“神话传说与真实故事”的关系，排除。C 项“重叠”指同样的东西层层堆叠，互相覆盖，文段没有二者相互覆盖的语义，排除。\n第二空，搭配“光辉帝国史与悲惨殖民史”，根据文意可知，横线处所填词语表示这两个历史阶段不断变化更替之意。B 项“更迭”指交换、交替，用在此处与“光辉帝国史与悲惨殖民史”搭配恰当，且能和后文“时过境迁、沧海桑田”形成对应，当选。D 项“幻灭”指希望、理想等像幻境一样地消失，与“光辉帝国史与悲惨殖民史”搭配不当，且程度过重，排除。\n故正确答案为 B。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46235", "t": 1, "q": "<p>中国特色社会主义进入新时代，文艺创作、学术创新拥有无比<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>的空间。而高质量的文化<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，是满足人民美好生活向往的重要组成部分，也是时代发展所需。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>浩瀚 需求<\/p>", "<p>悠长 创作<\/p>", "<p>广阔 供给<\/p>", "<p>宽敞 库存<\/p>", "", ""], "r": "C", "e": "【解析】第一空，横线处所填词语搭配“空间”，且形容“文艺创作”“学术创新”。 A 项“浩瀚”、C 项“广阔”用在此处均可，保留。B 项“悠长”仅表示长度，与“空间”搭配不当，排除。D 项“宽敞”常搭配具体的实物，与“文艺创作”“学术创新”等抽象概念搭配不当，排除。\n第二空，横线后“是满足人民美好生活向往的重要组成部分”是对横线处所填词语进行的解释说明，即人民有需求，要提供给人民高质量的文化作品。C 项“供给” 符合语义，当选。A 项“需求”与语义不符，横线处所填词语不是表达“需求”，而是表达“提供”，排除。\n故正确答案为C。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46236", "t": 1, "q": "<p>人类成为万物之灵的主要条件是发展了语言。语言是最基本的信息<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，文字、传声技术和电脑提高了语言的<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>功能，国家共同语和国际共同语扩大了语言的<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>范围。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>符号 交际 交换<\/p>", "<p>手段 形象 使用<\/p>", "<p>载体 传播 流通<\/p>", "<p>工具 互动 言说<\/p>", "", ""], "r": "C", "e": "【解析】第一空，根据文意可知，横线所在句子表达语言能够传递信息之意。C 项“载体”填入文段语义合适，表达语言可以传递信息之意，保留。A 项“符号”指 用于区分某种特征的标识，B 项“手段”、D 项“工具”指为达到某种目的采取的方法、措施，三项均与“信息”搭配不当，排除。\n第二、三空，代入验证。“提高了……传播功能”“扩大了……流通范围”搭配恰当，符合语义， C 项当选。\n故正确答案为C。\n【文段出处】《语言生活的历史进程》", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46237", "t": 1, "q": "<p>人体已经适应了地表生活，进入太空后，难免会出现<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>反应，毕竟细胞间的相互作用与在地表时迥异。 填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>奇妙<\/p>", "<p>特殊<\/p>", "<p>异常<\/p>", "<p>奇特<\/p>", "", ""], "r": "C", "e": "【解析】横线处所填词语搭配“反应”，且根据横线前“人体已经适应了地表生活，进入太空后……”及横线后“毕竟细胞间……迥异”可知，横线处所填词语应表示人体进入太空后呈现出与在地表时不同且不适应的状态。C 项“异常”指不同于寻常，符合文意，且“异常反应”为常见搭配，当选。\nA 、D两项：A 项“奇妙”、D 项“奇特”强调稀奇、惊奇，均不符合文意，排除。\nB 项：“特殊”指不同于同类的事物或不同的情况，用于此处可表示与正常状态不同，但无法体现人在太空中“不适应”的状态，排除。\n故正确答案为C", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46238", "t": 1, "q": "<p>关于卫生健康创新发展的高峰论坛围绕“创新驱动，健康中国”主题，<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>国际和国内远程医学、“互联网+医学”等新技术和新产业，探讨 “互联网+健康医疗”服务新模式、<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>发展新业态，<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>人工智能、大数据等在医疗健康领域的创新之路，为努力提升我国整体医疗水平作出贡献。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>着笔 培养 探究<\/p>", "<p>针对 养育 探查<\/p>", "<p>对标 营造 探险<\/p>", "<p>着眼 培育 探寻<\/p>", "", ""], "r": "D", "e": "【解析】本题可从第三空入手。横线处所填词语的搭配对象为“创新之路”。B项  “探查”指深入检查，查看；D 项“探寻”指找寻、追求。二者均可与“创新之路” 搭配，保留。A 项“探究”表示深入探索并研究，通常与“问题”“奥秘”等搭配；C 项“探险”指到没有人去过或环境恶劣的地方去考察。二者均不能与“创新之路”搭配，排除。\n第二空，横线处所填词语的搭配对象为“新业态”。D 项“培育”与“新业态” 搭配恰当，保留。B 项“养育”的常见搭配是“养育子女”，与“新业态”搭配不当，排除。\n第一空，代入验证。D 项“着眼”与“新技术和新产业”搭配恰当，符合文意，当选。\n故正确答案为 D。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46239", "t": 1, "q": "<p>太空是一个充满未知和挑战的领域，面对人类的雄心，当前的化学火箭早已<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>。因为化学火箭所携带的燃料要占总重的90%以上，能量 密度较低，工作时间也不长。若要飞向更远的深空和开展星际旅行，必须<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>寻找新的“登天之梯”。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>鞭长莫及 未雨绸缪<\/p>", "<p>力不从心 另辟蹊径<\/p>", "<p>无能为力 改弦更张<\/p>", "<p>黔驴技穷 全力以赴<\/p>", "", ""], "r": "B", "e": "【解析】本题可从第二空入手。根据后文的解释说明“寻找新的‘登天之梯’”可知，横线处所填词语应体现要找到新的解决办法之意。B 项“另辟蹊径”比喻另创一种风格或方法，符合文意，保留。A 项“未雨绸缪”比喻事先做好准备， D 项“全力以赴”指把全部力量投入进去，两项均无法体现新办法之意，排除。C 项“改弦更张” 比喻改革制度或变更做法，强调在原来的基础上加以改变，并未体现用新的办法解决问题之意，排除。\n第一空，代入验证。B 项“力不从心”指心里想做，可是能力或力量够不上，置于文段中，表示“化学火箭”的力量无法满足当前的需求之意，符合文意，当选。\n故正确答案为B。", "l3": "一般能力", "l4": "1.10节", "ap": [false, false, false, false, false, false]}, {"id": "46240", "t": 1, "q": "<p>教师对学术保持<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>，学生才会对教师保持敬重。一些教师一旦跨过某个门槛，达到某个职称、职级后，就逐渐放弃职守，忙于场面上的应酬，自己做“甩手掌柜”和“后台老板”，把学生当做“学术民工”来使唤。这个过程往往导致学生学术理想的<span style=\"text-decoration: underline;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<\/span>。 依次填入画横线部分最恰当的一项是（ ）。<\/p>", "a": ["<p>爱慕 丧失<\/p>", "<p>敬畏 幻灭<\/p>", "<p>热忱 绝望<\/p>", "<p>追求 失望<\/p>", "", ""], "r": "B", "e": "【解析】第一空，根据“学生才会对教师保持敬重”可知，横线处所填词语应表示教师对“学术”持积极的态度之意。B 项“敬畏”、C 项“热忱”、D 项“追求”均 符合文意，保留。A 项“爱慕”指由于喜欢或敬重而愿意接近或因爱而向往，搭配对象通常是“人”“虚荣”等，与“学术”搭配不当，排除。\n第二空，搭配“学术理想”。B 项“幻灭”指希望、理想等像幻境一样地消失， 且“理想幻灭”为常用搭配，当选。C 项“绝望”、D 项“失望”通常表述为“对……绝望/失
