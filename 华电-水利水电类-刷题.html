平距离和水平角。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193477", "t": 3, "q": "在水利水电工程水准测量中，水准尺的尺长误差属于系统性误差，可通过在水准路线两端对水准尺进行尺长检定，计算尺长改正数来消除其影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水准尺尺长误差是因尺子制作等原因产生的有规律的误差，属系统性误差，通过在水准路线两端对水准尺进行尺长检定并计算尺长改正数，能消除该误差影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193478", "t": 3, "q": "全站仪在水利水电工程三角高程测量中，测得的垂直角为仪器望远镜中心与棱镜中心连线与水平面的夹角，该角度值不受仪器竖轴倾斜误差的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "全站仪的垂直角测量会受仪器竖轴倾斜误差影响，竖轴倾斜会使水平度盘和垂直度盘产生误差，从而影响垂直角测量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193479", "t": 3, "q": "在水利水电工程平面控制网中，导线网的坐标增量闭合差调整时，按导线各边的边长正比例分配，边长越长，分配的闭合差绝对值越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "导线网坐标增量闭合差调整原则就是按导线各边边长正比例分配，边长与分配的闭合差绝对值成正比，边长越长分配的闭合差绝对值越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193480", "t": 3, "q": "水利水电工程地形图应用中，采用坐标法计算不规则地块面积时，地块边界转折点的坐标顺序（顺时针或逆时针）不影响面积计算结果的绝对值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "坐标法计算不规则地块面积时，通过相应公式计算，转折点坐标顺序不影响面积计算结果绝对值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193481", "t": 3, "q": "在水利水电工程施工放样中，归化法放样的精度高于直接放样法，主要因为归化法通过多次测量和修正，减小了放样误差的累积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "归化法是先按直接放样法确定实地标志，再精确测量并与设计位置比较，对标志位置进行修正，多次测量和修正可减小放样误差累积，所以精度高于直接放样法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193482", "t": 3, "q": "在水利水电工程水准测量中，闭合水准路线的高差闭合差理论值不为零，因为存在地球曲率和大气折光的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "闭合水准路线高差闭合差理论值应为零，地球曲率和大气折光虽会影响测量，但不改变理论值。答案是错误的。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193483", "t": 3, "q": "在水利水电工程角度测量中，竖直角观测的指标差是指竖盘指标线与正确位置的偏差，可通过盘左盘右观测竖直角取平均值来消除其影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "竖直角观测指标差就是竖盘指标线与正确位置的偏差，盘左盘右观测竖直角取平均值能有效消除指标差影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193484", "t": 3, "q": "水利水电工程GNSS测量中，静态相对定位模式下，观测时间越长，定位精度越高，因此观测时间应无限延长以获得最高精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然观测时间越长定位精度通常越高，但无限延长观测时间会增加成本、降低工作效率，且精度提升到一定程度后，再延长观测时间对精度提升效果有限，所以不能无限延长观测时间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193485", "t": 3, "q": "在水利水电工程地形图测绘中，碎部点的密度应根据地形图比例尺和地物地貌的复杂程度确定，比例尺越大、地物越复杂，碎部点密度应越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "比例尺大意味着图上能展示更多细节，地物复杂也需要更多碎部点来准确表达，所以碎部点密度应越大。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193486", "t": 3, "q": "在水利水电工程测量误差处理中，误差传播定律的作用是根据直接观测值的中误差，计算间接观测值的中误差，反映误差的传递规律。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "误差传播定律就是用于依据直接观测值中误差来计算间接观测值中误差，体现误差传递规律。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193487", "t": 3, "q": "在水利水电工程水准测量中，支水准路线的高差闭合差调整方法是取往返测高差的平均值，往返测高差之差的绝对值应满足限差要求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "支水准路线需进行往返测量，将往返测高差取平均作为最终高差，且往返测高差之差绝对值要符合限差规定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193488", "t": 3, "q": "全站仪在水利水电工程距离测量中，采用相位法测量的距离精度不受测量距离长短的影响，无论短距离还是长距离，精度均相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "全站仪相位法测距精度受测量距离长短影响，长距离测量时误差累积，精度与短距离不同。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193489", "t": 3, "q": "在水利水电工程平面控制网中，三角网的观测工作量主要包括测量三角形的内角和部分边长，相比导线网，三角网的观测工作量更大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193490", "t": 3, "q": "水利水电工程地形图应用中，确定某点在地形图上的位置时，若该点位于两条等高线之间，可采用线性内插法计算其高程，该方法适用于地面坡度均匀的区域。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在线性内插法原理中，当地面坡度均匀时，两点间高差与水平距离成线性关系，所以在水利水电工程地形图应用里，若点在两条等高线间且地面坡度均匀，能用线性内插法算其高程。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193491", "t": 3, "q": "在水利水电工程施工测量中，前方交会法放样平面位置时，两个已知点与放样点构成的三角形内角不应过小（如小于30°），否则会产生较大的放样误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前方交会法中，若两个已知点与放样点构成的三角形内角过小，会使交会角精度降低，导致较大放样误差。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193492", "t": 3, "q": "在水利水电工程水准测量中，水准仪的i角误差对高差观测值的影响，在一个测站中若前后视距相等，可完全消除，与i角大小无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水准仪i角误差是视准轴与水准管轴不平行产生的误差，当前后视距相等时，i角误差对前后视读数的影响相同，计算高差时可相互抵消，与i角大小无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193493", "t": 3, "q": "在水利水电工程角度测量中，水平角观测的瞄准误差主要由观测者的视力和仪器望远镜的放大倍率决定，放大倍率越高，瞄准误差越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水平角观测时，瞄准误差受观测者视力和望远镜放大倍率影响，放大倍率高，能更清晰瞄准目标，误差会越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193494", "t": 3, "q": "水利水电工程GNSS测量中，多路径效应误差是指卫星信号经地面物体反射后被接收机接收，与直射信号产生干涉，该误差可通过选择合适的观测点位（如远离高大建筑物）来减弱。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多路径效应确实是卫星信号反射后与直射信号干涉产生误差，选择远离高大建筑物等合适观测点位能减少反射信号影响，从而减弱该误差。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193495", "t": 3, "q": "在水利水电工程地形图测绘中，地物测量的核心是测量地物的轮廓边界，无论地物大小，均需测量其所有转折点，不得遗漏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在水利水电工程地形图测绘中，对于较小且次要地物，可进行适当综合取舍，并非要测量所有地物的所有转折点。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193496", "t": 3, "q": "在水利水电工程施工放样中，GNSS实时动态（RTK）放样方法适用于精度要求较高的施工放样工作，如大坝轴线放样、闸门安装放样。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "GNSS实时动态（RTK）放样精度有限，对于精度要求较高的大坝轴线放样、闸门安装放样等工作，它并不适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193497", "t": 3, "q": "在水利水电工程水准测量中，每千米高差中误差是衡量水准测量精度的重要指标，该指标值越小，说明水准测量精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "每千米高差中误差反映水准测量精度，其值越小意味着测量误差越小，精度就越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193498", "t": 3, "q": "在水利水电工程角度测量中，测站点偏心误差是指测站点标志中心与仪器对中中心不重合产生的误差，该误差对水平角观测值的影响与观测目标的距离成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "测站点偏心误差对水平角观测值的影响与观测目标的距离成反比，并非成正比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193499", "t": 3, "q": "水利水电工程地形图应用中，汇水面积的计算精度主要取决于地形图的比例尺和等高线的绘制精度，比例尺越大、等高线精度越高，汇水面积计算精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "地形图比例尺大、等高线精度高时，能更精确反映地形地貌，使汇水区域边界确定更准确，从而提高汇水面积计算精度。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193500", "t": 3, "q": "在水利水电工程测量中，系统误差和偶然误差可以同时存在于一组观测值中，处理时需先消除系统误差，再对偶然误差进行统计处理。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在实际测量中，系统误差和偶然误差确实常同时存在于一组观测值里，且系统误差有累积性，会影响测量结果准确性，所以要先消除，之后再对偶然误差做统计处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193501", "t": 3, "q": "全站仪在水利水电工程测量中，若仪器的加常数误差未进行改正，会导致所有距离测量值存在一个固定的偏差，该偏差属于系统性误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "加常数误差对所有距离测量值影响是固定的，符合系统性误差在相同观测条件下，误差大小和符号保持不变或按一定规律变化的特点。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193502", "t": 3, "q": "在水利水电工程平面控制网中，导线网的多余观测数越多，控制网的点位中误差越小，因此应尽可能增加多余观测数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "增加多余观测数虽能提高控制网可靠性和精度，但会增加成本和工作量，需综合考虑成本、效率等因素，并非单纯尽可能增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193503", "t": 3, "q": "在水利水电工程水准测量中，大气折光误差是由于大气密度随高度变化导致光线折射，该误差可通过在水准尺上安装圆水准器，使水准尺竖直来减弱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "安装圆水准器使水准尺竖直是为了减弱水准尺倾斜误差，而大气折光误差应通过使前后视距相等、选择合适观测时间等方法减弱，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193504", "t": 3, "q": "水利水电工程地形图测绘中，等高线的绘制应根据碎部点的高程，采用内插法生成，相邻等高线之间的碎部点数量越多，等高线绘制精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "碎部点是测量地形特征的点，用内插法根据其高程绘等高线，相邻等高线间碎部点多，能更准确反映地形起伏，使等高线绘制精度更高。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193505", "t": 3, "q": "在水利水电工程施工测量中，三角高程测量法适用于地形复杂、水准测量难以实施的区域，其高程放样精度与水平距离测量精度和垂直角观测精度均有关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三角高程测量无需水准尺，在地形复杂、水准测量难以开展的区域较适用，且其高程放样精度确实与水平距离测量精度和垂直角观测精度都有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193506", "t": 3, "q": "在水利水电工程GNSS测量中，卫星星历误差是由于卫星轨道参数不准确引起的，可通过采用精密星历或进行星历误差改正来减弱其影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "卫星星历误差的确是因卫星轨道参数不准确导致，采用精密星历或进行星历误差改正能有效减弱其影响。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193507", "t": 3, "q": "在水利水电工程角度测量中，方向观测法观测水平角时，归零差是指各方向观测值与归零方向观测值的差值，归零差的大小反映了仪器稳定性和观测精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193508", "t": 3, "q": "水利水电工程地形图应用中，土方量计算的断面法适用于长条状区域（如渠道、道路），该方法的计算精度主要取决于断面的数量和断面测量的精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "断面法在水利水电工程土方量计算里，确实适合长条状区域，且其计算精度受断面数量和断面测量精度影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193509", "t": 3, "q": "在水利水电工程水准测量中，水准路线的测站数越多，高差闭合差的绝对值越大，因此应尽量减少测站数以降低闭合差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193510", "t": 3, "q": "在水利水电工程测量中，对某一观测值进行多次等精度观测，单次观测值的中误差是衡量单次观测精度的指标，算术平均值的中误差是衡量平均值精度的指标，后者小于前者。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在等精度观测中，算术平均值的中误差与单次观测值中误差关系为「test/yiwen_img/importSubject/2035637088317214720.png」（M为算术平均值中误差，m为单次观测值中误差，n为观测次数且n>1），所以算术平均值的中误差小于单次观测值中误差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193511", "t": 3, "q": "水利水电工程施工放样中，若采用后方交会法放样，当三个已知点构成的三角形内角过小（如小于30°）时，会出现放样点位置不确定的\"危险圆\"问题，应避免这种情况。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "后方交会法中，三个已知点构成三角形内角过小（小于30°）会产生“危险圆”，导致放样点位置不确定，所以要避免。", "ap": [false, false, false, false, false, false]}]}, {"k": "第2章 水利与水电||第2节 工程地质基础", "n": "第2章 水利与水电 / 第2节 工程地质基础", "qs": [{"id": "2035637097234305024", "t": 1, "q": "下列关于\"岩溶发育区水利工程选址\"的原则，正确的是（　）", "a": ["应选择岩溶发育强烈、溶洞密集的区域，便于排水", "应选择岩溶发育微弱、岩层完整、无大规模溶洞的区域", "可选择在溶洞顶板厚度小于2米的区域，只需进行简单注浆处理", "应选择在地下暗河主通道上方，便于利用地下水资源", "", ""], "r": "B", "e": "水利工程选址要保证安全稳定，岩溶发育强烈、溶洞密集、顶板薄及地下暗河主通道上方等区域，工程建设易出现塌陷、渗漏等问题，而发育微弱、岩层完整、无大规模溶洞区域相对安全稳定。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305025", "t": 1, "q": "某水利工程勘察采用地震波勘探，测定岩体纵波速度vp=4000米/秒，横波速度vs=2300米/秒，该岩体的泊松比μ（公式:μ=(vp²-2vs²)/(2(vp²-vs²))）约为（　）", "a": ["0.23", "0.25", "0.33", "0.38", "", ""], "r": "B", "e": "代入公式：μ=(4000²-2×2300²)/(2×(4000²-2300²))=(16000000-10580000)/(2×10710000)=5420000/21420000≈0.253，最接近0.25，选B。", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305026", "t": 1, "q": "下列岩石的抗剪强度指标中，与水利工程坝基抗滑稳定计算直接相关的是（　）", "a": ["岩石的抗压强度", "岩石的抗拉强度", "岩石结构面的内摩擦角和黏聚力", "岩石的弹性模量", "", ""], "r": "C", "e": "坝基抗滑稳定主要取决于岩石结构面的抗剪能力，抗剪强度由内摩擦角和黏聚力决定。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305027", "t": 1, "q": "某水利枢纽基坑开挖过程中，发现坑底土层为饱和粉土，当开挖深度达到5米时，出现\"流土\"现象，其主要原因是（　）", "a": ["基坑开挖速度过快，土颗粒来不及排水固结", "饱和粉土渗透系数大，水位差导致水流速度快", "基坑底处的有效应力为零，土颗粒失去抗剪强度", "饱和粉土黏聚力大，开挖后易形成塑性区", "", ""], "r": "C", "e": "流土是在渗流作用下，土体中的颗粒群同时发生移动的现象，当坑底处有效应力为零，土颗粒就会失去抗剪强度，产生流土。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305028", "t": 1, "q": "下列关于\"地质剖面图\"在水利工程勘察中的作用，错误的是（　）", "a": ["可反映地下岩层的分布、厚度及产状", "可显示断层、裂隙等地质构造的位置和性质", "可直接确定坝基岩体的渗透系数", "可辅助判断地下水位的埋藏深度", "", ""], "r": "C", "e": "地质剖面图能呈现岩层分布、构造等情况，但渗透系数需通过专门试验测定，不能直接从剖面图确定。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305029", "t": 1, "q": "某水利工程边坡采用锚索加固，与锚杆相比，锚索的主要优势是（　）", "a": ["锚索长度更短，施工更便捷", "锚索可施加更大的预拉力，锚固深度更大", "锚索仅适用于黏性土边坡，锚杆适用于岩石边坡", "锚索成本更低，材料用量更少", "", ""], "r": "B", "e": "锚索能施加更大预拉力且锚固深度大，这是其相对锚杆的主要优势。A选项锚索长度一般更长；C选项锚索和锚杆适用范围并非如此绝对；D选项锚索成本通常更高。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305030", "t": 1, "q": "下列关于\"第四纪沉积物\"的说法，正确的是（　）", "a": ["第四纪沉积物形成时间早于第三纪，岩性更坚硬", "洪积物多分布于河流出山口，呈扇形分布，颗粒分选性好", "冲积物多分布于河流中下游平原，层理清晰，颗粒分选性较好", "风积物仅分布于干旱地区，颗粒均为细砂，无层理构造", "", ""], "r": "C", "e": "第四纪晚于第三纪，A错；洪积物颗粒分选性差，B错；风积物并非仅分布于干旱地区，且有层理构造，D错；冲积物多在河流中下游平原，层理清晰、分选性较好，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305031", "t": 1, "q": "在水利水电工程地质勘察中，某区域岩石呈层状分布，层理面平整且有化石残骸，该岩石经风化后易形成泥质夹层，其成因类型最可能是（　）", "a": ["侵入型岩浆岩", "喷出型岩浆岩", "沉积岩", "变质岩", "", ""], "r": "C", "e": "沉积岩有层理构造，常含化石，风化后易形成泥质夹层，题中描述的岩石特征符合沉积岩特点。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305032", "t": 1, "q": "某水利枢纽坝基存在一组走向与坝轴线平行、倾向下游的裂隙，裂隙间距2-3米，延伸长度超过10米，该裂隙对坝基稳定性的主要影响是（　）", "a": ["增加坝基抗滑稳定性", "降低坝基渗透稳定性", "提高坝基承载力", "减小坝基沉降量", "", ""], "r": "B", "e": "走向与坝轴线平行、倾向下游的裂隙会使坝基的渗流路径变短，水更容易通过裂隙渗透，从而降低坝基渗透稳定性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305033", "t": 1, "q": "下列关于岩石单轴抗压强度与水利工程关系的说法，正确的是（　）", "a": ["岩石单轴抗压强度越大，其软化系数一定越高", "岩石单轴抗压强度小于5MPa时，不宜作为重力坝坝基持力层", "岩石单轴抗压强度仅与岩石矿物成分有关，与岩石结构无关", "岩石单轴抗压强度测试时，试件高径比不影响测试结果", "", ""], "r": "B", "e": "A选项，抗压强度和软化系数无必然联系；C选项，抗压强度与岩石结构有关；D选项，试件高径比会影响测试结果。而当岩石单轴抗压强度小于5MPa时，强度较低，不宜作为重力坝坝基持力层。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305034", "t": 1, "q": "某水电站地下厂房选址区存在岩溶地貌，勘察发现溶洞顶板厚度为8米，溶洞跨度为12米，岩石单轴抗压强度为60MPa，按经验公式判断该溶洞顶板的稳定性（经验公式:稳定顶板厚度H≥0.8×跨度L，且需满足岩石强度足够）（　）", "a": ["稳定，因顶板厚度大于0.8×跨度", "不稳定，因顶板厚度小于0.8×跨度", "稳定，因岩石单轴抗压强度高", "不稳定，因溶洞跨度超过10米即不稳定", "", ""], "r": "B", "e": "根据经验公式，稳定顶板厚度H≥0.8×跨度L，0.8×12 = 9.6米，而实际顶板厚度8米＜9.6米，所以不稳定。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305035", "t": 1, "q": "在水利工程地质中，\"潜水\"的主要水文地质特征是（　）", "a": ["有两个稳定的隔水层，水位不受气候影响", "无稳定隔水顶板，水位随降水和蒸发变化", "埋藏于地表以下第一个稳定隔水层之上，受地质构造控制显著", "水流速度快，水质易受地表污染影响小", "", ""], "r": "B", "e": "潜水是埋藏于地表以下第一个稳定隔水层之上具有自由水面的重力水，无稳定隔水顶板，其水位会随降水和蒸发等气候因素变化。A选项有两个稳定隔水层是承压水特征；C选项潜水受气候影响大，非地质构造控制显著；D选项潜水水流速度慢，水质易受地表污染影响。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305036", "t": 1, "q": "某水利工程边坡岩体内存在一组缓倾角结构面，结构面内充填有厚度约5厘米的蒙脱石黏土，该边坡最可能发生的失稳类型是（　）", "a": ["崩塌", "平面滑动", "楔形滑动", "旋转滑动", "", ""], "r": "B", "e": "缓倾角结构面且充填蒙脱石黏土，易沿结构面发生平面滑动。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305037", "t": 1, "q": "下列关于水利工程地基处理中\"高压喷射注浆法\"的适用条件，错误的是（　）", "a": ["适用于处理淤泥质土、黏性土、粉土", "不适用于处理含有较多大粒径（大于20厘米）块石的土层", "适用于处理地下水位以下的土层", "不适用于处理渗透系数大于10-2厘米/秒的砂土层", "", ""], "r": "D", "e": "高压喷射注浆法适用于处理淤泥质土、黏性土、粉土等，能处理地下水位以下土层，也可处理渗透系数大的砂土层。但对含较多大粒径（大于20厘米）块石的土层处理效果差。所以错误的是D。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305038", "t": 1, "q": "在地质构造中，\"逆断层\"的受力状态及位移特征是（　）", "a": ["受水平拉应力作用，上盘相对向下滑动", "受水平压应力作用，上盘相对向上滑动", "受垂直应力作用，下盘相对向上滑动", "受扭应力作用，两盘沿水平方向相对错动", "", ""], "r": "B", "e": "逆断层是受水平压应力作用形成，其特征是上盘相对向上滑动。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305039", "t": 1, "q": "下列岩石中，属于变质岩且主要由区域变质作用形成的是（　）", "a": ["大理岩", "片麻岩", "石英岩（热接触变质形成）", "蛇纹岩", "", ""], "r": "B", "e": "区域变质作用是大面积发生的变质作用。大理岩是由石灰岩经接触变质或区域变质形成；石英岩是热接触变质形成，不符合区域变质要求；蛇纹岩成因复杂。片麻岩是典型由区域变质作用形成的变质岩。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305040", "t": 1, "q": "水利水电工程中，\"管涌\"发生的主要条件是（　）", "a": ["土颗粒均匀，渗透水流速小于临界流速", "土颗粒级配不良，细颗粒含量少，渗透水流速大于临界流速", "土颗粒不均匀，粗颗粒形成骨架，细颗粒填充孔隙，渗透水流速大于细颗粒启动流速", "土颗粒呈黏性，渗透系数小，水位差大", "", ""], "r": "C", "e": "管涌发生需土颗粒不均匀，粗颗粒形成骨架，细颗粒填充孔隙，且渗透水流速大于细颗粒启动流速。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305041", "t": 1, "q": "某水利枢纽坝址区存在一条活动性断层，勘察确定其最新活动时代为第四纪晚更新世，该断层对工程的主要影响是（　）", "a": ["仅影响坝体混凝土浇筑质量", "可能引发坝基不均匀沉降和地震风险", "对坝基渗透稳定性无影响", "仅导致坝基岩石风化速度加快", "", ""], "r": "B", "e": "活动性断层会使坝基受力不均，导致不均匀沉降，且可能引发地震。A选项，断层对混凝土浇筑质量无直接影响；C选项，断层会影响坝基渗透稳定性；D选项，断层主要影响结构稳定性，并非仅加快岩石风化速度。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305042", "t": 1, "q": "下列关于岩石风化程度分级与水利工程关系的说法，正确的是（　）", "a": ["微风化岩石抗压强度高，可直接作为高坝坝基，无需处理", "中风化岩石裂隙较发育，必须全部挖除后才能作为坝基", "强风化岩石强度低，仅可作为临时挡土结构的地基", "全风化岩石可视为土，其承载力满足要求时可作为低水头建筑物地基", "", ""], "r": "D", "e": "微风化岩石虽抗压强度高，但可能仍需一定处理，A错误；中风化岩石不一定全部挖除，可根据情况处理后作坝基，B错误；强风化岩石强度低，一般不适合做临时挡土结构地基，C错误；全风化岩石可视为土，承载力满足要求时可作低水头建筑物地基，D正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305043", "t": 1, "q": "在水文地质勘察中，\"承压水\"的水头压力与工程建设的关系，错误的是（　）", "a": ["承压水水头高于地表时，钻孔会出现自流水现象", "基坑开挖时，若承压水水头高于基坑底，可能导致基坑突涌", "承压水水头压力越大，对隧道衬砌的侧压力越小", "承压水补给区与排泄区距离远，水位变化较缓慢", "", ""], "r": "C", "e": "承压水水头压力越大，对隧道衬砌的侧压力应越大，C选项说法错误。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305044", "t": 1, "q": "某水利工程边坡治理中，采用锚杆支护，其主要作用是（　）", "a": ["增加边坡岩体的重量，提高抗滑力", "将边坡表层岩体与深部稳定岩体连接，传递拉力", "填充岩体裂隙，提高岩体完整性", "降低边坡岩体的渗透系数，减少渗水", "", ""], "r": "B", "e": "锚杆是将一端固定在稳定的岩体中，另一端与边坡表层岩体连接，能把边坡表层不稳定岩体与深部稳定岩体连为一体，传递拉力，增强边坡稳定性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305045", "t": 1, "q": "下列地质现象中，属于\"物理风化\"的是（　）", "a": ["岩石中的长石经水作用分解为高岭土", "岩石因温度变化产生膨胀收缩，导致裂隙发育", "岩石中的黄铁矿氧化生成硫酸，腐蚀岩石", "岩石被水流携带的泥沙磨损", "", ""], "r": "B", "e": "物理风化是指岩石在温度变化、水、风等作用下，发生机械破碎而化学成分不变的过程。A选项是化学分解，C选项是氧化腐蚀，都属于化学风化；D选项是侵蚀作用。B选项岩石因温度变化产生膨胀收缩致裂隙发育，属于物理风化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305046", "t": 1, "q": "某水电站坝基为花岗岩，勘察发现岩体中存在三组裂隙，其产状分别为:①30°∠60°、②120°∠55°、③210°∠65°，坝轴线方向为0°，若仅考虑裂隙组合对坝基抗滑的影响，最不利的裂隙组合是（　）", "a": ["①和②", "①和③", "②和③", "仅①", "", ""], "r": "C", "e": "分析：坝轴线方向为0°，要找最不利裂隙组合，需考虑裂隙组合后形成楔形体的滑动可能性。裂隙走向与坝轴线夹角大、倾角合适易形成不利滑动面。②和③走向与坝轴线夹角大，组合易形成不利楔形体。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305047", "t": 1, "q": "水利工程中，\"地基承载力特征值\"的确定方法，错误的是（　）", "a": ["可通过平板载荷试验直接测定", "可根据岩石单轴抗压强度按经验公式计算（如fak=ψr×frk）", "可通过标准贯入试验锤击数，结合地区经验确定", "仅能通过室内土工试验测定土的物理指标后计算，无法现场测定", "", ""], "r": "D", "e": "地基承载力特征值确定方法多样，可通过平板载荷试验直接测、根据岩石单轴抗压强度计算、结合标准贯入试验锤击数和地区经验确定，也能现场测定，并非仅靠室内土工试验计算。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305048", "t": 1, "q": "某区域地下水位下降后，周边水利工程边坡出现变形，其主要原因是（　）", "a": ["地下水位下降，边坡岩体重量减轻，抗滑力减小", "地下水位下降，岩体有效应力增大，导致裂隙闭合", "地下水位下降，改变边坡岩体渗流方向，产生动水压力", "地下水位下降，岩体孔隙水压力减小，有效应力增大，可能引发岩体压缩变形", "", ""], "r": "D", "e": "地下水位下降，岩体孔隙水压力减小，有效应力增大，会使岩体产生压缩变形，进而导致边坡变形。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305049", "t": 1, "q": "某水电站地下洞室开挖后，洞壁出现渗水，且水质检测发现水中含有较多钙离子和碳酸氢根离子，该渗水最可能来源于（　）", "a": ["潜水", "承压水", "岩溶水", "裂隙水（非岩溶）", "", ""], "r": "C", "e": "岩溶水富含钙离子和碳酸氢根离子，符合题目中渗水水质特征。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305050", "t": 1, "q": "水利工程中，\"岩体完整性系数\"（KV）是根据岩体纵波速度与岩块纵波速度的比值计算（KV=(vpm/vpr)²），某岩体vpm=3500米/秒，vpr=5000米/秒，该岩体的完整性等级为（　）", "a": ["完整（KV>0.75）", "较完整（0.55<KV≤0.75）", "较破碎（0.35<KV≤0.55）", "破碎（KV≤0.35）", "", ""], "r": "C", "e": "先根据公式计算「test/yiwen_img/importSubject/2035637094780637184.png」，「test/yiwen_img/importSubject/2035637094923243520.png」，所以该岩体完整性等级为较破碎。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305051", "t": 1, "q": "下列关于\"边坡稳定系数\"的说法，正确的是（　）", "a": ["边坡稳定系数是抗滑力与滑动力的比值，比值大于1.0即绝对稳定", "水利工程中，永久边坡的稳定系数允许值通常比临时边坡小", "采用不同的计算方法（如极限平衡法、数值分析法）计算同一边坡，稳定系数值一定相同", "边坡稳定系数受岩体强度、滑面形态、地下水等因素影响", "", ""], "r": "D", "e": "A选项，比值大于1只是基本稳定非绝对稳定；B选项，永久边坡稳定系数允许值通常比临时边坡大；C选项，不同计算方法结果不一定相同。边坡稳定系数受岩体强度、滑面形态、地下水等多种因素影响。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305052", "t": 1, "q": "某水利枢纽坝址区进行地质测绘，采用1:2000的比例尺，该比例尺测绘的主要目的是（　）", "a": ["查明区域地质构造轮廓，为坝址初选提供依据", "详细查明坝址区岩层分布、断层位置、裂隙发育情况，为坝体设计提供依据", "调查流域范围内的地质灾害分布，为防灾规划提供依据", "了解区域地层岩性分布，为可行性研究阶段提供基础资料", "", ""], "r": "B", "e": "1:2000属于大比例尺，大比例尺测绘精度高，可详细查明坝址区岩层分布、断层位置、裂隙发育情况，为坝体设计提供依据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770304", "t": 2, "q": "影响水利水电工程边坡稳定性的内在地质因素有（　）", "a": ["岩体的岩性", "岩体的地质构造（如断层、裂隙）", "边坡的坡率", "岩体的风化程度", "地下水位变化", ""], "r": "ABD", "e": "内在地质因素主要是岩体自身特性相关的。岩性、地质构造、风化程度都属于岩体自身内在因素；坡率是人为设计的，地下水位变化是外部因素。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770305", "t": 2, "q": "下列岩石中，属于岩浆岩的有（　）", "a": ["花岗岩", "玄武岩", "辉绿岩", "大理岩", "片麻岩", ""], "r": "ABC", "e": "岩浆岩是岩浆冷却凝固形成，花岗岩、玄武岩、辉绿岩都属岩浆岩。大理岩是石灰岩变质而成的变质岩，片麻岩也是变质岩。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770306", "t": 2, "q": "水利工程中，常用的岩体渗透系数测定方法有（　）", "a": ["钻孔压水试验", "抽水试验", "注水试验", "室内土工试验（如变水头渗透试验）", "标准贯入试验", ""], "r": "ABCD", "e": "钻孔压水、抽水、注水试验以及室内土工试验（如变水头渗透试验）都可用于测定岩体渗透系数，而标准贯入试验主要是测土的密实度等，与渗透系数测定无关。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770307", "t": 2, "q": "岩溶（喀斯特）发育的必要条件包括（　）", "a": ["岩石具有可溶性（如石灰岩、白云岩）", "岩石具有透水性（如裂隙、孔隙发育）", "水具有溶蚀性（如含二氧化碳的水）", "水具有流动性（保证溶蚀持续进行）", "岩石具有较高的抗压强度", ""], "r": "ABCD", "e": "岩溶发育需岩石可溶、透水，水有溶蚀性和流动性，抗压强度与岩溶发育无关。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770308", "t": 2, "q": "下列地质构造中，属于断裂构造的有（　）", "a": ["断层", "节理", "褶皱", "劈理", "背斜", ""], "r": "ABD", "e": "答案：ABD【解析】断裂构造指岩层在构造运动作用下，岩层发生了断裂和错位而形成的地质构造，包括断层、节理和劈理等。褶皱和背斜属于褶皱构造，不属于断裂构造。因此，选项A、B、D正确，选项C、E错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770309", "t": 2, "q": "水利水电工程地基处理中，用于提高地基承载力的方法有（　）", "a": ["换填垫层法", "强夯法", "高压喷射注浆法", "锚杆支护法", "固结灌浆法", ""], "r": "ABCE", "e": "换填垫层、强夯、高压喷射注浆、固结灌浆都可改善地基性质提高承载力，锚杆支护主要是加固岩土体，不是提高地基承载力的常规方法。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770310", "t": 2, "q": "下列关于第四纪沉积物类型的说法，正确的有（　）", "a": ["冲积物是河流搬运沉积形成，层理清晰", "洪积物是山洪搬运沉积形成，分选性差", "风积物是风力搬运沉积形成，如黄土", "湖积物是湖泊沉积形成，颗粒多为细粒，有机质含量高", "海积物仅分布于深海区域，颗粒均为黏土", ""], "r": "ABCD", "e": "冲积物由河流搬运沉积，层理清晰；洪积物由山洪搬运沉积，分选性差；风积物由风力搬运沉积，黄土是典型风积物；湖积物由湖泊沉积，多细粒且有机质含量高；海积物分布于海岸带等，并非仅在深海，颗粒多样。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770311", "t": 2, "q": "水利工程中，判断坝基岩体是否存在\"软弱夹层\"的主要依据有（　）", "a": ["夹层岩性比上下岩层软弱（如黏土岩、页岩）", "夹层厚度大于1米", "夹层的抗剪强度显著低于上下岩层", "夹层多呈层状或透镜状分布", "夹层中含有大量化石", ""], "r": "ACD", "e": "软弱夹层指岩体内力学强度显著低于上下相邻岩层的薄弱层，岩性通常比上下岩层软弱，抗剪强度低，多呈层状或透镜状。厚度无大于1米要求，含大量化石不是判断依据。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770312", "t": 2, "q": "影响岩石风化速度的因素有（　）", "a": ["岩石的矿物成分（如长石易风化，石英难风化）", "岩石的结构构造（如裂隙发育则风化快）", "气候条件（如高温多雨地区风化快）", "地形地貌（如陡坡比缓坡风化快）", "工程开挖深度（开挖越深风化越严重）", ""], "r": "ABCD", "e": "岩石矿物成分、结构构造、气候条件、地形地貌都会影响岩石风化速度，如不同矿物抗风化能力不同，裂隙发育利于风化，温湿气候加快风化，陡坡风化产物易被移除使新岩石暴露加快风化。而工程开挖深度与风化严重程度无必然关联。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770313", "t": 2, "q": "下列关于\"地下水位\"对水利工程影响的说法，正确的有（　）", "a": ["地下水位上升，可能导致坝基土的承载力降低", "地下水位上升，可能增加边坡的滑动力，诱发滑坡", "地下水位下降，可能导致地面沉降", "地下水位下降，可能增加岩体的有效应力，提高抗剪强度", "地下水位稳定，对工程无任何影响", ""], "r": "ABCD", "e": "地下水位上升会使坝基土含水量增加，承载力降低，也会增加边坡滑动力易诱发滑坡；地下水位下降会使土体压缩，导致地面沉降，同时增加岩体有效应力提高抗剪强度；地下水位稳定也可能因其他因素对工程有影响，并非无任何影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770314", "t": 2, "q": "水利水电工程地质勘察中，常用的物探方法有（　）", "a": ["地震波勘探（如纵波、横波测试）", "电法勘探（如高密度电阻率法）", "重力勘探", "钻探（如岩芯钻探）", "磁法勘探", ""], "r": "ABCE", "e": "物探是地球物理勘探的简称，是利用仪器探测各种地球物理场的变化来探测地层岩性等。钻探是直接获取岩芯等进行分析，不属于物探方法。A、B、C、E选项均为常见物探方法。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770315", "t": 2, "q": "下列关于\"岩体完整性\"的说法，正确的有（　）", "a": ["岩体完整性系数KV越大，岩体越完整", "完整岩体的纵波速度接近岩块纵波速度", "裂隙发育的岩体，完整性系数小", "岩体完整性仅与裂隙数量有关，与裂隙间距无关", "完整岩体的抗压强度远高于破碎岩体", ""], "r": "ABCE", "e": "岩体完整性系数KV反映岩体完整性，KV越大越完整；完整岩体纵波速度与岩块接近；裂隙发育完整性差，系数小；岩体完整性与裂隙数量、间距等都有关；完整岩体抗压强度高于破碎岩体。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770316", "t": 2, "q": "水利工程中，\"流土\"与\"管涌\"的区别有（　）", "a": ["流土多发生于均匀细粒土，管涌多发生于不均匀土", "流土是土颗粒整体流动，管涌是细颗粒被带走", "流土发生时水位差小，管涌发生时水位差大", "流土对工程危害小于管涌", "流土多发生于渗流出口处，管涌可发生于土体内部", ""], "r": "ABE", "e": "流土多在均匀细粒土、渗流出口处，是土颗粒整体流动；管涌在不均匀土中，细颗粒被带走，可发生于土体内部。流土和管涌发生时水位差大小无绝对关系，且流土危害不一定小于管涌。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770317", "t": 2, "q": "下列地质现象中，属于\"化学风化\"的有（　）", "a": ["岩石中的方解石被雨水溶解", "岩石中的铁矿物氧化生成铁锈", "岩石因冻融作用产生裂隙", "岩石中的长石水解生成黏土矿物", "岩石被风携带的砂粒磨损", ""], "r": "ABD", "e": "化学风化是指岩石在水、氧气、二氧化碳等作用下发生化学成分变化而破坏。A选项方解石被雨水溶解、B选项铁矿物氧化、D选项长石水解都涉及化学成分改变，属于化学风化；C选项冻融作用是物理风化，E选项岩石被砂粒磨损是物理风化。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770318", "t": 2, "q": "水利枢纽坝址选择应避开的区域有（　）", "a": ["活动性断层发育区", "岩溶强烈发育区", "微风化花岗岩分布区", "深厚覆盖层区（厚度大于50米）", "边坡稳定性差的区域", ""], "r": "ABDE", "e": "活动性断层、岩溶强烈发育、深厚覆盖层及边坡稳定性差的区域，会影响坝体安全和稳定，不宜选作坝址；微风化花岗岩强度高、完整性好，是良好的坝基。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770319", "t": 2, "q": "下列关于\"锚杆支护\"在水利工程边坡中的作用，正确的有（　）", "a": ["传递边坡表层岩体的拉力至深部稳定岩体", "增加边坡岩体的黏聚力", "抑制岩体裂隙的扩展", "提高边坡岩体的渗透系数", "减轻边坡岩体的自重", ""], "r": "ABC", "e": "锚杆支护可将边坡表层拉力传至深部稳定岩体，增加岩体黏聚力，抑制裂隙扩展。而锚杆支护不会提高岩体渗透系数，也不能减轻岩体自重。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770320", "t": 2, "q": "水利工程中，测定土的抗剪强度指标（内摩擦角φ、黏聚力c）的方法有（　）", "a": ["直接剪切试验", "三轴压缩试验", "无侧限抗压强度试验（适用于黏性土，可间接求c）", "平板载荷试验", "标准贯入试验", ""], "r": "ABC", "e": "直接剪切试验、三轴压缩试验、无侧限抗压强度试验可测定土的抗剪强度指标（内摩擦角φ、黏聚力c）。平板载荷试验用于测定地基土的承载能力等，标准贯入试验主要测试土层的密实度等。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770321", "t": 2, "q": "下列关于\"地质构造\"对水利工程影响的说法，正确的有（　）", "a": ["褶皱轴部裂隙发育，易发生渗漏，不宜作为坝基", "断层破碎带透水性强，易导致坝基渗透破坏", "单斜岩层若倾向下游，且倾角较缓，易形成坝基滑动面", "节理密集带岩体完整性差，承载力低，需处理后作为坝基", "背斜构造核部岩体完整，是理想的坝基", ""], "r": "ABCD", "e": "褶皱轴部裂隙多易渗漏，A对；断层破碎带透水性强会致坝基渗透破坏，B对；单斜岩层倾向下游且倾角缓易成坝基滑动面，C对；节理密集带岩体差承载力低，需处理后作坝基，D对；背斜核部受张力裂隙发育，岩体不完整，不是理想坝基，E错。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770322", "t": 2, "q": "下列关于\"岩石软化系数\"的说法，正确的有（　）", "a": ["岩石软化系数是岩石饱和单轴抗压强度与干燥单轴抗压强度的比值", "软化系数小于0.75的岩石，称为软化岩石，抗水稳定性差", "软化系数越大，岩石抗水稳定性越好", "软化系数仅与岩石的矿物成分有关，与岩石结构无关", "花岗岩的软化系数通常大于石灰岩", ""], "r": "ABCE", "e": "岩石软化系数是饱和单轴抗压强度与干燥单轴抗压强度比值，小于0.75为软化岩石、抗水稳定性差，系数越大抗水稳定性越好；其与岩石矿物成分和结构都有关；花岗岩抗水稳定性好，软化系数通常大于石灰岩。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770323", "t": 2, "q": "水利水电工程中，常用的边坡失稳防治措施有（　）", "a": ["削坡减载（降低边坡高度或放缓坡率）", "锚杆或锚索支护", "注浆加固（填充裂隙，提高岩体强度）", "设置排水系统（降低地下水位，减少渗压）", "浇筑混凝土垫层（仅用于临时边坡）", ""], "r": "ABCD", "e": "ABCD选项都是常见的边坡失稳防治措施，削坡减载可降低边坡压力，锚杆或锚索支护增强边坡稳定性，注浆加固提高岩体强度，设置排水系统减少渗压。而浇筑混凝土垫层不是仅用于临时边坡，且不是主要的边坡失稳防治措施。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770324", "t": 2, "q": "下列关于\"承压水突涌\"的说法，正确的有（　）", "a": ["承压水突涌多发生于基坑开挖至承压水含水层顶板以下时", "当基坑底处承压水水头压力大于上覆土层重量时，易发生突涌", "预防承压水突涌的措施包括降水减压、设置抗突涌桩", "承压水突涌对工程危害小，无需特殊防治", "承压水突涌仅发生于黏性土基坑，砂性土基坑不会发生", ""], "r": "ABC", "e": "承压水突涌多在基坑开挖到承压水含水层顶板以下，当承压水水头压力大于上覆土层重量易发生，可通过降水减压、设抗突涌桩预防，危害大需防治，且砂性土基坑也会发生。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770325", "t": 2, "q": "水利工程地质勘察中，钻孔岩芯编录的主要内容有（　）", "a": ["岩性名称及颜色", "岩层的产状（走向、倾向、倾角）", "岩芯的采取率和RQD值", "岩体中裂隙的发育情况（数量、产状、充填物）", "地下水位的埋藏深度", ""], "r": "ABCD", "e": "钻孔岩芯编录要记录岩芯本身相关特征及地质情况。A岩性名称及颜色是岩芯基本特征；B岩层产状反映地质构造；C岩芯采取率和RQD值体现岩芯完整性；D岩体裂隙发育情况对工程有重要影响；E地下水位埋藏深度并非岩芯编录主要内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770326", "t": 2, "q": "下列关于\"RQD值\"（岩石质量指标）的说法，正确的有（　）", "a": ["RQD是指钻孔中长度大于10厘米的岩芯段长度与钻孔进尺长度的比值（百分比）", "RQD值越大，岩体质量越好", "RQD值为85%时，岩体质量等级为良好", "RQD值仅反映岩体的完整性，与岩体强度无关", "RQD值的测定无需考虑岩芯的破碎原因（如钻探破坏或天然破碎）", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770327", "t": 2, "q": "影响水利工程地下洞室稳定性的因素有（　）", "a": ["洞室的形状和尺寸（如圆形比矩形稳定）", "洞室的埋深（埋深大，围压大，可能更稳定）", "岩体的强度和完整性", "地下水位（水位高，易渗水，降低稳定性）", "洞室的开挖顺序（如分步开挖比全断面开挖稳定）", ""], "r": "ABCDE", "e": "选项A中洞室形状和尺寸影响稳定性，圆形受力更均匀比矩形稳定；B埋深大围压大利于稳定；C岩体强度和完整性越好洞室越稳定；D地下水位高易渗水降低岩体强度影响稳定性；E合理的开挖顺序如分步开挖可减少对围岩扰动更稳定。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770328", "t": 2, "q": "下列关于\"风化壳\"的说法，正确的有（　）", "a": ["风化壳是岩石经风化作用形成的疏松表层，厚度从几厘米到数十米不等", "风化壳从上到下，风化程度逐渐减弱", "风化壳的成分与母岩成分完全相同，仅结构改变", "风化壳中的黏土矿物增多，透水性降低", "水利工程中，风化壳作为坝基时，需进行处理（如挖除、灌浆）", ""], "r": "ABDE", "e": "风化壳是岩石风化后形成的疏松表层，厚度不一，A正确；风化壳越往下受风化影响越小，风化程度减弱，B正确；风化过程会使成分改变，并非与母岩成分完全相同，C错误；黏土矿物增多，透水性会降低，D正确；风化壳强度低、透水性强，作坝基需处理，E正确。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770329", "t": 2, "q": "水利工程中，常用的防渗措施有（　）", "a": ["设置防渗墙（如混凝土防渗墙、帷幕灌浆墙）", "铺设土工膜", "固结灌浆", "帷幕灌浆（形成防渗帷幕）", "设置排水孔", ""], "r": "ABD", "e": "设置防渗墙、铺设土工膜、帷幕灌浆可直接阻止或减少水的渗透；固结灌浆主要是提高岩体整体性和强度；设置排水孔是排水而非防渗。答案为ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770330", "t": 2, "q": "下列关于\"断层\"对水利工程的影响，正确的有（　）", "a": ["断层破碎带易成为渗水通道，导致坝基渗漏", "活动性断层可能引发地震，影响工程安全", "断层两盘岩体差异风化，可能导致坝基不均匀沉降", "断层可作为坝基抗滑稳定的有利因素（如增加抗滑面）", "断层破碎带岩体强度低，需进行加固处理（如注浆）", ""], "r": "ABCE", "e": "断层破碎带孔隙多易渗水，会使坝基渗漏；活动性断层有地震风险威胁工程安全；断层两盘风化不同会造成坝基不均匀沉降；破碎带岩体强度低要加固。而断层一般不利于坝基抗滑稳定。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770331", "t": 2, "q": "下列关于\"土的压实度\"的说法，正确的有（　）", "a": ["土的压实度是土的实际干密度与最大干密度的比值（百分比）", "压实度越高，土的承载力越大，渗透性越小", "水利工程中，堤坝填土的压实度要求通常大于90%", "压实度仅与压实机械的吨位有关，与土的含水量无关", "黏性土的压实度最佳含水量高于砂性土", ""], "r": "ABCE", "e": "压实度是实际干密度与最大干密度比值百分比，压实度高承载力大、渗透性小，水利堤坝填土压实度常大于90%，压实度与压实机械和土含水量都有关，黏性土最佳含水量高于砂性土。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770332", "t": 2, "q": "水利水电工程地质勘察的不同阶段包括（　）", "a": ["规划阶段", "可行性研究阶段", "初步设计阶段", "施工图设计阶段", "运营阶段", ""], "r": "ABCD", "e": "水利水电工程地质勘察有规划、可行性研究、初步设计、施工图设计四个阶段。运营阶段不属于地质勘察阶段。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770333", "t": 2, "q": "下列关于\"边坡监测\"的内容，正确的有（　）", "a": ["位移监测（如水平位移、垂直位移）", "应力监测（如岩体应力、锚杆拉力）", "渗流监测（如渗流量、渗透压力）", "温度监测（如岩体温度、地下水温度）", "气象监测（如降雨量、风速）", ""], "r": "ABC", "e": "边坡监测是确保边坡稳定性的重要手段，涉及多种监测内容以全面评估边坡状态。常见的边坡监测内容包括： 位移监测：监测边坡的水平位移和垂直位移，了解边坡的形变情况。 应力监测：测量岩体应力和锚杆拉力，评估边坡内部应力状态。 渗流监测：监测渗流量和渗透压力，防止水分对边坡稳定性的不利影响。而以下监测内容不属于边坡监测的常规范畴： 温度监测（如岩体温度、地下水温度） 气象监测（如降雨量、风速）综上所述，正确答案是 A、B、C。所以，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947584", "t": 3, "q": "水利水电工程中，岩浆岩中的玄武岩因是喷出型岩浆岩，其结晶颗粒粗大，抗压强度高于侵入型岩浆岩中的花岗岩。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "玄武岩是喷出型岩浆岩，冷却速度快，结晶颗粒细小；花岗岩是侵入型岩浆岩，冷却速度慢，结晶颗粒粗大，且花岗岩抗压强度高于玄武岩。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947585", "t": 3, "q": "断层的上盘和下盘是根据断层两盘的相对位置划分的，若上盘相对向下滑动，则该断层为正断层。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "正断层定义就是上盘相对下盘沿断层面向下滑动的断层，此描述符合正断层特征。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947586", "t": 3, "q": "岩石的软化系数越大，说明岩石在饱和状态下的抗压强度与干燥状态下的抗压强度差异越小，岩石的抗水稳定性越差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "岩石软化系数越大，饱和与干燥状态抗压强度差异越小，岩石抗水稳定性越好，而不是越差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947587", "t": 3, "q": "水利工程中，管涌现象仅发生在基坑底部的渗流出口处，不会发生在土体内部。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "管涌不仅会发生在基坑底部渗流出口处，也可能发生在土体内部。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947588", "t": 3, "q": "岩体完整性系数KV是通过岩体纵波速度与岩块纵波速度的比值平方计算得出，KV值小于0.35时，岩体属于破碎等级。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "岩体完整性系数KV确实是岩体纵波速度与岩块纵波速度比值的平方，且当KV小于0.35时，岩体属于破碎等级。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947589", "t": 3, "q": "承压水具有稳定的隔水顶板和底板，其水位不受地表降水和蒸发的影响，始终保持稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "承压水虽有稳定隔水顶板和底板，水位受地表降水和蒸发影响小，但并非始终保持稳定，会受地质构造、人为开采等因素影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947590", "t": 3, "q": "水利枢纽坝址选择时，应优先选择褶皱构造的轴部区域，因为轴部岩体受挤压作用，完整性更好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "褶皱构造轴部岩体受挤压作用，裂隙发育，岩石破碎，完整性差，不利于坝址建设，不应优先选择轴部区域。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947591", "t": 3, "q": "强风化岩石的强度低、透水性强，不能作为水利工程坝基的持力层，必须全部挖除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "强风化岩石虽强度低、透水性强，但不一定都要全部挖除，可根据具体工程情况，通过适当处理措施使其满足坝基持力层要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947592", "t": 3, "q": "在边坡稳定计算中，边坡稳定系数是抗滑力与滑动力的比值，当稳定系数大于1.0时，边坡一定处于绝对稳定状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "稳定系数大于1.0只能说明理论上边坡有一定抗滑能力，但受地质条件复杂多变、不确定性因素影响，不能判定处于绝对稳定状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947593", "t": 3, "q": "岩溶发育区的水利工程，若溶洞顶板厚度大于0.8倍溶洞跨度，且岩石强度满足要求，则溶洞顶板可判定为稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在岩溶发育区水利工程中，一般当溶洞顶板厚度大于0.8倍溶洞跨度且岩石强度满足要求时，从工程经验和相关理论来看，溶洞顶板通常可判定为稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947594", "t": 3, "q": "地下水位下降会导致岩体的孔隙水压力减小，有效应力增大，从而提高岩体的抗剪强度，对边坡稳定有利。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947595", "t": 3, "q": "水利工程地基处理中的强夯法，主要适用于处理碎石土、砂土、低饱和度的黏性土，不适用于处理饱和软黏土。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "强夯法适用于处理碎石土、砂土、低饱和度的粉土与黏性土、湿陷性黄土、素填土和杂填土等，对于饱和软黏土效果不佳，一般不适用。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947596", "t": 3, "q": "岩石的单轴抗压强度测试中，试件的高径比（高度与直径的比值）对测试结果无影响，只需保证试件为圆柱形即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在岩石单轴抗压强度测试中，试件高径比会影响测试结果，并非无影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947597", "t": 3, "q": "地质剖面图可以清晰反映地下岩层的分布、厚度、产状及断层、裂隙等地质构造的位置，是水利工程设计的重要依据之一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "地质剖面图能直观呈现地下岩层的分布、厚度、产状等情况，也可显示断层、裂隙等地质构造位置，对水利工程设计评估地质条件很关键，是重要依据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947598", "t": 3, "q": "风积物仅分布在干旱、半干旱地区，其颗粒均为细砂，且无层理构造。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "风积物并非仅分布在干旱、半干旱地区，在一些湿润地区也可能有；风积物颗粒不只是细砂，还有粉砂等；风积物有交错层理等层理构造。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947599", "t": 3, "q": "水利工程中的锚杆支护，其主要作用是增加边坡岩体的重量，提高边坡的抗滑力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "锚杆支护主要是通过锚杆将边坡不稳定的岩体与稳定岩体连接起来，增强岩体的整体性和稳定性，并非增加边坡岩体重量来提高抗滑力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947600", "t": 3, "q": "岩溶水的水质通常含有较高的钙离子和碳酸氢根离子，这是因为岩溶水与石灰岩等可溶性岩石发生化学反应，溶解了岩石中的碳酸钙。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "石灰岩主要成分是碳酸钙，岩溶水与石灰岩发生反应，碳酸钙与水和二氧化碳反应生成可溶的碳酸氢钙，使水中含有较高钙离子和碳酸氢根离子。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947601", "t": 3, "q": "第四纪沉积物形成于第四纪时期（约260万年前至今），其岩性坚硬，固结程度高，是水利工程良好的地基材料。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "第四纪沉积物形成时间较近，岩性松散，固结程度低，并非水利工程良好的地基材料。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947602", "t": 3, "q": "水利工程边坡的平面滑动破坏，通常需要存在一组缓倾角的结构面，且该结构面的倾向与边坡的倾向一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "平面滑动破坏是水利工程边坡破坏的一种常见形式，其发生需有一组缓倾角结构面，且此结构面倾向和边坡倾向一致，这样边坡岩体才易沿该结构面滑动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947603", "t": 3, "q": "钻孔压水试验是测定岩体渗透系数的常用方法，试验段长度越长，测定的渗透系数值越准确。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "钻孔压水试验中，并非试验段长度越长测定的渗透系数越准确。试验段过长会使不同透水性岩体相互影响，掩盖局部特性，影响结果准确性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947604", "t": 3, "q": "褶皱构造中的背斜核部岩体，因受挤压作用，岩体完整性好，是水利枢纽坝址的理想选择区域。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "背斜核部受张力作用，岩石破碎，岩体完整性差，不利于建设水利枢纽坝址，该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947605", "t": 3, "q": "土的压实度是指土的实际干密度与最大干密度的比值，压实度越高，土的承载力越大，渗透性越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压实度定义就是土的实际干密度与最大干密度比值，压实度高意味着土更密实，承载力会增大，孔隙减少，渗透性变小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947606", "t": 3, "q": "水利工程中的帷幕灌浆，其目的是形成一道连续的防渗帷幕，阻止或减少坝基的渗流量，提高坝基的渗透稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "帷幕灌浆是水利工程中常用手段，就是为形成防渗帷幕，减少坝基渗流，提升渗透稳定性。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947607", "t": 3, "q": "岩石的风化程度越严重，其纵波速度越大，岩体完整性系数KV值越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "岩石风化程度越严重，其内部结构越松散、破碎，纵波速度会越小，岩体完整性系数KV值也越低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947608", "t": 3, "q": "地下水位上升会导致坝基土的饱和度增加，土的黏聚力和内摩擦角减小，从而降低坝基的承载力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "地下水位上升使坝基土饱和度增加，土中孔隙水压力增大，有效应力减小，会使黏聚力和内摩擦角降低，进而降低坝基承载力。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947609", "t": 3, "q": "水利工程勘察中的标准贯入试验，主要用于测定土的渗透系数，为坝基防渗设计提供依据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "标准贯入试验主要是测定土的密实度、估算地基土的容许承载力等，并非用于测定土的渗透系数。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947610", "t": 3, "q": "活动性断层是指第四纪以来（约260万年前至今）有过活动，且未来仍有可能活动的断层，水利工程应避开活动性断层发育区。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "活动性断层具有潜在的活动风险，可能引发地震等地质灾害，会对水利工程安全造成严重威胁，所以水利工程应避开其发育区，该描述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947611", "t": 3, "q": "流土现象多发生在均匀的细粒土（如粉土、黏土）中，当渗流速度大于土颗粒的启动流速时，土颗粒会被整体带出。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流土常发生于均匀的细粒土中，当渗流力达到或超过土的有效重度时，土颗粒会被整体带出，实质就是渗流速度大于土颗粒启动流速，该描述符合流土现象特征。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947612", "t": 3, "q": "岩体的RQD值（岩石质量指标）是指钻孔中长度大于15厘米的岩芯段长度与钻孔进尺长度的比值，RQD值越大，岩体质量越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947613", "t": 3, "q": "水利工程地下洞室的形状对其稳定性影响显著，圆形洞室比矩形洞室更稳定，因为圆形洞室受力均匀，无应力集中现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "圆形洞室在受力时能将压力均匀分散，不存在应力集中问题，相比矩形洞室，其稳定性更好，所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947614", "t": 3, "q": "岩石的抗拉强度远低于其抗压强度，水利工程中在计算坝基抗滑稳定时，无需考虑岩石的抗拉强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "因岩石抗拉强度远低于抗压强度，坝基抗滑稳定主要受抗压、抗剪等因素影响，抗拉强度对其影响极小可忽略，所以计算时无需考虑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947615", "t": 3, "q": "洪积物是由山洪搬运沉积形成的，多分布于河流出山口，其颗粒分选性好，层理清晰。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "洪积物颗粒分选性差、层理不清晰。而颗粒分选性好、层理清晰是冲积物的特点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947616", "t": 3, "q": "水利工程地基处理中的高压喷射注浆法，适用于处理含有较多大粒径（大于20厘米）块石的土层。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "高压喷射注浆法不适用于处理含有较多大粒径（大于20厘米）块石的土层，因大粒径块石会影响浆液喷射和扩散，难以保证处理效果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947617", "t": 3, "q": "地下水位的埋藏深度越浅，对水利工程边坡稳定越不利，因为浅水位会增加边坡的渗流压力，降低岩体抗剪强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "地下水位浅时，水的渗流会产生渗流压力，同时水对岩体有软化作用，会降低岩体抗剪强度，这对水利工程边坡稳定不利。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947618", "t": 3, "q": "地质测绘的比例尺越大，反映的地质细节越详细，水利工程坝址区通常采用1:2000-1:5000的大比例尺地质测绘。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "比例尺越大，图上单位距离代表的实地距离越短，能反映的地质细节就越详细。水利工程坝址区因需详细了解地质情况，常采用1:2000 - 1:5000的大比例尺地质测绘。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947619", "t": 3, "q": "岩石的弹性模量越大，说明岩石在受力作用下的变形越小，其刚度越大，对水利工程坝基的沉降控制越有利。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "弹性模量反映材料抵抗弹性变形能力，弹性模量越大，相同受力下变形越小，刚度越大，利于坝基沉降控制。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947620", "t": 3, "q": "水利工程中的固结灌浆，主要目的是提高岩体的透水性，加速岩体中孔隙水的排出，减少坝基沉降。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "固结灌浆主要目的是提高岩体的整体性和强度，降低岩体的透水性，而非提高透水性。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947621", "t": 3, "q": "岩溶发育的必要条件包括岩石可溶性、岩石透水性、水的溶蚀性和水的流动性，缺少其中任何一个条件，岩溶都无法发育。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "岩溶发育需岩石可溶才可能被溶蚀，岩石透水利于水流动和溶蚀作用，水有溶蚀性才能溶解岩石，水的流动能不断更新溶蚀介质，四个条件缺一不可。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947622", "t": 3, "q": "水利工程边坡监测中的位移监测，仅需监测边坡的水平位移，无需监测垂直位移。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程边坡监测中，水平位移和垂直位移都能反映边坡的稳定性情况，二者都需要监测。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947623", "t": 3, "q": "第四纪沉积物中的冲积物，多分布于河流中下游平原，其颗粒分选性好，层理清晰，是水利工程良好的地基材料。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冲积物多分布于河流中下游平原，颗粒分选性好、层理清晰，但冲积物压缩性高、强度较低，不是水利工程良好的地基材料。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第2章 水利与水电||第3节 水电站结构形式", "n": "第2章 水利与水电 / 第3节 水电站结构形式", "qs": [{"id": "2035637103496400896", "t": 1, "q": "水电站厂房的防渗设计中，针对厂房下游侧尾水位以下的墙体，需采用防渗措施，下列哪种防渗结构适用于水头较高、防渗要求严格的情况？", "a": ["沥青油毡防水层", "混凝土防渗墙", "水泥砂浆抹面", "土工膜防渗层", "", ""], "r": "B", "e": "混凝土防渗墙整体性好、防渗能力强，能承受较高水头，适用于水头较高、防渗要求严格的情况。而沥青油毡防水层耐久性差；水泥砂浆抹面防渗能力有限；土工膜防渗层在高水头下易破损。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400897", "t": 1, "q": "关于水电站水锤现象，下列说法正确的是？", "a": ["水锤压力只与水轮机导叶关闭时间有关", "间接水锤的危害通常大于直接水锤", "设置调压室可有效减小水锤压力", "水锤现象只发生在水轮机突然停机的工况", "", ""], "r": "C", "e": "水锤压力受多种因素影响，A错误；直接水锤危害通常大于间接水锤，B错误；水锤现象在多种工况下都可能发生，不只是水轮机突然停机，D错误；设置调压室能调节压力变化，有效减小水锤压力，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400898", "t": 1, "q": "某水电站采用坝后式厂房，其发电机层与水轮机层之间设置有中间层，该中间层的主要作用是？", "a": ["布置调速器、油压装置等辅助设备", "作为人员通行通道", "储存检修工具和备件", "增强厂房结构整体刚度", "", ""], "r": "A", "e": "发电机层与水轮机层间的中间层常用来布置调速器、油压装置等辅助设备。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400899", "t": 1, "q": "水轮机吸出高度（Hs）的设计计算需考虑防止气蚀，下列关于吸出高度的说法错误的是？", "a": ["Hs值越小，水轮机抗气蚀性能越好", "Hs与水轮机安装高程直接相关", "设计水头增大时，允许的Hs值通常减小", "水温升高会导致允许的Hs值增大", "", ""], "r": "D", "e": "水温升高，水的汽化压力增大，更易发生气蚀，允许的Hs值应减小，D说法错误。A中Hs小压力高不易气蚀，抗气蚀性能好；B中安装高程与Hs直接相关；C设计水头增大，压力变化大，允许Hs减小。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400900", "t": 1, "q": "水电站坝体混凝土浇筑中，为防止温度裂缝，需控制混凝土的最高温升，下列措施中不能有效降低混凝土最高温升的是？", "a": ["选用低热水泥", "减少水泥用量", "提高混凝土浇筑温度", "设置冷却水管", "", ""], "r": "C", "e": "低热水泥水化热低，减少水泥用量可降低水化热总量，设置冷却水管能带走热量，都有助于降低最高温升；而提高浇筑温度会使混凝土初始温度高，不利于控制最高温升。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400901", "t": 1, "q": "在水电站运行特性中，\"调峰\"是指水电站根据电网负荷变化调整出力，下列哪种水电站最适合承担调峰任务？", "a": ["无调节水库的引水式水电站", "日调节水库的坝式水电站", "年调节水库的混合式水电站", "径流式水电站", "", ""], "r": "B", "e": "答案：B调峰需要水电站能够快速调整出力以适应电网负荷的变化。日调节水库的坝式水电站由于水库容量适中，可以在较短时间内调整水位和出力，因此最适合承担调峰任务。其他类型的水电站要么调节能力有限（如无调节水库的引水式水电站和径流式水电站），要么调节周期较长（如年调节水库的混合式水电站），不太适合进行快速的调峰操作。", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400902", "t": 1, "q": "水轮机导叶的开度调节是通过调速器控制的，下列关于调速器工作原理的说法正确的是？", "a": ["调速器通过改变水轮机转轮直径来调整出力", "机械液压调速器的响应速度比电气液压调速器更快", "调速器的PID调节（比例-积分-微分）可实现出力的稳定控制", "调速器只在水轮机启动时发挥作用", "", ""], "r": "C", "e": "调速器的PID调节能综合比例、积分、微分作用，可对水轮机出力实现稳定控制；A选项，调速器通过调节导叶开度而非改变转轮直径调整出力；B选项，电气液压调速器响应速度比机械液压调速器快；D选项，调速器在水轮机运行全程都发挥作用，不只是启动时。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400903", "t": 1, "q": "水电站厂房的地基处理中，若地基岩体存在溶洞和裂隙，需采用灌浆处理，下列哪种灌浆类型主要用于填充岩体裂隙、提高地基整体性？", "a": ["帷幕灌浆", "固结灌浆", "接触灌浆", "回填灌浆", "", ""], "r": "B", "e": "固结灌浆是对岩石进行加固，填充岩体裂隙，提高其整体性和强度。帷幕灌浆是为防渗漏；接触灌浆是加强混凝土与基岩或钢板等接触面结合；回填灌浆是填充混凝土与围岩间空隙。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400904", "t": 1, "q": "在水电站结构形式中，某类水电站需依靠坝体挡水形成水库，且厂房通常布置在坝体下游侧或坝内，其水头主要由坝高决定，该类水电站属于以下哪种类型？", "a": ["引水式水电站", "坝式水电站", "混合式水电站", "抽水蓄能水电站", "", ""], "r": "B", "e": "坝式水电站依靠坝体挡水形成水库，厂房多在坝体下游侧或坝内，水头由坝高决定。引水式是利用引水道集中水头；混合式结合了坝式和引水式特点；抽水蓄能是利用上下水库调峰。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400905", "t": 1, "q": "水轮机选型设计中，需根据水电站的设计水头、设计流量和预期效率确定机型，若某水电站设计水头较低（小于30米）、流量较大，下列哪种水轮机最适合？", "a": ["混流式水轮机", "轴流式水轮机", "斜流式水轮机", "冲击式水轮机", "", ""], "r": "B", "e": "不同类型水轮机适用于不同水头和流量情况。轴流式水轮机适用于低水头、大流量的水电站。本题中水电站设计水头较低且流量较大，所以轴流式水轮机最合适。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400906", "t": 1, "q": "水电站厂房结构设计中，发电机层楼板需承受发电机定子、转子等重型设备荷载，其设计计算时需重点考虑的荷载组合是以下哪项？", "a": ["永久荷载+正常运行荷载", "永久荷载+校核洪水位荷载", "永久荷载+地震荷载+正常运行荷载", "临时荷载+施工荷载", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400907", "t": 1, "q": "关于水电站调压室的作用，下列说法错误的是？", "a": ["反射水锤波，保护引水系统和机组", "调节引水系统中的流量，稳定机组转速", "减小引水系统的水头损失", "在机组负荷变化时，补充或储存部分水量", "", ""], "r": "C", "e": "调压室主要作用是反射水锤波、调节流量稳定转速、负荷变化时补充或储存水量，不能减小引水系统水头损失。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400908", "t": 1, "q": "某混流式水轮机的额定转速为300转/分钟，其对应的同步转速由电网频率决定，若电网频率为50赫兹，该水轮机的转轮叶片数最可能为以下哪项（同步转速公式:n=60f/p，n为转速，f为频率，p为磁极对数）？", "a": ["10", "12", "14", "16", "", ""], "r": "A", "e": "这是一道关于电力系统和机械设备运行原理的题目。我们需要根据给定的电网频率和水轮机的额定转速，利用同步转速公式来推算出水轮机的转轮叶片数。首先，我们来了解一下题目中的关键信息：* 水轮机的额定转速为300转/分钟。* 电网频率为50赫兹。接下来，我们分析如何求解这个问题：1. 同步转速公式：n = 60f / p，其中n是同步转速，f是电网频率，p是磁极对数。2. 计算同步转速：将f=50赫兹代入公式，得到同步转速n = 60 * 50 / p = 3000 / p。3. 确定磁极对数：由于水轮机的额定转速为300转/分钟，这个转速应接近同步转速。我们可以通过试探法，尝试不同的p值来找到最接近300转/分钟的同步转速。\\t* 当p=10时，n = 3000 / 10 = 300转/分钟，与额定转速完全匹配。\\t* 当p值增大或减小时，同步转速将远离300转/分钟。根据电力系统和机械设备的基本原理，转轮叶片数通常与磁极对数相等，以达到最佳运行效率。因此，当磁极对数p为10时，转轮叶片数也最可能为10。综上所述，该水轮机的转轮叶片数最可能为10。所以，正确答案是A选项：“10”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400909", "t": 1, "q": "水电站坝体稳定分析中，需验算坝基的抗滑稳定，当坝基存在软弱夹层时，最易发生的滑动破坏形式是？", "a": ["沿坝体与坝基接触面滑动", "沿坝基内部软弱夹层滑动", "坝体自身材料破坏滑动", "沿坝基岩体完整面滑动", "", ""], "r": "B", "e": "坝基存在软弱夹层，软弱夹层是薄弱部位，最易沿此发生滑动。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400910", "t": 1, "q": "水电站运行中，\"负荷调整\"是重要操作，若电网要求水电站增加有功出力，在水轮机导叶开度调整过程中，下列哪个参数会首先发生变化？", "a": ["水轮机进口水头", "水轮机流量", "水轮机转速", "发电机端电压", "", ""], "r": "B", "e": "当电网要求水电站增加有功出力，调整水轮机导叶开度，导叶开度变化会直接使水轮机流量首先改变。而水头、转速和发电机端电压不会马上改变。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400911", "t": 1, "q": "在水电站引水隧洞设计中，为防止隧洞放空或充水时产生负压或明满流过渡的不利影响，通常需设置的设施是？", "a": ["通气孔", "排水孔", "检修闸门", "工作闸门", "", ""], "r": "A", "e": "通气孔可在隧洞放空或充水时平衡洞内气压，防止产生负压或明满流过渡等不利影响。排水孔主要用于排水；检修闸门用于检修时挡水；工作闸门控制水流。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400912", "t": 1, "q": "水轮机的效率曲线反映了效率随工况（水头、流量）的变化规律，下列关于水轮机效率的说法正确的是？", "a": ["水轮机的最高效率对应的工况一定是额定工况", "在部分负荷工况下，轴流式水轮机效率下降比混流式更平缓", "水轮机的水力效率主要受转轮和导叶的水力损失影响", "机械效率随转速升高而持续增大", "", ""], "r": "C", "e": "A选项，最高效率工况不一定是额定工况；B选项，部分负荷下混流式水轮机效率下降比轴流式平缓；D选项，机械效率并非随转速升高持续增大。而水轮机水力效率主要受转轮和导叶水力损失影响。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400913", "t": 1, "q": "某水电站的设计洪水位为100.00米，正常蓄水位为98.00米，死水位为90.00米，该水电站的兴利库容为以下哪项（兴利库容=正常蓄水位以下至死水位以上的水库容积）？", "a": ["100.00米对应库容-90.00米对应库容", "98.00米对应库容-90.00米对应库容", "100.00米对应库容-98.00米对应库容", "98.00米对应库容-85.00米对应库容", "", ""], "r": "B", "e": "根据兴利库容定义，是正常蓄水位以下至死水位以上的水库容积，本题正常蓄水位98.00米，死水位90.00米，所以兴利库容是98.00米对应库容减去90.00米对应库容。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400914", "t": 1, "q": "关于水轮机的气蚀破坏，下列说法正确的是？", "a": ["气蚀主要发生在水轮机转轮的出口侧", "气蚀会导致水轮机效率下降，但不会影响使用寿命", "提高水轮机安装高程可减轻气蚀破坏", "气蚀产生的原因是水流局部压力低于水的饱和蒸汽压", "", ""], "r": "D", "e": "气蚀是因水流局部压力低于水的饱和蒸汽压，水汽化形成气泡，气泡破裂产生冲击造成破坏。气蚀多发生在转轮进口侧，会降低效率、影响寿命，降低安装高程可减轻气蚀。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400915", "t": 1, "q": "水电站输电系统设计中，发电机发出的电能需通过变压器升压后送入电网，若发电机额定电压为10.5千伏，电网额定电压为220千伏，该变压器的变比（高压侧电压/低压侧电压）最接近以下哪项？", "a": ["220/10.5", "230/10.5", "220/11", "230/11", "", ""], "r": "D", "e": "变压器变比是高压侧电压与低压侧电压之比。发电机额定电压10.5kV是低压侧，电网额定电压220kV，但考虑输电线路电压损耗，变压器高压侧要比电网额定电压高5%左右，即220×(1 + 5%) = 231kV，接近230kV；发电机电压等级对应下一级变压器低压侧常取11kV。所以变比接近230/11。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400916", "t": 1, "q": "在水电站坝体应力分析中，采用有限元法计算时，下列哪个因素对坝体最大主应力的影响最大？", "a": ["坝体混凝土的泊松比", "坝基岩体的弹性模量", "坝顶的活荷载", "水库的水位高度", "", ""], "r": "D", "e": "水库水位高度决定水压力大小，水压力是坝体主要受力，对坝体最大主应力影响最大；泊松比、坝基岩体弹性模量影响相对小；坝顶活荷载通常远小于水压力。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400917", "t": 1, "q": "水轮机的额定出力计算公式为P=9.81QHη（P为出力，单位千瓦;Q为流量，单位立方米/秒;H为水头，单位米;η为效率），若某水轮机额定水头为50米，额定流量为20立方米/秒，额定效率为0.9，其额定出力为？", "a": ["8829千瓦", "9810千瓦", "10791千瓦", "11772千瓦", "", ""], "r": "A", "e": "直接将H = 50米、Q = 20立方米/秒、η = 0.9代入公式P = 9.81QHη，可得P = 9.81×20×50×0.9 = 8829千瓦。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400918", "t": 1, "q": "水电站厂房的防洪设计中，需确定厂房的防洪标准，下列哪种厂房的防洪标准最高？", "a": ["坝后式厂房（与坝体共用挡水结构）", "引水式厂房（位于河道岸边）", "地下厂房（位于山体内部）", "河床式厂房（直接挡水）", "", ""], "r": "D", "e": "防洪标准与厂房挡水情况和重要性相关，直接挡水的厂房受洪水威胁大，需更高防洪标准。河床式厂房直接挡水，相比其他选项受洪水影响最直接，所以其防洪标准最高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400919", "t": 1, "q": "关于水电站调压室的布置位置，下列说法正确的是？", "a": ["调压室应布置在引水隧洞的上游端", "调压室与厂房之间的距离越远，对水锤的抑制效果越好", "当引水隧洞较长时，调压室应靠近厂房布置", "调压室的布置位置与引水系统的水头损失无关", "", ""], "r": "C", "e": "调压室靠近厂房布置可有效减小水锤压力，当引水隧洞较长时这样布置很有必要。A选项应靠近厂房而非上游端；B选项距离远抑制效果差；D选项布置位置与水头损失有关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400920", "t": 1, "q": "水轮机转轮的设计中，需考虑水流在转轮内的能量转换，下列哪种转轮的能量转换主要发生在转轮叶片的进口至出口的流道内，且水流方向沿轴向变化？", "a": ["混流式转轮", "轴流式转轮", "冲击式转轮", "斜流式转轮", "", ""], "r": "B", "e": "轴流式转轮水流沿轴向流入和流出转轮，能量转换主要在转轮叶片进口至出口流道内，且水流方向沿轴向变化。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400921", "t": 1, "q": "水电站运行中，若出现机组转速过高（飞逸转速），下列哪种措施是首要的应急处理手段？", "a": ["关闭发电机出口断路器", "开启水轮机的事故配压阀，紧急关闭导叶", "投入发电机的制动系统", "降低水库水位", "", ""], "r": "B", "e": "机组转速过高时，首要的是迅速减少水轮机的进水量，降低水轮机的动力。开启水轮机的事故配压阀紧急关闭导叶能最快实现这一点。A选项关闭断路器不能直接降低转速；C选项投入制动系统是后续辅助措施；D选项降低水库水位操作慢且不能及时解决当前转速过高问题。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400922", "t": 1, "q": "在水电站坝基帷幕灌浆设计中，帷幕的深度主要取决于？", "a": ["坝体的高度", "坝基岩体的透水率", "水库的正常蓄水位", "坝基的承压水水头", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400923", "t": 1, "q": "某水电站采用地下厂房，其主厂房的开挖跨度为25米，高度为40米，在开挖过程中，为防止围岩坍塌，最有效的支护措施是？", "a": ["喷射混凝土支护", "锚杆支护", "钢支撑支护", "锚喷支护+钢支撑联合支护", "", ""], "r": "D", "e": "主厂房开挖跨度大、高度高，围岩稳定性差，单一支护方式难以有效防止坍塌，锚喷支护+钢支撑联合支护能发挥多种支护优势，加固效果更好。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400924", "t": 1, "q": "水轮机的流量调节过程中，导叶开度与流量的关系并非线性，主要原因是？", "a": ["水轮机转速的变化", "导叶前后水头差的变化", "转轮叶片角度的变化", "发电机励磁电流的变化", "", ""], "r": "B", "e": "导叶开度变化时，导叶前后水头差会改变，这使得流量与导叶开度关系非线性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400925", "t": 1, "q": "水电站的装机容量选择中，需考虑\"保证出力\"，下列关于保证出力的说法正确的是？", "a": ["保证出力是水电站在任何工况下都能发出的最小出力", "保证出力由水电站的最大水头和最大流量决定", "保证出力是根据水文资料，在一定保证率（如95%）下的最小出力", "保证出力等于水轮机的额定出力", "", ""], "r": "C", "e": "保证出力是根据水文资料，按一定保证率（如95%）确定的水电站的最小出力，并非任何工况下都能发出的最小出力，也不由最大水头和最大流量决定，且和水轮机额定出力不同。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837696", "t": 2, "q": "坝式水电站的厂房布置形式多样，下列属于坝式水电站厂房布置特点的有？", "a": ["厂房通常靠近坝体，便于利用坝体挡水形成的水头", "需单独修建挡水建筑物来保护厂房", "厂房与坝体之间可能存在结构受力相互影响", "适合于水头较高、流量较大的河流", "水库的调节能力主要由坝体规模决定", ""], "r": "ACE", "e": "坝式水电站厂房靠近坝体利用水头，厂房与坝体结构受力相互影响，水库调节能力取决于坝体规模。而坝式水电站厂房利用坝体挡水，无需单独建挡水建筑物，且适合中低水头、大流量河流。答案：ACE", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837697", "t": 2, "q": "水轮机气蚀的危害主要包括以下哪些方面？", "a": ["导致水轮机转轮表面出现蜂窝状损坏", "增加水轮机的水力损失，降低运行效率", "产生强烈的振动和噪声，影响机组稳定运行", "提高水轮机的吸出高度，增加安装成本", "缩短水轮机的使用寿命，增加检修频率", ""], "r": "ABCE", "e": "气蚀会使转轮表面遭破坏成蜂窝状，增加水力损失、降低效率，引发振动和噪声影响稳定，还会缩短寿命、增加检修频率。而吸出高度与气蚀无关。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837698", "t": 2, "q": "水电站调压室的设计参数需考虑多个因素，下列属于调压室关键设计参数的有？", "a": ["调压室的断面面积", "调压室的高度", "调压室与厂房的距离", "调压室的衬砌厚度", "调压室的通气孔直径", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837699", "t": 2, "q": "在水电站坝体混凝土施工中，为控制温度裂缝，可采取的技术措施有？", "a": ["选用低热矿渣水泥", "在混凝土中掺加粉煤灰等掺合料", "采用分层浇筑、分层振捣的施工方法", "在混凝土内部设置冷却水管进行通水冷却", "提高混凝土的入仓温度", ""], "r": "ABCD", "e": "控制温度裂缝要降低水化热和混凝土温度。A选低热水泥、B掺粉煤灰可降低水化热；C分层浇筑利于散热；D内部通冷水可降温。而E提高入仓温度会加剧温度裂缝。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837700", "t": 2, "q": "水轮机的主要性能参数包括以下哪些？", "a": ["额定水头", "额定流量", "额定转速", "磁极对数", "额定效率", ""], "r": "ABCE", "e": "水轮机主要性能参数反映其工作能力和效率等特性。额定水头、额定流量、额定转速、额定效率都是描述水轮机性能的关键参数。磁极对数主要与发电机相关，并非水轮机主要性能参数。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837701", "t": 2, "q": "水电站地下厂房的优点主要有？", "a": ["受洪水威胁小，防洪设计难度低", "厂房布置不受地表地形限制", "可减少对地表生态环境的破坏", "厂房结构受力更简单，施工难度低", "便于设置防渗设施，减少渗水影响", ""], "r": "ABC", "e": "水电站地下厂房建在地下，不受洪水直接威胁，防洪设计难度降低；地下空间大，布置不受地表地形制约；在地下建设可减少对地表生态破坏。而地下厂房结构受力复杂，施工难度大；地下环境设置防渗设施难度高。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837702", "t": 2, "q": "影响水电站引水隧洞水头损失的因素主要有？", "a": ["隧洞的长度", "隧洞的断面形状和尺寸", "隧洞壁面的粗糙度", "通过隧洞的水流速度", "水库的正常蓄水位", ""], "r": "ABCD", "e": "水头损失与水流路径、过水条件、水流自身状态有关。隧洞长度越长、断面形状和尺寸不合理、壁面越粗糙、水流速度越快，水头损失越大。而水库正常蓄水位与水头损失无直接关联。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837703", "t": 2, "q": "水电站机组启动过程中，需经历多个阶段，下列属于机组启动关键阶段的有？", "a": ["导叶预开度调整，建立初始水流", "水轮机转速升至额定转速", "发电机励磁系统投入，建立端电压", "发电机与电网进行同期并列", "水轮机导叶开度调至额定值，出力达到额定值", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837704", "t": 2, "q": "水电站坝基抗滑稳定分析中，需考虑的荷载主要有？", "a": ["坝体的自重", "水库水压力", "坝基的扬压力", "地震惯性力", "坝顶的活荷载", ""], "r": "ABCD", "e": "水电站坝基抗滑稳定分析主要考虑影响坝体稳定的关键荷载，坝体自重、水库水压力、坝基扬压力是基本且重要的影响因素，地震惯性力在抗震设计时也需考虑。坝顶活荷载对坝基抗滑稳定影响极小，可不考虑。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837705", "t": 2, "q": "下列关于混流式水轮机和轴流式水轮机的区别，说法正确的有？", "a": ["混流式水轮机适用于中高水头，轴流式适用于低水头", "混流式水轮机的流量调节范围比轴流式更宽", "混流式水轮机的转轮叶片是固定的，轴流式可调节叶片角度", "混流式水轮机的效率曲线比轴流式更平缓", "混流式水轮机的结构比轴流式更复杂", ""], "r": "ACE", "e": "混流式适中高水头，轴流式适低水头；轴流式流量调节范围宽；混流式叶片固定，轴流式叶片可调节；轴流式效率曲线更平缓；混流式结构更复杂。答案：ACE", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837706", "t": 2, "q": "水电站运行中，造成水轮机效率下降的主要原因有？", "a": ["水轮机气蚀现象的发生", "导叶开度偏离最优工况", "水轮机转轮磨损或结垢", "水电站水头高于设计水头", "发电机励磁电流不稳定", ""], "r": "ABC", "e": "气蚀会破坏水轮机部件影响效率；导叶开度偏离最优工况，水流不能按最佳方式作用于转轮，使效率下降；转轮磨损或结垢改变了过流表面，降低效率。水头高于设计水头不一定会使效率下降；发电机励磁电流影响发电，与水轮机效率无关。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837707", "t": 2, "q": "水电站厂房的主要组成部分包括以下哪些？", "a": ["主厂房（布置水轮机、发电机）", "副厂房（布置辅助设备、控制室）", "变电站（布置变压器、开关设备）", "尾水渠（排出水轮机的尾水）", "进水渠（引入水库的水至水轮机）", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837708", "t": 2, "q": "水电站坝体帷幕灌浆的作用主要有？", "a": ["减少坝基的渗流量，降低扬压力", "提高坝基岩体的弹性模量，增强承载能力", "填充坝基岩体的裂隙，提高防渗性能", "防止坝基岩体发生管涌等渗透破坏", "增强坝体与坝基的结合强度", ""], "r": "ACD", "e": "帷幕灌浆是在坝基迎水面钻孔灌浆形成连续的阻水帷幕。其可减少坝基渗流量、填充裂隙提高防渗性、防止渗透破坏，还能降低扬压力。而提高岩体弹性模量和增强承载能力主要是固结灌浆作用，增强坝体与坝基结合强度并非帷幕灌浆主要作用。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837709", "t": 2, "q": "下列属于水电站水锤现象产生的不利影响的有？", "a": ["导致引水管道内压力急剧升高，可能造成管道破裂", "引起水轮机转速大幅波动，影响机组稳定运行", "增加水轮机的水力效率，提高出力", "造成发电机端电压不稳定，影响电网供电质量", "导致导叶控制机构损坏", ""], "r": "ABDE", "e": "水锤现象会使引水管道压力急剧变化，易致管道破裂；会让水轮机转速波动，影响机组稳定；还会使发电机端电压不稳，影响供电质量，也可能损坏导叶控制机构。而水锤是不利现象，不会增加水轮机水力效率和提高出力。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837710", "t": 2, "q": "水电站装机容量的确定需考虑的因素有？", "a": ["电网的负荷需求和增长趋势", "水电站的保证出力和多年平均发电量", "水库的调节能力和水文条件", "水轮机的额定转速和磁极对数", "水电站的投资成本和经济收益", ""], "r": "ABCE", "e": "确定水电站装机容量要综合多方面。A 电网负荷需求和增长趋势决定了电站应提供的电量规模；B 保证出力和多年平均发电量是衡量电站发电能力的关键；C 水库调节能力和水文条件影响发电的稳定性和持续性；E 投资成本和经济收益关乎项目的可行性和效益。而 D 水轮机额定转速和磁极对数主要与水轮机自身特性相关，并非确定装机容量需考虑的主要因素。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837711", "t": 2, "q": "关于水电站日调节水库的运行特性，说法正确的有？", "a": ["日调节水库的库容较小，仅能调节日内的流量变化", "白天电网负荷高峰时，水库放水发电，水位下降", "夜间电网负荷低谷时，水库蓄水，水位上升", "日调节水库的调节周期为一年，适应季节流量变化", "日调节水库可有效提高水电站的调峰能力", ""], "r": "ABCE", "e": "日调节水库库容小，只能调节日内流量，A对；白天负荷高峰时放水发电水位下降，B对；夜间负荷低谷时蓄水水位上升，C对；日调节水库调节周期是一天不是一年，D错；能有效提高水电站调峰能力，E对。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837712", "t": 2, "q": "水轮机导叶的结构设计需满足的要求有？", "a": ["具有良好的水力性能，减少水流损失", "具备足够的强度和刚度，承受水流压力", "关闭时能实现严密止水，防止漏水", "调节过程中动作灵活，响应速度快", "导叶数量越多，调节性能越好", ""], "r": "ABCD", "e": "水轮机导叶要保证水流顺畅，所以需有良好水力性能减少损失，A正确；要承受水流压力，就得有足够强度和刚度，B正确；关闭时防止漏水需严密止水，C正确；调节时动作灵活、响应快才能有效工作，D正确；导叶数量并非越多调节性能就越好，过多可能增加成本和复杂性等，E错误。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837713", "t": 2, "q": "水电站地下厂房的施工难点主要有？", "a": ["厂房开挖规模大，围岩稳定控制难度高", "地下作业空间有限，施工设备布置困难", "通风、照明、排水等辅助系统设计复杂", "受地表气候影响大，施工工期易延误", "防渗处理难度大，需防止地下水渗入厂房", ""], "r": "ABCE", "e": "水电站地下厂房在地下施工，受地表气候影响小，D选项错误。而厂房开挖规模大、地下作业空间有限、辅助系统设计复杂、防渗处理难度大都是其施工难点。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837714", "t": 2, "q": "下列关于水电站发电机的运行特性，说法正确的有？", "a": ["发电机的有功出力由水轮机的进水量和水头决定", "发电机的无功出力由励磁系统的励磁电流控制", "发电机的转速由电网频率和磁极对数决定，保持恒定", "发电机的端电压随有功出力的增加而自动升高", "发电机并网运行时，需满足电压、频率、相位与电网一致", ""], "r": "ABCE", "e": "A项，水轮机进水量和水头影响水轮机功率，进而决定发电机有功出力；B项，励磁电流能改变发电机磁场强度，控制无功出力；C项，根据公式，发电机转速与电网频率和磁极对数有关且保持恒定；E项，发电机并网须满足电压、频率、相位与电网一致。而D项，发电机端电压会因有功增加受多种因素影响，不是自动升高。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837715", "t": 2, "q": "水电站坝体裂缝按产生原因可分为多种类型，下列属于温度裂缝的特点的有？", "a": ["多发生在混凝土浇筑后的早期", "裂缝多呈不规则状，分布较广", "裂缝深度通常较浅，多为表面裂缝", "裂缝会随温度变化而开合", "裂缝产生与坝体承受的水压力直接相关", ""], "r": "ABCD", "e": "温度裂缝是因温度变化产生，早期水泥水化热等使混凝土内外温差大易产生，多在早期出现；因温度分布不均，裂缝不规则且广；早期温度变化主要影响表面，多为浅的表面裂缝；温度升降会让裂缝开合。而与水压力直接相关产生的不是温度裂缝。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837716", "t": 2, "q": "影响水轮机吸出高度的因素有？", "a": ["水轮机的安装高程", "水轮机的气蚀系数", "水电站的设计水头", "水的温度", "水库的死水位", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837717", "t": 2, "q": "水电站引水系统的组成部分包括？", "a": ["进水口（含拦污栅、闸门）", "引水隧洞或引水管道", "调压室", "尾水管", "尾水渠", ""], "r": "ABC", "e": "水电站引水系统是将水流从水库引向水轮机，包括进水口（含拦污栅、闸门）、引水隧洞或引水管道、调压室等；尾水管是水轮机的一部分，尾水渠是排水设施，不属于引水系统。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837718", "t": 2, "q": "下列关于水电站冲击式水轮机的说法，正确的有？", "a": ["冲击式水轮机适用于高水头、小流量的水电站", "冲击式水轮机的能量转换主要依靠水流的动能", "冲击式水轮机不需要设置尾水管", "冲击式水轮机的转轮浸没在水中工作", "冲击式水轮机的效率随水头变化较为敏感", ""], "r": "ABCE", "e": "冲击式水轮机利用高速水流冲击转轮旋转做功，适合高水头小流量，能量转换靠动能，因水流冲击后直接排走，无需尾水管，且效率受水头影响大。而其转轮是在空气中而非浸没在水中工作。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837719", "t": 2, "q": "水电站厂房的防渗措施主要有？", "a": ["在厂房迎水面设置混凝土防渗墙", "在厂房墙体内部设置沥青油毡防水层", "对厂房地基进行帷幕灌浆，减少渗水", "在厂房地板设置排水孔，排除渗水", "提高厂房混凝土的密实度，增强抗渗性", ""], "r": "ACDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837720", "t": 2, "q": "水电站运行中，机组停机的主要步骤包括？", "a": ["逐渐减小水轮机导叶开度，降低机组出力", "断开发电机出口断路器，与电网解列", "投入发电机的制动系统，降低机组转速", "关闭水轮机的进水闸门，切断水源", "停止发电机励磁系统运行", ""], "r": "ABCDE", "e": "机组停机先减小导叶开度降出力，再解列电网，接着停励磁，然后制动降转速，最后关进水闸门。答案涵盖了完整停机流程的各关键步骤。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837721", "t": 2, "q": "影响水电站坝体混凝土强度的因素有？", "a": ["水泥的品种和强度等级", "混凝土的水灰比", "混凝土的养护条件（温度、湿度）", "混凝土的浇筑速度", "混凝土中骨料的级配和品质", ""], "r": "ABCE", "e": "水泥品种和强度等级、水灰比、养护条件、骨料级配和品质都会影响坝体混凝土强度，而浇筑速度主要影响施工进度等，对强度无直接影响。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837722", "t": 2, "q": "下列属于水电站调压室类型的有？", "a": ["圆筒式调压室", "阻抗式调压室", "溢流式调压室", "差动式调压室", "虹吸式调压室", ""], "r": "ABCD", "e": "常见的水电站调压室类型有圆筒式、阻抗式、溢流式、差动式等。虹吸式不属于调压室类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837723", "t": 2, "q": "水电站水轮机的振动按产生原因可分为多种类型，下列属于水力振动的有？", "a": ["水轮机气蚀引起的振动", "水轮机转轮不平衡引起的振动", "水流在导叶和转轮间流动不均匀引起的振动", "水锤现象引起的振动", "发电机电磁力引起的振动", ""], "r": "ACD", "e": "水力振动是由水流相关因素导致的。A选项气蚀是水流作用产生，C选项水流流动不均匀，D选项水锤现象都与水流有关，属于水力振动；B选项转轮不平衡是机械问题，E选项发电机电磁力与水力无关。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837724", "t": 2, "q": "水电站水库的特征水位包括？", "a": ["正常蓄水位", "设计洪水位", "死水位", "校核洪水位", "防洪限制水位", ""], "r": "ABCDE", "e": "水电站水库特征水位有正常蓄水位、死水位、设计洪水位、校核洪水位、防洪限制水位等，这些水位在水库运行、防洪、发电等方面有重要意义。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837725", "t": 2, "q": "水电站发电机的主要组成部分包括？", "a": ["定子（含定子铁芯、定子绕组）", "转子（含转子铁芯、转子绕组）", "励磁系统（提供励磁电流）", "调速系统（控制转速）", "冷却系统（冷却定子和转子）", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986496", "t": 3, "q": "坝式水电站的水头完全由坝体的高度决定，与水库的水位变化无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "坝式水电站水头受坝高和水库水位变化共同影响，水库水位变化会改变上下游水位差，进而影响水头。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986497", "t": 3, "q": "水轮机的气蚀系数越大，表明其抗气蚀性能越好，允许的吸出高度越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机气蚀系数越大，抗气蚀性能越差，允许吸出高度越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986498", "t": 3, "q": "水电站调压室的断面面积越大，水位波动的幅度越小，对水锤的抑制效果越好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "调压室断面面积大，能储存更多水量，可减小水位波动幅度，更好地缓冲水锤压力变化，抑制水锤效果好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986499", "t": 3, "q": "混流式水轮机的转轮叶片角度可以调节，以适应不同的水头和流量工况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混流式水轮机转轮叶片是固定的，不能调节，轴流式水轮机转轮叶片才可以调节以适应不同工况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986500", "t": 3, "q": "水电站地下厂房因位于山体内部，受洪水威胁小，故无需进行防洪设计。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然水电站地下厂房位于山体内部，受洪水直接威胁小，但仍可能因山体汇水、地下水涌入、排水系统故障、上游水库溃坝等因素面临洪水风险，所以仍需进行防洪设计。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986501", "t": 3, "q": "水轮机的额定出力是指水轮机在额定水头、额定流量和最高效率工况下的出力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986502", "t": 3, "q": "水电站坝基固结灌浆的主要作用是形成防渗帷幕，阻止水库水向坝下游渗透。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站坝基固结灌浆主要作用是提高基岩的整体性和强度，改善基岩的力学性能，而形成防渗帷幕、阻止水库水向坝下游渗透是帷幕灌浆的作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986503", "t": 3, "q": "水电站日调节水库的调节周期为24小时，可在日内根据电网负荷变化调整水库的放水量和蓄水量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "日调节水库调节周期就是24小时，能按电网负荷变化在一天内对水库放水量和蓄水量进行调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986504", "t": 3, "q": "水轮机导叶关闭时间越长，产生的水锤压力越大，对引水系统的危害越严重。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机导叶关闭时间越长，水锤压力越小，因为延长关闭时间可使水流流速变化趋缓，减小水锤压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986505", "t": 3, "q": "水电站发电机的有功出力由水轮机的进水量决定，进水量越大，有功出力越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986506", "t": 3, "q": "轴流式水轮机适用于低水头、大流量的水电站，其效率曲线比混流式水轮机更平缓。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986507", "t": 3, "q": "水电站厂房的发电机层楼板需承受发电机定子、转子等重型设备的荷载，设计时需按永久荷载+正常运行荷载+地震荷载的组合进行计算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986508", "t": 3, "q": "水电站引水隧洞的水头损失主要包括沿程水头损失和局部水头损失，其中沿程水头损失与隧洞的长度成正比，与断面面积成反比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986509", "t": 3, "q": "水轮机的飞逸转速是指水轮机在导叶全开、无负荷工况下的最大转速，是水轮机设计的重要控制参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机飞逸转速就是在导叶全开、无负荷工况时的最大转速，它对水轮机设计意义重大，是重要控制参数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986510", "t": 3, "q": "水电站坝体的扬压力是由水库水渗透产生的向上的压力，会减小坝体的有效重量，降低坝基的抗滑稳定安全系数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水电站坝体扬压力确实是水库水渗透产生向上压力，它会使坝体有效重量减小，进而降低坝基抗滑稳定安全系数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986511", "t": 3, "q": "水电站调压室应布置在引水隧洞的上游端，以最大限度地缩短水锤波传递至厂房的距离。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "调压室应布置在引水隧洞的下游靠近厂房处，这样才能有效反射水锤波，减少水锤压力对厂房的影响，而不是布置在引水隧洞上游端。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986512", "t": 3, "q": "水轮机的水力效率主要取决于转轮和导叶的水力设计，与水轮机的安装精度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机安装精度会影响水流在水轮机内的流动状态等，对水力效率有影响，所以题干说与安装精度无关错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986513", "t": 3, "q": "水电站年调节水库的库容较大，可调节年内不同季节的流量变化，满足枯水期的发电需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "年调节水库能在一年中进行径流调节，库容较大，可把丰水期多余水量存起来，供枯水期使用，能满足枯水期发电需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986514", "t": 3, "q": "水电站地下厂房的开挖不需要考虑围岩的稳定问题，只需保证厂房结构自身的强度即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站地下厂房开挖时，围岩稳定至关重要，若围岩不稳定，会对厂房结构造成破坏，所以不能只考虑厂房结构自身强度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986515", "t": 3, "q": "水轮机的吸出高度为负值时，表明水轮机的安装高程低于下游尾水位，需采取防淹没措施。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当水轮机吸出高度为负值时，水轮机转轮在下游尾水位之下，即安装高程低于下游尾水位，这种情况下确实要采取防淹没措施。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986516", "t": 3, "q": "水电站坝体混凝土的温度裂缝主要发生在混凝土浇筑后的后期，与混凝土的水化热无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站坝体混凝土温度裂缝主要在浇筑初期产生，因为水泥水化热会使混凝土内部温度升高，内外温差大就易产生裂缝，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986517", "t": 3, "q": "发电机的同步转速由电网频率和磁极对数决定，公式为n=60f/p，其中n为转速（转/分钟），f为频率（赫兹），p为磁极对数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是发电机同步转速的基本公式，在电机学中，发电机同步转速的确由电网频率和磁极对数通过该公式确定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986518", "t": 3, "q": "水电站引水系统的通气孔主要用于在隧洞充水时排气，防止明满流过渡产生的压力波动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "通气孔不仅在隧洞充水时排气，放空时进气，还能防止明满流过渡产生压力波动等。题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986519", "t": 3, "q": "水轮机的机械效率是指水轮机轴端出力与水轮机水力出力的比值，主要受轴承摩擦损失的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机机械效率确实是轴端出力与水力出力比值，且主要受轴承等部件摩擦损失影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986520", "t": 3, "q": "水电站坝基的接触灌浆主要用于填充坝体混凝土与坝基岩体之间的缝隙，提高接触面的抗渗性能和结合强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "接触灌浆目的就是填充坝体混凝土与坝基岩体间缝隙，增强接触面抗渗性与结合强度，该描述符合接触灌浆实际作用。", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986521", "t": 3, "q": "水电站运行中，当电网负荷增加时，应减小水轮机导叶开度，增加进水量，提高机组出力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电网负荷增加时，需提高机组出力，应增大水轮机导叶开度来增加进水量，而不是减小导叶开度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986522", "t": 3, "q": "冲击式水轮机的转轮不浸没在水中，水流以高速冲击转轮叶片，将动能传递给转轮。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冲击式水轮机工作时，转轮不浸没在水中，高速水流冲击转轮叶片，把动能传给转轮。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986523", "t": 3, "q": "水电站水库的死水位是指水库在正常运行条件下，允许消落的最低水位，死水位以下的库容称为死库容，可用于调节枯水期流量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。死库容一般不参与径流调节，不能用于调节枯水期流量，主要是容纳水库泥沙等。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986524", "t": 3, "q": "水轮机的额定转速一定等于发电机的同步转速，以保证发电机发出的电能频率符合电网要求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机和发电机通过联轴器等相连，为保证发电机发出电能频率符合电网要求，水轮机额定转速需和发电机同步转速一致。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986525", "t": 3, "q": "水电站厂房的副厂房主要布置水轮机、发电机等核心设备，是厂房的核心组成部分。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站厂房中布置水轮机、发电机等核心设备的是主厂房，副厂房主要是为了保证主厂房正常运行而设置的辅助房间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986526", "t": 3, "q": "水轮机的气蚀会导致转轮表面损坏，但不会影响水轮机的运行稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机气蚀不仅会使转轮表面损坏，还会产生振动和噪声，严重影响水轮机运行稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986527", "t": 3, "q": "水电站坝体的抗滑稳定分析中，滑动面通常取坝体与坝基的接触面，无需考虑坝基内部的软弱夹层。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在水电站坝体抗滑稳定分析中，不仅要考虑坝体与坝基的接触面，坝基内部的软弱夹层也可能影响坝体稳定，是需要考虑的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986528", "t": 3, "q": "水电站调压室的高度需满足水库最高水位时不溢流，最低水位时不抽空的要求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "调压室高度要考虑最高水位不溢流、最低水位不抽空等多方面因素，该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986529", "t": 3, "q": "轴流式水轮机的导叶开度与流量呈线性关系，开度越大，流量越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "轴流式水轮机导叶开度与流量并非严格线性关系，虽然一般开度增大流量会增加，但受转轮特性等多种因素影响，不是简单线性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986530", "t": 3, "q": "水电站发电机的励磁系统主要作用是控制发电机的有功出力，确保有功出力稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站发电机的励磁系统主要作用是控制发电机的无功功率和端电压，而非有功出力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986531", "t": 3, "q": "水电站引水隧洞的衬砌主要作用是防止隧洞围岩坍塌，与防渗无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站引水隧洞衬砌不仅能防止隧洞围岩坍塌，还具有防渗作用，可减少地下水渗漏，降低能量损失等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986532", "t": 3, "q": "水轮机的最高效率工况是指水轮机在任何水头和流量下效率最高的工况，该工况一定是水轮机的额定工况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机最高效率工况是指在特定条件下效率最高，并非任何水头和流量下；且最高效率工况不一定是额定工况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986533", "t": 3, "q": "水电站坝体混凝土采用分层浇筑时，分层厚度越大，越有利于控制混凝土的温度裂缝。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分层厚度越大，混凝土内部热量越难散发，会使内部温度升高，内外温差增大，更易产生温度裂缝，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986534", "t": 3, "q": "水电站运行中，机组甩负荷时，应立即关闭水轮机导叶，防止转速升高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机组甩负荷时，若立即关闭水轮机导叶，会使压力管道内水的流速急剧变化，产生过大的水锤压力，可能损坏管道等设备，所以不能立即关闭，应合理调节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986535", "t": 3, "q": "水电站的保证出力是指水电站在多年运行中，在规定的保证率下，能够持续提供的最小出力，是确定水电站供电能力的重要依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水电站保证出力定义就是在规定保证率下多年运行能持续提供的最小出力，它对确定供电能力很关键。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第2章 水利与水电||第4节 抽水蓄能电站基础", "n": "第2章 水利与水电 / 第4节 抽水蓄能电站基础", "qs": [{"id": "2035637109485867008", "t": 1, "q": "抽水蓄能电站在抽水工况下，水泵水轮机从下水库抽水至上水库时，其能量转换过程是以下哪种？", "a": ["电能→水能→机械能", "电能→机械能→水能", "水能→机械能→电能", "机械能→电能→水能", "", ""], "r": "B", "e": "抽水时，先将电能转化为水泵水轮机的机械能，再通过水泵水轮机将水从下水库抽到上水库，把机械能转化为水的势能（水能），所以能量转换过程是电能→机械能→水能，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867009", "t": 1, "q": "某抽水蓄能电站上水库正常蓄水位为800米，下水库死水位为400米，该电站的最大毛水头最接近以下哪个数值？", "a": ["350米", "400米", "450米", "500米", "", ""], "r": "B", "e": "电站最大毛水头是上水库正常蓄水位与下水库死水位的差值，即800 - 400 = 400米。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867010", "t": 1, "q": "抽水蓄能电站中，以下哪种机组类型最适用于需要快速响应电网调频、调峰需求的场景？", "a": ["混流式水泵水轮机", "轴流式水泵水轮机", "斜流式水泵水轮机", "贯流式水泵水轮机", "", ""], "r": "A", "e": "混流式水泵水轮机应用广泛，启动迅速、调节灵活，能很好满足电网快速调频、调峰需求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867011", "t": 1, "q": "抽水蓄能电站在运行过程中，\"水锤效应\"易发生在以下哪个工况转换瞬间？", "a": ["抽水工况稳定运行时", "发电工况稳定运行时", "从抽水工况转为发电工况时", "水库水位稳定时", "", ""], "r": "C", "e": "“水锤效应”是由于流速突然变化引起压强急剧变化的现象。在工况转换瞬间流速会有较大改变。A、B选项稳定运行时流速相对稳定；D选项水库水位稳定与流速突变无关；C选项从抽水工况转为发电工况，水流方向和流速会瞬间改变，易引发“水锤效应”。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867012", "t": 1, "q": "某抽水蓄能电站下水库为日调节水库，其主要作用是以下哪项？", "a": ["调节多年来水变化，保证电站长期运行", "调节日内抽水与发电的水量平衡，满足日负荷需求", "调节季节来水变化，保证枯水期发电", "储存洪水，防止下游洪涝灾害", "", ""], "r": "B", "e": "日调节水库主要针对日内情况，抽水蓄能电站下水库可调节日内抽水与发电的水量平衡，满足日负荷需求。A项针对多年，C项针对季节，D项并非下水库主要作用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867013", "t": 1, "q": "抽水蓄能电站机组的\"S特性曲线\"主要用于分析以下哪项内容？", "a": ["机组效率随水头的变化规律", "机组流量随转速的变化规律", "机组在抽水和发电工况下的稳定运行范围", "机组出力随水位的变化规律", "", ""], "r": "C", "e": "“S特性曲线”反映了水泵水轮机在某些工况下流量、转速、力矩等参数间关系，主要用来分析机组在抽水和发电工况下的稳定运行范围。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867014", "t": 1, "q": "以下哪种地质条件最不适宜建设抽水蓄能电站的上水库？", "a": ["完整的花岗岩地层", "厚层状石灰岩地层（无溶洞）", "破碎的页岩地层（存在裂隙渗水）", "致密的玄武岩地层", "", ""], "r": "C", "e": "抽水蓄能电站上水库需有良好的蓄水条件，不能有大量渗漏。破碎的页岩地层存在裂隙渗水，无法有效蓄水，不适宜建设上水库。而完整花岗岩、无溶洞厚层石灰岩、致密玄武岩地层蓄水条件相对较好。所以答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867015", "t": 1, "q": "抽水蓄能电站在发电工况下，水泵水轮机的导叶开度调节主要目的是以下哪项？", "a": ["控制上水库水位", "调节机组出力，适应电网负荷变化", "防止机组发生气蚀", "控制下水库水位", "", ""], "r": "B", "e": "抽水蓄能电站发电时，导叶开度改变可调节进入水轮机的水量，进而调节机组出力，以适应电网负荷变化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867016", "t": 1, "q": "某抽水蓄能电站的综合效率（发电效率与抽水效率的乘积）为75%，若抽水时消耗1000万千瓦时电能，其发电时最多可向电网输送的电能约为多少？", "a": ["650万千瓦时", "700万千瓦时", "750万千瓦时", "800万千瓦时", "", ""], "r": "C", "e": "已知综合效率为75%，抽水消耗1000万千瓦时电能，根据综合效率定义，发电输送电能 = 抽水消耗电能×综合效率，即1000×75% = 750万千瓦时。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867017", "t": 1, "q": "抽水蓄能电站中，用于防止水泵水轮机在抽水工况下发生\"喘振\"的关键设备是以下哪项？", "a": ["主变压器", "调压阀", "励磁系统", "调速器", "", ""], "r": "B", "e": "水泵水轮机抽水工况“喘振”会影响机组稳定，调压阀可调节流量和压力，防止喘振发生。主变压器用于变压，励磁系统提供磁场，调速器调节转速，它们与防止喘振无直接关联。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867018", "t": 1, "q": "以下关于抽水蓄能电站与常规水电站的区别，说法正确的是哪项？", "a": ["两者均以天然来水为主要水源", "抽水蓄能电站无需考虑防洪功能，常规水电站必须考虑", "抽水蓄能电站存在抽水工况，需消耗电能，常规水电站无此工况", "两者的机组类型完全相同", "", ""], "r": "C", "e": "常规水电站靠天然来水发电，抽水蓄能电站有抽水和发电两种工况，抽水时消耗电能；A选项抽水蓄能电站不是以天然来水为主要水源；B选项抽水蓄能电站也可能需考虑防洪；D选项两者机组类型不同。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867019", "t": 1, "q": "抽水蓄能电站上水库的\"死水位\"是指以下哪个水位？", "a": ["上水库允许的最高蓄水位", "上水库在正常运行中，为保证水泵吸水不发生气蚀，不允许低于的最低水位", "上水库在洪水期允许临时达到的最高水位", "上水库每年平均蓄水位", "", ""], "r": "B", "e": "“死水位”是水库在正常运行时不允许低于的最低水位，目的之一是保证水泵吸水不发生气蚀。A是正常蓄水位；C是防洪高水位；D不是死水位概念。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867020", "t": 1, "q": "抽水蓄能电站机组在\"调相工况\"下的主要作用是以下哪项？", "a": ["向电网输送有功功率", "从电网吸收有功功率", "向电网提供无功功率，改善电网功率因数", "调节水库水位", "", ""], "r": "C", "e": "调相工况主要是为电网提供无功功率，改善功率因数。A输送有功功率不是调相工况主要作用；B吸收有功功率也并非调相主要目的；D调节水库水位与调相工况无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867021", "t": 1, "q": "以下哪种因素对抽水蓄能电站的抽水效率影响最大？", "a": ["上水库的淤积程度", "下水库的水温", "水泵水轮机的进口真空度", "主变压器的容量", "", ""], "r": "C", "e": "水泵水轮机是抽水蓄能电站抽水的关键设备，其进口真空度直接影响水泵水轮机的性能和运行效率，对抽水效率影响最大。上水库淤积、下水库水温对抽水效率影响相对小，主变压器容量主要影响电力传输等，和抽水效率直接关联不大。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867022", "t": 1, "q": "抽水蓄能电站的\"输水系统\"不包括以下哪个部分？", "a": ["引水隧洞", "尾水隧洞", "压力钢管", "发电机定子", "", ""], "r": "D", "e": "输水系统是用于输送水流的结构，引水隧洞、尾水隧洞、压力钢管都和水流输送相关，而发电机定子是发电机的部件，不属于输水系统。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867023", "t": 1, "q": "某抽水蓄能电站在设计时，需考虑\"最小水头\"，其主要目的是以下哪项？", "a": ["保证机组在抽水工况下不发生喘振", "保证机组在发电工况下达到额定出力", "保证上水库有足够的防洪库容", "保证下水库有足够的死库容", "", ""], "r": "B", "e": "设计时考虑​最小水头​，核心目的是确保机组在​发电工况​下，即使水头最低时，仍能发出​额定出力​，满足电网调度要求。<br />​A选项​：喘振主要与水泵水轮机的“S”特性区及启动工况相关，并非最小水头的主要设计目的。​C、D选项​：涉及水库库容，属于​水库运行​设计范畴，与机组水头参数无直接关联。", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867024", "t": 1, "q": "以下关于抽水蓄能电站\"黑启动\"能力的说法，正确的是哪项？", "a": ["黑启动能力是指电站在电网完全停电时，无需外部电源即可自行启动发电的能力", "抽水蓄能电站无黑启动能力，必须依赖外部电源启动", "黑启动能力仅需考虑发电工况，无需考虑抽水工况", "黑启动能力主要依赖主变压器的备用电源", "", ""], "r": "A", "e": "抽水蓄能电站的黑启动能力就是在电网完全停电时，能不依靠外部电源自行启动发电。B选项与事实不符；C项黑启动要考虑发电和抽水工况；D项黑启动不是依赖主变压器备用电源。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867025", "t": 1, "q": "抽水蓄能电站中，\"球阀\"通常安装在以下哪个位置，主要作用是快速切断水流？", "a": ["引水隧洞进口", "压力钢管靠近机组进口处", "尾水隧洞出口", "水库溢洪道出口", "", ""], "r": "B", "e": "球阀安装在压力钢管靠近机组进口处，可在紧急情况时快速切断水流，保护机组。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867026", "t": 1, "q": "以下哪种指标可直接反映抽水蓄能电站对电网调峰能力的贡献？", "a": ["电站的总装机容量", "电站的年发电量", "电站的日调节容量", "电站的水库总库容", "", ""], "r": "C", "e": "调峰能力主要看电站在一定时间内可调节的电量，日调节容量能直接体现电站在一天内可用于调节电网峰谷的电量，反映对电网调峰能力的贡献。总装机容量只是电站发电设备的能力；年发电量是一年的发电总量，不能直接反映调峰；水库总库容与调峰能力无直接关联。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867027", "t": 1, "q": "抽水蓄能电站在抽水工况下，若电网电压升高，对水泵水轮机的运行会产生以下哪种影响？", "a": ["水泵转速升高，抽水流量增加", "水泵转速降低，抽水流量减少", "水泵效率升高", "水泵气蚀风险降低", "", ""], "r": "A", "e": "电网电压升高，水泵水轮机输入功率增大，转速升高，流量增加。而电压升高不一定使效率升高，且转速和流量增加会增大气蚀风险。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867028", "t": 1, "q": "以下关于抽水蓄能电站上水库防渗措施的说法，错误的是哪项？", "a": ["沥青混凝土防渗面板适用于岩质库岸", "土工膜防渗适用于地形复杂、坡度较陡的库岸", "混凝土防渗墙适用于覆盖层较厚的库底", "帷幕灌浆适用于岩石裂隙发育的库岸", "", ""], "r": "B", "e": "土工膜防渗一般适用于地形平缓的库岸，地形复杂、坡度较陡时土工膜施工难度大且易损坏，B选项说法错误。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867029", "t": 1, "q": "抽水蓄能电站机组的\"飞逸转速\"是指以下哪种情况的转速？", "a": ["机组在发电工况下，导叶全开、负荷突然甩去时的最大转速", "机组在抽水工况下，电源突然切断时的最大转速", "机组在调相工况下的额定转速", "机组在安装调试时的最高试验转速", "", ""], "r": "A", "e": "飞逸转速是指水轮发电机组在发电工况下，导叶全开、负荷突然甩去时达到的最大转速。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867030", "t": 1, "q": "某抽水蓄能电站的上水库为年调节水库，其调节周期内的水位变化主要受以下哪种因素影响？", "a": ["日内电网负荷波动", "周内电网负荷波动", "季节间电网负荷变化和来水变化", "日内水库蒸发和渗漏损失", "", ""], "r": "C", "e": "年调节水库是按年度进行水量调节，要考虑一年中不同季节情况。季节间电网负荷变化需要通过水库调节来满足，同时来水变化也会影响水库水位，所以其水位变化主要受季节间电网负荷变化和来水变化影响。而日内、周内的负荷波动时间尺度小，不是年调节水库主要考虑因素；日内水库蒸发和渗漏损失影响较小。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867031", "t": 1, "q": "抽水蓄能电站中，用于将发电机发出的电能升压后送入电网的设备是以下哪项？", "a": ["励磁变压器", "主变压器", "厂用变压器", "电抗器", "", ""], "r": "B", "e": "主变压器的作用是将发电机发出的电能升压后送入电网。而励磁变压器为发电机励磁系统提供电源；厂用变压器为厂内设备供电；电抗器主要用于限制短路电流等。所以答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867032", "t": 1, "q": "以下哪种运行工况会导致抽水蓄能电站的\"水量损失\"最大？", "a": ["发电工况稳定运行", "抽水工况稳定运行", "频繁的抽水与发电工况转换", "调相工况运行", "", ""], "r": "C", "e": "频繁的抽水与发电工况转换时，设备启停、水流换向等操作多，会有更多水量在转换过程中损耗。而稳定运行和调相工况相对来说水量损失没那么大。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867033", "t": 1, "q": "抽水蓄能电站设计中，\"水力过渡过程\"分析主要针对以下哪种情况？", "a": ["机组长期稳定运行的水力特性", "机组启动、停机、工况转换时的水力参数变化", "水库水位长期变化的水力特性", "管道长期运行的磨损情况", "", ""], "r": "B", "e": "水力过渡过程是指由于电站机组工况改变等原因引起水流流速、压力等水力参数随时间变化的过程。机组启动、停机、工况转换时会使水流状态改变，引发水力参数变化，这正是水力过渡过程分析的主要内容。而A选项长期稳定运行水力特性无参数变化；C选项水库水位长期变化与机组工况改变引发的过渡过程无关；D选项管道磨损和水力过渡过程不是同一概念。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867034", "t": 1, "q": "以下关于抽水蓄能电站与新能源电站（如光伏、风电）协同运行的说法，正确的是哪项？", "a": ["抽水蓄能电站可吸收新能源电站的弃电用于抽水，储存能量", "抽水蓄能电站会增加新能源电站的弃电率", "两者协同运行时，抽水蓄能电站无需参与电网调频", "两者协同运行时，新能源电站的出力波动会加剧电网不稳定", "", ""], "r": "A", "e": "A选项，抽水蓄能可在新能源发电过剩有弃电时抽水储能；B选项，应是降低弃电率；C选项，抽水蓄能电站需参与电网调频等辅助服务；D选项，协同运行可缓解新能源出力波动对电网的影响。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867035", "t": 1, "q": "抽水蓄能电站水泵水轮机的\"气蚀余量\"（NPSH）是指以下哪项指标？", "a": ["水泵进口处单位重量水流的能量与发生气蚀时最低能量的差值", "水泵出口处单位重量水流的能量与进口能量的差值", "水轮机进口处单位重量水流的能量与出口能量的差值", "水轮机出口处单位重量水流的能量与发生气蚀时最低能量的差值", "", ""], "r": "A", "e": "气蚀余量是指水泵进口处单位重量水流的能量与发生气蚀时最低能量的差值。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867036", "t": 1, "q": "抽水蓄能电站的\"厂用电率\"是指以下哪项比值？", "a": ["电站厂用设备消耗的电能与电站年发电量的比值", "电站厂用设备消耗的电能与电站抽水消耗电能的比值", "电站厂用设备消耗的电能与电站年发电量和抽水消耗电能之和的比值", "电站厂用设备消耗的电能与电网输送给电站的电能的比值", "", ""], "r": "A", "e": "厂用电率是衡量厂用设备耗能情况与相关电量的比例关系。厂用电是厂用设备消耗的电能，通常用其与电站年发电量相比来体现厂用电占发电的比例情况。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867037", "t": 1, "q": "以下哪种地质灾害对抽水蓄能电站输水隧洞的威胁最大？", "a": ["水库诱发地震", "隧洞沿线的岩爆", "库区滑坡", "下游洪水", "", ""], "r": "B", "e": "抽水蓄能电站输水隧洞在地下，岩爆直接发生于隧洞沿线岩体，会对隧洞结构造成直接破坏，威胁最大。水库诱发地震、库区滑坡和下游洪水对输水隧洞的影响相对间接。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943680", "t": 2, "q": "抽水蓄能电站选址需综合考虑多种因素，以下属于选址关键因素的有哪些？（　）", "a": ["上下水库的地形条件（高差、距离）", "区域电网的负荷特性（峰谷差、调频需求）", "库区的地质条件（防渗、稳定性）", "当地的旅游资源分布", "水源的充足性（循环利用可行性）", ""], "r": "ABCE", "e": "抽水蓄能电站选址关键在于满足发电和运行需求。上下水库地形影响发电效率；区域电网负荷特性决定其调峰调频作用；库区地质条件关系到电站安全稳定；水源充足是循环发电的基础。而当地旅游资源分布与电站功能无关。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943681", "t": 2, "q": "抽水蓄能电站的主要建筑物包括以下哪些部分？（　）", "a": ["上水库及坝体", "下水库及坝体", "输水系统（引水、尾水隧洞、压力钢管）", "厂房（主机房、副厂房）", "升压站", ""], "r": "ABCDE", "e": "抽水蓄能电站由上水库、下水库、输水系统、厂房、升压站等主要部分组成。A上水库及坝体、B下水库及坝体、C输水系统、D厂房、E升压站都是其主要建筑物。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943682", "t": 2, "q": "以下哪些运行特性使抽水蓄能电站成为电网优质的调峰电源？（　）", "a": ["启动速度快（分钟级）", "出力调节范围大（0-额定出力）", "运行效率高（综合效率70%-80%）", "可实现双向能量转换（抽水蓄能、发电释能）", "无需消耗天然水资源", ""], "r": "ABCD", "e": "抽水蓄能电站能成为优质调峰电源，因其启动快可快速响应电网需求，出力调节范围大便于灵活适应负荷变化，双向能量转换可按需抽水或发电，运行效率较高保障能源利用。而是否消耗天然水资源并非调峰关键特性。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943683", "t": 2, "q": "抽水蓄能电站水泵水轮机在运行中可能发生的故障类型有哪些？（　）", "a": ["气蚀", "喘振", "飞逸", "漏油", "绝缘老化", ""], "r": "ABC", "e": "答案：ABC抽水蓄能电站水泵水轮机在运行中可能气蚀、喘振和飞逸等故障。", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943684", "t": 2, "q": "以下哪些措施可用于减少抽水蓄能电站输水系统的水锤效应？（　）", "a": ["安装调压阀或调压井", "延长阀门启闭时间", "减小输水管道直径", "在管道上设置空气阀", "采用弹性材料制作管道", ""], "r": "ABDE", "e": "水锤效应是因水流速度急剧变化引起压力大幅波动。安装调压阀或调压井可调节压力；延长阀门启闭时间能减缓水流速度突变；设置空气阀可缓冲压力；采用弹性材料制作管道可吸收部分压力波。而减小输水管道直径会增大水流流速变化，加剧水锤效应。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943685", "t": 2, "q": "抽水蓄能电站的综合效率受多种因素影响，以下哪些因素会导致综合效率降低？（　）", "a": ["水泵水轮机的水力损失", "发电机的电磁损失", "输水管道的沿程水头损失", "水库的蒸发和渗漏损失", "机组启动和工况转换的能量损失", ""], "r": "ABCDE", "e": "抽水蓄能电站将下水库的水抽到上水库储存能量，发电时再放水发电。各选项中，水泵水轮机水力损失、发电机电磁损失、输水管道沿程水头损失、水库蒸发和渗漏损失以及机组启动和工况转换能量损失，都会使能量在转换和传输过程中耗散，导致综合效率降低。所以答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943686", "t": 2, "q": "以下关于抽水蓄能电站调相工况的描述，正确的有哪些？（　）", "a": ["调相工况时，机组转轮处于空气中旋转", "调相工况可向电网提供感性无功功率", "调相工况可从电网吸收容性无功功
