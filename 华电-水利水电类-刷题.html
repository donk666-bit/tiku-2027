行组合。槽身自重、槽内水重、桥面活荷载都用设计值组合才符合基本组合要求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688723", "t": 1, "q": "水利水电工程中，钢筋的力学性能指标中，反映钢筋塑性性能的是", "a": ["屈服强度", "抗拉强度", "伸长率", "弹性模量", "", ""], "r": "C", "e": "伸长率是衡量钢筋塑性性能的指标，屈服强度、抗拉强度主要体现钢筋强度，弹性模量反映钢筋弹性特性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688724", "t": 1, "q": "某水利水电工程的土石坝，在进行坝体稳定分析时，采用条分法计算滑裂面抗滑稳定系数，下列关于条分法的说法正确的是", "a": ["瑞典条分法忽略条块间的水平作用力，计算结果偏于安全", "毕肖普法考虑条块间的水平作用力，计算结果偏于危险", "瑞典条分法考虑条块间的竖向作用力，毕肖普法忽略竖向作用力", "瑞典条分法计算的稳定系数比毕肖普法小，偏于安全", "", ""], "r": "D", "e": "瑞典条分法忽略条块间水平和竖向作用力，计算结果偏于危险，稳定系数比毕肖普法小；毕肖普法考虑条块间水平作用力，计算结果更符合实际。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688725", "t": 1, "q": "在水利水电工程混凝土结构设计中，混凝土的轴心抗压强度设计值fc与立方体抗压强度标准值fcu,k的关系是", "a": ["fc=0.85*fcu,k（不考虑强度等级修正）", "fc=0.76*fcu,k（适用于C50及以下混凝土）", "fc=0.67*fcu,k（适用于所有强度等级混凝土）", "fc=0.9*fcu,k（适用于C60及以上混凝土）", "", ""], "r": "B", "e": "在水利水电工程中，对于C50及以下混凝土，混凝土轴心抗压强度设计值fc与立方体抗压强度标准值fcu,k关系为fc = 0.76*fcu,k 。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688726", "t": 1, "q": "水利水电工程中，地下洞室的围岩稳定性分析时，若围岩为坚硬完整的花岗岩，其破坏模式主要是", "a": ["脆性破裂（拉裂或剪切破裂）", "塑性流动（围岩产生较大塑性变形）", "松动坍塌（围岩块体失稳掉落）", "管涌（围岩颗粒被水带走）", "", ""], "r": "A", "e": "坚硬完整的花岗岩强度高、脆性大，在围岩稳定性分析时，破坏模式主要是脆性破裂，包括拉裂或剪切破裂。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833792", "t": 2, "q": "关于水利工程中岩石边坡稳定性分析的方法，正确的有（　）", "a": ["极限平衡法是常用方法，需确定滑动面和计算抗滑力、滑动力", "有限元法可分析边坡岩体的应力、应变分布，判断潜在滑动区", "赤平投影法可用于分析边坡岩体结构面的组合对稳定性的影响", "边坡稳定性分析无需考虑地下水的作用", "边坡稳定性系数越大，边坡越稳定", ""], "r": "ABCE", "e": "此题考查岩石边坡稳定性分析方法相关知识。极限平衡法是常用方法，需确定滑动面并算抗滑力与滑动力，A对；有限元法能分析应力、应变分布，判断潜在滑动区，B对；赤平投影法可分析结构面组合对稳定性的影响，C对；地下水会影响边坡稳定性，分析时需考虑，D错；稳定性系数越大，边坡稳定性越好，E对。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833793", "t": 2, "q": "在材料力学中，水利工程中构件发生强度破坏的形式有（　）", "a": ["受拉破坏（如钢筋被拉断）", "受压破坏（如混凝土柱被压碎）", "受剪破坏（如梁的斜截面剪断）", "受扭破坏（如轴被扭断）", "失稳破坏（如细长柱被压弯）", ""], "r": "ABCD", "e": "水利工程中构件强度破坏形式多样，ABCD选项分别对应受拉、受压、受剪、受扭时的破坏，E选项失稳破坏虽也是构件失效情况，但不属于强度破坏范畴。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833794", "t": 2, "q": "水利工程中，关于钢结构防腐的说法，正确的有（　）", "a": ["钢结构防腐可采用涂料防腐", "钢结构防腐可采用镀锌防腐", "在水下环境中，钢结构可采用阴极保护法防腐", "钢结构的防腐措施与所处环境无关", "涂料防腐需定期维护，防止涂层老化脱落", ""], "r": "ABCE", "e": "钢结构防腐常见方法有涂料防腐、镀锌防腐等，水下环境可用阴极保护法，且防腐措施要根据所处环境确定，涂料会老化需定期维护。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833795", "t": 2, "q": "在结构力学中，水利工程中的梁发生斜截面破坏的形式有（　）", "a": ["斜拉破坏", "斜压破坏", "剪压破坏", "适筋破坏", "超筋破坏", ""], "r": "ABC", "e": "梁的斜截面破坏形式有斜拉、斜压、剪压破坏。适筋、超筋破坏是梁正截面破坏形式。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833796", "t": 2, "q": "水利工程中，影响钢筋与混凝土黏结强度的因素有（　）", "a": ["混凝土的强度等级", "钢筋的表面形状（如光圆钢筋、带肋钢筋）", "钢筋的直径", "混凝土保护层厚度", "横向钢筋的布置", ""], "r": "ABCDE", "e": "混凝土强度等级越高、带肋钢筋比光圆钢筋、钢筋直径小、保护层厚、有横向钢筋布置等都有利于提高钢筋与混凝土黏结强度。答案为ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833797", "t": 2, "q": "在材料力学中，水利工程中构件的刚度是指构件抵抗变形的能力，影响构件刚度的因素有（　）", "a": ["材料的弹性模量", "构件的截面尺寸和形状（如惯性矩）", "构件的长度", "作用在构件上的荷载大小", "构件的支撑条件", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833798", "t": 2, "q": "关于水利工程中土石坝坝体填土的选择，说法正确的有（　）", "a": ["填土应具有良好的压实性，便于达到设计压实度", "填土的渗透性应符合坝体不同部位的要求（如防渗体渗透性小）", "填土中不应含有过多的有机质和易溶盐", "填土的颗粒级配应均匀，避免出现粗颗粒集中现象", "黏性土填土的塑性指数越大越好", ""], "r": "ABCD", "e": "土石坝坝体填土要压实性好、渗透性符合要求、少含杂质，颗粒级配均匀。塑性指数过大的黏性土施工困难，并非越大越好。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833799", "t": 2, "q": "在结构力学中，水利工程中的拱结构按轴线形状可分为（　）", "a": ["抛物线拱", "圆弧拱", "悬链线拱", "折线拱", "曲线拱", ""], "r": "ABCD", "e": "在结构力学中，水利工程中的拱结构按轴线形状分类主要依据的是其几何特征。常见的拱结构轴线形状包括圆弧拱、抛物线拱、悬链线拱等，这些都是根据拱的轴线形状来命名的。折线拱也是一种按轴线形状分类的拱结构，其特点是轴线由直线段组成。而曲线拱是一个较为笼统的分类，通常不特指某一种具体的拱结构类型，因此不应包括在内。所以，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833800", "t": 2, "q": "水利工程中，关于水泥凝结时间的说法，正确的有（　）", "a": ["水泥的初凝时间是指从水泥加水拌合到水泥浆开始失去可塑性的时间", "水泥的终凝时间是指从水泥加水拌合到水泥浆完全失去可塑性并开始产生强度的时间", "水泥的初凝时间过短，易导致混凝土施工过程中出现事故（如初凝过早无法浇筑）", "水泥的终凝时间过长，会影响混凝土工程的施工进度", "水泥的凝结时间仅与水泥品种有关，与外界环境无关", ""], "r": "ABCD", "e": "A选项符合初凝时间定义；B选项符合终凝时间定义；初凝时间短，水泥很快失去塑性，施工中来不及操作易出事故，C对；终凝时间长，后续工序开展慢影响进度，D对；水泥凝结时间受水泥品种和外界环境等多因素影响，E错。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833801", "t": 2, "q": "在材料力学中，水利工程中受弯构件正截面受弯承载力计算的基本假定有（　）", "a": ["平截面假定（构件受弯后，横截面仍保持平面并与轴线垂直）", "不考虑受拉区混凝土的作用（拉力全部由钢筋承担）", "混凝土的应力-应变关系采用理想弹塑性模型", "钢筋的应力-应变关系采用理想弹塑性模型（屈服前线性，屈服后应力不变）", "忽略构件的轴向变形", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833802", "t": 2, "q": "水利工程中，关于岩石的变形特性，说法正确的有（　）", "a": ["岩石的应力-应变曲线通常包括弹性阶段、塑性阶段和破坏阶段", "岩石的弹性模量是应力与弹性应变的比值", "岩石的泊松比是横向应变与纵向应变的比值（绝对值）", "岩石在循环荷载作用下会产生疲劳损伤，导致强度降低", "岩石的变形特性与加载速率无关", ""], "r": "ABCD", "e": "岩石应力 - 应变曲线含弹性、塑性、破坏阶段；弹性模量是应力与弹性应变比值；泊松比是横向应变与纵向应变绝对值之比；循环荷载会使岩石疲劳损伤、强度降低；而岩石变形特性和加载速率有关。E 错误。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833803", "t": 2, "q": "关于水利工程中钢结构连接的说法，正确的有（　）", "a": ["焊接连接易产生焊接应力和焊接变形，需采取措施消除或减小", "高强度螺栓摩擦型连接的承载力取决于螺栓的预拉力和摩擦面的抗滑移系数", "普通螺栓连接的螺栓受剪时，可能发生螺栓杆剪断或孔壁挤压破坏", "铆钉连接的韧性和塑性比焊接连接好，适用于承受动力荷载的结构", "钢结构连接部位的强度不应低于构件本身的强度", ""], "r": "ABCDE", "e": "A 项，焊接会有应力和变形，要消除或减小；B 项，高强度螺栓摩擦型连接靠螺栓预拉力和摩擦面抗滑移系数决定承载力；C 项，普通螺栓受剪有杆剪断和孔壁挤压破坏可能；D 项，铆钉连接韧性和塑性好，适用于动荷结构；E 项，连接部位强度应不低于构件本身强度，各选项均正确。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833804", "t": 2, "q": "在结构力学中，水利工程中的静定结构在荷载作用下的特性有（　）", "a": ["内力和支座反力仅由平衡条件即可确定，唯一解", "结构的内力分布与构件的刚度无关", "任意一个多余约束的去除，都会使结构变成几何可变体系", "结构的变形与构件的刚度有关", "温度变化不会使静定结构产生内力", ""], "r": "ABDE", "e": "这是一道关于结构力学中静定结构特性的选择题。我们来简要分析每个选项：A. 内力和支座反力仅由平衡条件即可确定，唯一解。 静定结构的内力和支座反力确实可以通过平衡条件唯一确定，这是静定结构的基本特性。B. 结构的内力分布与构件的刚度无关。 在静定结构中，内力分布确实与构件的刚度无关，只与荷载和结构的几何形状有关。C. 任意一个多余约束的去除，都会使结构变成几何可变体系。 这是不正确的。静定结构去掉多余约束后，仍然是静定结构，不会变成几何可变体系。D. 结构的变形与构件的刚度有关。 静定结构的变形确实与构件的刚度有关，刚度越大，相同荷载下的变形越小。E. 温度变化不会使静定结构产生内力。 这是正确的。静定结构在温度变化下不会产生内力，因为静定结构的内力仅由外部荷载决定。综上所述，正确的选项是A、B、D和E。所以，正确答案是ABDE。", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833805", "t": 2, "q": "水利工程中，关于混凝土外加剂的说法，正确的有（　）", "a": ["减水剂可在保持混凝土和易性不变的情况下，减少用水量，提高混凝土强度", "早强剂可提高混凝土的早期强度，适用于冬季施工", "缓凝剂可延长混凝土的凝结时间，适用于大体积混凝土施工", "引气剂可引入微小气泡，提高混凝土的抗冻性和抗渗性", "外加剂的掺量越大，对混凝土性能的改善效果越好", ""], "r": "ABCD", "e": "减水剂能在和易性不变时减水提强；早强剂可提升早期强度，适合冬季施工；缓凝剂延长凝结时间，用于大体积混凝土；引气剂引入微小气泡，增强抗冻抗渗性。但外加剂掺量有合理范围，并非越大越好。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833806", "t": 2, "q": "在材料力学中，水利工程中构件的疲劳破坏是指（　）", "a": ["构件在多次重复荷载作用下，即使应力低于材料的强度极限，也会发生的破坏", "疲劳破坏的断口通常有明显的疲劳裂纹扩展区和瞬时断裂区", "构件的疲劳强度与荷载的循环次数有关，循环次数越多，疲劳强度越低", "疲劳破坏属于脆性破坏，破坏前无明显塑性变形", "构件的疲劳强度与荷载的循环特征（如应力比）无关", ""], "r": "ABCD", "e": "构件疲劳破坏是多次重复荷载下，应力低于强度极限也会发生破坏；断口有疲劳裂纹扩展区和瞬时断裂区；疲劳强度与循环次数有关，次数多强度低；属脆性破坏，破坏前无明显塑性变形；而疲劳强度与荷载循环特征有关。E选项错误。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833807", "t": 2, "q": "水利工程中，关于大体积混凝土施工的说法，正确的有（　）", "a": ["大体积混凝土施工需采取措施控制温度裂缝，如分层浇筑、预埋冷却水管", "大体积混凝土的浇筑强度应根据混凝土的初凝时间和浇筑面积确定", "大体积混凝土宜采用低热水泥或掺加粉煤灰等掺合料，降低水化热", "大体积混凝土的养护时间应比普通混凝土长，一般不少于14d", "大体积混凝土的温度控制指标中，混凝土内部最高温度与表面温度之差不应大于25℃", ""], "r": "ABCDE", "e": "大体积混凝土施工易产生温度裂缝，所以要控制温度，可分层浇筑、预埋冷却水管；浇筑强度要考虑初凝时间和浇筑面积；采用低热水泥或掺合料可降低水化热；养护时间长，一般不少于14d；内部最高温度与表面温度之差不超25℃。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833808", "t": 2, "q": "在结构力学中，水利工程中的刚架结构与桁架结构的区别有（　）", "a": ["刚架的节点为刚节点，桁架的节点为铰节点", "刚架的杆件承受弯矩、剪力和轴力，桁架的杆件仅承受轴力", "刚架的荷载可作用在杆件上，桁架的荷载仅作用在节点上", "刚架的内力计算需考虑弯曲变形，桁架的内力计算无需考虑弯曲变形", "刚架的刚度比桁架的刚度小", ""], "r": "ABCD", "e": "刚架节点多为刚节点，杆件承受弯矩、剪力和轴力，荷载可作用在杆件上，内力计算考虑弯曲变形；桁架节点为铰节点，杆件仅承受轴力，荷载仅作用在节点上，内力计算不考虑弯曲变形，且刚架刚度比桁架大。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833809", "t": 2, "q": "在静力学中，水利水电工程的平面任意力系平衡条件包括（　）", "a": ["力系中所有力在x轴上的投影代数和为零", "力系中所有力在y轴上的投影代数和为零", "力系中所有力对任意一点的力矩代数和为零", "力系中所有力的合力为零", "力系中所有力的合力偶矩为零", ""], "r": "ABC", "e": "平面任意力系平衡需满足力在两个坐标轴投影代数和为零、对任意一点力矩代数和为零。A、B、C选项分别对应这三个条件。D选项合力为零可由投影代数和为零推出，但表述不准确；E选项合力偶矩为零包含在对任意点力矩代数和为零中。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833810", "t": 2, "q": "水利水电工程中，钢筋的力学性能试验需测定的指标有（　）", "a": ["屈服强度", "抗拉强度", "伸长率", "冷弯性能", "硬度", ""], "r": "ABCD", "e": "钢筋力学性能试验主要测定屈服强度、抗拉强度、伸长率和冷弯性能。硬度不属于钢筋力学性能试验测定指标。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833811", "t": 2, "q": "在结构力学中，水利水电工程的超静定结构（如连续梁式渡槽）与静定结构相比，具有的特点有（　）", "a": ["存在多余约束力，内力分布更均匀", "结构刚度更大，变形更小", "局部破坏后，结构仍可能保持整体稳定", "内力计算需考虑变形协调条件", "荷载作用下，支座反力仅由静力平衡条件即可确定", ""], "r": "ABCD", "e": "超静定结构存在多余约束和多余约束力，内力分布更均匀，刚度大变形小，局部破坏可能仍整体稳定，内力计算要考虑变形协调条件。而静定结构支座反力由静力平衡条件确定，超静定结构不行。所以ABCD正确，E错误。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833812", "t": 2, "q": "水利水电工程中，混凝土的抗渗性能（抗渗等级W）主要与下列哪些因素相关（　）", "a": ["混凝土的水胶比（水与胶凝材料用量比）", "混凝土的密实度", "水泥的品种（如普通硅酸盐水泥、矿渣硅酸盐水泥）", "骨料的最大粒径", "混凝土的养护条件（如标准养护、自然养护）", ""], "r": "ABCE", "e": "混凝土抗渗性能与水胶比、密实度、水泥品种、养护条件有关，水胶比小、密实度高、合适水泥品种和良好养护条件有利抗渗；骨料最大粒径对抗渗影响小。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637050748833813", "t": 2, "q": "在水利水电工程力学分析中，下列关于荷载分类的说法正确的有（　）", "a": ["坝体自重属于永久荷载", "槽内水重属于可变荷载", "地震荷载属于偶然荷载", "温度变化产生的应力属于永久荷载", "施工荷载属于可变荷载", ""], "r": "ABCE", "e": "永久荷载是长期作用的，如坝体自重；可变荷载随时间变化，像槽内水重、施工荷载；偶然荷载是偶然出现的，如地震荷载；温度变化产生的应力是随温度改变而变化，属可变荷载。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449728", "t": 3, "q": "混凝土的弹性模量随龄期增长而一直增大，28d后弹性模量不再变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混凝土弹性模量随龄期增长而增大，但28d后并非不再变化，后续仍会缓慢增长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449729", "t": 3, "q": "水利工程中，超静定结构在温度变化时会产生附加内力，而静定结构不会。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "静定结构无多余约束，温度变化时可自由变形，不会产生附加内力；超静定结构有多余约束，温度变化时变形受限，会产生附加内力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449730", "t": 3, "q": "HRB400E钢筋的\"E\"表示该钢筋具有较高的抗震性能，其强屈比不小于1.25，屈强比不大于0.85。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "HRB400E是抗震钢筋，“E”代表有较高抗震性能，规范要求其强屈比不小于1.25，屈强比不大于0.85。", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449731", "t": 3, "q": "材料力学中，受扭圆轴的剪应力沿截面半径呈均匀分布，圆心处剪应力最大，边缘处剪应力为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "受扭圆轴剪应力沿截面半径呈线性分布，圆心处剪应力为零，边缘处剪应力最大。题干描述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449732", "t": 3, "q": "水利工程中，混凝土的碳化会提高混凝土的pH值，从而降低钢筋锈蚀的风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混凝土碳化是吸收二氧化碳降低pH值，碱性环境能保护钢筋，pH值降低会增加钢筋锈蚀风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449733", "t": 3, "q": "静定桁架结构的内力计算中，利用\"截面法\"可以求解任意一根杆件的轴力，无需结合\"节点法\"。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "截面法一般一次只能求解不多于三根未知轴力的杆件，当所求杆件轴力不满足此条件时，就需结合节点法。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449734", "t": 3, "q": "水利工程中，碾压混凝土的胶凝材料用量比常态混凝土少，因此其抗压强度比同强度等级常态混凝土低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "碾压混凝土虽然胶凝材料用量少，但因采用振动碾压工艺使压实密度高，其抗压强度并不比同强度等级常态混凝土低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449735", "t": 3, "q": "结构力学中，梁的斜截面破坏形式中，斜拉破坏属于脆性破坏，剪压破坏属于延性破坏，设计中应避免斜拉破坏，控制剪压破坏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梁斜截面三种破坏：<br />斜拉破坏：脆性破坏；<br />剪压破坏：仍然属于脆性破坏（有少量裂缝发展，但无明显塑性变形，不属于延性破坏）；<br />斜压破坏：脆性破坏。<br />钢筋混凝土受剪均为脆性破坏，没有延性破坏。<br />设计原则：防止斜拉、斜压破坏，使构件发生剪压破坏。<br />题干错误点：“剪压破坏属于延性破坏” 表述不对。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449736", "t": 3, "q": "混凝土的抗渗等级P8表示混凝土能承受8MPa的水压力而不渗透。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混凝土抗渗等级P8指的是能承受0.8MPa水压力而不渗透，并非8MPa。", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449737", "t": 3, "q": "水利工程中，岩石的抗压强度随试件尺寸的增大而增大，试件尺寸越小，测得的抗压强度越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "岩石抗压强度通常随试件尺寸增大而减小，尺寸越小测得抗压强度越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449738", "t": 3, "q": "材料力学中，受弯构件的正应力沿截面高度呈线性分布，中性轴处正应力最大，上下边缘处正应力为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在材料力学中，受弯构件正应力沿截面高度呈线性分布，但中性轴处正应力为零，上下边缘处正应力最大。  ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449739", "t": 3, "q": "水利工程中，高强度螺栓摩擦型连接的承载力取决于螺栓杆的抗剪强度和孔壁的抗压强度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程中，高强度螺栓摩擦型连接的承载力取决于连接板间的摩擦力，而非螺栓杆抗剪强度和孔壁抗压强度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449740", "t": 3, "q": "混凝土的徐变是指混凝土在长期不变荷载作用下，应变随时间增长的现象，徐变值与荷载作用时间成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混凝土徐变是在长期不变荷载下应变随时间增长的现象，但徐变值并非与荷载作用时间成正比，其增长规律是早期快后期慢。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449741", "t": 3, "q": "结构力学中，超静定结构的内力分布与构件的刚度比有关，刚度越大的构件，承受的内力越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超静定结构需结合变形协调条件求解内力，其内力分布和构件刚度比相关，一般刚度大的构件承受内力大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449742", "t": 3, "q": "水利工程中，预应力混凝土构件的预应力损失仅发生在张拉阶段，使用阶段不会产生预应力损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "预应力损失不仅发生在张拉阶段，使用阶段也会产生，如钢筋应力松弛、混凝土收缩和徐变等都会在使用阶段造成预应力损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449743", "t": 3, "q": "材料力学中，矩形截面梁的最大剪应力发生在截面的中性轴处，其值为平均剪应力的1.5倍。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在材料力学中，矩形截面梁的剪应力分布是不均匀的，最大剪应力的确出现在截面中性轴处，且数值是平均剪应力的1.5倍。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449744", "t": 3, "q": "水利工程中，土石坝坝体填土的压实度越高，填土的渗透性越大，抗剪强度越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土石坝坝体填土压实度越高，土的孔隙比越小，渗透性越小，且抗剪强度越大。所以题干表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449745", "t": 3, "q": "静定结构的支座反力和内力，仅通过平衡条件即可唯一确定，与结构的材料性质和截面尺寸无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "静定结构的特性就是其支座反力和内力可由平衡条件唯一确定，且不依赖材料性质和截面尺寸。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449746", "t": 3, "q": "水利工程中，水泥的初凝时间过长会影响混凝土的施工进度，终凝时间过短会导致混凝土出现裂缝。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449747", "t": 3, "q": "材料力学中，圆轴的抗扭刚度仅与材料的剪切模量有关，与截面尺寸无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "圆轴抗扭刚度为「test/yiwen_img/importSubject/2035637043773706240.png」，其中G是材料剪切模量，「test/yiwen_img/importSubject/2035637043966644224.png」是极惯性矩，与截面尺寸有关，所以抗扭刚度与材料和截面尺寸都有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449748", "t": 3, "q": "水利工程中，钢筋与混凝土的黏结强度仅与混凝土的强度等级有关，与钢筋的表面形状无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "钢筋与混凝土的黏结强度不仅与混凝土强度等级有关，还和钢筋表面形状等因素相关，带肋钢筋比光圆钢筋黏结强度更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449749", "t": 3, "q": "结构力学中，刚架结构的节点为刚节点，刚节点处各杆件的夹角保持不变，且能传递弯矩。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "刚架结构中刚节点的特性就是各杆件夹角在受力时保持不变，并且可以传递弯矩。所以该描述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449750", "t": 3, "q": "混凝土的抗冻等级F50表示混凝土在经受50次冻融循环后，其质量损失不超过5%，强度损失不超过25%。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "混凝土抗冻等级F50含义就是经50次冻融循环后，质量损失不超5%，强度损失不超25%。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449751", "t": 3, "q": "水利工程中，超静定结构的多余约束去除后，结构变成静定结构，其内力分布与原超静定结构相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超静定结构去除多余约束变为静定结构后，内力分布会改变，因为超静定结构的内力与多余约束有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449752", "t": 3, "q": "材料力学中，受拉构件的强度计算只需满足拉应力不超过材料的抗拉强度设计值，无需考虑截面尺寸。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "受拉构件强度计算时，拉应力等于拉力除以截面面积，截面尺寸影响拉应力大小，所以必须考虑截面尺寸。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449753", "t": 3, "q": "水利工程中，岩石边坡采用锚杆支护时，锚杆的长度越长，支护效果越好，无需考虑锚固深度和岩体条件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。锚杆支护效果并非仅取决于长度，还需综合考虑锚固深度和岩体条件等因素。不同岩体条件对锚杆锚固力要求不同，合理的锚固深度才能保证锚杆发挥最佳支护作用，不是长度越长就越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449754", "t": 3, "q": "结构力学中，梁的弯矩图在集中力作用点处发生突变，突变值等于该集中力的大小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梁的弯矩图在集中力作用点处斜率发生突变，而剪力图在集中力作用点处发生突变，突变值等于该集中力的大小。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449755", "t": 3, "q": "水利工程中，C60混凝土的轴心抗压强度标准值fck大于C50混凝土的fck，因此C60混凝土的抗渗性一定优于C50混凝土。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混凝土轴心抗压强度标准值和抗渗性是不同性能指标，轴心抗压强度高不意味着抗渗性就一定好，抗渗性还受其他因素影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449756", "t": 3, "q": "材料力学中，构件的刚度是指构件抵抗破坏的能力，刚度越大，构件越不容易破坏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "材料力学中，构件抵抗破坏的能力是强度，而刚度是指构件抵抗变形的能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449757", "t": 3, "q": "水利工程中，钢结构的焊接连接中，角焊缝的强度计算仅考虑焊缝的剪切强度，不考虑拉伸强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利工程钢结构焊接连接里，角焊缝主要承受剪切力，其强度计算通常确实仅考虑焊缝的剪切强度，不考虑拉伸强度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449758", "t": 3, "q": "静定结构在任意一个多余约束去除后，都会变成几何可变体系。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静定结构无多余约束，去除的不是多余约束，且去除一个约束不一定就变成几何可变体系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449759", "t": 3, "q": "水利工程中，混凝土的收缩包括干缩和徐变，干缩是混凝土在无荷载作用下因水分蒸发产生的体积缩小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449760", "t": 3, "q": "材料力学中，圆轴受扭时，横截面始终保持平面，且绕轴线转动，此为\"平面假设\"，是圆轴扭转理论的基础。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "平面假设是材料力学中圆轴扭转分析的重要基础，该假设表明圆轴受扭时横截面始终保持平面且绕轴线转动。", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449761", "t": 3, "q": "水利工程中，岩石的内摩擦角φ越大，岩石的抗剪强度越高，边坡越稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "岩石抗剪强度与内摩擦角φ正相关，φ越大，抗剪强度越高，能更好抵抗破坏使边坡越稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449762", "t": 3, "q": "结构力学中，位移法的基本未知量是多余未知力，力法的基本未知量是节点位移。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。位移法基本未知量是节点位移，力法基本未知量是多余未知力，与题目表述相反。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449763", "t": 3, "q": "水利工程中，预应力混凝土构件采用先张法施工时，预应力损失包括锚具变形损失和钢筋松弛损失，不包括混凝土收缩徐变损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "先张法施工的预应力混凝土构件，预应力损失包含锚具变形损失、钢筋松弛损失，也包括混凝土收缩徐变损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449764", "t": 3, "q": "材料力学中，矩形截面柱的稳定系数φ随长细比λ的增大而增大，λ越大，柱越不容易失稳。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在材料力学里，矩形截面柱的稳定系数φ随长细比λ增大而减小，λ越大柱越容易失稳。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449765", "t": 3, "q": "水利工程中，骨料的压碎指标值越小，说明骨料的强度越高，越适合用于高强度混凝土。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压碎指标值反映骨料抵抗压碎的能力，值越小表明骨料抵抗压碎能力越强，即强度越高，适合用于高强度混凝土。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449766", "t": 3, "q": "静定桁架结构中，零杆的判断依据是:在无荷载作用的两杆节点上，两杆内力均为零;在无荷载作用的三杆节点上，若其中两杆共线，则第三杆内力为零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是静定桁架零杆判断的基本规则，依据节点平衡条件可得出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637053093449767", "t": 3, "q": "水利工程中，大体积混凝土施工时，控制混凝土内部最高温度与表面温度之差不大于30℃，表面温度与环境温度之差不大于25℃。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程大体积混凝土施工，一般控制混凝土内部最高温度与表面温度之差不大于25℃，表面温度与环境温度之差不大于20℃，题干数据错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第1章 力学基础||第3节 岩土力学基本理论（1）", "n": "第1章 力学基础 / 第3节 岩土力学基本理论（1）", "qs": [{"id": "2035637057828818944", "t": 1, "q": "在土的抗剪强度试验中，下列关于排水条件对黏聚力c和内摩擦角φ值影响的说法，正确的是", "a": ["排水条件越好，c值越大，φ值越小", "排水条件越好，c值越小，φ值越大", "排水条件对c值无影响，仅增大φ值", "排水条件对φ值无影响，仅增大c值", "", ""], "r": "B", "e": "排水条件好时，土颗粒间有效应力增大，土的内摩擦作用能充分发挥，φ值增大；同时排水使孔隙水压力消散，土的黏聚力c会减小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818945", "t": 1, "q": "关于达西定律v=ki（v为渗透速度，k为渗透系数，i为水力梯度）的适用范围，下列表述正确的是", "a": ["适用于所有渗流，无论层流还是紊流", "仅适用于紊流渗流，雷诺数Re>1", "仅适用于层流渗流，雷诺数Re<1", "适用于水力梯度i>1的所有渗流", "", ""], "r": "C", "e": "达西定律适用于层流渗流，当雷诺数Re < 1时为层流。所以正确答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818946", "t": 1, "q": "材料力学中，梁发生纯弯曲时，横截面上的正应力分布特征是", "a": ["沿截面高度均匀分布", "沿截面高度线性分布，中性轴处最大", "沿截面高度线性分布，中性轴处为零", "仅在截面上下边缘存在，其余位置为零", "", ""], "r": "C", "e": "梁纯弯曲时，正应力沿截面高度线性分布，且中性轴处正应力为零。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818947", "t": 1, "q": "土的压缩系数a1-2的物理意义是", "a": ["压力从0增至100kPa时，单位压力增量引起的孔隙比变化", "压力从100kPa增至200kPa时，单位压力增量引起的孔隙比变化", "压力从200kPa增至300kPa时，单位压力增量引起的孔隙比变化", "压力从任意值增至该值+100kPa时，单位压力增量引起的孔隙比变化", "", ""], "r": "B", "e": "土的压缩系数a1 - 2指压力从100kPa增至200kPa时，单位压力增量引起的孔隙比变化。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818948", "t": 1, "q": "在岩石力学中，相同岩石的三轴抗压强度与单轴抗压强度的关系是", "a": ["三轴抗压强度等于单轴抗压强度", "三轴抗压强度小于单轴抗压强度", "三轴抗压强度大于单轴抗压强度", "两者无固定关系，取决于岩石密度", "", ""], "r": "C", "e": "在岩石力学里，岩石受三轴压力时侧向有约束，抵抗破坏能力更强，所以三轴抗压强度大于单轴抗压强度。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818949", "t": 1, "q": "根据静力学中的力的平移定理，将作用在物体A点的力F平移到B点，正确的做法是", "a": ["直接将F从A点移到B点，无需其他附加力", "将F从A点移到B点，并附加一个力偶，其力偶矩等于F对A点的矩", "将F从A点移到B点，并附加一个力偶，其力偶矩等于F对B点的矩", "将F从A点移到B点，并附加一个与F大小相等、方向相反的力", "", ""], "r": "C", "e": "力的平移定理是把作用在刚体上某点的力平移到另一点，需附加一个力偶，此力偶矩等于原力对平移点的矩。本题是将力F从A点移到B点，应附加力偶矩等于F对B点的矩。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818950", "t": 1, "q": "土的孔隙比e的定义表达式为", "a": ["e=孔隙体积/总体积", "e=孔隙体积/土粒体积", "e=土粒体积/孔隙体积", "e=土粒体积/总体积", "", ""], "r": "B", "e": "孔隙比是指土中孔隙体积与土粒体积之比。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818951", "t": 1, "q": "下列条件中，最易导致土发生管涌破坏的是", "a": ["土为均匀粗砂土，孔隙直径远大于细颗粒直径", "土为非均匀土，粗颗粒构成的孔隙能被细颗粒填充且细颗粒可移动", "土为饱和黏性土，含水量远大于液限", "土为密实粉土，孔隙比e<0.6", "", ""], "r": "B", "e": "管涌是指在渗流作用下，土体中的细颗粒在粗颗粒形成的孔隙中移动甚至被带出的现象。B选项非均匀土，粗颗粒孔隙能被细颗粒填充且细颗粒可移动，符合管涌发生条件。A均匀粗砂土不易发生，C饱和黏性土颗粒间黏聚力大难管涌，D密实粉土孔隙小也不易管涌。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818952", "t": 1, "q": "材料力学中，轴向拉压杆横截面上的正应力计算公式为", "a": ["σ=M/Wz（M为弯矩，Wz为抗弯截面系数）", "σ=T/Wt（T为扭矩，Wt为抗扭截面系数）", "σ=N/A（N为轴力，A为横截面面积）", "σ=V/A（V为剪力，A为横截面面积）", "", ""], "r": "C", "e": "轴向拉压杆横截面上正应力与轴力和横截面面积有关，公式是σ = N/A 。A是弯曲正应力公式，B是扭转切应力公式，D不是常见应力公式。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818953", "t": 1, "q": "土的饱和度Sr的定义是", "a": ["土中水的体积与土粒体积的比值（百分比）", "土中水的体积与孔隙体积的比值（百分比）", "土中孔隙体积与总体积的比值（百分比）", "土中孔隙体积与土粒体积的比值（百分比）", "", ""], "r": "B", "e": "饱和度是反映土中孔隙被水充满程度的指标，是土中水的体积与孔隙体积的比值（百分比）。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818954", "t": 1, "q": "莫尔-库仑强度理论中，土的抗剪强度τf与作用在剪切面上的正应力σ的关系表达式为", "a": ["τf=σtanφ（φ为内摩擦角）", "τf=c+σ（c为黏聚力）", "τf=c+σtanφ", "τf=c-σtanφ", "", ""], "r": "C", "e": "莫尔 - 库仑强度理论明确土的抗剪强度由黏聚力和摩擦力两部分组成，表达式为τf=c + σtanφ 。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818955", "t": 1, "q": "对于同一岩石，其弹性模量E与变形模量E0的大小关系是", "a": ["E>E0", "E=E0", "E<E0", "无法确定，取决于加载时间", "", ""], "r": "A", "e": "弹性模量是岩石完全弹性变形对应的模量，变形模量包含弹性变形和塑性变形，所以弹性模量大于变形模量。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818956", "t": 1, "q": "平面汇交力系平衡的充分必要条件是", "a": ["力系中各力在任意轴上的投影代数和均为零", "力系的合力等于零（或力的多边形自行闭合）", "力系中任意两个力的大小相等、方向相反", "力系中各力对任意点的力矩代数和均为零", "", ""], "r": "B", "e": "平面汇交力系平衡意味着合力为零，力的多边形自行闭合。A选项虽投影和为零能体现平衡，但不是本质条件；C选项任意两力大小相等、方向相反不能保证整个力系平衡；D选项是力系对某点合力矩为零的平衡条件，不是平面汇交力系平衡的充分必要条件。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818957", "t": 1, "q": "土的压实度K的定义是", "a": ["现场土的天然密度与室内击实试验最大干密度的比值（百分比）", "现场土的干密度与室内击实试验最大干密度的比值（百分比）", "现场土的天然密度与室内击实试验最佳含水量对应的密度的比值（百分比）", "现场土的干密度与室内击实试验最佳含水量对应的密度的比值（百分比）", "", ""], "r": "B", "e": "压实度是指现场土的干密度与室内击实试验最大干密度的比值（百分比）。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818958", "t": 1, "q": "渗流场中某点的总水头H的组成部分是", "a": ["位置水头+压力水头", "位置水头+流速水头", "压力水头+流速水头", "位置水头+压力水头+流速水头", "", ""], "r": "D", "e": "在渗流场中，某点的总水头H主要由三部分组成：位置水头、压力水头和流速水头。位置水头反映了水位高度对水头的影响；压力水头反映了水的压力能对水头的影响；流速水头则反映了水的动能对水头的影响。这三者共同决定了渗流场中某点的总水头。所以，正确答案是D选项：“位置水头+压力水头+流速水头”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818959", "t": 1, "q": "材料力学中，梁的剪力图与弯矩图的微分关系是", "a": ["dM/dx=V（V为剪力，M为弯矩），dV/dx=q（q为分布荷载集度）", "dM/dx=-V，dV/dx=-q", "dM/dx=V，dV/dx=q", "dM/dx=-V，dV/dx=q", "", ""], "r": "A", "e": "在材料力学里，梁的剪力图与弯矩图存在基本的微分关系，即弯矩对x的一阶导数等于剪力，剪力对x的一阶导数等于分布荷载集度，表达式为dM/dx = V，dV/dx = q 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818960", "t": 1, "q": "土的塑性指数IP的计算公式为", "a": ["IP=ωP-ωL（ωP为塑限，ωL为液限）", "IP=ωL-ωP", "IP=ωL-ωs（ωs为缩限）", "IP=ωs-ωP", "", ""], "r": "B", "e": "土的塑性指数是液限与塑限之差。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818961", "t": 1, "q": "岩石的软化系数KR的定义是", "a": ["岩石干燥状态下的单轴抗压强度与饱和状态下的单轴抗压强度的比值", "岩石饱和状态下的单轴抗压强度与干燥状态下的单轴抗压强度的比值", "岩石冻融后的单轴抗压强度与冻融前的单轴抗压强度的比值", "岩石冻融前的单轴抗压强度与冻融后的单轴抗压强度的比值", "", ""], "r": "B", "e": "岩石软化系数是反映岩石耐水性的指标，是饱和状态下单轴抗压强度与干燥状态下单轴抗压强度之比。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818962", "t": 1, "q": "静力学中，力矩的大小取决于", "a": ["力的大小和力的作用点到矩心的距离", "力的大小和力的作用线到矩心的垂直距离（力臂）", "力的大小和矩心的位置", "力的大小、方向和矩心的位置", "", ""], "r": "B", "e": "力矩大小等于力的大小与力臂（力的作用线到矩心的垂直距离）的乘积，所以取决于力的大小和力臂。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818963", "t": 1, "q": "下列因素中，对土的渗透系数k值影响最小的是", "a": ["土粒的大小及级配", "土的孔隙比", "渗流的水力梯度i", "流体的黏度（温度影响黏度）", "", ""], "r": "C", "e": "土的渗透系数主要与土的性质（土粒大小及级配、孔隙比）和流体性质（黏度）有关，而渗流的水力梯度不影响渗透系数。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818964", "t": 1, "q": "圆轴发生扭转时，横截面上的切应力分布特征是", "a": ["沿圆轴半径均匀分布", "沿圆轴半径线性分布，圆心处最大", "沿圆轴半径线性分布，圆心处为零，边缘处最大", "仅在圆轴横截面边缘存在，其余位置为零", "", ""], "r": "C", "e": "圆轴扭转时，横截面上切应力沿半径线性分布，圆心处切应力为零，边缘处切应力最大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818965", "t": 1, "q": "有效应力原理的核心表达式是", "a": ["总应力σ=有效应力σ'+孔隙水压力u", "有效应力σ'=总应力σ+孔隙水压力u", "孔隙水压力u=有效应力σ'-总应力σ", "总应力σ=有效应力σ'-孔隙水压力u", "", ""], "r": "A", "e": "有效应力原理指出总应力等于有效应力与孔隙水压力之和。所以核心表达式是总应力σ = 有效应力σ'+孔隙水压力u 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818966", "t": 1, "q": "岩石的蠕变特性是指", "a": ["岩石在恒定变形下，应力随时间逐渐减小的现象", "岩石在恒定应力下，变形随时间不断增长的现象", "岩石在循环应力作用下，强度逐渐降低的现象", "岩石在荷载作用下，瞬时产生弹性变形的现象", "", ""], "r": "B", "e": "岩石蠕变定义就是在恒定应力下，变形随时间不断增长。A是松弛现象，C是疲劳现象，D是弹性变形特点。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818967", "t": 1, "q": "关于力偶的性质，下列说法正确的是", "a": ["力偶可以与单个力平衡", "力偶只能与力偶平衡，不能与单个力平衡", "力偶的大小与力偶中力的大小无关，仅与力偶臂有关", "力偶对任意点的力矩为零", "", ""], "r": "B", "e": "力偶是由两个大小相等、方向相反且不共线的平行力组成，它不能与单个力平衡，只能与力偶平衡；力偶大小等于力与力偶臂乘积，与二者都有关；力偶对任意点的力矩不为零。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818968", "t": 1, "q": "土的压缩模量Es（1-2）的计算公式为", "a": ["Es（1-2）=（1+e2）/a1-2（e2为压力200kPa时的孔隙比，a1-2为100-200kPa压缩系数）", "Es（1-2）=（1+e1）/a1-2（e1为压力100kPa时的孔隙比，a1-2为100-200kPa压缩系数）", "Es（1-2）=a1-2/（1+e1）", "Es（1-2）=a1-2/（1+e2）", "", ""], "r": "B", "e": "土的压缩模量Es（1 - 2）计算公式是Es（1 - 2）=（1 + e1）/a1 - 2 ，其中e1为压力100kPa时的孔隙比，a1 - 2为100 - 200kPa压缩系数。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818969", "t": 1, "q": "渗流中的临界水力梯度icr是指", "a": ["渗流速度v达到最大值时的水力梯度", "土颗粒开始发生移动（渗流破坏）时的水力梯度", "孔隙水压力等于总应力时的水力梯度", "渗透系数k达到最大值时的水力梯度", "", ""], "r": "B", "e": "临界水力梯度是土颗粒开始发生移动即出现渗流破坏时的水力梯度。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818970", "t": 1, "q": "材料力学中，构件强度条件的核心是", "a": ["构件的最大变形不超过许用变形", "构件的最大工作应力不超过材料的许用应力", "构件的最大内力不超过材料的极限内力", "构件的最大刚度不超过许用刚度", "", ""], "r": "B", "e": "强度条件核心是保证构件工作时最大应力不超材料许用应力。答案选B。  ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818971", "t": 1, "q": "土的击实试验中，最佳含水量ωop的含义是", "a": ["土在该含水量下，密度最大", "土在该含水量下，干密度最大", "土在该含水量下，饱和度最大", "土在该含水量下，孔隙比最小", "", ""], "r": "B", "e": "击实试验中，最佳含水量是使土达到最大干密度时对应的含水量。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818972", "t": 1, "q": "岩石的泊松比μ的定义是", "a": ["岩石受轴向压力时，轴向压缩应变与横向膨胀应变的比值（绝对值）", "岩石受轴向压力时，横向膨胀应变与轴向压缩应变的比值（绝对值）", "岩石受轴向拉力时，轴向伸长应变与横向收缩应变的比值（绝对值）", "岩石受轴向拉力时，横向收缩应变与轴向伸长应变的比值（绝对值）", "", ""], "r": "B", "e": "泊松比是指材料在单向受拉或受压时，横向正应变与轴向正应变的绝对值的比值。岩石受轴向压力时，横向膨胀，轴向压缩，所以泊松比是横向膨胀应变与轴向压缩应变的比值（绝对值）。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114176", "t": 2, "q": "影响土的渗透性系数k值的因素有（　）", "a": ["土颗粒的级配", "土的孔隙比", "水的黏滞性", "土的颜色", "土的矿物成分", ""], "r": "ABCE", "e": "土的渗透性系数k与土的性质和水的性质有关。土颗粒级配、孔隙比、矿物成分影响土的性质从而影响渗透性；水的黏滞性影响水的性质进而影响渗透性。而土的颜色与渗透性无关。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114177", "t": 2, "q": "根据有效应力原理，饱和土在荷载作用下，下列哪些物理量的变化与有效应力变化相关（　）", "a": ["土的体积", "土的强度", "孔隙水压力", "土的重度", "土的饱和度", ""], "r": "AB", "e": "有效应力控制土的体积变化和强度，土的体积变化对应有效应力变化，强度也因有效应力改变，而孔隙水压力与有效应力一同平衡总应力，但其变化本身不与有效应力变化直接相关，土的重度和饱和度不受有效应力变化影响。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114178", "t": 2, "q": "在边坡稳定分析中，属于导致边坡失稳的内在因素有（　）", "a": ["岩土体的性质（如黏聚力、内摩擦角）", "边坡的几何形状（如坡高、坡角）", "地下水的作用", "岩土体的结构面（如节理、断层）", "地震作用", ""], "r": "ABD", "e": "内在因素是边坡自身的特性，岩土体性质、边坡几何形状、岩土体结构面是边坡自身固有特征。而地下水作用、地震作用属于外在因素。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114179", "t": 2, "q": "下列关于土的压缩试验的说法中，正确的有（　）", "a": ["压缩试验可测得土的e-p曲线和e-logp曲线", "压缩试验的荷载施加方式为分级加荷", "压缩试验适用于黏性土，不适用于砂土", "压缩试验可确定土的压缩模量和压缩指数", "压缩试验中，土样的变形仅包括孔隙体积的减小", ""], "r": "ABD", "e": "这是一道关于土的压缩试验知识的选择题。我们逐项审视各个选项：A选项：压缩试验确实可以测得土的e-p曲线（孔隙比与压力的关系曲线）和e-logp曲线（孔隙比与压力对数值的关系曲线），这是压缩试验的基本成果之一。因此，A选项描述正确。B选项：压缩试验的荷载施加方式通常为分级加荷，以便准确观察土在不同压力下的变形特性。所以，B选项描述也是正确的。C选项：压缩试验不仅适用于黏性土，也适用于砂土等其他类型的土，只是试验方法和参数可能有所不同。因此，C选项描述错误。D选项：通过压缩试验，确实可以确定土的压缩模量和压缩指数，这两个参数是评价土压缩性的重要指标。所以，D选项描述正确。E选项：压缩试验中，土样的变形主要包括孔隙体积的减小和土颗粒的重新排列等，不仅仅是孔隙体积的减小。因此，E选项描述错误。综上所述，正确的选项是A、B和D。所以，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114180", "t": 2, "q": "朗肯土压力理论与库仑土压力理论的主要区别在于（　）", "a": ["假设条件不同", "适用的墙背形状不同", "计算出的土压力大小不同", "是否考虑墙背与填土间的摩擦力", "是否考虑填土的黏聚力", ""], "r": "ABD", "e": "朗肯和库仑土压力理论主要区别是假设条件不同，朗肯基于半无限土体的应力状态，库仑基于滑动土楔的静力平衡。由此导致适用墙背形状、是否考虑墙背与填土摩擦力等不同。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114181", "t": 2, "q": "地基处理中，属于排水固结法的有（　）", "a": ["堆载预压法", "真空预压法", "砂井法", "碎石桩法", "石灰桩法", ""], "r": "ABC", "e": "排水固结法是对天然地基，或先在地基中设置砂井（袋装砂井或塑料排水带）等竖向排水体，然后利用建筑物本身重量分级逐渐加载；或在建筑物建造前在场地上先行加载预压，使土体中的孔隙水排出，逐渐固结，地基发生沉降，同时强度逐步提高的方法。堆载预压、真空预压、砂井法都属排水固结法。碎石桩法是置换法，石灰桩法是化学加固法。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114182", "t": 2, "q": "土的抗剪强度试验中，三轴压缩试验相对于直接剪切试验的优点有（　）", "a": ["能控制排水条件", "能测量孔隙水压力", "剪切面固定", "应力状态明确", "适用于所有土类", ""], "r": "ABD", "e": "三轴压缩试验能控制排水条件、测量孔隙水压力，应力状态明确，而直剪试验剪切面固定是其缺点，且三轴试验并非适用于所有土类。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114183", "t": 2, "q": "下列关于土的颗粒级配的说法中，正确的有（　）", "a": ["级配良好的土，颗粒大小分布均匀", "级配曲线越平缓，土的级配越好", "曲率系数Cc在1~3之间，同时不均匀系数Cu>5，土的级配良好", "不均匀系数Cu越大，土的颗粒级配越不均匀", "级配良好的土，压实后密度较大，强度较高", ""], "r": "BCDE", "e": "级配良好的土颗粒大小分布不均，A错；级配曲线平缓说明粒径范围大，级配好，B对；曲率系数Cc在1 - 3之间且不均匀系数Cu>5时，土级配良好，C对；Cu越大，土颗粒粒径范围越大，级配越不均，D对；级配良好的土压实后密度大、强度高，E对。答案：BCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114184", "t": 2, "q": "影响地基附加应力分布的因素有（　）", "a": ["荷载的形状和大小", "荷载的作用时间", "地基土的性质", "荷载的分布形式", "地基的分层情况", ""], "r": "ACDE", "e": "地基附加应力分布受多种因素影响，荷载形状、大小、分布形式会改变应力传递模式与量级；地基土性质如压缩性等不同，应力传递和分布不同；地基分层情况因各层特性差异也影响应力分布，而荷载作用时间主要影响地基沉降的发展过程，对附加应力分布影响不大。答案：ACDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114185", "t": 2, "q": "挡土墙设计中，需要考虑的土压力类型有（　）", "a": ["主动土压力", "被动土压力", "静止土压力", "最大土压力", "最小土压力", ""], "r": "ABC", "e": "挡土墙设计主要考虑三种土压力，分别是主动土压力、被动土压力和静止土压力。最大土压力和最小土压力不是设计中考虑的标准土压力类型。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114186", "t": 2, "q": "土的压缩性指标包括（　）", "a": ["压缩模量Es", "体积压缩系数mv", "压缩指数Cc", "回弹指数Cs", "孔隙比e", ""], "r": "ABCD", "e": "土的压缩性指标用于衡量土的压缩特性，压缩模量Es、体积压缩系数mv、压缩指数Cc、回弹指数Cs都与土的压缩过程及特性相关，而孔隙比e是土的基本物理性质指标，并非专门的压缩性指标。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114187", "t": 2, "q": "下列关于饱和黏性土固结的说法中，正确的有（　）", "a": ["固结过程是孔隙水压力逐渐消散，有效应力逐渐增加的过程", "固结时间与土的渗透性成正比，与土的压缩性成反比", "太沙基一维固结理论假设土的压缩和渗透仅沿竖向进行", "固结度是指已完成的固结沉降与最终固结沉降的比值", "初始孔隙水压力等于附加应力（一维固结条件下）", ""], "r": "ACDE", "e": "A正确，饱和黏性土固结就是孔隙水压力消散、有效应力增加过程；B错误，固结时间与土渗透性成反比；C正确，太沙基一维固结理论假设土压缩和渗透仅沿竖向；D正确，固结度定义就是已完成固结沉降与最终固结沉降比值；E正确，一维固结条件下初始孔隙水压力等于附加应力。答案：ACDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114188", "t": 2, "q": "边坡稳定分析中，常用的滑动面假设形式有（　）", "a": ["圆弧滑动面", "折线滑动面", "平面滑动面", "曲面滑动面", "不规则滑动面", ""], "r": "ABC", "e": "在边坡稳定分析中，常用的滑动面假设形式有圆弧滑动面、折线滑动面、平面滑动面。曲面滑动面和不规则滑动面不是常用假设形式。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114189", "t": 2, "q": "土的物理性质指标中，属于三相比例指标的有（　）", "a": ["天然含水量ω", "孔隙比e", "相对密度ds", "天然重度γ", "饱和度Sr", ""], "r": "ABDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114190", "t": 2, "q": "地基承载力特征值的确定方法有（　）", "a": ["载荷试验法", "理论公式计算法", "经验参数法（查表法）", "标准贯入试验法", "动力触探试验法", ""], "r": "ABCDE", "e": "地基承载力特征值确定方法多样，载荷试验法最直接可靠；理论公式计算法基于力学原理；经验参数法依据已有经验和表格；标准贯入试验、动力触探试验通过原位测试获取数据辅助确定。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114191", "t": 2, "q": "下列关于土的内摩擦角的说法中，正确的有（　）", "a": ["内摩擦角是土颗粒间摩擦力和咬合力的综合反映", "砂土的内摩擦角大于黏性土的内摩擦角", "土的密实度越高，内摩擦角越大", "内摩擦角随有效应力的增大而增大", "内摩擦角与土的颗粒形状有关，棱角状颗粒的土内摩擦角较大", ""], "r": "ABCE", "e": "土的内摩擦角反映土颗粒间摩擦力和咬合力，受颗粒形状、密实度等影响，棱角状颗粒、密实度高时内摩擦角大，砂土内摩擦角通常大于黏性土；它大小与有效应力无关。答案选ABCE 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114192", "t": 2, "q": "排水固结法处理地基的作用包括（　）", "a": ["加速地基沉降", "提高地基承载力", "减小地基压缩性", "消除地基液化", "提高土的抗剪强度", ""], "r": "ABCE", "e": "排水固结法使土体排水，能加速沉降，随着孔隙水排出，土的密实度增加，可提高承载力、减小压缩性和提高抗剪强度，但不能消除地基液化。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114193", "t": 2, "q": "下列关于挡土墙稳定性验算的内容有（　）", "a": ["抗滑稳定性验算", "抗倾覆稳定性验算", "地基承载力验算", "墙身强度验算", "整体稳定性验算", ""], "r": "ABCDE", "e": "挡土墙稳定性验算需考虑自身滑动、倾覆、地基承载、墙身强度及整体稳定等方面。ABCD 选项分别对应抗滑、抗倾覆、地基承载和墙身强度，E 选项是整体稳定性，这些都是挡土墙稳定性验算的内容。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114194", "t": 2, "q": "土的渗透性试验中，变水头试验适用于（　）", "a": ["黏性土", "粉土", "细砂土", "粗砂土", "砾石土", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114195", "t": 2, "q": "根据摩尔-库仑强度理论，土样发生剪切破坏的条件是（　）", "a": ["剪切面的剪应力达到抗剪强度", "摩尔应力圆与抗剪强度线相切", "剪切面的法向应力达到最大值", "摩尔应力圆的半径达到最大值", "满足τ=c+σtanφ", ""], "r": "ABE", "e": "土样发生剪切破坏时，剪切面剪应力达到抗剪强度，此时摩尔应力圆与抗剪强度线相切，也满足抗剪强度公式τ=c + σtanφ 。法向应力最大、摩尔应力圆半径最大都不是土样剪切破坏条件。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114196", "t": 2, "q": "影响土的压实效果的因素有（　）", "a": ["压实机械的类型和压实功", "土的含水量", "土的种类和级配", "压实土层的厚度", "压实的时间", ""], "r": "ABCD", "e": "影响土压实效果的因素有压实机械类型与压实功、土的含水量、土的种类和级配、压实土层厚度等，而压实时间并非主要影响因素。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114197", "t": 2, "q": "下列关于地基沉降的说法中，正确的有（　）", "a": ["瞬时沉降是由于土的弹性变形引起的", "固结沉降是由于土的孔隙体积减小引起的", "次固结沉降是由于土颗粒间的黏滞性变形引起的", "饱和黏性土的沉降主要由固结沉降组成", "砂土的沉降主要由次固结沉降组成", ""], "r": "ABCD", "e": "瞬时沉降是土弹性变形，A对；固结沉降因孔隙体积减小，B对；次固结沉降是土颗粒间黏滞性变形，C对；饱和黏性土沉降主要是固结沉降，D对；砂土沉降主要是瞬时沉降，E错。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114198", "t": 2, "q": "土压力的大小与下列哪些因素有关（　）", "a": ["土的重度", "土的黏聚力和内摩擦角", "挡土墙的高度", "挡土墙的位移方向和大小", "填土的表面坡度", ""], "r": "ABCDE", "e": "土压力大小受土的物理性质（重度、黏聚力和内摩擦角）、挡土墙情况（高度、位移）及填土表面状况（坡度）影响。答案为ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114199", "t": 2, "q": "下列关于岩石地基的说法中，正确的有（　）", "a": ["岩石地基的承载力主要取决于岩石的单轴抗压强度", "岩石地基的变形主要由岩石的弹性变形引起", "完整性好的岩石地基，承载力较高，变形较小", "岩石地基无需进行承载力验算（当强度足够时）", "岩石地基的处理方法主要有灌浆加固、锚杆加固等", ""], "r": "ABCE", "e": "这是一道关于岩石地基特性与处理方法的选择题。我们来逐一分析每个选项：A项：岩石地基的承载力确实主要取决于岩石的单轴抗压强度。这是因为岩石的抗压强度是其承载能力的重要指标，反映了岩石在受压时的抵抗能力。因此，A项正确。B项：岩石地基的变形主要由岩石的弹性变形引起。在岩石受力过程中，其弹性变形是主要的变形形式，这与岩石的力学性质相符。所以，B项正确。C项：完整性好的岩石地基，其承载力较高，变形较小。这是因为完整性好的岩石具有更强的结构稳定性和承载能力，同时变形也更为可控。因此，C项描述准确，正确。D项：岩石地基无需进行承载力验算（当强度足够时）。这一说法是不准确的。即使岩石强度足够，仍需进行承载力验算以确保地基的安全性和稳定性。因此，D项错误。E项：岩石地基的处理方法主要包括灌浆加固、锚杆加固等。这些方法是提升岩石地基承载力和稳定性的常用手段。因此，E项正确。综上所述，正确的选项是A、B、C和E。所以，正确答案是ABCE。", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114200", "t": 2, "q": "边坡稳定的影响因素中，属于外在因素的有（　）", "a": ["降雨", "地震", "开挖荷载", "地下水渗流", "岩土体的性质", ""], "r": "ABCD", "e": "答案：ABCD边坡稳定影响因素可分为外在因素和内在因素。外在因素包括坡顶荷载、降水或排水、开挖坡脚、地震、风化作用、人工开挖、爆破以及工程荷载等；内在因素包括组成边坡的岩土体性质、地质构造、岩土体结构和岩体的初始应力状态等。", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114201", "t": 2, "q": "下列关于土的三相体系的说法中，正确的有（　）", "a": ["土的三相是指固相（土颗粒）、液相（水）和气相（空气）", "饱和土的三相体系中，气相体积为零", "不饱和土的三相体系中，三相体积均大于零", "干土的三相体系中，液相体积为零", "土的三相比例指标可相互换算", ""], "r": "ABCDE", "e": "土由固相、液相和气相组成三相体系；饱和土无气体，气相体积为零；不饱和土三相都有，体积均大于零；干土无水，液相体积为零；土的三相比例指标可通过公式相互换算。答案全选。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114202", "t": 2, "q": "地基处理的目的包括（　）", "a": ["提高地基承载力", "减小地基变形", "改善地基渗透性", "消除地基液化", "提高地基土的含水量", ""], "r": "ABCD", "e": "地基处理目的是改善地基性能，A提高承载力、B减小变形、C改善渗透性、D消除液化都属于改善地基性能的范畴；而提高含水量会使地基土性能变差，不是处理目的。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114203", "t": 2, "q": "下列关于直接剪切试验的说法中，正确的有（　）", "a": ["直接剪切试验分为快剪、固结快剪和慢剪三种", "直接剪切试验的剪切面是固定的", "直接剪切试验无法测量孔隙水压力", "直接剪切试验适用于黏性土，不适用于砂土", "直接剪切试验的结果受剪切速率影响较大", ""], "r": "ABCE", "e": "直接剪切试验分快剪、固结快剪和慢剪；其剪切面固定；试验中不能测孔隙水压力；结果受剪切速率影响大。该试验对黏性土和砂土均适用。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114204", "t": 2, "q": "下列因素中，会影响土的抗剪强度的有（　）", "a": ["土的种类（黏性土、砂土等）", "土的天然密度", "土的天然含水量", "渗流排水条件", "土的应力历史（超固结、正常固结）", ""], "r": "ABCDE", "e": "土的抗剪强度受多种因素影响，土的种类不同性质有别影响抗剪强度；土的天然密度、含水量影响土颗粒间的相互作用；渗流排水条件改变孔隙水压力等影响抗剪；土的应力历史影响土的结构和性质进而影响抗剪。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114205", "t": 2, "q": "下列属于岩石强度理论的有（　）", "a": ["莫尔强度理论", "格里菲斯强度理论", "双剪强度理论", "统一强度理论", "最大剪应力理论（第三强度理论）", ""], "r": "ABCDE", "e": "这些选项均为常见的岩石强度理论。莫尔、格里菲斯、双剪、统一强度理论都直接用于分析岩石强度，最大剪应力理论虽最初用于材料强度分析，但也适用于岩石强度评估。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234496", "t": 3, "q": "饱和黏性土的不排水抗剪强度与试验时的围压无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "饱和黏性土不排水试验中，孔隙水压力随围压增加而增加，有效应力不变，抗剪强度不变，所以其不排水抗剪强度与围压无关。", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234497", "t": 3, "q": "土的压缩指数Cc越大，说明土的压缩性越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土的压缩指数Cc越大，表示土在压力变化时压缩变形越大，即土的压缩性越高，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234498", "t": 3, "q": "朗肯土压力理论计算出的被动土压力通常大于库仑土压力理论的结果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "朗肯土压力理论计算被动土压力时假设墙背竖直、光滑，填土面水平，未考虑墙背与填土间的摩擦作用，导致计算的被动土压力偏大，一般大于库仑土压力理论结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234499", "t": 3, "q": "地基附加应力在深度方向上的分布规律是随深度增加而线性减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "地基附加应力在深度方向上并非随深度增加线性减小，其分布规律受多种因素影响，一般是先增大后减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234500", "t": 3, "q": "土的孔隙比e越大，说明土越密实。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "孔隙比e是土中孔隙体积与土粒体积之比，e越大表示孔隙体积相对土粒体积越大，土就越疏松，并非越密实。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234501", "t": 3, "q": "太沙基一维固结理论假设土的压缩系数和渗透性系数为常数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "太沙基一维固结理论为简化计算做了系列假设，其中就包含假设土的压缩系数和渗透性系数为常数。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234502", "t": 3, "q": "主动土压力是挡土墙在填土压力作用下，背离填土方向移动时，填土对墙背产生的最小土压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当挡土墙背离填土方向移动时，墙后土压力逐渐减小，当达到主动极限平衡状态时，土压力减至最小，此即主动土压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234503", "t": 3, "q": "土的天然含水量是指土中水的重量与土颗粒重量的比值，以百分数表示。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "土的天然含水量定义就是土中水的重量与土颗粒重量的比值，用百分数表示。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234504", "t": 3, "q": "三轴压缩试验中，固结排水剪（CD试验）测得的内摩擦角φ值小于固结不排水剪（CU试验）的φ值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在三轴压缩试验中，固结排水剪（CD试验）测得的内摩擦角φ值大于固结不排水剪（CU试验）的φ值。", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234505", "t": 3, "q": "边坡稳定分析的条分法中，瑞典条分法计算的安全系数通常比毕肖普法的结果偏小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "瑞典条分法不考虑条间力作用，计算偏于保守；毕肖普法考虑了条间力的部分影响，计算结果更合理。所以瑞典条分法算得的安全系数通常比毕肖普法结果偏小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234506", "t": 3, "q": "土的渗透性系数k值越大，说明土的透水性越差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。土的渗透性系数k是衡量土透水性的指标，k值越大，土的透水性越好，而不是越差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234507", "t": 3, "q": "有效应力原理仅适用于饱和土，不适用于不饱和土。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "有效应力原理最初是基于饱和土提出，但后来经扩展也可应用于非饱和土。所以该表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234508", "t": 3, "q": "地基的最终沉降量仅与土的压缩性和附加应力有关，与地基土的分层情况无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "地基最终沉降量不仅与土的压缩性、附加应力有关，也和地基土分层情况有关，不同分层土的压缩性等特性不同，分层情况会影响沉降计算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234509", "t": 3, "q": "土的塑性指数越大，说明土的塑性范围越广，黏粒含量越多。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "塑性指数是液限和塑限差值，差值大即塑性范围广，而黏粒多土的可塑性强，塑性指数就大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234510", "t": 3, "q": "挡土墙的抗滑稳定性验算中，滑动力矩是由挡土墙的自重产生的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "挡土墙抗滑稳定性验算中，滑动力主要是墙后填土的土压力等，并非由挡土墙自重产生，自重一般提供抗滑力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234511", "t": 3, "q": "土的压缩主要是由于土颗粒的压缩变形引起的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土的压缩主要是土中孔隙体积减小，包括孔隙中水和气体被挤出，而不是土颗粒的压缩变形，土颗粒本身压缩变形极小可忽略。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234512", "t": 3, "q": "标准贯入试验的击数N值越大，说明土的密实度越高，承载力越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "标准贯入试验中，N值是衡量土密实程度的指标，N值越大，土越密实，通常其承载力也越大。", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234513", "t": 3, "q": "库仑土压力理论基于弹性力学中的应力状态分析。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "库仑土压力理论是根据墙后土体处于极限平衡状态并形成滑动楔体时，由楔体的静力平衡条件得出的，而基于弹性力学中应力状态分析的是朗肯土压力理论。", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234514", "t": 3, "q": "饱和土在固结过程中，孔隙水压力逐渐增加，有效应力逐渐减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "饱和土固结时，孔隙水排出，孔隙水压力逐渐减小，有效应力逐渐增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234515", "t": 3, "q": "土的液性指数IL>1时，土处于流塑状态;IL<0时，土处于坚硬状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "液性指数是判别土的软硬状态的指标，当IL>1时，土呈流塑状态；IL<0时，土处于坚硬状态。这是土力学中关于土的状态与液性指数关系的基本内容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234516", "t": 3, "q": "边坡的安全系数是指抗滑力矩与滑动力矩的比值，安全系数大于1时，边坡稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边坡安全系数定义就是抗滑力矩与滑动力矩比值，当安全系数大于1，意味着抗滑能力大于滑动能力，边坡稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234517", "t": 3, "q": "土的干重度γd越大，说明土的密实度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "干重度指单位体积土中固体颗粒的重力，干重度越大意味着单位体积内固体颗粒越多，土的孔隙就越小，土也就越密实。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234518", "t": 3, "q": "直接剪切试验中，慢剪试验的结果最接近土在长期荷载作用下的抗剪强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "慢剪试验模拟的是土体在缓慢加荷条件下排水充分的情况，与土在长期荷载作用下排水固结、达到稳定状态的情况相符，所以其结果最接近土在长期荷载作用下的抗剪强度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234519", "t": 3, "q": "地基附加应力在水平方向上的分布是均匀的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "地基附加应力受基础形状、荷载分布等因素影响，在水平方向上分布并非均匀。", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234520", "t": 3, "q": "土的饱和度Sr=100%时，土为饱和土;Sr=0时，土为干土。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "饱和度Sr反映土中孔隙被水充满的程度，Sr = 100%意味着孔隙完全被水充满，是饱和土；Sr = 0表示土中孔隙没有水，是干土。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234521", "t": 3, "q": "朗肯土压力理论适用于所有类型的挡土墙。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "朗肯土压力理论有其适用条件，并非适用于所有类型挡土墙，它假定墙背直立、光滑，填土面水平，实际中很多挡土墙情况与此不符。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234522", "t": 3, "q": "土的压缩模量Es越大，说明土的压缩性越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土的压缩模量Es与压缩性成反比，Es越大，土越难压缩，即压缩性越低。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234523", "t": 3, "q": "真空预压法处理地基时，通过降低地基土的总应力来提高有效应力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "真空预压法是通过抽气形成真空，降低孔隙水压力，总应力不变，有效应力增大。所以题干说通过降低总应力来提高有效应力错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234524", "t": 3, "q": "土的内摩擦角φ值与土的颗粒形状无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土的内摩擦角φ与土的颗粒形状有关，颗粒形状不同，颗粒间的咬合等情况不同，会影响内摩擦角。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234525", "t": 3, "q": "边坡失稳的主要形式有滑坡、崩塌和泥石流。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边坡失稳指边坡岩土体在一定坡高和坡度条件下，受重力、水、地震等因素影响，其应力状态改变，超过自身强度而产生的破坏现象，主要形式包含滑坡、崩塌和泥石流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234526", "t": 3, "q": "土的孔隙比e和孔隙率n可以相互换算，换算公式为n=e/(1+e)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "孔隙比e是土中孔隙体积与土粒体积之比，孔隙率n是土中孔隙体积与土的总体积之比，二者存在换算关系n = e/(1 + e)。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234527", "t": 3, "q": "三轴压缩试验中，不排水剪（UU试验）测得的黏聚力cu值是土的有效黏聚力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不排水剪（UU试验）测得的黏聚力cu是总应力强度指标中的黏聚力，不是有效黏聚力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234528", "t": 3, "q": "地基承载力特征值是指地基所能承受的最大竖向压力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "地基承载力特征值不是地基所能承受的最大竖向压力，它是由载荷试验测定的地基土压力变形曲线线性变形段内规定的变形所对应的压力值，是保证地基稳定且有一定安全储备的压力值，并非最大竖向压力。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234529", "t": 3, "q": "土的渗透性系数k值随温度的升高而增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水的动力黏滞系数随温度升高而减小，根据达西定律及相关原理，渗透性系数与水的动力黏滞系数成反比，所以土的渗透性系数k值随温度升高而增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234530", "t": 3, "q": "毕肖普法在边坡稳定分析中，考虑了土条间的水平作用力和竖向作用力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "毕肖普法在边坡稳定分析时，对土条两侧作用力做了简化假定，但考虑了土条间的水平作用力和竖向作用力。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234531", "t": 3, "q": "土的天然重度γ总是大于土的有效重度γ'。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "土的有效重度是土在地下水位以下扣除水的浮力后的重度，天然重度包含土颗粒和孔隙水的重量，所以天然重度总是大于有效重度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234532", "t": 3, "q": "主动土压力系数Ka随土的内摩擦角φ的增大而增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "主动土压力系数「test/yiwen_img/importSubject/2035637054590816256.png」，内摩擦角「test/yiwen_img/importSubject/2035637054746005504.png」增大时，「test/yiwen_img/importSubject/2035637054779559936.png」减小，正切值减小，「test/yiwen_img/importSubject/2035637054825697280.png」减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234533", "t": 3, "q": "土的压缩试验中，分级加荷的目的是模拟实际工程中荷载的逐渐施加过程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在土的压缩试验里，分级加荷能较好地模拟实际工程中荷载逐步施加的情况，使试验结果更符合实际。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234534", "t": 3, "q": "岩石地基的变形主要由岩石的塑性变形引起。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "岩石地基变形主要由岩石的弹性变形引起，而非塑性变形。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234535", "t": 3, "q": "土的抗剪强度是指土抵抗剪切破坏的极限能力，与剪切面的方向无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土的抗剪强度与剪切面方向有关，不同方向上的抗剪强度可能不同。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第1章 力学基础||第3节 岩土力学基本理论（2）", "n": "第1章 力学基础 / 第3节 岩土力学基本理论（2）", "qs": [{"id": "2035637068314578944", "t": 1, "q": "平面一般力系平衡的充分必要条件是", "a": ["力系中各力在两个正交轴上的投影代数和均为零", "力系中各力对任意一点的力矩代数和为零", "力系中各力在两个正交轴上的投影代数和均为零，且对任意一点的力矩代数和为零", "力系的合力为零且合力偶矩为零", "", ""], "r": "C", "e": "平面一般力系平衡需同时满足力的平衡和力矩平衡。力的平衡体现为各力在两个正交轴上投影代数和为零，力矩平衡是各力对任意一点的力矩代数和为零。所以平面一般力系平衡的充分必要条件是力系中各力在两个正交轴上的投影代数和均为零，且对任意一点的力矩代数和为零。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578945", "t": 1, "q": "在岩土力学中，计算饱和黏性土的有效应力时，不需要用到的参数是（　）", "a": ["总应力", "孔隙水压力", "土的重度", "土的饱和度", "", ""], "r": "D", "e": "饱和黏性土有效应力等于总应力减去孔隙水压力，与土的饱和度无关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578946", "t": 1, "q": "某土样的天然含水量为25%，液限为40%，塑限为20%，该土样的塑性指数和液性指数分别为（　）", "a": ["20，0.25", "15，0.33", "20，0.33", "15，0.25", "", ""], "r": "A", "e": "塑性指数=液限 - 塑限=40 - 20 = 20；液性指数=（天然含水量 - 塑限）/（液限 - 塑限）=(25 - 20)/(40 - 20)=0.25。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578947", "t": 1, "q": "根据朗肯土压力理论，主动土压力系数Ka与土的内摩擦角φ的关系是（　）", "a": ["φ增大，Ka增大", "φ增大，Ka减小", "φ与Ka成正比", "φ与Ka无关", "", ""], "r": "B", "e": "朗肯主动土压力系数「test/yiwen_img/importSubject/2035637066125152256.png」 ，内摩擦角「test/yiwen_img/importSubject/2035637066263564288.png」增大时，「test/yiwen_img/importSubject/2035637066297118720.png」减小，「test/yiwen_img/importSubject/2035637066339061760.png」减小，「test/yiwen_img/importSubject/2035637066385199104.png」减小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578948", "t": 1, "q": "在地基沉降计算的分层总和法中，确定各分层的压缩模量时，应采用的应力状态是（　）", "a": ["自重应力", "附加应力", "自重应力与附加应力之和", "有效自重应力与附加应力之和", "", ""], "r": "D", "e": "分层总和法计算地基沉降时，确定各分层压缩模量用的是有效自重应力与附加应力之和对应的应力状态。因为压缩模量是土在有侧限条件下竖向应力与竖向应变的比值，计算时需考虑土体实际所受的有效应力，即有效自重应力与附加应力之和。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578949", "t": 1, "q": "土的渗透性系数k值不受下列哪个因素影响（　）", "a": ["土颗粒的级配", "土的孔隙比", "土的天然重度", "水的黏滞性", "", ""], "r": "C", "e": "土的渗透性系数k与土的颗粒级配、孔隙比以及水的黏滞性有关。土的天然重度对其渗透性系数无直接影响。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578950", "t": 1, "q": "摩尔应力圆中，当土样处于极限平衡状态时，摩尔应力圆与土的抗剪强度线的位置关系是（　）", "a": ["相离", "相切", "相交于两点", "内含", "", ""], "r": "B", "e": "土样处于极限平衡状态时，摩尔应力圆与抗剪强度线相切，这是土力学中关于极限平衡状态的基本判定。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578951", "t": 1, "q": "对于饱和黏性土，在不排水剪切试验中，土样的抗剪强度指标表现为（　）", "a": ["内摩擦角φ=0，黏聚力cu为常数", "内摩擦角φ>0，黏聚力cu=0", "内摩擦角φ>0，黏聚力cu>0", "内摩擦角φ=0，黏聚力cu=0", "", ""], "r": "A", "e": "饱和黏性土不排水剪切时，土样孔隙水压力不能消散，土颗粒间无相对移动趋势，内摩擦角φ=0，抗剪强度仅由黏聚力提供，且黏聚力cu为常数。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578952", "t": 1, "q": "根据土的压缩试验结果，土的压缩曲线（e-p曲线）中，e表示孔隙比，p表示压力，该曲线的斜率反映了土的（　）", "a": ["压缩模量", "体积压缩系数", "压缩指数", "回弹指数", "", ""], "r": "B", "e": "e - p曲线斜率表示土在压力作用下孔隙比随压力变化的特性，对应体积压缩系数。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578953", "t": 1, "q": "在边坡稳定分析的条分法中，瑞典条分法与毕肖普法的主要区别在于是否考虑（　）", "a": ["土条间的作用力", "土的黏聚力", "土的内摩擦角", "滑动面的形状", "", ""], "r": "A", "e": "瑞典条分法不考虑土条间作用力，毕肖普法考虑土条间水平作用力。所以二者主要区别在于是否考虑土条间的作用力。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578954", "t": 1, "q": "确定地基承载力特征值时，对于岩石地基，可不进行承载力验算的情况是（　）", "a": ["岩石单轴抗压强度标准值≥30MPa", "岩石完整性系数≥0.8", "岩石层厚≥5m", "岩石埋深≤1m", "", ""], "r": "A", "e": "当岩石单轴抗压强度标准值≥30MPa时，对于岩石地基可不进行承载力验算。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578955", "t": 1, "q": "土的自重应力沿深度的分布特征是（　）", "a": ["线性递增，增速与土的重度无关", "线性递增，增速等于土的有效重度", "非线性递增，增速随深度减小", "线性递增，增速等于土的天然重度（地下水位以上）或有效重度（地下水位以下）", "", ""], "r": "D", "e": "土的自重应力沿深度是线性变化，地下水位以上用天然重度计算，以下用有效重度计算，所以增速对应为天然重度（地下水位以上）或有效重度（地下水位以下）。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578956", "t": 1, "q": "在挡土墙设计中，若墙后填土为砂土，当填土的内摩擦角增大时，墙背受到的主动土压力会（　）", "a": ["增大", "减小", "不变", "先增大后减小", "", ""], "r": "B", "e": "根据朗肯土压力理论，主动土压力与填土内摩擦角有关，内摩擦角增大，主动土压力系数减小，主动土压力也随之减小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578957", "t": 1, "q": "土的压实度是指（　）", "a": ["土的天然密度与最大干密度的比值", "土的干密度与最大干密度的比值", "土的天然密度与最小干密度的比值", "土的干密度与最小干密度的比值", "", ""], "r": "B", "e": "压实度是土的干密度与最大干密度的比值，用来衡量压实效果。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578958", "t": 1, "q": "根据有效应力原理，饱和土中有效应力的变化会直接引起土的（　）", "a": ["孔隙水压力变化", "重度变化", "体积变化", "饱和度变化", "", ""], "r": "C", "e": "有效应力原理指出，土的变形和强度主要取决于有效应力。有效应力变化会使土颗粒间的相对位置改变，从而导致土的体积变化。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578959", "t": 1, "q": "某土样进行三轴压缩试验，当围压σ3不变，增加轴向压力σ1，直至土样破坏，该试验属于（　）", "a": ["不排水剪（UU试验）", "固结不排水剪（CU试验）", "固结排水剪（CD试验）", "无法确定，需看排水条件", "", ""], "r": "D", "e": "仅知围压不变增加轴向压力使土样破坏，未提及排水条件，无法判断是哪种试验。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578960", "t": 1, "q": "在土的颗粒级配分析中，曲率系数Cc的计算公式为（　）", "a": ["（d30）²/(d10×d60)", "（d60）²/(d10×d30)", "（d10×d60）/(d30)²", "（d10×d30）/(d60)²", "", ""], "r": "A", "e": "土的颗粒级配分析中，曲率系数Cc计算公式是Cc =（d30）²/(d10×d60) 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578961", "t": 1, "q": "地基附加应力的分布规律是（　）", "a": ["沿深度线性减小，沿水平方向均匀分布", "沿深度非线性减小，沿水平方向非线性分布", "沿深度均匀分布，沿水平方向线性减小", "沿深度和水平方向均均匀分布", "", ""], "r": "B", "e": "地基附加应力随深度增加而非线性减小，在水平方向上其分布也是非线性的。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578962", "t": 1, "q": "对于饱和软黏土，采用预压法处理地基时，真空预压与堆载预压的主要区别在于（　）", "a": ["是否增加总应力", "是否产生孔隙水压力", "是否需要排水系统", "是否提高土的抗剪强度", "", ""], "r": "A", "e": "真空预压是通过抽气使土体中形成负压，不增加总应力；堆载预压是通过堆载增加总应力。二者都会产生孔隙水压力、都需要排水系统、都能提高土的抗剪强度。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578963", "t": 1, "q": "土的抗剪强度指标φ和c，在下列哪种试验条件下测得的值最小（　）", "a": ["快剪（不排水剪）", "固结快剪（固结不排水剪）", "慢剪（固结排水剪）", "三种试验条件下值相同", "", ""], "r": "A", "e": "快剪试验不排水，土中孔隙水压力不能消散，土的抗剪强度发挥不充分，测得的φ和c值最小。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578964", "t": 1, "q": "朗肯土压力理论的适用条件是（　）", "a": ["墙背垂直、光滑，填土表面水平", "墙背倾斜、粗糙，填土表面倾斜", "墙背垂直、粗糙，填土表面水平", "墙背倾斜、光滑，填土表面水平", "", ""], "r": "A", "e": "朗肯土压力理论假设墙背垂直、光滑，填土表面水平。符合此条件的是A选项。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578965", "t": 1, "q": "土的压缩性指标中，压缩指数Cc的物理意义是（　）", "a": ["单位压力变化引起的孔隙比变化", "单位孔隙比变化引起的压力变化", "单位对数压力变化引起的孔隙比变化", "单位孔隙比变化引起的对数压力变化", "", ""], "r": "C", "e": "压缩指数Cc定义为e - logp曲线上直线段斜率，即单位对数压力变化引起的孔隙比变化。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578966", "t": 1, "q": "在边坡稳定分析中，当滑动面为折线形时，通常采用的分析方法是（　）", "a": ["瑞典条分法", "毕肖普法", "杨布条分法", "不平衡推力法", "", ""], "r": "D", "e": "瑞典条分法和毕肖普法适用于圆弧滑动面；杨布条分法虽可用于任意形状滑动面，但不是折线形滑动面常用方法；不平衡推力法适用于折线形滑动面。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578967", "t": 1, "q": "根据地基基础设计规范，当采用换填垫层法处理地基时，垫层的厚度不宜小于（　）", "a": ["0.3m", "0.5m", "0.8m", "1.0m", "", ""], "r": "B", "e": "依据地基基础设计规范，换填垫层法处理地基时，垫层厚度不宜小于0.5m。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578968", "t": 1, "q": "在土的渗透性试验中，常水头试验适用于（　）", "a": ["黏性土", "粉土", "砂土", "所有土类", "", ""], "r": "C", "e": "常水头试验适用于透水性大的土，砂土透水性大，而黏性土和粉土透水性小一般用变水头试验。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578969", "t": 1, "q": "摩尔-库仑强度理论认为，土的抗剪强度与（　）有关", "a": ["法向应力和黏聚力", "法向应力和内摩擦角", "黏聚力和内摩擦角", "法向应力、黏聚力和内摩擦角", "", ""], "r": "D", "e": "摩尔 - 库仑强度理论公式为τf = c + σtanφ ，其中τf是土的抗剪强度，c是黏聚力，σ是法向应力，φ是内摩擦角，可见土的抗剪强度与法向应力、黏聚力和内摩擦角都有关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578970", "t": 1, "q": "地基沉降按时间发展可分为瞬时沉降、固结沉降和次固结沉降，其中瞬时沉降主要发生在（　）", "a": ["饱和黏性土", "不饱和黏性土", "砂土", "岩石", "", ""], "r": "C", "e": "瞬时沉降是加荷后立即发生的沉降，主要由土的弹性变形引起，砂土透水性好，受力后变形能迅速完成，所以瞬时沉降主要发生在砂土。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578971", "t": 1, "q": "挡土墙墙背受到的被动土压力，发生在（　）情况下", "a": ["墙向填土方向移动", "墙背离填土方向移动", "墙静止不动", "填土发生沉降", "", ""], "r": "A", "e": "被动土压力是墙向填土方向移动，挤压填土，使填土达到极限平衡状态时作用在墙背上的土压力。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578972", "t": 1, "q": "土的孔隙比e=0.6，土颗粒相对密度ds=2.7，该土的干重度γd为（　）（γw=10kN/m³）", "a": ["16.875kN/m³", "17.5kN/m³", "18.2kN/m³", "19.0kN/m³", "", ""], "r": "A", "e": "根据干重度公式γd = dsγw / (1 + e)，将ds = 2.7、γw = 10kN/m³、e = 0.6代入可得γd = 2.7×10 / (1 + 0.6)=16.875kN/m³。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2035637068314578973", "t": 1, "q": "在岩土工程勘察中，采用标准贯入试验（SPT）测得的标准贯入击数N，主要用于评价（　）", "a": ["土的压缩性", "土的渗透性", "土的密实度和承载力", "土的黏聚力", "", ""], "r": "C", "e": "标准贯入试验测得的标准贯入击数N主要和土的密实度相关，而土的密实度又影响承载力，常用来评价土的密实度和承载力。所以答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210048", "t": 2, "q": "渗流破坏的常见形式有（　）", "a": ["管涌", "流土", "接触冲刷", "接触流土", "土的液化", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210049", "t": 2, "q": "材料力学中，梁在横力弯曲时，横截面上的内力包括（　）", "a": ["轴力N", "剪力V", "弯矩M", "扭矩T", "拉力F", ""], "r": "BC", "e": "梁在横力弯曲时，横截面上有与横截面相切的剪力V和使梁发生弯曲的弯矩M。轴力N是轴向拉压杆横截面上内力；扭矩T是受扭杆件横截面上内力；拉力F不是材料力学中规范的横截面上特定内力名称。所以答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210050", "t": 2, "q": "土的物理性质基本指标（可直接测定的指标）包括（　）", "a": ["土粒相对密度ds", "天然含水量ω", "天然密度ρ", "孔隙比e", "孔隙率n", ""], "r": "ABC", "e": "土的物理性质基本指标是可直接测定的，土粒相对密度、天然含水量、天然密度可直接测，而孔隙比和孔隙率需通过其他指标计算得出。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210051", "t": 2, "q": "影响岩石变形特性的主要因素有（　）", "a": ["岩石的矿物成分与结构构造", "围压大小", "温度高低", "加载速率", "岩石的含水量", ""], "r": "ABCDE", "e": "岩石变形特性受多方面因素影响，包括自身性质如矿物成分与结构构造、含水量，以及外部条件如围压、温度、加载速率等。答案：ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210052", "t": 2, "q": "静力学中，力的基本性质包括（　）", "a": ["力的三要素（大小、方向、作用点）", "力的平行四边形法则（力的合成）", "力的作用与反作用定律（牛顿第三定律）", "力的平移定理", "力的等效条件（力偶等效需力矩相等）", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210053", "t": 2, "q": "用于评价土的压缩性的指标有（　）", "a": ["压缩系数a", "压缩模量Es", "体积压缩系数mv", "孔隙比e", "压缩指数Cc", ""], "r": "ABCE", "e": "压缩系数a、压缩模量Es、体积压缩系数mv、压缩指数Cc都是评价土压缩性的指标，孔隙比e主要反映土中孔隙大小，不是直接用于评价压缩性的指标。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210054", "t": 2, "q": "室内测定土的渗透系数k的常用试验方法有（　）", "a": ["常水头渗透试验", "变水头渗透试验", "抽水试验", "压水试验", "击实试验", ""], "r": "AB", "e": "室内测定土渗透系数k常用常水头和变水头渗透试验。抽水和压水试验是野外试验方法，击实试验与渗透系数测定无关。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210055", "t": 2, "q": "材料力学中，轴向拉压杆的变形ΔL的计算公式ΔL=NL/(EA)中，各参数的含义正确的有（　）", "a": ["N为杆的轴力（拉力为正，压力为负）", "L为杆的计算长度", "E为材料的弹性模量（与材料种类有关）", "A为杆的横截面面积", "ΔL的正负号表示变形方向（正为伸长，负为缩短）", ""], "r": "ABCDE", "e": "该公式中N是轴力，拉正压负；L是计算长度；E是材料弹性模量，与材料有关；A是横截面面积；ΔL正为伸长负为缩短。答案全选。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210056", "t": 2, "q": "土的粒度成分（颗粒级配）分析常用的方法有（　）", "a": ["筛分法", "比重计法", "移液管法", "离心法", "烘干法", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210057", "t": 2, "q": "岩石的常见破坏形式有（　）", "a": ["脆性破坏", "塑性破坏", "疲劳破坏", "蠕变破坏", "弹性破坏", ""], "r": "ABCD", "e": "岩石常见破坏形式有脆性破坏、塑性破坏、疲劳破坏和蠕变破坏。弹性是材料在受力后能恢复原状的特性，不是破坏形式。所以答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210058", "t": 2, "q": "求解平面汇交力系合力的常用方法有（　）", "a": ["几何法（力的多边形法则）", "解析法（投影法）", "力矩平衡法", "等效替代法", "截面法", ""], "r": "AB", "e": "平面汇交力系合力常用求解方法是几何法（力的多边形法则）和解析法（投影法）。力矩平衡法用于平衡问题；等效替代法是一种通用思想非特定求解合力方法；截面法用于求杆件内力。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210059", "t": 2, "q": "土的饱和度Sr的可能取值范围及对应土的状态正确的有（　）", "a": ["Sr=0，土为干土", "0<Sr<50%，土为稍湿土", "50%≤Sr<80%，土为很湿土", "80%≤Sr≤100%，土为饱和土", "Sr>100%，土为超饱和土", ""], "r": "ABCD", "e": "土的饱和度 Sr=0 时无水分是干土；0＜Sr＜50%是稍湿土；50%≤Sr＜80%是很湿土；Sr≥80%是饱和土，饱和度不会超 100%。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210060", "t": 2, "q": "渗流过程中的水头损失包括（　）", "a": ["沿程水头损失", "局部水头损失", "位置水头损失", "压力水头损失", "流速水头损失", ""], "r": "AB", "e": "渗流的水头损失和水流一样，包括沿程水头损失和局部水头损失。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210061", "t": 2, "q": "材料力学中，圆轴扭转的强度条件τmax=Tmax/Wt≤[τ]中，各参数的含义正确的有（　）", "a": ["τmax为圆轴横截面上的最大切应力", "Tmax为圆轴上的最大扭矩", "Wt为圆轴的抗扭截面系数", "[τ]为材料的许用切应力", "Wt=IP/R（IP为极惯性矩，R为圆轴半径）", ""], "r": "ABCDE", "e": "该强度条件里，τmax是圆轴横截面上最大切应力，Tmax是圆轴最大扭矩，Wt是抗扭截面系数，[τ]是材料许用切应力，Wt = IP/R 也正确。各选项均符合参数含义。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210062", "t": 2, "q": "土的应力历史对其压缩性的影响表现为（　）", "a": ["超固结土的压缩性低于正常固结土", "正常固结土的压缩性低于欠固结土", "欠固结土在自重压力下仍会继续压缩", "超固结土只有当附加压力超过前期固结压力时，才会发生明显压缩", "应力历史对砂土的压缩性无影响", ""], "r": "ABCD", "e": "超固结土前期受过大荷载，结构更稳定，压缩性低于正常固结土；欠固结土自重压力下未完成固结，会继续压缩；超固结土附加压力超前期固结压力才明显压缩；正常固结土压缩性介于超固结与欠固结土之间；应力历史对砂土压缩性也有影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210063", "t": 2, "q": "描述岩石孔隙性的指标有（　）", "a": ["孔隙率n（孔隙体积与总体积的比值）", "孔隙比e（孔隙体积与固体体积的比值）", "孔隙直径（孔隙大小）", "孔隙连通性（孔隙是否连通）", "孔隙分选性（孔隙大小均匀程度）", ""], "r": "ABCDE", "e": "孔隙率和孔隙比是定量描述岩石孔隙性的常用指标，能直观反映孔隙情况；孔隙直径、连通性和分选性也能从不同方面体现岩石孔隙特征。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210064", "t": 2, "q": "关于静力学中力偶矩的说法，正确的有（　）", "a": ["力偶矩的大小等于力偶中力的大小与力偶臂的乘积（M=F×d）", "力偶臂是指力偶中两个力的作用线之间的垂直距离", "力偶矩的方向用右手螺旋定则判定（平面力偶用顺时针/逆时针表示）", "力偶矩是矢量，其作用面与力偶作用面一致", "力偶矩的大小与矩心的位置无关", ""], "r": "ABCDE", "e": "本题可根据力偶矩的相关概念逐一分析各选项： A选项：力偶矩的大小等于力偶中力的大小与力偶臂的乘积，公式为M = F×d，该选项正确。 B选项：力偶臂的定义就是力偶中两个力的作用线之间的垂直距离，该选项正确。 C选项：力偶矩的方向可以用右手螺旋定则判定，在平面力偶中通常用顺时针、逆时针来表示方向，该选项正确。 D选项：力偶矩是矢量，其作用面与力偶作用面一致，该选项正确。 E选项：力偶对物体的转动效应只取决于力偶的大小和转向，与矩心的位置无关，该选项正确。综上，答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210065", "t": 2, "q": "室内测定土的抗剪强度的常用试验方法有（　）", "a": ["直接剪切试验", "三轴压缩试验", "无侧限抗压强度试验", "十字板剪切试验", "击实试验", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210066", "t": 2, "q": "渗流对水利水电工程的主要影响有（　）", "a": ["导致基坑开挖时涌水，增加施工难度", "引起堤坝发生管涌或流土，威胁坝体安全", "降低地基土的有效应力，导致地基承载力下降", "加速土的压缩固结过程，缩短固结时间", "导致混凝土建筑物基础受渗水侵蚀，影响耐久性", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210067", "t": 2, "q": "材料力学中，梁的正应力强度条件σmax=Mmax/Wz≤[σ]中，各参数的含义及相关说法正确的有（　）", "a": ["σmax为梁横截面上的最大正应力", "Mmax为梁全跨的最大弯矩", "Wz为梁的抗弯截面系数，与截面形状和尺寸有关", "[σ]为材料的许用正应力", "Wz=Iz/ymax（Iz为截面对中性轴的惯性矩，ymax为截面边缘到中性轴的最大距离）", ""], "r": "ABCDE", "e": "该公式是梁正应力强度条件，σmax是梁横截面上最大正应力；Mmax是梁全跨最大弯矩；Wz是抗弯截面系数，与截面形状和尺寸有关，且Wz = Iz/ymax ；[σ]是材料许用正应力。各选项说法均正确。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210068", "t": 2, "q": "土的液化发生需满足的主要条件有（　）", "a": ["土为饱和松散砂土或粉土", "存在地震、振动或其他动荷载", "土的黏粒含量较高（>30%）", "土的初始静应力较低", "土的渗透系数较大", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210069", "t": 2, "q": "岩石的风化程度分级通常包括（　）", "a": ["未风化", "微风化", "中风化", "强风化", "全风化", ""], "r": "ABCDE", "e": "岩石风化程度分级常见有未风化、微风化、中风化、强风化、全风化这几种。答案：ABCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210070", "t": 2, "q": "静力学中，常见的约束类型有（　）", "a": ["柔性约束（如绳索、链条）", "光滑接触面约束（如支持面）", "铰链约束（如圆柱铰链、固定铰支座）", "固定端约束（如悬臂梁固定端）", "滚动铰支座约束（如桥梁支座）", ""], "r": "ABCDE", "e": "静力学里柔性约束、光滑接触面约束、铰链约束、固定端约束、滚动铰支座约束都是常见的约束类型。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210071", "t": 2, "q": "影响土的压实效果（压实度）的主要因素有（　）", "a": ["击实功（压实机械的能量）", "土的天然含水量", "土的种类（黏性土、砂土等）", "压实机械的类型（如羊足碾、光轮碾）", "压实层厚度", ""], "r": "ABCDE", "e": "土的压实效果受多方面因素影响。击实功、土的天然含水量、土的种类、压实机械类型、压实层厚度都会对压实度产生作用。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210072", "t": 2, "q": "土的渗透系数k与下列哪些因素有关（　）", "a": ["土粒的大小及级配", "土的孔隙比", "流体的黏度（与温度有关）", "流体的密度", "渗流的水力梯度", ""], "r": "ABCD", "e": "土的渗透系数k与土的性质（土粒大小及级配、孔隙比）和流体性质（黏度、密度）有关，与渗流的水力梯度无关。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210073", "t": 2, "q": "材料力学中，构件刚度条件的含义及相关说法正确的有（　）", "a": ["刚度条件保证构件的最大变形不超过许用变形", "刚度条件的表达式为Δmax≤[Δ]（变形）或θmax≤[θ]（转角）", "构件的刚度与材料的弹性模量E和截面几何性质（如Iz、IP）有关", "刚度越大，构件在相同荷载下的变形越小", "刚度不足会导致构件虽未破坏，但无法正常工作（如梁变形过大影响使用）", ""], "r": "ABCDE", "e": "刚度条件就是要让构件最大变形不超许用值，表达式对应变形和转角有规定，构件刚度受材料弹性模量和截面几何性质影响，刚度大变形小，刚度不足影响正常使用。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210074", "t": 2, "q": "土的有效应力的主要作用包括（　）", "a": ["控制土的压缩变形（有效应力增大，土颗粒挤压，孔隙减小）", "控制土的抗剪强度（有效应力增大，抗剪强度提高）", "影响土的渗透性（有效应力增大，孔隙减小，渗透系数降低）", "决定土的天然密度（有效应力越大，天然密度越大）", "影响土的饱和度（有效应力越大，饱和度越高）", ""], "r": "ABC", "e": "有效应力增大会使土颗粒挤压、孔隙减小，进而控制土压缩变形、影响渗透性；土抗剪强度与有效应力相关，有效应力增大抗剪强度提高。而土天然密度由土质量和体积决定，非有效应力决定；饱和度与孔隙中含水情况有关，和有效应力无直接关联。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210075", "t": 2, "q": "岩石三轴压缩试验中，描述应力状态的参数包括（　）", "a": ["围压σ3（侧向压力）", "轴向应力σ1（竖向压力）", "偏差应力σ1-σ3（主应力差）", "平均应力（σ1+2σ3）/3", "孔隙水压力u", ""], "r": "ABCD", "e": "岩石三轴压缩试验中，围压σ3、轴向应力σ1、偏差应力σ1 - σ3、平均应力（σ1 + 2σ3）/3 均可描述应力状态，孔隙水压力 u 主要与孔隙水相关，并非描述应力状态的参数。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210076", "t": 2, "q": "土的抗剪强度受下列哪些因素影响（　）", "a": ["土的含水量", "土的密实度", "试验中的排水条件", "剪切面的法向应力", "土的温度", ""], "r": "ABCD", "e": "土的抗剪强度与土的性质（含水量、密实度）、试验条件（排水条件）和剪切面法向应力有关，温度对其影响极小可忽略。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637070206210077", "t": 2, "q": "下列关于库仑土压力理论的说法中，正确的有（　）", "a": ["库仑土压力理论假设填土为理想散粒体（c=0）", "库仑土压力理论考虑了墙背与填土间的摩擦力", "库仑土压力理论适用于墙背倾斜、填土表面倾斜的情况", "库仑土压力理论计算的主动土压力通常大于朗肯理论的结果", "库仑土压力理论基于极限平衡状态下的力系平衡", ""], "r": "BCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444288", "t": 3, "q": "土的孔隙比e越大，说明土中孔隙体积越多，土的密实程度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "孔隙比e是土中孔隙体积与土粒体积之比，e越大，孔隙体积相对越多，土就越疏松，密实程度越低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444289", "t": 3, "q": "达西定律v=ki适用于所有类型的土，无论渗流是层流还是紊流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "达西定律 v = ki 仅适用于层流状态的渗流，并非适用于所有类型的土及所有渗流情况（包括紊流）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444290", "t": 3, "q": "材料力学中，梁发生纯弯曲时，横截面上的剪力为零，仅存在正应力，且正应力沿截面高度线性分布。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "纯弯曲是指梁的横截面上只有弯矩而无剪力的弯曲情况，此时横截面上剪力为零，仅存在正应力，且正应力沿截面高度按线性规律分布。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444291", "t": 3, "q": "莫尔-库仑强度理论认为，土的抗剪强度仅与作用在剪切面上的正应力有关，与土的黏聚力c无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "莫尔 - 库仑强度理论公式为τf = c + σtanφ ，表明土抗剪强度与黏聚力 c 和正应力 σ 都有关。", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444292", "t": 3, "q": "岩石的单轴抗压强度是指岩石试件在无侧向围压（σ3=0）的轴向压力作用下，破坏时单位面积所承受的最大压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是岩石单轴抗压强度的标准定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444293", "t": 3, "q": "静力学中，力的平移定理指出，将作用在物体上的力从一点平移到另一点，只需将力的作用点移动，无需附加任何其他力或力偶。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "力的平移定理是将作用在物体上的力从一点平移到另一点时，需要附加一个力偶，并非只需移动作用点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444294", "t": 3, "q": "土的压缩系数a1-2值越大，说明土在压力100kPa至200kPa段的压缩变形越小，土的压缩性越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土的压缩系数a1 - 2值越大，土在100kPa至200kPa段压缩变形越大，压缩性越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444295", "t": 3, "q": "渗流破坏中的流土主要发生在均匀细粒土（如粉土、粉质黏土）中，表现为土颗粒整体向上移动;管涌主要发生在非均匀土中，表现为细颗粒通过粗颗粒孔隙移动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流土多发生于均匀细粒土，特征是土颗粒整体向上移动；管涌常出现在非均匀土，细颗粒会通过粗颗粒孔隙移动。该描述与渗流破坏特点相符。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444296", "t": 3, "q": "材料力学中，轴向拉压杆横截面上的正应力均匀分布，其大小仅与轴力N和横截面面积A有关，与截面形状无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在材料力学轴向拉压杆模型中，基于平面假设，横截面上正应力均匀分布，计算公式为正应力等于轴力除以横截面面积，所以正应力大小只与轴力和横截面面积有关，和截面形状无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444297", "t": 3, "q": "土的饱和度Sr可以大于100%，因为土中除了孔隙水，还可能存在自由水（如表面附着水）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。土的饱和度 Sr 是土中孔隙水体积与孔隙体积之比，孔隙水体积不会超过孔隙体积，所以 Sr 取值范围是 0 - 100%，不能大于 100%。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444298", "t": 3, "q": "岩石的弹性模量E是岩石在弹性阶段的应力-应变比值，其大小与加载速率无关，仅由岩石的矿物成分决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "岩石弹性模量不仅与矿物成分有关，加载速率也会对其有影响，加载速率不同，弹性模量可能不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444299", "t": 3, "q": "静力学中，平面汇交力系平衡的充分必要条件是:力系中各力在任意两个正交轴上的投影代数和均为零，或力的多边形自行闭合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "平面汇交力系平衡时，各力在任意两个正交轴投影代数和为零可通过平衡方程得出；力多边形自行闭合是其几何条件，二者都是平面汇交力系平衡的充分必要条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444300", "t": 3, "q": "土的压实度K越大，说明现场土的干密度越接近室内击实试验的最大干密度，土越密实，地基的承载力通常越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压实度K是现场干密度与室内击实试验最大干密度之比，K越大，现场干密度越接近最大干密度，土更密实，地基承载力通常会更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444301", "t": 3, "q": "渗流过程中，总水头损失等于沿程水头损失与局部水头损失之和，沿程水头损失与渗流路径长度成正比，局部水头损失与局部区域的几何形状有关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在渗流中，总水头损失的确是沿程水头损失和局部水头损失之和，沿程水头损失和渗流路径长度正相关，局部水头损失受局部区域几何形状影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444302", "t": 3, "q": "材料力学中，圆轴扭转时，横截面上的切应力沿半径方向均匀分布，圆心处和边缘处的切应力大小相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "圆轴扭转时，横截面上切应力沿半径呈线性分布，圆心处切应力为零，边缘处切应力最大，并非均匀分布且圆心与边缘切应力大小不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444303", "t": 3, "q": "有效应力原理的核心是:土的总应力σ等于有效应力σ'减去孔隙水压力u，即σ=σ'-u。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "有效应力原理中，土的总应力σ等于有效应力σ'与孔隙水压力u之和，即σ = σ'+u ，题干表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444304", "t": 3, "q": "土的液限ωL是土从半固态转变为塑性状态的界限含水量，塑限ωP是土从塑性状态转变为流塑状态的界限含水量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土的液限ωL是土从塑性状态转变为流塑状态的界限含水量，塑限ωP是土从半固态转变为塑性状态的界限含水量，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444305", "t": 3, "q": "岩石在恒定应力作用下，变形随时间逐渐减小的现象称为蠕变，该现象在软岩中更为明显。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蠕变是岩石在恒定应力作用下，变形随时间逐渐增大，而非减小。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444306", "t": 3, "q": "梁在横力弯曲时，若横截面上的弯矩为零，则该截面上的剪力也一定为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梁横力弯曲时，剪力是弯矩的一阶导数，弯矩为零，其导数不一定为零，即剪力不一定为零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444307", "t": 3, "q": "温度升高时，水的黏度会减小，水流在土孔隙中的阻力降低，因此土的渗透系数k值会增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "温度升高，水黏度减小，水流在土孔隙中阻力降低，水更易流动，土的渗透系数k值会增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444308", "t": 3, "q": "岩石的软化系数KR>0.75时，表明岩石在水的作用下强度降低较少，具有较强的抗水软化能力，属于耐水岩石。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软化系数是衡量岩石耐水性的指标，当软化系数KR>0.75，意味着岩石受水影响强度降低少，抗水软化能力强，可判定为耐水岩石。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444309", "t": 3, "q": "两个力偶只要力偶矩的大小相等、转向相同，无论它们的作用面是否平行，都属于等效力偶，可相互替代。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "等效力偶要求力偶矩大小相等、转向相同且作用面相互平行。题中未提及作用面平行，说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444310", "t": 3, "q": "土的压缩模量Es值越大，说明土在侧限压缩条件下，单位压力增量引起的压缩应变越小，土的压缩性越低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压缩模量Es反映土在侧限条件下抵抗压缩变形的能力，Es越大，抵抗变形能力越强，单位压力增量引起的压缩应变就越小，土的压缩性也就越低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444311", "t": 3, "q": "流土发生的临界水力梯度icr通常大于管涌发生的临界水力梯度，因为流土需要克服土的整体重力，而管涌仅需克服细颗粒的黏结力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流土是土体整体浮动，要克服整体重力；管涌是细颗粒在孔隙中移动，只需克服细颗粒黏结力，所以流土临界水力梯度更大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444312", "t": 3, "q": "第三强度理论（最大剪应力理论）认为材料破坏的主要原因是最大切应力达到材料的极限切应力，该理论更适用于塑性材料（如钢材）的强度计算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "第三强度理论就是基于最大切应力是引起材料屈服的主要因素这一观点，塑性材料破坏常与切应力有关，所以该理论适用于塑性材料强度计算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444313", "t": 3, "q": "土的粒度成分分析中，筛分法适用于测定粒径大于0.075mm的土颗粒含量，比重计法适用于测定粒径小于0.075mm的土颗粒含量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在土的粒度成分分析里，筛分法确实用于测粒径大于0.075mm的土颗粒含量，比重计法用于测粒径小于0.075mm的土颗粒含量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444314", "t": 3, "q": "岩石的风化程度越严重，其矿物成分越稳定，裂隙越发育，单轴抗压强度越高，力学性能越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "岩石风化越严重，矿物成分稳定性变差，因受风化作用易分解；裂隙会更发育；但单轴抗压强度会降低，力学性能也变差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444315", "t": 3, "q": "平面一般力系若满足\"各力在x轴和y轴上的投影代数和均为零\"这两个条件，则该力系一定处于平衡状态，不会使物体发生转动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "平面一般力系平衡需满足三个条件，即各力在x轴投影代数和为零、各力在y轴投影代数和为零以及各力对任意点的力矩代数和为零，仅前两个条件不能保证力系平衡，物体可能会转动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444316", "t": 3, "q": "土的孔隙率n是指土中孔隙体积与土粒体积的比值，通常用百分比表示，其值越大，土越疏松。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土的孔隙率是土中孔隙体积与土总体积之比，并非与土粒体积的比值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444317", "t": 3, "q": "在均匀渗流场中，任意两点的总水头相等，渗流过程中不存在水头损失，因为渗流速度大小和方向处处相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "均匀渗流场虽渗流速度大小和方向处处相同，但只要有渗流就会克服阻力，必然存在水头损失，并非任意两点总水头相等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444318", "t": 3, "q": "轴向拉压杆中，轴力的正负号仅表示力的方向（拉力为正、压力为负），与杆件的伸长或缩短变形无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "轴力正负规定拉力为正、压力为负，轴力为正杆伸长，轴力为负杆缩短，轴力正负和杆件变形相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444319", "t": 3, "q": "饱和松散砂土在地震等动荷载作用下发生液化时，土的孔隙水压力急剧升高，有效应力趋近于零，导致其抗剪强度急剧降低至接近零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "饱和松散砂土在动荷载作用下，土颗粒结构会被破坏，孔隙水来不及排出，孔隙水压力急剧升高，有效应力等于总应力减去孔隙水压力，所以有效应力趋近于零。土的抗剪强度与有效应力相关，有效应力趋近零，抗剪强度也急剧降低至接近零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444320", "t": 3, "q": "岩石的泊松比μ值通常在0.1~0.4之间，μ值越大，说明岩石在受轴向压力时，横向膨胀变形越显著，轴向压缩变形越不明显。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "泊松比反映岩石横向应变与轴向应变的关系，μ值越大，横向应变相对轴向应变越大，即横向膨胀变形越显著、轴向压缩变形越不明显，且岩石泊松比通常在0.1 - 0.4之间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444321", "t": 3, "q": "力在某一坐标轴上的投影绝对值，等于力的大小与力和该坐标轴夹角正弦值的乘积。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "力在某一坐标轴上的投影绝对值，等于力的大小与力和该坐标轴夹角余弦值的乘积，而不是正弦值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444322", "t": 3, "q": "在相同击实功作用下，当土的含水量高于最佳含水量ωop时，随着含水量继续增加，土的干密度会逐渐增大，因为水的润滑作用使土颗粒更易密实。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在相同击实功下，当土的含水量高于最佳含水量ωop时，继续增加含水量，过多的水占据了土颗粒间的孔隙，会使土的干密度逐渐减小，并非逐渐增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444323", "t": 3, "q": "岩石的三轴抗压强度随围压σ3的增大而增大，因为围压能抑制岩石内部原有裂隙的扩展和新裂隙的产生，使岩石更难破坏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "围压增加时，会限制岩石内部裂隙的发展，增强岩石抵抗破坏的能力，所以岩石的三轴抗压强度随围压增大而增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444324", "t": 3, "q": "梁的弯矩图在集中力作用点处会发生突变，突变值的大小等于该集中力的大小，方向与集中力的方向一致。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梁的弯矩图在集中力作用点处会发生转折，而剪力图在集中力作用点处会突变，突变值大小等于集中力大小。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444325", "t": 3, "q": "当地基土为饱和黏性土时，地下水位上升会使土的孔隙水压力增大，有效应力减小，从而导致地基沉降量减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444326", "t": 3, "q": "渗流的接触冲刷破坏主要发生在两种透水性差异较大的土（如砂土与黏土）的接触面处，因接触面处渗流速度突变，导致细颗粒被冲刷带走。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该描述符合渗流接触冲刷破坏的原理，当两种透水性差异大的土接触，渗流速度在接触面突变，易使细颗粒被带走。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637071506444327", "t": 3, "q": "构件的刚度是指其抵抗变形的能力，刚度越大，相同荷载下变形越小;刚度仅与构件的截面几何尺寸有关，与材料的强度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "刚度不仅与构件的截面几何尺寸有关，还和材料的弹性模量有关，而弹性模量体现了材料抵抗弹性变形的能力，与材料强度相关，所以题干说刚度仅与构件的截面几何尺寸有关，与材料的强度无关是错误的。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第1章 力学基础||第4节 水力学基本理论（1）", "n": "第1章 力学基础 / 第4节 水力学基本理论（1）", "qs": [{"id": "2035637075004493824", "t": 1, "q": "下列关于流体黏性的说法中，正确的是（　）", "a": ["液体的黏性随温度升高而增大，气体的黏性随温度升高而减小", "液体的黏性随温度升高而减小，气体的黏性随温度升高而增大", "液体和气体的黏性都随温度升高而增大", "液体和气体的黏性都随温度升高而减小", "", ""], "r": "B", "e": "液体黏性主要由分子间引力决定，温度升高分子间距增大引力减小，黏性减小；气体黏性主要由分子热运动引起，温度升高热运动加剧，黏性增大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493825", "t": 1, "q": "在静水压力计算中，某斜置平面壁与水平面夹角为θ，壁面形心处的淹没深度为h_c，该平面壁所受静水总压力的作用点（压力中心）淹没深度h_d与h_c的关系是（　）", "a": ["h_d=h_c", "h_d>h_c", "h_d<h_c", "无法确定，取决于平面壁的形状", "", ""], "r": "B", "e": "对于斜置平面壁，压力中心位置总是在形心之下，即压力中心淹没深度h_d大于形心处淹没深度h_c。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493826", "t": 1, "q": "根据达西定律，渗流流速v与水力坡度J的关系为v=kJ，其中k为渗透系数。下列关于达西定律适用条件的说法，正确的是（　）", "a": ["适用于所有渗流，无论雷诺数大小", "仅适用于雷诺数Re≤1的层流渗流", "适用于雷诺数Re≤10的过渡流渗流", "仅适用于紊流渗流", "", ""], "r": "B", "e": "达西定律适用于层流渗流，一般认为雷诺数Re≤1时为层流。A选项所有渗流说法错误；C选项过渡流不适用；D选项紊流也不适用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493827", "t": 1, "q": "某明渠均匀流，已知渠道底坡i=0.001，粗糙系数n=0.014，过水断面为矩形，底宽b=5m，水深h=2m。若仅增大渠道粗糙系数n，其他条件不变，则明渠均匀流的流量Q将（　）", "a": ["增大", "减小", "不变", "先增大后减小", "", ""], "r": "B", "e": "根据谢才公式和曼宁公式，流量与粗糙系数成反比。增大粗糙系数n，其他条件不变时，流量Q会减小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493828", "t": 1, "q": "下列关于水流流态判别（雷诺数Re）的说法，错误的是（　）", "a": ["圆管中，Re≤2000为层流，Re>2000为紊流", "明渠中，Re≤500为层流，Re>500为紊流", "雷诺数是表征惯性力与黏性力之比的无量纲数", "同一流体、同一流动边界，雷诺数越小，流动越容易呈现紊流状态", "", ""], "r": "D", "e": "雷诺数越小，黏性力越能抑制流体的紊乱运动，流动越易呈层流状态，而非紊流状态，D说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493829", "t": 1, "q": "在静水力学中，绝对压强p_abs、相对压强p_rel和真空度p_vac的关系，下列表述正确的是（　）", "a": ["当p_abs>大气压p_a时，p_rel=p_abs-p_a，p_vac=0", "当p_abs>大气压p_a时，p_rel=0，p_vac=p_abs-p_a", "当p_abs<大气压p_a时，p_rel=p_a-p_abs，p_vac=0", "当p_abs<大气压p_a时，p_rel=0，p_vac=p_abs-p_a", "", ""], "r": "A", "e": "相对压强是绝对压强与大气压之差，当绝对压强大于大气压，相对压强为正，无真空度；当绝对压强小于大气压，相对压强为负，真空度是大气压与绝对压强之差。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493830", "t": 1, "q": "下列关于明渠水流中急流和缓流的判别方法，错误的是（　）", "a": ["弗劳德数Fr>1为急流，Fr<1为缓流", "临界水深h_k，实际水深h>h_k为急流，h<h_k为缓流", "临界底坡i_k，实际底坡i>i_k为急流，i<i_k为缓流", "水流中干扰波能否向上游传播:不能传播为急流，能传播为缓流", "", ""], "r": "B", "e": "实际水深h＞h_k 时为缓流，h＜h_k 时为急流，B选项说法错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493831", "t": 1, "q": "在流体力学中，\"理想流体\"的定义是指（　）", "a": ["密度为常数的流体", "黏度为零的流体", "不可压缩的流体", "符合牛顿内摩擦定律的流体", "", ""], "r": "B", "e": "理想流体是一种理想化模型，其主要特点是黏度为零。选项A密度为常数不是理想流体核心定义；选项C不可压缩不是理想流体的本质特征；选项D符合牛顿内摩擦定律与理想流体概念无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493832", "t": 1, "q": "根据动量方程，流体在流动过程中，动量的变化率等于作用在流体上的（　）", "a": ["所有力的矢量和", "所有法向力的代数和", "所有切向力的代数和", "压力的合力", "", ""], "r": "A", "e": "动量方程表明流体动量变化率等于作用在流体上所有力的矢量和。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493833", "t": 1, "q": "下列关于有压管流中水击现象的说法，错误的是（　）", "a": ["水击是由于管道中水流速度突然变化，导致压强急剧波动的现象", "直接水击是指阀门关闭时间T_s≤2L/c（L为管长，c为水击波速）的水击", "水击波速c与管道材料弹性模量、流体密度、管道直径无关", "减小水击压强的措施包括延长阀门关闭时间、设置调压塔等", "", ""], "r": "C", "e": "水击波速c与管道材料弹性模量、流体密度、管道直径等有关，C选项说法错误。A选项是水击定义，B选项是直接水击定义，D选项是减小水击压强措施，均正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493834", "t": 1, "q": "在渗流力学中，裘皮衣假定的核心内容是（　）", "a": ["渗流区域内各点的水力坡度都相等", "渗流的水头损失仅发生在渗流途径的某一特定段", "渗流速度沿渗流方向均匀分布", "将无压渗流的复杂边界条件简化为虚拟的\"浸润面\"", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493835", "t": 1, "q": "下列关于流体静压强特性的说法，正确的是（　）", "a": ["流体静压强的方向与受压面平行", "静止流体中，任意一点各方向的静压强大小相等", "静止流体中，不同深度的点静压强大小相等", "流体静压强的大小与流体的种类无关", "", ""], "r": "B", "e": "流体静压强方向与受压面垂直，A错误；静止流体中，任意点各方向静压强大小相等，B正确；不同深度点压强因深度不同而不同，C错误；流体种类不同密度不同，静压强与流体密度有关，D错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493836", "t": 1, "q": "明渠均匀流的形成条件不包括（　）", "a": ["渠道底坡为常数，且与流向一致", "渠道断面形状、尺寸沿程不变", "渠道粗糙系数沿程不变", "水流为非恒定流", "", ""], "r": "D", "e": "明渠均匀流需恒定流，D选项水流为非恒定流不符合其形成条件。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493837", "t": 1, "q": "根据牛顿内摩擦定律，流体层间的切应力τ与（　）成正比", "a": ["流体的密度ρ", "流体的运动黏度ν", "流体的速度v", "流体的速度梯度du/dy", "", ""], "r": "D", "e": "牛顿内摩擦定律表达式为τ = μ(du/dy) ，其中μ是动力黏度，du/dy是速度梯度，所以切应力τ与速度梯度成正比。答案选D。 ", "ap": [false, false, false, false, false
