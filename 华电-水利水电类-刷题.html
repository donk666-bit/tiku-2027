<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>华电-水利水电类</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <button class="btn" id="back" style="display:none">‹ 返回</button>
  <h1 id="hTitle">珞研刷题</h1>
  <button class="star" id="star" style="display:none">★</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const DATA = {"id": "yw2033827123348770816", "name": "华电-水利水电类", "chapters": [{"k": "第1章 力学基础||第1节 应力应变", "n": "第1章 力学基础 / 第1节 应力应变", "qs": [{"id": "2035637024702205952", "t": 1, "q": "在平面应力状态下，某点的两个主应力分别为σ1=120MPa，σ2=-80MPa，σ3=0，根据第三强度理论（最大切应力理论），该点的相当应力σr3应为多少？", "a": ["40MPa", "120MPa", "200MPa", "80MPa", "", ""], "r": "C", "e": "第三强度理论相当应力公式为σr3 = σ1 - σ3（当σ1≥σ2≥σ3 ），本题中σ1 = 120MPa，σ3 = - 80MPa，代入公式得σr3=120 - (-80)=200MPa。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205953", "t": 1, "q": "梁在受弯变形时，某截面上的弯矩M=12kN·m，该截面为矩形，尺寸b=200mm，h=300mm，剪力 V=60kN，此截面中性轴处的弯曲切应力为多少？", "a": ["0MPa", "1.0MPa", "1.5MPa", "2.0MPa", "", ""], "r": "C", "e": "矩形截面梁弯曲切应力最大值出现在中性轴处，计算公式 τmax=3V/(2A)。已知 V=60kN=60×10³N，b=200mm，h=300mm。截面面积 A=b×h=200×300=60000mm²。代入计算：τmax=(3×60×10³)/(2×60000)=1.5MPa。弯矩用于计算正应力，中性轴位置正应力为 0，不影响切应力计算。因此选 C。", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205954", "t": 1, "q": "对于线性弹性材料，在单向拉伸应力状态下，若已知材料的弹性模量E和泊松比μ，当轴向正应力为σ时，横向正应变ε'应为多少？", "a": ["-σ/(Eμ)", "-μσ/E", "σ/(Eμ)", "μσ/E", "", ""], "r": "B", "e": "根据胡克定律，单向拉伸时轴向正应变ε = σ/E ，泊松比μ定义为横向正应变ε'与轴向正应变ε绝对值之比且横向应变与轴向应变符号相反，即μ = -ε'/ε ，将ε = σ/E代入可得ε' = -μσ/E。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205955", "t": 1, "q": "某超静定梁，由于支座沉降产生内力，该内力的大小主要取决于以下哪个因素？", "a": ["梁的跨度大小", "支座沉降量的大小", "梁的刚度（EI）分布", "梁所受荷载的大小", "", ""], "r": "C", "e": "超静定结构因支座沉降产生内力，内力大小主要与结构刚度分布有关。梁的刚度（EI）分布不同，抵抗变形能力不同，产生的内力也不同。而梁跨度、支座沉降量和梁所受荷载并非主要决定因素。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205956", "t": 1, "q": "在弯扭组合变形的圆轴强度计算中，若采用第四强度理论（形状改变比能理论），其相当应力σr4的表达式应为（其中σ为弯曲正应力，τ为扭转切应力）？", "a": ["√(σ²+τ²)", "√(σ²+2τ²)", "√(σ²+3τ²)", "σ+√3τ", "", ""], "r": "C", "e": "第四强度理论相当应力公式是σr4 = √(σ² + 3τ²) 。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205957", "t": 1, "q": "平面应力状态下，某点的应力分量为σx=80MPa，σy=40MPa，τxy=30MPa，该点的最大切应力τmax应为多少？", "a": ["32MPa", "34MPa", "36MPa", "40MPa", "", ""], "r": "C", "e": "根据平面应力状态下最大切应力的计算公式：τmax = √[((σx - σy)/2)² + τxy²]<br />代入数据：σx = 80MPa，σy = 40MPa，τxy = 30MPa<br />(σx - σy)/2 = (80 - 40)/2 = 20MPa<br />τmax = √(20² + 30²) = √(400 + 900) = √1300 ≈ 36.06MPa", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205958", "t": 1, "q": "下列关于材料强度指标的说法中，正确的是哪一项？", "a": ["屈服强度是脆性材料唯一的强度指标", "抗拉强度是材料在断裂前所能承受的最大应力，适用于所有材料的强度设计", "对于塑性材料，在静载作用下，一般以屈服强度作为强度设计的依据", "弹性极限是材料发生塑性变形前的最大应力，其数值与屈服强度完全相等", "", ""], "r": "C", "e": "脆性材料无明显屈服现象，强度指标有抗拉、抗压等，A错；抗拉强度并非适用于所有材料强度设计，如脆性材料抗压强度更重要，B错；弹性极限和屈服强度数值一般不相等，D错；塑性材料静载下通常以屈服强度作为强度设计依据，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205959", "t": 1, "q": "某等截面直杆，在轴向拉力作用下，杆长由原长L变为L+ΔL，若已知杆的横截面面积A，弹性模量E，此时杆内的轴力N应为多少？", "a": ["EAΔL/L", "EA L/ΔL", "AΔL/(E<br />D.", "L/(E AΔL)", "", ""], "r": "A", "e": "根据胡克定律「test/yiwen_img/importSubject/2035637011313987584.png」，其中「test/yiwen_img/importSubject/2035637011431428096.png」（应力），「test/yiwen_img/importSubject/2035637011515314176.png」（应变），将「test/yiwen_img/importSubject/2035637011599200256.png」和「test/yiwen_img/importSubject/2035637011666309120.png」代入胡克定律可得「test/yiwen_img/importSubject/2035637011771166720.png」，整理得出「test/yiwen_img/importSubject/2035637011850858496.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205960", "t": 1, "q": "在梁的内力分析中，对于承受均布荷载的简支梁，下列关于剪力图和弯矩图的描述，正确的是哪一项？", "a": ["剪力图为斜直线，弯矩图为抛物线，且弯矩图在剪力为零处有极值", "剪力图为水平线，弯矩图为斜直线，且弯矩图在跨中处有最大值", "剪力图为抛物线，弯矩图为斜直线，且剪力图在跨中处为零", "剪力图为斜直线，弯矩图为水平线，且剪力图在两端支座处为零", "", ""], "r": "A", "e": "承受均布荷载的简支梁，其剪力图是斜直线，弯矩图是抛物线，并且弯矩图极值出现在剪力为零处。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205961", "t": 1, "q": "对于平面应力状态下的应力圆，下列说法错误的是哪一项？", "a": ["应力圆上的每一个点对应着构件上该点的一个截面", "应力圆的圆心坐标为((σx+σy)/2,0)", "应力圆的半径为√[((σx-σy)/2)²+τxy²]", "应力圆与σ轴的两个交点对应的截面上，切应力不为零", "", ""], "r": "D", "e": "应力圆与σ轴交点对应主平面，主平面上切应力为零，D说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205962", "t": 1, "q": "某静定刚架，在水平荷载作用下，下列关于其内力计算的说法，正确的是哪一项？", "a": ["刚架的内力计算只需考虑平衡条件，无需考虑变形协调条件", "刚架的弯矩图在刚节点处必须满足顺时针弯矩等于逆时针弯矩", "刚架的剪力图和轴力图在杆件任意截面处均连续，无突变", "刚架的内力只与荷载大小有关，与刚架的几何尺寸无关", "", ""], "r": "A", "e": "静定结构内力计算只需平衡条件，无需变形协调条件；刚节点处弯矩平衡是代数和为零非顺逆相等；集中力处剪力图会突变；内力与荷载和几何尺寸都有关。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205963", "t": 1, "q": "根据圣维南原理，在距离载荷作用点足够远的地方，构件的应力分布主要取决于以下哪个因素？", "a": ["载荷的具体分布形式", "构件的截面形状", "载荷的合力和合力矩", "构件的材料性能", "", ""], "r": "C", "e": "圣维南原理指出，力作用于杆端方式的不同，只会使与杆端距离不大于杆的横向尺寸的范围内受到影响。在距离载荷作用点足够远的地方，应力分布主要取决于载荷的合力和合力矩。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205964", "t": 1, "q": "在组合变形（拉弯组合）的强度计算中，若构件横截面为对称截面，轴向拉力为N，弯矩为M，截面面积为A，抗弯截面系数为Wz，则该截面的最大正应力σmax应为多少？", "a": ["N/A+M/Wz", "|N/A-M/Wz|", "N/A+2M/Wz", "√[(N/A)²+(M/Wz)²]", "", ""], "r": "A", "e": "拉弯组合变形时，轴向拉力产生均匀正应力σN = N/A，弯矩产生的正应力在边缘最大，为σM = M/Wz，二者叠加，最大正应力是二者之和即σmax=N/A + M/Wz，所以答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205965", "t": 1, "q": "下列关于梁的挠曲线近似微分方程的说法，错误的是哪一项？", "a": ["挠曲线近似微分方程的建立基于小变形假设和平面假设", "方程的形式为EIw''=-M(x)，其中w为挠度，M(x)为弯矩", "该方程适用于所有材料的梁，只要满足小变形条件", "通过积分该方程可求得梁的挠度和转角", "", ""], "r": "C", "e": "挠曲线近似微分方程是基于线弹性范围内、小变形假设和平面假设建立的，并非适用于所有材料，只适用于线弹性材料的梁。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205966", "t": 1, "q": "平面应力状态下，若某点的两个主应力σ1和σ2均为拉应力，且σ1>σ2>0，当该点发生破坏时，根据第二强度理论（最大伸长线应变理论），其破坏条件应为（其中[σ]为材料的许用拉应力）？", "a": ["σ1≥[σ]", "σ2≥[σ]", "σ1-μσ2≥[σ]", "σ2-μσ1≥[σ]", "", ""], "r": "C", "e": "第二强度理论表达式为σ1 - μ(σ2 + σ3) ≤ [σ] ，本题是平面应力状态，σ3 = 0，所以破坏条件为σ1 - μσ2 ≥ [σ] 。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205967", "t": 1, "q": "某圆轴同时承受扭矩T和轴向拉力N，若已知轴的直径d，材料的许用应力[σ]，采用第三强度理论设计该轴时，其强度条件应为？", "a": ["√[(4N/(πd²))²+3*(16T/(πd³))²]≤[σ]", "(4N/(πd²))+(16T/(πd³))≤[σ]", "√[(4N/(πd²))²+(16T/(πd³))²]≤[σ]", "3*(4N/(πd²))+(16T/(πd³))≤[σ]", "", ""], "r": "A", "e": "本题可根据圆轴在扭矩和轴向拉力共同作用下的应力情况，结合第三强度理论来确定强度条件。### 步骤一：分析圆轴在扭矩和轴向拉力作用下的应力 轴向拉应力：圆轴受轴向拉力N时，横截面上的轴向拉应力「test/yiwen_img/importSubject/2035637011934744576.png」为「test/yiwen_img/importSubject/2035637012006047744.png」，其中「test/yiwen_img/importSubject/2035637012089933824.png」，所以「test/yiwen_img/importSubject/2035637012186402816.png」。 扭转切应力：圆轴受扭矩T时，横截面上的扭转切应力「test/yiwen_img/importSubject/2035637012303843328.png」为「test/yiwen_img/importSubject/2035637012375146496.png」，其中「test/yiwen_img/importSubject/2035637012467421184.png」，所以「test/yiwen_img/importSubject/2035637012572278784.png」。### 步骤二：根据第三强度理论确定强度条件第三强度理论的表达式为「test/yiwen_img/importSubject/2035637012664553472.png」，将「test/yiwen_img/importSubject/2035637012790382592.png」，「test/yiwen_img/importSubject/2035637012572278784.png」代入可得：「test/yiwen_img/importSubject/2035637012983320576.png」综上，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205968", "t": 1, "q": "在梁的设计中，若要提高梁的抗弯强度，下列措施中最有效的是哪一项（在相同材料用量下）？", "a": ["增大梁的横截面高度，减小宽度", "增大梁的横截面宽度，减小高度", "在梁的受拉区和受压区同时增加材料", "将梁的横截面改为实心圆形", "", ""], "r": "A", "e": "梁的抗弯强度与截面抵抗矩有关，在相同材料用量下，增大梁的横截面高度能大幅提高截面抵抗矩从而提高抗弯强度，而减小宽度影响相对小。B选项增大宽度减小高度对抗弯强度提升有限；C选项在受拉和受压区同时增加材料不如增大高度有效；D选项实心圆形截面在抗弯方面不如增大高度的矩形截面。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205969", "t": 1, "q": "对于线性弹性体的变形，下列关于叠加原理适用条件的说法，正确的是哪一项？", "a": ["叠加原理仅适用于构件的内力计算，不适用于变形计算", "只要材料满足胡克定律，叠加原理就一定适用", "叠加原理适用于多个荷载共同作用下的内力和变形计算，前提是荷载与内力、变形之间为线性关系", "叠加原理适用于所有荷载作用形式，无论荷载大小", "", ""], "r": "C", "e": "叠加原理用于多个荷载共同作用下的内力和变形计算，需荷载与内力、变形是线性关系。A选项叠加原理也适用于变形计算；B仅材料满足胡克定律不够，还需荷载与内力、变形线性；D不是适用于所有荷载形式和大小。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205970", "t": 1, "q": "某点处于空间应力状态，三个主应力分别为σ1=150MPa，σ2=100MPa，σ3=50MPa，该点的体积改变比能v_v应为多少（已知材料弹性模量E，泊松比μ）？", "a": ["(1-2μ)/(6E)(150+100+50)²", "(1-2μ)/(6E)(150²+100²+50²)", "(1-2μ)/(3E)(150+100+50)", "(1-2μ)/(6E)(150+100+50)", "", ""], "r": "A", "e": "体积改变比能公式为「test/yiwen_img/importSubject/2035637013104955392.png」，将「test/yiwen_img/importSubject/2035637013197230080.png」，「test/yiwen_img/importSubject/2035637013306281984.png」，「test/yiwen_img/importSubject/2035637013385973760.png」代入可得「test/yiwen_img/importSubject/2035637013478248448.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205971", "t": 1, "q": "梁的纯弯曲试验中，测得梁的曲率半径为ρ，若梁的抗弯刚度为EI，此时梁横截面上的弯矩M应为多少？", "a": ["M=EI/ρ", "M=ρ/EI", "M=EIρ", "M=E/（Iρ）", "", ""], "r": "A", "e": "梁纯弯曲时，弯矩与曲率半径、抗弯刚度的关系为M = EI / ρ。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205972", "t": 1, "q": "下列关于应力和应变的说法，正确的是哪一项？", "a": ["应力是构件内部单位面积上的内力，与构件的材料无关;应变是构件的变形程度，与材料有关", "应力和应变都是描述构件受力状态的物理量，均与构件的材料和几何尺寸无关", "对于相同的应力，不同材料的应变不同（因弹性模量不同）;对于相同的应变，不同材料的应力不同", "应力越大，应变一定越大，二者呈正比关系", "", ""], "r": "C", "e": "应力是单位面积内力，与材料和几何尺寸无关；应变与材料弹性模量有关，不同材料弹性模量不同，相同应力下应变不同，相同应变下应力也不同。应力和应变并非简单的正比关系，还受材料力学性能影响。A应变也与几何尺寸等有关；B应变与材料有关；D应力和应变不一定正比。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205973", "t": 1, "q": "某超静定结构，由于温度变化产生内力，该内力的大小与下列哪个因素无关？", "a": ["结构的刚度分布", "温度变化的幅度", "材料的线膨胀系数", "结构的初始几何尺寸", "", ""], "r": "D", "e": "超静定结构因温度变化产生的内力与结构刚度分布、温度变化幅度、材料线膨胀系数有关。结构初始几何尺寸不影响温度内力大小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205974", "t": 1, "q": "在扭转强度计算中，圆轴的抗扭截面系数Wp与下列哪个几何参数的关系最为密切？", "a": ["横截面面积", "横截面的惯性矩", "横截面的极惯性矩", "横截面的形心位置", "", ""], "r": "C", "e": "圆轴抗扭截面系数「test/yiwen_img/importSubject/2035637013566328832.png」与极惯性矩「test/yiwen_img/importSubject/2035637013637632000.png」关系紧密，「test/yiwen_img/importSubject/2035637013708935168.png」 。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205975", "t": 1, "q": "平面应力状态下，若某点的应力分量满足σx=σy，τxy=0，则该点的应力状态属于哪种类型？", "a": ["单向应力状态", "双向等拉（压）应力状态", "纯剪切应力状态", "复杂应力状态", "", ""], "r": "B", "e": "已知σx = σy且τxy = 0，说明该点在两个相互垂直方向上应力相等且无切应力，符合双向等拉（压）应力状态特点。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205976", "t": 1, "q": "某简支梁，跨度为L，承受集中力F作用在跨中，若将梁的跨度增大为2L，其他条件不变，则梁的最大弯矩将变为原来的多少倍？", "a": ["2倍", "4倍", "1/2倍", "1/4倍", "", ""], "r": "A", "e": "简支梁跨中受集中力时，最大弯矩M = FL/4。跨度增大为2L后，新的最大弯矩「test/yiwen_img/importSubject/2035637013805404160.png」，即变为原来的2倍。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205977", "t": 1, "q": "对于水利水电工程中的钢筋混凝土拉杆，在轴心受拉状态下，若拉杆横截面面积A=5000mm²，承受拉力N=120kN，钢筋与混凝土之间的粘结力足够，混凝土的轴心抗拉强度设计值f t=1.43MPa，钢筋的抗拉强度设计值f y=360MPa，忽略混凝土的抗拉作用（按规范要求），则所需钢筋总面积至少为多少mm²？", "a": ["325", "333", "340", "350", "", ""], "r": "B", "e": "按规范忽略混凝土抗拉作用，拉力全由钢筋承担，根据公式「test/yiwen_img/importSubject/2035637013889290240.png」（N为拉力，「test/yiwen_img/importSubject/2035637013985759232.png」为钢筋抗拉强度设计值，「test/yiwen_img/importSubject/2035637014065451008.png」为钢筋总面积），可得「test/yiwen_img/importSubject/2035637014157725696.png」，将「test/yiwen_img/importSubject/2035637014245806080.png」，「test/yiwen_img/importSubject/2035637014346469376.png」代入计算。「test/yiwen_img/importSubject/2035637014426161152.png」答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205978", "t": 1, "q": "在梁的剪力图和弯矩图分析中，某悬臂梁（固定端在左端）在自由端受集中力F作用，梁长L，若在梁的中点处有一个沿梁轴方向的集中力P（向右），则下列关于梁的内力变化说法正确的是？", "a": ["剪力图在中点处发生突变，突变值等于P;弯矩图在中点处斜率发生突变", "剪力图在中点处无变化;弯矩图在中点处发生突变，突变值等于P×L/2", "剪力图在中点处无变化;弯矩图在中点处无突变，但曲率发生变化", "剪力图在中点处发生突变，突变值等于F;弯矩图在中点处斜率无变化", "", ""], "r": "C", "e": "沿梁轴方向的集中力P不影响梁的剪力和弯矩，剪力图和弯矩图不受其影响，在中点处剪力图无变化，弯矩图无突变，只是梁轴力改变会使梁的曲率变化。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205979", "t": 1, "q": "已知某水利挡水结构的某点处于三向应力状态，三个主应力分别为σ₁=180MPa，σ₂=100MPa，σ₃=60MPa，材料的许用拉应力[σt]=160MPa，许用压应力[σc]=240MPa，采用第一强度理论（最大拉应力理论）校核该点强度，结果为？", "a": ["强度足够，最大拉应力小于许用拉应力", "强度不足，最大拉应力大于许用拉应力", "需结合压应力校核，目前无法判断", "强度刚好满足，最大拉应力等于许用拉应力", "", ""], "r": "B", "e": "第一强度理论认为，材料发生断裂的主要因素是最大拉应力。本题中最大拉应力σ₁ = 180MPa，许用拉应力[σt]=160MPa，180MPa＞160MPa，即最大拉应力大于许用拉应力，强度不足。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205980", "t": 1, "q": "在水利水电工程的岩石边坡稳定性分析中，常采用莫尔强度理论，已知某岩石的单轴抗压强度σc=60MPa，单轴抗拉强度σt=6MPa，若该岩石某点的应力状态为σ₁=25MPa，σ₃=-5MPa（拉应力为正），则按莫尔强度理论，该点是否破坏？", "a": ["破坏", "不破坏", "刚好达到破坏状态", "无法判断，需更多参数", "", ""], "r": "B", "e": "莫尔强度理论中，可根据岩石单轴抗压强度和单轴抗拉强度确定强度包络线范围，再对比该点应力状态（σ₁、σ₃）是否在包络线内判断是否破坏。本题中该点的σ₁、σ₃值对应的应力状态在强度包络线内，所以不破坏。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205981", "t": 1, "q": "已知某点的应力状态为σx=80MPa，σy=-40MPa，τxy=-60MPa，该点的最大切应力为多少MPa？", "a": ["80", "90", "100", "110", "", ""], "r": "B", "e": "本题可先根据平面应力状态下主应力的计算公式求出主应力，再根据最大切应力与主应力的关系求出最大切应力。### 步骤一：求主应力对于平面应力状态「test/yiwen_img/importSubject/2035637018951815168.png」、「test/yiwen_img/importSubject/2035637019018924032.png」、「test/yiwen_img/importSubject/2035637019090227200.png」，主应力计算公式为「test/yiwen_img/importSubject/2035637017706106880.png」。已知「test/yiwen_img/importSubject/2035637019157336064.png」，「test/yiwen_img/importSubject/2035637019241222144.png」，「test/yiwen_img/importSubject/2035637010508681216.png」，将其代入上述公式可得：「test/yiwen_img/importSubject/2035637010710007808.png」则「test/yiwen_img/importSubject/2035637010802282496.png」，「test/yiwen_img/importSubject/2035637010890362880.png」，由于是平面应力状态，「test/yiwen_img/importSubject/2035637010978443264.png」。### 步骤二：求最大切应力最大切应力计算公式为「test/yiwen_img/importSubject/2035637018192646144.png」（当「test/yiwen_img/importSubject/2035637018532384768.png」为最大主应力，「test/yiwen_img/importSubject/2035637018616270848.png」为最小主应力时）。由上述计算可知「test/yiwen_img/importSubject/2035637011045552128.png」，「test/yiwen_img/importSubject/2035637011129438208.png」，代入公式可得：「test/yiwen_img/importSubject/2035637011221712896.png」所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205982", "t": 1, "q": "在梁的斜截面受剪强度计算中，某T形截面梁（翼缘宽b'f=400mm，翼缘高h'f=100mm，腹板宽b=200mm，梁高h=600mm），承受剪力V=200kN，混凝土强度等级C30（f t=1.43MPa），若不配置箍筋，该梁斜截面受剪承载力是否满足要求（按水利规范，矩形、T形截面受剪承载力V u=0.7 f t b h0，h0=550mm）？", "a": ["满足，V u>V", "不满足，V u<V", "刚好满足，V u=V", "无法判断，需考虑翼缘作用", "", ""], "r": "B", "e": "先根据公式「test/yiwen_img/importSubject/2035637014505852928.png」计算梁斜截面受剪承载力「test/yiwen_img/importSubject/2035637014589739008.png」，「test/yiwen_img/importSubject/2035637014686208000.png」，b = 200mm，「test/yiwen_img/importSubject/2035637014770094080.png」，可得「test/yiwen_img/importSubject/2035637014849785856.png」，而V = 200kN，「test/yiwen_img/importSubject/2035637014933671936.png」，所以不满足要求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205983", "t": 1, "q": "某圆轴承受扭矩T=8kN·m，若轴的许用切应力[τ]=60MPa，采用实心轴和空心轴（内外径比α=d/D=0.8）两种形式，則实心轴直径d1和空心轴外径D2的最小值分别为多少mm？", "a": ["d1=85，D2=95", "d1=90，D2=100", "d1=95，D2=105", "d1=100，D2=110", "", ""], "r": "B", "e": "本题可根据圆轴扭转时的强度条件公式分别计算实心轴直径和空心轴外径。### 1. 计算实心轴直径「test/yiwen_img/importSubject/2035637015000780800.png」圆轴扭转时的强度条件为「test/yiwen_img/importSubject/2035637015093055488.png」，对于实心圆轴，抗扭截面系数「test/yiwen_img/importSubject/2035637012467421184.png」。将「test/yiwen_img/importSubject/2035637015172747264.png」代入强度条件可得「test/yiwen_img/importSubject/2035637015239856128.png」，即「test/yiwen_img/importSubject/2035637015336325120.png」。已知「test/yiwen_img/importSubject/2035637015420211200.png」，「test/yiwen_img/importSubject/2035637015558623232.png」，代入可得：「test/yiwen_img/importSubject/2035637015642509312.png」对679052开立方可得「test/yiwen_img/importSubject/2035637015726395392.png」。### 2. 计算空心轴外径「test/yiwen_img/importSubject/2035637015806087168.png」对于空心圆轴，抗扭截面系数「test/yiwen_img/importSubject/2035637015902556160.png」（「test/yiwen_img/importSubject/2035637015990636544.png」）。同样根据强度条件「test/yiwen_img/importSubject/2035637016070328320.png」，已知「test/yiwen_img/importSubject/2035637016196157440.png」，「test/yiwen_img/importSubject/2035637015420211200.png」，「test/yiwen_img/importSubject/2035637016271654912.png」，则有：「test/yiwen_img/importSubject/2035637016359735296.png」对1000000开立方可得「test/yiwen_img/importSubject/2035637016439427072.png」。结合以上计算结果，实心轴直径「test/yiwen_img/importSubject/2035637015000780800.png」最小值应大于87.9mm，空心轴外径「test/yiwen_img/importSubject/2035637015806087168.png」最小值为100mm，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205984", "t": 1, "q": "某水利工程中的悬臂式挡土墙，其立壁可视为悬臂梁，在水平土压力作用下，立壁根部截面（固定端）的弯矩M=120kN·m，剪力V=80kN，若立壁截面为矩形（b×h=500mm×800mm），材料的许用弯曲正应力[σ]=15MPa，许用切应力[τ]=1.2MPa，则该截面的强度校核结果为？", "a": ["弯曲正应力满足，切应力不满足", "弯曲正应力不满足，切应力满足", "两者均满足", "两者均不满足", "", ""], "r": "C", "e": "先算弯曲正应力，「test/yiwen_img/importSubject/2035637016535896064.png」，「test/yiwen_img/importSubject/2035637016653336576.png」，「test/yiwen_img/importSubject/2035637016737222656.png」；再算切应力，「test/yiwen_img/importSubject/2035637016816914432.png」，两者均满足。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205985", "t": 1, "q": "某点的应力状态为σ₁=150MPa，σ₂=100MPa，σ₃=50MPa，采用第四强度理论（形状改变比能理论），该点的相当应力σr4为多少MPa？", "a": ["86.6", "91.7", "96.8", "102.5", "", ""], "r": "A", "e": "第四强度理论相当应力公式为「test/yiwen_img/importSubject/2035637016976297984.png」，将「test/yiwen_img/importSubject/2035637017068572672.png」，「test/yiwen_img/importSubject/2035637017173430272.png」，「test/yiwen_img/importSubject/2035637017274093568.png」代入可得「test/yiwen_img/importSubject/2035637017353785344.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205986", "t": 1, "q": "在平面应力状态下，若某点的两个主应力分别为σ₁=200MPa，σ₃=-100MPa（σ₂=0），则该点与σ₂方向一致的斜截面上的正应力和切应力分别为多少MPa？", "a": ["50，150", "50，100", "100，150", "100，100", "", ""], "r": "A", "e": "与σ₂方向一致的斜截面即平行于σ₂的平面，正应力σ=(σ₁ + σ₃)/2，切应力τ=(σ₁ - σ₃)/2 。代入σ₁=200MPa，σ₃=-100MPa，可得σ = 50MPa，τ = 150MPa。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205987", "t": 1, "q": "在梁的弯曲理论中，平面假设的核心内容是？", "a": ["梁的横截面在弯曲后仍保持平面，且与梁的轴线垂直", "梁的横截面在弯曲后仍保持平面，且与梁的轴线平行", "梁的纵向纤维在弯曲后仅发生伸长或缩短，无剪切变形", "梁的纵向纤维在弯曲后既发生伸长或缩短，也发生剪切变形", "", ""], "r": "A", "e": "平面假设是梁弯曲理论基础，指梁变形前横截面为平面，变形后仍为平面且与轴线垂直。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205988", "t": 1, "q": "某点处于纯剪切应力状态（τ=50MPa），则该点的主应力和最大切应力分别为多少MPa？", "a": ["σ₁=50，σ₃=-50，τmax=50", "σ₁=50，σ₃=0，τmax=25", "σ₁=0，σ₃=-50，τmax=50", "σ₁=25，σ₃=-25，τmax=25", "", ""], "r": "A", "e": "纯剪切应力状态下，主应力σ₁ = τ，σ₃ = -τ ，最大切应力τmax = τ 。已知τ = 50MPa，所以σ₁ = 50MPa，σ₃ = -50MPa，τmax = 50MPa 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205989", "t": 1, "q": "在三向应力状态下，若材料的许用应力为[σ]，采用第三强度理论（最大切应力理论），则强度校核条件为？", "a": ["σ₁-σ₃≤[σ]", "σ₁≤[σ]，σ₃≥-[σ]", "√[(σ₁-σ₂)²+(σ₂-σ₃)²+(σ₃-σ₁)²]/√2≤[σ]", "σ₁+σ₂+σ₃≤[σ]", "", ""], "r": "A", "e": "第三强度理论（最大切应力理论）认为，引起材料屈服的主要因素是最大切应力，强度条件是最大切应力达到单向拉伸屈服时的最大切应力。其强度校核条件为σ₁ - σ₃ ≤ [σ]。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205990", "t": 1, "q": "已知某材料在单向拉伸时的弹性模量E=200GPa，泊松比ν=0.3，若该材料在单向压缩时的应力为σ=-80MPa，则其横向正应变ε'为多少？", "a": ["1.2×10⁻⁴", "-1.2×10⁻⁴", "2.4×10⁻⁴", "-2.4×10⁻⁴", "", ""], "r": "A", "e": "先根据胡克定律求纵向正应变，再由泊松比公式求横向正应变。纵向正应变ε = σ/E，代入σ = - 80MPa，E = 200GPa = 200×10³MPa，得ε=-4×10⁻⁴ 。泊松比ν=-ε'/ε，所以ε'=-ν×ε，将ν = 0.3，ε=-4×10⁻⁴代入，得ε' = 1.2×10⁻⁴。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006080", "t": 2, "q": "在水利水电工程的构件应力分析中，下列关于平面应力状态的说法正确的有哪些？", "a": ["平面应力状态下，有一个方向的正应力恒为零", "平面应力状态的应力圆一定与σ轴有两个交点", "平面应力状态下，任意斜截面上的正应力最大值等于最大主应力", "平面应力状态下，平面内的最大切应力等于两个主应力之差的一半", "平面应力状态的主应力一定有一个为零", ""], "r": "ABCD", "e": "A 选项，平面应力状态定义：单元体在 z 方向（垂直于平面方向）的正应力 σz=0，即有一个方向正应力恒为零，表述正确。B 选项，应力圆与 σ 轴交点对应平面内两个主应力，因此平面应力状态的应力圆一定与 σ 轴存在两个交点，表述正确。C 选项，主应力是所有斜截面中正应力的极值，所以任意斜截面上正应力最大值等于最大主应力，表述正确。D 选项，限定 “平面内”，平面内最大切应力等于平面内两个主应力之差的一半，表述正确。E 选项，平面应力状态只是 z 方向正应力为 0，但 0 不一定是主应力。举例：σx=80MPa，σy=40MPa，τxy=30MPa，属于平面应力状态，三个主应力约为 96.06MPa、23.94MPa、0MPa，此时 0 是第三个主应力；但如果主应力计算结果全部不为 0，0 就不是主应力。因此 “主应力一定有一个为零” 说法错误。<br />综上，正确选项 ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006081", "t": 2, "q": "在梁的弯曲强度计算中，影响梁弯曲正应力大小的因素有哪些？", "a": ["梁的横截面形状", "梁所承受的弯矩大小", "材料的弹性模量", "横截面到中性轴的距离", "梁的跨度", ""], "r": "ABD", "e": "梁弯曲正应力公式为「test/yiwen_img/importSubject/2035637017446060032.png」 ，其中M是弯矩，y是横截面到中性轴的距离，「test/yiwen_img/importSubject/2035637017546723328.png」与梁的横截面形状有关。所以影响梁弯曲正应力大小的因素有梁的横截面形状、梁所承受的弯矩大小、横截面到中性轴的距离。弹性模量影响变形，梁跨度主要影响弯矩分布。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006082", "t": 2, "q": "下列关于材料强度理论的说法中，正确的有哪些？", "a": ["第一强度理论（最大拉应力理论）适用于脆性材料的拉伸破坏", "第二强度理论（最大伸长线应变理论）适用于塑性材料的压缩破坏", "第三强度理论（最大切应力理论）适用于塑性材料的剪切破坏", "第四强度理论（形状改变比能理论）的相当应力值通常小于第三强度理论", "莫尔强度理论适用于岩石等非对称屈服材料", ""], "r": "ACDE", "e": "第一强度理论用于脆性材料拉伸破坏；第三强度用于塑性材料剪切等破坏；第四强度相当应力一般小于第三强度；莫尔理论用于非对称屈服材料。而第二强度理论在工程中应用较少，且不适用于塑性材料压缩破坏。答案：ACDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006083", "t": 2, "q": "在轴向拉压杆的受力分析中，下列哪些情况会导致杆件产生应力集中现象？", "a": ["杆件横截面尺寸突然变化", "杆件上存在螺栓孔", "杆件材料不均匀", "杆件承受的轴向拉力突然增大", "杆件表面存在划痕或裂纹", ""], "r": "ABE", "e": "应力集中是因杆件外形突然变化而引起局部应力急剧增大的现象。A选项横截面尺寸突然变化、B选项存在螺栓孔、E选项表面有划痕或裂纹都会使杆件外形突变。而C选项材料不均匀不是外形变化；D选项拉力突然增大与外形无关。答案选ABE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006084", "t": 2, "q": "关于圆轴扭转时的应力和变形，下列说法正确的有哪些？", "a": ["圆轴扭转时，横截面上各点的切应力与该点到圆心的距离成正比", "圆轴扭转时，最大切应力发生在横截面的圆周上", "圆轴的扭转角与扭矩成正比，与材料的剪切模量和极惯性矩成反比", "圆轴扭转时，横截面始终保持平面，且与轴线垂直", "圆轴扭转时，纵向纤维会发生伸长或缩短变形", ""], "r": "ABCD", "e": "圆轴扭转时，切应力分布规律是横截面上各点切应力与该点到圆心距离成正比，最大切应力在圆周上；扭转角公式表明其与扭矩成正比，与材料剪切模量和极惯性矩成反比；圆轴扭转时横截面保持平面且与轴线垂直；而纵向纤维只发生倾斜，不伸长或缩短。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006085", "t": 2, "q": "下列关于梁的斜截面受剪破坏形式的说法中，正确的有哪些？", "a": ["斜拉破坏是由于梁的箍筋配置过少导致的", "斜压破坏是由于梁的箍筋配置过多导致的", "剪压破坏是梁斜截面受剪的主要破坏形式，属于延性破坏", "斜拉破坏属于脆性破坏，破坏前无明显预兆", "斜压破坏的承载力主要由混凝土和箍筋共同承担", ""], "r": "ABD", "e": "斜拉破坏因箍筋过少（A），属脆性破坏（D）；斜压破坏因箍筋过多（B），承载力主要由混凝土承担（E错）；剪压破坏属脆性破坏非延性（C错）。选ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006086", "t": 2, "q": "在三向应力状态下，下列关于主应力和主平面的说法正确的有哪些？", "a": ["三向应力状态下一定存在三个互相垂直的主平面", "三个主应力的大小与所选取的坐标系无关", "主平面上的切应力一定为零", "最大主应力是所有斜截面上正应力的最大值", "最小主应力是所有斜截面上正应力的最小值", ""], "r": "ABCDE", "e": "根据主应力和主平面基本概念，三向应力状态存在三个互相垂直主平面；主应力大小是材料本身力学性质决定，与坐标系选取无关；主平面定义就是切应力为零的平面；最大主应力是所有斜截面上正应力最大值，最小主应力是最小值。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006087", "t": 2, "q": "下列关于压杆稳定的说法中，正确的有哪些？", "a": ["压杆的临界压力与压杆的长度成正比", "压杆的临界压力与压杆的截面惯性矩成正比", "压杆的长细比越大，临界应力越小", "欧拉公式适用于压杆的临界应力小于材料的比例极限的情况", "两端固定的压杆比两端铰支的压杆临界压力大", ""], "r": "BCDE", "e": "A项临界压力与长度平方成反比；B项临界压力与截面惯性矩成正比；C项长细比越大，临界应力越小；D项欧拉公式适用临界应力小于材料比例极限；E项两端固定比两端铰支临界压力大。答案：BCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006088", "t": 2, "q": "在水利水电工程的钢筋混凝土构件中，下列关于内力和应力关系的说法正确的有哪些？", "a": ["轴力由钢筋和混凝土共同承担（轴心受压）", "弯矩主要由钢筋承担拉力，混凝土承担压力（适筋梁）", "剪力主要由箍筋和混凝土共同承担", "扭矩由钢筋和混凝土形成的抗扭骨架共同承担", "轴心拉力由钢筋和混凝土共同承担", ""], "r": "ABCD", "e": "轴心受压时轴力由钢筋和混凝土共同承担；适筋梁中弯矩主要是钢筋承担拉力、混凝土承担压力；剪力主要由箍筋和混凝土共同承担；扭矩由钢筋和混凝土形成抗扭骨架承担；而轴心拉力全部由钢筋承担，混凝土不参与承担。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006089", "t": 2, "q": "下列关于应力应变关系的说法中，符合胡克定律的有哪些？", "a": ["单向拉伸时，正应力与正应变成正比", "纯剪切时，切应力与切应变成正比", "平面应力状态下，正应力与正应变的关系满足广义胡克定律", "三向应力状态下，任意应力分量与应变分量均成线性关系（弹性阶段）", "当应力超过比例极限后，胡克定律仍然适用", ""], "r": "ABCD", "e": "胡克定律指在弹性范围内，应力与应变成正比。A选项单向拉伸正应力与正应变成正比，符合；B选项纯剪切切应力与切应变成正比，符合；C选项平面应力状态下正应力与正应变关系满足广义胡克定律，符合；D选项三向应力状态弹性阶段应力分量与应变分量成线性关系，符合；E选项应力超过比例极限后，胡克定律不适用。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006090", "t": 2, "q": "在梁的弯矩图绘制中，下列哪些规律是正确的？", "a": ["均布荷载作用段，弯矩图为斜直线", "集中力作用点处，弯矩图发生突变", "集中力偶作用点处，弯矩图发生突变，突变值等于集中力偶矩的大小", "剪力为零的截面，弯矩图达到极值", "梁的支座处，弯矩值一定为零（简支梁）", ""], "r": "CDE", "e": "均布荷载作用段弯矩图是抛物线，A错误；集中力作用点处剪力图突变，弯矩图转折，B错误；集中力偶作用点处弯矩图突变，突变值等于集中力偶矩大小，C正确；剪力为零截面弯矩图达极值，D正确；简支梁支座处弯矩为零，E正确。答案：CDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006091", "t": 2, "q": "下列关于最大切应力的说法中，正确的有哪些？", "a": ["平面应力状态下，最大切应力等于最大主应力与最小主应力之差的一半", "三向应力状态下，最大切应力等于最大主应力与最小主应力之差的一半", "纯剪切应力状态下，最大切应力等于剪切应力本身", "单向拉伸应力状态下，最大切应力等于轴向应力的一半", "最大切应力作用面与主平面的夹角为45度", ""], "r": "ABCDE", "e": "平面和三向应力状态下，最大切应力是最大主应力与最小主应力之差的一半；纯剪切应力状态最大切应力就是剪切应力；单向拉伸时最大切应力是轴向应力一半；最大切应力作用面与主平面夹角45度。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006092", "t": 2, "q": "在水利水电工程的钢结构构件中，下列关于强度计算的说法正确的有哪些？", "a": ["轴心受拉构件按最大正应力强度条件计算", "轴心受压构件仅需按稳定条件计算，无需强度计算", "受弯构件按弯曲正应力和切应力分别校核强度", "拉弯构件需同时校核正应力和切应力强度", "压弯构件需同时校核强度和稳定", ""], "r": "ACDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006093", "t": 2, "q": "下列关于平面应力状态应力圆的说法中，正确的有哪些？", "a": ["应力圆的圆心坐标为((σx+σy)/2,0)", "应力圆的半径为√[((σx-σy)/2)²+τxy²]", "应力圆上的点与斜截面上的应力一一对应", "应力圆与σ轴的交点对应主平面上的应力", "应力圆的转动方向与斜截面的转动方向相同", ""], "r": "ABCD", "e": "平面应力状态应力圆，圆心坐标是((σx + σy)/2, 0) ，半径为√[((σx - σy)/2)² + τxy²] ，圆上点与斜截面应力一一对应，与σ轴交点对应主平面应力。但应力圆转动方向和斜截面转动方向相反。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006094", "t": 2, "q": "在轴向拉压杆的变形计算中，影响杆件伸长量的因素有哪些？", "a": ["杆件的长度", "杆件的横截面面积", "材料的弹性模量", "杆件承受的轴力", "杆件的泊松比", ""], "r": "ABCD", "e": "根据轴向拉压杆伸长量公式「test/yiwen_img/importSubject/2035637017609637888.png」，F是轴力，l是杆长，E是弹性模量，A是横截面面积。泊松比与伸长量无关。所以影响因素有杆件长度、横截面面积、材料弹性模量、杆件承受轴力。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006095", "t": 2, "q": "下列关于梁的挠曲线近似微分方程的说法中，正确的有哪些？", "a": ["挠曲线近似微分方程的建立基于平面假设和小变形假设", "挠曲线近似微分方程的形式为EI w''=M(x)（符号根据坐标系而定）", "挠曲线近似微分方程的解可以得到梁的转角和挠度", "挠曲线近似微分方程适用于所有弯曲变形的梁", "挠曲线近似微分方程忽略了剪力对变形的影响", ""], "r": "ABCE", "e": "该方程基于平面假设和小变形假设建立，形式为EI w'' = M(x) ，求解可得梁的转角和挠度，且忽略了剪力影响。但它只适用于线弹性小变形梁，并非所有弯曲变形的梁。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006096", "t": 2, "q": "下列关于材料泊松比的说法中，正确的有哪些？", "a": ["泊松比是横向正应变与轴向正应变的比值的绝对值", "泊松比的取值范围通常在0到0.5之间", "钢材的泊松比约为0.25到0.33之间", "泊松比为0的材料，在拉伸时横向不发生变形", "泊松比大于0.5的材料，在变形时体积会增大", ""], "r": "ABCD", "e": "泊松比是横向正应变与轴向正应变绝对值之比，取值一般在0到0.5间，钢材约0.25 - 0.33 ，泊松比为0时横向不变形，大于0.5不符合实际物理规律。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006097", "t": 2, "q": "在三向等拉应力状态下，下列关于材料破坏的说法正确的有哪些？", "a": ["脆性材料会发生拉伸破坏，破坏面与主平面垂直", "塑性材料会发生塑性屈服，因为存在切应力", "第一强度理论适用于脆性材料的破坏校核", "第三强度理论的相当应力为零，无法用于校核", "第四强度理论的相当应力为零，无法用于校核", ""], "r": "ACDE", "e": "三向等拉时，无切应力，塑性材料不会因切应力屈服，B错；第一强度理论用于脆性材料拉伸破坏，三向等拉脆性材料会沿主平面拉断，A、C对；第三、四强度理论相当应力均为零，无意义，无法用于校核，D、E对。答案：ACDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006098", "t": 2, "q": "在水利水电工程的构件设计中，下列关于内力分析的说法正确的有哪些？", "a": ["静定结构的内力仅由平衡条件即可确定", "超静定结构的内力仅由平衡条件无法完全确定，需结合变形协调条件", "梁的内力包括轴力、剪力和弯矩", "拱结构的内力包括轴力、剪力和弯矩，且轴力通常较大", "刚架结构的内力仅包括弯矩和剪力，无轴力", ""], "r": "ABCD", "e": "静定结构满足静力平衡方程就能确定内力；超静定结构需结合变形协调条件；梁有轴力、剪力、弯矩；拱有轴力、剪力、弯矩且轴力大；刚架也有轴力。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006099", "t": 2, "q": "下列关于切应力互等定理的说法中，正确的有哪些？", "a": ["切应力互等定理适用于所有弹性体", "切应力互等定理指出，在互相垂直的截面上，切应力大小相等，方向相反", "切应力互等定理仅适用于平面应力状态", "切应力互等定理的成立基于平衡条件", "纯剪切应力状态是切应力互等定理的典型应用", ""], "r": "BDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006100", "t": 2, "q": "在水利水电工程的压力隧洞衬砌受力分析中，衬砌可视为环形截面构件，下列关于环形截面受弯时的应力说法正确的有哪些？", "a": ["环形截面的中性轴通过截面形心", "环形截面受弯时，最大正应力发生在离中性轴最远的截面边缘", "环形截面的惯性矩计算需考虑内、外圆的半径差异", "环形截面受弯时，截面上各点的正应力沿半径方向呈线性分布", "环形截面的抗弯截面系数与截面的内、外直径均无关", ""], "r": "ABCD", "e": "环形截面为中心对称图形，中性轴过形心；受弯时最大正应力在离中性轴最远边缘；惯性矩计算要考虑内外圆半径；正应力沿半径线性分布；抗弯截面系数与内外直径有关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006101", "t": 2, "q": "下列关于应力状态分析中主应力方向的说法，正确的有哪些？", "a": ["主应力方向是指截面上切应力为零的方向", "在平面应力状态下，两个主应力方向互相垂直", "主应力方向与坐标系的选择无关", "通过应力圆可确定主应力方向与x轴的夹角", "主应力方向上的正应力一定是该点的最大或最小正应力", ""], "r": "ABCDE", "e": "主应力方向截面上切应力为零；平面应力状态下两主应力方向垂直；主应力是固有属性与坐标系选择无关；应力圆可确定主应力与x轴夹角；主应力就是该点最大或最小正应力。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006102", "t": 2, "q": "在钢筋混凝土偏心受拉构件（如水利工程中的渡槽拉杆）受力分析中，下列说法正确的有哪些？", "a": ["小偏心受拉构件的截面全部受拉，混凝土不参与工作", "大偏心受拉构件的截面部分受拉、部分受压", "偏心受拉构件的内力包括轴力和弯矩", "小偏心受拉构件的钢筋拉力由轴力和弯矩共同引起", "大偏心受拉构件的受压区混凝土可承受部分压力", ""], "r": "ABCDE", "e": "A 选项，小偏心受拉，轴向拉力作用在钢筋 As 与 A's 合力点之间，整个截面全截面受拉，混凝土开裂后退出工作，拉力全部由钢筋承担，表述正确。<br />B 选项，大偏心受拉，轴向拉力作用在 As 与 A's 合力点之外，截面一侧受拉、另一侧存在受压区，表述正确。<br />C 选项，偏心受拉构件本质是同时承受轴向拉力与弯矩共同作用的构件，内力包含轴力、弯矩，表述正确。<br />D 选项，小偏心受拉构件截面内钢筋的拉力，是轴力与弯矩共同作用产生的，表述正确。<br />E 选项，大偏心受拉构件存在受压区，受压区混凝土可以承担压力，表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006103", "t": 2, "q": "下列关于材料弹性模量E的说法，正确的有哪些？", "a": ["弹性模量E是衡量材料抵抗弹性变形能力的指标", "弹性模量E的大小与材料的成分和组织结构有关", "温度升高时，大多数材料的弹性模量E会减小", "弹性模量E在单向拉伸和单向压缩时的数值通常相同", "弹性模量E与应力的大小有关，应力越大，E越大", ""], "r": "ABCD", "e": "弹性模量E衡量材料抵抗弹性变形能力，与材料成分和组织结构有关，温度升高多数材料E减小，单拉和单压时E通常相同，E是材料固有属性，与应力大小无关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006104", "t": 2, "q": "下列关于压杆长细比λ的说法，正确的有哪些？", "a": ["长细比λ是衡量压杆稳定性能的重要指标", "长细比λ越大，压杆越容易发生失稳破坏", "长细比λ的计算公式为λ=μL/i（μ为长度系数，L为杆长，i为惯性半径）", "对于相同截面的压杆，两端固定的长细比大于两端铰支的长细比", "长细比λ越小，压杆的临界应力越大", ""], "r": "ABCE", "e": "长细比λ综合反映了压杆长度、约束条件、截面形状和尺寸对压杆稳定的影响，是衡量压杆稳定性能重要指标，λ越大越易失稳，其公式为λ = μL/i 。两端固定μ小，长细比小于两端铰支的。且λ越小，临界应力越大。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006105", "t": 2, "q": "在平面应力状态下，若某点的应力分量满足σx=σy，τxy≠0，则下列说法正确的有哪些？", "a": ["该点的应力圆为圆心在σ轴上，半径为|τxy|的圆", "该点的主应力大小为σx±|τxy|", "该点的主方向与x轴的夹角为45°或135°", "该点的最大切应力大小为|τxy|", "该点的任意斜截面上的正应力均等于σx", ""], "r": "ABCD", "e": "平面应力状态应力圆方程可知，当σx = σy 时，应力圆圆心在σ轴上且为(σx,0)，半径为|τxy| 。主应力σ1,2=σx±|τxy| ，主方向由tan2α=-2τxy/(σx - σy)，因σx = σy ，则2α = ±90°，α = ±45° ，最大切应力等于半径|τxy| ，任意斜截面正应力σ = σx - τxy sin2α≠σx 。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714368", "t": 3, "q": "在平面应力状态中，若某点的两个正应力σx和σy大小相等、符号相反，且切应力τxy=0，则该点的主应力大小等于σx和σy，主方向与x轴、y轴一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "平面应力状态主应力计算公式为「test/yiwen_img/importSubject/2035637017706106880.png」，已知「test/yiwen_img/importSubject/2035637017794187264.png」，「test/yiwen_img/importSubject/2035637017861296128.png」，代入公式得「test/yiwen_img/importSubject/2035637017966153728.png」，「test/yiwen_img/importSubject/2035637018037456896.png」 ，主方向与x、y轴一致。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714369", "t": 3, "q": "梁的弯曲正应力公式σ=M y/Iz仅适用于等截面直梁，不适用于变截面梁或曲梁。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梁的弯曲正应力公式σ = M y / Iz推导时基于等截面直梁的平面假设等条件，变截面梁和曲梁不满足这些假设，该公式通常不适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714370", "t": 3, "q": "第三强度理论（最大切应力理论）认为，材料的破坏主要由最大切应力引起，其相当应力σr3=σ₁-σ₃，适用于所有塑性材料的强度校核。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "第三强度理论适用于塑性材料的塑性屈服破坏，但并非适用于所有塑性材料的强度校核，比如三向等拉应力状态就不适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714371", "t": 3, "q": "轴向拉压杆的应力集中现象仅发生在载荷作用点附近，离载荷作用点足够远的位置，应力分布仍均匀。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714372", "t": 3, "q": "圆轴扭转时，横截面上的切应力沿半径方向呈线性分布，圆心处切应力为零，圆周处切应力最大，该分布规律与材料的弹性模量无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "圆轴扭转切应力公式推导中，切应力与半径成正比，圆心处半径为 0 切应力为零，圆周处半径最大切应力最大，且推导过程未涉及弹性模量。所以此说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714373", "t": 3, "q": "平面应变状态下，某点的纵向应变εz=0，因此该点的纵向正应力σz也一定为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "平面应变状态下，εz = 0，但根据广义胡克定律，σz通常不为零，因为横向应变会引起纵向应力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714374", "t": 3, "q": "梁的剪力图在集中力偶作用点处会发生突变，突变值等于集中力偶矩的大小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梁的剪力图在集中力作用点处会发生突变，突变值等于集中力大小；而在集中力偶作用点处，剪力图无变化，弯矩图会发生突变，突变值等于集中力偶矩大小。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714375", "t": 3, "q": "材料的泊松比ν越大，说明材料在拉伸时横向收缩越明显，对于不可压缩材料（如橡胶），泊松比ν=0.5。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "泊松比是横向应变与纵向应变的绝对值比值，ν越大表示横向收缩相对纵向伸长越明显；不可压缩材料在受力时体积不变，理论上泊松比为 0.5。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714376", "t": 3, "q": "三向应力状态下，最大主应力σ₁一定大于所有斜截面上的正应力，最小主应力σ₃一定小于所有斜截面上的正应力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三向应力状态下，最大主应力σ₁是所有截面上正应力的最大值，最小主应力σ₃是所有截面上正应力的最小值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714377", "t": 3, "q": "压杆的临界压力与压杆的材料无关，仅与压杆的长度、截面尺寸和支承条件有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压杆的临界压力与材料的弹性模量有关，而弹性模量是材料的特性，所以与材料有关，并非仅与长度、截面尺寸和支承条件有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714378", "t": 3, "q": "在钢筋混凝土适筋梁中，受拉区混凝土因抗拉强度低而开裂，拉力全部由受拉钢筋承担，受压区混凝土承担压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "适筋梁受荷后，受拉区混凝土达到抗拉强度会开裂，开裂后拉力由钢筋承担，受压区混凝土承担压力，符合适筋梁工作原理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714379", "t": 3, "q": "平面应力状态的应力圆若与σ轴没有交点，则说明该点不存在主平面，所有截面上均有切应力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "平面应力状态下，应力圆与σ轴交点对应的就是主平面上的主应力，即使应力圆与σ轴无交点，也存在主平面，只是主应力为纯剪切应力状态下的特殊情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714380", "t": 3, "q": "轴向拉压杆的伸长量ΔL=NL/(EA)，其中A为横截面面积，对于变截面杆，需分段计算伸长量后求和。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "公式ΔL = NL/(EA)适用于等截面的轴向拉压杆，对于变截面杆，不同段的A不同，不能直接用此公式计算整体伸长量，需分段计算各段伸长量后再求和。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714381", "t": 3, "q": "梁的挠曲线近似微分方程EIw''=M(x)中，EI为梁的抗弯刚度，M(x)为截面上的弯矩，该方程忽略了剪力对挠度的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梁的挠曲线近似微分方程推导时基于小变形假设，且仅考虑弯矩对梁变形的影响，忽略了剪力对挠度的影响，方程里EI是抗弯刚度，M(x)是截面弯矩。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714382", "t": 3, "q": "切应力互等定理指出，在任意两个互相垂直的截面上，切应力大小相等、方向相同，该定理仅适用于弹性阶段的材料。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "切应力互等定理中，互相垂直截面上切应力大小相等，但方向是共同指向或背离两截面交线，并非方向相同；且该定理与材料是否处于弹性阶段无关，适用于所有受力物体。所以此说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714383", "t": 3, "q": "第一强度理论（最大拉应力理论）适用于脆性材料的拉伸破坏，其强度条件为σ₁≤[σt]，其中[σt]为材料的许用拉应力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "第一强度理论认为材料的破坏主要由最大拉应力引起，适用于脆性材料的拉伸破坏，强度条件就是σ₁≤[σt] 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714384", "t": 3, "q": "圆轴承受弯曲与扭转组合变形时，危险点的正应力由弯曲引起，切应力由扭转引起，需采用强度理论校核强度，不能单独校核弯曲或扭转强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "圆轴弯扭组合变形时，危险点有正应力和切应力，属于复杂应力状态，不能单独按弯曲或扭转强度校核，要按强度理论来考虑两种应力综合影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714385", "t": 3, "q": "在平面应力状态中，若某点的最大切应力τmax=0，则该点的应力状态为单向应力状态或三向等应力状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最大切应力公式「test/yiwen_img/importSubject/2035637018192646144.png」，「test/yiwen_img/importSubject/2035637018301698048.png」意味着「test/yiwen_img/importSubject/2035637018381389824.png」。当另外一个主应力「test/yiwen_img/importSubject/2035637018448498688.png」与「test/yiwen_img/importSubject/2035637018532384768.png」（「test/yiwen_img/importSubject/2035637018616270848.png」）不同时为单向应力状态；当「test/yiwen_img/importSubject/2035637018679185408.png」时为三向等应力状态。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714386", "t": 3, "q": "压杆的长细比λ越大，临界应力σcr越小，当λ超过某一值时，压杆的临界应力会小于材料的屈服强度σs，此时需采用欧拉公式计算临界压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "长细比λ越大，临界应力σcr越小。但当λ超过某一值时，若压杆的临界应力小于材料的屈服强度σs，此时属于大柔度杆，用欧拉公式计算临界压力，表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714387", "t": 3, "q": "水利工程中的压力钢管，其横截面处于平面应力状态，环向应力（周向应力）通常大于轴向应力，因此环向是主要受力方向。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压力钢管横截面属平面应力状态，因环向应力计算公式中相关参数关系，一般环向应力比轴向应力大，所以环向是主要受力方向。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714388", "t": 3, "q": "材料的弹性模量E和剪切模量G之间的关系为G=E/(2(1+ν))，其中ν为泊松比，该关系适用于所有各向同性材料。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于各向同性材料，弹性模量E、剪切模量G和泊松比ν之间存在G = E/(2(1 + ν))的关系。所以此说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714389", "t": 3, "q": "梁的剪力图在均布荷载作用段为斜直线，斜率等于均布荷载集度q的大小，若q向下，剪力图斜率为正。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梁在均布荷载作用段，剪力图为斜直线，斜率等于均布荷载集度q的大小，但当q向下时，剪力图斜率为负，而不是正。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714390", "t": 3, "q": "在偏心受压构件中，若偏心距e=0，则构件变为轴心受压构件，截面上的正应力均匀分布。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "偏心距为 0 意味着压力作用线通过构件截面形心，此时就是轴心受压，截面上正应力均匀分布。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714391", "t": 3, "q": "三向应力状态下，三个主应力的大小顺序一定为σ₁≥σ₂≥σ₃，其中σ₁为最大主应力，σ₃为最小主应力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据主应力定义，三向应力状态下按代数值大小排序，规定σ₁≥σ₂≥σ₃ ，σ₁为最大主应力，σ₃为最小主应力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714392", "t": 3, "q": "轴向拉压杆的应力σ=N/A，该公式适用于杆的所有横截面，包括载荷作用点附近的应力集中区域。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "应力公式σ = N/A 是基于均匀应力分布推导的，而载荷作用点附近存在应力集中，应力分布不均匀，该公式不适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714393", "t": 3, "q": "梁的弯矩图在剪力为零的截面处出现极值，若剪力由正变负，弯矩图在该截面处为极大值;若剪力由负变正，弯矩图为极小值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据梁的弯矩和剪力的微分关系，弯矩的导数是剪力，剪力为零的点是弯矩的驻点，当剪力正负改变时，对应的弯矩就会出现极值，剪力由正变负，弯矩为极大值，由负变正，弯矩为极小值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714394", "t": 3, "q": "平面应变状态与平面应力状态是两种完全相同的应力状态，仅名称不同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "平面应变和平面应力是不同应力状态，平面应变是某一方向应变恒为零，平面应力是某一方向应力恒为零。", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714395", "t": 3, "q": "压杆的临界压力与截面的惯性矩成正比，惯性矩越大，临界压力越大，因此设计压杆时应尽量增大截面的惯性矩。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压杆临界压力与截面惯性矩有关，一般情况下成正比，增大惯性矩能提高临界压力，所以设计时通常会尽量增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714396", "t": 3, "q": "材料的比例极限σp是胡克定律适用的上限，当应力σ>σp时，应力与应变不再呈线性关系，弹性模量E不再为常数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "材料比例极限σp 是应力与应变成线性关系的最大应力，胡克定律适用范围是应力小于等于比例极限，当σ>σp，应力应变不再线性，弹性模量 E 是应力与应变线性关系的比例常数，此时 E 不再恒定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714397", "t": 3, "q": "在钢筋混凝土构件中，由于混凝土的抗拉强度远低于抗压强度，因此在受拉区通常配置钢筋来承受拉力，混凝土仅承受压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在钢筋混凝土构件里，混凝土抗压能力强、抗拉能力弱，受拉区配置钢筋可让钢筋承受拉力，混凝土主要承受压力，能充分发挥两者特性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714398", "t": 3, "q": "圆轴的扭转角φ=TL/(GIp)，其中Ip为极惯性矩，G为剪切模量，该公式适用于弹性阶段的圆轴，且轴的横截面形状不发生改变。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "圆轴扭转角公式φ = TL/(GIp)推导时基于圆轴处于弹性阶段，且利用了圆轴扭转时横截面仍保持平面、形状和尺寸不变等假设。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714399", "t": 3, "q": "最大切应力理论（第三强度理论）的相当应力σr3=σ₁-σ₃，第四强度理论的相当应力σr4=√[(1/2)((σ₁-σ₂)²+(σ₂-σ₃)²+(σ₃-σ₁)²)]，对于同一应力状态，σr3≥σr4，因此第四强度理论更经济。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "由两理论相当应力公式可知，一般情况下σr3≥σr4，意味着按第四强度理论设计所需材料更少更省，所以更经济。", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714400", "t": 3, "q": "平面应力状态中，若σx=σy且τxy≠0，则该点的主应力方向与x轴成45°，主应力大小为σx±τxy。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据平面应力状态主应力方向和大小公式，当σx = σy且τxy≠0时，可推出主应力方向与x轴成45°，主应力大小为σx±τxy 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714401", "t": 3, "q": "梁的抗弯截面系数Wz=Iz/y max，Wz越大，梁的抗弯能力越强，因此设计梁时应尽量增大Wz，可通过增大截面高度或优化截面形状实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抗弯截面系数Wz与梁抗弯能力正相关，公式Wz = Iz / y max正确，增大截面高度或优化截面形状能增大Wz从而增强梁抗弯能力。", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714402", "t": 3, "q": "轴向压杆的稳定校核中，若压杆的长细比 λ < λₛ（屈服长细比），则压杆的临界应力 σ꜀ᵣ = σₛ（屈服应力），需按强度条件校核，无需按稳定条件校核。  ", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "λₛ​ 是屈服长细比（对应比例极限长细比 λₚ 与 λₛ 的关系：λ ≥ λₚ 为大柔度杆，用欧拉公式；λₛ ≤ λ < λₚ 为中柔度杆，用经验公式；λ < λₛ 为小柔度杆/粗短杆）。小柔度杆的失效形式是强度屈服（塑性材料）或断裂（脆性材料），而非失稳。其临界应力即为材料的屈服应力 σₛ（或抗拉强度 σ_b）。<br />因此，当 λ < λₛ​ 时，压杆不会发生屈曲失稳，只需按轴向压缩强度条件（σ = N/A ≤ [σ]）校核，无需进行稳定校核。", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714403", "t": 3, "q": "切应力互等定理适用于任意形状的横截面，只要两个截面互相垂直，即可应用该定理。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "切应力互等定理是指在相互垂直的两个平面上，切应力必然成对存在且数值相等，方向都垂直于两平面的交线，且共同指向或背离这一交线，该定理适用于任意形状的横截面，只要两个截面互相垂直就能应用。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714404", "t": 3, "q": "在三向等压应力状态下，材料的体积应变εv=-3p(1-2ν)/E，其中p为压应力大小，由于ν<0.5，εv为负值，说明材料体积缩小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据公式及条件，ν<0.5时，计算得出εv为负，负的体积应变意味着材料体积缩小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714405", "t": 3, "q": "梁的变形包括转角和挠度，转角是横截面绕中性轴的转角，挠度是横截面形心沿垂直于梁轴线方向的位移，二者均为位置x的函数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梁的变形中，转角就是横截面绕中性轴的转角，挠度是横截面形心沿垂直梁轴线方向位移，且二者都随梁上位置x变化，是x的函数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714406", "t": 3, "q": "材料的屈服强度σs是塑性材料开始发生塑性变形的应力，当应力σ≤σs时，材料处于弹性阶段，应力去除后变形可完全恢复。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "屈服强度就是塑性材料开始产生明显塑性变形时的应力，在应力小于等于屈服强度时，材料只发生弹性变形，弹性变形在应力去除后能完全恢复。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714407", "t": 3, "q": "水利水电工程中的混凝土坝，其坝体应力分析通常采用平面应变假设，因为坝体沿轴线方向的长度远大于横截面尺寸，沿轴线方向的应变可忽略。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "混凝土坝坝体沿轴线方向长度远大于横截面尺寸，符合平面应变问题特征，沿轴线方向应变极小可忽略，所以坝体应力分析常采用平面应变假设。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第1章 力学基础||第2节 建筑材料和结构的力学性能（1）", "n": "第1章 力学基础 / 第2节 建筑材料和结构的力学性能（1）", "qs": [{"id": "2035637035238297600", "t": 1, "q": "在水利水电工程混凝土重力坝坝体应力分析中，若需考虑坝体与基岩接触面的剪切变形对坝体整体稳定性的影响，下列力学模型中最适合采用的是", "a": ["弹性地基梁模型（忽略接触面剪切变形）", "有限元接触单元模型（考虑接触面法向与切向变形）", "刚体极限平衡模型（仅考虑接触面抗剪强度）", "材料力学悬臂梁模型（假设基岩为刚性约束）", "", ""], "r": "B", "e": "本题要考虑坝体与基岩接触面的剪切变形对坝体整体稳定性的影响，需要选择能体现接触面剪切变形的模型。A选项弹性地基梁模型忽略接触面剪切变形，不符合要求；C选项刚体极限平衡模型仅考虑接触面抗剪强度，未考虑剪切变形；D选项材料力学悬臂梁模型假设基岩为刚性约束，也不考虑接触面剪切变形。而B选项有限元接触单元模型可考虑接触面法向与切向变形，能体现坝体与基岩接触面的剪切变形。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297601", "t": 1, "q": "在水利水电工程中，混凝土轴心抗压强度标准值fck的确定需考虑多种因素，下列因素中对fck影响最显著的是（　）", "a": ["混凝土养护温度（20±2℃范围内波动）", "混凝土水灰比", "骨料最大粒径（20mm与40mm差异）", "混凝土龄期（28d与60d差异）", "", ""], "r": "B", "e": "水灰比是影响混凝土强度的关键因素，水灰比越小，混凝土强度越高，对轴心抗压强度标准值fck影响最显著。养护温度在合理范围、骨料粒径小差异、龄期小差异影响相对没水灰比大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297602", "t": 1, "q": "某水利枢纽中的钢筋混凝土T形梁，在承受均布荷载作用时，梁内某截面产生的正应力分布符合下列哪种规律（　）", "a": ["沿截面高度呈线性分布，中性轴处应力为零", "沿截面高度呈抛物线分布，中性轴处应力最大", "沿截面宽度呈线性分布，翼缘边缘应力为零", "沿截面宽度呈抛物线分布，腹板处应力最大", "", ""], "r": "A", "e": "钢筋混凝土梁受弯时，正应力沿截面高度呈线性分布，中性轴处正应力为零。本题是承受均布荷载的T形梁，正应力分布规律也是如此。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297603", "t": 1, "q": "在计算水利工程中岩石边坡的稳定性时，若考虑边坡岩体的剪切破坏，其抗剪强度指标c（黏聚力）和φ（内摩擦角）的取值需依据现场试验，下列试验方法中最适合测定坚硬岩石抗剪强度的是（　）", "a": ["直接剪切试验（使用天然结构面试件）", "三轴压缩试验（围压0.5-5MPa）", "无侧限抗压强度试验", "点荷载试验", "", ""], "r": "B", "e": "坚硬岩石抗剪强度测定，三轴压缩试验能较好模拟岩石实际受力状态，围压0.5 - 5MPa适用于测定坚硬岩石抗剪强度。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297604", "t": 1, "q": "某水利隧洞采用喷锚支护，喷射混凝土的设计强度等级为C25，下列关于喷射混凝土力学性能的说法正确的是（　）", "a": ["其轴心抗拉强度标准值与同强度等级普通混凝土相同", "其弹性模量比同强度等级普通混凝土高10%-15%", "其抗冻等级需根据隧洞水头高度确定，最低不低于F50", "其早期强度增长速度比同强度等级普通混凝土慢", "", ""], "r": "C", "e": "逐一分析选项：A项，喷射混凝土轴心抗拉强度标准值与同强度等级普通混凝土不同；B项，弹性模量比同强度等级普通混凝土低10% - 15%；D项，喷射混凝土早期强度增长速度比同强度等级普通混凝土快。C选项正确，抗冻等级根据隧洞水头高度确定，最低不低于F50。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297605", "t": 1, "q": "在结构力学中，水利工程中的重力坝可简化为超静定结构，下列关于超静定结构内力分析的说法错误的是（　）", "a": ["需考虑结构的变形协调条件", "内力分布与构件的刚度比相关", "温度变化会引起超静定结构产生附加内力", "超静定结构的内力只与荷载作用有关", "", ""], "r": "D", "e": "超静定结构内力分析不仅与荷载作用有关，还需考虑变形协调条件，内力分布和构件刚度比相关，温度变化等也会引起附加内力。D选项说法错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297606", "t": 1, "q": "某水利工程采用HRB400E钢筋，关于该钢筋力学性能的要求，下列说法正确的是（　）", "a": ["屈服强度标准值不小于400MPa，抗拉强度标准值不小于540MPa", "屈服强度标准值不小于360MPa，抗拉强度标准值不小于500MPa", "断后伸长率不小于14%", "最大力总伸长率不小于7%", "", ""], "r": "A", "e": "HRB400E是有较高要求的抗震结构适用的钢筋，屈服强度标准值不小于400MPa，抗拉强度标准值不小于540MPa。断后伸长率不小于16%，最大力总伸长率不小于9%。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297607", "t": 1, "q": "在材料力学中，计算水利工程中圆形截面钢筋混凝土柱的稳定系数φ时，需考虑柱的长细比λ，下列关于长细比λ的计算正确的是（　）", "a": ["λ=μl/i，其中μ为柱的计算长度系数，l为柱的实际长度，i为截面惯性半径", "λ=l/i，其中l为柱的计算长度，i为截面回转半径", "λ=μl/A，其中A为柱的截面面积", "λ=l/A，其中l为柱的实际长度", "", ""], "r": "A", "e": "长细比λ的计算公式为λ = μl/i ，μ是柱的计算长度系数，l是柱的实际长度，i是截面惯性半径。B选项l应为实际长度；C、D选项分母错误，不是截面面积。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297608", "t": 1, "q": "某水利工程中的混凝土重力坝，在正常蓄水位作用下，坝基产生的应力需满足设计要求，下列关于坝基应力计算的说法正确的是（　）", "a": ["坝基垂直应力按均匀分布计算，即σ=W/A（W为坝体自重，A为坝基面积）", "坝基垂直应力需考虑坝体自重和水压力的共同作用，按偏心受压公式计算", "坝基水平应力仅由水压力引起，按线性分布计算", "坝基剪应力均匀分布在坝基接触面上", "", ""], "r": "B", "e": "坝基垂直应力要考虑坝体自重和水压力等共同作用，不是简单均匀分布，按偏心受压公式计算更合理；坝基水平应力不只是由水压力引起；坝基剪应力不是均匀分布。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297609", "t": 1, "q": "在建筑材料中，水利工程常用的硅酸盐水泥初凝时间和终凝时间需满足国家标准，下列关于硅酸盐水泥凝结时间的说法正确的是（　）", "a": ["初凝时间不得早于45min，终凝时间不得迟于6.5h", "初凝时间不得早于30min，终凝时间不得迟于10h", "初凝时间不得迟于45min，终凝时间不得早于6.5h", "初凝时间不得迟于30min，终凝时间不得早于10h", "", ""], "r": "A", "e": "硅酸盐水泥初凝时间不得早于45min，终凝时间不得迟于6.5h 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297610", "t": 1, "q": "在结构力学中，水利工程中的简支梁桥在跨中受集中荷载作用时，梁的剪力图和弯矩图的特征是（　）", "a": ["剪力图在荷载作用点处发生突变，弯矩图在荷载作用点处为斜直线", "剪力图在荷载作用点两侧为常数，弯矩图在荷载作用点处达到最大值", "剪力图在荷载作用点处为零，弯矩图在荷载作用点处发生突变", "剪力图在荷载作用点处为斜直线，弯矩图在荷载作用点两侧为常数", "", ""], "r": "B", "e": "这是一道关于结构力学中简支梁桥在特定荷载条件下剪力图和弯矩图特征的题目。我们可以根据结构力学的基本原理来快速判断：1. 剪力图特征： 当简支梁桥在跨中受集中荷载作用时，该荷载会导致梁在该点产生弯矩。 剪力图表示梁上各点处的剪力分布，而在集中荷载作用点处，由于荷载的突变，剪力也会发生突变。2. 弯矩图特征： 弯矩图表示梁上各点处的弯矩分布。 在集中荷载作用点处，由于荷载产生的弯矩作用，该点的弯矩值会达到一个极值（通常是最大值），而弯矩图在该点附近呈现为斜直线，直至达到该极值点。现在，我们根据这些特征来评估各个选项： A选项描述剪力图在荷载作用点处发生突变，这是正确的，但描述弯矩图在荷载作用点处为斜直线是不准确的，因为弯矩图在该点应达到最大值。 B选项描述剪力图在荷载作用点两侧为常数（反映荷载作用点两侧剪力的不变性），这是符合简支梁受集中荷载作用的特征的；同时描述弯矩图在荷载作用点处达到最大值，这也是准确的。 C选项描述剪力图在荷载作用点处为零，这是不正确的。 D选项描述的剪力图和弯矩图特征均不符合实际情况。综上所述，B选项最准确地描述了简支梁桥在跨中受集中荷载作用时剪力图和弯矩图的特征。所以，正确答案是B选项：“剪力图在荷载作用点两侧为常数，弯矩图在荷载作用点处达到最大值”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297611", "t": 1, "q": "某水利工程采用碾压混凝土筑坝，关于碾压混凝土力学性能的说法，错误的是（　）", "a": ["碾压混凝土的密实度通过振动碾压实现，其抗压强度与密实度正相关", "碾压混凝土的抗渗性主要取决于胶凝材料用量和骨料级配", "碾压混凝土的弹性模量比同强度等级常态混凝土高", "碾压混凝土的干缩率比同强度等级常态混凝土小", "", ""], "r": "C", "e": "通常碾压混凝土弹性模量比同强度等级常态混凝土低，C选项说法错误。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297612", "t": 1, "q": "在材料力学中，计算水利工程中受拉钢筋的应力时，若采用\"平截面假定\"，则下列说法正确的是（　）", "a": ["钢筋应力与钢筋应变呈线性关系，直至钢筋屈服", "钢筋应力与混凝土应变呈线性关系", "受拉区混凝土应力分布为三角形，受压区为矩形", "受拉区混凝土不参与工作，拉力全部由钢筋承担", "", ""], "r": "A", "e": "平截面假定认为截面应变沿高度线性分布；钢筋在屈服前应力应变线性相关。B 错，钢筋应力和混凝土应变不是直接线性；C、D 为适筋梁破坏假定，并非平截面假定本身内容。", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297613", "t": 1, "q": "某水利水电工程中的岩石地基，进行现场载荷试验确定其承载力特征值，下列关于载荷试验的说法正确的是（　）", "a": ["载荷试验的承压板面积应根据岩石的坚硬程度确定，坚硬岩石承压板面积不小于0.5m²", "载荷试验的加载方式应采用分级连续加载，每级加载量为预估极限承载力的1/10", "当承压板沉降量突然增大，且24h内沉降未稳定时，对应的荷载即为极限承载力", "岩石地基承载力特征值取极限承载力的1/3", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297614", "t": 1, "q": "在结构力学中，水利工程中的拱结构与梁结构相比，其受力特点的主要区别是（　）", "a": ["拱结构只承受轴力，不承受弯矩和剪力", "拱结构承受的弯矩比同跨度、同荷载的梁结构小", "拱结构的支座只提供竖向反力，不提供水平反力", "拱结构的内力分布与拱的曲率无关", "", ""], "r": "B", "e": "拱结构与梁结构相比，拱结构可将部分竖向荷载转化为水平推力，从而使拱内弯矩比同跨度、同荷载的梁结构小。A选项拱结构也承受弯矩和剪力；C选项拱结构支座有水平反力；D选项拱结构内力分布与拱曲率有关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297615", "t": 1, "q": "某水利工程采用C30混凝土，在进行混凝土配合比设计时，确定水胶比需考虑混凝土强度等级和耐久性要求，下列关于水胶比的说法正确的是（　）", "a": ["水胶比越大，混凝土强度越高，耐久性越好", "水胶比应根据混凝土强度公式计算，并满足耐久性规定的最大水胶比限值", "水胶比仅由混凝土强度等级确定，与环境类别无关", "对于C30混凝土，水胶比可任意取值，只要满足和易性要求", "", ""], "r": "B", "e": "水胶比与混凝土强度和耐久性密切相关，水胶比大强度低、耐久性差，要根据强度公式算且满足耐久性最大水胶比限值，还与环境类别有关，不能任意取值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297616", "t": 1, "q": "在材料力学中，水利工程中受扭构件的扭矩计算，下列说法正确的是（　）", "a": ["矩形截面受扭构件的抗扭承载力仅与混凝土强度等级和截面尺寸有关", "钢筋混凝土受扭构件的抗扭承载力由混凝土和受扭钢筋共同承担", "圆形截面受扭构件的剪应力沿截面半径呈均匀分布", "受扭构件的扭矩设计值仅由外荷载产生，与构件刚度无关", "", ""], "r": "B", "e": "矩形截面受扭承载力还与配筋等有关，A 错；圆形截面受扭构件剪应力沿截面半径呈线性分布，C 错；扭矩设计值与构件刚度有关，D 错。钢筋混凝土受扭构件抗扭承载力由混凝土和受扭钢筋共同承担。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297617", "t": 1, "q": "某水利枢纽中的溢洪道闸门，采用钢结构制造，关于钢结构连接方式的力学性能，下列说法正确的是（　）", "a": ["焊接连接的抗拉强度比螺栓连接高，且变形小", "普通螺栓连接的抗剪强度比高强度螺栓摩擦型连接高", "铆钉连接的塑性比焊接连接差", "高强度螺栓承压型连接的变形比摩擦型连接小", "", ""], "r": "A", "e": "焊接连接抗拉强度高、变形小；普通螺栓抗剪强度低于高强度螺栓摩擦型连接；铆钉连接塑性比焊接好；高强度螺栓承压型连接变形比摩擦型大。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297618", "t": 1, "q": "在结构力学中，计算水利工程中超静定梁的内力时，采用\"力法\"的核心步骤是（　）", "a": ["选择基本体系，建立力法方程，求解多余未知力", "确定梁的支座反力，绘制剪力图和弯矩图", "计算梁的变形，确定最大挠度位置", "分析梁的受力状态，判断危险截面", "", ""], "r": "A", "e": "力法是求解超静定结构的一种基本方法，核心就是先选基本体系，再建立力法方程来求解多余未知力。B选项确定支座反力等是后续步骤；C选项计算变形不是力法核心；D选项分析受力和判断危险截面也不是力法核心。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297619", "t": 1, "q": "某水利工程中的混凝土结构，在长期荷载作用下会产生徐变，下列关于徐变的说法正确的是（　）", "a": ["徐变是混凝土在长期不变荷载作用下，应变随时间增长的现象，且徐变值随时间无限增大", "混凝土强度等级越高，徐变越大", "荷载作用时间越长，徐变越大，后期徐变增长速率减慢", "环境温度越低，徐变越大", "", ""], "r": "C", "e": "徐变是混凝土在长期不变荷载下应变随时间增长现象，但徐变值不会无限增大，A错；混凝土强度等级越高，徐变越小，B错；环境温度越低、湿度越大，徐变越小，D错；荷载作用时间越长，徐变越大，且后期增长速率减慢，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297620", "t": 1, "q": "在建筑材料中，水利工程常用的粉煤灰作为混凝土掺合料，其对混凝土力学性能的影响是（　）", "a": ["会降低混凝土的早期强度，提高混凝土的后期强度", "会提高混凝土的早期强度，降低混凝土的后期强度", "会同时降低混凝土的早期和后期强度", "会同时提高混凝土的早期和后期强度", "", ""], "r": "A", "e": "粉煤灰早期活性低，会使混凝土早期强度增长慢，但后期能参与反应，提高后期强度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297621", "t": 1, "q": "在材料力学中，水利工程中矩形截面梁的最大剪应力发生在（　）", "a": ["梁截面的上边缘或下边缘处", "梁截面的中性轴处", "梁截面高度的1/2处", "梁截面高度的1/3处", "", ""], "r": "B", "e": "矩形截面梁最大剪应力发生在中性轴处。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335680", "t": 2, "q": "在水利水电工程碾压混凝土坝的结构力学分析中，需同时考虑的力学效应有（　）", "a": ["混凝土的徐变效应", "温度应力效应（浇筑温度、环境温度变化）", "干缩应力效应（混凝土硬化过程中水分蒸发）", "渗透压力效应（坝体渗水产生的压力）", "冻融循环效应（寒冷地区冬季冻融作用）", ""], "r": "ABCD", "e": "水利水电工程碾压混凝土坝结构力学分析要综合考虑多种影响坝体力学性能的因素，混凝土徐变、温度应力、干缩应力和渗透压力都会对坝体力学特性有显著作用。冻融循环主要影响耐久性而非结构力学分析重点考虑的力学效应。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335681", "t": 2, "q": "水利水电工程中，混凝土的力学性能受骨料影响显著，下列骨料特性中会影响混凝土抗压强度的有（　）", "a": ["骨料的岩石种类（如花岗岩、石灰岩）", "骨料的颗粒级配（连续级配或间断级配）", "骨料的饱和面干吸水率", "骨料的针片状颗粒含量", "骨料的表观密度", ""], "r": "ABCD", "e": "在水利水电工程中，混凝土的力学性能确实受到骨料特性的显著影响。以下是对各选项的简要A. 骨料的岩石种类（如花岗岩、石灰岩）：不同岩石种类的硬度和强度不同，直接影响混凝土的抗压强度。因此，岩石种类是一个重要影响因素。B. 骨料的颗粒级配（连续级配或间断级配）：颗粒级配的好坏决定了骨料堆积的密实程度，从而影响混凝土的密实性和抗压强度。连续级配通常比间断级配更有利于提高混凝土的抗压强度。C. 骨料的饱和面干吸水率：吸水率高的骨料在混凝土中会吸收更多的水分，可能导致混凝土拌合物的工作性变差，硬化后强度降低。因此，饱和面干吸水率也会影响混凝土的抗压强度。D. 骨料的针片状颗粒含量：针片状颗粒含量过高会导致骨料堆积不密实，降低混凝土的密实性和抗压强度。因此，这也是一个重要影响因素。E. 骨料的表观密度：虽然表观密度在一定程度上反映了骨料的密实程度和质量，但它并不直接影响混凝土的抗压强度。混凝土的抗压强度更多地取决于骨料的组成、级配和吸水性等因素。综上所述，会影响混凝土抗压强度的骨料特性包括：岩石种类（A）、颗粒级配（B）、饱和面干吸水率（C）以及针片状颗粒含量（D）。表观密度（E）虽然与骨料质量有关，但不直接影响混凝土的抗压强度。所以，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335682", "t": 2, "q": "在静力学中，水利水电工程的三角形薄壁堰（用于测量水流流量），其堰顶水头与流量的关系推导需依据的力学原理有（　）", "a": ["流体静力学基本方程（压强分布规律）", "伯努利方程（能量守恒）", "连续性方程（质量守恒）", "动量方程（力与动量变化关系）", "达西定律（渗流流量计算）", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335683", "t": 2, "q": "水利水电工程中，钢筋混凝土受弯构件正截面受弯承载力计算时，需考虑的因素有（　）", "a": ["受拉区钢筋的面积及屈服强度", "受压区混凝土的轴心抗压强度设计值", "构件的截面有效高度", "混凝土的保护层厚度", "构件的跨度", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335684", "t": 2, "q": "在材料力学中，水利水电工程的轴向拉压构件（如水电站厂房的柱），其强度计算需满足的条件有（　）", "a": ["构件的实际应力不大于材料的许用应力", "构件的最大轴力不大于材料的极限轴力", "构件的相对变形不大于允许相对变形", "构件的稳定安全系数不小于规定值", "构件的截面尺寸满足最小配筋率要求（对钢筋混凝土构件）", ""], "r": "ABE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335685", "t": 2, "q": "水利水电工程中，评价水泥力学性能的指标有（　）", "a": ["初凝时间", "终凝时间", "抗折强度", "抗压强度", "安定性", ""], "r": "CD", "e": "水泥力学性能主要指其抵抗破坏的能力，抗折强度和抗压强度是衡量水泥力学性能的关键指标。初凝、终凝时间及安定性不属于力学性能指标。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335686", "t": 2, "q": "水利水电工程中，混凝土重力坝坝体裂缝控制需考虑的力学因素有（　）", "a": ["坝体温度应力（浇筑温度、温升、温降）", "坝体干缩应力（混凝土硬化收缩）", "坝体承受的静水压力（水平荷载）", "坝基不均匀沉降产生的附加应力", "坝体振动荷载（如泄洪振动）", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335687", "t": 2, "q": "在水利水电工程材料试验中，测定混凝土轴心抗拉强度的试验方法有（　）", "a": ["直接拉伸试验（采用哑铃形试件）", "劈裂试验（采用立方体或圆柱体试件）", "抗折试验（采用棱柱体试件）", "抗压试验（采用立方体试件）", "黏结试验（采用钢筋-混凝土黏结试件）", ""], "r": "AB", "e": "测定混凝土轴心抗拉强度有直接拉伸试验（用哑铃形试件）和劈裂试验（用立方体或圆柱体试件）。抗折试验测抗折强度，抗压试验测抗压强度，黏结试验测黏结力，均非测轴心抗拉强度。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335688", "t": 2, "q": "水利水电工程中，土石坝的坝体应力分析需考虑的荷载有（　）", "a": ["坝体自重（永久荷载）", "坝顶活荷载（如交通荷载）", "水压力（水平及竖向）", "地震荷载（水平及竖向）", "渗流力（坝体内部渗流产生的力）", ""], "r": "ABCDE", "e": "答案：ABCDE土石坝的坝体应力分析是水利水电工程中的重要环节，需要考虑多种荷载的共同作用。这些荷载包括：1.坝体自重（永久荷载）：这是坝体自身材料的重量，是持续不变的荷载。2.坝顶活荷载（如交通荷载）：坝顶可能会受到车辆、行人等交通荷载的作用。3.水压力（水平及竖向）：水库中的水对坝体产生水平方向和竖直方向的压应力。4.地震荷载（水平及竖向）：地震发生时，会对坝体产生水平和竖直方向的地震力作用。5.渗流力（坝体内部渗流产生的力）：坝体内部的水流渗流会产生一定的力，影响坝体的稳定性。综上所述，选项A、B、C、D和E都是土石坝坝体应力分析时需要考虑的荷载。", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335689", "t": 2, "q": "在水利水电工程中，影响混凝土抗冻性的主要因素有（　）", "a": ["混凝土的密实度", "混凝土的含气量", "水泥品种", "骨料的抗冻性", "混凝土的水灰比", ""], "r": "ABCDE", "e": "混凝土抗冻性与密实度、含气量、水灰比、骨料抗冻性及水泥品种等有关，密实度高、含气量适、水灰比小、骨料抗冻性好、合适水泥品种都利于提高抗冻性。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335690", "t": 2, "q": "在结构力学中，水利工程中的超静定结构具有的特性有（　）", "a": ["存在多余约束", "内力计算需同时考虑平衡条件和变形协调条件", "温度变化会产生附加内力", "支座沉降会产生附加内力", "结构的内力分布与构件的刚度比无关", ""], "r": "ABCD", "e": "超静定结构是有多余约束的结构；内力计算要同时满足平衡和变形协调；温度变化、支座沉降等会产生附加内力；其内力分布与构件刚度比有关。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335691", "t": 2, "q": "关于水利工程中钢材力学性能的说法，正确的有（　）", "a": ["钢材的屈服强度是钢材开始发生塑性变形的应力", "钢材的抗拉强度是钢材能承受的最大拉应力", "钢材的伸长率越大，塑性越好", "钢材的冷弯性能反映钢材的塑性和冷加工能力", "钢材的冲击韧性与温度无关，温度降低冲击韧性不变", ""], "r": "ABCD", "e": "屈服强度是钢材开始塑性变形应力，抗拉强度是能承受最大拉应力，伸长率大塑性好，冷弯性能体现塑性和冷加工能力，冲击韧性随温度降低而降低。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335692", "t": 2, "q": "在材料力学中，水利工程中受拉构件的强度计算需考虑的因素有（　）", "a": ["构件的截面面积", "材料的强度设计值", "作用在构件上的拉力设计值", "构件的长度", "构件的截面形状", ""], "r": "ABC", "e": "受拉构件强度计算依据公式，与构件截面面积、材料强度设计值、拉力设计值相关。构件长度和截面形状一般不直接用于受拉构件强度计算。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335693", "t": 2, "q": "水利工程中，影响岩石抗压强度的主要因素有（　）", "a": ["岩石的矿物成分", "岩石的结构构造（如孔隙率、裂隙发育程度）", "加载速率", "试件的尺寸和形状", "加载方向与岩石层理的关系", ""], "r": "ABCDE", "e": "岩石抗压强度受多方面影响，矿物成分决定岩石基本性质；结构构造如孔隙率、裂隙发育程度影响其承载能力；加载速率、试件尺寸形状、加载方向与岩石层理关系都会改变抗压表现。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335694", "t": 2, "q": "关于水利工程中混凝土碳化的说法，正确的有（　）", "a": ["混凝土碳化是指空气中的二氧化碳与混凝土中的氢氧化钙反应", "碳化会使混凝土的pH值降低，导致钢筋锈蚀风险增加", "碳化会提高混凝土的抗压强度", "碳化会降低混凝土的抗拉强度和抗折强度", "混凝土的密实度越高，碳化速度越快", ""], "r": "ABCD", "e": "A选项，混凝土碳化就是空气中CO₂与混凝土中Ca(OH)₂反应；B选项，碳化使pH值降，钢筋易锈蚀；C选项，初期碳化使强度提高；D选项，碳化降低抗拉和抗折强度；E选项，密实度高，碳化慢。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335695", "t": 2, "q": "在结构力学中，水利工程中的梁结构进行内力分析时，需满足的基本平衡条件有（　）", "a": ["水平方向力的平衡（ΣFx=0）", "竖直方向力的平衡（ΣFy=0）", "力矩平衡（ΣM=0）", "变形协调条件（如位移连续）", "截面内力平衡（拉力=压力）", ""], "r": "ABC", "e": "结构内力分析基本平衡条件是力在水平、竖直方向合力为0及力矩平衡。变形协调条件是变形方面条件，不是基本平衡条件；截面内力平衡表述错误。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335696", "t": 2, "q": "水利工程中，选择水泥品种时需考虑的因素有（　）", "a": ["工程所处的环境条件（如温度、湿度、侵蚀性介质）", "工程的施工进度要求（如是否需要早强）", "混凝土的强度等级", "工程的结构类型（如承重结构、防渗结构）", "水泥的生产成本", ""], "r": "ABCD", "e": "选择水泥品种要综合考虑工程环境、施工进度、混凝土强度、工程结构类型等因素，成本一般不是选择水泥品种首要考虑因素。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335697", "t": 2, "q": "在材料力学中，水利工程中圆轴受扭时的力学特性有（　）", "a": ["横截面上的剪应力沿半径呈线性分布，圆心处剪应力为零，边缘处最大", "横截面上的扭矩由剪应力共同承担", "圆轴的抗扭刚度与材料的剪切模量和截面极惯性矩有关", "圆轴扭转变形的大小用扭转角表示，扭转角与扭矩成正比", "圆轴受扭时，横截面始终保持平面，且绕轴线转动", ""], "r": "ABCDE", "e": "圆轴受扭时，横截面上剪应力分布、扭矩承担、抗扭刚度、扭转变形及截面特性等都有相应规律。A 项符合剪应力分布特点；B 项扭矩就是由剪应力共同承担；C 项抗扭刚度公式体现与材料剪切模量和截面极惯性矩有关；D 项扭转角与扭矩成正比；E 项是圆轴受扭基本假设。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335698", "t": 2, "q": "关于水利工程中预应力混凝土结构的优点，说法正确的有（　）", "a": ["提高构件的抗裂性能", "提高构件的刚度", "节约钢材用量", "减小构件的截面尺寸", "提高构件的抗疲劳性能", ""], "r": "ABCDE", "e": "预应力混凝土结构通过预先施加应力，能有效提高抗裂性能，使构件在承受荷载时不易开裂；增加了构件刚度，减少变形；可减少钢筋用量从而节约钢材；能减小构件截面尺寸；还可提高抗疲劳性能。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335699", "t": 2, "q": "水利工程中，影响混凝土和易性的主要因素有（　）", "a": ["水泥浆的用量", "水泥浆的稠度（水灰比）", "骨料的种类和级配", "砂率", "外加剂的种类和掺量", ""], "r": "ABCDE", "e": "水泥浆用量、稠度、骨料种类级配、砂率、外加剂种类掺量都会影响混凝土和易性。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335700", "t": 2, "q": "在结构力学中，水利工程中的静定桁架结构的受力特性有（　）", "a": ["桁架的节点均为铰节点", "桁架的杆件只承受轴力，不承受弯矩和剪力", "桁架的内力计算仅需利用节点平衡条件或截面平衡条件", "桁架的荷载均作用在节点上", "桁架的杆件可以是弯曲的", ""], "r": "ABCD", "e": "静定桁架结构特点：节点为铰节点，荷载作用在节点，杆件只承受轴力，内力计算用节点或截面平衡条件，杆件是直杆非弯曲的。所以ABCD正确，E错误。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094016", "t": 3, "q": "水利水电工程中，钢筋混凝土受弯构件正截面受拉区钢筋的应力计算时，若构件处于适筋梁阶段，可忽略混凝土的抗拉强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "适筋梁破坏时，受拉区混凝土开裂后退出工作，拉力主要由钢筋承担，所以计算受拉区钢筋应力时可忽略混凝土抗拉强度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094017", "t": 3, "q": "在材料力学中，水利水电工程的轴向受压构件（如坝体立柱），其稳定系数φ仅与构件的长细比有关，与材料的强度等级无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稳定系数φ反映了长细比增大时，压杆临界力降低的程度，仅取决于构件长细比，和材料强度等级无直接关联。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094018", "t": 3, "q": "水利水电工程的碾压混凝土，其28d抗压强度设计值通常低于同强度等级常态混凝土的28d抗压强度设计值，因为碾压混凝土的密实度更低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "碾压混凝土密实度并不低，相反其通过振动碾压使混凝土更密实。且一般情况下，碾压混凝土28d抗压强度设计值通常不低于同强度等级常态混凝土。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094019", "t": 3, "q": "在静力学中，水利水电工程的弧形闸门所受水压力的合力方向始终垂直于闸门面板。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094020", "t": 3, "q": "水利水电工程中，混凝土的徐变系数（徐变变形与弹性变形的比值）随时间增长而增大，最终趋于稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程里，混凝土徐变是随时间发展的，开始时徐变增长快，之后变慢，徐变系数随时间增长而增大，最后会趋于稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094021", "t": 3, "q": "结构力学中，水利水电工程的静定刚架结构，其任意截面的内力（弯矩、剪力、轴力）均可仅通过静力平衡条件计算得出，无需考虑变形协调。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "静定结构的内力仅由静力平衡条件就能确定，不需要考虑变形协调。水利水电工程的静定刚架属于静定结构。", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094022", "t": 3, "q": "水利水电工程中，测定混凝土立方体抗压强度时，试件的尺寸越大，测得的抗压强度值越高，因为尺寸越大，试件内部缺陷影响越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在水利水电工程中，测定混凝土立方体抗压强度时，试件尺寸越大，测得的抗压强度值越低。这是因为尺寸越大，试件内部缺陷影响越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094023", "t": 3, "q": "在水利水电工程坝体稳定分析中，瑞典条分法计算的抗滑稳定系数比毕肖普法小，因此瑞典条分法的计算结果更偏于安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "瑞典条分法未考虑条块间作用力，计算的抗滑稳定系数比毕肖普法小，意味着其计算结果更保守，更偏于安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094024", "t": 3, "q": "水利水电工程中，钢筋的屈服强度是指钢筋开始产生塑性变形时的应力，当应力超过屈服强度后，钢筋会发生显著的塑性变形而不立即断裂。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该描述符合钢筋屈服强度的定义及特性，在水利水电工程里，钢筋屈服强度就是钢筋开始塑性变形时的应力，超过此强度会有明显塑性变形且不马上断裂。", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094025", "t": 3, "q": "在流体静力学中，水利水电工程的坝体挡水高度越高，坝基处的水压力强度越大，且水压力强度与挡水高度成反比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据流体静力学，坝基处水压力强度公式为「test/yiwen_img/importSubject/2035637031073353728.png」（「test/yiwen_img/importSubject/2035637031287263232.png」为水密度，g为重力加速度，h为挡水高度），可知水压力强度与挡水高度成正比，并非成反比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094026", "t": 3, "q": "水利水电工程的混凝土重力坝，其坝体应力分析中，坝踵处易产生拉应力，需通过配置钢筋或调整坝体断面形状来控制拉应力不超过允许值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在混凝土重力坝坝体应力分析里，坝踵处确实容易产生拉应力，而控制拉应力不超允许值的常见办法就是配置钢筋或调整坝体断面形状。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094027", "t": 3, "q": "材料力学中，水利水电工程的圆截面轴受扭时，轴的最大切应力发生在轴的横截面边缘处，且切应力沿半径方向呈线性分布。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据材料力学知识，圆截面轴受扭时，最大切应力在横截面边缘处，且切应力沿半径方向是线性分布的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094028", "t": 3, "q": "水利水电工程中，水泥的初凝时间过长会导致混凝土浇筑后早期强度发展缓慢，影响水利水电工程中闸门启闭设备的安装进度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094029", "t": 3, "q": "在结构力学中，水利水电工程的超静定结构，其内力分布与各杆件的刚度比无关，仅与荷载和结构几何尺寸有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超静定结构内力分布与各杆件刚度比有关，并非仅与荷载和结构几何尺寸有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094030", "t": 3, "q": "水利水电工程中，混凝土的抗冻等级F200表示混凝土试件在标准冻融循环试验中，经过200次冻融循环后，其质量损失率不超过5%，强度损失率不超过25%。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程里，混凝土抗冻等级F200就是指在标准冻融循环试验下，混凝土试件经200次冻融循环后，质量损失率不超5%，强度损失率不超25%。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094031", "t": 3, "q": "静力学中，水利水电工程的平面汇交力系平衡的充要条件是:力系中所有力的合力为零，且所有力对任意一点的力矩代数和为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "平面汇交力系平衡的充要条件是力系中所有力的合力为零。而“所有力对任意一点的力矩代数和为零”是平面任意力系平衡的条件，并非平面汇交力系平衡条件。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094032", "t": 3, "q": "水利水电工程中，钢筋混凝土轴心受压构件，当长细比大于17时，需考虑纵向弯曲系数的影响，以降低构件的承载力设计值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程里，钢筋混凝土轴心受压构件，长细比大于 17 时，构件会因纵向弯曲产生附加弯矩，所以要考虑纵向弯曲系数影响并降低承载力设计值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094033", "t": 3, "q": "在水利水电工程材料试验中，测定混凝土黏结强度时，通常采用钢筋-混凝土拔出试验，黏结强度等于拔出力除以钢筋与混凝土的接触面积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程材料试验里，钢筋 - 混凝土拔出试验是测定混凝土黏结强度常用方法，黏结强度计算确实是拔出力除以钢筋与混凝土的接触面积。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094034", "t": 3, "q": "水利水电工程的土石坝，其坝体浸润线以下的土体，由于受到渗流力作用，其有效应力会增大，抗剪强度也随之提高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "坝体浸润线以下的土体受渗流力作用，有效应力会减小而非增大，抗剪强度也会降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094035", "t": 3, "q": "结构力学中，水利水电工程的连续梁在均布荷载作用下，中间支座处的弯矩为负弯矩（上部受拉），跨中处的弯矩为正弯矩（下部受拉）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在结构力学里，水利水电工程连续梁受均布荷载时，中间支座处梁上部受拉、下部受压，对应负弯矩；跨中处梁下部受拉、上部受压，对应正弯矩。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094036", "t": 3, "q": "水利水电工程中，普通硅酸盐水泥的抗渗性优于矿渣硅酸盐水泥，因此在有抗渗要求的水利工程（如防渗墙）中，优先选用普通硅酸盐水泥。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "普通硅酸盐水泥抗渗性好，矿渣硅酸盐水泥抗渗性差，有抗渗要求的水利工程优先选抗渗性好的普通硅酸盐水泥。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094037", "t": 3, "q": "材料力学中，水利水电工程的受弯构件（如渡槽槽身），其截面惯性矩越大，在相同弯矩作用下，截面的最大正应力越小，变形也越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据正应力公式「test/yiwen_img/importSubject/2035637031358566400.png」（W与惯性矩I有关，I越大W越大），I越大正应力越小；根据梁变形公式，I越大变形越小。所以题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094038", "t": 3, "q": "水利水电工程中，混凝土的干缩变形是指混凝土在硬化过程中，由于水分蒸发而产生的体积收缩，干缩变形会导致混凝土产生拉应力，易引发裂缝。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该描述符合水利水电工程中混凝土干缩变形的定义及影响，干缩确实是水分蒸发致体积收缩，会产生拉应力并易引发裂缝。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094039", "t": 3, "q": "在静力学中，水利水电工程的力偶只能与力偶平衡，不能与单个力平衡，因为力偶没有合力，无法与单个力抵消。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "静力学里，力偶性质决定其无合力，只能与力偶平衡来抵消转动效果，不能和单个力平衡。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094040", "t": 3, "q": "水利水电工程的弧形闸门在开启过程中，闸门所受水压力的合力大小随开启角度增大而增大，因为过流面积增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。弧形闸门开启过程中，水压力合力大小与水深等因素有关，一般随开启角度增大，闸门上游水深减小，水压力合力大小是减小的，并非因过流面积增大而增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094041", "t": 3, "q": "结构力学中，水利水电工程的桁架结构，其所有杆件均只承受轴力，不承受弯矩和剪力，因此桁架杆件的截面设计仅需考虑轴力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094042", "t": 3, "q": "水利水电工程中，测定钢筋的冷弯性能时，若钢筋在规定的弯心直径和弯曲角度下，弯曲处无裂纹、断裂或起层，则表明钢筋的冷弯性能合格。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程里，判断钢筋冷弯性能是否合格，就是看在规定弯心直径和弯曲角度下，弯曲处有无裂纹、断裂或起层等情况，无此类问题即合格。", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094043", "t": 3, "q": "在水利水电工程坝基扬压力计算中，扬压力的作用面积是坝基的整个接触面面积，与坝基的透水层分布无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "扬压力作用面积与坝基透水层分布有关，透水层分布会影响扬压力的大小和分布范围。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094044", "t": 3, "q": "材料力学中，水利水电工程的轴向拉压构件，其正应力在横截面上的分布是均匀的，与截面形状无关（如圆形、矩形截面）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在材料力学里，对于轴向拉压构件，横截面上正应力均匀分布，且该分布与截面形状无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094045", "t": 3, "q": "水利水电工程中，混凝土的抗压强度随龄期增长而提高，28d龄期后强度增长缓慢，90d龄期强度通常为28d强度的1.1~1.3倍，因此部分水利工程按90d龄期强度设计。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "题干描述符合水利水电工程中混凝土强度增长规律及实际设计情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094046", "t": 3, "q": "在结构力学中，水利水电工程的静定结构在温度变化作用下，会产生内力和变形，因为温度变化导致结构变形，进而产生约束应力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静定结构无多余约束，温度变化时可自由变形，不会产生约束应力和内力，但会有变形。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094047", "t": 3, "q": "水利水电工程的土石坝，其坝坡稳定分析中，滑裂面的形状通常为圆弧面，因为土石坝坝体为散粒体材料，圆弧滑裂面符合散粒体的破坏特性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "土石坝坝体是散粒体材料，在坝坡稳定分析里，圆弧滑裂面符合其破坏特性，实际中滑裂面形状常为圆弧面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094048", "t": 3, "q": "水利水电工程中，钢筋混凝土受扭构件的承载力计算时，需同时考虑混凝土的抗扭作用和钢筋的抗扭作用，两者共同承担扭矩。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在钢筋混凝土受扭构件承载力计算中，混凝土和钢筋都发挥抗扭作用，二者共同承担扭矩。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094049", "t": 3, "q": "在流体静力学中，水利水电工程的连通器内，若装有同一种静止流体，则连通器内各点的压强相等，与连通器的形状无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "连通器内装同一种静止流体时，只有在同一水平面上的各点压强才相等，并非连通器内所有点压强都相等。", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094050", "t": 3, "q": "水利水电工程中，水泥的安定性是指水泥在凝结硬化过程中，体积变化的均匀性，若安定性不合格，水泥混凝土会产生不均匀体积变形，导致开裂。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水泥安定性就是指水泥在凝结硬化过程中体积变化的均匀性，安定性不合格时，水泥混凝土会因不均匀体积变形而开裂，该描述符合水泥安定性相关知识。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094051", "t": 3, "q": "材料力学中，水利水电工程的梁发生弯曲变形时，梁的中性轴是梁横截面与中性层的交线，中性轴上各点的正应力为零，切应力也为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梁弯曲时，中性轴是梁横截面与中性层交线，中性轴上正应力为零，但切应力不一定为零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094052", "t": 3, "q": "水利水电工程中，混凝土的抗渗等级W10表示混凝土试件在1.0MPa的水压力作用下，24h内不出现渗水现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094053", "t": 3, "q": "在结构力学中，水利水电工程的刚架结构，其结点转角位移方程用于位移法分析，该方程建立了杆端弯矩与结点转角、杆端线位移之间的关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在结构力学的位移法分析里，结点转角位移方程确实建立了杆端弯矩与结点转角、杆端线位移之间的关系，在水利水电工程刚架结构分析中会用到。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094054", "t": 3, "q": "水利水电工程的钢筋混凝土框架结构，在水平荷载作用下，框架柱的反弯点位置随柱的线刚度比增大而升高，随梁的线刚度比增大而降低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094055", "t": 3, "q": "水利水电工程中，土石坝的渗流控制措施（如设置防渗体、排水体）的主要目的是降低坝体浸润线，减小渗流力，提高坝体稳定安全性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程土石坝中，设置防渗体可减少渗流量，设置排水体能使坝体顺利排水，二者都有助于降低坝体浸润线，减小渗流力，进而提高坝体稳定安全性。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第1章 力学基础||第2节 建筑材料和结构的力学性能（2）", "n": "第1章 力学基础 / 第2节 建筑材料和结构的力学性能（2）", "qs": [{"id": "2035637047615688704", "t": 1, "q": "某水利工程中的土石坝，其坝体填土的压实度是控制坝体稳定性的关键指标，下列关于压实度的说法正确的是（　）", "a": ["压实度是填土实际干密度与最大干密度的比值，以百分数表示", "压实度是填土实际湿密度与最大湿密度的比值，以百分数表示", "土石坝坝体填土的压实度要求均不低于95%", "压实度越大，填土的渗透性越大", "", ""], "r": "A", "e": "压实度定义是填土实际干密度与最大干密度比值用百分数表示；B选项湿密度说法错误；不同土石坝压实度要求不同，并非均不低于95%，C错；压实度越大，填土越密实，渗透性越小，D错。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688705", "t": 1, "q": "在结构力学中，水利工程中的静定结构与超静定结构的根本区别是（　）", "a": ["静定结构的内力计算不需要考虑变形协调条件，超静定结构需要", "静定结构的支座反力比超静定结构少", "静定结构的构件数量比超静定结构少", "静定结构的刚度比超静定结构小", "", ""], "r": "A", "e": "静定结构仅用静力平衡方程就能求解内力，无需考虑变形协调条件；超静定结构仅靠静力平衡方程无法求解，需结合变形协调条件。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688706", "t": 1, "q": "某水利工程采用C40混凝土浇筑隧洞衬砌，关于混凝土抗渗等级的选择，下列说法正确的是（　）", "a": ["隧洞衬砌混凝土的抗渗等级应根据隧洞的水头高度确定，水头越高，抗渗等级越低", "C40混凝土的抗渗等级默认不低于P8，无需单独设计", "当隧洞水头大于20m时，混凝土抗渗等级应不低于P10", "混凝土抗渗等级仅与混凝土强度等级有关，与水头无关", "", ""], "r": "C", "e": "隧洞衬砌混凝土抗渗等级与水头高度有关，水头越高抗渗等级应越高，A错误；抗渗等级需依据情况设计，不是默认不低于P8，B错误；抗渗等级不仅和强度等级有关，还与水头有关，D错误；当隧洞水头大于20m时，混凝土抗渗等级应不低于P10，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688707", "t": 1, "q": "在材料力学中，计算水利工程中钢筋混凝土构件的裂缝宽度时，需考虑钢筋的应力，下列关于钢筋应力计算的说法正确的是（　）", "a": ["钢筋应力仅由构件承受的荷载确定，与钢筋直径无关", "钢筋应力与钢筋的配筋率呈正相关，配筋率越高，钢筋应力越大", "受弯构件受拉钢筋应力可通过\"裂缝截面处内力平衡\"计算", "受拉构件钢筋应力与构件的裂缝宽度无关", "", ""], "r": "C", "e": "A选项，钢筋应力与钢筋直径等有关，并非仅由荷载确定；B选项，配筋率越高，钢筋应力越小；D选项，受拉构件钢筋应力与裂缝宽度有关。而受弯构件受拉钢筋应力可通过“裂缝截面处内力平衡”计算。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688708", "t": 1, "q": "某水利工程中的岩石边坡，采用锚杆支护加固，关于锚杆的受力机理，下列说法正确的是（　）", "a": ["锚杆主要通过承受轴向拉力，将边坡表层岩体的拉力传递到深层稳定岩体", "锚杆主要通过承受剪切力，阻止边坡岩体的滑动", "锚杆的抗拔力仅由锚杆与砂浆的黏结力决定", "锚杆的长度越短，其支护效果越好", "", ""], "r": "A", "e": "锚杆主要是承受轴向拉力，把边坡表层不稳定岩体的拉力传递到深层稳定岩体，A正确；锚杆主要承受轴向拉力而非剪切力，B错误；锚杆抗拔力由锚杆与砂浆黏结力、砂浆与岩体黏结力等决定，C错误；锚杆需有一定长度才能有效传递拉力到深层岩体，不是越短越好，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688709", "t": 1, "q": "在结构力学中，水利工程中的刚架结构在水平荷载作用下，其内力分析采用\"位移法\"的关键是（　）", "a": ["以刚架的节点位移（角位移和线位移）为基本未知量", "以刚架的多余未知力为基本未知量", "仅考虑刚架的弯曲变形，忽略轴向变形", "仅考虑刚架的轴向变形，忽略弯曲变形", "", ""], "r": "A", "e": "位移法是以刚架的节点位移（角位移和线位移）为基本未知量来进行内力分析。B选项是以多余未知力为基本未知量是力法；C选项是位移法的基本假定；D选项说法错误。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688710", "t": 1, "q": "某水利工程采用预应力混凝土渡槽，关于预应力钢筋的张拉控制应力σcon，下列说法正确的是（　）", "a": ["σcon取值越高，预应力效果越好，故应尽量取最大值", "σcon应根据预应力钢筋种类确定，且不应超过钢筋屈服强度标准值的80%", "对于消除应力钢丝，σcon不应大于其抗拉强度标准值的75%", "σcon取值与预应力损失无关", "", ""], "r": "C", "e": "张拉控制应力σcon不能随意取最大值，A错误；σcon取值与预应力损失有关，D错误；σcon取值根据预应力钢筋种类确定，且消除应力钢丝、钢绞线的σcon不应大于其抗拉强度标准值的75%，B表述不准确。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688711", "t": 1, "q": "在建筑材料中，水利工程中常用的石灰岩作为混凝土骨料，其抗压强度需满足要求，下列关于骨料抗压强度的说法正确的是（　）", "a": ["骨料的抗压强度用压碎指标表示，压碎指标值越大，骨料强度越高", "混凝土强度等级为C60及以上时，骨料的压碎指标值应不大于10%（碎石）", "骨料的抗压强度无需单独检测，只需检测混凝土的抗压强度", "石灰岩骨料的压碎指标值比花岗岩骨料高", "", ""], "r": "B", "e": "根据对于混凝土骨料抗压强度的相关标准，分析各选项如下：<br />A. 骨料的抗压强度用压碎指标表示，压碎指标值越大，骨料强度越高 <br />压碎指标是衡量骨料抵抗压碎能力的参数，其数值越小，表示骨料抵抗压碎的能力越强，即骨料强度越高 。因此，压碎指标值越大，骨料强度越低，该说法错误。<br />B. 混凝土强度等级为C60及以上时，骨料的压碎指标值应不大于10%（碎石） <br />根据《建设用卵石、碎石》（GB/T 14685-2022）标准，对于混凝土强度等级 ≥ C60 的碎石，其压碎指标值应不大于 10% 。该说法符合标准要求。<br />C. 骨料的抗压强度无需单独检测，只需检测混凝土的抗压强度 <br />骨料作为混凝土的重要组成部分，其强度直接影响混凝土的强度。对于高强度混凝土或重要工程，需要单独检测骨料的强度（如压碎指标或岩石抗压强度），以确保混凝土性能满足要求 。因此，不能完全依赖混凝土抗压强度来替代骨料强度检测。<br />D. 石灰岩骨料的压碎指标值比花岗岩骨料高 <br />骨料的压碎指标值取决于其岩石的矿物组成、密实度、孔隙率等多种因素，不同种类的岩石之间没有固定的压碎指标值高低关系。石灰岩与花岗岩之间，不能简单断言石灰岩的压碎指标值一定比花岗岩高。因此，该说法不准确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688712", "t": 1, "q": "在材料力学中，水利工程中受弯构件的挠度计算，下列说法正确的是（　）", "a": ["挠度计算仅需考虑构件的弯曲变形，无需考虑剪切变形", "对于钢筋混凝土构件，挠度计算需采用\"有效刚度\"，考虑裂缝开展的影响", "构件的挠度与跨度无关，仅与荷载和截面刚度有关", "挠度越大，构件的承载力越低", "", ""], "r": "B", "e": "水利工程受弯构件挠度计算，钢筋混凝土构件因裂缝开展会影响刚度，需用“有效刚度”来计算挠度；A项剪切变形有时需考虑；C项挠度与跨度有关；D项挠度大小和承载力无直接关联。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688713", "t": 1, "q": "水利水电工程中，钢筋混凝土渡槽的槽身作为受弯构件，在进行正常使用极限状态验算时，需控制的变形限值与下列哪项因素的关联性最强", "a": ["槽身混凝土的立方体抗压强度等级", "槽身纵向受力钢筋的屈服强度", "渡槽的跨度及槽内水流设计流速", "槽身混凝土的弹性模量", "", ""], "r": "C", "e": "受弯构件变形与跨度关系密切，跨度越大变形越明显，而槽内水流设计流速会影响槽身受力进而影响变形。其他选项对变形限值影响相对较小。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688714", "t": 1, "q": "某水利水电工程采用喷射混凝土支护地下洞室，为评估喷射混凝土在围岩压力作用下的抗裂性能，需测试其下列哪项力学指标", "a": ["轴心抗拉强度", "抗压强度", "抗折强度", "黏结强度（与围岩接触面）", "", ""], "r": "A", "e": "评估喷射混凝土抗裂性能主要关注其抗拉能力，轴心抗拉强度直接反映材料抵抗拉伸破坏能力，与抗裂性能紧密相关。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688715", "t": 1, "q": "在水利水电工程结构力学分析中，对拱坝进行温度应力计算时，若考虑混凝土的徐变特性，下列说法正确的是", "a": ["徐变会增大拱坝的温度应力，需增大配筋量", "徐变会减小拱坝的温度应力，可降低配筋量", "徐变对温度应力无影响，仅影响永久荷载应力", "徐变仅在温降过程中减小温度应力，温升过程中无影响", "", ""], "r": "B", "e": "混凝土徐变会使拱坝温度应力松弛，从而减小温度应力，这样就可降低配筋量。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688716", "t": 1, "q": "水利水电工程中常用的碾压混凝土，其力学性能指标设计值确定时，需考虑的关键因素不包括", "a": ["碾压层厚度及碾压遍数", "混凝土的龄期（28d或90d）", "骨料的最大粒径", "混凝土的坍落度", "", ""], "r": "D", "e": "碾压混凝土力学性能指标设计值确定主要与龄期、骨料最大粒径等有关，碾压层厚度及碾压遍数影响压实效果等。而坍落度是塑性混凝土指标，碾压混凝土是干硬性混凝土，一般不用坍落度衡量，它不是确定力学性能指标设计值需考虑的关键因素。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688717", "t": 1, "q": "在静力学分析中，水利水电工程的弧形闸门在关闭状态下，闸门面板所受水压力的合力作用点位置计算，需依据的原理是", "a": ["力的平行四边形法则", "力矩平衡原理", "力的投影定理", "帕斯卡定律", "", ""], "r": "B", "e": "计算弧形闸门面板所受水压力合力作用点位置，要使合力对某点的力矩等于各分力对同一点力矩之和，依据的是力矩平衡原理。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688718", "t": 1, "q": "某水利水电工程的钢筋混凝土排架结构，在水平地震作用下，排架柱的控制截面内力计算需采用的力学方法是", "a": ["静力平衡法（忽略结构动力特性）", "底部剪力法（适用于质量和刚度沿高度分布较均匀的结构）", "振型分解反应谱法（考虑多阶振型影响）", "弹性时程分析法（仅用于特别重要的结构）", "", ""], "r": "C", "e": "排架结构质量和刚度沿高度分布不均匀，需考虑多阶振型影响，振型分解反应谱法可满足此要求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688719", "t": 1, "q": "水利水电工程中，评价混凝土抗冻性的指标是抗冻等级（F），其试验方法中，混凝土试件所经历的冻融循环过程是", "a": ["在-15℃冻结4h，在20℃水中融化4h为一个循环", "在-20℃冻结3h，在15℃水中融化3h为一个循环", "在-10℃冻结5h，在25℃水中融化5h为一个循环", "在-25℃冻结2h，在10℃水中融化2h为一个循环", "", ""], "r": "A", "e": "混凝土抗冻性试验时，以在 -15℃ 冻结 4h，在 20℃ 水中融化 4h 为一个冻融循环。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688720", "t": 1, "q": "在材料力学中，水利水电工程的圆形压力管道（如引水隧洞衬砌），在承受内水压力作用时，管道衬砌的环向应力与径向应力的关系是", "a": ["环向应力是径向应力的2倍", "径向应力是环向应力的2倍", "环向应力与径向应力相等", "环向应力与径向应力的比值随管道直径增大而增大", "", ""], "r": "A", "e": "对于承受内水压力的圆形压力管道，环向应力是径向应力的2倍。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688721", "t": 1, "q": "水利水电工程中，混凝土重力坝的坝基扬压力计算时，需考虑的扬压力组成部分是", "a": ["浮托力和渗透压力", "浮托力和静水压力", "渗透压力和动水压力", "静水压力和动水压力", "", ""], "r": "A", "e": "坝基扬压力由浮托力和渗透压力组成。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637047615688722", "t": 1, "q": "在结构力学中，水利水电工程的简支梁式渡槽，其跨中截面的弯矩计算时，若考虑槽内水重、槽身自重和桥面活荷载，下列荷载组合中属于基本组合的是", "a": ["槽身自重+槽内水重（设计值）+桥面活荷载（设计值）", "槽身自重（标准值）+槽内水重（标准值）+桥面活荷载（标准值）", "槽身自重+槽内水重（设计值）+桥面活荷载（标准值）", "槽身自重（设计值）+槽内水重（标准值）+桥面活荷载（设计值）", "", ""], "r": "A", "e": "基本组合应采用荷载设计值进
