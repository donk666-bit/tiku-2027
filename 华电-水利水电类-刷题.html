, false]}, {"id": "2035637075004493838", "t": 1, "q": "某矩形断面明渠，底宽b=3m，水深h=1m，若该明渠的水力半径R=0.6m，则该明渠的湿周χ为（　）", "a": ["4.0m", "5.0m", "6.0m", "7.0m", "", ""], "r": "B", "e": "根据水力半径公式「test/yiwen_img/importSubject/2035637072223670272.png」（A为过流面积，「test/yiwen_img/importSubject/2035637072420802560.png」为湿周），矩形过流面积「test/yiwen_img/importSubject/2035637072525660160.png」，已知R = 0.6m，则「test/yiwen_img/importSubject/2035637072622129152.png」。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493839", "t": 1, "q": "下列关于有压管流中长管和短管的划分依据，正确的是（　）", "a": ["按管道长度划分，长度大于100m为长管，小于100m为短管", "按管道直径划分，直径大于500mm为长管，小于500mm为短管", "按沿程水头损失与局部水头损失的比值划分，沿程损失占比大（如>90%）为长管，局部损失不可忽略为短管", "按管道材质划分，金属管为长管，混凝土管为短管", "", ""], "r": "C", "e": "长管和短管是按沿程水头损失与局部水头损失的比值划分，沿程损失占比大（如>90%）为长管，局部损失不可忽略为短管。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493840", "t": 1, "q": "在渗流场中，等势线与流线的关系是（　）", "a": ["平行", "垂直", "相交但不垂直", "无固定关系", "", ""], "r": "B", "e": "在渗流场中，等势线和流线相互垂直，这是渗流的基本特性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493841", "t": 1, "q": "某流体的动力黏度μ=0.01Pa·s，密度ρ=1000kg/m³，则该流体的运动黏度ν为（　）", "a": ["1.0×10^-5 m²/s", "1.0×10^-4 m²/s", "1.0×10^-3 m²/s", "1.0×10^-2 m²/s", "", ""], "r": "A", "e": "运动黏度ν = 动力黏度μ / 密度ρ，将μ = 0.01Pa·s，ρ = 1000kg/m³代入可得ν = 0.01÷1000 = 1.0×10⁻⁵ m²/s。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493842", "t": 1, "q": "下列关于明渠非均匀流的说法，正确的是（　）", "a": ["明渠非均匀流中，流线一定是曲线", "明渠非均匀流的水力坡度i、水面坡度J和底坡i0三者相等", "明渠非均匀流的流速沿程一定变化", "明渠非均匀流的过水断面面积沿程一定不变", "", ""], "r": "C", "e": "非均匀流中流速沿程改变。A项，流线也可能是直线；B项，非均匀流中i、J、i0通常不相等；D项，过水断面面积可能改变。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493843", "t": 1, "q": "根据静水压强的计算，若某点的相对压强为20kPa，大气压p_a=101.3kPa，则该点的绝对压强为（　）", "a": ["81.3kPa", "101.3kPa", "121.3kPa", "141.3kPa", "", ""], "r": "C", "e": "绝对压强等于相对压强加当地大气压，本题中相对压强20kPa，大气压101.3kPa，绝对压强为20 + 101.3 = 121.3kPa。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493844", "t": 1, "q": "圆管层流中，管内最大流速v_max与平均流速v的关系是（　）", "a": ["v_max=v", "v_max=1.5v", "v_max=2v", "v_max=3v", "", ""], "r": "C", "e": "圆管层流中，最大流速是平均流速的2倍。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493845", "t": 1, "q": "下列关于水跃的说法，错误的是（　）", "a": ["水跃是明渠水流从急流过渡到缓流的局部水力现象", "水跃发生时，水面突然跃起，伴随能量损失", "水跃的跃前水深h'和跃后水深h''满足共轭水深关系", "水跃的能量损失主要来自于沿程水头损失", "", ""], "r": "D", "e": "水跃能量损失主要是局部水头损失，而非沿程水头损失。A、B、C选项关于水跃的描述均正确。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493846", "t": 1, "q": "在有压管流中，若管道末端阀门突然关闭，产生的水击波传播速度c与下列哪个因素成正比（　）", "a": ["管道直径d", "管壁厚度δ", "流体体积弹性模量K", "管道材料弹性模量E", "", ""], "r": "C", "e": "水击波传播速度公式与流体体积弹性模量K相关，且成正比关系。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493847", "t": 1, "q": "某梯形断面明渠，底宽b=5m，水深h=2m，边坡系数m=2，该明渠的水力半径R为（　）", "a": ["0.89m", "1.12m", "1.35m", "1.58m", "", ""], "r": "B", "e": "先求过水断面面积「test/yiwen_img/importSubject/2035637072714403840.png」，湿周「test/yiwen_img/importSubject/2035637072806678528.png」，水力半径「test/yiwen_img/importSubject/2035637072890564608.png」，最接近1.12m。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793280", "t": 2, "q": "下列因素中，会影响流体粘性大小的有（　）", "a": ["流体的种类", "流体的温度", "流体的压力", "流体的流速", "流体的密度", ""], "r": "ABC", "e": "流体粘性与种类有关，不同流体粘性不同；温度对粘性影响大，液体粘性随温度升高降低，气体相反；压力在低压范围对粘性影响极小常忽略。流速和密度不是影响粘性大小因素。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793281", "t": 2, "q": "在明渠均匀流中，满足的条件有（　）", "a": ["水流为定常流动", "水流为均匀流动，断面平均流速沿程不变", "渠道底坡i、粗糙系数n、断面形状和尺寸沿程不变", "水力坡度i、测压管坡度i_p、底坡i_b三者相等", "断面单位能量沿程增大", ""], "r": "ABCD", "e": "明渠均匀流是等深等速的定常流动，断面平均流速沿程不变，且渠道底坡、粗糙系数、断面形状尺寸沿程不变，水力坡度、测压管坡度、底坡三者相等，而断面单位能量沿程不变并非增大。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793282", "t": 2, "q": "下列关于梁的弯曲变形的说法，正确的有（　）", "a": ["梁的弯曲变形大小与梁的抗弯刚度EI（E为弹性模量，I为惯性矩）成反比", "梁的弯曲变形大小与梁所受的荷载大小成正比", "简支梁在跨中集中力作用下，跨中挠度（最大挠度）与跨度L的三次方成正比", "梁的弯曲变形是指梁的轴线由直线变为曲线的变形", "梁的抗弯刚度EI越大，梁的弯曲变形越大", ""], "r": "ABCD", "e": "梁的弯曲变形是结构力学中的一个重要概念，涉及到梁在受到外力作用时的变形行为。我们可以根据基本的力学原理来分析这些选项。A选项：梁的弯曲变形大小实际上与梁的抗弯刚度EI成反比。抗弯刚度EI越大，梁抵抗弯曲变形的能力越强，因此变形越小。这个说法是正确的。B选项：梁的弯曲变形大小与梁所受的荷载大小成正比。更准确地说，是与荷载产生的弯矩成正比。在简单情况下，荷载越大，产生的弯矩通常也越大，从而导致更大的弯曲变形。这个说法在基本层面上是正确的。C选项：简支梁在跨中集中力作用下，其跨中挠度（最大挠度）与跨度L的三次方成正比。这是梁理论中的一个经典结论，用于描述简支梁在集中力作用下的挠度行为。这个说法是正确的。D选项：梁的弯曲变形确实是指梁的轴线由直线变为曲线的变形。这是弯曲变形的基本定义。这个说法也是正确的。E选项：梁的抗弯刚度EI越大，梁的弯曲变形越大。这与A选项相矛盾。实际上，抗弯刚度EI越大，梁的弯曲变形应该越小。因此，这个说法是错误的。综上所述，正确的选项是A、B、C和D。所以，答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793283", "t": 2, "q": "下列关于管流局部水头损失的说法，正确的有（　）", "a": ["局部水头损失是由于流体在局部区域（如阀门、弯头）流动方向或断面尺寸突变，产生漩涡和撞击引起的", "局部水头损失的计算式通常为h_j=ζv²/(2g)，其中ζ为局部阻力系数", "同一局部构件（如标准90°弯头）的局部阻力系数ζ为定值，与流速无关", "当流体从小管流入大管时，局部阻力系数ζ的取值与小管和大管的流速比有关", "局部水头损失在长管计算中通常可忽略不计", ""], "r": "ABDE", "e": "A是局部水头损失产生原因；B是常用计算式；C局部阻力系数与雷诺数和管件形状有关，不是定值；D流体从小管流入大管，ζ取值和流速比有关；E长管中局部水头损失相对沿程损失小，通常可忽略。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793284", "t": 2, "q": "下列关于流体静压力的计算，正确的有（　）", "a": ["静止液体中某点的静压力p=p_0+ρgh，其中p_0为液面大气压力，h为该点淹没深度", "当液面与大气接触时，液面处的静压力p_0等于大气压力p_a", "静止液体中同一水平面上各点的静压力相等", "静止液体中不同深度的两点，深度大的点静压力一定大（液面压力相同）", "静止气体中某点的静压力随深度的变化规律与液体相同，均为线性变化", ""], "r": "ABCD", "e": "A选项是静止液体某点静压力计算公式；B选项液面与大气接触时静压力就是大气压力；C选项静止液体同一水平面上各点压强相等符合原理；D选项液面压力相同，深度大静压力大；而气体密度随高度等变化，静压力随深度变化规律与液体不同，E错误。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793285", "t": 2, "q": "下列关于轴向拉压杆的应力与变形的说法，正确的有（　）", "a": ["轴向拉压杆的横截面上只有正应力，没有剪应力", "轴向拉压杆的正应力沿横截面均匀分布", "轴向拉压杆的轴向变形Δl与杆长l成正比，与横截面面积A成反比", "轴向拉压杆的横向变形（如直径变化）与轴向变形的比值称为泊松比μ", "当轴向拉压杆的正应力不超过材料的比例极限时，应力与应变成正比（胡克定律）", ""], "r": "ABCE", "e": "轴向拉压杆横截面上只有正应力无剪应力且正应力均匀分布；轴向变形与杆长成正比、与横截面面积成反比；泊松比是横向应变与轴向应变比值；正应力不超比例极限时应力与应变成正比。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793286", "t": 2, "q": "下列关于伯努利方程应用的说法，正确的有（　）", "a": ["应用伯努利方程时，需选择两个过流断面，且两断面均为缓变流断面", "应用伯努利方程时，两断面的计算基准面必须选择同一水平面", "伯努利方程中的位置水头z是指过流断面形心到基准面的垂直距离", "对于实际流体，应用伯努利方程时需在两断面间加入沿程水头损失和局部水头损失", "伯努利方程中的总水头H=z+p/(ρg)+v²/(2g)，对于理想流体定常流动，沿流线总水头守恒", ""], "r": "ABCDE", "e": "伯努利方程应用时，选两缓变流断面，基准面要统一，位置水头是形心到基准面垂直距离，实际流体有损失，理想流体定常流沿流线总水头守恒。答案：ABCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793287", "t": 2, "q": "下列关于明渠急流与缓流的判别方法，正确的有（　）", "a": ["弗劳德数Fr>1为急流，Fr<1为缓流", "临界水深h_k，实际水深h<h_k为急流，h>h_k为缓流", "临界底坡i_k，实际底坡i>i_k为急流，i<i_k为缓流", "水面线比降J>底坡i为急流，J<i为缓流", "用手轻拨水面，扰动波向下游传播为急流，向上游传播为缓流", ""], "r": "ABCE", "e": "弗劳德数Fr>1、实际水深h<h_k、实际底坡i>i_k时水流为急流；反之Fr<1、h>h_k、i<i_k 时为缓流；扰动波只能向下游传播是急流，能向上游传播是缓流。水面线比降J与底坡i关系不是判别急流缓流依据。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793288", "t": 2, "q": "下列关于流动阻力的说法，正确的有（　）", "a": ["流动阻力按产生原因分为沿程阻力和局部阻力", "沿程阻力主要由流体的粘性引起，沿流程均匀分布", "局部阻力主要由流体流动的边界条件突变引起，集中发生在局部区域", "沿程水头损失h_f与流程长度l成正比，局部水头损失h_j与局部构件的类型有关", "流动阻力的大小仅与流体的粘性有关，与流速无关", ""], "r": "ABCD", "e": "流动阻力分沿程和局部阻力，沿程由粘性引起且均匀分布，局部因边界突变集中在局部区域，沿程水头损失与流程长度成正比，局部水头损失和构件类型有关，而流动阻力与流体粘性、流速等都有关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793289", "t": 2, "q": "下列关于平面图形几何性质的说法，正确的有（　）", "a": ["形心是平面图形的几何中心，形心的位置与图形的形状和尺寸有关", "平面图形对通过形心的轴的静矩为零", "惯性矩是衡量平面图形抵抗弯曲变形能力的几何参数，惯性矩越大，抵抗弯曲变形能力越强", "平行移轴公式中，平面图形对任意轴的惯性矩等于对通过形心的平行轴的惯性矩加上图形面积与两轴距离平方的乘积", "静矩是衡量平面图形形心位置的几何参数，静矩为零的轴必通过形心", ""], "r": "ABCDE", "e": "本题可根据平面图形几何性质的相关概念来逐一判断选项。 选项A：形心是平面图形的几何中心，其位置确实由图形的形状和尺寸决定，该选项正确。 选项B：根据静矩的定义和性质，平面图形对通过形心的轴的静矩为零，该选项正确。 选项C：惯性矩反映了平面图形抵抗弯曲变形的能力，惯性矩越大，抵抗弯曲变形的能力越强，该选项正确。 选项D：平行移轴公式描述的就是平面图形对任意轴的惯性矩等于对通过形心的平行轴的惯性矩加上图形面积与两轴距离平方的乘积，该选项正确。 选项E：静矩与形心位置相关，静矩为零的轴一定通过形心，该选项正确。综上，答案是ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793290", "t": 2, "q": "下列关于水击现象的说法，正确的有（　）", "a": ["水击现象是由于流体的惯性和压缩性引起的", "水击波在管道中的传播速度c与流体的弹性模量E、管道的弹性模量E_p、管道内径d、管壁厚度δ有关", "阀门关闭时间越短，水击压强越大", "减少管道长度、增大管道直径可以减小水击压强", "安装调压塔是消除水击现象的有效措施之一", ""], "r": "ABCDE", "e": "水击现象由流体惯性和压缩性引发；水击波传播速度与流体和管道弹性模量、管径、壁厚等有关；阀门关闭越快，水击压强越大；减小管长、增大管径可减小水击压强；安装调压塔能有效消除水击。答案：ABCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793291", "t": 2, "q": "下列关于孔口与管嘴出流的说法，正确的有（　）", "a": ["孔口出流的流量系数μ小于管嘴出流的流量系数μ_n（相同作用水头下）", "圆柱形外管嘴出流的正常工作条件是作用水头H_0≤9m（水）", "管嘴出流由于存在真空区，使得出流能力比同条件下的孔口大", "孔口与管嘴出流的流量均与作用水头的平方根成正比", "当孔口的作用水头一定时，孔口面积越大，出流流量越大", ""], "r": "ABCDE", "e": "相同作用水头下，孔口流量系数小于管嘴；圆柱形外管嘴正常工作条件是作用水头H₀≤9m；管嘴有真空区使出流能力比孔口大；孔口和管嘴流量公式都表明流量与作用水头平方根成正比；孔口流量公式Q = μA√(2gH₀)，作用水头一定，面积越大流量越大。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793292", "t": 2, "q": "下列关于粘性流体边界层的说法，正确的有（　）", "a": ["边界层是指流体绕流物体时，在物体表面附近粘性力起主导作用的薄层区域", "边界层内的流体流动可分为层流边界层和紊流边界层", "边界层的厚度随流动方向逐渐增大", "边界层分离会导致物体前后产生压力差，从而产生压差阻力", "对于平板层流边界层，边界层厚度δ与来流速度v的平方根成反比", ""], "r": "ABCDE", "e": "A选项符合边界层定义；B选项边界层内流动有层流和紊流两种；C选项边界层厚度沿流动方向通常增大；D选项边界层分离会造成压差阻力；E选项平板层流边界层厚度δ与来流速度v平方根成反比。各选项均正确。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793293", "t": 2, "q": "下列关于梁的剪力与弯矩的说法，正确的有（　）", "a": ["梁的剪力Q是截面一侧所有横向外力在该截面法线方向上的投影代数和", "梁的弯矩M是截面一侧所有外力对该截面形心的力矩代数和", "剪力与弯矩的微分关系为dQ/dx=-q（q为分布荷载集度，x为梁轴方向）", "剪力与弯矩的微分关系为dM/dx=Q", "当梁的某段无分布荷载（q=0）时，该段的剪力Q为常数，弯矩M为线性函数", ""], "r": "BCDE", "e": "A选项，梁的剪力Q是截面一侧所有横向外力在该截面切线方向投影代数和，A错；B选项说法正确；C选项，剪力与弯矩的微分关系中dQ/dx=-q ，这里q为分布荷载集度，x为梁轴方向，C正确；D选项，dM/dx = Q表述正确；E选项，当梁某段无分布荷载（q = 0）时，由dQ/dx=-q可知Q为常数，再由dM/dx = Q，可知M为线性函数，E正确。答案：BCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793294", "t": 2, "q": "下列关于流体运动参数的说法，正确的有（　）", "a": ["流速v是描述流体运动快慢和方向的矢量", "加速度a是流速对时间的导数，包括当地加速度和迁移加速度", "流线是流场中某一瞬时的曲线，曲线上各点的流速方向与曲线切线方向一致", "迹线是流体质点在运动过程中所走过的轨迹", "定常流动中，流线的形状不随时间变化，且与迹线重合", ""], "r": "ABCDE", "e": "本题可根据流体运动参数的相关概念来判断各选项的正误。 A选项：流速是描述流体运动快慢和方向的物理量，具有大小和方向，是矢量，该选项正确。 B选项：加速度是流速对时间的导数，分为当地加速度（由于流场中速度随时间变化而引起的加速度）和迁移加速度（由于流场中速度随空间位置变化而引起的加速度），该选项正确。 C选项：流线是流场中某一瞬时的曲线，曲线上各点的流速方向与曲线切线方向一致，它能形象地描绘出流体在该时刻的流动情况，该选项正确。 D选项：迹线是流体质点在运动过程中所走过的轨迹，反映了单个质点的运动路径，该选项正确。 E选项：在定常流动中，流场中各点的流速不随时间变化，所以流线的形状不随时间变化，且此时流线与迹线重合，该选项正确。综上，答案为ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793295", "t": 2, "q": "下列关于明渠水面线的说法，正确的有（　）", "a": ["明渠非均匀流的水面线按渠道底坡类型（顺坡、平坡、逆坡）和水流状态（急流、缓流）分类", "顺坡渠道（i>0）中可能出现a、b、c三种类型的水面线", "平坡渠道（i=0）和逆坡渠道（i<0）中，急流状态的水面线均为降水曲线", "缓流状态下，水面线的变化趋势与底坡变化趋势相同（顺坡渠道水面线沿程降低）", "急流状态下，水面线的变化趋势与底坡变化趋势相反（顺坡渠道水面线沿程升高）", ""], "r": "ABCDE", "e": "明渠非均匀流按底坡及水流状态分类；顺坡渠道存在a、b、c三类水面线；平坡和逆坡渠道急流是降水曲线；缓流时水面线与底坡趋势同，急流相反。答案：ABCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793296", "t": 2, "q": "下列关于材料力学中\"应力\"的说法，正确的有（　）", "a": ["应力是表征物体内部受力状态的物理量，分为正应力和剪应力", "正应力σ是垂直于截面的应力，使物体产生伸长或缩短变形", "剪应力τ是平行于截面的应力，使物体产生剪切变形", "应力的单位是帕斯卡（Pa），1Pa=1N/m²", "物体内某点的应力状态由该点不同方向截面上的正应力和剪应力共同确定", ""], "r": "ABCDE", "e": "应力是描述物体内部受力状态的，分正应力和剪应力，正应力垂直截面致伸缩变形，剪应力平行截面致剪切变形，单位是帕斯卡，物体内某点应力状态由不同方向截面上正应力和剪应力共同确定。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793297", "t": 2, "q": "下列关于管流雷诺数的说法，正确的有（　）", "a": ["雷诺数Re是无量纲数，用于判断流体流动的状态（层流或紊流）", "圆管内流体流动的临界雷诺数Re_cr≈2300，Re<Re_cr为层流，Re>Re_cr为紊流", "雷诺数Re的表达式为Re=vd/ν，其中v为平均流速，d为管径，ν为运动粘度", "对于非圆管，雷诺数计算中需用当量直径d_e代替管径d，d_e=4A/χ（A为断面面积，χ为湿周）", "雷诺数反映了流体流动中惯性力与粘性力的比值，Re越大，惯性力相对越大", ""], "r": "ABCDE", "e": "雷诺数是无量纲数，用于判别流态，表达式是Re = vd/ν，圆管临界雷诺数约2300，非圆管计算用当量直径，它反映惯性力与粘性力比值，Re越大惯性力相对越大。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793298", "t": 2, "q": "下列关于流体浮力的说法，正确的有（　）", "a": ["浮力是静止流体对浸没或漂浮物体的作用力，方向竖直向上", "浮力的大小等于物体所排开流体的重量（阿基米德原理）", "物体在流体中漂浮时，浮力等于物体的重量，且物体排开流体的重量等于物体重量", "物体在流体中悬浮时，浮力等于物体的重量，物体的密度等于流体的密度", "物体在流体中沉底时，浮力小于物体的重量，物体的密度大于流体的密度", ""], "r": "ABCDE", "e": "本题可依据浮力的定义、阿基米德原理以及物体在流体中的不同状态下浮力与重力等的关系来判断各说法是否正确。 选项A：浮力是指浸在液体或气体里的物体受到液体或气体竖直向上托的力，也就是静止流体对浸没或漂浮物体的作用力，方向竖直向上，该说法正确。 选项B：阿基米德原理指出，浸在液体中的物体受到向上的浮力，浮力的大小等于物体排开液体所受的重力，该说法正确。 选项C：物体漂浮时，处于平衡状态，此时浮力等于物体的重力，根据阿基米德原理，浮力等于物体排开流体的重量，所以物体排开流体的重量等于物体重量，该说法正确。 选项D：物体悬浮时，同样处于平衡状态，浮力等于物体的重力；且此时物体完全浸没，排开液体的体积等于物体的体积，结合浮力公式和重力公式可推出物体的密度等于流体的密度，该说法正确。 选项E：物体沉底时，受到重力、浮力和底面的支持力，物体静止处于平衡状态，重力等于浮力与支持力之和，所以浮力小于物体的重力；物体下沉说明重力大于浮力，结合阿基米德原理可推出物体的密度大于流体的密度，该说法正确。综上，ABCDE选项的说法均正确。故答案为ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793299", "t": 2, "q": "下列关于明渠均匀流水力计算的说法，正确的有（　）", "a": ["明渠均匀流的水力计算主要包括流量计算、断面尺寸设计、底坡确定等", "已知渠道断面尺寸、底坡、粗糙系数，求流量时，需先计算水力半径R，再用曼宁公式求流速v，最后求流量Q=Av", "已知流量、底坡、粗糙系数，设计渠道断面尺寸时，需先确定断面形状，再通过曼宁公式联立求解断面尺寸（如矩形渠道的宽b和水深h）", "明渠均匀流的水力最优断面是指在给定流量、底坡、粗糙系数条件下，断面面积A最小的断面", "矩形渠道的水力最优断面满足b=2h（b为渠宽，h为水深）", ""], "r": "ABCDE", "e": "明渠均匀流水力计算涵盖流量、断面尺寸、底坡等计算。求流量按先算水力半径、再用曼宁求流速、最后算流量步骤；设计断面尺寸要先定形状再联立求解；水力最优断面是面积最小的断面，矩形渠道水力最优时b = 2h。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793300", "t": 2, "q": "下列关于轴向拉压杆强度条件的说法，正确的有（　）", "a": ["轴向拉压杆的强度条件为σ_max=F_max/A≤[σ]，其中F_max为最大轴力，A为横截面面积，[σ]为许用应力", "许用应力[σ]等于材料的极限应力σ_u除以安全系数n，即[σ]=σ_u/n", "对于塑性材料，极限应力通常取屈服强度σ_s;对于脆性材料，极限应力通常取强度极限σ_b", "根据强度条件，可以进行强度校核、截面设计和确定许用荷载", "当轴向拉压杆的正应力σ_max超过许用应力[σ]时，构件会发生强度破坏", ""], "r": "ABCDE", "e": "各项都符合轴向拉压杆强度条件相关知识。A是强度条件公式；B说明了许用应力计算方式；C区分了塑性和脆性材料极限应力取值；D是强度条件的应用；E指出超许用应力会强度破坏。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793301", "t": 2, "q": "下列关于流体定常流动的说法，正确的有（　）", "a": ["定常流动中，流场中各点的流速、压力、密度等运动参数不随时间变化", "定常流动中，流体质点的速度可能随位置变化", "定常流动的流线形状不随时间变化", "定常流动的迹线与流线重合", "实际工程中，当流体运动参数随时间变化缓慢时，可近似按定常流动处理", ""], "r": "ABCDE", "e": "定常流动是流场中各点运动参数不随时间变，但可随位置变，其流线形状不变且迹线与流线重合，实际中参数随时间变化慢时可近似按定常处理。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793302", "t": 2, "q": "下列关于梁的弯曲正应力的说法，正确的有（　）", "a": ["梁的弯曲正应力沿截面高度呈线性分布，最大值出现在截面的上下边缘处", "梁的弯曲正应力公式为σ=M y/I_z，其中M为截面上的弯矩，y为该点到中性轴的距离，I_z为截面对中性轴的惯性矩", "中性轴是梁截面的形心轴，也是弯曲正应力为零的轴", "梁的弯曲正应力的正负号规定:使梁下部受拉的正应力为正，上部受拉的正应力为负", "梁的最大弯曲正应力发生在弯矩最大的截面，且在该截面的上下边缘处", ""], "r": "ABCDE", "e": "梁弯曲正应力沿截面高度线性分布，边缘最大，公式为σ = M y / I_z ，中性轴是形心轴且正应力为零，最大正应力在弯矩最大截面边缘，正应力使下部受拉为正上部受拉为负。各选项都正确。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793303", "t": 2, "q": "下列关于管流沿程水头损失的说法，正确的有（　）", "a": ["沿程水头损失是由于流体的粘性在流动过程中产生的能量损失，沿流程均匀分布", "沿程水头损失的计算式为h_f=λ(l/d)(v²/(2g))，其中λ为沿程阻力系数", "沿程阻力系数λ与流体的雷诺数Re和管道的相对粗糙度Δ/d有关", "对于层流流动，λ仅与Re有关，与Δ/d无关，λ=64/Re", "对于紊流流动，λ与Re和Δ/d均有关，需通过莫迪图或经验公式确定", ""], "r": "ABCDE", "e": "沿程水头损失因流体粘性产生且沿流程均匀分布，其计算式是h_f=λ(l/d)(v²/(2g)) ，沿程阻力系数λ受雷诺数Re和相对粗糙度Δ/d影响，层流时λ仅与Re有关为64/Re ，紊流时λ与二者都有关，通过莫迪图或经验公式确定。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793304", "t": 2, "q": "下列关于明渠非均匀流的说法，正确的有（　）", "a": ["明渠非均匀流的断面平均流速和水深沿程变化", "明渠非均匀流的水面线是曲线，不平行于渠底", "明渠非均匀流的水力坡度i不等于底坡i_b", "明渠非均匀流的断面单位能量沿程变化", "明渠非均匀流的产生原因包括渠道断面尺寸变化、底坡变化、粗糙系数变化或建筑物干扰等", ""], "r": "ABCDE", "e": "非均匀流流速、水深沿程变，水面线不平行渠底，水力坡度和底坡不同，断面单位能量也沿程变，多种因素会导致其产生。答案：ABCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793305", "t": 2, "q": "下列关于流体压缩性的说法，正确的有（　）", "a": ["流体的压缩性是指流体在压力作用下体积缩小的性质", "液体的压缩性很小，工程上大多数液体流动可视为不可压缩流动", "气体的压缩性很大，通常需按可压缩流动处理，但当流速远小于声速时（如v<0.3c），可近似按不可压缩流动处理", "体积压缩系数β的定义为β=-ΔV/(VΔp)，负号表示压力增大时体积减小", "体积弹性模量K是体积压缩系数的倒数，K=1/β，K越大，流体越不容易压缩", ""], "r": "ABCDE", "e": "A项准确描述了流体压缩性定义；B项液体压缩性小，多数工程液体流动可视为不可压缩；C项气体压缩性大，流速远小于声速时可近似按不可压缩处理；D项体积压缩系数定义正确；E项体积弹性模量与压缩系数关系及特性表述正确。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793306", "t": 2, "q": "下列关于梁的剪应力的说法，正确的有（　）", "a": ["梁的剪应力沿截面高度的分布规律与截面形状有关", "矩形截面梁的剪应力沿高度呈抛物线分布，最大值出现在截面的形心处", "工字形截面梁的剪应力主要分布在腹板上，翼缘上的剪应力很小，可忽略不计", "梁的剪应力公式τ=Q S_z/(I_z b)，其中Q为截面上的剪力，S_z为所求点到截面边缘的部分面积对中性轴的静矩，I_z为惯性矩，b为所求点处的截面宽度", "梁的最大剪应力通常发生在剪力最大的截面，且在该截面的形心处（矩形、工字形等截面）", ""], "r": "ABCDE", "e": "梁剪应力分布与截面形状相关；矩形截面剪应力沿高度抛物线分布，形心处最大；工字形截面剪应力主要在腹板，翼缘可忽略；剪应力公式表述正确；常见截面最大剪应力在剪力最大截面形心处。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793307", "t": 2, "q": "下列关于孔口出流的说法，正确的有（　）", "a": ["孔口出流按孔口直径d与作用水头H的比值分为大孔口（d/H>0.1）和小孔口（d/H≤0.1）", "小孔口出流可近似认为孔口断面上各点的作用水头相等", "孔口出流按水流是否与大气接触分为自由出流和淹没出流", "自由出流的作用水头H是指孔口中心到下游水面的垂直距离", "淹没出流的作用水头H是指上下游水面的垂直距离", ""], "r": "ABCE", "e": "A选项对孔口大小划分正确；B选项小孔口因尺寸小，可近似认为孔口断面上各点作用水头相等；C选项孔口出流按与大气接触情况分类正确；D选项自由出流作用水头是指孔口中心到上游水面垂直距离，该选项错误；E选项淹没出流作用水头是上下游水面垂直距离正确。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793308", "t": 2, "q": "下列关于流动相似准则的说法，正确的有（　）", "a": ["雷诺准则（Re准则）用于判断粘性力起主导作用的流动相似", "弗劳德准则（Fr准则）用于判断重力起主导作用的流动相似（如明渠流、波浪运动）", "欧拉准则（Eu准则）用于判断压力起主导作用的流动相似", "对于原型和模型流动，若满足主要作用力的相似准则，则流动相似", "在模型试验中，需根据流动的主导作用力选择相应的相似准则", ""], "r": "ABCDE", "e": "ABCD 选项分别阐述了雷诺、弗劳德、欧拉准则适用情况及满足主要作用力相似则流动相似，均正确；E选项模型试验按主导作用力选相似准则也正确。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027520", "t": 3, "q": "理想流体是指不考虑粘性的流体，其粘性系数为零，在流动过程中不会产生能量损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "理想流体定义就是不考虑粘性，粘性系数为零，因无粘性，流动时不会因粘性产生能量损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027521", "t": 3, "q": "明渠均匀流的断面单位能量沿程逐渐减小，因为水流克服阻力消耗能量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "明渠均匀流中，水深、断面平均流速等沿程不变，断面单位能量也沿程不变。而水流克服阻力消耗的能量体现在水头损失上，并非使断面单位能量减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027522", "t": 3, "q": "轴向拉压杆的横截面上，正应力沿截面均匀分布，与截面形状无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据轴向拉压杆正应力公式，在轴向拉压情况下，横截面上正应力均匀分布，且计算式中未涉及截面形状因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027523", "t": 3, "q": "圆管内流体流动中，雷诺数Re=1500时，流动状态为紊流，因为圆管的临界雷诺数为2300，Re>2300才为紊流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "圆管内流体流动中，当雷诺数小于临界雷诺数时为层流，已知临界雷诺数是2300，本题中Re = 1500＜2300，应为层流，并非紊流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027524", "t": 3, "q": "流体静压力的方向总是垂直于作用面的外法线方向，指向作用面外部。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流体静压力方向垂直于作用面，且指向作用面内部，而不是外部。", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027525", "t": 3, "q": "梁的弯曲正应力最大值出现在弯矩最大的截面，且该截面的上下边缘处，因为此处到中性轴的距离最大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梁弯曲正应力公式表明正应力与弯矩和到中性轴距离成正比，弯矩最大截面上下边缘到中性轴距离最大，正应力最大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027526", "t": 3, "q": "管流的局部水头损失仅与局部构件的类型有关，与流体的流速无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "管流局部水头损失不仅与局部构件类型有关，还和流体流速有关，其计算公式中包含流速的平方项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027527", "t": 3, "q": "明渠急流的弗劳德数Fr>1，此时水流的惯性力大于重力，扰动波只能向下游传播。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "弗劳德数Fr是惯性力与重力的比值，Fr>1时惯性力大于重力，明渠急流中扰动波只能向下游传播。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027528", "t": 3, "q": "平面图形对某轴的静矩为零，则该轴一定是图形的形心轴，反之，图形对形心轴的静矩也为零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据静矩和形心轴的定义，平面图形对某轴静矩为零的充要条件是该轴通过图形形心，即此轴为形心轴。所以题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027529", "t": 3, "q": "实际流体的伯努利方程中，总水头沿流线逐渐减小，因为存在粘性引起的水头损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "实际流体有粘性，流动中会因粘性产生能量损耗，总水头是机械能总和，能量损耗使总水头沿流线减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027530", "t": 3, "q": "水击现象是由于流体的惯性引起的，与流体的压缩性无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水击现象不仅与流体惯性有关，还和流体的压缩性相关，流体压缩性是水击过程中能量转换等情况的重要因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027531", "t": 3, "q": "轴向拉压杆的泊松比μ是横向变形Δb与轴向变形Δl的比值，其值为正。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "泊松比μ是横向正应变与轴向正应变的绝对值之比，横向应变与轴向应变符号相反，所以μ为正，但不是横向变形Δb与轴向变形Δl的比值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027532", "t": 3, "q": "明渠均匀流的水力坡度i、测压管坡度i_p和底坡i_b三者相等，这是明渠均匀流的重要特征。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在明渠均匀流中，水流作等速直线运动，流速沿程不变，动水压强按静水压强分布，所以水力坡度、测压管坡度和底坡三者相等，这是明渠均匀流的重要特征。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027533", "t": 3, "q": "流体的粘性随温度升高而增大，因为温度升高会增强分子间的相互作用力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流体分液体和气体，液体粘性随温度升高而减小，是因为温度升高使分子间距增大，分子间引力减小；气体粘性随温度升高而增大，是因为温度升高分子热运动加剧。题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027534", "t": 3, "q": "梁的剪力图在集中力作用点处发生突变，突变值等于该集中力的大小;弯矩图在集中力作用点处发生转折。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据梁的内力图规律，在集中力作用处，剪力图有突变，突变值等于集中力大小，弯矩图会转折。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027535", "t": 3, "q": "管流的沿程阻力系数λ仅与雷诺数Re有关，与管道的粗糙度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "管流沿程阻力系数λ不仅与雷诺数Re有关，在不同流态下，还与管道粗糙度有关。如紊流粗糙区，λ主要取决于相对粗糙度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027536", "t": 3, "q": "物体在流体中漂浮时，所受浮力等于物体的重量，且物体排开流体的体积等于物体的体积。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物体漂浮时，所受浮力等于物体重力，这没错，但漂浮时物体部分体积浸入流体，排开流体体积小于物体体积。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027537", "t": 3, "q": "定常流动中，流体质点的加速度为零，因为流场中各点的流速不随时间变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。定常流动是指流场中各点的流速不随时间变化，但流体质点在流动过程中，其速度大小和方向可能因位置变化而改变，会有加速度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027538", "t": 3, "q": "平面图形的惯性矩越大，其抵抗弯曲变形的能力越强，因为惯性矩是衡量截面抗弯曲能力的几何参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "惯性矩是衡量截面抵抗弯曲变形能力的几何参数，惯性矩越大，截面对弯曲变形的抵抗能力就越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027539", "t": 3, "q": "孔口淹没出流的流量比同作用水头下的自由出流流量大，因为淹没出流的作用水头更大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "孔口淹没出流和自由出流流量计算公式形式相同，流量系数也近似，同作用水头下二者流量基本相等，并非淹没出流流量大，且二者作用水头是相同的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027540", "t": 3, "q": "粘性流体绕流物体时，边界层分离只发生在紊流边界层中，层流边界层不会发生分离。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "粘性流体绕流物体时，层流和紊流边界层都可能发生分离。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027541", "t": 3, "q": "轴向拉压杆的强度条件不仅可以校核构件的强度，还可以用于设计构件的截面尺寸和确定构件的许用荷载。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴向拉压杆强度条件为应力不超许用应力，基于此可通过应力与荷载、截面尺寸关系，进行强度校核、设计截面尺寸和确定许用荷载。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027542", "t": 3, "q": "明渠平坡渠道（i=0）中可以产生均匀流，因为只要断面尺寸和粗糙系数不变，即可形成均匀流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "明渠均匀流的产生条件之一是渠道底坡为正坡（i>0），平坡渠道（i = 0）无法形成均匀流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027543", "t": 3, "q": "流体的体积弹性模量K越大，表明流体越容易被压缩，因为K是体积压缩系数β的倒数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流体的体积弹性模量K是体积压缩系数β的倒数，K越大，β越小，意味着流体越难被压缩，而不是越容易被压缩。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027544", "t": 3, "q": "梁的最大剪应力通常发生在剪力最大的截面，且该截面的形心处，对于矩形、工字形等常见截面均如此。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梁的最大剪应力通常发生在剪力最大的截面，且对于矩形、工字形等常见截面，最大剪应力确实在该截面形心处。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027545", "t": 3, "q": "管流的雷诺数Re用于判断流动的相似性，弗劳德数Fr用于判断流动的状态（层流或紊流）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "雷诺数Re用于判断管流流动状态（层流或紊流），弗劳德数Fr用于判断具有自由液面流动的重力相似性。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027546", "t": 3, "q": "静止液体中，任意两点的静压力差等于两点间的深度差与液体密度、重力加速度的乘积，即Δp=ρgΔh。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是静止液体静压力差的基本公式，由静压力基本方程推导而来。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027547", "t": 3, "q": "材料的弹性模量E越大，表明材料在相同应力作用下产生的应变越小，材料越不容易变形。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据胡克定律「test/yiwen_img/importSubject/2035637073008005120.png」（「test/yiwen_img/importSubject/2035637073104474112.png」是应力，E是弹性模量，「test/yiwen_img/importSubject/2035637073171582976.png」是应变），变形程度用应变衡量，当应力「test/yiwen_img/importSubject/2035637073104474112.png」一定时，E越大，应变「test/yiwen_img/importSubject/2035637073171582976.png」越小，即材料越不容易变形。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027548", "t": 3, "q": "明渠非均匀流的水面线一定是单调上升或单调下降的，不会出现先升后降或先降后升的情况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "明渠非均匀流的水面线并非一定单调，存在先升后降或先降后升的情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027549", "t": 3, "q": "理想流体定常流动中，沿任意流线的总水头守恒，不同流线的总水头也一定相等。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "理想流体定常流动中，沿任意流线总水头守恒，但不同流线总水头不一定相等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027550", "t": 3, "q": "管道的当量直径d_e=4A/χ，其中A为断面面积，χ为湿周，该式仅适用于圆管，不适用于非圆管。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "当量直径公式「test/yiwen_img/importSubject/2035637073234497536.png」既适用于圆管，也适用于非圆管，用于将非圆管流动问题转化为圆管流动问题处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027551", "t": 3, "q": "梁的弯矩图在集中力偶作用点处发生突变，突变值等于该集中力偶的大小;剪力图在集中力偶作用点处无变化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据梁的内力图规律，集中力偶作用处弯矩图突变，突变值为集中力偶大小，剪力图无变化。", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027552", "t": 3, "q": "流体的惯性力与粘性力的比值用弗劳德数Fr表示，Fr越大，惯性力相对越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。流体的惯性力与粘性力的比值用雷诺数Re表示，而弗劳德数Fr是惯性力与重力的比值。所以答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027553", "t": 3, "q": "明渠水力最优断面的断面面积最小，因此在工程中应优先采用水力最优断面设计渠道。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水力最优断面虽面积最小，但受地形、地质等多因素限制，工程中不能仅考虑断面面积，还需综合其他因素，所以不一定优先采用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027554", "t": 3, "q": "轴向拉压杆的横截面上，剪应力为零，只有正应力;梁的横截面上，正应力和剪应力均存在。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴向拉压杆受轴向力，横截面上只产生正应力，剪应力为零；梁受横向荷载，横截面上正应力和剪应力通常都存在。", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027555", "t": 3, "q": "管流中，当流速一定时，管径越大，雷诺数Re越小，越容易形成层流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "雷诺数公式Re = vd/ν （v是流速，d是管径，ν是运动粘度），流速一定时，管径越大，雷诺数越大，而雷诺数越大越易形成紊流，不是层流，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027556", "t": 3, "q": "流体静压力的大小与作用面的方向无关，仅与该点在流体中的位置（淹没深度）有关", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流体静压力基本特性表明其大小只取决于该点在流体中的位置（淹没深度），与作用面方向无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027557", "t": 3, "q": "圆柱形外管嘴正常工作时，管嘴收缩断面处会产生真空，真空度的存在相当于增大了作用水头，因此管嘴出流能力大于同条件下的孔口出流", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "圆柱形外管嘴收缩断面处有真空，真空度使作用水头增大，在相同条件下，管嘴出流能力确实比孔口出流大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027558", "t": 3, "q": "梁的弯曲变形计算中，抗弯刚度EI（E为弹性模量，I为惯性矩）越大，在相同荷载作用下，梁的最大挠度越小，因为EI直接反映了梁抵抗弯曲变形的能力", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在梁的弯曲变形计算里，挠度与抗弯刚度EI成反比，EI越大，抵抗变形能力越强，相同荷载下最大挠度就越小。", "ap": [false, false, false, false, false, false]}]}, {"k": "第1章 力学基础||第4节 水力学基本理论（2）", "n": "第1章 力学基础 / 第4节 水力学基本理论（2）", "qs": [{"id": "2035637083640565760", "t": 1, "q": "下列关于流体压缩性的说法，正确的是（　）", "a": ["流体的压缩性用体积压缩系数β表示，β越大，流体越容易压缩", "液体的压缩性很大，气体的压缩性很小", "工程上，水通常被视为可压缩流体", "压缩性对液体流动的影响通常比气体大", "", ""], "r": "A", "e": "体积压缩系数β越大表示流体越易压缩；液体压缩性小，气体压缩性大；工程上常把水视为不可压缩流体；压缩性对气体流动影响大。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565761", "t": 1, "q": "在明渠均匀流中，若渠道底坡i增大，其他条件（断面形状、粗糙系数）不变，则渠道的临界水深h_k将（　）", "a": ["增大", "减小", "不变", "无法确定", "", ""], "r": "C", "e": "临界水深只与流量和断面形状有关，与渠道底坡无关。本题中流量、断面形状等决定临界水深的因素未变，所以临界水深不变。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565762", "t": 1, "q": "根据达西-魏斯巴赫公式，沿程水头损失h_f与下列哪个物理量的平方成正比（　）", "a": ["管径d", "管长L", "流速v", "流体密度ρ", "", ""], "r": "C", "e": "达西 - 魏斯巴赫公式为「test/yiwen_img/importSubject/2035637079123300352.png」，从公式可知沿程水头损失「test/yiwen_img/importSubject/2035637079672754176.png」与流速v的平方成正比。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565763", "t": 1, "q": "在水利工程中，当计算圆管内流体流动的雷诺数Re时，若流体为水，管道内径d=0.2m，管内平均流速v=1.5m/s，水的运动粘度ν=1.0×10^-6 m²/s，则该流动的雷诺数及流动状态分别是（　）", "a": ["Re=3×10^5，层流", "Re=3×10^5，紊流", "Re=3×10^4，层流", "Re=3×10^4，紊流", "", ""], "r": "B", "e": "雷诺数Re = vd/ν，将v = 1.5m/s，d = 0.2m，「test/yiwen_img/importSubject/2035637081623105536.png」代入可得「test/yiwen_img/importSubject/2035637081757323264.png」，当Re > 2000时为紊流。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565764", "t": 1, "q": "关于流体静压力的特性，下列说法错误的是（　）", "a": ["静压力的方向垂直于作用面的内法线方向", "静止流体中任意一点各方向的静压力大小相等", "静压力的大小仅与该点在流体中的位置有关，与作用面方向无关", "静止流体中不同水平面上各点的静压力大小一定相等", "", ""], "r": "D", "e": "静止流体中不同水平面上深度不同，根据「test/yiwen_img/importSubject/2035637079769223168.png」，静压力与深度有关，不同水平面深度不同，静压力大小不一定相等。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565765", "t": 1, "q": "在流体力学中，\"水力粗糙管\"是指（　）", "a": ["管道内壁表面绝对粗糙度Δ大于管道内径d的管道", "管道内壁表面绝对粗糙度Δ与管道内径d的比值Δ/d大于0.05的管道", "流动中粘性底层厚度δ小于管道内壁绝对粗糙度Δ的管道", "流动中粘性底层厚度δ大于管道内壁绝对粗糙度Δ的管道", "", ""], "r": "C", "e": "水力粗糙管的判定依据是粘性底层与管壁粗糙度的关系，当粘性底层厚度δ小于管壁绝对粗糙度Δ 时为水力粗糙管。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565766", "t": 1, "q": "下列关于伯努利方程适用条件的说法，完全正确的是（　）", "a": ["理想流体、定常流动、不可压缩流体、沿流线", "实际流体、定常流动、不可压缩流体、沿流线", "理想流体、非定常流动、不可压缩流体、沿流线", "理想流体、定常流动、可压缩流体、沿流线", "", ""], "r": "A", "e": "伯努利方程适用于理想流体（无黏性）、定常流动（流场中各点流速不随时间变化）、不可压缩流体，且沿同一流线。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565767", "t": 1, "q": "某弧形闸门挡水，闸门宽度b=5m，挡水高度H=3m，弧形闸门的形心淹没深度h_c=2m，若不计闸门自重及摩擦力，闸门所受水压力的合力大小及方向分别是（　）（水的密度ρ=1000kg/m³，g=9.8m/s²）", "a": ["294kN，垂直指向闸门表面", "294kN，水平指向闸门表面", "441kN，垂直指向闸门表面", "441kN，水平指向闸门表面", "", ""], "r": "A", "e": "先求静水总压力水平分力「test/yiwen_img/importSubject/2035637079857303552.png」，「test/yiwen_img/importSubject/2035637079949578240.png」，「test/yiwen_img/importSubject/2035637080033464320.png」；弧形闸门所受水压力合力垂直指向闸门表面。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565768", "t": 1, "q": "关于流体的压缩性，下列说法正确的是（　）", "a": ["液体的压缩性用体积压缩系数β表示，β越大，液体越容易压缩", "气体的压缩性仅与温度有关，与压力无关", "工程上大多数液体流动可视为可压缩流动", "液体的体积压缩系数β随温度升高而增大", "", ""], "r": "A", "e": "体积压缩系数β越大，液体压缩相同体积所需压强变化越小，即越易压缩；气体压缩性与温度和压力都有关；工程上多数液体流动视为不可压缩流动；液体体积压缩系数β随温度升高先减小后增大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565769", "t": 1, "q": "在明渠流动中，临界流的判别条件是（　）", "a": ["弗劳德数Fr>1，断面单位能量E_s最小", "弗劳德数Fr=1，断面单位能量E_s最小", "弗劳德数Fr<1，断面单位能量E_s最小", "弗劳德数Fr=1，断面单位能量E_s最大", "", ""], "r": "B", "e": "临界流时弗劳德数Fr = 1，且此时断面单位能量Es最小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565770", "t": 1, "q": "下列关于粘性流体绕流物体所受阻力的说法，正确的是（　）", "a": ["粘性阻力仅由物体表面的切应力产生，与压差无关", "压差阻力仅由物体前后的压力差产生，与粘性无关", "对于流线型物体，粘性阻力是主要阻力，压差阻力很小", "对于非流线型物体，粘性阻力是主要阻力，压差阻力很小", "", ""], "r": "C", "e": "粘性阻力由切应力产生，也与压差有关；压差阻力与粘性有关；流线型物体粘性阻力是主要的，压差阻力小；非流线型物体压差阻力是主要的。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565771", "t": 1, "q": "关于静矩（一次矩）的性质，下列说法错误的是（　）", "a": ["平面图形对某轴的静矩等于该图形各微面积与微面积到该轴距离乘积的积分", "平面图形的形心到某轴的距离等于该图形对该轴的静矩除以图形的面积", "若平面图形对某轴的静矩为零，则该轴必通过图形的形心", "平面图形对不同平行轴的静矩大小相等", "", ""], "r": "D", "e": "静矩与轴的位置有关，平面图形对不同平行轴的静矩大小一般不相等，D选项说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565772", "t": 1, "q": "在水力学中，\"长管\"是指（　）", "a": ["管道长度大于100m的管道", "管道长度与管径之比大于1000的管道", "局部水头损失和流速水头之和远小于沿程水头损失，可忽略不计的管道", "局部水头损失和流速水头之和大于沿程水头损失的管道", "", ""], "r": "C", "e": "水力学中长管定义为局部水头损失和流速水头之和远小于沿程水头损失，可忽略不计的管道。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565773", "t": 1, "q": "某物体在静止水中处于悬浮状态，下列说法正确的是（　）", "a": ["物体的密度大于水的密度", "物体的密度小于水的密度", "物体的密度等于水的密度", "物体的重量大于其所受的浮力", "", ""], "r": "C", "e": "物体悬浮时，浮力等于重力，根据阿基米德原理和重力公式推导可得物体密度等于液体密度。本题物体悬浮在静止水中，所以物体的密度等于水的密度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565774", "t": 1, "q": "下列关于梁的弯曲剪应力的分布规律，正确的是（　）", "a": ["矩形截面梁的弯曲剪应力沿截面高度呈线性分布，最大值在截面形心处", "矩形截面梁的弯曲剪应力沿截面高度呈抛物线分布，最大值在截面形心处", "圆形截面梁的弯曲剪应力沿截面半径呈线性分布，最大值在截面边缘处", "圆形截面梁的弯曲剪应力沿截面半径呈抛物线分布，最大值在截面形心处", "", ""], "r": "B", "e": "矩形截面梁弯曲剪应力沿截面高度呈抛物线分布，且最大值在截面形心处；圆形截面梁弯曲剪应力沿截面半径分布，最大值在截面形心处。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565775", "t": 1, "q": "在孔口出流中，当孔口为淹没出流时，其出流流量Q的计算式为（　）（μ为流量系数，A为孔口面积，H为作用水头）", "a": ["Q=μA√(2gH)", "Q=μA√(2g(H1-H2))，H1为上游水位，H2为下游水位", "Q=μA√(gH)", "Q=μA√(g(H1-H2))", "", ""], "r": "B", "e": "淹没出流流量公式是基于上下游水位差，流量Q = μA√(2g(H1 - H2)) ，其中H1为上游水位，H2为下游水位。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565776", "t": 1, "q": "某轴向拉压杆，横截面面积A=1000mm²，承受轴向拉力F=200kN，材料的弹性模量E=200GPa，杆长l=2m，则该杆的轴向伸长量Δl为（　）（轴向拉压变形公式Δl=Fl/(EA)）", "a": ["1mm", "2mm", "3mm", "4mm", "", ""], "r": "B", "e": "将「test/yiwen_img/importSubject/2035637080117350400.png」，l = 2m，「test/yiwen_img/importSubject/2035637080209625088.png」，「test/yiwen_img/importSubject/2035637080293511168.png」代入「test/yiwen_img/importSubject/2035637080373202944.png」，可得「test/yiwen_img/importSubject/2035637080457089024.png」。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565777", "t": 1, "q": "在明渠均匀流中，若渠道的粗糙系数n增大，其他条件（底坡i、断面尺寸）不变，则断面平均流速v和流量Q的变化规律是（　）", "a": ["v增大，Q增大", "v增大，Q减小", "v减小，Q减小", "v减小，Q增大", "", ""], "r": "C", "e": "根据谢才公式「test/yiwen_img/importSubject/2035637080536780800.png」，曼宁公式「test/yiwen_img/importSubject/2035637080624861184.png」（y为系数），n增大时，C减小，进而v减小。流量Q = vA，A不变，v减小则Q减小。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565778", "t": 1, "q": "下列关于理想流体定常流动的说法，错误的是（　）", "a": ["流场中各点的速度不随时间变化", "流场中各点的压力不随时间变化", "流线与迹线重合", "流场中存在粘性力", "", ""], "r": "D", "e": "理想流体无粘性，所以不存在粘性力。定常流动时流场各点速度、压力不随时间变，且流线与迹线重合。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565779", "t": 1, "q": "某圆管层流流动，若管内流体的动力粘度μ增大，其他条件（管径d、平均流速v）不变，则沿程水头损失h_f的变化是（　）", "a": ["h_f增大", "h_f减小", "h_f不变", "无法确定", "", ""], "r": "A", "e": "圆管层流沿程水头损失公式「test/yiwen_img/importSubject/2035637080738107392.png」，当管径d、平均流速v等其他条件不变，动力粘度「test/yiwen_img/importSubject/2035637080826187776.png」增大时，「test/yiwen_img/importSubject/2035637079672754176.png」增大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565780", "t": 1, "q": "关于平面图形的惯性矩（二次矩），下列说法正确的是（　）", "a": ["惯性矩是标量，其值恒为正", "平面图形对某轴的惯性矩等于该图形对通过形心的平行轴的惯性矩减去图形面积与两轴距离平方的乘积", "平面图形对不同轴的惯性矩大小相等", "惯性矩的单位与面积的单位相同", "", ""], "r": "A", "e": "惯性矩是标量，根据其定义式积分计算，结果恒为正，A正确；平面图形对某轴的惯性矩等于该图形对通过形心的平行轴的惯性矩加上图形面积与两轴距离平方的乘积，B错误；平面图形对不同轴的惯性矩大小一般不同，C错误；惯性矩单位是长度的四次方，面积单位是长度平方，二者不同，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565781", "t": 1, "q": "下列关于明渠非均匀流的说法，正确的是（　）", "a": ["明渠非均匀流的断面平均流速沿程不变", "明渠非均匀流的水面线一定是平行于渠底的直线", "明渠非均匀流的水力坡度i等于底坡i_b", "明渠非均匀流的断面单位能量沿程变化", "", ""], "r": "D", "e": "明渠非均匀流流速、水深沿程变化，水面线不平行渠底，水力坡度与底坡也不相等，而断面单位能量因流速和水深变化沿程改变。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565782", "t": 1, "q": "在流体静力学中，计算曲面壁所受水压力的水平分力F_x时，其计算方法是（　）", "a": ["F_x等于曲面在垂直平面上的投影面积A_x乘以该投影面形心处的静压力p_c", "F_x等于曲面的实际面积A乘以曲面形心处的静压力p_c", "F_x等于曲面在水平平面上的投影面积A_y乘以该投影面形心处的静压力p_c", "F_x等于液体的重量乘以曲面的倾斜角度", "", ""], "r": "A", "e": "流体静力学中，计算曲面壁所受水压力的水平分力F_x，是用曲面在垂直平面上的投影面积A_x乘以该投影面形心处的静压力p_c。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565783", "t": 1, "q": "下列关于流动相似的说法，错误的是（　）", "a": ["流动相似包括几何相似、运动相似和动力相似", "几何相似是运动相似和动力相似的前提", "动力相似是流动相似的主导因素，只要满足动力相似，就一定满足运动相似", "雷诺数是判断粘性流体流动相似的重要准则数", "", ""], "r": "C", "e": "流动相似包含几何、运动和动力相似，几何相似是基础，是运动和动力相似前提。动力相似虽重要，但满足动力相似不一定就满足运动相似，因为运动相似还受初始条件等影响。雷诺数用于判断粘性流体流动相似。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637083640565784", "t": 1, "q": "在水力学中，\"水力半径R\"的定义是（　）", "a": ["管道或渠道的断面面积A与湿周χ的比值，即R=A/χ", "管道或渠道的断面面积A与断面周长的比值，即R=A/L", "管道的内径d与4的比值，即R=d/4（仅适用于圆管）", "渠道的水深h与2的比值，即R=h/2（仅适用于矩形渠道）", "", ""], "r": "A", "e": "水力半径定义为管道或渠道的断面面积A与湿周χ的比值，即R = A/χ 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116480", "t": 2, "q": "下列关于材料力学中\"变形\"的说法，正确的有（　）", "a": ["变形是指物体在外力作用下形状和尺寸的改变", "变形按性质分为弹性变形和塑性变形，弹性变形是外力去除后能恢复的变形，塑性变形是外力去除后不能恢复的变形", "轴向拉压杆的变形包括轴向伸长或缩短和横向收缩或伸长", "梁的变形主要是弯曲变形，表现为轴线由直线变为曲线", "构件的变形大小与外力大小、构件尺寸和材料性能有关", ""], "r": "ABCDE", "e": "材料力学里，物体受外力会使形状和尺寸改变，这就是变形，变形分弹性和塑性，弹性可恢复、塑性不可恢复；轴向拉压杆有轴向和横向变形；梁主要是弯曲变形，轴线由直变曲；构件变形大小受外力、尺寸和材料性能影响。各选项均正确。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116481", "t": 2, "q": "下列因素中，会影响明渠均匀流流量Q的有（　）", "a": ["渠道底坡i", "渠道粗糙系数n", "过水断面面积A", "水力半径R", "流体的密度ρ", ""], "r": "ABCD", "e": "明渠均匀流流量公式「test/yiwen_img/importSubject/2035637080889102336.png」，「test/yiwen_img/importSubject/2035637080624861184.png」 。其中A为过水断面面积，R为水力半径，i为渠道底坡，n为渠道粗糙系数。所以流量Q与底坡i、粗糙系数n、过水断面面积A、水力半径R有关，与流体密度「test/yiwen_img/importSubject/2035637081006542848.png」无关。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116482", "t": 2, "q": "下列关于流体黏性的说法，正确的有（　）", "a": ["黏性是流体抵抗剪切变形的能力", "黏性只有在流体运动时才表现出来", "理想流体没有黏性", "牛顿流体的黏性不随剪应变率变化", "温度对液体和气体黏性的影响趋势相同", ""], "r": "ABCD", "e": "黏性是流体抵抗剪切变形能力，且只在流体运动时表现，理想流体无黏性，牛顿流体黏性不随剪应变率变；而温度对液体和气体黏性影响趋势相反。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116483", "t": 2, "q": "下列关于静水总压力的说法，正确的有（　）", "a": ["平面壁上的静水总压力大小等于形心处压强乘以受压面积", "曲面壁上的静水总压力大小等于形心处压强乘以受压面积", "平面壁上静水总压力的作用点（压力中心）一定位于形心下方", "曲面壁上静水总压力的水平分力等于该曲面在铅垂面上投影的静水总压力", "曲面壁上静水总压力的竖直分力等于该曲面所排开流体的重量", ""], "r": "ACDE", "e": "平面壁静水总压力用形心处压强乘受压面积计算，A对；曲面壁不能这样算，B错；平面壁压力中心因压强分布特点在形心下方，C对；曲面壁水平分力等于曲面在铅垂面投影的静水总压力，D对；竖直分力等于曲面排开流体重量，E对。答案：ACDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116484", "t": 2, "q": "下列关于水流流态（层流与紊流）的说法，正确的有（　）", "a": ["层流中，流体质点运动轨迹规则，各层间无明显掺混", "紊流中，流体质点运动轨迹杂乱，各层间存在剧烈掺混", "雷诺数是判别层流与紊流的唯一依据", "圆管中，雷诺数Re=2000是层流与紊流的临界值", "层流的沿程水头损失与流速的一次方成正比", ""], "r": "ABDE", "e": "层流质点运动规则无明显掺混，紊流质点运动杂乱有剧烈掺混；雷诺数是判别流态主要依据但非唯一；圆管中Re=2000是临界值；层流沿程水头损失与流速一次方成正比。答案：ABDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116485", "t": 2, "q": "下列关于有压管流水头损失的说法，正确的有（　）", "a": ["沿程水头损失是由于流体黏性引起的，沿管长均匀分布", "局部水头损失是由于流动边界突变引起的，集中发生在局部区域", "长管计算中，局部水头损失可以忽略不计", "短管计算中，只需考虑局部水头损失，无需考虑沿程水头损失", "沿程水头损失系数λ仅与雷诺数Re有关", ""], "r": "ABC", "e": "沿程水头损失由流体黏性产生，沿管长均匀分布；局部水头损失因流动边界突变，集中在局部区域；长管计算时局部水头损失相对小可忽略；短管计算沿程和局部水头损失都要考虑；沿程水头损失系数λ与雷诺数Re和相对粗糙度有关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116486", "t": 2, "q": "下列关于渗流的说法，正确的有（　）", "a": ["渗流是指流体在多孔介质中的流动", "达西定律适用于所有渗流情况", "渗透系数k是反映多孔介质透水能力的参数", "渗流速度是流体在多孔介质孔隙中的实际流速", "水力坡度J是渗流沿程水头损失与渗流长度的比值", ""], "r": "ACE", "e": "渗流即流体在多孔介质中流动，A对；达西定律只适用于层流渗流，非所有情况，B错；渗透系数反映多孔介质透水能力，C对；渗流速度不是流体在孔隙中实际流速，D错；水力坡度是渗流沿程水头损失与渗流长度比值，E对。答案：ACE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116487", "t": 2, "q": "下列关于圆管有压流的说法，正确的有（　）", "a": ["圆管有压流的过流能力（最大流量）与管径的平方成正比", "圆管有压流中，若流量不变，管径增大则流速减小", "圆管有压流的水力半径R=d/4（d为管径）", "圆管紊流中，管壁粗糙度越大，沿程水头损失系数λ越大", "圆管层流的流速分布为对数曲线型", ""], "r": "BCD", "e": "A项过流能力与管径四次方成正比，A错误；流量不变，管径增大，过流面积增大，流速减小，B正确；圆管有压流水力半径R = d/4，C正确；管壁粗糙度大，紊流中沿程水头损失系数λ越大，D正确；圆管层流流速分布是抛物线型，E错误。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116488", "t": 2, "q": "下列关于水击的说法，正确的有（　）", "a": ["水击现象会导致管道内压强急剧升高，可能破坏管道", "阀门关闭时间越长，产生的水击压强越大", "管道越长，水击波传播的时间越长", "设置水击消除器可以减小水击压强的影响", "直接水击的压强小于间接水击的压强", ""], "r": "ACD", "e": "水击使管道内压强急剧升高易破坏管道；阀门关闭时间越短，水击压强越大；管道长则水击波传播时间长；水击消除器能减小水击压强影响；直接水击压强比间接水击大。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116489", "t": 2, "q": "下列关于明渠均匀流水力特性的说法，正确的有（　）", "a": ["明渠均匀流的水面线与渠底线平行", "明渠均匀流的水力坡度等于底坡", "明渠均匀流的流速沿程不变", "明渠均匀流的过水断面面积沿程不变", "明渠均匀流的测压管水头线与总水头线平行", ""], "r": "ABCDE", "e": "明渠均匀流流动规律稳定，水面线与渠底线平行，水力坡度等于底坡，流速、过水断面面积沿程不变，测压管水头线与总水头线平行。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116490", "t": 2, "q": "下列关于流体静力学基本方程的说法，正确的有（　）", "a": ["流体静力学基本方程适用于静止的不可压缩流体", "方程形式为z+p/(ρg)=C（常数），其中z为位置水头，p/(ρg)为压强水头", "方程表明静止流体中，各点的总水头（位置水头+压强水头）相等", "方程仅适用于同一连通的流体", "方程可用于计算静止流体中任意两点的压强差", ""], "r": "ABCDE", "e": "流体静力学基本方程适用于静止不可压缩流体，形式是z + p/(ρg)=C，表明各点总水头相等，能算静止流体中任意两点压强差，且仅适用于同一连通流体。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116491", "t": 2, "q": "下列关于牛顿流体与非牛顿流体的说法，正确的有（　）", "a": ["牛顿流体满足牛顿内摩擦定律τ=μ(du/dy)", "非牛顿流体的黏度μ随剪应变率变化", "水和空气属于牛顿流体", "泥浆和血液属于非牛顿流体", "牛顿流体的τ-du/dy曲线是过原点的直线", ""], "r": "ABCDE", "e": "牛顿流体满足牛顿内摩擦定律，其τ - du/dy曲线是过原点直线，水和空气是典型牛顿流体；非牛顿流体黏度随剪应变率变化，泥浆和血液是非牛顿流体。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116492", "t": 2, "q": "下列关于有压管流中管道串联与并联的说法，正确的有（　）", "a": ["管道串联时，总流量等于各管段流量之和", "管道串联时，总水头损失等于各管段水头损失之和", "管道并联时，总流量等于各支管流量之和", "管道并联时，各支管的水头损失相等", "管道并联时，各支管的流速一定相等", ""], "r": "BCD", "e": "管道串联总流量等于各管段流量，总水头损失是各管段水头损失之和；管道并联总流量是各支管流量之和，各支管水头损失相等，支管流速不一定相等。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116493", "t": 2, "q": "下列关于明渠流中临界水深的说法，正确的有（　）", "a": ["临界水深是明渠水流中，动能等于势能时的水深", "临界水深对应的弗劳德数Fr=1", "临界水深仅与流量和渠道断面形状有关", "对于矩形断面，临界水深h_k=(Q²/(gb²))^(1/3)（b为底宽）", "临界水深是明渠流态（急流、缓流）的判别基准之一", ""], "r": "BCDE", "e": "临界水深对应弗劳德数Fr = 1，它仅与流量和渠道断面形状有关，矩形断面临界水深公式为「test/yiwen_img/importSubject/2035637081073651712.png」，也是明渠流态判别基准之一，而不是动能等于势能时的水深。答案：BCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116494", "t": 2, "q": "下列关于渗流场中流网的说法，正确的有（　）", "a": ["流网由等势线和流线组成", "流网中，相邻等势线之间的水头差相等", "流网中，相邻流线之间的流量相等", "流网中，等势线与流线处处垂直", "流网的形状仅与渗流区域的边界条件有关，与流体性质无关", ""], "r": "ABCDE", "e": "流网是由等势线和流线组成的，相邻等势线水头差相等，相邻流线流量相等，且等势线与流线处处垂直，流网形状取决于边界条件，与流体性质无关。所以ABCDE都正确。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116495", "t": 2, "q": "下列关于流体运动的描述方法，正确的有（　）", "a": ["欧拉法以流体质点为研究对象，跟踪质点运动", "拉格朗日法以空间点为研究对象，描述各点的运动参数", "欧拉法中，流速场可表示为v(x,y,z,t)", "拉格朗日法中，质点的位置可表示为r(a,b,c,t)（a,b,c为质点标识）", "工程上通常采用欧拉法描述流体运动", ""], "r": "CDE", "e": "欧拉法以空间点为研究对象，拉格朗日法以流体质点为研究对象，A、B 错误；C、D 分别是欧拉法和拉格朗日法的正确表达式；工程上多采用欧拉法，E 正确。答案：CDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116496", "t": 2, "q": "下列关于沿程水头损失系数λ的影响因素，正确的有（　）", "a": ["层流中，λ仅与雷诺数Re有关", "紊流光滑区，λ仅与Re有关", "紊流过渡区，λ与Re和管壁相对粗糙度Δ/d有关", "紊流粗糙区（阻力平方区），λ仅与管壁相对粗糙度Δ/d有关", "λ值越大，沿程水头损失越小", ""], "r": "ABCD", "e": "本题可根据沿程水头损失系数λ在不同流态和区域的影响因素来逐一分析选项，同时明确λ与沿程水头损失的关系。### 选项A在层流中，沿程水头损失系数λ只与雷诺数Re有关，计算公式为「test/yiwen_img/importSubject/2035637081161732096.png」，所以选项A正确。### 选项B在紊流光滑区，沿程水头损失系数λ仅与雷诺数Re有关，所以选项B正确。 ### 选项C在紊流过渡区，沿程水头损失系数λ与雷诺数Re和管壁相对粗糙度「test/yiwen_img/importSubject/2035637081258201088.png」都有关，所以选项C正确。### 选项D在紊流粗糙区（阻力平方区），沿程水头损失系数λ仅与管壁相对粗糙度「test/yiwen_img/importSubject/2035637081258201088.png」有关，所以选项D正确。### 选项E根据沿程水头损失计算公式「test/yiwen_img/importSubject/2035637081329504256.png」（其中「test/yiwen_img/importSubject/2035637079672754176.png」为沿程水头损失，l为管长，d为管径，v为流速，g为重力加速度）可知，「test/yiwen_img/importSubject/2035637081409196032.png」值越大，沿程水头损失越大，所以选项E错误。综上，答案是ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116497", "t": 2, "q": "下列关于明渠水流中堰流的说法，正确的有（　）", "a": ["堰流是指水流经过障碍物（堰）时，发生溢流的现象", "堰流的流量与堰顶水头的1/2次方成正比", "薄壁堰、实用堰、宽顶堰的划分依据是堰的厚度与堰顶水头的比值", "宽顶堰的流量系数与堰的进口形式有关", "堰流的水头损失主要是局部水头损失", ""], "r": "ACDE", "e": "堰流就是水流经障碍物溢流现象，A对；堰流流量与堰顶水头3/2次方成正比，B错；按堰厚与堰顶水头比值分薄壁堰、实用堰、宽顶堰，C对；宽顶堰流量系数和堰进口形式有关，D对；堰流水头损失主要是局部水头损失，E对。答案：ACDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116498", "t": 2, "q": "下列关于流体压缩性的应用，正确的有（　）", "a": ["水利工程中，通常将水视为不可压缩流体，简化计算", "高速水流（如水电站泄洪洞）中，需考虑水的压缩性", "气体输送管道中，需考虑气体的压缩性", "水击计算中，需考虑水的压缩性和管壁的弹性", "潜水艇沉浮时，需考虑海水的压缩性", ""], "r": "ACD", "e": "水利工程中因水压缩性极小常视为不可压缩流体简化计算；高速水流虽速度快但水压缩性仍小一般可不考虑；气体易压缩，气体输送管道要考虑；水击计算涉及压力急剧变化，要考虑水压缩性和管壁弹性；潜水艇沉浮时海水压缩性影响小可不考虑。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116499", "t": 2, "q": "下列关于静水压强的计算应用，正确的有（　）", "a": ["可以用于计算挡水建筑物（如大坝）所受的静水压力", "可以用于计算液体储罐底部的压强", "可以用于计算连通器中各点的压强关系", "可以用于计算运动流体中任意点的压强", "可以用于确定船舶的吃水深度", ""], "r": "ABCE", "e": "静水压强适用于静止液体情况。A大坝受静水压力可由静水压强算；B液体储罐底部压强用静水压强计算；C连通器中各点压强关系基于静水压强原理；E船舶吃水深度与静水压强有关。而D运动流体中任意点压强需用流体动力学知识，不能用静水压强计算。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116500", "t": 2, "q": "下列关于伯努利方程的说法，正确的有（　）", "a": ["伯努利方程适用于理想、不可压缩、恒定、沿流线的流体", "方程形式为z1+p1/(ρg)+v1²/(2g)=z2+p2/(ρg)+v2²/(2g)（无能量损失）", "方程中，z+p/(ρg)+v²/(2g)表示单位重量流体的总机械能", "实际流体应用伯努利方程时，需考虑水头损失", "伯努利方程可以用于计算管道内的流速和压强", ""], "r": "ABCDE", "e": "伯努利方程适用于理想、不可压缩、恒定、沿流线的流体，无能量损失时其形式为z1+p1/(ρg)+v1²/(2g)=z2+p2/(ρg)+v2²/(2g) ，z+p/(ρg)+v²/(2g)是单位重量流体总机械能，实际应用要考虑水头损失，也可用于算管道流速和压强。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116501", "t": 2, "q": "下列关于明渠非均匀流的水力计算，正确的有（　）", "a": ["明渠非均匀流的水力计算通常采用能量方程", "水面曲线的计算需要确定控制断面的水深", "对于棱柱形渠道，水面曲线的形状仅与底坡类型有关", "明渠非均匀流中，总水头线沿程一定下降", "明渠非均匀流中，测压管水头线（水面线）沿程可能上升也可能下降", ""], "r": "ABDE", "e": "明渠非均匀流水力计算常用能量方程；水面曲线计算要先确定控制断面水深；总水头线因沿程有能量损失必沿程下降；水面线受多种因素影响，可能上升或下降。而棱柱形渠道水面曲线形状不仅与底坡类型有关，还和其他因素有关，C错误。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116502", "t": 2, "q": "下列关于渗流中井流的说法，正确的有（　）", "a": ["潜水井（无压井）是汲取潜水的井，井中水位低于含水层顶板", "承压井（有压井）是汲取承压水的井，井中水位高于含水层顶板", "完全井是指井管贯穿整个含水层，井底到达不透水层的井", "井的出水量与渗透系数k成正比", "井的影响半径是指井抽水后，水位不再变化的区域半径", ""], "r": "BCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116503", "t": 2, "q": "下列关于流体运动中涡旋运动的说法，正确的有（　）", "a": ["涡旋运动是指流体质点绕自身轴线的旋转运动", "有旋流中，流体的旋度不等于零", "理想流体的涡旋运动满足亥姆霍兹定理（涡旋守恒）", "实际流体中，涡旋会因黏性作用而衰减", "均匀流一定是无旋流", ""], "r": "ABCD", "e": "涡旋运动就是流体质点绕自身轴线旋转；有旋流旋度不为零；理想流体无黏性，涡旋运动满足亥姆霍兹定理；实际流体有黏性，涡旋会衰减；均匀流不一定是无旋流。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116504", "t": 2, "q": "下列关于有压管流中过流能力的说法，正确的有（　）", "a": ["管道的过流能力是指管道所能通过的最大流量", "对于长管，过流能力与管径的5/2次方成正比", "对于短管，过流能力仅与管径有关", "增大管道的粗糙系数，会减小过流能力", "提高管道进出口的水头差，会增大过流能力", ""], "r": "ABDE", "e": "管道过流能力指最大流量，A对；长管过流能力与管径5/2次方成正比，B对；短管过流能力与管径、水头差等有关，C错；增大粗糙系数，沿程水头损失增大，过流能力减小，D对；提高进出口水头差，动力增强，过流能力增大，E对。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116505", "t": 2, "q": "下列关于明渠流中水力最佳断面的说法，正确的有（　）", "a": ["水力最佳断面是指在给定流量、底坡、粗糙系数条件下，过水断面面积最小的断面", "水力最佳断面是指水力半径最大的断面", "对于矩形断面，水力最佳断面的宽深比b/h=2", "对于梯形断面，水力最佳断面的边坡系数m越大，宽深比越小", "实际工程中，常采用水力最佳断面，因其工程量最小", ""], "r": "ABC", "e": "水力最佳断面是在流量、底坡、粗糙系数一定时，过水断面面积最小或湿周最小、水力半径最大的断面；矩形水力最佳断面宽深比是2；梯形断面边坡系数m越大，宽深比越大；实际工程不一定采用水力最佳断面，因受地形等限制。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116506", "t": 2, "q": "下列关于流体黏度的测量与应用，正确的有（　）", "a": ["黏度可以通过黏度计（如乌氏黏度计）测量", "动力黏度μ的单位是Pa·s，运动黏度ν的单位是m²/s", "润滑油的黏度应根据工作温度选择，温度升高时需选用黏度更大的油", "在管道输送流体时，黏度越大，沿程水头损失越大", "黏度是选择液压油的重要指标之一", ""], "r": "ABDE", "e": "乌氏黏度计可测黏度，A对；动力黏度和运动黏度单位分别是Pa·s和m²/s，B对；温度升高，油黏度降低，应选黏度小的油，C错；黏度大，流体流动阻力大，沿程水头损失大，D对；液压油需合适黏度，黏度是重要指标，E对。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116507", "t": 2, "q": "下列关于静水压力对建筑物作用的说法，正确的有（　）", "a": ["挡水坝所受静水压力随深度线性增大", "矩形挡水墙所受静水总压力的作用点位于墙高的1/2处", "圆形压力管道所受静水压力是均匀分布的", "弧形闸门所受静水总压力的方向通过闸门的曲率中心", "静水压力会使挡水建筑物产生倾覆和滑动趋势", ""], "r": "ADE", "e": "这是一道关于静水压力对建筑物作用的选择题。我们来逐一分析每个选项的正确性：A选项：挡水坝所受静水压力随深度线性增大。这是正确的，因为静水压力与水深成正比，随着深度的增加，静水压力也线性增大。B选项：矩形挡水墙所受静水总压力的作用点位于墙高的1/2处。这是错误的，实际上，矩形挡水墙所受静水总压力的作用点位于墙高的1/3处。C选项：圆形压力管道所受静水压力是均匀分布的。这是错误的，圆形压力管道所受静水压力在管道壁上呈线性分布，从管壁到管中心逐渐减小。D选项：弧形闸门所受静水总压力的方向通过闸门的曲率中心。这是正确的，弧形闸门的静水压力方向确实通过其曲率中心。E选项：静水压力会使挡水建筑物产生倾覆和滑动趋势。这也是正确的，静水压力可能导致建筑物的不稳定，包括倾覆和滑动。综上所述，正确的选项是A、D和E。所以，正确答案是ADE。", "ap": [false, false, false, false, false, false]}, {"id": "2035637085444116508", "t": 2, "q": "下列关于水力学实验的说法，正确的有（　）", "a": ["雷诺实验用于观察层流与紊流的流动形态，确定临界雷诺数", "文丘里实验用于验证伯努利方程，测量流体的流速和流量", "达西实验用于研究渗流规律，建立达西定律", "水击实验用于研究管道中水流速度突变引起的压强波动", "堰流实验用于确定堰的流量系数，为堰的设计提供依据", ""], "r": "ABCDE", "e": "各选项表述均符合对应水力学实验的目的和作用。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236800", "t": 3, "q": "明渠逆坡渠道（i<0，渠底沿水流方向升高）中可以形成均匀流，只要渠道粗糙系数、断面尺寸不变，且水流能克服阻力即可", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "明渠均匀流的条件之一是渠底坡度为正坡（i>0），逆坡渠道（i<0）无法形成均匀流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236801", "t": 3, "q": "理想流体在流动过程中，由于忽略黏性，因此不存在水头损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "理想流体无黏性，而水头损失是因流体黏性等因素产生的，所以理想流体流动无水头损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236802", "t": 3, "q": "明渠均匀流的正常水深h0是指水流在渠道中处于均匀流状态时的水深，它仅与渠道的底坡和粗糙系数有关，与流量无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "正常水深h0不仅与渠道底坡和粗糙系数有关，还与流量有关。流量变化会使正常水深改变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236803", "t": 3, "q": "根据牛顿内摩擦定律，流体的切应力τ与速度梯度du/dy成正比，其中比例系数μ（动力黏度）的大小仅与流体的种类有关，与温度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "动力黏度μ不仅与流体种类有关，还与温度密切相关，气体的动力黏度随温度升高而增大，液体的动力黏度随温度升高而减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236804", "t": 3, "q": "在静水压强分布中，任意两个相互连通的静止流体，当它们的温度相同时，其同一水平面上各点的压强相等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236805", "t": 3, "q": "圆管层流的沿程水头损失系数λ仅与雷诺数Re有关，且λ随Re的增大而减小;而圆管紊流的λ仅与管壁相对粗糙度Δ/d有关，与Re无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "圆管层流沿程水头损失系数λ仅与雷诺数Re有关，且λ随Re增大而减小，这部分正确；但圆管紊流的λ不仅与管壁相对粗糙度Δ/d有关，还与雷诺数Re有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236806", "t": 3, "q": "弗劳德数Fr=v/√(gR)，其中R为水力半径，Fr>1时水流为急流，此时水流的惯性力大于重力，干扰波不能向上游传播。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "弗劳德数公式及急流判断条件、急流时惯性力与重力关系和干扰波传播特性描述均正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236807", "t": 3, "q": "渗流的水力坡度J是指渗流沿程水头损失Δh与渗流路径长度L的比值，即J=Δh/L，它与渗透系数k共同决定了渗流速度v（v=kJ）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是关于渗流基本概念和达西定律的表述，水力坡度定义及与渗流速度关系均正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236808", "t": 3, "q": "有压管流中，当管道长度L与管径d的比值L/d>1000时，可视为长管，计算时仅需考虑沿程水头损失，无需考虑局部水头损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236809", "t": 3, "q": "明渠非均匀流中，总水头线沿程一定下降，因为水流在运动过程中始终存在水头损失;而测压管水头线（水面线）沿程可能上升，也可能下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水流运动有能量损失，总水头线必然沿程下降；明渠非均匀流中，根据水流情况，水面线（测压管水头线）可能因流速变化等出现上升或下降。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236810", "t": 3, "q": "水击现象是由于管道中水流速度突然变化（如阀门突然关闭），导致管道内压强急剧波动的现象，阀门关闭时间越长，产生的水击压强越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "阀门关闭时间越长，水击压强越小。因为关闭时间长，水流速度变化相对缓慢，压强变化也不那么剧烈，产生的水击压强就小。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236811", "t": 3, "q": "流体的压缩性用体积压缩系数β表示，β=-ΔV/(VΔp)，β值越大，说明流体在单位压强变化下的体积变化率越大，流体越容易被压缩。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据体积压缩系数β的定义，β=-ΔV/(VΔp) ，其值越大，意味着在相同压强变化Δp时，体积变化率ΔV/V越大，即流体越容易被压缩。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236812", "t": 3, "q": "在平面壁静水压力计算中，无论平面壁是水平、垂直还是倾斜放置，其静水总压力的大小都等于平面壁形心处的压强乘以平面壁的受压面积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据平面壁静水总压力计算公式，确实不管平面壁处于水平、垂直或倾斜状态，静水总压力大小都等于平面壁形心处压强乘受压面积。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236813", "t": 3, "q": "明渠水流的临界水深h_k是判别急流和缓流的重要依据，当实际水深h>h_k时，水流为缓流，此时水流的重力大于惯性力，干扰波能向上游传播。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "临界水深是区分急流和缓流的关键，实际水深大于临界水深时为缓流，缓流中重力起主导作用大于惯性力，干扰波能向上游传播。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236814", "t": 3, "q": "根据伯努利方程，理想不可压缩恒定流沿流线的总机械能（位置水头+压强水头+流速水头）守恒，因此流线上各点的流速水头v²/(2g)越大，压强水头p/(ρg)就越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "理想不可压缩恒定流沿流线总机械能守恒，总机械能为位置水头、压强水头与流速水头之和，当总机械能不变，流速水头增大时，压强水头必然减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236815", "t": 3, "q": "渗流速度v是指流体在多孔介质孔隙中的实际流动速度，它等于渗流流量Q除以多孔介质的孔隙面积A_n，即v=Q/A_n。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "渗流速度v不是流体在多孔介质孔隙中的实际流动速度，而是假想流体在整个多孔介质截面上的平均流速，等于渗流流量Q除以多孔介质的总截面面积A ，并非孔隙面积A_n 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236816", "t": 3, "q": "圆管有压流的水力半径R=d/4（d为管径），该关系仅适用于圆管的满流情况，当圆管未充满（非满流）时，R=d/4不再成立。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水力半径R等于过流断面面积A与湿周χ之比。圆管满流时，A = πd²/4，χ = πd，R = A/χ = d/4 ；非满流时，过流断面面积和湿周改变，R≠d/4。", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236817", "t": 3, "q": "明渠水流中，水跃的跃前水深h'和跃后水深h''是一对共轭水深，它们之间的关系仅与流量有关，与渠道的底坡和粗糙系数无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水跃共轭水深关系是基于水跃基本方程推导得出，该方程主要考虑水流的动量守恒，只与流量和断面形状有关，与渠道底坡和粗糙系数无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236818", "t": 3, "q": "流体的运动黏度ν=μ/ρ，它是一个无量纲量，主要用于比较不同流体的黏性大小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "运动黏度ν=μ/ρ有单位，不是无量纲量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236819", "t": 3, "q": "在有压管流的并联管道中，各支管的水头损失相等，且总流量等于各支管流量之和;而在串联管道中，各管段的流量相等，且总水头损失等于各管段水头损失之和。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是有压管流并联和串联管道的基本特性，并联时各支管水头损失相等，总流量为各支管流量之和；串联时各管段流量相等，总水头损失是各管段水头损失之和。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236820", "t": 3, "q": "静止流体中，任意一点的静水压强方向总是垂直于受压面，并指向受压面内部，这是流体不能承受拉应力的体现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "静止流体中，因流体不能承受拉应力，所以任意点静水压强方向垂直受压面且指向内部。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236821", "t": 3, "q": "明渠均匀流的水力坡度J、水面坡度J_w和渠道底坡i三者相等，这是明渠均匀流的重要水力特性，也是判断均匀流的依据之一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "明渠均匀流是等深、等速流，其水面线与渠底线平行，故水力坡度、水面坡度和渠道底坡三者相等，这是其重要特性，也是判断依据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236822", "t": 3, "q": "达西定律v=kJ适用于所有类型的渗流，无论是层流渗流还是紊流渗流，只要知道渗透系数k和水力坡度J，就能计算渗流速度v。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "达西定律v = kJ只适用于层流渗流，不适用于紊流渗流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236823", "t": 3, "q": "对于矩形断面明渠，当流量Q和渠道底宽b一定时，临界水深h_k随重力加速度g的增大而减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "矩形断面明渠临界水深公式「test/yiwen_img/importSubject/2035637081472110592.png」（q = Q/b），当Q和b一定时，q为定值，「test/yiwen_img/importSubject/2035637081555996672.png」与g的立方根成反比，所以g增大「test/yiwen_img/importSubject/2035637081555996672.png」减小，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236824", "t": 3, "q": "实际流体的伯努利方程中，由于存在水头损失，因此下游断面的总机械能一定小于上游断面的总机械能，总水头线沿程单调下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "实际流体有黏性，流动中存在水头损失，会使机械能减少，总水头线反映总机械能，所以下游断面总机械能小于上游，总水头线沿程单调下降。", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236825", "t": 3, "q": "流体的密度ρ是指单位体积流体的质量，它是一个常数，对于同一种流体，无论温度和压强如何变化，ρ都保持不变。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流体密度会随温度和压强变化，并非常数，比如气体热胀冷缩，温度变化时密度改变，液体在不同压强下密度也会有细微变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236826", "t": 3, "q": "明渠非均匀流中，当渠道为缓坡（i<i_k）且实际水深h大于正常水深h0时，水面曲线为a型壅水曲线，此时水面线沿程上升。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "缓坡渠道（i<i_k）中，h>h0>hk，属于a区，a区水面曲线是a型壅水曲线，壅水曲线水面沿程上升。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236827", "t": 3, "q": "圆管内的流动，当雷诺数Re=1500时，水流一定为层流;当Re=2500时，水流一定为紊流。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "圆管内流动，Re≤2000 时为层流，Re＞2000 时为紊流。1500 小于 2000 是层流，2500 大于 2000 是紊流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236828", "t": 3, "q": "挡水建筑物（如大坝）迎水面所受的静水总压力，其作用点（压力中心）的淹没深度h_d总是大于形心的淹没深度h_c，因为压力随深度增大而增大，下方压力对形心的力矩使作用点下移。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "由于静水压力随深度增大而增大，下方压力更大，对形心产生的力矩会使静水总压力作用点（压力中心）下移，所以压力中心淹没深度h_d大于形心淹没深度h_c。", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236829", "t": 3, "q": "有压管流中，当管道末端的阀门缓慢开启时，管道内的水流速度逐渐增大，此时不会产生水击现象，因为水击仅在流速突然变化时才发生。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水击是由于流速突然变化引起的，阀门缓慢开启，水流速度是逐渐增大，不是突然变化，所以不会产生水击现象。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236830", "t": 3, "q": "渗流场中的流网由等势线和流线组成，等势线表示水头相等的点的连线，流线表示渗流速度方向的连线，且等势线与流线处处垂直，相邻等势线之间的水头差相等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流网就是由等势线和流线组成，等势线是水头相等点连线，流线代表渗流速度方向，二者处处垂直，且相邻等势线间水头差相等，这是流网的基本性质。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236831", "t": 3, "q": "牛顿流体是指满足牛顿内摩擦定律的流体，其切应力τ与速度梯度du/dy的关系为一条过原点的直线，如空气、水、泥浆均属于牛顿流体。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "空气和水属于牛顿流体，但泥浆是典型的非牛顿流体，不满足牛顿内摩擦定律。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236832", "t": 3, "q": "明渠水流的水力半径R是过水断面面积A与湿周χ的比值，R越大，表明水流与渠道壁面的接触面积相对越小，水流阻力越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水力半径定义就是过水断面面积A与湿周χ比值，R越大意味着湿周相对面积越小，即水流与壁面接触面积相对小，水流阻力就小。", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236833", "t": 3, "q": "在静水力学中，相对压强是以当地大气压为基准的压强，当相对压强为正值时，表明该点的绝对压强大于大气压，此时该点存在真空度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "相对压强为正值时，绝对压强大于大气压，但存在真空度意味着绝对压强小于大气压，所以此说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236834", "t": 3, "q": "有压管流的过流能力主要取决于管道的管径、长度、粗糙系数以及管道两端的水头差，管径越大、水头差越大，过流能力越强;管道越长、粗糙系数越大，过流能力越弱。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据有压管流相关知识，管径大利于水流通过、水头差是水流动力，二者增大能增强过流能力；管道长和粗糙系数大会增加水流阻力，使过流能力减弱。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236835", "t": 3, "q": "明渠水流中，当水流从急流过渡到缓流时，一定会发生水跃现象;而当水流从缓流过渡到急流时，一定会发生水跌现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236836", "t": 3, "q": "流体的黏性是流体抵抗剪切变形的能力，黏性越大的流体，在相同速度梯度下产生的切应力越大，流动时的能量损失也越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流体黏性定义就是抵抗剪切变形能力，由牛顿内摩擦定律，黏性大在相同速度梯度下切应力大，而黏性大阻碍流体流动，能量损失也大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236837", "t": 3, "q": "对于承压井（有压井），当井中水位上升到含水层顶板以上时，井的出水量与井中水位上升高度（超过顶板的高度）成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "承压井出水量与水位上升高度并非简单的正比关系，其受多种因素如含水层渗透系数、井半径、影响半径等制约。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236838", "t": 3, "q": "圆管层流的流速分布为抛物线型，最大流速位于管轴处，其值为平均流速的2倍;而圆管紊流的流速分布为对数曲线型，最大流速与平均流速的比值约为1.1~1.3。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "圆管层流流速呈抛物线分布，管轴处流速最大且为平均流速2倍；圆管紊流流速呈对数曲线分布，最大流速与平均流速比值约1.1 - 1.3 。", "ap": [false, false, false, false, false, false]}, {"id": "2035637086828236839", "t": 3, "q": "明渠均匀流只能在棱柱形渠道（断面形状、尺寸沿程不变）中形成，非棱柱形渠道因断面沿程变化，无法形成均匀流。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "明渠均匀流要求渠道的底坡、断面形状尺寸、粗糙系数等沿程不变，棱柱形渠道满足这些条件可形成均匀流，非棱柱形渠道断面沿程变化，不满足均匀流形成条件。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第2章 水利与水电||第1节 工程测量学基础", "n": "第2章 水利与水电 / 第1节 工程测量学基础", "qs": [{"id": "2035637090582138880", "t": 1, "q": "在水利水电工程水准测量中，若某水准尺的尺长误差为系统性误差，且该误差在水准路线中对高差观测值的影响与下列哪个因素直接相关", "a": ["水准尺的读数次数", "水准路线的测站数", "水准尺的使用温度", "水准路线的总长度", "", ""], "r": "D", "e": "在水利水电工程水准测量中，水准尺的尺长误差属于系统性误差。系统性误差对高差观测值的影响通常与测量的累积长度或测站数有关。具体来说： A选项“水准尺的读数次数”主要影响的是测量的精度，而不是系统误差的累积。 B选项“水准路线的测站数”虽然与测量的累积有关，但系统误差更多地与总的测量距离相关。 C选项“水准尺的使用温度”会影响尺子的长度，但这属于环境因素的影响，不是直接决定系统性误差累积的因素。 D选项“水准路线的总长度”直接决定了系统性误差的累积程度，因为系统误差通常是按比例随距离增加而累积的。因此，正确答案是D选项：“水准路线的总长度”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138881", "t": 1, "q": "全站仪在水利水电工程进行距离测量时，若采用相位法测量原理，其测量的距离是指", "a": ["全站仪望远镜中心到目标反射棱镜中心的斜距", "全站仪望远镜中心到目标点的水平距离", "全站仪测站点到目标点的垂直距离", "全站仪测站点到目标点的直线距离（不考虑仪器和棱镜高度）", "", ""], "r": "A", "e": "相位法测量的是全站仪望远镜中心到目标反射棱镜中心的斜距。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138882", "t": 1, "q": "在水利水电工程平面控制网优化设计中，若某控制网的主要精度指标为点位中误差，下列哪种措施能最有效地降低点位中误差", "a": ["增加控制网的观测次数", "提高观测仪器的精度等级", "增加控制网的多余观测数", "优化控制网的图形结构（如缩短边长、增加传距角）", "", ""], "r": "D", "e": "优化控制网图形结构能从根本上改善控制网的几何条件，对降低点位中误差效果最显著。增加观测次数、提高仪器精度等级、增加多余观测数虽也能提高精度，但不如优化图形结构有效。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138883", "t": 1, "q": "在水利水电工程地形图应用中，若要确定某水库坝址处的汇水面积，应采用的主要方法是", "a": ["在地形图上量取坝轴线处的断面面积，结合坝高计算", "在地形图上沿坝轴线上游，根据等高线的分水线勾绘汇水边界，再量算边界内面积", "根据地形图上的高程点，采用加权平均法计算汇水范围", "在地形图上量取坝址上下游的水位差，结合流域平均坡度计算", "", ""], "r": "B", "e": "汇水面积是指雨水流向同一山谷地面的受雨面积，需沿坝轴线上游按等高线分水线勾绘汇水边界，再量算边界内面积。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138884", "t": 1, "q": "在水利水电工程施工测量中，若采用前方交会法放样某点Q，已知两个已知点A、B的坐标分别为(xA,yA)、(xB,yB)，测得∠QAB=α、∠QBA=β，则计算Q点坐标时，不需要用到的公式或参数是", "a": ["三角形内角和为180°", "正弦定理（AQ/sinβ=BQ/sinα=AB/sin(180°-α-β)）", "坐标正算公式（根据方位角和距离算坐标）", "坐标反算公式（根据两点坐标算方位角和距离）", "", ""], "r": "D", "e": "前方交会法是利用两个已知点和两个角度来确定待定点坐标。先由三角形内角和求出∠AQB，再用正弦定理算出AQ、BQ距离，最后用坐标正算求Q点坐标，而坐标反算用于根据两点坐标求方位角和距离，本题不需要此步骤。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138885", "t": 1, "q": "在水利水电工程水准测量中，若某测站的后视读数为a，前视读数为b，仪器高为i，水准尺立尺点的高程为H，则该测站仪器视线高程Hi的正确计算公式是", "a": ["Hi=H后视+a", "Hi=H前视+b", "Hi=H后视+i", "Hi=H前视+i", "", ""], "r": "A", "e": "仪器视线高程是后视点高程加上后视读数。后视点高程用H后视表示，后视读数为a，所以Hi = H后视 + a。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138886", "t": 1, "q": "在水利水电工程水准测量中，若某附合水准路线的测段数为n，各测段高差观测值为hi，路线起点和终点的已知高程分别为H始和H终，则该附合水准路线的高差闭合差fh的正确计算公式是", "a": ["fh=Σhi-(H终-H始)", "fh=(H终-H始)-Σhi", "fh=Σhi+(H终-H始)", "fh=Σhi-(H始-H终)", "", ""], "r": "A", "e": "附合水准路线高差闭合差是实测高差总和与理论高差的差值，理论高差为终点高程减起点高程即H终 - H始，实测高差总和是Σhi，所以高差闭合差fh =Σhi - (H终 - H始)。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138887", "t": 1, "q": "全站仪在水利水电工程测量中进行角度观测时，若要消除或减弱竖轴倾斜误差对水平角观测的影响，应采取的主要措施是", "a": ["进行盘左盘右观测取平均值", "精确整平仪器并使用竖轴倾斜补偿器", "调整望远镜视准轴与横轴的垂直度", "定期对仪器进行检定校准", "", ""], "r": "B", "e": "竖轴倾斜误差无法通过盘左盘右观测消除，调整视准轴与横轴垂直度不能解决竖轴倾斜问题，定期检定校准不能实时减弱该误差。而精确整平仪器可减少竖轴倾斜，使用竖轴倾斜补偿器能对倾斜进行补偿，从而消除或减弱竖轴倾斜误差对水平角观测的影响。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138888", "t": 1, "q": "在水利水电工程平面控制网布设中，某三角网采用三角形闭合差来检验观测质量，若某三角形的三个内角观测值分别为∠A、∠B、∠C，该三角形的角度闭合差fβ的计算及调整原则是", "a": ["fβ=∠A+∠B+∠C-180°，按观测角的测角中误差反比例分配", "fβ=180°-(∠A+∠B+∠C)，按观测角的测角中误差正比例分配", "fβ=∠A+∠B+∠C-180°，按各观测角的个数平均分配", "fβ=∠A+∠B+∠C-180°，按观测角的测角中误差正比例分配", "", ""], "r": "D", "e": "三角形角度闭合差是三个内角观测值之和减 180°。闭合差调整一般按测角中误差正比例分配，因为测角中误差大，观测精度低，应多分配闭合差。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138889", "t": 1, "q": "水利水电工程地形图测绘中，若采用等高线表示地形起伏，某区域等高距为2m，某条等高线的高程为100m，相邻两条等高线之间的水平距离（平距）为50m，则该区域此段的地面坡度i（以千分比表示）为", "a": ["2‰", "4‰", "20‰", "40‰", "", ""], "r": "D", "e": "地面坡度i=等高距/平距，已知等高距为2m，平距为50m，i = 2÷50 = 0.04，化为千分比是40‰。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138890", "t": 1, "q": "在水利水电工程施工放样中，若采用极坐标法放样某点P的平面位置，已知测站点A的坐标为(xA,yA)，定向点B的坐标为(xB,yB)，测得A到P的水平距离为D，AP与AB的水平夹角为α，则P点坐标(xP,yP)的正确计算公式是", "a": ["xP=xA+D×cos(αAB+α)，yP=yA+D×sin(αAB+α)（αAB为AB的坐标方位角）", "xP=xA+D×sin(αAB+α)，yP=yA+D×cos(αAB+α)", "xP=xA+D×cos(α-αAB)，yP=yA+D×sin(α-αAB)", "xP=xA+D×cosα，yP=yA+D×sinα", "", ""], "r": "A", "e": "极坐标法求P点坐标，P点相对于A点的坐标增量需考虑AB方位角与夹角α。根据坐标增量计算原理，P点横坐标是A点横坐标加上A到P的水平距离乘以AP方向与x轴夹角的余弦值，纵坐标同理。AP与x轴夹角为AB方位角加上夹角α。所以P点坐标计算公式为xP = xA + D×cos(αAB + α)，yP = yA + D×sin(αAB + α) 。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138891", "t": 1, "q": "在水利水电工程角度测量中，若某水平角观测采用测回法，共观测3个测回，各测回的水平角观测值分别为β1、β2、β3，测回间较差的限差为±12″，则下列哪种情况说明观测成果合格", "a": ["|β1-β2|=8″，|β2-β3|=10″，|β1-β3|=15″", "|β1-β2|=10″，|β2-β3|=11″，|β1-β3|=20″", "|β1-β2|=9″，|β2-β3|=12″，|β1-β3|=21″", "|β1-β2|=11″，|β2-β3|=11″，|β1-β3|=22″", "", ""], "r": "A", "e": "在水利水电工程角度测量中，采用测回法进行水平角观测时，通常需要进行多测回观测以提高精度。各测回之间的观测值应满足一定的限差要求，以确保观测成果的可靠性。本题中，共观测了3个测回，各测回的水平角观测值分别为β1、β2、β3，测回间较差的限差为±12″。我们需要判断哪种情况下观测成果合格。根据限差要求，任意两个测回之间的较差应满足|βi - βj| ≤ 12″，其中i和j表示不同的测回编号。我们逐个分析选项：A选项：|β1-β2|=8″，|β2-β3|=10″，|β1-β3|=15″。其中，|β1-β3|=15″超过了限差±12″，因此不合格。B选项：|β1-β2|=10″，|β2-β3|=11″，|β1-β3|=20″。其中，|β1-β3|=20″超过了限差±12″，因此不合格。C选项：|β1-β2|=9″，|β2-β3|=12″，|β1-β3|=21″。其中，|β1-β3|=21″超过了限差±12″，因此不合格。D选项：|β1-β2|=11″，|β2-β3|=11″，|β1-β3|=22″。所有较差均在限差±12″以内，因此合格。综上所述，只有D选项满足所有测回间较差的限差要求，观测成果合格。所以，正确答案是A选项。", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138892", "t": 1, "q": "在水利水电工程地形图测绘中，若采用全站仪数字化测图，其碎部点测量时，不需要记录的信息是", "a": ["碎部点的三维坐标（x,y,H）", "碎部点的属性（如房屋角点、道路边线、地貌点）", "碎部点与相邻点的连接关系", "碎部点的观测时间", "", ""], "r": "D", "e": "全站仪数字化测图碎部点测量主要关注坐标、属性及连接关系以成图，观测时间对成图无直接作用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138893", "t": 1, "q": "在水利水电工程测量误差分析中，若某观测值的偶然误差服从正态分布，其标准差为σ，则该观测值的中误差m与σ的关系是", "a": ["m=σ/√2", "m=σ", "m=2σ", "m=σ²", "", ""], "r": "B", "e": "在测量误差分析里，当观测值的偶然误差服从正态分布时，中误差和标准差在数值上是相等的。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138894", "t": 1, "q": "在水利水电工程施工放样中，若某大坝的坝轴线为曲线，采用偏角法进行放样，其核心原理是利用", "a": ["曲线的偏角与曲线长度的线性关系", "曲线的偏角与曲线半径的反比关系", "曲线的偏角与弦长的对应关系", "曲线的偏角与圆心角的两倍关系", "", ""], "r": "C", "e": "偏角法是通过测设曲线的偏角和弦长来放样曲线，核心是利用曲线的偏角与弦长的对应关系。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138895", "t": 1, "q": "在水利水电工程水准测量中，若某三等水准路线的高差闭合差限差为±12√L mm（L为路线长度，单位km），某路线长度为4km，则该路线的高差闭合差限差为", "a": ["±12mm", "±24mm", "±36mm", "±48mm", "", ""], "r": "B", "e": "将路线长度L = 4km代入高差闭合差限差公式「test/yiwen_img/importSubject/2035637087750983680.png」，即「test/yiwen_img/importSubject/2035637087994253312.png」。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138896", "t": 1, "q": "全站仪在水利水电工程进行角度观测时，若仪器的视准轴误差为c，当观测某一水平角时，盘左观测值为β左，盘右观测值为β右，则消除视准轴误差后的水平角观测值β为", "a": ["β=(β左+β右)/2", "β=(β左-β右)/2", "β=β左-c", "β=β右+c", "", ""], "r": "A", "e": "视准轴误差可通过盘左盘右取平均来消除，即消除视准轴误差后的水平角观测值为盘左、盘右观测值的平均值。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138897", "t": 1, "q": "在水利水电工程平面控制网中，若采用GNSS（GPS）测量，其布设的首级控制网通常属于", "a": ["三角网", "导线网", "边角网", "大地控制网", "", ""], "r": "D", "e": "GNSS（GPS）测量布设的首级控制网是基于大地坐标系统的，属于大地控制网。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138898", "t": 1, "q": "在水利水电工程地形图测绘中，若某地形图的比例尺为1:2000，等高距为2m，某一陡崖处相邻等高线重合，该陡崖的相对高度H的范围是", "a": ["H≥2m", "2m≤H<4m", "4m≤H<6m", "H≥6m", "", ""], "r": "B", "e": "陡崖相对高度计算公式为(n - 1)d ≤ H < (n + 1)d，n为重合等高线条数，这里相邻等高线重合，n = 2，d为等高距2m，代入得2m ≤ H < 6m ，结合选项B更符合。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138899", "t": 1, "q": "在水利水电工程施工测量中，若对某混凝土建筑物的高程放样采用水准测量法，已知放样点的设计高程为H设，水准点的已知高程为H已知，水准仪在水准点处的读数为a，在放样点处的读数为b，则放样时应使水准尺在放样点处的读数为", "a": ["b=H已知+a-H设", "b=H设+a-H已知", "b=H已知+a+H设", "b=H设-H已知-a", "", ""], "r": "A", "e": "根据水准测量原理，H已知 + a = H设 + b，移项可得b = H已知 + a - H设。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138900", "t": 1, "q": "在水利水电工程水准测量误差分析中，下列哪种误差属于偶然误差", "a": ["水准尺的尺长误差", "水准仪的i角误差", "水准测量中的读数误差", "水准路线的地球曲率影响", "", ""], "r": "C", "e": "偶然误差是在相同观测条件下，对某一量进行一系列观测，误差出现的符号和大小都表现出偶然性。读数误差受观测者主观因素等影响，其大小和符号不确定，属于偶然误差。而尺长误差、i角误差、地球曲率影响是有规律可寻的，属于系统误差。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138901", "t": 1, "q": "全站仪在水利水电工程测量中，若要测量某点的高程，已知测站点高程为H站，仪器高为i，棱镜高为v，测得的斜距为D，垂直角为α，则该点的高程H点的正确计算公式是", "a": ["H点=H站+i+D×sinα-v", "H点=H站+i+D×cosα-v", "H点=H站-i+D×sinα+v", "H点=H站-i+D×cosα+v", "", ""], "r": "A", "e": "根据全站仪测量高程原理，目标点高程等于测站点高程加上仪器高，再加上斜距与垂直角正弦值的乘积，最后减去棱镜高。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138902", "t": 1, "q": "在水利水电工程平面控制网观测中，若某导线网的一条附合导线，其角度闭合差和坐标增量闭合差均已满足限差要求，对坐标增量闭合差的调整原则是", "a": ["按导线各边的边长正比例分配", "按导线各边的测角中误差反比例分配", "按导线各测站的观测次数平均分配", "按导线各边的坐标方位角正比例分配", "", ""], "r": "A", "e": "导线坐标增量闭合差调整原则是按导线各边的边长正比例分配。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138903", "t": 1, "q": "在水利水电工程地形图应用中，若要计算某一不规则地块的面积，采用坐标法时，已知地块边界转折点的坐标依次为(x1,y1)、(x2,y2)、...、(xn,yn)，则面积S的计算公式是", "a": ["S=1/2|Σ(xi yi+1-xi+1 yi)|（x n+1=x1，y n+1=y1）", "S=Σ(xi yi+1-xi+1 yi)（x n+1=x1，y n+1=y1）", "S=1/2|Σ(xi+xi+1)(yi-yi+1)|（x n+1=x1，y n+1=y1）", "S=1/2Σ|xi yi+1-xi+1 yi|（x n+1=x1，y n+1=y1）", "", ""], "r": "A", "e": "计算不规则地块面积用坐标法的公式是「test/yiwen_img/importSubject/2035637088082333696.png」（「test/yiwen_img/importSubject/2035637088166219776.png」，「test/yiwen_img/importSubject/2035637088237522944.png」）。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138904", "t": 1, "q": "在水利水电工程施工放样中，若采用归化法放样某点的平面位置，其主要特点是", "a": ["直接根据设计坐标计算放样数据，一次放样到位", "先放样出该点的近似位置，再通过测量修正，将该点归化到设计位置", "无需使用测量仪器，仅根据已有控制点的相对位置放样", "适用于精度要求较低的放样工作", "", ""], "r": "B", "e": "归化法是先粗略放样出点的近似位置，再精确测量并修正，将点归化到设计位置。A选项是直接放样法特点；C选项不用测量仪器无法进行放样；归化法适用于精度要求高的工作。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138905", "t": 1, "q": "在水利水电工程水准测量中，若某水准路线为闭合水准路线，其高差闭合差fh的理论值应为", "a": ["fh=0", "fh=Σhi", "fh=H终-H始", "fh=H始-H终", "", ""], "r": "A", "e": "闭合水准路线是从已知水准点出发，沿路线进行水准测量，最后又回到原已知水准点上。由于起点和终点是同一点，理论上测量的高差总和应为0，即高差闭合差fh理论值为0。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138906", "t": 1, "q": "在水利水电工程GNSS测量中，若采用静态相对定位模式，其主要用于下列哪种控制网的布设", "a": ["施工放样控制网", "碎部测量控制网", "首级大地控制网", "临时水准点控制网", "", ""], "r": "C", "e": "静态相对定位精度高但观测时间长，首级大地控制网对精度要求高，适合用此模式。施工放样控制网、碎部测量控制网和临时水准点控制网有不同需求和特点，一般不首选该模式。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138907", "t": 1, "q": "在水利水电工程地形图测绘中，若某地物的轮廓边界为折线，其碎部点的选择应主要考虑", "a": ["地物边界上的转折点（如角点）", "地物边界上的任意点", "地物中心线上的点", "地物边缘的中点", "", ""], "r": "A", "e": "测绘折线轮廓地物时，转折点能确定地物形状，选转折点作为碎部点可准确描绘地物。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138908", "t": 1, "q": "在水利水电工程测量误差处理中，若对某一观测值进行多次等精度观测，其算术平均值的中误差m平与单次观测值的中误差m的关系是", "a": ["m平=m/n（n为观测次数）", "m平=m/√n", "m平=m×n", "m平=m×√n", "", ""], "r": "B", "e": "根据测量误差理论，等精度观测时，算术平均值的中误差与单次观测值中误差关系为m平=m/√n 。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547200", "t": 2, "q": "在水利水电工程水准测量中，影响高差观测精度的系统性误差主要包括（　）", "a": ["水准尺的尺长误差", "水准仪的i角误差", "水准测量中的读数误差", "水准路线的地球曲率影响", "水准尺的温度变形误差", ""], "r": "ABDE", "e": "系统性误差是有规律的误差。A选项水准尺尺长误差、B选项水准仪i角误差、D选项地球曲率影响、E选项水准尺温度变形误差都有一定规律，属于系统性误差；而C选项读数误差是偶然的，属于偶然误差。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547201", "t": 2, "q": "全站仪在水利水电工程测量中的主要功能包括（　）", "a": ["水平角测量", "竖直角测量", "斜距测量", "高程测量（三角高程）", "地形图绘制（需配合软件）", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547202", "t": 2, "q": "在水利水电工程平面控制网布设中，导线网相比三角网具有的优点包括（　）", "a": ["受地形条件限制小，适合地形复杂区域", "布设灵活，可根据工程需求调整边长和形状", "观测工作量少，效率高", "图形强度高，点位中误差小", "无需测量水平角，仅需测量距离", ""], "r": "ABC", "e": "导线网受地形条件限制小，布设灵活，观测工作量相对少、效率高；三角网图形强度高、点位中误差小，导线网需测水平角和距离。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547203", "t": 2, "q": "在水利水电工程地形图应用中，等高线的基本特性包括（　）", "a": ["同一条等高线上各点的高程相等", "等高线为闭合曲线，若在图内不闭合，必在图外闭合", "等高线与分水线、合水线垂直相交", "相邻等高线之间的水平距离（平距）与地面坡度成正比", "等高线不能相交（陡崖处重合，非相交）", ""], "r": "ABCE", "e": "A选项，同一条等高线上各点高程相等是等高线基本特性；B选项，等高线为闭合曲线，图内不闭合就在图外闭合；C选项，等高线与分水线、合水线垂直相交；E选项，等高线一般不相交，陡崖处重合。而D选项，相邻等高线平距与地面坡度成反比，不是正比。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547204", "t": 2, "q": "在水利水电工程施工放样中，常用的平面放样方法包括（　）", "a": ["极坐标法", "前方交会法", "后方交会法", "归化法", "水准测量法", ""], "r": "ABCD", "e": "水准测量法是高程测量方法，不是平面放样方法，A极坐标法、B前方交会法、C后方交会法、D归化法都是常用平面放样方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547205", "t": 2, "q": "在水利水电工程测量误差分析中，偶然误差的基本特性包括（　）", "a": ["在一定观测条件下，偶然误差的绝对值不会超过一定限值", "绝对值小的误差出现的频率大，绝对值大的误差出现的频率小", "绝对值相等的正误差和负误差出现的频率大致相等", "偶然误差的算术平均值随着观测次数的无限增加而趋近于零", "偶然误差的大小与观测时间成正比", ""], "r": "ABCD", "e": "偶然误差具有四个特性，分别是有限性（A选项）、集中性（B选项）、对称性（C选项）、抵偿性（D选项），而偶然误差大小与观测时间无关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547206", "t": 2, "q": "在水利水电工程GNSS测量中，影响定位精度的主要因素包括（　）", "a": ["卫星星历误差", "电离层和对流层延迟误差", "多路径效应误差", "接收机钟差误差", "观测者的读数误差", ""], "r": "ABCD", "e": "水利水电工程GNSS测量中，卫星星历误差、电离层和对流层延迟误差、多路径效应误差、接收机钟差误差都会影响定位精度，而GNSS测量自动化程度高，一般不存在观测者读数误差。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741504", "t": 2, "q": "在水利水电工程水准测量中，水准路线的布设形式主要包括（　）", "a": ["附合水准路线", "闭合水准路线", "支水准路线", "环形水准路线", "交叉水准路线", ""], "r": "ABC", "e": "水利水电工程水准测量中，水准路线常见布设形式有附合、闭合和支水准路线。环形和交叉不是主要形式。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741505", "t": 2, "q": "在水利水电工程角度测量中，水平角观测的主要误差来源包括（　）", "a": ["仪器误差（如视准轴误差、横轴误差）", "观测误差（如瞄准误差、读数误差）", "外界条件影响（如风力、温度变化）", "目标偏心误差", "测站点偏心误差", ""], "r": "ABCDE", "e": "水平角观测误差来源多样，仪器自身有误差，观测操作会产生误差，外界环境会造成影响，目标和测站点偏心也会带来误差。ABCDE选项都涵盖了常见的误差来源。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741506", "t": 2, "q": "在水利水电工程地形图测绘中，碎部测量的主要内容包括（　）", "a": ["地物测量（如建筑物、道路、水系）", "地貌测量（如等高线、陡崖、冲沟）", "控制点测量（如水准点、导线点）", "坐标网绘制", "比例尺标注", ""], "r": "AB", "e": "碎部测量是测绘地物和地貌的作业，A选项地物测量和B选项地貌测量属于碎部测量内容。C选项控制点测量是为碎部测量提供控制基础，不是碎部测量主要内容；D选项坐标网绘制和E选项比例尺标注是地形图绘制相关操作，并非碎部测量主要内容。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741507", "t": 2, "q": "在水利水电工程施工测量中，高程放样的常用方法包括（　）", "a": ["水准测量法", "三角高程测量法", "气压高程测量法", "视距测量法", "GNSS高程测量法", ""], "r": "ABDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741508", "t": 2, "q": "在水利水电工程平面控制网观测中，导线测量的观测内容主要包括（　）", "a": ["各导线边的水平距离", "各导线点的水平角（左角或右角）", "各导线点的竖直角", "各导线边的垂直距离", "起始边的坐标方位角", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741509", "t": 2, "q": "在水利水电工程水准测量中，水准尺的正确使用方法包括（　）", "a": ["水准尺应竖直立放，避免倾斜", "水准尺应立在坚实地面或尺垫上", "水准尺读数时应读取尺上注记的实际长度（考虑尺长改正）", "水准尺使用前应检查是否有弯曲、损坏", "水准尺在强光下使用时，应遮挡阳光避免读数误差", ""], "r": "ABDE", "e": "水准尺的正确使用对于水利水电工程水准测量至关重要。以下是对各选项的简要A. 水准尺应竖直立放，避免倾斜。这是因为倾斜会导致读数不准确，从而影响测量结果的精确性。B. 水准尺应立在坚实地面或尺垫上。这是为了确保水准尺稳定，防止因地面不稳而产生的误差。C. 此选项提到读取尺上注记的实际长度并考虑尺长改正。然而，在常规水准测量中，我们更关注的是尺上的刻度值，而不是尺的实际长度。尺长改正通常是在仪器校准过程中考虑，而不是每次测量时都进行。D. 水准尺使用前应检查是否有弯曲、损坏。这是确保测量准确性的基本步骤，损坏的尺子会导致读数偏差。E. 水准尺在强光下使用时，应遮挡阳光避免读数误差。强光可能导致尺面反光，影响读数的准确性。综上所述，除了C选项外，其他选项都是水准尺的正确使用方法。所以，正确答案是ABDE。", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741510", "t": 2, "q": "在水利水电工程全站仪操作中，进行角度测量前的准备工作包括（　）", "a": ["仪器安置（对中、整平）", "棱镜安置（对中、整平，若为角度观测需瞄准目标）", "仪器参数设置（如角度单位、小数位数）", "后视定向（设置起始方向的方位角或水平角）", "距离测量模式选择", ""], "r": "ABCD", "e": "角度测量前要先安置好仪器并对中、整平，棱镜也需安置好，同时要设置仪器参数，完成后视定向。而距离测量模式选择与角度测量准备无关。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741511", "t": 2, "q": "在水利水电工程地形图应用中，确定某点的高程可采用的方法包括（　）", "a": ["根据等高线内插（如线性内插法）", "根据附近高程点采用加权平均法", "根据等高线的平距计算", "根据地形图的比例尺计算", "根据地物的高度推算", ""], "r": "AB", "e": "确定某点高程，可依据等高线用内插法，也能根据附近高程点用加权平均法。等高线平距用于坡度计算；地形图比例尺用于距离等计算；地物高度与所求点高程无直接关联。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741512", "t": 2, "q": "在水利水电工程测量数据处理中，偶然误差的处理方法包括（　）", "a": ["采用多次等精度观测取算术平均值", "采用加权平均法处理不同精度观测值", "采用残差计算观测值的中误差", "采用系统误差改正数消除误差影响", "采用误差传播定律计算间接观测值的精度", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741513", "t": 2, "q": "在水利水电工程GNSS测量中，静态相对定位的观测要求包括（　）", "a": ["观测期间，接收机位置保持固定", "观测期间，卫星高度角应大于15°（避免低仰角卫星信号误差）", "观测时间应根据控制网精度要求确定（如首级网需数小时）", "观测期间，避免在接收机附近出现强电磁干扰源", "观测结束后，无需记录观测数据的时间信息", ""], "r": "ABCD", "e": "静态相对定位观测时接收机位置要固定，卫星高度角需大于15°以减少误差，观测时间依控制网精度定，且要避免强电磁干扰，同时观测结束后必须记录观测数据时间信息。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741514", "t": 2, "q": "在水利水电工程水准测量中，水准路线的高差闭合差调整原则包括（　）", "a": ["附合水准路线按测段长度正比例分配", "闭合水准路线按测段长度正比例分配", "支水准路线按测段数平均分配", "附合水准路线按测站数正比例分配", "闭合水准路线按测站数平均分配", ""], "r": "ABD", "e": "附和、闭合水准路线高差闭合差调整，可按测段长度或测站数正比例分配；支水准路线需往返观测，不存在高差闭合差调整问题。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741515", "t": 2, "q": "在水利水电工程角度测量中，测回法观测水平角的操作步骤包括（　）", "a": ["盘左观测:瞄准左目标，读数;瞄准右目标，读数", "盘右观测:瞄准右目标，读数;瞄准左目标，读数", "计算盘左盘右的水平角观测值", "计算盘左盘右观测值的差值，检查是否超限", "计算各测回的平均水平角", ""], "r": "ABCDE", "e": "测回法测水平角，先盘左测左、右目标读数，再盘右测右、左目标读数，之后算盘左盘右水平角观测值，检查二者差值是否超限，最后算各测回平均水平角。答案涵盖了测回法完整操作流程。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741516", "t": 2, "q": "在水利水电工程地形图测绘中，地形图的精度指标主要包括（　）", "a": ["地物点的平面位置中误差", "地物点的高程中误差", "等高线的高程中误差", "地形图的比例尺精度", "地形图的图幅大小", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741517", "t": 2, "q": "在水利水电工程施工放样中，影响放样精度的主要因素包括（　）", "a": ["控制点的精度", "放样方法的选择", "测量仪器的精度", "观测者的操作技能", "外界环境条件（如温度、风力）", ""], "r": "ABCDE", "e": "施工放样精度受多方面因素影响，控制点精度、放样方法、测量仪器精度、观测者技能和外界环境条件都会对其产生作用。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741518", "t": 2, "q": "在水利水电工程平面控制网优化中，控制网的多余观测数对控制网的影响包括（　）", "a": ["多余观测数越多，控制网的可靠性越高", "多余观测数越多，控制网的精度越高", "多余观测数越多，观测工作量越大", "多余观测数越多，控制网的图形强度越高", "多余观测数为零，控制网为无多余观测的自由网", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741519", "t": 2, "q": "在水利水电工程水准测量中，水准仪的i角误差对高差观测值的影响规律包括（　）", "a": ["i角误差对高差的影响与测站的前后视距差成正比", "i角误差对高差的影响与测站的前后视距之和成正比", "在一个测站中，若前后视距相等，可消除i角误差影响", "附合水准路线中，i角误差的总影响与路线的总视距差成正比", "闭合水准路线中，i角误差的总影响为零", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741520", "t": 2, "q": "在水利水电工程全站仪距离测量中，影响斜距测量精度的主要误差包括（　）", "a": ["仪器的加常数和乘常数误差", "大气折射率变化引起的误差", "观测者的瞄准误差", "棱镜的对中误差", "仪器的竖轴倾斜误差", ""], "r": "ABCD", "e": "在水利水电工程全站仪距离测量中，关于影响斜距测量精度的主要误差，我们可以从以下几个方面进行简要分析：### 主要误差来源：1. 仪器误差： 仪器的加常数和乘常数误差会影响测量的基本标定。   2. 环境影响： 大气折射率的变化会改变光线的传播路径，从而影响测量精度。3. 操作误差： 观测者的瞄准误差直接影响测量的目标定位准确性。 棱镜的对中误差会导致测量的反射点位置不正确。### 不相关误差： 仪器的竖轴倾斜误差主要影响垂直角测量，而对斜距的影响相对较小，在此背景下可以忽略。### 结论：综上所述，影响斜距测量精度的主要误差包括： 仪器的加常数和乘常数误差（A） 大气折射率变化引起的误差（B） 观测者的瞄准误差（C） 棱镜的对中误差（D）### 正确答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741521", "t": 2, "q": "在水利水电工程地形图应用中，进行土方量计算的常用方法包括（　）", "a": ["等高线法（根据等高线计算体积）", "方格网法（将区域划分方格，计算各方格高差）", "断面法（沿轴线布设断面，计算断面面积再算体积）", "坐标法（根据点位坐标计算体积）", "比例法（根据地形图比例尺估算）", ""], "r": "ABC", "e": "在水利水电工程地形图应用中，土方量计算的方法主要基于地形图的特性。等高线法是通过等高线的分布来计算体积，适用于地形变化较为平缓的区域；断面法是通过沿特定轴线布设断面，计算各断面的面积，然后推算体积，适用于河道、渠道等线性工程；方格网法则是将计算区域划分为方格，通过计算各方格的高差来估算体积，这种方法在地形较为复杂时也适用。而坐标法和比例法并不是土方量计算的常用方法，坐标法更多用于定位和几何计算，比例法则主要用于根据地形图的比例尺进行大致估算，并不直接用于土方量的精确计算。所以，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741522", "t": 2, "q": "在水利水电工程测量中，粗差的检测方法包括（　）", "a": ["采用多余观测法（如闭合差检验）", "采用残差检验法（如3σ准则）", "采用趋势分析法（检查观测值是否符合规律）", "采用对比分析法（与相邻观测值对比）", "采用系统误差改正法", ""], "r": "ABCD", "e": "粗差检测方法是通过一些手段找出测量中的粗大误差。多余观测法可通过闭合差检验发现问题；残差检验法如3σ准则能判断异常值；趋势分析法能查看观测值是否符合规律；对比分析法与相邻观测值对比可发现异常。而系统误差改正法是处理系统误差，并非检测粗差。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741523", "t": 2, "q": "在水利水电工程GNSS测量中，快速静态相对定位的特点包括（　）", "a": ["观测时间短（通常几分钟到十几分钟）", "精度低于静态相对定位", "适用于施工控制网或碎部测量控制网", "无需安置棱镜", "可在运动中进行观测", ""], "r": "ABC", "e": "快速静态相对定位观测时间短，一般几分钟到十几分钟；精度比静态相对定位低；适用于施工控制网或碎部测量控制网；它需在静止状态下观测，且测量时需安置棱镜。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741524", "t": 2, "q": "在水利水电工程水准测量中，水准测量的等级划分依据包括（　）", "a": ["水准路线的长度", "水准测量的精度指标（如每千米高差中误差）", "水准测量的测站数", "水准仪器的精度等级", "工程的重要性和规模", ""], "r": "BE", "e": "水准测量等级的划分主要依据水准测量的精度指标以及工程的重要性和规模。水准路线的长度和测站数虽然与测量过程相关，但它们不是划分水准测量等级的直接依据。水准仪器的精度等级是仪器本身的性能指标，而不是划分水准测量等级的依据。所以，正确答案是BE。", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741525", "t": 2, "q": "在水利水电工程角度测量中，方向观测法与测回法的主要区别包括（　）", "a": ["方向观测法一次观测多个方向，测回法一次观测两个方向", "方向观测法适用于观测三个及以上方向的测站，测回法适用于观测两个方向的测站", "方向观测法需计算归零差，测回法无需计算归零差", "方向观测法的精度高于测回法", "方向观测法的观测工作量少于测回法", ""], "r": "ABC", "e": "方向观测法可一次观测多个方向，适用于三个及以上方向测站，要算归零差；测回法一次观测两个方向，适用于观测两个方向的测站，无需算归零差。精度和工作量两者无绝对高低之分。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637092494741526", "t": 2, "q": "在水利水电工程地形图测绘中，地形图的基本要素包括（　）", "a": ["数学要素（如坐标网、比例尺、图廓）", "地理要素（如地物、地貌）", "注记要素（如地名、高程注记、说明注记）", "辅助要素（如图例、图名、测图日期）", "控制要素（如控制点坐标）", ""], "r": "ABCD", "e": "地形图基本要素涵盖数学、地理、注记、辅助这几方面。数学要素有坐标网等；地理要素含地物地貌；注记要素包括地名等注记；辅助要素如图例等。控制要素并非基本要素。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193472", "t": 3, "q": "在水利水电工程水准测量中，偶然误差的算术平均值随着观测次数的无限增加而趋近于零，因此多次观测取平均值可消除偶然误差的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "偶然误差具有抵偿性，多次观测取平均值能减小偶然误差影响，但不能消除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193473", "t": 3, "q": "全站仪在水利水电工程测量中，采用盘左盘右观测水平角并取平均值，可完全消除竖轴倾斜误差对水平角观测值的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "盘左盘右观测取平均值可消除视准轴误差、横轴误差等影响，但竖轴倾斜误差不能用该方法消除。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193474", "t": 3, "q": "在水利水电工程平面控制网中，三角网的图形强度主要取决于传距角的大小，传距角越接近90°，图形强度越高，点位中误差越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程平面控制网三角网里，传距角接近90°时，图形强度高，点位中误差小，符合相关原理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193475", "t": 3, "q": "水利水电工程地形图中，等高线越密集，表示该区域的地面坡度越小;等高线越稀疏，表示坡度越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在地形图中，等高线越密集，代表单位水平距离内的垂直高差大，地面坡度大；等高线越稀疏，单位水平距离内垂直高差小，坡度小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193476", "t": 3, "q": "在水利水电工程施工放样中，极坐标法放样平面位置时，只需知道测站点坐标、目标点设计坐标，即可计算出放样所需的水平距离和水平角，无需已知定向点坐标。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "极坐标法放样平面位置，除测站点坐标、目标点设计坐标外，还需已知定向点坐标来确定角度基准，才能计算放样所需水
