，对流域历史水文数据进行\"均一化处理\"的主要目的是以下哪项？", "a": ["消除数据采集设备更换、观测环境变化导致的系统误差", "减少水文数据的随机误差", "将不同单位的水文数据统一换算为国际单位", "筛选出符合设计标准的极端水文数据", "", ""], "r": "A", "e": "均一化处理主要是消除因数据采集设备更换、观测环境变化等造成的系统误差，让数据更具一致性和可比性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291017", "t": 1, "q": "智慧水利中，用于识别水电站厂房结构裂缝、闸门变形等微小缺陷的核心技术是以下哪项？", "a": ["高清视频监控技术", "红外热成像技术", "无人机倾斜摄影测量技术", "声发射检测技术", "", ""], "r": "D", "e": "声发射检测技术能捕捉材料变形和断裂产生的应力波，可有效识别水电站厂房结构裂缝、闸门变形等微小缺陷。而高清视频监控、红外热成像、无人机倾斜摄影测量技术在检测此类微小缺陷上不如声发射检测技术精准有效。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291018", "t": 1, "q": "水电站水能规划中，当水电站承担防洪任务时，确定防洪库容的主要依据是以下哪项？", "a": ["流域多年平均降雨量", "设计洪水的洪峰流量与洪水总量", "水电站的死水位", "下游河道的安全泄量", "", ""], "r": "B", "e": "在水电站水能规划中，当水电站承担防洪任务时，确定防洪库容的主要依据是与洪水相关的参数。我们需要考虑哪个选项最直接地反映洪水情况。A. 流域多年平均降雨量：这只是一个平均值，不能直接反映洪水的极端情况。B. 设计洪水的洪峰流量与洪水总量：这直接反映了洪水的极端情况，是确定防洪库容的关键依据。C. 水电站的死水位：这是水电站运行的一个参数，与防洪库容无关。D. 下游河道的安全泄量：这涉及下游河道的承受能力，但不是确定防洪库容的主要依据。综上所述，最直接反映洪水情况并用于确定防洪库容的参数是设计洪水的洪峰流量与洪水总量。所以，正确答案是B选项：“设计洪水的洪峰流量与洪水总量”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291019", "t": 1, "q": "数字水利的\"数据中台\"建设中，对多源异构数据（如水文站Excel数据、监测设备JSON数据、遥感影像数据）进行处理的首要步骤是以下哪项？", "a": ["数据可视化展示", "数据清洗与格式标准化", "数据存储到分布式数据库", "数据关联分析", "", ""], "r": "B", "e": "多源异构数据格式多样且可能存在错误、冗余等问题，首要工作是对其进行清洗并统一格式，为后续处理奠定基础。所以首要步骤是数据清洗与格式标准化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291020", "t": 1, "q": "智慧水利中，\"水量调度智能预警系统\"触发枯水期水量预警的关键指标是以下哪项？", "a": ["流域水库群的总蓄水量低于设计死水位对应的总蓄水量", "主要河道控制断面的流量低于最小生态流量", "水电站的日发电量低于设计保证发电量", "流域降雨量连续15天低于多年同期平均值", "", ""], "r": "B", "e": "枯水期水量预警主要关注河道维持生态的基本水量，主要河道控制断面流量低于最小生态流量意味着可能出现水量不足，会触发预警。A项水库群总蓄水量低不一定影响河道水量；C项发电量与水量预警关联不大；D项降雨量低不一定就导致水量不足到需预警程度。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291021", "t": 1, "q": "水电站水能规划中，进行\"水库兴利调节计算\"时，若采用\"时历法\"，其适用的水文条件是以下哪项？", "a": ["水文数据序列较短（少于20年）", "水文数据序列较长（多于30年）且年际变化大", "水文数据呈明显的周期性变化", "水文数据的随机误差较小", "", ""], "r": "B", "e": "时历法需有较长系列的水文资料，且年际变化大时采用能更好反映水库实际运行情况。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291022", "t": 1, "q": "数字水利中，流域水资源管理模型的\"供需平衡计算\"模块，不包含以下哪项用水需求？", "a": ["农业灌溉用水", "工业生产用水", "水电站发电用水", "河道内生态基流", "", ""], "r": "C", "e": "供需平衡计算主要考虑社会经济用水需求，农业灌溉、工业生产用水属于社会经济用水需求；河道内生态基流是维持河道生态需水。而水电站发电用水主要是利用水的能量转化，不消耗水量，不属于供需平衡计算里的用水需求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291023", "t": 1, "q": "智慧水利监测网络中，当监测点位于偏远山区、无电网供电时，最可靠的供电方式是以下哪项？", "a": ["锂电池定期更换供电", "太阳能光伏+蓄电池供电", "风力发电+蓄电池供电", "柴油发电机供电", "", ""], "r": "B", "e": "偏远山区无电网供电，需考虑供电稳定性和可持续性。锂电池定期更换不便且难保证持续供电；风力发电受风力条件限制；柴油发电机需频繁补充燃料且噪音大。太阳能光伏+蓄电池供电，太阳能普遍存在，蓄电池可储存电能，能稳定可靠供电。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291024", "t": 1, "q": "水电站水能规划中，\"最小出力\"与\"保证出力\"的本质区别是以下哪项？", "a": ["最小出力是瞬时最小出力，保证出力是枯水期平均最小出力", "最小出力由设备限制决定，保证出力由水文条件决定", "最小出力是年平均最小出力，保证出力是日平均最小出力", "最小出力由发电水头决定，保证出力由装机容量决定", "", ""], "r": "A", "e": "最小出力是瞬时最小出力，而保证出力是指水电站在多年运行期间所能提供的符合设计保证率要求的枯水期平均最小出力。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291025", "t": 1, "q": "数字水利中，利用遥感技术（RS）获取流域下垫面信息时，以下哪项信息无法通过光学遥感影像直接获取？", "a": ["流域植被覆盖度", "河道水面宽度", "土壤含水率", "土地利用类型", "", ""], "r": "C", "e": "光学遥感主要基于地物对可见光和近红外光的反射特性成像。土壤含水率无法通过光学遥感影像直接获取，它需借助微波遥感等技术。而流域植被覆盖度、河道水面宽度、土地利用类型可通过光学影像直接分析。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291026", "t": 1, "q": "智慧水利的\"应急指挥系统\"在应对突发性洪水时，首要的决策支持功能是以下哪项？", "a": ["预测洪水演进路径与到达时间", "计算水电站的最大泄洪能力", "统计受洪水威胁的人口数量", "生成应急救援队伍调度方案", "", ""], "r": "A", "e": "应对突发性洪水，要先知道洪水走向和到达时间才能开展后续工作，所以首要决策支持功能是预测洪水演进路径与到达时间。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291027", "t": 1, "q": "水电站水能规划中，当确定水电站装机容量时，若流域内有灌溉、航运等综合用水需求，需优先考虑的约束条件是以下哪项？", "a": ["灌溉用水的时段与水量要求", "航运对河道水位的最低要求", "综合用水总需求量与水电站供水能力的平衡", "灌溉与航运用水的优先级排序", "", ""], "r": "C", "e": "确定水电站装机容量时，有综合用水需求，关键要保证综合用水总需求和水电站供水能力相匹配，这是核心约束。A、B较片面，D本身不是直接约束装机容量的首要条件。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291028", "t": 1, "q": "数字水利中，\"流域水质模拟模型\"的核心输入参数不包括以下哪项？", "a": ["污染物排放源强（如COD排放量）", "河道糙率系数", "水流流速与流量", "水体溶解氧浓度初始值", "", ""], "r": "B", "e": "流域水质模拟模型主要关注与水质相关及影响水流传输污染物的因素。污染物排放源强、水流流速与流量、水体溶解氧浓度初始值都直接影响水质模拟。而河道糙率系数主要用于水动力计算，并非水质模拟模型的核心输入参数。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291029", "t": 1, "q": "智慧水利中，\"水电站设备状态智能诊断系统\"通过分析设备运行数据（如振动、温度、压力）诊断故障，其采用的核心技术是以下哪项？", "a": ["数字滤波技术", "故障树分析技术", "机器学习分类算法", "数据压缩技术", "", ""], "r": "C", "e": "机器学习分类算法可对设备运行数据进行学习和分析，从而诊断故障，是该系统核心。数字滤波主要处理信号噪声；故障树分析多用于系统故障逻辑分析；数据压缩是为减少数据量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291030", "t": 1, "q": "水电站水能规划中，\"多年调节水库\"的主要作用是以下哪项？", "a": ["调节日内流量变化，满足用电负荷波动需求", "调节年内枯水期与汛期水量，保证枯水期供水与发电", "调节年际间水量变化，应对连续枯水年", "调节洪水流量，保障下游防洪安全", "", ""], "r": "C", "e": "多年调节水库可把丰水年多余水量存起来，用于枯水年，主要作用是调节年际间水量变化，应对连续枯水年。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291031", "t": 1, "q": "数字水利中，构建\"流域水资源调度模型\"时，需遵循的\"可持续利用原则\"具体体现为以下哪项约束？", "a": ["水库下泄流量不得低于下游河道最小生态流量", "水电站年发电量不得低于设计保证发电量", "农业灌溉用水保证率不得低于90%", "工业用水价格不得低于生活用水价格", "", ""], "r": "A", "e": "可持续利用原则重点在于保障生态等资源的持续合理利用，A选项中水库下泄流量不低于下游河道最小生态流量，能维持河道生态，体现了水资源可持续利用。B是关于发电指标，C是农业灌溉保证率，D是水价关系，都未直接体现可持续利用核心。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291032", "t": 1, "q": "智慧水利中，\"水文数据同化技术\"的主要作用是以下哪项？", "a": ["将不同水文站的观测数据统一到同一坐标系", "融合观测数据与数值模型模拟结果，提高预报精度", "删除水文数据中的异常值，保证数据可靠性", "将历史水文数据按时间序列排序，便于查询", "", ""], "r": "B", "e": "水文数据同化技术核心是把观测数据和数值模型模拟结果结合起来，进而提升水文预报精度。A是坐标统一工作；C是数据预处理操作；D是数据整理方式。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291033", "t": 1, "q": "水电站水能规划中，计算\"水库死库容\"时，不需要考虑的因素是以下哪项？", "a": ["水库泥沙淤积量", "水电站进水口最低高程", "下游河道生态基流要求", "水库底部设备安装高程", "", ""], "r": "C", "e": "水库死库容是水库正常运用情况下允许消落到的最低水位以下的库容。水库泥沙淤积量、水电站进水口最低高程、水库底部设备安装高程都与确定死水位进而计算死库容有关，而下游河道生态基流要求主要影响水库下泄流量，与死库容计算无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291034", "t": 1, "q": "数字水利中，\"物联网网关\"在监测网络中的作用是以下哪项？", "a": ["采集传感器直接输出的原始数据", "将传感器数据转换为标准通信协议（如MQTT），实现与数据中台的通信", "存储监测数据，防止数据丢失", "分析监测数据，生成初步预警信息", "", ""], "r": "B", "e": "物联网网关主要功能是协议转换和数据传输，能把不同设备的数据转换为标准通信协议与其他系统通信。A是传感器采集数据；C一般是数据库存储数据；D是数据分析系统功能。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291035", "t": 1, "q": "智慧水利中，\"流域防洪调度智能系统\"在制定调度方案时，不需要参考的信息是以下哪项？", "a": ["上游水库当前蓄水量", "下游城市防洪标准", "水电站当前发电负荷", "未来72小时流域降雨预报", "", ""], "r": "C", "e": "流域防洪调度主要关注与洪水相关的因素，目的是保障防洪安全。水电站当前发电负荷主要与发电效益有关，并非制定防洪调度方案的关键参考信息。而上游水库蓄水量、下游城市防洪标准、未来流域降雨预报都对防洪调度至关重要。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291036", "t": 1, "q": "水电站水能规划中，\"年发电量\"的计算值与实际值产生偏差的主要原因不包括以下哪项？", "a": ["水文数据的随机性误差", "水库实际运行中调度规则的调整", "水电站装机容量的大小", "水能计算模型中参数的简化", "", ""], "r": "C", "e": "水文数据误差、运行调度规则调整、水能计算参数简化都会影响年发电量计算与实际值偏差，而装机容量大小是既定条件，不是导致计算值与实际值偏差的原因。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291037", "t": 1, "q": "数字水利中，\"流域水安全评估模型\"的评估指标体系不包含以下哪项？", "a": ["水资源供需平衡指数", "洪水风险等级", "水电站装机容量利用率", "水质达标率", "", ""], "r": "C", "e": "流域水安全评估主要关注水资源、水灾害、水环境等与水安全直接相关方面。水电站装机容量利用率主要体现水电站运营状况，并非直接衡量水安全的指标。而水资源供需平衡指数、洪水风险等级、水质达标率都和水安全密切相关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012608", "t": 2, "q": "水电站经济评价中，反映项目盈利能力的指标有（　）", "a": ["财务内部收益率", "投资回收期", "资产负债率", "财务净现值", "总投资收益率", ""], "r": "ABDE", "e": "资产负债率是反映偿债能力指标，其余选项财务内部收益率、投资回收期、财务净现值、总投资收益率均为反映项目盈利能力指标。答案：ABDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012609", "t": 2, "q": "数字水利技术在防汛抗旱中的应用包括（　）", "a": ["暴雨洪水实时预报", "干旱等级动态评估", "防洪物资库存管理", "应急避险方案智能生成", "流域水量统一调度", ""], "r": "ABDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012610", "t": 2, "q": "水电站水库兴利调节中，影响调节计算结果的因素有（　）", "a": ["水库的兴利库容", "用水部门的需水过程", "水库的蒸发与渗漏损失", "水电站的装机容量", "来水过程的随机性", ""], "r": "ABCE", "e": "兴利调节计算需考虑水库能存多少水（兴利库容）、用水需求（需水过程）、水的损耗（蒸发与渗漏损失）以及来水的不确定性（来水过程随机性）。而水电站装机容量主要影响发电能力，不直接影响兴利调节计算结果。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012611", "t": 2, "q": "数字水利中的大数据技术，其数据来源包括（　）", "a": ["水文站监测数据", "气象卫星遥感数据", "水利工程运维日志", "社会公众用水缴费数据", "流域地理信息数据", ""], "r": "ABCE", "e": "数字水利中的大数据技术涉及多种数据来源，这些数据共同构成水利管理的综合信息基础。首先，水文站监测数据是水利管理的基础数据之一，它反映了水域的水量、水位等关键信息，因此A选项是正确的数据来源。其次，气象卫星遥感数据能够提供大范围的气象和水文信息，对于预测和防范水灾等具有重要意义，所以B选项也是正确的。再次，水利工程运维日志记录了水利工程的运行和维护情况，这对于确保水利工程的安全运行至关重要，因此C选项同样正确。而关于D选项，社会公众用水缴费数据虽然在一定程度上反映了水资源的使用情况，但它更多关联于水资源的管理和经济层面，并不直接构成数字水利中大数据技术的主要数据来源。最后，流域地理信息数据是数字水利不可或缺的一部分，它提供了流域的地理特征、地貌形态等关键信息，对于水利规划和管理至关重要，因此E选项也是正确的。综上所述，数字水利中的大数据技术数据来源包括水文站监测数据、气象卫星遥感数据、水利工程运维日志以及流域地理信息数据。因此，正确答案是ABCE。", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012612", "t": 2, "q": "水电站水能规划中，确定水电站装机容量时，需考虑的约束条件有（　）", "a": ["水库的最大可能出力", "电力系统的负荷增长预测", "水电站的投资与融资能力", "下游河道的生态流量要求", "机组制造的技术限制", ""], "r": "ABDE", "e": "确定水电站装机容量要综合多方面因素。水库最大可能出力限制了电站实际发电能力；电力系统负荷增长预测决定装机规模需求；下游河道生态流量要求影响可利用水量；机组制造技术限制决定了设备性能和可安装规模。而投资与融资能力并非确定装机容量的直接约束条件。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012613", "t": 2, "q": "数字水利系统中，用于数据可视化展示的技术工具有（　）", "a": ["地理信息系统（GIS）", "数字孪生三维建模", "折线图与柱状图", "虚拟现实（VR）技术", "数据库管理系统", ""], "r": "ABCD", "e": "GIS可直观呈现地理空间数据；数字孪生三维建模能实现三维场景可视化；折线图与柱状图是常见数据可视化图表；VR技术可带来沉浸式可视化体验。而数据库管理系统主要用于数据管理，并非可视化展示工具。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012614", "t": 2, "q": "水电站水库泥沙淤积的防治措施包括（　）", "a": ["水库泄洪排沙", "上游修建拦沙坝", "水库蓄清排浑调度", "水电站机组过流部件加固", "下游河道疏浚", ""], "r": "ABC", "e": "A水库泄洪排沙可直接排出库内泥沙；B上游建拦沙坝能减少入库泥沙量；C蓄清排浑调度可利用水沙特性减少淤积。D加固机组过流部件是应对泥沙磨损，非防治淤积措施；E下游河道疏浚与水库泥沙淤积防治无关。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012615", "t": 2, "q": "数字水利技术在水资源保护中的应用包括（　）", "a": ["水体污染实时监测", "水源地保护区划定", "水污染扩散模拟预测", "水资源保护法规制定", "水功能区水质达标评估", ""], "r": "ABCE", "e": "数字水利技术主要用于对水资源相关情况进行监测、模拟和评估等。A可通过技术实时监测水体污染；B能借助数字技术划定保护区；C可进行水污染扩散模拟预测；E能评估水功能区水质达标情况。而D水资源保护法规制定主要是政策层面，并非数字水利技术直接应用。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012616", "t": 2, "q": "水电站水能规划中，水库的死库容确定需考虑的因素有（　）", "a": ["水电站机组的最小吸出高度", "水库泥沙淤积的最终平衡高程", "下游灌溉用水的最低水位要求", "水库的防洪要求", "水电站的最大水头", ""], "r": "ABC", "e": "答案：ABC死库容是指水库在正常运用情况下，允许消落的最低水位以下的库容。确定死库容时，主要考虑的因素包括水电站机组的最小吸出高度（确保机组能正常运行）、水库泥沙淤积的最终平衡高程（考虑泥沙淤积对水库库容的影响）以及下游灌溉用水的最低水位要求（保障下游灌溉需求）。防洪要求和最大水头与死库容的确定关系不大。", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012617", "t": 2, "q": "数字水利系统的安全风险包括（　）", "a": ["数据泄露风险", "网络攻击风险", "设备故障风险", "数据冗余风险", "权限滥用风险", ""], "r": "ABCE", "e": "数字水利系统涉及数据、网络、设备和人员权限等多方面。数据泄露、网络攻击、设备故障、权限滥用都会带来安全问题；而数据冗余主要影响系统效率，并非安全风险。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012618", "t": 2, "q": "水电站经济评价中，动态评价方法与静态评价方法的主要区别在于是否考虑（　）", "a": ["资金的时间价值", "项目的投资规模", "通货膨胀的影响", "项目的运行成本", "基准收益率的大小", ""], "r": "AC", "e": "答案：AC动态评价方法与静态评价方法的主要区别在于是否考虑资金的时间价值和通货膨胀的影响。动态评价方法是考虑了资金时间价值因素的评价方法，而静态评价方法则不考虑资金时间价值因素。因此，选项A和C是正确的。选项B、D和E都不是动态评价方法与静态评价方法的主要区别。", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012619", "t": 2, "q": "数字水利中的物联网技术，其感知层常用的传感器类型有（　）", "a": ["水位传感器", "流速传感器", "应力应变传感器", "温度传感器", "身份识别传感器", ""], "r": "ABCD", "e": "数字水利感知层为获取水利相关信息，水位、流速、应力应变、温度等是水利监测重要参数，对应传感器常用；身份识别传感器与水利信息感知关联不大。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012620", "t": 2, "q": "水电站水库兴利调节的类型按调节周期可分为（　）", "a": ["日调节", "周调节", "月调节", "年调节", "多年调节", ""], "r": "ADE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012621", "t": 2, "q": "数字水利技术在水利工程建设中的应用包括（　）", "a": ["施工进度三维模拟", "施工质量实时监测", "施工人员定位管理", "工程投资静态核算", "施工安全风险预警", ""], "r": "ABCE", "e": "数字水利技术可利用信息技术对水利工程施工进行全面管理和监控，施工进度三维模拟能直观展示进度，实时监测施工质量，定位管理施工人员，预警施工安全风险。而工程投资应是动态核算而非静态核算。所以答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012622", "t": 2, "q": "水电站水能规划中，影响水电站年发电量的因素有（　）", "a": ["河流的多年平均径流量", "水电站的水头损失", "水库的调节性能", "水电站的装机容量", "电力系统的负荷率", ""], "r": "ABCD", "e": "年发电量与来水（多年平均径流量）、水库对径流调节作用（调节性能）、装机容量有关；水头损失影响发电效率进而影响年发电量；而电力系统负荷率主要影响电站运行方式和效益，与年发电量无直接关联。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012623", "t": 2, "q": "数字水利系统中，平台层的核心功能包括（　）", "a": ["数据存储与管理", "数据清洗与转换", "数据共享与服务", "业务应用开发", "用户权限管理", ""], "r": "ABC", "e": "平台层主要为上层应用提供支撑，核心是对数据进行存储、管理、共享与服务。数据清洗与转换是数据处理环节；业务应用开发是上层业务层面；用户权限管理是保障安全的辅助功能。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012624", "t": 2, "q": "水电站水库防洪库容的大小取决于（　）", "a": ["设计洪水标准", "水库的死水位", "下游的防洪标准", "水库的正常蓄水位", "洪水的峰量特征", ""], "r": "ACDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012625", "t": 2, "q": "数字水利中的大数据分析技术，其主要分析方法包括（　）", "a": ["统计分析方法", "机器学习方法", "深度学习方法", "文字检索方法", "图像识别方法", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012626", "t": 2, "q": "水电站水能规划中，电力系统对水电站的要求包括（　）", "a": ["调峰要求", "调频要求", "调压要求", "备用要求", "供电可靠性要求", ""], "r": "ABDE", "e": "答案：ABDE水电站作为电力系统的重要组成部分，需要满足电力系统的多种运行要求。这其中包括根据电力需求进行功率调节（调峰要求）、维持电网频率稳定（调频要求）、在必要时提供额外的电力支持（备用要求），以及确保电力的持续供应（供电可靠性要求）。而调压要求主要是指维持电网电压稳定的需求，虽然水电站也能在一定程度上满足这一要求，但它并非水电站主要的或特定的功能要求，因此选项C不被包括在内。", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012627", "t": 2, "q": "数字水利系统中，应用层的主要业务应用包括（　）", "a": ["水资源管理应用", "防洪抗旱应用", "水利工程管理应用", "数据传输应用", "水土保持应用", ""], "r": "ABCE", "e": "应用层业务应用主要围绕水利相关管理和治理，ABC选项水资源管理、防洪抗旱、水利工程管理，E选项水土保持都属于水利业务应用范畴，而D选项数据传输应用是系统底层数据流转方面，不属于应用层业务应用。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012628", "t": 2, "q": "水电站水库泥沙淤积对水电站运行的影响包括（　）", "a": ["减少水库兴利库容", "降低水电站水头", "增加机组过流部件磨损", "提高水电站保证出力", "影响水库防洪能力", ""], "r": "ABCE", "e": "水库泥沙淤积会占用水库空间，减少兴利库容；淤积会使库底抬高，水头降低；泥沙随水流动会增加机组过流部件磨损；同时也会影响水库防洪能力，而泥沙淤积不会提高水电站保证出力。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012629", "t": 2, "q": "数字水利技术中，遥感技术的主要优势包括（　）", "a": ["监测范围广", "监测频率高", "数据精度高", "可监测水下地形", "不受天气影响", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012630", "t": 2, "q": "水电站经济评价中，不确定性分析的方法包括（　）", "a": ["敏感性分析", "概率分析", "盈亏平衡分析", "投资回报分析", "净现值分析", ""], "r": "ABC", "e": "不确定性分析是分析不确定因素对项目经济评价指标的影响。常见方法有敏感性分析、概率分析和盈亏平衡分析。投资回报分析、净现值分析属确定性经济评价指标分析方法。答案选ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012631", "t": 2, "q": "数字水利中，流域水文预报模型的类型包括以下哪些？（　）", "a": ["经验性模型（如水位流量关系模型）", "概念性模型（如新安江模型）", "分布式物理模型（如SWAT模型）", "机器学习模型（如LSTM模型）", "水动力模型（如MIKE11模型）", ""], "r": "ABCD", "e": "流域水文预报模型类型多样，经验性、概念性、分布式物理、机器学习、水动力模型都属于其范畴。ABCD选项分别对应不同原理和应用场景的模型类型，都可用于流域水文预报。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012632", "t": 2, "q": "智慧水利中，智能运维管理系统的功能包括以下哪些？（　）", "a": ["监测设备故障自动报警", "运维人员调度与任务分配", "水电站发电量统计与上报", "运维成本核算", "水库水位调节", ""], "r": "ABD", "e": "智能运维管理系统主要围绕设备运维管理，A可及时发现设备问题；B能合理安排运维人力；D可核算运维成本。而C是业务统计功能，E是水库运行调控功能，并非智能运维管理系统主要功能。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012633", "t": 2, "q": "水电站水能规划中，综合利用水库的主要功能包括以下哪些？（　）", "a": ["发电", "防洪", "灌溉", "航运", "水产养殖", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012634", "t": 2, "q": "数字水利中，数据质量控制的方法包括以下哪些？（　）", "a": ["逻辑一致性检查（如水位与流量关系合理性）", "极值检查（如排除超出传感器量程的数据）", "数据平滑处理（如移动平均法）", "数据加密处理", "数据备份与恢复", ""], "r": "ABC", "e": "数据质量控制是保证数据准确可靠，逻辑一致性检查、极值检查可筛查数据合理性与范围，数据平滑处理能降低数据噪声，都属于质量控制方法；而数据加密处理侧重数据安全，数据备份与恢复是应对数据丢失等情况的措施，不属于质量控制。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012635", "t": 2, "q": "智慧水利中，防洪预警系统的预警等级划分依据包括以下哪些？（　）", "a": ["洪水重现期（如5年一遇、10年一遇）", "河道水位与警戒水位的差值", "洪水可能影响的人口数量", "水电站的泄洪流量", "洪水演进到下游的时间", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012636", "t": 2, "q": "水电站水能规划中，水电站水头损失的主要组成部分包括以下哪些？（　）", "a": ["进水口水头损失", "引水隧洞水头损失", "水轮机内部水头损失", "水库蒸发损失", "尾水渠水头损失", ""], "r": "ABCE", "e": "水电站水头损失主要是水流在引水、水轮机等流程中的能量损耗，进水口、引水隧洞、水轮机内部、尾水渠都会造成水头损失，而水库蒸发损失不属于水头损失范畴。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637306723012637", "t": 2, "q": "数字水利中，数字孪生流域的关键技术包括以下哪些？（　）", "a": ["多尺度数值建模技术", "实时数据同化技术", "三维可视化渲染技术", "传感器数据采集技术", "云端协同计算技术", ""], "r": "ABCE", "e": "数字孪生流域是数字水利的一个重要概念，它涉及到多个关键技术的综合应用。首先，我们来看选项A，多尺度数值建模技术。这是数字孪生流域的基础，通过建立不同尺度的数值模型，可以模拟和预测流域的水文过程，因此这个选项是正确的。接着是选项B，实时数据同化技术。数字孪生流域需要实时地更新和优化模型，这就需要实时数据同化技术来将观测数据融入到模型中，提高模型的精度和时效性，所以这个选项也是正确的。再来看选项C，三维可视化渲染技术。数字孪生流域的一个重要目标是实现可视化管理，三维可视化渲染技术可以将流域的各种信息以直观的方式展现出来，便于决策者进行分析和判断，因此这个选项也是必不可少的。然后是选项D，传感器数据采集技术。虽然传感器数据采集技术在数字水利中扮演着重要角色，但它更多的是作为数据源，为数字孪生流域提供实时数据支持，而不是数字孪生流域的关键技术之一，因此这个选项是不正确的。最后是选项E，云端协同计算技术。数字孪生流域需要处理大量的数据和复杂的计算任务，云端协同计算技术可以提供强大的计算能力和高效的数据处理能力，是数字孪生流域的重要支撑技术，所以这个选项是正确的。综上所述，数字孪生流域的关键技术包括多尺度数值建模技术、实时数据同化技术、三维可视化渲染技术和云端协同计算技术，即选项A、B、C和E。所以，正确答案是ABCE。", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474688", "t": 3, "q": "数字孪生水利系统中，虚拟模型的更新频率必须与物理实体的变化频率完全一致，否则无法实现有效交互。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生水利系统中，虚拟模型更新频率不一定要与物理实体变化频率完全一致，只要能满足交互需求、保证一定准确性和及时性就可实现有效交互。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474689", "t": 3, "q": "水电站水能规划中，年调节水库的保证出力计算，通常采用设计枯水年的径流资料进行时历法计算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "年调节水库保证出力计算，一般用设计枯水年径流资料按历时法计算。这种方法能结合水库调节特性，较准确地确定满足设计保证率的保证出力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474690", "t": 3, "q": "数字水利技术中的大数据分析，仅能处理结构化的水文监测数据，对非结构化数据（如遥感影像、文本报告）的处理能力较弱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利技术中的大数据分析不仅能处理结构化水文监测数据，也具备较强处理非结构化数据（像遥感影像、文本报告等）的能力。", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474691", "t": 3, "q": "水电站水库的总库容等于兴利库容、防洪库容、死库容三者之和。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站水库总库容涵盖兴利库容、防洪库容、死库容以及重叠部分库容，所以并非简单的三者相加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474692", "t": 3, "q": "数字水利系统的安全防护中，数据加密技术仅用于数据传输环节，数据存储环节无需加密。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据加密技术不仅用于数据传输环节，数据存储环节也需要加密，以防止数据在存储时被非法获取和篡改。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474693", "t": 3, "q": "水电站水能规划中，当水库调节性能越好（调节周期越长），其保证出力占多年平均出力的比例越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水库调节性能越好、调节周期越长，越能把丰水期多余水量存起来在枯水期使用，保证枯水期有一定发电流量，使保证出力更接近多年平均出力，所以其保证出力占多年平均出力的比例越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474694", "t": 3, "q": "数字水利中的物联网技术，其感知层传感器的布设密度越高，监测数据的精度就一定越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然一般情况下，传感器布设密度高，获取的数据量会增多，但监测数据精度还受传感器质量、数据传输与处理过程等多种因素影响，并非布设密度高就一定精度高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474695", "t": 3, "q": "水电站的工作容量是指水电站在枯水期为满足电力系统负荷需求而设置的容量，丰水期无需考虑工作容量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站工作容量是为满足电力系统负荷需求而设置的容量，在丰水期和枯水期都要考虑，并非丰水期无需考虑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474696", "t": 3, "q": "数字水利中的\"智慧调度\"，能完全替代人工决策，实现水利调度的全自动运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然“智慧调度”可借助技术手段辅助水利调度，但水利调度情况复杂多变，存在诸多不确定性和特殊情况，目前无法完全替代人工决策实现全自动运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474697", "t": 3, "q": "水电站水能规划中，设计保证率越高，水电站的保证出力越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "设计保证率高意味着要求水电站正常工作的概率大，对应较枯的来水情况，能利用的水能少，保证出力就小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474698", "t": 3, "q": "数字水利系统中，边缘计算技术的应用，能减少数据向云端传输的延迟，适用于实时性要求高的水利监测场景（如大坝变形实时预警）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边缘计算可在数据源附近处理数据，减少向云端传输数据的量和时间，降低延迟，适合实时性要求高的水利监测场景。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474699", "t": 3, "q": "水电站水库的正常蓄水位越高，其兴利库容越大，水电站的年发电量就一定越多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "正常蓄水位越高兴利库容通常越大，但年发电量受来水量、机组效率等多种因素影响，并非只取决于兴利库容，所以正常蓄水位高年发电量不一定就多。", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474700", "t": 3, "q": "数字水利技术中的人工智能算法，在水文预报中的应用，无需历史数据训练，可直接进行预测。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人工智能算法通常需要大量历史数据进行训练，以学习数据中的规律和模式，才能进行较为准确的预测，在水文预报中也是如此。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474701", "t": 3, "q": "水电站水能规划中，重复容量是指水电站为应对电力系统突发负荷增加而设置的备用容量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重复容量是指在丰水期多发季节性电能以节省火电站燃料费而增设的容量，并非为应对电力系统突发负荷增加设置的备用容量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474702", "t": 3, "q": "数字水利系统的数据中台，能实现不同水利业务系统（如水资源管理、防洪调度）之间的数据共享与业务协同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据中台的核心作用之一就是打破数据壁垒，实现不同系统间的数据共享与业务协同，数字水利系统的数据中台也具备此功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474703", "t": 3, "q": "水电站水库的防洪高水位是指水库遭遇校核洪水时，坝前达到的最高水位。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "防洪高水位是水库遭遇设计洪水时坝前达到的最高水位，而遭遇校核洪水时坝前达到的最高水位是校核洪水位。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474704", "t": 3, "q": "数字水利中的遥感技术，可用于监测水库的淹没范围、河流岸线变化，但无法监测大坝的变形情况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "遥感技术能大范围、快速地获取地表信息，可用于监测水库淹没范围、河流岸线变化等；同时，合成孔径雷达干涉测量等遥感技术手段可以高精度地监测大坝等的微小变形情况。所以题干说无法监测大坝变形情况是错误的。", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474705", "t": 3, "q": "水电站水能规划中，多年平均发电量的计算，需考虑水库的蒸发、渗漏等水量损失，这些损失会导致实际发电量小于理论计算值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水库蒸发、渗漏等水量损失会使实际用于发电的水量减少，进而导致实际发电的能量减少，实际发电量就会小于不考虑这些损失的理论计算值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474706", "t": 3, "q": "数字水利系统的网络层，仅能采用有线网络传输数据，无线网络因稳定性差，不适用于水利数据传输。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利系统的网络层并非仅能采用有线网络，无线网络虽有稳定性问题，但也可通过技术手段改善，且在一些场景下有应用优势，能用于水利数据传输。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474707", "t": 3, "q": "水电站水库的死水位是指水库在正常运行中，允许消落的最低水位，死水位以下的库容称为死库容，一般情况下不允许动用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该描述符合水电站水库死水位及死库容的定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474708", "t": 3, "q": "数字水利技术中的大数据挖掘，可从海量水利数据中发现潜在规律（如降雨与洪水的关联关系），为调度决策提供支持。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数据挖掘的作用就是从海量数据里发现潜在规律，在数字水利技术中，能挖掘如降雨与洪水关联关系这类规律，从而为水利调度决策提供依据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474709", "t": 3, "q": "水电站水能规划中，电力系统的负荷率越高，水电站的年利用小时数就越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "负荷率高意味着系统负荷波动小且较为平稳，水电站能更稳定地按接近额定出力发电，可增加发电时间，从而使年利用小时数提高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474710", "t": 3, "q": "数字水利系统的应用层，所有业务应用都必须基于统一的平台层开发，无法单独开发独立的业务系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利系统应用层并非所有业务应用都必须基于统一平台层开发，也可单独开发独立业务系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474711", "t": 3, "q": "水电站水库的兴利调节中，日调节水库的调节周期为24小时，主要调节日内来水与用水的不均匀性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "日调节水库就是在一天内对来水进行调节，调节周期为24小时，目的是解决日内来水和用水不均匀问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474712", "t": 3, "q": "数字水利中的区块链技术，可用于水资源交易中的数据溯源，确保交易数据的不可篡改与透明性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "区块链具有去中心化、不可篡改、可溯源等特性，能满足水资源交易中数据溯源和保障交易数据不可篡改与透明性的需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474713", "t": 3, "q": "水电站水能规划中，当水电站的装机容量大于其保证出力时，该水电站一定具备调峰能力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "装机容量大于保证出力，只能说明电站有一定发电规模余量，但调峰能力还受水库调节性能、电网需求等多种因素影响，所以仅据此不能判定一定具备调峰能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474714", "t": 3, "q": "数字水利系统的感知层，所有传感器都必须采用有线供电方式，无线供电方式因功率不足无法满足需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利系统感知层并非所有传感器都必须用有线供电，无线供电技术发展使部分传感器能用无线供电且可满足需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474715", "t": 3, "q": "水电站水库的防洪库容是指水库用于拦蓄洪水、削减洪峰的库容，其大小仅取决于设计洪水的洪峰流量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "防洪库容大小不仅取决于设计洪水洪峰流量，还与洪水过程、水库泄洪能力、防洪标准等多种因素有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474716", "t": 3, "q": "数字水利技术中的有限元分析，可用于模拟水利工程（如大坝、溢洪道）在不同工况下的应力应变分布，评估结构安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "有限元分析是数字水利技术常用方法，能对水利工程结构建模，模拟不同工况下应力应变分布，从而评估结构安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474717", "t": 3, "q": "水电站水能规划中，设计枯水年的选择，通常采用水文系列中径流量最小的年份。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设计枯水年并非单纯选径流量最小年份，要考虑径流年内分配等多因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474718", "t": 3, "q": "数字水利系统的数据质量控制中，数据异常值检测仅需通过数学算法（如标准差法），无需结合水利专业知识。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利系统的数据复杂，仅靠数学算法检测异常值有局限性，水利数据有其专业特性和规律，必须结合水利专业知识才能更准确判断异常。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474719", "t": 3, "q": "水电站的年利用小时数等于水电站的年发电量除以其装机容量，反映水电站机组的利用程度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "年利用小时数的定义就是年发电量除以装机容量，该数值可体现水电站机组利用程度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474720", "t": 3, "q": "数字水利中的\"数字流域\"，其虚拟模型仅需模拟流域的水文过程，无需模拟水利工程的运行状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字流域的虚拟模型不仅要模拟流域水文过程，也需模拟水利工程运行状态，这样才能全面、准确地反映流域情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474721", "t": 3, "q": "水电站水库的泥沙淤积，会导致水库的死水位逐年抬高，进而减少兴利库容。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水库泥沙淤积会使库底高程上升，死水位随之逐年抬高，兴利库容是正常蓄水位与死水位之间的库容，死水位抬高会使兴利库容减少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474722", "t": 3, "q": "数字水利系统的安全防护中，访问控制技术通过设置用户账号与密码，即可实现完全的权限管理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设置用户账号与密码只是访问控制技术的一部分，完全的权限管理还涉及多种复杂机制，如基于角色的访问控制、授权策略等，仅账号密码不能实现完全的权限管理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474723", "t": 3, "q": "水电站水能规划中，多年调节水库的兴利库容通常大于年调节水库的兴利库容。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多年调节水库能将丰水年多余水量存起来供枯水年使用，调节周期长、范围大，需更大兴利库容；年调节水库仅在一年时间内调节径流。所以多年调节水库兴利库容通常大于年调节水库。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474724", "t": 3, "q": "数字水利中的人工智能技术，在水利工程故障诊断中，仅能诊断已知故障类型，无法识别新的故障模式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人工智能技术具有学习和适应能力，可通过对大量数据的学习和分析，不断更新模型，从而具备识别新故障模式的潜力，并非仅能诊断已知故障类型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474725", "t": 3, "q": "水电站水库的正常蓄水位是指水库在正常运行情况下，汛期开始前应降至的水位。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "正常蓄水位是水库在正常运行情况下，为满足兴利要求应蓄到的最高水位，而汛期开始前应降至的水位是防洪限制水位。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474726", "t": 3, "q": "数字水利系统的平台层，需具备数据缓存功能，以应对网络中断时的数据丢失问题。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数字水利系统平台层为保障数据安全和业务连续性，具备数据缓存功能可在网络中断时避免数据丢失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637307855474727", "t": 3, "q": "水电站水能规划中，当电力系统的负荷增长时，水电站的装机容量必须同步增长，才能满足系统需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电力系统满足负荷需求的方式多样，并非仅靠水电站装机容量同步增长，还可通过其他电源调节、优化调度等方式。 ", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = !!ans;
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
