率", "调相工况需关闭导叶，防止水流进入转轮", "调相工况主要用于稳定电网电压", ""], "r": "ABDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943687", "t": 2, "q": "抽水蓄能电站上水库坝体的防渗结构形式主要有哪些？（　）", "a": ["沥青混凝土防渗面板", "钢筋混凝土防渗面板", "土工膜防渗层", "帷幕灌浆防渗", "混凝土防渗墙", ""], "r": "ABCDE", "e": "抽水蓄能电站上水库坝体防渗结构形式多样，以上选项中的沥青混凝土防渗面板、钢筋混凝土防渗面板、土工膜防渗层、帷幕灌浆防渗、混凝土防渗墙都是常见的防渗形式。答案：ABCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943688", "t": 2, "q": "以下哪些参数是抽水蓄能电站机组选型设计的关键参数？（　）", "a": ["最大毛水头和最小毛水头", "额定出力和最大出力", "机组转速", "水泵水轮机的流道尺寸", "水库的总库容", ""], "r": "ABCD", "e": "抽水蓄能电站机组选型设计要考虑水头、出力、转速和流道尺寸等。最大和最小毛水头影响机组运行范围；额定和最大出力决定机组发电能力；机组转速与效率等相关；水泵水轮机流道尺寸影响性能。而水库总库容主要与电站调节能力相关，非机组选型关键参数。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943689", "t": 2, "q": "抽水蓄能电站在与电网协同运行时，可承担的电网辅助服务有哪些？（　）", "a": ["调峰", "调频", "调压", "黑启动", "备用容量", ""], "r": "ABCDE", "e": "抽水蓄能电站能根据电网需求，在用电低谷时抽水储能，用电高峰时放水发电，实现调峰；可快速调整发电功率来调频；通过调节无功功率实现调压；具备黑启动能力，能在电网崩溃时率先恢复供电；还可作为备用容量保障电网安全。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943690", "t": 2, "q": "以下关于抽水蓄能电站下水库的说法，正确的有哪些？（　）", "a": ["下水库的死水位需保证水泵吸水时不发生气蚀", "下水库的兴利库容需与上水库的兴利库容匹配", "下水库可利用天然湖泊或河道改造", "下水库的水位波动幅度通常大于上水库", "下水库的防渗要求低于上水库", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943691", "t": 2, "q": "抽水蓄能电站机组的启动方式主要有哪些？（　）", "a": ["背靠背启动", "自同期启动", "变频启动", "异步启动", "降压启动", ""], "r": "ABC", "e": "答案：ABC抽水蓄能电站机组的启动方式主要有背靠背启动、自同期启动和变频启动。", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943692", "t": 2, "q": "以下哪些因素会影响抽水蓄能电站的年发电量？（　）", "a": ["电站的总装机容量", "机组的年利用小时数", "综合效率", "上下水库的兴利库容", "电网的调峰需求", ""], "r": "ABCDE", "e": "电站总装机容量、机组年利用小时数、综合效率直接影响发电能力和电量；上下水库兴利库容决定蓄水量从而影响发电量；电网调峰需求影响电站运行时间和发电机会。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943693", "t": 2, "q": "抽水蓄能电站的压力钢管设计需考虑哪些荷载？（　）", "a": ["内水压力", "外水压力（地下水压力）", "管道自重", "水流冲击力（水锤压力）", "温度应力", ""], "r": "ABCDE", "e": "抽水蓄能电站压力钢管设计时，内水压力直接作用于管内，外水压力（地下水压力）会影响钢管外部，管道自重是自身恒载，水流冲击力（水锤压力）在水流状态变化时产生影响，温度应力因温度变化使钢管伸缩产生，这些荷载都需要考虑。答案为ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943694", "t": 2, "q": "以下关于抽水蓄能电站\"可逆式水泵水轮机\"的说法，正确的有哪些？（　）", "a": ["同一台机组可实现抽水和发电两种工况", "转轮设计需同时满足抽水和发电的水力特性", "发电工况时，转轮旋转方向与抽水工况相反", "发电工况的效率通常高于抽水工况的效率", "转轮叶片角度不可调节", ""], "r": "ABCD", "e": "可逆式水泵水轮机同一台机组能实现抽水和发电两种工况，转轮设计要兼顾抽水和发电水力特性；发电与抽水工况转轮旋转方向相反；一般发电工况效率高于抽水工况。而其转轮叶片角度是可调节的。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943695", "t": 2, "q": "抽水蓄能电站在抽水工况下，电网频率降低对机组运行的影响有哪些？（　）", "a": ["水泵转速降低", "抽水流量减少", "水泵出口压力降低", "水泵效率升高", "气蚀风险增加", ""], "r": "ABCE", "e": "电网频率降低，水泵转速随之降低，流量减少、出口压力降低，效率降低且气蚀风险增加。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943696", "t": 2, "q": "以下哪些属于抽水蓄能电站的环境影响？（　）", "a": ["水库淹没导致的生态栖息地变化", "输水隧洞开挖导致的水土流失", "机组运行产生的噪声和振动", "水库蓄水导致的水温分层", "抽水发电循环导致的水资源消耗", ""], "r": "ABCD", "e": "抽水蓄能电站建设和运行会带来多方面环境影响。A水库淹没会改变生态栖息地；B输水隧洞开挖破坏地表易造成水土流失；C机组运行会产生噪声和振动；D水库蓄水会出现水温分层现象。而抽水蓄能是水的循环利用，不造成水资源消耗，E错误。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943697", "t": 2, "q": "抽水蓄能电站的励磁系统主要作用有哪些？（　）", "a": ["维持发电机端电压稳定", "调节发电机的无功功率输出", "控制机组的转速", "保护发电机免受过电压损坏", "参与电网的调频", ""], "r": "ABD", "e": "答案：ABD抽水蓄能电站的励磁系统主要作用包括：维持发电机端电压稳定（A选项正确）；调节发电机的无功功率输出（B选项正确）；保护发电机免受过电压损坏（D选项正确）。而控制机组的转速（C选项错误）主要是通过调速器来实现，不是励磁系统的主要作用；参与电网的调频（E选项错误）虽然发电机可以参与，但这不是励磁系统的主要功能。", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943698", "t": 2, "q": "以下关于抽水蓄能电站上水库坝型选择的说法，正确的有哪些？（　）", "a": ["岩质坝基优先选择混凝土重力坝", "土质地基优先选择土石坝", "坝高较大时优先选择拱坝（地形合适时）", "峡谷地形优先选择土石坝", "宽谷地形优先选择拱坝", ""], "r": "ABC", "e": "岩质坝基适合混凝土重力坝，因其能利用坝体自重维持稳定；土质地基适合土石坝，可适应地基变形；坝高较大且地形合适时拱坝优势明显；峡谷地形优先选拱坝，宽谷地形优先选土石坝。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943699", "t": 2, "q": "抽水蓄能电站运行中，需监测的关键参数有哪些？（　）", "a": ["机组进出口压力和流量", "机组转速和出力", "上下水库水位和水温", "输水管道的振动和位移", "电网的电压和频率", ""], "r": "ABCDE", "e": "抽水蓄能电站运行监测关键参数涉及多方面，机组运行（A选项进出口压力流量、B选项转速和出力）、水库情况（C选项水位和水温）、输水设施（D选项管道振动和位移）以及与电网衔接（E选项电网电压和频率）都很关键。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943700", "t": 2, "q": "以下哪些措施可提高抽水蓄能电站的综合效率？（　）", "a": ["优化水泵水轮机的流道设计，减少水力损失", "采用高效的发电机，降低电磁损失", "缩短输水管道长度，减少沿程水头损失", "减少机组启动和工况转换的次数", "加强水库防渗，减少水量损失", ""], "r": "ABCDE", "e": "提高抽水蓄能电站综合效率可从减少各环节损失入手。A减少水力损失，B降低电磁损失，C减少沿程水头损失，E减少水量损失，都能提升效率；D减少机组启动和工况转换次数可避免额外能量损耗，也有助于提高效率。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943701", "t": 2, "q": "抽水蓄能电站的\"尾水系统\"包括以下哪些部分？（　）", "a": ["尾水隧洞", "尾水调压室", "尾水闸门", "压力钢管", "转轮室", ""], "r": "ABC", "e": "抽水蓄能电站尾水系统是将水轮机排出的水引至下游，包含尾水隧洞、尾水调压室、尾水闸门等。压力钢管是高压管道输送水流到水轮机，转轮室是水轮机部件，不属于尾水系统。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943702", "t": 2, "q": "以下关于抽水蓄能电站与常规火电站调峰能力的对比，正确的有哪些？（　）", "a": ["抽水蓄能电站启动速度快于火电站", "抽水蓄能电站出力调节范围大于火电站", "抽水蓄能电站运行成本低于火电站（调峰时）", "抽水蓄能电站无污染物排放，火电站有", "抽水蓄能电站的调峰响应时间长于火电站", ""], "r": "ABCD", "e": "抽水蓄能电站启动快、出力调节范围大、调峰时运行成本低、无污染物排放且调峰响应时间短，火电站启动慢、调节范围小、运行成本高、有污染物排放。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943703", "t": 2, "q": "抽水蓄能电站机组的\"调速器\"主要功能有哪些？（　）", "a": ["调节导叶开度，控制机组出力", "维持机组转速稳定（发电工况）", "控制机组启动和停机过程", "防止机组发生飞逸", "调节发电机的励磁电流", ""], "r": "ABCD", "e": "调速器可调节导叶开度控制出力，发电时维持转速稳定，控制启停机过程，防止机组飞逸。而调节发电机励磁电流是励磁系统功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943704", "t": 2, "q": "以下哪些地质条件适合建设抽水蓄能电站的厂房？（　）", "a": ["完整的花岗岩地层", "微风化的砂岩地层", "破碎的页岩地层", "厚层的黏土层", "岩溶发育的石灰岩地层", ""], "r": "AB", "e": "建设抽水蓄能电站厂房需稳定地质条件。完整花岗岩、微风化砂岩强度高、稳定性好适合；破碎页岩易坍塌，厚层黏土承载差，岩溶发育石灰岩有漏水隐患，不适合。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943705", "t": 2, "q": "抽水蓄能电站的\"引水隧洞\"设计需考虑哪些因素？（　）", "a": ["洞线走向（缩短长度、避开不良地质）", "断面尺寸（满足流量要求）", "衬砌形式（防渗、抗冲刷）", "坡度（保证水流顺畅）", "通风和排水（施工和运行需求）", ""], "r": "ABCDE", "e": "抽水蓄能电站“引水隧洞”设计要综合多方面因素。洞线走向要考虑缩短长度并避开不良地质；断面尺寸需满足流量要求；衬砌形式要防渗且抗冲刷；坡度要保证水流顺畅；还需考虑通风和排水以满足施工和运行需求。ABCDE选项均是设计需考虑的因素。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943706", "t": 2, "q": "以下关于抽水蓄能电站\"库容系数\"的说法，正确的有哪些？（　）", "a": ["库容系数是兴利库容与多年平均径流量的比值", "抽水蓄能电站的库容系数通常较小（日调节或周调节）", "库容系数越大，电站的调节能力越强", "上水库的库容系数通常大于下水库", "库容系数与电站的综合效率无关", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943707", "t": 2, "q": "抽水蓄能电站运行中，可能导致机组停机的故障有哪些？（　）", "a": ["水泵水轮机发生严重气蚀", "机组转速超过飞逸转速", "发电机定子温度过高", "电网电压波动", "输水管道发生泄漏", ""], "r": "ABCE", "e": "水泵水轮机严重气蚀、机组超飞逸转速、发电机定子温度过高、输水管道泄漏都会严重影响机组安全运行，需停机处理；而电网电压波动一般可通过调节等手段应对，通常不会直接导致机组停机。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943708", "t": 2, "q": "以下哪些属于抽水蓄能电站的经济效益？（　）", "a": ["降低电网峰谷电价差", "提高电网输电效率", "减少新能源电站弃电损失", "延长常规电源的使用寿命", "增加电网的供电可靠性", ""], "r": "ABCDE", "e": "抽水蓄能电站在用电低谷抽水储能，高峰时发电，可减少新能源电站弃电损失，一定程度提高输电效率、供电可靠性，还能降低峰谷电价差、延长常规电源寿命，这些都体现经济效益。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943709", "t": 2, "q": "抽水蓄能电站的\"黑启动\"过程中，需依次启动的设备有哪些？（　）", "a": ["辅助电源（如柴油发电机）", "励磁系统", "水泵水轮机（抽水工况）", "主变压器", "发电机（发电工况）", ""], "r": "ABDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509568", "t": 3, "q": "抽水蓄能电站在抽水工况下，消耗的电能全部转化为上水库的势能储存起来，无能量损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实际中能量转化过程存在各种损耗，如机械摩擦、电流热效应等，抽水蓄能电站抽水时消耗的电能不可能全部转化为上水库势能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509569", "t": 3, "q": "抽水蓄能电站的毛水头等于上水库水位与下水库水位的差值，与输水管道的水头损失无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站毛水头就是上水库水位与下水库水位的差值，不考虑输水管道水头损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509570", "t": 3, "q": "混流式水泵水轮机在抽水工况和发电工况下，转轮的旋转方向相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509571", "t": 3, "q": "抽水蓄能电站的调压井主要作用是缓冲输水管道中的水锤压力，保护管道和机组。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站中，当水流速变化时会产生水锤压力，调压井可有效缓冲这种压力，避免对管道和机组造成损害。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509572", "t": 3, "q": "抽水蓄能电站上水库的正常蓄水位越高，电站的最大出力越大（其他条件不变时）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据抽水蓄能电站出力公式，出力与水头相关，正常蓄水位越高，水头越大，在其他条件不变时，电站最大出力越大。", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509573", "t": 3, "q": "抽水蓄能电站的综合效率是发电效率与抽水效率的比值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站综合效率是发电电量与抽水耗电量的比值，并非发电效率与抽水效率的比值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509574", "t": 3, "q": "调相工况下，抽水蓄能机组既不向电网输送有功功率，也不从电网吸收有功功率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "调相工况下，抽水蓄能机组主要作用是调节电网无功功率，理论上不向电网输送或从电网吸收有功功率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509575", "t": 3, "q": "抽水蓄能电站的下水库死水位设置过低，会导致水泵抽水时发生气蚀。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "下水库死水位过低，水泵进口压力会降低，当压力降低到水的汽化压力时，水会汽化形成气泡，气泡破裂会引发气蚀。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509576", "t": 3, "q": "抽水蓄能电站的机组启动速度越快，对电网调频的响应能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站机组启动速度快，就能更迅速地调整发电功率，可及时响应电网频率变化，增强对电网调频的响应能力。", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509577", "t": 3, "q": "抽水蓄能电站的输水管道采用钢筋混凝土衬砌，主要目的是提高管道的抗冲刷能力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站输水管道用钢筋混凝土衬砌，主要目的是提高管道的整体性、耐久性、抗渗性等，提高抗冲刷能力不是主要目的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509578", "t": 3, "q": "抽水蓄能电站的库容系数越大，其适应电网负荷波动的能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "库容系数大意味着电站能存储更多能量，可在电网负荷变化时更好地调节，增强适应电网负荷波动能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509579", "t": 3, "q": "水泵水轮机的喘振现象仅发生在抽水工况，发电工况不会发生。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509580", "t": 3, "q": "抽水蓄能电站与光伏电站协同运行时，光伏出力过剩时，抽水蓄能电站启动抽水工况吸收多余电能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当光伏出力过剩，意味着有多余的电能，抽水蓄能电站可启动抽水工况，把水从下水库抽到上水库，将多余电能转化为水的势能储存起来。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509581", "t": 3, "q": "抽水蓄能电站的主变压器位于厂房内，与发电机直接连接。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站主变压器一般布置在室外，并非厂房内。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509582", "t": 3, "q": "抽水蓄能电站的上水库坝体采用土石坝时，其防渗性能优于混凝土重力坝。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混凝土重力坝依靠自身重力维持稳定，其坝体混凝土本身具有较好的防渗性能；而土石坝需专门设置防渗体，防渗性能通常不如混凝土重力坝。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509583", "t": 3, "q": "机组在发电工况下，导叶开度越大，机组出力越大（水头不变时）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水头不变时，导叶开度越大，进入水轮机的水量增多，水流能量增加，可转化的机械能增多，从而机组出力增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509584", "t": 3, "q": "抽水蓄能电站的厂用电率越高，其向电网输送的有效电能越多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "厂用电率指厂用电力与总发电量的比值，厂用电率越高意味着电厂自身消耗的电能越多，那么向电网输送的有效电能就会越少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509585", "t": 3, "q": "抽水蓄能电站的黑启动能力是指电站在电网停电时，可直接启动抽水工况，从下水库抽水至上水库。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站的黑启动能力是指在电网停电时，能不依赖外界电源独立启动发电工况向电网送电，而非直接启动抽水工况抽水。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509586", "t": 3, "q": "水泵水轮机的气蚀余量（NPSH）越大，其抗气蚀能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "气蚀余量是指在水泵进口处单位重量液体所具有的超过汽化压力的富余能量，气蚀余量越大，液体越不容易汽化，也就越不容易发生气蚀，抗气蚀能力越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509587", "t": 3, "q": "抽水蓄能电站的上下水库水位差越小，机组的运行效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站中，上下水库水位差越大，水的势能越大，机组将势能转化为电能等的能量转换效率越高，并非水位差越小运行效率越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509588", "t": 3, "q": "抽水蓄能电站的运行不受天然来水条件限制，可全年稳定运行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站通过上下水库循环抽水和发电，不依赖天然来水流量，能根据电网需求灵活调节，可全年稳定运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509589", "t": 3, "q": "发电机的励磁系统故障会导致发电机端电压不稳定，影响机组正常运行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "励磁系统的主要作用是为发电机提供励磁电流以建立磁场，从而产生稳定的端电压。当励磁系统故障时，无法正常提供合适的励磁电流，就会使发电机端电压不稳定，进而影响机组正常运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509590", "t": 3, "q": "抽水蓄能电站的尾水调压室主要用于平衡发电工况下尾水管内的压力波动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站尾水调压室的主要作用之一就是平衡发电工况下尾水管内的压力波动，稳定水流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509591", "t": 3, "q": "抽水蓄能电站的机组转速由电网频率决定，与水头无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站机组转速由电网频率和电机磁极对数决定，和水头无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509592", "t": 3, "q": "上水库的淤积会导致其兴利库容减小，降低电站的调节能力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "上水库淤积会使库内泥沙增多，占据库容空间，兴利库容自然减小，进而影响电站对水量的调节，降低调节能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509593", "t": 3, "q": "抽水蓄能电站的综合效率通常在90%以上。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站在抽水和发电过程中存在能量损耗，其综合效率一般在70% - 80%，达不到90%以上。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509594", "t": 3, "q": "机组在抽水工况下，电网频率升高会导致水泵转速升高，抽水流量增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509595", "t": 3, "q": "抽水蓄能电站的输水管道采用地下埋管时，其散热性能优于露天管道。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "露天管道与空气直接接触，散热面积大且空气流动利于热量散发，而地下埋管周围土壤热传导性差，不利于热量散失，所以地下埋管散热性能不如露天管道。", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509596", "t": 3, "q": "抽水蓄能电站的备用容量是指电站在紧急情况下可快速投入的发电容量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站备用容量就是在系统有突发情况如机组故障、负荷骤增等紧急状态下，能迅速投入运行发电的容量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509597", "t": 3, "q": "下水库的水温变化会影响水泵水轮机的抽水效率，水温越高，效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般情况下，水温升高会使水的黏性降低等，但水温过高会产生汽蚀现象，破坏水泵水轮机内部流态，降低抽水效率，并非水温越高效率越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509598", "t": 3, "q": "抽水蓄能电站的厂房采用地下厂房时，其抗震性能优于地面厂房。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "地下厂房受周围岩体约束，地震时的动力响应相对较小，能更好地抵御地震作用，抗震性能通常优于地面厂房。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509599", "t": 3, "q": "机组在调相工况下，导叶处于全关状态，防止水流进入转轮室。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "调相工况时，为减少水流阻力和避免水流冲击转轮，导叶通常是全关的，防止水流进入转轮室。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509600", "t": 3, "q": "抽水蓄能电站的年利用小时数是指机组全年实际运行时间与额定装机容量的比值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站年利用小时数是指在一年时间内，抽水蓄能电站按装机容量满负荷运行的等效小时数，并非机组全年实际运行时间与额定装机容量的比值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509601", "t": 3, "q": "输水隧洞的开挖过程中，岩爆现象主要发生在坚硬、完整的脆性岩石地层。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "坚硬、完整的脆性岩石在高地应力下，洞室开挖解除约束，容易积蓄的能量突然释放产生岩爆。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509602", "t": 3, "q": "抽水蓄能电站的上水库死水位设置越高，其可利用的水头越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站水头是上水库水位与下水库水位的差值，上水库死水位设置越高，在其他条件不变时，上下水库水位差值越大，可利用水头越大。", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509603", "t": 3, "q": "发电机的定子绝缘老化会导致发电机输出功率降低，甚至停机。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "发电机定子绝缘老化会使绝缘性能下降，可能引发短路等故障，极大影响发电机正常运行，出现输出功率降低乃至停机的情况。", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509604", "t": 3, "q": "抽水蓄能电站的运行对下游河道的生态环境无影响，因水流在上下水库间循环。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站虽水流在上下水库间循环，但运行过程中会改变下游河道的流量、水温、水质等，对下游河道生态环境有影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509605", "t": 3, "q": "水泵水轮机的飞逸转速是机组在发电工况下的最大允许转速。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水泵水轮机飞逸转速是指水轮机在导水机构（或阀门）全开，机组突然甩去全部负荷，且调速系统失去控制时达到的最高转速，并非发电工况最大允许转速。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509606", "t": 3, "q": "抽水蓄能电站通过增加上水库的兴利库容，可提高其应对电网长期调峰需求的能力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站增加上水库兴利库容，能存储更多能量，满足更长时间不同时段的调峰需求，可提高应对电网长期调峰能力。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第2章 水利与水电||第5节 拱坝、重力坝和水闸等设计", "n": "第2章 水利与水电 / 第5节 拱坝、重力坝和水闸等设计", "qs": [{"id": "2035637115362086912", "t": 1, "q": "在拱坝设计中，当坝址处河谷宽高比小于2.5，且地基岩性均一、完整时，下列哪种拱坝体型更有利于发挥拱的传力作用，减少坝体应力集中？", "a": ["单曲拱坝", "双曲拱坝", "圆筒形拱坝", "抛物线形拱坝", "", ""], "r": "B", "e": "宽高比小且地基好时，双曲拱坝能更好适应地形地质条件，发挥拱传力作用，减少应力集中。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086913", "t": 1, "q": "重力坝抗滑稳定计算中，若坝基存在缓倾角软弱夹层，且夹层内摩擦系数f=0.25，黏聚力c=15kPa，此时采用下列哪种计算方法更能准确反映坝体沿软弱夹层的滑动趋势？", "a": ["单一安全系数法（抗剪断公式）", "单一安全系数法（抗剪公式）", "分项系数极限状态法（持久状况）", "有限元法（渗流-应力-稳定耦合分析）", "", ""], "r": "A", "e": "对于存在缓倾角软弱夹层且给出内摩擦系数和黏聚力的情况，抗剪公式仅考虑摩擦力，抗剪断公式能综合考虑摩擦力和黏聚力，更符合实际，单一安全系数法（抗剪断公式）可较准确反映坝体沿软弱夹层滑动趋势。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086914", "t": 1, "q": "水闸闸室稳定计算中，当闸室地基为不均匀的双层地基（上层为3m厚的粉质黏土，下层为微风化砂岩），在正常蓄水位下，控制闸室稳定的主要不利因素是（　）", "a": ["闸基不均匀沉降导致的闸室倾斜", "上层粉质黏土的渗透变形", "下层砂岩的压缩变形", "闸室自重不足导致的浮起", "", ""], "r": "A", "e": "双层地基上层粉质黏土较薄且下层为微风化砂岩，地基不均匀易使闸室出现不均匀沉降致倾斜，这是控制稳定的主要不利因素。B选项上层3m厚粉质黏土一般不易渗透变形；C选项微风化砂岩压缩变形小；D选项题干未体现闸室自重不足情况。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086915", "t": 1, "q": "拱坝坝体温度应力计算中，\"封拱温度\"是关键参数，下列关于封拱温度的确定原则，正确的是（　）", "a": ["封拱温度应等于坝体运行期的最高平均温度，以减少温降应力", "封拱温度应低于坝体运行期的最低平均温度，以避免温升应力", "封拱温度应接近坝体运行期的年平均温度，使温降和温升应力均较小", "封拱温度由施工进度决定，与运行期温度无关", "", ""], "r": "C", "e": "封拱温度接近坝体运行期年平均温度时，坝体温降和温升应力都较小，有利于坝体稳定和安全。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086916", "t": 1, "q": "重力坝坝体混凝土分区设计中，下列哪个区域的混凝土强度等级最高、抗渗性和抗冻性要求最严格？", "a": ["坝体上游面表层混凝土（水位变动区）", "坝体下游面表层混凝土（干燥区）", "坝体内部混凝土（非溢流段）", "坝基垫层混凝土（与基岩接触段）", "", ""], "r": "A", "e": "坝体上游面水位变动区混凝土受水位变化、冻融等影响大，需高强度、高抗渗和抗冻性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086917", "t": 1, "q": "水闸消能防冲设计中，当闸下尾水深度较浅，且下游河床为砂卵石地基时，下列哪种消能方式更适合避免河床冲刷破坏？", "a": ["底流消能（消力池）", "挑流消能", "面流消能", "消力戽消能", "", ""], "r": "A", "e": "尾水浅、砂卵石地基，底流消能（消力池）可在池内形成水跃，消耗能量，适应这种情况避免河床冲刷。挑流消能适用于较坚硬岩石地基；面流消能适用于下游尾水较深且变幅较小情况；消力戽消能要求下游有一定水深。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086918", "t": 1, "q": "拱坝地基处理中，若坝基存在走向与坝轴线平行的断层破碎带，且破碎带宽度为5m，充填物为泥质角砾岩，下列哪种处理措施最有效？", "a": ["断层破碎带开挖置换为混凝土塞", "在破碎带上下游打排水孔", "对破碎带进行高压喷射灌浆防渗", "在破碎带表面铺设钢筋网加固", "", ""], "r": "A", "e": "对于走向与坝轴线平行且宽度5m、充填泥质角砾岩的断层破碎带，开挖置换为混凝土塞能有效增强坝基的整体性和承载能力，从根本上处理问题。排水孔主要解决渗流问题；高压喷射灌浆防渗多用于处理较细颗粒土层的防渗；铺设钢筋网加固难以解决破碎带内部的不良特性。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086919", "t": 1, "q": "重力坝溢流面曲线设计中，为保证水流平顺、不产生负压，溢流面的下游段通常采用哪种曲线形式？", "a": ["抛物线", "圆弧线", "幂函数曲线（渥奇曲线）", "直线", "", ""], "r": "C", "e": "重力坝溢流面下游段用幂函数曲线（渥奇曲线）可使水流平顺且不产生负压。抛物线、圆弧线、直线难以很好满足此要求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086920", "t": 1, "q": "水闸地下轮廓线设计中，\"防渗长度\"的确定需满足《水闸设计规范》要求，下列关于防渗长度的计算原则，正确的是（　）", "a": ["防渗长度等于闸室底板长度与上下游防渗设施长度之和，且需大于等于允许渗径长度", "防渗长度仅指闸室底板的水平长度，与上下游设施无关", "防渗长度等于上游铺盖长度与下游排水长度之和", "防渗长度由地基渗透系数决定，与水头无关", "", ""], "r": "A", "e": "水闸防渗长度是闸室底板长度与上下游防渗设施长度之和，且要大于等于允许渗径长度。B选项未考虑上下游防渗设施；C选项概念错误；D选项防渗长度与水头有关。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086921", "t": 1, "q": "拱坝坝肩稳定分析中，若坝肩岩体存在两组结构面，一组走向与坝轴线夹角30°，倾角60°，另一组走向与坝轴线夹角120°，倾角50°，此时判断坝肩是否滑动，需重点分析的滑动面是（　）", "a": ["两组结构面的交线形成的楔形滑动体", "第一组结构面（30°夹角）单独形成的滑动面", "第二组结构面（120°夹角）单独形成的滑动面", "坝肩岩体的层面滑动面", "", ""], "r": "A", "e": "当坝肩岩体存在两组结构面时，通常需重点分析两组结构面交线形成的楔形滑动体的稳定性。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086922", "t": 1, "q": "重力坝采用混凝土重力墩作为岸坡连接结构时，若岸坡坡度为1:0.5（垂直:水平），且墩高30m，下列关于重力墩设计的关键要求，错误的是（　）", "a": ["重力墩需验算沿基岩面的抗滑稳定", "重力墩应设置伸缩缝，间距不大于20m", "重力墩的混凝土强度等级应不低于C25", "重力墩需与坝体整体浇筑，不设沉降缝", "", ""], "r": "D", "e": "重力墩与坝体一般设沉降缝，D选项说不设沉降缝错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086923", "t": 1, "q": "水闸闸室底板设计中，当闸室宽度为15m，底板厚度为1.2m，采用分离式底板时，下列关于底板内力计算的方法，正确的是（　）", "a": ["按弹性地基梁计算，考虑地基不均匀沉降的影响", "按悬臂梁计算，以闸墩为固定端", "按简支梁计算，两端支撑在闸墩上", "按刚性板计算，忽略底板的弯曲变形", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086924", "t": 1, "q": "拱坝荷载组合中，下列哪种荷载组合属于\"特殊荷载组合\"（对应持久状况下的偶然组合）？", "a": ["自重+静水压力+扬压力+温度荷载", "自重+静水压力+扬压力+地震荷载", "自重+静水压力+扬压力+校核洪水位水压力", "自重+静水压力+扬压力+冰压力", "", ""], "r": "B", "e": "特殊荷载组合包含偶然出现的荷载，地震属于偶然作用，校核洪水位水压力是非常工况下才有的，B选项含地震荷载、C选项含校核洪水位水压力属于特殊荷载组合。但规范中典型特殊组合常提及自重、静水压力、扬压力和地震荷载。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086925", "t": 1, "q": "重力坝坝基排水设计中，若坝基为花岗岩，存在细微裂隙，为降低坝基扬压力，下列哪种排水系统布置更合理？", "a": ["在坝基上游侧设置一排主排水孔，孔深进入基岩3m", "在坝基下游侧设置一排主排水孔，孔深进入基岩5m", "在坝基上下游侧分别设置主排水孔和辅助排水孔，主孔深5m，辅助孔深2m", "在坝基中部设置单排排水孔，孔深进入基岩4m", "", ""], "r": "C", "e": "花岗岩细微裂隙需有效降低扬压力，上下游侧设主、辅排水孔能更好形成排水网络，增强排水效果。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086926", "t": 1, "q": "水闸上游铺盖设计中，当铺盖材料为沥青混凝土，闸室水头为8m，地基渗透系数为1×10^-4cm/s，下列关于铺盖长度的确定，正确的是（　）", "a": ["铺盖长度应不小于8m（1倍水头）", "铺盖长度应不小于16m（2倍水头）", "铺盖长度应根据允许渗径长度计算，且不小于20m", "铺盖长度由施工能力决定，与水头无关", "", ""], "r": "C", "e": "沥青混凝土铺盖长度应根据允许渗径长度计算，且不小于20m。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086927", "t": 1, "q": "拱坝坝体应力控制标准中，对于混凝土拱坝，在基本荷载组合下，坝体最大主拉应力的限值是（　）", "a": ["1.0MPa", "1.5MPa", "2.0MPa", "2.5MPa", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086928", "t": 1, "q": "重力坝溢流坝段设计中，若溢流孔口宽度为8m，孔数为5孔，采用弧形闸门控制，下列关于闸门启闭设备布置的要求，错误的是（　）", "a": ["启闭机应布置在坝顶，避开坝体伸缩缝", "启闭机的启闭力应考虑闸门自重、水压力和摩阻力", "相邻闸门的启闭机间距应不小于1.5m，便于操作", "启闭机应与坝体固结，不设减震装置", "", ""], "r": "D", "e": "在有震动等情况下，启闭机设减震装置可保证运行安全，D选项不设减震装置错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086929", "t": 1, "q": "水闸下游翼墙设计中，当下游河道为弯曲河道，翼墙与河道的衔接应满足（　）", "a": ["翼墙轴线应与河道主流方向一致，减少水流扰动", "翼墙轴线应与闸室轴线垂直，保证结构稳定", "翼墙采用折线形，折线角度不大于30°", "翼墙采用直线形，长度不小于闸室宽度的1/2", "", ""], "r": "A", "e": "在水闸下游翼墙设计中，若下游是弯曲河道，为减少水流扰动，翼墙轴线应与河道主流方向一致。B选项与闸室轴线垂直和衔接河道无关；C选项的折线形及角度要求不针对弯曲河道衔接；D选项直线形及长度规定也不符合弯曲河道衔接需求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086930", "t": 1, "q": "拱坝坝基开挖深度的确定，主要依据是（　）", "a": ["坝体高度，开挖深度为坝高的1/10", "地基风化程度，开挖至微风化或新鲜基岩", "施工设备能力，开挖深度不超过10m", "河谷宽度，开挖深度与河谷宽度成正比", "", ""], "r": "B", "e": "拱坝坝基需有足够承载能力和稳定性，要开挖至微风化或新鲜基岩以满足要求。A中按坝高定开挖深度不准确；C施工设备能力不是主要依据；D开挖深度与河谷宽度无此正比关系。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086931", "t": 1, "q": "重力坝混凝土浇筑中，为防止出现温度裂缝，采用\"分层分块\"浇筑，下列关于分层厚度的确定，正确的是（　）", "a": ["分层厚度由混凝土初凝时间决定，不大于浇筑强度×初凝时间", "分层厚度应不大于钢筋最小净距的2倍", "分层厚度应不大于混凝土浇筑振捣器的有效振捣深度（一般30-50cm）", "分层厚度由坝体高度决定，不大于坝高的1/5", "", ""], "r": "C", "e": "在重力坝混凝土浇筑过程中，为防止温度裂缝，采取“分层分块”浇筑方法。关于分层厚度的确定，各选项分析如下：A选项提到分层厚度由混凝土初凝时间决定。这并非直接决定因素，因为分层厚度更多地与施工操作和混凝土的振捣效果有关。B选项指出分层厚度应不大于钢筋最小净距的2倍。这虽然是一个考虑因素，但不是决定分层厚度的主要标准。C选项说明分层厚度应不大于混凝土浇筑振捣器的有效振捣深度（一般30-50cm）。这是确保混凝土能够均匀振捣、减少内部空隙和裂缝的关键因素。因此，这个选项描述是正确的。D选项提出分层厚度由坝体高度决定，不大于坝高的1/5。这并非一个实际操作中的决定性因素，更多是与整体施工规划相关。综上所述，C选项正确描述了分层厚度的确定原则，即应不大于混凝土浇筑振捣器的有效振捣深度。所以，正确答案是C选项：“分层厚度应不大于混凝土浇筑振捣器的有效振捣深度（一般30-50cm）”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086932", "t": 1, "q": "水闸闸墩设计中，当闸室为3孔，每孔净宽10m，闸墩厚度为1.5m，下列关于闸墩强度计算的荷载，不需要考虑的是（　）", "a": ["闸门传来的水压力", "闸墩自重", "闸室底板传来的地基反力", "温度应力", "", ""], "r": "C", "e": "闸墩强度计算主要考虑自身受力，地基反力是作用在闸室底板上，并非闸墩直接承受的主要荷载。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086933", "t": 1, "q": "拱坝泄洪建筑物设计中，若坝址处河谷狭窄，且需避免泄洪水流对坝肩岩体冲刷，下列哪种泄洪方式最适合？", "a": ["坝身孔口泄洪（中孔或底孔）", "岸边溢洪道泄洪", "坝顶溢洪道泄洪", "隧洞泄洪", "", ""], "r": "A", "e": "A 坝身孔口泄洪（中孔 / 底孔）**：适合狭窄河谷；水流从坝身孔口射出，水舌抛向河床中央，远离两岸坝肩岩体，避免冲刷坝肩。<br />B 岸边溢洪道：需要两岸有足够布置场地，河谷狭窄条件下布置困难，出流靠近岸边易冲刷坝肩。<br />C 坝顶溢洪：水流沿坝下泄，易冲击坝趾，水舌容易偏向两岸冲刷坝肩岩体。<br />D 隧洞泄洪：造价高，多用于高坝大库作为辅助泄洪，不是本题最优。", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086934", "t": 1, "q": "重力坝抗浮稳定计算中，若坝体排水系统失效，坝基扬压力系数会（　）", "a": ["增大，导致抗浮稳定安全系数降低", "减小，导致抗浮稳定安全系数降低", "增大，导致抗浮稳定安全系数提高", "减小，导致抗浮稳定安全系数提高", "", ""], "r": "A", "e": "坝体排水系统失效，坝基扬压力增大，扬压力系数也增大。扬压力增大使坝体抗浮稳定的不利作用增强，抗浮稳定安全系数降低。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086935", "t": 1, "q": "水闸护坦设计中，当闸下泄流量为500立方米每秒，护坦材料为C30混凝土，下列关于护坦厚度的确定，主要依据是（　）", "a": ["水流脉动压力产生的弯曲应力", "护坦自重产生的压应力", "地基不均匀沉降产生的拉应力", "温度变化产生的温度应力", "", ""], "r": "A", "e": "水闸护坦厚度主要考虑水流脉动压力产生的弯曲应力。当闸下泄流量较大时，水流脉动压力对护坦结构影响显著，会使护坦承受弯曲应力，是确定护坦厚度的关键因素。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086936", "t": 1, "q": "拱坝坝体廊道设计中，为满足坝体观测、检修和排水要求，下列关于廊道布置的说法，正确的是（　）", "a": ["基础廊道应布置在坝体上游1/3高度处，平行于坝轴线", "水平廊道应每隔20-30m设置一层，每层廊道需贯通整个坝体", "廊道断面尺寸应满足人员通行，宽度不小于1.2m，高度不小于2.0m", "廊道与坝体混凝土应分开浇筑，避免影响坝体整体性", "", ""], "r": "C", "e": "基础廊道一般布置在坝踵附近，A错误；水平廊道设置间隔及是否贯通要根据实际情况，B错误；廊道应与坝体混凝土同时浇筑，D错误；廊道需满足人员通行，宽度不小于1.2m，高度不小于2.0m，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086937", "t": 1, "q": "重力坝坝体伸缩缝设计中，伸缩缝的间距应根据混凝土浇筑温度、坝体长度和混凝土收缩特性确定，下列关于伸缩缝间距的说法，错误的是（　）", "a": ["混凝土浇筑温度为15-20℃时，伸缩缝间距可采用20-30m", "采用低热水泥混凝土时，伸缩缝间距可适当增大至30-40m", "溢流坝段伸缩缝间距应比非溢流坝段小，一般不大于20m", "伸缩缝间距越大，坝体温度应力越小", "", ""], "r": "D", "e": "伸缩缝间距越大，坝体温度变化时约束越大，温度应力越大，D选项说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086938", "t": 1, "q": "水闸上游翼墙与铺盖的连接方式中，为避免因沉降差异产生裂缝，下列哪种连接方式更合理？", "a": ["刚性连接，翼墙与铺盖整体浇筑", "柔性连接，在翼墙与铺盖之间设置沥青杉木板伸缩缝", "铰接连接，采用钢板连接翼墙与铺盖", "分离连接，翼墙与铺盖之间留10cm宽空隙，不填缝", "", ""], "r": "B", "e": "为避免因沉降差异产生裂缝，需采用能适应变形的连接方式，柔性连接可通过伸缩缝释放变形应力。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086939", "t": 1, "q": "拱坝坝肩岩体加固中，若坝肩存在卸荷裂隙，且裂隙宽度为2-5mm，下列哪种加固措施最有效？", "a": ["对裂隙进行水泥灌浆（固结灌浆）", "在裂隙表面喷射混凝土加固", "在坝肩设置抗滑桩", "对裂隙进行化学灌浆（环氧树脂灌浆）", "", ""], "r": "A", "e": "对于宽度2 - 5mm的卸荷裂隙，水泥灌浆能有效填充裂隙，增强岩体整体性和强度，是常用有效加固方法。喷射混凝土主要用于表面防护；抗滑桩用于处理深层滑动；化学灌浆成本高，一般用于细微裂隙。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086940", "t": 1, "q": "重力坝坝体排水孔设计中，排水孔的孔径和孔距应满足排水要求，下列关于排水孔参数的说法，正确的是（　）", "a": ["排水孔孔径应不小于100mm，孔距应不大于3m", "排水孔孔径应不小于50mm，孔距应不大于5m", "排水孔孔径由施工设备决定，与排水要求无关", "排水孔孔距应不小于坝体厚度的1/2", "", ""], "r": "B", "e": "重力坝排水孔孔径一般不小于50mm，孔距不大于5m。选项A参数错误；C排水孔孔径与排水要求有关；D孔距要求说法错误。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086941", "t": 1, "q": "水闸消力池深度设计中，若闸下收缩断面水深为1.5m，跃后水深为4.0m，下游尾水深度为3.0m，下列关于消力池深度的计算，正确的是（　）", "a": ["消力池深度=跃后水深-尾水深度=1.0m", "消力池深度=跃后水深-收缩断面水深=2.5m", "消力池深度=（跃后水深-尾水深度）+0.5m（安全超高）=1.5m", "消力池深度=尾水深度-收缩断面水深=1.5m", "", ""], "r": "C", "e": "消力池深度计算需考虑跃后水深与尾水深度差值，并加上一定安全超高。本题跃后水深4.0m，尾水深度3.0m，差值为1.0m，再加上0.5m安全超高得1.5m。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249024", "t": 2, "q": "拱坝设计中，影响拱坝体型的主要因素包括（　）", "a": ["河谷形状（宽高比、两岸坡度）", "地基岩性（强度、完整性）", "荷载条件（静水压力、温度荷载）", "施工方法（浇筑强度、运输方式）", "运行要求（泄洪、发电）", ""], "r": "ABCE", "e": "答案：ABCE拱坝体型设计要考虑地形地质、荷载、泄洪、冲沙、建筑布置、施工导流等多种条件。", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249025", "t": 2, "q": "重力坝坝基抗滑稳定计算中，需考虑的荷载包括（　）", "a": ["坝体自重", "坝基扬压力", "水平水压力（上游静水压力、下游水压力）", "坝体混凝土收缩应力", "地基反力", ""], "r": "ABC", "e": "重力坝坝基抗滑稳定计算需考虑使坝体滑动的力和抗滑力，坝体自重、水平水压力是主要作用力，坝基扬压力减小抗滑力，都需考虑；坝体混凝土收缩应力对坝基抗滑稳定影响小，一般不考虑；地基反力是计算结果而非计算需考虑的荷载。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249026", "t": 2, "q": "水闸地下轮廓线的防渗设施包括（　）", "a": ["上游水平铺盖（黏土、沥青混凝土）", "垂直防渗墙（混凝土、钢板桩）", "下游排水孔", "闸室底板", "上游翼墙", ""], "r": "ABD", "e": "水闸地下轮廓线防渗设施主要是阻止水流渗透，上游水平铺盖和垂直防渗墙能增强防渗效果，闸室底板也参与构成地下轮廓起防渗作用。下游排水孔是排水设施，上游翼墙主要作用不是防渗。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249027", "t": 2, "q": "拱坝坝体应力分析的常用方法有（　）", "a": ["纯拱法（仅考虑拱的作用）", "拱梁分载法（考虑拱和梁的共同作用）", "有限元法（三维应力分析）", "材料力学法（简化计算）", "模型试验法（物理模拟）", ""], "r": "ABCE", "e": "拱坝坝体应力分析常用方法多样，纯拱法只考虑拱作用，拱梁分载法考虑拱梁共同作用，有限元法可进行三维应力分析，模型试验法通过物理模拟分析，这些都是常用方法，而材料力学法一般用于重力坝等，并非拱坝常用应力分析方法。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249028", "t": 2, "q": "重力坝混凝土材料需满足的性能要求包括（　）", "a": ["强度（抗压、抗拉强度）", "抗渗性（抵抗渗水）", "抗冻性（抵抗冻融循环）", "低热性（减少温度裂缝）", "耐磨性（针对溢流面）", ""], "r": "ABCDE", "e": "重力坝混凝土要承受各种荷载及环境作用。强度是基本要求，保证结构安全；抗渗能防止水渗入内部影响坝体稳定；抗冻可应对低温冻融破坏；低热性可减少温度应力避免裂缝；溢流面需耐磨抵抗水流冲刷。所以ABCDE选项对应的性能都是重力坝混凝土需满足的。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249029", "t": 2, "q": "水闸闸室结构设计中，闸墩需验算的内容包括（　）", "a": ["强度（压应力、拉应力）", "抗滑稳定（沿基岩面滑动）", "抗倾稳定（绕闸室下游转动）", "裂缝宽度（控制最大裂缝宽度）", "刚度（控制变形）", ""], "r": "ADE", "e": "闸墩是闸室的组成部分，需验算其强度，避免压应力、拉应力过大破坏；要控制裂缝宽度防止影响结构耐久性；同时要控制其变形，保证刚度。而抗滑稳定和抗倾稳定一般是对整个闸室而言，并非闸墩验算内容。所以答案选ADE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249030", "t": 2, "q": "拱坝坝肩稳定分析中，可能的滑动模式包括（　）", "a": ["沿单一结构面滑动（如断层、层面）", "沿两组结构面交线滑动（楔形滑动体）", "沿坝体与基岩接触面滑动", "坝肩岩体整体滑动（深层滑动）", "坝体自身剪切滑动", ""], "r": "ABCD", "e": "拱坝坝肩稳定分析中，常见滑动模式有沿单一结构面、两组结构面交线、坝体与基岩接触面、坝肩岩体整体滑动等。坝体自身剪切滑动不属于坝肩稳定分析中可能的滑动模式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249031", "t": 2, "q": "重力坝溢流段设计中，需考虑的水力参数包括（　）", "a": ["溢流堰顶水头", "泄流量（设计洪水、校核洪水）", "水流流速（坝面流速、收缩断面流速）", "水跃长度（消能池设计）", "坝体混凝土温度", ""], "r": "ABCD", "e": "重力坝溢流段设计主要关注水力相关参数，溢流堰顶水头、泄流量、水流流速、水跃长度都和水流情况有关，而坝体混凝土温度是温度方面因素与水力无关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249032", "t": 2, "q": "水闸下游消能防冲设施包括（　）", "a": ["护坦（消力池底板）", "海漫（防冲槽上游的柔性护底）", "防冲槽（齿墙式或抛石式）", "下游翼墙", "排水孔", ""], "r": "ABC", "e": "水闸下游消能防冲设施主要作用是消除水流能量、防止冲刷，护坦、海漫、防冲槽都有此作用。下游翼墙主要起引导水流等作用，排水孔用于排水等，并非消能防冲设施。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249033", "t": 2, "q": "拱坝荷载组合中，基本荷载组合包括的荷载有（　）", "a": ["坝体自重", "静水压力（正常蓄水位）", "扬压力", "温度荷载（运行期温降）", "冰压力（冬季结冰期）", ""], "r": "ABCDE", "e": "基本荷载组合是正常运行工况下的荷载组合。坝体自重、正常蓄水位静水压力、扬压力、运行期温降温度荷载、冬季结冰期冰压力都是基本荷载组合包含的。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249034", "t": 2, "q": "重力坝坝体分缝的类型包括（　）", "a": ["伸缩缝（温度缝）", "沉降缝（适应不均匀沉降）", "施工缝（浇筑分层缝）", "防震缝（抗震设计）", "裂缝（有害裂缝）", ""], "r": "ABC", "e": "重力坝坝体分缝有伸缩缝（温度缝）用于适应温度变化，沉降缝适应不均匀沉降，施工缝是浇筑分层缝。防震缝一般不是重力坝常规分缝类型，裂缝是有害的，不属于正常分缝类型。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249035", "t": 2, "q": "水闸闸室底板的类型包括（　）", "a": ["整体式底板（与闸墩整体浇筑）", "分离式底板（与闸墩分开浇筑）", "悬臂式底板（一端固定在闸墩上）", "简支式底板（两端支撑在闸墩上）", "装配式底板（预制混凝土板拼装）", ""], "r": "AB", "e": "水闸闸室底板按结构形式分整体式和分离式，整体式是与闸墩整体浇筑，分离式是与闸墩分开浇筑。悬臂式和简支式是整体式底板中具体的结构形式。装配式并非底板常见类型分类。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249036", "t": 2, "q": "拱坝地基处理的主要措施包括（　）", "a": ["地基开挖（清除风化岩、软弱夹层）", "固结灌浆（提高岩体完整性）", "帷幕灌浆（形成防渗帷幕）", "断层处理（混凝土塞、锚固）", "坝基排水（降低扬压力）", ""], "r": "ABCDE", "e": "拱坝地基处理目的是提高地基强度、整体性、防渗性等。A清除不良岩体可增强地基承载；B固结灌浆提升岩体完整性；C帷幕灌浆防止渗漏；D处理断层保证地基稳定；E坝基排水降低扬压力。这些都是常见地基处理措施。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249037", "t": 2, "q": "重力坝坝体廊道的作用包括（　）", "a": ["观测（监测坝体应力、渗压）", "检修（检查坝体内部缺陷）", "排水（降低坝体扬压力）", "交通（人员、设备通行）", "浇筑（混凝土运输通道）", ""], "r": "ABCD", "e": "重力坝坝体廊道可用于观测坝体应力、渗压等；能对坝体内部缺陷进行检查检修；可排水降低坝体扬压力；方便人员和设备通行。而混凝土运输一般不通过廊道，所以 E 选项错误。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249038", "t": 2, "q": "水闸上游翼墙的布置形式包括（　）", "a": ["圆弧式翼墙（适应弯曲河道）", "折线式翼墙（转角较小）", "直线式翼墙（顺直河道）", "扭曲面翼墙（连接闸室与河道）", "悬臂式翼墙（浅基础）", ""], "r": "ABCD", "e": "水闸上游翼墙布置形式有圆弧式翼墙适应弯曲河道、折线式翼墙转角较小、直线式翼墙用于顺直河道、扭曲面翼墙可连接闸室与河道。悬臂式翼墙不是常见的上游翼墙布置形式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249039", "t": 2, "q": "拱坝泄洪建筑物的类型包括（　）", "a": ["坝顶溢洪道（开敞式、胸墙式）", "坝身孔口（中孔、底孔）", "岸边溢洪道（正槽式、侧槽式）", "泄洪隧洞（有压、无压）", "消力池", ""], "r": "ABCD", "e": "拱坝泄洪建筑物有坝顶溢洪道（包含开敞式、胸墙式）、坝身孔口（中孔、底孔）、岸边溢洪道（正槽式、侧槽式）、泄洪隧洞（有压、无压）等类型，消力池是消能设施不是泄洪建筑物类型。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249040", "t": 2, "q": "重力坝抗滑稳定计算的方法包括（　）", "a": ["单一安全系数法（抗剪公式、抗剪断公式）", "分项系数极限状态法", "有限元法（渗流-应力耦合分析）", "模型试验法（物理模拟滑动）", "材料力学法", ""], "r": "ABCD", "e": "重力坝抗滑稳定计算方法有单一安全系数法（含抗剪、抗剪断公式）、分项系数极限状态法、有限元法（渗流 - 应力耦合分析）、模型试验法（物理模拟滑动）。材料力学法是计算坝体应力的方法，非抗滑稳定计算方法。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249041", "t": 2, "q": "水闸运行期需监测的项目包括（　）", "a": ["闸基渗压（扬压力、渗透坡降）", "闸室沉降、倾斜", "坝体应力（混凝土应力、钢筋应力）", "水流流态（下游消能情况）", "闸门启闭设备运行状态", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249042", "t": 2, "q": "拱坝坝体混凝土浇筑的质量控制要点包括（　）", "a": ["浇筑温度（控制在10-25℃）", "分层厚度（不大于振捣器有效深度）", "平仓振捣（保证密实度，避免漏振）", "养护（保湿、保温，防止裂缝）", "配合比（控制水灰比、坍落度）", ""], "r": "ABCDE", "e": "拱坝坝体混凝土浇筑质量控制需从多方面着手，配合比影响混凝土性能，要控制水灰比和坍落度；浇筑温度影响混凝土凝结和强度，需合理控制；分层厚度关系振捣效果，不能大于振捣器有效深度；平仓振捣保证混凝土密实度；养护能防止裂缝产生。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249043", "t": 2, "q": "重力坝坝基帷幕灌浆的设计要求包括（　）", "a": ["灌浆孔应布置在坝基上游侧，平行于坝轴线", "灌浆孔深度应穿透主要透水层，进入相对隔水层", "灌浆压力应根据地基岩性确定，避免抬动基岩", "灌浆材料采用水泥浆，水灰比为0.5-1.0", "帷幕灌浆应在坝体混凝土浇筑完成后进行", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249044", "t": 2, "q": "水闸消力池的类型包括（　）", "a": ["挖深式消力池（降低池底高程）", "拓宽式消力池（增大消能面积）", "综合式消力池（挖深+拓宽）", "差动式消力池（池底设消力坎）", "折线式消力池（池底呈折线）", ""], "r": "ABCD", "e": "水闸消力池常见类型有挖深式、拓宽式、综合式、差动式等。A是通过降低池底高程消能；B增大消能面积；C结合了挖深和拓宽；D池底设消力坎；E并非常见消力池类型。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249045", "t": 2, "q": "拱坝坝肩锚固的适用情况包括（　）", "a": ["坝肩岩体存在软弱结构面，抗滑稳定性不足", "坝肩开挖后产生卸荷裂隙，岩体完整性降低", "拱坝承受的水平推力较大，地基承载力不足", "坝体混凝土强度不足，需外部加固", "运行期坝肩岩体出现位移，需补强", ""], "r": "ABCE", "e": "坝肩锚固主要是针对坝肩岩体问题，增强其稳定性。A选项软弱结构面影响抗滑稳定可锚固；B选项卸荷裂隙使岩体完整性降低可锚固；C选项水平推力大、地基承载力不足时，锚固可增强坝肩承载能力；E选项运行期坝肩岩体位移可通过锚固补强。而D选项是坝体混凝土强度问题，与坝肩锚固无关。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249046", "t": 2, "q": "重力坝溢流面混凝土的性能要求高于坝体内部混凝土，主要因为（　）", "a": ["承受高速水流冲刷，需高耐磨性", "处于水位变动区，需高抗冻性", "承受水流脉动压力，需高抗拉强度", "受阳光照射，需高抗裂性", "与空气接触，需高抗碳化性", ""], "r": "ABC", "e": "溢流面混凝土直接接触高速水流，会受其冲刷，所以要有高耐磨性；处于水位变动区，需有高抗冻性；承受水流脉动压力，需有高抗拉强度。而坝体内部混凝土也可能受阳光照射、与空气接触，这不是溢流面性能要求高的主要原因。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249047", "t": 2, "q": "水闸铺盖的作用包括（　）", "a": ["延长渗径，降低闸基渗透坡降", "保护闸室底板，避免水流冲刷", "扩散闸基反力，减少不均匀沉降", "防渗，阻止闸基渗水", "调节闸室与河道的水流衔接", ""], "r": "AD", "e": "铺盖作用主要是防渗和延长渗径降低渗透坡降。选项A符合延长渗径作用；选项D符合防渗作用。B是护坦作用；C是闸室底板作用；E是消能防冲设施等作用。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249048", "t": 2, "q": "拱坝温度控制的措施包括（　）", "a": ["采用低热水泥，减少水化热", "混凝土浇筑时加冰或冷水，降低浇筑温度", "坝体设置冷却水管，强制降温", "坝体表面覆盖保温材料，减少温度波动", "合理安排浇筑顺序，避免高差过大", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249049", "t": 2, "q": "重力坝坝体裂缝按成因可分为（　）", "a": ["温度裂缝（水化热、温降产生）", "干缩裂缝（混凝土养护不足）", "荷载裂缝（应力超过强度）", "施工裂缝（浇筑、振捣不当）", "冻融裂缝（冻融循环作用）", ""], "r": "ABCDE", "e": "重力坝坝体裂缝成因多样，温度变化、干缩、荷载作用、施工问题、冻融循环等都可能导致裂缝。选项ABCDE分别对应了这几种常见成因。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249050", "t": 2, "q": "水闸闸门的类型包括（　）", "a": ["弧形闸门（适用于大孔口、高水头）", "平面闸门（适用于中小孔口、低水头）", "蝶形闸门（适用于管道出口）", "翻板闸门（适用于小型水闸）", "人字闸门（适用于船闸）", ""], "r": "ABCDE", "e": "这道题考查水闸闸门类型及适用场景的知识。各选项描述均正确，所以全选。答案为ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249051", "t": 2, "q": "拱坝坝体应力控制的指标包括（　）", "a": ["最大主拉应力（不超过限值）", "最大主压应力（不超过混凝土抗压强度）", "剪应力（不超过抗剪强度）", "裂缝宽度（不超过允许值）", "温度应力（不超过设计值）", ""], "r": "AB", "e": "根据《混凝土拱坝设计规范》（SL 282-2018）的规定，拱坝坝体应力控制的主要指标包括：最大主拉应力（A）和最大主压应力（B）。其中，最大主拉应力不应超过坝体混凝土的允许拉应力限值，最大主压应力不应超过坝体混凝土的抗压强度（并需考虑安全系数）。剪应力（C）虽在拱坝应力分析中需要计算，但并非规范中单独列出的主要应力控制指标；裂缝宽度（D）是重力坝等坝型裂缝控制的内容，拱坝设计中通常以拉应力控制来避免裂缝，而非直接控制裂缝宽度；温度应力（E）是拱坝设计的重要考虑因素，但规范中通过温度荷载和分缝等措施加以控制，并不单独作为坝体应力控制的指标列出。因此，正确答案为A、B。", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249052", "t": 2, "q": "重力坝地基排水系统的组成包括（　）", "a": ["主排水孔（靠近坝基上游）", "辅助排水孔（靠近坝基下游）", "排水廊道（收集渗水）", "反滤层（防止渗透变形）", "防渗帷幕（阻挡渗水）", ""], "r": "ABCD", "e": "答案：ABCD重力坝地基排水系统的组成包括：主排水孔（靠近坝基上游）、辅助排水孔（靠近坝基下游）、排水廊道（收集渗水）、反滤层（防止渗透变形）。", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249053", "t": 2, "q": "水闸闸室稳定计算的内容包括（　）", "a": ["抗滑稳定（沿闸基滑动）", "抗倾稳定（绕闸室下游边缘转动）", "地基承载力（闸基压应力不超过限值）", "不均匀沉降（控制最大沉降差）", "裂缝宽度（控制闸室底板裂缝）", ""], "r": "ABCD", "e": "水闸闸室稳定计算主要确保闸室在各种荷载作用下安全稳定。需核算抗滑、抗倾稳定，保证地基有足够承载力，控制不均匀沉降。而裂缝宽度一般是结构设计中对构件裂缝的控制，不属于闸室稳定计算内容。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649088", "t": 3, "q": "拱坝的水平拱圈半径越小，拱的传力效果越好，坝体厚度可越小，但对河谷形状的要求越严格。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水平拱圈半径小，拱的轴线短，传力路径短，传力效果好，坝体厚度就能减小；但半径小会让拱坝对河谷形状适应性变差，要求更严格。", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649089", "t": 3, "q": "重力坝抗滑稳定计算中，抗剪断安全系数的限值比抗剪安全系数的限值小，因为抗剪断公式考虑了黏聚力的作用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649090", "t": 3, "q": "水闸地下轮廓线的长度应根据地基渗透系数和闸室水头确定，渗透系数越大，所需防渗长度越长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水闸地下轮廓线长度与地基渗透系数和闸室水头有关，渗透系数大意味着水流更易渗透，为防止渗透破坏，所需防渗长度就越长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649091", "t": 3, "q": "拱坝坝体温度应力中，温降应力会使坝体产生压应力，温升应力会使坝体产生拉应力，因此温降对拱坝更不利。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "温降使坝体产生拉应力，温升使坝体产生压应力，而拱坝混凝土抗拉能力差，拉应力更易使坝体出现裂缝，所以温降对拱坝更不利，题干表述温降应力性质错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649092", "t": 3, "q": "重力坝坝体混凝土采用分层浇筑时，分层厚度越大，混凝土水化热散发越慢，温度裂缝产生的风险越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分层厚度大，混凝土内部热量不易散发，水化热聚集，会使内外温差增大，从而增加温度裂缝产生风险。", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649093", "t": 3, "q": "水闸消力池的作用是通过形成水跃消耗水流能量，因此消力池深度越大，消能效果越好，无需考虑经济性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水闸消力池虽通过水跃消能，但设计时要综合考虑消能效果与经济性，并非深度越大越好，过深会大幅增加成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649094", "t": 3, "q": "拱坝坝肩稳定分析中，若坝肩岩体为完整的花岗岩，且无明显结构面，则坝肩滑动的风险主要来自坝体与基岩接触面的滑动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完整花岗岩无明显结构面时，坝肩岩体自身稳定性较好，此时坝体与基岩接触面相对薄弱，坝肩滑动风险主要源于此。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649095", "t": 3, "q": "重力坝溢流坝段的堰顶高程应高于正常蓄水位，以保证水库正常蓄水时不泄流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重力坝溢流坝段堰顶高程通常低于正常蓄水位，这样在水库水位达到正常蓄水位时，可根据需要泄流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649096", "t": 3, "q": "水闸上游铺盖采用黏土材料时，黏土的渗透系数应小于1×10^-6cm/s，且铺盖厚度应不小于0.5m，以保证防渗效果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水闸上游黏土铺盖要求黏土渗透系数小于1×10⁻⁶cm/s且厚度不小于0.5m来保障防渗效果，这是水闸防渗设计的常规要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649097", "t": 3, "q": "拱坝坝体廊道应尽量布置在坝体应力较小的区域，如坝体上游1/3高度处，以减少廊道对坝体整体性的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "拱坝坝体廊道布置在应力较小区域可降低对坝体整体性影响，坝体上游1/3高度处通常应力较小，符合廊道布置原则。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649098", "t": 3, "q": "重力坝抗浮稳定安全系数的计算的分子是坝体自重，分母是坝基扬压力，安全系数应不小于1.05。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重力坝抗浮稳定安全系数计算分子是作用于坝体的有效重力（不只是自重），分母是坝基扬压力，且安全系数应不小于1.1。所以题干表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649099", "t": 3, "q": "水闸闸墩的强度计算中，需考虑闸门关闭时传来的水压力，该压力按均布荷载作用于闸墩的迎水面。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649100", "t": 3, "q": "拱坝荷载组合中，地震荷载属于特殊荷载组合，仅在地震烈度≥7度的地区才需考虑。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "拱坝设计时，地震荷载属于特殊荷载组合，且规范规定仅在地震烈度≥7度的地区才需考虑该荷载。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649101", "t": 3, "q": "重力坝坝基固结灌浆的目的是提高地基的防渗性能，帷幕灌浆的目的是提高地基的强度和完整性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "固结灌浆目的是提高地基强度和完整性，帷幕灌浆目的是提高地基防渗性能，题干说法将二者目的弄反。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649102", "t": 3, "q": "水闸下游海漫采用浆砌石材料时，海漫的长度应根据闸下泄流量和河床土质确定，流量越大、河床土质越软，海漫长度应越长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流量大、河床土质软时，水流能量大且河床易被冲刷，所以需更长海漫来进一步消能、调整流速分布和保护河床。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649103", "t": 3, "q": "拱坝坝体混凝土的强度等级应从坝顶到坝底逐渐降低，因为坝底承受的压力更大，需更高强度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。拱坝坝体混凝土强度等级应从坝顶到坝底逐渐提高，原因就是坝底承受压力更大，需要更高强度的混凝土，而不是逐渐降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649104", "t": 3, "q": "重力坝坝体伸缩缝应设置止水设施（如铜片止水、橡胶止水），以防止水流通过伸缩缝渗漏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "重力坝伸缩缝若不设置止水设施，水会通过伸缩缝渗漏，影响坝体安全和正常运行，所以需设置止水设施。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649105", "t": 3, "q": "水闸闸室底板采用整体式底板时，底板与闸墩之间应设置沉降缝，以适应两者的沉降差异。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "整体式底板与闸墩是刚性连接共同工作，不设沉降缝。", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649106", "t": 3, "q": "拱坝坝肩锚固采用预应力锚杆时，锚杆的锚固深度应进入坝肩稳定岩体，锚固力应大于拱坝传递给坝肩的水平推力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "预应力锚杆锚固深度进入坝肩稳定岩体可保证锚固效果，且锚固力大于拱坝传递给坝肩水平推力才能保证坝肩稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649107", "t": 3, "q": "重力坝下游面的排水孔应布置在坝体下游1/3高度处，以有效降低坝体内部的扬压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649108", "t": 3, "q": "水闸上游翼墙的扩散角应根据水流条件确定，扩散角越大，水流越平顺，对河道的扰动越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水闸上游翼墙扩散角过大，会使水流分散，导致水流紊乱，并非扩散角越大水流越平顺、对河道扰动越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649109", "t": 3, "q": "拱坝泄洪采用坝身底孔时，底孔的进口高程应低于正常蓄水位，以保证在低水位时仍能泄洪。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "坝身底孔进口高程低于正常蓄水位，可使水库在水位较低时，水也能流入底孔实现泄洪。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649110", "t": 3, "q": "重力坝抗滑稳定计算中，若坝基存在倾斜的软弱夹层，应按沿软弱夹层的滑动面进行计算，而非沿坝基水平面。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在重力坝抗滑稳定计算里，当坝基有倾斜软弱夹层时，软弱夹层是薄弱部位，抗滑稳定性由其控制，所以应按沿软弱夹层的滑动面计算。", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649111", "t": 3, "q": "水闸铺盖与闸室底板的连接应采用刚性连接，以保证两者的整体性，避免渗漏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水闸铺盖与闸室底板连接应采用柔性连接，而非刚性连接，柔性连接可适应两者之间的不均匀沉降，防止因沉降差导致裂缝而产生渗漏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649112", "t": 3, "q": "拱坝坝体应力分析采用拱梁分载法时，需将坝体分为拱和梁两个体系，分别计算各自承受的荷载，再进行叠加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "拱梁分载法就是把拱坝视为由一系列水平拱圈和竖直梁所组成，将荷载由拱和梁共同承担，通过试载计算，确定拱和梁各自承受的荷载，最后叠加应力。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649113", "t": 3, "q": "重力坝混凝土的水灰比越大，混凝土的强度越高，抗渗性和抗冻性越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水灰比越大，意味着混凝土中水分相对较多，会使混凝土内部孔隙增多，强度降低，抗渗性和抗冻性也变差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649114", "t": 3, "q": "水闸消力池的跃后水深应大于下游尾水深度，才能形成淹没水跃，充分消能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当跃后水深大于下游尾水深度时，可形成淹没水跃，利于充分消能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649115", "t": 3, "q": "拱坝地基处理中，帷幕灌浆的孔距应根据地基渗透系数确定，渗透系数越大，孔距应越小，以保证防渗效果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "渗透系数大意味着地基透水性强，为保证帷幕的连续性和防渗效果，需减小孔距使灌浆形成的防渗体更紧密。", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649116", "t": 3, "q": "重力坝坝体内部混凝土的主要要求是低热性，强度等级可低于表层混凝土，以降低成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "坝体内部混凝土不受外荷载的直接作用，主要考虑低热性，且强度要求低于表层混凝土，降低强度等级能降低成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649117", "t": 3, "q": "水闸闸门的启闭力计算中，闭门力应考虑闸门自重、水压力和摩阻力，启门力仅考虑闸门自重和摩阻力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "启门力要考虑闸门自重、水压力、摩阻力等，闭门力考虑闸门自重、水压力和摩阻力等，题干中对启门力考虑因素表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649118", "t": 3, "q": "水闸下游防冲槽的作用是保护海漫的末端，防止海漫被水流冲刷破坏，一般采用抛石或混凝土齿墙结构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水闸下游防冲槽确实有保护海漫末端、防止海漫被水流冲刷破坏的作用，常见结构有抛石或混凝土齿墙结构。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649119", "t": 3, "q": "拱坝坝体廊道的断面尺寸应满足设备运输要求，宽度不小于1.5m，高度不小于2.5m，以方便检修设备通行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "拱坝坝体廊道断面尺寸要满足设备运输、人员通行及通风等要求，一般宽度不小于1.2m，高度不小于2.2m 。题干中宽度和高度要求错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649120", "t": 3, "q": "重力坝溢流面采用幂函数曲线（渥奇曲线）时，曲线的幂指数n越大，溢流面下游段越平缓，水流流速越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649121", "t": 3, "q": "水闸闸墩的裂缝宽度应控制在0.2mm以内，以防止裂缝漏水影响闸墩的耐久性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水闸闸墩裂缝过宽会导致漏水，影响其耐久性，通常需将裂缝宽度控制在0.2mm以内。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649122", "t": 3, "q": "拱坝坝肩稳定计算中，若楔形滑动体的重量越大，滑动面上的正压力越大，摩擦力越大，楔形体越稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649123", "t": 3, "q": "重力坝坝体混凝土浇筑时，浇筑温度应控制在25℃以下，当气温高于30℃时，应采取遮阳、加冰等降温措施。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "重力坝坝体混凝土浇筑时，为避免混凝土因温度变化产生裂缝等问题，通常要控制浇筑温度，一般控制在25℃以下，气温高于30℃时采取遮阳、加冰等降温措施是常见做法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649124", "t": 3, "q": "水闸上游铺盖的长度应不小于闸室底板长度的2倍，以保证足够的防渗长度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水闸上游铺盖长度需根据闸基土质、水头大小等多因素综合确定，并非固定不小于闸室底板长度的2倍。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649125", "t": 3, "q": "拱坝荷载组合中，校核洪水位水压力属于特殊荷载组合，对应的坝体应力控制标准可适当放宽，如主拉应力限值可提高至1.5MPa。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "校核洪水位水压力确实属于特殊荷载组合，这种情况下坝体应力控制标准可适当放宽，主拉应力限值提高至1.5MPa。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第2章 水利与水电||第6节 工程水文学基本理论", "n": "第2章 水利与水电 / 第6节 工程水文学基本理论", "qs": [{"id": "2035637121905201152", "t": 1, "q": "在水文循环中，下列哪项不是影响水汽输送的主要气象因子？", "a": ["大气环流", "海陆分布", "地形起伏", "洋流", "", ""], "r": "D", "e": "大气环流是水汽输送的主要动力；海陆分布影响水汽源地和输送路径；地形起伏会阻挡或抬升气流影响水汽输送。而洋流主要影响海洋水温等，对水汽输送并非主要气象因子。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201153", "t": 1, "q": "某流域多年平均降水量为1200毫米，多年平均蒸发量为700毫米，多年平均径流深为400毫米，该流域多年平均下渗量最接近下列哪个值？", "a": ["100毫米", "200毫米", "300毫米", "500毫米", "", ""], "r": "A", "e": "根据水量平衡原理，降水量=蒸发量 + 径流深 + 下渗量。所以下渗量 = 降水量 - 蒸发量 - 径流深，即1200 - 700 - 400 = 100毫米。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201154", "t": 1, "q": "在径流形成过程中，\"蓄满产流\"模式的核心特征是？", "a": ["降雨强度大于下渗强度时才产流", "流域蓄水量达到田间持水量后才产流", "只在地表产生径流", "地下径流占总径流比例极小", "", ""], "r": "B", "e": "蓄满产流是指当包气带土壤含水量达到田间持水量后才产流。A选项是超渗产流特征；蓄满产流不仅有地表径流还有地下径流，C错；其地下径流占比不小，D错。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201155", "t": 1, "q": "水文站观测水位时，若采用的基面是绝对基面，下列关于该基面的说法正确的是？", "a": ["绝对基面是某一测站最枯水位以下的某一固定点", "我国通常采用的绝对基面是吴淞基面", "绝对基面是指海平面基面，我国统一采用黄海基面", "绝对基面随流域水文条件变化而调整", "", ""], "r": "C", "e": "绝对基面指海平面基面，我国统一采用黄海基面。A说的不是绝对基面概念；我国通常采用黄海基面，不是吴淞基面，B错；绝对基面是固定的，不随流域水文条件变化调整，D错。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201156", "t": 1, "q": "在水文频率分析中，绘制经验频率曲线时，对于n个水文样本（按从大到小排序），第m项的经验频率P的计算公式（海森公式）是？", "a": ["P=m/(n+1)×100%", "P=(m-0.5)/n×100%", "P=(m-0.3)/(n+0.4)×100%", "P=(m-0.4)/(n+0.2)×100%", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201157", "t": 1, "q": "某流域设计洪水计算中，采用暴雨资料推求设计洪水时，若暴雨的时程分配采用同频率放大法，其放大的核心原则是？", "a": ["对暴雨过程中所有时段的雨量按同一倍比放大", "对设计暴雨时段内各控制时段的雨量按各自的频率倍比放大", "只放大暴雨过程中的最大1小时雨量", "按暴雨的均值倍数放大", "", ""], "r": "B", "e": "同频率放大法是按设计暴雨时段内各控制时段的雨量按各自的频率倍比放大。A选项是同倍比放大法；C选项只放大最大1小时雨量不符合同频率放大法；D选项按均值倍数放大也不是同频率放大法的核心。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201158", "t": 1, "q": "下列关于流域水文模型的说法，错误的是？", "a": ["新安江模型是典型的概念性水文模型", "分布式水文模型能考虑流域下垫面空间异质性", "黑箱模型需要详细的流域物理参数", "概念性模型通过简化物理过程构建数学关系", "", ""], "r": "C", "e": "黑箱模型不考虑系统内部结构和物理过程，不需要详细的流域物理参数，C说法错误。新安江模型是概念性水文模型；分布式水文模型可考虑下垫面空间异质性；概念性模型简化物理过程构建数学关系，A、B、D正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201159", "t": 1, "q": "在水位流量关系曲线的延长中，若采用曼宁公式延长高水位段，需要已知的参数不包括？", "a": ["河道糙率", "河道比降", "断面平均流速", "断面面积", "", ""], "r": "C", "e": "曼宁公式为「test/yiwen_img/importSubject/2035637119237623808.png」，式中n是河道糙率，S是河道比降，R与断面面积等有关。而用该公式延长高水位段不需要已知断面平均流速。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201160", "t": 1, "q": "某水文站测得某年年径流量为10亿立方米，该年流域平均降水量为1000毫米，流域面积为2000平方公里，该年的径流系数为？", "a": ["0.5", "0.6", "0.7", "0.8", "", ""], "r": "A", "e": "先将流域面积单位换算为平方米，2000平方公里 = 2×10⁹平方米，降水量1000毫米 = 1米，降水总量 = 2×10⁹×1 = 2×10⁹立方米 = 20亿立方米。径流系数 = 年径流量÷降水总量 = 10÷20 = 0.5。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201161", "t": 1, "q": "在设计年径流计算中，当流域缺乏长期径流资料时，常用的方法是？", "a": ["频率分析法", "等值线图法", "经验频率法", "相关分析法", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201162", "t": 1, "q": "下列关于水文循环中\"大循环\"的说法正确的是？", "a": ["仅发生在陆地内部的水循环", "仅发生在海洋内部的水循环", "发生在海洋与陆地之间的水循环", "发生在大气圈内部的水循环", "", ""], "r": "C", "e": "水文循环中“大循环”指的是海洋与陆地之间的水循环。陆地内部、海洋内部水循环是小循环，大气圈内部一般不存在完整意义水循环。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201163", "t": 1, "q": "某暴雨的重现期为50年，其对应的频率P为？", "a": ["1%", "2%", "5%", "10%", "", ""], "r": "B", "e": "重现期T与频率P关系为P=1/T ，本题重现期T = 50年，所以P = 1/50 = 2%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201164", "t": 1, "q": "在水文测验中，采用流速仪法测流时，若断面内流速分布不均匀，合理的测流方法是？", "a": ["在断面中心处测一个点的流速代表平均流速", "将断面分成若干部分，分别测各部分流速再计算总流量", "只测水面流速，按固定系数换算为平均流速", "测断面两岸流速，取平均值代表平均流速", "", ""], "r": "B", "e": "当断面内流速分布不均匀时，要准确测流应将断面细分，分别测各部分流速再算总流量。A选项单点流速不能代表平均流速；C选项仅测水面流速换算不准确；D选项两岸流速平均值不能代表全断面平均流速。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201165", "t": 1, "q": "下列哪种方法不属于设计洪水过程线的推求方法？", "a": ["同频率放大法", "同倍比放大法", "经验适线法", "综合单位线法", "", ""], "r": "C", "e": "经验适线法主要用于频率曲线的拟合，确定水文变量的统计参数，并非设计洪水过程线的推求方法。同频率放大法、同倍比放大法是常用的放大典型洪水过程线以推求设计洪水过程线的方法，综合单位线法可用于推求流域出口断面的洪水过程。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201166", "t": 1, "q": "在流域产流计算中，\"超渗产流\"主要发生在下列哪种流域？", "a": ["湿润地区的森林流域", "半干旱地区的黄土流域", "平原地区的水稻田流域", "沿海地区的沼泽流域", "", ""], "r": "B", "e": "超渗产流是降雨强度超过土壤下渗强度而产生的地面径流。半干旱地区黄土流域，土壤透水性差，降雨时易超渗形成产流。而湿润地区森林流域、平原水稻田流域、沿海沼泽流域土壤下渗能力相对较强，不易超渗产流。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201167", "t": 1, "q": "某流域的年径流变差系数Cv值越大，说明该流域年径流的？", "a": ["多年平均值越大", "年际变化越剧烈", "年内分配越均匀", "可靠性越高", "", ""], "r": "B", "e": "年径流变差系数Cv反映年径流的年际变化程度，Cv值越大，年际变化越剧烈。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201168", "t": 1, "q": "在水文预报中，短期洪水预报常用的方法是？", "a": ["气候模式法", "单位线法", "经验公式法", "等值线图法", "", ""], "r": "B", "e": "单位线法是短期洪水预报常用方法，能根据降雨过程推求洪水过程；气候模式法常用于气候预测；经验公式法多用于估算简单水文参数等；等值线图法用于展示地理要素空间分布。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201169", "t": 1, "q": "下列关于河道糙率的说法，正确的是？", "a": ["河道糙率随水流速度增大而增大", "河道内植被越多，糙率越小", "河道断面越不规则，糙率越大", "水深越大，糙率越大", "", ""], "r": "C", "e": "糙率反映河渠边界影响水流阻力的综合系数。河道断面不规则会增加水流阻力，糙率越大；水流速度、水深与糙率无此对应增大关系，河道内植被多会使糙率增大。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201170", "t": 1, "q": "在频率分析中，若某水文变量的频率曲线符合皮尔逊III型分布，其形状参数Cs值为正值时，该分布曲线的形态是？", "a": ["对称", "左偏", "右偏", "水平", "", ""], "r": "C", "e": "皮尔逊III型分布中，Cs为偏态系数，Cs=0时曲线对称，Cs>0时右偏，Cs<0时左偏。本题Cs值为正，所以是右偏。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201171", "t": 1, "q": "某流域采用泰森多边形法计算平均降雨量，若某雨量站的泰森多边形面积为50平方公里，该站降雨量为100毫米，另一雨量站泰森多边形面积为100平方公里，降雨量为80毫米，该流域平均降雨量为？", "a": ["86.7毫米", "90毫米", "93.3毫米", "85毫米", "", ""], "r": "A", "e": "根据泰森多边形法计算流域平均降雨量公式：「test/yiwen_img/importSubject/2035637119380230144.png」，这里「test/yiwen_img/importSubject/2035637119426367488.png」平方公里，「test/yiwen_img/importSubject/2035637119518642176.png」毫米，「test/yiwen_img/importSubject/2035637119636082688.png」平方公里，「test/yiwen_img/importSubject/2035637119698997248.png」毫米，代入可得「test/yiwen_img/importSubject/2035637119749328896.png」毫米。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201172", "t": 1, "q": "下列哪项不是影响流域下渗的因素？", "a": ["土壤质地", "植被覆盖率", "流域面积", "降雨强度", "", ""], "r": "C", "e": "土壤质地、植被覆盖率、降雨强度都会影响下渗，而流域面积主要与集水范围等有关，并非影响下渗的直接因素。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201173", "t": 1, "q": "在设计枯水流量计算中，若采用历时曲线法，其设计枯水流量是指？", "a": ["某一重现期的最小日流量", "某一历时内的最小平均流量", "多年最小日流量", "历史最小瞬时流量", "", ""], "r": "B", "e": "历时曲线法是按时间顺序统计不同历时的平均流量，设计枯水流量是某一历时内的最小平均流量。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201174", "t": 1, "q": "水文循环的主要动力是？", "a": ["地球引力", "太阳辐射", "大气压力", "地转偏向力", "", ""], "r": "B", "e": "太阳辐射提供热量使水蒸发，是水文循环的主要动力。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201175", "t": 1, "q": "在分布式水文模型中，下列哪种数据不是必需的输入数据？", "a": ["数字高程模型（DEM）", "土地利用类型图", "流域多年平均蒸发量", "土壤类型分布图", "", ""], "r": "C", "e": "分布式水文模型需考虑流域空间异质性，DEM用于分析地形，土地利用类型图和土壤类型分布图对产汇流模拟重要。而流域多年平均蒸发量是统计数据，不是模拟中必需输入的直接体现空间分布特征的数据。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201176", "t": 1, "q": "某水文站的水位流量关系曲线发生了\"高水延长\"，其原因可能是？", "a": ["河道冲刷导致断面面积增大", "河道淤积导致断面面积减小", "测流期间降雨量过大", "测流仪器精度下降", "", ""], "r": "A", "e": "高水延长是指超出实测流量范围的水位流量关系外延，河道冲刷使断面面积增大，水位流量关系会改变，需高水延长；B淤积使面积减小不是高水延长原因；C降雨大不是高水延长主因；D仪器精度下降不影响水位流量关系本身。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201177", "t": 1, "q": "在年径流计算中，若流域存在水利工程（如水库），对年径流的影响主要是？", "a": ["增大年径流总量", "减小年径流总量", "改变年径流的年内分配", "改变年径流的年际变化", "", ""], "r": "C", "e": "水库主要作用是调节径流，把丰水期的水存起来，枯水期放出去，主要改变的是年径流的年内分配。水库一般不会明显改变年径流总量，对年际变化影响也较小。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201178", "t": 1, "q": "下列关于暴雨强度公式i=A/(t+b)^n的说法，正确的是？", "a": ["i是暴雨历时t对应的平均暴雨强度", "A是重现期无关的常数", "b是暴雨强度随历时变化的指数", "n是暴雨历时的修正系数", "", ""], "r": "A", "e": "i是暴雨历时t对应的平均暴雨强度；A与重现期有关；n是暴雨强度随历时变化的指数；b是暴雨历时的修正系数。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201179", "t": 1, "q": "在水文频率分析的适线法中，若经验点据偏于理论频率曲线的上方，说明理论曲线的？", "a": ["均值偏大", "均值偏小", "变差系数Cv偏大", "变差系数Cv偏小", "", ""], "r": "B", "e": "适线法中经验点据偏于理论频率曲线上方，意味着理论曲线整体偏低。均值决定曲线位置，均值偏小会使曲线整体下移。所以是理论曲线均值偏小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201180", "t": 1, "q": "下列哪种径流成分不属于地面径流？", "a": ["超渗雨形成的地表径流", "蓄满产流中的饱和地面径流", "壤中流", "坡面汇流形成的径流", "", ""], "r": "C", "e": "壤中流是在土壤孔隙中流动，属于地下径流，并非地面径流。而超渗雨形成的地表径流、蓄满产流中的饱和地面径流、坡面汇流形成的径流都属于地面径流。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106944", "t": 2, "q": "下列哪些因素会影响水文循环的强度？（　）", "a": ["太阳辐射强度", "大气环流速度", "流域地形坡度", "土壤孔隙度", "海陆分布格局", ""], "r": "ABE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106945", "t": 2, "q": "在径流形成的\"汇流阶段\"，包括的主要过程有？（　）", "a": ["坡面汇流", "壤中流汇流", "地下径流汇流", "河道汇流", "植物截留", ""], "r": "ABCD", "e": "答案：ABCD径流形成的“汇流阶段”主要包括坡面汇流、壤中流汇流、地下径流汇流和河道汇流。植物截留属于降水过程中的一个环节，不属于汇流阶段的主要过程，E错误。故选ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106946", "t": 2, "q": "水文频率分析中，常用的理论频率分布有？（　）", "a": ["皮尔逊III型分布", "对数正态分布", "耿贝尔分布", "正态分布", "指数分布", ""], "r": "ABC", "e": "在水文频率分析里，皮尔逊III型分布是最常用的理论频率分布。对数正态分布、耿贝尔分布也有应用。而正态分布和指数分布一般不用于水文频率分析。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106947", "t": 2, "q": "采用暴雨资料推求设计洪水时，需要进行的主要步骤有？（　）", "a": ["推求设计暴雨", "确定产流参数", "推求设计净雨", "推求设计洪水过程线", "计算流域多年平均径流深", ""], "r": "ABCD", "e": "采用暴雨资料推求设计洪水，先推求设计暴雨，再确定产流参数以推求设计净雨，最后推求设计洪水过程线。计算流域多年平均径流深不是主要步骤。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106948", "t": 2, "q": "下列关于水位流量关系曲线的说法，正确的有？（　）", "a": ["稳定的水位流量关系曲线是单值的", "受洪水涨落影响，水位流量关系可能呈滞后回线", "河道整治会导致水位流量关系曲线发生变化", "水位流量关系曲线可用于插补缺失的流量数据", "同一河道的水位流量关系曲线永久不变", ""], "r": "ABCD", "e": "稳定水位流量关系单值对应，A对；洪水涨落使水位流量关系呈滞后回线，B对；河道整治改变河道条件，水位流量关系曲线会变，C对；水位流量关系曲线能插补流量数据，D对；同一河道条件改变时曲线会变，并非永久不变，E错。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106949", "t": 2, "q": "影响流域年径流变差系数Cv的因素有？（　）", "a": ["流域面积大小", "流域气候类型", "流域下垫面条件", "流域地理位置", "水文站观测精度", ""], "r": "ABCD", "e": "流域年径流变差系数Cv受气候和下垫面因素影响。流域面积大小、下垫面条件、地理位置都与下垫面和气候相关，会影响Cv；气候类型直接影响Cv 。而水文站观测精度与Cv本身大小无关。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106950", "t": 2, "q": "分布式水文模型相比概念性水文模型的优势有？（　）", "a": ["能考虑流域下垫面的空间异质性", "模型参数具有明确的物理意义", "不需要率定模型参数", "能更准确模拟复杂地形下的水文过程", "输入数据需求量更小", ""], "r": "ABD", "e": "分布式水文模型基于物理机制，可考虑下垫面空间异质性，参数有明确物理意义，能准确模拟复杂地形水文过程；但需要率定参数，输入数据需求大。概念性模型参数无明确物理意义，难以考虑下垫面空间异质性。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106951", "t": 2, "q": "在设计枯水流量计算中，常用的方法有？（　）", "a": ["频率分析法", "历时曲线法", "等值线图法", "相关分析法", "经验公式法", ""], "r": "ABDE", "e": "答案：ABDE设计枯水流量计算常用的方法有频率分析法、历时曲线法、相关分析法和经验公式法。等值线图法主要用于地形图的绘制和分析，不是设计枯水流量计算的常用方法。", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106952", "t": 2, "q": "下列属于水文测验中\"降水观测\"常用仪器的有？（　）", "a": ["雨量筒", "虹吸式雨量计", "蒸发器", "水位计", "翻斗式雨量计", ""], "r": "ABE", "e": "雨量筒、虹吸式雨量计、翻斗式雨量计用于降水观测；蒸发器测蒸发量；水位计测水位。答案选ABE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106953", "t": 2, "q": "在河道洪水演进计算中，常用的方法有？（　）", "a": ["马斯京根法", "单位线法", "特征河长法", "有限差分法", "综合瞬时单位线法", ""], "r": "ACD", "e": "马斯京根法是河道洪水演进常用方法；特征河长法也用于河道洪水演进；有限差分法可用于求解河道洪水演进的偏微分方程。单位线法和综合瞬时单位线法主要用于推求流域汇流过程。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106954", "t": 2, "q": "下列关于\"土壤水吸力\"的说法，正确的有？（　）", "a": ["土壤水吸力是土壤对水分的吸附力", "吸湿水的吸力大于膜状水", "毛管水的吸力小于重力水", "土壤水吸力随土壤含水量增大而减小", "土壤水吸力与土壤质地无关", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106955", "t": 2, "q": "影响暴雨损失的因素有？（　）", "a": ["土壤含水量", "植被覆盖率", "降雨强度", "地形坡度", "土壤孔隙度", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106956", "t": 2, "q": "水文预报按预见期长短可分为？（　）", "a": ["短期预报", "中期预报", "长期预报", "超长期预报", "瞬时预报", ""], "r": "ABCD", "e": "水文预报按预见期长短分短期、中期、长期和超长期预报，瞬时预报不属于此分类。答案为ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106957", "t": 2, "q": "下列关于\"设计洪水\"的说法，正确的有？（　）", "a": ["设计洪水是指符合某一设计标准的洪水", "设计洪水包括设计洪峰流量、设计洪水总量、设计洪水过程线", "设计洪水标准越高，对应的洪水量级越大", "设计洪水仅用于水利工程的防洪设计", "设计洪水可通过历史洪水调查补充资料", ""], "r": "ABCE", "e": "设计洪水是符合某一设计标准的洪水，包含洪峰流量、总量和过程线，标准越高洪水量级越大，可通过历史洪水调查补充资料，它也用于桥梁等非水利工程防洪设计，并非仅用于水利工程。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106958", "t": 2, "q": "在年径流的年内分配计算中，常用的表示方法有？（　）", "a": ["月径流分配百分比", "径流年内变化系数", "典型年径流过程线", "年径流变差系数", "季径流总量", ""], "r": "ACE", "e": "年径流年内分配常用月径流分配百分比、典型年径流过程线、季径流总量来表示。径流年内变化系数反映径流年内变化幅度；年径流变差系数反映年径流的年际变化。答案选ACE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106959", "t": 2, "q": "下列属于\"水文循环\"必不可少的环节有？（　）", "a": ["蒸发", "降水", "水汽输送", "地表径流", "地下径流", ""], "r": "ABC", "e": "水文循环中，蒸发使水变为水汽进入大气，水汽输送将水汽带到其他地区，降水让水汽重新回到地面，这三个环节是必不可少的基础环节。地表径流和地下径流是降水后的后续表现，并非必不可少。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106960", "t": 2, "q": "在水位观测中，常用的基面有？（　）", "a": ["绝对基面", "测站基面", "冻结基面", "假定基面", "海森基面", ""], "r": "ABCD", "e": "水位观测常用基面包括绝对基面、测站基面、冻结基面、假定基面。而海森基面并非水位观测常用基面。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106961", "t": 2, "q": "下列关于\"单位线\"的基本假定有？（　）", "a": ["线性假定:净雨强度与径流强度成正比", "倍比假定:净雨总量加倍，径流总量加倍，过程相似", "叠加假定:不同时段净雨产生的径流过程可叠加", "稳定假定:单位线形状不随净雨历时变化", "均匀假定:净雨在流域内均匀分布", ""], "r": "BCE", "e": "单位线基本假定包括倍比假定（净雨总量加倍，径流总量加倍且过程相似）、叠加假定（不同时段净雨产生的径流过程可叠加）、净雨在流域内均匀分布。线性假定表述不准确，单位线形状会随净雨历时变化。答案选BCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106962", "t": 2, "q": "影响河道汇流速度的因素有？（　）", "a": ["河道比降", "河道糙率", "断面面积", "水位高低", "流域面积", ""], "r": "ABCD", "e": "河道比降大、糙率小、断面面积大、水位高都利于水流快速流动，影响汇流速度；流域面积主要影响汇水量而非汇流速度。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106963", "t": 2, "q": "在水文频率分析中，\"历史洪水调查\"的主要目的有？（　）", "a": ["延长水文系列长度", "提高频率分析的精度", "确定设计洪水的重现期", "验证测站观测数据的准确性", "获取流域下垫面资料", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106964", "t": 2, "q": "下列关于\"径流深\"的说法，正确的有？（　）", "a": ["径流深是指将径流量平铺在流域面积上的水深", "径流深的单位通常为毫米或米", "年径流深等于年径流量除以流域面积", "径流深与流域地形坡度无关", "径流深大于降雨量", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106965", "t": 2, "q": "在暴雨历时-频率-强度关系中，下列说法正确的有？（　）", "a": ["相同重现期下，暴雨历时越长，暴雨强度越小", "相同历时下，重现期越大，暴雨强度越大", "暴雨强度随历时的变化率与重现期无关", "相同重现期和历时下，不同地区暴雨强度相同", "暴雨历时越短，强度的变异性越大", ""], "r": "ABE", "e": "A选项，相同重现期，历时越长雨强越小；B选项，相同历时，重现期越大雨强越大；C暴雨强度随历时变化率与重现期有关；D不同地区气候等不同，暴雨强度不同；E暴雨历时短，强度变异性大。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106966", "t": 2, "q": "下列属于概念性水文模型的有？（　）", "a": ["新安江模型", "SWAT模型", "水箱模型", "HEC-HMS模型", "TOPMODEL模型", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106967", "t": 2, "q": "影响土壤下渗能力的因素有？（　）", "a": ["土壤颗粒大小", "土壤结构", "土壤初始含水量", "降雨历时", "植被根系分布", ""], "r": "ABCE", "e": "土壤颗粒大小、结构、初始含水量影响土壤孔隙状况和水分容纳能力；植被根系分布能改善土壤结构增加下渗；降雨历时主要影响降雨量而非下渗能力。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106968", "t": 2, "q": "在设计年径流计算中，\"典型年\"的选择原则有？（　）", "a": ["典型年的径流年内分配应具有代表性", "典型年的年径流总量应接近设计年径流总量", "典型年应选择丰水年", "典型年应选择枯水年", "若有多个典型年，应选择对工程不利的年份", ""], "r": "ABE", "e": "设计年径流计算选典型年，要让径流年内分配有代表性，年径流总量接近设计值，若有多个典型年选对工程不利年份。不一定选丰水年或枯水年。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106969", "t": 2, "q": "下列关于\"水文站网\"的说法，正确的有？（　）", "a": ["水文站网是由多个水文站组成的观测网络", "水文站网的布设应考虑流域面积大小", "水文站网的密度越大，观测数据精度越高", "水文站网应包括水位站、流量站、雨量站等", "水文站网的布设无需考虑经济成本", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106970", "t": 2, "q": "在河道洪水演算中，马斯京根法的基本参数有？（　）", "a": ["传播时间K", "流量系数x", "糙率n", "比降J", "断面面积A", ""], "r": "AB", "e": "马斯京根法基本参数是传播时间K和流量系数x。糙率n、比降J、断面面积A并非马斯京根法基本参数。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106971", "t": 2, "q": "下列属于水文循环中\"小循环\"的有？（　）", "a": ["海洋表面蒸发，形成降水落回海洋", "陆地表面蒸发，形成降水落回陆地", "海洋蒸发的水汽输送到陆地形成降水", "陆地径流汇入海洋", "陆地地下水蒸发形成降水落回陆地", ""], "r": "ABE", "e": "水文循环小循环指局部水循环，包括海洋小循环（从海洋蒸发，降水回海洋）和陆地小循环（陆地蒸发或蒸腾，降水回陆地）。AB选项分别对应海洋小循环和陆地小循环，E选项陆地地下水蒸发成降水落回陆地也属陆地小循环。C是海陆间大循环；D是径流环节属于大循环。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106972", "t": 2, "q": "在年径流的年际变化中，下列说法正确的有？（　）", "a": ["湿润地区年径流的年际变化小于干旱地区", "流域面积越大，年径流的年际变化越小", "有湖泊调节的流域，年径流的年际变化越大", "年径流的年际变化可用变差系数Cv表示", "年径流的年际变化与气候变化无关", ""], "r": "ABD", "e": "湿润地区降水相对稳定，年径流年际变化小于干旱地区；流域面积大，对径流有调节缓冲作用，年际变化小；有湖泊调节的流域，年径流更稳定，年际变化小；变差系数Cv可表示年径流年际变化；年径流年际变化与气候密切相关。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106973", "t": 2, "q": "在暴雨资料的\"一致性\"修正中，需要考虑的因素有？（　）", "a": ["气候变迁", "下垫面变化", "观测仪器变更", "观测人员变更", "观测时段调整", ""], "r": "ABC", "e": "暴雨资料一致性受气候、下垫面、观测仪器等影响，气候变迁会改变降水特征，下垫面变化影响产汇流，观测仪器变更会影响数据准确性。而观测人员变更通常对资料一致性影响不大，观测时段调整主要涉及资料的时间选取，并非一致性关键因素。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478528", "t": 3, "q": "水文循环中，陆地内循环的水量占全球水文循环总水量的比例远大于海陆间循环。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "海陆间循环是指海洋水与陆地水之间通过一系列过程所进行的相互转换运动，是最重要的水循环类型，其水量占全球水文循环总水量的比例远大于陆地内循环。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478529", "t": 3, "q": "流域的径流系数越大，说明该流域的下渗量和蒸发量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "径流系数是指一定汇水面积内径流量与降水量的比值。径流系数大意味着径流量占降水量的比例大，而降水量一部分转化为径流，一部分下渗和蒸发，所以径流比例大时，下渗量和蒸发量就小。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478530", "t": 3, "q": "在蓄满产流模式下，流域内只要有部分区域蓄满，整个流域就会产生径流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蓄满产流模式中，只有当包气带达到田间持水量（蓄满）才产流，并非部分区域蓄满整个流域就产流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478531", "t": 3, "q": "水文频率分析中，经验频率曲线的点据越密集，说明理论频率曲线的拟合精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "经验频率曲线点据密集只能体现样本数据分布情况，理论频率曲线拟合精度取决于理论与经验频率曲线的匹配程度，而非经验点据密集度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478532", "t": 3, "q": "设计洪水的重现期越大，对应的设计洪水量级越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设计洪水重现期越大，意味着该量级洪水出现的概率越小，通常对应的设计洪水量级越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478533", "t": 3, "q": "单位线的历时越长，其对应的地表径流过程线越平缓。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "单位线历时越长，意味着净雨在更长时间内分布，使得地表径流过程线的洪峰相对降低，过程更平缓。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478534", "t": 3, "q": "河道的糙率值越大，在相同水位条件下，河道的过流能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "糙率反映的是河槽边界对水流的阻力，糙率值越大，水流受到的阻力越大，在相同水位条件下，河道过流能力越弱。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478535", "t": 3, "q": "年径流变差系数Cv值为0时，说明该流域各年的径流量完全相同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "年径流变差系数Cv反映年径流量的相对变化程度，Cv为0意味着年径流量无变化，即各年径流量完全相同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478536", "t": 3, "q": "采用泰森多边形法计算流域平均降雨量时，每个雨量站的权重与其控制的多边形面积成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "泰森多边形法中，雨量站控制的多边形面积越大，其对流域平均降雨量的影响越大，权重就越大，即每个雨量站的权重与其控制的多边形面积成正比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478537", "t": 3, "q": "分布式水文模型不需要进行参数率定，可直接使用物理参数计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分布式水文模型虽基于物理机制，但模型中一些参数难以直接准确获取，仍需进行参数率定来使模型模拟结果更符合实际情况，并非可直接用物理参数计算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478538", "t": 3, "q": "超渗产流主要发生在湿润地区，蓄满产流主要发生在干旱地区。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。超渗产流主要发生在干旱、半干旱地区，该地区降雨强度常超过土壤下渗能力；蓄满产流主要发生在湿润地区，因土壤湿润，包气带易蓄满水而产流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478539", "t": 3, "q": "水位流量关系曲线为单值曲线的前提是河道断面稳定、水流均匀且无洪水涨落影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "河道断面稳定、水流均匀且无洪水涨落影响时，同一水位对应唯一流量，水位流量关系曲线会呈现单值曲线。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478540", "t": 3, "q": "历史洪水调查得到的洪水数据，因其发生时间久远，不能用于水文频率分析。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。历史洪水调查得到的数据虽发生时间久远，但能提供更多洪水信息，可延长洪水系列，对提高水文频率分析精度很有帮助，所以可用于水文频率分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478541", "t": 3, "q": "暴雨强度公式中的指数n值越小，说明暴雨强度随历时的衰减速度越慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478542", "t": 3, "q": "流域的下渗能力随土壤含水量的增加而增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "下渗能力一般随土壤含水量增加而减小，因为土壤含水量高时孔隙被水填充，下渗空间变小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478543", "t": 3, "q": "水文预报的预见期越长，预报精度通常越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般来说，水文情况受众多因素影响且不断变化，预见期越长，不确定因素越多，越难准确预报，所以预报精度通常越低。", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478544", "t": 3, "q": "皮尔逊III型分布的形状参数Cs越大，其概率密度曲线的右偏程度越明显。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在皮尔逊III型分布中，形状参数Cs反映曲线的偏态程度，Cs越大右偏越明显。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478545", "t": 3, "q": "设计枯水流量的历时越短，对应的设计值越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设计枯水流量历时越短，出现更小流量的可能性越低，对应设计值越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478546", "t": 3, "q": "水文循环的永恒性是由太阳辐射和地球引力共同维持的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "太阳辐射提供热量使水蒸发，地球引力促使水汽凝结形成降水并使水回归地表，二者共同维持了水文循环的永恒性。", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478547", "t": 3, "q": "壤中流是在土壤饱和层中形成的侧向水流，属于地下径流的一部分。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478548", "t": 3, "q": "采用同倍比放大法推求设计洪水过程线时，放大倍比是根据设计洪水总量与典型洪水总量的比值确定的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478549", "t": 3, "q": "流域面积越大，其年径流的年内分配越均匀。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大流域有更多支流和调节作用，能缓冲径流在年内的变化，使年径流的年内分配更均匀。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478550", "t": 3, "q": "水位是指水体表面相对于某一基面的高程，其单位通常为米。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水位定义就是水体表面相对于某一基面的高程，常用单位是米，该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478551", "t": 3, "q": "水文频率分析中，若样本系列存在特大值，无需进行特大值处理，可直接参与频率计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "样本系列存在特大值时，其统计特征会与一般值有较大差异，若不处理直接参与频率计算，会使计算结果偏差较大，所以需要进行特大值处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478552", "t": 3, "q": "蒸发量的观测通常采用蒸发器，蒸发器观测的蒸发量可直接作为流域的实际蒸发量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蒸发器观测的蒸发量受蒸发器自身条件限制，与流域实际蒸发情况有差异，不能直接作为流域实际蒸发量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478553", "t": 3, "q": "在河道洪水演进中，洪水波的传播速度等于水流的平均流速。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "河道洪水演进时，洪水波传播速度和水流平均流速是不同概念，洪水波传播速度受多种因素影响且通常大于水流平均流速。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478554", "t": 3, "q": "年径流总量是指一个流域在一年内通过出口断面的总水量，其单位通常为立方米。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "年径流总量定义为一个流域在一年内通过出口断面的总水量，常用单位是立方米，该描述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478555", "t": 3, "q": "概念性水文模型的参数具有明确的物理意义，可通过物理实验直接测定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "概念性水文模型虽部分参数有物理意义，但很多不能仅通过物理实验直接测定，还需借助实测资料率定等方法。", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478556", "t": 3, "q": "暴雨的重现期是指在长期观测中，等于或大于该暴雨的事件平均每多少年发生一次。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "暴雨重现期的定义就是在长期观测中，等于或大于该暴雨的事件平均出现的间隔年数，也就是平均每多少年发生一次。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478557", "t": 3, "q": "流域的下垫面条件（如植被、土壤）仅影响产流过程，不影响汇流过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流域下垫面条件如植被、土壤等，既会影响产流，也会影响汇流。植被能截留雨水、增加下渗，土壤的透水性等会改变水流运动速度和路径等，对汇流过程有显著影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478558", "t": 3, "q": "水位流量关系曲线的高水段延长，通常采用曼宁公式，不需要考虑河道的冲淤变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水位流量关系曲线高水段延长用曼宁公式时，河道冲淤变化会影响过水断面、糙率等参数，从而影响流量计算，所以必须考虑河道冲淤变化。", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478559", "t": 3, "q": "水文循环中，水汽输送的主要方向是从海洋指向陆地。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "海洋是水汽的主要源地，在水文循环里，海洋蒸发的水汽会通过大气环流等被输送到陆地上空，所以水汽输送主要方向是从海洋指向陆地。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478560", "t": 3, "q": "年径流的多年平均值是一个稳定的数值，不随观测年限的增加而变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "年径流的多年平均值是随着观测年限的增加而逐渐趋于稳定的，在观测年限较少时其值可能不稳定，并非一开始就是稳定数值，不会随观测年限变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478561", "t": 3, "q": "在设计暴雨计算中，若暴雨资料不足，可采用暴雨等值线图法推求设计暴雨。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当暴雨资料不足时，暴雨等值线图法是常用的推求设计暴雨的方法之一。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478562", "t": 3, "q": "土壤的田间持水量是指土壤所能保持的最大毛管水量，此时土壤含水量达到饱和。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "田间持水量是土壤所能保持的最大毛管悬着水量，此时土壤并非达到饱和，饱和时是所有孔隙都充满水，而田间持水量时大孔隙中是有空气的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478563", "t": 3, "q": "水文站观测的流量数据，均为瞬时流量，不能直接用于计算日平均流量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水文站观测的流量数据有瞬时流量，但可通过一定方法利用这些瞬时流量来计算日平均流量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478564", "t": 3, "q": "分布式水文模型相比概念性模型，更适用于下垫面条件复杂、空间异质性强的流域。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分布式水文模型考虑了流域下垫面的空间异质性，能更精细地模拟复杂条件下的水文过程，而概念性模型对下垫面异质性考虑不足。所以分布式水文模型更适合下垫面条件复杂、空间异质性强的流域。", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478565", "t": 3, "q": "设计洪水过程线的形状仅与典型洪水过程线的形状有关，与放大方法无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。设计洪水过程线是通过典型洪水过程线按一定放大方法得到的，其形状不仅取决于典型洪水过程线形状，还与放大方法有关，不同放大方法会使设计洪水过程线形状有差异。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478566", "t": 3, "q": "下渗量是指降雨过程中渗入土壤的总水量，等于降雨量减去地表径流量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478567", "t": 3, "q": "水文预报中的短期预报，其预见期通常在10天以上。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "短期水文预报预见期通常在数小时至数天，一般不超过10天，所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第2章 水利与水电||第7节 水轮机与水泵的结构特性", "n": "第2章 水利与水电 / 第7节 水轮机与水泵的结构特性", "qs": [{"id": "2035637127550734336", "t": 1, "q": "下列关于水泵扬程的说法，正确的是？", "a": ["水泵的扬程是指水泵能将水提升的最大高度（垂直距离）", "扬程等于水泵出口总水头与进口总水头之差", "扬程与水泵的转速无关", "扬程的单位\"米水柱\"是指重力势能的单位，与压力无关", "", ""], "r": "B", "e": "水泵扬程是指水泵出口总水头与进口总水头之差；A选项，扬程不只是垂直距离；C选项，扬程与水泵转速有关；D选项，“米水柱”与压力有关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734337", "t": 1, "q": "反击式水轮机尾水管的主要作用不包括？", "a": ["回收转轮出口水流的动能", "提高水轮机的安装高程", "减少转轮出口的水力损失", "将水流平顺地排入下游河道", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734338", "t": 1, "q": "离心式水泵的叶轮叶片采用后弯式的主要原因是？", "a": ["可获得更大的流量", "可减小水泵的轴向推力", "可降低水泵的汽蚀余量", "可提高水泵的效率，降低能耗", "", ""], "r": "D", "e": "后弯式叶片使液体获得的动能较小，转化为压能的损失小，能提高水泵效率、降低能耗。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734339", "t": 1, "q": "下列关于水轮机转轮叶片材质选择的说法，错误的是？", "a": ["冲击式水轮机转轮叶片需具备较高的耐磨性", "高水头水轮机转轮叶片需具备较高的强度和硬度", "低水头大流量水轮机转轮叶片可采用普通碳素钢", "含沙量高的水电站水轮机转轮叶片需具备较高的耐腐蚀性", "", ""], "r": "D", "e": "含沙量高的水电站水轮机转轮叶片主要需具备较高的耐磨性，而非耐腐蚀性，所以D说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734340", "t": 1, "q": "混流式水轮机转轮的叶片数目选择主要考虑的因素不包括以下哪项？", "a": ["水轮机的比转速", "转轮的强度要求", "水流在转轮内的水力损失", "机组的安装高程", "", ""], "r": "D", "e": "水轮机转轮叶片数目选择与比转速、转轮强度、水流在转轮内水力损失相关，而机组安装高程是根据其他因素确定，和叶片数目选择无关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734341", "t": 1, "q": "下列关于轴流式水轮机导水机构的说法，错误的是？", "a": ["导水机构的主要作用是调节进入转轮的流量", "导水机构由导叶、导叶臂、控制环等部件组成", "导叶的开启角度越大，通过导水机构的水流速度越大（流量一定时）", "导水机构关闭时可防止水轮机倒转", "", ""], "r": "C", "e": "流量一定时，导叶开启角度越大，过流面积越大，水流速度越小，C说法错误。A选项调节流量是导水机构主要作用；B选项其组成部件描述正确；D选项导水机构关闭能防止水轮机倒转。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734342", "t": 1, "q": "水泵发生气蚀现象的根本原因是泵内局部区域的压力达到了当时水温下的什么值？", "a": ["饱和蒸汽压", "大气压", "绝对压力", "相对压力", "", ""], "r": "A", "e": "当泵内局部区域压力降低到当时水温下的饱和蒸汽压时，水会汽化形成气泡，气泡破裂产生气蚀现象。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734343", "t": 1, "q": "下列属于冲击式水轮机特有的部件是？", "a": ["转轮", "喷嘴", "导水机构", "尾水管", "", ""], "r": "B", "e": "冲击式水轮机靠高速水流冲击转轮做功，需用喷嘴把水流能量转换为高速射流。转轮是各类水轮机都有；导水机构常见于反击式水轮机；尾水管也是反击式水轮机部件。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734344", "t": 1, "q": "对于单级单吸离心式水泵，其叶轮的结构特点不包括以下哪项？", "a": ["叶轮上通常设有平衡孔或平衡叶片", "叶轮一般采用后弯式叶片", "叶轮的进口直径小于出口直径", "叶轮的轮毂直径与叶轮直径之比通常大于0.5", "", ""], "r": "D", "e": "单级单吸离心式水泵叶轮轮毂直径与叶轮直径之比通常小于0.5 ，D选项说法错误。A项平衡孔或平衡叶片可平衡轴向力；B项后弯式叶片利于提高效率；C项进口直径小出口直径大符合其结构特点。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734345", "t": 1, "q": "水轮机的比转速ns与转轮结构尺寸的关系，下列说法正确的是？", "a": ["比转速越大，转轮的进口直径与出口直径之比越大", "比转速越大，转轮的高度与直径之比越小", "比转速越小，转轮的叶片数目越少", "比转速越小，转轮的流道越宽敞", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734346", "t": 1, "q": "水泵的流量与转速的关系符合以下哪项规律（其他条件不变时）？", "a": ["流量与转速成正比", "流量与转速的平方成正比", "流量与转速的立方成正比", "流量与转速无关", "", ""], "r": "A", "e": "根据水泵的相似定律，在其他条件不变时，水泵流量与转速成正比。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734347", "t": 1, "q": "轴流转桨式水轮机与轴流定桨式水轮机的主要区别在于？", "a": ["转轮的叶片数目不同", "转轮叶片是否可调节", "导水机构的结构形式不同", "尾水管的形状不同", "", ""], "r": "B", "e": "轴流转桨式水轮机转轮叶片可调节，轴流定桨式水轮机转轮叶片不可调节，这是二者主要区别。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734348", "t": 1, "q": "下列关于水轮机调节系统中调速器与导水机构联动关系的说法，正确的是？", "a": ["机组负荷增加时，调速器控制导水机构关小导叶", "机组转速升高时，调速器控制导水机构关小导叶", "电网频率降低时，调速器控制导水机构关小导叶", "水轮机进口水头升高时，调速器控制导水机构开大导叶", "", ""], "r": "B", "e": "调速器的作用是根据机组转速变化调节导水机构导叶开度。当机组转速升高，意味着能量过剩，需减少进水量，所以调速器控制导水机构关小导叶。A选项负荷增加应开大导叶；C选项电网频率降低意味着机组转速降低，应开大导叶；D选项水头升高，若开度不变功率会增大，一般应关小导叶。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734349", "t": 1, "q": "离心式水泵的气蚀余量（NPSH）与水泵安装高度的关系，下列说法正确的是？", "a": ["必需气蚀余量（NPSHr）越大，水泵允许的安装高度越高", "有效气蚀余量（NPSHa）越大，水泵允许的安装高度越高", "气蚀余量与水泵安装高度无关", "必需气蚀余量等于有效气蚀余量时，安装高度达到最大值", "", ""], "r": "B", "e": "有效气蚀余量反映泵进口处的实际气蚀性能，其越大，说明泵进口不易发生气蚀，允许的安装高度就越高。而必需气蚀余量越大越易气蚀，安装高度应越低；气蚀余量与安装高度有关；必需气蚀余量等于有效气蚀余量时是临界状态，不是安装高度最大值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734350", "t": 1, "q": "下列部件中，不属于水轮机主轴密封系统组成部分的是？", "a": ["密封环", "止水盘根", "导叶臂", "冷却水管", "", ""], "r": "C", "e": "水轮机主轴密封系统主要是防止水从主轴与顶盖之间间隙漏出，密封环、止水盘根用于密封，冷却水管为密封部件降温，都是主轴密封系统组成部分。导叶臂是水轮机导水机构的部件，与主轴密封系统无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645184", "t": 2, "q": "（　）下列属于反击式水轮机的类型有？", "a": ["混流式水轮机", "轴流式水轮机", "斜击式水轮机", "双击式水轮机", "贯流式水轮机", ""], "r": "ABE", "e": "反击式水轮机主要包括混流式、轴流式、贯流式等。斜击式和双击式属于冲击式水轮机。所以答案选ABE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645185", "t": 2, "q": "（　）影响离心式水泵效率的主要因素有？", "a": ["叶轮的水力损失", "水泵的容积损失", "水泵的机械损失", "水泵的安装高度", "水泵的转速", ""], "r": "ABC", "e": "离心式水泵效率受水力、容积、机械三方面损失影响。安装高度主要影响水泵吸水性能，转速虽与水泵性能有关但不是影响效率主要因素。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645186", "t": 2, "q": "（　）水轮机转轮的水力性能主要取决于哪些结构参数？", "a": ["转轮叶片的形状", "转轮的进口角和出口角", "转轮的直径和高度", "转轮的材质", "转轮的叶片数目", ""], "r": "ABCE", "e": "水轮机转轮水力性能与水流在转轮内的流动特性相关。转轮叶片形状、进出口角、叶片数目会直接影响水流流动，从而影响水力性能；转轮直径和高度与过流能力等水力性能有关。而转轮材质主要影响其强度、耐用性等，不直接决定水力性能。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645187", "t": 2, "q": "（　）下列关于水泵并联运行的特点，说法正确的有？", "a": ["并联运行的水泵扬程基本相等", "总流量等于各水泵流量之和", "并联运行可提高供水的可靠性", "并联运行时各水泵的转速必须相同", "并联运行适用于需大幅增加流量的工况", ""], "r": "ABCE", "e": "并联水泵扬程基本相等，总流量是各泵流量之和，能提高供水可靠性，适用于大幅增流工况，而转速不一定要相同。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645188", "t": 2, "q": "（　）水轮机导水机构中，导叶的关闭规律对机组运行的影响有？", "a": ["影响机组的甩负荷过渡过程", "影响导水机构的关闭时间", "影响水轮机的最大转速升高值", "影响尾水管内的真空度", "影响机组的出力调节精度", ""], "r": "ABCD", "e": "导叶关闭规律会改变水流特性和机组工况，对甩负荷过渡过程、最大转速升高值、尾水管真空度都有影响。关闭时间由关闭规律决定，也会受其影响；但出力调节精度主要与调速系统等有关，并非导叶关闭规律直接影响。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645189", "t": 2, "q": "（　）下列属于水泵轴封装置作用的有？", "a": ["防止泵内高压水向外泄漏", "防止空气进入泵的吸水室", "减少水泵的轴向推力", "冷却和润滑轴封部件", "保护水泵主轴不受磨损", ""], "r": "ABDE", "e": "轴封装置是为防止泵内液体外流和空气进入泵内，同时有冷却和润滑轴封部件、保护主轴作用。C选项减少水泵轴向推力不是轴封装置作用。答案选ABDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645190", "t": 2, "q": "（　）冲击式水轮机的工作水头较高，其结构设计上需考虑的问题有？", "a": ["转轮叶片的抗冲击强度", "喷嘴的流量调节精度", "转轮的散热问题", "主轴的密封可靠性", "射流与转轮的对中性", ""], "r": "ABE", "e": "冲击式水轮机工作水头高，水流冲击转轮，要保证转轮叶片能承受冲击，A正确；需通过喷嘴调节流量适应工况，要保证调节精度，B正确；射流准确冲击转轮才能有效做功，要保证射流与转轮对中性，E正确。冲击式水轮机转轮散热问题不突出，C错误；主轴密封可靠性不是冲击式水轮机因高水头在结构设计上需重点考虑的，D错误。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645191", "t": 2, "q": "（　）下列因素中，会导致水轮机效率降低的有？", "a": ["转轮内水流的脱流现象", "导叶与转轮之间的间隙漏水", "尾水管内的涡流", "水轮机转速高于额定转速", "转轮叶片表面的磨损", ""], "r": "ABCE", "e": "A选项转轮内水流脱流影响水流顺畅，降低效率；B选项间隙漏水造成能量损失；C选项尾水管涡流浪费能量；E选项转轮叶片磨损改变水流状态和效率。而水轮机转速高于额定转速不一定就降低效率。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645192", "t": 2, "q": "（　）离心式水泵叶轮的进口直径设计过大，可能会导致的问题有？", "a": ["水泵的气蚀余量增大", "水泵的流量降低", "叶轮的强度降低", "水泵的扬程升高", "吸水管内的水流速度减小", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645193", "t": 2, "q": "（　）水轮机的主轴系统包括的主要部件有？", "a": ["主轴", "推力轴承", "导轴承", "控制环", "转轮", ""], "r": "ABC", "e": "水轮机主轴系统主要是传递能量和承受载荷，主轴是核心部件，推力轴承承受轴向力，导轴承保证主轴稳定运转。而控制环用于控制导叶开度，转轮是能量转换部件，不属于主轴系统。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645194", "t": 2, "q": "（　）下列关于轴流式水泵的说法，正确的有？", "a": ["轴流式水泵的比转速通常比离心式水泵大"
