, "r": "A", "e": "在智慧水利“四预”体系里，预报能提供基础数据和信息，只有准确预报，才能依据预报成果进行后续的预警、预演和预案部署。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092292", "t": 3, "q": "水利系统模拟中，水库防洪调度模拟的核心目标是最大限度提升水库的蓄水量，以保障后续兴利用水。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水库防洪调度模拟核心目标是保障防洪安全，减轻洪水灾害，而非最大限度提升蓄水量保障后续兴利用水。", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092293", "t": 3, "q": "数字孪生水利工程中，物理工程与数字模型的\"双向映射\"仅需实现物理工程状态向数字模型的单向数据传输即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生水利工程的“双向映射”要求物理工程与数字模型之间实现双向数据传输，不只是物理工程状态向数字模型的单向传输。", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092294", "t": 3, "q": "数字水利建设中，水利数据中台的主要作用是存储水利数据，无需对数据进行标准化处理与共享服务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。水利数据中台不仅要存储水利数据，更重要的是对数据进行标准化处理、整合和治理，以实现数据的共享服务，让不同部门和系统能有效利用数据。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092295", "t": 3, "q": "水利系统模拟中，采用分布式水文模型模拟流域产流时，流域划分的子流域单元越小，模拟结果精度一定越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然一般情况下子流域单元小能更精细反映流域特征，但模拟精度还受数据质量、模型结构等多因素影响，并非单元越小精度就一定越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092296", "t": 3, "q": "智慧水利中，物联网传感器采集的水利监测数据（如水位、流量）无需预处理即可直接用于水利系统模拟。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网传感器采集的水利监测数据可能存在噪声、缺失值等问题，不经过预处理直接用于水利系统模拟会影响模拟结果的准确性和可靠性，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092297", "t": 3, "q": "数字水利技术中，5G技术因具有低时延、高带宽的特点，可支撑水利应急监测中高清视频数据（如无人机巡检）的实时传输。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "5G技术具备低时延、高带宽特性，这能满足水利应急监测里高清视频数据实时传输需求，像无人机巡检的高清视频数据就可借助5G实现实时传输。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092298", "t": 3, "q": "水利系统模拟中，洪水风险评估模型输出的淹没范围仅与洪水量级有关，与流域地形数据（如DEM）无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "洪水风险评估模型输出的淹没范围不仅与洪水量级有关，还和流域地形数据密切相关。不同的地形（如高低起伏、坡度等）会影响洪水的流动和淹没情况，DEM能反映地形信息。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092299", "t": 3, "q": "智慧水利中的人工智能技术，可通过机器学习算法自动率定水利系统模拟模型的参数，无需人工干预。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然人工智能技术可借助机器学习算法率定水利系统模拟模型参数，但实际中完全无需人工干预较难做到，很多情况仍需人工辅助与参与。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092300", "t": 3, "q": "数字孪生流域建设中，高分辨率数字高程模型（DEM）数据是构建数字流域地形特征的核心数据源。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "高分辨率数字高程模型（DEM）能精准呈现地形起伏等特征，是构建数字流域地形特征的关键核心数据源。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092301", "t": 3, "q": "水利系统模拟中，水资源优化配置模拟仅需考虑社会经济用水需求（如农业、工业、生活用水），无需考虑生态用水需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水资源优化配置模拟要综合考虑社会经济用水需求和生态用水需求，生态用水对维持生态平衡至关重要，不可忽视。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092302", "t": 3, "q": "数字水利技术中，大数据技术可通过分析历史水文数据，识别流域洪水的发生规律，为水利系统模拟的情景设置提供依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数据技术能对大量历史水文数据进行分析挖掘，从中识别出流域洪水发生规律等信息，这些信息可为水利系统模拟设置不同情景提供依据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092303", "t": 3, "q": "智慧水利的数字孪生系统中，数字模型的模拟结果精度越高，其对水利业务决策的支撑作用一定越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "模拟结果精度高只是一方面，还需考虑模型与实际场景匹配度、数据实时性等因素，精度高不必然意味着对决策支撑作用就强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092304", "t": 3, "q": "水利系统模拟中，一维水文模型与二维水动力模型耦合时，水文模型输出的河道流量需作为水动力模型的上游边界条件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利系统模拟里，一维水文模型算出的河道流量常作为二维水动力模型的上游边界条件，为水动力模型模拟提供必要输入。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092305", "t": 3, "q": "数字水利建设中，水利物联网平台的核心功能是实现水利数据的可视化展示，而非数据采集与传输。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利物联网平台核心功能包括数据采集与传输，再基于采集的数据进行处理分析等，可视化展示只是其中一部分应用，并非核心功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092306", "t": 3, "q": "水利系统模拟中，模型参数的敏感性分析可识别对模拟结果影响最大的参数，为参数率定提供优先级依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "敏感性分析就是分析各参数对模拟结果的影响程度，能找出影响最大的参数，这样在参数率定时就可按影响大小安排优先级。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092307", "t": 3, "q": "智慧水利中，BIM技术仅用于水利工程的设计阶段，无法应用于建设与运维阶段。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BIM技术在智慧水利中不仅可用于设计阶段，在建设和运维阶段也有广泛应用，能辅助施工管理、设施维护等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092308", "t": 3, "q": "数字水利技术中，数据加密技术可保障水利监测数据在传输过程中不被非法窃取，是数据安全的重要措施。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据加密技术能对数据进行编码转换，使非法窃取者难以获取有意义信息，可保障水利监测数据传输安全，是数据安全重要措施。", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092309", "t": 3, "q": "水利系统模拟中，洪水预报模型的预报时效越长，其预报精度一定越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般来说，洪水预报时效越长，不确定因素越多，预报精度往往越低，而不是越高。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092310", "t": 3, "q": "数字孪生流域中，孪生数据仅包括实时监测数据，不包括历史数据与静态数据（如地形数据）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生流域的孪生数据包含实时监测数据、历史数据以及静态数据（像地形数据）等。所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092311", "t": 3, "q": "水利系统模拟中，采用系统动力学模型分析水资源系统时，模型的结构（如反馈回路）比参数精度对模拟结果的影响更大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "系统动力学着重研究系统结构与动态行为关系，反馈回路体现系统结构和因果关系，决定系统基本动态特征，参数精度虽重要但结构影响更关键。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092312", "t": 3, "q": "智慧水利建设中，云计算技术可提供大规模计算资源，支撑水利系统模拟的复杂计算（如多情景并行模拟）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "云计算具备强大的计算能力，能提供大规模计算资源，可满足水利系统模拟复杂计算需求，像多情景并行模拟等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092313", "t": 3, "q": "数字水利技术中，水利数据的时间分辨率（如小时、日）越高，越适合用于长期水资源规划模拟。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "长期水资源规划模拟更关注宏观、长期的趋势，需要的是时间跨度大的数据，而非高时间分辨率数据。高时间分辨率数据适用于短期、实时的监测和分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092314", "t": 3, "q": "水利系统模拟中，水质模拟模型仅需考虑污染物的迁移与扩散过程，无需考虑污染物的降解过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水质模拟模型不仅要考虑污染物的迁移与扩散过程，也需考虑污染物的降解过程，因为降解会影响水质。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092315", "t": 3, "q": "智慧水利的\"预演\"环节通过水利系统模拟，可模拟不同水利工程调度方案的效果，为方案优化提供依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "智慧水利的“预演”就是借助水利系统模拟，对不同水利工程调度方案效果进行模拟，从而为方案优化提供依据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092316", "t": 3, "q": "数字孪生水利工程中，三维激光扫描技术采集的物理工程数据，可直接用于构建数字模型，无需后续处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "三维激光扫描采集的物理工程数据存在噪声、数据不完整等问题，不能直接用于构建数字模型，需要进行滤波、配准等后续处理。", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092317", "t": 3, "q": "水利系统模拟中，水库兴利调度模拟需在满足防洪约束（如不超过防洪限制水位）的前提下，优化发电与供水效益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水库兴利调度模拟要在防洪安全基础上，协调多方面效益，发电和供水是重要效益目标，需在满足防洪约束下进行优化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092318", "t": 3, "q": "数字水利建设中，水利数据的共享会导致数据安全风险，因此无需建立数据共享机制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然水利数据共享会带来一定安全风险，但不能因噎废食不建立数据共享机制。数据共享能促进水利资源的高效利用、提升决策科学性和协同治理能力等。可通过加强安全防护措施来降低风险，而不是放弃数据共享。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092319", "t": 3, "q": "水利系统模拟中，分布式水文模型的模拟结果精度一定高于集总式水文模型。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "模型模拟结果精度受多种因素影响，分布式和集总式水文模型各有适用场景，不能简单判定分布式水文模型精度一定高于集总式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092320", "t": 3, "q": "智慧水利中，计算机视觉技术可通过分析卫星遥感图像，识别流域内的水体面积变化，为水利系统模拟提供输入数据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "计算机视觉技术具备处理和分析图像的能力，卫星遥感图像包含流域信息，利用该技术能识别水体面积变化，这些数据可作为水利系统模拟的输入。", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092321", "t": 3, "q": "数字水利技术中，边缘计算技术将数据处理任务部署在监测设备附近，可减少数据传输量，降低云计算平台的压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边缘计算是把数据处理放在数据源附近，在源头处理后只传必要数据，能减少传输量、降低云平台压力。所以题干表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092322", "t": 3, "q": "水利系统模拟中，洪水演进模拟的计算网格尺寸越小，模拟结果的空间分辨率越高，计算效率也越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "计算网格尺寸越小，模拟结果空间分辨率确实越高，但网格小意味着计算量增大，计算效率会降低而非提高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092323", "t": 3, "q": "智慧水利的\"预案\"环节是基于\"预演\"结果制定的标准化处置流程，无需根据实际情况调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "预案虽基于预演结果制定，但实际情况复杂多变，必然要根据实际情况调整，不能一成不变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092324", "t": 3, "q": "数字孪生流域中，数字模型的更新频率需与物理流域的变化频率一致（如流域下垫面每年更新，模型也每年更新）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数字孪生流域要精准反映物理流域状态，数字模型更新频率应和物理流域变化频率适配，物理流域下垫面等变化，数字模型需对应更新以保证准确性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092325", "t": 3, "q": "水利系统模拟中，水文模型的产流计算仅需考虑降水量，无需考虑蒸发量与下渗量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "产流计算需要综合考虑降水量、蒸发量、下渗量等多因素，不能仅考虑降水量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092326", "t": 3, "q": "数字水利建设中，水利可视化平台的主要作用是将水利系统模拟结果以图形、地图等形式展示，辅助用户理解。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水利可视化平台就是把水利系统模拟结果通过图形、地图等直观形式呈现，方便用户理解，该描述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637252910092327", "t": 3, "q": "水利系统模拟中，模型验证的主要目的是检验模型参数的敏感性，而非模型结果的准确性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "模型验证主要目的是检验模型结果的准确性，而非检验模型参数的敏感性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第3章 智慧水利和数字水利技术||第4节 传感器技术与数据采集（1）", "n": "第3章 智慧水利和数字水利技术 / 第4节 传感器技术与数据采集（1）", "qs": [{"id": "2035637259876831232", "t": 1, "q": "在水利水电工程数字孪生系统构建中，用于实现物理实体与虚拟模型实时数据交互、动态修正模型误差的关键技术是", "a": ["三维建模技术", "数据同化技术", "仿真计算技术", "数据存储技术", "", ""], "r": "B", "e": "数据同化技术可融合多源数据，实现物理实体与虚拟模型实时数据交互，还能动态修正模型误差；三维建模技术主要用于构建虚拟模型；仿真计算技术侧重于模拟系统运行；数据存储技术是存储数据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831233", "t": 1, "q": "某水利水电工程需监测大坝坝体内部的微小应变，要求传感器在潮湿、振动环境下长期稳定工作，以下最适用的传感器类型是", "a": ["电阻应变式传感器", "压电式传感器", "电容式传感器", "电感式传感器", "", ""], "r": "A", "e": "电阻应变式传感器精度高、线性好，能适应潮湿、振动环境长期稳定工作，适合监测微小应变。压电式不适合静态测量；电容式易受湿度等影响；电感式对环境要求高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831234", "t": 1, "q": "在智慧水利系统中，用于实时监测水库水温分层现象并能长期稳定工作在水下20米深度的传感器，最适合的类型是以下哪一种？", "a": ["普通热电偶传感器", "投入式光纤光栅温度传感器", "接触式铂电阻传感器", "红外非接触式温度传感器", "", ""], "r": "B", "e": "水下20米需传感器能长期稳定在水下工作，投入式光纤光栅温度传感器抗干扰能力强、可适应水下环境且能实现长期监测。普通热电偶传感器精度和稳定性在水下欠佳；接触式铂电阻传感器易受水下复杂环境影响；红外非接触式温度传感器在水下无法正常使用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831235", "t": 1, "q": "数字水利平台中，对流域内水文、水质、气象等多源异构数据进行融合处理时，主要采用的技术架构是以下哪一种？", "a": ["客户端/服务器（C/S）架构", "浏览器/服务器（B/S）架构", "面向服务的架构（SOA）", "分布式数据网格（DDG）架构", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831236", "t": 1, "q": "某水利水电工程的智能监控系统在监测大坝渗压时，发现数据出现周期性波动且波动幅度与水库水位变化不同步，最可能的原因是？", "a": ["渗压传感器量程选择过大", "数据采集模块的采样频率过低", "传感器与数据采集器之间的传输线缆存在电容干扰", "传感器安装位置处于坝体应力集中区域", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831237", "t": 1, "q": "在水利工程数字孪生建模过程中，为实现\"物理实体-虚拟模型-数据交互\"的闭环控制，关键需要解决的技术问题是？", "a": ["模型的几何形状精确匹配", "物理参数与虚拟模型的动态映射", "模型的可视化渲染效果", "模型的存储容量优化", "", ""], "r": "B", "e": "要实现“物理实体 - 虚拟模型 - 数据交互”闭环控制，核心是让物理参数能与虚拟模型动态关联，这样才能根据物理实体的变化实时调整虚拟模型，实现闭环。A选项几何形状匹配不是闭环控制关键；C选项可视化渲染效果主要用于展示；D选项存储容量优化和闭环控制关系不大。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831238", "t": 1, "q": "用于水利水电工程溢洪道流量实时监测的传感器，在面对高流速、含沙量大于50kg/m³的水流时，以下哪种传感器的测量精度受影响最小？", "a": ["超声波多普勒流速仪", "电磁流量计", "压差式流量计", "转子式流速仪", "", ""], "r": "A", "e": "在水利水电工程溢洪道流量实时监测中，面对高流速和含沙量较大的水流，不同类型的传感器受影响的程度不同。超声波多普勒流速仪通过测量超声波在水流中的多普勒频移来确定流速，这种方式不直接接触水流，因此受含沙量影响较小，且能够适应高流速环境。电磁流量计适用于导电流体，但在高含沙量情况下，沙粒可能导致电极磨损或沉积，影响测量精度。压差式流量计依赖于流体通过节流装置产生的压差来测量流量，在高流速和含沙量大的情况下，压差信号可能受到干扰，影响精度。转子式流速仪通过测量转子的旋转速度来确定流速，但在高流速和含沙量大的环境中，转子可能受到沙粒的冲击和磨损，影响测量精度。综合以上分析，超声波多普勒流速仪在面对高流速、含沙量大于50kg/m³的水流时，测量精度受影响最小。所以，正确答案是A.超声波多普勒流速仪。", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831239", "t": 1, "q": "智慧水利中的\"四预\"（预报、预警、预演、预案）功能实现时，其核心驱动技术是以下哪一项？", "a": ["大数据统计分析技术", "数值模拟与人工智能耦合技术", "遥感影像处理技术", "地理信息系统（GIS）空间分析技术", "", ""], "r": "B", "e": "“四预”功能需对水利系统进行精准模拟和智能决策，数值模拟与人工智能耦合技术能结合二者优势，为“四预”提供核心驱动。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831240", "t": 1, "q": "某水电站智能监控系统在进行机组振动监测时，采用的振动传感器输出信号为4-20mA电流信号，若要将其转换为数字信号并传输至监控中心，中间必须经过的设备是？", "a": ["信号隔离器", "模数转换器（ADC）", "数据采集终端（RTU）", "网关设备", "", ""], "r": "B", "e": "将4 - 20mA电流模拟信号转换为数字信号，需要模数转换器（ADC）来完成这一转换。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831241", "t": 1, "q": "在数字水利技术中，对水利工程建设与运行过程中的时空数据进行管理，并能实现多维度空间分析的技术工具是？", "a": ["数据库管理系统（DBMS）", "数字高程模型（DEM）", "地理信息系统（GIS）", "建筑信息模型（BIM）", "", ""], "r": "C", "e": "GIS可对时空数据管理，具备多维度空间分析能力，适用于水利工程。DBMS主要是管理数据；DEM侧重于地形建模；BIM主要用于建筑全生命周期管理。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831242", "t": 1, "q": "水利水电工程中，智能监控系统对闸门启闭机的控制采用\"远程控制+本地紧急控制\"双模式，当远程控制失效时，本地紧急控制能立即接管的关键技术是？", "a": ["控制信号的优先级设置", "双电源供电保障", "控制模块的热备份机制", "通信链路的冗余设计", "", ""], "r": "C", "e": "这个问题涉及到水利水电工程中智能监控系统对闸门启闭机的控制模式。关键在于理解“远程控制+本地紧急控制”双模式的工作原理，以及哪种技术能确保在远程控制失效时，本地紧急控制能立即接管。A. 控制信号的优先级设置：虽然优先级设置可以决定哪个控制信号优先被执行，但它本身并不直接确保在远程控制失效时本地控制能立即接管。B. 双电源供电保障：这确保了系统不会因为电源问题而停止工作，但它不直接解决远程控制和本地控制之间的切换问题。C. 控制模块的热备份机制：热备份机制意味着有一个或多个备用控制模块，在主控制模块失效时能立即接管工作。这正好符合题目中“本地紧急控制能立即接管”的要求。D. 通信链路的冗余设计：这确保了通信链路的可靠性，但并不直接解决控制模式的切换问题。综上所述，控制模块的热备份机制是确保在远程控制失效时，本地紧急控制能立即接管的关键技术。所以，正确答案是C.控制模块的热备份机制。", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831243", "t": 1, "q": "用于监测水利渠道渗漏量的传感器，在渠道边坡土壤含水率变化范围为15%-45%的场景下，最适合的测量原理是？", "a": ["时域反射法（TDR）", "频域反射法（FDR）", "中子散射法", "电容法", "", ""], "r": "B", "e": "这道题目考察的是对于不同土壤湿度测量原理的理解和应用场景。在渠道边坡土壤含水率变化范围为15%-45%的场景下，我们需要选择一种既能准确测量又适应这个湿度范围的传感器原理。A. 时域反射法（TDR）：这种方法通过发送电磁波并测量其在土壤中的反射时间来计算土壤湿度。它适用于多种土壤类型，但在极高或极低湿度条件下可能准确性受限。B. 频域反射法（FDR）：与TDR相似，但测量的是电磁波在土壤中的频率变化。FDR通常具有较高的精度，并且在较宽的湿度范围内表现良好，特别适用于15%-45%的含水率范围。C. 中子散射法：这种方法通过测量中子与土壤中的氢原子相互作用来估算湿度。虽然精确，但设备昂贵且操作复杂，不太适合广泛应用。D. 电容法：电容传感器通过测量土壤介电常数的变化来确定湿度。这种方法简单易行，但在某些土壤类型或极端湿度条件下可能不够准确。综合考虑，频域反射法（FDR）在15%-45%的土壤含水率范围内具有较高的精度和稳定性，因此是最适合的选择。所以，正确答案是B.频域反射法（FDR）。", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831244", "t": 1, "q": "数字水利平台在进行洪水预报时，采用分布式水文模型，该模型能准确模拟不同子流域产汇流过程的关键在于？", "a": ["模型参数的区域化率定", "输入数据的时间分辨率", "模型的空间离散化精度", "输出结果的可视化程度", "", ""], "r": "A", "e": "数字水利平台在进行洪水预报时，采用分布式水文模型。分布式水文模型的核心在于其对不同子流域产汇流过程的模拟准确性。这其中，模型参数的区域化率定是关键，因为它决定了模型在不同区域内的适应性和准确性。输入数据的时间分辨率、模型的空间离散化精度以及输出结果的可视化程度虽然都是重要的因素，但它们并不直接决定模型模拟产汇流过程的准确性。因此，正确答案是A选项：模型参数的区域化率定。", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831245", "t": 1, "q": "水利水电工程智能监控系统中，数据采集终端（RTU）在无公网信号的偏远区域，实现数据回传的主要方式是？", "a": ["以太网有线传输", "4G/5G无线传输", "卫星通信传输", "蓝牙短距离传输", "", ""], "r": "C", "e": "偏远无公网信号区域，以太网、4G/5G、蓝牙都受限，卫星通信不受地域和公网信号限制可实现数据回传。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831246", "t": 1, "q": "在智慧水利的智能决策支持系统中，针对水库调度方案的优化选择，主要采用的算法类型是？", "a": ["遗传算法", "决策树算法", "支持向量机算法", "K-均值聚类算法", "", ""], "r": "A", "e": "遗传算法常用于优化问题，可在水库调度方案优化选择中搜索最优解；决策树多用于分类和预测；支持向量机主要用于分类和回归；K - 均值聚类用于数据聚类。所以选遗传算法。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831247", "t": 1, "q": "某水利工程的传感器网络在运行中，部分传感器出现数据\"丢包\"现象，且丢包率随距离监控中心距离增加而升高，最可能的原因是？", "a": ["传感器供电电压不稳定", "无线传输模块的发射功率不足", "数据采集频率过高", "传感器的采样精度不够", "", ""], "r": "B", "e": "丢包率随距监控中心距离增加而升高，说明是传输环节受距离影响，无线传输模块发射功率不足会使信号随距离衰减，导致丢包率上升。A选项供电电压不稳定与距离无关；C选项数据采集频率过高主要影响数据处理，和距离关系不大；D选项采样精度不够影响数据准确性而非丢包。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831248", "t": 1, "q": "数字水利中，对水利工程设施进行全生命周期管理的核心技术支撑是？", "a": ["大数据存储技术", "建筑信息模型（BIM）与地理信息系统（GIS）融合技术", "遥感监测技术", "物联网感知技术", "", ""], "r": "B", "e": "BIM能对水利工程设施进行三维建模、管理信息，GIS可提供地理空间信息，二者融合能贯穿水利工程全生命周期管理。大数据存储技术主要用于数据存储；遥感监测侧重于获取地表信息；物联网感知技术主要是实现信息采集，均非核心支撑技术。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831249", "t": 1, "q": "水利水电工程的智能监控系统在监测机组转速时，采用的转速传感器若出现\"飞车\"误报警，最可能的故障原因是？", "a": ["传感器与被测轴的安装间隙过大", "传感器的信号调理电路出现漂移", "数据采集系统的阈值设置过低", "传感器的测量范围小于机组最大转速", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831250", "t": 1, "q": "智慧水利系统中，用于识别河道非法采砂行为的技术手段，主要依赖的是？", "a": ["河道水位传感器的水位变化监测", "视频监控与图像识别人工智能技术", "河道流速传感器的流速异常监测", "水质传感器的悬浮物浓度监测", "", ""], "r": "B", "e": "视频监控与图像识别人工智能技术可对河道画面进行实时监控和分析，能精准识别非法采砂行为。而水位、流速、悬浮物浓度变化受多种因素影响，不能直接准确识别非法采砂行为。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831251", "t": 1, "q": "数字水利平台的数据质量控制中，针对水文站观测数据的\"跳变\"异常值，主要采用的检测方法是？", "a": ["均值检验法", "趋势检验法", "阈值检验法", "相邻数据差检验法", "", ""], "r": "D", "e": "“跳变”异常值是数据在短时间内出现急剧变化。相邻数据差检验法可通过对比相邻数据差值来检测是否有这种急剧变化的“跳变”情况。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831252", "t": 1, "q": "水利水电工程中，智能灌浆监控系统对灌浆压力和流量的控制，实现\"按设计曲线自动调节\"的关键是？", "a": ["采用高精度压力传感器和流量传感器", "建立灌浆参数与浆液扩散范围的关联模型", "控制执行机构的快速响应能力", "实时数据反馈与PID调节算法的结合", "", ""], "r": "D", "e": "要实现“按设计曲线自动调节”，需实时获取数据并根据偏差调整，实时数据反馈与PID调节算法结合能达成此目的。高精度传感器只是获取数据，关联模型与自动调节关键联系不大，控制执行机构响应能力是一方面但不是关键。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831253", "t": 1, "q": "在数字水利的流域水资源优化配置模型中，不需要作为约束条件的是？", "a": ["流域内各用水部门的需水量", "水库的兴利库容", "水文站的历史观测数据", "跨行政区的水资源分配协议", "", ""], "r": "C", "e": "流域水资源优化配置模型约束条件通常与水资源的量、分配规则等相关，水文站的历史观测数据是用于分析和建模的基础资料，并非约束条件，而各用水部门需水量、水库兴利库容、跨行政区水资源分配协议都会对水资源配置形成限制。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831254", "t": 1, "q": "水利工程智能监控系统中，采用LoRa无线通信技术传输传感器数据，其主要优势是？", "a": ["传输速率高", "传输距离远且功耗低", "抗电磁干扰能力最强", "支持大量节点同时通信", "", ""], "r": "B", "e": "LoRa无线通信技术特点是传输距离远且功耗低。其传输速率不高，抗电磁干扰能力不是最强，也不特别适合大量节点同时通信。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831255", "t": 1, "q": "智慧水利中，对水库泥沙淤积量进行动态监测的技术手段，最准确的是？", "a": ["基于水位观测的库容差计算法", "基于超声波测深的水下地形扫描法", "基于遥感影像的泥沙浓度反演法", "基于sediment transport公式的计算法", "", ""], "r": "B", "e": "超声波测深的水下地形扫描法能直接获取水库水下地形变化，通过对比不同时期地形可准确得出泥沙淤积量；A选项水位观测受多种因素影响，计算淤积量不够准确；C选项遥感影像反演的是泥沙浓度，不是淤积量；D选项公式计算依赖诸多假设和参数，准确性有限。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831256", "t": 1, "q": "数字水利平台中，用于实现水利工程运行状态\"一张图\"可视化展示的核心技术是？", "a": ["三维建模技术", "空间数据融合与符号化技术", "大数据可视化技术", "虚拟现实（VR）技术", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831257", "t": 1, "q": "水利水电工程的传感器数据采集系统中，采用\"轮询+中断\"混合数据采集方式，其主要目的是？", "a": ["提高数据采集的实时性", "降低系统的功耗", "避免数据采集冲突", "提高数据采集的完整性", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831258", "t": 1, "q": "在智慧水利的防洪预警系统中，预警等级的划分主要依据的是？", "a": ["洪水的重现期与影响范围", "降雨量的大小", "水位超警的高度", "洪水的传播速度", "", ""], "r": "A", "e": "防洪预警等级需综合考量洪水严重程度和影响范围，洪水重现期体现洪水稀有程度，影响范围反映其危害广度，能较全面确定预警等级。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831259", "t": 1, "q": "数字水利中，对水利工程BIM模型进行轻量化处理的主要目的是？", "a": ["减少模型的存储空间", "提高模型在Web端的加载与交互速度", "简化模型的几何结构", "降低模型的构建难度", "", ""], "r": "B", "e": "数字水利中，在Web端展示和交互水利工程BIM模型时，原始模型数据量大加载慢。轻量化处理可去除冗余信息，让模型数据变小，从而提高其在Web端加载与交互速度。A减少存储空间不是主要目的；C简化几何结构是手段非主要目的；D轻量化不针对降低构建难度。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831260", "t": 1, "q": "水利水电工程中，智能监控系统对泵站电机的过载保护，除了监测电流外，还需重点监测的参数是？", "a": ["电机的转速", "电机的绕组温度", "电机的振动幅值", "电机的输出功率", "", ""], "r": "B", "e": "电机过载时，电流增大易使绕组温度急剧上升，可能损坏电机，所以除监测电流外，重点监测绕组温度能更好实现过载保护。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831261", "t": 1, "q": "智慧水利系统中，采用边缘计算技术处理传感器数据的主要优势是？", "a": ["减少数据向云端传输的流量", "提高数据处理的精度", "降低系统的硬件成本", "增强数据的安全性", "", ""], "r": "A", "e": "边缘计算是在数据源附近处理数据，能在本地对传感器数据进行初步处理和分析，减少大量原始数据向云端传输，从而降低传输流量。而提高数据处理精度、降低硬件成本、增强数据安全性并非其采用边缘计算处理传感器数据的主要优势。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261541969920", "t": 2, "q": "水利水电工程智能监控系统的硬件组成中，属于\"数据传输层\"设备的有（　）", "a": ["工业以太网交换机", "4G/5G无线通信模块", "数据采集器", "光纤收发器", "传感器", ""], "r": "ABD", "e": "数据传输层主要负责数据的传输。工业以太网交换机、4G/5G无线通信模块、光纤收发器都用于数据传输。而数据采集器和传感器是数据采集层设备。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261541969921", "t": 2, "q": "数字水利技术中，实现\"水利工程全生命周期管理\"需融合的技术有（　）", "a": ["建筑信息模型（BIM）技术", "地理信息系统（GIS）技术", "大数据分析技术", "物联网（IoT）技术", "虚拟现实（VR）技术", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637261541969922", "t": 2, "q": "水利水电工程传感器数据采集过程中，为提高数据采集的可靠性，可采取的措施有（　）", "a": ["采用双传感器冗余配置（如2个相同传感器监测同一参数）", "对采集数据进行多次采样并取平均值", "采用抗电磁干扰的屏蔽线缆", "定期对传感器进行校准", "降低数据采集的采样频率", ""], "r": "ABCD", "e": "A双传感器冗余配置可防止单个传感器故障影响数据采集；B多次采样取平均能减少随机误差，提升可靠性；C抗电磁干扰屏蔽线缆可避免外界干扰；D定期校准能保证传感器测量准确。而E降低采样频率会使采集数据信息变少，不利于提高可靠性。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164224", "t": 2, "q": "智能监控系统在水利水电工程水电站中的应用功能包括（　）", "a": ["水轮发电机组振动、摆度实时监测", "水电站厂房温湿度环境监测", "水库水位与入库流量预测", "发电机组有功功率与无功功率调节", "水电站输电线路电压、电流监测", ""], "r": "ABDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164225", "t": 2, "q": "数字水利中\"数据中台\"的核心作用包括（　）", "a": ["实现水利多源数据（如水文、工程、气象数据）的集成管理", "为水利业务应用（如调度、监测）提供统一的数据接口", "直接生成水利工程的施工方案", "对水利数据进行标准化处理（如统一数据格式、单位）", "存储所有水利历史数据并支持快速查询", ""], "r": "ABDE", "e": "“数据中台”主要是处理和管理数据，为业务应用提供支持。A可集成多源数据；B能提供统一数据接口；D可对数据标准化；E可存储和支持查询历史数据。而直接生成水利工程施工方案并非数据中台核心作用。答案选ABDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164226", "t": 2, "q": "水利水电工程中，采用分布式数据采集系统的优势有（　）", "a": ["可根据工程布局分散部署采集节点，适应大型水利工程", "某一采集节点故障时，不影响其他节点的正常工作", "可减少集中式采集系统的长距离布线，降低成本", "能实现采集数据的实时处理与本地存储", "仅能采集模拟量信号，无法采集数字量信号", ""], "r": "ABCD", "e": "分布式数据采集系统可分散部署节点适应大型工程，节点故障不影响其他节点，还能减少长距离布线降成本，能实时处理和本地存储数据，且可采集模拟量和数字量信号。E选项错误。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164227", "t": 2, "q": "以下属于水利水电工程智能监控系统中\"预警逻辑\"设计依据的有（　）", "a": ["国家或行业颁布的水利工程安全监测技术规范", "水利工程的设计参数（如大坝设计洪水位、机组额定电流）", "水利工程的历史故障数据与事故案例", "实时采集的监测数据（如坝体位移、水位）", "水利工程所在地的社会经济发展规划", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164228", "t": 2, "q": "数字水利技术在水资源管理中的应用包括（　）", "a": ["流域水资源供需平衡分析与预测", "灌区灌溉用水量精准计量与调控", "地下水水位与水质实时监测", "水利工程建设进度管理", "饮用水水源地安全风险评估", ""], "r": "ABCE", "e": "数字水利技术能助力水资源管理各方面，A可分析预测供需平衡，B能精准计量调控灌溉用水，C可实时监测地下水，E可评估水源地安全风险。而D的水利工程建设进度管理主要侧重于工程建设环节，并非水资源管理应用。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164229", "t": 2, "q": "水利水电工程传感器选型时，需考虑的技术参数有（　）", "a": ["测量范围（如水位0-50米、温度-10-60℃）", "分辨率（如位移0.01毫米、流量0.01立方米/秒）", "准确度等级（如0.1级、0.5级）", "工作环境适应性（如湿度0-95%RH、压力0-1MPa）", "传感器的生产厂家知名度", ""], "r": "ABCD", "e": "选型考虑技术参数应围绕传感器性能及适用环境等，A测量范围、B分辨率、C准确度等级、D工作环境适应性都属于技术参数；而生产厂家知名度并非技术参数。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164230", "t": 2, "q": "智能监控系统中，用于处理水利水电工程监测数据的\"数据预处理\"步骤包括（　）", "a": ["数据清洗（去除异常值、缺失值填充）", "数据转换（如将电压信号转换为物理量值）", "数据压缩（减少数据存储量）", "数据融合（融合多传感器监测数据）", "数据可视化（生成监测曲线、报表）", ""], "r": "ABCD", "e": "数据预处理是对原始数据进行初步处理，为后续分析做准备，A去除异常值等、B信号转换、C减少存储量、D融合多源数据都属于预处理内容，E数据可视化是展示数据结果，不属于预处理步骤。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164231", "t": 2, "q": "数字水利中，基于遥感（RS）技术可获取的水利相关信息有（　）", "a": ["流域内的土地利用类型（如耕地、水域、林地）", "水库的水面面积变化", "大坝坝体的微小位移量", "河流水体的叶绿素浓度（反映水质）", "流域的降雨量分布", ""], "r": "ABDE", "e": "遥感技术可大范围获取地物信息。A选项，能通过遥感识别流域内土地利用类型；B选项，可监测水库水面面积变化；D选项，能获取河流水体叶绿素浓度反映水质；E选项，可监测流域降雨量分布。而大坝坝体微小位移量需高精度测量技术，遥感难以实现。答案选ABDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164232", "t": 2, "q": "水利水电工程智能监控系统的通信方式中，适用于长距离（数公里至数十公里）数据传输的有（　）", "a": ["光纤通信", "微波通信", "蓝牙通信", "4G/5G移动通信", "ZigBee通信", ""], "r": "ABD", "e": "光纤通信、微波通信、4G/5G移动通信适用于长距离数据传输。蓝牙通信和ZigBee通信传输距离较短。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164233", "t": 2, "q": "以下关于水利水电工程\"数字孪生\"技术的说法，正确的有（　）", "a": ["数字孪生模型需与物理实体保持几何形状、物理属性的高度一致", "数字孪生模型可通过实时数据驱动，模拟物理实体的运行状态", "数字孪生技术仅能用于水利工程的运行阶段，无法用于设计阶段", "数字孪生模型可用于预测水利工程的未来运行状态（如洪水演进）", "数字孪生系统无需与智能监控系统连接，可独立运行", ""], "r": "ABD", "e": "数字孪生模型要和物理实体在几何形状、物理属性等方面高度一致，能通过实时数据驱动模拟物理实体运行状态，还可预测水利工程未来运行状态。数字孪生技术可用于水利工程全生命周期，并非仅运行阶段；且需与智能监控系统连接获取实时数据。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164234", "t": 2, "q": "水利水电工程数据采集系统中，常见的\"数据采集接口\"类型有（　）", "a": ["RS-232接口", "RS-485接口", "Ethernet（以太网）接口", "USB接口", "模拟量接口（如4-20mA电流信号接口）", ""], "r": "ABCDE", "e": "这些接口在水利水电工程数据采集系统中都较为常见，RS - 232、RS - 485用于串行通信，Ethernet用于网络通信，USB方便设备连接，模拟量接口用于采集模拟信号。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164235", "t": 2, "q": "智能监控系统在水利水电工程闸门控制中的应用功能包括（　）", "a": ["闸门开启高度的实时监测", "闸门启闭机电机电流、电压监测", "根据水位自动控制闸门的开启度", "闸门运行故障（如卡阻）的自动诊断", "闸门历史运行数据的存储与查询", ""], "r": "ABCDE", "e": "智能监控系统在水利水电工程闸门控制中能对闸门开启高度实时监测、监测电机电流电压、依水位自动控开启度、自动诊断运行故障以及存储查询历史运行数据。答案：ABCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164236", "t": 2, "q": "数字水利平台建设中，需遵循的\"数据标准\"包括（　）", "a": ["数据分类与编码标准（如水利数据分类代码）", "数据格式标准（如JSON、XML格式）", "数据传输协议标准（如Modbus、MQTT）", "数据质量标准（如数据准确度、完整性要求）", "数据存储介质标准（如硬盘、U盘存储标准）", ""], "r": "ABCD", "e": "数字水利平台建设的数据标准涵盖数据分类编码、格式、传输协议、质量等方面，A是对数据进行分类和编码规范，B明确数据格式，C规定传输协议，D保障数据质量，而E数据存储介质标准并非核心的数据标准内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164237", "t": 2, "q": "水利水电工程中，用于监测坝体渗流的传感器有（　）", "a": ["渗压计（孔隙水压力传感器）", "渗流量计", "应变计", "温度计", "测压管（配套液位传感器）", ""], "r": "ABE", "e": "渗压计、渗流量计、测压管（配套液位传感器）可用于监测坝体渗流情况，应变计主要测应力应变，温度计测温度，与渗流监测无关。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164238", "t": 2, "q": "智能监控系统中，\"人工智能（AI）技术\"在水利水电工程中的应用包括（　）", "a": ["基于机器学习的水文预报（如降雨量、径流量预测）", "基于图像识别的闸门变形监测", "基于神经网络的水轮发电机组故障诊断", "基于专家系统的水利工程调度决策", "基于AI的水利工程施工图纸绘制", ""], "r": "ABCD", "e": "A可通过机器学习分析数据进行水文预报；B图像识别能用于监测闸门变形；C神经网络可诊断水轮发电机组故障；D专家系统可辅助水利工程调度决策。而施工图纸绘制更多依赖专业绘图软件和人工设计，AI绘制水利工程施工图纸目前不是常见应用。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164239", "t": 2, "q": "水利水电工程数据采集系统中，\"抗干扰措施\"针对的干扰类型有（　）", "a": ["电磁干扰（如高压设备产生的电磁场）", "接地干扰（如不同接地极之间的电位差）", "温度干扰（如环境温度变化）", "信号传输干扰（如线缆耦合干扰）", "电源干扰（如电源电压波动、谐波）", ""], "r": "ABDE", "e": "答案：ABDE在水利水电工程数据采集系统中，抗干扰措施主要针对的是那些能够直接影响系统稳定运行和数据准确性的干扰类型。电磁干扰、接地干扰、信号传输干扰以及电源干扰都是常见的干扰源，它们能够通过不同的机制影响系统的正常工作。而温度干扰虽然可能影响设备的性能，但通常不直接归类为抗干扰措施主要针对的干扰类型。因此，正确答案是ABDE。", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164240", "t": 2, "q": "数字水利技术的发展趋势包括（　）", "a": ["与5G、物联网技术深度融合，实现更广泛的智能感知", "与人工智能技术结合，提升自主决策与智能调控能力", "向\"天地一体\"（卫星遥感、地面监测）监测网络发展", "仅关注水利工程运行监测，忽略设计与维护阶段", "向流域级、国家级的大范围水利协同管理平台发展", ""], "r": "ABCE", "e": "数字水利应全面覆盖水利各环节，D选项仅关注运行监测忽略设计与维护阶段错误。A、B、C、E都是数字水利合理的发展趋势。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164241", "t": 2, "q": "水利水电工程智能监控系统中，\"数据存储\"采用的技术有（　）", "a": ["关系型数据库（如MySQL、Oracle）", "非关系型数据库（如MongoDB、Redis）", "时序数据库（如InfluxDB、Prometheus）", "分布式文件系统（如HDFS）", "光盘存储技术", ""], "r": "ABCD", "e": "水利水电工程智能监控系统数据类型多样、数据量大且有时间序列特性。关系型数据库可存储结构化数据；非关系型数据库适合存储非结构化数据；时序数据库能高效处理时间序列数据；分布式文件系统可存储大量数据。而光盘存储技术不适合实时、大量数据存储。ABCD选项技术都可用于数据存储。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164242", "t": 2, "q": "以下属于水利水电工程\"数字水利\"与\"传统水利\"区别的有（　）", "a": ["数字水利采用数字化手段管理水利数据，传统水利以纸质记录为主", "数字水利可实现水利数据的实时共享，传统水利数据共享依赖人工传递", "数字水利可通过模型模拟预测水利事件，传统水利主要依赖经验判断", "数字水利仅关注工程本身，传统水利关注流域整体", "数字水利采用智能监控设备，传统水利依赖人工现场监测", ""], "r": "ABCE", "e": "数字水利利用数字化手段，在数据管理、共享、预测及监测等方面更先进高效，而传统水利相对落后，依赖纸质、人工等。数字水利关注流域整体，D选项错误。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164243", "t": 2, "q": "智慧水利系统中，属于数字水利技术核心组成部分的有哪些？", "a": ["多源水利数据感知网络", "流域水文数值模拟模型", "水利工程三维可视化平台", "水库调度人工决策流程", "水利数据安全加密体系", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164244", "t": 2, "q": "水利水电工程中，智能监控系统的传感器选型需考虑的技术指标有哪些？", "a": ["测量范围与精度", "工作环境适应性（温度、湿度、压力）", "信号输出类型（模拟量/数字量）", "传感器的生产厂家", "数据传输距离与方式", ""], "r": "ABCE", "e": "传感器技术指标主要关注测量相关、适应环境、信号及传输等方面。测量范围与精度直接影响监测准确性；工作环境适应性确保传感器能正常工作；信号输出类型关系到与系统的适配；数据传输距离与方式影响数据能否有效传输。而生产厂家并非技术指标。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164245", "t": 2, "q": "数字水利平台中，多源异构数据融合的关键技术包括哪些？", "a": ["数据清洗与标准化技术", "分布式数据存储技术", "数据关联规则挖掘技术", "跨模态数据转换技术", "数据质量评估技术", ""], "r": "ABDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164246", "t": 2, "q": "水利水电工程智能监控系统中，属于智能预警功能实现所需的核心组件有哪些？", "a": ["实时数据采集模块", "预警阈值动态调整模型", "多通道报警输出装置", "历史数据查询模块", "预警信息推送系统", ""], "r": "ABCE", "e": "智能预警需先采集实时数据，通过预警阈值动态调整模型判断是否预警，有预警后用多通道报警输出装置发出警报，再通过预警信息推送系统告知相关人员。历史数据查询模块主要用于查询数据，并非智能预警核心组件。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164247", "t": 2, "q": "在水利工程数字孪生建模过程中，需要融入的物理参数有哪些？", "a": ["坝体材料的弹性模量", "水体的密度与黏滞系数", "工程区域的地质构造参数", "模型的可视化渲染参数", "水文站的观测精度参数", ""], "r": "ABC", "e": "水利工程数字孪生建模需物理参数反映工程实际物理特性。A坝体材料弹性模量、B水体密度与黏滞系数、C工程区域地质构造参数都属于实际物理特性参数；而D模型可视化渲染参数用于模型展示效果，E水文站观测精度参数与观测相关，并非物理特性参数。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164248", "t": 2, "q": "用于水利水电工程渗流监测的传感器，按测量原理分类，属于电学类传感器的有哪些？", "a": ["电阻式渗压计", "电容式含水率传感器", "光纤光栅渗流量传感器", "振弦式孔隙水压力计", "压阻式土压力传感器", ""], "r": "ABDE", "e": "电学类传感器是基于电学原理工作的。电阻式、电容式、振弦式、压阻式都与电学原理相关，而光纤光栅是基于光学原理。答案选ABDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164249", "t": 2, "q": "智慧水利中，\"四预\"功能（预报、预警、预演、预案）的实现，需要依赖的技术支撑有哪些？", "a": ["高分辨率遥感数据处理技术", "人工智能预测算法", "水利工程动态仿真技术", "应急调度方案知识库", "地理信息系统空间分析技术", ""], "r": "BCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164250", "t": 2, "q": "水利水电工程智能监控系统的通信网络设计中，需要考虑的冗余设计措施有哪些？", "a": ["通信链路的双路由设计", "核心交换机的热备份配置", "传感器供电的双电源设计", "数据传输协议的备份机制", "无线通信与有线通信的互补设计", ""], "r": "ABE", "e": "通信链路双路由、核心交换机热备份、无线与有线通信互补都能增强通信网络可靠性，属于冗余设计；传感器供电是供电方面，数据传输协议备份主要针对协议故障，并非通信网络冗余设计。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430144", "t": 3, "q": "数字水利中的BIM技术主要用于水利工程的三维建模，无法实现工程施工进度与成本的协同管理", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BIM技术不仅能用于水利工程三维建模，还可实现工程施工进度与成本的协同管理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430145", "t": 3, "q": "水利水电工程中，采用4-20mA电流信号传输传感器数据时，其抗干扰能力比0-5V电压信号更强，适合长距离传输", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电流信号受导线电阻影响小，抗干扰能力比电压信号强，更适合长距离传输。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430146", "t": 3, "q": "智能监控系统在水利水电工程中的\"预警功能\"，仅需依据实时监测数据与预设阈值的对比，无需考虑历史数据与趋势分析", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。仅依据实时监测数据与预设阈值对比来预警是不够的。历史数据和趋势分析能反映数据的变化走向、波动规律等，有助于更准确判断异常情况，提前发现潜在风险，完善预警功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430147", "t": 3, "q": "数字孪生水利工程模型的精度越高，其对硬件计算资源的需求越大，运行速度可能越慢", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "模型精度越高意味着细节越丰富、数据量越大，对硬件计算资源要求就高，处理数据时间变长导致运行速度变慢。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430148", "t": 3, "q": "水利水电工程数据采集系统中，采样频率设置越高，采集的数据越准确，因此应尽可能将采样频率设为最大值", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "采样频率并非越高越好，过高的采样频率会增加数据存储和处理负担，还可能引入更多噪声等问题，并非采样频率设为最大值就最好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430149", "t": 3, "q": "在水利水电工程智能监控系统中，边缘计算节点的主要作用是将所有采集数据传输至云端平台，由云端统一处理", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边缘计算节点主要是在靠近数据源的边缘侧对数据进行初步处理和分析，减轻云端处理压力，并非单纯将所有采集数据传输至云端由云端统一处理。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430150", "t": 3, "q": "GIS技术在数字水利中的应用，可实现水利工程空间位置与属性数据（如闸门型号、建设时间）的关联查询", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GIS（地理信息系统）能把空间数据和属性数据结合，可实现水利工程空间位置与属性数据的关联查询。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430151", "t": 3, "q": "水利水电工程中，电容式传感器的输出信号受环境温度变化影响较小，因此无需进行温度补偿", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电容式传感器的输出信号会受环境温度变化影响，通常需要进行温度补偿。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430152", "t": 3, "q": "数字水利平台中的\"数据中台\"可实现不同来源水利数据（如水文站、水库、灌区数据）的标准化整合，为业务应用提供统一数据服务", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据中台的核心功能之一就是对不同来源的数据进行标准化整合，为业务应用提供统一的数据服务，数字水利平台里的数据中台也具备此功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430153", "t": 3, "q": "水利水电工程智能监控系统的通信链路若采用光纤通信，其传输速率不受传输距离影响，可实现无衰减传输", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "光纤通信虽衰减小，但并非无衰减，传输速率也会受传输距离等因素影响。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430154", "t": 3, "q": "在水利水电工程大坝安全监测中，采用GNSS技术监测坝体位移时，可实现全天候、高精度（毫米级）的实时监测", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GNSS技术具备不受天气等因素影响能全天候工作的特点，且其精度可达到毫米级，能实现对水利水电工程坝体位移的实时监测。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430155", "t": 3, "q": "智能监控系统中的\"人工智能故障诊断\"，仅能诊断传感器故障，无法诊断水轮发电机组等大型设备的故障", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人工智能故障诊断技术能力不断发展，不仅能诊断传感器故障，也可对水轮发电机组等大型设备故障进行诊断。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430156", "t": 3, "q": "数字水利中的\"智慧调度\"，其调度方案仅由水文预测数据决定，无需考虑用水需求、工程安全等因素", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧调度的调度方案不能仅由水文预测数据决定，用水需求、工程安全等因素也至关重要，需要综合考量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430157", "t": 3, "q": "水利水电工程数据采集系统中，数据预处理环节的\"缺失值填充\"，可采用相邻时刻数据平均值填充，以保证数据的连续性", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程数据采集系统里，用相邻时刻数据平均值填充缺失值是常见方法，能在一定程度上保证数据连续性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430158", "t": 3, "q": "在水利水电工程中，超声波流量计可用于测量含沙量较高的水流流量，且测量精度不受含沙量影响", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超声波流量计测量精度会受含沙量等因素影响，含沙量较高时测量精度会降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430159", "t": 3, "q": "数字孪生水利系统中，物理实体与虚拟模型的\"实时同步\"，需通过实时数据传输与数据同化技术实现", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数字孪生水利系统里，要达成物理实体和虚拟模型“实时同步”，确实需依靠实时数据传输来获取物理实体的最新信息，再通过数据同化技术将这些数据融合到虚拟模型中。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430160", "t": 3, "q": "水利水电工程智能监控系统的\"远程控制\"功能，在任何情况下都可通过云端平台直接控制执行机构（如闸门），无需本地权限验证", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利水电工程涉及到公共安全等重要方面，为保障安全可靠运行，即使有远程控制功能，也不能在任何情况下都绕过本地权限验证直接通过云端平台控制执行机构，必须有严格的权限验证机制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430161", "t": 3, "q": "水利水电工程传感器选型时，准确度等级越高的传感器，越适合该工程的监测需求，无需考虑测量范围与环境适应性", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利水电工程传感器选型时，不仅要考虑准确度等级，测量范围需与监测参数匹配，环境适应性也至关重要，要能在工程现场环境正常工作。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430162", "t": 3, "q": "数字水利技术中的\"大数据分析\"，可通过分析历史水文数据，识别流域水文规律，提高水文预报的准确性", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数据分析能对大量历史水文数据进行处理和挖掘，从中找出流域水文变化的规律，进而为水文预报提供依据，提高预报准确性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430163", "t": 3, "q": "水利水电工程数据采集系统中，RS-485总线与RS-232总线相比，前者支持多节点连接，后者仅支持点对点连接", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RS - 485总线具有多节点能力，能连接多个设备；RS - 232总线通常只能实现点对点通信。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430164", "t": 3, "q": "智能监控系统在水利水电工程中的应用，可完全替代人工现场监测，无需人工参与任何监测工作", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智能监控系统虽能提升监测效率，但存在监测盲区、设备故障等问题，不能处理复杂情况，所以不能完全替代人工，仍需人工参与。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430165", "t": 3, "q": "数字水利中的\"虚拟现实（VR）技术\"，主要用于水利工程的可视化展示，无法用于工程施工人员的培训", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VR技术不仅可用于水利工程可视化展示，还能为工程施工人员提供沉浸式培训环境，让他们在虚拟场景中模拟施工操作等。所以题干说无法用于工程施工人员培训是错误的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430166", "t": 3, "q": "水利水电工程中，渗压计（孔隙水压力传感器）的安装深度越深，其测量的孔隙水压力值越大，与大坝安全风险呈正相关", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。渗压计测量的孔隙水压力值大小不仅取决于安装深度，还与土体的渗透特性、地下水位等因素有关。而且孔隙水压力大不一定就与大坝安全风险呈正相关，在合理范围内的孔隙水压力是大坝正常运行的一部分，只有当孔隙水压力异常变化且超出一定范围时，才可能与大坝安全风险相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430167", "t": 3, "q": "水利水电工程智能监控系统的\"数据存储\"，采用时序数据库比关系型数据库更适合存储海量时间序列监测数据（如每10分钟一次的水位数据）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "时序数据库专为处理时间序列数据设计，能高效存储和查询海量时间序列数据，而关系型数据库在处理此类数据时效率较低。对于每10分钟一次的水位数据这种海量时间序列监测数据，时序数据库更具优势。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430168", "t": 3, "q": "数字水利平台的建设，只需整合水利部门内部数据，无需接入气象、环保等其他部门的数据", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利平台建设仅整合水利部门内部数据是不够的，气象、环保等部门的数据对水利工作有重要影响，如气象数据可用于洪水预警等，所以需要接入其他部门数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430169", "t": 3, "q": "在水利水电工程数据采集过程中，采用双端接地的屏蔽线缆，可有效避免地环流干扰，提高数据传输稳定性", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "双端接地的屏蔽线缆会产生地环流干扰，应采用单端接地屏蔽线缆避免地环流干扰。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430170", "t": 3, "q": "智能监控系统中的\"模型预测控制\"，可根据水利工程未来运行状态预测（如未来24小时水位变化），提前制定控制策略", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "模型预测控制具备根据系统未来状态预测来提前规划控制策略的能力，在智能监控系统里，针对水利工程未来运行状态（像未来24小时水位变化），能提前制定控制策略。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430171", "t": 3, "q": "水利水电工程中，压电式传感器可用于长期监测坝体的静态应变，因其稳定性好、精度高", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压电式传感器主要用于测量动态应力，不适用于长期监测坝体静态应变，它的输出信号与应变速率有关，静态应变下输出信号会衰减。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430172", "t": 3, "q": "数字水利中的\"物联网技术\"，通过传感器、通信模块等设备，可实现水利监测数据的自动采集与传输，减少人工干预", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "物联网技术依靠传感器、通信模块等设备，能自动获取水利监测数据并完成传输，确实可减少人工干预。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430173", "t": 3, "q": "水利水电工程智能监控系统的\"预警级别\"，仅根据监测数据超过阈值的幅度确定，与数据变化趋势无关", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利水电工程智能监控系统的预警级别确定，不仅要考虑监测数据超过阈值的幅度，数据变化趋势也是重要考量因素，所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430174", "t": 3, "q": "在水利水电工程中，采用5G通信技术传输监测数据，其传输时延比4G更低，更适合实时控制场景", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "5G具有高速率、低时延、大容量等特点，相比4G，其传输时延更低，能更好满足实时控制场景对及时性的要求，在水利水电工程中用5G传输监测数据更适合实时控制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430175", "t": 3, "q": "数字孪生水利模型构建完成后，无需进行模型更新与维护，可长期用于水利工程的运行管理", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利系统是动态变化的，如地形地貌、水流情况等会随时间改变，所以数字孪生水利模型需不断更新与维护，才能准确反映实际情况用于水利工程运行管理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430176", "t": 3, "q": "水利水电工程数据采集系统中，数据的\"完整性\"是指采集的数据无异常值，与数据是否缺失无关", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据的完整性不仅要求无异常值，还与数据是否缺失密切相关，若存在数据缺失就不能说数据完整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430177", "t": 3, "q": "智能监控系统在灌区水资源管理中的应用，可根据土壤墒情与作物需水量，实现灌溉用水的精准调控，提高水资源利用率", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "智能监控系统能获取土壤墒情等数据，结合作物需水量，可精准控制灌溉用水，从而提高水资源利用率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430178", "t": 3, "q": "水利水电工程中，雷达液位传感器测量水库水位时，受风浪、雾、雨等环境因素影响较小，测量稳定性高", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "雷达液位传感器利用电磁波测量，其工作原理使其受风浪、雾、雨等环境因素影响较小，能保持较高的测量稳定性，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430179", "t": 3, "q": "数字水利中的\"大数据技术\"，处理的水利数据仅包括结构化数据（如水位、流量数值），不包括非结构化数据（如遥感影像、视频）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利中的大数据技术处理的水利数据既包含结构化数据，也包含非结构化数据，题中说仅包括结构化数据错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430180", "t": 3, "q": "水利水电工程传感器的\"分辨率\"是指传感器能识别的最小测量变化量，分辨率越高，传感器能监测的微小变化越灵敏", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分辨率定义就是传感器能识别的最小测量变化量，分辨率高意味着能察觉更细微的变化，即对微小变化监测更灵敏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430181", "t": 3, "q": "水利水电工程智能监控系统的\"通信安全性\"，可通过数据加密（如SSL/TLS加密）、访问控制等措施保障，防止数据被窃取或篡改", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据加密（如SSL/TLS加密）和访问控制是常见且有效的保障通信安全的手段，能防止数据在传输和存储过程中被窃取或篡改，所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430182", "t": 3, "q": "在水利水电工程中，分布式光纤传感器可同时监测坝体的温度与应变，实现\"一纤多测\"", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分布式光纤传感器具有独特优势，能利用同一根光纤同时对温度和应变等多种物理量进行监测，达成“一纤多测”，在水利水电工程的坝体监测等方面有应用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430183", "t": 3, "q": "数字水利技术的应用，可完全解决水利水电工程中的所有管理问题，无需结合传统管理方法", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利技术虽能提升管理效率和水平，但水利水电工程管理复杂，很多实际情况需要传统管理方法的经验和人文关怀等，不可能完全解决所有问题。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第3章 智慧水利和数字水利技术||第4节 传感器技术与数据采集（2）", "n": "第3章 智慧水利和数字水利技术 / 第4节 传感器技术与数据采集（2）", "qs": [{"id": "2035637268114444288", "t": 1, "q": "数字水利平台的水文预报模型中，当输入的降雨数据存在缺测时，主要采用的插补方法是？", "a": ["线性插值法", "邻近站点加权插值法", "历史同期数据替代法", "趋势外推法", "", ""], "r": "B", "e": "降雨数据缺测时，邻近站点加权插值法考虑了空间相关性，能利用周边站点数据合理插补缺测值，更适合降雨数据插补。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444289", "t": 1, "q": "水利工程的智能监控系统中，对闸门开度的测量采用绝对值编码器，其主要优点是？", "a": ["测量范围大", "无需初始位置校准", "抗干扰能力强", "测量精度最高", "", ""], "r": "B", "e": "绝对值编码器能直接输出对应位置的数字编码，无需像增量编码器那样每次开机都进行初始位置校准。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444290", "t": 1, "q": "在水利水电工程智能监控系统中，数据采集终端与远程监控中心之间采用无线通信方式传输海量监测数据时，优先选择的通信协议是", "a": ["Modbus协议", "MQTT协议", "HTTP协议", "TCP/IP协议", "", ""], "r": "B", "e": "MQTT协议适合物联网设备间海量数据的无线传输，具有轻量级、低带宽占用等特点，符合水利水电工程智能监控系统需求。而Modbus多用于工业现场设备通信；HTTP协议多用于网页数据传输；TCP/IP是基础通信协议，并非针对海量数据无线传输优化。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444291", "t": 1, "q": "数字水利技术中，用于对流域内水文、水资源、水环境等空间分布信息进行可视化管理和空间分析的核心技术是", "a": ["遥感（RS）技术", "地理信息系统（GIS）技术", "全球导航卫星系统（GNSS）技术", "大数据分析技术", "", ""], "r": "B", "e": "GIS技术可对地理空间数据进行采集、存储、管理、分析和可视化表达，能用于对流域相关空间分布信息进行可视化管理和空间分析。而RS主要用于获取影像数据，GNSS用于定位，大数据分析技术侧重于数据处理分析但缺乏空间分析核心能力。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444292", "t": 1, "q": "某水利枢纽工程的智能监控系统中，需对闸门启闭机的运行状态进行实时监测，当监测到电机电流超过额定值15%时自动触发报警，该功能的实现依赖于系统的哪一模块", "a": ["数据采集模块", "数据预处理模块", "阈值判断与预警模块", "远程控制模块", "", ""], "r": "C", "e": "题目是要在电机电流超额定值15%时自动触发报警，这是对采集数据和设定阈值进行比较后发出预警，对应阈值判断与预警模块。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444293", "t": 1, "q": "在水利水电工程传感器选型中，若需测量水库水位的变化量，且要求测量范围为0-100米、分辨率0.01米，以下传感器中最符合要求的是", "a": ["超声波液位传感器", "浮子式液位传感器", "雷达液位传感器", "静压式液位传感器", "", ""], "r": "D", "e": "静压式液位传感器测量精度高、量程大，能满足0 - 100米测量范围和0.01米分辨率要求。超声波和雷达液位传感器易受环境干扰，浮子式液位传感器精度相对较低。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444294", "t": 1, "q": "数字水利中的\"智慧调度\"功能，其核心是通过哪类技术实现对水利工程（如水库、闸门）的优化运行调度", "a": ["机器学习与优化算法", "数据可视化技术", "数据库管理技术", "通信传输技术", "", ""], "r": "A", "e": "智慧调度要实现水利工程优化运行调度，需通过机器学习与优化算法对大量数据处理分析来找到最优调度方案。数据可视化主要是展示数据；数据库管理技术侧重数据存储管理；通信传输技术是保障数据传输，核心并非优化调度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444295", "t": 1, "q": "水利水电工程数据采集系统中，为减少外界电磁干扰对模拟量信号（如传感器输出的电压信号）的影响，最有效的硬件抗干扰措施是", "a": ["增加信号传输线缆的直径", "采用屏蔽线缆并单端接地", "提高信号的放大倍数", "减少数据采集的采样频率", "", ""], "r": "B", "e": "屏蔽线缆可屏蔽外界电磁干扰，单端接地能避免形成地环流引入新干扰，是有效抗干扰硬件措施。增加线缆直径主要影响电阻，与抗干扰关系不大；提高放大倍数不能减少干扰；减少采样频率和抗干扰无关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444296", "t": 1, "q": "智能监控系统在水利水电工程中的应用，不包括以下哪项功能", "a": ["大坝渗流场实时监测与渗流量预测", "水电站机组振动频率分析与故障诊断", "水利工程施工图纸的CAD绘制", "灌区用水量实时统计与节水调控", "", ""], "r": "C", "e": "智能监控系统主要用于对水利水电工程运行状态等进行监测、分析和调控。CAD绘制施工图纸是设计阶段的工作，并非智能监控系统的功能。而A、B、D选项均是对工程运行数据监测、分析和调控相关功能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444297", "t": 1, "q": "在水利水电工程中，采用分布式光纤传感器监测坝体温度场时，其工作原理主要基于以下哪一物理现象", "a": ["光的折射现象", "光的反射现象", "拉曼散射现象", "光的干涉现象", "", ""], "r": "C", "e": "分布式光纤传感器监测坝体温度场是基于拉曼散射现象，利用该现象中背向拉曼散射光的强度与温度的关系来测量温度。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444298", "t": 1, "q": "数字水利平台建设中，对水利数据进行\"清洗、转换、集成\"的过程属于以下哪一环节", "a": ["数据采集环节", "数据预处理环节", "数据存储环节", "数据应用环节", "", ""], "r": "B", "e": "数据预处理就是对原始数据进行清洗、转换、集成等操作，使其符合后续处理要求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444299", "t": 1, "q": "某水利水电工程的智能监控系统采用\"传感器-数据采集器-边缘计算网关-云端平台\"的架构，其中边缘计算网关的主要作用是", "a": ["直接采集传感器输出的模拟信号", "对采集数据进行实时预处理和本地决策", "存储所有监测数据并支持云端查询", "实现云端平台对传感器的远程控制", "", ""], "r": "B", "e": "边缘计算网关处于数据采集与云端之间，可对采集数据进行实时预处理和做出本地决策，减轻云端压力。A选项直接采集模拟信号是数据采集器的功能；C选项存储所有监测数据并支持云端查询一般是云端平台的功能；D选项实现云端对传感器远程控制不是边缘计算网关主要作用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444300", "t": 1, "q": "在水利水电工程传感器数据采集过程中，\"采样频率\"的选择需遵循奈奎斯特采样定理，若某传感器监测的水文信号最高频率为50Hz，则采样频率至少应设置为", "a": ["50Hz", "75Hz", "100Hz", "150Hz", "", ""], "r": "C", "e": "奈奎斯特采样定理指出，采样频率应至少为信号最高频率的2倍。已知水文信号最高频率为50Hz，所以采样频率至少为50×2 = 100Hz。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444301", "t": 1, "q": "数字水利技术中，\"数字流域\"模型构建的基础数据不包括以下哪类", "a": ["流域地形地貌数据（如DEM数据）", "流域水文气象数据（如降雨量、径流量）", "流域社会经济数据（如人口、GDP）", "流域水利工程设计图纸（如CAD图纸）", "", ""], "r": "C", "e": "“数字流域”模型构建主要围绕流域自然特征和水利相关情况。社会经济数据与流域本身自然和水利特性关联不大，并非构建“数字流域”模型的基础数据。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444302", "t": 1, "q": "水利水电工程智能监控系统中，用于诊断水泵机组轴承磨损故障的常用技术是", "a": ["振动信号分析技术", "温度信号分析技术", "压力信号分析技术", "流量信号分析技术", "", ""], "r": "A", "e": "水泵机组轴承磨损时会产生振动，通过振动信号分析技术可有效诊断其磨损故障。而温度、压力、流量信号虽也能反映机组某些状态，但不是诊断轴承磨损故障的常用技术。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444303", "t": 1, "q": "以下关于水利水电工程数据采集系统中\"数据传输时延\"的说法，正确的是", "a": ["数据传输时延越小，系统的实时性越好，与数据准确性无关", "数据传输时延仅由通信距离决定，距离越远时延越大", "为降低时延，所有监测数据均应采用有线通信方式传输", "时延过大会导致智能监控系统的控制指令无法及时执行，影响工程安全", "", ""], "r": "D", "e": "A选项，数据传输时延小实时性好，且时延与数据准确性有关，A错误；B选项，数据传输时延受通信距离、网络状况等多种因素影响，并非仅由通信距离决定，B错误；C选项，有线通信和无线通信各有优劣，并非所有监测数据都适合用有线通信降低时延，C错误；D选项，时延过大确实会使智能监控系统控制指令不能及时执行，影响工程安全，D正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444304", "t": 1, "q": "在数字水利的\"智慧水利\"阶段，其与传统数字水利的主要区别在于", "a": ["是否采用三维建模技术构建水利工程模型", "是否具备基于多源数据的自主决策与自适应调控能力", "是否实现水利数据的电子化存储与管理", "是否采用无线通信技术传输监测数据", "", ""], "r": "B", "e": "智慧水利强调智能化，能基于多源数据自主决策和自适应调控，这是区别于传统数字水利的关键。A选项三维建模、C选项电子化存储管理、D选项无线通信传输监测数据在传统数字水利也可能有应用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444305", "t": 1, "q": "某水利枢纽工程采用电容式传感器监测闸门的位移量，当闸门发生微小位移时，传感器的以下哪一参数会发生变化", "a": ["电阻值", "电容值", "电感值", "电压值", "", ""], "r": "B", "e": "电容式传感器利用电容变化来测量物理量，闸门位移会改变电容式传感器极板间距离等参数，从而使电容值变化。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444306", "t": 1, "q": "水利水电工程智能监控系统的软件架构中，负责实现\"监测数据可视化展示、报表生成、历史数据查询\"功能的模块是", "a": ["数据采集模块", "数据处理模块", "人机交互模块", "预警控制模块", "", ""], "r": "C", "e": "人机交互模块面向用户，可将数据以直观形式展示，实现监测数据可视化展示、报表生成、历史数据查询等与用户交互功能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444307", "t": 1, "q": "以下哪项技术不属于数字水利中\"数据融合\"的常用技术方法", "a": ["卡尔曼滤波法", "神经网络法", "傅里叶变换法", "贝叶斯估计法", "", ""], "r": "C", "e": "数字水利“数据融合”常用方法有卡尔曼滤波法、神经网络法、贝叶斯估计法等。傅里叶变换法主要用于信号分析、频谱分析等，并非数据融合常用技术。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444308", "t": 1, "q": "水利水电工程中，用于监测水库入库流量的传感器，若要求在高流速（3-8米/秒）、含沙量较高的水环境下稳定工作，以下最适用的是", "a": ["电磁流量计", "超声波流量计", "涡街流量计", "差压式流量计", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444309", "t": 1, "q": "智能监控系统在水利水电工程大坝安全监测中的应用，其监测数据不包括以下哪项", "a": ["坝体的水平位移和垂直位移", "坝体内部的应力和应变", "大坝基础的扬压力", "大坝混凝土的配合比", "", ""], "r": "D", "e": "智能监控系统监测的是大坝运行过程中的实时状态数据，而大坝混凝土配合比是在施工阶段确定的固定参数，并非运行监测数据。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444310", "t": 1, "q": "数字水利平台中，基于物联网（IoT）技术构建的水利监测网络，其核心特征是", "a": ["仅实现监测数据的有线传输", "实现\"感、传、知、用\"的一体化", "仅监测水利工程的静态参数", "依赖人工现场采集数据", "", ""], "r": "B", "e": "物联网技术构建的水利监测网络强调全面性和智能化，要能感知、传输、处理和应用数据，实现“感、传、知、用”一体化。A 选项，监测数据传输方式有线无线均可；C 选项，不只是监测静态参数，动态参数也会监测；D 选项，物联网是自动采集数据，并非依赖人工现场采集。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444311", "t": 1, "q": "在水利水电工程数据采集系统中，\"数据校验\"的主要目的是", "a": ["提高数据的传输速度", "确保采集数据的准确性和有效性", "增加数据的存储容量", "简化数据的可视化流程", "", ""], "r": "B", "e": "数据校验是对采集的数据进行检查，确保其准确、有效，与传输速度、存储容量和可视化流程无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444312", "t": 1, "q": "以下关于水利水电工程智能监控系统中\"边缘计算\"的说法，错误的是", "a": ["边缘计算可在靠近数据采集端的本地处理数据，减少云端压力", "边缘计算可降低数据传输时延，适合实时控制场景", "边缘计算节点可独立完成所有数据处理任务，无需与云端交互", "边缘计算可提高系统的可靠性，避免云端故障导致的整体瘫痪", "", ""], "r": "C", "e": "边缘计算虽能在本地处理部分数据，但不是所有数据处理任务都能独立完成，仍需与云端交互，C选项说法错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444313", "t": 1, "q": "数字水利技术中，用于预测流域洪水过程的核心模型是", "a": ["水资源优化配置模型", "流域水文预报模型", "水环境质量评价模型", "水利工程调度模型", "", ""], "r": "B", "e": "题干问预测流域洪水过程的核心模型，流域水文预报模型可对洪水等水文过程进行预测。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444314", "t": 1, "q": "水利水电工程中，采用压电式传感器监测水流脉动压力时，该传感器的输出信号类型是", "a": ["连续的模拟电压信号", "离散的数字信号", "脉冲式电压信号", "恒定的电流信号", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444315", "t": 1, "q": "智能监控系统在水利水电工程中的\"远程控制\"功能，其实现的前提是", "a": ["传感器能采集到实时数据", "系统具备可靠的通信链路和控制指令执行机构", "已构建完成水利工程的三维模型", "已存储足够的历史监测数据", "", ""], "r": "B", "e": "远程控制需将控制指令准确传输并执行，所以系统得有可靠通信链路和控制指令执行机构。A项采集实时数据是监测基础非远程控制前提；C项三维模型与远程控制无直接关联；D项历史监测数据对远程控制并非必要前提。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444316", "t": 1, "q": "以下哪项不属于数字水利中\"智能感知\"技术的应用场景", "a": ["利用GNSS技术监测大坝的位移", "利用无人机遥感技术监测流域水土流失", "利用人工现场测量水库水位", "利用水质传感器实时监测河流水质", "", ""], "r": "C", "e": "数字水利“智能感知”依靠自动化、信息化技术自动获取数据。人工现场测量是传统方式，非智能感知技术应用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637268114444317", "t": 1, "q": "水利水电工程数据采集系统中，当采用RS-485总线连接多个传感器时，其主要优势是", "a": ["可实现传感器的无线通信", "可在长距离（数百米）内连接多个节点", "仅能连接2个传感器，通信稳定性高", "传输速率可达1000Mbps以上", "", ""], "r": "B", "e": "RS - 485总线是一种常见的串行通信接口标准，它的特点是能在长距离（可达数百米）下连接多个节点。A项，RS - 485是有线通信；C项，可连接多个传感器，不止2个；D项，其传输速率一般达不到1000Mbps以上。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907712", "t": 2, "q": "数字水利平台中，对水利工程运行状态进行评估的指标体系应包含的维度有哪些？", "a": ["工程结构安全维度", "水资源利用效率维度", "生态环境影响维度", "管理维护成本维度", "数据采集频率维度", ""], "r": "ABCD", "e": "评估水利工程运行状态需从工程自身、资源利用、环境影响、成本等多方面考量。A工程结构安全是基础；B水资源利用效率反映工程对水资源的利用效果；C生态环境影响体现工程的环境效益；D管理维护成本涉及工程经济方面。而E数据采集频率主要关系数据采集工作安排，非评估运行状态核心维度。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907713", "t": 2, "q": "水利工程中，智能灌浆监控系统能实现的功能有哪些？", "a": ["灌浆压力自动调节", "浆液浓度实时监测与调整", "灌浆孔位自动定位", "灌浆过程数据自动记录与存储", "灌浆质量实时评估", ""], "r": "ABDE", "e": "智能灌浆监控系统可自动调节灌浆压力、实时监测与调整浆液浓度、自动记录与存储灌浆过程数据、实时评估灌浆质量，而灌浆孔位自动定位并非该系统常规功能。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907714", "t": 2, "q": "智慧水利系统中，边缘计算节点在水利工程现场的应用场景有哪些？", "a": ["传感器数据实时滤波与异常检测", "泵站电机启停的本地控制", "流域水文模型的整体计算", "视频监控图像的本地识别（如漂浮物）", "水库水位的实时预报", ""], "r": "ABD", "e": "边缘计算节点侧重在现场进行实时、局部的数据处理和控制。A可在现场对传感器数据快速处理；B能在泵站现场控制电机；D能在本地对监控图像分析，都符合边缘计算在现场应用场景。而C流域水文模型整体计算、E水库水位实时预报需大量数据和复杂模型，多在云端或中心系统处理。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907715", "t": 2, "q": "水利水电工程的传感器数据采集系统中，影响数据采集精度的因素有哪些？", "a": ["传感器的校准周期", "数据采集模块的采样频率", "传感器与采集器之间的传输线缆长度", "采集系统的接地方式", "传感器的安装角度", ""], "r": "ACDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907716", "t": 2, "q": "数字水利中，水利工程BIM模型与GIS融合的关键技术难点有哪些？", "a": ["坐标系的统一", "模型数据格式的转换", "模型轻量化与空间数据叠加", "BIM模型属性信息与GIS空间信息的关联", "融合后模型的可视化渲染效果", ""], "r": "ABCD", "e": "数字水利中，水利工程BIM模型与GIS融合的关键技术难点主要包括以下几个方面：* 坐标系的统一：这是实现BIM与GIS融合的基础，确保两个系统中的空间数据能够在同一坐标系下准确对应。* 模型数据格式的转换：由于BIM和GIS系统通常使用不同的数据格式，因此需要解决数据格式转换的问题，以实现数据的互通。* 模型轻量化与空间数据叠加：在融合过程中，需要对BIM模型进行轻量化处理，以便于与GIS中的空间数据进行高效叠加和分析。* BIM模型属性信息与GIS空间信息的关联：确保BIM模型中的属性信息能够与GIS中的空间信息有效关联，从而提供更全面的水利工程分析和决策支持。至于选项E“融合后模型的可视化渲染效果”，虽然可视化渲染是重要的，但它更多是融合后的应用层面，而非融合过程中的关键技术难点。综上所述，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907717", "t": 2, "q": "水利水电工程智能监控系统中，属于安全防护措施的有哪些？", "a": ["数据传输的加密协议（如SSL/TLS）", "监控系统的访问权限分级控制", "传感器的防雷击保护", "核心设备的物理防护（如防尘、防水）", "系统日志的实时审计与异常追溯", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907718", "t": 2, "q": "智慧水利的水资源优化配置模型中，需要考虑的约束条件有哪些？", "a": ["各用水部门的最小需水量", "水库的最大泄洪流量", "地下水开采量的上限", "跨流域调水的输水能力", "水利工程的建设成本", ""], "r": "ABCD", "e": "水资源优化配置需保障各用水部门基本用水，所以要考虑最小需水量；水库泄洪有最大流量限制，超量会有危险；地下水开采过度会引发问题，要设置上限；跨流域调水输水能力影响调水量；而水利工程建设成本主要在规划建设阶段考量，并非配置模型的约束条件。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907719", "t": 2, "q": "用于水利渠道流量监测的传感器，适合在高含沙量、高流速水流中使用的有哪些？", "a": ["超声波多普勒流速仪", "电磁流量计", "时差法超声波流量计", "转子式流速仪", "堰槽式流量测量装置", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907720", "t": 2, "q": "数字水利平台的用户界面设计中，需要满足的水利行业特殊需求有哪些？", "a": ["支持多源数据的同步展示", "提供水利工程的三维漫游功能", "具备离线数据查看功能（应对偏远区域无网络）", "支持自定义报表生成", "提供预警信息的声光报警功能", ""], "r": "ACE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907721", "t": 2, "q": "水利水电工程中，智能监控系统对发电机组的状态监测参数应包含哪些？", "a": ["机组的转速与出力", "定子绕组温度与转子绕组温度", "机组的振动与摆度", "冷却水的压力与流量", "电网的电压与频率", ""], "r": "ABCD", "e": "智能监控系统监测发电机组状态，A转速与出力、B定转子绕组温度、C振动与摆度、D冷却水压力与流量都直接反映机组自身运行状态。而E电网电压与频率是电网相关参数，并非直接针对发电机组状态监测。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907722", "t": 2, "q": "智慧水利中，采用人工智能技术实现的应用场景有哪些？", "a": ["基于图像识别的河道漂浮物检测", "基于LSTM神经网络的洪水预报", "基于遗传算法的水库调度方案优化", "基于BIM模型的工程进度管理", "基于聚类分析的水文数据异常检测", ""], "r": "ABCE", "e": "图像识别、LSTM神经网络、遗传算法、聚类分析都属于人工智能技术范畴，可分别用于河道漂浮物检测、洪水预报、水库调度方案优化、水文数据异常检测；而BIM模型主要是建筑信息模型，用于工程进度管理并非人工智能技术典型应用。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907723", "t": 2, "q": "数字水利中，对水文时间序列数据（如日流量）进行趋势分析时，常用的方法有哪些？", "a": ["滑动平均法", "线性回归分析法", "Mann-Kendall趋势检验法", "小波分析法", "主成分分析法", ""], "r": "ABCD", "e": "滑动平均法可平滑数据展现趋势；线性回归分析能确定变量间线性关系以分析趋势；Mann - Kendall趋势检验法是非参数检验用于判断趋势；小波分析法可分析时间序列多尺度特征找趋势。而主成分分析法主要用于数据降维，并非趋势分析常用方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907724", "t": 2, "q": "水利工程的智能监控系统中，数据传输网络可采用的通信技术有哪些？", "a": ["LoRa无线通信", "光纤有线通信", "4G/5G移动通信", "蓝牙通信", "卫星通信", ""], "r": "ABCE", "e": "LoRa适合长距离低功耗数据传输；光纤有线通信稳定可靠、传输速率高；4G/5G移动通信覆盖广、传输快；卫星通信可实现偏远地区通信；而蓝牙通信距离短、传输范围小，不适合水利工程智能监控系统大范围数据传输。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907725", "t": 2, "q": "智慧水利系统中，数字孪生流域建设需要采集的基础数据有哪些？", "a": ["流域地形地貌数据（DEM）", "流域内水文站、雨量站观测数据", "流域内水利工程设计与运行数据", "流域社会经济用水数据", "流域内气象卫星遥感数据", ""], "r": "ABCDE", "e": "数字孪生流域需全面数据支撑，地形地貌、水文观测、水利工程、社会经济用水、气象遥感等数据都对准确模拟流域状况至关重要。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907726", "t": 2, "q": "水利水电工程中，影响传感器长期稳定工作的环境因素有哪些？", "a": ["温度的剧烈变化", "湿度与水汽侵蚀", "电磁干扰", "土壤或水体的腐蚀性", "光照强度的变化", ""], "r": "ABCD", "e": "温度剧烈变化会使传感器材料性能改变；湿度水汽侵蚀可能损坏元件；电磁干扰会影响信号传输；土壤或水体腐蚀性会破坏传感器结构，这些都会影响传感器长期稳定工作，而光照强度变化通常对水利水电工程传感器稳定工作影响不大。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907727", "t": 2, "q": "数字水利平台中，用于实现水利工程运行调度协同管理的功能模块有哪些？", "a": ["多部门权限管理模块", "调度指令下发与反馈模块", "实时数据共享模块", "调度方案模拟预演模块", "工程档案管理模块", ""], "r": "ABCD", "e": "为实现水利工程运行调度协同管理，需多部门协作，多部门权限管理能保障各部门合理操作；调度指令下发与反馈可确保调度指令有效传达和执行情况反馈；实时数据共享便于各部门掌握最新信息；调度方案模拟预演能提前评估方案效果，辅助决策。而工程档案管理模块主要用于工程档案存储管理，与运行调度协同管理关联不大。所以答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907728", "t": 2, "q": "水利水电工程智能监控系统中，采用PID调节算法可实现的控制功能有哪些？", "a": ["闸门开度的自动调节", "泵站流量的稳定控制", "水库水位的精准控制", "灌浆压力的实时调节", "电机转速的恒定控制", ""], "r": "ABCDE", "e": "PID调节算法可根据偏差进行比例、积分、微分运算来实现精准控制。水利水电工程里，闸门开度、泵站流量、水库水位、灌浆压力、电机转速都需要精准控制，PID算法适用于这些场景。答案：ABCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907729", "t": 2, "q": "智慧水利中，属于\"数字孪生\"技术特征的有哪些？", "a": ["物理实体与虚拟模型的动态映射", "数据驱动的模型迭代优化", "支持实时交互与闭环控制", "模型的几何形状完全一致", "融合多学科、多尺度数据", ""], "r": "ABCE", "e": "数字孪生是利用物理模型、传感器更新、运行历史等数据，集成多学科、多物理量、多尺度、多概率的仿真过程，在虚拟空间中完成映射，实现物理实体与虚拟模型动态映射、数据驱动模型迭代优化、支持实时交互与闭环控制等。而模型强调的是功能、性能等多方面映射，并非几何形状完全一致。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907730", "t": 2, "q": "水利工程的传感器数据采集系统中，数据预处理阶段需要完成的工作有哪些？", "a": ["数据去噪（如剔除异常值）", "数据格式转换", "数据的时空配准", "数据的存储备份", "数据的插值补全", ""], "r": "ABCE", "e": "数据预处理是对原始数据进行初步处理，以便后续分析。去噪、格式转换、时空配准、插值补全都是预处理中常见操作，可让数据更规范准确；而数据存储备份主要是数据管理环节，不属于预处理工作。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907731", "t": 2, "q": "数字水利平台中，水文模型的参数率定需要用到的观测数据有哪些？", "a": ["流域出口断面的实测流量数据", "流域内雨量站的实测降雨数据", "水库的实测水位数据", "河道的实测水面比降数据", "流域的土壤类型数据", ""], "r": "ABCD", "e": "数字水利平台中水文模型的参数率定主要依赖于实测的水文数据，这些数据用于验证和调整模型的准确性。A项，流域出口断面的实测流量数据是评估水文模型性能的关键指标，因此是必需的。B项，流域内雨量站的实测降雨数据对于模拟流域的水文过程至关重要，因为降雨是水文循环的主要驱动力之一。C项，水库的实测水位数据可以帮助验证模型对于水库水位变化的模拟效果。D项，河道的实测水面比降数据可以用于校准模型中的河道水流模拟部分。E项，流域的土壤类型数据虽然对水文过程有一定影响，但它更多的是作为模型参数的一部分，而不是直接用于参数率定的观测数据。综上所述，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907732", "t": 2, "q": "水利水电工程中，智能监控系统的故障诊断功能可通过哪些技术实现？", "a": ["基于故障树的诊断方法", "基于神经网络的故障识别", "基于专家系统的故障推理", "基于历史故障数据的统计分析", "基于设备外观的人工巡检", ""], "r": "ABCD", "e": "A、B、C、D 均为智能监控系统常用的故障诊断技术，能利用算法、数据等实现自动化故障诊断；E 是人工巡检方式，不属于智能监控系统的故障诊断技术。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907733", "t": 2, "q": "智慧水利系统的建设过程中，需要遵循的水利行业标准有哪些？", "a": ["《水利信息化术语》（SL/T 301-2013）", "《水利信息系统设计规范》（SL/T 267-2001）", "《水文数据通信规约》（SL 651-2014）", "《建筑信息模型应用统一标准》（GB/T 51210-2016）", "《水利工程测量规范》（SL 197-2013）", ""], "r": "ABCE", "e": "A、B、C、E选项均为水利行业标准，与智慧水利系统建设相关；D选项是建筑领域标准，并非水利行业标准。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907734", "t": 2, "q": "水利水电工程传感器安装时，需考虑的因素有（　）", "a": ["传感器的安装位置（如监测点代表性、便于维护）", "传感器与被测对象的接触方式（如粘贴、预埋、悬挂）", "传感器的防护措施（如防水、防腐蚀、防碰撞）", "传感器的接地方式（如单点接地、多点接地）", "传感器的品牌与价格", ""], "r": "ABCD", "e": "安装传感器要考虑安装位置确保监测有效且便于维护，接触方式要适配被测对象，防护措施保障传感器正常工作，接地方式影响其电气性能。而品牌与价格和安装本身无关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907735", "t": 2, "q": "智能监控系统在水利水电工程水环境监测中的应用包括（　）", "a": ["河流水体pH值、溶解氧浓度实时监测", "水体中重金属离子（如汞、镉）含量监测", "水库水体富营养化程度（如蓝藻浓度）监测", "水土流失面积与强度监测", "污水处理厂出水水质达标监测", ""], "r": "ABCE", "e": "智能监控系统用于水利水电工程水环境监测，主要针对水体相关指标。A、B、C选项都是对水体本身各项指标的监测；E选项污水处理厂出水与水利水电工程水环境相关。而D选项水土流失面积与强度监测不属于水环境监测内容。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907736", "t": 2, "q": "水利水电工程数据采集系统中，\"数据传输协议\"选择需考虑的因素有（　）", "a": ["数据传输量（如海量数据需低开销协议）", "通信网络类型（如有线、无线、光纤）", "数据实时性要求（如实时控制需低时延协议）", "数据安全性要求（如是否需加密传输）", "传感器的数量", ""], "r": "ABCD", "e": "数据传输协议选择要综合多方面，数据传输量影响协议开销，通信网络类型决定适配性，数据实时性要求对应时延，数据安全性要求涉及是否加密，而传感器数量与协议选择无直接关联。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907737", "t": 2, "q": "数字水利中，\"GIS技术\"在水利工程中的应用场景有（　）", "a": ["流域水文分区与水资源空间分布分析", "水利工程选址的地形地貌分析", "大坝坝体结构应力应变计算", "洪水淹没范围的动态模拟与可视化", "水利工程设施的空间分布管理（如闸门、泵站位置）", ""], "r": "ABDE", "e": "GIS技术具有空间分析、数据管理等功能，A选项可分析水资源空间分布；B选项能对地形地貌进行分析用于选址；D选项可实现洪水淹没范围动态模拟和可视化；E选项能对水利工程设施空间分布管理。而大坝坝体结构应力应变计算主要用专业力学分析软件，非GIS技术主要应用场景。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907738", "t": 2, "q": "水利水电工程智能监控系统的\"故障诊断\"功能，可诊断的故障类型有（　）", "a": ["传感器故障（如漂移、无输出）", "数据采集器故障（如通信中断、数据丢失）", "通信链路故障（如线缆断裂、信号中断）", "执行机构故障（如闸门启闭机卡阻、电机故障）", "水利工程本身的结构故障（如坝体裂缝、渗漏）", ""], "r": "ABCDE", "e": "水利水电工程智能监控系统故障诊断涵盖系统各部分及工程本身可能出现的故障。ABCD分别是传感、采集、通信、执行机构方面的故障，E是水利工程结构故障，这些都在可诊断范围内。答案：ABCDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907739", "t": 2, "q": "数字水利平台的\"用户层\"功能包括（　）", "a": ["为水利管理人员提供数据查询与报表生成服务", "为水利工程师提供模型模拟与分析工具", "为公众提供水利信息公开服务（如水资源状况）", "实现水利数据的采集与预处理", "实现水利工程的远程控制", ""], "r": "ABC", "e": "用户层主要是面向不同用户提供服务。A是面向水利管理人员的服务，B是针对水利工程师的工具，C是对公众的信息公开服务，都属于用户层功能；D是数据采集与预处理，属于数据层功能；E是水利工程控制，不属于用户层。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907740", "t": 2, "q": "水利水电工程中，采用\"无线传感器网络（WSN）\"进行数据采集的优势有（　）", "a": ["无需布线，适合复杂地形（如山区、库区）部署", "节点体积小、功耗低，可长期自主工作", "可实现大规模、分布式监测", "数据传输速率极高（可达1Gbps以上）", "网络拓扑灵活，节点故障可自动路由", ""], "r": "ABCE", "e": "WSN具有无需布线适复杂地形、节点体积小功耗低可长期自主工作、能大规模分布式监测、网络拓扑灵活可自动路由等优势，但数据传输速率并不高，达不到1Gbps以上。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637270865907741", "t": 2, "q": "智能监控系统在水利水电工程中的\"节能降耗\"应用包括（　）", "a": ["根据用水需求自动调节水泵机组的运行台数与转速", "根据光照强度自动调节水电站厂房照明系统", "根据电网负荷自动调节水轮发电机组的出力", "通过优化闸门调度减少水流能量损失", "通过监测数据优化混凝土养护方案，减少水资源浪费", ""], "r": "ABCDE", "e": "节能降耗就是通过各种手段降低能源消耗和资源浪费。A可按需调节水泵运行节能；B按光照调照明节能；C依电网负荷调机组出力节能；D优化闸门调度减少水流能量损失节能；E优化养护方案减少水资源浪费。答案：ABCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617344", "t": 3, "q": "智慧水利系统中，数字孪生模型的精度主要取决于模型的几何建模精度，与物理参数的匹配度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生模型精度既取决于几何建模精度，也与物理参数匹配度有关，物理参数匹配度会影响对真实系统物理特性的模拟，对模型精度很关键。", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617345", "t": 3, "q": "水利水电工程的智能监控系统中，振弦式渗压计的输出信号为频率信号，其频率变化量与渗压变化量呈线性关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "振弦式渗压计工作原理就是输出频率信号，且频率变化量和渗压变化量成线性关系，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617346", "t": 3, "q": "数字水利平台中，采用分布式水文模型进行洪水预报时，子流域的划分越小，预报精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "子流域划分并非越小越好，过小可能会使模型参数过多难以准确率定，还会增加计算量和数据需求，不一定能提高预报精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617347", "t": 3, "q": "水利工程中，智能监控系统的视频监控图像识别技术，可在无光照的夜间准确识别河道非法采砂行为。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "视频监控图像识别技术依赖光线获取清晰图像，无光照夜间难以获得清晰画面，也就很难准确识别河道非法采砂行为。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617348", "t": 3, "q": "智慧水利中的边缘计算节点，可独立完成水利工程的洪水预演功能，无需依赖云端数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "洪水预演功能复杂，涉及大量数据和复杂模型计算，边缘计算节点处理能力有限，需借助云端强大计算能力和丰富数据资源，不能独立完成。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617349", "t": 3, "q": "水利水电工程的传感器数据采集系统中，采样频率越高，采集到的数据越准确。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "采样频率需根据信号特性合理选择，过高可能增加成本、数据处理量等，并非越高采集的数据就越准确，还需考虑抗干扰等因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617350", "t": 3, "q": "数字水利中，水利工程BIM模型与GIS融合时，若二者坐标系不一致，可通过坐标转换参数实现统一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数字水利里，当水利工程BIM模型和GIS坐标系不同时，借助坐标转换参数能让它们的坐标系统一。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617351", "t": 3, "q": "水利水电工程的智能监控系统中，对大坝位移的监测，采用GNSS技术比采用测斜仪技术的测量范围更广。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GNSS 技术可实现大范围空间定位，能覆盖大坝较大区域进行位移监测；测斜仪一般用于测量特定测斜管内的倾斜变化，测量范围相对局限。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617352", "t": 3, "q": "智慧水利系统中，大数据分析技术可直接替代水文数值模型进行洪水预报。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据分析技术和水文数值模型各有优势和局限，大数据分析虽能处理海量数据挖掘规律，但水文数值模型基于物理原理对洪水形成等过程模拟更精准，二者不能相互替代。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617353", "t": 3, "q": "水利工程的传感器网络中，LoRa通信技术的传输速率高于4G通信技术，适合传输大量视频数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "LoRa通信技术传输速率低于4G通信技术，且不适合传输大量视频数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617354", "t": 3, "q": "数字水利平台中，水文数据的质量控制应在数据采集完成后统一进行，无需实时处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水文数据实时性要求高，在采集过程中可能出现错误或异常，若不实时处理，错误数据进入系统会影响后续分析和决策，所以应实时处理，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617355", "t": 3, "q": "水利水电工程中，智能灌浆监控系统可根据浆液扩散半径的实时监测结果，自动调整灌浆压力和流量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "智能灌浆监控系统具备实时获取浆液扩散等数据的能力，并能够依据这些数据自动调整灌浆压力和流量，以保证灌浆效果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617356", "t": 3, "q": "智慧水利中，数字孪生流域的虚拟模型一旦构建完成，无需后续更新即可长期使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现实中的流域情况是动态变化的，如地形地貌、水文状况等会随时间改变，所以数字孪生流域的虚拟模型需要根据实际情况不断更新才能准确反映现实，不能构建完成后就长期不更新。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617357", "t": 3, "q": "水利水电工程的智能监控系统中，电机的过载保护仅需监测电机的工作电流，无需监测其他参数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电机过载时除电流变化外，温度等参数也会改变，仅监测工作电流不能全面实现过载保护。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617358", "t": 3, "q": "数字水利中，采用轻量化处理后的水利工程BIM模型，其几何信息和属性信息会有部分丢失，但不影响主要功能使用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轻量化处理是为在保证模型主要功能和关键信息前提下，减少数据量以提升性能，会有部分非关键的几何和属性信息丢失，不影响主要功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617359", "t": 3, "q": "水利工程的智能监控系统中，预警阈值设置为固定值即可，无需根据季节或水文条件动态调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不同季节和水文条件下，水利工程面临的情况不同，固定的预警阈值无法适应变化，需动态调整以确保监控系统准确预警。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617360", "t": 3, "q": "智慧水利系统中，物联网传感器的供电方式仅能采用有线供电，无法实现无线供电。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利系统中，物联网传感器供电方式多样，除了有线供电，也可实现无线供电，如利用太阳能板、电池等方式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617361", "t": 3, "q": "数字水利平台中，流域水资源优化配置模型的目标函数仅需考虑水资源利用效率最大化，无需考虑生态保护。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流域水资源优化配置不仅要考虑水资源利用效率最大化，生态保护也是重要考量因素，需实现水资源合理分配以维持生态平衡。", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617362", "t": 3, "q": "水利水电工程中，采用超声波测深仪测量水库淤积量时，无需考虑水体浑浊度的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617363", "t": 3, "q": "智慧水利系统中，数据加密技术仅需应用于数据传输环节，数据存储环节无需加密。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利系统里，数据在传输和存储环节都面临安全风险，都需要数据加密技术来保障数据安全，并非仅在传输环节应用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617364", "t": 3, "q": "数字水利中，水文预报模型的预见期越长，预报精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般来说，水文预报模型预见期越长，不确定因素越多，预报精度往往越低，而非越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617365", "t": 3, "q": "水利工程的智能监控系统中，闸门开度的测量采用增量式编码器比采用绝对值编码器更适合长期无人值守场景。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "绝对值编码器能直接输出对应位置的绝对编码，掉电后位置信息不会丢失；增量式编码器需通过计数累计来确定位置，掉电后计数丢失需重新初始化。长期无人值守场景要求设备能准确记录位置，绝对值编码器更合适。", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617366", "t": 3, "q": "智慧水利中，通过分析水利工程的运行数据，人工智能技术可提前预测设备的潜在故障，实现预防性维护。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "智慧水利借助人工智能技术对水利工程运行数据进行分析，能挖掘数据规律和特征，从而提前发现设备潜在故障隐患以开展预防性维护。", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617367", "t": 3, "q": "水利水电工程的传感器数据采集系统中，采用RS485总线通信比采用以太网通信的抗干扰能力更强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RS485采用差分传输方式，能有效抑制共模干扰，且传输线通常为双绞线，本身抗干扰能力较好；以太网通信在传输过程中易受外界电磁干扰。所以RS485总线通信抗干扰能力更强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617368", "t": 3, "q": "数字水利平台中，水利工程的三维可视化展示仅需依赖BIM模型，无需结合GIS空间信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利平台里，水利工程三维可视化展示仅靠BIM模型不够，还需结合GIS空间信息，GIS能提供地理空间数据，让展示更贴合实际地理环境。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617369", "t": 3, "q": "水利工程的智能监控系统中，对泵站流量的控制，采用模糊控制算法比采用PID控制算法的控制精度更高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PID控制算法结构简单、稳定性好、可靠性高，能实现精确的控制，在工业控制等领域广泛应用，对于泵站流量这种相对明确控制目标的场景，PID控制算法通常能达到较高精度。而模糊控制算法适用于难以建立精确数学模型的复杂系统，控制精度一般不如PID控制算法。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617370", "t": 3, "q": "智慧水利系统中，流域内各水利工程的监控数据必须全部传输至云端进行处理，无法在本地处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利系统中，并非所有监控数据都必须传至云端处理，部分数据可在本地处理，以提高效率、减少传输压力等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617371", "t": 3, "q": "水利水电工程中，振弦式土压力传感器的测量精度不受温度变化的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "振弦式土压力传感器的测量精度会受温度变化影响，因为温度变化会使振弦的弹性模量、长度等参数改变，进而影响测量结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617372", "t": 3, "q": "数字水利中，对历史水文数据的挖掘分析，可用于优化水文预报模型的参数，提高预报精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "历史水文数据包含着丰富信息，对其挖掘分析能让我们更了解水文规律，从而合理调整水文预报模型参数，进而提高预报精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617373", "t": 3, "q": "水利工程的智能监控系统中，预警信息的推送方式仅能采用短信通知，无法通过其他方式推送。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程智能监控系统预警信息推送方式多样，不只是短信通知，还可通过APP、邮件、语音等方式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617374", "t": 3, "q": "智慧水利中，数字孪生技术可实现水利工程建设过程的可视化模拟，但无法模拟工程运行后的老化过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生技术能对物理实体进行全面、多维度的映射，在智慧水利里，既可以实现水利工程建设过程的可视化模拟，也能够模拟工程运行后的老化等各种过程。", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617375", "t": 3, "q": "水利水电工程的传感器网络中，传感器的安装位置对测量数据的准确性无影响，仅需考虑信号传输方便。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "传感器安装位置会极大影响测量数据准确性，不能仅考虑信号传输方便。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617376", "t": 3, "q": "数字水利平台中，采用WebGIS技术可实现水利工程数据的在线查询和空间分析，无需安装专用客户端。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "WebGIS是利用互联网技术来扩展和完善地理信息系统功能，能让用户通过网络在浏览器端在线访问和操作地理空间数据，无需安装专用客户端，结合水利工程数据，可实现其在线查询和空间分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617377", "t": 3, "q": "水利工程的智能监控系统中，数据采集终端（RTU）的供电电压必须为220V交流电压，无法采用直流供电。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据采集终端（RTU）供电方式多样，既可以用220V交流电压，也能采用直流供电。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617378", "t": 3, "q": "智慧水利系统中，大数据技术处理水利数据时，数据量越大，处理结果的可靠性越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据处理虽能从大量数据中挖掘有价值信息，但数据量增大可能伴随大量噪声和错误数据，还会面临处理能力和效率等问题，并非数据量越大结果可靠性就越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617379", "t": 3, "q": "水利水电工程中，智能监控系统对水库水位的监测，采用静压式水位传感器比采用浮子式水位传感器的测量精度更高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "静压式水位传感器受外界因素干扰小，能更精准测量水位，相比浮子式水位传感器测量精度更高。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617380", "t": 3, "q": "数字水利中，水利工程BIM模型的属性信息仅包含几何尺寸信息，不包含材料性能、施工记录等非几何信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程BIM模型的属性信息不仅包含几何尺寸信息，还包含材料性能、施工记录等非几何信息。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617381", "t": 3, "q": "水利工程的智能监控系统中，对灌浆过程的质量评估，仅需监测灌浆压力和流量，无需监测浆液结石率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "灌浆过程质量评估需综合多方面因素，浆液结石率反映了浆液固化后的结石情况，对评估灌浆质量很重要，不能仅靠监测灌浆压力和流量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617382", "t": 3, "q": "智慧水利中，通过遥感技术获取的流域植被覆盖度数据，可用于修正水文模型中的蒸散发计算参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流域植被覆盖度会影响蒸散发，遥感技术能获取该数据，此数据可用于修正水文模型里蒸散发计算参数。", "ap": [false, false, false, false, false, false]}, {"id": "2035637273730617383", "t": 3, "q": "水利水电工程的传感器数据采集系统中，数据的传输延迟对水利工程的实时控制无影响，仅影响数据的后续分析。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据传输延迟可能使实时控制所依据的信息滞后，导致控制决策不准确，影响水利工程实时控制，并非仅影响后续分析。", "ap": [false, false, false, false, false, false]}]}, {"k": "第3章 智慧水利和数字水利技术||第5节 水库兴利调度与洪水调度（1）", "n": "第3章 智慧水利和数字水利技术 / 第5节 水库兴利调度与洪水调度（1）", "qs": [{"id": "2035637278843473920", "t": 1, "q": "在智慧水利体系中，数字孪生流域能够实现\"预报-预警-预演-预案\"闭环管理，其核心支撑技术不包括以下哪项？", "a": ["高分辨率水文水动力数值模拟技术", "海量多源异构水利数据融合处理技术", "传统人工水位观测与纸质记录技术", "流域地理信息系统（GIS）与遥感（RS）集成技术", "", ""], "r": "C", "e": "智慧水利的数字孪生流域核心支撑技术应是先进的信息技术，传统人工水位观测与纸质记录技术落后且无法满足“预报 - 预警 - 预演 - 预案”闭环管理需求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473921", "t": 1, "q": "在数字孪生流域构建中，用于实现流域物理实体与数字模型动态映射的核心技术是（　）", "a": ["大数据存储技术", "实时数据同化技术", "遥感影像处理技术", "地理信息系统技术", "", ""], "r": "B", "e": "实时数据同化技术可将流域物理实体的实时数据与数字模型相结合，实现两者动态映射。而大数据存储技术主要是存储数据；遥感影像处理技术侧重于处理遥感影像；地理信息系统技术用于地理数据的分析等。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473922", "t": 1, "q": "水库兴利调度中，当计算设计枯水年的调节流量时，若水库死水位已定，调节流量与下列哪项参数的关系呈负相关（　）", "a": ["设计枯水年的来水量", "水库兴利库容", "调节周期", "灌区灌溉保证率", "", ""], "r": "C", "e": "调节流量与调节周期呈负相关，调节周期越长，在一定来水和库容情况下，调节流量越小。来水量多调节流量大，兴利库容大调节流量大，灌溉保证率与调节流量无直接负相关关系。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473923", "t": 1, "q": "智慧水利系统中，用于监测河道水流流速并能实现数据实时传输的设备是（　）", "a": ["超声波水位计", "多普勒流速仪", "雨量筒", "水质传感器", "", ""], "r": "B", "e": "多普勒流速仪可测河道水流流速且能实时传输数据；超声波水位计测水位，雨量筒测降雨量，水质传感器测水质，均不符题意。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473924", "t": 1, "q": "水库洪水调度中，\"防洪高水位\"是指（　）", "a": ["水库在正常运用情况下，遭遇设计洪水时达到的最高水位", "水库在正常运用情况下，遭遇校核洪水时达到的最高水位", "水库在正常运用情况下，为满足下游防洪要求，遭遇下游防护对象的设计洪水时，水库达到的最高水位", "水库在汛期允许兴利蓄水的上限水位", "", ""], "r": "C", "e": "防洪高水位是在正常运用时，为满足下游防洪要求，遇下游防护对象的设计洪水时水库达到的最高水位。A是设计洪水位；B是校核洪水位；D是汛限水位。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473925", "t": 1, "q": "数字水利中，BIM技术在水利工程施工阶段的核心应用是（　）", "a": ["流域水文模拟", "工程进度与成本协同管控", "洪水风险地图绘制", "水资源供需平衡分析", "", ""], "r": "B", "e": "BIM 技术在水利施工阶段可实现工程进度与成本协同管控，A、C、D选项并非施工阶段核心应用。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473926", "t": 1, "q": "水库兴利调度采用\"年调节\"方式时，其调节周期内的来水量与用水量的平衡计算，需重点考虑的时段是（　）", "a": ["丰水期", "平水期", "枯水期", "汛前期", "", ""], "r": "C", "e": "年调节是对一年内的径流进行调节，枯水期水量少，用水需求可能无法靠当期来水满足，需依靠丰水期蓄水，所以平衡计算重点考虑枯水期。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473927", "t": 1, "q": "智慧水利中的\"数字流域\"平台，其数据处理流程的正确顺序是（　）", "a": ["数据采集→数据存储→数据预处理→数据分析→数据应用", "数据采集→数据预处理→数据存储→数据分析→数据应用", "数据预处理→数据采集→数据存储→数据分析→数据应用", "数据采集→数据存储→数据分析→数据预处理→数据应用", "", ""], "r": "B", "e": "应先采集数据，采集后要进行预处理以保证数据质量，再存储起来，之后进行分析挖掘价值，最后应用数据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473928", "t": 1, "q": "水库洪水调度中，当水库遭遇超标准洪水时，应首先采用的调度措施是（　）", "a": ["加大泄洪流量，降低水库水位", "启用非常溢洪道", "关闭所有泄洪建筑物，保住水库大坝", "通知下游地区紧急转移", "", ""], "r": "D", "e": "当水库遭遇超标准洪水，下游民众生命和财产安全是首要考虑的。通知下游地区紧急转移能最大程度保障人员安全。A加大泄洪流量可能加剧下游洪水风险；B启用非常溢洪道有严格程序和条件，不是首先措施；C关闭泄洪建筑物可能导致水库水位过高，威胁大坝安全。所以选D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473929", "t": 1, "q": "在数字水利技术中，用于分析流域水资源时空分布特征的核心模型是（　）", "a": ["水库调洪演算模型", "分布式水文模型", "水利工程结构力学模型", "水质迁移扩散模型", "", ""], "r": "B", "e": "分布式水文模型能考虑流域下垫面空间分布不均匀性，可用于分析流域水资源时空分布特征。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473930", "t": 1, "q": "水库兴利调度中，\"灌溉保证率\"是指（　）", "a": ["灌区在某一时期内实际灌溉面积与设计灌溉面积的比值", "灌区在长期运行中，满足灌溉用水需求的年数与总年数的比值", "灌区在灌溉期内，实际供水量与需水量的比值", "灌区在一次灌溉过程中，实际灌溉定额与设计灌溉定额的比值", "", ""], "r": "B", "e": "灌溉保证率是衡量灌区用水保证程度的指标，指在长期运行中满足灌溉用水需求年数和总年数之比。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473931", "t": 1, "q": "智慧水利系统中，边缘计算技术的主要作用是（　）", "a": ["实现流域大范围数据的集中存储", "在数据采集端就近处理实时数据，减少数据传输延迟", "构建数字孪生流域的三维可视化模型", "分析历史水文数据，预测未来水资源变化趋势", "", ""], "r": "B", "e": "边缘计算特点是在靠近数据源头的边缘侧处理数据。A选项集中存储不是其主要作用；C选项构建三维可视化模型与边缘计算无关；D选项分析历史数据预测未来趋势不是边缘计算主要功能。边缘计算可在数据采集端就近处理实时数据，减少传输延迟。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473932", "t": 1, "q": "水库洪水调度中，调洪演算的关键参数\"入库流量过程线\"是通过（　）获得的", "a": ["水库水位观测数据反推", "流域水文预报模型计算", "下游河道流量观测数据推算", "水库泄洪建筑物的泄流能力计算", "", ""], "r": "B", "e": "流域水文预报模型可根据流域的降雨等情况计算出入库流量过程线。水库水位观测数据反推难以得到全面的入库流量过程；下游河道流量与入库流量有差异且推算较复杂不准确；水库泄洪建筑物泄流能力与入库流量过程线获取无关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473933", "t": 1, "q": "数字水利中，遥感技术在水资源监测中的主要应用是（　）", "a": ["测量水库水位的实时变化", "监测流域内土壤含水量和水体面积变化", "计算河道水流的瞬时流速", "采集水利工程的结构变形数据", "", ""], "r": "B", "e": "遥感技术可获取大面积地理信息。水库水位实时变化、河道水流瞬时流速及水利工程结构变形数据，遥感较难精准获取。而它能监测大范围的流域内土壤含水量和水体面积变化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473934", "t": 1, "q": "水库兴利调度中，当水库兴利库容不变，若灌区灌溉面积扩大，则设计枯水年的灌溉保证率将（　）", "a": ["升高", "降低", "不变", "无法确定", "", ""], "r": "B", "e": "兴利库容不变时，灌区灌溉面积扩大，用水需求增加，在设计枯水年可满足用水的概率就会降低，即灌溉保证率降低。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473935", "t": 1, "q": "智慧水利中的\"水利大数据平台\"，其数据清洗环节主要解决的问题是（　）", "a": ["数据格式不统一和数据缺失、异常值", "数据存储容量不足", "数据传输带宽不够", "数据可视化效果差", "", ""], "r": "A", "e": "数据清洗是对原始数据进行处理，使其更准确、完整、一致，主要解决数据格式不统一、数据缺失、存在异常值等问题。而存储容量、传输带宽、可视化效果并非数据清洗环节主要解决的。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473936", "t": 1, "q": "水库洪水调度中，\"汛期限制水位\"的确定主要考虑的因素是（　）", "a": ["水库大坝的设计洪水位", "下游地区的防洪标准和水库的防洪库容", "水库兴利蓄水的最大需求", "水库死水位和兴利库容的大小", "", ""], "r": "B", "e": "汛期限制水位要兼顾下游防洪和水库自身调洪，需依据下游防洪标准及水库防洪库容来确定。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473937", "t": 1, "q": "数字孪生水利工程中，用于模拟工程结构在洪水作用下受力变形的核心技术是（　）", "a": ["水文水力学模拟技术", "结构动力学模拟技术", "机器学习预测技术", "地理信息空间分析技术", "", ""], "r": "B", "e": "要模拟工程结构在洪水作用下受力变形，需运用结构动力学模拟技术来分析结构受力与变形情况。水文水力学模拟技术侧重水流运动等水文相关模拟；机器学习预测技术用于数据预测；地理信息空间分析技术主要处理地理空间数据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473938", "t": 1, "q": "水库兴利调度采用\"补偿调节\"方式时，其核心原则是（　）", "a": ["上游水库泄水补充下游水库的缺水", "下游水库根据上游水库的来水情况调整自身调度", "水库根据灌区实际需水情况动态调整供水量", "相邻水库联合调度，相互补偿来水的不均匀性", "", ""], "r": "D", "e": "补偿调节是相邻水库联合调度，相互补偿来水不均匀性，以提高水资源利用效率和整体效益。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473939", "t": 1, "q": "智慧水利系统中，物联网网关的主要功能是（　）", "a": ["采集各类传感器的原始数据", "实现不同协议传感器数据的转换与传输", "存储海量的水利监测数据", "分析监测数据并生成调度建议", "", ""], "r": "B", "e": "物联网网关主要作用是在不同协议设备间进行数据转换和传输，让不同协议的传感器数据能在系统中流通。A选项采集原始数据是传感器功能；C选项存储数据靠存储设备；D选项分析数据生成建议是数据分析系统功能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473940", "t": 1, "q": "水库洪水调度中，当入库流量小于出库流量时，水库水位将（　）", "a": ["上升", "下降", "不变", "先上升后下降", "", ""], "r": "B", "e": "入库流量小于出库流量，意味着水库流出的水比流入的多，水位会下降。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473941", "t": 1, "q": "数字水利中，用于评估水利工程对流域生态环境影响的模型是（　）", "a": ["水库调洪演算模型", "水资源配置模型", "生态水文模型", "水文气象预报模型", "", ""], "r": "C", "e": "生态水文模型可综合考虑水文过程与生态系统相互作用，能用于评估水利工程对流域生态环境的影响。而水库调洪演算模型主要用于水库调洪计算；水资源配置模型侧重水资源分配；水文气象预报模型用于水文气象预测。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473942", "t": 1, "q": "水库兴利调度中，\"死水位\"的确定不需要考虑的因素是（　）", "a": ["水库泥沙淤积情况", "水库下游河道的最小生态流量", "水库取水建筑物的安装高程", "水库设计洪水位", "", ""], "r": "D", "e": "死水位确定需考虑泥沙淤积、下游最小生态流量、取水建筑物安装高程等。设计洪水位是与防洪相关，和死水位确定无关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473943", "t": 1, "q": "智慧水利中的\"智能调度系统\"，其决策支持功能主要依赖于（　）", "a": ["历史水文数据的简单统计", "基于规则和模型的多目标优化算法", "人工经验的手动输入", "单一水文模型的预测结果", "", ""], "r": "B", "e": "智能调度系统的决策支持需综合考虑多方面因素并实现多目标优化，基于规则和模型的多目标优化算法能满足这一需求。历史简单统计、人工经验手动输入和单一水文模型预测都有局限性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473944", "t": 1, "q": "水库洪水调度中，\"校核洪水位\"对应的洪水标准是（　）", "a": ["50年一遇", "100年一遇", "200年一遇", "根据大坝等级和规范确定的超设计标准洪水", "", ""], "r": "D", "e": "校核洪水位是水库遇到大坝的校核标准洪水时，在坝前达到的最高水位，该标准洪水是根据大坝等级和规范确定的超设计标准洪水。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473945", "t": 1, "q": "数字水利中，大数据技术在水文预报中的主要作用是（　）", "a": ["减少水文站的数量", "整合多源数据（降水、水位、遥感等）提高预报精度", "直接控制水库的泄洪设施", "替代传统的水文模型", "", ""], "r": "B", "e": "大数据技术可整合降水、水位、遥感等多源数据，为水文预报提供更全面准确信息，从而提高预报精度。A选项减少水文站数量并非大数据在水文预报主要作用；C选项大数据不能直接控制泄洪设施；D选项大数据不能替代传统水文模型。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473946", "t": 1, "q": "水库兴利调度中，当采用\"概率法\"计算设计枯水年时，其核心是基于（　）", "a": ["历史水文数据的排序分析", "水文现象的随机特性，计算不同保证率下的来水过程", "流域下垫面条件的变化趋势", "气象预报数据的短期预测", "", ""], "r": "B", "e": "概率法计算设计枯水年是利用水文现象随机特性，算出不同保证率下的来水过程。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473947", "t": 1, "q": "智慧水利系统中，用于实现水利工程远程监控和控制的技术是（　）", "a": ["大数据分析技术", "远程监控与控制系统（SCADA）", "数字孪生技术", "遥感技术", "", ""], "r": "B", "e": "远程监控与控制系统（SCADA）能对水利工程进行远程监控和控制。大数据分析技术侧重数据处理分析；数字孪生技术是创建虚拟模型；遥感技术主要用于获取地理信息。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473948", "t": 1, "q": "水库洪水调度中，\"泄洪能力\"是指泄洪建筑物在某一水位下的（　）", "a": ["最大泄流量", "最小泄流量", "平均泄流量", "设计泄流量", "", ""], "r": "A", "e": "泄洪能力指的是泄洪建筑物在某一水位下能达到的最大泄流规模。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473949", "t": 1, "q": "数字水利中，地理信息系统（GIS）在水库调度中的主要应用是（　）", "a": ["计算水库的兴利库容", "可视化展示水库流域的空间分布信息（如淹没范围、水文站点）", "预测水库入库流量", "控制水库闸门的启闭", "", ""], "r": "B", "e": "GIS主要功能是对地理空间数据进行采集、存储、分析和可视化展示。选项B符合其在水库调度中可视化展示水库流域空间分布信息的应用。A计算兴利库容主要依靠专业水利计算方法；C预测入库流量多借助水文模型等；D控制水库闸门启闭是自动化控制系统的功能。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475264", "t": 2, "q": "数字孪生流域构建过程中，需要整合的关键技术体系包括以下哪些？", "a": ["水文水动力数值模拟技术", "多源水利数据融合与管理技术", "流域空间信息建模技术", "传统人工巡堤查险技术", "智能决策支持技术", ""], "r": "ABCE", "e": "数字孪生流域构建依靠先进技术，A水文水动力数值模拟、B多源水利数据融合与管理、C流域空间信息建模、E智能决策支持技术都是关键技术；而D传统人工巡堤查险技术不属于数字孪生流域构建所需整合的关键技术体系。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475265", "t": 2, "q"
