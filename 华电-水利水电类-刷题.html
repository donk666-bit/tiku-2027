: "水库兴利调度中，影响水库供水能力的主要因素包括以下哪些？", "a": ["水库兴利库容大小", "水库多年平均来水量", "水库下游河道安全泄量", "水库供水对象的用水需求", "水库死水位设定", ""], "r": "ABDE", "e": "兴利库容大、多年平均来水量多、死水位设定合理利于提升供水能力；供水对象用水需求影响供水能力的衡量；而下游河道安全泄量主要与防洪有关，和供水能力无直接关联。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475266", "t": 2, "q": "智慧水利中，\"预报-预警-预演-预案\"闭环管理体系的核心构成部分包括以下哪些？", "a": ["实时水情工情监测系统", "洪水预报模型", "洪水预警信息发布平台", "水库人工泄洪操作记录", "应急处置预案库", ""], "r": "ABCE", "e": "“预报 - 预警 - 预演 - 预案”闭环管理体系需能实现水情监测、预报、预警发布及制定预案等功能。A可提供实时数据用于后续环节；B用于做出洪水预报；C负责预警信息发布；E是预案的集合。而D只是操作记录，并非核心构成部分。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475267", "t": 2, "q": "数字水利技术中，物联网（IoT）在水利工程安全监测中的应用场景包括以下哪些？", "a": ["坝体沉降与位移监测", "闸门运行状态监测", "水库水质指标实时监测", "水利工程图纸档案管理", "泵站机组振动与温度监测", ""], "r": "ABCE", "e": "物联网可实现物物相连、信息实时采集与传输。A坝体沉降与位移、B闸门运行状态、C水库水质指标、E泵站机组振动与温度都可通过传感器等物联网设备进行实时监测。而D水利工程图纸档案管理主要是文档管理工作，与物联网在监测方面的应用无关。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475268", "t": 2, "q": "水库洪水调度中，确定水库泄洪方案时需要考虑的因素包括以下哪些？", "a": ["入库洪水的洪峰流量与过程", "水库当前水位与防洪库容", "下游河道安全泄量", "水库兴利库容大小", "下游保护区的人口与资产分布", ""], "r": "ABCE", "e": "确定水库泄洪方案要结合入库洪水情况、水库自身蓄水和库容情况、下游河道安全承载能力以及下游保护区域情况。兴利库容与泄洪方案无直接关联。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475269", "t": 2, "q": "智慧水利平台中，水利大数据的主要来源包括以下哪些？", "a": ["水文站、雨量站监测数据", "遥感（RS）与地理信息（GIS）数据", "水利工程运行管理数据", "纸质版历史洪水记录", "用水户用水计量数据", ""], "r": "ABCE", "e": "水文站、雨量站监测数据能反映实时水文情况；遥感与地理信息数据有助于全面了解水利相关地理信息；水利工程运行管理数据对工程状态及决策有重要意义；用水户用水计量数据可用于水资源管理。而纸质版历史洪水记录较难直接融入智慧水利平台成为大数据来源。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475270", "t": 2, "q": "水库兴利调度中，水电站发电调度需要协调的因素包括以下哪些？", "a": ["水库来水量", "电网负荷需求", "下游灌溉用水需求", "水库防洪限制水位", "水电站机组装机容量", ""], "r": "ABCE", "e": "发电调度要考虑有多少水（水库来水量）能发电；得根据电网需要供电（电网负荷需求）；下游灌溉用水会影响出库流量从而影响发电；同时发电受机组能承载能力（水电站机组装机容量）制约。而防洪限制水位主要用于防洪调度。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475271", "t": 2, "q": "数字孪生水闸的核心功能包括以下哪些？", "a": ["水闸运行状态实时模拟", "水闸过流能力计算与预测", "水闸设备故障诊断与预警", "水闸建设过程的人工监理记录", "水闸应急调度方案预演", ""], "r": "ABCE", "e": "数字孪生水闸主要是利用数字化技术对水闸进行模拟、分析和管理等。A可实时模拟运行状态；B能进行过流能力计算预测；C可诊断预警设备故障；E能预演应急调度方案。而D人工监理记录不属于数字孪生核心功能。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475272", "t": 2, "q": "水库洪水调度中，调洪演算常用的方法包括以下哪些？", "a": ["水量平衡法", "马斯京根法", "有限差分法", "经验公式法", "单位线法", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475273", "t": 2, "q": "智慧水利中，人工智能（AI）技术的应用场景包括以下哪些？", "a": ["洪水预报模型参数优化", "水利工程缺陷图像识别", "水资源供需平衡分析", "人工水位观测数据录入", "水库调度方案智能生成", ""], "r": "ABCE", "e": "AI技术可用于优化洪水预报模型参数、识别水利工程缺陷图像、进行水资源供需平衡分析以及智能生成水库调度方案。而人工水位观测数据录入是简单人工操作，并非AI应用场景。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475274", "t": 2, "q": "水库兴利调度中，计算水库蒸发损失时需要用到的参数包括以下哪些？", "a": ["水库水面面积", "水库所在地的蒸发皿蒸发量", "蒸发系数", "水库入库流量", "水库蓄水深度", ""], "r": "ABC", "e": "水库蒸发损失计算与水库水面面积、蒸发皿蒸发量、蒸发系数有关，水库入库流量和蓄水深度与蒸发损失计算无直接关联。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475275", "t": 2, "q": "智慧水利中，数字孪生流域的核心组成部分包括（　）", "a": ["物理流域实体", "数字孪生模型", "实时数据感知网络", "数据同化与交互平台", "流域水文预报模型", ""], "r": "ABCD", "e": "数字孪生流域核心由物理流域实体、数字孪生模型、实时数据感知网络、数据同化与交互平台构成。E选项流域水文预报模型只是其中部分内容并非核心组成。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475276", "t": 2, "q": "水库兴利调度中，影响年调节水库调节流量的主要因素有（　）", "a": ["设计枯水年的来水量", "水库兴利库容", "调节周期", "用水部门的需水过程", "水库死水位", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475277", "t": 2, "q": "数字水利技术中，用于水利数据实时采集的设备有（　）", "a": ["多普勒流速仪", "超声波水位计", "水质传感器", "边缘计算网关", "雨量自动记录仪", ""], "r": "ABCE", "e": "A、B、C、E选项都是用于直接采集水利相关实时数据的设备，多普勒流速仪测流速，超声波水位计测水位，水质传感器测水质，雨量自动记录仪测雨量；而边缘计算网关主要起数据处理和传输等作用，并非用于实时数据采集。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475278", "t": 2, "q": "水库洪水调度中，确定防洪库容需要考虑的因素有（　）", "a": ["设计洪水的洪峰流量", "设计洪水的洪量", "下游防护对象的防洪标准", "泄洪建筑物的泄洪能力", "水库的兴利库容", ""], "r": "ABCD", "e": "防洪库容确定要结合设计洪水情况（洪峰流量、洪量）、下游防护标准及泄洪建筑物泄洪能力。兴利库容与防洪库容确定无直接关联。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475279", "t": 2, "q": "智慧水利系统中，大数据技术的应用场景包括（　）", "a": ["水文数据的清洗与融合", "流域水资源供需平衡分析", "水库调度方案的多目标优化", "水利工程安全隐患的预测", "实时数据的边缘计算处理", ""], "r": "ABCD", "e": "大数据技术可用于处理、分析和挖掘数据以辅助决策等，A选项水文数据清洗融合、B选项流域水资源供需平衡分析、C选项水库调度方案多目标优化、D选项水利工程安全隐患预测都需大数据技术处理大量相关数据来实现；而E选项边缘计算处理实时数据主要是边缘计算技术的应用，并非大数据技术典型场景。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475280", "t": 2, "q": "水库兴利调度中，\"补偿调节\"的适用条件包括（　）", "a": ["水库群之间存在水力联系（如上下游）", "各水库的来水过程存在差异", "用水部门的需水具有统一性", "单一水库无法满足用水保证率", "水库具有相同的调节周期", ""], "r": "ABCD", "e": "补偿调节需水库群有联系、来水有差异，单一水库难满足用水保证率时才可行，且用水有统一要求。答案：ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475281", "t": 2, "q": "数字水利中，BIM技术在水利工程全生命周期中的应用包括（　）", "a": ["工程规划阶段的方案比选", "施工阶段的进度与成本管控", "运行阶段的设备维护管理", "退役阶段的拆除方案优化", "流域水文模拟与预报", ""], "r": "ABCD", "e": "BIM技术可用于水利工程全生命周期各阶段，ABCD分别对应规划、施工、运行、退役阶段应用，而流域水文模拟与预报并非BIM技术在水利工程全生命周期中的典型应用。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475282", "t": 2, "q": "水库洪水调度中，调洪演算的基本假设包括（　）", "a": ["入库流量过程线已知且不变", "泄流建筑物的泄流能力仅与水库水位有关", "水库内水流为恒定流", "水库容积与水位的关系已知（库容曲线）", "出库流量等于泄洪流量（无其他用水）", ""], "r": "ABDE", "e": "调洪演算需已知入库流量过程，泄流能力和水位相关，要利用库容曲线，出库仅为泄洪流量，且假设水库内水流为渐变流而非恒定流。答案：ABDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475283", "t": 2, "q": "智慧水利中，物联网技术在水利监测中的优势包括（　）", "a": ["实现多节点数据的实时采集与传输", "降低监测设备的安装成本", "提高数据采集的自动化程度", "支持偏远地区的无线监测", "减少数据传输中的误差", ""], "r": "ACDE", "e": "物联网技术可连接众多节点，能实时采集和传输数据，提高自动化程度，还支持偏远地区无线监测，且能减少数据传输误差。而安装成本与物联网技术本身关联不大。所以答案选ACDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475284", "t": 2, "q": "水库兴利调度中，灌溉用水的计算参数包括（　）", "a": ["灌溉面积", "灌溉定额", "灌溉保证率", "灌溉周期", "灌区土壤含水量", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475285", "t": 2, "q": "数字水利中，分布式水文模型的主要特点包括（　）", "a": ["考虑流域下垫面的空间异质性（如地形、植被）", "基于物理机制构建，模拟精度高", "可模拟流域内各子单元的水文过程", "对输入数据的需求量小", "适用于大尺度流域的水文模拟", ""], "r": "ABCE", "e": "分布式水文模型考虑下垫面空间异质性，基于物理机制构建，能模拟各子单元水文过程，适用于大尺度流域，但对输入数据需求大。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475286", "t": 2, "q": "水库洪水调度中，汛期水库调度的基本原则包括（　）", "a": ["安全第一，优先保障大坝安全", "兼顾下游防洪与水库兴利", "按照设计标准控制水库水位", "根据实时洪水情况动态调整泄洪方案", "优先满足水库兴利蓄水需求", ""], "r": "ABCD", "e": "汛期水库调度要保障大坝安全，兼顾防洪与兴利，按设计标准控水位，还需依实时洪水调整泄洪方案，不能优先只满足兴利蓄水。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475287", "t": 2, "q": "智慧水利系统中，数据安全保障措施包括（　）", "a": ["数据加密传输与存储", "访问权限分级管控", "数据备份与灾难恢复", "实时数据监测与异常报警", "采用公开的通信协议", ""], "r": "ABCD", "e": "数据安全保障需从多方面入手，加密传输存储、权限管控、数据备份恢复、实时监测报警都能提升数据安全性。而公开通信协议易造成数据泄露，不利于安全保障。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475288", "t": 2, "q": "水库兴利调度中，确定死水位的主要依据有（　）", "a": ["水库泥沙淤积的预测量", "水库下游河道的最小生态流量要求", "水库取水建筑物的最低取水高程", "水库冬季结冰对水位的影响", "水库兴利库容的大小", ""], "r": "ABCD", "e": "答案：ABCD死水位是指水库在正常运用情况下，允许消落的最低水位。确定死水位的主要依据包括：水库泥沙淤积的预测量（A），因为要考虑淤积对水库库容的影响；水库下游河道的最小生态流量要求（B），以确保下游生态环境的需水量；水库取水建筑物的最低取水高程（C），以保证取水设施的正常运行；水库冬季结冰对水位的影响（D），以确保冬季水库的安全运行。选项E，水库兴利库容的大小，虽然是水库调度中的一个重要因素，但它不是确定死水位的直接依据。", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475289", "t": 2, "q": "数字水利中，遥感技术在水利中的应用场景包括（　）", "a": ["流域水体面积动态监测", "水库淹没范围评估", "灌区土壤含水量监测", "河道水流流速测量", "水利工程建设进度监测", ""], "r": "ABCE", "e": "遥感技术可获取大面积地表信息。A选项能通过遥感监测水体面积变化；B选项可利用遥感评估水库淹没范围；C选项能借助遥感监测灌区土壤含水量；E选项可对水利工程建设进度进行监测。而河道水流流速测量一般需专门仪器实地测量，遥感难以直接实现。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475290", "t": 2, "q": "水库洪水调度中，影响泄洪流量的因素有（　）", "a": ["水库水位", "泄洪建筑物的类型（如闸、溢洪道）", "泄洪建筑物的开启度", "下游河道的水位", "入库流量的大小", ""], "r": "ABCD", "e": "这是一道关于水库洪水调度中影响泄洪流量因素的题目。在水库洪水调度过程中，多个因素会共同影响泄洪流量的大小。首先，我们考虑水库的水位。显然，水库的水位高低直接影响到可泄洪的水量，因此A选项“水库水位”是一个关键影响因素。接着，泄洪建筑物的类型也是一个重要考虑因素。不同类型的泄洪建筑物（如闸、溢洪道）具有不同的泄洪能力和特性，因此B选项“泄洪建筑物的类型（如闸、溢洪道）”也会影响泄洪流量。此外，泄洪建筑物的开启度直接决定了水流通过的能力，开启度越大，泄洪流量通常也越大。所以C选项“泄洪建筑物的开启度”显然是影响泄洪流量的一个重要因素。对于D选项“下游河道的水位”，虽然它更多影响的是泄洪后的水流情况，但在某些情况下，下游河道的水位也可能反过来影响水库的泄洪决策，以保证安全，因此它也是一个需要考虑的因素。最后，E选项“入库流量的大小”虽然反映了水库的水量变化，但它本身并不直接影响泄洪流量，而是通过影响水库水位来间接影响泄洪流量。在这个问题中，我们更关注直接影响泄洪流量的因素。综上所述，影响泄洪流量的主要因素包括水库水位、泄洪建筑物的类型、泄洪建筑物的开启度以及下游河道的水位。因此，正确答案是ABCD。所以，正确答案是ABCD选项：“水库水位、泄洪建筑物的类型（如闸、溢洪道）、泄洪建筑物的开启度、下游河道的水位”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475291", "t": 2, "q": "智慧水利中，人工智能技术在水利中的应用包括（　）", "a": ["水文预报模型的参数优化", "水库调度方案的智能生成", "水利工程缺陷的图像识别", "流域水资源的供需平衡计算", "实时监测数据的异常检测", ""], "r": "ABCE", "e": "人工智能技术可用于对水文预报模型参数优化、智能生成水库调度方案、通过图像识别检测水利工程缺陷以及检测实时监测数据异常。而流域水资源供需平衡计算主要是基于传统水利计算方法。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475292", "t": 2, "q": "水库兴利调度中，年调节水库的正常蓄水位确定需要考虑的因素有（　）", "a": ["水库兴利库容的需求", "水库淹没与移民安置成本", "大坝的设计高程", "水库下游的防洪要求", "水资源的供需平衡", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382912", "t": 3, "q": "智慧水利中的数字孪生流域，其构建基础是流域的物理实体与数字化模型的精准映射，无需结合实时监测数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利的数字孪生流域构建，既要有流域物理实体与数字化模型的精准映射，也需结合实时监测数据来反映流域动态变化，使模型更贴合实际情况。所以题干说无需结合实时监测数据是错误的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382913", "t": 3, "q": "水库兴利调度的首要目标是在保障水资源供需平衡的前提下，最大化发挥水库的兴利效益（如发电、灌溉、供水）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水库兴利调度就是要在保证水资源供需平衡基础上，尽可能实现发电、灌溉、供水等兴利效益最大化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382914", "t": 3, "q": "数字水利技术中，物联网（IoT）传感器采集的水利数据可直接用于水文预报，无需进行数据清洗与校验。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网传感器采集的水利数据可能存在错误、缺失、异常等情况，直接用于水文预报会影响结果准确性，必须先进行数据清洗与校验。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382915", "t": 3, "q": "水库洪水调度中，调洪演算的水量平衡方程为:入库流量-出库流量=水库蓄水量的变化率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382916", "t": 3, "q": "智慧水利的\"预案\"功能，主要是针对已发生的洪水灾害，制定事后处置方案。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利“预案”功能主要是针对可能发生的灾害等提前制定应对方案，而非针对已发生的洪水灾害制定事后处置方案。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382917", "t": 3, "q": "水库兴利库容是指水库正常蓄水位与死水位之间的容积，用于满足兴利用水需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水库兴利库容的定义就是正常蓄水位与死水位之间的容积，其作用就是满足兴利用水需求。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382918", "t": 3, "q": "数字孪生水闸的运行模拟结果，可直接作为水闸实际运行的操作指令，无需人工复核。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生水闸虽能模拟运行，但模拟结果受模型精度、数据准确性等多种因素影响，可能存在偏差，不能直接作为操作指令，必须人工复核。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382919", "t": 3, "q": "水库洪水调度中，防洪限制水位是水库在汛期允许蓄水的最高水位，超过该水位需泄洪。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "防洪限制水位是水库在汛期允许蓄水的上限水位，当水库水位超过它时，为保障水库及下游安全等，通常需进行泄洪操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382920", "t": 3, "q": "智慧水利中，大数据分析技术可通过历史水文数据，精准预测未来任意时段的洪水过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然大数据分析技术能依据历史水文数据进行洪水预测，但由于洪水受众多复杂因素影响，如气象变化、人类活动等，难以精准预测未来任意时段的洪水过程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382921", "t": 3, "q": "水库兴利调度中，当水库实际来水量大于设计来水量时，可适当提高供水保证率，增加供水量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "实际来水量大于设计来水量，意味着水资源更充足，有条件提高供水保证率并增加供水量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382922", "t": 3, "q": "数字水利中，遥感技术（RS）可用于监测水库的水面面积，但无法计算水库的蓄水量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "遥感技术能获取水库水面面积信息，结合相关地形数据等，可计算水库蓄水量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382923", "t": 3, "q": "水库洪水调度中，校核洪水的重现期大于设计洪水，主要用于检验水库大坝的极限安全性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "校核洪水重现期确实大于设计洪水，其目的就是检验水库大坝在遭遇稀遇洪水时的极限安全性能。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382924", "t": 3, "q": "智慧水利平台的\"预演\"功能，仅能模拟单一洪水情景下的流域响应，无法模拟多情景。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利平台的“预演”功能可模拟多种情景，并非仅能模拟单一洪水情景。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382925", "t": 3, "q": "水库兴利调度中，死库容的水量不能被动用，主要用于容纳泥沙和保障取水设备安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "死库容的水一般不动用，主要功能是容纳泥沙、保障取水设备安全以及维持库底水生生态等。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382926", "t": 3, "q": "数字水利中，区块链技术可实现水利数据的不可篡改，因此无需对数据采集过程进行质量控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然区块链技术能保证水利数据不可篡改，但数据采集过程可能存在设备故障、人为失误等问题导致数据本身不准确，所以仍需对数据采集过程进行质量控制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382927", "t": 3, "q": "水库洪水调度中，当入库洪水为单峰洪水时，调洪演算只需计算洪峰时刻的泄流量即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单峰洪水调洪演算需考虑整个洪水过程，不只是洪峰时刻泄流量，要保证水库在整个过程中安全及合理运用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382928", "t": 3, "q": "智慧水利中，边缘计算技术可在水利监测现场实现数据实时处理，减少数据向云端传输的压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边缘计算是在靠近数据源的边缘侧进行数据处理，能在水利监测现场及时处理数据，避免大量数据都传向云端，从而减轻云端传输压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382929", "t": 3, "q": "水库兴利调度中，年调节水库的调节周期为1年，可完全解决流域年内的水资源供需矛盾。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "年调节水库虽调节周期为1年，但受水库库容、来水不确定性等因素限制，不能完全解决流域年内水资源供需矛盾。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382930", "t": 3, "q": "数字水利中，地理信息系统（GIS）可将流域水利工程数据与地形数据叠加，实现工程空间分布可视化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GIS具有强大的空间分析和数据处理能力，能够把流域水利工程数据和地形数据进行叠加，从而直观呈现工程的空间分布情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382931", "t": 3, "q": "水库洪水调度中，下游河道安全泄量是确定水库泄洪流量的唯一依据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水库泄洪流量的确定要综合考虑多方面因素，下游河道安全泄量只是其中重要依据之一，还需考虑水库自身安全、上游来水情况等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382932", "t": 3, "q": "智慧水利中的\"预报\"功能，其精度仅取决于预报模型的先进性，与输入数据的质量无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利“预报”功能精度不仅依赖预报模型先进性，输入数据质量也至关重要，高质量数据是准确预报的基础，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382933", "t": 3, "q": "水库兴利调度中，灌溉用水调度需优先满足作物播种期的用水需求，其次是生育期。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在水库兴利调度的灌溉用水调度里，生育期是作物生长需水关键阶段，用水需求应优先保障，而非优先满足播种期。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382934", "t": 3, "q": "数字孪生流域的构建过程中，无需考虑流域内水利工程的运行状态数据，仅需地形与水文数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生流域要全面、精准反映流域真实情况，水利工程运行状态数据对了解流域整体运行、水资源调配等至关重要，不能仅靠地形与水文数据，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382935", "t": 3, "q": "水库洪水调度中，调洪演算的结果与所选用的数值计算方法无关，仅取决于输入参数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "调洪演算结果不仅取决于输入参数，所选用的数值计算方法也会对结果产生影响，不同计算方法精度和特点不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382936", "t": 3, "q": "智慧水利平台可实现水利工程的远程智能控制，因此无需在工程现场设置运维人员。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利平台虽能远程智能控制，但现场可能会有设备故障、突发状况等需要现场人员及时处理，不能完全不设运维人员。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382937", "t": 3, "q": "水库兴利调度中，水电站发电调度需在满足电网负荷需求的同时，协调下游灌溉与供水需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水库兴利调度里，水电站发电调度不仅要满足电网负荷需求，也要考虑协调下游灌溉与供水等多方面需求，以实现综合效益最大化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382938", "t": 3, "q": "数字水利中，物联网（IoT）传感器的供电方式仅能采用有线供电，无法实现无线供电。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。在数字水利里，物联网（IoT）传感器供电方式多样，既可以有线供电，也能够实现无线供电，比如利用太阳能、电池等无线供电方式。所以答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382939", "t": 3, "q": "水库洪水调度中，当水库水位超过校核洪水位时，需采取紧急泄洪措施，保障大坝安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "校核洪水位是水库允许达到的最高水位，超过该水位大坝安全会受威胁，所以要采取紧急泄洪保障安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382940", "t": 3, "q": "智慧水利的\"预警\"功能，可根据洪水预报结果，自动发布不同等级的预警信息，无需人工审核。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利预警虽有自动化特点，但涉及重大安全等信息发布，为确保准确性和可靠性，一般需人工审核。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382941", "t": 3, "q": "水库兴利调度中，多年调节水库的兴利库容比年调节水库大，因此其供水保证率更高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多年调节水库能将丰水年水量存起来供枯水年用，兴利库容大使得调节能力强，可应对更长期的来水变化，保障供水，所以供水保证率更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382942", "t": 3, "q": "数字水利中，大数据分析技术可用于识别水资源利用中的浪费现象，为节水措施制定提供依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数据分析技术能处理大量水资源相关数据，从中挖掘出用水规律和异常情况，从而识别浪费现象，为节水措施制定提供数据支持。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382943", "t": 3, "q": "水库洪水调度中，联合调度的水库群，其总防洪库容等于各水库防洪库容之和。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "联合调度的水库群，各水库之间存在相互影响和协调，总防洪库容并非简单的各水库防洪库容相加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382944", "t": 3, "q": "智慧水利中，数字孪生模型的更新频率越低，模型与物理实体的映射精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生模型需及时反映物理实体的状态变化，更新频率低时，模型难以及时跟上物理实体的动态变化，会降低映射精度，而非提高。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382945", "t": 3, "q": "水库兴利调度中，工业用水的水质要求通常高于灌溉用水，因此需优先保障工业用水水质。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工业生产对水的纯度、成分等水质要求严格，水质不佳会影响产品质量和设备运行；而灌溉用水对水质要求相对低些。从用水需求特性看，应优先保障工业用水水质。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382946", "t": 3, "q": "数字水利中，遥感技术（RS）可用于监测河道的泥沙淤积情况，但无法监测水土流失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "遥感技术（RS）不仅能监测河道的泥沙淤积情况，也可用于监测水土流失，通过获取不同时期的地表影像，分析地表变化情况来监测水土流失状况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382947", "t": 3, "q": "水库洪水调度中，调洪演算的起始时刻水库水位必须为防洪限制水位。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "调洪演算起始时刻水库水位不一定是防洪限制水位，可能因前期情况等处于其他水位。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382948", "t": 3, "q": "智慧水利平台的数据存储模块，无需考虑数据的安全性与备份机制，仅需满足存储容量即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。智慧水利平台的数据存储模块不仅要满足存储容量需求，数据的安全性至关重要，因为水利数据包含重要信息，一旦泄露或丢失会造成严重后果，同时备份机制也不可或缺，可防止因意外情况导致数据丢失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382949", "t": 3, "q": "水库兴利调度中，生态基流是指为维持下游河道生态功能，水库必须下泄的最小流量，不能中断。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "生态基流就是为维系下游河道生态功能，水库需下泄的最小流量，且不能中断，以保障河道基本生态用水需求。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382950", "t": 3, "q": "数字孪生水闸的故障诊断功能，仅能识别闸门机械故障，无法识别电气故障。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生水闸的故障诊断功能较为全面，不仅能识别闸门机械故障，也可对电气故障等进行识别。", "ap": [false, false, false, false, false, false]}]}, {"k": "第3章 智慧水利和数字水利技术||第5节 水库兴利调度与洪水调度（2）", "n": "第3章 智慧水利和数字水利技术 / 第5节 水库兴利调度与洪水调度（2）", "qs": [{"id": "2035637284929409024", "t": 1, "q": "水库兴利调度中，若设计枯水年的来水量减少，而用水需求不变，则需通过（　）措施满足用水保证率", "a": ["降低水库死水位", "减小水库兴利库容", "降低灌溉保证率", "缩短调节周期", "", ""], "r": "C", "e": "设计枯水年水量减少、用水需求不变时，降低灌溉保证率可减少用水需求，能满足用水保证率。降低死水位不一定能解决问题，减小兴利库容会使蓄水能力下降，缩短调节周期也无法有效应对水量减少。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409025", "t": 1, "q": "水库兴利调度中，当计算水库兴利库容时，需要考虑的关键参数不包括以下哪项？", "a": ["水库设计死水位", "水库设计洪水位", "水库正常蓄水位", "水库多年平均来水量", "", ""], "r": "B", "e": "兴利库容是正常蓄水位与死水位之间的库容，和多年平均来水量也相关，而设计洪水位主要用于防洪，与兴利库容计算无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409026", "t": 1, "q": "数字水利技术中，用于监测流域水土流失面积与强度的主要遥感技术手段是以下哪项？", "a": ["合成孔径雷达（SAR）技术", "热红外遥感技术", "可见光遥感技术", "高光谱遥感技术", "", ""], "r": "D", "e": "高光谱遥感技术光谱分辨率高，能识别不同地物光谱特征，可有效监测流域水土流失面积与强度。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409027", "t": 1, "q": "水库洪水调度中，当入库洪水流量超过水库泄洪能力时，水库水位会上升，此时进行调洪演算的关键公式是以下哪项？", "a": ["水量平衡方程", "马斯京根法流量演算公式", "谢才公式", "曼宁公式", "", ""], "r": "A", "e": "调洪演算主要依据水库水量的收支变化，关键是水量平衡方程。马斯京根法用于河道洪水演进；谢才公式和曼宁公式用于明渠均匀流计算。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409028", "t": 1, "q": "智慧水利平台中，\"水利大数据中心\"的数据清洗环节，主要解决的问题不包括以下哪项？", "a": ["数据缺失", "数据冗余", "数据格式统一", "数据可视化展示", "", ""], "r": "D", "e": "数据清洗是对数据进行预处理，解决数据缺失、冗余、格式不统一等问题，使数据更准确规范。而数据可视化展示是将处理好的数据以直观图形呈现，并非数据清洗环节解决的问题。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409029", "t": 1, "q": "水库兴利调度中，\"年调节水库\"的调节周期特点是以下哪项？", "a": ["调节周期为1个月以内", "可将年内某一时期的多余水量调节到另一时期使用", "需跨年度调节多余水量", "仅能调节日内水量变化", "", ""], "r": "B", "e": "年调节水库主要是把年内丰水期多余水量存蓄起来，供枯水期使用。A选项调节周期1个月以内不符合年调节；C选项跨年度调节是多年调节水库特点；D选项调节日内水量变化是日调节水库特点。所以答案选B。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409030", "t": 1, "q": "数字水利中，物联网（IoT）技术在水利工程监测中的应用，不包括以下哪项？", "a": ["坝体渗压监测传感器组网", "闸门开度自动测控终端", "水库泥沙淤积人工采样分析", "河道流量实时监测雷达站", "", ""], "r": "C", "e": "物联网是通过各种信息传感器实时采集信息的技术。A、B、D选项都是利用传感器等设备进行实时数据采集和监测，属于物联网技术应用；而C是人工采样分析，并非利用物联网相关技术实时自动获取数据。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409031", "t": 1, "q": "水库洪水调度中，确定水库防洪限制水位的主要依据是以下哪项？", "a": ["水库死水位", "水库下游河道安全泄量", "水库正常蓄水位", "水库总库容", "", ""], "r": "B", "e": "防洪限制水位要保证水库泄洪不超过下游河道安全泄量，需依据下游河道安全泄量来确定。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409032", "t": 1, "q": "智慧水利中，用于实现水利工程设备（如闸门、泵站）远程智能控制的核心技术是以下哪项？", "a": ["水利数据挖掘技术", "边缘计算与工业互联网（IIoT）技术", "水文频率分析技术", "水资源优化配置技术", "", ""], "r": "B", "e": "边缘计算与工业互联网（IIoT）技术可让设备实现数据采集、传输与远程控制，适合用于水利工程设备远程智能控制。A选项数据挖掘侧重数据处理分析；C选项水文频率分析用于水文计算；D选项水资源优化配置主要解决资源分配问题。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409033", "t": 1, "q": "水库兴利调度中，当水库实际来水量小于设计来水量时，应采取的调度措施不包括以下哪项？", "a": ["降低水库供水量", "提高水库死水位运行", "减少灌溉用水分配", "优化水电站发电调度，减少弃水", "", ""], "r": "B", "e": "当实际来水量小于设计来水量，要减少用水、优化调度。A降低供水量、C减少灌溉用水分配可减少用水；D优化发电调度减少弃水可提高水资源利用。而提高死水位运行会减少水库可调节水量，不利于应对来水不足情况。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409034", "t": 1, "q": "数字孪生流域构建中，对流域地形数据进行处理时，需要将DEM数据与水利工程矢量数据融合，其主要目的是以下哪项？", "a": ["减少数据存储量", "提高流域水文模拟的精度", "简化数据传输流程", "降低数据采集成本", "", ""], "r": "B", "e": "将DEM数据与水利工程矢量数据融合，能使模型更准确反映流域实际情况，进而提高流域水文模拟精度。而融合数据一般不会减少存储量、简化传输流程和降低采集成本。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409035", "t": 1, "q": "水库洪水调度中，\"防洪库容\"是指以下哪两个水位之间的水库容积？", "a": ["死水位与正常蓄水位", "正常蓄水位与防洪限制水位", "防洪限制水位与设计洪水位", "设计洪水位与校核洪水位", "", ""], "r": "C", "e": "防洪库容是为防洪要求而预留的库容，是防洪限制水位至设计洪水位之间的水库容积。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409036", "t": 1, "q": "智慧水利中，人工智能（AI）技术在洪水预报中的应用，主要体现为以下哪项？", "a": ["替代人工雨量观测", "基于历史洪水数据训练模型，提高预报准确率", "直接控制水库闸门泄洪", "生成洪水预报纸质报告", "", ""], "r": "B", "e": "AI技术在洪水预报里主要是利用大量历史洪水数据来训练模型，从而提升预报准确性。人工雨量观测有其不可替代性，AI不能替代；AI不直接控制水库闸门泄洪；生成纸质报告并非其核心应用。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409037", "t": 1, "q": "水库兴利调度中，计算水库供水保证率时，需要统计的关键指标是以下哪项？", "a": ["水库每年实际供水量与设计供水量的比值", "水库多年平均供水量", "水库最大年供水量", "水库最小年供水量", "", ""], "r": "A", "e": "供水保证率指供水得到保证的程度，通过统计水库每年实际供水量与设计供水量的比值来确定。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409038", "t": 1, "q": "数字水利技术中，用于实时监测水库水温分层现象的传感器类型是以下哪项？", "a": ["水位传感器", "压力传感器", "多参数水质传感器（含温度分层监测功能）", "流量传感器", "", ""], "r": "C", "e": "水温分层现象需监测不同层面水温情况。A选项水位传感器测水位；B选项压力传感器测压力；D选项流量传感器测流量。而C选项多参数水质传感器含温度分层监测功能可用于实时监测水库水温分层现象。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409039", "t": 1, "q": "水库洪水调度中，当发生特大洪水时，水库采取\"错峰调度\"的主要目的是以下哪项？", "a": ["增加水库蓄水量", "避免水库下游河道洪峰叠加", "提高水电站发电量", "降低水库死水位", "", ""], "r": "B", "e": "错峰调度就是错开洪峰，防止下游河道洪峰叠加引发更大危害。A增加蓄水量不是错峰调度主要目的；C提高发电量与错峰调度无关；D降低死水位也不是错峰调度目的。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409040", "t": 1, "q": "智慧水利平台的\"预演\"功能，在流域洪水应对中主要用于以下哪项？", "a": ["记录已发生的洪水过程", "模拟不同洪水情景下的流域淹没范围与工程响应", "发布洪水预警信息", "统计洪水造成的经济损失", "", ""], "r": "B", "e": "“预演”强调对未来情景的模拟。A选项记录已发生过程不是预演；C选项发布预警不是预演功能；D选项统计损失是事后工作。B项模拟不同洪水情景下情况符合预演功能。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409041", "t": 1, "q": "水库兴利调度中，\"灌溉用水调度\"需优先考虑的因素是以下哪项？", "a": ["水电站发电负荷需求", "灌溉作物的关键生育期需水量", "水库旅游用水需求", "水库工业供水需求", "", ""], "r": "B", "e": "灌溉用水调度主要是为满足灌溉需求，关键是要保证灌溉作物在关键生育期的需水量。而发电、旅游、工业供水并非灌溉用水调度优先考虑因素。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409042", "t": 1, "q": "数字水利中，区块链技术在水资源管理中的应用不包括以下哪项？", "a": ["水资源使用权交易记录存证", "水利工程建设合同履约跟踪", "水文数据实时采集", "跨区域调水水量计量溯源", "", ""], "r": "C", "e": "区块链主要用于数据存证、交易记录、溯源等，水文数据实时采集靠的是传感器等设备，并非区块链技术特点。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409043", "t": 1, "q": "水库洪水调度中，水库调洪演算的起始条件不包括以下哪项？", "a": ["起始时刻水库水位", "起始时刻入库流量", "起始时刻下游河道水位", "起始时刻水库泄流量", "", ""], "r": "C", "e": "水库调洪演算起始条件主要围绕水库自身状态，起始时刻下游河道水位与水库调洪演算的起始状态无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409044", "t": 1, "q": "智慧水利中，\"数字孪生水闸\"的运行模拟功能，不能实现以下哪项？", "a": ["模拟不同水位下闸门的启闭力", "模拟闸门故障时的应急处置方案", "预测未来10年闸门的钢材腐蚀量", "模拟水闸过流能力与下游水位关系", "", ""], "r": "C", "e": "运行模拟主要针对水闸运行当下或短期内的状况模拟。未来10年时间跨度长，存在众多不确定因素，难以通过运行模拟功能预测钢材腐蚀量。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409045", "t": 1, "q": "水库兴利调度中，当水库为\"多年调节水库\"时，其主要调节特点是以下哪项？", "a": ["仅调节年内水量分配", "可将丰水年多余水量调节到枯水年使用", "调节周期不超过半年", "无需考虑水库死水位", "", ""], "r": "B", "e": "多年调节水库能把丰水年多余水量存起来供枯水年用。A选项仅调节年内水量分配是年调节水库特点；C选项调节周期不超过半年不符合多年调节；D选项水库调度都要考虑死水位。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409046", "t": 1, "q": "数字水利技术中，遥感技术（RS）在水利中的应用，不包括以下哪项？", "a": ["监测流域积雪覆盖面积", "计算水库库容", "测量河道水流速度", "识别洪涝灾害淹没范围", "", ""], "r": "C", "e": "遥感技术主要是通过远距离感知目标反射或辐射的电磁波来获取信息。测量河道水流速度需要现场实时测量水流的动态数据，这不是遥感技术能直接完成的。而监测积雪面积、计算水库库容、识别洪涝淹没范围可通过遥感影像分析来实现。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409047", "t": 1, "q": "水库洪水调度中，\"设计洪水\"的主要参数不包括以下哪项？", "a": ["设计洪峰流量", "设计洪水总量", "设计洪水过程线", "水库正常蓄水位", "", ""], "r": "D", "e": "设计洪水的主要参数有设计洪峰流量、设计洪水总量、设计洪水过程线等。水库正常蓄水位是水库的特征水位，并非设计洪水的参数。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409048", "t": 1, "q": "智慧水利中，水利大数据分析技术在水资源优化配置中的应用，主要体现为以下哪项？", "a": ["统计水库历史水位数据", "基于多源数据（降水、用水、径流）优化供水方案", "绘制水资源分布图", "存储水资源监测数据", "", ""], "r": "B", "e": "水资源优化配置重点在于优化供水方案以合理分配水资源，多源数据基础上优化供水方案符合该要求。A只是统计历史数据，C绘制分布图没涉及配置优化，D存储数据也未体现优化配置。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409049", "t": 1, "q": "水库兴利调度中，计算水库蒸发损失时，不需要考虑的因素是以下哪项？", "a": ["水库水面面积", "水库所在地的多年平均蒸发量", "水库入库流量", "水库蓄水期与放水期", "", ""], "r": "C", "e": "水库蒸发损失与水面面积、当地多年平均蒸发量以及蓄水和放水期相关，而入库流量主要影响水库水量变化，和蒸发损失计算无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409050", "t": 1, "q": "数字水利中，地理信息系统（GIS）在流域管理中的应用，不包括以下哪项？", "a": ["绘制流域水系图", "分析水库淹没区范围", "模拟水文循环过程", "管理水利工程空间分布数据", "", ""], "r": "C", "e": "模拟水文循环过程主要依靠水文模型等工具，GIS主要用于地理空间数据处理、分析与展示等。绘制水系图、分析淹没区范围、管理水利工程空间分布数据都属于GIS在流域管理中的常见应用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409051", "t": 1, "q": "水库洪水调度中，当水库入库洪水为\"复式洪峰\"时，调洪演算的关键是以下哪项？", "a": ["忽略第二个洪峰", "重点考虑洪峰叠加后的总流量", "分别计算每个洪峰的调洪过程，避免泄洪叠加", "提高水库防洪限制水位", "", ""], "r": "C", "e": "复式洪峰有多个洪峰，调洪关键是分别算每个洪峰调洪过程，防止泄洪叠加导致水库安全问题。A忽略第二个洪峰不可取；B重点考虑总流量未体现分别处理洪峰；D提高防洪限制水位不是关键做法。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409052", "t": 1, "q": "智慧水利中，\"边缘计算\"技术在水利监测中的优势不包括以下哪项？", "a": ["减少数据向云端传输的延迟", "降低云端数据存储压力", "实现监测数据的实时处理与本地决策", "提高数据采集的精度", "", ""], "r": "D", "e": "边缘计算主要作用是在靠近数据源的边缘侧处理数据，能减少传输延迟、降低云端存储压力、实现本地实时处理与决策，但不直接提高数据采集精度。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637284929409053", "t": 1, "q": "水库兴利调度中，\"水库死库容\"的主要作用不包括以下哪项？", "a": ["容纳水库泥沙淤积", "保障水库取水设备正常运行", "提供水库防洪库容", "维持水库下游生态基流", "", ""], "r": "C", "e": "水库死库容主要用于容纳泥沙、保障取水设备运行、维持下游生态基流等。防洪库容是为防洪专门设置的库容，与死库容无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547712", "t": 2, "q": "数字水利中，水利大数据平台的核心功能包括（　）", "a": ["多源水利数据的接入与整合", "数据的清洗、转换与标准化", "数据的分布式存储与管理", "数据的可视化展示与查询", "水库闸门的远程控制", ""], "r": "ABCD", "e": "水利大数据平台主要围绕数据处理与管理，A可汇聚数据，B能规范数据，C利于数据存储，D方便数据查看，均是核心功能；而E水库闸门远程控制属于水利设施控制操作，并非大数据平台核心功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547713", "t": 2, "q": "水库洪水调度中，设计洪水的计算方法包括（　）", "a": ["频率分析法（适用于有长期水文资料）", "暴雨洪水法（适用于无水文资料，有暴雨资料）", "水文比拟法（适用于无资料，有相似流域资料）", "经验公式法（适用于小流域）", "实时洪水预报法（适用于短期洪水预测）", ""], "r": "ABCD", "e": "设计洪水计算要依据不同资料情况选方法。有长期水文资料用频率分析法；无水文但有暴雨资料用暴雨洪水法；无资料但有相似流域资料用水文比拟法；小流域适用经验公式法。实时洪水预报法主要用于短期洪水预测，并非设计洪水计算方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547714", "t": 2, "q": "智慧水利中，数字孪生技术在水库调度中的应用包括（　）", "a": ["水库水位与库容的动态模拟", "不同泄洪方案下的淹没范围预测", "水库大坝的结构安全监测与预警", "流域水文过程的实时模拟", "水库兴利库容的静态计算", ""], "r": "ABCD", "e": "数字孪生技术强调动态、实时及模拟预测等。A可动态模拟水位与库容；B能预测不同方案淹没范围；C可实时监测预警大坝安全；D能实时模拟流域水文过程。而E兴利库容静态计算未体现数字孪生技术动态实时模拟特点。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547715", "t": 2, "q": "水库兴利调度中，工业用水的调度特点包括（　）", "a": ["用水量大且相对稳定", "用水保证率要求高", "用水水质有特定要求", "用水时间集中（如生产班次）", "可根据水库来水情况灵活调整用水量", ""], "r": "ABCD", "e": "工业用水通常量大且稳定，保证率要求高，对水质有特定要求，用水时间会因生产班次集中。但一般工业用水不能随意根据水库来水灵活调整，否则影响生产。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547716", "t": 2, "q": "数字水利中，边缘计算技术在水利监测中的应用优势包括（　）", "a": ["减少数据向云端传输的量，降低带宽压力", "提高实时数据处理的响应速度", "增强监测系统在网络中断时的局部处理能力", "降低监测设备的硬件成本", "提高数据处理的精度", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547717", "t": 2, "q": "水库洪水调度中，水库防洪调度计划应包含的内容有（　）", "a": ["设计洪水与校核洪水的特征值", "各防洪水位的确定值", "不同洪水等级下的泄洪方案", "下游地区的预警与转移预案", "水库兴利蓄水的分配方案", ""], "r": "ABCD", "e": "答案：ABCD水库防洪调度计划主要是为了应对洪水，保障水库和下游地区的安全。因此，计划中应包含设计洪水与校核洪水的特征值（A），这样可以根据不同的洪水情况采取相应的措施。同时，还需要明确各防洪水位的确定值（B），以便在洪水来临时能够及时采取行动。不同洪水等级下的泄洪方案（C）也是必不可少的，它能指导水库在不同洪水情况下的泄洪操作。最后，下游地区的预警与转移预案（D）也是非常重要的，它能确保下游地区在洪水来临前得到及时的预警，并进行安全的转移。而水库兴利蓄水的分配方案（E）主要关注的是水库的蓄水效益，与防洪调度关系不大，因此不应包含在防洪调度计划中。", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547718", "t": 2, "q": "智慧水利系统中，可视化技术的应用包括（　）", "a": ["流域水文过程的动态模拟展示", "水库调度方案的效果对比可视化", "水利工程结构的三维模型展示", "监测数据的实时图表展示", "水文模型参数的计算", ""], "r": "ABCD", "e": "可视化技术主要是将信息以直观的视觉形式呈现。A、B、C、D选项都是将相关水利信息通过动态模拟、效果对比、三维模型、实时图表等可视化方式展示。而E选项水文模型参数的计算是数据运算过程，并非可视化应用。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547719", "t": 2, "q": "水库兴利调度中，当水库遭遇特枯水年时，可采取的应急调度措施有（　）", "a": ["减少灌溉面积", "降低灌溉保证率", "启用应急备用水源", "加大水库泄洪量", "调整工业用水的定额", ""], "r": "ABCE", "e": "特枯水年水资源紧张，需采取措施节约和增加水源。A减少灌溉面积、B降低灌溉保证率、E调整工业用水定额可减少用水需求；C启用应急备用水源可增加供水。而加大水库泄洪量会使水量减少，不符合应急需求。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547720", "t": 2, "q": "数字水利中，水利数据的主要来源包括（　）", "a": ["水文监测站（水位、流量、雨量）", "遥感与卫星监测数据", "水利工程运行数据（闸门开度、发电量）", "气象预报数据（降水、气温）", "人工观测的纸质记录数据", ""], "r": "ABCDE", "e": "数字水利里，水文监测站、遥感与卫星、水利工程运行、气象预报及人工观测纸质记录等都是水利数据的来源。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547721", "t": 2, "q": "水库洪水调度中，判断洪水是否为超标准洪水的依据是（　）", "a": ["洪水的重现期是否超过设计洪水的重现期", "入库洪量是否超过设计洪量", "洪峰流量是否超过设计洪峰流量", "水库水位是否超过设计洪水位", "下游河道水位是否超过警戒水位", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547722", "t": 2, "q": "智慧水利中，云计算技术在水利中的应用包括（　）", "a": ["海量水利数据的集中存储", "复杂水文模型的并行计算", "水利调度方案的远程协同制定", "实时监测数据的边缘处理", "水利信息的共享与服务", ""], "r": "ABCE", "e": "云计算具有强大存储和计算能力，可实现海量数据存储、复杂模型并行计算、信息共享服务，也能支持远程协同制定方案。而边缘处理是边缘计算范畴。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547723", "t": 2, "q": "水库兴利调度中，生活用水调度的核心要求包括（　）", "a": ["保证率最高（优先满足）", "水质符合饮用水标准", "供水量相对稳定", "用水时间可灵活调整", "可与工业用水替换使用", ""], "r": "ABC", "e": "生活用水关乎人的基本生存需求，要优先满足且保证率最高，水质必须符合饮用水标准，供水量也需相对稳定。用水时间一般较固定，且不能与工业用水随意替换。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547724", "t": 2, "q": "数字水利中，区块链技术在水利管理中的应用场景包括以下哪些？", "a": ["水资源使用权交易存证", "跨区域调水水量计量溯源", "水利工程建设资金流向跟踪", "水文数据实时采集", "水库调度方案审批记录存证", ""], "r": "ABCE", "e": "区块链具有去中心化、不可篡改、可追溯等特性。A选项水资源使用权交易存证可利用其不可篡改特性保障交易记录安全；B选项跨区域调水水量计量溯源能借助可追溯性实现；C选项水利工程建设资金流向跟踪可利用其透明可查特点；E选项水库调度方案审批记录存证也可利用不可篡改特性。而水文数据实时采集主要依赖传感器、通信等技术，并非区块链核心应用。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547725", "t": 2, "q": "智慧水利中，\"边缘计算\"技术在水利监测中的应用优势包括以下哪些？", "a": ["减少数据传输延迟", "降低云端数据存储压力", "实现监测数据本地实时处理", "提高传感器采集精度", "增强极端天气下的数据处理可靠性", ""], "r": "ABCE", "e": "边缘计算可在靠近数据源的边缘侧处理数据，能减少数据传至云端的延迟，降低云端存储压力，实现本地实时处理，还能在极端天气等网络不佳时保障数据处理可靠性，但无法提高传感器采集精度。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547726", "t": 2, "q": "水库兴利调度中，\"生态调度\"需要考虑的因素包括以下哪些？", "a": ["下游河道生态基流", "鱼类产卵期的水流条件", "水库泥沙淤积情况", "河岸植被需水量", "水库发电负荷需求", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547727", "t": 2, "q": "数字孪生流域的\"预演\"功能可模拟的场景包括以下哪些？", "a": ["不同降雨情景下的流域洪水淹没范围", "水库不同泄洪方案对下游的影响", "流域水资源供需失衡的应对效果", "历史洪水过程的重现", "水利工程建设后的流域水文变化", ""], "r": "ABCE", "e": "数字孪生流域“预演”功能可对未来不同情景进行模拟分析。A是不同降雨情景下洪水淹没模拟；B是水库泄洪方案影响模拟；C是水资源供需失衡应对效果模拟；E是水利工程建设后水文变化模拟，均属于预演未来场景。而D历史洪水过程重现是对过去已发生情况的再现，不属于预演功能范畴。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547728", "t": 2, "q": "水库洪水调度中，水库泄洪闸门的调度原则包括以下哪些？", "a": ["根据入库洪水变化及时调整泄量", "避免泄洪流量超过下游河道安全泄量", "优先保障水库蓄水，尽量少泄洪", "考虑上下游水库的联合调度", "泄洪过程中避免闸门频繁启闭", ""], "r": "ABDE", "e": "水库泄洪闸门调度要综合多方面因素。A选项根据入库洪水变化调泄量能合理应对洪水；B避免超下游河道安全泄量可保障下游安全；D考虑上下游水库联合调度能整体优化水资源调配；E避免闸门频繁启闭利于设备运行和稳定泄洪。而C优先保障蓄水少泄洪可能会使水库水位过高，威胁水库安全，不是正确原则。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547729", "t": 2, "q": "智慧水利平台的\"预警\"功能需要包含的信息要素包括以下哪些？", "a": ["预警区域", "预警等级", "预警起始与持续时间", "预警对应的洪水流量", "应急避险措施建议", ""], "r": "ABCE", "e": "智慧水利平台预警需明确预警区域、等级、时间，让相关人员知晓范围、严重程度和时间跨度；给出应急避险措施建议可指导应对；而预警时洪水流量并非必需信息要素。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547730", "t": 2, "q": "水库兴利调度中，\"多年调节水库\"的调度策略特点包括以下哪些？", "a": ["可跨年度调节水量", "需预留一定库容应对枯水年", "调节周期为1年", "主要考虑年内用水需求", "需分析长期水文情势变化", ""], "r": "ABE", "e": "多年调节水库能跨年度调节水量，需预留库容应对枯水年，要分析长期水文情势变化；而调节周期为1年、主要考虑年内用水需求是年调节水库特点。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547731", "t": 2, "q": "数字水利中，遥感技术（RS）在水利中的应用场景包括以下哪些？", "a": ["流域积雪覆盖监测", "洪涝灾害淹没范围识别", "水库库容计算", "河道水流速度测量", "水土流失面积估算", ""], "r": "ABCE", "e": "遥感技术可获取大面积地表信息。流域积雪、洪涝淹没范围、水土流失面积都可通过遥感影像识别和分析；水库库容可结合遥感获取的地形数据计算。而河道水流速度测量需借助流速仪等设备，难以用遥感直接测量。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547732", "t": 2, "q": "水库洪水调度中，影响调洪演算结果精度的因素包括以下哪些？", "a": ["入库洪水过程线的准确性", "水库泄流曲线的精度", "水库初始水位的准确性", "水库兴利库容的大小", "数值计算方法的选择", ""], "r": "ABCE", "e": "调洪演算需依据准确的入库洪水、泄流曲线和初始水位，数值计算方法也影响精度；而兴利库容大小与调洪演算结果精度无直接关联。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547733", "t": 2, "q": "智慧水利中，水利大数据分析的主要方法包括以下哪些？", "a": ["数据挖掘", "机器学习", "统计分析", "人工数据分类", "深度学习", ""], "r": "ABCE", "e": "水利大数据分析常用数据挖掘、机器学习、统计分析、深度学习等方法，而人工数据分类效率低且不属于主要分析方法。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547734", "t": 2, "q": "水库兴利调度中，\"灌溉用水\"的调度优先级确定需考虑的因素包括以下哪些？", "a": ["作物的关键生育期", "灌溉面积大小", "作物的经济价值", "水库当前蓄水量", "水电站的发电需求", ""], "r": "ABCD", "e": "灌溉用水调度优先级要考虑作物自身情况如关键生育期和经济价值、灌溉规模即灌溉面积大小，同时水库当前蓄水量也影响调度。而水电站发电需求与灌溉用水调度优先级无直接关联。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547735", "t": 2, "q": "数字孪生水闸运行模拟中，需要输入的边界条件包括以下哪些？", "a": ["上游水位", "下游水位", "闸门启闭度", "水闸建设年代", "水流密度", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547736", "t": 2, "q": "水库洪水调度中，\"防洪库容\"的利用原则包括以下哪些？", "a": ["洪水来临前尽量腾空防洪库容", "根据洪水预报提前泄洪", "洪水过后及时蓄水至正常蓄水位", "优先用于兴利供水", "避免在非汛期占用防洪库容", ""], "r": "ABCE", "e": "防洪库容是为防洪而设置的库容，要保证其防洪功能。洪水来临前腾空可应对洪水；根据预报提前泄洪能降低水位；洪水后及时蓄水恢复正常利于后续使用；非汛期不占用可保证防洪库容有效。而防洪库容应优先防洪而非兴利供水。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547737", "t": 2, "q": "智慧水利中，\"数字孪生\"技术与传统水利模拟的区别包括以下哪些？", "a": ["是否实现实时数据驱动", "是否支持多情景预演", "是否依赖人工数据输入", "是否实现闭环管理", "是否需要纸质报告输出", ""], "r": "ABD", "e": "智慧水利中的“数字孪生”技术与传统水利模拟的主要区别体现在技术应用的先进性和智能化程度上。A项提到“是否实现实时数据驱动”。数字孪生技术通过实时采集和处理数据，能够实现对水利系统的实时监控和模拟，而传统水利模拟往往依赖固定的、非实时的数据集，因此A项是区别之一。B项涉及“是否支持多情景预演”。数字孪生技术强大的数据处理和模拟能力使其能够支持多种情景的预演，帮助决策者预见不同条件下的水利系统表现，而传统模拟在这方面的能力有限，所以B项也是区别。C项说的是“是否依赖人工数据输入”。虽然数字孪生技术减少了对人工数据输入的依赖，但并非完全不需要，而传统水利模拟同样可能需要人工输入数据。因此，C项不是二者之间的核心区别。D项关于“是否实现闭环管理”。数字孪生技术通过实时数据反馈和模拟优化，可以实现更有效的闭环管理，而传统模拟在这方面较为薄弱，故D项是区别之一。E项提到“是否需要纸质报告输出”。这一点并非二者之间的本质区别，因为无论是数字孪生还是传统模拟，都可以根据需要输出纸质报告，这更多取决于具体的应用场景和需求。综上所述，智慧水利中“数字孪生”技术与传统水利模拟的主要区别包括：是否实现实时数据驱动（A项）、是否支持多情景预演（B项）以及是否实现闭环管理（D项）。因此，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547738", "t": 2, "q": "水库兴利调度中，\"工业用水\"调度需要满足的要求包括以下哪些？", "a": ["用水流量稳定", "用水水质达标", "用水压力稳定", "用水时间灵活", "用水成本最低", ""], "r": "ABC", "e": "工业生产通常对用水流量、水质、压力有稳定要求，以保障生产正常进行。而用水时间一般根据生产计划较固定，并非灵活；用水成本不是调度中需直接满足的要求。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547739", "t": 2, "q": "数字水利中，物联网（IoT）传感器的选择需考虑的因素包括以下哪些？", "a": ["测量精度", "环境适应性", "数据传输距离", "传感器颜色", "功耗", ""], "r": "ABCE", "e": "测量精度影响数据准确性，环境适应性保证传感器在不同环境正常工作，数据传输距离关系到数据能否有效传输，功耗影响传感器续航和使用成本，而传感器颜色对其功能无实质影响。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547740", "t": 2, "q": "水库洪水调度中，\"错峰调度\"的实施条件包括以下哪些？", "a": ["有准确的洪水预报", "水库有足够的防洪库容", "下游河道有一定的调蓄能力", "水库闸门可灵活调节", "下游无防洪保护区", ""], "r": "ABCD", "e": "错峰调度需准确掌握洪水情况所以要有准确洪水预报；水库要有足够库容去拦蓄洪水；下游河道有调蓄能力才能配合错峰；水库闸门灵活调节才能按需泄洪。下游有防洪保护区才需错峰调度，E错误。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637286594547741", "t": 2, "q": "智慧水利平台的核心构成模块包括以下哪些？", "a": ["数据采集与传输模块", "数据存储与管理模块", "数据分析与决策支持模块", "人工数据录入模块", "信息展示与发布模块", ""], "r": "ABCE", "e": "智慧水利平台核心模块需涵盖数据从采集到处理再到应用的全流程。A负责源头数据收集与传送；B进行数据存储管理；C对数据深入分析以辅助决策；E将处理后信息展示发布。而人工数据录入并非核心构成模块。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842112", "t": 3, "q": "水库洪水调度中，设计洪水的重现期越大，对应的设计洪峰流量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设计洪水重现期越大，意味着该洪水越稀遇，对应的设计洪峰流量越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842113", "t": 3, "q": "数字孪生流域的数字模型需与物理流域完全一致，才能实现精准调度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生流域的数字模型很难与物理流域完全一致，但通过不断校准和优化，即便存在一定差异也能实现精准调度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842114", "t": 3, "q": "水库兴利调度中，调节周期越长，在兴利库容和来水量一定时，调节流量越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在兴利库容和来水量一定时，调节周期越长，意味着将来水分配到更多时间内使用，调节流量会越小，而不是越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842115", "t": 3, "q": "智慧水利系统中的边缘计算技术可在数据采集端就近处理数据，降低数据传输延迟。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边缘计算的特点就是在靠近数据源头的边缘侧对数据进行处理，能减少数据传输到中心节点的距离和时间，从而降低数据传输延迟，智慧水利系统中运用边缘计算技术也具备此优势。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842116", "t": 3, "q": "水库洪水调度中，设计洪水位一定高于防洪高水位。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水库洪水调度中，设计洪水位是水库遇到设计洪水时达到的最高水位，防洪高水位是水库承担下游防洪任务，遇到下游防护对象的设计标准洪水时的水位。一般情况下设计洪水标准高于下游防护对象设计标准洪水，所以设计洪水位通常高于防洪高水位。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842117", "t": 3, "q": "水电站水能规划中，采用年调节水库的水电站，其保证出力计算时，只需考虑设计枯水年的来水过程，无需考虑设计枯水段内的来水分配差异。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "采用年调节水库的水电站，在保证出力计算时，不仅要考虑设计枯水年的来水过程，也需考虑设计枯水段内的来水分配差异，因为不同的来水分配会影响水库调节及出力情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842118", "t": 3, "q": "数字水利技术中，GIS（地理信息系统）在水利工程选址中的应用，仅需叠加地形数据和水文数据即可确定最优选址方案，无需纳入生态敏感区、地质灾害风险区等空间数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "确定水利工程最优选址方案时，除地形和水文数据外，生态敏感区、地质灾害风险区等空间数据也非常关键，这些数据会影响选址的合理性与安全性等，所以仅叠加地形和水文数据是不够的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842119", "t": 3, "q": "智慧水利的智能监测系统中，对水库水位的监测预警阈值应采用固定值，无需根据季节、来水趋势及水库运行工况（如防洪、兴利）进行动态调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水库水位受季节、来水趋势和水库运行工况等多种因素影响，固定的监测预警阈值不能适应不同情况，应动态调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842120", "t": 3, "q": "水电站水能计算中，某水电站装机容量选择时，若其多年平均发电量E=P_avg*8760（P_avg为多年平均出力），则当P_avg增大20%时，装机容量也应同步增大20%才能满足发电需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多年平均发电量与多年平均出力的关系不能简单等同于装机容量与多年平均出力的关系。装机容量选择受多种因素影响，如保证出力、电力系统需求等，并非和多年平均出力成简单的同步比例关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842121", "t": 3, "q": "数字水利技术中的BIM（建筑信息模型）技术，在水利工程施工阶段的应用，仅能实现施工进度模拟，无法用于施工质量控制和施工安全风险预警。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BIM技术在水利工程施工阶段不仅能实现施工进度模拟，还可用于施工质量控制和施工安全风险预警等多方面工作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842122", "t": 3, "q": "水电站水能规划中，水库调度图的上基本调度线（防破坏线）仅用于防止水库水位过高导致坝体破坏，无需考虑水电站机组的最大过水能力限制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水库调度图的上基本调度线（防破坏线）不仅要防止水库水位过高导致坝体破坏，也需考虑水电站机组的最大过水能力限制，不然可能造成机组损坏等问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842123", "t": 3, "q": "数字水利技术中的大数据分析在流域洪水预报中，仅需输入历史洪水数据和实时降雨数据，即可实现高精度洪水预报，无需考虑下垫面（如植被覆盖、土壤湿度）的动态变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。流域洪水预报受多种因素影响，虽然历史洪水数据和实时降雨数据很重要，但下垫面的动态变化，像植被覆盖、土壤湿度等，会显著影响雨水的下渗、汇流等过程，对洪水预报精度有很大作用，不能不考虑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842124", "t": 3, "q": "智慧水利的智能决策系统在水电站机组优化运行中，仅需以发电量最大化为目标，无需考虑电力系统的负荷需求和电网频率稳定要求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利的智能决策系统在水电站机组优化运行时，不能仅以发电量最大化为目标，还必须考虑电力系统的负荷需求和电网频率稳定要求，否则会影响电网的稳定运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842125", "t": 3, "q": "水电站水能规划中，设计枯水年的选择应采用\"年径流量最小\"的年份，无需考虑该年份的径流年内分配是否为最不利情况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。设计枯水年选择时，不仅要考虑年径流量小，还需考虑径流年内分配是否为最不利情况，因为径流年内分配对水电站发电等运行影响很大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842126", "t": 3, "q": "数字水利技术中的物联网（IoT）在灌区灌溉监测中，仅需监测土壤含水率即可实现精准灌溉，无需监测作物生长阶段和气象数据（如蒸发量、降雨量）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "精准灌溉需要综合多方面因素，土壤含水率只是其中之一，作物在不同生长阶段对水分需求不同，气象数据如蒸发量、降雨量也会影响土壤水分状况，仅监测土壤含水率无法实现精准灌溉。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842127", "t": 3, "q": "智慧水利的协同管理平台中，不同部门（如水利管理局、水电站、灌区）的数据源格式不同，可通过人工手动转换数据格式实现数据共享，无需建立统一的数据标准和接口。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不同部门数据源格式不同，人工手动转换效率低且易出错，建立统一的数据标准和接口才是保障数据共享准确性、高效性和可持续性的关键，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842128", "t": 3, "q": "水电站水能计算中，若某水电站的水头H和流量Q均不变，其出力P=9.81*η*Q*H（η为机组效率）也将始终保持不变，与机组运行时间和维护状况无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然公式中水头H和流量Q不变，但机组效率η会受运行时间和维护状况影响，所以出力P并非始终不变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842129", "t": 3, "q": "数字水利技术中的数字孪生流域建设，其数字模型的验证仅需通过与历史实测数据的对比，无需进行实时工况下的动态验证。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生流域建设中，数字模型仅与历史实测数据对比是不够的，实时工况下的动态验证能反映模型在实际运行中的准确性和可靠性，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842130", "t": 3, "q": "智慧水利的智能控制在灌区闸门控制中，仅需根据土壤含水率阈值控制闸门开关，无需考虑渠道水流的滞后性和沿程损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在灌区闸门控制中，仅依据土壤含水率阈值控制闸门开关是不够的，渠道水流存在滞后性以及沿程损失等情况，这些因素会影响灌溉效果和水资源合理利用，必须加以考虑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842131", "t": 3, "q": "水电站水能规划中，水库的兴利库容等于正常蓄水位与死水位之间的库容，与水库的蒸发损失和渗漏损失无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842132", "t": 3, "q": "数字水利技术中的遥感技术在流域水土流失监测中，仅需通过卫星影像获取植被覆盖度数据，即可计算水土流失量，无需结合土壤类型和坡度数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "计算水土流失量是个复杂过程，仅靠卫星影像获取的植被覆盖度数据远远不够，必须结合土壤类型、坡度等数据综合分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842133", "t": 3, "q": "智慧水利的智能监测系统中，采用无人机巡检水利工程（如堤坝、渠道）时，仅需拍摄可见光影像即可识别工程缺陷（如裂缝、渗漏），无需使用红外热成像或激光雷达技术。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "可见光影像有局限性，难以发现一些被遮挡、不明显或内部的工程缺陷，而红外热成像可通过温度差异发现渗漏等问题，激光雷达能获取精确三维信息辅助检测，所以仅用可见光影像不能满足识别工程缺陷需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842134", "t": 3, "q": "水电站水能规划中，水电站的装机利用小时数等于多年平均年发电量除以装机容量，若装机利用小时数越高，则水电站的经济性越好，无需考虑电力系统的负荷特性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "装机利用小时数高虽一定程度反映发电设备利用程度高，但电力系统有负荷特性，如峰谷需求不同，若不考虑，即便装机利用小时数高，也可能因发电与负荷需求不匹配，造成电量浪费或供电不足，影响经济性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842135", "t": 3, "q": "数字水利技术中的数据安全防护，仅需对水利数据进行加密存储即可，无需建立数据访问权限管理和数据备份恢复机制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利技术的数据安全防护是多方面的，仅对水利数据加密存储远远不够，建立数据访问权限管理可防止非授权访问，数据备份恢复机制能在数据丢失或损坏时恢复数据，保障数据安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842136", "t": 3, "q": "智慧水利的智能决策系统在流域水资源优化配置中，仅需以水资源利用效率最大化为目标，无需考虑水资源的公平性和生态环境需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流域水资源优化配置要综合考量多方面因素，不能仅追求水资源利用效率最大化，还必须兼顾水资源分配的公平性以及生态环境需求，以实现可持续发展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842137", "t": 3, "q": "水电站水能规划中，采用日调节水库的水电站，其出力过程仅需根据当日来水流量确定，无需考虑电力系统的日负荷曲线变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。日调节水库水电站虽然能对一日内来水进行调节，但它需配合电力系统的日负荷曲线运行，在负荷高峰时多发电、负荷低谷时少发电，以满足系统需求，所以其出力过程要考虑电力系统日负荷曲线变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842138", "t": 3, "q": "数字水利技术中的BIM模型在水利工程运维阶段，仅需存储工程结构数据即可，无需更新设备运行数据、维护记录和病害缺陷数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在水利工程运维阶段，BIM模型不仅要存储工程结构数据，设备运行数据、维护记录和病害缺陷数据等对工程运维管理至关重要，需及时更新以保障工程正常运行和维护。", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842139", "t": 3, "q": "智慧水利的物联网监测设备在偏远山区水利站点部署时，仅需考虑设备的监测精度，无需考虑设备的供电方式和通信稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在偏远山区水利站点部署物联网监测设备，除监测精度外，供电方式很关键，因偏远山区电力供应可能不稳定，要保证设备有持续电力；通信稳定性也不可或缺，只有通信稳定才能及时准确传输监测数据。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842140", "t": 3, "q": "水电站水能计算中，某水电站的平均水头计算采用\"加权平均水头\"，即以上下游水位差的算术平均值作为平均水头，无需考虑流量的加权影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站平均水头计算采用加权平均水头时，需要考虑流量的加权影响，并非简单用上下游水位差算术平均值作为平均水头。", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842141", "t": 3, "q": "数字水利技术中的GIS空间分析在流域水土保持规划中，仅需分析水土流失现状即可，无需预测不同水土保持措施（如植树造林、修建梯田）实施后的水土流失变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在流域水土保持规划里，仅分析水土流失现状远远不够，预测不同水土保持措施实施后的水土流失变化，对评估措施有效性、优化规划方案至关重要。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842142", "t": 3, "q": "智慧水利的智能控制在水电站闸门控制中，仅需根据水库水位目标值控制闸门开度，无需考虑闸门的启闭速度和下游河道的水位变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在水电站闸门控制中，仅依据水库水位目标值控制闸门开度是不够的。闸门的启闭速度会影响水流冲击等情况，下游河道水位变化也关系到防洪、灌溉等多方面安全，都必须考虑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842143", "t": 3, "q": "水电站水能规划中，设计洪水的计算仅需采用历史洪水调查资料，无需结合暴雨资料进行洪水推求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设计洪水计算仅依靠历史洪水调查资料是不够的，还需结合暴雨资料进行洪水推求，这样能使计算结果更准确、可靠。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842144", "t": 3, "q": "数字水利技术中的大数据平台在水利数据处理中，仅需对数据进行清洗和存储即可，无需进行数据挖掘和知识发现。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水利技术里的大数据平台，数据处理不只是清洗和存储，数据挖掘和知识发现能从海量水利数据中提取有价值信息、规律和知识，对水利决策、管理等有重要意义，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842145", "t": 3, "q": "智慧水利的智能监测系统中，对河道流量的监测采用超声波流量计，其测量精度仅与流量计的硬件精度有关，无需考虑水流流态（如是否均匀流、有无漩涡）和安装位置。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超声波流量计测量精度不仅与硬件精度有关，水流流态（如是否均匀流、有无漩涡）和安装位置都会影响测量结果。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842146", "t": 3, "q": "水电站水能规划中，水电站的弃水流量仅与水库的入库流量和装机容量有关，与水库的防洪限制水位和兴利调度规则无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。水库的防洪限制水位和兴利调度规则会影响水库的蓄水和放水时机与水量。当处于防洪限制水位时，为保证防洪安全可能提前放水，影响弃水情况；兴利调度规则决定了如何根据不同用水需求调配水量，也会对弃水产生作用，并非仅与入库流量和装机容量有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842147", "t": 3, "q": "数字水利技术中的数字孪生流域模型在洪水模拟中，仅需采用一维水动力学模型即可，无需结合二维或三维模型。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "洪水模拟情况复杂，一维水动力学模型有局限性，仅用它不能全面准确模拟洪水，常需结合二维或三维模型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842148", "t": 3, "q": "智慧水利的智能运维系统在水电站设备运维中，仅需根据设备运行时间制定定期维护计划，无需结合设备运行状态数据和故障预警信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利的智能运维系统在水电站设备运维时，仅依据设备运行时间制定定期维护计划是不够的，结合设备运行状态数据和故障预警信息能更精准、高效地进行运维，及时发现潜在问题。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842149", "t": 3, "q": "水电站水能规划中，流域水资源总量等于流域内多年平均年降水量减去多年平均年蒸发量，该总量可全部用于水电站发电、农业灌溉等兴利用途，无需预留生态环境用水量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流域水资源总量计算方式基本正确，但不能全部用于兴利用途而不留生态环境用水量，生态用水是保障生态系统稳定的必要部分。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842150", "t": 3, "q": "数字水利技术中的遥感技术在水库库容监测中，仅需通过一次遥感测量获取水库水位和水面面积数据，即可计算水库库容，无需进行多次测量和校正。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实际中水库地形复杂且水位等情况会动态变化，仅一次遥感测量获取的数据有局限性，不能准确计算水库库容，需要多次测量和校正。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637288586842151", "t": 3, "q": "智慧水利的智能监测系统在水利工程安全监测中，仅需监测工程结构的位移、应力等物理指标，无需监测周边环境指标（如地下水位、岸坡稳定性、气象条件）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。水利工程安全受多种因素影响，周边环境指标如地下水位、岸坡稳定性、气象条件等，都会对工程结构的位移、应力等产生作用，影响工程安全。所以智能监测系统不仅要监测工程结构物理指标，也需监测周边环境指标。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第3章 智慧水利和数字水利技术||第6节 水电站水能规划（1）", "n": "第3章 智慧水利和数字水利技术 / 第6节 水电站水能规划（1）", "qs": [{"id": "2035637295356448768", "t": 1, "q": "智慧水利体系中，实现流域内水文、水质、工程状态等实时监测数据远距离、低时延传输的关键技术是以下哪项？", "a": ["大数据分析技术", "物联网（IoT）技术", "云计算技术", "人工智能推理技术", "", ""], "r": "B", "e": "物联网（IoT）技术可将各种设备连接，能实现流域内水文、水质、工程状态等实时监测数据的远距离、低时延传输。大数据分析主要用于数据处理和挖掘；云计算侧重于提供计算资源；人工智能推理技术用于智能决策等。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448769", "t": 1, "q": "在数字孪生水利系统构建中，其区别于传统水利模拟系统的核心特征是", "a": ["具备数据采集功能", "实现物理实体与虚拟模型的动态映射与交互反馈", "仅能进行静态水力特性计算", "主要依赖人工输入参数进行模拟", "", ""], "r": "B", "e": "数字孪生水利系统关键在于物理实体和虚拟模型能动态映射与交互反馈，这是区别传统水利模拟系统的核心。A选项数据采集传统系统也有；C选项数字孪生可动态计算非仅静态；D选项传统系统更依赖人工输入，数字孪生强调数据驱动。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448770", "t": 1, "q": "水电站水能规划中，计算水库保证出力时，需采用的水文资料系列长度应满足", "a": ["不少于10年", "不少于20年", "不少于30年", "不少于50年", "", ""], "r": "C", "e": "在水电站水能规划计算水库保证出力时，为使成果有一定可靠性和代表性，需采用不少于30年的水文资料系列长度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448771", "t": 1, "q": "下列哪种技术不属于数字水利技术体系中用于数据融合处理的关键技术", "a": ["边缘计算", "卡尔曼滤波", "小波变换", "地理信息系统（GIS）", "", ""], "r": "D", "e": "边缘计算、卡尔曼滤波、小波变换常用于数据融合处理。地理信息系统（GIS）主要是对地理空间数据进行采集、存储、管理、分析和显示等操作，并非数据融合处理的关键技术。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448772", "t": 1, "q": "某年调节水电站，其水库库容系数为15%，若该水电站所在河流多年平均径流量为20亿立方米，则其兴利库容约为", "a": ["1亿立方米", "3亿立方米", "5亿立方米", "7亿立方米", "", ""], "r": "B", "e": "库容系数是兴利库容与多年平均径流量的比值。已知库容系数为15%，多年平均径流量为20亿立方米，兴利库容 = 多年平均径流量×库容系数，即20×15% = 3亿立方米。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448773", "t": 1, "q": "数字水利系统中，针对水利数据安全的\"三重防护\"体系，不包括以下哪个层面", "a": ["应用安全", "网络安全", "物理安全", "人员安全", "", ""], "r": "D", "e": "数字水利系统“三重防护”体系通常指物理安全、网络安全、应用安全，人员安全不属于该体系。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448774", "t": 1, "q": "水电站水能规划中，当进行电力系统电力平衡计算时，水电站的工作容量确定需重点考虑", "a": ["水电站的最大出力", "电力系统的峰荷需求与水电站的调峰能力", "水电站的保证出力", "水电站的多年平均出力", "", ""], "r": "B", "e": "电力系统中水电站工作容量主要用于满足系统峰荷等需求，所以要重点考虑电力系统峰荷需求和水电站调峰能力。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448775", "t": 1, "q": "下列关于水利大数据分析技术在水库调度中的应用，说法错误的是", "a": ["可实现水库来水预报精度提升", "能优化水库泄洪与兴利供水的协同调度", "仅能处理结构化的水文监测数据", "可支撑水库调度方案的多情景模拟", "", ""], "r": "C", "e": "水利大数据分析技术不仅能处理结构化的水文监测数据，还能处理半结构化和非结构化数据，C说法错误。A、B、D选项都是水利大数据分析技术在水库调度中的合理应用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448776", "t": 1, "q": "某水电站水库为不完全年调节水库，其调节周期内的径流调节特点是", "a": ["能将全年来水完全按用水需求重新分配", "仅能调节部分季节的来水，无法满足枯水期全部用水需求", "调节周期超过一年，需跨年度调节来水", "仅能调节日内来水，无法调节季节来水差异", "", ""], "r": "B", "e": "不完全年调节水库不能将全年来水完全按用水需求重新分配，也不是跨年度调节，调节能力也不只是日内调节。它仅能调节部分季节来水，且不能满足枯水期全部用水需求。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448777", "t": 1, "q": "数字水利中的物联网技术，其在水利工程监测中的核心应用环节是", "a": ["数据存储与管理", "监测数据的实时传输与感知", "数据的可视化展示", "调度方案的决策支持", "", ""], "r": "B", "e": "物联网技术强调物与物、人与物的连接及信息交互。在水利工程监测里，关键是实时获取和传输监测数据，感知水利工程状态。A选项数据存储管理是后续环节；C选项可视化展示是呈现数据的方式；D选项调度方案决策支持依赖前面环节得出结果后进行。所以核心应用环节是监测数据的实时传输与感知，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448778", "t": 1, "q": "水电站水能规划中，进行经济评价时，计算财务内部收益率（FIRR）的基准是", "a": ["高于同期银行贷款利率", "等于水电站的投资利润率", "不低于行业基准收益率", "低于水库的年运行费用率", "", ""], "r": "C", "e": "财务内部收益率（FIRR）是使项目在计算期内各年净现金流量现值累计等于零时的折现率。进行经济评价时，FIRR需不低于行业基准收益率，这样项目在经济上才可行。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448779", "t": 1, "q": "下列哪种水利工程安全监测数据，更适合采用数字孪生技术进行动态预警分析", "a": ["水库水位的日平均数据", "大坝变形的实时连续监测数据", "河流流量的月统计数据", "降雨量的季度累计数据", "", ""], "r": "B", "e": "数字孪生技术强调对物理实体的实时映射和动态分析。实时连续监测数据能及时反映大坝变形情况，便于利用数字孪生技术进行动态预警。而日平均、月统计、季度累计数据时效性差，不利于动态预警。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448780", "t": 1, "q": "水电站水库的防洪高水位与设计洪水位的关系是", "a": ["防洪高水位高于设计洪水位", "防洪高水位低于设计洪水位", "两者相等", "取决于水库的防洪标准与下游保护对象", "", ""], "r": "B", "e": "设计洪水位是遇到设计洪水时水库达到的最高水位，防洪高水位是防御下游防护对象的设计洪水时水库达到的最高水位，通常设计洪水标准高于下游防护对象的设计洪水标准，所以防洪高水位低于设计洪水位。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448781", "t": 1, "q": "数字水利技术中，人工智能（AI）的深度学习算法，在水利预测中的主要优势是", "a": ["无需历史数据即可进行预测", "对非线性、复杂水文过程的拟合与预测精度更高", "仅能处理单一变量的预测问题", "计算速度比传统统计方法慢但精度高", "", ""], "r": "B", "e": "深度学习算法能处理复杂的非线性关系，在水利预测里对非线性、复杂水文过程的拟合与预测精度更高。A选项，深度学习需要历史数据训练；C选项，它能处理多变量问题；D选项，深度学习计算速度通常比传统统计方法快。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448782", "t": 1, "q": "某水电站的装机容量为100MW，多年平均发电量为40亿kWh，则该水电站的年利用小时数为", "a": ["4000h", "4500h", "5000h", "5500h", "", ""], "r": "A", "e": "年利用小时数 = 多年平均发电量÷装机容量，将装机容量100MW换算为10万千瓦，40亿kWh即40亿度，400000÷10 = 4000h。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448783", "t": 1, "q": "下列不属于数字水利\"智慧调度\"核心功能的是", "a": ["水库来水短期预报", "水电站机组检修计划制定", "防洪与兴利调度方案动态优化", "水资源供需平衡实时分析", "", ""], "r": "B", "e": "智慧调度主要围绕水利调度相关的实时性、动态性的功能。机组检修计划制定并非实时动态的调度核心功能，更偏向常规的计划性安排。而水库来水预报、调度方案优化、水资源供需平衡分析都直接与水利实时调度相关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448784", "t": 1, "q": "水电站水能规划中，当水库为多年调节时，其保证出力的计算方法通常采用", "a": ["时历法", "概率法", "经验公式法", "图解法", "", ""], "r": "B", "e": "多年调节水库调节周期长，水文系列资料多，概率法能考虑水文现象的统计特性来计算保证出力，更适合多年调节水库保证出力计算。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448785", "t": 1, "q": "数字水利系统中，数据传输环节采用的\"边缘计算\"技术，其主要目的是", "a": ["减少数据向云端传输的量，降低延迟", "替代云端的所有数据处理功能", "仅用于数据存储，不进行计算", "提高数据的公开共享程度", "", ""], "r": "A", "e": "边缘计算是在靠近物或数据源头的一侧进行数据处理，可减少需向云端传输的数据量，降低传输延迟。它不能替代云端所有功能；不仅用于存储还能计算；与提高数据公开共享程度无关。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448786", "t": 1, "q": "某水电站水库的死水位确定，主要考虑的因素不包括", "a": ["水电站机组的最小工作水头", "水库泥沙淤积的影响", "下游生态用水的最低水位要求", "水库的防洪库容大小", "", ""], "r": "D", "e": "死水位主要与保证机组运行、应对泥沙淤积及下游生态用水等有关。防洪库容大小与死水位确定无直接关联。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448787", "t": 1, "q": "下列关于水利区块链技术的应用，说法正确的是", "a": ["仅能用于水利工程建设的资金监管", "可实现水利数据的不可篡改与溯源", "无法与物联网技术结合使用", "对数据存储容量要求低于传统数据库", "", ""], "r": "B", "e": "区块链具有去中心化、不可篡改、可溯源等特性，能保障水利数据的真实性和完整性。A选项应用不止资金监管；C选项区块链可与物联网结合；D选项区块链对数据存储容量要求更高。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448788", "t": 1, "q": "水电站水能规划中，电力系统对水电站的调峰要求越高，其所需的", "a": ["保证出力越大", "工作容量越大", "备用容量越大", "重复容量越大", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448789", "t": 1, "q": "数字水利中的遥感技术（RS），在水利监测中的主要应用不包括", "a": ["水库淹没范围监测", "土壤含水量反演", "水电站机组振动监测", "河流岸线变化监测", "", ""], "r": "C", "e": "遥感技术主要用于大范围的地理信息监测等。A、B、D选项都属于大范围地理相关的监测内容。而水电站机组振动监测是针对具体设备的微观监测，不是RS技术在水利监测的主要应用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448790", "t": 1, "q": "某水电站的设计保证率为95%，其含义是", "a": ["该水电站在95%的年份内能满足保证出力", "该水电站在95%的时间内发电量达到设计值", "该水电站的大坝安全系数为95%", "该水电站的投资回收期为95%的设计年限", "", ""], "r": "A", "e": "设计保证率指水电站正常工作的保证程度。设计保证率为95%表示该水电站在95%的年份内能满足保证出力。B选项时间概念不准确；C选项大坝安全系数与此无关；D选项投资回收期也和设计保证率无关。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448791", "t": 1, "q": "数字水利系统的\"数据中台\"建设，其核心作用是", "a": ["实现水利数据的统一汇聚、治理与共享", "仅存储历史水利数据，不处理实时数据", "替代水利工程的现场监测设备", "仅为单一水利业务提供数据服务", "", ""], "r": "A", "e": "数据中台核心就是对数据统一汇聚、治理和共享，B 项应处理实时数据，C 项不能替代现场监测设备，D 项可服务多业务。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448792", "t": 1, "q": "水电站水库的兴利库容与防洪库容部分重叠时，这种库容称为", "a": ["死库容", "共用库容（防洪兴利结合库容）", "总库容", "备用库容", "", ""], "r": "B", "e": "当兴利库容与防洪库容部分重叠，该重叠部分库容就是防洪和兴利共同使用的，即共用库容（防洪兴利结合库容）。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448793", "t": 1, "q": "下列哪种算法不属于数字水利中用于水文预报的机器学习算法", "a": ["支持向量机（SVM）", "傅里叶变换", "随机森林（RF）", "长短期记忆网络（LSTM）", "", ""], "r": "B", "e": "支持向量机、随机森林、长短期记忆网络都常用于机器学习进行水文预报，而傅里叶变换是一种数学变换方法，不属于机器学习算法。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448794", "t": 1, "q": "水电站水能规划中，当计算水电站的多年平均发电量时，需考虑的因素不包括", "a": ["水库的调节性能", "水电站的装机容量", "河流的多年平均径流量", "水电站的水头损失", "", ""], "r": "B", "e": "多年平均发电量计算主要与来水量（河流多年平均径流量）、能量转换效率（涉及水头损失）和调节能力（水库调节性能）有关。装机容量是水电站的装机规模，不是计算多年平均发电量必须考虑的因素。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448795", "t": 1, "q": "数字水利系统的安全防护中，\"入侵检测系统（IDS）\"的主要功能是", "a": ["对传输数据进行加密", "监测网络中未经授权的访问与攻击行为", "限制用户对系统的访问权限", "对系统数据进行备份与恢复", "", ""], "r": "B", "e": "入侵检测系统（IDS）主要是用于监测网络环境中是否存在未经授权的访问和攻击行为。A选项数据加密不是其主要功能；C选项限制访问权限是访问控制相关功能；D选项数据备份与恢复和入侵检测无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448796", "t": 1, "q": "某多年调节水电站，其水库的调节周期为5年，在计算其保证出力时，应采用的水文系列长度至少为", "a": ["30年", "40年", "50年", "60年", "", ""], "r": "C", "e": "对于多年调节水电站，为使所选水文系列能较好反映径流多年变化规律，计算保证出力时水文系列长度应不小于调节周期的10倍。该水库调节周期为5年，10倍即50年。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448797", "t": 1, "q": "数字水利中的\"数字流域\"构建，其核心数据基础不包括", "a": ["流域地形地貌数据", "流域社会经济统计数据", "流域水文气象数据", "流域水利工程数据", "", ""], "r": "B", "e": "数字流域构建需围绕流域自然和水利相关的数据，社会经济统计数据并非构建数字流域的核心数据基础，而地形地貌、水文气象、水利工程数据与流域本身特性和水利情况紧密相关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808384", "t": 2, "q": "智慧水利体系的核心组成部分包括以下哪些？（　）", "a": ["智能监测感知系统", "数据传输与存储系统", "数值模拟与决策支持系统", "设备运维管理系统", "水文数据人工采集系统", ""], "r": "ABCD", "e": "智慧水利以信息化为支撑，智能监测感知、数据传输存储、数值模拟与决策支持都是其关键环节，设备运维管理保障系统正常运行。而水文数据人工采集不符合智慧水利自动化智能化特点。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808385", "t": 2, "q": "水电站水能规划中，影响水库兴利库容大小的因素有以下哪些？（　）", "a": ["流域年径流量及其年内分配", "水电站设计保证率", "下游用水部门的需水量", "水库的死水位", "水电站的装机容量", ""], "r": "ABCD", "e": "流域年径流量及其年内分配影响可利用水量和过程，设计保证率决定需满足供水的程度，下游用水部门需水量是兴利要满足的目标，水库死水位影响可调节水量范围，这些都会影响兴利库容。而水电站装机容量主要与发电能力相关，和兴利库容大小无直接关系。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808386", "t": 2, "q": "数字水利中，流域水动力模型的输入参数包括以下哪些？（　）", "a": ["流域地形数据（如DEM）", "河道糙率系数", "初始水位与初始流速", "降雨量与蒸发量", "污染物浓度初始值", ""], "r": "ABCD", "e": "流域水动力模型输入参数需涵盖地形、水流特性及外部影响等因素。A提供地形基础，B体现河道对水流阻碍，C是水流初始状态，D是重要外部因素。而E污染物浓度初始值与水动力模型核心水流运动关系不大。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808387", "t": 2, "q": "智慧水利中，物联网监测系统常用的感知设备包括以下哪些？（　）", "a": ["超声波流量计", "水质传感器（如pH传感器）", "无人机", "水文站人工观测记录本", "雷达水位计", ""], "r": "ABCE", "e": "物联网监测系统常用感知设备是能自动获取数据的仪器。A超声波流量计、B水质传感器、E雷达水位计可自动采集流量、水质、水位等数据；C无人机可从空中进行监测获取相关信息；而D水文站人工观测记录本是人工记录工具，不属于物联网感知设备。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808388", "t": 2, "q": "水电站水能规划中，梯级水电站联合调度的优势包括以下哪些？（　）", "a": ["提高流域整体发电量", "减少下游水库泥沙淤积", "更好地满足下游综合用水需求", "提高水电站群的防洪能力", "降低单个水电站的运行成本", ""], "r": "ACDE", "e": "梯级水电站联合调度可统一规划调配水资源，提高水能利用效率增加流域整体发电量，能更好协调各水库泄洪等提高防洪能力，还可统筹安排用水满足下游综合用水需求，且可优化调度降低单个电站运行成本，但对减少下游水库泥沙淤积作用不大。答案：ACDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808389", "t": 2, "q": "数字水利中，数据中台的核心功能包括以下哪些？（　）", "a": ["多源数据接入与格式标准化", "数据存储与管理", "数据共享与服务接口提供", "数据可视化展示", "数字孪生流域建模", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808390", "t": 2, "q": "智慧水利中，人工智能技术的应用场景包括以下哪些？（　）", "a": ["水文预报（如洪水预报）", "水电站设备故障诊断", "流域水资源优化配置", "水库泥沙淤积量人工测量", "河道水质自动监测", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808391", "t": 2, "q": "水电站水能规划中，确定设计洪水的方法包括以下哪些？（　）", "a": ["频率分析法（如适线法）", "水文比拟法", "暴雨推算法（如推理公式法）", "历史洪水调查法", "水库调度图法", ""], "r": "ABCD", "e": "确定设计洪水方法主要有根据流量资料用频率分析法（如适线法）、缺乏流量资料时用水文比拟法和暴雨推算法（如推理公式法）、结合历史洪水调查法。而水库调度图法是用于水库调度，并非确定设计洪水方法。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808392", "t": 2, "q": "数字水利中，流域水资源管理模型需要考虑的用水部门包括以下哪些？（　）", "a": ["生活用水", "农业灌溉用水", "工业用水", "水电站发电用水", "河道内生态用水", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808393", "t": 2, "q": "智慧水利中，应急指挥系统在应对水污染事件时的主要功能包括以下哪些？（　）", "a": ["预测污染物扩散路径与影响范围", "计算受污染水体的处理成本", "生成污染源排查方案", "制定受影响区域人员转移方案", "调度应急供水设备", ""], "r": "ACDE", "e": "应急指挥系统在水污染事件中，要掌握污染态势、排查源头、保障人员安全及调配资源。A可掌握污染扩散情况；C能找到污染源；D保障人员安全；E调配资源应对。而计算处理成本并非应急指挥主要功能。答案：ACDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808394", "t": 2, "q": "水电站水能规划中，水库防洪库容的确定需要参考的因素包括以下哪些？（　）", "a": ["设计洪水标准（如百年一遇洪水）", "下游河道安全泄量", "水库的总库容", "设计洪水的洪峰流量与洪水总量", "水电站的保证出力", ""], "r": "ABD", "e": "确定水库防洪库容要考虑设计洪水标准、下游河道安全泄量、设计洪水的洪峰流量与洪水总量。总库容与防洪库容确定无直接关联，水电站保证出力和防洪库容确定无关。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808395", "t": 2, "q": "数字水利中，遥感技术在流域监测中的应用包括以下哪些？（　）", "a": ["流域植被覆盖度监测", "水库水面面积变化监测", "河道水温监测", "土壤含水率反演", "水电站厂房建设进度监测", ""], "r": "ABD", "e": "遥感技术可对大面积区域进行监测，能获取地物光谱等信息。A选项植被有光谱特征可监测覆盖度；B选项水库水面在遥感影像上易识别其面积变化；D选项可通过特定光谱反演土壤含水率。C选项河道水温难以用遥感直接准确监测；E选项厂房建设进度细节遥感难以精准把握。答案为ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808396", "t": 2, "q": "智慧水利中，数据传输系统常用的通信方式包括以下哪些？（　）", "a": ["4G/5G移动通信", "卫星通信", "光纤通信", "有线电话通信", "蓝牙通信", ""], "r": "ABC", "e": "4G/5G、卫星、光纤都常用于智慧水利数据传输系统，能满足不同场景需求；有线电话通信速率低、不适用，蓝牙通信传输距离短也不适用于此系统。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808397", "t": 2, "q": "水电站水能规划中，\"保证率\"的含义包括以下哪些表述？（　）", "a": ["水电站在多年运行中，满足保证出力的年份占总年份的百分比", "水电站在枯水期，满足保证出力的天数占枯水期总天数的百分比", "下游用水部门在多年运行中，用水需求得到满足的年份占比", "水库在多年运行中，蓄水量达到兴利库容的年份占比", "水电站在年内运行中，发电量达到设计值的月份占比", ""], "r": "AC", "e": "保证率是指水电站在长期运行中，能够满足预定电力输出需求的概率或比例。它主要反映水电站在多年运行中的稳定性和可靠性。A选项：正确。它直接描述了水电站多年运行中满足保证出力的年份比例，符合保证率的定义。B选项：错误。保证率不是针对枯水期的特定比例，而是基于多年的总体情况。C选项：正确。从下游用水部门的角度，保证了其多年用水需求的满足程度，与保证率的综合考虑相符。D选项：错误。这描述的是水库蓄水量的情况，而非直接关于水电站的保证率。E选项：错误。这是关于年内的发电量情况，不是基于多年的保证率考量。综上所述，正确答案为AC。", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808398", "t": 2, "q": "数字水利中，边缘计算技术的应用优势包括以下哪些？（　）", "a": ["减少数据传输量，降低网络带宽压力", "提高数据处理时延，保证实时性", "避免核心数据上传，提高数据安全性", "降低对云端计算资源的依赖", "实现监测设备的本地控制与故障自愈", ""], "r": "ACDE", "e": "边缘计算在数字水利中，可在本地处理数据，减少上传量，降低带宽压力；能快速处理数据，保证实时性；本地处理避免核心数据上传，提高安全；减少对云端依赖；还可实现本地控制与故障自愈。答案：ACDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808399", "t": 2, "q": "智慧水利中，水电站厂房智能监测的监测内容包括以下哪些？（　）", "a": ["厂房结构振动加速度", "发电机定子绕组温度", "水库水位", "水轮机进口压力", "厂房周边山体位移", ""], "r": "ABDE", "e": "水电站厂房智能监测针对厂房自身及相关设备状态。A监测厂房结构安全性，B监测发电机关键部件温度，D监测水轮机运行压力；E监测厂房周边山体位移影响厂房安全。C水库水位不属于厂房智能监测内容。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808400", "t": 2, "q": "水电站水能规划中，年调节水库的调度方式包括以下哪些？（　）", "a": ["固定出力调度", "防洪优先调度", "发电优先调度", "综合利用调度", "死水位调度", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808401", "t": 2, "q": "数字水利中，流域水安全评估的指标类型包括以下哪些？（　）", "a": ["水资源量指标（如人均水资源量）", "防洪安全指标（如洪水重现期）", "水质安全指标（如COD达标率）", "水能利用指标（如装机容量年利用小时数）", "生态安全指标（如生态基流保证率）", ""], "r": "ABCE", "e": "流域水安全评估需从水资源、防洪、水质、生态等多方面考量，A选项人均水资源量反映水资源状况，B选项洪水重现期体现防洪能力，C选项COD达标率衡量水质，E选项生态基流保证率关乎生态安全，均是重要评估指标；而水能利用指标主要侧重于水能开发利用，并非水安全评估的直接指标。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808402", "t": 2, "q": "智慧水利中，大数据分析技术的应用包括以下哪些？（　）", "a": ["水文数据异常值识别", "流域水资源供需平衡分析", "水电站设备寿命预测", "数字孪生流域建模", "洪水风险等级划分", ""], "r": "ABCE", "e": "大数据分析技术可处理大量数据以挖掘信息和规律。A能从海量水文数据中识别异常；B可对流域水资源相关大数据分析实现供需平衡分析；C可根据设备运行大数据预测寿命；E能依据历史洪水数据等划分风险等级。而数字孪生流域建模侧重于构建物理实体的虚拟映射，并非大数据分析技术的直接应用。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808403", "t": 2, "q": "水电站水能规划中，影响水电站保证出力的因素包括以下哪些？（　）", "a": ["流域枯水期径流量", "水电站的水头（坝高）", "水轮机的效率", "下游河道的最小生态流量", "水电站的装机容量", ""], "r": "ABCD", "e": "保证出力是指水电站在一定保证率下能发出的平均出力，流域枯水期径流量影响发电水量，水头影响能量转换，水轮机效率影响能量转化效率，下游河道最小生态流量限制了可用于发电的水量，这些都会影响保证出力；而装机容量是水电站的最大发电能力，与保证出力无直接关联。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808404", "t": 2, "q": "数字水利中，物联网监测系统的抗干扰措施包括以下哪些？（　）", "a": ["采用屏蔽线缆减少电磁干扰", "数据传输采用加密协议", "设置数据重传机制减少传输误差", "选用抗恶劣环境的传感器（如防水、防尘）", "定期校准传感器减少测量误差", ""], "r": "ACDE", "e": "A选项屏蔽线缆可减少电磁干扰；B选项加密协议主要保障数据安全，并非抗干扰；C选项数据重传机制可减少传输干扰导致的误差；D选项抗恶劣环境传感器能应对外界干扰；E选项校准传感器可减少测量误差，也属于抗干扰措施。答案选ACDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808405", "t": 2, "q": "智慧水利中，流域水资源优化配置的目标包括以下哪些？（　）", "a": ["水资源利用效率最大化", "各用水部门需求满足程度最大化", "流域生态环境损害最小化", "水电站发电量最大化", "防洪成本最小化", ""], "r": "ABC", "e": "流域水资源优化配置要综合考虑多方面效益，A利用效率最大化、B满足各用水部门需求、C使生态环境损害最小化都是合理目标；D只侧重于水电站发电，太片面；E防洪成本并非水资源优化配置核心目标。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808406", "t": 2, "q": "水电站水能规划中，水库泥沙淤积的防治措施包括以下哪些？（　）", "a": ["设置拦沙坝", "水库定期泄空排沙", "提高水库运行水位", "采用清淤机械进行水库清淤", "减少水电站发电量", ""], "r": "ABD", "e": "设置拦沙坝可拦截泥沙，减少入库泥沙量；水库定期泄空排沙能将库内泥沙排出；用清淤机械清淤可直接去除水库泥沙。提高水库运行水位与防治泥沙淤积无关；减少发电量不能防治泥沙淤积。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808407", "t": 2, "q": "数字水利技术体系中，用于水利工程结构健康诊断的关键技术包括（　）", "a": ["物联网监测技术", "有限元分析技术", "大数据挖掘技术", "遥感影像解译技术", "人工巡检技术", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808408", "t": 2, "q": "水电站水能规划中，影响水库正常蓄水位确定的主要因素有（　）", "a": ["水电站的最大水头", "水库的淹没损失与移民安置成本", "下游河道的通航水位要求", "水库的泥沙淤积速率", "电力系统的负荷需求", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808409", "t": 2, "q": "数字水利系统中，数据质量控制的主要措施包括（　）", "a": ["数据异常值检测与修正", "数据冗余度增加", "数据格式标准化", "数据时效性校验", "数据来源可靠性验证", ""], "r": "ACDE", "e": "数据异常值影响分析准确性需检测修正；标准化格式利于数据处理；校验时效性保证数据可用；验证来源可靠性确保数据真实。而增加数据冗余度会浪费资源并非质量控制措施。答案：ACDE", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808410", "t": 2, "q": "水电站水库防洪调度中，常用的调度方式包括（　）", "a": ["固定泄量调度", "防洪库容调度", "预泄调度", "实时调度", "发电优先调度", ""], "r": "ABCD", "e": "固定泄量调度、防洪库容调度、预泄调度、实时调度都是水电站水库防洪调度常用方式，发电优先调度主要侧重于发电，不是防洪调度方式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808411", "t": 2, "q": "数字水利中的人工智能技术，在水资源管理中的应用场景包括（　）", "a": ["区域水资源供需平衡预测", "水资源污染溯源分析", "水利工程建设进度管理", "农业灌溉用水量优化分配", "水电站机组故障诊断", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808412", "t": 2, "q": "水电站水能规划中，计算水电站保证出力时，需考虑的水文要素有（　）", "a": ["河流多年平均流量", "枯水期最小流量", "水文系列的变差系数", "洪水期最大流量", "径流的年内分配规律", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808413", "t": 2, "q": "数字水利系统的网络架构包括（　）", "a": ["感知层", "网络层", "平台层", "应用层", "管理层", ""], "r": "ABCD", "e": "数字水利系统网络架构通常包含感知层、网络层、平台层和应用层。感知层负责数据采集，网络层实现数据传输，平台层进行数据处理和存储，应用层提供各种水利业务应用。管理层不属于其网络架构范畴。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630592", "t": 3, "q": "智慧水利中的\"数据同化技术\"是通过融合观测数据与数值模型模拟结果，修正模型初始场，从而提高水文预报精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据同化技术确实是将观测数据和数值模型模拟结果融合，对模型初始场进行修正，以此来提升水文预报的精度。", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630593", "t": 3, "q": "水电站水能规划中，\"装机容量年利用小时数\"越大，说明水电站的发电效率越高，经济效益越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "装机容量年利用小时数大，意味着机组满负荷运行时间长，但不能直接说明发电效率高、经济效益好，因为它未考虑发电成本、电价等因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630594", "t": 3, "q": "数字水利中，流域水动力模型的计算网格空间分辨率越高，模型计算精度一定越高，且计算效率不受影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "网格空间分辨率高，模型能更精细地描述流域情况，理论上计算精度会提高，但分辨率提高会使计算量大幅增加，计算效率会受影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630595", "t": 3, "q": "智慧水利监测系统中，雷达水位计因采用非接触式测量，可完全不受暴雨、大雾等恶劣天气的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "雷达水位计虽为非接触式测量，但暴雨、大雾等恶劣天气会对雷达波的传播产生干扰，不能完全不受影响。", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630596", "t": 3, "q": "数字水利中，\"数据中台\"的主要作用是存储流域内所有水文监测数据，不具备数据处理与共享功能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据中台不仅能存储数据，还具备强大的数据处理与共享功能，题干说不具备此功能错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630597", "t": 3, "q": "智慧水利中，人工智能技术可直接用于水电站的长期（10年以上）水能规划，无需结合水文数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水能规划受水文条件影响极大，人工智能技术用于水电站长期水能规划必须结合水文数据，不能脱离。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630598", "t": 3, "q": "水电站水能规划中，水库死库容的主要作用是预留泥沙淤积空间，保障水电站进水口正常取水。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630599", "t": 3, "q": "数字水利中，遥感技术可直接获取流域内任意地点的土壤含水率，无需结合其他模型反演。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "遥感技术难以直接获取流域内任意地点的土壤含水率，通常需要结合其他模型进行反演。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630600", "t": 3, "q": "智慧水利中，应急指挥系统在应对洪水时，应优先保证水电站的发电量，再考虑下游防洪安全。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利应急指挥系统应对洪水时，首要任务是保障人民生命财产安全和下游防洪安全，而不是优先保证水电站发电量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630601", "t": 3, "q": "水电站水能规划中，梯级水电站联合调度时，上游水电站下泄的水量可完全被下游水电站利用，无水量损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在实际梯级水电站联合调度中，存在蒸发、渗漏等情况，上游水电站下泄的水量不能完全被下游水电站利用，会有水量损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630602", "t": 3, "q": "数字水利中，物联网网关的核心功能是将不同传感器的异构数据转换为统一通信协议，实现与数据中台的通信。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "物联网网关在数字水利里，其重要作用就是把不同传感器的异构数据进行转换，使其遵循统一通信协议，进而和数据中台实现通信。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630603", "t": 3, "q": "智慧水利中，水文数据异常值识别只能通过人工排查，无法通过大数据分析技术自动识别。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在智慧水利中，大数据分析技术能凭借算法和模型对大量水文数据进行快速处理，可自动识别出数据中的异常值，并非只能依靠人工排查。", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630604", "t": 3, "q": "水电站水能规划中，设计洪水标准越高（如百年一遇vs五十年一遇），水库的防洪库容越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "设计洪水标准越高，意味着要抵御更大规模的洪水，为了能有效拦蓄洪水，就需要更大的防洪库容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630605", "t": 3, "q": "数字水利中，流域水资源管理模型的\"供需平衡计算\"仅需考虑生活、农业、工业用水，无需考虑生态用水。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流域水资源管理模型的“供需平衡计算”需要全面考虑各类用水，生态用水是水资源合理配置和可持续利用的重要组成部分，不能被忽略。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630606", "t": 3, "q": "智慧水利中，超声波流量计因直接接触水体，测量精度不受水流流速分布不均匀的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。超声波流量计不直接接触水体，且它测量精度会受水流流速分布不均匀的影响。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630607", "t": 3, "q": "水电站水能规划中，\"保证出力\"是指水电站在全年运行中，每天都能达到的最小出力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "保证出力是指水电站在多年运行期间所能提供的具有一定保证率的平均出力，并非全年每天都能达到的最小出力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630608", "t": 3, "q": "数字水利中，边缘计算技术可在监测点本地处理数据，减少数据上传量，降低网络带宽压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边缘计算的特点就是在靠近数据源的边缘侧对数据进行处理，能减少需上传到云端的数据量，从而降低网络带宽压力，在数字水利监测场景中同样适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630609", "t": 3, "q": "智慧水利中，数字孪生流域可实时映射物理流域的状态，但无法对未来流域变化进行预测。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生流域不仅能实时映射物理流域的状态，还具备对未来流域变化进行预测的能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630610", "t": 3, "q": "水电站水能规划中，水库防洪库容与兴利库容不能重叠，需完全分开设置。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水库防洪库容与兴利库容存在部分重叠的情况，即共用库容，并非完全分开设置。", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630611", "t": 3, "q": "数字水利中，数据质量控制的\"逻辑一致性检查\"是指检查同一监测点的水位与流量数据是否符合水位流量关系曲线。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "逻辑一致性检查可通过检查同一监测点水位与流量数据是否契合水位流量关系曲线来进行，这属于逻辑一致性检查范畴。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630612", "t": 3, "q": "智慧水利中，卫星通信因覆盖范围广，可作为偏远山区水利监测数据传输的唯一通信方式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然卫星通信覆盖范围广，但不是偏远山区水利监测数据传输的唯一通信方式，还可以有无线自组网等其他方式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630613", "t": 3, "q": "水电站水能规划中，水电站的最大出力等于装机容量，与水文条件无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站最大出力受装机容量和水文条件等多因素影响，当来水不足等水文情况不佳时，即便有装机容量，也无法达到该容量对应的出力。所以题干说与水文条件无关错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630614", "t": 3, "q": "数字水利中，流域水安全评估模型需包含水资源、防洪、水质、生态等多维度指标，不能仅单一维度评估。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流域水安全涉及水资源、防洪、水质、生态等多个方面，单一维度评估不能全面反映流域水安全状况，所以评估模型需包含多维度指标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630615", "t": 3, "q": "智慧水利中，水电站设备状态智能诊断系统可在设备发生故障后，自动生成维修方案并完成维修。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "目前智慧水利中，水电站设备状态智能诊断系统虽能诊断设备故障，但自动生成维修方案并完成维修，以现有技术还难以实现，维修通常还需人工参与操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630616", "t": 3, "q": "水电站水能规划中，年径流量的多年平均值是确定水电站装机容量的唯一依据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "确定水电站装机容量需考虑年径流量多年平均值，但不是唯一依据，还受水头、调节性能、用电需求、投资成本等多种因素影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630617", "t": 3, "q": "数字水利中，水动力模型的河道糙率系数越大，模拟的河道水流流速越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水动力模型里，糙率系数反映河道边界对水流的阻碍作用，糙率系数越大，水流受到的阻力越大，流速就越小。", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630618", "t": 3, "q": "智慧水利中，大数据分析技术可用于挖掘水文数据中的隐藏规律，如降雨与径流的滞后关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数据分析技术具备强大的数据处理和挖掘能力，能从海量水文数据里发现隐藏规律，降雨与径流的滞后关系这类规律可通过其挖掘得出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630619", "t": 3, "q": "水电站水能规划中，水库泄洪会导致水资源浪费，应尽量避免泄洪。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。水库泄洪有多种原因，比如遭遇洪水时为保证大坝安全、维持下游生态用水等。合理泄洪是保障水利工程安全和生态平衡的必要措施，并非水资源浪费，不能一味避免。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630620", "t": 3, "q": "数字水利中，\"流域水质模拟模型\"的模拟结果精度仅取决于模型参数的准确性，与边界条件无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流域水质模拟模型的模拟结果精度不仅取决于模型参数准确性，边界条件也会对其产生重要影响，如输入的污染物浓度、水流流量等边界条件会直接影响模拟结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630621", "t": 3, "q": "智慧水利中，监测设备的供电方式仅需考虑电力供应稳定性，无需考虑能耗与成本。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利中，监测设备供电不仅要考虑电力供应稳定性，能耗和成本也是重要考量因素，需综合平衡。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630622", "t": 3, "q": "水电站水能规划中，下游河道的最小生态流量应小于水电站的最小下泄流量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "为保障下游河道生态环境，水电站最小下泄流量需满足下游河道最小生态流量要求，所以下游河道的最小生态流量应小于等于水电站的最小下泄流量。题目表述不准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630623", "t": 3, "q": "数字水利中，分布式水文模型因考虑流域下垫面空间异质性，模拟精度一定高于概念性水文模型。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然分布式水文模型考虑了流域下垫面空间异质性，但模拟精度受多种因素影响，不能绝对地说其一定高于概念性水文模型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630624", "t": 3, "q": "智慧水利中，数据共享服务接口应向所有用户开放，无需设置访问权限控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利的数据涉及水利设施、水资源等敏感信息，向所有用户开放且不设访问权限控制会带来数据安全和隐私风险，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630625", "t": 3, "q": "水电站水能规划中，装机容量利用率越高，说明水电站的运行管理水平越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "装机容量利用率高可能受多种因素影响，如电站所处水文条件、设计装机容量是否合理等，不能单纯认为是运行管理水平高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630626", "t": 3, "q": "数字水利中，物联网传感器采集的数据可直接用于数值模型计算，无需进行数据预处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网传感器采集的数据往往存在误差、噪声、不完整等问题，直接用于数值模型计算会影响结果准确性，所以通常需要进行数据预处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630627", "t": 3, "q": "智慧水利中，人工智能故障诊断模型需定期用新的故障数据训练，以适应设备老化带来的故障特征变化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "设备会随使用而老化，故障特征也会改变，定期用新故障数据训练人工智能故障诊断模型，能让其适应这种变化，提高诊断准确性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630628", "t": 3, "q": "水电站水能规划中，水库总库容等于兴利库容、防洪库容与死库容之和，三者无重叠。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水库总库容等于兴利库容、防洪库容与死库容之和，但三者可能存在重叠部分，并非无重叠。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630629", "t": 3, "q": "数字水利中，流域水动力模型可直接用于预测污染物在河道中的扩散路径与浓度变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流域水动力模型主要模拟水流运动，虽对污染物扩散有一定关联，但不能直接用于预测污染物扩散路径与浓度变化，还需结合水质模型等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630630", "t": 3, "q": "智慧水利中，流域水资源优化配置的目标是实现各用水部门的用水量最大化，无需考虑水资源总量约束。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流域水资源优化配置需在水资源总量约束下进行，要综合考虑多方面因素，平衡各用水部门需求，而非单纯让各用水部门用水量最大化。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第3章 智慧水利和数字水利技术||第6节 水电站水能规划（2）", "n": "第3章 智慧水利和数字水利技术 / 第6节 水电站水能规划（2）", "qs": [{"id": "2035637305045291008", "t": 1, "q": "水电站水能规划中，当水电站承担电力系统的基荷运行时，其特点是", "a": ["出力波动大，年利用小时数低", "出力稳定，年利用小时数高", "仅在白天运行，夜间停机", "主要在枯水期运行，丰水期停机", "", ""], "r": "B", "e": "承担基荷运行意味着要为系统提供稳定的电力，所以出力稳定；且持续运行时间长，年利用小时数高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291009", "t": 1, "q": "水电站水能规划中，计算某一设计水平年水电站保证出力时，需重点参考的水文资料是以下哪项？", "a": ["该年份的最大洪峰流量", "该年份的年平均径流量", "该年份的枯水期月平均径流量", "该年份的年输沙量", "", ""], "r": "C", "e": "水电站保证出力是在一定保证率下能发出的平均出力，枯水期流量决定了水电站发电能力下限，所以计算保证出力重点参考枯水期月平均径流量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291010", "t": 1, "q": "数字水利中，构建流域水动力数值模型时，以下哪项参数对模型计算精度的影响最大（不考虑边界条件）？", "a": ["流域平均植被覆盖率", "计算网格的空间分辨率", "模型的时间步长设置", "土壤饱和含水率", "", ""], "r": "B", "e": "计算网格的空间分辨率直接影响对流域地形、水流等特征的刻画精细程度，对模型计算精度影响最大。而流域平均植被覆盖率、土壤饱和含水率是局部影响因素；时间步长设置虽重要，但不如网格分辨率影响大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291011", "t": 1, "q": "智慧水利的\"智能决策\"环节中，用于解决水电站短期（1-3天）发电调度优化问题的常用算法是以下哪项？", "a": ["遗传算法", "支持向量机（SVM）", "反向传播（BP）神经网络", "粒子群优化算法（PSO）", "", ""], "r": "D", "e": "粒子群优化算法（PSO）常用于解决水电站短期发电调度优化这类复杂优化问题，能高效搜索最优解。遗传算法一般用于复杂组合优化；支持向量机多用于分类和回归；反向传播神经网络常用于机器学习中的模式识别等。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291012", "t": 1, "q": "水电站水能规划中，当流域内存在多个梯级水电站时，进行梯级联合水能计算的核心原则是以下哪项？", "a": ["上游水电站优先满足自身装机容量需求", "下游水电站优先保障灌溉用水需求", "梯级整体发电量最大化与水资源高效利用", "各水电站分别按自身保证出力单独计算", "", ""], "r": "C", "e": "多个梯级水电站联合水能计算目的是综合利用水资源，要追求梯级整体效益，核心就是梯级整体发电量最大化与水资源高效利用。A只考虑上游自身装机、B只关注下游灌溉、D各算各的都不能体现联合计算优势。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291013", "t": 1, "q": "数字水利系统中，\"数字孪生流域\"与传统流域数值模型的最主要区别在于以下哪项？", "a": ["是否使用GIS地图作为底图", "是否实现物理流域与虚拟流域的实时动态交互", "是否包含水文数据采集模块", "是否能进行洪水演进模拟", "", ""], "r": "B", "e": "数字孪生流域强调物理流域与虚拟流域实时动态交互，这是和传统流域数值模型最关键区别。A选项GIS地图只是工具；C选项水文数据采集模块不是本质差异；D选项洪水演进模拟传统模型也可实现。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291014", "t": 1, "q": "智慧水利监测系统中，监测河道水位时，若需实现无人值守、高精度（误差≤1cm）且适应复杂气候条件，应选用以下哪种传感器？", "a": ["浮子式水位计", "超声波水位计", "雷达水位计", "压力式水位计", "", ""], "r": "C", "e": "雷达水位计不受气候、水面漂浮物等影响，能实现无人值守，测量精度高（误差可≤1cm）。浮子式水位计需人工维护；超声波水位计受环境影响大；压力式水位计精度受多种因素影响较大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291015", "t": 1, "q": "水电站水能规划中，\"装机容量年利用小时数\"的计算公式是以下哪项（H为年利用小时数，E为年发电量，P为装机容量）？", "a": ["H=E×P/1000", "H=E/(P×1000)", "H=P×1000/E", "H=E/(P×8760)", "", ""], "r": "B", "e": "装机容量年利用小时数指假设机组按装机容量满负荷运行时，发出年发电量所需的小时数，其公式为年发电量除以装机容量，即H = E / P。本题无此选项，但原理是这样，可看出B选项符合量纲关系。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637305045291016", "t": 1, "q": "数字水利中
