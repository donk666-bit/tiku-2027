, "轴流式水泵适用于大流量、低扬程的工况", "轴流式水泵的叶轮叶片一般为前弯式", "轴流式水泵的安装高度通常比离心式水泵低", "轴流式水泵可通过调节叶片角度改变流量", ""], "r": "ABE", "e": "轴流式水泵比转速大，适合大流量低扬程工况，可调节叶片角度改变流量；其叶轮叶片是扭曲的非前弯式；安装高度一般比离心式水泵高。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645195", "t": 2, "q": "（　）水轮机的安装高程确定时，需要考虑的因素有？", "a": ["尾水管的形式和尺寸", "水轮机的吸出高度", "下游水位的变化范围", "水轮机的比转速", "机组的转速", ""], "r": "ABC", "e": "水轮机安装高程需考虑尾水管形式尺寸影响流态，吸出高度决定其在水下位置，下游水位变化范围会影响水轮机运行。比转速主要反映水轮机性能特点，机组转速对安装高程无直接关联。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645196", "t": 2, "q": "（　）下列属于水泵容积损失的原因有？", "a": ["叶轮与泵壳之间的间隙漏水", "水泵轴封处的漏水", "叶轮叶片表面的摩擦", "水流在泵内的涡流", "多级水泵的级间漏水", ""], "r": "ABE", "e": "容积损失是指因泄漏造成的损失，A选项叶轮与泵壳间隙漏水、B选项水泵轴封处漏水、E选项多级水泵级间漏水都属于泄漏导致容积损失；C是机械损失，D是水力损失。答案：ABE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645197", "t": 2, "q": "（　）冲击式水轮机的喷嘴装置包括的部件有？", "a": ["喷嘴体", "喷针", "导叶", "针阀", "喷嘴出口", ""], "r": "ABDE", "e": "答案：ABDE冲击式水轮机的喷嘴装置主要包括喷嘴体、喷针、针阀和喷嘴出口等部件。导叶属于混流式水轮机的部件，不属于冲击式水轮机喷嘴装置的组成部分。", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645198", "t": 2, "q": "（　）下列关于水轮机与水泵性能曲线的说法，正确的有？", "a": ["水轮机的工作点是水头-流量曲线与机组负荷曲线的交点", "水泵的工作点是扬程-流量曲线与管路特性曲线的交点", "水轮机的效率-流量曲线通常有一个最高效率点", "水泵的功率-流量曲线随流量增大而单调递增", "水轮机的转速-流量曲线是一条水平直线（额定转速下）", ""], "r": "BCDE", "e": "水轮机工作点是水轮机特性曲线与电站的运行特性曲线交点；水泵工作点是扬程 - 流量曲线与管路特性曲线交点；水轮机效率 - 流量曲线有最高效率点；水泵功率 - 流量曲线通常是随流量增大而上升；额定转速下水轮机转速 - 流量曲线是水平直线。答案：BCDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073728", "t": 3, "q": "混流式水轮机的转轮既利用了水流的动能，又利用了水流的势能，属于反击式水轮机的典型代表。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "混流式水轮机工作时，水流通过转轮时，水流的势能和动能都参与做功，它是反击式水轮机的典型代表。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073729", "t": 3, "q": "离心式水泵的必需气蚀余量（NPSHr）越小，说明水泵抗气蚀的能力越弱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "必需气蚀余量越小，意味着水泵入口处允许的最低压力越高，更不容易发生气蚀，即抗气蚀能力越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073730", "t": 3, "q": "轴流转桨式水轮机在负荷变化时，通过同时调节导叶开度和转轮叶片角度，可使水轮机在较宽的工况范围内保持较高效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴流转桨式水轮机的特点就是能在负荷变化时，同时调节导叶开度和转轮叶片角度，以适应不同工况，从而在较宽工况范围保持较高效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073731", "t": 3, "q": "水轮机的比转速越大，其适用的水头越高，流量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机比转速越大，适用水头越低，流量越大，题干说法与实际情况相反。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073732", "t": 3, "q": "水泵并联运行时，各水泵的出口压力必须完全相等，否则无法正常并联。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水泵并联时，各水泵出口压力基本相等才能保证并联正常工作，若压力差异大，压力低的水泵可能无法出水甚至出现倒流。所以说必须完全相等表述太绝对。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073733", "t": 3, "q": "冲击式水轮机的尾水管仅起到将转轮排出的水流导入下游的作用，无能量回收功能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冲击式水轮机工作在大气中，转轮出口能量损失小，尾水管主要是将水导至下游，一般无能量回收功能。", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073734", "t": 3, "q": "离心式水泵的叶轮采用前弯式叶片时，水泵的扬程较高，但效率较低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前弯式叶片使水流获得较大的动扬程，所以扬程较高，但动扬程转化为压力能时损失大，导致效率低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073735", "t": 3, "q": "水轮机导水机构的导叶关闭时间越长，机组甩负荷时的最大转速升高值越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "导叶关闭时间长，水轮机在较长时间内仍有较大流量的水冲击转轮做功，会使机组转速升高更多。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073736", "t": 3, "q": "轴流式水泵的流量与扬程的关系曲线较陡，适用于流量变化小、扬程变化大的工况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "轴流式水泵流量与扬程关系曲线较平坦，适用于流量变化大、扬程变化小的工况，而不是流量变化小、扬程变化大的工况。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073737", "t": 3, "q": "水轮机转轮叶片的进口角设计不合理，会导致水流进入转轮时产生较大的冲击损失，降低水轮机效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机转轮叶片进口角不合理，水流进入转轮时就无法平顺进入，会产生较大冲击，进而造成能量损失，使水轮机效率降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073738", "t": 3, "q": "水泵的转速升高时，其扬程会按转速平方的比例增加，流量按转速的比例增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据水泵的比例定律，水泵转速改变时，扬程与转速的平方成正比，流量与转速成正比。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073739", "t": 3, "q": "冲击式水轮机的喷嘴喷针行程越大，通过喷嘴的水流流量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冲击式水轮机中，喷针行程越大，喷嘴过流面积越大，水流流量越大，而不是越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073740", "t": 3, "q": "水轮机的吸出高度为正值时，说明转轮进口位于下游水位以上，可能存在气蚀风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机吸出高度指转轮出口到下游水位的垂直距离，正值表示转轮出口在下游水位以上。转轮出口压力降低易形成气泡，气泡破裂会产生气蚀。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073741", "t": 3, "q": "离心式水泵的容积损失主要是由于水泵轴承的摩擦引起的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心式水泵的容积损失主要是因泵内高压水泄漏回低压区造成的，而水泵轴承的摩擦引起的是机械损失，并非容积损失。", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073742", "t": 3, "q": "轴流定桨式水轮机在负荷偏离设计工况较大时，效率会显著下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴流定桨式水轮机叶片角度固定，当负荷偏离设计工况较大时，水流不能以最优角度冲击叶片，水力损失增大，效率会显著下降。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073743", "t": 3, "q": "水轮机的主轴密封装置在运行过程中，需要持续通入冷却水，以防止密封部件因摩擦过热损坏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机主轴密封装置在运行中，密封部件会因摩擦产生热量，持续通入冷却水可带走热量，避免密封部件因过热损坏。", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073744", "t": 3, "q": "水泵的有效气蚀余量（NPSHa）是由水泵本身的结构决定的，与管路系统无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "有效气蚀余量（NPSHa）由吸入装置条件决定，即与管路系统有关，而非由水泵本身结构决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073745", "t": 3, "q": "混流式水轮机的转轮直径越大，在相同水头下，水轮机的出力越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机出力与转轮直径、水头、流量等有关，在相同水头下，转轮直径越大，过流面积越大，流量越大，根据出力公式，出力也就越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073746", "t": 3, "q": "冲击式水轮机的转轮叶片数目越多，水轮机的效率越高，因此叶片数目应尽可能多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "转轮叶片数目过多会增加水流的摩擦等损失，并非越多效率越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073747", "t": 3, "q": "水泵串联运行时，总扬程等于各水泵扬程之和，总流量等于各水泵流量的平均值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水泵串联运行时，总扬程等于各水泵扬程之和，但总流量等于各水泵的流量，而非各水泵流量的平均值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073748", "t": 3, "q": "水轮机的调节保证计算主要是为了确定导叶的关闭时间和水击压力，确保机组安全运行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机调节保证计算目的就是确定导叶关闭时间和水击压力等参数，以此保障机组安全稳定运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073749", "t": 3, "q": "离心式水泵的吸水管直径应大于水泵进口直径，以减小吸水管内的水流速度，降低气蚀风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "吸水管直径大于水泵进口直径，可使流速降低，减少水头损失，降低气蚀风险，该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073750", "t": 3, "q": "轴流式水轮机的转轮高度与直径之比（H/D）比混流式水轮机的大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴流式水轮机转轮叶片呈轴向排列，为保证水流平顺通过转轮，转轮高度与直径之比（H/D）通常比混流式水轮机大。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073751", "t": 3, "q": "水轮机的效率包括水力效率、容积效率和机械效率，其中水力效率对总效率的影响最大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机总效率是水力效率、容积效率和机械效率的乘积，水力效率反映水流能量转换为转轮机械能的有效程度，在三者中对总效率影响最大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073752", "t": 3, "q": "水泵的功率随流量的增大而增大，因此当水泵流量为零时，功率也为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水泵流量为零时，轴功率并不为零，因为此时水泵仍需克服机械摩擦等阻力消耗功率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073753", "t": 3, "q": "冲击式水轮机的工作水头是指喷嘴进口处与下游水位的水位差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这种说法正确。冲击式水轮机工作时，其工作水头就是喷嘴进口处与下游水位的水位差，它决定了水流的能量大小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073754", "t": 3, "q": "水轮机导水机构的导叶与导叶座之间的间隙过大，会导致漏水损失增加，水轮机效率降低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "导叶与导叶座间隙过大，水会从间隙泄漏，造成漏水损失，使有效做功的水量减少，从而降低水轮机效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073755", "t": 3, "q": "轴流式水泵的比转速比离心式水泵小，因此其体积通常比离心式水泵大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "轴流式水泵比转速比离心式水泵大，且比转速大时体积相对小，所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073756", "t": 3, "q": "水轮机转轮的材质选择只需考虑强度要求，无需考虑耐腐蚀性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机转轮长期在水中工作，不仅要承受各种力满足强度要求，还会受到水的腐蚀等作用，所以材质选择必须考虑耐腐蚀性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073757", "t": 3, "q": "离心式水泵的扬程是指水泵将水从进口到出口所增加的压力能，不包括动能和势能的增加。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心式水泵的扬程是指单位重量的水从泵进口到泵出口所增加的机械能，包括压力能、动能和势能的增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073758", "t": 3, "q": "轴流转桨式水轮机的转轮叶片角度调节机构位于转轮内部，通过油压传动实现叶片转动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴流转桨式水轮机转轮叶片角度调节机构确实在转轮内部，依靠油压传动来使叶片转动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073759", "t": 3, "q": "水轮机的最大允许吸出高度越大，说明水轮机的安装高程可以越高，越不容易发生气蚀。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073760", "t": 3, "q": "水泵的效率曲线是指效率与流量的关系曲线，每条效率曲线对应一个固定的转速。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水泵效率曲线反映的就是效率与流量的关系，且不同转速对应不同的效率曲线，即每条效率曲线对应一个固定转速。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073761", "t": 3, "q": "冲击式水轮机的转轮通常采用铸钢材质，主要是因为铸钢具有较好的耐腐蚀性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冲击式水轮机转轮用铸钢主要是因其强度高、韧性好，能承受高速水流冲击，而非主要因为耐腐蚀性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073762", "t": 3, "q": "水轮机导水机构的控制环通过连杆与导叶臂连接，控制环的转动可带动导叶绕自身轴线转动，实现导叶开度调节。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机导水机构就是这样的工作原理，控制环转动经连杆带动导叶臂，使导叶绕自身轴线转动从而调节开度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073763", "t": 3, "q": "离心式水泵的叶轮直径减小后，其扬程、流量和功率都会按直径的比例减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心式水泵叶轮直径减小后，扬程、流量和功率与直径并非按简单比例减小，它们遵循相似定律，是按直径的不同次方关系变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073764", "t": 3, "q": "轴流式水轮机的尾水管多采用直锥形尾水管，而混流式水轮机多采用弯肘形尾水管。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073765", "t": 3, "q": "水泵发生气蚀时，会出现噪音和振动，但对水泵的流量和扬程无影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水泵气蚀会破坏水泵过流部件，产生噪音和振动，还会使水泵的流量、扬程、效率等性能下降。所以题干说对流量和扬程无影响是错误的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073766", "t": 3, "q": "水轮机的比转速是一个无量纲数，其数值大小仅与水轮机的结构形式有关，与运行参数无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机比转速不是无量纲数，且它不仅与水轮机结构形式有关，还和运行参数相关。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073767", "t": 3, "q": "轴流式水泵的叶片数目越多，其扬程越高，流量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴流式水泵叶片数目增加，流体流动阻力增大，扬程会提高，同时过流面积变小，流量会减小。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第2章 水利与水电||第8节 水轮机与水泵的结构特性", "n": "第2章 水利与水电 / 第8节 水轮机与水泵的结构特性", "qs": [{"id": "2035637135129841664", "t": 1, "q": "水利工程施工质量事故分类中，造成直接经济损失1000万元-5000万元，且影响工程正常使用的质量事故属于？", "a": ["一般质量事故", "较大质量事故", "重大质量事故", "特大质量事故", "", ""], "r": "B", "e": "根据水利工程施工质量事故分类标准，直接经济损失1000万元 - 5000万元且影响工程正常使用的属于较大质量事故。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841665", "t": 1, "q": "水利工程混凝土配合比设计中，确定水胶比的主要依据是？", "a": ["混凝土的设计强度等级和耐久性要求", "混凝土的坍落度和施工和易性", "骨料的最大粒径和级配", "水泥的品种和强度等级", "", ""], "r": "A", "e": "水胶比的确定要兼顾混凝土强度和耐久性。设计强度等级决定了满足强度所需水胶比范围，耐久性要求也会对水胶比作出限制。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841666", "t": 1, "q": "水利工程施工导流中，当河流流量较大且工期较长时，优先采用的导流方式是？", "a": ["明渠导流", "隧洞导流", "涵管导流", "分期导流", "", ""], "r": "D", "e": "分期导流适用于流量大、工期长的情况，可通过分期分段施工来适应不同阶段的水流和建设需求；明渠导流一般适用于岸坡平缓或有较宽滩地的平原河道；隧洞导流多用于河谷狭窄、两岸地形陡峻、山岩坚实的山区河流；涵管导流一般适用于导流流量较小的河流或只用来担负枯水期的导流。所以选分期导流。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841667", "t": 1, "q": "水利工程土料填筑施工中，若土料的含水量高于最优含水量，为保证压实质量，可采取的措施是？", "a": ["增加压实遍数", "减小压实机械吨位", "对土料进行翻晒", "加快填筑速度", "", ""], "r": "C", "e": "土料含水量高于最优含水量，需降低含水量，翻晒可使土料水分蒸发从而降低含水量。增加压实遍数主要针对含水量合适但压实不足情况；减小压实机械吨位不利于压实；加快填筑速度与降低含水量无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841668", "t": 1, "q": "水利工程灌浆施工中，浆液的浓度调整应遵循的原则是？", "a": ["先浓后稀，逐渐调整", "先稀后浓，逐渐调整", "根据灌浆压力随机调整", "根据吸浆量固定浓度", "", ""], "r": "B", "e": "水利灌浆施工为使浆液更好地填充缝隙，通常先采用稀浆，便于浆液流动扩散，之后随情况变化逐渐调浓。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841669", "t": 1, "q": "在水利工程施工组织设计中，施工总布置应优先考虑的是？", "a": ["施工临时设施的布置", "施工道路的布置", "主体工程的施工场地布置", "施工材料堆场的布置", "", ""], "r": "C", "e": "主体工程施工场地是施工核心区域，其布置直接关系到工程建设的顺利进行，所以施工总布置应优先考虑主体工程的施工场地布置。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841670", "t": 1, "q": "水利工程混凝土浇筑施工中，平仓振捣的主要目的是？", "a": ["减少混凝土的发热量", "使混凝土密实，消除空隙", "加快混凝土的初凝速度", "控制混凝土的浇筑高度", "", ""], "r": "B", "e": "平仓振捣就是让混凝土均匀分布并密实，消除内部空隙。A选项减少发热量与振捣无关；C选项初凝速度主要和水泥等材料特性及外加剂有关；D选项浇筑高度靠施工工艺控制，和振捣无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841671", "t": 1, "q": "水利工程施工安全事故处理中，事故调查应遵循的原则是？", "a": ["快速处理，避免影响施工", "实事求是，尊重科学", "优先追究责任人责任", "以经济赔偿为主要目标", "", ""], "r": "B", "e": "事故调查需客观公正、科学严谨才能准确查明原因等，“实事求是，尊重科学”符合这一要求。A选项只强调快速处理不注重调查科学性；C选项优先追责不利于调查全面性；D选项以经济赔偿为目标偏离了调查本质。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841672", "t": 1, "q": "水利工程碾压混凝土施工中，粉煤灰的掺量对混凝土性能影响显著，通常粉煤灰的取代量不宜超过水泥用量的多少？", "a": ["30%", "40%", "50%", "60%", "", ""], "r": "C", "e": "在水利工程碾压混凝土施工中，粉煤灰的掺量确实是一个重要的考虑因素。粉煤灰可以改善混凝土的工作性、耐久性和力学性能，但过量使用也可能导致一些负面效应，如强度降低、收缩增大等。通常，为了保证混凝土的综合性能，粉煤灰的取代量（即粉煤灰占水泥总量的比例）会有一定的限制。在实际工程应用中，这个限制通常是水泥用量的50%。这是因为在这个比例下，粉煤灰可以充分发挥其改善混凝土性能的作用，同时避免过量使用带来的负面效应。因此，根据这个逻辑分析，粉煤灰的取代量不宜超过水泥用量的50%，所以正确答案是C。", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841673", "t": 1, "q": "水利工程地下洞室开挖施工中，爆破作业的掏槽方式选择需根据洞室断面大小确定，对于大断面洞室（跨度大于15米），优先采用的掏槽方式是？", "a": ["楔形掏槽", "锥形掏槽", "直线掏槽", "螺旋掏槽", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841674", "t": 1, "q": "在水利工程帷幕灌浆施工中，当采用自上而下分段灌浆法时，其分段长度通常根据岩层情况确定，对于裂隙发育且透水性较大的岩层，合理的分段长度一般为多少？", "a": ["0.5-1.0米", "1.0-2.0米", "2.0-4.0米", "4.0-6.0米", "", ""], "r": "B", "e": "裂隙发育且透水性大的岩层，分段长度不宜过大，否则难以保证灌浆质量。一般分段长度取1.0 - 2.0米较合理。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841675", "t": 1, "q": "水利工程混凝土面板堆石坝施工中，面板混凝土浇筑前需在坝体上游面铺设垫层料和过渡料，其中垫层料的最大粒径应控制在满足哪种要求？", "a": ["不大于垫层料铺设厚度的1/2", "不大于垫层料铺设厚度的2/3", "不大于垫层料铺设厚度的3/4", "等于垫层料铺设厚度", "", ""], "r": "B", "e": "垫层料最大粒径要保证施工和质量要求，规范规定其不大于垫层料铺设厚度的2/3。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841676", "t": 1, "q": "在水利工程施工进度控制中，当采用双代号时标网络计划时，关键线路的判定依据是？", "a": ["自始至终不出现波形线的线路", "自始至终波形线累计长度最短的线路", "节点最早时间与最迟时间相等的线路", "各项工作持续时间之和最大的线路", "", ""], "r": "A", "e": "双代号时标网络计划中，波形线表示自由时差，自始至终不出现波形线的线路为关键线路。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841677", "t": 1, "q": "水利工程地下洞室开挖施工中，当洞室跨度较大（大于10米）且岩层较破碎时，优先采用的开挖方法是？", "a": ["全断面开挖法", "台阶开挖法", "分部开挖法", "导洞开挖法", "", ""], "r": "C", "e": "洞室跨度大且岩层破碎，需分部分块开挖以保证施工安全和稳定，分部开挖法适用于这种复杂情况。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841678", "t": 1, "q": "水利工程混凝土温控措施中，为降低混凝土浇筑入仓温度，当采用预冷骨料时，骨料的预冷温度通常控制在比混凝土出机口设计温度低多少？", "a": ["2-3摄氏度", "3-5摄氏度", "5-8摄氏度", "8-10摄氏度", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841679", "t": 1, "q": "在水利工程施工质量评定中，对于分部工程质量评定，其合格标准要求所含单元工程质量的合格率应达到多少？", "a": ["80%及以上", "85%及以上", "90%及以上", "95%及以上", "", ""], "r": "C", "e": "分部工程质量评定合格标准要求所含单元工程质量全部合格，且其中70%以上达到优良等级，也就是合格率100%，这里问合格率，合格标准要求所含单元工程质量合格率应是90%及以上。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841680", "t": 1, "q": "水利工程土坝施工中，黏性土料的压实度检测若采用环刀法，其取样频率应满足每压实层每多少面积至少取1组样？", "a": ["100-200平方米", "200-400平方米", "400-600平方米", "600-800平方米", "", ""], "r": "B", "e": "水利工程土坝施工中，黏性土料压实度用环刀法检测时，每压实层每200 - 400平方米至少取1组样。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841681", "t": 1, "q": "水利工程灌浆施工中，固结灌浆的主要目的是？", "a": ["降低坝基渗透压力，防止管涌", "提高岩基的整体性和承载力", "封闭坝体与岩基接触面的缝隙", "填充坝体内部的裂缝和孔隙", "", ""], "r": "B", "e": "固结灌浆是用浆液灌入岩体裂隙或破碎带，以提高岩体的整体性和抗变形能力，即提高岩基的整体性和承载力。A选项是帷幕灌浆目的；C选项是接触灌浆作用；D选项一般是充填灌浆目的。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841682", "t": 1, "q": "在水利工程施工组织设计中，确定导流建筑物级别时，需考虑的主要因素是？", "a": ["导流建筑物的结构形式和材料", "导流时段内的最大洪水量和工程规模", "导流建筑物的施工难度和工期", "导流建筑物的布置位置和数量", "", ""], "r": "B", "e": "确定导流建筑物级别主要依据导流时段内的最大洪水量以及工程规模等因素。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841683", "t": 1, "q": "水利工程混凝土浇筑施工中，当采用泵送混凝土时，为保证混凝土顺利泵送，其坍落度通常控制在哪个范围？", "a": ["50-80毫米", "80-120毫米", "120-180毫米", "180-220毫米", "", ""], "r": "C", "e": "泵送混凝土需有合适坍落度以保证顺利泵送，一般坍落度控制在120 - 180毫米。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841684", "t": 1, "q": "水利工程施工安全管理中，对于高处作业（高度超过2米）的人员，必须配备的安全防护用品是？", "a": ["安全帽和防滑鞋", "安全带和安全帽", "安全带和防滑手套", "防滑鞋和防护眼镜", "", ""], "r": "B", "e": "高处作业存在坠落风险，安全带可防止人员坠落，安全帽能保护头部免受物体打击，这是高处作业人员必须配备的。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841685", "t": 1, "q": "在水利工程土方开挖施工中，当开挖边坡高度超过10米且岩层倾向与边坡倾向一致时，为防止边坡失稳，优先采取的措施是？", "a": ["放缓边坡坡度", "设置抗滑桩", "开挖截水沟", "分层开挖并及时支护", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841686", "t": 1, "q": "水利工程碾压混凝土坝施工中，碾压机械的行驶速度对压实质量影响显著，通常振动碾压的行驶速度应控制在哪个范围？", "a": ["1-2千米/小时", "2-4千米/小时", "4-6千米/小时", "6-8千米/小时", "", ""], "r": "B", "e": "在水利工程碾压混凝土坝施工中，碾压机械的行驶速度会直接影响压实质量。速度过快可能导致压实不均匀，速度过慢则会影响施工效率。一般来说，振动碾压的行驶速度需要适中，以保证既能有效压实又不至于影响进度。在实际施工中，振动碾压的行驶速度通常控制在2-4千米/小时，这个范围既能保证压实效果，又能维持一定的施工速度。所以，正确答案是B选项：“2-4千米/小时”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841687", "t": 1, "q": "水利工程施工进度计划调整中，当实际进度滞后于计划进度时，若采用压缩关键工作持续时间的方法调整，优先选择的关键工作应是？", "a": ["持续时间最长的关键工作", "资源消耗最少的关键工作", "有充足备用资源的关键工作", "对后续工作影响最小的关键工作", "", ""], "r": "C", "e": "压缩关键工作持续时间时，优先选有充足备用资源的关键工作，这样能保证工作顺利开展且不影响其他方面。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841688", "t": 1, "q": "水利工程接触灌浆施工中，浆液的水灰比应根据接触缝的宽度确定，对于缝宽较小（小于0.5毫米）的接触缝，首次灌浆宜采用的水灰比为？", "a": ["1:1", "2:1", "3:1", "4:1", "", ""], "r": "C", "e": "在水利工程接触灌浆施工中，浆液的水灰比是一个关键参数，它决定了浆液的流动性和固化后的强度。水灰比是指浆液中水的体积与水泥的体积之比。对于缝宽较小的接触缝（小于0.5毫米），需要使用流动性较好的浆液以便能够顺利注入狭窄的空间。通常，水灰比越大，浆液的流动性越好，但过大的水灰比会导致浆液固化后强度降低。根据施工经验，对于缝宽小于0.5毫米的接触缝，首次灌浆宜采用的水灰比为3:1。这是因为3:1的水灰比既能保证浆液的流动性，又能确保固化后的强度。所以，正确答案是C.3:1。", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841689", "t": 1, "q": "水利工程混凝土养护中，当采用洒水养护时，对于硅酸盐水泥拌制的混凝土，其养护时间不应少于多少天？", "a": ["7天", "14天", "21天", "28天", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841690", "t": 1, "q": "在水利工程施工成本控制中，属于施工阶段成本控制重点的是？", "a": ["施工方案的优化选择", "材料采购价格的控制", "施工机械使用费的控制", "工程变更费用的控制", "", ""], "r": "D", "e": "施工阶段成本控制重点在于对实际发生成本的管控。工程变更会直接导致成本的变动，在施工阶段需重点控制变更费用。A选项施工方案优化多在施工前；B选项材料采购价格控制侧重采购环节；C选项施工机械使用费虽重要，但工程变更费用控制对成本影响更关键。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841691", "t": 1, "q": "水利工程围堰施工中，当采用土石围堰时，其防渗体的渗透系数应控制在小于多少？", "a": ["1×10^-3厘米/秒", "1×10^-4厘米/秒", "1×10^-5厘米/秒", "1×10^-6厘米/秒", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841692", "t": 1, "q": "水利工程地下洞室支护施工中，当岩性为软岩且洞室开挖后易变形时，优先采用的支护方式是？", "a": ["喷锚支护", "钢筋混凝土衬砌", "钢支撑支护", "预应力锚杆支护", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637135129841693", "t": 1, "q": "水利工程施工进度计划中，总工期是指？", "a": ["从项目开工到主体工程完工的时间", "从项目开工到工程竣工验收合格的时间", "从项目可行性研究到工程竣工验收的时间", "从项目设计到工程交付使用的时间", "", ""], "r": "B", "e": "总工期是从项目开工到工程竣工验收合格的时间，这是完整衡量一个水利工程从开始建设到最终完成质量认可的时间跨度。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615168", "t": 2, "q": "水利工程混凝土浇筑施工中，影响混凝土抗裂性能的主要施工因素有哪些？", "a": ["浇筑温度控制", "振捣密实度", "养护时间和方式", "骨料的级配类型", "水泥的初凝时间", ""], "r": "ABC", "e": "浇筑温度、振捣密实度、养护时间和方式都会直接影响混凝土抗裂性能。而骨料级配类型主要影响混凝土和易性等，水泥初凝时间主要与混凝土凝结有关，并非影响抗裂性能主要施工因素。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615169", "t": 2, "q": "水利工程帷幕灌浆施工中，确定灌浆压力时需考虑的因素有哪些？", "a": ["岩层的透水性和强度", "灌浆孔的深度", "帷幕的设计厚度", "浆液的浓度", "灌浆设备的额定压力", ""], "r": "ABCE", "e": "灌浆压力确定要综合考虑多方面，岩层透水性和强度影响浆液扩散和地层承受能力；灌浆孔深度不同压力要求不同；帷幕设计厚度与压力相关，需保证合适压力以形成设计厚度帷幕；而浆液浓度主要影响流动性等，与确定压力无直接关联；灌浆设备额定压力是压力上限参考。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615170", "t": 2, "q": "水利工程施工进度控制中，常用的进度比较方法有哪些？", "a": ["横道图比较法", "香蕉曲线比较法", "前锋线比较法", "列表比较法", "网络计划技术法", ""], "r": "ABCD", "e": "横道图、香蕉曲线、前锋线、列表比较法都是施工进度控制中常用的进度比较方法，网络计划技术法主要用于编制和优化计划，并非比较方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615171", "t": 2, "q": "水利工程土方开挖施工中，防止边坡坍塌的技术措施有哪些？", "a": ["分层开挖、分层支护", "设置边坡排水系统", "控制开挖速度，避免超挖", "在边坡顶部堆载防渗", "采用预裂爆破减少对边坡的扰动", ""], "r": "ABCE", "e": "分层开挖分层支护能保证边坡稳定；设置排水系统可降低水对边坡的影响；控制开挖速度避免超挖可防止破坏边坡原有平衡；预裂爆破减少对边坡扰动利于保持边坡稳定。而在边坡顶部堆载会增加边坡压力，易导致坍塌，D错误。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615172", "t": 2, "q": "水利工程碾压混凝土坝施工中，质量控制的关键环节有哪些？", "a": ["VC值的控制", "碾压遍数和速度的控制", "混凝土浇筑间歇时间的控制", "骨料级配的控制", "坝体分缝位置的控制", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615173", "t": 2, "q": "水利工程施工安全管理中，属于危险源辨识范围的有哪些？", "a": ["高处坠落风险", "机械伤害风险", "触电风险", "合同变更风险", "物体打击风险", ""], "r": "ABCE", "e": "危险源辨识主要针对施工过程中的安全风险，A高处坠落、B机械伤害、C触电、E物体打击都属于施工中常见安全风险；而D合同变更风险属于经营管理方面，并非施工安全危险源。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615174", "t": 2, "q": "水利工程混凝土养护中，适用的养护方式有哪些？", "a": ["洒水养护", "覆盖保湿养护", "化学养护剂养护", "蒸汽养护", "自然通风养护", ""], "r": "ABCD", "e": "水利工程混凝土养护常见方式有洒水保持湿润、覆盖材料保湿、使用化学养护剂形成保护膜，蒸汽养护能加速硬化也常用；而自然通风养护不能保证混凝土所需湿度和温度条件，不是适用养护方式。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615175", "t": 2, "q": "水利工程地下洞室支护施工中，喷锚支护的组成部分包括哪些？", "a": ["喷射混凝土", "锚杆", "钢筋网", "钢支撑", "预应力锚索", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615176", "t": 2, "q": "水利工程施工成本构成中，属于直接工程费的有哪些？", "a": ["人工费", "材料费", "施工机械使用费", "临时设施费", "现场管理费", ""], "r": "ABC", "e": "直接工程费是指施工过程中耗费的构成工程实体的各项费用，包括人工费、材料费、施工机械使用费。临时设施费和现场管理费属于间接费。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615177", "t": 2, "q": "水利工程导流建筑物中，属于临时性建筑物的有哪些？", "a": ["围堰", "导流隧洞", "导流明渠", "永久泄洪洞", "临时泵站", ""], "r": "ABCE", "e": "临时性建筑物是为工程施工服务的，工程完成后一般不再使用。围堰、导流隧洞、导流明渠、临时泵站都是为导流施工设置的临时结构，工程结束后多会拆除。而永久泄洪洞是永久设施。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615178", "t": 2, "q": "水利工程灌浆施工中，固结灌浆的施工工艺步骤包括哪些？", "a": ["钻孔", "钻孔冲洗", "压水试验", "灌浆", "封孔", ""], "r": "ABCDE", "e": "固结灌浆是水利工程灌浆施工的一种，其施工工艺是先钻孔，然后冲洗钻孔，接着进行压水试验检测钻孔情况，之后进行灌浆，最后封孔。所以步骤包含钻孔、钻孔冲洗、压水试验、灌浆、封孔。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615179", "t": 2, "q": "水利工程施工组织设计中，施工方案选择应考虑的因素有哪些？", "a": ["工程规模和技术难度", "施工工期要求", "施工资源供应情况", "工程质量和安全要求", "当地气候和地质条件", ""], "r": "ABCDE", "e": "施工方案选择需综合多方面因素。工程规模和技术难度决定施工方法；施工工期要求影响方案进度安排；施工资源供应情况制约施工实施；工程质量和安全要求是基本准则；当地气候和地质条件影响施工可行性。答案为ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615180", "t": 2, "q": "水利工程混凝土配合比设计中，需确定的关键参数有哪些？", "a": ["水胶比", "砂率", "单位用水量", "水泥用量", "骨料最大粒径", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615181", "t": 2, "q": "水利工程土坝施工中，料场规划应遵循的原则有哪些？", "a": ["就近取材，减少运距", "料场储量大于实际需用量", "不同性质的料场分开规划", "料场开采顺序与坝体填筑顺序匹配", "优先开采含水量高的料场", ""], "r": "ABCD", "e": "料场规划要考虑经济（就近取材减运距）、储量充足、合理分区及开采顺序匹配等。含水量高的料场需处理后使用，并非优先开采。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615182", "t": 2, "q": "水利工程施工质量验收中，单元工程质量验收的参与单位有哪些？", "a": ["建设单位", "监理单位", "施工单位", "设计单位", "质量监督机构", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615183", "t": 2, "q": "水利工程施工进度计划编制中，需考虑的约束条件有哪些？", "a": ["施工图纸交付进度", "施工资源供应计划", "天气和水文条件", "工程质量验收标准", "周边环境影响", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615184", "t": 2, "q": "水利工程碾压混凝土施工中，避免出现冷缝的技术措施有哪些？", "a": ["控制混凝土浇筑间歇时间小于初凝时间", "采用通仓浇筑方式", "提高混凝土的初凝时间", "在间歇部位设置键槽", "加快混凝土的浇筑速度", ""], "r": "ACE", "e": "避免冷缝需控制浇筑间歇、提高初凝时间和加快浇筑速度。通仓浇筑与冷缝无直接关联，设键槽是处理已有冷缝的措施。答案：ACE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615185", "t": 2, "q": "水利工程地下洞室开挖施工中，影响爆破效果的主要因素有哪些？", "a": ["炸药品种和装药量", "炮孔布置方式", "起爆顺序", "岩石的物理力学性质", "洞室的断面形状", ""], "r": "ABCD", "e": "爆破效果受炸药本身特性（品种和装药量）、炮孔布置、起爆安排、岩石特性等多方面影响。洞室断面形状主要与洞室设计和功能相关，并非影响爆破效果主要因素。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615186", "t": 2, "q": "水利工程施工安全防护中，针对高空作业的防护措施有哪些？", "a": ["设置安全网", "搭设临边防护栏杆", "作业人员佩戴安全带", "设置安全警示标志", "采用吊篮作业时固定牢固", ""], "r": "ABCDE", "e": "高空作业防护需从设施和人员防护着手。安全网、临边防护栏杆可防止人员坠落；安全带保障人员自身安全；吊篮固定牢固避免工作时晃动坠落；安全警示标志起提醒作用。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615187", "t": 2, "q": "水利工程施工成本控制中，属于事前控制的措施有哪些？", "a": ["优化施工方案", "制定成本控制计划", "控制材料采购价格", "加强施工过程中的成本核算", "预测成本风险并制定应对措施", ""], "r": "ABE", "e": "事前控制是在成本发生前采取的措施。A优化施工方案可从源头降低成本；B制定成本控制计划是提前规划；E预测成本风险并制定应对措施也是事前准备。C控制材料采购价格多在采购时，属于事中控制；D加强施工过程成本核算属事中、事后监督分析。答案选ABE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615188", "t": 2, "q": "水利工程帷幕灌浆施工中，判断灌浆合格的标准包括哪些？", "a": ["灌浆压力达到设计要求", "吸浆量小于设计规定值", "灌浆段长度符合设计要求", "浆液结石强度达到设计标准", "压水试验透水率小于设计值", ""], "r": "ABE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615189", "t": 2, "q": "水利工程混凝土浇筑施工中，采用平仓机平仓时应遵循的原则有哪些？", "a": ["平仓方向与浇筑方向一致", "避免混凝土分离", "平仓厚度符合设计要求", "优先平仓边角部位", "平仓后及时振捣", ""], "r": "BCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615190", "t": 2, "q": "水利工程施工组织设计中，施工总进度计划的内容包括哪些？", "a": ["各单位工程的开工和完工时间", "主要施工工序的逻辑关系", "施工资源的配置计划", "关键线路和总工期", "进度控制的措施", ""], "r": "ABD", "e": "施工总进度计划要明确各单位工程时间安排、工序逻辑关系、关键线路和工期等核心内容。施工资源配置计划属资源计划，进度控制措施是保障进度手段，不属于总进度计划本身内容。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615191", "t": 2, "q": "水利工程土料压实施工中，影响压实效果的因素有哪些？", "a": ["压实机械的类型和吨位", "压实遍数", "土料的含水量", "土料的颗粒级配", "压实层的厚度", ""], "r": "ABCDE", "e": "压实机械类型和吨位、压实遍数、土料含水量、土料颗粒级配、压实层厚度都会对土料压实效果产生影响。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615192", "t": 2, "q": "水利工程灌浆施工中，采用自下而上分段灌浆法的适用条件有哪些？", "a": ["岩层较完整，透水性较小", "灌浆孔深度较大", "岩层破碎，易发生塌孔", "浆液较稠，流动性差", "要求灌浆速度较快", ""], "r": "AB", "e": "自下而上分段灌浆法适用于岩层较完整、透水性较小的情况，且灌浆孔深度较大时也常用。岩层破碎易塌孔一般不适用该法；浆液稠流动性差和要求灌浆速度快并非其适用关键条件。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615193", "t": 2, "q": "水利工程施工质量事故处理的基本程序包括哪些？", "a": ["事故调查", "事故原因分析", "事故处理方案制定", "事故处理实施", "事故处理验收", ""], "r": "ABCDE", "e": "水利工程施工质量事故处理，需先调查事故情况，接着分析原因，然后制定处理方案，再按方案实施处理，最后进行处理验收，这是基本流程。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615194", "t": 2, "q": "水利工程施工临时设施中，属于生产性临时设施的有哪些？", "a": ["混凝土搅拌站", "施工仓库", "临时办公用房", "钢筋加工厂", "临时宿舍", ""], "r": "ABD", "e": "生产性临时设施是为施工生产服务的。A混凝土搅拌站、B施工仓库、D钢筋加工厂都直接服务于施工生产。而C临时办公用房和E临时宿舍是生活性临时设施。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615195", "t": 2, "q": "水利工程碾压混凝土施工中，VC值测试的目的包括哪些？", "a": ["判断混凝土的工作度", "确定碾压机械的碾压参数", "控制混凝土的配合比", "评估混凝土的强度", "监测混凝土的初凝时间", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615196", "t": 2, "q": "水利工程地下洞室施工中，通风防尘的主要措施有哪些？", "a": ["采用湿式凿岩", "设置通风机通风", "爆破后洒水降尘", "作业人员佩戴防尘口罩", "采用干式捕尘装置", ""], "r": "ABCDE", "e": "通风防尘措施包括降低粉尘产生和扩散、加强通风及人员防护。湿式凿岩可减少凿岩时粉尘产生；通风机通风能改善洞内空气；爆破后洒水降尘可抑制粉尘飞扬；戴防尘口罩是人员防护，干式捕尘装置也可捕集粉尘。答案为ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637136916615197", "t": 2, "q": "水利工程施工进度滞后时，可采取的调整措施有哪些？", "a": ["压缩关键工作的持续时间", "增加施工人员和机械数量", "优化施工工艺，提高效率", "调整非关键工作的开始时间", "延长施工工期", ""], "r": "ABCD", "e": "进度滞后需加快进度，A压缩关键工作时间可直接加快进度；B增加资源投入能提高施工速度；C优化工艺能提升效率加快进度；D调整非关键工作开始时间可合理调配资源加快整体进度；E延长工期是进度滞后结果而非调整措施。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350080", "t": 3, "q": "水利工程帷幕灌浆施工中，当灌浆压力突然升高超过设计值时，应立即停止灌浆，防止发生孔壁坍塌。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "灌浆压力突然升高超设计值，应先检查是否是管路堵塞等原因，而非立即停止灌浆防止孔壁坍塌，此做法太片面，正常操作需先排查故障。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350081", "t": 3, "q": "水利工程混凝土面板堆石坝施工中，面板混凝土的浇筑应在垫层料碾压完成且沉降基本稳定后进行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "面板混凝土浇筑需在垫层料碾压完成且沉降基本稳定后进行，这样能避免因垫层料后续沉降导致面板出现裂缝等问题，保证面板质量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350082", "t": 3, "q": "水利工程施工进度计划中，非关键工作的总时差为零，若其实际进度滞后，不会影响总工期。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "总时差为零的是关键工作，非关键工作总时差大于零。非关键工作有一定机动时间，实际进度滞后在总时差范围内才不影响总工期。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350083", "t": 3, "q": "水利工程土方开挖施工中，对于软土地基，采用分层开挖时，每层开挖厚度应控制在1.5米以内，以防止边坡失稳。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软土地基稳定性差，分层开挖时控制每层厚度在1.5米以内能降低边坡失稳风险，此做法符合施工要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350084", "t": 3, "q": "水利工程碾压混凝土施工中，VC值越大，说明碾压混凝土的工作度越好，越容易压实。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VC值越大表示碾压混凝土越干硬，工作度越差，越难压实。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350085", "t": 3, "q": "水利工程施工质量评定中，单元工程质量不合格时，可通过加固处理使其达到合格标准，处理后可参与分部工程质量评定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350086", "t": 3, "q": "水利工程灌浆施工中，压水试验的目的是确定岩层的透水性，为确定灌浆压力和浆液浓度提供依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压水试验能测定岩层的透水性，而透水性数据对确定灌浆压力和浆液浓度很关键，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350087", "t": 3, "q": "水利工程混凝土浇筑施工中，为提高浇筑效率，可在混凝土初凝后继续浇筑上层混凝土，只需加强振捣即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混凝土初凝后已开始失去塑性，继续浇筑上层混凝土会使上下层混凝土结合不良，即便加强振捣也无法保证整体性，不符合施工要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350088", "t": 3, "q": "水利工程施工安全管理中，对于深基坑开挖作业，必须编制专项施工方案，并经施工单位技术负责人审批后即可实施。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "深基坑开挖作业编制的专项施工方案，不仅要经施工单位技术负责人审批，还需总监理工程师签字，对于超过一定规模的，还应组织专家论证，所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350089", "t": 3, "q": "水利工程地下洞室开挖施工中，全断面开挖法适用于洞室跨度较小（小于5米）、岩层完整且稳定性好的情况。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "全断面开挖法要求洞室跨度不宜过大且围岩稳定，跨度小于5米、岩层完整稳定时适用该法。", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350090", "t": 3, "q": "水利工程施工成本控制中，材料费占施工成本比例较大，因此控制材料采购价格是成本控制的唯一关键环节。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "材料费占比大，但控制材料采购价格并非成本控制的唯一关键环节，施工成本控制还涉及人工成本、机械使用成本、施工过程中的损耗控制等多个方面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350091", "t": 3, "q": "水利工程围堰施工中，混凝土围堰的防渗性能优于土石围堰，因此混凝土围堰无需设置防渗体。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然混凝土围堰防渗性能优于土石围堰，但在实际施工中，受多种因素影响，如混凝土自身可能存在细微裂缝等，为保证良好的防渗效果，很多时候也需设置防渗体。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350092", "t": 3, "q": "水利工程施工进度计划中，双代号网络计划中，虚工作的主要作用是表达工作之间的逻辑关系，不消耗资源和时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在双代号网络计划里，虚工作的确主要用于表达工作间逻辑关系，且不消耗资源和时间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350093", "t": 3, "q": "水利工程土料填筑施工中，最优含水量是指在一定压实机械和压实遍数下，使土料达到最大干密度时的含水量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是水利工程土料填筑中最优含水量的定义，表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350094", "t": 3, "q": "水利工程灌浆施工中，自下而上分段灌浆法的优点是可避免钻孔过程中发生塌孔，适用于破碎岩层。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自上而下分段灌浆法可避免钻孔过程中发生塌孔，适用于破碎岩层；自下而上分段灌浆法是在一次钻孔到底后，从孔底开始，自下而上逐段灌浆。所以题干表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350095", "t": 3, "q": "水利工程混凝土养护中，蒸汽养护适用于所有类型的混凝土构件，可显著提高混凝土早期强度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蒸汽养护并非适用于所有类型的混凝土构件，比如大体积混凝土采用蒸汽养护可能因内外温差大产生裂缝等问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350096", "t": 3, "q": "水利工程施工组织设计中，施工总布置应遵循\"分区明确、功能齐全、运输便捷、安全可靠\"的原则。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利工程施工组织设计里，施工总布置需满足分区合理清晰、功能完备、运输便利、保障安全等要求，该表述符合原则。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350097", "t": 3, "q": "水利工程施工质量事故中，重大质量事故的调查应由省级以上水利行政主管部门组织开展。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "重大质量事故由省级以上水行政主管部门组织调查组进行调查。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350098", "t": 3, "q": "水利工程施工安全事故处理中，事故处理的\"四不放过\"原则包括:事故原因未查清不放过、责任人未处理不放过、整改措施未落实不放过、有关人员未受到教育不放过。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“四不放过”原则是水利工程施工安全事故处理的重要准则，题干表述符合该原则内容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350099", "t": 3, "q": "水利工程混凝土配合比设计中，砂率过大时，混凝土的流动性会降低，易出现离析现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "砂率过大，意味着砂用量多，会使骨料的总表面积增大，包裹砂所需的水泥浆增多，用于润滑骨料的水泥浆相对减少，导致混凝土流动性降低，且易出现离析现象。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350100", "t": 3, "q": "水利工程施工导流中，隧洞导流的优点是不受洪水期影响，适用于所有河流条件下的导流工程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "隧洞导流虽有不受洪水期影响等优点，但并非适用于所有河流条件，比如平原地区河流，因地形平坦缺乏合适地形条件建隧洞。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350101", "t": 3, "q": "水利工程地下洞室支护施工中，锚杆支护的作用是将围岩与深层稳定岩层连接，传递围岩压力，防止围岩松动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "锚杆的确可将不稳定的围岩与深层稳定岩层连为一体，能有效传递围岩压力，避免围岩松动，起到支护作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350102", "t": 3, "q": "水利工程施工进度控制中，香蕉曲线比较法是利用两条S曲线（最早开始和最迟开始曲线）形成的闭合区域，判断进度偏差情况。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "香蕉曲线比较法就是通过绘制最早开始时间和最迟开始时间的S曲线形成闭合区域，依据实际进展与该区域的位置关系判断进度偏差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350103", "t": 3, "q": "水利工程土坝施工中，料场的开采量应等于坝体填筑量，以避免材料浪费或不足。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土坝施工中，料场开采量要考虑开采、运输、填筑等过程中的损耗，所以应大于坝体填筑量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350104", "t": 3, "q": "水利工程灌浆施工中，浆液的泌水率越小，说明浆液的稳定性越好，结石强度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "泌水率小意味着浆液在凝固过程中水分分离少，能更好保持自身状态，稳定性好，且有利于结石强度提高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350105", "t": 3, "q": "水利工程施工质量验收中，分部工程质量验收合格后，方可进行单位工程质量验收。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利工程施工质量验收流程里，需先完成分部工程质量验收且合格，才能开展单位工程质量验收。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350106", "t": 3, "q": "水利工程施工安全防护中，对于带电设备的作业，作业人员必须佩戴绝缘手套和绝缘鞋，无需验电即可操作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "对于带电设备作业，验电是确保安全操作的关键步骤，不验电就操作会有极大安全风险，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350107", "t": 3, "q": "水利工程混凝土浇筑施工中，分层浇筑的分层厚度越大，混凝土的散热越慢，越容易产生温度裂缝。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分层厚度大，混凝土内部热量不易散发，会使内部温度升高，与外部形成较大温差，从而易产生温度裂缝。", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350108", "t": 3, "q": "水利工程施工进度计划调整中，若关键工作的持续时间无法压缩，可通过改变关键线路上的逻辑关系，形成新的关键线路，以缩短总工期。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当水利工程关键工作持续时间无法压缩时，改变关键线路上逻辑关系形成新关键线路，有可能实现总工期缩短。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350109", "t": 3, "q": "水利工程碾压混凝土施工中，粉煤灰的掺入会降低混凝土的早期强度，但可提高混凝土的后期强度和耐久性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利工程碾压混凝土施工里，粉煤灰颗粒细小能填充孔隙，后期火山灰反应生成水化产物提升强度和耐久性，不过早期其活性低，会使混凝土早期强度降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350110", "t": 3, "q": "水利工程地下洞室开挖施工中，爆破作业后，需等待炮烟散尽，经检查确认无安全隐患后，作业人员方可进入洞室。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "爆破作业产生的炮烟含有毒有害气体，且爆破可能引发洞室局部不稳定等安全隐患，所以要等炮烟散尽并检查确认无隐患后人员才能进入。", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350111", "t": 3, "q": "水利工程施工成本构成中，措施项目费是指为完成工程项目施工，发生于该工程施工前和施工过程中的非工程实体项目的费用，包括临时设施费和夜间施工增加费等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水利工程中措施项目费确实是为完成工程施工，在施工前和施工过程中用于非工程实体项目的费用，临时设施费、夜间施工增加费等都属于措施项目费范畴。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350112", "t": 3, "q": "水利工程帷幕灌浆施工中，灌浆孔的布置应垂直于坝轴线，以确保帷幕能有效阻挡坝基渗透水流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程帷幕灌浆施工中，灌浆孔布置通常平行于坝轴线，这样才能形成连续的防渗帷幕来有效阻挡坝基渗透水流，而不是垂直于坝轴线。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350113", "t": 3, "q": "水利工程施工安全管理中，危险源辨识应定期进行，当施工工艺或环境发生变化时，无需重新辨识危险源。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "施工工艺或环境变化会使施工情况不同，原危险源情况可能改变，也可能产生新危险源，所以必须重新辨识。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350114", "t": 3, "q": "水利工程混凝土养护中，覆盖保湿养护时，覆盖材料应选用不透水、不易破损的材料，如塑料薄膜、麻袋等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350115", "t": 3, "q": "水利工程施工组织设计中，施工总进度计划的编制应先确定各单位工程的施工顺序，再根据工程量和资源情况确定各工程的持续时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "编制施工总进度计划时，合理确定各单位工程施工顺序是基础，之后结合工程量和资源状况来明确各工程持续时间，这是符合施工组织设计流程的。", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350116", "t": 3, "q": "水利工程土料压实施工中，压实机械的吨位越大，压实效果越好，因此应优先选用最大吨位的压实机械。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并非压实机械吨位越大压实效果就越好，还需考虑土料性质、施工条件等因素，应根据实际情况选择合适的压实机械，而非优先选最大吨位的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350117", "t": 3, "q": "水利工程灌浆施工中，灌浆过程中若出现浆液漏失严重的情况，可通过增加浆液浓度、加入速凝剂等方式减少漏失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当水利工程灌浆施工中浆液漏失严重时，增加浆液浓度和加入速凝剂是常用的减少漏失的有效办法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637139026350118", "t": 3, "q": "水利工程施工质量事故处理中，对于影响结构安全的质量事故，处理后应进行荷载试验或结构性能检测，确认满足设计要求后方可验收。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于影响结构安全的质量事故，处理后进行荷载试验或结构性能检测以确认满足设计要求后再验收，这是保障水利工程质量和安全的必要措施。", "ap": [false, false, false, false, false, false]}]}, {"k": "第2章 水利与水电||第9节 水利工程计量与计价", "n": "第2章 水利与水电 / 第9节 水利工程计量与计价", "qs": [{"id": "2035637143308734464", "t": 1, "q": "水利工程概预算中，价差预备费的计算不需要考虑以下哪项因素？", "a": ["工程建设工期", "各年投资计划额", "基本预备费率", "物价上涨指数", "", ""], "r": "C", "e": "价差预备费计算与工程建设工期、各年投资计划额、物价上涨指数相关，基本预备费率用于计算基本预备费，与价差预备费计算无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734465", "t": 1, "q": "在水利工程混凝土模板工程量计量中，对于曲面模板，其工程量计算应采用以下哪种方法？", "a": ["按模板接触混凝土的面积计算", "按模板的展开面积计算", "按混凝土结构体积计算", "按模板的水平投影面积计算", "", ""], "r": "A", "e": "水利工程混凝土模板工程量计量中，曲面模板按模板接触混凝土的面积计算。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734466", "t": 1, "q": "某水利工程建设项目，其建设期为3年，各年投资计划额分别为2000万元、3000万元、1000万元，若物价上涨指数为5%，则第2年的价差预备费应为多少万元（复利计算）？", "a": ["150.00", "205.00", "252.50", "307.50", "", ""], "r": "C", "e": "价差预备费公式为「test/yiwen_img/importSubject/2035637139877793792.png」，其中「test/yiwen_img/importSubject/2035637140083314688.png」为第t年投资额，f为物价上涨指数，m为建设前期年限（本题可视为0），t为年份。第2年「test/yiwen_img/importSubject/2035637140121063424.png」万元，「test/yiwen_img/importSubject/2035637140192366592.png」，m = 0，t = 2，代入公式可得「test/yiwen_img/importSubject/2035637140238503936.png」万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734467", "t": 1, "q": "水利工程中的\"安全生产费用\"在概预算中应如何列支？", "a": ["包含在企业管理费中", "包含在措施项目费中", "单独列项，计入工程建设其他费用", "单独列项，计入建筑安装工程费", "", ""], "r": "D", "e": "安全生产费用是为保障水利工程安全生产而专门设置的，需单独列项且应计入建筑安装工程费。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734468", "t": 1, "q": "在水利工程土方开挖计量中，对于基坑开挖，若开挖过程中发生塌方，其塌方部分的工程量是否应计入结算工程量？", "a": ["全部计入", "经监理单位确认后，合理塌方部分计入", "不计入", "按50%计入", "", ""], "r": "B", "e": "土方开挖计量时，塌方不是正常施工应有的工程量，需经监理单位确认合理部分才计入结算。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734469", "t": 1, "q": "根据《水利工程工程量清单计价规范》，工程量清单编制时，项目特征描述可不包括以下哪项内容？", "a": ["项目的材质", "项目的规格", "项目的施工方法", "项目的数量", "", ""], "r": "D", "e": "项目特征描述主要针对项目自身特性，如材质、规格等，施工方法不属于特征描述内容，数量是清单工程量，也不在特征描述范畴。答案选D是因为题目问可不包括的，项目数量本身不是特征描述内容。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734470", "t": 1, "q": "在水利工程概预算编制中，基本预备费的计算基数通常不包括以下哪项？", "a": ["工程费用", "工程建设其他费用", "价差预备费", "设备及工器具购置费", "", ""], "r": "C", "e": "基本预备费以工程费用、工程建设其他费用之和为计算基数，工程费用包含设备及工器具购置费等。而价差预备费与基本预备费是并列概念，不是基本预备费的计算基数。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734471", "t": 1, "q": "水利工程土方开挖工程量计量时，对于建筑物基础开挖，若基础为混凝土条形基础且有大放脚，其开挖工程量计算时应如何处理大放脚部分？", "a": ["单独计算大放脚体积并计入开挖量", "按基础底面积乘以开挖深度计算，不单独考虑大放脚", "按大放脚顶面面积乘以开挖深度计算", "扣除大放脚体积后计算开挖量", "", ""], "r": "B", "e": "建筑物基础开挖，混凝土条形基础有大放脚时，通常按基础底面积乘以开挖深度计算，不单独考虑大放脚。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734472", "t": 1, "q": "根据《水利工程设计概（估）算编制规定》，水利工程中的夜间施工增加费属于以下哪类费用？", "a": ["规费", "企业管理费", "措施项目费", "其他项目费", "", ""], "r": "C", "e": "夜间施工增加费是为完成工程项目施工，发生于该工程施工前和施工过程中非工程实体项目的费用，属于措施项目费。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734473", "t": 1, "q": "某水利枢纽工程中，某混凝土重力坝坝体混凝土采用商品混凝土，其单价计算时，除了考虑商品混凝土出厂价、运输费外，还需重点考虑以下哪项费用以准确计算浇筑到仓面的混凝土单价？", "a": ["混凝土拌制费", "混凝土运输损耗费", "混凝土振捣费", "混凝土养护费", "", ""], "r": "B", "e": "商品混凝土已拌制好，无拌制费；振捣和养护费不属于运输到仓面过程费用；运输损耗费是运输中会产生且影响浇筑到仓面混凝土单价的重要因素。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734474", "t": 1, "q": "水利工程概预算中，价差预备费的计算通常采用复利计算，其计算周期一般以什么为单位？", "a": ["月", "季", "半年", "年", "", ""], "r": "D", "e": "在水利工程概预算里，价差预备费按复利计算时，计算周期一般以年为单位。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734475", "t": 1, "q": "在水利工程石方开挖工程量计量中，对于保护层开挖，其工程量计算应采用以下哪种方法？", "a": ["按设计轮廓线体积计算，不考虑超挖", "按设计轮廓线加允许超挖值后的体积计算", "按实际开挖体积计算，超挖部分不单独计量", "按设计轮廓线体积加超挖系数计算", "", ""], "r": "B", "e": "在水利工程石方开挖工程量计量中，关于保护层开挖的工程量计算，关键在于理解保护层开挖的特点和计量规则。保护层开挖通常是为了保护主体工程或设施不受破坏而进行的表层开挖。在这种情况下，工程量的计算通常基于设计轮廓线，但考虑到实际开挖过程中可能存在的超挖现象，计量方式会有所不同。选项A“按设计轮廓线体积计算，不考虑超挖”忽略了实际开挖中可能出现的超挖部分，这在实际操作中可能导致计量不准确。选项B“按设计轮廓线加允许超挖值后的体积计算”则考虑到了实际开挖中的超挖情况，按照设计轮廓线加上允许的超挖值来计算工程量，这样既能反映实际开挖情况，又符合工程计量的准确性要求。选项C“按实际开挖体积计算，超挖部分不单独计量”虽然考虑了实际开挖情况，但超挖部分不单独计量可能导致工程量偏大，不利于成本控制。选项D“按设计轮廓线体积加超挖系数计算”与B选项相似，但“超挖系数”的确定可能因工程实际情况而异，不如B选项明确。综上所述，B选项“按设计轮廓线加允许超挖值后的体积计算”最符合保护层开挖工程量计量的实际情况和要求。所以，正确答案是B选项：“按设计轮廓线加允许超挖值后的体积计算”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734476", "t": 1, "q": "根据《水利工程工程量清单计价规范》，工程量清单中的\"暂列金额\"应归属于以下哪类项目？", "a": ["分部分项工程项目", "措施项目", "其他项目", "规费项目", "", ""], "r": "C", "e": "暂列金额是招标人在工程量清单中暂定并包括在合同价款中的一笔款项，属于其他项目。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734477", "t": 1, "q": "水利工程中，闸门安装工程量计量时，闸门本体重量的计算范围不包括以下哪项？", "a": ["闸门门叶", "闸门主轨", "闸门吊耳", "闸门止水橡皮", "", ""], "r": "B", "e": "闸门本体重量计算范围一般包含门叶、吊耳等主体结构部分，止水橡皮是附属部件，主轨不属于闸门本体。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734478", "t": 1, "q": "某水利工程编制施工图预算时，采用的人工预算单价中，生产工人辅助工资不包括以下哪项内容？", "a": ["职工学习、培训期间的工资", "因气候影响的停工工资", "探亲、休假期间的工资", "加班加点工资", "", ""], "r": "D", "e": "生产工人辅助工资包括职工学习、培训，因气候停工，探亲、休假期间工资等，加班加点工资不属于辅助工资。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734479", "t": 1, "q": "水利工程概预算中，工程建设其他费用中的\"建设管理费\"不包括以下哪项费用？", "a": ["项目法人管理费", "工程监理费", "工程质量监督费", "施工企业现场管理费", "", ""], "r": "D", "e": "建设管理费是工程建设其他费用，由项目法人管理费、工程监理费、工程质量监督费等构成，施工企业现场管理费属于建筑安装工程费中的间接费，不属于建设管理费。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734480", "t": 1, "q": "在水利工程混凝土工程量计量中，混凝土结构中的钢筋所占体积是否需要从混凝土工程量中扣除？", "a": ["全部扣除", "直径大于25mm的钢筋扣除，小于等于25mm的不扣除", "不扣除", "仅扣除主筋体积，箍筋体积不扣除", "", ""], "r": "C", "e": "在水利工程混凝土工程量计量里，通常不扣除混凝土结构中钢筋所占体积。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734481", "t": 1, "q": "某水利工程采用概算定额编制设计概算，若某分项工程的概算定额子目单位为100立方米，其人工消耗量为50工日，现该分项工程实际工程量为250立方米，则该分项工程的人工消耗量应为多少工日？", "a": ["125", "100", "150", "200", "", ""], "r": "A", "e": "先算出每立方米的人工消耗量为50÷100 = 0.5工日，实际工程量250立方米的人工消耗量就是250×0.5 = 125工日。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734482", "t": 1, "q": "水利工程中的\"临时设施费\"在概预算中属于以下哪类费用？", "a": ["工程建设其他费用", "建筑安装工程费中的措施项目费", "建筑安装工程费中的企业管理费", "预备费", "", ""], "r": "B", "e": "临时设施费是为工程施工提供临时设施所发生费用，属于建筑安装工程费里措施项目费。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734483", "t": 1, "q": "根据《水利工程建设项目费用构成》，水利工程的\"设备购置费\"计算时，不包括以下哪项费用？", "a": ["设备原价", "设备运杂费", "设备安装调试费", "设备运输损耗费", "", ""], "r": "C", "e": "设备购置费包括设备原价、运杂费、运输损耗费等，设备安装调试费不属于设备购置费用范畴。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734484", "t": 1, "q": "水利工程概预算编制中，当采用不同的价格水平年时，需要对工程费用进行价格调整，其调整的核心依据是以下哪项？", "a": ["人工工资上涨率", "材料价格指数", "工程造价指数", "设备价格波动幅度", "", ""], "r": "C", "e": "工程造价指数综合反映了工程建设中各类费用的价格变动情况，能衡量不同价格水平年工程费用的变化，是价格调整的核心依据。答案为C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734485", "t": 1, "q": "在水利工程土方填筑工程量计量中，对于坝体碾压式土方填筑，其工程量计算的压实度标准应按以下哪项确定？", "a": ["设计要求的压实度", "施工规范规定的最低压实度", "试验段确定的压实度", "监理单位确定的压实度", "", ""], "r": "A", "e": "坝体碾压式土方填筑工程量计算时，压实度标准应依据设计要求，设计规定了工程应达到的压实度指标。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734486", "t": 1, "q": "某水利工程编制可行性研究报告投资估算时，其基本预备费率应按以下哪个范围选取（根据现行规定）？", "a": ["3%-5%", "5%-8%", "8%-10%", "10%-12%", "", ""], "r": "B", "e": "水利工程可行性研究报告投资估算基本预备费率现行规定是5% - 8%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734487", "t": 1, "q": "水利工程中的\"环境保护措施费\"在概预算中应列入以下哪项费用？", "a": ["工程建设其他费用", "建筑安装工程费中的措施项目费", "专项费用", "预备费", "", ""], "r": "A", "e": "答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734488", "t": 1, "q": "在水利工程工程量清单计价中，分部分项工程综合单价不包括以下哪项费用？", "a": ["人工费", "材料费", "规费", "企业管理费", "", ""], "r": "C", "e": "分部分项工程综合单价包含人工费、材料费、企业管理费等，规费是单独列项计算，不包含在综合单价里。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734489", "t": 1, "q": "水利工程概预算中，施工机械使用费的计算基础是施工机械台班消耗量乘以以下哪项？", "a": ["施工机械台班原价", "施工机械台班折旧费", "施工机械台班使用费", "施工机械台班租赁费", "", ""], "r": "C", "e": "施工机械使用费的计算是施工机械台班消耗量乘以施工机械台班使用费。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734490", "t": 1, "q": "某水利工程中，隧洞开挖采用钻爆法施工，其工程量计量时，隧洞的设计断面尺寸应按以下哪项确定？", "a": ["隧洞开挖毛断面尺寸", "隧洞衬砌后净断面尺寸", "隧洞开挖毛断面尺寸减去衬砌厚度", "隧洞设计开挖断面尺寸（含允许超挖值）", "", ""], "r": "D", "e": "工程量计量时，隧洞工程量按设计开挖断面尺寸（含允许超挖值）计算。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734491", "t": 1, "q": "根据《水利工程设计概（估）算编制规定》，水利工程的\"企业管理费\"计算基数通常为以下哪项？", "a": ["直接工程费", "人工费", "人工费+施工机械使用费", "直接费", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734492", "t": 1, "q": "水利工程概预算中，工程建设其他费用中的\"水土保持补偿费\"应按以下哪项标准计算？", "a": ["按工程占地面积乘以单位面积补偿费标准", "按工程费用的一定比例计算", "按施工工期乘以单位工期补偿费标准", "按土石方开挖量乘以单位体积补偿费标准", "", ""], "r": "A", "e": "水土保持补偿费通常依据工程占地面积乘以单位面积补偿费标准来计算。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734493", "t": 1, "q": "某水利工程混凝土重力坝，其坝体混凝土浇筑工程量为10万立方米，若混凝土综合单价为300元/立方米，措施项目费为分部分项工程费的10%，规费为分部分项工程费与措施项目费之和的5%，税金为3.48%，则该坝体混凝土工程的总造价应为多少万元？", "a": ["3300.00", "3465.00", "3585.82", "3620.54", "", ""], "r": "C", "e": "先算分部分项工程费为10×300 = 3000万元，措施项目费是「test/yiwen_img/importSubject/2035637140284641280.png」万元，规费为「test/yiwen_img/importSubject/2035637140364333056.png」万元，税金为「test/yiwen_img/importSubject/2035637140406276096.png」万元，总造价为3000 + 300 + 165 + 115.54 = 3580.54万元（计算有近似），最接近C选项。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782656", "t": 2, "q": "水利工程概预算中，建筑安装工程费中的措施项目费包括以下哪些内容？（　）", "a": ["安全文明施工费", "夜间施工增加费", "已完工程及设备保护费", "规费", "工程定位复测费", ""], "r": "ABCE", "e": "措施项目费是为完成工程项目施工，发生于该工程施工前和施工过程中非工程实体项目的费用。安全文明施工费、夜间施工增加费、已完工程及设备保护费、工程定位复测费都属于措施项目费，而规费是单独的费用类别，不属于措施项目费。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782657", "t": 2, "q": "根据《水利工程工程量清单计价规范》，工程量清单中的其他项目清单应包括以下哪些内容？（　）", "a": ["暂列金额", "暂估价", "计日工", "总承包服务费", "措施项目费", ""], "r": "ABCD", "e": "其他项目清单包含暂列金额、暂估价、计日工、总承包服务费。措施项目费是与其他项目清单并列的清单类型。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782658", "t": 2, "q": "水利工程土方填筑工程量计量时，影响压实方工程量计算的因素包括以下哪些？（　）", "a": ["填筑土料的天然密度", "设计压实度", "填筑体的设计体积", "土料的含水率", "压实机械的类型", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782659", "t": 2, "q": "水利工程概预算编制中，基本预备费的用途包括以下哪些情况？（　）", "a": ["在批准的初步设计范围内，技术设计、施工图设计及施工过程中所增加的工程费用", "设计变更、工程变更、材料代用等增加的费用", "一般自然灾害造成的损失和预防自然灾害所采取的措施费用", "竣工验收时为鉴定工程质量对隐蔽工程进行必要的挖掘和修复费用", "建设期内由于物价上涨所增加的费用", ""], "r": "ABCD", "e": "基本预备费用于应对批准设计范围内增加工程费、设计变更等增费、自然灾害损失及措施费、隐蔽工程挖掘修复费等。物价上涨增加费用属价差预备费。ABCD符合基本预备费用途。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782660", "t": 2, "q": "水利工程混凝土工程量计量时，以下哪些部位的混凝土应单独计量，不包含在主体结构混凝土工程量中？（　）", "a": ["混凝土止水", "混凝土预埋件", "混凝土导流孔", "混凝土爬梯", "混凝土坝体排水孔", ""], "r": "ABD", "e": "混凝土止水、预埋件、爬梯等属于附属设施，单独计量；导流孔、坝体排水孔在主体结构混凝土施工中形成，其混凝土不单独计量。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782661", "t": 2, "q": "根据《水利工程设计概（估）算编制规定》，水利工程的人工预算单价包括以下哪些内容？（　）", "a": ["生产工人基本工资", "生产工人辅助工资", "生产工人劳动保护费", "职工福利费", "生产工人养老保险费", ""], "r": "ABCD", "e": "水利工程人工预算单价由基本工资、辅助工资、职工福利费和劳动保护费组成。养老保险费属间接费中企业管理费内容。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782662", "t": 2, "q": "水利工程石方开挖工程量计量中，以下哪些开挖类型应按不同的计量规则分别计算？（　）", "a": ["明挖石方", "暗挖石方（隧洞）", "基础石方开挖", "保护层石方开挖", "坡面石方开挖", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782663", "t": 2, "q": "水利工程概预算中，设备运杂费的计算包括以下哪些费用？（　）", "a": ["设备从生产厂家到工地仓库的运输费", "设备运输过程中的装卸费", "设备运输过程中的包装费", "设备的采购保管费", "设备的安装调试费", ""], "r": "ABCD", "e": "答案：ABCD设备运杂费是指设备原价中未包括的设备包装和包装材料费、运输费、装卸费、采购费及仓库保管费之和。如果设备是由设备成套公司供应的，成套公司的服务费也应计入设备运杂费中。E选项设备的安装调试费不属于设备运杂费的内容。", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782664", "t": 2, "q": "在水利工程工程量清单计价中，分部分项工程综合单价的组价依据包括以下哪些？（　）", "a": ["工程量清单项目特征描述", "现行水利工程预算定额", "人工、材料、机械台班市场价格", "企业管理费和利润取费标准", "规费和税金取费标准", ""], "r": "ABCD", "e": "分部分项工程综合单价组价要依据清单项目特征描述确定工作内容，用现行水利工程预算定额计算人材机用量，结合人材机市场价格算出成本，再按企业管理费和利润取费标准计取费用。而规费和税金不包含在综合单价里。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782665", "t": 2, "q": "水利工程工程建设其他费用中的\"勘察设计费\"包括以下哪些内容？（　）", "a": ["工程勘察费", "初步设计费", "施工图设计费", "竣工图编制费", "工程监理费", ""], "r": "ABCD", "e": "勘察设计费是为工程建设进行勘察和设计产生的费用，包含工程勘察费、初步设计费、施工图设计费、竣工图编制费等。而工程监理费不属于勘察设计费范畴。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782666", "t": 2, "q": "水利工程混凝土模板工程量计量时，以下哪些情况的模板不计算工程量？（　）", "a": ["混凝土结构中预埋的铁件周围的模板", "混凝土后浇带的模板", "混凝土临时施工缝的模板", "混凝土与地基接触面的模板", "混凝土结构表面的装饰性模板", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782667", "t": 2, "q": "水利工程概预算中，价差预备费的计算需要确定的参数包括以下哪些？（　）", "a": ["建设期各年的计划投资额", "建设期年限", "物价上涨指数", "基本预备费率", "汇率变动幅度", ""], "r": "ABC", "e": "价差预备费计算需建设期各年计划投资额、建设期年限、物价上涨指数。基本预备费率用于基本预备费计算，汇率变动幅度与价差预备费无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782668", "t": 2, "q": "根据《水利工程建设项目费用构成》，水利工程的\"规费\"包括以下哪些内容？（　）", "a": ["工程排污费", "社会保障费（养老、失业、医疗保险）", "住房公积金", "危险作业意外伤害保险费", "企业管理费", ""], "r": "ABCD", "e": "规费是指政府和有关权力部门规定必须缴纳的费用。工程排污费、社会保障费、住房公积金、危险作业意外伤害保险费都属于规费，企业管理费不属于规费。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782669", "t": 2, "q": "水利工程土方开挖工程量计量中，以下哪些因素会影响开挖工程量的计算？（　）", "a": ["开挖边坡坡度", "基础工作面宽度", "开挖深度", "土料的天然含水率", "开挖范围内的地下水位高度", ""], "r": "ABC", "e": "答案：ABC水利工程土方开挖工程量计量中，影响开挖工程量的因素有开挖边坡坡度、基础工作面宽度、开挖深度等。", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782670", "t": 2, "q": "水利工程概预算编制中，施工机械台班使用费包括以下哪些费用？（　）", "a": ["施工机械折旧费", "施工机械大修理费", "施工机械经常修理费", "施工机械操作人员人工费", "施工机械燃料动力费", ""], "r": "ABCE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782671", "t": 2, "q": "水利工程工程量清单编制时，分部分项工程项目的编码应遵循以下哪些原则？（　）", "a": ["采用十二位阿拉伯数字表示", "前九位为全国统一编码", "后三位为清单编制人设置的顺序码", "同一招标工程的项目编码不得重复", "编码可根据项目特点自行调整", ""], "r": "ABCD", "e": "水利工程分部分项工程项目编码用十二位阿拉伯数字，前九位全国统一，后三位是清单编制人顺序码，同一招标工程编码不能重复，编码要按规定设置不能自行调整。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782672", "t": 2, "q": "水利工程中的\"临时工程\"费用在概预算中包括以下哪些内容？（　）", "a": ["临时房屋建筑工程费", "临时道路工程费", "临时供电工程费", "临时供水工程费", "永久建筑物的临时支护工程费", ""], "r": "ABCD", "e": "水利工程概预算中临时工程费用涵盖临时房屋、道路、供电、供水等工程费用，永久建筑物的临时支护属永久工程相关费用，不在临时工程费用里 。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782673", "t": 2, "q": "水利工程概预算中，工程建设其他费用中的\"生产准备费\"包括以下哪些内容？（　）", "a": ["生产人员培训费", "提前进厂费", "生产单位固定资产购置费", "生产单位工具用具购置费", "联合试运转费", ""], "r": "ABDE", "e": "生产准备费是指水利工程建设项目在竣工验收前，为保证正常生产（运行、使用）所发生的人员培训、提前进厂费以及投产使用初期必备的生产生活用具、工器具等购置费用等，联合试运转费也属于生产准备费范畴。生产单位固定资产购置费不属于生产准备费。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782674", "t": 2, "q": "水利工程混凝土工程量计量时，以下哪些情况需要按设计图示尺寸计算混凝土体积？（　）", "a": ["混凝土坝体", "混凝土闸墩", "混凝土廊道", "混凝土预埋件", "混凝土止水", ""], "r": "ABC", "e": "混凝土坝体、闸墩、廊道按设计图示尺寸计算混凝土体积，预埋件、止水不单独计算混凝土体积。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782675", "t": 2, "q": "根据《水利工程设计概（估）算编制规定》，水利工程概预算的编制阶段包括以下哪些？（　）", "a": ["项目建议书阶段", "可行性研究阶段", "初步设计阶段", "施工图设计阶段", "竣工验收阶段", ""], "r": "ABCD", "e": "水利工程概预算编制贯穿项目前期到设计等阶段，竣工验收阶段主要是对工程进行整体验收，不涉及概预算编制。而项目建议书、可行性研究、初步设计、施工图设计阶段都需要进行相应的概预算编制。所以答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782676", "t": 2, "q": "水利工程石方开挖中，以下哪些爆破方式的工程量计量规则不同？（　）", "a": ["浅孔爆破", "深孔爆破", "预裂爆破", "光面爆破", "洞室爆破", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782677", "t": 2, "q": "水利工程概预算中，建筑安装工程费中的\"直接费\"包括以下哪些内容？（　）", "a": ["直接工程费", "措施项目费", "企业管理费", "规费", "利润", ""], "r": "AB", "e": "建筑安装工程费中直接费由直接工程费和措施项目费组成。企业管理费、规费、利润不属于直接费范畴。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782678", "t": 2, "q": "水利工程工程量清单计价中，计日工费用的计算依据包括以下哪些？（　）", "a": ["计日工人工单价", "计日工材料单价", "计日工施工机械台班单价", "计日工的实际完成数量", "计日工的计划完成数量", ""], "r": "ABCD", "e": "计日工费用计算需依据实际完成量及相应人工、材料、机械单价。计划完成数量不能作为费用计算依据。所以答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782679", "t": 2, "q": "水利工程概预算中，价差预备费的计算方法包括以下哪些步骤？（　）", "a": ["确定各年的投资计划额", "确定物价上涨指数", "计算各年的价差预备费", "汇总各年的价差预备费", "计算基本预备费", ""], "r": "ABCD", "e": "计算价差预备费，需先确定各年投资计划额，再明确物价上涨指数，接着算出各年价差预备费，最后汇总各年的。基本预备费与价差预备费计算步骤无关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782680", "t": 2, "q": "水利工程中的\"环境保护工程\"费用在概预算中包括以下哪些内容？（　）", "a": ["废水处理工程费", "废气处理工程费", "废渣处理工程费", "噪声控制工程费", "水土保持工程费", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782681", "t": 2, "q": "水利工程土方填筑中，以下哪些土料的填筑工程量计量规则不同？（　）", "a": ["黏性土", "砂性土", "砾石土", "风化岩", "块石", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782682", "t": 2, "q": "水利工程概预算编制中，人工预算单价的计算需要考虑以下哪些因素？（　）", "a": ["地区类别", "工资等级", "工作年限", "物价水平", "施工季节", ""], "r": "ABD", "e": "人工预算单价受地区类别影响，不同地区工资水平有差异；工资等级决定了基础工资标准；物价水平会影响生活成本从而影响人工单价。工作年限和施工季节一般不直接用于计算人工预算单价。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782683", "t": 2, "q": "水利工程工程量清单中，措施项目清单的编制应考虑以下哪些因素？（　）", "a": ["工程特点", "施工组织设计", "施工技术方案", "招标文件要求", "投标人的施工能力", ""], "r": "ABCD", "e": "措施项目清单编制需结合工程实际情况和相关要求。工程特点决定了特殊措施；施工组织设计和技术方案明确具体实施措施；招标文件要求是必须遵循的。而投标人施工能力是投标人自身情况，不影响清单编制。所以应选ABCD。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782684", "t": 2, "q": "水利工程混凝土浇筑工程量计量时，以下哪些情况需要扣除混凝土体积？（　）", "a": ["混凝土结构中的钢筋", "混凝土结构中的预埋钢管（直径大于800mm）", "混凝土结构中的预埋钢板", "混凝土结构中的预留孔洞（体积大于0.3立方米）", "混凝土结构中的止水橡皮", ""], "r": "BD", "e": "一般钢筋、预埋钢板、止水橡皮不扣混凝土体积，直径大于800mm的预埋钢管和体积大于0.3立方米的预留孔洞需扣除。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439040", "t": 3, "q": "水利工程概预算中，基本预备费的计算基数包含工程费用、工程建设其他费用以及价差预备费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基本预备费计算基数是工程费用与工程建设其他费用之和，不包含价差预备费。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439041", "t": 3, "q": "水利工程土方开挖工程量计量时，建筑物基础开挖的工作面宽度应根据施工规范和施工组织设计确定，计入开挖工程量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利工程土方开挖工程量计量中，建筑物基础开挖的工作面宽度按施工规范和施工组织设计确定后，是要计入开挖工程量的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439042", "t": 3, "q": "水利工程中的夜间施工增加费属于企业管理费的组成部分。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "夜间施工增加费属于措施费，并非企业管理费组成部分。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439043", "t": 3, "q": "水利工程混凝土工程量计量时，混凝土结构中的钢筋所占体积应从混凝土工程量中扣除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程混凝土工程量计量时，混凝土结构中的钢筋所占体积不扣除。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439044", "t": 3, "q": "水利工程概预算中，价差预备费采用单利计算，按各年投资计划额和物价上涨指数计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程概预算中，价差预备费采用复利计算，并非单利。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439045", "t": 3, "q": "水利工程石方保护层开挖工程量按设计轮廓线加允许超挖值后的体积计算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439046", "t": 3, "q": "水利工程工程量清单中的暂列金额由投标人根据自身情况自主报价。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "暂列金额是招标人在工程量清单中暂定并包括在合同价款中的一笔款项，由招标人确定金额，并非由投标人自主报价。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439047", "t": 3, "q": "水利工程闸门安装工程量按闸门本体重量计量，包括闸门主轨的重量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程闸门安装工程量按闸门本体重量计量，但不包括闸门主轨等附属设备重量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439048", "t": 3, "q": "水利工程人工预算单价中的生产工人辅助工资包括职工学习、培训期间的工资。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水利工程人工预算单价里生产工人辅助工资包含职工学习、培训期间工资等内容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633344", "t": 3, "q": "水利工程概预算中，工程建设其他费用中的建设管理费包含施工企业现场管理费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "建设管理费是建设单位为建设项目的立项、筹建、建设、竣（交）工验收、总结等工作所发生的费用，而施工企业现场管理费是施工企业为组织施工生产和经营管理所需费用，二者主体不同，建设管理费不包含施工企业现场管理费。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633345", "t": 3, "q": "水利工程隧洞开挖采用钻爆法施工时，其工程量按隧洞衬砌后净断面尺寸计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程隧洞开挖采用钻爆法施工时，工程量按设计断面尺寸（即不考虑衬砌后净断面）加允许超挖量以体积计算。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633346", "t": 3, "q": "水利工程企业管理费的计算基数通常为人工费与施工机械使用费之和。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利工程中，企业管理费计算基数一般是人工费与施工机械使用费之和。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633347", "t": 3, "q": "水利工程概预算编制中，不同价格水平年的工程费用调整依据是人工工资上涨率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程概预算编制中，不同价格水平年工程费用调整依据是多种因素，不只是人工工资上涨率，还包括材料价格变动、机械台班费变化等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633348", "t": 3, "q": "水利工程混凝土模板工程量按模板的展开面积计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633349", "t": 3, "q": "水利工程价差预备费的计算不需要考虑工程建设工期。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "价差预备费是为在建设期内利率、价格等因素的变化而预留的可能增加的费用，其计算与工程建设工期密切相关，因为不同工期内物价波动等情况不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633350", "t": 3, "q": "水利工程中的临时设施费属于工程建设其他费用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "临时设施费是建筑安装工程费中的措施费，并非工程建设其他费用。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633351", "t": 3, "q": "水利工程设备购置费包括设备原价、运杂费及设备安装调试费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程设备购置费包括设备原价和运杂费等，但设备安装调试费不属于设备购置费范畴，应计入安装工程费。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633352", "t": 3, "q": "水利工程土方填筑工程量按设计压实度对应的压实方体积计算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水利工程土方填筑工程量通常就是按设计压实度对应的压实方体积来计算的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633353", "t": 3, "q": "水利工程可行性研究报告投资估算的基本预备费率一般为8%-10%。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在水利工程中，可行性研究报告投资估算的基本预备费率一般为10% - 15% ，并非8% - 10%。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633354", "t": 3, "q": "水利工程环境保护措施费属于建筑安装工程费中的措施项目费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633355", "t": 3, "q": "水利工程分部分项工程综合单价包含规费和税金。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "综合单价是完成一个规定清单项目所需的人工费、材料费、施工机具使用费和企业管理费、利润，以及一定范围内的风险费用，不包含规费和税金。所以答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633356", "t": 3, "q": "水利工程施工机械使用费按施工机械台班消耗量乘以施工机械台班原价计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程施工机械使用费除了考虑施工机械台班消耗量和台班原价，还需考虑操作工人人工费用、动力燃料费等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633357", "t": 3, "q": "水利工程基坑开挖中，塌方部分的工程量经监理单位确认后可计入结算工程量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633358", "t": 3, "q": "水利工程工程量清单项目特征描述需包含项目的数量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "项目特征描述主要是对项目的自身特征、工艺特征以及对施工方法可能产生影响的特征进行描述，数量在工程量清单中单独列项体现，并非项目特征描述内容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633359", "t": 3, "q": "水利工程水土保持补偿费按工程土石方开挖量乘以单位体积补偿费标准计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程水土保持补偿费并非仅按工程土石方开挖量乘以单位体积补偿费标准计算，还会考虑其他因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633360", "t": 3, "q": "水利工程安全生产费用应单独列项，计入工程建设其他费用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程安全生产费用应单独列项，但它是计入建筑安装工程费，而非工程建设其他费用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633361", "t": 3, "q": "水利工程概预算中，工程建设其他费用中的勘察设计费包含工程监理费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "勘察设计费和工程监理费是工程建设其他费用里不同的费用项目，勘察设计费不包含工程监理费。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633362", "t": 3, "q": "水利工程混凝土后浇带的模板工程量应单独计量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633363", "t": 3, "q": "水利工程价差预备费的计算需要考虑基本预备费率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "价差预备费计算依据工程在建设期间价格上涨可能增加的费用，与基本预备费率无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633364", "t": 3, "q": "水利工程规费中的社会保障费包括养老保险费、失业保险费和医疗保险费。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633365", "t": 3, "q": "水利工程土方开挖工程量计算时，开挖边坡坡度仅影响施工难度，不影响工程量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开挖边坡坡度会影响开挖的范围和深度，进而影响土方开挖的工程量，并非仅影响施工难度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633366", "t": 3, "q": "水利工程施工机械台班使用费中的燃料动力费属于施工机械使用费的组成部分。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "施工机械使用费由折旧费、大修理费、经常修理费、安拆费及场外运费、人工费、燃料动力费、其他费用等组成，所以燃料动力费是施工机械使用费的组成部分。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633367", "t": 3, "q": "水利工程分部分项工程项目编码采用十位阿拉伯数字表示，前七位为全国统一编码。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程分部分项工程项目编码采用十二位阿拉伯数字表示，前九位为全国统一编码。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633368", "t": 3, "q": "水利工程临时工程费用中的临时道路工程费属于建筑安装工程费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633369", "t": 3, "q": "水利工程生产准备费中的联合试运转费是指单机试运转的费用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "联合试运转费是对整个生产工艺流程进行的联动无负荷或有负荷试运转费用，并非单机试运转费用。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633370", "t": 3, "q": "水利工程混凝土闸墩工程量按设计图示尺寸计算混凝土体积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水利工程中混凝土闸墩工程量通常就是按设计图示尺寸计算混凝土体积。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633371", "t": 3, "q": "水利工程概预算编制阶段包括竣工验收阶段。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程概预算编制阶段主要有项目建议书、可行性研究、初步设计、施工图设计等阶段，竣工验收阶段是工程完工后的检验环节，并非概预算编制阶段。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633372", "t": 3, "q": "水利工程预裂爆破的工程量计量规则与深孔爆破相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "预裂爆破和深孔爆破在爆破目的、施工工艺等方面有差异，工程量计量规则不同。", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633373", "t": 3, "q": "水利工程建筑安装工程费中的直接费包括直接工程费和规费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程建筑安装工程费中的直接费包括直接工程费和措施费，而规费属于间接费。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633374", "t": 3, "q": "水利工程计日工费用按计日工的计划完成数量乘以相应单价计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "计日工费用通常是按实际完成数量乘以相应单价计算，而非计划完成数量。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "第3章 智慧水利和数字水利技术||第1节 水资源数据管理（1）", "n": "第3章 智慧水利和数字水利技术 / 第1节 水资源数据管理（1）", "qs": [{"id": "2035637150346776576", "t": 1, "q": "在智慧水利体系中，用于实现水利数据\"采、传、存、管、用\"全流程协同管理的核心技术架构是以下哪一种？", "a": ["分布式传感网络架构", "水利数据中台架构", "传统水利SCADA架构", "单一数据库存储架构", "", ""], "r": "B", "e": "水利数据中台架构可对水利数据全生命周期进行管理，实现“采、传、存、管、用”全流程协同。而分布式传感网络主要侧重数据采集；传统水利SCADA架构用于工业监控；单一数据库存储架构只是简单存储数据，无法实现全流程协同管理。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776577", "t": 1, "q": "某流域水资源管理部门需对海量历史降水数据、径流数据进行趋势分析，以支撑中长期水资源配置，此过程中最适合采用的大数据分析算法是？", "a": ["支持向量机分类算法", "时间序列分解与预测算法", "K-均值聚类算法", "决策树分类算法", "", ""], "r": "B", "e": "题目要对历史降水、径流数据做趋势分析以支撑中长期配置，时间序列分解与预测算法适合处理随时间变化的数据并进行趋势预测。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776578", "t": 1, "q": "在水资源数据管理中，针对不同来源（如水文站、气象站、墒情站）数据的格式差异、精度不一致问题，首要进行的处理环节是？", "a": ["数据备份", "数据清洗与标准化", "数据加密", "数据可视化", "", ""], "r": "B", "e": "因不同来源数据存在格式差异、精度不一致问题，需要先对数据进行清洗和标准化，使其格式统一、精度规范，才能进行后续处理。答案为B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776579", "t": 1, "q": "智慧水利中，数字孪生流域构建的关键技术不包括以下哪一项？", "a": ["流域三维地理信息建模技术", "实时数据与虚拟场景动态映射技术", "静态数据离线存储技术", "流域水文水动力耦合模拟技术", "", ""], "r": "C", "e": "数字孪生流域强调数据的实时性、动态性和交互性，以实现对流域的精准模拟和高效管理。静态数据离线存储技术不能满足实时动态交互需求，而A的三维地理信息建模、B的实时数据与虚拟场景动态映射、D的水文水动力耦合模拟都是构建数字孪生流域的关键技术。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776580", "t": 1, "q": "大数据技术在水利工程安全监测中的应用，其核心优势不体现在以下哪个方面？", "a": ["实现监测数据的实时采集与传输", "通过多源数据融合提升隐患识别精度", "基于历史数据训练模型实现风险预警", "减少监测设备的硬件投入成本", "", ""], "r": "D", "e": "大数据技术主要是对数据进行处理和分析等，不能直接减少监测设备的硬件投入成本。而A可实时获取数据，B能融合数据提高隐患识别能力，C能基于历史数据预警，都是大数据技术在水利工程安全监测中的优势。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776581", "t": 1, "q": "在水资源数据分级分类管理中，根据《水利数据安全管理办法》，涉及流域水资源总量、重要水利工程调度方案的数据应属于哪一级别数据？", "a": ["公开级", "内部级", "秘密级", "机密级", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776582", "t": 1, "q": "某地区采用物联网技术构建智慧墒情监测系统，其传感器节点采集的数据需通过无线网络传输至云端平台，以下哪种传输技术最适合在偏远山区、信号较弱区域使用？", "a": ["蓝牙技术", "Wi-Fi技术", "窄带物联网（NB-IoT）技术", "ZigBee技术", "", ""], "r": "C", "e": "蓝牙、Wi-Fi、ZigBee传输距离和覆盖范围有限，在偏远山区、信号弱区域表现不佳。窄带物联网（NB - IoT）覆盖范围广、功耗低，适合偏远山区等信号弱区域。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776583", "t": 1, "q": "在水利大数据平台建设中，用于解决\"数据孤岛\"问题的核心技术手段是？", "a": ["增加数据存储容量", "建立统一的数据接口标准与共享机制", "提升数据计算速度", "加强数据安全防护", "", ""], "r": "B", "e": "“数据孤岛”指各系统数据无法共享交流，解决此问题需让数据能有效流通。建立统一的数据接口标准与共享机制可打破数据间壁垒，实现数据共享。而增加存储容量、提升计算速度、加强安全防护均不能直接解决“数据孤岛”问题。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776584", "t": 1, "q": "智慧水利中的\"四预\"（预报、预警、预演、预案）体系中，\"预演\"环节主要依赖的技术是？", "a": ["数据可视化技术", "水文水动力数值模拟技术", "数据采集技术", "数据加密技术", "", ""], "r": "B", "e": "“预演”是对未来可能发生的水情等进行模拟推演，水文水动力数值模拟技术能通过建立模型对水流等情况进行模拟，从而支持“预演”。而数据可视化是呈现结果，数据采集是获取数据，数据加密是保障数据安全，均非“预演”主要依赖技术。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776585", "t": 1, "q": "水资源数据管理中，\"数据血缘\"管理的主要目的是？", "a": ["追溯数据的来源、处理过程与去向", "提高数据传输速度", "减少数据存储占用空间", "增强数据的可读性", "", ""], "r": "A", "e": "“数据血缘”重点在于体现数据的关联脉络，所以主要目的是追溯其来源、处理过程与去向。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776586", "t": 1, "q": "大数据技术在洪水预报中，相较于传统预报方法，其主要改进方向是？", "a": ["仅依赖历史观测数据", "融合多源数据（如雷达测雨、卫星云图）提升预报精度", "减少预报模型的参数数量", "缩短预报结果的输出时间（不考虑精度）", "", ""], "r": "B", "e": "传统预报方法数据来源单一，大数据技术能融合雷达测雨、卫星云图等多源数据，从而提升洪水预报精度。A仅依赖历史观测数据并非改进方向；C减少预报模型参数数量不一定是主要改进点；D不考虑精度缩短输出时间不符合洪水预报需求。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776587", "t": 1, "q": "在数字水利技术中，地理信息系统（GIS）与水利模型的集成应用，不包括以下哪项功能？", "a": ["流域地形地貌可视化展示", "水利工程空间位置查询", "基于地形数据的水文参数计算", "水利数据的加密传输", "", ""], "r": "D", "e": "A、B、C选项都是GIS与水利模型集成可实现的功能，涉及流域地形、水利工程位置和水文参数计算等；而水利数据加密传输与GIS和水利模型集成应用无直接关联。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776588", "t": 1, "q": "根据《水资源监测数据共享管理办法》，水资源监测数据共享应遵循的首要原则是？", "a": ["无偿共享原则", "安全可控与按需共享相结合原则", "优先满足企业需求原则", "仅向政府部门共享原则", "", ""], "r": "B", "e": "《水资源监测数据共享管理办法》规定，水资源监测数据共享首要原则是安全可控与按需共享相结合，要在保障安全前提下按需共享。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776589", "t": 1, "q": "智慧水利中，用于实时监测水利工程（如大坝、堤防）变形的技术是？", "a": ["超声波水位计技术", "全球导航卫星系统（GNSS）高精度定位技术", "雨量计技术", "水质传感器技术", "", ""], "r": "B", "e": "监测水利工程变形需高精度定位技术，GNSS可实现。A测水位，C测雨量，D测水质，均与工程变形监测无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776590", "t": 1, "q": "在水利大数据数据存储架构中，适合存储非结构化数据（如水利工程影像、遥感图片）的存储方式是？", "a": ["关系型数据库（如MySQL）", "分布式文件系统（如HDFS）", "列存储数据库（如HBase）", "键值数据库（如Redis）", "", ""], "r": "B", "e": "非结构化数据量大、格式多样，分布式文件系统适合存储这种大规模非结构化数据。关系型数据库适合结构化数据；列存储数据库常用于海量数据存储与分析；键值数据库主要用于缓存等场景。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776591", "t": 1, "q": "某水利部门采用大数据分析评估区域水资源承载能力，其评估指标体系构建不包括以下哪项指标？", "a": ["区域多年平均水资源总量", "区域工业用水重复利用率", "区域大气污染物排放量", "区域水资源开发利用率", "", ""], "r": "C", "e": "评估区域水资源承载能力主要围绕水资源相关指标。A项多年平均水资源总量是基础数据；B项工业用水重复利用率反映水资源利用效率；D项水资源开发利用率体现开发程度。而C项大气污染物排放量与水资源承载能力评估并无直接关联。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776592", "t": 1, "q": "智慧水利中的边缘计算技术，其在水利数据处理中的主要作用是？", "a": ["将所有数据传输至云端统一处理", "在数据采集端就近处理部分数据，减少云端压力", "仅负责数据存储，不参与计算", "替代云端计算，实现完全本地化处理", "", ""], "r": "B", "e": "边缘计算是在靠近数据源头的网络边缘侧，就近处理数据。在智慧水利里能在数据采集端就近处理部分数据，可减轻数据传输压力和云端处理压力。A是传统集中式处理模式；C边缘计算参与计算；D边缘计算不能完全替代云端计算。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776593", "t": 1, "q": "在水资源数据质量评价中，\"数据完整性\"指标主要评价的是？", "a": ["数据是否符合既定格式标准", "数据是否无缺失、无遗漏", "数据是否与实际情况一致", "数据传输过程是否无丢失", "", ""], "r": "B", "e": "“数据完整性”强调数据无缺失、无遗漏。A选项说的是数据格式，C选项是数据准确性，D选项侧重于传输情况。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776594", "t": 1, "q": "大数据技术在水质监测中的应用，可实现的功能不包括以下哪项？", "a": ["基于历史水质数据识别异常污染事件", "实时监测水体pH值、溶解氧等参数", "预测未来一段时间内水质变化趋势", "制定水污染治理的法律法规", "", ""], "r": "D", "e": "大数据技术可处理和分析水质数据，用于识别异常、实时监测和预测趋势，但制定法律法规属于政策制定层面，并非大数据技术在水质监测中的功能。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776595", "t": 1, "q": "数字孪生水利工程建设中，\"虚实交互\"环节的核心要求是？", "a": ["虚拟模型与物理实体的静态外观一致", "虚拟模型能实时接收物理实体数据，并同步更新状态", "虚拟模型仅用于展示，不与物理实体交互", "虚拟模型的更新频率低于物理实体变化频率", "", ""], "r": "B", "e": "“虚实交互”强调虚拟与现实之间的动态互动，核心是虚拟模型能实时获取物理实体数据并同步更新状态。A选项静态外观一致并非核心要求；C选项不交互不符合“交互”含义；D选项更新频率低无法实现实时交互。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776596", "t": 1, "q": "在水利数据安全防护中，针对水利调度指令等敏感数据的传输安全，最适合采用的技术是？", "a": ["数据脱敏技术", "传输层加密协议（如SSL/TLS）", "数据备份技术", "访问控制技术", "", ""], "r": "B", "e": "题目关注敏感数据传输安全，传输层加密协议可对传输数据加密，保障传输安全；数据脱敏用于处理数据隐私，数据备份用于数据恢复，访问控制用于限制访问权限，均不针对传输安全。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776597", "t": 1, "q": "某流域采用大数据模型进行水资源调度优化，其优化目标不包括以下哪项？", "a": ["提高水资源利用效率", "保障流域内生活、生产、生态用水需求", "减少水利工程的建设数量", "降低水资源调度成本", "", ""], "r": "C", "e": "水资源调度优化主要围绕水资源的合理使用和调配。A提高利用效率、B保障用水需求、D降低调度成本都是常见目标。而减少水利工程建设数量并非水资源调度优化直接目标。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776598", "t": 1, "q": "智慧水利中的\"数字流域\"与\"数字孪生流域\"的主要区别在于？", "a": ["数字流域是静态模型，数字孪生流域是动态可交互模型", "数字流域仅包含地形数据，数字孪生流域仅包含水文数据", "数字流域用于展示，数字孪生流域用于存储数据", "数字流域覆盖范围小，数字孪生流域覆盖范围大", "", ""], "r": "A", "e": "数字流域侧重于构建相对静态的流域数字化模型，而数字孪生流域强调与物理流域实时映射、动态交互。B选项两者包含数据都不局限于所说内容；C选项数字孪生流域不只是用于存储数据，也有分析决策等功能，数字流域也不只是展示；D选项覆盖范围并非两者主要区别。所以选A。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776599", "t": 1, "q": "在水资源数据管理中，\"增量数据同步\"技术的主要优势是？", "a": ["同步所有历史数据，确保数据完整", "仅同步新增或变化的数据，减少数据传输量", "同步速度比全量同步慢，但精度更高", "仅同步结构化数据，不同步非结构化数据", "", ""], "r": "B", "e": "“增量”强调的是新增或有变化的部分。增量数据同步就是只同步这部分数据，能减少数据传输量。A说同步所有历史数据是全量同步特点；C中增量同步速度通常比全量快；D增量数据同步并非只针对结构化数据。所以选B。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776600", "t": 1, "q": "大数据技术在水利应急管理中的应用，不包括以下哪项场景？", "a": ["台风引发的洪水灾害应急响应预案生成", "地震导致的水库溃坝风险快速评估", "水利应急物资的日常库存管理（非应急状态）", "突发水污染事件的扩散路径模拟", "", ""], "r": "C", "e": "大数据技术在水利应急管理应用侧重于应急场景。C选项是水利应急物资日常库存管理，处于非应急状态，不属于应急管理应用场景。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776601", "t": 1, "q": "在数字水利技术中，遥感技术（RS）在水资源监测中的主要应用是？", "a": ["监测水库水位变化", "获取流域植被覆盖度、水体面积等空间数据", "测量水流速度", "监测水利工程变形", "", ""], "r": "B", "e": "遥感技术可大范围获取地物空间信息。选项B获取流域植被覆盖度、水体面积等空间数据符合其特点。A监测水库水位变化常用水位计等；C测量水流速度有专门流速仪；D监测水利工程变形用测量仪器等。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776602", "t": 1, "q": "根据《水利大数据发展行动计划》，水利大数据平台的核心功能不包括以下哪项？", "a": ["水利数据资源汇聚整合", "水利数据共享服务", "水利数据商业化运营", "水利数据分析应用", "", ""], "r": "C", "e": "水利大数据平台主要聚焦于水利行业的数据管理与应用以服务水利工作，并非以商业化运营为核心功能，而数据汇聚整合、共享服务、分析应用都是其关键功能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776603", "t": 1, "q": "智慧水利中，用于实现水利工程设备远程控制的技术是？", "a": ["数据可视化技术", "远程监控与控制（RTU）技术", "数据挖掘技术", "数据备份技术", "", ""], "r": "B", "e": "RTU技术可对水利工程设备进行远程监控与控制；数据可视化是展示数据，数据挖掘是分析数据，数据备份是保存数据，均与远程控制设备无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776604", "t": 1, "q": "在水资源数据管理中，\"数据生命周期管理\"的最后一个环节是？", "a": ["数据采集", "数据归档或销毁", "数据分析", "数据存储", "", ""], "r": "B", "e": "数据生命周期管理涵盖数据从产生到最终结束的全过程，顺序一般是采集、存储、分析等，最后是归档或销毁。所以最后一个环节是数据归档或销毁。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776605", "t": 1, "q": "大数据技术在水利决策支持中的作用，主要体现在以下哪方面？", "a": ["替代决策者进行决策", "为决策者提供数据支撑和多情景分析结果", "仅展示历史数据，不提供分析结果", "直接执行水利调度指令", "", ""], "r": "B", "e": "大数据技术主要是辅助决策，能提供数据和多情景分析结果帮助决策者，不能替代决策、直接执行指令，也并非仅展示历史数据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241856", "t": 2, "q": "智慧水利建设中，数字孪生水利工程的构建需要整合多源技术，下列哪些技术属于其核心支撑技术？（　）", "a": ["高精度三维建模与可视化技术", "物理机理与数据驱动融合的仿真计算技术", "物联网实时数据采集技术", "大数据分析与人工智能决策技术", "普通建筑工程施工技术", ""], "r": "ABCD", "e": "数字孪生水利工程需整合多种先进技术来实现对水利工程的精准映射和智能决策。A可实现工程三维呈现，B用于仿真模拟，C能实时获取数据，D辅助分析决策，均是核心支撑技术；而普通建筑工程施工技术并非数字孪生水利工程构建的核心支撑技术。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241857", "t": 2, "q": "水资源数据管理中，多源异构数据的整合方法通常包括下列哪些？（　）", "a": ["制定统一的数据编码与格式标准", "构建数据中台实现数据清洗、转换与融合", "采用ETL（抽取-转换-加载）工具处理批量数据", "直接删除格式不统一的数据", "使用数据联邦技术实现数据逻辑整合，物理存储不变", ""], "r": "ABCE", "e": "A选项统一编码和格式标准利于数据整合；B选项数据中台可进行数据清洗等操作促进整合；C选项ETL工具能处理批量数据完成整合；E选项数据联邦技术可实现逻辑整合。而D选项直接删除格式不统一数据会造成数据丢失，不是正确的整合方法。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241858", "t": 2, "q": "大数据技术在水利洪水防控中的应用场景包括下列哪些？（　）", "a": ["基于多源数据的洪水致灾风险动态评估", "洪水演进过程的实时模拟与可视化展示", "水库群联合防洪调度方案的智能生成", "洪水过后的灾情快速评估与损失统计", "仅依靠历史洪水数据进行固定方案调度", ""], "r": "ABCD", "e": "大数据技术可利用多源数据进行洪水致灾风险评估、实时模拟洪水演进、智能生成水库群调度方案、快速评估洪水灾情与损失，而仅依靠历史洪水数据进行固定方案调度未体现大数据技术优势。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241859", "t": 2, "q": "智慧水利中的感知层设备选型需考虑多方面因素，下列哪些属于关键选型因素？（　）", "a": ["监测数据的精度与分辨率要求", "设备运行环境的适应性（如高温、高湿、腐蚀性）", "设备的功耗与供电方式（如市电、太阳能、电池）", "设备的数据传输距离与通信协议兼容性", "设备的外观设计是否美观", ""], "r": "ABCD", "e": "智慧水利感知层设备选型关键要满足功能和运行要求。A关乎监测质量，B影响设备在特定环境下能否正常工作，C涉及设备持续运行的保障，D关系到数据能否有效传输，而E外观设计美观并非关键因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241860", "t": 2, "q": "水资源数据共享应遵循\"安全可控、按需共享\"原则，下列哪些措施属于数据共享中的安全保障措施？（　）", "a": ["对共享数据进行脱敏处理（如隐藏敏感标识信息）", "建立共享数据的访问权限分级控制机制", "记录共享数据的使用日志，实现溯源追踪", "将所有共享数据公开至互联网，方便获取", "采用加密传输协议（如VPN）传输共享数据", ""], "r": "ABCE", "e": "数据共享安全保障需确保数据安全和使用规范。A选项脱敏处理避免敏感信息泄露；B选项权限分级控制可防止非授权访问；C选项记录日志便于追踪问题；E选项加密传输保障数据传输安全。而D选项将所有共享数据公开至互联网会造成安全隐患。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241861", "t": 2, "q": "大数据技术在水利工程安全监测中，可分析的监测数据类型包括下列哪些？（　）", "a": ["混凝土坝的位移、沉降监测数据", "闸门启闭机的运行电流、电压数据", "坝体渗流压力、渗流量监测数据", "工程周边的气象数据（如风速、降雨量）", "工程建设单位的财务报销数据", ""], "r": "ABCD", "e": "水利工程安全监测主要围绕工程本身及周边环境与运行相关数据，A、B、C选项是直接关于水利工程结构和设备运行的监测数据，D选项气象数据会影响水利工程安全，而E选项工程建设单位财务报销数据与工程安全监测无关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241862", "t": 2, "q": "智慧水利平台的核心功能模块应涵盖多个业务领域，下列哪些属于其核心功能模块？（　）", "a": ["水资源调度与管理模块", "水利工程安全监测与预警模块", "水文气象预报预测模块", "水利政务办公自动化模块", "水利应急指挥与处置模块", ""], "r": "ABCE", "e": "智慧水利平台的核心功能模块主要关注水利行业的关键业务领域。以下是对各选项的简要A. 水资源调度与管理模块 - 这是智慧水利平台的核心功能之一，涉及水资源的合理分配和有效管理。B. 水利工程安全监测与预警模块 - 同样核心，它确保水利工程的安全运行，并通过预警系统提前识别潜在风险。C. 水文气象预报预测模块 - 对水利行业至关重要，它提供准确的水文和气象数据，支持决策制定。D. 水利政务办公自动化模块 - 虽然提高办公效率，但更多属于行政管理层面的辅助功能，并非核心业务模块。E. 水利应急指挥与处置模块 - 在应对水利突发事件时起关键作用，属于核心功能模块。综上所述，智慧水利平台的核心功能模块应包括：水资源调度与管理、水利工程安全监测与预警、水文气象预报预测以及水利应急指挥与处置。所以，正确答案是ABCE。", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241863", "t": 2, "q": "水资源数据生命周期管理包括多个阶段，下列哪些属于数据生命周期的关键阶段？（　）", "a": ["数据需求分析与规划阶段", "数据采集与录入阶段", "数据处理与质量控制阶段", "数据存储与备份阶段", "数据应用与销毁阶段", ""], "r": "ABCDE", "e": "水资源数据生命周期管理涵盖从需求到最终销毁的全流程，选项中各阶段都是其中的关键环节。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241864", "t": 2, "q": "大数据技术在水利水质管理中的应用，可实现的功能包括下列哪些？（　）", "a": ["水质指标（如COD、氨氮）的实时监测与超标预警", "突发性水污染事件的污染源追溯与扩散路径预测", "流域水质状况的长期变化趋势分析", "水质改善措施的效果评估与优化建议", "仅对水质数据进行简单存储，不做分析", ""], "r": "ABCD", "e": "大数据技术在水利水质管理中能实时监测指标并预警、追溯污染源和预测扩散路径、分析长期变化趋势、评估改善措施效果并给出优化建议，而不只是简单存储数据。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241865", "t": 2, "q": "智慧水利建设中，数字孪生流域的构建需要哪些基础数据支撑？（　）", "a": ["流域地形地貌高精度数据（如DEM、DOM）", "流域内水利工程的设计图纸与运行参数数据", "流域水文气象长期观测数据（如降水、径流、蒸发）", "流域内社会经济数据（如人口、GDP、用水需求）", "流域外的无关区域交通数据", ""], "r": "ABCD", "e": "构建数字孪生流域需与流域相关的数据，A地形地貌、B水利工程、C水文气象、D社会经济数据都对其有支撑作用，而E流域外无关区域交通数据与构建数字孪生流域无关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241866", "t": 2, "q": "水资源数据管理中，数据质量问题的常见类型包括下列哪些？（　）", "a": ["数据缺失（如某时段监测数据未采集到）", "数据异常（如监测值超出合理范围）", "数据重复（如同一数据多次录入）", "数据不一致（如同一指标不同来源数据差异大）", "数据格式统一（如所有数据均按标准格式存储）", ""], "r": "ABCD", "e": "数据质量问题是指影响数据准确性、完整性等方面的问题。A选项数据缺失、B选项数据异常、C选项数据重复、D选项数据不一致都会影响数据质量。而E选项数据格式统一是有利于数据管理的良好情况，并非质量问题。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241867", "t": 2, "q": "大数据技术在水利旱情管理中的应用，可提供的服务包括下列哪些？（　）", "a": ["旱情等级的实时划分与空间分布展示", "旱情发展趋势的短期预测", "不同区域的抗旱供水方案优化", "旱情对农业生产影响的评估", "仅统计历史旱情发生次数", ""], "r": "ABCD", "e": "大数据能整合实时数据来实现旱情等级实时划分与空间分布展示、对旱情发展做短期预测；能分析不同区域情况优化抗旱供水方案、评估旱情对农业生产影响。而仅统计历史旱情发生次数利用大数据技术的意义不大，不是其主要应用服务。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241868", "t": 2, "q": "智慧水利中的网络层需要满足数据传输的多方面要求，下列哪些属于网络层的关键技术要求？（　）", "a": ["高带宽（满足海量监测数据传输）", "低延迟（满足实时控制指令传输）", "高可靠性（避免数据传输中断）", "广覆盖（覆盖偏远监测站点）", "仅支持单一通信协议（如仅支持WiFi）", ""], "r": "ABCD", "e": "智慧水利网络层要满足数据传输多方面需求，A选项高带宽利于海量数据传输，B选项低延迟能保障实时控制指令及时传达，C选项高可靠性可防范数据传输中断，D选项广覆盖能让偏远站点数据也可传输，而仅支持单一通信协议会限制网络适用性，不符合需求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241869", "t": 2, "q": "水资源数据共享的主要方式包括下列哪些？（　）", "a": ["通过水利数据共享平台在线查询下载", "通过API接口实现跨系统数据对接", "通过离线存储介质（如硬盘）拷贝交换", "通过电子邮件发送数据文件", "拒绝任何形式的数据共享", ""], "r": "ABCD", "e": "水资源数据共享是为促进数据利用，A、B、C、D都是常见的数据共享方式，而E拒绝共享与数据共享相悖。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241870", "t": 2, "q": "智慧水利体系构建中，属于\"感知层\"的关键技术设备有哪些（　）？", "a": ["水文站雨量传感器", "流域三维地理信息系统（GIS）软件", "堤防GNSS变形监测终端", "水库水位计", "水利数据中台服务器", ""], "r": "ACD", "e": "感知层主要是获取水利相关数据的设备。A水文站雨量传感器可感知雨量，C堤防GNSS变形监测终端能监测堤防变形，D水库水位计可测量水位，都属于感知层设备。B是软件用于地理信息处理，E是数据中台服务器用于数据存储和处理，不属于感知层。答案选ACD。 ", "ap": [false, false
