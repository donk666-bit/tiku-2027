<!doctype html>
<html lang="zh-CN">
<head>

<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>

<script>
const DATA = {"id": "hd-outline", "name": "华电·水利水电类（2026考纲精练）", "chapters": [{"k": "K01", "n": "知识点01  应力应变、内力和强度分析理论", "qs": [{"id": "2035637024702205952", "t": 1, "q": "在平面应力状态下，某点的两个主应力分别为σ1=120MPa，σ2=-80MPa，σ3=0，根据第三强度理论（最大切应力理论），该点的相当应力σr3应为多少？", "a": ["40MPa", "120MPa", "200MPa", "80MPa", "", ""], "r": "C", "e": "第三强度理论相当应力公式为σr3 = σ1 - σ3（当σ1≥σ2≥σ3 ），本题中σ1 = 120MPa，σ3 = - 80MPa，代入公式得σr3=120 - (-80)=200MPa。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205953", "t": 1, "q": "梁在受弯变形时，某截面上的弯矩M=12kN·m，该截面为矩形，尺寸b=200mm，h=300mm，剪力 V=60kN，此截面中性轴处的弯曲切应力为多少？", "a": ["0MPa", "1.0MPa", "1.5MPa", "2.0MPa", "", ""], "r": "C", "e": "矩形截面梁弯曲切应力最大值出现在中性轴处，计算公式 τmax=3V/(2A)。已知 V=60kN=60×10³N，b=200mm，h=300mm。截面面积 A=b×h=200×300=60000mm²。代入计算：τmax=(3×60×10³)/(2×60000)=1.5MPa。弯矩用于计算正应力，中性轴位置正应力为 0，不影响切应力计算。因此选 C。", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205954", "t": 1, "q": "对于线性弹性材料，在单向拉伸应力状态下，若已知材料的弹性模量E和泊松比μ，当轴向正应力为σ时，横向正应变ε'应为多少？", "a": ["-σ/(Eμ)", "-μσ/E", "σ/(Eμ)", "μσ/E", "", ""], "r": "B", "e": "根据胡克定律，单向拉伸时轴向正应变ε = σ/E ，泊松比μ定义为横向正应变ε'与轴向正应变ε绝对值之比且横向应变与轴向应变符号相反，即μ = -ε'/ε ，将ε = σ/E代入可得ε' = -μσ/E。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205955", "t": 1, "q": "某超静定梁，由于支座沉降产生内力，该内力的大小主要取决于以下哪个因素？", "a": ["梁的跨度大小", "支座沉降量的大小", "梁的刚度（EI）分布", "梁所受荷载的大小", "", ""], "r": "C", "e": "超静定结构因支座沉降产生内力，内力大小主要与结构刚度分布有关。梁的刚度（EI）分布不同，抵抗变形能力不同，产生的内力也不同。而梁跨度、支座沉降量和梁所受荷载并非主要决定因素。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205956", "t": 1, "q": "在弯扭组合变形的圆轴强度计算中，若采用第四强度理论（形状改变比能理论），其相当应力σr4的表达式应为（其中σ为弯曲正应力，τ为扭转切应力）？", "a": ["√(σ²+τ²)", "√(σ²+2τ²)", "√(σ²+3τ²)", "σ+√3τ", "", ""], "r": "C", "e": "第四强度理论相当应力公式是σr4 = √(σ² + 3τ²) 。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205957", "t": 1, "q": "平面应力状态下，某点的应力分量为σx=80MPa，σy=40MPa，τxy=30MPa，该点的最大切应力τmax应为多少？", "a": ["32MPa", "34MPa", "36MPa", "40MPa", "", ""], "r": "C", "e": "根据平面应力状态下最大切应力的计算公式：τmax = √[((σx - σy)/2)² + τxy²]<br />代入数据：σx = 80MPa，σy = 40MPa，τxy = 30MPa<br />(σx - σy)/2 = (80 - 40)/2 = 20MPa<br />τmax = √(20² + 30²) = √(400 + 900) = √1300 ≈ 36.06MPa", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205958", "t": 1, "q": "下列关于材料强度指标的说法中，正确的是哪一项？", "a": ["屈服强度是脆性材料唯一的强度指标", "抗拉强度是材料在断裂前所能承受的最大应力，适用于所有材料的强度设计", "对于塑性材料，在静载作用下，一般以屈服强度作为强度设计的依据", "弹性极限是材料发生塑性变形前的最大应力，其数值与屈服强度完全相等", "", ""], "r": "C", "e": "脆性材料无明显屈服现象，强度指标有抗拉、抗压等，A错；抗拉强度并非适用于所有材料强度设计，如脆性材料抗压强度更重要，B错；弹性极限和屈服强度数值一般不相等，D错；塑性材料静载下通常以屈服强度作为强度设计依据，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205959", "t": 1, "q": "某等截面直杆，在轴向拉力作用下，杆长由原长L变为L+ΔL，若已知杆的横截面面积A，弹性模量E，此时杆内的轴力N应为多少？", "a": ["EAΔL/L", "EA L/ΔL", "AΔL/(E<br />D.", "L/(E AΔL)", "", ""], "r": "A", "e": "根据胡克定律「test/yiwen_img/importSubject/2035637011313987584.png」，其中「test/yiwen_img/importSubject/2035637011431428096.png」（应力），「test/yiwen_img/importSubject/2035637011515314176.png」（应变），将「test/yiwen_img/importSubject/2035637011599200256.png」和「test/yiwen_img/importSubject/2035637011666309120.png」代入胡克定律可得「test/yiwen_img/importSubject/2035637011771166720.png」，整理得出「test/yiwen_img/importSubject/2035637011850858496.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205960", "t": 1, "q": "在梁的内力分析中，对于承受均布荷载的简支梁，下列关于剪力图和弯矩图的描述，正确的是哪一项？", "a": ["剪力图为斜直线，弯矩图为抛物线，且弯矩图在剪力为零处有极值", "剪力图为水平线，弯矩图为斜直线，且弯矩图在跨中处有最大值", "剪力图为抛物线，弯矩图为斜直线，且剪力图在跨中处为零", "剪力图为斜直线，弯矩图为水平线，且剪力图在两端支座处为零", "", ""], "r": "A", "e": "承受均布荷载的简支梁，其剪力图是斜直线，弯矩图是抛物线，并且弯矩图极值出现在剪力为零处。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205961", "t": 1, "q": "对于平面应力状态下的应力圆，下列说法错误的是哪一项？", "a": ["应力圆上的每一个点对应着构件上该点的一个截面", "应力圆的圆心坐标为((σx+σy)/2,0)", "应力圆的半径为√[((σx-σy)/2)²+τxy²]", "应力圆与σ轴的两个交点对应的截面上，切应力不为零", "", ""], "r": "D", "e": "应力圆与σ轴交点对应主平面，主平面上切应力为零，D说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205962", "t": 1, "q": "某静定刚架，在水平荷载作用下，下列关于其内力计算的说法，正确的是哪一项？", "a": ["刚架的内力计算只需考虑平衡条件，无需考虑变形协调条件", "刚架的弯矩图在刚节点处必须满足顺时针弯矩等于逆时针弯矩", "刚架的剪力图和轴力图在杆件任意截面处均连续，无突变", "刚架的内力只与荷载大小有关，与刚架的几何尺寸无关", "", ""], "r": "A", "e": "静定结构内力计算只需平衡条件，无需变形协调条件；刚节点处弯矩平衡是代数和为零非顺逆相等；集中力处剪力图会突变；内力与荷载和几何尺寸都有关。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205963", "t": 1, "q": "根据圣维南原理，在距离载荷作用点足够远的地方，构件的应力分布主要取决于以下哪个因素？", "a": ["载荷的具体分布形式", "构件的截面形状", "载荷的合力和合力矩", "构件的材料性能", "", ""], "r": "C", "e": "圣维南原理指出，力作用于杆端方式的不同，只会使与杆端距离不大于杆的横向尺寸的范围内受到影响。在距离载荷作用点足够远的地方，应力分布主要取决于载荷的合力和合力矩。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205964", "t": 1, "q": "在组合变形（拉弯组合）的强度计算中，若构件横截面为对称截面，轴向拉力为N，弯矩为M，截面面积为A，抗弯截面系数为Wz，则该截面的最大正应力σmax应为多少？", "a": ["N/A+M/Wz", "|N/A-M/Wz|", "N/A+2M/Wz", "√[(N/A)²+(M/Wz)²]", "", ""], "r": "A", "e": "拉弯组合变形时，轴向拉力产生均匀正应力σN = N/A，弯矩产生的正应力在边缘最大，为σM = M/Wz，二者叠加，最大正应力是二者之和即σmax=N/A + M/Wz，所以答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205965", "t": 1, "q": "下列关于梁的挠曲线近似微分方程的说法，错误的是哪一项？", "a": ["挠曲线近似微分方程的建立基于小变形假设和平面假设", "方程的形式为EIw''=-M(x)，其中w为挠度，M(x)为弯矩", "该方程适用于所有材料的梁，只要满足小变形条件", "通过积分该方程可求得梁的挠度和转角", "", ""], "r": "C", "e": "挠曲线近似微分方程是基于线弹性范围内、小变形假设和平面假设建立的，并非适用于所有材料，只适用于线弹性材料的梁。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205966", "t": 1, "q": "平面应力状态下，若某点的两个主应力σ1和σ2均为拉应力，且σ1>σ2>0，当该点发生破坏时，根据第二强度理论（最大伸长线应变理论），其破坏条件应为（其中[σ]为材料的许用拉应力）？", "a": ["σ1≥[σ]", "σ2≥[σ]", "σ1-μσ2≥[σ]", "σ2-μσ1≥[σ]", "", ""], "r": "C", "e": "第二强度理论表达式为σ1 - μ(σ2 + σ3) ≤ [σ] ，本题是平面应力状态，σ3 = 0，所以破坏条件为σ1 - μσ2 ≥ [σ] 。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205967", "t": 1, "q": "某圆轴同时承受扭矩T和轴向拉力N，若已知轴的直径d，材料的许用应力[σ]，采用第三强度理论设计该轴时，其强度条件应为？", "a": ["√[(4N/(πd²))²+3*(16T/(πd³))²]≤[σ]", "(4N/(πd²))+(16T/(πd³))≤[σ]", "√[(4N/(πd²))²+(16T/(πd³))²]≤[σ]", "3*(4N/(πd²))+(16T/(πd³))≤[σ]", "", ""], "r": "A", "e": "本题可根据圆轴在扭矩和轴向拉力共同作用下的应力情况，结合第三强度理论来确定强度条件。### 步骤一：分析圆轴在扭矩和轴向拉力作用下的应力 轴向拉应力：圆轴受轴向拉力N时，横截面上的轴向拉应力「test/yiwen_img/importSubject/2035637011934744576.png」为「test/yiwen_img/importSubject/2035637012006047744.png」，其中「test/yiwen_img/importSubject/2035637012089933824.png」，所以「test/yiwen_img/importSubject/2035637012186402816.png」。 扭转切应力：圆轴受扭矩T时，横截面上的扭转切应力「test/yiwen_img/importSubject/2035637012303843328.png」为「test/yiwen_img/importSubject/2035637012375146496.png」，其中「test/yiwen_img/importSubject/2035637012467421184.png」，所以「test/yiwen_img/importSubject/2035637012572278784.png」。### 步骤二：根据第三强度理论确定强度条件第三强度理论的表达式为「test/yiwen_img/importSubject/2035637012664553472.png」，将「test/yiwen_img/importSubject/2035637012790382592.png」，「test/yiwen_img/importSubject/2035637012572278784.png」代入可得：「test/yiwen_img/importSubject/2035637012983320576.png」综上，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205968", "t": 1, "q": "在梁的设计中，若要提高梁的抗弯强度，下列措施中最有效的是哪一项（在相同材料用量下）？", "a": ["增大梁的横截面高度，减小宽度", "增大梁的横截面宽度，减小高度", "在梁的受拉区和受压区同时增加材料", "将梁的横截面改为实心圆形", "", ""], "r": "A", "e": "梁的抗弯强度与截面抵抗矩有关，在相同材料用量下，增大梁的横截面高度能大幅提高截面抵抗矩从而提高抗弯强度，而减小宽度影响相对小。B选项增大宽度减小高度对抗弯强度提升有限；C选项在受拉和受压区同时增加材料不如增大高度有效；D选项实心圆形截面在抗弯方面不如增大高度的矩形截面。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205969", "t": 1, "q": "对于线性弹性体的变形，下列关于叠加原理适用条件的说法，正确的是哪一项？", "a": ["叠加原理仅适用于构件的内力计算，不适用于变形计算", "只要材料满足胡克定律，叠加原理就一定适用", "叠加原理适用于多个荷载共同作用下的内力和变形计算，前提是荷载与内力、变形之间为线性关系", "叠加原理适用于所有荷载作用形式，无论荷载大小", "", ""], "r": "C", "e": "叠加原理用于多个荷载共同作用下的内力和变形计算，需荷载与内力、变形是线性关系。A选项叠加原理也适用于变形计算；B仅材料满足胡克定律不够，还需荷载与内力、变形线性；D不是适用于所有荷载形式和大小。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205970", "t": 1, "q": "某点处于空间应力状态，三个主应力分别为σ1=150MPa，σ2=100MPa，σ3=50MPa，该点的体积改变比能v_v应为多少（已知材料弹性模量E，泊松比μ）？", "a": ["(1-2μ)/(6E)(150+100+50)²", "(1-2μ)/(6E)(150²+100²+50²)", "(1-2μ)/(3E)(150+100+50)", "(1-2μ)/(6E)(150+100+50)", "", ""], "r": "A", "e": "体积改变比能公式为「test/yiwen_img/importSubject/2035637013104955392.png」，将「test/yiwen_img/importSubject/2035637013197230080.png」，「test/yiwen_img/importSubject/2035637013306281984.png」，「test/yiwen_img/importSubject/2035637013385973760.png」代入可得「test/yiwen_img/importSubject/2035637013478248448.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205971", "t": 1, "q": "梁的纯弯曲试验中，测得梁的曲率半径为ρ，若梁的抗弯刚度为EI，此时梁横截面上的弯矩M应为多少？", "a": ["M=EI/ρ", "M=ρ/EI", "M=EIρ", "M=E/（Iρ）", "", ""], "r": "A", "e": "梁纯弯曲时，弯矩与曲率半径、抗弯刚度的关系为M = EI / ρ。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205972", "t": 1, "q": "下列关于应力和应变的说法，正确的是哪一项？", "a": ["应力是构件内部单位面积上的内力，与构件的材料无关;应变是构件的变形程度，与材料有关", "应力和应变都是描述构件受力状态的物理量，均与构件的材料和几何尺寸无关", "对于相同的应力，不同材料的应变不同（因弹性模量不同）;对于相同的应变，不同材料的应力不同", "应力越大，应变一定越大，二者呈正比关系", "", ""], "r": "C", "e": "应力是单位面积内力，与材料和几何尺寸无关；应变与材料弹性模量有关，不同材料弹性模量不同，相同应力下应变不同，相同应变下应力也不同。应力和应变并非简单的正比关系，还受材料力学性能影响。A应变也与几何尺寸等有关；B应变与材料有关；D应力和应变不一定正比。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205973", "t": 1, "q": "某超静定结构，由于温度变化产生内力，该内力的大小与下列哪个因素无关？", "a": ["结构的刚度分布", "温度变化的幅度", "材料的线膨胀系数", "结构的初始几何尺寸", "", ""], "r": "D", "e": "超静定结构因温度变化产生的内力与结构刚度分布、温度变化幅度、材料线膨胀系数有关。结构初始几何尺寸不影响温度内力大小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205974", "t": 1, "q": "在扭转强度计算中，圆轴的抗扭截面系数Wp与下列哪个几何参数的关系最为密切？", "a": ["横截面面积", "横截面的惯性矩", "横截面的极惯性矩", "横截面的形心位置", "", ""], "r": "C", "e": "圆轴抗扭截面系数「test/yiwen_img/importSubject/2035637013566328832.png」与极惯性矩「test/yiwen_img/importSubject/2035637013637632000.png」关系紧密，「test/yiwen_img/importSubject/2035637013708935168.png」 。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637024702205975", "t": 1, "q": "平面应力状态下，若某点的应力分量满足σx=σy，τxy=0，则该点的应力状态属于哪种类型？", "a": ["单向应力状态", "双向等拉（压）应力状态", "纯剪切应力状态", "复杂应力状态", "", ""], "r": "B", "e": "已知σx = σy且τxy = 0，说明该点在两个相互垂直方向上应力相等且无切应力，符合双向等拉（压）应力状态特点。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006080", "t": 2, "q": "在水利水电工程的构件应力分析中，下列关于平面应力状态的说法正确的有哪些？", "a": ["平面应力状态下，有一个方向的正应力恒为零", "平面应力状态的应力圆一定与σ轴有两个交点", "平面应力状态下，任意斜截面上的正应力最大值等于最大主应力", "平面应力状态下，平面内的最大切应力等于两个主应力之差的一半", "平面应力状态的主应力一定有一个为零", ""], "r": "ABCD", "e": "A 选项，平面应力状态定义：单元体在 z 方向（垂直于平面方向）的正应力 σz=0，即有一个方向正应力恒为零，表述正确。B 选项，应力圆与 σ 轴交点对应平面内两个主应力，因此平面应力状态的应力圆一定与 σ 轴存在两个交点，表述正确。C 选项，主应力是所有斜截面中正应力的极值，所以任意斜截面上正应力最大值等于最大主应力，表述正确。D 选项，限定 “平面内”，平面内最大切应力等于平面内两个主应力之差的一半，表述正确。E 选项，平面应力状态只是 z 方向正应力为 0，但 0 不一定是主应力。举例：σx=80MPa，σy=40MPa，τxy=30MPa，属于平面应力状态，三个主应力约为 96.06MPa、23.94MPa、0MPa，此时 0 是第三个主应力；但如果主应力计算结果全部不为 0，0 就不是主应力。因此 “主应力一定有一个为零” 说法错误。<br />综上，正确选项 ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006081", "t": 2, "q": "在梁的弯曲强度计算中，影响梁弯曲正应力大小的因素有哪些？", "a": ["梁的横截面形状", "梁所承受的弯矩大小", "材料的弹性模量", "横截面到中性轴的距离", "梁的跨度", ""], "r": "ABD", "e": "梁弯曲正应力公式为「test/yiwen_img/importSubject/2035637017446060032.png」 ，其中M是弯矩，y是横截面到中性轴的距离，「test/yiwen_img/importSubject/2035637017546723328.png」与梁的横截面形状有关。所以影响梁弯曲正应力大小的因素有梁的横截面形状、梁所承受的弯矩大小、横截面到中性轴的距离。弹性模量影响变形，梁跨度主要影响弯矩分布。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006082", "t": 2, "q": "下列关于材料强度理论的说法中，正确的有哪些？", "a": ["第一强度理论（最大拉应力理论）适用于脆性材料的拉伸破坏", "第二强度理论（最大伸长线应变理论）适用于塑性材料的压缩破坏", "第三强度理论（最大切应力理论）适用于塑性材料的剪切破坏", "第四强度理论（形状改变比能理论）的相当应力值通常小于第三强度理论", "莫尔强度理论适用于岩石等非对称屈服材料", ""], "r": "ACDE", "e": "第一强度理论用于脆性材料拉伸破坏；第三强度用于塑性材料剪切等破坏；第四强度相当应力一般小于第三强度；莫尔理论用于非对称屈服材料。而第二强度理论在工程中应用较少，且不适用于塑性材料压缩破坏。答案：ACDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637027353006083", "t": 2, "q": "在轴向拉压杆的受力分析中，下列哪些情况会导致杆件产生应力集中现象？", "a": ["杆件横截面尺寸突然变化", "杆件上存在螺栓孔", "杆件材料不均匀", "杆件承受的轴向拉力突然增大", "杆件表面存在划痕或裂纹", ""], "r": "ABE", "e": "应力集中是因杆件外形突然变化而引起局部应力急剧增大的现象。A选项横截面尺寸突然变化、B选项存在螺栓孔、E选项表面有划痕或裂纹都会使杆件外形突变。而C选项材料不均匀不是外形变化；D选项拉力突然增大与外形无关。答案选ABE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714368", "t": 3, "q": "在平面应力状态中，若某点的两个正应力σx和σy大小相等、符号相反，且切应力τxy=0，则该点的主应力大小等于σx和σy，主方向与x轴、y轴一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "平面应力状态主应力计算公式为「test/yiwen_img/importSubject/2035637017706106880.png」，已知「test/yiwen_img/importSubject/2035637017794187264.png」，「test/yiwen_img/importSubject/2035637017861296128.png」，代入公式得「test/yiwen_img/importSubject/2035637017966153728.png」，「test/yiwen_img/importSubject/2035637018037456896.png」 ，主方向与x、y轴一致。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714369", "t": 3, "q": "梁的弯曲正应力公式σ=M y/Iz仅适用于等截面直梁，不适用于变截面梁或曲梁。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梁的弯曲正应力公式σ = M y / Iz推导时基于等截面直梁的平面假设等条件，变截面梁和曲梁不满足这些假设，该公式通常不适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714370", "t": 3, "q": "第三强度理论（最大切应力理论）认为，材料的破坏主要由最大切应力引起，其相当应力σr3=σ₁-σ₃，适用于所有塑性材料的强度校核。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "第三强度理论适用于塑性材料的塑性屈服破坏，但并非适用于所有塑性材料的强度校核，比如三向等拉应力状态就不适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714372", "t": 3, "q": "圆轴扭转时，横截面上的切应力沿半径方向呈线性分布，圆心处切应力为零，圆周处切应力最大，该分布规律与材料的弹性模量无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "圆轴扭转切应力公式推导中，切应力与半径成正比，圆心处半径为 0 切应力为零，圆周处半径最大切应力最大，且推导过程未涉及弹性模量。所以此说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714373", "t": 3, "q": "平面应变状态下，某点的纵向应变εz=0，因此该点的纵向正应力σz也一定为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "平面应变状态下，εz = 0，但根据广义胡克定律，σz通常不为零，因为横向应变会引起纵向应力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714374", "t": 3, "q": "梁的剪力图在集中力偶作用点处会发生突变，突变值等于集中力偶矩的大小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "梁的剪力图在集中力作用点处会发生突变，突变值等于集中力大小；而在集中力偶作用点处，剪力图无变化，弯矩图会发生突变，突变值等于集中力偶矩大小。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714375", "t": 3, "q": "材料的泊松比ν越大，说明材料在拉伸时横向收缩越明显，对于不可压缩材料（如橡胶），泊松比ν=0.5。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "泊松比是横向应变与纵向应变的绝对值比值，ν越大表示横向收缩相对纵向伸长越明显；不可压缩材料在受力时体积不变，理论上泊松比为 0.5。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714376", "t": 3, "q": "三向应力状态下，最大主应力σ₁一定大于所有斜截面上的正应力，最小主应力σ₃一定小于所有斜截面上的正应力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三向应力状态下，最大主应力σ₁是所有截面上正应力的最大值，最小主应力σ₃是所有截面上正应力的最小值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714377", "t": 3, "q": "压杆的临界压力与压杆的材料无关，仅与压杆的长度、截面尺寸和支承条件有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压杆的临界压力与材料的弹性模量有关，而弹性模量是材料的特性，所以与材料有关，并非仅与长度、截面尺寸和支承条件有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714378", "t": 3, "q": "在钢筋混凝土适筋梁中，受拉区混凝土因抗拉强度低而开裂，拉力全部由受拉钢筋承担，受压区混凝土承担压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "适筋梁受荷后，受拉区混凝土达到抗拉强度会开裂，开裂后拉力由钢筋承担，受压区混凝土承担压力，符合适筋梁工作原理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714379", "t": 3, "q": "平面应力状态的应力圆若与σ轴没有交点，则说明该点不存在主平面，所有截面上均有切应力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "平面应力状态下，应力圆与σ轴交点对应的就是主平面上的主应力，即使应力圆与σ轴无交点，也存在主平面，只是主应力为纯剪切应力状态下的特殊情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637028598714380", "t": 3, "q": "轴向拉压杆的伸长量ΔL=NL/(EA)，其中A为横截面面积，对于变截面杆，需分段计算伸长量后求和。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "公式ΔL = NL/(EA)适用于等截面的轴向拉压杆，对于变截面杆，不同段的A不同，不能直接用此公式计算整体伸长量，需分段计算各段伸长量后再求和。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K02", "n": "知识点02  建筑材料和结构的力学性能", "qs": [{"id": "2035637035238297600", "t": 1, "q": "在水利水电工程混凝土重力坝坝体应力分析中，若需考虑坝体与基岩接触面的剪切变形对坝体整体稳定性的影响，下列力学模型中最适合采用的是", "a": ["弹性地基梁模型（忽略接触面剪切变形）", "有限元接触单元模型（考虑接触面法向与切向变形）", "刚体极限平衡模型（仅考虑接触面抗剪强度）", "材料力学悬臂梁模型（假设基岩为刚性约束）", "", ""], "r": "B", "e": "本题要考虑坝体与基岩接触面的剪切变形对坝体整体稳定性的影响，需要选择能体现接触面剪切变形的模型。A选项弹性地基梁模型忽略接触面剪切变形，不符合要求；C选项刚体极限平衡模型仅考虑接触面抗剪强度，未考虑剪切变形；D选项材料力学悬臂梁模型假设基岩为刚性约束，也不考虑接触面剪切变形。而B选项有限元接触单元模型可考虑接触面法向与切向变形，能体现坝体与基岩接触面的剪切变形。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297601", "t": 1, "q": "在水利水电工程中，混凝土轴心抗压强度标准值fck的确定需考虑多种因素，下列因素中对fck影响最显著的是（　）", "a": ["混凝土养护温度（20±2℃范围内波动）", "混凝土水灰比", "骨料最大粒径（20mm与40mm差异）", "混凝土龄期（28d与60d差异）", "", ""], "r": "B", "e": "水灰比是影响混凝土强度的关键因素，水灰比越小，混凝土强度越高，对轴心抗压强度标准值fck影响最显著。养护温度在合理范围、骨料粒径小差异、龄期小差异影响相对没水灰比大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297602", "t": 1, "q": "某水利枢纽中的钢筋混凝土T形梁，在承受均布荷载作用时，梁内某截面产生的正应力分布符合下列哪种规律（　）", "a": ["沿截面高度呈线性分布，中性轴处应力为零", "沿截面高度呈抛物线分布，中性轴处应力最大", "沿截面宽度呈线性分布，翼缘边缘应力为零", "沿截面宽度呈抛物线分布，腹板处应力最大", "", ""], "r": "A", "e": "钢筋混凝土梁受弯时，正应力沿截面高度呈线性分布，中性轴处正应力为零。本题是承受均布荷载的T形梁，正应力分布规律也是如此。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297603", "t": 1, "q": "在计算水利工程中岩石边坡的稳定性时，若考虑边坡岩体的剪切破坏，其抗剪强度指标c（黏聚力）和φ（内摩擦角）的取值需依据现场试验，下列试验方法中最适合测定坚硬岩石抗剪强度的是（　）", "a": ["直接剪切试验（使用天然结构面试件）", "三轴压缩试验（围压0.5-5MPa）", "无侧限抗压强度试验", "点荷载试验", "", ""], "r": "B", "e": "坚硬岩石抗剪强度测定，三轴压缩试验能较好模拟岩石实际受力状态，围压0.5 - 5MPa适用于测定坚硬岩石抗剪强度。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297604", "t": 1, "q": "某水利隧洞采用喷锚支护，喷射混凝土的设计强度等级为C25，下列关于喷射混凝土力学性能的说法正确的是（　）", "a": ["其轴心抗拉强度标准值与同强度等级普通混凝土相同", "其弹性模量比同强度等级普通混凝土高10%-15%", "其抗冻等级需根据隧洞水头高度确定，最低不低于F50", "其早期强度增长速度比同强度等级普通混凝土慢", "", ""], "r": "C", "e": "逐一分析选项：A项，喷射混凝土轴心抗拉强度标准值与同强度等级普通混凝土不同；B项，弹性模量比同强度等级普通混凝土低10% - 15%；D项，喷射混凝土早期强度增长速度比同强度等级普通混凝土快。C选项正确，抗冻等级根据隧洞水头高度确定，最低不低于F50。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297605", "t": 1, "q": "在结构力学中，水利工程中的重力坝可简化为超静定结构，下列关于超静定结构内力分析的说法错误的是（　）", "a": ["需考虑结构的变形协调条件", "内力分布与构件的刚度比相关", "温度变化会引起超静定结构产生附加内力", "超静定结构的内力只与荷载作用有关", "", ""], "r": "D", "e": "超静定结构内力分析不仅与荷载作用有关，还需考虑变形协调条件，内力分布和构件刚度比相关，温度变化等也会引起附加内力。D选项说法错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297606", "t": 1, "q": "某水利工程采用HRB400E钢筋，关于该钢筋力学性能的要求，下列说法正确的是（　）", "a": ["屈服强度标准值不小于400MPa，抗拉强度标准值不小于540MPa", "屈服强度标准值不小于360MPa，抗拉强度标准值不小于500MPa", "断后伸长率不小于14%", "最大力总伸长率不小于7%", "", ""], "r": "A", "e": "HRB400E是有较高要求的抗震结构适用的钢筋，屈服强度标准值不小于400MPa，抗拉强度标准值不小于540MPa。断后伸长率不小于16%，最大力总伸长率不小于9%。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297607", "t": 1, "q": "在材料力学中，计算水利工程中圆形截面钢筋混凝土柱的稳定系数φ时，需考虑柱的长细比λ，下列关于长细比λ的计算正确的是（　）", "a": ["λ=μl/i，其中μ为柱的计算长度系数，l为柱的实际长度，i为截面惯性半径", "λ=l/i，其中l为柱的计算长度，i为截面回转半径", "λ=μl/A，其中A为柱的截面面积", "λ=l/A，其中l为柱的实际长度", "", ""], "r": "A", "e": "长细比λ的计算公式为λ = μl/i ，μ是柱的计算长度系数，l是柱的实际长度，i是截面惯性半径。B选项l应为实际长度；C、D选项分母错误，不是截面面积。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297608", "t": 1, "q": "某水利工程中的混凝土重力坝，在正常蓄水位作用下，坝基产生的应力需满足设计要求，下列关于坝基应力计算的说法正确的是（　）", "a": ["坝基垂直应力按均匀分布计算，即σ=W/A（W为坝体自重，A为坝基面积）", "坝基垂直应力需考虑坝体自重和水压力的共同作用，按偏心受压公式计算", "坝基水平应力仅由水压力引起，按线性分布计算", "坝基剪应力均匀分布在坝基接触面上", "", ""], "r": "B", "e": "坝基垂直应力要考虑坝体自重和水压力等共同作用，不是简单均匀分布，按偏心受压公式计算更合理；坝基水平应力不只是由水压力引起；坝基剪应力不是均匀分布。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297609", "t": 1, "q": "在建筑材料中，水利工程常用的硅酸盐水泥初凝时间和终凝时间需满足国家标准，下列关于硅酸盐水泥凝结时间的说法正确的是（　）", "a": ["初凝时间不得早于45min，终凝时间不得迟于6.5h", "初凝时间不得早于30min，终凝时间不得迟于10h", "初凝时间不得迟于45min，终凝时间不得早于6.5h", "初凝时间不得迟于30min，终凝时间不得早于10h", "", ""], "r": "A", "e": "硅酸盐水泥初凝时间不得早于45min，终凝时间不得迟于6.5h 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297610", "t": 1, "q": "在结构力学中，水利工程中的简支梁桥在跨中受集中荷载作用时，梁的剪力图和弯矩图的特征是（　）", "a": ["剪力图在荷载作用点处发生突变，弯矩图在荷载作用点处为斜直线", "剪力图在荷载作用点两侧为常数，弯矩图在荷载作用点处达到最大值", "剪力图在荷载作用点处为零，弯矩图在荷载作用点处发生突变", "剪力图在荷载作用点处为斜直线，弯矩图在荷载作用点两侧为常数", "", ""], "r": "B", "e": "这是一道关于结构力学中简支梁桥在特定荷载条件下剪力图和弯矩图特征的题目。我们可以根据结构力学的基本原理来快速判断：1. 剪力图特征： 当简支梁桥在跨中受集中荷载作用时，该荷载会导致梁在该点产生弯矩。 剪力图表示梁上各点处的剪力分布，而在集中荷载作用点处，由于荷载的突变，剪力也会发生突变。2. 弯矩图特征： 弯矩图表示梁上各点处的弯矩分布。 在集中荷载作用点处，由于荷载产生的弯矩作用，该点的弯矩值会达到一个极值（通常是最大值），而弯矩图在该点附近呈现为斜直线，直至达到该极值点。现在，我们根据这些特征来评估各个选项： A选项描述剪力图在荷载作用点处发生突变，这是正确的，但描述弯矩图在荷载作用点处为斜直线是不准确的，因为弯矩图在该点应达到最大值。 B选项描述剪力图在荷载作用点两侧为常数（反映荷载作用点两侧剪力的不变性），这是符合简支梁受集中荷载作用的特征的；同时描述弯矩图在荷载作用点处达到最大值，这也是准确的。 C选项描述剪力图在荷载作用点处为零，这是不正确的。 D选项描述的剪力图和弯矩图特征均不符合实际情况。综上所述，B选项最准确地描述了简支梁桥在跨中受集中荷载作用时剪力图和弯矩图的特征。所以，正确答案是B选项：“剪力图在荷载作用点两侧为常数，弯矩图在荷载作用点处达到最大值”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297611", "t": 1, "q": "某水利工程采用碾压混凝土筑坝，关于碾压混凝土力学性能的说法，错误的是（　）", "a": ["碾压混凝土的密实度通过振动碾压实现，其抗压强度与密实度正相关", "碾压混凝土的抗渗性主要取决于胶凝材料用量和骨料级配", "碾压混凝土的弹性模量比同强度等级常态混凝土高", "碾压混凝土的干缩率比同强度等级常态混凝土小", "", ""], "r": "C", "e": "通常碾压混凝土弹性模量比同强度等级常态混凝土低，C选项说法错误。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297612", "t": 1, "q": "在材料力学中，计算水利工程中受拉钢筋的应力时，若采用\"平截面假定\"，则下列说法正确的是（　）", "a": ["钢筋应力与钢筋应变呈线性关系，直至钢筋屈服", "钢筋应力与混凝土应变呈线性关系", "受拉区混凝土应力分布为三角形，受压区为矩形", "受拉区混凝土不参与工作，拉力全部由钢筋承担", "", ""], "r": "A", "e": "平截面假定认为截面应变沿高度线性分布；钢筋在屈服前应力应变线性相关。B 错，钢筋应力和混凝土应变不是直接线性；C、D 为适筋梁破坏假定，并非平截面假定本身内容。", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297614", "t": 1, "q": "在结构力学中，水利工程中的拱结构与梁结构相比，其受力特点的主要区别是（　）", "a": ["拱结构只承受轴力，不承受弯矩和剪力", "拱结构承受的弯矩比同跨度、同荷载的梁结构小", "拱结构的支座只提供竖向反力，不提供水平反力", "拱结构的内力分布与拱的曲率无关", "", ""], "r": "B", "e": "拱结构与梁结构相比，拱结构可将部分竖向荷载转化为水平推力，从而使拱内弯矩比同跨度、同荷载的梁结构小。A选项拱结构也承受弯矩和剪力；C选项拱结构支座有水平反力；D选项拱结构内力分布与拱曲率有关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297615", "t": 1, "q": "某水利工程采用C30混凝土，在进行混凝土配合比设计时，确定水胶比需考虑混凝土强度等级和耐久性要求，下列关于水胶比的说法正确的是（　）", "a": ["水胶比越大，混凝土强度越高，耐久性越好", "水胶比应根据混凝土强度公式计算，并满足耐久性规定的最大水胶比限值", "水胶比仅由混凝土强度等级确定，与环境类别无关", "对于C30混凝土，水胶比可任意取值，只要满足和易性要求", "", ""], "r": "B", "e": "水胶比与混凝土强度和耐久性密切相关，水胶比大强度低、耐久性差，要根据强度公式算且满足耐久性最大水胶比限值，还与环境类别有关，不能任意取值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297616", "t": 1, "q": "在材料力学中，水利工程中受扭构件的扭矩计算，下列说法正确的是（　）", "a": ["矩形截面受扭构件的抗扭承载力仅与混凝土强度等级和截面尺寸有关", "钢筋混凝土受扭构件的抗扭承载力由混凝土和受扭钢筋共同承担", "圆形截面受扭构件的剪应力沿截面半径呈均匀分布", "受扭构件的扭矩设计值仅由外荷载产生，与构件刚度无关", "", ""], "r": "B", "e": "矩形截面受扭承载力还与配筋等有关，A 错；圆形截面受扭构件剪应力沿截面半径呈线性分布，C 错；扭矩设计值与构件刚度有关，D 错。钢筋混凝土受扭构件抗扭承载力由混凝土和受扭钢筋共同承担。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297617", "t": 1, "q": "某水利枢纽中的溢洪道闸门，采用钢结构制造，关于钢结构连接方式的力学性能，下列说法正确的是（　）", "a": ["焊接连接的抗拉强度比螺栓连接高，且变形小", "普通螺栓连接的抗剪强度比高强度螺栓摩擦型连接高", "铆钉连接的塑性比焊接连接差", "高强度螺栓承压型连接的变形比摩擦型连接小", "", ""], "r": "A", "e": "焊接连接抗拉强度高、变形小；普通螺栓抗剪强度低于高强度螺栓摩擦型连接；铆钉连接塑性比焊接好；高强度螺栓承压型连接变形比摩擦型大。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297618", "t": 1, "q": "在结构力学中，计算水利工程中超静定梁的内力时，采用\"力法\"的核心步骤是（　）", "a": ["选择基本体系，建立力法方程，求解多余未知力", "确定梁的支座反力，绘制剪力图和弯矩图", "计算梁的变形，确定最大挠度位置", "分析梁的受力状态，判断危险截面", "", ""], "r": "A", "e": "力法是求解超静定结构的一种基本方法，核心就是先选基本体系，再建立力法方程来求解多余未知力。B选项确定支座反力等是后续步骤；C选项计算变形不是力法核心；D选项分析受力和判断危险截面也不是力法核心。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297619", "t": 1, "q": "某水利工程中的混凝土结构，在长期荷载作用下会产生徐变，下列关于徐变的说法正确的是（　）", "a": ["徐变是混凝土在长期不变荷载作用下，应变随时间增长的现象，且徐变值随时间无限增大", "混凝土强度等级越高，徐变越大", "荷载作用时间越长，徐变越大，后期徐变增长速率减慢", "环境温度越低，徐变越大", "", ""], "r": "C", "e": "徐变是混凝土在长期不变荷载下应变随时间增长现象，但徐变值不会无限增大，A错；混凝土强度等级越高，徐变越小，B错；环境温度越低、湿度越大，徐变越小，D错；荷载作用时间越长，徐变越大，且后期增长速率减慢，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297620", "t": 1, "q": "在建筑材料中，水利工程常用的粉煤灰作为混凝土掺合料，其对混凝土力学性能的影响是（　）", "a": ["会降低混凝土的早期强度，提高混凝土的后期强度", "会提高混凝土的早期强度，降低混凝土的后期强度", "会同时降低混凝土的早期和后期强度", "会同时提高混凝土的早期和后期强度", "", ""], "r": "A", "e": "粉煤灰早期活性低，会使混凝土早期强度增长慢，但后期能参与反应，提高后期强度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637035238297621", "t": 1, "q": "在材料力学中，水利工程中矩形截面梁的最大剪应力发生在（　）", "a": ["梁截面的上边缘或下边缘处", "梁截面的中性轴处", "梁截面高度的1/2处", "梁截面高度的1/3处", "", ""], "r": "B", "e": "矩形截面梁最大剪应力发生在中性轴处。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335680", "t": 2, "q": "在水利水电工程碾压混凝土坝的结构力学分析中，需同时考虑的力学效应有（　）", "a": ["混凝土的徐变效应", "温度应力效应（浇筑温度、环境温度变化）", "干缩应力效应（混凝土硬化过程中水分蒸发）", "渗透压力效应（坝体渗水产生的压力）", "冻融循环效应（寒冷地区冬季冻融作用）", ""], "r": "ABCD", "e": "水利水电工程碾压混凝土坝结构力学分析要综合考虑多种影响坝体力学性能的因素，混凝土徐变、温度应力、干缩应力和渗透压力都会对坝体力学特性有显著作用。冻融循环主要影响耐久性而非结构力学分析重点考虑的力学效应。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335681", "t": 2, "q": "水利水电工程中，混凝土的力学性能受骨料影响显著，下列骨料特性中会影响混凝土抗压强度的有（　）", "a": ["骨料的岩石种类（如花岗岩、石灰岩）", "骨料的颗粒级配（连续级配或间断级配）", "骨料的饱和面干吸水率", "骨料的针片状颗粒含量", "骨料的表观密度", ""], "r": "ABCD", "e": "在水利水电工程中，混凝土的力学性能确实受到骨料特性的显著影响。以下是对各选项的简要A. 骨料的岩石种类（如花岗岩、石灰岩）：不同岩石种类的硬度和强度不同，直接影响混凝土的抗压强度。因此，岩石种类是一个重要影响因素。B. 骨料的颗粒级配（连续级配或间断级配）：颗粒级配的好坏决定了骨料堆积的密实程度，从而影响混凝土的密实性和抗压强度。连续级配通常比间断级配更有利于提高混凝土的抗压强度。C. 骨料的饱和面干吸水率：吸水率高的骨料在混凝土中会吸收更多的水分，可能导致混凝土拌合物的工作性变差，硬化后强度降低。因此，饱和面干吸水率也会影响混凝土的抗压强度。D. 骨料的针片状颗粒含量：针片状颗粒含量过高会导致骨料堆积不密实，降低混凝土的密实性和抗压强度。因此，这也是一个重要影响因素。E. 骨料的表观密度：虽然表观密度在一定程度上反映了骨料的密实程度和质量，但它并不直接影响混凝土的抗压强度。混凝土的抗压强度更多地取决于骨料的组成、级配和吸水性等因素。综上所述，会影响混凝土抗压强度的骨料特性包括：岩石种类（A）、颗粒级配（B）、饱和面干吸水率（C）以及针片状颗粒含量（D）。表观密度（E）虽然与骨料质量有关，但不直接影响混凝土的抗压强度。所以，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335685", "t": 2, "q": "水利水电工程中，评价水泥力学性能的指标有（　）", "a": ["初凝时间", "终凝时间", "抗折强度", "抗压强度", "安定性", ""], "r": "CD", "e": "水泥力学性能主要指其抵抗破坏的能力，抗折强度和抗压强度是衡量水泥力学性能的关键指标。初凝、终凝时间及安定性不属于力学性能指标。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2035637037419335687", "t": 2, "q": "在水利水电工程材料试验中，测定混凝土轴心抗拉强度的试验方法有（　）", "a": ["直接拉伸试验（采用哑铃形试件）", "劈裂试验（采用立方体或圆柱体试件）", "抗折试验（采用棱柱体试件）", "抗压试验（采用立方体试件）", "黏结试验（采用钢筋-混凝土黏结试件）", ""], "r": "AB", "e": "测定混凝土轴心抗拉强度有直接拉伸试验（用哑铃形试件）和劈裂试验（用立方体或圆柱体试件）。抗折试验测抗折强度，抗压试验测抗压强度，黏结试验测黏结力，均非测轴心抗拉强度。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094016", "t": 3, "q": "水利水电工程中，钢筋混凝土受弯构件正截面受拉区钢筋的应力计算时，若构件处于适筋梁阶段，可忽略混凝土的抗拉强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "适筋梁破坏时，受拉区混凝土开裂后退出工作，拉力主要由钢筋承担，所以计算受拉区钢筋应力时可忽略混凝土抗拉强度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094017", "t": 3, "q": "在材料力学中，水利水电工程的轴向受压构件（如坝体立柱），其稳定系数φ仅与构件的长细比有关，与材料的强度等级无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稳定系数φ反映了长细比增大时，压杆临界力降低的程度，仅取决于构件长细比，和材料强度等级无直接关联。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094018", "t": 3, "q": "水利水电工程的碾压混凝土，其28d抗压强度设计值通常低于同强度等级常态混凝土的28d抗压强度设计值，因为碾压混凝土的密实度更低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "碾压混凝土密实度并不低，相反其通过振动碾压使混凝土更密实。且一般情况下，碾压混凝土28d抗压强度设计值通常不低于同强度等级常态混凝土。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094020", "t": 3, "q": "水利水电工程中，混凝土的徐变系数（徐变变形与弹性变形的比值）随时间增长而增大，最终趋于稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程里，混凝土徐变是随时间发展的，开始时徐变增长快，之后变慢，徐变系数随时间增长而增大，最后会趋于稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094021", "t": 3, "q": "结构力学中，水利水电工程的静定刚架结构，其任意截面的内力（弯矩、剪力、轴力）均可仅通过静力平衡条件计算得出，无需考虑变形协调。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "静定结构的内力仅由静力平衡条件就能确定，不需要考虑变形协调。水利水电工程的静定刚架属于静定结构。", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094022", "t": 3, "q": "水利水电工程中，测定混凝土立方体抗压强度时，试件的尺寸越大，测得的抗压强度值越高，因为尺寸越大，试件内部缺陷影响越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在水利水电工程中，测定混凝土立方体抗压强度时，试件尺寸越大，测得的抗压强度值越低。这是因为尺寸越大，试件内部缺陷影响越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094023", "t": 3, "q": "在水利水电工程坝体稳定分析中，瑞典条分法计算的抗滑稳定系数比毕肖普法小，因此瑞典条分法的计算结果更偏于安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "瑞典条分法未考虑条块间作用力，计算的抗滑稳定系数比毕肖普法小，意味着其计算结果更保守，更偏于安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094024", "t": 3, "q": "水利水电工程中，钢筋的屈服强度是指钢筋开始产生塑性变形时的应力，当应力超过屈服强度后，钢筋会发生显著的塑性变形而不立即断裂。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该描述符合钢筋屈服强度的定义及特性，在水利水电工程里，钢筋屈服强度就是钢筋开始塑性变形时的应力，超过此强度会有明显塑性变形且不马上断裂。", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094025", "t": 3, "q": "在流体静力学中，水利水电工程的坝体挡水高度越高，坝基处的水压力强度越大，且水压力强度与挡水高度成反比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据流体静力学，坝基处水压力强度公式为「test/yiwen_img/importSubject/2035637031073353728.png」（「test/yiwen_img/importSubject/2035637031287263232.png」为水密度，g为重力加速度，h为挡水高度），可知水压力强度与挡水高度成正比，并非成反比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094026", "t": 3, "q": "水利水电工程的混凝土重力坝，其坝体应力分析中，坝踵处易产生拉应力，需通过配置钢筋或调整坝体断面形状来控制拉应力不超过允许值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在混凝土重力坝坝体应力分析里，坝踵处确实容易产生拉应力，而控制拉应力不超允许值的常见办法就是配置钢筋或调整坝体断面形状。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094027", "t": 3, "q": "材料力学中，水利水电工程的圆截面轴受扭时，轴的最大切应力发生在轴的横截面边缘处，且切应力沿半径方向呈线性分布。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据材料力学知识，圆截面轴受扭时，最大切应力在横截面边缘处，且切应力沿半径方向是线性分布的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094029", "t": 3, "q": "在结构力学中，水利水电工程的超静定结构，其内力分布与各杆件的刚度比无关，仅与荷载和结构几何尺寸有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超静定结构内力分布与各杆件刚度比有关，并非仅与荷载和结构几何尺寸有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094030", "t": 3, "q": "水利水电工程中，混凝土的抗冻等级F200表示混凝土试件在标准冻融循环试验中，经过200次冻融循环后，其质量损失率不超过5%，强度损失率不超过25%。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程里，混凝土抗冻等级F200就是指在标准冻融循环试验下，混凝土试件经200次冻融循环后，质量损失率不超5%，强度损失率不超25%。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094031", "t": 3, "q": "静力学中，水利水电工程的平面汇交力系平衡的充要条件是:力系中所有力的合力为零，且所有力对任意一点的力矩代数和为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "平面汇交力系平衡的充要条件是力系中所有力的合力为零。而“所有力对任意一点的力矩代数和为零”是平面任意力系平衡的条件，并非平面汇交力系平衡条件。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637039659094032", "t": 3, "q": "水利水电工程中，钢筋混凝土轴心受压构件，当长细比大于17时，需考虑纵向弯曲系数的影响，以降低构件的承载力设计值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程里，钢筋混凝土轴心受压构件，长细比大于 17 时，构件会因纵向弯曲产生附加弯矩，所以要考虑纵向弯曲系数影响并降低承载力设计值。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K03", "n": "知识点03  岩土力学基本理论", "qs": [{"id": "2035637057828818944", "t": 1, "q": "在土的抗剪强度试验中，下列关于排水条件对黏聚力c和内摩擦角φ值影响的说法，正确的是", "a": ["排水条件越好，c值越大，φ值越小", "排水条件越好，c值越小，φ值越大", "排水条件对c值无影响，仅增大φ值", "排水条件对φ值无影响，仅增大c值", "", ""], "r": "B", "e": "排水条件好时，土颗粒间有效应力增大，土的内摩擦作用能充分发挥，φ值增大；同时排水使孔隙水压力消散，土的黏聚力c会减小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818945", "t": 1, "q": "关于达西定律v=ki（v为渗透速度，k为渗透系数，i为水力梯度）的适用范围，下列表述正确的是", "a": ["适用于所有渗流，无论层流还是紊流", "仅适用于紊流渗流，雷诺数Re>1", "仅适用于层流渗流，雷诺数Re<1", "适用于水力梯度i>1的所有渗流", "", ""], "r": "C", "e": "达西定律适用于层流渗流，当雷诺数Re < 1时为层流。所以正确答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818946", "t": 1, "q": "材料力学中，梁发生纯弯曲时，横截面上的正应力分布特征是", "a": ["沿截面高度均匀分布", "沿截面高度线性分布，中性轴处最大", "沿截面高度线性分布，中性轴处为零", "仅在截面上下边缘存在，其余位置为零", "", ""], "r": "C", "e": "梁纯弯曲时，正应力沿截面高度线性分布，且中性轴处正应力为零。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818947", "t": 1, "q": "土的压缩系数a1-2的物理意义是", "a": ["压力从0增至100kPa时，单位压力增量引起的孔隙比变化", "压力从100kPa增至200kPa时，单位压力增量引起的孔隙比变化", "压力从200kPa增至300kPa时，单位压力增量引起的孔隙比变化", "压力从任意值增至该值+100kPa时，单位压力增量引起的孔隙比变化", "", ""], "r": "B", "e": "土的压缩系数a1 - 2指压力从100kPa增至200kPa时，单位压力增量引起的孔隙比变化。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818948", "t": 1, "q": "在岩石力学中，相同岩石的三轴抗压强度与单轴抗压强度的关系是", "a": ["三轴抗压强度等于单轴抗压强度", "三轴抗压强度小于单轴抗压强度", "三轴抗压强度大于单轴抗压强度", "两者无固定关系，取决于岩石密度", "", ""], "r": "C", "e": "在岩石力学里，岩石受三轴压力时侧向有约束，抵抗破坏能力更强，所以三轴抗压强度大于单轴抗压强度。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818949", "t": 1, "q": "根据静力学中的力的平移定理，将作用在物体A点的力F平移到B点，正确的做法是", "a": ["直接将F从A点移到B点，无需其他附加力", "将F从A点移到B点，并附加一个力偶，其力偶矩等于F对A点的矩", "将F从A点移到B点，并附加一个力偶，其力偶矩等于F对B点的矩", "将F从A点移到B点，并附加一个与F大小相等、方向相反的力", "", ""], "r": "C", "e": "力的平移定理是把作用在刚体上某点的力平移到另一点，需附加一个力偶，此力偶矩等于原力对平移点的矩。本题是将力F从A点移到B点，应附加力偶矩等于F对B点的矩。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818950", "t": 1, "q": "土的孔隙比e的定义表达式为", "a": ["e=孔隙体积/总体积", "e=孔隙体积/土粒体积", "e=土粒体积/孔隙体积", "e=土粒体积/总体积", "", ""], "r": "B", "e": "孔隙比是指土中孔隙体积与土粒体积之比。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818951", "t": 1, "q": "下列条件中，最易导致土发生管涌破坏的是", "a": ["土为均匀粗砂土，孔隙直径远大于细颗粒直径", "土为非均匀土，粗颗粒构成的孔隙能被细颗粒填充且细颗粒可移动", "土为饱和黏性土，含水量远大于液限", "土为密实粉土，孔隙比e<0.6", "", ""], "r": "B", "e": "管涌是指在渗流作用下，土体中的细颗粒在粗颗粒形成的孔隙中移动甚至被带出的现象。B选项非均匀土，粗颗粒孔隙能被细颗粒填充且细颗粒可移动，符合管涌发生条件。A均匀粗砂土不易发生，C饱和黏性土颗粒间黏聚力大难管涌，D密实粉土孔隙小也不易管涌。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818952", "t": 1, "q": "材料力学中，轴向拉压杆横截面上的正应力计算公式为", "a": ["σ=M/Wz（M为弯矩，Wz为抗弯截面系数）", "σ=T/Wt（T为扭矩，Wt为抗扭截面系数）", "σ=N/A（N为轴力，A为横截面面积）", "σ=V/A（V为剪力，A为横截面面积）", "", ""], "r": "C", "e": "轴向拉压杆横截面上正应力与轴力和横截面面积有关，公式是σ = N/A 。A是弯曲正应力公式，B是扭转切应力公式，D不是常见应力公式。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818953", "t": 1, "q": "土的饱和度Sr的定义是", "a": ["土中水的体积与土粒体积的比值（百分比）", "土中水的体积与孔隙体积的比值（百分比）", "土中孔隙体积与总体积的比值（百分比）", "土中孔隙体积与土粒体积的比值（百分比）", "", ""], "r": "B", "e": "饱和度是反映土中孔隙被水充满程度的指标，是土中水的体积与孔隙体积的比值（百分比）。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818954", "t": 1, "q": "莫尔-库仑强度理论中，土的抗剪强度τf与作用在剪切面上的正应力σ的关系表达式为", "a": ["τf=σtanφ（φ为内摩擦角）", "τf=c+σ（c为黏聚力）", "τf=c+σtanφ", "τf=c-σtanφ", "", ""], "r": "C", "e": "莫尔 - 库仑强度理论明确土的抗剪强度由黏聚力和摩擦力两部分组成，表达式为τf=c + σtanφ 。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818955", "t": 1, "q": "对于同一岩石，其弹性模量E与变形模量E0的大小关系是", "a": ["E>E0", "E=E0", "E<E0", "无法确定，取决于加载时间", "", ""], "r": "A", "e": "弹性模量是岩石完全弹性变形对应的模量，变形模量包含弹性变形和塑性变形，所以弹性模量大于变形模量。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818956", "t": 1, "q": "平面汇交力系平衡的充分必要条件是", "a": ["力系中各力在任意轴上的投影代数和均为零", "力系的合力等于零（或力的多边形自行闭合）", "力系中任意两个力的大小相等、方向相反", "力系中各力对任意点的力矩代数和均为零", "", ""], "r": "B", "e": "平面汇交力系平衡意味着合力为零，力的多边形自行闭合。A选项虽投影和为零能体现平衡，但不是本质条件；C选项任意两力大小相等、方向相反不能保证整个力系平衡；D选项是力系对某点合力矩为零的平衡条件，不是平面汇交力系平衡的充分必要条件。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818957", "t": 1, "q": "土的压实度K的定义是", "a": ["现场土的天然密度与室内击实试验最大干密度的比值（百分比）", "现场土的干密度与室内击实试验最大干密度的比值（百分比）", "现场土的天然密度与室内击实试验最佳含水量对应的密度的比值（百分比）", "现场土的干密度与室内击实试验最佳含水量对应的密度的比值（百分比）", "", ""], "r": "B", "e": "压实度是指现场土的干密度与室内击实试验最大干密度的比值（百分比）。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818958", "t": 1, "q": "渗流场中某点的总水头H的组成部分是", "a": ["位置水头+压力水头", "位置水头+流速水头", "压力水头+流速水头", "位置水头+压力水头+流速水头", "", ""], "r": "D", "e": "在渗流场中，某点的总水头H主要由三部分组成：位置水头、压力水头和流速水头。位置水头反映了水位高度对水头的影响；压力水头反映了水的压力能对水头的影响；流速水头则反映了水的动能对水头的影响。这三者共同决定了渗流场中某点的总水头。所以，正确答案是D选项：“位置水头+压力水头+流速水头”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818959", "t": 1, "q": "材料力学中，梁的剪力图与弯矩图的微分关系是", "a": ["dM/dx=V（V为剪力，M为弯矩），dV/dx=q（q为分布荷载集度）", "dM/dx=-V，dV/dx=-q", "dM/dx=V，dV/dx=q", "dM/dx=-V，dV/dx=q", "", ""], "r": "A", "e": "在材料力学里，梁的剪力图与弯矩图存在基本的微分关系，即弯矩对x的一阶导数等于剪力，剪力对x的一阶导数等于分布荷载集度，表达式为dM/dx = V，dV/dx = q 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818960", "t": 1, "q": "土的塑性指数IP的计算公式为", "a": ["IP=ωP-ωL（ωP为塑限，ωL为液限）", "IP=ωL-ωP", "IP=ωL-ωs（ωs为缩限）", "IP=ωs-ωP", "", ""], "r": "B", "e": "土的塑性指数是液限与塑限之差。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818961", "t": 1, "q": "岩石的软化系数KR的定义是", "a": ["岩石干燥状态下的单轴抗压强度与饱和状态下的单轴抗压强度的比值", "岩石饱和状态下的单轴抗压强度与干燥状态下的单轴抗压强度的比值", "岩石冻融后的单轴抗压强度与冻融前的单轴抗压强度的比值", "岩石冻融前的单轴抗压强度与冻融后的单轴抗压强度的比值", "", ""], "r": "B", "e": "岩石软化系数是反映岩石耐水性的指标，是饱和状态下单轴抗压强度与干燥状态下单轴抗压强度之比。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818962", "t": 1, "q": "静力学中，力矩的大小取决于", "a": ["力的大小和力的作用点到矩心的距离", "力的大小和力的作用线到矩心的垂直距离（力臂）", "力的大小和矩心的位置", "力的大小、方向和矩心的位置", "", ""], "r": "B", "e": "力矩大小等于力的大小与力臂（力的作用线到矩心的垂直距离）的乘积，所以取决于力的大小和力臂。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818963", "t": 1, "q": "下列因素中，对土的渗透系数k值影响最小的是", "a": ["土粒的大小及级配", "土的孔隙比", "渗流的水力梯度i", "流体的黏度（温度影响黏度）", "", ""], "r": "C", "e": "土的渗透系数主要与土的性质（土粒大小及级配、孔隙比）和流体性质（黏度）有关，而渗流的水力梯度不影响渗透系数。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818964", "t": 1, "q": "圆轴发生扭转时，横截面上的切应力分布特征是", "a": ["沿圆轴半径均匀分布", "沿圆轴半径线性分布，圆心处最大", "沿圆轴半径线性分布，圆心处为零，边缘处最大", "仅在圆轴横截面边缘存在，其余位置为零", "", ""], "r": "C", "e": "圆轴扭转时，横截面上切应力沿半径线性分布，圆心处切应力为零，边缘处切应力最大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818965", "t": 1, "q": "有效应力原理的核心表达式是", "a": ["总应力σ=有效应力σ'+孔隙水压力u", "有效应力σ'=总应力σ+孔隙水压力u", "孔隙水压力u=有效应力σ'-总应力σ", "总应力σ=有效应力σ'-孔隙水压力u", "", ""], "r": "A", "e": "有效应力原理指出总应力等于有效应力与孔隙水压力之和。所以核心表达式是总应力σ = 有效应力σ'+孔隙水压力u 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818966", "t": 1, "q": "岩石的蠕变特性是指", "a": ["岩石在恒定变形下，应力随时间逐渐减小的现象", "岩石在恒定应力下，变形随时间不断增长的现象", "岩石在循环应力作用下，强度逐渐降低的现象", "岩石在荷载作用下，瞬时产生弹性变形的现象", "", ""], "r": "B", "e": "岩石蠕变定义就是在恒定应力下，变形随时间不断增长。A是松弛现象，C是疲劳现象，D是弹性变形特点。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637057828818967", "t": 1, "q": "关于力偶的性质，下列说法正确的是", "a": ["力偶可以与单个力平衡", "力偶只能与力偶平衡，不能与单个力平衡", "力偶的大小与力偶中力的大小无关，仅与力偶臂有关", "力偶对任意点的力矩为零", "", ""], "r": "B", "e": "力偶是由两个大小相等、方向相反且不共线的平行力组成，它不能与单个力平衡，只能与力偶平衡；力偶大小等于力与力偶臂乘积，与二者都有关；力偶对任意点的力矩不为零。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114176", "t": 2, "q": "影响土的渗透性系数k值的因素有（　）", "a": ["土颗粒的级配", "土的孔隙比", "水的黏滞性", "土的颜色", "土的矿物成分", ""], "r": "ABCE", "e": "土的渗透性系数k与土的性质和水的性质有关。土颗粒级配、孔隙比、矿物成分影响土的性质从而影响渗透性；水的黏滞性影响水的性质进而影响渗透性。而土的颜色与渗透性无关。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114177", "t": 2, "q": "根据有效应力原理，饱和土在荷载作用下，下列哪些物理量的变化与有效应力变化相关（　）", "a": ["土的体积", "土的强度", "孔隙水压力", "土的重度", "土的饱和度", ""], "r": "AB", "e": "有效应力控制土的体积变化和强度，土的体积变化对应有效应力变化，强度也因有效应力改变，而孔隙水压力与有效应力一同平衡总应力，但其变化本身不与有效应力变化直接相关，土的重度和饱和度不受有效应力变化影响。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114178", "t": 2, "q": "在边坡稳定分析中，属于导致边坡失稳的内在因素有（　）", "a": ["岩土体的性质（如黏聚力、内摩擦角）", "边坡的几何形状（如坡高、坡角）", "地下水的作用", "岩土体的结构面（如节理、断层）", "地震作用", ""], "r": "ABD", "e": "内在因素是边坡自身的特性，岩土体性质、边坡几何形状、岩土体结构面是边坡自身固有特征。而地下水作用、地震作用属于外在因素。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637063944114179", "t": 2, "q": "下列关于土的压缩试验的说法中，正确的有（　）", "a": ["压缩试验可测得土的e-p曲线和e-logp曲线", "压缩试验的荷载施加方式为分级加荷", "压缩试验适用于黏性土，不适用于砂土", "压缩试验可确定土的压缩模量和压缩指数", "压缩试验中，土样的变形仅包括孔隙体积的减小", ""], "r": "ABD", "e": "这是一道关于土的压缩试验知识的选择题。我们逐项审视各个选项：A选项：压缩试验确实可以测得土的e-p曲线（孔隙比与压力的关系曲线）和e-logp曲线（孔隙比与压力对数值的关系曲线），这是压缩试验的基本成果之一。因此，A选项描述正确。B选项：压缩试验的荷载施加方式通常为分级加荷，以便准确观察土在不同压力下的变形特性。所以，B选项描述也是正确的。C选项：压缩试验不仅适用于黏性土，也适用于砂土等其他类型的土，只是试验方法和参数可能有所不同。因此，C选项描述错误。D选项：通过压缩试验，确实可以确定土的压缩模量和压缩指数，这两个参数是评价土压缩性的重要指标。所以，D选项描述正确。E选项：压缩试验中，土样的变形主要包括孔隙体积的减小和土颗粒的重新排列等，不仅仅是孔隙体积的减小。因此，E选项描述错误。综上所述，正确的选项是A、B和D。所以，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234496", "t": 3, "q": "饱和黏性土的不排水抗剪强度与试验时的围压无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "饱和黏性土不排水试验中，孔隙水压力随围压增加而增加，有效应力不变，抗剪强度不变，所以其不排水抗剪强度与围压无关。", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234497", "t": 3, "q": "土的压缩指数Cc越大，说明土的压缩性越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "土的压缩指数Cc越大，表示土在压力变化时压缩变形越大，即土的压缩性越高，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234498", "t": 3, "q": "朗肯土压力理论计算出的被动土压力通常大于库仑土压力理论的结果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "朗肯土压力理论计算被动土压力时假设墙背竖直、光滑，填土面水平，未考虑墙背与填土间的摩擦作用，导致计算的被动土压力偏大，一般大于库仑土压力理论结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234499", "t": 3, "q": "地基附加应力在深度方向上的分布规律是随深度增加而线性减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "地基附加应力在深度方向上并非随深度增加线性减小，其分布规律受多种因素影响，一般是先增大后减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234500", "t": 3, "q": "土的孔隙比e越大，说明土越密实。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "孔隙比e是土中孔隙体积与土粒体积之比，e越大表示孔隙体积相对土粒体积越大，土就越疏松，并非越密实。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234501", "t": 3, "q": "太沙基一维固结理论假设土的压缩系数和渗透性系数为常数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "太沙基一维固结理论为简化计算做了系列假设，其中就包含假设土的压缩系数和渗透性系数为常数。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234502", "t": 3, "q": "主动土压力是挡土墙在填土压力作用下，背离填土方向移动时，填土对墙背产生的最小土压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当挡土墙背离填土方向移动时，墙后土压力逐渐减小，当达到主动极限平衡状态时，土压力减至最小，此即主动土压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234503", "t": 3, "q": "土的天然含水量是指土中水的重量与土颗粒重量的比值，以百分数表示。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "土的天然含水量定义就是土中水的重量与土颗粒重量的比值，用百分数表示。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234504", "t": 3, "q": "三轴压缩试验中，固结排水剪（CD试验）测得的内摩擦角φ值小于固结不排水剪（CU试验）的φ值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在三轴压缩试验中，固结排水剪（CD试验）测得的内摩擦角φ值大于固结不排水剪（CU试验）的φ值。", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234505", "t": 3, "q": "边坡稳定分析的条分法中，瑞典条分法计算的安全系数通常比毕肖普法的结果偏小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "瑞典条分法不考虑条间力作用，计算偏于保守；毕肖普法考虑了条间力的部分影响，计算结果更合理。所以瑞典条分法算得的安全系数通常比毕肖普法结果偏小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234506", "t": 3, "q": "土的渗透性系数k值越大，说明土的透水性越差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。土的渗透性系数k是衡量土透水性的指标，k值越大，土的透水性越好，而不是越差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637065328234507", "t": 3, "q": "有效应力原理仅适用于饱和土，不适用于不饱和土。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "有效应力原理最初是基于饱和土提出，但后来经扩展也可应用于非饱和土。所以该表述错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K04", "n": "知识点04  水力学基本理论", "qs": [{"id": "2035637075004493824", "t": 1, "q": "下列关于流体黏性的说法中，正确的是（　）", "a": ["液体的黏性随温度升高而增大，气体的黏性随温度升高而减小", "液体的黏性随温度升高而减小，气体的黏性随温度升高而增大", "液体和气体的黏性都随温度升高而增大", "液体和气体的黏性都随温度升高而减小", "", ""], "r": "B", "e": "液体黏性主要由分子间引力决定，温度升高分子间距增大引力减小，黏性减小；气体黏性主要由分子热运动引起，温度升高热运动加剧，黏性增大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493825", "t": 1, "q": "在静水压力计算中，某斜置平面壁与水平面夹角为θ，壁面形心处的淹没深度为h_c，该平面壁所受静水总压力的作用点（压力中心）淹没深度h_d与h_c的关系是（　）", "a": ["h_d=h_c", "h_d>h_c", "h_d<h_c", "无法确定，取决于平面壁的形状", "", ""], "r": "B", "e": "对于斜置平面壁，压力中心位置总是在形心之下，即压力中心淹没深度h_d大于形心处淹没深度h_c。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493826", "t": 1, "q": "根据达西定律，渗流流速v与水力坡度J的关系为v=kJ，其中k为渗透系数。下列关于达西定律适用条件的说法，正确的是（　）", "a": ["适用于所有渗流，无论雷诺数大小", "仅适用于雷诺数Re≤1的层流渗流", "适用于雷诺数Re≤10的过渡流渗流", "仅适用于紊流渗流", "", ""], "r": "B", "e": "达西定律适用于层流渗流，一般认为雷诺数Re≤1时为层流。A选项所有渗流说法错误；C选项过渡流不适用；D选项紊流也不适用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493827", "t": 1, "q": "某明渠均匀流，已知渠道底坡i=0.001，粗糙系数n=0.014，过水断面为矩形，底宽b=5m，水深h=2m。若仅增大渠道粗糙系数n，其他条件不变，则明渠均匀流的流量Q将（　）", "a": ["增大", "减小", "不变", "先增大后减小", "", ""], "r": "B", "e": "根据谢才公式和曼宁公式，流量与粗糙系数成反比。增大粗糙系数n，其他条件不变时，流量Q会减小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493828", "t": 1, "q": "下列关于水流流态判别（雷诺数Re）的说法，错误的是（　）", "a": ["圆管中，Re≤2000为层流，Re>2000为紊流", "明渠中，Re≤500为层流，Re>500为紊流", "雷诺数是表征惯性力与黏性力之比的无量纲数", "同一流体、同一流动边界，雷诺数越小，流动越容易呈现紊流状态", "", ""], "r": "D", "e": "雷诺数越小，黏性力越能抑制流体的紊乱运动，流动越易呈层流状态，而非紊流状态，D说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493829", "t": 1, "q": "在静水力学中，绝对压强p_abs、相对压强p_rel和真空度p_vac的关系，下列表述正确的是（　）", "a": ["当p_abs>大气压p_a时，p_rel=p_abs-p_a，p_vac=0", "当p_abs>大气压p_a时，p_rel=0，p_vac=p_abs-p_a", "当p_abs<大气压p_a时，p_rel=p_a-p_abs，p_vac=0", "当p_abs<大气压p_a时，p_rel=0，p_vac=p_abs-p_a", "", ""], "r": "A", "e": "相对压强是绝对压强与大气压之差，当绝对压强大于大气压，相对压强为正，无真空度；当绝对压强小于大气压，相对压强为负，真空度是大气压与绝对压强之差。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493830", "t": 1, "q": "下列关于明渠水流中急流和缓流的判别方法，错误的是（　）", "a": ["弗劳德数Fr>1为急流，Fr<1为缓流", "临界水深h_k，实际水深h>h_k为急流，h<h_k为缓流", "临界底坡i_k，实际底坡i>i_k为急流，i<i_k为缓流", "水流中干扰波能否向上游传播:不能传播为急流，能传播为缓流", "", ""], "r": "B", "e": "实际水深h＞h_k 时为缓流，h＜h_k 时为急流，B选项说法错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493831", "t": 1, "q": "在流体力学中，\"理想流体\"的定义是指（　）", "a": ["密度为常数的流体", "黏度为零的流体", "不可压缩的流体", "符合牛顿内摩擦定律的流体", "", ""], "r": "B", "e": "理想流体是一种理想化模型，其主要特点是黏度为零。选项A密度为常数不是理想流体核心定义；选项C不可压缩不是理想流体的本质特征；选项D符合牛顿内摩擦定律与理想流体概念无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493832", "t": 1, "q": "根据动量方程，流体在流动过程中，动量的变化率等于作用在流体上的（　）", "a": ["所有力的矢量和", "所有法向力的代数和", "所有切向力的代数和", "压力的合力", "", ""], "r": "A", "e": "动量方程表明流体动量变化率等于作用在流体上所有力的矢量和。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493833", "t": 1, "q": "下列关于有压管流中水击现象的说法，错误的是（　）", "a": ["水击是由于管道中水流速度突然变化，导致压强急剧波动的现象", "直接水击是指阀门关闭时间T_s≤2L/c（L为管长，c为水击波速）的水击", "水击波速c与管道材料弹性模量、流体密度、管道直径无关", "减小水击压强的措施包括延长阀门关闭时间、设置调压塔等", "", ""], "r": "C", "e": "水击波速c与管道材料弹性模量、流体密度、管道直径等有关，C选项说法错误。A选项是水击定义，B选项是直接水击定义，D选项是减小水击压强措施，均正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493835", "t": 1, "q": "下列关于流体静压强特性的说法，正确的是（　）", "a": ["流体静压强的方向与受压面平行", "静止流体中，任意一点各方向的静压强大小相等", "静止流体中，不同深度的点静压强大小相等", "流体静压强的大小与流体的种类无关", "", ""], "r": "B", "e": "流体静压强方向与受压面垂直，A错误；静止流体中，任意点各方向静压强大小相等，B正确；不同深度点压强因深度不同而不同，C错误；流体种类不同密度不同，静压强与流体密度有关，D错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493836", "t": 1, "q": "明渠均匀流的形成条件不包括（　）", "a": ["渠道底坡为常数，且与流向一致", "渠道断面形状、尺寸沿程不变", "渠道粗糙系数沿程不变", "水流为非恒定流", "", ""], "r": "D", "e": "明渠均匀流需恒定流，D选项水流为非恒定流不符合其形成条件。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493837", "t": 1, "q": "根据牛顿内摩擦定律，流体层间的切应力τ与（　）成正比", "a": ["流体的密度ρ", "流体的运动黏度ν", "流体的速度v", "流体的速度梯度du/dy", "", ""], "r": "D", "e": "牛顿内摩擦定律表达式为τ = μ(du/dy) ，其中μ是动力黏度，du/dy是速度梯度，所以切应力τ与速度梯度成正比。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493838", "t": 1, "q": "某矩形断面明渠，底宽b=3m，水深h=1m，若该明渠的水力半径R=0.6m，则该明渠的湿周χ为（　）", "a": ["4.0m", "5.0m", "6.0m", "7.0m", "", ""], "r": "B", "e": "根据水力半径公式「test/yiwen_img/importSubject/2035637072223670272.png」（A为过流面积，「test/yiwen_img/importSubject/2035637072420802560.png」为湿周），矩形过流面积「test/yiwen_img/importSubject/2035637072525660160.png」，已知R = 0.6m，则「test/yiwen_img/importSubject/2035637072622129152.png」。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493839", "t": 1, "q": "下列关于有压管流中长管和短管的划分依据，正确的是（　）", "a": ["按管道长度划分，长度大于100m为长管，小于100m为短管", "按管道直径划分，直径大于500mm为长管，小于500mm为短管", "按沿程水头损失与局部水头损失的比值划分，沿程损失占比大（如>90%）为长管，局部损失不可忽略为短管", "按管道材质划分，金属管为长管，混凝土管为短管", "", ""], "r": "C", "e": "长管和短管是按沿程水头损失与局部水头损失的比值划分，沿程损失占比大（如>90%）为长管，局部损失不可忽略为短管。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493840", "t": 1, "q": "在渗流场中，等势线与流线的关系是（　）", "a": ["平行", "垂直", "相交但不垂直", "无固定关系", "", ""], "r": "B", "e": "在渗流场中，等势线和流线相互垂直，这是渗流的基本特性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493841", "t": 1, "q": "某流体的动力黏度μ=0.01Pa·s，密度ρ=1000kg/m³，则该流体的运动黏度ν为（　）", "a": ["1.0×10^-5 m²/s", "1.0×10^-4 m²/s", "1.0×10^-3 m²/s", "1.0×10^-2 m²/s", "", ""], "r": "A", "e": "运动黏度ν = 动力黏度μ / 密度ρ，将μ = 0.01Pa·s，ρ = 1000kg/m³代入可得ν = 0.01÷1000 = 1.0×10⁻⁵ m²/s。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493842", "t": 1, "q": "下列关于明渠非均匀流的说法，正确的是（　）", "a": ["明渠非均匀流中，流线一定是曲线", "明渠非均匀流的水力坡度i、水面坡度J和底坡i0三者相等", "明渠非均匀流的流速沿程一定变化", "明渠非均匀流的过水断面面积沿程一定不变", "", ""], "r": "C", "e": "非均匀流中流速沿程改变。A项，流线也可能是直线；B项，非均匀流中i、J、i0通常不相等；D项，过水断面面积可能改变。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493843", "t": 1, "q": "根据静水压强的计算，若某点的相对压强为20kPa，大气压p_a=101.3kPa，则该点的绝对压强为（　）", "a": ["81.3kPa", "101.3kPa", "121.3kPa", "141.3kPa", "", ""], "r": "C", "e": "绝对压强等于相对压强加当地大气压，本题中相对压强20kPa，大气压101.3kPa，绝对压强为20 + 101.3 = 121.3kPa。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493844", "t": 1, "q": "圆管层流中，管内最大流速v_max与平均流速v的关系是（　）", "a": ["v_max=v", "v_max=1.5v", "v_max=2v", "v_max=3v", "", ""], "r": "C", "e": "圆管层流中，最大流速是平均流速的2倍。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493845", "t": 1, "q": "下列关于水跃的说法，错误的是（　）", "a": ["水跃是明渠水流从急流过渡到缓流的局部水力现象", "水跃发生时，水面突然跃起，伴随能量损失", "水跃的跃前水深h'和跃后水深h''满足共轭水深关系", "水跃的能量损失主要来自于沿程水头损失", "", ""], "r": "D", "e": "水跃能量损失主要是局部水头损失，而非沿程水头损失。A、B、C选项关于水跃的描述均正确。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493846", "t": 1, "q": "在有压管流中，若管道末端阀门突然关闭，产生的水击波传播速度c与下列哪个因素成正比（　）", "a": ["管道直径d", "管壁厚度δ", "流体体积弹性模量K", "管道材料弹性模量E", "", ""], "r": "C", "e": "水击波传播速度公式与流体体积弹性模量K相关，且成正比关系。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637075004493847", "t": 1, "q": "某梯形断面明渠，底宽b=5m，水深h=2m，边坡系数m=2，该明渠的水力半径R为（　）", "a": ["0.89m", "1.12m", "1.35m", "1.58m", "", ""], "r": "B", "e": "先求过水断面面积「test/yiwen_img/importSubject/2035637072714403840.png」，湿周「test/yiwen_img/importSubject/2035637072806678528.png」，水力半径「test/yiwen_img/importSubject/2035637072890564608.png」，最接近1.12m。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793280", "t": 2, "q": "下列因素中，会影响流体粘性大小的有（　）", "a": ["流体的种类", "流体的温度", "流体的压力", "流体的流速", "流体的密度", ""], "r": "ABC", "e": "流体粘性与种类有关，不同流体粘性不同；温度对粘性影响大，液体粘性随温度升高降低，气体相反；压力在低压范围对粘性影响极小常忽略。流速和密度不是影响粘性大小因素。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793281", "t": 2, "q": "在明渠均匀流中，满足的条件有（　）", "a": ["水流为定常流动", "水流为均匀流动，断面平均流速沿程不变", "渠道底坡i、粗糙系数n、断面形状和尺寸沿程不变", "水力坡度i、测压管坡度i_p、底坡i_b三者相等", "断面单位能量沿程增大", ""], "r": "ABCD", "e": "明渠均匀流是等深等速的定常流动，断面平均流速沿程不变，且渠道底坡、粗糙系数、断面形状尺寸沿程不变，水力坡度、测压管坡度、底坡三者相等，而断面单位能量沿程不变并非增大。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793282", "t": 2, "q": "下列关于梁的弯曲变形的说法，正确的有（　）", "a": ["梁的弯曲变形大小与梁的抗弯刚度EI（E为弹性模量，I为惯性矩）成反比", "梁的弯曲变形大小与梁所受的荷载大小成正比", "简支梁在跨中集中力作用下，跨中挠度（最大挠度）与跨度L的三次方成正比", "梁的弯曲变形是指梁的轴线由直线变为曲线的变形", "梁的抗弯刚度EI越大，梁的弯曲变形越大", ""], "r": "ABCD", "e": "梁的弯曲变形是结构力学中的一个重要概念，涉及到梁在受到外力作用时的变形行为。我们可以根据基本的力学原理来分析这些选项。A选项：梁的弯曲变形大小实际上与梁的抗弯刚度EI成反比。抗弯刚度EI越大，梁抵抗弯曲变形的能力越强，因此变形越小。这个说法是正确的。B选项：梁的弯曲变形大小与梁所受的荷载大小成正比。更准确地说，是与荷载产生的弯矩成正比。在简单情况下，荷载越大，产生的弯矩通常也越大，从而导致更大的弯曲变形。这个说法在基本层面上是正确的。C选项：简支梁在跨中集中力作用下，其跨中挠度（最大挠度）与跨度L的三次方成正比。这是梁理论中的一个经典结论，用于描述简支梁在集中力作用下的挠度行为。这个说法是正确的。D选项：梁的弯曲变形确实是指梁的轴线由直线变为曲线的变形。这是弯曲变形的基本定义。这个说法也是正确的。E选项：梁的抗弯刚度EI越大，梁的弯曲变形越大。这与A选项相矛盾。实际上，抗弯刚度EI越大，梁的弯曲变形应该越小。因此，这个说法是错误的。综上所述，正确的选项是A、B、C和D。所以，答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637076845793283", "t": 2, "q": "下列关于管流局部水头损失的说法，正确的有（　）", "a": ["局部水头损失是由于流体在局部区域（如阀门、弯头）流动方向或断面尺寸突变，产生漩涡和撞击引起的", "局部水头损失的计算式通常为h_j=ζv²/(2g)，其中ζ为局部阻力系数", "同一局部构件（如标准90°弯头）的局部阻力系数ζ为定值，与流速无关", "当流体从小管流入大管时，局部阻力系数ζ的取值与小管和大管的流速比有关", "局部水头损失在长管计算中通常可忽略不计", ""], "r": "ABDE", "e": "A是局部水头损失产生原因；B是常用计算式；C局部阻力系数与雷诺数和管件形状有关，不是定值；D流体从小管流入大管，ζ取值和流速比有关；E长管中局部水头损失相对沿程损失小，通常可忽略。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027520", "t": 3, "q": "理想流体是指不考虑粘性的流体，其粘性系数为零，在流动过程中不会产生能量损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "理想流体定义就是不考虑粘性，粘性系数为零，因无粘性，流动时不会因粘性产生能量损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027521", "t": 3, "q": "明渠均匀流的断面单位能量沿程逐渐减小，因为水流克服阻力消耗能量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "明渠均匀流中，水深、断面平均流速等沿程不变，断面单位能量也沿程不变。而水流克服阻力消耗的能量体现在水头损失上，并非使断面单位能量减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027522", "t": 3, "q": "轴向拉压杆的横截面上，正应力沿截面均匀分布，与截面形状无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据轴向拉压杆正应力公式，在轴向拉压情况下，横截面上正应力均匀分布，且计算式中未涉及截面形状因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027523", "t": 3, "q": "圆管内流体流动中，雷诺数Re=1500时，流动状态为紊流，因为圆管的临界雷诺数为2300，Re>2300才为紊流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "圆管内流体流动中，当雷诺数小于临界雷诺数时为层流，已知临界雷诺数是2300，本题中Re = 1500＜2300，应为层流，并非紊流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027524", "t": 3, "q": "流体静压力的方向总是垂直于作用面的外法线方向，指向作用面外部。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流体静压力方向垂直于作用面，且指向作用面内部，而不是外部。", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027525", "t": 3, "q": "梁的弯曲正应力最大值出现在弯矩最大的截面，且该截面的上下边缘处，因为此处到中性轴的距离最大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梁弯曲正应力公式表明正应力与弯矩和到中性轴距离成正比，弯矩最大截面上下边缘到中性轴距离最大，正应力最大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027526", "t": 3, "q": "管流的局部水头损失仅与局部构件的类型有关，与流体的流速无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "管流局部水头损失不仅与局部构件类型有关，还和流体流速有关，其计算公式中包含流速的平方项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027527", "t": 3, "q": "明渠急流的弗劳德数Fr>1，此时水流的惯性力大于重力，扰动波只能向下游传播。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "弗劳德数Fr是惯性力与重力的比值，Fr>1时惯性力大于重力，明渠急流中扰动波只能向下游传播。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027528", "t": 3, "q": "平面图形对某轴的静矩为零，则该轴一定是图形的形心轴，反之，图形对形心轴的静矩也为零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据静矩和形心轴的定义，平面图形对某轴静矩为零的充要条件是该轴通过图形形心，即此轴为形心轴。所以题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027529", "t": 3, "q": "实际流体的伯努利方程中，总水头沿流线逐渐减小，因为存在粘性引起的水头损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "实际流体有粘性，流动中会因粘性产生能量损耗，总水头是机械能总和，能量损耗使总水头沿流线减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027530", "t": 3, "q": "水击现象是由于流体的惯性引起的，与流体的压缩性无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水击现象不仅与流体惯性有关，还和流体的压缩性相关，流体压缩性是水击过程中能量转换等情况的重要因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027531", "t": 3, "q": "轴向拉压杆的泊松比μ是横向变形Δb与轴向变形Δl的比值，其值为正。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "泊松比μ是横向正应变与轴向正应变的绝对值之比，横向应变与轴向应变符号相反，所以μ为正，但不是横向变形Δb与轴向变形Δl的比值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637078146027532", "t": 3, "q": "明渠均匀流的水力坡度i、测压管坡度i_p和底坡i_b三者相等，这是明渠均匀流的重要特征。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在明渠均匀流中，水流作等速直线运动，流速沿程不变，动水压强按静水压强分布，所以水力坡度、测压管坡度和底坡三者相等，这是明渠均匀流的重要特征。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K05", "n": "知识点05  工程测量学基础", "qs": [{"id": "2035637090582138880", "t": 1, "q": "在水利水电工程水准测量中，若某水准尺的尺长误差为系统性误差，且该误差在水准路线中对高差观测值的影响与下列哪个因素直接相关", "a": ["水准尺的读数次数", "水准路线的测站数", "水准尺的使用温度", "水准路线的总长度", "", ""], "r": "D", "e": "在水利水电工程水准测量中，水准尺的尺长误差属于系统性误差。系统性误差对高差观测值的影响通常与测量的累积长度或测站数有关。具体来说： A选项“水准尺的读数次数”主要影响的是测量的精度，而不是系统误差的累积。 B选项“水准路线的测站数”虽然与测量的累积有关，但系统误差更多地与总的测量距离相关。 C选项“水准尺的使用温度”会影响尺子的长度，但这属于环境因素的影响，不是直接决定系统性误差累积的因素。 D选项“水准路线的总长度”直接决定了系统性误差的累积程度，因为系统误差通常是按比例随距离增加而累积的。因此，正确答案是D选项：“水准路线的总长度”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138881", "t": 1, "q": "全站仪在水利水电工程进行距离测量时，若采用相位法测量原理，其测量的距离是指", "a": ["全站仪望远镜中心到目标反射棱镜中心的斜距", "全站仪望远镜中心到目标点的水平距离", "全站仪测站点到目标点的垂直距离", "全站仪测站点到目标点的直线距离（不考虑仪器和棱镜高度）", "", ""], "r": "A", "e": "相位法测量的是全站仪望远镜中心到目标反射棱镜中心的斜距。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138882", "t": 1, "q": "在水利水电工程平面控制网优化设计中，若某控制网的主要精度指标为点位中误差，下列哪种措施能最有效地降低点位中误差", "a": ["增加控制网的观测次数", "提高观测仪器的精度等级", "增加控制网的多余观测数", "优化控制网的图形结构（如缩短边长、增加传距角）", "", ""], "r": "D", "e": "优化控制网图形结构能从根本上改善控制网的几何条件，对降低点位中误差效果最显著。增加观测次数、提高仪器精度等级、增加多余观测数虽也能提高精度，但不如优化图形结构有效。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138883", "t": 1, "q": "在水利水电工程地形图应用中，若要确定某水库坝址处的汇水面积，应采用的主要方法是", "a": ["在地形图上量取坝轴线处的断面面积，结合坝高计算", "在地形图上沿坝轴线上游，根据等高线的分水线勾绘汇水边界，再量算边界内面积", "根据地形图上的高程点，采用加权平均法计算汇水范围", "在地形图上量取坝址上下游的水位差，结合流域平均坡度计算", "", ""], "r": "B", "e": "汇水面积是指雨水流向同一山谷地面的受雨面积，需沿坝轴线上游按等高线分水线勾绘汇水边界，再量算边界内面积。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138884", "t": 1, "q": "在水利水电工程施工测量中，若采用前方交会法放样某点Q，已知两个已知点A、B的坐标分别为(xA,yA)、(xB,yB)，测得∠QAB=α、∠QBA=β，则计算Q点坐标时，不需要用到的公式或参数是", "a": ["三角形内角和为180°", "正弦定理（AQ/sinβ=BQ/sinα=AB/sin(180°-α-β)）", "坐标正算公式（根据方位角和距离算坐标）", "坐标反算公式（根据两点坐标算方位角和距离）", "", ""], "r": "D", "e": "前方交会法是利用两个已知点和两个角度来确定待定点坐标。先由三角形内角和求出∠AQB，再用正弦定理算出AQ、BQ距离，最后用坐标正算求Q点坐标，而坐标反算用于根据两点坐标求方位角和距离，本题不需要此步骤。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138885", "t": 1, "q": "在水利水电工程水准测量中，若某测站的后视读数为a，前视读数为b，仪器高为i，水准尺立尺点的高程为H，则该测站仪器视线高程Hi的正确计算公式是", "a": ["Hi=H后视+a", "Hi=H前视+b", "Hi=H后视+i", "Hi=H前视+i", "", ""], "r": "A", "e": "仪器视线高程是后视点高程加上后视读数。后视点高程用H后视表示，后视读数为a，所以Hi = H后视 + a。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138886", "t": 1, "q": "在水利水电工程水准测量中，若某附合水准路线的测段数为n，各测段高差观测值为hi，路线起点和终点的已知高程分别为H始和H终，则该附合水准路线的高差闭合差fh的正确计算公式是", "a": ["fh=Σhi-(H终-H始)", "fh=(H终-H始)-Σhi", "fh=Σhi+(H终-H始)", "fh=Σhi-(H始-H终)", "", ""], "r": "A", "e": "附合水准路线高差闭合差是实测高差总和与理论高差的差值，理论高差为终点高程减起点高程即H终 - H始，实测高差总和是Σhi，所以高差闭合差fh =Σhi - (H终 - H始)。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138887", "t": 1, "q": "全站仪在水利水电工程测量中进行角度观测时，若要消除或减弱竖轴倾斜误差对水平角观测的影响，应采取的主要措施是", "a": ["进行盘左盘右观测取平均值", "精确整平仪器并使用竖轴倾斜补偿器", "调整望远镜视准轴与横轴的垂直度", "定期对仪器进行检定校准", "", ""], "r": "B", "e": "竖轴倾斜误差无法通过盘左盘右观测消除，调整视准轴与横轴垂直度不能解决竖轴倾斜问题，定期检定校准不能实时减弱该误差。而精确整平仪器可减少竖轴倾斜，使用竖轴倾斜补偿器能对倾斜进行补偿，从而消除或减弱竖轴倾斜误差对水平角观测的影响。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138888", "t": 1, "q": "在水利水电工程平面控制网布设中，某三角网采用三角形闭合差来检验观测质量，若某三角形的三个内角观测值分别为∠A、∠B、∠C，该三角形的角度闭合差fβ的计算及调整原则是", "a": ["fβ=∠A+∠B+∠C-180°，按观测角的测角中误差反比例分配", "fβ=180°-(∠A+∠B+∠C)，按观测角的测角中误差正比例分配", "fβ=∠A+∠B+∠C-180°，按各观测角的个数平均分配", "fβ=∠A+∠B+∠C-180°，按观测角的测角中误差正比例分配", "", ""], "r": "D", "e": "三角形角度闭合差是三个内角观测值之和减 180°。闭合差调整一般按测角中误差正比例分配，因为测角中误差大，观测精度低，应多分配闭合差。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138889", "t": 1, "q": "水利水电工程地形图测绘中，若采用等高线表示地形起伏，某区域等高距为2m，某条等高线的高程为100m，相邻两条等高线之间的水平距离（平距）为50m，则该区域此段的地面坡度i（以千分比表示）为", "a": ["2‰", "4‰", "20‰", "40‰", "", ""], "r": "D", "e": "地面坡度i=等高距/平距，已知等高距为2m，平距为50m，i = 2÷50 = 0.04，化为千分比是40‰。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138890", "t": 1, "q": "在水利水电工程施工放样中，若采用极坐标法放样某点P的平面位置，已知测站点A的坐标为(xA,yA)，定向点B的坐标为(xB,yB)，测得A到P的水平距离为D，AP与AB的水平夹角为α，则P点坐标(xP,yP)的正确计算公式是", "a": ["xP=xA+D×cos(αAB+α)，yP=yA+D×sin(αAB+α)（αAB为AB的坐标方位角）", "xP=xA+D×sin(αAB+α)，yP=yA+D×cos(αAB+α)", "xP=xA+D×cos(α-αAB)，yP=yA+D×sin(α-αAB)", "xP=xA+D×cosα，yP=yA+D×sinα", "", ""], "r": "A", "e": "极坐标法求P点坐标，P点相对于A点的坐标增量需考虑AB方位角与夹角α。根据坐标增量计算原理，P点横坐标是A点横坐标加上A到P的水平距离乘以AP方向与x轴夹角的余弦值，纵坐标同理。AP与x轴夹角为AB方位角加上夹角α。所以P点坐标计算公式为xP = xA + D×cos(αAB + α)，yP = yA + D×sin(αAB + α) 。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138891", "t": 1, "q": "在水利水电工程角度测量中，若某水平角观测采用测回法，共观测3个测回，各测回的水平角观测值分别为β1、β2、β3，测回间较差的限差为±12″，则下列哪种情况说明观测成果合格", "a": ["|β1-β2|=8″，|β2-β3|=10″，|β1-β3|=15″", "|β1-β2|=10″，|β2-β3|=11″，|β1-β3|=20″", "|β1-β2|=9″，|β2-β3|=12″，|β1-β3|=21″", "|β1-β2|=11″，|β2-β3|=11″，|β1-β3|=22″", "", ""], "r": "A", "e": "在水利水电工程角度测量中，采用测回法进行水平角观测时，通常需要进行多测回观测以提高精度。各测回之间的观测值应满足一定的限差要求，以确保观测成果的可靠性。本题中，共观测了3个测回，各测回的水平角观测值分别为β1、β2、β3，测回间较差的限差为±12″。我们需要判断哪种情况下观测成果合格。根据限差要求，任意两个测回之间的较差应满足|βi - βj| ≤ 12″，其中i和j表示不同的测回编号。我们逐个分析选项：A选项：|β1-β2|=8″，|β2-β3|=10″，|β1-β3|=15″。其中，|β1-β3|=15″超过了限差±12″，因此不合格。B选项：|β1-β2|=10″，|β2-β3|=11″，|β1-β3|=20″。其中，|β1-β3|=20″超过了限差±12″，因此不合格。C选项：|β1-β2|=9″，|β2-β3|=12″，|β1-β3|=21″。其中，|β1-β3|=21″超过了限差±12″，因此不合格。D选项：|β1-β2|=11″，|β2-β3|=11″，|β1-β3|=22″。所有较差均在限差±12″以内，因此合格。综上所述，只有D选项满足所有测回间较差的限差要求，观测成果合格。所以，正确答案是A选项。", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138892", "t": 1, "q": "在水利水电工程地形图测绘中，若采用全站仪数字化测图，其碎部点测量时，不需要记录的信息是", "a": ["碎部点的三维坐标（x,y,H）", "碎部点的属性（如房屋角点、道路边线、地貌点）", "碎部点与相邻点的连接关系", "碎部点的观测时间", "", ""], "r": "D", "e": "全站仪数字化测图碎部点测量主要关注坐标、属性及连接关系以成图，观测时间对成图无直接作用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138893", "t": 1, "q": "在水利水电工程测量误差分析中，若某观测值的偶然误差服从正态分布，其标准差为σ，则该观测值的中误差m与σ的关系是", "a": ["m=σ/√2", "m=σ", "m=2σ", "m=σ²", "", ""], "r": "B", "e": "在测量误差分析里，当观测值的偶然误差服从正态分布时，中误差和标准差在数值上是相等的。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138894", "t": 1, "q": "在水利水电工程施工放样中，若某大坝的坝轴线为曲线，采用偏角法进行放样，其核心原理是利用", "a": ["曲线的偏角与曲线长度的线性关系", "曲线的偏角与曲线半径的反比关系", "曲线的偏角与弦长的对应关系", "曲线的偏角与圆心角的两倍关系", "", ""], "r": "C", "e": "偏角法是通过测设曲线的偏角和弦长来放样曲线，核心是利用曲线的偏角与弦长的对应关系。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138895", "t": 1, "q": "在水利水电工程水准测量中，若某三等水准路线的高差闭合差限差为±12√L mm（L为路线长度，单位km），某路线长度为4km，则该路线的高差闭合差限差为", "a": ["±12mm", "±24mm", "±36mm", "±48mm", "", ""], "r": "B", "e": "将路线长度L = 4km代入高差闭合差限差公式「test/yiwen_img/importSubject/2035637087750983680.png」，即「test/yiwen_img/importSubject/2035637087994253312.png」。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138896", "t": 1, "q": "全站仪在水利水电工程进行角度观测时，若仪器的视准轴误差为c，当观测某一水平角时，盘左观测值为β左，盘右观测值为β右，则消除视准轴误差后的水平角观测值β为", "a": ["β=(β左+β右)/2", "β=(β左-β右)/2", "β=β左-c", "β=β右+c", "", ""], "r": "A", "e": "视准轴误差可通过盘左盘右取平均来消除，即消除视准轴误差后的水平角观测值为盘左、盘右观测值的平均值。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138897", "t": 1, "q": "在水利水电工程平面控制网中，若采用GNSS（GPS）测量，其布设的首级控制网通常属于", "a": ["三角网", "导线网", "边角网", "大地控制网", "", ""], "r": "D", "e": "GNSS（GPS）测量布设的首级控制网是基于大地坐标系统的，属于大地控制网。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138898", "t": 1, "q": "在水利水电工程地形图测绘中，若某地形图的比例尺为1:2000，等高距为2m，某一陡崖处相邻等高线重合，该陡崖的相对高度H的范围是", "a": ["H≥2m", "2m≤H<4m", "4m≤H<6m", "H≥6m", "", ""], "r": "B", "e": "陡崖相对高度计算公式为(n - 1)d ≤ H < (n + 1)d，n为重合等高线条数，这里相邻等高线重合，n = 2，d为等高距2m，代入得2m ≤ H < 6m ，结合选项B更符合。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138899", "t": 1, "q": "在水利水电工程施工测量中，若对某混凝土建筑物的高程放样采用水准测量法，已知放样点的设计高程为H设，水准点的已知高程为H已知，水准仪在水准点处的读数为a，在放样点处的读数为b，则放样时应使水准尺在放样点处的读数为", "a": ["b=H已知+a-H设", "b=H设+a-H已知", "b=H已知+a+H设", "b=H设-H已知-a", "", ""], "r": "A", "e": "根据水准测量原理，H已知 + a = H设 + b，移项可得b = H已知 + a - H设。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138900", "t": 1, "q": "在水利水电工程水准测量误差分析中，下列哪种误差属于偶然误差", "a": ["水准尺的尺长误差", "水准仪的i角误差", "水准测量中的读数误差", "水准路线的地球曲率影响", "", ""], "r": "C", "e": "偶然误差是在相同观测条件下，对某一量进行一系列观测，误差出现的符号和大小都表现出偶然性。读数误差受观测者主观因素等影响，其大小和符号不确定，属于偶然误差。而尺长误差、i角误差、地球曲率影响是有规律可寻的，属于系统误差。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138901", "t": 1, "q": "全站仪在水利水电工程测量中，若要测量某点的高程，已知测站点高程为H站，仪器高为i，棱镜高为v，测得的斜距为D，垂直角为α，则该点的高程H点的正确计算公式是", "a": ["H点=H站+i+D×sinα-v", "H点=H站+i+D×cosα-v", "H点=H站-i+D×sinα+v", "H点=H站-i+D×cosα+v", "", ""], "r": "A", "e": "根据全站仪测量高程原理，目标点高程等于测站点高程加上仪器高，再加上斜距与垂直角正弦值的乘积，最后减去棱镜高。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138902", "t": 1, "q": "在水利水电工程平面控制网观测中，若某导线网的一条附合导线，其角度闭合差和坐标增量闭合差均已满足限差要求，对坐标增量闭合差的调整原则是", "a": ["按导线各边的边长正比例分配", "按导线各边的测角中误差反比例分配", "按导线各测站的观测次数平均分配", "按导线各边的坐标方位角正比例分配", "", ""], "r": "A", "e": "导线坐标增量闭合差调整原则是按导线各边的边长正比例分配。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637090582138903", "t": 1, "q": "在水利水电工程地形图应用中，若要计算某一不规则地块的面积，采用坐标法时，已知地块边界转折点的坐标依次为(x1,y1)、(x2,y2)、...、(xn,yn)，则面积S的计算公式是", "a": ["S=1/2|Σ(xi yi+1-xi+1 yi)|（x n+1=x1，y n+1=y1）", "S=Σ(xi yi+1-xi+1 yi)（x n+1=x1，y n+1=y1）", "S=1/2|Σ(xi+xi+1)(yi-yi+1)|（x n+1=x1，y n+1=y1）", "S=1/2Σ|xi yi+1-xi+1 yi|（x n+1=x1，y n+1=y1）", "", ""], "r": "A", "e": "计算不规则地块面积用坐标法的公式是「test/yiwen_img/importSubject/2035637088082333696.png」（「test/yiwen_img/importSubject/2035637088166219776.png」，「test/yiwen_img/importSubject/2035637088237522944.png」）。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547200", "t": 2, "q": "在水利水电工程水准测量中，影响高差观测精度的系统性误差主要包括（　）", "a": ["水准尺的尺长误差", "水准仪的i角误差", "水准测量中的读数误差", "水准路线的地球曲率影响", "水准尺的温度变形误差", ""], "r": "ABDE", "e": "系统性误差是有规律的误差。A选项水准尺尺长误差、B选项水准仪i角误差、D选项地球曲率影响、E选项水准尺温度变形误差都有一定规律，属于系统性误差；而C选项读数误差是偶然的，属于偶然误差。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547202", "t": 2, "q": "在水利水电工程平面控制网布设中，导线网相比三角网具有的优点包括（　）", "a": ["受地形条件限制小，适合地形复杂区域", "布设灵活，可根据工程需求调整边长和形状", "观测工作量少，效率高", "图形强度高，点位中误差小", "无需测量水平角，仅需测量距离", ""], "r": "ABC", "e": "导线网受地形条件限制小，布设灵活，观测工作量相对少、效率高；三角网图形强度高、点位中误差小，导线网需测水平角和距离。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547203", "t": 2, "q": "在水利水电工程地形图应用中，等高线的基本特性包括（　）", "a": ["同一条等高线上各点的高程相等", "等高线为闭合曲线，若在图内不闭合，必在图外闭合", "等高线与分水线、合水线垂直相交", "相邻等高线之间的水平距离（平距）与地面坡度成正比", "等高线不能相交（陡崖处重合，非相交）", ""], "r": "ABCE", "e": "A选项，同一条等高线上各点高程相等是等高线基本特性；B选项，等高线为闭合曲线，图内不闭合就在图外闭合；C选项，等高线与分水线、合水线垂直相交；E选项，等高线一般不相交，陡崖处重合。而D选项，相邻等高线平距与地面坡度成反比，不是正比。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637092490547204", "t": 2, "q": "在水利水电工程施工放样中，常用的平面放样方法包括（　）", "a": ["极坐标法", "前方交会法", "后方交会法", "归化法", "水准测量法", ""], "r": "ABCD", "e": "水准测量法是高程测量方法，不是平面放样方法，A极坐标法、B前方交会法、C后方交会法、D归化法都是常用平面放样方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193472", "t": 3, "q": "在水利水电工程水准测量中，偶然误差的算术平均值随着观测次数的无限增加而趋近于零，因此多次观测取平均值可消除偶然误差的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "偶然误差具有抵偿性，多次观测取平均值能减小偶然误差影响，但不能消除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193473", "t": 3, "q": "全站仪在水利水电工程测量中，采用盘左盘右观测水平角并取平均值，可完全消除竖轴倾斜误差对水平角观测值的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "盘左盘右观测取平均值可消除视准轴误差、横轴误差等影响，但竖轴倾斜误差不能用该方法消除。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193474", "t": 3, "q": "在水利水电工程平面控制网中，三角网的图形强度主要取决于传距角的大小，传距角越接近90°，图形强度越高，点位中误差越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利水电工程平面控制网三角网里，传距角接近90°时，图形强度高，点位中误差小，符合相关原理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193475", "t": 3, "q": "水利水电工程地形图中，等高线越密集，表示该区域的地面坡度越小;等高线越稀疏，表示坡度越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在地形图中，等高线越密集，代表单位水平距离内的垂直高差大，地面坡度大；等高线越稀疏，单位水平距离内垂直高差小，坡度小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193476", "t": 3, "q": "在水利水电工程施工放样中，极坐标法放样平面位置时，只需知道测站点坐标、目标点设计坐标，即可计算出放样所需的水平距离和水平角，无需已知定向点坐标。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "极坐标法放样平面位置，除测站点坐标、目标点设计坐标外，还需已知定向点坐标来确定角度基准，才能计算放样所需水平距离和水平角。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193477", "t": 3, "q": "在水利水电工程水准测量中，水准尺的尺长误差属于系统性误差，可通过在水准路线两端对水准尺进行尺长检定，计算尺长改正数来消除其影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水准尺尺长误差是因尺子制作等原因产生的有规律的误差，属系统性误差，通过在水准路线两端对水准尺进行尺长检定并计算尺长改正数，能消除该误差影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193478", "t": 3, "q": "全站仪在水利水电工程三角高程测量中，测得的垂直角为仪器望远镜中心与棱镜中心连线与水平面的夹角，该角度值不受仪器竖轴倾斜误差的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "全站仪的垂直角测量会受仪器竖轴倾斜误差影响，竖轴倾斜会使水平度盘和垂直度盘产生误差，从而影响垂直角测量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193479", "t": 3, "q": "在水利水电工程平面控制网中，导线网的坐标增量闭合差调整时，按导线各边的边长正比例分配，边长越长，分配的闭合差绝对值越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "导线网坐标增量闭合差调整原则就是按导线各边边长正比例分配，边长与分配的闭合差绝对值成正比，边长越长分配的闭合差绝对值越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193480", "t": 3, "q": "水利水电工程地形图应用中，采用坐标法计算不规则地块面积时，地块边界转折点的坐标顺序（顺时针或逆时针）不影响面积计算结果的绝对值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "坐标法计算不规则地块面积时，通过相应公式计算，转折点坐标顺序不影响面积计算结果绝对值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193481", "t": 3, "q": "在水利水电工程施工放样中，归化法放样的精度高于直接放样法，主要因为归化法通过多次测量和修正，减小了放样误差的累积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "归化法是先按直接放样法确定实地标志，再精确测量并与设计位置比较，对标志位置进行修正，多次测量和修正可减小放样误差累积，所以精度高于直接放样法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193482", "t": 3, "q": "在水利水电工程水准测量中，闭合水准路线的高差闭合差理论值不为零，因为存在地球曲率和大气折光的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "闭合水准路线高差闭合差理论值应为零，地球曲率和大气折光虽会影响测量，但不改变理论值。答案是错误的。", "ap": [false, false, false, false, false, false]}, {"id": "2035637093929193483", "t": 3, "q": "在水利水电工程角度测量中，竖直角观测的指标差是指竖盘指标线与正确位置的偏差，可通过盘左盘右观测竖直角取平均值来消除其影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "竖直角观测指标差就是竖盘指标线与正确位置的偏差，盘左盘右观测竖直角取平均值能有效消除指标差影响。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K06", "n": "知识点06  工程地质基础", "qs": [{"id": "2035637097234305024", "t": 1, "q": "下列关于\"岩溶发育区水利工程选址\"的原则，正确的是（　）", "a": ["应选择岩溶发育强烈、溶洞密集的区域，便于排水", "应选择岩溶发育微弱、岩层完整、无大规模溶洞的区域", "可选择在溶洞顶板厚度小于2米的区域，只需进行简单注浆处理", "应选择在地下暗河主通道上方，便于利用地下水资源", "", ""], "r": "B", "e": "水利工程选址要保证安全稳定，岩溶发育强烈、溶洞密集、顶板薄及地下暗河主通道上方等区域，工程建设易出现塌陷、渗漏等问题，而发育微弱、岩层完整、无大规模溶洞区域相对安全稳定。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305025", "t": 1, "q": "某水利工程勘察采用地震波勘探，测定岩体纵波速度vp=4000米/秒，横波速度vs=2300米/秒，该岩体的泊松比μ（公式:μ=(vp²-2vs²)/(2(vp²-vs²))）约为（　）", "a": ["0.23", "0.25", "0.33", "0.38", "", ""], "r": "B", "e": "代入公式：μ=(4000²-2×2300²)/(2×(4000²-2300²))=(16000000-10580000)/(2×10710000)=5420000/21420000≈0.253，最接近0.25，选B。", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305026", "t": 1, "q": "下列岩石的抗剪强度指标中，与水利工程坝基抗滑稳定计算直接相关的是（　）", "a": ["岩石的抗压强度", "岩石的抗拉强度", "岩石结构面的内摩擦角和黏聚力", "岩石的弹性模量", "", ""], "r": "C", "e": "坝基抗滑稳定主要取决于岩石结构面的抗剪能力，抗剪强度由内摩擦角和黏聚力决定。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305027", "t": 1, "q": "某水利枢纽基坑开挖过程中，发现坑底土层为饱和粉土，当开挖深度达到5米时，出现\"流土\"现象，其主要原因是（　）", "a": ["基坑开挖速度过快，土颗粒来不及排水固结", "饱和粉土渗透系数大，水位差导致水流速度快", "基坑底处的有效应力为零，土颗粒失去抗剪强度", "饱和粉土黏聚力大，开挖后易形成塑性区", "", ""], "r": "C", "e": "流土是在渗流作用下，土体中的颗粒群同时发生移动的现象，当坑底处有效应力为零，土颗粒就会失去抗剪强度，产生流土。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305028", "t": 1, "q": "下列关于\"地质剖面图\"在水利工程勘察中的作用，错误的是（　）", "a": ["可反映地下岩层的分布、厚度及产状", "可显示断层、裂隙等地质构造的位置和性质", "可直接确定坝基岩体的渗透系数", "可辅助判断地下水位的埋藏深度", "", ""], "r": "C", "e": "地质剖面图能呈现岩层分布、构造等情况，但渗透系数需通过专门试验测定，不能直接从剖面图确定。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305029", "t": 1, "q": "某水利工程边坡采用锚索加固，与锚杆相比，锚索的主要优势是（　）", "a": ["锚索长度更短，施工更便捷", "锚索可施加更大的预拉力，锚固深度更大", "锚索仅适用于黏性土边坡，锚杆适用于岩石边坡", "锚索成本更低，材料用量更少", "", ""], "r": "B", "e": "锚索能施加更大预拉力且锚固深度大，这是其相对锚杆的主要优势。A选项锚索长度一般更长；C选项锚索和锚杆适用范围并非如此绝对；D选项锚索成本通常更高。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305030", "t": 1, "q": "下列关于\"第四纪沉积物\"的说法，正确的是（　）", "a": ["第四纪沉积物形成时间早于第三纪，岩性更坚硬", "洪积物多分布于河流出山口，呈扇形分布，颗粒分选性好", "冲积物多分布于河流中下游平原，层理清晰，颗粒分选性较好", "风积物仅分布于干旱地区，颗粒均为细砂，无层理构造", "", ""], "r": "C", "e": "第四纪晚于第三纪，A错；洪积物颗粒分选性差，B错；风积物并非仅分布于干旱地区，且有层理构造，D错；冲积物多在河流中下游平原，层理清晰、分选性较好，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305031", "t": 1, "q": "在水利水电工程地质勘察中，某区域岩石呈层状分布，层理面平整且有化石残骸，该岩石经风化后易形成泥质夹层，其成因类型最可能是（　）", "a": ["侵入型岩浆岩", "喷出型岩浆岩", "沉积岩", "变质岩", "", ""], "r": "C", "e": "沉积岩有层理构造，常含化石，风化后易形成泥质夹层，题中描述的岩石特征符合沉积岩特点。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305032", "t": 1, "q": "某水利枢纽坝基存在一组走向与坝轴线平行、倾向下游的裂隙，裂隙间距2-3米，延伸长度超过10米，该裂隙对坝基稳定性的主要影响是（　）", "a": ["增加坝基抗滑稳定性", "降低坝基渗透稳定性", "提高坝基承载力", "减小坝基沉降量", "", ""], "r": "B", "e": "走向与坝轴线平行、倾向下游的裂隙会使坝基的渗流路径变短，水更容易通过裂隙渗透，从而降低坝基渗透稳定性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305033", "t": 1, "q": "下列关于岩石单轴抗压强度与水利工程关系的说法，正确的是（　）", "a": ["岩石单轴抗压强度越大，其软化系数一定越高", "岩石单轴抗压强度小于5MPa时，不宜作为重力坝坝基持力层", "岩石单轴抗压强度仅与岩石矿物成分有关，与岩石结构无关", "岩石单轴抗压强度测试时，试件高径比不影响测试结果", "", ""], "r": "B", "e": "A选项，抗压强度和软化系数无必然联系；C选项，抗压强度与岩石结构有关；D选项，试件高径比会影响测试结果。而当岩石单轴抗压强度小于5MPa时，强度较低，不宜作为重力坝坝基持力层。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305034", "t": 1, "q": "某水电站地下厂房选址区存在岩溶地貌，勘察发现溶洞顶板厚度为8米，溶洞跨度为12米，岩石单轴抗压强度为60MPa，按经验公式判断该溶洞顶板的稳定性（经验公式:稳定顶板厚度H≥0.8×跨度L，且需满足岩石强度足够）（　）", "a": ["稳定，因顶板厚度大于0.8×跨度", "不稳定，因顶板厚度小于0.8×跨度", "稳定，因岩石单轴抗压强度高", "不稳定，因溶洞跨度超过10米即不稳定", "", ""], "r": "B", "e": "根据经验公式，稳定顶板厚度H≥0.8×跨度L，0.8×12 = 9.6米，而实际顶板厚度8米＜9.6米，所以不稳定。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305035", "t": 1, "q": "在水利工程地质中，\"潜水\"的主要水文地质特征是（　）", "a": ["有两个稳定的隔水层，水位不受气候影响", "无稳定隔水顶板，水位随降水和蒸发变化", "埋藏于地表以下第一个稳定隔水层之上，受地质构造控制显著", "水流速度快，水质易受地表污染影响小", "", ""], "r": "B", "e": "潜水是埋藏于地表以下第一个稳定隔水层之上具有自由水面的重力水，无稳定隔水顶板，其水位会随降水和蒸发等气候因素变化。A选项有两个稳定隔水层是承压水特征；C选项潜水受气候影响大，非地质构造控制显著；D选项潜水水流速度慢，水质易受地表污染影响。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305036", "t": 1, "q": "某水利工程边坡岩体内存在一组缓倾角结构面，结构面内充填有厚度约5厘米的蒙脱石黏土，该边坡最可能发生的失稳类型是（　）", "a": ["崩塌", "平面滑动", "楔形滑动", "旋转滑动", "", ""], "r": "B", "e": "缓倾角结构面且充填蒙脱石黏土，易沿结构面发生平面滑动。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305037", "t": 1, "q": "下列关于水利工程地基处理中\"高压喷射注浆法\"的适用条件，错误的是（　）", "a": ["适用于处理淤泥质土、黏性土、粉土", "不适用于处理含有较多大粒径（大于20厘米）块石的土层", "适用于处理地下水位以下的土层", "不适用于处理渗透系数大于10-2厘米/秒的砂土层", "", ""], "r": "D", "e": "高压喷射注浆法适用于处理淤泥质土、黏性土、粉土等，能处理地下水位以下土层，也可处理渗透系数大的砂土层。但对含较多大粒径（大于20厘米）块石的土层处理效果差。所以错误的是D。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305038", "t": 1, "q": "在地质构造中，\"逆断层\"的受力状态及位移特征是（　）", "a": ["受水平拉应力作用，上盘相对向下滑动", "受水平压应力作用，上盘相对向上滑动", "受垂直应力作用，下盘相对向上滑动", "受扭应力作用，两盘沿水平方向相对错动", "", ""], "r": "B", "e": "逆断层是受水平压应力作用形成，其特征是上盘相对向上滑动。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305039", "t": 1, "q": "下列岩石中，属于变质岩且主要由区域变质作用形成的是（　）", "a": ["大理岩", "片麻岩", "石英岩（热接触变质形成）", "蛇纹岩", "", ""], "r": "B", "e": "区域变质作用是大面积发生的变质作用。大理岩是由石灰岩经接触变质或区域变质形成；石英岩是热接触变质形成，不符合区域变质要求；蛇纹岩成因复杂。片麻岩是典型由区域变质作用形成的变质岩。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305040", "t": 1, "q": "水利水电工程中，\"管涌\"发生的主要条件是（　）", "a": ["土颗粒均匀，渗透水流速小于临界流速", "土颗粒级配不良，细颗粒含量少，渗透水流速大于临界流速", "土颗粒不均匀，粗颗粒形成骨架，细颗粒填充孔隙，渗透水流速大于细颗粒启动流速", "土颗粒呈黏性，渗透系数小，水位差大", "", ""], "r": "C", "e": "管涌发生需土颗粒不均匀，粗颗粒形成骨架，细颗粒填充孔隙，且渗透水流速大于细颗粒启动流速。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305041", "t": 1, "q": "某水利枢纽坝址区存在一条活动性断层，勘察确定其最新活动时代为第四纪晚更新世，该断层对工程的主要影响是（　）", "a": ["仅影响坝体混凝土浇筑质量", "可能引发坝基不均匀沉降和地震风险", "对坝基渗透稳定性无影响", "仅导致坝基岩石风化速度加快", "", ""], "r": "B", "e": "活动性断层会使坝基受力不均，导致不均匀沉降，且可能引发地震。A选项，断层对混凝土浇筑质量无直接影响；C选项，断层会影响坝基渗透稳定性；D选项，断层主要影响结构稳定性，并非仅加快岩石风化速度。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305042", "t": 1, "q": "下列关于岩石风化程度分级与水利工程关系的说法，正确的是（　）", "a": ["微风化岩石抗压强度高，可直接作为高坝坝基，无需处理", "中风化岩石裂隙较发育，必须全部挖除后才能作为坝基", "强风化岩石强度低，仅可作为临时挡土结构的地基", "全风化岩石可视为土，其承载力满足要求时可作为低水头建筑物地基", "", ""], "r": "D", "e": "微风化岩石虽抗压强度高，但可能仍需一定处理，A错误；中风化岩石不一定全部挖除，可根据情况处理后作坝基，B错误；强风化岩石强度低，一般不适合做临时挡土结构地基，C错误；全风化岩石可视为土，承载力满足要求时可作低水头建筑物地基，D正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305043", "t": 1, "q": "在水文地质勘察中，\"承压水\"的水头压力与工程建设的关系，错误的是（　）", "a": ["承压水水头高于地表时，钻孔会出现自流水现象", "基坑开挖时，若承压水水头高于基坑底，可能导致基坑突涌", "承压水水头压力越大，对隧道衬砌的侧压力越小", "承压水补给区与排泄区距离远，水位变化较缓慢", "", ""], "r": "C", "e": "承压水水头压力越大，对隧道衬砌的侧压力应越大，C选项说法错误。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305044", "t": 1, "q": "某水利工程边坡治理中，采用锚杆支护，其主要作用是（　）", "a": ["增加边坡岩体的重量，提高抗滑力", "将边坡表层岩体与深部稳定岩体连接，传递拉力", "填充岩体裂隙，提高岩体完整性", "降低边坡岩体的渗透系数，减少渗水", "", ""], "r": "B", "e": "锚杆是将一端固定在稳定的岩体中，另一端与边坡表层岩体连接，能把边坡表层不稳定岩体与深部稳定岩体连为一体，传递拉力，增强边坡稳定性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305045", "t": 1, "q": "下列地质现象中，属于\"物理风化\"的是（　）", "a": ["岩石
