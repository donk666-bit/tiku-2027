时监测水利工程（如大坝、堤防）变形的技术是？", "a": ["超声波水位计技术", "全球导航卫星系统（GNSS）高精度定位技术", "雨量计技术", "水质传感器技术", "", ""], "r": "B", "e": "监测水利工程变形需高精度定位技术，GNSS可实现。A测水位，C测雨量，D测水质，均与工程变形监测无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776590", "t": 1, "q": "在水利大数据数据存储架构中，适合存储非结构化数据（如水利工程影像、遥感图片）的存储方式是？", "a": ["关系型数据库（如MySQL）", "分布式文件系统（如HDFS）", "列存储数据库（如HBase）", "键值数据库（如Redis）", "", ""], "r": "B", "e": "非结构化数据量大、格式多样，分布式文件系统适合存储这种大规模非结构化数据。关系型数据库适合结构化数据；列存储数据库常用于海量数据存储与分析；键值数据库主要用于缓存等场景。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776591", "t": 1, "q": "某水利部门采用大数据分析评估区域水资源承载能力，其评估指标体系构建不包括以下哪项指标？", "a": ["区域多年平均水资源总量", "区域工业用水重复利用率", "区域大气污染物排放量", "区域水资源开发利用率", "", ""], "r": "C", "e": "评估区域水资源承载能力主要围绕水资源相关指标。A项多年平均水资源总量是基础数据；B项工业用水重复利用率反映水资源利用效率；D项水资源开发利用率体现开发程度。而C项大气污染物排放量与水资源承载能力评估并无直接关联。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776592", "t": 1, "q": "智慧水利中的边缘计算技术，其在水利数据处理中的主要作用是？", "a": ["将所有数据传输至云端统一处理", "在数据采集端就近处理部分数据，减少云端压力", "仅负责数据存储，不参与计算", "替代云端计算，实现完全本地化处理", "", ""], "r": "B", "e": "边缘计算是在靠近数据源头的网络边缘侧，就近处理数据。在智慧水利里能在数据采集端就近处理部分数据，可减轻数据传输压力和云端处理压力。A是传统集中式处理模式；C边缘计算参与计算；D边缘计算不能完全替代云端计算。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776593", "t": 1, "q": "在水资源数据质量评价中，\"数据完整性\"指标主要评价的是？", "a": ["数据是否符合既定格式标准", "数据是否无缺失、无遗漏", "数据是否与实际情况一致", "数据传输过程是否无丢失", "", ""], "r": "B", "e": "“数据完整性”强调数据无缺失、无遗漏。A选项说的是数据格式，C选项是数据准确性，D选项侧重于传输情况。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776594", "t": 1, "q": "大数据技术在水质监测中的应用，可实现的功能不包括以下哪项？", "a": ["基于历史水质数据识别异常污染事件", "实时监测水体pH值、溶解氧等参数", "预测未来一段时间内水质变化趋势", "制定水污染治理的法律法规", "", ""], "r": "D", "e": "大数据技术可处理和分析水质数据，用于识别异常、实时监测和预测趋势，但制定法律法规属于政策制定层面，并非大数据技术在水质监测中的功能。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776595", "t": 1, "q": "数字孪生水利工程建设中，\"虚实交互\"环节的核心要求是？", "a": ["虚拟模型与物理实体的静态外观一致", "虚拟模型能实时接收物理实体数据，并同步更新状态", "虚拟模型仅用于展示，不与物理实体交互", "虚拟模型的更新频率低于物理实体变化频率", "", ""], "r": "B", "e": "“虚实交互”强调虚拟与现实之间的动态互动，核心是虚拟模型能实时获取物理实体数据并同步更新状态。A选项静态外观一致并非核心要求；C选项不交互不符合“交互”含义；D选项更新频率低无法实现实时交互。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776596", "t": 1, "q": "在水利数据安全防护中，针对水利调度指令等敏感数据的传输安全，最适合采用的技术是？", "a": ["数据脱敏技术", "传输层加密协议（如SSL/TLS）", "数据备份技术", "访问控制技术", "", ""], "r": "B", "e": "题目关注敏感数据传输安全，传输层加密协议可对传输数据加密，保障传输安全；数据脱敏用于处理数据隐私，数据备份用于数据恢复，访问控制用于限制访问权限，均不针对传输安全。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776597", "t": 1, "q": "某流域采用大数据模型进行水资源调度优化，其优化目标不包括以下哪项？", "a": ["提高水资源利用效率", "保障流域内生活、生产、生态用水需求", "减少水利工程的建设数量", "降低水资源调度成本", "", ""], "r": "C", "e": "水资源调度优化主要围绕水资源的合理使用和调配。A提高利用效率、B保障用水需求、D降低调度成本都是常见目标。而减少水利工程建设数量并非水资源调度优化直接目标。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776598", "t": 1, "q": "智慧水利中的\"数字流域\"与\"数字孪生流域\"的主要区别在于？", "a": ["数字流域是静态模型，数字孪生流域是动态可交互模型", "数字流域仅包含地形数据，数字孪生流域仅包含水文数据", "数字流域用于展示，数字孪生流域用于存储数据", "数字流域覆盖范围小，数字孪生流域覆盖范围大", "", ""], "r": "A", "e": "数字流域侧重于构建相对静态的流域数字化模型，而数字孪生流域强调与物理流域实时映射、动态交互。B选项两者包含数据都不局限于所说内容；C选项数字孪生流域不只是用于存储数据，也有分析决策等功能，数字流域也不只是展示；D选项覆盖范围并非两者主要区别。所以选A。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776599", "t": 1, "q": "在水资源数据管理中，\"增量数据同步\"技术的主要优势是？", "a": ["同步所有历史数据，确保数据完整", "仅同步新增或变化的数据，减少数据传输量", "同步速度比全量同步慢，但精度更高", "仅同步结构化数据，不同步非结构化数据", "", ""], "r": "B", "e": "“增量”强调的是新增或有变化的部分。增量数据同步就是只同步这部分数据，能减少数据传输量。A说同步所有历史数据是全量同步特点；C中增量同步速度通常比全量快；D增量数据同步并非只针对结构化数据。所以选B。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776600", "t": 1, "q": "大数据技术在水利应急管理中的应用，不包括以下哪项场景？", "a": ["台风引发的洪水灾害应急响应预案生成", "地震导致的水库溃坝风险快速评估", "水利应急物资的日常库存管理（非应急状态）", "突发水污染事件的扩散路径模拟", "", ""], "r": "C", "e": "大数据技术在水利应急管理应用侧重于应急场景。C选项是水利应急物资日常库存管理，处于非应急状态，不属于应急管理应用场景。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241856", "t": 2, "q": "智慧水利建设中，数字孪生水利工程的构建需要整合多源技术，下列哪些技术属于其核心支撑技术？（　）", "a": ["高精度三维建模与可视化技术", "物理机理与数据驱动融合的仿真计算技术", "物联网实时数据采集技术", "大数据分析与人工智能决策技术", "普通建筑工程施工技术", ""], "r": "ABCD", "e": "数字孪生水利工程需整合多种先进技术来实现对水利工程的精准映射和智能决策。A可实现工程三维呈现，B用于仿真模拟，C能实时获取数据，D辅助分析决策，均是核心支撑技术；而普通建筑工程施工技术并非数字孪生水利工程构建的核心支撑技术。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241857", "t": 2, "q": "水资源数据管理中，多源异构数据的整合方法通常包括下列哪些？（　）", "a": ["制定统一的数据编码与格式标准", "构建数据中台实现数据清洗、转换与融合", "采用ETL（抽取-转换-加载）工具处理批量数据", "直接删除格式不统一的数据", "使用数据联邦技术实现数据逻辑整合，物理存储不变", ""], "r": "ABCE", "e": "A选项统一编码和格式标准利于数据整合；B选项数据中台可进行数据清洗等操作促进整合；C选项ETL工具能处理批量数据完成整合；E选项数据联邦技术可实现逻辑整合。而D选项直接删除格式不统一数据会造成数据丢失，不是正确的整合方法。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241858", "t": 2, "q": "大数据技术在水利洪水防控中的应用场景包括下列哪些？（　）", "a": ["基于多源数据的洪水致灾风险动态评估", "洪水演进过程的实时模拟与可视化展示", "水库群联合防洪调度方案的智能生成", "洪水过后的灾情快速评估与损失统计", "仅依靠历史洪水数据进行固定方案调度", ""], "r": "ABCD", "e": "大数据技术可利用多源数据进行洪水致灾风险评估、实时模拟洪水演进、智能生成水库群调度方案、快速评估洪水灾情与损失，而仅依靠历史洪水数据进行固定方案调度未体现大数据技术优势。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637152213241859", "t": 2, "q": "智慧水利中的感知层设备选型需考虑多方面因素，下列哪些属于关键选型因素？（　）", "a": ["监测数据的精度与分辨率要求", "设备运行环境的适应性（如高温、高湿、腐蚀性）", "设备的功耗与供电方式（如市电、太阳能、电池）", "设备的数据传输距离与通信协议兼容性", "设备的外观设计是否美观", ""], "r": "ABCD", "e": "智慧水利感知层设备选型关键要满足功能和运行要求。A关乎监测质量，B影响设备在特定环境下能否正常工作，C涉及设备持续运行的保障，D关系到数据能否有效传输，而E外观设计美观并非关键因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725504", "t": 3, "q": "智慧水利的核心是利用数字技术替代水利工程的实体建设，无需依赖实体水利工程即可实现水资源调控。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利是对传统水利的智能化升级，它依托实体水利工程，数字技术起到辅助优化作用，不能替代实体建设，也无法脱离实体工程实现水资源调控。", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725505", "t": 3, "q": "水资源数据管理中，数据质量控制的优先级高于数据存储容量扩展，因为低质量数据即使存储再多也无法有效支撑业务决策。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据质量关系到其能否有效支撑业务决策，低质量数据即便大量存储也无实质作用，所以保障数据质量应优先于单纯扩展存储容量。", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725506", "t": 3, "q": "大数据技术在水利领域应用时，由于数据量庞大，无需对数据进行预处理（如清洗、去重），可直接用于模型分析。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "即便数据量庞大，水利领域大数据也存在错误、重复、不完整等问题，不进行预处理会影响模型分析的准确性和可靠性，所以不能直接用于模型分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725507", "t": 3, "q": "数字孪生水利工程模型的精度越高，其对硬件计算资源的需求越大，在实际应用中需在模型精度与计算效率间进行平衡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "精度高意味着模型要更细致精准地模拟，会涉及更多复杂计算，必然对硬件计算资源需求增大，而实际应用中要考虑成本、时间等因素，所以需在精度和计算效率间平衡。", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725508", "t": 3, "q": "水资源数据共享时，为满足各部门需求，应将所有水利数据无差别公开共享，无需考虑数据安全与保密要求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。水利数据包含很多敏感信息，如涉及国家安全、商业秘密、个人隐私等，不能无差别公开共享，需在保障数据安全与保密的前提下进行共享。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725509", "t": 3, "q": "智慧水利中的物联网感知层设备，只要能采集到数据即可，无需考虑设备的抗干扰能力与稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利中物联网感知层设备要稳定、准确采集数据，恶劣环境易有干扰因素，若设备抗干扰能力与稳定性差，数据会不准确或传输中断，影响水利决策，所以必须考虑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725510", "t": 3, "q": "大数据技术在水利洪水预报中，可完全替代传统物理模型，仅通过数据驱动模型即可实现精准预报。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据技术虽能助力洪水预报，但传统物理模型有其不可替代的优势，二者结合才能更好实现精准预报，不能仅靠数据驱动模型完全替代传统物理模型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725511", "t": 3, "q": "水资源数据生命周期管理中，数据销毁环节需确保销毁后的数据无法被恢复，防止敏感数据泄露。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水资源数据生命周期管理里，数据销毁的关键目的就是防止敏感数据泄露，这就要求销毁后的数据不能被恢复。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725512", "t": 3, "q": "智慧水利平台的应用层功能模块应固定不变，一旦建成无需根据业务需求变化进行调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "业务需求是不断变化发展的，智慧水利平台的应用层功能模块需要根据业务需求的变化进行灵活调整，以更好地服务水利业务，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725513", "t": 3, "q": "水资源数据标准化的核心是制定统一的数据格式，无需考虑数据分类与编码的一致性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水资源数据标准化不仅要制定统一数据格式，还需保证数据分类与编码的一致性，这样才能确保数据的准确、规范和有效共享。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725514", "t": 3, "q": "大数据技术在水利工程安全监测中，通过分析监测数据可提前发现工程隐患，实现从\"事后维修\"向\"事前预警\"转变。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数据技术能对水利工程安全监测数据进行深度分析，凭借数据挖掘和分析可识别潜在异常与隐患，从而提前预警，让安全管理从“事后维修”转变为“事前预警”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637154360725515", "t": 3, "q": "智慧水利中的边缘计算技术，主要作用是将所有监测数据传输至云中心，提高数据处理的集中性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边缘计算是在靠近数据源的边缘侧处理数据，减少数据传输到云中心的量，而不是将所有监测数据都传至云中心。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K15", "n": "知识点15  智能水电站及运行自动化控制", "qs": [{"id": "2035637176401793024", "t": 1, "q": "智能水电站监控系统中，负责实现机组状态实时采集、本地控制逻辑执行的核心层级是哪个？", "a": ["厂级监控层（SIS）", "现地控制单元层（LCU）", "区域调度层（EMS）", "远程监控中心层", "", ""], "r": "B", "e": "现地控制单元层（LCU）可对机组状态实时采集并执行本地控制逻辑。厂级监控层侧重全厂生产管理等；区域调度层负责电网调度；远程监控中心层进行远程监控。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793025", "t": 1, "q": "在智能水电站的状态监测系统中，针对水轮机主轴摆度监测，下列哪种传感器技术最适合实现高精度、实时连续监测？", "a": ["电阻应变式传感器", "超声波传感器", "电涡流传感器", "压电式传感器", "", ""], "r": "C", "e": "电涡流传感器可非接触测量，能适应水轮机主轴复杂工况，可高精度、实时连续监测主轴摆度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793026", "t": 1, "q": "数字水利技术体系中，\"数字孪生流域\"构建的核心环节是实现物理流域与虚拟流域的哪种特性？", "a": ["静态结构一致", "动态行为同步", "几何尺寸等同", "功能模块对应", "", ""], "r": "B", "e": "“数字孪生流域”核心是反映物理流域真实状态和变化，需物理与虚拟流域动态行为同步。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793027", "t": 1, "q": "智能水电站的PLC（可编程逻辑控制器）控制系统中，下列哪项功能通常需通过高级语言编程实现，而非梯形图编程？", "a": ["机组开关机逻辑控制", "辅助设备连锁保护", "水轮机效率优化计算", "闸门开度信号采集", "", ""], "r": "C", "e": "梯形图编程常用于简单逻辑控制，而高级语言编程更适合复杂的计算任务。水轮机效率优化计算涉及大量数学运算和算法，通常需高级语言编程。机组开关机逻辑、辅助设备连锁保护及闸门开度信号采集用梯形图编程就能实现基本逻辑控制。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793028", "t": 1, "q": "在数字水利的大数据处理流程中，下列哪种技术主要用于解决\"数据孤岛\"问题，实现不同水利业务系统数据的整合？", "a": ["数据清洗技术", "数据挖掘技术", "数据中台技术", "数据可视化技术", "", ""], "r": "C", "e": "数据中台技术能打破不同业务系统数据隔阂，整合分散数据，解决“数据孤岛”问题。而数据清洗是处理数据质量问题，数据挖掘是发现数据模式，数据可视化是直观呈现数据。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793029", "t": 1, "q": "智能水电站的AGC（自动发电控制）系统在接受电网调度指令时，若电网频率低于额定值，系统应采取的核心动作是？", "a": ["降低机组励磁电流", "增加机组有功出力", "减小机组导叶开度", "提高机组转速设定值", "", ""], "r": "B", "e": "电网频率低于额定值，意味着发电功率小于用电负荷功率。要使频率恢复正常，需增加发电功率。增加机组有功出力能提升发电功率，可解决频率低的问题。A选项降低励磁电流主要影响无功功率；C选项减小导叶开度会降低出力；D选项提高转速设定值不能直接解决发电功率不足问题。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793030", "t": 1, "q": "下列哪项技术不属于数字水利中\"感、传、算、用\"体系中的\"算\"环节核心技术？", "a": ["边缘计算", "云计算", "5G通信", "人工智能算法", "", ""], "r": "C", "e": "“算”环节主要涉及数据计算处理技术，边缘计算、云计算、人工智能算法都与数据计算相关。而5G通信属于数据传输技术，是“传”环节的技术。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793031", "t": 1, "q": "智能水电站的状态检修系统中，基于设备运行数据预测故障的\"预测性检修\"，其核心依据是设备的哪种特性？", "a": ["历史故障记录", "实时运行参数偏差", "寿命周期理论", "劣化趋势模型", "", ""], "r": "D", "e": "预测性检修主要是通过建立劣化趋势模型来基于设备运行数据预测故障，劣化趋势模型能反映设备性能随时间的变化，从而提前预判故障。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793032", "t": 1, "q": "在数字孪生水利工程建设中，BIM（建筑信息模型）与GIS（地理信息系统）融合的主要目的是？", "a": ["减少数据存储量", "实现工程细节与流域空间的统一表达", "降低模型构建成本", "简化数据采集流程", "", ""], "r": "B", "e": "BIM侧重工程的细节信息，GIS侧重流域空间地理信息，二者融合可实现工程细节与流域空间的统一表达。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793033", "t": 1, "q": "智能水电站的自动化监控系统中，SCADA（监控与数据采集）系统与现地控制单元（LCU）的通信，下列哪种通信协议更适用于高实时性、高可靠性的控制信号传输？", "a": ["MODBUS-RTU", "OPC UA", "IEC 61850", "TCP/IP", "", ""], "r": "C", "e": "IEC 61850是专门为变电站自动化系统通信设计，强调高实时性和高可靠性，适用于智能水电站自动化监控系统中控制信号传输。MODBUS - RTU多用于工业现场设备通信，实时性稍弱；OPC UA侧重数据集成；TCP/IP是通用网络协议，缺乏针对性。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793034", "t": 1, "q": "下列哪项不属于智能水利中\"智慧决策\"环节的核心应用场景？", "a": ["流域洪水预报调度", "灌溉区用水优化分配", "水利工程施工进度跟踪", "水资源总量动态监测", "", ""], "r": "D", "e": "在智能水利的“智慧决策”环节中，核心应用场景通常涉及对水利系统的实时监控、分析和预测，以便做出及时的决策。我们逐项审视各个选项：A. 流域洪水预报调度 - 这明显涉及到对水利情况的实时分析和预测，是智慧决策的一部分，用于及时应对可能的洪水情况。B. 灌溉区用水优化分配 - 这同样需要基于实时数据和预测来进行决策，以确保水资源的合理分配，也属于智慧决策的应用场景。C. 水利工程施工进度跟踪 - 虽然这更多涉及到项目管理和执行层面，但在智能水利系统中，施工进度的实时跟踪和分析也是智慧决策的一部分，有助于优化资源配置和应对潜在问题。D. 水资源总量动态监测 - 这主要是关于数据的收集和监测，并不直接涉及决策过程。它更多是智慧水利系统的基础数据层，为决策提供支持，但本身并不构成智慧决策的核心应用场景。综上所述，不属于智能水利中“智慧决策”环节的核心应用场景的是D选项：水资源总量动态监测。所以，正确答案是D。", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793035", "t": 1, "q": "数字水利系统中，针对海量水利监测数据（如降雨、水位、流量）的长期存储，下列哪种存储架构最适合？", "a": ["关系型数据库（如MySQL）", "分布式文件系统（如HDFS）", "内存数据库（如Redis）", "时序数据库（如InfluxDB）", "", ""], "r": "D", "e": "水利监测数据具有时间序列特性，时序数据库专门针对时间序列数据存储和处理进行优化，适合长期存储海量的降雨、水位、流量等数据。关系型数据库处理复杂查询和事务好，但存储时序数据效率低；分布式文件系统侧重文件存储，对时间序列数据处理能力弱；内存数据库主要用于缓存，不适合长期存储。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793036", "t": 1, "q": "智能水电站中，水轮机调速系统的\"PID调节\"中，下列哪项参数主要影响系统对偏差的响应速度？", "a": ["比例系数（P）", "积分系数（I）", "微分系数（D）", "积分时间（Ti）", "", ""], "r": "A", "e": "比例系数（P）主要影响系统对偏差的响应速度，增大比例系数可加快系统响应。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793037", "t": 1, "q": "在数字水利的\"智慧水利平台\"建设中，下列哪项技术是实现\"水利工程安全风险动态预警\"的关键前提？", "a": ["三维建模技术", "数据同化技术", "虚拟现实技术", "移动应用技术", "", ""], "r": "B", "e": "数据同化技术能将观测数据与模型模拟结果有效融合，获取更准确的水利信息，为水利工程安全风险动态预警提供准确基础数据，是关键前提。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793038", "t": 1, "q": "智能水电站的机组振动监测系统中，下列哪种振动信号的分析方法最适合识别机组的\"分频振动\"故障（如不对中、松动）？", "a": ["时域波形分析", "频谱分析（FFT）", "小波变换分析", "趋势分析", "", ""], "r": "B", "e": "频谱分析（FFT）可将时域信号转换为频域信号，清晰呈现不同频率成分，能有效识别分频振动故障。时域波形分析主要看信号随时间变化，难直接识别分频；小波变换分析多用于非平稳信号局部特征分析；趋势分析关注信号长期变化趋势。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793039", "t": 1, "q": "数字水利中，\"遥感技术\"在流域水资源管理中的主要应用不包括下列哪项？", "a": ["流域植被覆盖度监测", "水库蓄水量估算", "地下水水位动态监测", "流域降雨量空间分布反演", "", ""], "r": "C", "e": "遥感主要是对地表及近地表情况进行监测。地下水水位动态监测难以通过遥感技术实现，因为遥感不易穿透到地下获取相关信息。而流域植被覆盖度、水库蓄水量、流域降雨量空间分布都可通过遥感技术监测。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793040", "t": 1, "q": "智能水电站的\"无人值班、少人值守\"模式中，下列哪项系统功能是实现\"无人值班\"的核心保障？", "a": ["机组运行参数实时显示", "设备故障自动诊断与隔离", "历史数据查询统计", "远程视频监控", "", ""], "r": "B", "e": "实现“无人值班”需保障设备故障能及时处理，避免影响电站运行。设备故障自动诊断与隔离可自动识别故障并隔离，保障电站安全稳定运行，是核心保障。其他选项虽有作用但并非核心。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793041", "t": 1, "q": "在数字孪生水电站的模型验证中，下列哪种验证方式主要用于检验模型对\"极端工况\"（如机组甩负荷）的响应准确性？", "a": ["静态对比验证（如几何尺寸比对）", "动态一致性验证（如正常工况参数比对）", "工况推演验证（如模拟极端工况）", "历史数据回溯验证（如重现历史运行过程）", "", ""], "r": "C", "e": "要检验模型对“极端工况”响应准确性，需模拟极端工况来验证。A项静态对比验证针对几何尺寸等静态内容；B项动态一致性验证是正常工况参数比对；D项历史数据回溯验证是重现历史运行过程，均不符合检验极端工况要求。C项工况推演验证可模拟极端工况。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793042", "t": 1, "q": "智能水利中的\"物联网（IoT）\"感知层，下列哪种传感器不适合用于水利工程的渗压监测（如大坝渗压）？", "a": ["振弦式渗压计", "压阻式渗压计", "超声波液位计", "差压式渗压计", "", ""], "r": "C", "e": "振弦式、压阻式、差压式渗压计都可直接用于渗压监测，而超声波液位计主要测液位高度，并非直接用于渗压监测。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793043", "t": 1, "q": "智能水电站的励磁调节系统中，当电网电压低于额定值时，系统应采取的核心措施是？", "a": ["增加励磁电流，提高发电机端电压", "减少励磁电流，降低发电机无功出力", "增加有功出力，维持电压稳定", "减小导叶开度，降低机组转速", "", ""], "r": "A", "e": "当电网电压低于额定值，需提升电压。增加励磁电流可增强发电机磁场，进而提高发电机端电压。B选项减少励磁电流会使电压更低；C选项增加有功出力主要影响功率，对提升电压不是核心措施；D选项减小导叶开度降低转速与提升电压无关。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793044", "t": 1, "q": "数字水利的\"大数据分析\"在洪水预报中，相比传统水文模型，其主要优势是？", "a": ["无需水文站监测数据", "可融合多源数据（如气象、遥感、水文）提高预报精度", "计算速度更慢但结果更准确", "仅适用于小流域洪水预报", "", ""], "r": "B", "e": "传统水文模型数据来源较单一，大数据分析能融合气象、遥感、水文等多源数据，可提高洪水预报精度。A选项大数据分析也需要水文站监测数据；C选项大数据分析计算速度快；D选项大数据分析并非仅适用于小流域。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793045", "t": 1, "q": "智能水电站中，下列哪项设备不属于\"现地控制单元（LCU）\"的直接控制对象？", "a": ["水轮机导叶接力器", "发电机出口断路器", "电网调度中心的监控终端", "机组冷却系统水泵", "", ""], "r": "C", "e": "现地控制单元（LCU）主要对水电站现场设备进行直接控制，水轮机导叶接力器、发电机出口断路器、机组冷却系统水泵都属于现场设备。而电网调度中心的监控终端在调度中心，不是LCU直接控制对象。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793046", "t": 1, "q": "在数字水利的\"智慧灌溉\"系统中，下列哪项技术是实现\"按需灌溉\"的核心依据？", "a": ["灌溉管网压力监测", "土壤墒情监测", "灌溉水泵功率监测", "作物生长阶段识别", "", ""], "r": "B", "e": "按需灌溉关键在于了解土壤水分状况，土壤墒情监测能直接反映土壤的含水情况，是决定是否需要灌溉以及灌溉量的核心依据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637176401793047", "t": 1, "q": "智能水电站的\"状态评价\"系统中，对机组健康状态的评价，下列哪项指标不属于\"动态评价指标\"（随运行状态变化）？", "a": ["水轮机振动幅值", "发电机定子绕组温度", "机组累计运行时间", "导叶接力器行程偏差", "", ""], "r": "C", "e": "动态评价指标随运行状态变化，机组累计运行时间是持续累加的，不随当前运行状态实时改变，而水轮机振动幅值、发电机定子绕组温度、导叶接力器行程偏差都会随运行状态变化。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637183888625664", "t": 2, "q": "智能水电站的运行自动化控制系统中，属于\"过程控制级\"的核心设备有哪些？（　）", "a": ["现地控制单元（LCU）", "机组调速器", "励磁调节器", "厂级监控计算机", "远程调度终端", ""], "r": "ABC", "e": "答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637183888625665", "t": 2, "q": "数字水利技术体系中，属于\"数据处理与分析层\"的关键技术有哪些？（　）", "a": ["大数据分析技术", "机器学习算法", "物联网通信技术", "数值模拟技术", "传感器技术", ""], "r": "ABD", "e": "数据处理与分析层主要是对数据进行处理和分析，大数据分析技术用于处理大量数据，机器学习算法可对数据进行分析挖掘，数值模拟技术能模拟水利系统状态进行分析。物联网通信技术和传感器技术主要用于数据采集与传输。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637183888625666", "t": 2, "q": "智能水电站中，机组状态监测系统需要采集的关键运行参数有哪些？（　）", "a": ["机组转速", "定子绕组温度", "导叶开度", "流域降水量", "励磁电流", ""], "r": "ABCE", "e": "机组状态监测系统主要监测机组自身运行状况，A机组转速、B定子绕组温度、C导叶开度、E励磁电流都与机组运行密切相关；而D流域降水量与机组运行参数无关。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637183888625667", "t": 2, "q": "数字水利在水资源优化配置中的应用，主要依赖于以下哪些技术支撑？（　）", "a": ["地理信息系统（GIS）", "水资源承载力评估模型", "无线传感器网络（WSN）", "建筑信息模型（BIM）", "用水需求预测模型", ""], "r": "ABCE", "e": "数字水利水资源优化配置需掌握地理信息、监测数据、评估水资源承载、预测用水需求。GIS可提供地理信息，WSN用于数据监测，水资源承载力评估模型能了解承载情况，用水需求预测模型可预测需求。而BIM主要用于建筑领域。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777664", "t": 3, "q": "智能水电站的现地控制单元（LCU）可独立完成机组的启停控制，无需依赖厂级监控层的指令。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "现地控制单元（LCU）具备一定独立性，能独立完成机组的基本启停控制等功能，不依赖厂级监控层指令也可实现。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777665", "t": 3, "q": "数字水利中，GIS技术的空间分辨率越高，对流域水土流失监测的精度就一定越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然GIS技术空间分辨率高在一定程度上有助于提高流域水土流失监测精度，但监测精度还受数据质量、模型算法、人为因素等多种因素影响，并非空间分辨率越高精度就一定越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777666", "t": 3, "q": "智能水电站的机组振动监测系统中，振动信号的频率越高，说明机组存在故障的风险越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "振动信号频率高低与机组是否存在故障及故障风险大小没有必然的直接联系，不能单纯依据频率高就判定故障风险大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777669", "t": 3, "q": "数字水利中，物联网感知层的传感器数量越多，水资源监测系统的监测精度就越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "传感器数量只是影响水资源监测系统监测精度的一个因素，并非数量越多精度就越高，还受传感器质量、布局合理性、数据处理能力等多种因素影响。", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777670", "t": 3, "q": "智能水电站的计算机监控系统采用双机热备配置时，备用机实时接收主机数据并同步更新，主机故障后可无缝切换。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "双机热备配置中，备用机确实会实时接收主机数据并同步更新，当主机故障，能实现无缝切换以保障系统持续运行。", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777671", "t": 3, "q": "数字水利中，大数据分析技术可完全替代传统的水文模型进行径流预测。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据分析技术有其优势，但传统水文模型有自身的理论基础和适用场景，二者各有优劣，不能完全替代。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777672", "t": 3, "q": "智能水电站的机组调速器在功率控制模式下，若电网频率发生波动，调速器会自动切换至转速控制模式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智能水电站机组调速器在功率控制模式下，当电网频率波动时，通常会按照功率控制要求维持功率稳定，而非自动切换至转速控制模式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777673", "t": 3, "q": "数字水利中，BIM技术可实现水利工程从设计、施工到运维的全生命周期信息集成管理。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "BIM技术具有强大的数据集成和管理能力，能将水利工程全生命周期各阶段的信息整合，实现从设计、施工到运维的信息集成管理。", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777674", "t": 3, "q": "智能水电站的机组状态检修系统中，设备的剩余寿命预测仅依赖于设备的运行时间。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设备剩余寿命预测受多种因素影响，不只是运行时间，还包括设备质量、运行工况、维护情况等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777675", "t": 3, "q": "数字水利的水资源调度系统中，水资源承载力评估结果是制定调度方案的唯一依据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "制定水资源调度方案需综合考虑多方面因素，水资源承载力评估结果只是其中重要因素之一，并非唯一依据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777676", "t": 3, "q": "智能水电站中，IEC 61850协议可实现不同厂家的励磁系统与计算机监控系统之间的直接数据通信。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "IEC 61850是用于变电站自动化系统的通信标准，能实现不同厂家设备间互操作和数据通信，在智能水电站里也可让不同厂家的励磁系统和计算机监控系统直接通信。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637185985777677", "t": 3, "q": "数字水利中，遥感技术可直接测量流域内的水资源总量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "遥感技术主要是获取地表的影像、光谱等信息，虽能为水资源监测提供数据支持，但不能直接测量流域内水资源总量，它需结合其他方法和数据进行估算。所以答案为错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K16", "n": "知识点16  水利系统模拟", "qs": [{"id": "2035637215190716416", "t": 1, "q": "在智慧水利建设中，数字孪生流域构建过程中用于实现物理流域与数字流域动态交互反馈的核心技术是以下哪一项？", "a": ["遥感数据采集技术", "边缘计算与实时通信技术", "水利GIS地图绘制技术", "历史水文数据存储技术", "", ""], "r": "B", "e": "实现物理流域与数字流域动态交互反馈需保证数据实时处理和传输，边缘计算与实时通信技术可满足此需求。而遥感数据采集技术主要是获取数据；水利GIS地图绘制技术用于地图绘制；历史水文数据存储技术用于数据保存，均非实现动态交互反馈的核心。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716417", "t": 1, "q": "某水利工程采用数字水利技术进行洪水预报，其使用的分布式水文模型中，用于描述流域下垫面空间异质性（如土壤类型、植被覆盖差异）对产流影响的关键参数是？", "a": ["流域平均坡度", "土壤饱和导水率", "流域总面积", "河道糙率", "", ""], "r": "B", "e": "土壤饱和导水率能体现不同土壤类型、植被覆盖下水分渗透能力，可描述流域下垫面空间异质性对产流的影响。而流域平均坡度、流域总面积主要与地形规模相关，河道糙率主要影响水流在河道中的传播。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716418", "t": 1, "q": "智慧水利中的\"四预\"（预报、预警、预演、预案）体系中，依赖水利系统模拟技术实现\"预演\"功能的核心逻辑是？", "a": ["基于历史数据统计分析未来洪水发生概率", "通过调整模型输入参数模拟不同情景下流域响应", "实时采集水位数据触发预警阈值", "根据法规文件生成标准化应急处置流程", "", ""], "r": "B", "e": "“预演”需模拟不同情景，B选项通过调整模型输入参数模拟不同情景下流域响应符合预演核心逻辑。A是概率分析非模拟；C是预警功能；D是预案方面。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716419", "t": 1, "q": "在水利系统模拟中，针对平原河网地区的水动力模拟，下列哪种模型更适合处理复杂河网交汇、闸泵群联合调度对水流状态的影响？", "a": ["一维圣维南方程组模型", "二维浅水方程模型", "三维水动力模型", "经验公式法模型", "", ""], "r": "A", "e": "一维圣维南方程组模型适用于模拟复杂河网水流，能较好处理河网交汇、闸泵群调度对水流状态影响；二维、三维模型更侧重复杂地形和水流细节，在此问题上并非最合适；经验公式法模型精度低，不适合此类复杂模拟。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716420", "t": 1, "q": "数字水利技术中，用于实现水利工程设施（如大坝、闸门）全生命周期健康监测与评估的核心数据融合技术是？", "a": ["数据清洗技术", "多源异构数据融合技术", "数据压缩技术", "数据加密技术", "", ""], "r": "B", "e": "水利工程设施全生命周期健康监测与评估会涉及多种来源、不同结构的数据，多源异构数据融合技术可将这些数据整合处理，为监测评估提供全面准确的数据支持，所以是核心技术。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716421", "t": 1, "q": "在智慧水利平台的数据分析模块中，采用机器学习算法进行水利工程故障诊断时，模型训练的关键前提是具备以下哪类数据？", "a": ["大量标注故障类型与对应特征的历史数据", "实时采集的工程运行实时数据", "工程设计阶段的图纸参数数据", "流域水文气象的实时观测数据", "", ""], "r": "A", "e": "机器学习算法训练模型需有足够且合适的数据，标注故障类型与对应特征的历史数据能让模型学习故障模式和特征，是模型训练关键前提。实时运行数据、设计图纸参数数据、水文气象观测数据虽对水利工程重要，但不是模型训练关键前提。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716422", "t": 1, "q": "水利系统模拟中，对水库防洪调度进行模拟时，若需考虑水库下游防洪保护区的淹没风险，模型需额外耦合的模块是？", "a": ["水库水位-库容曲线计算模块", "下游河道水位-流量关系模块", "下游区域淹没范围计算模块", "水库泄洪能力计算模块", "", ""], "r": "C", "e": "要考虑水库下游防洪保护区的淹没风险，核心是明确淹没范围，所以需额外耦合下游区域淹没范围计算模块。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716423", "t": 1, "q": "数字孪生水利工程中，用于将物理工程的实体参数（如大坝尺寸、闸门位置）转化为数字模型几何参数的关键技术是？", "a": ["物联网传感器技术", "三维激光扫描与BIM建模技术", "大数据分析技术", "云计算技术", "", ""], "r": "B", "e": "三维激光扫描可获取物理工程实体精确数据，BIM建模技术能将这些数据转化为数字模型几何参数。物联网传感器主要用于数据实时采集；大数据分析用于数据处理分析；云计算提供计算资源。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716424", "t": 1, "q": "在智慧水利的水资源优化配置模拟中，当考虑跨流域调水工程对受水区地下水补给的影响时，模型需优先考虑的水文过程是？", "a": ["受水区河道蒸发过程", "受水区土壤入渗与地下水补给过程", "受水区地表径流过程", "调水工程的输水损失过程", "", ""], "r": "B", "e": "本题重点是考虑跨流域调水工程对受水区地下水补给的影响，关键在于明确与地下水补给直接相关的水文过程。 A选项：受水区河道蒸发过程主要影响的是河道水量，与地下水补给没有直接关联。 B选项：土壤入渗是地表水转化为地下水的关键环节，直接影响地下水补给，所以在考虑对受水区地下水补给的影响时，该过程需优先考虑。 C选项：地表径流过程主要涉及水在地表的流动，与地下水补给的直接联系不紧密。 D选项：调水工程的输水损失过程主要影响调水的水量，并非是直接影响受水区地下水补给的关键水文过程。综上，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716425", "t": 1, "q": "水利系统模拟中，采用水文-水动力耦合模型进行流域洪水模拟时，两者的耦合节点通常是？", "a": ["流域产流总量数据", "流域蒸发量数据", "河道起点的流量数据", "流域土壤含水量数据", "", ""], "r": "C", "e": "水文 - 水动力耦合模型里，耦合节点需连接水文模型和水动力模型，河道起点的流量数据既能承接水文模型的产汇流结果，又能作为水动力模型的输入，适合作为耦合节点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716426", "t": 1, "q": "数字水利技术中，用于解决水利监测数据（如水位、流量）在传输过程中因网络延迟导致的时间同步问题的技术是？", "a": ["数据重传技术", "时间戳与时钟同步协议（如NTP）", "数据缓存技术", "数据压缩技术", "", ""], "r": "B", "e": "时间戳与时钟同步协议（如NTP）可实现设备间时间同步，能解决水利监测数据传输中因网络延迟造成的时间同步问题。数据重传主要解决数据丢失问题；数据缓存用于临时存储数据；数据压缩是为减少数据量。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716427", "t": 1, "q": "智慧水利中，基于数字孪生技术的大坝安全预警系统，当监测到大坝位移数据超出阈值时，系统首先触发的\"四预\"环节是？", "a": ["预报", "预警", "预演", "预案", "", ""], "r": "B", "e": "“四预”中，监测到数据超出阈值首先要做的是发出警示，即预警，提醒相关人员关注异常情况。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716428", "t": 1, "q": "在水利系统的水资源承载能力模拟中，模型需考虑的约束条件不包括以下哪一项？", "a": ["流域水资源总量", "生态基流最小要求", "工业用水的价格", "农业灌溉用水效率", "", ""], "r": "C", "e": "水资源承载能力模拟主要关注水资源量、生态需求及用水效率等与水资源本身相关的约束。工业用水价格主要影响的是经济层面，并非水资源承载能力模拟需考虑的约束条件。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716429", "t": 1, "q": "数字水利建设中，用于实现水利数据（如水文、工程、环境数据）统一管理与共享的核心平台是？", "a": ["水利物联网平台", "水利数据中台", "水利云计算平台", "水利可视化平台", "", ""], "r": "B", "e": "水利数据中台能对各类水利数据进行整合、管理与共享，符合实现水利数据统一管理与共享的要求。而水利物联网平台侧重数据采集传输；水利云计算平台主要提供计算资源；水利可视化平台用于数据直观展示。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716430", "t": 1, "q": "水利系统模拟中，对河道泥沙输运进行模拟时，用于描述泥沙颗粒在水流中悬浮与沉降平衡的关键方程是？", "a": ["曼宁公式", "舍齐公式", "悬移质平衡方程", "水流连续方程", "", ""], "r": "C", "e": "悬移质平衡方程用于描述泥沙颗粒在水流中悬浮与沉降的平衡。曼宁公式和舍齐公式主要用于计算水流流速，水流连续方程反映水流质量守恒。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716431", "t": 1, "q": "智慧水利中的无人机巡检技术，用于识别水利工程（如堤防）表面裂缝时，依赖的核心图像处理技术是？", "a": ["图像灰度化处理技术", "图像边缘检测与特征匹配技术", "图像压缩技术", "图像降噪技术", "", ""], "r": "B", "e": "识别水利工程表面裂缝，关键是要找出裂缝的边缘特征并与已知裂缝特征匹配，所以依赖图像边缘检测与特征匹配技术。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716432", "t": 1, "q": "在数字孪生流域的洪水模拟中，若需提高模拟结果的空间分辨率（如精细到村域尺度），需优先优化的模型输入数据是？", "a": ["流域平均降水量数据", "高分辨率数字高程模型（DEM）数据", "流域多年平均径流深数据", "河道平均糙率数据", "", ""], "r": "B", "e": "提高洪水模拟空间分辨率到村域尺度，高分辨率数字高程模型（DEM）能更精准反映地形地貌，对模拟结果影响关键；而流域平均降水量、多年平均径流深、河道平均糙率数据对空间精细度提升作用不如DEM。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716433", "t": 1, "q": "水利系统模拟中，采用系统动力学模型分析流域水资源供需矛盾时，模型的核心结构是？", "a": ["由多个反馈回路（如用水需求-供水能力反馈）构成的因果关系网络", "基于物理定律的水流运动方程", "基于历史数据的统计回归公式", "由多个线性方程组构成的数学模型", "", ""], "r": "A", "e": "系统动力学着重研究系统内部各要素间的因果反馈关系。分析流域水资源供需矛盾时，核心就是由多个反馈回路构成的因果关系网络。B选项基于物理定律的水流运动方程常用于水力学等模型；C选项统计回归公式主要用于基于数据的预测等；D选项多个线性方程组构成的数学模型并非系统动力学核心结构。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716434", "t": 1, "q": "数字水利技术中，用于对水利工程建设过程中的进度、质量、安全数据进行实时监管的核心应用是？", "a": ["水利工程BIM施工管理平台", "水文站网监测平台", "水资源调度平台", "洪水预警平台", "", ""], "r": "A", "e": "水利工程BIM施工管理平台可对水利工程建设过程中的进度、质量、安全数据实时监管；水文站网监测平台侧重水文数据监测；水资源调度平台用于水资源调配；洪水预警平台主要是洪水预警。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716435", "t": 1, "q": "在智慧水利的水质模拟中，用于描述污染物在水体中随水流扩散、降解过程的核心模型是？", "a": ["水文产流模型", "水质迁移扩散模型", "水动力模型", "泥沙输运模型", "", ""], "r": "B", "e": "题干强调描述污染物在水体中随水流扩散、降解过程，水质迁移扩散模型能体现污染物迁移和扩散等情况，符合要求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716436", "t": 1, "q": "水利系统模拟中，对灌溉区的灌溉制度优化模拟时，模型需重点考虑的农业生产参数是？", "a": ["作物生育期内的需水量变化", "作物种植面积", "土壤类型", "灌溉水源的水位", "", ""], "r": "A", "e": "灌溉制度优化主要是为合理供水满足作物需水，作物生育期内需水量变化是核心考量，能据此制定合适灌溉计划。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716437", "t": 1, "q": "数字孪生水利中，用于实现数字模型与物理工程之间\"双向映射\"的关键技术支撑是？", "a": ["大数据存储技术", "实时数据传输与模型参数动态更新技术", "数据可视化技术", "模型结果校验技术", "", ""], "r": "B", "e": "要实现数字模型与物理工程“双向映射”，需实时传输物理工程数据到数字模型并动态更新参数，同时将数字模型结果反馈给物理工程，B选项符合要求。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637215190716438", "t": 1, "q": "在智慧水利的防洪调度模拟中，当水库与下游堤防联合调度时，模型需优先确保的约束条件是？", "a": ["水库的最大蓄水量", "下游堤防的设计防洪标准", "水库的最小泄洪流量", "下游河道的最大输沙能力", "", ""], "r": "B", "e": "在水库与下游堤防联合调度时，首要保障下游安全，所以需优先保证下游堤防在设计防洪标准内，避免洪水对下游造成危害。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637215194910720", "t": 1, "q": "数字水利技术中，用于处理水利监测数据中存在的异常值（如传感器故障导致的突变数据）的关键数据预处理技术是？", "a": ["数据插值技术", "数据标准化技术", "异常值检测与修复技术", "数据归一化技术", "", ""], "r": "C", "e": "题目问处理水利监测异常值的关键技术，那自然是能进行异常值检测与修复的技术。A选项数据插值是估算缺失值；B选项数据标准化是使数据符合特定标准；D选项数据归一化是将数据缩放到特定范围。所以答案选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637216927158272", "t": 2, "q": "水利系统模拟中，影响水库调度模拟结果准确性的关键因素有哪些（　）？", "a": ["水库入库流量预报精度", "水库兴利库容与防洪库容划分", "用水户需水预测精度", "调度规则的合理性", "模拟软件的开发公司", ""], "r": "ABCD", "e": "影响水库调度模拟结果准确性，主要和实际调度的关键要素及规则合理性有关。入库流量、用水户需水是调度基础，预报和预测精度很重要；合理的调度规则是核心；兴利与防洪库容划分也影响调度决策。而模拟软件开发公司与结果准确性无直接关联。所以答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637216927158273", "t": 2, "q": "数字孪生水利流域建设中，需要整合的多源数据包括下列哪些（　）？", "a": ["流域水文气象监测数据（降水、径流、气温）", "水利工程设计与运维数据（结构、参数、故障记录）", "流域社会经济数据（人口、GDP、用水需求）", "流域地形地貌数据（DEM、土地利用）", "全球卫星导航系统（GNSS）定位数据", ""], "r": "ABCD", "e": "数字孪生水利流域建设旨在通过集成多种数据源，创建一个虚拟的水利流域模型，以实现对真实流域的精准模拟和预测。在这一过程中，确实需要整合多源数据。A项提到的流域水文气象监测数据是基础且关键的信息，它能反映流域的水文状况和气候变化，对模拟流域行为至关重要。B项的水利工程设计与运维数据对于理解和模拟水利工程的运行状态、优化运维策略具有重要意义。C项中的流域社会经济数据同样不容忽视，因为它能反映人类活动对流域的影响，是评估流域管理效果的重要依据。D项的流域地形地貌数据是构建数字孪生模型的基础地理信息，对于模拟流域的水文过程、洪水传播等具有关键作用。而E项提到的全球卫星导航系统（GNSS）定位数据，在数字孪生水利流域建设中并非必须整合的数据源。虽然GNSS定位数据在某些应用场景中有其价值，但它不是构建数字孪生模型所必需的多源数据之一。因此，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637216927158274", "t": 2, "q": "水利系统不确定性分析中，蒙特卡罗模拟法的实施步骤包括下列哪些（　）？", "a": ["确定各不确定性参数的概率分布类型", "对各参数进行随机抽样", "代入模型进行多次模拟计算", "统计分析模拟结果的概率分布", "直接采用确定性参数进行计算", ""], "r": "ABCD", "e": "蒙特卡罗模拟法针对不确定性问题，需先确定不确定性参数概率分布类型，再抽样，代入模型多次模拟，最后统计分析结果概率分布。选项E直接用确定性参数计算与不确定性分析及蒙特卡罗模拟法不符。所以答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637216927158275", "t": 2, "q": "数字水利中，BIM技术在水利工程施工阶段的应用包括下列哪些（　）？", "a": ["施工进度4D模拟（3D模型+时间）", "施工方案优化（如浇筑顺序、吊装路径）", "施工质量数字化验收（如尺寸偏差检测）", "施工安全风险预警（如碰撞检测）", "工程竣工图纸绘制（二维图纸）", ""], "r": "ABCD", "e": "BIM技术在水利工程施工阶段可进行施工进度4D模拟、优化施工方案、实现施工质量数字化验收、进行施工安全风险预警等。竣工图纸绘制并非施工阶段主要应用。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802688", "t": 3, "q": "水利系统模拟中，分布式水文模型的模拟精度一定高于集总式水文模型。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分布式和集总式水文模型各有适用场景，模拟精度受多种因素影响，不能简单判定分布式水文模型模拟精度一定高于集总式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802689", "t": 3, "q": "数字孪生水利工程的虚拟模型需要与物理实体的每一个细节完全一致才能保证模拟准确性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生水利工程的虚拟模型不需要与物理实体每一个细节完全一致，只需保证关键特征、参数等一致以满足模拟需求即可。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802690", "t": 3, "q": "水利系统模拟中，模型率定完成后，参数无需再调整，可直接用于不同情景模拟。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不同情景下的边界条件、初始条件等可能不同，已率定的参数不一定适用于所有情景，可能需要根据新情景对参数进行调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802691", "t": 3, "q": "智慧水利平台中的数据可视化功能仅用于展示数据，对水利决策无实际支持作用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。智慧水利平台的数据可视化功能，不仅能直观呈现数据，还能通过清晰展示数据特征和规律，帮助决策者快速理解复杂水利信息，为水利决策提供有力依据和支持。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802692", "t": 3, "q": "水利工程数字孪生模型的动态更新频率越高，模拟结果的准确性越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "动态更新频率并非越高模拟结果准确性就越高，更新频率要综合考虑数据获取难度、成本、模型计算能力等多因素，过高频率更新可能带来数据噪声、计算负担等问题影响准确性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802693", "t": 3, "q": "蒙特卡罗模拟法通过大量随机抽样模拟不确定性，抽样次数越多，模拟结果的统计精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "蒙特卡罗模拟法就是利用大量随机抽样来模拟不确定性，依据大数定律，抽样次数越多越能逼近真实情况，统计精度也就越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802694", "t": 3, "q": "BIM技术在水利工程中的应用仅局限于混凝土建筑物，不适用于土坝、堤防等土石结构工程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BIM技术可应用于各类水利工程，并非仅局限于混凝土建筑物，土坝、堤防等土石结构工程也能运用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802695", "t": 3, "q": "水利系统模拟中，河道糙率值越大，水流在河道中的传播速度越慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "糙率反映了河槽边界对水流的阻力作用，糙率值越大，意味着水流受到的阻力越大，阻碍作用增强，水流在河道中的传播速度就会越慢。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802696", "t": 3, "q": "数字水利中的物联网（IoT）设备必须依赖4G/5G网络传输数据，无法在无网络覆盖区域使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网设备并非只能依赖4G/5G网络传输数据，还有如卫星通信、LoRa等其他通信方式，可在无4G/5G网络覆盖区域使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802697", "t": 3, "q": "水资源系统优化模拟的目标函数只能是单一目标（如发电量最大化），无法实现多目标优化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水资源系统优化模拟可以实现多目标优化，并非只能是单一目标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802698", "t": 3, "q": "水利系统模拟中，模型验证与模型率定使用的是同一组实测数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "模型率定是用实测数据调整模型参数，模型验证是用另一组独立实测数据检验模型可靠性，二者用的不是同一组实测数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637219250802699", "t": 3, "q": "数字孪生流域中的多尺度模拟可同时模拟流域尺度的水文过程和河段尺度的水力过程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数字孪生流域具备多尺度模拟能力，能够对不同尺度的过程进行模拟，其中就包含流域尺度的水文过程和河段尺度的水力过程。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K17", "n": "知识点17  传感器技术与数据采集、智能监控系统应用", "qs": [{"id": "2035637259876831232", "t": 1, "q": "在水利水电工程数字孪生系统构建中，用于实现物理实体与虚拟模型实时数据交互、动态修正模型误差的关键技术是", "a": ["三维建模技术", "数据同化技术", "仿真计算技术", "数据存储技术", "", ""], "r": "B", "e": "数据同化技术可融合多源数据，实现物理实体与虚拟模型实时数据交互，还能动态修正模型误差；三维建模技术主要用于构建虚拟模型；仿真计算技术侧重于模拟系统运行；数据存储技术是存储数据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831233", "t": 1, "q": "某水利水电工程需监测大坝坝体内部的微小应变，要求传感器在潮湿、振动环境下长期稳定工作，以下最适用的传感器类型是", "a": ["电阻应变式传感器", "压电式传感器", "电容式传感器", "电感式传感器", "", ""], "r": "A", "e": "电阻应变式传感器精度高、线性好，能适应潮湿、振动环境长期稳定工作，适合监测微小应变。压电式不适合静态测量；电容式易受湿度等影响；电感式对环境要求高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831234", "t": 1, "q": "在智慧水利系统中，用于实时监测水库水温分层现象并能长期稳定工作在水下20米深度的传感器，最适合的类型是以下哪一种？", "a": ["普通热电偶传感器", "投入式光纤光栅温度传感器", "接触式铂电阻传感器", "红外非接触式温度传感器", "", ""], "r": "B", "e": "水下20米需传感器能长期稳定在水下工作，投入式光纤光栅温度传感器抗干扰能力强、可适应水下环境且能实现长期监测。普通热电偶传感器精度和稳定性在水下欠佳；接触式铂电阻传感器易受水下复杂环境影响；红外非接触式温度传感器在水下无法正常使用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831237", "t": 1, "q": "在水利工程数字孪生建模过程中，为实现\"物理实体-虚拟模型-数据交互\"的闭环控制，关键需要解决的技术问题是？", "a": ["模型的几何形状精确匹配", "物理参数与虚拟模型的动态映射", "模型的可视化渲染效果", "模型的存储容量优化", "", ""], "r": "B", "e": "要实现“物理实体 - 虚拟模型 - 数据交互”闭环控制，核心是让物理参数能与虚拟模型动态关联，这样才能根据物理实体的变化实时调整虚拟模型，实现闭环。A选项几何形状匹配不是闭环控制关键；C选项可视化渲染效果主要用于展示；D选项存储容量优化和闭环控制关系不大。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831238", "t": 1, "q": "用于水利水电工程溢洪道流量实时监测的传感器，在面对高流速、含沙量大于50kg/m³的水流时，以下哪种传感器的测量精度受影响最小？", "a": ["超声波多普勒流速仪", "电磁流量计", "压差式流量计", "转子式流速仪", "", ""], "r": "A", "e": "在水利水电工程溢洪道流量实时监测中，面对高流速和含沙量较大的水流，不同类型的传感器受影响的程度不同。超声波多普勒流速仪通过测量超声波在水流中的多普勒频移来确定流速，这种方式不直接接触水流，因此受含沙量影响较小，且能够适应高流速环境。电磁流量计适用于导电流体，但在高含沙量情况下，沙粒可能导致电极磨损或沉积，影响测量精度。压差式流量计依赖于流体通过节流装置产生的压差来测量流量，在高流速和含沙量大的情况下，压差信号可能受到干扰，影响精度。转子式流速仪通过测量转子的旋转速度来确定流速，但在高流速和含沙量大的环境中，转子可能受到沙粒的冲击和磨损，影响测量精度。综合以上分析，超声波多普勒流速仪在面对高流速、含沙量大于50kg/m³的水流时，测量精度受影响最小。所以，正确答案是A.超声波多普勒流速仪。", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831239", "t": 1, "q": "智慧水利中的\"四预\"（预报、预警、预演、预案）功能实现时，其核心驱动技术是以下哪一项？", "a": ["大数据统计分析技术", "数值模拟与人工智能耦合技术", "遥感影像处理技术", "地理信息系统（GIS）空间分析技术", "", ""], "r": "B", "e": "“四预”功能需对水利系统进行精准模拟和智能决策，数值模拟与人工智能耦合技术能结合二者优势，为“四预”提供核心驱动。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831240", "t": 1, "q": "某水电站智能监控系统在进行机组振动监测时，采用的振动传感器输出信号为4-20mA电流信号，若要将其转换为数字信号并传输至监控中心，中间必须经过的设备是？", "a": ["信号隔离器", "模数转换器（ADC）", "数据采集终端（RTU）", "网关设备", "", ""], "r": "B", "e": "将4 - 20mA电流模拟信号转换为数字信号，需要模数转换器（ADC）来完成这一转换。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831241", "t": 1, "q": "在数字水利技术中，对水利工程建设与运行过程中的时空数据进行管理，并能实现多维度空间分析的技术工具是？", "a": ["数据库管理系统（DBMS）", "数字高程模型（DEM）", "地理信息系统（GIS）", "建筑信息模型（BIM）", "", ""], "r": "C", "e": "GIS可对时空数据管理，具备多维度空间分析能力，适用于水利工程。DBMS主要是管理数据；DEM侧重于地形建模；BIM主要用于建筑全生命周期管理。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831242", "t": 1, "q": "水利水电工程中，智能监控系统对闸门启闭机的控制采用\"远程控制+本地紧急控制\"双模式，当远程控制失效时，本地紧急控制能立即接管的关键技术是？", "a": ["控制信号的优先级设置", "双电源供电保障", "控制模块的热备份机制", "通信链路的冗余设计", "", ""], "r": "C", "e": "这个问题涉及到水利水电工程中智能监控系统对闸门启闭机的控制模式。关键在于理解“远程控制+本地紧急控制”双模式的工作原理，以及哪种技术能确保在远程控制失效时，本地紧急控制能立即接管。A. 控制信号的优先级设置：虽然优先级设置可以决定哪个控制信号优先被执行，但它本身并不直接确保在远程控制失效时本地控制能立即接管。B. 双电源供电保障：这确保了系统不会因为电源问题而停止工作，但它不直接解决远程控制和本地控制之间的切换问题。C. 控制模块的热备份机制：热备份机制意味着有一个或多个备用控制模块，在主控制模块失效时能立即接管工作。这正好符合题目中“本地紧急控制能立即接管”的要求。D. 通信链路的冗余设计：这确保了通信链路的可靠性，但并不直接解决控制模式的切换问题。综上所述，控制模块的热备份机制是确保在远程控制失效时，本地紧急控制能立即接管的关键技术。所以，正确答案是C.控制模块的热备份机制。", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831243", "t": 1, "q": "用于监测水利渠道渗漏量的传感器，在渠道边坡土壤含水率变化范围为15%-45%的场景下，最适合的测量原理是？", "a": ["时域反射法（TDR）", "频域反射法（FDR）", "中子散射法", "电容法", "", ""], "r": "B", "e": "这道题目考察的是对于不同土壤湿度测量原理的理解和应用场景。在渠道边坡土壤含水率变化范围为15%-45%的场景下，我们需要选择一种既能准确测量又适应这个湿度范围的传感器原理。A. 时域反射法（TDR）：这种方法通过发送电磁波并测量其在土壤中的反射时间来计算土壤湿度。它适用于多种土壤类型，但在极高或极低湿度条件下可能准确性受限。B. 频域反射法（FDR）：与TDR相似，但测量的是电磁波在土壤中的频率变化。FDR通常具有较高的精度，并且在较宽的湿度范围内表现良好，特别适用于15%-45%的含水率范围。C. 中子散射法：这种方法通过测量中子与土壤中的氢原子相互作用来估算湿度。虽然精确，但设备昂贵且操作复杂，不太适合广泛应用。D. 电容法：电容传感器通过测量土壤介电常数的变化来确定湿度。这种方法简单易行，但在某些土壤类型或极端湿度条件下可能不够准确。综合考虑，频域反射法（FDR）在15%-45%的土壤含水率范围内具有较高的精度和稳定性，因此是最适合的选择。所以，正确答案是B.频域反射法（FDR）。", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831244", "t": 1, "q": "数字水利平台在进行洪水预报时，采用分布式水文模型，该模型能准确模拟不同子流域产汇流过程的关键在于？", "a": ["模型参数的区域化率定", "输入数据的时间分辨率", "模型的空间离散化精度", "输出结果的可视化程度", "", ""], "r": "A", "e": "数字水利平台在进行洪水预报时，采用分布式水文模型。分布式水文模型的核心在于其对不同子流域产汇流过程的模拟准确性。这其中，模型参数的区域化率定是关键，因为它决定了模型在不同区域内的适应性和准确性。输入数据的时间分辨率、模型的空间离散化精度以及输出结果的可视化程度虽然都是重要的因素，但它们并不直接决定模型模拟产汇流过程的准确性。因此，正确答案是A选项：模型参数的区域化率定。", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831245", "t": 1, "q": "水利水电工程智能监控系统中，数据采集终端（RTU）在无公网信号的偏远区域，实现数据回传的主要方式是？", "a": ["以太网有线传输", "4G/5G无线传输", "卫星通信传输", "蓝牙短距离传输", "", ""], "r": "C", "e": "偏远无公网信号区域，以太网、4G/5G、蓝牙都受限，卫星通信不受地域和公网信号限制可实现数据回传。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831246", "t": 1, "q": "在智慧水利的智能决策支持系统中，针对水库调度方案的优化选择，主要采用的算法类型是？", "a": ["遗传算法", "决策树算法", "支持向量机算法", "K-均值聚类算法", "", ""], "r": "A", "e": "遗传算法常用于优化问题，可在水库调度方案优化选择中搜索最优解；决策树多用于分类和预测；支持向量机主要用于分类和回归；K - 均值聚类用于数据聚类。所以选遗传算法。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831247", "t": 1, "q": "某水利工程的传感器网络在运行中，部分传感器出现数据\"丢包\"现象，且丢包率随距离监控中心距离增加而升高，最可能的原因是？", "a": ["传感器供电电压不稳定", "无线传输模块的发射功率不足", "数据采集频率过高", "传感器的采样精度不够", "", ""], "r": "B", "e": "丢包率随距监控中心距离增加而升高，说明是传输环节受距离影响，无线传输模块发射功率不足会使信号随距离衰减，导致丢包率上升。A选项供电电压不稳定与距离无关；C选项数据采集频率过高主要影响数据处理，和距离关系不大；D选项采样精度不够影响数据准确性而非丢包。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831248", "t": 1, "q": "数字水利中，对水利工程设施进行全生命周期管理的核心技术支撑是？", "a": ["大数据存储技术", "建筑信息模型（BIM）与地理信息系统（GIS）融合技术", "遥感监测技术", "物联网感知技术", "", ""], "r": "B", "e": "BIM能对水利工程设施进行三维建模、管理信息，GIS可提供地理空间信息，二者融合能贯穿水利工程全生命周期管理。大数据存储技术主要用于数据存储；遥感监测侧重于获取地表信息；物联网感知技术主要是实现信息采集，均非核心支撑技术。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831250", "t": 1, "q": "智慧水利系统中，用于识别河道非法采砂行为的技术手段，主要依赖的是？", "a": ["河道水位传感器的水位变化监测", "视频监控与图像识别人工智能技术", "河道流速传感器的流速异常监测", "水质传感器的悬浮物浓度监测", "", ""], "r": "B", "e": "视频监控与图像识别人工智能技术可对河道画面进行实时监控和分析，能精准识别非法采砂行为。而水位、流速、悬浮物浓度变化受多种因素影响，不能直接准确识别非法采砂行为。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831251", "t": 1, "q": "数字水利平台的数据质量控制中，针对水文站观测数据的\"跳变\"异常值，主要采用的检测方法是？", "a": ["均值检验法", "趋势检验法", "阈值检验法", "相邻数据差检验法", "", ""], "r": "D", "e": "“跳变”异常值是数据在短时间内出现急剧变化。相邻数据差检验法可通过对比相邻数据差值来检测是否有这种急剧变化的“跳变”情况。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831252", "t": 1, "q": "水利水电工程中，智能灌浆监控系统对灌浆压力和流量的控制，实现\"按设计曲线自动调节\"的关键是？", "a": ["采用高精度压力传感器和流量传感器", "建立灌浆参数与浆液扩散范围的关联模型", "控制执行机构的快速响应能力", "实时数据反馈与PID调节算法的结合", "", ""], "r": "D", "e": "要实现“按设计曲线自动调节”，需实时获取数据并根据偏差调整，实时数据反馈与PID调节算法结合能达成此目的。高精度传感器只是获取数据，关联模型与自动调节关键联系不大，控制执行机构响应能力是一方面但不是关键。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831253", "t": 1, "q": "在数字水利的流域水资源优化配置模型中，不需要作为约束条件的是？", "a": ["流域内各用水部门的需水量", "水库的兴利库容", "水文站的历史观测数据", "跨行政区的水资源分配协议", "", ""], "r": "C", "e": "流域水资源优化配置模型约束条件通常与水资源的量、分配规则等相关，水文站的历史观测数据是用于分析和建模的基础资料，并非约束条件，而各用水部门需水量、水库兴利库容、跨行政区水资源分配协议都会对水资源配置形成限制。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831254", "t": 1, "q": "水利工程智能监控系统中，采用LoRa无线通信技术传输传感器数据，其主要优势是？", "a": ["传输速率高", "传输距离远且功耗低", "抗电磁干扰能力最强", "支持大量节点同时通信", "", ""], "r": "B", "e": "LoRa无线通信技术特点是传输距离远且功耗低。其传输速率不高，抗电磁干扰能力不是最强，也不特别适合大量节点同时通信。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831255", "t": 1, "q": "智慧水利中，对水库泥沙淤积量进行动态监测的技术手段，最准确的是？", "a": ["基于水位观测的库容差计算法", "基于超声波测深的水下地形扫描法", "基于遥感影像的泥沙浓度反演法", "基于sediment transport公式的计算法", "", ""], "r": "B", "e": "超声波测深的水下地形扫描法能直接获取水库水下地形变化，通过对比不同时期地形可准确得出泥沙淤积量；A选项水位观测受多种因素影响，计算淤积量不够准确；C选项遥感影像反演的是泥沙浓度，不是淤积量；D选项公式计算依赖诸多假设和参数，准确性有限。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831258", "t": 1, "q": "在智慧水利的防洪预警系统中，预警等级的划分主要依据的是？", "a": ["洪水的重现期与影响范围", "降雨量的大小", "水位超警的高度", "洪水的传播速度", "", ""], "r": "A", "e": "防洪预警等级需综合考量洪水严重程度和影响范围，洪水重现期体现洪水稀有程度，影响范围反映其危害广度，能较全面确定预警等级。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831259", "t": 1, "q": "数字水利中，对水利工程BIM模型进行轻量化处理的主要目的是？", "a": ["减少模型的存储空间", "提高模型在Web端的加载与交互速度", "简化模型的几何结构", "降低模型的构建难度", "", ""], "r": "B", "e": "数字水利中，在Web端展示和交互水利工程BIM模型时，原始模型数据量大加载慢。轻量化处理可去除冗余信息，让模型数据变小，从而提高其在Web端加载与交互速度。A减少存储空间不是主要目的；C简化几何结构是手段非主要目的；D轻量化不针对降低构建难度。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637259876831260", "t": 1, "q": "水利水电工程中，智能监控系统对泵站电机的过载保护，除了监测电流外，还需重点监测的参数是？", "a": ["电机的转速", "电机的绕组温度", "电机的振动幅值", "电机的输出功率", "", ""], "r": "B", "e": "电机过载时，电流增大易使绕组温度急剧上升，可能损坏电机，所以除监测电流外，重点监测绕组温度能更好实现过载保护。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261541969920", "t": 2, "q": "水利水电工程智能监控系统的硬件组成中，属于\"数据传输层\"设备的有（　）", "a": ["工业以太网交换机", "4G/5G无线通信模块", "数据采集器", "光纤收发器", "传感器", ""], "r": "ABD", "e": "数据传输层主要负责数据的传输。工业以太网交换机、4G/5G无线通信模块、光纤收发器都用于数据传输。而数据采集器和传感器是数据采集层设备。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261541969922", "t": 2, "q": "水利水电工程传感器数据采集过程中，为提高数据采集的可靠性，可采取的措施有（　）", "a": ["采用双传感器冗余配置（如2个相同传感器监测同一参数）", "对采集数据进行多次采样并取平均值", "采用抗电磁干扰的屏蔽线缆", "定期对传感器进行校准", "降低数据采集的采样频率", ""], "r": "ABCD", "e": "A双传感器冗余配置可防止单个传感器故障影响数据采集；B多次采样取平均能减少随机误差，提升可靠性；C抗电磁干扰屏蔽线缆可避免外界干扰；D定期校准能保证传感器测量准确。而E降低采样频率会使采集数据信息变少，不利于提高可靠性。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164225", "t": 2, "q": "数字水利中\"数据中台\"的核心作用包括（　）", "a": ["实现水利多源数据（如水文、工程、气象数据）的集成管理", "为水利业务应用（如调度、监测）提供统一的数据接口", "直接生成水利工程的施工方案", "对水利数据进行标准化处理（如统一数据格式、单位）", "存储所有水利历史数据并支持快速查询", ""], "r": "ABDE", "e": "“数据中台”主要是处理和管理数据，为业务应用提供支持。A可集成多源数据；B能提供统一数据接口；D可对数据标准化；E可存储和支持查询历史数据。而直接生成水利工程施工方案并非数据中台核心作用。答案选ABDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637261546164226", "t": 2, "q": "水利水电工程中，采用分布式数据采集系统的优势有（　）", "a": ["可根据工程布局分散部署采集节点，适应大型水利工程", "某一采集节点故障时，不影响其他节点的正常工作", "可减少集中式采集系统的长距离布线，降低成本", "能实现采集数据的实时处理与本地存储", "仅能采集模拟量信号，无法采集数字量信号", ""], "r": "ABCD", "e": "分布式数据采集系统可分散部署节点适应大型工程，节点故障不影响其他节点，还能减少长距离布线降成本，能实时处理和本地存储数据，且可采集模拟量和数字量信号。E选项错误。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430144", "t": 3, "q": "数字水利中的BIM技术主要用于水利工程的三维建模，无法实现工程施工进度与成本的协同管理", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BIM技术不仅能用于水利工程三维建模，还可实现工程施工进度与成本的协同管理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430145", "t": 3, "q": "水利水电工程中，采用4-20mA电流信号传输传感器数据时，其抗干扰能力比0-5V电压信号更强，适合长距离传输", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电流信号受导线电阻影响小，抗干扰能力比电压信号强，更适合长距离传输。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430146", "t": 3, "q": "智能监控系统在水利水电工程中的\"预警功能\"，仅需依据实时监测数据与预设阈值的对比，无需考虑历史数据与趋势分析", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。仅依据实时监测数据与预设阈值对比来预警是不够的。历史数据和趋势分析能反映数据的变化走向、波动规律等，有助于更准确判断异常情况，提前发现潜在风险，完善预警功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430147", "t": 3, "q": "数字孪生水利工程模型的精度越高，其对硬件计算资源的需求越大，运行速度可能越慢", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "模型精度越高意味着细节越丰富、数据量越大，对硬件计算资源要求就高，处理数据时间变长导致运行速度变慢。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430148", "t": 3, "q": "水利水电工程数据采集系统中，采样频率设置越高，采集的数据越准确，因此应尽可能将采样频率设为最大值", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "采样频率并非越高越好，过高的采样频率会增加数据存储和处理负担，还可能引入更多噪声等问题，并非采样频率设为最大值就最好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430149", "t": 3, "q": "在水利水电工程智能监控系统中，边缘计算节点的主要作用是将所有采集数据传输至云端平台，由云端统一处理", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边缘计算节点主要是在靠近数据源的边缘侧对数据进行初步处理和分析，减轻云端处理压力，并非单纯将所有采集数据传输至云端由云端统一处理。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430150", "t": 3, "q": "GIS技术在数字水利中的应用，可实现水利工程空间位置与属性数据（如闸门型号、建设时间）的关联查询", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GIS（地理信息系统）能把空间数据和属性数据结合，可实现水利工程空间位置与属性数据的关联查询。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430151", "t": 3, "q": "水利水电工程中，电容式传感器的输出信号受环境温度变化影响较小，因此无需进行温度补偿", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电容式传感器的输出信号会受环境温度变化影响，通常需要进行温度补偿。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430152", "t": 3, "q": "数字水利平台中的\"数据中台\"可实现不同来源水利数据（如水文站、水库、灌区数据）的标准化整合，为业务应用提供统一数据服务", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据中台的核心功能之一就是对不同来源的数据进行标准化整合，为业务应用提供统一的数据服务，数字水利平台里的数据中台也具备此功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430153", "t": 3, "q": "水利水电工程智能监控系统的通信链路若采用光纤通信，其传输速率不受传输距离影响，可实现无衰减传输", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "光纤通信虽衰减小，但并非无衰减，传输速率也会受传输距离等因素影响。", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430154", "t": 3, "q": "在水利水电工程大坝安全监测中，采用GNSS技术监测坝体位移时，可实现全天候、高精度（毫米级）的实时监测", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GNSS技术具备不受天气等因素影响能全天候工作的特点，且其精度可达到毫米级，能实现对水利水电工程坝体位移的实时监测。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637263559430155", "t": 3, "q": "智能监控系统中的\"人工智能故障诊断\"，仅能诊断传感器故障，无法诊断水轮发电机组等大型设备的故障", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "人工智能故障诊断技术能力不断发展，不仅能诊断传感器故障，也可对水轮发电机组等大型设备故障进行诊断。", "ap": [false, false, false, false, false, false]}]}, {"k": "K18", "n": "知识点18  水库兴利调度与洪水调度", "qs": [{"id": "2035637278843473920", "t": 1, "q": "在智慧水利体系中，数字孪生流域能够实现\"预报-预警-预演-预案\"闭环管理，其核心支撑技术不包括以下哪项？", "a": ["高分辨率水文水动力数值模拟技术", "海量多源异构水利数据融合处理技术", "传统人工水位观测与纸质记录技术", "流域地理信息系统（GIS）与遥感（RS）集成技术", "", ""], "r": "C", "e": "智慧水利的数字孪生流域核心支撑技术应是先进的信息技术，传统人工水位观测与纸质记录技术落后且无法满足“预报 - 预警 - 预演 - 预案”闭环管理需求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473921", "t": 1, "q": "在数字孪生流域构建中，用于实现流域物理实体与数字模型动态映射的核心技术是（　）", "a": ["大数据存储技术", "实时数据同化技术", "遥感影像处理技术", "地理信息系统技术", "", ""], "r": "B", "e": "实时数据同化技术可将流域物理实体的实时数据与数字模型相结合，实现两者动态映射。而大数据存储技术主要是存储数据；遥感影像处理技术侧重于处理遥感影像；地理信息系统技术用于地理数据的分析等。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473922", "t": 1, "q": "水库兴利调度中，当计算设计枯水年的调节流量时，若水库死水位已定，调节流量与下列哪项参数的关系呈负相关（　）", "a": ["设计枯水年的来水量", "水库兴利库容", "调节周期", "灌区灌溉保证率", "", ""], "r": "C", "e": "调节流量与调节周期呈负相关，调节周期越长，在一定来水和库容情况下，调节流量越小。来水量多调节流量大，兴利库容大调节流量大，灌溉保证率与调节流量无直接负相关关系。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473923", "t": 1, "q": "智慧水利系统中，用于监测河道水流流速并能实现数据实时传输的设备是（　）", "a": ["超声波水位计", "多普勒流速仪", "雨量筒", "水质传感器", "", ""], "r": "B", "e": "多普勒流速仪可测河道水流流速且能实时传输数据；超声波水位计测水位，雨量筒测降雨量，水质传感器测水质，均不符题意。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473924", "t": 1, "q": "水库洪水调度中，\"防洪高水位\"是指（　）", "a": ["水库在正常运用情况下，遭遇设计洪水时达到的最高水位", "水库在正常运用情况下，遭遇校核洪水时达到的最高水位", "水库在正常运用情况下，为满足下游防洪要求，遭遇下游防护对象的设计洪水时，水库达到的最高水位", "水库在汛期允许兴利蓄水的上限水位", "", ""], "r": "C", "e": "防洪高水位是在正常运用时，为满足下游防洪要求，遇下游防护对象的设计洪水时水库达到的最高水位。A是设计洪水位；B是校核洪水位；D是汛限水位。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473925", "t": 1, "q": "数字水利中，BIM技术在水利工程施工阶段的核心应用是（　）", "a": ["流域水文模拟", "工程进度与成本协同管控", "洪水风险地图绘制", "水资源供需平衡分析", "", ""], "r": "B", "e": "BIM 技术在水利施工阶段可实现工程进度与成本协同管控，A、C、D选项并非施工阶段核心应用。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473926", "t": 1, "q": "水库兴利调度采用\"年调节\"方式时，其调节周期内的来水量与用水量的平衡计算，需重点考虑的时段是（　）", "a": ["丰水期", "平水期", "枯水期", "汛前期", "", ""], "r": "C", "e": "年调节是对一年内的径流进行调节，枯水期水量少，用水需求可能无法靠当期来水满足，需依靠丰水期蓄水，所以平衡计算重点考虑枯水期。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473927", "t": 1, "q": "智慧水利中的\"数字流域\"平台，其数据处理流程的正确顺序是（　）", "a": ["数据采集→数据存储→数据预处理→数据分析→数据应用", "数据采集→数据预处理→数据存储→数据分析→数据应用", "数据预处理→数据采集→数据存储→数据分析→数据应用", "数据采集→数据存储→数据分析→数据预处理→数据应用", "", ""], "r": "B", "e": "应先采集数据，采集后要进行预处理以保证数据质量，再存储起来，之后进行分析挖掘价值，最后应用数据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473928", "t": 1, "q": "水库洪水调度中，当水库遭遇超标准洪水时，应首先采用的调度措施是（　）", "a": ["加大泄洪流量，降低水库水位", "启用非常溢洪道", "关闭所有泄洪建筑物，保住水库大坝", "通知下游地区紧急转移", "", ""], "r": "D", "e": "当水库遭遇超标准洪水，下游民众生命和财产安全是首要考虑的。通知下游地区紧急转移能最大程度保障人员安全。A加大泄洪流量可能加剧下游洪水风险；B启用非常溢洪道有严格程序和条件，不是首先措施；C关闭泄洪建筑物可能导致水库水位过高，威胁大坝安全。所以选D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473929", "t": 1, "q": "在数字水利技术中，用于分析流域水资源时空分布特征的核心模型是（　）", "a": ["水库调洪演算模型", "分布式水文模型", "水利工程结构力学模型", "水质迁移扩散模型", "", ""], "r": "B", "e": "分布式水文模型能考虑流域下垫面空间分布不均匀性，可用于分析流域水资源时空分布特征。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473930", "t": 1, "q": "水库兴利调度中，\"灌溉保证率\"是指（　）", "a": ["灌区在某一时期内实际灌溉面积与设计灌溉面积的比值", "灌区在长期运行中，满足灌溉用水需求的年数与总年数的比值", "灌区在灌溉期内，实际供水量与需水量的比值", "灌区在一次灌溉过程中，实际灌溉定额与设计灌溉定额的比值", "", ""], "r": "B", "e": "灌溉保证率是衡量灌区用水保证程度的指标，指在长期运行中满足灌溉用水需求年数和总年数之比。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473931", "t": 1, "q": "智慧水利系统中，边缘计算技术的主要作用是（　）", "a": ["实现流域大范围数据的集中存储", "在数据采集端就近处理实时数据，减少数据传输延迟", "构建数字孪生流域的三维可视化模型", "分析历史水文数据，预测未来水资源变化趋势", "", ""], "r": "B", "e": "边缘计算特点是在靠近数据源头的边缘侧处理数据。A选项集中存储不是其主要作用；C选项构建三维可视化模型与边缘计算无关；D选项分析历史数据预测未来趋势不是边缘计算主要功能。边缘计算可在数据采集端就近处理实时数据，减少传输延迟。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473932", "t": 1, "q": "水库洪水调度中，调洪演算的关键参数\"入库流量过程线\"是通过（　）获得的", "a": ["水库水位观测数据反推", "流域水文预报模型计算", "下游河道流量观测数据推算", "水库泄洪建筑物的泄流能力计算", "", ""], "r": "B", "e": "流域水文预报模型可根据流域的降雨等情况计算出入库流量过程线。水库水位观测数据反推难以得到全面的入库流量过程；下游河道流量与入库流量有差异且推算较复杂不准确；水库泄洪建筑物泄流能力与入库流量过程线获取无关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473933", "t": 1, "q": "数字水利中，遥感技术在水资源监测中的主要应用是（　）", "a": ["测量水库水位的实时变化", "监测流域内土壤含水量和水体面积变化", "计算河道水流的瞬时流速", "采集水利工程的结构变形数据", "", ""], "r": "B", "e": "遥感技术可获取大面积地理信息。水库水位实时变化、河道水流瞬时流速及水利工程结构变形数据，遥感较难精准获取。而它能监测大范围的流域内土壤含水量和水体面积变化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473934", "t": 1, "q": "水库兴利调度中，当水库兴利库容不变，若灌区灌溉面积扩大，则设计枯水年的灌溉保证率将（　）", "a": ["升高", "降低", "不变", "无法确定", "", ""], "r": "B", "e": "兴利库容不变时，灌区灌溉面积扩大，用水需求增加，在设计枯水年可满足用水的概率就会降低，即灌溉保证率降低。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473935", "t": 1, "q": "智慧水利中的\"水利大数据平台\"，其数据清洗环节主要解决的问题是（　）", "a": ["数据格式不统一和数据缺失、异常值", "数据存储容量不足", "数据传输带宽不够", "数据可视化效果差", "", ""], "r": "A", "e": "数据清洗是对原始数据进行处理，使其更准确、完整、一致，主要解决数据格式不统一、数据缺失、存在异常值等问题。而存储容量、传输带宽、可视化效果并非数据清洗环节主要解决的。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473936", "t": 1, "q": "水库洪水调度中，\"汛期限制水位\"的确定主要考虑的因素是（　）", "a": ["水库大坝的设计洪水位", "下游地区的防洪标准和水库的防洪库容", "水库兴利蓄水的最大需求", "水库死水位和兴利库容的大小", "", ""], "r": "B", "e": "汛期限制水位要兼顾下游防洪和水库自身调洪，需依据下游防洪标准及水库防洪库容来确定。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473937", "t": 1, "q": "数字孪生水利工程中，用于模拟工程结构在洪水作用下受力变形的核心技术是（　）", "a": ["水文水力学模拟技术", "结构动力学模拟技术", "机器学习预测技术", "地理信息空间分析技术", "", ""], "r": "B", "e": "要模拟工程结构在洪水作用下受力变形，需运用结构动力学模拟技术来分析结构受力与变形情况。水文水力学模拟技术侧重水流运动等水文相关模拟；机器学习预测技术用于数据预测；地理信息空间分析技术主要处理地理空间数据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473938", "t": 1, "q": "水库兴利调度采用\"补偿调节\"方式时，其核心原则是（　）", "a": ["上游水库泄水补充下游水库的缺水", "下游水库根据上游水库的来水情况调整自身调度", "水库根据灌区实际需水情况动态调整供水量", "相邻水库联合调度，相互补偿来水的不均匀性", "", ""], "r": "D", "e": "补偿调节是相邻水库联合调度，相互补偿来水不均匀性，以提高水资源利用效率和整体效益。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473939", "t": 1, "q": "智慧水利系统中，物联网网关的主要功能是（　）", "a": ["采集各类传感器的原始数据", "实现不同协议传感器数据的转换与传输", "存储海量的水利监测数据", "分析监测数据并生成调度建议", "", ""], "r": "B", "e": "物联网网关主要作用是在不同协议设备间进行数据转换和传输，让不同协议的传感器数据能在系统中流通。A选项采集原始数据是传感器功能；C选项存储数据靠存储设备；D选项分析数据生成建议是数据分析系统功能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473940", "t": 1, "q": "水库洪水调度中，当入库流量小于出库流量时，水库水位将（　）", "a": ["上升", "下降", "不变", "先上升后下降", "", ""], "r": "B", "e": "入库流量小于出库流量，意味着水库流出的水比流入的多，水位会下降。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473941", "t": 1, "q": "数字水利中，用于评估水利工程对流域生态环境影响的模型是（　）", "a": ["水库调洪演算模型", "水资源配置模型", "生态水文模型", "水文气象预报模型", "", ""], "r": "C", "e": "生态水文模型可综合考虑水文过程与生态系统相互作用，能用于评估水利工程对流域生态环境的影响。而水库调洪演算模型主要用于水库调洪计算；水资源配置模型侧重水资源分配；水文气象预报模型用于水文气象预测。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473942", "t": 1, "q": "水库兴利调度中，\"死水位\"的确定不需要考虑的因素是（　）", "a": ["水库泥沙淤积情况", "水库下游河道的最小生态流量", "水库取水建筑物的安装高程", "水库设计洪水位", "", ""], "r": "D", "e": "死水位确定需考虑泥沙淤积、下游最小生态流量、取水建筑物安装高程等。设计洪水位是与防洪相关，和死水位确定无关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637278843473943", "t": 1, "q": "智慧水利中的\"智能调度系统\"，其决策支持功能主要依赖于（　）", "a": ["历史水文数据的简单统计", "基于规则和模型的多目标优化算法", "人工经验的手动输入", "单一水文模型的预测结果", "", ""], "r": "B", "e": "智能调度系统的决策支持需综合考虑多方面因素并实现多目标优化，基于规则和模型的多目标优化算法能满足这一需求。历史简单统计、人工经验手动输入和单一水文模型预测都有局限性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475264", "t": 2, "q": "数字孪生流域构建过程中，需要整合的关键技术体系包括以下哪些？", "a": ["水文水动力数值模拟技术", "多源水利数据融合与管理技术", "流域空间信息建模技术", "传统人工巡堤查险技术", "智能决策支持技术", ""], "r": "ABCE", "e": "数字孪生流域构建依靠先进技术，A水文水动力数值模拟、B多源水利数据融合与管理、C流域空间信息建模、E智能决策支持技术都是关键技术；而D传统人工巡堤查险技术不属于数字孪生流域构建所需整合的关键技术体系。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475265", "t": 2, "q": "水库兴利调度中，影响水库供水能力的主要因素包括以下哪些？", "a": ["水库兴利库容大小", "水库多年平均来水量", "水库下游河道安全泄量", "水库供水对象的用水需求", "水库死水位设定", ""], "r": "ABDE", "e": "兴利库容大、多年平均来水量多、死水位设定合理利于提升供水能力；供水对象用水需求影响供水能力的衡量；而下游河道安全泄量主要与防洪有关，和供水能力无直接关联。答案：ABDE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475266", "t": 2, "q": "智慧水利中，\"预报-预警-预演-预案\"闭环管理体系的核心构成部分包括以下哪些？", "a": ["实时水情工情监测系统", "洪水预报模型", "洪水预警信息发布平台", "水库人工泄洪操作记录", "应急处置预案库", ""], "r": "ABCE", "e": "“预报 - 预警 - 预演 - 预案”闭环管理体系需能实现水情监测、预报、预警发布及制定预案等功能。A可提供实时数据用于后续环节；B用于做出洪水预报；C负责预警信息发布；E是预案的集合。而D只是操作记录，并非核心构成部分。答案：ABCE", "ap": [false, false, false, false, false, false]}, {"id": "2035637280462475267", "t": 2, "q": "数字水利技术中，物联网（IoT）在水利工程安全监测中的应用场景包括以下哪些？", "a": ["坝体沉降与位移监测", "闸门运行状态监测", "水库水质指标实时监测", "水利工程图纸档案管理", "泵站机组振动与温度监测", ""], "r": "ABCE", "e": "物联网可实现物物相连、信息实时采集与传输。A坝体沉降与位移、B闸门运行状态、C水库水质指标、E泵站机组振动与温度都可通过传感器等物联网设备进行实时监测。而D水利工程图纸档案管理主要是文档管理工作，与物联网在监测方面的应用无关。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382912", "t": 3, "q": "智慧水利中的数字孪生流域，其构建基础是流域的物理实体与数字化模型的精准映射，无需结合实时监测数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利的数字孪生流域构建，既要有流域物理实体与数字化模型的精准映射，也需结合实时监测数据来反映流域动态变化，使模型更贴合实际情况。所以题干说无需结合实时监测数据是错误的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382913", "t": 3, "q": "水库兴利调度的首要目标是在保障水资源供需平衡的前提下，最大化发挥水库的兴利效益（如发电、灌溉、供水）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水库兴利调度就是要在保证水资源供需平衡基础上，尽可能实现发电、灌溉、供水等兴利效益最大化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382914", "t": 3, "q": "数字水利技术中，物联网（IoT）传感器采集的水利数据可直接用于水文预报，无需进行数据清洗与校验。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网传感器采集的水利数据可能存在错误、缺失、异常等情况，直接用于水文预报会影响结果准确性，必须先进行数据清洗与校验。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382916", "t": 3, "q": "智慧水利的\"预案\"功能，主要是针对已发生的洪水灾害，制定事后处置方案。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利“预案”功能主要是针对可能发生的灾害等提前制定应对方案，而非针对已发生的洪水灾害制定事后处置方案。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382917", "t": 3, "q": "水库兴利库容是指水库正常蓄水位与死水位之间的容积，用于满足兴利用水需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水库兴利库容的定义就是正常蓄水位与死水位之间的容积，其作用就是满足兴利用水需求。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382918", "t": 3, "q": "数字孪生水闸的运行模拟结果，可直接作为水闸实际运行的操作指令，无需人工复核。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生水闸虽能模拟运行，但模拟结果受模型精度、数据准确性等多种因素影响，可能存在偏差，不能直接作为操作指令，必须人工复核。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382919", "t": 3, "q": "水库洪水调度中，防洪限制水位是水库在汛期允许蓄水的最高水位，超过该水位需泄洪。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "防洪限制水位是水库在汛期允许蓄水的上限水位，当水库水位超过它时，为保障水库及下游安全等，通常需进行泄洪操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382920", "t": 3, "q": "智慧水利中，大数据分析技术可通过历史水文数据，精准预测未来任意时段的洪水过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然大数据分析技术能依据历史水文数据进行洪水预测，但由于洪水受众多复杂因素影响，如气象变化、人类活动等，难以精准预测未来任意时段的洪水过程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382921", "t": 3, "q": "水库兴利调度中，当水库实际来水量大于设计来水量时，可适当提高供水保证率，增加供水量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "实际来水量大于设计来水量，意味着水资源更充足，有条件提高供水保证率并增加供水量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382922", "t": 3, "q": "数字水利中，遥感技术（RS）可用于监测水库的水面面积，但无法计算水库的蓄水量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "遥感技术能获取水库水面面积信息，结合相关地形数据等，可计算水库蓄水量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382923", "t": 3, "q": "水库洪水调度中，校核洪水的重现期大于设计洪水，主要用于检验水库大坝的极限安全性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "校核洪水重现期确实大于设计洪水，其目的就是检验水库大坝在遭遇稀遇洪水时的极限安全性能。", "ap": [false, false, false, false, false, false]}, {"id": "2035637281561382924", "t": 3, "q": "智慧水利平台的\"预演\"功能，仅能模拟单一洪水情景下的流域响应，无法模拟多情景。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧水利平台的“预演”功能可模拟多种情景，并非仅能模拟单一洪水情景。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K19", "n": "知识点19  水电站水能规划", "qs": [{"id": "2035637295356448768", "t": 1, "q": "智慧水利体系中，实现流域内水文、水质、工程状态等实时监测数据远距离、低时延传输的关键技术是以下哪项？", "a": ["大数据分析技术", "物联网（IoT）技术", "云计算技术", "人工智能推理技术", "", ""], "r": "B", "e": "物联网（IoT）技术可将各种设备连接，能实现流域内水文、水质、工程状态等实时监测数据的远距离、低时延传输。大数据分析主要用于数据处理和挖掘；云计算侧重于提供计算资源；人工智能推理技术用于智能决策等。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448769", "t": 1, "q": "在数字孪生水利系统构建中，其区别于传统水利模拟系统的核心特征是", "a": ["具备数据采集功能", "实现物理实体与虚拟模型的动态映射与交互反馈", "仅能进行静态水力特性计算", "主要依赖人工输入参数进行模拟", "", ""], "r": "B", "e": "数字孪生水利系统关键在于物理实体和虚拟模型能动态映射与交互反馈，这是区别传统水利模拟系统的核心。A选项数据采集传统系统也有；C选项数字孪生可动态计算非仅静态；D选项传统系统更依赖人工输入，数字孪生强调数据驱动。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448770", "t": 1, "q": "水电站水能规划中，计算水库保证出力时，需采用的水文资料系列长度应满足", "a": ["不少于10年", "不少于20年", "不少于30年", "不少于50年", "", ""], "r": "C", "e": "在水电站水能规划计算水库保证出力时，为使成果有一定可靠性和代表性，需采用不少于30年的水文资料系列长度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448771", "t": 1, "q": "下列哪种技术不属于数字水利技术体系中用于数据融合处理的关键技术", "a": ["边缘计算", "卡尔曼滤波", "小波变换", "地理信息系统（GIS）", "", ""], "r": "D", "e": "边缘计算、卡尔曼滤波、小波变换常用于数据融合处理。地理信息系统（GIS）主要是对地理空间数据进行采集、存储、管理、分析和显示等操作，并非数据融合处理的关键技术。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448772", "t": 1, "q": "某年调节水电站，其水库库容系数为15%，若该水电站所在河流多年平均径流量为20亿立方米，则其兴利库容约为", "a": ["1亿立方米", "3亿立方米", "5亿立方米", "7亿立方米", "", ""], "r": "B", "e": "库容系数是兴利库容与多年平均径流量的比值。已知库容系数为15%，多年平均径流量为20亿立方米，兴利库容 = 多年平均径流量×库容系数，即20×15% = 3亿立方米。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448773", "t": 1, "q": "数字水利系统中，针对水利数据安全的\"三重防护\"体系，不包括以下哪个层面", "a": ["应用安全", "网络安全", "物理安全", "人员安全", "", ""], "r": "D", "e": "数字水利系统“三重防护”体系通常指物理安全、网络安全、应用安全，人员安全不属于该体系。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448774", "t": 1, "q": "水电站水能规划中，当进行电力系统电力平衡计算时，水电站的工作容量确定需重点考虑", "a": ["水电站的最大出力", "电力系统的峰荷需求与水电站的调峰能力", "水电站的保证出力", "水电站的多年平均出力", "", ""], "r": "B", "e": "电力系统中水电站工作容量主要用于满足系统峰荷等需求，所以要重点考虑电力系统峰荷需求和水电站调峰能力。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448775", "t": 1, "q": "下列关于水利大数据分析技术在水库调度中的应用，说法错误的是", "a": ["可实现水库来水预报精度提升", "能优化水库泄洪与兴利供水的协同调度", "仅能处理结构化的水文监测数据", "可支撑水库调度方案的多情景模拟", "", ""], "r": "C", "e": "水利大数据分析技术不仅能处理结构化的水文监测数据，还能处理半结构化和非结构化数据，C说法错误。A、B、D选项都是水利大数据分析技术在水库调度中的合理应用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448776", "t": 1, "q": "某水电站水库为不完全年调节水库，其调节周期内的径流调节特点是", "a": ["能将全年来水完全按用水需求重新分配", "仅能调节部分季节的来水，无法满足枯水期全部用水需求", "调节周期超过一年，需跨年度调节来水", "仅能调节日内来水，无法调节季节来水差异", "", ""], "r": "B", "e": "不完全年调节水库不能将全年来水完全按用水需求重新分配，也不是跨年度调节，调节能力也不只是日内调节。它仅能调节部分季节来水，且不能满足枯水期全部用水需求。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448777", "t": 1, "q": "数字水利中的物联网技术，其在水利工程监测中的核心应用环节是", "a": ["数据存储与管理", "监测数据的实时传输与感知", "数据的可视化展示", "调度方案的决策支持", "", ""], "r": "B", "e": "物联网技术强调物与物、人与物的连接及信息交互。在水利工程监测里，关键是实时获取和传输监测数据，感知水利工程状态。A选项数据存储管理是后续环节；C选项可视化展示是呈现数据的方式；D选项调度方案决策支持依赖前面环节得出结果后进行。所以核心应用环节是监测数据的实时传输与感知，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448778", "t": 1, "q": "水电站水能规划中，进行经济评价时，计算财务内部收益率（FIRR）的基准是", "a": ["高于同期银行贷款利率", "等于水电站的投资利润率", "不低于行业基准收益率", "低于水库的年运行费用率", "", ""], "r": "C", "e": "财务内部收益率（FIRR）是使项目在计算期内各年净现金流量现值累计等于零时的折现率。进行经济评价时，FIRR需不低于行业基准收益率，这样项目在经济上才可行。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448779", "t": 1, "q": "下列哪种水利工程安全监测数据，更适合采用数字孪生技术进行动态预警分析", "a": ["水库水位的日平均数据", "大坝变形的实时连续监测数据", "河流流量的月统计数据", "降雨量的季度累计数据", "", ""], "r": "B", "e": "数字孪生技术强调对物理实体的实时映射和动态分析。实时连续监测数据能及时反映大坝变形情况，便于利用数字孪生技术进行动态预警。而日平均、月统计、季度累计数据时效性差，不利于动态预警。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448780", "t": 1, "q": "水电站水库的防洪高水位与设计洪水位的关系是", "a": ["防洪高水位高于设计洪水位", "防洪高水位低于设计洪水位", "两者相等", "取决于水库的防洪标准与下游保护对象", "", ""], "r": "B", "e": "设计洪水位是遇到设计洪水时水库达到的最高水位，防洪高水位是防御下游防护对象的设计洪水时水库达到的最高水位，通常设计洪水标准高于下游防护对象的设计洪水标准，所以防洪高水位低于设计洪水位。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448781", "t": 1, "q": "数字水利技术中，人工智能（AI）的深度学习算法，在水利预测中的主要优势是", "a": ["无需历史数据即可进行预测", "对非线性、复杂水文过程的拟合与预测精度更高", "仅能处理单一变量的预测问题", "计算速度比传统统计方法慢但精度高", "", ""], "r": "B", "e": "深度学习算法能处理复杂的非线性关系，在水利预测里对非线性、复杂水文过程的拟合与预测精度更高。A选项，深度学习需要历史数据训练；C选项，它能处理多变量问题；D选项，深度学习计算速度通常比传统统计方法快。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448782", "t": 1, "q": "某水电站的装机容量为100MW，多年平均发电量为40亿kWh，则该水电站的年利用小时数为", "a": ["4000h", "4500h", "5000h", "5500h", "", ""], "r": "A", "e": "年利用小时数 = 多年平均发电量÷装机容量，将装机容量100MW换算为10万千瓦，40亿kWh即40亿度，400000÷10 = 4000h。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448783", "t": 1, "q": "下列不属于数字水利\"智慧调度\"核心功能的是", "a": ["水库来水短期预报", "水电站机组检修计划制定", "防洪与兴利调度方案动态优化", "水资源供需平衡实时分析", "", ""], "r": "B", "e": "智慧调度主要围绕水利调度相关的实时性、动态性的功能。机组检修计划制定并非实时动态的调度核心功能，更偏向常规的计划性安排。而水库来水预报、调度方案优化、水资源供需平衡分析都直接与水利实时调度相关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448784", "t": 1, "q": "水电站水能规划中，当水库为多年调节时，其保证出力的计算方法通常采用", "a": ["时历法", "概率法", "经验公式法", "图解法", "", ""], "r": "B", "e": "多年调节水库调节周期长，水文系列资料多，概率法能考虑水文现象的统计特性来计算保证出力，更适合多年调节水库保证出力计算。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448785", "t": 1, "q": "数字水利系统中，数据传输环节采用的\"边缘计算\"技术，其主要目的是", "a": ["减少数据向云端传输的量，降低延迟", "替代云端的所有数据处理功能", "仅用于数据存储，不进行计算", "提高数据的公开共享程度", "", ""], "r": "A", "e": "边缘计算是在靠近物或数据源头的一侧进行数据处理，可减少需向云端传输的数据量，降低传输延迟。它不能替代云端所有功能；不仅用于存储还能计算；与提高数据公开共享程度无关。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448786", "t": 1, "q": "某水电站水库的死水位确定，主要考虑的因素不包括", "a": ["水电站机组的最小工作水头", "水库泥沙淤积的影响", "下游生态用水的最低水位要求", "水库的防洪库容大小", "", ""], "r": "D", "e": "死水位主要与保证机组运行、应对泥沙淤积及下游生态用水等有关。防洪库容大小与死水位确定无直接关联。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448787", "t": 1, "q": "下列关于水利区块链技术的应用，说法正确的是", "a": ["仅能用于水利工程建设的资金监管", "可实现水利数据的不可篡改与溯源", "无法与物联网技术结合使用", "对数据存储容量要求低于传统数据库", "", ""], "r": "B", "e": "区块链具有去中心化、不可篡改、可溯源等特性，能保障水利数据的真实性和完整性。A选项应用不止资金监管；C选项区块链可与物联网结合；D选项区块链对数据存储容量要求更高。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448789", "t": 1, "q": "数字水利中的遥感技术（RS），在水利监测中的主要应用不包括", "a": ["水库淹没范围监测", "土壤含水量反演", "水电站机组振动监测", "河流岸线变化监测", "", ""], "r": "C", "e": "遥感技术主要用于大范围的地理信息监测等。A、B、D选项都属于大范围地理相关的监测内容。而水电站机组振动监测是针对具体设备的微观监测，不是RS技术在水利监测的主要应用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448790", "t": 1, "q": "某水电站的设计保证率为95%，其含义是", "a": ["该水电站在95%的年份内能满足保证出力", "该水电站在95%的时间内发电量达到设计值", "该水电站的大坝安全系数为95%", "该水电站的投资回收期为95%的设计年限", "", ""], "r": "A", "e": "设计保证率指水电站正常工作的保证程度。设计保证率为95%表示该水电站在95%的年份内能满足保证出力。B选项时间概念不准确；C选项大坝安全系数与此无关；D选项投资回收期也和设计保证率无关。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448791", "t": 1, "q": "数字水利系统的\"数据中台\"建设，其核心作用是", "a": ["实现水利数据的统一汇聚、治理与共享", "仅存储历史水利数据，不处理实时数据", "替代水利工程的现场监测设备", "仅为单一水利业务提供数据服务", "", ""], "r": "A", "e": "数据中台核心就是对数据统一汇聚、治理和共享，B 项应处理实时数据，C 项不能替代现场监测设备，D 项可服务多业务。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637295356448792", "t": 1, "q": "水电站水库的兴利库容与防洪库容部分重叠时，这种库容称为", "a": ["死库容", "共用库容（防洪兴利结合库容）", "总库容", "备用库容", "", ""], "r": "B", "e": "当兴利库容与防洪库容部分重叠，该重叠部分库容就是防洪和兴利共同使用的，即共用库容（防洪兴利结合库容）。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808384", "t": 2, "q": "智慧水利体系的核心组成部分包括以下哪些？（　）", "a": ["智能监测感知系统", "数据传输与存储系统", "数值模拟与决策支持系统", "设备运维管理系统", "水文数据人工采集系统", ""], "r": "ABCD", "e": "智慧水利以信息化为支撑，智能监测感知、数据传输存储、数值模拟与决策支持都是其关键环节，设备运维管理保障系统正常运行。而水文数据人工采集不符合智慧水利自动化智能化特点。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808385", "t": 2, "q": "水电站水能规划中，影响水库兴利库容大小的因素有以下哪些？（　）", "a": ["流域年径流量及其年内分配", "水电站设计保证率", "下游用水部门的需水量", "水库的死水位", "水电站的装机容量", ""], "r": "ABCD", "e": "流域年径流量及其年内分配影响可利用水量和过程，设计保证率决定需满足供水的程度，下游用水部门需水量是兴利要满足的目标，水库死水位影响可调节水量范围，这些都会影响兴利库容。而水电站装机容量主要与发电能力相关，和兴利库容大小无直接关系。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808386", "t": 2, "q": "数字水利中，流域水动力模型的输入参数包括以下哪些？（　）", "a": ["流域地形数据（如DEM）", "河道糙率系数", "初始水位与初始流速", "降雨量与蒸发量", "污染物浓度初始值", ""], "r": "ABCD", "e": "流域水动力模型输入参数需涵盖地形、水流特性及外部影响等因素。A提供地形基础，B体现河道对水流阻碍，C是水流初始状态，D是重要外部因素。而E污染物浓度初始值与水动力模型核心水流运动关系不大。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637297889808387", "t": 2, "q": "智慧水利中，物联网监测系统常用的感知设备包括以下哪些？（　）", "a": ["超声波流量计", "水质传感器（如pH传感器）", "无人机", "水文站人工观测记录本", "雷达水位计", ""], "r": "ABCE", "e": "物联网监测系统常用感知设备是能自动获取数据的仪器。A超声波流量计、B水质传感器、E雷达水位计可自动采集流量、水质、水位等数据；C无人机可从空中进行监测获取相关信息；而D水文站人工观测记录本是人工记录工具，不属于物联网感知设备。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630592", "t": 3, "q": "智慧水利中的\"数据同化技术\"是通过融合观测数据与数值模型模拟结果，修正模型初始场，从而提高水文预报精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据同化技术确实是将观测数据和数值模型模拟结果融合，对模型初始场进行修正，以此来提升水文预报的精度。", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630593", "t": 3, "q": "水电站水能规划中，\"装机容量年利用小时数\"越大，说明水电站的发电效率越高，经济效益越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "装机容量年利用小时数大，意味着机组满负荷运行时间长，但不能直接说明发电效率高、经济效益好，因为它未考虑发电成本、电价等因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630594", "t": 3, "q": "数字水利中，流域水动力模型的计算网格空间分辨率越高，模型计算精度一定越高，且计算效率不受影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "网格空间分辨率高，模型能更精细地描述流域情况，理论上计算精度会提高，但分辨率提高会使计算量大幅增加，计算效率会受影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637299051630595", "t": 3, "q": "智慧水利监测系统中，雷达水位计因采用非接触式测量，可完全不受暴雨、大雾等恶劣天气的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "雷达水位计虽为非接触式测量，但暴雨、大雾等恶劣天气会对雷达波的传播产生干扰，不能完全不受影响。", "ap": [false, false, false, false, false, false const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
</html>
