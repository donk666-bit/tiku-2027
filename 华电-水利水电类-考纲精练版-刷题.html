中的长石经水作用分解为高岭土", "岩石因温度变化产生膨胀收缩，导致裂隙发育", "岩石中的黄铁矿氧化生成硫酸，腐蚀岩石", "岩石被水流携带的泥沙磨损", "", ""], "r": "B", "e": "物理风化是指岩石在温度变化、水、风等作用下，发生机械破碎而化学成分不变的过程。A选项是化学分解，C选项是氧化腐蚀，都属于化学风化；D选项是侵蚀作用。B选项岩石因温度变化产生膨胀收缩致裂隙发育，属于物理风化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305046", "t": 1, "q": "某水电站坝基为花岗岩，勘察发现岩体中存在三组裂隙，其产状分别为:①30°∠60°、②120°∠55°、③210°∠65°，坝轴线方向为0°，若仅考虑裂隙组合对坝基抗滑的影响，最不利的裂隙组合是（　）", "a": ["①和②", "①和③", "②和③", "仅①", "", ""], "r": "C", "e": "分析：坝轴线方向为0°，要找最不利裂隙组合，需考虑裂隙组合后形成楔形体的滑动可能性。裂隙走向与坝轴线夹角大、倾角合适易形成不利滑动面。②和③走向与坝轴线夹角大，组合易形成不利楔形体。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637097234305047", "t": 1, "q": "水利工程中，\"地基承载力特征值\"的确定方法，错误的是（　）", "a": ["可通过平板载荷试验直接测定", "可根据岩石单轴抗压强度按经验公式计算（如fak=ψr×frk）", "可通过标准贯入试验锤击数，结合地区经验确定", "仅能通过室内土工试验测定土的物理指标后计算，无法现场测定", "", ""], "r": "D", "e": "地基承载力特征值确定方法多样，可通过平板载荷试验直接测、根据岩石单轴抗压强度计算、结合标准贯入试验锤击数和地区经验确定，也能现场测定，并非仅靠室内土工试验计算。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770304", "t": 2, "q": "影响水利水电工程边坡稳定性的内在地质因素有（　）", "a": ["岩体的岩性", "岩体的地质构造（如断层、裂隙）", "边坡的坡率", "岩体的风化程度", "地下水位变化", ""], "r": "ABD", "e": "内在地质因素主要是岩体自身特性相关的。岩性、地质构造、风化程度都属于岩体自身内在因素；坡率是人为设计的，地下水位变化是外部因素。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770305", "t": 2, "q": "下列岩石中，属于岩浆岩的有（　）", "a": ["花岗岩", "玄武岩", "辉绿岩", "大理岩", "片麻岩", ""], "r": "ABC", "e": "岩浆岩是岩浆冷却凝固形成，花岗岩、玄武岩、辉绿岩都属岩浆岩。大理岩是石灰岩变质而成的变质岩，片麻岩也是变质岩。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770306", "t": 2, "q": "水利工程中，常用的岩体渗透系数测定方法有（　）", "a": ["钻孔压水试验", "抽水试验", "注水试验", "室内土工试验（如变水头渗透试验）", "标准贯入试验", ""], "r": "ABCD", "e": "钻孔压水、抽水、注水试验以及室内土工试验（如变水头渗透试验）都可用于测定岩体渗透系数，而标准贯入试验主要是测土的密实度等，与渗透系数测定无关。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637099100770307", "t": 2, "q": "岩溶（喀斯特）发育的必要条件包括（　）", "a": ["岩石具有可溶性（如石灰岩、白云岩）", "岩石具有透水性（如裂隙、孔隙发育）", "水具有溶蚀性（如含二氧化碳的水）", "水具有流动性（保证溶蚀持续进行）", "岩石具有较高的抗压强度", ""], "r": "ABCD", "e": "岩溶发育需岩石可溶、透水，水有溶蚀性和流动性，抗压强度与岩溶发育无关。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947584", "t": 3, "q": "水利水电工程中，岩浆岩中的玄武岩因是喷出型岩浆岩，其结晶颗粒粗大，抗压强度高于侵入型岩浆岩中的花岗岩。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "玄武岩是喷出型岩浆岩，冷却速度快，结晶颗粒细小；花岗岩是侵入型岩浆岩，冷却速度慢，结晶颗粒粗大，且花岗岩抗压强度高于玄武岩。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947585", "t": 3, "q": "断层的上盘和下盘是根据断层两盘的相对位置划分的，若上盘相对向下滑动，则该断层为正断层。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "正断层定义就是上盘相对下盘沿断层面向下滑动的断层，此描述符合正断层特征。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947586", "t": 3, "q": "岩石的软化系数越大，说明岩石在饱和状态下的抗压强度与干燥状态下的抗压强度差异越小，岩石的抗水稳定性越差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "岩石软化系数越大，饱和与干燥状态抗压强度差异越小，岩石抗水稳定性越好，而不是越差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947587", "t": 3, "q": "水利工程中，管涌现象仅发生在基坑底部的渗流出口处，不会发生在土体内部。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "管涌不仅会发生在基坑底部渗流出口处，也可能发生在土体内部。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947588", "t": 3, "q": "岩体完整性系数KV是通过岩体纵波速度与岩块纵波速度的比值平方计算得出，KV值小于0.35时，岩体属于破碎等级。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "岩体完整性系数KV确实是岩体纵波速度与岩块纵波速度比值的平方，且当KV小于0.35时，岩体属于破碎等级。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947589", "t": 3, "q": "承压水具有稳定的隔水顶板和底板，其水位不受地表降水和蒸发的影响，始终保持稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "承压水虽有稳定隔水顶板和底板，水位受地表降水和蒸发影响小，但并非始终保持稳定，会受地质构造、人为开采等因素影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947590", "t": 3, "q": "水利枢纽坝址选择时，应优先选择褶皱构造的轴部区域，因为轴部岩体受挤压作用，完整性更好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "褶皱构造轴部岩体受挤压作用，裂隙发育，岩石破碎，完整性差，不利于坝址建设，不应优先选择轴部区域。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947591", "t": 3, "q": "强风化岩石的强度低、透水性强，不能作为水利工程坝基的持力层，必须全部挖除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "强风化岩石虽强度低、透水性强，但不一定都要全部挖除，可根据具体工程情况，通过适当处理措施使其满足坝基持力层要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947592", "t": 3, "q": "在边坡稳定计算中，边坡稳定系数是抗滑力与滑动力的比值，当稳定系数大于1.0时，边坡一定处于绝对稳定状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "稳定系数大于1.0只能说明理论上边坡有一定抗滑能力，但受地质条件复杂多变、不确定性因素影响，不能判定处于绝对稳定状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947593", "t": 3, "q": "岩溶发育区的水利工程，若溶洞顶板厚度大于0.8倍溶洞跨度，且岩石强度满足要求，则溶洞顶板可判定为稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在岩溶发育区水利工程中，一般当溶洞顶板厚度大于0.8倍溶洞跨度且岩石强度满足要求时，从工程经验和相关理论来看，溶洞顶板通常可判定为稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947595", "t": 3, "q": "水利工程地基处理中的强夯法，主要适用于处理碎石土、砂土、低饱和度的黏性土，不适用于处理饱和软黏土。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "强夯法适用于处理碎石土、砂土、低饱和度的粉土与黏性土、湿陷性黄土、素填土和杂填土等，对于饱和软黏土效果不佳，一般不适用。", "ap": [false, false, false, false, false, false]}, {"id": "2035637100442947596", "t": 3, "q": "岩石的单轴抗压强度测试中，试件的高径比（高度与直径的比值）对测试结果无影响，只需保证试件为圆柱形即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在岩石单轴抗压强度测试中，试件高径比会影响测试结果，并非无影响。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K07", "n": "知识点07  水电站结构形式、设计理论与运行特性", "qs": [{"id": "2035637103496400896", "t": 1, "q": "水电站厂房的防渗设计中，针对厂房下游侧尾水位以下的墙体，需采用防渗措施，下列哪种防渗结构适用于水头较高、防渗要求严格的情况？", "a": ["沥青油毡防水层", "混凝土防渗墙", "水泥砂浆抹面", "土工膜防渗层", "", ""], "r": "B", "e": "混凝土防渗墙整体性好、防渗能力强，能承受较高水头，适用于水头较高、防渗要求严格的情况。而沥青油毡防水层耐久性差；水泥砂浆抹面防渗能力有限；土工膜防渗层在高水头下易破损。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400897", "t": 1, "q": "关于水电站水锤现象，下列说法正确的是？", "a": ["水锤压力只与水轮机导叶关闭时间有关", "间接水锤的危害通常大于直接水锤", "设置调压室可有效减小水锤压力", "水锤现象只发生在水轮机突然停机的工况", "", ""], "r": "C", "e": "水锤压力受多种因素影响，A错误；直接水锤危害通常大于间接水锤，B错误；水锤现象在多种工况下都可能发生，不只是水轮机突然停机，D错误；设置调压室能调节压力变化，有效减小水锤压力，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400898", "t": 1, "q": "某水电站采用坝后式厂房，其发电机层与水轮机层之间设置有中间层，该中间层的主要作用是？", "a": ["布置调速器、油压装置等辅助设备", "作为人员通行通道", "储存检修工具和备件", "增强厂房结构整体刚度", "", ""], "r": "A", "e": "发电机层与水轮机层间的中间层常用来布置调速器、油压装置等辅助设备。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400899", "t": 1, "q": "水轮机吸出高度（Hs）的设计计算需考虑防止气蚀，下列关于吸出高度的说法错误的是？", "a": ["Hs值越小，水轮机抗气蚀性能越好", "Hs与水轮机安装高程直接相关", "设计水头增大时，允许的Hs值通常减小", "水温升高会导致允许的Hs值增大", "", ""], "r": "D", "e": "水温升高，水的汽化压力增大，更易发生气蚀，允许的Hs值应减小，D说法错误。A中Hs小压力高不易气蚀，抗气蚀性能好；B中安装高程与Hs直接相关；C设计水头增大，压力变化大，允许Hs减小。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400900", "t": 1, "q": "水电站坝体混凝土浇筑中，为防止温度裂缝，需控制混凝土的最高温升，下列措施中不能有效降低混凝土最高温升的是？", "a": ["选用低热水泥", "减少水泥用量", "提高混凝土浇筑温度", "设置冷却水管", "", ""], "r": "C", "e": "低热水泥水化热低，减少水泥用量可降低水化热总量，设置冷却水管能带走热量，都有助于降低最高温升；而提高浇筑温度会使混凝土初始温度高，不利于控制最高温升。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400901", "t": 1, "q": "在水电站运行特性中，\"调峰\"是指水电站根据电网负荷变化调整出力，下列哪种水电站最适合承担调峰任务？", "a": ["无调节水库的引水式水电站", "日调节水库的坝式水电站", "年调节水库的混合式水电站", "径流式水电站", "", ""], "r": "B", "e": "答案：B调峰需要水电站能够快速调整出力以适应电网负荷的变化。日调节水库的坝式水电站由于水库容量适中，可以在较短时间内调整水位和出力，因此最适合承担调峰任务。其他类型的水电站要么调节能力有限（如无调节水库的引水式水电站和径流式水电站），要么调节周期较长（如年调节水库的混合式水电站），不太适合进行快速的调峰操作。", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400902", "t": 1, "q": "水轮机导叶的开度调节是通过调速器控制的，下列关于调速器工作原理的说法正确的是？", "a": ["调速器通过改变水轮机转轮直径来调整出力", "机械液压调速器的响应速度比电气液压调速器更快", "调速器的PID调节（比例-积分-微分）可实现出力的稳定控制", "调速器只在水轮机启动时发挥作用", "", ""], "r": "C", "e": "调速器的PID调节能综合比例、积分、微分作用，可对水轮机出力实现稳定控制；A选项，调速器通过调节导叶开度而非改变转轮直径调整出力；B选项，电气液压调速器响应速度比机械液压调速器快；D选项，调速器在水轮机运行全程都发挥作用，不只是启动时。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400903", "t": 1, "q": "水电站厂房的地基处理中，若地基岩体存在溶洞和裂隙，需采用灌浆处理，下列哪种灌浆类型主要用于填充岩体裂隙、提高地基整体性？", "a": ["帷幕灌浆", "固结灌浆", "接触灌浆", "回填灌浆", "", ""], "r": "B", "e": "固结灌浆是对岩石进行加固，填充岩体裂隙，提高其整体性和强度。帷幕灌浆是为防渗漏；接触灌浆是加强混凝土与基岩或钢板等接触面结合；回填灌浆是填充混凝土与围岩间空隙。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400904", "t": 1, "q": "在水电站结构形式中，某类水电站需依靠坝体挡水形成水库，且厂房通常布置在坝体下游侧或坝内，其水头主要由坝高决定，该类水电站属于以下哪种类型？", "a": ["引水式水电站", "坝式水电站", "混合式水电站", "抽水蓄能水电站", "", ""], "r": "B", "e": "坝式水电站依靠坝体挡水形成水库，厂房多在坝体下游侧或坝内，水头由坝高决定。引水式是利用引水道集中水头；混合式结合了坝式和引水式特点；抽水蓄能是利用上下水库调峰。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400905", "t": 1, "q": "水轮机选型设计中，需根据水电站的设计水头、设计流量和预期效率确定机型，若某水电站设计水头较低（小于30米）、流量较大，下列哪种水轮机最适合？", "a": ["混流式水轮机", "轴流式水轮机", "斜流式水轮机", "冲击式水轮机", "", ""], "r": "B", "e": "不同类型水轮机适用于不同水头和流量情况。轴流式水轮机适用于低水头、大流量的水电站。本题中水电站设计水头较低且流量较大，所以轴流式水轮机最合适。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400907", "t": 1, "q": "关于水电站调压室的作用，下列说法错误的是？", "a": ["反射水锤波，保护引水系统和机组", "调节引水系统中的流量，稳定机组转速", "减小引水系统的水头损失", "在机组负荷变化时，补充或储存部分水量", "", ""], "r": "C", "e": "调压室主要作用是反射水锤波、调节流量稳定转速、负荷变化时补充或储存水量，不能减小引水系统水头损失。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400908", "t": 1, "q": "某混流式水轮机的额定转速为300转/分钟，其对应的同步转速由电网频率决定，若电网频率为50赫兹，该水轮机的转轮叶片数最可能为以下哪项（同步转速公式:n=60f/p，n为转速，f为频率，p为磁极对数）？", "a": ["10", "12", "14", "16", "", ""], "r": "A", "e": "这是一道关于电力系统和机械设备运行原理的题目。我们需要根据给定的电网频率和水轮机的额定转速，利用同步转速公式来推算出水轮机的转轮叶片数。首先，我们来了解一下题目中的关键信息：* 水轮机的额定转速为300转/分钟。* 电网频率为50赫兹。接下来，我们分析如何求解这个问题：1. 同步转速公式：n = 60f / p，其中n是同步转速，f是电网频率，p是磁极对数。2. 计算同步转速：将f=50赫兹代入公式，得到同步转速n = 60 * 50 / p = 3000 / p。3. 确定磁极对数：由于水轮机的额定转速为300转/分钟，这个转速应接近同步转速。我们可以通过试探法，尝试不同的p值来找到最接近300转/分钟的同步转速。\\t* 当p=10时，n = 3000 / 10 = 300转/分钟，与额定转速完全匹配。\\t* 当p值增大或减小时，同步转速将远离300转/分钟。根据电力系统和机械设备的基本原理，转轮叶片数通常与磁极对数相等，以达到最佳运行效率。因此，当磁极对数p为10时，转轮叶片数也最可能为10。综上所述，该水轮机的转轮叶片数最可能为10。所以，正确答案是A选项：“10”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400909", "t": 1, "q": "水电站坝体稳定分析中，需验算坝基的抗滑稳定，当坝基存在软弱夹层时，最易发生的滑动破坏形式是？", "a": ["沿坝体与坝基接触面滑动", "沿坝基内部软弱夹层滑动", "坝体自身材料破坏滑动", "沿坝基岩体完整面滑动", "", ""], "r": "B", "e": "坝基存在软弱夹层，软弱夹层是薄弱部位，最易沿此发生滑动。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400910", "t": 1, "q": "水电站运行中，\"负荷调整\"是重要操作，若电网要求水电站增加有功出力，在水轮机导叶开度调整过程中，下列哪个参数会首先发生变化？", "a": ["水轮机进口水头", "水轮机流量", "水轮机转速", "发电机端电压", "", ""], "r": "B", "e": "当电网要求水电站增加有功出力，调整水轮机导叶开度，导叶开度变化会直接使水轮机流量首先改变。而水头、转速和发电机端电压不会马上改变。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400911", "t": 1, "q": "在水电站引水隧洞设计中，为防止隧洞放空或充水时产生负压或明满流过渡的不利影响，通常需设置的设施是？", "a": ["通气孔", "排水孔", "检修闸门", "工作闸门", "", ""], "r": "A", "e": "通气孔可在隧洞放空或充水时平衡洞内气压，防止产生负压或明满流过渡等不利影响。排水孔主要用于排水；检修闸门用于检修时挡水；工作闸门控制水流。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400912", "t": 1, "q": "水轮机的效率曲线反映了效率随工况（水头、流量）的变化规律，下列关于水轮机效率的说法正确的是？", "a": ["水轮机的最高效率对应的工况一定是额定工况", "在部分负荷工况下，轴流式水轮机效率下降比混流式更平缓", "水轮机的水力效率主要受转轮和导叶的水力损失影响", "机械效率随转速升高而持续增大", "", ""], "r": "C", "e": "A选项，最高效率工况不一定是额定工况；B选项，部分负荷下混流式水轮机效率下降比轴流式平缓；D选项，机械效率并非随转速升高持续增大。而水轮机水力效率主要受转轮和导叶水力损失影响。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400913", "t": 1, "q": "某水电站的设计洪水位为100.00米，正常蓄水位为98.00米，死水位为90.00米，该水电站的兴利库容为以下哪项（兴利库容=正常蓄水位以下至死水位以上的水库容积）？", "a": ["100.00米对应库容-90.00米对应库容", "98.00米对应库容-90.00米对应库容", "100.00米对应库容-98.00米对应库容", "98.00米对应库容-85.00米对应库容", "", ""], "r": "B", "e": "根据兴利库容定义，是正常蓄水位以下至死水位以上的水库容积，本题正常蓄水位98.00米，死水位90.00米，所以兴利库容是98.00米对应库容减去90.00米对应库容。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400914", "t": 1, "q": "关于水轮机的气蚀破坏，下列说法正确的是？", "a": ["气蚀主要发生在水轮机转轮的出口侧", "气蚀会导致水轮机效率下降，但不会影响使用寿命", "提高水轮机安装高程可减轻气蚀破坏", "气蚀产生的原因是水流局部压力低于水的饱和蒸汽压", "", ""], "r": "D", "e": "气蚀是因水流局部压力低于水的饱和蒸汽压，水汽化形成气泡，气泡破裂产生冲击造成破坏。气蚀多发生在转轮进口侧，会降低效率、影响寿命，降低安装高程可减轻气蚀。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400915", "t": 1, "q": "水电站输电系统设计中，发电机发出的电能需通过变压器升压后送入电网，若发电机额定电压为10.5千伏，电网额定电压为220千伏，该变压器的变比（高压侧电压/低压侧电压）最接近以下哪项？", "a": ["220/10.5", "230/10.5", "220/11", "230/11", "", ""], "r": "D", "e": "变压器变比是高压侧电压与低压侧电压之比。发电机额定电压10.5kV是低压侧，电网额定电压220kV，但考虑输电线路电压损耗，变压器高压侧要比电网额定电压高5%左右，即220×(1 + 5%) = 231kV，接近230kV；发电机电压等级对应下一级变压器低压侧常取11kV。所以变比接近230/11。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400916", "t": 1, "q": "在水电站坝体应力分析中，采用有限元法计算时，下列哪个因素对坝体最大主应力的影响最大？", "a": ["坝体混凝土的泊松比", "坝基岩体的弹性模量", "坝顶的活荷载", "水库的水位高度", "", ""], "r": "D", "e": "水库水位高度决定水压力大小，水压力是坝体主要受力，对坝体最大主应力影响最大；泊松比、坝基岩体弹性模量影响相对小；坝顶活荷载通常远小于水压力。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400917", "t": 1, "q": "水轮机的额定出力计算公式为P=9.81QHη（P为出力，单位千瓦;Q为流量，单位立方米/秒;H为水头，单位米;η为效率），若某水轮机额定水头为50米，额定流量为20立方米/秒，额定效率为0.9，其额定出力为？", "a": ["8829千瓦", "9810千瓦", "10791千瓦", "11772千瓦", "", ""], "r": "A", "e": "直接将H = 50米、Q = 20立方米/秒、η = 0.9代入公式P = 9.81QHη，可得P = 9.81×20×50×0.9 = 8829千瓦。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400918", "t": 1, "q": "水电站厂房的防洪设计中，需确定厂房的防洪标准，下列哪种厂房的防洪标准最高？", "a": ["坝后式厂房（与坝体共用挡水结构）", "引水式厂房（位于河道岸边）", "地下厂房（位于山体内部）", "河床式厂房（直接挡水）", "", ""], "r": "D", "e": "防洪标准与厂房挡水情况和重要性相关，直接挡水的厂房受洪水威胁大，需更高防洪标准。河床式厂房直接挡水，相比其他选项受洪水影响最直接，所以其防洪标准最高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400919", "t": 1, "q": "关于水电站调压室的布置位置，下列说法正确的是？", "a": ["调压室应布置在引水隧洞的上游端", "调压室与厂房之间的距离越远，对水锤的抑制效果越好", "当引水隧洞较长时，调压室应靠近厂房布置", "调压室的布置位置与引水系统的水头损失无关", "", ""], "r": "C", "e": "调压室靠近厂房布置可有效减小水锤压力，当引水隧洞较长时这样布置很有必要。A选项应靠近厂房而非上游端；B选项距离远抑制效果差；D选项布置位置与水头损失有关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637103496400920", "t": 1, "q": "水轮机转轮的设计中，需考虑水流在转轮内的能量转换，下列哪种转轮的能量转换主要发生在转轮叶片的进口至出口的流道内，且水流方向沿轴向变化？", "a": ["混流式转轮", "轴流式转轮", "冲击式转轮", "斜流式转轮", "", ""], "r": "B", "e": "轴流式转轮水流沿轴向流入和流出转轮，能量转换主要在转轮叶片进口至出口流道内，且水流方向沿轴向变化。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837696", "t": 2, "q": "坝式水电站的厂房布置形式多样，下列属于坝式水电站厂房布置特点的有？", "a": ["厂房通常靠近坝体，便于利用坝体挡水形成的水头", "需单独修建挡水建筑物来保护厂房", "厂房与坝体之间可能存在结构受力相互影响", "适合于水头较高、流量较大的河流", "水库的调节能力主要由坝体规模决定", ""], "r": "ACE", "e": "坝式水电站厂房靠近坝体利用水头，厂房与坝体结构受力相互影响，水库调节能力取决于坝体规模。而坝式水电站厂房利用坝体挡水，无需单独建挡水建筑物，且适合中低水头、大流量河流。答案：ACE", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837697", "t": 2, "q": "水轮机气蚀的危害主要包括以下哪些方面？", "a": ["导致水轮机转轮表面出现蜂窝状损坏", "增加水轮机的水力损失，降低运行效率", "产生强烈的振动和噪声，影响机组稳定运行", "提高水轮机的吸出高度，增加安装成本", "缩短水轮机的使用寿命，增加检修频率", ""], "r": "ABCE", "e": "气蚀会使转轮表面遭破坏成蜂窝状，增加水力损失、降低效率，引发振动和噪声影响稳定，还会缩短寿命、增加检修频率。而吸出高度与气蚀无关。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837699", "t": 2, "q": "在水电站坝体混凝土施工中，为控制温度裂缝，可采取的技术措施有？", "a": ["选用低热矿渣水泥", "在混凝土中掺加粉煤灰等掺合料", "采用分层浇筑、分层振捣的施工方法", "在混凝土内部设置冷却水管进行通水冷却", "提高混凝土的入仓温度", ""], "r": "ABCD", "e": "控制温度裂缝要降低水化热和混凝土温度。A选低热水泥、B掺粉煤灰可降低水化热；C分层浇筑利于散热；D内部通冷水可降温。而E提高入仓温度会加剧温度裂缝。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637105383837700", "t": 2, "q": "水轮机的主要性能参数包括以下哪些？", "a": ["额定水头", "额定流量", "额定转速", "磁极对数", "额定效率", ""], "r": "ABCE", "e": "水轮机主要性能参数反映其工作能力和效率等特性。额定水头、额定流量、额定转速、额定效率都是描述水轮机性能的关键参数。磁极对数主要与发电机相关，并非水轮机主要性能参数。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986496", "t": 3, "q": "坝式水电站的水头完全由坝体的高度决定，与水库的水位变化无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "坝式水电站水头受坝高和水库水位变化共同影响，水库水位变化会改变上下游水位差，进而影响水头。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986497", "t": 3, "q": "水轮机的气蚀系数越大，表明其抗气蚀性能越好，允许的吸出高度越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机气蚀系数越大，抗气蚀性能越差，允许吸出高度越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986498", "t": 3, "q": "水电站调压室的断面面积越大，水位波动的幅度越小，对水锤的抑制效果越好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "调压室断面面积大，能储存更多水量，可减小水位波动幅度，更好地缓冲水锤压力变化，抑制水锤效果好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986499", "t": 3, "q": "混流式水轮机的转轮叶片角度可以调节，以适应不同的水头和流量工况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混流式水轮机转轮叶片是固定的，不能调节，轴流式水轮机转轮叶片才可以调节以适应不同工况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986500", "t": 3, "q": "水电站地下厂房因位于山体内部，受洪水威胁小，故无需进行防洪设计。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然水电站地下厂房位于山体内部，受洪水直接威胁小，但仍可能因山体汇水、地下水涌入、排水系统故障、上游水库溃坝等因素面临洪水风险，所以仍需进行防洪设计。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986502", "t": 3, "q": "水电站坝基固结灌浆的主要作用是形成防渗帷幕，阻止水库水向坝下游渗透。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水电站坝基固结灌浆主要作用是提高基岩的整体性和强度，改善基岩的力学性能，而形成防渗帷幕、阻止水库水向坝下游渗透是帷幕灌浆的作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986503", "t": 3, "q": "水电站日调节水库的调节周期为24小时，可在日内根据电网负荷变化调整水库的放水量和蓄水量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "日调节水库调节周期就是24小时，能按电网负荷变化在一天内对水库放水量和蓄水量进行调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986504", "t": 3, "q": "水轮机导叶关闭时间越长，产生的水锤压力越大，对引水系统的危害越严重。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机导叶关闭时间越长，水锤压力越小，因为延长关闭时间可使水流流速变化趋缓，减小水锤压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986509", "t": 3, "q": "水轮机的飞逸转速是指水轮机在导叶全开、无负荷工况下的最大转速，是水轮机设计的重要控制参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机飞逸转速就是在导叶全开、无负荷工况时的最大转速，它对水轮机设计意义重大，是重要控制参数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986510", "t": 3, "q": "水电站坝体的扬压力是由水库水渗透产生的向上的压力，会减小坝体的有效重量，降低坝基的抗滑稳定安全系数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水电站坝体扬压力确实是水库水渗透产生向上压力，它会使坝体有效重量减小，进而降低坝基抗滑稳定安全系数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986511", "t": 3, "q": "水电站调压室应布置在引水隧洞的上游端，以最大限度地缩短水锤波传递至厂房的距离。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "调压室应布置在引水隧洞的下游靠近厂房处，这样才能有效反射水锤波，减少水锤压力对厂房的影响，而不是布置在引水隧洞上游端。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637106746986512", "t": 3, "q": "水轮机的水力效率主要取决于转轮和导叶的水力设计，与水轮机的安装精度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机安装精度会影响水流在水轮机内的流动状态等，对水力效率有影响，所以题干说与安装精度无关错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K08", "n": "知识点08  抽水蓄能电站基础", "qs": [{"id": "2035637109485867008", "t": 1, "q": "抽水蓄能电站在抽水工况下，水泵水轮机从下水库抽水至上水库时，其能量转换过程是以下哪种？", "a": ["电能→水能→机械能", "电能→机械能→水能", "水能→机械能→电能", "机械能→电能→水能", "", ""], "r": "B", "e": "抽水时，先将电能转化为水泵水轮机的机械能，再通过水泵水轮机将水从下水库抽到上水库，把机械能转化为水的势能（水能），所以能量转换过程是电能→机械能→水能，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867009", "t": 1, "q": "某抽水蓄能电站上水库正常蓄水位为800米，下水库死水位为400米，该电站的最大毛水头最接近以下哪个数值？", "a": ["350米", "400米", "450米", "500米", "", ""], "r": "B", "e": "电站最大毛水头是上水库正常蓄水位与下水库死水位的差值，即800 - 400 = 400米。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867010", "t": 1, "q": "抽水蓄能电站中，以下哪种机组类型最适用于需要快速响应电网调频、调峰需求的场景？", "a": ["混流式水泵水轮机", "轴流式水泵水轮机", "斜流式水泵水轮机", "贯流式水泵水轮机", "", ""], "r": "A", "e": "混流式水泵水轮机应用广泛，启动迅速、调节灵活，能很好满足电网快速调频、调峰需求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867011", "t": 1, "q": "抽水蓄能电站在运行过程中，\"水锤效应\"易发生在以下哪个工况转换瞬间？", "a": ["抽水工况稳定运行时", "发电工况稳定运行时", "从抽水工况转为发电工况时", "水库水位稳定时", "", ""], "r": "C", "e": "“水锤效应”是由于流速突然变化引起压强急剧变化的现象。在工况转换瞬间流速会有较大改变。A、B选项稳定运行时流速相对稳定；D选项水库水位稳定与流速突变无关；C选项从抽水工况转为发电工况，水流方向和流速会瞬间改变，易引发“水锤效应”。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867012", "t": 1, "q": "某抽水蓄能电站下水库为日调节水库，其主要作用是以下哪项？", "a": ["调节多年来水变化，保证电站长期运行", "调节日内抽水与发电的水量平衡，满足日负荷需求", "调节季节来水变化，保证枯水期发电", "储存洪水，防止下游洪涝灾害", "", ""], "r": "B", "e": "日调节水库主要针对日内情况，抽水蓄能电站下水库可调节日内抽水与发电的水量平衡，满足日负荷需求。A项针对多年，C项针对季节，D项并非下水库主要作用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867013", "t": 1, "q": "抽水蓄能电站机组的\"S特性曲线\"主要用于分析以下哪项内容？", "a": ["机组效率随水头的变化规律", "机组流量随转速的变化规律", "机组在抽水和发电工况下的稳定运行范围", "机组出力随水位的变化规律", "", ""], "r": "C", "e": "“S特性曲线”反映了水泵水轮机在某些工况下流量、转速、力矩等参数间关系，主要用来分析机组在抽水和发电工况下的稳定运行范围。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867014", "t": 1, "q": "以下哪种地质条件最不适宜建设抽水蓄能电站的上水库？", "a": ["完整的花岗岩地层", "厚层状石灰岩地层（无溶洞）", "破碎的页岩地层（存在裂隙渗水）", "致密的玄武岩地层", "", ""], "r": "C", "e": "抽水蓄能电站上水库需有良好的蓄水条件，不能有大量渗漏。破碎的页岩地层存在裂隙渗水，无法有效蓄水，不适宜建设上水库。而完整花岗岩、无溶洞厚层石灰岩、致密玄武岩地层蓄水条件相对较好。所以答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867015", "t": 1, "q": "抽水蓄能电站在发电工况下，水泵水轮机的导叶开度调节主要目的是以下哪项？", "a": ["控制上水库水位", "调节机组出力，适应电网负荷变化", "防止机组发生气蚀", "控制下水库水位", "", ""], "r": "B", "e": "抽水蓄能电站发电时，导叶开度改变可调节进入水轮机的水量，进而调节机组出力，以适应电网负荷变化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867016", "t": 1, "q": "某抽水蓄能电站的综合效率（发电效率与抽水效率的乘积）为75%，若抽水时消耗1000万千瓦时电能，其发电时最多可向电网输送的电能约为多少？", "a": ["650万千瓦时", "700万千瓦时", "750万千瓦时", "800万千瓦时", "", ""], "r": "C", "e": "已知综合效率为75%，抽水消耗1000万千瓦时电能，根据综合效率定义，发电输送电能 = 抽水消耗电能×综合效率，即1000×75% = 750万千瓦时。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867017", "t": 1, "q": "抽水蓄能电站中，用于防止水泵水轮机在抽水工况下发生\"喘振\"的关键设备是以下哪项？", "a": ["主变压器", "调压阀", "励磁系统", "调速器", "", ""], "r": "B", "e": "水泵水轮机抽水工况“喘振”会影响机组稳定，调压阀可调节流量和压力，防止喘振发生。主变压器用于变压，励磁系统提供磁场，调速器调节转速，它们与防止喘振无直接关联。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867018", "t": 1, "q": "以下关于抽水蓄能电站与常规水电站的区别，说法正确的是哪项？", "a": ["两者均以天然来水为主要水源", "抽水蓄能电站无需考虑防洪功能，常规水电站必须考虑", "抽水蓄能电站存在抽水工况，需消耗电能，常规水电站无此工况", "两者的机组类型完全相同", "", ""], "r": "C", "e": "常规水电站靠天然来水发电，抽水蓄能电站有抽水和发电两种工况，抽水时消耗电能；A选项抽水蓄能电站不是以天然来水为主要水源；B选项抽水蓄能电站也可能需考虑防洪；D选项两者机组类型不同。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867019", "t": 1, "q": "抽水蓄能电站上水库的\"死水位\"是指以下哪个水位？", "a": ["上水库允许的最高蓄水位", "上水库在正常运行中，为保证水泵吸水不发生气蚀，不允许低于的最低水位", "上水库在洪水期允许临时达到的最高水位", "上水库每年平均蓄水位", "", ""], "r": "B", "e": "“死水位”是水库在正常运行时不允许低于的最低水位，目的之一是保证水泵吸水不发生气蚀。A是正常蓄水位；C是防洪高水位；D不是死水位概念。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867020", "t": 1, "q": "抽水蓄能电站机组在\"调相工况\"下的主要作用是以下哪项？", "a": ["向电网输送有功功率", "从电网吸收有功功率", "向电网提供无功功率，改善电网功率因数", "调节水库水位", "", ""], "r": "C", "e": "调相工况主要是为电网提供无功功率，改善功率因数。A输送有功功率不是调相工况主要作用；B吸收有功功率也并非调相主要目的；D调节水库水位与调相工况无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867021", "t": 1, "q": "以下哪种因素对抽水蓄能电站的抽水效率影响最大？", "a": ["上水库的淤积程度", "下水库的水温", "水泵水轮机的进口真空度", "主变压器的容量", "", ""], "r": "C", "e": "水泵水轮机是抽水蓄能电站抽水的关键设备，其进口真空度直接影响水泵水轮机的性能和运行效率，对抽水效率影响最大。上水库淤积、下水库水温对抽水效率影响相对小，主变压器容量主要影响电力传输等，和抽水效率直接关联不大。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867022", "t": 1, "q": "抽水蓄能电站的\"输水系统\"不包括以下哪个部分？", "a": ["引水隧洞", "尾水隧洞", "压力钢管", "发电机定子", "", ""], "r": "D", "e": "输水系统是用于输送水流的结构，引水隧洞、尾水隧洞、压力钢管都和水流输送相关，而发电机定子是发电机的部件，不属于输水系统。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867023", "t": 1, "q": "某抽水蓄能电站在设计时，需考虑\"最小水头\"，其主要目的是以下哪项？", "a": ["保证机组在抽水工况下不发生喘振", "保证机组在发电工况下达到额定出力", "保证上水库有足够的防洪库容", "保证下水库有足够的死库容", "", ""], "r": "B", "e": "设计时考虑​最小水头​，核心目的是确保机组在​发电工况​下，即使水头最低时，仍能发出​额定出力​，满足电网调度要求。<br />​A选项​：喘振主要与水泵水轮机的“S”特性区及启动工况相关，并非最小水头的主要设计目的。​C、D选项​：涉及水库库容，属于​水库运行​设计范畴，与机组水头参数无直接关联。", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867024", "t": 1, "q": "以下关于抽水蓄能电站\"黑启动\"能力的说法，正确的是哪项？", "a": ["黑启动能力是指电站在电网完全停电时，无需外部电源即可自行启动发电的能力", "抽水蓄能电站无黑启动能力，必须依赖外部电源启动", "黑启动能力仅需考虑发电工况，无需考虑抽水工况", "黑启动能力主要依赖主变压器的备用电源", "", ""], "r": "A", "e": "抽水蓄能电站的黑启动能力就是在电网完全停电时，能不依靠外部电源自行启动发电。B选项与事实不符；C项黑启动要考虑发电和抽水工况；D项黑启动不是依赖主变压器备用电源。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867025", "t": 1, "q": "抽水蓄能电站中，\"球阀\"通常安装在以下哪个位置，主要作用是快速切断水流？", "a": ["引水隧洞进口", "压力钢管靠近机组进口处", "尾水隧洞出口", "水库溢洪道出口", "", ""], "r": "B", "e": "球阀安装在压力钢管靠近机组进口处，可在紧急情况时快速切断水流，保护机组。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867026", "t": 1, "q": "以下哪种指标可直接反映抽水蓄能电站对电网调峰能力的贡献？", "a": ["电站的总装机容量", "电站的年发电量", "电站的日调节容量", "电站的水库总库容", "", ""], "r": "C", "e": "调峰能力主要看电站在一定时间内可调节的电量，日调节容量能直接体现电站在一天内可用于调节电网峰谷的电量，反映对电网调峰能力的贡献。总装机容量只是电站发电设备的能力；年发电量是一年的发电总量，不能直接反映调峰；水库总库容与调峰能力无直接关联。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867027", "t": 1, "q": "抽水蓄能电站在抽水工况下，若电网电压升高，对水泵水轮机的运行会产生以下哪种影响？", "a": ["水泵转速升高，抽水流量增加", "水泵转速降低，抽水流量减少", "水泵效率升高", "水泵气蚀风险降低", "", ""], "r": "A", "e": "电网电压升高，水泵水轮机输入功率增大，转速升高，流量增加。而电压升高不一定使效率升高，且转速和流量增加会增大气蚀风险。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867028", "t": 1, "q": "以下关于抽水蓄能电站上水库防渗措施的说法，错误的是哪项？", "a": ["沥青混凝土防渗面板适用于岩质库岸", "土工膜防渗适用于地形复杂、坡度较陡的库岸", "混凝土防渗墙适用于覆盖层较厚的库底", "帷幕灌浆适用于岩石裂隙发育的库岸", "", ""], "r": "B", "e": "土工膜防渗一般适用于地形平缓的库岸，地形复杂、坡度较陡时土工膜施工难度大且易损坏，B选项说法错误。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867029", "t": 1, "q": "抽水蓄能电站机组的\"飞逸转速\"是指以下哪种情况的转速？", "a": ["机组在发电工况下，导叶全开、负荷突然甩去时的最大转速", "机组在抽水工况下，电源突然切断时的最大转速", "机组在调相工况下的额定转速", "机组在安装调试时的最高试验转速", "", ""], "r": "A", "e": "飞逸转速是指水轮发电机组在发电工况下，导叶全开、负荷突然甩去时达到的最大转速。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867030", "t": 1, "q": "某抽水蓄能电站的上水库为年调节水库，其调节周期内的水位变化主要受以下哪种因素影响？", "a": ["日内电网负荷波动", "周内电网负荷波动", "季节间电网负荷变化和来水变化", "日内水库蒸发和渗漏损失", "", ""], "r": "C", "e": "年调节水库是按年度进行水量调节，要考虑一年中不同季节情况。季节间电网负荷变化需要通过水库调节来满足，同时来水变化也会影响水库水位，所以其水位变化主要受季节间电网负荷变化和来水变化影响。而日内、周内的负荷波动时间尺度小，不是年调节水库主要考虑因素；日内水库蒸发和渗漏损失影响较小。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637109485867031", "t": 1, "q": "抽水蓄能电站中，用于将发电机发出的电能升压后送入电网的设备是以下哪项？", "a": ["励磁变压器", "主变压器", "厂用变压器", "电抗器", "", ""], "r": "B", "e": "主变压器的作用是将发电机发出的电能升压后送入电网。而励磁变压器为发电机励磁系统提供电源；厂用变压器为厂内设备供电；电抗器主要用于限制短路电流等。所以答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943680", "t": 2, "q": "抽水蓄能电站选址需综合考虑多种因素，以下属于选址关键因素的有哪些？（　）", "a": ["上下水库的地形条件（高差、距离）", "区域电网的负荷特性（峰谷差、调频需求）", "库区的地质条件（防渗、稳定性）", "当地的旅游资源分布", "水源的充足性（循环利用可行性）", ""], "r": "ABCE", "e": "抽水蓄能电站选址关键在于满足发电和运行需求。上下水库地形影响发电效率；区域电网负荷特性决定其调峰调频作用；库区地质条件关系到电站安全稳定；水源充足是循环发电的基础。而当地旅游资源分布与电站功能无关。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943681", "t": 2, "q": "抽水蓄能电站的主要建筑物包括以下哪些部分？（　）", "a": ["上水库及坝体", "下水库及坝体", "输水系统（引水、尾水隧洞、压力钢管）", "厂房（主机房、副厂房）", "升压站", ""], "r": "ABCDE", "e": "抽水蓄能电站由上水库、下水库、输水系统、厂房、升压站等主要部分组成。A上水库及坝体、B下水库及坝体、C输水系统、D厂房、E升压站都是其主要建筑物。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943682", "t": 2, "q": "以下哪些运行特性使抽水蓄能电站成为电网优质的调峰电源？（　）", "a": ["启动速度快（分钟级）", "出力调节范围大（0-额定出力）", "运行效率高（综合效率70%-80%）", "可实现双向能量转换（抽水蓄能、发电释能）", "无需消耗天然水资源", ""], "r": "ABCD", "e": "抽水蓄能电站能成为优质调峰电源，因其启动快可快速响应电网需求，出力调节范围大便于灵活适应负荷变化，双向能量转换可按需抽水或发电，运行效率较高保障能源利用。而是否消耗天然水资源并非调峰关键特性。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637111343943683", "t": 2, "q": "抽水蓄能电站水泵水轮机在运行中可能发生的故障类型有哪些？（　）", "a": ["气蚀", "喘振", "飞逸", "漏油", "绝缘老化", ""], "r": "ABC", "e": "答案：ABC抽水蓄能电站水泵水轮机在运行中可能气蚀、喘振和飞逸等故障。", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509568", "t": 3, "q": "抽水蓄能电站在抽水工况下，消耗的电能全部转化为上水库的势能储存起来，无能量损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实际中能量转化过程存在各种损耗，如机械摩擦、电流热效应等，抽水蓄能电站抽水时消耗的电能不可能全部转化为上水库势能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509569", "t": 3, "q": "抽水蓄能电站的毛水头等于上水库水位与下水库水位的差值，与输水管道的水头损失无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站毛水头就是上水库水位与下水库水位的差值，不考虑输水管道水头损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509571", "t": 3, "q": "抽水蓄能电站的调压井主要作用是缓冲输水管道中的水锤压力，保护管道和机组。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站中，当水流速变化时会产生水锤压力，调压井可有效缓冲这种压力，避免对管道和机组造成损害。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509572", "t": 3, "q": "抽水蓄能电站上水库的正常蓄水位越高，电站的最大出力越大（其他条件不变时）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据抽水蓄能电站出力公式，出力与水头相关，正常蓄水位越高，水头越大，在其他条件不变时，电站最大出力越大。", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509573", "t": 3, "q": "抽水蓄能电站的综合效率是发电效率与抽水效率的比值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站综合效率是发电电量与抽水耗电量的比值，并非发电效率与抽水效率的比值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509574", "t": 3, "q": "调相工况下，抽水蓄能机组既不向电网输送有功功率，也不从电网吸收有功功率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "调相工况下，抽水蓄能机组主要作用是调节电网无功功率，理论上不向电网输送或从电网吸收有功功率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509575", "t": 3, "q": "抽水蓄能电站的下水库死水位设置过低，会导致水泵抽水时发生气蚀。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "下水库死水位过低，水泵进口压力会降低，当压力降低到水的汽化压力时，水会汽化形成气泡，气泡破裂会引发气蚀。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509576", "t": 3, "q": "抽水蓄能电站的机组启动速度越快，对电网调频的响应能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站机组启动速度快，就能更迅速地调整发电功率，可及时响应电网频率变化，增强对电网调频的响应能力。", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509577", "t": 3, "q": "抽水蓄能电站的输水管道采用钢筋混凝土衬砌，主要目的是提高管道的抗冲刷能力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站输水管道用钢筋混凝土衬砌，主要目的是提高管道的整体性、耐久性、抗渗性等，提高抗冲刷能力不是主要目的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509578", "t": 3, "q": "抽水蓄能电站的库容系数越大，其适应电网负荷波动的能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "库容系数大意味着电站能存储更多能量，可在电网负荷变化时更好地调节，增强适应电网负荷波动能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509580", "t": 3, "q": "抽水蓄能电站与光伏电站协同运行时，光伏出力过剩时，抽水蓄能电站启动抽水工况吸收多余电能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当光伏出力过剩，意味着有多余的电能，抽水蓄能电站可启动抽水工况，把水从下水库抽到上水库，将多余电能转化为水的势能储存起来。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637112694509581", "t": 3, "q": "抽水蓄能电站的主变压器位于厂房内，与发电机直接连接。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站主变压器一般布置在室外，并非厂房内。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K09", "n": "知识点09  拱坝、重力坝和水闸等设计", "qs": [{"id": "2035637115362086912", "t": 1, "q": "在拱坝设计中，当坝址处河谷宽高比小于2.5，且地基岩性均一、完整时，下列哪种拱坝体型更有利于发挥拱的传力作用，减少坝体应力集中？", "a": ["单曲拱坝", "双曲拱坝", "圆筒形拱坝", "抛物线形拱坝", "", ""], "r": "B", "e": "宽高比小且地基好时，双曲拱坝能更好适应地形地质条件，发挥拱传力作用，减少应力集中。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086913", "t": 1, "q": "重力坝抗滑稳定计算中，若坝基存在缓倾角软弱夹层，且夹层内摩擦系数f=0.25，黏聚力c=15kPa，此时采用下列哪种计算方法更能准确反映坝体沿软弱夹层的滑动趋势？", "a": ["单一安全系数法（抗剪断公式）", "单一安全系数法（抗剪公式）", "分项系数极限状态法（持久状况）", "有限元法（渗流-应力-稳定耦合分析）", "", ""], "r": "A", "e": "对于存在缓倾角软弱夹层且给出内摩擦系数和黏聚力的情况，抗剪公式仅考虑摩擦力，抗剪断公式能综合考虑摩擦力和黏聚力，更符合实际，单一安全系数法（抗剪断公式）可较准确反映坝体沿软弱夹层滑动趋势。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086914", "t": 1, "q": "水闸闸室稳定计算中，当闸室地基为不均匀的双层地基（上层为3m厚的粉质黏土，下层为微风化砂岩），在正常蓄水位下，控制闸室稳定的主要不利因素是（　）", "a": ["闸基不均匀沉降导致的闸室倾斜", "上层粉质黏土的渗透变形", "下层砂岩的压缩变形", "闸室自重不足导致的浮起", "", ""], "r": "A", "e": "双层地基上层粉质黏土较薄且下层为微风化砂岩，地基不均匀易使闸室出现不均匀沉降致倾斜，这是控制稳定的主要不利因素。B选项上层3m厚粉质黏土一般不易渗透变形；C选项微风化砂岩压缩变形小；D选项题干未体现闸室自重不足情况。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086915", "t": 1, "q": "拱坝坝体温度应力计算中，\"封拱温度\"是关键参数，下列关于封拱温度的确定原则，正确的是（　）", "a": ["封拱温度应等于坝体运行期的最高平均温度，以减少温降应力", "封拱温度应低于坝体运行期的最低平均温度，以避免温升应力", "封拱温度应接近坝体运行期的年平均温度，使温降和温升应力均较小", "封拱温度由施工进度决定，与运行期温度无关", "", ""], "r": "C", "e": "封拱温度接近坝体运行期年平均温度时，坝体温降和温升应力都较小，有利于坝体稳定和安全。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086916", "t": 1, "q": "重力坝坝体混凝土分区设计中，下列哪个区域的混凝土强度等级最高、抗渗性和抗冻性要求最严格？", "a": ["坝体上游面表层混凝土（水位变动区）", "坝体下游面表层混凝土（干燥区）", "坝体内部混凝土（非溢流段）", "坝基垫层混凝土（与基岩接触段）", "", ""], "r": "A", "e": "坝体上游面水位变动区混凝土受水位变化、冻融等影响大，需高强度、高抗渗和抗冻性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086917", "t": 1, "q": "水闸消能防冲设计中，当闸下尾水深度较浅，且下游河床为砂卵石地基时，下列哪种消能方式更适合避免河床冲刷破坏？", "a": ["底流消能（消力池）", "挑流消能", "面流消能", "消力戽消能", "", ""], "r": "A", "e": "尾水浅、砂卵石地基，底流消能（消力池）可在池内形成水跃，消耗能量，适应这种情况避免河床冲刷。挑流消能适用于较坚硬岩石地基；面流消能适用于下游尾水较深且变幅较小情况；消力戽消能要求下游有一定水深。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086918", "t": 1, "q": "拱坝地基处理中，若坝基存在走向与坝轴线平行的断层破碎带，且破碎带宽度为5m，充填物为泥质角砾岩，下列哪种处理措施最有效？", "a": ["断层破碎带开挖置换为混凝土塞", "在破碎带上下游打排水孔", "对破碎带进行高压喷射灌浆防渗", "在破碎带表面铺设钢筋网加固", "", ""], "r": "A", "e": "对于走向与坝轴线平行且宽度5m、充填泥质角砾岩的断层破碎带，开挖置换为混凝土塞能有效增强坝基的整体性和承载能力，从根本上处理问题。排水孔主要解决渗流问题；高压喷射灌浆防渗多用于处理较细颗粒土层的防渗；铺设钢筋网加固难以解决破碎带内部的不良特性。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086919", "t": 1, "q": "重力坝溢流面曲线设计中，为保证水流平顺、不产生负压，溢流面的下游段通常采用哪种曲线形式？", "a": ["抛物线", "圆弧线", "幂函数曲线（渥奇曲线）", "直线", "", ""], "r": "C", "e": "重力坝溢流面下游段用幂函数曲线（渥奇曲线）可使水流平顺且不产生负压。抛物线、圆弧线、直线难以很好满足此要求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086920", "t": 1, "q": "水闸地下轮廓线设计中，\"防渗长度\"的确定需满足《水闸设计规范》要求，下列关于防渗长度的计算原则，正确的是（　）", "a": ["防渗长度等于闸室底板长度与上下游防渗设施长度之和，且需大于等于允许渗径长度", "防渗长度仅指闸室底板的水平长度，与上下游设施无关", "防渗长度等于上游铺盖长度与下游排水长度之和", "防渗长度由地基渗透系数决定，与水头无关", "", ""], "r": "A", "e": "水闸防渗长度是闸室底板长度与上下游防渗设施长度之和，且要大于等于允许渗径长度。B选项未考虑上下游防渗设施；C选项概念错误；D选项防渗长度与水头有关。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086921", "t": 1, "q": "拱坝坝肩稳定分析中，若坝肩岩体存在两组结构面，一组走向与坝轴线夹角30°，倾角60°，另一组走向与坝轴线夹角120°，倾角50°，此时判断坝肩是否滑动，需重点分析的滑动面是（　）", "a": ["两组结构面的交线形成的楔形滑动体", "第一组结构面（30°夹角）单独形成的滑动面", "第二组结构面（120°夹角）单独形成的滑动面", "坝肩岩体的层面滑动面", "", ""], "r": "A", "e": "当坝肩岩体存在两组结构面时，通常需重点分析两组结构面交线形成的楔形滑动体的稳定性。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086922", "t": 1, "q": "重力坝采用混凝土重力墩作为岸坡连接结构时，若岸坡坡度为1:0.5（垂直:水平），且墩高30m，下列关于重力墩设计的关键要求，错误的是（　）", "a": ["重力墩需验算沿基岩面的抗滑稳定", "重力墩应设置伸缩缝，间距不大于20m", "重力墩的混凝土强度等级应不低于C25", "重力墩需与坝体整体浇筑，不设沉降缝", "", ""], "r": "D", "e": "重力墩与坝体一般设沉降缝，D选项说不设沉降缝错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086924", "t": 1, "q": "拱坝荷载组合中，下列哪种荷载组合属于\"特殊荷载组合\"（对应持久状况下的偶然组合）？", "a": ["自重+静水压力+扬压力+温度荷载", "自重+静水压力+扬压力+地震荷载", "自重+静水压力+扬压力+校核洪水位水压力", "自重+静水压力+扬压力+冰压力", "", ""], "r": "B", "e": "特殊荷载组合包含偶然出现的荷载，地震属于偶然作用，校核洪水位水压力是非常工况下才有的，B选项含地震荷载、C选项含校核洪水位水压力属于特殊荷载组合。但规范中典型特殊组合常提及自重、静水压力、扬压力和地震荷载。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086925", "t": 1, "q": "重力坝坝基排水设计中，若坝基为花岗岩，存在细微裂隙，为降低坝基扬压力，下列哪种排水系统布置更合理？", "a": ["在坝基上游侧设置一排主排水孔，孔深进入基岩3m", "在坝基下游侧设置一排主排水孔，孔深进入基岩5m", "在坝基上下游侧分别设置主排水孔和辅助排水孔，主孔深5m，辅助孔深2m", "在坝基中部设置单排排水孔，孔深进入基岩4m", "", ""], "r": "C", "e": "花岗岩细微裂隙需有效降低扬压力，上下游侧设主、辅排水孔能更好形成排水网络，增强排水效果。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086926", "t": 1, "q": "水闸上游铺盖设计中，当铺盖材料为沥青混凝土，闸室水头为8m，地基渗透系数为1×10^-4cm/s，下列关于铺盖长度的确定，正确的是（　）", "a": ["铺盖长度应不小于8m（1倍水头）", "铺盖长度应不小于16m（2倍水头）", "铺盖长度应根据允许渗径长度计算，且不小于20m", "铺盖长度由施工能力决定，与水头无关", "", ""], "r": "C", "e": "沥青混凝土铺盖长度应根据允许渗径长度计算，且不小于20m。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086928", "t": 1, "q": "重力坝溢流坝段设计中，若溢流孔口宽度为8m，孔数为5孔，采用弧形闸门控制，下列关于闸门启闭设备布置的要求，错误的是（　）", "a": ["启闭机应布置在坝顶，避开坝体伸缩缝", "启闭机的启闭力应考虑闸门自重、水压力和摩阻力", "相邻闸门的启闭机间距应不小于1.5m，便于操作", "启闭机应与坝体固结，不设减震装置", "", ""], "r": "D", "e": "在有震动等情况下，启闭机设减震装置可保证运行安全，D选项不设减震装置错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086929", "t": 1, "q": "水闸下游翼墙设计中，当下游河道为弯曲河道，翼墙与河道的衔接应满足（　）", "a": ["翼墙轴线应与河道主流方向一致，减少水流扰动", "翼墙轴线应与闸室轴线垂直，保证结构稳定", "翼墙采用折线形，折线角度不大于30°", "翼墙采用直线形，长度不小于闸室宽度的1/2", "", ""], "r": "A", "e": "在水闸下游翼墙设计中，若下游是弯曲河道，为减少水流扰动，翼墙轴线应与河道主流方向一致。B选项与闸室轴线垂直和衔接河道无关；C选项的折线形及角度要求不针对弯曲河道衔接；D选项直线形及长度规定也不符合弯曲河道衔接需求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086930", "t": 1, "q": "拱坝坝基开挖深度的确定，主要依据是（　）", "a": ["坝体高度，开挖深度为坝高的1/10", "地基风化程度，开挖至微风化或新鲜基岩", "施工设备能力，开挖深度不超过10m", "河谷宽度，开挖深度与河谷宽度成正比", "", ""], "r": "B", "e": "拱坝坝基需有足够承载能力和稳定性，要开挖至微风化或新鲜基岩以满足要求。A中按坝高定开挖深度不准确；C施工设备能力不是主要依据；D开挖深度与河谷宽度无此正比关系。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086931", "t": 1, "q": "重力坝混凝土浇筑中，为防止出现温度裂缝，采用\"分层分块\"浇筑，下列关于分层厚度的确定，正确的是（　）", "a": ["分层厚度由混凝土初凝时间决定，不大于浇筑强度×初凝时间", "分层厚度应不大于钢筋最小净距的2倍", "分层厚度应不大于混凝土浇筑振捣器的有效振捣深度（一般30-50cm）", "分层厚度由坝体高度决定，不大于坝高的1/5", "", ""], "r": "C", "e": "在重力坝混凝土浇筑过程中，为防止温度裂缝，采取“分层分块”浇筑方法。关于分层厚度的确定，各选项分析如下：A选项提到分层厚度由混凝土初凝时间决定。这并非直接决定因素，因为分层厚度更多地与施工操作和混凝土的振捣效果有关。B选项指出分层厚度应不大于钢筋最小净距的2倍。这虽然是一个考虑因素，但不是决定分层厚度的主要标准。C选项说明分层厚度应不大于混凝土浇筑振捣器的有效振捣深度（一般30-50cm）。这是确保混凝土能够均匀振捣、减少内部空隙和裂缝的关键因素。因此，这个选项描述是正确的。D选项提出分层厚度由坝体高度决定，不大于坝高的1/5。这并非一个实际操作中的决定性因素，更多是与整体施工规划相关。综上所述，C选项正确描述了分层厚度的确定原则，即应不大于混凝土浇筑振捣器的有效振捣深度。所以，正确答案是C选项：“分层厚度应不大于混凝土浇筑振捣器的有效振捣深度（一般30-50cm）”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086932", "t": 1, "q": "水闸闸墩设计中，当闸室为3孔，每孔净宽10m，闸墩厚度为1.5m，下列关于闸墩强度计算的荷载，不需要考虑的是（　）", "a": ["闸门传来的水压力", "闸墩自重", "闸室底板传来的地基反力", "温度应力", "", ""], "r": "C", "e": "闸墩强度计算主要考虑自身受力，地基反力是作用在闸室底板上，并非闸墩直接承受的主要荷载。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086933", "t": 1, "q": "拱坝泄洪建筑物设计中，若坝址处河谷狭窄，且需避免泄洪水流对坝肩岩体冲刷，下列哪种泄洪方式最适合？", "a": ["坝身孔口泄洪（中孔或底孔）", "岸边溢洪道泄洪", "坝顶溢洪道泄洪", "隧洞泄洪", "", ""], "r": "A", "e": "A 坝身孔口泄洪（中孔 / 底孔）**：适合狭窄河谷；水流从坝身孔口射出，水舌抛向河床中央，远离两岸坝肩岩体，避免冲刷坝肩。<br />B 岸边溢洪道：需要两岸有足够布置场地，河谷狭窄条件下布置困难，出流靠近岸边易冲刷坝肩。<br />C 坝顶溢洪：水流沿坝下泄，易冲击坝趾，水舌容易偏向两岸冲刷坝肩岩体。<br />D 隧洞泄洪：造价高，多用于高坝大库作为辅助泄洪，不是本题最优。", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086934", "t": 1, "q": "重力坝抗浮稳定计算中，若坝体排水系统失效，坝基扬压力系数会（　）", "a": ["增大，导致抗浮稳定安全系数降低", "减小，导致抗浮稳定安全系数降低", "增大，导致抗浮稳定安全系数提高", "减小，导致抗浮稳定安全系数提高", "", ""], "r": "A", "e": "坝体排水系统失效，坝基扬压力增大，扬压力系数也增大。扬压力增大使坝体抗浮稳定的不利作用增强，抗浮稳定安全系数降低。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086935", "t": 1, "q": "水闸护坦设计中，当闸下泄流量为500立方米每秒，护坦材料为C30混凝土，下列关于护坦厚度的确定，主要依据是（　）", "a": ["水流脉动压力产生的弯曲应力", "护坦自重产生的压应力", "地基不均匀沉降产生的拉应力", "温度变化产生的温度应力", "", ""], "r": "A", "e": "水闸护坦厚度主要考虑水流脉动压力产生的弯曲应力。当闸下泄流量较大时，水流脉动压力对护坦结构影响显著，会使护坦承受弯曲应力，是确定护坦厚度的关键因素。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086936", "t": 1, "q": "拱坝坝体廊道设计中，为满足坝体观测、检修和排水要求，下列关于廊道布置的说法，正确的是（　）", "a": ["基础廊道应布置在坝体上游1/3高度处，平行于坝轴线", "水平廊道应每隔20-30m设置一层，每层廊道需贯通整个坝体", "廊道断面尺寸应满足人员通行，宽度不小于1.2m，高度不小于2.0m", "廊道与坝体混凝土应分开浇筑，避免影响坝体整体性", "", ""], "r": "C", "e": "基础廊道一般布置在坝踵附近，A错误；水平廊道设置间隔及是否贯通要根据实际情况，B错误；廊道应与坝体混凝土同时浇筑，D错误；廊道需满足人员通行，宽度不小于1.2m，高度不小于2.0m，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637115362086937", "t": 1, "q": "重力坝坝体伸缩缝设计中，伸缩缝的间距应根据混凝土浇筑温度、坝体长度和混凝土收缩特性确定，下列关于伸缩缝间距的说法，错误的是（　）", "a": ["混凝土浇筑温度为15-20℃时，伸缩缝间距可采用20-30m", "采用低热水泥混凝土时，伸缩缝间距可适当增大至30-40m", "溢流坝段伸缩缝间距应比非溢流坝段小，一般不大于20m", "伸缩缝间距越大，坝体温度应力越小", "", ""], "r": "D", "e": "伸缩缝间距越大，坝体温度变化时约束越大，温度应力越大，D选项说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249024", "t": 2, "q": "拱坝设计中，影响拱坝体型的主要因素包括（　）", "a": ["河谷形状（宽高比、两岸坡度）", "地基岩性（强度、完整性）", "荷载条件（静水压力、温度荷载）", "施工方法（浇筑强度、运输方式）", "运行要求（泄洪、发电）", ""], "r": "ABCE", "e": "答案：ABCE拱坝体型设计要考虑地形地质、荷载、泄洪、冲沙、建筑布置、施工导流等多种条件。", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249025", "t": 2, "q": "重力坝坝基抗滑稳定计算中，需考虑的荷载包括（　）", "a": ["坝体自重", "坝基扬压力", "水平水压力（上游静水压力、下游水压力）", "坝体混凝土收缩应力", "地基反力", ""], "r": "ABC", "e": "重力坝坝基抗滑稳定计算需考虑使坝体滑动的力和抗滑力，坝体自重、水平水压力是主要作用力，坝基扬压力减小抗滑力，都需考虑；坝体混凝土收缩应力对坝基抗滑稳定影响小，一般不考虑；地基反力是计算结果而非计算需考虑的荷载。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249026", "t": 2, "q": "水闸地下轮廓线的防渗设施包括（　）", "a": ["上游水平铺盖（黏土、沥青混凝土）", "垂直防渗墙（混凝土、钢板桩）", "下游排水孔", "闸室底板", "上游翼墙", ""], "r": "ABD", "e": "水闸地下轮廓线防渗设施主要是阻止水流渗透，上游水平铺盖和垂直防渗墙能增强防渗效果，闸室底板也参与构成地下轮廓起防渗作用。下游排水孔是排水设施，上游翼墙主要作用不是防渗。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637117157249027", "t": 2, "q": "拱坝坝体应力分析的常用方法有（　）", "a": ["纯拱法（仅考虑拱的作用）", "拱梁分载法（考虑拱和梁的共同作用）", "有限元法（三维应力分析）", "材料力学法（简化计算）", "模型试验法（物理模拟）", ""], "r": "ABCE", "e": "拱坝坝体应力分析常用方法多样，纯拱法只考虑拱作用，拱梁分载法考虑拱梁共同作用，有限元法可进行三维应力分析，模型试验法通过物理模拟分析，这些都是常用方法，而材料力学法一般用于重力坝等，并非拱坝常用应力分析方法。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649088", "t": 3, "q": "拱坝的水平拱圈半径越小，拱的传力效果越好，坝体厚度可越小，但对河谷形状的要求越严格。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水平拱圈半径小，拱的轴线短，传力路径短，传力效果好，坝体厚度就能减小；但半径小会让拱坝对河谷形状适应性变差，要求更严格。", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649090", "t": 3, "q": "水闸地下轮廓线的长度应根据地基渗透系数和闸室水头确定，渗透系数越大，所需防渗长度越长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水闸地下轮廓线长度与地基渗透系数和闸室水头有关，渗透系数大意味着水流更易渗透，为防止渗透破坏，所需防渗长度就越长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649091", "t": 3, "q": "拱坝坝体温度应力中，温降应力会使坝体产生压应力，温升应力会使坝体产生拉应力，因此温降对拱坝更不利。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "温降使坝体产生拉应力，温升使坝体产生压应力，而拱坝混凝土抗拉能力差，拉应力更易使坝体出现裂缝，所以温降对拱坝更不利，题干表述温降应力性质错误。", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649092", "t": 3, "q": "重力坝坝体混凝土采用分层浇筑时，分层厚度越大，混凝土水化热散发越慢，温度裂缝产生的风险越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分层厚度大，混凝土内部热量不易散发，水化热聚集，会使内外温差增大，从而增加温度裂缝产生风险。", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649093", "t": 3, "q": "水闸消力池的作用是通过形成水跃消耗水流能量，因此消力池深度越大，消能效果越好，无需考虑经济性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水闸消力池虽通过水跃消能，但设计时要综合考虑消能效果与经济性，并非深度越大越好，过深会大幅增加成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649094", "t": 3, "q": "拱坝坝肩稳定分析中，若坝肩岩体为完整的花岗岩，且无明显结构面，则坝肩滑动的风险主要来自坝体与基岩接触面的滑动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完整花岗岩无明显结构面时，坝肩岩体自身稳定性较好，此时坝体与基岩接触面相对薄弱，坝肩滑动风险主要源于此。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649095", "t": 3, "q": "重力坝溢流坝段的堰顶高程应高于正常蓄水位，以保证水库正常蓄水时不泄流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重力坝溢流坝段堰顶高程通常低于正常蓄水位，这样在水库水位达到正常蓄水位时，可根据需要泄流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649096", "t": 3, "q": "水闸上游铺盖采用黏土材料时，黏土的渗透系数应小于1×10^-6cm/s，且铺盖厚度应不小于0.5m，以保证防渗效果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水闸上游黏土铺盖要求黏土渗透系数小于1×10⁻⁶cm/s且厚度不小于0.5m来保障防渗效果，这是水闸防渗设计的常规要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649097", "t": 3, "q": "拱坝坝体廊道应尽量布置在坝体应力较小的区域，如坝体上游1/3高度处，以减少廊道对坝体整体性的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "拱坝坝体廊道布置在应力较小区域可降低对坝体整体性影响，坝体上游1/3高度处通常应力较小，符合廊道布置原则。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649098", "t": 3, "q": "重力坝抗浮稳定安全系数的计算的分子是坝体自重，分母是坝基扬压力，安全系数应不小于1.05。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重力坝抗浮稳定安全系数计算分子是作用于坝体的有效重力（不只是自重），分母是坝基扬压力，且安全系数应不小于1.1。所以题干表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649100", "t": 3, "q": "拱坝荷载组合中，地震荷载属于特殊荷载组合，仅在地震烈度≥7度的地区才需考虑。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "拱坝设计时，地震荷载属于特殊荷载组合，且规范规定仅在地震烈度≥7度的地区才需考虑该荷载。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637118482649101", "t": 3, "q": "重力坝坝基固结灌浆的目的是提高地基的防渗性能，帷幕灌浆的目的是提高地基的强度和完整性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "固结灌浆目的是提高地基强度和完整性，帷幕灌浆目的是提高地基防渗性能，题干说法将二者目的弄反。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K10", "n": "知识点10  工程水文学基本理论", "qs": [{"id": "2035637121905201152", "t": 1, "q": "在水文循环中，下列哪项不是影响水汽输送的主要气象因子？", "a": ["大气环流", "海陆分布", "地形起伏", "洋流", "", ""], "r": "D", "e": "大气环流是水汽输送的主要动力；海陆分布影响水汽源地和输送路径；地形起伏会阻挡或抬升气流影响水汽输送。而洋流主要影响海洋水温等，对水汽输送并非主要气象因子。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201153", "t": 1, "q": "某流域多年平均降水量为1200毫米，多年平均蒸发量为700毫米，多年平均径流深为400毫米，该流域多年平均下渗量最接近下列哪个值？", "a": ["100毫米", "200毫米", "300毫米", "500毫米", "", ""], "r": "A", "e": "根据水量平衡原理，降水量=蒸发量 + 径流深 + 下渗量。所以下渗量 = 降水量 - 蒸发量 - 径流深，即1200 - 700 - 400 = 100毫米。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201154", "t": 1, "q": "在径流形成过程中，\"蓄满产流\"模式的核心特征是？", "a": ["降雨强度大于下渗强度时才产流", "流域蓄水量达到田间持水量后才产流", "只在地表产生径流", "地下径流占总径流比例极小", "", ""], "r": "B", "e": "蓄满产流是指当包气带土壤含水量达到田间持水量后才产流。A选项是超渗产流特征；蓄满产流不仅有地表径流还有地下径流，C错；其地下径流占比不小，D错。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201155", "t": 1, "q": "水文站观测水位时，若采用的基面是绝对基面，下列关于该基面的说法正确的是？", "a": ["绝对基面是某一测站最枯水位以下的某一固定点", "我国通常采用的绝对基面是吴淞基面", "绝对基面是指海平面基面，我国统一采用黄海基面", "绝对基面随流域水文条件变化而调整", "", ""], "r": "C", "e": "绝对基面指海平面基面，我国统一采用黄海基面。A说的不是绝对基面概念；我国通常采用黄海基面，不是吴淞基面，B错；绝对基面是固定的，不随流域水文条件变化调整，D错。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201157", "t": 1, "q": "某流域设计洪水计算中，采用暴雨资料推求设计洪水时，若暴雨的时程分配采用同频率放大法，其放大的核心原则是？", "a": ["对暴雨过程中所有时段的雨量按同一倍比放大", "对设计暴雨时段内各控制时段的雨量按各自的频率倍比放大", "只放大暴雨过程中的最大1小时雨量", "按暴雨的均值倍数放大", "", ""], "r": "B", "e": "同频率放大法是按设计暴雨时段内各控制时段的雨量按各自的频率倍比放大。A选项是同倍比放大法；C选项只放大最大1小时雨量不符合同频率放大法；D选项按均值倍数放大也不是同频率放大法的核心。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201158", "t": 1, "q": "下列关于流域水文模型的说法，错误的是？", "a": ["新安江模型是典型的概念性水文模型", "分布式水文模型能考虑流域下垫面空间异质性", "黑箱模型需要详细的流域物理参数", "概念性模型通过简化物理过程构建数学关系", "", ""], "r": "C", "e": "黑箱模型不考虑系统内部结构和物理过程，不需要详细的流域物理参数，C说法错误。新安江模型是概念性水文模型；分布式水文模型可考虑下垫面空间异质性；概念性模型简化物理过程构建数学关系，A、B、D正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201159", "t": 1, "q": "在水位流量关系曲线的延长中，若采用曼宁公式延长高水位段，需要已知的参数不包括？", "a": ["河道糙率", "河道比降", "断面平均流速", "断面面积", "", ""], "r": "C", "e": "曼宁公式为「test/yiwen_img/importSubject/2035637119237623808.png」，式中n是河道糙率，S是河道比降，R与断面面积等有关。而用该公式延长高水位段不需要已知断面平均流速。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201160", "t": 1, "q": "某水文站测得某年年径流量为10亿立方米，该年流域平均降水量为1000毫米，流域面积为2000平方公里，该年的径流系数为？", "a": ["0.5", "0.6", "0.7", "0.8", "", ""], "r": "A", "e": "先将流域面积单位换算为平方米，2000平方公里 = 2×10⁹平方米，降水量1000毫米 = 1米，降水总量 = 2×10⁹×1 = 2×10⁹立方米 = 20亿立方米。径流系数 = 年径流量÷降水总量 = 10÷20 = 0.5。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201162", "t": 1, "q": "下列关于水文循环中\"大循环\"的说法正确的是？", "a": ["仅发生在陆地内部的水循环", "仅发生在海洋内部的水循环", "发生在海洋与陆地之间的水循环", "发生在大气圈内部的水循环", "", ""], "r": "C", "e": "水文循环中“大循环”指的是海洋与陆地之间的水循环。陆地内部、海洋内部水循环是小循环，大气圈内部一般不存在完整意义水循环。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201163", "t": 1, "q": "某暴雨的重现期为50年，其对应的频率P为？", "a": ["1%", "2%", "5%", "10%", "", ""], "r": "B", "e": "重现期T与频率P关系为P=1/T ，本题重现期T = 50年，所以P = 1/50 = 2%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201164", "t": 1, "q": "在水文测验中，采用流速仪法测流时，若断面内流速分布不均匀，合理的测流方法是？", "a": ["在断面中心处测一个点的流速代表平均流速", "将断面分成若干部分，分别测各部分流速再计算总流量", "只测水面流速，按固定系数换算为平均流速", "测断面两岸流速，取平均值代表平均流速", "", ""], "r": "B", "e": "当断面内流速分布不均匀时，要准确测流应将断面细分，分别测各部分流速再算总流量。A选项单点流速不能代表平均流速；C选项仅测水面流速换算不准确；D选项两岸流速平均值不能代表全断面平均流速。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201165", "t": 1, "q": "下列哪种方法不属于设计洪水过程线的推求方法？", "a": ["同频率放大法", "同倍比放大法", "经验适线法", "综合单位线法", "", ""], "r": "C", "e": "经验适线法主要用于频率曲线的拟合，确定水文变量的统计参数，并非设计洪水过程线的推求方法。同频率放大法、同倍比放大法是常用的放大典型洪水过程线以推求设计洪水过程线的方法，综合单位线法可用于推求流域出口断面的洪水过程。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201166", "t": 1, "q": "在流域产流计算中，\"超渗产流\"主要发生在下列哪种流域？", "a": ["湿润地区的森林流域", "半干旱地区的黄土流域", "平原地区的水稻田流域", "沿海地区的沼泽流域", "", ""], "r": "B", "e": "超渗产流是降雨强度超过土壤下渗强度而产生的地面径流。半干旱地区黄土流域，土壤透水性差，降雨时易超渗形成产流。而湿润地区森林流域、平原水稻田流域、沿海沼泽流域土壤下渗能力相对较强，不易超渗产流。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201167", "t": 1, "q": "某流域的年径流变差系数Cv值越大，说明该流域年径流的？", "a": ["多年平均值越大", "年际变化越剧烈", "年内分配越均匀", "可靠性越高", "", ""], "r": "B", "e": "年径流变差系数Cv反映年径流的年际变化程度，Cv值越大，年际变化越剧烈。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201168", "t": 1, "q": "在水文预报中，短期洪水预报常用的方法是？", "a": ["气候模式法", "单位线法", "经验公式法", "等值线图法", "", ""], "r": "B", "e": "单位线法是短期洪水预报常用方法，能根据降雨过程推求洪水过程；气候模式法常用于气候预测；经验公式法多用于估算简单水文参数等；等值线图法用于展示地理要素空间分布。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201169", "t": 1, "q": "下列关于河道糙率的说法，正确的是？", "a": ["河道糙率随水流速度增大而增大", "河道内植被越多，糙率越小", "河道断面越不规则，糙率越大", "水深越大，糙率越大", "", ""], "r": "C", "e": "糙率反映河渠边界影响水流阻力的综合系数。河道断面不规则会增加水流阻力，糙率越大；水流速度、水深与糙率无此对应增大关系，河道内植被多会使糙率增大。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201170", "t": 1, "q": "在频率分析中，若某水文变量的频率曲线符合皮尔逊III型分布，其形状参数Cs值为正值时，该分布曲线的形态是？", "a": ["对称", "左偏", "右偏", "水平", "", ""], "r": "C", "e": "皮尔逊III型分布中，Cs为偏态系数，Cs=0时曲线对称，Cs>0时右偏，Cs<0时左偏。本题Cs值为正，所以是右偏。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201171", "t": 1, "q": "某流域采用泰森多边形法计算平均降雨量，若某雨量站的泰森多边形面积为50平方公里，该站降雨量为100毫米，另一雨量站泰森多边形面积为100平方公里，降雨量为80毫米，该流域平均降雨量为？", "a": ["86.7毫米", "90毫米", "93.3毫米", "85毫米", "", ""], "r": "A", "e": "根据泰森多边形法计算流域平均降雨量公式：「test/yiwen_img/importSubject/2035637119380230144.png」，这里「test/yiwen_img/importSubject/2035637119426367488.png」平方公里，「test/yiwen_img/importSubject/2035637119518642176.png」毫米，「test/yiwen_img/importSubject/2035637119636082688.png」平方公里，「test/yiwen_img/importSubject/2035637119698997248.png」毫米，代入可得「test/yiwen_img/importSubject/2035637119749328896.png」毫米。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201172", "t": 1, "q": "下列哪项不是影响流域下渗的因素？", "a": ["土壤质地", "植被覆盖率", "流域面积", "降雨强度", "", ""], "r": "C", "e": "土壤质地、植被覆盖率、降雨强度都会影响下渗，而流域面积主要与集水范围等有关，并非影响下渗的直接因素。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201173", "t": 1, "q": "在设计枯水流量计算中，若采用历时曲线法，其设计枯水流量是指？", "a": ["某一重现期的最小日流量", "某一历时内的最小平均流量", "多年最小日流量", "历史最小瞬时流量", "", ""], "r": "B", "e": "历时曲线法是按时间顺序统计不同历时的平均流量，设计枯水流量是某一历时内的最小平均流量。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201174", "t": 1, "q": "水文循环的主要动力是？", "a": ["地球引力", "太阳辐射", "大气压力", "地转偏向力", "", ""], "r": "B", "e": "太阳辐射提供热量使水蒸发，是水文循环的主要动力。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201175", "t": 1, "q": "在分布式水文模型中，下列哪种数据不是必需的输入数据？", "a": ["数字高程模型（DEM）", "土地利用类型图", "流域多年平均蒸发量", "土壤类型分布图", "", ""], "r": "C", "e": "分布式水文模型需考虑流域空间异质性，DEM用于分析地形，土地利用类型图和土壤类型分布图对产汇流模拟重要。而流域多年平均蒸发量是统计数据，不是模拟中必需输入的直接体现空间分布特征的数据。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201176", "t": 1, "q": "某水文站的水位流量关系曲线发生了\"高水延长\"，其原因可能是？", "a": ["河道冲刷导致断面面积增大", "河道淤积导致断面面积减小", "测流期间降雨量过大", "测流仪器精度下降", "", ""], "r": "A", "e": "高水延长是指超出实测流量范围的水位流量关系外延，河道冲刷使断面面积增大，水位流量关系会改变，需高水延长；B淤积使面积减小不是高水延长原因；C降雨大不是高水延长主因；D仪器精度下降不影响水位流量关系本身。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637121905201177", "t": 1, "q": "在年径流计算中，若流域存在水利工程（如水库），对年径流的影响主要是？", "a": ["增大年径流总量", "减小年径流总量", "改变年径流的年内分配", "改变年径流的年际变化", "", ""], "r": "C", "e": "水库主要作用是调节径流，把丰水期的水存起来，枯水期放出去，主要改变的是年径流的年内分配。水库一般不会明显改变年径流总量，对年际变化影响也较小。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106945", "t": 2, "q": "在径流形成的\"汇流阶段\"，包括的主要过程有？（　）", "a": ["坡面汇流", "壤中流汇流", "地下径流汇流", "河道汇流", "植物截留", ""], "r": "ABCD", "e": "答案：ABCD径流形成的“汇流阶段”主要包括坡面汇流、壤中流汇流、地下径流汇流和河道汇流。植物截留属于降水过程中的一个环节，不属于汇流阶段的主要过程，E错误。故选ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106946", "t": 2, "q": "水文频率分析中，常用的理论频率分布有？（　）", "a": ["皮尔逊III型分布", "对数正态分布", "耿贝尔分布", "正态分布", "指数分布", ""], "r": "ABC", "e": "在水文频率分析里，皮尔逊III型分布是最常用的理论频率分布。对数正态分布、耿贝尔分布也有应用。而正态分布和指数分布一般不用于水文频率分析。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106947", "t": 2, "q": "采用暴雨资料推求设计洪水时，需要进行的主要步骤有？（　）", "a": ["推求设计暴雨", "确定产流参数", "推求设计净雨", "推求设计洪水过程线", "计算流域多年平均径流深", ""], "r": "ABCD", "e": "采用暴雨资料推求设计洪水，先推求设计暴雨，再确定产流参数以推求设计净雨，最后推求设计洪水过程线。计算流域多年平均径流深不是主要步骤。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637123889106948", "t": 2, "q": "下列关于水位流量关系曲线的说法，正确的有？（　）", "a": ["稳定的水位流量关系曲线是单值的", "受洪水涨落影响，水位流量关系可能呈滞后回线", "河道整治会导致水位流量关系曲线发生变化", "水位流量关系曲线可用于插补缺失的流量数据", "同一河道的水位流量关系曲线永久不变", ""], "r": "ABCD", "e": "稳定水位流量关系单值对应，A对；洪水涨落使水位流量关系呈滞后回线，B对；河道整治改变河道条件，水位流量关系曲线会变，C对；水位流量关系曲线能插补流量数据，D对；同一河道条件改变时曲线会变，并非永久不变，E错。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478528", "t": 3, "q": "水文循环中，陆地内循环的水量占全球水文循环总水量的比例远大于海陆间循环。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "海陆间循环是指海洋水与陆地水之间通过一系列过程所进行的相互转换运动，是最重要的水循环类型，其水量占全球水文循环总水量的比例远大于陆地内循环。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478529", "t": 3, "q": "流域的径流系数越大，说明该流域的下渗量和蒸发量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "径流系数是指一定汇水面积内径流量与降水量的比值。径流系数大意味着径流量占降水量的比例大，而降水量一部分转化为径流，一部分下渗和蒸发，所以径流比例大时，下渗量和蒸发量就小。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478530", "t": 3, "q": "在蓄满产流模式下，流域内只要有部分区域蓄满，整个流域就会产生径流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蓄满产流模式中，只有当包气带达到田间持水量（蓄满）才产流，并非部分区域蓄满整个流域就产流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478531", "t": 3, "q": "水文频率分析中，经验频率曲线的点据越密集，说明理论频率曲线的拟合精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "经验频率曲线点据密集只能体现样本数据分布情况，理论频率曲线拟合精度取决于理论与经验频率曲线的匹配程度，而非经验点据密集度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478532", "t": 3, "q": "设计洪水的重现期越大，对应的设计洪水量级越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设计洪水重现期越大，意味着该量级洪水出现的概率越小，通常对应的设计洪水量级越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478533", "t": 3, "q": "单位线的历时越长，其对应的地表径流过程线越平缓。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "单位线历时越长，意味着净雨在更长时间内分布，使得地表径流过程线的洪峰相对降低，过程更平缓。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478534", "t": 3, "q": "河道的糙率值越大，在相同水位条件下，河道的过流能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "糙率反映的是河槽边界对水流的阻力，糙率值越大，水流受到的阻力越大，在相同水位条件下，河道过流能力越弱。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478535", "t": 3, "q": "年径流变差系数Cv值为0时，说明该流域各年的径流量完全相同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "年径流变差系数Cv反映年径流量的相对变化程度，Cv为0意味着年径流量无变化，即各年径流量完全相同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478536", "t": 3, "q": "采用泰森多边形法计算流域平均降雨量时，每个雨量站的权重与其控制的多边形面积成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "泰森多边形法中，雨量站控制的多边形面积越大，其对流域平均降雨量的影响越大，权重就越大，即每个雨量站的权重与其控制的多边形面积成正比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478537", "t": 3, "q": "分布式水文模型不需要进行参数率定，可直接使用物理参数计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分布式水文模型虽基于物理机制，但模型中一些参数难以直接准确获取，仍需进行参数率定来使模型模拟结果更符合实际情况，并非可直接用物理参数计算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478538", "t": 3, "q": "超渗产流主要发生在湿润地区，蓄满产流主要发生在干旱地区。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。超渗产流主要发生在干旱、半干旱地区，该地区降雨强度常超过土壤下渗能力；蓄满产流主要发生在湿润地区，因土壤湿润，包气带易蓄满水而产流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637125235478539", "t": 3, "q": "水位流量关系曲线为单值曲线的前提是河道断面稳定、水流均匀且无洪水涨落影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "河道断面稳定、水流均匀且无洪水涨落影响时，同一水位对应唯一流量，水位流量关系曲线会呈现单值曲线。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K11", "n": "知识点11  水轮机与水泵的结构特性", "qs": [{"id": "2035637127550734336", "t": 1, "q": "下列关于水泵扬程的说法，正确的是？", "a": ["水泵的扬程是指水泵能将水提升的最大高度（垂直距离）", "扬程等于水泵出口总水头与进口总水头之差", "扬程与水泵的转速无关", "扬程的单位\"米水柱\"是指重力势能的单位，与压力无关", "", ""], "r": "B", "e": "水泵扬程是指水泵出口总水头与进口总水头之差；A选项，扬程不只是垂直距离；C选项，扬程与水泵转速有关；D选项，“米水柱”与压力有关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734338", "t": 1, "q": "离心式水泵的叶轮叶片采用后弯式的主要原因是？", "a": ["可获得更大的流量", "可减小水泵的轴向推力", "可降低水泵的汽蚀余量", "可提高水泵的效率，降低能耗", "", ""], "r": "D", "e": "后弯式叶片使液体获得的动能较小，转化为压能的损失小，能提高水泵效率、降低能耗。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734339", "t": 1, "q": "下列关于水轮机转轮叶片材质选择的说法，错误的是？", "a": ["冲击式水轮机转轮叶片需具备较高的耐磨性", "高水头水轮机转轮叶片需具备较高的强度和硬度", "低水头大流量水轮机转轮叶片可采用普通碳素钢", "含沙量高的水电站水轮机转轮叶片需具备较高的耐腐蚀性", "", ""], "r": "D", "e": "含沙量高的水电站水轮机转轮叶片主要需具备较高的耐磨性，而非耐腐蚀性，所以D说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734340", "t": 1, "q": "混流式水轮机转轮的叶片数目选择主要考虑的因素不包括以下哪项？", "a": ["水轮机的比转速", "转轮的强度要求", "水流在转轮内的水力损失", "机组的安装高程", "", ""], "r": "D", "e": "水轮机转轮叶片数目选择与比转速、转轮强度、水流在转轮内水力损失相关，而机组安装高程是根据其他因素确定，和叶片数目选择无关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734341", "t": 1, "q": "下列关于轴流式水轮机导水机构的说法，错误的是？", "a": ["导水机构的主要作用是调节进入转轮的流量", "导水机构由导叶、导叶臂、控制环等部件组成", "导叶的开启角度越大，通过导水机构的水流速度越大（流量一定时）", "导水机构关闭时可防止水轮机倒转", "", ""], "r": "C", "e": "流量一定时，导叶开启角度越大，过流面积越大，水流速度越小，C说法错误。A选项调节流量是导水机构主要作用；B选项其组成部件描述正确；D选项导水机构关闭能防止水轮机倒转。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734342", "t": 1, "q": "水泵发生气蚀现象的根本原因是泵内局部区域的压力达到了当时水温下的什么值？", "a": ["饱和蒸汽压", "大气压", "绝对压力", "相对压力", "", ""], "r": "A", "e": "当泵内局部区域压力降低到当时水温下的饱和蒸汽压时，水会汽化形成气泡，气泡破裂产生气蚀现象。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734343", "t": 1, "q": "下列属于冲击式水轮机特有的部件是？", "a": ["转轮", "喷嘴", "导水机构", "尾水管", "", ""], "r": "B", "e": "冲击式水轮机靠高速水流冲击转轮做功，需用喷嘴把水流能量转换为高速射流。转轮是各类水轮机都有；导水机构常见于反击式水轮机；尾水管也是反击式水轮机部件。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734344", "t": 1, "q": "对于单级单吸离心式水泵，其叶轮的结构特点不包括以下哪项？", "a": ["叶轮上通常设有平衡孔或平衡叶片", "叶轮一般采用后弯式叶片", "叶轮的进口直径小于出口直径", "叶轮的轮毂直径与叶轮直径之比通常大于0.5", "", ""], "r": "D", "e": "单级单吸离心式水泵叶轮轮毂直径与叶轮直径之比通常小于0.5 ，D选项说法错误。A项平衡孔或平衡叶片可平衡轴向力；B项后弯式叶片利于提高效率；C项进口直径小出口直径大符合其结构特点。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734346", "t": 1, "q": "水泵的流量与转速的关系符合以下哪项规律（其他条件不变时）？", "a": ["流量与转速成正比", "流量与转速的平方成正比", "流量与转速的立方成正比", "流量与转速无关", "", ""], "r": "A", "e": "根据水泵的相似定律，在其他条件不变时，水泵流量与转速成正比。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734347", "t": 1, "q": "轴流转桨式水轮机与轴流定桨式水轮机的主要区别在于？", "a": ["转轮的叶片数目不同", "转轮叶片是否可调节", "导水机构的结构形式不同", "尾水管的形状不同", "", ""], "r": "B", "e": "轴流转桨式水轮机转轮叶片可调节，轴流定桨式水轮机转轮叶片不可调节，这是二者主要区别。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734348", "t": 1, "q": "下列关于水轮机调节系统中调速器与导水机构联动关系的说法，正确的是？", "a": ["机组负荷增加时，调速器控制导水机构关小导叶", "机组转速升高时，调速器控制导水机构关小导叶", "电网频率降低时，调速器控制导水机构关小导叶", "水轮机进口水头升高时，调速器控制导水机构开大导叶", "", ""], "r": "B", "e": "调速器的作用是根据机组转速变化调节导水机构导叶开度。当机组转速升高，意味着能量过剩，需减少进水量，所以调速器控制导水机构关小导叶。A选项负荷增加应开大导叶；C选项电网频率降低意味着机组转速降低，应开大导叶；D选项水头升高，若开度不变功率会增大，一般应关小导叶。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734349", "t": 1, "q": "离心式水泵的气蚀余量（NPSH）与水泵安装高度的关系，下列说法正确的是？", "a": ["必需气蚀余量（NPSHr）越大，水泵允许的安装高度越高", "有效气蚀余量（NPSHa）越大，水泵允许的安装高度越高", "气蚀余量与水泵安装高度无关", "必需气蚀余量等于有效气蚀余量时，安装高度达到最大值", "", ""], "r": "B", "e": "有效气蚀余量反映泵进口处的实际气蚀性能，其越大，说明泵进口不易发生气蚀，允许的安装高度就越高。而必需气蚀余量越大越易气蚀，安装高度应越低；气蚀余量与安装高度有关；必需气蚀余量等于有效气蚀余量时是临界状态，不是安装高度最大值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637127550734350", "t": 1, "q": "下列部件中，不属于水轮机主轴密封系统组成部分的是？", "a": ["密封环", "止水盘根", "导叶臂", "冷却水管", "", ""], "r": "C", "e": "水轮机主轴密封系统主要是防止水从主轴与顶盖之间间隙漏出，密封环、止水盘根用于密封，冷却水管为密封部件降温，都是主轴密封系统组成部分。导叶臂是水轮机导水机构的部件，与主轴密封系统无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645184", "t": 2, "q": "（　）下列属于反击式水轮机的类型有？", "a": ["混流式水轮机", "轴流式水轮机", "斜击式水轮机", "双击式水轮机", "贯流式水轮机", ""], "r": "ABE", "e": "反击式水轮机主要包括混流式、轴流式、贯流式等。斜击式和双击式属于冲击式水轮机。所以答案选ABE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645185", "t": 2, "q": "（　）影响离心式水泵效率的主要因素有？", "a": ["叶轮的水力损失", "水泵的容积损失", "水泵的机械损失", "水泵的安装高度", "水泵的转速", ""], "r": "ABC", "e": "离心式水泵效率受水力、容积、机械三方面损失影响。安装高度主要影响水泵吸水性能，转速虽与水泵性能有关但不是影响效率主要因素。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645186", "t": 2, "q": "（　）水轮机转轮的水力性能主要取决于哪些结构参数？", "a": ["转轮叶片的形状", "转轮的进口角和出口角", "转轮的直径和高度", "转轮的材质", "转轮的叶片数目", ""], "r": "ABCE", "e": "水轮机转轮水力性能与水流在转轮内的流动特性相关。转轮叶片形状、进出口角、叶片数目会直接影响水流流动，从而影响水力性能；转轮直径和高度与过流能力等水力性能有关。而转轮材质主要影响其强度、耐用性等，不直接决定水力性能。答案选ABCE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637129383645187", "t": 2, "q": "（　）下列关于水泵并联运行的特点，说法正确的有？", "a": ["并联运行的水泵扬程基本相等", "总流量等于各水泵流量之和", "并联运行可提高供水的可靠性", "并联运行时各水泵的转速必须相同", "并联运行适用于需大幅增加流量的工况", ""], "r": "ABCE", "e": "并联水泵扬程基本相等，总流量是各泵流量之和，能提高供水可靠性，适用于大幅增流工况，而转速不一定要相同。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073728", "t": 3, "q": "混流式水轮机的转轮既利用了水流的动能，又利用了水流的势能，属于反击式水轮机的典型代表。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "混流式水轮机工作时，水流通过转轮时，水流的势能和动能都参与做功，它是反击式水轮机的典型代表。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073729", "t": 3, "q": "离心式水泵的必需气蚀余量（NPSHr）越小，说明水泵抗气蚀的能力越弱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "必需气蚀余量越小，意味着水泵入口处允许的最低压力越高，更不容易发生气蚀，即抗气蚀能力越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073730", "t": 3, "q": "轴流转桨式水轮机在负荷变化时，通过同时调节导叶开度和转轮叶片角度，可使水轮机在较宽的工况范围内保持较高效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴流转桨式水轮机的特点就是能在负荷变化时，同时调节导叶开度和转轮叶片角度，以适应不同工况，从而在较宽工况范围保持较高效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073731", "t": 3, "q": "水轮机的比转速越大，其适用的水头越高，流量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水轮机比转速越大，适用水头越低，流量越大，题干说法与实际情况相反。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073732", "t": 3, "q": "水泵并联运行时，各水泵的出口压力必须完全相等，否则无法正常并联。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水泵并联时，各水泵出口压力基本相等才能保证并联正常工作，若压力差异大，压力低的水泵可能无法出水甚至出现倒流。所以说必须完全相等表述太绝对。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073733", "t": 3, "q": "冲击式水轮机的尾水管仅起到将转轮排出的水流导入下游的作用，无能量回收功能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冲击式水轮机工作在大气中，转轮出口能量损失小，尾水管主要是将水导至下游，一般无能量回收功能。", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073734", "t": 3, "q": "离心式水泵的叶轮采用前弯式叶片时，水泵的扬程较高，但效率较低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前弯式叶片使水流获得较大的动扬程，所以扬程较高，但动扬程转化为压力能时损失大，导致效率低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073735", "t": 3, "q": "水轮机导水机构的导叶关闭时间越长，机组甩负荷时的最大转速升高值越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "导叶关闭时间长，水轮机在较长时间内仍有较大流量的水冲击转轮做功，会使机组转速升高更多。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073736", "t": 3, "q": "轴流式水泵的流量与扬程的关系曲线较陡，适用于流量变化小、扬程变化大的工况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "轴流式水泵流量与扬程关系曲线较平坦，适用于流量变化大、扬程变化小的工况，而不是流量变化小、扬程变化大的工况。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073737", "t": 3, "q": "水轮机转轮叶片的进口角设计不合理，会导致水流进入转轮时产生较大的冲击损失，降低水轮机效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机转轮叶片进口角不合理，水流进入转轮时就无法平顺进入，会产生较大冲击，进而造成能量损失，使水轮机效率降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073738", "t": 3, "q": "水泵的转速升高时，其扬程会按转速平方的比例增加，流量按转速的比例增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据水泵的比例定律，水泵转速改变时，扬程与转速的平方成正比，流量与转速成正比。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073739", "t": 3, "q": "冲击式水轮机的喷嘴喷针行程越大，通过喷嘴的水流流量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冲击式水轮机中，喷针行程越大，喷嘴过流面积越大，水流流量越大，而不是越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073740", "t": 3, "q": "水轮机的吸出高度为正值时，说明转轮进口位于下游水位以上，可能存在气蚀风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机吸出高度指转轮出口到下游水位的垂直距离，正值表示转轮出口在下游水位以上。转轮出口压力降低易形成气泡，气泡破裂会产生气蚀。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073741", "t": 3, "q": "离心式水泵的容积损失主要是由于水泵轴承的摩擦引起的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心式水泵的容积损失主要是因泵内高压水泄漏回低压区造成的，而水泵轴承的摩擦引起的是机械损失，并非容积损失。", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073742", "t": 3, "q": "轴流定桨式水轮机在负荷偏离设计工况较大时，效率会显著下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴流定桨式水轮机叶片角度固定，当负荷偏离设计工况较大时，水流不能以最优角度冲击叶片，水力损失增大，效率会显著下降。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073743", "t": 3, "q": "水轮机的主轴密封装置在运行过程中，需要持续通入冷却水，以防止密封部件因摩擦过热损坏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机主轴密封装置在运行中，密封部件会因摩擦产生热量，持续通入冷却水可带走热量，避免密封部件因过热损坏。", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073744", "t": 3, "q": "水泵的有效气蚀余量（NPSHa）是由水泵本身的结构决定的，与管路系统无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "有效气蚀余量（NPSHa）由吸入装置条件决定，即与管路系统有关，而非由水泵本身结构决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073745", "t": 3, "q": "混流式水轮机的转轮直径越大，在相同水头下，水轮机的出力越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机出力与转轮直径、水头、流量等有关，在相同水头下，转轮直径越大，过流面积越大，流量越大，根据出力公式，出力也就越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073746", "t": 3, "q": "冲击式水轮机的转轮叶片数目越多，水轮机的效率越高，因此叶片数目应尽可能多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "转轮叶片数目过多会增加水流的摩擦等损失，并非越多效率越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073747", "t": 3, "q": "水泵串联运行时，总扬程等于各水泵扬程之和，总流量等于各水泵流量的平均值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水泵串联运行时，总扬程等于各水泵扬程之和，但总流量等于各水泵的流量，而非各水泵流量的平均值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073748", "t": 3, "q": "水轮机的调节保证计算主要是为了确定导叶的关闭时间和水击压力，确保机组安全运行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机调节保证计算目的就是确定导叶关闭时间和水击压力等参数，以此保障机组安全稳定运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073749", "t": 3, "q": "离心式水泵的吸水管直径应大于水泵进口直径，以减小吸水管内的水流速度，降低气蚀风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "吸水管直径大于水泵进口直径，可使流速降低，减少水头损失，降低气蚀风险，该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637130688073750", "t": 3, "q": "轴流式水轮机的转轮高度与直径之比（H/D）比混流式水轮机的大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴流式水轮机转轮叶片呈轴向排列，为保证水流平顺通过转轮，转轮高度与直径之比（H/D）通常比混流式水轮机大。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K12", "n": "知识点12  水利工程施工的技术方法和组织管理（题库未收录）", "qs": []}, {"k": "K13", "n": "知识点13  水利工程计量与计价、工程概预算", "qs": [{"id": "2035637143308734464", "t": 1, "q": "水利工程概预算中，价差预备费的计算不需要考虑以下哪项因素？", "a": ["工程建设工期", "各年投资计划额", "基本预备费率", "物价上涨指数", "", ""], "r": "C", "e": "价差预备费计算与工程建设工期、各年投资计划额、物价上涨指数相关，基本预备费率用于计算基本预备费，与价差预备费计算无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734465", "t": 1, "q": "在水利工程混凝土模板工程量计量中，对于曲面模板，其工程量计算应采用以下哪种方法？", "a": ["按模板接触混凝土的面积计算", "按模板的展开面积计算", "按混凝土结构体积计算", "按模板的水平投影面积计算", "", ""], "r": "A", "e": "水利工程混凝土模板工程量计量中，曲面模板按模板接触混凝土的面积计算。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734466", "t": 1, "q": "某水利工程建设项目，其建设期为3年，各年投资计划额分别为2000万元、3000万元、1000万元，若物价上涨指数为5%，则第2年的价差预备费应为多少万元（复利计算）？", "a": ["150.00", "205.00", "252.50", "307.50", "", ""], "r": "C", "e": "价差预备费公式为「test/yiwen_img/importSubject/2035637139877793792.png」，其中「test/yiwen_img/importSubject/2035637140083314688.png」为第t年投资额，f为物价上涨指数，m为建设前期年限（本题可视为0），t为年份。第2年「test/yiwen_img/importSubject/2035637140121063424.png」万元，「test/yiwen_img/importSubject/2035637140192366592.png」，m = 0，t = 2，代入公式可得「test/yiwen_img/importSubject/2035637140238503936.png」万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734467", "t": 1, "q": "水利工程中的\"安全生产费用\"在概预算中应如何列支？", "a": ["包含在企业管理费中", "包含在措施项目费中", "单独列项，计入工程建设其他费用", "单独列项，计入建筑安装工程费", "", ""], "r": "D", "e": "安全生产费用是为保障水利工程安全生产而专门设置的，需单独列项且应计入建筑安装工程费。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734468", "t": 1, "q": "在水利工程土方开挖计量中，对于基坑开挖，若开挖过程中发生塌方，其塌方部分的工程量是否应计入结算工程量？", "a": ["全部计入", "经监理单位确认后，合理塌方部分计入", "不计入", "按50%计入", "", ""], "r": "B", "e": "土方开挖计量时，塌方不是正常施工应有的工程量，需经监理单位确认合理部分才计入结算。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734469", "t": 1, "q": "根据《水利工程工程量清单计价规范》，工程量清单编制时，项目特征描述可不包括以下哪项内容？", "a": ["项目的材质", "项目的规格", "项目的施工方法", "项目的数量", "", ""], "r": "D", "e": "项目特征描述主要针对项目自身特性，如材质、规格等，施工方法不属于特征描述内容，数量是清单工程量，也不在特征描述范畴。答案选D是因为题目问可不包括的，项目数量本身不是特征描述内容。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734470", "t": 1, "q": "在水利工程概预算编制中，基本预备费的计算基数通常不包括以下哪项？", "a": ["工程费用", "工程建设其他费用", "价差预备费", "设备及工器具购置费", "", ""], "r": "C", "e": "基本预备费以工程费用、工程建设其他费用之和为计算基数，工程费用包含设备及工器具购置费等。而价差预备费与基本预备费是并列概念，不是基本预备费的计算基数。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734471", "t": 1, "q": "水利工程土方开挖工程量计量时，对于建筑物基础开挖，若基础为混凝土条形基础且有大放脚，其开挖工程量计算时应如何处理大放脚部分？", "a": ["单独计算大放脚体积并计入开挖量", "按基础底面积乘以开挖深度计算，不单独考虑大放脚", "按大放脚顶面面积乘以开挖深度计算", "扣除大放脚体积后计算开挖量", "", ""], "r": "B", "e": "建筑物基础开挖，混凝土条形基础有大放脚时，通常按基础底面积乘以开挖深度计算，不单独考虑大放脚。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734472", "t": 1, "q": "根据《水利工程设计概（估）算编制规定》，水利工程中的夜间施工增加费属于以下哪类费用？", "a": ["规费", "企业管理费", "措施项目费", "其他项目费", "", ""], "r": "C", "e": "夜间施工增加费是为完成工程项目施工，发生于该工程施工前和施工过程中非工程实体项目的费用，属于措施项目费。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734473", "t": 1, "q": "某水利枢纽工程中，某混凝土重力坝坝体混凝土采用商品混凝土，其单价计算时，除了考虑商品混凝土出厂价、运输费外，还需重点考虑以下哪项费用以准确计算浇筑到仓面的混凝土单价？", "a": ["混凝土拌制费", "混凝土运输损耗费", "混凝土振捣费", "混凝土养护费", "", ""], "r": "B", "e": "商品混凝土已拌制好，无拌制费；振捣和养护费不属于运输到仓面过程费用；运输损耗费是运输中会产生且影响浇筑到仓面混凝土单价的重要因素。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734474", "t": 1, "q": "水利工程概预算中，价差预备费的计算通常采用复利计算，其计算周期一般以什么为单位？", "a": ["月", "季", "半年", "年", "", ""], "r": "D", "e": "在水利工程概预算里，价差预备费按复利计算时，计算周期一般以年为单位。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734475", "t": 1, "q": "在水利工程石方开挖工程量计量中，对于保护层开挖，其工程量计算应采用以下哪种方法？", "a": ["按设计轮廓线体积计算，不考虑超挖", "按设计轮廓线加允许超挖值后的体积计算", "按实际开挖体积计算，超挖部分不单独计量", "按设计轮廓线体积加超挖系数计算", "", ""], "r": "B", "e": "在水利工程石方开挖工程量计量中，关于保护层开挖的工程量计算，关键在于理解保护层开挖的特点和计量规则。保护层开挖通常是为了保护主体工程或设施不受破坏而进行的表层开挖。在这种情况下，工程量的计算通常基于设计轮廓线，但考虑到实际开挖过程中可能存在的超挖现象，计量方式会有所不同。选项A“按设计轮廓线体积计算，不考虑超挖”忽略了实际开挖中可能出现的超挖部分，这在实际操作中可能导致计量不准确。选项B“按设计轮廓线加允许超挖值后的体积计算”则考虑到了实际开挖中的超挖情况，按照设计轮廓线加上允许的超挖值来计算工程量，这样既能反映实际开挖情况，又符合工程计量的准确性要求。选项C“按实际开挖体积计算，超挖部分不单独计量”虽然考虑了实际开挖情况，但超挖部分不单独计量可能导致工程量偏大，不利于成本控制。选项D“按设计轮廓线体积加超挖系数计算”与B选项相似，但“超挖系数”的确定可能因工程实际情况而异，不如B选项明确。综上所述，B选项“按设计轮廓线加允许超挖值后的体积计算”最符合保护层开挖工程量计量的实际情况和要求。所以，正确答案是B选项：“按设计轮廓线加允许超挖值后的体积计算”。", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734476", "t": 1, "q": "根据《水利工程工程量清单计价规范》，工程量清单中的\"暂列金额\"应归属于以下哪类项目？", "a": ["分部分项工程项目", "措施项目", "其他项目", "规费项目", "", ""], "r": "C", "e": "暂列金额是招标人在工程量清单中暂定并包括在合同价款中的一笔款项，属于其他项目。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734477", "t": 1, "q": "水利工程中，闸门安装工程量计量时，闸门本体重量的计算范围不包括以下哪项？", "a": ["闸门门叶", "闸门主轨", "闸门吊耳", "闸门止水橡皮", "", ""], "r": "B", "e": "闸门本体重量计算范围一般包含门叶、吊耳等主体结构部分，止水橡皮是附属部件，主轨不属于闸门本体。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734478", "t": 1, "q": "某水利工程编制施工图预算时，采用的人工预算单价中，生产工人辅助工资不包括以下哪项内容？", "a": ["职工学习、培训期间的工资", "因气候影响的停工工资", "探亲、休假期间的工资", "加班加点工资", "", ""], "r": "D", "e": "生产工人辅助工资包括职工学习、培训，因气候停工，探亲、休假期间工资等，加班加点工资不属于辅助工资。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734479", "t": 1, "q": "水利工程概预算中，工程建设其他费用中的\"建设管理费\"不包括以下哪项费用？", "a": ["项目法人管理费", "工程监理费", "工程质量监督费", "施工企业现场管理费", "", ""], "r": "D", "e": "建设管理费是工程建设其他费用，由项目法人管理费、工程监理费、工程质量监督费等构成，施工企业现场管理费属于建筑安装工程费中的间接费，不属于建设管理费。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734480", "t": 1, "q": "在水利工程混凝土工程量计量中，混凝土结构中的钢筋所占体积是否需要从混凝土工程量中扣除？", "a": ["全部扣除", "直径大于25mm的钢筋扣除，小于等于25mm的不扣除", "不扣除", "仅扣除主筋体积，箍筋体积不扣除", "", ""], "r": "C", "e": "在水利工程混凝土工程量计量里，通常不扣除混凝土结构中钢筋所占体积。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734481", "t": 1, "q": "某水利工程采用概算定额编制设计概算，若某分项工程的概算定额子目单位为100立方米，其人工消耗量为50工日，现该分项工程实际工程量为250立方米，则该分项工程的人工消耗量应为多少工日？", "a": ["125", "100", "150", "200", "", ""], "r": "A", "e": "先算出每立方米的人工消耗量为50÷100 = 0.5工日，实际工程量250立方米的人工消耗量就是250×0.5 = 125工日。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734482", "t": 1, "q": "水利工程中的\"临时设施费\"在概预算中属于以下哪类费用？", "a": ["工程建设其他费用", "建筑安装工程费中的措施项目费", "建筑安装工程费中的企业管理费", "预备费", "", ""], "r": "B", "e": "临时设施费是为工程施工提供临时设施所发生费用，属于建筑安装工程费里措施项目费。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734483", "t": 1, "q": "根据《水利工程建设项目费用构成》，水利工程的\"设备购置费\"计算时，不包括以下哪项费用？", "a": ["设备原价", "设备运杂费", "设备安装调试费", "设备运输损耗费", "", ""], "r": "C", "e": "设备购置费包括设备原价、运杂费、运输损耗费等，设备安装调试费不属于设备购置费用范畴。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734484", "t": 1, "q": "水利工程概预算编制中，当采用不同的价格水平年时，需要对工程费用进行价格调整，其调整的核心依据是以下哪项？", "a": ["人工工资上涨率", "材料价格指数", "工程造价指数", "设备价格波动幅度", "", ""], "r": "C", "e": "工程造价指数综合反映了工程建设中各类费用的价格变动情况，能衡量不同价格水平年工程费用的变化，是价格调整的核心依据。答案为C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734485", "t": 1, "q": "在水利工程土方填筑工程量计量中，对于坝体碾压式土方填筑，其工程量计算的压实度标准应按以下哪项确定？", "a": ["设计要求的压实度", "施工规范规定的最低压实度", "试验段确定的压实度", "监理单位确定的压实度", "", ""], "r": "A", "e": "坝体碾压式土方填筑工程量计算时，压实度标准应依据设计要求，设计规定了工程应达到的压实度指标。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734486", "t": 1, "q": "某水利工程编制可行性研究报告投资估算时，其基本预备费率应按以下哪个范围选取（根据现行规定）？", "a": ["3%-5%", "5%-8%", "8%-10%", "10%-12%", "", ""], "r": "B", "e": "水利工程可行性研究报告投资估算基本预备费率现行规定是5% - 8%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637143308734487", "t": 1, "q": "水利工程中的\"环境保护措施费\"在概预算中应列入以下哪项费用？", "a": ["工程建设其他费用", "建筑安装工程费中的措施项目费", "专项费用", "预备费", "", ""], "r": "A", "e": "答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782656", "t": 2, "q": "水利工程概预算中，建筑安装工程费中的措施项目费包括以下哪些内容？（　）", "a": ["安全文明施工费", "夜间施工增加费", "已完工程及设备保护费", "规费", "工程定位复测费", ""], "r": "ABCE", "e": "措施项目费是为完成工程项目施工，发生于该工程施工前和施工过程中非工程实体项目的费用。安全文明施工费、夜间施工增加费、已完工程及设备保护费、工程定位复测费都属于措施项目费，而规费是单独的费用类别，不属于措施项目费。答案：ABCE ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782657", "t": 2, "q": "根据《水利工程工程量清单计价规范》，工程量清单中的其他项目清单应包括以下哪些内容？（　）", "a": ["暂列金额", "暂估价", "计日工", "总承包服务费", "措施项目费", ""], "r": "ABCD", "e": "其他项目清单包含暂列金额、暂估价、计日工、总承包服务费。措施项目费是与其他项目清单并列的清单类型。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782659", "t": 2, "q": "水利工程概预算编制中，基本预备费的用途包括以下哪些情况？（　）", "a": ["在批准的初步设计范围内，技术设计、施工图设计及施工过程中所增加的工程费用", "设计变更、工程变更、材料代用等增加的费用", "一般自然灾害造成的损失和预防自然灾害所采取的措施费用", "竣工验收时为鉴定工程质量对隐蔽工程进行必要的挖掘和修复费用", "建设期内由于物价上涨所增加的费用", ""], "r": "ABCD", "e": "基本预备费用于应对批准设计范围内增加工程费、设计变更等增费、自然灾害损失及措施费、隐蔽工程挖掘修复费等。物价上涨增加费用属价差预备费。ABCD符合基本预备费用途。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2035637145187782660", "t": 2, "q": "水利工程混凝土工程量计量时，以下哪些部位的混凝土应单独计量，不包含在主体结构混凝土工程量中？（　）", "a": ["混凝土止水", "混凝土预埋件", "混凝土导流孔", "混凝土爬梯", "混凝土坝体排水孔", ""], "r": "ABD", "e": "混凝土止水、预埋件、爬梯等属于附属设施，单独计量；导流孔、坝体排水孔在主体结构混凝土施工中形成，其混凝土不单独计量。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439040", "t": 3, "q": "水利工程概预算中，基本预备费的计算基数包含工程费用、工程建设其他费用以及价差预备费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基本预备费计算基数是工程费用与工程建设其他费用之和，不包含价差预备费。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439041", "t": 3, "q": "水利工程土方开挖工程量计量时，建筑物基础开挖的工作面宽度应根据施工规范和施工组织设计确定，计入开挖工程量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利工程土方开挖工程量计量中，建筑物基础开挖的工作面宽度按施工规范和施工组织设计确定后，是要计入开挖工程量的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439042", "t": 3, "q": "水利工程中的夜间施工增加费属于企业管理费的组成部分。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "夜间施工增加费属于措施费，并非企业管理费组成部分。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439043", "t": 3, "q": "水利工程混凝土工程量计量时，混凝土结构中的钢筋所占体积应从混凝土工程量中扣除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程混凝土工程量计量时，混凝土结构中的钢筋所占体积不扣除。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439044", "t": 3, "q": "水利工程概预算中，价差预备费采用单利计算，按各年投资计划额和物价上涨指数计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程概预算中，价差预备费采用复利计算，并非单利。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439046", "t": 3, "q": "水利工程工程量清单中的暂列金额由投标人根据自身情况自主报价。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "暂列金额是招标人在工程量清单中暂定并包括在合同价款中的一笔款项，由招标人确定金额，并非由投标人自主报价。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439047", "t": 3, "q": "水利工程闸门安装工程量按闸门本体重量计量，包括闸门主轨的重量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程闸门安装工程量按闸门本体重量计量，但不包括闸门主轨等附属设备重量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146324439048", "t": 3, "q": "水利工程人工预算单价中的生产工人辅助工资包括职工学习、培训期间的工资。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水利工程人工预算单价里生产工人辅助工资包含职工学习、培训期间工资等内容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633344", "t": 3, "q": "水利工程概预算中，工程建设其他费用中的建设管理费包含施工企业现场管理费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "建设管理费是建设单位为建设项目的立项、筹建、建设、竣（交）工验收、总结等工作所发生的费用，而施工企业现场管理费是施工企业为组织施工生产和经营管理所需费用，二者主体不同，建设管理费不包含施工企业现场管理费。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633345", "t": 3, "q": "水利工程隧洞开挖采用钻爆法施工时，其工程量按隧洞衬砌后净断面尺寸计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程隧洞开挖采用钻爆法施工时，工程量按设计断面尺寸（即不考虑衬砌后净断面）加允许超挖量以体积计算。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633346", "t": 3, "q": "水利工程企业管理费的计算基数通常为人工费与施工机械使用费之和。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水利工程中，企业管理费计算基数一般是人工费与施工机械使用费之和。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637146328633347", "t": 3, "q": "水利工程概预算编制中，不同价格水平年的工程费用调整依据是人工工资上涨率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水利工程概预算编制中，不同价格水平年工程费用调整依据是多种因素，不只是人工工资上涨率，还包括材料价格变动、机械台班费变化等。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "K14", "n": "知识点14  水资源数据管理、大数据技术在水利领域的应用", "qs": [{"id": "2035637150346776576", "t": 1, "q": "在智慧水利体系中，用于实现水利数据\"采、传、存、管、用\"全流程协同管理的核心技术架构是以下哪一种？", "a": ["分布式传感网络架构", "水利数据中台架构", "传统水利SCADA架构", "单一数据库存储架构", "", ""], "r": "B", "e": "水利数据中台架构可对水利数据全生命周期进行管理，实现“采、传、存、管、用”全流程协同。而分布式传感网络主要侧重数据采集；传统水利SCADA架构用于工业监控；单一数据库存储架构只是简单存储数据，无法实现全流程协同管理。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776577", "t": 1, "q": "某流域水资源管理部门需对海量历史降水数据、径流数据进行趋势分析，以支撑中长期水资源配置，此过程中最适合采用的大数据分析算法是？", "a": ["支持向量机分类算法", "时间序列分解与预测算法", "K-均值聚类算法", "决策树分类算法", "", ""], "r": "B", "e": "题目要对历史降水、径流数据做趋势分析以支撑中长期配置，时间序列分解与预测算法适合处理随时间变化的数据并进行趋势预测。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776578", "t": 1, "q": "在水资源数据管理中，针对不同来源（如水文站、气象站、墒情站）数据的格式差异、精度不一致问题，首要进行的处理环节是？", "a": ["数据备份", "数据清洗与标准化", "数据加密", "数据可视化", "", ""], "r": "B", "e": "因不同来源数据存在格式差异、精度不一致问题，需要先对数据进行清洗和标准化，使其格式统一、精度规范，才能进行后续处理。答案为B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776579", "t": 1, "q": "智慧水利中，数字孪生流域构建的关键技术不包括以下哪一项？", "a": ["流域三维地理信息建模技术", "实时数据与虚拟场景动态映射技术", "静态数据离线存储技术", "流域水文水动力耦合模拟技术", "", ""], "r": "C", "e": "数字孪生流域强调数据的实时性、动态性和交互性，以实现对流域的精准模拟和高效管理。静态数据离线存储技术不能满足实时动态交互需求，而A的三维地理信息建模、B的实时数据与虚拟场景动态映射、D的水文水动力耦合模拟都是构建数字孪生流域的关键技术。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776580", "t": 1, "q": "大数据技术在水利工程安全监测中的应用，其核心优势不体现在以下哪个方面？", "a": ["实现监测数据的实时采集与传输", "通过多源数据融合提升隐患识别精度", "基于历史数据训练模型实现风险预警", "减少监测设备的硬件投入成本", "", ""], "r": "D", "e": "大数据技术主要是对数据进行处理和分析等，不能直接减少监测设备的硬件投入成本。而A可实时获取数据，B能融合数据提高隐患识别能力，C能基于历史数据预警，都是大数据技术在水利工程安全监测中的优势。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776582", "t": 1, "q": "某地区采用物联网技术构建智慧墒情监测系统，其传感器节点采集的数据需通过无线网络传输至云端平台，以下哪种传输技术最适合在偏远山区、信号较弱区域使用？", "a": ["蓝牙技术", "Wi-Fi技术", "窄带物联网（NB-IoT）技术", "ZigBee技术", "", ""], "r": "C", "e": "蓝牙、Wi-Fi、ZigBee传输距离和覆盖范围有限，在偏远山区、信号弱区域表现不佳。窄带物联网（NB - IoT）覆盖范围广、功耗低，适合偏远山区等信号弱区域。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776583", "t": 1, "q": "在水利大数据平台建设中，用于解决\"数据孤岛\"问题的核心技术手段是？", "a": ["增加数据存储容量", "建立统一的数据接口标准与共享机制", "提升数据计算速度", "加强数据安全防护", "", ""], "r": "B", "e": "“数据孤岛”指各系统数据无法共享交流，解决此问题需让数据能有效流通。建立统一的数据接口标准与共享机制可打破数据间壁垒，实现数据共享。而增加存储容量、提升计算速度、加强安全防护均不能直接解决“数据孤岛”问题。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776584", "t": 1, "q": "智慧水利中的\"四预\"（预报、预警、预演、预案）体系中，\"预演\"环节主要依赖的技术是？", "a": ["数据可视化技术", "水文水动力数值模拟技术", "数据采集技术", "数据加密技术", "", ""], "r": "B", "e": "“预演”是对未来可能发生的水情等进行模拟推演，水文水动力数值模拟技术能通过建立模型对水流等情况进行模拟，从而支持“预演”。而数据可视化是呈现结果，数据采集是获取数据，数据加密是保障数据安全，均非“预演”主要依赖技术。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776585", "t": 1, "q": "水资源数据管理中，\"数据血缘\"管理的主要目的是？", "a": ["追溯数据的来源、处理过程与去向", "提高数据传输速度", "减少数据存储占用空间", "增强数据的可读性", "", ""], "r": "A", "e": "“数据血缘”重点在于体现数据的关联脉络，所以主要目的是追溯其来源、处理过程与去向。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776586", "t": 1, "q": "大数据技术在洪水预报中，相较于传统预报方法，其主要改进方向是？", "a": ["仅依赖历史观测数据", "融合多源数据（如雷达测雨、卫星云图）提升预报精度", "减少预报模型的参数数量", "缩短预报结果的输出时间（不考虑精度）", "", ""], "r": "B", "e": "传统预报方法数据来源单一，大数据技术能融合雷达测雨、卫星云图等多源数据，从而提升洪水预报精度。A仅依赖历史观测数据并非改进方向；C减少预报模型参数数量不一定是主要改进点；D不考虑精度缩短输出时间不符合洪水预报需求。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776587", "t": 1, "q": "在数字水利技术中，地理信息系统（GIS）与水利模型的集成应用，不包括以下哪项功能？", "a": ["流域地形地貌可视化展示", "水利工程空间位置查询", "基于地形数据的水文参数计算", "水利数据的加密传输", "", ""], "r": "D", "e": "A、B、C选项都是GIS与水利模型集成可实现的功能，涉及流域地形、水利工程位置和水文参数计算等；而水利数据加密传输与GIS和水利模型集成应用无直接关联。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776588", "t": 1, "q": "根据《水资源监测数据共享管理办法》，水资源监测数据共享应遵循的首要原则是？", "a": ["无偿共享原则", "安全可控与按需共享相结合原则", "优先满足企业需求原则", "仅向政府部门共享原则", "", ""], "r": "B", "e": "《水资源监测数据共享管理办法》规定，水资源监测数据共享首要原则是安全可控与按需共享相结合，要在保障安全前提下按需共享。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2035637150346776589", "t": 1, "q": "智慧水利中，用于实
