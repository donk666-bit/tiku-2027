"ap": [false, false, false, false, false, false]}, {"id": "2034528597561184283", "t": 1, "q": "2008年1月1日，甲公司销售一批材料给乙公司，货款为1 000 000元（含税价）。2008年7月1日，乙公司发生财务困难，无法按合同规定偿还债务，经双方协议，甲公司同意乙公司用产品偿还该应收账款。该产品市价为800 000元，增值税税率为17%，产品成本为500 000元，增值税发票已开，甲公司已将该产品作为原材料入库。假定甲公司对该应收账款未计提坏账准备，则甲公司该项债务重组损失为（　）元。", "a": ["200 000", "164 000", "64 000", "300 000", "", ""], "r": "C", "e": "甲公司应收账款为1000000元，乙公司用以偿债产品市价800000元，增值税800000×17% = 136000元，甲公司债务重组损失=1000000 - 800000 - 136000 = 64000元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184284", "t": 1, "q": "会计科目与账户的本质区别在于（　）。", "a": ["会计账户有结构，而会计科目无结构", "记录资产和权益的方法不同", "反映的经济内容不同", "记录资产和权益的内容不同", "", ""], "r": "A", "e": "科目只是名称，无结构；账户有结构能具体记录经济业务增减变动情况。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184285", "t": 1, "q": "甲公司于2008年发生经营亏损1000万元，按照税法规定，该亏损可用于抵减以后5个年度的应纳税所得额。该公司预计其于未来5年期间能够产生的应纳税所得额为800万元。甲公司适用的所得税税率为25％，无其他纳税调整事项，则甲公司2008年就该事项的所得税影响，应做的会计处理是（　）。", "a": ["确认递延所得税负债200万元", "确认递延所得税资产200万元", "确认递延所得税负债250万元", "确认递延所得税资产250万元", "", ""], "r": "B", "e": "经营亏损可抵减未来应纳税所得额，形成可抵扣暂时性差异，应确认递延所得税资产。能抵减的应纳税所得额为800万元，税率25%，所以递延所得税资产=800×25% = 200万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184286", "t": 1, "q": "在编制资产负债表时不能根据有关账户的期末余额直接填列的项目是（　）。", "a": ["预计负债", "存货", "短期借款", "应收票据", "", ""], "r": "B", "e": "存货需根据多个账户余额计算填列，不是直接根据有关账户期末余额填列，而预计负债、短期借款、应收票据可直接根据账户期末余额填列。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184287", "t": 1, "q": "采用分步法计算产品成本时，某步骤广义在产品是指？", "a": ["本步骤正在加工的在产品", "本步骤正在加工的在产品和本步骤已完工但尚未最终完工的半成品", "本步骤已完工但尚未最终完工的半成品", "本步骤正在加工的在产品、本步骤已完工但尚未最终完工的半成品以及后续步骤正在加工的在产品", "", ""], "r": "D", "e": "广义在产品要涵盖本步骤及后续步骤处于不同加工状态的产品。本步骤正在加工的、本步骤已完工但未最终完工的半成品、后续步骤正在加工的在产品都属于广义在产品。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184288", "t": 1, "q": "外购无形资产成本不包括（　）。", "a": ["宣传广告费用", "购买价款", "测试费用", "专业服务费用", "", ""], "r": "A", "e": "外购无形资产成本包括购买价款、相关税费以及直接归属于使该项资产达到预定用途所发生的其他支出，如测试费用、专业服务费用等。宣传广告费用与使无形资产达到预定用途无关，不计入成本。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184289", "t": 1, "q": "甲公司购入一项固定资产，入账价值为30万元，预计可使用年限为5年，预计净残值为2.5万元。企业对该项固定资产采用双倍余额递减法计提折旧，则第4年对该项固定资产计提的折旧额为（　）万元。", "a": ["3.24", "4.32", "2.592", "1.99", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184290", "t": 1, "q": " 下列关于《企业会计准则》中会计基本假设的说法，错误的是？", "a": ["持续经营是指企业在可预见的未来将按照当前规模和状态继续经营下去", "会计分期假设是权责发生制的产生基础", "会计主体确定了会计核算的空间范围", "货币计量假设下，企业只能以人民币作为记账本位币", "", ""], "r": "D", "e": "货币计量假设下，企业通常应选择人民币作为记账本位币，但业务收支以人民币以外的货币为主的企业，可以选定其中一种货币作为记账本位币，并非只能用人民币。A、B、C选项说法均正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184291", "t": 1, "q": "M公司2008年1月1日购入A公司发行的3年期公司债券。公允价值为10560.42万元，债券面值10000万元，每半年付息一次，到期还本，票面年利率6%，实际年利率4%。采用实际利率法摊销，则M公司2009年1月1日持有至到期投资摊余成本为（　）万元。", "a": ["1056.04", "10471.63", "10381.06", "1047.16", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184292", "t": 1, "q": "A企业为企业管理人员发放非货币性福利，领用企业自产产品一批，该产品的账面价值为42,000元，市场价格63,000元（不含增值税），增值税税率为17％。则A企业就该事项应确认的应付职工薪酬为（　）元。", "a": ["42,000", "73,710", "52,710", "63,000", "", ""], "r": "B", "e": "企业以自产产品发放非货币性福利，应按产品的公允价值和相关税费确认应付职工薪酬。本题中产品市场价格63000元，增值税为63000×17% = 10710元，应付职工薪酬=63000 + 10710 = 73710元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184293", "t": 1, "q": "资产负债表中，“存货”项目不包括下列哪项内容？", "a": ["委托加工物资", "库存商品", "原材料", "工程物资", "", ""], "r": "D", "e": "存货是企业日常活动中持有以备出售等的物资，工程物资是用于建造固定资产等工程的，不属于存货范畴。而委托加工物资、库存商品、原材料都属于存货。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184294", "t": 1, "q": "A公司、B公司均为一般纳税企业，增值税率为17％。A公司应收B公司的账款3150万元（未计提减值准备）已逾期，经协商双方进行债务重组。债务重组内容是:①B公司以银行存款偿付A公司账款450万元;②B公司以一项存货和一项股权投资偿付所欠账款的余额。B公司该项存货的账面价值为1350万元，公允价值为1575万元;股权投资的账面价值为155万元，公允价值为202万元。假定不考虑除增值税以外的其他税费，A公司的债务重组损失为（　）万元。", "a": ["1181.55", "655.25", "1449.30", "913.50", "", ""], "r": "B", "e": "A公司应收账款3150万元，B公司先以450万元银行存款偿还，存货公允价值1575万元，其增值税为1575×17%，股权投资公允价值202万元，A公司债务重组损失=3150 - 450 - 1575 - 1575×17% - 202 = 655.25（万元）。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184295", "t": 1, "q": "关于提供劳务收入的确认与计量，下列说法中不正确的是（　）。", "a": ["宣传媒介的收费，在相关的广告或商业行为开始出现于公众面前时确认收入", "安装工作是销售商品附带条件的，安装费用在资产负债表日根据安装的完工进度确认收入", "属于提供设备和其他有形资产的特许权使用费，在交付资产或者转移资产所有权时确认收入", "为特定客户开发软件的收费，在资产负债日根据开发的完工进度确认收入", "", ""], "r": "B", "e": "安装工作是销售商品附带条件的，安装费应在确认销售商品实现时确认收入，而非在资产负债表日根据安装完工进度确认，B选项说法错误。A、C、D选项说法均正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184296", "t": 1, "q": "账簿按用途分类时，管理费用明细账属于（　）。", "a": ["备查账簿", "分类账簿", "序时账簿", "订本账簿", "", ""], "r": "B", "e": "管理费用明细账是对各项管理费用进行分类登记的，属于分类账簿。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184297", "t": 1, "q": "下列成本核算方法中，成本计算期与产品生产周期基本一致的是？", "a": ["分类法", "分批法", "分步法", "品种法", "", ""], "r": "B", "e": "分批法是按照产品批别归集生产费用、计算产品成本，成本计算期与产品生产周期基本一致。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184298", "t": 1, "q": "会计人员对原始凭证审核后的处理正确的是（　）。", "a": ["对于真实、合法、合理的原始凭证，但内容不够完整或填写不准确的，应拒绝接受，并向单位领导报告", "对于审核符合要求的原始凭证，应及时据以编制记账凭证登记入账", "对于真实、合法、合理的原始凭证，但内容不够完整或填写不准确的，应退回补充和更正", "对于不真实、不合法的原始凭证，应拒绝接受，并向单位负责人报告", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184299", "t": 1, "q": "在物价持续下跌的情况下，发出存货采用（　）方法更能体现谨慎性要求。", "a": ["先进先出法", "个别计价法", "月末一次加权平均法", "移动加权平均法", "", ""], "r": "A", "e": "物价持续下跌时，先进先出法会使发出存货成本偏高，期末存货成本偏低，体现了不高估资产、不低估费用，符合谨慎性要求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184300", "t": 1, "q": "企业收到投资者以外币投入的资本，应当采用（　）折算。", "a": ["资产负债表日的汇率", "交易日即期汇率", "合同约定汇率", "收到外币款项当月月初的汇率", "", ""], "r": "B", "e": "企业收到投资者以外币投入的资本，应采用交易日即期汇率折算，这样能更准确反映投入资本的实际价值。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184301", "t": 1, "q": "投资人投入的资金和债权人投入的资金，投入企业后，形成企业的（　）。", "a": ["成本", "费用", "负债", "资产", "", ""], "r": "D", "e": "投资人投入资金和债权人投入资金进入企业后，会使企业拥有或控制能带来经济利益的资源，这符合资产的定义。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184302", "t": 1, "q": "编制资产负债表时，\"应收账款\"项目应根据相关科目余额减去其备抵科目余额后的净额填列，其备抵科目是？", "a": ["坏账准备", "累计折旧", "资产减值损失", "存货跌价准备", "", ""], "r": "A", "e": "“应收账款”的备抵科目是“坏账准备”，用于核算应收账款可能发生的坏账损失。累计折旧是固定资产的备抵科目；资产减值损失是损益类科目；存货跌价准备是存货的备抵科目。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184303", "t": 1, "q": "（　）不属于费用要素。", "a": ["财务费用", "销售费用", "应交税费", "管理费用", "", ""], "r": "C", "e": "费用是企业日常活动中发生的经济利益的总流出。财务、销售、管理费用都属于费用要素。而应交税费是负债类科目，不属于费用要素。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184304", "t": 1, "q": "下列金融资产中，应按公允价值进行初始计量，且交易费用不计入初始入账价值的是（　）。", "a": ["可供出售金融资产", "持有至到期投资", "应收款项", "交易性金融资产", "", ""], "r": "D", "e": "交易性金融资产按公允价值初始计量，交易费用计入当期损益，不计入初始入账价值；其他选项的交易费用均计入初始入账价值。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184305", "t": 1, "q": "下列有关会计主体的表述不正确的是（　）。", "a": ["企业的经济活动应与投资者的经济活动相区分", "会计主体可以是盈利组织，也可以是非盈利组织", "会计主体可以是独立的法人，也可以是非法人", "会计主体必须要有独立的资金，并独立编制财务报告对外报送", "", ""], "r": "D", "e": "会计主体不一定非要独立资金并独立对外报送财务报告，比如企业内部的车间等也可作为会计主体，但不独立对外报送财务报告。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184306", "t": 1, "q": "采用分类法计算产品成本，不涉及生产类型，因而在各种类型的生产中都可以应用。采用这种方法是为了（　）。", "a": ["简化各种产品的成本计算工作", "便于掌握各类产品的成本水平", "简化各类产品成本的计算工作", "便于进行成本分析和考核", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184307", "t": 1, "q": "甲股份有限公司在报告年度资产负债表日至财务报告批准报出日之间发生的下列事项中，不属于非调整事项的有（　）。", "a": ["增发股票", "报告年度销售的部分产品被退回", "对某一企业进行巨额投资", "发生洪涝灾害导致存货严重毁损", "", ""], "r": "B", "e": "资产负债表日后非调整事项是指表明资产负债表日后发生的情况的事项。报告年度销售的部分产品被退回，是对资产负债表日已存在情况提供了新的或进一步证据，属于调整事项；而增发股票、巨额投资、洪涝灾害致存货毁损都是资产负债表日后新发生的事项，属于非调整事项。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184308", "t": 1, "q": "A公司为建造一栋办公楼于2008年1月1日专门从银行借入4000万元款项，借款期限为3年，年利率为6％。2008年2月1日，A公司采用出包方式委托B公司为其建造该办公楼，并于当日预付工程款1500万元，办公楼实体建造活动于当日开始。有关建造支出均以上述借入款项支付。该工程因发生施工安全事故于2008年3月1日中断施工，7月1日恢复正常施工;该项工程的预计工期为1年零6个月。不考虑闲置资金收益等其他因素，该项建造工程在2008年度借款费用的资本化金额为（　）万元。", "a": ["140", "52.5", "220", "160", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184309", "t": 1, "q": "下列关于记账本位币的确定的说法中，不正确的是（　）。", "a": ["企业管理当局可以随意变更记账本位币", "业务收支以人民币以外的货币为主的企业，可以按规定选择其中的一种货币作为记账本位币。但是，编报财务报表的时候应当折算为人民币", "企业管理当局根据实际情况只能确定其中一种货币作为记账本位币", "企业的记账本位币，是指企业经营所处的主要经济环境中的货币", "", ""], "r": "A", "e": "记账本位币不能随意变更，企业变更记账本位币需有合理理由并按规定进行处理。B选项业务收支外币为主可选外币为记账本位币但报表折算为人民币、C选项管理当局只能确定一种记账本位币、D选项记账本位币概念描述均正确。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184310", "t": 1, "q": "下列经济事项中，能使企业投资活动的现金流量发生变化的是（　）。", "a": ["发行债券时收到现金", "购买工程物资时支付现金", "销售商品时收到现金", "以现金归还借款利息", "", ""], "r": "B", "e": "投资活动是指企业长期资产的购建和不包括在现金等价物范围内的投资及其处置活动。B选项购买工程物资属于长期资产购建，会使投资活动现金流量变化；A选项发行债券收到现金属于筹资活动；C选项销售商品收到现金属于经营活动；D选项归还借款利息属于筹资活动。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184311", "t": 1, "q": "A公司2008年年初开始进行新产品专利技术的研究开发，研究阶段共发生支出400万元，开发阶段共发生支出600万元（假定均符合资本化条件），至2009年年初研发成功，并向国家专利局提出专利权申请且获得专利权，实际发生注册登记费等80万元。该项专利权法律保护年限为10年，预计使用年限8年。则A公司对该项专利权2009年度应摊销的金额为（　）万元。", "a": ["68", "85", "75", "135", "", ""], "r": "B", "e": "无形资产入账价值为开发阶段资本化支出与注册登记费之和，即600 + 80 = 680万元，按预计使用年限8年摊销，2009年应摊销金额为680÷8 = 85万元。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184312", "t": 1, "q": "甲公司就应收B公司账款80万元（未计提坏账准备）与B公司进行债务重组，B公司以银行存款支付10万元，另以一批商品抵偿债务。商品的成本为40万元，计税价格（公允价值）为50万元，增值税税率为17％，款项和商品均已交给甲公司。则B公司在该债务重组中应计入营业外收入的金额为（　）万元。", "a": ["30", "20", "11.5", "21.5", "", ""], "r": "C", "e": "B公司债务重组利得=80-10-50-50×17% = 11.5（万元），商品转让收益=50 - 40 = 10（万元），营业外收入为债务重组利得11.5万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184313", "t": 1, "q": "2008年1月1日，大天公司融资租入一栋办公楼，租赁期为8年。该办公楼尚可使用年限为20年。2008年1月20日，开始对该办公楼进行装修，至6月30日装修工程完工并投入使用，共发生可资本化支出100万元;预计下次装修时间为2014年6月30日。大天公司对装修后的固定资产装修费用的折旧年限是（　）。", "a": ["15年", "20年", "6年", "8年", "", ""], "r": "C", "e": "装修费用应按两次装修间隔时间与租赁剩余期限两者中较短者作为折旧年限。租赁期8年，2008年开始租，下次装修2014年，间隔6年，6年小于租赁剩余期限，所以折旧年限为6年。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184314", "t": 1, "q": "采用分步法计算产品成本时，成本还原的对象是？", "a": ["各步骤半成品成本", "各步骤完工产品成本", "最后步骤产成品成本中所耗上一步骤半成品成本", "产成品成本", "", ""], "r": "C", "e": "成本还原是把最后步骤产成品成本中所耗上一步骤半成品成本逐步分解，还原成原始成本项目。所以成本还原对象是最后步骤产成品成本中所耗上一步骤半成品成本。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184315", "t": 1, "q": "甲公司在年度财务报告批准报出日之前发现了报告年度的重大会计差错，需要做的会计处理是（　）。", "a": ["在发现当期报表附注中做出披露", "按照资产负债表日后事项调整事项的处理原则作出相应调整", "按照资产负债表日后事项非调整事项的处理原则作出披露", "作为发现当期的会计差错更正", "", ""], "r": "B", "e": "资产负债表日后期间发现报告年度重大会计差错，应按资产负债表日后调整事项处理原则进行调整。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184316", "t": 1, "q": "编制资产负债表时，\"应付账款\"项目应根据（　）填列。", "a": ["\"应付账款\"科目所属明细科目的期末贷方余额", "\"应付账款\"和\"预收账款\"科目所属明细科目的期末贷方余额合计数", "\"应付账款\"总账科目余额", "\"应付账款\"和\"预付账款\"科目所属明细科目的期末贷方余额合计数", "", ""], "r": "D", "e": "“应付账款”项目应根据“应付账款”和“预付账款”科目所属明细科目的期末贷方余额合计数填列。因为预付账款明细贷方实质是应付性质。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184317", "t": 1, "q": "（　）不属于企业存货。", "a": ["库存商品", "原材料", "接受外单位委托代销的商品", "在产品", "", ""], "r": "C", "e": "存货是企业拥有或控制的用于日常经营的物资，接受外单位委托代销的商品，企业不拥有其所有权，不属于企业存货。而库存商品、原材料、在产品都属于企业存货。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184318", "t": 1, "q": "资产负债表中，\"固定资产\"项目应根据\"固定资产\"科目的期末余额减去（　）后的净额填列。", "a": ["累计折旧", "坏账准备", "累计折旧和固定资产减值准备", "固定资产减值准备", "", ""], "r": "C", "e": "“固定资产”项目要反映其账面价值，需用“固定资产”科目期末余额减去累计折旧和固定资产减值准备。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184319", "t": 1, "q": "在借贷记账法下，“制造费用”账户期末一般？", "a": ["无余额", "余额在借方", "余额在贷方", "余额方向不确定", "", ""], "r": "A", "e": "制造费用是成本类账户，月末需将其归集的费用按照一定方法分配到生产成本中，所以期末一般无余额。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184320", "t": 1, "q": "A公司从2008年1月1日起对期末存货采用成本与可变现净值孰低法计价，成本与可变现净值的比较采用单项比较法。该公司2008年12月31日甲、乙、丙三种存货的成本分别为:30万元、90万元、120万元;甲、乙、丙三种存货的可变现净值分别为:45万元、50万元、95万元。该公司2008年12月31日资产负债表中反映的存货净额为（　）万元。", "a": ["240", "175", "187", "190", "", ""], "r": "B", "e": "按成本与可变现净值孰低法，甲存货成本30万小于可变现净值45万，按30万计价；乙存货成本90万大于可变现净值50万，按50万计价；丙存货成本120万大于可变现净值95万，按95万计价。存货净额=30 + 50 + 95 = 175万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184321", "t": 1, "q": "某企业2008年度共发生财务费用25 000元，其中:短期借款利息为20 000元，经营活动中办理银行业务发生的手续费为3 000元，发行公司债券手续费2 000元。则现金流量表补充资料中的\"财务费用\"项目应填列的金额为（　）元。", "a": ["25 000", "22 000", "23 000", "20 000", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184322", "t": 1, "q": "蓝田公司于2008年6月10日，购买运通公司股票300万股，成交价格每股10元，作为可供出售金融资产;购买该股票另支付手续费等45万元。10月20日，收到运通公司按每10股派6元的现金股利。11月30日该股票市价为每股9元，2008年12月31日以每股8元的价格将股票全部售出，则可供出售金融资产影响2008年投资收益的金额为（　）万元。", "a": ["-465", "-645", "180", "-300", "", ""], "r": "A", "e": "购入成本为300×10 + 45 = 3045万元；现金股利300÷10×6 = 180万元；出售收入300×8 = 2400万元，投资收益为2400 + 180 - 3045 = - 465万元。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184323", "t": 1, "q": "某公司对期末存货采用成本与可变现净值孰低法计价。2008年12月31日库存自制半成品的实际成本为80万元，预计进一步加工所需费用为32万元。该半成品加工完成后的产品预计销售价格为120万元，预计产成品的销售费用及税金为16万元。假定该公司以前年度未计提存货跌价准备。2008年12月31日该项存货应计提的跌价准备为（　）万元。", "a": ["32", "8", "40", "0", "", ""], "r": "B", "e": "先算产成品可变现净值=120 - 16 = 104万元，产成品成本=80 + 32 = 112万元，成本高于可变现净值，半成品可变现净值=104 - 32 = 72万元，半成品成本80万元，应计提跌价准备80 - 72 = 8万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184324", "t": 1, "q": "2009年3月份，某企业损益类账户的余额如下:营业收入（贷方）55000元，营业外收入（贷方）5000元，投资收益（贷方）15000元，销售费用（借方）3000元，营业成本（借方）21000元。则该企业3月份的营业利润为（　）元。", "a": ["51000元", "31000元", "46000元", "34000元", "", ""], "r": "C", "e": "营业利润=营业收入 + 投资收益 - 销售费用 - 营业成本，即55000 + 15000 - 3000 - 21000 = 46000元，营业外收入不影响营业利润。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184325", "t": 1, "q": "下列关于企业利润表编制的说法，错误的是？", "a": ["以\"收入-费用=利润\"为理论依据", "编制基础是权责发生制", "直接根据总账科目余额填列所有项目", "反映企业一定会计期间的经营成果", "", ""], "r": "C", "e": "利润表部分项目需根据有关科目发生额分析填列，并非直接根据总账科目余额填列所有项目。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184326", "t": 1, "q": "填制资产负债表\"存货\"项目的主要依据不包括（　）。", "a": ["生产成本", "原材料", "存货跌价准备", "工程物资", "", ""], "r": "D", "e": "工程物资核算的是为建造固定资产等而储备的物资，不属于企业的存货，不能用于填列资产负债表“存货”项目。而生产成本、原材料属于存货内容，存货跌价准备是存货的备抵科目，都用于“存货”项目填列。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184327", "t": 1, "q": "各月在产品数量变动较大的情况下，采用在产品按定额成本计价法将生产费用在完工产品和在产品之间进行分配时，可能导致（　）。", "a": ["本月完工产品成本为负数", "月初在产品成本为负数", "月末在产品成本为负数", "本月发生的生产费用为负数", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184328", "t": 1, "q": "企业发生的下列经济业务中，会引起资产和负债同时减少的是？", "a": ["从银行借入长期借款", "购买原材料，款项未付", "接受投资者投入固定资产", "以银行存款偿还短期借款", "", ""], "r": "D", "e": "A选项是资产和负债同时增加；B选项也是资产和负债同时增加；C选项是资产和所有者权益同时增加；D选项以银行存款偿还短期借款，银行存款（资产）减少，短期借款（负债）减少，符合资产和负债同时减少。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184329", "t": 1, "q": "各单位每年形成的会计档案，都应由（　）按照归档要求，负责整理立卷，装订成册，编制会计档案保管清册。", "a": ["业务部门", "档案管理部门", "会计师事务所", "会计机构", "", ""], "r": "D", "e": "单位会计档案由会计机构整理归档，编制保管清册。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184330", "t": 1, "q": "企业发生的下列经济业务中，会引起资产和所有者权益同时增加的是？", "a": ["接受投资者投入固定资产", "用银行存款偿还前欠货款", "以盈余公积转增资本", "从银行借入短期借款", "", ""], "r": "A", "e": "A选项，接受投资者投入固定资产，资产增加，同时所有者权益也增加；B选项是资产和负债同时减少；C选项是所有者权益内部一增一减；D选项是资产和负债同时增加。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184331", "t": 1, "q": "下列关于记账凭证填制的基本要求，不正确的是（　）。", "a": ["所有的记账凭证都必须附原始凭证", "填制记账凭证时若发生错误，应当重新填制", "记账凭证各项内容必须完整，并且应当连续编号", "记账凭证填制完经济业务事项后，如有空行，应当自金额栏最后一笔金额数字下的空行处至合计数上的空行处划线注销", "", ""], "r": "A", "e": "除结账和更正错账可以不附原始凭证外，其他记账凭证必须附原始凭证，A选项说法太绝对。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184332", "t": 1, "q": "采用分步法核算产品成本时，若采用逐步综合结转分步法，进行成本还原的目的是？", "a": ["简化成本计算工作", "确定各步骤在产品成本", "便于进行成本分析和考核", "准确计算各步骤半成品成本", "", ""], "r": "C", "e": "逐步综合结转分步法下，上一步骤半成品成本以综合项目结转到下一步骤，不能反映原始成本构成，成本还原可将其还原为原始成本项目，方便进行成本分析和考核。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184333", "t": 1, "q": "资产负债表中，\"长期借款\"项目应根据（　）填列。", "a": ["\"长期借款\"总账科目余额", "\"长期借款\"科目期末余额扣除一年内到期且企业不能自主地将清偿义务展期的部分后的金额", "\"长期借款\"科目所属明细科目余额", "\"长期借款\"科目期末余额加上一年内到期的部分金额", "", ""], "r": "B", "e": "资产负债表中“长期借款”项目要体现真正长期负债性质，需扣除一年内到期且企业不能自主展期的部分。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184334", "t": 1, "q": "企业将持有至到期的债券投资在到期前处置或重分类，通常表明其违背了将投资持有到期的最初意图。如果处置或重分类为其他类金融资产的金额相对于该类投资（即企业全部持有至到期投资）在出售或重分类前的总额较大，则企业在处置或重分类后应立即将其剩余的持有至到期投资（即全部持有至到期投资扣除已处置或重分类的部分）重分类为（　）。", "a": ["交易性金融资产", "可供出售权益工具", "可供出售金融资产", "应收款项", "", ""], "r": "C", "e": "根据规定，企业处置或重分类持有至到期投资金额较大时，剩余的持有至到期投资应重分类为可供出售金融资产。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937536", "t": 2, "q": "大洋企业因或有事项很可能赔偿A公司120万元，同时，因该或有事项大洋企业基本确定可以从B公司获得80万元的补偿金，大洋企业正确的会计处理是（　）。", "a": ["确认其他应收款80万元", "确认营业外支出和预计负债40万元", "确认营业外支出和预计负债120万元", "不确认其他应收款", "", ""], "r": "AC", "e": "或有事项很可能赔偿应确认预计负债120万，基本确定能获得的补偿可确认其他应收款80万，赔偿计入营业外支出。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937537", "t": 2, "q": "下列交易或事项产生的现金流量中，属于投资活动产生的现金流量的有（　）。", "a": ["为购建固定资产支付的耕地占用税", "因股权性投资而分得的现金股利", "为购建固定资产支付的已资本化的利息费用", "自然灾害等原因所造成的固定资产报废、毁损而收到的保险赔款", "", ""], "r": "ABD", "e": "投资活动是指企业长期资产的购建和不包括在现金等价物范围内的投资及其处置活动。A为购建固定资产支付的耕地占用税，是购建长期资产支出，属于投资活动现金流出；B因股权性投资分得现金股利，是投资收益现金流入，属于投资活动；D固定资产报废、毁损收到保险赔款，是长期资产处置相关现金流入，属于投资活动。而C为购建固定资产支付已资本化利息费用，属于筹资活动现金流出。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937538", "t": 2, "q": "下列关于商业折扣、现金折扣和销售折让的说法中，正确的有（　）。", "a": ["商业折扣是企业为促进商品销售而在商品标价上给予的价格扣除，因而不影响销售商品收入的计量", "当现金折扣实际发生时，需要冲减企业原确认的营业收入", "对于销售折让一般销售行为在先，购货方希望售价减让在后，销售折让发生时，应当直接冲减当期销售商品收入", "现金折扣是在销售商品收入金额确定的情况下，债权人为鼓励债务人在规定的期限内付款而向债务人提供的债务扣除", "", ""], "r": "ACD", "e": "商业折扣按折扣后金额确认收入，不影响计量；现金折扣实际发生时计入财务费用，不冲减营业收入；销售折让冲减当期收入；现金折扣是鼓励债务人提前付款的债务扣除。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937539", "t": 2, "q": "下列关于可转换公司债券的说法或做法，正确的有（　）。", "a": ["发行可转换公司债券发生的交易费用，应在负债成分和权益成分之间按照各自的相对公允价值比例进行分摊", "企业发行的可转换公司债券，应在初始确认时将其包含的负债成分和权益成分进行分拆，将负债成分确认为应付债券，将权益成分确认为资本公积", "可转换公司债券在进行分拆时，应对负债成分的未来现金流量进行折现确定负债成分的初始确认金额", "发行可转换公司债券发生的交易费用，直接计入当期损益", "", ""], "r": "ABC", "e": "发行可转换公司债券，要对负债和权益成分分拆，负债成分按未来现金流量折现确认初始金额，交易费用按负债和权益成分相对公允价值比例分摊，而不是直接计入当期损益。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937540", "t": 2, "q": "对于同一控制下的企业合并，合并方以发行权益性证券作为合并对价的，下列说法中不正确的有（　）。", "a": ["应当在合并日按照取得被合并方所有者权益账面价值的份额作为长期股权投资的初始投资成本，按照发行股份的面值总额作为股本，长期股权投资初始投资成本与所发行股份面值总额之间的差额，应当计入当期损益", "应当在合并日按照取得被合并方所有者权益账面价值的份额作为长期股权投资的初始投资成本，按照发行股份的面值总额作为股本", "应当在合并日按照取得被合并方可辨认净资产公允价值的份额作为长期股权投资的初始投资成本，按照发行股份的面值总额作为股本", "应当在合并日按照取得被合并方所有者权益公允价值的份额作为长期股权投资的初始投资成本，按照发行股份的面值总额作为股本", "", ""], "r": "ACD", "e": "同一控制下企业合并，应按取得被合并方所有者权益账面价值份额作为长投初始投资成本，按发行股份面值总额作股本，差额调整资本公积等，而非计入当期损益，也不是按被合并方可辨认净资产公允价值或所有者权益公允价值份额。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937541", "t": 2, "q": "采用分批法计算产品成本时，产品成本计算单应登记的内容包含？", "a": ["该批次产品应分摊的制造费用", "该批次产品耗用的直接材料成本", "该批次产品完工入库的时间", "该批次产品的生产批号", "", ""], "r": "ABD", "e": "分批法以产品批别为成本计算对象。产品成本计算单要记录该批次相关成本及信息。A制造费用、B直接材料成本是该批次产品成本组成部分；D生产批号是区分不同批次的关键；C完工入库时间并非计算成本必须登记内容。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937542", "t": 2, "q": "在进行资产减值测试时，下列表述正确的有（　）。", "a": ["对资产未来现金流量的预计应建立在经企业管理层批准的最近财务预算或者预测数据的基础上", "若资产生产的产品提供企业内部使用，应以内部转移价格为基础预计资产未来现金流量", "预计资产未来现金流量不包括筹资活动和所得税收付产生的现金流量", "资产预计的未来现金流量包括与资产改良有关的现金流出", "", ""], "r": "AC", "e": "A选项，资产未来现金流量预计要基于经管理层批准的最近财务预算或预测数据，合理；B选项，内部使用产品应以市场价格而非内部转移价格预计现金流量；C选项，筹资和所得税相关现金流不纳入资产未来现金流量预计；D选项，资产改良现金流不包含在预计未来现金流量中。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937543", "t": 2, "q": "\"材料采购\"账户的结构是（　）。", "a": ["贷方登记采购材料的节约额", "借方登记采购材料的实际成本", "借方登记采购材料的超支额", "贷方登记采购材料的超支额", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937544", "t": 2, "q": "下列各项中，属于反映财务状况的会计要素有（　）", "a": ["费用", "负债", "资产", "收入", "", ""], "r": "BC", "e": "会计要素中反映财务状况的是资产、负债和所有者权益。本题选项里B负债和C资产属于反映财务状况的会计要素，A费用和D收入是反映经营成果的会计要素。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937545", "t": 2, "q": "我国某企业的记账本位币为港币，则下列说法中不正确的有（　）。", "a": ["该企业以人民币计价和结算的交易属于外币交易", "该企业期末应采用港币编制报表", "该企业以港币计价和结算的交易属于外币交易", "该企业期末应采用人民币编制报表", "", ""], "r": "CD", "e": "记账本位币是港币，以非港币计价和结算的交易才是外币交易，所以C错误；企业通常应按记账本位币编制报表，该企业记账本位币是港币，期末应采用港币编制报表，B正确，D错误。以人民币计价和结算的交易，人民币相对港币是外币，属于外币交易，A正确。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937546", "t": 2, "q": "下列表述正确的有（　）。", "a": ["某项房地产部分用于出租，部分用于自用，能够区分的分开核算出租部分和自用部分", "某项房地产部分用于出租，部分用于自用，能够区分的分开核算出租部分和自用部分，不能区分的全部作为投资性房地产核算", "按照国家有关规定认定的闲置土地属于持有并准备转让的土地使用权", "某项房地产部分用于出租，部分用于自用，能够区分的分开核算出租部分和自用部分，不能区分的全部作为自用房产核算", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937547", "t": 2, "q": "甲公司当期发生的交易或事项中，会引起现金流量表中筹资活动的现金流量发生增减变动的有（　）。", "a": ["偿还短期借款本金", "向投资者分派现金股利100万元", "发行股票时由证券商支付的股票印刷费用", "收到被投资单位分来的现金股利300万元", "", ""], "r": "AB", "e": "筹资活动是指导致企业资本及债务规模和构成发生变化的活动。A选项偿还短期借款本金属于债务偿还，是筹资活动现金流出；B选项向投资者分派现金股利是向投资者支付回报，属于筹资活动现金流出。C选项由证券商支付印刷费，企业未实际支付现金，不影响现金流量。D选项收到被投资单位分来的现金股利属于投资活动现金流量。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937548", "t": 2, "q": "采用品种法核算产品成本时，其特点包括？", "a": ["适用于大量大批单步骤生产企业", "成本计算期与产品生产周期一致", "一般定期（每月月末）计算产品成本", "以产品品种为成本计算对象", "", ""], "r": "ACD", "e": "品种法适用于大量大批单步骤生产企业，以产品品种为成本计算对象，一般定期（每月月末）计算产品成本，成本计算期与会计报告期一致，而非与产品生产周期一致。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937549", "t": 2, "q": "对于由财政直接支付的购置固定资产的款项，行政单位的账务处理是（　）。", "a": ["借记\"事业支出\"科目，贷记\"财政补助收入\"科目", "借记\"经费支出\"科目，贷记\"财政补助收入\"科目", "借记\"经费支出\"科目，贷记\"拨入经费\"科目", "借记\"固定资产\"科目，贷记\"固定基金\"科目", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937550", "t": 2, "q": "资产负债表分析中，用于衡量企业短期偿债能力的指标组合合理的有？", "a": ["流动比率、速动比率、现金比率", "资产负债率、产权比率、权益乘数", "流动比率、速动比率、营运资金", "营运资金、流动比率、利息保障倍数", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937551", "t": 2, "q": "根据《企业会计准则》，会计基本假设包括哪些？", "a": ["会计分期", "会计主体", "持续经营", "货币计量", "", ""], "r": "ABCD", "e": "会计基本假设是企业会计确认、计量、记录和报告的前提，包括会计主体、持续经营、会计分期和货币计量。答案包含 ABCD 四个选项。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937552", "t": 2, "q": "关于总分类会计科目与明细分类会计科目的表述正确的是（　）。", "a": ["总分类会计科目对明细分类科目具有控制作用", "明细分类会计科目是对总分类会计科目的补充和说明", "总分类会计科目详细地反映会计对象的具体内容", "明细分类会计科目概括地反映会计对象的具体内容", "", ""], "r": "AB", "e": "总分类科目是对会计要素具体内容进行总括分类、提供总括信息的会计科目，对明细分类科目有控制作用；明细分类科目是对总分类科目作进一步分类、提供更详细更具体会计信息，是对总分类科目的补充和说明。总分类科目概括反映，明细分类科目详细反映。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937553", "t": 2, "q": "关于《企业会计准则》中会计信息质量的可比性要求，下列表述正确的有？", "a": ["不同企业发生相同交易，应采用规定会计政策，确保口径一致", "会计政策变更必然会降低会计信息可比性", "同一企业不同时期应采用一致会计政策，不得随意变更", "企业变更会计政策需在附注中披露原因及影响", "", ""], "r": "ACD", "e": "可比性要求不同企业相同交易采用规定会计政策保证口径一致，同一企业不同时期会计政策应一致且不得随意变更，变更时要在附注披露原因及影响。会计政策合理变更不会降低可比性。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937554", "t": 2, "q": "下列行为，在增值税处理上视同销售的项目有（　）。", "a": ["将外购产成品用于在建工程", "将外购原材料用于对外投资", "将外购原材料分配给股东", "将外购原材料用于在建工程", "", ""], "r": "BC", "e": "视同销售是指在会计上不作为销售核算，但在税收上作为销售，确认收入计缴税金的商品或劳务的转移行为。将外购货物用于对外投资、分配给股东，货物的所有权发生转移，应视同销售。而将外购货物用于在建工程，属于用于非应税项目，不视同销售。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937555", "t": 2, "q": "下列各个项目中，关于让渡本企业资产使用权的说法中正确的有（　）", "a": ["金融企业让渡现金使用权取得的利息收入属于让渡资产使用权收入", "如果合同或协议约定一次性收取使用费，且不提供后续服务的，应当视同销售该项资产，一次性确认收入", "处置无形资产所取得的收益不属于让渡资产使用权收入", "如果合同或协议约定一次性收取使用费，且提供后续服务的，应在合同或协议约定的有效期内分期确认收入", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937556", "t": 2, "q": "记账凭证可以根据（　）编制。", "a": ["若干张同一类别的原始凭证汇总", "原始凭证汇总表", "每一张原始凭证", "同一日期的所有原始凭证汇总", "", ""], "r": "ABC", "e": "记账凭证可根据每一张原始凭证、若干张同类原始凭证汇总或原始凭证汇总表编制，并非同一日期所有原始凭证都能汇总编制。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937557", "t": 2, "q": "下列有关行政事业单位的收入核算，说法正确的是（　）。", "a": ["按规定应上缴财政预算的资金和应缴财政专户的预算外资金应计入事业收入", "行政单位的收入包括拨入经费、预算外资金收入和其他收入", "年终结账时，行政单位要将\"预算外资金收入\"科目贷方余额转入\"结余\"科目", "事业单位的收入应当采用权责发生制核算", "", ""], "r": "BC", "e": "A选项，应上缴的资金不计入事业收入；D选项，事业单位收入一般采用收付实现制核算。B选项行政单位收入包含拨入经费、预算外资金收入和其他收入表述正确，C选项年终结账时行政单位将“预算外资金收入”贷方余额转入“结余”科目也正确。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937558", "t": 2, "q": "债务人以现金清偿债务的情况下，债权人进行账务处理可能涉及的科目有（　）。", "a": ["资产减值损失", "营业外支出", "营业外收入", "库存现金", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937559", "t": 2, "q": "某股份有限公司清偿债务的下列方式中，属于债务重组的有（　）。", "a": ["债权人延长债务偿还期限并在展期收取比原利率小的利息", "根据转换协议将应付可转换公司债券转为资本", "以低于债务账面价值的银行存款清偿", "以公允价值低于债务金额的非现金资产清偿", "", ""], "r": "ACD", "e": "债务重组是指在债务人发生财务困难的情况下，债权人按照其与债务人达成的协议或者法院的裁定作出让步的事项。A选项债权人延长偿债期限且降低利率是让步；C选项以低于债务账面价值的银行存款清偿、D选项以公允价值低于债务金额的非现金资产清偿，都体现债权人作出了让步。而B选项将应付可转换公司债券转为资本，并非债权人作出让步，不属于债务重组。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937560", "t": 2, "q": "下列各项中，属于应缴预算款的有（　）。", "a": ["行政性收费", "罚没收入", "无主财物变价款", "预算外资金", "", ""], "r": "ABC", "e": "应缴预算款是指行政单位按规定应缴入国家预算的款项，主要包括行政性收费、罚没收入、无主财物变价款等。而预算外资金不属于应缴预算款。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937561", "t": 2, "q": "下列项目中，需记入\"在建工程\"科目的有（　）。", "a": ["购入需要安装的固定资产", "固定资产的修理支出", "固定资产的改良支出", "出包的固定资产工程", "", ""], "r": "ACD", "e": "购入需安装固定资产、固定资产改良支出、出包的固定资产工程在达到预定可使用状态前都通过“在建工程”核算；固定资产修理支出一般计入当期损益。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937562", "t": 2, "q": "在具有商业实质且公允价值能够可靠计量的非货币性资产交换中，则换出资产公允价值与其账面价值的差额，下列会计处理错误的有（　）。", "a": ["换出资产为投资性房地产的，换出资产公允价值和换出资产账面价值的差额，计入其他业务收入", "换出资产为无形资产的，换出资产公允价值和换出资产账面价值的差额，计入营业外收入或营业外支出", "换出资产为可供出售金融资产的，换出资产公允价值和换出资产账面价值的差额，计入资本公积", "换出资产为库存商品的，应当视同销售处理，按其公允价值确认商品销售收入，同时结转商品销售成本", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937563", "t": 2, "q": "资产负债表中\"应收票据及应收账款\"项目填列时，应考虑的因素有？", "a": ["\"应收票据\"科目的期末余额", "\"预收账款\"科目所属明细科目的期末借方余额", "\"应收账款\"科目所属明细科目的期末借方余额", "相关的坏账准备余额", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937564", "t": 2, "q": "下列各项中，应计入存货实际成本中的有（　）。", "a": ["收回委托加工应税消费品所支付的消费税，该委托加工物资收回后用于继续生产应税消费品", "增值税一般纳税人委托加工物资收回时所支付的增值税", "发出用于委托加工的物资在运输途中发生的合理损耗", "商品流通企业外购商品时所发生的合理损耗", "", ""], "r": "CD", "e": "A项收回后继续生产应税消费品，消费税可抵扣，不计入成本；B项一般纳税人增值税可抵扣，不计入；C项委托加工物资运输途中合理损耗要计入实际成本；D项商品流通企业外购商品合理损耗也计入成本。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937565", "t": 2, "q": "下列各项表述中，正确的有（　）。", "a": ["购建某项固定资产过程中发生非正常停工，并且停工时间连续超过3个月，应当暂停借款费用资本化", "购建某项固定资产过程中发生正常停工，停工时间连续超过3个月，应当暂停借款费用资本化", "某项固定资产部分已达到预定可使用状态，且该部分可单独使用，则这部分资产发生的借款费用应停止资本化", "某项固定资产部分已达到预定可使用状态，即使该部分可单独使用，仍需待整体完工后方可停止借款费用资本化", "", ""], "r": "AC", "e": "非正常停工且连续超3个月应暂停资本化，正常停工不应暂停；部分达预定可使用状态且可单独使用，该部分借款费用应停止资本化。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937566", "t": 2, "q": "下列关于资产或负债的计税基础的表述中正确的有（　）。", "a": ["负债的计税基础，即在未来期间计税时，按照税法规定可以税前扣除的金额", "资产的计税基础，即账面价值减去在未来期间计税时按照税法规定可以税前扣除的金额", "负债的计税基础，即账面价值减去在未来期间计税时按照税法规定可以税前扣除的金额", "资产的计税基础，即在未来期间计税时按照税法规定可以税前扣除的金额", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937567", "t": 2, "q": "下列职工薪酬中，可以计入产品成本的有（　）。", "a": ["辞退福利", "职工工资", "住房公积金", "非货币性福利", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937568", "t": 2, "q": "下列各项中，属于现金流量表中所指的\"现金\"的有（　）。", "a": ["库存现金", "不能随时支取的定期存款", "其他货币资金", "可随时支取的存款", "", ""], "r": "ACD", "e": "现金流量表中的“现金”包括库存现金、可随时用于支付的存款和其他货币资金。不能随时支取的定期存款不符合“随时可用于支付”这一特性。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937569", "t": 2, "q": "企业在对境外经营的财务报表进行折算时，下列项目可采用发生时的即期汇率折算的有（　）。", "a": ["盈余公积", "实收资本", "资本公积", "固定资产", "", ""], "r": "BC", "e": "资产负债表中的资产和负债项目，采用资产负债表日的即期汇率折算，所有者权益项目除“未分配利润”项目外，其他项目采用发生时的即期汇率折算。固定资产是资产项目，用资产负债表日即期汇率折算；盈余公积、实收资本、资本公积属于所有者权益项目，实收资本和资本公积按发生时即期汇率折算。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937570", "t": 2, "q": "下列关于非货币性资产交换说法正确的有（　）。", "a": ["如果换入与换出资产的预计未来现金流量的现值不同，且其差额与换入资产和换出资产公允价值相比是重大的，则说明该项交换具有商业实质", "以银行本票购买固定资产不属于非货币性资产交换", "企业持有的不准备持有至到期的债券投资属于货币性资产", "具有商业实质且其换入或换出资产的公允价值能够可靠计量的非货币性资产交换，应当以换出资产的公允价值为基础确定换入资产的成本", "", ""], "r": "ABD", "e": "预计未来现金流现值不同且差额重大说明交换能带来不同经济利益，有商业实质，A 对；银行本票是货币资金，交易不属于非货币性资产交换，B 对；不准备持有至到期债券投资未来金额不固定，属非货币性资产，C 错；有商业实质且公允价值能可靠计量的非货币性资产交换，一般以换出资产公允价值为基础确定换入资产成本，D 对。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937571", "t": 2, "q": "下列各事项中，属于会计政策变更的有（　）。", "a": ["无形资产摊销年限从15年改为8年", "按规定存货期末计价的方法由成本法改为成本与可变现净值孰低法", "固定资产的折旧年限发生改变", "建造合同的收入确认由完成合同法改为完工百分比法", "", ""], "r": "BD", "e": "会计政策变更指企业对相同交易或事项由原来采用的会计政策改用另一会计政策的行为。选项B存货计价方法和选项D建造合同收入确认方法改变属于会计政策变更；选项A无形资产摊销年限和选项C固定资产折旧年限改变属于会计估计变更。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937572", "t": 2, "q": "下列说法中正确的有（　）。", "a": ["以前报告期间的计算结果表明，资产可收回金额远高于其账面价值，之后又没有发生消除这一差异的交易或事项，企业在资产负债表日可以不需要重新估计该资产的可收回金额", "只有当资产的公允价值减去处置费用后的净额与资产预计未来现金流量的现值均超过资产的账面价值，才可确定资产没有发生减值", "以前报告期间的计算与分析表明，资产可收回金额对于资产减值准则中所列示的一种或多种减值迹象不敏感，在本报告期间又发生了这些减值迹象的，在资产负债表日企业可以不需因为上述减值迹象的出现而重新估计该资产的可收回金额", "资产的公允价值减去处置费用后的净额如果无法估计的，应当以该资产预计未来现金流量的现值作为其可收回金额", "", ""], "r": "ACD", "e": "A选项，若以前资产可收回金额远高于账面价值且无消除差异事项，无需重新估计可收回金额；C选项，若以前表明资产可收回金额对减值迹象不敏感，本期出现这些迹象也可不重新估计；D选项，无法估计公允价值减处置费用净额时，以预计未来现金流量现值作为可收回金额。B选项，只要公允价值减去处置费用后的净额与资产预计未来现金流量的现值中有一项超过资产账面价值，就表明资产未发生减值，并非两项都超过。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937573", "t": 2, "q": "下列有关收入确认的表述中，正确的有（　）。", "a": ["属于与提供设备相关的特许权收入应在交付设备或设备所有权转移时确认", "附有销售退回条件的商品销售，如果企业不能合理估计退货可能性的，通常应在售出商品退货期满时确认收入", "为特定客户开发软件的收入应在资产负债表日根据开发的完成程度确认", "在订货方式销售下，企业通常应在发出商品时确认收入，在此之前收到款项时，确认为负债", "", ""], "r": "ABCD", "e": "ABCD选项表述均符合收入确认相关准则。A项特许权与设备相关在交付或转移所有权时确认；B项不能合理估计退货可能性在退货期满确认；C项特定客户开发软件按完工进度确认；D项订货方式在发出商品确认收入，收款时先确认为负债。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937574", "t": 2, "q": "下列各项中，属于会计估计变更的有（　）。", "a": ["坏账准备的提取比例由15％降低为10%", "存货的期末计价由成本法改为成本与可变现净值孰低法", "法定盈余公积的提取比例由15%降低为10%", "固定资产的净残值率由9％改为7%", "", ""], "r": "AD", "e": "会计估计变更是指由于资产和负债的当前状况及预期经济利益和义务发生了变化，从而对资产或负债的账面价值或者资产的定期消耗金额进行调整。A选项坏账准备提取比例、D选项固定资产净残值率的变更属于会计估计变更；B选项存货期末计价方法改变是会计政策变更；C选项法定盈余公积提取比例由法律规定，不属于会计估计变更。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937575", "t": 2, "q": "一般而言，在以下情况中，需要进行财产全面清查的有（　）", "a": ["单位撤销、分立", "单位改变隶属关系", "开展清产核资", "单位主要负责人调离工作", "", ""], "r": "ABCD", "e": "全面清查适用情况主要涉及单位重大变动、进行重要资产审核等。ABCD选项都属于此情形。ABCD四个选项，单位撤销、分立、改变隶属关系、开展清产核资、主要负责人调离工作时，均需全面清查财产，以确保财务状况清晰准确。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937576", "t": 2, "q": "长期借款所发生的利息支出、汇兑损失等借款费用，可能计入以下科目的有（　）。", "a": ["在建工程", "财务费用", "管理费用", "营业外支出", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937577", "t": 2, "q": "无形资产摊销金额，可能计入的科目有（　）。", "a": ["制造费用", "营业外支出", "研发支出", "在建工程", "", ""], "r": "ACD", "e": "无形资产摊销根据其用途计入不同科目。用于生产产品的摊销进制造费用；研发无形资产时符合条件的摊销进研发支出；用于在建工程建设的无形资产摊销进在建工程。营业外支出核算与日常经营无直接关系的损失，无形资产摊销不属于此类。所以答案选ACD。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937578", "t": 2, "q": "下列关于会计档案销毁的说法中，正确的有（　）", "a": ["对于保管期满但未结清的债权债务原始凭证，可以销毁", "正在项目建设期间的建设单位，其保管期满的会计档案不得销毁", "单独抽出立卷的会计档案，只要在会计档案销毁清册中列明即可销毁", "单位负责人应当在会计档案销毁清册上签署意见", "", ""], "r": "BD", "e": "保管期满但未结清债权债务原始凭证不能销毁，A错误；正在项目建设期间的建设单位，保管期满会计档案不得销毁，B正确；单独抽出立卷的会计档案，应在会计档案销毁清册和会计档案保管清册中列明，C错误；单位负责人要在会计档案销毁清册上签署意见，D正确。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937579", "t": 2, "q": "企业为购建固定资产专门借入的款项所发生的借款费用，停止资本化的时点有（　）。", "a": ["所购建固定资产与设计要求或合同要求相符或基本相符时", "继续发生在所购建固定资产上的支出金额很少或者几乎不再发生时", "固定资产的实体建造工作已经全部完成或实质上已经完成时", "需要试生产的固定资产在试生产结果表明资产能够正常生产出合格产品时", "", ""], "r": "ABCD", "e": "当满足所购建固定资产与设计要求或合同要求相符或基本相符、继续发生支出很少或几乎不再发生、实体建造全部完成或实质完成、试生产能正常产出合格产品等条件时，借款费用应停止资本化。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937580", "t": 2, "q": "按照现行规定，下列属于资产负债表日后非调整事项的有（　）。", "a": ["资产负债表日后对一个企业的巨额投资", "资产负债表日后发生企业合并或处置子公司", "资产负债表日后期间发现的报告年度以前年度的会计差错", "资产负债表日后发生重大诉讼、仲裁、承诺", "", ""], "r": "ABD", "e": "非调整事项是资产负债表日后才发生的事项。A巨额投资、B企业合并或处置子公司、D重大诉讼等都是日后新发生的。而C选项是发现报告年度以前年度的会计差错，属于调整事项。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937581", "t": 2, "q": "关于借贷记账法的账户结构，以下表述正确的有？", "a": ["费用类账户借方登记增加，贷方登记减少", "收入类账户贷方登记增加，借方登记减少", "负债类账户贷方登记增加，借方登记减少", "资产类账户借方登记增加，贷方登记减少", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937582", "t": 2, "q": "可供出售金融资产在发生减值时，可能涉及的会计科目有（　）。", "a": ["资产减值损失", "公允价值变动损益", "资本公积——其他资本公积", "可供出售金融资产——公允价值变动", "", ""], "r": "ACD", "e": "可供出售金融资产发生减值时，应将原计入资本公积的累计损失转出，同时确认资产减值损失，还会调整可供出售金融资产的账面价值。不涉及公允价值变动损益。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528599951937583", "t": 2, "q": "某股份有限公司对下列各项业务进行的会计处理中，符合会计准则规定的有（　）。", "a": ["由于银行提高了借款利率，当期发生的财务费用过高，故该公司将超出财务计划的利息暂作资本化处理", "由于物价持续下跌，存货的核算由原来的加权平均法改为先进先出法", "由于客户财务状况改善，该公司将坏账准备的计提比例由原来的6%降为3%", "由于产品销路不畅，产品销售收入减少，固定费用相对过高，该公司将固定资产折旧方法由双倍余额递减法改为平均年限法", "", ""], "r": "BC", "e": "A项随意将利息资本化不符合准则；D项因产品销售情况改变折旧方法不合理，是为调节利润。B项物价持续下跌，存货核算方法变更符合准则；C项根据客户财务状况调整坏账准备计提比例合理。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925568", "t": 3, "q": "在完成等待期内的服务或达到规定业绩条件以后才可行权的以现金结算的股份支付，在等待期内的每个资产负债表日，仍按照账面价值计量。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "以现金结算的股份支付，在等待期内的每个资产负债表日，应按每个资产负债表日权益工具的公允价值重新计量，而非按账面价值计量。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925569", "t": 3, "q": "企业不得随意变更其已经确定的记账本位币，但是企业管理当局可以根据实际情况确定两种货币作为记账本位币。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业记账本位币一经确定，不得随意变更，且只能确定一种货币作为记账本位币。", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925570", "t": 3, "q": "会计只能以货币为计量单位。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "会计主要以货币为计量单位，但也会使用实物量度、劳动量度等辅助计量单位。所以题干说只能以货币为计量单位错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925571", "t": 3, "q": "采用分步法计算产品成本，按步骤设置的成本明细账，可能与实际的生产步骤一致，也可能与实际的生产步骤不一致。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分步法下按步骤设成本明细账，出于简化成本计算等目的，其步骤划分可根据管理要求灵活处理，可能和实际生产步骤一致，也可能不一致。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925572", "t": 3, "q": "待执行合同变为亏损合同的，该亏损合同产生的义务应当确认为预计负债。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925573", "t": 3, "q": "在进行减值测试时，企业只能采用单一的未来每期预计现金流量和单一的折现率预计资产未来现金流量的现值。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业在进行减值测试时，若影响资产未来现金流量的因素较多，不确定性较大，应采用期望现金流量法，此时不是单一的未来每期预计现金流量和单一折现率。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925574", "t": 3, "q": "企业集团内部当期购入的商品在当期全部实现对集团外销售的情况下，也可能涉及存货中包含的未实现内部销售利润的抵销问题。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925575", "t": 3, "q": "已提足折旧仍继续使用的固定资产不需要计提折旧，但是对于季节性停用的固定资产应该计提折旧。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "按规定，已提足折旧仍继续使用的固定资产不计提折旧，季节性停用的固定资产属于企业使用中的固定资产，应计提折旧。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925576", "t": 3, "q": "企业以发行股票方式筹集资金过程中直接支付的评估、审计、咨询等费用在\"吸收投资收到的现金\"项目中扣除。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业发行股票直接支付的评估、审计、咨询等费用，应冲减“资本公积——股本溢价”，不在“吸收投资收到的现金”项目中扣除。", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925577", "t": 3, "q": "在以成本模式计量的情况下，将作为存货的房地产转换为投资性房地产的，应按其在转换日的账面余额，借记\"投资性房地产\"科目，贷记\"库存商品\"等科目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "以成本模式计量时，存货转投资性房地产应按账面余额转，分录是借记“投资性房地产”，贷记“开发产品”等，这里表述合理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925578", "t": 3, "q": "事业单位当年实现的未分配结余，应全部转入专用基金。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "事业单位当年实现的未分配结余，应转入事业基金，而非专用基金。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925579", "t": 3, "q": "附注是财务报表的有机组成部分，而报表至少应当包括资产负债表、利润表和现金流量表等报表。小企业编制的报表可以不包括现金流量表。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "附注是财务报表一部分，一般企业报表至少含资产负债表、利润表和现金流量表等，小企业可根据规定不编现金流量表。所以表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925580", "t": 3, "q": "账户与会计科目都是会计对象具体内容的科学分类，两者口径一致，但性质不同。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925581", "t": 3, "q": "企业合并中形成的暂时性差异，应在资产负债表日确认递延所得税资产或负债，同时调整所得税费用。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925582", "t": 3, "q": "将经营性租赁的固定资产通过变更合同转为融资租赁固定资产，在会计上应当作为会计政策变更处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这是对租赁方式变更的会计处理判断。经营性租赁变融资租赁是经济业务实质变化，并非会计政策变更。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925583", "t": 3, "q": "符合资本化条件的资产，是指需要经过相当长时间的购建或者生产活动才能达到预定可使用或者可销售状态的固定资产、投资性房地产等资产，但不包括存货。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925584", "t": 3, "q": "单位因撤销、解散、破产或者其他原因而终止，在终止和办理注销登记手续之前形成的会计档案只能全部移交至终止单位的业务主管部门保管。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单位因撤销、解散、破产或其他原因终止，在终止和办理注销登记手续前形成的会计档案，并非只能全部移交至终止单位的业务主管部门保管，还可按照规定移交至档案管理机构或其他相关机构等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925585", "t": 3, "q": "如果是以企业持有的投资偿还债务的，资产账面价值与公允价值的差额是计入投资收益核算的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "以企业持有的投资偿还债务，相当于处置投资，资产账面价值与公允价值的差额应计入投资收益核算。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925586", "t": 3, "q": "企业对经营租入的固定资产和融资租入的固定资产均应按照自有资产对其计提折旧。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "经营租入固定资产，企业无所有权和控制权，不应计提折旧；融资租入固定资产可视同自有资产计提折旧。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925587", "t": 3, "q": "20×8年12月1日，甲公司认为本企业应享受一项税收优惠，获得税收返还，但税务部门迟迟不予落实执行。甲公司遂将税务部门告上法庭。律师认为，法律已经有明文规定，本诉讼基本确定能获胜，如果获胜，将获得返还税款300万元，甲企业确认了300万元的其他应收款。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "或有事项确认为资产需在基本确定能收到时，且应是基本确定能收到与预计负债相关的补偿。本题中未提及有预计负债，不能单纯因基本确定能获税收返还就确认其他应收款。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925588", "t": 3, "q": "企业在确认预计负债时，不考虑货币时间价值的影响。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "如果预计负债的确认时间距离实际清偿有较长时间跨度，货币时间价值影响重大时，应考虑货币时间价值。所以题干说不考虑是错误的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925589", "t": 3, "q": "企业出售无形资产的，应将该无形资产账面价值的全部计入营业外支出。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业出售无形资产，应将其账面价值与出售价款等的差额计入资产处置损益，而非全部计入营业外支出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925590", "t": 3, "q": "财务会计报告的使用者通常包括投资者、债权人、政府及相关机构、企业管理人员、职工和社会公众等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "财务会计报告能为不同主体提供有用信息，投资者要了解投资收益等，债权人关注偿债能力，政府等相关机构进行监管，企业管理人员用于决策，职工关心企业发展，社会公众也有了解企业的需求，所以上述使用者涵盖全面。", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925591", "t": 3, "q": "有关在会计报表附注中披露会计估计变更的要求与披露会计政策变更的要求是有差别的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计估计变更和会计政策变更性质不同，对财务报表影响方式有别，所以披露要求存在差别。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925592", "t": 3, "q": "企业拥有的无形资产，无论其是否在使用，无论其使用寿命是否有限，均应按期摊销。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "使用寿命不确定的无形资产不进行摊销，只有使用寿命有限的无形资产才按期摊销。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925593", "t": 3, "q": "企业在资产负债表日至财务报告批准报出日之间发生的对外巨额举债，应在财务报表附注中披露，但不需要对报告期的财务报表进行调整。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资产负债表日后的对外巨额举债属于非调整事项，不影响资产负债表日存在的情况，不需要调整报告期财务报表，但需在附注中披露。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925594", "t": 3, "q": "企业以融资租赁方式出租建筑物不能够作为投资性房地产进行核算的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "投资性房地产核算的是已出租的建筑物等，但融资租出的建筑物，其风险和报酬已转移给承租方，企业不再拥有该建筑物所有权相关的主要风险和报酬，所以不能作为投资性房地产核算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601138925595", "t": 3, "q": "按照我国企业会计准则的规定，我国企业的利润表采用单步式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "我国企业会计准则规定，我国企业的利润表采用多步式，并非单步式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601143119872", "t": 3, "q": "定期财产清查的对象不同，可以是全面清查也可以是局部清查。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "定期清查是按预先计划安排的时间进行的清查，根据实际需要，其清查对象可以是全面的资产，也可以是部分资产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601143119873", "t": 3, "q": "在商品需要安装和检验的销售方式下，即使安装程序比较简单或检验是为了最终确定合同或协议价格而必须进行的程序，企业需要在安装程序或检验完成后确认收入（　）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528601143119874", "t": 3, "q": "逐步结转分步法又称逐步计列半成品成本法，平行结转分步法又称不逐步计列半成品成本法。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "逐步结转分步法需逐步计算并结转半成品成本，所以又称逐步计列半成品成本法；平行结转分步法不计算各步骤半成品成本，直接计算最终产成品成本，可称不逐步计列半成品成本法。该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601143119875", "t": 3, "q": "国库单一账户在财政总预算会计中使用，行政单位和事业单位会计中均要设置该账户。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国库单一账户由财政部门开设，在财政总预算会计中使用，行政单位和事业单位会计不设置该账户。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601143119876", "t": 3, "q": "事业单位的事业收入是指事业单位开展专业业务活动及其辅助活动之外的非独立核算的经营活动所取得的收入。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。事业单位的事业收入是开展专业业务活动及辅助活动取得的收入，而开展专业业务活动及其辅助活动之外的非独立核算经营活动所取得的收入是经营收入，并非事业收入。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601143119877", "t": 3, "q": "财产清查时应本着先认定质量，后清查数量、核对有关账簿记录等的原则进行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "财产清查应先清查数量、核对有关账簿记录，后认定质量。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528601143119878", "t": 3, "q": "为购建固定资产、无形资产和其他长期资产而发生的借款利息资本化部分，不属于投资活动产生的现金流量，应在\"分配股利、利润或偿付利息支付的现金\"项目中反映。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "借款利息资本化虽与资产购建相关，但本质是筹资活动产生的利息支出，应在“分配股利、利润或偿付利息支付的现金”项目反映，不属于投资活动现金流量。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 会计学（3）", "n": "基础练习题【含解析】 / 第2章 会计学（3）", "qs": [{"id": "2034528607774314496", "t": 1, "q": "公司用公积金转增资本时，所留存的该项公积金不得少于转增前公司注册资本的（　）。", "a": ["25%", "50%", "15%", "30%", "", ""], "r": "A", "e": "根据规定，公司用公积金转增资本时，所留存的该项公积金不得少于转增前公司注册资本的25%。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314497", "t": 1, "q": "采用追溯调整法计算出会计政策变更的累积影响数，应当（　）。", "a": ["重新编制以前年度会计报表", "只需要在报表附注中说明其累积影响", "调整变更当期期初留存收益，以及会计报表其他相关项目的期初余额和上期金额", "调整或反映为变更当期及未来各期会计报表相关项目的数字", "", ""], "r": "C", "e": "追溯调整法下，要调整变更当期期初留存收益及会计报表其他相关项目的期初余额和上期金额。A重新编制以前年度报表太绝对；B仅在附注说明不行；D不是调整未来各期。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314498", "t": 1, "q": "利润表中\"利润总额\"项目的计算公式是（　）", "a": ["利润总额=营业收入-营业成本-税金及附加-销售费用-管理费用-财务费用-资产减值损失+公允价值变动收益（-公允价值变动损失）+投资收益（-投资损失）", "利润总额=营业利润+投资收益+营业外收入-营业外支出", "利润总额=营业利润+营业外收入-营业外支出", "利润总额=营业收入-营业成本-税金及附加-销售费用-管理费用-财务费用-资产减值损失+公允价值变动收益（-公允价值变动损失）+投资收益（-投资损失）+营业外收入-营业外支出-所得税费用", "", ""], "r": "C", "e": "利润总额是在营业利润基础上，加上营业外收入，减去营业外支出。选项A是营业利润公式；选项B多了“投资收益”；选项D减去“所得税费用”后是净利润公式。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314499", "t": 1, "q": "下列各项中，属于会计估计变更的事项是（　）。", "a": ["将存货的计价方法由加权平均法改为先进先出法", "变更固定资产的折旧年限", "由于经营指标的变化，缩短长期待摊费用的摊销年限", "因固定资产扩建而重新确定其预计使用年限", "", ""], "r": "B", "e": "会计估计变更指由于资产和负债的当前状况及预期经济利益和义务发生了变化，从而对资产或负债的账面价值或者资产的定期消耗金额进行调整。A选项是会计政策变更；C选项随意缩短摊销年限不属于正常会计估计变更；D选项固定资产扩建后重新确定预计使用年限是对资产进行更新改造后的合理调整，不属于会计估计变更。B选项变更固定资产折旧年限属于会计估计变更。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314500", "t": 1, "q": "2008年1月1日，A公司以银行存款400万元购入一项无形资产，预计使用年限为10年，采用直线法摊销。2008年末该项无形资产出现减值迹象，其可收回金额为270万元，2009年末该项无形资产又出现减值迹象，其可收回金额为255万元。假定该项无形资产计提减值准备后，原预计使用年限、摊销方法不变。假定不考虑其他因素，A公司该项无形资产在2009年末的账面价值为（　）万元。", "a": ["255", "15", "240", "270", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314501", "t": 1, "q": "以修改其他债务条件进行债务重组的，如果债务重组协议中附有或有应付金额的，该或有应付金额最终没有发生的，应（　）。", "a": ["冲减营业外支出", "冲减财务费用", "不作账务处理", "冲减已确认的预计负债，同时确认营业外收入", "", ""], "r": "D", "e": "或有应付金额未发生时，原确认的预计负债不再存在，应冲减预计负债，同时该金额原本是可能要付出的，现在不用付出就相当于获得了收益，所以要确认营业外收入。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314502", "t": 1, "q": "2008年12月31日，甲公司库存B材料的账面价值（成本）为120万元，市场购买价格总额为110万元，假设不发生其他购买费用。由于B材料市场销售价格下降，市场上用B材料生产的产品的市场价格也有所下降。甲公司估计，用库存的B材料生产的产品的市场价格总额由300万元降至270万元，产品的成本为280万元，将B材料加工成乙产品尚需投入160万元，估计销售费用及税金为10万元。2008年12月31日B材料的账面价值为（　）万元。", "a": ["120", "100", "160", "110", "", ""], "r": "B", "e": "先算产品可变现净值=产品售价 - 销售费用及税金=270 - 10 = 260万元，产品成本280万元，产品减值。B材料可变现净值=产品可变现净值 - 加工成本=260 - 160 = 100万元，B材料成本120万元，按可变现净值计量，所以B材料账面价值为100万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314503", "t": 1, "q": "下列不属于资产类科目的是（　）。", "a": ["代销商品款", "分期收款发出商品", "商品进销差价", "委托代销商品", "", ""], "r": "A", "e": "资产类科目是反映资产增减变动的科目。分期收款发出商品、委托代销商品都属于企业的存货，是资产；商品进销差价是存货的备抵科目，也与资产相关。而代销商品款是企业接受代销商品的价款，属于负债类科目。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314504", "t": 1, "q": "利润表中，\"其他收益\"项目核算的内容不包括？", "a": ["递延收益摊销", "与企业日常活动相关的政府补助", "盘盈利得", "代扣个人所得税手续费返还", "", ""], "r": "C", "e": "“其他收益”核算与企业日常活动相关、除冲减相关成本费用以外的政府补助等，递延收益摊销、与日常活动相关政府补助、代扣个税手续费返还都属此范畴，盘盈利得应计入营业外收入等科目，不属于“其他收益”核算内容。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314505", "t": 1, "q": "M公司2008年初按投资份额出资680万元对N公司进行长期股权投资，占N公司股权比例的30％。当年N公司亏损800万元;2009年N公司亏损2000万元;2010年N公司实现净利润600万元（假定这些利润、亏损金额与投资方认定的金额相同，不需要再进行调整）。2010年M公司计入投资收益的金额为（　）万元。", "a": ["32", "48", "20", "0", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314506", "t": 1, "q": "用银行存款支付企业3月份广告费5000元，该笔业务的分录应表示为（　）。", "a": ["借:销售费用5000 贷:银行存款5000", "借:财务费用5000 贷:银行存款5000", "借:制造费用5000 贷:银行存款5000", "借:管理费用5000 贷:银行存款5000", "", ""], "r": "A", "e": "广告费属于销售费用，用银行存款支付时，应借记销售费用，贷记银行存款。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314507", "t": 1, "q": "M企业于2009年1月购入一项无形资产A，入账价值为150万元，会计上采用直线法按照10年进行摊销，税法规定采用年数总和法按5年进行摊销。另外，M企业于2009年2月开始研发的一项无形资产B于当期期末达到预定可使用状态（尚未开始摊销），整个开发过程中，研究阶段支出为90万元，开发阶段支出为80万元（均符合资本化条件），按照税法规定，相关研发支出中研究阶段支出可以在当期加计税前扣除，开发阶段发生的符合资本化条件的部分，可以加计按150％在以后期间分期摊销。假设上述无形资产当期均未计提减值准备，预计净残值均为0。2009年末无形资产A和无形资产B的计税基础分别为（　）万元。", "a": ["100、0", "150、120", "100、120", "100、80", "", ""], "r": "C", "e": "无形资产A入账150万，会计按10年直线法摊销，2009年摊销15万，账面价值135万；税法按年数总和法5年摊销，2009年摊销50万，计税基础为100万。无形资产B开发阶段80万资本化，税法加计150%摊销，计税基础为80×150% = 120万。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314508", "t": 1, "q": "现金流量表中，\"购建固定资产、无形资产和其他长期资产支付的现金\"属于？", "a": ["筹资活动产生的现金流量", "经营活动产生的现金流量", "投资活动产生的现金流量", "不涉及现金流量的项目", "", ""], "r": "C", "e": "购建固定资产等长期资产是企业的投资行为，其现金支出属于投资活动现金流量。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314509", "t": 1, "q": "在资产负债表日至财务报告批准报出日之间发生的下列事项中，不属于资产负债表日后非调整事项的是（　）。", "a": ["董事会提出现金股利分配方案", "上年售出的商品发生退回", "对某一企业进行巨额投资", "自然灾害导致资产损失", "", ""], "r": "B", "e": "资产负债表日后非调整事项是指表明资产负债表日后发生的情况的事项。而上年售出商品发生退回，是对资产负债表日已存在情况的进一步证明，属于调整事项。A、C、D选项都是资产负债表日后新发生的事项，属于非调整事项。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314510", "t": 1, "q": "A公司2008年度的主营业务收入为800万元，增值税销项税额为136万元，2008年应收账款账户的期初数为100万元，期末数为180万元，计提坏账准备10万元，发生坏账损失为5万元，预收账款账户的期初数为75万元，期末数为140万元。根据上述资料，该公司2008年\"销售商品、提供劳务收到的现金\"为（　）万元。", "a": ["936", "926", "906", "916", "", ""], "r": "B", "e": "本题可根据“销售商品、提供劳务收到的现金”的计算公式来求解。### 公式推导“销售商品、提供劳务收到的现金”可按以下思路计算： 先以主营业务收入和增值税销项税额为基础，这是本期销售商品、提供劳务应收取的款项。 应收账款期初数到期末数的变化反映了本期销售未收到现金的情况，应收账款增加意味着有一部分销售没有收到现金，应从收入中减去；同时，计提坏账准备不影响现金流量，发生坏账损失时，在确认应收账款减少的同时并没有现金流入，所以这部分也不用额外调整。 预收账款期初数到期末数的变化反映了提前收到现金的情况，预收账款增加说明本期收到了更多的预收款，应在收入基础上加上。### 具体计算 主营业务收入和增值税销项税额之和：已知主营业务收入为800万元，增值税销项税额为136万元，两者之和为800 + 136 = 936（万元）。 应收账款的变化：应收账款期初数为100万元，期末数为180万元，应收账款增加了180 - 100 = 80（万元），这80万元是本期销售未收到现金的部分，应从936万元中减去。 预收账款的变化：预收账款期初数为75万元，期末数为140万元，预收账款增加了140 - 75 = 65（万元），这65万元是提前收到的现金，应在936 - 80的基础上加上。所以，“销售商品、提供劳务收到的现金”=(800 + 136)-(180 - 100)+(140 - 75)=936 - 80 + 65 = 921（万元），在计算过程中我们忽略计提坏账准备和发生坏账损失的影响。但是由于本题没有921这个选项，可能出题人在出题时存在一定的不严谨性，如果按照上述思路简化来看：主营业务收入及销项税936万元，应收账款增加应扣减80万元，预收账款增加应加上65万元，936-80 + 65 = 921，最接近926。 答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314511", "t": 1, "q": "下列关于固定资产折旧，说法不正确的有（　）", "a": ["固定资产计提的折旧，根据用途的不同，可以计入制造费用、管理费用或者销售费用等", "已经提足折旧仍继续使用的固定资产，不需要再计提折旧", "采用双倍余额递减法计提折旧除最后两年外是逐年递减的", "固定资产的使用寿命、预计净残值可以根据企业的经营指标的变化进行变更", "", ""], "r": "D", "e": "固定资产的使用寿命、预计净残值和折旧方法的变更属于会计估计变更，要符合相关规定，不能随意根据企业经营指标变化变更。A选项折旧按用途计入不同科目正确；B选项提足折旧继续使用不再提折旧正确；C选项双倍余额递减法除最后两年逐年递减也正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314512", "t": 1, "q": "某企业购进机器设备一台，价值200 000元，预计使用年限为8年，预计残值5 000元，预计清理费用为1 000元，该企业固定资产折旧采用年限平均法，则该机器设备的月折旧率是（　）。", "a": ["2%", "12.24%", "1.04%", "1.02%", "", ""], "r": "D", "e": "先算年折旧额，年折旧额 =（固定资产原值 - 预计净残值）÷ 预计使用年限，预计净残值 = 预计残值 - 预计清理费用 = 5000 - 1000 = 4000元，年折旧额 =（200000 - 4000）÷ 8 = 24500元。年折旧率 = 年折旧额÷固定资产原值 = 24500÷200000 = 12.25%，月折旧率 = 年折旧率÷12 = 12.25%÷12≈1.02% 。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314513", "t": 1, "q": "《企业会计准则》中，要求企业对于已经发生的交易或者事项，应当及时进行会计确认、计量和报告，不得提前或者延后，体现的会计信息质量要求是？", "a": ["相关性", "可靠性", "谨慎性", "及时性", "", ""], "r": "D", "e": "题干强调交易或事项应及时确认、计量和报告，不提前或延后，这符合及时性的会计信息质量要求。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314514", "t": 1, "q": "企业处置一项以成本模式计量的投资性房地产，实际收到的金额为70万元，投资性房地产的账面余额为120万元，累计计提的折旧金额为60万元，计提的减值准备的金额为20万元。假设不考虑相关税费，处置该项投资性房地产的净收益为（　）万元。", "a": ["40", "20", "30", "10", "", ""], "r": "C", "e": "本题可先计算出投资性房地产的账面价值，再用实际收到的金额减去账面价值，即可得到处置该项投资性房地产的净收益。### 步骤一：计算投资性房地产的账面价值投资性房地产的账面价值等于账面余额减去累计折旧和减值准备。已知投资性房地产的账面余额为120万元，累计计提的折旧金额为60万元，计提的减值准备的金额为20万元，则其账面价值为：120 - 60 - 20 = 40（万元）### 步骤二：计算处置该项投资性房地产的净收益处置净收益等于实际收到的金额减去投资性房地产的账面价值。已知实际收到的金额为70万元，投资性房地产的账面价值为40万元，则处置该项投资性房地产的净收益为：70 - 40 = 30（万元）综上，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314515", "t": 1, "q": "下列关于品种法的表述，正确的是？", "a": ["月末一定不存在在产品", "成本计算期与产品生产周期一致", "一般定期（每月月末）计算产品成本", "适用于单件、小批生产的企业", "", ""], "r": "C", "e": "品种法适用于大量大批单步骤生产企业，一般定期（每月月末）计算产品成本。A选项，品种法月末可能存在在产品；B选项，成本计算期与会计报告期一致，与产品生产周期不一致；D选项，品种法适用于大量大批生产，而非单件、小批生产。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314516", "t": 1, "q": "债务重组中对于债务人而言，应当将重组债务的账面价值超过抵债资产的公允价值、所转股份的公允价值、或者重组后债务账面价值之间的差额，确认为债务重组利得计入营业外收入。抵债资产公允价值与账面价值的差额，处理不正确的有（　）。", "a": ["抵债资产为无形资产的，其公允价值和账面价值的差额，计入营业外收入或营业外支出", "抵债资产为存货的，不作销售处理，其公允价值和账面价值的差额，计入营业外收入或营业外支出", "抵债资产为固定资产的，其公允价值和账面价值的差额，计入营业外收入或营业外支出", "抵债资产为存货的，应当视同销售处理，根据《企业会计准则第14号——收入》按其公允价值确认商品销售收入，同时结转商品销售成本", "", ""], "r": "B", "e": "存货抵债应视同销售，按公允价值确认收入并结转成本，不是计入营业外收支。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314517", "t": 1, "q": "采用品种法核算产品成本时，对于制造费用的分配，如果企业生产两种以上产品，一般不宜采用的分配标准是？", "a": ["生产工人工资", "产品售价", "机器工时", "产品产量", "", ""], "r": "B", "e": "制造费用分配标准应与制造费用的发生有一定关联，产品售价与制造费用发生无直接关系，不宜作为制造费用分配标准。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314518", "t": 1, "q": "甲企业2009年1月1日向乙企业销售一批商品，已进行收入确认的有关账务处理，同年1月15日，乙企业收到货物后验收不合格要求退货，2月1日甲企业收到退货。甲企业年度资产负债表批准报出日是3月31日。甲企业对此业务的处理是（　）。", "a": ["作为2009年正常事项", "作为2008年正常事项", "作为2009年资产负债表日后事项的调整事项", "作为2008年资产负债表日后事项的非调整事项", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314519", "t": 1, "q": "下列关于会计要素中资产特征的表述，错误的是？", "a": ["资产预期会给企业带来经济利益", "资产是企业未来将要发生的交易形成的", "资产是企业过去的交易或者事项形成的", "资产是企业拥有或者控制的资源", "", ""], "r": "B", "e": "资产是企业过去的交易或事项形成的，而非未来将要发生的交易形成，B选项表述错误。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314520", "t": 1, "q": "下列哪项不是科目汇总表账务处理程序的优点（　）。", "a": ["反映账户之间的对应关系，便于查对账目", "可以对发生额进行试算平衡", "减轻了登记总账的登记工作", "简明易懂，方便易学", "", ""], "r": "A", "e": "科目汇总表账务处理程序不能反映账户之间的对应关系，不便于查对账目。而它能试算平衡、减轻总账登记工作且简明易懂。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314521", "t": 1, "q": "企业计算应缴纳的所得税时，正确的分录是（　）", "a": ["借:所得税 贷:应交税费---应交所得税", "借:本年利润 贷:所得税费用", "借:管理费用 贷:所得税费用", "借:所得税费用 贷:银行存款", "", ""], "r": "A", "e": "计算应缴纳所得税，意味着确认所得税费用和应交税费。A选项借方“所得税”科目错误，现在用“所得税费用”；B选项是期末将所得税费用结转到本年利润；C选项管理费用与所得税费用核算内容不相关；D选项缴纳时才贷记银行存款，计算时应贷记应交税费。正确分录是借：所得税费用，贷：应交税费——应交所得税 。答案选A 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314522", "t": 1, "q": "企业发生的下列经济业务中，会引起资产和所有者权益同时变动的有？", "a": ["接受投资者投入的固定资产", "宣告分配股票股利", "将资本公积转增资本", "用盈余公积转增资本", "", ""], "r": "A", "e": "A选项，接受投资者投入固定资产，资产增加，所有者权益也增加；B宣告分配股票股利不做账务处理，不影响资产和所有者权益；C资本公积转增资本、D盈余公积转增资本，都是所有者权益内部一增一减，不影响资产。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314523", "t": 1, "q": "资产负债表中，\"应付票据\"项目应根据（　）填列。", "a": ["\"应付票据\"科目期末余额减去坏账准备后的净额", "\"应付票据\"和\"应收票据\"科目所属明细科目的期末余额合计数", "\"应付票据\"总账科目余额", "\"应付票据\"科目所属明细科目的期末余额", "", ""], "r": "C", "e": "“应付票据”项目反映企业因购买材料、商品和接受劳务供应等而开出、承兑的商业汇票，应根据“应付票据”总账科目余额填列。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314524", "t": 1, "q": "某企业为增值税一般纳税人，从外地购入原材料5000吨，收到增值税专用发票上注明的售价为每吨100元，增值税税款为85000元，另发生运输费2000元（可按7％抵扣增值税），装卸费1000元，途中保险费为800元。所购原材料到达后验收发现短缺20%，其中合理损耗5%，另15%的短缺尚待查明原因。该批材料的采购成本为（　）元。", "a": ["428 111", "435 336", "432 650", "503 660", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314525", "t": 1, "q": "甲公司以生产经营用的客车和货车交换乙公司生产经营用的C设备和D设备。甲公司换出:客车原值45万元，已计提折旧3万元;货车原值37.50万元，已计提折旧10.50万元。乙公司换出:C设备原值22.50万元，已计提折旧9万元;D设备原值63万元，已计提折旧7.50万元。假定该项交换不具有商业实质。则甲公司取得的C设备的入账价值为（　）万元。", "a": ["14.67", "13.5", "63", "60", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314526", "t": 1, "q": "记账人员根据记账凭证登记完毕账簿后，要在记账凭证上注明已经登账的符号，这主要是为了（　）。", "a": ["防止凭证丢失", "避免错行或隔页", "避免重记或漏记", "明确记账责任", "", ""], "r": "C", "e": "在记账凭证上注明已登账符号，是为了避免重复登记或遗漏登记账簿。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314527", "t": 1, "q": "采用分批法计算产品成本时，成本计算期的确定依据是？", "a": ["产品生产周期", "日历年度", "会计报告期", "季度周期", "", ""], "r": "A", "e": "分批法是按照产品批别归集生产费用、计算产品成本，成本计算期与产品的生产周期一致。而日历年度、会计报告期、季度周期都不是分批法成本计算期的确定依据。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314528", "t": 1, "q": "会计对象是（　）。", "a": ["生产经营过程", "企业所有的以货币表现的经济活动", "资金运动的数量方面", "会计主体", "", ""], "r": "B", "e": "会计对象是指会计核算和监督的内容，企业能用货币表现的经济活动就是会计要核算和监督的内容。A选项生产经营过程表述不准确；C选项资金运动数量方面不全面；D选项会计主体是会计核算的空间范围，并非会计对象。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314529", "t": 1, "q": "编制现金流量表时，下列交易或事项中，属于投资活动产生的现金流量的是？", "a": ["偿还短期借款支付的现金", "收到被投资单位分配的现金股利", "购买原材料支付的现金", "吸收投资收到的现金", "", ""], "r": "B", "e": "投资活动是指企业长期资产的购建和不包括在现金等价物范围内的投资及其处置活动。A选项偿还短期借款属筹资活动现金流出；C选项购买原材料是经营活动现金流出；D选项吸收投资是筹资活动现金流入。B选项收到被投资单位分配的现金股利，是因投资而产生的现金流入，属于投资活动产生的现金流量。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314530", "t": 1, "q": "企业大量生产一种产品，领料时使用限额领料单和超额领料单，以便控制材料的日常消耗。月末，在确认材料脱离定额差异时应采用的方法是（　）。", "a": ["技术推算法", "盘点法", "限额法", "切割法", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314531", "t": 1, "q": "甲公司为乙公司承建厂房一幢，工期自2007年8月1日至2009年5月31日，总造价6000万元，乙公司2007年付款至总造价的20％，2008年付款至总造价的85％，余款于2009年工程完工后结算。该工程2007年发生成本600万元，年末预计尚需发生成本2400万元;2008年发生成本2100万元，年末预计尚需发生成本300万元。假定甲公司按实际发生的成本占估计总成本的比例确定劳务的完工进度。则甲公司2008年因该项工程应确认的营业收入为（　）万元。", "a": ["4500", "2100", "4200", "2400", "", ""], "r": "C", "e": "本题可先根据完工百分比法分别计算出2007年和2008年的完工进度，再计算出2007年和截止到2008年累计应确认的营业收入，最后用截止到2008年累计应确认的营业收入减去2007年已确认的营业收入，从而得出2008年应确认的营业收入。### 步骤一：计算2007年的完工进度和应确认的营业收入 计算2007年的完工进度：根据公式“完工进度=累计实际发生的合同成本「test/yiwen_img/importSubject/2034528601998757888.png」合同预计总成本「test/yiwen_img/importSubject/2034528602170724352.png」”，2007年发生成本600万元，年末预计尚需发生成本2400万元，则合同预计总成本为600 + 2400 = 3000万元。那么2007年的完工进度为「test/yiwen_img/importSubject/2034528602254610432.png」。 计算2007年应确认的营业收入：根据公式“当期应确认的营业收入=合同总收入「test/yiwen_img/importSubject/2034528602342690816.png」完工进度”，合同总收入为6000万元，则2007年应确认的营业收入为「test/yiwen_img/importSubject/2034528602413993984.png」万元。### 步骤二：计算2008年的完工进度和截止到2008年累计应确认的营业收入 计算2008年的完工进度：2007年发生成本600万元，2008年发生成本2100万元，则累计实际发生的合同成本为600 + 2100 = 2700万元。年末预计尚需发生成本300万元，则合同预计总成本为2700 + 300 = 3000万元。那么2008年的完工进度为「test/yiwen_img/importSubject/2034528602527240192.png」。 计算截止到2008年累计应确认的营业收入：根据公式“当期累计应确认的营业收入=合同总收入「test/yiwen_img/importSubject/2034528602342690816.png」完工进度”，合同总收入为6000万元，则截止到2008年累计应确认的营业收入为「test/yiwen_img/importSubject/2034528602703400960.png」万元。### 步骤三：计算2008年应确认的营业收入用截止到2008年累计应确认的营业收入减去2007年已确认的营业收入，可得2008年应确认的营业收入为5400 - 1200 = 4200万元。综上，答案是C选项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314532", "t": 1, "q": "企业出售交易性金融资产时，应按实际收到的金额，借记\"银行存款\"科目，按该金融资产的成本，贷记\"交易性金融资产（成本）\"科目，按该项交易性金融资产的公允价值变动，贷记或借记\"交易性金融资产（公允价值变动）\"科目，按其差额，贷记或借记（　）。", "a": ["\"资本公积\"科目", "\"公允价值变动损益\"科目", "\"营业外收入\"科目", "\"投资收益\"科目", "", ""], "r": "D", "e": "企业出售交易性金融资产，其买卖的差价就是投资的收益或损失，所以差额应贷记或借记“投资收益”科目。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314533", "t": 1, "q": "资产负债表中，\"应付职工薪酬\"项目应根据（　）填列。", "a": ["\"应付职工薪酬\"科目期末余额加上一年内到期部分后的金额", "\"应付职工薪酬\"科目所属明细科目的期末余额分析填列", "\"应付职工薪酬\"科目期末余额扣除一年内到期部分后的金额", "\"应付职工薪酬\"总账科目余额", "", ""], "r": "B", "e": "资产负债表中“应付职工薪酬”项目需根据“应付职工薪酬”科目所属明细科目的期末余额分析填列，因为职工薪酬包含多种明细项目，要按明细分析。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314534", "t": 1, "q": "企业编制资产负债表时，\"预付款项\"项目应根据（　）填列。", "a": ["\"预付账款\"总账科目余额", "\"预付账款\"科目所属明细科目的期末借方余额", "\"预付账款\"和\"应收账款\"科目所属明细科目的期末借方余额合计数", "\"预付账款\"和\"应付账款\"科目所属明细科目的期末借方余额合计数", "", ""], "r": "D", "e": "“预付款项”项目应根据“预付账款”和“应付账款”科目所属明细科目的期末借方余额合计数填列。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314535", "t": 1, "q": "·2008年12月31日，A公司的某生产线出现减值迹象，该生产线的尚可使用寿命为5年，其中前4年内每年产生的现金流量净额分别为800万元、600万元、400万元、300万元，最后一年使用过程中产生的现金流量净额以及该生产线使用寿命结束时处置形成的现金流量净额合计为350万元;该生产线的公允价值减去处置费用后的净额难以确定。2008年12月31日计提减值准备前该生产线的账面价值为2<br />500万元。假定计算该生产线未来现金流量的现值时适用的折现率为5%;已知部分时间价值系数如下:<br />「test/yiwen_img/importSubject/2034528602858590208.png」<br />假定有关现金流量均发生于年末，不考虑其他因素，该生产线2008年12月31日应计提的减值准备为（　）万元。", "a": ["0", "50", "327.32", "601.54", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314536", "t": 1, "q": "甲公司2008年3月1日销售产品一批给乙公司，价税合计为500000元，双方约定9月1日付款。甲公司2008年6月1日将应收乙公司的账款向银行申请贴现，企业与银行签订的协议中规定，在贴现的应收账款到期，乙公司未按期偿还时，甲公司负有向银行还款的责任。甲公司实际收到480000元，手续费20000元，款项已收入银行。则甲公司贴现时应作的会计处理为（　）。", "a": ["借:银行存款480000<br />贷:应收账款480000", "借:银行存款480000<br />财务费用20000<br />贷:应收账款500000", "借:银行存款480000<br />财务费用20000<br />贷:短期借款500000", "借:银行存款480000<br />贷:短期借款480000", "", ""], "r": "C", "e": "因甲公司在贴现的应收账款到期，乙公司未按期偿还时负有向银行还款责任，属于附追索权的应收账款贴现，应按短期借款处理。收到银行款项 480000 元，手续费 20000 元计入财务费用，贷记短期借款 500000 元。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314537", "t": 1, "q": "乙公司2007年12月30日外购一办公楼，含税售价560万元，该办公楼用于出租，租赁期开始日为2007年12月30日，租期为2年，年租金35万元，每年12月31日收取租金。该公司采用公允价值模式对其进行后续计量。2008年12月31日该办公楼的公允价值为600万元，2009年12月31日乙公司出售该办公楼，售价620万元，营业税税率为5％，2009年影响损益的金额合计是（　）万元。", "a": ["22.25", "60", "55", "31", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314538", "t": 1, "q": "根据《企业会计准则》，企业销售商品同时满足多个条件才能确认收入，下列不属于确认收入条件的是？", "a": ["收入的金额能够可靠地计量", "已经收到全部货款", "企业既没有保留通常与所有权相联系的继续管理权，也没有对已售出的商品实施有效控制", "企业已将商品所有权上的主要风险和报酬转移给购货方", "", ""], "r": "B", "e": "企业确认收入满足的条件包括收入金额能可靠计量、无继续管理权和有效控制、风险报酬转移等，而是否收到全部货款并非确认收入的必要条件。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314539", "t": 1, "q": "限额领料单属于（　）。", "a": ["外来原始凭证", "汇总原始凭证", "累计原始凭证", "一次原始凭证", "", ""], "r": "C", "e": "限额领料单可在规定限额内多次使用，属于累计原始凭证。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314540", "t": 1, "q": "企业销售商品时代垫的运杂费，应计入的会计科目是？", "a": ["应付账款", "预收账款", "其他应收款", "应收账款", "", ""], "r": "D", "e": "企业销售商品时代垫运杂费，是企业应向购货方收回的款项，应计入“应收账款”。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314541", "t": 1, "q": "下列关于资产负债表\"预收款项\"项目填列方法的表述，正确的是？", "a": ["根据\"预收账款\"总账科目余额直接填列", "根据\"预收账款\"和\"应收账款\"科目所属明细科目的期末贷方余额合计数填列", "根据\"预收账款\"和\"应付账款\"科目所属明细科目的期末贷方余额合计数填列", "根据\"预收账款\"科目所属明细科目的期末贷方余额直接填列", "", ""], "r": "B", "e": "资产负债表中“预收款项”项目应根据“预收账款”和“应收账款”科目所属明细科目的期末贷方余额合计数填列。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314542", "t": 1, "q": "下列有关无形资产的会计处理中，正确的是（　）。", "a": ["出租无形资产，应将租赁收入计入营业外收入", "出售无形资产，应将相关的增值税计入税金及附加", "出租无形资产，应将无形资产摊销费用计入其他业务成本", "出售无形资产，应将取得的价款计入其他业务收入", "", ""], "r": "C", "e": "出租无形资产，租赁收入计其他业务收入，摊销计其他业务成本；出售无形资产，价款计资产处置损益，增值税不影响损益。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314543", "t": 1, "q": " 下列关于企业资产负债表中\"应收账款\"项目填列方法的表述，正确的是？", "a": ["根据\"应收账款\"总账科目余额直接填列", "根据\"应收账款\"和\"预付账款\"科目所属明细科目借方余额之和，减去相应坏账准备余额填列", "根据\"应收账款\"科目所属明细科目借方余额之和填列", "根据\"应收账款\"和\"预收账款\"科目所属明细科目借方余额之和，减去相应坏账准备余额填列", "", ""], "r": "D", "e": "资产负债表“应收账款”项目应根据“应收账款”和“预收账款”科目所属明细科目借方余额之和，再减去相应坏账准备余额填列。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314544", "t": 1, "q": "下列资产负债表项目中，不是根据科目余额减去其备抵项目后的净额填列的项目是（　）。", "a": ["交易性金融资产", "无形资产", "固定资产", "其他权益工具投资", "", ""], "r": "A", "e": "交易性金融资产按账面余额填列，不减去备抵项目。无形资产、固定资产、其他权益工具投资要减去备抵项目后填列。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314545", "t": 1, "q": "A公司的外币业务采用交易日的市场汇率核算。2007年6月15日将其中的15000美元售给中国银行，当日中国银行美元买入价为1美元=7.68元人民币，卖出价为1美元=7.88元人民币，当日市场汇率为1美元=7.78元人民币。则A公司售出该笔美元时应确认的汇兑损失为（　）元。", "a": ["1 350", "1 550", "1 500", "0", "", ""], "r": "C", "e": "企业将美元卖给银行，银行按买入价折算，企业按市场汇率记账，汇兑损失=外币金额×（市场汇率 - 银行买入价），即15000×(7.78 - 7.68)=1500元。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314546", "t": 1, "q": "下列有关或有事项的表述中，正确的是（　）。", "a": ["因担保引起的或有事项不一定随着被担保人债务的全部清偿而消失", "或有事项有可能给企业带来有利影响，也有可能给企业带来不利影响", "对于或有事项既要确认或有负债，也要确认或有资产", "或有负债与或有事项相联系，有或有事项就有或有负债", "", ""], "r": "B", "e": "A项，被担保人债务全部清偿，因担保引起的或有事项通常会消失；C项，或有资产和或有负债不能确认；D项，有或有事项不一定有或有负债。B项，或有事项结果不确定，可能有利也可能不利。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314547", "t": 1, "q": "《企业会计准则》中要求企业应当按照交易或者事项的经济实质进行会计确认、计量和报告，不应仅以交易或者事项的法律形式为依据，该要求体现的会计信息质量原则是？", "a": ["实质重于形式", "及时性", "重要性", "谨慎性", "", ""], "r": "A", "e": "题干描述强调按经济实质而非法律形式处理会计事务，这正是实质重于形式原则的体现。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314548", "t": 1, "q": "2009年12月1日，甲公司向乙公司销售一批商品，开出增值税专用发票上注明的销售价格200000元，增值税税额为34000元，该批商品的成本为180000元，商品已发出，款项已收到。协议约定，甲公司应于2010年5月1日将所售商品购回，回购价为220000元（不含增值税税额）。假定不考虑其他因素。则在2009年12月1日时，甲公司应确认的其他应付款金额为（　）元。", "a": ["200000", "180000", "220000", "20000", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314549", "t": 1, "q": "某中外合资经营企业注册资本为500万美元，合同约定分两次投入，合同约定折算汇率为1:8.15。中、外投资者分别于2007年1月1日和5月1日投入350万美元和150万美元。2007年1月1日、5月1日、5月31日和12月31日美元对人民币的汇率分别为1:8.10、1:8.20、1:8.14和1:8.05。假定该企业采用人民币作为记账本位币，外币业务采用业务发生日的即期汇率折算。<br />该企业2007年年末资产负债表中\"实收资本\"项目的金额为人民币（　）万元。", "a": ["4 072.5", "4 100", "4 065", "4 125", "", ""], "r": "C", "e": "本题可根据“实收资本”按业务发生日即期汇率折算的原则来计算该项目的金额。 步骤一：分别计算中、外投资者投入资本按业务发生日即期汇率折算后的人民币金额 中方投资者于2007年1月1日投入350万美元，当日美元对人民币的汇率为1:8.10，所以中方投入资本折算为人民币的金额为「test/yiwen_img/importSubject/2034528602967642112.png」（万元）。 外方投资者于2007年5月1日投入150万美元，当日美元对人民币的汇率为1:8.20，所以外方投入资本折算为人民币的金额为「test/yiwen_img/importSubject/2034528603068305408.png」（万元）。 步骤二：计算“实收资本”项目的总金额将中方和外方投入资本折算后的人民币金额相加，可得“实收资本”项目的金额为2835 + 1230 = 4065（万元）。综上，答案是C选项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314550", "t": 1, "q": "下列哪种说法是错误的（　）。", "a": ["对未达账项调节后，银行存款日记账账面余额和银行存款对账单余额一定会一致", "未达账项不是错账、漏账", "未达账项不能据以进行任何的账务处理", "未达账项只应在银行存款余额调节表中进行调节", "", ""], "r": "A", "e": "对未达账项调节后，银行存款日记账账面余额和银行存款对账单余额可能仍不一致，因为可能存在记账错误等其他情况。未达账项是正常结算时间差导致，不是错账漏账，不能据此账务处理，只在余额调节表调节。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314551", "t": 1, "q": "采用成本法和权益法核算时，收到被投资单位分派的现金股利属于投资前累积盈余分配额的，应（　）。", "a": ["冲减投资成本", "增加盈余公积", "增加投资收益", "增加资本公积", "", ""], "r": "A", "e": "成本法和权益法下，收到被投资单位分派的属于投资前累积盈余分配额的现金股利，实质是投资成本的收回，所以应冲减投资成本。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314552", "t": 1, "q": "某公司于2008年1月1日购入一项管理用无形资产，初始入账价值为672万元。该无形资产预计使用年限为10年，采用直线法摊销。该无形资产2008年12月31日预计可收回金额为477万元，2009年12月31日预计可收回金额为320万元。假定该公司于每年年末计提无形资产减值准备，计提减值准备后该无形资产原预计使用年限、摊销方法不变。假定不考虑所得税影响，该无形资产2009年影响损益的金额为（　）万元。", "a": ["226", "212", "157", "225", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314553", "t": 1, "q": "大华公司发出存货按先进先出法计价，期末存货按成本与可变现净值孰低法计价。2008年1月1日将发出存货由先进先出法改为加权平均法。2008年初存货账面价值为（账面余额等于账面价值）40,000元、50千克，2008年1月、2月份分别购入材料600千克、350千克，单价分别为850元、900元，3月5日领用400千克，用未来适用法处理该项会计政策的变更，若期末该存货的可变现净值为520,000元，由于发出存货计价方法的改变对期末计提存货跌价准备的影响金额为（　）元。", "a": ["7,500", "8,500", "8,650", "6,000", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314554", "t": 1, "q": "下列关于可收回金额的表述，正确的是（　）。", "a": ["可收回金额应当根据资产的公允价值减去处置费用后的净额与资产预计未来现金流量的现值两者之间较高者确定", "可收回金额应当根据资产的公允价值减去处置费用后的净额与资产预计未来现金流量两者之间较高者确定", "可收回金额应当根据资产的账面价值减去处置费用后的净额与资产预计未来现金流量的现值两者之间较高者确定", "可收回金额应当根据资产的公允价值与资产预计未来现金流量的现值两者之间较高者确定", "", ""], "r": "A", "e": "可收回金额是按资产的公允价值减去处置费用后的净额与资产预计未来现金流量的现值两者中的较高者确定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314555", "t": 1, "q": "2008年12月31日，X公司对一条存在减值迹象的生产线进行减值测试，该生产线的资料如下:该生产线由A、B、C三台设备组成，被认定为一个资产组;A、B、C三台设备的账面价值分别为80万元、100万元、70万元，三台设备的使用寿命相等。减值测试表明，A设备的公允价值减去处置费用后的净额为50万元，B和C设备均无法合理估计其公允价值减去处置费用后的净额以及未来现金流量的现值;该生产线的可收回金额为200万元。不考虑其他因素，A设备应分摊的减值损失为（　）万元。", "a": ["40", "30", "16", "14", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314556", "t": 1, "q": "企业出售、转让、报废投资性房地产时，应当将所处置投资性房地产的账面价值计入（　）。", "a": ["投资收益", "公允价值变动损益", "资本公积", "其他业务成本", "", ""], "r": "D", "e": "企业处置投资性房地产时，其账面价值应结转到其他业务成本。出售、转让、报废投资性房地产属于日常经营活动，处置时把账面价值计入其他业务成本符合会计核算逻辑。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314557", "t": 1, "q": "下列各项中，影响企业当期损益的是（　）。", "a": ["采用成本模式计量，期末投资性房地产的可收回金额高于账面价值的差额", "自用的房地产转换为采用公允价值模式计量的投资性房地产时，转换日房地产的公允价值小于账面价值的差额", "采用成本模式计量，期末投资性房地产的可收回金额高于账面余额的差额", "企业将采用公允价值计量的投资性房地产转为自用的房地产，转换日的公允价值高于账面价值的差额", "", ""], "r": "B", "e": "A. 采用成本模式计量的投资性房地产，如果期末可收回金额高于账面价值，则不需要做任何处理，不影响当期损益。<br />B. 当自用房地产转为以公允价值模式计量的投资性房地产时，若转换日的公允价值小于账面价值，其差额应计入当期损益（公允价值变动损益），故此选项正确。<br />C. 与选项A相似，但这里提到了“账面余额”，实际上在会计处理上，我们关注的是账面价值而非账面余额。因此，即使可收回金额高于账面余额，只要不低于账面价值，也不需要调整，不影响当期损益。<br />D. 根据会计准则，从公允价值模式计量的投资性房地产转换为自用房地产时，转换日的公允价值与账面价值之间的差额应当直接调整所有者权益（其他综合收益），并不影响当期损益。", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314558", "t": 1, "q": "基本生产成本按（　）。", "a": ["产品品种分设明细账", "产品成本项目分设明细账", "明细分类科目分设明细账", "会计要素具体内容分设明细账", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314559", "t": 1, "q": "下列账户中，年末结转后一定没有余额的账户是（　）。", "a": ["银行存款", "长期借款", "资本公积", "本年利润", "", ""], "r": "D", "e": "年末“本年利润”需结转至“利润分配——未分配利润”，结转后无余额。银行存款是资产类账户、长期借款是负债类账户、资本公积是所有者权益类账户，一般年末有余额。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314560", "t": 1, "q": "下列关于会计要素计量属性中重置成本的表述，正确的是？", "a": ["按照当前市场条件，重新取得同样一项资产所需支付的现金或现金等价物金额", "市场参与者在计量日发生的有序交易中，出售一项资产所能收到或者转移一项负债所需支付的价格", "在正常生产经营过程中，以预计售价减去进一步加工成本和销售所必需的预计税金、费用后的净值", "取得或制造某项财产物资时所实际支付的现金或者现金等价物", "", ""], "r": "A", "e": "重置成本强调当前市场条件下重新取得资产的代价。B是公允价值定义；C是可变现净值定义；D是历史成本定义。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314561", "t": 1, "q": "资产负债表中\"存货\"项目应根据（　）等科目的期末余额合计，减去\"存货跌价准备\"科目期末余额后的金额填列。", "a": ["原材料、库存商品、在途物资、生产成本", "原材料、库存商品、固定资产、在建工程", "原材料、库存商品、无形资产、长期股权投资", "原材料、库存商品、短期借款、应付账款", "", ""], "r": "A", "e": "存货核算企业日常活动中持有以备出售的产成品或商品、处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料和物料等。A选项都与存货相关；B中固定资产、在建工程不属于存货；C中无形资产、长期股权投资不属于存货；D中短期借款是负债，应付账款是负债，都不是存货。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314562", "t": 1, "q": "甲公司2008年1月1日外购一建筑物，含税售价400万元，该建筑物用于出租，年租金30万，每年年初收取。该公司采用公允价值模式对其进行后续计量。2008年12月31日该建筑物的公允价值为420万元，2009年12月31日该建筑物的公允价值为410万元，2010年1月1日甲企业出售该建筑物，售价410万元，不考虑相关的税费，处置时影响损益的金额合计是（　）万元。", "a": ["30", "20", "0", "10", "", ""], "r": "C", "e": "采用公允价值模式计量的投资性房地产，处置时影响损益的金额为处置价款与账面价值的差额，以及原计入公允价值变动损益的金额转入其他业务成本（不影响损益总额）。本题中处置时账面价值410万，售价410万，两者差额为0，所以处置时影响损益的金额合计是0。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314563", "t": 1, "q": "A企业采用资产负债表债务法核算所得税，2008年初\"递延所得税资产\"科目的借方余额为200万元，本期计提无形资产减值准备100万元，上期计提的存货跌价准备于本期转回200万元，假设A企业适用的所得税税率为25％，除减值准备外未发生其他暂时性差异，本期\"递延所得税资产\"科目的发生额和期末余额分别为（　）万元。", "a": ["贷方25、借方175", "借方75、借方275", "借方25、借方225", "借方25、借方175", "", ""], "r": "A", "e": "本题可根据递延所得税资产的计算公式，先计算出本期递延所得税资产的发生额，再根据期初余额计算出期末余额。### 步骤一：计算本期递延所得税资产的发生额递延所得税资产发生额=可抵扣暂时性差异的变动额×所得税税率。 本期计提无形资产减值准备100万元，会增加可抵扣暂时性差异100万元。 上期计提的存货跌价准备于本期转回200万元，会减少可抵扣暂时性差异200万元。因此，可抵扣暂时性差异的变动额为100 - 200=-100（万元），即可抵扣暂时性差异减少了100万元。已知所得税税率为「test/yiwen_img/importSubject/2034528603173163008.png」，则本期递延所得税资产的发生额为「test/yiwen_img/importSubject/2034528603244466176.png」（万元），负号表示递延所得税资产减少，即发生额为贷方25万元。### 步骤二：计算本期递延所得税资产的期末余额递延所得税资产期末余额=递延所得税资产期初余额+本期递延所得税资产发生额。已知期初“递延所得税资产”科目的借方余额为200万元，本期发生额为贷方25万元，则期末余额为200 - 25 = 175（万元），方向为借方。综上，本期“递延所得税资产”科目的发生额为贷方25万元，期末余额为借方175万元，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314564", "t": 1, "q": "下列各项中，属于工业企业费用要素的是（　）。", "a": ["废品损失", "外购动力", "直接材料", "直接人工", "", ""], "r": "B", "e": "工业企业费用要素是按经济内容分类，外购动力属于费用要素。废品损失是成本项目，直接材料和直接人工是成本项目也是成本核算中的要素，但不是费用要素的范畴。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314565", "t": 1, "q": "当期与以前期间、以后期间的差别，权责发生制和收付实现制区别的出现，都是基于（　）的基本假设。", "a": ["会计主体", "会计分期", "货币计量", "持续经营", "", ""], "r": "B", "e": "会计分期假设将企业持续经营的生产经营活动划分为一个个连续的、长短相同的期间，才产生了当期与以前期间、以后期间的差别，进而出现权责发生制和收付实现制的区别。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314566", "t": 1, "q": "适合小批单件生产的产品成本计算方法是（　）。", "a": ["分步法", "品种法", "分批法", "分类法", "", ""], "r": "C", "e": "分批法是按照产品批别归集生产费用、计算产品成本的方法，适用于单件、小批生产。分步法适用于大量大批多步骤生产；品种法适用于大量大批单步骤生产；分类法是为简化成本计算而采用。所以答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314567", "t": 1, "q": "甲公司2008年12月31日库存50吨甲材料和100件M产品，其中库存的甲材料专门用于生产M产品。2008年12月31日，甲材料的成本为每吨20万元，市场售价为每吨16万元;M产品的成本为每件60万元，可变现净值为每件70万元。假设甲公司无其他存货，且期初存货跌价准备余额为0。则2008年12月31日应计提的存货跌价准备为（　）万元。", "a": ["0", "800", "200", "1 000", "", ""], "r": "A", "e": "因甲材料专门用于生产M产品，M产品可变现净值高于成本，未发生减值，所以甲材料也未减值，无需计提存货跌价准备。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314568", "t": 1, "q": "关于货币计量假设，下列说法中不正确的是（　）。", "a": ["货币计量假设为历史成本计量奠定了基础", "货币计量假设假定货币的币值是基本稳定的", "存在多种货币的情况下，我国境内的企业均要求以人民币作为记账本位币", "货币计量假设并不表示货币是会计核算中唯一的计量单位", "", ""], "r": "C", "e": "存在多种货币时，我国境内企业可根据实际情况选择人民币或其他货币作为记账本位币，并非均要求用人民币，C说法错误。A货币计量使资产等能用货币衡量，为历史成本计量奠定基础；B货币计量假设币值基本稳定；D会计核算除货币外还有实物等其他计量单位。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314569", "t": 1, "q": "分批法下，产品成本的计算是与（　）紧密联系的。", "a": ["生产流程", "生产日历", "生产计划", "生产任务通知单", "", ""], "r": "D", "e": "分批法以产品批别为成本计算对象，生产任务通知单确定了产品批别，产品成本计算与之紧密相关。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314570", "t": 1, "q": "某上市公司财务报告批准报出日为次年4月30日，该公司在资产负债表日后发生以下事项，其中属于非调整事项的有（　）。", "a": ["外汇汇率发生较大变动", "接到某债务人关于其1月28日发生火灾导致重大损失以至于不能偿还货款的通知，该上市公司已于资产负债表日将此货款计入应收账款", "新证据表明资产负债表日对长期建造合同应计收益的估计存在重大误差", "已登记为报告年度的销售货物被退回", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314571", "t": 1, "q": "根据《企业会计准则》，下列属于会计信息质量要求中谨慎性要求的是（　）", "a": ["企业提供的会计信息应当清晰明了", "企业应当按照交易或者事项的经济实质进行会计确认、计量和报告，不应仅以交易或者事项的法律形式为依据", "企业应当以实际发生的交易或者事项为依据进行会计确认、计量和报告", "企业对交易或者事项进行会计确认、计量和报告应当保持应有的谨慎，不应高估资产或者收益、低估负债或者费用", "", ""], "r": "D", "e": "谨慎性要求就是会计处理要保守，不高估资产或收益、不低估负债或费用。A是可理解性要求，B是实质重于形式要求，C是可靠性要求。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314572", "t": 1, "q": "采用分步法计算产品成本时，某步骤广义在产品是指？", "a": ["本步骤正在加工的在产品、本步骤已完工但尚未最终完工的半成品以及后续步骤正在加工的在产品", "本步骤正在加工的在产品", "本步骤已完工但尚未最终完工的半成品", "本步骤正在加工的在产品和本步骤已完工但尚未最终完工的半成品", "", ""], "r": "A", "e": "广义在产品包含本步骤正在加工的、本步骤已完工但未最终完工的半成品以及后续步骤正在加工的在产品。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314573", "t": 1, "q": "M企业2008年度的财务报告于2009年4月10日批准报出，2009年1月10日，因产品质量原因，客户将2008年12月10日购入的一批大额商品（达到重要性要求）退回，对退回产品的处理正确的是（　）。", "a": ["在2009年度财务报告报出时，冲减利润表中营业收入项目的本年数等相关项目", "冲减2008年度财务报表营业收入等相关项目", "冲减2009年度财务报表营业收入等相关项目", "不做会计处理", "", ""], "r": "B", "e": "资产负债表日后事项涵盖期间发生的销售退回，属于调整事项，应调整报告年度（2008年）财务报表相关项目。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528607774314574", "t": 1, "q": "采用品种法核算产品成本时，制造费用在各产品之间分配的标准不包括？", "a": ["生产工时比例", "机器工时比例", "产品销售数量", "生产工人工资比例", "", ""], "r": "C", "e": "制造费用分配标准应与生产相关，产品销售数量和产品生产过程无直接关联，不能作为制造费用在各产品间分配的标准。而生产工时、机器工时、生产工人工资都和产品生产紧密相关。所以答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290560", "t": 2, "q": "下列各项中，属于永久保存的会计档案有（　）", "a": ["会计档案保管清册", "银行存款日记账", "行政单位决算", "国家金库年报", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290561", "t": 2, "q": "关于《企业会计准则》中会计信息质量要求的实质重于形式原则，体现在？", "a": ["固定资产折旧采用直线法", "融资租入固定资产视为企业自有资产核算", "对具有重大影响的长期股权投资采用权益法核算", "售后回购业务若不满足收入确认条件，不确认收入", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290562", "t": 2, "q": "企业利润表中\"研发费用\"项目的填列内容包括？", "a": ["费用化的研发支出", "无形资产摊销中计入管理费用的部分", "资本化的研发支出", "研发人员的工资薪金（费用化部分）", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290563", "t": 2, "q": "下列各项中，应作为持有至到期投资取得时初始成本入账的有（　）。", "a": ["投资时支付的不含应收利息的价款", "投资时支付的税金", "投资时支付款项中所含的已到付息期但尚未领取的利息", "投资时支付的手续费", "", ""], "r": "ABD", "e": "持有至到期投资初始成本是取得投资时实际支付的价款和相关税费等，不含已到付息期但尚未领取的利息。A选项投资时支付不含应收利息的价款是初始成本一部分；B选项投资时支付的税金属于相关税费应计入；D选项投资时支付的手续费也属于相关费用要计入。而C选项已到付息期但尚未领取的利息应单独作为应收项目核算，不计入初始成本。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290564", "t": 2, "q": "下列有关可供出售金融资产会计处理的表述中，正确的有（　）。", "a": ["可供出售金融资产持有期间取得的现金股利应冲减资产成本", "取得可供出售金融资产发生的交易费用应计入初始确认金额", "可供出售金融资产发生的减值损失应计入所有者权益", "以外币计价的可供出售货币性金融资产发生的汇兑差额应计入当期损益", "", ""], "r": "BD", "e": "A选项，持有期间现金股利应计入投资收益而非冲减资产成本；C选项，减值损失应计入当期损益而非所有者权益；B选项，交易费用计入初始确认金额正确；D选项，外币计价的可供出售货币性金融资产汇兑差额计入当期损益正确。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290565", "t": 2, "q": "在同一控制下的企业合并中，合并方取得的净资产账面价值与支付的合并对价账面价值（或发行股份面值总额）的差额，可能调整（　）。", "a": ["资本公积", "盈余公积", "未分配利润", "管理费用", "", ""], "r": "ABC", "e": "在同一控制下企业合并，合并方取得的净资产账面价值与支付合并对价账面价值等的差额，应先调整资本公积，资本公积不足冲减的，调整盈余公积，盈余公积还不足冲减的，调整未分配利润。而管理费用与该差额调整无关。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290566", "t": 2, "q": "满足下列（　）条件的金融资产，应当划分为交易性金融资产。", "a": ["被指定为有效套期工具的衍生工具", "属于财务担保合同的衍生工具", "取得该金融资产的目的，主要是为了近期内出售", "属于进行集中管理的可辨认金融工具组合的一部分，且有客观证据表明企业近期采用短期获利方式对该组合进行管理", "", ""], "r": "CD", "e": "交易性金融资产主要是为近期出售而持有，或属集中管理可辨认金融工具组合且近期以短期获利方式管理。A选项被指定为有效套期工具的衍生工具不属于交易性金融资产；B选项属于财务担保合同的衍生工具也不符合交易性金融资产定义。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290567", "t": 2, "q": "常见的或有事项包括（　）。", "a": ["商业承兑汇票贴现", "债务担保", "未决仲裁", "重组义务", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290568", "t": 2, "q": "企业在确认递延所得税时，可能会涉及的科目有（　）。", "a": ["投资收益", "资本公积", "管理费用", "所得税费用", "", ""], "r": "BD", "e": "确认递延所得税时，与直接计入所有者权益的交易或事项相关的递延所得税，计入资本公积；与企业日常经营活动产生的所得税影响，计入所得税费用。投资收益和管理费用一般不涉及递延所得税确认。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290569", "t": 2, "q": "W公司拥有甲、乙、丙、丁四家公司，权益性资本比例分别是73％、35％、26％、30％，此外，甲公司拥有乙公司26％的权益性资本，丙公司拥有丁公司30％的权益性资本，应纳入W公司合并财务报表合并范围的有（　）。", "a": ["甲公司", "乙公司", "丙公司", "丁公司", "", ""], "r": "ABD", "e": "根据会计准则，当母公司直接或间接持有子公司超过50%的表决权时，该子公司应当被纳入母公司的合并财务报表范围内。本题中，W公司对甲公司持股73%，超过50%，因此A选项正确;对于乙公司，虽然W公司仅直接持有其35%的股权，但加上甲公司持有的26%，W公司实际控制了乙公司61%的股权，超过了50%，故B选项也正确;关于丙公司，W公司仅持有26%的股份，并且没有通过其他方式增加其在丙公司的控制权，所以丙公司不应被纳入合并范围，C选项错误;至于丁公司，虽然W公司直接持有其30%的股份不足50%，但是由于丙公司（由W公司部分控股）还额外持有丁公司30%的股份，这使得W公司及其关联方合计持有丁公司60%的股份，从而达到控制标准，因此D选项正确。综上所述，正确答案为A、B、D。", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290570", "t": 2, "q": "下列关于成本计量模式下企业处置投资性房地产会计处理的说法中，正确的有（　）。", "a": ["应将实收金额与投资性房地产账面价值之间的差额计入营业外收支", "应按实收金额贷记\"其他业务收入\"科目", "应按投资性房地产的账面价值借记\"其他业务成本\"科目", "应使用\"投资性房地产清理\"科目", "", ""], "r": "BC", "e": "成本模式下处置投资性房地产，按实际收到款项贷记“其他业务收入”，按账面价值借记“其他业务成本”。A选项，差额应计入其他业务收支而非营业外收支；D选项，不使用“投资性房地产清理”科目。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290571", "t": 2, "q": "如果清偿因或有事项而确认的负债所需支出全部或部分预期由第三方或其他方补偿，下列说法中不正确的有（　）。", "a": ["补偿金额在基本确定收到时，企业应按所需支出扣除补偿金额确认负债", "补偿金额在基本确定收到时，企业应按所需支出确认负债，而不能扣除补偿金额", "补偿金额只能在已经收到时，作为资产单独确认，且确认的补偿金额不应超过所确认负债的账面价值", "补偿金额只能在基本确定收到时，作为资产单独确认，且确认的补偿金额不应超过所确认负债的账面价值", "", ""], "r": "AC", "e": "预期第三方补偿应在基本确定收到时作为资产单独确认，确认金额不超负债账面价值，确认负债时不能扣除补偿金额。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290572", "t": 2, "q": "资产负债表中\"存货\"项目金额的计算，应考虑的科目有？", "a": ["生产成本", "原材料", "工程物资", "存货跌价准备", "", ""], "r": "ABD", "e": "存货包括原材料、在产品等，生产成本核算在产品成本，原材料是存货重要组成，存货跌价准备要从存货账面价值中扣除；而工程物资用于建造固定资产，不属于存货。答案为ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290573", "t": 2, "q": "下列关于会计估计变更的说法中，正确的有（　）。", "a": ["如果会计估计变更仅影响变更当期，有关估计变更的影响不应于当期确认", "会计估计变更应采用未来适用法进行会计处理", "会计估计变更应采用追溯调整法进行会计处理", "如果会计估计变更既影响变更当期又影响未来期间，有关估计变更的影响在当期及以后期间确认", "", ""], "r": "BD", "e": "会计估计变更采用未来适用法，若仅影响当期就在当期确认，既影响当期又影响未来就在当期及以后确认。追溯调整法用于会计政策变更。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290574", "t": 2, "q": "\"材料成本差异\"科目贷方核算的内容有（　）。", "a": ["入库材料成本节约差异", "结转发出材料应负担的节约差异", "结转发出材料应负担的超支差异", "入库材料成本超支差异", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290575", "t": 2, "q": "在常见的账务处理程序中，共同的账务处理工作有（　）。", "a": ["根据总账和明细账编制会计报表", "均应填制汇总记账凭证", "根据原始凭证和记账凭证登记明细账", "均应编制记账凭证", "", ""], "r": "ACD", "e": "各种账务处理程序都要根据总账和明细账编制会计报表，都需根据原始凭证编制记账凭证，且要根据原始凭证和记账凭证登记明细账；并非都要填制汇总记账凭证。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290576", "t": 2, "q": "下列公司的股东均按所持股份行使表决权，W公司编制合并会计报表时应纳入合并范围的公司有（　）。", "a": ["甲公司（W公司拥有其60％的股权）", "乙公司（甲公司拥有其40％的股权，W公司拥有其20％的股权）", "丙公司（W公司拥有其30％的股权，乙公司拥有其40％的股权）", "丁公司（甲公司拥有其10％的股权，乙公司拥有其20％的股权，丙公司拥有其30％的股权）", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290577", "t": 2, "q": "对账工作的主要内容包括（　）。", "a": ["账实核对", "账证核对", "账表核对", "账账核对", "", ""], "r": "ABD", "e": "对账是为保证账簿记录的正确性而进行的核对工作，主要有账实、账证、账账核对。账表核对不属于对账主要内容。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290578", "t": 2, "q": "采用逐步结转分步法核算产品成本时，成本还原的方法有？", "a": ["按计划成本还原", "按定额成本还原", "按半成品各成本项目占全部成本的比重还原", "按各步骤耗用半成品的总成本占上一步骤完工半成品总成本的比重还原", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290579", "t": 2, "q": "以下应判断为同一控制下企业合并的有（　）。", "a": ["企业集团内某子公司在企业合并中取得另一子公司全部净资产并注销被合并方的法人资格", "母公司将其持有的对子公司的部分股权用于交换对集团以外某企业的控制权", "企业集团内某子公司自另一子公司处取得对某一孙公司的控制权", "母公司将其持有的对某一子公司的控制权出售给另一子公司", "", ""], "r": "ACD", "e": "同一控制下企业合并是指参与合并的企业在合并前后均受同一方或相同的多方最终控制且该控制并非暂时性的。选项A、C、D都属于企业集团内部的股权变动，合并前后都受集团控制；而选项B是与集团以外企业的交易，不属于同一控制下企业合并。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290580", "t": 2, "q": "按照债务重组准则的规定，债务重组的方式包括（　）。", "a": ["以资产清偿债务", "将债务转为资本", "修改其他债
