理财产损失不符合资产定义不应列为资产", "", ""], "r": "ABCD", "e": "资产是企业过去交易或事项形成，预期能带来经济利益的资源。融资租入固定资产实质控制权归企业，算企业资产；待处理财产损失不能带来经济利益，不符资产定义。ABCD选项均符合资产相关特征。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780064", "t": 2, "q": "下列关于企业利润表中\"研发费用\"项目的说法，正确的有？", "a": ["包括费用化的研发支出", "不包括资本化的研发支出", "包括与研发活动相关的人员薪酬", "不包括计入管理费用的自行开发无形资产摊销", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780065", "t": 2, "q": "下列各项表述中，符合总分类账和明细分类账平行登记要求的有（　）", "a": ["记入总分类账户的金额与记入明细分类账户的合计金额相等", "所依据的会计凭证相同", "所属会计期间相同", "借贷方向相同", "", ""], "r": "ABCD", "e": "总分类账和明细分类账平行登记要求依据相同（所依据会计凭证相同）、方向相同（借贷方向相同）、期间相同（所属会计期间相同）、金额相等（记入总分类账户的金额与记入明细分类账户的合计金额相等）。ABCD四个选项均符合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780066", "t": 2, "q": "下列不属于会计政策变更情形有（　）。", "a": ["第一次签订建造合同，采用完工百分比法确认收入", "本期发生的交易或事项与以前相比具有本质差别而采用新的会计政策", "由于持续通货膨胀，企业将存货发出的计价方法由先进先出法改为加权平均法", "将低值易耗品的摊销方法由分次摊销法改为一次摊销法", "", ""], "r": "ABD", "e": "A是初次发生业务采用新政策，B是交易本质不同用新政策，D是不重要的会计事项变更，都不属于会计政策变更；C是存货计价方法改变，属于会计政策变更。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780067", "t": 2, "q": "财产清查中填制的\"账存实存对比表\"是（　）", "a": ["调整账簿的原始凭证", "登记日记账的直接依据", "财产清查的重要报表", "调整账簿记录的记账凭证", "", ""], "r": "AC", "e": "“账存实存对比表”能反映账实差异，可作为调整账簿的原始凭证，也是财产清查的重要报表。它不是登记日记账直接依据，也不是记账凭证。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780068", "t": 2, "q": "\"长期应付款\"科目核算的内容主要有（　）。", "a": ["应付经营租入固定资产的租赁费", "无法支付的应付账款", "以分期付款方式购入固定资产发生的应付款项", "采用补偿贸易方式引进国外设备价款", "", ""], "r": "CD", "e": "A选项经营租入固定资产租赁费通过“其他应付款”核算；B选项无法支付的应付账款计入营业外收入。C选项分期付款购入固定资产应付款项和D选项补偿贸易引进国外设备价款属于长期应付款核算内容。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780069", "t": 2, "q": "企业现金流量表中，属于筹资活动产生的现金流量的有？", "a": ["分配股利支付的现金", "偿还债务支付的现金", "吸收投资收到的现金", "取得借款收到的现金", "", ""], "r": "ABCD", "e": "筹资活动是企业筹集资金的活动。分配股利是向投资者分配利润，偿还债务是归还借款等，这是资金的流出；吸收投资和取得借款是企业获取资金，属于资金流入，这四项都与企业的筹资活动相关。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780070", "t": 2, "q": "采用分批法计算产品成本时，其适用范围包括？", "a": ["新产品的试制", "大量大批的标准件生产", "小批生产的服装定制业务", "单件生产的重型机械设备制造", "", ""], "r": "ACD", "e": "分批法适用于单件、小批生产。新产品试制通常是单件或小批，小批服装定制业务是小批生产，单件重型机械设备制造属单件生产，都适用分批法；而大量大批的标准件生产适合用品种法等。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780071", "t": 2, "q": "根据《企业会计准则》，会计基本假设包括？", "a": ["货币计量", "会计主体", "会计分期", "持续经营", "", ""], "r": "ABCD", "e": "会计基本假设是企业会计确认、计量和报告的前提，包括会计主体、持续经营、会计分期和货币计量。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780072", "t": 2, "q": " 在企业财务报表分析中，关于偿债能力分析的指标包括？", "a": ["流动比率", "净资产收益率", "资产负债率", "利息保障倍数", "", ""], "r": "ACD", "e": "偿债能力分析指标用于衡量企业偿还债务的能力。流动比率衡量短期偿债能力；资产负债率反映长期偿债的总体情况；利息保障倍数体现企业支付利息的能力，也与偿债能力相关。而净资产收益率是衡量盈利能力指标。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780073", "t": 2, "q": "下列对可比性要求说法正确的有（　）。", "a": ["不同企业发生的相同或者相似的交易或者事项，应当采用规定的会计政策，确保会计信息口径一致、相互可比", "同一企业不同时期发生的相同或者相似的交易或者事项，应当采用一致的会计政策，不得随意变更", "企业对于已经发生的交易或者事项，应当及时进行会计确认、计量和报告，不得提前或者延后", "企业提供的会计信息应当清晰明了，便于财务报告使用者理解和使用", "", ""], "r": "AB", "e": "可比性包括横向可比（不同企业相同或相似交易采用规定会计政策确保口径一致、相互可比）和纵向可比（同一企业不同时期相同或相似交易采用一致会计政策，不得随意变更）。C是及时性要求，D是可理解性要求。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780074", "t": 2, "q": "企业编制财务报表时，下列项目应在资产负债表\"流动资产\"中列示的有？", "a": ["一年内到期的非流动资产", "预付款项", "交易性金融资产", "债权投资", "", ""], "r": "ABC", "e": "流动资产是指预计在一个正常营业周期中变现、出售或耗用，或者主要为交易目的而持有，或者预计在资产负债表日起一年内（含一年）变现的资产等。A一年内到期的非流动资产，即将在一年内变现，属于流动资产；B预付款项通常会在短期内收到货物或服务，是流动资产；C交易性金融资产主要为交易目的持有，变现快，属流动资产。而D债权投资一般到期时间较长，不属于流动资产。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780075", "t": 2, "q": "企业利润表中\"税金及附加\"项目核算的税费包括哪些？", "a": ["消费税", "城市维护建设税", "增值税", "房产税", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780076", "t": 2, "q": "关于品种法的适用范围，正确的有？", "a": ["大量大批单步骤生产的企业", "大量大批多步骤生产，但管理上不要求分步计算成本的企业", "单件小批生产的企业", "小批多步骤生产的企业", "", ""], "r": "AB", "e": "品种法适用于大量大批单步骤生产，以及大量大批多步骤生产但管理上不要求分步计算成本的企业。单件小批、小批多步骤生产一般用分批法。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780077", "t": 2, "q": "下列关于固定资产的初始计量，说法正确的有（　）。", "a": ["固定资产的入账价值中还应该包含为取得固定资产而交纳的契税、耕地占用税、车辆购置税等相关税费", "对于特殊行业的特殊固定资产，确定其初始入账成本的时候，还应该考虑弃置费用", "融资租入固定资产的入账价值中，包含租赁方为租入固定资产发生的差旅费", "投资者投入固定资产的成本，应当按照投资合同或协议约定的价值确定，但合同或者协议约定的价值不公允的除外", "", ""], "r": "ABD", "e": "契税等相关税费应计入固定资产入账价值，A对；特殊行业特殊固定资产要考虑弃置费用，B对；融资租入固定资产入账价值不包含租赁方差旅费，C错；投资者投入固定资产按合同或协议约定价值，不公允除外，D对。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780078", "t": 2, "q": "企业出售、转让、报废投资性房地产时，不应将所处置投资性房地产的收入计入（　）。", "a": ["公允价值变动损益", "营业外收入", "投资收益", "营业外支出", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780079", "t": 2, "q": "企业的下列外币业务中，在业务发生时即可能产生汇兑差额的有（　）。", "a": ["外币借贷业务", "企业从银行买入外币", "以外币结算的购销业务", "企业将外币出售给银行", "", ""], "r": "BD", "e": "企业从银行买入外币和将外币出售给银行，买入价、卖出价与中间价不同，业务发生时就会有汇兑差额。而外币借贷业务和以外币结算的购销业务，一般在业务发生时采用即期汇率折算，通常无汇兑差额，期末才可能有。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019328", "t": 3, "q": "负债产生的暂时性差异等于未来期间计税时按照税法规定可予税前扣除的金额。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019329", "t": 3, "q": "确认递延所得税资产时，应估计相关可抵扣暂时性差异的转回时间，采用转回期间适用的所得税税率为基础计算确定。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "确认递延所得税资产时，确实要估计可抵扣暂时性差异转回时间，按转回期间适用税率计算确定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019330", "t": 3, "q": "对资产进行减值测试时，企业预计资产的未来现金流量应当包括与将来可能会发生的与资产改良有关的预计未来现金流量。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "预计资产未来现金流量时，不应包括与将来可能会发生的、尚未作出承诺的重组事项或与资产改良有关的预计未来现金流量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019331", "t": 3, "q": "不具有商业实质且换入资产的公允价值不能可靠计量的非货币性资产交换，在同时换入多项资产的情况下，在确定各项换入资产的入账价值时，需要按照换入资产各项资产的原账面价值占换入资产的原账面价值总额的比例，确定各项换入资产的成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于不具有商业实质且换入资产公允价值不能可靠计量的非货币性资产交换，同时换入多项资产时，就是按换入资产原账面价值占换入资产原账面价值总额的比例来确定各项换入资产成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019332", "t": 3, "q": "企业在资产负债表日后至财务报告批准报出日之间发生巨额亏损，这一事项与企业资产负债表日存在状况无关，不应作为非调整事项在财务报表附注中披露。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。资产负债表日后发生巨额亏损，虽与资产负债表日存在状况无关，但属于重大事项，会影响财务报告使用者对企业财务状况和经营成果的理解，应作为非调整事项在财务报表附注中披露。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019333", "t": 3, "q": "无形资产的残值一定为零。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "无形资产残值一般为零，但存在第三方承诺在无形资产使用寿命结束时购买该无形资产等特殊情形时，残值不为零，所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019334", "t": 3, "q": "对于使用寿命有限的无形资产，企业也至少应于每年年度终了对其使用寿命和摊销方法进行复核。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "按规定，使用寿命有限的无形资产，企业至少应于每年年度终了对其使用寿命和摊销方法进行复核。所以本题说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019335", "t": 3, "q": "企业可随意选择成本模式或公允价值模式对投资性房地产进行后续计量。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业对投资性房地产的后续计量模式一经确定，不得随意变更，只有在满足特定条件时才可以从成本模式转为公允价值模式，且公允价值模式不能再转为成本模式。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019336", "t": 3, "q": "无形资产应自无形资产可供使用时起开始摊销，摊销方法的选择应当反映与该项无形资产有关的经济利益的预期实现方式，无法可靠确定预期实现方式的，不摊销。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "无形资产应自可供使用时起开始摊销，无法可靠确定预期实现方式的，应采用直线法摊销，而不是不摊销。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019337", "t": 3, "q": "在事业单位的资产负债表中，\"固定资产\"项目的金额一定等于\"固定基金\"项目的金额。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "事业单位在融资租入固定资产时，固定资产入账但固定基金随着租金支付逐步增加，此时“固定资产”项目金额与“固定基金”项目金额不相等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019338", "t": 3, "q": "会计政策变更可以采用追溯调整法和未来适用法两种方法进行会计处理，采用哪种会计处理方法，应根据具体情况确定。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计政策变更确实有追溯调整法和未来适用法两种处理方法，企业需依据具体情形来选择合适的方法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019339", "t": 3, "q": "正在项目建设期间的建设单位，其保管期满的会计档案可以销毁。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "正在项目建设期间的建设单位，其保管期满的会计档案不得销毁，需待项目办理竣工决算后按规定处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019340", "t": 3, "q": "企业外购房屋建筑物所支付的价款中包括土地使用权以及建筑物的价值的，对于确实无法在土地使用权和地上建筑物之间进行合理分配的，应当全部作为无形资产，按照无形资产的有关处理原则核算。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "无法合理分配时应全部作为固定资产核算，而非无形资产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019341", "t": 3, "q": "固定资产使用寿命、预计净残值和折旧方法的改变应当作为会计估计变更。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计估计变更指由于资产和负债的当前状况及预期经济利益和义务发生了变化，从而对资产或负债的账面价值或者资产的定期消耗金额进行调整。固定资产使用寿命、预计净残值和折旧方法的改变符合会计估计变更的定义。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019342", "t": 3, "q": "可供出售金融资产发生减值时，即使该金融资产没有终止确认，原直接计入所有者权益中的因公允价值下降形成的累计损失，应当予以转出，计入资产减值损失。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "可供出售金融资产发生减值时，按准则规定，即便未终止确认，原计入所有者权益的公允价值下降累计损失要转出计入资产减值损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019343", "t": 3, "q": "采用分步法计算产品成本实际上就是按车间计算产品成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分步法是按照产品的生产步骤归集生产费用，计算产品成本的一种方法，它不一定是按车间计算产品成本，因为一个车间可能包含多个生产步骤，也可能一个生产步骤跨多个车间。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019344", "t": 3, "q": "资产负债表日后事项中涉及的销售退回，均应调整报告年度财务报表的收入、成本等，且调整报告年度应缴的所得税。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产负债表日后事项中的销售退回，若属于资产负债表日后调整事项，才调整报告年度财务报表的收入、成本等，但如果发生在所得税汇算清缴之后，一般不调整报告年度应缴所得税。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019345", "t": 3, "q": "投资性房地产因资产负债表日后公允价值严重下跌，企业应将其视为资产负债表日后调整事项。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产负债表日后公允价值严重下跌，属于资产负债表日后非调整事项，因为这是在资产负债表日后才发生的情况，不影响资产负债表日存在的状况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019346", "t": 3, "q": "企业采用公允价值模式进行后续计量的，不对投资性房地产计提折旧或进行摊销，应当以资产负债表日投资性房地产的公允价值为基础调整其账面价值，公允价值与原账面价值之间的差额计入其他业务成本或其他业务收入。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "公允价值与原账面价值差额应计入公允价值变动损益，并非其他业务成本或其他业务收入。", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019347", "t": 3, "q": "资产负债表日后事项的调整事项，虽然已经调整了报表的相关数字，但是也要在财务报告附注中进行披露。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019348", "t": 3, "q": "无论是为换出资产而发生的相关税费，还是为换入资产而发生的相关税费，均计入换入资产的成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "换出资产发生的相关税费一般不计入换入资产成本，而是按相关准则处理，如换出固定资产涉及的增值税等。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019349", "t": 3, "q": "A公司购入B公司5％的股份，买价161000元，其中含有已宣告但尚未领取的现金股利4000元。那么A公司取得长期股权投资的成本为161000元。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "取得长期股权投资时，买价中包含的已宣告但尚未领取的现金股利应单独确认为应收项目，不计入长期股权投资成本，所以A公司取得长期股权投资成本应为161000 - 4000 = 157000元，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019350", "t": 3, "q": "由于经营亏损导致企业资金紧缺，企业准备将初始确认为持有至到期投资的某公司债券予以出售。因投资意图和能力的改变，资产负债表日，企业应将该项尚未出售的投资重分类为以公允价值计量且其变动计入当期损益的投资。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019351", "t": 3, "q": "现时义务是指企业在现行条件下已承担的义务。或有负债作为现时义务，其特征在于该现时义务的履行很可能导致经济利益流出企业。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019352", "t": 3, "q": "企业发行的可转换公司债券，应当在初始确认时将其包含的负债成份和权益成份进行分拆，将所包含的负债成份面值贷记\"资本公积——其他资本公积\"科目，按权益成份的公允价值，贷记\"应付债券——可转换公司债券（面值）\"科目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业发行可转换公司债券，应将负债成份面值贷记“应付债券——可转换公司债券（面值）”，权益成份公允价值贷记“其他权益工具”，而不是题干表述的那样。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019353", "t": 3, "q": "对于盘盈的存货、盘亏和毁损的存货，在会计核算时，先通过\"待处理财产损溢\"科目核算，然后批准后列作当期支出或冲减当期支出（事业支出或经营支出）。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在行政事业单位会计中，盘盈、盘亏和毁损的存货先通过“待处理财产损溢”核算，批准后按规定处理，一般是列作当期支出或冲减当期支出（事业支出或经营支出） 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019354", "t": 3, "q": "权益法核算下，处置长期股权投资时，应按实际收到的金额，借记\"银行存款\"等科目，按其账面余额，贷记\"长期股权投资\"科目，按尚未领取的现金股利或利润，贷记\"应收股利\"科目，按其差额，贷记或借记\"投资收益\"科目。已计提减值准备的，还应同时结转减值准备。除上述规定外，还应结转原计入资本公积的相关金额，借记或贷记\"资本公积——其他资本公积\"科目，贷记或借记\"长期股权投资减值准备\"科目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019355", "t": 3, "q": "\"可供出售金融资产\"借方的期末余额，反映企业可供出售金融资产的公允价值。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“可供出售金融资产”借方期末余额确实反映企业可供出售金融资产的公允价值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019356", "t": 3, "q": "董事会或类似机构批准财务报告对外公布的日期，与实际对外公布日之间发生的与资产负债表日后事项有关的事项，由此影响财务报告对外公布日期的，应以董事会或类似机构首次批准财务报告对外公布的日期为截止日期。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019357", "t": 3, "q": "在不具有商业实质的情况下，涉及补价的多项资产交换与单项资产交换的主要区别在于单项资产交换按照公允价值确定入账价值;多项资产交换按照账面价值确定入账价值。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不具有商业实质时，不管是单项还是多项资产交换，均按账面价值确定入账价值，并非单项按公允价值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019358", "t": 3, "q": "企业借入的款项用于生产存货的，发生的借款费用均予以资本化。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业借款用于生产存货，只有符合资本化条件时借款费用才予以资本化，并非发生的借款费用都资本化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019359", "t": 3, "q": "企业用自产产品换取为建造或生产符合资本化条件的资产所需用的工程物资的，表明资产支出已经发生。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业用自产产品换取工程物资用于符合资本化条件资产建造等，相当于用非现金资产支付，意味着为资产购建或生产已经付出代价，表明资产支出已发生。  ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019360", "t": 3, "q": "购买固定资产的价款超过正常信用条件延期支付，实质上具有融资性质的，固定资产的成本应当以支付的总的价款为入账价值。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019361", "t": 3, "q": "企业自行建造房地产达到预定可使用状态后一段时间才对外出租或用于资本增值的，直接将其作为投资性房地产进行核算。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业自行建造房地产达到预定可使用状态后一段时间才对外出租或用于资本增值的，应先将其作为固定资产、无形资产核算，等租赁期开始日或用于资本增值之日起，再转为投资性房地产核算。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528642306019362", "t": 3, "q": "如果某项资产的公允价值减去处置费用后的净额大于该资产的账面价值，则表明该项资产没有发生减值。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资产的可收回金额是公允价值减去处置费用后的净额与预计未来现金流量现值两者中的较高者，若公允价值减去处置费用后的净额已大于账面价值，那可收回金额必然大于账面价值，根据资产减值判断，当可收回金额大于账面价值时，资产未发生减值。所以本题表述正确。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 会计学（7）", "n": "基础练习题【含解析】 / 第2章 会计学（7）", "qs": [{"id": "2034528647301435392", "t": 1, "q": "（　）不属于企业的收入。", "a": ["销售商品一批，收到款项", "年末获得股票分红，收到款项", "出租闲置厂房，收到款项", "出售专利技术，收到款项", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435393", "t": 1, "q": "企业销售商品时代垫的包装费，应计入的会计科目是？", "a": ["其他应收款", "应收账款", "销售费用", "预收账款", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435394", "t": 1, "q": "某企业2007年和2008年归属于普通股股东的净利润分别为200万元和300万元，2007年1月1日发行在外的普通股100万股，2007年4月1日按市价新发行普通股20万股，2008年7月1日分派股票股利，以2007年12月31日总股本120万股为基数每10股送3股，假设不存在其他股数变动因素。则2008年度比较利润表中基本每股收益2007年和2008年的金额分别是（　）元。", "a": ["1.27和1.41", "1.34和1.92", "1.34和2.17", "1.67和1.92", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435395", "t": 1, "q": "甲公司本期购买原材料，增值税专用发票上注明的材料价款为300万元，增值税进项税额为51万元，款项已通过银行转账支付;应付票据账户期初余额为20万元，期末余额为5万元;预付账款账户期初余额为30万元，期末余额为60万元。不考虑其他因素，则该公司2008年\"购买商品、接受劳务支付的现金\"项目的金额为（　）万元。", "a": ["306", "396", "366", "336", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435396", "t": 1, "q": "A公司于2008年7月1日正式动工兴建一栋办公楼，预计工期为1年零7个月，工程采用出包方式进行建造。为建造该办公楼，A公司向银行专门借款2000万元。2009年7月10日，工程按照合同要求提前全部完工。2009年7月20日工程验收合格，7月31日办理工程竣工结算，8月11日完成全部资产移交手续，9月1日办公楼正式投入使用。则A公司借款利息停止资本化的时点为（　）。", "a": ["2009年9月1日", "2009年7月20日", "2009年7月31日", "2009年7月10日", "", ""], "r": "D", "e": "购建或者生产符合资本化条件的资产达到预定可使用或者可销售状态时，借款费用应当停止资本化。本题中工程于2009年7月10日提前全部完工，已达到预定可使用状态。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435397", "t": 1, "q": "下列项目中，不通过应付职工薪酬核算的是（　）。", "a": ["以权益结算的股份支付", "无偿提供给职工使用的租赁住房等资产的租金", "以现金结算的股份支付", "无偿提供给职工使用的住房计提的折旧费", "", ""], "r": "A", "e": "以权益结算的股份支付，通过“资本公积——其他资本公积”核算，不通过应付职工薪酬核算；B、C、D 选项都属于应付职工薪酬核算内容。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435398", "t": 1, "q": "采用品种法计算产品成本时，制造费用在各产品之间分配的标准不包括？", "a": ["产品销售金额", "产品产量", "产品生产工人工资", "产品生产工时", "", ""], "r": "A", "e": "品种法下制造费用分配标准通常与产品生产相关，产品销售金额与生产过程无直接关联，不能作为制造费用在各产品间分配标准。而产品产量、生产工人工资、生产工时都和生产密切相关，常被用作分配标准。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435399", "t": 1, "q": "A公司对外币业务采用业务发生日的市场汇率进行折算，按月计算汇兑损益。2007年3月20日从境外购买零配件一批，价款总额为500万美元，货款尚未支付，当日的市场汇率为1美元=8.21元人民币。3月31日的市场汇率为1美元=8.22元人民币。4月30日的市场汇率为1美元=8.23元人民币。该外币债务4月份所发生的汇兑损失为（　）万元人民币。", "a": ["10", "5", "-5", "-10", "", ""], "r": "B", "e": "3 月 20 日形成 500 万美元债务，3 月末按当日汇率折算记账。4 月汇兑损益 = 500×（8.23 - 8.22）= 5 万元人民币，汇率上升，负债增加，产生汇兑损失。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435400", "t": 1, "q": "下列明细分类账户中，可以采用数量金额式的是（　）明细分类账。", "a": ["库存商品", "长期待摊费用", "管理费用", "应付账款", "", ""], "r": "A", "e": "数量金额式明细分类账适用于既要进行金额核算，又要进行数量核算的账户。库存商品需要核算数量和金额，符合要求。长期待摊费用、管理费用一般用多栏式，应付账款用三栏式。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435401", "t": 1, "q": "企业以发行权益性证券取得的长期股权投资，不构成企业合并的情况下，应当按照发行权益性证券的（　）作为初始投资成本。", "a": ["支付的相关税费", "账面价值", "公允价值", "市场价格", "", ""], "r": "C", "e": "在不构成企业合并时，以发行权益性证券取得长期股权投资，按发行权益性证券的公允价值确定初始投资成本。这是会计准则的规定，能反映真实交易情况和经济实质。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435402", "t": 1, "q": "现金流量表中，支付给职工以及为职工支付的现金属于？", "a": ["经营活动产生的现金流量", "投资活动产生的现金流量", "筹资活动产生的现金流量", "以上都不对", "", ""], "r": "A", "e": "支付给职工以及为职工支付的现金是企业日常经营中的常见支出，与企业经营活动密切相关，属于经营活动产生的现金流量。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435403", "t": 1, "q": "2008年1月1日，A公司取得专门借款1500万元直接用于当日开工建造的一栋办公楼，年利率为5％，当日另借入了一笔600万元的一般借款，年利率为6％。2008年累计发生建造支出1400万元，2009年1月1日发生建造支出500万元。A公司的有关建造支出均以上述款项支付（A公司无其他一般借款），按季计算利息费用资本化金额。不考虑其他因素，2009年第一季度该公司应予资本化的借款利息费用为（　）万元。", "a": ["6", "7.25", "24.75", "18.75", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435404", "t": 1, "q": "出售可供出售金融资产时，应按实际收到的金额，借记\"银行存款\"等科目，按其账面余额，贷记\"可供出售金融资产\"科目，按应从所有者权益中转出的公允价值累计变动额，借记或贷记\"资本公积——其他资本公积\"科目，按其差额，贷记或借记（　）科目。", "a": ["资本公积", "营业外收入", "资产减值损失", "投资收益", "", ""], "r": "D", "e": "出售可供出售金融资产时，上述操作后其差额应计入投资收益。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435405", "t": 1, "q": "某学校于2009年1月份收到财政部门拨入的事业经费2 000 000元。该学校收到该笔款项时，应计入的科目为（　）。", "a": ["上级补助收入", "事业收入", "财政补助收入", "事业基金", "", ""], "r": "C", "e": "财政部门拨入的事业经费应计入财政补助收入。上级补助收入是从主管部门和上级单位取得的非财政补助收入；事业收入是开展专业业务活动及辅助活动取得的收入；事业基金是事业单位拥有的非限定用途的净资产。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435406", "t": 1, "q": "甲企业于2008年10月20日自A客户处收到一笔合同预付款，金额为1,000万元，作为预收账款核算，但按照税法规定，该款项属于当期的应纳税所得额，应计入取得当期应纳税所得额;12月20日，甲企业自B客户处收到一笔合同预付款，金额为2,000万元，作为预收账款核算，按照税法规定，也具有预收性质，不计入当期应税所得，甲企业当期及以后各期适用的所得税税率均为25％，则甲企业就预收账款，下列处理正确的是（　）万元。", "a": ["确认递延所得税资产250", "确认递延所得税负债250", "确认递延所得税资产750", "确认递延所得税资产500", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435407", "t": 1, "q": "企业编制现金流量表时，下列交易或事项中，属于筹资活动产生的现金流量的是？", "a": ["购买子公司少数股权支付的现金", "处置闲置设备收到的现金", "支付生产工人工资", "收到被投资企业分配的现金股利", "", ""], "r": "A", "e": "筹资活动是指导致企业资本及债务规模和构成发生变化的活动。A选项购买子公司少数股权支付现金，涉及企业股权结构和资本变动，属于筹资活动现金流量；B选项处置闲置设备是投资活动；C选项支付生产工人工资是经营活动；D选项收到被投资企业分配现金股利是投资活动。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435408", "t": 1, "q": "下列关于会计要素计量属性中历史成本的表述，正确的是？", "a": ["取得或制造某项财产物资时所实际支付的现金或者现金等价物", "在正常生产经营过程中，以预计售价减去进一步加工成本和销售所必需的预计税金、费用后的净值", "按照当前市场条件，重新取得同样一项资产所需支付的现金或现金等价物金额", "市场参与者在计量日发生的有序交易中，出售一项资产所能收到或者转移一项负债所需支付的价格", "", ""], "r": "A", "e": "历史成本就是取得或制造财产物资时实际支付的现金或现金等价物。B是可变现净值，C是重置成本，D是公允价值。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435409", "t": 1, "q": "某企业2008年12月31日\"固定资产\"账户余额为750万元，\"累计折旧\"账户余额为250万元，\"固定资产减值准备\"账户余额为25万元，\"在建工程\"账户余额为50万元。该企业2008年12月31日资产负债表中\"固定资产\"项目的金额为（　）万元。", "a": ["475", "725", "525", "500", "", ""], "r": "A", "e": "资产负债表中“固定资产”项目应根据“固定资产”账户余额减去“累计折旧”和“固定资产减值准备”后的净额填列，与“在建工程”无关。即750 - 250 - 25 = 475（万元）。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435410", "t": 1, "q": "自用房地产转换为采用公允价值模式计量的投资性房地产，投资性房地产应当按照转换当日的公允价值计量。转换当日的公允价值大于原账面价值的差额通过（　）科目核算。", "a": ["公允价值变动损益", "其他业务收入", "营业外收入", "其他综合收益", "", ""], "r": "D", "e": "自用房地产转为公允价值模式计量的投资性房地产，转换日公允价值大于原账面价值的差额，应计入其他综合收益，这是准则规定，避免虚增利润。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435411", "t": 1, "q": "甲公司于2008年1月1日从证券市场购入乙公司发行在外的股票30000股作为可供出售金融资产，每股支付价款10元，另支付相关费用6000元。2008年12月31日，这部分股票的公允价值为295000元，该价格下跌为正常的价格波动，则甲公司2008年12月31日计入公允价值变动损益科目的金额为（　）元。", "a": ["收益5000", "收益14000", "0", "损失10000", "", ""], "r": "C", "e": "可供出售金融资产公允价值变动计入其他综合收益，而非公允价值变动损益，所以计入公允价值变动损益科目的金额为0。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435412", "t": 1, "q": "某增值税一般纳税人购进农产品一批，支付买价6,000元，装卸费500元，入库前挑选整理费200元，按照税法规定，该购进农产品适用的增值税抵扣税率为13％，该批农产品的采购成本为（　）元。", "a": ["6,500", "5,920", "6,000", "6,100", "", ""], "r": "B", "e": "采购成本是买价扣除可抵扣增值税加上装卸费、挑选整理费。可抵扣增值税=6000×13% = 780元，采购成本=6000 - 780 + 500 + 200 = 5920元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435413", "t": 1, "q": "A公司为建造一条生产线专门于2008年1月1日按面值发行美元公司债券150万美元，年利率为8％，期限为3年，按季计提利息，按年支付利息。工程于2008年1月1日开始实体建造并于当日发生了相关资产支出，预计工期为2年。A公司的记账本位币为人民币，外币业务采用外币业务发生时当日的市场汇率折算，假定相关汇率如下:2008年1月1日，市场汇率为1美元=6.9元人民币，3月31日的市场汇率为1美元=7.1元人民币。不考虑其他因素，则第一季度外币专门借款汇兑差额的资本化金额为（　）万元人民币。", "a": ["29.4", "0", "30", "30.6", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435414", "t": 1, "q": "下列关于分批法的表述，错误的是？", "a": ["适用于单件、小批生产的企业", "成本计算期与产品生产周期不一致", "需要按产品批别开设成本计算单", "一般不存在完工产品与在产品之间分配费用的问题", "", ""], "r": "B", "e": "分批法成本计算期与产品生产周期一致，B选项表述错误。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435415", "t": 1, "q": "（　）不属于流动负债。", "a": ["短期借款", "应付账款", "一年内到期的长期负债", "预付账款", "", ""], "r": "D", "e": "流动负债是指在一年或超过一年的一个营业周期内偿还的债务。预付账款是资产，代表预先支付给供应商的款项，不是负债。而短期借款、应付账款、一年内到期的长期负债都属于流动负债。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435416", "t": 1, "q": "资产负债表中，\"存货\"项目不包括的内容是？", "a": ["发出商品", "工程物资", "在途物资", "委托加工物资", "", ""], "r": "B", "e": "存货是企业日常活动中持有以备出售的产成品或商品、处在生产过程中的在产品等。工程物资是用于建造固定资产等工程的物资，不属于存货范畴。发出商品、在途物资、委托加工物资都属于存货。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435417", "t": 1, "q": "某大学当年取得事业收入10,000元，取得债券利息收入1,000元，发生事业支出9,000元;收到拨入专款1,600元，发生专款支出1,400元。该大学当年的事业结余为（　）元。", "a": ["1,000", "2,000", "5,500", "1,200", "", ""], "r": "B", "e": "事业结余=事业收入 + 其他收入（本题中债券利息收入） - 事业支出，即10000 + 1000 - 9000 = 2000元，专款收支不影响事业结余。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435418", "t": 1, "q": "《企业会计准则》要求企业对于已经发生的交易或者事项，应当及时进行会计确认、计量和报告，不得提前或者延后，这体现的会计信息质量要求是？", "a": ["相关性", "谨慎性", "可靠性", "及时性", "", ""], "r": "D", "e": "题干强调交易或事项要及时确认、计量和报告，不得提前或延后，这符合及时性的会计信息质量要求。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435419", "t": 1, "q": "下列属于资产类会计科目的是（　）", "a": ["其他应付款", "预付账款", "应付账款", "预收账款", "", ""], "r": "B", "e": "资产类科目是反映资产增减变动的科目。预付账款是预先支付款项，未来会获得相应资产，属于资产类。而其他应付款、应付账款、预收账款都属于负债类科目。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435420", "t": 1, "q": "下列固定资产中，不应计提折旧的有（　）。", "a": ["大修理停用的设备", "因季节性原因停工的固定资产", "企业经营租出的固定资产", "正在改扩建的固定资产", "", ""], "r": "D", "e": "大修理、季节性停工及经营租出的固定资产都应正常计提折旧，而正在改扩建的固定资产已转入在建工程，不计提折旧。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435421", "t": 1, "q": "下列有关或有事项的表述中，错误的是（　）。", "a": ["待执行合同变为亏损合同时，不一定就确认预计负债", "或有负债在一定条件下可以转化为预计负债", "或有负债包括或有事项产生的潜在义务", "或有事项的结果只能由未来不确定事件的发生或不发生予以证实", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435422", "t": 1, "q": "下列关于利润表的说法，正确的是？", "a": ["利润表主要反映企业的经营成果", "利润表是反映企业在某一特定日期财务状况的报表", "利润表属于静态报表", "利润表按权责发生制基础编制", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435423", "t": 1, "q": "（　）是对会计要素的具体内容进行分类核算的项目。", "a": ["会计报表", "会计分录", "会计账户", "会计科目", "", ""], "r": "D", "e": "会计科目是对会计要素具体内容进行分类核算的项目。会计报表是反映企业财务状况和经营成果等的书面文件；会计分录是记录经济业务应借应贷方向、科目和金额的记录；会计账户是根据会计科目设置的，具有一定格式和结构，用于分类反映会计要素增减变动情况及其结果。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435424", "t": 1, "q": "资产负债表中，\"长期股权投资\"项目应根据\"长期股权投资\"科目的期末余额减去（　）后的净额填列。", "a": ["长期股权投资减值准备", "资产减值损失", "坏账准备", "累计折旧", "", ""], "r": "A", "e": "资产负债表中“长期股权投资”项目要以净额列示，应减去其减值准备。资产减值损失是损益类科目；坏账准备针对应收款项；累计折旧针对固定资产。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435425", "t": 1, "q": "下列会计科目中，属于负债类科目的是（　）", "a": ["应付职工薪酬", "长期股权投资", "实收资本", "应收账款", "", ""], "r": "A", "e": "负债类科目是反映企业负债的科目。A选项应付职工薪酬是企业应支付给职工的报酬，属于负债；B选项长期股权投资是资产；C选项实收资本是所有者权益；D选项应收账款是资产。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435426", "t": 1, "q": "现金流量表中，“支付给职工以及为职工支付的现金”项目不包括？", "a": ["支付给在建工程人员的工资", "支付给生产工人的工资", "为职工缴纳的社会保险费", "支付给管理人员的奖金", "", ""], "r": "A", "e": "“支付给职工以及为职工支付的现金”核算的是经营活动中为职工的现金支出，在建工程人员工资属于投资活动相关支出，不包含在此项目。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435427", "t": 1, "q": "W公司到2008年8月15日欠中国银行本息1000万元，逾期未归还，中国银行于2008年8月17日提起诉讼，W公司很可能败诉，支付的罚息在80万元到100万元之间，至2008年12月31日，法院尚未判决，则W公司在2008年年末应确认的预计负债为（　）万元。", "a": ["90", "65", "80", "100", "", ""], "r": "A", "e": "当所需支出存在一个连续范围，且该范围内各种结果发生的可能性相同，预计负债应按照该范围内的中间值确定。本题罚息在80万元到100万元之间，所以预计负债=（80 + 100）÷ 2 = 90万元。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435428", "t": 1, "q": "某上市公司2007年度财务报告于2008年2月10日编制完成，注册会计师完成审计及签署审计报告日是2008年4月10日，经董事会批准报表对外公布的日期是4月20日，股东大会召开日期是4月28日，按照准则规定，资产负债表日后事项的涵盖期间为（　）。", "a": ["2008年2月10日至2008年4月28日", "2008年1月1日至2008年4月20日", "2008年1月1日至2008年2月10日", "2008年2月10日至2008年4月25日", "", ""], "r": "B", "e": "资产负债表日后事项涵盖期间是自资产负债表日次日起至财务报告批准报出日止，本题中资产负债表日是2007年12月31日，财务报告批准报出日是4月20日，所以涵盖期间是2008年1月1日至2008年4月20日。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435429", "t": 1, "q": "2007年3月1日A公司购入M公司25％的股权，成本为150万元，2007年12月31日长期股权投资的可收回金额为130万元，因此A公司计提了长期股权投资减值准备20万元，2008年12月31日该项长期股权投资的可收回金额为160万元，则2008年年末A公司应恢复长期股权投资减值准备（　）万元。", "a": ["20", "10", "30", "0", "", ""], "r": "D", "e": "长期股权投资减值准备一经计提，不得转回。所以2008年年末虽可收回金额高于账面价值，也不能恢复减值准备。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435430", "t": 1, "q": "在下列项目中，与\"制造费用\"属于同一类科目的是（　）。", "a": ["生产成本", "固定资产", "其他业务成本", "主营业务成本", "", ""], "r": "A", "e": "“制造费用”属于成本类科目。选项A“生产成本”是成本类科目；B“固定资产”是资产类科目；C“其他业务成本”和D“主营业务成本”是损益类科目。所以与“制造费用”同类的是“生产成本”。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435431", "t": 1, "q": "采用分步法核算产品成本时，若采用逐步综合结转分步法，需要进行成本还原的原因是？", "a": ["不能准确计算最终完工产品成本", "无法准确计算各步骤半成品成本", "各步骤半成品成本结转方式导致无法反映产品成本原始构成", "各步骤成本计算单格式不同", "", ""], "r": "C", "e": "逐步综合结转分步法是将上一步骤半成品成本综合转入下一步骤，这样在最终产品成本中，各成本项目被综合在一起，不能反映产品成本原始构成，所以要进行成本还原。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435432", "t": 1, "q": "下列项目中，不属于企业职工范围的是（　）。", "a": ["临时职工", "为企业提供审计服务的注册会计师", "内部审计委员会成员", "监事会成员", "", ""], "r": "B", "e": "企业职工是与企业订立劳动合同的所有人员，含全职、兼职和临时职工等，以及虽未订立劳动合同但由企业正式任命的人员。注册会计师为企业提供审计服务，并非企业职工。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435433", "t": 1, "q": "某公司职工刘某预支差旅费8000元，财会部门以现金支付。下列会计分录正确的是（　）。", "a": ["借:其他应收款——刘某 8 000<br />贷:库存现金 8 000", "借:其他应收款——刘某 8 000<br />贷:现金 8 000", "借:应收账款——刘某 8 000<br />贷:库存现金 8 000", "借:管理费用 8 000<br />贷:库存现金 8 000", "", ""], "r": "A", "e": "预支差旅费应计入“其他应收款”，库存现金科目现行规范表述是“库存现金”。A选项分录正确，B中“现金”表述不规范，C应是“其他应收款”非“应收账款”，D预支差旅费不是直接计入管理费用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435434", "t": 1, "q": "某投资企业于20×8年1月1日取得联营企业30％的股权，取得投资时被投资单位的固定资产公允价值为1000万元，账面价值为1500万元，固定资产的预计使用年限为10年，净残值为零，按照直线法计提折旧。被投资单位20×8年度利润表中净利润为500万元。被投资单位当期利润表中已按其账面价值计算扣除的固定资产折旧费用为150万元，按照取得投资时点上固定资产的公允价值计算确定的折旧费用为100万元，假定不考虑所得税影响，那么20×8年末投资方应确认投资收益为（　）万元。", "a": ["100", "165", "160", "150", "", ""], "r": "B", "e": "需按公允价值调整被投资单位净利润，再根据持股比例计算投资收益。被投资单位按账面价值算的折旧多了50万元（150 - 100），应调增净利润，即调整后净利润为550万元（500+50），投资方持股30%，投资收益为165万元（550×30%）。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435435", "t": 1, "q": "事业单位年终结账后，应无余额的科目是（　）。", "a": ["事业基金", "固定基金", "结余分配", "专用基金", "", ""], "r": "C", "e": "事业单位年终结账时，“结余分配”科目要将当年的结余进行分配，分配后无余额。而事业基金、固定基金、专用基金一般会有余额。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435436", "t": 1, "q": "现金流量表中，处置固定资产收到的现金属于？", "a": ["经营活动产生的现金流量", "投资活动产生的现金流量", "筹资活动产生的现金流量", "不涉及现金流量的业务", "", ""], "r": "B", "e": "处置固定资产属于企业的投资活动，所以处置固定资产收到的现金属于投资活动产生的现金流量。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435437", "t": 1, "q": "事业单位对财政直接支付方式购置固定资产的账务处理，不涉及的会计科目是（　）。", "a": ["财政补助收入", "拨入经费", "事业支出", "固定基金", "", ""], "r": "B", "e": "“拨入经费”是行政单位核算财政拨款的科目，事业单位购置固定资产用财政直接支付，涉及财政补助收入、事业支出、固定基金。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435438", "t": 1, "q": "《企业会计准则》中，企业对交易或者事项进行会计确认、计量和报告应当保持应有的谨慎，不应高估资产或者收益、低估负债或者费用，这体现的会计信息质量要求是？", "a": ["谨慎性", "重要性", "实质重于形式", "可理解性", "", ""], "r": "A", "e": "题干描述的“不应高估资产或收益、低估负债或费用”正是谨慎性会计信息质量要求的体现。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435439", "t": 1, "q": "采用分步法计算产品成本时，若采用平行结转分步法，各步骤费用在最终完工产品与广义在产品之间分配的关键是确定？", "a": ["约当产量", "生产工时", "单位成本", "分配率", "", ""], "r": "A", "e": "平行结转分步法下，各步骤费用在最终完工产品与广义在产品之间分配，要先计算约当产量，它是分配费用的基础。有了约当产量才能进一步计算分配率等。所以关键是确定约当产量。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435440", "t": 1, "q": "2009年1月1日，A公司将某项专利权的使用权转让给B公司，每年收取租金22.50万元，转让期为2年，转让期间A公司不使用该项专利。假定出租无形资产适用的营业税税率为5％。该专利权系A公司2008年1月1日购入的，初始入账价值为150万元，预计使用年限为10年。该无形资产按直线法摊销。假定不考虑其他因素，A公司2009年度因该专利权影响营业利润的金额为（　）万元。", "a": ["21.38", "7.50", "6.38", "22.50", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435441", "t": 1, "q": "一般说来会计主体与法律主体是（　）。", "a": ["相互可替代的", "不相关的", "有区别的", "相互一致的", "", ""], "r": "C", "e": "会计主体不一定是法律主体，法律主体一定是会计主体，二者有区别。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435442", "t": 1, "q": "甲公司2007年12月31日应收账款余额为200万元，“坏账准备”科目贷方余额为5万元;2008年发生坏账8万元，已核销的坏账又收回2万元。2008年12月31日应收账款余额为120万元（其中未到期应收账款为40万元，估计损失2%;过期1个月应收账款为30万元，估计损失3%;过期2个月的应收账款为20万元，估计损失5%;过期3个月的应收账款为20万元，估计损失8%;过期3个月以上应收账款为10万元，估计损失15%），假设不存在其他应收款项。甲公司2008年应提取的坏账准备为（　）万元。", "a": ["2", "5.8", "8", "6.8", "", ""], "r": "D", "e": "先算2008年末坏账准备应有余额：40×2% + 30×3% + 20×5% + 20×8% + 10×15% = 5.8万元。2008年发生坏账8万元使坏账准备减少8万，收回已核销坏账2万元使坏账准备增加2万，年初坏账准备贷方余额5万，所以当期应提坏账准备=5.8 -（5 - 8 + 2）= 6.8万元。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435443", "t": 1, "q": "在借贷记账法下，“累计折旧”账户的结构特点是？", "a": ["借方登记减少额，贷方登记增加额，期末无余额", "借方登记减少额，贷方登记增加额，期末余额在贷方", "借方登记增加额，贷方登记减少额，期末余额在借方", "借方登记增加额，贷方登记减少额，期末无余额", "", ""], "r": "B", "e": "“累计折旧”是资产类备抵账户，其结构与一般资产类账户相反，即借方登记减少额，贷方登记增加额，期末有余额且在贷方。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435444", "t": 1, "q": "最适合用于登记存货的账簿是（　）。", "a": ["数量金额式账簿", "三栏式账簿", "两栏式账簿", "多栏式账簿", "", ""], "r": "A", "e": "存货核算需要同时记录数量和金额，数量金额式账簿能满足这一需求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435445", "t": 1, "q": "采用分步法核算产品成本时，若各步骤半成品不通过半成品库收发，其成本结转方式是？", "a": ["平行结转分步法", "顺序结转分步法", "逐步分项结转分步法", "逐步综合结转分步法", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435446", "t": 1, "q": "S企业于2008年12月31日购入一栋写字楼，并于当日对外出租，采用公允价值模式进行后续计量，成本为1200万元，税法上对该写字楼采用直线法计提折旧，预计使用年限为20年，预计净残值为零。2009年末，其公允价值为1600万元。S企业适用的所得税税率为25％，假定税法规定投资性房地产公允价值的变动不计入应纳税所得额。期末该投资性房地产产生的所得税影响为（　）万元。", "a": ["确认递延所得税负债460", "不需确认递延所得税资产或递延所得税负债", "确认递延所得税负债115", "确认递延所得税资产115", "", ""], "r": "C", "e": "投资性房地产按公允价值计量，2009年末账面价值1600万；税法按直线法折旧，计税基础=1200 - 1200÷20 = 1140万。账面价值大于计税基础产生应纳税暂时性差异，金额为1600 - 1140 = 460万，应确认递延所得税负债460×25% = 115万。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435447", "t": 1, "q": "企业购进资产发生的下列相关税金中，不应计入资产取得成本的是（　）。", "a": ["进口商品支付的关税", "签订购买合同缴纳的印花税", "收购未税矿产品代扣代缴的资源税", "一般纳税企业购进固定资产支付的增值税", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435448", "t": 1, "q": "企业销售商品时，如果没有将商品所有权上的风险和报酬转移给购货方，即使已经将商品交付给购货方，也不应当确认销售收入，体现了会计信息质量（　）的基本要求。", "a": ["相关性", "谨慎性", "重要性", "实质重于形式", "", ""], "r": "D", "e": "实质重于形式要求企业按照交易或事项的经济实质进行会计核算，而非仅依据法律形式。本题中虽商品交付，但所有权风险和报酬未转移，不确认收入，遵循实质重于形式。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435449", "t": 1, "q": "借贷记账法的记账规则是（　）", "a": ["一借多贷", "一借一贷", "多借一贷", "有借必有贷，借贷必相等", "", ""], "r": "D", "e": "借贷记账法的核心规则就是“有借必有贷，借贷必相等”，它体现了借贷记账法的基本原理和记账要求。A、B、C选项只是借贷记账法下的具体账户对应形式。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435450", "t": 1, "q": "下列项目中，属于货币性资产的是（　）。", "a": ["持有至到期投资", "交易性金融资产", "投资性房地产", "长期股权投资", "", ""], "r": "A", "e": "货币性资产是指企业持有的货币资金和将以固定或可确定的金额收取的资产。持有至到期投资未来可收回的金额固定或可确定，属于货币性资产。而交易性金融资产、投资性房地产、长期股权投资未来收回金额不固定也不可确定，不属于货币性资产。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435451", "t": 1, "q": "某单位购入设备一台，价款100万元，用银行存款支付60万元，另40万元则签发了商业汇票。对这一经济业务，单位应编制的记账凭证为（　）。", "a": ["编制一张转账凭证和一张付款凭证", "编制一张转账凭证", "编制一张收款凭证", "编制一张付款凭证", "", ""], "r": "A", "e": "用银行存款支付60万元，涉及银行存款减少，应编制付款凭证；签发商业汇票支付40万元，不涉及现金和银行存款，应编制转账凭证。所以应编制一张转账凭证和一张付款凭证。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435452", "t": 1, "q": "下列关于会计要素中资产的表述，正确的是（　）", "a": ["资产只能是企业拥有的经济资源", "资产是由企业过去的交易或者事项形成的", "资产预期不会给企业带来经济利益", "资产必须具有实物形态", "", ""], "r": "B", "e": "资产是由企业过去的交易或事项形成的、由企业拥有或控制的、预期会给企业带来经济利益的资源，不一定有实物形态。A选项“只能是拥有”错误，还可以控制；C选项“不会带来经济利益”错误；D选项“必须有实物形态”错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435453", "t": 1, "q": "企业将融资租入固定资产按自有固定资产的折旧方法计提折旧，遵循的是（　）要求。", "a": ["谨慎性", "实质重于形式", "重要性", "可比性", "", ""], "r": "B", "e": "融资租入固定资产从法律形式看企业不拥有所有权，但从经济实质看能控制该资产并从中获益，按自有资产折旧体现实质重于形式。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435454", "t": 1, "q": "科目汇总表账务处理程序的特点是（　）。", "a": ["根据汇总记账凭证登记总分类账", "根据科目汇总表登记总分类账", "根据记账凭证逐笔登记日记总账", "根据记账凭证直接登记总分类账", "", ""], "r": "B", "e": "科目汇总表账务处理程序，就是先将记账凭证定期汇总编制成科目汇总表，然后根据科目汇总表登记总分类账。A选项是汇总记账凭证账务处理程序特点；C选项表述错误；D选项是记账凭证账务处理程序特点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435455", "t": 1, "q": "会计政策变更时，会计处理方法的选择应遵循的原则是（　）。", "a": ["在追溯调整法和未来适用法中任选其一", "会计政策变更累积影响数可以合理确定时采用追溯调整法，不能合理确定时采用未来适用法", "必须采用追溯调整法", "必须采用未来适用法", "", ""], "r": "B", "e": "会计政策变更时，若累积影响数能合理确定，用追溯调整法；不能合理确定，用未来适用法。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435456", "t": 1, "q": "下列项目中，会影响企业利润表中\"营业利润\"的是？", "a": ["固定资产盘盈", "计提存货跌价准备", "接受捐赠利得", "取得的政府补助", "", ""], "r": "B", "e": "营业利润受日常经营活动影响，计提存货跌价准备属于日常经营中的资产减值损失，影响营业利润。固定资产盘盈计入以前年度损益调整；接受捐赠利得和政府补助通常计入营业外收入，不影响营业利润。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435457", "t": 1, "q": "某企业存货的可变现净值以外币确定，在确定存货的期末价值时，需要将存货可变现净值折算为记账本位币，对于折算后的金额小于成本的差额应计入（　）。", "a": ["资产减值损失", "公允价值变动损益", "营业外收入", "财务费用", "", ""], "r": "A", "e": "存货可变现净值折算后小于成本，意味着存货发生了减值，存货减值应计入资产减值损失。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435458", "t": 1, "q": "下列各项中，属于让渡资产使用权收入的是（　）。", "a": ["利息收入", "出售固定资产获得的收入", "转让无形资产所有权获得的收入", "出售原材料获得的收入", "", ""], "r": "A", "e": "让渡资产使用权收入主要包括利息收入、使用费收入等。B选项出售固定资产是处置资产；C选项转让无形资产所有权也是资产处置；D选项出售原材料是销售商品。而A选项利息收入属于让渡资产使用权收入。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435459", "t": 1, "q": "下列关于会计等式\"资产=负债+所有者权益\"的表述，错误的是？", "a": ["表明企业的资产归属", "是复式记账法的理论基础", "反映企业某一特定时点的财务状况", "是编制利润表的理论依据", "", ""], "r": "D", "e": "“资产 = 负债 + 所有者权益”是反映财务状况的等式，用于编制资产负债表；编制利润表的理论依据是“收入 - 费用 = 利润”。所以该题答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435460", "t": 1, "q": "下列未达账项中，会使本企业\"银行存款日记账账面余额\"大于银行对账单的有（　）", "a": ["企业已付、银行未付款", "企业已收、银行未收款", "银行已付、企业未付款", "银行已收、企业未收款", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435461", "t": 1, "q": "如商品的售价内包含可区分的在售后一定期限内提供相关服务的服务费，在销售商品时，收到的该项服务费应计入（　）科目。", "a": ["主营业务收入", "预收账款", "其他业务收入", "营业外收入", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435462", "t": 1, "q": "以下所列费用项目，属于间接生产费用的是（　）。", "a": ["机器设备动力费", "机器设备折旧费", "车间设备修理人员工资费", "原材料费", "", ""], "r": "C", "e": "间接生产费用是与生产工艺没有直接联系、不能直接计入产品成本的费用。选项A、B、D都与产品生产直接相关，可直接计入产品成本。而车间设备修理人员工资费不直接参与产品生产，属于间接生产费用。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435463", "t": 1, "q": "甲企业5月10日购买A股票作为交易性金融资产，支付的全部价款为50万元，其中包括已宣告但尚未领取的现金股利1万元。5月20日收到现金股利。6月2日将A股票售出，出售价款52万元。如果该企业没有其他有关投资的业务，应计入现金流量表中\"收回投资收到的现金\"项目的金额为（　）万元。", "a": ["50", "49", "52", "51", "", ""], "r": "C", "e": "“收回投资收到的现金”反映企业出售、转让或到期收回除现金等价物以外的交易性金融资产等收到的现金。出售价款52万元就是收回投资收到的现金。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435464", "t": 1, "q": "下列不属于工业企业成本项目的是（　）。", "a": ["制造费用", "直接人工", "折旧费", "燃料及动力", "", ""], "r": "C", "e": "工业企业成本项目通常有直接材料、直接人工、制造费用、燃料及动力等，折旧费一般是计入制造费用等项目，它本身不属于独立的成本项目。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435465", "t": 1, "q": "库存现金的清查应采用的方法是（　）。", "a": ["查询核实法", "技术分析法", "实地盘点法", "对账单法", "", ""], "r": "C", "e": "库存现金是实物资产，清查库存现金需通过实地清点现金数量来确定其实际数额，所以采用实地盘点法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435466", "t": 1, "q": "下列哪项不是记账凭证的基本要素（　）。", "a": ["单位负责人签章", "交易或事项涉及的会计科目、记账方向及金额", "记账凭证的名称、日期、编号及经济业务摘要", "记账标记及原始凭证附件", "", ""], "r": "A", "e": "记账凭证基本要素一般有会计科目、记账方向及金额，名称、日期、编号及业务摘要，记账标记和附件等。单位负责人签章不是记账凭证基本要素。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435467", "t": 1, "q": "《企业会计准则》要求企业对相同或者相似的交易或者事项，应当采用一致的会计政策，不得随意变更，体现的会计信息质量要求是？", "a": ["可比性", "谨慎性", "重要性", "及时性", "", ""], "r": "A", "e": "可比性要求企业提供的会计信息应当具有可比性，同一企业不同时期发生的相同或相似交易事项，应采用一致会计政策，不得随意变更。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435468", "t": 1, "q": "在借贷记账法下，“累计摊销”账户的结构特点是？", "a": ["借方登记增加额，贷方登记减少额，期末无余额", "借方登记减少额，贷方登记增加额，期末无余额", "借方登记减少额，贷方登记增加额，期末余额在贷方", "借方登记增加额，贷方登记减少额，期末余额在借方", "", ""], "r": "C", "e": "“累计摊销”是资产类备抵账户，备抵账户与所调整账户结构相反，资产类账户借方记增加，贷方记减少，所以“累计摊销”借方登记减少额，贷方登记增加额，余额在贷方。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435469", "t": 1, "q": "根据《企业会计准则第2号——长期股权投资》的规定，长期股权投资采用权益法核算时，下列各项最终不会引起长期股权投资账面价值变动的是（　）。", "a": ["被投资单位发生净亏损", "被投资单位持有的可供出售权益工具的公允价值上升", "被投资单位宣告发放现金股利", "被投资单位计提盈余公积", "", ""], "r": "D", "e": "权益法下，被投资单位所有者权益变动会影响长期股权投资账面价值。A被投资单位净亏损会使所有者权益减少，长期股权投资账面价值降低；B可供出售权益工具公允价值上升，被投资单位其他综合收益增加，所有者权益增加，长期股权投资账面价值增加；C被投资单位宣告发放现金股利，所有者权益减少，长期股权投资账面价值降低；D被投资单位计提盈余公积是所有者权益内部变动，总额不变，不影响长期股权投资账面价值。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435470", "t": 1, "q": "企业发生的下列经济业务中，会导致资产和负债同时增加的是？", "a": ["从银行借入短期借款", "以银行存款偿还前欠货款", "收到投资者投入的设备", "用银行存款购买原材料", "", ""], "r": "A", "e": "A选项，从银行借入短期借款，银行存款（资产）增加，短期借款（负债）增加；B选项是资产和负债同时减少；C选项是资产和所有者权益同时增加；D选项是资产内部一增一减。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528647301435471", "t": 1, "q": "甲公司的投资性房地产采用成本模式计量。2008年4月25日，甲公司将一项投资性房地产转换为固定资产。转换时该投资性房地产的账面余额为240万元，已提折旧40万元，已经计提的减值准备为20万元。该投资性房地产的公允价值为150万元。转换日固定资产的账面价值为（　）万元。", "a": ["180", "200", "240", "150", "", ""], "r": "A", "e": "成本模式下投资性房地产转换为固定资产，应按账面价值结转。账面价值=账面余额 - 已提折旧 - 减值准备，即240 - 40 - 20 = 180万元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188672", "t": 2, "q": "采用平行结转分步法，各步骤生产费用在最终完工产品与广义在产品之间分配时，广义在产品包括哪些？", "a": ["本步骤已完工但尚未最终完工的半成品", "最终完工的产成品", "后续步骤正在加工的在产品", "本步骤正在加工的在产品", "", ""], "r": "ACD", "e": "广义在产品是指各步骤尚未加工完成的在产品和各步骤已完工但尚未最终完成的产品。本步骤正在加工的在产品、后续步骤正在加工的在产品以及本步骤已完工但尚未最终完工的半成品都属于广义在产品，而最终完工的产成品不属于广义在产品。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188673", "t": 2, "q": "下列各项中，影响企业利润表\"所得税费用\"项目金额的有（　）。", "a": ["因可供出售金融资产公允价值上升而确认的递延所得税负债", "因对存货计提存货跌价准备而确认的递延所得税资产", "当期确认的应交所得税", "因交易性金融资产公允价值上升而确认的递延所得税负债", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188674", "t": 2, "q": "下列组织可以作为一个会计主体进行会计核算的有（　）", "a": ["分公司", "企业集团", "子公司", "民间非营利组织", "", ""], "r": "ABCD", "e": "会计主体是指会计工作服务的特定对象。分公司、子公司能独立进行会计核算；企业集团由多个企业组成，可作为一个整体核算；民间非营利组织也需进行会计核算。ABCD选项都可作为会计主体。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188675", "t": 2, "q": "资产负债表中，可直接根据总账科目余额填列的项目有？", "a": ["资本公积", "短期借款", "实收资本", "货币资金", "", ""], "r": "ABC", "e": "资本公积、短期借款、实收资本可直接根据对应总账科目余额填列，货币资金需根据“库存现金”“银行存款”“其他货币资金”总账科目余额合计数填列。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188676", "t": 2, "q": "会计科目按其核算详细程度不同，可以分为（　）。", "a": ["资产类科目", "总分类科目", "子目", "明细科目", "", ""], "r": "BD", "e": "会计科目按核算详细程度不同，分为总分类科目和明细科目。子目是明细科目的一种具体说法。资产类科目是按经济内容分类。所以答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188677", "t": 2, "q": "下列各项中，属于债务重组修改其他债务条件的方式一般有（　）。", "a": ["延长债务偿还期限并加收展期利息", "减少本金", "免除积欠利息", "债务转为资本", "", ""], "r": "ABC", "e": "修改其他债务条件是指除了以资产清偿、债务转为资本之外改变债务条件的重组方式。A延长债务期限且加收展期利息改变了债务条件；B减少本金、C免除积欠利息也改变了债务的金额等条件。而D债务转为资本是单独的一种债务重组方式，不属于修改其他债务条件。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188678", "t": 2, "q": "下列有关特殊的劳务交易确认收入的表述中，正确的有（　）。", "a": ["申请入会费和会员费只允许取得会籍，所有其他服务或商品都要另行收费的，在款项收回不存在重大不确定性时确认收入", "属于提供初始及后续服务的特许权费，在提供服务时确认收入", "包括在商品售价内可区分的服务费，在提供服务的期间内分期确认收入", "广告的制作费，在资产负债表日根据制作广告的完工进度确认收入", "", ""], "r": "ABCD", "e": "ABCD选项分别符合不同特殊劳务交易收入确认的规定。A选项申请入会费和会员费仅取得会籍且其他另行收费，款项收回无重大不确定时确认收入；B选项特许权费提供服务时确认；C选项商品售价内可区分服务费在服务期分期确认；D选项广告制作费按完工进度在资产负债表日确认。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188679", "t": 2, "q": "下列情形中，表明存货的可变现净值为零的情况有（　）。", "a": ["已霉烂变质的存货", "已过期但仍有转让价值的存货", "生产中已不再需要，并且已无使用价值和转让价值的存货", "其他足以证明已无使用价值和转让价值的存货", "", ""], "r": "ACD", "e": "存货可变现净值为零就是存货没有任何使用和转让价值了。A霉烂变质、C生产不再需要且无使用和转让价值、D足以证明无使用和转让价值，都符合；B有转让价值，可变现净值不是零。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188680", "t": 2, "q": "下列资产中，属于本企业资产范围的有（　）。", "a": ["融资租入设备", "经营租赁方式租出设备", "盘亏的存货", "经营租赁方式租入设备", "", ""], "r": "AB", "e": "融资租入设备实质已控制应确认为企业资产；经营租赁租出设备企业仍拥有所有权是企业资产；盘亏存货已不属于企业；经营租赁租入设备企业无所有权和控制权不是企业资产。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188681", "t": 2, "q": "下列各项中，对原始凭证的处理正确的是（　）。", "a": ["对于真实、合法、合理，但内容不够完整、填写有错误的原始凭证，应退回给有关经办人员", "对于完全符合要求的原始凭证，应当及时编制记账凭证入账", "对于不真实、不合法的原始凭证，会计机构和会计人员有权不予接受，并向单位负责人报告", "对于不真实、不合法的原始凭证，会计机构和会计人员有权不予接受，但不一定要向单位负责人报告", "", ""], "r": "ABC", "e": "A选项，内容不完整、填写有误的原始凭证退回经办人员完善；B选项，符合要求的原始凭证及时编制记账凭证入账；C选项，不真实不合法的原始凭证，会计机构和人员应不予接受并报告单位负责人；D错误，必须向单位负责人报告。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188682", "t": 2, "q": "当期发生的下列事项中，不影响当期损益的有（　）。", "a": ["在建工程领用原材料所负担的增值税", "购买固定资产所支付的车辆购置税", "在建工程试运营过程中所取得的收入", "工程项目达到预定可使用状态后全部报废所发生的损失", "", ""], "r": "AB", "e": "A选项，在建工程领用原材料所负担的增值税按规定处理，不影响损益；B选项，车辆购置税计入固定资产成本，不影响当期损益；C选项，在建工程试运营收入冲减在建工程成本，影响损益；D选项，工程项目报废损失计入营业外支出，影响损益。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188683", "t": 2, "q": "下列各个项目中，属于非货币性资产的有（　）。", "a": ["存货", "预付账款", "可供出售金融资产", "准备持有至到期的债权投资", "", ""], "r": "ABC", "e": "非货币性资产是指货币性资产以外的资产，其未来现金流量金额、时间不固定或不确定。准备持有至到期的债权投资未来现金流量固定，属于货币性资产。存货、预付账款、可供出售金融资产未来现金流量不固定，属于非货币性资产。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188684", "t": 2, "q": "下列各项中，可能构成长期股权投资初始投资成本的有（　）。", "a": ["非同一控制下企业合并形成的长期股权投资，以溢价发行权益性证券作为对价发生的手续费", "非同一控制下企业合并取得长期股权投资而作为对价的权益性证券的公允价值", "非企业合并方式下取得长期股权投资发生的直接相关费用", "非同一控制下企业合并形成的长期股权投资发生的审计费", "", ""], "r": "BC", "e": "非同一控制下企业合并，发行权益性证券手续费冲减资本公积，不构成初始投资成本，A 错；作为对价的权益性证券公允价值是初始投资成本一部分，B 对；非企业合并方式下取得长期股权投资直接相关费用计入初始投资成本，C 对；非同一控制下企业合并审计费计入当期损益，不构成初始投资成本，D 错。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188685", "t": 2, "q": "下列情况中，可以用红色墨水记账的有（　）。", "a": ["在不设借贷等栏的多栏式账页中，登记减少数", "在三栏式账簿的余额栏前，如未印明余额方向的，在余额栏内登记负数余额", "根据国家统一会计制度的规定可以用红字登记的其他会计记录", "按照红字冲账的记账凭证，冲销错误记录", "", ""], "r": "ABCD", "e": "ABCD选项均符合会计中可以用红色墨水记账的规定。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188686", "t": 2, "q": "资产负债表日后发生的调整事项，应当如同资产负债表所属期间发生的事项一样，做出相关账务处理，并对资产负债表日已编制的财务报表作相应的调整。这里的财务报表包括（　）。", "a": ["现金流量表补充资料的内容", "资产负债表", "现金流量表正表", "利润表", "", ""], "r": "BD", "e": "资产负债表日后调整事项要调整资产负债表日已编制的财务报表，包括资产负债表、利润表等，现金流量表正表反映的是企业一定会计期间现金和现金等价物流入和流出，调整事项不调整其正表，现金流量表补充资料内容也不调整。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188687", "t": 2, "q": "下列各项中，不属于内部开发无形资产成本的有（　）。", "a": ["无形资产达到预定用途前发生的可辨认的无效和初始运作损失", "为运行无形资产发生的培训支出", "可直接归属于无形资产研究活动的支出", "可直接归属于无形资产开发活动的支出", "", ""], "r": "ABC", "e": "内部开发无形资产成本是可直接归属于使该资产达到预定用途的支出。A选项的无效和初始运作损失、B选项的培训支出、C选项研究活动支出都不符合这一条件，D选项开发活动支出可计入成本。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188688", "t": 2, "q": "下列资产负债表日后事项中，属于调整事项的有（　）。", "a": ["日后期间因财务困难而与债权人进行的债务重组", "报告年度因未决诉讼确认预计负债40万元，日后期间判决应支付赔偿50万元", "资产负债表日后将报告年度购入的专利权出售", "报告年度销售的存货在日后期间发生了退回", "", ""], "r": "BD", "e": "调整事项是指对资产负债表日已经存在的情况提供了新的或进一步证据的事项。B选项，报告年度已确认预计负债，日后判决结果明确应支付赔偿金额有变化，属于对原事项的进一步证据；D选项，报告年度销售存货日后退回，表明报告年度销售业务存在问题需要调整。A选项债务重组是日后新发生事项；C选项出售专利权也是日后新交易。所以答案是BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188689", "t": 2, "q": "下列固定资产的相关损失项目，通常应计入营业外支出的是（　）。", "a": ["出售固定资产的净损失", "建造过程中的在建工程项目由于正常原因发生的某一单项工程毁损损失", "企业对外捐赠支出", "经批准结转的固定资产盘亏损失", "", ""], "r": "CD", "e": "A选项出售固定资产净损失一般计入资产处置损益；B选项在建工程正常原因单项工程毁损损失计入在建工程成本；C选项对外捐赠支出计入营业外支出；D选项固定资产盘亏损失经批准后计入营业外支出。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188690", "t": 2, "q": "下列关于企业所得税的表述中，正确的有（　）。", "a": ["递延所得税资产的账面价值减记以后，继后期间根据新的环境和情况判断能够产生足够的应纳税所得额利用可抵扣暂时性差异，使递延所得税资产包含的经济利益能够实现的，应恢复递延所得税资产的账面价值", "企业应以转回期间适用的所得税税率（未来的适用税率可以预计）为基础计算确定递延所得税资产", "企业应以当期适用的税率计算确定当期应交所得税", "如果未来期间很可能无法取得足够的应纳税所得额用以利用递延所得税资产的利益，应当减记递延所得税资产的账面价值", "", ""], "r": "ABCD", "e": "ABCD选项均符合企业所得税相关规定。A项，符合递延所得税资产账面价值减记后可恢复的条件；B项，计算递延所得税资产用转回期间适用税率；C项，当期应交所得税按当期适用税率计算；D项，无法取得足够应纳税所得额利用递延所得税资产利益时应减记其账面价值。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188691", "t": 2, "q": "根据《企业会计准则第2号——长期股权投资》的规定，长期股权投资采用成本法核算时，下列各项可能会引起长期股权投资账面价值变动的有（　）。", "a": ["减少投资", "被投资企业宣告发放现金股利", "被投资企业实现净利润", "追加投资", "", ""], "r": "AD", "e": "成本法下，减少投资和追加投资会直接使长期股权投资账面价值变动；被投资企业宣告发放现金股利，投资方计入投资收益，不影响账面价值；被投资企业实现净利润，投资方不做账务处理，不影响账面价值。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188692", "t": 2, "q": "计算一般借款的资本化率时，应考虑的因素有（　）。", "a": ["溢折价的摊销", "借款的利率", "借款本金", "借款的时间", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188693", "t": 2, "q": "下列关于固定资产处置的说法中，正确的有（　）。", "a": ["持有待售的固定资产从划归为持有待售之日起停止计提折旧和减值测试", "固定资产满足\"预期通过使用或处置不能产生经济利益\"时，应予以终止确认", "固定资产出售、转让、报废或毁损的，应将其处置收入扣除账面价值和相关税费后的金额计入当期损益", "企业持有待售的固定资产，应对其预计净残值进行调整，使预计净残值能够反映其公允价值减去处置费用后的金额，但不得超过其账面价值", "", ""], "r": "ABCD", "e": "ABCD选项表述均符合固定资产处置相关规定。A项，持有待售固定资产不再计提折旧和减值测试；B项，不能产生经济利益应终止确认；C项，处置固定资产按规定计算损益；D项，待售固定资产要调整预计净残值。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188694", "t": 2, "q": "下列各项说法中，符合现行会计准则的有（　）。", "a": ["若预计某项无形资产已经不能给企业带来未来经济利益，应当将该项无形资产的账面价值予以转销，其账面价值转做当期损益", "按照谨慎性要求，研究开发支出应在发生时直接计入当期损益", "如果无法可靠确定无形资产的相关经济利益的预期实现方式，该无形资产应当采用直线法摊销", "出租的无形资产，其摊销费用应计入管理费用", "", ""], "r": "AC", "e": "A选项，无形资产不能带来未来经济利益时转销账面价值入当期损益符合准则；B选项，研究阶段支出计当期损益，开发阶段符合条件可资本化，并非都直接计当期损益；C选项，无法确定经济利益预期实现方式时用直线法摊销正确；D选项，出租无形资产摊销应计入其他业务成本而非管理费用。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188695", "t": 2, "q": "下列有关收入的表述中，不正确的有（　）。", "a": ["委托其他单位代销商品情况下，委托方应在收到受托方提供的代销清单时确认收入", "资产的增加或负债的减少，或二者兼而有之，同时引起所有者权益的增加，但不一定表明收入的增加", "如果企业确认商品销售收入后，发生销售退回的均冲减退回当月的销售收入，并冲减当月销售成本", "在商品销售收入确认条件中，所有权上的主要报酬和风险随所有权凭证的转移而转移", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188696", "t": 2, "q": "某工业企业的下列做法中，不违背会计核算可比性要求的有（　）。", "a": ["鉴于本期经营亏损，将已达到预定可使用状态的工程借款的利息支出予以资本化", "鉴于某项固定资产已经改扩建，决定重新确定其折旧年限", "因预计发生年度亏损，将以前年度计提的存货跌价准备全部予以转回", "因客户的财务状况好转，将坏账准备的计提比例由应收账款余额的30％降为15%", "", ""], "r": "BD", "e": "可比性要求会计核算前后各期方法一致，不得随意变更，如需变更应说明。A选项为调节利润资本化利息，C选项因预计亏损转回存货跌价准备，均是为调节利润随意变更，违背可比性；B是固定资产改扩建后合理重新确定折旧年限，D是因客户情况变化合理调整坏账准备计提比例，不违背可比性。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188697", "t": 2, "q": "下列情形，形成控制关系的有（　）。", "a": ["投资单位直接拥有被投资单位50％以上的表决权资本", "投资单位有权任免被投资单位董事会等类似权利机构的多数成员", "投资单位直接拥有被投资单位30％的表决权资本，且投资单位与其他投资者（享有25％股份）达成协议，代表其他投资者行使在被投资单位的权益", "投资单位直接拥有被投资单位50％的表决权资本", "", ""], "r": "ABC", "e": "控制是指投资方拥有对被投资方的权力，通过参与被投资方的相关活动而享有可变回报，并且有能力运用对被投资方的权力影响其回报金额。A选项直接拥有超50%表决权资本能控制；B选项有权任免多数成员可控制；C选项通过协议获得额外权力也能控制。而D选项直接拥有50%表决权资本，一般不能形成控制。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188698", "t": 2, "q": "根据《企业会计准则》，下列属于会计信息质量要求中可比性原则的有？", "a": ["会计信息应清晰明了便于使用者理解", "不同企业发生的相同交易，应采用规定的会计政策", "企业一旦采用某种会计政策不得变更", "同一企业不同时期发生的相同交易，应采用一致会计政策", "", ""], "r": "BD", "e": "可比性原则要求同一企业不同时期可比（采用一致会计政策）和不同企业相同交易可比（采用规定会计政策）。A选项说的是可理解性；C选项企业会计政策在符合条件时可变更。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188699", "t": 2, "q": "在不具有商业实质、涉及补价的非货币性资产交换中，影响换入资产入账价值的因素有（　）。", "a": ["换出资产计提的减值损失", "换出资产支付的相关税费", "换出资产的账面价值", "换出资产收到的补价", "", ""], "r": "BCD", "e": "不具有商业实质且涉及补价的非货币性资产交换，换入资产入账价值=换出资产账面价值+支付的相关税费 - 收到的补价。所以换出资产账面价值、支付相关税费、收到补价会影响换入资产入账价值。换出资产计提的减值损失已反映在账面价值中。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188700", "t": 2, "q": "企业现金流量表中，“支付给职工以及为职工支付的现金”项目，包括的内容有？", "a": ["支付给生产工人的工资", "支付给在建工程人员的工资", "支付给管理人员的奖金", "为职工缴纳的社会保险费", "", ""], "r": "ACD", "e": "“支付给职工以及为职工支付的现金”核算企业实际支付给职工，以及为职工支付的现金，不包括支付给在建工程人员的工资。A生产工人、C管理人员工资奖金及D社保费都在此列。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188701", "t": 2, "q": "下列各项中属于我国财务报告目标的有（　）。", "a": ["向财务报告使用者提供决策有用的信息", "客观地反映企业的财务和经营状况", "反映企业管理层受托责任的履行情况", "与同行业信息作比较", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188702", "t": 2, "q": "下列各项中，会引起资产负债表中固定资产账面价值发生变化的有（　）。", "a": ["计提固定资产减值准备", "融资租入固定资产", "固定资产改扩建", "固定资产大修理的支出", "", ""], "r": "ABC", "e": "A计提减值准备会使账面价值减少；B融资租入固定资产增加固定资产账面价值；C改扩建会使固定资产账面价值增加；D大修理支出一般计入当期损益，不影响账面价值。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188703", "t": 2, "q": "下列各项中，影响资产预计未来现金流量现值的有（　）。", "a": ["资产未来持有期间的公允价值变动", "折现率", "资产的使用寿命", "资产预计未来现金流量", "", ""], "r": "BCD", "e": "资产预计未来现金流量现值与预计未来现金流量、使用寿命和折现率相关，与资产未来持有期间公允价值变动无关。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188704", "t": 2, "q": "关于无形资产后续计量的处理，下列各项正确的有（　）。", "a": ["对于使用寿命不确定的无形资产，如果有证据表明其使用寿命是有限的，应当按照会计估计变更处理", "某项无形资产计提了减值准备，则应对该无形资产的摊销期限作出变更", "对于使用寿命确定的无形资产，如果有证据表明其使用寿命不同于以前估计的，应改变其摊销年限，并按会计估计变更进行处理", "企业有证据表明无形资产的摊销方法不同于以前估计，应改变其摊销方法，并按会计估计变更进行处理", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188705", "t": 2, "q": "采用平行结转分步法计算产品成本时，广义在产品包括？", "a": ["后续步骤正在加工的在产品", "最终完工的产成品", "本步骤已完工但尚未最终完工的半成品", "本步骤正在加工的在产品", "", ""], "r": "ACD", "e": "广义在产品是指各步骤尚未加工完成的在产品和各步骤已完工但尚未最终完成的产品。A选项后续步骤正在加工的在产品、C选项本步骤已完工但尚未最终完工的半成品、D选项本步骤正在加工的在产品都属于广义在产品；B选项最终完工的产成品不属于在产品。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188706", "t": 2, "q": "采用公允价值模式进行后续计量的投资性房地产，应当同时满足（　）条件。", "a": ["投资性房地产所在地有活跃的房地产交易市场", "企业能够从活跃的房地产交易市场上取得同类或类似房地产的市场价格及其他相关信息，从而对投资性房地产的公允价值作出合理的估计", "企业能够获取到该投资性房地产的具体成本信息", "所有的投资性房地产有活跃的房地产交易市场", "", ""], "r": "AB", "e": "采用公允价值模式后续计量需所在地有活跃房地产交易市场，且能据此获取同类或类似房地产市场价格等信息以合理估计公允价值。C选项获取具体成本信息不是公允价值模式计量的必要条件；D选项“所有”说法错误。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188707", "t": 2, "q": "下列属于会计档案的内容的有（　）。", "a": ["银行存款余额调节表", "明细分类账", "记账凭证", "会计报表", "", ""], "r": "ABCD", "e": "会计档案包括会计凭证、会计账簿、财务会计报告和其他会计资料等。记账凭证属于会计凭证；明细分类账属于会计账簿；会计报表属于财务会计报告；银行存款余额调节表属于其他会计资料。所以ABCD都属于会计档案内容。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188708", "t": 2, "q": "下列关于会计要素中负债的说法，正确的有？", "a": ["负债按流动性分为流动负债和非流动负债", "负债预期会导致经济利益流出企业", "预收账款属于负债类科目", "负债是企业过去的交易或事项形成的", "", ""], "r": "ABCD", "e": "负债是企业过去交易或事项形成的，预期会导致经济利益流出企业的现时义务，按流动性可分为流动和非流动负债，预收账款是企业预先收取款项，之后要提供商品或服务，属于负债类科目。ABCD四个选项说法均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188709", "t": 2, "q": "企业利润表中\"税金及附加\"项目核算的税费包括哪些？", "a": ["房产税", "增值税", "城市维护建设税", "消费税", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188710", "t": 2, "q": "下列各项中，不属于投资性房地产的是（　）。", "a": ["房地产企业开发的准备出售的商品房", "企业持有的准备增值后转让的土地使用权", "企业以经营租赁方式租入的生产线", "房地产企业开发的已出租的房屋", "", ""], "r": "AC", "e": "投资性房地产包括已出租的土地使用权、持有并准备增值后转让的土地使用权和已出租的建筑物等。A是存货，C经营租入的生产线不属于企业资产，更不是投资性房地产。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188711", "t": 2, "q": "企业发生的下列事项中，不应作为重要差错更正的有（　）。", "a": ["由于出现新技术，将专利权的摊销年限由8年改为5年", "根据规定对资产计提减值准备，考虑到利润指标超额完成太多，多计提了存货跌价准备", "鉴于当期利润完成状况不佳，将固定资产的折旧方法由双倍余额递减法改为直线法", "由于地震使厂房使用寿命受到影响，调减了厂房的预计使用年限", "", ""], "r": "AD", "e": "A和D是因新技术出现、地震等合理因素对资产相关参数进行的正常调整，属于会计估计变更；B多提存货跌价准备、C为调节利润改变折旧方法属于滥用会计政策，是重要差错。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188712", "t": 2, "q": "采用分步法核算产品成本时，逐步结转分步法和平行结转分步法的相同点有？", "a": ["都适用于大量大批多步骤生产企业", "都需要在完工产品与在产品之间分配费用", "成本计算对象都是产品的生产步骤", "月末都需要计算各步骤的生产费用", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188713", "t": 2, "q": "关于外币财务报表折算的一般原则，下列说法不正确的有（　）。", "a": ["资产负债表中的\"未分配利润\"项目应该采用交易发生日的即期汇率折算", "在对企业境外经营财务报表进行折算前，应当调整境外经营的会计期间和会计政策，使之与企业的会计期间和会计政策相一致", "企业境外经营的财务报表必须进行折算", "所有者权益变动表中当期计提的盈余公积可以采用当期平均汇率折算", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188714", "t": 2, "q": "下列金融资产中，应按摊余成本进行后续计量的有（　）。", "a": ["交易性金融资产", "贷款", "持有至到期投资", "可供出售债务工具", "", ""], "r": "BC", "e": "交易性金融资产按公允价值计量，A 不符合。贷款和持有至到期投资按摊余成本后续计量，BC 符合。可供出售债务工具按公允价值计量，D 不符合。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188715", "t": 2, "q": "月末，划分完工产品与在产品费用，应选择适当的方法，选择方法时应考虑的因素有（　）。", "a": ["会计人员工作水平的高低", "在产品数量变化的大小", "定额管理基础工作的好坏", "各项费用比重的大小", "", ""], "r": "BCD", "e": "划分完工产品与在产品费用选方法要考虑在产品数量变化、定额管理基础、各项费用比重等实际生产相关因素，而非会计人员工作水平。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188716", "t": 2, "q": "现金流量表中\"支付给职工以及为职工支付的现金\"项目应反映的内容有（　）。", "a": ["支付的在建工程人员的工资", "企业为离退休人员支付的统筹退休金", "支付的行政管理人员的工资", "企业为经营管理人员支付的困难补助", "", ""], "r": "CD", "e": "“支付给职工以及为职工支付的现金”核算给在职员工的薪酬等。A项在建工程人员工资应计入“购建固定资产、无形资产和其他长期资产支付的现金”；B项为离退休人员支付的统筹退休金在“支付其他与经营活动有关的现金”反映。C行政管理人员工资和D为经营管理人员支付的困难补助，都属于给在职员工的，应在该项目反映。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188717", "t": 2, "q": "下列各项模块，应确认为企业资产的有（　）", "a": ["融资租入的固定资产", "计划下个月购入的材料", "购入的无形资产", "已霉烂变质无使用价值的存货", "", ""], "r": "AC", "e": "资产是指企业过去的交易或事项形成的、由企业拥有或控制的、预期会给企业带来经济利益的资源。A融资租入固定资产虽所有权可能未转移，但企业能控制且带来经济利益，是资产；C购入的无形资产符合资产定义；B计划购入未发生交易，不是资产；D已无使用价值不能带来经济利益，不是资产。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188718", "t": 2, "q": "关于债务重组日，下列表述正确的有（　）。", "a": ["债务重组日可能是债务到期前、到期日或到期后", "将债务转为资本，在办妥增资批准手续并向债权企业出具出资证明时，作为债务重组日", "用存货清偿，在债权人收到存货、办理了入库手续并办理有关债务解除手续后，作为债务重组日", "用低于应付债务的现金清偿，在债权人现金到账并办理有关债务解除手续，作为债务重组日", "", ""], "r": "ABCD", "e": "债务重组日是指债务重组完成日，可能在债务到期前、到期日或到期后。各选项描述的都是常见债务重组方式下确定债务重组日的合理情形。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528649692188719", "t": 2, "q": "下列各项中影响固定资产清理净收益的因素应包括（　）。", "a": ["出售固定资产的价款", "报废固定资产的原价", "转让不动产应缴纳的营业税", "损毁固定资产取得的赔款", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902016", "t": 3, "q": "事业单位为专业业务活动购入的材料和为生产经营活动购入的材料，尽管其用途不同，但入账价值均相同。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "事业单位为专业业务活动购入材料，入账价值一般按实际成本；为生产经营活动购入材料，若为增值税一般纳税人，其入账价值不含可抵扣的增值税进项税额，二者入账价值不同。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902017", "t": 3, "q": "企业对无形资产进行摊销时，可以采用直线法、生产总量法，但不能采用类似加速折旧法的方法进行摊销。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业对无形资产摊销方法有多种，包括直线法、生产总量法等，也可采用类似加速折旧法的方法，如双倍余额递减法等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902018", "t": 3, "q": "资产负债表日，可供出售金融资产的公允价值低于其账面余额时，应计提可供出售金融资产减值准备。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902019", "t": 3, "q": "企业在发生可资本化的后续支出的时候，可能涉及替换固定资产的某个组成部分，应当将用于替换的部分资本化，计入固定资产的入账价值，同时终止确认被替换部分的账面原价（　）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902020", "t": 3, "q": "会计监督是一种事后监督。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "会计监督包括事前监督、事中监督和事后监督，并非只是事后监督。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902021", "t": 3, "q": "当换入资产的未来现金流量在风险、时间和金额方面与换出资产显著不同时，则说明该项非货币性资产交换具有商业实质。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "符合非货币性资产交换具有商业实质的判断条件之一就是换入资产的未来现金流量在风险、时间和金额方面与换出资产显著不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902022", "t": 3, "q": "资产账面价值大于其计税基础，产生可抵扣暂时性差异;负债账面价值小于其计税基础，产生应纳税暂时性差异。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产账面价值大于计税基础，未来纳税多，产生应纳税暂时性差异；负债账面价值小于计税基础，未来纳税少，产生可抵扣暂时性差异。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902023", "t": 3, "q": "企业在履行合同义务过程中，发生成本实际超过与合同相关的未来流入的经济利益，待执行合同即变成了亏损合同。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902024", "t": 3, "q": "账户的基本结构分为左、右两个方向，左方登记增加，右方登记减少。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "账户基本结构分左右两方，但哪方记增加哪方记减少取决于账户性质。并非固定左方记增加、右方记减少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902025", "t": 3, "q": "会计主体可以是独立法人，也可以是非法人。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计主体是指会计工作所服务的特定单位或组织，它可以是独立法人，像企业法人；也可以是非法人，如个人独资企业、合伙企业等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902026", "t": 3, "q": "正确填制和审核会计凭证，是会计核算的基本方法之一，也是会计核算工作的起点和基本环节。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计核算流程里，需先取得和填制会计凭证，之后才能依据凭证登记账簿等，所以正确填制和审核会计凭证是核算基本方法，也是起点与基本环节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902027", "t": 3, "q": "企业改变土地使用权的用途，将其作为用于出租或增值目的时，应将其账面价值转为投资性房地产。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业改变土地使用权用途用于出租或增值，符合投资性房地产定义，要将账面价值转为投资性房地产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902028", "t": 3, "q": "因遭受意外灾害发生的损失和尚待查明原因的途中损耗，不应计入物资的采购成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "意外灾害损失和待查明原因的途中损耗不属于合理必要支出，不应计入采购成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902029", "t": 3, "q": "原始凭证记载的各项内容不得涂改。对于填制有误的原始凭证，原始凭证开具单位要负责更正或重新开具，不得拒绝。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "原始凭证的真实性、完整性等很重要，所以不得涂改。若填制有误，开具单位有责任更正或重开以保证凭证质量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902030", "t": 3, "q": "如果以前期间的会计估计是错误的，则属于差错，按前期差错更正的规定进行会计处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计估计错误属于前期差错，应按前期差错更正规定处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902031", "t": 3, "q": "原材料明细账的每一账页登记完毕结转下页时，可以只将每页末的余额结转次页，不必将本页的发生额结转次页。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902032", "t": 3, "q": "固定资产的折旧方法由平均年限法改为双倍余额递减法属于会计政策变更。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "固定资产折旧方法的变更属于会计估计变更，而非会计政策变更。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902033", "t": 3, "q": "专门借款实际发生的借款利息减去闲置资金的利息收入或投资收益后的金额应全部资本化。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "专门借款只有在资本化期间内，实际发生的借款利息减去闲置资金的利息收入或投资收益后的金额才资本化，并非全部资本化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902034", "t": 3, "q": "采用公允价值模式计量的投资性房地产转换为自用房地产时，应当以其转换当日的公允价值作为自用房地产的账面价值，公允价值与原账面价值的差额计入当期损益（投资收益）。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "差额应计入“公允价值变动损益”，而非“投资收益”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902035", "t": 3, "q": "收付实现制是以收或支付的现金作为确认收入和费用的依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "收付实现制就是以实际收到或支付现金的时间来确认收入和费用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902036", "t": 3, "q": "资产组的认定，主要以资产组是否能产生现金流入为依据。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902037", "t": 3, "q": "由于非正常原因造成的报废或毁损，或在建工程项目全部报废或毁损，应将其净损失直接计入管理费用。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "因非正常原因造成的报废或毁损，或在建工程项目全部报废或毁损，净损失应计入营业外支出，而非管理费用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902038", "t": 3, "q": "在售后回购业务中，如果有确凿证据表明售后回购交易中满足销售商品收入确认条件的，销售的商品按售价确认收入，回购商品作为购进商品处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "售后回购业务若满足销售商品收入确认条件，确实应按售价确认收入，回购按购进处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902039", "t": 3, "q": "或有事项的结果不确定，仅指或有事项的结果是否发生具有不确定性。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "或有事项结果不确定，不仅指结果是否发生不确定，还包括结果预计发生但发生的具体时间或金额不确定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902040", "t": 3, "q": "企业清偿预计负债所需支付的全部或部分预期由第三方补偿的，补偿金额只有在完全确定能够收到时才能作为资产单独确认。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "补偿金额应在基本确定能收到时作为资产单独确认，而非完全确定，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902041", "t": 3, "q": "因债务人信用恶化以外的原因，使持有方可能难以收回几乎所有初始投资的非衍生金融资产，企业也有可能将其划分为贷款和应收款项。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902042", "t": 3, "q": "已采用公允价值模式计量的投资性房地产，不得从公允价值模式转为成本模式。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据会计准则规定，投资性房地产计量模式一经确定，已采用公允价值模式计量的，不得再转为成本模式，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902043", "t": 3, "q": "企业购入材料运输途中发生的合理损耗应计入材料成本，使材料的单位成本减少。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "合理损耗计入材料成本，但总成本不变，数量减少，单位成本会增加而非减少。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902044", "t": 3, "q": "企业对其所使用的机器设备、厂房等固定资产，只有在持续经营的前提下才可以在机器设备的使用年限内，按照资产有关的经济利益的预期实现方式，合理确定采用某一折旧方法计提折旧。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "持续经营假设下，企业才能按资产经济利益预期实现方式合理确定折旧方法在资产使用年限内计提折旧，否则无法正常进行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902045", "t": 3, "q": "企业采用公允价值模式进行后续计量的，也应当对投资性房地产计提折旧或进行摊销。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "采用公允价值模式进行后续计量的投资性房地产，不计提折旧或进行摊销，以公允价值计量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902046", "t": 3, "q": "由于经济环境、客观情况的改变而变更会计政策，以便提供企业财务状况、经营成果和现金流量等更可靠、更相关的会计信息，若会计政策累积影响数能够合理确定，在国家没有特别规定的情况下，应采用未来适用法进行会计处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种情况应采用追溯调整法而非未来适用法，追溯调整法能使会计信息更具可比性和可靠性，反映政策变更累积影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902047", "t": 3, "q": "财务报告包括财务报表和其他应当在财务报告中披露的相关信息和资料。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "财务报告是企业对外提供的反映企业某一特定日期的财务状况和某一会计期间的经营成果、现金流量等会计信息的文件，它由财务报表和其他应当在财务报告中披露的相关信息和资料构成。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902048", "t": 3, "q": "记账凭证账务处理程序、汇总记账凭证账务处理程序、科目汇总表账务处理程序的不同之处在于登记总账的依据和程序不同。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三种账务处理程序的主要区别就是登记总账的依据和方法不同。记账凭证账务处理程序依据记账凭证登记总账；汇总记账凭证账务处理程序依据汇总记账凭证登记总账；科目汇总表账务处理程序依据科目汇总表登记总账。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902049", "t": 3, "q": "财政部门销毁会计档案时，应当由同级监察部门派员参加监销。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528650786902050", "t": 3, "q": "编制事业单位资产负债表依据的会计等式是\"资产=负债＋净资产\"。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "事业单位资产负债表是反映特定日期财务状况的报表，依据“资产=负债＋净资产”这一会计等式编制。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 会计学（8）", "n": "基础练习题【含解析】 / 第2章 会计学（8）", "qs": [{"id": "2034528656184971264", "t": 1, "q": "采用品种法进行成本核算时，其成本计算对象是？", "a": ["产品类别", "产品品种", "产品批别", "产品生产步骤", "", ""], "r": "B", "e": "品种法是以产品品种为成本计算对象来归集生产费用、计算产品成本。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971265", "t": 1, "q": "B公司于2008年10月被A公司起诉，称B公司侵犯了A公司的软件版权，要求B公司予以赔偿，赔偿金额为800万元。在应诉过程中，B公司发现诉讼所涉及的软件主体部分是有偿委托乙公司开发的。如果这套软件确有侵权问题，乙公司应当承担连带责任，对B公司予以赔偿。B公司在年末编制会计报表时，根据法律诉讼的进展情况以及律师的意见，认为对A公司予以赔偿的可能性在70％，最有可能发生的赔偿金额为500万元;从乙公司获得的补偿基本可以确定，最有可能获得的赔偿金额为550万元。在上述情况下，B公司在年末应确认的负债和资产分别是（　）。", "a": ["550万元和550万元", "500万元和500万元", "500万元和550万元", "800万元和800万元", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971266", "t": 1, "q": "企业对境外经营的财务报表进行折算时，产生的外币财务报表折算差额应当（　）。", "a": ["在资产负债表上无需反映", "在相关资产类项目下列示", "在所有者权益项目下单独列示", "作为递延收益列示", "", ""], "r": "C", "e": "企业对境外经营财务报表折算时，外币财务报表折算差额应在所有者权益项目下单独列示。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971267", "t": 1, "q": "下列关于利润表中\"资产减值损失\"项目填列依据的说法，正确的是？", "a": ["不包含固定资产减值准备金额", "只包含存货跌价准备金额", "仅反映应收账款计提的坏账准备金额", "反映企业计提的各项资产减值准备所形成的损失", "", ""], "r": "D", "e": "资产减值损失项目反映企业计提各项资产减值准备所形成的损失，涵盖固定资产减值准备、存货跌价准备、应收账款坏账准备等多种资产减值情况。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971268", "t": 1, "q": "现金流量表中，\"支付的各项税费\"属于？", "a": ["投资活动产生的现金流量", "筹资活动产生的现金流量", "经营活动产生的现金流量", "不涉及现金流量的项目", "", ""], "r": "C", "e": "支付各项税费是企业日常经营活动中的支出，所以属于经营活动产生的现金流量。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971269", "t": 1, "q": "出售持有至到期投资时，应按实际收到的金额，借记\"银行存款\"科目，已计提减值准备的，借记\"持有至到期投资减值准备\"科目，按其账面余额，贷记\"持有至到期投资（成本、利息调整、应计利息）\"科目，按其差额，贷记或借记（　）科目。", "a": ["资本公积", "资产减值损失", "营业外收入", "投资收益", "", ""], "r": "D", "e": "出售持有至到期投资时，其差额应计入投资收益。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971270", "t": 1, "q": "现金流量表中，“收到其他与投资活动有关的现金”项目不包括？", "a": ["收到债券投资利息收入", "处置固定资产收到的现金中包含的保险公司赔款", "收到购买股票时包含的已宣告但尚未发放的现金股利", "处置无形资产收到的现金", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971271", "t": 1, "q": "甲企业于2008年10月6日从证券市场上购入乙企业发行在外的股票100万股作为可供出售金融资产，每股支付价款2元（含已宣告但尚未发放的现金股利0.25元），另支付相关费用6万元，甲企业取得可供出售金融资产时的入账价值为（　）万元。", "a": ["206", "200", "175", "181", "", ""], "r": "D", "e": "入账价值=（每股价格 - 已宣告但未发放股利）×股数 + 相关费用，即（2 - 0.25）×100 + 6 = 181万元。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971272", "t": 1, "q": "从成本计算方法的原理上说，标准成本法可以取代（　）。", "a": ["品种法", "分类法", "定额法", "分步法", "", ""], "r": "C", "e": "标准成本法和定额法都有成本控制和差异分析的功能，原理上标准成本法可取代定额法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971273", "t": 1, "q": "2008年12月28日，昌盛公司因合同违约而涉及一桩诉讼案。根据企业的法律顾问判断，最终的判决很可能对昌盛公司不利。2008年12月31日，昌盛公司尚未接到法院的判决，因诉讼须承担的赔偿金额也无法准确地确定。不过，据专业人士估计，赔偿金额很可能是720万元至1000万元之间的某一金额，则下列说法不正确的是（　）。", "a": ["2008年末昌盛公司确认860万元的预计负债", "2008年末昌盛公司根据谨慎性要求应该确认720万元预计负债", "2008年末昌盛公司确认860万元的营业外支出", "2008年末昌盛公司需要进行相应的披露", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971274", "t": 1, "q": "下列账簿中，可以采用卡片式账簿的是（　）。", "a": ["租入固定资产登记簿", "日记总账", "固定资产总账", "固定资产明细账", "", ""], "r": "D", "e": "卡片式账簿一般适用于固定资产明细账等，方便记录固定资产的详细信息且可灵活增减卡片。租入固定资产登记簿是备查账；日记总账是序时账和总账相结合的账簿；固定资产总账一般用订本式。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971275", "t": 1, "q": "大唐公司2007年度财务报告批准对外报出日为2008年4月25日，所得税汇算清缴日为2008年3月15日。该公司在2008年4月30日之前发生的下列事项中，不需要对2007年度财务报表进行调整的是（　）。", "a": ["2008年1月15日，法院判决保险公司对2007年12月12日发生的火灾赔偿150万元", "2008年4月8日收到了被退回的于2007年12月1日销售的设备10台", "2008年3月20日，收到税务机关退回的上年度出口货物增值税160万元", "2008年2月20日得到通知，上年度应收H公司的货款130万元，因该公司破产而无法收回，上年末已对该应收账款计提坏账准备13万元", "", ""], "r": "C", "e": "资产负债表日后调整事项是指对资产负债表日已经存在的情况提供了新的或进一步证据的事项。A选项法院判决火灾赔偿是对资产负债表日已存在事项的进一步证据；B选项销售退回是资产负债表日已销售商品的后续情况；D选项应收账款无法收回是对资产负债表日应收账款情况的新证据。而C选项收到税务机关退回上年度出口货物增值税，不属于资产负债表日已存在情况的进一步证据，是新发生事项。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971276", "t": 1, "q": "分批法成本计算的特点是（　）", "a": ["通常不存在完工产品与在产品之间分配费用的问题", "成本计算期与产品生产周期不一致", "月末必须计算完工产品成本", "以生产批次作为成本计算对象", "", ""], "r": "D", "e": "分批法是以生产批次作为成本计算对象，成本计算期与产品生产周期一致，一般不存在完工产品与在产品之间分配费用问题，也不一定要月末计算完工产品成本。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971277", "t": 1, "q": "甲公司本月销售情况如下:<br />（1）现款销售20台A产品，总售价80000元（不含增值税，下同）已入账<br />（2）附有退货条件的销售2台B产品，总售价23000元已入账，退货期3个月，退货的可能性难以估计<br />（3）需要安装的销售5台C产品，总售价30000元，款项尚未收取，安装工作属于销售业务的重要组成部分，月末安装尚未完成。甲公司本月应确认的销售收入是（　）元。", "a": ["140000", "163000", "80000", "183000", "", ""], "r": "C", "e": "现款销售A产品可确认收入；附有退货条件且退货可能性难以估计的B产品，不能确认收入；需要安装且安装是重要组成部分、月末未完成安装的C产品，不能确认收入。所以本月仅确认A产品80000元收入。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971278", "t": 1, "q": "企业对境外经营的财务报表进行折算时，应采用资产负债表日的即期汇率进行折算的项目是（　）。", "a": ["交易性金融资产", "实收资本", "财务费用", "营业收入", "", ""], "r": "A", "e": "境外经营报表折算，资产和负债项目采用资产负债表日即期汇率折算。A选项交易性金融资产是资产项目，用资产负债表日即期汇率折算；B选项实收资本采用交易发生时的即期汇率折算；C财务费用和D营业收入采用交易发生日的即期汇率或其近似汇率折算。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971279", "t": 1, "q": "企业的投资性房地产采用公允价值计量模式。2007年1月1日，该企业将一项固定资产转换为投资性房地产。该固定资产的账面余额为100万元，已提折旧20万元，已经计提的减值准备为10万元，转换当日的公允价值为65万，转换日影响当期损益的金额是（　）万元。", "a": ["5", "0", "15", "35", "", ""], "r": "A", "e": "固定资产账面价值=100 - 20 - 10 = 70万元，转换日公允价值65万元，差额70 - 65 = 5万元，公允价值小于账面价值的差额计入当期损益。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971280", "t": 1, "q": "采用分批法计算产品成本时，成本计算单的设置依据是？", "a": ["产品类别", "产品品种", "产品批别", "产品生产步骤", "", ""], "r": "C", "e": "分批法是按照产品批别归集生产费用、计算产品成本的一种方法，所以成本计算单应按产品批别设置。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971281", "t": 1, "q": "2008年3月11日，A公司取得3年期专门借款1500万元直接用于当日开工建造的办公楼，年利率为8％。2008年累计发生建造支出1500万元，2009年1月1日，该公司又取得一般借款2000万元，年利率为7％，2009年3月1日发生建造支出600万元，7月1日发生建造支出900万元，上述支出均以借入款项支付（A公司无其他一般借款）。因工程施工质量问题该项工程于2009年8月1日至11月31日停工4个月，截至2009年年底工程尚未完工。不考虑其他因素，2009年借款费用的资本化金额为（　）万元。", "a": ["111.5", "31.5", "66.5", "186.5", "", ""], "r": "A", "e": "专门借款2009年利息资本化金额=1500×8% = 120万元；一般借款累计资产支出加权平均数=（600×10/12 + 900×6/12）= 950万元，一般借款资本化率为7%，一般借款利息资本化金额=950×7% = 66.5万元；2009年借款费用资本化金额=120 + 66.5 - 75 = 111.5万元（75是专门借款闲置资金收益，本题未提及闲置资金收益，可默认无此情况）。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971282", "t": 1, "q": "A公司于20×7年3月以3000万元取得B公司30％的股权，因能够派人参与B公司的生产经营决策，对所取得的长期股权投资按照权益法核算，并于20×7年确认对B公司的投资收益150万元（该项投资的初始投资成本与投资时应享有被投资单位可辨认净资产公允价值的份额相等）。20×8年4月，A公司又斥资4000万元取得B公司另外30％的股权。假定A公司在取得对B公司的长期股权投资以后，B公司并未宣告发放现金股利或利润;A公司按净利润的10％计提盈余公积，则A公司的合并成本为（　）万元。", "a": ["3000", "7000", "6000", "4000", "", ""], "r": "B", "e": "本题是关于企业合并成本的计算。A公司分两次取得B公司股权，最终达到控制。合并成本是各次交易成本之和。第一次取得30%股权成本为3000万元，第二次取得另外30%股权成本为4000万元，所以合并成本=3000 + 4000 = 7000万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971283", "t": 1, "q": "负债是指企业过去的交易或者事项形成的，预期会导致经济利益流出企业的（　）。", "a": ["未来义务", "现时义务", "潜在义务", "过去义务", "", ""], "r": "B", "e": "负债的定义就是企业过去交易或事项形成的、预期会导致经济利益流出企业的现时义务。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971284", "t": 1, "q": "记账凭证按照其填列方式，可以分为（　）。", "a": ["借项凭证和贷项凭证", "单式凭证和复式凭证", "收款凭证、付款凭证和转账凭证", "一次凭证、累计凭证和汇总凭证", "", ""], "r": "B", "e": "按填列方式，记账凭证分单式和复式凭证。A选项借项、贷项凭证不是按填列方式分类；C是按用途和适用经济业务分；D是原始凭证分类。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971285", "t": 1, "q": "某企业2009年3月发生了如下经济业务:①预付下季度房租20000元;②收到3月份销售商品货款25000元，款项已存入银行;③购买1000元的办公用品;④预收购货方定金12000元，货物尚未发送。以权责发生制为计算基础时，3月份的收支净额为（　）元。", "a": ["4000", "36000", "16000", "24000", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971286", "t": 1, "q": "对于以公允价值计量且其变动计入当期损益的金融资产，下列有关业务中，应贷记\"投资收益\"的是（　）。", "a": ["企业转让交易性金融资产时对持有期间累计产生的公允价值变动损失的处理", "企业持有期间获得的现金股利", "企业收到的包含在买价中已到期但尚未领取的利息", "资产负债表日，持有的股票市价大于其账面价值", "", ""], "r": "B", "e": "A选项处理公允价值变动损失不贷记投资收益；C选项收到已到期未领取利息冲减应收项目；D选项市价大于账面价值贷记公允价值变动损益。B选项持有期间获现金股利贷记投资收益。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971287", "t": 1, "q": "资产负债表中，\"应付票据\"项目应根据（　）填列。", "a": ["\"应付票据\"和\"应收票据\"科目所属明细科目的期末余额合计数", "\"应付票据\"总账科目余额", "\"应付票据\"科目期末余额减去坏账准备后的净额", "\"应付票据\"科目所属明细科目的期末余额", "", ""], "r": "B", "e": "“应付票据”项目直接根据“应付票据”总账科目余额填列。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971288", "t": 1, "q": "依据企业会计准则的规定，下列有关收入和利得的表述中，正确的是（　）。", "a": ["收入会导致所有者权益的增加，利得不一定会导致所有者权益的增加", "收入源于日常活动，利得源于非日常活动", "收入源于日常活动，利得也可能源于日常活动", "收入会影响利润，利得也一定会影响利润", "", ""], "r": "B", "e": "收入是日常活动形成，会影响利润进而使所有者权益增加；利得是非日常活动形成，有的计入所有者权益不影响利润，有的计入当期损益影响利润，但一定使所有者权益增加。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971289", "t": 1, "q": "在资本化期间内，对于专门借款闲置资金产生的利息收入或投资收益应（　）。", "a": ["冲减财务费用", "计入营业外收入", "冲减借款费用资本化的金额", "计入投资收益", "", ""], "r": "C", "e": "专门借款闲置资金产生的利息收入或投资收益，应冲减借款费用资本化的金额，这是专门借款资本化的规定。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971290", "t": 1, "q": "利润表中，计算营业利润时不涉及的项目是？", "a": ["财务费用", "资产减值损失", "营业外收入", "营业收入", "", ""], "r": "C", "e": "营业利润计算涉及营业收入、营业成本、税金及附加、销售费用、管理费用、研发费用、财务费用、资产减值损失等。营业外收入不属于营业利润计算范畴，它影响利润总额。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971291", "t": 1, "q": "资产负债表的资产项目通常按照（　）的顺序排列。", "a": ["货币资金、应收账款、存货、长期股权投资、固定资产", "应收账款、货币资金、存货、固定资产、长期股权投资", "货币资金、应收账款、长期股权投资、存货、固定资产", "应收账款、货币资金、长期股权投资、存货、固定资产", "", ""], "r": "A", "e": "资产负债表资产项目按流动性大小排列，流动性大的在前。货币资金流动性最强，其次是应收账款，然后是存货，长期股权投资和固定资产流动性相对较弱，且长期股权投资流动性小于固定资产。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971292", "t": 1, "q": "采用分步法计算产品成本，若各步骤半成品通过半成品库收发，且采用综合结转法，下一步骤领用半成品应借记的科目是？", "a": ["原材料", "库存商品", "生产成本---基本生产成本---直接材料", "生产成本---基本生产成本---半成品", "", ""], "r": "D", "e": "综合结转法下，下一步骤领用半成品，应计入“生产成本——基本生产成本——半成品”科目。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971293", "t": 1, "q": "下列账簿记录情况中，可以用划线更正法更正错误的是（　）。", "a": ["在结账前发现账簿记录有文字或数字错误，而记账凭证没有错", "登账后发现记账凭证中科目正确但所记金额小于应记金额", "登账后发现记账凭证中应借、应贷方向发生错误", "登账后发现记账凭证中会计科目发生错误", "", ""], "r": "A", "e": "划线更正法适用于结账前账簿记录有误，而记账凭证无误的情况。B用补充登记法，C和D用红字更正法。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971294", "t": 1, "q": "甲公司对A生产设备进行改良，该设备原价为2000万元，已提折旧600万元，计提减值为300万元，改良中发生各项支出共计500万元。改良时被替换部分的账面原价为150万元。则改良后固定资产的入账价值为（　）万元。", "a": ["2 000", "1 517.5", "1 450", "1 550", "", ""], "r": "B", "e": "先算改良前设备账面价值=2000 - 600 - 300 = 1100万元，被替换部分账面价值=150×(1100÷2000)=82.5万元，改良后入账价值=1100 + 500 - 82.5 = 1517.5万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971295", "t": 1, "q": "采用分批法计算产品成本时，对于同一批次产品跨月陆续完工，且完工产品数量占总数量比重较大的情况，完工产品成本的确定方法是？", "a": ["按计划单位成本计算", "按近期同种产品的实际单位成本计算", "按定额单位成本计算", "采用约当产量比例法等方法分配计算", "", ""], "r": "D", "e": "当同一批次产品跨月陆续完工且完工产品数量占总数量比重较大时，需采用合适方法分配生产费用来确定完工产品成本，约当产量比例法是常用分配方法。ABC选项适用于完工产品数量占比小的情况。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971296", "t": 1, "q": "A公司的记账本位币为人民币。2008年9月6日以每股5欧元的价格购入B公司股票20,000股，作为交易性金融资产核算，当日汇率为1欧元=11元人民币，款项已支付。2008年12月31日，原购入B公司股票的市价变为每股5.8欧元，当日汇率为1欧元=10元人民币。假定不考虑相关税费的影响。A公司2008年12月31日应确认的公允价值变动损益为（　）元。", "a": ["－16 000", "16 000", "－60 000", "60 000", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971297", "t": 1, "q": "现金流量表中，偿还债务支付的现金属于？", "a": ["经营活动产生的现金流量", "不涉及现金流量的项目", "投资活动产生的现金流量", "筹资活动产生的现金流量", "", ""], "r": "D", "e": "偿还债务是企业筹集资金后对债务的清偿，属于筹资活动范畴。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971298", "t": 1, "q": "会计政策是指（　）。", "a": ["企业在会计确认中所采用的原则、基础和会计处理方法", "企业在会计报告中所采用的原则、基础和会计处理方法", "企业在会计计量中所采用的原则、基础和会计处理方法", "企业在会计确认、计量和报告中所采用的原则、基础和会计处理方法", "", ""], "r": "D", "e": "会计政策涵盖会计确认、计量和报告各方面所采用的原则、基础和会计处理方法。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971299", "t": 1, "q": "在资产持有期间，其相应的资产减值准备可以转回的是（　）。", "a": ["建造合同所形成资产计提的减值准备", "投资性房地产减值准备", "商誉减值准备", "使用寿命不确定的无形资产减值准备", "", ""], "r": "A", "e": "一般长期资产减值准备不能转回，投资性房地产、商誉、使用寿命不确定的无形资产减值准备都属于长期资产减值准备，不可转回。建造合同所形成资产计提的减值准备可以转回。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971300", "t": 1, "q": "下列在资产负债表日至财务报告批准报出日之间发生的事项中，不属于资产负债表日后调整事项的是（　）。", "a": ["日后外汇汇率发生较大变动", "日后已确定将要支付赔偿额大于该赔偿在资产负债表日的估计金额", "日后已证实某项资产在资产负债表日发生了减损", "日后期间发现前期重大会计差错", "", ""], "r": "A", "e": "资产负债表日后调整事项是对资产负债表日已存在情况提供新的或进一步证据的事项。A选项外汇汇率变动是资产负债表日后新发生的情况，不属于对资产负债表日已存在情况的调整。B、C、D都是对资产负债表日已存在事项的进一步明确或发现前期差错，属于调整事项。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971301", "t": 1, "q": "根据《企业会计准则第2号——长期股权投资》的规定，长期股权投资采用权益法核算时，初始投资成本大于应享有被投资单位可辨认资产公允价值份额之间的差额，正确的会计处理是（　）。", "a": ["计入投资收益", "不调整初始投资成本", "计入营业外支出", "冲减资本公积", "", ""], "r": "B", "e": "权益法下，初始投资成本大于应享有被投资单位可辨认资产公允价值份额，说明是“赚”了，不调整初始投资成本。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971302", "t": 1, "q": "企业在资产负债表日提供劳务交易结果不能可靠估计的，下面的账务处理不正确的是（　）。", "a": ["已经发生劳务成本预计只能部分得到补偿的，应当按照能够得到补偿的劳务成本金额确认收入，并按照已发生的劳务成本结转成本", "已经发生的劳务成本预计能够得到补偿的，应当按照已经发生的劳务成本的金额确认提供的劳务收入，并按相同的金额结转劳务成本", "已经发生的劳务成本预计全部不能得到补偿的，应当将已经发生的劳务成本计入当期损益，不确认劳务收入", "已经发生的劳务成本预计全部不能得到补偿的，应当将已经发生的劳务成本计入当期损益，同时按照已经发生的劳务成本确认收入", "", ""], "r": "D", "e": "企业在资产负债表日提供劳务交易结果不能可靠估计时，若成本预计全部不能得到补偿，应只计成本入当期损益，不确认收入，D选项确认收入错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971303", "t": 1, "q": "某股份有限公司于2008年2月29日以每股6元（包含已宣告尚未发放的现金股利0.25元）的价格购入某上市公司股票25万股，作为交易性金融资产核算。购买该股票支付手续费等5万元。5月25日，收到该上市公司按每股0.25元发放的现金股利。12月31日该股票的市价为每股5.5元。2008年12月31日该股票投资的账面价值为（　）万元。", "a": ["137.5", "150", "143.75", "125", "", ""], "r": "A", "e": "交易性金融资产按公允价值计量，期末账面价值等于期末公允价值。本题中12月31日股票市价为每股5.5元，共25万股，所以账面价值=5.5×25 = 137.5万元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971304", "t": 1, "q": "2009年6月11日，A公司将一项专利权以700万元的价格转让给B公司。该项专利权系A公司2008年1月1日以1,200万元的价格购入的，购入时预计使用年限为10年，法律规定的有效使用年限为12年，采用直线法摊销。该专利权未计提减值准备。假定转让专利权适用的营业税税率为5%，不考虑所得税等其他相关税费。A公司转让该专利权所获得的净收益为（　）万元。", "a": ["-365", "-320", "-355", "-295", "", ""], "r": "C", "e": "首先算累计摊销，从2008年1月1日到2009年6月11日共1.5年，年摊销额 = 1200÷10 = 120万元，累计摊销 = 120×1.5 = 180万元。无形资产账面价值 = 1200 - 180 = 1020万元。转让时交营业税 = 700×5% = 35万元。净收益 = 700 - 1020 - 35 = -355万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971305", "t": 1, "q": "处置采用公允价值模式计量的投资性房地产时，下列说法正确的是（　）。", "a": ["应将原来在转换日计入公允价值变动损益的金额转入其他业务收入，从而影响当期营业利润", "对于投资性房地产的累计公允价值变动金额，在处置时不需要进行会计处理", "应将确认的投资性房地产累计公允价值变动金额转入其他业务收入，从而影响当期营业利润", "应将确认的投资性房地产累计公允价值变动影响公允价值变动损益的金额转入其他业务收入，但不影响当期营业利润", "", ""], "r": "C", "e": "处置采用公允价值模式计量的投资性房地产时，应将确认的投资性房地产累计公允价值变动金额转入其他业务收入，会影响当期营业利润。A选项，转换日计入公允价值变动损益的金额处置时不转入其他业务收入；B选项，累计公允价值变动金额处置时要处理；D选项，会影响当期营业利润。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971306", "t": 1, "q": "根据《会计档案管理办法》的规定，在我国境内所有单位的会计档案（　）。", "a": ["不得携带出境", "经本单位负责人批准后，可携带出境", "可以携带出境", "经安全部门批准后，可携带出境", "", ""], "r": "A", "e": "会计档案关系到单位财务信息等重要内容，为保障信息安全，我国规定境内所有单位的会计档案不得携带出境。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971307", "t": 1, "q": "企业采用品种法核算产品成本，若月末存在在产品，且在产品数量较多、各月在产品数量变化较大，同时原材料费用在成本中所占比重较大，此时适宜采用的在产品成本计算方
