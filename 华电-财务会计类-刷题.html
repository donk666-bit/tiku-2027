, false, false]}, {"id": "2034528556217929745", "t": 2, "q": "评价企业偿债能力的指标有（　）", "a": ["资本金利润率", "即付比率", "存货周转率", "流动比率", "", ""], "r": "BD", "e": "偿债能力指标衡量企业偿还债务的能力，即付比率反映企业立即偿还短期债务能力，流动比率衡量短期偿债能力。资本金利润率是盈利能力指标，存货周转率是营运能力指标。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929746", "t": 2, "q": "下列项目中，属于在现代管理会计阶段产生和发展起来的有（　）。", "a": ["预测决策会计", "管理会计师职业", "规划控制会计", "责任会计", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929747", "t": 2, "q": "按长期投资项目的类型分类，可将工业企业投资项目分为（　）。", "a": ["合伙联营投资项目", "完整工业投资项目", "控股合并投资项目", "更新改造投资项目", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929748", "t": 2, "q": "影响企业应收账款周转率的因素有哪些？", "a": ["企业收账政策和收账力度", "客户的信用状况和付款习惯", "企业所处行业的特点", "企业的信用政策，如赊销期限和信用标准", "", ""], "r": "ABCD", "e": "收账政策、收账力度、客户信用状况与付款习惯、行业特点、信用政策都会影响应收账款的回收速度，进而影响应收账款周转率。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929749", "t": 2, "q": "下列指标中，用于衡量企业投资风险的指标有（　）", "a": ["预期收益率", "标准离差", "投资平均报酬率", "标准离差率", "", ""], "r": "BD", "e": "预期收益率和投资平均报酬率是衡量收益的指标。标准离差和标准离差率是衡量风险的指标，标准离差衡量绝对风险，标准离差率衡量相对风险。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929750", "t": 2, "q": "历史资料分析法具体包括的方法有（　）。", "a": ["高低点法", "回归直线法", "阶梯法", "散布图法", "", ""], "r": "ABD", "e": "历史资料分析法是根据企业若干期成本与业务量的相关历史资料，运用数学方法进行数据处理，以完成成本性态分析任务的一种定量分析方法，包括高低点法、回归直线法、散布图法。阶梯法不属于历史资料分析法。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929751", "t": 2, "q": "并购投资价值评估的主要方法有（　）", "a": ["贴现现金流量法", "股息收益折现模型法", "Q比率法", "净资产账面价值法", "", ""], "r": "ABCD", "e": "这几种方法都是并购投资价值评估常用方法。贴现现金流量法通过预测未来现金流折现评估价值；股息收益折现模型法基于股息折现；Q比率法用公司市场价值与资产重置成本比较；净资产账面价值法以净资产账面价值评估。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929752", "t": 2, "q": " 在企业预算编制过程中，可能影响预算准确性的因素有？", "a": ["历史数据的参考价值局限性", "各部门沟通协调不畅", "市场环境的不确定性", "预算编制方法选择不当", "", ""], "r": "ABCD", "e": "历史数据可能无法反映未来情况，参考价值有限会影响预算准确性；部门沟通不畅易导致信息偏差；市场环境不确定难以精准预测；预算编制方法选得不对也会使预算不准确。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929753", "t": 2, "q": "滚动预算的优点有哪些？", "a": ["便于动态调整经营策略", "编制成本较低", "保持预算的连续性和完整性", "能及时反映企业经营活动变化", "", ""], "r": "ACD", "e": "滚动预算会不断更新预算期，能根据实际情况动态调整经营策略，及时反映企业经营活动变化，且保持预算的连续性和完整性。但它需不断调整，编制成本较高。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929754", "t": 2, "q": "随机变量可能达到的数值是（　）。", "a": ["0", "1", "大于0小于1的数", "任意实数", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929755", "t": 2, "q": "下列关于企业盈利能力指标关系的表述，正确的有？", "a": ["成本费用利润率与销售净利率呈正相关", "销售毛利率是销售净利率的基础", "净资产收益率=总资产净利率×权益乘数", "总资产净利率=销售净利率×总资产周转率", "", ""], "r": "BCD", "e": "这道题主要考查企业盈利能力指标间的关系。A项成本费用利润率与销售净利率无必然正相关；B项销售毛利是净利润基础，所以销售毛利率是销售净利率基础，正确；C项根据杜邦分析法，净资产收益率等于总资产净利率乘以权益乘数，正确；D项总资产净利率等于销售净利率乘以总资产周转率，正确。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556222124032", "t": 2, "q": "经营期某年净现金流量包括（　）。", "a": ["该年利润", "该年利息费用", "该年回收额", "该年摊销额", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556222124033", "t": 2, "q": "下列成本属于无关成本的是（　）", "a": ["共同成本", "差额成本", "机会成本", "不可避免成本", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556222124034", "t": 2, "q": "企业内部控制制度中风险评估的程序包括？", "a": ["风险应对", "目标设定", "风险识别", "风险分析", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556222124035", "t": 2, "q": "与负债筹资相比，发行股票筹资的优点有（　）", "a": ["筹集的是永久性资金", "不会分散公司的控制权", "资金筹集费和占用费较低", "筹集的是主权资金", "", ""], "r": "AD", "e": "发行股票筹集的资金是永久性的，无需归还，且是主权资金，企业可自主调配使用。而发行股票会分散公司控制权，资金筹集费和占用费通常也较高。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556842881024", "t": 3, "q": "如果可转换债券的面值为1000元/张，转换比率为20，则每张债券可以转换成50股普通股。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "转换比率是指每一张可转换债券在既定的转换价格下能转换为普通股股票的数量，本题转换比率为20，意味着每张债券可转换20股普通股，而不是50股。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 财务管理（6）", "n": "基础练习题【含解析】 / 第1章 财务管理（6）", "qs": [{"id": "2034528563314692096", "t": 1, "q": "当净现值（NPV）为零时，说明该投资项目？", "a": ["盈利水平最高", "亏损", "不可行", "恰好达到预定的收益率", "", ""], "r": "D", "e": "净现值（NPV）是按预定收益率将项目各年净现金流量折现后累加的值。NPV为零意味着项目的收益刚好能达到预定收益率。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692097", "t": 1, "q": "企业采用年数综合法计提某项价值为150000元的固定资产的折旧，如果该固定资产预计使用年限为5年，则第2年该固定资产计提的折旧为（　）", "a": ["50000元", "30000元", "60000元", "40000元", "", ""], "r": "D", "e": "年数总和法折旧公式为：年折旧额=（固定资产原值 - 预计净残值）×尚可使用年数÷年数总和。本题未提及净残值，视为0。年数总和为1 + 2 + 3 + 4 + 5 = 15，第2年尚可使用4年，所以第2年折旧额=150000×4÷15 = 40000元。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692098", "t": 1, "q": "现代管理会计中占核心地位的是（　）。", "a": ["规划控制会计", "责任会计", "预测决策会计", "成本会计", "", ""], "r": "C", "e": "现代管理会计以预测决策为核心，预测决策会计为企业规划未来、作出决策提供重要依据。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692099", "t": 1, "q": "可以作为清算财产的是（　）", "a": ["待摊费用", "用于清偿无担保债务时财产", "递延资产", "有担保财产", "", ""], "r": "B", "e": "待摊费用和递延资产本质是费用，不能变现用于偿债，有担保财产需先满足担保债权，用于清偿无担保债务时财产可作为清算财产。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692100", "t": 1, "q": "下列关于财务分析中比率分析法的表述，正确的是？", "a": ["相关比率不能反映不同经济指标之间的关系", "比率分析法不需要结合其他分析方法", "构成比率反映某项经济指标的部分与总体的关系", "效率比率只能反映投入与产出的关系", "", ""], "r": "C", "e": "相关比率能反映不同经济指标间关系，A错；比率分析法需与其他分析方法结合，B错；效率比率不仅能反映投入与产出关系，D表述太绝对。构成比率就是反映某项经济指标部分与总体关系，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692101", "t": 1, "q": "管理会计中的长期投资决策是指（　）。", "a": ["其他投资决策", "证券投资决策", "项目投资决策", "单一投资决策", "", ""], "r": "C", "e": "管理会计中，长期投资决策主要是对项目进行投资分析与决策。证券投资多为短期交易且不属管理会计长期投资核心，单一投资决策表述不准确，其他投资决策范围模糊。所以答案选C。 答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692102", "t": 1, "q": "下列各项不是企业无形资产的是（　）", "a": ["土地所有权", "土地使用权", "著作权", "商标权", "", ""], "r": "A", "e": "企业只能拥有土地使用权，土地所有权归国家或集体，不属于企业的无形资产。而土地使用权、著作权、商标权是企业常见的无形资产。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692103", "t": 1, "q": "内部收益率（IRR）是指？", "a": ["企业期望达到的投资收益率", "市场平均收益率", "使净现值等于0的折现率", "银行贷款利率", "", ""], "r": "C", "e": "内部收益率的定义就是使投资项目净现值等于0的折现率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692104", "t": 1, "q": "下列属于内部控制活动中不相容职务分离控制的是？", "a": ["出纳人员不得兼任稽核、会计档案保管", "建立内部审计制度", "建立健全会计档案保管制度", "明确各岗位办理业务和事项的权限范围", "", ""], "r": "A", "e": "不相容职务分离控制要求企业全面系统分析、梳理业务流程中不相容职务，实施相应分离措施。出纳与稽核、会计档案保管是不相容职务。B是内部监督；C是会计档案管理；D是授权审批控制。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692105", "t": 1, "q": "下列关于企业短期偿债能力指标说法，正确的是？", "a": ["现金比率只考虑货币资金与流动负债的关系", "速动比率不包含存货价值", "流动比率越高，短期偿债能力越强", "营运资金为负说明短期偿债能力弱", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692106", "t": 1, "q": "下列说法正确的是（　）", "a": ["坐支单位应不定期向开户银行报送坐支金额和使用情况", "除了限额内的零星开支可以从库存现金支付外，企业其余的开支必须从银行提取", "企业可以将单位收入的现金以个人名义存入储蓄户", "开户单位收入的现金应于次日送存开户银行", "", ""], "r": "B", "e": "A选项坐支单位应定期报送坐支金额和使用情况；C选项企业不能将单位收入现金以个人名义存入储蓄户；D选项开户单位收入现金应于当日送存开户银行。而企业除限额内零星开支可从库存现金支付外，其余开支须从银行提取，B正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692107", "t": 1, "q": "下属因素中导致保本销售量上升的是（　）", "a": ["销售量上升", "产品单价下降", "固定成本下降", "产品单位变动成本下降", "", ""], "r": "B", "e": "保本销售量=固定成本÷（单价 - 单位变动成本）。单价下降，分母变小，保本销售量上升。A选项销售量与保本销售量概念不同；C选项固定成本下降，保本销售量会下降；D选项单位变动成本下降，保本销售量也会下降。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692108", "t": 1, "q": "下列哪项不决定应收账款机会成本的大小？（　）", "a": ["收款平均间隔时间", "每日信用销售数额", "坏账比率", "同期有价证券利息率", "", ""], "r": "C", "e": "应收账款机会成本与收款时间、赊销额、资金成本率相关，收款平均间隔时间影响资金占用时长，每日信用销售数额影响资金占用规模，同期有价证券利息率是资金成本体现，而坏账比率不直接决定机会成本。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692109", "t": 1, "q": "下列指标中，能综合反映企业盈利能力和营运能力的是？", "a": ["净资产收益率", "总资产净利率", "应收账款周转率", "销售毛利率", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692110", "t": 1, "q": "在计算债券资本成本时，考虑筹资费用和所得税影响后，其计算公式为？", "a": ["债券资本成本=债券年利息×（1-所得税税率）÷债券筹资额", "债券资本成本=债券年利息÷债券筹资额×（1-所得税税率）", "债券资本成本=债券年利息×（1-所得税税率）÷[债券筹资额×（1-筹资费率）]", "债券资本成本=债券年利息÷[债券筹资额×（1-筹资费率）]", "", ""], "r": "C", "e": "计算债券资本成本需考虑利息抵税作用和筹资费用，公式为债券资本成本=债券年利息×（1 - 所得税税率）÷[债券筹资额×（1 - 筹资费率）]。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692111", "t": 1, "q": "在投融资决策中，当两个互斥项目的净现值（NPV）和内部收益率（IRR）出现矛盾时，应优先选择哪个项目？", "a": ["无法确定", "投资回收期短的项目", "IRR大的项目", "NPV大的项目", "", ""], "r": "D", "e": "净现值考虑了资金时间价值和项目整个寿命期的现金流量，更符合股东财富最大化目标，当NPV和IRR矛盾时，应优先选NPV大的项目。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528563314692112", "t": 1, "q": "经营杠杆系数等于1，说明（　）。", "a": ["固定成本大于0", "固定成本小于0", "固定成本等于0", "与固定成本无关", "", ""], "r": "C", "e": "经营杠杆系数=（息税前利润+固定成本）/息税前利润，当经营杠杆系数等于1时，意味着息税前利润+固定成本=息税前利润，所以固定成本等于0。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886400", "t": 1, "q": "某企业的经营杠杆系数为2，财务杠杆系数为1.5，则该企业的总杠杆系数为？", "a": ["3.5", "0.5", "1", "3", "", ""], "r": "D", "e": "总杠杆系数等于经营杠杆系数与财务杠杆系数的乘积，本题中经营杠杆系数为2，财务杠杆系数为1.5，2×1.5 = 3。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886401", "t": 1, "q": "某投资项目于2005年初动工，设当年投产，从投产之日起每年获收益60000元，按年利率6%计算，则预期10年收益的现值为（　）", "a": ["527231元", "441600元", "294400元", "438000元", "", ""], "r": "B", "e": "本题可利用年金现值公式计算预期10年收益的现值。年金现值公式为「test/yiwen_img/importSubject/2034528558185058304.png」，其中P为年金现值，A为每年的等额收付金额，i为年利率，n为期数。已知A = 60000元，「test/yiwen_img/importSubject/2034528558294110208.png」，n = 10，将数据代入公式可得：「test/yiwen_img/importSubject/2034528558424133632.png」=60000\\times7.360087（(P/A,6\\%,10)=7.360087可通过年金现值系数表查得）=441605.22\\approx441600$（元）所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886402", "t": 1, "q": "下列关于净资产收益率的说法，错误的是？", "a": ["该指标越高，表明企业盈利能力越强", "与总资产净利率无关", "反映企业自有资金投资收益水平", "计算公式为净利润÷平均净资产×100%", "", ""], "r": "B", "e": "净资产收益率与总资产净利率有关，净资产收益率=总资产净利率×权益乘数。它反映自有资金投资收益水平，越高说明盈利能力越强，公式是净利润÷平均净资产×100%。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886403", "t": 1, "q": "内部收益率（IRR）法的决策规则是，当内部收益率？", "a": ["大于基准收益率时，项目不可行", "大于资本成本时，项目可行", "小于基准收益率时，项目可行", "小于资本成本时，项目可行", "", ""], "r": "B", "e": "内部收益率大于资本成本或基准收益率时，项目能获得超过成本的收益，项目可行；反之则不可行。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886404", "t": 1, "q": "我国《优先责任公司规范意见》规定，货币出资额不得少于公司法定注册资本最低额的（　）", "a": ["60%", "70%", "50%", "30%", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886405", "t": 1, "q": "下列指标中，可用于分析企业长期偿债能力的是？", "a": ["现金流动负债比率", "营业周期", "存货周转天数", "利息保障倍数", "", ""], "r": "D", "e": "长期偿债能力关注企业偿还长期债务的能力。利息保障倍数反映企业经营收益覆盖利息费用的能力，可体现长期偿债能力。A是短期偿债指标；B、C是营运能力指标。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886406", "t": 1, "q": "在进行投资项目决策时，若两个互斥项目的净现值（NPV）和内部收益率（IRR）结论冲突，应优先选择哪个指标作为决策依据？", "a": ["投资回收期短的项目", "会计收益率高的项目", "内部收益率高的项目", "净现值大的项目", "", ""], "r": "D", "e": "互斥项目决策时，净现值和内部收益率结论冲突，净现值考虑了货币时间价值和项目整个寿命期现金流量，能更准确反映项目对企业价值的增加，所以应优先选净现值大的项目。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886407", "t": 1, "q": "企业进行长期投资决策时，不需要考虑的因素是？", "a": ["投资项目的现金流量", "企业的经营风险", "企业员工的学历结构", "投资项目的使用年限", "", ""], "r": "C", "e": "长期投资决策主要考虑与投资项目收益、风险、时间等相关因素。A现金流量影响收益，D使用年限影响投资期限和回报，B经营风险影响投资风险和收益。而C企业员工学历结构与投资项目本身的收益、风险等决策要素无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886408", "t": 1, "q": "下列项目中，只能在发生当期予以补偿，不可能递延到下期的成本是（　）。", "a": ["直接成本", "间接成本", "产品成本", "期间成本", "", ""], "r": "D", "e": "期间成本是企业经营活动中发生的，与特定产品生产无直接关联，在发生当期就全额计入当期损益，不能递延到下期。而直接成本、间接成本、产品成本有的可随产品销售等递延。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886409", "t": 1, "q": "直接投资的特点是（　）", "a": ["投资回收期短", "与生产经营紧密联系", "投资变现速度快", "流动性强", "", ""], "r": "B", "e": "直接投资是将资金直接用于生产经营，与生产经营紧密相连。而直接投资通常投资回收期长、变现速度慢、流动性弱。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886410", "t": 1, "q": "下列关于存货周转率的表述，正确的是？", "a": ["一般情况下，存货周转率高有助于提高企业盈利能力", "存货周转率越高，表明存货管理越差", "季节性生产企业使用存货周转率指标时无需调整", "存货周转率=营业收入÷平均存货余额", "", ""], "r": "A", "e": "存货周转率高意味着存货周转速度快，存货占用资金少，能降低成本，有助于提高企业盈利能力，A正确；存货周转率越高，存货管理越好，B错误；季节性生产企业存货波动大，使用该指标时需调整，C错误；存货周转率分两种，以成本为基础是营业成本÷平均存货余额，以收入为基础是营业收入÷平均存货余额 ，题干未明确，D表述不严谨。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886411", "t": 1, "q": "国家规定娱乐业的营业税税率范围为（　）", "a": ["3%---20%", "5%---20%", "5%---33%", "3%---5%", "", ""], "r": "B", "e": "国家规定娱乐业营业税税率范围是5% - 20%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886412", "t": 1, "q": "某企业发行债券，面值1000元，票面利率8%，期限5年，每年付息一次，发行价格950元，筹资费率2%，企业所得税税率25%，该债券的资本成本为？", "a": ["6.12%", "6.39%", "8.00%", "8.16%", "", ""], "r": "B", "e": "本题可根据债券资本成本计算公式来求解。### 步骤一：明确债券资本成本计算公式债券资本成本的计算公式为：「test/yiwen_img/importSubject/2034528558558351360.png」，其中「test/yiwen_img/importSubject/2034528558659014656.png」为债券资本成本，I为每年支付的利息，T为企业所得税税率，B为债券筹资额（按发行价格计算），f为筹资费率。### 步骤二：计算每年支付的利息I已知债券面值为1000元，票面利率为「test/yiwen_img/importSubject/2034528558784843776.png」，每年付息一次，则每年支付的利息「test/yiwen_img/importSubject/2034528558931644416.png」（元）。### 步骤三：确定债券筹资额B和筹资费率f、企业所得税税率T债券发行价格为950元，即B = 950元；筹资费率「test/yiwen_img/importSubject/2034528559036502016.png」；企业所得税税率「test/yiwen_img/importSubject/2034528559137165312.png」。### 步骤四：代入公式计算债券资本成本「test/yiwen_img/importSubject/2034528558659014656.png」将I = 80、「test/yiwen_img/importSubject/2034528559137165312.png」、B = 950、「test/yiwen_img/importSubject/2034528559036502016.png」代入公式「test/yiwen_img/importSubject/2034528558558351360.png」可得：「test/yiwen_img/importSubject/2034528559225245696.png」，计算结果与「test/yiwen_img/importSubject/2034528559321714688.png」最为接近。综上，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886413", "t": 1, "q": "下列属于内部控制活动中授权审批控制的是？", "a": ["建立财产日常管理制度和定期清查制度", "明确各岗位办理业务和事项的权限范围", "对经营活动进行分析与评价", "禁止一人保管支付款项所需的全部印章", "", ""], "r": "B", "e": "授权审批控制主要是明确权限范围等。A选项是财产保护控制；C选项是运营分析控制；D选项是不相容职务分离控制。B选项明确各岗位办理业务和事项的权限范围属于授权审批控制。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886414", "t": 1, "q": "速动资产是企业在短期内可变现的资产，它等于（　）", "a": ["流动资产减流动负债", "流动资产减存货", "流动资产加应收账款", "流动资产减短期投资", "", ""], "r": "B", "e": "速动资产是能快速变现的资产，存货的变现速度相对较慢，所以速动资产等于流动资产减去存货。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886415", "t": 1, "q": "下列各项中，不属于企业筹资渠道的是？", "a": ["企业自留资金", "发行股票", "其他企业资金", "国家财政资金", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886416", "t": 1, "q": "滚动预算的基本特点是（　）。", "a": ["预算期不可随意变动", "预算期是连续不断的", "预算期是相对固定的", "预算期与会计年度一致", "", ""], "r": "B", "e": "滚动预算是在编制预算时，将预算期与会计年度脱离开，随着预算的执行不断延伸补充预算，使预算期始终保持为一个固定期间。也就是预算期是连续不断的。A选项预算期可随业务等情况调整；C表述不准确，它强调连续性；D滚动预算与会计年度不一致。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886417", "t": 1, "q": "随着业务量的变动作机动调整的预算是（　）。", "a": ["滚动预算", "零基预算", "弹性预算", "增量预算", "", ""], "r": "C", "e": "弹性预算能依据业务量变动灵活调整，符合题干中随业务量变动作机动调整的描述。而滚动预算是不断滚动更新，零基预算不考虑以往情况重新编制，增量预算是在原有基础上调整。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886418", "t": 1, "q": "如果一家公司的Q比率在很长时间内都大于1，说明（　）", "a": ["资本重置价格偏高", "证券市场的价格偏高", "资本重置价格偏低", "证券市场的价格偏低", "", ""], "r": "B", "e": "Q比率=公司市值/资本重置成本，Q比率大于1意味着公司市值高于资本重置成本，即证券市场价格偏高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886419", "t": 1, "q": "有关产品是否进行深加工决策中，深加工前的半成品成本属于（　）。", "a": ["机会成本", "重置成本", "沉没成本", "估算成本", "", ""], "r": "C", "e": "深加工前的半成品成本是已经发生且无法改变的成本，符合沉没成本定义。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886420", "t": 1, "q": "在标准成本制度下，分析计算各成本项目价格差异的用量基础是（　）。", "a": ["实际产量下的标准用量", "实际产量下的实际用量", "标准产量下的标准用量", "标准产量下的实际用量", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886421", "t": 1, "q": "合伙企业对企业债务承担的是（　）", "a": ["无限连带责任", "有限连带责任", "无限责任", "有限责任", "", ""], "r": "A", "e": "合伙企业中，普通合伙人对合伙企业债务承担无限连带责任。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886422", "t": 1, "q": "某公司普通股目前的股价为10元/股，筹资费率为6%，刚刚支付的每股股利为2元，股利固定增长率为2%，则该企业利用留存收益的资本成本为？", "a": ["22.4%", "22%", "20.4%", "20%", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886423", "t": 1, "q": "下列关于零基预算的说法，正确的是？", "a": ["零基预算有利于调动各部门降低费用的积极性", "零基预算以基期的费用水平为基础", "零基预算适用于所有类型的费用预算编制", "零基预算编制过程简单快捷", "", ""], "r": "A", "e": "零基预算不依赖基期费用水平，一切以零为起点，能促使各部门精打细算，调动其降低费用的积极性。它编制过程复杂，并非适用于所有类型费用预算。B选项以基期费用水平为基础的是增量预算；C说法太绝对；D编制不简单快捷。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886424", "t": 1, "q": "生产单一品种产品企业，保本销售额=（　）", "a": ["固定成本总额÷综合贡献边际率", "保本销售量×单位利润", "固定成本总额÷（单价-单位变动成本）", "固定成本总额÷贡献边际", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886425", "t": 1, "q": "在完全成本法下，期间费用包括（　）。", "a": ["制造费用", "固定制造费用", "管理费用", "变动制造费用", "", ""], "r": "C", "e": "完全成本法下，产品成本包含直接材料、直接人工和全部制造费用。期间费用是指企业本期发生的、不能直接或间接归入营业成本，而是直接计入当期损益的各项费用，主要包括销售费用、管理费用和财务费用。选项A制造费用、B固定制造费用、D变动制造费用都属于产品成本。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886426", "t": 1, "q": "某企业拟进行一项固定资产投资项目决策，设定折现率为12%，有四个方案可供选择。其中甲方案的净现值为100万元，乙方案的内部收益率为10%，丙方案的年金净流量为15万元，丁方案的投资回收期为3年。已知（P/A，12%，5）=3.6048，（P/A，12%，6）=4.1114。最优的投资方案是？", "a": ["丁方案", "乙方案", "甲方案", "丙方案", "", ""], "r": "C", "e": "乙方案内部收益率10%小于折现率12%，不可行；投资回收期未考虑货币时间价值，丁方案不可靠；甲方案净现值100万，丙方案年金净流量15万，假设项目期限5年，丙方案净现值=15×3.6048 = 54.072万，小于甲方案净现值。所以甲方案最优。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886427", "t": 1, "q": "如果完全成本法期末存货吸收的固定性制造费用大于期初存货释放的固定性制造费用，则两种方法营业利润的差额（　）。", "a": ["一定小于零", "一定大于零", "一定等于零", "可能等于零", "", ""], "r": "B", "e": "完全成本法下，期末存货吸收的固定制造费用大于期初存货释放的固定制造费用时，意味着完全成本法下计入当期销售成本的固定制造费用比变动成本法少，所以完全成本法的营业利润会高于变动成本法，二者差额一定大于零。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886428", "t": 1, "q": "长期持有、股利每年不变的股票，其股票内在价值的计算公式是（　）", "a": ["「test/yiwen_img/importSubject/2034528557669158912.png」", "「test/yiwen_img/importSubject/2034528557899845632.png」", "「test/yiwen_img/importSubject/2034528558000508928.png」", "「test/yiwen_img/importSubject/2034528558092783616.png」", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886429", "t": 1, "q": "已知某投资项目的原始投资额为90万元，建设期为2年，投产后第1-4年的NCF=30万元，第5-7年每年NCF=35万元，则该项目包括建设期的静态投资回收期为（　）。", "a": ["4年", "6年", "7年", "5年", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886430", "t": 1, "q": "审计监督在风险控制中的作用主要体现在？", "a": ["决定企业投融资决策", "制定企业预算", "确定企业发展战略", "保证财务信息真实性", "", ""], "r": "D", "e": "审计监督主要是对企业财务等方面进行审查。A选项企业投融资决策由管理层等综合考量决定；B选项企业预算是根据企业战略和经营计划制定；C选项企业发展战略是高层制定。而审计监督可审查财务信息，保证其真实性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886431", "t": 1, "q": "假定对一家企业各项资产的重置成本合计3亿元，其市净率是2倍，那么企业的价值为（　）", "a": ["3亿元", "6亿元", "5亿元", "2亿元", "", ""], "r": "B", "e": "市净率=企业价值/净资产（重置成本可看作净资产），已知重置成本3亿元，市净率2倍，企业价值=市净率×重置成本=2×3 = 6亿元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886432", "t": 1, "q": "在管理会计学中，将\"为实现管理会计目标，合理界定管理会计工作的时空范围，统一管理会计操作方法和程序，组织管理会计工作不可缺少的前提条件\"称为（　）。", "a": ["管理会计术语", "管理会计假设", "管理会计概念", "管理会计原则", "", ""], "r": "B", "e": "管理会计假设是为实现管理会计目标，合理界定管理会计工作的时空范围，统一管理会计操作方法和程序，组织管理会计工作不可缺少的前提条件。而管理会计术语是相关专业用词；管理会计概念是对管理会计的定义等；管理会计原则是指导管理会计工作的准则。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886433", "t": 1, "q": "在管理会计发展史上，第一个被人们使用的管理会计术语是（　）。", "a": ["\"管理的会计\"", "\"传统管理会计\"", "\"现代管理会计\"", "\"管理会计\"", "", ""], "r": "A", "e": "1922年奎因坦斯在《管理的会计：财务管理入门》中首次提出“管理的会计”，这是首个被使用的管理会计术语。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886434", "t": 1, "q": "一定时期每期期末等额的系列收付款项为（　）", "a": ["即付年金", "永续年金", "递延年金", "普通年金", "", ""], "r": "D", "e": "普通年金是指一定时期内每期期末等额收付的系列款项。即付年金是期初收付；永续年金无到期日；递延年金是有递延期。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886435", "t": 1, "q": "关于总资产收益率的说法，正确的是？", "a": ["与总资产周转率成反比", "反映企业全部资产的获利能力", "与企业盈利能力无关", "与销售净利率成反比", "", ""], "r": "B", "e": "总资产收益率是反映企业全部资产获利能力的指标。它等于销售净利率乘以总资产周转率，并非与二者成反比，且它能体现企业盈利能力。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886436", "t": 1, "q": "实际工作中运用最广泛的一种标准成本是（　）。", "a": ["正常标准成本", "理想标准成本", "现实标准成本", "宽松标准成本", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886437", "t": 1, "q": "在计算应收账款周转率时，一般用（　）作为分子。", "a": ["销售成本", "赊销收入净额", "销售收入总额", "现销收入", "", ""], "r": "B", "e": "应收账款周转率反映应收账款周转速度，应是赊销业务产生的应收账款的回收情况，所以用赊销收入净额作分子。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886438", "t": 1, "q": "下列属于内部审计职责的是？", "a": ["制定企业财务制度", "监督企业内部控制执行情况", "代表股东进行财务决策", "对企业财务报表进行审计鉴证", "", ""], "r": "B", "e": "内部审计主要是对企业内部控制等进行监督评价。A选项制定财务制度不是内部审计职责；C选项代表股东进行财务决策并非内部审计工作；D选项对财务报表审计鉴证一般是外部审计的工作。而监督企业内部控制执行情况是内部审计职责。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886439", "t": 1, "q": "某企业投资20万元购入一台设备，预计投产后每年净利润3万元，固定资产年折旧率为10%，则投资回收期为（　）", "a": ["4年", "10年", "5年", "7年", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886440", "t": 1, "q": "内部收益率（IRR）是使投资项目？", "a": ["现值指数等于1的折现率", "净现值大于0的折现率", "现值指数大于1的折现率", "净现值等于0的折现率", "", ""], "r": "D", "e": "内部收益率是使投资项目净现值等于0时的折现率。当净现值为0，此时的现值指数为1。B、C选项描述错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886441", "t": 1, "q": "在内部审计中，对企业内部控制设计和运行的有效性进行评价属于？", "a": ["经济效益审计", "经济责任审计", "财务收支审计", "内部控制审计", "", ""], "r": "D", "e": "内部控制审计就是对企业内部控制设计和运行的有效性进行评价。而经济效益审计关注经济活动效益；经济责任审计针对责任人经济责任履行；财务收支审计侧重于财务收支情况。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886442", "t": 1, "q": "下列关于应收账款周转率的说法，正确的是？", "a": ["应收账款周转天数=365÷应收账款周转率", "应收账款周转率越高，收账越慢", "该指标不能反映应收账款的变现速度", "应收账款周转率与坏账损失无关", "", ""], "r": "A", "e": "应收账款周转天数与应收账款周转率成反比，公式为365÷应收账款周转率，A正确；周转率越高收账越快，B错误；该指标能反映应收账款变现速度，C错误；周转率低可能坏账损失大，二者有关，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886443", "t": 1, "q": "若某个零部件的功能成本比值系数为1.6，则我们对其功能与成本协调情况的评价是（　）", "a": ["根据该数值无法判断其成本与功能的关系", "与该零部件的功能相比，成本支出偏高", "该零部件的成本水平与其功能大体相当", "与该零部件的功能相比，成本支出偏低", "", ""], "r": "D", "e": "功能成本比值系数大于1，意味着功能评价值大于成本，即与功能相比，成本支出偏低。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886444", "t": 1, "q": "下列有关固定资产的说法中，不正确的是（　）", "a": ["固定资产的价值补偿和实物更新是分别进行的", "固定资产循环与生产经营周期具有一致性", "固定资产的投资具有集中性", "固定资产的投资回收具有分散性", "", ""], "r": "B", "e": "固定资产循环周期较长，与生产经营周期不一致，B选项说法错误。而固定资产价值补偿和实物更新分别进行，投资集中、回收分散是其特点。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886445", "t": 1, "q": "对于成本中心来说，考核的主要内容是（　）。", "a": ["直接成本", "可变成本", "可控制成本", "标准成本", "", ""], "r": "C", "e": "成本中心只对成本或费用负责，其考核的主要内容是可控制成本，因为可控成本才是成本中心能够控制和影响的。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886446", "t": 1, "q": "编制全面预算的基础是（　）。", "a": ["生产预算", "直接材料预算", "直接人工预算", "销售预算", "", ""], "r": "D", "e": "全面预算以销售预算为起点，因为其他预算如生产、材料、人工等预算都要根据预计的销售量来编制。所以编制全面预算的基础是销售预算。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886447", "t": 1, "q": "目前通常认为比较合理的财务管理目标是（　）", "a": ["利润最大化", "企业价值最大化", "每股利润最大化", "总产值最大化", "", ""], "r": "B", "e": "利润最大化未考虑资金时间价值和风险等；每股利润最大化同样没考虑风险和时间价值；总产值最大化侧重于生产数量，不适合作为财务管理目标。企业价值最大化考虑了资金时间价值和风险因素，能兼顾各方利益，是较合理的财务管理目标。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886448", "t": 1, "q": "企业内部控制制度的控制环境不包括？", "a": ["预算控制", "企业文化", "治理结构", "人力资源政策", "", ""], "r": "A", "e": "控制环境是对企业内部控制的建立和实施有重大影响的因素的统称，企业文化、治理结构、人力资源政策都属于控制环境范畴。而预算控制是具体的控制活动，并非控制环境。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886449", "t": 1, "q": "在下列部门中，负责核定未完工产品资金定额，对生产部门执行情况进行监督和考核的是（　）", "a": ["人事部门", "生产部门", "财务部门", "销售部门", "", ""], "r": "C", "e": "财务部门负责资金管理相关工作，核定未完工产品资金定额、监督和考核执行情况属于资金管理范畴。人事部门管人事，生产部门管生产，销售部门管销售。所以选C。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886450", "t": 1, "q": "某企业向银行借款，借款年利率为8%，所得税税率为25%，若不考虑筹资费用，该借款的税后资本成本为？", "a": ["8%", "2%", "10%", "6%", "", ""], "r": "D", "e": "税后资本成本=年利率×（1 - 所得税税率），即8%×(1 - 25%) = 6%。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886451", "t": 1, "q": "某企业年初应收账款余额为300万元，年末应收账款余额为500万元，本年销售收入为6000万元，销售毛利率为30%，则该企业应收账款周转次数为？", "a": ["10次", "12次", "8次", "15次", "", ""], "r": "D", "e": "应收账款周转次数=销售收入÷平均应收账款余额，平均应收账款余额=（年初应收账款余额 + 年末应收账款余额）÷2 =（300 + 500）÷2 = 400万元，销售收入6000万元，周转次数=6000÷400 = 15次。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886452", "t": 1, "q": "20世纪50年代以来，管理会计进入了\"以预测决策会计为主，以规划控制会计和责任会计为辅\"的发展阶段，该阶段被称为（　）。", "a": ["现代管理会计阶段", "管理会计过渡阶段", "传统管理会计阶段", "管理会计萌芽阶段", "", ""], "r": "A", "e": "20世纪50年代起管理会计进入现代管理会计阶段，此阶段以预测决策会计为主，规划控制会计和责任会计为辅。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886453", "t": 1, "q": "本厂职工和城乡居民的投资，属于（　）", "a": ["非银行金融机构资金", "民间资金", "企业自留资金", "其他企业单位资金", "", ""], "r": "B", "e": "本厂职工和城乡居民的投资属于民间个人的资金投入。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886454", "t": 1, "q": "审计监督在企业风险控制中的作用不包括？", "a": ["替代内部控制制度", "促进企业合规经营", "发现财务舞弊行为", "评价内部控制有效性", "", ""], "r": "A", "e": "审计监督可促进合规、发现舞弊、评价内控有效性，但它不能替代内部控制制度，内控是企业自身的一套管理机制，审计是一种监督手段。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886455", "t": 1, "q": "企业的清算财产支付清算费以后，应当首先支付（　）", "a": ["无担保债务", "应缴未缴的营业税", "应付未付的职工工资", "应缴未缴的所得税", "", ""], "r": "C", "e": "企业清算财产支付清算费用后，按顺序应先支付应付未付的职工工资。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886456", "t": 1, "q": "某企业长期借款年利率为8%，所得税税率为25%，不考虑筹资费用，其长期借款的资本成本为？", "a": ["10%", "6%", "8%", "2%", "", ""], "r": "B", "e": "长期借款资本成本=年利率×(1 - 所得税税率)，即8%×(1 - 25%) = 6%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886457", "t": 1, "q": "企业在生产过程中，要确定差异、分析差异形成的原因并调整生产消除差异，这属于企业财务管理环节中的（　）", "a": ["财务计划", "财务控制", "财务预测", "财务分析", "", ""], "r": "B", "e": "财务控制是利用有关信息和特定手段，对企业的财务活动施加影响或调节，以实现计划所规定的财务目标的过程，确定差异、分析原因、消除差异符合财务控制的特征。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886458", "t": 1, "q": "下列项目中，不属于利润中心负责范围的是（　）。", "a": ["成本", "收入", "投资效果", "利润", "", ""], "r": "C", "e": "利润中心能控制成本、取得收入并计算利润，但投资效果通常是投资中心负责的，不是利润中心负责范围。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528563318886459", "t": 1, "q": "可以概括了解企业在预算期间盈利能力的预算是（　）。", "a": ["预计利润表", "预计资产负债表", "现金预算", "专门决策预算", "", ""], "r": "A", "e": "预计利润表反映企业在预算期内的盈利情况，能概括了解企业预算期间盈利能力。预计资产负债表反映财务状况；现金预算体现现金收支；专门决策预算针对特定决策项目。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093076992", "t": 2, "q": "在企业投融资决策中，净现值法的优点包括？", "a": ["考虑了货币的时间价值，准确反映项目收益", "计算过程简单，无需复杂假设", "可用于不同规模项目的比较决策", "能直接体现项目给企业带来的价值增值", "", ""], "r": "AD", "e": "净现值法通过将未来现金流量折现，考虑了货币时间价值，能直接体现项目给企业带来的价值增值。其计算有一定复杂度且需假设，不同规模项目比较有局限。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093076993", "t": 2, "q": "变动成本具有的特征是（　）。", "a": ["变动成本总额的不变性", "变动成本总额的正比例变动性", "单位变动成本的不变性", "单位变动成本的反比例变动性", "", ""], "r": "BC", "e": "变动成本是指在特定的业务量范围内，其总额会随业务量的变动而成正比例变动，但单位变动成本不变。A选项变动成本总额不变错误；D选项单位变动成本反比例变动错误。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093076994", "t": 2, "q": "发行股票筹资的优点是（　）", "a": ["能提高公司的信誉", "筹资风险小", "避免控制权集中", "没有固定的股利负担", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093076995", "t": 2, "q": "当投资项目的净现值（NPV）>0时，下列说法正确的有？", "a": ["项目的实际收益率低于预期收益率", "项目的内部收益率（IRR）大于折现率", "项目的现值指数（PI）大于1", "该项目可行", "", ""], "r": "BCD", "e": "净现值NPV>0，意味着项目收益超过预期，内部收益率IRR是使NPV为0的折现率，此时IRR大于所用折现率；现值指数PI=未来现金净流量现值/原始投资额现值，NPV>0则未来现金净流量现值大于原始投资额现值，PI>1；NPV>0说明项目能增加企业价值，项目可行。而A选项中实际收益率应高于预期收益率才会NPV>0。所以答案是BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093076996", "t": 2, "q": "下列项目中，属于年金的有（　）。", "a": ["开办费的每年摊销额", "定期上交的保险费", "按直线法计提的折旧", "按产量法计提的折旧", "", ""], "r": "ABC", "e": "年金是指一定时期内每次等额收付的系列款项。开办费每年摊销额、定期上交保险费、按直线法计提的折旧，它们在一定时期内金额固定且定期发生，符合年金特点；而按产量法计提折旧，其金额随产量变动，不是等额收付。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093076997", "t": 2, "q": "较大的平滑指数可用于（　）情况的销量预测。", "a": ["远期", "长期", "波动较大", "近期", "", ""], "r": "CD", "e": "平滑指数越大，近期实际数对预测数影响越大。波动较大和近期情况都更适合用较大平滑指数来预测，让预测更贴合实际变化。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093076998", "t": 2, "q": "预算调整的原因可能包括？", "a": ["市场环境发生重大变化影响预算执行", "预算编制时存在重大疏漏或错误", "企业战略调整导致预算目标改变", "企业内部组织结构调整影响业务开展", "", ""], "r": "ABCD", "e": "ABCD选项都可能使原本预算不再适用，市场环境变了、预算编制有问题、战略调整、组织结构调整都会影响预算执行，所以都可能是预算调整原因。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093076999", "t": 2, "q": "预算考核的作用包括？", "a": ["评价各部门和员工的预算执行绩效", "激励员工积极完成预算目标", "发现预算管理过程中存在的问题", "为下一期预算编制提供参考依据", "", ""], "r": "ABCD", "e": "预算考核可评估各部门和员工执行情况，激励其完成目标，还能找出预算管理问题，为下期编制提供参考。ABCD 选项均符合预算考核作用。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077000", "t": 2, "q": "下列关于企业财务分析中营运能力指标的说法，正确的有？", "a": ["总资产周转率与企业的盈利能力存在关联", "存货周转率反映存货的周转速度，越高越好", "流动资产周转率越高，表明企业流动资产利用效率越高", "应收账款周转天数越短，说明收账速度越快", "", ""], "r": "ACD", "e": "总资产周转率高，企业经营效率高，盈利能力可能更强，A正确；存货周转率并非越高越好，过高可能存在存货不足等问题，B错误；流动资产周转率高意味着利用效率高，C正确；应收账款周转天数短，收账速度就快，D正确。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077001", "t": 2, "q": "下列项目中，属于完整工业投资项目现金流入量的有（　）。", "a": ["经营成本节约额", "营业收入", "回收流动资金", "回收固定资产余值", "", ""], "r": "BCD", "e": "经营成本节约额不是现金流入，它只是减少了现金流出。营业收入是正常经营的主要现金流入；项目结束时回收流动资金和固定资产余值也是现金流入。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077002", "t": 2, "q": "本量利分析基本内容有（　）", "a": ["安全性分析", "保本点分析", "成本分析", "利润分析", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077003", "t": 2, "q": "从保本图得知（　）", "a": ["保本点右边，成本小于收入，是盈利区", "安全边际越大，盈利面积越大", "在其他因素不变的情况下，保本点越低，盈利面积越大", "销售量一定的情况下，保本点越高，亏损区越大", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077004", "t": 2, "q": "企业预算编制过程中，各部门的职责包括？", "a": ["财务部门负责汇总、审核和平衡各部门预算", "业务部门提供业务活动相关的预算数据和信息", "管理层确定预算编制的总体目标和政策", "内部审计部门监督预算编制过程的合规性", "", ""], "r": "ABCD", "e": "企业预算编制中，财务部门要汇总、审核和平衡各部门预算；业务部门基于自身业务活动提供相关预算数据和信息；管理层确定预算编制总体目标和政策；内部审计部门监督预算编制合规性，ABCD选项均是各部门在预算编制中的职责。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077005", "t": 2, "q": "关于净现值（NPV）和内部收益率（IRR），下列说法正确的有？", "a": ["对于独立方案，NPV>0与IRR>基准收益率结论通常一致", "在互斥方案决策中，应优先选择IRR高的项目", "两者均考虑了货币时间价值", "NPV是绝对数指标，IRR是相对数指标", "", ""], "r": "ACD", "e": "独立方案中NPV＞0时项目可行，IRR＞基准收益率时项目也可行，二者结论通常一致；NPV和IRR都考虑了货币时间价值；NPV是绝对数指标，IRR是相对数指标。而互斥方案决策不能仅依据IRR高来选项目，还需考虑其他因素。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077006", "t": 2, "q": "由于相关范围的存在，使得成本性态具有以下特点，即（　）。", "a": ["暂时性", "可转化性", "正比例变动性", "相对性", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077007", "t": 2, "q": "核定在产品资金定额的因素是（　）", "a": ["产品投资的期量标准", "生产周期", "产品的单位计划生产成本", "在产品成本系数", "", ""], "r": "BCD", "e": "核定在产品资金定额需考虑生产周期、产品单位计划生产成本和在产品成本系数等。生产周期影响资金占用时间，单位计划生产成本决定资金占用规模，在产品成本系数反映在产品实际占用资金比例。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077008", "t": 2, "q": "预算执行过程中的监控内容包括？", "a": ["预算执行过程中出现的偏差及原因", "各项预算指标的实际执行进度", "预算资金的使用情况和流向", "影响预算执行的内外部因素变化", "", ""], "r": "ABCD", "e": "预算执行监控需掌握指标执行进度、资金使用流向，分析偏差及原因，同时关注内外部因素变化。ABCD 选项都属于预算执行过程中应监控的内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077009", "t": 2, "q": "内部审计与外部审计的联系体现在哪些方面？", "a": ["审计目标都包含促进企业健康发展", "都对企业财务收支进行审查", "外部审计可利用内部审计工作成果", "都需要遵循一定的审计准则", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077010", "t": 2, "q": "责任中心按其所负责任和控制范围不同，分为（　）。", "a": ["费用中心", "成本中心", "投资中心", "收入中心", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077011", "t": 2, "q": "在单一的独立投资项目中，当一项投资方案的净现值小于零时，表明该方案（　）。", "a": ["不具备财务可行性", "静态投资回收期小于基础回收期", "净现值率小于零", "内部收益率小于行业基准收益率", "", ""], "r": "ACD", "e": "净现值小于零意味着项目未来现金净流量现值小于原始投资额现值，项目收益无法弥补成本，不具备财务可行性。净现值小于零，净现值率必然小于零，内部收益率也小于行业基准收益率。而静态投资回收期与净现值无直接关联。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077012", "t": 2, "q": "（　）的出现标志管理会计的原始雏形的形成。", "a": ["变动成本法", "标准成本计算制度", "预算控制", "责任考评", "", ""], "r": "BC", "e": "标准成本计算制度和预算控制的出现标志管理会计的原始雏形形成。选项A变动成本法是成本计算方法；选项D责任考评是管理会计发展中的一部分内容。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077013", "t": 2, "q": "企业财务管理的总体目标包括（　）", "a": ["权益资本利润率最大化", "利润最大化", "企业价值最大化", "经济效益最大化", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077014", "t": 2, "q": "下列属于企业盈利能力指标的有？", "a": ["利息保障倍数", "销售毛利率", "成本费用利润率", "净资产收益率", "", ""], "r": "BCD", "e": "利息保障倍数衡量企业长期偿债能力，销售毛利率、成本费用利润率、净资产收益率均反映企业盈利能力。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077015", "t": 2, "q": "下列两个指标之和为1的有（　）", "a": ["安全边际率与贡献边际率", "贡献边际率与保本作业率", "保本作业率与变动成本率", "变动成本率与贡献边际率", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077016", "t": 2, "q": "长期投资按其对象分类为（　）。", "a": ["证券投资", "实物资产投资", "其他投资", "战略性投资", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077017", "t": 2, "q": "下列各项中，属于编制现金预算依据的有（　）。", "a": ["直接材料采购预算", "财务费用和管理费用预算", "直接人工预算和制造费用预算", "产品成本预算", "", ""], "r": "ABC", "e": "现金预算编制需考虑各项涉及现金收支的业务。直接材料采购、直接人工、制造费用、财务和管理费用都会产生现金收支，可作为编制依据。产品成本预算不直接体现现金收支情况。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077018", "t": 2, "q": "已获利息倍数的公式中，利息费用是支付给债权人的全部利息，包括（　）", "a": ["财务费用中的利息", "应付账款利息", "计入流动资产的利息", "计入固定资产的利息", "", ""], "r": "AD", "e": "已获利息倍数公式里的利息费用指支付给债权人的全部利息，包括财务费用中的利息以及资本化利息（如计入固定资产的利息）。应付账款一般无利息，计入流动资产的利息说法不准确。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077019", "t": 2, "q": "审计监督在企业风险防控中的作用涵盖？", "a": ["对内部控制体系的有效性进行评价和改进建议", "替代企业日常的内部控制制度", "通过财务审计发现财务数据造假等舞弊行为", "监督企业是否遵守相关法律法规和政策规定", "", ""], "r": "ACD", "e": "审计监督可评价内控有效性并提改进建议、能发现财务舞弊、监督企业合规，但不能替代日常内控制度。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077020", "t": 2, "q": "滚动预算按滚动时间单位不同，可分为？", "a": ["逐季滚动", "混合滚动", "逐年滚动", "逐月滚动", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077021", "t": 2, "q": "在预算编制中，可能涉及的财务分析指标有？", "a": ["营运能力指标帮助分析预算执行中的资产利用效率", "发展能力指标预测企业预算期后的发展趋势", "盈利能力指标衡量预算期内企业的盈利预期", "偿债能力指标用于评估预算对企业债务负担的影响", "", ""], "r": "ABCD", "e": "ABCD四个选项分别对应了不同财务分析指标在预算编制中的作用，营运能力指标看资产利用效率，发展能力指标预测发展趋势，盈利能力指标衡量盈利预期，偿债能力指标评估债务负担影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077022", "t": 2, "q": " 在运用净现值（NPV）法进行投资项目决策时，下列说法正确的有？", "a": ["计算NPV时需考虑项目整个生命周期的现金流量", "净现值大小与所选取的折现率无关", "若NPV>0，项目在经济上可行", "NPV法可用于独立方案和互斥方案的决策", "", ""], "r": "ACD", "e": "净现值计算要涵盖项目全生命周期现金流量；净现值受折现率影响；NPV>0说明项目收益超成本，经济上可行；NPV法能用于独立和互斥方案决策。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528565093077023", "t": 2, "q": "下列关于管理会计的叙述,正确的有（　）。", "a": ["工作程序性较差", "可以提供未来信息", "以责任单位为主体", "重视管理过程和职工的作用", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528565709639680", "t": 3, "q": "固定成本是指在特定的产量范围内不受产量变动的影响，在一定期间内总额保持固定不变的成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 财务管理（7）", "n": "基础练习题【含解析】 / 第1章 财务管理（7）", "qs": [{"id": "2034528570889605120", "t": 1, "q": "销售收入为20万元，贡献边际率为60%，其变动成本总额为（　）万元。", "a": ["12", "8", "4", "16", "", ""], "r": "B", "e": "贡献边际率=（销售收入 - 变动成本）/销售收入，设变动成本为x，可列方程(20 - x) / 20 = 60%，解得x = 8。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605121", "t": 1, "q": "某企业流动比率为2，速动比率为1，若存货增加，则会导致？", "a": ["流动比率和速动比率均下降", "流动比率和速动比率均上升", "流动比率不变，速动比率下降", "流动比率上升，速动比率下降", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605122", "t": 1, "q": "在进行投资项目决策时，净现值法的缺点是？", "a": ["没有考虑货币时间价值", "不能直接反映项目实际收益率", "不便于投资额不同的项目比较", "计算过于简单", "", ""], "r": "B", "e": "净现值法考虑了货币时间价值，计算并不简单，A、D错误；它能对不同投资额项目比较，C错误；净现值法不能直接反映项目实际收益率，这是其缺点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605123", "t": 1, "q": "零基预算编制的第一步是？", "a": ["划分不可避免费用项目和可避免费用项目", "分配资金", "提出费用预算方案", "对各费用项目进行成本效益分析", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605124", "t": 1, "q": "零基预算编制的第一步是？", "a": ["提出预算期内各种活动内容及费用开支方案", "对方案进行成本效益分析", "划分不可避免费用项目和可避免费用项目", "划分不可延缓费用项目和可延缓费用项目", "", ""], "r": "A", "e": "零基预算编制首先要提出预算期内各种活动内容及费用开支方案，后续才是对方案分析、划分费用项目等步骤。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605125", "t": 1, "q": "在下列各项中，可直接作为差额投资内部收益率计算依据的是（　）。", "a": ["差量净现金流量", "净现金流量", "现金流出量", "现金流入量", "", ""], "r": "A", "e": "差额投资内部收益率是使两个方案净现值之差等于零时的折现率，计算时需依据差量净现金流量。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605126", "t": 1, "q": "某企业应收账款周转天数为60天，存货周转天数为90天，应付账款周转天数为30天，则该企业的现金周转期为？", "a": ["60天", "150天", "180天", "120天", "", ""], "r": "D", "e": "现金周转期=应收账款周转天数+存货周转天数 - 应付账款周转天数，即60 + 90 - 30 = 120天。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605127", "t": 1, "q": "下列对外投资方式中，属于直接投资的是（　）", "a": ["购买优先股股票", "购买权益性证券", "以无形资产投入到其他企业", "购买混合性证券", "", ""], "r": "C", "e": "直接投资是指将资金直接投入投资项目，形成实物资产或购买现有企业资产。以无形资产投入到其他企业是直接参与企业经营，属于直接投资。而购买优先股股票、权益性证券、混合性证券主要是获取证券收益，不直接参与经营，属于间接投资。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605128", "t": 1, "q": "下列关于零基预算编制步骤，排序正确的是？", "a": ["③①②④", "③②①④", "①②③④", "②③①④", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605129", "t": 1, "q": "与股票筹资相比，企业发展债券筹资的主要优点是（　）", "a": ["没有固定的利息负担", "筹资风险小", "能提高公司信誉", "具有财务杠杆作用", "", ""], "r": "D", "e": "债券有固定利息，需到期还本，筹资风险大，且会降低公司信誉，但利息可抵税，能发挥财务杠杆作用。股票无固定利息，筹资风险小，能提高公司信誉。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605130", "t": 1, "q": "全面预算按其涉及的业务活动领域分为财务预算和（　）。", "a": ["现金预算", "业务预算", "生产预算", "销售预算", "", ""], "r": "B", "e": "全面预算按涉及业务活动领域分为财务预算和业务预算。现金预算属于财务预算，生产预算和销售预算属于业务预算。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605131", "t": 1, "q": "与商业信用筹资方式相配合的筹资渠道是（　）", "a": ["银行信贷资金", "政府财政资金", "其他企业单位资金", "非银行金融机构资金", "", ""], "r": "C", "e": "商业信用是企业在正常的经营活动和商品交易中，由于延期付款或预收账款所形成的企业常见的信贷关系，是企业之间的信用行为，所以与之配合的筹资渠道是其他企业单位资金。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605132", "t": 1, "q": "已知单价的灵敏度指标为10%，固定成本的灵敏度指标为2%，则可知单位变动成本的灵敏度指标为（　）。", "a": ["7%", "5%", "3%", "8%", "", ""], "r": "A", "e": "单价、单位变动成本、固定成本灵敏度指标之间存在关系：单价灵敏度 - 单位变动成本灵敏度 = 销售量灵敏度，销售量灵敏度 - 固定成本灵敏度 = 1%。已知单价灵敏度为10%，固定成本灵敏度为2%，可推出销售量灵敏度为3%，进而得出单位变动成本灵敏度为7%。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605133", "t": 1, "q": "当企业采用激进型融资策略时，其短期融资用于满足？", "a": ["全部临时性流动资产和部分永久性流动资产", "部分临时性流动资产", "全部永久性流动资产和部分临时性流动资产", "全部临时性流动资产", "", ""], "r": "A", "e": "激进型融资策略特点是短期融资占比较大，短期融资不仅要满足全部临时性流动资产，还会用于满足部分永久性流动资产。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605134", "t": 1, "q": "关于资金分配，下列说法正确的是（　）", "a": ["仅体现为货币资金推出企业", "是企业资金运动的关键环节", "仅是一次资金运动过程的终点", "既是一次资金运动的终点，又是下次资金运动的起点", "", ""], "r": "D", "e": "资金分配既意味着本次资金运动结束，又为下次资金运动提供基础，所以它既是一次资金运动的终点，又是下次资金运动的起点。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605135", "t": 1, "q": "在投资项目决策中，现值指数法的缺点是？", "a": ["不便于投资额不同的项目比较", "没有考虑货币时间价值", "不能反映项目的实际收益率", "计算过程过于简单", "", ""], "r": "C", "e": "现值指数是未来现金净流量现值与原始投资额现值之比，它考虑了货币时间价值，便于投资额不同的项目比较，计算也不简单。但它不能反映项目实际收益率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605136", "t": 1, "q": "零基预算的编制基础是？", "a": ["现有费用开支水平", "零", "基期的费用水平", "历史资料", "", ""], "r": "B", "e": "零基预算不考虑以往会计期间所发生的费用项目和费用数额，一切以零为出发点。所以其编制基础是零。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605137", "t": 1, "q": "下列不属于管理费用的是（　）", "a": ["印花税", "职工教育费", "销售人员工资和福利费", "诉讼费", "", ""], "r": "C", "e": "管理费用是企业行政管理部门为组织和管理生产经营活动而发生的各项费用。销售人员工资和福利费属于销售费用，不是管理费用。印花税、职工教育费、诉讼费通常计入管理费用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605138", "t": 1, "q": "下列项目中，不能列入变动成本法下产品成本的是（　）。", "a": ["固定性制造费用", "直接材料", "直接人工", "变动性制造费用", "", ""], "r": "A", "e": "变动成本法下产品成本只包含变动生产成本，即直接材料、直接人工和变动性制造费用。固定性制造费用属于期间成本，不计入产品成本。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605139", "t": 1, "q": "当投资项目的净现值等于0时，意味着？", "a": ["项目的实际收益率高于预期收益率", "项目亏损", "项目的现值指数大于1", "项目达到预期收益水平", "", ""], "r": "D", "e": "净现值为0时，说明项目的实际收益率等于预期收益率，即达到预期收益水平。A选项实际收益率应等于而非高于预期收益率；B选项净现值为0并非亏损；C选项现值指数等于1而非大于1。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605140", "t": 1, "q": "下列关于成本-效益原则在内部控制中的应用，正确的是？", "a": ["应在满足控制目标的前提下，尽量降低成本", "控制效益与控制成本没有关系", "为实现控制目标，可无限增加成本", "控制成本越高，控制效果一定越好", "", ""], "r": "A", "e": "成本 - 效益原则要求在内部控制里，以合理成本实现有效控制。A选项符合该原则，即在满足控制目标时尽量降低成本；B选项控制效益与成本有关，并非没关系；C选项不能无限增加成本，要考虑经济性；D选项成本高不代表效果一定好。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605141", "t": 1, "q": "平滑指数法实质上属于（　）。", "a": ["特殊的加权平均法", "平均法", "因果预测分析法", "算术平均法", "", ""], "r": "A", "e": "平滑指数法是对过去不同时期的实际值赋予不同的权数进行加权平均，属于特殊的加权平均法。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605142", "t": 1, "q": "在经济决策中应由中选的最优方案负担的、按所放弃的次优方案潜在收益计算的资源损失，即（　）", "a": ["专属成本", "加工成本", "增量成本", "机会成本", "", ""], "r": "D", "e": "机会成本是指在决策中选择最优方案时，所放弃的次优方案的潜在收益。专属成本是特定决策专属的成本；加工成本是加工过程的成本；增量成本是业务量增加导致的成本增加。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605143", "t": 1, "q": "阶梯式混合成本又可称为（　）", "a": ["曲线式成本", "半变动成本", "延期变动成本", "半固定成本", "", ""], "r": "D", "e": "阶梯式混合成本在一定业务量范围内成本总额固定不变，业务量增长到一定限度，成本总额跳跃到一个新水平，类似半固定成本特征。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605144", "t": 1, "q": "费用总额并不随着产量增减而成比例变动，称为（　）", "a": ["固定费用", "变动费用", "半变动费用", "直接费用", "", ""], "r": "C", "e": "固定费用总额不随产量变动；变动费用随产量成比例变动；半变动费用总额不随产量增减成比例变动；直接费用是与生产产品直接相关的费用。本题描述的是半变动费用特点。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605145", "t": 1, "q": "在进行投资项目决策时，若两个项目相互关联、相互依存，且不能同时并存，则这两个项目属于？", "a": ["互补投资项目", "互斥投资项目", "混合投资项目", "独立投资项目", "", ""], "r": "B", "e": "题干表明两个项目不能同时并存，这符合互斥投资项目的定义。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605146", "t": 1, "q": "应收账款周转次数与应收账款周转天数的关系是？", "a": ["两者呈正相关关系", "两者相等", "两者呈负相关关系", "两者无直接关系", "", ""], "r": "C", "e": "应收账款周转次数=365÷应收账款周转天数，所以周转次数越多，周转天数越少，二者呈负相关关系。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605147", "t": 1, "q": "某企业只生产一种产品，月计划销售600件，单位变动成本6元，月固定成本1000元，欲实现利润1640元，则单价应为（　）", "a": ["10.60", "16.40", "14.60", "10.40", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605148", "t": 1, "q": "在财务分析中，将两期或连续数期的财务报告中的相同指标进行对比，确定其增减变动的方向、数额和幅度，以说明企业财务状况和经营成果的变动趋势的方法是？", "a": ["趋势分析法", "因素分析法", "比较分析法", "比率分析法", "", ""], "r": "A", "e": "题干描述的是通过对比多期相同指标来分析企业财务状况和经营成果变动趋势，这正是趋势分析法的定义。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605149", "t": 1, "q": "若企业销售折扣条件为\"2/20,n/30\"，则付款方在20天内付款，可以享受的优惠为（　）", "a": ["3%", "2%", "10%", "30%", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605150", "t": 1, "q": "责任会计中确定责任成本的最重要的原则是（　）。", "a": ["可控性", "因果性", "变动性", "可避免性", "", ""], "r": "A", "e": "责任成本强调责任中心能控制的成本才纳入其责任范围，可控性是确定责任成本最重要原则。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605151", "t": 1, "q": "净现值随贴现率的变动而（　）。", "a": ["反比例变动", "正比例变动", "反方向变动", "同方向变动", "", ""], "r": "C", "e": "净现值是未来现金净流量现值与原始投资额现值之差，贴现率越高，未来现金净流量的现值就越低，净现值也就越低，所以净现值随贴现率的变动而反方向变动。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605152", "t": 1, "q": "投资中心的利润与其投资额的比率是（　）。", "a": ["部门贡献边际", "剩余收益", "投资报酬率", "内部收益率", "", ""], "r": "C", "e": "投资报酬率是投资中心利润与投资额的比率。A部门贡献边际是销售收入减去变动成本；B剩余收益是利润扣减投资额按预期最低报酬率计算的收益；D内部收益率是使净现值为零的折现率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605153", "t": 1, "q": " 某企业年初存货为100万元，年末存货为120万元，全年营业成本为540万元，则该企业的存货周转率为？", "a": ["4.91次", "5.4次", "6次", "4.5次", "", ""], "r": "A", "e": "存货周转率=营业成本÷平均存货，平均存货=（年初存货 + 年末存货）÷2 =（100 + 120）÷2 = 110万元，存货周转率=540÷110≈4.91次。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605154", "t": 1, "q": "权益乘数反映企业的？", "a": ["营运能力", "盈利能力", "发展能力", "偿债能力", "", ""], "r": "D", "e": "权益乘数=总资产÷股东权益，它衡量了企业负债经营的程度，体现了企业利用债务融资的杠杆程度，与偿债能力密切相关。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605155", "t": 1, "q": "滚动预算按照滚动的时间单位不同，分为逐月滚动、逐季滚动和混合滚动。其中，预算工作量最大的是？", "a": ["混合滚动", "逐季滚动", "逐月滚动", "三种方式工作量相同", "", ""], "r": "C", "e": "逐月滚动是每月都要编制预算，相比逐季滚动和混合滚动，编制频率最高，所以预算工作量最大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605156", "t": 1, "q": "下列关于盈利能力指标的表述，正确的是？", "a": ["净资产收益率不能反映企业权益资本的获利能力", "销售净利率越高，说明企业成本费用控制越差", "营业利润率=营业利润÷营业收入×100%", "总资产收益率与净资产收益率无关", "", ""], "r": "C", "e": "净资产收益率能反映企业权益资本获利能力，A错；销售净利率高说明成本费用控制好，B错；总资产收益率和净资产收益率有关联，D错；营业利润率公式就是营业利润÷营业收入×100%，C对。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605157", "t": 1, "q": "标准成本与预算成本的不同点在于（　）。", "a": ["是一种计划成本", "是一种单位的概念", "是预算总成本", "是一种总额的概念", "", ""], "r": "B", "e": "标准成本是单位概念，是单位产品的标准成本；预算成本一般是总额概念。选项A是二者共同点；C表述不准确；D是预算成本特点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605158", "t": 1, "q": "已知上年利润为200000元，下一年的经营杠杆系数为1.8，预计销售量变动率为20%，则下一年利润预测额为（　）。", "a": ["360000元", "240000元", "200000元", "272000元", "", ""], "r": "D", "e": "经营杠杆系数=利润变动率/销售量变动率，已知经营杠杆系数为1.8，销售量变动率为20%，可算出利润变动率为1.8×20% = 36%。上年利润200000元，下一年利润预测额=200000×(1 + 36%) = 272000元。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605159", "t": 1, "q": "零基预算的编制基础是（　）。", "a": ["历史上费用的最好水平", "基期的费用水平", "零", "国内外同行业费用水平", "", ""], "r": "C", "e": "零基预算是不考虑以往会计期间所发生的费用项目或费用数额，一切以零为出发点编制预算。所以编制基础是零。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605160", "t": 1, "q": "下列关于营运资金管理的说法，错误的是？", "a": ["保持合理的营运资金规模有助于降低财务风险", "营运资金周转率越高越好", "营运资金管理的目标是提高资金使用效率", "营运资金=流动资产-流动负债", "", ""], "r": "B", "e": "营运资金周转率并非越高越好，过高可能意味着企业营运资金不足，可能影响企业正常经营。A选项合理营运资金规模可降低风险；C选项营运资金管理目标就是提高资金效率；D选项是营运资金的正确公式。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605161", "t": 1, "q": "下列各项中，不会影响流动比率的业务是？", "a": ["用现金购买短期债券", "用存货进行对外长期投资", "用现金购买固定资产", "从银行取得长期借款", "", ""], "r": "A", "e": "流动比率=流动资产/流动负债。A选项，现金和短期债券都属流动资产，一增一减总额不变，不影响流动比率；B存货减少流动资产减少，C现金减少流动资产减少，都会使流动比率变化；D取得长期借款使流动资产增加，流动比率变化。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605162", "t": 1, "q": "下列属于内部控制中控制环境要素的是？", "a": ["治理结构", "信息与沟通", "内部审计", "风险评估", "", ""], "r": "A", "e": "控制环境包括治理结构、机构设置及权责分配、内部审计、人力资源政策、企业文化等，信息与沟通、风险评估是内部控制的另外要素。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605163", "t": 1, "q": "利润=（实际销售量一保本销售量）×（　）", "a": ["单位售价", "贡献边际率", "单位利润", "单位贡献边际", "", ""], "r": "D", "e": "利润=安全边际量×单位贡献边际，而安全边际量=实际销售量 - 保本销售量。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605164", "t": 1, "q": "零基预算在编制过程中，对可避免费用项目的处理方式是？", "a": ["按基期费用水平确定支出", "根据成本-效益分析决定是否支出", "优先安排资金", "全部不予支出", "", ""], "r": "B", "e": "零基预算对可避免费用项目，要考虑成本效益，根据成本 - 效益分析决定是否支出。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605165", "t": 1, "q": "在下列选项中，属于标准成本控制系统前提和关键的是（　）。", "a": ["成本差异账务处理", "标准成本的制定", "成本差异的计算", "成本差异的分析", "", ""], "r": "B", "e": "标准成本控制系统中，先得制定标准成本，它是后续成本差异计算、分析及账务处理的基础，所以是前提和关键。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605166", "t": 1, "q": "下列财务指标中属于结构比率指标的是（　）", "a": ["现金比率", "存货与流动资产的比率", "流动比率", "产权比率", "", ""], "r": "B", "e": "结构比率是部分与总体的比率。B选项存货与流动资产的比率，存货是流动资产一部分，体现部分与总体关系，属于结构比率。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605167", "t": 1, "q": "下列财务分析指标中，能反映企业经营增长状况的是？", "a": ["速动比率", "存货周转率", "总资产报酬率", "资本保值增值率", "", ""], "r": "D", "e": "速动比率反映偿债能力；存货周转率体现营运能力；总资产报酬率衡量获利能力；资本保值增值率反映企业资本在经营过程中的增值情况，能体现经营增长状况。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605168", "t": 1, "q": "管理会计是（　）。", "a": ["报账型会计", "经营型会计", "呆账", "活账", "", ""], "r": "B", "e": "管理会计主要服务于企业内部管理，通过对财务信息的深加工和再利用，为企业的规划、决策、控制等提供支持，是经营型会计。而报账型会计是财务会计特点；呆账是指已过偿付期限，经催讨尚不能收回，长期处于呆滞状态的款项；活账并非管理会计相关概念。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605169", "t": 1, "q": "下列关于市净率的表述，正确的是？", "a": ["市净率反映企业的盈利能力", "市净率越低，说明股票投资价值越高", "市净率高意味着企业净资产规模大", "市净率=每股市价÷每股净资产", "", ""], "r": "D", "e": "市净率计算公式是每股市价除以每股净资产；它主要体现股价与每股净资产关系，并非反映盈利能力，A错；市净率低不一定投资价值高，还需综合多因素判断，B错；市净率高不意味着净资产规模大，C错。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605170", "t": 1, "q": "从保本图上得知，对单一产品分析，", "a": ["单位变动成本越大，总成本斜线率越小，保本点越高", "单位变动成本越大，总成本斜线率越大，保本点越高", "单位变动成本越小，总成本斜线率越大，保本点越低", "单位变动成本越小，总成本斜线率越小，保本点越高", "", ""], "r": "B", "e": "总成本线斜率等于单位变动成本，单位变动成本越大，斜率越大；保本点=固定成本/（单价 - 单位变动成本），单位变动成本越大，保本点越高。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605171", "t": 1, "q": "生产多品种产品企业测算综合保本销售额=固定成本总额÷（　）", "a": ["单价-单位变动成本", "单位贡献边际", "贡献边际率", "综合贡献边际率", "", ""], "r": "D", "e": "综合保本销售额是多品种产品企业保本分析的指标，计算时需用固定成本总额除以综合贡献边际率。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605172", "t": 1, "q": "成本无差别点业务量是指能使两方案（　）", "a": ["固定成本相等的业务量", "标准成本相等的业务量", "总成本相等的业务量", "变动成本相等的业务量", "", ""], "r": "C", "e": "成本无差别点业务量就是让两个方案总成本相等时对应的业务量。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605173", "t": 1, "q": "下列属于内部控制中控制活动要素的是？", "a": ["授权审批控制", "人力资源政策", "内部审计", "企业文化", "", ""], "r": "A", "e": "控制活动是企业根据风险评估结果，采用相应的控制措施，将风险控制在可承受度之内。授权审批控制是常见控制活动。人力资源政策属内部环境要素；内部审计是监督要素；企业文化也属于内部环境要素。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605174", "t": 1, "q": "滚动预算按其预算编制和滚动的时间单位不同，若同时使用月份和季度作为滚动单位，属于？", "a": ["逐季滚动", "逐月滚动", "逐年滚动", "混合滚动", "", ""], "r": "D", "e": "混合滚动是同时使用长、短不同的时间单位进行滚动编制预算，这里同时用月份和季度作为滚动单位符合混合滚动特点。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605175", "t": 1, "q": "按照管理会计的解释，成本的相关性是指（　）", "a": ["与决策方案有关的成本特性", "与归集对象有关的成本特性", "与控制标准有关的成本特性", "与资产价值有关的成本特性", "", ""], "r": "A", "e": "成本相关性强调成本与决策的联系，是指与决策方案有关的成本特性。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605176", "t": 1, "q": "半成品成本流转与实物流转相一致，又不需要进行成本还原的成本计算方法是（　）。", "a": ["平行结转分步法", "综合结转分步法", "逐步结转分步法", "分项结转分步法", "", ""], "r": "D", "e": "分项结转分步法是将各步骤所耗用的上一步骤半成品成本，按照成本项目分项转入各该步骤产品成本明细账的各个成本项目中，半成品成本流转与实物流转一致，且不需要成本还原。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605177", "t": 1, "q": "在计算资本成本时，通常需要考虑所得税抵减作用的是？", "a": ["长期借款资本成本", "优先股资本成本", "留存收益资本成本", "普通股资本成本", "", ""], "r": "A", "e": "长期借款利息可在税前扣除，有抵税作用。而优先股、留存收益、普通股的股息或收益分配是税后进行，无抵税作用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605178", "t": 1, "q": "下列关于预算调整的说法，错误的是？", "a": ["预算调整应遵循规定的程序", "预算调整幅度较小时无需审批", "市场环境变化可能导致预算调整", "预算调整应经授权批准", "", ""], "r": "B", "e": "预算调整不论幅度大小都需按规定程序经授权批准，B选项说幅度小无需审批错误。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605179", "t": 1, "q": "下列关于预算调整的表述，错误的是？", "a": ["预算调整可能会影响企业的经营目标实现", "只有重大变化才允许调整预算", "预算调整应遵循规定的程序", "预算调整后需重新审批", "", ""], "r": "B", "e": "预算调整并非只有重大变化才允许，在合理范围内的一些情况也可调整。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605180", "t": 1, "q": "在内部收益率（IRR）的计算中，若每年现金净流量相等，则可采用的方法是？", "a": ["逐步测试法", "比率法", "插值法", "年金法", "", ""], "r": "D", "e": "当每年现金净流量相等时，可利用年金现值系数来计算内部收益率，这种方法就是年金法。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605181", "t": 1, "q": "滚动预算的优点不包括？", "a": ["编制工作量较小", "便于考核预算的执行结果", "能够保持预算的持续性", "有利于充分发挥预算的指导和控制作用", "", ""], "r": "A", "e": "滚动预算要不断调整和补充预算，编制工作量大，A选项不是其优点。滚动预算能保持预算持续性，利于发挥指导和控制作用，也便于考核执行结果。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605182", "t": 1, "q": "现行制度规定，企业的法定盈余公积金已达到注册资本金一定比例时可不再提取。这个比例是（　）", "a": ["25%", "10%", "50%", "60%", "", ""], "r": "C", "e": "企业法定盈余公积金达到注册资本 50%时可不再提取。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605183", "t": 1, "q": "下列各种关于功能成本比值的表述中，正确的是（　）", "a": ["它与产品功能成正比，与产品成本成反比", "它与产品功能成正比，与产品成本也成正比", "它与产品功能成反比，与产品成本也成反比", "它与产品功能成反比，与产品成本成正比", "", ""], "r": "A", "e": "功能成本比值即功能与成本的比值，公式为功能成本比值 = 功能 / 成本，所以它与产品功能成正比，与产品成本成反比。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605184", "t": 1, "q": "在企业内部控制活动中，要求企业全面系统地分析、梳理业务流程中所涉及的不相容职务的控制措施是？", "a": ["不相容职务分离控制", "会计系统控制", "运营分析控制", "授权审批控制", "", ""], "r": "A", "e": "题干明确提到要分析、梳理业务流程中的不相容职务，这正是不相容职务分离控制的要求。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605185", "t": 1, "q": "企业进行长期债券投资，在计算债券价值时，不需要考虑的因素是？", "a": ["债券面值", "债券发行企业规模", "债券期限", "票面利率", "", ""], "r": "B", "e": "债券价值是未来现金流量的现值，与债券面值、票面利率、期限相关，而债券发行企业规模不直接影响债券未来现金流及折现计算。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605186", "t": 1, "q": "管理会计的雏形产生于（　）。", "a": ["19世纪末", "二次世界大战之后", "20世纪上半叶", "20世纪70年代", "", ""], "r": "C", "e": "管理会计雏形产生于20世纪上半叶，当时泰罗的科学管理理论被引入企业管理，为管理会计雏形出现奠定基础。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605187", "t": 1, "q": "在计算普通股资本成本时，常用的方法不包括？", "a": ["风险调整法", "资本资产定价模型法", "债券收益率风险调整模型法", "股利增长模型法", "", ""], "r": "A", "e": "风险调整法是用于计算债务资本成本的方法，资本资产定价模型法、债券收益率风险调整模型法、股利增长模型法常用于计算普通股资本成本。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605188", "t": 1, "q": "计算企业加权平均资本成本时，权重选取市场价值权数的优点是？", "a": ["资料容易取得", "符合资本结构管理要求", "能够反映现时的资本成本水平", "计算结果较为稳定", "", ""], "r": "C", "e": "市场价值权数以各项个别资本的现行市价为基础计算资本权数。优点是能反映现时的资本成本水平，因为现行市价反映了当前实际情况。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605189", "t": 1, "q": "某企业的流动资产由速动资产和存货组成，年末流动资产为100万元，年末流动比率为2，年末速动比率为1，则年末存货余额为？", "a": ["50万元", "40万元", "60万元", "70万元", "", ""], "r": "A", "e": "流动比率=流动资产/流动负债，已知流动资产100万元，流动比率2，可算出流动负债为100÷2 = 50万元。速动比率=速动资产/流动负债，速动比率1，流动负债50万元，可得速动资产为50万元。存货=流动资产 - 速动资产，即100 - 50 = 50万元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605190", "t": 1, "q": "全部产品成本节约率的计算结果为负数时，则表示（　）", "a": ["本企业的产品成本低于行业平均先进水平", "本企业未完成成本计划", "本企业的产品成本高于行业平均先进水平", "本企业完成成本计划", "", ""], "r": "B", "e": "成本节约率为负意味着实际成本高于计划成本，也就是未完成成本计划。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605191", "t": 1, "q": "单利现值的计算公式为（　）", "a": ["「test/yiwen_img/importSubject/2034528566502363136.png」", "「test/yiwen_img/importSubject/2034528566724661248.png」", "「test/yiwen_img/importSubject/2034528566783381504.png」", "「test/yiwen_img/importSubject/2034528566850490368.png」", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605192", "t": 1, "q": "从数额上看，广义营业利润差额应当等于按完全成本法计算的（　）。", "a": ["期末存货成本与期初存货成本中的固定生产成本之差", "期末与期初的存货量之差", "利润超过按变动成本法计算的利润的部分", "生产成本与销货成本之差", "", ""], "r": "A", "e": "广义营业利润差额是完全成本法和变动成本法下营业利润的差异，其根源在于固定生产成本在存货中的分摊不同，表现为期末存货成本与期初存货成本中的固定生产成本之差。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605193", "t": 1, "q": "随机现象的每一种表现或结果称为（　）。", "a": ["随机事件", "随机变量", "概率", "期望值", "", ""], "r": "A", "e": "随机现象的每一种表现或结果就是随机事件。随机变量是表示随机现象各种结果的变量；概率是衡量事件发生可能性大小；期望值是随机变量的均值。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605194", "t": 1, "q": "可以提议召开临时股东会议的是（　）", "a": ["代表四分之一以上表决权的股东", "四分之一以上的董事", "三分之一以上的监事", "四分之一的股东", "", ""], "r": "A", "e": "代表十分之一以上表决权的股东、三分之一以上的董事、监事会或者不设监事会的公司的监事提议可召开临时股东会议。选项中只有代表四分之一以上表决权的股东符合要求。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605195", "t": 1, "q": "单价单独变动时，会使安全边际（　）", "a": ["不变", "反方向变动", "不一定变动", "同方向变动", "", ""], "r": "D", "e": "单价上升，保本点下降，安全边际上升；单价下降，保本点上升，安全边际下降，所以单价与安全边际同方向变动。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528570889605196", "t": 1, "q": " 下列属于企业盈利能力核心指标的是？", "a": ["净资产收益率", "权益乘数", "流动比率", "总资产周转率", "", ""], "r": "A", "e": "净资产收益率反映股东权益的收益水平，用以衡量公司运用自有资本的效率，是企业盈利能力的核心指标。权益乘数反映财务杠杆；流动比率衡量短期偿债能力；总资产周转率衡量运营效率。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269760", "t": 2, "q": " 下列属于企业盈利能力分析指标的组合有？", "a": ["毛利率、成本费用利润率", "总资产收益率、每股收益", "流动比率、速动比率", "销售净利率、净资产收益率", "", ""], "r": "ABD", "e": "盈利能力分析指标是衡量企业赚取利润能力的指标。A选项中毛利率体现产品盈利空间，成本费用利润率反映成本投入的盈利效果；B选项总资产收益率衡量资产运营获利能力，每股收益反映普通股获利水平；D选项销售净利率体现销售收入盈利情况，净资产收益率衡量自有资本获利能力。而C选项流动比率和速动比率是衡量企业短期偿债能力的指标。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269761", "t": 2, "q": "无形资产按照取得时的实际成本计价，计价的对象包括（　）", "a": ["投资者作为资本金或者合作条件投入的无形资产", "自行开发并且依法申请取得的无形资产", "接受捐赠的无形资产", "购入的无形资产", "", ""], "r": "ABCD", "e": "这几种情况取得的无形资产都需按取得时实际成本计价。答案涵盖ABCD选项所描述的取得无形资产的情形。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269762", "t": 2, "q": "从完整的意义看，企业项目的投资主体类型应当包括（　）。", "a": ["政府管理部门主体", "咨询机构主体", "自有资金提供者主体", "企业法人主体", "", ""], "r": "CD", "e": "企业项目投资主体是指进行投资的一方，企业法人可作为投资主体开展项目投资；自有资金提供者为项目提供资金，也属于投资主体。政府管理部门主要是监管等职能，咨询机构主要提供咨询服务，并非投资主体。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269763", "t": 2, "q": "有一笔递延年金，前两年没有现金流入，后四年每年年初流入100万元，折现率为10%，则关于其现值的计算表达式正确的有（　）。", "a": ["100×[（P/A，10%，3）＋1]×（P/S，10%，2）", "100×[（P/A，10%，6）－（P/A，10%，2）]", "100×[（S/A，10%，5）－1]×（P/S，10%，6）", "100×（P/S，10%，2）＋100×（P/S，10%，3）＋100×（P/S，10%，4）＋100×（P/S，10%，5）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269764", "t": 2, "q": "下列关于财务分析指标中偿债能力指标的说法，正确的有？", "a": ["现金流动负债比率越大，表明企业短期偿债能力越强", "速动比率中扣除存货是因为存货变现能力不稳定", "产权比率与资产负债率都能反映企业长期偿债能力", "流动比率过高可能意味着企业资金闲置或存货积压", "", ""], "r": "ABCD", "e": "现金流动负债比率体现经营现金净流量对流动负债的保障程度，越大短期偿债能力越强；存货变现受多种因素影响不稳定，所以速动比率扣除存货；产权比率和资产负债率都能衡量长期偿债能力；流动比率过高可能是资金未有效利用或存货过多。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269765", "t": 2, "q": "下列各项中，属于可能导致某投资项目的固定资产投资与固定资产原值相等的原因有（　）。", "a": ["全部投资均为自有资金", "未发生资本化利息", "建设期为零", "全部投资均于建设起点一次投入", "", ""], "r": "BCD", "e": "固定资产原值=固定资产投资+建设期资本化利息。若固定资产投资与固定资产原值相等，意味着建设期资本化利息为零。选项B未发生资本化利息直接符合；选项C建设期为零，就不存在建设期资本化利息；选项D全部投资均于建设起点一次投入，建设期无额外资金占用产生利息，也不会有建设期资本化利息。而选项A全部投资为自有资金与是否有资本化利息无关。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269766", "t": 2, "q": "下列各项中，不可能导致狭义营业利润差额发生的因素包括（　）。", "a": ["变动生产成本", "单价", "管理费用", "销售费用", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269767", "t": 2, "q": "零基预算的编制步骤包含哪些？", "a": ["对各项费用进行成本-效益分析", "划分不可避免费用项目和可避免费用项目", "提出预算期内各项费用的预算方案", "根据分析结果分配资金，编制预算", "", ""], "r": "ABCD", "e": "零基预算编制先提出预算期费用方案（C），接着对费用成本 - 效益分析（A），再划分不可避免和可避免费用（B），最后依分析结果分配资金编预算（D）。答案ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269768", "t": 2, "q": "固定性制造费用成本差异可分解为（　）。", "a": ["预算差异", "生产能力差异", "能量差异", "效率差异", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269769", "t": 2, "q": "应收账款的功能有（　）", "a": ["减少产品存货", "保证材料的及时供应", "保持流动资金形态的多样性", "扩大产品销售", "", ""], "r": "AD", "e": "应收账款能让企业在信用交易下扩大产品销路，增加销售，同时存货相应减少。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269770", "t": 2, "q": "成本性态分析的方法有（　）。", "a": ["高低点法", "历史资料分析法", "技术测定法", "直接分析法", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269771", "t": 2, "q": "在企业审计监督中，外部审计的主要工作内容包括？", "a": ["评价企业内部控制有效性", "对企业财务报表进行审计鉴证", "参与企业内部管理制度的制定", "审查企业经济活动的合法性", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269772", "t": 2, "q": "企业规定资产的价值周转的特点有（　）", "a": ["固定资产投资的集中性", "规定资产投资回收的分散性", "固定资产价值补偿和实物更新分别进行", "固定资产循环与生产经营周期具有一致性", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269773", "t": 2, "q": "获利能力比率包括（　）", "a": ["销售净利润率", "基本获利率和市盈率", "每股收益和每股股利", "实收资本利润率", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269774", "t": 2, "q": "根据不同情况将制造费用分摊落实到各成本责任中心的方法有（　）。", "a": ["直接计入", "按承受能力基础进行分配", "按责任基础进行分配", "按受益基础进行分配", "", ""], "r": "ACD", "e": "制造费用分摊到各成本责任中心可直接计入，也可按责任基础和受益基础分配，按承受能力基础分配不是制造费用分摊到成本责任中心的方法。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269775", "t": 2, "q": "投资风险价值指投资者由于冒着风险进行投资而获得的超过资金时间价值的额外收益，又称投资风险收益。根据对未来情况的掌握程度，投资决策可分为（　）", "a": ["风险性投资决策", "不确定性投资决策", "确定性投资决策", "长期投资决策", "", ""], "r": "ABC", "e": "投资决策依据对未来情况掌握程度，可分为确定性（未来情况已知）、风险性（能估计概率）、不确定性（不能估计概率）投资决策。D选项长期投资决策与掌握程度无关。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269776", "t": 2, "q": "经营杠杆系数通过以下公式计算:（　）。", "a": ["业务量变动率／利润变动率", "销售量的利润灵敏度×100", "基期贡献边际／基期利润", "利润变动率／业务量变动率", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269777", "t": 2, "q": "企业的筹资渠道包括（　）", "a": ["银行信贷资金", "企业自留资金", "政府财政资金", "居民个人资金", "", ""], "r": "ABCD", "e": "企业筹资渠道多样，银行信贷资金是常见的外部资金来源；企业自留资金是内部积累的资金；政府财政资金可支持企业发展；居民个人资金也能通过投资等方式成为企业筹资来源。ABCD选项均属于企业筹资渠道。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269778", "t": 2, "q": "下列各项中，属于未来成本的有（　）。", "a": ["变动成本", "责任成本", "固定成本", "标准成本", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269779", "t": 2, "q": "零基预算在实际应用中的局限性表现为？", "a": ["编制过程耗时耗力，成本较高", "不适用于具有稳定成本习性的项目预算编制", "可能导致部门之间为争夺资源而夸大费用需求", "对预算编制人员的专业要求较高", "", ""], "r": "ACD", "e": "零基预算编制时一切从零开始，要重新分析各项活动和费用，所以编制过程复杂耗时耗力、成本高；各部门为争取更多资源可能夸大费用需求；且其编制需要专业知识和技能，对编制人员专业要求高。而零基预算适用于不经常发生的或预算编制基础变化较大的预算项目，并非不适用于稳定成本习性项目，B选项错误。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269780", "t": 2, "q": "根据固定资产的经济性质和价值周转的特点，企业固定资产管理的基本要求是（　）", "a": ["正确核定固定资产需用量", "正确计算固定资产折旧额，有计划地计提固定资产折旧", "提高固定资产的完好程度和利用效果", "进行固定资产投资的预测", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269781", "t": 2, "q": "财务管理的特点具体表现为（　）", "a": ["灵敏度低", "综合性强", "涉及面广", "专业性强", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269782", "t": 2, "q": "企业在进行投融资决策时，影响资本成本的因素包括？", "a": ["宏观经济环境，如市场利率波动", "融资方式，不同融资渠道成本有差异", "企业经营风险和财务风险水平", "投资项目的预期收益", "", ""], "r": "ABC", "e": "宏观经济环境影响市场利率，从而影响资本成本；不同融资方式成本不同；企业经营和财务风险水平也会影响投资者要求的回报率即资本成本。而投资项目预期收益是投资决策考虑内容，非影响资本成本因素。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269783", "t": 2, "q": "下列项目中属于无形资产的有（　）", "a": ["管理用具", "商誉", "土地使用权", "非专利技术", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269784", "t": 2, "q": "下列关于预算控制的说法，正确的有？", "a": ["预算一经确定，不得随意调整", "预算控制需要全员参与", "预算控制是企业内部控制的重要手段", "预算考核是预算控制的重要环节", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269785", "t": 2, "q": "以下属于半变动成本的有（　）。", "a": ["煤气费", "电话费", "折旧费", "水电费", "", ""], "r": "ABD", "e": "半变动成本是有一个初始固定基数，在此基础上随业务量成正比例变动。煤气费、电话费、水电费都有基本费用（固定部分），然后根据使用量（业务量）正比例变动。而折旧费一般是固定成本，不随业务量变动。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269786", "t": 2, "q": "成本按习性进行分类，变动成本包括（　）。", "a": ["变动制造费用", "直接材料", "固定制造费用", "变动生产成本", "", ""], "r": "ABD", "e": "变动成本是随业务量变动而正比例变动的成本。A变动制造费用、B直接材料、D变动生产成本都随产量等业务量变动而变动，属于变动成本；C固定制造费用不随业务量变动，是固定成本。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269787", "t": 2, "q": "成本费用责任中心按管理范围划分为（　）", "a": ["生产车间或分厂", "仓库", "管理部门", "车间---班组---个人成本中心", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269788", "t": 2, "q": "下列说法不正确的有（　）。", "a": ["基本标准成本不宜用来直接评价工作效率和成本控制的有效性", "现行标准成本不可以用来对成本计价", "理想标准成本可以作为考核的依据", "正常标准成本可以调动职工的积极性，在标准成本系统中广泛使用", "", ""], "r": "BC", "e": "现行标准成本可用于成本计价；理想标准成本要求太高，不能作为考核依据。基本标准成本不按各期实际修订，不宜直接评价工作效率和成本控制有效性；正常标准成本能调动职工积极性，广泛使用。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269789", "t": 2, "q": "在财务分析中，比较分析法的应用形式有？", "a": ["本企业指标与同行业平均水平对比", "不同财务比率之间对比", "本期实际指标与上期实际指标对比", "实际指标与计划指标对比", "", ""], "r": "ACD", "e": "比较分析法可从不同角度对比，A是企业与行业比，C是本期与上期比，D是实际与计划比，这些都属于比较分析法应用形式；而B不同财务比率对比本质也是一种比较，但常归类于比率分析法。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269790", "t": 2, "q": "计算加权平均资本成本时，权重的确定方法有哪些？", "a": ["账面价值权数", "目标价值权数", "历史价值权数", "市场价值权数", "", ""], "r": "ABD", "e": "计算加权平均资本成本时，常用权重确定方法有账面价值权数、目标价值权数、市场价值权数，不存在历史价值权数这种方法。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528572609269791", "t": 2, "q": "责任中心考核的指标包括（　）。", "a": ["产品成本", "利润", "剩余收益", "投资报酬率", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528573230026752", "t": 3, "q": "对一项房地产进行估价时，如果系统的估价方法成本过高，可以根据财务管理的信号传递原则，观察近期类似房地产买卖双方的交易价格，将其作为估价的基础。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "信号传递原则要求根据市场信号传递的信息来采取行动。近期类似房地产交易价格能反映市场情况，在系统估价成本过高时，可作为估价基础。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 财务管理（8）", "n": "基础练习题【含解析】 / 第1章 财务管理（8）", "qs": [{"id": "2034528581316644864", "t": 1, "q": "根据成本按习性分类，（　）不随产量的变化而变化。", "a": ["单位固定制造费用", "变动生产成本总额", "固定制造费用总额", "单位销售成本", "", ""], "r": "C", "e": "固定成本是指在一定时期和一定业务量范围内，不受业务量增减变动影响而保持不变的成本。固定制造费用总额属于固定成本，不随产量变化。单位固定制造费用随产量增加而降低；变动生产成本总额随产量变化而变化；单位销售成本受多种因素影响，也会因产量等变动。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644865", "t": 1, "q": "在不改变企业生产经营能力的前提下，采取降低固定成本总额的措施通常是指降低（　）。", "a": ["半固定成本", "酌量性固定成本", "单位固定成本", "约束性固定成本", "", ""], "r": "B", "e": "酌量性固定成本可根据企业经营方针由管理当局短期决策改变，能在不改变生产经营能力前提下降低；约束性固定成本与生产经营能力关联，短期内难降低；半固定成本通常呈阶梯式变化，较难单纯降低；单位固定成本随业务量变化，不是降低固定成本总额的措施。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644866", "t": 1, "q": "零基预算的缺点是？", "a": ["编制工作量大", "不利于调动各部门降低费用的积极性", "预算编制成本低", "不适合于业务量水平经常变动的企业", "", ""], "r": "A", "e": "零基预算是一切以零为出发点编制预算，需对每个项目进行成本效益分析，所以编制工作量大。B选项，零基预算有利于调动各部门降低费用积极性；C选项，其预算编制成本高；D选项，零基预算适用于业务量水平经常变动的企业。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644867", "t": 1, "q": "在计算资本成本时，不需要考虑所得税抵减作用的是？", "a": ["发行普通股资本成本", "发行债券资本成本", "留存收益资本成本", "长期借款资本成本", "", ""], "r": "A", "e": "利息费用在计算所得税时可税前扣除，有抵税作用。债券、长期借款有利息支出，存在抵税效应。而普通股和留存收益都无利息支出，不涉及抵税。本题问不考虑所得税抵减作用的，A和C都符合，但题目为单选题，一般优先选普通股，因为留存收益可看作内部普通股。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644868", "t": 1, "q": "在计算债券资本成本时，债券利息的抵税作用体现在？", "a": ["减少企业所得税费用", "减少债券利息支出", "降低债券筹资总额", "增加债券发行价格", "", ""], "r": "A", "e": "债券利息可在税前扣除，能减少企业应纳税所得额，进而减少企业所得税费用，体现了抵税作用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644869", "t": 1, "q": "某企业的总资产收益率为8%，权益乘数为2，则该企业的净资产收益率为？", "a": ["4%", "8%", "24%", "16%", "", ""], "r": "D", "e": "根据净资产收益率=总资产收益率×权益乘数，已知总资产收益率为8%，权益乘数为2，可得净资产收益率=8%×2 = 16%。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644870", "t": 1, "q": "企业进行长期债券投资，在计算债券价值时，不需要考虑的因素是？", "a": ["债券面值", "债券票面利率", "债券发行企业的员工数量", "市场利率", "", ""], "r": "C", "e": "债券价值与债券本身属性（面值、票面利率）及市场环境（市场利率）相关，而发行企业员工数量对债券价值无直接影响。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644871", "t": 1, "q": "应收账款周转率指标的高低，不能直接反映企业的？", "a": ["盈利能力", "收账速度", "短期偿债能力", "信用政策", "", ""], "r": "A", "e": "应收账款周转率主要体现收账速度、短期偿债能力以及反映信用政策情况。而盈利能力受多种因素影响，不是应收账款周转率能直接反映的。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644872", "t": 1, "q": "按企业清算的不同性质，可分为（　）", "a": ["自愿清算、行政清算和司法清算", "期满解散清算和提前解散清算", "完全解散清算和非完全解散清算", "解散清算和破产清算", "", ""], "r": "A", "e": "企业清算按不同性质，可分为自愿清算（企业自行决定）、行政清算（由行政机关组织）和司法清算（依法院判决）。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644873", "t": 1, "q": "如果当年通货膨胀率为18%，企业证券投资收益率为15%，则该企业面临的投资风险是（　）", "a": ["购买力风险", "利率风险", "市场风险", "决策风险", "", ""], "r": "A", "e": "通货膨胀率高于证券投资收益率，意味着货币购买力下降，这体现的是购买力风险。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644874", "t": 1, "q": " 企业内部控制的目标不包括？", "a": ["合理保证企业经营管理合法合规", "资产安全完整", "提高经营效率和效果", "确保企业实现利润最大化", "", ""], "r": "D", "e": "企业内部控制目标包括合理保证经营管理合法合规、资产安全完整、财务报告及相关信息真实完整、提高经营效率和效果、促进企业实现发展战略。利润最大化受市场等多种因素影响，不是内部控制能确保实现的。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644875", "t": 1, "q": "在分析企业短期偿债能力时，通常认为合理的速动比率是？", "a": ["0.5", "1.5", "2", "1", "", ""], "r": "D", "e": "一般认为，速动比率维持在1较为合理，它表明企业每1元流动负债就有1元易于变现的速动资产来抵偿。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644876", "t": 1, "q": "下列会使企业流动资产周转天数增加的业务是？", "a": ["加速存货周转", "收回应收账款", "购买大量原材料并积压", "增加应付账款付款期", "", ""], "r": "C", "e": "流动资产周转天数增加意味着流动资产周转变慢。A加速存货周转会使周转加快；B收回应收账款不影响流动资产整体周转效率；C购买大量原材料并积压，使存货占用资金时间变长，流动资产周转变慢，周转天数增加；D增加应付账款付款期是流动负债相关，与流动资产周转天数无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644877", "t": 1, "q": "下列属于偿债能力辅助指标的是？", "a": ["总资产增长率", "存货周转率", "利息保障倍数", "销售净利率", "", ""], "r": "C", "e": "利息保障倍数反映企业支付利息的能力，是偿债能力辅助指标；总资产增长率衡量资产增长情况；存货周转率体现营运能力；销售净利率反映盈利能力。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644878", "t": 1, "q": "下列各项中，会使企业速动比率提高的是？", "a": ["用固定资产对外投资", "销售产成品", "收回应收账款", "购买短期债券", "", ""], "r": "B", "e": "速动比率=速动资产/流动负债。A选项用固定资产对外投资，不影响速动资产和流动负债；C选项收回应收账款，速动资产内部一增一减，总额不变；D选项购买短期债券，同样是速动资产内部变化。B选项销售产成品，存货减少，货币资金增加，存货不属于速动资产，货币资金属于，速动资产增加，流动负债不变，速动比率提高。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644879", "t": 1, "q": " 在评估企业短期偿债能力时，最能反映企业直接偿付流动负债能力的指标是？", "a": ["资产负债率", "流动比率", "现金比率", "速动比率", "", ""], "r": "C", "e": "现金比率通过现金类资产与流动负债对比，能直接体现企业直接偿付流动负债能力。资产负债率衡量长期偿债能力；流动比率和速动比率虽反映短期偿债能力，但不如现金比率直接体现直接偿付能力。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644880", "t": 1, "q": "在变动成本法下，固定性制造费用应当列作（　）。", "a": ["产品成本", "直接成本", "非生产成本", "期间成本", "", ""], "r": "D", "e": "变动成本法下，固定性制造费用不随产量变动而变动，与特定会计期间相联系，应作为期间成本处理。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644881", "t": 1, "q": " 资金运动的基础环节是（　）", "a": ["资金投放", "资金筹集", "资金分配", "资金耗费", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644882", "t": 1, "q": "可比产品成本计划降低额与下列哪一因素无关？（　）", "a": ["计划单位成本", "全部可比产品计划产量", "半变动费用", "上年平均单位成本", "", ""], "r": "C", "e": "可比产品成本计划降低额=全部可比产品计划产量×（上年平均单位成本 - 计划单位成本），与计划单位成本、全部可比产品计划产量、上年平均单位成本都有关，和半变动费用无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644883", "t": 1, "q": " 流动比率为1.5时，若企业用现金偿还一笔应付账款，流动比率会？", "a": ["上升", "下降", "不变", "无法确定", "", ""], "r": "A", "e": "流动比率=流动资产/流动负债。用现金偿还应付账款，流动资产和流动负债等额减少。因为原流动比率1.5＞1，分子分母等额减少会使比值上升。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644884", "t": 1, "q": "下列关于审计监督的表述，错误的是？", "a": ["内部审计可以促进企业改善经营管理", "审计监督有助于防范企业财务风险", "审计监督只能由注册会计师实施", "外部审计独立性高于内部审计", "", ""], "r": "C", "e": "审计监督分为内部审计和外部审计，内部审计由企业内部审计机构实施，外部审计可由注册会计师等实施，并非只能由注册会计师实施。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644885", "t": 1, "q": "下列反映企业营运能力的财务指标是？", "a": ["销售净利率", "资产负债率", "存货周转天数", "利息保障倍数", "", ""], "r": "C", "e": "营运能力主要衡量企业利用资产运营的效率。存货周转天数反映存货周转速度，体现企业存货管理和运营能力。A销售净利率反映盈利能力，B资产负债率和D利息保障倍数反映偿债能力。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644886", "t": 1, "q": "在下列各项中，能够同时以实物量指标和价值量指标分别反映企业经营收入和相关现金收支的预算是？", "a": ["生产预算", "产品成本预算", "现金预算", "销售预算", "", ""], "r": "D", "e": "销售预算既能用实物量指标体现销售数量，又能用价值量指标反映销售收入和现金收支。生产预算只有实物量指标；产品成本预算主要是价值量指标；现金预算主要是价值量指标。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644887", "t": 1, "q": "下列指标中，属于营运能力分析的是？", "a": ["销售净利率", "权益乘数", "已获利息倍数", "流动资产周转率", "", ""], "r": "D", "e": "营运能力分析主要衡量企业运营资产的效率。选项A销售净利率是盈利能力指标；B权益乘数反映财务杠杆，用于偿债能力分析；C已获利息倍数也是偿债能力指标；D流动资产周转率体现流动资产运营效率，属于营运能力分析指标。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644888", "t": 1, "q": "当采用内部收益率法对多个互斥项目进行决策时，应选择？", "a": ["内部收益率最大的项目", "净现值最大且大于0的项目", "内部收益率最小的项目", "净现值最小且小于0的项目", "", ""], "r": "B", "e": "互斥项目决策，内部收益率法不能单纯选IRR最大的，而应选净现值最大且大于0的项目才能实现收益最大化。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644889", "t": 1, "q": "当净现值（NPV）=0时，意味着项目的？", "a": ["实际收益率大于折现率", "与折现率无关", "实际收益率小于折现率", "实际收益率等于折现率", "", ""], "r": "D", "e": "净现值是将项目未来现金流量折现后与初始投资的差值。当净现值为0，说明项目按给定折现率折现后的收益刚好能收回初始投资，意味着项目实际收益率等于折现率。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644890", "t": 1, "q": "战略管理的首要环节是（　）。", "a": ["战略实施", "战略决策", "战略制定", "战略分析", "", ""], "r": "D", "e": "战略分析是战略管理的首要环节，它为后续的战略制定、决策和实施提供基础和依据。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644891", "t": 1, "q": "采用滚动预算法编制预算的主要缺点是？", "a": ["预算缺乏连续性", "不能适应企业经营活动变化", "不利于对预算执行情况进行考核", "预算编制工作量大", "", ""], "r": "D", "e": "滚动预算法是持续滚动编制预算，能保持预算连续性、适应经营活动变化且利于考核。但它需不断调整和补充预算，导致预算编制工作量大。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644892", "t": 1, "q": "企业进行投资项目决策时，若多个方案的净现值均大于0且原始投资额不同，应优先选择？", "a": ["内部收益率最高的方案", "现值指数最大的方案", "净现值最大的方案", "投资回收期最短的方案", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644893", "t": 1, "q": "与发行债券和银行贷款等筹资方式相比，租赁筹资的主要缺点是（　）", "a": ["筹资速度慢", "资金成本高", "财务风险大", "限制条件多", "", ""], "r": "B", "e": "租赁筹资租金通常比银行借款或发行债券所负担的利息高很多，所以资金成本高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644894", "t": 1, "q": "企业速动比率大于1，若赊购原材料，会导致？", "a": ["营运资金减少", "流动比率下降", "速动比率上升", "速动比率下降", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644895", "t": 1, "q": "若某企业的利息保障倍数小于1，则表明该企业？", "a": ["存在支付利息的困难", "短期偿债能力很强", "长期偿债能力很强", "盈利能力很强", "", ""], "r": "A", "e": "利息保障倍数是衡量企业支付负债利息能力的指标，小于1意味着息税前利润不足以支付利息，说明企业存在支付利息的困难。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644896", "t": 1, "q": "下列关于企业内部控制监督的表述，正确的是？", "a": ["内部控制自我评价不属于内部监督范畴", "日常监督不需要形成书面报告", "专项监督针对特定业务或事项进行", "内部监督只能由内部审计部门负责", "", ""], "r": "C", "e": "内部控制自我评价属于内部监督范畴，A错误；日常监督通常应形成书面报告，B错误；内部监督并非只能由内部审计部门负责，企业各部门都可参与，D错误；专项监督就是针对特定业务或事项开展的。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644897", "t": 1, "q": "下列关于零基预算优缺点的说法，正确的是？", "a": ["预算编制成本低", "有利于调动各部门降低费用的积极性", "编制工作量小", "容易受历史期经济活动中的不合理因素影响", "", ""], "r": "B", "e": "零基预算不受历史期经济活动中的不合理因素影响，一切以零为起点编制预算，能促使各部门合理使用资金，调动其降低费用的积极性，但编制成本高、工作量大。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644898", "t": 1, "q": "某项目原始投资额现值为80万元，未来现金净流量现值为100万元，其现值指数是？", "a": ["1.25", "0.8", "20", "125", "", ""], "r": "A", "e": "现值指数=未来现金净流量现值÷原始投资额现值，即100÷80 = 1.25。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644899", "t": 1, "q": "应收账款周转率过高可能表明企业？", "a": ["收账费用过高", "坏账损失过多", "资金运用效率低", "信用政策过于严格", "", ""], "r": "D", "e": "应收账款周转率高意味着收账快。收账快可能是因信用政策严格，客户需尽快付款。A收账费用高与周转率高无必然联系；B坏账损失多通常对应收账慢，周转率低；C资金运用效率低不符合周转率高的情况。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644900", "t": 1, "q": "下列关于总资产收益率的说法，错误的是？", "a": ["总资产收益率=净利润÷平均总资产×100%", "总资产收益率与销售净利率无关", "该指标越高，表明资产利用效果越好", "可用于不同企业之间的业绩比较", "", ""], "r": "B", "e": "总资产收益率=净利润÷平均总资产×100%，它受销售净利率等因素影响，该指标越高资产利用效果越好，也能用于不同企业业绩比较。所以错误的是说它与销售净利率无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644901", "t": 1, "q": "当某投资项目的净现值小于0时，说明该项目的？", "a": ["实际收益率高于预期收益率", "与预期收益率无关", "实际收益率低于预期收益率", "实际收益率等于预期收益率", "", ""], "r": "C", "e": "净现值小于0意味着项目未来现金净流量现值小于原始投资额现值，即项目达不到预期的收益效果，也就是实际收益率低于预期收益率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644902", "t": 1, "q": "下列长期投资决策评价指标中，其数值越小越好的指标是（　）。", "a": ["净现值率", "内部收益率", "投资利润率", "投资回收期", "", ""], "r": "D", "e": "净现值率、内部收益率、投资利润率数值越大越好，投资回收期是收回投资所需时间，时间越短即数值越小越好。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644903", "t": 1, "q": "标准成本控制的重点是（　）。", "a": ["标准成本的制定", "成本控制", "成本差异账务处理", "成本差异的计算分析", "", ""], "r": "D", "e": "标准成本控制中，成本差异的计算分析能发现实际成本与标准成本的差异，找到成本控制的关键点和改进方向，是重点所在。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644904", "t": 1, "q": "可以在一年内或超过一年的一个营业周期内变现的资产为（　）", "a": ["不变资产", "可变资产", "固定资产", "流动资产", "", ""], "r": "D", "e": "流动资产是指可以在一年内或超过一年的一个营业周期内变现的资产。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644905", "t": 1, "q": "下列关于零基预算与增量预算的说法，错误的是？", "a": ["零基预算不受历史期不合理因素影响", "零基预算编制工作量小于增量预算", "增量预算可能导致预算不合理", "增量预算以基期成本费用水平为基础", "", ""], "r": "B", "e": "零基预算需对所有业务进行重新分析和评估，编制工作量大，而增量预算以基期为基础调整，工作量相对小，所以B选项“零基预算编制工作量小于增量预算”说法错误。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644906", "t": 1, "q": "下列说法不正确的是（　）。", "a": ["作业分析是生产分析的主要内容，是对生产过程中的各项作业的系统、全面分析", "动因分析可以帮助人们从源头对作业进行思考，对一项作业在价值链中存在的意义和价值做出初步判断", "动因分析一般建立在人们对某些具体问题的观察和逻辑思考之上，是对价值链进行系统、全面的分析", "生产分析的目标是实现价值链的优化，提高客户价值，从而增加企业盈利", "", ""], "r": "C", "e": "动因分析并非对价值链进行系统、全面的分析，它只是帮助从源头思考作业，对作业在价值链中意义和价值做初步判断，C说法错误。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644907", "t": 1, "q": "某企业销售量为不确定因素，有可能达到1000件或1100件。已知达到1000件的概率为0.4，则销售量的期望值等于（　）。", "a": ["1060件", "400件", "1050件", "440件", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644908", "t": 1, "q": "大中取大法中所说的收益值是指（　）。", "a": ["贡献边际总额", "单位贡献边际", "销售总额", "利润总额", "", ""], "r": "D", "e": "大中取大法是在不确定决策中选取收益最大方案，这里的收益一般指利润总额，它综合反映了企业经营成果。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644909", "t": 1, "q": "下列哪项不属于企业偿债能力的辅助指标？", "a": ["产权比率", "营运资金", "存货周转率", "现金比率", "", ""], "r": "C", "e": "企业偿债能力辅助指标多与资产、负债相关，用于衡量偿债能力。存货周转率是衡量企业营运能力的指标，并非偿债能力辅助指标。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644910", "t": 1, "q": "在财务分析中，通过计算不同时期相同指标的变动情况，来揭示企业财务状况和经营成果变化趋势的方法是？", "a": ["趋势分析法", "比率分析法", "比较分析法", "因素分析法", "", ""], "r": "A", "e": "趋势分析法就是通过对比不同时期相同指标变动情况，来展现企业财务和经营成果变化趋势。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644911", "t": 1, "q": "某企业年销售额（全部赊销）为500000元，毛利率为20%，流动资产为100000元，流动负债80000元，存货为40000元，现金5000元（一年按360天计算）。如果企业要求存货年周转次数为16次，该企业年平均存货为（　）", "a": ["40000元", "35000元", "25000元", "30000元", "", ""], "r": "C", "e": "本题可根据存货周转次数的计算公式来求解年平均存货。### 步骤一：明确存货周转次数的计算公式存货周转次数的计算公式为：存货周转次数=销售成本「test/yiwen_img/importSubject/2034528574219882496.png」平均存货。### 步骤二：计算销售成本已知企业年销售额（全部赊销）为500000元，毛利率为「test/yiwen_img/importSubject/2034528574446374912.png」，根据毛利率的计算公式：毛利率=（销售收入-销售成本）「test/yiwen_img/importSubject/2034528574219882496.png」销售收入，可推出销售成本=销售收入「test/yiwen_img/importSubject/2034528574555426816.png」毛利率)。将销售收入500000元，毛利率「test/yiwen_img/importSubject/2034528574446374912.png」代入公式，可得销售成本为：「test/yiwen_img/importSubject/2034528574635118592.png」（元）### 步骤三：计算年平均存货已知企业要求存货年周转次数为16次，根据存货周转次数的计算公式，可推出平均存货=销售成本「test/yiwen_img/importSubject/2034528574219882496.png」存货周转次数。将销售成本400000元，存货周转次数16次代入公式，可得年平均存货为：「test/yiwen_img/importSubject/2034528574731587584.png」（元）综上，答案是C选项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644912", "t": 1, "q": "当净现值（NPV）为负数时，表明该投资项目？", "a": ["为企业创造了价值", "项目的实际收益率高于预期收益率", "项目的现值指数大于1", "项目的实际收益率低于预期收益率", "", ""], "r": "D", "e": "净现值（NPV）是指投资项目未来现金净流量现值与原始投资额现值之间的差额。NPV为负，意味着项目收益的现值小于成本现值，即项目实际获利低于预期，也就是实际收益率低于预期收益率。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644913", "t": 1, "q": "在投融资决策中，用于衡量投
