false]}, {"id": "2034528539239387173", "t": 1, "q": "下列关于营运资金周转率的说法，正确的是？", "a": ["该指标反映营运资金的周转速度", "与企业盈利能力无关", "等于营业收入÷平均营运资金", "营运资金周转率越高越好", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387174", "t": 1, "q": "责任会计的主体是（　）。", "a": ["销售部门", "责任中心", "管理部门", "生产中心", "", ""], "r": "B", "e": "责任会计是对责任中心进行核算和考核的会计，其主体自然是责任中心。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387175", "t": 1, "q": "法律、合同和企业申请书中都未规定有效期限或受益年限的无形资产，应按照不少于（　）的期限摊销。", "a": ["30年", "5年", "10年", "15年", "", ""], "r": "C", "e": "对于法律、合同和企业申请书都未规定有效期限或受益年限的无形资产，按不少于10年期限摊销。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387176", "t": 1, "q": " 下列属于企业内部控制制度中信息与沟通要素内容的是？", "a": ["建立反舞弊机制", "授权审批制度", "人力资源政策", "内部审计机构设置", "", ""], "r": "A", "e": "信息与沟通要素强调信息的收集、传递和交流等，建立反舞弊机制有助于信息的反馈与沟通，能让企业及时发现和处理舞弊相关信息。授权审批制度属于控制活动；人力资源政策属于内部环境；内部审计机构设置也属于内部环境。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387177", "t": 1, "q": "某企业2005年末流动资产为13273千元，存货为5960千元，流动负债为7940千元，则该企业2005年末的速动比率是（　）", "a": ["0.92", "0.6", "1.67", "1.83", "", ""], "r": "A", "e": "速动比率=（流动资产 - 存货）÷流动负债，即（13273 - 5960）÷7940≈0.92。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387178", "t": 1, "q": "已知上年利润为100000元，下一年的经营杠杆系数为1.4，销售量变动率为15%，则下一年的利润预测额为（　）。", "a": ["125000元", "150000元", "140000元", "121000元", "", ""], "r": "D", "e": "经营杠杆系数=利润变动率/销售量变动率，已知经营杠杆系数1.4，销售量变动率15%，可算出利润变动率为1.4×15% = 21%。上年利润100000元，下一年利润预测额=100000×(1 + 21%) = 121000元。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387179", "t": 1, "q": "下列关于资本成本的说法，错误的是？", "a": ["资本成本越高，企业价值越大", "是投资决策的重要依据", "包括筹资费用和用资费用", "是企业筹资和使用资金所付出的代价", "", ""], "r": "A", "e": "资本成本反映企业筹资和用资代价，包括筹资和用资费用，是投资决策重要依据。通常资本成本越高，企业付出代价越大，企业价值会越小，A说法错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387180", "t": 1, "q": "销售量不变，保本点越高，则能实现的利润（　）", "a": ["不变", "越小", "越大", "不一定", "", ""], "r": "B", "e": "保本点越高意味着达到保本状态所需的销售量或销售额越高。在销售量不变时，保本点高，总成本中固定成本等占比相对高，利润就会越小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387181", "t": 1, "q": "企业为取得和使用资本而支付的各种费用称为（　）", "a": ["资本价格", "资本利润", "资本收益", "资本成本", "", ""], "r": "D", "e": "资本成本就是企业为取得和使用资本所支付的各种费用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387182", "t": 1, "q": "某企业预测6月份的销售额为100000元，6月份的实际销售额为110000元，指数平滑系数为0.6，则7月份的预测销售额为（　）", "a": ["106000元", "104000元", "110000元", "100000元", "", ""], "r": "A", "e": "指数平滑法预测公式为：下期预测值 = 平滑系数×本期实际值+(1 - 平滑系数)×本期预测值。代入数据可得：0.6×110000+(1 - 0.6)×100000 = 106000元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387183", "t": 1, "q": "某投资项目的净现值为0，说明该项目？", "a": ["实际收益率等于预期收益率", "没有达到最低可接受的收益率标准", "亏损", "不可行", "", ""], "r": "A", "e": "净现值为0意味着项目的实际收益率等于所采用的贴现率，通常贴现率可看作预期收益率。净现值为0不代表亏损，达到了最低可接受收益率标准，项目可行。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387184", "t": 1, "q": "某公司净利润100万，平均所有者权益2000万，则净资产收益率为（　）", "a": ["5%", "20%", "10%", "15%", "", ""], "r": "A", "e": "净资产收益率=净利润÷平均所有者权益×100%，即100÷2000×100% = 5%。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387185", "t": 1, "q": "审计监督在企业财务风险控制中的首要目标是？", "a": ["评价企业管理层业绩", "提高企业经济效益", "促进企业战略实现", "保证财务信息真实可靠", "", ""], "r": "D", "e": "审计监督主要是对企业财务信息等进行审查，首要目标是保证财务信息真实可靠，这样才能为企业的决策等提供准确依据。而评价管理层业绩、提高经济效益、促进战略实现并非审计监督首要目标。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387186", "t": 1, "q": "有权代表国家投资的政府部门或者机构以国有资金投入企业形成的资本金称为（　）", "a": ["国际资本金", "法人资本金", "个人资本金", "国家资本金", "", ""], "r": "D", "e": "题干强调是政府部门或机构以国有资金投入企业形成的，这就是国家资本金。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387187", "t": 1, "q": "销售收入预测的方法很多，其中根据历史数据预测的方法是（　）", "a": ["因果分析法", "调查分析法", "判断分析法", "趋势分析法", "", ""], "r": "D", "e": "趋势分析法是依据历史数据来预测未来趋势。因果分析法侧重分析因果关系；调查分析法靠调查获取信息；判断分析法依赖主观判断。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387188", "t": 1, "q": "单耗相对稳定的外购零部件成本属于（　）。", "a": ["技术性变动成本", "酌量性固定成本", "约束性变动成本", "约束性固定成本", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387189", "t": 1, "q": "某公司发行债券，债券面值为1000元，票面利率为8%，每年付息一次，到期还本，债券发行价1010元，筹资费为发行价的2%，企业所得税税率为25%，则该债券的资本成本为？", "a": ["6.12%", "5.88%", "6%", "8%", "", ""], "r": "A", "e": "本题可根据债券资本成本的计算公式来求解。### 步骤一：明确债券资本成本的计算公式对于每年付息一次、到期还本的债券，其资本成本计算公式为：「test/yiwen_img/importSubject/2034528532910182400.png」，其中「test/yiwen_img/importSubject/2034528533178617856.png」为债券资本成本，I为每年支付的利息，T为企业所得税税率，B为债券筹资额（按发行价格确定），f为筹资费用率。### 步骤二：分别计算公式中各参数的值 计算每年支付的利息I：已知债券面值为1000元，票面利率为「test/yiwen_img/importSubject/2034528533258309632.png」，根据利息计算公式「test/yiwen_img/importSubject/2034528533333807104.png」，可得每年支付的利息「test/yiwen_img/importSubject/2034528533430276096.png」（元）。 确定企业所得税税率T：题目中明确给出企业所得税税率「test/yiwen_img/importSubject/2034528533514162176.png」。 计算债券筹资额B：已知债券发行价为1010元，所以债券筹资额B = 1010元。 计算筹资费用率f：已知筹资费为发行价的「test/yiwen_img/importSubject/2034528533602242560.png」，即筹资费用率「test/yiwen_img/importSubject/2034528533686128640.png」。### 步骤三：将各参数代入公式计算债券资本成本「test/yiwen_img/importSubject/2034528533178617856.png」将I = 80元、「test/yiwen_img/importSubject/2034528533514162176.png」、B = 1010元、「test/yiwen_img/importSubject/2034528533686128640.png」代入公式「test/yiwen_img/importSubject/2034528532910182400.png」可得：「test/yiwen_img/importSubject/2034528533799374848.png」综上，答案是A选项。", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387190", "t": 1, "q": "适合汽车修理企业采用的成本计算方法是（　）。", "a": ["逐步结转分步法", "品种法", "平行结转分步法", "分批法", "", ""], "r": "D", "e": "汽车修理通常按订单分批进行，每批修理业务的成本核算相对独立，分批法适用于单件、小批生产，所以汽车修理企业适合采用分批法。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387191", "t": 1, "q": "下列关于营运资金特点的说法，正确的是？", "a": ["营运资金的周转期较长", "营运资金的实物形态固定不变", "营运资金具有较强的流动性", "营运资金来源单一", "", ""], "r": "C", "e": "营运资金周转期短，实物形态易变，来源多样且有较强流动性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387192", "t": 1, "q": "企业总体财务管理体制是现代企业制度的重要方面，它主要是（　）", "a": ["规定企业内部各项财务活动的运动方式", "解决企业对外的财务行为和财务管理问题", "确定企业内部各级部门之间的财务关系", "分解落实企业对外的财务行为和财务关系", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387193", "t": 1, "q": "下列关于内部审计的说法，错误的是？", "a": ["内部审计可以评价企业内部控制的有效性", "内部审计只关注企业的财务活动", "内部审计有助于企业改善经营管理", "内部审计是企业内部控制的重要组成部分", "", ""], "r": "B", "e": "内部审计不仅关注财务活动，还涉及企业经营管理的各个方面。A选项内部审计能评价内控有效性；C选项可助企业改善管理；D选项是内控重要组成部分，说法均正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387194", "t": 1, "q": "最优化、效益性、决策有用性、及时性、重要性和灵活性，共同构成了现代管理会计的（　）。", "a": ["管理会计假设", "管理会计原则", "管理会计概念", "管理会计术语", "", ""], "r": "B", "e": "这些特性是用来指导管理会计工作的准则，符合管理会计原则的定义。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387195", "t": 1, "q": "某公司年初流动资产总额为9502800元，流动负债总额为530280元，则流动比率为（　）", "a": ["2.627", "1.792", "2.798", "1.789", "", ""], "r": "B", "e": "流动比率=流动资产/流动负债，将9502800除以530280约等于1.792。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387196", "t": 1, "q": "零基预算不适用于？", "a": ["业务招待费用预算", "广告宣传费用预算", "人员工资预算", "研发费用预算", "", ""], "r": "C", "e": "零基预算不受以往预算安排情况的影响，一切从实际需要出发。人员工资通常有相对固定的标准和模式，有既定的制度和历史数据可依，不适合用零基预算。而业务招待、广告宣传、研发费用受业务变化、市场情况等因素影响大，适合零基预算。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387197", "t": 1, "q": "某企业购进原料价款10000元，经加工后出售价为14000元，增值税税率17%，则该企业应交增值税税额为（　）", "a": ["2380元", "680元", "780元", "1700元", "", ""], "r": "B", "e": "增值税是对增值额征税，先算出增值额为售价减进价即14000 - 10000 = 4000元，再用增值额乘以税率得应交税额4000×17% = 680元。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387198", "t": 1, "q": "下列属于内部控制制度中控制活动要素的是？", "a": ["人力资源政策", "企业文化", "内部审计", "财产保护控制", "", ""], "r": "D", "e": "控制活动是企业根据风险评估结果，采用相应的控制措施，将风险控制在可承受度之内。财产保护控制属于控制活动。而人力资源政策和企业文化属于内部环境要素，内部审计属于内部监督要素。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387199", "t": 1, "q": "在企业总资产周转率为2时，可能会引起该指标下降的经济活动是（　）", "a": ["取得一笔商品销售收入", "用银行存款购入一台设备", "用银行存款支付一年的电话费", "借入一笔生产资金借款", "", ""], "r": "D", "e": "总资产周转率=销售收入净额÷平均资产总额。A项取得销售收入会使分子增大，周转率上升；B项用银行存款购设备，资产内部一增一减，总额不变，周转率不变；C项支付电话费会使利润减少，不直接影响资产和收入，周转率不变；D项借入借款使资产总额增加，分子不变分母增大，周转率下降。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387200", "t": 1, "q": "下列关于应收账款周转率的说法，正确的是？", "a": ["应收账款周转率越低，说明收账速度越快", "应收账款周转率与坏账损失率呈正相关", "应收账款周转率越高越好", "应收账款周转率=销售收入÷平均应收账款余额", "", ""], "r": "D", "e": "应收账款周转率=销售收入÷平均应收账款余额；周转率越高收账速度越快，A错误；周转率高坏账损失率低，二者负相关，B错误；周转率并非越高越好，过高可能意味着信用政策过紧影响销售，C错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387201", "t": 1, "q": "下列关于企业营运能力分析指标的说法，正确的是？", "a": ["存货周转天数越多，说明存货周转速度越快", "总资产周转率反映企业全部资产的利用效率", "应收账款周转率越高，说明收账越慢", "流动资产周转率与企业盈利能力无关", "", ""], "r": "B", "e": "存货周转天数越多周转越慢，A错；应收账款周转率越高收账越快，C错；流动资产周转率高，盈利可能越好，与盈利能力有关，D错；总资产周转率体现全部资产利用效率，B正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387202", "t": 1, "q": "零基预算在编制费用预算时，首先应？", "a": ["对各费用项目进行成本效益分析", "划分不可避免费用项目和可避免费用项目", "提出费用预算方案", "分配资金", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387203", "t": 1, "q": "采用净现值法对投资项目进行决策时，所采用的折现率通常是？", "a": ["企业的应收账款周转率", "企业的存货周转率", "企业的销售净利率", "企业的加权平均资本成本", "", ""], "r": "D", "e": "净现值法决策时，折现率要反映资金成本和投资风险，加权平均资本成本可体现企业综合资金成本，适合作为折现率。而应收账款周转率、存货周转率、销售净利率与折现率无关。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387204", "t": 1, "q": "下列关于现金周转期的说法，正确的是？", "a": ["延长应付账款周转期会延长现金周转期", "缩短应收账款周转期会延长现金周转期", "现金周转期越长，说明资金使用效率越高", "现金周转期=存货周转期+应收账款周转期-应付账款周转期", "", ""], "r": "D", "e": "现金周转期=存货周转期+应收账款周转期 - 应付账款周转期，延长应付账款周转期会缩短现金周转期，缩短应收账款周转期会缩短现金周转期，现金周转期越短资金使用效率越高。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387205", "t": 1, "q": "现金流量表的编制方法中，通过现金收入和现金支出的总括分类，来反映来自企业经营活动的现金流量的方法是（　）", "a": ["单独法", "整理法", "直接法", "间接法", "", ""], "r": "C", "e": "直接法是通过现金收入和现金支出的总括分类，来反映来自企业经营活动的现金流量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387206", "t": 1, "q": "相对于股票投资而言，债券投资的特点是（　）", "a": ["投资收益率的稳定性较强", "无法事先预知投资收益水平", "投资收益率比较高", "投资风险较大", "", ""], "r": "A", "e": "债券有固定的票面利率和到期日，收益相对稳定，不像股票收益波动大。股票投资收益难以事先准确预知，且一般风险大但可能收益高。所以债券投资收益率稳定性较强。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387207", "t": 1, "q": "当企业某种产品的销售价格为70元时，预测销售数量为35000件，该产品的消费税税率是10%，企业制定的目标销售利润率为18%，则该产品的目标成本应为多少？", "a": ["50.4元", "56.4元", "70.4元", "60.4元", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387208", "t": 1, "q": "理论上讲，既能够考虑资金的时间价值和投资风险，又有利于克服管理上的片面性和短期行为的企业财务管理目标是（　）", "a": ["每股收益最大化", "企业价值最大化", "利润最大化", "权益资本利润率最大化", "", ""], "r": "B", "e": "企业价值最大化考虑了资金时间价值和投资风险，避免追求短期利益，克服管理片面性和短期行为。而每股收益最大化、利润最大化、权益资本利润率最大化都未很好兼顾这些。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387209", "t": 1, "q": "在财务分析中，连环替代法属于？", "a": ["比率分析法", "比较分析法", "趋势分析法", "因素分析法", "", ""], "r": "D", "e": "连环替代法是用来确定几个相互联系的因素对分析对象影响程度的方法，属于因素分析法。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387210", "t": 1, "q": "某公司年营业收入为500万元，变动成本率为40%，经营杠杆系数为1.5，财务杠杆系数为2。如果固定成本增加50万元，那么，总杠杆系数将变为（　）。", "a": ["2.4", "6", "8", "3", "", ""], "r": "B", "e": "本题可先根据经营杠杆系数公式求出原来的固定成本，再计算固定成本增加后的总杠杆系数。### 步骤一：根据经营杠杆系数公式求出原来的固定成本经营杠杆系数「test/yiwen_img/importSubject/2034528533895843840.png」，其中Q为销售量，P为单价，V为单位变动成本，F为固定成本，Q(P - V)为边际贡献，变动成本率「test/yiwen_img/importSubject/2034528534017478656.png」。已知变动成本率为「test/yiwen_img/importSubject/2034528534088781824.png」，则边际贡献率「test/yiwen_img/importSubject/2034528534181056512.png」，年营业收入为500万元，所以边际贡献「test/yiwen_img/importSubject/2034528534281719808.png」（万元）。又已知经营杠杆系数DOL = 1.5，根据经营杠杆系数公式「test/yiwen_img/importSubject/2034528534378188800.png」，可得「test/yiwen_img/importSubject/2034528534470463488.png」，解方程可得F = 100（万元）。### 步骤二：计算固定成本增加后的总杠杆系数总杠杆系数「test/yiwen_img/importSubject/2034528534608875520.png」（DFL为财务杠杆系数），固定成本增加50万元后，新的固定成本F' = 100 + 50 = 150（万元）。此时新的经营杠杆系数「test/yiwen_img/importSubject/2034528534717927424.png」。已知财务杠杆系数DFL = 2，则新的总杠杆系数「test/yiwen_img/importSubject/2034528534847950848.png」。综上，答案是B选项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387211", "t": 1, "q": "企业内部的财务管理方式要与企业总体财务管理体制相适应，同时根据（　）研究确定。", "a": ["企业筹资方式、企业盈亏情况", "企业资产多少，资金利用率高低", "企业规模大小、工作基础强弱", "企业效率高低，企业规模大小", "", ""], "r": "C", "e": "企业内部财务管理方式需结合总体体制，同时依据企业自身实际情况，规模大小和工作基础强弱是关键考量因素，能决定内部财务管理的具体模式。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387212", "t": 1, "q": "为了正确反映辅助生产车间的费用水平，各辅助生产车间之间相互提供的产品也应按（　）计算，列入生产费用。", "a": ["实际耗用量和实际价格", "计划耗用量和计划价格", "实际耗用量和计划价格", "计划耗用量和实际价格", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914432", "t": 2, "q": "企业吸收其他单位的直接投资的程序包括（　）", "a": ["协商投资事项", "确定筹资数量", "取得所筹集的资金", "物色投资单位", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914433", "t": 2, "q": "下列属于企业内部控制中信息与沟通要素的有？", "a": ["建立信息传递渠道", "实施信息系统控制", "建立反舞弊机制", "明确信息收集范围", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914434", "t": 2, "q": "下列属于催收应收账款方法的有（　）", "a": ["公告通知", "诉诸法律", "信函通知", "派员面谈", "", ""], "r": "BCD", "e": "催收应收账款常见方式有信函通知告知欠款情况、派员面谈协商解决、必要时诉诸法律维权。公告通知一般不用于应收账款催收。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914435", "t": 2, "q": "滚动预算按照滚动时间单位划分，可分为？", "a": ["混合滚动，结合了月份和季度滚动的优势", "逐月滚动，能最精确反映预算期情况但工作量大", "逐季滚动，编制工作量相对较小但精确性稍低", "逐年滚动，适用于长期战略规划预算", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914436", "t": 2, "q": "金融衍生工具的市场风险包括（　）", "a": ["操作性风险", "信用风险", "价格波动风险", "流动性风险", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914437", "t": 2, "q": "零基预算的编制步骤包括？", "a": ["提出预算期内各种费用的预算方案", "对各费用项目进行成本-效益分析", "分配资金，编制预算草案", "划分不可避免费用项目和可避免费用项目", "", ""], "r": "ABCD", "e": "零基预算编制时，先提出预算期内各种费用方案（A），接着划分不可避免和可避免费用项目（D），再对各费用项目成本 - 效益分析（B），最后分配资金编制预算草案（C）。ABCD 都是零基预算编制步骤。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914438", "t": 2, "q": "管理会计属于（　）。", "a": ["经营型会计", "报账型会计", "外部会计", "内部会计", "", ""], "r": "AD", "e": "管理会计主要服务于企业内部管理，通过提供相关信息帮助企业管理者进行决策、规划和控制等，是经营型、内部会计。而报账型会计、外部会计主要侧重于对外提供财务信息，是财务会计的特点。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914439", "t": 2, "q": "在计算资本成本时，需要考虑筹资费用的有？", "a": ["债券资本成本", "长期借款资本成本", "留存收益资本成本", "普通股资本成本", "", ""], "r": "ABD", "e": "债券、长期借款、普通股筹资时都有筹资费用，而留存收益是企业内部留存资金，无筹资费用。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914440", "t": 2, "q": "下列关于企业营运资金管理策略的说法，正确的有？", "a": ["激进型策略下，企业的流动资产投资规模较小", "三种策略中，激进型策略的收益潜力最大", "保守型策略下，企业的财务风险较低", "适中型策略下，流动资产和流动负债保持固定比例", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914441", "t": 2, "q": "加强成品资金管理，销售部门应做好的工作有（　）", "a": ["采取措施，加速成品资金周转", "正确制定成品销售计划", "认真执行销售合同", "拟订成品和外购商品管理办法", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914442", "t": 2, "q": "长期投资决策分析过程中需要考虑的重要因素有（　）。", "a": ["资金成本", "贡献边际率", "投资的风险价值", "货币的时间价值", "", ""], "r": "ACD", "e": "长期投资决策要考虑资金成本，它影响投资收益；投资有风险，需考虑风险价值；货币随时间有价值变化，时间价值是重要考量因素。而贡献边际率主要用于短期经营决策。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914443", "t": 2, "q": "在投资项目决策中，现值指数法的优点包括？", "a": ["便于投资额不同的项目比较", "计算过程简单易懂", "考虑了货币时间价值", "能直接反映项目的实际收益率", "", ""], "r": "AC", "e": "现值指数考虑了货币时间价值，且便于对投资额不同的项目进行比较。其计算有一定复杂度，不能直接反映项目实际收益率。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914444", "t": 2, "q": "管理会计的职能包括（　）。", "a": ["预测经济前景", "控制经济过程", "考核评价经营业绩", "规划经营目标", "", ""], "r": "ABCD", "e": "管理会计具有预测、规划、控制、评价等职能。A预测经济前景能为企业决策提供依据；B控制经济过程可确保经营活动按计划进行；C考核评价经营业绩能激励员工和评估经营效果；D规划经营目标能为企业指明方向。ABCD选项均符合管理会计职能。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914445", "t": 2, "q": "内部审计与外部审计的区别体现在？", "a": ["审计目标不同，内部审计侧重企业内部管理，外部审计侧重财务报表鉴证", "审计主体不同，内部审计由企业内部人员实施，外部审计由独立第三方机构进行", "审计独立性不同，外部审计独立性相对更强", "审计范围不同，内部审计范围更广，涵盖经营管理多方面", "", ""], "r": "ABCD", "e": "ABCD四个选项分别从审计目标、主体、独立性、范围阐述了内外部审计区别，均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914446", "t": 2, "q": "如果某完整工业投资项目的建设期不为零，则该项目建设期内有关时点的净现金流量（　）。", "a": ["一定小于零", "可能等于零", "一定大于零", "可能小于零", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914447", "t": 2, "q": "计算债券资本成本时，需要考虑的因素有哪些？", "a": ["债券面值", "企业所得税税率", "债券筹资费用率", "债券票面利率", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914448", "t": 2, "q": "下列表决需要经全体合伙人一致同意的是（　）", "a": ["聘任企业经营管理人员", "改变名称", "处分不动产", "为他人提供担保", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914449", "t": 2, "q": "下列属于企业财务关系的内容项目有（　）", "a": ["投资者对企业进行一定程度的控制", "企业差旅人员向出纳人员报销差旅费", "企业用其利润向职工支付奖金", "企业按国家税法的规定缴纳所得税、流转税", "", ""], "r": "ACD", "e": "企业财务关系是指企业在组织财务活动过程中与有关各方所发生的经济利益关系。A体现投资者与企业关系；C是企业与职工关系；D是企业与政府关系。B只是企业内部日常费用报销，不属于企业财务关系范畴。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914450", "t": 2, "q": "企业进行长期投资决策时，需考虑的因素有？", "a": ["投资项目的现金流量", "投资项目的使用年限", "企业的资本成本", "项目的风险水平", "", ""], "r": "ABCD", "e": "长期投资决策要综合多方面因素。现金流量反映项目资金收支，使用年限影响收益周期，资本成本是投资成本衡量，风险水平关系投资安全性与收益稳定性。ABCD 均是需考虑因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914451", "t": 2, "q": "当投资项目的净现值（NPV）>0时，下列结论正确的有？", "a": ["项目在经济上可行", "项目的现值指数（PI）大于1", "项目的内部收益率（IRR）大于设定的折现率", "项目的投资回收期小于基准回收期", "", ""], "r": "ABC", "e": "净现值（NPV）>0 意味着项目预期收益现值超过成本，在经济上可行。现值指数（PI）=未来现金净流量现值÷原始投资额现值，NPV>0 时，未来现金净流量现值大于原始投资额现值，PI>1。内部收益率（IRR）是使 NPV 为 0 的折现率，NPV>0 说明 IRR 大于设定折现率。而投资回收期与净现值无必然联系。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914452", "t": 2, "q": "对外间接投资主要包括（　）", "a": ["信托投资", "债券投资", "金融衍生工具投资", "股票投资", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914453", "t": 2, "q": "财务部门对规定资产的管理主要包括（　）", "a": ["调出固定资产，要参加办理移交", "调出固定资产，无需参加办理移交", "报废固定资产，要参加鉴定清理", "新增固定资产，要参加验收", "", ""], "r": "ACD", "e": "财务部门需参与固定资产管理的关键环节。调出时要办理移交，报废要参与鉴定清理，新增要参加验收。B选项无需参加办理移交不符合管理要求。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914454", "t": 2, "q": "下列方法中属于坏账准备计提方法的有（　）", "a": ["账龄分析法", "销货百分比法", "直接冲销法", "应收账款余额百分比法", "", ""], "r": "ABD", "e": "坏账准备计提方法有账龄分析法、销货百分比法、应收账款余额百分比法。直接冲销法是在实际发生坏账时直接计入当期损益，并非坏账准备计提方法。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914455", "t": 2, "q": "影响直接材料耗用量差异的因素有（　）。", "a": ["工人的技术熟练程度", "设备的完好程度", "废品率的高低", "材料质量", "", ""], "r": "ABCD", "e": "ABCD选项均会影响直接材料耗用量差异。工人技术熟练程度高，用料更合理，耗用量可能降低；设备完好程度影响生产过程是否顺畅，完好设备可减少材料浪费；废品率高会增加额外材料消耗；材料质量好可减少因质量问题导致的多耗用情况。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914456", "t": 2, "q": "下列属于内部控制活动要素的有？", "a": ["会计系统控制", "授权审批控制", "风险评估", "内部监督", "", ""], "r": "AB", "e": "内部控制活动要素包括会计系统控制、授权审批控制等。风险评估和内部监督是内部控制五要素中与控制活动并列的要素。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914457", "t": 2, "q": "当剩余生产能力无法转移时，亏损产品不应停产的条件有（　）", "a": ["该亏损产品的单位贡献边际大于0", "该亏损产品的贡献边际率大于0", "该亏损产品的变动成本率小于1", "该亏损产品的变动成本率大于1", "", ""], "r": "ABC", "e": "只要亏损产品的单位贡献边际或贡献边际率大于0，说明其能为企业弥补部分固定成本，不应停产；变动成本率小于1意味着贡献边际率大于0。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914458", "t": 2, "q": "下列各项中，一般应纳入变动成本的有（　）。", "a": ["临时发生的职工培训费", "职工的工资", "单独核算的包装物成本", "按产量法计提的折旧", "", ""], "r": "CD", "e": "变动成本随业务量变动而变动。单独核算的包装物成本会随产量变动，按产量法计提的折旧也与产量相关，会随产量变动而变动，属于变动成本。临时发生的职工培训费与业务量无直接关联，职工工资多为固定成本。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914459", "t": 2, "q": "对外投资的风险主要有（　）", "a": ["市场风险", "购买力风险", "财务风险", "利率风险", "", ""], "r": "ABCD", "e": "对外投资风险是多样的。市场风险是市场波动影响投资收益；购买力风险因物价变动使货币购买力变化影响投资；财务风险源于被投资企业财务状况不佳；利率风险是利率变动影响投资价值。ABCD四个选项都属于对外投资可能面临的风险。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914460", "t": 2, "q": "基金投资的特点有（　）", "a": ["基金可以为投资者提供更多的投资机会", "基金投资收益高", "基金投资只需支付少量的管理费用，就可获得专业化的管理服务", "基金的流动性好，分散风险功能强", "", ""], "r": "ACD", "e": "基金能汇集众多资金投向多个领域，为投资者提供更多投资机会；由专业团队管理，投资者支付少量管理费就能获得专业服务；流动性较好且可通过分散投资降低风险。但基金投资收益并不一定高，有多种影响因素。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914461", "t": 2, "q": "生产经营能力具体包括以下几种表现形式（　）", "a": ["最大生产经营能力", "正常生产经营能力", "追加生产经营能力", "最小生产经营能力", "", ""], "r": "ABC", "e": "生产经营能力有最大、正常、追加等表现形式。最大生产经营能力是理论上的极限；正常生产经营能力是正常情况下的水平；追加生产经营能力可通过临时措施增加。不存在最小生产经营能力这种普遍说法。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914462", "t": 2, "q": "在应用回归直线法时，只有当相关系数符合以下条件之一时才能继续计算回归系数，即（　）。", "a": ["r=-1", "r→+1", "r为任意值", "r=+1", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528540912914463", "t": 2, "q": "下列关于企业财务分析指标相互关系的表述，正确的有？", "a": ["营运能力指标影响盈利能力指标", "偿债能力指标与盈利能力指标存在关联", "营运能力指标与偿债能力指标无关", "盈利能力指标是偿债能力的保障", "", ""], "r": "ABD", "e": "企业营运能力影响资产利用效率，进而影响盈利，A正确；偿债需有盈利作支撑，偿债能力与盈利能力有关联，B正确；营运能力强利于资产变现偿债，与偿债能力有关，C错误；盈利好能更好偿还债务，盈利能力是偿债能力保障，D正确。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528541286207488", "t": 3, "q": "如果某项目第4年的销售收入为500万元，付现成本为200万元，计提折旧50万元，所得税税率为40%，回收固定资产残值25万元，回收垫支的流动资金10万元。支付利息2.68万元，归还债务本金53.72万元，不考虑其他因素，则该年的实体现金流量为235万元，债权现金流量为55.328万元，股权现金流量为179.672万元。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "本题可根据实体现金流量、债权现金流量和股权现金流量的计算公式分别计算各指标，再与题目所给数据进行对比判断。### 步骤一：计算实体现金流量实体现金流量的计算公式为：实体现金流量=税后经营净利润+折旧与摊销 - 经营营运资本增加 - 资本支出。本题中，可根据“税后经营净利润=（销售收入 - 付现成本 - 折旧）×（1 - 所得税税率）”先计算税后经营净利润，再结合回收固定资产残值和回收垫支的流动资金来计算实体现金流量。 计算税后经营净利润：已知销售收入为500万元，付现成本为200万元，计提折旧50万元，所得税税率为「test/yiwen_img/importSubject/2034528534088781824.png」，将数据代入公式可得：「test/yiwen_img/importSubject/2034528534994751488.png」（万元） 计算实体现金流量：根据上述数据，结合折旧50万元、回收固定资产残值25万元和回收垫支的流动资金10万元，可得：实体现金流量= 150 + 50 + 25 + 10 = 235（万元）### 步骤二：计算债权现金流量债权现金流量的计算公式为：债权现金流量=税后利息费用 - 净负债增加。已知支付利息2.68万元，所得税税率为「test/yiwen_img/importSubject/2034528534088781824.png」，则税后利息费用为「test/yiwen_img/importSubject/2034528535107997696.png」万元；归还债务本金53.72万元，即净负债减少53.72万元，也就是净负债增加-53.72万元。将数据代入公式可得：债权现金流量= 1.608 - (-53.72) = 55.328（万元）### 步骤三：计算股权现金流量根据实体现金流量、债权现金流量和股权现金流量的关系：实体现金流量=债权现金流量+股权现金流量，变形可得股权现金流量=实体现金流量 - 债权现金流量。将实体现金流量235万元和债权现金流量55.328万元代入公式可得：股权现金流量= 235 - 55.328 = 179.672（万元）经过计算，该年的实体现金流量为235万元，债权现金流量为55.328万元，股权现金流量为179.672万元，与题目表述一致。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 财务管理（4）", "n": "基础练习题【含解析】 / 第1章 财务管理（4）", "qs": [{"id": "2034528546281623552", "t": 1, "q": "滚动预算按其预算编制和滚动的时间单位不同，不包括以下哪种方式？", "a": ["逐季滚动", "逐月滚动", "逐周滚动", "混合滚动", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623553", "t": 1, "q": "已知某单纯固定资产投资项目经营期某年的总成本费用为100万元，当年与该项目有关的固定资产折旧为30万元，计入财务费用的利息支出为10万元，上缴所得税20万元，则该年的经营成本等于（　）。", "a": ["70万元", "50万元", "60万元", "40万元", "", ""], "r": "C", "e": "经营成本=总成本费用 - 折旧 - 利息，即100 - 30 - 10 = 60万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623554", "t": 1, "q": "我国规定的股利支付形式主要是（　）", "a": ["现金股利和财产股利", "现金股利", "股票股利和现金股利", "负债股利", "", ""], "r": "C", "e": "我国规定公司股利支付形式主要有股票股利和现金股利。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623555", "t": 1, "q": "管理会计正式形成和发展于（　）。", "a": ["20世纪80年代", "20世纪70年代", "20世纪初", "20世纪50年代", "", ""], "r": "D", "e": "20世纪50年代，随着管理科学的发展和企业管理的需要，管理会计从传统会计中分离出来，正式形成和发展。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623556", "t": 1, "q": "滚动预算的优点不包括？", "a": ["能及时反映企业经营变化", "编制成本较低", "便于考核预算执行结果", "保持预算的连续性和完整性", "", ""], "r": "B", "e": "滚动预算需不断调整和修订预算，会增加编制成本，并非编制成本较低。而它能及时反映经营变化、便于考核执行结果、保持连续性和完整性。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623557", "t": 1, "q": "下列属于内部控制中信息与沟通要素的是？", "a": ["设置内部审计机构", "定期进行资产清查", "实施不相容职务分离", "建立举报投诉制度", "", ""], "r": "D", "e": "信息与沟通强调企业内外信息的收集、传递和反馈等。建立举报投诉制度利于信息传递与反馈，属于信息与沟通要素。A选项设置内部审计机构是监督要素；B选项定期资产清查是控制活动；C选项不相容职务分离也是控制活动。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623558", "t": 1, "q": "美华公司2005年投入资金总额1000万元，每股面值为12元，资产总额为1640万元，负债总额为500万元，每股价格为（　）", "a": ["14元", "13.5元", "12元", "13.68元", "", ""], "r": "D", "e": "先算所有者权益=资产总额 - 负债总额=1640 - 500 = 1140万元。再算股数=投入资金总额÷每股面值=1000÷12 万股。最后每股价格=所有者权益÷股数=1140÷(1000÷12)=13.68元。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623559", "t": 1, "q": "某投资项目建设期为1年，建成投产后每年的净现金流量为10万元，原始投资合计80万元，投资项目有效期为10年，则包含建设期的静态投资回收期为（　）。", "a": ["7", "8", "9", "6", "", ""], "r": "C", "e": "静态投资回收期是使累计现金流量等于原始投资额的时间。每年净现金流量10万，原始投资80万，不考虑建设期需8年收回投资，建设期1年，所以包含建设期的静态投资回收期是9年。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623560", "t": 1, "q": "滚动预算按照预算编制和滚动的时间单位不同，分为逐月滚动、逐季滚动和？", "a": ["混合滚动", "连续滚动", "逐年滚动", "中期滚动", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623561", "t": 1, "q": "下列关于企业内部审计监督的说法，正确的是？", "a": ["内部审计监督可以为内部控制的完善提供建议", "内部审计监督的独立性强于外部审计", "内部审计监督只对财务收支进行审查", "内部审计监督人员不能参与企业的风险管理", "", ""], "r": "A", "e": "内部审计能对企业内部控制进行评价并提供完善建议；外部审计独立性更强，B错误；内部审计不仅审查财务收支，也涵盖其他业务活动，C错误；内部审计人员可参与企业风险管理，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623562", "t": 1, "q": "在变动成本法中，产品成本是指（　）。", "a": ["变动成本", "制造费用", "生产成本", "变动生产成本", "", ""], "r": "D", "e": "变动成本法下，产品成本只包括变动生产成本。变动成本范围大，包含变动非生产成本；制造费用有固定和变动之分；生产成本包含固定生产成本。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623563", "t": 1, "q": "下列关于固定资产折旧的说法正确的是（　）", "a": ["已提足折旧但仍继续使用的固定资产，应该仍计提折旧", "提前报废的固定资产，应补提折旧后将其净损失计入企业营业外支出", "月份内减少或停用的固定资产，当月不再计提折旧", "季节性停用和修理用的设备，应该计提折旧", "", ""], "r": "D", "e": "A选项，已提足折旧仍继续使用的固定资产不再计提折旧；B选项，提前报废的固定资产不补提折旧；C选项，月份内减少或停用的固定资产，当月照提折旧；D选项，季节性停用和修理用设备属于使用中的固定资产，应计提折旧。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623564", "t": 1, "q": "下列关于货币资金余缺额的计算公式正确的是（　）", "a": ["货币资金余缺额=期初货币资金余额---理想货币资金余额", "货币资金余缺额=期末货币资金余额+理想货币资金余额", "货币资金余缺额=理想货币资金余额", "货币资金余缺额=（期初货币资金余额+货币资金收入总计---货币资金支出总计）---理想货币资金余额", "", ""], "r": "D", "e": "货币资金余缺额需考虑期初余额、收入、支出以及理想余额。先算出当前实际货币资金量（期初余额加收入减支出），再与理想余额对比得出余缺情况。选项D符合此逻辑。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623565", "t": 1, "q": "已知2000年某企业按变动成本法计算的营业利润为13,500元，假定2001年销量与2000年相同，产品单价及成本水平都不变，但产量有所提高。则该年按变动成本法计算的营业利润（　）。", "a": ["可能等于13,500元", "必然等于13,500元", "必然小于13,500元", "必然大于13,500元", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623566", "t": 1, "q": "某企业每月固定成本总额为18000元，单位变动成本率为60%，则其保本销售额为（　）", "a": ["15000元", "22500元", "30000元", "45000元", "", ""], "r": "D", "e": "保本销售额=固定成本÷（1 - 单位变动成本率），即18000÷(1 - 60%) = 45000元。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623567", "t": 1, "q": "当相关系数r等于+1时，表明成本与业务量之间的关系是（　）。", "a": ["基本无关", "基本正相关", "完全正相关", "完全无关", "", ""], "r": "C", "e": "相关系数r取值在 -1 到 +1 之间，r = +1 表示两个变量完全正相关，这里即成本与业务量完全正相关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623568", "t": 1, "q": " 某企业年初应收账款余额为80万元，年末应收账款余额为120万元，全年赊销收入净额为600万元，则该企业的应收账款周转率为？", "a": ["5次", "6次", "8次", "7次", "", ""], "r": "B", "e": "应收账款周转率=赊销收入净额÷应收账款平均余额，应收账款平均余额=（年初余额 + 年末余额）÷2 =（80 + 120）÷2 = 100万元，周转率 = 600÷100 = 6次。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623569", "t": 1, "q": "在计算债券资本成本时，考虑所得税影响后，债券资本成本的计算公式为？", "a": ["债券资本成本=债券年利息÷债券筹资额×（1-筹资费率）", "债券资本成本=债券面值×票面利率÷债券筹资额", "债券资本成本=债券面值×票面利率×（1-所得税税率）÷债券筹资额", "债券资本成本=债券年利息×（1-所得税税率）÷债券筹资额×（1-筹资费率）", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623570", "t": 1, "q": "一般情况下，下列表述中不正确的是（　）。", "a": ["净现值大于0，方案可行。", "净现值大于0，净现值率必定大于0，方案可行。", "净现值大于0，表明投资报酬率大于资金成本，方案可行。", "内部收益率大于0，方案可行。", "", ""], "r": "D", "e": "净现值大于0意味着方案能带来正收益，净现值率也会大于0，投资报酬率大于资金成本，方案可行；而内部收益率需大于基准收益率方案才可行，仅大于0不能判定方案可行。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623571", "t": 1, "q": "在零基预算编制过程中，首先应进行的步骤是？", "a": ["对各项费用进行成本效益分析", "提出预算期内各种费用的开支方案", "分配资金，落实预算", "划分不可避免费用项目和可避免费用项目", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623572", "t": 1, "q": "关于独资企业的特点的说法，不正确的是（　）", "a": ["独资企业可作为企业所得税的纳税主体", "出资人对企业债务承担无限责任", "只有唯一一个出资者", "财产为投资人个人所有", "", ""], "r": "A", "e": "独资企业不具有法人资格，不是企业所得税纳税主体，缴纳个人所得税。而B、C、D选项都是独资企业特点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623573", "t": 1, "q": "反映企业某时所拥有或控制的经济资源、所承担的现时义务和所有者对净资产的要求权的财务分析资料是（　）", "a": ["现金流量表", "利润分配表", "资产负债表", "利润表", "", ""], "r": "C", "e": "资产负债表反映企业在某一特定日期所拥有或控制的经济资源、所承担的现时义务和所有者对净资产的要求权。现金流量表反映现金收支；利润分配表展示利润分配情况；利润表体现经营成果。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623574", "t": 1, "q": "如果某长期投资项目的原始总投资与投资总额之间存在数量差异，则意味着项目一定（　）。", "a": ["采取分次投入方式", "采取一次投入方式", "存在流动资金投资", "存在资本化利息", "", ""], "r": "D", "e": "投资总额=原始总投资+建设期资本化利息，原始总投资与投资总额有差异，说明存在资本化利息。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623575", "t": 1, "q": "公司分立前的债务按所达成协议由（　）", "a": ["原公司承担", "分立后的公司承担", "根据分立协议确定的责任方承担", "债权人决定债权承担者", "", ""], "r": "C", "e": "公司分立前的债务按所达成的协议，一般是按协议确定责任方承担债务。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623576", "t": 1, "q": "某项目需要投入20万元，投产后年均收入96000元，付现成本26000元，预计有效期10年，按直线法提折旧，无残值。所得税率为30%，则该项目的下列指标中不正确的是（　）。", "a": ["年营业现金流量为55000元", "回收期3.64年", "会计收益率35%", "会计收益率17.5%", "", ""], "r": "C", "e": "首先算年折旧 = 200000÷10 = 20000元，年净利润 =（96000 - 26000 - 20000）×（1 - 30%）= 35000元，年营业现金流量 = 35000 + 20000 = 55000元，A正确；回收期 = 200000÷55000≈3.64年，B正确；会计收益率 = 35000÷200000 = 17.5%，C错误，D正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623577", "t": 1, "q": " 下列指标中，属于企业短期偿债能力分析指标且最为保守的是？", "a": ["资产负债率", "流动比率", "现金比率", "速动比率", "", ""], "r": "C", "e": "资产负债率衡量长期偿债能力，排除A。流动比率、速动比率和现金比率是短期偿债能力指标，现金比率只考虑现金类资产偿还流动负债，最保守。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623578", "t": 1, "q": "下列关于营运资金管理策略的说法，错误的是？", "a": ["激进型策略下，企业的流动资产投资规模较小", "三种策略中，激进型策略的收益潜力最大", "保守型策略下，企业的财务风险较低", "适中型策略下，流动资产和流动负债保持固定比例", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623579", "t": 1, "q": "某公司每股普通股的年股利额为8元，企业投资要求得到的收益率为4%，则普通股的内在价值是（　）", "a": ["80元", "200元", "400元", "30元", "", ""], "r": "B", "e": "根据固定股利股票价值模型，普通股内在价值=年股利额÷收益率，即8÷4% = 200元。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623580", "t": 1, "q": "下列关于企业预算执行考核的说法，错误的是？", "a": ["是企业绩效评价的主要内容", "不能与预算执行单位负责人的奖惩挂钩", "应当结合年度内部经济责任制进行考核", "是企业内部人力资源管理的参考", "", ""], "r": "B", "e": "企业预算执行考核可与预算执行单位负责人奖惩挂钩，B选项说法错误。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623581", "t": 1, "q": "下列项目中，不属于现金流出项目的是（　）。", "a": ["经营成本", "折旧费", "建设投资", "各项税款", "", ""], "r": "B", "e": "折旧费是非付现成本，不产生实际现金流出。经营成本、建设投资、各项税款都会导致现金流出。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623582", "t": 1, "q": "管理会计信息在质量上符合相关性和可信性的要求,则说明管理会计信息符合（　）。", "a": ["及时性原则", "最优化原则", "决策有用性原则", "效益性原则", "", ""], "r": "C", "e": "决策有用性要求管理会计信息具有相关性和可信性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623583", "t": 1, "q": "普通年金是指（　）。", "a": ["后付年金", "永续年金", "先付年金", "递延年金", "", ""], "r": "A", "e": "普通年金是在每期期末收付的年金，也叫后付年金。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546281623584", "t": 1, "q": "在单利方式下，某项投资4年后可得收益30万元，按年礼率6%计算，其收益现值为（　）", "a": ["24.2万元", "23.8万元", "30万元", "24万元", "", ""], "r": "A", "e": "单利现值公式为P = F / (1 + ni)，其中F是终值（本题为30万元），n是期数（本题为4年），i是年利率（本题为「test/yiwen_img/importSubject/2034528542036987904.png」）。代入可得「test/yiwen_img/importSubject/2034528542196371456.png」万元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817856", "t": 1, "q": "在应用历史资料分析法进行成本形态分析时，必须首先确定a，然后才能计算出b的方法是（　）", "a": ["高低点法", "直接分析法", "散布图法", "回归直线法", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817857", "t": 1, "q": "下列关于预算考核的说法，正确的是？", "a": ["预算考核只针对财务指标", "预算考核不需要遵循任何标准", "预算考核是预算控制的重要环节", "预算考核与员工绩效无关", "", ""], "r": "C", "e": "预算考核并非只针对财务指标，还有非财务指标，A错误；预算考核需遵循一定标准，B错误；预算考核会与员工绩效挂钩，D错误；预算考核是预算控制重要环节，能促进预算目标实现。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817858", "t": 1, "q": "以获得最大净利为目标的组织单位是（　）。", "a": ["利润中心", "投资中心", "责任中心", "成本中心", "", ""], "r": "A", "e": "利润中心是对利润负责的责任中心，以获得最大净利为目标。投资中心更强调投资效果；责任中心是一个宽泛概念；成本中心主要关注成本控制。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817859", "t": 1, "q": "对投资中心考核的重点是（　）。", "a": ["销售收入", "剩余收益", "营业利润", "贡献边际", "", ""], "r": "B", "e": "投资中心既要对成本、收入和利润负责，又要对投资效果负责。剩余收益指标能综合体现投资中心的投入产出关系，反映其投资效果，所以对投资中心考核的重点是剩余收益。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817860", "t": 1, "q": "在复利方式下，某项投资4年后可得收益30万元，按年利率6%计算，其现值为（　）", "a": ["24万", "23.8万元", "30万元", "24.2万元", "", ""], "r": "B", "e": "本题可根据复利现值的计算公式来求解。复利现值的计算公式为「test/yiwen_img/importSubject/2034528542250897408.png」，其中P为现值，F为终值，i为年利率，n为期数。已知F = 30万元，「test/yiwen_img/importSubject/2034528542297034752.png」，n = 4，将这些值代入公式可得：「test/yiwen_img/importSubject/2034528542376726528.png」（万元）所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817861", "t": 1, "q": "在财务管理的基本环节中，根据企业经营战略的要求和国家宏观经济政策的要求，从提高企业经济效益的理财目标出发，在若干个可以选择的财务活动方案中，选择一个最优方案的财务管理环节是（　）", "a": ["财务分析", "财务预测", "财务计划", "财务决策", "", ""], "r": "D", "e": "财务决策就是从若干个可选择的财务活动方案中选最优方案。财务分析是评价财务状况等；财务预测是预估未来财务情况；财务计划是规划财务活动。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817862", "t": 1, "q": "下列关于总资产周转率的说法，正确的是？", "a": ["总资产周转率与流动资产周转率无关", "该指标等于营业收入与平均总资产的比值", "总资产周转率越高，表明企业资产运营效率越低", "只反映企业的盈利能力", "", ""], "r": "B", "e": "总资产周转率=营业收入/平均总资产。它与流动资产周转率有关，周转率越高运营效率越高，不仅反映盈利能力还体现资产运营效率。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817863", "t": 1, "q": "下列财务指标中，可用于分析企业长期偿债能力的是？", "a": ["权益乘数", "现金比率", "应收账款周转率", "营业利润率", "", ""], "r": "A", "e": "权益乘数反映资产总额相当于股东权益的倍数，可衡量企业长期偿债的财务杠杆程度，用来分析长期偿债能力；现金比率衡量短期偿债能力；应收账款周转率反映营运能力；营业利润率体现盈利能力。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817864", "t": 1, "q": "某企业每月固定成本1000元，单价10元，计划销售量600件，欲实现目标利润800元，其单位变动成本为（　）元。", "a": ["8", "7", "9", "10", "", ""], "r": "B", "e": "根据利润公式：利润 = 销售量×（单价 - 单位变动成本）- 固定成本，设单位变动成本为x元，可列方程800 = 600×(10 - x) - 1000，解得x = 7。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817865", "t": 1, "q": "零基预算在编制过程中，耗费时间和精力最多的环节是？", "a": ["分配资金", "提出费用预算方案", "划分不可避免费用项目和可避免费用项目", "对各项费用进行成本-效益分析", "", ""], "r": "D", "e": "零基预算编制时，对各项费用进行成本 - 效益分析需详细考量各费用的投入产出，要收集大量数据并进行复杂评估，最耗时间精力。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817866", "t": 1, "q": "为保证管理会计信息质量对决策有用，通常要求将有关的未来信息估计误差控制在决策者可以接受的一定可信区间内，这体现了可信性原则中的（　）。", "a": ["效益性要求", "最优化要求", "可理解性要求", "可靠性要求", "", ""], "r": "D", "e": "题干强调将未来信息估计误差控制在可接受可信区间，这是为保证信息可靠，符合可靠性要求。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817867", "t": 1, "q": "产权比率为3/5，则权益乘数为（　）", "a": ["7/3", "8/3", "8/5", "3/5", "", ""], "r": "C", "e": "产权比率=负债总额/所有者权益，权益乘数=资产总额/所有者权益，而资产总额=负债总额 + 所有者权益。已知产权比率为3/5，设负债为3，所有者权益为5，则资产为8，权益乘数=8/5。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817868", "t": 1, "q": "下列项目中，能够规定管理会计工作对象基本活动空间的假设是（　）", "a": ["多层主体假设", "充分占有信息假设", "理性行为假设", "合理预期假设", "", ""], "r": "A", "e": "管理会计工作对象活动空间具有多层次性，多层主体假设规定了其基本活动空间。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817869", "t": 1, "q": "当某方案的净现值大于零时，其内部收益率（　）。", "a": ["一定大于设定折现率", "一定小于设定折现率", "可能等于设定折现率", "可能小于零", "", ""], "r": "A", "e": "净现值大于零，意味着项目实际收益率超过了设定折现率，而内部收益率是使净现值为零的折现率，所以内部收益率一定大于设定折现率。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817870", "t": 1, "q": "在进行投资项目评价时，下列关于净现值法和现值指数法的说法，正确的是？", "a": ["净现值法和现值指数法均考虑了货币时间价值", "净现值法适用于独立投资方案的决策", "净现值法和现值指数法均不考虑原始投资额", "现值指数法不能反映投资项目的实际收益率", "", ""], "r": "A", "e": "净现值和现值指数都要对未来现金流量折现，考虑了货币时间价值；净现值法适合互斥方案决策，现值指数法适用于独立投资方案；净现值考虑原始投资额；现值指数本身不能直接反映实际收益率。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817871", "t": 1, "q": "资金时间价值的实质是（　）", "a": ["劳动手段的增值额", "放弃劳动偏好所得的报酬", "资金周转使用后的增值额", "推迟消费时间的报酬", "", ""], "r": "C", "e": "资金时间价值是指资金在周转使用过程中，由于时间因素而形成的差额价值，即资金周转使用后的增值额。A选项劳动手段增值额不准确；B选项放弃劳动偏好报酬说法错误；D选项推迟消费报酬只是一方面表现，不是实质。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817872", "t": 1, "q": "下列属于企业长期偿债能力分析指标的是？", "a": ["流动比率", "速动比率", "现金比率", "利息保障倍数", "", ""], "r": "D", "e": "A、B、C选项的流动比率、速动比率、现金比率都是衡量短期偿债能力的指标，而利息保障倍数反映企业支付利息的能力，是长期偿债能力分析指标。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817873", "t": 1, "q": "某企业的权益乘数为2.5，则该企业的资产负债率为？", "a": ["60%", "50%", "25%", "40%", "", ""], "r": "A", "e": "权益乘数=资产总额/所有者权益总额，资产负债率=负债总额/资产总额。权益乘数为2.5，设所有者权益为1，则资产为2.5，负债=资产 - 所有者权益=2.5 - 1 = 1.5，资产负债率=1.5÷2.5 = 60%。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817874", "t": 1, "q": "下列有关战略分析的说法不正确的是（　）。", "a": ["外部因素分析主要包括宏观环境分析、产业环境分析、经营环境分析", "外部因素分析关键在于揭示企业所面临的主要机会和威胁", "价值链分析能够使企业识别经营活动中哪些业务能创造价值，哪些业务不能创造价值", "SWOT分析的目的是找到内部资源和外部环境相匹配的战略", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817875", "t": 1, "q": "下列关于滚动预算的表述，正确的是？", "a": ["按照逐月滚动方式编制的预算最为精确", "有利于企业近期目标和远期目标的结合", "编制工作量较大", "预算期通常固定为一个会计年度", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817876", "t": 1, "q": "滚动预算按时间单位滚动，最精确但工作量最大的方式是？", "a": ["逐季滚动", "混合滚动", "逐月滚动", "逐年滚动", "", ""], "r": "C", "e": "滚动预算按时间单位滚动有多种方式，逐月滚动是每月调整一次预算，能提供最精确的预算信息，但因为每月都要操作，工作量最大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817877", "t": 1, "q": "企业资金运动的中心环节是（　）", "a": ["资金筹集", "资金耗费", "资金投放", "资金分配", "", ""], "r": "C", "e": "资金投放是企业将筹集到的资金投入到生产经营等活动中，是资金运动的中心环节，它决定了企业能否获得收益和发展。而资金筹集是起点，资金耗费是生产经营中的成本支出，资金分配是资金运动的终点。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817878", "t": 1, "q": "在零部件自制或外购的决策中，如果零部件的需用量尚不确定，应当采用的决策方法是（　）", "a": ["相关成本分析法", "差别损益分析法", "成本无差别点法", "相关损益分析法", "", ""], "r": "C", "e": "本题可根据各决策方法的适用条件来选择答案。### 各方法适用条件分析 相关成本分析法：适用于各备选方案的相关收入均为零，相关业务量确定的情况。 差别损益分析法：适用于同时涉及相关收入和相关成本的方案的比较决策。 成本无差别点法：成本无差别点法是指在各备选方案的相关收入均为零，相关业务量为不确定因素时，通过判断处于不同水平上的业务量与成本无差别点业务量之间的关系，来作出互斥方案决策的一种方法。 相关损益分析法：是在进行短期经营决策时，以相关损益指标作为决策评价指标的一种决策方法，适用于相关业务量确定的情况。### 题干条件分析题干中明确指出零部件的需用量尚不确定，结合上述各方法适用条件可知，应当采用成本无差别点法进行决策。综上，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817879", "t": 1, "q": "编制弹性预算首先应当考虑及确定的因素是（　）。", "a": ["固定成本", "变动成本", "计量单位", "业务量", "", ""], "r": "D", "e": "弹性预算是根据业务量的不同而编制的预算，编制时首先要考虑业务量范围。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817880", "t": 1, "q": "广告费、租赁费、销售机构经费属于（　）", "a": ["销售费用", "管理费用", "财务费用", "制造费用", "", ""], "r": "A", "e": "广告费、租赁费、销售机构经费都与产品销售活动相关，这些费用应计入销售费用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817881", "t": 1, "q": "下列属于营运能力分析指标的是？", "a": ["速动比率", "销售净利率", "净资产收益率", "存货周转率", "", ""], "r": "D", "e": "营运能力分析主要衡量企业资产运营效率。存货周转率反映存货周转速度，体现企业存货管理水平和营运能力。速动比率是短期偿债能力指标；销售净利率和净资产收益率是盈利能力指标。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817882", "t": 1, "q": "已知生产工人劳动生产率提高了15%，平均工资增长了5.8%，企业直接工资费用占成本的比率为15%，由于直接人工费用变动为产品成本带来的降低率是（　）", "a": ["1.5%", "1.45%", "1.2%", "1.4%", "", ""], "r": "C", "e": "直接人工费用变动影响成本降低率公式为：直接人工费用变动影响成本降低率 =（1 - （1 + 平均工资增长率）/（1 + 劳动生产率增长率））× 直接工资费用占成本的比率。代入数据可得：（1 - （1 + 5.8%）/（1 + 15%））× 15% = 1.2%。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817883", "t": 1, "q": "下列关于企业预算调整的说法，错误的是？", "a": ["企业预算一经批复下达，不得调整", "预算调整重点应当放在预算执行中出现的重要的、非正常的、不符合常规的关键性差异方面", "预算调整事项不能偏离企业发展战略", "预算调整方案应当在经济上能够实现最优化", "", ""], "r": "A", "e": "企业预算一般情况下不能随意调整，但当内外部环境发生重大变化等特殊情况时是可以调整的，A说法太绝对。B、C、D选项都是合理的预算调整要求。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817884", "t": 1, "q": "计算加权平均资本成本时，权重的确定方法不包括？", "a": ["历史价值权数", "市场价值权数", "账面价值权数", "目标价值权数", "", ""], "r": "A", "e": "计算加权平均资本成本时，权重确定方法有市场价值权数、账面价值权数、目标价值权数，没有历史价值权数。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817885", "t": 1, "q": "下列关于内部收益率（IRR）的说法中，错误的是？", "a": ["内部收益率是使净现值为零的折现率", "内部收益率反映了投资项目实际可能达到的投资收益率", "内部收益率法能直接用于对互斥方案的决策", "当内部收益率大于必要报酬率时，项目可行", "", ""], "r": "C", "e": "内部收益率法在对互斥方案决策时，可能会出现与净现值法结论不一致的情况，不能直接用于互斥方案决策。A选项是内部收益率定义；B选项是其特点；D选项是项目可行的判断规则。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817886", "t": 1, "q": "下列各项中，属于各种类型投资项目必备内容的是（　）。", "a": ["开办费投资", "固定资产投资", "无形资产投资", "流动资金投资", "", ""], "r": "B", "e": "投资项目中固定资产投资较为普遍，是各种类型投资项目基本都会涉及的内容；开办费、无形资产、流动资金并非所有项目都必备。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817887", "t": 1, "q": "下列有关无形资产的表述中不正确的是（　）", "a": ["变现能力强", "未来经济效益的不确定性", "不具有流动性", "没有实物形态", "", ""], "r": "A", "e": "无形资产没有实物形态、未来经济效益不确定、不具流动性。而它变现能力弱，并非强。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817888", "t": 1, "q": "在企业生产经营期间发生的汇兑损益，应计入（　）", "a": ["递延资产", "资本公积金", "生产成本", "财务费用", "", ""], "r": "D", "e": "企业生产经营期间的汇兑损益属于企业理财活动产生的，应计入财务费用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817889", "t": 1, "q": "在财务分析中，反映企业盈利能力的核心指标是？", "a": ["总资产净利率", "销售净利率", "营业利润率", "净资产收益率", "", ""], "r": "D", "e": "净资产收益率是反映企业盈利能力的核心指标，它体现了自有资本获得净收益的能力，综合性强，能反映企业运营与管理各方面的效益。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817890", "t": 1, "q": "下列各项中，不属于滚动预算优点的是？", "a": ["有利于充分发挥预算的指导和控制作用", "能够保持预算的持续性", "便于将实际数与预算数进行对比", "使预算期间与会计期间相分离", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817891", "t": 1, "q": "若企业速动比率大于1，用现金偿还一笔短期借款，速动比率会？", "a": ["不变", "无法确定", "下降", "上升", "", ""], "r": "D", "e": "速动比率=速动资产/流动负债，用现金偿还短期借款，速动资产和流动负债等额减少。因为速动比率大于1，分子分母减少相同金额，速动比率会上升。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817892", "t": 1, "q": "在进行投资项目评价时，现值指数法的主要优点是？", "a": ["直接反映投资项目的实际收益率", "考虑了原始投资额与收益的关系", "计算过程简单", "适用于互斥投资方案的决策", "", ""], "r": "B", "e": "现值指数是未来现金净流量现值与原始投资额现值之比，考虑了原始投资额与收益的关系。它不能直接反映实际收益率，计算过程也不简单，且不适用于互斥投资方案决策。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817893", "t": 1, "q": "在计算加权平均资本成本时，最理想的权重是？", "a": ["账面价值权重", "目标价值权重", "历史价值权重", "市场价值权重", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817894", "t": 1, "q": "下列关于企业风险控制的表述，正确的是？", "a": ["风险控制应贯穿企业经营活动全过程", "审计监督只能在事后发现风险", "风险控制的目标是完全消除所有风险", "内部控制制度是进行风险控制的唯一手段", "", ""], "r": "A", "e": "风险控制需贯穿企业经营各环节，A正确；审计监督可事前、事中、事后发挥作用，B错误；风险无法完全消除，C错误；风险控制手段多样，内控只是其中之一，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817895", "t": 1, "q": "如果某项资产的预计使用年限是12年，而合同规定的受益年限是10年，法律规定的年限是5年，则其摊销年限应不超过（　）", "a": ["12年", "5年", "10年", "7年", "", ""], "r": "B", "e": "无形资产摊销年限应取预计使用年限、合同规定受益年限、法律规定年限中的最短者。本题中最短年限是法律规定的5年。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817896", "t": 1, "q": "下列关于产品的边际贡献的计算公式中，说明正确的是（　）", "a": ["边际贡献=销售收入*（1-变动成本率）", "边际贡献=销售收入*（1-变动成本率）-固定成本", "边际贡献=销售收入*（1-边际贡献率）", "边际贡献=销售收入-边际成本-固定成本", "", ""], "r": "A", "e": "边际贡献=销售收入 - 变动成本，变动成本率=变动成本/销售收入，所以边际贡献=销售收入 - 销售收入×变动成本率=销售收入×（1 - 变动成本率）。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817897", "t": 1, "q": "在财务分析中，将企业的财务指标与同行业平均水平进行对比，属于？", "a": ["因素分析法", "趋势分析法", "比率分析法", "比较分析法", "", ""], "r": "D", "e": "比较分析法是将实际数与基数对比来揭示差异和矛盾，把企业财务指标与同行业平均水平对比就是比较分析法的应用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817898", "t": 1, "q": "一定期限内每期相等金额的收付款项是（　）", "a": ["单利", "年金", "复利", "股利", "", ""], "r": "B", "e": "年金的定义就是一定期限内每期相等金额的收付款项。单利是按本金计算利息；复利是利滚利；股利是公司向股东分配的利润。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528546285817899", "t": 1, "q": "下列关于审计监督的说法，正确的是？", "a": ["内部审计只关注财务收支情况", "审计监督与企业战略无关", "审计监督可发现内部控制缺陷", "外部审计不能对内部控制进行评价", "", ""], "r": "C", "e": "内部审计内容广泛，不止关注财务收支，A错误；审计监督能为企业战略决策提供依据，与企业战略有关，B错误；外部审计可以对内部控制进行评价，D错误；审计监督通过审查能发现内部控制缺陷，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790720", "t": 2, "q": "完全成本法计入当期利润表的期间成本包括（　）。", "a": ["固定性销售和管理费用", "变动性制造费用", "变动性销售和管理费用", "制造费用", "", ""], "r": "AC", "e": "完全成本法下，产品成本包含全部生产成本，期间成本是指非生产成本。变动性制造费用和制造费用属于生产成本；固定性销售和管理费用、变动性销售和管理费用是非生产成本，属于期间成本。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790721", "t": 2, "q": "下列属于内部控制活动要素的内容有？", "a": ["内部审计", "授权审批控制", "会计系统控制", "不相容职务分离控制", "", ""], "r": "BCD", "e": "内部控制活动包括不相容职务分离控制、授权审批控制、会计系统控制等。内部审计属于内部监督要素。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790722", "t": 2, "q": "经营杠杆系数通过以下公式计算:（　）。", "a": ["销售量的利润灵敏度×100", "利润变动率／业务量变动率", "业务量变动率／利润变动率", "基期贡献边际／基期利润", "", ""], "r": "BD", "e": "经营杠杆系数反映利润变动对业务量变动的敏感程度，其定义公式是利润变动率与业务量变动率之比。此外，经营杠杆系数也等于基期贡献边际除以基期利润。所以BD都正确。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790723", "t": 2, "q": "企业内部控制中的风险评估要素包括？", "a": ["目标设定，明确企业经营活动目标", "风险应对，制定应对风险的策略和措施", "风险分析，评估风险发生的可能性和影响程度", "风险识别，查找企业面临的内外部风险", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790724", "t": 2, "q": "现金流入的内容有（　）。", "a": ["营业收入", "经营成本", "营业净利", "回收流动资金", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790725", "t": 2, "q": "贡献边际率的计算公式可表示为（　）", "a": ["1 - 变动成本率", "单位贡献边际 / 单价", "固定成本 / 保本销售额", "贡献边际 / 销售收入", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790726", "t": 2, "q": "零基预算相比传统增量预算的优势在于？", "a": ["能够调动各部门参与预算编制的积极性", "不受历史数据限制，更能适应企业战略变化", "有助于发现和消除低效或不必要的费用支出", "编制过程简单，所需时间和人力成本低", "", ""], "r": "ABC", "e": "零基预算不依赖历史数据，从实际需求出发，能适应战略变化、发现并消除不必要费用，还可调动部门积极性。但编制过程复杂，时间和人力成本高。所以D不是优势。ABC是零基预算相比传统增量预算的优势。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790727", "t": 2, "q": "在编制现金预算时，（　）是决定企业是否进行资金融通以及资金融通数额的依据。", "a": ["企业既定的现金余额范围", "预算期内发生的现金收入", "期初现金余额", "期末现金余额", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790728", "t": 2, "q": "计算资本成本时，需要考虑所得税影响的有？", "a": ["留存收益资本成本", "发行债券资本成本", "长期借款资本成本", "普通股资本成本", "", ""], "r": "BC", "e": "债务利息可在税前扣除，能抵税，所以计算债务资本成本要考虑所得税影响。债券和长期借款属于债务筹资。而留存收益和普通股资本成本，其资金使用成本不能在税前扣除，不考虑所得税影响。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790729", "t": 2, "q": "企业的组织机构包括（　）", "a": ["执行机构", "决策机构", "监督机构", "活动机构", "", ""], "r": "ABC", "e": "企业组织机构一般包括决策机构、执行机构和监督机构。决策机构负责重大决策，执行机构负责执行决策，监督机构负责监督企业运营。而“活动机构”并非企业组织机构常见分类。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790730", "t": 2, "q": "财务预算的主要内容包括（　）。", "a": ["预计利润表", "现金预算", "预计资产负债表", "投资决策预算", "", ""], "r": "ABC", "e": "财务预算是一系列专门反映企业未来一定预算期内预计财务状况和经营成果，以及现金收支等价值指标的各种预算的总称，主要包括现金预算、预计利润表和预计资产负债表。投资决策预算属于专门决策预算，并非财务预算主要内容。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790731", "t": 2, "q": "可以计入企业管理费用的税金有（　）", "a": ["所得税", "印花税", "车船使用税", "增值税", "", ""], "r": "BC", "e": "所得税是在利润总额后核算，不计入管理费用；增值税是价外税，不影响损益也不计入管理费用。印花税和车船使用税可计入管理费用。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790732", "t": 2, "q": "零基预算的优点包括？", "a": ["编制过程简单快捷，节省时间成本", "有助于发现和消除低效或不必要的费用支出", "能够调动各部门降低费用的积极性", "不受现有费用项目限制，有利于合理配置资源", "", ""], "r": "BCD", "e": "零基预算不考虑以往情况，重新评估各项费用。它能发现并消除低效或不必要支出，调动部门降费积极性，且不受现有项目限制利于资源合理配置，但编制过程复杂、成本高。A选项错误。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790733", "t": 2, "q": "滚动预算的滚动方式包括？", "a": ["逐年滚动，适用于长期战略规划", "逐月滚动，预算编制和调整最为细致", "混合滚动，结合了月份和季度滚动的优点", "逐季滚动，编制工作量相对较小", "", ""], "r": "BCD", "e": "逐年滚动一般不常用，A错误；逐月滚动每月调整，预算编制和调整最细致，B正确；混合滚动兼具月、季滚动优点，C正确；逐季滚动按季调整，编制工作量比逐月小，D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790734", "t": 2, "q": "可以套用\"用量差异\"和\"价格差异\"模式的成本项目是（　）。", "a": ["期间费用", "变动性制造费用", "固定性制造费用", "直接材料", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790735", "t": 2, "q": "西方管理会计师职业团体主要从事的工作包括（　）", "a": ["制定规范和标准", "组织纯学术研究", "组织专业资格考试", "安排后续教育", "", ""], "r": "ACD", "e": "西方管理会计师职业团体主要工作是规范行业、培养专业人才等。制定规范和标准可确保行业有序；组织专业资格考试利于选拔人才；安排后续教育能提升从业者能力。而职业团体更侧重应用研究，非纯学术研究。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790736", "t": 2, "q": "滚动预算的编制特点包括？", "a": ["预算期始终保持一定期限", "逐月滚动编制工作量大但更精确", "能更好地适应市场变化和企业经营调整", "根据实际情况定期滚动更新预算", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790737", "t": 2, "q": "假设甲、乙证券收益的相关系数接近于零，甲证券的预期报酬率为6%（标准差为10%），乙证券的预期报酬率为8%（标准差为15%），则由甲、乙证券构成的投资组合（　）。", "a": ["最高的预期报酬率为8%", "最低的标准差小于10%", "最低的预期报酬率为6%", "最高的标准差大于15%", "", ""], "r": "ABC", "e": "投资组合预期报酬率是各证券预期报酬率的加权平均，所以组合最低预期报酬率是甲的6%，最高是乙的8%；相关系数接近于零，组合标准差会小于各证券标准差的加权平均，所以最低标准差小于甲的10%，最高标准差小于乙的15%。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790738", "t": 2, "q": "在下列预算中，属于业务预算的内容的有（　）。", "a": ["生产预算", "现金预算", "销售预算", "资本支出预算", "", ""], "r": "AC", "e": "业务预算是与企业日常经营活动直接相关的预算。生产预算是为规划生产规模而编制，销售预算是业务预算的起点，二者都和日常经营相关。现金预算属于财务预算，资本支出预算属于专门决策预算。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790739", "t": 2, "q": "下列会影响企业流动比率的业务有？", "a": ["用银行存款购买原材料", "发行股票收到现金", "偿还短期借款", "赊销商品", "", ""], "r": "BCD", "e": "流动比率=流动资产/流动负债。A项，银行存款和原材料都属流动资产，一增一减总额不变，不影响流动比率；B项，发行股票收现金使流动资产增加，流动负债不变，流动比率上升；C项，偿还短期借款使流动资产和流动负债同减，流动比率变化不确定；D项，赊销商品使流动资产增加，流动负债不变，流动比率上升。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790740", "t": 2, "q": "利润最大化不是企业最优的财务管理目标，其原因有（　）", "a": ["没有考虑利润与投入资本的关系", "不能直接反映企业创造的收益", "可能使企业产生追求短期利益的行为", "没有考虑企业成本的高低", "", ""], "r": "AC", "e": "利润最大化没考虑利润与投入资本关系，易导致企业追求短期利益。能直接反映收益，且考虑了收入和成本得出利润。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790741", "t": 2, "q": "内部收益率（IRR）法的局限性体现在？", "a": ["可能存在多个IRR值，导致决策混乱", "计算过程复杂，特别是对非常规现金流量项目", "不能直接用于互斥方案的优选决策", "未考虑货币时间价值", "", ""], "r": "ABC", "e": "内部收益率考虑了货币时间价值，D错误；A选项，非常规现金流量可能有多个IRR值，会造成决策混乱；B选项，对于非常规现金流量，IRR计算复杂；C选项，IRR不能直接用于互斥方案优选。ABC均是其局限性。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790742", "t": 2, "q": "关于企业营运能力指标，以下说法正确的有？", "a": ["流动资产周转率反映流动资产的周转速度", "总资产周转率与企业盈利能力无关", "应收账款周转率越高，收账速度越快", "存货周转率低可能意味着存货积压", "", ""], "r": "ACD", "e": "流动资产周转率体现流动资产周转速度；应收账款周转率高表明收账快；存货周转率低常代表存货积压。而总资产周转率与企业盈利能力有关，周转快利于盈利。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790743", "t": 2, "q": "短期经营决策分析主要包括（　）。", "a": ["定价决策分析", "战略决策分析", "销售决策分析", "生产经营决策分析", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790744", "t": 2, "q": "调查客户信用状况所有的信用资料的来源主要有（　）", "a": ["企业财务报表", "媒体的报道", "来自企业主管部门和其他部门的资料", "来自信用评估机构的资料", "", ""], "r": "ACD", "e": "企业财务报表能直观体现客户财务状况；信用评估机构有专业评估，资料具参考性；企业主管部门等也能提供相关信用信息；媒体报道虽有但并非主要信用资料来源。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790745", "t": 2, "q": "下列可能影响企业流动资产周转率的因素有？", "a": ["应付账款支付期限", "应收账款回收速度", "货币资金持有量", "存货管理水平", "", ""], "r": "BCD", "e": "流动资产周转率受流动资产各组成部分管理水平影响。应收账款回收速度快、货币资金持有合理、存货管理水平高，都会使流动资产利用效率提高，影响周转率；而应付账款支付期限主要影响流动负债，对流动资产周转率无直接影响。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790746", "t": 2, "q": "关于企业的应收账款周转率，下列说法正确的有？", "a": ["应收账款周转率越低，坏账风险越大", "应收账款周转率过高可能意味着信用政策过严", "应收账款周转率高，说明收账迅速", "应收账款周转率与销售规模无关", "", ""], "r": "ABC", "e": "应收账款周转率反映应收账款周转速度，周转率低意味着回收慢，坏账风险大；过高可能是信用政策过严，限制销售；周转率高表明收账快；它与销售规模相关。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790747", "t": 2, "q": "在财务分析中，比率分析法常用的比率类型有？", "a": ["构成比率", "效率比率", "趋势比率", "相关比率", "", ""], "r": "ABD", "e": "比率分析法常用比率有构成比率、效率比率、相关比率。趋势比率并非常用类型。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790748", "t": 2, "q": "滚动预算按照滚动的时间单位不同，可分为？", "a": ["混合滚动", "逐季滚动", "逐月滚动", "逐年滚动", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790749", "t": 2, "q": "关于企业资本成本，下列说法正确的有？", "a": ["留存收益资本成本计算时无需考虑筹资费用", "股权资本成本高于债务资本成本，通常风险较高", "资本成本是企业投资决策时要求的最低报酬率", "加权平均资本成本是企业全部长期资本的平均成本", "", ""], "r": "ABCD", "e": "留存收益是企业内部资金，无筹资费用，A对；股权投资者承担风险大，要求回报高，所以股权资本成本高于债务资本成本，B对；资本成本是投资要求的最低报酬率，C对；加权平均资本成本就是企业全部长期资本的平均成本，D对。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790750", "t": 2, "q": "（　）属于现代管理会计的基本内容。", "a": ["预算会计", "预测决策会计", "责任会计", "规划控制会计", "", ""], "r": "BCD", "e": "现代管理会计基本内容包括预测决策会计、规划控制会计和责任会计。预算会计是传统财务会计内容。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528547925790751", "t": 2, "q": "内部收益率实际上就是（　）。", "a": ["资金成本", "使投资方案现值指数等于1的贴现率", "现值指数", "使投资方案净现值等于0的贴现率", "", ""], "r": "BD", "e": "内部收益率是使投资方案净现值等于0的贴现率，同时也意味着此时现值指数等于1。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528548529770496", "t": 3, "q": "在变动成本法下，产品成本中包括全部的变动成本而不包括固定成本，固定成本作为期间成本在发生的当期全部直接转为费用。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 财务管理（5）", "n": "基础练习题【含解析】 / 第1章 财务管理（5）", "qs": [{"id": "2034528554515042304", "t": 1, "q": "资本支出预算是（　）。", "a": ["业务预算", "生产预算", "财务预算", "专门决策预算", "", ""], "r": "D", "e": "资本支出预算是为了长期投资决策而编制的预算，属于专门决策预算。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554515042305", "t": 1, "q": "某企业的长期资产总额为100万元，债务资本占总资本的40%，债务资本的利率为10%，当企业销售额为80万元，税息前利润为20万元时，财务杠杆系数为（　）", "a": ["126", "1.2", "3.2", "1.25", "", ""], "r": "D", "e": "财务杠杆系数=息税前利润÷（息税前利润 - 利息）。债务资本占总资本40%，长期资产总额100万，所以债务资本为100×40% = 40万，利息 = 40×10% = 4万，息税前利润20万，代入公式得20÷(20 - 4)=1.25。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554515042306", "t": 1, "q": "某企业拟以\"2/20,n/30\"的信用条件购进原材料一批，则付款企业放弃现金折扣的机会成本率为（　）", "a": ["2%", "36%", "36.73%", "18%", "", ""], "r": "C", "e": "放弃现金折扣机会成本率公式为：\\[ \\frac{折扣百分比}{1 - 折扣百分比}×\\frac{360}{信用期 - 折扣期} \\]本题中折扣百分比为「test/yiwen_img/importSubject/2034528549918085120.png」，信用期30天，折扣期20天，代入公式可得：\\[ \\frac{2\\%}{1 - 2\\%}×\\frac{360}{30 - 20} \\approx 36.73\\% \\]答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554515042307", "t": 1, "q": "对董事会负责，着眼于企业短期经营行为，执行财务战略，进行财务控制的管理层为（　）", "a": ["经理层", "股东大会", "董事会", "监事会", "", ""], "r": "A", "e": "经理层对董事会负责，负责企业日常经营管理，着眼短期经营行为，执行财务战略和控制。股东大会是最高权力机构；董事会制定战略等；监事会是监督机构。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554515042308", "t": 1, "q": "下列关于速动比率的说法，正确的是？", "a": ["速动比率=（流动资产-存货）÷流动负债", "速动比率为1时最佳", "存货不属于速动资产", "速动比率比流动比率更能准确反映企业短期偿债能力", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554515042309", "t": 1, "q": "企业某部件的年需要量为72000个，其单位变动储存成本为4元，平均每次订货成本为40元，则该部件的经济采购批量为（　）。", "a": ["1200", "85", "849", "120", "", ""], "r": "A", "e": "本题可根据经济采购批量的计算公式来求解。经济采购批量的计算公式为「test/yiwen_img/importSubject/2034528549955833856.png」，其中Q为经济采购批量，K为每次订货成本，D为年需要量，「test/yiwen_img/importSubject/2034528550006165504.png」为单位变动储存成本。已知D = 72000个，K = 40元，「test/yiwen_img/importSubject/2034528550052302848.png」元，将其代入公式可得：「test/yiwen_img/importSubject/2034528550119411712.png」（个）所以该部件的经济采购批量为1200个，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554515042310", "t": 1, "q": "与生产数量没有直接联系，而与批次成正比的成本是（　）。", "a": ["储存成本", "调整准备成本", "单位储存成本", "缺货成本", "", ""], "r": "B", "e": "调整准备成本是每批产品生产前为做好准备工作而发生的成本，与生产批次成正比，和生产数量无直接联系。储存成本、单位储存成本与存货数量相关，缺货成本和缺货情况有关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554515042311", "t": 1, "q": "在财务会计中，应当将销售费用归属于下列各项中的（　）。", "a": ["加工成本", "制造费用", "非生产成本", "主要成本", "", ""], "r": "C", "e": "销售费用是企业销售商品和材料、提供劳务的过程中发生的各种费用，不属于生产环节的成本，属于非生产成本。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554515042312", "t": 1, "q": "在计算普通股资本成本的资本资产定价模型法中，不涉及的参数是？", "a": ["债券票面利率", "股票贝塔系数", "无风险收益率", "市场平均收益率", "", ""], "r": "A", "e": "资本资产定价模型法计算普通股资本成本公式为「test/yiwen_img/importSubject/2034528550165549056.png」，其中「test/yiwen_img/importSubject/2034528550215880704.png」是无风险收益率，「test/yiwen_img/importSubject/2034528550417207296.png」是股票贝塔系数，「test/yiwen_img/importSubject/2034528550467538944.png」是市场平均收益率，不涉及债券票面利率。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236608", "t": 1, "q": "下列指标中，最能综合反映企业自有资金投资收益水平的是？", "a": ["销售毛利率", "总资产净利率", "营业利润率", "净资产收益率", "", ""], "r": "D", "e": "净资产收益率反映自有资本获取净收益的能力，能综合体现企业自有资金投资收益水平；销售毛利率侧重销售业务盈利性，总资产净利率衡量全部资产获利能力，营业利润率关注经营活动盈利能力。答案为D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236609", "t": 1, "q": "下列关于加权平均资本成本的说法，正确的是？", "a": ["权重只能用账面价值确定", "反映企业平均资本成本水平", "计算时无需考虑所得税", "与个别资本成本无关", "", ""], "r": "B", "e": "加权平均资本成本是按各类资本所占总资本来源的权重加权平均计算公司资本成本的方法，能反映企业平均资本成本水平。权重可按账面价值、市场价值、目标价值确定，A错；债务资本成本计算要考虑所得税，C错；它是个别资本成本的加权平均，与个别资本成本有关，D错。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236610", "t": 1, "q": "固定制造费用的实际金额与预算金额之间的差额称为（　）。", "a": ["效率差异", "能量差异", "预算差异", "闲置能量差异", "", ""], "r": "C", "e": "固定制造费用预算差异就是实际金额与预算金额的差额。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236611", "t": 1, "q": "下列关于预算控制的说法，错误的是？", "a": ["预算执行过程需进行监控", "预算调整应严格履行审批程序", "预算考核只针对财务指标", "预算控制需全员参与", "", ""], "r": "C", "e": "预算考核不应只针对财务指标，还应涵盖非财务指标，这样才能更全面评价预算执行情况。A选项预算执行监控是保障预算有效执行的必要措施；B选项严格审批预算调整可保证预算严肃性；D选项全员参与能让各部门和人员都重视预算控制。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236612", "t": 1, "q": "对于合同没有规定受益年限，法律也没有规定有效年限的无形资产，摊销年限应不超过（　）", "a": ["10年", "15年", "20年", "5年", "", ""], "r": "A", "e": "按规定，合同没规定受益年限，法律也没规定有效年限的无形资产，摊销年限不应超过10年。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236613", "t": 1, "q": "当投资决策方案具有不同的投资有效期时，具有较强可比性的决策指标是（　）。", "a": ["净现值率", "净现值", "年等额净回收额", "内部收益率", "", ""], "r": "C", "e": "不同投资有效期下，净现值、净现值率和内部收益率受期限影响，缺乏直接可比性，年等额净回收额将不同期限方案年均化，可直接比较。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236614", "t": 1, "q": "权益乘数与资产负债率之间的关系为（　）", "a": ["无关系", "权益乘数=1/资产负债率", "权益乘数=1/(1-资产负债率)", "权益乘数=1/(1+资产负债率)", "", ""], "r": "C", "e": "权益乘数=资产总额/所有者权益总额，资产负债率=负债总额/资产总额，所有者权益总额 = 资产总额 - 负债总额。经推导可得权益乘数=1/(1 - 资产负债率)。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236615", "t": 1, "q": "某企业在进行成本形态分析时，需要对混合成本进行分解。据此可以断定:该企业应用的是（　）", "a": ["高低点法", "回归直线法", "成本性态分析方法", "同步分析程序", "", ""], "r": "C", "e": "成本性态分析是研究成本与业务量之间的依存关系，要对混合成本分解属于成本性态分析范畴。高低点法和回归直线法是分解混合成本的具体方法；同步分析程序与题干内容无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236616", "t": 1, "q": "下列关于融资的基本程序，排列正确的是（　）", "a": ["318267459", "138267459", "123467859", "138276549", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236617", "t": 1, "q": "企业向银行借款500万元，借款名义利率为7.8%，补偿性余额的比例为10%，则实际利率为（　）", "a": ["8.67%", "8.5%", "8%", "7%", "", ""], "r": "A", "e": "实际利率=名义利率÷（1 - 补偿性余额比例），即7.8%÷（1 - 10%）≈8.67%。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236618", "t": 1, "q": "某投资项目在折现率为10%时，净现值为50万元;折现率为12%时，净现值为-10万元。则该项目的内部收益率（IRR）约为？", "a": ["11.25%", "12.5%", "10.5%", "11.67%", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236619", "t": 1, "q": "下列各项固定资产中，不应计提折旧的是（　）", "a": ["修理用的固定资产", "经营性租入的固定资产", "季节性停用设备", "融资租入的固定资产", "", ""], "r": "B", "e": "经营性租入的固定资产，企业没有所有权，不属于企业资产，所以不应计提折旧。而修理用、季节性停用、融资租入的固定资产都需计提折旧。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236620", "t": 1, "q": "保本作业率与安全边际率之间的关系是（　）", "a": ["两者相等", "后者一般大于前者", "前者一般大于后者", "两者之和等于1", "", ""], "r": "D", "e": "保本作业率是指保本点业务量占正常业务量的比重，安全边际率是指安全边际量与实际或预计销售量的比率，正常业务量由保本点业务量和安全边际量构成，所以保本作业率与安全边际率之和等于1。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236621", "t": 1, "q": "零基预算编制的核心是？", "a": ["对预算项目进行成本-效益分析", "保持预算总额不变", "以历史数据为基础", "按固定比例增减预算金额", "", ""], "r": "A", "e": "零基预算不依赖历史数据，不受以往预算安排情况的影响，一切从实际需要出发，核心是对预算项目进行成本 - 效益分析来确定预算金额。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236622", "t": 1, "q": "下列关于资本成本的说法中，正确的是？", "a": ["资本成本是企业筹资决策的唯一依据", "资本成本包括筹资费用和用资费用两部分", "在计算资本成本时，筹资费用一般作为筹资额的增加处理", "债务资本成本一般高于权益资本成本", "", ""], "r": "B", "e": "A选项，企业筹资决策要考虑多方面因素，资本成本不是唯一依据；C选项，筹资费用应作为筹资额的扣除处理；D选项，债务资本成本一般低于权益资本成本。而资本成本确实包括筹资费用和用资费用两部分。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236623", "t": 1, "q": "企业去年生产某亏损产品的贡献边际为3000元，固定成本是1000元，假定今年其他条件不变，但生产该产品的设备可对外出租，一年的增加收入为（　）元时，应停产该种产品。", "a": ["1999", "2001", "3100", "2900", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236624", "t": 1, "q": "在企业总部统一领导的前提下，合理安排各级单位和各职能部门的权责关系，充分调动各部门的积极性，是民主集中制在财务管理中的具体运用。这是财务管理原则中的（　）", "a": ["分级分口管理原则", "资金合理配置原则", "收益风险均衡原则", "利益关系协调原则", "", ""], "r": "A", "e": "分级分口管理原则强调在企业总部统一领导下，合理划分各级单位和各职能部门权责，调动各部门积极性，与题目描述相符。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236625", "t": 1, "q": "下列各项费用中，属于半变动费用的是（　）", "a": ["运输费", "动力费", "办公费", "仓库使用租金", "", ""], "r": "B", "e": "半变动费用通常有一个初始固定部分，然后随业务量变动。动力费一般有基础费用，还会随使用量增加而变动，属于半变动费用。运输费通常与运输里程等成比例变动，多为变动费用；办公费相对稳定，多是固定费用；仓库使用租金一般固定不变，是固定费用。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236626", "t": 1, "q": "企业实行分期收款销售方式，应在（　）确认销售收入的实现。", "a": ["合同约定收款日", "分期收到货款时", "产品所有权已经转移时", "产品分期发出时", "", ""], "r": "A", "e": "根据分期收款销售的规定，企业应在合同约定收款日确认销售收入。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236627", "t": 1, "q": "在以成本作为内部转移价格制定基础的条件下，如果产品的转移涉及到利润中心或投资中心时，下列方法中能够采用的只能是（　）。", "a": ["实际成本法", "标准成本法", "变动成本法", "标准成本加成法", "", ""], "r": "D", "e": "采用标准成本加成法能分清各责任中心的经济责任，便于正确评价各责任中心的业绩，当产品转移涉及利润中心或投资中心时适用。实际成本法会将供应方成本超支或节约转嫁给使用方；标准成本法不考虑利润；变动成本法不能反映劳动生产率变化对固定成本的影响。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236628", "t": 1, "q": "在财务分析中，杜邦分析法的核心指标是？", "a": ["权益乘数", "净资产收益率", "销售净利率", "总资产净利率", "", ""], "r": "B", "e": "杜邦分析法以净资产收益率为核心，将其分解为多个财务比率乘积，来综合分析企业财务状况。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236629", "t": 1, "q": "某企业销售净利率为10%，总资产周转率为0.8，权益乘数为1.5，则净资产收益率为？", "a": ["15%", "12%", "8%", "10%", "", ""], "r": "B", "e": "根据杜邦分析体系，净资产收益率 = 销售净利率×总资产周转率×权益乘数。将题目中的数据代入公式，即10%×0.8×1.5 = 12%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236630", "t": 1, "q": "下列关于企业盈利能力指标的关系，表述正确的是？", "a": ["净资产收益率=总资产净利率×权益乘数", "成本费用利润率越高，企业盈利能力越强", "总资产收益率受营业利润率影响", "销售毛利率=(营业收入-营业成本)÷营业收入×100%", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236631", "t": 1, "q": "滚动预算的预算期通常是？", "a": ["1个月", "3年", "1年", "1个季度", "", ""], "r": "C", "e": "滚动预算又称连续预算或永续预算，其预算期通常保持1年，每过去一个期间就补充一个期间，使预算始终保持一个固定的期间跨度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236632", "t": 1, "q": "某投资项目初始投资额为100万元，预计未来5年每年现金净流量为30万元，若资本成本为10%，则该项目的净现值约为？（已知（P/A，10%，5）=3.7908）", "a": ["13.724万元", "-13.724万元", "113.724万元", "86.276万元", "", ""], "r": "A", "e": "净现值=未来现金净流量现值 - 初始投资额。每年现金净流量30万元，期限5年，资本成本10%，查年金现值系数（P/A，10%，5）=3.7908，未来现金净流量现值 = 30×3.7908 = 113.724万元，初始投资额100万元，净现值 = 113.724 - 100 = 13.724万元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236633", "t": 1, "q": "在利润不断资本化的条件下，资金时间价值的计算基本应是（　）", "a": ["单利", "复利", "普通年金", "年金", "", ""], "r": "B", "e": "利润不断资本化意味着前期的利息会加入本金继续产生利息，这符合复利的特点。单利仅以本金计算利息；普通年金和年金是特定的资金收付形式，并非资金时间价值计算的基本方式。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236634", "t": 1, "q": "内部收益率法适用于？", "a": ["资本限量情况下的投资决策", "独立投资方案的比较决策", "互斥投资方案的选优决策", "只有初始现金流出的项目", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236635", "t": 1, "q": " 在进行债券投资决策时，债券价值的计算依据是？", "a": ["债券的市场价格与到期收益率", "债券的期限与付息方式", "债券的面值与票面利率", "债券的票面利率与市场利率", "", ""], "r": "D", "e": "债券价值是未来现金流量按市场利率折现的现值，未来现金流量由票面利率决定，折现用市场利率，所以计算依据是票面利率与市场利率。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236636", "t": 1, "q": "在变动成本法下，销售收入减去变动成本等于（　）。", "a": ["贡献边际", "销售毛利", "税后利润", "税前利润", "", ""], "r": "A", "e": "变动成本法下，销售收入减去变动成本得到的是贡献边际。销售毛利是完全成本法概念，税后、税前利润还需扣除固定成本等。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236637", "t": 1, "q": "全部产品成本降低额满足下列哪项条件时，即为完成成本计划？", "a": ["该数值只要不是负数", "该数值必须小于1", "该数值必须大于0", "该数值必须大于1", "", ""], "r": "C", "e": "产品成本降低额大于0意味着实际成本比计划成本低，即完成了成本计划。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236638", "t": 1, "q": "滚动预算相比定期预算，其优势在于？", "a": ["预算期间与会计年度一致", "预算准确性更高", "编制工作量小", "能更好地适应企业经营活动的变化", "", ""], "r": "D", "e": "滚动预算能持续地根据新情况调整和修订预算，可更好适应企业经营活动变化。A是定期预算特点；滚动预算需不断调整，编制工作量大，C错误；滚动预算虽动态但不能直接说准确性更高，B不准确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236639", "t": 1, "q": "在下列指标中，可据以判断企业经营安全程度的指标是（　）", "a": ["保本作业率", "保本额", "保本量", "贡献边际", "", ""], "r": "A", "e": "保本作业率反映了保本业务量占正常业务量的比重，该比重越小，企业经营越安全，所以可据此判断企业经营安全程度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236640", "t": 1, "q": "下列哪项费用属于对外投资成本中的资金成本？（　）", "a": ["对投资项目进行可行性分析时发生的调查费用", "实际用于投资的资金", "筹措对外投资所需资金发生的筹资手续费", "投资收回时发生的费用", "", ""], "r": "C", "e": "资金成本是指企业为筹措和使用资金而付出的代价，筹资手续费属于筹措资金时发生的成本。A是投资前调查费；B是投资资金本身非成本；D是投资收回费用。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236641", "t": 1, "q": " 下列关于内部收益率（IRR）的说法，正确的是？", "a": ["IRR大于必要报酬率时，项目不可行", "IRR是使净现值为零的折现率", "计算IRR时需要事先确定折现率", "IRR越高，项目风险越大", "", ""], "r": "B", "e": "内部收益率是使净现值为零的折现率。当IRR大于必要报酬率时项目可行；计算IRR无需事先确定折现率；IRR高低与项目风险大小无必然联系。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236642", "t": 1, "q": "在管理会计中，变动成本法也可称为（　）。", "a": ["吸收成本法", "完全成本法", "边际成本法", "制造成本法", "", ""], "r": "C", "e": "变动成本法又称直接成本法、边际成本法。吸收成本法、完全成本法、制造成本法是同一概念，与变动成本法不同。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236643", "t": 1, "q": "某企业的权益乘数为2.5，则该企业的资产负债率为？", "a": ["40%", "60%", "25%", "50%", "", ""], "r": "B", "e": "权益乘数=资产/所有者权益，资产负债率=负债/资产。权益乘数为2.5，即资产是所有者权益的2.5倍，设所有者权益为1，则资产为2.5，负债=资产 - 所有者权益=2.5 - 1 = 1.5，资产负债率=1.5÷2.5 = 60%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236644", "t": 1, "q": "零基预算的显著特点是？", "a": ["以过去的费用水平为基础", "按固定的预算期间编制", "预算期与会计年度一致", "一切以零为起点", "", ""], "r": "D", "e": "零基预算不依赖以往费用水平，而是一切以零为起点编制预算。A选项以过去费用水平为基础是传统增量预算特点；B按固定预算期间编制和C预算期与会计年度一致并非零基预算显著特点。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236645", "t": 1, "q": "关于审计监督与内部控制的关系，表述正确的是？", "a": ["审计监督范围小于内部控制", "审计监督可评价内部控制有效性", "审计监督是内部控制的基础", "内部控制能替代审计监督", "", ""], "r": "B", "e": "审计监督可对内部控制的有效性进行评价。A项审计监督范围大于内部控制；C项内部控制是审计监督的基础；D项内部控制不能替代审计监督。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236646", "t": 1, "q": "下列关于营运资金管理的说法中，不正确的是？", "a": ["营运资金越多，说明企业短期偿债能力越强", "营运资金的管理包括流动资产的管理和流动负债的管理", "营运资金过多会降低企业的收益水平", "营运资金就是指流动资产", "", ""], "r": "D", "e": "营运资金是流动资产减去流动负债后的余额，并非仅指流动资产，所以D说法错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236647", "t": 1, "q": "下列各项中，不属于建立简单条件下的采购经济批量控制模型必备条件的是（　）。", "a": ["不存在商业折扣", "不允许出现缺货现象", "一批内不存在分次到货", "不生产多品种", "", ""], "r": "D", "e": "简单条件下采购经济批量控制模型有不存在商业折扣、不允许缺货、一批内不分次到货等假设条件。而是否生产多品种与采购经济批量模型构建无关。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236648", "t": 1, "q": "已知产品销售单价为24元，保本销售量为150件，销售额可达4800元，则安全边际率为（　）", "a": ["33.33%", "25%", "20%", "50%", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236649", "t": 1, "q": "分析销售量有关的因素，建立数学模型预测销售收入的方法是（　）", "a": ["指数平滑法", "特尔菲法", "因果分析法", "调查分析法", "", ""], "r": "C", "e": "因果分析法是分析与销售量有关因素，建立数学模型来预测销售收入。指数平滑法用于时间序列预测；特尔菲法是专家调查法；调查分析法主要靠调查获取信息。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236650", "t": 1, "q": "资金在周转使用中由于时间因素而形成的差额价值称为（　）", "a": ["资金市场价值", "资金时间价值", "资金货币价值", "资金社会价值", "", ""], "r": "B", "e": "资金时间价值就是资金在周转使用中因时间因素形成的差额价值。答案选符合此概念的选项。  答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236651", "t": 1, "q": "关于企业盈利能力指标，下列说法正确的是？", "a": ["营业利润率与净利润无关", "总资产净利率反映企业全部资产的获利水平", "净资产收益率不能衡量自有资金的收益水平", "销售毛利率越高，企业盈利能力越弱", "", ""], "r": "B", "e": "营业利润率与净利润有关；总资产净利率是企业净利润与平均资产总额的比率，反映全部资产获利水平；净资产收益率能衡量自有资金收益水平；销售毛利率越高盈利能力越强。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236652", "t": 1, "q": "零基预算的编制方法最适用于？", "a": ["酌量性固定成本预算", "变动成本预算", "人员经费预算", "固定成本预算", "", ""], "r": "A", "e": "零基预算不受以往预算安排情况的影响，一切从实际需要出发。酌量性固定成本可根据企业经营方针和实际需要灵活确定，适合用零基预算编制。变动成本、人员经费、固定成本并非都适合零基预算。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236653", "t": 1, "q": "某公司发行面值为1000万元的债券，票面利率为12%，偿还期限为5年，发行费率为3%，该债券的发行价格为1200万元，所得税率为33%，该债券的资金成本为（　）", "a": ["6.91%", "8.29%", "9.7%", "9.97%", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236654", "t": 1, "q": "企业与银行签订的借款合同中规定:银行的贷款利率为8%，但企业在银行中要保留10%的补偿性余额。则该笔贷款的实际利率为（　）", "a": ["10.9%", "8.9%", "11.1%", "8.7%", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236655", "t": 1, "q": "某企业采购水泥，采用托收承付结算方式进行货款结算。由火车运输，运输天数为13天，销货单位取得运输凭证后办理托收的间隔天数为1天，双方开户银行办理凭证手续天数1天，凭证邮寄天数为3天，货款承付天数为2天。则在途日数为（　）", "a": ["7天", "8天", "5天", "6天", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236656", "t": 1, "q": "下列属于企业内部控制中控制环境要素的是？", "a": ["内部审计机构设置", "信息系统控制", "风险评估程序", "企业文化", "", ""], "r": "D", "e": "控制环境包括治理职能和管理职能，以及治理层和管理层对内部控制及其重要性的态度、认识和措施。企业文化体现了企业整体的价值观、经营理念等，属于控制环境要素。A选项内部审计机构设置属于监督要素；B选项信息系统控制属于控制活动要素；C选项风险评估程序属于风险评估要素。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236657", "t": 1, "q": "在财务分析中，连环替代法的主要作用是？", "a": ["确定各因素对分析指标的影响方向和程度", "分析财务指标的变动趋势", "对比不同企业的财务数据", "计算各种比率指标", "", ""], "r": "A", "e": "连环替代法是用来分析多个因素对某一指标影响的方法，可确定各因素对分析指标的影响方向和程度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236658", "t": 1, "q": "下列关于滚动预算的表述，错误的是？", "a": ["能及时反映企业经营活动变化", "可以保持预算的连续性和完整性", "便于企业动态调整经营策略", "只能按月份进行滚动编制", "", ""], "r": "D", "e": "滚动预算可按年、季、月等不同周期滚动编制，并非只能按月份，D选项错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236659", "t": 1, "q": "下列关于净现值（NPV）和现值指数（PI）的说法，错误的是？", "a": ["若NPV>0，则PI>1", "NPV是绝对数指标，PI是相对数指标", "计算NPV和PI时，所采用的折现率可以不同", "PI=未来现金净流量现值÷原始投资额现值", "", ""], "r": "C", "e": "计算NPV和PI时，都要用到折现率，且需采用相同的折现率。A选项，NPV>0意味着未来现金净流量现值大于原始投资额现值，所以PI>1；B选项，NPV是金额是绝对数，PI是比值是相对数；D选项是PI的计算公式。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236660", "t": 1, "q": "预测分析的内容不包括（　）。", "a": ["所得税预测", "销售预测", "资金预测", "利润预测", "", ""], "r": "A", "e": "预测分析主要包括销售、利润、成本、资金等预测。所得税是基于利润等计算得出，并非预测分析的核心独立内容。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236661", "t": 1, "q": "下列关于预算控制的说法，错误的是？", "a": ["预算执行过程需要进行监控", "预算考核是预算控制的重要环节", "预算调整不需要遵循严格的审批程序", "预算控制是企业内部控制的重要手段", "", ""], "r": "C", "e": "预算调整需遵循严格审批程序，以保证预算的严肃性和准确性，C选项说法错误。A预算执行监控、B预算考核是重要环节、D是内控重要手段说法均正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236662", "t": 1, "q": "下列关于预算控制的说法，错误的是？", "a": ["预算考核是预算控制的重要环节", "预算一经确定，不得调整", "预算控制需要全员参与", "预算控制是企业内部控制的重要手段", "", ""], "r": "B", "e": "预算在执行过程中，若出现特殊情况是可以调整的，并非一经确定就不得调整。而预算考核是预算控制重要环节，预算控制需全员参与，也是企业内部控制重要手段。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236663", "t": 1, "q": "某企业息税前利润为150万元，利息费用为30万元，所得税税率为25%，则该企业的利息保障倍数是？", "a": ["3", "5", "2.5", "4", "", ""], "r": "B", "e": "利息保障倍数=息税前利润÷利息费用。已知息税前利润150万元，利息费用30万元，150÷30 = 5。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236664", "t": 1, "q": "在材料采购总量不变的前提下，从降低储存保管费用的角度考虑，确定经济采购批量的原则是（　）", "a": ["加大采购批量，减少采购次数", "缩小采购批量，增加采购次数", "保持采购批量与采购次数不变", "加大采购批量，增加采购次数", "", ""], "r": "B", "e": "储存保管费用与采购批量正相关，采购批量越大，储存保管费用越高。要降低储存保管费用，应缩小采购批量；而采购总量不变时，缩小采购批量就需增加采购次数。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236665", "t": 1, "q": "在价格决策中，某产品的有关资料如下:<br />「test/yiwen_img/importSubject/2034528549423157248.png」<br />则该产品的最优售价为（　）", "a": ["33", "31", "36", "32", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236666", "t": 1, "q": "包括建设期的投资回收期恰好是（　）。", "a": ["净现值为零时的年限", "净现金流量为零时的年限", "累计净现值为零时的年限", "累计净现金流量为零时的年限", "", ""], "r": "D", "e": "投资回收期是指收回初始投资所需要的时间，是用累计净现金流量来衡量的，当累计净现金流量为零时，对应的年限就是包括建设期的投资回收期。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236667", "t": 1, "q": "预测生产设备需要量时，若生产任务不足，生产能力过剩，则设备负荷系数（　）", "a": ["不确定", "小于100%", "等于100%", "大于100%", "", ""], "r": "B", "e": "设备负荷系数=生产任务所需设备台时/设备全年有效台时。生产任务不足、生产能力过剩，意味着生产任务所需设备台时小于设备全年有效台时，所以设备负荷系数小于100%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236668", "t": 1, "q": "滚动预算按照滚动的时间单位不同可分为？", "a": ["逐月滚动和逐年滚动", "逐年滚动和逐季滚动", "逐月滚动和逐季滚动", "混合滚动和逐年滚动", "", ""], "r": "C", "e": "滚动预算按滚动时间单位不同分逐月、逐季和混合滚动，题中选项只有C符合常见分类组合。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236669", "t": 1, "q": "复利现值的计算公式为（　）", "a": ["「test/yiwen_img/importSubject/2034528549632872448.png」", "「test/yiwen_img/importSubject/2034528549691592704.png」", "「test/yiwen_img/importSubject/2034528549783867392.png」", "「test/yiwen_img/importSubject/2034528549855170560.png」", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236670", "t": 1, "q": "净现值法与现值指数法的主要区别在于？", "a": ["是否考虑货币时间价值", "是否考虑原始投资额", "是否能反映项目的实际收益率", "是否适用于独立方案决策", "", ""], "r": "B", "e": "净现值是绝对数，现值指数是相对数，现值指数考虑了原始投资额，净现值不直接体现原始投资额对评价的影响。二者都考虑货币时间价值，都不能反映实际收益率，对独立方案决策都适用。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236671", "t": 1, "q": "关于财务杠杆系数，下列说法错误的是（　）", "a": ["财务杠杆系数是普通股每股利润的变动率对于息税前利润的变动率的比率", "财务杠杆系数由企业资本结构决定", "财务杠杆系数越大，财务风险越小", "支付固定性资本成本的债券资本越多，财务杠杆系数越大", "", ""], "r": "C", "e": "财务杠杆系数越大，表明财务杠杆作用越大，财务风险也就越大，C选项说法错误。A是财务杠杆系数定义；资本结构影响固定性资本成本，进而影响财务杠杆系数，B正确；债券资本多，固定利息支出多，财务杠杆系数大，D正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236672", "t": 1, "q": "某企业的信用条件是\"3/10,1/20,n/30\"，某客户向该企业购买1500元商品，并在第17天付款，则该客户实际支付的货款为（　）", "a": ["1485元", "1455元", "1500元", "1400元", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236673", "t": 1, "q": "下列关于净现值（NPV）的说法，正确的是？", "a": ["净现值的计算不需要考虑资金时间价值", "净现值越大，说明项目的盈利能力越强", "净现值是投资项目未来现金流入量与流出量折现后的差额", "净现值小于零，说明该投资方案可行", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528554519236674", "t": 1, "q": "某公司净利润200万元，优先股股息100万元，普通股股数10万，每股收益为（　）", "a": ["30元", "20元", "10元", "40元", "", ""], "r": "C", "e": "每股收益=（净利润 - 优先股股息）÷普通股股数，即（200 - 100）÷10 = 10元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929728", "t": 2, "q": "关于某零部件功能成本比值系数，说法正确的有（　）", "a": ["比值系数大于1，表明该零部件的成本支出偏高", "比值系数小于1，表明该零部件的功能比较重要，而成本支出偏低", "比值系数小于1，表明该零部件的成本支出偏高", "比值系数等于1，说明该零部件的成本水平与其功能大体相当", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929729", "t": 2, "q": "下列各项中，能够同时影响保本点、保利点及保净利点的因素为（　）", "a": ["目标利润", "所得税率", "固定成本总额", "贡献边际率", "", ""], "r": "CD", "e": "保本点、保利点、保净利点公式中，固定成本总额和贡献边际率都会影响这三个指标。目标利润只影响保利点和保净利点；所得税率只影响保净利点。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929730", "t": 2, "q": "属于趋势外推分析法的是（　）。", "a": ["调查分析法", "移动平均法", "平滑指数法", "回归分析法", "", ""], "r": "BC", "e": "趋势外推分析法是根据时间序列所反映的发展过程、方向和趋势，进行类推或延伸来预测下一期或以后若干期可能达到的水平。移动平均法、平滑指数法都属于趋势外推分析法。调查分析法主要是通过调查获取信息；回归分析法是研究变量之间相关关系的一种统计方法。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929731", "t": 2, "q": "下列关于流动资金占用形态的说法正确的有（　）", "a": ["分析占用形态可以从实质上说明流动资金的内容", "分析占用形态有助于考察流动资金的周转情况", "占用形态表明流动资金原始用途与支出方向", "占用形态表明流动资金具体存在的形态", "", ""], "r": "BD", "e": "流动资金占用形态表明其具体存在的形态，分析占用形态能考察其周转情况。A选项，分析占用形态不能从实质说明流动资金内容；C选项，表明原始用途与支出方向的是流动资金的构成要素，不是占用形态。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929732", "t": 2, "q": "成本中心可以是（　）。", "a": ["车间", "个人", "工段", "班组", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929733", "t": 2, "q": "内部控制制度中的信息与沟通要素包括？", "a": ["实施信息系统控制", "建立反舞弊机制", "建立信息传递渠道", "明确信息收集范围", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929734", "t": 2, "q": "关于预算与成本控制的关系，以下说法正确的有？", "a": ["通过预算分析可发现成本控制中的问题", "预算为成本控制提供目标和标准", "预算调整应考虑对成本控制的影响", "成本控制是实现预算目标的重要手段", "", ""], "r": "ABCD", "e": "预算是成本控制的依据，能提供目标和标准，通过对预算分析能找出成本控制问题，调整预算要考虑对成本控制的影响，而成本控制有助于达成预算目标。ABCD四个选项均正确反映了预算与成本控制的关系。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929735", "t": 2, "q": "论证是对发起设立企业进行可行性的研究，其可行性分析从以下哪几个方面入手？", "a": ["市场需求预测", "对企业的公益和技术进行可行性分析", "财务分析", "效益评价", "", ""], "r": "ACD", "e": "论证企业设立可行性需综合多方面考量，市场需求预测关乎企业产品或服务有无市场，财务分析能了解资金情况，效益评价可判断企业盈利等效益状况，而对企业公益和技术可行性分析说法不准确，一般是技术可行性分析，不涉及公益可行性。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929736", "t": 2, "q": "建立责任会计应遵循的基本原则有（　）。", "a": ["反馈原则", "激励原则", "责权利相结合原则", "统一性原则", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929737", "t": 2, "q": "零基预算的适用范围包括？", "a": ["业务招待费用预算", "人员工资预算", "广告宣传费用预算", "研发费用预算", "", ""], "r": "ACD", "e": "零基预算适用于不经常发生的或者预算编制基础变化较大的预算项目。业务招待费、广告宣传费、研发费用这类支出没有固定规律，受多种因素影响，适合用零基预算。而人员工资通常有相对固定的标准和模式，一般采用传统预算方法。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929738", "t": 2, "q": "通过账龄分析表，财务人员可掌握的信息有（　）", "a": ["有多少用户在信用期后付款", "有多少应收账款已成为坏账、呆账", "有多少用户立即付款", "有多少用户在信用期内付款", "", ""], "r": "ABD", "e": "账龄分析表能反映应收账款在不同账龄区间的分布情况。可据此知道在信用期内付款、信用期后付款的用户数量，也能看出已成为坏账、呆账的应收账款情况。而立即付款信息无法通过账龄分析表获取。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929739", "t": 2, "q": "零基预算的优点包括？", "a": ["编制工作量小", "有助于企业未来发展", "能够调动各部门降低费用的积极性", "不受现有费用项目限制", "", ""], "r": "BCD", "e": "零基预算是不考虑以往情况，一切以零为出发点编制预算。它不受现有费用项目限制，能调动各部门降低费用积极性，还利于企业未来发展，但编制工作量大。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929740", "t": 2, "q": "在我国,下列成本项目中属于固定成本的是（　）。", "a": ["保险费", "按平均年限法计提的折旧费", "材料费", "生产工人工资", "", ""], "r": "AB", "e": "固定成本是不随业务量变动而变动的成本。保险费和按平均年限法计提的折旧费不随业务量变化而改变，属于固定成本；材料费通常随产量变动，生产工人工资多与产量或工作时间相关，属于变动成本。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929741", "t": 2, "q": "（　）一般属于无关成本的范围。", "a": ["联合成本", "历史成本", "沉没成本", "机会成本", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929742", "t": 2, "q": "如果其他因素不变，下列会使看涨期权价值上升的有（　）。", "a": ["股价波动率增加", "股票价格上升", "预期红利下降", "执行价格降低", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929743", "t": 2, "q": "影响债券资本成本的因素有？", "a": ["债券面值", "债券筹资费用", "企业所得税税率", "债券票面利率", "", ""], "r": "BCD", "e": "债券资本成本受筹资费用、所得税税率、票面利率等影响。筹资费用影响实际筹资额，所得税影响税后成本，票面利率影响利息支付进而影响成本；债券面值只是确定利息等的一个基础，不直接影响资本成本计算。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528556217929744", "t": 2, "q": "按照定期预算方法编制的预算的缺点是（　）。", "a": ["灵活性", "滞后性", "间断性", "预见性", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false
