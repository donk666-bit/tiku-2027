资项目风险的指标是？", "a": ["内部收益率", "净现值", "标准差", "资本成本", "", ""], "r": "C", "e": "标准差可衡量数据的离散程度，在投融资里能反映投资项目收益的波动，进而衡量风险。内部收益率是使净现值为 0 的折现率，体现项目实际收益率；净现值是项目未来现金净流量现值与原始投资额现值的差额，衡量项目盈利；资本成本是企业筹集和使用资金的成本。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644914", "t": 1, "q": "下列关于成本费用预算编制方法的表述，正确的是？", "a": ["滚动预算在编制成本费用预算时，预算期保持固定长度", "零基预算不适用于成本费用预算编制", "固定预算编制成本费用预算时，能准确反映业务量变化对成本的影响", "增量预算以基期成本费用水平为基础，不考虑预算期业务量变化", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644915", "t": 1, "q": "下列最能体现企业经营成果的盈利能力指标是？", "a": ["权益乘数", "销售净利率", "总资产收益率", "销售毛利率", "", ""], "r": "B", "e": "盈利能力指标衡量企业赚取利润的能力。销售净利率反映每一元销售收入带来的净利润，直接体现企业经营最终盈利成果。权益乘数反映企业负债程度；总资产收益率考量资产综合利用效率；销售毛利率未考虑期间费用等，不能完全体现最终经营成果。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644916", "t": 1, "q": "某企业每月货币资金需用量为50万元，每天货币资金的支出量基本稳定，每次转换成本50元，有价证券月利率0.5%，该企业货币价值最佳持有量为（　）", "a": ["100000元", "129540元", "200000元", "109545元", "", ""], "r": "A", "e": "本题可根据存货模型下的最佳现金持有量公式来计算。存货模型下最佳现金持有量「test/yiwen_img/importSubject/2034528574832250880.png」，其中T为一定时期内的现金需求量，F为每次转换有价证券的固定成本，K为有价证券利息率。已知每月货币资金需用量T = 500000元，每次转换成本F = 50元，有价证券月利率「test/yiwen_img/importSubject/2034528574987440128.png」。将数据代入公式可得：「test/yiwen_img/importSubject/2034528575083909120.png」（元）所以该企业货币价值最佳持有量为100000元，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644917", "t": 1, "q": "某公司拟发行面值为1000元，票面利率为8%，期限为5年的债券，每年付息一次。若市场利率为10%，则该债券的发行价格为？（已知（P/F，10%，5）=0.6209，（P/A，10%，5）=3.7908）", "a": ["1100元", "924.16元", "1000元", "1079.87元", "", ""], "r": "B", "e": "债券发行价格=每年利息×年金现值系数 + 面值×复利现值系数，每年利息 = 1000×8% = 80 元，代入数据可得 80×(P/A，10%，5)+1000×(P/F，10%，5)=80×3.7908 + 1000×0.6209 = 924.16 元。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644918", "t": 1, "q": "若某投资项目的内部收益率（IRR）小于企业要求的最低投资报酬率，该项目的净现值（NPV）一定？", "a": ["小于0", "大于0", "无法确定", "等于0", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644919", "t": 1, "q": "下列属于内部控制要素中风险评估内容的是？", "a": ["控制活动", "信息与沟通", "风险应对", "内部审计", "", ""], "r": "C", "e": "风险评估包括风险识别、风险分析和风险应对等。A选项控制活动是内部控制五要素之一，与风险评估并列；B选项信息与沟通也是独立要素；D选项内部审计是监督内部控制的一种方式。而C选项风险应对属于风险评估内容。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644920", "t": 1, "q": "能使投资方案的净现值等于零的折现率叫（　）。", "a": ["资金成本率", "内部收益率", "投资利润率", "净现值率", "", ""], "r": "B", "e": "内部收益率就是使投资方案净现值等于零的折现率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644921", "t": 1, "q": "计算优先股资本成本时，不需要考虑的因素是？", "a": ["筹资费用率", "所得税税率", "优先股发行价格", "优先股股息率", "", ""], "r": "B", "e": "优先股股息是税后支付，不涉及所得税抵税，所以计算其资本成本不用考虑所得税税率。而筹资费用率、发行价格、股息率都会影响优先股资本成本计算。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644922", "t": 1, "q": "下列关于加权平均资本成本的说法，错误的是？", "a": ["加权平均资本成本是企业进行投融资决策的重要依据", "加权平均资本成本是企业全部长期资本的平均成本", "权重的确定只能采用账面价值权数", "计算时需考虑个别资本占全部资本的比重", "", ""], "r": "C", "e": "权重确定有账面价值权数、市场价值权数和目标价值权数等多种方法，并非只能用账面价值权数，C说法错误。A选项，加权平均资本成本对投融资决策很关键；B选项，它是全部长期资本平均成本；D选项，计算时确实要考虑个别资本占比。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644923", "t": 1, "q": "某公司全年需甲材料50000千克，每次订货的变动性订货成本为25元，单位材料年均变动性储存成本10元，则经济批量为（　）。", "a": ["500千克", "700千克", "400千克", "600千克", "", ""], "r": "A", "e": "根据经济订货量基本模型公式「test/yiwen_img/importSubject/2034528575218126848.png」，其中K是每次订货的变动成本（25元），D是全年需求量（50000千克），Kc是单位变动储存成本（10元），代入可得「test/yiwen_img/importSubject/2034528575427842048.png」千克。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644924", "t": 1, "q": "零基预算特别适用于？", "a": ["水电费预算", "人员工资预算", "固定资产折旧费预算", "新产品研发费用预算", "", ""], "r": "D", "e": "零基预算不受以往预算安排情况的影响，一切从实际需要出发。新产品研发费用预算没有历史数据为基础，需重新评估需求和成本，适合用零基预算。而水电费、人员工资、固定资产折旧费通常有一定规律和历史数据可参考。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644925", "t": 1, "q": "某企业欲长期控股某公司，现已该公司去年普通股股利为4元，该企业预计该公司的普通股股利将持续地增长下去，估计年股利增长率为3%，而企业的投资收益率也长期保持在12%，那么该企业能够接受该公司的股票价格为（　）", "a": ["183元", "137元", "91元", "46元", "", ""], "r": "D", "e": "本题可根据股票估价模型来计算该企业能够接受的股票价格。### 步骤一：明确股票估价模型公式对于股利固定增长的股票，其估价模型公式为「test/yiwen_img/importSubject/2034528575515922432.png」，其中P为股票价格，「test/yiwen_img/importSubject/2034528575604002816.png」为上一期支付的股利，g为股利增长率，k为投资收益率。### 步骤二：分析题目所给条件已知「test/yiwen_img/importSubject/2034528575683694592.png」元（去年普通股股利），「test/yiwen_img/importSubject/2034528575754997760.png」（年股利增长率），「test/yiwen_img/importSubject/2034528575851466752.png」（投资收益率）。### 步骤三：代入数据计算股票价格将上述数据代入公式「test/yiwen_img/importSubject/2034528575515922432.png」可得：「test/yiwen_img/importSubject/2034528575939547136.png」（元）所以该企业能够接受该公司的股票价格为46元，答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644926", "t": 1, "q": "在计算普通股资本成本的股利增长模型法中，不需要的参数是？", "a": ["企业所得税税率", "普通股当前市价", "普通股筹资费用率", "预计下一期每股股利", "", ""], "r": "A", "e": "股利增长模型法计算普通股资本成本公式不涉及企业所得税税率。答案：A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644927", "t": 1, "q": "在下列预算编制方法中，以基期成本费用水平为基础，结合预算期业务量水平及有关降低成本的措施，通过调整有关费用项目而编制预算的方法是？", "a": ["固定预算法", "弹性预算法", "增量预算法", "零基预算法", "", ""], "r": "C", "e": "增量预算法是指以基期成本费用水平为基础，结合预算期业务量水平及有关降低成本的措施，通过调整有关费用项目来编制预算。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644928", "t": 1, "q": "如果某企业连续三年按变动成本法计算的营业利润分别为10,000元、12,000元和11,000元。则下列表述中唯一正确的是（　）。", "a": ["第三年的销量最小", "第二年的产量比第三年多", "第一年的产量比第二年少", "第二年的销量最大", "", ""], "r": "D", "e": "变动成本法下营业利润与销量直接相关，营业利润越高，销量越大。第二年营业利润12,000元最高，所以第二年销量最大。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644929", "t": 1, "q": "下列属于内部控制活动中运营分析控制的是？", "a": ["实行岗位分离和职责分工", "明确会计凭证填制要求", "建立运营情况分析制度", "限制未经授权人员接触财产", "", ""], "r": "C", "e": "运营分析控制要求企业建立运营情况分析制度，C选项符合。A是职责分工控制；B是会计系统控制；D是财产保护控制。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644930", "t": 1, "q": "某企业计划投资一个项目，原始投资额为120万元，预计每年现金净流量为30万元，若该项目的内部收益率为12%，则项目的寿命期为？（已知（P/A，12%，5）=3.6048，（P/A，12%，6）=4.1114）", "a": ["5年", "7年", "4年", "6年", "", ""], "r": "D", "e": "根据年金现值公式，原始投资额 = 每年现金净流量×年金现值系数，即「test/yiwen_img/importSubject/2034528576086347776.png」，可得「test/yiwen_img/importSubject/2034528576191205376.png」。已知（P/A，12%，5）=3.6048，（P/A，12%，6）=4.1114，4介于3.6048和4.1114之间，所以项目寿命期n在5和6之间，更接近6年。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644931", "t": 1, "q": "在管理会计的定价决策中，利润无差别点法属于（　）", "a": ["以需求为导向的定价方法", "定价策略", "以成本为导向的定价方法", "以特殊要求为导向的定价方法", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644932", "t": 1, "q": "关于审计监督在风险控制中的作用，错误的是？", "a": ["有助于发现财务舞弊行为", "促进企业合规经营", "可评价内部控制的有效性", "能替代内部控制制度", "", ""], "r": "D", "e": "审计监督可发现舞弊、促进合规、评价内控有效性，但不能替代内部控制制度，内控制度是企业自身建立的管理机制，审计监督是外部或内部的监督手段。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644933", "t": 1, "q": "某投资方案的年营业收入为100万元，年营业支出为60万元，其中折旧为10万元，所得税率为40%，则该方案每年的营业现金流量为（　）万元。", "a": ["50", "34", "26", "40", "", ""], "r": "B", "e": "营业现金流量=税后净利润+折旧。先算税前利润为100 - 60 = 40万元，税后净利润=40×(1 - 40%) = 24万元，再加上折旧10万元，营业现金流量为24 + 10 = 34万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644934", "t": 1, "q": "下列项目中，不属于管理会计系统能够提供的信息是（　）。", "a": ["非价值量信息", "定性信息", "全面精确的信息", "不发生法律效用的信息", "", ""], "r": "C", "e": "管理会计面向未来，具有不确定性，很难提供全面精确信息。而非价值量、定性信息以及不具法律效用信息都是管理会计可提供的。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644935", "t": 1, "q": "若某投资项目各年现金净流量不相等，采用内插法计算内部收益率（IRR）时，需要已知？", "a": ["项目的会计收益率和必要收益率", "项目初始投资额和投资回收期", "项目的净现值和现值指数", "两个不同折现率对应的净现值", "", ""], "r": "D", "e": "内插法计算内部收益率，是利用两个不同折现率对应的净现值，通过线性插值来估算IRR。其他选项与内插法计算IRR并无直接关联。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644936", "t": 1, "q": "预测方法分为两大类，是指定量分析法和（　）。", "a": ["指数平滑法", "定性分析法", "平均法", "回归分析法", "", ""], "r": "B", "e": "预测方法分为定量和定性两大类。A、C、D都属于定量分析方法，B是另一大类。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644937", "t": 1, "q": "下列项目中，能够克服定期预算缺点的是（　）。", "a": ["弹性预算", "零基预算", "固定预算", "滚动预算", "", ""], "r": "D", "e": "定期预算以固定会计期间为预算期，有滞后性和间断性等缺点。滚动预算能连续不断地规划未来业务活动，克服了定期预算在时间上的间断，可保持预算的连续性和完整性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644938", "t": 1, "q": "下列关于企业盈利能力分析的表述，正确的是？", "a": ["净资产收益率反映企业全部资产的获利能力", "毛利率高的企业，净利率一定高", "成本费用利润率越高，表明企业盈利能力越强", "总资产收益率与销售净利率无关", "", ""], "r": "C", "e": "净资产收益率反映股东权益收益水平，A错误；毛利率高但期间费用等若高，净利率不一定高，B错误；总资产收益率=销售净利率×总资产周转率，二者相关，D错误；成本费用利润率越高，说明同样成本费用下利润越高，盈利能力越强。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644939", "t": 1, "q": " 下列不属于企业盈利能力指标的是？", "a": ["市盈率", "成本费用利润率", "营业毛利率", "净资产收益率", "", ""], "r": "A", "e": "成本费用利润率、营业毛利率、净资产收益率都直接体现企业盈利水平。而市盈率是衡量股票投资价值的指标，反映股价与盈利的关系，并非企业盈利能力指标。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528581316644940", "t": 1, "q": "下列指标中，可用于衡量企业发展能力的是？", "a": ["资产负债率", "资本保值增值率", "存货周转率", "成本费用利润率", "", ""], "r": "B", "e": "资本保值增值率反映企业资本在经营过程中的保全和增值情况，体现企业发展能力。资产负债率衡量偿债能力；存货周转率衡量营运能力；成本费用利润率衡量盈利能力。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528582944034816", "t": 2, "q": "固定成本具有的特征是（　）。", "a": ["单位固定成本的反比例变动性", "固定成本总额的不变性", "固定成本总额的正比例变动性", "单位固定成本的不变性", "", ""], "r": "AB", "e": "固定成本是指在一定时期和一定业务量范围内，总额不受业务量变动影响保持不变。而单位固定成本会随业务量增加而反比例变动。所以答案选AB。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2034528582944034817", "t": 2, "q": "企业编制零基预算时，对于可避免费用项目的处理方式有？", "a": ["结合企业实际情况进行取舍", "根据成本-效益分析决定是否支出", "全部不予支出", "优先安排资金", "", ""], "r": "AB", "e": "零基预算对于可避免费用项目，需结合企业实际情况考量，运用成本 - 效益分析判断是否支出，而非全部不支出或优先安排资金。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582944034818", "t": 2, "q": "下列关于企业偿债能力分析指标的说法，正确的有？", "a": ["速动比率比流动比率更能准确反映短期偿债能力", "流动比率过高可能意味着企业资金闲置", "现金比率越高，企业短期偿债能力越强", "资产负债率反映企业长期偿债能力", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582944034819", "t": 2, "q": "当预测销售量较为平稳的产品销量时，较好的预测方法为（　）。", "a": ["移动平均法", "判断分析法", "因果预测分析法", "算术平均法", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582944034820", "t": 2, "q": "影响企业速动比率的因素有？", "a": ["存货", "货币资金", "交易性金融资产", "应收账款", "", ""], "r": "BCD", "e": "速动比率=速动资产/流动负债，速动资产是流动资产扣除存货等变现能力较差资产后的部分。货币资金、交易性金融资产、应收账款都属于速动资产，会影响速动比率；存货不属于速动资产，不影响速动比率。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582944034821", "t": 2, "q": "企业筹集资金的原则包括（　）", "a": ["合法性", "及时性", "效益性", "节约性", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582944034822", "t": 2, "q": "关于零基预算编制步骤，以下说法正确的有？", "a": ["对各项费用进行成本-效益分析是关键步骤", "最终根据分析结果分配资金编制预算草案", "需划分不可避免费用项目和可避免费用项目", "先由各部门提出预算期内各种费用的预算方案", "", ""], "r": "ABCD", "e": "零基预算编制时，先由各部门提预算方案，接着划分不可避免和可避免费用项目，再对各项费用成本 - 效益分析，最后按分析结果分配资金编预算草案。ABCD四个选项说法均正确。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229120", "t": 2, "q": "下列各项中，能正确表述订货变动成本特征的有（　）。", "a": ["它与每次订货数量无关", "它与订货次数多少有关", "随订货次数成正比例变动", "它与订货次数多少无关", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229121", "t": 2, "q": "年金是指一定期间内每期相等金额的收付款项，通常采取年金的形式有（　）", "a": ["保险金", "租金", "普通股股利", "利润", "", ""], "r": "AB", "e": "年金特点是一定期间内每期相等金额收付款项。保险金和租金通常按固定周期、固定金额支付，符合年金特征。普通股股利和利润受企业经营等因素影响，金额不固定，不属于年金。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229122", "t": 2, "q": "在下列各种情况下，属于企业商品销售收入确认条件的有（　）", "a": ["企业已将商品所有权上的主要风险和报酬转移给购货方", "企业产品的售价发生变动，新的售价尚未确定", "企业对售出商品仍然保留回购的权利", "企业销售商品的价款有很大可能性回收", "", ""], "r": "AD", "e": "商品销售收入确认需满足企业已将商品所有权上主要风险和报酬转移给购货方、收入金额能可靠计量、相关经济利益很可能流入企业等条件。A符合主要风险报酬转移；B售价未确定不满足收入金额能可靠计量；C保留回购权利说明主要风险报酬未完全转移；D价款有很大可能性回收符合经济利益很可能流入。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229123", "t": 2, "q": "企业进行预算编制前的准备工作包括？", "a": ["明确企业战略目标和经营计划", "确定预算编制的组织架构和职责分工", "分析企业内外部环境变化趋势", "收集和整理相关历史数据与资料", "", ""], "r": "ABCD", "e": "预算编制前需依据战略目标和经营计划来制定预算，明确组织架构和职责分工能保障编制工作有序开展，分析内外部环境变化趋势可使预算更贴合实际，收集整理历史数据资料能为预算编制提供参考依据。ABCD 选项均是预算编制前必要的准备工作。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229124", "t": 2, "q": "下列关于企业盈利能力指标的表述，正确的有？", "a": ["成本费用利润率越高，表明企业盈利能力越强", "净资产收益率综合反映自有资金的获利能力", "总资产净利率体现全部资产获取利润的能力", "销售毛利率反映产品初始盈利空间", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229125", "t": 2, "q": "企业在计算资本成本时，以下关于债务资本成本的说法正确的有？", "a": ["长期借款资本成本计算需考虑所得税抵减效应", "计算时无需考虑筹资费用", "债券资本成本受债券发行价格影响", "债务资本成本通常低于股权资本成本", "", ""], "r": "ACD", "e": "债务利息可抵税，长期借款资本成本计算要考虑所得税抵减效应；筹资费用是计算资本成本要考虑的因素；债券发行价格影响实际筹资额，进而影响债券资本成本；债务有固定偿还要求且风险相对股权低，所以债务资本成本通常低于股权资本成本。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229126", "t": 2, "q": "在分析企业偿债能力时，需要综合考虑的因素有哪些？", "a": ["企业的盈利能力", "企业的经营现金流量状况", "企业的资产结构和负债结构", "行业平均水平和经济环境", "", ""], "r": "ABCD", "e": "偿债能力受多方面因素影响，盈利能力强利于偿债；经营现金流量好可保障偿债资金；资产与负债结构合理能降低偿债风险；参考行业平均和经济环境可对比评估偿债能力。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229127", "t": 2, "q": "下列属于应收账款信用政策的内容有（　）", "a": ["信用标准", "销售折让", "信用期限", "收账政策", "", ""], "r": "ACD", "e": "应收账款信用政策包括信用标准、信用条件（含信用期限等）和收账政策。销售折让是销售业务中给予的价格减让，不属于信用政策内容。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229128", "t": 2, "q": "下列关于企业偿债能力分析的表述，正确的有？", "a": ["产权比率与资产负债率对企业偿债能力的反映角度不同", "利息保障倍数反映企业长期偿债能力中支付利息的能力", "流动比率和速动比率越高，企业短期偿债能力一定越强", "现金比率能直接反映企业的即时偿债能力", "", ""], "r": "ABD", "e": "A选项，产权比率侧重股东权益对偿债的保障，资产负债率侧重负债占资产比重，反映角度不同；B选项，利息保障倍数衡量企业支付利息能力，体现长期偿债能力；C选项，流动和速动比率过高可能存在资金闲置等问题，不一定短期偿债能力就强；D选项，现金比率用现金类资产衡量，可直接反映即时偿债能力。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229129", "t": 2, "q": "在投融资决策中，净现值（NPV）法的特点包括？", "a": ["可用于互斥方案的决策", "计算过程中需要确定折现率", "能直接反映项目的实际收益率", "考虑了货币时间价值", "", ""], "r": "ABD", "e": "净现值法需确定折现率且考虑货币时间价值，可用于互斥方案决策，但不能直接反映项目实际收益率。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229130", "t": 2, "q": "关于概率分布，下列选项中说法正确的有（　）", "a": ["非连续式概率分布和连续式概率分布是概率分布的两种类型", "概率分布越集中，实际可能的结果就越会接近预期收益", "概率分布越集中，则概率分布中的峰度越高", "概率分布越分散，投资风险程度越大", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229131", "t": 2, "q": "采购经济批量控制必须考虑的相关成本有（　）。", "a": ["变动性储存成本", "订货成本", "变动性订货成本", "储存成本", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229132", "t": 2, "q": "审计监督在企业风险控制中的作用包括？", "a": ["发现企业经营活动中的舞弊行为", "促进企业遵守相关法律法规和规章制度", "评价企业内部控制制度的有效性", "替代企业的内部控制制度", "", ""], "r": "ABC", "e": "审计监督可发现舞弊、促使企业守法、评价内控有效性，但不能替代内控制度。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229133", "t": 2, "q": " 下列属于企业短期偿债能力分析指标的有？", "a": ["速动比率", "资产负债率", "现金比率", "流动比率", "", ""], "r": "ACD", "e": "短期偿债能力分析指标衡量企业短期内偿还债务的能力。速动比率、现金比率、流动比率都和企业短期资产与短期负债相关，能反映短期偿债能力。资产负债率反映长期偿债能力。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229134", "t": 2, "q": "企业留用利润要建立的基金有（　）", "a": ["职工奖励基金", "后备基金", "职工福利基金", "新产品试制基金", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229135", "t": 2, "q": "进行财务分析的一般程序为（　）", "a": ["取得计划指标", "因素分析，明确责任", "搜集资料，掌握情况", "提出措施，改进工作", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229136", "t": 2, "q": "企业编制财务预算时，涉及的主要预算类型有？", "a": ["资本预算", "专门决策预算", "财务预算", "经营预算", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229137", "t": 2, "q": "成本按其核算的目标分类为（　）。", "a": ["责任成本", "业务成本", "未来成本", "质量成本", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229138", "t": 2, "q": "企业营运能力分析指标包括？", "a": ["存货周转率", "流动资产周转率", "应收账款周转率", "总资产周转率", "", ""], "r": "ABCD", "e": "营运能力是指企业运用各项资产以赚取利润的能力。存货、流动资产、应收账款、总资产的周转率都反映了企业相应资产的运营效率和管理水平，都属于营运能力分析指标。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229139", "t": 2, "q": "反映企业偿债能力的指标有（　）", "a": ["现金比率", "流动比率", "资产负债率", "产权比率", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229140", "t": 2, "q": "反映企业长期偿债能力的指标有？", "a": ["权益乘数", "利息保障倍数", "资产负债率", "速动比率", "", ""], "r": "ABC", "e": "速动比率反映短期偿债能力，而权益乘数、利息保障倍数、资产负债率用于衡量长期偿债能力。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229141", "t": 2, "q": "变动成本法与完全成本法的区别表现在（　）。", "a": ["损益确定程序不同", "计算出的营业利润可能不同", "编制的损益表格式不同", "存货成本水平不同", "", ""], "r": "ABCD", "e": "变动成本法和完全成本法在成本划分、存货成本计算等方面存在差异，这些差异导致了损益确定程序、损益表格式、存货成本水平不同，进而营业利润也可能不同。ABCD四个选项均体现了二者区别。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229142", "t": 2, "q": "内部收益率（IRR）法的优点有？", "a": ["计算简单易懂", "能反映项目实际可能达到的收益率", "考虑了货币时间价值", "便于独立方案的比较决策", "", ""], "r": "BCD", "e": "内部收益率考虑了货币时间价值，能反映项目实际可能达到的收益率，便于独立方案比较决策，但计算复杂。A选项计算简单易懂错误。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229143", "t": 2, "q": "下列属于企业内部控制活动的有？", "a": ["建立严格的授权审批制度", "不相容职务分离，如出纳与会计职责分离", "定期对企业资产进行盘点清查", "设置独立的内部审计部门", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528582948229144", "t": 2, "q": "在预算编制与控制中，涉及的风险控制措施有哪些？", "a": ["建立健全预算编制的内部控制制度", "对预算调整进行严格的审批管理", "加强预算执行过程的审计监督", "设置预算预警机制及时发现潜在风险", "", ""], "r": "ABCD", "e": "ABCD四个选项均是在预算编制与控制中有效的风险控制措施。A健全编制内控可规范流程防风险；B严格审批预算调整能避免随意变动；C审计监督保证执行合规；D预警机制可提前发现潜在问题。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528583313133568", "t": 3, "q": "甲公司的固定成本（包括利息费用）为600万元，资产总额为10000万元，资产负债率为50%，负债平均利息率为8%，净利润为800万元，该公司适用的所得税税率为20%，则税前经营利润对销量的敏感系数是1.14。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "本题可先根据已知条件求出息税前利润，再求出经营杠杆系数，而经营杠杆系数就是税前经营利润对销量的敏感系数，最后判断该系数是否为1.14。 步骤一：计算利息费用已知资产总额为10000万元，资产负债率为「test/yiwen_img/importSubject/2034528576279285760.png」，负债平均利息率为「test/yiwen_img/importSubject/2034528576358977536.png」，根据“负债总额=资产总额「test/yiwen_img/importSubject/2034528576430280704.png」资产负债率”，可得负债总额为：「test/yiwen_img/importSubject/2034528576526749696.png」（万元）再根据“利息费用=负债总额「test/yiwen_img/importSubject/2034528576430280704.png」负债平均利息率”，可得利息费用为：「test/yiwen_img/importSubject/2034528576619024384.png」（万元） 步骤二：计算税前利润已知净利润为800万元，所得税税率为「test/yiwen_img/importSubject/2034528574446374912.png」，根据“税前利润=净利润「test/yiwen_img/importSubject/2034528576719687680.png」所得税税率)”，可得税前利润为：「test/yiwen_img/importSubject/2034528576803573760.png」（万元） 步骤三：计算息税前利润（EBIT）息税前利润=税前利润+利息费用，将前面计算出的税前利润1000万元和利息费用400万元代入可得：EBIT = 1000 + 400 = 1400（万元） 步骤四：计算经营杠杆系数（DOL）经营杠杆系数=息税前利润变动率「test/yiwen_img/importSubject/2034528574219882496.png」销量变动率，也等于「test/yiwen_img/importSubject/2034528576891654144.png」（其中F为固定成本），已知固定成本为600万元，息税前利润为1400万元，代入可得：「test/yiwen_img/importSubject/2034528576983928832.png」由于经营杠杆系数就是税前经营利润对销量的敏感系数，而计算得出的敏感系数约为1.43，并非1.14，所以该说法错误。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 会计学（1）", "n": "基础练习题【含解析】 / 第2章 会计学（1）", "qs": [{"id": "2034528589218713600", "t": 1, "q": "针对\"资产=负债+所有权者权益+（收入-费用）\"这一等式，下列哪种说法是错误的（　）。", "a": ["揭示了资产负债表要素和利润表要素相互之间的联系和依存关系", "完整地反映了企业的资金运动过程", "揭示了收益质量的高低", "将会计六项要素有机结合起来", "", ""], "r": "C", "e": "“资产=负债+所有者权益+（收入 - 费用）”把会计要素联系，体现报表要素关系及资金运动，但未揭示收益质量高低。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713601", "t": 1, "q": "甲公司持有乙公司20％的股权，在2008年12月31日乙公司实现净利润的金额是200万元，在此之前，甲公司对乙公司的长期股权投资账面价值为0，备查账簿中登记的以前年度因该长期股权投资确认的损失为60万元，则2008年年底甲公司应该确认的投资收益金额是（　）万元。", "a": ["60", "40", "0", "-20", "", ""], "r": "C", "e": "先计算应享有的净利润份额为200×20% = 40万元，但之前备查簿有60万元损失，40万元不足以弥补，所以投资收益为0。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713602", "t": 1, "q": "现金和实物的清查都可采用的方法是（　）。", "a": ["实地盘点法", "技术推算法", "核对账目法", "发函询证法", "", ""], "r": "A", "e": "实地盘点法可用于现金的清点和实物数量清点。技术推算常用于大量成堆难以逐一清点的实物；核对账目用于银行存款等清查；发函询证用于往来款项清查。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713603", "t": 1, "q": " 下列关于分批法的表述，错误的是？", "a": ["成本计算对象是产品批别", "适用于大量大批单步骤生产企业", "一般不需要在完工产品和在产品之间分配费用", "成本计算期与产品生产周期一致", "", ""], "r": "B", "e": "分批法适用于单件、小批生产，而大量大批单步骤生产企业适用品种法。A选项成本计算对象确实是产品批别；C选项在分批法下，若产品完工才计算成本，一般不用在完工与在产品间分配费用；D选项成本计算期和产品生产周期一致。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713604", "t": 1, "q": "下列关于会计等式\"收入-费用=利润\"的说法，错误的是？", "a": ["表明企业的财务状况", "反映企业一定会计期间的经营成果", "是编制利润表的理论依据", "收入与费用的差额为利润", "", ""], "r": "A", "e": "“收入 - 费用 = 利润”反映经营成果而非财务状况，财务状况由“资产=负债+所有者权益”反映。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713605", "t": 1, "q": "关于贷款和应收款项，下列说法中正确的有（　）。", "a": ["贷款和应收款项在活跃市场中有报价", "贷款和应收款项应当以公允价值进行后续计量", "贷款和应收款项在活跃市场中没有报价", "贷款和应收款项仅限于金融企业发放的贷款和其他债权", "", ""], "r": "C", "e": "贷款和应收款项在活跃市场无报价，按摊余成本后续计量，且并非仅限于金融企业发放的贷款和其他债权。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713606", "t": 1, "q": "下列项目中，会产生暂时性差异的是（　）。", "a": ["企业对产品计提的产品质量保证费用", "因漏税受到税务部门处罚而支付的罚款", "取得国债利息收入", "非公益性捐赠支出", "", ""], "r": "A", "e": "产品质量保证费用会计上提前确认费用，税法实际发生时才允许扣除，会产生暂时性差异；罚款、非公益性捐赠支出税法都不允许扣除，国债利息收入免税，它们都不产生暂时性差异。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713607", "t": 1, "q": "下列投资性房地产初始计量的表述不正确的有（　）。", "a": ["自行建造投资性房地产的成本，由建造该项资产达到预定可使用状态前所发生的必要支出构成", "外购的投资性房地产按照购买价款、相关税费和可直接归属于该资产的其他支出确认成本", "非货币性资产交换取得的投资性房地产按照非货币性资产交换准则的规定处理", "债务重组取得的投资性房地产按照债务重组的相关规定处理", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713608", "t": 1, "q": "甲公司2008年1月10日向乙公司销售一批商品并确认收入，2008年2月20日，乙公司因产品质量原因将上述商品退货。甲公司2007年财务报告批准报出日为2008年4月30日。甲公司对此项退货业务正确的处理方法是（　）。", "a": ["作为资产负债表日后事项中的非调整事项处理", "冲减2008年1月份相关收入、成本和税金等相关项目", "作为资产负债表日后事项中的调整事项处理", "冲减2008年2月份相关收入、成本和税金等相关项目", "", ""], "r": "D", "e": "选项 A 非调整事项指资产负债表日后发生的情况，不影响资产负债表日存在状况。该退货业务发生于2008年2月20日，属于2008年正常经营事项，不属于资产负债表日后事项范畴，该项错误。<br />选项 B 该笔销售发生于2008年1月10日，退货也发生在2008年2月20日，均属于2008年度。根据收入准则，销售退回应直接冲减退回当期的收入、成本及税金，而非1月份，该项错误。<br />选项 C 调整事项需满足“存在于资产负债表日或以前”的条件。该销售业务发生于2008年，不属于2007年度资产负债表日后调整事项，该项错误。<br />选项 D 退货发生于2008年2月20日，按照企业会计准则，应作为2008年2月份的正常销售退回处理，直接冲减2月份相关收入、成本和税金等项目，该项正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713609", "t": 1, "q": "甲公司2008年11月10日销售一批商品给乙企业，取得收入100万元（不含税，增值税税率17％），甲公司于当日已确认收入，并结转成本80万元。由于产品质量问题，2009年2月15日本批货物被全部退回。公司2008年报表于2009年3月31日批准报出，所得税汇算清缴日为2月1日。则公司的下列处理，不正确的有（　）。", "a": ["调减报告年度的\"应交税费---应交所得税\"", "调减报表年度的\"应交税费---应交增值税（销项税额）\"", "调减报告年度财务报表的收入、成本", "调增报告年度的\"递延所得税资产\"", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713610", "t": 1, "q": "2006年2月财政部颁布的《企业会计准则-基本准则》中明确规定，企业应当采用的记账方法是（　）。", "a": ["单式记账法", "收付记账法", "借贷记账法", "增减记账法", "", ""], "r": "C", "e": "我国《企业会计准则 - 基本准则》规定企业应采用借贷记账法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713611", "t": 1, "q": "C企业因销售产品承诺提供3年的保修服务，2009年度利润表中确认了500万元的销售费用，同时确认为预计负债，期初\"预计负债---产品保修费用\"科目余额600万元，当年实际支出产品保修支出400万元。按照税法规定，与产品售后服务相关的费用在实际发生时允许税前扣除。不考虑其他因素，则2009年12月31日的可抵扣暂时性差异余额为（　）万元。", "a": ["500", "600", "700", "400", "", ""], "r": "C", "e": "预计负债期末余额=期初余额600 + 本期确认500 - 实际支出400 = 700万元，税法规定实际发生时扣除，所以账面价值700万元大于计税基础0，可抵扣暂时性差异余额就是700万元。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713612", "t": 1, "q": "未发生减值的持有至到期投资如为一次还本付息债券投资，应于资产负债表日按票面利率计算确定的利息，借记\"持有至到期投资——应计利息\"科目，按持有至到期投资期初摊余成本和实际利率计算确定的利息收入，贷记\"投资收益\"科目，按其差额，借记或贷记（　）科目。", "a": ["持有至到期投资——成本", "持有至到期投资——利息调整", "持有至到期投资——应计利息", "公允价值变动损益", "", ""], "r": "B", "e": "本题可根据持有至到期投资利息计算及账务处理的相关知识来确定答案。对于一次还本付息的持有至到期投资，资产负债表日按票面利率计算的利息计入“持有至到期投资——应计利息”，按期初摊余成本和实际利率计算的利息收入计入“投资收益”，两者的差额应计入“持有至到期投资——利息调整”科目。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713613", "t": 1, "q": "采用分批法核算产品成本时，对于同一批次跨月陆续完工的少量产品，可采用的成本计价方法是？", "a": ["按近期同类产品的实际单位成本计价", "定额比例法", "按计划成本计价", "约当产量比例法", "", ""], "r": "A", "e": "分批法下同一批次跨月陆续完工少量产品，可按近期同类产品实际单位成本计价。定额比例法、约当产量比例法一般用于分配完工产品和在产品成本；计划成本计价不符合实际成本核算要求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713614", "t": 1, "q": "采用分批法计算产品成本时，成本计算单的设置依据是？", "a": ["产品批别", "产品品种", "产品类别", "产品生产步骤", "", ""], "r": "A", "e": "分批法是按照产品批别归集生产费用、计算产品成本，所以成本计算单按产品批别设置。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713615", "t": 1, "q": "下列不属于错账的更正方法的是（　）。", "a": ["顺查法", "红字更正法", "划线更正法", "补充更正法", "", ""], "r": "A", "e": "错账更正方法有红字更正法、划线更正法、补充登记法（补充更正法），顺查法是查账方法，不是错账更正方法。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713616", "t": 1, "q": "A公司拥有B公司60％的股份，A公司拥有C公司30％的股份，B公司拥有C公司25％的股份，则A公司直接和间接拥有C公司的股份为（　）。", "a": ["55%", "60%", "43%", "30%", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713617", "t": 1, "q": "会计人员在审核原始凭证时发现有一张外来原始凭证金额出现错误，其正确的更正方法是（　）。", "a": ["由出具单位重新开具", "由经办人员更正、并报单位负责人批准", "由审核人员更正、并报会计机构负责人审批", "由出具单位更正、并在更正处加盖公章", "", ""], "r": "A", "e": "原始凭证金额错误必须由出具单位重新开具，不能更正。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713618", "t": 1, "q": "某企业于2008年1月1日，购进当日发行的面值为1200万元的公司债券。债券的买价为1350万元，相关税费为10万元。该公司债券票面年利率为8％，期限为5年，一次还本付息。企业将其划分为持有至到期投资，则该企业计入\"持有至到期投资\"科目的金额为（　）万元。", "a": ["1360", "1350", "1340", "1200", "", ""], "r": "A", "e": "持有至到期投资的入账金额为买价与相关税费之和。本题中买价1350万元，税费10万元，所以入账金额为1350 + 10 = 1360万元。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713619", "t": 1, "q": "甲公司于2009年初以135万元取得一项交易性金融资产，2009年末该项交易性金融资产的公允价值为150万元。假定税法规定对于交易性金融资产，持有期间公允价值的变动不计入应纳税所得额。出售时，一并计算应计入应纳税所得额的金额。则该项交易性金融资产在2009年末的计税基础为（　）万元。", "a": ["285", "15", "135", "150", "", ""], "r": "C", "e": "税法规定交易性金融资产持有期间公允价值变动不计入应纳税所得额，计税基础按初始成本确定。本题初始成本135万元，所以2009年末计税基础是135万元。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713620", "t": 1, "q": "下列哪项不是总分类账户与明细分类账户的平行登记要点（　）。", "a": ["账簿一致", "金额相等", "方向相同", "依据不同", "", ""], "r": "D", "e": "总分类账户与明细分类账户平行登记要点是依据相同、方向相同、期间相同、金额相等。选项D说依据不同错误，选项A账簿一致是合理的登记要求。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713621", "t": 1, "q": "分批法的主要特点是？", "a": ["按月计算产品成本", "一般不需要在完工产品和在产品之间分配费用", "成本计算对象是产品品种", "成本计算期与产品生产周期不一致", "", ""], "r": "B", "e": "分批法按批别计算成本，成本计算期与产品生产周期一致，一般是产品完工时才计算成本，所以通常不存在完工产品和在产品间分配费用的问题。A选项按月计算成本是分步法特点；C选项成本计算对象是产品品种是品种法特点；D选项成本计算期与产品生产周期应一致。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713622", "t": 1, "q": "在资产负债表日至财务报告批准报出日之间发生的下列事项中，属于资产负债表日后调整事项的是（　）。", "a": ["交易性金融资产公允价值发生较大变动", "外汇汇率发生较大的变动", "企业发现报告年度一项应收账款的坏账损失率估计错误，导致少计提200万元的坏账准备", "自然灾害导致的资产重大损失", "", ""], "r": "C", "e": "资产负债表日后调整事项是指对资产负债表日已经存在的情况提供了新的或进一步证据的事项。选项 C 企业发现报告年度应收账款坏账损失率估计错误少计提坏账准备，这是资产负债表日已存在的情况，现在有了进一步证据进行调整，属于调整事项。而选项 A、B、D 都是资产负债表日后新发生的事项，属于非调整事项。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713623", "t": 1, "q": "2008年12月31日，甲公司应支付其销售部职工工资200 000元，社会保险40 000元，下列会计分录正确的是（　）。", "a": ["借:销售费用240 000<br />贷:应付职工薪酬——工资200 000<br />——职工福利40 000", "借:销售费用240 000<br />贷:应付职工薪酬——工资200 000<br />——社会保险费40 000", "借:管理费用240 000<br />贷:应付职工薪酬——工资200 000<br />——社会保险费40 000", "借:制造费用240 000<br />贷:应付职工薪酬——工资200 000<br />——职工福利40 000", "", ""], "r": "B", "e": "本题是关于工资及社保费用会计分录的问题。销售部职工的工资和社保费用应计入销售费用，且社保费用应明确为“社会保险费”。选项A中“职工福利”表述错误；选项C，该费用是销售部的，应计入销售费用而非管理费用；选项D，销售部费用与制造费用无关。所以正确答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713624", "t": 1, "q": "下列关于售后租回业务中，说法不正确的是（　）。", "a": ["售后租回是指销售商品的同时，销售方同意在日后再将同样的商品租回的销售方式", "如果售后租回交易认定为经营租赁的，售价和账面价值之间的差额应当予以递延，并在租赁期内按照与确认租金费用一致的方法进行分摊，作为租金费用的调整", "如果售后租回交易认定为融资租赁的，售价和账面价值之间的差额应当予以递延，并按照该项租赁资产的折旧进度进行分摊，作为折旧费用的调整", "如果有确凿证据表明认定为融资租赁的售后租回交易是按照公允价值达成的，售价与资产账面价值的差额应当计入当期损益", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713625", "t": 1, "q": "A公司和B公司均为增值税一般纳税人。适用的增值税税率均为17％。2008年4月6日，A公司以一批库存商品和固定资产与B公司持有的长期股权投资进行交换，A公司该批库存商品的账面价值为80万元，不含增值税的公允价值为100万元;固定资产原价为300万元，已计提折旧190万元，未计提减值准备，该项固定资产的公允价值为160万元，交换中发生固定资产清理费用10万元。B公司持有的长期股权投资的账面价值为260万元，公允价值为277万元，假设该项非货币性资产交换具有商业实质。则A公司该项交易计入损益的金额为（　）万元。", "a": ["60", "40", "100", "20", "", ""], "r": "A", "e": "A公司换出库存商品确认收入100万，成本80万，收益20万；换出固定资产公允价值160万，账面价值300 - 190 = 110万，清理费用10万，收益160 - 110 - 10 = 40万，计入损益金额为20 + 40 = 60万。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528589218713626", "t": 1, "q": "下列关于资产负债表分析中速动比率的说法，正确的是？", "a": ["速动资产仅包括货币资金和应收账款", "速动比率越高，企业短期偿债能力越弱", "速动比率比流动比率更能反映企业的长期偿债能力", "速动比率=（流动资产-存货）÷流动负债", "", ""], "r": "D", "e": "速动资产是流动资产扣除存货等变现能力弱的资产，速动比率=（流动资产 - 存货）÷流动负债，它衡量短期偿债能力，比率越高短期偿债能力越强。A选项速动资产不止货币资金和应收账款；B选项速动比率高短期偿债能力强；C选项速动比率反映短期偿债能力。答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907904", "t": 1, "q": "采用品种法计算产品成本时，如果企业只生产一种产品，发生的生产费用？", "a": ["全部计入该产品成本", "计入期间费用", "需要在不同产品间分配", "部分计入该产品成本", "", ""], "r": "A", "e": "品种法下若只生产一种产品，所有生产费用都直接归属于该产品，应全部计入该产品成本。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907905", "t": 1, "q": "账务处理程序中最基本的账务处理程序，是其他账务处理程序的基础。", "a": ["记账凭证", "汇总记账凭证", "科目汇总表", "日记总账", "", ""], "r": "A", "e": "记账凭证账务处理程序是最基本的账务处理程序，其他账务处理程序都是在它的基础上发展演变而来。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907906", "t": 1, "q": "利润表中\"税金及附加\"项目不包含的是？", "a": ["教育费附加", "增值税", "消费税", "城市维护建设税", "", ""], "r": "B", "e": "税金及附加核算企业经营活动发生的消费税、城市维护建设税、资源税、教育费附加等相关税费，增值税是价外税，不通过税金及附加核算。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907907", "t": 1, "q": "下列关于分批法的表述，正确的是？", "a": ["成本计算期与会计报告期一致", "适用于大量大批单步骤生产企业", "需要按产品生产步骤设置成本计算单", "一般不需要在完工产品和在产品之间分配费用", "", ""], "r": "D", "e": "分批法成本计算期与产品生产周期一致，和会计报告期不一致，A错误；它适用于单件、小批生产，B错误；分批法按产品批别设置成本计算单，C错误；分批法一般是产品完工时才计算成本，所以一般不需要在完工产品和在产品之间分配费用，D正确。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907908", "t": 1, "q": "或有事项的特征不包括（　）。", "a": ["属于一种潜在义务", "由过去的交易或事项形成", "由未来事项决定", "结果具有不确定性", "", ""], "r": "A", "e": "或有事项包括潜在义务和现时义务，A选项只说潜在义务不全面。或有事项是由过去交易或事项形成，结果由未来事项决定且具有不确定性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907909", "t": 1, "q": "下列关于固定资产的后续支出，说法不正确的是（　）。", "a": ["固定资产的装修费用，如果满足资本化条件的，应当计入固定资产的账面价值", "固定资产发生的修理费用，应当直接计入当期费用", "固定资产发生的可资本化的后续支出，首先应通过\"在建工程\"科目核算", "经营租入固定资产发生的改良支出，应通过\"长期待摊费用\"科目核算", "", ""], "r": "B", "e": "固定资产修理费用，企业生产车间（部门）固定资产修理费计入制造费用，并非全部直接计入当期损益，B 说法错误；满足资本化的装修费计入固定资产账面价值 A 正确；资本化后续支出先转入在建工程 C 正确；经营租入改良支出计入长期待摊费用 D 正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907910", "t": 1, "q": "甲公司销售产品每件500元，若客户购买300件（含300件）以上每件可得到50元的商业折扣。某客户2008年10月8日购买甲公司产品300件，按规定现金折扣条件为2/10，1/20，n/30。适用的增值税税率为17％。甲公司于10月12日收到该笔款项，则实际收到的款项为（　）元。（假定计算现金折扣时考虑增值税）", "a": ["154791", "154440", "157950", "3159", "", ""], "r": "A", "e": "本题可先计算出产品的不含税价款，再计算出增值税，进而得出应收账款总额，最后根据现金折扣条件计算实际收到的款项。 步骤一：计算产品的不含税价款已知甲公司销售产品每件500元，客户购买300件，可享受每件50元的商业折扣，那么每件产品的实际售价为500 - 50 = 450元。所以300件产品的不含税价款为450×300 = 135000元。 步骤二：计算增值税已知增值税税率为「test/yiwen_img/importSubject/2034528584214908928.png」，根据公式“增值税=不含税价款「test/yiwen_img/importSubject/2034528584399458304.png」增值税税率”，可得增值税为「test/yiwen_img/importSubject/2034528584483344384.png」元。 步骤三：计算应收账款总额应收账款总额为不含税价款与增值税之和，即135000 + 22950 = 157950元。 步骤四：计算实际收到的款项客户于10月8日购买产品，甲公司于10月12日收到款项，在10天内付款，可享受「test/yiwen_img/importSubject/2034528584571424768.png」的现金折扣。由于计算现金折扣时考虑增值税，所以现金折扣金额为「test/yiwen_img/importSubject/2034528584680476672.png」元。那么实际收到的款项为应收账款总额减去现金折扣金额，即157950 - 3159 = 154791元。综上，答案是A选项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907911", "t": 1, "q": "长江公司为一般纳税人，接受投资者投入的一台需要安装的设备。双方在协议中约定的价值为25万元（目前没有可靠证据证明这个价格是公允的），投入设备后享有长江公司增资后注册资本100万元的20％，设备的公允价值为22.5万元。安装过程中领用生产用材料一批，实际成本为0.2万元;领用自产的产成品一批，实际成本为1万元，售价为2.4万元，该产品为应税消费品。本企业适用的增值税税率为17％，消费税税率10％。在不考虑所得税的情况下，安装完毕投入生产使用的该设备入账成本为（　）万元。", "a": ["27.258", "24.382", "26.058", "24.758", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907912", "t": 1, "q": "下列各项中，不需要计入固定资产成本的有（　）。", "a": ["固定资产在资本化期间所发生的专门借款的利息费用", "进行日常修理发生的相关费用", "固定资产所发生的改良支出", "安装过程中领用自产产品所负担的增值税", "", ""], "r": "B", "e": "日常修理费用计入当期损益，不计入固定资产成本。资本化期间专门借款利息、改良支出、安装领用自产产品负担的增值税一般计入固定资产成本。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907913", "t": 1, "q": "企业的下列各项现金支出中，不属于投资活动产生的现金流量的是（　）。", "a": ["购买长期股权投资而支付的价款", "贄买机器设备所支付的增值税款", "支付在建工程人员的职工薪酬", "为购建固定资产、无形资产而发生的借款利息资本化部分", "", ""], "r": "D", "e": "投资活动是指企业长期资产的购建和不包括在现金等价物范围内的投资及其处置活动。A是购买长期股权投资；B购买机器设备属购建长期资产；C支付在建工程人员薪酬用于在建工程，也属投资活动。而D借款利息资本化部分是筹资活动产生的现金流量相关内容，不属于投资活动。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907914", "t": 1, "q": "资产负债表中，\"长期借款\"项目应根据（　）填列。", "a": ["\"长期借款\"科目期末余额加上一年内到期的部分金额", "\"长期借款\"科目所属明细科目余额", "\"长期借款\"总账科目余额", "\"长期借款\"科目期末余额扣除一年内到期且企业不能自主地将清偿义务展期的部分后的金额", "", ""], "r": "D", "e": "资产负债表“长期借款”项目要反映长期借款中超过一年才需偿还的部分，所以应是“长期借款”科目期末余额扣除一年内到期且企业不能自主将清偿义务展期的部分后的金额。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907915", "t": 1, "q": "对所属的明细分类科目起统驭作用的会计科目是（　）。", "a": ["一级科目", "三级科目", "明细科目", "二级科目", "", ""], "r": "A", "e": "一级科目是对会计要素具体内容进行总括分类、提供总括信息的会计科目，对所属明细分类科目起统驭作用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907916", "t": 1, "q": "在分配辅助生产费用时，将辅助生产的计划成本分配转出数与辅助生产的实际成本的差额全部计入管理费用，这种费用的分配方法是（　）。", "a": ["顺序分配法", "交互分配法", "代数分配法", "计划成本分配法", "", ""], "r": "D", "e": "计划成本分配法是先按辅助生产车间提供劳务的计划单位成本分配辅助生产费用，再将计划成本分配转出数与实际成本的差额全部计入管理费用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907917", "t": 1, "q": "M公司期末原材料的账面余额为5000元，数量为100件，此前未计提减值准备。该批原材料专门用于生产与N公司所签合同约定的50件甲产品。该合同约定:M公司为N公司提供甲产品50件，每件售价110元（不含增值税）。将该原材料加工成50件甲产品尚需加工成本总额为510元。估计销售每件甲产品尚需发生相关税费0.2元。本期期末市场上该原材料每件售价为48元，估计销售原材料尚需发生相关税费0.1元。期末该原材料应计提的减值准备为（　）元。", "a": ["105", "190", "20", "200", "", ""], "r": "C", "e": "50×110=5500，税费 50×0.2=10，产品可变现净值 5500−10=5490；材料可变现净值 = 5490−510=4980；材料成本 5000，减值 = 5000−4980=20，", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907918", "t": 1, "q": "按照建造合同的规定，下列不属于建造合同收入内容的是（　）。", "a": ["客户预付的定金", "因合同变更形成的收入", "合同中规定的初始收入", "因奖励形成的收入", "", ""], "r": "A", "e": "建造合同收入包括合同规定的初始收入、因合同变更、索赔、奖励等形成的收入。客户预付定金只是一种预收款项，并非建造合同收入的构成内容。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907919", "t": 1, "q": "成本会计有狭义成本会计和广义成本会计之分，所谓狭义成本会计是指（　）。", "a": ["成本核算", "成本控制", "成本考核和分析", "成本预测", "", ""], "r": "A", "e": "狭义成本会计主要聚焦成本核算，其他成本控制、考核分析、预测等属广义成本会计范畴。答案为A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907920", "t": 1, "q": "题目", "a": ["B两家公司属于非同一控制下的独立公司。A公司于20×9年7月1日以本企业的固定资产对B公司投资，取得B公司60％的股份。该固定资产原值1500万元，已计提折旧400万元，已提取减值准备50万元，7月1日该固定资产公允价值为1300万元。B公司20×9年7月1日所有者权益为2000万元。A公司该项长期股权投资的成本为（　）万元。", "1050", "1200", "1500", "1300", ""], "r": "D", "e": "非同一控制下企业合并，长期股权投资成本按付出资产公允价值确定。本题中A公司以固定资产投资，该固定资产公允价值为1300万元，所以长期股权投资成本是1300万元。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907921", "t": 1, "q": "下列关于利润表中\"研发费用\"项目的填列，正确的是？", "a": ["反映企业费用化的研发支出以及计入销售费用的自行开发无形资产的摊销", "叏映企业费用化的研发支出以及计入管理费用的自行开发无形资产的摊销", "仅反映企业费用化的研发支出", "仅反映企业资本化的研发支出", "", ""], "r": "B", "e": "“研发费用”项目应反映企业费用化的研发支出，以及计入管理费用的自行开发无形资产的摊销。A选项中计入销售费用表述错误；C选项不完整；D选项资本化研发支出不在此项目反映。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907922", "t": 1, "q": "某股份有限公司于2009年1月1日折价发行4年期，到期一次还本付息的公司债券，债券面值为500万元，票面年利率为10%，发行价格为480万元。债券折价采用实际利率法摊销，假定实际利率是12%。该债券2009年度发生的利息费用为（　）万元。", "a": ["57.6", "7.6", "20", "50", "", ""], "r": "A", "e": "按实际利率法计算利息费用，用债券期初摊余成本乘以实际利率，本题中债券期初摊余成本是发行价格480万元，实际利率12%，所以2009年利息费用=480×12% = 57.6万元。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907923", "t": 1, "q": "资产负债表中\"长期应付款\"项目，应根据\"长期应付款\"科目的期末余额减去（　）后的净额填列。", "a": ["一年内到期的长期应付款", "坏账准备期末余额", "未确认融资费用期末余额", "未确认融资费用期末余额和一年内到期的长期应付款", "", ""], "r": "D", "e": "资产负债表“长期应付款”项目需以“长期应付款”科目期末余额，减去未确认融资费用期末余额和一年内到期的长期应付款后的净额填列。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907924", "t": 1, "q": "甲公司和乙公司同为戊集团的子公司，2009年1月1日，甲公司以银行存款1620万元取得乙公司所有者权益的80％，同日乙公司所有者权益的账面价值为2000万元，可辨认净资产公允价值为2200万元。不考虑其他因素，则2009年1月1日，甲公司应确认的资本公积为（　）万元。", "a": ["140（借方）", "20（贷方）", "140（贷方）", "20（借方）", "", ""], "r": "D", "e": "同一控制合并按被合并方所有者权益账面价值份额入账，长投 = 2000×80%=1600 万；支付银行存款 1620 万，差额 20 万借记资本公积，即资本公积 20（借方）。", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907925", "t": 1, "q": "下列关于分步法下成本计算期的表述，正确的是？", "a": ["不定期计算成本", "与会计报告期一致", "根据企业需求随意确定", "与产品生产周期一致", "", ""], "r": "B", "e": "分步法适用于大量大批多步骤生产，成本计算是定期进行的，成本计算期与会计报告期一致，而与产品生产周期不一致。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907926", "t": 1, "q": "存货转换为采用公允价值模式计量的投资性房地产，投资性房地产应当按照转换当日的公允价值计量。转换当日的公允价值小于原账面价值的差额通过（　）科目核算。", "a": ["资本公积", "公允价值变动损益", "投资收益", "营业外支出", "", ""], "r": "B", "e": "存货转以公允价值模式计量的投资性房地产，公允价值小于原账面价值的差额计入公允价值变动损益。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907927", "t": 1, "q": "关于会计核算的基本前提，下列说法中不正确的是（　）。", "a": ["如果企业发生破产清算，经相关部门批准后，可以继续适用持续经营假设", "会计的货币计量假设，包含了两层含义，一是以货币作为会计的统一计量单位，二是作为会计计量单位的货币，其币值是稳定不变的", "会计基本假设包括会计主体、持续经营、会计分期和货币计量", "在我国，以公历年度作为企业的会计年度，即公历1月1日至12月31日", "", ""], "r": "A", "e": "企业发生破产清算，持续经营假设不再适用，A错误；B、C、D表述均正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907928", "t": 1, "q": "采用平行结转分步法计算产品成本时，各步骤计入最终完工产品成本份额的计算，关键在于确定？", "a": ["各步骤在产品约当产量", "费用分配率", "完工产品数量", "各步骤生产费用总额", "", ""], "r": "B", "e": "平行结转分步法下，要计算各步骤计入最终完工产品成本份额，先得算出费用分配率，再用其乘以完工产品数量等确定份额，所以关键在于确定费用分配率。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907929", "t": 1, "q": "甲公司是一般纳税人企业，增值税税率为13%，捐赠给乙公司10台自产的机器设备，单位成本为4万元，当时的市场售价为5万元，由于此次捐赠行为，企业计入营业外支出的金额为（　）万元。", "a": ["46.8", "51.5", "40", "50", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907930", "t": 1, "q": "下列关于《企业会计准则》中会计信息质量要求的表述，强调会计信息真实可靠、内容完整的是？", "a": ["相关性", "可比性", "可靠性", "可理解性", "", ""], "r": "C", "e": "可靠性要求企业应当以实际发生的交易或者事项为依据进行确认、计量和报告，如实反映符合确认和计量要求的各项会计要素及其他相关信息，保证会计信息真实可靠、内容完整。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907931", "t": 1, "q": "下列说法正确的是（　）。", "a": ["会计档案销毁清册需要保管15年", "固定资产卡片账应保管15年", "银行存款余额调节表需要保管5年", "现金日记账需要保管15年", "", ""], "r": "C", "e": "会计档案销毁清册应永久保管，A错误；固定资产卡片账在固定资产报废清理后保管5年，B错误；银行存款余额调节表保管期限为5年，C正确；现金日记账保管期限为25年，D错误。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907932", "t": 1, "q": "根据《企业会计准则》，企业应当按照交易或者事项的经济实质进行会计确认、计量和报告，不应仅以交易或者事项的法律形式为依据，这体现的会计信息质量要求是（　）", "a": ["重要性", "可靠性", "相关性", "实质重于形式", "", ""], "r": "D", "e": "实质重于形式要求企业按交易或事项经济实质而非法律形式进行会计处理。题干描述正是此要求体现。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907933", "t": 1, "q": "下列关于《企业会计准则》中会计信息质量要求的表述，要求企业提供的会计信息应当清晰明了，便于投资者等财务报告使用者理解和使用的是？", "a": ["相关性", "可靠性", "重要性", "可理解性", "", ""], "r": "D", "e": "可理解性要求企业提供的会计信息应当清晰明了，便于投资者等财务报告使用者理解和使用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907934", "t": 1, "q": " 在借贷记账法下，“应付账款”账户的期末余额计算公式是？", "a": ["期末余额=期初借方余额+本期贷方发生额-本期借方发生额", "期末余额=期初贷方余额+本期贷方发生额-本期借方发生额", "期末余额=期初贷方余额+本期借方发生额-本期贷方发生额", "期末余额=期初借方余额+本期借方发生额-本期贷方发生额", "", ""], "r": "B", "e": "“应付账款”是负债类科目，贷方登记增加，借方登记减少，期末余额一般在贷方。其期末余额计算是期初贷方余额加上本期贷方增加额，再减去本期借方减少额。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907935", "t": 1, "q": "采用分批法进行成本核算时，若某批次产品生产周期较长，生产过程中发生的间接费用，在月末应如何处理？", "a": ["全部计入该批次产品成本", "计入期间费用", "不进行分配，待产品完工时一并计算", "在各批次产品之间进行分配", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907936", "t": 1, "q": "某企业采用公允价值模式对投资性房地产进行后续计量，2008年6月10日达到预定可使用状态的自行建造的办公楼对外出租，该办公楼建造成本为2500万元，预计使用年限为30年，预计净残值为100万元。在采用年限平均法计提折旧的情况下，2008年该办公楼应计提的折旧为（　）。", "a": ["40", "83.33", "0", "80", "", ""], "r": "C", "e": "采用公允价值模式计量的投资性房地产不计提折旧。本题企业采用公允价值模式对投资性房地产进行后续计量，所以2008年该办公楼应计提折旧为0。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907937", "t": 1, "q": "下列关于品种法的成本计算程序，排序正确的是？①归集和分配各项生产费用;②设置成本明细账;③计算完工产品成本和月末在产品成本;④分配制造费用", "a": ["①②③④", "①②④③", "②①④③", "②①③④", "", ""], "r": "C", "e": "品种法成本计算，首先要设置成本明细账（②），接着归集和分配各项生产费用（①），之后分配制造费用（④），最后计算完工产品和月末在产品成本（③）。所以顺序为②①④③，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907938", "t": 1, "q": "下列项目中，不属于分部费用的是（　）。", "a": ["营业成本", "所得税费用", "营业税金及附加", "销售费用", "", ""], "r": "B", "e": "分部费用不包括所得税费用等与企业整体相关的费用。营业成本、营业税金及附加、销售费用都与分部经营活动相关，属于分部费用。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907939", "t": 1, "q": "下列关于利润表\"营业外收入\"项目的表述，正确的是？", "a": ["期末转入\"利润分配---未分配利润\"科目", "核算企业日常经营活动产生的收入", "包含与企业日常活动无关的政府补助", "包括出售固定资产的净收益（按新准则）", "", ""], "r": "C", "e": "营业外收入核算与企业日常活动无关的各项利得，包含与企业日常活动无关的政府补助。期末转入“本年利润”而非“利润分配——未分配利润”，它核算非日常经营活动收入，按新准则出售固定资产净收益计入“资产处置损益”。答案为C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907940", "t": 1, "q": "2008年12月15日，大海公司因合同违约而涉及一桩诉讼案。根据企业的法律顾问判断，最终的判决可能对大海公司不利。2008年12月31日，大海公司尚未接到法院的判决，因诉讼须承担的赔偿金额也无法准确地确定。不过，据专业人士估计，赔偿金额可能在500万元至800万元之间的某一金额。根据相关的规定，大海公司应在2008年12月31日资产负债表中确认负债的金额为（　）万元。", "a": ["0", "800", "500", "650", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907941", "t": 1, "q": "成本会计的各项职能中，最基础的是（　）。", "a": ["成本分析", "成本核算", "成本控制", "成本预测", "", ""], "r": "B", "e": "成本核算是成本会计最基础的职能，它为成本分析、控制、预测等其他职能提供数据基础。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907942", "t": 1, "q": "季度财务会计报告应于每季度终了后的（　）日内报出。", "a": ["15", "30", "6", "10", "", ""], "r": "A", "e": "季度财务会计报告需在季度结束后15日内报出。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907943", "t": 1, "q": "某企业在财产清查过程中，盘盈材料一批，价值为10000元，报经批准后，会计处理上应贷记（　）科目。", "a": ["原材料", "营业外支出", "管理费用", "营业外收入", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907944", "t": 1, "q": "编制资产负债表的理论依据是（　）", "a": ["资产+负债=所有者权益", "收入-费用=利润", "资产=权益+利润", "资产=负债+所有者权益", "", ""], "r": "D", "e": "资产负债表体现了企业在特定日期的财务状况，其编制的理论依据是会计恒等式“资产 = 负债 + 所有者权益”。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907945", "t": 1, "q": "按照我国企业会计准则的规定，资产负债表中的\"应收账款\"项目是根据（　）填列的。", "a": ["\"应收账款\"和\"预收账款\"科目所属各明细科目的期末借方余额合计数，减去\"坏账准备\"科目中有关应收账款计提的坏账准备期末余额后的金额填列", "\"应收账款\"总账科目期末借方余额", "\"应收账款\"明细科目期末借方余额之和", "\"应收账款\"总账科目期末贷方余额", "", ""], "r": "A", "e": "“应收账款”项目要综合考虑“应收账款”和“预收账款”明细借方余额，且要减去对应坏账准备。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907946", "t": 1, "q": "我国企业的资产负债表采用（　）结构。", "a": ["多步式", "报告式", "账户式", "单步式", "", ""], "r": "C", "e": "本题可根据资产负债表的结构类型及特点来解答。### 分析选项 A选项：多步式是利润表的一种结构形式，并非资产负债表的结构形式。 B选项：报告式资产负债表是将资产、负债和所有者权益按上下顺序排列，在我国较少采用。 C选项：我国企业的资产负债表采用账户式结构，账户式资产负债表分为左右两方，左方为资产项目，右方为负债和所有者权益项目，符合我国企业资产负债表的结构特点。 D选项：单步式也是利润表的一种结构形式，不是资产负债表的结构形式。综上，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907947", "t": 1, "q": "下列关于分批法的表述，错误的是？", "a": ["一般不需要在完工产品和在产品之间分配费用", "成本计算对象是产品批别", "适用于大量大批单步骤生产企业", "成本计算期与产品生产周期一致", "", ""], "r": "C", "e": "分批法适用于单件、小批生产，而大量大批单步骤生产企业适用品种法。A选项分批法一般不存在完工与在产品费用分配；B选项成本计算对象就是产品批别；D选项成本计算期与生产周期一致。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907948", "t": 1, "q": "目前我国的行政单位会计采用的会计基础，主要是（　）。", "a": ["权责发生制", "收付实现制", "统收统支制", "应收应付制", "", ""], "r": "B", "e": "我国行政单位会计主要采用收付实现制。权责发生制和应收应付制意思相近，多用于企业会计；统收统支制不是会计基础。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907949", "t": 1, "q": "2007年12月15日，甲公司购入一台不需安装即可投入使用的设备，其原价为1888万元。该设备预计使用年限为10年，预计净残值为88万元，采用年限平均法计提折旧。2011年以前没有计提过减值准备。2011年12月31日，该设备存在减值迹象，经减值测试，该设备的可收回金额为1160万元，预计尚可使用年限为5年，预计净残值为20万元，折旧方法不变。2012年度该设备应计提的折旧额为（　）万元。", "a": ["232", "214.4", "228", "180", "", ""], "r": "C", "e": "先算2011年末设备账面价值，按年限平均法，每年折旧额=(1888 - 88)÷10 = 180万元，2008 - 2011共4年，累计折旧180×4 = 720万元，账面价值为1888 - 720 = 1168万元，可收回金额1160万元，减值后账面价值为1160万元。之后按新情况算2012年折旧，(1160 - 20)÷5 = 228万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907950", "t": 1, "q": "企业购入交易性金融资产，支付的价款为103万元，其中包含已到期尚未领取的利息3万元，另支付交易费用2万元。该项交易性金融资产的入账价值为（　）万元。", "a": ["100", "102", "103", "105", "", ""], "r": "A", "e": "交易性金融资产入账价值不包含已到期尚未领取的利息，交易费用计入投资收益，所以入账价值是103 - 3 = 100万元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907951", "t": 1, "q": "（　）不属于有价证券。", "a": ["国库券", "股票", "企业债券", "银行汇票", "", ""], "r": "D", "e": "有价证券是具有一定票面金额，证明持券人有权按期取得一定收入并可自由转让和买卖的所有权或债权凭证。国库券、股票、企业债券都符合，而银行汇票是一种结算工具，不是有价证券。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907952", "t": 1, "q": "资产负债表中\"应收账款\"项目应根据（　）填列。", "a": ["\"应收账款\"总账科目期末余额", "\"应收账款\"和\"预收账款\"科目所属相关明细科目期末贷方余额之和", "\"应收账款\"明细科目期末借方余额之和", "\"应收账款\"和\"预收账款\"科目所属相关明细科目期末借方余额之和减去坏账准备科目中有关应收账款计提的坏账准备期末余额后的净额", "", ""], "r": "D", "e": "应收账款项目应按相关明细科目借方余额加总，再减去对应坏账准备后的净额填列，“应收账款”和“预收账款”明细科目借方余额都反映应收款项。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907953", "t": 1, "q": "2008年1月2日，甲公司以货币资金取得乙公司30％的股权，初始投资成本为3,000万元，投资时乙公司各项可辨认资产、负债的公允价值与其账面价值相同，可辨认净资产公允价值及账面价值的总额均为8,000万元，甲公司取得投资后即派人参与乙公司生产经营决策，但无法对乙公司实施控制。乙公司2008年实现净利润500万元，甲公司在2008年6月销售给乙公司一批存货，售价为200万元，成本为100万元，该批存货尚未对外销售，假定不考虑所得税因素，该项投资对甲公司2008年度计入投资收益的金额为（　）万元。", "a": ["200", "100", "120", "150", "", ""], "r": "C", "e": "甲取得30%股权且能参与决策，用权益法核算。先算初始投资成本3000万大于应享有的乙公司可辨认净资产公允价值份额8000×30% = 2400万，不调整初始投资成本。乙实现净利润500万，因甲卖给乙的存货未对外销售，要调减乙净利润（200 - 100），所以甲应确认投资收益=（500 - 100）×30% = 120万。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907954", "t": 1, "q": "2008年4月15日，甲公司销售一批材料给乙公司，开出的增值税专用发票上注明的销售价款为200,000元，增值税销项税额为34,000元，款项尚未收到。2008年7月6日，甲公司与乙公司进行债务重组。重组协议如下: 甲公司同意豁免乙公司债务80,000元; 延长期间，每月加收余款2％的利息，利息和本金于2008年10月6日一同偿还。假定甲公司为该项应收账款计提坏账准备2,000元，整个债务重组交易没有发生相关的税费。在债务重组日，甲公司应确认的债务重组损失为（　）元。", "a": ["78,000", "63,960", "80,000", "68,760", "", ""], "r": "A", "e": "甲公司应收账款账面余额为234000元，豁免80000元，已计提坏账准备2000元，债务重组损失=豁免金额 - 坏账准备，即80000 - 2000 = 78000元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907955", "t": 1, "q": "2008年1月10日，甲公司销售一批商品给乙公司，货款为5 000万元（含增值税额）。合同约定，乙公司应于2008年4月10日前支付上述货款。由于资金周转困难，乙公司到期不能偿付货款。经协商，甲公司与乙公司达成如下债务重组协议:乙公司以一批产品和一台设备偿还全部债务。乙公司用于偿债的产品成本为1 200万元，公允价值和计税价格均为1 500万元，未计提存货跌价准备;用于偿债的设备原价为5 000万元，已计提折旧2 000万元，计提减值准备800万元;公允价值为2 500万元。甲公司和乙公司适用的增值税税率均为17％，对该笔应收账款未计提坏账准备。假定不考虑除增值税以外的其他相关税费，乙公司该项债务重组事项对利润总额的影响为（　）万元。", "a": ["745", "1 345", "330", "1 045", "", ""], "r": "B", "e": "乙公司债务重组利得=5000 - 1500×1.17 - 2500 = 645（万元）；资产转让收益=（1500 - 1200）+[2500 -（5000 - 2000 - 800）]=300 + 300 = 600（万元）；对利润总额影响=645 + 600 = 1345（万元）。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907956", "t": 1, "q": "资产负债表中，“长期借款”项目应根据（　）填列。", "a": ["\"长期借款\"科目所属明细科目余额", "\"长期借款\"科目期末余额加上一年内到期的部分金额", "\"长期借款\"总账科目余额", "\"长期借款\"科目期末余额扣除一年内到期且企业不能自主地将清偿义务展期的部分后的金额", "", ""], "r": "D", "e": "资产负债表中“长期借款”要反映长期借款中超过一年才到期的部分，所以应是“长期借款”科目期末余额扣除一年内到期且企业不能自主地将清偿义务展期的部分后的金额。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528589222907957", "t": 1, "q": "2008年1月1日，A公司开工建造的一座厂房，工期预计为2年。2008年工程建设期间共占用了两笔一般借款，两笔借款的具体情况如下:向某银行长期贷款1000万元，贷款期限为2007年12月1日至2009年12月1日，年利率为8％，按年支付利息;按面值发行公司债券4000万元，于2008年7月1日发行，期限为5年，年利率为10％，按年支付利息。A企业无其他一般借款。不考虑其他因素，则该企业2008年为该厂房所占用的一般借款适用的资本化率为（　）。", "a": ["9.6%", "8.5%", "10.3%", "9.3%", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855488", "t": 2, "q": "资产负债表中，“存货”项目应根据下列哪些科目的余额分析填列？", "a": ["生产成本", "工程物资", "原材料", "库存商品", "", ""], "r": "ACD", "e": "存货是企业日常活动中持有以备出售的产成品或商品、处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料和物料等。生产成本核算在产品成本，原材料和库存商品属于存货常见类别，它们都应计入存货项目。而工程物资是用于建造固定资产等工程的物资，不属于存货。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855489", "t": 2, "q": "资产负债表日后非调整事项的特点为（　）。", "a": ["期后发生的事项", "在资产负债表日或以前已经存在", "资产负债表日得以证实", "在资产负债表日并未发生或存在", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855490", "t": 2, "q": "关于品种法的成本核算，下列说法正确的有？", "a": ["月末一般不存在在产品，若有则需在完工产品和在产品之间分配费用", "成本计算对象是产品品种", "适用于大量大批多步骤生产且管理上要求分步计算成本的企业", "一般定期计算产品成本", "", ""], "r": "ABD", "e": "品种法成本计算对象是产品品种，一般定期计算成本，月末若有在产品需在完工产品和在产品间分配费用，适用于大量大批单步骤生产或管理上不要求分步计算成本的多步骤生产企业。C选项说适用于大量大批多步骤且管理上要求分步计算成本的企业错误。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855491", "t": 2, "q": "将投资性房地产转换为其他资产或者将其他资产转换为投资性房地产，关于转换日的确定,叙述正确的有（　）。", "a": ["企业2008年10月20日将原本用于经营管理的土地使用权停止自用，于2008年11月30日改用于资本增值，则该房地产的转换日为2008年10月20日", "企业2008年6月4日将原本用于生产商品的房地产改用于出租，租赁期开始日为2008年7月1日，则该房地产的转换日为2008年7月1日", "房地产开发企业2008年6月30日决定将其持有的开发产品以经营租赁的方式出租，租赁期开始日为2008年7月1日，则该房地产的转换日为2008年7月1日", "企业于2008年5月15日开始将原本用于出租的房地产改用于自身生产使用，则该房地产的转换日为2008年5月15日", "", ""], "r": "BCD", "e": "自用转投资性房地产，转换日是租赁期开始日等用于赚取租金或资本增值开始日；投资性房地产转自用等，转换日是开始自用等日期。A选项应是11月30日；B、C、D符合规定。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855492", "t": 2, "q": "下列各项中，可能构成融资租赁固定资产入账价值的有（　）。", "a": ["租赁资产的原账面价值", "最低租赁付款额", "最低租赁付款额的现值", "租赁开始日租赁资产的公允价值", "", ""], "r": "CD", "e": "融资租赁固定资产入账价值按租赁开始日租赁资产公允价值与最低租赁付款额现值两者中较低者确定。所以可能构成入账价值的有最低租赁付款额的现值和租赁开始日租赁资产的公允价值。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855493", "t": 2, "q": "下列借款费用中，在满足资本化条件进行资本化时，不应当考虑资产支出的有（　）。", "a": ["专门借款的辅助费用", "一般借款的借款利息", "专门借款的借款利息", "外币专门借款汇兑差额", "", ""], "r": "AD", "e": "专门借款辅助费用和外币专门借款汇兑差额资本化不考虑资产支出。一般借款利息资本化需考虑资产支出，专门借款利息资本化虽然有专门借款闲置收益的计算，但本质也是基于资产支出情况。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855494", "t": 2, "q": "在借贷记账法下，以下账户结构表述正确的有？", "a": ["资产类账户借方登记增加额", "费用类账户贷方登记减少额", "收入类账户借方登记增加额", "负债类账户贷方登记增加额", "", ""], "r": "ABD", "e": "在借贷记账法中，资产、费用类账户借方记增加、贷方记减少；负债、所有者权益、收入类账户贷方记增加、借方记减少。C选项收入类账户借方应登记减少额。所以表述正确的是ABD。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855495", "t": 2, "q": "下列各项中，不属于损益类账户的是（　）。", "a": ["利润分配", "制造费用", "实收资本", "主营业务收入", "", ""], "r": "ABC", "e": "损益类账户核算企业收入、费用等，影响当期损益。A选项“利润分配”是所有者权益类账户，用于核算利润分配情况；B选项“制造费用”是成本类账户，用于归集产品生产过程中的间接费用；C选项“实收资本”是所有者权益类账户，反映投资者投入资本。D选项“主营业务收入”是损益类账户。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855496", "t": 2, "q": "下列事项中，不应确认为预计负债的有（　）。", "a": ["甲公司为一家中型塑料加工企业，由于没有注意污染整治致使周围村镇居民身体健康和生产生活遭受严重损害。为此周围村镇集体向法院提起诉讼，要求赔偿损失1000万元。该诉讼案尚未判决。根据公司法律顾问的职业判断，由于此案涉及的情况比较复杂还不能可靠地估计赔偿损失金额", "甲公司将未到期商业汇票贴现", "甲公司与丙企业发生经济纠纷，丙企业于当年11月18日向法院提起诉讼。至年末，法院尚未判决，甲公司的律师认为，可以合理估计很可能败诉并将支付20万元的赔偿金", "甲公司因与乙公司签订了互相担保协议，而成为相关诉讼的第二被告。诉讼尚未判决。由于乙公司经营困难，甲公司很可能需要承担还款连带责任。根据甲公司法律顾问的职业判断，甲公司很可能需要承担200万元的还款连带责任", "", ""], "r": "AB", "e": "预计负债确认需同时满足该义务是企业承担的现时义务、履行该义务很可能导致经济利益流出企业、该义务的金额能够可靠地计量这三个条件。A选项不能可靠估计赔偿损失金额，不满足预计负债确认条件；B选项未到期商业汇票贴现不是预计负债范畴。C和D满足预计负债确认条件。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855497", "t": 2, "q": "关于非货币性职工薪酬，说法正确的有（　）。", "a": ["企业以其自产产品作为非货币性福利发放给职工的，应当根据受益对象，按照产品的公允价值，计入相关资产成本或当期损益，同时确认应付职工薪酬", "难以认定受益对象的非货币性福利，直接计入当期损益", "企业租赁住房等资产供职工无偿使用的，应当根据受益对象，将每期应付的租金计入相关资产成本或当期损益，并确认应付职工薪酬", "企业将拥有的房屋等资产无偿提供给职工使用的，应当根据受益对象，按照该住房的账面价值计入相关资产成本或当期损益，同时确认应付职工薪酬", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855498", "t": 2, "q": "关于成本核算方法中的分批法，适用场景包括？", "a": ["单件生产的船舶制造", "新产品的试制项目", "小批生产的服装定制", "大量大批的标准件生产", "", ""], "r": "ABC", "e": "分批法适用于单件、小批生产。ABC选项分别是单件生产、新产品试制项目（通常小批量）、小批生产，都符合分批法适用场景；而D选项大量大批的标准件生产适用分步法。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855499", "t": 2, "q": "企业进行财务报表分析时，分析盈利能力的指标有？", "a": ["总资产周转率", "毛利率", "净利率", "净资产收益率", "", ""], "r": "BCD", "e": "总资产周转率衡量资产运营效率，非盈利能力指标；毛利率、净利率、净资产收益率都从不同角度反映企业盈利情况。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855500", "t": 2, "q": "关于投资性房地产的后续计量，下列说法正确的有（　）。", "a": ["采用成本模式计量的，应对投资性房地产计提折旧或进行摊销", "已经采用成本模式计量的，可以转为采用公允价值模式计量", "采用公允价值模式计量的，应对投资性房地产计提折旧或进行摊销", "已采用公允价值模式计量的投资性房地产，可以从公允价值模式转为成本模式", "", ""], "r": "AB", "e": "成本模式下投资性房地产要计提折旧或摊销，且可转为公允价值模式；而公允价值模式下不计提折旧或摊销，且已采用公允价值模式的不能再转为成本模式。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855501", "t": 2, "q": "表明金融资产发生减值的客观证据，包括（　）。", "a": ["债权人出于经济或法律等方面因素的考虑，对发生财务困难的债务人作出让步", "发行方或债务人发生严重财务困难", "债务人很可能倒闭或进行其他财务重组", "债务人违反了合同条款，如偿付利息或本金发生违约或逾期等", "", ""], "r": "ABCD", "e": "ABCD选项描述的情况都体现了金融资产面临风险，资产价值可能受损，属于金融资产发生减值的客观证据。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855502", "t": 2, "q": "关于或有事项，下列说法中正确的有（　）。", "a": ["企业应当按照与重组有关的直接支出确定预计负债金额", "与重组有关的直接支出包括留用职工岗前培训、市场推广、新系统和营销网络投入等支出", "企业承担的重组义务满足或有事项确认预计负债条件的，应当确认预计负债", "重组是指企业制定和控制的，将显著改变企业组织形式、经营范围或经营方式的计划实施行为", "", ""], "r": "ACD", "e": "B选项中留用职工岗前培训、市场推广、新系统和营销网络投入等支出不属于与重组有关的直接支出；A选项按与重组有关直接支出确定预计负债金额正确；C选项承担重组义务满足条件应确认预计负债正确；D选项对重组的定义正确。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855503", "t": 2, "q": "下列哪些说法是正确的（　）。", "a": ["会计科目仅是对会计要素具体内容进行分类核算的项目或标志", "在实际工作中，对账户和会计科目往往不加严格区分，而是相互通用", "账户是会计科目的具体运用", "账户没有固定的格式和结构", "", ""], "r": "ABC", "e": "会计科目是对会计要素具体内容分类核算的项目或标志；实际工作中账户和科目常通用；账户是根据科目设置的，是其具体运用；账户有一定格式和结构。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855504", "t": 2, "q": "在非企业合并情况下，下列各项中构成长期股权投资初始投资成本的有（　）。", "a": ["投资时支付款项中所含的已宣告而尚未领取的现金股利", "为取得长期股权投资而发生的评估、审计、咨询费", "投资时支付的不含应收股利的价款", "投资时支付的税金及其他必要支出", "", ""], "r": "CD", "e": "A选项，已宣告未领取的现金股利应单独确认为应收项目，不构成初始投资成本；B选项，非企业合并取得长期股权投资时，评估、审计、咨询费计入当期损益；C选项投资时支付不含应收股利的价款是初始投资成本一部分；D选项投资时支付的税金及其他必要支出也构成初始投资成本。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855505", "t": 2, "q": "下列关于会计等式\"资产=负债+所有者权益\"的说法，正确的有？", "a": ["是复式记账法的理论基础", "企业经济业务的发生不会破坏该等式的平衡关系", "反映企业某一特定时点的财务状况", "是编制资产负债表的理论依据", "", ""], "r": "ABCD", "e": "“资产 = 负债 + 所有者权益”是会计基本等式，是复式记账法理论基础，企业业务发生遵循此等式不会破坏平衡，它反映特定时点财务状况，也是编制资产负债表依据。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855506", "t": 2, "q": "采用分批法计算产品成本时，其适用范围包括？", "a": ["单件生产的产品", "小批生产的产品", "工业企业的供水、供电生产", "新产品试制", "", ""], "r": "ABD", "e": "分批法适用于单件、小批生产以及新产品试制等。而工业企业的供水、供电生产一般采用品种法。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855507", "t": 2, "q": "企业成本会计工作组织有集中工作方式和分散工作方式两种，具体应用哪一种方式应考虑的因素有（　）。", "a": ["经营管理的要求", "企业规模大小", "成本会计人员的数量和素质", "是否有利于成本会计作用的发挥", "", ""], "r": "ABCD", "e": "企业选择成本会计工作组织方式要综合多方面因素，经营管理要求会决定采用何种方式更契合管理目标；企业规模大小不同，适用的工作组织方式有别；成本会计人员数量和素质影响工作开展方式；是否利于成本会计作用发挥也是重要考量。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855508", "t": 2, "q": "资产负债表中，“长期应付款”项目的填列，需要考虑的因素有？", "a": ["应付账款科目余额", "长期应付款科目期末余额", "一年内到期的长期应付款", "未确认融资费用科目期末余额", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855509", "t": 2, "q": "下列项目中，属于成本类科目的是（　）。", "a": ["制造费用", "长期待摊费用", "管理费用", "生产成本", "", ""], "r": "AD", "e": "成本类科目用于核算成本的发生和归集情况。制造费用和生产成本都与产品生产的成本相关。长期待摊费用是资产类科目，管理费用是损益类科目。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855510", "t": 2, "q": "下列各项目中，属于会计估计变更的有（　）。", "a": ["将建造合同的收入确认由完成合同法改为完工百分比法", "因出现相关新技术，将某专利权的摊销年限由10年改为6年", "将固定资产的折旧方法由双倍余额递减法改为年数总和法", "将存货的期末计价由成本法改为成本与可变现净值孰低法", "", ""], "r": "BC", "e": "会计估计变更是指由于资产和负债的当前状况及预期经济利益和义务发生了变化，从而对资产或负债的账面价值或者资产的定期消耗金额进行调整。选项A、D属于会计政策变更；选项B对专利权摊销年限的变更和选项C对固定资产折旧方法的变更，是对资产定期消耗金额和账面价值调整，属于会计估计变更。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855511", "t": 2, "q": "下列各项中，属于企业所有者权益组成部分的有（　）", "a": ["股本", "资本公积", "盈余公积", "应付股利", "", ""], "r": "ABC", "e": "所有者权益包括实收资本（或股本）、资本公积、盈余公积和未分配利润等。应付股利是负债。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855512", "t": 2, "q": "根据《企业会计准则》，会计信息质量要求包括？", "a": ["可靠性", "重要性", "谨慎性", "实质重于形式", "", ""], "r": "ABCD", "e": "《企业会计准则》规定会计信息质量要求涵盖可靠性、重要性、谨慎性、实质重于形式等。ABCD选项均是其中内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855513", "t": 2, "q": "下列各项中构成取得固定资产成本的有（　）。", "a": ["自行建造固定资产所领用的原材料所负担的增值税", "接受捐赠的固定资产所支付的相关费用", "购买固定资产时交纳的契税", "进口固定资产支付的关税", "", ""], "r": "BCD", "e": "自行建造固定资产领用原材料，增值税可抵扣不计入成本；接受捐赠固定资产支付的相关费用、购买固定资产交纳的契税、进口固定资产支付的关税都应计入取得固定资产成本。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855514", "t": 2, "q": "对于汇总记账凭证账务处理程序，下列说法错误的有（　）。", "a": ["明细账与总账无法核对", "当转账凭证较多时，汇总转账凭证的编制工作量较大", "不能体现账户之间的对应关系", "登记总账的工作量大", "", ""], "r": "ACD", "e": "汇总记账凭证账务处理程序可通过汇总记账凭证和总账核对，能体现账户对应关系，登记总账依据汇总记账凭证，工作量不大，但转账凭证多会使汇总转账凭证编制工作量大。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855515", "t": 2, "q": "采用分批法计算产品成本时，成本计算单应按产品批别设置，其登记的内容包括？", "a": ["该批产品应负担的制造费用", "该批产品的销售费用", "该批产品的直接材料费用", "该批产品的直接人工费用", "", ""], "r": "ACD", "e": "答案选ACD。分批法下，成本计算单登记产品生产成本，制造费用、直接材料费用、直接人工费用都属于生产成本范畴。而销售费用是期间费用，不计入产品生产成本，所以不登记在成本计算单中。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855516", "t": 2, "q": "企业利润表中\"营业成本\"项目，反映的内容包括？", "a": ["其他业务成本", "销售费用", "税金及附加", "主营业务成本", "", ""], "r": "AD", "e": "营业成本包括主营业务成本和其他业务成本。销售费用属于期间费用，税金及附加是单独项目。所以答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855517", "t": 2, "q": "采用平行结转分步法计算产品成本的优点有？", "a": ["能直接提供按原始成本项目反映的产品成本资料", "各步骤可以同时计算产品成本", "便于进行各步骤的成本管理", "不必进行成本还原", "", ""], "r": "ABD", "e": "平行结转分步法各步骤可同时计算产品成本，能直接提供按原始成本项目反映的产品成本资料，且不必进行成本还原。而它不利于各步骤的成本管理。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855518", "t": 2, "q": "下列关于每股收益的表述，正确的有（　）。", "a": ["计算基本每股收益时，分子为企业当期实现的可供普通股股东分配的净利润或应由普通股股东分担的净亏损金额", "上期已回购但截至本期末尚未注销的库存股，会影响本期基本每股收益", "计算基本每股收益时，已发行时间、报告期时间和已回购时间一般按照天数计算;在不影响计算结果合理性的前提下，也可以采用简化的计算方法", "计算基本每股收益时，分母为企业当期发行在外的普通股的算术加权平均数", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855519", "t": 2, "q": "事业单位年终结账后，下列会计科目应转入事业单位结余，期末无余额的有（　）。", "a": ["经营收入", "财政补助收入", "事业收入", "其他收入", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855520", "t": 2, "q": "无形资产内部研发项目中，开发阶段有关支出资本化应同时满足的条件有（　）。", "a": ["归属于该无形资产开发阶段的支出能够可靠计量", "具有完成该无形资产并使用或出售的意图", "完成该无形资产以使其能够使用或出售在技术上具有可行性，有足够的技术、财务资源和其他资源支持，以完成该无形资产的开发，并有能力使用或出售该无形资产", "无形资产产生经济利益的方式，包括能够证明运用该无形资产生产的产品存在市场或无形资产自身存在市场，无形资产将在内部使用的，应当证明其有用性", "", ""], "r": "ABCD", "e": "开发阶段支出资本化需同时满足五个条件，ABCD选项分别对应其中条件，包括支出可计量、有完成及使用或出售意图、技术可行且资源支持、能证明产生经济利益方式等。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855521", "t": 2, "q": "下列关于内部研发无形资产的说法，正确的有（　）。", "a": ["无法区分研究阶段与开发阶段的，相关支出应全部费用化", "研究阶段的支出应全部费用化", "开发阶段的支出满足资本化条件时可以资本化", "研究阶段的支出满足一定条件时，也可以资本化", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855522", "t": 2, "q": "下列资产项目中，应按资产减值准则的有关规定进行会计处理的有（　）。", "a": ["对子公司的长期股权投资", "可供出售金融资产", "采用公允价值模式进行后续计量的投资性房地产", "采用成本模式进行后续计量的投资性房地产", "", ""], "r": "AD", "e": "资产减值准则主要规范非流动资产减值，对子公司长期股权投资和采用成本模式计量的投资性房地产适用该准则；可供出售金融资产按金融工具准则处理减值；采用公允价值模式计量的投资性房地产不存在减值问题。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855523", "t": 2, "q": "企业采用分步法核算产品成本时，平行结转分步法的缺点有哪些？", "a": ["不能提供各步骤半成品成本资料", "不能为各步骤在产品的实物管理提供资料", "不能全面反映各步骤生产耗费水平", "成本结转工作量大", "", ""], "r": "ABC", "e": "平行结转分步法不计算各步骤半成品成本，所以不能提供各步骤半成品成本资料，不能为各步骤在产品实物管理提供资料，也不能全面反映各步骤生产耗费水平；而成本结转工作量大是逐步结转分步法的缺点。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855524", "t": 2, "q": "下列各项中，属于财务会计报告编制基本要求的有（　）", "a": ["历史成本", "真实可靠", "全面完整", "相关可比", "", ""], "r": "BCD", "e": "财务会计报告编制要能真实反映企业情况，所以需真实可靠；要涵盖所有重要信息，得全面完整；还应具有可比性以便分析，所以相关可比也是基本要求。而历史成本是会计计量属性，并非编制报告的基本要求。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855525", "t": 2, "q": "根据《企业会计准则第8号——资产减值》的规定，资产的可收回金额应当根据下列两者之间的较高者确定。", "a": ["资产的公允价值", "资产预计未来现金流量", "资产的公允价值减去处置费用后的净额", "资产预计未来现金流量的现值", "", ""], "r": "CD", "e": "资产可收回金额是取资产的公允价值减去处置费用后的净额与资产预计未来现金流量的现值两者中的较高者。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855526", "t": 2, "q": "以下停工应单独核算的有（　）。", "a": ["固定资产修理造成的停工", "原材料不足造成的停工", "计划减产造成的停工", "季节性生产造成的停工", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855527", "t": 2, "q": "根据现行企业会计准则的规定，下列各项中属于或有事项的有（　）。", "a": ["企业为其子公司的贷款提供的担保", "企业被其他企业提起诉讼", "企业在销售产品时承诺的产品质量保证", "企业出售或终止部分经营业务的重组活动", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855528", "t": 2, "q": "企业预计资产未来现金流量时，应当综合考虑的因素有（　）。", "a": ["以资产的当前状况为基础预计资产未来现金流量", "内部转移价格应当予以调整", "预计资产未来现金流量不应当包括筹资活动和所得税收付产生的现金流量", "对通货膨胀因素的考虑应当和折现率相一致", "", ""], "r": "ABCD", "e": "本题可根据企业预计资产未来现金流量的相关规定来分析各选项。 选项A：预计资产未来现金流量时，应以资产的当前状况为基础，不考虑与将来可能会发生的、尚未作出承诺的重组事项或者与资产改良有关的预计未来现金流量，该选项正确。 选项B：为了如实测算企业资产的可收回金额，企业不应当以内部转移价格为基础预计资产未来现金流量，而应当采用在公平交易中企业管理层能够达成的最佳的未来价格估计数进行预计，即内部转移价格应当予以调整，该选项正确。 选项C：预计资产未来现金流量不应当包括筹资活动和所得税收付产生的现金流量，因为筹资活动与企业的资金筹集相关，所得税是基于企业的盈利情况计算的，它们都与资产本身的使用和产出的现金流量无关，该选项正确。 选项D：如果折现率考虑了通货膨胀因素，那么预计资产未来现金流量也应考虑通货膨胀因素；反之，如果折现率没有考虑通货膨胀因素，那么预计资产未来现金流量也不应考虑通货膨胀因素，即对通货膨胀因素的考虑应当和折现率相一致，该选项正确。综上，ABCD四个选项均是企业预计资产未来现金流量时应当综合考虑的因素，答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855529", "t": 2, "q": "在资产负债表日至财务报告批准报出日之间发生的下列事项中，属于资产负债表日后非调整事项的有（　）。", "a": ["日后期间发生的产品销售", "日后期间发现一项自行研发的无形资产在报告年度达到预定可使用状态，但未将\"研发支出\"科目中可以资本化的金额进行结转", "日后期间发生的诉讼", "董事会提出股票股利分配方案", "", ""], "r": "ACD", "e": "资产负债表日后非调整事项是指表明资产负债表日后发生的情况的事项。A选项日常产品销售是正常经营活动；C选项日后诉讼是日后新发生事项；D选项董事会提出股票股利分配方案是资产负债表日后新的情况。而B选项是对报告年度已存在事项的差错更正，属于调整事项。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855530", "t": 2, "q": "下列各项中，体现会计核算的谨慎性要求的有（　）。", "a": ["对固定资产计提减值准备", "采用双倍余额递减法对固定资产计提折旧", "对交易性金融资产期末采用公允价值计量", "或有应付金额符合或有事项确认预计负债条件的，应将其确认为预计负债", "", ""], "r": "ABD", "e": "谨慎性要求不高估资产或收益、不低估负债或费用。A对固定资产计提减值准备，避免资产高估；B双倍余额递减法前期折旧多，后期少，加速资产折旧体现谨慎；D确认或有应付金额为预计负债，不低估负债。C交易性金融资产按公允价值计量是为反映其真实价值，并非谨慎性体现。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855531", "t": 2, "q": "行政事业单位对固定资产的会计处理，不正确的有（　）。", "a": ["固定资产一般不计提折旧", "事业单位的固定资产的账面余额与固定基金的账面余额相等", "事业单位固定资产借款利息和有关的费用，不能计入固定资产的价值", "行政单位的固定资产的账面余额与固定基金的账面余额相等", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855532", "t": 2, "q": "企业编制资产负债表时，需根据明细科目余额分析填列的项目有？", "a": ["应付账款", "预收款项", "应收账款", "预付款项", "", ""], "r": "ABCD", "e": "应付账款、预收款项、应收账款、预付款项这些项目在填列资产负债表时，都要根据相关明细科目余额分析填列。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855533", "t": 2, "q": "对于开发过程中的无形资产，下列项目中属于预计资产未来现金流量应当包括的内容有（　）。", "a": ["持续使用该项无形资产产生的现金流入", "为使该项无形资产达到预定用途而发生的支出", "处置该项无形资产发生的现金流入", "使用过程中为维护该项无形资产而发生的现金支出", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855534", "t": 2, "q": "各种会计账务处理程序下，登记明细账的依据可能有（　）。", "a": ["多栏式日记账账务处理程序", "记账凭证", "汇总原始凭证", "汇总记账凭证账务处理程序", "", ""], "r": "BC", "e": "登记明细账依据有记账凭证、原始凭证、汇总原始凭证。选项A和D是账务处理程序，并非登记明细账的依据。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528591617855535", "t": 2, "q": "将净利润调节为经营活动产生的现金流量时，下列各调整项目中，属于调减项目的有（　）。", "a": ["长期待摊费用摊销", "存货的增加", "递延所得税资产增加", "投资收益", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483392", "t": 3, "q": "企业内部研发形成的无形资产，在初始确认时账面价值和计税基础之间存在差异，企业应确认相应的递延所得税。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483393", "t": 3, "q": "企业取得的正在研发过程中应予资本化的项目，在取得后发生的支出，如果符合资本化条件，可以资本化，否则应当费用化。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业取得正在研发中且应资本化的项目，后续支出按规定，符合资本化条件就资本化，不符合则费用化，该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483394", "t": 3, "q": "无形资产预期不能为企业带来经济利益的，应当将该无形资产的账面价值予以转销，计入当期营业外收入。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "无形资产预期不能为企业带来经济利益时，应将其账面价值转销计入营业外支出，而非营业外收入。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483395", "t": 3, "q": "企业发现重要差错，无论是本期还是以前期间的差错，均应调整期初留存收益和其他相关项目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483396", "t": 3, "q": "减少债务本金、降低利率、免去应付未付的利息、延长偿还期限并减少债务的账面价值等重组方式属于修改其他债务条件的债务重组方式。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "修改其他债务条件是指修改不包括以资产清偿债务、将债务转为资本两种方式以外的债务条件，减少债务本金、降低利率等符合其定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483397", "t": 3, "q": "采用成本模式计量的投资性房地产转为公允价值模式计量时，按照会计政策变更处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "投资性房地产后续计量模式由成本模式转为公允价值模式，属于会计政策变更，需追溯调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483398", "t": 3, "q": "在活跃市场中没有报价且其公允价值不能可靠计量的权益工具投资，其发生的减值损失不得转回。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据准则规定，此类权益工具投资减值损失不得转回。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483399", "t": 3, "q": "在附有销售退回条件的商品销售的方式下，企业根据以往经验能够合理估计退货可能性并确认相关负债的，通常应在发出商品时确认收入。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在附有销售退回条件且能合理估计退货可能性并确认相关负债时，符合收入确认条件，应在发出商品时确认收入。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483400", "t": 3, "q": "资产负债表日后发现的财务报表舞弊或差错，是指资产负债表日至财务报告批准报出日之间发现的属于资产负债表期间或以前期间存在的财务报表舞弊或差错，这种舞弊或差错应当作为资产负债表日后调整事项，调整报告年度的年度财务报告或中期财务报告相关项目的数字。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "此描述符合资产负债表日后调整事项中对发现财务报表舞弊或差错的规定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483401", "t": 3, "q": "资产负债表中的\"长期应付款\"项目直接按照\"长期应付款\"的期末余额填列。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产负债表中“长期应付款”项目应根据“长期应付款”科目的期末余额，减去相关的“未确认融资费用”科目的期末余额和将于一年内到期的长期应付款后的金额填列，并非直接按“长期应付款”期末余额填列。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483402", "t": 3, "q": "只要债权人对债务人的债务作出了让步，不管债务人是否发生财务困难，都属于准则所定义的债务重组。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "债务重组的定义要求债务人发生财务困难且债权人作出让步这两个条件同时满足。题中仅提及债权人作出让步，未强调债务人发生财务困难，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483403", "t": 3, "q": "资产的公允价值减去处置费用后的净额，不能根据公平交易中销售协议价格减去可直接归属于该资产处置费用的金额确定，而应该根据熟悉情况的交易双方自愿进行公平交易愿意提供的交易价格减去处置费用后的金额确定。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产的公允价值减去处置费用后的净额，首先应根据公平交易中销售协议价格减去可直接归属于该资产处置费用的金额确定，并非如题目表述。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483404", "t": 3, "q": "行政事业单位的应收款项应根据具体情况计提相应的坏账准备。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "行政事业单位的应收款项一般不计提坏账准备。因为行政事业单位会计核算以收付实现制为主，且应收款项收回有其特点。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483405", "t": 3, "q": "企业将应收债权出售给银行，且不承担相应的坏账风险，则应按应收债权出售处理，将应收账款转销。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业出售应收债权且不承担坏账风险，符合应收债权出售条件，应转销应收账款。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483406", "t": 3, "q": "委托代销商品在收取手续费代销的方式下，受托方将商品销售后，按实际售价确认为销售收入，并向委托方开具代销清单。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在收取手续费代销方式下，受托方应按收取的手续费确认收入，而非按实际售价确认为销售收入。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483407", "t": 3, "q": "受托加工来料不必在账簿中登记。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "受托加工来料属于受托企业代管物资，应在备查账簿中登记，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483408", "t": 3, "q": "无充分合理的证据表明会计政策变更的合理性或者未经股东大会等类似权利机构批准擅自变更会计政策的，或者连续、反复地自行变更会计政策的，视为滥用会计政策，按照重要差错来进行会计处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "题干描述符合会计准则中对滥用会计政策及处理方式的规定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483409", "t": 3, "q": "企业发行债券的票面利率低于同期银行存款利率时，可按超过债券面值的价格发行，称为溢价发行。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483410", "t": 3, "q": "资产负债表日后调整事项可能涉及调整的报表有资产负债表、利润表、所有者权益变动表、现金流量表，同时如果上述调整涉及附注内容，还应调整附注相关项目的数字。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483411", "t": 3, "q": "以现金发放职工工资，会引起企业的现金减少和支付给职工的工资债务增加。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "以现金发放职工工资，现金减少，同时工资债务（应付职工薪酬）减少，而不是增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483412", "t": 3, "q": "记账凭证账务处理程序是最基本的账务处理程序，其特点就是登记账簿的工作量较小。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "记账凭证账务处理程序是最基本的账务处理程序，但它是直接根据记账凭证逐笔登记总分类账，登记账簿工作量大，并非较小。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483413", "t": 3, "q": "企业派发股票股利、公积金转增资本、拆股或并股，会增加或减少其发行在外的普通股或潜在普通股的数量，但并不影响所有者权益金额。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这些行为只是改变了股票的数量结构，如将留存收益转为股本等，不涉及实际资金的流入流出，所以不影响所有者权益金额。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483414", "t": 3, "q": "固定资产处于处置状态或者固定资产预期通过使用或者处置不能产生经济利益的资产应终止确认。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当固定资产处于处置状态，意味着不再用于日常经营；预期通过使用或处置都不能产生经济利益，不符合资产定义，所以应终止确认。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483415", "t": 3, "q": "采用权益法核算的长期股权投资的初始投资成本大于投资时应享有被投资单位可辨认净资产公允价值份额的，其差额不调整长期股权投资的成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "权益法下，初始投资成本大于应享有的被投资单位可辨认净资产公允价值份额，体现为商誉，不调整成本；若小于，其差额计入营业外收入并调整成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483416", "t": 3, "q": "采用公允价值模式计量的投资性房地产转为成本模式时，按照会计政策变更处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据会计准则规定，已采用公允价值模式计量的投资性房地产，不得从公允价值模式转为成本模式。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483417", "t": 3, "q": "在借款费用资本化期间内，为购建或者生产符合资本化条件的资产占用了一般借款的，该一般借款的利息均应予以资本化。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "占用一般借款时，并非其利息都能资本化，要按累计资产支出超过专门借款部分的资产支出加权平均数乘以所占用一般借款的资本化率来计算资本化金额。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483418", "t": 3, "q": "按照《企业会计准则第18号——所得税》的规定，企业利润表的所得税费用等于当期应纳税所得额乘以所得税税率。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业利润表的所得税费用包括当期所得税和递延所得税，并非仅等于当期应纳税所得额乘以所得税税率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483419", "t": 3, "q": "根据规定，行政单位的固定资产不计提折旧，但事业单位的固定资产应计提折旧。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483420", "t": 3, "q": "现金盘点报告表由盘点人签章后即可生效。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现金盘点报告表需由盘点人和出纳人员共同签章才能生效，仅盘点人签章不行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483421", "t": 3, "q": "金融资产在初始确认时分为交易性金融资产、持有至到期投资、贷款和应收款项及可供出售金融资产。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据金融资产的分类规定，企业应当结合自身业务特点和风险管理要求，将取得的金融资产在初始确认时分为四类，即交易性金融资产、持有至到期投资、贷款和应收款项及可供出售金融资产。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483422", "t": 3, "q": "采用计划成本分配法分配辅助生产费用，辅助生产的实际成本=辅助生产归集的费用＋分配转入数－分配转出数。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "采用计划成本分配法，辅助生产的实际成本=辅助生产归集的费用＋分配转入数。并不减去分配转出数，所以本题说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483423", "t": 3, "q": "辞退工作一般应当在一年内实施完毕，但因付款程序等原因使部分款项推迟至一年后支付的，视为符合应付职工薪酬的确认条件。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "辞退工作通常应在一年内完成，即便部分款项因付款程序等推迟到一年后支付，仍满足应付职工薪酬确认条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483424", "t": 3, "q": "对资产负债表日后事项中的调整事项，涉及损益的事项，通过\"以前年度损益调整\"科目核算，然后将\"以前年度损益调整\"的余额转入\"本年利润\"科目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产负债表日后调整事项涉及损益的，通过“以前年度损益调整”核算，最终应将其余额转入“利润分配——未分配利润”，而非“本年利润”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528592775483425", "t": 3, "q": "短期应收款项的预计未来现金流量与其现值相差很小的，在确定相关减值损失时，可不对其预计未来现金流量进行折现。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "短期应收款项预计未来现金流量与现值相差小，折现意义不大，所以确定减值损失时可不折现。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 会计学（2）", "n": "基础练习题【含解析】 / 第2章 会计学（2）", "qs": [{"id": "2034528597556989952", "t": 1, "q": "下列关于品种法的说法，错误的是？", "a": ["成本计算期与产品生产周期一致", "若有在产品，需在完工产品和在产品之间分配成本", "一般适用于大量大批单步骤生产", "月末一般不存在在产品", "", ""], "r": "A", "e": "品种法成本计算期与会计报告期一致，而非与产品生产周期一致。大量大批单步骤生产月末一般不存在在产品，若有在产品要分配成本，适用于大量大批单步骤生产。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184256", "t": 1, "q": "某企业于2008年6月1日以银行存款取得M公司10％的股份，作为长期股权投资核算。M公司当年实现净利润1200000元（假定利润均衡实现），2009年5月20日宣告分配上年现金股利500000元，该企业当年应确认的投资收益为（　）元。", "a": ["50000", "42000", "72000", "6000", "", ""], "r": "A", "e": "成本法下，被投资单位宣告分配现金股利时，投资企业按应享有的份额确认投资收益。本题中企业占股10%，M公司宣告分配上年现金股利500000元，所以投资收益=500000×10% = 50000元。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184257", "t": 1, "q": "企业以银行存款偿还债务，表现为（　）。", "a": ["一项资产增加，另一项负债增加", "一项负债增加，另一项负债减少", "一项资产增加，另一项资产减少", "一项资产减少，另一项负债减少", "", ""], "r": "D", "e": "企业用银行存款偿还债务，银行存款是资产，债务是负债。偿还债务会使银行存款（资产）减少，同时债务（负债）也减少。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184258", "t": 1, "q": "现金流量表中，“收到的税费返还”属于？", "a": ["筹资活动产生的现金流量", "经营活动产生的现金流量", "不涉及现金流量的项目", "投资活动产生的现金流量", "", ""], "r": "B", "e": "“收到的税费返还”与企业日常经营中的税费缴纳及退回相关，属于经营活动范畴。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184259", "t": 1, "q": "甲、乙两家公司同属丙公司的子公司。甲公司于20×8年3月1日以发行股票方式自乙公司的股东处取得乙公司60％的股份。甲公司发行3000万股普通股股票，该股票每股面值为1元。乙公司在20×8年3月1日所有者权益为4000万，甲公司在20×8年3月1日资本公积为360万元，盈余公积为200万元，未分配利润为400万元。甲公司该项长期股权投资的初始投资成本为（　）万元。", "a": ["3000", "960", "3640", "2400", "", ""], "r": "D", "e": "同一控制下企业合并，长期股权投资初始投资成本按被合并方所有者权益账面价值份额确定。本题乙公司所有者权益为4000万，甲取得60%股份，初始投资成本 = 4000×60% = 2400万元。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184260", "t": 1, "q": "常见的三种账务处理程序中会计报表是根据（　）资料编制的。", "a": ["日记账和总分类账", "日记账、总账和明细账", "明细账和总分类账", "日记账和明细分类账", "", ""], "r": "C", "e": "会计报表主要依据总分类账和明细分类账的数据来编制，日记账一般不直接用于编制会计报表。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184261", "t": 1, "q": "下列不属于会计档案的是（　）。", "a": ["辅助账簿", "固定资产卡片账", "银行存款余额调节表", "企业财务计划", "", ""], "r": "D", "e": "会计档案是会计核算活动中形成的记录，辅助账簿、固定资产卡片账是会计账簿，银行存款余额调节表是会计核算相关资料，都属于会计档案。企业财务计划是企业经营规划，不属于会计核算形成的档案。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184262", "t": 1, "q": "在借贷记账法下，所有者权益类账户的期末余额计算公式是？", "a": ["期末余额=期初借方余额+本期借方发生额-本期贷方发生额", "期末余额=期初借方余额+本期贷方发生额-本期借方发生额", "期末余额=期初贷方余额+本期借方发生额-本期贷方发生额", "期末余额=期初贷方余额+本期贷方发生额-本期借方发生额", "", ""], "r": "D", "e": "所有者权益类账户贷方登记增加，借方登记减少，余额一般在贷方。所以期末余额是期初贷方余额加上本期贷方增加额，减去本期借方减少额。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184263", "t": 1, "q": "以固定资产对外投资，按合同协议确定的价值，借记\"对外投资\"科目，贷记的会计科目是（　）。", "a": ["\"事业基金——投资基金\"科目", "\"固定基金\"科目", "\"固定资产\"科目", "\"事业基金——一般基金\"", "", ""], "r": "A", "e": "以固定资产对外投资，按合同协议确定价值借记“对外投资”，同时要增加投资基金，贷记“事业基金——投资基金”。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184264", "t": 1, "q": "某公司的投资性房地产采用公允价值计量模式。2008年6月23日，该公司将一项固定资产转换为投资性房地产。该固定资产的账面余额为300万元，已提折旧60万元，已经计提的减值准备为15万元。该投资性房地产的公允价值为245万元。转换日公允价值与账面价值的差额是（　）万元。", "a": ["资本公积20", "公允价值变动损益20", "资本公积5", "公允价值变动损益5", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184265", "t": 1, "q": "事业单位发生的下列交易或事项中，不会引起专用基金发生增减变动的是（　）。", "a": ["计提医疗基金", "计提统筹退休金", "计提固定资产的修购基金", "支付处置固定资产的清理费用", "", ""], "r": "B", "e": "专用基金包括职工福利基金、医疗基金、修购基金等。计提医疗基金和固定资产修购基金会使专用基金增加，支付处置固定资产清理费用会使专用基金（修购基金）减少，而计提统筹退休金不属于专用基金核算范畴。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184266", "t": 1, "q": "敖东公司涉及一起诉讼案件。根据类似的经验以及公司所聘请律师的意见判断，敖东公司在该起诉讼中胜诉的可能性有35％，败诉的可能性有65％。如果败诉，将要赔偿10000万元，另需承担诉讼费80万元。在这种情况下，敖东公司应确认的负债金额应为（　）万元。", "a": ["0", "10080", "10000", "80", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184267", "t": 1, "q": "2008年12月底，A公司购入一项不需安装的管理用固定资产，入账价值为40万元，预计净残值为2万元，预计使用寿命为10年，采用双倍余额递减法计提折旧。2010年末，该项固定资产出现减值迹象，经减值测试，预计未来现金流量的现值为10万元，公允价值减处置费用后的净额为11万元，则2010年末该项固定资产应计提的减值准备为（　）万元。", "a": ["21", "14.6", "13", "15.6", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184268", "t": 1, "q": "下列各项专用基金中，按规定从结余中提取的是（　）。", "a": ["住房基金", "医疗基金", "修购基金", "职工福利基金", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184269", "t": 1, "q": "事业单位债券投资取得的利息收入，应计入（　）。", "a": ["事业基金科目", "其他收入科目", "营业收入科目", "事业收入科目", "", ""], "r": "B", "e": "事业单位债券投资利息收入属于除财政补助收入、事业收入、上级补助收入等以外的其他收入，应计入其他收入科目。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184270", "t": 1, "q": "甲企业2007年5月份购入了一批原材料，会计人员在7月份才入账，该事项违背的会计信息质量要求是（　）要求。", "a": ["及时性", "明晰性", "客观性", "相关性", "", ""], "r": "A", "e": "及时性要求企业对于已经发生的交易或事项，应当及时进行确认、计量和报告，不得提前或延后。本题中5月购入原材料7月才入账，违背了及时性要求。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184271", "t": 1, "q": "下列哪项不符合借贷记账法的记账规则（　）。", "a": ["资产负债同时增加", "资产负债同时减少", "资产资本同时减少", "两项资产同时增加", "", ""], "r": "D", "e": "借贷记账法规则是有借必有贷，借贷必相等，资产=负债+所有者权益。资产增加记借方，减少记贷方；负债和所有者权益增加记贷方，减少记借方。D选项两项资产同时增加，只涉及借方增加，不符合有借必有贷的规则。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184272", "t": 1, "q": "在资产负债表中，下列属于非流动资产项目的是（　）。", "a": ["其他应收款", "可供出售金融资产", "预付账款", "交易性金融资产", "", ""], "r": "B", "e": "非流动资产是指流动资产以外的资产。选项A其他应收款、C预付账款、D交易性金融资产都属于流动资产。而可供出售金融资产属于非流动资产。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184273", "t": 1, "q": "资产负债表中\"存货\"项目，不包括下列哪项内容？", "a": ["在途物资", "工程物资", "委托代销商品", "发出商品", "", ""], "r": "B", "e": "存货是企业日常活动中持有以备出售的产成品或商品、处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料和物料等。工程物资是用于建造固定资产等工程的物资，不属于存货范畴。而在途物资、委托代销商品、发出商品都属于存货。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184274", "t": 1, "q": "现金流量表中，“支付给职工以及为职工支付的现金”不包括？", "a": ["支付给管理人员的奖金", "为职工缴纳的社会保险费", "支付给在建工程人员的工资", "支付给生产工人的工资", "", ""], "r": "C", "e": "“支付给职工以及为职工支付的现金”核算的是经营活动中与职工相关的现金支出，在建工程人员工资应计入“购建固定资产、无形资产和其他长期资产支付的现金”项目。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184275", "t": 1, "q": "关于交易性金融资产的计量，下列说法中正确的是（　）。", "a": ["应当按取得该金融资产的公允价值作为初始确认金额，相关交易费用发生时计入投资收益", "资产负债表日，交易性金融资产的公允价值变动计入当期所有者权益", "取得交易性金融资产时，要按取得的公允价值和相关交易费用之和作为初始确认金额", "处置该金融资产时，其公允价值与初始入账金额之间的差额应确认为投资收益，不调整公允价值变动损益", "", ""], "r": "A", "e": "解读：交易性金融资产初始按公允价值计量，交易费用入投资收益；资产负债表日，公允价值变动计入当期损益（公允价值变动损益）；处置时，公允价值与初始入账差额计投资收益，同时要将原计入公允价值变动损益的金额转出。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184276", "t": 1, "q": "分批法下，成本计算期的确定通常与（　）一致。", "a": ["生产费用发生期", "日历年度", "产品的生产周期", "会计报告期", "", ""], "r": "C", "e": "分批法是按照产品批别计算产品成本，产品成本计算是不定期的，成本计算期与产品生产周期一致。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184277", "t": 1, "q": "下列各事项中，使负债增加的是（　）。", "a": ["发行股票", "分期付款方式购入固定资产", "支付现金股利", "用银行存款购买公司债券", "", ""], "r": "B", "e": "A发行股票增加所有者权益；B分期付款购固定资产，产生长期应付款，负债增加；C支付现金股利使负债减少；D买债券是资产内部变化。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184278", "t": 1, "q": "采用分步法核算产品成本时，某步骤狭义在产品是指？", "a": ["本步骤正在加工的在产品和本步骤已完工但尚未最终完工的半成品", "本步骤正在加工的在产品", "本步骤正在加工的在产品、本步骤已完工但尚未最终完工的半成品以及后续步骤正在加工的在产品", "本步骤已完工但尚未最终完工的半成品", "", ""], "r": "B", "e": "狭义在产品仅指本步骤正在加工的在产品。A选项包含已完工半成品不符合狭义定义；C选项包含后续步骤在产品也不符；D选项只说已完工半成品也不对。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184279", "t": 1, "q": "《企业会计准则》规定，企业应当按照交易或者事项的经济实质进行会计确认、计量和报告，不应仅以交易或者事项的法律形式为依据，体现的会计信息质量要求是？", "a": ["及时性", "重要性", "实质重于形式", "谨慎性", "", ""], "r": "C", "e": "题干强调按经济实质而非法律形式进行会计处理，这正是实质重于形式要求的体现。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184280", "t": 1, "q": "《企业会计准则》要求企业提供的会计信息应当与投资者等财务报告使用者的经济决策需要相关，体现的会计信息质量要求是？", "a": ["重要性", "可靠性", "相关性", "谨慎性", "", ""], "r": "C", "e": "题干强调会计信息要与投资者等经济决策需要相关，这符合相关性的定义。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184281", "t": 1, "q": "分步法中，逐步结转分步法的特点是（　）", "a": ["不需要计算各步骤半成品成本", "只计算最终产品成本", "各步骤半成品成本不随实物的转移而结转", "各步骤半成品成本随实物的转移而结转", "", ""], "r": "D", "e": "逐步结转分步法要计算各步骤半成品成本，半成品成本随实物转移而结转。选项A，它需要计算各步骤半成品成本，A错误；选项B，它不仅算最终产品成本还计算半成品成本，B错误；选项C，各步骤半成品成本随实物转移而结转，C错误；选项D正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528597561184282", "t": 1, "q": "利润表中，\"税金及附加\"项目不包括的税费是？", "a": ["消费税", "城市维护建设税", "教育费附加", "增值税", "", ""], "r": "D", "e": "增值税是价外税，不通过“税金及附加”核算。消费税、城市维护建设税、教育费附加都在“税金及附加”项目核算。答案：D",
