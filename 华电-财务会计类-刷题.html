务条件", "以上三种方式的组合", "", ""], "r": "ABCD", "e": "债务重组准则规定，债务重组方式有以资产清偿债务、将债务转为资本、修改其他债务条件，也存在这三种方式的组合情况。ABCD选项均涵盖了债务重组的方式。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290581", "t": 2, "q": "在资本化期间内，下列有关借款费用会计处理的表述中，正确的有（　）。", "a": ["为购建固定资产取得的外币专门借款本金发生的汇兑差额，应予以资本化", "在资本化期间内，每一会计期间的利息资本化金额，不应当超过当期相关借款实际发生的利息金额", "为购建固定资产向商业银行借入专门借款发生的辅助费用，应予以资本化", "为购建固定资产取得的外币专门借款利息发生的汇兑差额，全部计入当期损益", "", ""], "r": "ABC", "e": "外币专门借款本金及利息的汇兑差额，在资本化期间应资本化，A对D错；利息资本化金额不能超当期相关借款实际利息，B对；专门借款辅助费用在资本化期间应资本化，C对。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290582", "t": 2, "q": "企业在恶性通货膨胀经济中外币财务报表的折算，叙述正确的是（　）。", "a": ["非货币性项目中，如存货等，都需要进行重述", "在对资产负债表项目进行重述时，应收账款等货币性项目不需要对其进行重述", "在对利润表项目进行重述时，所有项目金额都要以一般物价指数变动进行重述", "固定资产、无形资产等非货币性项目应自购置日起以一般物价指数变动予以重述", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290583", "t": 2, "q": "采用分步法核算产品成本时，逐步结转分步法的优点有？", "a": ["便于进行各生产步骤的成本管理", "成本结转工作量较小", "能直接提供按原始成本项目反映的产品成本资料", "能提供各个生产步骤的半成品成本资料", "", ""], "r": "AD", "e": "逐步结转分步法能提供各生产步骤半成品成本资料，便于各生产步骤成本管理。但成本结转工作量大，平行结转分步法能直接提供按原始成本项目反映的产品成本资料。所以优点选AD。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290584", "t": 2, "q": "下列各项中，应计入当期损益的事项有（　）。", "a": ["持有至到期债券投资发生的减值损失", "可供出售债务工具在资产负债表日的公允价值大于账面价值的差额", "交易性金融资产在资产负债表日的公允价值小于账面价值的差额", "交易性金融资产在持有期间获得的债券利息", "", ""], "r": "ACD", "e": "A项减值损失影响当期损益；B项差额计入其他综合收益，不影响当期损益；C项差额计入公允价值变动损益，影响当期损益；D项利息计入投资收益，影响当期损益。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290585", "t": 2, "q": "下列各项中，属于会计政策项目的有（　）。", "a": ["长期股权投资的核算方法", "存货的计价方法", "坏账损失的核算方法", "收入的确认", "", ""], "r": "ABCD", "e": "会计政策是企业在会计确认、计量和报告中所采用的原则、基础和会计处理方法。ABCD四个选项分别涉及长期股权投资、存货、坏账损失、收入方面的核算和确认方法，都属于会计政策项目。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290586", "t": 2, "q": "下列关于债务重组中混合重组的说法中，正确的有（　）。", "a": ["债权人应当依次以收到的现金、接受非现金资产的账面价、债权人享有股份的账面价冲减重组债权的账面余额，再按照债权人修改其他债务条件的规定进行会计处理", "债权人应当依次以收到的现金、接受非现金资产的公允价、债权人享有股份的公允价冲减重组债务的账面余额，再按照债权人修改其他债务条件的规定进行处理", "债务人应当依次以支付的现金、转让非现金资产的账面价值、债权人享有股份的账面价值冲减重组债务的账面价值，再按照修改其他债务条件的相关规定进行处理", "债务人应当依次以支付的现金、转让非现金资产的公允价、债权人享有股份的公允价冲减重组债务的账面价值，再按照修改其他债务条件的相关规定进行处理", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290587", "t": 2, "q": "下列各事项中，会产生暂时性差异的有（　）。", "a": ["对固定资产计提减值准备", "企业违反合同协议而支付违约金", "企业的非公益性对外捐赠支出", "期末交易性金融资产的公允价值发生变动", "", ""], "r": "AD", "e": "A项，固定资产计提减值准备，账面价值小于计税基础，产生可抵扣暂时性差异；D项，交易性金融资产公允价值变动会使账面价值与计税基础不同，产生暂时性差异。B项违约金按税法规定可税前扣除，不产生差异；C项非公益性对外捐赠支出税法不允许扣除，是永久性差异。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290588", "t": 2, "q": "下列项目中，属于所有者权益来源的有（　）。", "a": ["留存收益", "直接计入所有者权益的利得和损失", "所有者投入的资本", "发行债券筹集的资金", "", ""], "r": "ABC", "e": "所有者权益来源包括所有者投入资本、直接计入所有者权益的利得和损失、留存收益。发行债券筹集资金属于负债。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290589", "t": 2, "q": "下列属于会计核算方法的是（　）。", "a": ["设置会计科目和账户", "填制和审核会计凭证", "复式记账", "会计预测与决策", "", ""], "r": "ABC", "e": "会计核算方法包括设置会计科目和账户、复式记账、填制和审核会计凭证等。而会计预测与决策属于会计的其他职能活动，并非核算方法。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290590", "t": 2, "q": "下列关于分批法的表述，正确的有？", "a": ["一般不需要在完工产品和在产品之间分配费用", "适用于单件、小批生产的企业", "成本计算期与产品生产周期一致", "需要按产品生产步骤归集生产费用", "", ""], "r": "ABC", "e": "分批法适用于单件、小批生产，成本计算期与产品生产周期一致，一般不存在完工产品和在产品间分配费用问题。而按产品生产步骤归集生产费用是分步法特点。所以ABC正确。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290591", "t": 2, "q": "对于资产负债表日后事项的非调整事项，应在财务报表附注中披露的有（　）。", "a": ["非调整事项的内容", "非调整事项的性质", "非调整事项可能对经营成果的影响", "非调整事项可能对财务状况的影响", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290592", "t": 2, "q": "利润表中\"营业收入\"项目，应根据下列哪些科目的发生额分析填列？", "a": ["其他业务收入", "营业外收入", "主营业务收入", "投资收益", "", ""], "r": "AC", "e": "“营业收入”包括主营业务收入和其他业务收入。营业外收入不属于营业收入范畴，投资收益也不构成营业收入。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290593", "t": 2, "q": "下列关于成本核算方法的表述，正确的有？", "a": ["分步法下各步骤的生产费用需要在完工产品和在产品之间进行分配", "分步法分为逐步结转分步法和平行结转分步法", "品种法适用于大量大批单步骤生产，也可用于管理上不要求分步计算成本的大量大批多步骤生产", "分批法下产品成本计算是不定期的", "", ""], "r": "ABCD", "e": "A选项，分步法由于生产步骤多，各步骤生产费用需在完工产品和在产品间分配；B选项，分步法就是分为逐步结转和平行结转两种；C选项，品种法适用于大量大批单步骤生产或管理上不要求分步计算成本的大量大批多步骤生产；D选项，分批法按批别计算成本，成本计算期与生产周期一致，是不定期的。ABCD表述都正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290594", "t": 2, "q": "债务人应当披露与债务重组有关的信息包括（　）。", "a": ["或有应收金额", "确认的债务重组利得总额", "债务重组方式", "将债务转为资本所导致的股本（实收资本）增加额", "", ""], "r": "BCD", "e": "债务人应披露债务重组方式、确认的债务重组利得总额、将债务转为资本所导致的股本（实收资本）增加额等信息，而或有应收金额是债权人应披露的。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290595", "t": 2, "q": "采用分步法核算产品成本时，平行结转分步法的特点有？", "a": ["成本计算对象是最终完工产品", "半成品成本不随实物转移而结转", "能直接提供按原始成本项目反映的产品成本资料", "各步骤不计算半成品成本", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290596", "t": 2, "q": "以下不属于包装物的有（　）。", "a": ["生产过程中领用的盛装物品", "包装材料", "生产车间周转使用的盛装物品", "用于加工包装物的加工材料", "", ""], "r": "BD", "e": "包装物是为包装本企业商品而储备的各种包装容器，包装材料和用于加工包装物的加工材料不属于包装物范畴。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290597", "t": 2, "q": "业务分部或地区分部的大部分收入是对外交易收入时，下列各项中可以据以将分部确定为报告分部的有（　）。", "a": ["该分部的分部利润占所有盈利分部利润合计额的10％或者以上", "该分部的分部资产占所有分部资产合计额的10％或者以上", "该分部的分部利润（亏损）的绝对额，占所有盈利分部利润合计额或者所有亏损分部亏损合计额的绝对额两者中较大者的10%或者以上", "该分部的分部收入占所有分部收入合计的10％或者以上", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290598", "t": 2, "q": "对于或有事项相关的义务要确认为一项负债，应同时符合的条件有（　）。", "a": ["该义务的金额能够可靠计量", "该项义务为企业承担的潜在义务", "该义务的履行很可能导致经济利益流出企业", "该项义务为企业承担的现时义务", "", ""], "r": "ACD", "e": "或有事项确认为负债需同时满足：是企业承担的现时义务、履行该义务很可能导致经济利益流出企业、该义务的金额能够可靠计量。潜在义务不能确认为负债。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290599", "t": 2, "q": "采用平行结转分步法计算产品成本的优点包括？", "a": ["便于进行各步骤在产品的实物管理", "不必进行成本还原，简化核算工作", "能直接提供按原始成本项目反映的产品成本资料", "各步骤可同时计算产品成本，加快成本计算速度", "", ""], "r": "BCD", "e": "平行结转分步法不计算各步骤半成品成本，各步骤可同时计算产品成本加快速度，能直接提供原始成本项目反映的产品成本资料，且无需成本还原简化核算。而它不利于各步骤在产品实物管理。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290600", "t": 2, "q": "下列各项中，属于流动负债的有（　）", "a": ["专项应付款", "应付债券", "应付职工薪酬", "应付股利", "", ""], "r": "CD", "e": "流动负债是指在一年或超过一年的一个营业周期内偿还的债务。专项应付款和应付债券一般偿还期限较长，属于非流动负债。应付职工薪酬和应付股利通常在短期内需支付，属于流动负债。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290601", "t": 2, "q": "下列说法可以表明换入资产或换出资产的公允价值能够可靠计量的有（　）。", "a": ["换入资产或换出资产存在活跃市场", "不存在同类或类似资产的可比市场交易，应当采用估值技术确定其公允价值，采用估值技术确定的公允价值估计数的变动区间很小，视为公允价值能够可靠计量", "换入资产或换出资产不存在活跃市场、但同类或类似资产存在活跃市场", "不存在同类或类似资产的可比市场交易，在公允价值估计数变动区间内，各种用于确定公允价值估计数的概率能够合理确定，视为公允价值能够可靠计量", "", ""], "r": "ABCD", "e": "换入或换出资产公允价值可靠计量有几种情况，存在活跃市场可直接获取公允价值；同类或类似资产有活跃市场可参照；即便无活跃市场，用估值技术且估计数变动区间小，或能确定公允价值估计数概率，也视为能可靠计量。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290602", "t": 2, "q": "下列关于账簿与账户的关系表述，正确的有（　）", "a": ["账户只是一个外在形式，账簿才是它的真实内容", "账簿存在于账户之中，没有账户账簿就无法存在", "账簿只是一个外在形式，账户才是它的真实内容", "账户存在于账簿之中，没有账簿，账户就无法存在", "", ""], "r": "CD", "e": "账簿是由若干账页组成的一个整体，账户是在账簿中按规定的会计科目开设的户头，用来反映某一个会计科目所要核算的内容。所以账簿只是外在形式，账户才是真实内容，且账户存在于账簿之中，没账簿账户无法存在。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290603", "t": 2, "q": "汇总记账凭证账务处理程序与科目汇总表账务处理程序的共同点有（　）", "a": ["均适用于经济业务较多的单位", "总账可以比较详细地反映经济业务的发生情况", "减少登记总账的工作量", "有利于查账", "", ""], "r": "AC", "e": "汇总记账凭证和科目汇总表账务处理程序都能减少登记总账工作量，且适用于经济业务较多单位。B选项，科目汇总表账务处理程序总账不详细反映业务；D选项，科目汇总表账务处理程序不利于查账。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290604", "t": 2, "q": "资产负债表中的应付账款项目应根据（　）填列。", "a": ["预收账款所属明细账借方余额合计", "应付账款所属明细账贷方余额合计", "预付账款所属明细账贷方余额合计", "应付账款总账余额", "", ""], "r": "BC", "e": "资产负债表中应付账款项目应根据应付账款和预付账款所属明细账贷方余额合计填列。B选项应付账款所属明细账贷方余额和C选项预付账款所属明细账贷方余额符合要求。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610148290605", "t": 2, "q": "下列各项说法，正确的有（　）。", "a": ["对于企业内部产生的品牌、报刊名等，企业应该确认为无形资产", "存储在光盘中的计算机软件，具有实物形态，因此不属于无形资产", "企业内部产生的品牌，因其成本无法可靠计量，因此不作为无形资产确认", "企业自创的商誉不应确认为无形资产", "", ""], "r": "CD", "e": "企业内部产生的品牌、报刊名等成本无法可靠计量，不能确认为无形资产，A错误，C正确；计算机软件虽有实物形态，但软件核心价值不在实物载体，属于无形资产，B错误；自创商誉不满足无形资产可辨认性等条件，不应确认为无形资产，D正确。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528610152484864", "t": 2, "q": "2009年4月8日，恒通公司因无力偿还东大公司的1000万元货款进行债务重组。按债务重组协议规定，恒通公司用普通股400万股偿还债务。假定普通股每股面值1元;该股份的公允价值为900万元（不考虑相关税费）。东大公司对应收账款计提了80万的坏账准备。恒通公司于8月5日办妥了增资批准手续，换发了新的营业执照，则下列表述正确的有（　）。", "a": ["东大公司可以不转计提的坏账准备80万元", "债务重组日为2009年4月8日", "东大公司因放弃债权而享有股份的面值总额为400万元", "恒通公司计入资本公积——股本溢价为500万元", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528610152484865", "t": 2, "q": "下列关于会计要素计量属性的说法，正确的有？", "a": ["公允价值是市场参与者在计量日发生的有序交易中，出售资产所能收到或转移负债所需支付的价格", "历史成本是指取得或制造某项财产物资时所实际支付的现金或其他等价物金额", "重置成本是指按照当前市场条件，重新取得同样一项资产所需支付的现金或其他等价物金额", "可变现净值是指在正常生产经营过程中，以预计售价减去进一步加工成本和销售所必需的预计税金、费用后的净值", "", ""], "r": "ABCD", "e": "ABCD四个选项的表述均符合会计要素计量属性的定义。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752640", "t": 3, "q": "任何企业都应该在应交税费科目下设置应交增值税明细科目，再在该明细科目下设置其他专栏予以核算有关业务。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752641", "t": 3, "q": "资产负债表日后，企业利润分配方案中拟分配的以及经审议批准宣告发放的股票股利属于非调整事项;但是批准宣告分配的现金股利属于调整事项，应当以此调整财务报表的相关项目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752642", "t": 3, "q": "资产负债表日，企业所持有的三个月内到期的交易性金融资产均属于现金等价物。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现金等价物需同时满足期限短、流动性强、易于转换为已知金额现金、价值变动风险很小等条件，仅“三个月内到期”不充分，交易性金融资产价值可能变动大，不一定符合价值变动风险小这一条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752643", "t": 3, "q": "根据我国《企业财务会计报告条例》的规定，年度和半年度财务会计报告应当包括会计报表的附注。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "《企业财务会计报告条例》明确规定，年度、半年度财务会计报告包含会计报表、会计报表附注和财务情况说明书。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752644", "t": 3, "q": "企业不论在成本模式下，还是在公允价值模式下，投资性房地产取得的租金收入，均确认为公允价值变动损益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "投资性房地产取得的租金收入应确认为其他业务收入，而非公允价值变动损益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752645", "t": 3, "q": "计入当期损益的所得税费用或收益包括企业合并和直接在所有者权益中确认的交易或事项产生的所得税影响。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "计入当期损益的所得税费用或收益不包括企业合并和直接在所有者权益中确认的交易或事项产生的所得税影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752646", "t": 3, "q": "按现值进行会计计量，是指资产按照预计从其持续使用中所产生的未来净现金流入量的折现金额计量;负债按照预计期限内需要偿还和未来净现金流出量折现金额计量。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "现值计量就是资产按预计持续使用及最终处置产生的未来净现金流入量折现金额计量，负债按预计期限内偿还的未来净现金流出量折现金额计量。本题表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752647", "t": 3, "q": "按公允价值进行会计计量，是指资产和负债按照在公平交易中，熟悉情况的交易双方自愿进行资产交换或者债务清偿的金额计量。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这描述符合公允价值的会计计量定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752648", "t": 3, "q": "各单位保存的会计档案原则上不得借出，但如有特殊需要，经本单位负责人批准，可以借出。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752649", "t": 3, "q": "在销售商品和提供劳务的混合业务中，销售商品部分和提供劳务部分应该全部作为销售商品进行会计处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "若能区分且单独计量，应分别处理；不能区分或不能单独计量，才全部按销售商品处理。题干说法太绝对。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752650", "t": 3, "q": "借款存在折价或者溢价的，应当按照实际利率法确定每一会计期间应摊销的折价或者溢价金额，调整每期利息金额。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据会计准则，借款存在折价或溢价时，确实要按实际利率法确定每期应摊销的折价或溢价金额，进而调整每期利息金额。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752651", "t": 3, "q": "编制会计报表是企业账务处理程序的组织部分。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "账务处理程序包括从原始凭证到记账凭证，再到登记账簿，最后编制会计报表等一系列步骤，编制会计报表是其重要组成部分。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752652", "t": 3, "q": "待执行合同不管是否亏损，都有可能确认预计负债。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752653", "t": 3, "q": "某公司董事会决定关闭一个事业部。如果有关决定尚未传达到受影响的各方，也未采取任何措施实施该项决定，表明该公司没有承担重组义务，但应确认预计负债。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "未传达到受影响各方且未采取实施措施，公司未承担重组义务，不满足预计负债确认条件，不应确认预计负债。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752654", "t": 3, "q": "会计期末，如果交易性金融资产的成本高于市价，应该计提交易性金融资产跌价准备。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "交易性金融资产按公允价值计量，不计提减值准备，期末按公允价值调整账面价值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752655", "t": 3, "q": "如果某一材料是专门用于生产某种产品的，如果材料发生减值，但是生产的产品没有发生减值，材料就按自身的可变现净值和账面价值相比较确认减值额。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "专门用于生产产品的材料，判断减值时应先看产品是否减值，若产品未减值，材料也未减值，无需按自身可变现净值和账面价值比较确认减值额。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752656", "t": 3, "q": "长期股权投资期末应按历史成本计量，不计提减值准备。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "长期股权投资期末要按规定进行减值测试，若发生减值需计提减值准备，并非按历史成本计量且不计提减值准备。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752657", "t": 3, "q": "企业财产清查中，发现账外设备一台，报经批准后，应冲减\"营业外支出\"。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业盘盈的固定资产应作为前期差错处理，报经批准后通过“以前年度损益调整”核算，而非冲减“营业外支出”。", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752658", "t": 3, "q": "自用房地产或存货转换为采用公允价值模式计量的投资性房地产时，投资性房地产应当按照转换当日的公允价值计量，公允价值与原账面价值的差额计入当期损益（其他业务收入）。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自用房地产或存货转换为采用公允价值模式计量的投资性房地产时，公允价值大于原账面价值的差额计入其他综合收益，而非其他业务收入；公允价值小于原账面价值的差额计入公允价值变动损益。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752659", "t": 3, "q": "结账是指年度终了时，为了编制会计报表而进行的一项将账簿记录结算清楚的账务工作。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "结账不只是年度终了时为编报表进行的，在月末、季末也会结账。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752660", "t": 3, "q": "企业折算境外经营的资产负债表时，所有者权益项目中除\"未分配利润\"项目外，其他项目采用发生时的即期汇率折算。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业折算境外经营资产负债表时，所有者权益项目除“未分配利润”外，其他项目确实是采用发生时的即期汇率折算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752661", "t": 3, "q": "企业将一项长期股权投资转为可供出售金融资产核算时，应当作为会计政策变更处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752662", "t": 3, "q": "现金流量表中的经营活动，是指企业投资活动和筹资活动以外的交易和事项。销售商品或提供劳务、购买固定资产、支付短期借款利息等产生的现金流量均包括在经营活动产生的现金流量之中。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "购买固定资产属投资活动，支付短期借款利息属筹资活动，并非都在经营活动现金流量中。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752663", "t": 3, "q": "企业取得的持有至到期投资，应按该投资的公允价值加上支付的交易费用，借记\"持有至到期投资——成本\"科目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“持有至到期投资——成本”科目应按债券面值入账，而不是按公允价值加交易费用入账。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752664", "t": 3, "q": "一个会计主体一定是一个法律主体。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "法律主体一定是会计主体，但会计主体不一定是法律主体，比如企业的分公司是会计主体却不是法律主体。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752665", "t": 3, "q": "债务重组中，债务人不会涉及到资本公积科目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "债务重组中，若债务人以债转股方式进行债务重组，可能会涉及资本公积科目。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752666", "t": 3, "q": "长期股权投资采用成本法核算的，应按被投资单位宣告发放的现金股利或利润中属于本企业的部分，借记\"应收股利\"科目，贷记\"投资收益\"科目; 属于被投资单位在本企业取得投资前实现净利润的分配额，应该借记\"应收股利\"科目，贷记\"资本公积\"科目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "成本法下，被投资单位宣告发放现金股利，属于本企业部分，借记“应收股利”，贷记“投资收益”；但属于被投资单位在本企业取得投资前实现净利润的分配额，也是贷记“投资收益”，而非“资本公积”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752667", "t": 3, "q": "债务重组方式包括以资产清偿债务、将债务转为资本、修改其他债务条件等，但以上三种方式的组合不属于准则规范的债务重组方式。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "债务重组方式包含以资产清偿债务、将债务转为资本、修改其他债务条件，以及以上三种方式的组合。所以题干说三种方式的组合不属于准则规范的债务重组方式是错误的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752668", "t": 3, "q": "企业出售、转让、报废投资性房地产或者发生投资性房地产毁损时，应当将处置收入扣除其账面价值和相关税费后的金额计入当期损益即投资收益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业处置投资性房地产时，处置收入扣除账面价值和相关税费后的金额应计入其他业务收入或其他业务成本等，并非投资收益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752669", "t": 3, "q": "企业发生的原已确认收入的销售退回，属于本年度销售的，应直接冲减退回当月的销售收入及销售成本;如果是以前年度销售的，在资产负债表日至财务会计报告批准报出日之间发生退回的，应作为资产负债表日后事项的调整事项处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业销售退回处理原则就是本年度销售的冲减退回当月收入和成本，以前年度销售且在资产负债表日至财务会计报告批准报出日之间退回的，按资产负债表日后事项调整处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752670", "t": 3, "q": "任何企业都应该对所持有的固定资产预计其弃置费用，弃置费用即清理费用。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并非所有企业的固定资产都有弃置费用，且弃置费用与清理费用不同，弃置费用是特殊行业特定固定资产因弃置产生的预计负债，清理费用是正常清理时的支出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752671", "t": 3, "q": "会计人员对不真实、不合法的原始凭证，应予退回，要求更正、补充。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752672", "t": 3, "q": "企业通过经营租赁方式租入的办公楼再出租的也是属于投资性房地产的范围。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "投资性房地产是企业拥有或控制的，经营租赁租入的办公楼企业无所有权和控制权，其再出租不属于投资性房地产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528611280752673", "t": 3, "q": "通过提供劳务取得的存货，其成本按从事劳务提供人员的直接人工和其他直接费用以及可归属于该存货的间接费用确定。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "通过提供劳务取得存货，其成本就是由从事劳务提供人员的直接人工、其他直接费用以及可归属于该存货的间接费用构成。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 会计学（4）", "n": "基础练习题【含解析】 / 第2章 会计学（4）", "qs": [{"id": "2034528616502661120", "t": 1, "q": "对下列会计差错，正确的说法是（　）。", "a": ["本期发现的，属于前期的非重要差错（不考虑日后事项），应调整发现当期的期初留存收益和会计报表其他项目的期初数", "前期差错的性质不应在会计报表附注中披露", "本期发现的，属于前期的重要会计差错（不考虑日后事项），不调整会计报表相关项目的期初数，但应调整发现当期与前期相同的相关项目", "并不是所有会计差错均要在会计报表附注中披露", "", ""], "r": "D", "e": "A选项，前期非重要差错应调整发现当期相关项目，而非期初留存收益和报表其他项目期初数；B选项，前期差错性质需在报表附注披露；C选项，前期重要差错要调整报表相关项目期初数。D选项，不重要的会计差错可不披露，所以并不是所有会计差错均要在报表附注披露。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661121", "t": 1, "q": "在确定资产的公允价值减去处置费用后的净额时，应优先选择的方法是（　）。", "a": ["以可获取的最佳信息为基础，估计资产的公允价值减去处置费用后的净额", "根据公平交易中资产的销售协议价格减去可直接归属于该资产处置费用后的净额确定", "根据该资产的市场价格减去处置费用后的金额确定", "通过对资产的预计未来现金流量折现得到其现值", "", ""], "r": "B", "e": "确定资产公允价值减去处置费用后的净额，优先依据公平交易中资产的销售协议价格减处置费用，这是最直接明确的方式。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661122", "t": 1, "q": "下列关于利润表中\"信用减值损失\"项目填列依据的说法，正确的是？", "a": ["只包含应收票据减值准备金额", "反映企业计提的各项金融资产减值准备所形成的预期信用损失", "不包含其他应收款计提的坏账准备", "仅反映应收账款计提的坏账准备金额", "", ""], "r": "B", "e": "“信用减值损失”反映企业计提的各项金融资产减值准备所形成的预期信用损失，涵盖应收票据、应收账款、其他应收款等金融资产的减值准备。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661123", "t": 1, "q": "\"管理费用\"属于（　）。", "a": ["资产类科目", "成本类科目", "负债类科目", "损益类科目", "", ""], "r": "D", "e": "管理费用是企业日常经营活动中的耗费，会影响当期利润，属于损益类科目。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661124", "t": 1, "q": "下列项目不属于投资性房地产的是（　）。", "a": ["已出租的土地使用权", "持有并准备增值后转让的土地使用权", "已出租的建筑物", "持有并准备增值后转让的房屋建筑物", "", ""], "r": "D", "e": "投资性房地产包括已出租的土地使用权、持有并准备增值后转让的土地使用权、已出租的建筑物。房屋建筑物持有并准备增值后转让不属于投资性房地产。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661125", "t": 1, "q": "某企业2008年10月10日用一批库存商品换入一台设备，并收到对方支付的补价40万元。该批库存商品的账面价值为120万元，不含增值税的公允价值为150万元，计税价格为140万元，适用的增值税税率为17％（假定不考虑运费可抵扣的进项税）;换入设备的原账面价值为160万元，公允价值为133.8万元，该企业因该项交换影响损益的金额为（　）万元。", "a": ["140", "30", "31.2", "150", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661126", "t": 1, "q": "A公司2008年实现利润总额为1000万元，由于违法经营支付罚款50万元，由于会计采用的折旧方法与税法规定不同，当期会计比税法规定少计提折旧100万元。2008年初递延所得税负债的余额为66万元（假定均为固定资产产生）;年末固定资产账面价值为5000万元，其计税基础为4700万元。除上述差异外没有其他纳税调整事项和差异。A公司采用资产负债表债务法核算所得税，2008年以前适用的所得税税率为33％，从2008年1月1日起适用的所得税税率改为25％。A公司2008年的净利润为（　）万元。", "a": ["670", "686.5", "719.5", "753.5", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661127", "t": 1, "q": "由于（　）的存在，才产生了本期与其他期间的差异，从而出现了权责发生制和收付实现制。", "a": ["货币计量", "持续经营", "会计分期", "会计主体", "", ""], "r": "C", "e": "会计分期将企业持续经营的生产经营活动划分为一个个连续的、长短相同的期间，由此产生本期与非本期的区别，进而有了权责发生制和收付实现制。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661128", "t": 1, "q": "下列关于会计要素计量属性中可变现净值的表述，正确的是？", "a": ["在正常生产经营过程中，以预计售价减去进一步加工成本和销售所必需的预计税金、费用后的净值", "取得或制造某项财产物资时所实际支付的现金或者现金等价物", "按照当前市场条件，重新取得同样一项资产所需支付的现金或现金等价物金额", "市场参与者在计量日发生的有序交易中，出售一项资产所能收到或者转移一项负债所需支付的价格", "", ""], "r": "A", "e": "可变现净值是正常经营中预计售价减去进一步加工成本和销售必需的预计税金、费用后的净值。B是历史成本，C是重置成本，D是公允价值。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661129", "t": 1, "q": "经批准，A企业用盈余公积10000元转增资本，正确的会计分录是（　）。", "a": ["借:盈余公积10000<br />贷:资本公积10000", "借:实收资本10000<br />贷:盈余公积10000", "借:盈余公积10000<br />贷:实收资本10000", "借:资本公积10000<br />贷:盈余公积10000", "", ""], "r": "C", "e": "盈余公积转增资本，会使盈余公积减少，记借方；实收资本增加，记贷方。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661130", "t": 1, "q": "在借贷记账法下，成本类账户的结构与下列哪类账户相似？", "a": ["损益类", "所有者权益类", "负债类", "资产类", "", ""], "r": "D", "e": "成本类账户借方登记增加、贷方登记减少，与资产类账户结构相似。而损益类包含收入和费用等多种情况，结构与成本类不同；所有者权益类和负债类账户都是贷方登记增加，与成本类账户结构差异明显。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661131", "t": 1, "q": "根据《企业会计准则》，企业发生的下列支出中，属于资本性支出的是？", "a": ["购买生产设备支出", "支付职工工资", "固定资产日常修理支出", "购买办公用品支出", "", ""], "r": "A", "e": "资本性支出是为了取得长期资产或提高其性能而发生的支出，受益期长。A项购买生产设备支出形成企业的固定资产，受益期长，属于资本性支出；B支付职工工资、C固定资产日常修理支出、D购买办公用品支出，这些支出的受益期短，属于收益性支出。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661132", "t": 1, "q": "下列各项业务中，可以确认收入的是（　）。", "a": ["企业销售的商品在质量、品种、规格等方面不符合合同或协议的要求，又未根据正常的保证条款予以弥补", "销售合同和协议中规定了买方由于特殊原因有权退货的条款，且企业不能确定退货的可能性", "视同买断方式销售商品，双方协议明确规定，无论受托方是否卖出、是否获利，均与委托方无关", "企业尚未完成售出商品的安装或检验工作，且安装或检验工作是销售合同和协议的重要组成部分", "", ""], "r": "C", "e": "收入确认需满足相关条件。A选项商品不符要求未弥补，不满足确认条件；B选项不能确定退货可能性，不能确认收入；D选项安装或检验是重要部分且未完成，不能确认收入。C选项视同买断且无论受托方情况如何都与委托方无关，可确认收入。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661133", "t": 1, "q": "关于会计科目，下列说法中不正确的是（　）。", "a": ["会计科目是设置账户的依据", "会计科目的设置应该符合国家统一会计准则的规定", "账户是会计科目的具体运用", "企业不可以自行设置会计科目", "", ""], "r": "D", "e": "企业可在遵循国家统一会计准则基础上，根据自身实际情况自行设置会计科目。A选项，会计科目是账户名称，是设置账户依据；B选项，会计科目设置要符合国家统一准则；C选项，账户是对会计科目的具体运用。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661134", "t": 1, "q": "企业发生的下列支出中，应计入管理费用的是？", "a": ["车间管理人员工资", "销售产品的运输费", "生产车间设备维修费", "生产工人工资", "", ""], "r": "C", "e": "A项车间管理人员工资计入制造费用；B项销售产品运输费计入销售费用；D项生产工人工资计入生产成本；C项生产车间设备维修费按规定计入管理费用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661135", "t": 1, "q": "甲企业2009年1月1日外购一幢建筑物。该建筑物的售价（含税）为400万元，以银行存款支付。该建筑物用于出租，年租金为40万元。每年年初收取租金。该企业对此项投资性房地产采用公允价值模式进行后续计量。2009年12月31日，该建筑物的公允价值为430万元。不考虑相关的税费，2009年该项交易影响当期损益的金额为（　）万元。", "a": ["70", "30", "50", "40", "", ""], "r": "A", "e": "本题可根据投资性房地产采用公允价值模式进行后续计量时，影响当期损益的因素来计算。### 步骤一：分析租金收入对当期损益的影响企业将建筑物用于出租，年租金为40万元且每年年初收取租金，租金收入属于其他业务收入，会增加当期损益40万元。### 步骤二：分析公允价值变动对当期损益的影响企业采用公允价值模式进行后续计量，2009年12月31日该建筑物的公允价值为430万元，而初始成本为400万元，公允价值上升了430 - 400 = 30万元。公允价值变动损益会影响当期损益，公允价值上升会增加当期损益30万元。 ### 步骤三：计算影响当期损益的总金额将租金收入和公允价值变动损益对当期损益的影响相加，可得40 + 30 = 70（万元）。综上，2009年该项交易影响当期损益的金额为70万元，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661136", "t": 1, "q": "企业采用月末一次加权平均法计算发出存货成本时，计算公式中不涉及的项目是？", "a": ["月初结存存货的数量", "本月购入存货的实际成本", "月初结存存货的实际成本", "本月发出存货的数量", "", ""], "r": "D", "e": "月末一次加权平均法公式为：存货单位成本 =（月初结存存货成本 + 本月购入存货成本）÷（月初结存存货数量 + 本月购入存货数量），发出存货成本 = 发出存货数量×存货单位成本。可见计算加权平均单位成本时不直接涉及本月发出存货数量。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661137", "t": 1, "q": "资产负债表中，\"一年内到期的非流动负债\"项目应根据（　）分析填列。", "a": ["应付账款和预付账款科目余额", "非流动负债科目所属明细科目余额", "非流动负债总账科目余额", "流动负债科目所属明细科目余额", "", ""], "r": "B", "e": "“一年内到期的非流动负债”需从非流动负债里找出将在一年内到期的部分，应根据非流动负债科目所属明细科目余额分析填列。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661138", "t": 1, "q": "下列说法中不正确的是（　）。", "a": ["无合同标的资产的，亏损合同相关义务满足预计负债确认条件时，应当确认为预计负债", "待执行合同均属于或有事项", "待执行合同变成亏损合同时，有合同标的资产的，应当先对标的资产进行减值测试并按规定确认减值损失，如预计亏损超过该减值损失，应将超过部分确认为预计负债", "待执行合同变成亏损合同的，该亏损合同产生的义务满足预计负债确认条件的，应当确认为预计负债", "", ""], "r": "B", "e": "待执行合同只有变成亏损合同时才属于或有事项，并非所有待执行合同均属于或有事项，B选项错误。A、C、D选项说法均正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661139", "t": 1, "q": "《企业会计准则》规定，企业对交易或者事项进行会计确认、计量和报告应当保持应有的谨慎，不应高估资产或者收益、低估负债或者费用，这体现的会计信息质量要求是？", "a": ["重要性", "实质重于形式", "可理解性", "谨慎性", "", ""], "r": "D", "e": "题干描述的“保持应有的谨慎，不应高估资产或收益、低估负债或费用”正是谨慎性的体现。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661140", "t": 1, "q": "下列各项中，属于会计基本职能的是（　）。", "a": ["会计核算与会计预测", "会计核算和会计监督", "会计核算与会计决策", "会计核算与会计分析", "", ""], "r": "B", "e": "会计基本职能就是核算和监督，这是会计最核心、最基础的功能。其他如预测、决策、分析等属于拓展职能。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661141", "t": 1, "q": "《企业会计准则》中要求企业应当按照交易或者事项的经济实质进行会计确认、计量和报告，不应仅以交易或者事项的法律形式为依据，该要求体现的会计信息质量原则是？", "a": ["谨慎性", "及时性", "重要性", "实质重于形式", "", ""], "r": "D", "e": "题目强调按经济实质而非法律形式进行会计处理，这符合实质重于形式原则的内涵。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661142", "t": 1, "q": "甲公司通过定向增发普通股，自乙公司原股东处取得乙公司30％的股权。该项交易中，甲公司定向增发股份的数量为2000万股（每股面值1元，公允价值为2元），发行股份过程中向证券承销机构支付佣金及手续费共计100万元。除发行股份外，甲公司还承担了乙公司原股东对第三方的债务1000万元（未来现金流量现值）。取得投资时，乙公司股东大会已通过利润分配方案，甲公司可取得240万元。甲公司对乙公司长期股权投资的初始投资成本为（　）。", "a": ["4760万元", "4900万元", "4100万元", "3900万元", "", ""], "r": "A", "e": "初始投资成本为增发股份公允价值加上承担债务金额再减去可取得的利润分配。增发股份公允价值 = 2000×2 = 4000万元，承担债务1000万元，可取得利润分配240万元，所以初始投资成本 = 4000 + 1000 - 240 = 4760万元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661143", "t": 1, "q": "（　）一般不需要采用订本式账簿。", "a": ["总分类账", "现金日记账", "银行存款日记账", "明细分类账", "", ""], "r": "D", "e": "订本式账簿适用于重要、具有统驭性的账簿。总分类账、现金和银行存款日记账都很重要且需保证记录的完整性和严肃性，用订本式账簿。而明细分类账内容多且灵活，一般不用订本式账簿。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661144", "t": 1, "q": "资产负债表中，\"无形资产\"项目应根据\"无形资产\"科目的期末余额减去（　）后的净额填列。", "a": ["坏账准备和累计摊销", "累计摊销", "累计折旧和无形资产减值准备", "累计摊销和无形资产减值准备", "", ""], "r": "D", "e": "无形资产在填列资产负债表时，要考虑其累计摊销和减值准备，用无形资产科目期末余额减去累计摊销和无形资产减值准备后的净额填列。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661145", "t": 1, "q": "下列会计核算的原则和方法中，不属于企业会计政策的是（　）。", "a": ["低值易耗品采用一次摊销法核算", "存货期末计价采用成本和可变现净值孰低法核算", "实质重于形式要求", "投资性房地产采用成本模式进行后续计量", "", ""], "r": "C", "e": "会计政策是企业在会计确认、计量和报告中所采用的原则、基础和会计处理方法。选项C实质重于形式是会计信息质量要求，并非会计政策。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661146", "t": 1, "q": "事业单位开展各项专业活动而发生的下列各项支出中，计入事业支出的是（　）。", "a": ["上缴上级支出", "销售产品负担的税金", "拨出的经费", "提取的社会保障费", "", ""], "r": "D", "e": "事业支出是事业单位开展专业业务活动及其辅助活动发生的基本支出和项目支出。上缴上级支出是上缴给上级单位的支出；销售产品负担的税金应计入经营支出；拨出经费是拨给所属单位的经费。而提取的社会保障费是开展专业活动相关支出，应计入事业支出。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661147", "t": 1, "q": "某上市公司2007年度的财务会计报告于2008年4月30日批准报出，2008年12月31日，该公司发现了2006年度的一项非重大差错。该公司正确的做法是（　）。", "a": ["调整2007年度会计报表的年末数和本年数", "调整2007年度会计报表的年初数和上年数", "调整2008年度会计报表的年末数和本年数", "调整2008年度会计报表的年初数和上年数", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661148", "t": 1, "q": "企业采用月末一次加权平均法计算发出存货成本，本月甲材料期初结存100千克，成本为600元;本月购入甲材料200千克，总成本1500元;本月发出甲材料150千克。则本月发出甲材料的成本为？", "a": ["825元", "1050元", "900元", "750元", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661149", "t": 1, "q": "下列关于分批法的成本计算期特点，说法正确的是？", "a": ["不定期计算成本，与产品生产周期不一致", "定期计算成本，与会计报告期一致", "定期计算成本，与产品生产周期不一致", "不定期计算成本，与产品生产周期一致", "", ""], "r": "D", "e": "分批法是按照产品批别计算产品成本，产品完工时才计算成本，所以成本计算是不定期的，且与产品生产周期一致。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661150", "t": 1, "q": "某事业单位当年实现事业结余600万元，经营结余900万元。假设该单位经营结余应按25％的税率缴纳所得税，按当年事业结余和经营结余的10％提取福利基金。则结转到\"事业基金——一般基金\"科目的未分配结余为多少万元？", "a": ["1,125", "1,350", "1,203", "1,305", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661151", "t": 1, "q": "企业对确实无法支付的应付账款，应转入（　）科目。", "a": ["营业外收入", "管理费用", "其他业务收入", "资本公积", "", ""], "r": "A", "e": "企业无法支付的应付账款，相当于意外获得收益，应计入营业外收入。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661152", "t": 1, "q": "成本还原的对象是（　）。", "a": ["最后步骤的产成品成本", "各步骤所耗上一步骤半成品的综合成本", "各步骤半成品成本", "产成品成本", "", ""], "r": "B", "e": "成本还原是将各步骤所耗上一步骤半成品的综合成本逐步分解，还原成直接材料、直接人工和制造费用等原始成本项目。所以成本还原的对象是各步骤所耗上一步骤半成品的综合成本。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661153", "t": 1, "q": "根据《企业会计准则》，企业发生的下列支出中，属于资本性支出的是？", "a": ["支付短期借款利息", "购买专利技术支出", "支付职工差旅费", "固定资产大修理支出", "", ""], "r": "B", "e": "资本性支出是为了取得长期资产而发生的支出，其效益会在多个会计期间体现。选项A支付短期借款利息和选项C支付职工差旅费属于收益性支出，计入当期损益；选项D固定资产大修理支出一般也在发生时计入当期费用。而选项B购买专利技术支出，专利技术是长期资产，该支出属于资本性支出。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661154", "t": 1, "q": "下列不属于或有事项的是（　）。", "a": ["债务担保", "未来可能发生的交通事故", "未决仲裁", "重组业务", "", ""], "r": "B", "e": "或有事项是过去的交易或事项形成的，其结果须由某些未来事项的发生或不发生才能决定的不确定事项。未来可能发生的交通事故，不是过去的交易或事项形成的。而债务担保、未决仲裁、重组业务都符合或有事项定义。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661155", "t": 1, "q": "利润表中\"营业收入\"项目应根据（　）科目的本期发生额计算填列。", "a": ["其他业务收入和营业外收入", "主营业务收入和其他业务收入", "主营业务收入、其他业务收入和营业外收入", "主营业务收入和营业外收入", "", ""], "r": "B", "e": "营业收入包括主营业务收入和其他业务收入，营业外收入不属于营业收入范畴。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661156", "t": 1, "q": "企业最基本的会计等式是（　）。", "a": ["资产=负债+所有者权益", "收入-费用=利润", "资产=负债+所有者权益+（收入-费用）", "资产=负债+（所有者权益+利润）", "", ""], "r": "A", "e": "资产=负债+所有者权益是会计恒等式，体现了企业资产的来源和归属关系，是最基本会计等式。其他选项是在此基础上衍生。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661157", "t": 1, "q": "下列关于会计要素计量属性的表述，错误的是？", "a": ["可变现净值是指在正常生产经营过程中，以预计售价减去进一步加工成本和销售所必需的预计税金、费用后的净值。", "公允价值是指市场参与者在计量日发生的有序交易中，出售一项资产所能收到或者转移一项负债所需支付的价格，考虑交易双方的关系。", "重置成本是指按照当前市场条件，重新取得同样一项资产所需支付的现金或现金等价物金额。", "历史成本是取得或制造某项财产物资时所实际支付的现金或者现金等价物。", "", ""], "r": "B", "e": "公允价值计量时不考虑交易双方的关系，B表述错误，A、C、D对各计量属性表述正确。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661158", "t": 1, "q": "A公司因一桩诉讼案件，根据专家预测，基本确定可从乙公司获得赔偿10万元，至当期期末A公司未确认相关的负债。在这种情况下，A公司在资产负债表中应确认的资产为（　）万元。", "a": ["5", "10", "20", "0", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661159", "t": 1, "q": "2007年12月1日，A公司委托B公司销售商品600件，商品已发出，每件成本为600元，合同约定B公司应按每件1000元对外销售，A公司按照售价的10％向B公司支付手续费。2007年12月31日，B公司对外实际销售500件，开出增值税专用发票注明的价款500000元，增值税额为85000元，款项已收到，B公司向A公司开具代销清单，则当期A公司需要确认的收入金额为（　）元。", "a": ["600000", "500000", "450000", "360000", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661160", "t": 1, "q": "2008年8月1日，甲上市公司购入乙公司的债券，准备持有至到期。购入时支付的购买价款为105万元（其中包含已到付息期但尚未领取的利息4万元），另外用银行存款支付交易费用3万元，债券的面值为100万元。则甲公司购入时计入\"持有至到期投资\"科目的金额为（　）万元。", "a": ["108", "101", "104", "105", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661161", "t": 1, "q": "（　）是会计的首要职能。", "a": ["会计考核", "会计决策", "会计核算", "会计控制", "", ""], "r": "C", "e": "会计核算贯穿于经济活动的全过程，是会计最基本的职能，也就是首要职能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661162", "t": 1, "q": "下列会计账簿中，可以跨年度连续使用的是（　）。", "a": ["日记账", "费用明细帐", "固定资产卡片账", "总账", "", ""], "r": "C", "e": "一般情况下，会计账簿需每年更换，但固定资产卡片账因记录固定资产相关信息，其使用期限长，可跨年度连续使用。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661163", "t": 1, "q": "资产负债表日至财务报告批准报出日之间发生的调整事项在进行调整处理时，下列不能调整报表项目的是（　）。", "a": ["涉及现金收支的事项", "涉及所有者权益的事项", "涉及利润的相关事项", "涉及损益调整的事项", "", ""], "r": "A", "e": "资产负债表日后调整事项调整时，现金流量表正表不调整，因为现金收支是按收付实现制反映的，涉及现金收支的事项不能调整报表项目。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661164", "t": 1, "q": "资产负债表中，\"长期股权投资\"项目应根据\"长期股权投资\"科目的期末余额减去（　）后的净额填列。", "a": ["累计折旧", "资产减值损失", "长期股权投资减值准备", "坏账准备", "", ""], "r": "C", "e": "资产负债表中“长期股权投资”项目要按净额填列，需减去其减值准备。累计折旧用于固定资产，资产减值损失是损益类科目，坏账准备用于应收款项。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661165", "t": 1, "q": "资产负债表日，企业根据金融工具确认和计量准则确定持有至到期投资发生减值的，按应减记的金额，借记\"资产减值损失\"科目，贷记（　）。", "a": ["持有至到期投资——成本", "公允价值变动损益", "投资收益", "持有至到期投资减值准备", "", ""], "r": "D", "e": "企业确认持有至到期投资减值，应贷记“持有至到期投资减值准备”，这是规定的账务处理。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661166", "t": 1, "q": "资产负债表日后的非调整事项是指（　）。", "a": ["资产负债表日后新发生的事项", "资产负债表日或以前已经存在，但资产负债表日后发生变化的事项", "资产负债表日或以前已经存在，但对编制理解财务报告没有影响的事项", "资产负债表日后新发生的事项，且对理解和分析财务报告有重大影响的事项", "", ""], "r": "D", "e": "资产负债表日后非调整事项是资产负债表日后新发生的，且对理解和分析财务报告有重大影响的事项。A没强调重大影响；B是调整事项特点；C不符合非调整事项定义。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661167", "t": 1, "q": "下列不属于资产类科目的是（　）。", "a": ["预收账款", "商誉", "存出保证金", "累计摊销", "", ""], "r": "A", "e": "资产类科目是反映资产增减变动的会计科目。预收账款是负债类科目，是企业预先收取的款项，未来需提供商品或服务来偿还。商誉、存出保证金、累计摊销都属于资产类。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661168", "t": 1, "q": "下列关于分步法的表述，正确的是？", "a": ["成本计算期与产品生产周期一致", "适用于单件小批生产企业", "需要按步骤结转半成品成本", "月末不存在在产品成本分配问题", "", ""], "r": "C", "e": "分步法适用于大量大批多步骤生产企业，成本计算期与会计报告期一致，与产品生产周期不一致，月末需在完工产品和在产品间分配成本。逐步结转分步法需要按步骤结转半成品成本。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661169", "t": 1, "q": "企业发生的下列经济业务中，会引起资产和所有者权益同时变动的有？", "a": ["宣告分配现金股利", "将资本公积转增资本", "接受投资者投入固定资产", "用盈余公积转增资本", "", ""], "r": "C", "e": "A选项宣告分配现金股利是负债增加、所有者权益减少；B和D选项都是所有者权益内部的一增一减；C选项接受投资者投入固定资产，资产增加，同时所有者权益增加。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661170", "t": 1, "q": "股东（投资者）作为财务会计报告的使用者之一，其主要关注（　）。", "a": ["职工福利的好坏", "企业财务状况好坏、经营业绩的大小以及现金的流动情况", "投资的内在风险和投资报酬", "企业的兴衰及其发展情况", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661171", "t": 1, "q": "企业因对外担保事项可能产生的负债，在担保涉及诉讼的情况下，下列说法中正确的是（　）。", "a": ["虽然法院尚未判决，但是企业估计败诉的可能性大于胜诉的可能性，且损失金额能够合理估计的，则应确认相应的预计负债", "虽然法院尚未判决，但企业估计败诉的可能性为50％，则应确认相应的预计负债", "虽然企业一审已被判决败诉，但正在上诉，不应确认为预计负债", "因为法院尚未判决，企业没有必要确认为预计负债", "", ""], "r": "A", "e": "预计负债确认需同时满足三个条件，当法院未判决但败诉可能性大且损失金额能合理估计时应确认预计负债。B选项可能性50%不满足“很可能”；C选项一审败诉上诉，若满足确认条件应确认；D选项若满足条件需确认。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661172", "t": 1, "q": "下列计价方法中，不符合历史成本计量基础的是（　）。", "a": ["固定资产计提折旧", "发出存货计价所使用的先进先出法", "发出存货计价所使用的移动平均法", "可供出售金融资产期末采用公允价值计价", "", ""], "r": "D", "e": "历史成本计量强调以取得时的实际成本入账。选项A、B、C均基于历史成本对资产进行核算。而可供出售金融资产期末采用公允价值计价，是按照当前市场公允价值计量，并非基于取得时的历史成本，不符合历史成本计量基础。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661173", "t": 1, "q": "所设置的会计科目应符合单位自身特点，满足单位实际需要，这一点符合（　）原则。", "a": ["实用性", "合法性", "谨慎性", "相关性", "", ""], "r": "A", "e": "会计科目设置的实用性原则要求所设科目符合单位自身特点、满足实际需要。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661174", "t": 1, "q": "下列关于非货币性资产交换中，不正确的是（　）。", "a": ["企业持有的应收账款、应收票据以及持有至到期投资，均属于企业的货币性资产", "在同时换入多项资产，具有商业实质且换入资产的公允价值能够可靠计量的情况下，应当按照换入各项资产的公允价值占换入资产公允价值总额的比例，对换入资产的成本总额进行分配，确认各项换入资产的成本", "在具有商业实质且其公允价值可靠计量的非货币性资产交换中，换出资产的公允价值和账面价值之间的差额计入当期损益", "在不具有商业实质的情况下，交换双方不确认损益", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661175", "t": 1, "q": "在产品按定额成本计价法，每月生产费用脱离定额的差异（　）。", "a": ["当月在完工与月末在产品之间分配", "全部计入当月完工产品成本", "全部计入管理费用", "全部计入当月在产品成本", "", ""], "r": "B", "e": "在产品按定额成本计价法下，月末在产品成本按定额成本计算，每月生产费用脱离定额的差异全部由完工产品负担，即全部计入当月完工产品成本。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661176", "t": 1, "q": "产品成本计算的分步法的主要特点是（　）。", "a": ["计算和结转产品的各步成本", "计算完工产品的成本", "计算半成品成本", "计算产成品成本", "", ""], "r": "A", "e": "分步法是按照产品的生产步骤归集生产费用，计算各步骤半成品和最后产成品成本，核心就是计算和结转产品各步成本。B只说计算完工产品成本，未突出分步特点；C计算半成品成本不全面；D计算产成品成本也未体现分步特色。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661177", "t": 1, "q": "在会计要素计量属性中，市场参与者在计量日发生的有序交易中，出售一项资产所能收到或者转移一项负债所需支付的价格是？", "a": ["历史成本", "公允价值", "可变现净值", "重置成本", "", ""], "r": "B", "e": "公允价值是市场参与者在计量日发生的有序交易中，出售一项资产所能收到或者转移一项负债所需支付的价格。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661178", "t": 1, "q": "甲公司出资1000万元，取得了乙公司80％的控股权，假如购买股权时乙公司的净资产账面价值为1500万元，甲、乙公司合并前后不受同一方控制。则甲公司确认的长期股权投资初始投资成本为（　）万元。", "a": ["800", "1200", "1000", "1500", "", ""], "r": "C", "e": "本题中甲乙公司合并前后不受同一方控制，属于非同一控制下的企业合并，长期股权投资的初始投资成本应按照购买方付出的资产、发生或承担的负债、发行的权益性证券的公允价值确定。甲公司出资1000万元取得乙公司80％的控股权，所以甲公司确认的长期股权投资初始投资成本为1000万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661179", "t": 1, "q": "在进行实物财产清查时，对下列哪项财产不用发函询证法。", "a": ["委托外单位加工的物资", "在途物资", "现金", "委托外单位保管的物资", "", ""], "r": "C", "e": "发函询证法适用于往来款项及委托加工、保管物资等的清查。现金清查采用实地盘点法，不能用发函询证法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661180", "t": 1, "q": "下列事项属于资产负债表日后调整事项的是（　）。", "a": ["资产负债表日后发生的自然灾害导致资产发生重大损失", "资产负债表日后的巨额举债", "日后已确定将要支付赔偿额小于该赔偿在资产负债表日的估计金额", "在资产负债表日后外汇汇率发生较大变动", "", ""], "r": "C", "e": "资产负债表日后调整事项是指对资产负债表日已经存在的情况提供了新的或进一步证据的事项。C选项中，日后已确定将要支付赔偿额小于该赔偿在资产负债表日的估计金额，说明资产负债表日的估计存在不准确，需要对原估计进行调整，属于调整事项。而A、B、D选项都是资产负债表日后才发生的新事项，不影响资产负债表日已存在的状况，属于非调整事项。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661181", "t": 1, "q": "可修复废品返修前发生的生产费用（　）。", "a": ["与修复费用一起转入基本生产成本科目借方", "不是废品损失，不必计算其生产成本", "应借记废品损失科目", "应从基本生产成本科目贷方转出", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661182", "t": 1, "q": "行政单位的资产负债表应于每月末、季末、年末编制，其年报按照（　）会计等式编排。", "a": ["资产=负债＋净资产", "资产＋支出=负债＋收入", "收入-支出=结余", "资产＋支出=负债＋净资产＋收入", "", ""], "r": "A", "e": "行政单位资产负债表年报遵循基本会计等式，即资产=负债＋净资产。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661183", "t": 1, "q": "下列关于企业现金流量表中\"销售商品、提供劳务收到的现金\"项目的计算，正确的是？", "a": ["本期销售商品、提供劳务收到的现金=本期营业收入-本期应收账款减少额-本期预收账款减少额", "本期销售商品、提供劳务收到的现金=本期营业收入-本期应收账款增加额+本期预收账款增加额", "本期销售商品、提供劳务收到的现金=本期营业收入+本期应收账款减少额+本期预收账款减少额", "本期销售商品、提供劳务收到的现金=本期营业收入+本期应收账款增加额-本期预收账款增加额", "", ""], "r": "B", "e": "应收账款增加意味着有收入未实际收到现金，应从营业收入中减去；预收账款增加表示提前收到了现金，应加到营业收入中。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661184", "t": 1, "q": "复式记账法，是对每一笔经济业务事项都要在（　）相互联系的账户中进行登记，系统地反应资金运动变化结果的一种记账方法。", "a": ["三个", "两个", "两个或两个以上", "一个", "", ""], "r": "C", "e": "复式记账法要求对每笔经济业务在两个或两个以上相互联系账户登记，这样能全面反映经济业务来龙去脉和资金运动变化。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661185", "t": 1, "q": "利润表中\"研发费用\"项目反映的内容不包括？", "a": ["与研发活动直接相关的技术图书资料费", "资本化的研发支出", "计入管理费用的自行开发无形资产摊销", "费用化的研发支出", "", ""], "r": "B", "e": "利润表“研发费用”项目反映费用化研发支出及计入管理费用的自行开发无形资产摊销，资本化研发支出计入资产，不在此项目反映。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661186", "t": 1, "q": "采用分批法进行成本核算时，对于间接计入费用的分配，通常采用的分配标准不包括？", "a": ["生产工人工资", "产品生产批次数量", "机器工时", "生产工时", "", ""], "r": "B", "e": "分批法间接计入费用分配常按与生产相关的量来分配，如生产工人工资、机器工时、生产工时等。产品生产批次数量与间接费用的发生没有直接关联，不能作为分配间接计入费用的标准。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661187", "t": 1, "q": "\"其他业务成本\"科目按其所归属的会计要素不同，属于（　）类科目。", "a": ["损益", "资产", "所有者权益", "成本", "", ""], "r": "A", "e": "“其他业务成本”用于核算企业确认的除主营业务活动以外的其他经营活动所发生的支出，会影响企业当期损益，属于损益类科目。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661188", "t": 1, "q": "企业大量简单生产一种产品，所耗原料和加工工艺相同，但是质量不同，有一级、二级、三级、四级4个等级。会计应采用的成本计算方法是（　）。", "a": ["分步法", "品种法", "分类法", "分批法", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661189", "t": 1, "q": "采用品种法计算产品成本时，制造费用的分配方法通常不包括？", "a": ["生产工人工资比例法", "机器工时比例法", "生产工时比例法", "约当产量比例法", "", ""], "r": "D", "e": "约当产量比例法是将生产费用在完工产品和在产品之间分配的方法，不是制造费用分配方法，而生产工人工资比例法、机器工时比例法、生产工时比例法可用于制造费用分配。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661190", "t": 1, "q": "采用品种法核算产品成本时，制造费用的分配方法通常不包括？", "a": ["约当产量比例法", "机器工时比例法", "生产工时比例法", "生产工人工资比例法", "", ""], "r": "A", "e": "约当产量比例法是将生产费用在完工产品和在产品之间分配的方法，并非制造费用的分配方法。而机器工时比例法、生产工时比例法、生产工人工资比例法可用于制造费用分配。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661191", "t": 1, "q": "下列关于非货币性资产交换商业实质的说法不正确的是（　）。", "a": ["换入资产与换出资产的预计未来现金流量现值不同，且其差额与换入资产和换出资产的公允价值相比是重大的，则该项资产交换具有商业实质", "关联方关系的存在可能导致非货币性资产交换不具有商业实质", "换入资产与换出资产的未来现金流量的风险、金额相同，时间不同，则说明该项资产交换具有商业实质", "换入资产与换出资产的未来现金流量的风险、金额和时间上均相同，则说明该项资产交换具有商业实质", "", ""], "r": "D", "e": "若换入与换出资产未来现金流量在风险、金额和时间上均相同，意味着交换对企业经济状况无实质影响，不具有商业实质。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661192", "t": 1, "q": "某企业计提2009年3月份车间管理人员工资，应计入（　）账户。", "a": ["制造费用", "财务费用", "管理费用", "生产成本", "", ""], "r": "A", "e": "车间管理人员工资不能直接归属于产品成本，先计入制造费用进行归集。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661193", "t": 1, "q": "利润表中\"营业利润\"项目的计算，不涉及的是？", "a": ["营业外收入", "资产减值损失", "财务费用", "其他收益", "", ""], "r": "A", "e": "营业利润计算涉及营业收入、营业成本、税金及附加、销售费用、管理费用、研发费用、财务费用、资产减值损失、信用减值损失、其他收益、投资收益等。营业外收入不参与营业利润计算，是利润总额计算涉及项目。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661194", "t": 1, "q": "负债类账户的余额反映的情况是（　）。", "a": ["负债的增减变动", "资产的结存", "负债的结存情况", "负债的形成和偿付", "", ""], "r": "C", "e": "负债类账户余额体现的是负债在某一时点的实际结存金额。A选项增减变动是发生额体现的；B选项资产结存是资产类账户反映的；D选项负债形成和偿付是负债类账户核算内容，不是余额反映的。所以答案选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661195", "t": 1, "q": "在一定时期内多次记录发生地同类型经济业务的原始凭证是（　）。", "a": ["一次凭证", "汇总凭证", "通用凭证", "累计凭证", "", ""], "r": "D", "e": "累计凭证能在一定时期内多次记录同类型经济业务。一次凭证是一次完成业务记录；汇总凭证是汇总同类业务；通用凭证是统一格式的凭证。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661196", "t": 1, "q": "采用品种法计算产品成本时，如果企业生产多种产品，制造费用在各产品之间分配后，应将其计入各产品成本计算单的？", "a": ["制造费用成本项目", "直接人工成本项目", "管理费用成本项目", "直接材料成本项目", "", ""], "r": "A", "e": "制造费用分配后应计入产品成本计算单的制造费用成本项目。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661197", "t": 1, "q": "\"预付账款\"科目明细账中若有贷方余额，应将其计入资产负债表中的（　）项目。", "a": ["预收款项", "应付账款", "应收账款", "其他应收款", "", ""], "r": "B", "e": "预付账款贷方余额实质是企业的负债，应重分类计入应付账款项目。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661198", "t": 1, "q": "在借贷记账法下，“主营业务收入”账户的结构特点是？", "a": ["借方登记减少额，贷方登记增加额，期末无余额", "借方登记减少额，贷方登记增加额，期末余额在贷方", "借方登记增加额，贷方登记减少额，期末无余额", "借方登记增加额，贷方登记减少额，期末余额在借方", "", ""], "r": "A", "e": "“主营业务收入”属于收入类账户，收入增加记贷方，减少记借方，期末要将收入结转到“本年利润”，所以期末无余额。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661199", "t": 1, "q": "利润表中\"营业利润\"项目的计算，不涉及的是？", "a": ["财务费用", "其他收益", "资产减值损失", "营业外收入", "", ""], "r": "D", "e": "营业利润计算涉及营业收入、营业成本、税金及附加、销售费用、管理费用、研发费用、财务费用、其他收益、投资收益、净敞口套期收益、公允价值变动收益、资产减值损失、信用减值损失等。营业外收入不参与营业利润计算，它是利润总额的一部分。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661200", "t": 1, "q": "汇总记账凭证账务处理程序与科目汇总表账务处理程序的相同点是（　）。", "a": ["记账凭证的汇总方法相同", "简化了登记总分类账的工作量", "登记总账的依据相同", "保持了账户间的对应关系", "", ""], "r": "B", "e": "汇总记账凭证账务处理程序和科目汇总表账务处理程序都可简化登记总分类账的工作量。二者记账凭证汇总方法不同，登记总账依据也不同，且只有汇总记账凭证账务处理程序能保持账户间对应关系。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528616502661201", "t": 1, "q": "甲企业采用计划成本对原材料进行核算。2008年1月，甲企业接收某股东作为追加资本投入的原材料一批，并取得增值税专用发票，双方按现行市价将该批材料的折价款定为20,000元（不含增值税）。该批材料的计划成本为21,000元。适用的增值税税率为17％。甲企业对这一交易事项应编制的会计分录为（　）。", "a": ["借: 原材料 21,000<br />应交税费---应交增值税（进项税额）3,400<br />贷: 实收资本 23,400<br />材料成本差异 1,000", "借: 原材料 21,000<br />应交税费---应交增值税（进项税额）3,570<br />贷: 实收资本 23,570<br />资本公积 1,000", "借: 原材料 21,000<br />应交税费---应交增值税（进项税额）3,400<br />贷: 实收资本 23,400<br />资本公积 1,000", "借: 原材料 21,000<br />应交税费---应交增值税（进项税额）3,570<br />贷: 实收资本 23,570<br />材料成本差异 1,000", "", ""], "r": "A", "e": "按现行市价折价款20000元确定实收资本及进项税（20000×17% = 3400），计划成本21000元与市价20000元的差额1000元为节约差，计入材料成本差异贷方。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186560", "t": 2, "q": "下列各项中，属于借款费用的有（　）。", "a": ["借款辅助费用", "折价的摊销", "外币借款发生的汇兑差额", "借款利息", "", ""], "r": "ABCD", "e": "借款费用是企业因借入资金所付出的代价，包括借款利息、折价或溢价的摊销、辅助费用以及因外币借款而发生的汇兑差额等。ABCD选项均符合借款费用定义。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186561", "t": 2, "q": "企业现金流量表中，“支付给职工以及为职工支付的现金”项目，包括的内容有？", "a": ["为职工缴纳的社会保险费", "支付给生产工人的工资", "支付给管理人员的奖金", "支付给在建工程人员的工资", "", ""], "r": "ABC", "e": "“支付给职工以及为职工支付的现金”核算为经营活动提供服务的职工薪酬相关支出，在建工程人员工资属于投资活动，不计入该项目。ABC是为经营活动职工支付的费用。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186562", "t": 2, "q": "根据不同来源，事业单位购置固定资产时，应借记的科目有（　）。", "a": ["专用基金——一般基金", "事业支出", "专用基金——修购基金", "专款支出", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186563", "t": 2, "q": "下列说法中正确的有（　）。", "a": ["企业难以对单项资产的可收回金额进行估计的，应当以该资产所属的资产组为基础确定资产组的可收回金额", "只要是某企业的资产，则任意两个或两个以上的资产都可以组成企业的资产组", "资产组的账面价值通常不应当包括已确认负债的账面价值，但如不考虑该负债金额就无法确定资产组可收回金额的除外", "资产产生的现金流量是外币的，应当以该资产所产生的未来现金流量的结算货币为基础预计其未来现金流量，并按照该货币适用的折现率计算资产的现值", "", ""], "r": "ACD", "e": "A选项符合资产组可收回金额确定原则；B选项，资产组是具有独立现金流入的最小资产组合，不是任意资产都能组成资产组；C选项是资产组账面价值的规定；D选项是外币现金流量计算资产现值的正确做法。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186564", "t": 2, "q": "企业按权责发生制原则预提费用时，可能借记的账户有（　）。", "a": ["财务费用", "其他业务成本", "制造费用", "销售费用", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186565", "t": 2, "q": "在资产负债表\"负债及所有者权益\"方填列的项目是（　）。", "a": ["长期应付款", "预收账款", "累计折旧", "预付账款", "", ""], "r": "AB", "e": "A长期应付款是负债项目；B预收账款也是负债项目，它们都在资产负债表“负债及所有者权益”方填列。C累计折旧是固定资产的备抵科目，列在资产方；D预付账款是资产项目。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186566", "t": 2, "q": "根据\"可靠性\"要求企业会计核算应当做到（　）。", "a": ["保证企业会计信息的完整", "以实际发生的交易事项为依据", "如实反映交易事项的真实情况", "满足会计信息使用者决策的需要", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186567", "t": 2, "q": "下列有关融资租入固定资产折旧年限的说法中不正确的是（　）。", "a": ["融资租赁方式租入的固定资产发生的装修费用，符合资本化条件的，应当在两次装修期间、剩余租赁期两者中较短的期间内计提折旧", "融资租赁方式租入的固定资产发生的装修费用，符合资本化条件的，应当在两次装修期间、剩余租赁期与固定资产剩余使用寿命三者中较短的期间内计提折旧", "融资租赁方式租入的固定资产发生的装修费用，符合资本化条件的，应当在两次装修期间、固定资产剩余使用寿命两者中较短的期间内计提折旧", "融资租入的固定资产不属于企业的资产，所以不用计提折旧", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186568", "t": 2, "q": "企业编制资产负债表时，“长期借款”项目的填列需考虑的因素有？", "a": ["“长期借款”总账科目余额", "长期借款的实际利率", "长期借款的利息调整余额", "“长期借款”科目所属明细科目中一年内到期的金额", "", ""], "r": "ACD", "e": "“长期借款”项目应根据“长期借款”总账科目余额扣除“长期借款”科目所属明细科目中将于一年内到期且企业不能自主地将清偿义务展期的金额后的金额填列，同时要考虑“利息调整”余额影响账面价值。而实际利率与报表项目填列无关。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186569", "t": 2, "q": "根据《企业会计准则》，下列属于会计信息质量要求中谨慎性原则的应用有？", "a": ["对存货计提存货跌价准备", "对固定资产采用加速折旧法计提折旧", "对应收账款计提坏账准备", "高估收入，低估费用", "", ""], "r": "ABC", "e": "谨慎性原则要求企业不应高估资产或收益、低估负债或费用。A对存货计提跌价准备、B对固定资产加速折旧、C对应收账款计提坏账准备，都是合理预计可能发生的损失，符合谨慎性。而D高估收入、低估费用违背了谨慎性。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186570", "t": 2, "q": "国库单一账户体系由下列哪些银行账户构成？", "a": ["国库单一账户", "预算单位零余额账户", "预算外资金专户", "财政部门零余额账户", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186571", "t": 2, "q": "下列说法中，正确的有（　）。", "a": ["在履行合同义务过程中，如发生的成本预期将超过与合同相关的未来流入的经济利益，待执行合同即变成了亏损合同，该亏损合同产生的义务满足预计负债确认条件的，应当确认为预计负债", "待执行合同变成亏损合同时，企业拥有合同标的资产的，应当先对标的资产进行减值测试并按规定确认减值损失，如预计亏损超过该减值损失，应将超过部分确认为预计负债", "企业与其他方签订的尚未履行或部分履行了同等义务的合同，如商品买卖合同、劳务合同、租赁合同等，不属于《企业会计准则第13号——或有事项》规范的内容", "待执行合同变成亏损合同的，应当作为或有事项", "", ""], "r": "ABD", "e": "A选项，成本超未来流入利益，亏损合同满足条件应确认预计负债，正确；B选项，有标的资产先测减值，超减值部分确认为预计负债，正确；C选项，这些合同若变成亏损合同属于或有事项规范内容，该项错误；D选项，待执行合同变亏损合同应作为或有事项，正确。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186572", "t": 2, "q": "下列关于确认预计负债的表述，正确的有（　）。", "a": ["企业承担的重组义务满足或有事项相关的义务确认为预计负债条件的，应当确认预计负债", "企业应当就未来经营亏损，合理估计后确认为预计负债", "企业应当按照与重组有关的直接支出确定预计负债金额", "待执行合同变成亏损合同的，该亏损合同产生的义务满足预计负债确认条件的，应当确认为预计负债", "", ""], "r": "ACD", "e": "未来经营亏损不符合预计负债确认条件，不能确认为预计负债，B错误；A企业承担重组义务满足条件应确认预计负债；C按与重组有关直接支出确定预计负债金额；D待执行合同变亏损合同满足条件应确认预计负债。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186573", "t": 2, "q": "采用分批法进行成本核算时，间接计入费用的分配方法通常有？", "a": ["机器工时比例法", "生产工时比例法", "生产工人工资比例法", "约当产量比例法", "", ""], "r": "BC", "e": "分批法下间接计入费用分配常用生产工时比例法、生产工人工资比例法等。机器工时比例法一般用于制造费用分配但不是分批法间接计入费用典型分配法；约当产量比例法是用于生产费用在完工产品和在产品之间分配的方法。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186574", "t": 2, "q": "A公司2008年发生了4,000万元的广告费用，在发生时已作为销售费用计入当期损益，税法规定广告费支出不超过当年销售收入15％的部分，准予扣除;超过部分允许向以后年度结转税前扣除。2008年实现销售收入20,000万元,会计利润为10,000万元。A公司所得税税率为25％，不考虑其他纳税调整。A公司2008年末应确认（　）。", "a": ["所得税费用2,500万元", "应交所得税2,750万元", "递延所得税资产250万元", "递延所得税负债250万元", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186575", "t": 2, "q": "企业现金流量表中，“投资活动产生的现金流量”包括？", "a": ["购买股票支付的现金", "处置固定资产收回的现金", "取得投资收益收到的现金", "偿还借款支付的现金", "", ""], "r": "ABC", "e": "投资活动是指企业长期资产的购建和不包括在现金等价物范围内的投资及其处置活动。ABC选项均与投资相关，D选项偿还借款支付现金属于筹资活动产生的现金流量。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186576", "t": 2, "q": "下列有关会计科目与账户的说法中，正确的有（　）", "a": ["会计科目和账户所反映的会计对象的具体内容是相同的", "账户具有一定的格式和结构，而会计科目没有", "会计科目和账户的作用是完全相同的", "会计科目是账户的名称，也是设置账户的依据", "", ""], "r": "ABD", "e": "会计科目和账户反映内容相同，科目是账户名称和设户依据，账户有结构而科目无，二者作用有别。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186577", "t": 2, "q": "下列各项中，属于会计核算基本前提的有（　）。", "a": ["货币计量", "会计主体", "持续经营", "会计分期", "", ""], "r": "ABCD", "e": "会计核算基本前提包括会计主体、持续经营、会计分期和货币计量。ABCD这四个选项均符合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186578", "t": 2, "q": "企业现金流量表中，属于经营活动产生的现金流量有？", "a": ["购买商品、接受劳务支付的现金", "销售商品、提供劳务收到的现金", "分配股利、利润或偿付利息支付的现金", "处置固定资产收回的现金", "", ""], "r": "AB", "e": "经营活动是企业日常经营业务相关活动。A选项购买商品、接受劳务是日常经营支出；B选项销售商品、提供劳务是日常经营收入，都属于经营活动现金流量。C选项是筹资活动现金流量；D选项是投资活动现金流量。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186579", "t": 2, "q": "将或有事项确认为负债，其金额应是清偿该负债所需支出的最佳估计数。下列说法中错误的有（　）。", "a": ["如果所需支出不存在一个连续的金额范围，或有事项涉及单个项目时，最佳估计数按最可能发生金额确认", "如果所需支出不存在一个连续的金额范围，或有事项涉及多个项目时，最佳估计数按各种可能发生额的算术平均数确定", "如果所需支出存在一个连续的金额范围，则最佳估计数应按该范围的上、下限金额的平均数确定，且在该范围内各种结果发生的可能性相同", "如果所需支出存在一个连续的金额范围，则最佳估计数应按该范围的上、下限金额中的较小者确定", "", ""], "r": "BD", "e": "B选项，涉及多个项目时，最佳估计数应按各种可能结果及相关概率计算确定，不是算术平均数；D选项，存在连续金额范围且可能性相同时，按上下限平均数确定，不是取较小者。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186580", "t": 2, "q": "下列关于借贷记账法的说法，正确的有？", "a": ["资产类账户借方登记增加额，贷方登记减少额", "负债类账户贷方登记增加额，借方登记减少额", "\"借\"、\"贷\"作为记账符号表示记账方向", "收入类账户借方登记增加额，贷方登记减少额", "", ""], "r": "ABC", "e": "资产类账户借方记增加、贷方记减少；负债类账户贷方记增加、借方记减少；“借”“贷”是记账符号表示记账方向；收入类账户贷方登记增加额，借方登记减少额，D错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186581", "t": 2, "q": "盘盈、盘亏、报废、毁损的工程物资，减去过失人或保险公司等赔款后的差额，可能计入的科目是（　）。", "a": ["营业外支出", "营业外收入", "在建工程", "管理费用", "", ""], "r": "ABC", "e": "工程物资若建设期间发生盘盈、盘亏等，扣除赔款后差额计入在建工程；工程完工后发生的，计入营业外收支。所以可能计入的科目有营业外支出、营业外收入、在建工程。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186582", "t": 2, "q": "企业在编制现金流量表时，关于现金及现金等价物的说法，正确的有？", "a": ["三个月内到期的债券投资属于现金等价物", "准备随时变现的股票投资属于现金等价物", "现金包括库存现金、银行存款和其他货币资金", "现金等价物是指期限短、流动性强、易于转换为已知金额现金、价值变动风险很小的投资", "", ""], "r": "ACD", "e": "现金等价物需满足期限短、流动性强、易于转换为已知金额现金、价值变动风险很小等条件，三个月内到期的债券投资符合，A 对；股票投资价值变动风险大，不属于现金等价物，B 错；现金包含库存现金、银行存款和其他货币资金，C 对；D 表述是现金等价物的正确定义。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186583", "t": 2, "q": "企业编制利润表时，\"营业成本\"项目的填列依据包括？", "a": ["\"其他业务成本\"科目的本期发生额", "\"主营业务成本\"科目的本期发生额", "\"税金及附加\"科目的本期发生额", "\"销售费用\"科目的本期发生额", "", ""], "r": "AB", "e": "营业成本包括主营业务成本和其他业务成本。“税金及附加”和“销售费用”不属于营业成本范畴。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186584", "t": 2, "q": "下列关于会计主体的说法中，正确的有（　）。", "a": ["会计主体有可能是单一企业，也可能是几个企业组成的企业集团", "会计主体可以是独立法人，也可以是非法人", "会计主体可以是一个企业，也可以是企业中的一个特定组成部分", "会计主体一定是法律主体", "", ""], "r": "ABC", "e": "会计主体范围广泛，包括单一企业、企业集团、独立法人、非法人、企业特定组成部分等，但会计主体不一定是法律主体。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186585", "t": 2, "q": "企业现金流量表中\"销售商品、提供劳务收到的现金\"项目，可能涉及的会计科目有？", "a": ["应交税费——应交增值税（销项税额）", "主营业务收入", "预收账款", "应收账款", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186586", "t": 2, "q": "企业利润表中\"营业收入\"项目，应根据下列哪些科目的发生额分析填列？", "a": ["营业外收入", "投资收益", "主营业务收入", "其他业务收入", "", ""], "r": "CD", "e": "“营业收入”包括主营业务收入和其他业务收入。营业外收入不属于营业收入范畴；投资收益是单独项目，不构成营业收入。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186587", "t": 2, "q": "资产负债表中\"货币资金\"项目，应根据哪些账户的期末余额合计填列（　）。", "a": ["其他货币资金", "其他应收款", "现金", "银行存款", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186588", "t": 2, "q": "采用分批法计算产品成本时，产品成本计算单应登记的内容有？", "a": ["该批次产品应负担的制造费用", "该批次产品的订单号", "该批次产品完工入库的数量", "该批次产品的直接材料成本", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186589", "t": 2, "q": "下列各项中，属于辞退福利的有（　）。", "a": ["职工劳动合同到期前，为鼓励职工自愿接受裁减而给予的非货币性补偿", "职工劳动合同到期前，为鼓励职工自愿接受裁减而给予的货币性补偿", "职工劳动合同到期前，不论职工本人是否愿意，企业决定解除与职工的劳动关系而给予的非货币性补偿", "职工劳动合同到期前，不论职工本人是否愿意，企业决定解除与职工的劳动关系而给予的货币性补偿", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186590", "t": 2, "q": "下列有关会计的说法中，正确的包括（　）", "a": ["核算特定主体的经济活动", "对经济活动进行核算和监督", "以货币为主要计量单位", "本质上是一种经济管理活动", "", ""], "r": "ABCD", "e": "会计是以货币为主要计量单位，对特定主体的经济活动进行核算和监督，本质是一种经济管理活动。ABCD选项均符合会计的定义和特点。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186591", "t": 2, "q": "关于所有者权益，下列说法正确的有（　）。", "a": ["企业的利得和损失可能引起所有者权益增减变动", "所有者权益项目应当列入资产负债表", "所有者权益是指企业资产扣除负债后由所有者享有的剩余权益", "所有者权益金额取决于资产和负债的计量", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186592", "t": 2, "q": "企业编制资产负债表时，需根据明细科目余额分析填列的项目有？", "a": ["预收款项", "预付款项", "应收账款", "应付账款", "", ""], "r": "ABCD", "e": "这几个项目都不能直接根据总账科目余额填列，需根据相关明细科目余额分析计算。如“预收款项”根据“预收账款”和“应收账款”明细贷方余额合计填列；“预付款项”根据“预付账款”和“应付账款”明细借方余额合计填列；“应收账款”根据“应收账款”和“预收账款”明细借方余额减去坏账准备填列；“应付账款”根据“应付账款”和“预付账款”明细贷方余额合计填列。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186593", "t": 2, "q": "下列各项中，属于企业无论是否发生关联方交易，均应当在附注中披露与母公司和子公司有关的信息的有（　）。", "a": ["母公司不是该企业最终控制方的，还应当披露控制方名称", "母公司和子公司的业务性质、注册地、注册资本（或实收资本、股本）及其变化", "母公司对该企业或者该企业对子公司的持股比例和表决权比例", "母公司和子公司的名称", "", ""], "r": "ABCD", "e": "企业无论是否发生关联方交易，都要在附注披露与母公司和子公司相关重要信息，ABCD选项均为应披露内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186594", "t": 2, "q": "资产负债表中，需要根据总账科目和明细科目余额分析计算填列的项目有？", "a": ["其他应收款", "长期借款", "长期应收款", "长期应付款", "", ""], "r": "BCD", "e": "其他应收款是根据有关科目余额减去其备抵科目余额后的净额填列。而长期借款、长期应收款、长期应付款需根据总账科目和明细科目余额分析计算填列，要把一年内到期的部分单独列示。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186595", "t": 2, "q": " 在资产负债表分析中，关于资产负债率指标，下列说法正确的有？", "a": ["资产负债率越高，企业偿债风险越大", "一般认为资产负债率适宜水平在40%-60%", "该指标应保持在合理区间，并非越低越好", "反映企业长期偿债能力", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186596", "t": 2, "q": "下列关于财务报表列报的要求的表述，正确的有（　）。", "a": ["性质或功能不同的项目，应当在财务报表中单独列报，但不具有重要性的项目除外", "在编制财务报表的过程中，企业应当考虑报表项目的重要性", "性质或功能类似的项目，一般可以合并列报", "性质或功能类似的项目，其所属类别具有重要性的，应当按其类别在财务报表中单独列报", "", ""], "r": "ABCD", "e": "财务报表列报应考虑项目重要性，性质或功能不同且重要的项目应单独列报，性质或功能类似项目可合并列报，所属类别重要的要按类别单独列报。ABCD选项表述均符合要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186597", "t": 2, "q": "在企业会计实务中，下列事项中能够引起资产总额增加的有（　）。", "a": ["分配生产工人职工薪酬", "转让交易性金融资产确认的净收益", "计提未到期持有至到期债券投资的利息", "长期股权投资权益法下实际收到的现金股利", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186598", "t": 2, "q": "关于会计档案的销毁，下列说法中正确的有（　）。", "a": ["单位销毁会计档案时，单位档案机构和会计机构应共同派员监销", "由单位负责人主持会计档案的销毁", "财政部门销毁会计档案时，应由同级审计部门派员参加监销", "国家机关销毁会计档案时，应由同级财政部门和审计部门派员参加监销", "", ""], "r": "ACD", "e": "单位销毁会计档案时需档案机构和会计机构共同派员监销；财政部门销毁时同级审计部门派员监销；国家机关销毁时同级财政和审计部门派员监销，而不是单位负责人主持销毁。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186599", "t": 2, "q": "在分配辅助生产费用的方法中，属于交互分配的方法有（　）。", "a": ["顺序分配法", "计划成本分配法", "代数分配法", "直接分配法", "", ""], "r": "BC", "e": "交互分配法是要进行两次分配，先在辅助生产车间内部交互分配，再对外分配。顺序分配法有先后顺序但不是交互分配；直接分配法不考虑辅助车间内部交互；计划成本分配法和代数分配法都涉及辅助车间内部交互分配。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186600", "t": 2, "q": "下列各项，能够引起事业单位事业结余发生增减变化的有（　）。", "a": ["上缴上级支出", "经营收入", "事业收入", "应缴财政专户款", "", ""], "r": "AC", "e": "事业结余是事业收入、上级补助收入、附属单位上缴收入、其他收入等减去事业支出、上缴上级支出等后的余额。经营收入影响经营结余，应缴财政专户款是负债科目不影响事业结余。上缴上级支出使事业结余减少，事业收入使事业结余增加。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186601", "t": 2, "q": "采用分步法核算产品成本时，逐步综合结转分步法的缺点有哪些？", "a": ["不利于各生产步骤的成本管理", "不能直接提供按原始成本项目反映的产品成本资料", "成本结转工作量较大", "各步骤成本计算的及时性较差", "", ""], "r": "BCD", "e": "逐步综合结转分步法需进行成本还原，成本结转工作量大，且不能直接提供按原始成本项目反映的产品成本资料，同时每一步骤都要等上一步骤成本计算完成，各步骤成本计算及时性差。而它是利于各生产步骤成本管理的。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186602", "t": 2, "q": "下列各项应该计入工业企业\"其他业务收入\"科目的有（　）。", "a": ["出售投资性房地产的收入", "将持有并准备增值后转让的建筑物转让时所取得的收益", "投资性房地产的租金收入", "出售自用房屋的处置收益", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186603", "t": 2, "q": "采用自营方式建造固定资产的情况下，下列项目应计入资产的取得成本的有（　）。", "a": ["工程人员的工资", "购买工程物资所支付的增值税进项税额", "工程领用本企业产品所交纳的消费税", "工程领用本企业的产品", "", ""], "r": "ACD", "e": "自营建造固定资产，工程人员工资、工程领用本企业产品及所交消费税都应计入资产取得成本；一般纳税人购买工程物资的增值税进项税额可抵扣，不计入成本。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186604", "t": 2, "q": "下列各种情况中，会产生应纳税暂时性差异的有（　）。", "a": ["资产的账面价值大于其计税基础", "资产的账面价值小于其计税基础", "负债的账面价值大于其计税基础", "负债的账面价值小于其计税基础", "", ""], "r": "AD", "e": "应纳税暂时性差异意味着未来期间会增加应纳税所得额。资产账面价值大于计税基础，未来多计收益，会纳税；负债账面价值小于计税基础，意味着未来少计费用，也会纳税。而资产账面价值小于计税基础、负债账面价值大于计税基础会产生可抵扣暂时性差异。所以答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186605", "t": 2, "q": "下列哪些属于借贷记账法试算平衡的内容（　）。", "a": ["所有账户借方本期发生额合计=所有账户贷方本期发生额合计", "所有账户借方期初余额合计=所有账户贷方期初余额合计", "全部资产借方余额之和=全部负债及所有者权益贷方余额之和", "所有账户借方期末余额合计=所有账户贷方期末余额合计", "", ""], "r": "ABD", "e": "借贷记账法试算平衡包括发生额试算平衡和余额试算平衡。发生额试算平衡是所有账户借方本期发生额合计等于所有账户贷方本期发生额合计；余额试算平衡包括期初余额平衡（所有账户借方期初余额合计等于所有账户贷方期初余额合计）和期末余额平衡（所有账户借方期末余额合计等于所有账户贷方期末余额合计）。而C项是会计恒等式内容，并非试算平衡内容。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186606", "t": 2, "q": "下列各项中，应在\"坏账准备\"账户借方反映的有（　）。", "a": ["提取的坏账准备", "收回前期已确认为坏账并转销的应收账款", "冲销的坏账准备", "发生的坏账损失", "", ""], "r": "CD", "e": "坏账准备借方登记冲销的坏账准备和发生的坏账损失；贷方登记提取坏账准备和收回前期已确认为坏账并转销的应收账款。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528619061186607", "t": 2, "q": "根据《企业会计准则》，会计信息质量要求中的谨慎性原则体现在哪些方面？", "a": ["对固定资产采用加速折旧法", "对应收账款计提坏账准备", "高估收益，低估费用", "对可能发生的资产减值损失确认预计负债", "", ""], "r": "ABD", "e": "谨慎性原则要求企业不应高估资产或者收益、低估负债或者费用。A加速折旧法使前期折旧多，减少利润，体现谨慎；B计提坏账准备考虑了应收账款收不回的风险，体现谨慎；D确认预计负债考虑了可能发生的损失，体现谨慎。而C高估收益、低估费用违背了谨慎性原则。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866368", "t": 3, "q": "在成本法下，当被投资企业发生盈亏时，投资企业并不做账务处理;当被投资企业宣告分配现金股利时，投资方应将分得的现金股利确认为投资收益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "成本法下，投资企业通常按初始投资成本计价，被投资企业盈亏不影响投资企业账务处理；被投资企业宣告分配现金股利时，投资企业将分得股利确认为投资收益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866369", "t": 3, "q": "在对企业境外经营的财务报表进行折算时，应当调整境外经营的会计期间和会计政策，使之与企业会计期间和会计政策相一致，根据调整后的会计政策及会计期间编制相应货币的财务报表，然后再进行折算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对境外经营财务报表折算时，确实要先调整境外经营会计期间和政策，使其与企业一致，按调整后编制对应货币财务报表再折算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866370", "t": 3, "q": "企业收到投资者投入的资本，应按照合同约定的汇率进行折算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866371", "t": 3, "q": "按照权责发生制原则的要求，凡是本期实际收到款项的收入和付出款项的费用，不论是否归属于本期，都应当作为本期的收入和费用处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "权责发生制是看业务是否属于本期，而非是否实际收付款项，题干描述是收付实现制的要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866372", "t": 3, "q": "会计账簿是指由一定格式账页组成的，以经过审核的会计凭证为依据，全面、系统、连续地记录各项经济业务的簿籍。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是会计账簿的标准定义。答案是正确的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866373", "t": 3, "q": "事业单位的修购基金是按事业结余和经营结余的一定比例提取的，因此，修购基金属于结余分配的内容。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "修购基金是按事业收入和经营收入的一定比例提取，并非按事业结余和经营结余提取，所以它不属于结余分配内容，答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866374", "t": 3, "q": "资产负债表日，以公允价值计量的外币非货币性项目，采用公允价值确定日的即期汇率折算，折算后的记账本位币金额与原记账本位币金额的差额，作为公允价值变动（含汇率变动）处理，计入当期损益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866375", "t": 3, "q": "企业代扣代缴的职工个人所得税，在\"支付的各项税费\"项目中反映。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业代扣代缴职工个人所得税，本质是企业替职工向税务机关缴纳税款，属于企业支付的税费范畴，应在“支付的各项税费”项目反映。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866376", "t": 3, "q": "不考虑其他因素，当期末汇率上升时，外币货币性资产项目会产生汇兑收益;当期汇率下降时，外币货币性负债项目会产生汇兑收益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "汇率上升，外币货币性资产折算成记账本位币增多，产生汇兑收益；汇率下降，外币货币性负债折算成记账本位币减少，也产生汇兑收益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866377", "t": 3, "q": "进行会计估计是根据当前所掌握的可靠证据并据以做出的最佳估计，所以并不会削弱会计核算的可靠性。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计估计基于当前可靠证据做最佳估计，是合理且必要的会计处理方法，符合会计核算要求，不影响可靠性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866378", "t": 3, "q": "无论是债务人还是债权人，均不可能由于债务重组而产生营业外收入。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "债务重组中，债权人可能因收回金额高于债权账面价值产生营业外收入，债务人可能因债务豁免等产生营业外收入。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866379", "t": 3, "q": "当年形成的会计档案，在会计年度终了，可暂由本单位财务会计部门保管一年。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据会计档案管理规定，当年形成的会计档案，在会计年度终了后，可暂由本单位会计机构保管一年。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866380", "t": 3, "q": "资产负债表日采用公允价值模式计量的投资性房地产的公允价值高于其账面余额的差额，借记\"投资性房地产——公允价值变动\"科目，贷记\"公允价值变动损益\"科目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866381", "t": 3, "q": "追溯调整法下，对于比较财务报表期间的会计政策变更，应调整各期间净损益各项目和财务报表其他相关项目;对于比较财务报表可比期间以前的会计政策变更的累计影响数，应调整比较财务报表最早期间的期初留存收益，财务报表其他相关项目的数字也一并调整。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "追溯调整法就是这样规定的，对于比较财务报表期间的政策变更调整各期间净损益等项目；对于可比期间以前的，调整最早期间期初留存收益及其他相关项目。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866382", "t": 3, "q": "我国《小企业会计制度》规定，小企业的财务会计报告必须包括现金流量表。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "我国《小企业会计制度》规定，小企业可根据需要选择是否编制现金流量表，并非必须包括。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866383", "t": 3, "q": "宣传媒介的收费，应当在资产负债表日根据开发的完工进度确认收入。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "宣传媒介收费应在相关广告或商业行为开始出现于公众面前时确认收入，而不是在资产负债表日按开发完工进度确认收入。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866384", "t": 3, "q": "当具有商业实质且换入或换出资产的公允价值能够可靠计量的情况下，换出的长期股权投资账面价值和公允价值之间的差额，计入营业外收支。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "具有商业实质且换入或换出资产公允价值能可靠计量时，换出长期股权投资账面价值和公允价值的差额应计入投资收益，而非营业外收支。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866385", "t": 3, "q": "交易性金融资产因为流动性较强，因而属于现金等价物。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现金等价物需满足期限短、流动性强、易于转换为已知金额现金、价值变动风险很小等条件。交易性金融资产价值变动风险较大，不满足现金等价物条件。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866386", "t": 3, "q": "如果试算平衡表借贷平衡，则可以肯定记账无错误。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "试算平衡表借贷平衡，只能说明记账可能正确，但不能肯定无错误。因为有些错误不影响借贷双方的平衡关系，比如漏记、重记、记错账户、借贷方向颠倒等。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866387", "t": 3, "q": "《企业会计准则》规定，会计的确认、计量和报告应当以权责发生制为基础。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据《企业会计准则》，企业会计的确认、计量和报告是以权责发生制为基础的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866388", "t": 3, "q": "取得交易性金融资产时支付的交易费用，应计入交易性金融资产的初始入账成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "取得交易性金融资产时支付的交易费用应计入当期损益（投资收益），而非交易性金融资产的初始入账成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866389", "t": 3, "q": "固定资产在计提折旧的时候，遵循这样的原则:当月增加的固定资产，当月不需要计提折旧，当月减少的固定资产，当月照提折旧。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是固定资产折旧计提的准则规定，符合会计核算的实际操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866390", "t": 3, "q": "经营租入固定资产发生的改良支出，应计入\"固定资产\"科目（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "经营租入固定资产，企业没有所有权，其改良支出不能计入“固定资产”科目，应计入“长期待摊费用”科目，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866391", "t": 3, "q": "单位为了将本期与下期的会计记录分开，结账时一般划结账线，月结划单红线，年结划双红线。划线只在账页中的金额部分划线。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "结账时划结账线，月结划单红线，年结划双红线，且是在账页的最后一行下面划，不只是金额部分，所以题干表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866392", "t": 3, "q": "在计算稀释每股收益时，对于所有的潜在普通股，均应假设其在当期期初已经全部转换为普通股，据此计算稀释每股收益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不是所有潜在普通股都假设在当期期初已全部转换，如当期发行的潜在普通股，应从发行日起考虑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866393", "t": 3, "q": "无论何种情况下，企业都应按照持续经营的基本假设选择会计核算的原则和方法。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "持续经营是会计基本假设之一，但并非在任何情况下企业都能按此假设选择核算原则和方法。当企业面临破产清算等无法持续经营的情况时，就不能再以持续经营假设来核算。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866394", "t": 3, "q": "企业所有的利得和损失均应计入当期损益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业的利得和损失分为直接计入当期损益和直接计入所有者权益两种情况，并非都计入当期损益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866395", "t": 3, "q": "企业在资产负债表日提供劳务交易结果不能够可靠估计的，如果已经发生的劳务成本预计只能部分得到补偿的，应当按照能够得到补偿的劳务成本金额确认收入，并按已经发生的劳务成本结转成本（　）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当企业在资产负债表日提供劳务交易结果不能可靠估计，且已发生的劳务成本预计只能部分得到补偿时，按能得到补偿的劳务成本金额确认收入，已发生的劳务成本全额结转成本，符合会计准则规定。", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866396", "t": 3, "q": "或有资产指过去的交易或者事项形成的现时义务，其存在须通过未来不确定事项的发生或不发生予以证实。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "题干描述的是或有负债的定义，而或有资产是过去的交易或者事项形成的潜在资产，其存在须通过未来不确定事项的发生或不发生予以证实。所以该表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866397", "t": 3, "q": "因房地产用途发生改变，企业将自用的房地产转换为投资性房地产后，则不再计提折旧或进行摊销。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自用房地产转换为采用成本模式计量的投资性房地产，仍需计提折旧或摊销；转换为采用公允价值模式计量的投资性房地产，才不再计提折旧或进行摊销。题干未明确模式，说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866398", "t": 3, "q": "本单位的会计档案机构为方便保管会计档案，可以根据需要对其拆封重新整理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "会计档案应保持原封装，一般不得拆封重新整理，以保证档案的完整性和原始性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866399", "t": 3, "q": "对于数量繁多、单价较低的存货，可以不按单个存货项目计提存货跌价准备。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数量繁多、单价较低的存货，按单个项目计提存货跌价准备工作量大，可按类别计提。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866400", "t": 3, "q": "处置持有至到期投资时，应将实际收到的金额与其账面价值的差额计入公允价值变动损益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "处置持有至到期投资时，实际收到金额与账面价值的差额应计入投资收益，而非公允价值变动损益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866401", "t": 3, "q": "对于由财政直接支付的购买材料，事业单位应借记\"材料\"科目，贷记\"银行存款\"科目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "财政直接支付下，事业单位购买材料，应贷记“财政补助收入”，而非“银行存款”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528620327866402", "t": 3, "q": "可供出售金融资产因资产负债表日后市价严重下跌，公司应将其视为资产负债表日后调整事项。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产负债表日后市价严重下跌，这是在资产负债表日后才发生的新情况，不属于资产负债表日已存在的状况，应作为非调整事项。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 会计学（5）", "n": "基础练习题【含解析】 / 第2章 会计学（5）", "qs": [{"id": "2034528627600789504", "t": 1, "q": "万维公司以一项交易性金融资产换入航天公司的一项无形资产，该项交易性金融资产的账面价值为35万元，其公允价值为38万元，航天公司的该项无形资产的账面原价为60万元，已计提摊销的金额为18万元，计提减值准备的金额为7万元，公允价值为33万元，同时假定航天公司支付万维公司3万元，航天公司因为处置无形资产发生的相关税费为2万元，换入的金融资产仍作为交易性金融资产核算。假设两公司资产交换不具有商业实质，则航天公司换入交易性金融资产的入账价值为（　）万元。", "a": ["33", "35", "40", "38", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789505", "t": 1, "q": "恒通公司购入一台生产设备，其账面原值为40万元，采用双倍余额递减法按年计提折旧，预计使用年限为5年，预计净残值率为10％。该设备在使用3年6个月后提前报废，报废时发生清理费用0.4万元，取得残值收入1万元。则该设备报废对企业当期税前利润的影响额为减少（　）元。", "a": ["8.08", "6.88", "9.6", "32.52", "", ""], "r": "B", "e": "本题可先根据双倍余额递减法计算出设备使用3年6个月的累计折旧，进而得出设备报废时的账面价值，再结合清理费用和残值收入计算出报废损失，该损失即为对企业当期税前利润的影响额。### 步骤一：计算双倍余额递减法的折旧率双倍余额递减法的折旧率「test/yiwen_img/importSubject/2034528621745541120.png」。### 步骤二：计算各年折旧额 第1年折旧额「test/yiwen_img/importSubject/2034528621892341760.png」（万元）； 第2年折旧额「test/yiwen_img/importSubject/2034528622005587968.png」（万元）； 第3年折旧额「test/yiwen_img/importSubject/2034528622131417088.png」（万元）； 第4年和第5年改用直线法计提折旧，第4年和第5年每年折旧额「test/yiwen_img/importSubject/2034528622223691776.png」（万元）。 第3年6个月的折旧额，前3年折旧额共16 + 9.6 + 5.76 = 31.36万元，第3年6个月的折旧额还需加上第4年半年的折旧「test/yiwen_img/importSubject/2034528622320160768.png」万元，所以累计折旧额为31.36 + 1.66 = 33.02万元。### 步骤三：计算设备报废时的账面价值设备账面原值为40万元，累计折旧33.02万元，则账面价值=40 - 33.02 = 6.98万元。### 步骤四：计算报废损失报废时发生清理费用0.4万元，取得残值收入1万元，所以报废损失=6.98 + 0.4 - 1 = 6.38万元，即对企业当期税前利润的影响额为减少6.38万元，换算为元是63800元，没有该选项，可能计算过程中存在四舍五入差异，最接近的是6.88万元。综上，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789506", "t": 1, "q": "某企业收回应收账款9000元，在填制记账凭证时，误将金额记为900元，并已登记入账，上述错误更正时应编制的会计分录为（　）。", "a": ["借:银行存款900<br />贷:应收账款900", "借:银行存款-8100<br />贷:应收账款-8100", "借:银行存款8100<br />贷:应收账款8100", "借:应收账款900<br />贷:银行存款900", "", ""], "r": "C", "e": "记账凭证金额少记，应补充登记少记金额，少记了9000 - 900 = 8100元，用蓝字编制补充少记金额的分录。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789507", "t": 1, "q": "采用分批法核算产品成本时，如果批内产品跨月陆续完工，对完工产品成本的处理方法不包括？", "a": ["按计划单位成本计算", "按定额单位成本计算", "按完工产品数量占总数量比例计算", "按近期同种产品的实际单位成本计算", "", ""], "r": "C", "e": "分批法下批内产品跨月陆续完工，常用按计划单位成本、定额单位成本、近期同种产品实际单位成本计算完工产品成本。而按完工产品数量占总数量比例计算一般用于约当产量法等，不是分批法批内产品跨月陆续完工时处理完工产品成本的方法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789508", "t": 1, "q": "下列关于会计要素计量属性的应用，表述正确的是？", "a": ["交易性金融资产采用公允价值计量", "盘盈固定资产一般采用重置成本计量", "固定资产折旧采用历史成本计量", "存货期末计价采用可变现净值计量", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789509", "t": 1, "q": "甲公司2008年3月20日购入一台需要安装的机器设备，该设备的成本为960万元，安装期发生相关的支出为30万元，在2008年9月20日达到预定可使用状态，预计使用年限为5年，预计净残值为50万元。采用双倍余额递减法计提折旧的情况下，2009年该设备应计提的折旧额为（　）万元。", "a": ["297", "396", "356.4", "237.6", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789510", "t": 1, "q": "下列各项中，不应计入营业外支出的是（　）。", "a": ["资产减值损失", "非流动资产处置损失", "债务重组损失", "公益性捐赠支出", "", ""], "r": "A", "e": "营业外支出是指企业发生的与其日常活动无直接关系的各项损失。选项A资产减值损失是企业资产发生减值时确认的损失，应计入当期损益，但不属于营业外支出；选项B非流动资产处置损失、C债务重组损失、D公益性捐赠支出都与企业日常活动无直接关系，应计入营业外支出。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789511", "t": 1, "q": "企业在前期资产负债表日，依据当时实际情况和所掌握的证据合理估计预计负债后，应当将当期实际发生的诉讼损失金额与已计提的相关预计负债之间的差额，应计入（　）。", "a": ["管理费用", "营业外收入或营业外支出", "财务费用", "营业外支出", "", ""], "r": "B", "e": "实际发生诉讼损失金额与已计提预计负债的差额，属于与企业日常经营活动无直接关系的利得或损失，应计入营业外收入或营业外支出。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789512", "t": 1, "q": "下列关于分批法成本计算特点的说法，错误的是？", "a": ["适用于大量大批生产企业", "成本计算期不固定", "以产品批别为成本计算对象", "一般不需要在完工产品和在产品之间分配成本", "", ""], "r": "A", "e": "分批法适用于单件、小批生产企业，而非大量大批生产企业，A选项说法错误。B成本计算期随产品生产周期，不固定；C以产品批别为对象；D若批内产品同时完工，一般无需在完工与在产品间分配成本。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789513", "t": 1, "q": "2007年10月X公司与Y公司签订合同，X公司于2008年1月销售商品给Y公司，合同价格为1600万元，如X公司单方面撤销合同，应支付违约金为400万元。至2007年12月31日商品尚未购入，但是市场价格大幅度地上升，X公司预计购买商品成本总额为2200万元，则X公司确认预计负债的金额为（　）万元。", "a": ["0", "200", "400", "600", "", ""], "r": "C", "e": "执行合同损失为2200 - 1600 = 600万元，撤销合同损失为400万元，应选择损失小的方案即撤销合同，所以确认预计负债400万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789514", "t": 1, "q": "采用品种法计算产品成本时，若企业只生产一种产品，发生的生产费用？", "a": ["计入期间费用", "需要在不同产品间分配", "全部计入该产品成本", "部分计入该产品成本", "", ""], "r": "C", "e": "品种法下若只生产一种产品，不存在在不同产品间分配费用的问题，所有生产费用都可直接计入该产品成本。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789515", "t": 1, "q": "某企业2009年3月份资产增加400万元，负债减少250万元，若不考虑其他因素，则该企业的所有者权益为增加（　）万元。", "a": ["400", "150", "650", "250", "", ""], "r": "C", "e": "根据会计恒等式“资产=负债 + 所有者权益”，资产增加400万，负债减少250万，那么所有者权益增加应为资产增加额与负债减少额之和，即400 + 250 = 650万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789516", "t": 1, "q": "在会计要素计量属性中，市场参与者在计量日发生的有序交易中，出售一项资产所能收到或者转移一项负债所需支付的价格是？", "a": ["公允价值", "可变现净值", "历史成本", "重置成本", "", ""], "r": "A", "e": "题干描述的是公允价值的定义。可变现净值是预计售价减去进一步加工成本等，历史成本是取得或制造时的实际成本，重置成本是重新取得同样资产的成本。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789517", "t": 1, "q": "事业单位盘盈的存货，应（　）。", "a": ["冲减当期支出", "增加营业外收入", "增加当期支出", "冲减营业外支出", "", ""], "r": "A", "e": "事业单位盘盈存货，按规定应冲减当期支出。营业外收支是企业会计科目。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789518", "t": 1, "q": "甲公司2008年12月31日的资产、负债中，可供出售金融资产的账面价值为120万元，计税基础为110万元，预计负债的账面价值为100万元，计税基础为0。假定公司2008年适用的所得税税率为33％，预期从2009年1月1日起，该公司适用的所得税税率将变更为25％，无其他纳税调整事项。甲公司2008年应纳税所得额为540万元（已考虑了上述纳税调整事项），2008年初递延所得税科目无余额。则2008年甲公司利润表中的\"所得税费用\"项目金额为（　）万元。", "a": ["145.2", "150.7", "155.7", "153.2", "", ""], "r": "C", "e": "先算递延所得税负债=（120 - 110）×25% = 2.5万元，递延所得税资产=100×25% = 25万元，递延所得税=2.5 - 25 = -22.5万元；当期所得税=540×33% = 178.2万元；所得税费用=当期所得税+递延所得税=178.2 - 22.5 = 155.7万元。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789519", "t": 1, "q": "下列关于利润表\"营业成本\"项目的表述，正确的是？", "a": ["包括主营业务成本、其他业务成本和营业税金及附加", "只包括其他业务成本", "包括主营业务成本和其他业务成本", "只包括主营业务成本", "", ""], "r": "C", "e": "营业成本是企业经营活动中为取得收入而发生的成本，包含主营业务成本和其他业务成本。营业税金及附加不属于营业成本。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789520", "t": 1, "q": "A公司采用期望现金流量法预计资产未来现金流量，2008年末，X设备出现减值迹象，其剩余使用寿命为2年。该设备的现金流量受市场因素的影响较大，有关该设备预计未来2年每年的现金流量情况如下表所示:单位:万元<br />「test/yiwen_img/importSubject/2034528621405802496.png」<br />假定计算该生产线未来现金流量的现值时适用的折现率为5%，已知部分时间价值系数如下:<br />「test/yiwen_img/importSubject/2034528621657460736.png」<br />假定有关现金流量均发生于年末，不考虑其他因素，则X设备2008年末的预计未来现金流量的现值为（　）万元。", "a": ["340", "349", "317.46", "325.85", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789521", "t": 1, "q": "汇总记账凭证账务处理程序的优点:一是可以减少登记总账的工作量，二是（　）。", "a": ["可以做到试算平衡", "便于了解账户间的对应关系", "简单明了，易于理解", "简明易懂", "", ""], "r": "B", "e": "汇总记账凭证账务处理程序先根据记账凭证编制汇总记账凭证，再根据汇总记账凭证登记总账，能减少登记总账工作量，且汇总记账凭证是按会计科目对应关系进行汇总的，便于了解账户间对应关系。A是科目汇总表账务处理程序优点；C、D是记账凭证账务处理程序优点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789522", "t": 1, "q": "界定从事会计工作和提供会计信息的空间范围的会计基本前提是（　）。", "a": ["会计内容", "持续经营", "会计主体", "货币计量", "", ""], "r": "C", "e": "会计主体界定了会计工作和会计信息的空间范围，明确了会计核算的立场和范围。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789523", "t": 1, "q": "现金流量表中\"购买商品、接受劳务支付的现金\"项目不包括的内容是（　）", "a": ["本期购买商品支付的价款", "本期支付的增值税进项税额", "本期支付给职工的工资", "本期预付的账款", "", ""], "r": "C", "e": "“购买商品、接受劳务支付的现金”与商品和劳务采购相关，而支付给职工工资属于“支付给职工以及为职工支付的现金”项目。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789524", "t": 1, "q": "下列各项中，不属于企业收入要素范围的是（　）。", "a": ["出租无形资产收入", "接受现金捐赠收入", "销售商品收入", "债券投资取得的利息收入", "", ""], "r": "B", "e": "收入是日常活动形成的、会导致所有者权益增加且与所有者投入资本无关的经济利益总流入。接受现金捐赠是偶然发生的非日常活动，不属于收入。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789525", "t": 1, "q": "材料费作为直接生产费用，在任何情况下均应直接计入产品成本，这种成本计算方法是（　）。", "a": ["分步法", "分类法", "分批法", "品种法", "", ""], "r": "D", "e": "品种法下一般将材料费等直接生产费用直接计入产品成本。而分步法是按步骤归集成本；分类法是按产品类别归集成本；分批法按产品批次归集成本。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789526", "t": 1, "q": "2007年1月1日，A公司以2,000万元的对价取得B公司15%的股权（公允价值不能可靠计量），采用成本法核算。2007年，B公司实现净利润50万元，2008年5月20日，B公司宣告分配现金股利100万元，2008年，B公司发生净亏损20万元。2008年下半年，经济环境的变化对B公司的经营活动产生重大不利影响，A公司于2008年末对该项长期股权投资进行减值测试，其可收回金额为1,500万元，不考虑其他因素，则2008年12月31日，该长期股权投资应计提的减值准备为（　）万元。", "a": ["500", "492.5", "470", "0", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789527", "t": 1, "q": "企业按规定销毁会计档案时，应（　）。", "a": ["由档案室保管人员销毁", "由会计人员销毁", "由单位负责人亲自销毁", "由单位档案管理机构和会计机构共同派员监督销毁", "", ""], "r": "D", "e": "销毁会计档案时需保证监督的规范性和公正性，应让单位档案管理机构和会计机构共同派员监督。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789528", "t": 1, "q": "在各种不同账务处理程序中，不能作为登记总账依据的是（　）。", "a": ["汇总原始凭证", "科目汇总表", "汇总记账凭证", "记账凭证", "", ""], "r": "A", "e": "汇总原始凭证是用来汇总原始单据的，它不能直接作为登记总账的依据。而科目汇总表、汇总记账凭证、记账凭证都可用于登记总账。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789529", "t": 1, "q": "A公司2008年期初发行在外的普通股为20 000万股，5月1日新发行普通股6 000万股，9月1日又回购普通股1 200万股。A公司当年度实现的归属于普通股股东的当期净利润为7 080万元。不考虑其他因素，该公司2008年度基本每股收益为（　）元。（计算结果保留两位小数。）", "a": ["0.30", "0.34", "0.27", "0.29", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789530", "t": 1, "q": "以下哪项不是利润表中的项目（　）。", "a": ["所得税", "营业外收入", "管理费用", "其他业务收入", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789531", "t": 1, "q": "企业由于或有事项而确认的负债所需的支出，有时全部或部分由第三方补偿，对于这些补偿金额，只有在（　）时才可能作为资产单独确认。", "a": ["发生的概率大于95％但小于100%", "发生的概率大于5％但小于或等于50%", "发生的概率大于0％但小于或等于50%", "发生的概率大于50％但小于或等于95%", "", ""], "r": "A", "e": "或有事项确认资产需基本确定能收到补偿，基本确定对应的概率是发生的概率大于95％但小于100%。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789532", "t": 1, "q": "费用明细账比较适合使用的账簿格式是（　）。", "a": ["多栏式账簿", "两栏式账簿", "数量金额式账簿", "三栏式账簿", "", ""], "r": "A", "e": "费用明细账需按费用项目详细反映，多栏式账簿可在同一账页按项目分设专栏，便于对费用进行分析和控制。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789533", "t": 1, "q": "某企业在财产清查中，盘亏现金1000元，其中400元应由出纳员赔偿，另外600元无法查明原因。现经批准后，转销现金盘亏的会计分录为（　）。", "a": ["借: 管理费用 600<br />其他应收款 400<br />贷: 待处理财产损益 1000", "借: 管理费用 600<br />营业外支出 400<br />贷: 库存现金 1000", "借: 管理费用 600<br />其他应收款 400<br />贷: 库存现金 1000", "借: 待处理财产损益 1000<br />贷: 库存现金 1000", "", ""], "r": "A", "e": "盘亏现金批准前先计入“待处理财产损益”，批准后，应由责任人赔偿的计入“其他应收款”，无法查明原因的计入“管理费用”，同时冲减“待处理财产损益”。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789534", "t": 1, "q": "M公司本期应交房产税2.5万元，印花税2万元，应交土地使用税3万元，耕地占用税6万元，契税5万元，教育费附加1万元，车辆购置税0.8万元，则本期影响应交税费科目的金额是（　）万元。", "a": ["6.5", "20.3", "18.3", "7.3", "", ""], "r": "A", "e": "印花税、耕地占用税、契税、车辆购置税不通过“应交税费”核算，所以影响“应交税费”科目金额为房产税、土地使用税、教育费附加之和，即2.5 + 3 + 1 = 6.5万元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789535", "t": 1, "q": "企业在对会计要素进行计量时，一般应当采用（　）。", "a": ["历史成本", "可变现净值", "现值", "重置成本", "", ""], "r": "A", "e": "企业对会计要素计量时，一般采用历史成本，它是交易实际发生的成本，具有可靠性和可验证性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789536", "t": 1, "q": " 在借贷记账法下，负债类账户的期末余额计算公式是？", "a": ["期末余额=期初贷方余额+本期贷方发生额-本期借方发生额", "期末余额=期初借方余额+本期贷方发生额-本期借方发生额", "期末余额=期初贷方余额+本期借方发生额-本期贷方发生额", "期末余额=期初借方余额+本期借方发生额-本期贷方发生额", "", ""], "r": "A", "e": "负债类账户贷方登记增加，借方登记减少，期末余额一般在贷方。所以期末余额是期初贷方余额加上本期贷方增加额，减去本期借方减少额。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789537", "t": 1, "q": "企业偿还的长期借款利息，在编制现金流量表时，应作为（　）项目填列。", "a": ["支付的利息费用", "偿还债务支付的现金", "分配股利、利润和偿付利息支付的现金", "支付的其他与筹资活动有关的现金", "", ""], "r": "C", "e": "长期借款利息属于筹资活动产生的现金流出，在现金流量表中“分配股利、利润和偿付利息支付的现金”项目反映。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789538", "t": 1, "q": " 在财务报表分析中，反映企业偿债能力的指标是？", "a": ["总资产周转率", "销售净利率", "净资产收益率", "资产负债率", "", ""], "r": "D", "e": "总资产周转率反映运营能力，销售净利率和净资产收益率反映盈利能力，资产负债率体现企业偿债能力。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789539", "t": 1, "q": "2008年1月1日，A公司购入一项管理用无形资产，双方协议采用分期付款方式支付价款，合同价款为800万元，每年末付款200万元，4年付清。假定银行同期贷款利率为6％。另以现金支付相关税费16.98万元。该项无形资产购入当日即达到预定
