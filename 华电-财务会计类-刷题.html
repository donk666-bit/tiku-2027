se, false, false, false, false, false]}, {"id": "2034528668516225044", "t": 3, "q": "按照中国注册会计师审计准则的规定对财务报表发表审计意见是注册会计师的责任。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "依据审计准则，注册会计师的职责就是按规定对财务报表发表审计意见。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225045", "t": 3, "q": "实施销售截止日期测试程序的目的是为了查明主营业务收入会计记录归属期是否正确，以防止和纠正营业收入账户内可能包括的不属于本期的营业收入事项。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "销售截止测试就是要检查收入是否记录在正确的会计期间，避免将不属于本期的收入计入本期，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225046", "t": 3, "q": "审计业务约定书是注册会计师与委托人共同签署的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225047", "t": 3, "q": "审查企业财务报表、出具审计报告是注册会计师的法定业务，非注册会计师不得承办。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据相关规定，审查企业财务报表、出具审计报告属于注册会计师法定业务，只有注册会计师能承办。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225048", "t": 3, "q": "简式审计报告所反映的内容是非特定多数的利害关系人共同认为必要的审计事项，一般适用于非公布目的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225049", "t": 3, "q": "4.经济效益审计是指对被审计单位经济活动的经济性、效益性和效果性所进行的审计。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "经济效益审计就是围绕被审计单位经济活动的经济性、效益性和效果性开展的审计工作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225050", "t": 3, "q": "审计证据的适当性是审计证据质量的衡量。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计证据的适当性是对审计证据质量的衡量，包括相关性和可靠性。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225051", "t": 3, "q": "对现金实存额的审查，一般应事先通知出纳员，以便其更好地协助审计人员做好清点工作。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "对现金实存额审查应采取突击方式，若事先通知出纳员，可能导致其提前做手脚掩盖问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225052", "t": 3, "q": "盘点库存现金是证实资产负债表所列现金是否存在的一项重要程序。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "通过盘点库存现金能直接确定现金的实际存在情况，可有效证实资产负债表中现金项目是否真实存在。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225053", "t": 3, "q": "如果预期不存在大量的错误或重大错报风险评估为低水平，注册会计师可考虑采用消极的函证方式。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当预期不存在大量错误且重大错报风险评估为低水平时，消极函证方式是可行的。因为这种情况下，被询证者回函表明认可，不回函也大概率默认无异议。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225054", "t": 3, "q": "一般情况下，应付账款不需要函证，这是因为函证不能保证查出未记录的应付账款，况且审计人员能够取得购货发票等外部凭证来证实应付账款的余额。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "应付账款函证不能有效查出未记录的应付账款，且审计人员可通过购货发票等外部凭证证实应付账款余额，所以一般情况下应付账款无需函证。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225055", "t": 3, "q": "固有风险是不可控的，审计人员所要做的是根据不同审计对象的固有风险的大小，给予不同的关注。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "固有风险是指在不考虑内部控制结构的前提下，由于内部因素和客观环境的影响，企业的账户、交易类别和整体财务报表发生重大错报的可能性。它不受审计人员控制，但审计人员可评估其大小，根据固有风险高低给予不同关注。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 审计学（2）", "n": "基础练习题【含解析】 / 第3章 审计学（2）", "qs": [{"id": "2034528675269054464", "t": 1, "q": "下列有关检查风险的观点不能认同的是（　）", "a": ["检查风险与注册会计师所需要的审计证据成正比关系", "注册会计师应当合理设计审计程序的性质、时间和范围，并有效执行审计程序，以控制检查风险", "检查风险的控制效果取决于审计程序设计的合理性和执行的有效性", "在既定的审计风险水平下，可接受的检查风险与认定层次重大错报风险的评估结果成反向关系", "", ""], "r": "A", "e": "检查风险与所需审计证据成反比，检查风险越低，所需审计证据越多。B、C选项说明了控制检查风险的方法；D选项体现了检查风险与重大错报风险的反向关系。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054465", "t": 1, "q": "注册会计师接受委托对2008年大江股份有限公司财务报表进行了审计，下列选项中属于“鉴证对象”的是（　）", "a": ["大江公司2008年度财务状况、经营成果和现金流量", "大江公司2008年财务报表", "大江公司2008年12月31日的财务状况和该年度的经营成果和现金流量", "大江公司2008年度财务状况", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054466", "t": 1, "q": "将某一审计对象总体划分为若干具有相似特征级次总体的过程称为（　）。", "a": ["分部", "分段", "分组", "分层", "", ""], "r": "D", "e": "分层是将审计对象总体划分为若干具有相似特征级次总体的过程。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054467", "t": 1, "q": "政府审计与国家审计是两个（　）的概念。", "a": ["有些不同", "不尽相同", "完全相同", "完全不同", "", ""], "r": "C", "e": "政府审计和国家审计本质一样，是同一概念的不同表述。所以二者是完全相同的概念。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054468", "t": 1, "q": "下列审计证据中证明力最弱的是（　）。", "a": ["购货发票", "注册会计师自己编制的分析表", "银行对账单", "被审计单位管理层声明书", "", ""], "r": "D", "e": "审计证据中，外部证据证明力通常强于内部证据。A购货发票、C银行对账单是外部证据；B注册会计师自己编制的分析表可靠性高。而D被审计单位管理层声明书是内部证据，证明力最弱。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054469", "t": 1, "q": "以下关于申请设立合伙会计师事务所的条件不恰当的是（　）", "a": ["设立的合伙会计师事务所要有名称", "合伙人必须有书面合伙协议", "要有5名以上的合伙人", "有固定的办公场所", "", ""], "r": "C", "e": "设立合伙会计师事务所，合伙人应不少于2名，而非5名，A选项名称、B选项书面合伙协议、D选项固定办公场所都是设立合伙会计师事务所的必要条件。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054470", "t": 1, "q": "注册会计师执行会计报表审计业务获取的下列审计证据中，可靠性最强的是（　）。", "a": ["销货发票", "采购订货单副本", "应收账款函证回函", "购货发票", "", ""], "r": "C", "e": "审计证据可靠性受来源和性质影响，外部独立来源证据比内部证据可靠。函证回函是外部独立第三方直接提供给注册会计师的，可靠性最强。而销货发票、采购订货单副本多为企业内部形成，购货发票虽来自外部但可靠性不如函证回函。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054471", "t": 1, "q": "按照预先规定的时间进行的审计，称为（　）。", "a": ["事中审计", "不定期审计", "定期审计", "事前审计", "", ""], "r": "C", "e": "按预先规定时间审计即定期审计。事中审计是在业务执行过程中审计；不定期审计无预先规定时间；事前审计是在业务开展前审计。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054472", "t": 1, "q": "5、审计的职能不包括（　）。", "a": ["经济监督", "经济司法", "经济评价", "经济鉴证", "", ""], "r": "B", "e": "审计职能有经济监督、评价和鉴证，经济司法是司法机关的职责并非审计职能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054473", "t": 1, "q": "在实施进一步审计程序后，如果注册会计师认为某项交易不存在重大错报，而实际上该项交易存在重大错报，这种风险是（　）", "a": ["抽样风险", "检查风险", "重大错报风险", "非抽样风险", "", ""], "r": "B", "e": "本题考查各类审计风险的概念。### 各选项涉及风险的含义 抽样风险：是指注册会计师根据样本得出的结论，可能不同于如果对整个总体实施与样本相同的审计程序得出的结论的风险。 检查风险：指如果存在某一错报，该错报单独或连同其他错报可能是重大的，注册会计师为将审计风险降至可接受的低水平而实施程序后没有发现这种错报的风险。 重大错报风险：是指财务报表在审计前存在重大错报的可能性，分为财务报表层次重大错报风险和认定层次重大错报风险。  非抽样风险：是指由于某些与样本规模无关的因素而导致注册会计师得出错误结论的可能性。### 对本题的分析本题中注册会计师实施进一步审计程序后认为某项交易不存在重大错报，但实际上该项交易存在重大错报，这符合检查风险的定义，即实施审计程序后没发现重大错报的风险。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054474", "t": 1, "q": "下列有关审计重要性的表述中，错误的是（　）", "a": ["如果一项错报单独或连同其他错报可能影响财务报表使用者依据财务报表做出的经济决策，该项错报是重要的", "重要性的确定离不开职业判断", "重要性水平一旦确定就不能修改", "在考虑一项错报是否重要时，既要考虑错报的金额，又要考虑错报的性质", "", ""], "r": "C", "e": "重要性水平会随审计情况变化而修改，并非确定就不能改。A选项对重要错报的定义正确；重要性确定需审计人员职业判断，B正确；考虑错报重要性要兼顾金额和性质，D正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054475", "t": 1, "q": "下列关于统计抽样的说法正确的是（　）。", "a": ["统计抽样取得的证据证明力更强", "统计抽样不需要职业判断", "可以定量控制抽样风险", "统计抽样不存在非抽样风险", "", ""], "r": "C", "e": "统计抽样能借助数理统计方法定量控制抽样风险。A选项，证据证明力强弱与抽样方法无必然联系；B选项，统计抽样也需要职业判断；D选项，统计抽样同样存在非抽样风险。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054476", "t": 1, "q": "审计的时间范围与会计期间相一致的是？", "a": ["营业成本", "营业收入", "期间费用", "制造成本", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054477", "t": 1, "q": "注册会计师应当评价已识别对客观性的威胁的重要程度并在必要时采取防范措施消除威胁或将威胁降低到可接受水平。下列防范措施中不能降低威胁的是（　）", "a": ["与会计师事务所内部高级管理层讨论该事项", "与客户管理层讨论可能威胁的事项", "退出项目组", "终止产生威胁的经济利益", "", ""], "r": "B", "e": "与客户管理层讨论可能威胁的事项，客户管理层与注册会计师存在利益关系，无法有效降低对客观性的威胁。而与事务所内部高级管理层讨论、退出项目组、终止产生威胁的经济利益都有助于消除或降低威胁。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054478", "t": 1, "q": "下列项目中，不属于存货实质性程序的是（　）。", "a": ["存货计价测试", "成本会计控制测试", "购货业务年底截止测试", "存货分析性测试", "", ""], "r": "B", "e": "控制测试是为了测试内部控制有效性，并非实质性程序。存货计价测试、购货业务年底截止测试、存货分析性测试都属实质性程序。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054479", "t": 1, "q": "会计师事务所应当要求（　）对业务执行实施指导、监督与复核", "a": ["主任会计师", "项目组", "部门经理", "项目负责人", "", ""], "r": "D", "e": "项目负责人对业务执行实施指导、监督与复核是保证业务质量的重要环节。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054480", "t": 1, "q": "注册会计师在执行审计业务时，如果未能采取有效的防范措施降低威胁至可接受水平，则应当采取以下哪种应对方法？", "a": ["与审计客户的管理层沟通威胁的影响", "拒绝接受委托或解除业务约定", "与审计客户的治理层沟通威胁的影响", "消除产生的威胁", "", ""], "r": "B", "e": "若无法降低威胁至可接受水平，意味着继续业务会有较大风险，此时应拒绝接受委托或解除业务约定。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054481", "t": 1, "q": "在审计风险模型中，“重大错报风险”是指（　）", "a": ["评估的财务报表层次的重大错报风险", "评估的认定层次的重大错报风险", "评估的与财务报表存在联系的重大错报风险", "评估的与控制环境相关的重大错报风险", "", ""], "r": "B", "e": "审计风险模型中的重大错报风险是指评估的认定层次的重大错报风险。财务报表层次重大错报风险与报表整体相关，并非审计风险模型里“重大错报风险”所指；C表述不准确；D控制环境相关重大错报风险也不符合审计风险模型中重大错报风险定义。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054482", "t": 1, "q": "下列关于财务报表层次重大错报风险的说法不正确的是（　）", "a": ["通常与控制环境有关", "与财务报表整体存在广泛联系", "可能影响多项认定", "直接适用于某类交易、账户余额、列报的具体认定", "", ""], "r": "D", "e": "财务报表层次重大错报风险与财务报表整体广泛联系，通常和控制环境有关，会影响多项认定；而直接适用于某类交易、账户余额、列报具体认定的是认定层次重大错报风险，不是财务报表层次重大错报风险。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054483", "t": 1, "q": "在复审期间，原审计结论和决定（　）。", "a": ["拒绝执行", "暂缓执行", "照常执行", "禁止执行", "", ""], "r": "C", "e": "复审期间原审计结论和决定照常执行，以保证审计工作的正常秩序和效力。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054484", "t": 1, "q": "注册会计师接受委托对2008年大江股份有限公司财务报表进行了审计，下列选项中属于“鉴证对象”的是（　）", "a": ["大江公司2008年12月31日的财务状况和该年度的经营成果和现金流量", "大江公司2008年度财务状况", "大江公司2008年财务报表", "大江公司2008年度财务状况、经营成果和现金流量", "", ""], "r": "A", "e": "鉴证对象是鉴证对象信息所反映的内容，财务报表反映的是企业特定日期的财务状况和特定期间的经营成果、现金流量。这里财务报表是鉴证对象信息，其反映的2008年12月31日的财务状况和该年度的经营成果和现金流量是鉴证对象。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054485", "t": 1, "q": "9、注册会计师审计报告的真实性和合法性应由（　）负责。", "a": ["会计师事务所", "注册会计师", "委托单位", "国家审计机关", "", ""], "r": "B", "e": "审计报告由注册会计师出具，其真实性和合法性需注册会计师负责。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054486", "t": 1, "q": "在使用样本量表确定样本规模时，假定样本量为56，注册会计师对56个样本实施了审计程序，样本偏差为0，风险系数为2.3，则总体偏差率上限为2.3/56=4.1%，假如注册会计师确定的可接受依赖过度风险为10%，下列对风险描述不正确的是（　）", "a": ["样本偏差为0，注册会计师有90%的把握保证总体实际偏差不超过4.1%", "样本偏差为0说明总体实际偏差率超过4.1%的风险为10%", "如果注册会计师可容忍偏差率为7%，则说明总体的实际偏差率超过可容忍的偏差率很小，则说明总体可以接受", "如果注册会计师可容忍偏差率为7%，则说明总体的实际偏差率超过可容忍的偏差率很小，则说明总体不能接受", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054487", "t": 1, "q": "审计应付账款账户的余额，其目的并不在于（　）。", "a": ["考核已入账负债的合理性", "确定决算日所存在的所有债务均已入账", "验证应付账款经适当核准", "寻找实际上已经逾期的应付账款", "", ""], "r": "C", "e": "审计应付账款余额主要关注完整性、合理性等。验证应付账款经适当核准是针对应付账款的发生认定，与余额审计目的关联不大。而考核已入账负债合理性、确定债务均已入账、寻找逾期应付账款都和应付账款余额审计目的相关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054488", "t": 1, "q": "17.及时发现并纠正被审计单位的错误与舞弊是（　）的责任。", "a": ["注册会计师", "政府机关的审计师", "被审计单位的管理当局", "税务机关的注册税务师", "", ""], "r": "C", "e": "被审计单位管理当局对其编制的财务报表等负责，有责任及时发现并纠正自身的错误与舞弊。而注册会计师等外部审计人员是对被审计单位进行审计监督。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054489", "t": 1, "q": "在实施进一步审计程序后，如果注册会计师认为某项交易不存在重大错报，而实际上该项交易存在重大错报，这种风险是（　）。", "a": ["检查风险", "重大错报风险", "非抽样风险", "抽样风险", "", ""], "r": "A", "e": "检查风险是指如果存在某一错报，该错报单独或连同其他错报可能是重大的，注册会计师为将审计风险降至可接受的低水平而实施程序后没有发现这种错报的风险。本题中注册会计师实施程序后没发现实际存在的重大错报，符合检查风险的定义。重大错报风险是指财务报表在审计前存在重大错报的可能性；非抽样风险是指由于某些与样本规模无关的因素而导致注册会计师得出错误结论的可能性；抽样风险是指注册会计师根据样本得出的结论，可能不同于如果对整个总体实施与样本相同的审计程序得出的结论的风险。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054490", "t": 1, "q": "如果审计项目组成员的直系亲属在客户中所处职位可以对客户的财务状况、经营成果和现金流量施加重大影响，则会对独立性产生威胁。评价威胁重要性程度的下列因素恰当的是（　）", "a": ["评价该成员在审计项目组的工资水平", "评价直系亲属在客户中的工作时间", "评价该成员在审计项目组中的工作时间", "评价直系亲属在客户中的职位", "", ""], "r": "D", "e": "直系亲属在客户中所处职位能对客户财务等施加重大影响，评价威胁重要性主要看该直系亲属在客户中的职位高低和权力大小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054491", "t": 1, "q": "收集审计证据的阶段是（　）", "a": ["实施阶段", "后续审计阶段", "准备阶段", "终结阶段", "", ""], "r": "A", "e": "审计实施阶段主要工作就是收集审计证据，以支持审计结论和意见。准备阶段侧重于制定计划等；终结阶段是总结报告等；后续审计阶段是对审计结果落实情况检查。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054492", "t": 1, "q": "在进行风险评估时，注册会计师通常采用的审计程序是（　）", "a": ["将财务报表与其所依据的会计记录相核对", "实施分析程序以识别异常交易或事项，以及对财务报表和审计产生影响的金额、比率和趋势", "对应收账款进行函证", "以人工方式或使用计算机辅助审计设计技术，对记录或文件中的数据计算的准确性进行核对", "", ""], "r": "B", "e": "风险评估是了解被审计单位及其环境，识别和评估重大错报风险，分析程序可用于此了解过程，识别异常情况和趋势。而A、C、D更侧重于实质性程序，用于发现认定层次的重大错报。所以答案选B。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054493", "t": 1, "q": "当注册会计师表示（　）意见时，审计报告的说明段可以省略。", "a": ["无保留意见", "否定意见", "拒绝表示意见", "保留意见", "", ""], "r": "A", "e": "无保留意见意味着注册会计师认为财务报表在所有重大方面按照适用的财务报告编制基础编制并实现公允反映，说明段可省略。而否定、拒绝表示、保留意见通常需说明理由，有说明段。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054494", "t": 1, "q": "审计的客体是（　）。", "a": ["有关的法规和审计标准", "被审计单位的经济活动", "被审计单位", "专职审计机构或人员", "", ""], "r": "B", "e": "审计客体即审计对象，是被审计的单位和其经济活动。A选项是审计依据；D选项是审计主体。这里主要强调对象，选B更准确。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054495", "t": 1, "q": "20、民间审计也称为（　）。", "a": ["单位审计", "部门审计", "社会审计", "国家审计", "", ""], "r": "C", "e": "民间审计是由注册会计师受托有偿进行的审计活动，也叫社会审计。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054496", "t": 1, "q": "总体审计策略的详细程度取决于（　）", "a": ["审计业务的特征", "初步业务活动的结果", "为被审计单位提供其他服务时所获得的经验", "被审计单位规模及该项审计业务的复杂程度", "", ""], "r": "D", "e": "总体审计策略的详细程度与审计业务复杂程度相关，被审计单位规模越大、审计业务越复杂，总体审计策略就需更详细。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054497", "t": 1, "q": "67.会计事务所应当自审计报告日起，对审计工作底稿至少保存（　）。", "a": ["10年", "8年", "永久保存", "15年", "", ""], "r": "A", "e": "依据相关规定，会计事务所要从审计报告日起，对审计工作底稿至少保存10年。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054498", "t": 1, "q": "宋代审计司的建立,是我国“审计”的正式命名,从此,“审计”一词便成为（　）的专用名词。", "a": ["经济司法", "财会审核", "经济执法", "财政监督", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054499", "t": 1, "q": "8、按（　）发放内部控制制度调查表。", "a": ["班组", "部门", "单位", "人", "", ""], "r": "B", "e": "发放内部控制制度调查表通常按部门进行，这样能系统地收集各职能板块情况。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054500", "t": 1, "q": "48.下列关于审计程序的说法中，不正确的是（　）。", "a": ["观察提供的审计证据仅限于观察发生的时点", "分析程序包括调查识别出的、与其他相关信息不一致或预期数据严重偏离的波动和关系", "检查有形资产可提供权利和义务的全部审计证据", "对于询问的答复，注册会计师应当通过获取其他证据予以佐证", "", ""], "r": "C", "e": "检查有形资产主要证明资产的存在，不能提供权利和义务的全部审计证据。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054501", "t": 1, "q": "6．符合性测试作为对内部控制的一种再评价，其目标就是审查被审计单位实际运行中的（　）是否有效地操作。", "a": ["外部控制制度", "内部管理体制", "外部管理体制", "内部控制制度", "", ""], "r": "D", "e": "符合性测试是对内部控制的再评价，目的是审查被审计单位实际运行中的内部控制制度是否有效操作。选项A“外部控制制度”、B“内部管理体制”、C“外部管理体制”均不符合符合性测试针对的对象。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054502", "t": 1, "q": "47.下列（　）业务，非注册会计师在具备一定条件之后也可以承办。", "a": ["对简要财务报表的审计", "验证企业资本，出具验资报告", "税务代理", "对法规、合同所涉及的财务会计规定的遵循情况的审计", "", ""], "r": "C", "e": "答案选C。注册会计师业务分为法定业务和非法定业务，法定业务只能由注册会计师承办，A、B、D选项都属于法定业务。税务代理是非法定业务，非注册会计师具备一定条件也可承办。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054503", "t": 1, "q": "8、逆查法应先从（　）查起。", "a": ["会计账簿", "原始凭证", "会计报表", "记账凭证", "", ""], "r": "C", "e": "逆查法是按会计核算程序的相反顺序，先查会计报表，再查账簿、凭证等。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054504", "t": 1, "q": "下列关于统计抽样说法正确的是（　）。", "a": ["可以定量控制抽样风险", "统计抽样不需要职业判断", "统计抽样取得的证据证明力更强", "统计抽样不存在非抽样风险", "", ""], "r": "A", "e": "统计抽样能通过一定的方法定量控制抽样风险；统计抽样也需要职业判断；证据证明力强弱与抽样方法无必然联系；非抽样风险在统计抽样和非统计抽样中都存在。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054505", "t": 1, "q": "评价审计证据的阶段是审计的（　）。", "a": ["实施阶段", "终结阶段", "后续审计阶段", "准备阶段", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054506", "t": 1, "q": "下列各项中，属于实施审计阶段的主要工作内容的是（　）。", "a": ["审计期后事项", "确定重要性水平", "实施实质性测试", "分析审计风险", "", ""], "r": "C", "e": "实施审计阶段主要是执行审计程序获取审计证据，实质性测试是该阶段重要工作。A审计期后事项多在完成审计阶段；B确定重要性水平、D分析审计风险一般在审计计划阶段。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054507", "t": 1, "q": "无论是我国还是外国都承认（　）的经济监督活动是审计的属性。", "a": ["独立性", "权威性", "客观性", "合法性", "", ""], "r": "A", "e": "审计的本质属性是独立性，它是审计区别于其他经济监督的关键特征，国内外都认可这一点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054508", "t": 1, "q": "如果注册会计师被要求提供第二次意见，应当评价威胁的重要程度，并在必要时采取措施将威胁降低到可接受水平。下列防范措施中不恰当的是（　）", "a": ["向现任注册会计师提供第二次意见的复印件", "直接与现任注册会计师进行沟通并向现任注册会计师提供第二次意见的复印件", "征得被审计单位的同意后与现任注册会计师进行沟通", "在与被审计单位的沟通函件中阐述注册会计师意见的局限性", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054509", "t": 1, "q": "在抽样审计阶段，注册会计师在进行审计时首先要审查和评价被审计单位的（　）", "a": ["内部管理制度", "内部审计制度", "内部控制制度", "企业财务会计制度", "", ""], "r": "C", "e": "抽样审计阶段，注册会计师先审查和评价被审计单位内部控制制度，以确定审计重点和范围。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054510", "t": 1, "q": "国家出台审计准则的主要原因是增强（　）的可信性。", "a": ["会计报表", "会计账簿", "会计档案", "会计凭证", "", ""], "r": "A", "e": "审计准则规范审计工作，审计主要针对会计报表进行审查，出台审计准则可增强会计报表可信性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054511", "t": 1, "q": "23．各种审计依据都有一定的（　），不是任何时期和任何条件下都能适用的。", "a": ["地域性", "局限性", "时效性", "层次性", "", ""], "r": "C", "e": "题干强调审计依据不是任何时期和任何条件都适用，这体现的是其在时间方面的特性，即时效性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054512", "t": 1, "q": "下列程序中，（　）是存货审计最重要、最具有决定性的程序。", "a": ["直接盘点", "函证", "监盘", "观察", "", ""], "r": "C", "e": "存货监盘能为存货的存在、完整性等认定提供证据，是存货审计最重要、最具决定性程序。直接盘点一般由被审计单位执行；函证主要针对往来款项等；观察获取证据有限。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054513", "t": 1, "q": "2.注册会计师审计从起源发展到现在经历了一个较漫长的过程，在审计发展的不同时期，其主要审计目的也在调整。下列关于不同阶段的审计目的的陈述不恰当的是（　）", "a": ["英式注册会计师审计的主要目的是查错防弊", "1929-1933年的世界经济危机后，审计的主要目的是对财务报表发表审计意见，查错防弊转为次要目的", "现代风险导向审计方法确立后，审计工作是审查重要的账户余额或种类交易是否存在重大错报", "美式注册会计师审计的主要目的是判断企业的经营情况", "", ""], "r": "D", "e": "美式注册会计师审计主要目的是对财务报表发表审计意见，而非判断企业经营情况。A选项英式审计主要目的查错防弊正确；B选项经济危机后审计目的转变正确；C选项现代风险导向审计审查重大错报表述也正确。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054514", "t": 1, "q": "注册会计师在审计中发现被审计单位的内部控制存在的问题，应当（　）。", "a": ["在审计业务完成后，以管理建议书的形式反映", "随时向客户有关部门或人员提出，并交换意见", "根据问题的性质确定采取的方式，只有非常严重的内部控制问题，才向客户提出", "因为内部控制不是审计的重要内容，不对此进行说明", "", ""], "r": "B", "e": "注册会计师在审计中发现内部控制问题，应保持职业谨慎，及时与被审计单位沟通。发现问题后随时向客户有关部门或人员提出并交换意见，有助于被审计单位及时改进，也符合审计工作的要求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054515", "t": 1, "q": "注册会计师对盈余公积进行审计时，应当注意盈余公积提取不超过其净利润的（　）。", "a": ["50%", "25%", "30%", "15%", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054516", "t": 1, "q": "（　）是审计的本质特征，也是保证审计工作顺利进行的必要条件。", "a": ["权威性", "合法性", "独立性", "合理性", "", ""], "r": "C", "e": "审计的独立性是其本质特征，只有保持独立，审计人员才能客观公正地进行审查和评价，这也是保证审计工作顺利开展的必要条件。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054517", "t": 1, "q": "如果注册会计师被要求提供第二次意见，应当评价威胁的重要程度，并在必要时采取措施将威胁降低到可接受水平。下列防范措施中不恰当的是（　）", "a": ["在与被审计单位的沟通函件中阐述注册会计师意见的局限性", "向现任注册会计师提供第二次意见的复印件", "征得被审计单位的同意后与现任注册会计师进行沟通", "直接与现任注册会计师进行沟通并向现任注册会计师提供第二次意见的复印件", "", ""], "r": "D", "e": "提供第二次意见通常需先征得被审计单位同意再与现任注册会计师沟通，不能直接沟通。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054518", "t": 1, "q": "以下关于申请设立合伙会计师事务所的条件不恰当的是（　）", "a": ["设立的合伙会计师事务所要有名称", "合伙人必须有书面合伙协议", "要有5名以上的合伙人", "有固定的办公场所", "", ""], "r": "C", "e": "申请设立合伙会计师事务所要求有2名以上合伙人，而非5名以上。A选项有名称、B选项有书面合伙协议、D选项有固定办公场所都是设立合伙会计师事务所的恰当条件。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054519", "t": 1, "q": "10、提交（　）是民间审计人员竭诚为客户提供优质服务的一种表现。", "a": ["审计工作底稿", "审计报告", "审计业务约定书", "管理建议书", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054520", "t": 1, "q": "7．存货成本审计的内容不包括（　）。", "a": ["直接材料成本", "主营业务成本", "管理费用", "制造费用", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054521", "t": 1, "q": "审计人员在对投资业务实施分析性复核程序时，通过计算短期股票投资、长期股权投资、期货等高风险投资所占的比例，可以判断（　）", "a": ["短期投资和长期投资的安全性", "是否存在异常变动", "短期投资和长期投资的真实性", "被审计单位盈利能力的稳定性", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054522", "t": 1, "q": "在实际工作中往往把审阅法与（　）结合运用。", "a": ["函证法", "调节法", "比较法", "核对法", "", ""], "r": "D", "e": "审阅法主要是对资料进行审查和阅读，核对法是对相关资料进行对照核实，二者常结合运用以发现问题。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054523", "t": 1, "q": "在对下列账户的审计中，应将函证作为必要审计程序的是（　）。", "a": ["存货", "应付账款", "固定资产", "应收账款", "", ""], "r": "D", "e": "应收账款函证是证实其存在、权利和义务认定的必要审计程序 。存货主要通过监盘，应付账款一般根据情况决定是否函证，固定资产通常采用实地检查等程序。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054524", "t": 1, "q": "对于未予函证的应收账款，注册会计师应当执行的最有效的审计程序是（　）。", "a": ["进行分析性复核", "审查资产负债表日后的收款情况", "重新测试相关的内部控制制度", "审查与应收账款有关的销货凭证", "", ""], "r": "D", "e": "未函证的应收账款，审查与应收账款有关的销货凭证能直接获取其存在和准确性的证据，是最有效程序。分析性复核不能直接证实应收账款；审查日后收款情况有局限；重新测试内部控制也不能直接证明应收账款。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054525", "t": 1, "q": "注册会计师审计从起源发展到现在经历了一个较漫长的过程，在审计发展的不同时期，其主要审计目的也在调整。下列关于不同阶段的审计目的的陈述不恰当的是（　）", "a": ["1929-1933年的世界经济危机后，审计主要目的是对财务报表发表审计意见，查错防弊转为次要目的", "美式注册会计师审计的主要目的是判断企业的信息情况", "现代风险导向审计方法确立后，审计工作是审查重要的账户余额或种类交易是否存在重大错报", "英式注册会计师审计主要目的是查错防弊", "", ""], "r": "B", "e": "美式注册会计师审计主要目的是判断企业的信用状况，而非信息情况，B选项陈述不恰当。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054526", "t": 1, "q": "注册会计师是否应当承担法律责任的关键是（　）", "a": ["是否查出财务报表所有重大错报", "是否有过失或欺诈行为", "是否按照执业准则的要求执业", "是否查出财务报表所有重大错报、舞弊和违反法律法规", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054527", "t": 1, "q": "13．存货监盘程序所得到的是（　）。", "a": ["口头证据", "实物证据", "书面证据", "环境证据", "", ""], "r": "B", "e": "存货监盘是对存货的实物进行实地查看，所以得到的是实物证据。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054528", "t": 1, "q": "审查应收账款的最重要的实质性程序是（　）。", "a": ["观察", "询问", "函证", "计算", "", ""], "r": "C", "e": "函证能直接获取应收账款真实存在和金额准确性等关键信息，是审查应收账款最重要的实质性程序。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054529", "t": 1, "q": "一般而言，在会计期末短期借款（　）的情况下，或审计人员认为必要时可向银行或其他债权人进行函证。", "a": ["余额正常", "余额较大", "余额较小", "没有余额", "", ""], "r": "B", "e": "函证是为获取更可靠审计证据，短期借款余额较大时，其对财务报表影响大，函证能有效证实借款的真实性、完整性等。所以在余额较大或审计人员认为必要时可进行函证。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054530", "t": 1, "q": "销售与循环业务的起点是（　）", "a": ["抽查", "函证", "顾客提出订单要求", "向顾客提供商品或劳务", "", ""], "r": "C", "e": "销售与收款循环业务，首先是顾客有购买需求提出订单要求，后续才会有提供商品或劳务等环节。抽查和函证是审计程序，并非销售业务起点。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054531", "t": 1, "q": "注册会计师王林负责对甲公司编制的下属子公司K公司2008年度财务报表进行审阅。在与甲公司管理层沟通时，注册会计师王林应当说明这项业务属于（　）", "a": ["其他鉴证业务", "直接报告业务", "合理保证的鉴证业务", "有限保证的鉴证业务", "", ""], "r": "D", "e": "财务报表审阅提供有限保证，这是审阅业务的性质特点。所以注册会计师对财务报表进行审阅属于有限保证的鉴证业务。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054532", "t": 1, "q": "两权分离或经营管理者（　）是审计产生与发展的社会条件。", "a": ["内部协调制", "内部分权制", "内部合作制", "内部集权制", "", ""], "r": "B", "e": "审计产生与发展的社会条件是两权分离或经营管理者内部分权制，有了这种权力分离，才需要审计来监督等。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054533", "t": 1, "q": "银行存款截止测试的关键在于（　）", "a": ["确定被审计单位各银行账户最后一张支票的号码", "检查大额银行存款的收支", "取得并检查银行存款余额调节表", "确定被审计单位当年记录的最后一笔银行存款业务", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054534", "t": 1, "q": "下列与审计证据相关的表述中，正确的是（　）", "a": ["会计记录中含有的信息本身不足以提供充分的审计证据作为对财务报表发表审计意见的基础", "如果审计证据数量足够，就可以弥补审计证据的质量缺陷", "审计工作通常不涉及鉴定文件的真伪，对用途审计证据的文件记录，只需考虑相关内部控制的有效性", "不考虑获取审计证据的成本与获取信息有用性之间的关系", "", ""], "r": "A", "e": "会计记录信息需与其他信息结合才足以作为审计意见基础；审计证据质量缺陷不能靠数量弥补；审计要关注文件真伪等多方面，不能仅考虑内控；获取审计证据要考虑成本与有用性关系。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054535", "t": 1, "q": "总分类账与日记账的记录（　）分工。", "a": ["无须认真", "无须", "必须", "可酌情", "", ""], "r": "C", "e": "总分类账和日记账记录各有重要性和特点，为保证会计记录的准确性等，两者必须分工。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054536", "t": 1, "q": "被审计单位对审计范围进行限定，致使某些重要审计程序无法实施，注册会计师应表述的审计意见应该是（　）", "a": ["保留意见", "否定意见", "无保留意见", "无法表示意见", "", ""], "r": "A", "e": "审计范围受限且重要审计程序无法实施，影响可能重大但不广泛时应发表保留意见。否定意见是财务报表存在重大错报；无保留意见表明财务报表公允反映；无法表示意见是受限影响广泛。本题未提及影响广泛，所以选保留意见。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054537", "t": 1, "q": "32．下列各审计程序中，对查找未入账的应付账款最无效的是（　）。", "a": ["检查在资产负债表日未处理的不相符的购货发票", "函证应付账款", "检查资产负债表日后一至两周内收到的购货发票，确认其入账时间是否正确", "检查资产负债表日后应付账款明细账贷方发生额的相应凭证", "", ""], "r": "B", "e": "函证主要用于证实已记录的应付账款的真实性，对于查找未入账的应付账款效果不佳。而A项未处理发票可能对应未入账应付账款；C项日后收到发票可确认入账时间是否正确来发现未入账情况；D项检查日后贷方发生额凭证也能找出未及时入账的。所以答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054538", "t": 1, "q": "下列关于信息技术一般控制的说法正确的是（　）", "a": ["程序开发需要考虑程序的实施以及企业内部的职责分离", "程序和数据访问这一领域的目标是确保系统能够实现管理层的应用控制目标", "程序变更需要考虑数据的迁移", "计算机运行的目标是确保分配的访问程序和数据的权限是经过论证并经过授权的", "", ""], "r": "A", "e": "B选项程序和数据访问目标是确保只有经过授权的人员才能接触程序和数据；C选项程序变更需考虑变更过程中数据的迁移和准确性等，但这不是程序变更的核心要点；D选项计算机运行目标是确保计算机系统按规定连续正常运行。而程序开发要考虑程序实施和企业内部职责分离，A正确。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528675269054539", "t": 1, "q": "下列属于信赖不足风险的是（　）。", "a": ["根据抽样结果对实际存在重大错报的账户余额得出不存在重大错报的结论", "根据抽样结果对实际不存在重大错报的账户余额得出存在重大错报的结论", "根据抽样结果对内控制度的信赖程度低于其实际应信赖的程度", "根据抽样结果对内控制度的信赖程度高于其实际应信赖的程度", "", ""], "r": "C", "e": "信赖不足风险是关于内部控制的抽样风险，指抽样结果使注册会计师对内控制度的信赖程度低于其实际应信赖的程度。A选项是误受风险；B选项是误拒风险；D选项是信赖过度风险。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842624", "t": 2, "q": "在注册会计师的鉴证业务中，下列属于“预期使用者”的有（　）", "a": ["债权人", "证券交易机构", "管理层", "股东及潜在投资者", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842625", "t": 2, "q": "注册会计师在执行年度财务报表审计业务时，如果遇到下列情形仍然与客户发生了关联，则属于违背了诚信的基本原则（　）", "a": ["注册会计师发现总经理对同一问题的陈述完全相反", "注册会计师发现客户提供的存货永续盘存表有明显的虚假", "注册会计师发现客户提供的应收账款明细账遗漏了许多重要的往来单位", "注册会计师发现客户有一起正在诉讼的法律纠纷而且很可能导致重大违约赔款而未作任何披露", "", ""], "r": "ABCD", "e": "诚信原则要求注册会计师在所有职业关系和商业关系中保持正直和诚实，秉公处事、实事求是。选项ABCD中客户的情况都存在不诚信、虚假或隐瞒等问题，注册会计师若与这样的客户继续关联就违背诚信原则。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842626", "t": 2, "q": "在确定函证对象后，如果J公司不同意对某函证对象进行函证，以下方案中，应选取的有（　）。", "a": ["如果J公司的要求合理，且无法实施替代审计程序，则应视为审计范围受到限制", "如果J公司的要求不合理，且无法实施替代审计程序，则应视为审计范围受到限制", "如果J公司的要求不合理，可以不实施替代审计程序，并将其视为审计范围受到限制", "如果J公司的要求合理，则应当实施替代审计程序", "", ""], "r": "ABD", "e": "若公司要求合理，应实施替代程序，若无法实施替代审计程序，视为审计范围受限；若公司要求不合理，应实施替代审计程序，无法实施时视为审计范围受限。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842627", "t": 2, "q": "按审计范围分类，可以分为（　）。", "a": ["送达审计", "局部审计", "全部审计", "专项审计", "", ""], "r": "BC", "e": "按审计范围分类，有全部审计和局部审计。送达审计是按执行审计的地点分类，专项审计一般不是按审计范围分类。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842628", "t": 2, "q": "审计中对于发现的核算误差，如被审计单位拒绝调整或披露，注册会计师可根据其对财务报表的影响程度发表（　）。", "a": ["保留意见审计报告", "无保留意见审计报告", "否定意见审计报告", "无法表示意见审计报告", "", ""], "r": "AC", "e": "若被审计单位拒绝调整或披露核算误差，当影响程度重大但不具有广泛性时，注册会计师应发表保留意见；若影响重大且具有广泛性，应发表否定意见。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842629", "t": 2, "q": "7.流程图法的局限性是（　）。", "a": ["灵活", "复杂", "直观", "专业素质要求高", "", ""], "r": "BD", "e": "流程图法绘制和理解较复杂，对使用者专业素质要求高，而灵活、直观是其优点。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842630", "t": 2, "q": "在抽样风险中，导致注册会计师执行额外的审计程序，降低审计效率的风险有（　）。", "a": ["误拒风险", "信赖不足风险", "误受风险", "信赖过度风险", "", ""], "r": "AB", "e": "A. 误拒风险指的是注册会计师错误地拒绝了实际上有效的内部控制或财务报表认定，这会导致注册会计师进行更多的测试以验证其有效性，从而降低了审计效率。因此，A选项正确。<br />B. 信赖不足风险是指注册会计师低估了控制的有效性，认为控制不可信赖而增加了实质性测试的数量，这也同样会增加工作量并降低审计效率。因此，B选项正确。<br />C. 误受风险是指注册会计师接受了实际上无效的内部控制或财务报表认定，这种情况虽然影响审计效果（即可能无法发现存在的重大错报），但不会直接导致额外审计程序的执行，故C选项不正确。<br />D. 信赖过度风险是注册会计师高估了控制的效果，可能导致对某些账户余额或交易类型的测试不足，同样影响的是审计效果而非效率，所以D选项也不符合题意。", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842631", "t": 2, "q": "审计的基本职能有（　）", "a": ["经济监督", "经济评价", "经济鉴证", "经济咨询", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842632", "t": 2, "q": "独立性概念框架要求注册会计师采取下列哪些措施来确保独立性的遵循？", "a": ["评价已识别威胁", "识别对独立性的威胁", "采取必要的防范措施", "拒绝客户业务或终止业务", "", ""], "r": "ABCD", "e": "独立性概念框架遵循步骤是先识别对独立性威胁，再评价已识别威胁，然后采取防范措施，若威胁无法消除或降低至可接受水平，才考虑拒绝业务或终止业务。ABCD选项都属于确保独立性遵循的措施。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842633", "t": 2, "q": "具有法律效力的审计报告是（　）。", "a": ["国家审计报告", "民间审计报告", "经济效益审计报告", "财政财务审计报告", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842634", "t": 2, "q": "23、会计咨询、会计服务业务指（　）。", "a": ["代理记账", "代理纳税申报", "验资", "会计报表审计", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842635", "t": 2, "q": "15．会计师事务所对审计工作底稿的复核，可以分为会计师事务所的（　）的复核。", "a": ["分类", "部门经理", "项目经理", "主任会计师", "", ""], "r": "BCD", "e": "审计工作底稿通常有项目经理、部门经理和主任会计师三级复核。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842636", "t": 2, "q": "如果会计师事务所长期委派某位高级职员承担甲客户的审计业务，则应当采取以下防范措施维护独立性（　）", "a": ["轮换审计项目组的高级职员", "进行独立的内部质量复核", "请项目组成员以外的其他注册会计师复核高级职员所做的工作", "增加审计程序以确保审计质量", "", ""], "r": "ABC", "e": "ABC。长期委派高级职员承担某客户审计业务可能因密切关系对独立性产生不利影响，轮换高级职员可避免长期密切接触；独立的内部质量复核和项目组成员以外的其他注册会计师复核能增强独立性监督。而增加审计程序主要是为提高审计质量，与维护独立性无直接关联。 答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842637", "t": 2, "q": "采购与付款循环所涉及的主要凭证和会计记录有（　）。", "a": ["卖方对账单", "买方发票", "请购单", "出库单", "", ""], "r": "AC", "e": "卖方对账单是采购与付款循环中供应商提供的记录交易的单据；请购单是采购申请的凭证，二者都与采购与付款循环相关。买方发票说法错误，一般是卖方开具发票；出库单是存货发出的凭证，与销售等环节相关，和采购与付款循环无关。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842638", "t": 2, "q": "如果会计师事务所要保持一项业务，则应当确定现有的防范措施对于消除对独立性的威胁或将威胁降低到可接受水平是否有效，否则应（　）", "a": ["采取其他防范措施", "终止业务", "拒绝接受", "将审计业务变更为审阅业务", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842639", "t": 2, "q": "在审计实务中，审计人员实施营业收入的截止测试的起点包括（　）。", "a": ["以销售发票为起点", "以账簿记录为起点", "以发运凭证为起点", "以报表为起点", "", ""], "r": "ABC", "e": "审计人员实施营业收入截止测试有三种起点，分别是以销售发票、账簿记录、发运凭证为起点。报表不是截止测试起点。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842640", "t": 2, "q": "中国注册会计师协会会员包括（　）", "a": ["执业注册会计师个人会员", "注册会计师协会团体会员", "会计师事务所团体会员", "非执业会员", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842641", "t": 2, "q": "下列实质性程序中能够证明长期股权投资的“计价和分摊”认定的审计程序有（　）", "a": ["结合长期股权投资减值准备账户，检查其核算是否正确", "获取或编制长期股权明细表，复核加计，并与总账数和明细账合计数核对", "对于长期股权投资分类发生变化的，检查其核算是否正确", "结合银行贷款等的检查，了解长期股权投资是否存在质押、担保情况", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842642", "t": 2, "q": "注册会计师应当从（　）方面了解被审计单位的性质", "a": ["所有权结构", "法律和监管环境", "组织结构", "经营活动、投资活动、筹资活动", "", ""], "r": "ACD", "e": "了解被审计单位性质包括所有权结构、组织结构、经营活动、投资活动、筹资活动等方面，而法律和监管环境属于被审计单位外部环境，并非性质方面。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842643", "t": 2, "q": "如果审计项目组成员与审计客户存在雇佣关系，会计师事务所应当采取的措施可能包括（　）", "a": ["对审计业务进行质量控制复核", "聘请专家协助审计", "对审计项目组以外的其他注册会计师复核已做的工作", "考虑修改审计业务的鉴证计划的适当性或必要性", "", ""], "r": "ACD", "e": "审计项目组成员与审计客户存在雇佣关系会产生独立性等不利影响。对审计业务进行质量控制复核、由审计项目组以外人员复核已做工作以及考虑修改审计业务鉴证计划，都有助于应对这种不利影响。而聘请专家协助审计主要是为解决专业技术问题，与应对雇佣关系带来的不利影响无关。所以答案选ACD。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842644", "t": 2, "q": "具体审计计划应包括下列内容（　）", "a": ["注册会计师计划实施的风险评估程序的性质、时间和范围", "注册会计师需要实施的其他审计程序", "注册会计师难以实施必要审计程序的情形", "注册会计师计划实施的进一步审计程序的性质、时间和范围", "", ""], "r": "ABD", "e": "具体审计计划包括风险评估程序、进一步审计程序（性质、时间和范围）以及其他审计程序。C选项难以实施必要审计程序的情形并非具体审计计划内容。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842645", "t": 2, "q": "注册会计师职业道德的基本要求，包括（　）", "a": ["公正原则", "独立原则", "廉洁原则", "客观原则", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842646", "t": 2, "q": "会计师事务所在违反下列规定和原则，出具虚假记载、误导性陈述或者重大遗漏的审计报告将会认定为不实报告（　）", "a": ["法律法规", "执业准则和规则", "内部控制规范", "诚信公允原则", "", ""], "r": "ABD", "e": "会计师事务所出具不实报告，是指违反法律法规、执业准则和规则以及诚信公允原则，出具虚假记载等审计报告。内部控制规范并非认定不实报告的直接依据。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842647", "t": 2, "q": "注册会计师确定是否有必要实施函证以取得认定层次的充分、适当的审计证据应考虑（　）因素", "a": ["评估的财务报表层次重大错报风险", "评估的认定层次重大错报风险", "被审计单位的经营环境", "实施其他审计程序获取的审计证据", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842648", "t": 2, "q": "下面关于变量抽样的叙述正确的是（　）。", "a": ["用于内部控制符合性测试", "用于账户余额或报表项目的实质性测试", "用来估计总体金额而采用的方法", "测定总体特征的发生频率而采用的方法", "", ""], "r": "BC", "e": "变量抽样主要用于实质性测试，目的是估计总体金额。选项A，用于内部控制符合性测试的是属性抽样；选项D，测定总体特征发生频率也是属性抽样的用途。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842649", "t": 2, "q": "如果会计师事务所在承接审计客户业务时发现与客户之间存在重大商业关系，会计师事务所应当采取下列措施（　）来降低威胁独立性的影响", "a": ["会计师事务所降低商业关系的重要性，使经济利益不重大、商业关系明显不重要", "拒绝执行该审计业务", "出具非标准审计报告", "会计师事务所终止该商业业务", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842650", "t": 2, "q": "审计人员选用审计依据，必须遵循的原则为:（　）．", "a": ["有效性", "辩证性", "针对性", "准确性", "", ""], "r": "ACD", "e": "审计人员选用审计依据需遵循有效性、针对性、准确性等原则。有效性确保依据合法有效；针对性要求依据与审计事项相关；准确性保证依据内容准确。辩证性不是选用审计依据的原则。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842651", "t": 2, "q": "财务费用的实质性程序一般包括（　）。", "a": ["获取或编制财务费用明细表", "检查利息支出明细账", "检查汇兑损失明细账", "检查财务费用是否已在资产负债表上恰当披露", "", ""], "r": "ABCD", "e": "获取或编制明细表可了解财务费用整体情况；检查利息支出、汇兑损失明细账能审查财务费用具体内容；检查在资产负债表上披露情况确保信息披露恰当，ABCD 都是财务费用实质性程序常见内容。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842652", "t": 2, "q": "生产循环的内部控制包括（　）。", "a": ["存货的内部控制", "成本会计制度", "费用的内部控制", "工资的内部控制", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842653", "t": 2, "q": "民间审计组织在就地审计方式下进行财务审计，在准备阶段应做的主要工作包括哪些？", "a": ["初步了解和评价被审计单位的内部控制制度", "收集审计证据", "分析审计风险", "签定审计业务约定书", "", ""], "r": "ACD", "e": "准备阶段主要是为审计工作做前期安排和规划，签定审计业务约定书是明确双方权利义务，是准备阶段重要工作；初步了解和评价内控及分析审计风险是实施阶段开展审计的基础铺垫，也属准备阶段工作。收集审计证据是实施阶段工作。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842654", "t": 2, "q": "19、民间审计人员的法律责任按其形成原因分为（　）", "a": ["民事责任", "行政责任", "刑事责任", "违约责任", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842655", "t": 2, "q": "22．一般情况下，应付账款不需要函证，但出现以下情况时，审计人员还是应当实施函证程序（　）。", "a": ["控制风险较高", "被审计单位处于经济困难时期", "固有风险较高", "应付账款金额较大", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842656", "t": 2, "q": "17．出具保留意见审计报告是因为保留事项的存在，这些保留事项主要是（　）", "a": ["审计证据不充分事项", "审计范围受到局部限制", "会计估计不符事项", "会计政策不符事项", "", ""], "r": "ABCD", "e": "保留意见审计报告的保留事项通常源于审计范围受局部限制、会计处理方法选用不符合规定等。审计证据不充分可能导致审计范围受限；会计估计不符、会计政策不符属于会计处理方面问题。ABCD选项都可能是保留事项。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842657", "t": 2, "q": "我国独立审计基本准则包括（　）。", "a": ["独立审计准则", "独立审计实务公告", "执业规范指南", "独立审计具体准则", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842658", "t": 2, "q": " 下列与控制测试有关的表述中，正确的有（　）", "a": ["如果控制设计不合理，则不必实施控制测试", "如果在评估认定层次重大错报风险时预期控制的运行是有效的，则应当实施控制测试", "如果认为仅实施实质性程序不足以提供认定层次充分、适当的证据，则应当实施控制测试", "对特别风险，即使拟信赖的相关控制没有发生变化，也应当在本次审计中实施控制测试", "", ""], "r": "ABCD", "e": "A 控制设计不合理，内控本身无效，无需做控制测试；B 预期控制有效，应当执行控制测试验证运行有效性；C 仅实质性程序证据不足，必须实施控制测试；D 针对特别风险，无论控制是否变化，本期都要做控制测试。", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842659", "t": 2, "q": "如果由于被审计单位存货的性质或位置等原因导致无法实施存货监盘，注册会计师应当考虑能否实施替代审计程序，这些替代审计程序主要包括（　）。", "a": ["向顾客或供应商函证", "检查资产负债表日后付款凭证", "检查资产负债表日后发生的销货交易凭证", "检查进货交易凭证或生产记录以及其他相关资料", "", ""], "r": "ABCD", "e": "当无法实施存货监盘时，ABCD选项的方法都能在一定程度上获取关于存货的审计证据，向顾客或供应商函证可确认存货的所有权等情况；检查资产负债表日后付款凭证能了解存货采购付款情况；检查资产负债表日后销货交易凭证可推断存货的销售情况；检查进货交易凭证或生产记录等资料能掌握存货的来源和生产情况。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842660", "t": 2, "q": "如果会计师事务所长期委派某位高级职员承担甲客户的审计业务，则应当采取以下防范措施维护独立性（　）", "a": ["进行独立的内部质量复核", "轮换审计项目组的高级职员", "请项目组成员以外的其他注册会计师复核高级职员所做的工作", "立即撤出该项审计业务", "", ""], "r": "ABC", "e": "长期委派高级职员承担审计业务可能影响独立性，轮换审计项目组高级职员、进行独立内部质量复核、请项目组成员以外人员复核工作都可防范，而立即撤出业务过于极端。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842661", "t": 2, "q": "注册会计师因为以下原因可能导致承担法律责任的有（　）", "a": ["欺诈", "重大过失", "违约", "行政责任", "", ""], "r": "ABC", "e": "注册会计师承担法律责任的原因包括违约、过失（重大过失等）、欺诈。行政责任是法律责任的一种类型，并非导致承担法律责任的原因。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842662", "t": 2, "q": "如果会计师事务所长期委派某位高级职员承担甲客户的审计业务，则应当采取以下防范措施维护独立性（　）", "a": ["请项目组成员以外的其他注册会计师复核该高级职员所做的工作", "进行独立的内部质量复核", "轮换审计项目组的高级职员", "立即撤出该项审计业务", "", ""], "r": "ABC", "e": "长期委派同一高级职员承担审计业务会因密切关系对独立性产生不利影响，可通过请其他注册会计师复核、进行内部质量复核、轮换高级职员等措施防范。立即撤出审计业务过于极端。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842663", "t": 2, "q": "下列情形中属于产生过度推介威胁的是（　）", "a": ["会计师事务所过分依赖向某一客户收费", "会计师事务所推介审计客户的股份", "注册会计师在被审计单位与第三方发生诉讼或纠纷时担任客户的辩护人", "审计项目负责人与鉴证客户存在重要的密切关系", "", ""], "r": "BC", "e": "过度推介威胁指注册会计师过度推介客户或雇佣单位的某种立场或意见，使其客观性受到损害。B是直接推介客户股份；C在诉讼中担任辩护人，也是过度推介客户立场。A属于自身利益威胁，D属于密切关系威胁。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842664", "t": 2, "q": "10.内部控制总评的要点是（　）。", "a": ["健全性和科学性", "合理性和可行性", "层次性和适用性", "经济性和协调性", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842665", "t": 2, "q": "注册会计师应当在下列环节进行初步业务活动（　）", "a": ["及时签订或修改审计业务约定书", "了解被审计单位及其环境评估重大错报风险", "评价遵守职业道德规范的情况", "针对保持客户关系和具体审计业务实施质量控制程序", "", ""], "r": "ACD", "e": "初步业务活动包括针对保持客户关系和具体审计业务实施质量控制程序、评价遵守职业道德规范的情况、就审计业务约定条款达成一致意见并及时签订或修改审计业务约定书。B选项了解被审计单位及其环境评估重大错报风险是风险评估程序，不属于初步业务活动。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842666", "t": 2, "q": "注册会计师因为以下原因可能导致承担法律责任的有（　）", "a": ["重大过失", "违约", "欺诈", "行政责任", "", ""], "r": "ABC", "e": "注册会计师承担法律责任的原因通常包括违约、过失（重大过失属于过失范畴）和欺诈。行政责任是法律责任的一种类型，而非导致承担法律责任的原因。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842667", "t": 2, "q": "审计的基本特征可以概括为（　）", "a": ["公正性", "独立性", "合理性", "权威性", "", ""], "r": "BD", "e": "审计的基本特征为独立性和权威性。独立性是审计的本质特征，保证审计工作客观公正；权威性源于法律赋予的权力和自身工作的客观性。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842668", "t": 2, "q": "会计师事务所在违反下列规定和原则，出具虚假记载、误导性陈述或者重大遗漏的审计报告将会认定为不实报告（　）", "a": ["诚信公允原则", "内部控制规范", "执业准则和规则", "法律法规", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842669", "t": 2, "q": "下列关于重大错报风险的识别和评估的说法中，正确的是（　）", "a": ["注册会计师应当在了解被审计单位及其环境的整个过程中识别风险", "注册会计师在评估重大错报风险时，可以不考虑相关的内部控制", "注册会计师应当确定识别的重大错报风险是与财务报表整体相关，进而影响多项认定，还是与特定的交易、账户余额、列报的认定相关", "在评估重大错报风险时，注册会计师应当将所了解的控制与特定认定相联系", "", ""], "r": "ACD", "e": "注册会计师需在了解被审计单位及其环境时识别风险，要考虑内部控制，应确定重大错报风险与财务报表整体或特定认定的相关性，且要将控制与特定认定相联系。B选项不考虑内部控制错误。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842670", "t": 2, "q": "注册会计师在审计业务活动中，如果存在下列情形之一，将会以不实报告给利害关系人造成损失为由追究连带责任（　）", "a": ["被审计单位示意作不实报告，而不予拒绝", "明知被审计单位对重要事项的财务会计处理直接损害利害关系人的利益，而予以隐瞒或作不实报告", "明知被审计单位对重要事项的财务会计处理与国家有关规定相抵触，而不予指明", "与被审计单位恶性串通", "", ""], "r": "ABCD", "e": "ABCD选项均是注册会计师在审计业务中严重违反职业操守，与被审计单位有不当互动或故意隐瞒、违规操作，会以不实报告给利害关系人造成损失，应追究连带责任。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842671", "t": 2, "q": "关于审计的分类可以从不同的角度加以考察，下列对审计的分类表述恰当的是（　）", "a": ["审计按与被审计单位的关系不同可分为内部审计和外部审计", "审计按内容的不同可分为财务报表审计、经营审计和合规性审计", "审计按主体的不同可分为政府审计、内部审计和注册会计师审计", "审计按目的的不同可分为合理保证审计和有限责任审计", "", ""], "r": "ABC", "e": "审计分类常见有按主体分、按目的和内容分等。按主体分有政府审计、内部审计和注册会计师审计；按目的和内容分有财务报表审计、经营审计和合规性审计；按与被审计单位关系分有内部审计和外部审计。合理保证和有限保证是按照鉴证业务的保证程度分类，不是按目的分类。ABC表述均符合审计分类标准。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842672", "t": 2, "q": "以下哪些物品应当被禁止无关人员接触？", "a": ["办公用品", "支票", "报表", "现金", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842673", "t": 2, "q": "独立性概念框架要求注册会计师争取下列措施来确保独立性的遵循", "a": ["必要的防范措施", "评价已识别威胁", "识别对独立性的威胁", "拒绝客户业务或终止业务", "", ""], "r": "ABC", "e": "独立性概念框架步骤为识别对独立性的威胁、评价已识别威胁、采取必要防范措施应对威胁，若无法消除或降至可接受水平才考虑拒绝或终止业务。所以答案选ABC。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842674", "t": 2, "q": "8．进行符合性测试一般可以采用的方法有（　）", "a": ["观察法", "询问法", "实际执行法", "检查法", "", ""], "r": "ABCD", "e": "符合性测试是为确定内部控制的设计和执行是否有效而实施的审计程序，观察法可看业务执行情况，询问法能了解内控流程，检查法可查相关文件记录，实际执行法可验证内控效果，ABCD 都是常用方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842675", "t": 2, "q": "中国注册会计师协会会员包括（　）", "a": ["执业注册会计师个人会员", "会计师事务所团体会员", "注册会计师协会团体会员", "非执业会员", "", ""], "r": "ABD", "e": "中国注册会计师协会会员包括执业注册会计师个人会员、非执业会员，同时会计师事务所作为团体可成为团体会员。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842676", "t": 2, "q": "如果审计项目组成员与审计客户存在雇佣关系，会计师事务所应当采取的措施可能包括（　）", "a": ["对审计业务进行质量控制复核", "考虑修改审计业务的鉴证计划的适当性或必要性", "对审计项目组以外的其他注册会计师复核已做的工作", "聘请专家协助审计", "", ""], "r": "ABC", "e": "审计项目组成员与审计客户存在雇佣关系会产生不利影响，采取质量控制复核、修改鉴证计划、让项目组外其他注册会计师复核工作等措施可降低影响。聘请专家协助审计与该雇佣关系不利影响的应对关联不大。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842677", "t": 2, "q": "根据《公司法》和《证券法》，下列公司必须由会计师事务所进行审计的有（　）", "a": ["上市公司财务报表", "一人有限责任公司编制的财务报表", "首次公开发行股票公司连续3年的财务报表", "不设监事会的公司的监事发现公司经营情况异常时", "", ""], "r": "ABC", "e": "上市公司、首次公开发行股票公司的财务报表按规定需审计；一人有限责任公司财务报表也须经审计。而不设监事会公司监事发现异常，可调查，必要时才聘请会计师事务所审计，并非必须。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842678", "t": 2, "q": "对以下注册会计师审计理解的陈述中，恰当的有（　）", "a": ["注册会计师在财务报表审计中应根据被审计单位所采用的企业会计准则和相关会计制度来判断其财务报表编制是否合法，财务报表反映的内容是否公允。", "注册会计师对财务报表审计的核心环节是对财务报表重大错报风险的“识别、评估和应对”。", "注册会计师必须收集基于认定的充分适当的审计证据才能对财务报表发表审计意见。", "注册会计师在财务报表审计中必须查出财务报表中所有舞弊。", "", ""], "r": "ABC", "e": "A选项，注册会计师依据准则判断报表合法性与公允性合理；B选项，识别、评估和应对重大错报风险是审计核心环节；C选项，收集充分适当审计证据是发表审计意见的必要条件。而D选项，注册会计师只能合理保证发现重大舞弊，而非查出所有舞弊。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842679", "t": 2, "q": "注册会计师审计方法的发展经历了以下哪些阶段（　）", "a": ["以内部控制测试为基础的抽样审计为特征的制度基础审计", "以重大错报风险的识别、评估、应对为审计工作主线的风险导向审计", "以会计凭证和账簿的详细检查为特征的账项基础审计", "以被审计单位是否遵守了特定的法律、法规、程序或规则为特征的例规性审计", "", ""], "r": "ABC", "e": "注册会计师审计方法发展经历了账项基础审计、制度基础审计、风险导向审计阶段。账项基础审计以详细检查会计凭证和账簿为特征；制度基础审计以内部控制测试为基础进行抽样审计；风险导向审计以重大错报风险的识别、评估、应对为主线。而例规性审计并非审计方法发展阶段。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842680", "t": 2, "q": "按审计地点分类，可以分为（　）。", "a": ["强制审计", "民间审计", "送达审计", "就地审计", "", ""], "r": "CD", "e": "按审计地点分类有送达审计和就地审计。送达审计是被审计单位将资料送到审计机构接受审计；就地审计是审计人员到被审计单位所在地进行审计。A选项强制审计是按审计的执行强制性分类；B选项民间审计是按审计主体分类。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842681", "t": 2, "q": "7、没有法律效力的审计报告有（　）。", "a": ["内部审计报告", "民间审计报告", "国家审计报告", "部门审计报告", "", ""], "r": "AD", "e": "内部审计报告和部门审计报告主要用于单位内部，不具有对外的法律效力。民间审计报告具有鉴证作用，有法律效力；国家审计报告可作为行政决定依据，有法律效力。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528679106842682", "t": 2, "q": "审计证据按形式分类，可分为（　）。", "a": ["实物证据", "书面证据", "口头证据", "环境证据", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390144", "t": 3, "q": "在对主营业务收入进行截止测试时，若以销售发票的日期为起点，既可以按照会计处理的顺序追查账簿记录，从而防止少计收入，又可以逆着会计处理顺序追查发运凭证的日期，从而防止多计收入。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390145", "t": 3, "q": "只要取得了注册会计师资格就可以执行独立审计业务，并签署审计报告。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "注册会计师需加入会计师事务所才能执行独立审计业务并签署审计报告，仅取得资格不行。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390146", "t": 3, "q": "详查法的优点是节约人力、物力和时间。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "详查法要对全部经济业务和会计资料进行详细审查，工作量大，会耗费较多人力、物力和时间，并非节约。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390147", "t": 3, "q": "如果注册会计师识别的错报风险是财务报表层次的重大错报风险，则应当派更有经验或具有特殊技能的注册会计师，或利用专家的工作。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "财务报表层次的重大错报风险影响广泛，需采取总体应对措施，派更有经验或有特殊技能人员、利用专家工作是应对手段。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390148", "t": 3, "q": "审计机关一般是对有问题的单位履行监督职能。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计机关的监督职能是全面的，并非只针对有问题的单位，要对各类单位的财政、财务收支等进行监督。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390149", "t": 3, "q": "当个别重要事项无法取得证据时，就应拒绝表示意见。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "个别重要事项无法取得证据，不一定就拒绝表示意见，还可能发表保留意见等，要根据该事项对财务报表的影响程度判断。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390150", "t": 3, "q": "所谓审计工作底稿三级复核制度，就是审计机构制定的以主任会计师、部门经理和项目经理为复核人，对审计工作底稿进行逐级复核的一种复核制度。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计工作底稿三级复核制度通常就是由主任会计师、部门经理和项目经理作为复核人，对工作底稿进行逐级复核。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390151", "t": 3, "q": "一般而言，内部证据不如外部证据可靠，但已经获得第三者确认的内部证据，则具有较强的可靠性。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "通常外部证据因来自独立第三方，受被审计单位影响小所以更可靠。而内部证据经第三者确认后，其可靠性因有外部验证得以增强。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390152", "t": 3, "q": "审计人员在审计过程中，只有合理地运用符合性测试和实质性测试，才能取得审计准则所要求的充分适当的证据，在有些情况下也可以完全依赖实质性程序来获取审计证据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计中合理运用符合性测试和实质性测试能获充分适当证据，当内控无效等情况时可完全依赖实质性程序获取证据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390153", "t": 3, "q": "如果初步评估的控制风险水平越低，审计人员就应获取越少的关于内部控制设计合理和运行有效的证据。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "初步评估控制风险水平越低，意味着审计人员越信赖内部控制，就需要获取更多证据来证明内部控制设计合理且运行有效。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390154", "t": 3, "q": "进行应付账款函证时，审计应选择的函证对象是较大金额的债权人，那些在资产负债表日金额为零的债权人不必函证。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在资产负债表日金额为零的债权人也可能存在低估负债情况，所以也可能需要函证，并非不必函证。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390155", "t": 3, "q": "根据“资产=负债＋所有者权益”这一平衡原理，可以清楚地看出，如果审计人员能够对企业的资产和负债进行充分的审查，证明二者的期初余额、期末余额和本期变动都是正确的，那就不必对所有者权益进行单独的审计。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390156", "t": 3, "q": "注册会计师只将审计报告送给被审计单位。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计报告并非只送给被审计单位，还可能会提供给股东、债权人、监管机构等其他利益相关者。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390157", "t": 3, "q": "错误是由于会计人员及有关当事人的非故意行为而造成的，由于不具有主观的不良动机，通常可以采用相应措施加以预防。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "错误一般是会计人员等非故意造成，无不良动机，能通过完善制度、加强培训等措施预防。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390158", "t": 3, "q": "错误是由于会计人员及有关当事人的故意行为而造成的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "错误是由于会计人员及有关当事人的非故意行为造成的，而故意行为造成的是舞弊。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390159", "t": 3, "q": "无保留意见意味着审计人员认为会计报表的反映是恰当的，能够满足非特定多数的利害关系人的共同需要，并对表示的意见负责。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "无保留意见表明审计人员经过审计后，认为被审计单位会计报表的编制符合会计准则和相关会计制度的规定，在所有重大方面公允反映了被审计单位的财务状况、经营成果和现金流量，能满足非特定多数利害关系人共同需要，且审计人员要对所发表意见负责。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390160", "t": 3, "q": "审计重要性水平越高，所需的审计证据越少。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "重要性水平界定<br />审计重要性水平是注册会计师设定的可容忍错报上限。<br />该数值与审计风险呈反向关系：水平越高，表明可接受的错报金额越大，审计风险越低。<br />证据规模推导<br />根据审计风险模型，审计风险降低需通过扩大审计范围或增加证据来实现。反之，当重要性水平设定较高时，所需审计证据的规模相应减少，以提高审计效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390161", "t": 3, "q": "审计报告应由会计师事务所和注册会计师双重签署后，直接提供给委托人。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计报告需由会计师事务所盖章、注册会计师签名并盖章后提供给委托人，表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390162", "t": 3, "q": "委托人或第三者因使用审计报告不当或误解审计报告所造成的后果，应由使用者或误解者自己负责，与注册会计师及所在的会计师事务所无关。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计报告是注册会计师对被审计单位财务报表发表审计意见的书面文件，使用者应正确使用和理解。因不当使用或误解造成的后果，责任不在注册会计师及事务所。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390163", "t": 3, "q": "地方审计机关对本级人民政府和审计署负责。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390164", "t": 3, "q": "无论是国家审计、内部审计、民间审计，在审计开始前，审计机构都要与被审计单位签订审计业务约定书。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国家审计是代表国家依法进行的审计，具有强制性，无需与被审计单位签订审计业务约定书；内部审计是单位内部的监督活动，也不存在签订业务约定书的情况；只有民间审计（注册会计师审计）在审计开始前需与被审计单位签订审计业务约定书。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390165", "t": 3, "q": "舞弊在形式上具有隐蔽性，发生后一般不易被察觉，必须通过有关专门技术和方法才有可能查明。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "舞弊行为通常会采取各种手段来掩盖，具有隐蔽性特点，常规方式难以发现，往往需借助专门技术和方法来查明。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390166", "t": 3, "q": "内部控制可以防止所有的错误与舞弊。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "内部控制有局限性，不能防止所有错误与舞弊。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390167", "t": 3, "q": "如果内部控制制度严密健全，就可以防止任何差错与舞弊的发生。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "内部控制有局限性，即便制度严密健全，也无法杜绝所有差错和舞弊。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390168", "t": 3, "q": "特殊情况下，单位取得的货币资金收入可以不入账，设立“小金库”。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单位取得的货币资金收入必须入账，设立“小金库”是违反财经纪律的行为，会导致财务混乱、滋生腐败等问题，所以该表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390169", "t": 3, "q": "函询法是通过向有关单位发函了解情况取得证据的一种方法，这种方法一般用于往来款项的查证。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "函询法就是发函了解情况并获取证据，常用于往来款项查证以确认其真实性、正确性等。", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390170", "t": 3, "q": "长期借款的利息支出和有关费用，不管其与购置固定资产是否有关，都应计入当期损益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。与购建固定资产有关的长期借款利息支出，在固定资产达到预定可使用状态前应予以资本化计入资产成本，而不是都计入当期损益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390171", "t": 3, "q": "受托经济责任关系是审计产生的客观基础。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计是因受托经济责任关系的产生而产生，当财产所有者将财产委托给他人代管或经营时，为监督受托人履行职责情况，就产生了审计需求，所以受托经济责任关系是审计产生的客观基础。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390172", "t": 3, "q": "审计的主要内容是指财务收支及有关经济活动。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计是对被审计单位的财政、财务收支及有关经济活动的真实性、合法性和效益性进行审查。所以审计主要内容包含财务收支及有关经济活动，该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390173", "t": 3, "q": "审计人员向被审计单位员工询问后形成的记录属于书面证据。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计人员向被审计单位员工询问后形成的记录是通过询问获取的，属于口头证据，并非书面证据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390174", "t": 3, "q": "口头证据是注册会计师通过提问从被审计单位有关人员得到的口头答复而形成的证据。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "口头证据就是注册会计师通过向被审计单位相关人员提问并获取口头答复所形成的证据。所以表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390175", "t": 3, "q": "独立审计基本准则不具有强制性，注册会计师执业规范指南具有强制性。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "独立审计基本准则具有强制性，注册会计师执业规范指南不具有强制性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528680176390176", "t": 3, "q": "属性抽样用于报表项目的审计。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "属性抽样主要用于控制测试，变量抽样用于报表项目的审计。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 审计学（3）", "n": "基础练习题【含解析】 / 第3章 审计学（3）", "qs": [{"id": "2034528685767397376", "t": 1, "q": "甲公司2009年度的借款规模、存款规模分别与2008年度基本持平，但财务费用比2008年度有所下降。甲公司提供的以下理由中，不能解释财务费用变动趋势的是（　）", "a": ["根据甲公司与开户银行签订的存款协议，从2009年7月份起，甲公司在开户银行的存款余额超过100万元的部分所适用的银行存款利率上浮0.5％", "甲公司于2008年1月初借入3年期的工程项目专门借款1000万元，该工程项目于2009年1月开始建设，预计在2009年6月份完工", "甲公司在2009年度以美元结算的货币性负债的金额一直大于以美元结算的货币性资产金额。人民币对美元的汇率在2009年度上半年保持稳定，从2009年度下半年开始有较大的上升", "为了缓解流动资金紧张的压力，甲公司从2009年4月份增加了银行承兑汇票的贴现规模", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397377", "t": 1, "q": "如果审计项目组成员作为审计客户的经理或董事，则应当采取有效的防范措施维护独立性。以下表述不正确的是（　）", "a": ["为支持公司秘书性职能而提供的常规的咨询工作，只要所有的相关决策是由客户的管理层做出的，通常不会被认为有损独立性。", "如果会计师事务所的合伙人或员工成为审计客户的公司秘书，则没有防范措施消除威胁或将威胁降低到可接受水平。", "如果会计师事务所的合伙人或员工成为审计客户的经理或董事，则没有防范措施消除威胁或将威胁降低到可接受水平。", "如果会计师事务所的高级管理人员为审计客户的公司秘书，则应将其调离该项目组，以维护独立性。", "", ""], "r": "D", "e": "本题主要考查审计项目组成员担任审计客户的经理或董事时对独立性的影响及防范措施。 选项A：为支持公司秘书性职能提供常规咨询工作，且决策由客户管理层做出，一般不会损害独立性，该项表述正确。 选项B：会计师事务所的合伙人或员工成为审计客户的公司秘书，会对独立性产生重大不利影响，且没有防范措施消除威胁或将威胁降低到可接受水平，该项表述正确。 选项C：会计师事务所的合伙人或员工成为审计客户的经理或董事，会产生重大的自我评价和自身利益威胁，没有防范措施能消除威胁或将威胁降低到可接受水平，该项表述正确。 选项D：如果会计师事务所的高级管理人员为审计客户的公司秘书，这种情况对独立性的威胁非常重大，仅将其调离项目组并不能消除威胁，所以该项表述错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397378", "t": 1, "q": "审计人员发现被审计单位改变了存货的计价方法，但并未在报表中充分反映这一变化带来的影响，这时审计人员应该表示（　）。", "a": ["无法表示意见", "否定意见", "无保留意见", "保留意见", "", ""], "r": "D", "e": "被审计单位改变存货计价方法却未在报表充分反映影响，这属于会计处理存在重大问题但不影响整体报表公允性。保留意见适用于存在影响重大但不具有广泛性的错报。所以应选保留意见。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397379", "t": 1, "q": "43.下列关于期初余额审计的说法中正确的是（　）", "a": ["只有被审计单位首次接受审计时才需进行", "无需专门实施审计程序", "需要考虑其审计结论对本期财务报表的影响", "需要专门发表审计意见", "", ""], "r": "C", "e": "期初余额审计并非仅在首次接受审计时进行，A错误；要专门实施审计程序获取审计证据，B错误；一般不对期初余额专门发表审计意见，D错误；期初余额审计需考虑其审计结论对本期财务报表的影响。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397380", "t": 1, "q": "在生产循环审计中，注册会计师常通过前后各期、本年各月的存货余额及其构成的简单比较来确定期末存货余额及其构成的（　）。", "a": ["估价的合理性", "总体合理性", "真实性", "完整性", "", ""], "r": "B", "e": "通过前后各期、本年各月存货余额及其构成的简单比较，可从整体层面初步判断期末存货余额及其构成是否合理，是对总体合理性的审查。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397381", "t": 1, "q": "经济利益是指从某一实体的股票、债券、其他证券以及贷款和其他债务工具中获得的利益，包括直接经济利益和间接经济利益。下列对直接经济利益的判断正确的是（　）", "a": ["注册会计师在审计客户中通过房地产拥有的经济利益是直接经济利益", "注册会计师在审计客户中拥有的能够直接控制的经济利益是直接经济利益", "注册会计师在审计客户中通过信托拥有的经济利益是直接经济利益", "注册会计师在审计客户中通过集合投资工具拥有的经济利益是直接经济利益", "", ""], "r": "B", "e": "直接经济利益是指注册会计师在审计客户中拥有的能够直接控制的经济利益。A选项通过房地产拥有的利益不一定是直接控制；C选项通过信托拥有的利益通常不是直接控制；D选项通过集合投资工具拥有的利益也不是直接控制。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397383", "t": 1, "q": "在对总体进行分层的情况下，注册会计师不宜使用的抽样方法是（　）", "a": ["概率比例规模抽样", "比率估计抽样", "差额估计抽样", "均值估计抽样", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397384", "t": 1, "q": "从独立的角度来看，在我国审计监督体系中，政府审计（　）", "a": ["仅与被审计单位独立，不与委托者独立", "与审计委托者和被审计单位均独立", "与审计委托者和被审计单位均不独立", "仅与委托者独立，不与被审计单位独立", "", ""], "r": "A", "e": "政府审计是由政府审计机关代表政府依法进行的审计，它独立于被审计单位，不过政府审计机关需对政府负责，并不完全独立于委托者（政府）。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397385", "t": 1, "q": "下列关于统计抽样说法正确的是（　）。", "a": ["统计抽样不需要职业判断", "可以定量控制抽样风险", "统计抽样取得的证据证明力更强", "统计抽样不存在非抽样风险", "", ""], "r": "B", "e": "统计抽样需要职业判断，A错；抽样证据的证明力强弱与抽样方法无关，C错；非抽样风险与抽样方法无关，统计抽样也存在，D错；统计抽样能利用概率法则来定量控制抽样风险，B正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397386", "t": 1, "q": "法人重组可促使（　）发生转化。", "a": ["人员", "行为", "风险", "控制", "", ""], "r": "C", "e": "法人重组会改变企业的组织架构、业务模式等，这使得原本的风险状况也随之改变，会促使风险发生转化。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397387", "t": 1, "q": "5.审计的最基本的职能是（　）。", "a": ["经济评价", "经济司法", "经济监察", "经济监督", "", ""], "r": "D", "e": "审计主要是对被审计单位的财政、财务收支等进行监督检查，以保证其真实性、合法性和效益性，经济监督是其最基本职能。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397388", "t": 1, "q": "审计程序的内容有（　）。", "a": ["准备阶段", "调查阶段", "检查阶段", "报告阶段", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397389", "t": 1, "q": "注册会计师实施存货监盘程序的主要目的是为了（　）。", "a": ["鉴定存货的质量", "获得存货是否实际存在的证据", "查明客户是否漏盘某些重要的存货项目", "了解盘点指示是否得到贯彻执行", "", ""], "r": "B", "e": "存货监盘主要是为了获取存货实际存在的证据。A选项鉴定存货质量不是监盘主要目的；C选项查明漏盘项目是为确定存货存在服务；D选项了解盘点指示执行情况也是辅助确定存货存在。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397390", "t": 1, "q": "（　）是内部控制的描述方法。", "a": ["逆查法", "流程图法", "抽查法", "鉴定法", "", ""], "r": "B", "e": "内部控制描述方法主要有文字说明法、调查表法和流程图法。逆查法、抽查法是审计方法，鉴定法用于对某些事项进行鉴别和评定。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397391", "t": 1, "q": "职业道德守则要求会员保持实质上和形式上的独立性，以下关于独立性的陈述不正确的是（　）", "a": ["如果会员在形式上不独立，则很可能被推定为其诚信、客观性或职业怀疑态度已经受到损害", "实质上的独立性要求会员不能与客户之间存在任何形式的经济利益关系", "实质上的独立性要求注册会计师在提出结论时不受损于职业因素影响", "注册会计师在执行鉴证业务时必须在实质上独立和形式上独立", "", ""], "r": "B", "e": "实质上独立性并非要求会员不能与客户有任何经济利益关系，而是要求不受有损职业判断因素影响，B选项说法太绝对。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397392", "t": 1, "q": "注册会计师在进行实质性测试时，可以不必索取或自行编制明细表的项目是（　）。", "a": ["股本", "实收资本", "资本公积", "盈余公积", "", ""], "r": "D", "e": "通常股本、实收资本、资本公积这类科目在实质性测试时，一般需索取或编制明细表以清晰反映其变动等情况。而盈余公积相对变动较少且核算相对简单，注册会计师进行实质性测试时可不必索取或自行编制明细表。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397393", "t": 1, "q": "审查利润分配时，对于逾期纳税而支付的滞纳金应作为（　）。", "a": ["税后利润分配项目", "产品销售税金及附加", "从净利润中扣除项目", "营业外支出", "", ""], "r": "D", "e": "逾期纳税支付的滞纳金不属于正常经营活动支出，应计入营业外支出。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397394", "t": 1, "q": "外部审计包括（　）和民间审计。", "a": ["单位审计", "责任审计", "国家审计", "法纪审计", "", ""], "r": "C", "e": "外部审计是指由审计机关派去的审计人员或社会审计机构对被审计单位的经济业务活动的合理性、合法性、准确性、真实性和效益性所进行的审查，并对审查结果作出客观公正的评价。外部审计包括国家审计和民间审计。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397395", "t": 1, "q": "注册会计师对乙公司2008年度财务报表出具审计报告的日期为2009年2月15日，乙公司对外报出的财务报表的日期为2009年2月20日。在完成审计档案归整工作后，可以变动工作底稿的是（　）", "a": ["2009年5月10日法院对涉讼的专利侵权案作出最终判决，乙公司赔偿原告2000万元。2008年12月31日该案件尚在审理过程中，由于无法合理估计赔偿金额，乙公司在2008年度财务报表中对这一事项作了充分披露，未确认预计负债", "2009年5月5日乙公司发生火灾，烧毁一生产车间，导致生产全部停工", "2009年5月20日乙公司收回一笔2007年已经注销的应收账款，金额为1000万元", "2009年5月15日注册会计师知悉乙公司2008年12月31日已存在的、可能导致修改审计报告的舞弊行为", "", ""], "r": "D", "e": "会计师事务所应当自审计报告日起，对审计工作底稿至少保存10年。在完成最终审计档案的归整工作后，有两种情形可变动审计工作底稿：一是注册会计师已实施了必要的审计程序，取得了充分、适当的审计证据并得出了恰当的审计结论，但审计工作底稿的记录不够充分；二是审计报告日后发现例外情况要求注册会计师实施新的或追加审计程序，或导致注册会计师得出新的结论。选项A属于期后事项，在当时已充分披露，无需变动底稿；选项B是资产负债表日后非调整事项，不影响已审计报表，无需变动；选项C收回已注销应收账款与2008年报表无直接关系，无需变动；选项D注册会计师知悉2008年已存在可能导致修改审计报告的舞弊行为，需变动底稿。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397396", "t": 1, "q": "7、下面有关审计的职能叙述错误的是（　）。", "a": ["经济鉴证只能表现在民间审计中", "经济评价和经济鉴证是经济监督的演进和发展", "经济鉴证侧重于证明经济活动的真实性和准确性", "经济监督是最基本的职能", "", ""], "r": "A", "e": "经济鉴证不仅表现在民间审计中，国家审计和内部审计也有一定的经济鉴证职能，A选项说法错误。经济评价和经济鉴证是经济监督的演进和发展，经济鉴证侧重证明经济活动真实性和准确性，经济监督是审计最基本职能，B、C、D表述正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397397", "t": 1, "q": "注册会计师对行业状况、环境与监管环境以及其他外部因素了解的范围和程度会因被审计单位所处行业、规模以及其他因素的不同而不同，注册会计师应当将了解的重点放在（　）", "a": ["风险评估程序", "对被审计单位的经营活动可能产生重要影响的关键外部因素以及与前期相比发生的重大变化", "重大错报风险", "重大错报风险和检查风险", "", ""], "r": "B", "e": "注册会计师了解行业状况等外部因素，重点应关注对被审计单位经营活动有重要影响的关键外部因素及与前期的重大变化。A选项风险评估程序是了解这些因素的手段；C选项重大错报风险是了解后的评估结果；D选项检查风险与了解外部因素重点无关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397398", "t": 1, "q": "信息系统对控制的影响，取决于（　）", "a": ["被审计单位人工控制和自动化控制运用的比例", "被审计单位对手工控制的依赖程度", "被审计单位对信息系统的依赖程度", "被审计单位内部控制的效果", "", ""], "r": "C", "e": "信息系统对控制的影响主要看被审计单位对信息系统依赖程度，依赖程度不同影响不同。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397399", "t": 1, "q": "下列各项中，不能帮助注册会计师判断审计证据是否充分的因素是（　）。", "a": ["控制测试的时间", "审计团队的专业经验", "具体审计项目的重要程度", "审计过程中是否发现错误或舞弊", "", ""], "r": "A", "e": "审计证据充分性受重大错报风险和审计证据质量影响。A选项控制测试时间与审计证据是否充分无直接关联；B专业经验会影响对证据充分性判断；C项目重要程度影响所需证据数量；D发现错误或舞弊会增加所需证据量。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397400", "t": 1, "q": "职业道德守则要求会员保持实质上和形式上的独立性，以下关于独立性的陈述不正确的是（　）", "a": ["实质上的独立性要求注册会计师在提出结论时不受职业因素影响", "注册会计师在执行鉴证业务时必须在实质上独立和形式上独立", "实质上的独立性要求会员不能与客户之间存在任何的经济利益关系", "如果会员在形式上不独立，则很可能被推定为其诚信、客观性或职业怀疑态度已经受到损害", "", ""], "r": "C", "e": "实质上的独立性是不受自身利益和外界压力影响，并非不能与客户有任何经济利益关系，适度经济利益可采取防范措施保持独立。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397401", "t": 1, "q": "注册会计师执行的下列业务中，保证程度最高的是（　）", "a": ["财务报表审阅", "对财务信息执行的商定程序", "代编财务信息", "财务报表审计", "", ""], "r": "D", "e": "财务报表审计是合理保证业务，保证程度高；财务报表审阅是有限保证；对财务信息执行商定程序和代编财务信息都不提供保证。所以保证程度最高的是财务报表审计。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397402", "t": 1, "q": "以下审计程序中，不属于分析程序的是（　）", "a": ["根据增值税申报表估算全年主营业务收入", "分析样本误差后，根据抽样发现的误差推断审计对象的总体误差", "将购入的存货数量与耗用或销售的存货数量进行比较", "将关联方关系与非关联方交易的价格、毛利率进行对比，判断关联方交易的总体合理性", "", ""], "r": "B", "e": "分析程序是通过研究不同财务数据之间以及财务数据与非财务数据之间的内在关系等进行分析。B选项是抽样推断总体误差，并非研究数据间关系的分析程序。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397403", "t": 1, "q": "某注册会计师于2001年4月5日完成了对某公司2000年度的审计，2001年4月20日准备签发审计报告，审计报告日为（　）", "a": ["2001年4月1日", "2001年4月20日", "2001年12月31日", "2001年4月5日", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397404", "t": 1, "q": "21.甲公司2009年度的存货周转率为2.7，与2008年度相比有所下降。甲公司提供的以下理由中，不能解释存货周转率变动趋势的是（　）", "a": ["甲公司在2009年第4季度接到一笔巨额订单，订货数量相当于甲公司月产能的120%，交货日期为2010年1月1日", "甲公司主要产品在2009年度市场需求稳定且盈利，但平均销售价格与2008年度相比有所下降，并且甲公司预期销售价格将继续下降", "由于主要原材料价格比2008年度下降了10%，甲公司从2009年1月开始将主要原材料的日常储备量增加了20%", "从2009年6月开始，甲公司将部分产品针对主要销售客户的营销方式由原先的买断模式改为代销模式", "", ""], "r": "B", "e": "存货周转率=营业成本/平均存货余额。A项接到巨额订单但未交货，会使存货增加，周转率下降；C项增加原材料储备量，存货增加，周转率下降；D项代销模式下存货未转移，存货增加，周转率下降。而B项销售价格下降不直接影响存货周转率，不能解释变动趋势。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397405", "t": 1, "q": "10.注册会计师王林负责对甲公司编制的下属子公司K公司2008年度财务报表进行审阅。在承接和执行业务时，王林遇到下列事项，请代为做出正确的专业判断在与甲公司管理层沟通时，在确定该项业务责任方的责任时，下列表述正确的是（　）", "a": ["K公司管理层对K公司财务报表负责，甲公司管理层应对K公司财务状况、经营成果及现金流量负责", "甲公司管理层对K公司财务报表负责，K公司管理层应对K公司财务状况、经营成果及现金流量负责", "K公司管理层应对K公司财务报表、经营及现金流量负责", "甲公司管理层应对K公司财务报表和财务状况、经营成果及现金流量负责", "", ""], "r": "C", "e": "编制财务报表的责任方是被审计单位管理层，即K公司管理层对K公司财务报表负责，同时K公司管理层也应对K公司财务状况、经营成果及现金流量负责。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397406", "t": 1, "q": "在审计结束或监控结束时，使用分析程序对财务报表进行总体复核的目的是（　）", "a": ["针对自上年以来尚未发生变化的账户余额收集证据", "确定以前尚未识别的异常或未预期到的关系", "确定实质性分析程序对特定认定的适用性", "再次测试认为有效的内部控制，评估控制风险", "", ""], "r": "B", "e": "审计结束或监控结束时用分析程序总体复核，主要是看报表整体是否存在异常或未预期关系，识别潜在重大错报。A项收集特定账户余额证据不是总体复核目的；C项是实施实质性分析程序前考虑的；D项总体复核不涉及再次测试内控评估控制风险。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397407", "t": 1, "q": "下列相关业务中，需要注册会计师执行审计性质程序的是（　）", "a": ["对财务信息执行商定程序", "税务服务", "管理咨询", "代编财务信息", "", ""], "r": "A", "e": "审计性质程序主要用于获取审计证据以对财务报表发表审计意见。对财务信息执行商定程序需注册会计师运用审计方法获取证据，类似审计性质。而税务服务、管理咨询、代编财务信息都不涉及审计性质程序。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397408", "t": 1, "q": "2、审计产生的客观基础是（　）", "a": ["受托经济责任关系", "会计发展的需要", "管理的现代化", "生产发展的需要", "", ""], "r": "A", "e": "审计源于财产所有者将财产委托给他人管理，从而形成受托经济责任关系，需要对这种责任履行情况进行监督，这是审计产生的客观基础。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397409", "t": 1, "q": "为了核实企业所拥有的投资资产账存、实存是否相符，注册会计师可以实地盘点保存在企业内部的长期投资凭证，对委托专业机构保管的长期投资凭证进行（　）。", "a": ["评定", "分析", "抽查", "函证", "", ""], "r": "D", "e": "对于委托专业机构保管的长期投资凭证，注册会计师通常采用函证方式来核实其真实性和准确性，以确认账存与实存是否相符。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397411", "t": 1, "q": "9、函询法是通过向有关单位发函了解情况取得证据的一种方法，这种方法一般用于（　）的查证。", "a": ["固定资产", "流动资产", "无形资产", "往来款项", "", ""], "r": "D", "e": "函询法主要用于核实与外部单位的往来情况，往来款项是企业与其他单位或个人之间的债权债务关系，适合用函询法查证。而固定资产、流动资产、无形资产一般通过盘点、评估等方式查证。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397412", "t": 1, "q": "在控制检查风险时，B注册会计师应当采取的有效措施是（　）", "a": ["测试内部控制的有效性，以降低控制风险", "合理设计和有效实施进一步审计程序", "调高重要性水平", "进行穿行测试，以降低固有风险", "", ""], "r": "B", "e": "检查风险是指某一认定存在错报，该错报单独或连同其他错报是重大的，但注册会计师未能发现这种错报的可能性。控制检查风险的有效措施是合理设计和有效实施进一步审计程序。A选项测试内控降低的是控制风险；C选项调高重要性水平不能控制检查风险；D选项穿行测试无法降低固有风险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397413", "t": 1, "q": "46.注册会计师是否应当承担法律责任的关键是（　）。", "a": ["是否查出财务报表所有重大错报", "是否有过失或欺诈行为", "是否查出财务报表所有重大错报、舞弊和违反法律法规", "是否按照执业准则的要求执业", "", ""], "r": "B", "e": "判断注册会计师是否承担法律责任，关键在于其是否有过失或欺诈行为。查出所有重大错报、舞弊和违反法律法规不现实，按执业准则执业但有过失或欺诈仍可能担责。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397414", "t": 1, "q": "8、审计报告的标题统一规范为:", "a": ["审计记录", "审计工作底稿", "审计报告", "审计意见", "", ""], "r": "C", "e": "审计报告的标题就是统一规定为“审计报告”。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397415", "t": 1, "q": "如果会计师事务所有前任合伙人加入了审计客户并担任董事，则会计师事务所应当评价威胁的重要程度并在必要时采取防范措施消除威胁或将威胁降低到可接受水平。下列防范措施不恰当的是（　）", "a": ["由项目组以外的其他注册会计师复核前任审计项目组成员已执行的工作", "向审计项目组委派经验更丰富的人员", "没有防范措施可以将威胁降低到可接受水平，会计师事务所应当终止业务", "修改审计计划", "", ""], "r": "C", "e": "当有前任合伙人加入审计客户任董事时，并非没有防范措施可将威胁降低到可接受水平，A、B、D选项都是可行防范措施。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397416", "t": 1, "q": "以下关于申请设立合伙会计师事务所的条件不恰当的是（　）", "a": ["要有5名以上的合伙人", "合伙人必须有书面合伙协议", "设立的合伙会计师事务所要有名称", "有固定的办公场所", "", ""], "r": "A", "e": "申请设立合伙会计师事务所，要有2名以上合伙人，而非5名以上，B、C、D选项均是设立合伙会计师事务所应满足的条件。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397417", "t": 1, "q": "9．上级审计机构对被审计单位因不同意原审计结论和处理意见提出申请所进行的审查称为（　）。", "a": ["复审", "连续审计", "再度审计", "事中审计", "", ""], "r": "A", "e": "复审是上级审计机构对被审计单位因不同意原审计结论和处理意见提出申请所进行的审查。连续审计是按时间进行的审计安排；再度审计表述不准确；事中审计是按审计实施时间划分的。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397418", "t": 1, "q": "审计工作底稿的归档期限为审计报告日后的（　）", "a": ["60日内", "90日内", "30日内", "180日内", "", ""], "r": "A", "e": "依据《中国注册会计师审计准则第1131号——审计工作底稿》第十七条：<br />审计工作底稿的归档期限为审计报告日后六十天内；若审计业务中止，则为中止日后六十天内。<br />选项判定<br />A.60日内 → 正确<br />B.90日内 → 错误（易与“财务报表报出日”或其他业务混淆）<br />C.30日内 → 错误<br />D.180日内 → 错误（180天是部分教材提到的“保存期限”相关数字干扰，但保存期限是10年，不是归档期）", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397419", "t": 1, "q": "会计师事务所往往与其他会计师事务所及实体构成组织结构，这些组织结构是否构成网络取决于下列因素（　）", "a": ["取决于会计师事务所是否独立于审计客户", "取决于会计师事务所之间是否独立", "取决于合作的目的和共享的收益资源等情况", "取决于会计师事务所是否属于法律上独立的实体", "", ""], "r": "C", "e": "判断组织结构是否构成网络，关键看合作目的以及共享的收益、资源等情况。A选项独立于审计客户与是否构成网络无关；B选项事务所之间独立不能直接判定是否构成网络；D选项法律上独立实体不是构成网络的决定因素。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397420", "t": 1, "q": "10.“完整性”认定，指所有应当记录的交易和事项均已记录，其目标主要针对（　）", "a": ["金额", "高估", "低估", "数量", "", ""], "r": "C", "e": "“完整性”认定强调交易和事项都应完整记录，防止少记，也就是防止低估。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397421", "t": 1, "q": "为了确保销售收入截至的正确性，审计人员最希望被审计单位（　）。", "a": ["建立严格的赊销审批制度", "发运单连续编号并顺序签发", "年初及年末停止销售业务", "经常与客户交谈", "", ""], "r": "B", "e": "发运单连续编号并顺序签发能有效记录销售业务发生的时间，有助于保证销售收入截至的正确性。A选项赊销审批制度主要控制赊销风险；C选项年初及年末停止销售业务不现实且不能从根本保证截至正确；D选项与客户交谈对销售收入截至正确性没有直接作用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397422", "t": 1, "q": "注册会计师审计产生的直接原因是（　）", "a": ["所有权与经营权的分离", "股份制企业制度的形成", "合伙企业制度的产生", "资本市场的发展", "", ""], "r": "A", "e": "随着所有权与经营权分离，所有者需要专业人员对经营者的经营情况进行审查，这直接促使了注册会计师审计的产生。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397423", "t": 1, "q": "法律是由（　）制定和颁布。", "a": ["国家司法机关", "国家执法机关", "国务院", "国家立法机关", "", ""], "r": "D", "e": "法律需由专门的立法机关来制定和颁布。国家立法机关的职责就是进行立法工作。A选项司法机关主要负责司法审判等；B选项执法机关侧重于执行法律；C选项国务院主要是行政机关，虽有制定行政法规权力，但不是制定法律的主体。所以答案选D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397424", "t": 1, "q": "在分析资产负债表项目之间的关系时，最常用的分析程序是（　）", "a": ["趋势分析法", "回归分析法", "比率分析法", "绝对额分析法", "", ""], "r": "C", "e": "比率分析法能通过计算资产负债表项目间的比率，清晰反映项目关系，在分析资产负债表项目关系时最常用。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397425", "t": 1, "q": "（　）是内部控制的描述方法。", "a": ["比较法", "鉴定法", "流程图法", "逆查法", "", ""], "r": "C", "e": "内部控制描述方法有文字说明法、调查表法和流程图法等。选项A比较法用于数据对比等；选项B鉴定法多用于对实物等的鉴定；选项D逆查法是审计查账顺序方法。所以答案选C。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397426", "t": 1, "q": "《中华人民共和国注册会计师法》实施时间是（　）。", "a": ["1986年7月1日", "1995年1月1日", "1993年10月1日", "1994年1月1日", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397427", "t": 1, "q": "（　）是审计的本质属性和重要特征，也是审计的精髓。", "a": ["合法性", "权威性", "客观性", "独立性", "", ""], "r": "D", "e": "审计的独立性是其本质属性和重要特征，也是精髓，它能确保审计人员客观公正地进行审计工作。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397428", "t": 1, "q": "为了确保企业有价证券的账实相符，应该建立定期的（　）制度。", "a": ["分析检查", "对账核对", "实地盘点", "内部审计", "", ""], "r": "C", "e": "实地盘点能直接确定有价证券的实际数量，可确保账实相符。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397429", "t": 1, "q": "下列各项中，为获取适当审计证据所实施的审计程序与审计目标最相关的是（　）", "a": ["复核甲公司编制的银行存款余额调节表，以确定银行存款余额的正确性", "对已盘点的甲公司在华存货进行检查，将检查结果与盘点记录相核对，以确定存货计价的正确性", "实地观察甲公司固定资产，以确定固定资产的存在性", "从甲公司销售发票中选取样本，追查至对应的发货单，以确定销售收入的发生", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397430", "t": 1, "q": "注册会计师执行下列业务中，对保证程度描述不正确的是（　）", "a": ["代编财务信息不需要任何程度的保证", "验资需要合理保证", "内部控制审计业务需要合理保证", "对财务信息执行商定程序仅需要有限保证", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397431", "t": 1, "q": "下列条件中不能满足合伙人或者成为会计师事务所股东的条件是（　）", "a": ["持有注册会计师资格证书", "取得注册会计师证书后，在中国境内会计师事务所执行财务报表审计业务满5年", "取得注册会计师证书后在会计师事务所连续6年从事为客户税务筹划工作", "成为合伙人前一直会计师事务所执业，5年来没有因为执业受到任何行政处罚", "", ""], "r": "C", "e": "成为合伙人或股东需满足持有注会证书，在境内事务所执行财务报表审计业务满5年等条件。税务筹划工作不属于财务报表审计业务。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397432", "t": 1, "q": "开展审计工作都应该正确地编制（　）。", "a": ["审计证据", "审计工作底稿", "审计意见书", "审计报告", "", ""], "r": "B", "e": "审计工作底稿是审计人员在审计工作过程中形成的全部审计工作记录和获取的资料，编制审计工作底稿是开展审计工作的必要步骤和正确做法。审计证据是形成审计结论等的依据；审计意见书是审计机关审定审计报告后，对审计事项作出评价的书面文件；审计报告是审计工作的最终成果。所以开展审计工作应正确编制审计工作底稿。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397433", "t": 1, "q": "注册会计师从总体规模为1000个、账面价值为300000元的存货项目中选取200个项目（账面价值50000元）进行检查，确定其审定金额为50500元。如果采用比率估计抽样，D注册会计师推断的存货总体错报为（　）元", "a": ["2500", "3000", "500", "47500", "", ""], "r": "B", "e": "比率估计抽样下，比率=审定金额/账面金额=50500÷50000 = 1.01，估计总体金额=总体账面金额×比率=300000×1.01 = 303000元，推断的总体错报=估计总体金额 - 总体账面金额=303000 - 300000 = 3000元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397434", "t": 1, "q": "（　）是指在审查某个项目时，通过调整有关数据，从而求得需要证实的数据方法。", "a": ["抽样法", "盘存法", "鉴定法", "调节法", "", ""], "r": "D", "e": "调节法就是通过调整有关数据来求得需证实数据的方法。抽样法是抽取部分样本审查；盘存法是对实物资产进行盘点；鉴定法是请专业人员进行鉴定。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397435", "t": 1, "q": "职业道德守则要求会员保持实质上和形式上的独立性，以下关于独立性的陈述不正确的是（　）", "a": ["注册会计师在执行鉴证业务时必须在实质上独立和形式上独立", "实质上的独立性要求会员不能与客户之间存在任何的经济利益关系", "实质上的独立性要求注册会计师在提出结论时不受损于职业因素影响", "如果会员在形式上不独立，则很可能被推定为其诚信、客观性或职业怀疑态度已经受到损害", "", ""], "r": "B", "e": "实质上的独立性并非要求会员不能与客户有任何经济利益关系，而是要求注册会计师在提出结论时不受损害职业判断的因素影响。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397436", "t": 1, "q": "6.关于审计风险模型中其各要素的下列说法中，不正确的是（　）", "a": ["重大错报风险是评估的", "审计风险是注册会计师在审计前面临的", "检查风险是注册会计师通过实施实质性程序控制的", "审计风险是预先设定的", "", ""], "r": "B", "e": "审计风险是注册会计师可接受的审计风险，是预先设定的，并非审计前就面临的实际风险。A选项重大错报风险确实是评估得出；C选项检查风险可通过实质性程序控制。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397437", "t": 1, "q": "总体审计策略的详细程度取决于（　）", "a": ["初步业务活动的结果", "为被审计单位提供其他服务时所获得的经验", "审计业务的特征", "被审计单位规模及该项审计业务的复杂程度", "", ""], "r": "D", "e": "总体审计策略的详细程度受被审计单位规模和审计业务复杂程度影响，规模大、业务复杂，策略需更详细。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397438", "t": 1, "q": "在国民时期,审计机构的设置是在（　）下设审计部。", "a": ["行政院", "司法部", "监察院", "国会", "", ""], "r": "C", "e": "国民时期，审计机构在监察院下设审计部。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397439", "t": 1, "q": "以下关于注册会计师过失说法不正确的是（　）", "a": ["注册会计师一旦出现过失就要赔偿损失", "普通过失是指注册会计师没有完全遵守专业准则的要求", "过失是指在一定条件下，缺少应具有的合理谨慎", "重大过失是指注册会计师没有按专业准则的基本要求执行审计", "", ""], "r": "A", "e": "注册会计师出现过失不一定就要赔偿损失，还需考虑因果关系等因素。普通过失、重大过失的定义以及过失的概念表述均正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397440", "t": 1, "q": "3．审计最本质的特性是（　）。", "a": ["完整性", "公正性", "独立性", "客观性", "", ""], "r": "C", "e": "审计的本质特性是独立性，它是保证审计工作顺利开展、确保审计结果客观公正的基础。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397441", "t": 1, "q": "内部控制无论如何设计和执行，只能对财务报告的可靠性提供合理保证，其原因是（　）", "a": ["建立和维护内部控制是公司管理层的职责", "内部控制的成本不应超过预期带来的收益", "在决策时人为判断可能出现错误", "对资产和记录采取适当的安全保护措施是公司管理层应当履行的经营责任", "", ""], "r": "C", "e": "内部控制存在固有局限性，人为判断可能出错是导致其只能提供合理保证的原因之一。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397442", "t": 1, "q": "以下关于注册会计师过失说法不正确的是（　）", "a": ["注册会计师一旦出现过失就要赔偿损失", "重大过失是指注册会计师没有按专业准则的基本要求执行审计", "过失是指在一定条件下，缺少应具有的合理谨慎", "普通过失是指注册会计师没有完全遵守专业准则的要求", "", ""], "r": "A", "e": "注册会计师出现过失不一定就要赔偿损失，还需考虑因果关系等因素。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397443", "t": 1, "q": "57.检查风险与审计证据数量之间的关系是（　）。", "a": ["反向变动关系", "有时反向变动", "同向变动关系", "有时同向变动", "", ""], "r": "A", "e": "检查风险是指如果存在某一错报，该错报单独或连同其他错报可能是重大的，注册会计师为将审计风险降至可接受的低水平而实施程序后没有发现这种错报的风险。检查风险越低，意味着要将审计风险控制在低水平，就需要获取更多的审计证据，所以检查风险与审计证据数量是反向变动关系。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397444", "t": 1, "q": "在内部控制的要素中，（　）是基础，是其余要素发挥控制的前提条件。", "a": ["控制环境", "控制活动", "风险评估", "监督", "", ""], "r": "A", "e": "控制环境是内部控制的基础，它为内部控制其他要素发挥作用提供前提条件。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397445", "t": 1, "q": "被审计单位的会计核算工作本身发生重大差错的风险是（　）。", "a": ["经营风险", "抽查风险", "固有风险", "控制风险", "", ""], "r": "C", "e": "固有风险是指在不考虑内部控制结构的前提下，由于内部因素和客观环境的影响，企业的账户、交易类别和整体财务报表发生重大错误的可能性。本题中会计核算工作本身发生重大差错的风险符合固有风险定义。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397446", "t": 1, "q": "内部控制源于（　）。", "a": ["控制", "审计", "会计", "统计", "", ""], "r": "B", "e": "内部控制是因审计发展而产生，审计过程中为提高效率、保证质量需对企业内部进行控制，所以内部控制源于审计。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397447", "t": 1, "q": "下列证据中，属于内部证据的是（　）。", "a": ["保险单", "购货发票", "银行对账单", "销售发票", "", ""], "r": "D", "e": "内部证据是由被审计单位内部生成的证据。销售发票是企业内部开具的，属于内部证据；而保险单、购货发票是来自外部单位，银行对账单是银行提供的，都属于外部证据。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397448", "t": 1, "q": "7、在西方，最具代表性的国家审计机关是（　）的国家审计机关。", "a": ["行政系统", "管理系统", "立法系统", "司法系统", "", ""], "r": "C", "e": "立法系统的国家审计机关独立性强、权威性高，在西方是最具代表性的国家审计机关形式。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397449", "t": 1, "q": "经济利益是指从某一实体的股票、债券、其他证券以及贷款和其他债务工具中获得的利益，包括直接经济利益和间接经济利益。下列对直接经济利益的判断正确的是（　）", "a": ["注册会计师在审计客户中拥有的能够直接控制的经济利益是直接经济利益", "注册会计师在审计客户中通过房地产拥有的经济利益是直接经济利益", "注册会计师在审计客户中通过集合投资工具拥有的经济利益是直接经济利益", "注册会计师在审计客户中通过信托拥有的经济利益是直接经济利益", "", ""], "r": "A", "e": "直接经济利益是指注册会计师在审计客户中拥有的能够直接控制的经济利益。选项B通过房地产、C通过集合投资工具、D通过信托拥有的经济利益通常不属于直接能控制的直接经济利益。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397450", "t": 1, "q": "做好审计工作，合理提出审计报告，达到审计目标的重要条件是要有（　）", "a": ["审计约定书", "家庭背景", "审计证据", "审计资料", "", ""], "r": "C", "e": "审计证据是审计人员形成审计意见、做出审计结论、支持审计报告的依据，是做好审计工作，合理提出审计报告，达到审计目标的重要条件。审计约定书是确立委托关系的协议；家庭背景与审计工作无关；审计资料范围宽泛，不如审计证据准确。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528685767397451", "t": 1, "q": "下列与重大错报风险相关的表述中，正确的是（　）", "a": ["管理层错报风险是因错误使用审计程序产生的", "重大错报风险独立于财务报表审计而存在", "重大错报风险是指在不考虑内部控制的情况下，某一认定发生重大错报的可能性", "重大错报风险仅存在于财务报表的特定项目中", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215872", "t": 2, "q": "注册会计师有可能承担的行政责任包括（　）", "a": ["暂停执业", "警告", "没收违法所得", "吊销注册会计师证书", "", ""], "r": "ABCD", "e": "注册会计师若违反相关规定，行政责任有多种形式，选项中暂停执业、警告、没收违法所得、吊销注册会计师证书均属于可能承担的行政责任。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215873", "t": 2, "q": "注册会计师职业道德明确包含以下基本原则（　）", "a": ["诚信、独立、客观", "专业胜任能力和应有的关注", "职业行为原则和保密原则", "独立、客观、公正和廉洁", "", ""], "r": "ABC", "e": "注册会计师职业道德基本原则包括诚信、独立性、客观和公正、专业胜任能力和应有的关注、保密、良好职业行为。ABC选项涵盖了这些内容；D选项“廉洁”并非职业道德明确包含的基本原则。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215874", "t": 2, "q": "在确定进一步审计程序的时间时，注册会计师应当考虑的主要因素有（　）", "a": ["评估的认定特别重大错报风险", "审计意见的类型", "错报风险的性质", "审计证据适用的期间或时点", "", ""], "r": "ACD", "e": "确定进一步审计程序时间需考虑重大错报风险评估结果、错报风险性质、审计证据适用期间或时点等。审计意见类型与进一步审计程序时间无关。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215875", "t": 2, "q": "在下列情形下，应增加所需审计证据的数量（　）。", "a": ["审计项目很重要", "审计过程中已经发现被审计事项存在错误", "审计人员将检查风险水平确定得很低", "某项目的大多数证据来源于被审计单位外部", "", ""], "r": "ABC", "e": "审计证据数量受多种因素影响。审计项目重要，需更多证据支持结论；已发现错误，意味着风险高，要增加证据；检查风险水平低，需更多证据降低审计风险。而证据来源于外部，可靠性高，所需证据数量可减少。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215876", "t": 2, "q": "审计依据的特点为（　）。", "a": ["相关性", "时效性", "层次性", "可比性", "", ""], "r": "ABC", "e": "审计依据具有相关性，能与审计事项相关联；有时效性，不同时期审计依据不同；有层次性，不同层次法规效力不同。而可比性并非审计依据特点。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215877", "t": 2, "q": "下列关于不相容职务的说法中，正确的有（　）。", "a": ["保管某些财产物资和使用这些财产物资的职务要分离", "执行某些经济业务和审核这些经济业务的职务要分离", "保存某些财产物质和对其进行记载的职务要分别", "受权进行某项经济业务和执行该项业务的职务要分离", "", ""], "r": "ABCD", "e": "不相容职务是指那些如果由一个人担任，既可能发生错误和舞弊行为，又可能掩盖其错误和弊端行为的职务。A选项财产保管与使用分离可防止擅自使用；B选项执行与审核分离可避免执行人员违规操作；C选项财产保存与记载分离能保证记录真实性；D选项授权与执行分离可防止随意执行。ABCD选项所涉及的职务分离都符合不相容职务分离原则。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215878", "t": 2, "q": "审计证据的适当性是指（　）。", "a": ["可靠性", "相关性", "充分性", "足够性", "", ""], "r": "AB", "e": "审计证据的适当性包括相关性和可靠性。充分性（足够性）强调的是审计证据的数量，不属于适当性范畴。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215879", "t": 2, "q": "审计人员必须慎重对待审计报告，对审计报告的（　）负责。", "a": ["真实性", "合规性", "正确性", "合法性", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215880", "t": 2, "q": "下列应当进行职务分离的是（　）。", "a": ["经济业务的执行与记录职务", "经济业务的授权批准与执行职务", "记录明细账与日记账的职务", "财产物资的保管和记录职务", "", ""], "r": "ABD", "e": "职务分离是为防止错误和舞弊，将不相容职务分开。A选项执行与记录分开可防止自行记录掩盖错误；B选项授权批准与执行分开能避免随意执行；D选项保管和记录分开可防止监守自盗。而记录明细账与日记账通常可由同一人完成。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215881", "t": 2, "q": "33.应付账款一般不需要函证，但在以下哪种情况下，注册会计师应实施函证程序？", "a": ["应付账款存在借方余额", "被审计单位处于经济困难阶段", "某应付账款的明细账户金额较大", "控制风险较高", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215882", "t": 2, "q": "下列有关审计独立性的说法中，体现审计工作上的独立性的有（　）", "a": ["审计人员依法办理审计事项时，其他行政机关、社会团体或个人不得干涉", "审计机关必须是独立的专职机构", "审计人员不参与被审计单位的经营管理活动", "审计人员在审计工作的全过程中依法独立行使审计监督权", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215883", "t": 2, "q": "审计工作底稿按类别划分，可分为（　）。", "a": ["业务类工作底稿", "流程图", "表格", "备查类工作底稿", "", ""], "r": "AD", "e": "审计工作底稿按类别分为业务类和备查类工作底稿。流程图和表格是工作底稿的形式并非类别。所以答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215884", "t": 2, "q": "注册会计师签发的审计报告，具有（　）等作用。", "a": ["保护", "鉴证", "促进", "证明", "", ""], "r": "BD", "e": "审计报告有鉴证作用，对被审计单位会计报表合法性、公允性发表意见；有证明作用，证明审计工作质量和注册会计师的审计责任。而保护和促进并非审计报告主要作用。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215885", "t": 2, "q": "独立性概念框架要求注册会计师争取下列措施（　）来确保独立性的遵循", "a": ["拒绝客户业务或终止业务", "采取必要的防范措施", "评价已识别威胁", "识别对独立性的威胁", "", ""], "r": "BCD", "e": "独立性概念框架步骤为：先识别对独立性的威胁，接着评价已识别威胁，然后根据情况采取必要防范措施，若威胁无法消除或降至可接受水平，才考虑拒绝客户业务或终止业务。所以正确顺序涵盖识别、评价、采取措施等，答案选BCD。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215886", "t": 2, "q": "审计证据按照其外形特征可以分为（　）四大类。", "a": ["口头证据", "环境证据", "实物证据", "书面证据", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215887", "t": 2, "q": "只有由（　）三方面关系人构成的关系，才是审计关系。", "a": ["审计委托人", "当事人", "审计人", "被审计人", "", ""], "r": "ACD", "e": "审计关系由审计委托人、审计人、被审计人三方面构成。答案是ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215888", "t": 2, "q": "以下项目中，属于审计关系人的有（　）。", "a": ["审计委托人或授权人", "审计主体", "被审计单位", "审计准则", "", ""], "r": "ABC", "e": "审计关系人包括审计主体、被审计单位和审计委托人或授权人。审计准则是审计工作的规范，不属于审计关系人。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215889", "t": 2, "q": "大海公司下列控制活动中，属于经营业绩评价方面的有（　）", "a": ["由内部审计部门定期对内部控制的设计和执行效果进行评价", "定期与客户对账并对发现的差异进行调整", "对照预算、预测和前期实际结果，对公司的业绩复核和评价", "综合分析财务数据和经营数据之间的内存关系", "", ""], "r": "CD", "e": "经营业绩评价主要是对公司业绩进行评估分析。A选项是对内部控制评价，并非经营业绩评价；B选项与客户对账调整是常规财务操作，不属于经营业绩评价。C对照预算等对业绩复核评价，D综合分析财务与经营数据关系，都属于经营业绩评价方面。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215890", "t": 2, "q": "会计师事务所应当制定下列政策和程序（　）以防范同一高级人员由于长期执行某一客户的鉴证业务可能对独立性造成威胁", "a": ["鉴证业务的性质，包括涉及公众利益的范围", "高级管理人员提供鉴证业务的服务年限", "建立适当的标准，以便确定是否需要采取防范措施，将由于关系密切造成的威胁降低到可接受水平", "对所有的上市公司财务报表审计，按照法律法规的规定定期轮换项目负责人", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215891", "t": 2, "q": "独立性原则要求下列哪些与审计客户保持独立", "a": ["审计项目组成员", "D会计师事务所", "网络", "网络事务所", "", ""], "r": "ABCD", "e": "
