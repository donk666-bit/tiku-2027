<!doctype html>
<html lang="zh-CN">
<head>

<title>华电-财务会计类-刷题</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>

<script>
const DATA = {"id": "yw2033827411522621440", "name": "华电-财务会计类", "chapters": [{"k": "基础练习题【含解析】||第1章 财务管理（1）", "n": "基础练习题【含解析】 / 第1章 财务管理（1）", "qs": [{"id": "2034528521711390720", "t": 1, "q": "下列关于存货周转率的说法，正确的是？", "a": ["存货周转率与企业盈利能力无关", "存货周转率=营业成本÷平均存货余额", "季节性生产企业适用年度存货周转率指标", "存货周转率越高，表明存货管理水平越差", "", ""], "r": "B", "e": "存货周转率=营业成本÷平均存货余额，B正确；存货周转率与盈利能力有关，A错误；季节性生产企业年度存货周转率不能反映实际情况，C错误；存货周转率越高，存货管理水平越好，D错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528521711390721", "t": 1, "q": "当净现值（NPV）大于0时，现值指数（PI）？", "a": ["小于1", "无法确定", "等于1", "大于1", "", ""], "r": "D", "e": "净现值（NPV）=未来现金净流量现值 - 原始投资额现值，现值指数（PI）=未来现金净流量现值÷原始投资额现值。当NPV＞0，意味着未来现金净流量现值大于原始投资额现值，所以PI＞1。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521711390722", "t": 1, "q": "下列关于财务杠杆系数的说法，正确的是？", "a": ["财务杠杆系数与经营风险呈正相关", "负债增加会导致财务杠杆系数增大", "财务杠杆系数越大，表明财务杠杆作用越小", "当企业无固定性融资成本时，财务杠杆系数为1", "", ""], "r": "D", "e": "财务杠杆与经营风险无关，A错；负债增加但如果没固定融资成本，财务杠杆系数不变，B错；财务杠杆系数越大，财务杠杆作用越大，C错；无固定性融资成本时，不存在财务杠杆效应，系数为1，D对。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528521711390723", "t": 1, "q": "在衡量企业短期偿债能力指标中，剔除存货影响的是？", "a": ["现金比率", "资产负债率", "流动比率", "速动比率", "", ""], "r": "D", "e": "速动比率是用速动资产除以流动负债，速动资产是流动资产减去存货等变现能力较差的资产，所以速动比率剔除了存货影响。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521711390724", "t": 1, "q": "某企业2005年流动资产平均余额为2000万元，流动资产周转数为12次。若企业2005年销售利润为3300万元，则2005年销售利润率为（　）", "a": ["10%", "20%", "25.5%", "13.75%", "", ""], "r": "D", "e": "销售收入 = 流动资产平均余额 × 流动资产周转次数 = 2000×12=24000 万元，销售利润率 = 销售利润 ÷ 销售收入 = 3300÷24000=13.75%。", "ap": [false, false, false, false, false, false]}, {"id": "2034528521711390725", "t": 1, "q": "某项目净现值为正数，表明该项目？", "a": ["投资回收期大于基准回收期", "现值指数大于1", "内部收益率小于折现率", "会计收益率小于期望收益率", "", ""], "r": "B", "e": "净现值为正意味着未来现金净流量现值大于原始投资额现值。现值指数=未来现金净流量现值÷原始投资额现值，所以现值指数大于1。A选项，净现值为正通常投资回收期小于基准回收期；C选项，净现值为正内部收益率应大于折现率；D选项，净现值为正会计收益率应大于期望收益率。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528521711390726", "t": 1, "q": "下列不属于内部控制要素的是？", "a": ["信息与沟通", "控制环境", "预算编制", "风险评估", "", ""], "r": "C", "e": "内部控制要素包括控制环境、风险评估、控制活动、信息与沟通、内部监督。预算编制不属于内部控制要素。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521715585024", "t": 1, "q": "金融期货最基本的功能是（　）", "a": ["地点交割", "套期保值和价格发现", "合约标准化", "月份交割", "", ""], "r": "B", "e": "金融期货主要功能包括套期保值（规避风险）和价格发现，这是其最基本功能。A、D选项是期货交易的相关规则，C选项是期货合约特点，都不是基本功能。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528521715585025", "t": 1, "q": "在催收应收账款时，常用的策略有:1.信函通知;2.派员面谈;3.诉诸法律;4.电告催收。催收的程序一般是（　）", "a": ["1-4-2-3", "4-1-2-3", "1-2-3-4", "2-1-3-4", "", ""], "r": "A", "e": "应收账款催收一般由温和到强硬逐步升级：1信函通知 →4电告催收（电话） →2派员面谈 →3诉诸法律，顺序：1‑4‑2‑3。<br />逻辑：先书面信函提醒，再电话沟通，仍无效再派人当面交涉，最后才走法律诉讼。", "ap": [false, false, false, false, false, false]}, {"id": "2034528521715585026", "t": 1, "q": "计算投资报酬率时，其经营资产计价是采用（　）。", "a": ["原始价值", "账面价值", "市场价值", "委估价值", "", ""], "r": "B", "e": "投资报酬率（ROI）计算公式中经营资产采用账面价值（账面净值）计量，依据现有会计账面数据计算。", "ap": [false, false, false, false, false, false]}, {"id": "2034528521715585027", "t": 1, "q": "零基预算在编制费用预算时，应优先安排的是？", "a": ["可避免费用项目", "酌量性固定成本项目", "不可避免且不可延缓费用项目", "可延缓费用项目", "", ""], "r": "C", "e": "零基预算编制时，先安排不可避免且不可延缓费用项目，再考虑可延缓项目，可避免费用可根据资源情况决定是否安排，酌量性固定成本是可调整的。所以优先安排的是不可避免且不可延缓费用项目。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528521715585028", "t": 1, "q": "下列属于内部控制活动中会计系统控制的是？", "a": ["建立内部审计制度", "实施不相容职务分离", "建立健全会计档案保管制度", "明确业务授权审批权限", "", ""], "r": "C", "e": "会计系统控制主要是对会计信息和会计档案等进行管理控制。A 项内部审计制度属于监督范畴；B 项不相容职务分离是控制活动中的分离控制；D 项业务授权审批权限是授权审批控制。C 项建立健全会计档案保管制度符合会计系统控制。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521715585029", "t": 1, "q": "下列各项中，属于企业信用政策组成内容的是？", "a": ["坏账准备计提方法", "信用标准", "销售折扣", "存货计价方法", "", ""], "r": "B", "e": "企业信用政策包括信用标准、信用条件和收账政策。选项A坏账准备计提方法是会计处理方法；选项C销售折扣是销售策略；选项D存货计价方法是存货核算方法。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521715585030", "t": 1, "q": "某企业流动比率为2.5，速动比率为1.5，存货周转天数为60天，假设一年按360天计算，则该企业存货占流动资产的比重为？", "a": ["50%", "20%", "30%", "40%", "", ""], "r": "D", "e": "流动比率=流动资产/流动负债，速动比率=速动资产/流动负债，存货=流动资产 - 速动资产，所以存货占流动资产比重=（流动比率 - 速动比率）/流动比率。代入数值（2.5 - 1.5）/2.5 = 40%。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528521715585031", "t": 1, "q": "零基预算编制时，优先安排的费用项目是？", "a": ["不可避免且不可延缓费用项目", "可延缓费用项目", "可避免费用项目", "酌量性固定成本项目", "", ""], "r": "A", "e": "零基预算编制中，应优先保障不可避免且不可延缓费用项目，这类费用是企业运营必须且不能推迟支出的。可延缓、可避免及酌量性固定成本项目并非优先安排。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521719779328", "t": 1, "q": " 在财务分析中，销售毛利率的计算公式是？", "a": ["利润总额÷销售收入×100%", "净利润÷销售收入×100%", "息税前利润÷销售收入×100%", "（销售收入-销售成本）÷销售收入×100%", "", ""], "r": "D", "e": "销售毛利率反映的是销售收入扣除销售成本后剩余部分占销售收入的比例。其公式就是（销售收入 - 销售成本）÷销售收入×100% 。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973632", "t": 1, "q": "在下列部门中，成本资金归口给（　）", "a": ["销售部门管理", "生产部门管理", "人事部门管理", "财务部门管理", "", ""], "r": "D", "e": "成本资金管理是企业财务管理的重要内容，财务部门负责企业资金的统筹、核算与监督等工作，所以成本资金归口财务部门管理。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973633", "t": 1, "q": "在资本成本计算中，不考虑筹资费用的是？", "a": ["普通股资本成本", "发行债券资本成本", "长期借款资本成本", "留存收益资本成本", "", ""], "r": "D", "e": "留存收益是企业内部积累资金，不存在筹资费用。而普通股、债券、长期借款在筹集资金时都有筹资费用。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973634", "t": 1, "q": "下列关于内部审计与内部控制关系的说法，正确的是？", "a": ["内部审计是内部控制的一个重要组成部分", "内部审计与内部控制无关", "内部控制是内部审计的一个重要组成部分", "内部审计只对内部控制进行监督，不参与内部控制建设", "", ""], "r": "A", "e": "内部审计是对内部控制执行情况进行监督评价，它本身也是内部控制的重要组成部分，能促进内部控制的有效运行。B选项说无关错误；C选项关系颠倒；D选项内部审计也可参与内控建设，并非只监督。所以正确答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973635", "t": 1, "q": "某企业3月份实际销售额为5100万元，原来预测的3月份销售额为6200万元，指数平滑系数0.6，则4月份的预测销售额是（　）", "a": ["576万元", "5890元", "5940万元", "5540万元", "", ""], "r": "D", "e": "指数平滑法预测公式为：预测值=平滑系数×实际值+(1 - 平滑系数)×预测值。代入数据：0.6×5100+(1 - 0.6)×6200 = 5540（万元）。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973636", "t": 1, "q": "在管理会计中，狭义相关范围是指（　）", "a": ["业务量的变动范围", "市场容量的变动范围", "成本的变动范围", "时间的变动范围", "", ""], "r": "A", "e": "狭义相关范围主要是指业务量的变动范围，管理会计中很多成本性态分析等都是在一定业务量变动范围内才成立。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973637", "t": 1, "q": "企业通过建立健全内部控制制度来防范风险，其主要目的是确保？", "a": ["企业快速扩张", "企业利润最大化", "员工福利提高", "财务报告及相关信息真实完整", "", ""], "r": "D", "e": "内部控制制度主要是为了保证企业经营管理合法合规、资产安全、财务报告及相关信息真实完整等。A选项企业快速扩张并非内控主要目的；B选项利润最大化受多种因素影响，内控不是直接确保利润最大化；C选项员工福利提高也不是内控主要目的。所以答案选D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973638", "t": 1, "q": "下列各项中，能反映企业长期偿债能力的财务指标是？", "a": ["速动比率", "资产负债率", "流动比率", "存货周转率", "", ""], "r": "B", "e": "速动比率和流动比率衡量短期偿债能力；存货周转率反映营运能力；资产负债率反映长期偿债能力。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973639", "t": 1, "q": "企业为了优化资本结构而筹集资金，这种筹资的动机是？", "a": ["扩张性筹资动机", "调整性筹资动机", "创立性筹资动机", "支付性筹资动机", "", ""], "r": "B", "e": "调整性筹资动机是指企业因调整资本结构而产生的筹资动机。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973640", "t": 1, "q": "某投资项目原始投资额为500万元，使用寿命5年，每年现金净流量为150万元，则该项目的投资回收期为？", "a": ["3年", "4.33年", "4年", "3.33年", "", ""], "r": "D", "e": "投资回收期是使累计现金净流量等于原始投资额所需时间。原始投资额500万，每年现金净流量150万，500÷150≈3.33年。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973641", "t": 1, "q": "下列关于企业偿债能力指标的说法，正确的是？", "a": ["利息保障倍数越高，企业长期偿债能力越弱", "现金流动负债比率反映企业的长期偿债能力", "速动比率比流动比率更能准确反映企业的短期偿债能力", "产权比率与资产负债率对企业偿债能力的反映相同", "", ""], "r": "C", "e": "利息保障倍数越高，长期偿债能力越强，A错误；现金流动负债比率反映短期偿债能力，B错误；速动比率剔除存货等变现能力弱的资产，更能准确反映短期偿债能力，C正确；产权比率和资产负债率侧重点有差异，反映并非完全相同，D错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973642", "t": 1, "q": "某产品市场零售价为130元（增值税在外），商业批零差率为10%，进销差率为20%,则该产品的出厂价格为（　）", "a": ["95.6元", "96元", "93.6元", "86元", "", ""], "r": "C", "e": "本题可根据批零差率和进销差率的关系，从零售价逐步推导出出厂价格。 步骤一：根据批零差率求出批发价批零差率是指批发价格与零售价格之间的差额占批发价格的百分比。设批发价为x元，已知零售价为130元，批零差率为「test/yiwen_img/im  false]}, {"id": "2034528521723973644", "t": 1, "q": "在分析企业偿债能力时，若某企业的资产负债率远高于行业平均水平，说明该企业？", "a": ["长期偿债能力较强", "长期偿债能力较弱", "短期偿债能力较强", "短期偿债能力较弱", "", ""], "r": "B", "e": "资产负债率是衡量长期偿债能力的指标，资产负债率高意味着负债占资产比重大，偿还长期债务压力大，长期偿债能力弱。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973645", "t": 1, "q": "下列关于内部控制制度设计原则的说法，错误的是？", "a": ["遵循全面性原则，应覆盖所有业务流程", "适应性原则需符合企业实际情况", "成本效益原则无需考虑控制成本", "制衡性原则要求岗位设置相互制约", "", ""], "r": "C", "e": "成本效益原则需要在实行内部控制所花费的成本与由此而产生的经济效益之间保持适当的比例，是要考虑控制成本的，C选项说法错误。A选项全面性覆盖所有业务流程、B选项适应性符合企业实际、D选项制衡性岗位相互制约说法均正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973646", "t": 1, "q": "将全部成本分为固定成本、变动成本和混合成本所采用的分类标志是（　）", "a": ["成本的性态", "成本的可辨认性", "成本的经济用途", "成本的目标", "", ""], "r": "A", "e": "成本按性态可分为固定成本、变动成本和混合成本。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973647", "t": 1, "q": "在财务分析中，通过计算各种比率指标来确定财务活动变动程度的方法是？", "a": ["因素分析法", "比较分析法", "趋势分析法", "比率分析法", "", ""], "r": "D", "e": "题干明确说通过计算各种比率指标来确定财务活动变动程度，这正是比率分析法的定义。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973648", "t": 1, "q": "如果本期销售量比上期增加，则可断定按变动成本法计算的本期营业利润（　）。", "a": ["一定等于上期", "应当小于上期", "可能等于上期", "应当大于上期", "", ""], "r": "D", "e": "变动成本法下，营业利润受销售量影响，销售量增加，贡献毛益增加，营业利润就会增加。所以本期销售量比上期增加，按变动成本法计算的本期营业利润应当大于上期。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973649", "t": 1, "q": "企业的设立必须是由发起人的发起，其发起人（　）", "a": ["可以是自然人，也可以是法人", "必须是自然人", "必须是2个以上的自然人或法人", "必须是法人", "", ""], "r": "A", "e": "企业发起人可以是自然人也能是法人。答案A符合此规定。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973650", "t": 1, "q": "零基预算编制过程中，第一步是？", "a": ["划分不可避免费用项目和可避免费用项目", "提出预算期内各种活动的费用预算方案", "对各费用预算方案进行成本效益分析", "划分不可延缓费用项目和可延缓费用项目", "", ""], "r": "B", "e": "零基预算编制第一步是提出预算期内各种活动的费用预算方案，后续才进行成本效益分析、划分费用项目等操作。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973651", "t": 1, "q": "并购方A公司的每股价格60元，A公司以每股45元的价格收购被并购方B公司的股票，则股票兑换的比例为（　）", "a": ["0.75", "0.45", "0.25", "0.9", "", ""], "r": "A", "e": "股票兑换比例=被并购方每股作价/并购方每股价格，即45÷60 = 0.75。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973652", "t": 1, "q": "被称为\"总预算\"的预算是（　）。", "a": ["财务预算", "销售预算", "生产预算", "专门决策预算", "", ""], "r": "A", "e": "财务预算是全面预算体系的最后环节，它从价值方面总括地反映企业经营期决策预算与业务预算的结果，亦称为总预算。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973653", "t": 1, "q": "在利润灵敏度指标的计算中，销售量的中间变量是（　）。", "a": ["贡献边际", "单价", "销售收入", "利润", "", ""], "r": "A", "e": "在利润灵敏度指标计算里，销售量的中间变量是贡献边际。因为利润变动率分析中，销售量通过影响贡献边际进而影响利润。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973654", "t": 1, "q": "某企业息税前利润为200万元，利息费用为50万元，所得税税率为25%，其利息保障倍数是？", "a": ["5", "3", "4", "2", "", ""], "r": "C", "e": "利息保障倍数=息税前利润÷利息费用，本题中息税前利润200万元，利息费用50万元，200÷50 = 4。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973655", "t": 1, "q": "下列属于企业内部控制中信息与沟通要素内容的是？", "a": ["建立反舞弊机制", "对控制活动进行监督", "确保信息在企业内部和外部相关者之间及时、准确地传递", "设置内部审计机构", "", ""], "r": "C", "e": "信息与沟通强调信息的及时、准确传递。A建立反舞弊机制属于控制环境；B对控制活动进行监督是内部监督；D设置内部审计机构也与监督相关。C选项体现信息在内外相关者间传递，符合信息与沟通要素内容。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973656", "t": 1, "q": "下列关于营运能力分析指标的关系，表述正确的是？", "a": ["流动资产周转率与总资产周转率成反比", "存货周转率高，应收账款周转率必然高", "应收账款周转天数与应收账款周转率成反比", "总资产周转率=流动资产周转率+非流动资产周转率", "", ""], "r": "C", "e": "应收账款周转天数=365/应收账款周转率，所以二者成反比。流动资产周转率与总资产周转率无反比关系，存货周转率和应收账款周转率无必然联系，总资产周转率不等于流动资产周转率与非流动资产周转率相加。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973657", "t": 1, "q": "相对于负债融资方式而言，采用吸收投资方式筹措资金的优点是（　）", "a": ["有利于发挥财务杠杆作用", "有利于集中企业控制权", "有利于降低财务风险", "有利于降低资金成本", "", ""], "r": "C", "e": "吸收投资属于权益融资，不用还本付息，能降低财务风险。负债融资存在还本付息压力，财务风险高。A项负债融资才利于发挥财务杠杆作用；B项吸收投资会分散企业控制权；D项权益融资成本通常高于负债融资。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973658", "t": 1, "q": "利润最大化一般是指（　）", "a": ["企业税前收益总额的最大化", "企业税后利润总额的最大化", "企业税前利润总额的最大化", "企业税后利润收益的最大化", "", ""], "r": "B", "e": "利润最大化通常指企业税后利润总额最大化，因为税后利润才是企业实际可支配的盈利。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973659", "t": 1, "q": "税前利润弥补亏损，下一年度利润不足弥补的，可以用以弥补的年限是（　）", "a": ["6年", "5年", "10年", "4年", "", ""], "r": "B", "e": "根据规定，企业发生的亏损，在税前利润弥补时，下一年度利润不足弥补的，可用以后年度利润延续弥补，但延续弥补期最长不得超过5年。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973660", "t": 1, "q": "下列营运能力指标中，用于衡量存货周转速度的是？", "a": ["流动资产周转率", "存货周转次数", "总资产周转率", "应收账款周转天数", "", ""], "r": "B", "e": "衡量存货周转速度的指标有存货周转次数和存货周转天数等。A选项流动资产周转率衡量流动资产整体周转情况；C选项总资产周转率衡量总资产周转情况；D选项应收账款周转天数衡量应收账款周转速度。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973661", "t": 1, "q": "滚动预算的主要优点是？", "a": ["预算期与会计年度完全一致", "不需要考虑市场变化因素", "编制简单，工作量小", "能够保持预算的连续性和完整性", "", ""], "r": "D", "e": "滚动预算是随时间推移不断延伸补充预算，能使预算始终保持一定期限，保持连续性和完整性。A选项，滚动预算预算期与会计年度不一定完全一致；B选项，滚动预算要考虑市场变化等因素；C选项，滚动预算编制工作量大。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973662", "t": 1, "q": "滚动预算的主要缺点是？", "a": ["预算工作量大", "预算准确性低", "不能适应企业经营活动变化", "预算期不连续", "", ""], "r": "A", "e": "滚动预算需不断调整和补充预算，这会导致预算工作量增大，所以主要缺点是预算工作量大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973663", "t": 1, "q": "下列各项中，不能用于原始投资额不同的互斥投资方案比较决策的方法有（　）。", "a": ["差额投资内部收益率法", "净现值法", "静态投资回收期法", "年等额净回收额法", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973664", "t": 1, "q": "根据企业财务制度规定，下列属于不计提折旧的固定资产的是（　）", "a": ["以融资租赁方式租入的固定资产", "以经营租赁方式租出的固定资产", "房屋和建筑物", "已提足折旧仍继续使用的固定资产", "", ""], "r": "D", "e": "已提足折旧仍继续使用的固定资产不需要再计提折旧。而以融资租赁方式租入的、以经营租赁方式租出的固定资产及房屋和建筑物都应计提折旧。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973665", "t": 1, "q": "以下关于资金时间价值的说法正确的是（　）", "a": ["资金时间价值包括通货膨胀因素但不包括风险价值因素", "资金时间价值不包括风险价值和通货膨胀因素", "资金时间价值包括风险价值因素但不包括通货膨胀因素", "资金时间价值包括风险价值和通货膨胀因素", "", ""], "r": "B", "e": "资金时间价值是指在没有风险和没有通货膨胀的情况下，货币经历一定时间的投资和再投资所增加的价值。所以资金时间价值不包括风险价值和通货膨胀因素。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973666", "t": 1, "q": "在标准成本控制下的成本差异是指（　）。", "a": ["实际成本与预算成本的差异", "实际成本与标准成本的差异", "预算成本与标准成本的差异", "实际成本与计划成本的差异", "", ""], "r": "B", "e": "标准成本控制下，成本差异就是实际成本和标准成本对比得出的差异。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973667", "t": 1, "q": "企业在进行风险投资时，如果有甲、乙两个方案可供选择，已知甲方案预期收益率高于乙方案，而其标准差率低于乙方案，则企业应该选择（　）", "a": ["无法确定", "两方案皆可", "乙方案", "甲方案", "", ""], "r": "D", "e": "预期收益率高且标准差率低，意味着甲方案收益高同时风险低，所以应选甲方案。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973668", "t": 1, "q": "在各类债券中，信誉等级最高的是（　）", "a": ["商业银行发行的金融债券", "跨国公司发行的企业债券", "国有企业发行的企业债券", "财政部发行的国库券", "", ""], "r": "D", "e": "国库券由国家财政部发行，以国家信用作担保，信誉等级通常是最高的。而金融债券、企业债券的信用度相对低于国家信用。所以答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973669", "t": 1, "q": "下列关于企业偿债能力分析的表述，正确的是？", "a": ["产权比率与资产负债率的经济含义完全相同", "资产负债率越高，说明企业长期偿债能力越强", "现金比率能直接反映企业的短期偿债能力", "流动比率和速动比率越高越好", "", ""], "r": "C", "e": "A选项，产权比率与资产负债率虽都体现偿债能力，但侧重点有别，经济含义不同；B选项，资产负债率高意味着负债占比大，长期偿债能力弱；D选项，流动比率和速动比率并非越高越好，过高可能存在资金闲置等问题。而现金比率用现金类资产衡量短期偿债能力，能直接反映。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973670", "t": 1, "q": "下列关于营运资金管理策略的说法，正确的是？", "a": ["保守型策略下，企业的流动资产投资规模较大", "适中型策略下，流动资产与流动负债保持固定比例", "激进型策略下，企业的风险和收益都较低", "三种策略中，保守型策略的资金成本最低", "", ""], "r": "A", "e": "保守型策略流动资产投资规模大，能降低短缺风险但资金成本高；适中型策略是预期现金流动与流动负债配合；激进型策略风险和收益高；保守型策略资金成本高。所以A正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973671", "t": 1, "q": "下列适用于销售业务略有波动的产品的预测方法是（　）。", "a": ["平滑指数法", "趋势平均法", "移动平均法", "加权平均法", "", ""], "r": "A", "e": "平滑指数法可根据实际情况调整对不同时期数据的重视程度，能较好应对销售业务略有波动的情况。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973672", "t": 1, "q": "双倍余额递减法是在不考虑固定资产的残值情况下，以年限平均法折旧率的两倍乘以每年固定资产的（　）来确定每年折旧额。", "a": ["原始价值", "重置价值", "折余价值", "应计折旧价值", "", ""], "r": "C", "e": "双倍余额递减法是用年限平均法折旧率的两倍乘以每年年初固定资产折余价值来确定每年折旧额。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973673", "t": 1, "q": "零基预算编制过程中，最关键的步骤是？", "a": ["提出预算期内各种活动内容及费用开支方案", "划分不可避免费用项目和可避免费用项目", "对各费用项目进行成本-效益分析", "分配资金，落实预算", "", ""], "r": "C", "e": "零基预算关键是对各费用项目进行成本 - 效益分析，以此确定项目的优先级和资源分配，其他步骤围绕此展开。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973674", "t": 1, "q": "下列关于企业成本控制的说法，错误的是？", "a": ["成本控制的目的是降低成本，无需考虑产品质量", "成本控制应贯穿于企业生产经营的全过程", "成本控制可以采用标准成本法、作业成本法等方法", "成本控制的关键是对成本支出的控制", "", ""], "r": "A", "e": "成本控制既要降低成本，也要保证产品质量，A选项只强调降低成本而不考虑产品质量说法错误；成本控制需贯穿企业生产经营全过程，可采用标准成本法、作业成本法等，关键在于对成本支出控制，B、C、D选项正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973675", "t": 1, "q": "审计监督在企业风险控制中的最基本作用是？", "a": ["促进企业战略实现", "评价企业管理层业绩", "提高企业经济效益", "保证财务信息的真实性和合法性", "", ""], "r": "D", "e": "审计监督是对企业财务等活动进行审查。其最基本作用是保证财务信息真实合法，这是审计监督开展的基础和首要任务，其他作用都是在此基础上衍生。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973676", "t": 1, "q": "下列关于滚动预算与定期预算的比较，错误的是？", "a": ["定期预算缺乏灵活性", "滚动预算的编制成本低于定期预算", "定期预算的预算期与会计年度一致", "滚动预算能及时反映企业经营变化", "", ""], "r": "B", "e": "滚动预算需不断调整和补充预算，编制成本高于定期预算。A 选项，定期预算固定期间编制，缺乏灵活性；C 选项，定期预算通常按会计年度编制；D 选项，滚动预算持续更新，能及时反映企业经营变化。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973677", "t": 1, "q": "全部不等额系列付款现值的计算机公式为（　）", "a": ["「test/yiwen_img/importSubject/2034528512047714304.png」", "「test/yiwen_img/importSubject/2034528512861409280.png」", "「test/yiwen_img/importSubject/2034528512966266880.png」", "「test/yiwen_img/importSubject/2034528513071124480.png」", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973678", "t": 1, "q": "下列公式错误的是（　）", "a": ["每股股利=「test/yiwen_img/importSubject/2034528513180176384.png」", "销售净利润率=「test/yiwen_img/importSubject/2034528513289228288.png」", "市盈率=「test/yiwen_img/importSubject/2034528513398280192.png」", "每股收益=「test/yiwen_img/importSubject/2034528513528303616.png」", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973679", "t": 1, "q": "企业连续8年于每年末存款1000元，年利率8%，则在第8年末可一次取出本利和（　）。", "a": ["5747元", "10637元", "8640元", "8000元", "", ""], "r": "B", "e": "本题可根据年金终值公式来计算第8年末的本利和。年金终值是指一定时期内，每期期末等额收入或支出的本利和。其计算公式为「test/yiwen_img/importSubject/2034528516577562624.png」，其中F为年金终值，A为每期等额收付的金额，i为年利率，n为期数。已知A = 1000元，「test/yiwen_img/importSubject/2034528516665643008.png」，n = 8，将其代入公式可得：「test/yiwen_img/importSubject/2034528516753723392.png」=1000\\times\\frac{1.85093 - 1}{0.08}「test/yiwen_img/importSubject/2034528516841803776.png」=1000\\times10.6366「test/yiwen_img/importSubject/2034528516950855680.png」（元）所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973680", "t": 1, "q": "对于距离银行较远或交通不便的企业的库存现金数额，一般不得超过（　）天零星开支的正常需要。", "a": ["九", "十五", "三", "七", "", ""], "r": "B", "e": "《现金管理暂行条例》第九条：边远地区和交通不便地区开户单位库存现金限额可多于5天，但不得超过15天的日常零星开支。 B.十五，符合法定上限。", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973681", "t": 1, "q": "某企业按\"2/10，n/30\"的信用条件购进一批商品，若企业放弃现金折扣，其放弃现金折扣的信用成本率为？", "a": ["2%", "36.73%", "10%", "30%", "", ""], "r": "B", "e": "放弃现金折扣的信用成本率公式为\\[ \\frac{折扣百分比}{1 - 折扣百分比}×\\frac{360}{信用期 - 折扣期}\\] ，本题中折扣百分比是2%，信用期30天，折扣期10天，代入公式可得「test/yiwen_img/importSubject/2034528517068296192.png」。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973682", "t": 1, "q": "下列不属于预算控制方法的是？", "a": ["预算授权控制", "预算调整控制", "市场价格控制", "预算审核控制", "", ""], "r": "C", "e": "预算控制方法主要围绕预算本身的编制、执行、调整等环节。A选项预算授权控制可规范预算执行中的权限；B选项预算调整控制能应对实际与预算的差异；D选项预算审核控制可保证预算的合理性和准确性。而C选项市场价格控制是市场因素相关控制，并非预算控制方法。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973683", "t": 1, "q": "企业由于应收账款不能及时收回发生坏账而给企业造成的损失是（　）", "a": ["坏账成本", "机会成本", "管理成本", "生产成本", "", ""], "r": "A", "e": "因应收账款不能收回形成坏账带来的损失就是坏账成本。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521723973684", "t": 1, "q": "在计算留存收益资本成本时，常用的方法是？", "a": ["资本资产定价模型法", "市场利率法", "风险调整法", "债券收益率风险调整模型法", "", ""], "r": "A", "e": "留存收益资本成本计算常用资本资产定价模型法。市场利率法并非计算留存收益资本成本常用方法；风险调整法主要用于债务资本成本估计；债券收益率风险调整模型是在债券收益率基础上调整来估计股权资本成本，但不是计算留存收益资本成本最常用的。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521728167936", "t": 1, "q": "企业的资本金是指企业在成立时由出资人认缴的，经企业登记机关核准登记后的注册资本。以生产经营为主的企业注册资本不得少于（　）", "a": ["10万", "50万", "30万", "3万", "", ""], "r": "B", "e": "以生产经营为主的企业注册资本不得少于50万元。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521728167937", "t": 1, "q": "在计算债券资本成本时，需要考虑的因素不包括？", "a": ["债券筹资费用率", "债券面值", "债券发行时间", "债券票面利率", "", ""], "r": "C", "e": "债券资本成本计算与债券筹资费用率、面值、票面利率相关，而债券发行时间对其计算无影响。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528521728167938", "t": 1, "q": "某企业预计下年度销售净额为1800万元，应收账款周转天数为90天（一年按360天计算），变动成本率为60%，资本成本为10%，则应收账款的机会成本是多少？", "a": ["108万元", "27万元", "45万元", "180万元", "", ""], "r": "B", "e": "先算应收账款平均余额，用销售净额除以周转次数（360÷周转天数），即1800÷(360÷90)=450万元，再算应收账款占用资金，用平均余额乘以变动成本率，450×60% = 270万元，最后算机会成本，用占用资金乘以资本成本，270×10% = 27万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521728167939", "t": 1, "q": "为排除业务量因素的影响，在管理会计中，反映变动成本水平的指标一般是指（　）。", "a": ["变动成本的总额与单位额", "单位变动成本", "变动成本总额", "变动成本率", "", ""], "r": "B", "e": "在管理会计里，要排除业务量因素影响反映变动成本水平，单位变动成本不随业务量变动，能直接体现变动成本水平。变动成本总额受业务量影响；变动成本率是变动成本与销售收入等的比率，并非直接反映变动成本水平的指标。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528521728167940", "t": 1, "q": "下列各项中，能反映变动成本法局限性的说法是（　）", "a": ["导致企业盲目生产", "不利于成本控制", "不符合传统的成本观念", "不利于短期决策", "", ""], "r": "C", "e": "变动成本法下产品成本只包含变动生产成本，不包含固定制造费用，这与传统将固定制造费用也计入产品成本的观念不同。A选项盲目生产与变动成本法无直接关联；变动成本法利于成本控制和短期决策。所以答案选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528521728167941", "t": 1, "q": " 下列关于企业营运资金管理策略的说法，正确的是？", "a": ["紧缩的流动资产投资策略下，企业的风险和收益都较低", "宽松的流动资产投资策略下，企业的持有成本较高", "激进型融资策略下，临时性负债比重最小", "适中的流动资产投资策略下，企业的短缺成本为零", "", ""], "r": "B", "e": "紧缩策略风险和收益高，A错；激进型临时性负债比重大，C错；适中策略短缺成本和持有成本之和最小，但短缺成本不为零，D错；宽松策略流动资产多，持有成本高，B正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528521728167942", "t": 1, "q": "下列关于成本-效益原则在内部控制中的应用，说法正确的是？", "a": ["成本越低，内部控制效果越好", "效益越高，内部控制成本必然越高", "应在满足控制目标的前提下，尽可能降低成本", "为了实现控制目标，可不计成本", "", ""], "r": "C", "e": "成本 - 效益原则要求在实施内部控制时，要在满足控制目标的基础上，尽量降低成本，不能只追求低成本或高收益，也不能不计成本。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998400", "t": 2, "q": "可以将现代管理会计的发展趋势简单地概括为（　）", "a": ["规范化", "国际化", "社会化", "系统化", "", ""], "r": "ABCD", "e": "规范化是内部发展的基础要求；<br />国际化是外部环境变化的必然结果；<br />社会化是责任与伦理维度的拓展；<br />系统化是技术赋能下的整合方向。<br />这四者并非互斥，而是从不同维度共同描绘了现代管理会计的整体演进图景。因此，在多选题中应全选。", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998401", "t": 2, "q": "现行财务制度规定的固定资产折旧方法有（　）", "a": ["工作量法", "年限平均法", "年数总和法", "双倍余额递减法", "", ""], "r": "ABCD", "e": "现行财务制度规定的固定资产折旧方法包含工作量法、年限平均法、年数总和法、双倍余额递减法。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998402", "t": 2, "q": "企业在资金运动中所形成的各方面的财务关系，主要包括（　）", "a": ["企业与职工之间的财务关系", "企业与债权人、债务人、往来客户之间的财务关系", "企业与税务机关之间的财务关系", "企业与投资者和受资者之间的财务关系", "", ""], "r": "ABCD", "e": "企业资金运动中形成的财务关系涵盖多方面，与职工、债权人债务人及往来客户、税务机关、投资者和受资者等都存在财务关系。ABCD 选项分别从不同主体角度体现了这种关系。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998403", "t": 2, "q": "下列关于滚动预算特点的描述，正确的有？", "a": ["使预算期间保持连续性，避免预算间断", "减少预算编制的工作量，提高工作效率", "能够及时反映市场变化，增强预算适应性", "有助于企业进行长期战略规划和短期经营安排的衔接", "", ""], "r": "ACD", "e": "滚动预算是随时间推移不断延伸补充预算。它始终保持一定期间的预算跨度，能使预算期间连续，避免间断，A正确；它要不断调整和补充预算，会增加编制工作量，B错误；能及时根据市场变化调整预算，增强适应性，C正确；可将长期战略规划通过不断滚动的短期预算逐步落实，实现长短期衔接，D正确。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998404", "t": 2, "q": "下列关于预算编制方法选择的说法，正确的有？", "a": ["增量预算以基期预算为基础，简单易行但可能存在不合理性", "弹性预算可根据不同业务量水平编制，增强预算适应性", "不同预算编制方法可结合使用以提高预算科学性", "固定预算适用于业务量稳定、变动不大的企业或项目", "", ""], "r": "ABCD", "e": "A选项，增量预算基于基期预算调整，操作简单但易受基期不合理因素影响；B选项，弹性预算能随业务量变化调整，增强适应性；C选项，结合不同方法能发挥各自优势，提高科学性；D选项，固定预算业务量固定，适合业务稳定项目。ABCD表述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998405", "t": 2, "q": "固定资产项目投资可行性预测的内容一般包含（　）", "a": ["预测固定资产投资项目", "提出固定资产项目投资概算和筹划资金来源", "拟定固定资产项目投资方案", "核定固定资产的需用量，计算出多余或不足", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998406", "t": 2, "q": "如果某项目分两次投入流动资金，第一次投入200万元，第二次投入260万元，经营期内没有发生提前回收流动资金的现象，则下列说法中正确的有（　）。", "a": ["第一次投资时的流动资金需用额为200万元", "该项目流动资金投资合计为460万元", "第二次投资时的流动资金需用额为260万元", "第二次投资时的流动资金需用额为460万元", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998407", "t": 2, "q": "全面预算的作用概括起来有（　）。", "a": ["组织各部门的工作", "明确工作目标", "控制各部门日常经济活动", "考核各部门工作业绩", "", ""], "r": "ABCD", "e": "全面预算能为各部门设定目标，让工作有方向，可明确工作目标；能将各部门工作协调组织起来；在执行过程中可对各部门日常活动起到控制作用；还能作为考核各部门工作业绩的依据。ABCD选项均符合全面预算的作用。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998408", "t": 2, "q": "企业内部控制制度的目标包括？", "a": ["保护企业资产的安全完整", "确保财务报告及相关信息真实完整", "合理保证企业经营管理合法合规", "提高经营效率和效果，促进企业实现发展战略", "", ""], "r": "ABCD", "e": "企业内部控制制度目标涵盖资产安全、信息真实、合法合规以及提升经营效率促进战略实现等方面。ABCD四个选项均是其目标内容。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998409", "t": 2, "q": "关于企业预算与战略的关系，以下表述正确的有？", "a": ["预算执行情况可反馈调整企业战略", "预算是企业战略目标的具体化和分解落实", "战略为预算编制提供方向和指导", "良好的预算管理有助于推动企业战略实现", "", ""], "r": "ABCD", "e": "企业战略为预算编制指引方向，预算是战略目标分解落实，良好预算管理能助力战略实现，且预算执行情况可反馈来调整战略。ABCD选项均正确阐述了企业预算与战略的关系。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998410", "t": 2, "q": "在相关范围内保持不变的有（　）。", "a": ["单位变动成本", "固定成本总额", "单位固定成本", "总成本", "", ""], "r": "AB", "e": "在相关范围内，单位变动成本不变，固定成本总额不变；单位固定成本随业务量变化而反向变动，总成本会随业务量变化。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998411", "t": 2, "q": "在预算编制中，零基预算与滚动预算的区别体现在？", "a": ["编制频率不同，零基预算一般定期编制，滚动预算持续滚动更新", "编制复杂程度不同，零基预算编制更为复杂", "编制起点不同，零基预算从零开始，滚动预算基于上期预算", "适用场景不同，零基预算适合新业务或费用不确定场景，滚动预算侧重动态调整", "", ""], "r": "ABCD", "e": "零基预算不受以往预算安排情况的影响，一切从实际需要出发，编制时从零开始；滚动预算是在上期预算完成情况基础上，调整和编制下期预算，并将预算期间逐期连续向后滚动推移。各选项均正确概括了两者区别。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998412", "t": 2, "q": "变动成本法下期间成本包括（　）。", "a": ["管理费用", "销售费用", "制造费用", "固定生产成本", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998413", "t": 2, "q": "下列方法中考虑现金流量的有（　）。", "a": ["净现值率法", "内部收益率法", "静态投资回收期", "净现值法", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998414", "t": 2, "q": "审计监督在企业风险控制中的作用有？", "a": ["促进企业合规经营", "替代内部控制制度", "评价内部控制有效性", "发现财务舞弊行为", "", ""], "r": "ACD", "e": "审计监督可审查企业经营活动是否合规，能促进企业合规经营；可对内部控制进行评价，判断其有效性；也能发现财务舞弊等违规行为。但审计监督不能替代内部控制制度。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998415", "t": 2, "q": "管理会计的现金流量表与财务会计的现金流量表相比，在形式上主要存在的差别有（　）。", "a": ["期间特征不同", "信息属性不同", "结构不同", "勾稽关系不同", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998416", "t": 2, "q": "在管理会计中，构成全面预算内容的有（　）。", "a": ["零基预算", "财务预算", "专门决策预算", "滚动预算", "", ""], "r": "BC", "e": "全面预算包括业务预算、专门决策预算和财务预算。A选项零基预算和D选项滚动预算是预算编制方法，并非全面预算内容。所以答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998417", "t": 2, "q": "在对各项费用的日常开支进行控制时，需要按一定的提取比例进行控制的项目有（　）", "a": ["公会经费", "业务招待费", "租赁费", "职工福利费", "", ""], "r": "AD", "e": "公会经费、职工福利费按规定有提取比例，业务招待费是按发生额60%且不超当年销售（营业）收入5‰扣除，租赁费无提取比例要求。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998418", "t": 2, "q": "下列关于预算编制与企业财务管理关系的表述，正确的有？", "a": ["预算编制结果影响企业资金配置和财务决策", "良好的预算编制有助于提升企业财务管理水平", "财务管理为预算编制提供数据和分析支持", "预算编制是企业财务管理的重要环节", "", ""], "r": "ABCD", "e": "预算编制是企业财务管理重要部分，其结果影响资金配置和财务决策，良好的预算编制能提升财务管理水平，而财务管理也为预算编制提供数据等支持。ABCD选项均正确反映了预算编制与企业财务管理的关系。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998419", "t": 2, "q": "年金是一种特殊的等额系列收付款项，其特点包括（　）。", "a": ["连续性", "同方向性", "等额性", "递减性", "", ""], "r": "ABC", "e": "年金是在一定时期内每次等额收付的系列款项，具有连续性、等额性，且款项收付方向相同即同方向性。而不是递减性。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998420", "t": 2, "q": "单纯固定资产投资项目的现金流量有（　）。", "a": ["增加的各项税款", "新增经营成本", "固定资产投资", "增加的营业收入", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998421", "t": 2, "q": "下列项目中，可以作为管理会计主体的有（　）。", "a": ["班组", "车间", "企业整体", "分厂", "", ""], "r": "ABCD", "e": "管理会计主体具有多层次性，可根据管理需要灵活设定。班组、车间、分厂和企业整体都能进行管理活动、规划决策等，都可作为管理会计主体。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998422", "t": 2, "q": "下列属于内部控制中控制环境要素的有？", "a": ["人力资源政策", "内部审计机构设置", "企业文化", "治理结构", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998423", "t": 2, "q": "关于企业应收账款周转率指标，说法正确的有？", "a": ["该指标过高可能意味着企业信用政策过严", "应收账款周转率与销售收入规模无关", "应收账款周转率越高，通常表明收账速度越快", "应收账款周转率低可能导致坏账损失增加", "", ""], "r": "ACD", "e": "应收账款周转率高说明收账快，若过高可能是信用政策过严；周转率低则收款慢，易致坏账增加。它和销售收入规模有关。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998424", "t": 2, "q": "关于现值指数（PI）的说法，正确的有？", "a": ["PI>1时，项目在经济上可行", "可用于独立方案的优劣排序", "现值指数考虑了原始投资额与未来收益的关系", "计算时不需要确定折现率", "", ""], "r": "ABC", "e": "PI>1说明未来现金净流量现值大于原始投资额现值，项目经济上可行；PI考虑了原始投资额与未来收益关系；可用于独立方案优劣排序。计算PI需确定折现率。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998425", "t": 2, "q": "下列关于企业盈利能力指标之间关系的表述，正确的有？", "a": ["净资产收益率=总资产净利率×权益乘数", "销售毛利率是销售净利率的基础", "成本费用利润率与销售净利率无关", "总资产净利率=销售净利率×总资产周转率", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998426", "t": 2, "q": "下列各项中，属于多方案决策的有（　）", "a": ["单一方案决策", "排队方案决策", "组合方案决策", "接受或拒绝方案决策", "", ""], "r": "BC", "e": "多方案决策是指在多个可供选择的方案中进行决策。排队方案决策是对多个方案按一定标准排序选优，组合方案决策是从多个方案中选取合适方案组合，都属于多方案决策。单一方案决策只有一个方案，接受或拒绝方案决策也是针对单个方案的判断，不属于多方案决策。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998427", "t": 2, "q": "编制弹性预算所用业务量可以是（　）。", "a": ["机器台时", "产量", "销售量", "材料消耗量", "", ""], "r": "ABCD", "e": "弹性预算是在成本性态分析基础上，依据业务量、成本和利润间的联动关系，按一系列可能的业务量编制预算。机器台时、产量、销售量、材料消耗量都可作为业务量来编制弹性预算。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998428", "t": 2, "q": "确定企业股利政策时，需要考虑的法律因素主要有（　）", "a": ["稳定股价约束", "资本保全约束", "偿债能力约束", "集中控制权约束", "", ""], "r": "BC", "e": "法律因素主要有资本保全约束、偿债能力约束等。稳定股价约束是股东因素，集中控制权约束也是股东考虑因素。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998429", "t": 2, "q": "利润中心分为（　）。", "a": ["自然利润中心", "人为利润中心", "内部利润中心", "外部利润中心", "", ""], "r": "AB", "e": "利润中心按其形成方式可分为自然利润中心和人为利润中心。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528523472998430", "t": 2, "q": "某企业年初资产负债率为38.7%，年末负债率为33.83%，则以下说法正确的有（　）", "a": ["企业负债比率只占总资产的1/3左右，说明企业并没有很好的利用负债增加企业的收益", "如企业资产负债率大于100%，则说明该企业资不抵债", "债权人希望企业的资产负债率越高越好", "该公司资产负债率年末较年初低，说明企业的偿债能力年末更强", "", ""], "r": "BD", "e": "资产负债率降低，表明负债占资产比重下降，偿债能力增强；资产负债率大于100%意味着负债超过资产即资不抵债；企业适度负债可增加收益，并非负债率低就没利用好负债；债权人希望企业资产负债率低以降低风险。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528524097949696", "t": 3, "q": "间接成本在产品成本中所占比重较大的情况下，产量基础成本计算制度往往会夸大高产量产品的成本，而缩小低产量产品的成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 财务管理（2）", "n": "基础练习题【含解析】 / 第1章 财务管理（2）", "qs": [{"id": "2034528530217439232", "t": 1, "q": "应收账款周转次数多，表明企业？", "a": ["短期偿债能力弱", "坏账损失可能性大", "收账速度慢", "应收账款管理效率高", "", ""], "r": "D", "e": "应收账款周转次数多意味着在一定时期内应收账款收回的次数频繁。周转次数多，说明收账快，能及时收回资金，体现应收账款管理效率高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439233", "t": 1, "q": "下列关于成本费用预算编制方法的表述，正确的是？", "a": ["增量预算法不受基期成本费用水平的影响", "滚动预算法能够使预算期间与会计年度相脱节", "零基预算法适用于所有成本费用预算的编制", "固定预算法能准确反映业务量变化对成本的影响", "", ""], "r": "B", "e": "A选项，增量预算法是以基期成本费用水平为基础，会受其影响；C选项，零基预算法编制工作量大，并非适用于所有成本费用预算编制；D选项，固定预算法不考虑业务量变化，不能准确反映业务量变化对成本的影响。滚动预算法是逐期滚动，会使预算期间与会计年度相脱节。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439234", "t": 1, "q": "某企业向银行借款100万元，年利率6%，筹资费率1%，企业所得税税率25%，其借款的资本成本为？", "a": ["6.06%", "4.50%", "6.00%", "4.55%", "", ""], "r": "D", "e": "借款资本成本=年利率×（1 - 所得税税率）÷（1 - 筹资费率），即「test/yiwen_img/importSubject/2034528525062639616.png」。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439235", "t": 1, "q": "下列企业财产清偿顺序正确的是（　）", "a": ["321", "123", "231", "132", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439236", "t": 1, "q": "某企业流动比率为3，现用银行存款偿还应付账款，该业务会导致？", "a": ["流动比率上升", "流动比率不变", "流动比率下降", "营运资金减少", "", ""], "r": "A", "e": "流动比率=流动资产/流动负债，用银行存款偿还应付账款，流动资产和流动负债等额减少。原流动比率为3，说明流动资产大于流动负债，分子分母等额减少，分数值会增大，即流动比率上升。营运资金=流动资产 - 流动负债，二者等额减少，营运资金不变。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439237", "t": 1, "q": "假设平滑指数=0.6,9月份实际销售量为600千克，原来预测9月份销售量为630千克，则预测10月份的销售量为（　）。", "a": ["612千克", "630千克", "618千克", "600千克", "", ""], "r": "A", "e": "本题可根据指数平滑法的计算公式来计算预测10月份的销售量。### 步骤一：明确指数平滑法的计算公式指数平滑法预测销售量的公式为：预测销售量 = 平滑指数×实际销售量+(1 - 平滑指数)×预测销售量。### 步骤二：确定各参数值已知平滑指数= 0.6，9月份实际销售量为600千克，原来预测9月份销售量为630千克。### 步骤三：代入数据计算预测10月份的销售量将上述参数代入公式可得：0.6×600+(1 - 0.6)×630=360 + 252= 612（千克）综上，预测10月份的销售量为612千克，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439238", "t": 1, "q": "某企业拟进行一项投资，有甲、乙两个方案可供选择。甲方案需投资20000元，使用寿命5年，采用直线法计提折旧，5年后设备无残值，5年中每年销售收入为8000元，每年付现成本为3000元。假设所得税税率为25%，资本成本为10%。已知（P/A，10%，5）=3.7908，（P/F，10%，5）=0.6209。甲方案的净现值为？", "a": ["3187.5元", "5187.5元", "2187.5元", "4187.5元", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439239", "t": 1, "q": " 当净现值（NPV）大于0时，意味着？", "a": ["项目的实际收益率等于折现率", "项目的实际收益率小于折现率", "该项目不可行", "项目的实际收益率大于折现率", "", ""], "r": "D", "e": "净现值是把未来现金流量折现到当前，当NPV大于0，说明项目未来现金流量现值大于初始投资，意味着项目实际能获得的收益率高于用来折现的折现率。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439240", "t": 1, "q": "清算报告要经（　）验证后，报企业主管机关和原登记注册机关，办理停业登记。", "a": ["注册会计师", "工商部门", "税务部门", "会计主管", "", ""], "r": "A", "e": "清算报告需专业、独立第三方验证其真实性和准确性，注册会计师具备此专业能力和资质。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439241", "t": 1, "q": "下列指标中，用于衡量企业长期偿债能力且考虑了利息因素的是？", "a": ["权益乘数", "资产负债率", "产权比率", "利息保障倍数", "", ""], "r": "D", "e": "权益乘数、资产负债率、产权比率反映长期偿债能力但未考虑利息，利息保障倍数是息税前利润与利息费用之比，既衡量长期偿债能力又考虑了利息。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439242", "t": 1, "q": "若某投资项目净现值等于0，意味着？", "a": ["项目实际收益率等于折现率", "项目不可行", "项目亏损", "项目没有收益", "", ""], "r": "A", "e": "净现值是将项目各期现金流量按折现率折现后与初始投资的差值，净现值为0时，说明项目实际收益率刚好等于设定的折现率。净现值等于0项目是可行的，并非亏损或无收益。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439243", "t": 1, "q": "内部收益率（IRR）法的主要缺点是？", "a": ["不便于理解和应用", "计算过程复杂", "没有考虑货币时间价值", "不能直接用于互斥方案的决策", "", ""], "r": "D", "e": "内部收益率计算复杂，而且对于互斥方案不能直接用内部收益率高低来决策，需进一步分析。A选项内部收益率较易理解；C选项内部收益率考虑了货币时间价值。主要缺点更侧重不能直接用于互斥方案决策。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439244", "t": 1, "q": "如果完全成本法的期末存货成本比期初存货成本多10000元，而变动成本法的期末存货成本比期初存货成本多4000元，则可断定两种成本法的营业利润之差为（　）", "a": ["4 000元", "6 000元", "10 000元", "14 000元", "", ""], "r": "B", "e": "两种成本法营业利润之差 = 完全成本法下期末存货固定制造费用 - 完全成本法下期初存货固定制造费用 = 完全成本法期末与期初存货成本差 - 变动成本法期末与期初存货成本差，即10000 - 4000 = 6000元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439245", "t": 1, "q": "某企业计划投资项目，已知该项目的净现值大于0，其内部收益率（IRR）和必要收益率（r）的关系是？", "a": ["IRR<r", "IRR>r", "无法确定", "IRR=r", "", ""], "r": "B", "e": "净现值大于0，意味着项目实际收益率高于必要收益率，内部收益率是使净现值为0的折现率，所以内部收益率大于必要收益率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439246", "t": 1, "q": "应收账款周转率指标的计算中，应收账款平均余额的计算方法是？", "a": ["期初应收账款余额÷2", "期末应收账款余额÷2", "本期应收账款借方发生额÷2", "（期初应收账款余额+期末应收账款余额）÷2", "", ""], "r": "D", "e": "应收账款平均余额为反映一定时期内应收账款的平均水平，通常用期初与期末应收账款余额之和除以2来计算。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439247", "t": 1, "q": "下列关于营运资金管理的说法，正确的是？", "a": ["营运资金的周转具有短期性", "营运资金就是流动资产", "营运资金越多越好", "营运资金的管理只涉及流动资产", "", ""], "r": "A", "e": "营运资金周转期短，通常在一年或一个营业周期内，A正确；营运资金=流动资产 - 流动负债，B错误；营运资金并非越多越好，过多会导致资金闲置浪费，C错误；营运资金管理涉及流动资产和流动负债，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439248", "t": 1, "q": "下列有关资金时间价值的表述，正确的是（　）", "a": ["资金时间价值只能用绝对数来表述", "资金时间价值的实质是资金周转使用后的增值额", "资金时间价值是推迟消费所获得的报酬", "资金时间价值无法进行计量", "", ""], "r": "B", "e": "资金时间价值实质是资金周转使用后的增值额。A选项，可用相对数和绝对数表述；C选项，表述不全面；D选项，可计量。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439249", "t": 1, "q": "滚动预算中，使预算期间保持一个固定长度，但其预算日期是连续不断变动的预算方法是？", "a": ["混合滚动", "定期滚动", "逐年滚动", "逐月滚动", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439250", "t": 1, "q": "在企业审计监督中，外部审计的主要职责是？", "a": ["参与企业经营决策制定", "对企业财务报表进行审计鉴证", "监督企业内部管理制度执行", "评价企业内部控制有效性", "", ""], "r": "B", "e": "外部审计主要是对企业财务报表进行独立审计并提供鉴证。A选项参与经营决策制定不是外部审计职责；C和D通常是内部审计工作。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439251", "t": 1, "q": "按资产全新情况下的现价或成本减去已使用年限的折旧，来确认被评估资产价值的方式是（　）", "a": ["历史成本法", "重置成本法", "市场法", "收益法", "", ""], "r": "B", "e": "重置成本法是按资产全新情况下的现价或成本减去已使用年限的折旧来确认资产价值。历史成本法以原始成本计价；市场法是参照市场上类似资产交易价格评估；收益法是基于资产未来收益评估。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439252", "t": 1, "q": "下列各项业务中，能够形成\"本企业与债务人之间财务关系\"的是（　）", "a": ["归还所欠丁公司的贷款", "从甲公司赊购产品", "购买丙公司发行的债券", "向乙公司支付利息", "", ""], "r": "C", "e": "企业与债务人的财务关系是指企业将资金以购买债券、提供借款或商业信用等形式出借给其他单位所形成的经济关系。选项C购买丙公司发行的债券，本企业是债权人，丙公司是债务人，形成本企业与债务人之间财务关系。A是偿还债务，B是形成债务，D是支付利息，均不符合与债务人关系。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439253", "t": 1, "q": "在互斥投资方案决策中，当净现值法和内部收益率法的结论不一致时，应以哪种方法为准？", "a": ["内部收益率法", "净现值法", "投资回收期法", "现值指数法", "", ""], "r": "B", "e": "互斥方案决策中，净现值法假定资金再投资收益率是项目的资本成本，更符合实际情况，当净现值法和内部收益率法结论不一致时，应以净现值法为准。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439254", "t": 1, "q": "将决策分为确定型决策、风险性决策和不确定决策是按（　）进行的分类。", "a": ["决策条件的肯定程度", "决策规划时期的长短", "决策解决问题的内容", "决策本身的重要程度", "", ""], "r": "A", "e": "按决策条件的肯定程度，决策可分为确定型、风险型和不确定型决策。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439255", "t": 1, "q": "若某项目净现值为负，其含义是？", "a": ["项目的收益低于成本", "项目的收益超过成本", "项目的收益等于成本", "无法判断项目收益与成本关系", "", ""], "r": "A", "e": "净现值是指特定方案未来现金流入的现值与未来现金流出的现值之间的差额。净现值为负，意味着现金流出的现值大于现金流入的现值，也就是项目的收益低于成本。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439256", "t": 1, "q": "下列表述中，属于流动资金周转特点的是（　）", "a": ["使用中流动资产价值的双重存在性", "流动资金占用形态具有不变性", "流动资金占用数量具有稳定性", "流动资金循环与生产经营周期具有一致性", "", ""], "r": "D", "e": "流动资金循环与生产经营周期一致，这是其周转特点。A是固定资产特点；流动资金占用形态会不断变化，占用数量也不稳定，BC错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439257", "t": 1, "q": "某企业只生产一种产品，单价6元，单位变动生产成本4元，单位销售和管理变动成本0.5元，销量为500件，则其产品贡献边际为（　）元", "a": ["850", "750", "950", "650", "", ""], "r": "B", "e": "贡献边际=（单价 - 单位变动成本）×销量，单位变动成本是生产和销售管理变动成本之和即4 + 0.5 = 4.5元，所以贡献边际=(6 - 4.5)×500 = 750元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439258", "t": 1, "q": "一张面值为1000元的债券，票面收益率为10%，期限4年，发行价格为900元，债券购买者在到期时可获利息400元则实际收益率为（　）", "a": ["8.32%", "11.11%", "13.89%", "10%", "", ""], "r": "C", "e": "实际收益包括利息和价差收益，利息400元，价差1000 - 900 = 100元，总收益500元，本金900元，期限4年，根据公式实际收益率=（总收益÷本金÷期限）×100%，即（500÷900÷4）×100%≈13.89%。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439259", "t": 1, "q": "非专利技术最大的特点是（　）", "a": ["独占性", "创造性", "实用性", "保密性", "", ""], "r": "D", "e": "非专利技术未公开、未申请专利，靠自身保密来维护其价值，保密性是其最大特点。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439260", "t": 1, "q": "下列关于内部收益率法的局限性，表述错误的是？", "a": ["不能直接用于互斥项目的决策", "可能存在多个内部收益率", "不适用于独立项目的评价", "假设再投资收益率不合理", "", ""], "r": "C", "e": "内部收益率法可用于独立项目评价，根据其内含报酬率与企业要求的报酬率比较来判断项目是否可行，C表述错误。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439261", "t": 1, "q": "企业建立内部控制制度的核心目标是？", "a": ["保证资产安全", "合理保证企业经营管理合法合规", "防范和管控风险", "提高经营效率和效果", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439262", "t": 1, "q": "在长期投资决策中，固定资产原值等于（　）。", "a": ["固定资产投资与流动资金投资之和", "固定资产投资与资本化利息之和", "应提折旧额", "固定资产投资", "", ""], "r": "B", "e": "固定资产原值是固定资产投资和资本化利息之和。流动资金投资与固定资产原值无关；应提折旧额是根据固定资产原值等计算得出；固定资产投资未包含资本化利息。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439263", "t": 1, "q": "企业进行投融资决策时，不需要考虑的因素是？", "a": ["风险水平", "项目期限", "资本成本", "企业员工数量", "", ""], "r": "D", "e": "投融资决策主要关注资金的投入产出、风险及成本等与财务和项目相关因素。风险水平影响投资收益稳定性，项目期限关系资金回笼时间，资本成本涉及融资成本高低。而企业员工数量与投融资的收益、风险、成本等核心要素无直接关联。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439264", "t": 1, "q": "股东财富最大化目标的评价指数主要是（　）", "a": ["每股收益", "每股净资产", "每股市价", "净资产收益率", "", ""], "r": "C", "e": "股东财富最大化意味着股东权益市场价值最大化，每股市价反映了市场对公司价值的评价，能直接体现股东财富，所以股东财富最大化目标的评价指数主要是每股市价。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439265", "t": 1, "q": "下列关于企业偿债能力分析的表述，错误的是？", "a": ["资产负债率反映企业长期偿债能力", "现金比率为1时，企业短期偿债能力最强", "流动比率过高可能意味着企业资金闲置", "速动比率比流动比率更能反映短期偿债能力", "", ""], "r": "B", "e": "现金比率并非为1时企业短期偿债能力最强，该比率过高表明企业持有大量现金类资产，资金利用效率低，适度的现金比率才合理。A资产负债率是衡量长期偿债能力指标；C流动比率过高说明流动资产多，可能资金闲置；D速动比率剔除存货等变现能力弱资产，更能反映短期偿债能力。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439266", "t": 1, "q": "Q为企业股票市场价值和企业重置成本之比，当Q>1时（　）", "a": ["以上都可能", "无法判断", "购并可能性大", "购并可能性小", "", ""], "r": "D", "e": "托宾 Q = 企业股票市场价值 / 重置成本，Q>1 时市场价值高于重置成本，收购企业比新建成本更高，购并可能性小；Q<1 时购并可能性大。", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439267", "t": 1, "q": "下列财务分析指标中，最能反映企业短期偿债能力的是？", "a": ["资产负债率", "流动比率", "利息保障倍数", "权益乘数", "", ""], "r": "B", "e": "短期偿债能力是指企业以流动资产偿还流动负债的能力。流动比率是流动资产与流动负债的比率，能直接体现企业短期内用流动资产偿还流动负债的能力。资产负债率衡量长期偿债总体状况；利息保障倍数反映长期偿债付息能力；权益乘数反映企业负债程度。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439268", "t": 1, "q": "下列不属于内部控制要素中风险评估内容的是？", "a": ["目标设定", "风险应对", "风险识别", "内部审计", "", ""], "r": "D", "e": "内部控制要素中风险评估包括目标设定、风险识别、风险分析和风险应对。内部审计是一种监督活动，不属于风险评估内容。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439269", "t": 1, "q": " 下列关于资本成本的说法，错误的是？", "a": ["资本成本与投资决策无关", "资本成本是企业筹资和使用资金所付出的代价", "资本成本包括筹资费用和用资费用", "资本成本是选择筹资方式的依据", "", ""], "r": "A", "e": "资本成本在投资决策中很重要，是评价投资项目是否可行的重要标准，A说法错误。资本成本就是企业筹资和使用资金付出的代价，包括筹资和用资费用，也是选择筹资方式的依据，B、C、D说法正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439270", "t": 1, "q": "关于企业盈利能力指标的表述，错误的是？", "a": ["总资产收益率衡量全部资产的获利能力", "净资产收益率不受财务杠杆影响", "营业利润率可反映经营活动获利水平", "销售毛利率剔除了期间费用影响", "", ""], "r": "B", "e": "净资产收益率受财务杠杆影响，财务杠杆会通过影响权益乘数等对其产生作用。而A、C、D表述均正确。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439271", "t": 1, "q": "若企业流动比率小于1，则赊购原材料会导致？", "a": ["流动比率不变", "营运资金增加", "流动比率上升", "流动比率下降", "", ""], "r": "C", "e": "流动比率小于1时，分子分母同时增加相同数，分数值会上升。赊购原材料使流动资产和流动负债等额增加，所以流动比率上升。营运资金=流动资产 - 流动负债，二者等额增加，营运资金不变。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439272", "t": 1, "q": "管理会计的服务侧重于（　）。", "a": ["债权人", "股东", "企业内部的经营管理", "外部集团", "", ""], "r": "C", "e": "管理会计主要是为企业内部各级管理人员提供有效经营和最优化决策的信息，其服务侧重于企业内部的经营管理。而债权人、股东、外部集团是财务会计主要服务对象。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439273", "t": 1, "q": "若企业速动比率小于1，可能出现的情况是？", "a": ["企业可能面临到期债务不能及时偿还的风险", "企业拥有较多的现金类资产", "企业存在较多不能变现的存货", "企业短期偿债能力很强", "", ""], "r": "A", "e": "速动比率小于1，意味着速动资产小于流动负债，到期债务偿还可能有困难。B选项速动比率低说明现金类资产可能少；C选项速动资产已扣除存货；D选项速动比率低短期偿债能力弱。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439274", "t": 1, "q": "在应用高低点法进行成本性态分析时，选择高点坐标的依据是（　）", "a": ["最高的业务量和最高的成本", "最高的业务量", "最高的成本", "最高的业务量或最高的成本", "", ""], "r": "B", "e": "高低点法中高点坐标依据是最高的业务量，因为高低点法是通过业务量和成本的关系来分析成本性态，以业务量为自变量确定高低点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439275", "t": 1, "q": "在变动成本法下，其利润表所提供的中间指标是（　）", "a": ["期间成本", "营业利润", "贡献边际", "营业毛利", "", ""], "r": "C", "e": "变动成本法先计算贡献边际，即销售收入减去变动成本，它是变动成本法利润表的中间指标。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439276", "t": 1, "q": "成本中心的责任成本是指该中心的（　）。", "a": ["可控成本之和", "产品成本", "不可控成本之和", "固定成本", "", ""], "r": "A", "e": "成本中心只对可控成本负责，责任成本就是可控成本之和。产品成本包含可控与不可控成本；不可控成本不是成本中心责任范围；固定成本也有可控和不可控之分。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439277", "t": 1, "q": "下列关于净现值法的表述，正确的是？", "a": ["净现值法适用于独立投资方案的比较决策", "净现值法不需要确定折现率", "净现值法不考虑货币时间价值", "净现值法无法反映项目的实际收益率", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439278", "t": 1, "q": "下列属于用量标准的是（　）。", "a": ["小时工资率", "原材料价格", "材料消耗量", "小时制造费用", "", ""], "r": "C", "e": "用量标准是指在生产经营活动中对单位产品或服务所规定的资源消耗数量。选项中材料消耗量是用量标准；小时工资率、原材料价格、小时制造费用都属于价格标准。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439279", "t": 1, "q": "计算加权平均资本成本时，权重的确定方法中，最能反映企业现时资本成本水平的是？", "a": ["账面价值权数", "历史价值权数", "市场价值权数", "目标价值权数", "", ""], "r": "C", "e": "市场价值权数以当前市场价值为基础确定权重，能反映企业目前实际的资本结构和资本成本水平。而账面价值权数基于历史成本，目标价值权数是基于未来目标，都不能很好体现现时情况。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439280", "t": 1, "q": "下列关于全面预算管理的说法，错误的是？", "a": ["全面预算是企业对一定期间经营活动、投资活动、财务活动等作出的预算安排", "全面预算管理的最终目标是实现企业的战略目标", "财务预算是全面预算的核心内容，经营预算和专门决策预算是财务预算的基础", "全面预算包括经营预算、专门决策预算和财务预算", "", ""], "r": "C", "e": "全面预算管理中，经营预算是全面预算的基础，财务预算是全面预算的核心内容，C选项说“经营预算和专门决策预算是财务预算的基础”表述不精准，专门决策预算并非财务预算基础的常规说法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439281", "t": 1, "q": "在风险控制中，内部监督的主要形式不包括？", "a": ["自我评价", "专项监督", "外部审计", "日常监督", "", ""], "r": "C", "e": "内部监督是企业内部控制的一部分，应来自企业内部。外部审计是由外部机构进行的，不属于内部监督形式。而自我评价、专项监督、日常监督都属于企业内部监督的主要形式。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439282", "t": 1, "q": "企业与债权人、债务人、往来客户之间的财务关系为（　）", "a": ["资金结算关系", "财务关系", "债权、合同义务关系", "所有权关系", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439283", "t": 1, "q": "以下关于信用标准的说法错误的是（　）", "a": ["信用标准严格时，会减少应收账款的机会成本", "信用标准是指企业接受用户赊销条件时，用户必须具备的最低财务能力", "信用标准宽松时，会增加应收账款的机会成本", "信用标准通常用预计的坏账损失率来衡量", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439284", "t": 1, "q": "为了使部门经理在决策时与企业目标协调一致，应该采用的评价指标为（　）。", "a": ["销售利润率", "现金回收率", "投资报酬率", "剩余收益", "", ""], "r": "D", "e": "剩余收益指标可使部门经理决策与企业目标协调一致，它考虑了投资的机会成本，避免部门经理为追求局部利益而损害整体利益。而销售利润率、现金回收率、投资报酬率可能会使部门经理为追求自身指标而做出不利于企业整体的决策。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439285", "t": 1, "q": "在利率、现值相同的情况下，若计息期数n=1，则复利终值和单利终值的数量关系是（　）", "a": ["前者大于或小于后者", "前者大于后者", "前者等于后者", "前者小于后者", "", ""], "r": "C", "e": "当计息期数n = 1时，复利终值公式「test/yiwen_img/importSubject/2034528525297520640.png」变为F = P(1 + r)，单利终值公式F=P(1 + nr)也变为F = P(1 + r)，所以二者相等。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439286", "t": 1, "q": "净资产利润率在杜邦分析体系中是个综合性最强、最具有代表性的指标。通过系统的分析可知，提高净资产利润率的途径不包括（　）", "a": ["加强资产管理，提高其利用率和周转率", "加强销售管理，提高销售净利润率", "加强负债管理，提高产权比率", "加强负债管理，降低资产负债率", "", ""], "r": "D", "e": "净资产利润率=销售净利率×总资产周转率×权益乘数，A提高总资产周转率、B提高销售净利率可提升净资产利润率；权益乘数与产权比率正相关，提高产权比率能增大权益乘数从而提高净资产利润率。而降低资产负债率会使权益乘数变小，降低净资产利润率。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439287", "t": 1, "q": "下列属于资本成本中的用资费用的有（　）", "a": ["因发行股票而支付的发行费用", "因发行债券而支付的发行费用", "向股东支付的股利", "向银行支付的借款手续费", "", ""], "r": "C", "e": "用资费用是指企业在生产经营、投资过程中因使用资金而支付的费用，如股利和利息等。而发行费用、借款手续费属于筹资费用。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439288", "t": 1, "q": "某种产品计划单位成本为600元，成本利润率为20%，该产品的消费税税率为40%，增值税率为17%，则该产品出厂价格是（　）", "a": ["1200元", "996元", "1404元", "1000元", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439289", "t": 1, "q": "下列营运能力指标中，能反映企业流动资产周转速度的是？", "a": ["固定资产周转率", "流动资产周转天数", "存货周转次数", "总资产周转率", "", ""], "r": "B", "e": "选项A固定资产周转率反映固定资产营运能力；选项C存货周转次数主要反映存货这一流动资产项目的营运情况；选项D总资产周转率反映全部资产营运能力。而流动资产周转天数能体现企业流动资产周转速度。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439290", "t": 1, "q": "某企业的总资产周转率为1.2次，流动资产周转率为3次，若一年按360天计算，则该企业的流动资产占总资产的比重为？", "a": ["40%", "50%", "20%", "30%", "", ""], "r": "A", "e": "总资产周转率=营业收入/总资产，流动资产周转率=营业收入/流动资产，流动资产占总资产比重=流动资产/总资产，由上述公式推导可得流动资产占总资产比重=总资产周转率/流动资产周转率。代入数据1.2÷3 = 0.4即40%。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439291", "t": 1, "q": "下列关于内部审计与外部审计的说法，错误的是？", "a": ["外部审计可以对内部审计工作进行评价", "内部审计的独立性弱于外部审计", "内部审计和外部审计都有助于企业防范风险", "内部审计和外部审计的目标完全相同", "", ""], "r": "D", "e": "内部审计目标是评价和改善风险管理、控制和治理过程的效果，外部审计目标是对财务报表的合法性和公允性发表审计意见，二者目标不同。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439292", "t": 1, "q": "下列各项中，能增强企业短期偿债能力的是？", "a": ["企业向银行借入一笔短期借款", "企业采用分期付款方式购置一台大型设备", "企业出售闲置的固定资产获得现金", "企业向股东发放股票股利", "", ""], "r": "C", "e": "A选项借入短期借款会增加流动负债，降低短期偿债能力；B选项分期付款购置设备会增加长期应付款等负债，不利短期偿债；C选项出售闲置固定资产获现金增加流动资产，增强短期偿债能力；D选项发放股票股利不影响资产、负债和所有者权益金额，不影响短期偿债能力。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439293", "t": 1, "q": " 企业在进行风险控制时，下列不属于内部控制活动的是？", "a": ["预算控制", "内部审计控制", "不相容职务分离控制", "授权审批控制", "", ""], "r": "B", "e": "内部控制活动包括不相容职务分离控制、授权审批控制、会计系统控制、财产保护控制、预算控制、运营分析控制和绩效考评控制等。内部审计控制是一种监督机制，不属于内部控制活动本身。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439294", "t": 1, "q": "下列关于企业内部控制监督的说法，正确的是？", "a": ["日常监督不需要形成书面报告", "内部控制自我评价属于外部监督范畴", "专项监督针对特定业务或事项进行", "内部监督只能由内部审计部门实施", "", ""], "r": "C", "e": "日常监督需形成书面报告，A错误；内部控制自我评价是内部监督，B错误；内部监督可由多个部门实施，并非只能是内部审计部门，D错误；专项监督就是针对特定业务或事项开展的。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439295", "t": 1, "q": "下列不属于内部控制活动的是？", "a": ["不相容职务分离控制", "风险识别", "授权审批控制", "会计系统控制", "", ""], "r": "B", "e": "内部控制活动包括不相容职务分离控制、授权审批控制、会计系统控制等。而风险识别是风险评估的环节，不属于内部控制活动。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439296", "t": 1, "q": "在本量利分析中，必须假定产品成本的计算基础是（　）", "a": ["完全成本法", "吸收成本法", "制造成本法", "变动成本法", "", ""], "r": "D", "e": "本量利分析需要将成本划分为固定成本和变动成本，变动成本法能清晰区分这两类成本，为分析提供便利。而完全成本法、吸收成本法、制造成本法本质相同，未突出成本性态划分。所以答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439297", "t": 1, "q": "如果某期按变动成本法计算的营业利润为5 000元，该期产量为2 000件，销售量为1 000件，期初存货为零，固定性制造费用总额为2 000元，则按完全成本法计算的营业利润为（　）", "a": ["0元", "5 000元", "1 000元", "6 000元", "", ""], "r": "D", "e": "变动成本法下，固定制造费用全额当期扣除；完全成本法下，固定制造费用随产品销售扣除。本期产量2000件，销量1000件，固定制造费用2000元，那么单位固定制造费用1元/件，期末存货1000件，存货分担固定制造费用1000元，这部分在变动成本法下已扣除，在完全成本法下未扣除，所以完全成本法营业利润比变动成本法多1000元，即5000 + 1000 = 6000元。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439298", "t": 1, "q": "下列有关增加股东财富的表述中，正确的是（　）。", "a": ["收入是增加股东财富的因素，成本费用是减少股东财富的因素", "多余现金用于再投资有利于增加股东财富", "股东财富的增加可以用股东权益的市场价值来衡量", "提高股利支付率，有助于增加股东财富", "", ""], "r": "A", "e": "收入增加利润进而增加股东财富，成本费用降低利润减少股东财富，A正确；多余现金再投资不一定能增加股东财富，要看投资回报率等，B错误；股东财富增加用股东权益市场增加值衡量，C错误；提高股利支付率不一定增加股东财富，可能会影响企业发展，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439299", "t": 1, "q": "在变动成本法下，确定销售产品变动成本主要依据（　）进行计算。", "a": ["销售产品变动生产成本", "销售收入总额", "期末存货成本", "期初存货成本", "", ""], "r": "A", "e": "变动成本法下，销售产品变动成本主要是销售产品变动生产成本。销售收入总额与销售产品变动成本计算无关；期末存货成本和期初存货成本也不是确定销售产品变动成本的主要依据。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439300", "t": 1, "q": "在单一方案决策过程中，可能与净现值评价结论发生矛盾的评价指标是（　）。", "a": ["投资回收期", "内部收益率", "净现值率", "获利指数", "", ""], "r": "A", "e": "投资回收期不考虑资金时间价值且不考虑回收期满后现金流量，可能与考虑了资金时间价值的净现值评价结论矛盾。内部收益率、净现值率、获利指数都和净现值一样考虑资金时间价值，结论通常一致。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439301", "t": 1, "q": "某企业年初存入一笔资金，从第四年年末起，每年取出1000元，至第九年末取完，年利率为10%，则该企业最初一次存入款项为（　）元。", "a": ["3150.50", "3200.60", "3279.80", "3272.17", "", ""], "r": "D", "e": "本题可先将从第四年年末起每年取出1000元的系列款项看作普通年金，计算其在第三年末的现值，再将该现值折现到年初，即可得到企业最初一次存入的款项。### 步骤一：计算从第四年年末起每年取出1000元在第三年末的现值从第四年年末起至第九年末取完，共取了9 - 4 + 1 = 6次，每次取出1000元，这是一个普通年金。根据普通年金现值公式「test/yiwen_img/importSubject/2034528525410766848.png」（其中P为现值，A为年金，(P/A, i, n)为年金现值系数，i为利率，n为期数），已知A = 1000元，「test/yiwen_img/importSubject/2034528525515624448.png」，n = 6，查年金现值系数表可得「test/yiwen_img/importSubject/2034528525628870656.png」，则该年金在第三年末的现值为：「test/yiwen_img/importSubject/2034528525716951040.png」（元）### 步骤二：将第三年末的现值折现到年初根据复利现值公式「test/yiwen_img/importSubject/2034528525805031424.png」（其中P为现值，F为终值，(P/F, i, n)为复利现值系数，i为利率，n为期数），将第三年末的4355.3元折现到年初，此时F = 4355.3元，「test/yiwen_img/importSubject/2034528525515624448.png」，n = 3，查复利现值系数表可得「test/yiwen_img/importSubject/2034528525888917504.png」，则最初一次存入款项为：「test/yiwen_img/importSubject/2034528526027329536.png」（元）综上，答案是D选项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530217439302", "t": 1, "q": "破产清算的主要原因是（　）", "a": ["企业资不抵债", "企业因违反法律而被撤销", "企业经营期满", "企业合并", "", ""], "r": "A", "e": "破产清算核心是企业无法清偿到期债务，资不抵债是典型表现。B因违法被撤销、C经营期满、D企业合并一般不直接导致破产清算。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530221633536", "t": 1, "q": "如果产品的单价与单位变动成本上升的百分率相同，其他因素不变，则保本销售量（　）", "a": ["上升", "下降", "不变", "不确定", "", ""], "r": "B", "e": "保本销售量 = 固定成本 ÷(单价 - 单位变动成本)，单价与单位变动成本上升相同百分率，单位边际贡献（单价 - 单位变动成本）会变大，固定成本不变，保本销售量下降。", "ap": [false, false, false, false, false, false]}, {"id": "2034528530221633537", "t": 1, "q": "对于企业经营管理费用的开支，一般采用（　）作为控制标准。", "a": ["计划成本", "消耗定额", "经费预算", "目标成本", "", ""], "r": "C", "e": "企业经营管理费用多采用经费预算来控制开支，经费预算能明确规定一定时期内各项费用的额度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530221633538", "t": 1, "q": "定量分析法包括（　）。", "a": ["集合意见法", "判断分析法", "因果预测分析法", "非数量分析法", "", ""], "r": "C", "e": "定量分析法是运用数学方法对相关数据进行分析以预测和决策。集合意见法和判断分析法主要依靠人的主观判断，属于定性分析；非数量分析法也是定性分析。因果预测分析法通过建立数学模型等定量手段分析因果关系，属于定量分析法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530221633539", "t": 1, "q": "在下列各项中，能够反映上市公司股东财富最大化目标实现程度的最佳指标是？", "a": ["每股市价", "总资产报酬率", "净资产收益率", "每股收益", "", ""], "r": "A", "e": "股东财富最大化目标是指企业财务管理以实现股东财富最大为目标，在上市公司中，股东财富由其所拥有的股票数量和股票市场价格两方面决定，在股票数量一定时，股票价格达到最高，股东财富也就达到最大，所以每股市价能反映股东财富最大化目标实现程度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530221633540", "t": 1, "q": "杜邦分析法最核心的财务指标是（　）", "a": ["权益乘数", "总资产周转率", "资产净利润率", "净资产收益率", "", ""], "r": "D", "e": "杜邦分析法以净资产收益率为核心，将其分解为多个指标来综合分析企业财务状况。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528530221633541", "t": 1, "q": "在企业投融资决策中，资本成本的作用不包括？", "a": ["确定最优资本结构的参数", "选择筹资方式的依据", "决定企业经营策略的关键", "评价投资项目可行性的标准", "", ""], "r": "C", "e": "资本成本可用于确定最优资本结构、选择筹资方式、评价投资项目可行性，但它并非决定企业经营策略的关键，经营策略受市场、竞争等多因素影响。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492480", "t": 2, "q": "企业进行长期投资决策时，需要考虑的因素有？", "a": ["投资项目的现金流量", "投资项目的风险水平", "企业的资本成本", "投资项目的使用年限", "", ""], "r": "ABCD", "e": "长期投资决策需综合考量多方面因素。现金流量反映项目资金收支情况，是决策基础；风险水平影响收益稳定性；资本成本是投资的成本参考；使用年限关系着项目的收益周期。ABCD四个选项均是长期投资决策要考虑的因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492481", "t": 2, "q": "本量利分析的前提条件是（　）", "a": ["相关范围及线性假设", "成本性态分析假设", "产销平衡和品种结构不变假设", "变动成本法假设", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492482", "t": 2, "q": "在实务中，贯彻成本控制的例外管理原则时，确定\"例外\"的标志有（　）。", "a": ["特殊性", "重要性", "可控性", "变动性", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492483", "t": 2, "q": "下列人员中，不可以兼任监事的有（　）", "a": ["董事", "经理", "职工代表", "股东代表", "", ""], "r": "AB", "e": "董事、高级管理人员（经理属于高级管理人员）不能兼任监事，以保证监事会监督的独立性和有效性。职工代表和股东代表可以担任监事。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492484", "t": 2, "q": "在单纯固定资产投资项目中，不可能发生的现金流量有（　）。", "a": ["流动资金投资", "经营成本", "回收流动资金", "资本化利息", "", ""], "r": "AC", "e": "单纯固定资产投资项目只涉及固定资产投资，不涉及流动资金投资。流动资金投资和回收流动资金都与流动资金相关，在单纯固定资产投资项目中不会发生。经营成本是运营期会有的现金流出，资本化利息可能在项目建设期存在。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492485", "t": 2, "q": "无形资产属于资产，因而具有资产的一般特征。此外，作为无形资产，它还同时具有的特点是（　）", "a": ["属于非货币性长期资产", "不具有实物形态", "创造的经济利益数额较难确定", "在创造经济利益方面存在较大的不确定性", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492486", "t": 2, "q": "企业进行投融资决策时，预算编制需要考虑的因素有？", "a": ["投融资活动对企业现金流量的影响", "资本成本对投资项目可行性的影响", "投资项目的资金需求和预计收益", "融资方式对企业资本结构的影响", "", ""], "r": "ABCD", "e": "企业投融资决策的预算编制要综合考量多方面。投融资会改变现金流量，A需考虑；资本成本影响投资项目是否可行，B要考虑；投资项目的资金需求和预计收益是核心，C应考虑；融资方式会影响资本结构，D也得考虑。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492487", "t": 2, "q": "在长期投资决策评价指标中，属于正指标的有（　）。", "a": ["投资利润率", "净现值", "静态投资回收期", "获利指数", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492488", "t": 2, "q": "下列各项中属于生产经营相关成本的有（　）", "a": ["增量成本", "沉没成本", "机会成本", "不可避免成本", "", ""], "r": "AC", "e": "生产经营相关成本是与特定决策有关、会随决策改变而改变的成本。增量成本是随业务量变化的成本，机会成本是选择方案时放弃的潜在收益，它们都与决策相关。沉没成本是过去已发生不可改变的，不可避免成本是无论采取什么决策都要发生的，这两者与当前决策无关。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492489", "t": 2, "q": "下列关于预算控制的说法，正确的有？", "a": ["预算控制需要建立有效的考核与奖惩机制", "预算控制应根据实际情况灵活调整控制策略", "通过预算控制可及时发现并纠正预算执行偏差", "预算控制需贯穿预算编制、执行、分析等全过程", "", ""], "r": "ABCD", "e": "预算控制要保证有效，需贯穿预算全流程，能及时发现纠正偏差，根据实际灵活调整策略，同时建立考核奖惩机制激励执行。ABCD 选项均符合预算控制要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492490", "t": 2, "q": "下列关于发放股票股利和股票分割的说法正确的有（　）。", "a": ["都不会对公司股东权益总额产生影响", "都可以达到降低股价的目的", "都会导致股数增加", "都会导致每股面值降低", "", ""], "r": "ABC", "e": "发放股票股利是将未分配利润转为股本，股票分割是将一股拆为多股，二者都不影响股东权益总额，都会使股数增加、股价降低。但发放股票股利每股面值不变，股票分割会使每股面值降低。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492491", "t": 2, "q": "在对固定资产分口分级管理中，一条行之有效的经验是（　）", "a": ["保管定入", "建立保管折", "实行设备定号", "以上选项都不正确", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492492", "t": 2, "q": "下列情况下，适宜采用产品开发战略的有（　）。", "a": ["企业所在产业属于适宜创新的高速发展的高新技术产业", "企业的主业属于正在迅速全球化的产业", "企业所在产业正处于高速增长阶段", "企业存在过剩的生产能力", "", ""], "r": "AC", "e": "产品开发战略适用于有创新能力、产业发展好能支持新产品的情况。A选项高新技术产业适宜创新，利于开发新产品；C选项产业高速增长，有开发新产品的市场空间。B选项产业全球化与产品开发战略关联不大；D选项过剩生产能力一般对应市场渗透等战略，而非产品开发。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492493", "t": 2, "q": "滚动预算的优点有哪些？", "a": ["能及时反映市场变化和企业经营活动变化", "便于企业动态调整经营策略", "保持预算的连续性和完整性", "减少预算编制的工作量", "", ""], "r": "ABC", "e": "滚动预算不断延伸补充预算，能紧跟市场和经营活动变化，利于动态调整策略，还能保持预算连续完整。但它要不断更新预算，会增加编制工作量。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492494", "t": 2, "q": "下列关于净现值（NPV）和内部收益率（IRR）的说法，正确的有？", "a": ["对于独立方案，NPV>0与IRR>基准收益率结论通常一致", "互斥方案决策时，应优先选择IRR高的项目", "两者均考虑了货币时间价值", "NPV是绝对数指标，IRR是相对数指标", "", ""], "r": "ACD", "e": "独立方案中NPV>0时项目可行，此时IRR通常大于基准收益率，A对；互斥方案决策不能仅看IRR，还需考虑规模等因素，B错；净现值和内部收益率都考虑了货币时间价值，C对；净现值是绝对数，内部收益率是相对数，D对。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492495", "t": 2, "q": "编制预算的方法按其业务量基础的数量特征不同，可分为（　）。", "a": ["零基预算", "增量预算", "固定预算", "弹性预算", "", ""], "r": "CD", "e": "按业务量基础数量特征不同，预算编制方法分为固定预算和弹性预算。固定预算以某一固定业务量编制，弹性预算则考虑多种业务量。零基预算和增量预算是按预算编制出发点特征划分。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492496", "t": 2, "q": "如果两种方法营业利润差额不等于零，则完全成本法期末存货吸收的固定性制造费用与期初存货释放的固定性制造费用的数量关系可能是（　）", "a": ["前者大于后者", "两者不相等", "前者等于后者", "两者为零", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492497", "t": 2, "q": "零基预算的特点包括？", "a": ["适用于所有类型的费用预算编制", "有助于调动各部门降低费用的积极性", "不受现有费用项目和开支水平限制", "编制工作量大，成本较高", "", ""], "r": "BCD", "e": "零基预算不考虑以往情况，重新编制预算，所以不受现有费用项目和开支水平限制，能调动各部门降低费用积极性，但编制需重新评估各项费用，工作量大、成本高；不过它并非适用于所有类型费用预算编制。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492498", "t": 2, "q": "企业编制滚动预算时，常见的滚动频率有？", "a": ["每月滚动一次，保持12个月预算期", "每季度滚动一次，保持4个季度预算期", "每半年滚动一次，保持2个半年预算期", "每周滚动一次，保持52周预算期", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492499", "t": 2, "q": "安全边际率=（　）", "a": ["安全边际量÷安全边际额", "安全边际量÷实际销售量", "保本销售额÷实际销售额", "安全边际额÷实际销售额", "", ""], "r": "BD", "e": "安全边际率是安全边际与实际或预计业务量的比率。安全边际可以用安全边际量或安全边际额表示，所以安全边际率=安全边际量÷实际销售量或安全边际额÷实际销售额。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492500", "t": 2, "q": "下列关于内部控制中控制环境要素的说法，正确的有？", "a": ["企业文化会影响员工对内部控制的态度和行为", "治理结构是控制环境的重要组成部分", "内部审计机构设置属于控制活动要素", "人力资源政策涉及员工招聘、培训和考核等", "", ""], "r": "ABD", "e": "企业文化塑造员工价值观，影响其对内控态度和行为，A正确；治理结构为内控提供组织框架，是控制环境重要部分，B正确；内部审计机构设置属于控制环境要素，C错误；人力资源政策包含员工招聘、培训、考核等内容，D正确。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492501", "t": 2, "q": "下列成本项目中,（　）是酌量性固定成本。", "a": ["新产品开发费", "管理人员工资", "房屋租金", "职工培训费", "", ""], "r": "AD", "e": "酌量性固定成本是企业根据经营方针由管理当局决定的固定成本。新产品开发费和职工培训费可由企业管理层根据实际情况酌量确定投入数额。而管理人员工资、房屋租金通常相对固定，较难随意调整。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492502", "t": 2, "q": "计算加权平均资本成本时，权重的确定方法有哪些？", "a": ["市场价值权数", "目标价值权数", "账面价值权数", "历史价值权数", "", ""], "r": "ABC", "e": "计算加权平均资本成本时，常用的权重确定方法有市场价值权数、目标价值权数、账面价值权数。历史价值权数一般不用于确定加权平均资本成本的权重。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492503", "t": 2, "q": "下列各项中，属于使用中的固定资产有（　）", "a": ["正在车间从事生产的机器设备", "购入的尚未安装的固定资产", "由于季节性生产和修理等原因暂时停止使用的固定资产", "存放在车间备用的机器设备", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492504", "t": 2, "q": "零基预算的编制步骤包括哪些？", "a": ["分配资金并编制预算草案", "对各费用项目进行成本-效益分析", "划分不可避免费用项目和可避免费用项目", "提出预算期内各种费用的预算方案", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492505", "t": 2, "q": "成本性态分析最终将全部成本区分为（　）。", "a": ["变动成本", "固定成本", "混合成本", "半变动成本", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492506", "t": 2, "q": "企业现金流量表中的现金包括（　）", "a": ["各种短期、长期债券投资", "库存现金", "随时可用于支付的银行存款", "其他货币资金", "", ""], "r": "BCD", "e": "现金流量表中的现金包括库存现金、可随时用于支付的银行存款和其他货币资金。债券投资不属于现金范畴。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492507", "t": 2, "q": "标准成本控制系统的内容包括（　）。", "a": ["成本差异的分配", "标准成本的制定", "成本预算的编制", "成本差异的计算分析", "", ""], "r": "BD", "e": "标准成本控制系统主要涵盖标准成本制定、成本差异计算分析。成本预算编制不属于标准成本控制系统核心内容，成本差异分配也不是其主要构成部分。所以答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492508", "t": 2, "q": "在企业内部审计中，审计的内容包括？", "a": ["经济效益审计", "财务收支审计", "经济责任审计", "内部控制审计", "", ""], "r": "ABCD", "e": "企业内部审计内容广泛，经济效益审计关注企业经济活动效益；财务收支审计审查财务收支的真实性等；经济责任审计针对特定人员经济责任履行；内部控制审计评估内控有效性。ABCD选项均属于企业内部审计内容。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492509", "t": 2, "q": "制造费用和期间费用都属于综合性费用，它们的共同特点是（　）", "a": ["项目比较少", "内容比较复杂", "大部分开支不与生产量成比例变动", "项目比较多", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492510", "t": 2, "q": "下列属于银行借款的缺点的有（　）", "a": ["筹资速度较快", "财务风险较大", "筹资数额有限", "限制条件较多", "", ""], "r": "BCD", "e": "筹资速度较快是银行借款优点，而财务风险大、筹资数额有限、限制条件多是缺点。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528531945492511", "t": 2, "q": "与现金收购相比，股票收购的特点有（　）", "a": ["收购完成后，目标企业的股东不会失去他们所拥有的所有者权益", "被兼并方不必承担债券的风险", "目标企业会受到兼并后公司的发展前景、利息率和通货膨胀率变动的影响", "对并购方而言，现有的股东权益可能会被淡化", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 财务管理（3）", "n": "基础练习题【含解析】 / 第1章 财务管理（3）", "qs": [{"id": "2034528539239387136", "t": 1, "q": "下列关于内部收益率的表述，错误的是？", "a": ["内部收益率计算考虑了货币时间价值", "内部收益率是项目本身的投资报酬率", "内部收益率不受设定折现率的影响", "内部收益率小于基准收益率时项目可行", "", ""], "r": "D", "e": "内部收益率小于基准收益率时，项目收益低于要求，项目不可行。A、B、C选项表述均正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387137", "t": 1, "q": "在历史资料分析法的具体应用方法中，计算结果最为精确的方法是（　）。", "a": ["回归直线法", "直接分析法", "高低点法", "散布图法", "", ""], "r": "A", "e": "回归直线法运用最小平方法原理，通过数学模型来确定成本与业务量之间的关系，能使计算结果更精确。而直接分析法较主观；高低点法只考虑最高点和最低点，易受极端值影响；散布图法凭直观判断，不够精确。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387138", "t": 1, "q": "在计算普通股资本成本的资本资产定价模型中，β系数的含义是？", "a": ["反映个别股票收益率变动相对于市场平均收益率变动的程度", "反映企业的财务风险程度", "反映企业的经营风险程度", "反映普通股的筹资成本高低", "", ""], "r": "A", "e": "β系数衡量的是个别股票收益率相对市场平均收益率的变动程度。财务风险由债务等因素体现，经营风险和企业经营活动相关，β系数与普通股筹资成本高低无直接关联。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387139", "t": 1, "q": "下列因素单独变动时，不对保利点产生影响的是（　）", "a": ["成本水平", "销售量", "目标利润", "单价", "", ""], "r": "B", "e": "保利点是指在单价和成本水平确定情况下，为确保预先确定的目标利润能够实现而应达到的销售量和销售额。成本水平、目标利润、单价都会影响保利点的计算，而销售量是在计算保利点之后得出的结果或者是实际发生的，不是影响保利点计算的因素。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387140", "t": 1, "q": "下列关于净资产收益率的影响因素，说法错误的是？", "a": ["受企业盈利能力和营运能力共同影响", "与销售净利率呈正相关", "与权益乘数呈负相关", "与总资产周转率呈正相关", "", ""], "r": "C", "e": "净资产收益率=销售净利率×总资产周转率×权益乘数，销售净利率体现盈利能力，总资产周转率体现营运能力，所以A正确；销售净利率、总资产周转率、权益乘数与净资产收益率都呈正相关，B、D正确，C错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387141", "t": 1, "q": "下列可用于衡量投资风险程度的指标是（　）", "a": ["概率", "风险价值系数", "预期收益", "标准离差率", "", ""], "r": "D", "e": "标准离差率反映了资产全部风险的相对大小，可用于衡量投资风险程度。概率是事件发生可能性，不是衡量风险指标；风险价值系数用于计算风险收益；预期收益体现期望获利情况，并非衡量风险指标。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387142", "t": 1, "q": "在计算债券资本成本时，需要考虑的因素不包括？", "a": ["债券购买价格", "债券面值", "债券票面利率", "债券发行价格", "", ""], "r": "A", "e": "债券资本成本计算主要关注与债券发行及利息相关因素。债券面值、票面利率用于确定利息，发行价格影响筹资额。而债券购买价格是投资者购买时的价格，与发行方计算资本成本无关。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387143", "t": 1, "q": "企业出售无形资产，应计入企业的（　）", "a": ["产品销售收入", "投资净收益", "营业外收入", "其他销售收入", "", ""], "r": "C", "e": "无形资产出售不属于企业日常经营活动，产品销售收入和其他销售收入都与日常销售业务相关，投资净收益是投资相关的收益，而营业外收入核算企业发生的与其日常活动无直接关系的各项利得，出售无形资产应计入营业外收入。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387144", "t": 1, "q": "下列关于内部控制活动的说法，错误的是？", "a": ["不相容职务分离控制属于内部控制活动", "内部控制活动与风险评估无关", "授权审批控制是内部控制活动的重要内容", "会计系统控制是内部控制活动的组成部分", "", ""], "r": "B", "e": "内部控制活动与风险评估密切相关，风险评估为内部控制活动提供依据，内部控制活动是应对风险的具体措施。而不相容职务分离控制、授权审批控制、会计系统控制都属于内部控制活动。所以说法错误的是B。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387145", "t": 1, "q": "企业流动比率为2.5，若赊购原材料一批，将会导致？", "a": ["流动比率上升", "营运资金增加", "流动比率不变", "流动比率下降", "", ""], "r": "D", "e": "流动比率=流动资产/流动负债，赊购原材料使流动资产和流动负债等额增加。原流动比率2.5＞1，分子分母等额增加会使比值下降。营运资金=流动资产 - 流动负债，等额增加不影响营运资金。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387146", "t": 1, "q": "下列表述不正确的是（　）。", "a": ["净现值大于0，该投资方案可行。", "净现值是未来报酬的总现值与初始投资额现值之差。", "净现值等于0，说明此时的贴现率为内部收益率。", "净现值大于0，净现值率小于1。", "", ""], "r": "D", "e": "净现值大于 0 时，净现值率大于 1，D 选项表述错误。A、B、C 选项关于净现值的表述均正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387147", "t": 1, "q": "滚动预算的优点不包括？", "a": ["能使各级管理人员始终保持对未来一定时期的生产经营活动作周详的考虑和全盘规划", "有利于充分发挥预算的指导和控制作用", "便于考核预算执行结果", "保持预算的完整性和连续性", "", ""], "r": "C", "e": "滚动预算不断更新预算期，预算期不固定难以按固定期间考核执行结果，C不是其优点。而A、B、D都是滚动预算可使管理者持续规划，发挥预算作用，保持预算连贯完整的优点体现。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387148", "t": 1, "q": "在计算速动比率时，要从流动资产中扣除存货部分，再除以流动负债。这样做的原因在于流动资产中（　）", "a": ["存货未来销路不定", "存货的质量不稳定", "存货的变现能力最差", "存货的价值较大", "", ""], "r": "C", "e": "速动比率衡量的是企业流动资产中可以迅速变现用于偿还流动负债的能力，存货在流动资产里变现相对困难，变现能力最差，所以计算速动比率时要扣除。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387149", "t": 1, "q": "在计算优先股资本成本时，不需要考虑的因素是？", "a": ["优先股发行价格", "优先股股息率", "优先股筹资费用率", "企业所得税税率", "", ""], "r": "D", "e": "优先股股息在税后支付，不具有抵税作用，所以计算优先股资本成本时不用考虑企业所得税税率。而优先股发行价格、股息率、筹资费用率都与优先股资本成本计算有关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387150", "t": 1, "q": "零基预算的优点不包括？", "a": ["编制工作量小", "有助于企业未来发展", "不受现有费用项目限制", "能够调动各部门降低费用的积极性", "", ""], "r": "A", "e": "零基预算需对所有项目重新进行成本效益分析，编制工作量大，A选项不是其优点。而它不受现有费用项目限制、能调动各部门降费积极性且有助于企业未来发展。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387151", "t": 1, "q": "滚动预算的预算期始终保持为？", "a": ["一年", "半年", "两年", "三个月", "", ""], "r": "A", "e": "滚动预算是使预算期始终保持一个固定期间，通常这个固定期间是一年。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387152", "t": 1, "q": "下列关于企业财务风险的说法，正确的是？", "a": ["财务风险与企业的盈利能力无关", "贯穿于企业的整个生命周期中，包括但不限于经营活动产生的不确定性导致的", "财务风险只存在于负债经营的企业中", "企业固定性融资成本越高，财务风险越大", "", ""], "r": "D", "e": "A选项，财务风险与盈利能力有关，盈利能力弱会加大财务风险；C选项，无负债经营企业也可能有财务风险，如资金周转问题；B选项，财务风险是因筹资引起，并非经营活动不确定性导致。D选项，固定性融资成本越高，偿债压力越大，财务风险越大。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387153", "t": 1, "q": "下列关于审计监督对企业风险控制作用的表述，错误的是？", "a": ["促进企业提高经济效益", "确保企业所有决策正确", "揭露财务收支中的舞弊行为", "发现企业内部控制制度的缺陷", "", ""], "r": "B", "e": "审计监督能促进效益提升、揭露舞弊、发现内控缺陷，但无法确保企业所有决策正确，决策受多种复杂因素影响。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387154", "t": 1, "q": "存货资金定额通常归口给企业各有关职能部门负责管理，其中在产品和自制半成品资金的归口部门是（　）", "a": ["生产部门", "销售部门", "设备动力部门", "供应部门", "", ""], "r": "A", "e": "在产品和自制半成品处于生产环节，生产部门对其生产过程负责，所以在产品和自制半成品资金归口给生产部门管理。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387155", "t": 1, "q": "编制弹性成本预算的关键在于（　）。", "a": ["确定材料标准耗用量", "选择业务量计量单位", "将所有成本划分为固定成本与变动成本两大类", "分解制造费用", "", ""], "r": "C", "e": "弹性成本预算需根据业务量变动调整，关键是把成本分为固定和变动成本，这样才能依据业务量变化预测成本。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387156", "t": 1, "q": "某企业预计全年需要现金8000元，现金与有价证券的转换成本为每次50元，有价证券的年利率为5%，则该企业最佳现金持有量为？", "a": ["800元", "1600元", "4000元", "2000元", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387157", "t": 1, "q": "某车间的管理人员工资，对于该车间来说属于（　）", "a": ["可控费用", "不可控费用", "直接费用", "变动费用", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387158", "t": 1, "q": "下列关于资本资产定价模型（CAPM）的说法，正确的是？", "a": ["无风险收益率通常选用短期国债利率，不考虑通货膨胀因素", "β系数越大，说明该资产的系统风险越小", "市场风险溢价是市场组合收益率与无风险收益率的差额", "该模型用于计算企业的加权平均资本成本", "", ""], "r": "C", "e": "无风险收益率考虑通货膨胀，A错误；β系数越大，系统风险越大，B错误；资本资产定价模型算的是股权资本成本，非加权平均资本成本，D错误；市场风险溢价就是市场组合收益率与无风险收益率的差额，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387159", "t": 1, "q": "用变动成本法计算产品成本时，对固定性制造费用的处理是（　）", "a": ["在每单位产品间分摊", "将其作为期间费用，部分列入利润表", "不将其作为费用", "将其作为期间费用，全额列入利润表", "", ""], "r": "D", "e": "变动成本法下，固定性制造费用不随产量变动，视为期间费用，且全额列入利润表。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387160", "t": 1, "q": "下列预算编制方法中，不受以往预算安排情况影响的是？", "a": ["弹性预算", "增量预算", "固定预算", "零基预算", "", ""], "r": "D", "e": "零基预算不考虑以往预算安排情况，一切以零为出发点编制预算。而弹性预算是按一系列业务量水平编制，增量预算是在基期预算基础上调整，固定预算按固定业务量编制，都受以往预算安排影响。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387161", "t": 1, "q": "把企业实现的净利润同投入的权益资本进行对比，能够确切地说明企业盈利水平的指标是（　）", "a": ["经济效益最大化", "利润最大化", "权益资本利润率最大化", "股东财富最大化", "", ""], "r": "C", "e": "权益资本利润率是净利润与权益资本的对比，能体现企业盈利水平。A选项经济效益最大化是综合概念；B选项利润最大化未考虑投入资本；D选项股东财富最大化关注股东价值。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387162", "t": 1, "q": "滚动预算按时间单位滚动，编制工作量最大但最精确的方式是？", "a": ["混合滚动", "逐年滚动", "逐季滚动", "逐月滚动", "", ""], "r": "D", "e": "逐月滚动是每月调整编制预算，时间单位最小，所以编制工作量最大，但能更及时准确反映情况，也就最精确。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387163", "t": 1, "q": "在短期经营决策中，企业不接受特殊价格追加订货的原因是买方出价低于（　）", "a": ["单位固定成本", "单位变动生产成本", "正常价格", "单位产品成本", "", ""], "r": "B", "e": "企业接受追加订货的底线是能弥补变动成本，若买方出价低于单位变动生产成本，接受订货会使企业亏损，所以不接受。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387164", "t": 1, "q": "在市场机制的作用下，企业通过产权交易获得其他企业产权并企图获得其控制权的行为是（　）", "a": ["联营", "购并", "收买", "合并", "", ""], "r": "B", "e": "购并指企业通过产权交易获得其他企业产权并企图获得其控制权。联营强调联合经营，收买侧重购买但不一定获控制权，合并是两个或以上企业合为一体。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387165", "t": 1, "q": "企业出资方式上，能以劳务进行出资的是（　）", "a": ["有限责任公司", "股份有限公司", "合伙企业", "个人独资企业", "", ""], "r": "C", "e": "有限责任公司、股份有限公司和个人独资企业都不能以劳务出资，而合伙企业中普通合伙人可以用劳务出资。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387166", "t": 1, "q": "某投资项目原始投资额现值为100万元，未来现金净流量现值为120万元，该项目的净现值（NPV）是？", "a": ["0万元", "20万元", "120万元", "-20万元", "", ""], "r": "B", "e": "净现值（NPV）=未来现金净流量现值 - 原始投资额现值，本题中未来现金净流量现值为120万元，原始投资额现值为100万元，所以NPV = 120 - 100 = 20万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387167", "t": 1, "q": " 下列属于企业长期偿债能力分析指标的是？", "a": ["营运资金", "产权比率", "现金比率", "营业周期", "", ""], "r": "B", "e": "营运资金反映短期偿债能力；现金比率衡量短期偿债能力；营业周期体现营运能力；产权比率是负债总额与所有者权益总额的比率，用于分析长期偿债能力。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387168", "t": 1, "q": "企业（　）负责组织和推动全厂固定资产的管理工作，对固定资产的安全保管和有效利用进行全面监督，对固定资产管理负总的责任。", "a": ["生产车间", "财务部门", "资产管理部门", "库房", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387169", "t": 1, "q": "下列关于财务分析中存货周转率指标的说法，正确的是？", "a": ["存货周转率=营业成本÷平均存货余额", "存货周转率只能按月计算", "存货周转率与企业盈利能力无关", "存货周转率越高，表明存货管理水平越差", "", ""], "r": "A", "e": "存货周转率公式是营业成本÷平均存货余额；它可按年、季、月等多种周期计算；存货周转率反映存货管理效率，与盈利能力相关；存货周转率越高，表明存货管理水平越好。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387170", "t": 1, "q": "下列哪项因素的变化，只影响成本变动额而不影响变动率？", "a": ["产品品种结构变动", "单位成本变动", "产品产量变动", "产品性能变动", "", ""], "r": "C", "e": "产品产量变动会使成本变动额改变，但不影响成本变动率，因为变动率计算时分子分母同比例受产量影响。而产品品种结构、单位成本变动会影响变动率，产品性能变动通常与成本变动额和变动率无直接关联。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387171", "t": 1, "q": "某企业向租赁公司租赁一套设备，设备价值100万元，租期10年，预计设备残值2万元，若贷款年利率（复利）为10%,手续费为设备价值的1%，租金于每年底支付。该企业每年底应支付的资金为（　）", "a": ["25.8万元", "30.8万元", "35.8万元", "26.8万元", "", ""], "r": "A", "e": "先算出租金总额，设备价值100万，手续费100×1% = 1万，贷款本利和100×(1 + 10%)^10 ，再减去残值2万。然后用年金现值公式计算每年支付金额。经计算每年支付约25.8万。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528539239387172", "t": 1, "q": "一般说来，流动比率越高说明（　）", "a": ["资产流动性越弱，短期偿债能力越弱", "资产流动性越强，短期偿债能力越弱", "资产流动性越强，短期偿债能力越强", "资产流动性越弱，短期偿债能力越强", "", ""], "r": "C", "e": "流动比率是衡量短期偿债能力的指标，流动比率越高，意味着流动资产相对流动负债更多，资产变现能力即流动性越强，短期偿债能力也越强。答案选C。 ", "ap": [false, false, false, false, false,
