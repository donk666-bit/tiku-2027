独立性原则要求审计项目组成员、会计师事务所、网络及网络事务所都要与审计客户保持独立。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215892", "t": 2, "q": "如果要注册成为一名注册会计师，在遇到下列情形时将不予注册（　）", "a": ["受到刑事处罚", "在经济管理工作或在财务、会计、审计和企业管理工作中受到通报批评或警告", "自行停止执业满1年", "失去了完全民事行为能力", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215893", "t": 2, "q": "下列应当进行职务分离的是（　）。", "a": ["经济业务的授权批准与执行", "记录明细账与日记账", "经济业务的执行与记录", "财产物资的保管与记录职务", "", ""], "r": "ACD", "e": "职务分离是为防止错误和舞弊，将不相容职务分开。授权批准与执行、执行与记录、保管与记录都应分离，而记录明细账与日记账通常由同一人负责，不属于应分离职务。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215894", "t": 2, "q": "按审计主体分类，可分为（　）。", "a": ["政府审计", "内部审计", "注册会计师审计", "民间审计", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215895", "t": 2, "q": "4．会计责任是指被审计单位对其提供注册会计师所需要的会计资料和其他有关资料的（　）负责。", "a": ["完整性", "合法性", "真实性", "及时性", "", ""], "r": "ABC", "e": "会计责任要求被审计单位对提供资料的真实性、完整性、合法性负责，及时性并非会计责任核心内容。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215896", "t": 2, "q": "控制活动是指有助于确保管理层的指令得以执行的政策和程序，包括（　）", "a": ["授权与业绩评价", "信息处理", "实物控制", "职责分离", "", ""], "r": "ABCD", "e": "控制活动是确保管理层指令执行的政策和程序，涵盖授权、业绩评价、信息处理、实物控制、职责分离等方面。ABCD选项均属于控制活动范畴。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215897", "t": 2, "q": "审计程序一般包括（　），每个阶段又包括若干具体工作内容。", "a": ["计划阶段", "报告阶段", "终结阶段", "准备阶段", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215898", "t": 2, "q": "在对库存现金进行盘点时，参与盘点的人员必须包括（　）。", "a": ["被审计单位会计主管人员", "被审计单位出纳员", "注册会计师", "被审计单位内部审计人员", "", ""], "r": "BC", "e": "库存现金盘点时，被审计单位出纳员负责现金的保管和收付，必须参与盘点；注册会计师对盘点进行监督，也需参与。而会计主管人员和内部审计人员并非必须参与。所以答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215899", "t": 2, "q": "在存货监盘过程中，检查程序的目的包括（　）。", "a": ["证实被审计单位存货实物总额", "证实被审计单位存货的所有权", "评价被审计单位的盘点计划是否合理", "判断被审计单位的盘点计划是否得到适当地执行", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215900", "t": 2, "q": "关于审计准则，下列说法正确的有（　）。", "a": ["审计准则是有关部门执法、判断注册会计师审计责任的依据", "审计准则是规范注册会计师执行审计业务的权威性标准", "审计准则是审计理论研究、教学教材建设的重要推动力量", "审计准则是衡量注册会计师执业质量的依据", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215901", "t": 2, "q": "下列情形中，属于产生自我评价威胁的有（　）", "a": ["审计项目组成员与客户的董事存在直系亲属关系", "审计项目组成员现在是或最近曾是客户的董事或高级管理人员", "审计客户的董事最近曾是会计师事务所的合伙人", "审计项目组负责人最近曾受雇于客户", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215902", "t": 2, "q": "审计抽样按内容划分可分为（　）。", "a": ["变量抽样", "统计抽样", "非统计抽样", "属性抽样", "", ""], "r": "AD", "e": "审计抽样按内容分为属性抽样和变量抽样。属性抽样是对内部控制的有效性进行测试；变量抽样是对金额进行测试。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215903", "t": 2, "q": "下列关于不相容职务的说法中，正确的有（　）。", "a": ["执行某些经济业务和审核这些经济业务的职务要分离", "保存某些财产物资和对其进行记载的职务要分别", "受权进行某项经济业务和执行该项业务的职务要分离", "保管某些财产物资和使用这些财产物资的职务要分离", "", ""], "r": "ABCD", "e": "不相容职务分离是为防错弊，要求相关职务不能由一人担任。ABCD四个选项所涉及的职务组合，若由一人担任都易出现舞弊等问题，所以均需分离。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215904", "t": 2, "q": "注册会计师正在执行某上市公司2008年度财务报表审计业务，下列情形中遵循了保密原则的有（　）", "a": ["在未得到该公司同意的情况下将该公司利润分配政策提供给该公司所在行业联营单位", "在未得到该公司授权情况下向法庭提供作为共同被告而证实自己遵循审计准则的审计工作底稿", "在未得到该公司授权情况下向后任注册会计师提供2008年审计工作底稿", "在未得到该公司授权情况下向中国证券会报告其发现的该公司隐瞒巨额收入的偷税行为", "", ""], "r": "BD", "e": "保密原则要求注册会计师不得未经客户授权披露客户信息，但在特定法律要求等情形下除外。A选项未经同意提供信息违反保密原则；B向法庭提供底稿是法律要求，不违反；C未经授权向后任提供底稿违反；D向证监会报告违法行为是应尽义务，不违反。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215905", "t": 2, "q": "存货监盘的决策要考虑以下因素（　）。", "a": ["监盘的人员", "监盘项目的选取", "监盘的时间", "监盘的数量", "", ""], "r": "ABCD", "e": "存货监盘决策需考虑人员安排、项目选取、时间确定等多方面。ABCD选项均是影响存货监盘决策的重要因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215906", "t": 2, "q": "11．应付账款审计的具体目标包括（　）。", "a": ["确定应付账款会计记录的合规性", "确定应付账款的发生和偿还记录是否完整", "确定应付账款在会计报表上的披露是否恰当", "确定应付账款期末余额是否正确", "", ""], "r": "ABCD", "e": "应付账款审计目标涵盖记录完整性、报表披露恰当性、期末余额正确性以及会计记录合规性等方面。ABCD选项均符合应付账款审计具体目标要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215907", "t": 2, "q": "注册会计师在采用选取特定项目进行测试的方法时，考虑选取的项目可能包括（　）。", "a": ["大额或关键项目", "被用于测试控制活动的项目", "交易频繁但金额较小的项目", "超过某一金额的全部项目", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215908", "t": 2, "q": "在注册会计师的鉴证业务中，下列属于“预期使用者”的有（　）", "a": ["股东及潜在投资者", "债权人", "证券交易机构", "管理层", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215909", "t": 2, "q": "对于审计中发现的核算误差在确定建议调整和不建议调整时,应当考虑的因素是（　）。", "a": ["核算误差的金额", "核算误差产生的原因", "核算误差的数量", "核算误差的性质", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215910", "t": 2, "q": "注册会计师正在执行某上市公司2008年度财务报表审计业务，下列情形中遵循了保密原则的有（　）", "a": ["在未得到该公司同意的情况下将该公司利润分配政策提供给该公司所在行业联营单位", "在未得到该公司授权情况下向后任注册会计师提供2008年审计工作底稿", "在未得到该公司授权情况下向中国证券会报告其发现的该公司隐瞒巨额收入的偷税行为", "在未得到该公司授权情况下向法庭提供作为共同被告而证实自己遵循审计准则的审计工作底稿", "", ""], "r": "CD", "e": "保密原则要求注册会计师不得未经客户授权披露客户信息，但在法律法规允许或要求披露时除外。C项向证监会报告偷税行为是符合法律法规要求的；D项向法庭提供底稿是法律程序需要。A项未经同意给联营单位，B项未经授权给后任注册会计师，均违反保密原则。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215911", "t": 2, "q": "下列各项可以作为书面证据的有（　）。", "a": ["会计报表", "经济合同", "联营协议", "会计账簿", "", ""], "r": "ABCD", "e": "书面证据是以书面形式存在的审计证据。会计报表、经济合同、联营协议、会计账簿都以书面形式呈现，能为审计等提供相关证明信息。所以ABCD都可作为书面证据。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215912", "t": 2, "q": "下列项目中，属于货币资金内部控制测试程序的有（　）。", "a": ["函证银行存款", "抽查付款凭证", "抽查收款凭证", "监盘库存现金", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215913", "t": 2, "q": "会计师事务所应当制定下列政策和程序（　）以防范同一高级人员由于长期执行某一客户的鉴证业务可能对独立性造成威胁", "a": ["规定高级管理人员提供鉴证业务的服务年限", "考虑鉴证业务的性质，包括涉及公众利益的范围", "对所有的上市公司财务报表审计，按照法律法规的规定定期轮换项目负责人", "建立适当的标准，以便确定是否需要采取防范措施，将由于关系密切造成的威胁降低到可接受水平", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215914", "t": 2, "q": "审计人员在提出（　）审计意见时，应在说明部分充分叙述对会计报表所持意见的理由。", "a": ["保留意见", "无保留意见", "否定意见", "无法表示意见", "", ""], "r": "ACD", "e": "需在说明部分充分叙述对会计报表所持意见理由的，通常是与标准无保留意见不同，有特定情况或不确定因素的审计意见。保留意见、否定意见、无法表示意见都属于这类。而无保留意见表明报表公允反映，无需特别说明理由。保留意见是部分事项影响但不具广泛性，需说明影响理由；否定意见是报表整体不公允，要阐述不公允的理由；无法表示意见是审计范围受限无法获取充分证据，也得说明受限原因。所以答案是 ACD。 答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215915", "t": 2, "q": "注册会计师在执行年度财务报表审计业务时，如果遇到下列情形仍然与客户发生了关联，则属于违背了诚信的基本原则（　）", "a": ["注册会计师发现客户提供的存货永续盘存表有明显的虚假", "注册会计师发现客户有一起正在诉讼的法律纠纷而且很可能导致重大违约赔款而未作任何披露", "注册会计师发现总经理对同一问题的陈述完全相反", "注册会计师发现客户提供的应收账款明细账遗漏了许多重要的往来单位", "", ""], "r": "ABCD", "e": "诚信原则要求注册会计师不得与有问题的信息发生关联，ABCD 选项均表明客户提供的信息存在虚假、隐瞒、矛盾或遗漏等问题，注册会计师若继续关联就违背诚信。答案：ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215916", "t": 2, "q": "内部控制按工作范围分为（　）。", "a": ["内部会计控制", "内部分析控制", "内部核对控制", "内部管理控制", "", ""], "r": "AD", "e": "内部控制按工作范围分为内部会计控制和内部管理控制。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215917", "t": 2, "q": "审计的基本职能有（　）。", "a": ["经济监督", "经济建议", "经济鉴证", "经济评价", "", ""], "r": "ACD", "e": "审计基本职能是经济监督、经济鉴证和经济评价。经济建议并非基本职能。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215918", "t": 2, "q": "核对法包括（　）。", "a": ["账证核对", "证证核对", "账表核对", "账账核对", "", ""], "r": "ABCD", "e": "核对法是指对会计记录之间的相关数据进行核对，包括账证、证证、账表、账账核对。ABCD四个选项都符合核对法范畴。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215919", "t": 2, "q": "库存现金的审查包括（　）。", "a": ["审阅银行存款收付款凭证", "审阅现金收付款凭证", "审阅库存现金日记账", "盘点库存现金", "", ""], "r": "BCD", "e": "审查库存现金，要查看相关凭证了解现金收支情况，审阅日记账掌握现金记录，盘点库存现金确定实际金额是否相符。银行存款收付款凭证与库存现金审查无关。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215920", "t": 2, "q": "独立性原则要求下列（　）与审计客户保持独立", "a": ["网络事务所", "网络", "会计师事务所", "审计项目组成员", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215921", "t": 2, "q": "注册会计师《职业道德准则》中的一般原则是（　）的总称，是注册会计师执业时最基本的要求。", "a": ["客观原则", "公正原则", "独立原则", "可靠原则", "", ""], "r": "ABC", "e": "注册会计师《职业道德准则》一般原则包括独立、客观、公正原则。可靠原则不属于。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215922", "t": 2, "q": "审计业务约定书的内容有（　）", "a": ["审计事项", "审计目的", "审计范围", "审计计划", "", ""], "r": "ABC", "e": "审计业务约定书是会计师事务所与被审计单位签订的，用以记录和确认审计业务的委托与受托关系、审计目标和范围、双方的责任以及报告的格式等事项的书面协议。审计事项、目的、范围都会在约定书中明确。而审计计划是注册会计师为了完成审计业务，达到预期的审计目标，在具体执行审计程序之前编制的工作计划，不在审计业务约定书内容里。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215923", "t": 2, "q": "注册会计师应当综合考虑以下主要因素，并结合其审计经验，对重要性水平作出初步判断（　）。", "a": ["会计报表各项目的性质及其相互关系", "会计报表各项目的金额及其波动幅度", "内部控制与审计风险的评估结果", "被审计单位的经营规模及业务性质", "", ""], "r": "ABCD", "e": "确定重要性水平需综合多方面因素，ABCD选项分别从报表项目特性、金额情况、内控与风险、被审计单位自身特点等方面影响重要性判断。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215924", "t": 2, "q": "民间审计人员职业道德具体包括（　）", "a": ["独立原则", "客观原则", "公正原则", "保密原则", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215925", "t": 2, "q": "西方各国国家审计机关，按其隶属关系不同，主要类型有（　）", "a": ["司法型", "行政型", "立法型", "独立型", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215926", "t": 2, "q": "下列情形中属于产生过度推介威胁的是（　）", "a": ["会计师事务所推介审计客户的股份", "审计项目负责人与鉴证客户存在重要的密切关系", "会计师事务所过分依赖向某一客户收费", "注册会计师在被审计单位与第三方发生诉讼或纠纷时担任客户的辩护人", "", ""], "r": "AD", "e": "过度推介威胁是指注册会计师过度推介客户或雇佣单位的某种立场或意见，使其客观性受到损害。A选项会计师事务所推介审计客户股份、D选项注册会计师在诉讼纠纷中担任客户辩护人，都属于过度推介客户立场。B选项是密切关系威胁，C选项是自身利益威胁。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215927", "t": 2, "q": "江海公司某项应用控制由计算机自动执行，且在2009年度未发生变化。注册会计师测试该项控制在2009年度运行有效性时，正确的做法是（　）", "a": ["同时考虑信息技术控制运行有效性", "利用该项控制得以执行的审计证据和信息技术一般控制运行有效性的审计证据，作为支持该项控制在2009年度运行有效性的重要审计证据", "确定的测试范围与该项控制由手工执行时的测试范围相同", "一旦确定正在执行该项控制，则无须扩大测试的范围", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215928", "t": 2, "q": "固定资产的审计目标一般包括（　）。", "a": ["确定固定资产的期末余额是否正确", "确定固定资产是否存在且归被审计单位所有", "确定固定资产的计价和折旧政策是否恰当", "确定固定资产及其累计折旧增减变动的记录是否完整", "", ""], "r": "ABCD", "e": "固定资产审计目标涵盖其存在、所有权、计价折旧政策、增减记录完整性及期末余额准确性等方面。ABCD选项分别对应这些要点。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215929", "t": 2, "q": "如果要注册成为一名注册会计师，在遇到下列情形时将不予注册（　）", "a": ["自行停止执业满2年", "受到刑事处罚", "失去了完全民事行为能力", "在经济管理工作或在财务、会计、审计和企业管理工作中受到通报批评或警告", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528688699215930", "t": 2, "q": "下列情形中，属于产生自我评价威胁的有（　）", "a": ["审计项目组成员现在是或最近曾是客户的董事或高级管理人员", "审计项目组负责人最近曾受雇于客户", "审计客户的董事最近曾是会计师事务所的合伙人", "审计项目组成员与客户的董事存在直系亲属关系", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180480", "t": 3, "q": "有效的内部控制离不开健全的内部控制制度。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "健全的内部控制制度是有效实施内部控制的基础和保障，只有制度健全才能确保内部控制各项工作有章可循、有序开展，所以有效的内部控制离不开健全的内部控制制度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180481", "t": 3, "q": "通过向往来银行的函证，审计人员不仅可以了解企业银行存款的存在，同时还可了解企业欠银行的债务。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "向银行函证能获取银行存款存在的证据，也能得知企业在银行的借款等债务情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180482", "t": 3, "q": "执行符合性测试程序的目的是为了确定被审计单位内部控制政策和程序设计的适当性及其运行的有效性，以确定实质性测试的性质、范围和时间。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "符合性测试就是评估内部控制设计适当性与运行有效性，进而为确定实质性测试的性质、范围和时间提供依据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180483", "t": 3, "q": "账户层次的重要性水平就是实质性测试的可容忍误差。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180484", "t": 3, "q": "良好的内部控制可完全杜绝串通舞弊。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串通舞弊具有隐蔽性，即使内部控制良好也不能完全杜绝。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180485", "t": 3, "q": "银行对账单属于外部证据。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "银行对账单是银行出具的，来自企业外部，能证明企业银行存款等情况，属于外部证据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180486", "t": 3, "q": "存货监盘观察程序和检查程序的结合运用。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "存货监盘时，注册会计师通常会将观察程序（如观察被审计单位人员的盘点活动）和检查程序（如检查存货实物等）结合运用，以获取充分、适当的审计证据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180487", "t": 3, "q": "审计人员应当选择各会计报表中最高的重要性水平作为会计报表层次的重要性水平。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "应选择各会计报表中最低的重要性水平作为会计报表层次的重要性水平，而非最高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180488", "t": 3, "q": "在我国，注册会计师只有加入会计师事务所，才能承办业务。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据我国相关规定，注册会计师必须加入会计师事务所才能以事务所名义承办业务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180489", "t": 3, "q": "1．非统计抽样的依据是审计人员的主观判断。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "非统计抽样是审计人员凭借经验和主观判断来确定样本规模、选取样本和评价样本结果，所以依据是审计人员主观判断。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180490", "t": 3, "q": "注册会计师在执业过程中，不论被审计单位规模大小，都应当对相关的内部控制进行充分的了解。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "了解内部控制是风险评估程序的重要内容，无论被审计单位规模大小，注册会计师都需为识别和评估重大错报风险，对相关内部控制进行充分了解。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180491", "t": 3, "q": "19．民间审计组织不得以降低收费的方式招揽业务。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "降低收费招揽业务可能会导致审计质量下降，违背审计独立性和职业道德要求，民间审计组织应避免此行为。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180492", "t": 3, "q": "在销售的截止测试中，审计人员可以考虑采用以账簿记录为起点的审计线路，以防止少计收入。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180493", "t": 3, "q": "资本公积审计主要是审查其形成和使用的合法性。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资本公积的审计重点就是审查其形成来源是否合法合规，使用是否符合规定。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180494", "t": 3, "q": "企业资产负债表上银行存款数字应当包括当年最后一天收到的所有存放于银行的款项，而不得包括其后收到的款项。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "资产负债表反映特定日期财务状况，银行存款数字应按资产负债表日即当年最后一天实际存放银行款项列示，其后收到款项不在此列。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180495", "t": 3, "q": "盘存法适用于对被审计单位的存货进行审查。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "盘存法就是通过对有关财产物资的实地盘点，来确定其数量、品种、规格及其金额等实际状况，进而证实有关实物账户的余额是否真实、正确，常用于存货审查。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180496", "t": 3, "q": "审计报告的签署日期应为完稿日期或会计报表截止日。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计报告签署日期应是注册会计师完成审计工作的日期，并非完稿日期或会计报表截止日。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180497", "t": 3, "q": "审计是在出现了财产所有者和财产经营者相分离，并在他们之间形成受托经济责任关系之后产生的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计的产生源于财产所有者和经营者分离，所有者为监督经营者履职情况，需要独立第三方进行审查，即形成受托经济责任关系后审计应运而生。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180498", "t": 3, "q": "3．变量抽样用于内部控制的符合性测试。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "变量抽样是用于实质性程序，属性抽样用于内部控制的符合性测试。", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180499", "t": 3, "q": "在一项审计计划中，注册会计师认为固有风险为60%，控制风险为50%，审计风险是15%，则算出的检查风险是4.5%。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180500", "t": 3, "q": "在审计过程中，收集到的审计证据越多越好。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计证据并非越多越好，过多收集证据会增加审计成本、降低效率。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180501", "t": 3, "q": "将控制风险评价为最高水平，意味着内部控制制度不能及时防止或者发现和更正某项认定中的重要错误的可能性很大。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "控制风险评价为最高水平，表明内部控制有效性低，不能及时防止、发现和更正认定中重要错误的可能性大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180502", "t": 3, "q": "审计人员亲自取得的证据比他人提供的证据证明力强。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计人员亲自取得的证据受人为因素干扰小，更具客观性，所以证明力通常比他人提供的证据强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180503", "t": 3, "q": "审计人员实施存货监盘程序的目的是为了确定被审计单位对存货的盘点程序和方法是否符合盘点计划和指令的要求。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180504", "t": 3, "q": "审计是一种直接的经济监督活动。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计是由专职机构和人员，对被审计单位的财政、财务收支及其他经济活动的真实性、合法性和效益性进行审查和评价的独立性经济监督活动，是间接的经济监督活动，并非直接。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180505", "t": 3, "q": "在实际审计工作中，往往把审阅法与核对法结合起来加以运用。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审阅法是对凭证、账簿等资料仔细审查阅读，核对法是对相关资料数据进行对照核实，二者结合能更有效地发现问题、保证审计质量，在实际审计工作中常结合运用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180506", "t": 3, "q": "在经济监督体系中，审计是高层次的经济监督。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计具有独立性、权威性等特点，可对财政、财务收支及其他经济活动进行全面、综合的监督，能从宏观层面审查和评价经济活动的合法性、效益性等，所以在经济监督体系中是高层次的经济监督。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180507", "t": 3, "q": "审计的对象是指被审计单位的财务收支及其有关的经营管理活动，以及作为提供这些活动信息载体的会计资料和其他有关资料。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计对象包含被审计单位财务收支及相关经营管理活动，以及承载这些活动信息的会计资料等。该表述准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180508", "t": 3, "q": "对于未复函的肯定式函证，应采用追查程序，一般应寄送第二次乃至第三次询证函，如果仍得不到答复的，应考虑采用其他必要的替代审计程序。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于未复函的肯定式函证，确实需采用追查程序，多次寄送询证函，若仍无答复就应考虑替代审计程序。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180509", "t": 3, "q": "审查应收账款时，注册会计师往往优先考虑函证而非检查与销售有关的合同、凭证，主要是为了降低审计成本、提高审计效率。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "优先考虑函证是为获取更直接、更可靠的外部证据来证实应收账款的存在和准确性，而非单纯为降低成本、提高效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180510", "t": 3, "q": "审查内部控制的目的是为下一步工作创造条件。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审查内部控制能了解被审计单位内部控制设计和运行情况，发现问题，为后续确定审计重点、范围和方法等工作创造条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528689756180511", "t": 3, "q": "无论内部控制设计多么合理、运行多么有效，注册会计师都应对会计报表的重要账户和交易实施实质性程序。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "由于内部控制存在固有局限性，不能完全防止或发现并纠正错报，所以即便内控设计合理且运行有效，注册会计师也需对重要账户和交易实施实质性程序。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 审计学（4）", "n": "基础练习题【含解析】 / 第3章 审计学（4）", "qs": [{"id": "2034528695825338368", "t": 1, "q": "当可接受的检查风险降低时，注册会计师可能采取的措施是（　）", "a": ["降低评估的重大错报风险", "消除固有风险", "将实施实质性程序的时间从期中移至期末", "缩小实质性审计程序的范围", "", ""], "r": "C", "e": "可接受检查风险降低，需获取更多审计证据保证审计质量。A重大错报风险是评估，不能降低；B固有风险无法消除；D缩小范围获取证据少，不符合要求。C将实质性程序时间从期中移至期末，能获取更多更可靠证据。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338369", "t": 1, "q": "65.下列关于统计抽样说法正确的是（　）。", "a": ["统计抽样不存在非抽样风险", "统计抽样取得的证据证明力更强", "统计抽样不需要职业判断", "可以定量控制抽样风险", "", ""], "r": "D", "e": "非抽样风险是由人为因素造成，不管是统计抽样还是非统计抽样都存在非抽样风险，A错误；统计抽样和非统计抽样只要运用得当都能获取充分、适当证据，不能说统计抽样取得的证据证明力更强，B错误；统计抽样也需要职业判断，如确定样本规模等，C错误；统计抽样可以通过模型和公式定量控制抽样风险，D正确。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338370", "t": 1, "q": "注册会计师是否应当承担法律责任的关键是（　）", "a": ["是否按照执业准则的要求执业", "是否有过失或欺诈行为", "是否查出财务报表所有重大错报、舞弊和违反法律法规", "是否查出财务报表所有重大错报", "", ""], "r": "B", "e": "注册会计师承担法律责任通常与自身行为是否存在过失或欺诈相关。若存在这些不当行为，就可能要承担法律责任。A选项按准则执业不一定就完全免责；C和D选项，注册会计师难以保证查出所有重大错报等情况。所以关键是是否有过失或欺诈行为。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338371", "t": 1, "q": "下列有关审计重要性的表述中，错误的是（　）", "a": ["如果一项错报单独或连同其他错报可能影响财务报表使用者依据财务报表做出的经济决策，则该项错报是重要的", "如果已识别但尚未更正的错报汇总数重新接近但不超过重要性水平，注册会计师无需要求管理层调整", "在考虑一项错报是否重要时，既要考虑错报的金额，又要考虑错报的性质", "重要性的确定离不开职业判断", "", ""], "r": "B", "e": "当已识别但尚未更正的错报汇总数重新接近重要性水平时，可能会因一些未发现的错报累积起来超过重要性水平，所以注册会计师通常需要考虑扩大审计程序范围或要求管理层调整。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338372", "t": 1, "q": "如果注册会计师被要求提供第二次意见应当评价威胁的重要程度，并在必要时采取措施将威胁降低到可接受水平。下列防范措施中不恰当的是（　）", "a": ["向现任注册会计师提供第二次意见的复印件", "在与被审计单位的沟通函件中阐述注册会计师意见的局限性", "直接与现任注册会计师进行沟通并向现任注册会计师提供第二次意见的复印件", "征得被审计单位的同意后与现任注册会计师进行沟通", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338373", "t": 1, "q": "9.在控制检查风险时，B注册会计师应当采取的有效措施是（　）", "a": ["测试内部控制的有效性，以降低控制风险", "合理设计和有效实施进一步审计程序", "调高重要性水平", "进行穿行测试，以降低固有风险", "", ""], "r": "B", "e": "检查风险是指某一认定存在错报，该错报单独或连同其他错报是重大的，但注册会计师未能发现这种错报的可能性。通过合理设计和有效实施进一步审计程序可以控制检查风险。A选项控制风险与检查风险无直接降低关系；C选项调高重要性水平不能控制检查风险；D选项穿行测试不能降低固有风险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338374", "t": 1, "q": "下列项目（　）不适用函证程序。", "a": ["短期借款", "应付债券", "交易性金融资产", "资本公积", "", ""], "r": "D", "e": "函证主要用于核实存在性、权利和义务等情况。资本公积通常是企业在经营过程中由于接受捐赠、股本溢价等形成，其相关信息多通过企业内部的会计记录和文件来确定，一般不适合用函证程序核实。而短期借款、应付债券、交易性金融资产都可以通过向相关机构函证来确认其存在等情况。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338375", "t": 1, "q": "被审计单位对审计范围进行限定，致使某些重要审计程序无法实施，注册会计师应表述的审计意见应该是（　）", "a": ["否定意见", "保留意见", "无保留意见", "无法表示意见", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338376", "t": 1, "q": "若只证实会计报表组成要素是否存在低估情况，应当注意审查验证（　）。", "a": ["是否有未入账的资产、负债或其他交易事项", "资产或负债在某一特定时日是否存在", "资产或负债在某一特定时日是否归属被审计单位", "经济业务的发生是否与被审计单位有关", "", ""], "r": "A", "e": "低估意味着有应入账未入账的情况，所以要审查是否有未入账的资产、负债或其他交易事项。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338377", "t": 1, "q": "3．审计责任是指注册会计师应对其依照审计准则所出具的审计报告的（　）、合法性负责。", "a": ["完整性", "真实性", "准确性", "重要性", "", ""], "r": "B", "e": "注册会计师要对依照审计准则出具的审计报告的真实性和合法性负责。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338378", "t": 1, "q": "7.下列有关检查风险的观点不能认同的是（　）", "a": ["注册会计师应当合理设计审计程序的性质、时间和范围，并有效执行审计程序，以控制检查风险", "检查风险的控制效果取决于审计程序设计的合理性和执行的有效性", "检查风险与注册会计师所需要的审计证据成正比关系", "在既定的审计风险水平下，可接受的检查风险与认定层次重大错报风险的评估结果成反向关系", "", ""], "r": "C", "e": "检查风险与审计证据成反比关系，检查风险越低，需要的审计证据越多。A选项注册会计师通过合理设计和执行审计程序可控制检查风险；B选项检查风险控制效果依赖审计程序设计与执行；D选项既定审计风险下，可接受检查风险与重大错报风险评估结果反向。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338379", "t": 1, "q": "民间审计报告应遵循的要求是（　）", "a": ["书写端正", "措辞恰当", "内容完整", "报送及时", "", ""], "r": "C", "e": "民间审计报告需内容完整才能全面反映审计情况和结果，书写、措辞、报送及时性虽也重要但不是核心遵循要求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338380", "t": 1, "q": "某注册会计师对A公司2008年度财务报表进行审计，发现公司于2008年12月25日购入材料30万元，货物于12月28日验收入库，但发票于次年1月5日收到，A公司将上述购货业务记录于2009年账目中，因此，注册会计师可以认定（　）。", "a": ["A公司应在2008年12月31日资产负债表附注中进行相关披露", "A公司2008年年末存货及应付账款同时虚减30万元", "A公司在2008年没有进行相关记录是正确的", "A公司2008年度利润总额虚增30万元", "", ""], "r": "B", "e": "按照权责发生制，货物在2008年12月已验收入库，虽发票次年收到，购货业务应记录在2008年。A公司记在2009年，会使2008年末存货及应付账款同时虚减30万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338381", "t": 1, "q": "经济利益是指从某一实体的股票、债券、其他证券以及贷款和其他债务工具中获得的利益，包括直接经济利益和间接经济利益。下列对直接经济利益的判断正确的是（　）", "a": ["注册会计师在审计客户中通过房地产拥有的经济利益是直接经济利益", "注册会计师在审计客户中通过信托拥有的经济利益是直接经济利益", "注册会计师在审计客户中拥有的能够直接控制的经济利益是直接经济利益", "注册会计师在审计客户中通过集合投资工具拥有的经济利益是直接经济利益", "", ""], "r": "C", "e": "直接经济利益是指注册会计师在审计客户中拥有的能够直接控制的经济利益。A选项通过房地产、B选项通过信托、D选项通过集合投资工具拥有的经济利益通常不属于直接控制，不是直接经济利益。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338382", "t": 1, "q": "在特定审计风险水平下，检查风险同重大错报风险之间的关系是（　）", "a": ["反向变动关系", "不明显的关系", "有时呈同向变动关系", "同向变动关系", "", ""], "r": "A", "e": "审计风险=重大错报风险×检查风险，在审计风险既定情况下，重大错报风险越高，可接受的检查风险就越低，二者呈反向变动关系。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338383", "t": 1, "q": "在选用较低的控制风险估计水平下，必须执行的符合性测试的种类为（　）。", "a": ["追加符合性测试", "计划符合性测试", "同步符合性测试", "分析测试", "", ""], "r": "B", "e": "选用较低控制风险估计水平时，需执行计划符合性测试来获取证据以支持较低的控制风险估计水平。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338384", "t": 1, "q": "工作准则亦被称为审计的（　）准则。", "a": ["内勤", "行为", "运用", "外勤", "", ""], "r": "B", "e": "工作准则主要规范审计人员在执行审计业务过程中的行为，所以也被称为审计的行为准则。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338385", "t": 1, "q": "7.一般审计准则无不对审计人员的业务技能和品德操行提出一个高的标准，视为审计工作的灵魂的是（　）。", "a": ["真实性", "权威性", "独立性", "客观性", "", ""], "r": "C", "e": "审计工作中，独立性是灵魂。它确保审计人员能客观公正地开展工作，不受外界干扰。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338386", "t": 1, "q": "37.注册会计师林子没有义务实施的程序是（　）", "a": ["查找公司内部控制运行中的所有重大缺陷", "了解公司的情况及其环境", "实施审计程序，以了解公司内部控制的设计", "实施穿行测试，以确定公司相关控制活动是否得到执行", "", ""], "r": "A", "e": "注册会计师没有责任也不可能查找被审计单位内部控制运行中的所有重大缺陷，了解被审计单位及其环境、内部控制设计、实施穿行测试确定控制活动执行情况是审计中需实施的程序。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338387", "t": 1, "q": "审计证据的相关性是指审计证据应当与（　）相关。", "a": ["具体目标", "最终目标", "审计目标", "总体目标", "", ""], "r": "C", "e": "审计证据的相关性是指审计证据应与审计目标相关，这样才能为审计目标的实现提供支持。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338388", "t": 1, "q": "9.注册会计师审计产生的直接原因是（　）", "a": ["股份制企业制度的形成", "合伙企业制度产生", "所有权与经营权的分离", "资本市场的发展", "", ""], "r": "C", "e": "注册会计师审计源于企业所有权和经营权的分离，企业所有者和经营者之间需要独立第三方对企业财务信息进行鉴证，从而促使注册会计师审计产生。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338389", "t": 1, "q": "10.注册会计师王林负责对甲公司编制的下属子公司K公司2008年度财务报表进行审阅。在承接和执行业务时，王林遇到下列事项，请代为做出正确的专业判断在与甲公司管理层沟通时，⑵在确定该项业务责任方的责任时，下列表述正确的是（　）", "a": ["K公司管理层对K公司财务报表负责，甲公司管理层应对K公司财务状况、经营成果及现金流量负责", "甲公司管理层对K公司财务报表负责，K公司管理层应对K公司财务状况、经营成果及现金流量负责", "K公司管理层应对K公司财务报表、财务状况、经营成果及现金流量负责", "甲公司管理层应对K公司财务报表和财务状况、经营成果及现金流量负责", "", ""], "r": "C", "e": "责任方对鉴证对象信息负责，编制财务报表的K公司管理层应对K公司财务报表、财务状况、经营成果及现金流量负责。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338390", "t": 1, "q": "被审计单位对审计范围进行限定，致使某些重要审计程序无法实施，注册会计师应表述的审计意见应该是（　）", "a": ["否定意见", "无保留意见", "无法表示意见", "保留意见", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338391", "t": 1, "q": "管理建议书与审计报告的区别主要是（　）", "a": ["地点不同", "编写单位不同", "对象不同", "时间不同", "", ""], "r": "C", "e": "管理建议书是注册会计师针对审计过程中注意到的、可能导致被审计单位财务报表产生重大错报的内部控制重大缺陷提出的书面建议，对象是被审计单位管理层；审计报告是对被审计单位财务报表发表审计意见，对象主要是财务报表使用者等。二者主要区别在于对象不同。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338392", "t": 1, "q": "下列情形中，最有可能导致注册会计师不能执行财务报表审计的是（　）", "a": ["公司管理层没有清晰区分内部控制要素", "公司管理层没有根据变化的情况修改相关的内部控制", "公司管理层凌驾于内部控制之上", "注册会计师对对公司管理层的诚信存在严重疑惑", "", ""], "r": "D", "e": "注册会计师执行审计工作需基于对管理层诚信的合理信任，若对管理层诚信存在严重疑惑，审计的前提基础就不具备，无法开展审计工作。A、B选项不影响审计执行，C选项虽有风险但可应对。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338393", "t": 1, "q": "22、最高审计机关国际组织正式成立于（　）。", "a": ["1984年", "1968年", "1953年", "1986年", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338394", "t": 1, "q": "下列哪项业务属于不相容职务？", "a": ["记录日记账和记录总账", "经理和董事长", "保管员和车间主任", "采购员和购销科长", "", ""], "r": "A", "e": "不相容职务是指那些如果由一个人担任，既可能发生错误和舞弊行为，又可能掩盖其错误和弊端行为的职务。记录日记账和记录总账若由一人担任易出现舞弊且难以发现问题，属于不相容职务。其他选项中的职务不存在这种不相容的内在联系。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338395", "t": 1, "q": "下列有关审计工作底稿归档期限的表述中，正确的是（　）", "a": ["如果完成审计业务，归档期限为外勤审计工作结束日后60天内", "如果完成审计业务，归档期限为审计报告日后60天内", "如果未能完成审计业务，归档期限为审计业务中止日后30天内", "如果未能完成审计业务，归档期限为外勤审计工作中止日后30天内", "", ""], "r": "B", "e": "审计工作底稿归档期限，完成审计业务的，应在审计报告日后60天内归档；未完成审计业务的，应在审计业务中止日后60天内归档。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338396", "t": 1, "q": "对当期档案，审计机构应当自审计报告签发之日起，至少保存（　）年以上。", "a": ["15", "5", "8", "10", "", ""], "r": "D", "e": "根据审计相关规定，审计机构对当期档案应自审计报告签发之日起至少保存10年。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338397", "t": 1, "q": "9.“发生”认定，指记录的交易和事项已发生且与被审计单位有关，其目标主要针对（　）。", "a": ["数量", "高估", "金额", "低估", "", ""], "r": "B", "e": "“发生”认定关注的是不该记录的交易记录了，容易导致高估。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338398", "t": 1, "q": "为证实W公司所记录的资产是否均由W公司拥有或控制，注册会计师采用下列（　）程序能够获取充分、适当的审计证据。", "a": ["询问", "检查文件或记录", "重新执行", "检查有形资产", "", ""], "r": "B", "e": "检查文件或记录可查看资产的所有权凭证等，能证实资产是否由被审计单位拥有或控制。询问获取证据可靠性低；重新执行用于内部控制测试；检查有形资产只能证明资产存在，不能确定所有权。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338399", "t": 1, "q": "下列有关审计重要性的表述中，错误的是（　）", "a": ["如果一项错报单独或连同其他错报可能影响财务报表使用者依据财务报表做出的经济决策，则该项错报是重要的", "在考虑一项错报是否重要时，既要考虑错报的金额，又要考虑错报的性质", "重要性的确定离不开职业判断", "如果已识别但尚未更正的错报汇总数重新接近但不超过重要性水平，注册会计师无需要求管理层调整", "", ""], "r": "D", "e": "若已识别但尚未更正的错报汇总数重新接近但不超过重要性水平，仍可能存在未发现的错报与已识别未更正错报汇总后超过重要性水平的情况，所以注册会计师通常需要考虑扩大审计程序范围或要求管理层调整。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338400", "t": 1, "q": "在获取的下列审计证据中，可靠性最高的是（　）", "a": ["甲编制的成本分配计算表", "甲公司提供的银行对账单", "甲公司连续编号的采购订单", "甲公司管理层提供的声明", "", ""], "r": "B", "e": "审计证据可靠性受来源等因素影响，外部来源证据通常比内部证据可靠。银行对账单来自银行这一外部机构，而成本分配计算表、采购订单、管理层声明均为甲公司内部产生。所以可靠性最高的是银行对账单。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338401", "t": 1, "q": "（　）是保证企业财产安全完整的一种内部控制措施。", "a": ["财产管理控制", "财务程序控制", "内部会计控制", "经济效益控制", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338402", "t": 1, "q": "注册会计师执行的下列业务中，保证程度最高的是（　）", "a": ["财务报表审计", "对财务信息执行的商定程序", "代编财务信息", "贄务报表审阅", "", ""], "r": "A", "e": "审计是合理保证业务，保证程度高；商定程序和代编财务信息不提供保证；审阅是有限保证业务，保证程度低于审计。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338403", "t": 1, "q": "会计师事务所承接了具体的某项审计业务后，应当有相应的业务层面的防范措施来确保消除或降低独立性的威胁。下列防范措施中可能无效的是（　）", "a": ["与被审计单位的管理层讨论职业道德问题", "向被审计单位的独立董事进行独立第三方咨询", "由审计项目组以外的更有经验的注册会计师复核已执行的审计工作", "向被审计单位的治理层披露服务的性质", "", ""], "r": "A", "e": "与被审计单位管理层讨论职业道德问题，因管理层有自身利益考量，难以有效消除或降低独立性威胁。而向独立董事咨询、更有经验人员复核、向治理层披露服务性质都有助于保障独立性。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338404", "t": 1, "q": "验证被审计单位银行存款收支截止日期是为了（　）。", "a": ["确保委托人所有收款均已入账", "确保委托人所有已开出支票均已入账", "确保委托人银行存款余额的正确性", "以上三项均不正确", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338405", "t": 1, "q": "如果审计项目组成员的直系亲属从审计客户购买商品或服务，则下列说法不正确的是（　）", "a": ["如果交易过程正常、公正，则通常不会对独立性产生威胁", "会计师事务所不能承接该业务", "会计师事务所应当评价威胁的重要程度，并在必要时采取防范措施将威胁降低到可接受水平", "如果交易性质特殊或金额较大，则可能产生自身利益威胁", "", ""], "r": "B", "e": "审计项目组成员直系亲属从审计客户正常购买商品或服务，一般不会影响独立性，若交易特殊或金额大可能有威胁，此时应评价并采取措施，并非不能承接业务。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338406", "t": 1, "q": "下列审计证据中，属于注册会计师直接取得的有（　）。", "a": ["购销合同", "各种协议、契约", "对账单", "应收账款函证回函", "", ""], "r": "D", "e": "ABC选项通常是企业提供给注册会计师的，而应收账款函证回函是注册会计师直接向第三方发函获取的。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338407", "t": 1, "q": "在了解控制环境时，注册会计师通常考虑的因素是（　）", "a": ["内部控制的人工成分", "内部控制的自动化成分", "公司董事会对内部控制重要性的态度和认识", "会计信息系统", "", ""], "r": "C", "e": "控制环境包括治理职能和管理职能，以及治理层和管理层对内部控制及其重要性的态度、认识和措施。选项C公司董事会对内部控制重要性的态度和认识属于控制环境因素。而选项A、B是内部控制要素中控制活动的相关内容，选项D会计信息系统属于信息系统与沟通要素。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338408", "t": 1, "q": "17、注册会计师依法执行审计业务出具的报告，具有（　）效力。", "a": ["公示", "确定", "证明", "公证", "", ""], "r": "C", "e": "注册会计师执行审计业务出具的报告主要是对被审计事项进行证明，表明其在审计过程中发现的情况和得出的结论等。A选项公示并非审计报告主要效力；B选项确定说法不准确；D选项公证一般是公证机构的职能。所以选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338409", "t": 1, "q": "在对存货进行分析性复核时，注册会计师常用（　）指标进行分析。", "a": ["流动比率", "毛利率", "存货周转率", "应收账款周转率", "", ""], "r": "C", "e": "A. 流动比率:流动比率是衡量企业短期偿债能力的一个重要财务指标，但它主要关注的是企业的流动资产与流动负债之间的关系，并不是专门用来分析存货的指标。因此，在对存货进行分析性复核时，流动比率通常不作为首选指标使用。<br />B. 毛利率:毛利率反映了销售收入扣除销售成本后所剩余额占销售收入的比例，虽然它可以间接反映产品成本控制情况，但并不是直接用于存货分析的主要指标。<br />C. 存货周转率:存货周转率是衡量企业一定时期内存货被销售或消耗的速度，能够有效反映存货管理水平和资金利用效率，是注册会计师在进行存货分析性复核时常用的指标之一。<br />D. 应收账款周转率:该指标主要用于评估企业应收账款回收速度及其管理效率，与存货直接关联不大，在存货分析中不作为主要考量对象。", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338410", "t": 1, "q": "如果会计师事务所有前任合伙人加入了审计客户并担任董事，则会计师事务所应当评价威胁的重要程度并在必要时采取防范措施消除威胁或将威胁降低到可接受水平。下列防范措施不恰当的是（　）", "a": ["由项目组以外的其他注册会计师复核前任审计项目组成员已执行的工作", "向审计项目组委派经验更丰富的人员", "修改审计计划", "没有防范措施可以将威胁降低到可接受水平，会计师事务所应当终止业务", "", ""], "r": "D", "e": "会计师事务所有前任合伙人加入审计客户并担任董事，并非没有防范措施可降低威胁，A、B、C 选项都是可行的防范手段，D 说没有防范措施应终止业务表述错误。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338411", "t": 1, "q": "注册会计师王林负责对甲公司编制的下属子公司K公司2008年度财务报表进行审阅。在与甲公司管理层沟通时，注册会计师王林应当说明这项业务属于（　）", "a": ["合理保证的鉴证业务", "其他鉴证业务", "有限保证的鉴证业务", "直接报告业务", "", ""], "r": "C", "e": "财务报表审阅业务是有限保证的鉴证业务。审阅程序有限，所提供的保证程度低于审计，是有限保证。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338412", "t": 1, "q": "3、总体审计计划包括的内容有（　）", "a": ["审计领域", "审计目的", "审计程序", "审计时间", "", ""], "r": "B", "e": "总体审计计划是对审计的预期范围和实施方式所做的规划，应包含审计目的等宏观内容。审计程序属具体审计计划内容。审计领域表述不准确、不常见，审计时间也是具体执行安排。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338413", "t": 1, "q": "民间审计的业务范围不包括（　）。", "a": ["会计咨询业务", "验资", "会计监督", "审计业务", "", ""], "r": "C", "e": "民间审计业务主要有审计、验资等，也可提供会计咨询业务。会计监督是政府财政部门等的职责，并非民间审计业务范围。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338414", "t": 1, "q": "注册会计师了解被审计单位及其环境的目的是（　）", "a": ["为了进行风险市场段程序", "收集充分适当的审计证据", "为了识别和评估财务报表的重大错报风险", "控制检查风险", "", ""], "r": "C", "e": "了解被审计单位及其环境是风险评估程序的重要内容，目的是识别和评估财务报表重大错报风险。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338415", "t": 1, "q": "下列与重大错报风险相关的表述中，正确的是（　）", "a": ["管理机构错报风险是因错误使用审计程序产生的", "重大错报风险独立于财务报表审计而存在", "重大错报风险可以通过合理实施审计程序予以控制", "重大错报风险是假定不存在相关内部控制，某一认定发生重大错报的可能性", "", ""], "r": "B", "e": "重大错报风险是财务报表在审计前存在重大错报的可能性，独立于审计而存在。A选项，错误使用审计程序产生的是检查风险；C选项，重大错报风险是客观存在的，不能通过审计程序控制；D选项描述的是固有风险。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338416", "t": 1, "q": "以下关于注册会计师过失说法不正确的是（　）", "a": ["重大过失是指注册会计师没有按专业准则的基本要求执行审计", "注册会计师一旦出现过失就要赔偿损失", "普通过失是指注册会计师没有完全遵守专业准则的要求", "过失是指在一定条件下，缺少应具有的合理谨慎", "", ""], "r": "B", "e": "注册会计师出现过失不一定就要赔偿损失，还需考虑因果关系等其他因素。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338417", "t": 1, "q": "6.关于审计风险模型中其各要素的下列说法中，不正确的是（　）", "a": ["审计风险是注册会计师审计前面临的", "检查风险是注册会计师通过实施实质性程序控制的", "重大错报风险是评估的", "审计风险是预先设定的", "", ""], "r": "A", "e": "审计风险是指财务报表存在重大错报时注册会计师发表不恰当审计意见的可能性，是预先设定的，并非审计前就面临的。检查风险可通过实质性程序控制，重大错报风险需注册会计师评估。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338418", "t": 1, "q": "注册会计师在应用独立性概念框架时应当运用职业判断。以下关于注册会计师运用独立性概念框架的工作思路不恰当的是（　）", "a": ["注册会计师在接受业务或续约时，首先要识别对独立性的威胁", "评价已识别威胁的重要程度", "必要时采取防范措施消除威胁或将威胁降低到可接受水平", "消除对独立性的所有威胁", "", ""], "r": "D", "e": "独立性概念框架是为了应对对独立性的威胁，并非要消除所有威胁，有些威胁可能无法完全消除，只要将其降低到可接受水平即可。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695825338419", "t": 1, "q": "如果某注册会计师在其执业过程中发现他无法胜任此项工作，那么他应该（　）", "a": ["依赖客户职员的才能", "请求会计师事务所改派他人", "出具保留意见的审计报告", "出具拒绝表示意见的审计报告", "", ""], "r": "B", "e": "注册会计师无法胜任工作时，应保证审计质量，请求事务所改派有能力的人来完成。依赖客户职员不能保证专业胜任，未完成工作就出具审计报告不符合规定。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532672", "t": 1, "q": "管理建议书是提供给被审单位的（　）", "a": ["会计咨询报告", "财务状况说明书", "内部控制报告", "审计报告", "", ""], "r": "C", "e": "管理建议书是注册会计师在审计过程中，针对被审计单位内部控制的重大缺陷提出的书面建议，属于内部控制报告。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532673", "t": 1, "q": "19、选用审计依据，不能只考虑眼前利益，还要考虑（　）。", "a": ["社会效益", "企业利益", "国家利益", "长远利益", "", ""], "r": "D", "e": "题目强调不能只看眼前利益，与之对应的应是长远利益。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532674", "t": 1, "q": "注册会计师在应用独立性概念框架时应当运用职业判断。以下关于注册会计师运用独立性概念框架的工作思路不恰当的是（　）", "a": ["消除对独立性的所有威胁", "评价已识别威胁的重要程度", "必要时采取防范措施消除威胁或将威胁降低到可接受水平", "注册会计师在接受业务或续约时，首先要识别对独立性的威胁", "", ""], "r": "A", "e": "注册会计师运用独立性概念框架，是识别威胁、评价威胁重要程度、采取措施消除或降低威胁，并非消除所有威胁，有些威胁难以完全消除。答案：A 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532675", "t": 1, "q": "甲公司2009年度的存货周转率为2.7，与2008年度相比有所下降。甲公司提供的以下理由中，不能解释存货周转率变动趋势的是（　）", "a": ["甲公司在2009年第4季度接到一笔巨额订单，订货数量相当于甲公司月产能的120%，交货日期为2010年1月1日", "从2009年6月开始，甲公司将部分产品针对主要销售客户的营销方式由原先的买断模式改为代销模式", "甲公司主要产品在2009年度市场需求稳定且盈利，但平均销售价格与2008年度相比有所下降，并且甲公司预期销售价格将继续下降", "由于主要原材料价格比2008年度下降了10%，甲公司从2009年1月开始将主要原材料的日常储备量增加了20%", "", ""], "r": "C", "e": "存货周转率=营业成本/平均存货余额。存货周转率下降意味着营业成本相对降低或平均存货余额相对增加。A项，巨额订单在2010年交货，会使2009年末存货增加，能解释周转率下降；B项，代销模式下存货在售出前仍属甲公司，存货增加，可解释；C项，销售价格下降与存货周转率变动无直接关联，不能解释；D项，原材料储备量增加使存货增加，能解释。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532676", "t": 1, "q": "8．数字错位的查找方法一般采用（　）。", "a": ["除2法", "除9法", "除99法", "除10法", "", ""], "r": "B", "e": "数字错位时，差错数能被9整除，所以一般采用除9法查找。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532677", "t": 1, "q": "被审单位个别会计处理方法的选用不符合一贯性原则，注册会计师应出具（　）审计报告。", "a": ["无保留意见", "保留意见", "拒绝表示意见", "否定意见", "", ""], "r": "B", "e": "个别会计处理方法选用不符一贯性原则，影响不广泛但重要，应出具保留意见审计报告。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532678", "t": 1, "q": "会计师事务所应当要求（　）对业务执行实施指导、监督与复核", "a": ["项目组", "项目负责人", "部门经理", "主任会计师", "", ""], "r": "B", "e": "项目负责人负责对业务执行实施指导、监督与复核，以确保业务质量。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532679", "t": 1, "q": "注册会计师对其助理人员应当（　）", "a": ["进行指导和监督，但不能对其工作结果负责", "进行指导和监督，并对其工作结果负责", "进行监督和管理", "进行约束和指导", "", ""], "r": "B", "e": "注册会计师要对助理人员工作进行指导和监督，且需对其工作结果负责，这是保证审计质量的要求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532680", "t": 1, "q": "在审计工作中,揭示审计对象的差错和弊端,属于审计的（　）。", "a": ["建设性作用", "制约性作用", "宏观调控作用", "促进性作用", "", ""], "r": "B", "e": "审计揭示差错和弊端，能对被审计单位的违规行为起到抑制和约束，这体现的是审计的制约性作用。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532681", "t": 1, "q": "如果审计项目成员在某一实体拥有经济利益，并且知悉审计客户的董事也在该实体拥有经济利益，则应当确定是否会产生自身利益、或外在压力威胁。注册会计师应当评价威胁的重要程度并在必要时采取防范措施消除威胁或将威胁降低到可接受水平。下列防范措施恰当的是（　）", "a": ["没有任何防范措施可以消除威胁或将威胁降低到可接受水平", "将该审计项目组成员调离项目组", "会计师事务所拒绝承接该业务", "如果会计师事务所已经承接该业务则必须马上终止该业务", "", ""], "r": "B", "e": "当审计项目成员与审计客户董事在同一实体有经济利益产生威胁时，将该审计项目组成员调离项目组，可避免其因自身利益等影响审计独立性，能有效消除或降低威胁。A选项太绝对；C、D在有防范措施时并非必要做法。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532682", "t": 1, "q": "在审计风险模型中，“重大错报风险”是指（　）", "a": ["评估的与控制环境相关的重大错报风险", "评估的认定层次的重大错报风险", "评估的与财务报表存在联系的重大错报风险", "评估的财务报表层次的重大错报风险", "", ""], "r": "B", "e": "审计风险模型中的重大错报风险指评估的认定层次的重大错报风险。财务报表层次重大错报风险与整体相关，控制环境只是其中一方面，而审计风险模型主要针对认定层次。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532683", "t": 1, "q": "某注册会计师在编写报告时，在“意见段”中使用“除存在上述问题外”术语，这种类型的术语常见于（　）。", "a": ["否定意见审计报告", "无保留意见审计报告", "拒绝表示意见审计报告", "保留意见审计报告", "", ""], "r": "D", "e": "保留意见审计报告会在“意见段”说明除某些问题外，财务报表整体是公允的，常用“除存在上述问题外”等术语。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532684", "t": 1, "q": "《中华人民共和国审计法》在全国实施的时间是（　）。", "a": ["1997年1月1日", "1995年1月1日", "1996年1月1日", "1994年1月1日", "", ""], "r": "B", "e": "《中华人民共和国审计法》自1995年1月1日起施行。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532685", "t": 1, "q": "内部审计机构应当接受（　）的业务指导和监督。", "a": ["国家", "社会", "国家审计机关", "社会审计组织", "", ""], "r": "C", "e": "国家审计机关负责对内部审计机构进行业务指导和监督。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532686", "t": 1, "q": "从预计总体误差率为零开始，边抽样边评价来完成抽样工作的方法是（　）", "a": ["停-走抽样", "属性抽样", "发现抽样", "变量抽样", "", ""], "r": "A", "e": "本题可根据各抽样方法的特点来判断。 A选项：停 - 走抽样停 - 走抽样是从预计总体误差率为零开始，通过边抽样边评价来完成抽样工作。在抽样过程中，根据样本中发现的误差情况，决定是停止抽样还是继续抽样，所以该选项符合题意。 B选项：属性抽样属性抽样是一种用来对总体中某一事件发生率得出结论的统计抽样方法，它并不一定是从预计总体误差率为零开始且边抽样边评价，主要用于测试内部控制的有效性等，故该选项不符合题意。  C选项：发现抽样发现抽样是在既定的可信赖程度下，在假定误差以既定的误差率存在于总体之中的情况下，至少查出一个误差的抽样方法，并非从预计总体误差率为零开始边抽样边评价，所以该选项不符合题意。 D选项：变量抽样变量抽样是对审计对象总体的货币金额进行实质性测试时所采用的抽样方法，与从预计总体误差率为零开始边抽样边评价的特点无关，因此该选项不符合题意。综上，答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532687", "t": 1, "q": "在审计人员过程中，如果遇到低层次的规定与高层次的规定相抵触时，则应以（　）的规定为准，做出判断和评价。", "a": ["会计制度", "高层次", "审计制度", "低层次", "", ""], "r": "B", "e": "当低层次规定和高层次规定冲突时，遵循高层次规定是原则，以保证规定的权威性和统一性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532689", "t": 1, "q": "注册会计师审计从起源发展到现在经历了一个较漫长的过程，在审计发展的不同时期，其主要审计目的也在调整。下列关于不同阶段的审计目的的陈述不恰当的是（　）", "a": ["现代风险导向审计方法确立后，审计工作是审查重要的账户余额或种类交易是否存在重大错报", "美式注册会计师审计的主要目的是判断企业的经营状况和财务状况", "1929-1933年的世界经济危机后，审计主要目的是对财务报表发表审计意见，查错防弊转为次要目的", "英式注册会计师审计主要目的是查错防弊", "", ""], "r": "B", "e": "美式注册会计师审计主要目的是对财务报表发表审计意见，判断企业经营和财务状况并非其主要目的。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532690", "t": 1, "q": "22．审计第二关系人是指（　）。", "a": ["被审计人", "审计人", "审计机构", "审计委托人", "", ""], "r": "A", "e": "审计关系中有三方，审计人是第一关系人，被审计人是第二关系人，审计委托人是第三关系人。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532691", "t": 1, "q": "目前世界上最大的民间审计专业团体是（　）。", "a": ["美国注册会计师协会", "英国注册会计师协会", "法国注册会计师协会", "中国注册会计师协会", "", ""], "r": "A", "e": "美国注册会计师协会历史悠久、规模大且影响力大，是全球最大的民间审计专业团体。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532692", "t": 1, "q": "不相容业务分工即禁止（　）经济业务。", "a": ["一组人承办", "一人包办", "多个机构共同承办", "一机构承办", "", ""], "r": "B", "e": "不相容业务分工强调不能让一人包办相关经济业务，以防止舞弊等情况发生。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532693", "t": 1, "q": "19.会计师事务所往往与其他会计师事务所及实体构成组织结构，这些组织结构是否构成网络取决于下列因素（　）", "a": ["取决于会计师事务所是否属于法律上独立的实体", "取决于会计师事务所之间是否独立", "取决于会计师事务所是否独立于审计客户", "取决于合作的目的和共享的收益资源等情况", "", ""], "r": "D", "e": "判断组织结构是否构成网络，关键看合作目的和共享的收益资源等情况，而非是否法律独立、事务所间独立或独立于审计客户等。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532694", "t": 1, "q": "在获取的下列审计证据中，可靠性最高的是（　）", "a": ["甲公司提供的银行对账单", "甲公司连续编号的采购订单", "甲公司编制的成本分配计算表", "甲公司管理层提供的声明", "", ""], "r": "A", "e": "外部获取的证据比内部获取的可靠性高，银行对账单来自外部银行，可靠性高于甲公司内部编制的采购订单、成本分配计算表和管理层声明。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532695", "t": 1, "q": "下列关于注册会计师评价审计证据的充分性和适当性的说法，不正确的是（　）", "a": ["审计工作通常不涉及鉴定文件记录的真伪，注册会计师也不是鉴定记录文件真伪的专家，但应当考虑用作审计证据的信息的可靠性，并考虑与这些信息生成与维护相关的控制的有效性", "如果在实施审计程序时使用被审计单位生成的信息，注册会计师应当就这些信息的准确性和完整性获得审计证据", "如果从不同来源获取的审计证据或获取的不同性质的审计证据不一致，表明某项审计证据不可靠，注册会计师应当追加必要的审计程序", "注册会计师可以考虑获取审计证据的成本与所获得信息的有用性之间的关系，因此可以减少某些不可替代的审计程序", "", ""], "r": "D", "e": "注册会计师不应以获取审计证据的成本为由减少不可替代的审计程序。A项对审计证据可靠性考虑表述正确；B项对使用被审计单位信息需获取准确性和完整性证据合理；C项对审计证据不一致处理方式正确。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528695829532696", "t": 1, "q": "对企业接受捐赠的审查，注册会计师应重点查阅（　）总账及其明细账。", "a": ["实收资本", "营业外收入", "资本公积", "盈余公积", "", ""], "r": "B", "e": "企业接受捐赠应计入营业外收入，所以审查时应重点查阅营业外收入总账及其明细账。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128384", "t": 2, "q": "注册会计师有可能承担的行政责任包括（　）", "a": ["吊销注册会计师证书", "没收违法所得", "暂停执业", "警告", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128385", "t": 2, "q": "以下关于审计报告的叙述，正确的是（　）。", "a": ["注册会计师出具无保留意见的审计报告时，如果认为必要，可在意见段之前增加强调事项段", "审计报告的收件人一般是委托人", "审计报告的日期是指审计报告对外发布的日期", "审计报告的标题应为“审计报告”", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128386", "t": 2, "q": "审计与会计的联系主要表现在（　）", "a": ["两者目的最终一致", "两者起源密切相关", "两者彼此渗透、融汇", "两者职能基本相同", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128387", "t": 2, "q": "在了解和测试与特别风险相关的内部控制时，注册会计师的下列做法正确的有（　）", "a": ["评价相关控制的设计情况，并确定其是否已经得到执行", "如果拟信赖相关控制，每年测试控制的有效性", "如果拟信赖相关控制，且相关控制自上次测试后未发生变化，每两年测试一次控制的有效性", "如果相关控制不能恰当应对特别风险，应当就该事项与治理层沟通", "", ""], "r": "ABD", "e": "对于特别风险相关控制，要评价其设计和执行情况，拟信赖时需每年测有效性，若控制不能应对特别风险应与治理层沟通。自上次测试后未变化也需每年测。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128389", "t": 2, "q": "下列情形属于产生自身利益威胁的有（　）", "a": ["审计项目负责人长期与被审计单位总裁发生个人借贷关系", "会计师事务所承接的审计业务没有采用或有收费安排", "在被审计单位拥有直接经济利益", "审计项目组成员与审计客户进行雇佣协商", "", ""], "r": "ACD", "e": "自身利益威胁是指因经济利益或其他利益对独立性产生的不利影响。A选项中审计项目负责人与被审计单位总裁个人借贷，可能因自身经济利益影响审计独立性；C选项在被审计单位有直接经济利益，会因自身利益影响审计；D选项审计项目组成员与审计客户进行雇佣协商，为自身职业发展考虑可能会影响审计。而B选项未采用或有收费安排，不会因收费与审计结果挂钩产生自身利益威胁。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128390", "t": 2, "q": "注册会计师应当及时编制审计工作底稿以实现的目标体现在（　）", "a": ["便于有经验的注册会计师实施质量控制复核与检查", "使项目组对其工作负责", "提供证据证明其按照中国注册会计师审计准则的规定执行了审计工作", "提供充分、适当的记录作为审计报告的基础", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128391", "t": 2, "q": "下列哪些项目是《审计业务约定书》在签约之前审计人员必须了解被审计单位的基本情况？", "a": ["经营规模", "管理者管理经验", "经营风险", "财务会计工作组织", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128392", "t": 2, "q": "内部控制符合性测试的方法包括（　）。", "a": ["检查证据法", "现场观察法", "穿行试验法", "核对法", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128393", "t": 2, "q": "一般准则包括（　）。", "a": ["训练与能力", "职业道德", "制定审计计划", "独立性", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128394", "t": 2, "q": "大新会计师事务所已于2008年2月1日至4月28日为公司设计完成了计算机会计数据系统。大新会计师事务所2008年12月1日接受委托对乙公司2008年度的财务报表进行审计。大新会计师事务所如果准备承接乙公司2008年度的财务报表审计，则需要采取下列哪些防范措施将威胁独立性的影响降低到可接受水平？", "a": ["获得乙公司对非鉴证服务的结果承担责任的承诺", "与乙公司的管理层讨论独立性", "大新会计师事务所不允许提供非鉴证服务的人员参与审计业务", "大新会计师事务所主任会计师复核非鉴证服务的结果", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128395", "t": 2, "q": "一般公认审计准则由（　）等构成。", "a": ["报表准则", "工作准则", "一般准则", "报告准则", "", ""], "r": "BCD", "e": "一般公认审计准则通常由一般准则、工作准则和报告准则构成。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128396", "t": 2, "q": "审计的独立性主要表现为（　）", "a": ["经济独立", "人员独立", "思想独立", "工作独立", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128397", "t": 2, "q": "如果会计师事务所要保持一项业务，则应当确定现有的防范措施对于消除对独立性的威胁或将威胁降低到可接受水平是否有效，否则应（　）", "a": ["将审计业务变更为审阅业务", "采取其他防范措施", "终止业务", "拒绝接受", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128398", "t": 2, "q": "在针对特别风险计划和实施进一步审计程序时，注册会计师可能采取的做法有（　）", "a": ["实施控制测试和实质性程序", "实施细节测试的实质性分析程序", "仅实施控制测试", "仅实施实质性分析程序", "", ""], "r": "AB", "e": "针对特别风险，仅实施控制测试或仅实施实质性分析程序通常是不够的，需要实施控制测试和实质性程序，也可结合实施细节测试和实质性分析程序。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128399", "t": 2, "q": "下列情形属于产生自身利益威胁的有（　）", "a": ["会计师事务所承接的审计业务没有采用或有收费安排", "审计项目组成员与审计客户进行雇佣协商", "审计项目负责人长期与被审计单位总裁发生个人借贷关系", "在被审计单位拥有直接经济利益", "", ""], "r": "BCD", "e": "自身利益威胁指因经济利益或其他利益可能不当影响注册会计师的职业判断。B选项审计项目组成员与审计客户雇佣协商，会因可能的雇佣关系产生自身利益威胁；C选项审计项目负责人与被审计单位总裁个人借贷，经济利益关联易影响独立性产生自身利益威胁；D选项在被审计单位有直接经济利益，经济利益驱动会产生自身利益威胁。A选项没采用或有收费安排不会产生自身利益威胁。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128400", "t": 2, "q": "影响审计效果的抽样风险包括（　）。", "a": ["误受风险", "对内部控制信赖不足风险", "对内部控制信赖过度风险", "误拒风险", "", ""], "r": "AC", "e": "审计效果关注的是得出不恰当审计结论的风险。误受风险是指错误地接受了实际上错误的总体，会影响审计效果；对内部控制信赖过度风险，可能导致审计人员减少实质性程序，得出不恰当结论，影响审计效果。而对内部控制信赖不足风险和误拒风险主要影响审计效率。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128401", "t": 2, "q": "对以下注册会计师审计理解的陈述中，恰当的有（　）", "a": ["注册会计师在财务报表审计中必须查出财务报表中所有舞弊", "注册会计师在财务报表审计中应根据被审计单位所采用的企业会计准则和相关会计制度来判断其财务报表编制是否合法，财务报表反映的内容是否公允", "注册会计师必须收集基于认定的充分适当的审计证据才能对财务报表发表审计意见", "注册会计师对财务报表审计的核心环节是对财务报表重大错报风险的“识别、评估和应对”", "", ""], "r": "BCD", "e": "A项，注册会计师不能保证查出所有舞弊，只能合理保证，A错误；B项，注册会计师审计需依据会计准则等判断报表合法性和公允性，正确；C项，充分适当审计证据是发表审计意见基础，正确；D项，识别、评估和应对重大错报风险是审计核心环节，正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128402", "t": 2, "q": "以下内部控制中，能够防止或发现购货及付款发生错误或舞弊的有（　）。", "a": ["现购业务必须经财会部门批准后方可支付价款", "所有订货单应经采购部门及有关部门批准，其副本应及时提交财会部门", "收到购货发票后，应立即送采购部门与订货单、验收单核对相符合", "采用总价法记录现金折扣，并严格复核是否发生折扣损失", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128403", "t": 2, "q": "大新会计师事务所已于2008年2月1日至4月28日为公司设计完成了计算机会计数据系统。大新会计师事务所2008年12月1日接受委托对乙公司2008年度的财务报表进行审计。大新会计师事务所如果准备承接乙公司2008年度的财务报表审计，则需要采取下列哪些防范措施将威胁独立性的影响降低到可接受水平？", "a": ["获得乙公司对非鉴证服务的结果承担责任的承诺", "大新会计师事务所主任会计师复核非鉴证服务的结果", "大新会计师事务所不允许提供非鉴证服务的人员参与审计业务", "与乙公司的管理层讨论独立性", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128404", "t": 2, "q": "根据《公司法》和《证券法》，下列公司必须由会计师事务所进行审计的有（　）", "a": ["不设监事会的公司的监事发现公司经营情况异常时", "一人有限责任公司编制的财务报表", "首次公开发行股票公司连续3年的财务报表", "上市公司财务报表", "", ""], "r": "BCD", "e": "一人有限责任公司应在每一会计年度终了时编制财务报表并经会计师事务所审计；首次公开发行股票公司连续3年的财务报表和上市公司财务报表也都需会计师事务所审计。而不设监事会的公司的监事发现公司经营情况异常时，可进行调查，但未规定必须由会计师事务所审计。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128405", "t": 2, "q": "22、世界各国对注册会计师的任职资格都有严格要求，概括起来应同时具备（　）等项条件。", "a": ["资格审核", "专业教育", "专业学历", "资格考试", "", ""], "r": "BD", "e": "注册会计师任职资格需接受专业教育获取知识，通过资格考试检验能力。资格审核是后续流程，专业学历并非必备条件。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128406", "t": 2, "q": "《中国注册会计师职业道德基本准则》规定了民间审计人员的职业道德包括（　）", "a": ["对客户的责任", "一般原则", "对同行的责任", "其它责任", "", ""], "r": "ABCD", "e": "《中国注册会计师职业道德基本准则》规定民间审计人员职业道德涵盖一般原则、对客户责任、对同行责任等方面。ABCD选项都符合其规定范围。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128407", "t": 2, "q": "审计的制约作用可以概括为（　）", "a": ["揭露损失浪费", "揭露贪污舞弊", "可以加强廉政建设", "可以促进加强宏观调控", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128408", "t": 2, "q": "审计风险=（　）×（　）×（　）。", "a": ["控制风险", "检查风险", "抽样风险", "固有风险", "", ""], "r": "ABD", "e": "审计风险模型为审计风险=固有风险×控制风险×检查风险。抽样风险不属于审计风险模型构成要素。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128409", "t": 2, "q": "6、评价抽样结果的具体步骤为（　）。", "a": ["形成审计结论", "重估抽样风险", "分析样本误差", "推断总体误差", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128410", "t": 2, "q": "注册会计师发现委托人会计处理方法有错误时，正确的做法是（　）。", "a": ["委托人调整后出具无保留意见的审计报告", "委托人未做调整的出具保留意见的审计报告", "直接出具否定意见的审计报告", "直接出具保留意见的审计报告", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128411", "t": 2, "q": "注册会计师在审计业务活动中，如果存在下列情形之一，将会以不实报告给利害关系人造成损失为由追究连带责任（　）", "a": ["明知被审计单位对重要事项的财务会计处理直接损害利害关系人的利益，而予以隐瞒或作不实报告", "被审计单位示意作不实报告，而不予拒绝", "与被审计单位恶意串通", "明知被审计单位对重要事项的财务会计处理与国家有关规定相抵触，而不予指明", "", ""], "r": "ABCD", "e": "ABCD选项均属于注册会计师在审计业务中存在故意违规行为，会导致以不实报告给利害关系人造成损失，应追究连带责任。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128412", "t": 2, "q": "关于审计的分类可以从不同的角度加以考察，下列对审计的分类表述恰当的是（　）", "a": ["审计按内容的不同可分为财务报表审计、经营审计和合规性审计", "审计按主体的不同可分为政府审计、内部审计和注册会计师审计", "审计按与被审计单位的关系不同可分为内部审计和外部审计", "审计按目的的不同可分为合理保证审计和有限保证审计", "", ""], "r": "ABC", "e": "此题主要考查审计分类的相关知识。审计分类有多种方式，A、B、C选项分别从内容、主体、与被审计单位关系角度进行分类，表述均正确；而按目的和业务性质不同审计分为合理保证审计和有限保证审计，并非仅目的，D表述不恰当。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128413", "t": 2, "q": "根据《公司法》和《证券法》，下列公司必须由会计师事务所进行审计的有（　）", "a": ["首次公开发行股票公司连续3年的财务报表", "不设监事会的公司的监事发现公司经营情况异常时", "上市公司财务报表", "一人有限责任公司编制的财务报表", "", ""], "r": "ACD", "e": "首次公开发行股票公司连续3年财务报表、上市公司财务报表按规定需审计；一人有限责任公司应编制财务报表并经会计师事务所审计。不设监事会公司的监事发现异常可调查，不是必须审计。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128414", "t": 2, "q": "如果审计项目组成员与审计客户存在雇佣关系，会计师事务所应当采取的措施可能包括（　）", "a": ["聘请专家协助审计", "对审计项目组以外的其他注册会计师复核已做的工作", "考虑修改审计业务的鉴证计划的适当性或必要性", "对审计业务进行质量控制复核", "", ""], "r": "BCD", "e": "审计项目组成员与审计客户存在雇佣关系会产生不利影响。采取聘请专家协助审计不能解决该不利影响；对审计项目组以外的其他注册会计师复核已做工作、考虑修改审计业务鉴证计划适当性或必要性、进行质量控制复核，都有助于降低因这种雇佣关系带来的不利影响。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128415", "t": 2, "q": "5.审计小组小王的妻子是丙公司的合伙人，以下防范措施能够消除威胁独立性情形的有（　）", "a": ["将小王调离项目组", "请其他注册会计师复核小王的审计工作底稿", "该事务所拒绝接受丙公司的审计业务", "审计报告意见段增加强调事项段", "", ""], "r": "AC", "e": "因小王妻子是丙公司合伙人，存在独立性威胁。A 调离小王可消除其自身影响；C 拒绝业务能从根本上避免独立性问题。B 复核不能消除本质威胁；D 增加强调事项段不能解决独立性问题。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128416", "t": 2, "q": "中国注册会计师执业准则体系包括（　）。", "a": ["鉴证业务准则", "相关服务准则", "职业道德基本准则", "会计师事务所质量控制准则", "", ""], "r": "ABD", "e": "中国注册会计师执业准则体系由鉴证业务准则、相关服务准则和会计师事务所质量控制准则构成。职业道德基本准则不属于执业准则体系。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128417", "t": 2, "q": "注册会计师在执行年度财务报表审计业务时，如果遇到下列情形仍然与客户发生了关联，则属于违背了诚信的基本原则（　）", "a": ["注册会计师发现客户提供的应收账款明细账遗漏了许多重要的往来单位", "注册会计师发现客户有一起正在诉讼的法律纠纷而且很可能导致重大违约赔款而未作任何披露", "注册会计师发现总经理对同一问题的陈述完全相反", "注册会计师发现客户提供的存货永续盘存表有明显的虚假", "", ""], "r": "ABCD", "e": "诚信原则要求注册会计师不得与有问题信息发生关联。ABCD选项中客户提供的信息都存在明显问题，注册会计师若仍与这些有问题的客户发生关联，就违背了诚信原则。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128418", "t": 2, "q": "当债务人符合（　）情况时，审计人员采用肯定式函证较好。", "a": ["欠款可能存在差错", "个别账户的欠款金额较大", "预计的差错率低", "审计人员认为有必要验证其真实性", "", ""], "r": "ABD", "e": "肯定式函证适用于欠款可能有差错、个别账户欠款金额大、审计人员认为需验证真实性等情况。预计差错率低适合用否定式函证。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128419", "t": 2, "q": "注册会计师在审计业务活动中，如果存在下列情形之一，将会以不实报告给利害关系人造成损失为由追究连带责任（　）", "a": ["明知被审计单位对重要事项的财务会计处理与国家有关规定相抵触，而不予指明", "被审计单位示意作不实报告，而不予拒绝", "与被审计单位恶意串通", "明知被审计单位对重要事项的财务会计处理直接损害利害关系人的利益，而予以隐瞒或作不实报告", "", ""], "r": "ABCD", "e": "ABCD选项情形均体现注册会计师主观上存在故意，与不实报告及给利害关系人造成损失有密切关联，所以要追究连带责任。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128420", "t": 2, "q": "银行存款的审查包括（　）。", "a": ["函证开户银行", "审阅银行存款日记账", "核对银行存款日记账和银行对账单", "审阅银行存款收付款凭证", "", ""], "r": "ABCD", "e": "ABCD选项均是银行存款审查的方法。函证开户银行可确认存款真实性；审阅银行存款日记账能查看其记录规范与完整性；核对银行存款日记账和银行对账单可发现未达账项等问题；审阅银行存款收付款凭证能核实业务真实性与合法性。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128421", "t": 2, "q": "下列情形属于产生自身利益威胁的有（　）", "a": ["在被审计单位拥有直接经济利益", "会计师事务所承接的审计业务没有采用或有收费安排", "审计项目组成员与审计客户进行雇佣协商", "审计项目负责人长期与被审计单位总裁发生个人借贷关系", "", ""], "r": "ACD", "e": "自身利益威胁指因经济利益等自身因素可能影响独立性的情况。A有直接经济利益会因自身利益影响审计独立性；C与客户雇佣协商会担心影响未来工作而可能妥协；D个人借贷有经济利益关联，也会产生自身利益威胁。B未采用或有收费安排通常不产生自身利益威胁。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128422", "t": 2, "q": "注册会计师审计方法的发展经历了以下哪些阶段（　）", "a": ["以重大错报风险的识别、评估、应对为审计工作主线的风险导向审计", "以内部控制测试为基础的抽样审计为特征的制度基础审计", "以被审计单位是否遵守了特定的法律、法规、程序或规则为特征的例规性审计", "以会计凭证和账簿的详细检查为特征的账项基础审计", "", ""], "r": "ABD", "e": "注册会计师审计方法发展经历账项基础审计、制度基础审计、风险导向审计阶段。账项基础审计是以会计凭证和账簿详细检查为特征；制度基础审计是以内部控制测试为基础的抽样审计；风险导向审计是以重大错报风险识别、评估、应对为主线。例规性审计不是审计方法发展阶段。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128423", "t": 2, "q": "审计小组小王的妻子是丙公司的合伙人，以下防范措施能够消除威胁独立性情形的有（　）", "a": ["该事务所拒绝接受丙公司的审计业务", "请其他注册会计师复核小王的审计工作底稿", "将小王调离项目组", "审计报告意见段增加强调事项段", "", ""], "r": "AC", "e": "因小王妻子是丙公司合伙人，存在对独立性的重大威胁，拒绝接受业务可从根源消除威胁，调离项目组也能避免小王参与审计影响独立性。B复核不能完全消除威胁，D增加强调事项段与消除独立性威胁无关。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128424", "t": 2, "q": "填制审计工作底稿在形式上应遵循的要求是（　）。", "a": ["标识一致", "格式规范", "要素齐全", "记录清晰", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128425", "t": 2, "q": "5．审计风险模型是由（　）组成。", "a": ["计划风险", "检查风险", "控制风险", "固有风险", "", ""], "r": "BCD", "e": "审计风险模型为审计风险=固有风险×控制风险×检查风险，所以该模型由检查风险、控制风险、固有风险组成。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128426", "t": 2, "q": "34.支付循环所涉及的主要凭证和会计记录有（　）。", "a": ["买方发票", "卖方对账单", "请购单", "付款凭证", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128427", "t": 2, "q": "在确定进一步审计程序的性质时，注册会计师应当考虑的主要因素有（　）", "a": ["不同的审计程序应对特定认定错报风险的效力", "认定层次重大错报风险的评估结果", "认定层次重大错报风险产生的原因", "各类交易、账户余额、列报的特征", "", ""], "r": "ABCD", "e": "确定进一步审计程序性质要综合多方面因素。评估的认定层次重大错报风险结果决定程序性质方向；产生原因能指引具体程序；各类交易等特征也影响程序；不同审计程序对特定认定错报风险的效力也是重要考量。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128428", "t": 2, "q": "在确定控制测试的范围时，注册会计师通常考虑的因素有（　）", "a": ["总体变异性", "在风险评估时拟信赖控制运行有效的程度", "控制的预期偏差", "控制的执行频率", "", ""], "r": "BCD", "e": "总体变异性是用于确定细节测试范围的因素，与控制测试范围无关。注册会计师确定控制测试范围要考虑拟信赖控制运行有效的程度、控制的预期偏差、控制执行频率等。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128429", "t": 2, "q": "根据现行的世界各国的审计准则来看，其内容大体上包括（　）。", "a": ["一般准则", "具体准则", "报告准则", "工作准则", "", ""], "r": "ACD", "e": "审计准则内容大体包括一般准则、工作准则和报告准则。一般准则涉及审计人员的专业胜任能力等基本要求；工作准则是审计过程中的操作规范；报告准则规定审计报告的编制等要求。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128430", "t": 2, "q": "7.注册会计师有可能承担的行政责任包括（　）", "a": ["暂停执业", "没收违法所得", "警告", "吊销注册会计师证书", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128431", "t": 2, "q": "在确定进一步审计程序范围时，注册会计师应当考虑的主要因素有（　）", "a": ["审计程序与特定风险的相关性", "评估的认定层次重大错报风险", "计划获取的保证程度", "可容忍的错报或偏差率", "", ""], "r": "ABCD", "e": "审计程序范围受多种因素影响，与特定风险相关性越强、重大错报风险越高、计划获取保证程度越高、可容忍的错报或偏差率越低，程序范围通常越大。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128432", "t": 2, "q": "假设注册会计师对长海公司2009年1－10月某项控制的运行有效性进行了测试。为了得到该项控制在2009年度是否均运行有效的结论，注册会计师可以实施的审计程序有（　）", "a": ["对该项控制在2009年11－12月的运行有效性进行补充测试", "获取该项控制在2009年11－12月变化情况的审计证据", "测试长海公司对控制的监督", "向长海公司管理层询问2009年11－12月该项控制的运行情况", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128433", "t": 2, "q": "编制审计报告一般需要经过以下步骤（　）。", "a": ["撰写审计报告", "调整被审计单位的会计报表", "确定审计报告意见的类型和措辞", "整理和分析审计工作底稿", "", ""], "r": "ACD", "e": "编制审计报告，首先要整理分析审计工作底稿获取证据，再确定报告意见类型和措辞，之后撰写报告。而调整被审计单位会计报表并非编制审计报告的步骤。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128434", "t": 2, "q": "管理建议书与审计报告的区别主要表现在（　）。", "a": ["责任不同", "目的不同", "对象不同", "影响程度不同", "", ""], "r": "ABCD", "e": "管理建议书是注册会计师针对审计过程中注意到的、可能导致被审计单位财务报表产生重大错报的内部控制重大缺陷提出的书面建议，审计报告是对财务报表审计后发表审计意见。二者在责任上，管理建议无法定责任，审计报告有法定责任；目的上，管理建议为改进内控，审计报告是对报表发表意见；对象上，管理建议给被审计单位管理层，审计报告给报表使用者；影响程度上，前者影响内控，后者影响报表使用决策等。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128435", "t": 2, "q": "对于审计中发现的核算误差在确定建议调整和不建议调整时，应当考虑的因素是（　）。", "a": ["核算误差的数量", "核算误差的性质", "核算误差的金额", "核算误差产生的原因", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128436", "t": 2, "q": "题目4.注册会计师职业道德明确包含以下基本原则（　）", "a": ["职业行为原则和保密原则", "独立、客观、公正和廉洁", "专业胜任能力和应有的关注", "诚信、独立、客观", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128437", "t": 2, "q": "在对被审计单位计提的固定资产减值准备进行审计时，下列各项中，注册会计师应当确定为审计目标的有（　）。", "a": ["固定资产减值准备的计提金额是否充分", "固定资产减值准备期末余额是否正确", "固定资产减值准备增减变动的记录是否完整", "固定资产减值准备的计提方法是否适当", "", ""], "r": "ABCD", "e": "审计固定资产减值准备时，需确认计提方法是否合适，以保证计提有合理依据；计提金额是否充分需考量，防止少提或多提；增减变动记录要完整，以便准确追踪；期末余额正确是基本要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128438", "t": 2, "q": "检查折旧的计提时，注册会计师应注意（　）。", "a": ["检查本期固定资产增减变动时有关折旧的会计处理是否符合规定", "结合固定资产审计，检查其折旧的计提是否正确无误", "计算复核本期折旧费用的计提是否正确", "检查本期固定资产增减变动时折旧费用的计算是否正确", "", ""], "r": "ABCD", "e": "ABCD四个选项分别从会计处理规定、与固定资产审计结合、折旧费用计算复核、增减变动时折旧费用计算等方面对折旧计提检查要点进行了阐述。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128439", "t": 2, "q": "会计师事务所在违反下列规定和原则，出具虚假记载、误导性陈述或者重大遗漏的审计报告将会认定为不实报告（　）", "a": ["内部控制规范", "法律法规", "诚信公允原则", "执业准则和规则", "", ""], "r": "BCD", "e": "会计师事务所出具不实报告是指违反法律法规、执业准则和规则以及诚信公允原则，出具虚假记载等审计报告。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128440", "t": 2, "q": "我国独立审计基本准则包括（　）。", "a": ["独立审计实务公告", "独立审计准则", "独立审计具体准则", "执业规范指南", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128441", "t": 2, "q": "民间审计人员的法律责任按其性质可分为（　）", "a": ["普通过失责任", "民事责任", "刑事责任", "重大过失责任", "", ""], "r": "BC", "e": "民间审计人员法律责任按性质分为民事、刑事和行政责任，A、D是按过失程度分类。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528698778128442", "t": 2, "q": "3、样本设计需考虑的因素有（　）", "a": ["抽样方法", "抽样单位", "审计目的", "样本量", "", ""], "r": "ABCD", "e": "样本设计要围绕审计目的进行，抽样方法、抽样单位和样本量都要为实现审计目的服务，它们都是样本设计需考虑的因素。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344256", "t": 3, "q": "14．内部审计具有权威性和独立性。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "内部审计是一种独立、客观的确认和咨询活动，其目的是增加价值和改善组织的运营。它在组织内部相对独立地开展工作，有一定的权限对组织的各项活动进行审查和评价，具备独立性。同时，其工作成果和建议对组织管理层有重要参考价值，在组织内部具有权威性。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344257", "t": 3, "q": "审计的职能不是一成不变的，它是随着经济的发展而发展变化的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计职能会受经济环境、社会需求等因素影响，会随着经济发展而演变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344258", "t": 3, "q": "审计证据的适当性是指审计证据的数量能足以证明审计人员的审计意见，是审计人员为形成审计意见所需审计证据的最低数量要求。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "题干描述的是审计证据的充分性，而审计证据的适当性是对审计证据质量的衡量，包括相关性和可靠性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344259", "t": 3, "q": "国家审计机关指导监督内部审计的工作。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "国家审计机关对依法属于审计机关审计监督对象的单位的内部审计工作进行业务指导和监督，所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344260", "t": 3, "q": "为了确定短期借款的实有数，审计人员应在期末对余额较大或认为重要的短期借款，向银行或其他债权人函证。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "函证是确认短期借款实有数的有效方法，审计人员对期末余额较大或重要的短期借款向银行等债权人函证，可获取可靠证据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344261", "t": 3, "q": "内部控制是高信赖程度，审计人员可以较多地信赖、利用被审计单位的内部控制，在实施审计时可相应减少实质性测试的数量和范围。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "内部控制信赖程度高，说明其有效，能合理保证财务信息可靠等，审计人员可多利用内控，减少实质性测试量和范围。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344262", "t": 3, "q": "审计人员在证实投资证券的真实性时，应实地盘点投资资产，并函证资产负债表日被托管的有价证券。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计人员为证实投资证券真实性，实地盘点投资资产能直接验证实物存在，函证被托管有价证券可确认其实际状态和所有权等情况，做法合理。", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344263", "t": 3, "q": "不论是国家审计、内部审计还是社会审计在进行审计工作前，都必须与被审计单位签订审计业务约定书。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国家审计是代表国家对政府部门、企事业单位等进行监督，是法定审计，无需与被审计单位签订审计业务约定书；内部审计是单位内部的监督活动，也不需要签订该约定书；只有社会审计在开展业务前要与被审计单位签订审计业务约定书。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344264", "t": 3, "q": "签署审计业务约定书的目的是为了明确约定双方的责任与义务，促使双方遵守约定事项并加强合作，以保护会计师事务所的利益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "签署审计业务约定书不仅保护会计师事务所利益，也保护被审计单位利益，目的是明确双方责任与义务，加强合作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344265", "t": 3, "q": "审计人员进驻被审计单位后可立即进行符合性测试。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计人员进驻被审计单位后，要先了解和评价内部控制，确定是否值得进行符合性测试等，不能立即进行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344266", "t": 3, "q": "7．报送审计主要适用于国家审计机关对大型企业的审计。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "报送审计主要适用于对规模较小、业务简单且资料能报送的单位审计，国家审计机关对大型企业审计一般采用就地审计，所以本题说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344267", "t": 3, "q": "审计就是查账。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计不仅仅是查账，查账只是审计的一种手段和内容，审计还包括对经济活动的合法性、效益性等多方面的审查和评价。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344268", "t": 3, "q": "注册会计师在进行审计之前，要由其所在的会计师事务所下达审计通知书。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计通知书由委托人（如被审计单位的上级主管部门等）下达，而非会计师事务所。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344269", "t": 3, "q": "在被审计单位存在重大贪污盗窃和严重违反财经纪律的行为时，应当采用详查法。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "详查法能全面、详细审查会计资料，当被审计单位存在重大贪污盗窃和严重违反财经纪律行为时，为精准发现问题，采用详查法是合适的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344270", "t": 3, "q": "如果将其他业务收入记录为主营业务收入，则导致交易分类的错误，就违反了分类的目标。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "其他业务收入和主营业务收入核算内容不同，将其他业务收入记为主营业务收入，属于交易分类错误，违背了分类目标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344271", "t": 3, "q": "审计人员在提供专业服务时，可以代行被审计单位的管理决策职能。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计人员的职责是对被审计单位进行独立、客观的审查和评价，保持独立性是审计工作的基本要求。代行被审计单位管理决策职能会破坏其独立性，影响审计结果的客观性和公正性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344272", "t": 3, "q": "8．现代审计的主要目标是查错防弊。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现代审计目标已从查错防弊发展为对财务报表的合法性、公允性发表审计意见等。所以“现代审计的主要目标是查错防弊”说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344273", "t": 3, "q": "期后事项的审核应在整个审计工作即将结束前完成。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "期后事项审核是在审计工作接近尾声时进行，此时审计人员已完成大部分实质性测试，能综合考虑审计证据来判断期后事项对财务报表的影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344274", "t": 3, "q": "3．审计报告使用人是促进建立审计准则的主要因素。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344275", "t": 3, "q": "13．调节法只包括对未达账项的调节。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "调节法不只是对未达账项的调节，它还可用于对其他方面进行调节，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344276", "t": 3, "q": "有理由相信欠款可能会存在争议、差错或问题时，采用肯定式函证较好。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当有理由相信欠款可能存在争议、差错或问题时，肯定式函证能让对方明确回应，更有助于确认欠款情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344277", "t": 3, "q": "无法表示意见意味着注册会计师无法接受委托。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "无法表示意见是注册会计师在审计后，因审计范围受到重大限制等原因无法获取充分、适当审计证据，从而对财务报表整体不能发表审计意见，并非无法接受委托。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344278", "t": 3, "q": "6．财政、银行所从事的经济监督活动，同样可称为审计。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计有其特定的定义和规范流程，是由专职机构和人员依法对被审计单位的财政、财务收支及其有关经济活动的真实性、合法性、效益性进行审查评价的独立性经济监督活动。财政、银行的经济监督活动与审计在主体、方法、目的等方面有差异，不能简单等同。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344279", "t": 3, "q": "4．收款员与记账员不能为同一人属于实物控制范畴。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这属于职责分离控制，不是实物控制范畴。实物控制主要是对实物资产的保护等。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344280", "t": 3, "q": "识别被审计单位及其环境在各方面与以前期间相比发生的重大变化，对于充分了解被审计单位及其环境、识别和评估重大错报风险都是重要的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "了解被审计单位及其环境的变化，能让注册会计师更好地掌握情况，有助于识别和评估重大错报风险。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344281", "t": 3, "q": "通过对书面资料的阅读和审查而取得审计证据的方法称为审阅法。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审阅法就是审计人员对书面资料进行阅读和审查以获取审计证据的方法。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344282", "t": 3, "q": "9．内部审计报告对外可起公正作用。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "内部审计主要是对本单位及其所属单位的财政财务收支、经济活动等进行监督和评价，是一种内部监督机制。而对外起公正作用通常是社会审计（注册会计师审计）的功能。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344283", "t": 3, "q": "如果评估的重大错报风险为低水平，且控制测试的结果表明被审计单位的内部控制执行有效，则注册会计师可以不必实施实质性程序。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "无论评估的重大错报风险多低、内部控制多有效，注册会计师都必须实施实质性程序，这是审计准则的强制要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344284", "t": 3, "q": "审计依据包含审计准则。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "审计准则是审计人员在实施审计工作时必须遵守的行为规范，而审计依据是对所查明的事实进行评价和判断，据以提出审计意见和建议，作出审计结论的客观标准，审计准则是审计依据的重要组成部分。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344285", "t": 3, "q": "将2009年的销售收入提前到2008年入账，违反了交易和事项的完整性目标。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该做法是把本应在2009年的收入记到2008年，这是记录时间错误，并非遗漏，违反的是截止认定，而非完整性目标。完整性目标强调的是应记录的交易和事项均已记录。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344286", "t": 3, "q": "在审计过程中，被审计单位的财务报表中，尚未更正错报的汇总数低于判断的重要性水平，则该财务报表不能接受。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "若尚未更正错报汇总数低于重要性水平，意味着财务报表整体不存在重大错报，该财务报表是可以接受的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344287", "t": 3, "q": "在对被审计单位的内部控制进行符合性测试的基础上，应进一步对被审计事项进行实质性测试。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在审计过程中，通常先对内部控制进行符合性测试，评估其有效性，之后基于此进一步开展实质性测试以获取更直接的审计证据，确定被审计事项是否存在重大错报。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528699797344288", "t": 3, "q": "应付账款均不需要函证，这是因为函证不能保证查出未记录的应付账款，况且注册会计师能够取得购货发票等外部凭证来证实应付账款的余额。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。一般情况下，并非所有应付账款都不需要函证。虽然函证不能保证查出未记录的应付账款，且有购货发票等外部凭证，但对于重大或异常的应付账款项目，函证还是必要的审计程序，可获取更直接的外部证据来验证其真实性和准确性。", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
</html>
