用途，预计使用寿命为10年，采用直线法摊销。假定不考虑其他因素，该项无形资产的有关事项影响2008年度损益的金额为（　）万元。（已知4年期利率为6％的年金现值系数为3.4651，计算结果保留两位小数）", "a": ["106.98", "177.98", "113.6", "112.58", "", ""], "r": "D", "e": "本题可先计算无形资产的入账价值，再分别计算未确认融资费用的摊销额和无形资产的摊销额，最后将两者相加得到影响2008年度损益的金额。### 步骤一：计算无形资产的入账价值根据题意，无形资产采用分期付款方式支付价款，每年末付款200万元，4年付清，银行同期贷款利率为「test/yiwen_img/importSubject/2034528622404046848.png」，4年期利率为「test/yiwen_img/importSubject/2034528622404046848.png」的年金现值系数为3.4651。则无形资产购买价款的现值「test/yiwen_img/importSubject/2034528622483738624.png」（万元）另以现金支付相关税费16.98万元，所以无形资产的入账价值=693.02 + 16.98 = 710（万元）未确认融资费用=800 - 693.02 = 106.98（万元）### 步骤二：计算2008年未确认融资费用的摊销额2008年未确认融资费用的摊销额=期初摊余成本「test/yiwen_img/importSubject/2034528622592790528.png」实际利率「test/yiwen_img/importSubject/2034528622664093696.png」（万元）未确认融资费用的摊销额计入财务费用，会影响当期损益。### 步骤三：计算2008年无形资产的摊销额无形资产入账价值为710万元，预计使用寿命为10年，采用直线法摊销，则2008年无形资产的摊销额「test/yiwen_img/importSubject/2034528622789922816.png」（万元）无形资产的摊销额计入管理费用，会影响当期损益。 ### 步骤四：计算该项无形资产的有关事项影响2008年度损益的金额该项无形资产的有关事项影响2008年度损益的金额=未确认融资费用的摊销额+无形资产的摊销额= 41.58 + 71 = 112.58（万元）综上，答案是D选项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789540", "t": 1, "q": "采用分步法计算产品成本时，若需要进行成本还原，通常是因为采用了？", "a": ["平行结转分步法", "品种法", "逐步综合结转分步法", "逐步分项结转分步法", "", ""], "r": "C", "e": "逐步综合结转分步法会将上一步骤半成品成本综合转入下一步骤，使得产成品成本中包含综合成本，所以需要成本还原。平行结转分步法不计算半成品成本无需还原；品种法是单步骤生产成本计算方法，不存在成本还原；逐步分项结转分步法已将成本按项目分别结转，也无需还原。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789541", "t": 1, "q": "关于或有事项，下列说法中正确的是（　）。", "a": ["企业应当将未来经营亏损确认预计负债", "待执行合同变成亏损合同的，应确认为预计负债", "待执行合同变成亏损合同的，该亏损合同产生的义务满足或有事项确认预计负债条件的，应确认为预计负债", "待执行合同属于或有事项", "", ""], "r": "C", "e": "未来经营亏损不符合预计负债确认条件，A错误；待执行合同变成亏损合同，且该亏损合同产生的义务满足预计负债确认条件才确认为预计负债，B不完整；待执行合同不是或有事项，只有变成亏损合同才可能涉及或有事项，D错误。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789542", "t": 1, "q": "在借贷记账法下，“生产成本”账户的期末余额一般在哪一方？", "a": ["贷方", "借方", "借方或贷方", "无余额", "", ""], "r": "B", "e": "“生产成本”是成本类账户，借方登记增加额，期末若有在产品，会有未完工产品的成本，该成本在“生产成本”账户借方体现，所以期末余额一般在借方。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789543", "t": 1, "q": "企业销售商品发生的商业折扣，在会计核算时应如何处理？", "a": ["直接冲减主营业务收入", "不做账务处理", "计入销售费用", "计入财务费用", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789544", "t": 1, "q": "在借贷记账法下，所有者权益类账户的期末余额计算公式是（　）", "a": ["期末余额=期初贷方余额+本期借方发生额-本期贷方发生额", "期末余额=期初借方余额+本期贷方发生额-本期借方发生额", "期末余额=期初贷方余额+本期贷方发生额-本期借方发生额", "期末余额=期初借方余额+本期借方发生额-本期贷方发生额", "", ""], "r": "C", "e": "所有者权益类账户贷方登记增加，借方登记减少，期末余额一般在贷方。其期末余额计算是期初贷方余额加上本期贷方发生额（增加），再减去本期借方发生额（减少）。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789545", "t": 1, "q": "采用分步法核算产品成本时，若采用平行结转分步法，各步骤成本计算单中的生产费用应在（　）之间进行分配。", "a": ["该步骤完工半成品与广义在产品", "该步骤完工半成品与月末在产品", "最终完工产成品与广义在产品", "最终完工产成品与月末在产品", "", ""], "r": "C", "e": "平行结转分步法下，各步骤的生产费用要在最终完工产成品与广义在产品之间分配。广义在产品是指尚在本步骤加工中的在产品、本步骤已完工转入半成品库的半成品、已从半成品库转到以后各步骤进一步加工但尚未最终完成的在产品。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789546", "t": 1, "q": "资产按照现在购买相同或者相似资产所需支付的现金或者现金等价物的金额计量的会计计量属性是（　）。", "a": ["现值", "历史成本", "重置成本", "公允价值", "", ""], "r": "C", "e": "重置成本就是按现在购买相同或相似资产所需支付现金或现金等价物金额计量。答案为C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789547", "t": 1, "q": "持有交易性金融资产期间被投资单位宣告发放现金股利或在资产负债表日按债券票面利率计算利息时，借记\"应收股利\"或\"应收利息\"科目，贷记的会计科目是（　）。", "a": ["交易性金融资产", "公允价值变动损益", "投资收益", "资本公积", "", ""], "r": "C", "e": "持有交易性金融资产期间获得的现金股利或利息属于投资收益，所以借记“应收股利”或“应收利息”，贷记“投资收益”。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789548", "t": 1, "q": "资产负债表中，\"存货\"项目不包括？", "a": ["在途物资", "委托代销商品", "工程物资", "发出商品", "", ""], "r": "C", "e": "存货是企业日常活动中持有以备出售的产成品或商品、处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料和物料等。工程物资是用于建造固定资产等工程的物资，不属于存货范畴。而在途物资、委托代销商品、发出商品都属于存货。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789549", "t": 1, "q": "下列影响营业利润的项目是（　）。", "a": ["未确认融资费用", "所得税费用", "公允价值变动损益", "营业外收入", "", ""], "r": "C", "e": "营业利润=营业收入 - 营业成本 - 税金及附加 - 销售费用 - 管理费用 - 研发费用 - 财务费用 + 其他收益 + 投资收益（ - 投资损失）+ 净敞口套期收益（ - 净敞口套期损失）+ 公允价值变动收益（ - 公允价值变动损失） - 信用减值损失 - 资产减值损失 + 资产处置收益（ - 资产处置损失）。选项A未确认融资费用是负债类科目；选项B所得税费用影响净利润；选项D营业外收入影响利润总额。而公允价值变动损益会影响营业利润。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789550", "t": 1, "q": "现金流量表中\"销售商品、提供劳务收到的现金\"项目不包括的内容是（　）", "a": ["本期销售商品、提供劳务收到的现金", "本期收到的增值税销项税额退回", "前期销售商品、提供劳务本期收到的现金", "本期预收的账款", "", ""], "r": "B", "e": "“销售商品、提供劳务收到的现金”包含销售及前期销售本期收款和本期预收账款，而增值税销项税额退回不在此列。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789551", "t": 1, "q": "在借贷记账法下，收入类账户的结构特点是？", "a": ["借方登记减少额，贷方登记增加额，期末无余额", "借方登记增加额，贷方登记减少额，期末余额在借方", "借方登记增加额，贷方登记减少额，期末无余额", "借方登记减少额，贷方登记增加额，期末余额在贷方", "", ""], "r": "A", "e": "收入类账户性质与资产相反，资产借方记增加，收入类是贷方记增加、借方记减少，且期末要将收入结转到本年利润，所以无余额。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789552", "t": 1, "q": "现金流量表中，“购建固定资产、无形资产和其他长期资产支付的现金”属于？", "a": ["不涉及现金流量的项目", "经营活动产生的现金流量", "筹资活动产生的现金流量", "投资活动产生的现金流量", "", ""], "r": "D", "e": "购建固定资产等长期资产是企业的投资行为，其相关现金支付应归为投资活动产生的现金流量。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789553", "t": 1, "q": "下列关于《企业会计准则》中会计基本假设的说法，正确的是？", "a": ["持续经营假设下企业可以随意改变经营方向", "会计主体必然是法律主体", "货币计量假设意味着企业只能使用人民币记账", "会计分期是权责发生制的基础", "", ""], "r": "D", "e": "持续经营下企业应按既定目标持续经营，不能随意改方向，A错；会计主体不一定是法律主体，B错；货币计量不意味着只能用人民币记账，也可用外币等，C错；会计分期产生了本期与非本期的区别，是权责发生制基础，D对。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789554", "t": 1, "q": "利润表中\"研发费用\"项目数据不来源于？", "a": ["计入管理费用的自行开发无形资产摊销", "开发支出中费用化部分", "销售费用中的研发支出", "管理费用中的研发费用明细", "", ""], "r": "C", "e": "研发费用主要来自管理费用中研发相关及开发支出费用化部分。销售费用中的研发支出不属于利润表“研发费用”数据来源。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789555", "t": 1, "q": "以下适用于《企业会计准则第12号——债务重组》准则规范的债务重组事项的是（　）。", "a": ["企业破产清算时的债务重组", "持续经营条件下的债务重组", "企业兼并中的债务重组", "企业进行公司制改组时的债务重组", "", ""], "r": "B", "e": "《企业会计准则第12号——债务重组》规范的是持续经营条件下的债务重组。破产清算、企业兼并、公司制改组时的债务重组不适用该准则。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789556", "t": 1, "q": "下列项目中，计算为生产产品而持有的材料的可变现净值时，会影响其可变现净值的因素是（　）。", "a": ["材料的售价", "材料的账面成本", "估计发生的销售材料的费用及相关税费", "估计发生的销售产品的费用及相关税费", "", ""], "r": "D", "e": "为生产产品而持有的材料，其可变现净值=产品估计售价 - 至完工估计将要发生的成本 - 估计销售产品的费用及相关税费。所以影响其可变现净值的是估计发生的销售产品的费用及相关税费。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789557", "t": 1, "q": "分步法适用于（　）", "a": ["大量大批多步骤生产", "大量大批单步骤生产", "单步骤生产", "单件小批生产", "", ""], "r": "A", "e": "分步法是按产品的生产步骤归集生产费用、计算产品成本的方法，适用于大量大批多步骤生产。单步骤生产、大量大批单步骤生产一般用品种法，单件小批生产适用分批法。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789558", "t": 1, "q": "债务人以现金、非现金资产、债务转为资本方式的组合清偿某项债务的一部分，并对该项债务的另一部分以修改其他债务条件进行债务重组的，对上述支付方式应考虑的前后顺序是（　）。", "a": ["现金、债务转为资本方式、修改其他债务条件、非现金资产", "现金、非现金资产、修改其他债务条件、债务转为资本方式", "现金、非现金资产、债务转为资本方式、修改其他债务条件", "现金、债务转为资本方式、非现金资产、修改其他债务条件", "", ""], "r": "C", "e": "在多种方式组合的债务重组中，通常先以现金清偿，再以非现金资产清偿，接着是债务转为资本，最后是修改其他债务条件。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789559", "t": 1, "q": "记账后发现记账凭证填写的会计科目无误，只是所登记的金额大于应记金额，应采用的错账更正方法为（　）。", "a": ["红字更正法", "划线更正法", "涂改法", "补充登记法", "", ""], "r": "A", "e": "记账凭证科目无误，金额多记，应用红字更正法冲销多记金额。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789560", "t": 1, "q": "下列因素中，不会影响到固定资产账面价值的有（　）", "a": ["固定资产的修理费用", "固定资产的改良支出", "当期计提的固定资产的减值", "当期计提的固定资产的折旧", "", ""], "r": "A", "e": "固定资产账面价值=固定资产原值 - 累计折旧 - 固定资产减值准备。A选项固定资产修理费用通常计入当期损益，不影响账面价值；B选项改良支出会增加固定资产价值，影响账面价值；C选项计提减值会使账面价值减少；D选项计提折旧会使账面价值减少。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789561", "t": 1, "q": "\"应付账款\"账户的期初余额为贷方1500元，本期贷方发生额3000元，借方发生额2500元，则该账户的期末余额为（　）元。", "a": ["借方2000", "贷方2000", "借方1000", "贷方1000", "", ""], "r": "B", "e": "应付账款是负债类账户，贷方登记增加，借方登记减少，期末余额在贷方。计算公式为期末贷方余额=期初贷方余额+本期贷方发生额 - 本期借方发生额，即1500 + 3000 - 2500 = 2000（元）。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789562", "t": 1, "q": "关于投资性房地产后续计量模式的转换，下列说法正确的是（　）。", "a": ["已经采用成本模式计量的投资性房地产，不得从成本模式转为公允价值模式", "成本模式转为公允价值模式的，应当作为会计估计变更", "已经采用公允价值模式计量的投资性房地产，不得从公允价值模式转为成本模式", "企业对投资性房地产的计量模式可以随意选择", "", ""], "r": "C", "e": "投资性房地产计量模式变更有规定，成本可转公允但属会计政策变更，而公允不能转成本，且计量模式不能随意选。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789563", "t": 1, "q": "资产负债表中，\"应收票据\"项目应根据\"应收票据\"科目的期末余额减去（　）后的净额填列。", "a": ["资产减值损失", "累计摊销", "存货跌价准备", "坏账准备", "", ""], "r": "D", "e": "“应收票据”项目要考虑可能的坏账情况，应根据“应收票据”科目的期末余额减去坏账准备后的净额填列。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789564", "t": 1, "q": "采用品种法计算产品成本时，一般定期（每月月末）计算产品成本，如果月末有在产品，要将（　）在完工产品和在产品之间进行分配。", "a": ["期初在产品成本", "期初在产品成本和本期发生的生产费用之和", "本期发生的生产费用", "本期发生的生产费用减去期初在产品成本", "", ""], "r": "B", "e": "品种法下，若月末有在产品，需将累计的生产耗费在完工产品和在产品间分配，累计生产耗费就是期初在产品成本和本期发生的生产费用之和。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789565", "t": 1, "q": "甲企业采用资产负债表债务法核算所得税，2008年以前适用的所得税税率为33％，从2008年1月1日起适用的所得税税率改为25％。2008年年初库存商品的账面余额为40万元，已提存货跌价准备5万元。2008年末库存商品的账面余额为50万元，补提存货跌价准备5万元。假定无其他纳税调整事项，则2008年末\"递延所得税资产\"的期末余额为（　）万元。", "a": ["2.5", "1.25", "1.65", "3.3", "", ""], "r": "A", "e": "本题可先确定存货跌价准备形成的可抵扣暂时性差异，再根据所得税税率计算“递延所得税资产”的期末余额。### 步骤一：确定可抵扣暂时性差异可抵扣暂时性差异是指在确定未来收回资产或清偿负债期间的应纳税所得额时，将导致产生可抵扣金额的暂时性差异。存货的账面价值是指存货的账面余额减去存货跌价准备后的金额。本题中2008年末存货跌价准备余额为年初已提的5万元加上补提的5万元，即5 + 5 = 10万元，这10万元就是存货跌价准备形成的可抵扣暂时性差异。### 步骤二：计算“递延所得税资产”的期末余额“递延所得税资产”的期末余额=可抵扣暂时性差异×适用的所得税税率。已知2008年适用的所得税税率为「test/yiwen_img/importSubject/2034528622886391808.png」，可抵扣暂时性差异为10万元，将其代入公式可得：「test/yiwen_img/importSubject/2034528622966083584.png」（万元）综上，答案是A选项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789566", "t": 1, "q": "下列事项中，不属于或有事项的是（　）。", "a": ["未决诉讼", "未来可能发生的经营亏损", "亏损合同", "产品质量保证", "", ""], "r": "B", "e": "或有事项是过去的交易或事项形成的，其结果须由某些未来事项的发生或不发生才能决定的不确定事项。未来可能发生的经营亏损不是过去交易或事项形成的，不属于或有事项。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789567", "t": 1, "q": "反映企业在一定会计期间经营成果的报表是（　）。", "a": ["所有者权益变动表", "利润表", "资产负债表", "现金流量表", "", ""], "r": "B", "e": "利润表是反映企业在一定会计期间经营成果的报表。所有者权益变动表反映所有者权益各组成部分当期增减变动情况；资产负债表反映企业在某一特定日期财务状况；现金流量表反映企业在一定会计期间现金和现金等价物流入和流出情况。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789568", "t": 1, "q": "A公司资产负债表日\"长期应付款\"总账科目余额为850万元，其中将于一年内到期的长期应付款为80万元，一年以后到期的长期应付款对应的\"未确认融资费用\"科目余额为43万元，不考虑其他因素，则A公司期末资产负债表中\"长期应付款\"项目的金额为（　）万元。", "a": ["727", "807", "770", "740", "", ""], "r": "A", "e": "“长期应付款”项目应根据“长期应付款”总账科目余额减去“未确认融资费用”科目余额，再减去将于一年内到期的长期应付款后的金额填列。即850 - 43 - 80 = 727（万元）。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789569", "t": 1, "q": "根据《企业会计准则第22号——金融工具确认和计量》的规定，下列交易性金融资产的后续计量表述中，正确的是（　）。", "a": ["按照摊余成本进行后续计量", "按照公允价值进行后续计量，公允价值变动计入当期投资收益", "按照公允价值进行后续计量，公允价值变动计入当期公允价值变动损益", "按照公允价值进行后续计量，变动计入资本公积", "", ""], "r": "C", "e": "交易性金融资产按公允价值后续计量，其公允价值变动计入当期公允价值变动损益。A选项摊余成本用于债权投资等；B选项公允价值变动应计入公允价值变动损益而非投资收益；D选项变动不计入资本公积。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789570", "t": 1, "q": "《企业会计准则》规定的会计信息质量要求中，要求企业提供的会计信息应当与投资者等财务报告使用者的经济决策需要相关的是？", "a": ["可理解性", "相关性", "可比性", "可靠性", "", ""], "r": "B", "e": "相关性要求企业提供的会计信息应当与投资者等财务报告使用者的经济决策需要相关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789571", "t": 1, "q": "关于记账凭证账务处理程序，下列说法不正确的是（　）。", "a": ["简单明了，易于理解，总分类账可以较详细地反映经济业务的发生情况", "登记总分类账的工作量较大", "适用于规模较大、经济业务量较多的单位", "根据记账凭证逐笔登记总分类账，是最基本的账务处理程序", "", ""], "r": "C", "e": "记账凭证账务处理程序适合规模小、经济业务较少单位，C选项说适用于规模较大、业务量多的单位错误。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789572", "t": 1, "q": "下列各项，不应通过\"固定资产清理\"科目核算的有（　）。", "a": ["出售的固定资产", "毁损的固定资产", "报废的固定资产", "盘亏的固定资产", "", ""], "r": "D", "e": "“固定资产清理”用于核算因出售、报废、毁损等原因减少的固定资产。而盘亏的固定资产通过“待处理财产损溢”核算。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789573", "t": 1, "q": "在会计要素计量属性中，按照当前市场条件，重新取得同样一项资产所需支付的现金或现金等价物金额的计量属性是？", "a": ["重置成本", "可变现净值", "公允价值", "历史成本", "", ""], "r": "A", "e": "重置成本就是按当前市场条件重新取得同样资产需支付的现金或现金等价物金额。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789574", "t": 1, "q": "自营方式建造固定资产，下列说法不正确的有（　）。", "a": ["由于正常原因造成的单项工程的或者单位工程的报废或毁损，减去残料价值或者过失人、保险公司的赔款后的净损失，直接计入营业外支出", "如为非正常原因造成的报废或毁损，应将其净损失直接计入当期营业外支出", "盘盈、盘亏、报废的工程物资，减去保险公司、过失人的赔偿后的差额，如果项目已经完工的（不属于筹建期间），计入营业外支出或者营业外收入", "盘盈、盘亏、报废的工程物资，减去保险公司、过失人的赔偿后的差额，如果项目尚未完工的，计入或冲减在建工程的成本", "", ""], "r": "A", "e": "正常原因造成的单项工程或单位工程报废或毁损，净损失应计入建造成本，而非直接计入营业外支出，A说法错误；B、C、D说法均正确。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789575", "t": 1, "q": "下列关于分批法的表述，错误的是？", "a": ["一般不需要在完工产品和在产品之间分配费用", "成本计算单按产品批别设置", "成本计算期与会计报告期一致", "适用于单件、小批生产的企业", "", ""], "r": "C", "e": "分批法成本计算期与产品生产周期一致，和会计报告期不一致，C选项错误。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789576", "t": 1, "q": "下列属于利润表项目的是？", "a": ["实收资本", "固定资产", "应付账款", "营业收入", "", ""], "r": "D", "e": "利润表反映企业一定会计期间经营成果，营业收入是经营成果相关项目。实收资本在资产负债表所有者权益项目；固定资产是资产负债表资产项目；应付账款是资产负债表负债项目。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789577", "t": 1, "q": "对本单位财务会计报告的真实性和完整性负责的是（　）。", "a": ["记账会计人员", "会计机构负责人", "总会计师", "单位负责人", "", ""], "r": "D", "e": "单位负责人对本单位的会计工作和会计资料的真实性、完整性负责。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789578", "t": 1, "q": "下列项目中属于待摊费用的是（　）。", "a": ["租入固定资产的租金", "固定资产的修理费", "预付的保险费", "短期借款利息", "", ""], "r": "C", "e": "待摊费用是指已经支出但应由本期和以后各期分别负担的各项费用。预付的保险费是预先支付，在保险期间各期分摊，符合待摊费用特点。租入固定资产租金一般按租赁期支付，固定资产修理费通常发生时计入当期费用，短期借款利息一般按规定时间计提支付，都不属于待摊费用性质。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789579", "t": 1, "q": "下列各项中，属于表现企业资金运动显著变动状态的会计要素有（　）。", "a": ["负债", "所有者权益", "资产", "收入", "", ""], "r": "D", "e": "企业资金运动显著变动状态指的是经营成果方面。收入是反映企业经营成果的会计要素，而负债、所有者权益、资产是反映企业财务状况的会计要素。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789580", "t": 1, "q": "采用平行结转分步法，不论半成品是在各生产步骤之间直接结转还是通过半成品库收发，都（　）。", "a": ["通过自制半成品科目进行总分类核算", "不通过自制半成品科目进行总分类核算", "不通过产成品科目进行总分类核算", "通过产成品科目进行总分类核算", "", ""], "r": "B", "e": "平行结转分步法下，不计算各步骤所产半成品成本，也不计算各步骤所耗上一步骤的半成品成本，所以不论半成品如何流转，都不通过“自制半成品”科目进行总分类核算。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789581", "t": 1, "q": "《企业会计准则》要求企业对相同或者相似的交易或者事项，应当采用一致的会计政策，不得随意变更，这体现的会计信息质量要求是？", "a": ["谨慎性", "及时性", "重要性", "可比性", "", ""], "r": "D", "e": "可比性要求企业提供的会计信息应当相互可比，同一企业不同时期发生的相同或相似交易事项，应采用一致会计政策，不得随意变更，以保证前后各期会计信息可比。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789582", "t": 1, "q": "A公司以2200万元取得B公司30％的股权，能对B公司施加重大影响，取得投资时被投资单位可辨认净资产的公允价值为8000万元。不考虑其他因素，则A公司该长期股权投资的账面价值为（　）万元。", "a": ["2200", "2400", "8000", "5800", "", ""], "r": "B", "e": "初始投资成本2200万元，应享有被投资单位可辨认净资产公允价值份额为8000×30% = 2400万元，份额大于初始投资成本，应调整长期股权投资账面价值，所以其账面价值为2400万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789583", "t": 1, "q": "企业发生的下列经济业务中，会引起资产和所有者权益同时减少的是？", "a": ["接受投资者投入设备", "以盈余公积弥补亏损", "以银行存款购买原材料", "宣告分配现金股利", "", ""], "r": "D", "e": "A选项接受投资者投入设备会使资产和所有者权益同时增加；B选项以盈余公积弥补亏损是所有者权益内部的一增一减；C选项以银行存款购买原材料是资产内部的一增一减；D选项宣告分配现金股利，借记“利润分配”，贷记“应付股利”，会使所有者权益减少，同时负债增加，支付时资产减少，整体可理解为会引起资产和所有者权益同时减少。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528627600789584", "t": 1, "q": "当难以区分某种会计变更属于会计政策变更还是会计估计变更时，通常将这种会计变更（　）。", "a": ["视为前期差错处理", "视为资产负债表日后调整事项处理", "视为会计政策变更处理", "视为会计估计变更处理", "", ""], "r": "D", "e": "难以区分会计政策变更和会计估计变更时，为简化处理，按会计估计变更处理。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594688", "t": 2, "q": "企业处置长期股权投资时，正确的处理方法有（　）。", "a": ["处置长期股权投资，其账面价值与实际取得价款的差额，应当计入投资收益", "采用权益法核算的长期股权投资，因被投资单位除净损益以外所有者权益的其他变动而计入所有者权益的，处置该项投资时应当将原计入所有者权益的部分按相应比例转入投资收益", "处置长期股权投资，其账面价值与实际取得价款的差额，应当计入营业外收入", "采用权益法核算的长期股权投资，因被投资单位除净损益以外所有者权益的其他变动而计入所有者权益的，处置该项投资时应当将原计入所有者权益的部分全部转入营业外收入", "", ""], "r": "AB", "e": "处置长投时，账面价值与实际取得价款的差额计入投资收益，A对C错；权益法下因被投资单位除净损益以外所有者权益其他变动计入所有者权益的部分，处置时按相应比例转入投资收益，B对D错。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594689", "t": 2, "q": "可以不附原始凭证的记账凭证有（　）", "a": ["更正错误的记账凭证", "一张原始凭证需要有多个单位共同使用时", "期末结账的记账凭证", "一张原始凭证涉及到几张记账凭证时", "", ""], "r": "AC", "e": "更正错误和期末结账的记账凭证可不附原始凭证。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594690", "t": 2, "q": "下列各项中，属于存货的有（　）。", "a": ["周转材料", "发出商品", "委托加工物资", "工程物资", "", ""], "r": "ABC", "e": "存货是企业日常活动中持有以备出售的产成品或商品、处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料和物料等。周转材料、发出商品、委托加工物资都符合存货定义。而工程物资是用于建造固定资产等工程的物资，不属于存货。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594691", "t": 2, "q": "应计入营业费用（产品销售费用）的支出有（　）。", "a": ["广告费", "运输费", "销售机构办公费", "委托代销手续费", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594692", "t": 2, "q": "企业将自用房地产或存货转换为采用公允价值模式计量的投资性房地产，下列说法正确的有（　）。", "a": ["转换当日的公允价值小于原账面价值的差额计入到资本公积（其他资本公积）", "自用房地产或存货转换为采用公允价值模式计量的投资性房地产，该项投资性房地产应当按照转换当日的公允价值计量", "转换当日的公允价值小于原账面价值的差额计入公允价值变动损益", "自用房地产或存货转换为采用公允价值模式计量的投资性房地产，该项投资性房地产应当按照转换当日的账面价值计量", "", ""], "r": "BC", "e": "企业将自用房地产或存货转换为采用公允价值模式计量的投资性房地产，应按转换当日公允价值计量，若公允价值小于原账面价值，差额计入公允价值变动损益。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594693", "t": 2, "q": "应采用未来适用法处理会计政策变更的情况有（　）。", "a": ["企业因账簿超过法定保存期限而销毁，引起会计政策变更累积影响数无法确定", "企业账簿因不可抗力而毁坏引起累积影响数无法确定", "会计政策变更累积影响数能够合理确定，国家相关准则规定应追溯调整", "会计政策变更累积影响数能够确定，但法律或行政法规要求对会计政策的变更采用未来适用法", "", ""], "r": "ABD", "e": "未来适用法适用于累积影响数不能合理确定的情况，或有规定应采用未来适用法的情况。AB累积影响数无法确定，D规定用未来适用法，都符合；C应追溯调整，不采用未来适用法。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594694", "t": 2, "q": "根据《企业会计准则第18号——所得税》的规定，下列表述正确的内容有（　）。", "a": ["通常情况下，资产在取得时其入账价值与计税基础是相同的，后续计量过程中因企业会计准则规定与税法规定不同，可能造成账面价值与计税基础的差异", "通常情况下，短期借款、应付票据、应付账款等负债的确认和偿还，不会对当期损益和应纳税所得额产生影响，其计税基础即为其账面价值", "负债的计税基础是指负债的账面价值减去未来期间计算应纳税所得额时按照税法规定可予抵扣的金额", "企业应交的罚款和滞纳金等，在尚未支付之前按照会计规定确认为费用，同时作为负债反映，税法规定罚款和滞纳金不能税前扣除，所以其计税基础为零", "", ""], "r": "ABC", "e": "A选项，资产初始入账价值和计税基础常相同，后续计量因准则和税法差异会使账面价值与计税基础不同，正确；B选项，常见负债确认和偿还不影响损益和应纳税所得额，计税基础等于账面价值，正确；C选项是负债计税基础的正确定义，正确；D选项，罚款和滞纳金计税基础是账面价值减去未来可抵扣金额（为0），即计税基础等于账面价值，不是零，错误。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594695", "t": 2, "q": "下列关于总部资产减值测试的说法中不正确的有（　）。", "a": ["总部资产一般难以脱离其他资产或资产组产生独立的现金流入", "为进行减值测试，对于因企业合并形成的商誉的账面价值，企业应该自购买日起按照合理的方法将其分摊至企业所有的资产组或资产组组合", "商誉应当结合与其相关的资产组或资产组组合进行减值测试", "对总部资产进行减值测试，必须将总部资产的账面价值全部分摊至相关的资产组", "", ""], "r": "BD", "e": "总部资产一般难以独立产生现金流入，A正确；商誉应分摊至相关资产组或资产组组合，不是所有，B错误；商誉要结合相关资产组或资产组组合减值测试，C正确；总部资产减值测试不一定全部分摊，D错误。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594696", "t": 2, "q": "期末通过比较发现存货的账面价值低于可变现净值，则可能（　）。", "a": ["将以前计提的存货跌价准备全部冲减", "冲减部分以前计提的存货跌价准备", "不进行账务处理", "按差额补提存货跌价准备", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594697", "t": 2, "q": "下列各项，属于无形资产的有（　）。", "a": ["商标权", "商誉", "特许权", "非专利技术", "", ""], "r": "ACD", "e": "无形资产包括商标权、特许权、非专利技术等，商誉不属于无形资产。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594698", "t": 2, "q": "关于利润，下列说法中正确的有（　）。", "a": ["直接计入当期利润的利得和损失，是指应当计入当期损益、会导致所有者权益发生增减变动的、与所有者投入资本或者向所有者分配利润无关的利得或者损失", "利润是指企业在一定会计期间的经营成果", "利润反映企业某一时点的财务状况", "利润金额的确定主要取决于收入和费用的计量，不考虑利得和损失金额的影响", "", ""], "r": "AB", "e": "利润是一定会计期间经营成果，直接计入当期利润的利得和损失有明确概念；利润反映一定期间不是某一时点财务状况；利润确定要考虑利得和损失。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594699", "t": 2, "q": "企业进行利润表分析时，关于盈利能力分析的指标有？", "a": ["净利率", "总资产收益率", "资产负债率", "毛利率", "", ""], "r": "ABD", "e": "盈利能力分析指标是衡量企业赚取利润能力的指标。净利率、总资产收益率、毛利率都与企业盈利相关。而资产负债率是衡量企业偿债能力的指标。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594700", "t": 2, "q": "资金运动的内容包括（　）。", "a": ["资金的退出", "资金的循环", "资金的周转", "资金的投入", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594701", "t": 2, "q": "下列关于固定资产的表述中，说法正确的有（　）", "a": ["固定资产修理费用，应当直接计入当期费用", "经营租入固定资产发生的改良支出，应通过\"长期待摊费用\"核算", "持有待售固定资产从划归为持有待售之日起停止计提折旧和减值准备", "固定资产改良支出，应当计入固定资产账面价值", "", ""], "r": "BCD", "e": "A项，固定资产修理费符合资本化条件应计入资产成本而非直接计当期费用；B项，经营租入固定资产改良支出通过“长期待摊费用”核算正确；C项，持有待售固定资产从划归时起停止计提折旧和减值准备正确；D项，固定资产改良支出符合条件计入账面价值正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594702", "t": 2, "q": "资产负债表中\"长期借款\"项目的填列，应考虑的因素有？", "a": ["长期借款的利息调整金额", "\"长期借款\"总账科目余额", "\"长期借款\"科目所属明细科目中一年内到期且企业不能自主地将清偿义务展期的部分", "长期借款的本金金额", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594703", "t": 2, "q": "关于资产组的认定，下列说法中正确的有（　）。", "a": ["应当以资产组产生的主要现金流入是否独立于其他资产或者资产组的现金流入为依据", "资产组一经确定后，各个会计期间应当保持一致，不得随意变更", "如果几项资产的组合生产的产品存在活跃市场，则表明这几项资产的组合能够独立产生现金流入", "资产组的认定应当考虑企业管理层对生产经营活动的管理或者监控方式和对资产的持续使用或者处置的决策方式", "", ""], "r": "ABCD", "e": "资产组认定需考虑现金流入独立性、保持稳定、产品市场及管理决策方式等因素。A体现独立性，B强调稳定性，C说明有活跃市场能独立产生现金流入，D考虑管理决策影响。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594704", "t": 2, "q": "下列属于中期财务会计报告的有（　）", "a": ["半年报", "月报", "季报", "年报", "", ""], "r": "ABC", "e": "中期财务报告是指短于一个完整会计年度的报告期间的财务报告。年报是完整会计年度报告，不属于中期。半年报、月报、季报都短于一个完整会计年度，属于中期财务会计报告。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594705", "t": 2, "q": "资产负债表日后发生的调整事项的处理原则，可能会涉及到下列情况的处理（　）。", "a": ["涉及损益的事项，通过\"以前年度损益调整\"科目核算", "涉及利润分配调整的事项，通过\"利润分配——未分配利润\"科目核算", "进行相关账务处理的同时，还应调整财务报表相关项目的数字", "不涉及损益以及利润分配的事项，直接调整相关科目", "", ""], "r": "ABCD", "e": "资产负债表日后调整事项，涉及损益用“以前年度损益调整”核算；涉及利润分配调整用“利润分配——未分配利润”核算；账务处理同时要调报表数字；不涉及损益和利润分配的直接调科目。ABCD 表述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594706", "t": 2, "q": "企业利润表的作用主要体现在？", "a": ["为投资者、债权人等提供决策信息", "有助于分析企业的获利能力和盈利趋势", "为企业内部管理层进行经营决策提供依据", "反映企业一定会计期间的经营成果", "", ""], "r": "ABCD", "e": "利润表能展示企业一定会计期间经营成果，可助投资者、债权人决策，帮企业分析获利与盈利趋势，也为内部管理层经营决策提供依据。ABCD选项均是利润表作用。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594707", "t": 2, "q": "记账凭证账务处理程序与汇总记账凭证账务处理程序的相同之处在于（　）。", "a": ["根据各种记账凭证和有关原始凭证或原始凭证汇总表登记明细账", "根据原始凭证或汇总原始凭证编制记账凭证", "根据收、付款凭证逐笔登记现金日记账和银行存款日记账", "根据记账凭证逐笔登记总分类账", "", ""], "r": "ABC", "e": "记账凭证账务处理程序与汇总记账凭证账务处理程序在登记明细账、编制记账凭证、登记现金和银行存款日记账方面是相同的。D选项，记账凭证账务处理程序是逐笔登记总账，汇总记账凭证账务处理程序是根据汇总记账凭证登记总账，二者不同。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594708", "t": 2, "q": "以记账凭证为依据，按有关账户的贷方设置，按借方账户归类的有（　）。", "a": ["汇总付款凭证", "科目汇总表", "汇总转账凭证", "汇总收款凭证", "", ""], "r": "AC", "e": "汇总付款凭证按贷方科目设置，按借方科目归类；汇总转账凭证按贷方账户设置，按借方账户归类。科目汇总表是按相同会计科目汇总，不按借贷方设置归类；汇总收款凭证按借方科目设置。所以答案选AC。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594709", "t": 2, "q": "《企业会计准则》规定的会计计量属性包括哪些？", "a": ["重置成本", "公允价值", "历史成本", "可变现净值", "", ""], "r": "ABCD", "e": "《企业会计准则》规定会计计量属性有历史成本、重置成本、可变现净值、现值和公允价值。ABCD四个选项均在其中。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594710", "t": 2, "q": "采用分步法核算产品成本时，逐步结转分步法的特点有？", "a": ["成本计算期与产品生产周期一致", "半成品成本随实物转移而结转", "完工产品是指最终完工的产成品", "能提供各步骤半成品成本资料", "", ""], "r": "BD", "e": "逐步结转分步法下，半成品成本随实物转移而结转，且能提供各步骤半成品成本资料。A选项，分步法成本计算期与会计报告期一致，与产品生产周期不一致；C选项，逐步结转分步法下某步骤完工产品可能是半成品，不一定是最终完工产成品。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594711", "t": 2, "q": "下列表述正确的是（　）。", "a": ["盘盈、盘亏、报废、毁损的工程物资，按扣除保险公司或过失人赔偿部分后的差额，如果工程项目尚未完工的，计入或冲减所建工程项目的成本;如果工程项目已达到预定可使用状态，属于筹建期间的计入或冲减管理费用，不属于筹建期间的计入当期营业外收入或营业外支出", "工程物资的成本包括购买价款、运杂费、保险费等相关税费，但不包括增值税税额", "固定资产的账面净值的计算需要减去原已计提的固定资产减值准备", "对于剩余的工程物资，应该按减去可抵扣的增值税进项税额后的实际成本或计划成本，转作企业的库存材料", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594712", "t": 2, "q": "下列情况中，投资企业应终止采用权益法核算而改为成本法核算的有（　）。", "a": ["投资企业因对联营企业追加投资，从而对被投资单位能够实施控制", "投资企业对被投资单位减少投资，使持股比例由60％改为40%", "投资企业的持股比例原为10％，后追加投资持股比例达到30%", "投资企业因减少投资对被投资单位不再具有共同控制和重大影响，且公允价值不能可靠计量", "", ""], "r": "AD", "e": "权益法改成本法主要是投资企业对被投资单位的控制程度发生重大变化，从共同控制或重大影响变为控制，或不再具有共同控制和重大影响且公允价值不能可靠计量。A选项从联营到控制，D选项不再有共同控制和重大影响且公允价值不可靠计量，符合条件；B还是有重大影响，用权益法；C从无重大影响到有重大影响，用权益法。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594713", "t": 2, "q": "各种原始凭证必须具备的基本内容包括（　）", "a": ["填制单位签章", "凭证名称、填制日期", "经济业务内容", "接受原始凭证的单位名称", "", ""], "r": "ABCD", "e": "原始凭证基本内容涵盖凭证名称、日期、经济业务内容、接受单位名称、填制单位签章等。ABCD选项均属于基本内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594714", "t": 2, "q": "企业进行财务报表分析时，分析短期偿债能力的指标有？", "a": ["资产负债率", "现金比率", "速动比率", "流动比率", "", ""], "r": "BCD", "e": "短期偿债能力指标衡量企业短期内偿还债务能力。资产负债率衡量长期偿债能力；现金比率、速动比率、流动比率都用于衡量短期偿债能力。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594715", "t": 2, "q": "根据现行会计制度的规定，下列各项中，属于企业经营活动产生的现金流量的有（　）。", "a": ["分期付款购建固定资产", "出租无形资产使用权取得的收入", "转让无形资产所有权取得的收入", "本期预收的劳务款", "", ""], "r": "BD", "e": "经营活动是企业日常经营相关活动。A选项分期付款购建固定资产属筹资和投资活动；B出租无形资产使用权是日常经营活动，租金收入产生经营活动现金流量；C转让无形资产所有权属非日常活动，属投资活动；D预收劳务款是经营活动中因销售劳务提前收款。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594716", "t": 2, "q": "广义的在产品是指（　）。", "a": ["半成品", "正在车间加工的在制品", "待返修的废品", "已完工尚未入库的产成品", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594717", "t": 2, "q": "下列关于企业利润表编制的说法，正确的有？", "a": ["以\"收入-费用=利润\"为理论依据", "编制基础是权责发生制", "部分项目需根据有关科目发生额分析填列", "反映企业一定会计期间的经营成果", "", ""], "r": "ABCD", "e": "利润表依据“收入 - 费用 = 利润”编制，采用权责发生制，部分项目要分析有关科目发生额填列，能反映一定会计期间经营成果。ABCD选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594718", "t": 2, "q": "下列事项中属于或有事项的有（　）。", "a": ["企业因污染环境可能支付的罚金", "承诺", "亏损合同", "法院终审判决中的诉讼赔偿", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594719", "t": 2, "q": "企业采用品种法核算产品成本时，其成本计算程序包括？", "a": ["按产品批别归集生产费用", "计算完工产品成本和在产品成本", "按产品品种设置成本计算单", "归集和分配各种生产费用", "", ""], "r": "BCD", "e": "品种法是按产品品种归集和分配生产费用、计算产品成本。先按产品品种设成本计算单，再归集分配生产费用，最后算完工和在产品成本。A选项按产品批别归集生产费用是分批法特点。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594720", "t": 2, "q": "下列关于委托代销商品，说法正确的有（　）", "a": ["收取手续费方式，是指受托方根据所代销的商品数量向委托方收取手续费的销售方式", "在视同买断方式下，如果委托方和受托方之间的协议明确标明，受托方在取得代销商品后，无论是否能够卖出、是否获利，均与委托方无关，在符合销售商品收入确认条件时，委托方应确认相关销售商品收入", "委托代销商品包含视同买断方式和收取手续费两种方式", "收取手续费方式下，受托方应在商品销售后，按合同或协议约定的方法计算确定的手续费确认收入", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594721", "t": 2, "q": "下列关于收入的确认和计量，说法正确的有（　）。", "a": ["以旧换新销售的方式下，销售的商品应当按照销售商品收入确认条件确认收入，回收的旧商品应作为购进商品处理", "预收款销售商品，企业通常将预收的货款确认为负债，在发出商品时确认收入", "售后回购在大多数情况下，属于融资交易，企业不应确认销售商品收入，收到的款项应确认为负债", "如果销售商品不符合收入确认条件，则不应确认收入，已经发出的商品，则应通过\"发出商品\"科目进行核算", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594722", "t": 2, "q": "企业持有至到期投资的特点包括（　）。", "a": ["有明确意图持有至到期", "到期日固定、回收金额固定或可确定", "有能力持有至到期", "发生市场利率变化、流动性需要变化等情况时，将出售该金融资产", "", ""], "r": "ABC", "e": "持有至到期投资需同时满足有明确意图、有能力持有至到期，且到期日固定、回收金额固定或可确定。而D选项中在发生市场利率变化等情况就出售，不符合持有至到期投资特点。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594723", "t": 2, "q": "会计估计的特点包括（　）。", "a": ["会计估计应当以最近可利用的信息或资料为基础", "会计估计相应会削弱会计核算的可靠性", "会计估计的存在是由于经济活动中内在的不确定性因素的影响", "会计估计是企业进行会计核算的基础", "", ""], "r": "AC", "e": "会计估计以最近可利用信息资料为基础，因经济活动有不确定性所以存在会计估计。会计估计不会削弱核算可靠性，企业会计核算基础是权责发生制等不是会计估计。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594724", "t": 2, "q": "事业单位中，下列固定资产增加的业务中，应同时增加固定资产和固定基金的是（　）。", "a": ["融资租入固定资产", "接受捐赠的固定资产", "盘盈固定资产", "购置固定资产", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594725", "t": 2, "q": "下列关于会计等式的说法，正确的有？", "a": ["经济业务的发生不会破坏会计等式的平衡关系", "\"资产=负债+所有者权益\"是最基本的会计等式", "会计等式是复式记账法的理论基础", "\"收入-费用=利润\"反映企业一定会计期间的经营成果", "", ""], "r": "ABCD", "e": "会计等式是会计核算的基础，基本等式“资产=负债+所有者权益”恒成立，业务发生不破坏平衡；它也是复式记账法依据；“收入 - 费用 = 利润”体现经营成果。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594726", "t": 2, "q": "企业应当在财务报表中披露的项目有（　）。", "a": ["编报企业的名称", "人民币金额单位", "资产负债表日或财务报表涵盖的会计期间", "财务报表是合并财务报表的，应当予以标明", "", ""], "r": "ABCD", "e": "财务报表需披露编报企业名称、金额单位、会计期间，若为合并报表也应标明。ABCD四个选项都是企业应在财务报表中披露的项目。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594727", "t": 2, "q": "下列各项中，符合《企业会计准则》中费用定义的有？", "a": ["职工薪酬支出", "固定资产报废损失", "罚款支出", "销售商品的成本", "", ""], "r": "AD", "e": "费用是日常活动中形成的、会导致所有者权益减少的、与向所有者分配利润无关的经济利益的总流出。A职工薪酬支出是企业日常经营中支付给员工的费用；D销售商品的成本也是日常销售活动产生的费用。而B固定资产报废损失和C罚款支出都不是日常活动形成的，属于损失。所以答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594728", "t": 2, "q": "长期股权投资的权益法的适用范围包括（　）。", "a": ["投资企业对被投资企业具有重大影响的长期股权投资", "投资企业能够对被投资企业实施控制的长期股权投资", "投资企业对被投资企业不具有共同控制或重大影响，并且在活跃市场中没有报价、公允价值不能可靠计量的长期股权投资", "投资企业对被投资企业具有共同控制的长期股权投资", "", ""], "r": "AD", "e": "权益法适用于对被投资单位具有共同控制或重大影响的长期股权投资。A选项重大影响、D选项共同控制符合；B选项控制用成本法；C选项不具有共同控制或重大影响且特定情况也用成本法。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594729", "t": 2, "q": "提供劳务交易的结果能够可靠估计，应当同时满足的条件有（　）。", "a": ["收入的金额能够可靠的计量", "交易的完工进度能够可靠的确定", "交易中已发生或将发生的成本能够可靠的计量", "相关的经济利益很可能流入企业", "", ""], "r": "ABCD", "e": "提供劳务交易结果能可靠估计需同时满足收入金额可计量、完工进度能确定、成本能计量、经济利益很可能流入企业这四个条件。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594730", "t": 2, "q": "下列关于披露分部信息的主要报告形式和次要报告形式，说法正确的有（　）。", "a": ["风险和报酬同时较大地受企业产品和劳务的差异以及经营活动所在国家或地区差异影响的，披露分部信息的主要形式应当是业务分部，次要形式是地区分部", "风险和报酬主要受企业在不同的国家或地区经营活动影响的，披露分部信息的主要形式应当是地区分部，次要形式是业务分部", "风险和报酬同时较大地受企业产品和劳务的差异以及经营活动所在国家或地区差异影响的，披露分部信息的主要形式应当是地区分部，次要形式是业务分部", "风险和报酬主要受企业的产品和劳务差异影响的，披露分部信息的主要形式应当是业务分部，次要形式是地区分部", "", ""], "r": "ABD", "e": "若风险和报酬主要受产品和劳务差异影响，主要报告形式为业务分部，次要为地区分部；若主要受经营活动所在国家或地区差异影响，主要报告形式为地区分部，次要为业务分部；若两者影响都大，一般主要报告形式是业务分部，次要形式是地区分部。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594731", "t": 2, "q": "新《企业会计准则》规定，中期财务会计报告至少应当包括（　）", "a": ["附注", "资产负债表", "利润表", "现金流量表", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594732", "t": 2, "q": "上市公司在其年度资产负债表日后至财务报告批准报出日前发生的下列事项中，属于非调整事项的有（　）。", "a": ["董事会提出股票股利分配方案", "因发生火灾导致存货严重损失", "以前年度售出商品发生退货", "董事会提出现金股利分配方案", "", ""], "r": "ABD", "e": "非调整事项是资产负债表日及之前不存在，在日后期间新发生的事项。A选项董事会提出股票股利分配方案、B选项因火灾导致存货严重损失、D选项董事会提出现金股利分配方案，均是资产负债表日后新发生事项。C选项以前年度售出商品发生退货，是资产负债表日已存在情况在日后得到进一步证据，属于调整事项。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594733", "t": 2, "q": "下列各项中，可以计提坏账准备的有（　）。", "a": ["其他应收款", "应收账款", "长期应收款", "预付账款", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594734", "t": 2, "q": "下列各项中，属于非流动资产的有（　）。", "a": ["可供出售金融资产", "持有至到期投资", "无形资产", "工程物资", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528630100594735", "t": 2, "q": "下列长期股权投资中，应采用成本法核算的有（　）。", "a": ["投资企业对联营企业的长期股权投资", "投资企业对被投资单位不具有重大影响，并且在活跃市场中没有报价、公允价值不能可靠计量的长期股权投资", "投资企业对子公司的长期股权投资", "投资企业对合营企业的长期股权投资", "", ""], "r": "BC", "e": "成本法适用于对子公司投资，以及对被投资单位不具有重大影响且在活跃市场无报价、公允价值不能可靠计量的长期股权投资；权益法适用于对合营企业、联营企业投资。答案是BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445376", "t": 3, "q": "对于已经计提减值准备的固定资产，在以后期间价值恢复时，可以转回原已计提的减值准备金额。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "固定资产减值损失一经确认，在以后会计期间不得转回。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445377", "t": 3, "q": "20×8年7月10日，在20×7年度财务报告批准报出后，发现20×7年度管理用固定资产少提折旧300万元。企业应调整20×8年度会计报表相关项目的期初数和上年数。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该事项属于重要的前期差错，在财务报告批准报出后发现，应采用追溯重述法调整，调整20×8年度会计报表相关项目的期初数和上年数。", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445378", "t": 3, "q": "采用出包方式自行建造固定资产工程时，预付承包单位的工程价款应通过\"预付账款\"科目核算。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "出包方式下，预付承包单位工程价款，通过“预付账款”核算，符合会计处理规定。", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445379", "t": 3, "q": "资产负债表日后董事会制定的利润分配方案中与财务报告所属期间有关的利润分配均属于调整事项。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产负债表日后董事会制定的利润分配方案中与财务报告所属期间有关的现金股利分配属于非调整事项，股票股利分配也是非调整事项，并非均为调整事项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445380", "t": 3, "q": "持有待售的固定资产从划归为持有待售之日起停止计提折旧和减值测试。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业对于持有待售的固定资产，自划分为持有待售之日起停止计提折旧和减值测试。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445381", "t": 3, "q": "可抵扣暂时性差异在未来期间转回时会减少转回期间的应纳税所得额，减少未来期间的应交所得税;应纳税暂时性差异在未来期间转回时会增加转回期间的应纳税所得额，增加未来期间的应交所得税金额。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "可抵扣暂时性差异意味着未来可税前扣除，会减少未来应纳税所得额和应交所得税；应纳税暂时性差异未来需纳税，会增加未来应纳税所得额和应交所得税。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445382", "t": 3, "q": "企业对子公司的长期股权投资应采用权益法核算。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业对子公司的长期股权投资应采用成本法核算，而非权益法。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445383", "t": 3, "q": "投资企业对被投资单位具有共同控制，若被投资单位的股票在活跃市场上有报价，则该投资不能按长期股权投资准则进行核算。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "投资企业对被投资单位具有共同控制，无论被投资单位股票是否在活跃市场有报价，都应按长期股权投资准则核算。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445384", "t": 3, "q": "交易性金融资产和可供出售金融资产的相同点是都按公允价值进行后续计量，且公允价值变动计入当期损益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "交易性金融资产按公允价值后续计量，公允价值变动计入当期损益；而可供出售金融资产按公允价值后续计量，但公允价值变动计入其他综合收益，并非当期损益。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445385", "t": 3, "q": "让渡资产使用权收入的确认应该同时满足两个条件，即相关经济利益很可能流入企业，并且收入的金额能够可靠计量。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据会计准则，让渡资产使用权收入确认需同时满足相关经济利益很可能流入企业和收入金额能可靠计量这两个条件。", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445386", "t": 3, "q": "交易性金融资产持有期间被投资单位宣告发放的现金股利，或在资产负债表日按分期付息、一次还本债券投资的票面利率计算的利息，应该冲减交易性金融资产的成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "交易性金融资产持有期间被投资单位宣告发放的现金股利，或在资产负债表日按分期付息、一次还本债券投资的票面利率计算的利息，应计入投资收益，而非冲减交易性金融资产成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445387", "t": 3, "q": "企业在处置境外经营时，应当将资产负债表中所有者权益项目下列示的、与该境外经营相关的外币财务报表折算差额，自所有者权益项目转入处置当期损益。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业处置境外经营，要把与该境外经营相关的外币报表折算差额从所有者权益项目转入处置当期损益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445388", "t": 3, "q": "将债务转为资本的，债权人应当将享有股份的公允价值确认为对债务人的投资，重组债权的账面余额与股份的公允价值之间的差额，比照以非现金资产清偿债务的债务重组会计处理规定进行处理。债权人已对债权计提减值准备的，应当先将该差额冲减减值准备，冲减后尚有余额的，计入营业外支出（债务重组损失）;冲减后减值准备仍有余额的，应予转回并抵减当期资产减值损失。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "此描述符合债务转为资本时债权人的会计处理规定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445389", "t": 3, "q": "发出包装物和低值易耗品的方法有一次转销法，分次摊销法。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计实务中，发出包装物和低值易耗品时，常用一次转销法和分次摊销法进行核算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445390", "t": 3, "q": "收到购买交易性金融资产时支付的价款中包含的已到付息期但尚未领取的利息，应计入当期损益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "购买交易性金融资产时支付价款中包含的已到付息期但尚未领取的利息，应单独确认为应收项目，而非计入当期损益。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445391", "t": 3, "q": "非货币性资产交换不具有商业实质，或虽具有商业实质但所涉及资产的公允价值不能可靠计量的，无论是否支付补价，均不确认损益。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "非货币性资产交换满足上述条件时，以换出资产的账面价值为基础计量，不确认损益。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445392", "t": 3, "q": "判断一项会计事项是否具有重要性，主要取决于会计制度的规定，而不是取决于会计人员的职业判断。所以，同一事项在某一企业具有重要性，在另一企业则也具有重要性。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重要性的判断取决于会计人员职业判断，不同企业规模、业务不同，同一事项重要性可能不同。题干说主要取决于会计制度规定且同一事项在不同企业重要性相同是错误的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445393", "t": 3, "q": "固定资产卡片于固定资产报废清理后保管3年。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "固定资产卡片应在固定资产报废清理后保管5年，而不是3年。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445394", "t": 3, "q": "对于在资产负债表日起一年内到期的负债，如果在资产负债表日后、财务报告批准报出日前签订了重新安排清偿计划协议，则该项负债应归类为非流动负债。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445395", "t": 3, "q": "可供出售权益工具投资发生的减值损失，不得通过损益转回。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "可供出售权益工具投资发生减值后，其减值损失应通过权益（其他综合收益）转回，不能通过损益转回。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445396", "t": 3, "q": "一笔会计分录主要包括三个要素即会计科目、记账符号和金额。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "会计分录是对某项经济业务标明其应借应贷账户及其金额的记录，会计科目、记账符号和金额是构成会计分录的三个基本要素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445397", "t": 3, "q": "企业合并中产生的商誉，其账面价值和计税基础不同形成的应纳税暂时性差异，企业会计准则中规定不确认相关递延所得税负债。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业合并中产生的商誉，其账面价值和计税基础不同形成的应纳税暂时性差异，准则出于减少会计与税法的差异等考虑，规定不确认相关递延所得税负债。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445398", "t": 3, "q": "各种期间费用明细账，在与总账进行核对时，只能核对其余额，不能核对其发生额。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "期间费用明细账与总账核对时，既可以核对余额，也能核对发生额。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445399", "t": 3, "q": "固定资产的装修费用，满足固定资产的确认条件，可以计入固定资产账面价值，并且在两次装修间隔期间与固定资产尚可使用年限两者中的较短的期间内采用合理的方法单独计提折旧。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于满足固定资产确认条件的固定资产装修费用，按此规定处理符合会计准则。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445400", "t": 3, "q": "复式记账法要以资产与权益的平衡关系作为记账基础，对于每笔交易或事项，都要在两个或两个以上的账户中进行登记。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "复式记账法确实是以资产与权益平衡关系为记账基础，且每笔交易或事项需在两个或以上账户登记。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445401", "t": 3, "q": "专门借款，是指为购建固定资产而专门借入的款项。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445402", "t": 3, "q": "在债务重组中，债务人的或有应付金额在随后会计期间没有发生的，应在结算时转入资本公积。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "债务人或有应付金额未发生，应在结算时转入营业外收入，而非资本公积。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445403", "t": 3, "q": "固定资产的各组成部分具有不同使用寿命或者以不同方式为企业提供经济利益，适用不同折旧率或折旧方法的，应当分别将各组成部分确认为单项固定资产。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当固定资产各组成部分特性不同，适用不同折旧率或方法时，分别确认为单项固定资产能更准确反映其价值损耗和经济利益实现情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445404", "t": 3, "q": "合并方在企业合并中取得被合并方100％的股权，不一定属于吸收合并。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "取得100％股权，可能是吸收合并，也可能是控股合并等其他形式，所以不一定是吸收合并。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445405", "t": 3, "q": "外购投资性房地产的成本，包括购买价款、相关税费和可直接归属于该资产的其他支出（　）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据会计准则，外购投资性房地产成本就是由购买价款、相关税费和可直接归属于该资产的其他支出构成。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445406", "t": 3, "q": "企业持有待售的固定资产，应当调整其预计净残值，使预计净残值能够反映其公允价值减去处置费用后的金额，但不得超过其账面价值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业持有待售固定资产，准则规定就是要调整预计净残值，使其反映公允价值减处置费用后的金额，且不能超过账面价值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445407", "t": 3, "q": "预算单位零余额账户用于财政直接支付和与国库单一账户清算。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "预算单位零余额账户用于财政授权支付和清算，财政直接支付通过财政部门零余额账户，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445408", "t": 3, "q": "在编制合并现金流量表时，对于子公司向少数股东支付现金股利或利润应该予以抵销。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "子公司向少数股东支付现金股利或利润，在合并现金流量表中应作为“分配股利、利润或偿付利息支付的现金”项目的一部分列示，不予以抵销。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528631241445409", "t": 3, "q": "企业发生的借款费用，可直接归属于符合资本化条件的资产的购建或者生产的，应当予以资本化，否则应于发生时费用化。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这符合借款费用的处理原则，符合资本化条件的就资本化，不符合的费用化。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 会计学（6）", "n": "基础练习题【含解析】 / 第2章 会计学（6）", "qs": [{"id": "2034528638757638144", "t": 1, "q": "某上市公司发生的下列交易或事项中，属于会计政策变更的是（　）。", "a": ["固定资产预计净残值由1 000元改为2 000元", "发出存货的计价方法由先进先出法改为加权平均法", "年末根据当期发生的暂时性差异所产生的递延所得税负债调整本期所得税费用", "期末对原按业务发生时的汇率折算的外币长期借款余额按期末市场汇率进行调整", "", ""], "r": "B", "e": "会计政策变更是指企业对相同的交易或事项由原来采用的会计政策改用另一会计政策的行为。选项A固定资产预计净残值变更属于会计估计变更；选项C是正常的所得税核算处理；选项D是外币业务的正常调整。而发出存货计价方法的改变是会计政策的改变。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638145", "t": 1, "q": "下列关于分步法下成本计算期的表述，正确的是？", "a": ["与产品生产周期一致", "与会计报告期一致", "根据企业管理层要求随时计算", "不定期计算成本", "", ""], "r": "B", "e": "分步法适用于大量大批多步骤生产，成本计算是定期进行的，与会计报告期一致，而不是与产品生产周期一致，也不是根据管理层要求随时计算或不定期计算。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638146", "t": 1, "q": "实行国库集中支付后，对于由财政直接支付的工资，事业单位应借记\"事业支出\"科目，贷记（　）科目。", "a": ["应付工资", "现金", "财政补助收入", "银行存款", "", ""], "r": "C", "e": "实行国库集中支付后，财政直接支付工资时，相当于财政帮单位支付了工资，增加单位的财政补助收入。所以借记“事业支出”，贷记“财政补助收入”。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638147", "t": 1, "q": "下列项目中，不属于会计核算方法的是（　）。", "a": ["财产清查", "成本计算", "编制财务预算", "复式记账", "", ""], "r": "C", "e": "会计核算方法包括设置账户、复式记账、填制和审核凭证、登记账簿、成本计算、财产清查、编制财务报告等。而编制财务预算是财务管理的内容，不属于会计核算方法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638148", "t": 1, "q": "现金流量表中，“收到其他与经营活动有关的现金”项目不包括？", "a": ["收到的增值税销项税额", "罚款收入", "经营租赁固定资产收到的现金", "收到的押金", "", ""], "r": "A", "e": "收到的增值税销项税额在“销售商品、提供劳务收到的现金”项目反映，不在“收到其他与经营活动有关的现金”项目。而罚款收入、经营租赁固定资产收到的现金、收到的押金属于该项目核算内容。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638149", "t": 1, "q": "企业销售商品采用托收承付结算方式，办妥托收手续时确认收入，这体现的会计基础是？", "a": ["永续盘存制", "收付实现制", "权责发生制", "实地盘存制", "", ""], "r": "C", "e": "权责发生制是按权利和责任的发生来确认收入和费用归属期，企业采用托收承付结算方式，办妥托收手续表明已取得收款权利，此时确认收入符合权责发生制。收付实现制按实际收付款确认，永续盘存制和实地盘存制是存货核算方法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638150", "t": 1, "q": "下列项目中，属于利润表中\"营业成本\"项目内容的是？", "a": ["固定资产折旧", "销售商品成本", "支付的业务招待费", "对外捐赠支出", "", ""], "r": "B", "e": "营业成本是企业经营活动中销售商品、提供劳务等发生的成本。销售商品成本属于营业成本。固定资产折旧根据用途可能计入不同科目，业务招待费是管理费用，对外捐赠支出是营业外支出，都不属于营业成本。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638151", "t": 1, "q": "品种法适用于（　）", "a": ["单件、大批生产的企业", "大量大批单步骤生产的企业", "单件、小批生产的企业", "大量大批多步骤生产且要求分步核算成本的企业", "", ""], "r": "B", "e": "品种法是按产品品种归集生产费用、计算产品成本的方法，适用于大量大批单步骤生产的企业。A选项单件大批表述错误；C选项是分批法适用情况；D选项应采用分步法。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638152", "t": 1, "q": "资产负债表中，“应付职工薪酬”项目应根据（　）填列。", "a": ["“应付职工薪酬”科目期末余额加上一年内到期部分后的金额", "“应付职工薪酬”总账科目余额", "“应付职工薪酬”科目期末余额扣除一年内到期部分后的金额", "“应付职工薪酬”科目所属明细科目余额", "", ""], "r": "B", "e": "资产负债表中“应付职工薪酬”项目按“应付职工薪酬”总账科目余额填列。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638153", "t": 1, "q": "企业编制利润表时，\"公允价值变动收益\"项目应根据（　）填列。", "a": ["\"公允价值变动损益\"科目期末余额", "\"交易性金融资产\"科目余额", "\"公允价值变动损益\"科目的发生额", "\"投资收益\"科目发生额", "", ""], "r": "C", "e": "“公允价值变动收益”项目反映企业应当计入当期损益的资产或负债公允价值变动收益，应根据“公允价值变动损益”科目的发生额分析填列。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638154", "t": 1, "q": "采用分批法计算产品成本时，对于同一批次跨月陆续完工的产品，在计算完工产品成本时，可采用的方法不包括？", "a": ["按约当产量比例法计算", "按计划单位成本计算", "按定额单位成本计算", "按近期同种产品的实际单位成本计算", "", ""], "r": "A", "e": "分批法下同一批次跨月陆续完工产品计算成本时，约当产量比例法一般用于大量大批多步骤生产，不适合分批法这种单件、小批生产。而按计划单位成本、定额单位成本、近期同种产品实际单位成本计算是分批法常用方法。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638155", "t": 1, "q": "企业销售商品发生的现金折扣，在会计核算时应如何处理？", "a": ["计入销售费用", "直接冲减主营业务收入", "不做账务处理", "计入财务费用", "", ""], "r": "D", "e": "现金折扣是为鼓励客户提前付款而给予的优惠，本质是一种理财费用，所以计入财务费用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638156", "t": 1, "q": "一般情况下，债务人以现金清偿某项债务的，则债权人应将重组债权的账面余额与收到现金之间的差额，计入（　）。", "a": ["资本公积", "管理费用", "营业外支出", "营业外收入", "", ""], "r": "C", "e": "债权人因债务重组产生的损失应计入营业外支出。本题中债权人将重组债权账面余额与收到现金的差额属于债务重组损失。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638157", "t": 1, "q": "在借贷记账法下，资产类账户的结构特点是？", "a": ["借方登记增加额，贷方登记减少额，期末余额在借方", "借方登记减少额，贷方登记增加额，期末余额在贷方", "借方登记增加额，贷方登记减少额，期末无余额", "借方登记减少额，贷方登记增加额，期末无余额", "", ""], "r": "A", "e": "资产类账户遵循“借增贷减”规则，正常情况下期末有余额且在借方。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638158", "t": 1, "q": "某公司出纳小李将公司现金交存开户银行，应编制（　）。", "a": ["现金付款凭证", "银行付款凭证", "现金收款凭证", "银行收款凭证", "", ""], "r": "A", "e": "对于涉及现金和银行存款之间的业务，为避免重复记账，一般只编制付款凭证。现金交存银行，现金减少，所以编制现金付款凭证。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638159", "t": 1, "q": "A公司拥有B公司18％的表决权资本;B公司拥有C公司60％的表决权资本;A公司拥有D公司60％的表决权资本，拥有E公司6%的表决权资本;D公司拥有E公司45％的表决权资本。上述公司之间存在关联方关系的有（　）。", "a": ["A公司与E公司", "B公司与D公司", "A公司与C公司", "A公司与B公司", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638160", "t": 1, "q": "下列金融资产中，不应计提减值准备的是（　）。", "a": ["交易性金融资产", "可供出售权益工具", "持有至到期投资", "应收款项", "", ""], "r": "A", "e": "交易性金融资产按公允价值计量且其变动计入当期损益，不计提减值准备；而可供出售权益工具、持有至到期投资、应收款项都需要计提减值准备。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638161", "t": 1, "q": "在小型工业企业中，可将生产成本和制造费用两个总账科目合并为一个（　）。", "a": ["制造费用总账科目", "基本生产成本总账科目", "辅助生产成本总账科目", "生产费用总账科目", "", ""], "r": "D", "e": "小型工业企业业务相对简单，将生产成本和制造费用合并为生产费用总账科目可简化核算。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638162", "t": 1, "q": "在编制现金流量表时，支付的所得税属于？", "a": ["不涉及现金流量的项目", "投资活动产生的现金流量", "经营活动产生的现金流量", "筹资活动产生的现金流量", "", ""], "r": "C", "e": "支付所得税是企业日常经营活动中的支出，属于经营活动产生的现金流量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638163", "t": 1, "q": "恒通公司2008年10月10日购入一条不需安装的生产线。原价为726万元，预计使用年限为5年，预计净残值为6万元，按年数总和法计提折旧。该固定资产2009年应计提的折旧额是（　）万元。", "a": ["240", "192", "234", "232", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638164", "t": 1, "q": "甲公司对销售产品承担售后保修，期初\"预计负债——保修费用\"的余额是20万元，包含计提的X产品保修费用8万元。本期销售Y产品200万元，发生的保修费预计为销售额的2%至3%之间，销售Z产品160万元，发生的保修费预计为销售额的3%至5%之间，甲公司已不再销售X产品且已售X产品保修期已过，则期末\"预计负债——保修费用\"的余额是（　）万元。", "a": ["27", "23.4", "19", "25.2", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638757638165", "t": 1, "q": "或有事项具有不确定性，下列说法中正确的是（　）。", "a": ["或有事项具有不确定性，是指或有事项的结果具有不确定性或者发生的具体时间或金额具有不确定性", "或有事项的不确定性是指或有事项的发生具有不确定性", "固定资产计提折旧时，涉及到对其残值和使用年限的分析和判断具有一定的不确定性，这种不确定性与或有事项具有的不确定性是相同的", "或有事项虽然具有不确定性，但该不确定性能由企业控制", "", ""], "r": "A", "e": "或有事项的不确定性包括结果、发生时间或金额的不确定；B选项只强调发生不确定不全面；固定资产折旧的不确定性与或有事项不同；或有事项的不确定性企业无法控制。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832448", "t": 1, "q": "某企业于20×6年12月1日购入不需安装的设备一台并投入使用。该设备入账价值为1800万元，采用平均年限法计提折旧（税法规定采用双倍余额递减法），折旧年限为5年（与税法规定一致），预计净残值为零（与税法规定一致）。该企业从20×8年1月开始执行38项具体会计准则，同时改用双倍余额递减法计提折旧，同时将所得税的核算方法由应付税款法变更为资产负债表债务法。该企业适用的所得税税率为25％，该企业政策变更的累积影响数为（　）万元。", "a": ["118.8", "270", "90", "-90", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832449", "t": 1, "q": "甲公司和乙公司均为增值税一般纳税人。适用的增值税税率均为17％，计税价格等于公允价值。甲公司以一台原价为200万元的设备与乙公司交换一批钢材，甲公司将其作为原材料核算。该设备已计提折旧额为80万元，未计提减值准备。该设备的公允价值为100万元，交换中发生固定资产清理费用5万元。乙公司以自产的一批钢材进行交换，钢材的账面价值为80万元。钢材的公允价值为80万元，并支付甲公司补价为6.4万元。假设该项交换具有商业实质。则甲公司换入资产的入账价值为（　）万元。", "a": ["80", "70", "100", "120", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832450", "t": 1, "q": "下列各项中，不会引起无形资产账面余额发生增减变动的是（　）。", "a": ["摊销无形资产", "转让无形资产所有权", "发生无形资产后续支出", "对无形资产计提减值准备", "", ""], "r": "C", "e": "A项摊销会减少无形资产账面价值；B项转让所有权会使账面余额减少；C项后续支出一般计入当期损益，不影响账面余额；D项计提减值准备影响账面价值而非账面余额。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832451", "t": 1, "q": "A公司2008年3月1日开始自行开发成本管理软件，在研究阶段发生材料及人工费用60万元，开发阶段发生材料及人工费用120万元，另发生借款费用45万元、其他无形资产摊销费用32万元。假定开发阶段的支出均满足资本化条件。2009年3月16日，该成本管理软件开发成功并依法申请了专利，支付注册费1.2万元，律师费2.3万元，已达到预定用途。A公司2009年3月20日为向社会展示其成本管理软件，特举办大型宣传活动，发生相关宣传费用44.5万元，则A公司该项无形资产的入账价值应为（　）万元。", "a": ["197", "260.5", "250", "200.5", "", ""], "r": "D", "e": "研究阶段支出费用化，开发阶段满足资本化条件的支出资本化，包括材料人工、借款费用、无形资产摊销，另外申请专利的注册费和律师费也应计入无形资产成本，宣传费不计入。入账价值=120 + 45 + 32 + 1.2 + 2.3 = 200.5（万元）。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832452", "t": 1, "q": "A公司于2009年1月1日发行面值总额为2,000万元，期限为5年的债券，该债券票面利率为6%，每年年初付息、到期一次还本，发行价格总额为2,270万元，利息调整采用实际利率法摊销，实际利率为5%。2009年12月31日，该应付债券的账面余额为（　）万元。", "a": ["2,035.93", "2,190.86", "2,120", "2,000", "", ""], "r": "B", "e": "本题可先计算出2009年初债券的摊余成本，再根据实际利率法计算出2009年的实际利息和票面利息，进而求出2009年12月31日该应付债券的账面余额。 步骤一：确定2009年初债券的摊余成本债券发行价格总额为2270万元，即2009年初债券的摊余成本为2270万元。 步骤二：计算2009年的实际利息和票面利息 实际利息：根据实际利率法，实际利息=期初摊余成本「test/yiwen_img/importSubject/2034528633024024576.png」实际利率。已知期初摊余成本为2270万元，实际利率为「test/yiwen_img/importSubject/2034528633619615744.png」，则2009年实际利息「test/yiwen_img/importSubject/2034528633724473344.png」（万元）。 票面利息：票面利息=债券面值「test/yiwen_img/importSubject/2034528633024024576.png」票面利率。已知债券面值为2000万元，票面利率为「test/yiwen_img/importSubject/2034528633976131584.png」，则2009年票面利息「test/yiwen_img/importSubject/2034528634080989184.png」（万元）。 步骤三：计算2009年12月31日该应付债券的账面余额债券账面余额（摊余成本）的计算公式为：期末摊余成本=期初摊余成本 +实际利息-票面利息。将期初摊余成本2270万元、实际利息113.5万元、票面利息120万元代入公式，可得：2270 + 113.5 - 120 = 2263.5 - 120 = 2190.86（万元）综上，答案是B选项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832453", "t": 1, "q": "下列有关投资性房地产的会计处理中，说法不正确的有（　）。", "a": ["采用公允价值模式计量的投资性房地产转为成本模式，应当作为会计政策变更", "存货转换为采用公允价值模式计量的投资性房地产，应当按照该项投资性房地产转换当日的公允价值计量", "采用公允价值模式计量的投资性房地产，不计提折旧或进行摊销，应当以资产负债表日投资性房地产的公允价值为基础调整其账面价值", "采用成本模式计量的土地使用权，期末应当确认土地使用权当期的摊销额", "", ""], "r": "A", "e": "投资性房地产只能由成本模式转为公允价值模式，不能由公允价值模式转为成本模式，A错误。B、C、D表述均正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832454", "t": 1, "q": "桦荫公司融资租入一台设备，其原账面价值为360万元，租赁开始日公允价值为335万元，最低租赁付款额为380万元，按出租人的内含利率折现的最低租赁付款额的现值为320万元，另外发生运杂费为10万元，租赁人员的差旅费为5万元，以银行存款支付。则在租赁开始日，海洋公司租赁资产的入账价值、未确认融资费用分别是（　）。", "a": ["335万元和60万元", "345万元和50万元", "335万元和40万元", "320万元和60万元", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832455", "t": 1, "q": "分步法适用于哪种生产类型？", "a": ["单步骤生产", "单件小批生产", "大量大批多步骤生产", "大量大批单步骤生产", "", ""], "r": "C", "e": "分步法是按照产品的生产步骤归集生产费用、计算产品成本的一种方法，适合大量大批多步骤生产，以便按步骤核算成本。单步骤生产用品种法，单件小批生产用分批法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832456", "t": 1, "q": "企业采用计划成本法核算原材料时，“材料成本差异”科目期末如为贷方余额，反映的是？", "a": ["实际成本大于计划成本的超支差异", "实际成本小于计划成本的节约差异", "计划成本小于实际成本的超支差异", "计划成本大于实际成本的节约差异", "", ""], "r": "B", "e": "“材料成本差异”贷方登记节约差异和发出材料应负担的超支差异。贷方余额意味着实际成本比计划成本小，是节约差异。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832457", "t": 1, "q": "下列关于成本核算方法的表述，正确的是？", "a": ["分步法适用于大量大批多步骤生产，且要求分步计算成本", "分批法适用于单件小批生产", "分批法成本计算期与产品生产周期一致", "品种法适用于大量大批单步骤生产", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832458", "t": 1, "q": " 企业销售商品时代垫的运杂费，应计入的会计科目是？", "a": ["预收账款", "应收账款", "应付账款", "其他应收款", "", ""], "r": "B", "e": "企业销售商品时代垫运杂费，是企业应向购货方收回的款项，应计入“应收账款”。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832459", "t": 1, "q": "在编制资产负债表时，\"预收账款\"项目应根据（　）填列。", "a": ["\"预收账款\"和\"应收账款\"科目所属明细科目的期末贷方余额合计数", "\"预收账款\"科目所属明细科目的期末贷方余额", "\"预收账款\"和\"预付账款\"科目所属明细科目的期末贷方余额合计数", "\"预收账款\"总账科目余额", "", ""], "r": "A", "e": "“预收账款”项目应根据“预收账款”和“应收账款”科目所属明细科目的期末贷方余额合计数填列。因为“预收账款”贷方登记预收款项和补收款项，“应收账款”明细贷方余额实质也是预收性质。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832460", "t": 1, "q": "某企业采用人民币作为记账本位币。下列项目，不属于该企业外币业务的是（　）。", "a": ["与国内企业发生的以欧元计价的销售业务", "与中国银行之间发生的欧元与人民币的兑换业务", "与国内子公司发生的以美元计价结算的购货业务", "与外国子公司发生的以人民币计价结算的购货业务", "", ""], "r": "D", "e": "外币业务是指以外币计价或者结算的交易。选项D是以人民币计价结算，不属于外币业务。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832461", "t": 1, "q": "甲公司为增值税一般纳税人，适用的增值税税率为17％，2008年1月1日购入一台需要安装的机器设备，取得的增值税专用发票上注明的金额为220万元，增值税税额为37.4万元，发生的运杂费为2.6万元，设备安装时，领用企业的原材料一批，其账面成本为10万元，计税价格等于公允价值为12万元，取得时增值税为1.7万元，领用工程物资一批，其成本为20万元，除此之外，发生其他支出为15万元，则该项设备的入账价值为（　）。", "a": ["305", "306.7", "309.04", "307", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832462", "t": 1, "q": "采用借贷记账法时，负债账户的结构特点是（　）", "a": ["借方登记增加、贷方登记减少，期末余额在借方", "借方登记增加、贷方登记减少，期末一般无余额", "借方登记减少、贷方登记增加，期末一般无余额", "借方登记减少、贷方登记增加，期末余额在贷方", "", ""], "r": "D", "e": "负债类账户与资产类账户结构相反，资产借方记增加、贷方记减少，负债则是借方记减少、贷方记增加，且期末余额在贷方。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832463", "t": 1, "q": "利润表中\"税金及附加\"项目不包含的税费是？", "a": ["城市维护建设税", "教育费附加", "增值税", "消费税", "", ""], "r": "C", "e": "税金及附加核算企业经营活动发生的消费税、城市维护建设税、资源税、教育费附加及房产税、土地使用税等相关税费，增值税是价外税，不通过税金及附加核算。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832464", "t": 1, "q": "恒通公司出售设备一台，售价为28万元。该设备的原价为30万元，已提折旧5万元，已计提减值准备3万元。假设不考虑相关税费，本期出售该设备影响当期损益的金额为（　）万元。", "a": ["28", "2", "6", "5", "", ""], "r": "C", "e": "先算设备账面价值，原价30万，折旧5万，减值3万，账面价值为30 - 5 - 3 = 22万。售价28万，出售影响当期损益金额即售价减账面价值，28 - 22 = 6万。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832465", "t": 1, "q": "甲公司对乙公司投资，占乙公司表决权资本的17％，乙公司生产产品依靠甲公司所提供的配方，并规定乙公司不得改变其配方，故甲公司确认对乙公司具有重大影响。此项业务处理体现的会计信息质量要求是（　）要求。", "a": ["相关性", "实质重于形式", "重要性", "谨慎性", "", ""], "r": "B", "e": "甲公司虽持股仅17%，但乙公司生产依赖甲公司配方且不得改变，从实质看甲能对乙重大影响，体现实质重于形式。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832466", "t": 1, "q": "下列项目，属于非货币性资产交换的有（　）。", "a": ["以一批不含增值税的公允价值为50万元的存货换入一项无形资产，同时收到补价为20万元", "以一项账面价值为100万元的固定资产交换一项公允价值为120万元的交易性金融资产，并收到补价20万元", "以一项公允价值为200万元的无形资产交换一项准备持有至到期的债券投资，并且收到补价10万元", "以一项公允价值为300万元的投资性房地产交换了一项账面价值为200万元的可供出售金融资产，且收到补价为75万元", "", ""], "r": "B", "e": "非货币性资产交换判断标准是补价占整个资产交换金额的比例低于25%。A选项，补价比例20÷50 = 40%＞25%，不属于；B选项，补价比例20÷120≈16.67%＜25%，属于；C选项，准备持有至到期的债券投资是货币性资产，不属于；D选项，补价比例75÷300 = 25%，不属于。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832467", "t": 1, "q": "资产负债表的作用是反映企业（　）。", "a": ["某一时点的经营成果", "某一时期的经营成果", "某一时期的财务状况", "某一时点的财务状况", "", ""], "r": "D", "e": "资产负债表是静态报表，反映特定时点财务状况。经营成果由利润表体现，时期数据是动态报表特征，所以答案是反映某一时点财务状况。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832468", "t": 1, "q": "关于损失，下列说法中正确的是（　）。", "a": ["损失是指由企业非日常活动所发生的、会导致所有者权益减少的、与向所有者分配利润无关的经济利益的流出", "损失只能计入所有者权益项目，不能计入当期损益", "损失只能计入当期损益，不能计入所有者权益项目", "损失是指由企业日常活动所发生的，会导致所有者权益减少的经济利益的流出", "", ""], "r": "A", "e": "损失是企业非日常活动导致的，会使所有者权益减少且与分配利润无关的经济利益流出，可能计入当期损益（如营业外支出），也可能计入所有者权益（如其他综合收益）。B、C 说只能计入某一处错误，D 说日常活动错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832469", "t": 1, "q": "哪项不属于记账凭证审核的内容（　）。", "a": ["完整性审核", "可比性审核", "真实性审核", "技术性审核", "", ""], "r": "B", "e": "记账凭证审核内容包括完整性、真实性、技术性等，可比性是会计信息质量要求，并非记账凭证审核内容。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832470", "t": 1, "q": "采用平行结转分步法，在完工产品与在产品之间分配费用，是指在（　）。", "a": ["最后步骤的产成品与广义的在产品之间的费用分配", "前面步骤完工半成品与加工中的在产品，最后步骤产成品与加工中的在产品之间的费用分配", "产成品与月末在产品之间的费用分配", "完工半成品与月末加工中的在产品之间的费用分配", "", ""], "r": "A", "e": "平行结转分步法下完工产品是最后步骤的产成品，在产品是广义在产品，所以是在最后步骤产成品与广义在产品间分配费用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832471", "t": 1, "q": "实行内部成本核算的事业单位，开展专业业务活动及辅助活动发生的应计入劳务或产品成本的各项费用，应先通过（　）科目归集。", "a": ["事业支出", "产成品", "成本费用", "经营支出", "", ""], "r": "C", "e": "实行内部成本核算的事业单位，业务活动成本先在“成本费用”科目归集。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832472", "t": 1, "q": "某企业2009年1月31日银行存款日记账余额为980 000元，银行对账单余额为1 008 000元，经双方核对查明，是由于下列未达账项所致:①企业于1月30日从其他单位收到转账支票一张计50 000元，企业已入账，银行未入账。②企业于1月31日开出转账支票购买原材料68 000元，企业已入账，银行未入账。③银行于1月31日收到其他公司汇给企业的销售款40 000元，银行已入账，企业未入账。④银行于1月31日扣企业借款利息30 000元，企业未收到银行计息单而尚未入账。该企业调整后的银行存款实际余额是（　）元。", "a": ["990 000", "1 018 000", "970 000", "962 000", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832473", "t": 1, "q": "企业期末在产品数量较多，期初期末数量变化较大，各项成本项目所占比重比较均衡，应选择的一种月末划分生产费用的方法是（　）。", "a": ["定额比例法", "约当产量比例法", "在产品按所耗原材料费用计价法", "在产品按定额成本计价法", "", ""], "r": "B", "e": "约当产量比例法适用于产品数量较多，各月在产品数量变化也较大，且生产成本中直接材料成本和直接人工等加工成本的比重相差不大的产品。本题企业情况与之相符。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832474", "t": 1, "q": "甲公司2009年1月1日按面值发行三年期可转换公司债券，每年1月1日付息、到期一次还本的债券，面值总额为15000万元，票面年利率为4％，实际利率为6％。债券包含的负债成份的公允价值为14100万元。甲公司按实际利率法确认利息费用。甲公司发行此项债券时应确认的\"资本公积——其他资本公积\"的金额为（　）万元。", "a": ["851.89", "600", "0", "801.90", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832475", "t": 1, "q": "各种账务处理程序之间的区别在于（　）。", "a": ["会计凭证的种类不同", "编制会计报表的依据不同", "总账的格式不同", "登记总账的程序和方法不同", "", ""], "r": "D", "e": "账务处理程序主要区别在于登记总账的方式，不同账务处理程序登记总账的程序和方法有差异。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832476", "t": 1, "q": "采用分步法计算产品成本时，各步骤成本计算单中的月末在产品成本通常是指？", "a": ["狭义在产品成本", "广义在产品成本", "产成品成本", "半成品成本", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832477", "t": 1, "q": "甲公司的投资性房地产采用公允价值计量模式。2008年7月1日，甲公司将一项固定资产转换为投资性房地产。该固定资产的账面余额为200万元，已提折旧20万元，已经计提的减值准备为10万元。该投资性房地产的公允价值为190万元。转换日投资性房地产的入账价值为（　）万元。", "a": ["200", "170", "190", "180", "", ""], "r": "C", "e": "采用公允价值模式计量的投资性房地产，自用房地产转换为投资性房地产时，应按转换日的公允价值入账。本题中转换日投资性房地产公允价值为190万元，所以入账价值是190万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832478", "t": 1, "q": "下列各项中，说法不正确的是（　）。", "a": ["企业拥有或控制的无形资产都应在每个会计期末进行减值测试", "购买无形资产的价款超过正常信用条件延期支付，实质上具有融资性质，应当以购买价款的现值为基础确定", "对于使用寿命不确定的无形资产，当有证据表明其使用寿命有限时，不需要对以前期间进行追溯调整", "自行开发的无形资产，其成本包括自满足无形资产确认条件后至达到预定用途前所发生的支出总额，但是对于以前期间已费用化的支出不再作调整", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832479", "t": 1, "q": "甲公司以生产经营用的客车和货车交换乙公司生产经营用的C设备和D设备。甲公司换出:客车原值45万元，已计提折旧3万元，公允价值45万元;货车原值37.50万元，已计提折旧10.50万元，公允价值30万元。乙公司换出:C设备原值22.50万元，已计提折旧9万元，公允价值15万元;D设备原值63万元，已计提折旧7.50万元，公允价值60万元。假定该项交换具有商业实质。<br />则甲公司取得的C设备的入账价值为（　）万元。", "a": ["55.20", "63", "15", "60", "", ""], "r": "C", "e": "具有商业实质的非货币性资产交换，换入资产入账价值按公允价值比例分配。甲换出资产公允价值总额为45 + 30 = 75万元，C设备公允价值15万元，占比15÷(15 + 60)=1/5，所以C设备入账价值为75×1/5 = 15万元。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832480", "t": 1, "q": "企业收到并已入账的销货款，但银行尚未入账，由此形成的未达账项，企业会计人员在编制\"银行存款余额调节表\"时，应将（　）。", "a": ["企业银行存款日记账余额方调增", "银行对账单余额方调减", "企业银行存款日记账余额方调减", "银行对账单余额方调增", "", ""], "r": "D", "e": "未达账项是企业已收银行未收，编制“银行存款余额调节表”时，应调增银行对账单余额使其与企业银行存款日记账余额相符。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832481", "t": 1, "q": "下列关于《企业会计准则》的表述，错误的是？", "a": ["提高会计信息的透明度", "适用于所有企业", "保证会计信息质量", "规范企业会计确认、计量和报告行为", "", ""], "r": "B", "e": "《企业会计准则》并非适用于所有企业，比如小企业有专门的《小企业会计准则》。而准则的目的是规范企业会计确认、计量和报告行为，保证会计信息质量，提高会计信息透明度。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832482", "t": 1, "q": "某上市公司在其年度资产负债表日后至财务报告批准报出日前发生的下列事项中，属于调整事项的是（　）。", "a": ["企业日后期间发现资产负债表日之前已经存在的一项合同在资产负债表日变为亏损合同而未作处理", "因报告年度走私而被罚款300万元", "董事会通过现金股利分配方案", "企业在资产负债表日后期间与债务方达成债务重组协议", "", ""], "r": "A", "e": "调整事项是资产负债表日已经存在的情况提供了新的或进一步证据的事项。A选项，日后发现资产负债表日已存在的合同变为亏损合同未处理，属于对资产负债表日已存在情况的补充证据，是调整事项；B选项罚款是日后新发生的事项；C选项现金股利分配方案是日后非调整事项；D选项债务重组协议是日后新发生事项。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832483", "t": 1, "q": "采用分步法核算产品成本时，某步骤狭义在产品是指？", "a": ["本步骤已完工但尚未最终完工的半成品", "本步骤正在加工的在产品", "本步骤正在加工的在产品、本步骤已完工但尚未最终完工的半成品以及后续步骤正在加工的在产品", "本步骤正在加工的在产品和本步骤已完工但尚未最终完工的半成品", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832484", "t": 1, "q": "用盘存法计算原材料定额消耗量，根据\"本期投产数量=本期完工产品数量+期末在产品数量-期初在产品数量\"公式计算本期的投产产品数量时，如果原材料随着生产进度连续投入，在产品需耗用原材料，则公式的期初和期末在产品数量应按原材料消耗定额计算的期初和期末在产品的（　）。", "a": ["计划产量计算", "实际产量计算", "约当产量计算", "实际消耗量计算", "", ""], "r": "C", "e": "当原材料随生产进度连续投入，在产品耗用原材料时，期初和期末在产品由于完工程度不同，不能简单按实际数量计算，需用约当产量将在产品折算为相当于完工产品的数量，这样才能准确计算本期投产产品数量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832485", "t": 1, "q": "投资者投入的长期股权投资，如果合同或协议约定价值不公允，应当按照（　）作为初始投资成本。", "a": ["账面价值", "投资合同或协议约定的价值", "账面余额", "公允价值", "", ""], "r": "D", "e": "投资者投入长期股权投资若合同或协议约定价值不公允，应按公允价值确定初始投资成本，这是为保证会计计量的准确性和可靠性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832486", "t": 1, "q": "应当永久保管的会计档案资料是（　）。", "a": ["月度财务会计报告", "现金日记账", "会计档案销毁清册", "银行存款余额调节表", "", ""], "r": "C", "e": "月度财务会计报告保管10年，现金日记账保管30年，银行存款余额调节表保管10年，而会计档案销毁清册要永久保管。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832487", "t": 1, "q": "下列各项中，不属于事业单位负债的有（　）。", "a": ["应缴预算款", "应交税金", "应缴财政专户款", "暂存款", "", ""], "r": "D", "e": "事业单位负债包括应缴预算款、应交税金、应缴财政专户款等。暂存款是行政单位负债，不属于事业单位负债。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832488", "t": 1, "q": "20×8年甲公司为乙公司的500万元债务提供60％的担保，乙公司因到期无力偿还债务被起诉，至12月31日，法院尚未做出判决，甲公司根据有关情况预计很可能承担部分担保责任。20×9年2月12日甲公司财务报告批准报出之前法院作出判决，甲公司承担全部担保责任，需为乙公司偿还债务的60％，甲公司已执行。以下甲公司的处理中错误的是（　）。", "a": ["20×8年12月31日按照很可能承担的担保责任确认预计负债", "20×8年12月31日对此预计负债作出披露", "20×8年12月31日对此或有负债作出披露", "20×9年2月12日按照资产负债表日后调整事项处理，调整财务报表相关项目", "", ""], "r": "C", "e": "本题中，20×8 年 12 月 31 日甲公司预计很可能承担部分担保责任，应确认预计负债并披露，A、B 选项正确；20×9 年 2 月 12 日在财务报告批准报出前法院判决，此为资产负债表日后调整事项，应调整报表，D 选项正确；预计负债不属于或有负债，C 选项错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832489", "t": 1, "q": "甲公司于20×7年1月1日对乙公司投资900万元作为长期投资，占乙公司有表决权股份的30％，20×8年6月15日甲公司发现该公司对乙公司的投资误用了成本法核算。甲公司20×7年度的财务会计报告已于20×8年4月12日批准报出。甲公司正确的做法是（　）。", "a": ["按重要差错处理，调整20×7年12月31日资产负债表的年初数、20×7年度利润表的上期金额和所有者权益变动表的上年数", "按重要差错处理，调整20×8年12月31日资产负债表的年初数、20×8年度利润表的上期金额和所有者权益变动表的上年数", "按重要差错处理，调整20×8年12月31日资产负债表的期末数、20×8年度利润表的上期金额和所有者权益变动表的本期数", "按非重要差错处理，调整20×8年12月31日资产负债表的期末数、20×8年度利润表的上期金额和所有者权益变动表的本期数", "", ""], "r": "B", "e": "本题属于前期重大会计差错更正问题。甲公司20×8年6月15日发现20×7年投资核算方法误用成本法，且20×7年度财务报告已在20×8年4月12日批准报出。前期重大差错应调整发现当期报表的年初数等相关数据。这里应调整20×8年12月31日资产负债表的年初数、20×8年度利润表的上期金额和所有者权益变动表的上年数。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832490", "t": 1, "q": "S公司对所得税采用资产负债表债务法核算，适用的所得税税率为25％。2007年10月以600万元购入W上市公司的股票，作为短期投资，期末按成本法计价。2008年5月W公司分配2007年度的现金股利，S公司收到现金股利5万元。S公司从2008年1月1日起，按照新准则的规定，将其划分为交易性金融资产，期末按照公允价值计量。2007年末该股票公允价值为450万元，该会计政策变更对S公司2008年的期初留存收益影响为（　）万元。", "a": ["－150", "－112.5", "－108.75", "－145", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832491", "t": 1, "q": "A公司为增值税一般纳税企业，适用的增值税税率为17％，委托B公司（B公司为小规模纳税人）加工材料一批，A公司发出原材料实际成本为1000万元。完工收回时支付加工费200万元，另行支付增值税12万元（已收到B公司委托税务机关代开的增值税专用发票）。该材料属于消费税应税物资，A公司收回材料后继续用于加工应税消费品，适用的消费税税率为10％。该材料A公司已收回，则该委托加工材料收回后的入账价值是（　）万元。", "a": ["1 370", "1 220", "1 200", "1 300", "", ""], "r": "C", "e": "委托加工物资收回后用于继续加工应税消费品，消费税不计入成本，增值税小规模纳税人代开专票上的增值税可抵扣也不计入成本。入账价值为发出原材料成本加加工费，即1000 + 200 = 1200万元。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832492", "t": 1, "q": "甲产品月末在产品只计算原材料费用。该产品月初在产品原材料费用为3600元;本月发生的原材料费用2100元。原材料在生产开始时一次投入。本月完工产品200件，月末在产品100件。据此计算甲产品本月末在产品原材料费用为（　）元。", "a": ["5700", "2400", "3800", "1900", "", ""], "r": "D", "e": "因原材料在生产开始时一次投入，所以在产品和完工产品负担相同的原材料费用。先算出原材料总费用，再按完工产品和在产品数量比例分配，在产品占比为「test/yiwen_img/importSubject/2034528632185163776.png」，总费用是3600+2100 = 5700元，那么在产品原材料费用为「test/yiwen_img/importSubject/2034528632415850496.png」元。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832493", "t": 1, "q": "企业采用月末一次加权平均法计算发出存货成本，本月期初存货数量为100件，单价5元;本月购入存货200件，单价6元;本月发出存货200件。则本月发出存货成本为？", "a": ["1150元", "1200元", "1100元", "1000元", "", ""], "r": "A", "e": "先算加权平均单价，（100×5 + 200×6）÷（100 + 200） = 1700÷300 = 17 / 3 元。发出200件，成本就是 200×17 / 3≈1133.33 元，但题中应取近似值计算。（100×5 + 200×6）÷（100 + 200）×200 = 1133.33…≈1150 元。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832494", "t": 1, "q": "资产按照预计从其持续使用和最终处置中所产生的未来净现金流入量的折现金额计量，其会计计量属性是（　）。", "a": ["历史成本", "公允价值", "可变现净值", "现值", "", ""], "r": "D", "e": "现值是指资产按照预计从其持续使用和最终处置中所产生的未来净现金流入量的折现金额计量。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832495", "t": 1, "q": "品种法成本计算程序中，最后一步是（　）", "a": ["计算并结转完工产品成本", "分配各种要素费用", "分配辅助生产费用", "开设成本明细账", "", ""], "r": "A", "e": "品种法成本计算程序一般是先开设成本明细账，再分配各种要素费用、辅助生产费用等，最后计算并结转完工产品成本。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832496", "t": 1, "q": "根据《企业会计准则》，下列交易或事项中，应确认为企业资产的是？", "a": ["计划购买的原材料", "经营租赁租入的设备", "预收客户的货款", "委托加工物资", "", ""], "r": "D", "e": "资产是指企业过去的交易或者事项形成的、由企业拥有或者控制的、预期会给企业带来经济利益的资源。A选项计划购买未实际发生，不符合“过去的交易或事项”；B选项经营租赁租入设备企业不拥有所有权和控制权；C选项预收货款是负债；D选项委托加工物资是企业过去交易形成且拥有控制权、能带来经济利益的资源。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832497", "t": 1, "q": "某股份有限公司成立于2008年1月1日，主营业务是销售笔记本电脑，期末存货采用成本与可变现净值孰低法计价，成本与可变现净值的比较采用单项比较法。该公司2008年12月31日A、B、C三种品牌的笔记本电脑成本分别为130万元、221万元、316万元;可变现净值分别为128万元、215万元、336万元。该公司当年12月31日存货的账面价值为（　）万元。", "a": ["679", "659", "667", "687", "", ""], "r": "B", "e": "单项比较法下，存货按成本与可变现净值较低者计价。A 成本 130 万、可变现净值 128 万，按 128 万计；B 成本 221 万、可变现净值 215 万，按 215 万计；C 成本 316 万、可变现净值 336 万，按 316 万计。账面价值为 128+215+316 = 659 万。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832498", "t": 1, "q": "采用分步法计算产品成本时，若采用逐步综合结转分步法，需要进行成本还原的原因是？", "a": ["各步骤成本计算单格式不同", "不能准确计算各步骤半成品成本", "各步骤半成品成本结转方式不同", "无法正确反映产品成本的原始构成项目", "", ""], "r": "D", "e": "逐步综合结转分步法下，上一步骤半成品成本综合转入下一步骤，使得最终产品成本不能体现原始成本项目构成，所以要成本还原。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832499", "t": 1, "q": "下列哪个项目在\"以前年度损益调整\"科目的借方反映（　）", "a": ["调增本期管理费用", "调整以前年度损益而相应增加的投资收益", "调整以前年度损益而需调增的财务费用", "调整以前年度损益而相应减少管理费用", "", ""], "r": "C", "e": "“以前年度损益调整”借方登记调整减少以前年度利润或增加以前年度亏损，以及由于以前年度损益调整增加的所得税费用。调增以前年度的财务费用，会使以前年度利润减少，应在“以前年度损益调整”借方反映。选项A是调增本期管理费用，不通过“以前年度损益调整”；选项B调整增加以前年度投资收益应在贷方；选项D调减以前年度管理费用应在贷方。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832500", "t": 1, "q": "恒通公司和远华公司均为增值税一般纳税人，适用的增值税税率为17％。2008年6月1日，恒通公司委托远华公司销售300件商品，协议价为每件80元（不含税），该商品的成本为50元。代销协议约定，远华公司在取得代销商品后，无论是否能够卖出、是否获利，均与恒通公司无关。商品已经发出，货款已经收到，则恒通公司在2008年6月1日确认的收入为多少元？", "a": ["15000", "24000", "0", "28080", "", ""], "r": "B", "e": "本题中恒通公司委托远华公司销售商品，协议约定远华公司无论是否能够卖出、是否获利，均与恒通公司无关，这种情况符合商品销售收入的确认条件。应按照协议价确认收入，商品有300件，协议价每件80元，所以确认的收入为300×80 = 24000元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832501", "t": 1, "q": "现金流量表中，吸收投资收到的现金属于？", "a": ["筹资活动产生的现金流量", "投资活动产生的现金流量", "经营活动产生的现金流量", "不涉及现金流量的业务", "", ""], "r": "A", "e": "吸收投资是企业筹集资金的行为，所以吸收投资收到的现金属于筹资活动产生的现金流量。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832502", "t": 1, "q": "甲公司8月1日A材料结存100件，单价10元，8月6日发出A材料20件，8月12日购进A材料320件，单价6元;8月23日发出A材料100件。该公司对A材料采用移动加权平均法计价，8月末A材料的实际成本为（　）元。", "a": ["2 020", "2 720", "2 040", "2 120", "", ""], "r": "C", "e": "本题可先根据移动加权平均法计算每次发出材料后剩余材料的单位成本，再计算出8月末A材料的实际成本。### 步骤一：计算8月6日发出材料后剩余材料的成本和单位成本8月1日A材料结存100件，单价10元，则结存成本为「test/yiwen_img/importSubject/2034528632503930880.png」元。8月6日发出20件，此时剩余材料数量为100 - 20 = 80件，剩余材料成本为「test/yiwen_img/importSubject/2034528632617177088.png」元。### 步骤二：计算8月12日购进材料后的移动加权平均单位成本8月12日购进320件，单价6元，则购进成本为「test/yiwen_img/importSubject/2034528632705257472.png」元。此时材料总数量为80 + 320 = 400件，总成本为800 + 1920 = 2720元。根据移动加权平均法，此时材料的单位成本为「test/yiwen_img/importSubject/2034528632814309376.png」元/件。 ### 步骤三：计算8月23日发出材料后剩余材料的数量和成本8月23日发出100件，则剩余材料数量为400 - 100 = 300件。由于采用移动加权平均法，剩余材料成本为「test/yiwen_img/importSubject/2034528632927555584.png」元，即8月末A材料的实际成本为2040元。综上，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832503", "t": 1, "q": "下列关于现金流量表中现金的表述，正确的是？", "a": ["仅指库存现金", "包括库存现金、银行存款，但不包括其他货币资金", "包括库存现金、银行存款和其他货币资金，不包括现金等价物", "包括库存现金、银行存款、其他货币资金以及现金等价物", "", ""], "r": "D", "e": "现金流量表中的现金概念范围较广，涵盖了库存现金、银行存款、其他货币资金以及现金等价物。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832504", "t": 1, "q": "《企业会计准则》规定，企业应当以（　）为基础进行会计确认、计量和报告。", "a": ["权责发生制", "实地盘存制", "永续盘存制", "收付实现制", "", ""], "r": "A", "e": "企业会计核算以权责发生制为基础，它能更准确反映企业某一期间的经营成果和财务状况。实地盘存制和永续盘存制是存货的盘存方法；收付实现制是行政事业单位预算会计采用的基础。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832505", "t": 1, "q": "A公司于2008年1月1日从银行取得一笔专门用于工程建设的长期借款，本金1000万元，年利率为10%，期限3年，每年末付息，到期还本。工程于2008年1月1日开工建设。2008年资产支出如下:<br />①1月1日支出100万元;<br />②5月1日支出100万元;<br />③10月1日支出100万元。<br />闲置资金因购买国债可取得0.2%的月收益，则2008年借款费用资本化金额为（　）万元。", "a": ["19.4", "100", "80.6", "80.2", "", ""], "r": "C", "e": "本题可先计算出专门借款的利息，再计算出闲置资金的收益，最后用专门借款利息减去闲置资金收益得到借款费用资本化金额。### 步骤一：计算专门借款的利息根据公式“利息=本金「test/yiwen_img/importSubject/2034528633024024576.png」年利率”，已知本金为1000万元，年利率为「test/yiwen_img/importSubject/2034528633137270784.png」，则2008年专门借款利息「test/yiwen_img/importSubject/2034528633212768256.png」（万元）。### 步骤二：计算闲置资金的收益 1月1日支出100万元后，闲置资金为1000 - 100 = 900万元，1月1日到4月30日共4个月，这4个月闲置资金收益为「test/yiwen_img/importSubject/2034528633313431552.png」万元。 5月1日支出100万元后，闲置资金为900 - 100 = 800万元，5月1日到9月30日共5个月，这5个月闲置资金收益为「test/yiwen_img/importSubject/2034528633405706240.png」万元。 10月1日支出100万元后，闲置资金为800 - 100 = 700万元，10月1日到12月31日共3个月，这3个月闲置资金收益为「test/yiwen_img/importSubject/2034528633510563840.png」万元。将上述各段闲置资金收益相加，可得闲置资金总收益为7.2 + 8 + 4.2 = 19.4万元。### 步骤三：计算借款费用资本化金额根据公式“借款费用资本化金额=专门借款利息-闲置资金收益”，将前面计算出的专门借款利息100万元和闲置资金收益19.4万元代入公式，可得借款费用资本化金额为100 - 19.4 = 80.6万元。综上，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528638761832506", "t": 1, "q": "企业某种库存商品因自然损耗造成的短缺，经批准核销时，应借记（　）账户。", "a": ["管理费用", "待处理财产损溢", "营业外支出", "其他应收款", "", ""], "r": "A", "e": "自然损耗造成的存货短缺，属于一般经营损失，批准核销时应计入管理费用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780032", "t": 2, "q": "下列情况下，企业可将其他资产转换为投资性房地产的有（　）。", "a": ["经营出租的土地使用权收回改为自用", "原自用生产线停止自用改为出租", "房地产企业将开发的准备出售的商品房改为经营出租", "自用建筑物停止自用改为经营出租", "", ""], "r": "CD", "e": "投资性房地产是指为赚取租金或资本增值，或两者兼有而持有的房地产。A选项是从投资性房地产转为自用；B选项生产线不属于房地产；C是存货转投资性房地产；D是自用房地产转投资性房地产，C、D符合转换为投资性房地产的情况。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780033", "t": 2, "q": "下列项目中，不构成合同成本的有（　）。", "a": ["从合同签订开始至合同完成止所发生的、与执行合同有关的间接费用", "从合同签订开始至合同完成止所发生的、与执行合同有关的直接费用", "合同订立前发生的费用", "因订立合同而发生的有关费用", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780034", "t": 2, "q": "下列有关行政事业单位的结余，说法正确的是（　）。", "a": ["事业结余和经营结余年度终了时都要转入结余分配科目，结转后科目无余额", "行政单位的结余包括事业结余和经营结余", "事业单位期末要将未分配的结余转入\"事业基金——一般基金\"科目", "结余是一定期间各项收入与支出相抵后的余额", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780035", "t": 2, "q": "下列各项中，属于为购建或者生产符合资本化条件的资产而发生资产支出的有（　）。", "a": ["计提在建工程人员职工薪酬", "向客户赊购工程项目所需用的工程物资，形成的债务不带息", "以原材料换入工程项目所需用的工程物资", "将自产产品用于工程项目", "", ""], "r": "CD", "e": "资产支出包括支付现金、转移非现金资产、承担带息债务形式所发生的支出。A 计提职工薪酬未实际支出；B 赊购不带息债务不属于资产支出；C 以原材料换工程物资是转移非现金资产；D 将自产产品用于工程是转移非现金资产。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780036", "t": 2, "q": "企业利润表中\"营业利润\"项目的计算，涉及的内容有？", "a": ["营业外收入与营业外支出", "税金及附加", "营业收入与营业成本", "销售费用与管理费用", "", ""], "r": "BCD", "e": "营业利润=营业收入 - 营业成本 - 税金及附加 - 销售费用 - 管理费用等。营业外收入与营业外支出不影响营业利润。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780037", "t": 2, "q": "资产负债表中，可根据总账科目余额直接填列的项目有？", "a": ["短期借款", "实收资本", "资本公积", "货币资金", "", ""], "r": "ABC", "e": "短期借款、实收资本、资本公积可直接根据总账科目余额填列，货币资金需根据“库存现金”“银行存款”“其他货币资金”总账科目余额合计数填列。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780038", "t": 2, "q": "对于涉及多项资产、收到补价的非货币性资产交换（具有商业实质），在确定换入资产的入账价值时需要考虑的因素有（　）。", "a": ["换出资产的销项税", "换入资产的进项税", "收到对方支付的补价", "换入资产的公允价值", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780039", "t": 2, "q": "下列各项中，不应计入交易性金融资产的入账价值的有（　）。", "a": ["支付的印花税", "支付的手续费", "已宣告但尚未发放的现金股利", "取得时交易性金融资产的公允价值", "", ""], "r": "ABC", "e": "交易性金融资产入账价值是取得时的公允价值，支付的印花税、手续费计入投资收益，已宣告但尚未发放的现金股利计入应收股利。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780040", "t": 2, "q": "销售商品需要同时满足以下哪些条件，才可以确认收入？", "a": ["企业既没有保留通常与所有权相联系的继续管理权，也没有对已售出的商品实施有效控制", "企业已将商品所有权上的主要风险和报酬转移给购货方", "相关的经济利益很可能流入企业", "收入的金额能够可靠地计量且相关的已发生的成本和或将发生的成本能够可靠地计量", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780041", "t": 2, "q": "长期股权投资成本法的适用范围包括（　）。", "a": ["投资企业对被投资企业不具有共同控制或重大影响，但在活跃市场中有报价、公允价值能够可靠计量的长期股权投资", "投资企业对被投资企业具有共同控制的长期股权投资", "投资企业能够对被投资企业实施控制的长期股权投资", "投资企业对被投资企业不具有共同控制或重大影响，并且在活跃市场中没有报价、公允价值不能可靠计量的长期股权投资", "", ""], "r": "CD", "e": "成本法适用于控制和不具重大影响且无报价、公允价值不可靠计量的情况。A选项有报价且公允价值能可靠计量通常按金融资产核算；B选项共同控制用权益法。C选项能实施控制、D选项不具共同控制或重大影响且无报价、公允价值不可靠计量适用成本法。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780042", "t": 2, "q": "关于母公司在报告期增减子公司在合并利润表的反映，下列说法中正确的有（　）。", "a": ["因非同一控制下企业合并增加的子公司，在编制合并利润表时，应当将该子公司购买日至报告期末的收入、费用、利润纳入合并利润表", "因非同一控制下企业合并增加的子公司，在编制合并利润表时，应当将该子公司合并当期期初至报告期末的收入、费用、利润纳入合并利润表", "母公司在报告期内处置子公司，应当将该子公司期初至处置日的收入、费用、利润纳入合并利润表", "因同一控制下企业合并增加的子公司，在编制合并利润表时，应当将该子公司合并当期期初至报告期末的收入、费用、利润纳入合并利润表", "", ""], "r": "ACD", "e": "非同一控制下企业合并增加子公司，从购买日起纳入合并利润表；处置子公司应将期初至处置日的收入等纳入；同一控制下企业合并增加子公司，从合并当期期初至报告期末纳入。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780043", "t": 2, "q": "下列关于财务报表分析的说法，正确的有？", "a": ["可以评价企业的财务状况和经营成果", "有助于预测企业未来的发展趋势", "通过比率分析、趋势分析等方法进行", "仅对资产负债表和利润表进行分析", "", ""], "r": "ABC", "e": "财务报表分析可通过比率、趋势等方法，对资产负债表、利润表、现金流量表等全面分析，能评价企业财务状况和经营成果，还助于预测未来发展趋势。D选项仅针对两表分析说法错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780044", "t": 2, "q": "下列关于土地使用权的说法，正确的有（　）。", "a": ["企业外购的房屋建筑物，支付的价款包含土地及建筑物的价值的，应全部确认为固定资产", "土地使用权用于自行开发建造办公楼时，相关的土地使用权账面价值不转入在建工程成本，在工程完工时直接转入固定资产", "房地产开发企业取得的土地使用权用于建造对外出售的房屋建筑物，相关的土地使用权应当计入所建造的房屋建筑物成本", "土地使用权通常应确认为无形资产", "", ""], "r": "CD", "e": "A选项，应按合理方法分配，分别确认为固定资产和无形资产；B选项，土地使用权不转入在建工程，也不转入固定资产，仍作为无形资产核算；C选项，房地产企业用于建造对外出售房屋的土地使用权计入房屋成本；D选项，土地使用权一般确认为无形资产。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780045", "t": 2, "q": "下列对账项目中，属于账实核对的有（　）", "a": ["总分类账与所属明细分类账簿核对", "债权债务明细账与对方单位账簿记录核对", "银行存款日记账与银行对账单核对", "会计账簿记录与会计凭证核对", "", ""], "r": "BC", "e": "账实核对是指各项财产物资、债权债务等账面余额与实有数额之间的核对。A选项是账账核对；D选项是账证核对。B选项债权债务明细账与对方单位账簿记录核对、C选项银行存款日记账与银行对账单核对，均是账面与实际情况的核对，属于账实核对。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780046", "t": 2, "q": "根据《企业会计准则》，下列经济业务处理符合谨慎性要求的有？", "a": ["对售出商品可能发生的保修义务确认预计负债", "对可能发生的资产减值损失计提减值准备", "高估收入，低估费用", "对固定资产采用加速折旧法计提折旧", "", ""], "r": "ABD", "e": "谨慎性要求企业不应高估资产或者收益、低估负债或者费用。A选项对售出商品保修义务确认预计负债，B选项对可能减值资产计提减值准备，D选项固定资产加速折旧都是合理预估风险和损失，符合谨慎性。而C选项高估收入、低估费用违背了谨慎性要求。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780047", "t": 2, "q": "下列项目中不属于投资性房地产的有（　）。", "a": ["持有并准备增值后转让的土地使用权", "已出租的生产线", "按照国家有关规定认定的闲置土地", "经营租赁方式租入的建筑物再出租的", "", ""], "r": "BCD", "e": "投资性房地产包括已出租的土地使用权、持有并准备增值后转让的土地使用权和已出租的建筑物等。B选项生产线不属于房地产；C选项闲置土地不符合投资性房地产定义；D选项租入再出租，企业没有所有权，不属于投资性房地产。A属于投资性房地产。 答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780048", "t": 2, "q": "在我国的会计实务中，下列项目中构成企业存货实际成本的有（　）。", "a": ["收购未税矿产品代扣代缴的资源税", "入库后的挑选整理费", "小规模纳税人购货时的增值税进项税额", "运输途中的合理损耗", "", ""], "r": "ACD", "e": "A项收购未税矿产品代扣代缴的资源税计入存货成本；C项小规模纳税人进项税不能抵扣，计入存货成本；D项运输途中合理损耗是存货成本一部分。而B项入库后的挑选整理费应计入当期损益，不计入存货成本。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780049", "t": 2, "q": "对投资性房地产的后续计量，下列说法中正确的是（　）。", "a": ["企业只能采用公允价值模式对投资性房地产进行后续计量", "投资性房地产的后续计量模式一经确定不得随意变更", "企业选择采用公允价值模式对投资性房地产进行后续计量的，以后期间也可采用成本模式对投资性房地产进行后续计量", "企业通常应当采用成本模式对投资性房地产进行后续计量，也可采用公允价值模式对投资性房地产进行后续计量", "", ""], "r": "BD", "e": "企业通常应采用成本模式计量，也能采用公允价值模式，且后续计量模式一经确定不得随意变更，从公允价值模式转成本模式不被允许。A 说只能用公允价值模式错误；C 公允价值模式不能再转成本模式，错误。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780050", "t": 2, "q": "企业现金流量表补充资料中，将净利润调节为经营活动现金流量时，需要加回的项目有？", "a": ["固定资产折旧", "处置固定资产的净收益", "无形资产摊销", "资产减值准备", "", ""], "r": "ACD", "e": "固定资产折旧、无形资产摊销、资产减值准备在计算净利润时已扣除，但未产生实际现金流出，所以调节为经营活动现金流量时需加回；处置固定资产净收益增加了净利润，但不属于经营活动现金流量，应减去。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780051", "t": 2, "q": "运用借贷记账法编制会计分录时，可以编制（　）", "a": ["一借多贷的分录", "多借多贷的分录", "多借一贷的分录", "一借一贷的分录", "", ""], "r": "ABCD", "e": "借贷记账法下，会计分录可以是一借一贷、一借多贷、多借一贷和多借多贷。ABCD选项都符合要求。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780052", "t": 2, "q": "下列关于建造合同说法正确的有（　）", "a": ["如果建造合同的结果能够可靠地估计，企业应当根据完工百分比法在资产负债表日确认合同收入和费用", "建造合同成本包括从合同签订日至合同完成止所发生的，与执行合同有关的直接费用和间接费用", "建造合同收入包括合同中规定的初始收入和因合同变更、索赔形成的收入，因奖励形成的收入不属于建造合同收入，在发生时，直接计入营业外收入", "建造合同分为两类，一类是固定造价合同，另一类是成本加成合同", "", ""], "r": "ABD", "e": "A选项，完工百分比法是可靠估计时确认合同收入和费用的常用方法；B选项，建造合同成本涵盖执行合同相关的直接和间接费用；D选项，建造合同主要就是固定造价合同和成本加成合同两类。而C选项，因奖励形成的收入属于建造合同收入，并非计入营业外收入。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780053", "t": 2, "q": "在下列项目中，应计入利润表中\"营业外收入\"项目的有（　）。", "a": ["出口退税", "接受现金捐赠", "收到先征后返的增值税", "无法支付的应付账款", "", ""], "r": "BCD", "e": "出口退税冲减“应交税费——应交增值税（出口退税）”，不属于营业外收入；接受现金捐赠、收到先征后返增值税、无法支付的应付账款都属于企业非日常活动产生的经济利益流入，应计入营业外收入。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780054", "t": 2, "q": "下列组织可以作为一个会计主体进行核算的有（　）。", "a": ["母公司及其子公司组成的企业集团", "分公司", "股份有限公司", "合伙企业", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780055", "t": 2, "q": "某企业在财产清查中，发现短缺设备一台，账面原值30000元，已计提折旧10000元，在报经批准前企业应作会计分录的借方为（　）", "a": ["营业外支出 20000元", "待处理财产损溢 20000元", "待处理财产损溢 30000元", "累计折旧 10000元", "", ""], "r": "BD", "e": "设备短缺先通过“待处理财产损溢”核算，账面原值30000元，已提折旧10000元，净值20000元计入“待处理财产损溢”借方，同时冲减“累计折旧”。答案选BD。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780056", "t": 2, "q": "企业现金流量表补充资料中，将净利润调节为经营活动现金流量时，需要加回的项目有？", "a": ["固定资产折旧", "无形资产摊销", "资产减值准备", "处置固定资产的净收益", "", ""], "r": "ABC", "e": "ABC项虽影响净利润但不影响经营活动现金流量，所以在将净利润调节为经营活动现金流量时需加回；D项处置固定资产净收益是投资活动产生的，不属于经营活动，且已在净利润中体现，应从净利润中减去。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780057", "t": 2, "q": "企业进行财务报表分析时，分析长期偿债能力的指标有？", "a": ["产权比率", "速动比率", "利息保障倍数", "资产负债率", "", ""], "r": "ACD", "e": "速动比率是衡量短期偿债能力指标，产权比率、利息保障倍数、资产负债率是衡量长期偿债能力指标。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780058", "t": 2, "q": "下列项目中属于调增项目的是（　）。", "a": ["银行已付，企业未付", "银行已收，企业未收", "企业已收，银行未收", "企业已付，银行未付", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780059", "t": 2, "q": "远航公司和长江公司均为增值税一般纳税人，适用的增值税税率17％。长江公司以一项无形资产换入远航公司的一批库存商品。该项无形资产的账面原价为800万元，已累计摊销120万元，已计提减值准备40万元，其公允价值为600万元，长江公司支付给远航公司55.2万元补价。远航公司的库存商品账面成本为500万元，不含增值税的公允价值和计税价格均为560万元。长江公司用银行存款支付处置无形资产发生的相关税费3万元。假设该交换具有商业实质（不考虑运费的增值税抵扣和换出设备的增值税因素）。则下列说法正确的有（　）。", "a": ["长江公司换入库存商品的入账价值为560万元", "镑江公司由于该项非货币性资产交换产生的损益为40万元", "远航公司换入无形资产的入账价值为600万元", "远航公司由于该项非货币性资产交换产生的损益为60万元", "", ""], "r": "ACD", "e": "具有商业实质且换入或换出资产公允价值能可靠计量，应以换出资产公允价值为基础计量换入资产成本。长江公司换入库存商品入账价值=换出资产公允价值600 - 收到补价55.2 - 可抵扣进项税560×17% = 560万元；长江公司损益=600 -（800 - 120 - 40）- 3 = -43万元；远航公司换入无形资产入账价值=换出资产公允价值560 + 销项税560×17% + 收到补价55.2 = 600万元；远航公司损益=560 - 500 = 60万元。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780060", "t": 2, "q": "对长期股权投资采用权益法核算时，当被投资企业发生的下列事项（　），投资企业应该调整长期股权投资账面价值。", "a": ["计提盈余公积", "宣告分配现金股利", "实现净利润", "购买固定资产", "", ""], "r": "BC", "e": "权益法下，投资企业按应享有或分担被投资单位实现净损益等的份额调整长期股权投资账面价值。计提盈余公积是被投资企业所有者权益内部变动，不影响投资企业长期股权投资；购买固定资产属于资产内部变动，也不影响。宣告分配现金股利，投资企业应减少长期股权投资账面价值；实现净利润，投资企业应增加长期股权投资账面价值。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780061", "t": 2, "q": "下列关于投资性房地产后续计量模式的变更，正确的表述是（　）", "a": ["成本模式转为公允价值模式的，应当作为会计政策变更处理", "已采用公允价值模式计量的投资性房地产，不得从公允价值模式转为成本模式", "企业对投资性房地产的计量模式一经确定，不得随意变更", "计量模式变更时公允价值与账面价值的差额，调整期初留存收益（未分配利润和盈余公积）", "", ""], "r": "ABCD", "e": "投资性房地产计量模式变更有严格规定，成本转公允按会计政策变更处理，已用公允模式不能再转成本模式，且计量模式确定后不得随意变更，成本转公允时差额调期初留存收益。ABCD表述均正确。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780062", "t": 2, "q": "下列各项中，符合会计准则规定的会计政策变更的有（　）。", "a": ["本期发生的交易或事项与以前相比具有本质差别而采用新的会计政策", "对初次发生的事项采用新的会计政策", "为提供更可靠、更相关的信息采用新的会计政策", "根据会计准则、规章的要求而变更会计政策", "", ""], "r": "CD", "e": "会计政策变更需有合理原因，A选项交易有本质差别、B选项初次发生事项采用新政策都不属于会计政策变更；C是为提高信息质量变更，D是按准则要求变更，这两种属于会计政策变更。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034528641156780063", "t": 2, "q": "关于会计要素中的资产，下列说法正确的有？", "a": ["资产预期会给企业带来经济利益", "资产是企业过去的交易或者事项形成的", "融资租入的固定资产应视为企业资产核算", "待处
