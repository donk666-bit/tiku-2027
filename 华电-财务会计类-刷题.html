法是？", "a": ["在产品按所耗直接材料成本计价法", "在产品按固定成本计价法", "约当产量比例法", "不计算在产品成本法", "", ""], "r": "A", "e": "在产品按所耗直接材料成本计价法适用于月末在产品数量较多、各月在产品数量变化较大，且原材料费用在成本中所占比重较大的情况。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971308", "t": 1, "q": "下列关于资产负债表中\"应收票据\"项目填列的表述，正确的是？", "a": ["根据\"应收票据\"科目期末余额减去坏账准备科目中相关坏账准备期末余额后的净额填列", "根据\"应收票据\"总账科目余额直接填列", "根据\"应收票据\"和\"应付票据\"科目余额合计填列", "根据\"应收票据\"科目所属明细科目余额分析填列", "", ""], "r": "A", "e": "资产负债表中“应收票据”按其账面余额减去坏账准备后的净额填列。B直接填列错误；C不应与“应付票据”合计；D不是按所属明细科目余额分析填列。所以答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971309", "t": 1, "q": "A公司为建造厂房于2007年4月1日从银行借入2000万元专门借款，借款期限为2年，年利率为6％。2007年7月1日，A公司采取出包方式委托B公司为其建造该厂房，并预付了1000万元工程款，厂房实体建造工作于当日开始。该工程因发生施工安全事故在2007年8月1日至11月30日中断施工，12月1日恢复正常施工，至年末工程尚未完工。假设闲置的1000万元借款每月产生2万元的收益，则该项厂房建造工程在2007年度应予资本化的利息金额为（　）万元。", "a": ["15", "17", "16", "18", "", ""], "r": "C", "e": "本题可根据借款费用资本化的条件，结合闲置资金收益来计算应予资本化的利息金额。### 步骤一：确定资本化期间借款费用资本化需同时满足资产支出已经发生、借款费用已经发生、为使资产达到预定可使用或者可销售状态所必要的购建或者生产活动已经开始这三个条件。本题中，2007年7月1日厂房实体建造工作开始且预付了工程款，同时借款费用已发生，所以资本化开始时间为7月1日。工程在2007年8月1日至11月30日中断施工，属于非正常中断且连续超过3个月，这期间应暂停资本化。12月1日恢复正常施工，所以2007年资本化期间为7月和12月，共2个月。### 步骤二：计算资本化利息专门借款利息资本化金额 = 专门借款当期实际发生的利息费用 - 尚未动用的借款资金存入银行取得的利息收入或者进行暂时性投资取得的投资收益。专门借款当期实际发生的利息费用 = 2000×6%×2÷12 = 20（万元）闲置资金收益 = 2×2 = 4（万元）则该项厂房建造工程在2007年度应予资本化的利息金额 = 20 - 4 = 16（万元）综上，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971310", "t": 1, "q": "关于金融资产的重分类，下列说法中正确的是（　）。", "a": ["交易性金融资产和持有至到期投资之间不能进行重分类", "交易性金融资产在符合一定条件时可以和贷款进行重分类", "可供出售金融资产与持有至到期投资之间的重分类需满足特定条件", "交易性金融资产和可供出售金融资产之间可以进行重分类", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971311", "t": 1, "q": "下列各科目中，年终不转入\"事业结余\"科目的有（　）。", "a": ["\"事业支出\"科目", "\"拨出经费\"科目", "\"拨入专款\"科目", "\"财政补助收入\"科目", "", ""], "r": "C", "e": "“拨入专款”年终应视情况处理，一般不转入“事业结余”，而是按规定用途使用后如有结余可能留归本单位或上缴等；“事业支出”“拨出经费”“财政补助收入”年终都要转入“事业结余”。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971312", "t": 1, "q": "企业对以公允价值模式进行后续计量的投资性房地产取得的租金收入，应该贷记（　）科目。", "a": ["投资收益", "公允价值变动损益", "其他业务收入", "营业外收入", "", ""], "r": "C", "e": "投资性房地产租金收入属于日常经营活动收入，应计入其他业务收入。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971313", "t": 1, "q": "远航公司为增值税一般纳税人，采用自营方式建造一条生产线，实际领用工程物资600万元。另外领用本公司自产的产品一批，账面价值为130万元，未计提存货跌价准备，公允价值和计税价格为160万元，该产品适用的增值税税率为17％，发生的在建工程人员工资和福利费分别为200万元和30万元。另外发生的其他相关支出为6.4万元，假定该生产线已达到预定可使用状态;不考虑除增值税以外的其他相关税费。该厂房的入账价值为（　）万元。", "a": ["990", "960", "993.6", "1017.2", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971314", "t": 1, "q": "现金流量表中，“分配股利、利润或偿付利息支付的现金”属于？", "a": ["投资活动产生的现金流量", "筹资活动产生的现金流量", "经营活动产生的现金流量", "不涉及现金流量的项目", "", ""], "r": "B", "e": "分配股利、利润或偿付利息与企业的筹资活动相关，是企业在筹资过程中发生的现金流出。所以“分配股利、利润或偿付利息支付的现金”属于筹资活动产生的现金流量。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971315", "t": 1, "q": "下列各项收入中，不属于工业企业的其他业务收入的是（　）。", "a": ["企业销售原材料取得的收入", "企业处置投资性房地产取得的收入", "出租无形资产所取得的收入", "出售固定资产取得的净收益", "", ""], "r": "D", "e": "其他业务收入是日常活动产生的，出售固定资产不属于日常活动。答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971316", "t": 1, "q": "下列错误中能通过试算平衡查找的有（　）。", "a": ["应借应贷账户中借贷方向颠倒", "应借应贷账户中借贷金额不相等", "某项经济业务未记账", "某项经济业务重复记账", "", ""], "r": "B", "e": "试算平衡依据是“有借必有贷，借贷必相等”。选项A借贷方向颠倒不影响借贷金额平衡；选项C未记账、选项D重复记账也不影响借贷金额平衡。而选项B借贷金额不相等会破坏试算平衡，能通过试算平衡查找。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971317", "t": 1, "q": "（　）是按照经济业务发生先后顺序逐日逐笔登记的账簿。", "a": ["明细账", "分类账", "备查账", "序时账", "", ""], "r": "D", "e": "序时账就是按经济业务发生先后顺序逐日逐笔登记的账簿。而明细账是按明细科目登记；分类账是对经济业务进行分类登记；备查账是对某些在序时账和分类账等主要账簿中都不予登记或登记不够详细的经济业务进行补充登记。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971318", "t": 1, "q": "采用品种法计算产品成本时，如果企业生产多种产品，制造费用在分配后应计入各产品成本计算单的？", "a": ["直接材料项目", "直接人工项目", "制造费用项目", "管理费用项目", "", ""], "r": "C", "e": "制造费用分配后应计入产品成本计算单的制造费用项目。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971319", "t": 1, "q": "2008年3月1日，甲公司购入一幢建筑物用于出租，取得发票上注明的价款为300万元，款项以银行存款支付。购入该建筑物发生的契税为5万元也以银行存款支付。该投资性房地产的入账价值为（　）万元。", "a": ["300", "295", "305", "5", "", ""], "r": "C", "e": "投资性房地产入账价值包含购买价款和相关税费。本题中购买价款300万元，契税5万元，所以入账价值为300 + 5 = 305万元。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971320", "t": 1, "q": "某企业以银行存款偿还到期的短期借款5000元，同时支付本期借款利息300元，正确的会计分录是（　）。", "a": ["借:短期借款5300<br />贷:银行存款5300", "借:短期借款5000<br />财务费用300<br />贷:银行存款5300", "借:应付账款5300<br />贷:银行存款5300", "借:短期借款5000<br />应付账款300<br />贷:银行存款5300", "", ""], "r": "B", "e": "偿还短期借款本金记“短期借款”减少，支付利息属于财务费用，用银行存款支付使银行存款减少。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971321", "t": 1, "q": "《企业会计准则》规定，企业对交易或者事项进行会计确认、计量和报告应当保持应有的谨慎，不应高估资产或者收益、低估负债或者费用，体现的会计信息质量要求是？", "a": ["及时性", "谨慎性", "重要性", "实质重于形式", "", ""], "r": "B", "e": "题干描述的“不应高估资产或收益、低估负债或费用”符合谨慎性的要求。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971322", "t": 1, "q": "事业单位用结余资金购置的固定资产，应该借记（　）科目。", "a": ["专用基金——修购基金", "专款支出", "经营支出", "事业支出", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971323", "t": 1, "q": "企业发生的下列支出中，属于收益性支出的是？", "a": ["固定资产日常修理支出", "贽置固定资产支出", "购买专利权支出", "租入固定资产改良支出", "", ""], "r": "A", "e": "收益性支出是指支出的效益仅及于本会计期间。固定资产日常修理支出是为维持固定资产正常运转和使用而发生的，其效益在当期体现，属于收益性支出。而购置固定资产、购买专利权、租入固定资产改良支出，其效益涉及多个会计期间，属于资本性支出。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971324", "t": 1, "q": "企业提供的会计信息应有助于财务会计报告使用者对企业过去、现在或者未来的情况作出评价或者预测，这体现了会计信息质量要求中的（　）要求。", "a": ["可理解性", "相关性", "可比性", "可靠性", "", ""], "r": "B", "e": "相关性要求企业提供的会计信息应当与财务会计报告使用者的经济决策需要相关，有助于使用者对企业过去、现在或未来情况作出评价或预测。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971325", "t": 1, "q": "利润表中的\"营业利润\"项目计算公式正确的是（　）", "a": ["营业利润=营业收入-营业成本-税金及附加-销售费用-管理费用-财务费用-资产减值损失+公允价值变动收益（-公允价值变动损失）+投资收益（-投资损失）+营业外收入-营业外支出-所得税费用", "营业利润=营业收入-营业成本-税金及附加-销售费用-管理费用-财务费用-资产减值损失+公允价值变动收益（-公允价值变动损失）+投资收益（-投资损失）", "营业利润=营业收入-营业成本-税金及附加-销售费用-管理费用-财务费用-资产减值损失+公允价值变动收益（-公允价值变动损失）+投资收益（-投资损失）+营业外收入-营业外支出-所得税费用+其他综合收益", "营业利润=营业收入-营业成本-税金及附加-销售费用-管理费用-财务费用-资产减值损失+公允价值变动收益（-公允价值变动损失）+投资收益（-投资损失）+营业外收入-营业外支出", "", ""], "r": "B", "e": "营业利润不包含营业外收支和所得税费用等。选项B公式符合营业利润的计算，A、C、D包含了营业外收支或所得税费用等不应在营业利润计算中的项目。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971326", "t": 1, "q": "下列有关固定资产成本的确定，说法正确的有（　）。", "a": ["购买固定资产的价款超过正常信用条件延期支付，实质上具有融资性质的，固定资产应当以购买价款的现值为基础确定", "核电站核设施企业固定资产预计的弃置费用现值应计入固定资产成本", "企业购置计算机硬件所附带的、未单独计价的软件，应与所购置的计算机硬件一并确认为固定资产", "投资者投入固定资产的成本，按照投资合同或协议约定的价值确定", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971327", "t": 1, "q": "2007年1月1日，M公司从股票二级市场以每股15元的价格购入N公司发行的股票200万股，占N公司有表决权股份的5％，M公司将其划分为可供出售金融资产。2007年12月31日，该股票的市场价格为每股13元;M公司预计该股票的价格下跌是暂时的。2008年，N公司因违反相关证券法规，受到证券监管部门查处。受此影响，N公司股票的价格发生下跌。至2008年12月31日，该股票的市场价格下跌到每股6元;M公司预计该股票的价格下跌是非暂时性的。2009年，N公司整改完成，加之市场宏观面好转，股票价格有所回升;至12月31日，该股票的市场价格上升到每股10元。假定2008年和2009年均未分派现金股利，不考虑其他因素，M公司就所持有的上述股票在2009年12月31日确认的资本公积余额为（　）万元。", "a": ["0", "440", "1160", "800", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971328", "t": 1, "q": "《企业会计准则》规定的会计信息质量要求中，要求企业提供的会计信息应当清晰明了，便于投资者等财务报告使用者理解和使用的是？", "a": ["可理解性", "可靠性", "相关性", "重要性", "", ""], "r": "A", "e": "可理解性强调会计信息清晰明了，便于使用者理解和使用；可靠性侧重于信息真实可靠；相关性是与决策相关；重要性关注重要交易或事项的处理。本题描述符合可理解性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971329", "t": 1, "q": "重组事项不包括（　）。", "a": ["关闭企业的部分经营场所，或将营业活动由一个国家或地区迁移到其他国家或地区", "出售或终止企业的部分经营业务", "对企业的组织结构进行较大的调整", "因经营困难，与债权方进行债务重组", "", ""], "r": "D", "e": "重组通常是企业内部结构、业务等方面调整，债务重组是与债权方就债务问题处理，不属于重组事项范畴。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656184971330", "t": 1, "q": "以下收入中，不应计入事业单位\"其他收入\"的有（　）。", "a": ["销售产品收入", "接受外单位捐赠未限定用途的财物", "其他单位对本单位的补助", "固定资产出租收入", "", ""], "r": "A", "e": "事业单位“其他收入”核算除财政补助收入、事业收入、上级补助收入、附属单位上缴收入、经营收入以外的各项收入，包括投资收益、银行存款利息收入、租金收入、捐赠收入等。销售产品收入应计入经营收入，不属于其他收入。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165568", "t": 1, "q": "资产负债表中，“预付款项”项目应根据“预付账款”和“应付账款”科目所属明细科目的期末借方余额合计数，减去（　）后的净额填列。", "a": ["坏账准备科目中有关预付款项计提的坏账准备期末余额", "累计折旧科目期末余额", "资产减值损失科目发生额", "存货跌价准备科目期末余额", "", ""], "r": "A", "e": "“预付款项”项目填列时要考虑其坏账情况，需减去坏账准备科目中有关预付款项计提的坏账准备期末余额。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165569", "t": 1, "q": "企业发生会计估计变更时，下列各项目中不需要在会计报表附注中披露的是（　）。", "a": ["会计估计变更的累积影响数", "会计估计变更的内容", "会计估计变更对当期和未来期间的影响数", "会计估计变更的理由", "", ""], "r": "A", "e": "会计估计变更采用未来适用法，不计算累积影响数，所以不需要披露会计估计变更的累积影响数。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165570", "t": 1, "q": "企业编制资产负债表时，\"预付款项\"项目应根据（　）填列。", "a": ["\"预付账款\"和\"应收账款\"科目所属明细科目的期末借方余额合计数", "\"预付账款\"总账科目余额", "\"预付账款\"和\"应付账款\"科目所属明细科目的期末借方余额合计数", "\"预付账款\"科目所属明细科目的期末借方余额", "", ""], "r": "C", "e": "“预付款项”项目应综合考虑与预付相关的明细情况。预付账款借方余额是预付款性质，应付账款所属明细科目借方余额实质也是预付性质。所以应根据“预付账款”和“应付账款”科目所属明细科目的期末借方余额合计数填列。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165571", "t": 1, "q": "甲公司将其持有的一项固定资产换入乙公司一项专利技术，该项交易不涉及补价。假设具有商业实质。甲公司该项固定资产的账面价值为150万元，公允价值为200万元。乙公司该项专利技术的账面价值为160万元，公允价值为200万元。甲公司在此交易中为换入资产发生了20万元的税费。甲公司换入该项资产的入账价值为（　）万元。", "a": ["160", "170", "150", "220", "", ""], "r": "D", "e": "具有商业实质且不涉及补价的非货币性资产交换，换入资产入账价值 = 换出资产公允价值 + 为换入资产发生的相关税费。甲公司换出资产公允价值200万元，换入资产发生税费20万元，所以入账价值为200 + 20 = 220万元。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165572", "t": 1, "q": "2007年1月1日，A公司从外单位购入一项无形资产，支付价款1100万元，估计该项无形资产的使用寿命为5年，该无形资产存在活跃市场，且预计该活跃市场在该无形资产使用寿命结束时仍可能存在，经合理估计，该无形资产的预计残值为100万元。该项无形资产采用直线法按年摊销，每年年末对其摊销方法进行复核。2010年末，由于市场发生变化，经复核重新估计，该项无形资产的预计残值为350万元，则2011年，该项无形资产的摊销费用为（　）万元。", "a": ["220", "0", "200", "170", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165573", "t": 1, "q": "M上市公司2008年度财务报告批准报出日为2009年4月15日。公司在2009年1月1日至4月15日之间发生的下列事项中，属于资产负债表日后调整事项的是（　）。", "a": ["公司支付2008年度财务报表审计费325万元", "2008年销售的商品9800万元，因产品质量问题，客户于2009年3月18日退货", "公司董事会提出2008年度利润分配方案:每10股送1股股票股利", "重大企业合并或处置子公司", "", ""], "r": "B", "e": "资产负债表日后调整事项是指对资产负债表日已经存在的情况提供了新的或进一步证据的事项。选项A支付审计费是日常事项；选项C利润分配方案中的股票股利和选项D重大企业合并或处置子公司，都是资产负债表日后才发生的新事项，属于非调整事项。选项B，2008年销售的商品在资产负债表日后因质量问题退货，这是对资产负债表日已存在销售情况的进一步证据，属于调整事项。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165574", "t": 1, "q": "下列有关确定存货可变现净值的表述，不正确的有（　）。", "a": ["用于生产有销售合同产品的材料以该材料的市场价格为基础计算确定", "有销售合同的库存商品以该库存商品的合同售价为基础计算确定", "无销售合同的库存商品以该库存商品的估计售价为基础计算确定", "用于出售且无销售合同的材料以该材料的市场价格为基础计算确定", "", ""], "r": "A", "e": "存货可变现净值，有合同按合同价，无合同按市场价。用于生产有销售合同产品的材料，其可变现净值应按产品合同价为基础确定，而非材料市场价格。所以A表述不正确，答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165575", "t": 1, "q": "某企业一台设备从2007年1月1日开始计提折旧，其原值为111,000元，预计使用年限为5年，预计净残值为1,000元，采用双倍余额递减法计提折旧。从2009年起，该企业将该固定资产的折旧方法改为平均年限法，设备的预计使用年限由5年改为4年，设备的预计净残值由1,000元改为600元。该设备2009年的折旧额为（　）元。", "a": ["27,500", "27,600", "19,500", "19,680", "", ""], "r": "D", "e": "先按双倍余额递减法算2007、2008年折旧，2007年折旧=111000×2/5 = 44400元，2008年折旧=(111000 - 44400)×2/5 = 26640元。2009年初账面价值=111000 - 44400 - 26640 = 39960元。此时改变折旧方法，剩余使用年限变为2年，净残值变为600元，2009年折旧=(39960 - 600)÷2 = 19680元。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165576", "t": 1, "q": "甲公司2009年销售收入1500万元，产品质量保证条款规定，产品售出后，如果一年内发生正常质量问题，甲公司将负责免费维修。根据以往经验，如果发生较小质量问题，修理费用为销售收入的1％;发生较大问题的修理费用为销售收入的3％<sub>5％;发生特大质量问题的修理费用为销售收入的8％<\/sub>10％。公司考虑各种因素，预测2009年所售商品中，有10％将发生较小质量问题，5％将发生较大质量问题，2％将发生特大质量问题。2009年年末，甲公司应确认的负债金额为（　）万元。", "a": ["3", "7.2", "2.7", "1.5", "", ""], "r": "B", "e": "先分别算出不同质量问题对应的修理费用，再求和。较小质量问题费用：1500×1%×10% = 1.5万元；较大质量问题按中间值4%算，费用为1500×4%×5% = 3万元；特大质量问题按中间值9%算，费用为1500×9%×2% = 2.7万元。负债金额 = 1.5 + 3 + 2.7 = 7.2万元。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165577", "t": 1, "q": "企业在编制合并会计报表时，下列子公司外币会计报表项目中，可以采用按照系统合理的方法确定的、与交易发生日即期汇率近似的汇率折算为母公司记账本位币的是（　）。", "a": ["资本公积", "营业收入", "未分配利润", "盈余公积", "", ""], "r": "B", "e": "利润表中的收入和费用项目，采用交易发生日的即期汇率折算，也可以采用按照系统合理的方法确定的、与交易发生日即期汇率近似的汇率折算。选项B营业收入属于利润表项目。资本公积、盈余公积采用交易发生时的即期汇率折算；未分配利润是通过倒挤得出。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165578", "t": 1, "q": "下列哪些不构成企业的收入（　）。", "a": ["取得罚款收入400元", "销售低值易耗品收入500元", "销售商品一批，价款80万元", "出租包装物，租金收入1000元", "", ""], "r": "A", "e": "收入是企业日常活动中形成的经济利益流入，罚款收入不是日常活动产生的。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165579", "t": 1, "q": "在借贷记账法下，下列关于账户对应关系的表述，错误的是？", "a": ["存在对应关系的账户称为对应账户", "账户对应关系是指采用借贷记账法对每笔交易或事项进行记录时，相关账户之间形成的应借、应贷的相互关系", "通过账户对应关系，可以了解经济业务的内容和资金运动的来龙去脉", "所有账户之间都存在对应关系", "", ""], "r": "D", "e": "答案选D。并非所有账户之间都存在对应关系，只有在经济业务发生时，才会使某些账户之间形成对应关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165580", "t": 1, "q": "资产负债表中，“无形资产”项目应根据“无形资产”科目的期末余额减去（　）后的净额填列。", "a": ["累计摊销", "累计摊销和无形资产减值准备", "坏账准备和累计摊销", "累计折旧和无形资产减值准备", "", ""], "r": "B", "e": "“无形资产”项目应按其账面价值填列，账面价值是无形资产期末余额减去累计摊销和无形资产减值准备后的净额。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165581", "t": 1, "q": "甲股份有限公司20×8年实现净利润8500万元。该公司20×8年发生和发现的下列交易或事项中，会影响其年初未分配利润的是（　）。", "a": ["因客户资信状况明显改善，将应收账款坏账准备计提比例由10%改为5%", "发现20×6年少计管理费用4 500万元", "为20×7年售出的设备提供售后服务发生支出550万元", "发现20×7年少提财务费用0.10万元", "", ""], "r": "B", "e": "A选项是会计估计变更，采用未来适用法，不影响年初未分配利润；C选项为正常售后支出，计入当期损益，不影响年初未分配利润；D选项金额较小，作为当期差错处理，不影响年初未分配利润。B选项属于前期重大差错，应追溯调整，会影响年初未分配利润。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528656189165582", "t": 1, "q": "采用分步法核算产品成本时，若采用逐步综合结转分步法，最终完工产品成本中\"半成品\"项目金额需要进行？", "a": ["成本还原", "冲减当期损益", "直接计入产品成本", "作为期间费用处理", "", ""], "r": "A", "e": "逐步综合结转分步法下，上一步骤半成品成本综合转入下一步骤，使得最终完工产品成本中“半成品”项目金额包含了以前步骤的综合成本，不能反映原始成本结构，所以需要进行成本还原。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307456", "t": 2, "q": "企业采用分步法核算产品成本时，逐步结转分步法和平行结转分步法的区别有？", "a": ["完工产品概念不同", "半成品成本结转方式不同", "成本计算对象不同", "是否需要成本还原不同", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307457", "t": 2, "q": "按照债务重组准则的规定，下列提法中不正确的有（　）。", "a": ["债权人涉及或有收益的，债权人不应将或有收益包括在未来应收金额中，或有收益收到时，直接冲减财务费用", "在债务重组日无论是债权人还是债务人，均不确认债务重组收益", "债务人涉及或有支出的，债务人应将或有支出包括在未来应付金额中，或有支出没有发生时，将其直接计入营业外收入", "债务人应先以现金、非现金资产的账面价值、债权人享有的股权的账面价值冲减重组债务的账面价值，然后再考虑修改其他债务条件进行债务重组", "", ""], "r": "BC", "e": "债务重组中，债务人可能确认债务重组收益，B选项说均不确认错误；或有支出未发生应冲减预计负债，而不是直接计入营业外收入，C选项错误。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307458", "t": 2, "q": "下列业务中，属于资金退出的有（　）。", "a": ["对外分配利润", "归还银行借款", "购买材料", "缴纳税费", "", ""], "r": "ABD", "e": "资金退出包括偿还债务、上交税金、向所有者分配利润等。A对外分配利润是向所有者分配；B归还银行借款是偿还债务；D缴纳税费是上交税金，都属于资金退出。C购买材料是资金的循环与周转，不属于资金退出。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307459", "t": 2, "q": "确定股权购买日应包括的条件有（　）。", "a": ["购买协议已获股东大会通过，并已获相关部门批准（如果需要有关政府部门批准）", "购买企业实际上已经控制被购买企业的财务和经营政策，并从其活动中获得利益或承担风险", "购买企业已经支付价款（以现金和银行存款支付的价款）的大部分（一般应该超过50%）", "购买企业和被购买企业已经办理必要的财产交接手续", "", ""], "r": "ABCD", "e": "确定股权购买日需满足系列条件，A选项是程序合规要求；B选项体现实质控制是关键；C选项价款支付比例是重要判断点；D选项财产交接手续是完成标志。答案ABCD涵盖了股权购买日应具备的条件。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307460", "t": 2, "q": "采用分批法核算产品成本时，间接计入费用的分配方法通常有？", "a": ["机器工时比例法", "约当产量比例法", "生产工人工资比例法", "生产工时比例法", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307461", "t": 2, "q": "企业现金流量表补充资料中，将净利润调节为经营活动现金流量时，应减去的项目有？", "a": ["固定资产折旧", "经营性应收项目的增加", "存货的减少", "经营性应付项目的减少", "", ""], "r": "BD", "e": "净利润调节为经营活动现金流量时，固定资产折旧是加项；存货减少意味着现金流入，是加项；经营性应收项目增加和经营性应付项目减少会使现金流出，应减去。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307462", "t": 2, "q": "下列各项中，影响基本每股收益的有（　）。", "a": ["当期新发行普通股", "期末未分配利润", "当期回购的库存股", "当期发生的净亏损", "", ""], "r": "ACD", "e": "基本每股收益=归属于普通股股东的当期净利润÷当期发行在外普通股的加权平均数。新发行普通股和回购库存股会影响发行在外普通股加权平均数，净亏损影响归属于普通股股东的当期净利润，而期末未分配利润不直接影响基本每股收益计算。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307463", "t": 2, "q": "企业编制现金流量表时，“购建固定资产、无形资产和其他长期资产支付的现金”项目包括？", "a": ["购买土地使用权支付的款项", "支付的资本化利息", "购买设备支付的价款及增值税", "为在建工程支付的职工薪酬", "", ""], "r": "ACD", "e": "“购建固定资产、无形资产和其他长期资产支付的现金”反映企业购买、建造固定资产，取得无形资产和其他长期资产所支付的现金。A选项购买土地使用权属取得无形资产；C选项购买设备是购建固定资产；D选项为在建工程付职工薪酬是建造固定资产相关支出。而支付的资本化利息应在“分配股利、利润或偿付利息支付的现金”项目反映。所以答案是ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307464", "t": 2, "q": "企业采用分批法计算产品成本时，与分批法特点相关的表述正确的有？", "a": ["适用于大量大批多步骤生产企业", "成本计算期与产品生产周期一致", "成本计算对象是产品批别", "一般不存在完工产品与在产品之间分配费用的问题", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307465", "t": 2, "q": "在已确认减值损失的金融资产价值恢复时，下列金融资产的减值损失可以通过损益转回的有（　）。", "a": ["可供出售权益工具的减值损失", "贷款及应收款项的减值损失", "在活跃市场上没有报价且其公允价值不能可靠计量的权益工具投资发生的减值损失", "可供出售债务工具的减值损失", "", ""], "r": "BD", "e": "A项可供出售权益工具减值损失应通过其他综合收益转回；C项这类权益工具投资减值损失不得转回；B项贷款及应收款项、D项可供出售债务工具减值损失可通过损益转回。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307466", "t": 2, "q": "下列各项中，属于金融资产的有（　）。", "a": ["持有的其他单位的权益工具", "从其他单位收取现金的合同权利", "持有的其他单位的债务工具", "库存现金", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307467", "t": 2, "q": "下列哪些属于会计档案（　）。", "a": ["会计账簿", "会计凭证", "产品销售计划", "财务会计报告", "", ""], "r": "ABD", "e": "会计档案是指会计凭证、会计账簿和财务会计报告等会计核算专业材料。产品销售计划不属于会计核算产生的资料。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307468", "t": 2, "q": "以债务转为资本的方式进行债务重组时，以下处理方法正确的是（　）。", "a": ["债权人已对债权计提减值准备的，应当先将重组债权的账面余额与股份的公允价值之间的差额冲减减值准备，冲减后尚有余额的，计入营业外支出（债务重组损失）;冲减后减值准备仍有余额的，应予转回并抵减当期资产减值损失", "债务人应将股份公允价值总额与股本或实收资本之间的差额确认为资本公积", "债权人应当将享有股份的公允价值确认为对债务人的投资", "债务人应将债权人因放弃债权而享有的股份的面值总额确认为股本或实收资本", "", ""], "r": "ABCD", "e": "ABCD选项均符合以债务转为资本方式进行债务重组的处理原则。A项描述了债权人对债权计提减值准备后的处理；B项说明了债务人股份公允价值与股本差额的处理；C项明确债权人对享有股份的确认；D项指出债务人对股份面值的确认。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307469", "t": 2, "q": "原始凭证的填制，除了记录真实、内容完整、手续完备等基本要求外，还要求做到（　）", "a": ["不得涂改、刮擦、挖补", "编号连续", "填制及时", "书写清楚规范", "", ""], "r": "ABCD", "e": "原始凭证填制除基本要求外，不得涂改、刮擦、挖补，保证凭证准确性；编号连续便于管理和查询；填制及时能保证信息时效性；书写清楚规范确保内容清晰可辨。ABCD选项均符合要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307470", "t": 2, "q": "下列关于品种法的成本核算流程，正确的有？", "a": ["按产品品种开设成本计算单", "月末若有在产品，需在完工产品与在产品间分配成本", "采用适当方法分配制造费用", "归集和分配直接材料、直接人工等费用", "", ""], "r": "ABCD", "e": "品种法成本核算流程：先按产品品种开设成本计算单，接着归集和分配直接材料、直接人工等费用，再采用适当方法分配制造费用，月末若有在产品，需在完工产品与在产品间分配成本。ABCD 选项均符合品种法成本核算流程。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307471", "t": 2, "q": "下列可供出售金融资产的表述中，正确的有（　）。", "a": ["可供出售权益工具发生的减值损失应计入所有者权益", "处置可供出售金融资产时，以前期间因公允价值变动计入资本公积的金额应转入投资收益", "可供出售债务工具发生的减值损失应计入当期损益", "取得可供出售金融资产发生的交易费用应直接计入当期损益", "", ""], "r": "BC", "e": "A项，可供出售权益工具减值损失应计入当期损益，不是所有者权益；B项，处置时原计入资本公积的金额转入投资收益，正确；C项，可供出售债务工具减值损失计入当期损益，正确；D项，取得可供出售金融资产的交易费用应计入初始成本，不是当期损益。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307472", "t": 2, "q": "编制资产负债表时，需根据若干总账科目余额计算填列的项目有？", "a": ["货币资金", "固定资产", "存货", "短期借款", "", ""], "r": "AC", "e": "货币资金需根据“库存现金”“银行存款”“其他货币资金”总账科目余额计算填列；存货需根据“原材料”“库存商品”“生产成本”等多个总账科目余额计算填列。固定资产按相关科目余额减去备抵科目余额后填列，短期借款根据总账科目余额直接填列。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307473", "t": 2, "q": "采用逐步结转分步法核算产品成本时，其优点有？", "a": ["能提供各步骤半成品成本资料", "便于进行各步骤的成本管理", "有利于在产品的实物管理", "成本计算的及时性强", "", ""], "r": "ABC", "e": "逐步结转分步法能计算各步骤半成品成本，所以可提供各步骤半成品成本资料，也便于各步骤成本管理，且半成品实物转移与成本结转同步，利于在产品实物管理。但它需按步骤逐步计算和结转成本，成本计算及时性差。所以ABC是优点，答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307474", "t": 2, "q": "企业编制现金流量表时，下列交易或事项中，属于投资活动产生现金流量的有？", "a": ["购买股票支付的现金", "偿还银行借款支付的现金", "收到的债券利息收入", "处置无形资产收回的现金", "", ""], "r": "ACD", "e": "投资活动是指企业长期资产的购建和不包括在现金等价物范围内的投资及其处置活动。A购买股票支付现金是对外投资；C收到债券利息收入是投资带来的收益；D处置无形资产收回现金属于处置长期资产。而B偿还银行借款支付现金属于筹资活动产生的现金流量。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307475", "t": 2, "q": "下列关于母公司在报告期内增减子公司的表述，正确的有（　）。", "a": ["因同一控制下企业合并增加的子公司，在编制合并现金流量表时，应当将该子公司合并当期期初至报告期末的现金流量纳入合并现金流量表", "母公司在报告期内处置子公司，应将该子公司期初至处置日的现金流量纳入合并现金流量表", "因同一控制下企业合并增加的子公司，在编制合并现金流量表时，应当将该子公司合并日至报告期末的现金流量纳入合并现金流量表", "因非同一控制下企业合并增加的子公司，在编制合并现金流量表时，应当将该子公司购买日至报告期末的现金流量纳入合并现金流量表", "", ""], "r": "ABD", "e": "同一控制下企业合并增加子公司，应将子公司合并当期期初至报告期末现金流量纳入合并现金流量表；处置子公司，要将子公司期初至处置日现金流量纳入；非同一控制下企业合并增加子公司，将子公司购买日至报告期末现金流量纳入。A、B、D选项符合规则，C错误。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307476", "t": 2, "q": "以下属于几种产品成本计算方法同时应用的有（　）。", "a": ["毛坯生产采用品种法，加工装配采用分步法", "基本生产车间采用分步法，场内供电车间采用品种法", "发电厂的发电车间采用品种法，供水车间不单独计算供水成本", "大量生产产品时采用分步法，小批生产产品时采用分批法", "", ""], "r": "ABD", "e": "几种产品成本计算方法同时应用是指在一个企业或车间中，不同的生产车间、不同的产品采用不同的成本计算方法。A选项不同生产阶段用不同方法；B选项不同车间用不同方法；D选项不同生产类型产品用不同方法，都属于同时应用。C选项供水车间不单独计算成本，并非是几种方法同时应用。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307477", "t": 2, "q": "下列关于产品成本核算方法的说法，正确的有？", "a": ["品种法下一般不存在完工产品与在产品之间分配费用的问题", "分步法适用于大量大批多步骤生产的企业", "分批法主要适用于单件、小批生产的企业", "分批法下成本计算期与产品生产周期基本一致", "", ""], "r": "BCD", "e": "品种法在单步骤生产下一般不存在完工产品与在产品间分配费用问题，但多步骤生产可能存在，A错误；分步法适合大量大批多步骤生产企业，B正确；分批法适用于单件、小批生产企业，C正确；分批法成本计算期和产品生产周期基本一致，D正确。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307478", "t": 2, "q": "企业对于发生的会计政策变更，应披露的内容有（　）。", "a": ["当期和各个列报前期财务报表中受影响的项目调整金额", "会计政策变更的原因、性质、内容", "当期和各个列报前期财务报表中受影响的项目名称", "无法进行追溯调整的，说明该事实和原因以及开始应用变更后的会计政策的时点、具体应用情况", "", ""], "r": "ABCD", "e": "企业发生会计政策变更，需披露变更原因、性质、内容，受影响的项目名称和调整金额，若无法追溯调整，要说明相关情况。ABCD四个选项均符合应披露的内容要求。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307479", "t": 2, "q": "下列外币货币性项目在本期均未发生增减变动，在期末市场汇率上升的情况下将其折算为记账本位币，产生汇兑收益的有（　）。", "a": ["银行存款", "应收账款", "应付账款", "短期借款", "", ""], "r": "AB", "e": "市场汇率上升，资产类项目折算为记账本位币金额增加产生汇兑收益，负债类项目折算金额增加产生汇兑损失。银行存款、应收账款是资产，应付账款、短期借款是负债。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307480", "t": 2, "q": "下列各项中应记入\"固定资产清理\"科目借方的有（　）。", "a": ["因出售固定资产而支付的清理费用", "发生的固定资产的改良支出", "报废固定资产所获得的赔偿款项", "因出售固定资产而结转的账面价值", "", ""], "r": "AD", "e": "“固定资产清理”借方登记清理的费用和账面价值等，贷方登记清理收入等。A支付清理费用、D结转账面价值应记借方；B固定资产改良支出应计入在建工程；C获得赔偿款记贷方。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307481", "t": 2, "q": "下列属于企业投资性房地产的有（　）。", "a": ["企业生产经营用的房地产", "企业自行建造的已出租的厂房", "企业经营租赁方式出租的办公楼", "企业经营租赁方式出租的生产线", "", ""], "r": "BC", "e": "投资性房地产是为赚取租金或资本增值，或两者兼有而持有的房地产。A是自用房地产，不属于投资性房地产；D生产线不是房地产。B自行建造已出租的厂房和C经营租赁方式出租的办公楼属于投资性房地产。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307482", "t": 2, "q": "资产的基本特征包括（　）。", "a": ["资产应为企业拥有或控制的资源", "资产是由企业将要发生的交易或者事项形成的", "资产预计会给企业带来经济利益", "资产是由企业过去的交易或者事项形成的", "", ""], "r": "ACD", "e": "资产是由企业过去交易或事项形成，为企业拥有或控制，且预计能带来经济利益的资源，B选项“将要发生”错误。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307483", "t": 2, "q": "事业单位的下列各项中，会引起专用基金发生增减变化的有（　）。", "a": ["支付公费医疗费", "兴建职工集体福利设施", "支付固定资产清理费用", "单位为职工代交的住房公积金", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307484", "t": 2, "q": "账户的基本结构具体包括（　）。", "a": ["所依据记账凭证的编号", "账户名称和经济业务发生的日期", "交易或事项内容摘要", "增加金额、减少金额和余额", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307485", "t": 2, "q": "国家统一的会计制度和单位内部会计控制制度对于财产清查结果处理的规定和要求是（　）。", "a": ["积极处理多余积压财产，清理往来款项", "分析产生差异的原因和性质，提出处理建议", "及时调整账簿记录，保证账实相符", "总结经验教训，建立健全各项管理制度", "", ""], "r": "ABCD", "e": "财产清查结果处理需多方面进行，ABCD四个选项分别从资产处理、原因分析、账务调整、制度建设等方面涵盖了规定和要求。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307486", "t": 2, "q": "甲股份有限公司2008年年度财务报告经董事会批准对外公布的日期为2009年3月30日，实际对外公布的日期为2009年4月3日。该公司2009年1月1日至3月30日发生的下列事项中，应当作为资产负债表日后事项中的调整事项的有（　）。", "a": ["2009年1月29日得到法院通知，因2008年度为其他单位提供贷款担保应向银行支付贷款及罚息等共计95万元，2008年末已确认预计负债80万元", "1月25日完成了2008年12月20日销售的必须安装设备的安装工作，并收到销售款100万元", "2月25日，发生火灾导致存货损失100万元", "3月1日发现2008年10月接受捐赠获得的一项固定资产尚未入账", "", ""], "r": "AD", "e": "资产负债表日后调整事项是指对资产负债表日已经存在的情况提供了新的或进一步证据的事项。A选项，法院判决结果使原预计负债金额需调整，属于调整事项；D选项，发现前期差错，应调整报告年度报表，属于调整事项。B选项是正常销售业务，C选项是资产负债表日后新发生的事项，属于非调整事项。答案：AD", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307487", "t": 2, "q": "借款费用资本化必须同时满足的条件有（　）。", "a": ["借款费用已经发生", "为使资产达到预定可使用或者可销售状态所必要的购建或者生产活动已经开始", "已使用借款购入工程物资", "资产支出已经发生", "", ""], "r": "ABD", "e": "借款费用资本化需同时满足三个条件：借款费用已发生、资产支出已发生、为使资产达到预定可使用或可销售状态所必要的购建或生产活动已开始。A、B、D选项符合。C选项已使用借款购入工程物资只是资产支出发生的一种情况，不是独立必须满足的条件。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307488", "t": 2, "q": "下列项目中，应确认为购货企业存货的有（　）。", "a": ["未收到销售方结算发票，但已运抵购货方验收入库的商品", "购货方已付款购进，但尚在运输途中的商品", "销售方已确认销售，但尚未发运给购货方的商品", "购销双方已签协议约定，但尚未办理商品购买手续", "", ""], "r": "AB", "e": "存货确认需满足控制权转移。A已验收入库，B已付款在途，购货方取得控制权应确认为存货；C商品未发出，控制权未转移给购货方；D未办理购买手续，未取得控制权。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307489", "t": 2, "q": "企业发生的下列税费中，应当通过\"应交税费\"科目核算的有（　）。", "a": ["印花税", "增值税", "企业所得税", "个人所得税", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307490", "t": 2, "q": "下列会计科目中，属于流动资产的有（　）。", "a": ["无形资产", "存货", "预付账款", "应收账款", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307491", "t": 2, "q": "下列固定资产中，不应计提折旧的固定资产有（　）。", "a": ["经营租入的固定资产", "正处于改良期间的固定资产", "大修理的固定资产", "已提足折旧仍继续使用的固定资产", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307492", "t": 2, "q": "关于固定资产的处置下列说法正确的有（　）。", "a": ["企业持有待售的固定资产，应当调整其预计净残值，但不得超过其账面价值", "当固定资产预期通过使用或处置不能产生经济利益的时候，该项固定资产应该终止确认", "处置固定资产所缴纳的增值税应该计入“应交税费—应交增值税（销项税额）”", "企业处置固定资产发生的损益应该计入资产处置损益", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307493", "t": 2, "q": "下列各项中，属于按照《企业会计准则第22号——金融工具确认和计量》准则规范的金融资产有（　）。", "a": ["应收股利", "发行的债券", "持有至到期的国债", "对子公司的股权投资", "", ""], "r": "AC", "e": "A应收股利属于金融资产；C持有至到期的国债是典型的金融资产。B发行债券是企业的负债。D对子公司股权投资适用长期股权投资准则，不属于该准则规范的金融资产。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307494", "t": 2, "q": "企业编制现金流量表时，属于经营活动产生现金流量的有？", "a": ["购买原材料支付的现金", "取得投资收益收到的现金", "销售商品收到的现金", "支付给职工的工资", "", ""], "r": "ACD", "e": "经营活动是企业日常经营业务相关活动。A购买原材料、C销售商品、D支付职工工资都与日常经营直接相关。B取得投资收益收到的现金属于投资活动现金流量。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307495", "t": 2, "q": "关于递延所得税资产、负债的表述，正确的有（　）。", "a": ["确认递延所得税负债均会增加利润表中的所得税费用", "递延所得税资产的确认应以未来期间可能取得的应纳税所得额为限", "资产负债表日，应该对递延所得税资产进行复核", "递延所得税资产或递延所得税负债的确认均不要求折现", "", ""], "r": "BCD", "e": "A选项，确认递延所得税负债不一定都增加所得税费用，可能计入其他综合收益等；B选项，确认递延所得税资产要考虑未来能取得的应纳税所得额；C选项，资产负债表日需对递延所得税资产复核；D选项，递延所得税资产和负债的确认不要求折现。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307496", "t": 2, "q": "期末发生的下列事项中，影响当年度利润表中营业利润的是（　）。", "a": ["发生的固定资产的改良支出", "计提固定资产减值准备", "发生的固定资产的修理费用", "计提管理部门固定资产的折旧费", "", ""], "r": "BCD", "e": "营业利润受日常经营活动中收入、成本、费用等影响。A项固定资产改良支出计入资产成本，不直接影响营业利润；B项计提固定资产减值准备计入资产减值损失，影响营业利润；C项固定资产修理费用，若为日常修理计入管理费用等，影响营业利润；D项管理部门固定资产折旧费计入管理费用，影响营业利润。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307497", "t": 2, "q": "企业采用分批法计算产品成本时，间接费用的分配方法可以是？", "a": ["按生产工时比例分配", "按机器工时比例分配", "按产品重量比例分配", "按计划成本分配", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307498", "t": 2, "q": "采用累计实际发生的合同成本占合同预计总成本的比例确定合同完工进度的，累计实际发生的合同成本不包括的内容有（　）。", "a": ["施工中尚未安装或使用的材料成本", "施工中发生的人工成本", "在分包工程的工作量完成之前预付给分包单位的款项", "施工中使用的材料成本", "", ""], "r": "AC", "e": "累计实际发生的合同成本应是实际用于工程的成本，未安装使用材料和预付分包款未真正用于工程，不算在内。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307499", "t": 2, "q": "关于品种法的成本核算特点，下列说法正确的有？", "a": ["成本计算期与产品生产周期一致", "适用于大量大批单步骤生产企业", "一般定期（每月月末）计算产品成本", "以产品品种作为成本计算对象", "", ""], "r": "BCD", "e": "品种法适用于大量大批单步骤生产企业，以产品品种为成本计算对象，一般定期（每月月末）计算产品成本，成本计算期与会计报告期一致，而非与产品生产周期一致。所以正确的是BCD。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307500", "t": 2, "q": "下列属于资产负债表日后非调整事项的有（　）。", "a": ["资产负债表日后发生自然灾害导致资产损失", "资产负债表日后期间发生的报告年度以前售出的商品发生退回", "资产负债表日后董事会提出现金股利分配方案", "资产负债表日后对某一企业进行巨额投资", "", ""], "r": "ACD", "e": "非调整事项是资产负债表日及之前不存在，日后期间新发生的事项。A自然灾害是日后新发生导致资产损失；C董事会提出现金股利分配方案是日后新决策；D对企业进行巨额投资是日后新事项。而B报告年度以前售出商品发生退回，是对之前销售情况的调整，属于调整事项。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307501", "t": 2, "q": "下列说法正确的有（　）。", "a": ["企业应当在资产负债表日对预计负债的账面价值进行复核，有确凿证据表明该账面价值不能真实反映当前最佳估计数的，应当按照当期最佳估计数对该账面价值进行调整", "企业在确定最佳估计数时，应当综合考虑与或有事项有关的风险、不确定性和货币时间价值等因素", "或有事项涉及多个项目的，且所需支出不存在一个连续范围，按最可能发生金额确定", "或有事项涉及单个项目的，且所需支出不存在一个连续范围，按最可能发生金额确定", "", ""], "r": "ABD", "e": "A选项，资产负债表日对预计负债账面价值复核，有证据表明不符最佳估计数就调整，正确；B选项，确定最佳估计数要考虑风险、不确定性和货币时间价值等，正确；C选项，或有事项涉及多个项目，应按照各种可能结果及相关概率计算确定，而非按最可能发生金额，错误；D选项，或有事项涉及单个项目且无连续范围，按最可能发生金额确定，正确。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307502", "t": 2, "q": "在借贷记账法下，期末一般无余额的账户有？", "a": ["主营业务收入", "管理费用", "实收资本", "生产成本", "", ""], "r": "AB", "e": "主营业务收入和管理费用属于损益类账户，期末要结转到“本年利润”，无余额。实收资本是所有者权益类，一般有余额。生产成本若产品未完工会有余额。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034528658588307503", "t": 2, "q": "下列关于成本核算方法特点的说法，正确的有？", "a": ["分步法以产品生产步骤为成本计算对象，月末需要在完工产品和在产品之间分配费用", "分批法适用于大量大批生产的企业", "分批法以产品批别为成本计算对象，成本计算期不固定", "品种法以产品品种为成本计算对象，成本计算期固定", "", ""], "r": "ACD", "e": "分批法适用于单件、小批生产，B错误。A分步法按步骤算成本，月末通常要在完工与在产品间分配费用；C分批法按批别算成本，成本计算期随生产周期，不固定；D品种法按品种算成本，成本计算期与会计报告期一致，固定。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659758518272", "t": 3, "q": "事业单位资产负债表中除包括资产、负债和净资产项目外，还包括收入和支出项目。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "事业单位资产负债表反映某一特定日期财务状况，包含资产、负债和净资产项目。收入和支出项目反映一定期间收支情况，不在资产负债表列示，而在收入支出表体现。所以本题说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659758518273", "t": 3, "q": "企业因日后调整事项而对资产负债表项目进行调整时，可能调整报告年度的资产负债表相关项目的年初数和年末数。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "日后调整事项若涉及报告年度资产负债表的年初数，会对其年初数和年末数进行调整。比如资产负债表日后期间发现报告年度以前年度的重大差错等情况。所以该判断正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659758518274", "t": 3, "q": "事业单位的固定资产一般不计提折旧，固定资产对外转让取得收入，应作为其他收入处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "事业单位固定资产一般不计提折旧表述正确，但固定资产对外转让取得收入应按规定上缴国库，而非作为其他收入处理。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659758518275", "t": 3, "q": "商业折扣是企业为促进商品销售而在商品标价上给予的价格扣除，因而商业折扣不影响销售商品收入的计量（　）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "商业折扣按扣除折扣后的金额确认收入，所以不影响销售商品收入计量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659758518276", "t": 3, "q": "企业对总部资产一般只能结合其他相关资产组或者资产组组合进行，不能单独进行减值测试。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "总部资产难以脱离其他资产或资产组产生独立现金流入，所以通常要结合其他相关资产组或资产组组合进行减值测试，不能单独测。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659758518277", "t": 3, "q": "谨慎性要求企业尽可能低估资产、少计收入。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "谨慎性要求企业不应高估资产或者收益、低估负债或者费用，但不是尽可能低估资产、少计收入，要合理核算可能发生的损失和费用。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659758518278", "t": 3, "q": "资产负债表日，贷款的合同利率与实际利率即使差异较小，也不可以采用合同利率计算确定利息收入。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "当贷款的合同利率与实际利率差异较小时，是可以采用合同利率计算确定利息收入的。所以本题说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712576", "t": 3, "q": "在编制财务报表的过程中，对于性质或功能不同的项目，无论是否具有重要性，均应当在财务报表中单独列报。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "性质或功能不同的项目，若不重要可不单独列报。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712577", "t": 3, "q": "现金流量表中的投资活动，指的是企业长期资产的购建和所有投资活动及其处置活动。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "现金流量表中投资活动是企业长期资产的购建和不包括在现金等价物范围内的投资及其处置活动。并非所有投资活动，比如现金等价物范围内的投资就不在此列。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712578", "t": 3, "q": "企业在判断或有事项的存在及有关金额时，依据或有事项准则进行处理，当或有事项确定下来成为资产负债表日后事项时，依据资产负债表日后事项准则做出相应处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "企业对于或有事项按或有事项准则处理，当或有事项在资产负债表日后确定时，就应按资产负债表日后事项准则处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712579", "t": 3, "q": "企业承担的重组义务只要有详细、正式的重组计划则表明企业承担了重组义务。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业承担重组义务不仅要有详细、正式的重组计划，还需满足该重组计划已对外公告，使相关各方形成企业将实施重组的合理预期这一条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712580", "t": 3, "q": "企业的或有负债和或有资产在满足一定条件时可以转化为负债或资产。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "或有负债和或有资产不符合负债和资产的定义，一般不能确认，但在满足一定条件时，或有负债可能转化为预计负债（属于负债），或有资产可能转化为真正的资产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712581", "t": 3, "q": "以一笔款项购入多项没有单独标价的固定资产，应当按照各项固定资产的账面价值比例对总成本进行分配，分别确定各项固定资产的成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "应以各项固定资产公允价值比例分配总成本来确定各固定资产成本，而非账面价值比例。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712582", "t": 3, "q": "对于明细账的核算，除用货币计量反映经济业务外，必要时还需要用实物计量或劳动计量单位从数量和时间上进行反映，以满足经营管理的需要。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "明细账核算时，货币计量虽重要，但对于存货等，用实物计量能体现数量，劳动计量可反映时间等，能满足经营管理多方面需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712583", "t": 3, "q": "在非货币性资产交换中，具有商业实质且换出资产的公允价值能够可靠计量的情况下，支付补价方，应当以换出资产的公允价值加上支付的补价和应支付的相关税费作为换入资产的成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "非货币性资产交换具有商业实质且换出资产公允价值能可靠计量时，支付补价方按此规则确定换入资产成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712584", "t": 3, "q": "贷款和应收款项与持有至到期投资回收金额都是固定或可确定的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "贷款和应收款项回收金额通常是固定或可确定的，持有至到期投资也是在到期时按约定收回固定金额或可确定金额。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712585", "t": 3, "q": "资产负债表日后事项，是指资产负债表日至财务报告批准报出日之间发生的所有有利或不利的事项。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712586", "t": 3, "q": "企业为生产经营持有的房地产，属于企业的投资性房地产。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "投资性房地产是为赚取租金或资本增值，或两者兼有而持有的房地产，企业为生产经营持有的房地产是自用房地产，不属于投资性房地产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712587", "t": 3, "q": "自行研发并按法律程序申请取得的无形资产，应按在研发过程中发生的材料费用、直接参与开发人员的工资及福利费、开发过程中发生的租金、借款费用，以及注册费、聘请律师费等费用作为无形资产的实际成本。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712588", "t": 3, "q": "企业在资产负债表日后发生严重火灾，损失仓库一栋，这一事项属于调整事项。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产负债表日后发生严重火灾损失仓库，是资产负债表日后新发生的事项，与资产负债表日存在状况无关，属于非调整事项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712589", "t": 3, "q": "资产负债表日后事项如涉及现金收支项目，应调整报告年度资产负债表的货币资金项目，但不应调整现金流量表各项目数字。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产负债表日后事项如涉及现金收支项目，属于当期事项，不调整报告年度资产负债表的货币资金项目和现金流量表各项目数字。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712590", "t": 3, "q": "两个企业之间即使不存在投资与被投资关系，也有可能是关联方。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一些情况下，企业间虽无投资与被投资关系，但可能因关键管理人员、亲属关系等成为关联方。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712591", "t": 3, "q": "资产减值准则中所规范的资产包括企业所有的资产。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产减值准则规范的是特定资产，并非企业所有资产，像存货、采用公允价值模式计量的投资性房地产等资产的减值不适用该准则。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712592", "t": 3, "q": "资产负债表日后事项涵盖期间股利的分配可以作为日后事项的调整事项进行处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "资产负债表日后期间股利分配，不管是现金股利还是股票股利，均作为非调整事项处理，而不是调整事项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712593", "t": 3, "q": "双倍余额递减法和年数总和法两种方法下每期计提的折旧额都是递增的。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "双倍余额递减法和年数总和法下每期计提折旧额并非递增，而是递减。双倍余额递减法前期折旧额高，后期逐渐降低；年数总和法折旧额也随时间推移而减少。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712594", "t": 3, "q": "企业借入的分期付息到期还本的长期借款，对于核算的应支付利息，增加长期借款的账面价值。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分期付息到期还本的长期借款，应支付利息通过“应付利息”核算，不增加长期借款账面价值。", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712595", "t": 3, "q": "已达到预定可使用状态但尚未办理竣工决算手续的固定资产，应按估计价值确定其成本，并计提折旧，办理竣工决算手续后，再按照实际成本调整原来的暂估价值，同时调整已经计提的累计折旧金额。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "达到预定可使用状态未办竣工决算的固定资产，按估计价值入账并提折旧，办竣工决算后按实际成本调暂估价值，但已提折旧不调整。", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712596", "t": 3, "q": "对于发行方可以赎回的债务工具，不能划分为持有至到期投资。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712597", "t": 3, "q": "期末企业将投资性房地产的账面余额单独列示在资产负债表上。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "投资性房地产在资产负债表中按账面价值列示，而非账面余额，账面余额未考虑减值等情况。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712598", "t": 3, "q": "对于子公司相互之间发生的内部交易，在编制合并会计报表时不需要进行抵销处理。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "子公司相互之间发生的内部交易，会影响合并报表中资产、负债、收入、成本等项目的金额，为了反映企业集团真实的财务状况和经营成果，在编制合并会计报表时需要进行抵销处理。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712599", "t": 3, "q": "事业单位的无形资产均应当在取得无形资产时，将其成本予以一次性摊销，减少无形资产的账面余额并计入当期支出。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "事业单位的无形资产应区分是否有使用年限，有使用年限的按使用年限分期平均摊销，没有使用年限的可不摊销，并非都在取得时一次性摊销。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712600", "t": 3, "q": "企业接受投资者投入的一项固定资产，按照投资合同或者协议约定的价值入账。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712601", "t": 3, "q": "科目汇总表账务处理程序的优点是能较好的反映账户的对应关系。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "科目汇总表账务处理程序不反映各个账户之间的对应关系。其优点是减轻登记总账的工作量，易于理解，方便学习和运用。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712602", "t": 3, "q": "企业在计算预计负债时不考虑与履行该现时义务所需金额的相关未来事项。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "企业在计算预计负债时应考虑与履行该现时义务所需金额的相关未来事项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528659762712603", "t": 3, "q": "在财产清查中，一般地说，定期清查是全面清查，不定期清查是局部清查。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 审计学（1）", "n": "基础练习题【含解析】 / 第3章 审计学（1）", "qs": [{"id": "2034528664581967872", "t": 1, "q": "存货监盘计划由（　）制定。", "a": ["参与此项工作的注册会计师", "被审计单位", "会计师事务所和被审计单位共同", "被审计单位的主管部门", "", ""], "r": "A", "e": "存货监盘计划由参与监盘工作的注册会计师制定，被审计单位等其他主体无此职责。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967873", "t": 1, "q": "如果审计项目组成员的直系亲属在客户中所处职位可以对客户的财务状况、经营成果和现金流量施加重大影响，则会对独立性产生威胁。评价威胁重要性程度的下列因素恰当的是（　）", "a": ["评价直系亲属在客户中的工作时间", "评价直系亲属在客户中的职位", "评价该成员在审计项目组的工资水平", "评价该成员在审计项目组中的工作时间", "", ""], "r": "B", "e": "直系亲属在客户中职位能对财务等有重大影响时，职位高低直接关系到其影响力大小，从而影响对独立性威胁的重要性程度，而工作时间、工资水平与独立性威胁重要性无直接关联。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967874", "t": 1, "q": "会计师事务所承接了具体的某项审计业务后，应当有相应的业务层面的防范措施来确保消除或降低独立性的威胁。下列防范措施中可能无效的是（　）", "a": ["向被审计单位的独立董事进行独立第三方咨询", "由审计项目组以外的更有经验的注册会计师复核已执行的审计工作", "向被审计单位的治理层披露服务的性质", "与被审计单位的管理层讨论职业道德问题", "", ""], "r": "D", "e": "与管理层讨论职业道德问题难以有效消除或降低独立性威胁，因为管理层可能出于自身利益等因素影响，无法客观对待独立性问题。而向独立董事咨询、更有经验注册会计师复核、向治理层披露服务性质都有助于保障独立性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967875", "t": 1, "q": "审计业务约定书一般由（　）起草。", "a": ["审计人员", "委托人", "会计师事务所与被审计单位共同", "被审计单位", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967876", "t": 1, "q": "我国社会主义审计的作用包括（　）性和促进性。", "a": ["体制", "制裁", "制度", "制约", "", ""], "r": "D", "e": "社会主义审计具有制约性和促进性作用。制约性可监督经济活动，防止违法违规；促进性推动经济健康发展。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967877", "t": 1, "q": "会计事务所应当自审计报告日起，对审计工作底稿至少保存（　）。", "a": ["永久保存", "10年", "8年", "15年", "", ""], "r": "B", "e": "根据审计准则规定，会计师事务所应当自审计报告日起，对审计工作底稿至少保存10年。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967878", "t": 1, "q": "下列关于审计程序的说法中，不正确的是（　）", "a": ["检查有形资产可提供权利和义务的全部审计证据", "观察提供的审计证据仅限于观察发生的时点", "对于询问的答复，注册会计师应当通过获取其他证据予以佐证", "分析程序包括调查识别出的、与其他相关信息不一致或与预期数据严重偏离的波动和关系", "", ""], "r": "A", "e": "检查有形资产主要能证明存在，难以提供权利和义务的全部审计证据。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967879", "t": 1, "q": "在实施进一步审计程序后，如果注册会计师认为某项交易不存在重大错报，而实际上该项交易存在重大错报，这种风险是（　）", "a": ["检查风险", "抽样风险", "非抽样风险", "重大错报风险", "", ""], "r": "A", "e": "检查风险是指如果存在某一错报，该错报单独或连同其他错报可能是重大的，注册会计师为将审计风险降至可接受的低水平而实施程序后没有发现这种错报的风险。本题中注册会计师实施程序后没发现实际存在的重大错报，属于检查风险。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967880", "t": 1, "q": "如果审计项目成员在某一实体拥有经济利益，并且知悉审计客户的董事也在该实体拥有经济利益，则应当确定是否会产生自身利益、或外在压力威胁。注册会计师应当评价威胁的重要程度并在必要时采取防范措施消除威胁或将威胁降低到可接受水平。下列防范措施恰当的是（　）", "a": ["如果会计师事务所已经承接该业务则必须马上终止该业务", "将该审计项目组成员调离项目组", "会计师事务所拒绝承接该业务", "没有任何防范措施可以消除威胁或将威胁降低到可接受水平", "", ""], "r": "B", "e": "当上述情况产生威胁时，将该审计项目组成员调离项目组可避免其因利益关系影响独立性，降低威胁。A选项直接终止业务过于绝对；C选项拒绝承接业务也不是首选；D选项说法错误，有防范措施。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967881", "t": 1, "q": "当可接受的检查风险降低时，注册会计师可能采取的措施是（　）", "a": ["消除固有风险", "将实施实质性程序的时间从期中移至期末", "缩小实质性审计程序的范围", "降低评估的重大错报风险", "", ""], "r": "B", "e": "可接受检查风险降低，需获取更具说服力的审计证据。将实质性程序时间从期中移至期末，能获取更充分适当证据。固有风险无法消除，A错；应扩大而非缩小实质性程序范围，C错；重大错报风险是客观存在，不能由注册会计师降低，D错。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967882", "t": 1, "q": "注册会计师了解被审计单位及其环境时，需要不定期地进行项目组内部的讨论，使项目组成员交流信息和分享见解，从而更好地评估重大错报风险。下列不属于项目组讨论的内容是（　）", "a": ["实质性程序无法应对的重大错报风险", "财务报表容易发生错报的领域以及发生错报的方式", "由于舞弊导致重大错报的可能性", "被审计单位面临的经营风险", "", ""], "r": "A", "e": "项目组讨论应围绕财务报表重大错报风险展开，A选项“实质性程序无法应对的重大错报风险”并非讨论内容核心。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967883", "t": 1, "q": "注册会计师接受委托对2008年大江股份有限公司财务报表进行了审计，下列选项中属于“鉴证对象”的是（　）", "a": ["大江公司2008年财务报表", "大江公司2008年度财务状况", "大江公司2008年12月31日的财务状况和该年度的经营成果及现金流量", "大江公司2008年度财务状况、经营成果和现金流量", "", ""], "r": "C", "e": "鉴证对象是鉴证对象信息所反映的内容。财务报表是鉴证对象信息，其反映的是企业特定日期的财务状况和特定期间的经营成果及现金流量。所以本题中鉴证对象是大江公司2008年12月31日的财务状况和该年度的经营成果及现金流量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967884", "t": 1, "q": "国家审计机关在审计过程中，不享有的权限是（　）", "a": ["刑事处分权", "行政处分权", "监督检查权", "纠正违法规定权", "", ""], "r": "A", "e": "审计机关主要负责对财政、财务收支等进行审计监督，没有刑事处分权，刑事处分权由司法机关行使。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967885", "t": 1, "q": "关于审计风险模型中其各要素的下列说法中，不正确的是（　）。", "a": ["审计风险是预先设定的", "重大错报风险是评估的", "审计风险是注册会计师在审计前面临的", "检查风险是注册会计师通过实施实质性程序控制的", "", ""], "r": "C", "e": "审计风险是指财务报表存在重大错报时注册会计师发表不恰当审计意见的可能性，它是注册会计师可接受的审计风险水平，是预先设定的，A正确；重大错报风险是被审计单位财务报表存在重大错报的可能性，需注册会计师评估，B正确；检查风险可通过实施实质性程序控制，D正确；审计风险是注册会计师可接受的一种水平，不是审计前就面临的实际风险，C错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967886", "t": 1, "q": "对于投资者投入的货币资本，审计时应当对比（　）进行审查。", "a": ["长期股权投资账户与实收资本账户", "资本公积账户与库存现金日记账、银行存款日记账", "实收资本账户与库存现金日记账、银行存款日记账", "长期股权投资账户与库存现金日记账、银行存款日记账", "", ""], "r": "C", "e": "投资者投入货币资本，一方面会使企业实收资本增加，应计入实收资本账户；另一方面货币资金增加，会反映在库存现金日记账和银行存款日记账中。所以审计时应对比实收资本账户与库存现金日记账、银行存款日记账进行审查。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967887", "t": 1, "q": "注册会计师在第三者面前呈现出一种独立于委托单位的身份，在他人看来，注册会计师是独立的，这种独立称之为:（　）。", "a": ["经济独立", "形式上的独立", "思想独立", "实质上的独立", "", ""], "r": "B", "e": "形式上的独立是指注册会计师在第三者面前呈现出一种独立于委托单位的身份。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967888", "t": 1, "q": "中国注册会计师协会是注册会计师的（　）组织。", "a": ["全国性", "地方性", "专业性", "特定性", "", ""], "r": "A", "e": "中国注册会计师协会是全国性的注册会计师组织，负责对全国注册会计师行业进行管理和服务。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967889", "t": 1, "q": "6、不属于审计准备阶段的内容是（　）", "a": ["编制审计计划", "确定审计重点", "明确审计任务", "正确处理期后事项", "", ""], "r": "D", "e": "审计准备阶段主要是为审计工作做前期规划和安排，包括明确任务、确定重点、编制计划等。而正确处理期后事项是审计完成阶段的工作。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967890", "t": 1, "q": "在执行审计业务时，注册会计师应当确定合理的重要性水平，下列做法正确的是（　）", "a": ["通过调低重要性水平，降低评估的重大错报风险", "通过调高重要性水平，降低评估的重大错报风险", "在确定计划的重要性水平时，应当考虑实施进一步审计程序的结果", "在确定计划的重要性水平时，应当考虑对公司及其环境的了解", "", ""], "r": "D", "e": "重要性水平与重大错报风险无直接调节关系，A、B错误；应先确定重要性水平，再实施进一步审计程序，C错误；确定计划重要性水平要考虑对被审计单位及其环境的了解。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967891", "t": 1, "q": "根据审计准则的规定，在记录实施审计程序的性质、时间和范围时，应当记录测试的特定项目或事项的特征。在记录识别特征时，下列做法正确的是（　）", "a": ["对询问程序，将询问时间作为主要识别特征", "对乙公司生成的订购单进行测试，将供货商作为主要识别特征", "对运用系统抽样的审计程序，将样本来源作为主要识别特征", "对需要选取既定总体内一定金额以上的所有项目进行测试，将该金额以上的所有项目作为主要识别特征", "", ""], "r": "D", "e": "A选项询问时间不能充分体现询问程序特征；B选项供货商不能准确代表订购单特征；C选项系统抽样样本来源不能作为主要识别特征。D选项对既定总体内一定金额以上所有项目测试，该金额以上所有项目能明确体现测试对象特征。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967892", "t": 1, "q": "哪种方法易于判断选择？", "a": ["绘图法", "调查表法", "流程图法", "文字描述法", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967893", "t": 1, "q": "具有法定证明效力的审计报告是（　）", "a": ["国家审计报告", "民间审计报告", "单位审计报告", "部门审计报告", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967894", "t": 1, "q": "在对资产存在性认定获取证据时，正确的测试方向是（　）", "a": ["从财务报表到尚未记录的项目", "从尚未记录的项目到财务报表", "从会计记录到支持性证据", "从支持性证据到会计记录", "", ""], "r": "C", "e": "存在性认定是要验证资产确实存在。从会计记录到支持性证据，能根据已记录的资产去查找相关证据来证实其存在，若能找到对应支持性证据，就可证明资产存在。而A选项从报表到未记录项目无法验证已记录资产存在；B选项从尚未记录项目到报表与验证已记录资产存在性无关；D选项从支持性证据到会计记录主要用于完整性认定。所以答案选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967895", "t": 1, "q": "统计抽样与非统计抽样（　）", "a": ["两者都不可以用概率论方法评价审计风险。", "后者可以用概率论方法评价审计风险，而前者不能。", "两者都可以用概率论方法评价审计风险。", "前者可以用概率论方法评价审计风险，而后者不能。", "", ""], "r": "D", "e": "统计抽样是运用概率论原理和数理统计方法进行样本设计和抽样，能用概率论方法评价审计风险；非统计抽样主要依赖注册会计师的主观判断，不能用概率论方法评价审计风险。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967896", "t": 1, "q": "《一般公认审计准则》适用于民间审计实施的（　）。", "a": ["财务报表审计", "离任审计", "财政审计", "经济效益审计", "", ""], "r": "A", "e": "《一般公认审计准则》主要是针对财务报表审计制定的规范，用于保证财务报表审计的质量和规范性。离任审计、财政审计、经济效益审计有各自的特点和规范。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967897", "t": 1, "q": "审计长由（　）提名。", "a": ["人大代表", "国务院总理", "国务委员", "国家主席", "", ""], "r": "B", "e": "根据相关规定，审计长由国务院总理提名。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967899", "t": 1, "q": "在执行审计业务时，注册会计师应当确定合理的重要性水平，下列做法正确的是（　）", "a": ["通过调低重要性水平，降低评估的重大错报风险", "通过调高重要性水平，降低评估的重大错报风险", "在确定计划的重要性水平时，应当考虑实施进一步审计程序的结果", "在确定计划的重要性水平时，应当考虑对公司及其环境的了解", "", ""], "r": "D", "e": "重要性水平与重大错报风险无直接关联，不能通过调整重要性水平来降低重大错报风险，AB错误；应先确定重要性水平，再实施进一步审计程序，C顺序错误；确定计划的重要性水平时，要考虑被审计单位及其环境，D正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967900", "t": 1, "q": "如果审计项目组成员在审计客户中拥有直接经济利益，下列的处理正确的是（　）", "a": ["将审计项目组成员调离项目组", "没有任何防范措施能够将这种威胁降低至可接受水平", "将项目组成员的经济利益马上处理", "请独立的有经验的注册会计师复核其工作结果", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967901", "t": 1, "q": "在执行审计业务时，注册会计师应当确定合理的重要性水平，下列做法正确的是（　）。", "a": ["通过调低重要性水平，降低评估的重大错报风险", "通过调高重要性水平，降低评估的重大错报风险", "在确定计划的重要性水平时，应当考虑对公司及其环境的了解", "在确定计划的重要性水平时，应当考虑实施进一步审计程序的结果", "", ""], "r": "C", "e": "重要性水平与重大错报风险无直接降低关系，重大错报风险是客观存在，AB错误；应在了解被审计单位及其环境基础上确定计划的重要性水平，C正确；确定计划重要性水平在实施进一步审计程序之前，不能考虑其结果，D错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967902", "t": 1, "q": "19．审计报告日是指（　）", "a": ["审计报告报送日", "会计报表截止日", "完成审计工作日", "审计报告完成日", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967903", "t": 1, "q": "民间审计属于（　）。", "a": ["专项审计", "强制审计", "突击审计", "自愿审计", "", ""], "r": "D", "e": "民间审计是由注册会计师接受委托进行的审计，委托与否取决于被审计单位意愿，属于自愿审计。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967904", "t": 1, "q": "其组成要素与“权利和义务”认定有关的是（　）。", "a": ["利润表", "审计项目目标", "审计总目标", "资产负债表", "", ""], "r": "D", "e": "“权利和义务”认定是指在某一特定日期，各项资产是否属于被审计单位的权利，各项负债是否属于被审计单位的义务，这涉及到资产和负债的归属。资产负债表列示资产和负债，与“权利和义务”认定相关。而利润表主要反映收入、费用和利润情况；审计项目目标和审计总目标侧重审计工作范围和要求，并非直接相关要素。所以答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967905", "t": 1, "q": "审计方法中的查询法可以分为询问法和（　）两种。", "a": ["函证法", "询查法", "查证法", "核查法", "", ""], "r": "A", "e": "查询法分为询问法和函证法，函证是通过向有关单位发函来获取审计证据。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967906", "t": 1, "q": "会计师事务所应当要求（　）对业务执行实施指导、监督与复核", "a": ["部门经理", "项目负责人", "项目组", "主任会计师", "", ""], "r": "B", "e": "项目负责人对业务执行全面负责，应实施指导、监督与复核。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967907", "t": 1, "q": "25.下列有关比例规模抽样的表述中，正确的是（　）", "a": ["抽样分布应当近似于正态分布", "余额为零的账户没有被选中的机会", "与低估的账户相比，高估的账户被抽取的可能性更小", "每个账户被选中的概率与其账面价值成正比", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967908", "t": 1, "q": "下列与重大错报风险相关的表述中，正确的是（　）", "a": ["管理机构错报风险是因错误使用审计程序产生的", "重大错报风险独立于财务报表审计而存在", "重大错报风险可以通过合理实施审计程序予以控制", "重大错报风险是假定不存在相关内部控制，某一认定发生重大错报的可能性", "", ""], "r": "B", "e": "重大错报风险是财务报表在审计前存在重大错报的可能性，它独立于审计而存在。A选项，错误使用审计程序产生的是检查风险；C选项，重大错报风险是客观存在，不能通过审计程序控制，只能评估；D选项描述的是固有风险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967909", "t": 1, "q": "如果审计项目成员在某一实体拥有经济利益，并且知悉审计客户的董事也在该实体拥有经济利益，则应当确定是否会产生自身利益、或外在压力威胁。注册会计师应当评价威胁的重要程度并在必要时采取防范措施消除威胁或将威胁降低到可接受水平。下列防范措施恰当的是（　）", "a": ["会计师事务所拒绝承接该业务", "如果会计师事务所已经承接该业务则必须马上终止该业务", "没有任何防范措施可以消除威胁或将威胁降低到可接受水平", "将该审计项目组成员调离项目组", "", ""], "r": "D", "e": "当审计项目成员和审计客户董事在同一实体有经济利益产生威胁时，把该审计项目组成员调离项目组可降低威胁。A选项直接拒绝承接业务太绝对；B选项已承接就马上终止也不合理；C选项说无防范措施错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967910", "t": 1, "q": "大新会计师事务所自2004年12月1日开始接受委托，已经连续3年对甲股份有限公司财务报表进行了审计，双方约定2009年3月8日对2008年度的财务报表出具审计报告并且决定在2009年9月15日后双方终止一切业务。大新会计师事务所在审计甲股份公司的审计业务期间是（　）", "a": ["2004年12月1日至2009年3月8日", "2004年1月1日至2009年3月8日", "2004年1月1日至2009年9月15日", "2004年12月1日至2009年9月15日", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967911", "t": 1, "q": "8、审计计划由（　）编制。", "a": ["助理人员", "主任会计师", "部门经理", "项目负责人", "", ""], "r": "D", "e": "审计计划通常由项目负责人编制，因为其负责具体项目执行，最了解项目情况。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967912", "t": 1, "q": "注册会计师在执行审计业务时，如果未能采取有效的防范措施降低威胁至可接受水平，则应当采取以下哪种应对方法？", "a": ["与审计客户的治理层沟通威胁的影响", "消除产生的威胁", "拒绝接受委托或解除业务约定", "与审计客户的管理层沟通威胁的影响", "", ""], "r": "C", "e": "当无法采取有效防范措施将威胁降至可接受水平时，为保证审计独立性和质量，应拒绝接受委托或解除业务约定。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967913", "t": 1, "q": "审计通知书应由（　）下达", "a": ["审计小组", "国家审计机关", "会计师事务所", "内部审计机构", "", ""], "r": "B", "e": "审计通知书是审计机关在实施审计前向被审计单位送达的书面文件。国家审计机关、内部审计机构开展审计工作时会下达审计通知书。而审计小组是执行审计任务的团队，不负责下达；会计师事务所执行审计业务用的是业务约定书。这几个选项中国家审计机关下达审计通知书更具代表性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967914", "t": 1, "q": "如果审计项目组成员作为审计客户的经理或董事，则应当采取有效的防范措施维护独立性。以下表述不正确的是（　）", "a": ["如果会计师事务所的合伙人或员工成为审计客户的公司秘书，则没有防范措施消除威胁或将其降低到可接受水平", "如果会计师事务所的合伙人或员工成为审计客户的经理或董事，则没有防范措施消除威胁或将其降低到可接受水平", "如果会计师事务所的高级管理人员为审计客户的公司秘书，则应将其调离该项目组，以维护独立性", "为支持公司秘书性职能而提供的常规的咨询工作，只要所有的相关决策是由客户的管理层做出的，通常不会被认为有损独立性", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967915", "t": 1, "q": "（　）是民间审计组织与被审单位就审计项目所签订的正式文件。", "a": ["审计通知书", "审计约定书", "审计报告", "审计建议书", "", ""], "r": "B", "e": "审计约定书是民间审计组织（会计师事务所）与被审单位签订的关于审计项目的正式文件。审计通知书是国家审计机关下发的；审计报告是审计完成后出具的结果性文件；审计建议书是审计过程中提出改进建议的文件。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967916", "t": 1, "q": "9、审计准则最早产生于（　）。", "a": ["法国", "英国", "中国", "美国", "", ""], "r": "D", "e": "审计准则最早产生于美国，其发展对世界审计准则的形成影响重大。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967917", "t": 1, "q": "会计师事务所所承接了具体的某项审计业务后，应当有相应的业务层面的防范措施来确保消除或降低独立性的威胁。下列防范措施中可能无效的是（　）", "a": ["与被审计单位的管理层讨论职业道德问题", "向被审计单位的独立董事进行独立第三方咨询", "向被审计单位的治理层披露服务的性质", "由审计项目组以外的更有经验的注册会计师复核已执行的审计工作", "", ""], "r": "A", "e": "与管理层讨论职业道德问题，管理层可能从自身利益出发，无法有效解决独立性威胁。而向独立董事咨询、向治理层披露服务性质、项目组外更有经验注册会计师复核都能一定程度保障独立性。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967918", "t": 1, "q": "下列有关审计重要性的表述中，错误的是（　）", "a": ["在考虑一项错报是否重要时，既要考虑错报的金额，又要考虑错报的性质", "如果一项错报单独或连同其他错报可能影响财务报表使用者依据财务报表做出的经济决策，该项错报是重要的", "重要性水平一旦确定就不能修改", "重要性的确定离不开职业判断", "", ""], "r": "C", "e": "重要性水平会根据实际情况的变化而修改，并非确定就不能改。A选项考虑金额和性质判断错报重要性合理；B选项符合重要性的定义；D选项重要性确定需职业判断也是正确的。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967919", "t": 1, "q": "注册会计师是否应当承担法律责任的关键是（　）", "a": ["是否有过失或欺诈行为", "是否查出财务报表所有重大错报、舞弊和违反法律法规", "是否查出财务报表所有重大错报", "是否按照执业准则的要求执业", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967920", "t": 1, "q": "我国独立审计准则的制定依据是（　）。", "a": ["《注册会计师法》", "《审计法》", "《企业会计准则》", "《会计法》", "", ""], "r": "A", "e": "《注册会计师法》是我国独立审计准则的制定依据。《审计法》主要规范政府审计；《企业会计准则》是企业会计核算的标准；《会计法》是会计工作的基本大法。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967921", "t": 1, "q": "注册会计师的审计报告的主要作用是（　）", "a": ["评价", "监督", "鉴证", "检查", "", ""], "r": "C", "e": "审计报告是注册会计师对财务报表是否在所有重大方面按照财务报告编制基础编制并实现公允反映发表审计意见的书面文件，其核心作用是鉴证，证明被审计单位财务报表的可靠性等。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967922", "t": 1, "q": "大新会计师事务所自2004年12月1日开始接受委托，已经连续3年对甲股份有限公司财务报表进行了审计，双方约定2009年3月8日对2008年度的财务报表出具审计报告并且决定在2009年9月15日后双方终止一切业务。大新会计师事务所在审计甲股份公司的审计业务期间是（　）", "a": ["2004年1月1日至2009年9月15日", "2004年12月1日至2009年9月15日", "2004年1月1日至2009年3月8日", "2004年12月1日至2009年3月8日", "", ""], "r": "D", "e": "审计业务期间是自审计项目组开始执行审计业务之日起，至出具审计报告之日止。本题中开始执行审计业务是2004年12月1日，出具审计报告是2009年3月8日。所以审计业务期间是2004年12月1日至2009年3月8日。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967923", "t": 1, "q": "审计报告中的强调事项段应放在（　）。", "a": ["说明段之后、意见段之前", "注册会计师的责任段之后、意见段之前", "说明段之前", "意见段之后", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967924", "t": 1, "q": "37.盘点库存现金通常采用（　）进行。", "a": ["强制的方式", "预告的方式", "从快的方式", "突击的方式", "", ""], "r": "D", "e": "为保证库存现金的真实性和准确性，防止被盘点单位提前做准备掩盖问题，盘点库存现金通常采用突击方式。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967925", "t": 1, "q": "在财务报表审计中，关联方交易的审计重点是（　）", "a": ["交易是否合理", "会计处理是否正确", "交易是否合法", "报表披露是否充分", "", ""], "r": "D", "e": "关联方交易审计重点在于其报表披露是否充分，这能让报表使用者全面了解关联方交易对企业财务状况和经营成果的影响。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967926", "t": 1, "q": "如果审计项目组成员在审计客户中拥有直接经济利益，下列的处理正确的是（　）", "a": ["将审计项目组成员调离项目组", "没有任何防范措施能够将这种威胁降低至可接受水平", "将项目组成员的经济利益马上处理", "请独立的有经验的注册会计师复核其工作结果", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967927", "t": 1, "q": "55.检查开具发票或收款的日期、记账的日期、发货的日期（　）是主营业务收入截止测试的关键所在。", "a": ["相距是否不超过30天", "是否临近", "是否在同一天", "是否在同一会计期间", "", ""], "r": "D", "e": "主营业务收入截止测试主要是为了确保收入记录在正确的会计期间，所以关键在于开具发票或收款日期、记账日期、发货日期是否在同一会计期间。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967928", "t": 1, "q": "注册会计师应当评价已识别对客观性的威胁的重要程度并在必要时采取防范措施消除威胁或将威胁降低到可接受水平。下列防范措施中不能降低威胁的是（　）", "a": ["退出项目组", "与客户管理层讨论可能威胁的事项", "终止产生威胁的经济利益", "与会计师事务所内部高级管理层讨论该事项", "", ""], "r": "B", "e": "与客户管理层讨论可能威胁的事项，客户管理层站在自身利益角度，无法有效降低对注册会计师客观性的威胁。而退出项目组、终止产生威胁的经济利益、与事务所内部高级管理层讨论都能在一定程度上消除或降低威胁。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967929", "t": 1, "q": "下列有关“完整性”的认定中，表达不正确的有（　）。", "a": ["该认定所要解决的问题是被审计单位管理层是否把应包括的项目给遗漏或省略了", "该认定还涉及所报告的交易和项目的金额是否正确", "该认定主要与财务报表组成要素的低估有关", "该认定是指应在财务报表中列示的所有交易和项目是否都列入了", "", ""], "r": "B", "e": "完整性认定关注的是应包含的项目有无遗漏，与低估相关，而金额正确性是准确性认定的内容。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967931", "t": 1, "q": "国家审计、民间审计和内部审计三者的审计程序（　）", "a": ["基本相同但各有特点", "完全不同", "完全相同", "基本不同但个别一致", "", ""], "r": "A", "e": "这三种审计都有准备、实施和终结阶段等通用流程，所以基本相同，但因审计主体、目标等差异，又各有特点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967932", "t": 1, "q": "9．因借贷原理不熟，造成借贷反向或错“借”错“贷”而造成的错误属于（　）。", "a": ["管理性错误", "技术性错误", "原则性错误", "制度性错误", "", ""], "r": "B", "e": "借贷反向或错“借”错“贷”是因借贷原理不熟这类技术层面问题导致的错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967933", "t": 1, "q": "注册会计师在审计中发现被审计单位的内部控制存在的问题，应当（　）。", "a": ["根据问题的性质确定采取的方式，只有非常严重的内部控制问题，才向客户提出", "因为内部控制不是审计的重要内容，不对此进行说明", "随时向客户有关部门或人员提出，并交换意见", "在审计业务完成后，以管理建议书的形式反映", "", ""], "r": "C", "e": "注册会计师在审计中发现内控问题应及时与被审计单位沟通，随时向客户有关部门或人员提出并交换意见。A选项仅对非常严重问题才提出不合理；B选项内部控制是审计重要内容；D选项不应只在审计业务完成后以管理建议书形式反映。所以选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967934", "t": 1, "q": "4、宋代审计司(院)的建立，是我国“审计”的正式命名，从此，“审计”一词便成为（　）的专用名词。", "a": ["经济执法", "财会审核", "财政监督", "经济监督", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967935", "t": 1, "q": "对于未函证的应收账款，审计人员应当执行的最有效的审计程序是（　）。", "a": ["重新测试相关的内部控制制度", "实施分析程序", "审查资产负债表日后的收款情况", "抽查有关的原始凭证", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967936", "t": 1, "q": "功能测试的目的是证明（　）的有效性。", "a": ["程序", "强化控制", "控制", "控制程序", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967937", "t": 1, "q": "在财务报表审计中，关联方交易的审计重点是（　）", "a": ["会计处理是否正确", "报表披露是否充分", "关联方关系及其交易是否真实存在", "交易价格是否公允", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967938", "t": 1, "q": "民间审计人员在执行审计业务中，发现内部控制有重大缺陷的，应当在（　）中明确提出。", "a": ["管理建议书", "审计工作底稿", "出具的报告书", "审计约定书", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967939", "t": 1, "q": "如果审计项目组成员的直系亲属从审计客户购买商品或服务，则下列说法不正确的是（　）", "a": ["如果交易过程正常、公正，则通常不会对独立性产生威胁", "如果交易性质特殊或金额较大，则可能产生自身利益威胁", "会计师事务所不能承接该业务", "会计师事务所应当评价威胁的重要程度，并在必要时采取防范措施将威胁降低到可接受水平", "", ""], "r": "C", "e": "审计项目组成员直系亲属从审计客户购买商品或服务，正常公正交易一般不影响独立性，特殊或金额大可能有威胁，事务所应评价并必要时采取措施，并非不能承接业务。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967940", "t": 1, "q": "在委托人没有特定要求的条件下，注册会计师出具的审计报告一般是（　）", "a": ["详式审计报告", "非公布目的的审计报告", "标准审计报告", "一般审计报告", "", ""], "r": "C", "e": "在委托人无特定要求时，注册会计师通常出具标准审计报告，它格式和措辞规范统一。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967941", "t": 1, "q": "下列各项中，与公司财务报表层次重大错报风险评估最相关的是（　）", "a": ["公司应收账款周转率呈明显下降趋势", "公司持有大量高价值且易被盗窃的资产", "公司的生产成本计算相当复杂", "公司控制环境薄弱", "", ""], "r": "D", "e": "财务报表层次重大错报风险与财务报表整体广泛相关，控制环境薄弱会影响整个企业的内部控制有效性，对财务报表整体产生广泛影响，与财务报表层次重大错报风险评估最相关。而选项A、B、C多与特定账户或交易相关，属于认定层次风险。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967942", "t": 1, "q": "审计人员对被审计会计报表不能发表意见，应（　）。", "a": ["拒绝提供审计报告", "拒绝接受委托", "发表否定意见", "无法表示意见", "", ""], "r": "D", "e": "当审计人员对被审计会计报表不能发表意见，意味着因某些限制无法获取充分、适当审计证据以对报表整体发表审计意见，此时应发表无法表示意见。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967943", "t": 1, "q": "2.注册会计师审计产生的直接原因是（　）", "a": ["所有权与经营权的分离", "合伙企业制度产生", "股份制企业制度的形成", "资本市场的发展", "", ""], "r": "A", "e": "随着所有权与经营权分离，所有者需要监督经营者履职情况，注册会计师审计应运而生。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967944", "t": 1, "q": "对库存现金实有数额的审计，应是通过对库存现金实施（　）来进行的。", "a": ["审阅", "核对", "盘点", "分析", "", ""], "r": "C", "e": "盘点库存现金能直接确定其实际数额。审阅、核对、分析并不能直接确认库存现金实有数额。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967945", "t": 1, "q": "7、确定重要性水平是在审计（　）中进行。", "a": ["实施阶段", "终结阶段", "准备阶段", "后续阶段", "", ""], "r": "C", "e": "确定重要性水平是审计准备阶段的工作内容，为后续审计工作开展提供基础。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967946", "t": 1, "q": "13.下列各项中，为获取适当审计证据所实施的审计程序与审计目标最相关的是（　）", "a": ["实地观察甲公司固定资产，以确定固定资产的所有权", "对已盘点的甲公司存货进行检查，将检查结果与盘点记录相核对，以确定存货计价的正确性", "从甲公司销售发票中选取样本，追查至对应的发货单，以确定销售的完整性", "复核甲公司编制的银行存款余额调节表，以确定银行存款余额的正确性", "", ""], "r": "D", "e": "A项实地观察不能确定所有权；B项检查与盘点记录核对主要是验证存在，而非计价；C项从销售发票追查发货单是验证发生，不是完整性；D项复核银行存款余额调节表可确定银行存款余额正确性。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034528664581967947", "t": 1, "q": "下列相关业务中，需要注册会计师执行审计性质程序的是（　）", "a": ["管理咨询", "对财务信息执行商定程序", "代编财务信息", "税务服务", "", ""], "r": "B", "e": "审计性质程序是为获取充分、适当审计证据，以合理保证财务报表不存在重大错报。选项A管理咨询、C代编财务信息、D税务服务都不涉及审计性质程序。对财务信息执行商定程序需获取证据，类似审计性质程序。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871808", "t": 2, "q": "独立性原则要求下列哪些与审计客户保持独立", "a": ["审计项目组成员", "网络事务所", "会计师事务所", "网络", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871809", "t": 2, "q": "下列项目，属于注册会计师业务范围的有（　）。", "a": ["财务报表审阅", "会计咨询", "财务报表审计", "税务代理", "", ""], "r": "ABCD", "e": "注册会计师业务包括鉴证业务和相关服务。财务报表审计、审阅是鉴证业务；会计咨询、税务代理是相关服务。ABCD选项都在注册会计师业务范围内。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871810", "t": 2, "q": "审计抽样应当具备以下特征（　）", "a": ["审计测试的目的是为了评价该账户余额或交易类型的某一特征", "对某类交易或账户中低于百分之百的基础上实施审计程序", "抽样风险可以完全消除", "所有抽样单元都有被抽取的机会", "", ""], "r": "ABD", "e": "审计抽样是对低于百分之百的项目实施程序，所有抽样单元都有被抽中机会，目的是评价账户余额或交易某特征，且抽样风险不能完全消除。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871811", "t": 2, "q": "中国注册会计师协会会员包括（　）", "a": ["注册会计师协会团体会员", "非执业会员", "会计师事务所团体会员", "执业注册会计师个人会员", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871812", "t": 2, "q": "内部会计控制包括（　）", "a": ["会计凭证控制", "会计分析控制", "会计账簿控制", "会计报表控制", "", ""], "r": "ACD", "e": "内部会计控制主要围绕会计核算的凭证、账簿、报表等环节，以保证会计信息真实、完整等。会计凭证、账簿、报表控制是内部会计控制的重要内容。而会计分析控制并非内部会计控制的范畴。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871813", "t": 2, "q": "在了解控制环境时，注册会计师应当关注的内容有（　）", "a": ["公司治理层相对于管理层的独立性", "公司管理层的理念和经营风格", "公司员工整体的道德价值观", "公司对控制的监督", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871814", "t": 2, "q": "（　）为审计终结阶段工作的内容。", "a": ["复核审计工作底稿", "撰写审计报告", "签署审计业务约定书", "正确处理期后事项", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871815", "t": 2, "q": "审计小组小王的妻子是丙公司的合伙人，以下防范措施能够消除威胁独立性情形的有（　）", "a": ["审计报告意见段增加强调事项段", "该事务所拒绝接受丙公司的审计业务", "将小王调离项目组", "请其他注册会计师复核小王的审计工作底稿", "", ""], "r": "BC", "e": "审计人员亲属在被审计单位有利益关系会威胁独立性，拒绝接受业务可从源头消除威胁；调离有利益关联人员也能消除威胁。增加强调事项段不能消除独立性威胁；复核工作底稿也无法从根本上消除因亲属关系带来的独立性问题。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871816", "t": 2, "q": "注册会计师审计方法的发展经历了以下哪些阶段（　）", "a": ["以被审计单位是否遵守了特定的法律、法规、程序或规则为特征的例规性审计", "以重大错报风险的识别、评估、应对为审计工作主线的风险导向审计", "以会计凭证和账簿的详细检查为特征的账项基础审计", "以内部控制测试为基础的抽样审计为特征的制度基础审计", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871817", "t": 2, "q": "大新会计师事务所已于2008年2月1日至4月28日为公司设计完成了计算机会计数据系统。大新会计师事务所2008年12月1日接受委托对乙公司2008年度的财务报表进行审计。大新会计师事务所如果准备承接乙公司2008年度的财务报表审计，则需要采取下列哪些防范措施将威胁独立性的影响降低到可接受水平", "a": ["大新会计师事务所主任会计师复核非鉴证服务的结果", "大新会计师事务所不允许提供非鉴证服务的人员参与审计业务", "获得乙公司对非鉴证服务的结果承担责任的承诺", "与乙公司的管理层讨论独立性", "", ""], "r": "ABC", "e": "为避免非鉴证服务对审计独立性的威胁，不允许提供非鉴证服务的人员参与审计业务可从人员上隔离影响；事务所主任会计师复核非鉴证服务结果、获乙公司对非鉴证服务结果担责承诺能降低威胁；与管理层讨论独立性不能有效降低影响。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871818", "t": 2, "q": "投资活动的内部控制应该包括以下几个方面（　）。", "a": ["投资资产的安全保护控制", "投资资产的定期盘点控制", "投资计划的审批授权控制", "投资业务的职责分工控制", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871819", "t": 2, "q": "审计人员的素质要求主要表现在哪两个方面？", "a": ["政治素质", "品德修养", "业务素质", "工作经验", "", ""], "r": "AC", "e": "审计人员素质要求主要是政治素质和业务素质两方面。政治素质确保审计人员有正确立场和价值观，业务素质保证其能胜任审计工作。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871820", "t": 2, "q": "审计证据的鉴定方法主要有（　）等。", "a": ["比较", "分类", "计算", "盘存", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871821", "t": 2, "q": "按审计主体分类，可以把审计分为（　）。", "a": ["民间审计", "内部审计", "政府审计", "外部审计", "", ""], "r": "ABC", "e": "按审计主体分类，审计可分为政府审计（由政府审计机关实施）、内部审计（企业内部审计机构开展）和民间审计（由注册会计师事务所等社会审计组织进行）。外部审计是相对内部审计而言，不是按审计主体的分类。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871822", "t": 2, "q": "在编制审计计划时，需要考虑影响样本量大小的有关事项，对审计抽样工作进行规划。以下各项表述中，正确的有（　）", "a": ["可依赖程度要求越高，需选取的样本量越大", "预期误差越小，需选取的样本量越小", "可容忍误差越小，需选取的样本量越大", "划分的次级总体越多，需选取的样本量越小", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871823", "t": 2, "q": "我国审计专业技术职称包括（　）。", "a": ["注册会计师", "高级审计师", "审计师", "助理审计师", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871824", "t": 2, "q": "下列情形中，属于产生自我评价威胁的有（　）", "a": ["审计客户的董事最近曾是会计师事务所的合伙人", "审计项目组成员现在是或最近曾是客户的董事或高级管理人员", "审计项目组成员与客户的董事存在直系亲属关系", "审计项目组负责人最近曾受雇于客户", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871826", "t": 2, "q": "如果会计师事务所在承接审计客户业务时发现与客户之间存在重大商业关系，会计师事务所应当采取下列措施（　）来降低威胁独立性的影响", "a": ["出具非标准审计报告", "会计师事务所终止该商业业务", "会计师事务所降低商业关系的重要性，使经济利益不重大、商业关系明显不重要", "拒绝执行该审计业务", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871827", "t": 2, "q": "审计关系人由（　）组成。", "a": ["审计人", "被审计人", "审计委托人", "审计法规", "", ""], "r": "ABC", "e": "审计关系人包括审计人、被审计人、审计委托人。审计法规是审计工作依据的规范，不属于审计关系人。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871828", "t": 2, "q": "样本选取的方法有（　）", "a": ["整群选样法", "系统选取法", "随机数表法", "分层法", "", ""], "r": "ABCD", "e": "样本选取方法多样，整群选样是将总体分成若干群并随机选群；系统选取法按一定间隔选取样本；随机数表法利用随机数表选样本；分层法是将总体按特征分层后选样。ABCD 选项均为常见样本选取方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871829", "t": 2, "q": "注册会计师因为以下原因可能导致承担法律责任的有（　）", "a": ["违约", "欺诈", "重大过失", "行政责任", "", ""], "r": "ABC", "e": "注册会计师承担法律责任的原因包括违约、过失（重大过失属于过失情形）、欺诈。行政责任是法律责任的一种类型，并非导致承担法律责任的原因。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871830", "t": 2, "q": "如果要注册成为一名注册会计师，在遇到下列情形时将不予注册（　）", "a": ["自行停止执业满2年", "失去了完全民事能力", "在经济管理工作或在财务、会计、审计和企业管理工作中受到通报批评或警告", "受到刑事处罚", "", ""], "r": "BD", "e": "注册会计师不予注册情形包括不具完全民事行为能力、受刑事处罚等。A选项自行停止执业满1年才不予注册；C选项通报批评或警告通常不影响注册。B失去完全民事能力、D受刑事处罚符合不予注册情况。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871831", "t": 2, "q": "注册会计师计划对业务流程层面的有关控制进行进一步了解和评价，注册会计师应当确定（　）", "a": ["被审计单位是否建立了有效的控制，以发现并纠正错报", "被审计单位是否遗漏了必要的控制", "控制是否一贯运行", "是否识别了可以最有效测试的控制", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871832", "t": 2, "q": "审计的职能包括（　）。", "a": ["经济鉴证", "经济评价", "经济监督", "经济司法", "", ""], "r": "ABC", "e": "审计具有经济监督、经济评价和经济鉴证职能。经济司法不属于审计职能。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871833", "t": 2, "q": "在实施存货监盘程序时，注册会计师应当（　）。", "a": ["对被审计单位所有存货盘点资料详加审核，并归入审计档案", "实际参与被审计单位的存货盘点", "对被审计单位存货的盘点进行现场监督", "对被审计单位已经盘点的存货进行抽点", "", ""], "r": "CD", "e": "存货监盘时，注册会计师主要是对存货盘点进行现场监督，并对已盘点存货进行抽点。A选项详加审核所有盘点资料并非监盘核心；B选项注册会计师不是实际参与盘点，而是监督。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871834", "t": 2, "q": "在确定特别风险时，注册会计师的下列做法正确的有（　）", "a": ["直接假定公司收入确认存在特别风险", "将公司管理层舞弊导致的重大错报风险确定为特别风险", "直接假定公司存货存在特别风险", "将公司管理层凌驾于控制之上的风险确定为特别风险", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871835", "t": 2, "q": "如果会计师事务所要保持一项业务，则应当确定现有的防范措施对于消除对独立性的威胁或将威胁降低到可接受水平是否有效，否则应（　）", "a": ["终止业务", "采取其他防范措施", "拒绝接受", "将审计业务变更为审阅业务", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871836", "t": 2, "q": "对以下注册会计师审计理解的陈述中，恰当的有（　）", "a": ["注册会计师对财务报表审计的核心环节是对财务报表重大错报风险的“识别、评估和应对”", "注册会计师在财务报表审计中应根据被审计单位所采用的企业会计准则和相关会计制度来判断其财务报表编制是否合法，财务报表反映的内容是否公允", "注册会计师在财务报表审计中必须查出财务报表中所有舞弊", "注册会计师必须收集基于认定的充分适当的审计证据才能对财务报表发表审计意见", "", ""], "r": "ABD", "e": "A选项，识别、评估和应对重大错报风险是审计核心环节；B选项，审计需依据准则判断报表合法性与公允性；D选项，收集充分适当审计证据是发表意见基础。C选项，注册会计师只能合理保证发现重大舞弊，而非查出所有舞弊。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871837", "t": 2, "q": "应收账款消极式函证回函的客户一般均对被审计单位的记载和叙述持有异议，但有的情况下注册会计师仍然认可被审计单位应收账款的存在性，这些情况包括（　）。", "a": ["被审计单位已发出商品，但货物在途，询证函早于货物送达客户", "债务人已于函证日前付款，而被审单位在函证日前尚未收到款项", "货物已送达债务人，但债务人尚未收到询证函", "债务人要求退货", "", ""], "r": "ABC", "e": "消极式函证回函未提出异议，在A选项货物在途询证函早到、B选项债务人已付款被审单位未收到款、C选项货物已送达但债务人未收到询证函等情况下，虽未回函提出异议，仍可认可应收账款存在性；D选项债务人要求退货说明应收账款可能有问题，不能认可存在性。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871838", "t": 2, "q": "在注册会计师的鉴证业务中，下列属于“预期使用者”的有（　）", "a": ["股东及潜在投资者", "管理层", "债权人", "证券交易机构", "", ""], "r": "ACD", "e": "预期使用者是指预期使用鉴证报告的组织或人员，股东及潜在投资者、债权人、证券交易机构都可能使用鉴证报告；管理层虽也是信息使用者，但通常是编制者，一般不算预期使用者概念范畴内。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871839", "t": 2, "q": "审查书面资料的方法有（　）。", "a": ["核对法", "审阅法", "比较法", "查询法", "", ""], "r": "ABCD", "e": "核对法、审阅法、比较法、查询法都可用于审查书面资料。核对法可核实资料数据准确性；审阅法能审查资料内容合规性等；比较法可对比数据发现差异；查询法可通过询问获取信息辅助审查。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871840", "t": 2, "q": "注册会计师正在执行某上市公司2008年度财务报表审计业务，下列情形中遵循了保密原则的有（　）", "a": ["在未得到该公司授权情况下向法庭提供作为共同被告而证实自己遵循审计准则的审计工作底稿", "在未得到该公司同意的情况下将该公司利润分配政策提供给该公司所在行业联营单位", "在未得到该公司授权情况下向中国证券会报告其发现的该公司隐瞒巨额收入的偷税行为", "在未得到该公司授权情况下向后任注册会计师提供2008年审计工作底稿", "", ""], "r": "AC", "e": "保密原则有例外情况，向法庭提供审计工作底稿用于证明自身遵循准则、向监管机构报告违法行为属于例外可披露。B选项未经同意向联营单位提供信息违反保密；D选项向后任提供底稿需经被审计单位授权。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871841", "t": 2, "q": "下列属于证实银行存款存在的重要程序有（　）。", "a": ["审查银行存款余额调节表", "审查银行存款收支截止的正确性", "函证银行存款余额", "核对银行存款余额日记账与总账的余额是否相符", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871842", "t": 2, "q": "注册会计师职业道德明确包含以下基本原则（　）", "a": ["独立、客观、公正和廉洁", "专业胜任能力和应有的关注", "职业行为原则和保密原则", "诚信、独立、客观", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871843", "t": 2, "q": "下列情形中属于产生过度推介威胁的是（　）", "a": ["审计项目负责人与鉴证客户存在重要的密切关系", "注册会计师在被审计单位与第三方发生诉讼或纠纷时担任客户的辩护人", "会计师事务所推介审计客户的股份", "会计师事务所过分依赖向某一客户收费", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871844", "t": 2, "q": "如果会计师事务所在承接审计客户业务时发现与客户之间存在重大商业关系，会计师事务所应当采取下列措施（　）来降低威胁独立性的影响", "a": ["拒绝执行该审计业务", "会计师事务所降低商业关系的重要性，使经济利益不重大、商业关系明显不重要", "出具非标准审计报告", "会计师事务所终止该商业业务", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871845", "t": 2, "q": "技术经济标准是指（　）来表明相关经济部门、各企业对生产水平、管理水平和经济效率的指标。", "a": ["绝对数", "相对数", "平均数", "指数", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871846", "t": 2, "q": "审计人员依据不同的要求和方法，从审计对象总体中选取若干（　），就构成了不同的（　）。", "a": ["抽样单位", "样本", "可容忍误差", "抽样风险", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871847", "t": 2, "q": "投资活动的内部控制应该包括以下几个方面（　）。", "a": ["投资计划的审批授权控制", "投资资产的定期盘点控制", "投资业务的职责分工控制", "投资资产的安全保护控制", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871848", "t": 2, "q": "审计人员对被审事项合法、合规性评价有（　）等依据:", "a": ["法理", "法规", "制度", "法律", "", ""], "r": "BCD", "e": "审计人员对被审事项合法、合规性评价的依据通常是具有权威性的法律法规以及单位内部制度。法理更多是理论层面，一般不直接作为评价依据。法规、制度、法律都可作为依据。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871849", "t": 2, "q": "证实客观事物的方法，主要包括（　）。", "a": ["鉴定法", "调节法", "观察法", "盘存法", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871850", "t": 2, "q": "5、审计与会计的区别主要表现在（　）", "a": ["产生的基础不同", "方法不同", "工作程序不同", "职能不同", "", ""], "r": "ABCD", "e": "审计和会计在产生基础、方法、工作程序、职能等方面都存在差异。审计是为了监督和评价会计工作，其产生源于经济监督需求，而会计源于记录和核算经济活动；二者运用的方法和遵循的工作程序也不同，职能上会计侧重核算和监督经济业务，审计侧重监督、评价和鉴证。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871851", "t": 2, "q": "注册会计师编制的审计工作底稿应当使得未曾接触该项审计工作的有经验的专业人士清楚地了解（　）方面内容", "a": ["实施审计程序的结果和获取的审计证据", "审计证据是否充分、适当", "按照审计准则的规定实施的审计程序的性质、时间和范围", "就重大事项得出的结论", "", ""], "r": "ACD", "e": "审计工作底稿应让未接触该审计工作的有经验专业人士了解审计程序相关情况、实施结果与获取证据、重大事项结论等。A体现结果与证据，C说明审计程序情况，D涉及重大事项结论，均是应了解内容。B审计证据是否充分适当是审计过程判断，并非工作底稿要让他人了解的直接内容。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871852", "t": 2, "q": "题目2.收集审计证据的基本要求是（　）。", "a": ["成本效益性", "相关性", "独立性", "重要性", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871853", "t": 2, "q": "财务费用的实质性程序一般包括（　）。", "a": ["检查利息支出明细账", "检查财务费用是否已在资产负债表上恰当披露", "检查汇兑损失明细账", "获取或编制财务费用明细表", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871854", "t": 2, "q": "会计师事务所应当制定下列政策和程序（　）以防范同一高级人员由于长期执行某一客户的鉴证业务可能对独立性造成威胁", "a": ["建立适当的标准，以便确定是否需要采取防范措施，将由于关系密切造成的威胁降低到可接受水平", "规定高级管理人员提供鉴证业务的服务年限", "对所有的上市公司财务报表审计，按照法律法规的规定定期轮换项目负责人", "考虑鉴证业务的性质，包括涉及公众利益的范围", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871855", "t": 2, "q": "关于审计的分类可以从不同的角度加以考察，下列对审计的分类表述恰当的是（　）", "a": ["审计按内容的不同可分为财务报表审计、经营审计和合规性审计", "审计按目的的不同可分为合理保证审计和有限责任审计", "审计按主体的不同可分为政府审计、内部审计和注册会计师审计", "审计按与被审计单位的关系不同可分为内部审计和外部审计", "", ""], "r": "ACD", "e": "审计按内容分为财务报表审计、经营审计和合规性审计；按目的分为合理保证审计和有限保证审计（不是有限责任审计）；按主体分为政府审计、内部审计和注册会计师审计；按与被审计单位关系分为内部审计和外部审计。各选项A、C、D表述正确。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871856", "t": 2, "q": "以下内部控制中，能够防止或发现购货及付款发生错误或舞弊的有（　）。", "a": ["收到购货发票后，应立即送采购部门与订货单、验收单核对是否一致", "采用总价法记录现金折扣，并严格复核是否发生折扣损失", "现购业务必须经财会部门批准后方可支付价款", "所有订货单应经采购部门及有关部门批准，其副本应及时提交财会部门", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871857", "t": 2, "q": "6.流程图法的优点有（　）。", "a": ["省事省力", "深入分析问题", "直观展示过程", "灵活适应变化", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871858", "t": 2, "q": "9．错误与舞弊的主要区别表现在（　）。", "a": ["形式不同", "动机不同", "结果不同", "手段不同", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871859", "t": 2, "q": "审计人员依据不同的要求和方法，从审计对象总体中选取若干（　），就构成了不同的（　）。", "a": ["可容忍误差", "样本", "抽样风险", "抽样单位", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871860", "t": 2, "q": "在抽样风险中，导致注册会计师执行额外的审计程序，降低审计效率的风险有（　）。", "a": ["误受风险", "误拒风险", "信赖过度风险", "信赖不足风险", "", ""], "r": "BD", "e": "误拒风险是指推断的总体错报高于实际错报时拒绝接受总体的风险，会使注册会计师执行额外程序；信赖不足风险是指推断的控制有效性低于实际有效性的风险，也会让注册会计师执行额外程序，二者都会降低审计效率。误受风险和信赖过度风险会影响审计效果。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871861", "t": 2, "q": "在对乙公司短期借款实施相关审计程序后，需对所取得的审计证据进行评价。以下有关短期借款的证据可靠性的论述中，正确的是（　）", "a": ["短期借款的控制风险为低水平时，产生的会计数据比控制风险为高水平时产生的会计数据更可靠", "短期借款的控制风险为高水平时，产生的会计数据比控制风险为低水平时产生的会计数据更可靠", "乙公司提供的短期借款合同尽管有借贷双方的签章，但如果没有其他证据佐证，也不可靠", "从第三方获取的有关短期借款的证据比直接从乙公司获得的相关证据更可靠", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871862", "t": 2, "q": "信息系统的使用给企业的管理和会计核算带来的变化有（　）", "a": ["记录方式由计算机输入和输出设备代替了手工记录", "传递方式由网络信息和电子邮件代替公司间的邮寄", "储存方式由计算机文档代替纸质日记账和分类账", "灵活多样的报告代替了固定的定期报告", "", ""], "r": "ABCD", "e": "信息系统使用后，在记录、传递、储存和报告方面都有明显变化，ABCD选项分别体现了这几方面的改变。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871863", "t": 2, "q": "下列哪些为内部控制的要素？", "a": ["监督", "控制环境", "控制活动", "信息交流", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528667450871864", "t": 2, "q": "注册会计师实施的进一步审计程序时，可能选择的程序类型包括（　）。", "a": ["检查、观察", "询问、函证、分析程序", "将财务报表与各账户核对", "重新计算、重新执行", "", ""], "r": "ABD", "e": "进一步审计程序类型有检查、观察、询问、函证、重新计算、重新执行、分析程序等。选项A、B、D都属于这些类型。而选项C将财务报表与各账户核对并非进一步审计程序的典型程序类型。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225024", "t": 3, "q": "审计业务约定书不具有法律效力。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计业务约定书是会计师事务所与被审计单位签订的，明确双方权利和义务的书面协议，具有法律效力。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225025", "t": 3, "q": "固有风险与检查风险成反向关系。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225026", "t": 3, "q": "企业的收益性支出是指在经营过程中发生、其效益仅与本会计年度相关、因而由本年收益补偿的各项支出。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "收益性支出定义就是在经营中发生，效益仅与本会计年度相关，由本年收益补偿的支出。", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225027", "t": 3, "q": "确定重要性水平是在审计实施阶段中进行。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "确定重要性水平是在审计计划阶段进行，并非审计实施阶段。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225028", "t": 3, "q": "审计报告的签署日期应为完稿日期或会计报表截止日。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计报告签署日期是注册会计师完成审计工作的日期，并非完稿日期，也不是会计报表截止日。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225029", "t": 3, "q": "中国注册会计师协会是行业纪律组织，不承担行政管理职能。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225030", "t": 3, "q": "单位不得由一人办理货币资金业务的全过程。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "为防止货币资金业务出现舞弊等情况，单位应进行不相容职务分离，不能让一人办理货币资金业务全过程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225031", "t": 3, "q": "独立审计是指独立的审计组织所进行的审计。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225032", "t": 3, "q": "6．民间审计报告都有说明段。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "民间审计报告中，只有保留意见、否定意见和无法表示意见的审计报告才有说明段，标准无保留意见审计报告没有说明段。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225033", "t": 3, "q": "审计程序是审计人员在审计实施阶段所必须遵循的审计工作步骤。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225034", "t": 3, "q": "因为不存在满意的替代程序来观察和计量期末存货，所以审计人员必须对被审计单位的存货进行监盘。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当不存在满意的替代程序来观察和计量期末存货时，监盘是获取存货存在和状况审计证据的重要程序，审计人员通常必须对被审计单位的存货进行监盘。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225035", "t": 3, "q": "注册会计师对被审计单位财务报表的合法性、公允性承担审计责任。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "注册会计师的审计目标是对财务报表的合法性和公允性发表审计意见，需对其承担审计责任。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225036", "t": 3, "q": "国家审计机关无权审查财政预算的执行和财政决算。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "国家审计机关有权对财政预算的执行和财政决算进行审查监督，题干表述与事实不符。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225037", "t": 3, "q": "部门经理复核是审计工作底稿复核最重要的环节。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "项目合伙人复核才是审计工作底稿复核最重要的环节，并非部门经理复核。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225038", "t": 3, "q": "只有注册会计师在执行审计程序时获得的重要资料，才能作为审计证据。注册会计师在审计过程之外获得的资料，不能作为审计证据。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计证据来源广泛，不限于执行审计程序时获得，在审计过程之外获得且符合相关性和可靠性要求的资料也能作为审计证据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225039", "t": 3, "q": "函询是通过向有关单位发函了解情况取得证据的方法，这种方法一般用于往来款项的查证。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "函询就是发函了解情况获取证据，常用于往来款项查证，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225040", "t": 3, "q": "分析性测试是指通过分析各种财务数据间的关系，来获得必要的证据，以此作为证实财务会计报表数据有关关系是否公允的审计结论的依据。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分析性测试就是通过分析不同财务数据间的内在联系，获取审计证据，用以验证财务报表数据关系是否公允。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225041", "t": 3, "q": "9．职务岗位明确和权利义务清楚是界定职权范围的原则。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "界定职权范围需保证职务岗位明确、权利义务清晰，这样才能让职权的行使有明确依据和界限。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225042", "t": 3, "q": "审计报告的报送对象只能是本级人民政府。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计报告报送对象不只是本级人民政府，还可报送上级审计机关等。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034528668516225043", "t": 3, "q": "拒绝表示意见审计报告就是不发表审计意见。（　）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "拒绝表示意见审计报告是注册会计师在审计过程中因审计范围受到严重限制等情况，无法获取充分、适当审计证据，从而不发表肯定、保留或否定的审计意见，但这也是一种审计意见的表达形式，并非不发表审计意见。 ", "ap": [fal
