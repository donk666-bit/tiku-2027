"桥架采用可拆卸盖板，便于电缆检修", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488579", "t": 2, "q": "在工业设计中，中国华电集团电站用手推车的设计需考虑搬运效率，下列哪些设计要素可提升搬运效率？", "a": ["手推车采用折叠式结构，便于收纳", "手推车设置多层货架，增加装载量", "手推车采用大直径车轮，减少推行阻力", "手推车扶手高度适配人体工程学，减少推行疲劳", "", ""], "r": "BCD", "e": "提升搬运效率可从增加装载量、减少推行阻力、降低人力消耗等方面入手。B增加装载量，C减少推行阻力，D减少推行疲劳，都利于提升搬运效率；A便于收纳主要是解决存放问题，和搬运效率直接关系不大。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488580", "t": 2, "q": "在工业设计中，中国华电集团电站用手推车的设计需考虑货物搬运安全性，下列哪些设计要素可提升安全性", "a": ["手推车载重量标识清晰，避免超载使用", "手推车设置制动装置，防止停靠时滑动", "手推车车身设置反光条，提升夜间辨识度", "手推车扶手高度可调节，适配不同身高用户", "", ""], "r": "ABC", "e": "A选项载重标识清晰能避免超载保障安全；B选项制动装置可防止停靠滑动；C选项反光条提升夜间辨识度，这些都直接与货物搬运安全性相关。D选项扶手高度可调节主要是为了适配不同身高用户，提升使用舒适度，与货物搬运安全性关联不大。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488581", "t": 2, "q": "在工业设计中，中国华电集团电站用手推车的设计需考虑稳定性与安全性，下列哪些设计要素可提升手推车的稳定性？", "a": ["增加手推车的载重量上限", "在车身后部设置配重块", "将手推车的重心设计在车轮支撑范围内", "采用大直径车轮，增加接地面积", "", ""], "r": "BCD", "e": "增加载重量上限与稳定性无关；车身后部设置配重块可降低重心，将重心设计在车轮支撑范围内能保证稳定，大直径车轮增加接地面积也有助于提升稳定性。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488582", "t": 2, "q": "在工业设计中，中国华电集团电站用梯子的设计需考虑攀爬安全性，下列哪些设计要素可保障安全", "a": ["梯子扶手高度符合人体工程学，便于抓握", "梯子踏板采用防滑材质，防止打滑", "梯子设置稳定支撑脚，避免倾倒", "梯子采用分段式结构，便于收纳", "", ""], "r": "ABC", "e": "A选项扶手高度符合人体工程学利于抓握，能保障攀爬时手部有稳定着力点；B选项防滑踏板可防止攀爬者滑倒；C选项稳定支撑脚能避免梯子倾倒，这三项都直接关乎攀爬安全。而D选项便于收纳与攀爬安全性无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488583", "t": 2, "q": "在工业设计中，中国华电集团电站用消防灭火器的设计需考虑紧急取用与操作，下列哪些设计要素可满足需求", "a": ["灭火器采用手提式结构，便于携带", "灭火器设置压力指示表，显示是否可用", "灭火器操作手柄设置防滑纹路，便于握持", "灭火器表面采用红色涂装，提升识别性", "", ""], "r": "ACD", "e": "紧急取用与操作要求灭火器便于拿取、识别和使用。A便于携带利于取用；C防滑纹路便于操作时握持；D红色涂装提升识别性，方便紧急时快速找到。B主要是用于日常检查灭火器状态。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488584", "t": 2, "q": "在工业设计中，中国华电集团电站用消防栓的设计需考虑紧急操作与维护，下列哪些设计要素可提升消防栓的实用性", "a": ["消防栓设置明显的操作标识，指导紧急操作", "消防栓阀门采用快开结构，减少开启时间", "消防栓接口采用标准化设计，适配不同消防水带", "消防栓表面采用防腐涂层，延长使用寿命", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488585", "t": 2, "q": "在工业设计中，中国华电集团电站用应急照明灯具的设计需兼顾应急功能与耐用性，下列哪些设计要素可满足需求", "a": ["采用LED光源，保证高亮度与长寿命", "灯具设置多角度调节支架，适配不同照明需求", "内置大容量锂电池，确保断电后长时间照明", "灯具外壳采用防水防尘材质，适应电站复杂环境", "", ""], "r": "ACD", "e": "A选项LED光源高亮度和长寿命利于应急照明和耐用；C选项大容量锂电池保证断电后长时间照明，符合应急功能；D选项外壳防水防尘材质适应电站复杂环境，增强耐用性。B选项主要服务于不同照明需求，与应急功能和耐用性关联不大。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488586", "t": 2, "q": "在工业设计中，中国华电集团电站用应急指示灯的设计需考虑应急功能，下列哪些设计要素可保障？", "a": ["指示灯亮度高，远距离可见", "指示灯具备闪烁模式，提升警示性", "指示灯具备断电自动点亮功能", "指示灯采用电池供电，独立于电网", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488587", "t": 2, "q": "在设计中国华电集团电站用巡检机器人的人机交互界面时，需结合人机工程学基础与用户行为分析，下列哪些设计要素可提升界面操作效率？", "a": ["支持手势操作与物理按键双重控制方式", "将高频操作功能布置在视野中心区域", "为复杂操作步骤提供实时引导提示", "采用与电站设备颜色体系一致的界面配色", "", ""], "r": "ABC", "e": "A可让用户灵活选择操作方式加快操作；B高频操作放视野中心便于快速操作；C为复杂操作提供引导能减少操作失误和时间；D界面配色与电站设备颜色体系一致主要是视觉协调性，对操作效率提升不大。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488588", "t": 2, "q": "在优化中国华电集团电站设备供应链服务生态系统时，下列哪些措施可提升供应链的灵活性", "a": ["搭建供应链应急响应机制，应对突发风险", "采用柔性生产模式，快速响应订单变化", "增加供应链库存，保障物资充足", "与多家供应商建立合作关系，避免单一依赖", "", ""], "r": "ABD", "e": "A搭建应急机制能灵活应对突发风险；B柔性生产模式可根据订单快速调整；D与多家供应商合作能避免单一依赖灵活调配资源。而C增加库存虽保障物资但降低灵活性，增加成本和库存积压风险。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488589", "t": 2, "q": "中国华电集团计划制作电站用高压开关柜的结构原型，用于验证多方面性能，下列哪些测试项目属于该原型的核心测试内容", "a": ["柜体的抗电磁干扰性能测试", "内部电气元件布局的维护便利性测试", "柜门开启角度与操作空间测试", "柜体的密封防水性能测试", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488590", "t": 2, "q": "中国华电集团某智能硬件产品需采集电站设备的温度与湿度数据，下列哪些技术要求需满足以保障数据准确性", "a": ["定期对传感器进行校准，修正测量误差", "传感器具备温度补偿功能，减少环境温度影响", "采用无线传输方式，减少布线影响", "采用高精度AD转换模块，提升数据采集精度", "", ""], "r": "ABD", "e": "A可修正测量误差保证数据准确；B能减少环境温度对测量的影响，利于保障数据准确；D高精度AD转换模块可提升采集精度保证数据准确。而C无线传输主要是解决布线问题，与数据准确性无直接关联。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488591", "t": 2, "q": "中国华电集团某智能硬件产品需采集电站设备的振动数据，下列哪些参数属于振动数据的核心采集内容", "a": ["振动频率", "振动加速度", "振动位移", "振动幅度", "", ""], "r": "ABC", "e": "振动数据通常用于监测设备的运行状态，核心采集内容主要包括振动的幅度、频率和加速度等参数。这些参数能够反映设备的振动特性和潜在的故障信息。1. 振动频率：指振动的重复速率，是判断设备运行状态的重要指标。2. 振动加速度：描述振动的速度变化率，对于检测设备的瞬态振动和冲击非常关键。3. 振动位移：表示振动的移动距离，可以反映设备的整体振动情况。4. 振动幅度：虽然也能反映振动的强度，但在核心采集内容中，通常更关注频率、加速度和位移。综上所述，振动频率、振动加速度和振动位移是振动数据的核心采集内容。所以，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488592", "t": 2, "q": "中国华电集团某智能硬件产品需对电站设备运行数据进行边缘计算处理，下列哪些功能适合在边缘端实现", "a": ["海量历史数据的长期存储", "设备运行数据的实时异常检测", "设备故障的初步诊断", "实时控制指令的生成与下发", "", ""], "r": "BCD", "e": "边缘计算强调靠近数据源实时处理数据。A选项海量历史数据长期存储对存储要求高，更适合在云端等中心端；B实时异常检测需快速响应，适合边缘端；C设备故障初步诊断可在边缘端基于实时数据完成；D实时控制指令生成下发要及时，边缘端能满足实时性。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488593", "t": 2, "q": "中国华电集团某智能硬件产品需实现电站环境数据的采集与传输，下列哪些技术模块属于该硬件的核心组成部分", "a": ["高清显示模块（如LCD屏）", "低功耗无线通信模块（如LoRa、NB-IoT）", "本地数据存储模块（如SD卡、SSD）", "多类型传感器模块（温度、湿度、气体）", "", ""], "r": "BCD", "e": "该硬件主要功能是采集与传输电站环境数据。A选项高清显示模块与数据采集和传输核心功能无关；B选项低功耗无线通信模块可实现数据传输；C选项本地数据存储模块能暂存数据，辅助传输；D选项多类型传感器模块用于采集环境数据。所以核心组成部分是BCD。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488594", "t": 2, "q": "中国华电集团某智能硬件产品需实现电站环境数据的无线传输，下列哪些技术要求需满足以保障传输稳定性", "a": ["具备数据校验功能，保障数据完整性", "采用抗干扰能力强的无线通信协议", "具备信号强度检测与自动重连功能", "采用低功耗设计，延长设备续航", "", ""], "r": "ABC", "e": "保障电站环境数据无线传输稳定性，需保证数据准确、通信抗干扰及连接可靠。A可保障数据完整准确；B能减少干扰保证传输；C可应对信号问题，自动重连维持传输。而D低功耗设计主要是为延长设备续航，与传输稳定性无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488595", "t": 2, "q": "中国华电集团某智能硬件产品需实现电站环境中粉尘浓度的检测，下列哪些技术要求需满足", "a": ["采用激光散射法检测技术，保障精度", "传感器具备粉尘过滤功能，防止堵塞", "采用有线传输方式，保障数据稳定", "具备粉尘浓度超标报警功能", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488596", "t": 2, "q": "中国华电集团某智能硬件产品需实现电站环境中有害气体的检测，下列哪些技术模块属于该硬件的核心组成", "a": ["气体浓度显示模块", "有害气体报警模块", "数据校准算法模块", "电化学气体传感器模块", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488597", "t": 2, "q": "中国华电集团某智能硬件产品需实现电站设备的故障预警，下列哪些技术模块需集成", "a": ["故障特征提取算法模块", "设备运行数据采集模块", "预警信息推送模块", "设备故障维修方案数据库模块", "", ""], "r": "ABC", "e": "要实现电站设备故障预警，首先需采集设备运行数据（B），有了数据才能提取故障特征（A），判断有故障后要推送预警信息（C）。而维修方案数据库模块主要用于故障发生后的维修参考，并非故障预警必需。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488598", "t": 2, "q": "中国华电集团某智能硬件产品需实现电站设备的远程控制，下列哪些网络安全措施可保障远程控制的安全性？", "a": ["采用SSL/TLS协议对控制指令进行加密传输", "定期更新硬件固件，修复安全漏洞", "采用UDP协议传输控制指令，提高传输速度", "实施基于角色的访问控制（RBAC），限制控制权限", "", ""], "r": "ABD", "e": "A选项SSL/TLS协议加密传输可防止指令被窃取篡改；B选项定期更新固件能修复安全隐患；D选项RBAC可限制访问权限，保障安全。而C选项UDP协议无连接不可靠，不适合保障远程控制安全。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488599", "t": 2, "q": "中国华电集团某智能硬件产品需实现电站设备的远程状态监测，下列哪些功能需在硬件端实现", "a": ["设备异常状态的本地报警", "数据的长期云端存储与分析", "数据的加密传输", "设备运行数据的采集与预处理", "", ""], "r": "ACD", "e": "硬件端主要负责设备运行数据的采集与初步处理，以及对异常状态进行本地报警，同时要保证数据加密传输。而数据长期云端存储与分析是云端的功能。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488600", "t": 2, "q": "中国华电集团某智能硬件产品需与电站物联网平台进行数据交互，下列哪些数据交互协议可用于该场景", "a": ["HTTP", "CoAP", "MQTT", "OPC UA", "", ""], "r": "BCD", "e": "在这个场景中，中国华电集团的智能硬件产品需要与电站物联网平台进行数据交互。考虑到物联网平台通常对数据传输的实时性、可靠性和轻量级性有较高要求，我们可以分析以下协议的特点来确定适用性：* A. HTTP：虽然HTTP广泛用于Web数据交互，但其相对较重的头部信息和无状态特性使其在物联网场景中效率较低。* B. CoAP：CoAP（受限应用协议）是为物联网设备设计的一种轻量级通信协议，适用于资源受限的设备，具有低功耗和简单性的特点。* C. MQTT：MQTT是一种消息传输协议，专为物联网设计，以发布/订阅模式工作，支持异步通信，非常适合远程和低带宽环境。* D. OPC UA：OPC UA（统一架构）是一种工业自动化通信协议，支持复杂的数据类型和安全性，适用于工业控制系统。综合以上分析，CoAP、MQTT和OPC UA都是适用于物联网平台数据交互的协议，而HTTP虽然通用但在此场景下可能不是最佳选择。因此，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488601", "t": 2, "q": "中国华电集团某智能硬件产品需与电站SCADA系统进行数据交互，下列哪些技术要求需满足以保障交互稳定性", "a": ["具备数据重传机制，应对传输丢包", "采用抗电磁干扰的硬件设计", "具备数据加密功能，保障数据安全", "支持工业以太网通信协议", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488602", "t": 2, "q": "中国华电集团在创建电站设备技术培训服务生态系统时，下列哪些措施可提升培训的互动性", "a": ["采用直播授课模式，支持学员实时提问", "引入虚拟仿真设备，让学员进行沉浸式操作练习", "提供培训资料下载，方便学员课后复习", "组织小组讨论，针对实际故障案例进行分析", "", ""], "r": "ABD", "e": "互动性强调学员与讲师、学员与学员之间的交流和参与。A选项直播授课实时提问可实现学员与讲师互动；B选项虚拟仿真设备沉浸式操作让学员参与体验；D选项小组讨论促进学员间交流。而C选项只是提供资料方便课后复习，未体现互动。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488603", "t": 2, "q": "中国华电集团在优化电站设备供应链服务生态系统时，下列哪些措施可降低供应链的运输成本", "a": ["采用集装运输方式，提高运输效率", "优化运输路线，缩短运输距离", "与物流公司建立长期合作，争取优惠运价", "增加运输车辆数量，提高运输速度", "", ""], "r": "ABC", "e": "集装运输可提高效率、优化路线能缩短距离、与物流合作获优惠运价都能降低运输成本；增加车辆数量会增加成本而非降低。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488604", "t": 2, "q": "中国华电集团在优化电站设备供应链服务生态系统时，下列哪些措施可提升供应链的透明度", "a": ["搭建供应链信息共享平台，实时共享物资状态", "增加供应链库存，保障物资充足", "公开供应商资质与评价信息，便于选择", "建立物资溯源系统，追踪物资流向", "", ""], "r": "ACD", "e": "提升供应链透明度主要是让供应链各环节信息更清晰可查。A搭建信息共享平台实时共享物资状态、C公开供应商资质与评价信息、D建立物资溯源系统追踪物资流向，都能增加信息透明度。B增加库存保障物资充足与透明度无关。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488605", "t": 2, "q": "中国华电集团在优化电站设备技术培训服务生态系统时，下列哪些措施可提升培训的针对性？", "a": ["结合电站近期设备故障案例设计培训课程", "增加培训课程的数量，覆盖更多领域", "根据学员职位（如巡检员、维修工）制定差异化培训内容", "通过课前测试了解学员知识薄弱点，调整培训重点", "", ""], "r": "ACD", "e": "提升培训针对性需贴合实际需求和学员特点。A结合故障案例、C按职位制定内容、D依据测试调整重点都能做到这一点；B单纯增加课程数量不能保证培训有针对性。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488606", "t": 2, "q": "中国华电集团在优化电站设备技术培训服务生态系统时，下列哪些措施可提升培训内容的实用性", "a": ["根据电站设备的更新情况及时更新培训内容", "采用案例教学法，结合实际故障处理案例", "增加培训课程的理论知识比重", "邀请电站一线技术骨干参与培训课程设计", "", ""], "r": "ABD", "e": "A可使培训契合设备现状，B结合实际案例能让学员接触实际问题，D一线骨干有实际经验，他们参与设计可使课程更实用。而增加理论知识比重不能直接提升实用性。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488607", "t": 2, "q": "中国华电集团在优化电站设备技术咨询服务生态系统时，下列哪些措施可提升咨询服务的响应速度", "a": ["搭建在线咨询平台，支持实时沟通", "配备专职咨询人员，实行轮班制", "建立咨询问题知识库，提供常见问题自动解答", "延长咨询服务时间，覆盖更多时段", "", ""], "r": "ABC", "e": "答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488608", "t": 2, "q": "中国华电集团在优化电站设备售后服务生态系统时，下列哪些措施可提升售后服务的响应效率", "a": ["搭建售后服务移动APP，支持用户在线提交故障报修与进度查询", "建立售后服务工单自动分配系统，根据地理位置与工单类型分配任务", "增加售后服务人员的薪资待遇，提高工作积极性", "在电站集中区域设立售后服务网点，缩短服务半径", "", ""], "r": "ABD", "e": "A选项让用户能便捷在线报修和查进度，利于售后快速响应；B选项自动分配工单可高效安排任务；D选项在电站集中区设网点能缩短响应距离。C项增加薪资虽能提高积极性，但对响应速度提升无直接关联。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488609", "t": 2, "q": "中国华电集团在优化电站设备售后服务生态系统时，下列哪些措施可提升用户的满意度", "a": ["增加售后服务的收费项目，提高服务收入", "为用户提供设备维护保养建议，延长设备寿命", "提供售后服务质量评价渠道，及时处理用户反馈", "缩短售后服务的响应时间，快速解决设备问题", "", ""], "r": "BCD", "e": "A增加收费项目会让用户成本增加，降低满意度；B为用户提供保养建议能延长设备寿命，对用户有益；C提供评价渠道并处理反馈可改进服务；D缩短响应时间能快速解决问题，都有利于提升满意度。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488610", "t": 2, "q": "中国华电集团在优化电站设备租赁服务生态系统时，下列哪些措施可降低租赁风险", "a": ["要求租户缴纳足额押金，降低违约损失", "制定详细的设备租赁合同，明确双方权责", "建立租户信用评估体系，筛选优质租户", "对租赁设备进行定期维护，减少设备故障", "", ""], "r": "ABCD", "e": "A缴纳足额押金可在租户违约时弥补损失；B明确权责可规范双方行为，降低纠纷风险；C筛选优质租户能减少违约可能性；D减少设备故障可降低运营风险。ABCD措施都能降低租赁风险。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488611", "t": 2, "q": "中国华电集团在优化电站设备租赁服务生态系统时，下列哪些措施可实现租赁设备的高效管理？", "a": ["对租赁设备进行编号管理，便于识别", "建立设备租赁台账系统，实时跟踪设备状态", "提高设备租赁价格，增加收入", "制定设备维护计划，定期保养", "", ""], "r": "ABD", "e": "A编号管理利于识别设备；B台账系统能实时掌握设备状态；D定期保养可保障设备性能，这些都有助于高效管理租赁设备。而C提高租赁价格主要是为增加收入，与设备高效管理无关。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488612", "t": 2, "q": "中国华电集团在优化电站设备租赁服务生态系统时，下列哪些措施可提升租户的使用体验", "a": ["为租户提供设备使用培训，减少操作失误", "建立设备故障快速响应机制，及时维修", "提供设备上门安装与调试服务", "提高设备租赁价格，保障服务质量", "", ""], "r": "ABC", "e": "A提供培训能让租户正确使用设备；B快速响应维修可减少设备故障影响；C上门安装调试方便租户使用，这些都能提升租户体验。而D提高租赁价格会增加租户成本，不能提升体验。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488613", "t": 2, "q": "中国华电集团在优化电站设备租赁服务生态系统时，下列哪些措施可提升租赁流程的便捷性", "a": ["增加租赁押金金额，降低违约风险", "提供设备上门取送服务，减少用户奔波", "开发线上租赁平台，支持在线下单与支付", "简化租赁审批流程，缩短审批时间", "", ""], "r": "BCD", "e": "A选项增加押金金额主要是为降低违约风险，与租赁流程便捷性无关；B选项上门取送服务能减少用户奔波，让租赁更方便；C选项开发线上平台支持在线操作，提升便捷性；D选项简化审批流程缩短时间，也使租赁更便捷。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488614", "t": 2, "q": "中国华电集团制作电站用变压器的结构原型时，下列哪些测试项目可验证原型的结构合理性", "a": ["变压器铁芯的安装间隙测试", "变压器油箱的密封性能测试", "变压器散热片的布局合理性测试", "变压器绕组的绝缘性能测试", "", ""], "r": "ABC", "e": "这是一道关于变压器结构原型测试项目合理性的选择题。题目要求从提供的选项中选出能够验证变压器结构合理性的测试项目。首先，我们分析变压器结构合理性的关键方面，它主要涉及到变压器的主要构成部分及其功能实现。变压器的关键结构包括铁芯、油箱、散热片以及绕组等，每一部分都有其特定的功能和性能要求。现在，我们逐项审视各个选项：A. 变压器铁芯的安装间隙测试：铁芯的安装间隙直接影响变压器的电磁性能，间隙不合理可能导致磁路不畅或产生噪音、振动等问题。因此，这项测试能够验证结构的合理性。B. 变压器油箱的密封性能测试：油箱的密封性能对于确保变压器内部绝缘油的稳定性和防止外部污染物侵入至关重要。密封不良可能导致变压器故障，故此项测试也是必要的。C. 变压器散热片的布局合理性测试：散热片的布局直接影响变压器的散热效果，布局不合理可能导致变压器过热，影响其使用寿命和安全运行。这项测试同样能验证结构的合理性。D. 变压器绕组的绝缘性能测试：虽然绝缘性能是变压器的重要指标，但它更多关注的是绕组本身的电气性能，而非结构合理性。结构合理性主要关注部件的安装位置、布局及相互间的配合等。综上所述，A、B、C三项都是直接针对变压器结构的测试项目，能够验证其结构的合理性。而D项虽然重要，但不属于结构合理性的直接验证范畴。所以，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488615", "t": 2, "q": "中国华电集团制作电站用变压器的绝缘原型时，下列哪些测试项目可验证原型的绝缘性能？", "a": ["变压器油的击穿电压测试", "局部放电测试", "绝缘电阻测试", "介损角正切值测试", "", ""], "r": "ABCD", "e": "这几个选项都是常见的变压器绝缘性能测试项目。变压器油击穿电压测试可反映油的绝缘能力；局部放电测试能检测绝缘内部缺陷；绝缘电阻测试可了解绝缘整体状况；介损角正切值测试反映绝缘介质损耗情况。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488616", "t": 2, "q": "中国华电集团制作电站用变压器的散热原型时，下列哪些测试项目可验证散热性能", "a": ["变压器油温温升测试", "散热风扇的风速测试", "散热片表面温度分布测试", "变压器的绝缘电阻测试", "", ""], "r": "ABC", "e": "油温温升、散热风扇风速、散热片表面温度分布都与散热性能直接相关，可用于验证散热性能；而绝缘电阻测试主要是检测变压器的绝缘情况，与散热性能无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488617", "t": 2, "q": "中国华电集团制作电站用阀门的操作原型时，下列哪些测试项目可验证操作便利性", "a": ["阀门操作力矩测试，确保省力", "阀门的密封性能测试", "阀门操作手柄的握持舒适度测试", "阀门开关行程测试，确保操作行程合理", "", ""], "r": "ACD", "e": "操作便利性主要关注操作是否省力、舒适及行程是否合理等方面。A选项操作力矩省力利于操作；C选项手柄握持舒适便于操作；D选项开关行程合理也方便操作。而B选项密封性能与操作便利性无关。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488618", "t": 2, "q": "中国华电集团制作电站用阀门的功能原型时，下列哪些测试项目可验证原型的功能可靠性", "a": ["阀门的操作力矩测试", "阀门的开关寿命测试", "阀门的密封性能测试", "阀门的外观质量测试", "", ""], "r": "ABC", "e": "操作力矩测试能了解阀门操作难易程度，开关寿命测试可检验其长期使用可靠性，密封性能测试关乎阀门防止介质泄漏能力，这些都与功能可靠性相关；而外观质量测试主要针对阀门外观，和功能可靠性无关。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488619", "t": 2, "q": "中国华电集团制作电站用阀门的密封原型时，下列哪些测试条件需模拟实际工况", "a": ["测试介质的类型（如水、蒸汽、油）", "测试环境的振动频率", "测试的持续时间", "测试介质的温度与压力", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488620", "t": 2, "q": "中国华电集团制作电站用风机的结构原型时，下列哪些测试项目可验证原型的结构稳定性", "a": ["风机外壳的密封性能测试", "风机叶片的强度测试", "风机轴承的耐磨性能测试", "风机底座的振动位移测试", "", ""], "r": "BD", "e": "结构稳定性主要涉及结构承受各种力和保持自身形态的能力。叶片强度影响风机运转时结构承受力情况，底座振动位移反映结构稳固程度，都与结构稳定性相关。而外壳密封性能和轴承耐磨性能并非直接体现结构稳定性。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488621", "t": 2, "q": "中国华电集团制作电站用风机的气动原型时，下列哪些测试设备需配备", "a": ["风速仪，测量气流速度", "压力传感器，测量风机进出口压力", "风洞试验台，模拟气流环境", "噪声测试仪，测量风机运行噪声", "", ""], "r": "ABC", "e": "这道题考察的是对中国华电集团制作电站用风机的气动原型所需测试设备的了解。在制作风机气动原型时，关键的测试设备包括测量气流速度的风速仪，测量风机进出口压力的压力传感器，以及模拟气流环境的风洞试验台。这些设备能够全面评估风机的气动性能。而噪声测试仪虽然对于评估风机运行时的噪声水平很重要，但并不直接涉及气动原型的核心测试需求。综上所述，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488622", "t": 2, "q": "中国华电集团制作电站用风机的气动原型时，下列哪些测试项目可验证原型的气动性能", "a": ["风机的效率测试", "风机的风压测试", "风机的风量测试", "风机的噪声测试", "", ""], "r": "ABC", "e": "风机的效率、风压、风量都直接体现风机的气动性能，而噪声测试主要反映的是风机运行时的声学特性，并非直接验证气动性能。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488623", "t": 2, "q": "中国华电集团制作电站用流量计的功能原型时，需验证其测量性能，下列哪些测试条件需模拟实际电站工况", "a": ["测试环境的光照强度", "流体温度与压力", "流体介质类型（如蒸汽、水、油）", "流体流速范围", "", ""], "r": "BCD", "e": "电站工况中，流体温度与压力、流体介质类型、流体流速范围都会影响流量计测量性能，需模拟；而光照强度对其测量性能无影响。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488624", "t": 2, "q": "中国华电集团制作电站用压力表的功能原型时，下列哪些测试条件需模拟实际工况以验证精度", "a": ["测试介质的压力范围", "测试介质的腐蚀性", "测试环境的温度与湿度", "测试时的振动强度", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810609790488625", "t": 2, "q": "中国华电集团制作电站用压力表的结构原型时，下列哪些测试项目可验证原型的结构合理性", "a": ["压力表表盘的耐磨损性能测试", "压力表接口的密封性能测试", "压力表外壳的抗冲击性能测试", "压力表指针的转动灵活性测试", "", ""], "r": "BCD", "e": "结构合理性主要涉及整体结构在各方面的性能表现，接口密封、外壳抗冲击、指针转动灵活都与结构的合理性紧密相关，而表盘耐磨损性能主要体现的是表盘材料特性，并非结构合理性范畴。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196864", "t": 3, "q": "在工业设计中，中国华电集团电站用安全阀的开启压力设定值应略高于设备的最高工作压力，以保证设备正常运行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "安全阀开启压力设定值略高于设备最高工作压力，当设备压力异常升高接近最高工作压力时，安全阀不会误开启，能保证设备正常运行，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196865", "t": 3, "q": "在工业设计中，中国华电集团电站用电缆接头采用螺纹连接+密封圈比卡扣连接+防水胶更能保障连接可靠性与防水性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "螺纹连接配合密封圈能实现更紧密、稳定的连接，相比卡扣连接，螺纹连接在长期使用中更不易松动；密封圈的防水效果通常比防水胶更稳定可靠，能更好地保障连接可靠性与防水性能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196866", "t": 3, "q": "在工业设计中，中国华电集团电站用电缆桥架采用梯式结构比槽式结构更能提升电缆的散热性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "梯式电缆桥架通风散热好，槽式相对封闭不利于散热，所以电站用电缆桥架采用梯式结构更能提升电缆散热性能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196867", "t": 3, "q": "在工业设计中，中国华电集团电站用阀门的操作手柄设计应采用圆形截面，以保证最大的握持摩擦力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般而言，圆形截面手柄在握持时摩擦力并非最大，有棱或特殊形状的手柄更易增大摩擦力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196868", "t": 3, "q": "在工业设计中，中国华电集团电站用风机的降噪设计采用全封闭隔音罩比局部隔音罩更能兼顾降噪效果与散热需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "全封闭隔音罩虽降噪效果好，但不利于散热，局部隔音罩在一定程度上可更好兼顾降噪与散热。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196869", "t": 3, "q": "在工业设计中，中国华电集团电站用配电箱的密封圈+卡扣式盖板结构比防水胶涂抹+螺丝固定盖板更能兼顾防水性能与操作便利性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "密封圈 + 卡扣式盖板结构安装和拆卸相对简便，能较好保证防水且操作便利；防水胶涂抹 + 螺丝固定盖板操作复杂，后期维护麻烦。所以密封圈 + 卡扣式盖板结构更能兼顾防水性能与操作便利性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196870", "t": 3, "q": "在工业设计中，中国华电集团电站用手推车的车轮刹车装置比扶手高度更能影响搬运过程的安全性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "车轮刹车装置关乎车辆能否有效制动，直接影响搬运过程中车辆的停止和稳定，对安全性起关键作用；扶手高度主要影响使用的舒适性，对安全性影响相对较小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196871", "t": 3, "q": "在工业设计中，中国华电集团电站用手推车的扶手采用椭圆形截面比圆形截面更适合长时间握持。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "椭圆形截面更贴合手部曲线，相比圆形截面能减少手部压力，更适合长时间握持。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196872", "t": 3, "q": "在工业设计中，中国华电集团电站用输送带的防护栏采用焊接固定式比铰链折叠式更能兼顾安全性与可维护性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般来说，铰链折叠式防护栏在可维护性上更有优势，它可以方便地打开进行设备维护等操作；而焊接固定式防护栏虽然有一定安全性，但在维护时可能需要破坏或拆除，不利于可维护性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196873", "t": 3, "q": "在工业设计中，中国华电集团电站用消防灭火器的放置高度比颜色更能影响紧急情况下的取用速度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在紧急情况下，灭火器放置高度直接关系到能否快速够取，而颜色主要起标识作用，相较而言放置高度对取用速度影响更大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196874", "t": 3, "q": "在工业设计中，中国华电集团电站用消防栓的阀门操作力矩越大，越能保证紧急情况下的操作速度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "阀门操作力矩越大，操作时越费力，会降低操作速度，不利于紧急情况操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196875", "t": 3, "q": "在工业设计中，中国华电集团电站用巡检机器人的外观设计应优先考虑流线型造型，以降低制造成本。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电站用巡检机器人主要用于工业环境巡检，其外观设计应优先考虑功能性、稳定性、对环境的适应性等，而非为降低成本采用流线型造型，且流线型在这种场景并非关键因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196876", "t": 3, "q": "在工业设计中，中国华电集团电站用应急照明灯具的发光颜色采用红色比白色更能提升紧急情况下的视觉识别性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "白色光在紧急情况下能提供更清晰、明亮的照明，利于人员看清周围环境和标识，提升视觉识别性，而红色光相对来说在照明和清晰识别上不如白色。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196877", "t": 3, "q": "在工业设计中，中国华电集团电站用应急指示灯的内置电池容量越大，断电后的持续照明时间越长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在其他条件不变时，应急指示灯内置电池容量越大意味着储存电能越多，能为照明提供更久的能量，断电后持续照明时间就越长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196878", "t": 3, "q": "在设计中国华电集团电站用巡检机器人的操作界面时，从人机工程学基础出发，应将所有功能按钮均匀分布在界面上，以保证界面美观。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设计操作界面不能仅考虑美观，更要从人机工程学出发，依据操作频率、重要程度等合理布局功能按钮，而非简单均匀分布。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196879", "t": 3, "q": "在优化中国华电集团电站设备供应链服务生态系统时，采用供应商管理库存（VMI）模式比增加库存周转率更能降低库存成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "VMI模式能让供应商管理库存，优化库存水平，降低牛鞭效应等从而降低库存成本；增加库存周转率也可减少库存积压降低成本，但VMI模式从供应链整体协调等多方面优化，在降低库存成本上更具优势。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196880", "t": 3, "q": "在优化中国华电集团电站设备技术咨询服务生态系统时，建立咨询服务专家库比延长咨询服务时间更能提升咨询的专业性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "专家库汇聚专业人才，能凭借其专业知识和经验为咨询服务提供高质量的专业支持；而延长咨询服务时间不一定能直接提升专业性。所以建立咨询服务专家库更有助于提升咨询专业性。", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196881", "t": 3, "q": "在优化中国华电集团电站设备检修服务生态系统时，建立检修服务质量评价体系比提高检修工具精度更能提升检修服务质量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "检修服务质量评价体系可全面衡量、反馈和改进服务，从整体上提升服务质量；而提高检修工具精度主要影响检修操作层面。建立评价体系对服务质量提升更具全局性和系统性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196882", "t": 3, "q": "在优化中国华电集团电站设备运维服务生态系统时，增加运维人员数量比优化运维流程更能提升运维效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "优化运维流程可从整体上对运维工作的各个环节进行科学规划和改进，减少不必要的环节和延误，能更系统地提升运维效率。而单纯增加运维人员数量可能会带来管理成本增加、协调难度加大等问题，不一定能有效提升效率。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196883", "t": 3, "q": "在优化中国华电集团电站设备租赁服务生态系统时，建立设备租赁信用评估体系比提高租赁押金更能从根本上降低租赁风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "建立设备租赁信用评估体系可从源头筛选优质客户，从根本上把控风险；提高租赁押金只是一种事后保障手段，不能从根本上降低风险。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196884", "t": 3, "q": "在优化中国华电集团电站设备租赁服务生态系统时，提供设备使用培训比降低租赁价格更能提升租户的满意度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "设备使用培训能让租户更好掌握设备使用方法，减少使用问题和故障，提升使用体验；而单纯降低租赁价格只是在经济层面有吸引力，从长远和使用便利性等综合考虑，提供设备使用培训对提升租户满意度更关键。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196885", "t": 3, "q": "在优化中国华电集团电站员工培训服务生态系统时，增加培训课程数量比邀请一线技术骨干参与课程设计更能提升培训内容的实用性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一线技术骨干具有丰富的实践经验，他们参与课程设计能将实际工作中的经验和问题融入课程，使培训内容更贴合实际工作需求，相比单纯增加课程数量，对提升培训内容实用性更有帮助。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196886", "t": 3, "q": "中国华电集团某智能硬件产品需采集电站湿度数据，电容式湿度传感器比露点式湿度传感器更适合高温高粉尘环境。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196887", "t": 3, "q": "中国华电集团某智能硬件产品需采集电站有害气体浓度，电化学传感器比半导体传感器更能保证测量精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电化学传感器灵敏度高、选择性好，能更精确测量特定有害气体浓度，适合电站这种对测量精度要求高的场景；半导体传感器虽成本低、响应快，但受环境因素影响大，精度不如电化学传感器。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196888", "t": 3, "q": "中国华电集团某智能硬件产品需测量电站高温设备温度（-20℃~800℃），热电阻传感器比热电偶传感器更适合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热电偶测量温度范围宽，能测较高温度，适用于-20℃ - 800℃甚至更高温度；热电阻一般适用于中低温测量。所以测量-20℃ - 800℃的电站高温设备温度，热电偶传感器更合适。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196889", "t": 3, "q": "中国华电集团某智能硬件产品需处理设备故障的非线性数据，决策树算法比神经网络更适合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "决策树适合处理线性可分数据，对于非线性数据处理能力有限；而神经网络在处理非线性数据方面表现更优。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196890", "t": 3, "q": "中国华电集团某智能硬件产品需实现电池供电下的长期工作，采用NB-IoT通信模块比4G模块更适合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "NB - IoT功耗低，能在电池供电下实现长期工作；4G模块功耗高，不利于电池供电的长期使用。所以该产品采用NB - IoT通信模块更合适。", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196891", "t": 3, "q": "中国华电集团某智能硬件产品需实现电站设备的远程控制，采用MQTT协议比HTTP协议更能适应设备的低功耗需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "MQTT是轻量级消息传输协议，采用发布 - 订阅模式，开销小、消耗资源少，适合低功耗设备；HTTP协议开销大，资源消耗多。所以在实现电站设备远程控制时，MQTT更适应低功耗需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196892", "t": 3, "q": "中国华电集团某智能硬件产品需实现数据加密传输，AES算法比RSA算法更适合在硬件端实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "AES是对称加密算法，运算速度快、效率高，资源消耗少，更适合在硬件端实现；RSA是非对称加密算法，运算复杂，对硬件资源要求高。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196893", "t": 3, "q": "中国华电集团某智能硬件产品需向电站物联网平台上报数据，采用HTTP协议比MQTT协议更能适应网络不稳定的环境。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "MQTT协议专为低带宽、不稳定网络设计，具备轻量级、低功耗、可自动重连等特点，更适合网络不稳定环境。而HTTP协议主要用于Web数据传输，对网络稳定性要求较高。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196894", "t": 3, "q": "中国华电集团某智能硬件产品需与电站物联网平台交互数据，采用发布-订阅模式比请求-响应模式更能实现数据的实时上报。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "发布 - 订阅模式中，智能硬件可随时发布数据，订阅者能实时接收，适合实时数据上报。请求 - 响应模式需请求触发响应，有延迟。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196895", "t": 3, "q": "中国华电集团某智能硬件产品需在电站复杂电磁环境下传输数据，采用LoRa通信技术比工业以太网更能保证数据传输的低延迟。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工业以太网传输速率快、延迟低，适合对实时性要求高的场景；LoRa通信技术传输速率慢、延迟相对高，主要优势是低功耗、远距离。在需保证低延迟数据传输的电站复杂电磁环境中，工业以太网更合适。", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196896", "t": 3, "q": "中国华电集团某智能硬件产品需在电站高温环境下长期存储数据，固态硬盘（SSD）比机械硬盘（HDD）更适合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "固态硬盘没有机械部件，散热快、耐高温，更适应高温环境；机械硬盘有高速旋转的盘片等部件，高温易影响其稳定性和寿命。所以在电站高温环境下长期存储数据，SSD更合适。", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196897", "t": 3, "q": "中国华电集团某智能硬件产品需在电站高噪声环境下采集声音信号，电容式麦克风比动圈式麦克风更适合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "动圈式麦克风抗干扰能力强、耐高噪声、可靠性好，适合电站这类高噪声工业现场；电容麦灵敏度高，微弱声音拾取能力强，但容易受大噪声冲击，更适合低噪声环境录音。电站高噪声环境采集声音信号，动圈式麦克风更合适，题干表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196898", "t": 3, "q": "中国华电集团某智能硬件产品需在电站室内实现设备定位，采用GPS定位技术比蓝牙beacon定位更合适。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "GPS定位主要适用于室外开阔环境，在电站室内有建筑物遮挡等因素影响，信号差甚至无法定位；而蓝牙beacon定位更适合室内环境，能实现精准定位。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196899", "t": 3, "q": "中国华电集团某智能硬件产品需在硬件端实现振动异常检测，采用傅里叶变换比深度学习算法更适合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196900", "t": 3, "q": "中国华电集团验证电站用变压器原型的绝缘性能时，局部放电测试比介损测试更能检测绝缘结构的潜在缺陷。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "局部放电测试能够检测出绝缘内部的微小放电现象，可发现绝缘结构中潜在的局部缺陷；而介损测试主要反映绝缘介质的整体损耗情况，对潜在微小缺陷的检测能力不如局部放电测试。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196901", "t": 3, "q": "中国华电集团验证电站用变压器原型的绝缘性能时，耐压测试比绝缘电阻测试更能直接反映绝缘结构的抗击穿能力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "耐压测试是模拟实际运行中可能承受的过电压情况，直接检验绝缘结构在高压下是否会被击穿，能直接反映绝缘结构的抗击穿能力；而绝缘电阻测试主要反映绝缘材料的绝缘性能好坏，不能直接体现抗击穿能力。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196902", "t": 3, "q": "中国华电集团验证电站用变压器原型的散热性能时，测量变压器表面温度比测量内部油温更能准确反映散热效果。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "变压器内部油温能更直接体现变压器内部的热状态，内部油温变化对散热效果的反映更精准，而表面温度易受环境等因素影响，不能很好反映散热效果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196903", "t": 3, "q": "中国华电集团验证电站用阀门原型的密封性能时，使用蒸汽作为测试介质比清水更能模拟实际工况。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电站运行中阀门接触的多是蒸汽，用蒸汽测试能更接近阀门实际工作环境，更好模拟实际工况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196904", "t": 3, "q": "中国华电集团验证电站用风机叶片原型的气动性能时，风洞试验台测试比计算机模拟更能准确反映叶片实际工作状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "风洞试验台能模拟真实的气流环境，让叶片在接近实际工作的条件下进行测试，考虑到了实际中可能出现的各种复杂因素。而计算机模拟是基于一定的模型和假设，虽然能模拟很多情况，但难以完全涵盖实际中的所有复杂因素。所以风洞试验台测试比计算机模拟更能准确反映叶片实际工作状态，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196905", "t": 3, "q": "中国华电集团验证电站用风机原型的振动特性时，速度传感器比加速度传感器更能全面反映振动特性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "加速度传感器能更快速、精确地捕捉振动的变化，在验证电站用风机原型振动特性时，比速度传感器更能全面反映振动特性。", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196906", "t": 3, "q": "中国华电集团验证电站用流量计原型的测量精度时，动态对比法（与标准流量计对比）比静态称重法更准确。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般静态称重法是较为基础且准确的测量方式，能直接获取质量数据，而动态对比法受标准流量计自身精度等多种因素影响，通常静态称重法更准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196907", "t": 3, "q": "中国华电集团验证电站用温度传感器原型的密封性能时，浸水测试比压力测试更能模拟传感器的实际工作环境。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电站工作中温度传感器面临的压力环境是实际且重要的工作条件，压力测试能更好模拟其实际工作环境，而浸水测试不能很好体现压力等关键实际工况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196908", "t": 3, "q": "中国华电集团验证电站用压力表原型在振动环境下的稳定性时，在实际电站风机旁测试比在振动测试台上测试更准确。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实际电站风机旁的环境复杂，存在各种不可控因素，而振动测试台能精准模拟振动环境，可对变量进行有效控制，所以在振动测试台上测试更准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196909", "t": 3, "q": "中国华电集团验证电站用液位计原型的测量准确性时，在高温高压模拟环境下测试比常温常压环境更能保证原型适配实际工况。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电站实际运行中通常是高温高压环境，在高温高压模拟环境下测试液位计原型测量准确性，能让测试环境更接近实际工况，从而更好地验证其适配性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196910", "t": 3, "q": "中国华电集团制作电站用高压开关柜的原型时，若需快速验证柜体结构稳定性，3D打印功能原型比泡沫切割实体原型更合适。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "3D打印能精准快速制造复杂结构，可更好模拟高压开关柜柜体结构，验证稳定性；泡沫切割精度低、结构模拟效果差。所以3D打印功能原型更合适。", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196911", "t": 3, "q": "中国华电集团制作电站用流量计的原型时，若需验证流量测量精度，在常温常压实验室环境下测试与在电站实际工况下测试结果一致。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电站实际工况与常温常压实验室环境差异大，如温度、压力等不同，会影响流量计测量精度，所以测试结果通常不一致。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196912", "t": 3, "q": "中国华电集团制作电站用配电柜的原型时，若需验证内部电气元件布局的维护便利性，结构原型的精度要求比功能原型更高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "结构原型主要关注产品的物理结构和空间布局等，能直观体现内部元件布局等实际情况，方便验证维护便利性；功能原型重点在于实现产品功能。所以要验证内部电气元件布局的维护便利性，结构原型精度要求更高。该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810611036196913", "t": 3, "q": "中国华电集团制作电站用压力表的原型时，选择40-50岁电站一线巡检人员作为测试人群比20-30岁大学生更能反映实际使用情况。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电站用压力表是用于电站实际工作场景，40 - 50岁电站一线巡检人员有丰富的电站工作经验，更了解该压力表在实际工作中的使用需求和情况，而20 - 30岁大学生缺乏电站实际工作经验。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 过程装备与控制工程（1）", "n": "基础练习题【含解析】 / 第5章 过程装备与控制工程（1）", "qs": [{"id": "2034810613850574848", "t": 1, "q": "根据《固定式压力容器安全技术监察规程》，某压力容器用于储存浓度为98%的硫酸（中度危害介质），设计压力为2.5MPa，设计温度为150℃，该容器应归类为哪一类别？", "a": ["一类压力容器", "三类压力容器", "四类压力容器", "二类压力容器", "", ""], "r": "D", "e": "98% 硫酸属于中度危害介质，设计压力 2.5MPa，依据固容规划分，该容器属于第二类压力容器。压力容器只有一类、二类、三类，无四类，排除 C。", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574849", "t": 1, "q": "根据压力容器分类，某立式容器用于储存水（无危害介质），设计压力为0.8MPa，容积为50m³，该容器应归类为？", "a": ["一类压力容器", "二类压力容器", "非压力容器（常压容器）", "三类压力容器", "", ""], "r": "B", "e": "这是一道关于压力容器分类的问题。首先，我们需要了解压力容器的基本分类标准，通常基于设计压力、容积以及所储存介质的危险性。对于本题中的立式容器，关键参数包括：储存介质为水（无危害介质）、设计压力为0.8MPa、容积为50m³。根据这些信息，我们可以进行简化分析：1. 储存介质为水，且无危害性，这意味着在介质危险性方面，该容器不会归入最高类别。2. 设计压力为0.8MPa，这个压力值超过了常规的低压范围，但不足以归入最高压力的类别。3. 容积为50m³，这是一个相对较大的容积，通常会影响容器的分类。综合以上因素，我们可以推断：* 由于介质无危害，该容器不会是一类或三类压力容器（这三类通常涉及更高危险性的介质或更高的设计压力）。* 设计压力和容积均表明，该容器超出了常压容器的范畴。* 因此，最符合的分类是二类压力容器，它适用于中等危险性（在本例中为无危害介质但具有一定压力和容积）的容器。所以，正确答案是B.二类压力容器。", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574850", "t": 1, "q": "根据压力容器分类，某卧式容器用于储存液氨（中度危害），设计压力为1.6MPa，容积为20m³，该容器应归类为？", "a": ["二类压力容器", "三类压力容器", "一类压力容器", "非压力容器", "", ""], "r": "A", "e": "储存中度危害介质，设计压力1.6MPa、容积20m³，满足介质为中度危害且PV乘积大于等于10MPa·m³，属于二类压力容器。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574851", "t": 1, "q": "根据压力容器分类，某移动式压力容器用于运输液化石油气（设计压力2.5MPa，容积20m³），该容器应归类为？", "a": ["一类压力容器", "二类压力容器", "三类压力容器", "移动式压力容器（单独分类，不纳入固定式压力容器类别）", "", ""], "r": "D", "e": "移动式压力容器有单独分类，不纳入固定式压力容器类别。本题中是移动式压力容器用于运输液化石油气，所以应选D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574852", "t": 1, "q": "根据压力容器设计的壁厚校核要求，当容器同时承受内压和轴向拉力时，需将轴向拉力换算为当量压力，下列换算公式正确的是（F为轴向拉力，Di为内径，δ为壁厚，当量压力ΔPeq为）", "a": ["ΔPeq=F/(πDiδ)", "ΔPeq=2F/(πDiδ)", "ΔPeq=4F/(πDiδ)", "ΔPeq=4F/(πDi²)", "", ""], "r": "C", "e": "计算由轴向拉力产生的当量压力，根据拉力与压力在容器上的力学关系，拉力F作用下相当于产生的当量压力，由拉力F除以容器内表面受拉力作用的环形面积（πDiδ），但考虑到轴向拉力在容器周向产生的力分布情况，这里应该除以的是πDiδ的一半，即ΔPeq = 4F/(πDiδ) 。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574853", "t": 1, "q": "根据压力容器设计的疲劳分析要求，当容器承受交变载荷（如频繁启停）时，需进行疲劳校核，疲劳校核的核心是计算容器的？", "a": ["最小应力", "应力幅", "最大应力", "平均应力", "", ""], "r": "B", "e": "疲劳校核主要关注交变应力对容器的影响，应力幅反映了交变应力的变化程度，是疲劳校核的核心参数。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574854", "t": 1, "q": "根据压力容器选材的耐腐蚀性要求，当介质为稀硫酸（浓度20%，温度50℃）时，下列哪种材料不适合作为容器壳体？", "a": ["普通碳钢（Q235）", "铅锑合金", "哈氏合金C276", "玻璃钢", "", ""], "r": "A", "e": "稀硫酸会与普通碳钢发生化学反应，易使碳钢腐蚀，不适合作容器壳体。而铅锑合金、哈氏合金C276、玻璃钢有较好耐稀硫酸腐蚀能力。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574855", "t": 1, "q": "根据压力容器选材原则，当容器介质为高温（400℃）、高压（8MPa）的氢气时，下列哪种材料的选择需特别考虑氢脆问题？", "a": ["镍基合金（如Inconel 625）", "低合金钢（如15CrMoR）", "奥氏体不锈钢（如304H）", "低碳钢（如Q235）", "", ""], "r": "B", "e": "氢脆是指金属在含氢的环境中吸收氢而导致韧性下降、脆化的现象。低合金钢在高温高压氢气环境下，更容易发生氢脆。镍基合金、奥氏体不锈钢抗氢脆性能较好，低碳钢一般不在高温高压氢气环境使用。所以选B。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574856", "t": 1, "q": "根据压力容器选材原则，当容器介质为高温（500℃）的烟道气（含少量二氧化硫）时，下列材料中适合作为容器壳体的是？", "a": ["304不锈钢", "Q345R", "12Cr2Mo1R", "Q235B", "", ""], "r": "C", "e": "高温且含少量二氧化硫的烟道气工况，需材料有良好耐热性和一定抗腐蚀能力。12Cr2Mo1R耐热性好，适用于高温环境。304不锈钢虽有耐腐蚀性，但在高温下强度不如12Cr2Mo1R；Q345R和Q235B耐热性差，不适合高温工况。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574857", "t": 1, "q": "某过程设备的简体采用焊接成型，焊接接头形式为对接接头，且进行了100%射线检测（RT），根据《压力容器焊接规程》，该焊接接头的质量等级至少应达到哪个级别才能满足三类压力容器的要求？", "a": ["Ⅰ级", "Ⅳ级", "Ⅱ级", "Ⅲ级", "", ""], "r": "C", "e": "三类压力容器对焊接接头质量要求较高，100%射线检测（RT）时，对接接头质量等级至少要达到Ⅱ级。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574858", "t": 1, "q": "某化工装置需要输送温度为280℃、粘度为500mPa·s的高温粘稠液体，要求流量为50m³/h，扬程为80m，下列哪种类型的泵最适合该工况？", "a": ["旋涡泵", "单级单吸离心清水泵", "轴流泵", "螺杆泵", "", ""], "r": "D", "e": "输送高温粘稠液体，旋涡泵适合小流量、高扬程低粘度液体；单级单吸离心清水泵一般用于输送清水等低粘度流体；轴流泵适用于大流量、低扬程；螺杆泵适合输送高粘度液体。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574859", "t": 1, "q": "某压力容器的安全附件为安全阀，其整定压力为容器设计压力的1.05倍，回座压力为整定压力的0.9倍，若容器设计压力为8MPa，则安全阀的回座压力为？", "a": ["7.2MPa", "8.4MPa", "8.0MPa", "7.56MPa", "", ""], "r": "D", "e": "先根据设计压力算出整定压力，即8×1.05 = 8.4MPa，再由整定压力算出回座压力，8.4×0.9 = 7.56MPa。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574860", "t": 1, "q": "某压力容器的安全附件为爆破片，其爆破压力为容器设计压力的1.1倍，若容器设计压力为5.0MPa，且爆破片的制造允许偏差为±5%，则该爆破片的最大允许爆破压力为？", "a": ["5.775MPa", "5.5MPa", "5.25MPa", "5.0MPa", "", ""], "r": "A", "e": "先算出正常爆破压力，即设计压力乘以倍数，5.0×1.1 = 5.5MPa。再考虑制造允许偏差上限+5%，最大允许爆破压力为5.5×(1 + 5%) = 5.775MPa。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574861", "t": 1, "q": "某压力容器的焊接接头系数φ=0.85（局部无损检测），设计压力为3.0MPa，内径为900mm，材料许用应力为150MPa，不考虑腐蚀裕量，其简体的计算厚度为？", "a": ["15.0mm", "11.2mm", "17.6mm", "13.2mm", "", ""], "r": "D", "e": "这是一道关于压力容器计算厚度的问题。为了简化解析，我们可以直接使用相关的公式来计算。计算厚度的公式为：δ = P × D / (2 × [σ ] × φ - P)其中：δ 为计算厚度；P 为设计压力；D 为内径；[σ ] 为材料许用应力；φ 为焊接接头系数。将题目中的数据代入公式：P = 3.0MPaD = 900mm = 0.9m[σ ] = 150MPaφ = 0.85计算得：δ = 3.0 × 0.9 / (2 × 150 × 0.85 - 3.0) = 0.0132m = 13.2mm从上述计算中，我们可以看到计算厚度为13.2mm。所以，正确答案是D选项：“13.2mm”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574862", "t": 1, "q": "某压力容器的简体厚度计算值为25mm，考虑腐蚀裕量3mm、钢板负偏差0.8mm，采用双面焊对接接头，无损检测比例为100%，则该简体的最小设计厚度应为？", "a": ["28.8mm", "31.8mm", "25mm", "28mm", "", ""], "r": "A", "e": "这是一道关于压力容器设计厚度计算的问题。首先，我们需要考虑几个关键因素：简体的计算厚度、腐蚀裕量、钢板负偏差以及焊接和检测的要求。1. 简体计算厚度：这是容器设计的基础厚度，题目中给出为25mm。2. 腐蚀裕量：为了考虑长期使用中的腐蚀影响，需要增加一定的厚度。题目中给出的腐蚀裕量为3mm。3. 钢板负偏差：实际钢板厚度可能小于标称厚度，这个偏差需要考虑进去。题目中的钢板负偏差为0.8mm。4. 焊接和检测：由于采用双面焊对接接头，且无损检测比例为100%，这意味着焊接质量较高，不需要额外增加厚度以补偿焊接缺陷。综合考虑以上因素，简体的最小设计厚度应为计算厚度加上腐蚀裕量和钢板负偏差，即：最小设计厚度 = 计算厚度 + 腐蚀裕量 + 钢板负偏差= 25mm + 3mm + 0.8mm= 28.8mm因此，正确答案是A. 28.8mm。", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574863", "t": 1, "q": "某压力容器的接管与壳体采用角接接头焊接，接管公称直径为100mm，壳体厚度为16mm，根据《压力容器焊接规程》，该焊接接头的无损检测要求是？", "a": ["100%磁粉检测", "一般无需无损检测（除非设计有特殊要求）", "20%射线检测", "100%射线检测", "", ""], "r": "B", "e": "接管公称直径100mm、壳体厚度16mm的角接接头，按《压力容器焊接规程》一般无需无损检测，除非设计有特殊要求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574864", "t": 1, "q": "某压力容器的壳体材料为304不锈钢，介质为含氯离子（浓度500ppm）的水溶液，设计温度为80℃，为防止应力腐蚀开裂，下列措施中最有效的是？", "a": ["选用316L不锈钢", "增加壳体厚度", "降低设计压力", "进行焊后热处理（消除应力退火）", "", ""], "r": "A", "e": "304不锈钢在含氯离子环境易发生应力腐蚀开裂，316L不锈钢含钼，抗氯离子腐蚀能力强，能有效防止应力腐蚀。增加壳体厚度、降低设计压力不能从根本上解决氯离子腐蚀问题，焊后热处理虽能消除应力，但对抵抗氯离子腐蚀效果不如更换材料。所以最有效措施是选316L不锈钢，答案为A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574865", "t": 1, "q": "某压力容器的壳体材料为Q345R，厚度为18mm，进行气密性试验时，试验压力应为设计压力的？", "a": ["1.05倍", "1.25倍", "1.0倍", "1.1倍", "", ""], "r": "A", "e": "这是一道关于压力容器气密性试验压力的技术问题。首先，我们需要了解Q345R材料在压力容器制造中的应用及其相关标准。Q345R是一种常用的低合金高强度钢，广泛应用于压力容器的制造。对于这种材料制成的压力容器，在进行气密性试验时，试验压力通常会有明确的标准规定。现在，我们逐一分析选项：* A. 1.05倍：这个选项提供了一个稍微高于设计压力的试验压力，但我们需要确认这是否符合Q345R材料的试验标准。* B. 1.25倍：这个选项提供的试验压力更高，但通常气密性试验的压力不会设置得这么高。* C. 1.0倍：即试验压力等于设计压力，这在某些情况下可能是适用的，但需要具体根据标准和材料来判断。* D. 1.1倍：这个选项也提供了一个稍高于设计压力的试验值。根据《压力容器安全技术监察规程》的相关规定，对于Q345R等低合金高强度钢制压力容器，进行气密性试验时，试验压力通常为设计压力的1.05倍。综上所述，正确答案是A选项：“1.05倍”。所以，本题的正确选项是A。", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574866", "t": 1, "q": "某压力容器的壳体采用双面对接焊接，焊接接头系数φ=1.0（100%无损检测），设计压力为4.0MPa，内径为800mm，材料许用应力为160MPa，不考虑腐蚀裕量，简体的计算厚度为？", "a": ["15mm", "20mm", "12.5mm", "10mm", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574867", "t": 1, "q": "某压力容器的设计壁厚为30mm，实际制造时采用了厚度为32mm的钢板（负偏差0.5mm，腐蚀裕量3mm），该容器的有效壁厚为？", "a": ["29mm", "28.5mm", "32mm", "30mm", "", ""], "r": "B", "e": "有效壁厚=名义厚度-负偏差-腐蚀裕量，名义厚度32mm，负偏差0.5mm，腐蚀裕量3mm，32 - 0.5 - 3 = 28.5mm。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574868", "t": 1, "q": "某压力容器的设计温度为-20℃，介质为丙烷（中度危害），设计压力为2.0MPa，下列材料中适合作为该容器壳体的是？", "a": ["16MnR", "Q345R", "Q235B", "Q345DR", "", ""], "r": "D", "e": "该容器设计温度 -20℃，需考虑低温性能。A选项16MnR已被Q345R替代；B选项Q345R一般用于常温；C选项Q235B低温韧性差；D选项Q345DR是低温压力容器用钢，适合该工况。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574869", "t": 1, "q": "某压力容器的设计温度为-40℃，介质为液化天然气（无腐蚀性），设计压力为1.6MPa，下列哪种材料最适合作为该容器的壳体材料？", "a": ["16MnDR", "Q235B", "304不锈钢", "Q345R", "", ""], "r": "A", "e": "设计温度 -40℃，需用低温钢。Q235B、Q345R一般不用于低温；304不锈钢用于有腐蚀等情况，本题介质无腐蚀性。16MnDR是低温钢，适合此工况。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574870", "t": 1, "q": "某压力容器的设计温度为350℃，设计压力为6.0MPa，壳体材料为15CrMoR，该材料在350℃下的许用应力为150MPa，若容器筒体的内径为1000mm，不考虑腐蚀裕量和钢板负偏差，筒体的最小计算厚度为？", "a": ["20mm", "30mm", "35mm", "25mm", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574871", "t": 1, "q": "某压力容器的设计压力为6.0MPa，介质为毒性程度为高度危害的丙烯，容积为5m³，该容器的安全附件中，必须设置的是？", "a": ["压力表", "爆破片", "安全阀", "液位计", "", ""], "r": "C", "e": "这是一道关于压力容器安全附件配置的选择题。首先，我们要明确题目给出的关键条件：1. 压力容器的设计压力为6.0MPa。2. 介质为毒性程度为高度危害的丙烯。3. 容积为5m³。接下来，我们根据这些条件分析各选项：A. 压力表：虽然压力表是常见的压力容器附件，用于监测容器内的压力，但它不是特定于高度危害介质的必需附件。B. 爆破片：爆破片是一种断裂型安全泄放装置，但它通常用于特定情况，如防止容器因超压而发生爆炸，并非所有高压或毒性介质容器都必须设置。C. 安全阀：对于毒性程度为高度危害的介质，安全阀是必需的。它能在压力超过设定值时自动开启，释放压力，从而防止容器破裂或爆炸，确保人员和环境的安全。根据相关法规和标准，高度危害介质的压力容器必须配备安全阀。D. 液位计：液位计用于监测容器内液体的液位，虽然重要，但并不是针对高度危害介质的特定安全要求。综上所述，考虑到介质的高度危害性和压力容器的特性，必须设置的安全附件是安全阀。所以，正确答案是C.安全阀。", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574872", "t": 1, "q": "某压力容器的设计压力为7.0MPa，介质为丙烯（中度危害），容积为10m³，该容器的安全附件中，除安全阀外，还必须设置的是？", "a": ["液位计", "压力表", "温度表", "紧急切断阀", "", ""], "r": "D", "e": "对于盛装易燃、易爆介质的压力容器，除安全阀外，紧急切断阀是保障安全的重要附件，丙烯是易燃介质。所以除安全阀外还必须设置紧急切断阀。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574873", "t": 1, "q": "某压力容器的设计压力为10MPa，介质为饱和水蒸汽，设计温度为200℃，该容器的封头采用标准椭圆形封头，其最小壁厚计算时，需采用的封头系数K值为？", "a": ["0.6", "0.5", "2.0", "1.0", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574874", "t": 1, "q": "某压力容器的水压试验压力为4.0MPa，试验温度下材料的屈服强度为345MPa，根据规范要求，水压试验时容器壁的薄膜应力不应超过材料屈服强度的？", "a": ["90%", "60%", "80%", "70%", "", ""], "r": "C", "e": "这是一道关于压力容器水压试验时薄膜应力与材料屈服强度比例的问题。根据压力容器的相关规范，水压试验时的薄膜应力有一个明确的上限，这个上限是材料屈服强度的一定百分比。这个规定是为了确保在试验过程中，容器壁不会因应力过大而发生不可逆转的塑性变形或破坏。现在，我们来分析这个问题。题目给出了水压试验压力和材料在试验温度下的屈服强度，要求确定水压试验时容器壁的薄膜应力不应超过材料屈服强度的多少百分比。根据通常的压力容器设计规范和安全准则，这个百分比往往设定在一个相对保守的范围，以确保安全。在常见的工程实践中，水压试验时的薄膜应力通常被限制在材料屈服强度的某一特定百分比以下，这个百分比通常是低于材料屈服强度的90%的，以留出足够的安全裕量。在给出的选项中，B、C、D三个选项都低于90%，而A选项是90%，通常被认为过于接近材料的极限，因此在实践中不太可能被采用。进一步地，通过排除法我们可以确定，B选项60%可能过于保守，而D选项70%虽然也是一个相对安全的范围，但在某些规范中，可能会允许稍高的比例，以平衡安全性和经济性。C选项80%则落在这个平衡点上，既保证了安全性，又不过于保守。综上所述，水压试验时容器壁的薄膜应力不应超过材料屈服强度的80%，因此正确答案是C选项。所以，正确答案是C选项：“80%”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574875", "t": 1, "q": "某压力容器用于盛装液态氨（设计温度-30℃，设计压力2.0MPa），其壳体采用焊接结构，下列关于该容器焊接接头无损检测的要求，正确的是？", "a": ["所有焊接接头无需无损检测", "对接接头需进行100%射线检测（RT）或超声检测（UT）", "对接接头可进行20%射线检测（RT）", "角接接头需进行100%磁粉检测（MT）", "", ""], "r": "B", "e": "盛装液态氨且设计温度 -30℃、设计压力 2.0MPa 的压力容器，对接接头应进行 100%无损检测，可采用射线检测（RT）或超声检测（UT）。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574876", "t": 1, "q": "在泵的分类中，某泵通过叶轮的高速旋转，使介质获得离心力和轴向推力，从而实现介质的输送，且主要用于输送大流量、低扬程的清水，该泵属于？", "a": ["混流泵", "离心泵", "轴流泵", "旋涡泵", "", ""], "r": "A", "e": "混流泵靠叶轮旋转使介质获离心力和轴向推力，适用于输送大流量、低扬程清水。离心泵主要靠离心力；轴流泵靠轴向推力；旋涡泵主要靠叶轮与液体间的旋涡运动。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574877", "t": 1, "q": "在泵的性能参数中，“汽蚀余量”的作用是衡量泵的？", "a": ["扬程能力", "流量调节能力", "效率高低", "抗汽蚀能力", "", ""], "r": "D", "e": "汽蚀余量是指在泵吸入口处单位重量液体所具有的超过汽化压力的富余能量，它反映了泵抗汽蚀的能力。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574878", "t": 1, "q": "在泵的性能曲线中，离心泵的扬程-流量（H-Q）曲线随流量增加而下降，下列原因中导致该曲线下降的主要因素是？", "a": ["介质密度增加", "叶轮内流体的水力损失增加", "电机功率不足", "泵的转速降低", "", ""], "r": "B", "e": "离心泵扬程 - 流量曲线随流量增加下降，主要是因为流量增加时，叶轮内流体的水力损失增加，使有效扬程降低。介质密度对扬程 - 流量曲线形状无直接影响；电机功率不足和泵转速降低会使整体性能改变，但不是曲线下降的主要因素。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574879", "t": 1, "q": "在泵的选型中，当计算出的必需汽蚀余量（NPSHr）为3.5m，装置汽蚀余量（NPSHa）为5.0m，下列关于泵的汽蚀性能判断正确的是？", "a": ["一定会发生汽蚀，因为NPSHa-NPSHr<1.0m（安全余量）", "一定会发生汽蚀，因为NPSHa>NPSHr", "无法判断，需考虑介质温度", "不会发生汽蚀，因为NPSHa>NPSHr", "", ""], "r": "D", "e": "装置汽蚀余量大于必需汽蚀余量时，泵一般不会发生汽蚀。本题中NPSHa（5.0m）＞NPSHr（3.5m）。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574880", "t": 1, "q": "在泵的选型中，当介质为高温（350℃）的熔融盐，要求扬程为50m，流量为10m³/h，下列哪种泵最适合？", "a": ["旋涡泵", "屏蔽泵", "离心泵", "齿轮泵", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574881", "t": 1, "q": "在泵的选型中，当介质为含有固体颗粒（粒径≤5mm）的浆液，且要求无泄漏输送，下列哪种泵最适合？", "a": ["屏蔽泵", "单级单吸离心泵", "隔膜泵", "齿轮泵", "", ""], "r": "C", "e": "介质含固体颗粒且需无泄漏输送，隔膜泵靠隔膜往复运动输送，能适应含颗粒介质且可实现无泄漏。屏蔽泵适合清洁介质；单级单吸离心泵输送含颗粒介质易磨损；齿轮泵也不适合含颗粒介质。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574882", "t": 1, "q": "在泵的运行中，当离心泵的出口阀门完全关闭时，下列参数会达到最大值的是？", "a": ["功率", "流量", "扬程", "效率", "", ""], "r": "C", "e": "出口阀门全关，流量为 0，功率最小，效率也低，而扬程会达到最大值。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574883", "t": 1, "q": "在泵的运行中，当离心泵的流量超过额定流量时，泵的效率会如何变化？", "a": ["先升高后降低", "升高", "不变", "降低", "", ""], "r": "D", "e": "离心泵有一个额定流量，在额定流量附近效率最高，当流量超过额定流量，偏离最佳工况，泵的效率会降低。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574884", "t": 1, "q": "在泵的运行中，当离心泵发生\"气缚\"现象时，下列处理措施正确的是？", "a": ["提高介质温度", "降低泵的安装高度", "增大泵的出口阀门开度", "检查并密封泵的吸入管路，排除空气", "", ""], "r": "D", "e": "“气缚”是因泵内有空气而无法正常吸液。要解决需排除空气并保证吸入管路密封。A提高介质温度不能解决气缚；B降低泵安装高度一般针对气蚀；C增大出口阀门开度与排除空气无关。所以应选D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574885", "t": 1, "q": "在过程控制基础中，某控制系统采用比例积分（PI）控制器，当被控对象存在较大的静态偏差时，PI控制器通过哪个环节来消除静态偏差？", "a": ["无法消除静态偏差", "积分环节（I）", "比例环节（P）", "比例+积分环节共同作用", "", ""], "r": "B", "e": "比例环节不能消除静态偏差，积分环节能对偏差进行积分，随着时间积累可消除静态偏差。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574886", "t": 1, "q": "在过程控制基础中，某控制系统的过渡过程曲线显示，被控变量在设定值附近振荡，且振荡幅度逐渐增大，该系统的稳定性状态是？", "a": ["稳定", "不稳定", "临界稳定", "发散", "", ""], "r": "B", "e": "这是一道关于控制系统稳定性的题目。我们根据题目描述的现象来判断系统的稳定性状态。首先，理解题目中描述的关键现象：* 被控变量在设定值附近振荡。* 振荡幅度逐渐增大。接下来，分析这些现象对应的系统稳定性：* 如果系统稳定，被控变量最终会稳定在设定值，不会出现振荡或振荡幅度增大的情况。* 如果系统不稳定且振荡幅度逐渐增大，这表示系统无法使被控变量稳定在设定值，而是偏离越来越远。* 临界稳定是指系统处于稳定与不稳定之间的边缘状态，通常表现为振荡但振荡幅度不增大也不减小。* 发散不是一个标准的稳定性描述术语，在此情境下不适用。根据题目描述，“被控变量在设定值附近振荡，且振荡幅度逐渐增大”，这明显指向系统的不稳定状态。综上所述，该系统的稳定性状态是不稳定。所以，正确答案是B.不稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574887", "t": 1, "q": "在过程控制基础中，某控制系统的过渡过程时间是指？", "a": ["被控变量从开始变化到稳定在允许偏差范围内的时间", "被控变量从最大值回到设定值的时间", "被控变量从开始变化到第一次达到设定值的时间", "被控变量振荡一次的时间", "", ""], "r": "A", "e": "过渡过程时间定义为被控变量从开始变化到稳定在允许偏差范围内所经历的时间。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574888", "t": 1, "q": "在过程控制基础中，某控制系统的控制器采用\"比例积分\"（PI）控制，当积分时间Ti增大时，系统的静态偏差和动态响应速度会如何变化？", "a": ["静态偏差减小，响应速度减慢", "静态偏差增大，响应速度加快", "静态偏差减小，响应速度加快", "静态偏差增大，响应速度减慢", "", ""], "r": "A", "e": "这个问题涉及到控制系统中比例积分（PI）控制器的基本特性。在PI控制中，积分时间Ti是一个关键参数，它影响着系统的静态偏差和动态响应速度。1. 静态偏差：积分控制的主要作用是消除静态偏差。当积分时间Ti增大时，积分作用增强，这有助于更好地消除系统的静态偏差。因此，静态偏差会减小。2. 动态响应速度：虽然增强的积分作用有助于消除静态偏差，但它也会使得系统的动态响应变慢。因为积分控制会累积过去的误差，这导致系统在调整过程中反应更为平缓，从而减慢了响应速度。综上所述，当积分时间Ti增大时，系统的静态偏差会减小，但动态响应速度会减慢。所以，正确答案是A选项：“静态偏差减小，响应速度减慢”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574889", "t": 1, "q": "在过程控制基础中，某控制系统的控制器参数整定采用\"经验凑试法\"，当发现系统振荡剧烈时，应采取的调整措施是？", "a": ["增大比例系数，减小积分时间", "减小比例系数，增大积分时间", "减小比例系数，减小微分时间", "增大比例系数，增大微分时间", "", ""], "r": "B", "e": "经验凑试法中，系统振荡剧烈说明控制作用过强。比例系数过大、积分时间过小、微分时间过大等会使控制作用过强。所以应减小比例系数，增大积分时间来减弱控制作用，让系统趋于稳定。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574890", "t": 1, "q": "在过程控制基础中，某控制系统的衰减比为4:1，下列关于该系统动态性能的描述正确的是？", "a": ["系统无振荡，为单调衰减过程", "系统振荡较小，过渡过程平稳，稳定性好", "系统为临界振荡，稳定性最差", "系统振荡剧烈，过渡过程时间长", "", ""], "r": "B", "e": "衰减比反映系统振荡情况，4:1 属衰减振荡，此值表明系统振荡较小，过渡平稳，稳定性好。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574891", "t": 1, "q": "在过程控制基础中，某温度控制系统的设定值从200℃阶跃变化到220℃，系统过渡过程结束后，被控变量稳定在218℃，该系统的静态偏差为？", "a": ["-2℃", "-18℃", "2℃", "18℃", "", ""], "r": "C", "e": "静态偏差是设定值与被控变量稳定值之差，本题设定值220℃，稳定值218℃，偏差=220 - 218 = 2℃。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574892", "t": 1, "q": "在过程控制基础中，某液位控制系统为闭环控制系统，若控制器采用反作用方式，当测量值（液位）高于设定值时，控制器输出会如何变化？", "a": ["不变", "减少", "先增加后减少", "增加", "", ""], "r": "B", "e": "闭环控制系统中反作用控制器，测量值高于设定值时，为使系统趋于稳定，控制器输出应减小来调节。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574893", "t": 1, "q": "在过程控制基础中，某液位控制系统为定值控制系统，若被控对象的放大系数增大，对系统控制质量的影响是？", "a": ["系统响应速度减慢", "系统振荡加剧", "系统的静态偏差减小", "系统稳定性提高", "", ""], "r": "B", "e": "被控对象放大系数增大，会使系统增益增大，导致系统振荡加剧。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810613850574894", "t": 1, "q": "在过程控制中，某串级控制系统的主变量是反应釜温度，副变量是加热蒸汽流量。当蒸汽压力突然升高（干扰）时，首先动作的是？", "a": ["副执行器", "主控制器", "主执行器", "副控制器", "", ""], "r": "D", "e": "串级控制系统中，副回路能快速克服进入其中的干扰。蒸汽压力突然升高影响蒸汽流量，蒸汽流量是副变量，副控制器会首先动作调节副执行器来稳定副变量。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011648", "t": 2, "q": "根据《固定式压力容器安全技术监察规程》，压力容器分类需考虑的因素包括？", "a": ["容器容积", "设计温度", "设计压力", "介质危害程度", "", ""], "r": "ACD", "e": "压力容器分类要综合考虑容器容积、设计压力、介质危害程度等因素，设计温度并非分类考虑的关键因素。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011649", "t": 2, "q": "根据压力容器设计要求，下列情况中需进行疲劳校核的有？", "a": ["容器承受周期性压力波动", "容器频繁启停", "容器长期在额定压力下运行", "容器介质温度周期性变化", "", ""], "r": "ABD", "e": "疲劳校核主要针对有交变载荷的情况。A选项周期性压力波动、B选项频繁启停、D选项介质温度周期性变化都会使容器承受交变载荷，易产生疲劳；而C选项长期在额定压力下运行，无交变载荷，无需疲劳校核。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011650", "t": 2, "q": "压力容器的安全附件中，属于超压泄放装置的有？", "a": ["安全阀", "压力表", "爆破片", "紧急切断阀", "", ""], "r": "AC", "e": "超压泄放装置能在容器超压时自动泄放压力。安全阀和爆破片可在压力超限时动作泄放压力。压力表是测量压力的仪表，紧急切断阀用于紧急情况下切断介质流通。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011651", "t": 2, "q": "压力容器焊接接头的无损检测方法包括哪些？", "a": ["磁粉检测（MT）", "渗透检测（PT）", "超声检测（UT）", "射线检测（RT）", "", ""], "r": "ABCD", "e": "磁粉检测用于铁磁性材料表面和近表面缺陷检测；渗透检测适用于非多孔性金属材料表面开口缺陷；超声检测可检测内部缺陷；射线检测能检测内部体积型缺陷，它们都是压力容器焊接接头常用无损检测方法。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011652", "t": 2, "q": "压力容器选材需遵循的基本原则包括？", "a": ["材料成本最低", "材料焊接性能良好", "材料耐腐蚀性适应介质特性", "材料力学性能满足设计要求", "", ""], "r": "BCD", "e": "压力容器选材要考虑多方面，力学性能满足设计要求是保证容器安全运行的基础，焊接性能良好利于制造，耐腐蚀性适应介质特性可防止容器被腐蚀损坏。而仅追求材料成本最低可能无法满足使用要求。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011653", "t": 2, "q": "在泵的故障诊断中，泵轴承过热的可能原因包括？", "a": ["轴承安装不当", "泵轴与电机轴不同心", "润滑油不足或变质", "轴承磨损严重", "", ""], "r": "ABCD", "e": "ABCD选项情况都会导致泵轴承过热，安装不当、不同心会使轴承受力异常，润滑油不足或变质不能有效润滑散热，轴承磨损严重会加剧摩擦生热。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011654", "t": 2, "q": "在泵的汽蚀防护中，有效的防护措施有？", "a": ["提高介质温度", "增大吸入管路直径", "降低泵的安装高度", "减小泵的流量", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011655", "t": 2, "q": "在泵的性能曲线中，主要的性能曲线包括哪些？", "a": ["效率-流量曲线（η-Q）", "汽蚀余量-流量曲线（NPSH-Q）", "功率-流量曲线（P-Q）", "扬程-流量曲线（H-Q）", "", ""], "r": "ACD", "e": "泵的主要性能曲线有扬程 - 流量曲线（H - Q）、功率 - 流量曲线（P - Q）、效率 - 流量曲线（η - Q）。汽蚀余量 - 流量曲线（NPSH - Q）不是主要性能曲线。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011656", "t": 2, "q": "在泵的选型过程中，需重点关注的工艺参数有哪些？", "a": ["介质温度、腐蚀性", "所需流量、扬程", "介质粘度、密度", "现场安装空间", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011657", "t": 2, "q": "在泵的选型中，根据介质特性选择泵型时，下列匹配正确的有？", "a": ["腐蚀性介质→塑料泵", "高粘度介质→齿轮泵", "含颗粒介质→渣浆泵", "易燃易爆介质→屏蔽泵", "", ""], "r": "ABCD", "e": "塑料泵耐腐蚀适用于输送腐蚀性介质；齿轮泵适合输送高粘度介质；渣浆泵可输送含颗粒的介质；屏蔽泵无泄漏等特点适用于输送易燃易爆介质。四个选项匹配均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011658", "t": 2, "q": "在泵的选型中，介质为易燃易爆液体时，需采取的安全措施包括？", "a": ["设置安全阀", "泵体接地", "采用无泄漏密封", "选用防爆电机", "", ""], "r": "BCD", "e": "对于易燃易爆液体，要防止产生火花引发危险。安全阀主要是用于超压保护，与防止易燃易爆液体相关的危险关系不大；而泵体接地可防止静电积累产生火花，采用无泄漏密封能避免液体泄漏引发危险，选用防爆电机防止电机运行产生电火花等危险，这些都是针对易燃易爆液体的安全措施。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011659", "t": 2, "q": "在泵的运行维护中，需定期进行的维护工作有？", "a": ["密封件检查", "电机绝缘测试", "润滑油更换", "叶轮清洁", "", ""], "r": "ACD", "e": "在泵的运行维护中，为了确保其正常运行和延长使用寿命，需要定期进行一些关键维护工作。密封件检查是必要的，因为密封件的完好对于防止液体泄漏至关重要；润滑油更换也是常规维护的一部分，因为润滑油会随着使用时间的增长而变质，影响润滑效果；叶轮清洁同样重要，因为叶轮的积垢会影响泵的效率。而电机绝缘测试虽然也是电气设备维护的一部分，但并不是泵运行维护中需定期进行的常规工作，它更多是在电机检修或特定电气安全检查时进行。因此，选项A、C、D是泵运行维护中需定期进行的维护工作。正确答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011660", "t": 2, "q": "在泵的运行中，导致泵振动过大的原因有？", "a": ["泵轴与电机轴不同心", "叶轮不平衡", "吸入管路漏气", "轴承磨损", "", ""], "r": "ABD", "e": "泵轴与电机轴不同心、叶轮不平衡、轴承磨损都会使泵运行时受力不均产生振动；吸入管路漏气主要影响泵的吸入性能，一般不会直接导致振动过大。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011661", "t": 2, "q": "在隔膜泵的选型中，适合输送的介质类型有？", "a": ["高粘度液体", "含固体颗粒的浆液", "强腐蚀性液体", "易燃易爆液体", "", ""], "r": "ABCD", "e": "隔膜泵有良好密封和耐腐蚀性，可输送含固体颗粒的浆液、强腐蚀性液体、易燃易爆液体，也能输送高粘度液体。ABCD选项介质它都能输送。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011662", "t": 2, "q": "在过程控制的闭环系统中，可能导致系统不稳定的因素有？", "a": ["被控对象时间滞后过大", "控制器积分时间过小", "控制器比例系数过大", "执行器响应速度过慢", "", ""], "r": "ABC", "e": "被控对象时间滞后过大、控制器积分时间过小、控制器比例系数过大都易使系统振荡甚至不稳定；执行器响应速度慢一般只是影响控制及时性，通常不会直接导致系统不稳定。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011663", "t": 2, "q": "在过程控制的串级控制系统中，副回路的作用包括？", "a": ["提高系统的抗干扰能力", "消除主回路的静态偏差", "快速克服进入副回路的干扰", "减小主控制器的控制难度", "", ""], "r": "ACD", "e": "串级控制系统中，副回路能快速克服进入副回路的干扰，因为副回路反应快，可及时对干扰作出调整，从而提高系统抗干扰能力，也能减小主控制器控制难度。而消除主回路静态偏差是主控制器作用。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011664", "t": 2, "q": "在过程控制的串级控制系统中，主回路和副回路的特点包括？", "a": ["主回路克服主要干扰，副回路克服局部干扰", "主回路是定值控制，副回路是随动控制", "主控制器输出作为副控制器设定值", "副回路响应速度比主回路快", "", ""], "r": "ABCD", "e": "串级控制系统中，主回路主要克服主要干扰，副回路针对局部干扰；主回路是定值控制，副回路跟随主控制器输出变化做随动控制；主控制器输出是副控制器设定值；副回路包含对象少、时间常数小，响应速度比主回路快。ABCD四个选项描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011665", "t": 2, "q": "在过程控制的定值控制系统中，若出现静态偏差过大，可能的原因有？", "a": ["执行器故障", "控制器积分时间设置不合理", "控制器比例系数过小", "测量变送器精度不够", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011666", "t": 2, "q": "在过程控制的反馈控制系统中，测量变送器的误差对系统的影响包括？", "a": ["使被控变量偏离设定值", "导致静态偏差", "降低控制精度", "影响系统稳定性", "", ""], "r": "ABCD", "e": "答案：ABCD测量变送器的误差会导致测量值不准确。不准确的测量值会使系统误判当前状态，进而使被控变量偏离设定值，导致静态偏差。由于测量误差的存在，控制系统难以精确调节，降低了控制精度。同时，误差可能引起控制系统的误动作，影响系统的稳定性。", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011667", "t": 2, "q": "在过程控制的前馈-反馈复合控制系统中，其优点包括？", "a": ["提高系统稳定性", "克服可测干扰的影响", "消除静态偏差", "降低控制器参数整定难度", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011668", "t": 2, "q": "在过程控制的系统调试中，需进行的调试内容包括？", "a": ["系统无扰动切换", "执行器行程校验", "测量变送器校准", "控制器参数整定", "", ""], "r": "ABCD", "e": "过程控制的系统调试包括对测量、控制、执行等环节的调试及参数整定。测量变送器校准保证测量准确，执行器行程校验确保执行器正常动作，控制器参数整定使控制效果最佳，系统无扰动切换也是调试中重要的测试内容。ABCD四个选项均为系统调试需进行的内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011669", "t": 2, "q": "在过程控制的系统投运中，需遵循的步骤包括？", "a": ["手动操作稳定工况", "逐步调整控制器参数", "控制器参数置零", "无扰动切换至自动控制", "", ""], "r": "ABD", "e": "过程控制投运先手动操作使工况稳定，再逐步调参数，最后无扰动切到自动控制。C选项参数置零不符合正常投运流程。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011670", "t": 2, "q": "在过程控制的PID控制器中，微分作用的特点包括？", "a": ["超前于偏差变化动作", "对静态偏差无响应", "降低系统超调量", "易受噪声干扰", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011671", "t": 2, "q": "在过程控制基础中，闭环控制系统的组成部分包括？", "a": ["执行器", "被控对象", "控制器", "测量变送器", "", ""], "r": "ABCD", "e": "闭环控制系统由被控对象、测量变送器、控制器和执行器组成。ABCD四个选项均是其组成部分。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011672", "t": 2, "q": "在过程控制中，比例积分微分（PID）控制器的作用包括？", "a": ["积分环节消除静态偏差", "比例环节快速响应偏差", "微分环节减少系统振荡", "微分环节提前克服偏差变化趋势", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011673", "t": 2, "q": "在过程控制中，采用前馈控制的前提条件有？", "a": ["已知干扰对被控变量的影响规律", "能准确测量干扰信号", "系统存在明显的可测干扰", "被控对象存在纯滞后", "", ""], "r": "ABC", "e": "前馈控制是按干扰进行补偿的控制方式。要采用前馈控制，需知道干扰对被控变量影响规律才能补偿，要能准确测量干扰信号才能依据其进行控制，且系统得有明显可测干扰才有补偿的必要。而被控对象存在纯滞后与前馈控制前提无关。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011674", "t": 2, "q": "在过程控制中，控制器参数整定的目标包括？", "a": ["加快响应速度", "提高系统稳定性", "减少能源消耗", "减小静态偏差", "", ""], "r": "ABD", "e": "控制器参数整定要让控制系统性能良好，加快响应速度能使系统快速对变化做出反应，提高稳定性可保证系统正常运行，减小静态偏差能让控制结果更精准，这都是重要目标；而减少能源消耗通常不是参数整定的直接目标。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011675", "t": 2, "q": "在过程控制中，控制器的正、反作用选择需考虑的因素包括？", "a": ["执行器的作用方式", "控制系统的控制要求", "被控对象的作用方向", "测量变送器的量程", "", ""], "r": "ABC", "e": "答案：ABC控制器的正、反作用选择主要依据执行器的作用方式、控制系统的控制要求以及被控对象的作用方向，与测量变送器的量程无关。", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011676", "t": 2, "q": "在过程控制中，系统过渡过程的质量指标包括？", "a": ["衰减比", "过渡过程时间", "静态偏差", "超调量", "", ""], "r": "ABCD", "e": "过程控制中系统过渡过程质量指标用于衡量系统控制效果。衰减比反映系统振荡衰减程度；过渡过程时间体现系统趋于稳定的快慢；静态偏差表示系统稳定后的误差；超调量衡量系统响应超过稳态值的程度。ABCD四个选项均是系统过渡过程的质量指标。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011677", "t": 2, "q": "在过程控制中，影响控制器积分作用的参数有哪些？", "a": ["积分时间（Ti）", "比例系数（Kp）", "积分增益（Ki）", "微分时间（Td）", "", ""], "r": "AC", "e": "积分作用主要由积分时间和积分增益影响，积分时间Ti越小、积分增益Ki越大，积分作用越强。比例系数影响比例作用，微分时间影响微分作用。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011678", "t": 2, "q": "在过程控制中，影响系统过渡过程超调量的因素有？", "a": ["被控对象的纯滞后", "控制器积分时间", "被控对象的时间常数", "控制器比例系数", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011679", "t": 2, "q": "在过程控制中，影响系统稳定性的因素有？", "a": ["控制器积分时间", "控制器比例系数", "测量变送器精度", "被控对象时间常数", "", ""], "r": "ABD", "e": "控制器积分时间、比例系数以及被控对象时间常数都会影响系统稳定性，积分时间过短、比例系数过大、被控对象时间常数大等可能使系统不稳定；而测量变送器精度主要影响测量准确性，对系统稳定性影响小。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011680", "t": 2, "q": "在过程控制中，PID控制器参数整定的常用方法有哪些？", "a": ["最小二乘法", "经验凑试法", "衰减曲线法", "临界比例度法", "", ""], "r": "BCD", "e": "经验凑试法、衰减曲线法、临界比例度法是PID控制器参数整定常用方法，最小二乘法主要用于参数估计等，并非PID参数整定常用方法。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011681", "t": 2, "q": "在过程设备成型工艺的冲压成型中，防止工件开裂的措施有哪些？", "a": ["选择塑性好的材料", "对材料进行预热处理", "降低冲压速度", "合理设计冲压模具圆角", "", ""], "r": "ABD", "e": "冲压成型中防止工件开裂主要从材料性能、加工处理和模具设计等方面考虑。选择塑性好的材料能使材料变形能力更强，不易开裂；对材料预热处理可改善其变形性能；合理设计模具圆角能让应力分布更均匀，减少应力集中导致的开裂。而降低冲压速度对防止工件开裂的作用相对不明显。正确答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011682", "t": 2, "q": "在过程设备成型工艺的热处理中，整体热处理的目的包括？", "a": ["稳定工件尺寸", "消除焊接残余应力", "改善材料力学性能", "提高材料硬度", "", ""], "r": "ABC", "e": "整体热处理可消除焊接残余应力，稳定工件尺寸，还能改善材料力学性能。而提高材料硬度不是整体热处理主要目的。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011683", "t": 2, "q": "在过程设备成型工艺中，钢板卷制后的校圆工艺目的包括？", "a": ["消除卷制残余应力", "减小筒节椭圆度", "提高筒节的硬度", "保证筒节与封头的装配精度", "", ""], "r": "ABD", "e": "校圆主要是为让筒节更圆，减小椭圆度，使筒节与封头装配更精准，同时消除卷制残余应力。而校圆工艺不会提高筒节硬度。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011684", "t": 2, "q": "在过程设备成型工艺中，焊接接头的质量控制措施包括？", "a": ["控制焊接电流和电压", "实施无损检测", "进行焊后热处理", "选择合适的焊接材料", "", ""], "r": "ABCD", "e": "这几个选项都是控制焊接接头质量的措施。A控制电流电压能保证焊缝成型和质量；B无损检测可检查内部缺陷；C焊后热处理能改善接头性能；D合适的焊接材料是保证焊接质量基础。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011685", "t": 2, "q": "在过程设备的成型工艺中，冲压成型的适用范围包括？", "a": ["形状复杂的零件", "厚板压力容器壳体", "薄板零件", "批量生产的零件", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011686", "t": 2, "q": "在过程设备的成型工艺中，锻造成型的优点包括？", "a": ["力学性能好", "材料组织致密", "尺寸精度高", "适合复杂形状零件", "", ""], "r": "AB", "e": "锻造通过对金属坯料施加压力使其产生塑性变形，能使材料组织致密，改善力学性能。但锻造尺寸精度不如机加工等，且不适合复杂形状零件。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011687", "t": 2, "q": "在过程设备的成型工艺中，卷板机卷制筒节时，影响卷制质量的因素有？", "a": ["卷板机的辊径", "卷制时的压力", "钢板的初始平整度", "钢板的力学性能", "", ""], "r": "ABCD", "e": "卷板机辊径、卷制压力、钢板初始平整度和力学性能都会对卷制筒节质量产生影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011688", "t": 2, "q": "在过程设备的焊接工艺评定中，评定的内容包括哪些？", "a": ["焊接材料的匹配性", "焊接工艺参数的合理性", "焊接接头的力学性能", "焊接接头的耐腐蚀性", "", ""], "r": "ABCD", "e": "焊接工艺评定要考量多方面，焊接材料匹配、工艺参数合理与否影响焊接质量，焊接接头力学性能和耐腐蚀性是衡量焊接效果的重要指标，ABCD内容都属于评定范畴。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011689", "t": 2, "q": "在过程设备的焊接工艺中，选择焊接方法需考虑的因素有哪些？", "a": ["生产效率", "焊接接头形式", "工件厚度、材质", "焊接质量要求", "", ""], "r": "ABCD", "e": "选择焊接方法要综合多方面因素，生产效率会影响整体生产进度；焊接接头形式不同适用的焊接方法有差异；工件厚度和材质决定了合适的焊接手段；焊接质量要求也会对焊接方法的选择产生影响。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011690", "t": 2, "q": "在过程设备的焊接接头设计中，对接接头的优点包括？", "a": ["便于进行无损检测", "焊接质量易保证", "适用于厚板焊接", "受力均匀，应力集中小", "", ""], "r": "ABD", "e": "在过程设备的焊接接头设计中，对接接头具有以下特点：A. 便于进行无损检测：对接接头的形状和结构使得无损检测更加容易进行，可以有效检测焊接质量。B. 焊接质量易保证：对接接头的焊接过程相对简单，焊接质量更容易得到保证。D. 受力均匀，应力集中小：对接接头的结构使得受力更加均匀，应力集中较小，有利于提高设备的承载能力和使用寿命。C选项（适用于厚板焊接）并不是对接接头的特有优点，因为其他类型的焊接接头也可以适用于厚板焊接。综上所述，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011691", "t": 2, "q": "在过程设备的焊接中，产生焊接缺陷的主要原因有哪些？", "a": ["焊前清理不彻底", "焊接工艺参数不合理", "焊接操作技能不足", "焊接材料选用不当", "", ""], "r": "ABCD", "e": "焊前清理不彻底会影响焊接质量；焊接工艺参数不合理会导致焊接效果不佳；焊接操作技能不足易引发缺陷；焊接材料选用不当也会造成焊接问题。ABCD四个选项都是产生焊接缺陷的主要原因。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011692", "t": 2, "q": "在过程设备设计中，外压容器失稳的形式包括？", "a": ["周向失稳（圆截面变为椭圆形）", "局部失稳（壁面出现鼓包）", "材料屈服失稳", "轴向失稳（沿长度方向弯曲）", "", ""], "r": "ABD", "e": "外压容器失稳主要有周向失稳（圆截面变椭圆）、局部失稳（壁面鼓包）、轴向失稳（沿长度方向弯曲）。材料屈服失稳不属于外压容器失稳形式。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011693", "t": 2, "q": "在化工单元操作的萃取过程中，选择萃取剂的关键指标有？", "a": ["萃取剂的密度与稀释剂差异大", "萃取剂与稀释剂的互溶度小", "萃取剂易与溶质分离", "萃取剂对溶质的溶解度大", "", ""], "r": "BCD", "e": "萃取剂需满足与稀释剂互溶度小、对溶质溶解度大、易与溶质分离等要求，密度差异大利于分层但不是关键指标。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011694", "t": 2, "q": "在化工单元操作的萃取过程中，影响萃取选择性的因素有？", "a": ["操作温度", "萃取剂的种类", "萃取剂的用量", "萃取剂与稀释剂的互溶度", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810615738011695", "t": 2, "q": "在化工单元操作的干燥过程中，干燥介质的选择需考虑的因素有？", "a": ["介质与物料的相容性", "介质的成本", "介质的比热容", "介质的毒性", "", ""], "r": "ABCD", "e": "干燥介质选择时，要保证与物料相容才不影响干燥效果等；成本关乎经济性；比热容影响干燥热量利用；毒性涉及安全环保。ABCD四个因素都需考虑。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445248", "t": 3, "q": "齿轮泵的流量与介质的粘度无关，即使输送高粘度介质，流量也保持不变。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "齿轮泵是容积式泵，理论流量取决于工作腔容积变化量和转速，不过实际工作中，介质粘度会影响泄漏量，粘度越大泄漏越少，流量会增大，并非保持不变。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445249", "t": 3, "q": "齿轮泵的扬速与转速的平方成正比，因此提高转速可显著提高扬程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "齿轮泵属于容积式泵，其扬程与转速并无平方成正比关系，提高转速并不能显著提高扬程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445250", "t": 3, "q": "齿轮泵属于容积式泵，其流量与扬程无关，仅与转速和齿轮排量有关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "齿轮泵是典型的容积式泵，工作时依靠齿轮啮合造成的工作容积变化来输送液体，流量主要取决于转速和齿轮排量，与扬程关系不大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445251", "t": 3, "q": "隔膜泵属于往复式容积泵，其流量调节可通过改变冲程或频率实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "隔膜泵是往复式容积泵的一种，它通过改变冲程长度或运行频率，能有效调节流量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445252", "t": 3, "q": "根据《固定式压力容器安全技术监察规程》，设计压力大于等于10MPa的压力容器均属于三类压力容器。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "判断压力容器类别不能仅依据设计压力，还需考虑介质特性、容积等因素，所以仅说设计压力大于等于10MPa就都属于三类压力容器不准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445253", "t": 3, "q": "离心泵的安装高度越高，装置汽蚀余量（NPSHa）越小，越容易发生汽蚀现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "装置汽蚀余量（NPSHa）与离心泵安装高度有关，安装高度越高，NPSHa越小，当NPSHa小于泵的必需汽蚀余量时就易发生汽蚀。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445254", "t": 3, "q": "离心泵的流量调节可通过改变出口阀门开度实现，这种方法简单易行，但会产生附加阻力损失，降低效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离心泵改变出口阀门开度调节流量，操作简单，但阀门关小时会增大管路阻力，有附加阻力损失且降低效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445255", "t": 3, "q": "离心泵的气缚现象是由于介质在泵内汽化产生气泡导致的，与泵内是否有空气无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心泵气缚是因泵内有空气，启动后空气密度小，叶轮旋转产生的离心力小，无法将液体吸入和排出。而介质在泵内汽化产生气泡导致的是气蚀现象，并非气缚。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445256", "t": 3, "q": "离心泵的汽蚀余量越小，表明泵的抗汽蚀能力越强，允许的安装高度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心泵汽蚀余量越小，意味着泵入口处液体压力降得更低才会发生汽蚀，即泵抗汽蚀能力弱，允许安装高度低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445257", "t": 3, "q": "离心泵的效率曲线在额定流量时达到最大值，因此离心泵应在额定流量下运行以保证最高效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离心泵效率曲线在额定流量处最高，在额定流量下运行能让泵处于高效工作状态，可保证最高效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445258", "t": 3, "q": "离心泵的扬程与输送介质的密度无关，仅与叶轮结构、转速有关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离心泵扬程主要取决于叶轮结构、转速和流量等，与输送介质密度无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445259", "t": 3, "q": "离心泵的轴功率随流量的增大而增大，因此当泵出口阀门完全关闭时，轴功率达到最大值，易导致电机过载。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心泵轴功率随流量增大而增大，出口阀门完全关闭时流量最小，轴功率最小，并非最大，不会因轴功率最大导致电机过载。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445260", "t": 3, "q": "离心泵发生气缚现象时，泵内充满气体，无法吸液，此时应降低泵的安装高度以排除气体。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心泵气缚排除气体的方法是停泵后重新灌泵，而不是降低泵的安装高度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445261", "t": 3, "q": "离心式压缩机的喘振现象是由于排气压力过高导致的，降低排气压力即可消除喘振。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心式压缩机喘振是因流量减小到一定程度，气流在叶片非工作面形成严重气流分离造成，并非单纯排气压力过高导致，降低排气压力不一定能消除喘振。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445262", "t": 3, "q": "离心式压缩机的进口导流叶片调节不仅能改变排气量，还能调整压缩机的性能曲线，防止喘振。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "进口导流叶片调节可改变进入压缩机气体的预旋角度，从而改变排气量，同时能调整性能曲线，使工况点远离喘振区，起到防止喘振的作用。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445263", "t": 3, "q": "离心式压缩机的进口过滤器堵塞会导致进口流量减小，易引发喘振现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "进口过滤器堵塞使气体通过阻力增大，进口流量减小，当流量减小到一定程度，离心式压缩机就易进入喘振工况。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445264", "t": 3, "q": "离心式压缩机的排气量与进口压力成正比，进口压力越高，排气量越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心式压缩机排气量和进口压力并非简单的正比关系，排气量受多种因素综合影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445265", "t": 3, "q": "离心式压缩机发生喘振时，应立即减小出口阀门开度，降低排气压力，以消除喘振。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离心式压缩机发生喘振时，应增大出口阀门开度，增加流量来消除喘振，而不是减小出口阀门开度。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445266", "t": 3, "q": "螺杆式压缩机的冷却方式仅包括水冷，无法采用风冷，因此不适用于缺水场合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "螺杆式压缩机冷却方式有水冷和风冷两种，风冷适用于缺水场合，题干说仅包括水冷错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445267", "t": 3, "q": "螺杆式压缩机的排气量与转速成正比，因此改变转速是调节排气量的最有效方法。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "螺杆式压缩机排气量与转速确实成正比，通过改变转速能方便且有效地调节排气量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445268", "t": 3, "q": "螺杆式压缩机的排气温度过高主要是由于压缩比过大或冷却效果不佳导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压缩比过大时，气体被压缩程度高，温度会显著上升；冷却效果不佳则无法有效带走压缩过程产生的热量，都会致使排气温度过高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445269", "t": 3, "q": "螺杆式压缩机的润滑油不仅起润滑作用，还能冷却压缩气体和密封转子间隙，因此润滑油的油量和油质对压缩机运行至关重要。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "螺杆式压缩机中，润滑油确实有润滑、冷却压缩气体和密封转子间隙的作用，而油量不足或油质不佳会影响其正常运行，所以油量和油质对压缩机运行至关重要。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445270", "t": 3, "q": "螺杆式压缩机的润滑油系统故障会导致压缩机无法正常运行，因此润滑油系统需定期检查和维护。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "螺杆式压缩机运行依赖润滑油系统来润滑、冷却等，其故障会影响压缩机正常运行，所以定期检查维护很有必要。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445271", "t": 3, "q": "螺杆式压缩机的振动和噪声比离心式压缩机小，因此更适合用于对噪声要求严格的场合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "螺杆式压缩机振动和噪声比活塞式小，但离心式压缩机振动和噪声更小，更适合对噪声要求严格的场合。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445272", "t": 3, "q": "往复式压缩机的排气量随排气压力的升高而减小，主要是因为气缸余隙内的气体膨胀导致有效吸气容积减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "往复式压缩机排气压力升高时，气缸余隙内高压气体膨胀占据更多空间，使有效吸气容积减小，排气量随之减小。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445273", "t": 3, "q": "压力容器的安全附件应定期校验，其中安全阀的校验周期不应超过2年。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445274", "t": 3, "q": "压力容器的安全附件中，安全阀的整定压力应等于容器的设计压力，以确保容器不超压。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "安全阀的整定压力应略低于容器的设计压力，而非等于。若整定压力等于设计压力，当压力达到设计压力时才动作，不能很好起到提前保护作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445275", "t": 3, "q": "压力容器的安全附件中，爆破片的爆破压力应大于安全阀的整定压力，以确保安全阀先动作，爆破片作为备用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445276", "t": 3, "q": "压力容器的鞍式支座适用于卧式容器，若容器长度较长，应设置多个鞍式支座以避免容器弯曲变形。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "鞍式支座是卧式容器常用支座，当容器较长时，设置多个鞍式支座能增强支撑，减少容器因自身重力等因素产生的弯曲变形。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445277", "t": 3, "q": "压力容器的壁厚计算值应向上圆整至钢板的标准厚度，圆整后的厚度即为容器的设计厚度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445278", "t": 3, "q": "压力容器的对接焊接接头进行100%射线检测（RT）后，无需再进行超声检测（UT），因RT已能检测大部分内部缺陷。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "RT和UT检测原理不同，检测优势也不同。RT对体积型缺陷敏感，而UT对面积型缺陷更易检出。100%RT检测后也可能有未被发现的缺陷，UT可作为补充检测，所以不能仅因RT检测后就不进行UT检测。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445279", "t": 3, "q": "压力容器的腐蚀类型主要包括化学腐蚀和电化学腐蚀，其中电化学腐蚀在潮湿环境中更为常见。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压力容器腐蚀主要分化学和电化学腐蚀，电化学腐蚀需电解质溶液等条件，潮湿环境能提供电解质溶液，所以在潮湿环境更常见。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445280", "t": 3, "q": "压力容器的腐蚀裕量是为了弥补介质腐蚀导致的壁厚减薄，应根据介质腐蚀性和设计寿命确定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "腐蚀裕量就是为应对介质腐蚀使壁厚减薄而设，需依据介质腐蚀性和设计寿命来确定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445281", "t": 3, "q": "压力容器的腐蚀裕量应根据介质的腐蚀速率和容器的设计寿命计算确定，腐蚀速率越大，设计寿命越长，腐蚀裕量越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压力容器腐蚀裕量计算公式C<sub>2<\/sub>=kt，k 为介质腐蚀速率，t 为设计寿命。腐蚀速率越大或者设计寿命越长，所需腐蚀裕量就越大，题干表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445282", "t": 3, "q": "压力容器的腐蚀裕量应计入壳体的最小壁厚，因此腐蚀裕量越大，容器的安全性越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "腐蚀裕量计入最小壁厚，适当的腐蚀裕量可保证容器在一定时间内安全运行，但过大的腐蚀裕量会使容器壁厚增加，可能带来制造、成本等问题，且不一定就绝对意味着安全性更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445283", "t": 3, "q": "压力容器的焊接接头无损检测比例应根据容器的类别和介质危害程度确定，三类压力容器的对接接头需100%无损检测。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三类压力容器危险性较高，为保证安全，其对接接头通常要求100%无损检测。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445284", "t": 3, "q": "压力容器的焊接接头系数越大，表明焊接接头的质量越高，允许的最大工作压力也越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445285", "t": 3, "q": "压力容器的焊接接头系数越小，表明焊接接头的质量越低，所需的计算壁厚越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "焊接接头系数反映焊接接头质量，系数小意味着焊接质量相对差，为保证压力容器强度，所需计算壁厚就得增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445286", "t": 3, "q": "压力容器的计算壁厚是指仅考虑内压或外压产生的应力所需的壁厚，不包括腐蚀裕量和钢板负偏差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压力容器计算壁厚就是仅考虑内压或外压产生应力所需的壁厚，不包含腐蚀裕量和钢板负偏差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445287", "t": 3, "q": "压力容器的设计温度是指容器在正常操作过程中，壳体壁温的最高温度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压力容器的设计温度是指容器在正常操作时，在相应设计压力下，壳壁或元件金属可能达到的最高或最低温度。不只是最高温度。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445288", "t": 3, "q": "压力容器的设计温度应取容器在正常操作中可能出现的最高壁温，无需考虑异常工况下的温度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压力容器设计温度需考虑正常操作及异常工况下可能出现的最高和最低壁温，不能仅取正常操作时的最高壁温。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445289", "t": 3, "q": "压力容器的设计压力应大于等于容器的最高工作压力，以确保容器在正常操作中不超压。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "设计压力就是为保证容器安全，考虑各种因素确定的高于最高工作压力的压力，这样可防止容器在正常操作中超压。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445290", "t": 3, "q": "压力容器的水压试验保压时间应根据容器的容积确定，容积越大，保压时间越长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压力容器水压试验保压时间是有标准规定的，并非单纯由容器容积决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445291", "t": 3, "q": "压力容器的水压试验介质必须采用洁净水，不能使用其他液体。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水压试验介质一般用洁净水，但当有特殊要求时，也可采用不会导致发生危险的其他液体。所以题干说不能使用其他液体错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445292", "t": 3, "q": "压力容器的水压试验介质若采用海水，需在试验后立即将容器内部清理干净并干燥，防止腐蚀。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "海水含有多种盐分等物质，具有较强腐蚀性，压力容器水压试验用海水后，残留海水会腐蚀容器，所以需立即清理并干燥。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445293", "t": 3, "q": "压力容器的水压试验压力应大于等于设计压力的1.25倍，以确保容器有足够的强度储备。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据相关规定，压力容器水压试验压力一般是设计压力的1.25倍等，能保证容器有足够强度储备。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445294", "t": 3, "q": "压力容器的支座仅起支撑作用，无需考虑地震和风载荷的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压力容器的支座不仅要起支撑作用，在设计时必须考虑地震和风载荷等影响，以确保压力容器在不同工况下的稳定性和安全性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445295", "t": 3, "q": "压力容器的支座类型主要包括鞍式支座、耳式支座和裙式支座，其中裙式支座适用于高大直立的压力容器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "常见压力容器支座有鞍式、耳式和裙式，裙式支座稳定性好，能承受较大重量，适合高大直立的压力容器。", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445296", "t": 3, "q": "在过程控制的闭环系统中，若控制器采用正作用方式，执行器采用气开阀，则被控对象应采用反作用方式，以保证系统为负反馈。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在闭环系统中，为保证负反馈，当控制器正作用、执行器气开阀（正作用）时，被控对象需反作用，这样系统信号传递才能构成负反馈机制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810616891445297", "t": 3, "q": "在过程控制的闭环系统中，若系统的衰减比大于4:1，表明系统振荡过小，响应速度较慢，控制不够灵敏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 过程装备与控制工程（2）", "n": "基础练习题【含解析】 / 第5章 过程装备与控制工程（2）", "qs": [{"id": "2034810620523712512", "t": 1, "q": "在过程控制中，某流量控制系统采用前馈控制，前馈控制的特点是？", "a": ["基于偏差进行控制，能消除静态偏差", "基于干扰进行控制，能提前克服干扰影响", "需要与反馈控制结合，才能实现稳定控制", "控制精度高，无需考虑干扰的变化规律", "", ""], "r": "B", "e": "前馈控制是基于干扰进行控制，可提前对干扰采取措施以克服其影响。A选项是反馈控制特点；C选项前馈控制可单独存在；D选项前馈需考虑干扰变化规律。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712513", "t": 1, "q": "在过程控制中，某流量控制系统的被控变量为管道内液体流量，控制器采用比例积分微分（PID）控制器，当系统处于稳态时，控制器的微分作用输出为？", "a": ["零", "最大正值", "最大负值", "等于比例作用输出", "", ""], "r": "A", "e": "微分作用是根据被控变量的变化率来输出控制信号，稳态时被控变量变化率为零，所以微分作用输出为零。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712514", "t": 1, "q": "在过程控制中，某温度控制系统采用比例微分（PD）控制器，当被控对象受到阶跃干扰时，PD控制器的输出特性是？", "a": ["先产生一个比例输出，随后微分输出逐渐增加", "仅产生比例输出，微分输出无响应", "先产生一个较大的微分输出，随后微分输出逐渐衰减，仅保留比例输出", "比例输出和微分输出同时产生，且持续保持不变", "", ""], "r": "C", "e": "阶跃干扰瞬间变化率大，PD 控制器先有大的微分输出，随时间变化率减小，微分输出衰减，最后只剩比例输出。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712515", "t": 1, "q": "在过程控制中，某温度控制系统的被控对象纯滞后时间较长，为改善控制质量，应选用的控制器类型是？", "a": ["比例微分（PD）控制器", "比例（P）控制器", "比例积分（PI）控制器", "比例积分微分（PID）控制器", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712516", "t": 1, "q": "在过程控制中，某温度控制系统的被控对象时间常数较大，纯滞后较小，为提高系统的控制质量，应优先调整控制器的哪个参数？", "a": ["比例系数（Kp）", "采样周期（Ts）", "微分时间（Td）", "积分时间（Ti）", "", ""], "r": "C", "e": "被控对象时间常数大、纯滞后小，微分作用能提前预测变化，对大时间常数对象可改善控制质量，所以应优先调整微分时间（Td）。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712517", "t": 1, "q": "在过程控制中，某压力控制系统采用串级控制系统，主控制器的被控变量是塔釜压力，副控制器的被控变量是蒸汽流量，下列关于该系统的描述正确的是？", "a": ["主控制器和副控制器的设定值均由操作人员设定", "副控制器的输出作为主控制器的设定值", "主控制器和副控制器的输出共同控制一个执行器", "主控制器的输出作为副控制器的设定值", "", ""], "r": "D", "e": "串级控制系统中，主控制器输出给副控制器作为其设定值。A选项，主控制器设定值由操作人员设定，副控制器设定值由主控制器输出决定；B选项说法错误；C选项，主副控制器是串联关系，副控制器输出控制执行器。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712518", "t": 1, "q": "在过程控制中，某压力控制系统的控制器采用\"反作用\"方式，当测量值低于设定值时，控制器输出会？", "a": ["先减少后增加", "不变", "减少", "增加", "", ""], "r": "D", "e": "“反作用”控制器，即测量值低于设定值时，偏差为负，控制器输出与偏差变化相反，此时控制器输出会增加。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712519", "t": 1, "q": "在过程控制中，某液位控制系统的执行器为气关阀（气压信号增加时阀门关小），控制器采用正作用方式，当液位升高时，控制器输出和阀门动作的关系是？", "a": ["输出减少，阀门关小", "输出增加，阀门关小", "输出增加，阀门开大", "输出减少，阀门开大", "", ""], "r": "B", "e": "正作用控制器，液位升高输出增加；气关阀气压信号增加阀门关小，输出增加即气压信号增加。所以液位升高时输出增加，阀门关小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712520", "t": 1, "q": "在过程设备成型工艺的冲压成型中，对于厚度为10mm的Q345R钢板，冲压成半球形封头，为防止冲压过程中钢板开裂，应采取的措施是？", "a": ["对钢板进行预热（加热至150-300℃）", "提高冲压模具温度", "减小冲压模具的曲率半径", "降低冲压速度", "", ""], "r": "A", "e": "Q345R钢板较厚，冲压时易开裂，预热可提高其塑性、降低变形抗力，防止开裂。提高模具温度作用有限；减小模具曲率半径会增加变形难度；降低冲压速度对防开裂效果不明显。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712521", "t": 1, "q": "在过程设备成型工艺的焊后热处理中，对于Cr-Mo钢压力容器的焊接接头，消除应力退火的温度范围通常是？", "a": ["650-700℃", "600-650℃", "500-550℃", "550-600℃", "", ""], "r": "A", "e": "Cr - Mo钢压力容器焊接接头消除应力退火温度一般在650 - 700℃。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712522", "t": 1, "q": "在过程设备成型工艺的焊接过程中，对于Cr-Mo低合金钢（如12Cr1MoVR）的焊接，为防止焊接接头出现冷裂纹，必须采取的关键工艺措施是？", "a": ["提高焊接电流", "降低焊接速度", "焊前预热", "焊后立即冷却", "", ""], "r": "C", "e": "Cr - Mo低合金钢焊接时，为防止冷裂纹，关键是降低焊接接头冷却速度，减少淬硬组织产生。焊前预热可实现此目的。提高焊接电流、降低焊接速度不是防止冷裂纹关键措施，焊后立即冷却会增加冷裂纹倾向。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712523", "t": 1, "q": "在过程设备成型工艺的焊接中，对于奥氏体不锈钢（如304）的焊接，为防止焊缝晶间腐蚀，需采用的焊接材料是？", "a": ["高碳型不锈钢焊条（如E308H）", "低合金结构钢焊条（如E4303）", "镍基合金焊条（如ENiCrMo-3）", "低碳型不锈钢焊条（如E308L）", "", ""], "r": "D", "e": "防止奥氏体不锈钢焊缝晶间腐蚀，应选低碳型材料，可减少碳化物析出。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712524", "t": 1, "q": "在过程设备成型工艺的焊接中，对于厚度为25mm的Q345R钢板对接焊接，采用埋弧焊，为保证焊透，应采用的坡口形式是？", "a": ["I形坡口", "U形坡口", "X形坡口", "V形坡口", "", ""], "r": "C", "e": "I形坡口一般用于较薄板焊接；U形坡口加工复杂，常用于较厚且要求高的焊件；V形坡口适用于中薄板；X形坡口双面施焊，应力分布均匀、变形小，适合较厚板焊接，25mm的Q345R钢板较厚，用X形坡口合适。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712525", "t": 1, "q": "在过程设备成型工艺的卷板过程中，为防止筒节出现椭圆度超标的问题，下列措施中最有效的是？", "a": ["增加卷板机的轧制力", "采用三辊卷板机并配合侧辊调整", "降低卷板速度", "增加钢板的预热温度", "", ""], "r": "B", "e": "三辊卷板机配合侧辊调整能较好地控制卷板形状，可有效防止筒节椭圆度超标。增加轧制力、降低卷板速度、增加预热温度对控制椭圆度效果不如调整卷板机。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712526", "t": 1, "q": "在过程设备成型工艺的卷板后，筒节需进行校圆，校圆的目的是？", "a": ["改善筒节的焊接性能", "消除卷板产生的残余应力", "提高筒节的硬度", "使筒节的椭圆度符合要求", "", ""], "r": "D", "e": "校圆主要是为了让筒节形状更规整，使椭圆度达到符合要求的标准。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712527", "t": 1, "q": "在过程设备成型工艺的热处理中，对于焊接后的压力容器壳体，进行整体消除应力热处理的目的不包括下列哪项？", "a": ["稳定容器的几何尺寸", "提高壳体的硬度", "降低焊接残余应力", "改善焊接接头的力学性能", "", ""], "r": "B", "e": "整体消除应力热处理可稳定尺寸、降低残余应力、改善焊接接头力学性能，通常不会提高壳体硬度，反而可能使硬度降低。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712528", "t": 1, "q": "在过程设备成型工艺中，对于大型球形容器的球瓣成型，下列哪种成型方法最适合实现球瓣的曲面形状且精度较高？", "a": ["水火弯板成型", "卷板机冷卷成型", "爆炸成型", "冲压成型（使用专用模具）", "", ""], "r": "D", "e": "水火弯板精度难控；卷板机冷卷不适合球瓣复杂曲面；爆炸成型精度和安全性有问题；冲压成型用专用模具能精准实现球瓣曲面形状。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712529", "t": 1, "q": "在过程设备成型工艺中，对于厚度为30mm的Q345R钢板，需制作直径为2000mm的圆柱形容器筒节，下列哪种成型方法最合理且能保证成型质量？", "a": ["冷卷成型（室温下卷制）", "热卷成型（加热至Ac1温度以下）", "爆炸成型", "冷压成型（使用模具压制）", "", ""], "r": "B", "e": "Q345R钢板厚度30mm较厚，冷卷成型易产生较大残余应力，冷压成型对于大直径筒节不适用，爆炸成型成本高且控制难。热卷成型加热至Ac1温度以下，能降低材料变形抗力，适合厚板大直径筒节成型。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712530", "t": 1, "q": "在过程设备设计中，当计算外压容器的临界压力时，需考虑容器的几何参数和材料性能，下列参数中对临界压力影响最大的是？", "a": ["材料的弹性模量", "容器的长度", "容器的内径", "容器的壁厚", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712531", "t": 1, "q": "在化工单元操作的萃取过程中，采用逆流萃取塔分离A、B两组分混合物（A为溶质，B为稀释剂），萃取剂为S。若保持进料量、进料组成、萃取剂用量不变，仅提高操作温度，且温度升高使A在S中的溶解度降低（相平衡常数m增大），此时萃取率会如何变化？", "a": ["无法确定，需结合塔高判断", "降低", "不变", "升高", "", ""], "r": "B", "e": "萃取率与溶质在萃取相中的分配有关，温度升高使A在S中溶解度降低、相平衡常数m增大，意味着溶质更难从稀释剂进入萃取剂，萃取效果变差，萃取率降低。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712532", "t": 1, "q": "在化工单元操作的过滤过程中，采用板框过滤机过滤悬浮液，若保持悬浮液浓度、过滤压力差不变，仅增加过滤时间，下列哪个参数会线性增加？", "a": ["滤饼厚度", "滤饼阻力", "过滤速率", "滤液量", "", ""], "r": "D", "e": "过滤基本方程表明，在其他条件不变时，滤液量与过滤时间的平方根成正比；滤饼厚度和滤饼阻力随滤液量增加而增加，并非与过滤时间线性相关；过滤速率随过滤进行而减小。而滤液量在恒压过滤时，与过滤时间的关系在一定条件下可近似看作线性增加（在过滤初期，简化情况下）。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712533", "t": 1, "q": "在化工单元操作的过滤过程中，若过滤介质阻力不可忽略，恒压过滤时，过滤时间与滤液量的关系是？", "a": ["指数函数关系", "二次函数关系", "线性关系", "对数函数关系", "", ""], "r": "B", "e": "恒压过滤且过滤介质阻力不可忽略时，过滤基本方程可推导得出过滤时间与滤液量的平方呈线性关系，即过滤时间与滤液量是二次函数关系。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712534", "t": 1, "q": "在化工单元操作的结晶过程中，采用冷却结晶法从溶液中析出晶体，若保持溶液初始浓度不变，仅降低冷却速率（缓慢冷却），则析出的晶体特性是？", "a": ["晶体颗粒大小均匀，数量多", "晶体颗粒细小，数量多", "晶体颗粒粗大，数量少", "晶体颗粒大小不均匀，数量少", "", ""], "r": "C", "e": "冷却速率慢时，晶核形成少且成长时间长，会使晶体颗粒粗大、数量少。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712535", "t": 1, "q": "在化工单元操作的吸收过程中，采用填料塔吸收混合气体中的有害组分，若保持其他操作条件不变，仅增加填料层高度，下列哪个参数会发生变化？", "a"
