像分类是计算机视觉任务。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631903", "t": 2, "q": "人工智能基础中，自然语言处理的文本分类任务常用的模型包括下列哪些？", "a": ["支持向量机（SVM）", "K均值聚类算法", "循环神经网络（RNN）", "Transformer模型", "", ""], "r": "ACD", "e": "支持向量机可用于文本分类；循环神经网络及其变体适合处理序列文本用于分类；Transformer模型在自然语言处理分类任务表现出色。而K均值聚类算法是无监督聚类算法，并非文本分类常用模型。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631904", "t": 2, "q": "人工智能基础中，Transformer模型的主要特点包括下列哪些？", "a": ["支持并行计算，训练速度快于RNN", "采用自注意力机制（Self-Attention），捕捉数据全局依赖", "仅适用于序列数据，不适用于图像数据", "广泛应用于NLP（如GPT）与计算机视觉（如ViT）", "", ""], "r": "ABD", "e": "Transformer支持并行计算，训练速度比RNN快；采用自注意力机制能捕捉全局依赖；它并非仅适用于序列数据，在图像领域也有应用；且在NLP和计算机视觉中都广泛应用。C选项错误。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631905", "t": 2, "q": "物联网技术应用分析中，5G技术在工业物联网中的优势包括下列哪些？", "a": ["低时延（毫秒级），适合实时控制（如远程机器人）", "不仅支持消费级应用，也支持工业应用", "高带宽，适合高清工业视频监控", "广连接，支持海量设备接入（如智能工厂传感器）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631906", "t": 2, "q": "物联网技术应用分析中，边缘计算在物联网中的优势包括下列哪些？", "a": ["替代云端实现大规模数据存储", "减少云端数据传输量，降低带宽成本", "降低数据传输延迟（就近处理）", "提高数据安全性（本地处理敏感数据）", "", ""], "r": "BCD", "e": "边缘计算主要是在靠近数据源的边缘侧处理数据。可减少数据向云端传输量，降低带宽成本；就近处理能降低数据传输延迟；在本地处理敏感数据可提高安全性，它不能替代云端实现大规模数据存储。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631907", "t": 2, "q": "物联网技术应用分析中，蓝牙技术的主要应用场景包括下列哪些？", "a": ["低功耗设备连接（如蓝牙低功耗传感器）", "远距离设备通信（如跨厂区设备互联）", "短距离设备互联（如车间内机器人与控制器通信）", "家庭智能家居设备互联（如手机与智能音箱）", "", ""], "r": "ACD", "e": "蓝牙技术特点是低功耗、短距离通信。A选项低功耗设备连接符合其低功耗特点；C选项短距离设备互联和D选项家庭智能家居设备互联都符合短距离通信特点。而蓝牙通信距离有限，无法实现远距离设备通信。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631908", "t": 2, "q": "物联网技术应用分析中，物联网的层级结构包括下列哪些？", "a": ["感知层（数据采集）", "应用层（数据应用）", "网络层（数据传输）", "仅包含感知层，无网络层与应用层", "", ""], "r": "ABC", "e": "物联网层级结构包含感知层负责数据采集、网络层负责数据传输、应用层负责数据应用。D选项说法错误。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631909", "t": 2, "q": "物联网技术应用分析中，物联网感知层常用的传感器类型包括下列哪些？", "a": ["振动传感器", "温湿度传感器", "无线路由器", "射频识别（RFID）标签", "", ""], "r": "ABD", "e": "物联网感知层的传感器用于收集物理世界信息，A振动传感器、B温湿度传感器、D射频识别（RFID）标签都能感知相关信息。而C无线路由器主要用于网络连接和数据传输，不属于传感器。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631910", "t": 2, "q": "物联网技术应用分析中，物联网网络层常用的通信技术包括下列哪些？", "a": ["蓝牙", "LoRa", "温湿度传感器", "5G", "", ""], "r": "ABD", "e": "温湿度传感器是感知层设备，不是网络层通信技术；蓝牙、LoRa、5G 都可用于物联网网络层通信。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631911", "t": 2, "q": "物联网技术应用分析中，物联网应用层的主要功能包括下列哪些？", "a": ["数据的物理采集（如传感器采集温度）", "行业应用开发（如智能电网、智能工厂）", "业务逻辑处理（如设备控制指令生成）", "数据的可视化展示与分析", "", ""], "r": "BCD", "e": "应用层是物联网和用户的接口，要面向行业需求开发应用，并处理业务逻辑、展示分析数据。A选项数据物理采集是感知层功能。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631912", "t": 2, "q": "物联网技术应用分析中，LoRaWAN协议的主要特点包括下列哪些？", "a": ["传输距离远（数公里）", "低功耗，设备电池寿命长（数年）", "传输速率低（kbps级），适合小数据量传输", "传输速率高（Mbps级），适合大数据量传输", "", ""], "r": "ABC", "e": "LoRaWAN是低功耗广域物联网协议，其优势在于能实现远距离传输、功耗低使设备电池使用久，且传输速率低，适合小数据量传输，并非大数据量的高速传输。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631913", "t": 2, "q": "物联网技术应用分析中，LPWAN（低功耗广域网）的主要技术包括下列哪些？", "a": ["Sigfox", "蓝牙", "NB-IoT", "LoRa", "", ""], "r": "ACD", "e": "LPWAN低功耗广域网主要技术有Sigfox、NB - IoT、LoRa等，蓝牙不属于LPWAN技术。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631914", "t": 2, "q": "物联网技术应用分析中，MQTT协议的主要特点包括下列哪些？", "a": ["支持QoS（服务质量）等级，保障消息可靠传输", "采用发布-订阅（Pub/Sub）通信模式", "不支持无线通信", "轻量级，适合资源受限的物联网设备", "", ""], "r": "ABD", "e": "MQTT支持QoS保障消息可靠，采用发布 - 订阅模式，轻量级适合资源受限设备，且支持无线通信。C选项错误。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631915", "t": 2, "q": "物联网技术应用分析中，RFID技术的主要特点包括下列哪些？", "a": ["非接触式识别（无需视线接触）", "识别距离较远（相比条形码）", "可同时识别多个标签", "仅能识别金属材质的物品", "", ""], "r": "ABC", "e": "RFID是射频识别技术，能非接触识别，无需视线接触，识别距离比条形码远，还可同时识别多个标签；它并非仅能识别金属材质物品。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631916", "t": 2, "q": "在人工智能基础中，下列哪些算法属于无监督学习算法，可用于数据的聚类或降维任务？", "a": ["支持向量机（SVM）", "主成分分析（PCA）", "K均值算法（K-Means）", "层次聚类算法", "", ""], "r": "BCD", "e": "无监督学习是指在没有标签数据的情况下进行学习。支持向量机是监督学习算法，用于分类和回归。主成分分析用于数据降维，K均值算法和层次聚类算法用于数据聚类，它们都属于无监督学习算法。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631917", "t": 2, "q": "智能工艺规划中，并行工程在工艺设计中的应用优势包括下列哪些？", "a": ["仅关注工艺设计，不参与产品设计环节", "缩短产品从设计到生产的周期", "提前发现产品设计与工艺的冲突，减少设计变更", "提高工艺设计与生产制造的协同效率", "", ""], "r": "BCD", "e": "并行工程强调产品设计与工艺设计等多环节并行开展。A选项只关注工艺设计不参与产品设计环节，不符合并行工程理念。B选项，并行开展工作可缩短产品从设计到生产的周期；C选项，能提前发现产品设计与工艺的冲突，减少后期设计变更；D选项，可提高工艺设计与生产制造的协同效率。所以优势包括BCD。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631918", "t": 2, "q": "智能工艺规划中，成组技术（GT）的实施步骤包括下列哪些？", "a": ["零件族划分（将相似零件归为一族）", "制定零件族的标准工艺规程", "零件分类编码（如按结构、工艺编码）", "设备的定期维护与更新", "", ""], "r": "ABC", "e": "成组技术实施先对零件分类编码以便区分，再按相似性划分零件族，最后制定零件族标准工艺规程。设备定期维护与更新和GT实施步骤无关。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631919", "t": 2, "q": "智能工艺规划中，成组技术的优势包括下列哪些？", "a": ["仅适用于单一品种零件生产，不适用于多品种", "实现设备的成组布置，减少物料搬运", "减少工艺设计工作量，提高效率", "提高零件生产的批量效应，降低成本", "", ""], "r": "BCD", "e": "成组技术适用于多品种生产，A错误；成组技术可实现设备成组布置减少物料搬运，能减少工艺设计工作量提高效率，还可提高批量效应降低成本，B、C、D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631920", "t": 2, "q": "智能工艺规划中，工序排序的基本原则包括下列哪些？", "a": ["先次后主（先加工次要表面，再加工主要表面）", "基准先行（先加工基准面，再加工其他表面）", "先粗后精（先粗加工去除余量，再精加工保证精度）", "先主后次（先加工主要表面，再加工次要表面）", "", ""], "r": "BCD", "e": "A. 先次后主（先加工次要表面，再加工主要表面）<br />错误。工艺规划中通常是先主后次，即先加工主要表面（如定位基准、重要配合面等），再加工次要表面。先次后主不符合工序排序的一般原则。<br />B. 基准先行（先加工基准面，再加工其他表面）<br />正确。基准先行是工序排序的重要原则，先加工出定位基准面，以便后续工序有可靠的定位基准。<br />C. 先粗后精（先粗加工去除余量，再精加工保证精度）<br />正确。先粗后精是基本工艺原则，先去除大部分余量，再逐步提高加工精度和表面质量。<br />D. 先主后次（先加工主要表面，再加工次要表面）<br />正确。主要表面通常精度要求高、对零件功能影响大，应先安排加工；次要表面（如倒角、小孔等）一般安排在主要表面加工之后。", "ap": [false, false, false, false, false, false]}, {"id": "2034810654455631921", "t": 2, "q": "智能工艺规划中，工艺参数的选择需考虑的因素包括下列哪些？", "a": ["设备的加工能力（如最大转速、功率）", "刀具的类型与材料", "车间的工作环境条件", "零件的加工精度要求", "", ""], "r": "ABD", "e": "答案：ABD工艺参数的选择主要考虑与加工过程直接相关的因素。A项“设备的加工能力”显然直接影响工艺参数的选择，因为超出了设备的加工能力范围，工艺就无法实施。B项“刀具的类型与材料”也是关键因素，因为不同的刀具材料和类型对加工效率、质量等都有直接影响。D项“零件的加工精度要求”同样重要，因为精度要求决定了加工过程中的各项参数，如切削深度、进给速度等。而C项“车间的工作环境条件”虽然可能影响加工过程，但它更多是一个宏观的、间接的因素，不是工艺参数选择时直接考虑的重点。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174336", "t": 3, "q": "大数据基础中，分布式计算框架（如Hadoop MapReduce）的\"Map\"阶段负责将大规模任务分解为子任务，\"Reduce\"阶段负责汇总子任务的结果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在Hadoop MapReduce中，Map阶段就是把大规模数据处理任务分解成多个子任务，Reduce阶段则是对Map阶段输出的子结果进行汇总。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174337", "t": 3, "q": "大数据基础中，分布式文件系统（如HDFS）采用主从（Master-Slave）架构，其中Slave节点负责管理文件系统的命名空间，Master节点负责存储数据块。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在分布式文件系统（如HDFS）主从架构里，Master节点管理文件系统的命名空间，Slave节点负责存储数据块，题干说法弄反了。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174338", "t": 3, "q": "大数据基础中，流处理技术主要用于处理已存储在磁盘中的批量历史数据，处理延迟较高但处理能力强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流处理技术主要处理实时数据流，而非已存储在磁盘中的批量历史数据，且流处理追求低延迟。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174339", "t": 3, "q": "大数据基础中，数据仓库的核心作用是存储企业原始的、未经过处理的多结构数据，以便后续灵活分析。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据仓库存储的是经过处理和整合的数据，而非原始的、未处理的多结构数据。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174340", "t": 3, "q": "大数据基础中，数据仓库的数据更新频率高，支持实时写入，以保证数据的时效性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。数据仓库主要用于数据分析和决策支持，其数据更新频率相对较低，通常是按特定时间周期（如每天、每周等）进行批量更新，并非支持实时写入，所以不能保证实时的数据时效性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174341", "t": 3, "q": "大数据基础中，数据湖与数据仓库可以相互替代，企业只需构建其中一种即可满足所有数据存储与分析需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据湖和数据仓库有不同特点和适用场景，不能相互替代，企业可能需两者结合来满足不同数据存储与分析需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174342", "t": 3, "q": "大数据基础中，数据可视化不仅能直观展示数据，还能直接生成数据挖掘的结论，无需后续分析。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据可视化主要是直观呈现数据，虽有助于理解数据特征，但不能直接生成数据挖掘结论，后续仍需深入分析。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174343", "t": 3, "q": "大数据基础中，数据立方体技术主要用于多维度数据的聚合分析，如按时间、地区、产品维度分析生产产量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据立方体是一种多维数据结构，可对多维度数据进行有效组织和管理，适用于按不同维度（像时间、地区、产品等）对生产产量这类数据进行聚合分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174344", "t": 3, "q": "大数据基础中，数据脱敏技术通过对敏感数据（如设备核心参数、个人信息）进行替换、加密等处理，既能保护数据安全，又不影响数据的分析使用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据脱敏就是对敏感数据做替换、加密等操作，在保障数据安全的同时，能让数据可用于分析。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174345", "t": 3, "q": "大数据基础中，数据预处理阶段的缺失值处理方法包括删除法、填充法（如均值填充）和插值法，其中删除法适用于缺失值比例较高的数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "删除法适用于缺失值比例较低的数据，若缺失值比例高，删除会丢失大量信息，影响数据完整性和分析结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174346", "t": 3, "q": "大数据基础中，数据质量管理的核心指标包括数据的准确性、完整性、一致性和时效性，其中时效性是指数据的存储时间长短。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "时效性指数据在特定时间内是否有效、可用，并非指数据存储时间长短。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174347", "t": 3, "q": "在机器人技术应用分析中，并联机器人的工作空间比串联机器人更大，更适合用于大范围的物料搬运作业。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串联机器人工作空间大，适合大范围物料搬运；并联机器人工作空间相对小，多用于高精度、高速度且工作空间不大的任务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174348", "t": 3, "q": "在机器人技术应用分析中，工业机器人的负载能力是指机器人末端执行器能够搬运的最大工件重量，不包括末端执行器自身的重量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174349", "t": 3, "q": "机器人技术应用分析中，工业机器人的工作空间是指机器人底座在车间内的安装范围，与末端执行器的运动无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。工业机器人的工作空间是指机器人末端执行器能到达的空间范围，并非机器人底座在车间内的安装范围，且和末端执行器的运动密切相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174350", "t": 3, "q": "在机器人技术应用分析中，工业机器人的离线编程相比在线编程，能够减少机器人的停机时间，提高设备的利用率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离线编程可在不占用机器人运行时间的情况下进行程序编写和调试，避免了在线编程时机器人需停机等待编程的情况，所以能减少停机时间、提高设备利用率。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174351", "t": 3, "q": "机器人技术应用分析中，工业机器人的离线编程需要在机器人现场进行程序编写与调试，无法在虚拟环境中完成。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工业机器人的离线编程可在虚拟环境中进行程序编写与调试，并非一定要在机器人现场。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174352", "t": 3, "q": "在机器人技术应用分析中，工业机器人的维护周期应严格按照设备手册执行，无需根据机器人的实际运行工况调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然设备手册提供了基本的维护周期参考，但实际运行工况会影响机器人的损耗程度。例如运行环境恶劣、工作强度大等情况，会使机器人零部件磨损加快，此时应根据实际情况调整维护周期，而不是严格按手册执行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174353", "t": 3, "q": "在机器人技术应用分析中，工业机器人的运动学正解是指已知末端执行器的位置和姿态，求解各关节的变量（如角度、位移）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工业机器人运动学正解是已知各关节变量求末端执行器位置和姿态，而题干描述的是运动学逆解的概念。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174354", "t": 3, "q": "在机器人技术应用分析中，工业机器人的运动自由度越多，其运动灵活性越强，能够完成的作业类型也越丰富。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "运动自由度多意味着机器人可在更多维度和方向上运动，所以灵活性增强，能完成更多类型作业。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174355", "t": 3, "q": "在机器人技术应用分析中，工业机器人的重复定位精度是指机器人末端执行器到达指定目标位置的准确性，通常用误差范围表示。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174356", "t": 3, "q": "在机器人技术应用分析中，协作机器人由于需要与人协同作业，其运动速度通常低于传统工业机器人，但定位精度更高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "协作机器人要与人协同作业，为保障安全，运动速度一般低于传统工业机器人，且其更注重与人配合完成精细操作，定位精度通常更高。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174357", "t": 3, "q": "在机器人技术应用分析中，协作机器人与传统工业机器人的最大区别在于协作机器人无需安全防护措施，可直接与人协同作业。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "协作机器人虽可与人协同作业，但并非无需安全防护措施，仍需一定防护来保障安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174358", "t": 3, "q": "人工智能基础中，分类任务的输出是离散的类别标签（如\"正常\"\"故障\"），而回归任务的输出是连续的数值（如\"剩余寿命120天\"），二者的核心区别在于输出类型的不同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该说法正确。分类任务输出为离散的类别标签，回归任务输出是连续数值，核心差异就是输出类型不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174359", "t": 3, "q": "人工智能基础中，强化学习的智能体通过与环境交互获取奖励，其学习目标是最大化累积奖励，找到最优的行动策略。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "强化学习的核心机制就是智能体在环境中行动，依据行动获得奖励反馈，目标就是让累积奖励最大化并寻得最优行动策略。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174360", "t": 3, "q": "人工智能基础中，深度学习模型的层数越多，模型的泛化能力越强，越不容易出现过拟合现象。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "深度学习模型并非层数越多泛化能力越强，层数过多可能导致模型过于复杂，更易出现过拟合，而不是越不容易。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174361", "t": 3, "q": "在人工智能基础中，深度学习模型的训练数据量越大，模型的泛化能力越强，因此无需考虑数据的质量，只需增加数据量即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然增加训练数据量在一定程度上有助于提升模型泛化能力，但数据质量同样关键。低质量数据可能包含错误、噪声等，会误导模型学习，即便数据量很大也难以保证模型有良好泛化能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174362", "t": 3, "q": "在人工智能基础中，深度学习模型训练时的损失函数用于衡量模型预测值与真实值的差距，损失函数值越小，模型的预测精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "损失函数就是用来衡量模型预测值和真实值之间的差异程度，损失函数值越小，说明预测值和真实值越接近，也就意味着模型预测精度越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174363", "t": 3, "q": "人工智能基础中，无监督学习的聚类任务不需要预先指定聚类数量，算法可自动确定最优的簇数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "无监督学习的聚类任务中，有些聚类算法（如DBSCAN）不需要预先指定聚类数量，能自动发现簇，但也有很多算法（如K - Means）需要预先指定聚类数量，并非所有算法都可自动确定最优簇数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174364", "t": 3, "q": "人工智能基础中，循环神经网络（RNN）由于存在梯度消失问题，难以处理长序列数据的依赖关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RNN在处理长序列时，随着序列长度增加，反向传播过程中梯度会逐渐变小甚至趋近于0，即梯度消失，这使得它难以捕捉长序列数据间的依赖关系。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174365", "t": 3, "q": "人工智能基础中，支持向量机（SVM）算法通过寻找最优超平面，将不同类别的数据进行分类，可用于设备故障的二分类与多分类任务。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "支持向量机（SVM）核心就是找最优超平面来划分不同类别数据，能用于二分类和多分类，设备故障分类可以使用。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174366", "t": 3, "q": "在人工智能基础中，自然语言处理的命名实体识别（NER）任务能够识别文本中的实体（如人名、地名、设备名），并标注其类别。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "命名实体识别（NER）就是从文本中识别出特定类型的实体，像人名、地名、设备名等，并标注其所属类别，这是自然语言处理的常见任务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174367", "t": 3, "q": "人工智能基础中，K均值聚类算法属于监督学习算法，需要预先知道数据的类别标签才能进行聚类。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "K均值聚类算法是无监督学习算法，它不需要预先知道数据的类别标签就能进行聚类。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174368", "t": 3, "q": "人工智能基础中，Transformer模型采用的自注意力机制能够捕捉序列数据中任意两个位置的依赖关系，比RNN的时序依赖捕捉能力更强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Transformer的自注意力机制可并行计算，能捕捉序列中任意位置依赖，不受时序限制；RNN按顺序处理，依赖时序，处理长序列时捕捉依赖能力受限，所以Transformer捕捉依赖能力更强。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174369", "t": 3, "q": "物联网技术应用分析中，5G技术的低时延特性（毫秒级）适合用于工业机器人的远程控制、设备的实时故障诊断等场景。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "5G技术具备低时延（毫秒级）特点，能快速响应指令和反馈数据，这对于工业机器人远程控制、设备实时故障诊断这类对时间要求高的场景很关键，可保障操作的及时性和准确性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174370", "t": 3, "q": "物联网技术应用分析中，感知层的主要功能是实现数据的远距离传输，确保采集的数据能快速上传至云端。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "感知层主要功能是采集物理世界的数据，而实现数据远距离传输、确保数据快速上传云端是网络层的功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174371", "t": 3, "q": "在物联网技术应用分析中，蓝牙低耗电（BLE）技术由于其功耗低、传输距离较短的特点，适合用于需要频繁传输小数据量的设备，比如智能手环或工业传感器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "蓝牙低耗电（BLE）确实功耗低，传输距离短，很适合频繁传输小数据量的场景，智能手环和工业传感器常需这样的特性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174372", "t": 3, "q": "物联网技术应用分析中，蓝牙技术的传输距离远、功耗低，适合用于跨厂区的设备互联与数据传输。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蓝牙技术传输距离较短，一般在10米左右，不适合跨厂区的设备互联与数据传输。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174373", "t": 3, "q": "物联网技术应用分析中，网络层的主要功能包括数据的加密传输、协议转换和设备接入认证，确保数据传输的安全与可靠。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "网络层主要负责数据的传输，包括数据的加密传输、协议转换和设备接入认证等，能保障数据传输安全可靠。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174374", "t": 3, "q": "物联网技术应用分析中，物联网的感知层设备均需通过有线方式供电，无法使用电池供电，以免频繁更换电池影响使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网感知层设备供电方式多样，既可用有线供电，也能用电池供电，一些低功耗设备可通过电池长期供电，并非均需有线供电。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174375", "t": 3, "q": "物联网技术应用分析中，LPWAN（低功耗广域网）技术的传输速率高、功耗低，适合用于需要大量实时数据传输的工业场景。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "LPWAN技术主要特点是低速率、低功耗、广覆盖，并非传输速率高，不适合大量实时数据传输的工业场景。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174376", "t": 3, "q": "物联网技术应用分析中，MQTT协议采用客户端-服务器（C/S）通信模式，每个客户端需直接与服务器建立连接才能传输数据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "MQTT协议确实是采用客户端 - 服务器（C/S）通信模式，客户端需与服务器建立连接后进行数据传输。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174377", "t": 3, "q": "物联网技术应用分析中，NB-IoT技术是LPWAN的一种，具有低功耗、广覆盖、大连接的特点，适合用于智能表计、智能农业等场景。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "NB - IoT是低功耗广域物联网（LPWAN）的典型技术，具备低功耗、广覆盖、大连接特性，能很好满足智能表计、智能农业等场景需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174378", "t": 3, "q": "物联网技术应用分析中，RFID标签的读取距离仅与标签的类型有关，与读写器的功率无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "RFID标签读取距离不仅和标签类型有关，读写器功率也会影响读取距离，功率大读取距离可能更远。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174379", "t": 3, "q": "物联网技术应用分析中，RFID标签无需电源即可工作（被动式），其能量由读写器发射的射频信号提供。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "被动式RFID标签自身没有电源，工作所需能量依靠读写器发射的射频信号提供。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174380", "t": 3, "q": "在人工智能基础中，监督学习算法需要依赖带标签的训练数据，而无监督学习算法无需任何标签数据即可进行训练。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "监督学习是利用带标签数据学习输入与输出的映射关系；无监督学习是对无标签数据进行分析挖掘潜在模式，确实无需标签数据训练。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174381", "t": 3, "q": "智能工艺规划中，并行工程通过将产品设计与工艺规划同步进行，能够提前发现设计与工艺的冲突，减少后期设计变更。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "并行工程理念就是让产品设计和工艺规划同步开展，这样可在早期就察觉设计和工艺间的冲突，避免后期因这些问题导致设计变更。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174382", "t": 3, "q": "智能工艺规划中，成组技术仅适用于机械加工领域，无法应用于装配、热处理等其他制造环节。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "成组技术并非仅适用于机械加工领域，在装配、热处理等其他制造环节也能应用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174383", "t": 3, "q": "智能工艺规划中，成组技术通过将结构、工艺相似的零件归为一族，采用相同的工艺方案，能够提高工艺设计的效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "成组技术核心就是把结构、工艺相似零件归为一族，用相同工艺方案，避免重复设计，可提高工艺设计效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174384", "t": 3, "q": "智能工艺规划中，工序分散是指将零件的加工过程分解为多个工序，在多台设备上完成，适合用于加工精度要求高的复杂零件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工序分散适合加工精度要求高的复杂零件，它将零件加工分解为多工序在多台设备完成，可利用各设备优势保证精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810655676174385", "t": 3, "q": "智能工艺规划中，工序集中是指将多个加工工序合并为一道工序，在一台设备上完成，可减少工件的装夹次数，提高加工精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工序集中就是把多个加工工序合并，在一台设备上完成，这样能减少装夹次数，装夹次数少了因装夹带来的误差就少，有利于提高加工精度。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第8章 智能制造工程（2）", "n": "基础练习题【含解析】 / 第8章 智能制造工程（2）", "qs": [{"id": "2034810658842873856", "t": 1, "q": "智能工艺规划中，\"工序排序\"的主要依据不包括下列哪项？", "a": ["车间工人的技术等级", "加工过程中的物料供应顺序", "零件的几何特征与加工要求（如先粗加工后精加工）", "设备的加工能力与负载情况", "", ""], "r": "A", "e": "工序排序主要考虑加工本身的要求、物料供应和设备情况等。车间工人技术等级对工序先后顺序影响不大，它主要影响操作的质量和效率等方面。而物料供应顺序、零件加工要求、设备加工能力与负载情况都是工序排序的重要依据。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873857", "t": 1, "q": "智能工艺规划中，\"工艺路线优化\"的主要目标不包括下列哪项？", "a": ["提高零件的加工精度", "减少设备的空闲时间", "降低生产过程的能耗", "缩短产品的生产周期", "", ""], "r": "A", "e": "工艺路线优化主要侧重于提升生产效率、降低成本等方面。减少设备空闲、降低能耗、缩短生产周期都属于其常见目标。而提高零件加工精度主要依赖于加工设备、工艺方法等，并非工艺路线优化的主要目标。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873858", "t": 1, "q": "智能工艺规划中，“工艺知识库”的构建过程中，知识获取的主要途径不包括下列哪项？", "a": ["从设备说明书中提取设备加工能力知识", "通过机器学习算法自动生成工艺知识", "从资深工艺工程师的经验中提取知识", "从历史工艺文件和加工案例中挖掘知识", "", ""], "r": "B", "e": "工艺知识库知识获取通常是从已有资料、人员经验等方面获取，机器学习算法是利用已有数据进行模型训练和预测等，不是知识获取的主要途径，主要是知识处理的手段。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873859", "t": 1, "q": "智能工艺规划中，\"计算机辅助工艺规划（CAPP）\"系统的类型不包括下列哪项？", "a": ["创成式CAPP（基于规则生成工艺）", "分布式CAPP（基于云计算的CAPP）", "检索式CAPP（基于实例检索）", "交互式CAPP（人机协同规划）", "", ""], "r": "B", "e": "常见CAPP系统类型有创成式、检索式、交互式，分布式CAPP并非通用分类类型。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873860", "t": 1, "q": "智能工艺规划中，\"特征识别技术\"的核心目的是？", "a": ["识别加工过程中的切削力特征", "识别生产车间的布局特征", "识别加工设备的型号与参数", "从零件的三维模型中提取具有特定加工意义的几何特征（如孔、槽）", "", ""], "r": "D", "e": "特征识别技术主要是在智能工艺规划里从零件三维模型找有特定加工意义的几何特征。A、B、C选项都不是其核心目的。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873861", "t": 1, "q": "智能工艺规划中，当加工零件的结构特征发生较大变化时，基于实例的工艺规划方法（CAPP）会面临的主要问题是？", "a": ["规则库更新困难", "计算复杂度过高", "实例库中无相似实例可匹配", "专家知识提取难度大", "", ""], "r": "C", "e": "基于实例的CAPP是依靠实例库中相似实例来规划工艺，零件结构特征变化大，实例库就难有相似实例匹配。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873862", "t": 1, "q": "智能工艺规划中，针对多工序、多资源约束的复杂零件加工，下列哪种规划方法更注重通过动态调整工艺路径以适应实时生产资源变化？", "a": ["基于专家系统的工艺规划方法", "基于实例的工艺规划方法", "基于动态规划的工艺规划方法", "基于规则的工艺规划方法", "", ""], "r": "C", "e": "动态规划方法特点就是能根据实时情况动态调整方案，在多工序、多资源约束下可动态调整工艺路径适应资源变化。而专家系统、实例和规则方法相对缺乏这种动态调整能力。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873863", "t": 1, "q": "智能运维与健康管理分析中，“多源信息融合”技术的主要目的是？", "a": ["将来自不同传感器（如振动、温度、电流）的数据结合分析，提高故障诊断精度", "仅保留最准确的传感器数据，丢弃其他数据", "将设备数据与生产订单数据融合，优化生产调度", "将同一传感器的多次测量数据取平均值，减少测量误差", "", ""], "r": "A", "e": "多源信息融合是把多个不同来源的信息整合起来。不同传感器能获取不同类型数据，结合分析可从多维度了解设备状态，提高故障诊断精度。B选项丢弃数据不是融合目的；C选项设备数据与生产订单数据融合不属于智能运维中多源信息融合主要针对的范畴；D选项对同一传感器多次测量数据处理并非多源信息融合。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873864", "t": 1, "q": "智能运维与健康管理分析中，“故障模式与影响分析（FMEA）”的风险优先数（RPN）是由哪三个因素相乘得到的？", "a": ["故障的持续时间、故障的严重度、故障的检测难度", "故障发生的频率、故障的维修成本、故障的影响范围", "故障发生的可能性、故障的严重度、故障的检测难度", "故障发生的可能性、故障的维修时间、故障的影响范围", "", ""], "r": "C", "e": "风险优先数（RPN）由故障发生的可能性、故障的严重度、故障的检测难度三个因素相乘得出。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873865", "t": 1, "q": "智能运维与健康管理分析中，“故障树分析（FTA）”方法的分析逻辑是？", "a": ["从可能导致顶事件（故障）的底事件出发，构建逻辑关系树", "从设备的异常现象出发，逐步追溯故障原因", "仅分析设备的机械故障，不考虑电气故障", "通过统计设备故障频率，确定故障高发部位", "", ""], "r": "A", "e": "故障树分析是从顶事件（故障）出发，找出导致该事件发生的所有可能底事件，构建逻辑关系树，B选项从异常现象追溯原因不是FTA的典型逻辑，C选项FTA不局限于机械故障，D选项与FTA分析逻辑不符。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873866", "t": 1, "q": "智能运维与健康管理分析中，\"剩余使用寿命（RUL）预测\"的核心是基于设备当前及历史健康状态数据，预测设备从当前时刻到发生故障的剩余运行时间。下列哪种模型更适合用于非线性、强耦合的设备RUL预测？", "a": ["朴素贝叶斯模型", "决策树模型", "长短期记忆网络（LSTM）模型", "线性回归模型", "", ""], "r": "C", "e": "对于非线性、强耦合的设备RUL预测，需要能处理序列数据和复杂非线性关系的模型。LSTM模型擅长处理序列数据且能捕捉长序列中的复杂依赖关系，适合此类预测。朴素贝叶斯、决策树和线性回归难以很好处理非线性、强耦合的设备RUL预测。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873867", "t": 1, "q": "智能运维与健康管理分析中，\"油液分析\"常用于机械设备故障诊断，其主要分析油液中的哪种成分以判断设备磨损状态？", "a": ["油液的粘度", "油液的水分含量", "油液中的金属磨屑", "油液的温度", "", ""], "r": "C", "e": "通过分析油液里的金属磨屑能了解设备零部件的磨损情况，从而判断设备磨损状态。而油液粘度、水分含量、温度虽也是油液分析指标，但并非用于判断设备磨损状态的主要成分。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873868", "t": 1, "q": "智能运维与健康管理分析中，“预测性维护”与“预防性维护”的主要区别在于？", "a": ["预测性维护仅适用于电气设备，预防性维护仅适用于机械设备", "预测性维护基于设备健康状态数据预测故障，预防性维护基于固定时间周期维护", "预测性维护无需数据支持，预防性维护需要数据支持", "预测性维护的成本高于预防性维护", "", ""], "r": "B", "e": "预测性维护是利用设备健康状态数据来预测故障从而采取维护措施；预防性维护通常是按照固定时间周期进行维护。A选项，二者并非分别只适用于电气和机械设备；C选项，预测性维护更依赖数据；D选项，成本高低不能简单判定。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873869", "t": 1, "q": "智能运维与健康管理分析中，“在线监测”与“离线监测”的主要区别在于？", "a": ["在线监测的成本低于离线监测", "在线监测仅用于电气设备，离线监测仅用于机械设备", "在线监测需要人工采集数据，离线监测自动采集数据", "在线监测实时采集数据，离线监测定期采集数据（如定期取样）", "", ""], "r": "D", "e": "在线监测可实时获取数据，离线监测是定期采集数据。A项在线监测成本不一定低于离线监测；B项在线和离线监测并非局限于特定设备；C项在线监测自动采集数据，离线监测需人工采集。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873870", "t": 1, "q": "智能运维与健康管理分析中，“振动分析”是设备故障诊断的常用方法。下列哪种故障通常不会通过振动信号的异常变化来识别？", "a": ["齿轮齿面疲劳剥落", "电机转子不平衡", "设备电路接触不良", "轴承滚动体磨损", "", ""], "r": "C", "e": "振动分析主要针对机械部件的故障，设备电路接触不良属于电气方面问题，不会直接引起振动信号异常变化。而齿轮齿面疲劳剥落、电机转子不平衡、轴承滚动体磨损都会导致机械振动异常。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873871", "t": 1, "q": "智能运维与健康管理分析中，\"振动信号的频谱分析\"主要用于识别设备故障的哪种特征？", "a": ["故障的严重程度", "故障的类型（如不平衡、不对中、松动）", "故障发生的时间", "故障的位置", "", ""], "r": "B", "e": "不同类型的故障（如不平衡、不对中、松动）会使振动信号频谱呈现不同特征，通过频谱分析可识别故障类型。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873872", "t": 1, "q": "智能运维与健康管理分析中，“状态监测”与“故障诊断”的关系是？", "a": ["二者相互独立，无直接关联", "状态监测仅用于设备正常运行时，故障诊断仅用于设备故障后", "状态监测是故障诊断的前提，故障诊断是状态监测的目的之一", "故障诊断是状态监测的前提，状态监测是故障诊断的目的之一", "", ""], "r": "C", "e": "要进行故障诊断，需先通过状态监测获取设备状态数据，所以状态监测是前提；而故障诊断能从监测数据中发现故障，是状态监测的目的之一。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873873", "t": 1, "q": "智能运维与健康管理分析中，设备故障诊断的\"趋势分析\"方法主要基于设备的哪种数据特征进行判断？", "a": ["同类型设备的平均运行数据", "设备历史运行数据的变化规律与趋势", "设备某一时刻的瞬时异常数据", "设备出厂时的额定参数数据", "", ""], "r": "B", "e": "趋势分析是基于设备历史运行数据来探寻其变化规律和趋势，从而判断设备故障。A选项平均运行数据不能体现个体设备的变化趋势；C选项瞬时异常数据不用于趋势分析；D选项额定参数数据与设备运行趋势无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873874", "t": 1, "q": "智能制造车间及调度中，“调度规则”的评价指标不包括下列哪项？", "a": ["订单交货期满足率", "生产周期（Makespan）", "产品的市场占有率", "设备利用率", "", ""], "r": "C", "e": "调度规则主要用于评估车间生产调度的效果，订单交货期满足率、生产周期、设备利用率都和车间生产调度直接相关。而产品的市场占有率受市场、营销等多种外部因素影响，并非调度规则评价指标。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873875", "t": 1, "q": "智能制造车间及调度中，\"动态调度\"与\"静态调度\"的主要区别在于？", "a": ["动态调度仅考虑单一目标，静态调度考虑多目标", "动态调度的计算复杂度低于静态调度", "动态调度在调度执行过程中可根据实时干扰（如设备故障）调整方案，静态调度一次性生成固定方案", "动态调度仅用于小批量生产，静态调度用于大批量生产", "", ""], "r": "C", "e": "动态调度会根据调度执行中实时出现的干扰情况来调整方案，而静态调度是一次性生成固定方案，这是二者主要区别。A选项，二者都可考虑单目标或多目标；B选项，动态调度计算复杂度通常更高；D选项，二者适用生产批量并无此绝对对应关系。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873876", "t": 1, "q": "智能制造车间及调度中，\"拉动式调度\"与\"推动式调度\"的主要区别在于？", "a": ["拉动式按生产计划推动生产，推动式按客户需求拉动生产", "拉动式按客户需求或后工序需求拉动生产，推动式按前工序计划推动生产", "拉动式的生产周期更长，推动式的生产周期更短", "拉动式仅适用于大批量生产，推动式仅适用于小批量生产", "", ""], "r": "B", "e": "拉动式调度是根据客户需求或后工序需求来拉动生产，推动式调度是按前工序计划推动生产。A选项说法错误；C选项生产周期长短与拉动或推动调度方式无必然联系；D选项两种调度方式适用情况并非如此绝对。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873877", "t": 1, "q": "智能制造车间及调度中，“瓶颈漂移”现象是指？", "a": ["瓶颈设备的故障频率不断升高", "瓶颈设备的加工效率逐渐下降", "瓶颈设备的位置随生产订单变化而动态改变", "瓶颈设备的数量不断增加", "", ""], "r": "C", "e": "“瓶颈漂移”重点在于“漂移”，意味着位置动态变化，在智能制造车间及调度里就是瓶颈设备位置随生产订单变化而改变。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873878", "t": 1, "q": "智能制造车间及调度中，\"瓶颈设备\"是制约车间产能的关键设备。下列哪种调度策略最适合优先保障瓶颈设备的高效运行？", "a": ["最早交货期（EDD）策略", "先到先服务（FCFS）策略", "最短加工时间（SPT）策略", "关键设备优先（Critical Machine First）策略", "", ""], "r": "D", "e": "题目强调要优先保障瓶颈设备高效运行，关键设备优先策略直接针对关键设备，能优先保障瓶颈设备运行。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873879", "t": 1, "q": "智能制造车间及调度中，“柔性调度”的核心目标是应对车间内哪种动态变化？", "a": ["生产订单的批量与交货期变化", "原材料的固定供应周期", "车间设备的固定布局", "车间工人的固定排班", "", ""], "r": "A", "e": "柔性调度主要是为应对生产中的各种动态变化以灵活安排生产。A选项生产订单的批量与交货期是动态变化的，需要柔性调度来应对；B原材料固定供应周期、C车间设备固定布局、D车间工人固定排班都不是动态变化情况。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873880", "t": 1, "q": "智能制造车间及调度中，\"生产节拍\"是指？", "a": ["生产一件产品所需的总时间", "相邻两件产品从开始生产到完成的时间间隔", "车间所有设备的平均运行时间", "生产订单的交货周期", "", ""], "r": "B", "e": "生产节拍是指相邻两件产品从开始生产到完成的时间间隔。A选项生产一件产品总时间不是生产节拍概念；C选项车间设备平均运行时间与生产节拍无关；D选项生产订单交货周期也不是生产节拍。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873881", "t": 1, "q": "智能制造车间及调度中，\"生产提前期\"是指？", "a": ["产品的装配时间", "从生产订单下达开始到产品生产完成并入库的全部时间", "产品的加工时间", "原材料采购时间", "", ""], "r": "B", "e": "生产提前期就是从订单下达至产品完成入库的整个时长。A仅指装配时间，C仅为加工时间，D只是原材料采购时间，都不全面。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873882", "t": 1, "q": "智能制造车间及调度中，\"蚁群算法\"用于车间作业调度时，其核心灵感来源于蚂蚁的哪种行为？", "a": ["蚂蚁的防御行为，应对突发干扰", "蚂蚁的觅食行为，通过信息素引导寻找最优路径", "蚂蚁的分工合作行为，实现任务分配", "蚂蚁的筑巢行为，优化空间布局", "", ""], "r": "B", "e": "蚁群算法核心灵感源于蚂蚁觅食时通过释放信息素引导同伴寻找最优路径，和车间作业调度找最优方案类似。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873883", "t": 1, "q": "智能制造车间及调度中，“在制品库存”过高的主要原因不包括下列哪项？", "a": ["原材料供应不稳定，提前备货", "设备故障频发，生产中断", "生产调度不合理，工序间衔接不畅", "生产计划与市场需求匹配度高", "", ""], "r": "D", "e": "在制品库存过高通常是因生产、供应等环节出问题。A提前备货、B设备故障中断生产、C生产调度不合理都会让在制品积压。而D生产计划与市场需求匹配度高，意味着生产有序合理，不会导致在制品库存过高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873884", "t": 1, "q": "智能制造车间及调度中，\"资源约束\"是车间调度的核心约束之一，下列哪项不属于资源约束？", "a": ["操作人员的数量与技能水平", "设备的加工能力（如最大转速、最大负载）", "产品的交货期要求", "原材料的供应数量与时间", "", ""], "r": "C", "e": "资源约束主要涉及车间内各类资源的限制。A选项操作人员、B选项设备、D选项原材料都属于车间资源范畴。而C选项产品的交货期要求是时间方面的约束，并非资源约束。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873885", "t": 1, "q": "智能制造工程典型应用中，“服务型制造”的核心是？", "a": ["以产品为核心，提供产品全生命周期的服务（如安装、运维、回收）", "替代产品制造，仅提供服务", "专注于产品的生产制造环节，提高生产效率", "仅提供售后服务，不参与产品设计", "", ""], "r": "A", "e": "服务型制造是以产品为核心，围绕其全生命周期提供各类服务，并非替代制造、只专注生产或仅做售后。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873886", "t": 1, "q": "智能制造工程典型应用中，“工业4.0”的核心特征不包括下列哪项？", "a": ["大规模批量生产", "智能化生产", "网络化协同", "个性化定制", "", ""], "r": "A", "e": "“工业4.0”强调智能化、网络化和个性化，以满足不同客户需求。大规模批量生产是传统工业特征，并非“工业4.0”核心特征。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873887", "t": 1, "q": "智能制造工程典型应用中，\"工业互联网平台\"的核心技术不包括下列哪项？", "a": ["机床主轴设计技术", "大数据存储与分析技术", "边缘计算技术", "区块链技术（用于数据加密与溯源）", "", ""], "r": "A", "e": "工业互联网平台核心技术侧重于数据处理、传输和安全等方面。大数据存储与分析、边缘计算、区块链用于数据加密与溯源都和数据相关，是平台核心技术。而机床主轴设计技术是机床制造的具体技术，不属于工业互联网平台核心技术。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873888", "t": 1, "q": "智能制造工程典型应用中，\"工业互联网平台\"与传统工业控制系统（如DCS）的主要区别在于？", "a": ["仅能实现单一设备的控制", "无法实现设备状态的实时监控", "支持跨企业、跨领域的资源互联与协同", "仅依赖本地硬件进行数据处理", "", ""], "r": "C", "e": "传统工业控制系统（如DCS）侧重于局部设备控制，而工业互联网平台优势是可跨企业、跨领域实现资源互联与协同。A选项工业互联网平台不止控制单一设备；B选项它能实现设备实时监控；D选项它不局限本地硬件处理数据。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873889", "t": 1, "q": "智能制造工程典型应用中，\"工业APP\"的主要特点是？", "a": ["仅用于设备的远程控制，功能单一", "基于工业互联网平台，面向特定工业场景（如设备运维、质量分析）的轻量化应用", "仅支持PC端访问，不支持移动端", "必须安装在本地服务器上，无法在云端运行", "", ""], "r": "B", "e": "工业APP是基于工业互联网平台，面向特定工业场景开发的轻量化应用。A选项“仅用于设备远程控制且功能单一”说法错误；C选项工业APP支持多端访问，并非仅支持PC端；D选项工业APP可在云端运行，并非必须安装在本地服务器。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873890", "t": 1, "q": "智能制造工程典型应用中，“绿色制造”在智能制造中的体现不包括下列哪项？", "a": ["通过大规模批量生产提高生产效率", "通过智能调度减少设备空转，降低能耗", "通过数字孪生仿真减少物理样机制作，节约材料", "通过切削参数优化减少切削液使用，降低污染", "", ""], "r": "A", "e": "绿色制造强调环保、节能、资源高效利用等。A选项大规模批量生产虽能提高效率，但未体现绿色环保相关内容；B减少能耗、C节约材料、D降低污染都符合绿色制造理念。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873891", "t": 1, "q": "智能制造工程典型应用中，“柔性制造系统（FMS）”的组成不包括下列哪项？", "a": ["物料搬运系统（如AGV）", "固定的产品装配流水线", "数控机床、工业机器人等加工设备", "生产调度与控制系统", "", ""], "r": "B", "e": "柔性制造系统特点是灵活可变，而固定的产品装配流水线缺乏柔性，不能根据不同生产需求快速调整，所以它不属于柔性制造系统组成。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873892", "t": 1, "q": "智能制造工程典型应用中，\"数字孪生\"技术在电力设备运维中的核心作用是？", "a": ["仅用于设备三维模型的可视化展示", "通过虚实映射实现设备全生命周期状态监控与预测", "仅用于设备故障后的维修方案设计", "替代现场设备的实际运行操作", "", ""], "r": "B", "e": "数字孪生是通过建立虚拟模型与物理设备的映射，能对设备全生命周期状态进行监控和预测。A选项，不只是三维模型可视化；C选项，不局限于故障后维修方案设计；D选项，不能替代现场设备实际运行操作。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873893", "t": 1, "q": "智能制造工程典型应用中，\"数字孪生\"与\"数字模型\"的主要区别在于？", "a": ["数字孪生仅用于设备，数字模型仅用于产品", "数字孪生是静态的三维模型，数字模型是动态的", "数字孪生能与物理实体实时数据交互，数字模型仅为静态仿真", "数字孪生的精度低于数字模型", "", ""], "r": "C", "e": "数字孪生可与物理实体进行实时数据交互，反映其状态变化；数字模型多是静态仿真，不具备实时交互能力。A选项应用场景说法错误；B选项数字孪生是动态的；D选项数字孪生精度通常不低于数字模型。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873894", "t": 1, "q": "智能制造工程典型应用中，“数字线程（Digital Thread）”技术的核心是？", "a": ["替代数字孪生实现设备状态监控", "构建一条贯穿产品设计、制造、运维全生命周期的连续数据链路", "实现车间内设备的实时数据传输", "仅用于产品设计阶段的三维模型协同", "", ""], "r": "B", "e": "数字线程核心是构建贯穿产品全生命周期的连续数据链路，让各阶段数据流通共享。A选项数字线程不能替代数字孪生；C选项实时数据传输只是部分功能；D选项并非仅用于产品设计阶段。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873895", "t": 1, "q": "智能制造工程典型应用中，“虚拟制造（VM）”技术的主要作用是？", "a": ["在物理制造前，通过虚拟仿真验证产品设计与制造过程的可行性", "仅用于产品的外观设计评审", "仅用于制造设备的虚拟培训", "替代物理制造过程，直接生成虚拟产品", "", ""], "r": "A", "e": "虚拟制造技术主要是在实际物理制造前，借助虚拟仿真来验证产品设计和制造过程的可行性。B选项过于局限，不只是用于外观设计评审；C选项同理，不只是用于设备虚拟培训；D选项虚拟制造不能替代物理制造直接生成产品。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873896", "t": 1, "q": "智能制造系统切削参数智能优选中，\"表面粗糙度\"的主要影响因素不包括下列哪项？", "a": ["设备的安装位置", "切削速度", "刀具的刃口半径", "进给量", "", ""], "r": "A", "e": "表面粗糙度受切削过程相关参数影响，切削速度、刀具刃口半径、进给量都与切削直接相关。而设备安装位置对切削过程中表面粗糙度无直接影响。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873897", "t": 1, "q": "智能制造系统切削参数智能优选中，\"刀具寿命\"是重要约束。下列哪种切削参数组合最可能导致刀具寿命显著缩短？", "a": ["低切削速度、高进给量、低背吃刀量", "高切削速度、高进给量、高背吃刀量", "高切削速度、低进给量、低背吃刀量", "低切削速度、低进给量、低背吃刀量", "", ""], "r": "B", "e": "一般来说，切削速度、进给量和背吃刀量越大，刀具承受的负荷和产生的热量就越大，磨损越快，刀具寿命会显著缩短。B选项是高切削速度、高进给量、高背吃刀量的组合，符合导致刀具寿命缩短的条件。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873898", "t": 1, "q": "智能制造系统切削参数智能优选中，\"切削力\"是重要的约束指标。若切削力超过设备或刀具的承载极限，会导致设备振动或刀具崩损。下列哪种切削参数调整会最显著地增大切削力？", "a": ["减小背吃刀量", "增大进给量", "减小切削速度", "增大背吃刀量", "", ""], "r": "D", "e": "背吃刀量对切削力影响最大，增大背吃刀量会显著增大切削力。减小背吃刀量会减小切削力；增大进给量对切削力有影响但不如增大背吃刀量显著；减小切削速度对切削力的影响相对较小。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873899", "t": 1, "q": "智能制造系统切削参数智能优选中，切削速度、进给量、背吃刀量是核心参数。若某加工场景要求优先保证零件表面粗糙度（Ra≤0.8μm），则应优先调整哪项参数以更显著地降低表面粗糙度？", "a": ["增大切削速度", "增大背吃刀量", "减小切削速度", "减小进给量", "", ""], "r": "D", "e": "在降低表面粗糙度方面，减小进给量对其影响更显著。增大背吃刀量会使表面粗糙度增大；增大或减小切削速度对降低表面粗糙度的效果不如减小进给量。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873900", "t": 1, "q": "智能制造系统切削参数智能优选中，若采用\"粒子群优化（PSO）\"算法，算法中的\"粒子\"代表的是？", "a": ["切削加工中的刀具", "切削过程中的切削力数据", "一组待优化的切削参数组合（如切削速度、进给量、背吃刀量）", "切削加工中的工件", "", ""], "r": "C", "e": "本题问PSO算法里“粒子”代表的内容，PSO算法用于优化问题，在智能制造系统切削参数智能优选中，目的是找到最优切削参数组合。所以“粒子”代表一组待优化的切削参数组合。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873901", "t": 1, "q": "智能制造系统切削参数智能优选中，若采用\"响应面法（RSM）\"进行优化，其核心步骤是？", "a": ["通过枚举所有参数组合寻找最优解", "基于邻居样本的相似性进行参数推荐", "通过大量正交试验构建切削参数与目标指标（如效率、质量）的回归模型，再寻优", "模拟生物进化过程，通过选择、交叉、变异寻找最优参数", "", ""], "r": "C", "e": "响应面法核心是通过设计试验（常为大量正交试验）构建自变量（切削参数）与因变量（目标指标）的回归模型，再基于模型寻优。A是穷举法，B与响应面法无关，D是遗传算法特点。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873902", "t": 1, "q": "智能制造系统切削参数智能优选中，若采用遗传算法进行优化，算法中的\"交叉\"操作主要作用是？", "a": ["将两个父代个体的基因进行交换，产生新的子代个体", "从种群中选择适应度高的个体保留到下一代", "随机改变个体的部分基因，引入新的遗传信息", "淘汰种群中适应度低的个体", "", ""], "r": "A", "e": "遗传算法中“交叉”就是把两个父代个体的基因交换产生新子代个体。B是选择操作作用，C是变异操作作用，D是淘汰机制。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873903", "t": 1, "q": "智能制造系统切削参数智能优选中，若加工材料为高强度合金（如钛合金），其切削加工的主要难点是导热系数低，易导致刀具温度过高。下列哪种切削参数调整策略更适合钛合金加工以降低刀具温度？", "a": ["减小切削速度，减小进给量", "增大背吃刀量，增大进给量", "增大切削速度，减小进给量", "减小切削速度，增大背吃刀量", "", ""], "r": "A", "e": "对于导热系数低、易使刀具温度过高的钛合金加工，要降低刀具温度，应减小产生热量的因素。切削速度和进给量越大，产生热量越多。所以应减小切削速度和进给量来降低刀具温度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873904", "t": 1, "q": "智能制造系统切削参数智能优选中，若加工要求为\"高速高效加工\"，且设备与刀具允许，下列哪种切削参数调整策略更合适？", "a": ["减小切削速度，减小进给量，增大背吃刀量", "增大切削速度，适当增大进给量，控制背吃刀量", "增大背吃刀量，减小切削速度，控制进给量", "减小切削速度，增大背吃刀量，控制进给量", "", ""], "r": "B", "e": "高速高效加工需提高加工效率，增大切削速度和进给量能提高材料去除率，同时要控制背吃刀量保证加工质量。所以选B。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810658842873905", "t": 1, "q": "智能制造系统切削参数智能优选中，若以\"单位时间加工成本最低\"为优化目标，下列哪项成本不需要纳入目标函数计算？", "a": ["设备能耗成本（加工过程的电费）", "车间厂房的折旧成本", "人工操作成本（操作人员的工时费用）", "刀具磨损成本（刀具更换、刃磨费用）", "", ""], "r": "B", "e": "单位时间加工成本主要与直接参与加工过程产生的成本相关，车间厂房折旧成本与具体切削参数关联不大，不随切削参数变化影响单位时间加工成本。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173312", "t": 2, "q": "智能工艺规划中，工艺路线设计需考虑的因素包括下列哪些？", "a": ["零件的加工顺序（如先基准后其他）", "刀具的使用寿命", "加工过程中的物料搬运路径", "设备的负载均衡", "", ""], "r": "ACD", "e": "工艺路线设计要综合多方面，零件加工顺序是基本要求，合理顺序影响加工质量；物料搬运路径关乎加工流程效率；设备负载均衡能保证设备合理使用和生产稳定。刀具使用寿命更多是刀具管理和更换考虑因素。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173313", "t": 2, "q": "智能工艺规划中，工艺路线优化的主要目标包括下列哪些？", "a": ["减少设备的空闲时间", "增加零件的加工工序数量", "缩短产品的生产周期", "降低生产过程中的能耗", "", ""], "r": "ACD", "e": "工艺路线优化主要是为提高生产效率、降低成本等。减少设备空闲、缩短生产周期、降低能耗都是优化目标，而增加加工工序数量会增加成本和时间并非优化目标。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173314", "t": 2, "q": "智能工艺规划中，工艺知识的表示方法包括下列哪些？", "a": ["仅用自然语言表示，不采用结构化方法", "框架表示法（如零件特征框架）", "语义网络表示法（如概念间的关联网络）", "规则表示法（如IF-THEN规则）", "", ""], "r": "BCD", "e": "自然语言不便于计算机处理和利用，智能工艺规划中一般不用仅用自然语言且不采用结构化方法来表示工艺知识。而框架表示法、语义网络表示法、规则表示法都是常见的工艺知识表示方法。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173315", "t": 2, "q": "智能工艺规划中，基于规则的工艺规划系统（RULE-Based CAPP）的核心组成部分包括下列哪些？", "a": ["实例库（存储历史工艺实例）", "知识库（存储工艺规则）", "推理机（基于规则推理工艺）", "解释器（解释工艺生成过程）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173316", "t": 2, "q": "智能工艺规划中，基于实例的工艺规划（CBR-CAPP）的核心步骤包括下列哪些？", "a": ["实例检索（从实例库中查找相似实例）", "仅依赖规则生成工艺，不使用历史实例", "实例修改（调整相似实例工艺以适应新零件）", "实例存储（将新零件工艺存入实例库）", "", ""], "r": "ACD", "e": "基于实例的工艺规划（CBR - CAPP）核心是利用历史实例解决新问题。A是从实例库找相似实例，C是调整相似实例适应新零件，D是将新工艺存入实例库，这三步是其核心步骤。B说仅依赖规则不使用历史实例，与CBR - CAPP利用实例的特点不符。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173317", "t": 2, "q": "智能工艺规划中，计算机辅助工艺规划（CAPP）的主要优势包括下列哪些？", "a": ["完全替代工艺工程师，无需人工干预", "保证工艺方案的一致性与规范性", "提高工艺设计效率，减少人工错误", "便于工艺知识的积累与复用", "", ""], "r": "BCD", "e": "CAPP不能完全替代工艺工程师，A错误；它能统一标准保证工艺方案一致规范，可提高设计效率减少失误，还利于工艺知识积累复用。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173318", "t": 2, "q": "智能运维与健康管理分析中，多源信息融合的主要方法包括下列哪些？", "a": ["仅使用单一传感器数据，不进行融合", "特征级融合（如提取多源数据的特征后融合）", "决策级融合（如多诊断模型结论融合）", "数据级融合（如多传感器数据拼接）", "", ""], "r": "BCD", "e": "多源信息融合就是要综合处理多个来源的信息。A选项仅用单一传感器数据不融合，不符合多源信息融合概念。B特征级、C决策级、D数据级是常见的多源信息融合方法。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173319", "t": 2, "q": "智能运维与健康管理分析中，故障树分析（FTA）的主要步骤包括下列哪些？", "a": ["仅分析设备的电气故障，不考虑机械故障", "构建故障树（分析底事件与顶事件的逻辑关系）", "计算底事件的重要度（如最小割集、概率重要度）", "确定顶事件（如设备停机故障）", "", ""], "r": "BCD", "e": "故障树分析（FTA）首先要确定顶事件，然后构建故障树体现底事件与顶事件逻辑关系，最后计算底事件重要度。它并非仅分析电气故障，机械故障也会考虑。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173320", "t": 2, "q": "智能运维与健康管理分析中，故障诊断的主要方法包括下列哪些？", "a": ["基于信号处理的方法（如振动分析、油液分析）", "仅依赖人工经验，不采用技术方法", "基于人工智能的方法（如神经网络、支持向量机）", "基于模型的方法（如故障树分析、状态观测器）", "", ""], "r": "ACD", "e": "故障诊断有多种科学方法，A基于信号处理、C基于人工智能、D基于模型都是常见方法；B仅依赖人工经验不采用技术方法不是主要的科学故障诊断方式。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173321", "t": 2, "q": "智能运维与健康管理分析中，设备故障诊断的常用多源数据包括下列哪些？", "a": ["电气参数数据（如电流、电压）", "设备的设计图纸数据", "振动信号数据", "温度、压力等过程参数数据", "", ""], "r": "ACD", "e": "设备故障诊断常用多源数据是能反映设备运行状态的数据。电气参数、振动信号、温度和压力等过程参数都和设备运行状态密切相关，可用于故障诊断。而设备设计图纸主要用于了解设备结构等，并非故障诊断常用的实时多源数据。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173322", "t": 2, "q": "智能运维与健康管理分析中，油液分析用于设备故障诊断的主要分析指标包括下列哪些？", "a": ["油液的水分含量", "设备的振动频率", "油液的粘度", "油液中的金属磨屑浓度与尺寸", "", ""], "r": "ACD", "e": "油液分析用于设备故障诊断主要关注油液自身特性及所含物质，水分含量、粘度、金属磨屑浓度与尺寸都和油液相关，而设备振动频率不属于油液分析指标。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173323", "t": 2, "q": "智能运维与健康管理分析中，预测性维护的核心步骤包括下列哪些？", "a": ["健康状态评估与故障预警", "剩余使用寿命（RUL）预测", "设备故障后的紧急维修", "设备健康数据采集与预处理", "", ""], "r": "ABD", "e": "预测性维护是基于设备健康数据来提前预判设备状态和故障，核心在于评估、预警、预测。D选项是基础工作；A选项健康状态评估与故障预警是重要环节；B选项剩余使用寿命预测是关键步骤。而C选项设备故障后的紧急维修属于事后行为，并非预测性维护核心步骤。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173324", "t": 2, "q": "智能运维与健康管理分析中，预测性维护相比预防性维护的优势包括下列哪些？", "a": ["提前预测故障，降低突发故障风险", "基于设备实际健康状态维护，避免过度维护", "减少不必要的停机时间，提高设备利用率", "维护成本更高，且需要更多数据支持", "", ""], "r": "ABC", "e": "A选项，预测性维护可借助技术提前预测故障，降低突发故障风险；B选项，它基于设备实际健康状态，能避免预防性维护可能存在的过度维护；C选项，减少不必要停机，提高设备利用率也是其优势。而D选项中维护成本高和需更多数据支持是缺点并非优势。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173325", "t": 2, "q": "智能运维与健康管理分析中，在线监测系统的组成包括下列哪些？", "a": ["传感器（如振动传感器、温度传感器）", "数据采集器（如DAQ设备）", "数据传输与分析软件", "仅包含传感器，无数据采集与分析组件", "", ""], "r": "ABC", "e": "在线监测系统需完成数据获取、传输和分析等功能。传感器用于获取数据，数据采集器收集传感器数据，数据传输与分析软件进行数据传输和分析。D选项说仅含传感器无数据采集与分析组件无法完整构成在线监测系统。ABC选项共同构成在线监测系统。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173326", "t": 2, "q": "智能运维与健康管理分析中，振动信号的频域分析方法包括下列哪些？", "a": ["倒频谱分析", "时域波形分析", "傅里叶变换（FFT）", "功率谱密度分析", "", ""], "r": "ACD", "e": "频域分析是把时域信号变换为频域信号，倒频谱分析、傅里叶变换（FFT）、功率谱密度分析都属于频域分析方法；时域波形分析是在时域对信号进行分析，不属于频域分析。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173327", "t": 2, "q": "智能运维与健康管理分析中，振动信号分析常用的时域特征参数包括下列哪些？", "a": ["峰值", "峭度", "均方根值（RMS）", "频率谱峰", "", ""], "r": "ABC", "e": "振动信号时域分析是直接分析信号的时间历程，而频率谱峰属于频域特征。峰值、峭度、均方根值是时域特征参数。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173328", "t": 2, "q": "智能运维与健康管理分析中，状态监测的主要功能包括下列哪些？", "a": ["监测数据的实时分析与异常报警", "设备健康状态的实时评估", "仅在设备故障后采集数据", "实时采集设备运行数据（如温度、振动）", "", ""], "r": "ABD", "e": "状态监测需实时采集设备运行数据，对其进行实时分析并在异常时报警，还能实时评估设备健康状态。C选项仅在设备故障后采集数据不符合状态监测实时性要求。所以答案选ABD。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173329", "t": 2, "q": "智能制造车间及调度中，常用的调度算法包括下列哪些？", "a": ["蚁群算法", "故障树分析（FTA）算法", "遗传算法", "最短加工时间（SPT）算法", "", ""], "r": "ACD", "e": "蚁群算法、遗传算法、最短加工时间（SPT）算法都是智能制造车间调度常用算法，而故障树分析（FTA）算法主要用于系统故障分析。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173330", "t": 2, "q": "智能制造车间及调度中，车间调度的评价指标包括下列哪些？", "a": ["车间工人的考勤率", "生产周期（Makespan，从首件开工到末件完工时间）", "交货期满足率（按时交货订单数/总订单数）", "设备利用率（设备实际运行时间/计划运行时间）", "", ""], "r": "BCD", "e": "车间调度评价指标主要围绕生产效率、订单交付和设备利用等方面。生产周期体现生产整体效率，交货期满足率反映订单交付情况，设备利用率体现设备使用效率，而工人考勤率与调度本身关联不大。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173331", "t": 2, "q": "智能制造车间及调度中，调度算法的评价标准包括下列哪些？", "a": ["鲁棒性（应对干扰的能力）", "求解速度（生成方案的时间）", "仅关注求解速度，不考虑精度与鲁棒性", "求解精度（调度方案的最优程度）", "", ""], "r": "ABD", "e": "调度算法评价需综合考量多方面，鲁棒性体现应对干扰能力，求解速度关乎生成方案的时间，求解精度反映调度方案的最优程度，而不能仅关注求解速度而忽略精度与鲁棒性。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173332", "t": 2, "q": "智能制造车间及调度中，动态调度的主要策略包括下列哪些？", "a": ["周期性调度（如每隔固定时间重新优化调度方案）", "一次性调度（生成方案后不调整）", "预测性调度（基于预测的设备状态调整方案）", "事件驱动调度（如设备故障触发调度调整）", "", ""], "r": "ACD", "e": "动态调度是根据实时情况调整调度方案。A周期性调度按固定时间重新优化，C预测性调度依据预测设备状态调整，D事件驱动调度因设备故障等事件触发调整，都符合动态调度特点。而B一次性调度生成方案后不调整，属于静态调度。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173333", "t": 2, "q": "智能制造车间及调度中，动态调度需应对的车间实时干扰事件包括下列哪些？", "a": ["车间固定的生产班次安排", "紧急生产订单插入", "设备突发故障", "原材料供应延迟", "", ""], "r": "BCD", "e": "动态调度针对实时干扰事件，A选项生产班次安排是固定的，不属于实时干扰。B紧急订单插入、C设备突发故障、D原材料供应延迟都属于车间实时会出现的干扰情况。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173334", "t": 2, "q": "智能制造车间及调度中，静态调度的特点包括下列哪些？", "a": ["基于已知的生产任务与设备状态，一次性生成调度方案", "适用于生产任务与设备状态稳定的场景", "调度方案生成后，在执行过程中不调整", "可实时应对设备故障等动态干扰", "", ""], "r": "ABC", "e": "静态调度是基于已知任务和设备状态一次性生成方案，适用于稳定场景，且生成后执行中不调整，不能实时应对动态干扰。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173335", "t": 2, "q": "智能制造车间及调度中，拉动式调度的实现条件包括下列哪些？", "a": ["实时的生产状态数据反馈（如在制品数量）", "大量的在制品库存作为缓冲", "完善的物料供应与物流配送体系", "稳定的生产节奏与均衡的生产负荷", "", ""], "r": "ACD", "e": "拉动式调度需依据实时生产数据决定生产，要有完善物流保障物料供应，且生产节奏和负荷稳定。而大量在制品库存是推动式生产特点，非拉动式调度条件。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173336", "t": 2, "q": "智能制造车间及调度中，瓶颈设备的识别方法包括下列哪些？", "a": ["在制品库存分析法（瓶颈设备前在制品库存堆积）", "生产周期分析法（瓶颈设备加工时间最长）", "设备利用率分析法（利用率最高的设备可能是瓶颈）", "仅通过设备的购置价格识别（价格高的是瓶颈）", "", ""], "r": "ABC", "e": "A选项中在制品库存堆积往往是因为瓶颈设备处理能力有限；B选项加工时间长会影响整体生产流程，易成为瓶颈；C选项利用率高说明设备负荷大，很可能是瓶颈。而设备购置价格与是否为瓶颈设备并无直接关联。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173337", "t": 2, "q": "智能制造车间及调度中，生产计划的主要内容包括下列哪些？", "a": ["生产资源的分配（如设备、人员）", "各产品的生产周期与交货期", "产品的生产数量与品种", "仅确定生产数量，不考虑交货期与资源", "", ""], "r": "ABC", "e": "生产计划需全面考虑各方面，要确定生产资源分配，明确各产品生产周期和交货期，规定产品生产数量与品种等。A、B、C选项都是生产计划的主要内容，D选项仅考虑生产数量，不考虑交货期与资源，不符合生产计划要求。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173338", "t": 2, "q": "智能制造车间及调度中，生产计划与调度的衔接要点包括下列哪些？", "a": ["生产计划与调度完全独立，互不关联", "生产计划的批量与交货期分解到调度任务", "计划与调度使用统一的数据平台，确保数据一致性", "调度反馈的设备状态与产能数据用于计划调整", "", ""], "r": "BCD", "e": "生产计划与调度是紧密关联的，A选项错误。B将生产计划的批量与交货期分解到调度任务，C用统一数据平台保证数据一致，D调度反馈数据用于计划调整，这都是生产计划与调度衔接的要点。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173339", "t": 2, "q": "智能制造车间及调度中，在制品库存控制的主要方法包括下列哪些？", "a": ["均衡生产（平衡各工序产能，避免堆积）", "拉动式生产（按需生产，减少在制品）", "无限制增加在制品库存作为缓冲", "优化工序间物流配送（减少搬运等待）", "", ""], "r": "ABD", "e": "A均衡生产可平衡产能避免堆积利于控制库存；B拉动式按需生产能减少在制品；D优化物流配送减少搬运等待也有助于库存控制。而C无限制增加在制品库存与控制库存相悖。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173340", "t": 2, "q": "智能制造工程典型应用中，服务型制造的主要模式包括下列哪些？", "a": ["个性化定制生产服务", "设备远程运维服务", "产品全生命周期管理服务", "仅提供产品的生产制造，不附加任何服务", "", ""], "r": "ABC", "e": "服务型制造强调制造与服务融合，为客户提供增值服务。A个性化定制生产服务、B设备远程运维服务、C产品全生命周期管理服务都体现了服务与制造结合。而D仅提供产品生产制造不附加服务，不符合服务型制造模式。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173341", "t": 2, "q": "智能制造工程典型应用中，工业4.0的关键技术包括下列哪些？", "a": ["仅依赖传统的自动化设备", "数字孪生", "人工智能", "工业互联网", "", ""], "r": "BCD", "e": "工业4.0强调智能化、数字化，传统自动化设备已不能满足需求，A错误；数字孪生可对物理实体进行映射和分析，人工智能提供智能决策和优化，工业互联网实现设备、系统等的互联互通，都是工业4.0关键技术。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173342", "t": 2, "q": "智能制造工程典型应用中，工业互联网平台的层级结构包括下列哪些？", "a": ["仅包含平台层，无边缘层与应用层", "应用层（工业APP与行业应用）", "边缘层（数据采集与边缘处理）", "平台层（数据存储与算法服务）", "", ""], "r": "BCD", "e": "工业互联网平台层级结构包含边缘层、平台层和应用层。边缘层负责数据采集与边缘处理，平台层进行数据存储与提供算法服务，应用层有工业APP与行业应用。A选项说仅含平台层错误。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173343", "t": 2, "q": "智能制造工程典型应用中，工业互联网平台的核心功能包括下列哪些？", "a": ["工业应用开发与部署（如工业APP）", "产品的物理制造", "数据存储与管理", "设备接入与数据采集", "", ""], "r": "ACD", "e": "工业互联网平台核心是实现数据流转、分析及应用开发等。产品物理制造是生产环节，并非平台核心功能。而设备接入与数据采集、数据存储与管理、工业应用开发与部署都是平台核心功能。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173344", "t": 2, "q": "智能制造工程典型应用中，工业APP的主要类型包括下列哪些？", "a": ["生产管理类APP（如调度优化APP）", "仅包含娱乐类APP，无工业相关APP", "质量分析类APP（如缺陷检测APP）", "设备运维类APP（如故障诊断APP）", "", ""], "r": "ACD", "e": "工业APP是面向工业场景，助力工业生产的应用。B选项娱乐类APP与工业生产无关，不符合要求。A选项生产管理类、C选项质量分析类、D选项设备运维类APP都与工业生产紧密相关，是工业APP的主要类型。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173345", "t": 2, "q": "智能制造工程典型应用中，绿色制造在智能制造中的实现途径包括下列哪些？", "a": ["通过数字孪生仿真减少物理试验，节约材料", "仅关注生产效率，不考虑环保因素", "通过切削参数优化减少切削液使用，降低污染", "通过智能调度减少设备空转，降低能耗", "", ""], "r": "ACD", "e": "绿色制造强调环保、节能等。A通过数字孪生仿真减少物理试验节约材料，C通过切削参数优化减少切削液使用降低污染，D通过智能调度减少设备空转降低能耗，都符合绿色制造理念。B仅关注生产效率不考虑环保因素不符合绿色制造要求。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173346", "t": 2, "q": "智能制造工程典型应用中，柔性制造系统（FMS）的特点包括下列哪些？", "a": ["产品类型固定，无法调整", "设备利用率高（可动态调度）", "多品种小批量生产适应性强", "生产过程自动化程度高", "", ""], "r": "BCD", "e": "FMS可根据需求调整产品类型，A错误；它能动态调度设备，提高利用率，适合多品种小批量生产，且自动化程度高，B、C、D正确。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173347", "t": 2, "q": "智能制造工程典型应用中，数字孪生的核心技术包括下列哪些？", "a": ["三维建模技术（如几何建模、物理建模）", "仅包含三维建模，无数据同步与仿真", "实时数据传输与同步技术", "仿真分析技术（如力学仿真、流体仿真）", "", ""], "r": "ACD", "e": "数字孪生核心技术有三维建模来构建虚拟模型，需实时数据传输与同步保证虚拟和现实一致，还有仿真分析技术来模拟运行等情况。B选项说仅三维建模无数据同步与仿真不符合数字孪生要求。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173348", "t": 2, "q": "智能制造工程典型应用中，数字孪生技术在电力设备运维中的具体应用场景包括下列哪些？", "a": ["设备出厂后的设计方案修改", "设备性能优化与运行参数调整", "设备故障预测与虚拟维修演练", "设备状态实时监控与可视化", "", ""], "r": "BCD", "e": "数字孪生可对电力设备建立虚拟模型，能实现设备状态实时监控与可视化、故障预测及虚拟维修演练、性能优化与运行参数调整等。而设备出厂后一般不会用数字孪生技术修改设计方案。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173349", "t": 2, "q": "智能制造工程典型应用中，数字孪生在产品设计阶段的应用包括下列哪些？", "a": ["产品性能优化（如流体动力学分析）", "虚拟装配测试（检查零件装配干涉）", "仅用于产品生产后的运维监控", "虚拟原型验证（如结构强度仿真）", "", ""], "r": "ABD", "e": "数字孪生在产品设计阶段可进行多方面模拟分析来优化产品。A选项产品性能优化分析、B选项虚拟装配测试、D选项虚拟原型验证都能在设计阶段借助数字孪生完成。而C选项说仅用于产品生产后运维监控，不符合其在设计阶段的应用。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173350", "t": 2, "q": "智能制造工程典型应用中，虚拟制造的主要优势包括下列哪些？", "a": ["缩短产品研发与生产周期", "减少物理样机制作，降低研发成本", "提高产品设计的灵活性和创新性", "提前发现制造过程中的问题（如工序干涉）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173351", "t": 2, "q": "智能制造系统切削参数智能优选中，采用多目标优化时常见的优化目标包括下列哪些？", "a": ["最大化设备的闲置时间", "最小化加工成本（如刀具、能耗成本）", "最大化加工效率（如最小化加工时间）", "最大化加工质量（如最小化表面粗糙度）", "", ""], "r": "BCD", "e": "智能制造系统切削参数智能优选多目标优化旨在提升效益和质量，B项降低成本、C项提高效率、D项提升质量都是合理目标；而A项最大化设备闲置时间不利于生产效益，不是常见优化目标。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173352", "t": 2, "q": "智能制造系统切削参数智能优选中，刀具材料的选择对切削参数的影响包括下列哪些？", "a": ["陶瓷刀具硬度高，可采用较大的背吃刀量加工硬材料", "刀具材料不影响切削参数选择", "硬质合金刀具耐热性好，可采用较高的切削速度", "高速钢刀具耐热性差，需采用较低的切削速度", "", ""], "r": "ACD", "e": "这是一道关于智能制造系统中刀具材料选择对切削参数影响的选择题。为了简化解析，我们可以概括性地指出：* 陶瓷刀具因其高硬度，确实适用于较大背吃刀量加工硬材料。* 刀具材料对切削参数的选择有显著影响，因此B选项是不正确的。* 硬质合金刀具因其良好的耐热性，可以支持较高的切削速度。* 高速钢刀具的耐热性相对较差，通常需要采用较低的切削速度。综上所述，刀具材料的选择确实会影响切削参数的选择。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173353", "t": 2, "q": "智能制造系统切削参数智能优选中，多目标优化算法包括下列哪些？", "a": ["粒子群优化算法（MOPSO）", "非支配排序遗传算法（NSGA-II）", "单目标遗传算法（SGA）", "层次分析法（AHP）", "", ""], "r": "AB", "e": "多目标优化算法用于同时优化多个相互冲突的目标。A选项粒子群优化算法（MOPSO）和B选项非支配排序遗传算法（NSGA - II）是典型的多目标优化算法；C是单目标遗传算法，用于单目标优化；D层次分析法是一种确定权重的方法，并非多目标优化算法。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173354", "t": 2, "q": "智能制造系统切削参数智能优选中，工件材料的物理力学性能对切削参数选择的影响包括下列哪些？", "a": ["材料塑性大，需控制进给量以避免积屑瘤", "材料导热性差，需减小背吃刀量以降低切削温度", "材料硬度高，需降低切削速度以减少刀具磨损", "材料性能不影响切削参数选择", "", ""], "r": "ABC", "e": "工件材料物理力学性能会影响切削参数选择。塑性大易产生积屑瘤，要控制进给量；导热性差需减小背吃刀量降低温度；硬度高降低切削速度可减少刀具磨损。D选项错误。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173355", "t": 2, "q": "智能制造系统切削参数智能优选中，加工质量约束包括下列哪些具体指标？", "a": ["尺寸精度（如IT等级）", "设备的最大功率", "表面粗糙度（Ra）", "形位公差（如圆度、平行度）", "", ""], "r": "ACD", "e": "加工质量约束主要指与加工件本身质量相关的指标。尺寸精度、表面粗糙度、形位公差都直接反映加工件质量，而设备最大功率与加工质量无直接关联。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173356", "t": 2, "q": "智能制造系统切削参数智能优选中，切削温度过高会导致的问题包括下列哪些？", "a": ["切削力显著增大", "刀具磨损加剧，寿命缩短", "工件加工精度下降（热变形）", "加工表面质量恶化（如积屑瘤产生）", "", ""], "r": "BCD", "e": "切削温度过高，刀具在高温下磨损加快，寿命会缩短；工件因受热会产生热变形，使加工精度下降；高温易产生积屑瘤等影响加工表面质量。而切削力显著增大主要与切削用量等有关，和切削温度过高无直接关联。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173357", "t": 2, "q": "智能制造系统切削参数智能优选中，切削液的选择与切削参数的关系包括下列哪些？", "a": ["使用润滑性能好的切削液，可适当减小进给量以提高表面质量", "切削液类型不影响切削参数选择", "使用冷却性能好的切削液，可适当提高切削速度", "使用切削液后，可无限制提高切削参数", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173358", "t": 2, "q": "智能制造系统切削参数智能优选中，设备约束包括下列哪些具体指标？", "a": ["设备的最大切削功率", "设备的最大进给速度", "设备的最大主轴转速", "零件的表面粗糙度要求", "", ""], "r": "ABC", "e": "设备约束指的是设备自身性能限制。A最大切削功率、B最大进给速度、C最大主轴转速都是设备自身的性能指标。而D零件的表面粗糙度要求是零件加工的质量要求，并非设备约束指标。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173359", "t": 2, "q": "智能制造系统切削参数智能优选中，需考虑的约束条件包括下列哪些？", "a": ["成本约束（如单位时间加工成本）", "刀具约束（如刀具寿命、最大切削温度）", "加工质量约束（如表面粗糙度、尺寸精度）", "设备约束（如最大转速、最大切削力）", "", ""], "r": "ABCD", "e": "智能制造系统切削参数智能优选要综合多方面因素，成本、刀具状态、加工质量和设备性能都会影响切削参数选择，这些方面的约束都需考虑。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173360", "t": 2, "q": "智能制造系统切削参数智能优选中，遗传算法的核心操作包括下列哪些？", "a": ["选择（保留适应度高的个体）", "聚类（将相似个体归为一类）", "变异（随机改变个体部分基因）", "交叉（父代个体基因交换产生子代）", "", ""], "r": "ACD", "e": "遗传算法核心操作有选择、交叉和变异。选择是保留适应度高的个体，交叉是父代个体基因交换产生子代，变异是随机改变个体部分基因。而聚类不是遗传算法核心操作。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810660684173361", "t": 2, "q": "智能制造系统切削参数智能优选中，影响切削力的主要因素包括下列哪些？", "a": ["背吃刀量", "进给量", "工件材料的硬度", "切削速度", "", ""], "r": "ABCD", "e": "背吃刀量、进给量、工件材料硬度、切削速度都会对切削力产生影响。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921492992", "t": 3, "q": "智能工艺规划中，工艺参数的选择仅需考虑零件的加工精度要求，无需考虑设备的加工能力和刀具的性能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智能工艺规划里，工艺参数选择要综合考虑多方面因素，零件加工精度要求、设备加工能力和刀具性能都至关重要，不能只考虑加工精度要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921492993", "t": 3, "q": "智能工艺规划中，工艺路线优化的主要目标是增加零件的加工工序数量，以提高产品的加工精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工艺路线优化目标通常是减少加工工序数量、降低成本、提高效率等，而不是增加工序数量来提高精度。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921492994", "t": 3, "q": "智能工艺规划中，基于规则的工艺规划（RULE-Based CAPP）系统的规则库一旦建立，无需后续更新即可适应所有零件的工艺设计。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实际生产中零件类型、工艺要求等不断变化，规则库不可能涵盖所有情况，需不断更新以适应新的零件工艺设计。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921492995", "t": 3, "q": "智能工艺规划中，基于规则的工艺规划系统的规则库构建难度大，主要原因是工艺知识的提取和形式化表示困难。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在智能工艺规划里，基于规则的工艺规划系统依靠规则库运行，而工艺知识具有复杂性和多样性，将其准确提取并转化为规则库所需的形式化表示确实很困难，这导致规则库构建难度大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921492996", "t": 3, "q": "智能工艺规划中，基于实例的工艺规划（CBR-CAPP）在遇到与历史实例差异较大的新零件时，仍能快速生成最优工艺方案。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基于实例的工艺规划（CBR - CAPP）主要是依靠历史实例来生成工艺方案，当遇到与历史实例差异较大的新零件时，难以快速找到匹配的实例，也就无法快速生成最优工艺方案。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921492997", "t": 3, "q": "智能工艺规划中，计算机辅助工艺规划（CAPP）系统生成的工艺方案无需人工审核，可直接用于生产加工。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "CAPP系统虽能生成工艺方案，但受算法、数据等限制，生成的方案可能存在不足或不符合实际生产情况，所以必须人工审核。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921492998", "t": 3, "q": "智能运维与健康管理分析中，多源信息融合技术通过结合振动、温度、电流等多类型数据，能够提高设备故障诊断的准确性，避免单一数据的局限性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多源信息融合技术整合多种类型数据，可综合各数据特点，弥补单一数据的不足，从而提升设备故障诊断准确性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921492999", "t": 3, "q": "智能运维与健康管理分析中，故障模式与影响分析（FMEA）通过计算风险优先数（RPN），能够确定各故障模式的风险等级，优先处理高RPN的故障。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "FMEA 确实会计算风险优先数（RPN），RPN 是严重度、发生频度和检测难度的乘积，可据此确定故障模式风险等级，通常优先处理高 RPN 的故障。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493000", "t": 3, "q": "智能运维与健康管理分析中，故障树分析（FTA）以底事件（如零件失效）为分析目标，通过逻辑关系追溯导致顶事件（如设备停机）的原因。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "故障树分析（FTA）是以顶事件（如设备停机）为分析目标，通过逻辑关系追溯导致顶事件发生的底事件（如零件失效）等原因，题干说法逻辑错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493001", "t": 3, "q": "智能运维与健康管理分析中，设备的健康指数（HI）是一个综合指标，通过融合多源数据（如振动、温度）计算得到，可直观反映设备的健康状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "智能运维与健康管理里，设备健康指数确实是综合指标，会融合振动、温度等多源数据来计算，能直观体现设备健康状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493002", "t": 3, "q": "智能运维与健康管理分析中，设备的剩余使用寿命（RUL）预测结果是一个确定的数值，不会存在误差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设备运行受多种复杂因素影响，如工况、环境等，具有不确定性，所以 RUL 预测很难得出确定无误差的数值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493003", "t": 3, "q": "智能运维与健康管理分析中，油液分析中的金属磨屑浓度越高，说明设备的磨损程度越严重，故障风险越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "油液中的金属磨屑是设备零部件磨损产生的，金属磨屑浓度高意味着设备磨损量大，磨损程度严重，进而故障风险也会随之升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493004", "t": 3, "q": "智能运维与健康管理分析中，预测性维护通过固定的时间周期对设备进行维护，无需考虑设备实际的健康状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "预测性维护是基于设备实际健康状态，利用数据分析等技术预测设备故障，而非按固定时间周期维护。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493005", "t": 3, "q": "智能运维与健康管理分析中，在线监测系统需要人工定期采集设备数据，而离线监测系统能够自动实时采集数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在线监测系统能自动实时采集数据，离线监测系统需人工定期采集设备数据，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493006", "t": 3, "q": "智能运维与健康管理分析中，振动信号的峰值指标对冲击性故障（如轴承剥落）敏感，而均方根值对平稳性故障（如磨损）敏感。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在智能运维与健康管理分析里，振动信号峰值指标能很好反映冲击特征，对冲击性故障像轴承剥落敏感；均方根值反映信号能量，对平稳性故障如磨损较敏感。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493007", "t": 3, "q": "智能运维与健康管理分析中，振动信号的功率谱密度分析能够反映信号在不同频率成分的能量分布，有助于识别设备的故障频率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "功率谱密度分析可展示信号在不同频率成分上的能量分布情况，通过该分析能找到设备故障对应的特征频率，以此识别故障频率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493008", "t": 3, "q": "智能运维与健康管理分析中，振动信号的时域分析（如峰值、均方根值）能够识别设备故障的类型（如不平衡、不对中），而频域分析仅能判断是否存在故障。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "时域分析主要用于描述信号的幅值、时间等基本特征，一般难以直接识别设备故障类型；频域分析可通过频谱特征识别故障类型、判断是否存在故障等。所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493009", "t": 3, "q": "智能制造车间及调度中，“瓶颈漂移”是指瓶颈设备的位置随生产订单、设备状态等因素变化而动态改变的现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在智能制造车间及调度里，“瓶颈漂移”确实是指瓶颈设备位置会因生产订单、设备状态等因素动态改变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493010", "t": 3, "q": "智能制造车间及调度中，调度规则中的\"最早交货期（EDD）\"规则优先安排交货期最早的订单，能够最大限度地满足订单的交货期要求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最早交货期（EDD）规则核心就是优先处理交货期早的订单，这样可使更多订单按时交付，能最大程度满足交货期要求。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493011", "t": 3, "q": "智能制造车间及调度中，动态调度的求解复杂度高于静态调度，因为动态调度需要实时处理干扰事件，重新优化方案。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "动态调度要在生产过程中实时应对干扰事件并重新优化方案，相比静态调度在固定条件下提前规划，求解复杂度更高。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493012", "t": 3, "q": "智能制造车间及调度中，动态调度能够根据车间实时干扰（如设备故障、紧急订单）调整调度方案，而静态调度生成方案后无法调整。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "动态调度的特点就是能依据车间实时干扰情况对调度方案进行调整，静态调度是在初始条件下生成方案，之后通常不做调整。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493013", "t": 3, "q": "智能制造车间及调度中，拉动式调度以客户需求或后工序需求为触发点，拉动前工序生产，能够有效减少在制品库存。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "拉动式调度模式就是依据客户需求或后工序需求来驱动前工序生产，这样能按需生产，避免过度生产，进而有效减少在制品库存。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493014", "t": 3, "q": "智能制造车间及调度中，瓶颈设备是指车间内加工效率最高、利用率最低的设备，其产能决定了整个车间的产能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "瓶颈设备是加工效率低、利用率高的设备，它限制了整个车间的产能，并非加工效率最高、利用率最低。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493015", "t": 3, "q": "智能制造车间及调度中，生产计划的制定无需考虑车间的实际产能，只需根据市场需求确定生产数量即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "生产计划制定必须考虑车间实际产能，若不考虑，可能因产能不足无法完成计划或产能过剩造成资源浪费，仅依据市场需求确定生产数量是不合理的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493016", "t": 3, "q": "智能制造车间及调度中，生产提前期是指相邻两件产品从开始加工到完成加工的时间间隔，反映了车间的生产节奏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。生产提前期是指产品（零件）在各工艺阶段投入或产出的时间与成品出产时间相比所要提前的时间。而相邻两件产品从开始加工到完成加工的时间间隔是生产节拍，它反映车间生产节奏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493017", "t": 3, "q": "智能制造车间及调度中，生产周期（Makespan）是指从车间接收生产任务开始，到最后一件产品加工完成所经历的总时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "生产周期（Makespan）的定义就是从车间接收生产任务开始，到最后一件产品加工完成所经历的总时间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493018", "t": 3, "q": "智能制造车间及调度中，推动式调度根据生产计划将任务推给前工序，前工序完成后再推给后工序，易导致在制品库存堆积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "推动式调度是按生产计划把任务推给前工序，前工序完成后推向后工序，这种方式未考虑后工序实际需求，易造成在制品库存堆积。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493019", "t": 3, "q": "智能制造车间及调度中，在制品库存过高会增加存储成本、延长生产周期，但不会影响产品的交货期。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在制品库存过高不仅会增加存储成本、延长生产周期，还可能因库存管理等问题导致生产节奏混乱，进而影响产品交货期。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493020", "t": 3, "q": "智能制造工程典型应用中，服务型制造不关注产品的生产环节，仅专注于为客户提供售后服务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "服务型制造不仅关注售后服务，也重视产品生产环节，它是制造业与服务业深度融合的模式，贯穿产品全生命周期。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493021", "t": 3, "q": "智能制造工程典型应用中，服务型制造的核心是从\"卖产品\"向\"卖产品+服务\"转变，提供产品全生命周期的增值服务。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "服务型制造就是将制造业从单纯提供产品转变为提供产品和服务相结合，注重产品全生命周期的增值服务，符合其核心特征。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493022", "t": 3, "q": "智能制造工程典型应用中，工业4.0的核心是实现生产过程的智能化、网络化和个性化，与传统工业的大规模批量生产模式不同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工业4.0强调通过信息物理系统等实现生产过程智能化、网络化，能根据客户需求进行个性化定制，区别于传统大规模批量生产模式。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493023", "t": 3, "q": "智能制造工程典型应用中，工业互联网平台的边缘层主要负责数据的长期存储与大规模计算，平台层负责数据的实时采集与预处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工业互联网平台边缘层负责数据的实时采集与预处理，平台层负责数据的长期存储与大规模计算，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493024", "t": 3, "q": "智能制造工程典型应用中，工业APP是基于工业互联网平台开发的轻量化应用，可实现设备运维、生产管理等特定工业场景的功能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工业APP的确是基于工业互联网平台开发的轻量化应用，能满足设备运维、生产管理等特定工业场景功能需求。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493025", "t": 3, "q": "智能制造工程典型应用中，绿色制造在智能制造中的体现包括通过智能调度减少设备空转能耗、通过数字孪生减少物理材料消耗等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "智能调度减少设备空转能耗可降低能源浪费，数字孪生利用虚拟模型优化设计和生产，减少物理材料消耗，二者都属于绿色制造在智能制造中的体现。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493026", "t": 3, "q": "智能制造工程典型应用中，数字孪生的虚实映射精度越高，对设备状态的监控与预测越准确，因此应追求极致的映射精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然高精度虚实映射利于设备监控与预测，但追求极致精度会带来成本大幅增加、效率降低等问题，需综合考虑实际情况，并非精度越高越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493027", "t": 3, "q": "智能制造工程典型应用中，数字孪生技术不仅能构建物理设备的三维模型，还能通过实时数据交互实现设备状态的动态监控与预测。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数字孪生技术可创建物理实体的虚拟模型，能构建物理设备三维模型，且能借助实时数据交互对设备状态进行动态监控与预测，在智能制造工程典型应用中有此作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493028", "t": 3, "q": "智能制造工程典型应用中，数字孪生技术在设备运维中的应用包括虚拟维修演练，通过模拟维修过程，提高实际维修的效率和安全性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数字孪生技术可创建与物理设备对应的虚拟模型，在设备运维里进行虚拟维修演练，模拟维修过程能让维修人员提前熟悉流程、规避风险，从而提高实际维修效率与安全性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493029", "t": 3, "q": "智能制造工程典型应用中，数字孪生与数字模型的本质区别在于数字孪生具有实时数据交互能力，而数字模型是静态的仿真模型。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数字孪生能通过传感器等获取物理实体实时数据并交互，可反映物理实体动态变化；数字模型通常是对物理对象在特定时刻的静态描述。所以题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493030", "t": 3, "q": "智能制造工程典型应用中，虚拟制造技术能够完全替代物理制造过程，无需生产实物即可完成产品的研发与验证。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虚拟制造技术虽能模拟产品设计、制造等过程辅助研发与验证，但无法完全替代物理制造过程，很多实际问题需通过生产实物来发现和解决。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493031", "t": 3, "q": "智能制造系统切削参数智能优选中，背吃刀量主要影响加工效率，对加工质量（如表面粗糙度）无影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "背吃刀量不仅影响加工效率，也会对加工质量如表面粗糙度产生影响，较大背吃刀量可能使表面粗糙度增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493032", "t": 3, "q": "智能制造系统切削参数智能优选中，表面粗糙度主要受进给量影响，进给量越小，表面粗糙度值越小，加工质量越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在智能制造系统切削参数智能优选里，进给量对表面粗糙度影响大，通常进给量越小，刀具在工件表面留下的切削痕迹越浅，表面粗糙度值越小，加工质量也就越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493033", "t": 3, "q": "智能制造系统切削参数智能优选中，当采用遗传算法进行优化时，种群规模越大，优化结果越优，因此种群规模应尽可能大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "种群规模过大虽能增加搜索范围，但会使计算量和时间成本大幅增加，还可能导致收敛速度变慢，并非越大越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493034", "t": 3, "q": "智能制造系统切削参数智能优选中，当加工材料为钛合金（导热系数低）时，应采用高切削速度、大进给量的参数组合以提高加工效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "钛合金导热系数低，高切削速度和大进给量会使切削温度急剧升高，导致刀具磨损加剧、加工质量下降，所以不应采用这种参数组合。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493035", "t": 3, "q": "智能制造系统切削参数智能优选中，当加工要求同时满足高效率、高质量和低成本时，应采用单目标优化算法，依次优化每个目标。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "当加工要求同时满足高效率、高质量和低成本，这是多目标情况，应采用多目标优化算法，而非单目标优化算法依次优化每个目标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493036", "t": 3, "q": "智能制造系统切削参数智能优选中，当以\"最小化单位时间加工成本\"为目标时，无需考虑设备的能耗成本，仅需关注刀具成本即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单位时间加工成本包含刀具成本、设备能耗成本等多方面，以“最小化单位时间加工成本”为目标时，设备能耗成本是必须考虑的因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493037", "t": 3, "q": "智能制造系统切削参数智能优选中，刀具寿命主要受切削温度影响，切削温度越高，刀具寿命越短。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在金属切削过程中，切削温度对刀具磨损影响显著，温度升高会加速刀具材料的磨损，如扩散磨损、氧化磨损等加剧，所以切削温度越高，刀具寿命越短。", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493038", "t": 3, "q": "智能制造系统切削参数智能优选中，切削功率主要受切削速度和背吃刀量影响，进给量对切削功率的影响较小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在智能制造系统切削参数智能优选里，切削速度、背吃刀量和进给量都会显著影响切削功率，并非进给量影响较小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493039", "t": 3, "q": "智能制造系统切削参数智能优选中，切削速度对表面粗糙度的影响是:切削速度越高，表面粗糙度值越小，加工质量越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在一定范围内，切削速度越高，表面粗糙度值越小，加工质量越好，但当切削速度过高时，可能会产生积屑瘤等问题，反而使表面粗糙度增大。所以该说法过于绝对。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493040", "t": 3, "q": "智能制造系统切削参数智能优选中，使用切削液能够降低切削温度、减少刀具磨损，因此无论何种加工场景，都应使用切削液。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然切削液有降低切削温度、减少刀具磨损等优点，但并非所有加工场景都适合使用，比如一些特殊材料加工、干式切削工艺等场景就不适合用切削液。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810661921493041", "t": 3, "q": "智能制造系统切削参数智能优选中，增大背吃刀量会显著增加切削力，但对切削温度的影响远小于切削速度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在切削过程中，增大背吃刀量会使切削力显著增大，而切削速度是影响切削温度的主要因素，背吃刀量对切削温度的影响远小于切削速度。", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = !!ans;
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
