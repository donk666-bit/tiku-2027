<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>华电-机械类</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <button class="btn" id="back" style="display:none">‹ 返回</button>
  <h1 id="hTitle">珞研刷题</h1>
  <button class="star" id="star" style="display:none">★</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const DATA = {"id": "yw2033827229384970241", "name": "华电-机械类", "chapters": [{"k": "基础练习题【含解析】||第1章 机械工程（1）", "n": "基础练习题【含解析】 / 第1章 机械工程（1）", "qs": [{"id": "2034810561727959040", "t": 1, "q": "机械工程中的互换性测量技术中，对于基孔制配合，下列说法正确的是（　）", "a": ["孔的基本偏差为上偏差，且基本偏差值为零", "孔的基本偏差为下偏差，且基本偏差值为零", "轴的基本偏差为下偏差，且基本偏差值为零", "轴的基本偏差为上偏差，且基本偏差值为零", "", ""], "r": "B", "e": "基孔制配合中孔是基准件，其基本偏差为下偏差，且下偏差值为零。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959041", "t": 1, "q": "机械产品开发流程中，\"产品定型\"阶段的输出是（　）", "a": ["样机", "全套生产图纸和工艺文件", "可行性分析报告", "设计任务书", "", ""], "r": "B", "e": "产品定型意味着产品设计基本完成，可进入生产阶段，此时需全套生产图纸和工艺文件指导生产。A样机是之前阶段成果；C可行性分析报告在项目前期；D设计任务书是开发起始文件。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959042", "t": 1, "q": "机械产品开发流程中，\"产品定义\"阶段的输出文件是（　）", "a": ["可行性分析报告", "设计任务书", "产品使用说明书", "产品样机", "", ""], "r": "B", "e": "产品定义阶段主要明确产品的各项要求和目标，输出设计任务书来指导后续设计。可行性分析报告是前期调研的成果；产品使用说明书是产品完成后提供给用户的；产品样机是设计制造后的实物。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959043", "t": 1, "q": "机械产品开发流程中，\"概念设计\"阶段的核心是（　）", "a": ["进行产品的样机试制", "确定产品的具体材料", "绘制产品的详细图纸", "产生多个产品方案并进行筛选", "", ""], "r": "D", "e": "概念设计是产品开发前期，主要目的是产生多种产品方案并筛选出合适的。A样机试制是后续阶段；B确定具体材料通常在设计细化时；C绘制详细图纸也是后续详细设计工作。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959044", "t": 1, "q": "机械产品开发流程中，\"可行性分析\"不包括的分析内容是（　）", "a": ["环境可行性", "产品美观性分析", "经济可行性", "技术可行性", "", ""], "r": "B", "e": "可行性分析主要考虑环境、经济、技术等方面是否可行，产品美观性分析侧重于产品外观设计等美学层面，不属于可行性分析范畴。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959045", "t": 1, "q": "机械产品开发流程中，\"可行性分析\"阶段的核心目的是（　）", "a": ["进行产品的样机装配", "判断产品开发项目是否具备技术、经济和市场可行性", "完成产品的详细图纸设计", "确定产品的具体结构尺寸", "", ""], "r": "B", "e": "可行性分析就是要判断项目在技术、经济、市场等方面是否可行，而不是进行样机装配、完成详细图纸设计或确定具体结构尺寸。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959046", "t": 1, "q": "机械产品开发流程中，“市场调研”阶段不包括的内容是（　）", "a": ["确定产品的具体结构参数", "分析用户对产品的需求和潜在需求", "研究市场竞争格局和发展趋势", "了解现有同类产品的性能和价格", "", ""], "r": "A", "e": "市场调研主要是了解市场和用户相关情况，为产品开发提供方向，而确定产品具体结构参数是后续设计阶段的工作。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959047", "t": 1, "q": "机械产品开发流程中，\"详细设计\"阶段不涉及的工作是（　）", "a": ["绘制零件的工作图纸", "确定零件的加工工艺", "进行零件的强度校核", "进行产品的市场推广策划", "", ""], "r": "D", "e": "详细设计主要围绕产品具体零部件展开，包括绘图、确定工艺、强度校核等。而产品市场推广策划是产品面向市场阶段的工作，不属于详细设计阶段。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959048", "t": 1, "q": "机械产品开发流程中，\"详细设计\"阶段的主要输出文件是（　）", "a": ["可行性分析报告", "产品三维模型和全套工作图纸", "样机试验报告", "设计任务书", "", ""], "r": "B", "e": "详细设计阶段需完成产品具体设计，要输出产品三维模型和全套工作图纸。可行性分析报告在前期，样机试验报告在样机试验后，设计任务书在项目开始阶段。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959049", "t": 1, "q": "机械产品开发流程中，\"详细设计\"完成后，需要进行的工作是（　）", "a": ["产品销售", "市场调研", "可行性分析", "样机试制", "", ""], "r": "D", "e": "机械产品开发一般先调研、可行性分析、详细设计，之后应制作样机来验证设计，而产品销售是开发完成后的环节。所以详细设计后是样机试制。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959050", "t": 1, "q": "机械产品开发流程中，\"样机试验\"的主要目的是（　）", "a": ["制定产品的销售价格", "确定产品的制造成本", "评估产品的市场接受度", "验证产品是否满足设计任务书的要求", "", ""], "r": "D", "e": "样机试验是在产品开发中对样机进行测试等，其核心是看产品是否达到设计任务书规定的各项要求。而制定销售价格、确定制造成本和评估市场接受度并非样机试验的主要目的。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959051", "t": 1, "q": "机械产品开发流程中，\"样机试制\"完成后，接下来的步骤是（　）", "a": ["可行性分析", "样机试验与改进", "产品批量生产", "详细设计", "", ""], "r": "B", "e": "机械产品开发流程是先可行性分析，再详细设计，接着样机试制，之后要对样机进行试验并改进，没问题了才批量生产。所以样机试制完成后接下来是样机试验与改进，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959052", "t": 1, "q": "机械传动设计中，带传动的传动比不准确的主要原因是（　）", "a": ["带的打滑", "带的老化", "带的弹性滑动", "带轮的磨损", "", ""], "r": "C", "e": "带传动中，由于带的弹性变形而产生的带与带轮间的相对滑动叫弹性滑动，这是导致传动比不准确的主要原因。而打滑是过载时的现象；带老化和带轮磨损对传动比准确性影响较小。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959053", "t": 1, "q": "机械传动设计中，带传动的张紧装置的主要作用是（　）", "a": ["减小带的磨损", "增大带的传动比", "保证带与带轮之间有足够的摩擦力，防止打滑", "提高带的疲劳寿命", "", ""], "r": "C", "e": "带传动工作一段时间后会松弛，张紧装置可使带保持一定张紧力，保证带与带轮间有足够摩擦力，防止打滑。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959054", "t": 1, "q": "机械传动设计中，当需要实现两轴交错且传动比大的传动时，优先选用的传动方式是（　）", "a": ["蜗杆传动", "带传动", "圆锥齿轮传动", "交错轴斜齿轮传动", "", ""], "r": "A", "e": "蜗杆传动可实现两轴交错，且能获得较大传动比。带传动传动比一般不大；圆锥齿轮传动多用于两轴相交；交错轴斜齿轮传动传动比也不如蜗杆传动大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959055", "t": 1, "q": "机械传动设计中，链传动的中心距过大的缺点是（　）", "a": ["链条磨损加快", "传动比不准确", "链条的松边垂度过大，易产生振动和跳齿", "链条易发生共振", "", ""], "r": "C", "e": "链传动中心距过大，链条松边垂度会过大，在运行时易产生振动和跳齿。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959056", "t": 1, "q": "机械传动设计中，链传动的主要失效形式不包括（　）", "a": ["链条铰链胶合", "链条疲劳断裂", "链轮齿面磨损", "带的打滑", "", ""], "r": "D", "e": "本题考查链传动的主要失效形式。链传动的失效主要发生在链条上，常见的失效形式有链条疲劳断裂、链条铰链胶合、链轮齿面磨损等。而带的打滑是带传动的失效形式，不是链传动的失效形式。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959057", "t": 1, "q": "机械传动设计中，蜗杆传动的传动比i12等于（　）（z1为蜗杆头数，z2为蜗轮齿数）", "a": ["z1/z2", "d2/d1（d1为蜗杆分度圆直径，d2为蜗轮分度圆直径）", "d1/d2", "z2/z1", "", ""], "r": "D", "e": "蜗杆传动传动比是蜗轮齿数与蜗杆头数之比。所以传动比 i12 = z2/z1，答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959058", "t": 1, "q": "机械传动设计中，蜗杆传动的效率主要取决于（　）", "a": ["蜗杆的材料", "蜗杆的头数和导程角", "蜗轮的材料", "蜗轮的齿数", "", ""], "r": "B", "e": "蜗杆传动效率与蜗杆头数和导程角密切相关，头数多、导程角大，效率高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959059", "t": 1, "q": "机械传动设计中，蜗杆传动的中心距a计算公式为（　）（d1为蜗杆分度圆直径，d2为蜗轮分度圆直径）", "a": ["a=(d1+d2)/2", "a=d1+d2", "a=d1-d2", "a=(d1-d2)/2", "", ""], "r": "A", "e": "蜗杆传动中心距是蜗杆和蜗轮分度圆直径之和的一半。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959060", "t": 1, "q": "机械传动设计中，蜗杆传动的主要缺点是（　）", "a": ["传动比小", "制造难度低", "效率低", "不能实现反向自锁", "", ""], "r": "C", "e": "蜗杆传动效率低、发热大，这是其主要缺点。传动比大是蜗杆传动特点，制造难度不低，能实现反向自锁。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959061", "t": 1, "q": "机械传动设计中，V带传动与平带传动相比，主要优点是（　）", "a": ["适应的中心距更小", "承载能力更大", "传动比更准确", "传动效率更高", "", ""], "r": "B", "e": "V带是梯形截面，与带轮槽接触面积大，摩擦力大，承载能力比平带大。A选项，V带和平带对中心距适应情况并非主要区别；C选项，带传动都有弹性滑动，传动比不准确；D选项，V带传动效率低于平带。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959062", "t": 1, "q": "机械工程测试原理及应用中，测试系统的\"动态特性\"主要包括（　）", "a": ["精度和误差", "固有频率、阻尼比和刚度", "线性度和灵敏度", "重复性和再现性", "", ""], "r": "B", "e": "测试系统动态特性与系统本身结构参数有关，固有频率、阻尼比和刚度是描述系统动态特性的关键参数。精度和误差、线性度和灵敏度、重复性和再现性更多与测试系统的静态特性相关。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959063", "t": 1, "q": "机械工程测试原理及应用中，测试系统的\"灵敏度\"是指（　）", "a": ["系统输出信号与输入信号的比值", "系统能检测到的最小输入信号", "系统对干扰信号的抑制能力", "系统输出随时间的变化率", "", ""], "r": "A", "e": "灵敏度定义为系统输出信号与输入信号的比值。B选项是分辨力；C选项是抗干扰能力；D选项与灵敏度概念无关。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959064", "t": 1, "q": "机械工程测试原理及应用中，测试系统的\"线性度\"是指（　）", "a": ["系统输出与输入之间的比例关系", "系统在相同输入下输出的一致性", "系统输出与理想线性输出之间的最大偏差", "系统对输入变化的响应速度", "", ""], "r": "C", "e": "线性度指测试系统输出与理想线性输出之间的最大偏差。A说的是比例关系并非线性度；B是重复性概念；D是响应速度概念。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959065", "t": 1, "q": "机械工程测试原理及应用中，霍尔传感器测量转速时，通常需要在旋转轴上安装（　）", "a": ["光栅", "磁钢", "反光片", "齿轮", "", ""], "r": "B", "e": "霍尔传感器基于磁电效应工作，测量转速时在旋转轴安装磁钢，轴转动使磁钢靠近或远离霍尔传感器，产生脉冲信号来测转速。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959066", "t": 1, "q": "机械工程测试原理及应用中，热电偶传感器测量温度的原理是基于（　）", "a": ["霍尔效应", "压电效应", "热电效应", "光电效应", "", ""], "r": "C", "e": "热电偶传感器利用热电效应，两种不同材料导体组成闭合回路，温度不同时产生热电势来测温度。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959067", "t": 1, "q": "机械工程测试原理及应用中，压电传感器不能测量静态信号的原因是（　）", "a": ["静态信号下传感器输出电压为零", "压电效应只在动态载荷下产生", "静态电荷会通过传感器本身的泄漏电阻泄漏", "静态信号下传感器灵敏度太低", "", ""], "r": "C", "e": "压电传感器依靠压电效应工作，在静态时产生的电荷会通过传感器本身的泄漏电阻泄漏掉，无法保持稳定输出，所以不能测量静态信号。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959068", "t": 1, "q": "机械工程测试原理及应用中，压电传感器测量力信号时，通常需要配接的后续电路是（　）", "a": ["功率放大器", "差动放大器", "电荷放大器", "电压放大器", "", ""], "r": "C", "e": "压电传感器输出的是电荷信号，电荷放大器能将高内阻的电荷源转换为低内阻的电压源，适合与压电传感器配接处理电荷信号。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959069", "t": 1, "q": "机械工程测试原理及应用中，用于测量构件振动位移的传感器，下列哪种属于惯性式传感器（　）", "a": ["电感式位移传感器", "压电式加速度传感器（配积分电路）", "电容式位移传感器", "光栅式位移传感器", "", ""], "r": "B", "e": "惯性式传感器是基于牛顿第二定律工作的。压电式加速度传感器配积分电路后可将加速度积分得到位移，是典型的惯性式传感器。而电感式、电容式、光栅式位移传感器都不是基于惯性原理。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959070", "t": 1, "q": "机械工程测试原理及应用中，用于测量流体压力的传感器，下列哪种属于弹性式传感器（　）", "a": ["应变式压力传感器", "电容式压力传感器", "压电式压力传感器", "波纹管式压力传感器", "", ""], "r": "D", "e": "弹性式传感器是利用弹性元件的弹性变形来测量压力。波纹管式压力传感器通过波纹管的弹性变形测量压力，属于弹性式传感器。而应变式、电容式、压电式压力传感器工作原理并非基于弹性元件弹性变形。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959071", "t": 1, "q": "机械工程测试原理及应用中，用于测量温度的热电偶，其热电势的大小取决于（　）", "a": ["测量环境的湿度", "热电偶的长度", "热电偶两端的温度差", "热电偶的直径", "", ""], "r": "C", "e": "热电偶是基于热电效应工作，热电势大小由热电偶两端温度差决定。湿度、长度、直径对热电势无影响。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959072", "t": 1, "q": "机械工程测试原理及应用中，用于测量旋转轴转速的传感器，下列哪种属于非接触式测量（　）", "a": ["电容式转速传感器", "应变式转速传感器", "磁电式转速传感器", "压电式转速传感器", "", ""], "r": "C", "e": "这道题目考察的是机械工程测试原理及应用中，用于测量旋转轴转速的传感器的分类，特别是区分接触式和非接触式测量。首先，我们来简要了解题目中的几种传感器类型：* 电容式转速传感器：通过测量电容的变化来确定转速，通常不需要与旋转轴直接接触。* 应变式转速传感器：依赖于测量物体表面的应变变化，通常需要与旋转轴接触。* 磁电式转速传感器：利用磁感应原理测量转速，一般也不需要与旋转轴直接接触。* 压电式转速传感器：基于压电效应测量，可能需要与旋转轴接触。接下来，我们分析题目中的关键要求：“非接触式测量”。这意味着传感器在测量过程中不需要与旋转轴发生物理接触。现在，我们根据上述知识点来分析选项：* A项（电容式转速传感器）和C项（磁电式转速传感器）均属于非接触式测量，因为它们可以在不与旋转轴直接接触的情况下工作。* B项（应变式转速传感器）和D项（压电式转速传感器）则更可能属于接触式测量，因为它们通常需要与旋转轴接触才能测量。然而，在这四个选项中，磁电式转速传感器是更为典型的非接触式测量传感器，它利用磁感应原理，通过安装在旋转轴附近的磁性传感器来检测旋转轴产生的磁场变化，从而测量转速，完全不需要与旋转轴接触。因此，结合题目要求和传感器的工作原理，可以确定正确答案为C项：磁电式转速传感器。所以，这道题的正确答案是C：磁电式转速传感器。", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959073", "t": 1, "q": "机械工程中的互换性测量技术中，\"包容要求\"的含义是（　）", "a": ["实际尺寸应在最大和最小极限尺寸之间", "实际要素应被其最小实体边界包容", "实际尺寸应等于基本尺寸", "实际要素应被其最大实体边界包容", "", ""], "r": "D", "e": "包容要求指实际要素应被其最大实体边界包容。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959074", "t": 1, "q": "机械工程中的互换性测量技术中，\"测量误差\"按性质分为（　）", "a": ["绝对误差、相对误差和引用误差", "器具误差、方法误差和人员误差", "尺寸误差、形状误差和位置误差", "系统误差、随机误差和粗大误差", "", ""], "r": "D", "e": "测量误差按性质分为系统误差、随机误差和粗大误差。A选项是误差表示形式；B选项是误差产生原因分类；C选项与测量误差按性质分类无关。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959075", "t": 1, "q": "机械工程中的互换性测量技术中，\"公差\"的定义是（　）", "a": ["最大极限尺寸与基本尺寸的差值", "允许尺寸的变动量", "实际尺寸与基本尺寸的差值", "最小极限尺寸与基本尺寸的差值", "", ""], "r": "B", "e": "公差是指允许尺寸的变动量。A选项是上偏差，C选项是尺寸偏差，D选项是下偏差。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959076", "t": 1, "q": "机械工程中的互换性测量技术中，\"公差等级\"越高，意味着（　）", "a": ["公差带位置越远离基本尺寸", "公差带位置越靠近基本尺寸", "公差值越大，精度越低", "公差值越小，精度越高", "", ""], "r": "D", "e": "公差等级越高，允许的尺寸变动范围即公差值越小，加工精度越高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959077", "t": 1, "q": "机械工程中的互换性测量技术中，\"几何公差\"不包括（　）", "a": ["尺寸公差", "位置公差", "方向公差", "形状公差", "", ""], "r": "A", "e": "几何公差包括形状公差、方向公差、位置公差和跳动公差，尺寸公差不属于几何公差。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959078", "t": 1, "q": "机械工程中的互换性测量技术中，“配合”是指（　）", "a": ["基本尺寸相同的、相互结合的孔和轴公差带之间的关系", "孔和轴的实际尺寸之间的关系", "孔和轴的基本尺寸之间的关系", "孔和轴的偏差之间的关系", "", ""], "r": "A", "e": "在机械工程互换性测量技术里，配合定义就是基本尺寸相同的、相互结合的孔和轴公差带之间的关系。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959079", "t": 1, "q": "机械工程中的互换性测量技术中，“形位公差标注”中，基准符号的三角形应指向（　）", "a": ["基准要素的轮廓线或其延长线", "基准要素的尺寸线", "零件的中心轴线", "零件的对称平面", "", ""], "r": "A", "e": "形位公差标注里，基准符号的三角形应指向基准要素的轮廓线或其延长线。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959080", "t": 1, "q": "机械工程中的互换性测量技术中，\"最大实体状态\"是指（　）", "a": ["零件的实际尺寸等于最小极限尺寸的状态", "零件具有最大体积的状态", "零件的实际尺寸等于最大极限尺寸的状态", "零件的几何误差为零的状态", "", ""], "r": "C", "e": "最大实体状态就是零件实际尺寸等于最大极限尺寸的状态。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959081", "t": 1, "q": "机械工程中的互换性测量技术中，尺寸公差带的两个基本要素是（　）", "a": ["公差等级和基本偏差", "最大实体尺寸和最小实体尺寸", "基本尺寸和实际尺寸", "上偏差和下偏差", "", ""], "r": "A", "e": "答案：A互换性测量技术中，尺寸公差带的两个基本要素是公差等级和基本偏差。公差等级决定了公差带的大小，而基本偏差则确定了公差带相对于零线的位置。这两个要素共同定义了尺寸的允许变动范围，是实现零件互换性的关键。因此，正确答案是A。", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959082", "t": 1, "q": "机械结构设计中，\"等强度设计\"的核心思想是（　）", "a": ["使构件各部分的强度都等于材料的许用强度", "使构件的强度大于材料的许用强度", "使构件的刚度满足使用要求", "使构件的重量最小", "", ""], "r": "A", "e": "等强度设计是让构件各部分的强度都等于材料的许用强度，充分发挥材料性能。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959083", "t": 1, "q": "机械结构设计中，\"模块化设计\"的主要优点是（　）", "a": ["降低产品的制造成本", "提高产品的整体刚度", "减少零件数量", "便于产品的系列化、标准化，缩短开发周期", "", ""], "r": "D", "e": "模块化设计可将产品分解成标准模块，便于进行系列化、标准化设计，能有效缩短开发周期。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959084", "t": 1, "q": "机械结构设计中，\"强度设计\"和\"刚度设计\"的区别是（　）", "a": ["强度设计针对动态载荷，刚度设计针对静态载荷", "强度设计保证构件不发生变形，刚度设计保证构件不发生断裂", "强度设计针对静态载荷，刚度设计针对动态载荷", "强度设计保证构件不发生断裂，刚度设计保证构件不发生过大变形", "", ""], "r": "D", "e": "强度是指构件抵抗破坏的能力，强度设计就是要保证构件不发生断裂；刚度是指构件抵抗变形的能力，刚度设计要保证构件不发生过大变形。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959085", "t": 1, "q": "机械结构设计中，\"轻量化设计\"的关键是在保证（　）的前提下，减少构件的重量。", "a": ["美观性", "装配方便性", "强度和刚度", "制造成本", "", ""], "r": "C", "e": "轻量化设计目的是减重，但要保证基本性能，强度和刚度是构件正常工作的基本要求。美观性、装配方便性、制造成本并非轻量化设计要保证的核心前提。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959086", "t": 1, "q": "机械结构设计中，\"冗余设计\"的目的是（　）", "a": ["提高结构的强度", "当某个零件失效时，备用零件或结构能继续工作，提高可靠性", "简化结构，便于制造", "减少零件数量，降低成本", "", ""], "r": "B", "e": "冗余设计是增加备用零件或结构，在某个零件失效时能让备用的继续工作，以此提高系统可靠性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959087", "t": 1, "q": "机械结构设计中，当构件承受横向载荷时，下列截面形状中抗弯曲能力最强的是（　）", "a": ["矩形截面（短边垂直于载荷方向）", "正方形截面", "工字形截面", "圆形截面", "", ""], "r": "C", "e": "工字形截面材料分布合理，在承受横向载荷时能有效抵抗弯曲，相比矩形、正方形、圆形截面，抗弯曲能力更强。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810561727959088", "t": 1, "q": "机械结构设计中，当设计承受轴向压力的细长杆时，主要需校核的是（　）", "a": ["强度", "耐磨性", "刚度", "稳定性", "", ""], "r": "D", "e": "承受轴向压力的细长杆，易出现失稳现象，所以主要需校核稳定性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955328", "t": 2, "q": "机械产品开发流程中，\"产品定型\"阶段需要完成的工作有（　）", "a": ["制定详细的制造工艺规程", "编制产品使用说明书", "重新进行样机试制", "编制全套生产用图纸", "", ""], "r": "ABD", "e": "产品定型阶段要为产品正式生产做准备，需编制全套生产用图纸、制定工艺规程、编写使用说明书等。重新进行样机试制一般不在此阶段。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955329", "t": 2, "q": "机械产品开发流程中，\"概念设计\"与\"详细设计\"的区别在于（　）", "a": ["概念设计面向功能，详细设计面向实现", "概念设计产生方案，详细设计确定具体结构", "概念设计周期短，详细设计周期长", "概念设计无需考虑工艺，详细设计需考虑工艺", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955330", "t": 2, "q": "机械产品开发流程中，\"可行性分析报告\"的主要内容包括（　）", "a": ["经济可行性分析", "产品的详细设计方案", "环境可行性分析", "市场需求分析", "", ""], "r": "ACD", "e": "可行性分析报告要考量多方面因素，经济方面看投入产出是否合理，环境方面关注对环境的影响，市场需求方面明确产品有无市场，而详细设计方案是后续阶段内容。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955331", "t": 2, "q": "机械产品开发流程中，\"详细设计\"阶段需要进行的验证工作包括（　）", "a": ["运动干涉检查", "零件强度校核", "制造成本估算验证", "结构刚度验证", "", ""], "r": "ABD", "e": "详细设计阶段要确保设计的机械结构在功能、性能等方面合理可行。运动干涉检查可保证机械运动顺畅，零件强度校核确保零件能承受工作载荷，结构刚度验证保证结构稳定性，这三项都属于此阶段需进行的验证工作。而制造成本估算验证更多在方案设计等阶段考虑成本时进行。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955332", "t": 2, "q": "机械产品开发流程中，\"样机改进\"阶段的主要工作内容有（　）", "a": ["修改零件的设计参数", "重新进行市场调研", "分析样机试验中发现的问题", "优化产品的结构", "", ""], "r": "ACD", "e": "样机改进是针对样机试验发现的问题，通过修改零件设计参数、优化产品结构等方式来完善产品。重新进行市场调研不属于此阶段主要工作。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955333", "t": 2, "q": "机械产品开发流程中，产品定义阶段的主要工作包括（　）", "a": ["明确产品的性能指标", "明确产品的功能指标", "明确产品的成本指标", "明确产品的外观颜色", "", ""], "r": "ABC", "e": "产品定义阶段要明确产品多方面关键指标，性能、功能、成本指标都是此阶段需明确的重要内容，外观颜色相对不是关键核心内容。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955334", "t": 2, "q": "机械产品开发流程中，概念设计阶段的工作内容包括（　）", "a": ["方案筛选与评价", "绘制零件工作图纸", "产生多个设计方案", "市场需求分析", "", ""], "r": "ACD", "e": "答案：ACD机械产品开发流程中，概念设计阶段主要关注产品的初步设想和设计方向。A 选项“方案筛选与评价”是在多个初步方案中挑选出较优方案的必要步骤。C 选项“产生多个设计方案”是概念设计阶段的重要工作，以供后续筛选。D 选项“市场需求分析”是概念设计前期开展的基础工作，决定产品设计的大方向。B 选项“绘制零件工作图纸”通常在后续更详细的工程设计阶段进行，不属于概念设计阶段的工作内容。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955335", "t": 2, "q": "机械产品开发流程中，可行性分析阶段需要从哪些方面进行分析（　）", "a": ["技术可行性", "外观可行性", "市场可行性", "经济可行性", "", ""], "r": "ACD", "e": "可行性分析主要从技术、市场、经济等方面判断项目是否可行，外观可行性并非可行性分析核心方面。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955336", "t": 2, "q": "机械产品开发流程中，市场调研阶段需要收集的信息包括（　）", "a": ["用户对产品功能的需求", "现有同类产品的技术参数", "产品的具体结构尺寸", "目标客户的购买力水平", "", ""], "r": "ABD", "e": "市场调研主要是了解市场和用户情况。A选项用户对产品功能的需求、B选项现有同类产品技术参数、D选项目标客户购买力水平，这些都是市场调研需收集的信息。而C选项产品具体结构尺寸是产品设计阶段确定的，不是市场调研阶段收集的。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955337", "t": 2, "q": "机械产品开发流程中，详细设计阶段的主要工作内容有（　）", "a": ["绘制零件的工作图纸", "进行零件的强度和刚度校核", "确定零件的加工工艺路线", "制作产品样机", "", ""], "r": "ABC", "e": "答案：ABC详细设计阶段主要涉及具体的设计工作，包括绘制零件图纸、进行强度和刚度校核以及确定加工工艺路线。而制作产品样机通常是在后续的试制阶段进行，不属于详细设计阶段的工作内容。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955338", "t": 2, "q": "机械产品开发流程中，样机试验阶段需要测试的内容包括（　）", "a": ["产品的制造成本", "产品的外观颜色", "产品的可靠性", "产品的性能指标", "", ""], "r": "CD", "e": "样机试验阶段主要是对产品实际表现进行检验，重点是产品的功能、性能及可靠性等。制造成本在设计阶段就会考量，外观颜色更多在设计环节确定。所以该阶段测试内容包括产品的可靠性和性能指标。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955339", "t": 2, "q": "机械传动设计中，齿轮传动的润滑方式选择需考虑的因素有（　）", "a": ["工作环境温度", "齿轮的转速", "齿轮的安装位置", "传递的功率", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955340", "t": 2, "q": "机械传动设计中，齿轮传动的优点包括（　）", "a": ["承载能力强", "传动比准确", "适用于两轴任意角度的传动", "传动效率高", "", ""], "r": "ABD", "e": "A 选项，齿轮传动接触强度高，承载能力强，表述正确。<br />B 选项，齿轮啮合传动，瞬时传动比恒定，传动比准确，表述正确。<br />C 选项，齿轮传动可用于平行轴、相交轴、交错轴，但并非适用于两轴任意角度传动，该表述错误。<br />D 选项，齿轮传动摩擦损失小，传动效率高，表述正确。<br />综上选 ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955341", "t": 2, "q": "机械传动设计中，带传动的失效形式包括（　）", "a": ["带的老化", "带的疲劳断裂", "带轮齿面磨损", "带的弹性滑动", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955342", "t": 2, "q": "机械传动设计中，带传动的选择需要考虑的参数有（　）", "a": ["主动轮和从动轮的转速", "传递的功率", "中心距", "工作环境温度", "", ""], "r": "ABCD", "e": "带传动选择要综合多方面因素。主动轮和从动轮转速影响带的线速度等；传递功率决定带的型号和数量；中心距影响带长和包角；工作环境温度影响带的材料性能。ABCD选项都是带传动选择需考虑的参数。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955343", "t": 2, "q": "机械传动设计中，带传动的张紧方式包括（　）", "a": ["采用弹性压轴张紧", "调整中心距张紧", "利用重物重锤张紧", "焊接固定张紧", "", ""], "r": "ABC", "e": "带传动张紧方式有调整中心距张紧和利用张紧装置张紧（如弹性压轴张紧、重物重锤张紧等）。焊接固定不能用于带传动张紧。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955344", "t": 2, "q": "机械传动设计中，链传动的特点包括（　）", "a": ["工作平稳，噪声小", "承载能力强", "易发生跳齿和脱链", "传动比准确", "", ""], "r": "BC", "e": "链传动工作时有冲击和振动，噪声较大，A错误；承载能力较强；链条磨损后易伸长，会发生跳齿和脱链现象；链传动的瞬时传动比不准确，平均传动比准确。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955345", "t": 2, "q": "机械传动设计中，链传动的主要参数包括（　）", "a": ["中心距", "链条的节距", "链轮的齿数", "链条的排数", "", ""], "r": "ABCD", "e": "链传动设计中，中心距、链条节距、链轮齿数、链条排数都是重要设计参数。答案选ABCD。 <br />每个选项都代表了链传动设计时需要考虑的关键因素，因此正确答案为A、B、C、D。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955346", "t": 2, "q": "机械传动设计中，蜗杆传动的失效形式主要包括（　）", "a": ["蜗杆弯曲变形", "齿面磨损", "轮齿折断", "齿面疲劳点蚀", "", ""], "r": "BCD", "e": "答案：BCD蜗杆传动的失效形式主要有齿面磨损、轮齿折断和齿面疲劳点蚀。蜗杆传动中，蜗杆一般不会发生弯曲变形，所以 A 选项错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955347", "t": 2, "q": "机械传动设计中，蜗杆传动的特点包括（　）", "a": ["适用于两轴交叉的传动", "传动效率相对较低", "可实现反向自锁", "工作平稳，噪声小", "", ""], "r": "ABCD", "e": "选项 A 蜗杆轴线与蜗轮轴线在空间呈 90° 交错，是蜗杆传动的典型几何特征，该项正确。<br />选项 B 蜗杆传动啮合时滑动速度大，摩擦损耗显著，普通蜗杆传动效率通常为 0.7～0.9，低于齿轮传动，该项正确。<br />选项 C 当导程角小于当量摩擦角时，蜗杆传动具备反向自锁能力，即只能蜗杆驱动蜗轮，蜗轮无法驱动蜗杆，该项正确。<br />选项 D 蜗杆齿呈连续螺旋线，啮合过程为多齿逐渐进入与退出，冲击振动小，具有工作平稳、噪声低的特点，该项正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955348", "t": 2, "q": "机械传动设计中，蜗杆传动的主要参数包括（　）", "a": ["导程角", "蜗杆头数", "蜗杆分度圆直径", "模数", "", ""], "r": "ABCD", "e": "A 选项，导程角是蜗杆重要参数，影响传动效率、自锁性能，表述正确。<br />B 选项，蜗杆头数影响传动比、滑动速度与加工难度，表述正确。<br />C 选项，蜗杆分度圆直径是基准参数，用于匹配蜗轮滚刀，属于主要参数，表述正确。<br />D 选项，模数是蜗杆蜗轮啮合的基本参数，保证齿形匹配，表述正确。<br />综上选 ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955349", "t": 2, "q": "机械传动设计中，蜗杆传动选择蜗杆头数时需要考虑的因素有（　）", "a": ["传动比要求", "传动效率要求", "蜗杆的材料", "蜗轮的齿数", "", ""], "r": "AB", "e": "选择蜗杆头数要综合传动比和传动效率等。传动比大时可选少头数，要提高传动效率则选多头数。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955350", "t": 2, "q": "机械工程测试原理及应用中，\"测试数据处理的内容\"包括（　）", "a": ["数据的标定和修正", "数据的滤波和降噪", "数据的执行控制", "数据的统计分析", "", ""], "r": "ABD", "e": "测试数据处理主要是对采集到的数据进行处理以获取有效信息，包括滤波降噪、统计分析、标定修正等。执行控制是控制系统的内容，并非数据处理内容。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955351", "t": 2, "q": "机械工程测试原理及应用中，\"测试系统的动态校准\"的目的包括（　）", "a": ["确定系统的固有频率", "确定系统的阻尼比", "验证系统的线性度", "确定系统的灵敏度", "", ""], "r": "ABD", "e": "测试系统动态校准，是获取系统动态特性参数，目的为确定固有频率、阻尼比、灵敏度等动态指标。线性度属于静态性能指标，一般通过静态校准得到，不属于动态校准目的。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955352", "t": 2, "q": "机械工程测试原理及应用中，\"传感器的选择原则\"包括（　）", "a": ["输出信号易于处理和传输", "测量范围覆盖被测物理量的变化范围", "频率响应适应被测信号的频率范围", "价格越高越好", "", ""], "r": "ABC", "e": "传感器选择要考虑输出处理传输便利性、测量范围匹配、频率响应适配，而不是价格越高越好。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955353", "t": 2, "q": "机械工程测试原理及应用中，\"霍尔传感器的应用场景\"包括（　）", "a": ["测量转速", "测量压力", "测量电流", "测量温度", "", ""], "r": "AC", "e": "霍尔传感器基于霍尔效应，可将磁信号转换为电信号。能用于测量转速（通过检测磁体变化）、电流（利用电流产生磁场）。而测量压力常用压阻式、压电式传感器；测量温度常用热电偶、热电阻等。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955354", "t": 2, "q": "机械工程测试原理及应用中，测试系统的静态特性指标包括（　）", "a": ["线性度", "重复性", "灵敏度", "迟滞", "", ""], "r": "ABCD", "e": "测试系统静态特性指标有线性度、重复性、灵敏度、迟滞等。ABCD四个选项均属于测试系统的静态特性指标。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955355", "t": 2, "q": "机械工程测试原理及应用中，测试系统的组成包括（　）", "a": ["信号调理电路", "执行机构", "数据采集装置", "数据处理与显示装置", "", ""], "r": "ACD", "e": "测试系统一般由传感器、信号调理电路、数据采集装置、数据处理与显示装置等组成。执行机构主要用于执行控制命令实现动作，不属于测试系统组成。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955356", "t": 2, "q": "机械工程测试原理及应用中，电容式传感器的优点包括（　）", "a": ["频率响应宽", "能测量多种物理量（位移、压力等）", "结构简单，体积小", "温度稳定性好", "", ""], "r": "ABC", "e": "电容式传感器具有以下特点：A. 频率响应宽：电容式传感器能够快速响应变化的信号，适用于高频信号的测量。B. 能测量多种物理量：通过不同的结构和设计，电容式传感器可以用来测量位移、压力、加速度等多种物理量。C. 结构简单，体积小：电容式传感器通常由两个平行的电极组成，结构相对简单，可以做到体积小巧。D. 温度稳定性好：这一点相对而言不是电容式传感器的主要优点。电容式传感器的性能可能会受到温度变化的影响，需要通过额外的温度补偿措施来提高温度稳定性。综上所述，电容式传感器的优点主要包括频率响应宽、能测量多种物理量和结构简单体积小。因此，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955357", "t": 2, "q": "机械工程测试原理及应用中，压电传感器的特点包括（　）", "a": ["频率响应宽", "灵敏度高", "体积小、重量轻", "能测量静态信号", "", ""], "r": "ABC", "e": "压电传感器具有频率响应宽、灵敏度高、体积小重量轻等优点，但它基于压电效应工作，不能测量静态信号。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955358", "t": 2, "q": "机械工程测试原理及应用中，压电传感器在使用时需要注意的事项有（　）", "a": ["需配接电荷放大器", "无需考虑安装方式", "防止传感器受潮", "避免承受过大的横向载荷", "", ""], "r": "ACD", "e": "压电传感器受潮会影响性能，需防止受潮；承受过大横向载荷会影响测量精度，要避免；通常需配接电荷放大器或电压放大器；安装方式对测量有影响，需考虑。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955359", "t": 2, "q": "机械工程测试原理及应用中，影响热电偶测量精度的因素有（　）", "a": ["测量环境的电磁干扰", "冷端温度的变化", "热电偶的直径", "测量介质的腐蚀性", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955360", "t": 2, "q": "机械工程中的互换性测量技术中，\"测量器具的选择原则\"包括（　）", "a": ["测量环境适应生产现场条件", "测量效率符合生产节奏", "测量精度满足被测对象的公差要求", "测量器具的价格越低越好", "", ""], "r": "ABC", "e": "选择测量器具要考虑多方面，测量精度需满足被测对象公差要求，不然无法准确测量；测量效率要符合生产节奏，否则会影响生产进度；测量环境也需适应生产现场条件，以保证测量准确性。而价格并非越低越好，要综合考虑精度等因素。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955361", "t": 2, "q": "机械工程中的互换性测量技术中，“测量误差的来源”包括（　）", "a": ["测量人员的误差", "测量方法的误差", "被测对象的特性变化导致的误差", "测量环境的影响导致的误差", "", ""], "r": "ABCD", "e": "测量误差来源多样，测量人员操作、测量方法的选择、被测对象特性变化以及测量环境等都会产生误差，ABCD选项均符合。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955362", "t": 2, "q": "机械工程中的互换性测量技术中，“公差与配合”的选择原则包括（　）", "a": ["根据使用要求确定配合类型（间隙、过盈、过渡）", "根据制造能力确定公差等级", "根据材料性能确定配合间隙", "根据零件的价格确定公差值", "", ""], "r": "AB", "e": "“公差与配合”选择要考虑使用和制造，按使用要求选配合类型，按制造能力选公差等级。材料性能不是确定配合间隙的主要依据，零件价格与公差值无关。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955363", "t": 2, "q": "机械工程中的互换性测量技术中，“几何公差的选择依据”包括（　）", "a": ["零件的功能要求", "零件的加工工艺", "集成电路的设计规范", "零件的装配要求", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955364", "t": 2, "q": "机械工程中的互换性测量技术中，\"形位公差的标注原则\"包括（　）", "a": ["公差值选择应满足零件的使用要求", "形位公差项目选择应根据零件的功能要求", "基准要素必须是零件的主要装配面", "当形位公差由尺寸公差控制时，可省略标注", "", ""], "r": "ABD", "e": "形位公差标注时，公差值要满足使用要求，项目选择依据零件功能要求，若形位公差由尺寸公差控制可省略标注；基准要素不一定是主要装配面。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955365", "t": 2, "q": "机械工程中的互换性测量技术中，\"最大实体要求\"的应用场景包括（　）", "a": ["严格控制零件的尺寸精度", "保证零件的强度", "保证零件的密封性", "允许零件有较大的形位误差，提高加工经济性", "", ""], "r": "ABC", "e": "“最大实体要求”（MMR）是公差原则中的一种，其核心思想是：当被测要素的实际尺寸偏离最大实体尺寸时，允许将尺寸公差补偿给形位公差，即实际尺寸偏离最大实体尺寸越多，允许的形位误差就越大。其主要应用场景是：在保证零件装配功能（可装配性）的前提下，允许零件有较大的形位误差，从而降低加工难度、提高加工经济性（D属于其应用场景）。而“严格控制零件的尺寸精度”（A）、“保证零件的强度”（B）和“保证零件的密封性”（C）均不是最大实体要求的主要应用场景——严格控制尺寸精度会限制尺寸公差的补偿作用，与MMR的初衷相悖；强度和密封性通常需要更严格的形位公差控制，也不依赖MMR来保证。因此，本题要求选出“不包括”的选项，正确答案为 A、B、C。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955366", "t": 2, "q": "机械工程中的互换性测量技术中，尺寸公差带的组成要素包括（　）", "a": ["公差等级", "极限尺寸", "基本偏差", "实际尺寸", "", ""], "r": "AC", "e": "这是一道关于机械工程中互换性测量技术的选择题。题目要求确定尺寸公差带的组成要素。首先，理解关键概念：* 尺寸公差带：在机械工程中，它是指允许尺寸的变动范围。* 组成要素：指的是构成这一变动范围的基本元素。接下来，分析各选项与尺寸公差带的关系：* A项（公差等级）：公差等级决定了公差带的大小，是确定公差带的重要参数之一。* B项（极限尺寸）：它定义了尺寸的上下限，直接构成公差带的边界。* C项（基本偏差）：基本偏差是公差带相对于零线（基本尺寸线）的位置，也是确定公差带位置的关键要素。* D项（实际尺寸）：这是零件的实际测量尺寸，不属于公差带的组成要素，而是用于与公差带比较以判断零件是否合格。综上所述，尺寸公差带的组成要素包括公差等级、极限尺寸和基本偏差，而不包括实际尺寸。因此，正确答案是AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955367", "t": 2, "q": "机械工程中的互换性测量技术中，几何公差包括（　）", "a": ["尺寸公差", "跳动公差", "形状公差", "位置公差", "", ""], "r": "BCD", "e": "几何公差是指零件的形状、方向、位置和跳动等几何要素的公差。跳动公差、形状公差、位置公差都属于几何公差范畴，而尺寸公差是对尺寸大小的允许变动量，不属于几何公差。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955368", "t": 2, "q": "机械工程中的互换性测量技术中，配合的类型包括（　）", "a": ["基孔制配合", "过盈配合", "间隙配合", "过渡配合", "", ""], "r": "BCD", "e": "配合类型按孔、轴公差带相对位置关系分过盈、间隙、过渡配合，基孔制是配合制度不是配合类型。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955369", "t": 2, "q": "机械工程中的互换性测量技术中，形状公差包括（　）", "a": ["平行度", "圆度", "圆柱度", "平面度", "", ""], "r": "BCD", "e": "形状公差是指单一实际要素的形状所允许的变动全量。圆度、圆柱度、平面度都属于形状公差，平行度是位置公差。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955370", "t": 2, "q": "机械结构设计中，\"防腐蚀设计\"的措施包括（　）", "a": ["表面涂覆防腐涂层", "采用密封结构防止腐蚀介质侵入", "选用耐腐蚀材料", "增加构件的截面尺寸以提高强度", "", ""], "r": "ABC", "e": "防腐蚀设计主要围绕防止材料被腐蚀，ABC选项分别从表面防护、阻止介质侵入、选用抗腐蚀材料方面来防腐蚀；D选项增加截面尺寸提高强度与防腐蚀无关。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955371", "t": 2, "q": "机械结构设计中，\"结构优化设计\"的目标包括（　）", "a": ["减轻构件重量", "提高构件的强度和刚度", "降低制造成本", "提高构件的表面粗糙度", "", ""], "r": "ABC", "e": "结构优化设计旨在让结构性能更优、成本更低等。减轻重量、提高强度和刚度、降低制造成本都是优化设计目标。而提高表面粗糙度会影响构件质量和性能，不是优化目标。答案是ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955372", "t": 2, "q": "机械结构设计中，\"强度设计\"的计算方法包括（　）", "a": ["极限应力法", "许用应力法", "经验公式法", "有限元法", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955373", "t": 2, "q": "机械结构设计中，\"人机工程设计\"的考虑因素包括（　）", "a": ["视觉显示的清晰度", "操作空间的合理性", "设备的噪声控制", "操作界面的便捷性", "", ""], "r": "ABD", "e": "人机工程设计旨在使机器适合人的使用，视觉显示清晰、操作空间合理、操作界面便捷都直接关乎人使用机器的体验，而设备噪声控制主要是从环境和健康角度，并非人机工程设计核心考虑的人使用机器的直接因素。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955374", "t": 2, "q": "机械结构设计中，\"振动控制设计\"的方法包括（　）", "a": ["增加构件的阻尼", "增大构件的质量", "调整构件的固有频率", "减小激励源的振动幅值", "", ""], "r": "ACD", "e": "振动控制可通过增加阻尼耗散能量、调整固有频率避免共振、减小激励源幅值来降低振动。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955375", "t": 2, "q": "机械结构设计中，等强度设计的实现方法有（　）", "a": ["根据弯矩变化调整构件的截面尺寸", "选用强度更高的材料", "使构件各截面的应力均等于许用应力", "在应力集中处采用加强筋", "", ""], "r": "ACD", "e": "这是一道关于机械结构设计中等强度设计实现方法的选择题。等强度设计的核心思想是在满足结构功能的前提下，使结构各部分的强度分布均匀，避免局部过载。接下来，我们逐一分析选项：A. 根据弯矩变化调整构件的截面尺寸 - 这是一种有效的等强度设计方法。通过调整截面尺寸，可以确保在不同弯矩作用下，构件的应力分布更加均匀，避免局部应力过高。B. 选用强度更高的材料 - 虽然提高材料强度可以提高结构的承载能力，但并不直接实现等强度设计。等强度设计关注的是应力分布的均匀性，而非单纯提高材料强度。C. 使构件各截面的应力均等于许用应力 - 这正是等强度设计的核心目标。通过合理设计，确保结构在各截面上的应力均不超过许用值，从而实现等强度。D. 在应力集中处采用加强筋 - 这是一种常见的结构加强手段，可以有效提高结构的局部承载能力，减少应力集中。然而，它并不直接等同于等强度设计，而是改善特定区域的应力状况。综上所述，A、C选项直接体现了等强度设计的核心思想和实现方法，而D选项虽然与结构强度相关，但也属于等强度设计中可能采取的一种措施。B选项与等强度设计的直接目标不符。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810563497955376", "t": 2, "q": "机械结构设计中，抗振设计的措施包括（　）", "a": ["增加构件的阻尼", "采用隔振装置", "减小构件的刚度", "增加构件的质量", "", ""], "r": "AB", "e": "抗振设计可通过增加阻尼消耗振动能量、用隔振装置隔离振动源。减小构件刚度会使振动更易发生；增加构件质量不一定能有效抗振，还可能带来其他问题。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583232", "t": 3, "q": "机械产品开发流程中，产品定型后，无需再进行设计改进，可直接批量生产。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "产品定型后也可能因实际生产、市场反馈等发现问题，仍需进行设计改进以提升产品质量和性能等，不能直接批量生产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583233", "t": 3, "q": "机械产品开发流程中，产品定型阶段的输出文件包括全套生产图纸和工艺规程，可直接用于批量生产。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "产品定型阶段确定产品最终技术状态，输出全套生产图纸和工艺规程等，能为批量生产提供依据，可直接用于批量生产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583234", "t": 3, "q": "机械产品开发流程中，概念设计阶段无需考虑产品的制造成本，成本控制在详细设计阶段进行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在机械产品开发流程里，概念设计阶段就需要对产品制造成本进行初步考量，成本控制贯穿于整个开发过程，并非只在详细设计阶段进行。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583235", "t": 3, "q": "机械产品开发流程中，概念设计阶段需产生多个设计方案，并通过评价筛选出最优方案。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械产品开发流程的概念设计阶段，就是要构思多个设计方案，再经过评价选出最优方案，这是该阶段的典型工作内容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583236", "t": 3, "q": "机械产品开发流程中，可行性分析报告经审批通过后，才能进入概念设计阶段。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械产品开发流程里，可行性分析是前期重要环节，只有其报告审批通过，表明项目具备实施条件，才适宜进入后续概念设计阶段。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583237", "t": 3, "q": "机械产品开发流程中，可行性分析阶段应在市场调研阶段之后进行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械产品开发流程里，通常先进行市场调研，了解市场需求、竞争状况等信息，之后根据这些调研结果开展可行性分析，判断项目是否可行。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583238", "t": 3, "q": "机械产品开发流程中，市场调研的核心目的是了解竞争对手的盈利情况。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "市场调研核心目的是全面了解市场需求、客户偏好、行业趋势等，并非只是了解竞争对手盈利情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583239", "t": 3, "q": "机械产品开发流程中，市场调研阶段无需收集用户对产品价格的期望，价格由企业自主确定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "市场调研需全面了解用户需求，其中就包括用户对产品价格的期望，企业定价不能脱离市场和用户，要综合多方面因素，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583240", "t": 3, "q": "机械产品开发流程中，详细设计阶段的输出文件包括零件工作图和装配图。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械产品开发流程里，详细设计阶段要精确设计各个零部件，其输出文件就包含零件工作图和装配图等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583241", "t": 3, "q": "机械产品开发流程中，详细设计阶段需确定零件的加工工艺路线和工艺参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583242", "t": 3, "q": "机械产品开发流程中，样机试验的主要目的是验证产品的外观设计是否符合用户审美。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "样机试验主要是验证产品性能、功能、可靠性等是否满足设计要求，而非主要验证外观设计是否符合用户审美。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583243", "t": 3, "q": "机械传动设计中，带传动的传动效率随带速的增加而一直增加。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "带传动效率并非随带速增加一直增加，带速过高会使离心力增大等，导致效率下降。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583244", "t": 3, "q": "机械传动设计中，带传动的弹性滑动是由于带的弹性变形导致的，是不可避免的正常现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "带是弹性体，工作时紧边和松边拉力不同，弹性变形不同，会引起带与带轮间的相对滑动即弹性滑动，这是带传动固有特性，不可避免。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583245", "t": 3, "q": "机械传动设计中，带传动的张紧轮应安装在带的紧边，以增强张紧效果。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "张紧轮应安装在带的松边内侧且靠近大带轮处，若装在紧边无法有效调节带的张力，达不到良好张紧效果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583246", "t": 3, "q": "机械传动设计中，链传动的传动比不准确是由于链条的弹性变形导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "链传动传动比不准确是因为链条的多边形效应，而非链条弹性变形。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583247", "t": 3, "q": "机械传动设计中，链传动的链条节距越大，其承载能力越强，但传动平稳性越差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "链节距大则链元件尺寸大，承载能力强；但节距大，多边形效应显著，冲击振动大，传动平稳性差。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583248", "t": 3, "q": "机械传动设计中，链传动的中心距过大时，链条的松边垂度过大，易产生振动和跳齿现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "中心距过大，链条松边垂度过大，在运转时链条抖动加剧，易产生振动，且链条与链轮啮合不稳定，会出现跳齿现象。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583249", "t": 3, "q": "机械传动设计中，蜗杆传动的传动比等于蜗杆齿数与蜗轮齿数的比值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蜗杆传动的传动比是蜗轮齿数与蜗杆头数的比值，并非蜗杆齿数与蜗轮齿数的比值，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583250", "t": 3, "q": "机械传动设计中，蜗杆传动的效率主要取决于蜗杆的导程角，导程角越大，效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "蜗杆传动效率受多种因素影响，导程角是关键因素之一，导程角越大，效率越高。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583251", "t": 3, "q": "机械传动设计中，蜗杆传动的中心距计算公式为a=(d1+d2)/2，其中d1为蜗杆分度圆直径，d2为蜗轮分度圆直径。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "蜗杆传动的中心距计算公式 a=(d1+d2)/2，d1 是蜗杆分度圆直径，d2 是蜗轮分度圆直径，该公式正确。蜗杆传动中心距等于蜗杆、蜗轮分度圆直径之和的一半。题干表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583252", "t": 3, "q": "机械传动设计中，蜗杆传动的自锁条件是蜗杆的导程角小于或等于当量摩擦角。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在蜗杆传动里，当蜗杆导程角小于或等于当量摩擦角时，蜗杆能自锁，所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583253", "t": 3, "q": "机械传动设计中，V带传动与平带传动相比，因V带与带轮间的摩擦力更大，故承载能力更强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "V带的截面为梯形，在相同张紧力下，V带与带轮间的正压力更大，摩擦力也就更大，所以承载能力比平带更强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583254", "t": 3, "q": "机械工程测试原理及应用中，测试系统的动态特性越好，其对快速变化信号的响应能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "动态特性反映测试系统对随时间变化的输入量的响应特性，动态特性好意味着能更准确、快速地跟踪输入信号变化，所以对快速变化信号响应能力强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583255", "t": 3, "q": "机械工程测试原理及应用中，测试系统的灵敏度越高，其测量范围越宽。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般情况下，测试系统灵敏度和测量范围呈负相关，灵敏度高时测量范围往往较窄。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583256", "t": 3, "q": "机械工程测试原理及应用中，测试系统的线性度是指系统输出与输入之间的实际关系曲线与理想线性曲线的偏离程度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性度就是衡量测试系统输出与输入的实际关系曲线和理想线性曲线偏离情况的指标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583257", "t": 3, "q": "机械工程测试原理及应用中，电容式传感器的灵敏度与极板间的距离成反比，距离越小，灵敏度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电容式传感器灵敏度公式表明其灵敏度与极板间距离成反比，距离减小，灵敏度升高。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583258", "t": 3, "q": "机械工程测试原理及应用中，电容式传感器可用于测量位移、压力等物理量，但其温度稳定性较差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电容式传感器能测位移、压力等，不过它的电容量受温度影响，导致温度稳定性差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583259", "t": 3, "q": "机械工程测试原理及应用中，霍尔传感器测量转速时，需在旋转轴上安装反光片，通过检测反光信号计数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "霍尔传感器测量转速是基于磁电效应，在旋转轴上安装磁钢，通过检测磁场变化计数，并非安装反光片检测反光信号。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583260", "t": 3, "q": "机械工程测试原理及应用中，霍尔传感器的输出电压与外加磁场强度成正比，磁场越强，输出电压越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "霍尔传感器基于霍尔效应工作，其输出电压和外加磁场强度确实成正比，磁场越强输出电压越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583261", "t": 3, "q": "机械工程测试原理及应用中，热电偶传感器的热电势大小仅与组成热电偶的两种金属材料和两端温度差有关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据热电偶的基本原理，其热电势大小确实只由组成热电偶的两种金属材料以及两端温度差决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583262", "t": 3, "q": "机械工程测试原理及应用中，压电传感器的频率响应范围宽，适合测量高频动态信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压电传感器具有固有频率高的特点，所以频率响应范围宽，能很好地测量高频动态信号。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583263", "t": 3, "q": "机械工程测试原理及应用中，压电传感器的输出信号为电压信号，可直接接入数据采集系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压电传感器输出的是微弱的电荷信号，而非电压信号，且不能直接接入数据采集系统，需要先经电荷放大器或电压放大器等进行处理。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583264", "t": 3, "q": "机械工程测试原理及应用中，压电传感器由于存在电荷泄漏，不能用于测量静态信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压电传感器基于压电效应工作，其内部电荷会逐渐泄漏，静态信号产生的电荷在泄漏后难以稳定保持，所以不能用于测量静态信号。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583265", "t": 3, "q": "机械工程中的互换性测量技术中，包容要求适用于需要保证配合间隙或过盈的场合，如轴承与轴的配合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "包容要求是要求实际要素处处位于具有理想形状的包容面内的一种公差要求，主要用于保证孔、轴的配合性质，适用于需要保证配合间隙或过盈的场合，像轴承与轴的配合就常采用，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583266", "t": 3, "q": "机械工程中的互换性测量技术中，测量器具的精度越高，测量误差越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一般情况下，测量器具精度越高，其能达到的测量准确程度就越高，测量误差也就越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583267", "t": 3, "q": "机械工程中的互换性测量技术中，测量误差按性质可分为系统误差、随机误差和粗大误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械工程互换性测量技术里，测量误差按性质确实分为系统误差、随机误差和粗大误差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583268", "t": 3, "q": "机械工程中的互换性测量技术中，测量误差是指测量结果与被测对象真实值之间的差值，无法完全消除。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "测量误差的确是测量结果与被测对象真实值之间的差值，受测量方法、仪器精度、环境等多种因素限制，测量误差无法完全消除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583269", "t": 3, "q": "机械工程中的互换性测量技术中，公差等级越高（如IT01），对应的公差值越大，零件精度越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。在机械工程互换性测量技术里，公差等级越高（像 IT01），对应的公差值越小，零件精度越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583270", "t": 3, "q": "机械工程中的互换性测量技术中，基轴制配合的基准轴其基本偏差为上偏差，且数值为零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "基轴制基准轴代号 h，上偏差 es=0，下偏差 ei 为负值；基孔制基准孔 H 是下偏差 EI=0。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583271", "t": 3, "q": "机械工程中的互换性测量技术中，基准轴的上偏差为零，基准孔的下偏差为零，二者均为基准件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械工程互换性测量技术里，基准轴的基本偏差是上偏差，且上偏差为零；基准孔的基本偏差是下偏差，下偏差为零，它们都属于基准件。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583272", "t": 3, "q": "机械工程中的互换性测量技术中，位置公差包括平行度、垂直度和同轴度等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "位置公差包含定向公差（平行度、垂直度、倾斜度）、定位公差（同轴度、位置度、对称度）、跳动公差。平行度、垂直度、同轴度都属于位置公差大类，题干表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583273", "t": 3, "q": "机械工程中的互换性测量技术中，形状公差的公差值标注时，无需标注基准。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "形状公差是指单一实际要素的形状所允许的变动全量，其公差值标注时确实无需标注基准。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583274", "t": 3, "q": "机械工程中的互换性测量技术中，形状公差用于控制零件单一要素的形状误差，与其他要素无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "形状公差就是对单一要素形状误差的控制，不涉及与其他要素的关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583275", "t": 3, "q": "机械工程中的互换性测量技术中，最大实体状态是指零件的实际尺寸等于最大极限尺寸的状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "最大实体状态指孔或轴在尺寸公差范围内，具有材料量最多时的状态，对于轴是实际尺寸等于最大极限尺寸，对于孔是实际尺寸等于最小极限尺寸，题干表述不全面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583276", "t": 3, "q": "机械结构设计中，薄壁构件的稳定性计算主要考虑其在载荷作用下是否发生屈曲变形。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "薄壁构件在载荷作用下易发生屈曲变形，稳定性计算核心就是考量是否会出现这种情况。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583277", "t": 3, "q": "机械结构设计中，等强度设计的目的是使构件各部分的强度均大于材料的许用强度，以提高安全性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "等强度设计是使构件各部分的强度都接近材料的许用强度，而非都大于。若各部分强度都大于许用强度会造成材料浪费。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583278", "t": 3, "q": "机械结构设计中，工字形截面构件承受横向弯曲时，其抗弯曲能力比相同重量的矩形截面构件更强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工字形截面把材料更多地布置在远离中性轴的位置，能更有效地利用材料，在相同重量下，其惯性矩比矩形截面大，抗弯曲能力更强。", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583279", "t": 3, "q": "机械结构设计中，构件的刚度不足会导致其发生过大变形，影响产品的正常工作，但不会导致构件断裂。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "刚度不足使构件产生过大变形，严重时会因应力集中等情况导致构件断裂。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583280", "t": 3, "q": "机械结构设计中，构件的疲劳强度与构件的表面质量有关，表面粗糙度值越小，疲劳强度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "表面粗糙度值小意味着表面更光滑，能减少应力集中，降低裂纹产生可能性，从而提高构件疲劳强度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810564655583281", "t": 3, "q": "机械结构设计中，模块化设计可提高产品的通用性和标准化程度，便于产品系列化开发。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "模块化设计将产品分解成若干模块，各模块有标准接口，能提高通用性与标准化程度，利于产品系列化开发。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 机械工程（2）", "n": "基础练习题【含解析】 / 第1章 机械工程（2）", "qs": [{"id": "2034810567868420096", "t": 1, "q": "机械结构设计中，对于承受扭矩的轴类零件，最合理的截面形状是（　）", "a": ["矩形截面", "环形截面", "圆形截面", "工字形截面", "", ""], "r": "C", "e": "承受扭矩时，圆形截面能使应力分布均匀，材料利用率高，比矩形、环形、工字形更合理。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420097", "t": 1, "q": "机械结构设计中，对于受弯构件，若需减轻重量同时保证刚度，常采用的截面形状是（　）", "a": ["正方形截面", "工字形截面", "圆形截面", "矩形截面（长边垂直于弯矩作用面）", "", ""], "r": "B", "e": "工字形截面的材料分布能在减轻重量时有效提高截面惯性矩，保证刚度，常用于受弯构件。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420098", "t": 1, "q": "机械结构设计中，为了提高构件的抗振性能，下列措施中不合理的是（　）", "a": ["减小构件的质量", "增加构件的阻尼", "增加构件的刚度", "调整构件的固有频率，避开共振频率", "", ""], "r": "A", "e": "抗振性能可通过增加阻尼、刚度，调整固有频率避开共振来提高。减小构件质量可能会使构件更易振动，不利于抗振。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420099", "t": 1, "q": "机械零件设计中，齿轮传动的齿根弯曲疲劳强度计算，需要考虑的参数不包括（　）", "a": ["齿轮的齿数", "齿轮的材料密度", "齑轮的齿宽", "齿轮的模数", "", ""], "r": "B", "e": "齿根弯曲疲劳强度计算与齿轮的几何参数、受力等有关。齿数、齿宽、模数都对齿根弯曲强度有影响，而材料密度与齿根弯曲疲劳强度计算无关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420100", "t": 1, "q": "机械零件设计中，齿轮的齿面接触疲劳强度计算主要是为了防止齿轮发生（　）", "a": ["齿面疲劳点蚀", "齿面胶合", "轮齿折断", "齿面磨损", "", ""], "r": "A", "e": "齿面接触疲劳强度计算目的是防止齿面疲劳点蚀，胶合、折断和磨损不是接触疲劳强度计算主要防止的失效形式。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420101", "t": 1, "q": "机械零件设计中，齿轮的模数m越大，表明（　）", "a": ["齿轮的齿数越多", "齿轮的分度圆直径越小", "齿轮的齿厚越大，承载能力越强", "齿轮的齿距越小", "", ""], "r": "C", "e": "模数m是齿轮的重要参数，模数越大，齿厚越大，能承受的载荷就越强。齿数与模数无关；分度圆直径d = mz（z是齿数），m大d大；齿距p = πm，m大p大。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420102", "t": 1, "q": "机械零件设计中，当计算零件的疲劳强度时，需要考虑的关键系数不包括（　）", "a": ["应力集中系数", "尺寸系数", "弹性系数", "表面质量系数", "", ""], "r": "C", "e": "计算零件疲劳强度时，应力集中、尺寸大小、表面质量都会影响疲劳强度，所以要考虑应力集中系数、尺寸系数、表面质量系数；而弹性系数与疲劳强度计算无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420103", "t": 1, "q": "机械零件设计中，对于滑动轴承，当工作条件为高速、重载且有冲击载荷时，应选用的轴承材料是（　）", "a": ["巴氏合金", "铸铁", "陶瓷", "青铜", "", ""], "r": "A", "e": "高速、重载且有冲击载荷要求轴承材料减摩性、耐磨性好，有足够强度和韧性。巴氏合金具备良好的减摩性、耐磨性和抗胶合能力，能承受冲击载荷，适合该工况。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420104", "t": 1, "q": "机械零件设计中，滚动轴承的\"额定动载荷\"是指（　）", "a": ["轴承在基本额定寿命下能承受的恒定载荷", "轴承能承受的最大轴向载荷", "轴承能承受的最大径向载荷", "轴承能承受的最大静载荷", "", ""], "r": "A", "e": "滚动轴承的额定动载荷是指轴承在基本额定寿命下能承受的恒定载荷。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420105", "t": 1, "q": "机械零件设计中，滚动轴承的\"基本额定寿命\"是指（　）", "a": ["轴承在额定静载荷下的使用寿命", "轴承从安装到损坏的总工作时间", "轴承的最大允许工作时间", "轴承在额定动载荷下，90%的轴承不发生疲劳点蚀的寿命", "", ""], "r": "D", "e": "基本额定寿命是在额定动载荷作用下，90%的轴承不发生疲劳点蚀的寿命。A选项说的是额定静载荷，错误；B选项从安装到损坏总工作时间不是基本额定寿命定义；C选项最大允许工作时间也不符合定义。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420106", "t": 1, "q": "机械零件设计中，滚动轴承的寿命计算中，寿命指数ε的取值与轴承类型有关，对于球轴承，ε的取值为（　）", "a": ["3/10", "1/3", "3", "10/3", "", ""], "r": "C", "e": "在滚动轴承寿命计算里，球轴承寿命指数ε取值为3。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420107", "t": 1, "q": "机械零件设计中，滑动轴承的\"承载能力\"主要取决于（　）", "a": ["轴承的转速", "润滑油的粘度和供油状况", "轴承的直径", "轴承的材料密度", "", ""], "r": "B", "e": "滑动轴承承载能力与润滑油相关，合适的粘度和良好的供油状况能形成有效油膜承载负荷。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420108", "t": 1, "q": "机械零件设计中，螺栓连接采用防松装置的主要原因是（　）", "a": ["螺栓的成本太高", "螺栓在振动或变载荷下易发生松脱", "螺栓连接的强度不足", "螺栓的安装不方便", "", ""], "r": "B", "e": "螺栓在振动或变载荷作用下，预紧力会逐渐减小甚至松脱，所以要用防松装置。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420109", "t": 1, "q": "机械零件设计中，螺栓连接的强度计算主要是校核（　）", "a": ["螺母的挤压强度", "螺栓的弯曲强度", "螺栓杆的拉伸强度", "螺栓头与杆连接部位的剪切强度", "", ""], "r": "C", "e": "螺栓连接工作时，主要承受拉力，所以强度计算主要是校核螺栓杆的拉伸强度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420110", "t": 1, "q": "机械设计的基本要求中，\"安全性要求\"不包括（　）", "a": ["防止零件失效导致的安全事故", "保证操作人员的人身安全", "防止产品运行中产生有害物质泄漏", "提高产品的使用寿命", "", ""], "r": "D", "e": "安全性要求主要围绕避免安全事故、保障人员安全和防止有害物质泄漏等。而提高产品使用寿命是与产品耐久性相关，并非安全性要求。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420111", "t": 1, "q": "机械设计的基本要求中，\"环境适应性要求\"是指（　）", "a": ["产品的制造成本低", "产品的维护方便", "产品能在规定的温度、湿度、振动等环境下正常工作", "产品的外观美观", "", ""], "r": "C", "e": "环境适应性要求强调产品能在特定环境条件下正常工作。选项C符合这一概念，A说的是成本，B指维护，D是外观，均与环境适应性无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420112", "t": 1, "q": "机械设计的基本要求中，\"经济性要求\"在设计阶段主要体现在（　）", "a": ["不考虑制造成本，只保证使用性能", "选用最贵的材料以保证性能", "尽量简化结构，降低制造和维护成本", "追求最复杂的结构以提高性能", "", ""], "r": "C", "e": "经济性要求就是要考虑成本。A不考虑制造成本错误；B选用最贵材料会增加成本，不符合经济性；D追求最复杂结构也会提高成本。而C尽量简化结构能降低制造和维护成本，符合经济性要求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420113", "t": 1, "q": "机械设计的基本要求中，\"维护性要求\"是指（　）", "a": ["产品能适应不同的工作环境", "产品发生故障后，易于诊断、维修和更换零件", "产品在使用过程中不易发生故障", "产品的使用寿命长", "", ""], "r": "B", "e": "维护性强调产品故障后的处理，即易于诊断、维修和换零件。A说的是适应性；C指可靠性；D是寿命要求。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420114", "t": 1, "q": "机械设计的基本要求中，\"性能要求\"不包括（　）", "a": ["产品的承载能力", "产品的工作效率", "产品的工作精度", "产品的外观颜色", "", ""], "r": "D", "e": "性能要求通常涉及产品的功能、能力等技术方面。承载能力、工作效率、工作精度都属于产品性能相关内容，而外观颜色主要涉及产品的外观设计，不属于性能要求。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420115", "t": 1, "q": "机械设计一般程序中，\"编制设计任务书\"阶段不需要明确的内容是（　）", "a": ["产品的开发周期", "产品的制造成本预算", "产品的具体结构尺寸", "产品的功能和性能指标", "", ""], "r": "C", "e": "编制设计任务书是设计前期，主要明确产品目标、功能、成本、周期等宏观要求，具体结构尺寸要在后续设计中确定。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420116", "t": 1, "q": "机械设计一般程序中，\"初步设计\"阶段的主要输出是（　）", "a": ["零件工作图", "样机试验报告", "产品装配图", "产品方案草图和初步计算书", "", ""], "r": "D", "e": "初步设计是机械设计早期阶段，会形成产品方案草图并进行初步计算，输出产品方案草图和初步计算书。零件工作图是详细设计阶段输出；样机试验报告是试验阶段产物；产品装配图在后续详细设计等环节完善。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420117", "t": 1, "q": "机械设计一般程序中，\"工作图设计\"阶段的核心任务是（　）", "a": ["进行产品的性能计算和校核", "绘制零件图、装配图，并制定技术要求", "制作产品样机并进行试验", "确定产品的整体方案", "", ""], "r": "B", "e": "工作图设计主要就是要把产品的详细设计通过绘制零件图、装配图体现出来，并制定技术要求。A选项性能计算和校核多在设计前期；C选项制作样机试验是后续环节；D选项确定整体方案是更早阶段的任务。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567868420118", "t": 1, "q": "机械设计一般程序中，\"技术设计\"阶段的主要任务不包括（　）", "a": ["选择零件的材料和热处理方式", "绘制产品的整体方案草图", "进行零件的强度、刚度等性能计算", "确定零件的结构形状和尺寸", "", ""], "r": "B", "e": "技术设计要确定零件材料、计算性能、明确结构形状和尺寸等。绘制产品整体方案草图是方案设计阶段任务，不是技术设计阶段任务。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614400", "t": 1, "q": "机械设计一般程序中，\"样机试制与试验\"阶段的主要任务是（　）", "a": ["制定产品的生产工艺规程", "确定产品的设计方案", "绘制产品的工作图纸", "制造少量样机，并通过试验验证设计的正确性", "", ""], "r": "D", "e": "“样机试制与试验”就是制造少量样机，再通过试验来验证设计是否正确。A是工艺规程制定方面，B是设计方案确定，C是绘制图纸，都不符合该阶段主要任务。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614401", "t": 1, "q": "机械制造工艺过程中，\"粗加工\"的主要目的是（　）", "a": ["去除大部分加工余量，接近零件的最终形状和尺寸", "修正前道工序的误差", "获得高精度的表面质量", "提高零件的硬度", "", ""], "r": "A", "e": "粗加工主要就是大量去除材料，让零件接近最终形状和尺寸。修正误差、获高精度表面是精加工目的，加工不改变零件硬度。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614402", "t": 1, "q": "机械制造工艺过程中，\"工步\"是指（　）", "a": ["改变工件形状、尺寸或性能的加工步骤", "由多个工序组成的加工过程", "工件从装夹到卸下所完成的全部加工", "在同一台机床，对同一工件，用同一刀具，在同一切削用量下完成的那部分加工", "", ""], "r": "D", "e": "工步定义为在同一台机床，对同一工件，用同一刀具，在同一切削用量下完成的那部分加工。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614403", "t": 1, "q": "机械制造工艺过程中，\"工序\"的正确定义是（　）", "a": ["由多个工步组成的加工阶段", "工件从进入车间到离开车间所完成的全部加工过程", "在一个工作地对一个或一组工件连续完成的那部分工艺过程", "将原材料转变为成品的所有加工步骤总和", "", ""], "r": "C", "e": "工序是指在一个工作地对一个或一组工件连续完成的那部分工艺过程。A选项工步是工序的组成部分；B描述的不是工序概念；D说的是工艺过程。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614404", "t": 1, "q": "机械制造工艺过程中，\"工序集中\"的主要优点是（　）", "a": ["操作复杂，对工人技术要求高", "生产准备时间长", "设备数量多，占地面积大", "减少工件装夹次数，提高加工精度", "", ""], "r": "D", "e": "工序集中能让多个加工内容在一次装夹中完成，减少了装夹次数，避免多次装夹带来的误差，可提高加工精度。A、B、C选项均是工序集中的缺点。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614405", "t": 1, "q": "机械制造工艺过程中，\"基准\"按用途分为设计基准和工艺基准，下列属于工艺基准的是（　）", "a": ["零件装配时定位的基准面", "零件图纸上标注尺寸的起始点", "零件几何中心轴线", "零件的对称平面", "", ""], "r": "A", "e": "工艺基准是在加工和装配过程中使用的基准。A选项零件装配时定位的基准面是工艺过程中用于定位的，属于工艺基准；B选项零件图纸上标注尺寸的起始点是设计基准；C选项零件几何中心轴线和D选项零件的对称平面多为设计时确定的，属于设计基准。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614406", "t": 1, "q": "机械制造工艺过程中，\"基准重合原则\"是指（　）", "a": ["选择设计基准作为工艺基准", "选择精度高的表面作为基准", "选择加工方便的表面作为基准", "选择多个基准同时定位", "", ""], "r": "A", "e": "“基准重合原则”就是选设计基准作为工艺基准，可减少基准不重合带来的误差。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614407", "t": 1, "q": "机械制造工艺过程中，\"加工余量\"的确定不需要考虑的因素是（　）", "a": ["本道工序的装夹误差", "前道工序的表面粗糙度", "工件的材料密度", "前道工序的尺寸公差", "", ""], "r": "C", "e": "加工余量与装夹误差、前道工序表面粗糙度、前道工序尺寸公差有关，而与工件材料密度无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614408", "t": 1, "q": "机械制造工艺过程中，\"热处理工序\"在加工流程中的安排，下列说法正确的是（　）", "a": ["退火、正火通常安排在粗加工前", "时效处理通常安排在精加工后", "淬火、回火通常安排在粗加工后、精加工前", "表面淬火通常安排在毛坯制造后", "", ""], "r": "C", "e": "退火、正火目的是改善切削性能等，常安排在粗加工前；时效处理安排在粗加工后、精加工前；淬火、回火提高零件硬度等，安排在粗加工后、精加工前；表面淬火提高表面硬度，一般在精加工后。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614409", "t": 1, "q": "机械制造工艺过程中，\"生产类型\"分为单件生产、成批生产和大量生产，下列属于大量生产特点的是（　）", "a": ["采用通用机床和通用工艺装备", "产品品种多，产量少", "采用专用机床和自动生产线", "工艺文件简单", "", ""], "r": "C", "e": "大量生产产品数量大、品种少，为提高效率会采用专用机床和自动生产线。A选项通用机床用于单件或成批生产；B选项是单件生产特点；D选项大量生产工艺文件应详细。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614410", "t": 1, "q": "机械制造工艺过程中，\"误差复映\"是指（　）", "a": ["加工误差在不同零件间重复出现", "后道工序的误差影响前道工序", "前道工序的误差传递到后道工序", "加工误差随时间不断增大", "", ""], "r": "C", "e": "误差复映是指前道工序的加工误差会传递到后道工序。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614411", "t": 1, "q": "机械制造工艺过程中，\"装配工艺\"的核心是（　）", "a": ["选择装配工具", "确定零件的加工顺序", "保证零件之间的正确配合关系和相对位置", "确定装配时间", "", ""], "r": "C", "e": "装配工艺主要目的是将零件组合成完整产品，关键在于保证零件间正确配合与相对位置。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614412", "t": 1, "q": "机械制造装备设计中，对于数控机床的主轴系统，设计时首要保证的性能是（　）", "a": ["较快的转速调节范围", "低的制造成本", "高的回转精度和刚度", "足够大的输出扭矩", "", ""], "r": "C", "e": "主轴系统是数控机床的关键部件，其回转精度和刚度直接影响加工精度和质量，所以设计时首要保证的性能是高的回转精度和刚度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614413", "t": 1, "q": "机械制造装备设计中，加工中心的刀库设计，不需要考虑的因素是（　）", "a": ["刀具的存储数量和类型", "刀具的交换速度", "刀具的材料性能", "刀库的结构可靠性", "", ""], "r": "C", "e": "刀库设计主要考虑存储、交换及结构可靠性等方面，刀具材料性能是刀具自身特性，并非刀库设计需考虑因素。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614414", "t": 1, "q": "机械制造装备设计中，加工中心的主轴轴承选择，通常采用（　）", "a": ["角接触球轴承", "深沟球轴承", "推力球轴承", "调心滚子轴承", "", ""], "r": "A", "e": "角接触球轴承能同时承受径向和轴向载荷，且高速性能好，适合加工中心主轴要求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614415", "t": 1, "q": "机械制造装备设计中，磨床的砂轮架设计，需要重点保证的是（　）", "a": ["砂轮的直径", "砂轮的转速", "砂轮架的刚度和导轨精度", "砂轮架的重量", "", ""], "r": "C", "e": "磨床砂轮架工作时需稳定可靠，其刚度和导轨精度直接影响磨削精度和质量，所以设计要重点保证。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614416", "t": 1, "q": "机械制造装备设计中，磨床的砂轮平衡装置的作用是（　）", "a": ["延长砂轮的使用寿命", "增加砂轮的磨削能力", "提高砂轮的转速", "减少砂轮旋转时的振动，保证加工精度", "", ""], "r": "D", "e": "砂轮不平衡会导致旋转时振动，影响加工精度，平衡装置可减少这种振动来保证加工精度。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614417", "t": 1, "q": "机械制造装备设计中，普通车床的进给系统设计，主要需保证的是（　）", "a": ["简单的结构", "稳定的进给精度和运动平稳性", "大的进给抗力", "高的进给速度", "", ""], "r": "B", "e": "普通车床进给系统主要作用是使刀具获得准确的进给运动，所以要保证稳定的进给精度和运动平稳性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614418", "t": 1, "q": "机械制造装备设计中，普通车床的溜板箱设计，主要作用是（　）", "a": ["安装主轴和主轴轴承", "安装刀具", "实现主轴的变速", "将进给箱的运动传递给刀架，实现纵向和横向进给", "", ""], "r": "D", "e": "溜板箱主要功能就是把进给箱传来运动传给刀架，实现刀架纵向和横向进给。A选项是主轴箱作用；B选项安装刀具是刀架功能；C选项主轴变速是主轴箱实现。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614419", "t": 1, "q": "机械制造装备设计中，数控车床的刀架设计，不需要考虑的是（　）", "a": ["刀具的切削角度", "刀架的定位精度", "刀具的换刀速度", "刀具的安装数量", "", ""], "r": "A", "e": "刀架设计主要关注定位精度、换刀速度、刀具安装数量等刀架自身特性。刀具切削角度是刀具设计和切削工艺考虑的，并非刀架设计重点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614420", "t": 1, "q": "机械制造装备设计中，数控机床的导轨设计，优先选用的导轨类型是（　）", "a": ["滚动导轨", "滑动导轨", "静压导轨", "动压导轨", "", ""], "r": "A", "e": "滚动导轨摩擦系数小、运动灵敏度高、定位精度高，在数控机床导轨设计中优先选用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614421", "t": 1, "q": "机械制造装备设计中，铣床的主传动系统设计，当需要实现大范围变速时，通常采用的变速方式是（　）", "a": ["变频调速", "皮带变速", "液压变速", "齿轮变速", "", ""], "r": "D", "e": "齿轮变速可通过不同齿轮副的啮合实现多级变速，能满足大范围变速需求，且传动效率高、工作可靠。而变频调速一般适用于调速范围相对较窄等情况；皮带变速调速范围有限；液压变速多用于实现直线运动等，不常用于大范围变速。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614422", "t": 1, "q": "机械制造装备设计中，钻床的主轴设计，主要需保证的是（　）", "a": ["复杂的变速机构", "高的转速", "大的径向扭矩", "足够的轴向刚度和回转精度", "", ""], "r": "D", "e": "钻床工作时，主轴主要是轴向进给钻孔，需保证轴向力作用下的稳定性和回转准确性，所以主要需保证足够的轴向刚度和回转精度。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614423", "t": 1, "q": "在机械传动设计中，对于承受变载荷且要求传动精度较高的场合，下列哪种传动方式最适宜（　）", "a": ["平带传动", "渐开线圆柱齿轮传动", "链传动", "V带传动", "", ""], "r": "B", "e": "平带和V带传动靠摩擦力传动，易打滑，精度低；链传动在变载荷下冲击振动大，精度也不高。渐开线圆柱齿轮传动能保证恒定传动比，适合承受变载荷且对传动精度要求高的场合。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614424", "t": 1, "q": "在机械结构设计中，为了减小构件的应力集中，下列措施中效果最显著的是（　）", "a": ["选用强度更高的材料", "增大构件的截面尺寸", "减小构件所受的载荷", "在构件的尖角处采用圆角过渡", "", ""], "r": "D", "e": "应力集中多因构件形状突变产生，在尖角处用圆角过渡可平滑应力分布，显著减小应力集中。选高强度材料、增大截面尺寸、减小载荷都不能从根本上解决形状突变导致的应力集中。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614425", "t": 1, "q": "在机械设计的基本要求中，\"可靠性要求\"是指（　）", "a": ["产品在使用过程中不发生故障的特性", "产品维修方便、维修费用低的特性", "产品在规定条件下和规定时间内完成规定功能的能力", "产品能适应不同工作环境的能力", "", ""], "r": "C", "e": "可靠性要求就是产品在规定条件和规定时间内完成规定功能的能力。A表述不完整，B是维修性要求，D是适应性要求。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810567872614426", "t": 1, "q": "在机械设计的一般程序中，当完成初步设计后，接下来需要进行的关键步骤是（　）", "a": ["编制设计任务书", "样机试制与试验", "技术设计", "产品投产", "", ""], "r": "C", "e": "机械设计一般程序是先编制设计任务书，接着初步设计，之后是技术设计，再进行样机试制与试验，最后产品投产。初步设计后关键步骤是技术设计。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553728", "t": 2, "q": "机械结构设计中，模块化设计的优点包括（　）", "a": ["提高产品的整体刚度", "提高产品的通用性和标准化程度", "便于产品的系列化开发", "缩短产品的开发周期", "", ""], "r": "BCD", "e": "模块化设计将产品分解成多个模块，可提高通用性和标准化程度，利于系列化开发，还能缩短开发周期。而提高整体刚度并非模块化设计主要优点。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553729", "t": 2, "q": "机械结构设计中，设计薄壁构件时需要重点考虑的问题有（　）", "a": ["振动引起的噪声", "表面粗糙度不符合要求", "强度不足导致的断裂", "刚度不足导致的变形", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553730", "t": 2, "q": "机械结构设计中，提高构件刚度的措施有（　）", "a": ["对构件表面进行强化处理", "减小构件的支撑跨度", "优化构件的截面形状，增大惯性矩", "选用弹性模量高的材料", "", ""], "r": "BCD", "e": "构件刚度与支撑跨度、截面形状、材料弹性模量等有关。减小支撑跨度、增大惯性矩、选用弹性模量高的材料都能提高刚度。对构件表面强化处理主要影响强度而非刚度。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553731", "t": 2, "q": "机械结构设计中，为了提高构件的抗疲劳性能，可采取的措施有（　）", "a": ["减小构件的截面尺寸", "对构件表面进行喷丸、滚压等强化处理", "选用疲劳强度高的材料", "增加构件的表面粗糙度", "", ""], "r": "BC", "e": "减小截面尺寸会降低构件承载能力，不利于抗疲劳；增加表面粗糙度会使应力集中，降低抗疲劳性能。对构件表面喷丸、滚压等强化处理可提高表面硬度和残余压应力，选用疲劳强度高的材料能直接提升抗疲劳性能。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553732", "t": 2, "q": "机械零件设计中，齿轮传动的主要失效形式包括（　）", "a": ["齿面疲劳点蚀", "轮齿折断", "带的打滑", "齿面胶合", "", ""], "r": "ABD", "e": "带的打滑是带传动的失效形式，不是齿轮传动的。而齿面疲劳点蚀、轮齿折断、齿面胶合是齿轮传动常见失效形式。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553733", "t": 2, "q": "机械零件设计中，齿轮的材料选择需要考虑的因素有（　）", "a": ["齿轮的加工工艺", "齿轮的工作载荷", "齿轮的转速", "齿轮的成本", "", ""], "r": "ABCD", "e": "答案：ABCD齿轮的材料选择需要综合考虑多个因素，包括齿轮的加工工艺（A），因为不同的材料有不同的加工难度和工艺要求；齿轮的工作载荷（B），因为载荷大小直接影响齿轮的强度和耐磨性需求；齿轮的转速（C），高转速可能会增加齿轮的热负荷和磨损；以及齿轮的成本（D），因为不同材料的成本差异较大，需要在满足性能要求的前提下进行成本控制。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553734", "t": 2, "q": "机械零件设计中，齿轮的结构设计需要考虑的因素有（　）", "a": ["齿轮的加工工艺", "齿轮的尺寸大小", "齿轮的材料", "齿轮的安装方式", "", ""], "r": "ABCD", "e": "齿轮结构设计要综合多方面因素，加工工艺影响结构实现，尺寸大小决定具体形态，材料特性关联结构设计，安装方式也会影响结构。ABCD 选项均是需考虑因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553735", "t": 2, "q": "机械零件设计中，齿轮强度计算需要考虑的载荷系数包括（　）", "a": ["使用系数KA", "弹性系数ZE", "齿向载荷分布系数KHβ", "齿间载荷分配系数KHα", "", ""], "r": "ACD", "e": "齿轮强度计算的载荷系数有使用系数KA、齿向载荷分布系数KHβ、齿间载荷分配系数KHα ，弹性系数ZE不是载荷系数。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553736", "t": 2, "q": "机械零件设计中，滚动轴承的失效形式包括（　）", "a": ["磨损", "疲劳点蚀", "塑性变形", "胶合", "", ""], "r": "ABCD", "e": "A 选项，磨损：当密封不良，灰尘进入轴承，滚动体与滚道会发生磨损，属于失效形式。<br />B 选项，疲劳点蚀：滚动轴承在交变接触应力长期作用下，滚道、滚动体表面出现剥落点蚀，是最主要失效形式。<br />C 选项，塑性变形：过大静载荷或者冲击载荷下，滚动体和滚道产生塑性压痕，属于失效形式。<br />D 选项，胶合：高速重载工况下，摩擦发热造成金属表面粘连撕裂，发生胶合失效。<br />综上选 ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553737", "t": 2, "q": "机械零件设计中，滚动轴承选择时需要考虑的因素有（　）", "a": ["工作温度", "轴承所受的载荷类型（径向、轴向）", "安装空间", "转速", "", ""], "r": "ABCD", "e": "滚动轴承选择需综合考虑多种因素，工作温度影响润滑和材料性能；载荷类型决定轴承类型；安装空间限制轴承尺寸；转速影响轴承的选型和寿命。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553738", "t": 2, "q": "机械零件设计中，滑动轴承的材料选择需要考虑的因素有（　）", "a": ["轴承的工作温度", "相对滑动速度", "润滑条件", "材料的成本", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553739", "t": 2, "q": "机械零件设计中，滑动轴承的类型包括（　）", "a": ["剖分式滑动轴承", "滚动轴承", "调心式滑动轴承", "静压滑动轴承", "", ""], "r": "ACD", "e": "答案：ACD【解析】B 项属于滚动轴承，不属于滑动轴承，A、C、D 均为滑动轴承的类型。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553740", "t": 2, "q": "机械零件设计中，滑动轴承的润滑方式可根据工作条件选择，下列属于滑动轴承常用润滑方式的有（　）", "a": ["滴油润滑", "静压润滑", "喷雾润滑", "油环润滑", "", ""], "r": "ABCD", "e": "滑动轴承的润滑方式主要是为了减少摩擦和磨损，提高轴承的使用寿命和工作效率。常见的润滑方式包括： 滴油润滑：通过控制油滴的滴落速度，使润滑油均匀地滴落在轴承表面，适用于低速轻载的场合。 静压润滑：通过外部油泵将润滑油以一定压力注入轴承间隙，形成一层油膜，适用于高精度和高负荷的场合。 喷雾润滑：利用喷嘴将润滑油雾化后喷射到轴承表面，适用于高速运转的场合。 油环润滑：利用油环带油，通过油环的旋转将润滑油带到轴承表面，适用于中等速度和负荷的场合。综上所述，这四种方式都是滑动轴承的常用润滑方式。所以，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553741", "t": 2, "q": "机械零件设计中，螺栓连接的防松方法有（　）", "a": ["采用双螺母", "采用止动垫圈", "采用弹簧垫圈", "采用铰制孔用螺栓", "", ""], "r": "ABC", "e": "防松是为防止螺栓连接在工作中松动。双螺母、止动垫圈、弹簧垫圈都能起到防松作用。而铰制孔用螺栓主要用于承受横向载荷，不是防松方法。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553742", "t": 2, "q": "机械零件设计中，螺栓连接的强度计算需要考虑的因素有（　）", "a": ["螺栓的数量", "螺栓的表面粗糙度", "螺栓的材料强度等级", "螺栓的拧紧力矩", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553743", "t": 2, "q": "机械设计的基本要求中，\"环境适应性\"的具体要求包括（　）", "a": ["能在规定的温度范围内工作", "能承受规定的振动和冲击载荷", "能在任意电压下工作", "能适应规定的粉尘环境", "", ""], "r": "ABD", "e": "机械设计要在规定环境条件下正常工作，A温度范围、B振动冲击载荷、D粉尘环境都属于规定环境，而机械不能在任意电压下工作，C错误。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553744", "t": 2, "q": "机械设计的基本要求中，\"经济性\"在制造阶段的体现包括（　）", "a": ["采用标准化零件", "选择低成本材料", "采用高效的制造工艺", "简化零件的结构形状", "", ""], "r": "ABCD", "e": "制造阶段经济性可从材料、工艺、结构等方面考虑。采用标准化零件利于降低成本；选低成本材料能减少费用；高效制造工艺可提高效率、降低成本；简化零件结构形状便于加工、降低成本。ABCD选项都能在制造阶段体现经济性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553745", "t": 2, "q": "机械设计的基本要求中，\"维护性要求\"的具体体现包括（　）", "a": ["零件易于拆卸和更换", "维修工具通用化", "故障诊断简单快捷", "维修成本低", "", ""], "r": "ABC", "e": "答案：ABC“维护性要求”主要涉及到机械系统在使用过程中是否便于维护和修理。易于拆卸和更换零件（A选项）、维修工具通用化（B选项）以及故障诊断简单快捷（C选项）都是维护性好的表现。而维修成本低（D选项）虽然也是机械设计的一个考虑因素，但它并不直接体现“维护性要求”，而是更多关联到经济性要求。因此，正确答案应为A、B、C。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553746", "t": 2, "q": "机械设计的基本要求中，安全性要求具体体现在（　）", "a": ["防止零件失效引发的安全事故", "提高产品的使用寿命", "防止产品过载运行", "保证操作人员的人身安全", "", ""], "r": "ACD", "e": "安全性要求主要是避免各种可能的危险情况。A选项防止零件失效引发安全事故、C选项防止产品过载运行、D选项保证操作人员人身安全都属于安全性要求范畴。B选项提高产品使用寿命主要与产品的耐久性相关，并非安全性要求。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553747", "t": 2, "q": "机械设计的基本要求中，经济性要求体现在（　）", "a": ["降低产品的维护成本", "缩短产品的开发周期", "提高产品的销售价格", "降低产品的设计成本", "", ""], "r": "ABD", "e": "经济性要求就是要在设计、制造、使用等过程中降低成本、提高效益。A降低维护成本、B缩短开发周期、D降低设计成本都符合经济性要求，而C提高销售价格与经济性要求相悖。答案选ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553748", "t": 2, "q": "机械设计的基本要求中，影响产品可靠性的因素包括（　）", "a": ["产品的外观设计", "工作环境条件", "维护保养水平", "零件的材料性能", "", ""], "r": "BCD", "e": "产品可靠性受工作环境、维护保养、零件材料性能等影响。外观设计不直接影响可靠性。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553749", "t": 2, "q": "机械设计的一般程序中，技术设计阶段需要完成的工作包括（　）", "a": ["编制设计任务书", "选择零件的材料和热处理工艺", "确定零件的结构形状和主要尺寸", "绘制产品的整体方案草图", "", ""], "r": "BC", "e": "答案：BC技术设计阶段主要是在初步设计的基础上，对产品进行深入的结构设计和计算，确定零件的结构形状、主要尺寸、材料和热处理工艺等细节。选项A编制设计任务书和选项D绘制产品的整体方案草图通常是在初步设计阶段完成的任务。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553750", "t": 2, "q": "机械设计一般程序中，\"技术设计\"与\"初步设计\"的区别在于（　）", "a": ["技术设计需进行详细的性能计算，初步设计仅进行估算", "技术设计需考虑制造工艺，初步设计无需考虑", "技术设计需选择材料，初步设计也需选择材料但可能不具体", "技术设计需确定零件的具体尺寸，初步设计仅确定整体方案", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553751", "t": 2, "q": "机械设计一般程序中，\"样机试制\"的作用包括（　）", "a": ["验证产品的性能指标", "验证设计方案的可行性", "发现设计中的问题", "为批量生产提供工艺参数", "", ""], "r": "ABCD", "e": "样机试制可通过实际制作和测试来检验产品，能验证性能指标、设计方案可行性，还可发现设计问题，同时为后续批量生产摸索工艺参数。ABCD选项均符合其作用。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553752", "t": 2, "q": "机械设计一般程序中，编制设计任务书时需要明确的技术指标包括（　）", "a": ["产品的工作精度", "产品的制造成本", "产品的使用寿命", "产品的外形尺寸限制", "", ""], "r": "ACD", "e": "编制设计任务书明确的技术指标主要是和产品性能、功能、使用相关的。工作精度、使用寿命、外形尺寸限制都属于技术指标范畴，制造成本是经济指标。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553753", "t": 2, "q": "机械设计一般程序中，初步设计阶段的主要任务有（　）", "a": ["进行样机试制", "编制初步设计计算书", "绘制产品的整体方案草图", "进行产品的功能原理设计", "", ""], "r": "BCD", "e": "初步设计阶段要完成功能原理设计、编制初步设计计算书、绘制整体方案草图等。样机试制是后续阶段工作。选项B、C、D符合初步设计阶段任务。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553754", "t": 2, "q": "机械设计一般程序中，工作图设计阶段的输出文件包括（　）", "a": ["初步设计计算书", "装配图", "技术要求文件", "可行性分析报告", "", ""], "r": "BC", "e": "答案：BC机械设计一般程序中的工作图设计阶段主要是绘制出详细的零件图和装配图，并编制技术要求文件，用于指导生产加工和质量控制。初步设计计算书是在初步设计阶段完成的，可行性分析报告是在项目立项前期进行的，均不属于工作图设计阶段的输出文件。装配图和技术要求文件是工作图设计阶段的主要输出。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553755", "t": 2, "q": "机械制造工艺过程中，\"工序分散\"的特点包括（　）", "a": ["占地面积大", "生产准备时间短，易调整", "设备利用率高", "对工人操作技能要求较低", "", ""], "r": "ABD", "e": "工序分散指每个工序加工内容少，工艺路线长。因设备多，所以占地面积大；工序简单，生产准备和调整时间短；设备专用，利用率低；但对工人技能要求不高。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553756", "t": 2, "q": "机械制造工艺过程中，\"基准统一原则\"的优点包括（　）", "a": ["降低对工人技能的要求", "便于工件的装夹定位", "减少基准不重合误差", "简化工艺装备设计", "", ""], "r": "BCD", "e": "基准统一原则可使工件装夹定位更方便，简化工艺装备设计，减少基准不重合误差。A选项降低对工人技能要求并非该原则主要优点。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553757", "t": 2, "q": "机械制造工艺过程中，\"加工余量过大\"的缺点包括（　）", "a": ["提高加工精度", "增加机床和刀具的磨损", "增加切削工时", "增加材料消耗", "", ""], "r": "BCD", "e": "加工余量过大，会使切削量增多，增加材料消耗，切削时间变长，还会加大机床和刀具的磨损。而加工余量过大并不能提高加工精度。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553758", "t": 2, "q": "机械制造工艺过程中，\"切削用量\"的选择需要考虑的因素有（　）", "a": ["工件材料的切削性能", "机床的功率和刚度", "加工效率要求", "刀具材料的切削性能", "", ""], "r": "ABCD", "e": "切削用量选择要综合多方面因素，工件材料切削性能影响加工难易，机床功率和刚度决定能承受的切削强度，加工效率要求会影响切削速度等参数，刀具材料切削性能也制约着切削用量。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553759", "t": 2, "q": "机械制造工艺过程中，\"先进制造技术\"的应用包括（　）", "a": ["柔性制造系统", "传统手工加工技术", "数控加工技术", "精益生产方式", "", ""], "r": "ACD", "e": "先进制造技术是指集机械工程技术、电子技术、自动化技术、信息技术等多种技术为一体所产生的技术、设备和系统的总称。柔性制造系统、数控加工技术、精益生产方式都属于先进制造技术，而传统手工加工技术不属于先进范畴。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553760", "t": 2, "q": "机械制造工艺过程中，\"装配精度\"的内容包括（　）", "a": ["位置精度", "形状精度", "运动精度", "接触精度", "", ""], "r": "ACD", "e": "答案：ACD装配精度主要包括位置精度、运动精度和接触精度。形状精度主要在零件加工阶段考虑，不是装配精度的主要内容。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553761", "t": 2, "q": "机械制造工艺过程中，工序划分的主要依据有（　）", "a": ["加工设备的类型", "加工精度要求", "零件的结构复杂程度", "生产类型", "", ""], "r": "BCD", "e": "答案：BCD机械制造工艺过程中，工序划分主要依据加工精度要求、零件的结构复杂程度和生产类型。加工精度要求不同，工序划分的细致程度也会有所不同；零件结构复杂程度影响工序的数量和顺序；生产类型（如单件小批生产、大批大量生产）决定工序划分的方式和特点。加工设备的类型不是工序划分的主要依据。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553762", "t": 2, "q": "机械制造工艺过程中，热处理工序的作用包括（　）", "a": ["改善材料的切削性能", "提高零件的强度和韧性", "改变零件的几何形状", "提高零件的硬度和耐磨性", "", ""], "r": "ABD", "e": "热处理是通过对材料加热、保温和冷却等操作改变其组织和性能。能改善材料切削性能、提高强度和韧性、硬度和耐磨性，但不能改变零件几何形状。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553763", "t": 2, "q": "机械制造工艺过程中，影响加工精度的因素包括（　）", "a": ["工人的操作技能", "刀具的磨损误差", "工件的装夹误差", "测量误差", "", ""], "r": "BCD", "e": "机械加工中，刀具磨损会改变切削尺寸影响精度；工件装夹位置不准确产生装夹误差影响精度；测量不准确会导致加工调整偏差影响精度。而工人操作技能属于人为因素范畴，但本题问的是工艺过程中直接影响加工精度的因素。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553764", "t": 2, "q": "机械制造工艺过程中，影响切削加工表面质量的因素有（　）", "a": ["刀具几何参数", "进给量", "工件材料", "切削速度", "", ""], "r": "ABCD", "e": "刀具几何参数、进给量、工件材料、切削速度都会对切削加工表面质量产生影响。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553765", "t": 2, "q": "机械制造工艺过程中，装配的基本方法包括（　）", "a": ["互换装配法", "分组装配法", "调整装配法", "焊接装配法", "", ""], "r": "ABC", "e": "机械制造装配基本方法有互换装配法、分组装配法、调整装配法等。焊接装配法不属于基本装配方法。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553766", "t": 2, "q": "机械制造装备设计中，加工中心与普通数控机床相比，具备的独特功能有（　）", "a": ["可实现多工序集中加工", "无需人工干预加工过程", "可自动更换工件", "加工精度更高", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553767", "t": 2, "q": "机械制造装备设计中，磨床的砂轮架设计需要考虑的性能指标有（　）", "a": ["砂轮的直径", "砂轮架的刚度", "砂轮架的热稳定性", "砂轮的转速范围", "", ""], "r": "BC", "e": "答案：BC在机械制造装备设计中，磨床的砂轮架设计关键在于确保加工过程中的稳定性和精度。砂轮架的刚度（B选项）直接关系到加工时的变形量，刚度越高，加工精度越高。同时，砂轮架的热稳定性（C选项）也很重要，因为加工过程中产生的热量可能导致砂轮架变形，影响加工精度。而砂轮的直径（A选项）和转速范围（D选项）更多是与砂轮本身的选择和使用相关，不是砂轮架设计时主要考虑的性能指标。", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553768", "t": 2, "q": "机械制造装备设计中，普通车床的组成部分包括（　）", "a": ["溜板箱", "刀架", "床身", "进给箱", "", ""], "r": "ABCD", "e": "普通车床主要由床身、主轴箱、进给箱、溜板箱、刀架等部分组成，ABCD选项均是普通车床的组成部分。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553769", "t": 2, "q": "机械制造装备设计中，普通铣床的主传动系统设计需要考虑的因素有（　）", "a": ["噪声控制", "变速范围", "刀具的安装方式", "传递功率", "", ""], "r": "BD", "e": "主传动系统要满足机床工作时的转速、功率等需求。变速范围影响机床能适应的加工工况；传递功率保证机床正常工作。噪声控制不是主传动系统设计核心考虑因素；刀具安装方式主要和机床的刀架等结构有关，与主传动系统关系不大。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553770", "t": 2, "q": "机械制造装备设计中，数控车床的主轴箱设计需要考虑的问题有（　）", "a": ["主轴的刚度", "主轴的热变形控制", "主轴的转速范围", "刀具的自动夹紧", "", ""], "r": "ABC", "e": "主轴箱是数控车床的关键部件，主轴的刚度影响加工精度，热变形控制能保证加工稳定性，转速范围要满足不同加工需求，这三者都是主轴箱设计需考虑的。而刀具自动夹紧主要与刀架等部件相关，并非主轴箱设计重点。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553771", "t": 2, "q": "机械制造装备设计中，数控机床的导轨润滑方式包括（　）", "a": ["滴油润滑", "静压润滑", "喷雾润滑", "油气润滑", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553772", "t": 2, "q": "机械制造装备设计中，数控机床的进给系统组成包括（　）", "a": ["溜板箱", "导轨", "伺服电机", "滚珠丝杠", "", ""], "r": "BCD", "e": "数控机床进给系统是驱动执行部件运动的传动装置，导轨起支撑和导向作用，伺服电机提供动力，滚珠丝杠将旋转运动转换为直线运动，它们都是进给系统重要组成。而溜板箱是普通机床的部件，不是数控机床进给系统的组成部分。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553773", "t": 2, "q": "机械制造装备设计中，数控机床主轴系统设计需要考虑的性能指标有（　）", "a": ["抗振性", "转速范围", "回转精度", "刚度", "", ""], "r": "ABCD", "e": "数控机床主轴系统要稳定可靠运行，需有良好抗振性避免振动影响加工；要满足不同加工需求，有合适转速范围；回转精度影响加工精度；刚度保证主轴在受力时变形小。ABCD选项都是主轴系统设计需考虑的性能指标。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553774", "t": 2, "q": "机械制造装备设计中，铣床的主要功能包括（　）", "a": ["铣削沟槽", "车削外圆", "铣削平面", "铣削成型面", "", ""], "r": "ACD", "e": "铣床是用铣刀对工件进行铣削加工的机床，可铣削平面、沟槽、成型面等。车削外圆是车床的功能。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553775", "t": 2, "q": "机械制造装备设计中，钻床的进给机构设计需要保证的性能有（　）", "a": ["进给量的可调性", "刀具的自动换刀功能", "足够的进给抗力", "进给速度的稳定性", "", ""], "r": "ACD", "e": "钻床进给机构需能按不同加工要求调整进给量，所以进给量要有可调性；同时要保证加工质量，进给速度需稳定；并且要能承受加工时的力，有足够进给抗力。而自动换刀功能不是进给机构要保证的性能。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810569684553776", "t": 2, "q": "机械制造装备设计中，钻床的主要组成部分有（　）", "a": ["刀架", "主轴箱", "进给机构", "工作台", "", ""], "r": "BCD", "e": "钻床主要由主轴箱、进给机构、工作台等组成。刀架一般是车床等机床部件。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176576", "t": 3, "q": "机械结构设计中，冗余设计通过增加备用构件，可提高产品的可靠性，当主构件失效时，备用构件能继续工作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冗余设计就是在设计中增加备用构件，这样在主构件失效时，备用构件能顶上继续工作，从而提高产品可靠性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176577", "t": 3, "q": "机械结构设计中，细长杆承受轴向压力时，主要失效形式是强度不足导致的断裂。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "细长杆承受轴向压力时，主要失效形式是失稳，而非强度不足导致的断裂，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176578", "t": 3, "q": "机械结构设计中，圆形截面轴承受扭矩时，其抗扭能力比相同截面积的矩形截面轴更强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在承受扭矩时，圆形截面轴材料分布更合理，能更有效抵抗扭转，相同截面积下抗扭能力比矩形截面轴强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176579", "t": 3, "q": "机械结构设计中，增加构件的支撑刚度可有效提高构件的整体刚度，减少变形。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械结构设计里，支撑刚度影响构件整体刚度，增加支撑刚度能增强构件抵抗变形能力，减少变形。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176580", "t": 3, "q": "机械结构设计中，增加构件的阻尼可有效提高其抗振性能，减少振动幅值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械结构设计里，阻尼能消耗振动能量，增加构件阻尼可抑制振动，有效提高抗振性能、减少振动幅值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176581", "t": 3, "q": "机械零件设计中，齿轮的齿面接触疲劳强度计算主要用于防止轮齿发生折断。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "齿轮的齿面接触疲劳强度计算主要是防止齿面发生点蚀，而防止轮齿折断需进行齿根弯曲疲劳强度计算。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176582", "t": 3, "q": "机械零件设计中，齿轮的齿数越多，其传动平稳性越好，但传动比越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "齿轮齿数越多，重合度越大，传动平稳性越好；而传动比取决于主动轮和从动轮齿数之比，与单个齿轮齿数多少无关。所以题干后半句错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176583", "t": 3, "q": "机械零件设计中，齿轮的模数越大，其齿厚越小，承载能力越弱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在机械零件设计里，齿轮模数越大，齿厚越大，承载能力越强，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176584", "t": 3, "q": "机械零件设计中，滚动轴承的额定静载荷是指轴承在静止或低速旋转时，允许承受的最大载荷。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "滚动轴承额定静载荷就是轴承在静止或极低转速下，允许承受的最大载荷。  ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176585", "t": 3, "q": "机械零件设计中，滚动轴承的基本额定寿命是指在额定动载荷作用下，100%的轴承不发生疲劳点蚀的寿命。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "滚动轴承的基本额定寿命是指一批相同的轴承在相同条件下运转，其中 90%的轴承不发生疲劳点蚀的寿命，并非 100%。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176586", "t": 3, "q": "机械零件设计中，滚动轴承的寿命与所受载荷的三次方成反比（球轴承），载荷越大，寿命越短。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于球轴承，滚动轴承的寿命与所受载荷的三次方成反比，这意味着载荷增大，寿命会按相应规律缩短。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176587", "t": 3, "q": "机械零件设计中，滑动轴承的承载能力主要取决于轴承的直径大小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "滑动轴承承载能力受多种因素影响，不只是轴承直径大小，还有宽径比、材料、润滑等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176588", "t": 3, "q": "机械零件设计中，滑动轴承的宽径比（B/d）越大，其承载能力越强，但温升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "宽径比大意味着轴承宽度大，承载面积增加，承载能力增强；但同时摩擦面积增大，产生热量增多，导致温升变高。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176589", "t": 3, "q": "机械零件设计中，滑动轴承的润滑方式应根据轴承的工作转速和载荷选择，高速重载时宜采用静压润滑。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械零件设计里，对于滑动轴承，高速重载工况下，静压润滑能依靠外部供油系统提供压力油，形成稳定油膜，有效承载和减少磨损，所以润滑方式根据工作转速和载荷选，高速重载用静压润滑合理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176590", "t": 3, "q": "机械零件设计中，螺栓的拧紧力矩过大，会导致螺栓杆产生塑性变形，降低连接强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "拧紧力矩过大时，螺栓杆所受应力会超过材料的屈服极限，从而产生塑性变形，使螺栓的力学性能改变，降低连接强度。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176591", "t": 3, "q": "机械零件设计中，螺栓连接的强度计算主要校核螺栓头与螺杆连接部位的剪切强度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "螺栓连接强度计算主要校核螺栓杆的拉伸强度，而非螺栓头与螺杆连接部位的剪切强度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176592", "t": 3, "q": "机械设计的基本要求中，安全性要求仅需考虑操作人员的人身安全，无需考虑设备自身的安全。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机械设计安全性要求既包括操作人员的人身安全，也包括设备自身的安全。 ", "ap": [false, false, false, false, false, false
