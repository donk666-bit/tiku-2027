: ["传质单元数（NOG）", "吸收速率", "传质单元高度（HOG）", "相平衡常数（　）", "", ""], "r": "C", "e": "在化工单元操作的吸收过程中，填料塔的高度主要影响的是传质单元数和传质单元高度。A选项，传质单元数（NOG）是表示吸收过程难易程度的无量纲准数，与填料层高度无关，所以A选项错误。B选项，吸收速率受多个因素影响，包括气体流速、液体流速、填料性质等，而不仅仅是填料层高度。在其他操作条件不变的情况下，仅增加填料层高度，并不会直接影响吸收速率，因此B选项也是错误的。C选项，传质单元高度（HOG）是填料塔的一个重要参数，它表示填料层内传质单元的平均高度。增加填料层高度，相当于增加了传质单元的数量，因此传质单元高度会相应减小。所以C选项是正确的。D选项，相平衡常数是温度的函数，与填料层高度无关，因此D选项错误。综上所述，正确答案是C选项：传质单元高度（HOG）。", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712536", "t": 1, "q": "在化工单元操作的吸收过程中，若吸收剂用量增加，其他条件不变，吸收塔的液气比（L/G）增大，下列参数会增大的是？", "a": ["吸收速率", "出口气体中溶质的浓度", "相平衡常数", "传质单元高度", "", ""], "r": "A", "e": "吸收剂用量增加，液气比增大，会使吸收推动力增大，从而使吸收速率增大。出口气体中溶质浓度会降低，相平衡常数只与温度、压力等有关，与液气比无关，传质单元高度与设备和流体物性等有关，不随液气比增大而增大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712537", "t": 1, "q": "在化工单元操作的蒸馏过程中，采用板式塔精馏，若塔板效率降低，下列参数会发生变化的是？", "a": ["实际塔板数", "理论塔板数", "相平衡常数", "相对挥发度", "", ""], "r": "A", "e": "塔板效率降低，为达到相同分离效果，就需更多实际塔板数；理论塔板数由分离任务等决定，与塔板效率无关；相平衡常数和相对挥发度由物系本身和温度等决定，和塔板效率无关。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712538", "t": 1, "q": "在化工单元操作的蒸馏过程中，采用浮阀塔板进行精馏，若浮阀脱落数量较多，会导致塔的哪种性能显著下降？", "a": ["塔板效率", "塔的处理能力", "塔的压降", "塔的操作弹性", "", ""], "r": "A", "e": "浮阀脱落多会使气液接触不充分，影响传质效果，进而显著降低塔板效率。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712539", "t": 1, "q": "在化工单元操作的蒸馏过程中，若二元混合溶液的相对挥发度为1.0，下列关于该溶液分离的说法正确的是？", "a": ["无法通过普通精馏分离", "可通过增加塔板数实现完全分离", "可通过增加回流比实现完全分离", "可通过降低操作压力实现分离", "", ""], "r": "A", "e": "相对挥发度为1.0意味着两组分挥发能力相同，普通精馏利用的就是组分挥发度差异来分离，所以无法通过普通精馏分离。增加塔板数、回流比及降低操作压力都不能改变相对挥发度为1的本质，无法实现完全分离。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712540", "t": 1, "q": "在化工过程的反应过程中，对于放热反应，采用连续搅拌反应釜（CSTR），若反应釜的冷却装置能力不足，会导致？", "a": ["反应温度升高", "反应速率降低", "反应物转化率降低", "产物选择性降低", "", ""], "r": "A", "e": "放热反应中冷却装置能力不足，热量无法及时散出，会使反应温度升高。温度升高一般会使反应速率加快，反应物转化率可能提高，产物选择性不一定降低。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712541", "t": 1, "q": "在化工过程的反应精馏操作中，反应与精馏同时进行，下列哪种情况最适合采用反应精馏？", "a": ["反应为可逆反应，且产物与反应物的相对挥发度差异较大", "反应物与产物的相对挥发度差异极小，难以分离", "反应为不可逆反应，且反应速率极快", "反应需要在高温高压下进行，而精馏需要在低压下进行", "", ""], "r": "A", "e": "反应精馏适合可逆反应，且产物与反应物挥发度差异大时，可及时分离出产物，使平衡正向移动，利于反应进行。B选项挥发度差异小不利于精馏分离；C选项不可逆反应且速率快不用通过精馏促进反应；D选项反应和精馏条件冲突不适合。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712542", "t": 1, "q": "在化工过程的干燥操作中，采用气流干燥器干燥湿颗粒物料，若干燥介质为热空气，保持空气进口温度、湿度不变，仅增加物料进料量，且物料在干燥器内停留时间不变，此时出口物料的含水率会如何变化？", "a": ["降低", "升高", "不变", "与物料粒径有关，无法确定", "", ""], "r": "B", "e": "增加物料进料量，热空气量不变，意味着单位质量热空气要干燥更多物料，其提供的热量和除湿能力相对不足，所以出口物料含水率会升高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712543", "t": 1, "q": "在化工过程的干燥操作中，湿空气的湿球温度与干球温度的差值越大，表明湿空气的？", "a": ["焓值越大", "相对湿度越小", "湿度越大", "露点温度越高", "", ""], "r": "B", "e": "湿球温度与干球温度差值越大，意味着水分蒸发越快，说明湿空气容纳水汽能力强，相对湿度小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712544", "t": 1, "q": "在化工过程的精馏操作中，当采用连续精馏塔分离二元理想溶液时，若进料状态为饱和液体，且保持进料组成、回流比、塔顶馏出液组成不变，仅增加进料量，此时下列哪个参数会显著变化？", "a": ["塔顶馏出液量与进料量的比值（馏出率）", "精馏段操作线斜率", "塔底残液组成", "提馏段操作线斜率", "", ""], "r": "A", "e": "这是一道关于化工过程中精馏操作的问题。在连续精馏塔分离二元理想溶液的情境下，我们需要考虑进料状态变化对各个参数的影响。首先，理解题目中的关键条件：* 进料状态为饱和液体。* 进料组成、回流比、塔顶馏出液组成保持不变。* 仅增加进料量。接下来，分析各选项：A. 塔顶馏出液量与进料量的比值（馏出率）：在进料组成、回流比和塔顶馏出液组成不变的情况下，增加进料量会直接导致塔顶馏出液量的增加。因此，馏出率（即塔顶馏出液量与进料量的比值）会显著变化。B. 精馏段操作线斜率：该斜率主要由回流比决定，而回流比在此情况下是保持不变的。因此，精馏段操作线斜率不会显著变化。C. 塔底残液组成：在进料组成和其他操作条件不变的情况下，塔底残液组成主要受到提馏段操作的影响。由于提馏段的操作条件（如回流比等）未变，塔底残液组成不会显著变化。D. 提馏段操作线斜率：同样，该斜率受提馏段操作条件影响，而在本题中这些条件保持不变。因此，提馏段操作线斜率也不会显著变化。综上所述，当进料量增加时，唯一显著变化的参数是塔顶馏出液量与进料量的比值（馏出率）。所以，正确答案是A选项：“塔顶馏出液量与进料量的比值（馏出率）”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712545", "t": 1, "q": "在化工过程的物料衡算中，某连续搅拌反应釜（CSTR）进行一级不可逆反应A→B，进料中A的浓度为cA0，流量为v，反应速率常数为k，釜容积为V，若反应达到稳态时，出口A的浓度为cA，下列物料衡算方程正确的是？", "a": ["v×cA0=v×cA+k×V×cA", "v×cA0=v×cA+k×V×cA0", "v×cA0=v×cA+k×V", "v×cA0=v×cA+k×V×(cA0-cA)", "", ""], "r": "D", "e": "这是一道关于化工过程物料衡算的问题，涉及到连续搅拌反应釜（CSTR）中的一级不可逆反应。在稳态下，反应釜的进料速率应等于出料速率加上反应消耗的速率。A选项：v×cA0=v×cA+k×V×cA。这个方程错误地将反应速率与出口浓度cA相乘，而不是反应物的浓度差。B选项：v×cA0=v×cA+k×V×cA0。此方程错误地使用了进料浓度cA0来计算反应速率，而不是反应釜内的实际浓度。C选项：v×cA0=v×cA+k×V。这个方程没有考虑到反应物浓度的变化，因此是不完整的。D选项：v×cA0=v×cA+k×V×(cA0-cA)。这个方程正确地表示了物料衡算关系。左边是进料速率，右边是出料速率加上反应消耗的速率。反应消耗的速率是基于反应釜内A的浓度(cA0-cA)来计算的。综上所述，D选项正确地表示了连续搅拌反应釜中的一级不可逆反应的物料衡算关系。所以，正确答案是D选项：“v×cA0=v×cA+k×V×(cA0-cA)”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712546", "t": 1, "q": "在化工过程的吸附操作中，采用固定床吸附器吸附废气中的有害组分，若吸附剂达到饱和后进行再生，下列再生方法中属于物理再生的是？", "a": ["高温加热再生", "氧化分解再生", "化学试剂洗脱再生", "生物降解再生", "", ""], "r": "A", "e": "物理再生是不改变吸附质化学性质的再生方式。高温加热可使吸附质从吸附剂上脱附，不改变其化学性质，属于物理再生。氧化分解、生物降解会改变吸附质化学结构，化学试剂洗脱可能发生化学反应改变吸附质，均不属于物理再生。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712547", "t": 1, "q": "在化工过程的蒸发操作中，采用多效蒸发流程（三效并流）浓缩NaOH水溶液，若一效加热蒸汽压力不变，各效真空度均正常，当原料液浓度升高时，下列哪个现象会发生？", "a": ["加热蒸汽消耗量增加", "各效蒸发量均增加", "冷凝器负荷增加", "各效溶液沸点均升高", "", ""], "r": "D", "e": "在化工过程的蒸发操作中，采用多效蒸发流程浓缩NaOH水溶液时，原料液浓度的变化会影响蒸发过程的热力学特性。具体分析如下：1. 加热蒸汽消耗量：当原料液浓度升高时，溶液的沸点升高，需要更多的热量来维持蒸发。因此，加热蒸汽消耗量可能会增加。2. 各效蒸发量：原料液浓度升高会导致溶液的沸点升高，蒸发速率可能会降低，因此各效蒸发量不一定增加，反而可能减少。3. 冷凝器负荷：由于溶液沸点升高，蒸发过程中产生的蒸汽量可能会增加，导致冷凝器的负荷增加。4. 各效溶液沸点：随着原料液浓度的升高，溶液的沸点会升高，这是由于溶液的蒸气压降低所致。综合以上分析，原料液浓度升高时，最直接的现象是各效溶液沸点的升高。所以，正确答案是D选项：“各效溶液沸点均升高”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712548", "t": 1, "q": "在压力容器设计的强度校核中，当容器承受内压和外压联合作用时，需计算其当量压力进行壁厚校核，下列关于当量压力的计算逻辑正确的是？", "a": ["当量压力取内压和外压中的较大值，单独按该压力类型校核", "当量压力=外压-内压，始终按外压容器校核原则计算", "当量压力=内压+外压，仅考虑压力叠加", "当量压力=内压-外压，当内压大于外压时按此计算，否则按外压容器校核", "", ""], "r": "D", "e": "当容器承受内压和外压联合作用时，若内压大于外压，当量压力为内压减外压；若内压小于等于外压，按外压容器校核。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712549", "t": 1, "q": "在压力容器设计中，当容器存在大开孔（开孔直径d与容器内径Di之比d/Di>0.5）时，需进行补强设计，下列哪种补强结构属于整体补强？", "a": ["厚壁管补强", "接管自身补强（增加接管壁厚）", "补强圈补强", "整体锻造法兰补强", "", ""], "r": "D", "e": "整体补强是指补强件与壳体是一个整体，整体锻造法兰补强是将补强部分与容器整体锻造，属于整体补强；而厚壁管补强、接管自身补强、补强圈补强都不是整体形式的补强。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712550", "t": 1, "q": "在压力容器设计中，进行壁厚计算时，需考虑多种载荷产生的应力，下列哪种应力不属于由内压引起的薄膜应力范畴？", "a": ["圆锥形容器锥壳部分的轴向应力", "球形容器壳体的径向应力", "圆柱形容器封头与圆筒连接部位的局部应力", "圆柱形容器圆筒部分的周向应力", "", ""], "r": "C", "e": "内压引起的薄膜应力是均匀分布的。而圆柱形容器封头与圆筒连接部位的局部应力是局部区域受约束等产生的，并非均匀分布的内压薄膜应力。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712551", "t": 1, "q": "在压缩机的分类中，某压缩机的工作原理是通过活塞在气缸内的往复运动，使气体的体积减小、压力升高，该压缩机属于？", "a": ["涡旋式压缩机", "往复式压缩机", "离心式压缩机", "螺杆式压缩机", "", ""], "r": "B", "e": "题干描述的是活塞在气缸内往复运动使气体体积减小、压力升高，这是往复式压缩机的工作原理。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712552", "t": 1, "q": "在压缩机的分类中，某压缩机的工作原理是通过两个相互啮合的转子（阳转子和阴转子）的旋转，使气体被吸入、压缩并排出，该压缩机属于？", "a": ["螺杆式压缩机", "涡旋式压缩机", "离心式压缩机", "往复式压缩机", "", ""], "r": "A", "e": "螺杆式压缩机依靠两个相互啮合的阴阳转子旋转来实现气体的吸入、压缩和排出。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712553", "t": 1, "q": "在压缩机的分类中，某压缩机的排气压力为0.8MPa，流量为500m³/min，主要用于空气分离装置，该压缩机最可能是？", "a": ["单级螺杆式压缩机", "多级离心式压缩机", "滑片式压缩机", "单级往复式压缩机", "", ""], "r": "B", "e": "多级离心式压缩机适用于大流量、中低压力的场合，本题中流量大、排气压力适中且用于空气分离装置，符合多级离心式压缩机特点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712554", "t": 1, "q": "在压缩机的性能参数中，“比功率”是指？", "a": ["压缩机单位质量流量消耗的功率", "压缩机单位压力升高消耗的功率", "压缩机单位容积流量消耗的功率", "压缩机单位时间消耗的电能", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712555", "t": 1, "q": "在压缩机的性能曲线中，离心式压缩机的\"喘振线\"是指？", "a": ["压缩机最大流量时的压力边界线", "压缩机效率最高时的流量-压力曲线", "压缩机发生喘振的最小流量边界线", "压缩机额定工况下的流量-压力曲线", "", ""], "r": "C", "e": "喘振线是离心式压缩机发生喘振的最小流量边界线，当流量小于此边界线就可能发生喘振。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712556", "t": 1, "q": "在压缩机的选型中，当输送的气体含有较多粉尘颗粒（如催化裂化装置的烟气），下列哪种压缩机的抗磨损性能最好？", "a": ["离心式压缩机", "往复式压缩机", "滑片式压缩机", "螺杆式压缩机", "", ""], "r": "D", "e": "答案：D螺杆式压缩机在处理含有较多粉尘颗粒的气体时表现出较好的抗磨损性能。螺杆式压缩机的工作原理是通过两个相互啮合的螺杆在机壳内旋转来压缩气体，这种方式使得气体中的固体颗粒不容易直接撞击到机器的关键部件，从而减少了磨损。相比之下，其他类型的压缩机，如离心式、往复式和滑片式，在处理含尘气体时更容易受到磨损的影响。", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712557", "t": 1, "q": "在压缩机的运行中，某离心式压缩机出现\"喘振\"现象，下列处理措施正确的是？", "a": ["增大出口阀门开度", "增加进口流量", "减小进口阀门开度", "降低压缩机转速", "", ""], "r": "B", "e": "喘振是离心式压缩机运行中常见问题，增加进口流量能让压缩机工况远离喘振区。增大出口阀门开度会使出口压力降低，可能加重喘振；减小进口阀门开度会减少进口流量，易引发喘振；降低压缩机转速不一定能有效解决喘振问题。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712558", "t": 1, "q": "在压缩机的运行中，某往复式压缩机出现\"液击\"现象，下列原因中最可能导致该现象的是？", "a": ["进气压力过高", "气缸内进入液体（如冷凝液）", "转速过高", "排气压力过低", "", ""], "r": "B", "e": "“液击”是指液体进入压缩机气缸，由于液体不可压缩，会对压缩机造成损害。进气压力过高、转速过高、排气压力过低一般不会直接导致液击，而气缸内进入液体（如冷凝液）是引发液击的常见原因。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712559", "t": 1, "q": "在压缩机分类中，某压缩机通过转子的旋转使气缸容积周期性变化，从而实现气体的吸入、压缩和排出，且排气压力为15MPa，该压缩机属于哪种类型？", "a": ["往复式压缩机", "滑片式压缩机", "离心式压缩机", "螺杆式压缩机", "", ""], "r": "D", "e": "往复式靠活塞往复运动，离心式靠叶轮旋转产生离心力，均与题干“转子旋转使气缸容积变化”不符；滑片式排气压力一般较低；螺杆式压缩机通过转子旋转改变气缸容积，且能达到15MPa压力。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810620523712560", "t": 1, "q": "在压缩机选型中，某化工装置需要将常压（0.1MPa）的空气压缩至1.0MPa，要求流量（标准状态）为1000Nm³/h，且对排气压力稳定性要求高，下列哪种压缩机更适合？", "a": ["滑片式压缩机", "单级离心式压缩机", "两级往复式压缩机", "单级螺杆式压缩机", "", ""], "r": "C", "e": "本题需根据压缩要求选择合适的压缩机。已知要将常压空气压缩至1.0MPa，流量为1000Nm³/h且对排气压力稳定性要求高。 A选项滑片式压缩机：一般适用于中小流量、较低压力场合，对于本题较高压力比和稳定性要求不太能很好满足。 B选项单级离心式压缩机：单级离心式压缩机压力比通常较低，难以实现从常压到1.0MPa的压缩。 C选项两级往复式压缩机：往复式压缩机适用于中高压场合，两级压缩能满足较高压力比要求，且排气压力稳定，符合本题需求。 D选项单级螺杆式压缩机：单级螺杆式压缩机压力比有限，一般难以达到本题所需的压力提升。综上，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708800", "t": 2, "q": "在化工单元操作的干燥过程中，恒速干燥阶段的特点包括？", "a": ["物料含水量快速下降", "物料表面温度等于干燥介质湿球温度", "干燥速率恒定", "干燥速率由物料内部扩散控制", "", ""], "r": "BC", "e": "恒速干燥阶段，物料表面有充足水分，干燥速率恒定，物料表面温度等于干燥介质湿球温度，含水量匀速下降，此阶段干燥速率由表面汽化控制。A 说快速下降错误；D 由物料内部扩散控制是降速干燥阶段特点。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708801", "t": 2, "q": "在化工单元操作的过滤过程中，滤饼洗涤的目的包括？", "a": ["去除滤饼中的杂质", "回收滤饼中的有价成分", "降低滤饼的含水率", "提高滤液的纯度", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708802", "t": 2, "q": "在化工单元操作的过滤过程中，影响过滤速率的因素有哪些？", "a": ["过滤介质孔径", "滤饼厚度", "过滤压力差", "悬浮液浓度", "", ""], "r": "ABCD", "e": "过滤速率与过滤介质、滤饼、压力差、悬浮液等都有关。过滤介质孔径小会阻碍过滤，孔径大则利于过滤；滤饼越厚阻力越大；压力差大过滤快；悬浮液浓度高会使过滤速率下降。ABCD选项都会影响过滤速率。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708803", "t": 2, "q": "在化工单元操作的结晶过程中，影响晶体粒度的因素有？", "a": ["晶种添加量", "冷却速率", "搅拌强度", "过饱和度", "", ""], "r": "ABCD", "e": "晶种添加量、冷却速率、搅拌强度、过饱和度都会对晶体粒度产生影响。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708804", "t": 2, "q": "在化工单元操作的吸附过程中，影响吸附效果的因素有？", "a": ["吸附质浓度", "吸附时间", "操作温度", "吸附剂比表面积", "", ""], "r": "ACD", "e": "吸附质浓度、操作温度、吸附剂比表面积都会影响吸附效果，吸附时间不是影响吸附效果的本质因素，而是与吸附进程相关。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708805", "t": 2, "q": "在化工单元操作的吸收过程中，提高吸收速率的有效措施有？", "a": ["增大传质推动力（浓度差）", "提高气液相对流速", "增大传质系数", "增大气液接触面积", "", ""], "r": "ABCD", "e": "吸收速率与传质推动力、传质系数、气液接触面积相关，增大传质推动力和传质系数、增大气液接触面积可提高吸收速率，提高气液相对流速可减小气膜和液膜厚度，增大传质系数。ABCD选项措施都能提高吸收速率。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708806", "t": 2, "q": "在化工单元操作的蒸馏过程中，采用填料塔相比板式塔的优点有？", "a": ["造价低", "分离效率高", "操作弹性大", "压降小", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708807", "t": 2, "q": "在化工过程的反应操作中，反应器的温度控制措施包括哪些？", "a": ["夹套冷却或加热", "原料预热或预冷", "内部盘管换热", "惰性气体稀释", "", ""], "r": "ABC", "e": "夹套冷却或加热、原料预热或预冷、内部盘管换热都可直接影响反应器内温度，是常见温度控制措施；而惰性气体稀释主要用于控制反应气氛、降低爆炸风险等，并非直接控制温度的措施。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708808", "t": 2, "q": "在化工过程的反应操作中，选择反应器类型需考虑的因素有？", "a": ["产物纯度要求", "反应热效应", "反应速率", "反应物相态", "", ""], "r": "ABCD", "e": "选择反应器类型要综合多方面因素，反应热效应影响温度控制，反应速率决定反应时间和效率，反应物相态决定反应器的传质等特性，产物纯度要求也会影响反应器设计。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708809", "t": 2, "q": "在化工过程的反应操作中，影响反应速率的主要因素有？", "a": ["反应物浓度", "反应压力", "催化剂活性", "反应温度", "", ""], "r": "ACD", "e": "在化工过程的反应操作中，影响反应速率的因素众多，但可以从以下几个方面进行简明扼要的分析：### 影响反应速率的主要因素1. 反应物浓度：反应物浓度越高，单位体积内的反应物分子数越多，碰撞频率越高，反应速率越快。2. 反应温度：温度升高，分子运动加剧，碰撞频率和能量增加，反应速率加快。3. 催化剂活性：催化剂能够降低反应的活化能，从而加速反应速率。### 非主要因素 反应压力：对于大多数化学反应，压力的影响相对较小，除非涉及气体分子数变化显著的反应。### 结论综合以上分析，影响化工过程反应速率的主要因素包括反应物浓度、催化剂活性和反应温度。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708810", "t": 2, "q": "在化工过程的干燥操作中，影响干燥速率的因素有？", "a": ["干燥介质流速", "物料粒径", "干燥介质温度、湿度", "物料含水量", "", ""], "r": "ABCD", "e": "干燥介质流速、温度和湿度会影响传质传热，物料粒径影响接触面积与传质效率，物料含水量是干燥的对象条件，这些都会影响干燥速率。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708811", "t": 2, "q": "在化工过程的精馏操作中，影响精馏塔分离效果的主要因素有哪些？", "a": ["塔板数（或填料高度）", "进料状态", "回流比", "操作压力", "", ""], "r": "ABCD", "e": "塔板数或填料高度影响气液接触传质，进料状态影响塔内气液负荷分布，回流比是重要操作参数影响分离效果，操作压力影响物系相平衡进而影响分离。ABCD四个因素都对精馏塔分离效果有主要影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708812", "t": 2, "q": "在化工过程的能量衡算中，需考虑的能量形式包括？", "a": ["热能", "化学能", "势能", "动能", "", ""], "r": "ABCD", "e": "化工过程能量衡算要考虑多种能量形式。热能在化工反应和传热等过程常见；化学能在化学反应中会发生转化；势能如流体在不同高度有不同势能；动能如流体流动具有动能。ABCD选项所涉及的能量形式在化工过程能量衡算中都需考虑。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708813", "t": 2, "q": "在化工过程的物料衡算中，连续操作过程的物料衡算需满足的基本方程包括？", "a": ["输入物料量=输出物料量+积累物料量", "总物料衡算优先级高于组分衡算", "对于稳态过程，积累物料量=0", "各组分的物料衡算需分别进行", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708814", "t": 2, "q": "在化工过程的吸收操作中，选择填料的要求包括？", "a": ["耐腐蚀性好", "机械强度高", "比表面积大", "空隙率高", "", ""], "r": "ABCD", "e": "化工吸收操作中，填料需接触腐蚀性介质，所以要耐腐蚀性好；在装填和操作时要承受一定压力，需机械强度高；比表面积大才能为气液传质提供更大接触面积；空隙率高可减小气体通过阻力。ABCD选项均是选择填料的要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708815", "t": 2, "q": "在化工过程的蒸发操作中，多效蒸发相比单效蒸发的优势有哪些？", "a": ["降低设备投资", "减少冷却水消耗量", "节省加热蒸汽消耗量", "提高蒸发速率", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708816", "t": 2, "q": "在离心泵的汽蚀余量计算中，影响装置汽蚀余量（NPSHa）的因素有哪些？", "a": ["吸入管路阻力", "泵的安装高度", "吸入液面压力", "介质蒸汽压", "", ""], "r": "ABCD", "e": "装置汽蚀余量NPSHa与吸入管路情况、安装高度、吸入液面压力、介质蒸汽压有关。吸入管路阻力大、泵安装高度高会使NPSHa减小；吸入液面压力高、介质蒸汽压低则NPSHa增大。ABCD选项均是影响 NPSHa的因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708817", "t": 2, "q": "在离心泵的性能调节中，改变转速调节的优点包括？", "a": ["操作简单", "无附加阻力损失", "效率高", "调节范围广", "", ""], "r": "BCD", "e": "改变转速调节离心泵性能，不额外增加阻力部件，所以无附加阻力损失；且在调节过程中能使泵在高效区工作，效率高；还可在较宽范围内改变流量和扬程，调节范围广。而操作并不简单，需专门设备控制。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708818", "t": 2, "q": "在离心泵的运行中，可能导致泵流量不足的原因有哪些？", "a": ["进口管路堵塞", "叶轮磨损", "出口阀门开度不足", "泵轴与电机轴不同心", "", ""], "r": "ABC", "e": "进口管路堵塞、叶轮磨损、出口阀门开度不足都会影响泵的流量，进口堵塞减少进入量，叶轮磨损降低做功能力，出口阀门开度小限制流出。泵轴与电机轴不同心主要影响泵的振动和稳定性，对流量影响不大。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708819", "t": 2, "q": "在离风式压缩机的喘振现象中，喘振的特征包括哪些？", "a": ["排气压力剧烈波动", "排气温度急剧下降", "机体剧烈振动", "流量周期性变化", "", ""], "r": "ACD", "e": "离心式压缩机喘振时，排气压力会剧烈波动，机体也会剧烈振动，流量会周期性变化；而喘振时排气温度是急剧上升而非下降。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708820", "t": 2, "q": "在离心式压缩机的结构中，防止气体泄漏的密封装置包括哪些？", "a": ["填料密封", "浮环密封", "迷宫密封", "机械密封", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708821", "t": 2, "q": "在离心式压缩机的性能调节中，常用的调节方法有哪些？", "a": ["进口节流调节", "进口导流叶片调节", "出口节流调节", "变转速调节", "", ""], "r": "ABCD", "e": "离心式压缩机常用性能调节方法包括进口节流、进口导流叶片、出口节流和变转速调节。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708822", "t": 2, "q": "在离心式压缩机的运行中，防止喘振的措施有哪些？", "a": ["设置防喘振回路，保证最小流量", "改变压缩机转速", "降低压缩机进口压力", "调节出口阀门开度，控制流量", "", ""], "r": "ABD", "e": "设置防喘振回路保证最小流量可避免进入喘振区；改变压缩机转速能使性能曲线变化，防止喘振；调节出口阀门开度控制流量也可防止喘振。而降低压缩机进口压力会增加喘振风险。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708823", "t": 2, "q": "在离心式压缩机的运行中，进口导叶调节的作用包括？", "a": ["改变进气流量", "防止喘振", "调整压缩机性能曲线", "提高压缩机效率", "", ""], "r": "ABCD", "e": "进口导叶调节可改变进气角度，从而改变进气流量，还能调整压缩机性能曲线，使压缩机在不同工况下运行，避免喘振发生，且能提高压缩机效率。ABCD选项均符合其作用。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708824", "t": 2, "q": "在螺杆式压缩机的选型中，需考虑的技术参数有哪些？", "a": ["介质含油量要求", "噪声水平", "冷却方式", "排气压力、排气量", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708825", "t": 2, "q": "在螺杆式压缩机的运行维护中，需关注的关键参数有？", "a": ["排气温度", "振动值", "油位高度", "吸气压力", "", ""], "r": "ABCD", "e": "螺杆式压缩机运行中，排气温度过高可能导致部件损坏等问题；振动值异常反映压缩机运行不稳定；油位高度不足会影响润滑和冷却；吸气压力异常会影响压缩机性能。这些都是需关注的关键参数。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708826", "t": 2, "q": "在螺杆式压缩机的运行中，润滑油的作用包括？", "a": ["密封间隙", "润滑运动部件", "冷却压缩气体", "降低排气噪声", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708827", "t": 2, "q": "在压力容器的安全操作中，操作人员需遵守的规定包括？", "a": ["严禁超压、超温操作", "介质充装量不得超过规定", "容器运行时不得拆卸螺栓", "定期检查安全附件", "", ""], "r": "ABCD", "e": "ABCD选项均是压力容器安全操作中操作人员需遵守规定，超压超温易引发危险；介质充装量超规定会有安全隐患；运行中拆卸螺栓可能造成泄漏等事故；定期检查安全附件能保障容器安全运行。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708828", "t": 2, "q": "在压力容器的安全附件中，压力表的选用需考虑的因素有？", "a": ["介质兼容性", "安装位置", "精度等级", "量程范围", "", ""], "r": "ACD", "e": "选用压力表时，要确保其与介质兼容，避免腐蚀等问题；精度等级关乎测量的准确程度；量程范围需能覆盖容器正常工作压力及可能出现的压力变化。安装位置主要影响观测便利性，并非选用需重点考虑因素。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708829", "t": 2, "q": "在压力容器的安装过程中，需符合的要求有？", "a": ["支座安装牢固，受力均匀", "接管法兰密封面清洁完好", "与管道连接时无强制对口", "安装位置符合设计图纸", "", ""], "r": "ABCD", "e": "压力容器安装时，支座要牢固且受力均匀保证稳定；接管法兰密封面清洁完好可防止泄漏；与管道连接无强制对口避免应力集中；安装位置按设计图纸确保符合要求。ABCD选项均为安装需符合的要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708830", "t": 2, "q": "在压力容器的腐蚀控制中，有效的控制措施有哪些？", "a": ["添加缓蚀剂", "选择耐蚀材料", "定期进行腐蚀检测", "采用防腐涂层", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708831", "t": 2, "q": "在压力容器的日常检查中，安全附件的检查内容包括？", "a": ["压力表指针是否归零", "安全阀是否在校验有效期内", "爆破片是否有变形", "液位计是否清晰可见", "", ""], "r": "BCD", "e": "安全附件检查主要关注其有效性和可靠性。B选项安全阀在校验有效期内才能保证正常工作；C选项爆破片无变形才能在规定压力下正常发挥作用；D选项液位计清晰可见才能准确显示液位。而压力表正常工作时指针会随压力变化，不是要归零。所以答案选BCD。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708832", "t": 2, "q": "在压力容器的日常维护中，防止容器腐蚀的措施包括？", "a": ["定期涂覆防腐涂层", "避免容器超温超压运行", "定期排放容器内积液", "控制介质的pH值", "", ""], "r": "ACD", "e": "涂防腐涂层可隔绝介质与容器接触防腐蚀；控制介质pH值能减少腐蚀；定期排放积液可减少积液对容器的腐蚀。而避免超温超压运行主要是保障容器安全，与防腐蚀关系不大。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708833", "t": 2, "q": "在压力容器的日常维护中，需定期检查的内容包括？", "a": ["容器壁厚减薄情况", "安全附件完好性", "容器外表面腐蚀情况", "焊缝及接管有无泄漏", "", ""], "r": "ABCD", "e": "压力容器日常维护定期检查要关注容器本身状况及安全附件，ABCD选项分别涉及容器壁厚、安全附件、外表面腐蚀和泄漏情况，都是需定期检查内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708834", "t": 2, "q": "在压力容器的水压试验中，判断试验合格的标准包括？", "a": ["容器无可见变形", "保压时间满足规范要求", "保压期间压力无明显下降", "焊缝及接管无渗漏", "", ""], "r": "ABCD", "e": "水压试验合格需容器无可见变形、保压时间符合规范、保压时压力无明显下降且焊缝及接管无渗漏。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708835", "t": 2, "q": "在压力容器的水压试验中，试验前需准备的工作包括？", "a": ["安全附件安装齐全", "压力表校验合格", "容器内清理干净", "制定应急预案", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708836", "t": 2, "q": "在压力容器的水压试验中，需符合的要求有？", "a": ["试验温度不低于5℃", "试验压力为设计压力的1.25-1.5倍", "试验介质为洁净水", "保压时间不少于30分钟", "", ""], "r": "ABCD", "e": "逐一分析各选项： A选项，水压试验温度不低于5℃是为防结冰，合理。 B选项，试验压力一般是设计压力的1.25 - 1.5倍，符合规定。 C选项，用洁净水可防止杂质损伤容器。 D选项，保压时间不少于30分钟能充分检验容器性能。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708837", "t": 2, "q": "在压力容器设计中，采用补强圈补强的适用条件包括？", "a": ["开孔直径≤800mm", "设计压力≤4MPa", "补强圈厚度≤1.5倍壳体厚度", "壳体厚度≤38mm", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708838", "t": 2, "q": "在压力容器设计中，当容器存在大开孔时，需进行补强设计的原因是？", "a": ["开孔影响容器的整体刚度", "开孔削弱壳体有效壁厚", "开孔改变介质流动状态", "开孔导致壳体局部应力集中", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708839", "t": 2, "q": "在压力容器设计中，介质静压力的计算应考虑的因素有？", "a": ["介质高度", "操作压力", "介质密度", "重力加速度", "", ""], "r": "ACD", "e": "介质静压力计算公式为「test/yiwen_img/importSubject/2034810617763860480.png」，P是静压力，「test/yiwen_img/importSubject/2034810618023907328.png」是介质密度，g是重力加速度，h是介质高度。所以计算介质静压力要考虑介质高度、介质密度和重力加速度。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708840", "t": 2, "q": "在压力容器设计中，介质为剧毒或高度危害时，需采取的特殊措施有？", "a": ["增加腐蚀裕量", "设置双重密封", "采用整体锻造封头", "焊接接头100%无损检测", "", ""], "r": "BD", "e": "对于剧毒或高度危害介质的压力容器，为确保安全，需严格保证密封性和质量。双重密封可增强密封效果，100%无损检测能保证焊接质量。而增加腐蚀裕量主要针对有腐蚀情况；整体锻造封头并非是剧毒或高度危害介质容器的特殊必选措施。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708841", "t": 2, "q": "在压力容器设计中，进行壁厚计算时需考虑的载荷包括？", "a": ["风载荷", "内压或外压", "地震载荷", "介质静压力", "", ""], "r": "BD", "e": "在压力容器设计中，壁厚计算主要关注的是容器内部的压力情况。我们可以从以下几个方面进行简要分析：* A选项：风载荷。这主要影响建筑物或大型结构的外部稳定性，与压力容器的壁厚计算关系不大。* B选项：内压或外压。这是直接影响压力容器壁厚的关键因素。容器需要能够承受内部的气体或液体压力，或外部施加的压力，因此这是个核心考虑因素。* C选项：地震载荷。虽然地震可能会对容器造成影响，但它不是壁厚计算的直接考虑因素。* D选项：介质静压力。这与容器内部的介质状态有关，也是影响壁厚的重要因素。综上所述，进行壁厚计算时，主要需考虑的是内压或外压以及介质静压力。所以，正确答案是BD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708842", "t": 2, "q": "在压力容器设计中，考虑地震载荷时需计算的载荷分量包括？", "a": ["水平地震力", "垂直地震力", "地震弯矩", "地震扭矩", "", ""], "r": "ABC", "e": "在压力容器设计考虑地震载荷时，水平地震力、垂直地震力和地震弯矩都是需要计算的重要载荷分量，而地震扭矩通常不是常规需计算内容。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708843", "t": 2, "q": "在压力容器设计中，壳体材料的力学性能指标包括哪些？", "a": ["冲击韧性", "伸长率", "抗拉强度", "屈服强度", "", ""], "r": "ABCD", "e": "压力容器设计中，冲击韧性反映材料抵抗冲击载荷能力；伸长率体现材料塑性变形能力；抗拉强度是材料在拉伸过程中所能承受的最大应力；屈服强度表示材料开始产生明显塑性变形时的应力，这些都是壳体材料重要力学性能指标。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708844", "t": 2, "q": "在压缩机的排气量调节中，常用的调节方法有？", "a": ["进气节流调节", "变转速调节", "回流调节", "卸载调节", "", ""], "r": "ABCD", "e": "压缩机排气量调节常见方法有进气节流、变转速、回流、卸载调节等。ABCD选项涵盖了常用调节方法。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708845", "t": 2, "q": "在压缩机的选型中，根据排气压力不同，压缩机可分为？", "a": ["超高压压缩机（排气压力>100MPa）", "中压压缩机（1MPa<排气压力≤10MPa）", "低压压缩机（排气压力≤1MPa）", "高压压缩机（10MPa<排气压力≤100MPa）", "", ""], "r": "ABCD", "e": "压缩机按排气压力分类，可分为低压（排气压力≤1MPa）、中压（1MPa<排气压力≤10MPa）、高压（10MPa<排气压力≤100MPa）、超高压（排气压力>100MPa）。ABCD选项均符合该分类标准。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708846", "t": 2, "q": "在压缩机的选型中，根据输送介质特性需考虑的因素包括？", "a": ["介质的易燃易爆性", "介质的分子量", "介质的含尘量", "介质的腐蚀性", "", ""], "r": "ACD", "e": "答案：ACD在压缩机的选型中，需要考虑输送介质的特性以确保压缩机的安全、高效运行。易燃易爆性（A）关系到压缩机的防爆设计；含尘量（C）影响压缩机的耐磨和除尘设计；腐蚀性（D）决定压缩机材料的选用。而分子量（B）一般不是压缩机选型时直接考虑的主要特性。", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708847", "t": 2, "q": "在压缩机的运行过程中，可能导致排气温度过高的原因有？", "a": ["冷却效果不佳", "气缸余隙过大", "压缩比过大", "进气温度过高", "", ""], "r": "ACD", "e": "冷却效果差不能有效降温，压缩比大、进气温度高都会让压缩过程产生更多热量，这些都会使排气温度升高；而气缸余隙过大主要影响容积效率，一般不会导致排气温度过高。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810622293708848", "t": 2, "q": "在压缩机的运行中，导致排气量下降的原因有？", "a": ["冷却水温过高", "进气过滤器堵塞", "气缸磨损", "阀门泄漏", "", ""], "r": "ABCD", "e": "答案：ABCD压缩机排气量下降的原因有很多，以下是针对选项中的原因进行分析：A. 冷却水温过高：当冷却水温过高时，压缩机的冷却效果会降低，导致压缩机内部温度升高。高温会使得气体的密度降低，从而影响压缩机的排气量。B. 进气过滤器堵塞：进气过滤器的作用是过滤进入压缩机的气体中的杂质。如果过滤器堵塞，会减少进入压缩机的气体量，从而导致排气量下降。C. 气缸磨损：气缸磨损会导致压缩机的压缩比降低，从而影响排气量。气缸磨损还会导致气体泄漏，进一步降低排气量。D. 阀门泄漏：阀门泄漏会导致压缩过程中的气体泄漏，从而降低压缩机的排气量。阀门泄漏还会导致压缩机的效率降低，进一步影响排气量。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753792", "t": 3, "q": "在过程控制的串级控制系统中，副回路的响应速度应比主回路慢，以避免副回路干扰主回路。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。在串级控制系统中，副回路响应速度应比主回路快，这样副回路能快速克服进入其中的干扰，及时将被控变量的变化反映到主控制器，使主控制器及时调整控制作用，提高系统控制质量，而不是慢。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753793", "t": 3, "q": "在过程控制的串级控制系统中，副控制器的设定值由操作人员手动设定，主控制器的输出不影响副控制器。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级控制系统中，主控制器的输出是副控制器的设定值，并非由操作人员手动设定，且主控制器输出会影响副控制器。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753794", "t": 3, "q": "在过程控制的串级控制系统中，若副回路的时间常数是主回路的1/10以下，副回路可快速克服干扰，不影响主回路稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在串级控制系统里，当副回路时间常数是主回路1/10以下时，副回路响应快，能迅速对干扰作出反应并克服，减少干扰对主回路影响，保证主回路稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753795", "t": 3, "q": "在过程控制的串级控制系统中，主控制器的比例系数应比副控制器的比例系数大，以保证主回路的控制精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753796", "t": 3, "q": "在过程控制的反馈控制系统中，被控对象的时间滞后越大，系统的稳定性越好，响应速度越慢。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在反馈控制系统中，被控对象时间滞后越大，会使系统稳定性变差，因为滞后会导致信号不能及时反馈和调整，影响系统动态平衡；同时响应速度也会变慢，所以题干中说稳定性越好错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753797", "t": 3, "q": "在过程控制的反馈控制系统中，测量变送器的误差会直接导致被控变量的静态偏差，误差越大，静态偏差越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在反馈控制系统中，测量变送器误差会使控制器接收到的信号与实际被控变量有偏差，从而造成被控变量静态偏差，误差和静态偏差正相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753798", "t": 3, "q": "在过程控制的反馈控制系统中，系统的过渡过程时间越长，表明系统的响应速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "过渡过程时间长意味着系统从一个状态到另一个状态所需时间久，响应速度应是慢，而不是快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753799", "t": 3, "q": "在过程控制的前馈-反馈复合控制系统中，前馈控制用于克服不可测干扰，反馈控制用于消除静态偏差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前馈控制可针对可测且影响大的干扰进行补偿，能及时克服干扰；反馈控制依据被控量偏差工作，可消除静态偏差。题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753800", "t": 3, "q": "在过程控制的前馈控制系统中，前馈控制器的输出直接作用于被控对象，无需与反馈信号比较。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前馈控制是按干扰作用的大小进行控制，前馈控制器输出直接作用于被控对象，不与反馈信号比较。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753801", "t": 3, "q": "在过程控制的前馈控制中，如果干扰信号无法准确测量，则前馈控制无法有效发挥作用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前馈控制是按干扰进行补偿的控制，需准确测量干扰信号才能计算合适的控制量去抵消干扰影响，若无法准确测量，就难以有效发挥作用。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753802", "t": 3, "q": "在过程控制的系统过渡过程中，超调量为零表明系统无振荡，属于单调衰减过程，这种过程的稳定性最好，但响应速度较慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超调量为零意味着系统输出不会超过最终稳态值，没有振荡就是单调变化，单调衰减过程稳定性好但变化慢所以响应速度慢。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753803", "t": 3, "q": "在过程控制的PID控制器参数整定中，临界比例度法需将控制器置于纯比例作用下，寻找系统临界振荡时的比例度和振荡周期。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "临界比例度法的确是先把控制器设为纯比例作用，通过调整比例度使系统达到临界振荡状态，记录此时的临界比例度和振荡周期。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753804", "t": 3, "q": "在过程控制的PID控制器中，比例作用是唯一能单独使用的控制作用，积分和微分作用不能单独使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在PID控制器中，比例作用可单独使用，但积分和微分作用也能单独使用，只是实际中较少单独用积分和微分控制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753805", "t": 3, "q": "在过程控制的PID控制器中，积分时间越大，积分作用越强，消除静态偏差的能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在PID控制器中，积分时间越大，积分作用越弱，消除静态偏差的能力越弱，并非越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753806", "t": 3, "q": "在过程控制的PID控制器中，积分作用的存在会导致系统响应出现滞后，降低系统的快速性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753807", "t": 3, "q": "在过程控制的PID控制器中，积分作用越强（积分时间越小），系统消除静态偏差的速度越快，但易导致系统振荡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在PID控制器里，积分作用主要用于消除静态偏差。积分时间越小，积分作用越强，能加快消除静态偏差的速度，但也会使系统超调增大，容易引发振荡。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753808", "t": 3, "q": "在过程控制的PID控制器中，微分作用对高频干扰信号敏感，因此在存在高频噪声的系统中应减弱微分作用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "微分环节主要反映偏差信号的变化率，高频干扰信号变化率大，会使微分作用输出大幅变化，影响系统稳定性，所以存在高频噪声的系统应减弱微分作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753809", "t": 3, "q": "在过程控制的PID控制器中，微分作用可预测偏差的变化趋势，提前给出控制信号，因此能提高系统的响应速度和稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PID控制器中，微分作用的确能根据偏差变化率预测偏差变化趋势，提前输出控制信号，有助于加快系统响应、增强稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753810", "t": 3, "q": "在过程控制基础中，闭环控制系统的稳定性仅取决于控制器的参数，与被控对象特性无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。闭环控制系统的稳定性不仅与控制器参数有关，还和被控对象特性相关。被控对象的动态特性会影响系统的稳定性，不同的被控对象特性需要适配不同的控制器参数来保证系统稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753811", "t": 3, "q": "在过程设备成型工艺中，焊接后的热处理仅用于消除焊接残余应力，对焊接接头的力学性能无影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "焊接后的热处理不仅能消除焊接残余应力，还会影响焊接接头的力学性能，比如改善接头的韧性、降低硬度等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753812", "t": 3, "q": "在过程设备的成型工艺中，卷板机卷制筒节时，钢板的屈服强度越高，所需的卷制压力越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "屈服强度高意味着材料抵抗塑性变形的能力强，卷板机卷制筒节时要使钢板发生塑性变形就需要更大压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753813", "t": 3, "q": "在过程设备的焊接中，采用氩弧焊焊接不锈钢时，应采用直流正接，以保证电弧稳定和焊缝质量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "氩弧焊焊接不锈钢时用直流反接，不是正接，正接会使焊件温度过高且不利于清除氧化膜。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753814", "t": 3, "q": "在过程设备的焊接中，对接接头的应力集中系数比角接接头小，因此对接接头的承载能力更强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对接接头应力集中系数小，应力分布更均匀，相比角接接头在承受载荷时更不易出现应力集中导致的破坏，所以承载能力更强。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753815", "t": 3, "q": "在过程设备的无损检测中，磁粉检测可用于检测所有材料焊接接头的表面缺陷，包括奥氏体不锈钢。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "磁粉检测适用于铁磁性材料，奥氏体不锈钢是非铁磁性材料，不能用磁粉检测其焊接接头表面缺陷。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753816", "t": 3, "q": "在化工单元操作的萃取过程中，萃取剂与稀释剂的密度差异越大，两相分层速度越快，分离效果越好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "萃取时萃取剂与稀释剂密度差异大，利于两相因密度不同而快速分层，能提高分离效果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753817", "t": 3, "q": "在化工单元操作的萃取过程中，萃取选择性是指萃取剂对溶质和稀释剂的溶解能力差异，选择性越高，分离效果越好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "萃取选择性的确是指萃取剂对溶质和稀释剂溶解能力的差异，选择性高意味着能更好地分离溶质和稀释剂，分离效果就越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753818", "t": 3, "q": "在化工单元操作的萃取过程中，若萃取剂与溶质的沸点差异较大，后续萃取剂回收可采用蒸馏法，操作简便。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "因为萃取剂与溶质沸点差异较大符合蒸馏法分离的条件，蒸馏法能有效分离二者，且操作相对简便，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753819", "t": 3, "q": "在化工单元操作的干燥过程中，干燥介质的温度越高，干燥速率越快，因此干燥介质温度应尽可能高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽温度高干燥速率快，但温度过高可能使物料变质、损坏设备、增加能耗等，所以不能一味追求高温。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753820", "t": 3, "q": "在化工单元操作的干燥过程中，降速干燥阶段的干燥速率主要由物料内部水分扩散速率控制，与干燥介质条件无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "降速干燥阶段，物料内部水分扩散速率慢成为控制因素，此时干燥速率主要取决于物料内部水分扩散速率，受干燥介质条件影响小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753821", "t": 3, "q": "在化工单元操作的干燥过程中，物料的临界含水量越大，恒速干燥阶段越长，干燥时间越短。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物料临界含水量越大，意味着恒速干燥阶段结束得早，恒速干燥阶段越短，干燥时间越长。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753822", "t": 3, "q": "在化工单元操作的过滤过程中，过滤压力差越大，过滤速率越快，因此过滤压力差应尽可能大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然过滤压力差越大过滤速率越快，但过大压力差可能使滤饼被压实、损坏过滤介质等，所以不能无限制增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753823", "t": 3, "q": "在化工单元操作的过滤过程中，滤饼阻力随过滤时间的延长而增大，主要是因为滤饼厚度增加导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "过滤时，滤饼不断堆积，厚度逐渐增加，流体通过滤饼的通道变长、变窄，阻力增大。所以滤饼阻力随过滤时间延长而增大主要是滤饼厚度增加所致。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753824", "t": 3, "q": "在化工单元操作的过滤过程中，助滤剂的作用是提高过滤速率，防止过滤介质堵塞。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "助滤剂能形成疏松饼层，使滤液畅流，可提高过滤速率，且能防止颗粒堵塞过滤介质孔隙。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753825", "t": 3, "q": "在化工单元操作的结晶过程中，过饱和度越大，晶核生成速率越快，析出的晶体颗粒越细小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在结晶过程里，过饱和度大时，晶核生成速率加快，晶核数量多，会使析出晶体颗粒细小。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753826", "t": 3, "q": "在化工单元操作的吸收过程中，吸收剂用量越多，吸收速率越快，因此吸收剂用量应无限增加。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "吸收剂用量增加会使吸收速率加快，但无限增加吸收剂用量会带来诸多问题，如设备尺寸增大、能耗增加、成本上升等，不经济且不合理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753827", "t": 3, "q": "在化工单元操作的吸收过程中，液气比（L/G）减小，出口气体中溶质浓度升高，吸收塔的吸收效率降低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "吸收过程中，液气比（L/G）减小，意味着吸收剂用量相对减少，吸收推动力变小，对溶质的吸收能力减弱，所以出口气体中溶质浓度会升高，吸收效率降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753828", "t": 3, "q": "在化工单元操作的蒸馏过程中，相对挥发度等于1的二元混合溶液，无法通过普通精馏实现分离。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "蒸馏分离的依据是各组分挥发度差异，相对挥发度等于1意味着两组分挥发能力相同，普通精馏难以利用挥发度差异分离。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753829", "t": 3, "q": "在化工过程的反应操作中，催化剂只能加快反应速率，不能改变反应的平衡转化率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "催化剂能同等程度改变正逆反应速率，缩短达到平衡的时间，但不影响平衡移动，所以不能改变反应的平衡转化率。该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753830", "t": 3, "q": "在化工过程的精馏操作中，回流比越大，精馏塔的分离效果越好，因此回流比应尽可能大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "回流比增大分离效果会变好，但过大的回流比会使能耗大幅增加、设备投资加大等，经济上不合理，所以不能一味增大回流比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753831", "t": 3, "q": "在化工过程的物料衡算中，稳态过程的积累物料量为零，因此输入物料量等于输出物料量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稳态过程的特点就是系统内各参数不随时间变化，积累物料量为零，根据物料衡算原理，此时输入物料量必然等于输出物料量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753832", "t": 3, "q": "在化工过程的吸收操作中，操作温度升高，气体的溶解度降低，吸收速率减慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "温度对气体溶解度影响显著，温度升高，气体溶解度降低，吸收推动力减小，所以吸收速率会减慢。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753833", "t": 3, "q": "在化工过程的吸收操作中，填料塔的填料高度越高，吸收效果越好，因此填料高度应无限增加。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然填料高度增加能提升吸收效果，但无限增加会使设备成本大幅上升、流体阻力增大、操作能耗增加等，不具有实际可行性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753834", "t": 3, "q": "在化工过程的吸收操作中，相平衡常数m值越大，表明溶质在气相中的溶解度越大，吸收越容易进行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "相平衡常数m值越大，说明溶质在气相中相对含量越高，在液相中溶解度越小，吸收越难进行。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753835", "t": 3, "q": "在化工过程的蒸发操作中，多效蒸发的效数越多，节能效果越好，因此效数应尽可能多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多效蒸发效数增加节能效果提升，但效数过多，设备投资、操作费用大幅增加，且受蒸汽和溶液沸点限制，并非效数越多越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753836", "t": 3, "q": "在化工过程的蒸馏操作中，操作压力降低，混合溶液的相对挥发度增大，分离效果提高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "蒸馏中降低操作压力，气相中各组分的分压降低，分子间作用力减弱，混合溶液相对挥发度增大，更利于组分分离，分离效果提高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753837", "t": 3, "q": "在化工过程的蒸馏操作中，进料热状态为饱和蒸汽时，其q值（进料热状态参数）等于0，此时精馏段和提馏段的上升蒸汽量相等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "q值定义为1kmol进料变为饱和蒸汽所需热量与1kmol进料汽化潜热之比，饱和蒸汽进料时，无需额外热量变为饱和蒸汽，q = 0；根据精馏塔物料衡算关系，q = 0时精馏段和提馏段上升蒸汽量相等。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753838", "t": 3, "q": "在化工过程的蒸馏操作中，进料位置不当会导致精馏段或提馏段塔板数不足，降低分离效果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "进料位置不当，会使精馏段和提馏段的物料组成与设计情况不匹配，造成精馏段或提馏段塔板数相对不足，进而影响分离效果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753839", "t": 3, "q": "在化工过程的蒸馏操作中，塔板效率为100%时，实际塔板数等于理论塔板数，表明该塔板的传质效果达到理想状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "塔板效率反映实际塔板传质效果与理论塔板的差距，塔板效率100%意味着实际塔板传质效果和理论一样，此时实际塔板数就等于理论塔板数。", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753840", "t": 3, "q": "在压力容器设计中，壁厚计算仅需考虑内压或外压产生的应力，无需考虑其他载荷。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压力容器设计时，壁厚计算除考虑内压或外压产生的应力，还需考虑其他载荷，如重力、风载荷、地震载荷等。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810623438753841", "t": 3, "q": "在压力容器设计中，大开孔的补强设计必须采用整体补强（如厚壁管补强），不能采用补强圈补强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大开孔补强设计并非只能用整体补强，补强圈补强在一定条件下也可用于大开孔。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第6章 机械工艺技术（1）", "n": "基础练习题【含解析】 / 第6章 机械工艺技术（1）", "qs": [{"id": "2034810627217821696", "t": 1, "q": "机电传动控制中，\"变极调速\"适用于", "a": ["伺服电动机", "步进电动机", "直流电动机", "三相异步电动机", "", ""], "r": "D", "e": "变极调速是通过改变定子绕组的连接方式来改变电机磁极对数，从而实现调速，这是三相异步电动机特有的调速方法。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821697", "t": 1, "q": "机电传动控制中，\"步进电动机\"的主要特点是", "a": ["能实现精确的角位移和转速控制", "无需控制器即可工作", "具有较大的启动转矩", "转速高，功率大", "", ""], "r": "A", "e": "步进电机能将电脉冲信号转换为角位移或线位移，通过控制脉冲数量和频率可精确控制角位移和转速。它需控制器，启动转矩不大，转速不高、功率也不大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821698", "t": 1, "q": "机电传动控制中，\"伺服系统\"的主要功能是", "a": ["保护电机免受过载损坏", "实现电机的调速", "将电信号转换为机械位移或转速，并保证运动精度", "控制电机的启动和停止", "", ""], "r": "C", "e": "伺服系统能接收电信号指令，将其转换为机械位移或转速，且可精确控制保证运动精度。A选项保护电机免受过载损坏一般由保护装置完成；B选项调速只是其部分功能；D选项控制启动和停止并非主要功能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821699", "t": 1, "q": "机电传动控制中，\"电机的额定功率\"是指", "a": ["电机长期工作时允许的最大功率", "电机输入的电功率", "电机的最大功率", "电机输出的机械功率", "", ""], "r": "A", "e": "答案：A电机的额定功率是指电机在长期工作时允许的最大功率，即电机能够持续稳定工作的最大功率，而不是瞬时的最大功率或输入的电功率。选项D“电机输出的机械功率”虽然与电机的功率相关，但它指的是电机转换后的机械能功率，并不等同于额定功率的定义。", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821700", "t": 1, "q": "机电传动控制中，\"继电器-接触器控制\"相比PLC控制的主要缺点是", "a": ["无法实现电机正反转控制", "控制精度低", "体积大、可靠性低、接线复杂", "无法实现电机调速", "", ""], "r": "C", "e": "继电器 - 接触器控制是传统控制方式，其元件多、体积大，触点易磨损导致可靠性低，且接线复杂；而 PLC 控制则更紧凑、可靠、接线简单。选项 A，继电器 - 接触器能实现电机正反转控制；选项 B，控制精度并非其主要缺点；选项 D，它也可实现电机调速。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821701", "t": 1, "q": "机电传动控制中，\"降压启动\"的主要目的是", "a": ["提高电机的启动转矩", "提高电机的功率因数", "缩短电机的启动时间", "降低电机的启动电流，保护电机和电网", "", ""], "r": "D", "e": "降压启动是通过降低启动电压来减小启动电流，避免过大电流损坏电机和冲击电网。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821702", "t": 1, "q": "机电传动控制中，\"能耗制动\"的原理是", "a": ["将电机定子绕组短接，利用转子电流产生的制动转矩停车", "切断电机电源，利用电机惯性自由停车", "在电机定子绕组中通入直流电流，产生静止磁场，使转子产生制动转矩", "改变电机定子绕组电源相序，产生反向转矩制动", "", ""], "r": "C", "e": "能耗制动是在电机定子绕组通入直流电流，形成静止磁场，转子切割此磁场产生制动转矩。A选项定子绕组短接不是能耗制动方式；B选项是自由停车，非能耗制动；D选项是反接制动原理。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821703", "t": 1, "q": "机电传动控制中，“无刷直流电机”相比有刷直流电机的主要优点是", "a": ["成本低、结构简单", "调速范围窄", "无需换向器和电刷，可靠性高、寿命长", "启动转矩大", "", ""], "r": "C", "e": "无刷直流电机没有换向器和电刷，减少了磨损和故障点，所以可靠性高、寿命长。有刷直流电机结构更简单成本也更低，无刷直流电机调速范围宽，启动转矩并非其主要优势。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821704", "t": 1, "q": "机电传动控制中，\"PLC梯形图\"的编程元素不包括", "a": ["常开触点", "常闭触点", "指令语句", "线圈", "", ""], "r": "C", "e": "PLC梯形图编程元素有常开触点、常闭触点、线圈等，指令语句是指令表编程的内容，不是梯形图编程元素。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821705", "t": 1, "q": "机电传动控制中，电机的\"堵转转矩\"是指", "a": ["电机转速为零时输出的转矩", "电机启动瞬间输出的最大转矩", "电机能长期承受的最大转矩", "电机在额定转速下输出的转矩", "", ""], "r": "A", "e": "堵转指电机轴被卡住无法转动，此时转速为零，堵转转矩就是电机转速为零时输出的转矩。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821706", "t": 1, "q": "机电传动控制中，三相异步电动机采用变频调速时，若要保持电机气隙磁通恒定，在降低供电频率的同时，应采取的措施是", "a": ["保持定子绕组电压不变", "提高定子绕组电压", "先降低后提高定子绕组电压", "降低定子绕组电压", "", ""], "r": "D", "e": "由U1≈4.44f<sub>1<\/sub>N<sub>1<\/sub>Φm,保持气隙磁通恒定需维持压频比U<sub>1<\/sub>/f<sub>1<\/sub>不变，降低频率时应同步降低定子电压，避免磁路过饱和。", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821707", "t": 1, "q": "机电传动控制中，异步电动机的\"转差率\"是指", "a": ["同步转速与额定转速的比值", "实际转速与额定转速的差值与额定转速的比值", "实际转速与同步转速的比值", "同步转速与实际转速的差值与同步转速的比值", "", ""], "r": "D", "e": "转差率定义为同步转速与实际转速的差值和同步转速的比值。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821708", "t": 1, "q": "机电传动控制中，直流他励电动机采用电枢串电阻调速时，其机械特性的变化是", "a": ["特性曲线变陡，理想空载转速不变", "特性曲线变平缓，理想空载转速降低", "特性曲线变平缓，理想空载转速不变", "特性曲线变陡，理想空载转速降低", "", ""], "r": "A", "e": "电枢串电阻调速，电枢电阻增大，机械特性斜率变大，曲线变陡；理想空载转速只与电源电压和励磁磁通有关，串电阻不影响，所以理想空载转速不变。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821709", "t": 1, "q": "机电传动控制中，PLC的\"扫描周期\"是指", "a": ["PLC与上位机通信一次的时间", "PLC接收一个输入信号到输出一个控制信号的时间", "PLC完成一次输入采样、程序执行、输出刷新的时间", "PLC执行一条指令的时间", "", ""], "r": "C", "e": "PLC扫描周期就是完成输入采样、程序执行、输出刷新这一个完整过程所需时间。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821710", "t": 1, "q": "机电传动控制中，PLC控制电机正反转时，为防止接触器主触点粘连导致电源短路，需设置的保护措施是", "a": ["过载保护", "过电流保护", "失压保护", "互锁保护", "", ""], "r": "D", "e": "互锁保护可防止正反转接触器同时吸合，避免主触点粘连造成电源短路。过载保护针对长时间过载；过电流保护针对短时大电流；失压保护是防止电压消失后恢复供电设备自行启动。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821711", "t": 1, "q": "机械工艺技术中，\"成组工艺\"的核心是", "a": ["将同一批次的零件集中加工，提高生产效率", "将形状相似、工艺相近的零件归为一组，采用相似的工艺方案", "将同一零件的不同工序分组，实现工序集中", "将不同类型的零件按加工顺序分组，优化生产流程", "", ""], "r": "B", "e": "成组工艺是把形状、结构、工艺相近的零件组成一个零件族（组），对同一零件族（组）制定统一的加工方案等。A强调同一批次零件集中加工，并非成组工艺核心；C是工序分组，不是成组工艺核心；D按加工顺序分组也不是成组工艺核心。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821712", "t": 1, "q": "机械工艺技术中，“成组技术”在工艺设计中的应用不包括", "a": ["确定零件的设计方案", "设计成组工艺装备", "制定成组工艺规程", "组织成组生产单元", "", ""], "r": "A", "e": "成组技术在工艺设计中是对相似零件进行分组并实现工艺标准化等操作。设计方案更多是处于产品设计前期概念阶段，并非成组技术在工艺设计中的应用内容。而设计成组工艺装备、制定成组工艺规程、组织成组生产单元都与成组技术在工艺设计中的应用相关。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821713", "t": 1, "q": "机械工艺技术中，“工序”是工艺过程的基本组成单元，下列关于工序的定义，正确的是", "a": ["用同一把刀具，对同一个工件的同一个表面进行的加工过程", "在同一段时间内，由同一个工人对同一个工件进行的加工过程", "在同一工作地，对同一个或一组工件进行的连续加工过程", "在同一台机床上，对同一个工件进行的连续加工过程", "", ""], "r": "C", "e": "工序是指一个（或一组）工人，在一个工作地（或一台机床）上对一个（或同时对几个）工件所连续完成的那一部分工艺过程。C选项符合工序定义。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821714", "t": 1, "q": "机械工艺技术中，\"工序分散\"的主要优点是", "a": ["保证各表面的位置精度", "减少工件装夹次数", "提高加工效率", "便于采用通用设备和刀具，适应多品种生产", "", ""], "r": "D", "e": "工序分散是将工件的加工分散在较多工序内完成。通用设备和刀具适用性强，工序分散便于采用它们，能适应多品种生产。而保证位置精度、减少装夹次数、提高加工效率多是工序集中的特点。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821715", "t": 1, "q": "机械工艺技术中，“工序集中”的主要优点是", "a": ["减少工序间运输，缩短生产周期", "便于调整机床，提高加工精度", "减少工件装夹次数，降低装夹误差", "便于采用专用设备，提高生产效率", "", ""], "r": "C", "e": "工序集中是指将工件的加工集中在少数几道工序内完成，这样能减少工件装夹次数，降低装夹误差。A选项减少工序间运输并非主要优点；B选项便于调整机床不是工序集中核心优势；D选项采用专用设备提高效率不是最突出优点。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821716", "t": 1, "q": "机械工艺技术中，\"工艺路线\"的拟定步骤不包括", "a": ["选择定位基准，划分加工阶段", "确定零件的设计尺寸和公差", "确定零件的生产纲领和生产类型", "分析零件图，了解零件的结构和技术要求", "", ""], "r": "B", "e": "工艺路线拟定主要围绕加工流程等展开。确定设计尺寸和公差是设计阶段的事，并非工艺路线拟定步骤。而选择定位基准、确定生产纲领与类型、分析零件图都是拟定工艺路线的常见步骤。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821717", "t": 1, "q": "机械工艺技术中，\"工艺验证\"的主要目的是", "a": ["培训操作人员熟悉工艺规程", "确定生产纲领的合理性", "验证工艺规程的正确性和可行性，确保能加工出合格零件", "检查工艺文件是否完整", "", ""], "r": "C", "e": "工艺验证重点在于确认工艺本身的正确性与可行性，以保证能生产出合格产品。A选项培训操作人员不是主要目的；B选项确定生产纲领合理性并非工艺验证核心；D选项检查工艺文件完整也不是主要目标。所以答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821718", "t": 1, "q": "机械工艺技术中，“工艺优化”的主要目标不包括", "a": ["提高加工精度", "降低生产成本", "增加零件的设计功能", "缩短生产周期", "", ""], "r": "C", "e": "工艺优化主要围绕加工过程，提高加工精度、降低成本、缩短周期都是常见目标。而增加零件设计功能属于设计环节，并非工艺优化主要目标。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821719", "t": 1, "q": "机械工艺技术中，\"基准统一原则\"是指", "a": ["同一零件的不同工序采用相同的定位基准", "同一零件的设计基准和装配基准统一", "同一批次零件采用相同的加工基准", "同一工序的定位基准和测量基准统一", "", ""], "r": "A", "e": "“基准统一原则”强调在加工同一零件的不同工序时，采用相同的定位基准，这样能减少基准转换带来的误差。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821720", "t": 1, "q": "机械工艺技术中，\"基准位移误差\"是指", "a": ["定位基准自身在定位过程中的位置变动导致的误差", "刀具相对于定位基准的位置误差", "定位基准与设计基准不重合导致的误差", "工件装夹后相对于机床主轴的位置误差", "", ""], "r": "A", "e": "基准位移误差就是定位基准在定位过程中位置变动产生的误差。B选项说的是刀具与定位基准位置误差；C选项是基准不重合误差；D选项描述的不是基准位移误差概念。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821721", "t": 1, "q": "机械工艺技术中，\"基准重合原则\"是指", "a": ["选择设计基准作为定位基准", "选择工序基准作为测量基准", "选择装配基准作为工序基准", "选择定位基准作为装配基准", "", ""], "r": "A", "e": "基准重合原则就是在加工时选择设计基准作为定位基准，可减少基准不重合带来的误差。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821722", "t": 1, "q": "机械工艺技术中，“加工余量”的确定需考虑的因素不包括", "a": ["上道工序的尺寸公差", "上道工序的表面粗糙度", "工件的热处理变形", "下道工序的切削速度", "", ""], "r": "D", "e": "加工余量确定要考虑上工序的尺寸公差、表面粗糙度、热处理变形等对上工序质量和加工影响的因素。下道工序切削速度主要影响加工效率和刀具寿命等，与加工余量确定无关。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821723", "t": 1, "q": "机械工艺技术中，\"误差复映\"是指", "a": ["工件装夹误差导致的加工误差", "机床误差导致的加工误差", "刀具磨损导致的误差在加工中不断重复", "上道工序的误差反映到下道工序中", "", ""], "r": "D", "e": "“误差复映”主要指上道工序的误差会反映到下道工序中。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821724", "t": 1, "q": "机械加工工艺规程设计中，“刀具寿命”的确定依据是", "a": ["刀具的材料硬度", "刀具使用的时间", "刀具的磨损量达到磨钝标准", "刀具加工的零件数量", "", ""], "r": "C", "e": "刀具寿命是指刀具从开始切削至达到磨钝标准所经历的切削时间，所以确定依据是刀具的磨损量达到磨钝标准。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821725", "t": 1, "q": "机械加工工艺规程设计中，\"定位误差\"的组成部分是", "a": ["系统误差和随机误差", "加工误差和测量误差", "尺寸误差和形状误差", "基准不重合误差和基准位移误差", "", ""], "r": "D", "e": "定位误差由基准不重合误差和基准位移误差组成。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821726", "t": 1, "q": "机械加工工艺规程设计中，\"辅助工序\"的安排不包括", "a": ["零件设计工序", "检验工序", "热处理工序", "去毛刺工序", "", ""], "r": "A", "e": "辅助工序通常有检验、去毛刺等，热处理也可作为辅助工序改善材料性能。而零件设计工序不属于加工工艺规程里的辅助工序。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821727", "t": 1, "q": "机械加工工艺规程设计中，\"工序尺寸\"的确定需通过尺寸链计算，其目的是", "a": ["确定刀具的切削参数", "确定各工序的加工余量", "保证最终零件的设计尺寸和公差", "确定机床的加工范围", "", ""], "r": "C", "e": "工序尺寸确定用尺寸链计算，主要就是为保证最终零件能符合设计尺寸和公差要求。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821728", "t": 1, "q": "机械加工工艺规程设计中，\"工艺文件\"的主要形式不包括", "a": ["工艺过程卡片", "雾化图纸", "工序卡片", "检验卡片", "", ""], "r": "B", "e": "工艺文件主要有工艺过程卡片、工序卡片、检验卡片等，而雾化图纸不属于工艺文件主要形式。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821729", "t": 1, "q": "机械加工工艺规程设计中，“工艺装备”的选择不包括下列哪一项？", "a": ["量具的选择", "夹具的选择", "机床的选择", "刀具的选择", "", ""], "r": "C", "e": "工艺装备是指产品制造过程中所用的各种工具的总称，包括刀具、夹具、量具等。机床是加工设备，不属于工艺装备范畴。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821730", "t": 1, "q": "机械加工工艺规程设计中，“工装设计”的依据不包括", "a": ["机床的技术参数", "零件的结构和尺寸", "零件的设计理念", "工艺规程的要求", "", ""], "r": "C", "e": "工装设计需考虑机床参数以适配机床，要依据零件结构尺寸保证加工精度，根据工艺规程要求实现加工流程。而零件设计理念侧重于设计意图和思路，并非工装设计直接依据。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821731", "t": 1, "q": "机械加工工艺规程设计中，“检验工序”的安排位置不包括", "a": ["成品出厂前", "关键工序后", "粗加工后", "零件设计后", "", ""], "r": "D", "e": "检验工序一般在成品出厂、关键工序后、粗加工后进行，而零件设计后还未进入加工阶段，不存在检验工序。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821732", "t": 1, "q": "机械加工工艺规程设计中，\"切削参数\"的选择原则不包括", "a": ["降低生产成本", "提高生产效率", "保证加工质量", "降低刀具寿命", "", ""], "r": "D", "e": "切削参数选择目的是要保证加工质量、提高生产效率、降低生产成本，而降低刀具寿命显然不是选择原则。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821733", "t": 1, "q": "机械加工工艺规程设计中，\"热处理工序\"的安排位置不包括", "a": ["精加工后（表面处理）", "粗加工后、精加工前（最终热处理）", "粗加工前（预处理）", "零件设计前（材料预处理）", "", ""], "r": "D", "e": "热处理工序一般在零件设计之后，加工过程中或加工后进行，零件设计前不存在热处理工序安排。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821734", "t": 1, "q": "机械加工工艺规程设计中，\"生产纲领\"对工艺规程的影响是", "a": ["生产纲领越大，工艺规程越简单", "生产纲领越小，越倾向于采用自动化生产线", "生产纲领越小，工艺文件越详细", "生产纲领越大，越倾向于采用工序集中和专用设备", "", ""], "r": "D", "e": "生产纲领大时，为提高生产效率，会倾向工序集中并采用专用设备；生产纲领小，通常工艺规程更简单、工艺文件不详细，也不会倾向自动化生产线。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821735", "t": 1, "q": "机械加工工艺规程设计中，对\"关键工序\"的确定依据是", "a": ["加工难度大的工序", "使用专用设备的工序", "加工时间长的工序", "影响零件主要性能、精度的工序", "", ""], "r": "D", "e": "关键工序主要是会影响零件主要性能、精度，这对产品质量起关键作用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821736", "t": 1, "q": "机械加工工艺规程设计中，确定切削用量时，优先选择的参数是", "a": ["切削速度", "进给量", "背吃刀量", "切削时间", "", ""], "r": "C", "e": "在确定切削用量时，应优先选择大的背吃刀量，因为增大背吃刀量对刀具耐用度影响最小，其次选进给量，最后确定切削速度。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821737", "t": 1, "q": "机械加工工艺规程设计中，选择定位基准时，若采用与零件设计基准不重合的定位基准，需进行的计算是", "a": ["公差配合计算", "工装刚度计算", "尺寸链计算", "切削用量计算", "", ""], "r": "C", "e": "当采用与零件设计基准不重合的定位基准时，需通过尺寸链计算来分析和确定加工尺寸及其公差，以保证加工精度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821738", "t": 1, "q": "机械加工中，“表面残余应力”的产生原因不包括", "a": ["刀具的磨损", "切削过程中工件表面的塑性变形", "工件材料的相变", "切削热导致的工件表面热胀冷缩", "", ""], "r": "A", "e": "刀具磨损主要影响加工精度和表面粗糙度等，并非表面残余应力产生的原因；而切削时工件表面塑性变形、材料相变以及热胀冷缩都会产生表面残余应力。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821739", "t": 1, "q": "机械加工中，\"表面强化处理\"的目的是", "a": ["消除表面残余应力", "提高表面硬度和耐磨性", "提高表面的尺寸精度", "降低表面粗糙度值", "", ""], "r": "B", "e": "表面强化处理是通过一定方法使材料表面硬度等性能提升。A选项消除残余应力不是强化处理主要目的；C选项提高尺寸精度不是强化处理作用；D选项降低表面粗糙度值与强化无关。强化处理就是为提高表面硬度和耐磨性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821740", "t": 1, "q": "机械加工中，\"表面质量\"的评价指标不包括下列哪一项", "a": ["表面波纹度", "表面几何形状误差", "表面粗糙度", "表面硬度", "", ""], "r": "D", "e": "表面质量主要涉及表面的几何特征和物理化学性能等方面。表面波纹度、表面粗糙度都反映表面微观几何形状，表面几何形状误差也与表面几何特征相关。而表面硬度是材料的力学性能，并非表面质量的评价指标。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821741", "t": 1, "q": "机械加工中，\"刀具的主偏角\"增大时，会导致", "a": ["切削力的轴向分力增大", "刀具的散热条件变好", "切削力的径向分力增大", "加工表面的残留面积高度增大", "", ""], "r": "A", "e": "A. 切削力的轴向分力增大<br />主偏角增大时，切削力在轴向（进给方向）的分力会增大，而径向分力则减小。<br />B. 刀具的散热条件变好 <br />主偏角增大时，刀具的主切削刃工作长度缩短，刀尖角减小，导致刀尖强度降低，散热条件变差（而非变好）。主偏角减小时，散热条件才会改善。<br />C. 切削力的径向分力增大 <br />主偏角增大时，径向分力（背向力）会减小，而非增大。主偏角越小，径向分力越大。<br />D. 加工表面的残留面积高度增大 <br />主偏角增大可以减小残留面积高度，从而降低表面粗糙度，而非增大。因此，该选项与主偏角增大的实际效果相反。", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821742", "t": 1, "q": "机械加工中，“加工精度”的三个组成部分是", "a": ["尺寸精度、形状精度、位置精度", "形状精度、表面精度、位置精度", "尺寸精度、形状精度、表面精度", "尺寸精度、表面精度、位置精度", "", ""], "r": "A", "e": "加工精度主要指尺寸、形状和位置方面的精确程度，表面精度不属于加工精度的组成部分。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821743", "t": 1, "q": "机械加工中，“加工误差的因果分析图”主要用于", "a": ["定量分析各因素对加工误差的影响程度", "定性分析导致加工误差的各种可能因素", "计算加工误差的具体数值", "控制加工误差在一定范围内", "", ""], "r": "B", "e": "因果分析图主要是用来定性找出导致结果（这里是加工误差）的各种可能因素。它并非用于定量分析影响程度、计算具体误差数值或控制误差范围。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821744", "t": 1, "q": "机械加工中，\"磨削加工\"相比车削加工的主要优点是", "a": ["设备成本低", "加工精度高，表面粗糙度值小", "能加工的材料范围广", "加工效率高", "", ""], "r": "B", "e": "磨削加工是利用磨具对工件表面进行加工，能获得较高的加工精度和较小的表面粗糙度值，这是其相比车削加工的主要优点。车削加工设备成本相对低、加工效率较高，而二者能加工材料范围都较广。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034810627217821745", "t": 1, "q": "机械加工中，“切削热”对加工质量的影响不包括", "a": ["使刀具磨损加剧", "增大表面粗糙度值", "导致工件热变形，影响尺寸精度", "改变工件表面的物理力学性能", "", ""], "r": "B", "e": "切削热会加剧刀具磨损、使工件热变形影响尺寸精度、改变工件表面物理力学性能，而增大表面粗糙度值主要和刀具几何形状、切削用量等有关，并非切削热的主要影响。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035712", "t": 2, "q": "机电传动控制中，伺服电机与普通电机的区别包括下列哪些", "a": ["伺服电机功率大，普通电机功率小", "伺服电机响应速度快，普通电机响应慢", "伺服电机能实现精确的位置和转速控制，普通电机控制精度低", "伺服电机带有反馈装置（如编码器），普通电机无反馈", "", ""], "r": "BCD", "e": "伺服电机响应快、能精确控制位置和转速，且带有反馈装置，普通电机在这些方面表现不如伺服电机，功率大小并非二者本质区别。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035713", "t": 2, "q": "机电传动控制中，伺服系统的组成部分包括下列哪些", "a": ["检测装置（如编码器）", "减速器", "控制器", "伺服电机", "", ""], "r": "ACD", "e": "伺服系统由控制器、功率放大器、执行机构（伺服电机）和检测装置等组成。编码器等检测装置用于反馈位置等信息，控制器对信号处理和发出指令，伺服电机是执行元件。减速器不是伺服系统必备组成部分。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035714", "t": 2, "q": "机电传动控制中，电机过载保护的常用元件包括下列哪些", "a": ["熔断器", "热继电器", "接触器", "过电流继电器", "", ""], "r": "BD", "e": "熔断器主要用于短路保护；热继电器利用电流热效应，能对电机过载起保护作用；接触器用于控制电路通断；过电流继电器在电流过大时动作，可用于过载保护。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035715", "t": 2, "q": "机电传动控制中，电机正反转控制电路的关键保护措施包括下列哪些", "a": ["过载保护（防止电机长期过载）", "失压保护（防止电源恢复时电机自行启动）", "互锁保护（防止正反转接触器同时通电）", "短路保护（防止电路短路）", "", ""], "r": "ABCD", "e": "电机正反转控制这几个保护都很关键。过载保护避免电机长时间过载损坏；失压保护防止意外断电后电源恢复电机自行启动带来危险；互锁保护避免正反转接触器同时通电造成短路；短路保护防止电路短路引发事故。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035716", "t": 2, "q": "机电传动控制中，过电流保护与过载保护的区别在于", "a": ["过电流保护通常采用过电流继电器，过载保护采用热继电器", "过电流保护可重复使用，过载保护不可重复使用", "过电流保护针对短路或严重过载（电流大、时间短），过载保护针对长期轻度过载（电流较小、时间长）", "过电流保护动作迅速，过载保护动作缓慢", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035717", "t": 2, "q": "机电传动控制中，继电器-接触器控制电路的组成部分包括下列哪些？", "a": ["继电器、接触器", "电源", "中央处理单元（CPU）", "控制按钮", "", ""], "r": "ABD", "e": "继电器 - 接触器控制电路主要由继电器、接触器、控制按钮等构成，电源是为电路供电的基础，也是组成部分。而中央处理单元（CPU）是计算机控制系统核心，并非继电器 - 接触器控制电路组成部分。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035718", "t": 2, "q": "机电传动控制中，三相异步电动机的制动方法包括下列哪些", "a": ["再生制动", "能耗制动", "反接制动", "自由停车", "", ""], "r": "ABC", "e": "三相异步电动机制动方法有再生制动、能耗制动、反接制动，自由停车不属于制动方法。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035719", "t": 2, "q": "机电传动控制中，异步电动机变极调速的特点包括下列哪些", "a": ["调速过程中转速突变，不适用于平滑调速场合", "适用于直流电动机", "调速范围窄，仅能实现几级固定转速调节", "在特定条件下，调速效率较高，能耗较低", "", ""], "r": "ACD", "e": "异步电动机变极调速靠改变定子绕组接线方式改变磁极对数调速，转速会突变，不适合平滑调速，调速范围窄，只能实现几级固定转速调节，在特定负载下调速效率高、能耗低；此方法是针对异步电动机，不是直流电动机。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035720", "t": 2, "q": "机电传动控制中，异步电动机不能直接启动的原因包括下列哪些", "a": ["启动转矩小，难以带动负载", "启动时电机温度过高，易损坏绕组", "启动电流大（可达额定电流的5-7倍），冲击电网", "启动时功率因数低，电能损耗大", "", ""], "r": "ACD", "e": "异步电动机不能直接启动的主要原因涉及启动时的电流和转矩特性。以下是1. 启动转矩小，难以带动负载：异步电动机在启动时，由于转子与旋转磁场的相对速度较大，转矩较小，难以直接带动负载。2. 启动时电机温度过高，易损坏绕组：虽然启动时温度会升高，但这不是主要原因。3. 启动电流大（可达额定电流的5-7倍），冲击电网：这是主要原因之一。异步电动机启动时，电流会急剧增大，可能达到额定电流的5-7倍，对电网造成冲击。4. 启动时功率因数低，电能损耗大：这也是一个原因，启动时功率因数较低，导致电能损耗较大。综上所述，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035721", "t": 2, "q": "机电传动控制中，直流电动机的调速方法包括下列哪些", "a": ["弱磁调速", "降压调速", "变频调速", "电枢串电阻调速", "", ""], "r": "ABD", "e": "直流电动机调速方法有弱磁调速、降压调速、电枢串电阻调速，而变频调速主要用于交流电动机。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035722", "t": 2, "q": "机电传动控制中，直流电机的电枢反应包括下列哪些影响", "a": ["产生附加去磁磁动势，减弱气隙磁场", "导致换向困难，产生火花", "增加电机的转速", "使气隙磁场发生畸变", "", ""], "r": "ABD", "e": "直流电机电枢反应会使气隙磁场畸变、产生附加去磁磁动势减弱气隙磁场，还会导致换向困难产生火花，而不是增加电机转速。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035723", "t": 2, "q": "机电传动控制中，直流电机的制动方法包括下列哪些", "a": ["再生制动", "变极制动", "反接制动", "能耗制动", "", ""], "r": "ACD", "e": "直流电机制动方法有再生制动、反接制动、能耗制动；变极制动是交流电机调速方法。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035724", "t": 2, "q": "机电传动控制中，直流他励电动机的机械特性方程涉及的参数包括下列哪些", "a": ["电枢回路总电阻", "电枢电压", "电机转速", "励磁磁通", "", ""], "r": "ABCD", "e": "直流他励电动机机械特性方程为「test/yiwen_img/importSubject/2034810624265031680.png」 ，式中U是电枢电压，「test/yiwen_img/importSubject/2034810624487329792.png」是电枢回路总电阻 ，「test/yiwen_img/importSubject/2034810624571215872.png」是励磁磁通，n是电机转速。所以ABCD选项参数均涉及。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035725", "t": 2, "q": "机电传动控制中，PLC的工作过程包括下列哪些阶段", "a": ["输入采样阶段", "故障诊断阶段", "程序执行阶段", "输出刷新阶段", "", ""], "r": "ACD", "e": "PLC工作过程主要有输入采样、程序执行、输出刷新三个阶段。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035726", "t": 2, "q": "机电传动控制中，PLC的基本组成部分包括下列哪些", "a": ["输入/输出单元（I/O单元）", "中央处理单元（CPU）", "电源", "存储器", "", ""], "r": "ABCD", "e": "PLC基本组成有中央处理单元（CPU）来进行运算和控制，输入/输出单元（I/O单元）用于和外部设备交互，存储器存储程序和数据，电源提供工作所需电能。ABCD选项均是PLC基本组成部分。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035727", "t": 2, "q": "机电传动控制中，PLC的扫描周期受下列哪些因素影响", "a": ["指令的复杂程度（如简单指令vs复杂运算指令）", "程序的长度（指令数量）", "机床的转速", "输入输出点数的多少", "", ""], "r": "ABD", "e": "PLC扫描周期与程序本身和输入输出处理有关，指令复杂程度、程序长度、输入输出点数都会影响扫描时间，而机床转速和PLC扫描周期无关。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035728", "t": 2, "q": "机电传动控制中，PLC输入单元的类型包括下列哪些", "a": ["脉冲量输入单元（如编码器信号）", "模拟量输入单元（如温度、压力传感器信号）", "继电器输出单元", "开关量输入单元（如按钮、行程开关信号）", "", ""], "r": "ABD", "e": "PLC输入单元用于接收外部信号，A脉冲量输入单元可接收编码器等脉冲信号，B模拟量输入单元能接收温度、压力等模拟信号，D开关量输入单元可接收按钮、行程开关等开关信号；而C继电器输出单元是用于输出控制信号的，并非输入单元。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035729", "t": 2, "q": "机电传动控制中，PLC梯形图编程的基本规则包括下列哪些", "a": ["同一线圈在同一程序中可多次出现", "触点可串联或并联，线圈只能并联不能串联", "定时器、计数器需设定预设值才能工作", "程序执行顺序为从左到右、从上到下", "", ""], "r": "BCD", "e": "同一线圈在同一程序中一般不能多次出现，A错误；触点可串并联，线圈只能并联不能串联，B正确；定时器、计数器需设定预设值才能正常工作，C正确；PLC程序执行顺序是从左到右、从上到下，D正确。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035730", "t": 2, "q": "机电传动控制中，PLC与继电器-接触器控制的区别包括下列哪些", "a": ["PLC控制精度低，继电器-接触器控制精度高", "PLC采用软件逻辑控制，继电器-接触器采用硬件逻辑控制", "PLC体积小、可靠性高，继电器-接触器体积大、可靠性低", "PLC编程灵活，修改方便，继电器-接触器修改需重新接线", "", ""], "r": "BCD", "e": "继电器 - 接触器控制靠硬件连线实现逻辑控制，体积大、可靠性低且修改逻辑需重新接线；而PLC用软件逻辑，编程灵活易修改，体积小、可靠性高。A选项说反了，PLC控制精度高。所以选BCD。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035731", "t": 2, "q": "机械工艺技术中，成组工艺的主要应用包括下列哪些", "a": ["制定成组工艺规程，统一相似零件的加工流程", "设计成组夹具，实现多零件共用夹具", "优化零件设计，使零件结构标准化", "组织成组生产单元，集中加工相似零件", "", ""], "r": "ABD", "e": "成组工艺是把结构、工艺相似的零件组成一个零件组，统一制定工艺进行加工。A可统一流程，B能让多零件共用夹具，D可集中加工相似零件，都符合成组工艺应用；C优化零件设计使结构标准化，不是成组工艺主要应用。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035732", "t": 2, "q": "机械工艺技术中，工序集中的主要优点有", "a": ["便于采用专用设备和自动化生产线，提高生产效率", "便于调整机床，提高加工精度", "减少工件装夹次数，降低装夹误差", "减少工序间运输，缩短生产周期", "", ""], "r": "ACD", "e": "工序集中是将多道工序集中在一台设备上完成。A选项，可利用专用设备和自动化生产线提高效率；C选项，装夹次数少能降低装夹误差；D选项，减少工序间运输可缩短生产周期。而工序集中不利于调整机床，B错误。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035733", "t": 2, "q": "机械工艺技术中，工艺验证的主要内容包括下列哪些", "a": ["验证工艺规程的正确性，能否加工出合格零件", "验证切削参数的合理性（如效率与刀具寿命平衡）", "验证工艺装备的适用性（如夹具、刀具是否满足加工要求）", "验证零件设计图纸的完整性", "", ""], "r": "ABC", "e": "工艺验证主要围绕工艺规程、切削参数、工艺装备等工艺相关内容，确保能加工出合格零件。而零件设计图纸完整性属于设计阶段范畴，并非工艺验证主要内容。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035734", "t": 2, "q": "机械工艺技术中，基准按其作用可分为下列哪些类型", "a": ["工艺基准", "设计基准", "测量基准", "定位基准", "", ""], "r": "ABCD", "e": "答案：ABCD在机械工艺技术中，基准是用来确定生产对象上几何关系所依据的点、线、面。基准按其作用可分为工艺基准、设计基准、测量基准和定位基准。因此，选项A、B、C、D都是正确的。", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035735", "t": 2, "q": "机械加工工艺规程设计中，辅助工序的类型包括下列哪些", "a": ["零件测绘工序", "检验工序（如尺寸检验、表面质量检验）", "去毛刺、清洗工序", "热处理工序（如退火、淬火）", "", ""], "r": "BC", "e": "机械加工辅助工序是为保证加工质量和正常生产而安排的工序。检验工序可保证质量，去毛刺、清洗工序利于后续操作，都属辅助工序。零件测绘不是加工中的辅助操作；热处理工序主要改变零件性能，属主要加工工序。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035736", "t": 2, "q": "机械加工工艺规程设计中，工艺路线拟定的主要内容包括下列哪些", "a": ["分析零件的结构和技术要求，明确加工难点", "确定各工序的切削用量和加工余量", "确定各表面的加工方法和加工顺序", "选择加工设备和工艺装备（刀具、夹具、量具）", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035737", "t": 2, "q": "机械加工工艺规程设计中，工艺文件的主要形式有", "a": ["工艺过程卡片", "检验卡片", "零件图纸", "工序卡片", "", ""], "r": "AD", "e": "工艺文件主要有工艺过程卡片和工序卡片，检验卡片不属于主要的工艺文件形式，零件图纸不是工艺文件。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035738", "t": 2, "q": "机械加工工艺规程设计中，工艺装备的选择原则包括下列哪些？", "a": ["尽量采用通用工装，减少专用工装的设计制造", "满足加工精度和生产效率要求", "优先选择自动化工装，提高装配效率", "考虑现有工装的利用，降低成本", "", ""], "r": "ABD", "e": "工艺装备选择要综合考虑成本、精度、效率等。采用通用工装可减少成本，满足精度和效率要求是基本，利用现有工装也能降成本。而优先选自动化工装并非普遍原则，要根据实际情况。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035739", "t": 2, "q": "机械加工工艺规程设计中，关键工序的确定依据包括下列哪些", "a": ["采用专用设备或工装的工序", "加工难度大、易产生废品的工序", "影响零件主要性能和使用要求的工序", "影响后续工序加工质量的工序", "", ""], "r": "ABCD", "e": "关键工序对产品质量、性能、后续加工等影响重大，采用专用设备或工装、加工难度大易出废品、影响主要性能使用要求、影响后续工序质量的工序都符合关键工序特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035740", "t": 2, "q": "机械加工工艺规程设计中，划分加工阶段的主要目的有", "a": ["合理使用机床设备，避免高精度机床承担粗加工", "减少工件装夹次数，提高生产效率", "便于安排热处理工序，改善工件材料性能", "保证加工精度，逐步消除加工误差", "", ""], "r": "ACD", "e": "划分加工阶段可合理使用设备、安排热处理、保证精度消除误差，而减少装夹次数并非划分加工阶段主要目的。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035741", "t": 2, "q": "机械加工工艺规程设计中，切削用量包括下列哪些参数", "a": ["切削速度", "进给量", "刀具寿命", "背吃刀量", "", ""], "r": "ABD", "e": "切削用量是指切削速度、进给量和背吃刀量，刀具寿命不属于切削用量参数。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035742", "t": 2, "q": "机械加工工艺规程设计中，确定加工余量的方法包括下列哪些", "a": ["查表修正法（查工艺手册，结合实际修正）", "经验估算法（基于工艺人员经验）", "试切法（试切后测量，确定余量）", "尺寸链计算法（通过尺寸链精确计算）", "", ""], "r": "ABCD", "e": "机械加工工艺规程设计中，确定加工余量的方法主要包括查表修正法、经验估算法、试切法和尺寸链计算法。这些方法都是工业实践中常用的确定加工余量的方式。* 查表修正法是根据工艺手册中的数据，并结合实际情况进行修正来确定加工余量。* 经验估算法则是基于工艺人员的经验来大致估算加工余量。* 试切法是通过实际试切后测量来确定加工余量，这种方法较为直接但可能较为耗时。* 尺寸链计算法是通过精确计算尺寸链来确定加工余量，这种方法更为精确但需要较高的计算能力。综上所述，题目中给出的四个选项都是确定加工余量的方法。所以，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035743", "t": 2, "q": "机械加工工艺规程设计中，选择定位基准的原则包括下列哪些", "a": ["互为基准原则（两表面相互作为定位基准）", "基准统一原则（多工序采用同一定位基准）", "基准重合原则（选择设计基准为定位基准）", "自为基准原则（以加工表面自身为定位基准）", "", ""], "r": "ABCD", "e": "A. 互为基准原则（两表面相互作为定位基准）<br />该原则适用于两个重要表面之间需要相互保证精度的情况。例如，加工齿轮时，先以齿坯外圆定位加工内孔，再以内孔定位加工外圆，使两者互为基准，逐步提高加工精度。<br />B. 基准统一原则（多工序采用同一定位基准） <br />该原则指在多个工序中采用相同的定位基准，可避免因基准变换带来的误差积累，简化夹具设计，提高生产效率。例如，轴类零件常采用中心孔作为统一基准。<br />C. 基准重合原则（选择设计基准为定位基准） <br />该原则指定位基准应尽量与设计基准重合，以避免基准不重合误差。设计基准是零件图上确定尺寸和位置的基准，定位基准与设计基准重合可减少尺寸链的影响，提高加工精度。<br />D. 自为基准原则（以加工表面自身为定位基准） <br />该原则指以加工表面自身作为定位基准，用于精加工或珩磨等工序，可消除因基准面不准确带来的误差，保证加工余量均匀。例如，磨削主轴轴颈时，常以轴颈自身作为定位基准。", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035744", "t": 2, "q": "机械加工中，表面波纹度产生的主要原因包括下列哪些", "a": ["工件材料的硬度不均匀", "切削用量的周期性变化", "工艺系统的振动（如机床、刀具、工件的振动）", "刀具的磨损", "", ""], "r": "BC", "e": "表面波纹度主要是由工艺系统振动导致，切削用量周期性变化也会使表面出现波纹，工件材料硬度不均和刀具磨损主要影响表面粗糙度而非波纹度。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035745", "t": 2, "q": "机械加工中，表面强化处理的主要目的包括下列哪些", "a": ["提高表面硬度和耐磨性", "消除表面残余应力", "提高表面的疲劳强度", "降低表面粗糙度值", "", ""], "r": "ABC", "e": "表面强化处理可提升表面硬度、耐磨性和疲劳强度，还能消除残余应力，但降低表面粗糙度值并非其主要目的。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035746", "t": 2, "q": "机械加工中，基准位移误差的影响因素包括下列哪些", "a": ["定位副的制造误差（如工件定位孔与夹具定位销的尺寸误差）", "刀具的磨损量", "工件装夹时的夹紧力变形", "定位副的配合间隙（如孔与销的间隙）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035747", "t": 2, "q": "机械加工中，加工误差按其性质可分为下列哪些类型", "a": ["形状误差", "位置误差", "随机误差", "系统误差", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035748", "t": 2, "q": "机械加工中，减少残余应力的措施包括下列哪些", "a": ["进行去应力退火（如粗加工后退火）", "提高刀具的锋利度", "采用对称加工方法（如对称切削、对称夹紧）", "控制切削用量，避免过大切削力和切削热", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035749", "t": 2, "q": "机械加工中，控制表面质量的措施包括下列哪些", "a": ["优化切削用量（如采用高速切削）", "合理选择刀具几何参数（如增大刀尖圆弧半径）", "提高机床的几何精度", "进行表面强化处理（如喷丸、滚压）", "", ""], "r": "ABD", "e": "这是一道关于机械加工中控制表面质量措施的选择题。我们来简化解析一下：机械加工中控制表面质量，主要关注的是如何减少加工过程中的误差和缺陷，以及如何通过工艺手段提升表面的光洁度和耐用性。A选项提到的“优化切削用量（如采用高速切削）”是一种有效的措施。高速切削可以减少切削力，降低工件变形，从而有利于提高表面质量。B选项“合理选择刀具几何参数（如增大刀尖圆弧半径）”同样有助于提升表面质量。合适的刀具几何参数能够减少切削过程中的冲击和振动，使切削更加平稳，进而提升加工表面的光洁度。C选项“提高机床的几何精度”虽然对加工精度有正面影响，但它更多地是关注机床本身的制造和装配精度，并不直接针对表面质量控制。因此，这一选项与题目要求的控制表面质量的直接措施相比，关联性较弱。D选项“进行表面强化处理（如喷丸、滚压）”是在加工完成后对表面进行的处理，旨在进一步提高表面的硬度和耐磨性，也属于控制表面质量的一种措施，但并非加工过程中的直接控制手段。综合考虑，A和B选项更直接地涉及到机械加工过程中控制表面质量的措施。所以，正确答案是ABD选项：“优化切削用量（如采用高速切削）”、“合理选择刀具几何参数（如增大刀尖圆弧半径）”和“进行表面强化处理（如喷丸、滚压）”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035750", "t": 2, "q": "机械加工中，切削热的主要来源包括下列哪些", "a": ["工件材料的塑性变形", "工件材料的弹性变形", "刀具与切屑间的摩擦", "刀具与工件间的摩擦", "", ""], "r": "ACD", "e": "切削热主要源于工件材料塑性变形、刀具与切屑间摩擦、刀具与工件间摩擦，弹性变形不产生主要切削热。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035751", "t": 2, "q": "机械加工中，提高表面质量的加工方法包括下列哪些？", "a": ["精磨（如高精度磨削）", "粗车（如高速粗车）", "抛光（如机械抛光、化学抛光）", "珩磨（如内孔珩磨）", "", ""], "r": "ACD", "e": "精磨、抛光、珩磨都能有效提高表面质量；而粗车主要是去除大量材料，对表面质量提升作用小。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035752", "t": 2, "q": "机械加工中，误差复映现象的影响因素包括下列哪些", "a": ["工艺系统的刚度", "切削用量的大小", "刀具的磨损程度", "毛坯的误差大小", "", ""], "r": "ABD", "e": "误差复映指工件加工后残留的形状误差与毛坯形状误差相似。工艺系统刚度低、切削用量大、毛坯误差大时，误差复映明显；刀具磨损主要影响尺寸精度而非误差复映。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035753", "t": 2, "q": "机械加工中，影响表面粗糙度的因素有", "a": ["工件材料的塑性和硬度", "机床的几何精度", "刀具几何参数（如刀尖圆弧半径、副偏角）", "切削用量（如进给量、切削速度）", "", ""], "r": "ACD", "e": "工件材料塑性和硬度、刀具几何参数、切削用量都会直接影响加工表面微观几何形状从而影响粗糙度，机床几何精度主要影响加工精度而非表面粗糙度。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035754", "t": 2, "q": "机械加工中，影响加工精度的工艺系统误差包括下列哪些", "a": ["夹具误差（如定位误差、夹紧变形）", "工件自身的残余应力变形", "机床误差（如主轴跳动、导轨误差）", "刀具误差（如制造误差、磨损）", "", ""], "r": "ABCD", "e": "工艺系统由机床、夹具、刀具、工件组成，夹具误差、工件残余应力变形、机床误差、刀具误差均属于工艺系统原始误差，都会影响加工精度。", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035755", "t": 2, "q": "机械装配工艺规程设计中，确定装配顺序的原则有", "a": ["先小后大，先装小型零件再装大型零件", "先难后易，先装难装配的零件", "先内后外，先装内部零件再装外部零件", "先精后粗，先装高精度零件再装低精度零件", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035756", "t": 2, "q": "机械装配工艺规程设计中，装配尺寸链的组成环包括下列哪些", "a": ["补偿环", "增环", "减环", "封闭环", "", ""], "r": "BC", "e": "装配尺寸链组成环分增环和减环，封闭环是装配尺寸链最终要保证的环，不是组成环，补偿环是为保证装配精度而设置的特殊环，也不属于组成环的基本分类。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035757", "t": 2, "q": "机械装配工艺规程设计中，装配工艺文件的主要形式包括下列哪些", "a": ["装配检验卡片", "装配工序卡片", "零件明细表", "装配工艺过程卡片", "", ""], "r": "ABD", "e": "装配工艺文件主要有装配工艺过程卡片、装配工序卡片等，装配检验卡片也是装配工艺文件一部分。零件明细表是产品组成明细，不属于装配工艺文件主要形式。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035758", "t": 2, "q": "机械装配中，调整件的常见形式包括下列哪些", "a": ["螺钉（改变旋入深度调整位置）", "修配环（去除材料调整尺寸）", "垫片（改变厚度调整尺寸）", "偏心轴（旋转调整位置）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035759", "t": 2, "q": "机械装配中，调整装配法的特点包括下列哪些", "a": ["适用于大批量生产，便于自动化装配", "适用于装配精度要求高、组成件数量多的部件", "无需对零件进行修配，装配效率高", "通过改变调整件的位置或尺寸来保证装配精度", "", ""], "r": "BD", "e": "调整装配法通过改变调整件位置或尺寸保证装配精度，适合装配精度高、组成件多的部件。大批量自动化装配多是互换法；调整法有时需修配调整件。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810629122035760", "t": 2, "q": "机械装配中，动态装配的检测项目包括下列哪些？", "a": ["工作温度和密封性能", "静态配合间隙", "运动部件的间隙和窜动量", "运转时的噪声和振动", "", ""], "r": "ACD", "e": "动态装配检测侧重装配后运动状态下的性能。A项工作温度和密封性能需运转中检测；C项运动部件间隙和窜动量在运动时体现；D项运转时噪声和振动也是动态表现。而B项静态配合间隙是静态检测内容。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104128", "t": 3, "q": "机电传动控制中，伺服系统的闭环控制是指通过检测装置将执行元件的实际位置或转速反馈给控制器，与指令值比较，修正误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这准确描述了机电传动控制中伺服系统闭环控制的原理，即通过检测反馈、与指令值对比来修正误差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104129", "t": 3, "q": "机电传动控制中，反接制动的制动转矩大，制动迅速，但制动过程中会产生较大的冲击电流，适用于紧急制动场合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "反接制动确实制动转矩大、制动迅速，不过制动时会产生大冲击电流，所以适合紧急制动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104130", "t": 3, "q": "机电传动控制中，过电流继电器的动作电流应大于电机的额定电流，小于电机的启动电流，以避免启动时误动作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "过电流继电器需在正常工作时不动作，启动时因启动电流大但不能让其误动作，所以动作电流要大于额定电流且小于启动电流。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104131", "t": 3, "q": "机电传动控制中，继电器-接触器控制电路的逻辑关系由硬件接线决定，修改逻辑需重新接线，灵活性差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "继电器 - 接触器控制电路的逻辑关系确实由硬件接线确定，若要改变逻辑就得重新进行接线，所以灵活性欠佳。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104132", "t": 3, "q": "机电传动控制中，热继电器的保护原理是基于电流的热效应，当电机过载时，双金属片受热弯曲，触发触点动作，切断控制电路。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热继电器就是利用电流热效应工作，电机过载电流增大，双金属片因不同金属热膨胀系数不同而受热弯曲，使触点动作切断控制电路，保护电机。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104133", "t": 3, "q": "机电传动控制中，三相异步电动机采用变频调速时，为保持电机输出转矩恒定，必须维持电压与频率的比值（U/f）不变。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三相异步电动机变频调速时，保持U/f不变可使电机气隙磁通基本恒定，从而维持电机输出转矩恒定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104134", "t": 3, "q": "机电传动控制中，失压保护的作用是当电源突然中断后恢复供电时，电机不会自行启动，需重新按下启动按钮才能启动，避免意外事故。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "失压保护就是防止电源失电后恢复供电时电机自行启动，需重新操作启动按钮来启动电机，可避免意外事故，该描述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104135", "t": 3, "q": "机电传动控制中，异步电动机的变极调速属于无级调速，可实现转速的平滑调节。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "异步电动机变极调速是通过改变定子绕组的连接方式来改变磁极对数，磁极对数只能是整数变化，所以是有级调速，不能实现转速平滑调节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104136", "t": 3, "q": "机电传动控制中，异步电动机的启动转矩与定子电压的平方成正比，因此降低启动电压会显著降低启动转矩。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据异步电动机启动转矩与定子电压平方成正比的关系，降低启动电压，启动转矩会大幅下降。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104137", "t": 3, "q": "机电传动控制中，异步电动机的转差率在额定工况下通常很小（一般为0.01-0.05），说明电机的实际转速接近同步转速。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "转差率是同步转速与实际转速的差值和同步转速的比值，转差率小意味着同步转速和实际转速差值小，即实际转速接近同步转速。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104138", "t": 3, "q": "机电传动控制中，直流电机的电枢电压降低时，转速降低，输出转矩不变，属于恒转矩调速。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "直流电机电枢电压降低时，转速降低，且电磁转矩与电枢电流和磁通有关，电压调速时磁通不变，若负载不变则电枢电流基本不变，输出转矩不变，符合恒转矩调速特点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104139", "t": 3, "q": "机电传动控制中，直流电机的能耗制动适用于要求制动平稳、无冲击的场合，制动过程中能量通过电阻消耗。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "直流电机能耗制动是将正在运转的电机切断电源后，在电枢两端并接一个制动电阻，使电机的动能转化为电能在电阻上消耗，制动过程平稳无冲击。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104140", "t": 3, "q": "机电传动控制中，直流他励电动机的转速与电枢电压成正比，与励磁磁通成反比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "直流他励电动机转速公式为「test/yiwen_img/importSubject/2034810624646713344.png」 ，当电枢电阻压降「test/yiwen_img/importSubject/2034810624776736768.png」较小时可近似认为转速n与电枢电压U成正比，与励磁磁通「test/yiwen_img/importSubject/2034810624571215872.png」成反比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104141", "t": 3, "q": "机电传动控制中，PLC的存储器分为程序存储器和数据存储器，程序存储器用于存储用户程序，数据存储器用于存储运算过程中的数据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机电传动控制里，PLC存储器的确分为程序和数据存储器，程序存储器存用户程序，数据存储器存运算数据。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104142", "t": 3, "q": "机电传动控制中，PLC的扫描周期是固定不变的，与程序长度和指令类型无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC扫描周期会受程序长度、指令类型等因素影响，并非固定不变。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104143", "t": 3, "q": "机电传动控制中，PLC的输出单元有继电器输出、晶体管输出和晶闸管输出三种类型，其中继电器输出适用于交流和直流负载，响应速度最慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PLC输出单元确实有这三种类型，继电器输出利用触点通断控制负载，可用于交直流负载，因触点动作有机械过程，所以响应速度最慢。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104144", "t": 3, "q": "机电传动控制中，PLC的输入单元将外部开关信号转换为PLC内部的数字信号，输出单元将PLC内部的数字信号转换为外部执行元件的控制信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机电传动控制里，PLC输入单元就是把外部开关信号转化成PLC内部数字信号，输出单元则是将PLC内部数字信号转变为控制外部执行元件的信号。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104145", "t": 3, "q": "机械工艺技术中，成组工艺的核心是将形状相似、工艺相近的零件归为一组，采用相同的工艺装备和工艺路线。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "成组工艺就是把形状、尺寸、工艺相近的零件归为一组，以组为对象确定工艺路线和装备，实现批量生产效益。本题说法与成组工艺概念相符。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104146", "t": 3, "q": "机械工艺技术中，成组技术的应用可以减少工艺准备时间，提高生产效率，适用于多品种、中小批量生产。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "成组技术能将相似零件归为一组，统一制定工艺，减少重复工作，可减少工艺准备时间，提升生产效率，很适合多品种、中小批量生产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104147", "t": 3, "q": "机械工艺技术中，工序分散的主要优点是设备和工装简单，调整方便，适用于单件小批量生产。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工序分散是将工件的加工分散在较多的工序内进行，各工序加工内容少。这样所需设备和工装简单，调整容易，能很好适应单件小批量生产的灵活多变需求。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104148", "t": 3, "q": "机械工艺技术中，工序是指在同一台机床上，对同一个工件进行的所有加工过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工序是指一个（或一组）工人，在一个工作地（或一台机床）上，对同一个（或同时对几个）工件所连续完成的那一部分工艺过程，强调“连续完成”，并非同一机床对同一工件的所有加工过程。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104149", "t": 3, "q": "机械工艺技术中，基准位移误差是由于定位基准与设计基准不重合导致的误差，需通过尺寸链计算补偿。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104150", "t": 3, "q": "机械工艺技术中，基准重合原则是指选择工序基准作为测量基准，以减少基准不重合误差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。基准重合原则是指选择设计基准作为定位基准，以减少基准不重合误差，而不是选择工序基准作为测量基准。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104151", "t": 3, "q": "机械工艺技术中，误差复映系数越大，说明工艺系统的刚度越高，上道工序的误差对下道工序的影响越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。误差复映系数与工艺系统刚度成反比，误差复映系数越大，说明工艺系统刚度越低，上道工序误差对下道工序影响越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104152", "t": 3, "q": "机械工艺技术中，误差复映现象是不可避免的，但可以通过提高工艺系统刚度、增加加工次数来减小其影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "误差复映是由于工艺系统受力变形等原因客观存在的现象，难以完全避免。提高工艺系统刚度可减少受力变形，增加加工次数能逐步减小误差，从而减小误差复映影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104153", "t": 3, "q": "机械加工工艺规程设计中，工序集中的主要缺点是设备和工装投资大，调整维修复杂，适用于大批量生产。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在机械加工工艺规程设计中，工序集中指的是将多个加工步骤集中在少数几台多功能或高精度的机床上完成。这种做法的主要缺点确实包括了设备和工装的投资成本较高以及调整维修较为复杂。然而，它更适合于单件小批量生产而非大批量生产。因为对于大批量生产而言，采用工序分散的方式，即通过多台专门化的机床来分工序进行加工，可以实现更高的生产效率和更低的成本。因此，原题干中关于“适用于大批量生产”的描述是不准确的。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104154", "t": 3, "q": "机械加工工艺规程设计中，工艺路线拟定后，无需再进行工艺验证，可直接用于生产。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工艺路线拟定后必须进行工艺验证，以检查其是否合理、可行等，不能直接用于生产。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104155", "t": 3, "q": "机械加工工艺规程设计中，工艺文件的完整性取决于生产类型，单件小批量生产的工艺文件可以简化，大批量生产的工艺文件需详细。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "不同生产类型对工艺文件要求不同，单件小批量生产产品数量少、品种多，简化工艺文件可提高效率；大批量生产产品数量大、工艺相对固定，详细工艺文件能保证质量和生产的一致性。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104156", "t": 3, "q": "机械加工工艺规程设计中，工艺验证的目的是检查工艺文件是否完整，无需实际试加工。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工艺验证需要进行实际试加工，通过试加工来验证工艺的可行性、合理性等，并非仅检查工艺文件是否完整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104157", "t": 3, "q": "机械加工工艺规程设计中，工艺装备的选择应优先采用专用工装，以提高加工精度和生产效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工艺装备选择应优先考虑通用工装，当通用工装无法满足生产要求时才考虑专用工装，因为专用工装成本高、设计制造周期长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104158", "t": 3, "q": "机械加工工艺规程设计中，关键工序是指加工时间最长的工序，需重点控制加工效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "关键工序指对产品质量、性能、功能、寿命、可靠性或成本等有重大影响的工序，并非加工时间最长的工序，重点是保证质量而非单纯控制加工效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104159", "t": 3, "q": "机械加工工艺规程设计中，加工余量的确定只需考虑上道工序的尺寸公差和表面粗糙度，无需考虑热处理变形。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "加工余量确定时，不仅要考虑上道工序的尺寸公差和表面粗糙度，热处理变形也会影响工件尺寸和形状，必须考虑。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104160", "t": 3, "q": "机械加工工艺规程设计中，加工余量是指零件加工前后尺寸的差值，等于上道工序的工序尺寸与本道工序的工序尺寸之差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "加工余量的定义就是零件加工前后尺寸的差值，且确实等于上道工序的工序尺寸与本道工序的工序尺寸之差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104161", "t": 3, "q": "机械加工工艺规程设计中，切削用量的选择顺序是:先选择切削速度，再选择进给量，最后选择背吃刀量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "切削用量选择顺序应先选背吃刀量，再选进给量，最后选切削速度。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104162", "t": 3, "q": "机械加工中，表面粗糙度的评定参数主要有Ra（轮廓算术平均偏差）和Rz（轮廓最大高度），其中Ra是最常用的评定参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械加工里，Ra和Rz是表面粗糙度常见评定参数，Ra能较全面反映表面微观几何形状误差，使用方便且应用广泛，是最常用的评定参数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104163", "t": 3, "q": "机械加工中，表面粗糙度与表面波纹度的主要区别是表面粗糙度的波长较短，波高较小，属于微观几何形状误差;表面波纹度波长较长，波高较大，属于中观几何形状误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该说法正确。在机械加工里，表面粗糙度和波纹度有明显特征差异，粗糙度波长和波高都小，是微观几何形状误差；波纹度波长和波高大些，属中观几何形状误差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104164", "t": 3, "q": "机械加工中，表面粗糙度值越小，零件的耐磨性越好，疲劳强度也越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "表面粗糙度值小，零件表面更光滑，磨损小所以耐磨性好；且光滑表面应力集中小，能提高疲劳强度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104165", "t": 3, "q": "机械加工中，表面强化处理（如喷丸、滚压）可提高零件表面硬度和耐磨性，但会增加表面粗糙度值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "表面强化处理（喷丸、滚压）能提高零件表面硬度和耐磨性，同时会使表面更光滑，降低表面粗糙度值，而不是增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104166", "t": 3, "q": "机械加工中，表面质量仅影响零件的外观，对零件的使用性能（如耐磨性、疲劳强度）无影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机械加工表面质量不仅影响外观，还对零件使用性能如耐磨性、疲劳强度等有显著影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104167", "t": 3, "q": "机械加工中，采用高速切削加工时，切削力小、切削温度低，可有效降低零件表面粗糙度值，提高表面质量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104168", "t": 3, "q": "机械加工中，采用冷却润滑液可以降低切削温度、减少刀具磨损、提高表面质量，但对切削力无影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冷却润滑液能降低切削温度、减少刀具磨损、提高表面质量，同时也会减小切屑与刀具间的摩擦，进而降低切削力，并非对切削力无影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104169", "t": 3, "q": "机械加工中，采用硬质合金刀具加工硬材料时，应选择较低的切削速度，以避免刀具过快磨损。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104170", "t": 3, "q": "机械加工中，残余应力会导致零件在加工后或使用过程中产生变形，影响零件的尺寸稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "残余应力是物体在制造过程中因受到外力作用而产生的内应力，当外力去除后，应力部分或全部残留于物体内。这种内应力会使零件内部处于一种不稳定的平衡状态，在后续加工或使用时，平衡被打破，就会导致零件变形，进而影响尺寸稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104171", "t": 3, "q": "机械加工中，刀具的磨损分为初期磨损、正常磨损和剧烈磨损三个阶段，正常磨损阶段的磨损速度最慢，是刀具的主要工作阶段。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "刀具磨损确实分初期、正常和剧烈三个阶段，正常磨损阶段刀具磨损速率稳定且最慢，是刀具发挥作用的主要时期。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104172", "t": 3, "q": "机械加工中，刀具的主偏角减小，会使切削力的径向分力增大，易导致工件变形和振动，影响加工精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "主偏角减小，切削宽度增大，切削厚度减小，径向分力增大，易造成工件变形和振动，影响精度。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104173", "t": 3, "q": "机械加工中，工件的装夹包括定位和夹紧两个过程，定位的目的是使工件在机床中处于正确的位置，夹紧的目的是保持工件的正确位置不变。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械加工里，装夹确实包含定位与夹紧。定位就是让工件在机床有正确位置，夹紧则是保证工件位置固定。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104174", "t": 3, "q": "机械加工中，机床的几何误差（如主轴径向跳动、导轨直线度误差）属于系统误差，会导致同一批零件产生相同规律的加工误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "系统误差是指在重复性条件下，对同一被测量进行无限多次测量所得结果的平均值与被测量的真值之差。机床几何误差是固定的，会使同一批零件按相同规律产生加工误差，属于系统误差。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104175", "t": 3, "q": "机械加工中，加工误差的大小直接决定了零件的加工精度，误差越大，精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。加工误差与加工精度是相反概念，误差越大意味着偏离理想尺寸、形状等要求越远，精度越低，而不是越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104176", "t": 3, "q": "机械加工中，切削用量三要素（背吃刀量、进给量、切削速度）中，对刀具寿命影响最大的是背吃刀量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "切削用量三要素中对刀具寿命影响从大到小依次是切削速度、进给量、背吃刀量，并非背吃刀量影响最大。", "ap": [false, false, false, false, false, false]}, {"id": "2034810630397104177", "t": 3, "q": "机械加工中，形状误差是指零件表面本身的几何形状与理想形状的偏差，如圆柱度误差;位置误差是指零件表面与基准表面的位置关系偏差，如平行度误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "形状误差就是零件实际表面几何形状和理想形状的偏差，像圆柱度误差就属于形状误差；位置误差是零件表面和基准表面在位置关系上的偏差，平行度误差是典型的位置误差。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第6章 机械工艺技术（2）", "n": "基础练习题【含解析】 / 第6章 机械工艺技术（2）", "qs": [{"id": "2034810634188754944", "t": 1, "q": "机械加工中，\"形状误差\"不包括下列哪一项", "a": ["平行度误差", "圆柱度误差", "圆度误差", "直线度误差", "", ""], "r": "A", "e": "形状误差是指被测实际要素对其理想要素的变动量，而平行度误差属于位置误差。圆柱度、圆度、直线度误差都属于形状误差。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id
