false, false]}, {"id": "2034810586147196938", "t": 3, "q": "三相异步电动机的同步转速n0与电源频率f成正比，与电机极对数p成反比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据三相异步电动机同步转速公式「test/yiwen_img/importSubject/2034810580459720704.png」，能看出「test/yiwen_img/importSubject/2034810580518440960.png」与电源频率f成正比，与电机极对数p成反比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196939", "t": 3, "q": "三相异步电动机的效率在空载时达到最大值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "三相异步电动机空载时，输出功率为零，效率为零；随着负载增加，效率逐渐增大，在接近额定负载时效率达到最大值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196940", "t": 3, "q": "三相异步电动机的转差率s在额定运行时的取值通常为0.01-0.05。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三相异步电动机额定运行时，转子转速接近同步转速，转差率一般在0.01 - 0.05 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196941", "t": 3, "q": "三相异步电动机的转子电流频率f2与转差率s的关系为f2=s×f1（f1为定子电流频率）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三相异步电动机中，转子电流频率f2和转差率s、定子电流频率f1存在f2 = s×f1的关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196942", "t": 3, "q": "三相异步电动机的转子绕组为笼型时，其转子电阻不能调节。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "笼型三相异步电动机的转子绕组是铸铝或铜条，结构固定，其转子电阻固定不可调节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196943", "t": 3, "q": "蜗杆传动的承载能力主要取决于蜗轮轮齿的强度，而非蜗杆的强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "由于蜗杆材料强度和硬度较高，蜗轮的材料较软，工作时，失效多发生在蜗轮轮齿上，所以蜗杆传动承载能力主要取决于蜗轮轮齿强度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196944", "t": 3, "q": "蜗杆传动的传动比i等于蜗杆头数z1与蜗轮齿数z2的比值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蜗杆传动的传动比i等于蜗轮齿数z2与蜗杆头数z1的比值，而不是蜗杆头数z1与蜗轮齿数z2的比值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196945", "t": 3, "q": "蜗杆传动中，蜗杆的分度圆直径d1越大，蜗杆的刚度越好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在蜗杆传动里，分度圆直径d1越大，其抵抗变形的能力越强即刚度越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196946", "t": 3, "q": "蜗杆传动中，蜗轮的转向仅由蜗杆的转向决定，与蜗杆的旋向无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在蜗杆传动中，蜗轮转向由蜗杆转向和蜗杆旋向共同决定，并非仅由蜗杆转向决定。", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196947", "t": 3, "q": "在齿轮传动设计中，模数越大，齿轮的齿厚越大，承载能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "模数是决定齿轮尺寸的一个基本参数，模数越大，齿厚也越大，齿轮的抗弯曲能力等增强，承载能力就越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196948", "t": 3, "q": "在齿轮传动中，闭式传动的润滑条件比开式传动好，因此闭式传动的使用寿命更长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "闭式传动齿轮封闭在箱体内，能保持良好润滑且可防止杂质进入，开式传动齿轮暴露，润滑条件差且易混入杂质。良好润滑可减少磨损，所以闭式传动寿命更长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196949", "t": 3, "q": "在齿轮传动中，齿轮的压力角α增大，会使齿轮的承载能力增强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压力角α增大，齿面法向分力增大，可提高齿轮承载能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196950", "t": 3, "q": "在齿轮传动中，斜齿圆柱齿轮传动的平稳性比直齿圆柱齿轮传动好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "斜齿圆柱齿轮在啮合时，轮齿是逐渐进入和退出啮合的，重合度较大，能减小冲击和振动，所以平稳性比直齿圆柱齿轮好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196951", "t": 3, "q": "在齿轮传动中，正变位齿轮的齿顶高增大，齿根高减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196952", "t": 3, "q": "在蜗杆传动中，蜗杆的导程角γ越大，传动效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196953", "t": 3, "q": "在圆柱齿轮传动中，齿面接触疲劳强度计算的目的是防止齿轮发生齿根弯曲疲劳折断。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "齿面接触疲劳强度计算是为防止齿面发生点蚀，而防止齿轮发生齿根弯曲疲劳折断是进行齿根弯曲疲劳强度计算的目的。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196954", "t": 3, "q": "直流电动机的电磁转矩Tem与电枢电流Ia成正比，与励磁磁通Φ成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "直流电动机电磁转矩公式为「test/yiwen_img/importSubject/2034810579604082688.png」 ，「test/yiwen_img/importSubject/2034810579461476352.png」为常数，所以电磁转矩与电枢电流和励磁磁通都成正比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196955", "t": 3, "q": "直流电动机的电枢电流Ia仅由电枢电压和电枢电阻决定，与负载无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "直流电动机电枢电流还受反电动势影响，反电动势与转速有关，负载变化会使转速改变，进而影响反电动势和电枢电流，所以电枢电流与负载有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196956", "t": 3, "q": "直流电动机的电枢反应会使电机的气隙磁场增强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "直流电动机电枢反应会使气隙磁场发生畸变，且存在去磁作用，会使气隙磁场削弱而非增强。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196957", "t": 3, "q": "直流电动机的反接制动过程中，电机处于发电状态，将电能回馈给电网。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "直流电动机反接制动时，电源输入电能和系统动能都消耗在电阻上，并非将电能回馈给电网。", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196958", "t": 3, "q": "直流电动机的能耗制动是通过将电枢回路短路实现的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "直流电动机能耗制动是把电枢从电源断开后接到一个外加电阻上，而不是将电枢回路短路。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196959", "t": 3, "q": "直流电动机的转速与电枢电压成正比，与励磁磁通成反比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据直流电动机转速公式「test/yiwen_img/importSubject/2034810580623298560.png」（其中n为转速，U为电枢电压，「test/yiwen_img/importSubject/2034810579507613696.png」为励磁磁通），在其他参数不变时，转速与电枢电压近似成正比，与励磁磁通成反比。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196960", "t": 3, "q": "直流他励电动机采用弱磁调速时，其励磁电流减小，电机转速降低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "对于直流他励电动机，根据其转速公式，在其他条件不变时，弱磁即励磁电流减小，主磁通减小，转速会升高，而不是降低。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196961", "t": 3, "q": "自动控制原理中，0型系统对阶跃输入的稳态误差为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "0型系统对阶跃输入有稳态误差，其稳态误差不为零。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196962", "t": 3, "q": "自动控制原理中，超前校正装置的主要作用是提高系统的稳态精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超前校正装置主要作用是改善系统的动态性能，如增加相角裕度、提高系统的稳定性和响应速度等，提高系统稳态精度主要靠积分环节等，并非超前校正装置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196963", "t": 3, "q": "自动控制原理中，二阶系统的阻尼比ζ越小，系统的超调量越大，响应速度越慢。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二阶系统阻尼比ζ越小，超调量越大，但响应速度是越快而非越慢。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196964", "t": 3, "q": "自动控制原理中，积分校正可以提高系统的稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "积分校正会使系统型别提高，可改善系统稳态性能，但会使系统相角裕度减小，降低系统稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196965", "t": 3, "q": "自动控制原理中，系统的闭环极点全部位于s平面的左半平面时，系统稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在自动控制原理里，系统稳定的充要条件就是闭环极点全部位于s平面左半平面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196966", "t": 3, "q": "自动控制原理中，系统的开环增益K增大，会使系统的稳态误差减小，稳定性提高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自动控制原理里，系统开环增益K增大，对于有稳态误差的系统确实会使其稳态误差减小，但K增大往往会降低系统稳定性而非提高。", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196967", "t": 3, "q": "自动控制原理中，系统的稳定性仅由系统的结构和参数决定，与输入信号无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "系统稳定性是系统自身特性，取决于系统结构和参数，输入信号不影响系统本身是否稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196968", "t": 3, "q": "自动控制原理中，线性系统的响应满足叠加原理，而非线性系统不满足。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "叠加原理是线性系统的基本特性，线性系统的输出响应与输入激励呈线性关系，满足叠加原理；非线性系统的输出和输入不满足线性关系，不满足叠加原理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196969", "t": 3, "q": "DCS的核心特点是\"集中控制，分散管理\"。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "DCS核心特点是“分散控制，集中管理”，并非“集中控制，分散管理”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196970", "t": 3, "q": "DCS的通信网络通常采用冗余设计，以提高系统的可靠性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DCS（分布式控制系统）通信网络采用冗余设计能在网络出现故障时自动切换到备用网络，保障系统正常通信，可提高系统可靠性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196971", "t": 3, "q": "DCS中的现场控制站主要负责数据的集中监控和操作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "DCS中现场控制站主要负责对现场数据的采集和处理及控制，而数据的集中监控和操作一般由操作站完成。", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196972", "t": 3, "q": "PLC的存储器中，ROM用于存储用户程序，RAM用于存储系统程序。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC中ROM用于存储系统程序，RAM用于存储用户程序，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196973", "t": 3, "q": "PLC的输出模块可以直接驱动大功率负载（如大功率电机）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC输出模块电流容量有限，大功率负载电流大，直接驱动会损坏模块，通常需通过接触器等中间环节驱动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196974", "t": 3, "q": "PLC的输出刷新阶段，是将程序执行的结果写入到输出映像区，再由输出映像区驱动输出模块。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在PLC的输出刷新阶段，确实是把程序执行结果写入输出映像区，然后由输出映像区驱动输出模块。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196975", "t": 3, "q": "PLC的输入模块具有光电隔离功能，可提高系统的抗干扰能力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PLC输入模块采用光电隔离能将输入信号与内部电路隔离，有效抑制外界干扰信号的传入，提升系统抗干扰能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196976", "t": 3, "q": "PLC的输入映像区的状态在程序执行阶段会随着输入模块信号的变化而实时更新。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PLC采用循环扫描工作方式，在程序执行阶段，输入映像区状态保持不变，不会随输入模块信号实时更新，在输入采样阶段才会更新。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196977", "t": 3, "q": "PLC的指令表编程语言是一种图形化编程语言。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "指令表编程语言是用助记符来表示操作功能的文本语言，并非图形化编程语言。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 材料成型及控制工程（1）", "n": "基础练习题【含解析】 / 第3章 材料成型及控制工程（1）", "qs": [{"id": "2034810589351645184", "t": 1, "q": "材料表面改性技术中，“等离子体表面处理”的主要作用是？", "a": ["仅提高表面硬度", "仅改善表面导电性", "清洁表面、活化表面或形成改性层", "仅增加表面粗糙度", "", ""], "r": "C", "e": "等离子体表面处理能通过高能粒子与材料表面相互作用，实现清洁表面杂质、使表面分子活化以及形成新的改性层等多种功能，并非仅局限于提高硬度、改善导电性或增加粗糙度某一项。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645185", "t": 1, "q": "材料表面改性技术中，“化学转化膜处理”不包括下列哪种方法？", "a": ["铬酸盐处理", "氧化处理", "渗碳处理", "磷化处理", "", ""], "r": "C", "e": "化学转化膜处理是通过化学反应在金属表面形成稳定化合物膜层。渗碳处理是向钢表面渗入碳原子以改变其化学成分和组织，属于化学热处理，并非化学转化膜处理方法。铬酸盐处理、氧化处理、磷化处理都能形成化学转化膜。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645186", "t": 1, "q": "材料表面改性技术中，\"激光表面熔凝\"的原理是利用激光将材料表层快速加热至什么状态，然后快速冷却？", "a": ["塑性变形状态", "熔化状态", "弹性变形状态", "相变状态（未熔化）", "", ""], "r": "B", "e": "激光表面熔凝是用激光把材料表层快速加热到熔化状态，再快速冷却。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645187", "t": 1, "q": "材料表面改性技术中，“物理气相沉积（PVD）”不包括下列哪种方法？", "a": ["真空蒸发镀膜", "溅射镀膜", "化学气相沉积（CVD）", "离子镀膜", "", ""], "r": "C", "e": "物理气相沉积（PVD）主要有真空蒸发镀膜、溅射镀膜、离子镀膜等方法，而化学气相沉积（CVD）是与PVD不同的另一类表面改性技术。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645188", "t": 1, "q": "材料表面改性中，“化学气相沉积（CVD）”与“物理气相沉积（PVD）”的主要区别是？", "a": ["CVD仅适用于金属基体", "CVD通过化学反应成膜，PVD通过物理过程成膜", "CVD成膜温度更低", "CVD膜层与基体结合力更弱", "", ""], "r": "B", "e": "化学气相沉积（CVD）是利用气态物质在固体表面进行化学反应生成固态沉积物的过程，物理气相沉积（PVD）是在真空条件下，用物理的方法将材料汽化成原子、分子或使其离化为离子，沉积在基体表面的方法。所以主要区别是CVD通过化学反应成膜，PVD通过物理过程成膜。A选项CVD并非仅适用于金属基体；C选项，一般PVD成膜温度更低；D选项，CVD膜层与基体结合力更强。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645189", "t": 1, "q": "材料表面改性中，“渗氮处理”与“渗碳处理”的主要区别是？", "a": ["渗氮层厚度更厚", "渗氮后无需淬火即可获得高表面硬度", "渗氮仅适用于低碳钢", "渗氮温度更高", "", ""], "r": "B", "e": "渗氮处理是在一定温度下使氮原子渗入工件表面，渗氮后无需淬火就能获得高表面硬度；渗碳处理后一般需淬火等后续处理。渗氮层薄，渗碳适用于低碳钢，渗氮温度比渗碳低。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645190", "t": 1, "q": "材料表面改性中，\"渗硼处理\"的主要目的是提高材料表面的哪种性能？", "a": ["导电性", "耐腐蚀性", "耐磨性和红硬性", "塑性", "", ""], "r": "C", "e": "渗硼处理可在材料表面形成硼化物层，能显著提高材料表面的耐磨性和红硬性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645191", "t": 1, "q": "材料表面改性中，\"渗碳处理\"的主要目的是提高钢件的哪个表面性能？", "a": ["表面导电性", "表面硬度和耐磨性", "表面抗氧化性", "耐腐蚀性", "", ""], "r": "B", "e": "渗碳处理是向钢件表面渗入碳原子，使表面含碳量增加，从而提高表面硬度和耐磨性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645192", "t": 1, "q": "材料表面性能改性中，\"激光表面合金化\"的原理是利用激光的什么特性，使材料表层与添加的合金元素快速融合？", "a": ["高能量密度", "高单色性", "高方向性", "高相干性", "", ""], "r": "A", "e": "激光表面合金化是靠激光高能量密度使材料表层与添加合金元素快速融合。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645193", "t": 1, "q": "材料表面性能改性中，利用高能离子轰击材料表面，使表层元素产生溅射、注入并形成新相，从而提高表面硬度和耐磨性的技术是？", "a": ["激光表面淬火", "物理气相沉积（PVD）", "化学热处理（渗氮）", "离子注入", "", ""], "r": "D", "e": "离子注入就是利用高能离子轰击材料表面实现元素溅射、注入并形成新相，提升表面硬度和耐磨性。激光表面淬火是通过激光加热；物理气相沉积是沉积涂层；化学热处理（渗氮）是让氮原子渗入。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645194", "t": 1, "q": "材料成型缺陷控制中，\"锻件折叠\"缺陷的主要产生原因是？", "a": ["锻打时金属流动方向不当，部分金属被压入另一部分金属内部", "锻造压力不足", "锻造温度过高", "冷却速度过快", "", ""], "r": "A", "e": "锻件折叠主要是因锻打时金属流动方向不合理，部分金属被压入另一部分内部形成。压力不足会影响锻件致密度等；锻造温度高可能导致过热、过烧；冷却速度快易产生裂纹等，都不是折叠主因。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645195", "t": 1, "q": "材料成型缺陷控制中，金属焊接成型的\"冷裂纹\"主要产生于焊接后的哪个阶段，原因是？", "a": ["焊接过程中，熔池温度过高", "冷却过程中，焊缝区产生马氏体组织且内应力大", "焊接电流过大", "预热温度过高", "", ""], "r": "B", "e": "冷裂纹是在焊接冷却过程中产生，主要因为焊缝区形成马氏体组织且内应力大。A选项熔池温度高不是冷裂纹主因；C选项焊接电流大与冷裂纹产生机制不符；D选项预热温度高一般可减少冷裂纹。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645196", "t": 1, "q": "材料成型缺陷控制中，塑料成型的\"飞边\"缺陷主要原因是？", "a": ["保压压力过小", "浇注温度过低", "冷却时间过长", "模具闭合不严或锁模力不足", "", ""], "r": "D", "e": "“飞边”是塑料溢出模具分型面等间隙形成的，模具闭合不严或锁模力不足会导致间隙出现，使塑料溢出形成飞边。而保压压力过小、浇注温度过低、冷却时间过长通常不会直接导致飞边。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645197", "t": 1, "q": "材料成型缺陷中，\"冷隔\"常出现在铸件的哪个部位，且主要由什么原因导致？", "a": ["交接部位，金属液分流后未充分融合", "薄壁部位，浇注速度过慢", "表面部位，模具表面粗糙度太大", "厚大部位，浇注温度过高", "", ""], "r": "A", "e": "冷隔是金属液在充型过程中，两股金属液流相遇时未能完全融合而留下的痕迹，常出现在铸件的交接部位。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645198", "t": 1, "q": "材料成型缺陷中，\"气孔\"在铸件和焊缝中均可能出现，其主要产生原因是？", "a": ["金属液或熔池冷却过快", "成型压力过大", "模具或焊材表面有油污", "金属液或熔池中溶解的气体未及时逸出", "", ""], "r": "D", "e": "气孔产生的关键是气体未能及时从金属液或熔池中逸出。冷却过快、成型压力大、模具或焊材表面油污并非主要致气孔原因。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645199", "t": 1, "q": "材料成型缺陷中，\"塑件翘曲变形\"的主要原因是什么？", "a": ["塑件各部位冷却不均匀，产生内应力", "保压时间过长", "注射压力过大", "模具温度过高", "", ""], "r": "A", "e": "塑件各部位冷却不均会产生内应力，内应力易导致塑件翘曲变形，这是主要原因。保压时间、注射压力、模具温度虽也会影响塑件质量，但不是“塑件翘曲变形”主要原因。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645200", "t": 1, "q": "材料成型缺陷中，“咬边”是哪种成型工艺常见的缺陷，主要原因是？", "a": ["锻造，锻打温度过低", "冲压，模具间隙过大", "焊接，电弧热量过高或运条不当", "铸造，浇注速度过快", "", ""], "r": "C", "e": "咬边是焊接时焊缝边缘母材被电弧熔化后未得到熔敷金属补充而留下缺口的现象，主要因电弧热量过高、运条不当等造成。而锻造、冲压、铸造的常见缺陷并非咬边。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645201", "t": 1, "q": "材料成型缺陷中，\"粘模\"缺陷常出现在塑料成型的哪个阶段，主要原因是？", "a": ["冷却阶段，冷却时间过长", "脱模阶段，模具表面粗糙度大或脱模剂不足", "保压阶段，保压压力过小", "充模阶段，熔体温度过低", "", ""], "r": "B", "e": "“粘模”是脱模时的问题，主要因模具表面粗糙或脱模剂不足导致塑料难以与模具分离。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645202", "t": 1, "q": "材料成型质量检测中，\"超声检测（UT）\"的探头频率选择对检测结果影响显著，检测金属材料内部细小缺陷时，应选择哪种频率的探头？", "a": ["任意频率均可", "低频探头（如2MHz以下）", "高频探头（如5MHz以上）", "中频探头（如2-5MHz）", "", ""], "r": "C", "e": "频率越高，超声波波长越短，对细小缺陷的分辨能力越强，所以检测金属材料内部细小缺陷应选高频探头。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645203", "t": 1, "q": "材料成型质量检测中，“磁粉检测”的灵敏度与下列哪个因素无关？", "a": ["磁粉的粒度", "缺陷的深度", "材料的颜色", "缺陷的方向", "", ""], "r": "C", "e": "磁粉检测灵敏度主要受磁粉特性（如粒度）、缺陷情况（深度、方向）等影响，材料颜色对磁粉检测灵敏度无影响。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645204", "t": 1, "q": "材料成型质量检测中，\"磁粉检测（MT）\"的适用范围是？", "a": ["非铁磁性金属材料（如铝、铜）", "塑料、陶瓷等非金属材料", "所有金属材料", "铁磁性金属材料（如钢、铸铁）", "", ""], "r": "D", "e": "磁粉检测是利用铁磁性材料被磁化后，表面和近表面缺陷产生漏磁场吸附磁粉来显示缺陷的，所以只适用于铁磁性金属材料。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645205", "t": 1, "q": "材料成型质量检测中，\"目视检测（VT）\"的主要局限性是？", "a": ["成本高", "检测速度慢", "无法检测表面缺陷", "仅能检测表面可见缺陷，无法检测内部缺陷", "", ""], "r": "D", "e": "目视检测靠直接观察，只能看到表面可见的情况，对内部缺陷没办法检测。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645206", "t": 1, "q": "材料成型质量检测中，\"射线检测（RT）\"对下列哪种缺陷的检测灵敏度最高？", "a": ["内部细小裂纹", "内部体积型缺陷（如气孔、夹渣）", "表面凹坑", "表面开口裂纹", "", ""], "r": "B", "e": "射线检测主要用于检测内部缺陷，对内部体积型缺陷（如气孔、夹渣）检测灵敏度高，因射线能穿透工件，体积型缺陷对射线吸收差异明显易被发现。而内部细小裂纹、表面凹坑、表面开口裂纹不是其检测优势所在。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645207", "t": 1, "q": "材料成型质量检测中，\"渗透检测（PT）\"的主要优点是？", "a": ["可定量分析缺陷尺寸", "可检测内部缺陷", "检测速度快，成本低，适用于多种材料（金属、非金属）", "适用于铁磁性材料", "", ""], "r": "C", "e": "渗透检测是将渗透液渗入工件表面开口缺陷中，经清洗、显像后显示缺陷，能快速检测，成本低，且适用于多种材料。它不能定量分析缺陷尺寸，只能检测表面开口缺陷，对铁磁性材料不如磁粉检测有优势。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645208", "t": 1, "q": "材料成型质量检测中，\"声发射检测（AE）\"的特点是？", "a": ["仅能检测静态缺陷", "可实时监测材料在受力过程中缺陷的产生和扩展", "适用于所有非金属材料", "检测结果无法定量", "", ""], "r": "B", "e": "声发射是材料受力变形过程中产生的弹性波，所以能实时监测材料受力时缺陷产生和扩展。A选项声发射可检测动态缺陷；C选项并非适用于所有非金属材料；D选项检测结果可定量分析。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645209", "t": 1, "q": "材料成型质量检测中，\"涡流检测（ET）\"主要用于检测金属材料的哪种缺陷？", "a": ["内部深层缺陷", "非金属材料的缺陷", "表面及近表面缺陷，且材料需导电", "体积型缺陷（如气孔）", "", ""], "r": "C", "e": "涡流检测基于电磁感应原理，通过交变磁场在导电材料中产生涡流，能检测表面及近表面缺陷，且要求材料导电。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645210", "t": 1, "q": "材料成型装备中，\"压铸机\"的压射系统主要作用是？", "a": ["对模具进行冷却", "将模具闭合并锁紧", "将金属液高速压入模具型腔", "将成型后的铸件从模具中顶出", "", ""], "r": "C", "e": "压铸机压射系统核心功能是把金属液高速压进模具型腔来成型铸件。A选项冷却模具是冷却系统作用；B选项闭模锁紧是合模系统功能；D选项顶出铸件是顶出机构功能。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645211", "t": 1, "q": "工程材料热处理中，\"贝氏体转变\"的温度范围是介于哪两个相变温度之间？", "a": ["室温与马氏体转变结束温度（Mf）之间", "马氏体转变开始温度（Ms）与马氏体转变结束温度（Mf）之间", "奥氏体化温度与马氏体转变开始温度（Ms）之间", "珠光体转变温度与马氏体转变开始温度（Ms）之间", "", ""], "r": "C", "e": "这是一道关于工程材料热处理中贝氏体转变温度范围的选择题。为了确定正确答案，我们首先需要了解各个选项所代表的温度区间以及贝氏体转变的基本特性。1. 室温与马氏体转变结束温度（Mf）之间： 这个区间通常不对应贝氏体转变，因为贝氏体转变发生在更高的温度下。2. 马氏体转变开始温度（Ms）与马氏体转变结束温度（Mf）之间： 这个区间是马氏体转变发生的温度范围，而不是贝氏体转变。3. 奥氏体化温度与马氏体转变开始温度（Ms）之间： 贝氏体转变正是发生在这个温度区间内。在奥氏体化之后，随着温度的逐渐降低，奥氏体开始转变为贝氏体，直到达到马氏体转变开始的临界温度（Ms）。4. 珠光体转变温度与马氏体转变开始温度（Ms）之间： 这个区间实际上包括了珠光体转变和贝氏体转变的部分温度范围，但并不准确反映贝氏体转变的完整温度区间。综上所述，贝氏体转变的温度范围是介于奥氏体化温度与马氏体转变开始温度（Ms）之间。这是因为贝氏体是在奥氏体冷却过程中，但在马氏体转变开始之前形成的一种组织结构。所以，正确答案是C选项：“奥氏体化温度与马氏体转变开始温度（Ms）之间”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645212", "t": 1, "q": "工程材料热处理中，\"等温淬火\"的工艺是将钢件加热奥氏体化后，快速冷却至哪个温度区间，保温一段时间后冷却？", "a": ["室温", "马氏体转变温度区间", "珠光体转变温度区间", "贝氏体转变温度区间", "", ""], "r": "D", "e": "等温淬火是把钢加热到奥氏体化后，快速冷却到贝氏体转变温度区间等温保持，使奥氏体转变为贝氏体后再冷却。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645213", "t": 1, "q": "工程材料热处理中，\"调质处理\"的正确工艺顺序是？", "a": ["淬火+低温回火", "淬火+高温回火", "淬火+中温回火", "退火+淬火+高温回火", "", ""], "r": "B", "e": "调质处理是淬火加高温回火的热处理工艺。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645214", "t": 1, "q": "工程材料热处理中，\"固溶处理\"对铝合金的作用是？", "a": ["获得过饱和固溶体，为时效强化做准备", "降低硬度，改善切削性能", "消除内应力，稳定尺寸", "形成细小第二相，提高强度", "", ""], "r": "A", "e": "固溶处理是将合金加热到高温单相区恒温保持，使过剩相充分溶解到固溶体中后快速冷却，以得到过饱和固溶体，为后续时效强化做准备。B选项降低硬度改善切削性能一般是退火的作用；C选项消除内应力稳定尺寸多是去应力退火的效果；D选项形成细小第二相提高强度是时效处理的结果。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645215", "t": 1, "q": "工程材料热处理中，“回火脆性”是指钢在特定回火温度区间内，出现的哪种性能变化？", "a": ["强度提高，韧性提高", "强度降低，韧性提高", "强度变化不大，韧性显著降低", "强度和韧性均显著提高", "", ""], "r": "C", "e": "回火脆性是指钢在特定回火温度区间内，强度变化不大，但韧性会显著降低。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645216", "t": 1, "q": "工程材料热处理中，\"马氏体转变\"的特点不包括下列哪一项？", "a": ["转变过程中体积膨胀", "转变不完全（存在残余奥氏体）", "转变速度极快", "需要扩散过程", "", ""], "r": "D", "e": "马氏体转变是无扩散型相变，不需要扩散过程。而A选项，马氏体比容大，转变会体积膨胀；B选项，冷却速度快，会存在残余奥氏体；C选项，转变速度极快。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645217", "t": 1, "q": "工程材料热处理中，\"球化退火\"主要用于下列哪种钢材，以降低硬度、改善切削性能？", "a": ["共析钢和过共析钢", "亚共析钢", "低碳钢", "奥氏体不锈钢", "", ""], "r": "A", "e": "球化退火主要是使共析钢和过共析钢中的渗碳体球状化，降低硬度，改善切削性能。亚共析钢一般用正火等处理；低碳钢通常不采用球化退火；奥氏体不锈钢有其特定处理方式。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645218", "t": 1, "q": "工程材料热处理中，“去应力退火”的加热温度通常低于材料的哪个温度点，以避免发生相变？", "a": ["熔点", "再结晶温度", "屈服点", "相变临界点（如Ac1）", "", ""], "r": "D", "e": "去应力退火目的是消除应力且不发生相变，加热温度低于相变临界点（如Ac1）可避免相变。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645219", "t": 1, "q": "工程材料热处理中，“再结晶退火”的主要目的是？", "a": ["细化晶粒，提高硬度", "提高材料强度", "稳定材料组织和尺寸", "消除加工硬化，恢复材料塑性", "", ""], "r": "D", "e": "再结晶退火是将冷变形后的金属加热到再结晶温度以上，保持适当时间，使变形晶粒重新结晶为均匀的等轴晶粒，从而消除加工硬化现象，恢复材料塑性。A选项细化晶粒提高硬度不是再结晶退火主要目的；B选项提高材料强度也并非其核心作用；C选项稳定组织和尺寸不是主要功能。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645220", "t": 1, "q": "工程材料热处理中，将亚共析钢加热至Ac3以上30-50℃，保温后随炉缓慢冷却，其主要目的是为了获得哪种组织以改善切削加工性能？", "a": ["马氏体", "珠光体+铁素体（细晶粒）", "贝氏体", "索氏体", "", ""], "r": "B", "e": "亚共析钢加热到Ac3以上30 - 50℃保温后随炉缓冷的工艺是完全退火，此工艺能得到珠光体和细晶粒铁素体组织，可改善切削加工性能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645221", "t": 1, "q": "工程材料中，\"复合材料\"成型时，需重点控制的工艺参数是？", "a": ["温度、压力、成型时间及纤维取向", "仅温度", "仅成型时间", "仅压力", "", ""], "r": "A", "e": "复合材料成型受多种因素影响，温度、压力、成型时间及纤维取向都对其成型质量有重要作用，不能仅关注单一因素。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645222", "t": 1, "q": "工程材料中，\"高速钢\"的主要热处理工艺是？", "a": ["球化退火", "淬火+低温回火", "退火+淬火+高温回火", "淬火+中温回火", "", ""], "r": "C", "e": "高速钢需高硬度、高耐磨性和热硬性，要经退火消除应力、改善组织，淬火获得马氏体，高温回火消除淬火应力、提高韧性等。所以主要热处理工艺是退火 + 淬火 + 高温回火。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645223", "t": 1, "q": "工程材料中，\"高碳钢\"的含碳量范围是？", "a": ["大于2.11%", "大于0.6%", "0.6%-2.11%", "小于0.25%", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645224", "t": 1, "q": "工程材料中，\"灰铸铁\"的抗压强度远高于抗拉强度的主要原因是其组织中存在哪种相？", "a": ["球状石墨", "片状石墨", "铁素体", "珠光体", "", ""], "r": "B", "e": "灰铸铁中片状石墨的存在相当于内部有许多微小裂纹，受拉时裂纹易扩展导致抗拉强度低；而受压时裂纹不易扩展，所以抗压强度高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645225", "t": 1, "q": "工程材料中，\"铝合金的时效强化\"是通过下列哪种过程实现的？", "a": ["表面形成氧化膜", "冷变形后产生加工硬化", "高温下晶粒长大", "固溶处理后析出细小第二相粒子", "", ""], "r": "D", "e": "时效强化是固溶处理后，合金在室温或较高温度放置，过饱和固溶体分解出细小弥散的第二相粒子，使合金强度、硬度升高。A选项表面形成氧化膜与时效强化无关；B选项冷变形加工硬化和时效强化机制不同；C选项高温晶粒长大不会产生时效强化效果。所以答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645226", "t": 1, "q": "工程材料中，\"镁合金\"成型时需特别注意防护，主要原因是镁合金具有哪种特性？", "a": ["高温下易氧化燃烧", "易腐蚀且腐蚀产物有毒", "密度过大，不易加工", "低温下易脆裂", "", ""], "r": "A", "e": "镁合金化学性质活泼，在高温下极易氧化燃烧，所以成型时需特别注意防护。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645227", "t": 1, "q": "工程材料中，\"钛合金\"在高温下成型时需注意控制哪个因素，以避免性能劣化？", "a": ["冷却速度过慢", "加热温度过低", "变形速度过快", "氧化和吸氢", "", ""], "r": "D", "e": "钛合金在高温下易与氧、氢等发生反应，氧化和吸氢会导致其性能劣化。而冷却速度、加热温度、变形速度虽也有影响，但不是高温成型时最需控制避免性能劣化的关键因素。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645228", "t": 1, "q": "工程材料中，\"陶瓷材料\"成型困难的主要原因是其具有哪种特性？", "a": ["高导热性", "高导电性", "高脆性", "高塑性", "", ""], "r": "C", "e": "陶瓷材料因高脆性，在成型过程中易破裂，导致成型困难。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645229", "t": 1, "q": "工程材料中，下列哪种合金元素加入钢中，主要作用是提高钢的淬透性，且对钢的韧性降低较小？", "a": ["硅（Si）", "碳（C）", "锰（Mn）", "铬（Cr）", "", ""], "r": "D", "e": "硅主要提高强度和硬度；碳增加强度但降低韧性；锰提高淬透性但对韧性有一定影响；铬能显著提高钢的淬透性，且对韧性降低较小。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645230", "t": 1, "q": "工程材料中，下列哪种铸铁经球化处理和孕育处理后，其力学性能（尤其是韧性和塑性）最接近钢材？", "a": ["球墨铸铁", "灰铸铁", "蠕墨铸铁", "可锻铸铁", "", ""], "r": "A", "e": "球墨铸铁是经球化处理和孕育处理，石墨呈球状，力学性能（尤其是韧性和塑性）最接近钢材。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645231", "t": 1, "q": "金属成型装备中，\"带式输送机\"在金属成型生产线中的主要作用是？", "a": ["冷却成型后的工件", "输送金属坯料或成型后的工件", "提供成型动力", "加热金属坯料", "", ""], "r": "B", "e": "带式输送机是常见的输送设备，其主要功能就是输送物品。在金属成型生产线中，它用于输送金属坯料或成型后的工件。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645232", "t": 1, "q": "金属成型装备中，\"辊锻机\"的工作原理是利用什么方式使金属变形？", "a": ["往复冲击", "旋转的轧辊对金属进行轧制和锻造结合", "模具闭合加压", "高压挤压", "", ""], "r": "B", "e": "辊锻机工作时是借助旋转的轧辊对金属进行轧制和锻造结合使金属变形。而A选项往复冲击不是辊锻机原理；C选项模具闭合加压一般是模锻等方式；D选项高压挤压也不是辊锻机的工作方式。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810589351645233", "t": 1, "q": "金属成型装备中，\"加热炉\"的温度控制系统主要通过什么方式实现温度精准控制？", "a": ["定期更换加热元件", "自动检测炉温并反馈调节加热功率", "手动调节燃料供应量", "控制工件在炉内的停留时间", "", ""], "r": "B", "e": "要精准控制加热炉温度，需实时获取炉温并据此调整加热情况。A定期换加热元件不能实时精准控温；C手动调节不精准且难实时；D控制工件停留时间不是直接控制炉温的手段。B自动检测炉温并反馈调节加热功率能根据实际温度实时调整，可实现精准控制。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138944", "t": 2, "q": "材料表面改性技术中，\"化学气相沉积（CVD）\"的主要应用场景有哪些？", "a": ["刀具表面涂覆硬质涂层（如TiN涂层）", "半导体芯片的薄膜制备（如硅薄膜）", "塑料表面装饰涂层", "金属表面防腐涂层（如氧化铝涂层）", "", ""], "r": "ABD", "e": "化学气相沉积（CVD）可在高温下通过化学反应生成固态沉积物，常用于在材料表面形成涂层或薄膜。A选项刀具涂覆硬质涂层、B选项半导体芯片薄膜制备、D选项金属表面防腐涂层都能利用CVD技术实现。而塑料不耐高温，CVD高温环境会使塑料损坏，不适合用于塑料表面装饰涂层。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138945", "t": 2, "q": "材料表面改性技术中，\"激光表面改性\"包括的主要工艺有哪些？", "a": ["激光表面合金化", "激光表面淬火", "激光表面清洗", "激光表面熔凝", "", ""], "r": "ABD", "e": "A. 激光表面合金化是通过激光束将合金粉末与基体材料表面形成冶金结合层的一种方法，属于激光表面改性的重要工艺之一。<br />B. 激光表面淬火利用高能量密度的激光束快速加热材料表面至奥氏体化温度以上，然后迅速冷却，从而实现表面硬化，也是激光表面改性技术中的关键工艺。<br />C. 虽然激光可以用于清洁材料表面（如去除氧化物、涂层等），但“激光表面清洗”通常不被视为激光表面改性技术的一部分，因为它主要目的在于清洁而非改变材料表面性质。<br />D. 激光表面熔凝是指使用激光束局部熔化材料表面，并控制其快速凝固过程以改善表面性能的技术，是激光表面改性的一个重要组成部分。", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138946", "t": 2, "q": "材料表面改性技术中，\"离子注入\"的主要优点有哪些？", "a": ["可实现多种元素共注入，获得复合改性效果", "改性层与基体结合力强（无界面）", "低温工艺，不改变基体宏观尺寸", "可精确控制注入元素的种类和浓度", "", ""], "r": "ABCD", "e": "离子注入能将不同离子注入材料，实现多种元素共注入获复合效果；注入粒子与基体原子形成固溶体等，结合力强无明显界面；低温操作不改变基体宏观尺寸；可精确控制注入元素种类和浓度。ABCD选项均是其优点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138947", "t": 2, "q": "材料表面改性中，“激光表面淬火”的主要工艺参数有哪些？", "a": ["激光扫描速度", "激光功率密度", "激光波长", "淬火区域的冷却速度", "", ""], "r": "ABD", "e": "激光表面淬火核心参数包含激光功率密度、扫描速度、淬火区冷却速度；激光波长属于激光器本身固有属性，一般不作为该工艺可调工艺参数。", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138948", "t": 2, "q": "材料表面改性中，\"溅射镀膜\"的主要类型有哪些？", "a": ["射频溅射（适用于绝缘靶材）", "离子溅射（增强膜层结合力）", "磁控溅射（提高溅射速率）", "直流溅射（适用于导电靶材）", "", ""], "r": "ABCD", "e": "直流溅射用于导电靶材；射频溅射可处理绝缘靶材；磁控溅射利用磁场提升溅射速率；离子溅射可增强膜基结合力，均属于溅射镀膜主要类型。", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138949", "t": 2, "q": "材料表面改性中，“磷化处理”的主要工艺步骤有哪些？", "a": ["磷化处理（浸泡或喷淋磷化液）", "后处理（如钝化、封闭）", "工件表面预处理（除油、除锈）", "高温淬火", "", ""], "r": "ABC", "e": "磷化处理主要步骤是先对工件表面预处理除油除锈，再进行磷化处理，最后可做后处理如钝化、封闭等，高温淬火不是磷化处理主要工艺步骤。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138950", "t": 2, "q": "材料表面改性中，“渗氮处理”的主要工艺参数有哪些？", "a": ["工件的预热温度", "渗氮温度", "渗氮时间", "渗氮介质（如氨气、渗氮剂）", "", ""], "r": "BCD", "e": "这是一道关于“渗氮处理”主要工艺参数的选择题。渗氮处理是材料表面改性的一种重要方法，其效果受到多种工艺参数的影响。首先，我们分析题目并指出关键信息。题目问的是“渗氮处理”的主要工艺参数，这意味着我们需要考虑在渗氮过程中起关键作用的因素。接下来，对每个选项进行逻辑推理：A. 工件的预热温度：虽然预热温度可能影响渗氮过程的某些方面，但它不是渗氮处理的核心工艺参数。预热更多是为了准备工件，而非渗氮过程本身的关键控制点。B. 渗氮温度：这是渗氮处理中的一个至关重要的参数。温度直接影响氮元素的扩散速度和渗层的形成，是控制渗氮效果的关键因素之一。C. 渗氮时间：同样，渗氮时间也是核心参数之一。它决定了氮元素渗入材料的深度和程度，直接影响渗层的质量和性能。D. 渗氮介质（如氨气、渗氮剂）：渗氮介质是渗氮过程中的另一关键要素。它提供了渗入材料的氮元素，并影响渗氮的速度和效果。综上所述，渗氮处理的主要工艺参数包括渗氮温度（B）、渗氮时间（C）和渗氮介质（D）。这三个参数共同决定了渗氮处理的效果和质量。因此，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138951", "t": 2, "q": "材料表面改性中，“物理气相沉积（PVD）”的主要工艺方法有哪些？", "a": ["离子镀膜", "溅射镀膜", "化学气相沉积（CVD）", "真空蒸发镀膜", "", ""], "r": "ABD", "e": "物理气相沉积（PVD）主要工艺有离子镀膜、溅射镀膜、真空蒸发镀膜，而化学气相沉积（CVD）不属于PVD。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138952", "t": 2, "q": "材料表面性能改性中，“化学转化膜处理”的主要目的有哪些？", "a": ["增强表面与涂层的结合力", "提高表面耐腐蚀性", "提高表面硬度", "改善表面装饰性", "", ""], "r": "ABD", "e": "化学转化膜处理是在金属表面形成一层化学转化膜。该膜能隔离金属与外界环境，提高表面耐腐蚀性；还可改善涂层与基体结合状况，增强表面与涂层结合力；同时能起到一定装饰作用。但它对提高表面硬度作用不明显。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138953", "t": 2, "q": "材料表面性能改性中，属于\"化学改性\"方法的有哪些？", "a": ["磷化处理", "物理气相沉积（PVD）", "渗碳处理", "渗氮处理", "", ""], "r": "ACD", "e": "化学改性是通过化学反应改变材料表面性能。磷化处理是金属与磷化液反应形成磷化膜；渗碳、渗氮是使碳、氮原子渗入金属表面发生化学反应。而物理气相沉积是物理方法。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138954", "t": 2, "q": "材料成型过程的变形行为中，\"动态再结晶\"发生的必要条件有哪些？", "a": ["变形速度足够慢", "存在足够的位错密度（储能）", "变形温度高于再结晶温度", "金属发生一定量的塑性变形", "", ""], "r": "BCD", "e": "动态再结晶需金属有一定塑性变形产生位错，积累足够位错密度（储能），且变形温度要高于再结晶温度。变形速度快慢不是必要条件。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138955", "t": 2, "q": "材料成型过程的变形行为中，\"晶界\"对金属塑性变形的影响表现为哪些方面？", "a": ["细晶粒金属晶界面积大，塑性变形抗力大", "晶界处易产生杂质偏聚，降低塑性", "晶界阻碍位错运动，产生晶界强化", "高温下晶界滑动增加，导致塑性提高", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138956", "t": 2, "q": "材料成型过程的变形行为中，\"屈服现象\"在低碳钢拉伸曲线中表现为哪些特征？", "a": ["出现上屈服点和下屈服点", "屈服后材料强度立即下降", "应力基本不变，应变显著增加", "屈服阶段结束后进入强化阶段", "", ""], "r": "ACD", "e": "低碳钢拉伸曲线中，屈服现象表现为应力基本不变但应变显著增加，有上、下屈服点，屈服阶段结束进入强化阶段，且屈服后强度并非立即下降。答案为ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138957", "t": 2, "q": "材料成型过程的变形行为中，“屈服准则”的主要作用有哪些？", "a": ["确定材料屈服时的应力状态", "判断材料在复杂应力状态下是否发生屈服", "预测材料的断裂强度", "为塑性变形力学分析提供数学模型", "", ""], "r": "ABD", "e": "屈服准则主要用于明确材料屈服时应力状态，判断复杂应力下材料是否屈服，也是塑性变形力学分析的数学模型基础。而预测材料断裂强度并非其主要作用。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138958", "t": 2, "q": "材料成型过程的力学响应中，\"弹性模量\"的大小主要取决于材料的哪些因素？", "a": ["热处理状态", "晶体结构", "温度", "原子间的结合力", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138959", "t": 2, "q": "材料成型过程的力学响应中，\"断裂韧性\"的大小主要取决于材料的哪些因素？", "a": ["加载速度", "热处理状态（如淬火回火工艺）", "化学成分（如合金元素含量）", "显微组织（如晶粒大小、第二相分布）", "", ""], "r": "BCD", "e": "断裂韧性主要由材料自身特性决定，化学成分、热处理状态、显微组织都属于材料自身特性影响其断裂韧性，加载速度是外部因素。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138960", "t": 2, "q": "材料成型过程的力学响应中，\"塑性变形\"的主要特征有哪些？", "a": ["变形具有不可逆性", "变形过程中体积基本不变", "卸载后有残余变形", "应力与应变关系不遵循胡克定律", "", ""], "r": "ABCD", "e": "塑性变形是材料在外力作用下产生且不可恢复的变形。其变形不可逆，卸载有残余变形，应力应变关系非线性不遵循胡克定律，且变形时体积基本不变。ABCD选项均为其主要特征。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138961", "t": 2, "q": "材料成型过程的力学响应中，\"应力状态\"对金属塑性的影响表现为哪些方面？", "a": ["拉应力分量越多，塑性越差", "应力状态软性系数越大，塑性越好", "压应力分量越多，塑性越好", "静水压力越大，塑性越好", "", ""], "r": "BCD", "e": "这是一道关于材料成型过程中应力状态对金属塑性影响的问题。我们不需要逐个分析每个选项，而是可以通过理解应力状态与金属塑性之间的基本关系来得出结论。首先，了解几个关键点：1. 拉应力与压应力：拉应力通常会降低材料的塑性，而压应力有助于提高材料的塑性。2. 应力状态软性系数：该系数反映了应力状态对材料塑性的影响程度，系数越大，表示材料在该应力状态下塑性越好。3. 静水压力：静水压力是指垂直于材料表面的均匀压力，适当增加静水压力可以提高材料的塑性。基于上述关键点，我们可以得出以下结论： A选项：拉应力分量越多，塑性越差。这是正确的，但题目要求选择表现为塑性好方面的选项。 B选项：应力状态软性系数越大，塑性越好。这直接反映了应力状态软性系数与塑性的正相关关系，符合题目要求。 C选项：压应力分量越多，塑性越好。这也是正确的，并且直接回答了题目关于塑性好的方面。 D选项：静水压力越大，塑性越好。同样正确，说明了静水压力与塑性的正相关关系。综上所述，B、C、D三个选项均正确描述了应力状态对金属塑性的正面影响。所以，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138962", "t": 2, "q": "材料成型过程的力学响应中，描述材料弹性变形阶段应力与应变关系的定律及假设包括哪些？", "a": ["胡克定律", "体积不变假设", "各向同性假设", "叠加原理", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138963", "t": 2, "q": "材料成型缺陷控制中，预防锻件\"折叠\"缺陷的主要措施有哪些？", "a": ["控制锻造温度和变形速度，保证金属塑性", "合理设计锻件形状，避免金属流动不畅", "优化模具设计，保证金属流动方向合理", "减少锻造变形量，避免过度变形", "", ""], "r": "ABC", "e": "锻件“折叠”主要因金属流动不合理产生。合理设计锻件形状、优化模具设计能让金属流动顺畅，控制锻造温度和速度保证金属塑性也利于正常流动，而减少锻造变形量并不能有效预防折叠，反而可能因变形不充分带来其他问题。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138964", "t": 2, "q": "材料成型缺陷控制中，预防焊接\"热裂纹\"的主要措施有哪些？", "a": ["采用碱性焊条或焊剂（脱硫、脱磷）", "减少焊接内应力", "控制焊缝金属的化学成分（如降低硫、磷含量）", "适当降低焊接速度，改善散热", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138965", "t": 2, "q": "材料成型缺陷控制中，预防塑料\"缩孔\"缺陷的主要措施有哪些？", "a": ["降低塑料熔体温度", "改善模具冷却系统，保证均匀冷却", "优化塑件结构，避免厚大部位", "适当提高保压压力和保压时间", "", ""], "r": "BCD", "e": "缩孔是因塑料冷却收缩产生，降低熔体温度可能使流动性变差，不利于填充，A 错误；改善冷却系统均匀冷却可减少收缩不均，优化塑件结构避免厚大部位可减少收缩量大的区域，适当提高保压压力和时间能补充收缩所需塑料，BCD 可预防缩孔。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138966", "t": 2, "q": "材料成型缺陷控制中，预防塑料成型\"气泡\"缺陷的主要措施有哪些？", "a": ["对塑料原料进行预干燥处理", "适当提高成型温度", "提高模具排气效果", "降低注射速度", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138967", "t": 2, "q": "材料成型缺陷控制中，预防铸件\"冷隔\"缺陷的主要措施有哪些？", "a": ["提高浇注温度和浇注速度", "改善浇注系统，避免金属液分流", "增大铸件壁厚，减少流动阻力", "提高模具（或砂型）温度", "", ""], "r": "ABCD", "e": "冷隔是由于金属液未完全融合形成的缺陷，提高浇注温度和速度、改善浇注系统、增大铸件壁厚、提高模具温度都有助于金属液更好流动和融合，防止冷隔。答案为ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138968", "t": 2, "q": "材料成型缺陷控制中，预防铸件\"缩孔\"缺陷的主要措施有哪些？", "a": ["采用顺序凝固", "优化铸件结构，减少厚大部位", "设置冒口", "降低浇注温度", "", ""], "r": "ABC", "e": "缩孔是因铸件凝固时补缩不足产生。顺序凝固利于补缩，可减少缩孔；优化结构减少厚大部位，能降低缩孔形成几率；设置冒口可补充铸件凝固收缩的金属液；降低浇注温度会使金属液流动性变差，不利于补缩，易产生缩孔。所以应选ABC。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138969", "t": 2, "q": "材料成型缺陷中，\"锻件过热\"缺陷的主要危害有哪些？", "a": ["晶粒粗大，力学性能（如韧性）下降", "锻件尺寸精度降低", "锻件表面氧化、脱碳严重", "易产生锻造裂纹", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138970", "t": 2, "q": "材料成型缺陷中，\"焊接裂纹\"按产生温度分类可分为哪些类型？", "a": ["再热裂纹", "层状撕裂", "冷裂纹", "热裂纹", "", ""], "r": "ACD", "e": "材料成型缺陷中的“焊接裂纹”按产生温度分类主要分为冷裂纹、热裂纹和再热裂纹。层状撕裂并不属于按产生温度分类的焊接裂纹类型。* 冷裂纹：通常在焊接完成后冷却过程中或之后的一段时间内产生，主要由于焊接过程中产生的氢、焊接残余应力和淬硬组织等因素共同作用的结果。* 热裂纹：是在焊缝金属凝固过程中产生的，通常发生在焊缝金属凝固的后期，主要由于低熔点共晶物的液态薄膜削弱了晶粒间的联结，在拉伸应力作用下发生的开裂。* 再热裂纹：通常发生在焊接接头经热处理或高温服役过程中，主要由于焊接残余应力和焊接过程中形成的淬硬组织在再加热过程中发生变化，导致裂纹的产生。综上所述，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138971", "t": 2, "q": "材料成型缺陷中，\"塑件翘曲变形\"的主要影响因素有哪些？", "a": ["模具温度分布不均", "脱模力过大，强行脱模", "塑料熔体的取向效应（分子定向排列）", "塑件各部位壁厚不均，冷却收缩不一致", "", ""], "r": "ACD", "e": "这是一道关于材料成型缺陷中塑件翘曲变形影响因素的选择题。塑件翘曲变形通常由多种因素共同作用导致，这些因素主要涉及模具温度、脱模过程、塑料熔体的性质以及塑件本身的结构特点。首先，模具温度分布不均会导致塑件在冷却过程中各部位收缩不一致，从而引起翘曲变形。其次，脱模力过大或强行脱模也可能导致塑件变形，但这更多是与脱模操作相关，而非翘曲变形的直接主要原因。再次，塑料熔体的取向效应，即分子在成型过程中的定向排列，会影响塑件的内部应力分布，从而导致翘曲。最后，塑件各部位壁厚不均导致的冷却收缩不一致也是翘曲变形的重要因素。综上所述，模具温度分布不均（A）、塑料熔体的取向效应（C）以及塑件各部位壁厚不均导致的冷却收缩不一致（D）都是导致塑件翘曲变形的主要影响因素。而脱模力过大虽然可能导致变形，但不是翘曲的主要原因。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138972", "t": 2, "q": "材料成型缺陷中，属于铸件常见缺陷的有哪些？", "a": ["冷隔", "缩孔", "气孔", "折叠", "", ""], "r": "ABC", "e": "冷隔、缩孔、气孔是铸件在成型过程中常见缺陷，而折叠多是锻造等工艺产生的缺陷。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138973", "t": 2, "q": "材料成型质量检测中，\"超声检测（UT）\"的主要优点有哪些？", "a": ["检测速度快，成本相对较低", "穿透力强，可检测厚大工件", "对内部细小裂纹灵敏度高", "可对缺陷进行定位和定量分析", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138974", "t": 2, "q": "材料成型质量检测中，\"磁粉检测（MT）\"的主要局限性有哪些？", "a": ["不适用于表面有覆盖层（如油漆）的工件", "无法检测内部深层缺陷", "对缺陷方向敏感（平行于磁场方向难检测）", "仅适用于铁磁性材料", "", ""], "r": "ABCD", "e": "磁粉检测是利用铁磁性材料被磁化后，缺陷处产生漏磁场吸附磁粉来显示缺陷。它只能检测铁磁性材料，对表面覆盖层有要求，只能检测近表面缺陷且对缺陷方向敏感。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138975", "t": 2, "q": "材料成型质量检测中，\"目视检测（VT）\"的主要工具和方法有哪些？", "a": ["渗透剂和显像剂", "肉眼直接观察", "内窥镜（检测工件内部通道）", "放大镜或显微镜", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138976", "t": 2, "q": "材料成型质量检测中，\"射线检测（RT）\"的主要局限性有哪些？", "a": ["检测厚大工件时穿透力不足", "对面积型缺陷（如裂纹）灵敏度低", "存在辐射危害，需防护", "检测成本高，周期长", "", ""], "r": "ACD", "e": "这是一道关于射线检测（RT）在材料成型质量检测中的局限性的选择题。射线检测虽然是一种有效的无损检测方法，但它也存在一些局限性。首先，我们分析每个选项：A. 检测厚大工件时穿透力不足。这是射线检测的一个显著局限性。随着工件厚度的增加，射线的穿透能力会减弱，可能导致内部缺陷无法被准确检测。B. 对面积型缺陷（如裂纹）灵敏度低。实际上，射线检测对于面积型缺陷的灵敏度相对较高，尤其是当缺陷与射线方向垂直时。因此，这个选项并不准确反映射线检测的局限性。C. 存在辐射危害，需防护。这是一个重要的局限性。射线检测使用放射性物质或X射线源，对人体有害，因此必须采取严格的防护措施。D. 检测成本高，周期长。射线检测相对于其他无损检测方法，如超声波检测，确实成本较高且周期较长。综上所述，射线检测的主要局限性包括检测厚大工件时穿透力不足（A）、存在辐射危害需防护（C）以及检测成本高、周期长（D）。因此，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138977", "t": 2, "q": "材料成型质量检测中，\"射线检测（RT）\"的主要优点有哪些？", "a": ["检测结果可永久记录（如底片）", "可检测内部体积型缺陷（如气孔、夹渣）", "可定量分析缺陷尺寸", "可检测金属和非金属材料", "", ""], "r": "ABC", "e": "射线检测能将检测结果记录在底片等上面，可永久保存；能检测材料内部的体积型缺陷；还可对缺陷尺寸进行定量分析。不过射线检测主要针对金属材料，对非金属材料检测效果不佳。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138978", "t": 2, "q": "材料成型质量检测中，\"渗透检测（PT）\"的主要工艺步骤有哪些？", "a": ["表面预处理（除油、除锈）", "显像剂施加（显示缺陷）", "多余渗透剂去除", "渗透剂施加（浸泡、喷涂）", "", ""], "r": "ABCD", "e": "渗透检测（PT）先对检测表面进行预处理，接着施加渗透剂，之后去除多余渗透剂，最后施加显像剂显示缺陷。ABCD 选项涵盖了其主要工艺步骤。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138979", "t": 2, "q": "材料成型质量检测中，\"渗透检测（PT）\"的主要局限性有哪些？", "a": ["检测结果受操作者技能影响大", "不适用于多孔性材料", "仅能检测表面开口缺陷", "无法检测内部缺陷", "", ""], "r": "ABCD", "e": "渗透检测靠渗透液渗入表面开口缺陷来检测，所以仅能检测表面开口缺陷，无法检测内部缺陷，且不适用于多孔性材料，同时检测结果受操作者技能影响大。ABCD选项均是其局限性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138980", "t": 2, "q": "材料成型质量检测中，\"声发射检测（AE）\"的主要应用场景有哪些？", "a": ["大型结构件（如桥梁、压力容器）的实时健康监测", "焊接过程中裂纹产生的在线监测", "非金属材料的内部缺陷检测", "材料拉伸、压缩试验中缺陷产生与扩展的监测", "", ""], "r": "ABD", "e": "声发射检测可实时监测材料受力变形及内部缺陷扩展等情况。AB选项场景中需实时掌握材料结构状态，D选项实验也可通过声发射监测缺陷变化；C项非金属材料内部缺陷检测常用超声等方法，声发射并非主要用于此。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138981", "t": 2, "q": "材料成型质量检测中，\"涡流检测（ET）\"的主要应用场景有哪些？", "a": ["金属板材表面及近表面缺陷检测", "非导电材料的缺陷检测", "管材、线材的在线连续检测", "金属工件的材质分选（如区分不锈钢牌号）", "", ""], "r": "ACD", "e": "涡流检测基于电磁感应原理，适用于导电金属材料。B选项非导电材料无法产生涡流，所以不适用。而A、C、D都是涡流检测常见应用场景。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138982", "t": 2, "q": "材料成型质量检测中，常用于检测金属材料表面及近表面缺陷的无损检测方法有哪些？", "a": ["超声波检测（UT）", "磁粉检测（MT）", "渗透检测（PT）", "涡流检测（ET）", "", ""], "r": "BCD", "e": "磁粉检测用于铁磁性材料表面和近表面缺陷；渗透检测用于非多孔性金属材料表面开口缺陷；涡流检测可检测金属材料表面和近表面缺陷。超声波检测主要用于内部缺陷检测。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138983", "t": 2, "q": "工程材料热处理中，\"表面淬火\"的主要方法有哪些？", "a": ["激光加热表面淬火", "火焰加热表面淬火", "感应加热表面淬火", "渗碳", "", ""], "r": "ABC", "e": "表面淬火是仅对工件表层进行淬火的热处理工艺，激光、火焰、感应加热都可实现只对表面加热淬火；而渗碳是化学热处理，不是表面淬火方法。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138984", "t": 2, "q": "工程材料热处理中，\"淬火\"工艺后钢件的性能特点有哪些？", "a": ["高硬度", "高强度", "良好的塑性", "高脆性", "", ""], "r": "ABD", "e": "淬火是将钢件加热到临界温度以上，保温一定时间后快速冷却的工艺，能使钢件获得高硬度和高强度，但会降低塑性，增加脆性。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138985", "t": 2, "q": "工程材料热处理中，\"调质处理\"后的钢件具有的力学性能特点有哪些？", "a": ["高韧性", "良好的综合力学性能", "高硬度", "高强度", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138986", "t": 2, "q": "工程材料热处理中，\"过冷奥氏体\"的转变产物主要有哪些类型？", "a": ["珠光体", "马氏体", "贝氏体", "铁素体", "", ""], "r": "ABC", "e": "过冷奥氏体在不同冷却条件下会发生不同类型转变，能转变为珠光体、马氏体、贝氏体。铁素体一般不是过冷奥氏体的转变产物。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138987", "t": 2, "q": "工程材料热处理中，\"回火\"按回火温度分类可分为哪些类型？", "a": ["中温回火（350-500℃）", "低温回火（150-250℃）", "高温回火（500-650℃）", "超高温回火（700℃以上）", "", ""], "r": "ABC", "e": "回火按回火温度分为低温回火（150 - 250℃）、中温回火（350 - 500℃）、高温回火（500 - 650℃），不存在超高温回火说法。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138988", "t": 2, "q": "工程材料热处理中，\"回火\"工艺的主要目的有哪些？", "a": ["稳定钢件的组织和尺寸", "消除淬火内应力", "调整钢件的硬度和韧性", "细化晶粒", "", ""], "r": "ABC", "e": "回火是将淬火后的工件加热到低于临界温度的某一温度范围，保温一定时间后冷却的热处理工艺。其主要目的是消除淬火内应力，稳定钢件组织和尺寸，同时调整钢件的硬度和韧性。而细化晶粒一般是正火等工艺的作用。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138989", "t": 2, "q": "工程材料热处理中，\"球化退火\"的适用场景有哪些？", "a": ["亚共析钢细化晶粒，提高力学性能", "过共析钢消除网状渗碳体，为后续淬火做准备", "轴承钢的最终热处理，获得球状珠光体", "共析钢的预先热处理，改善切削性能", "", ""], "r": "BD", "e": "球化退火主要用于过共析钢和共析钢。过共析钢球化退火可消除网状渗碳体，为淬火做准备；共析钢球化退火能改善切削性能。选项A亚共析钢一般用正火细化晶粒；选项C轴承钢最终热处理通常是淬火和回火。所以答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138990", "t": 2, "q": "工程材料热处理中，“去应力退火”与“再结晶退火”的主要区别在于哪些方面？", "a": ["处理目的不同（去应力vs消除加工硬化）", "加热温度不同（去应力退火温度更低）", "适用工件状态不同（冷变形后vs任何状态）", "冷却速度不同（去应力退火需缓冷）", "", ""], "r": "ABCD", "e": "核心区别<br />‌处理目的不同‌：去应力退火主要消除残余内应力，不改变组织；再结晶退火是消除加工硬化，让变形晶粒恢复成等轴晶。<br />‌加热温度不同‌：去应力退火温度较低，一般在 Ac1 以下（钢材常为500～650℃）；再结晶退火要加热到再结晶温度以上，通常比去应力退火更高。<br />‌适用工件状态不同‌：去应力退火适用于铸件、锻件、焊接件等各类工件；再结晶退火只针对冷变形（冷轧、冷拔等）后的工件。<br />‌冷却速度不同‌：去应力退火需要缓慢冷却（随炉缓冷），防止新应力产生；再结晶退火对冷却速度要求不高。‌‌<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138991", "t": 2, "q": "工程材料热处理中，属于\"整体热处理\"的工艺有哪些？", "a": ["淬火+回火", "正火", "渗碳处理", "退火", "", ""], "r": "ABD", "e": "整体热处理是对工件整体加热，然后以适当的速度冷却，以改变其整体力学性能的热处理工艺。淬火、回火、正火、退火都属于整体热处理，渗碳处理是表面热处理。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810591197138992", "t": 2, "q": "工程材料中，\"不锈钢\"按晶体结构分类可分为哪些类型？", "a": ["奥氏体不锈钢（如304）", "双相不锈钢（奥氏体+铁素体）", "马氏体不锈钢（如410）", "铁素体不锈钢（如430）", "", ""], "r": "ABCD", "e": "不锈钢按晶体结构可分为奥氏体、双相、马氏体、铁素体等类型，ABCD选项分别对应了这些类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652928", "t": 3, "q": "材料表面改性中的化学气相沉积（CVD），由于其成膜温度较低，因此不适用于高温合金的表面涂层制备。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "CVD成膜温度通常较高，并非较低，且它适用于高温合金的表面涂层制备。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652929", "t": 3, "q": "材料表面改性中的激光表面合金化，是通过激光加热使材料表层与添加的合金元素同时熔化，快速凝固后形成合金化层。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "激光表面合金化确实是利用激光加热，让材料表层和添加的合金元素一同熔化，随后快速凝固形成合金化层。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652930", "t": 3, "q": "材料表面改性中的激光表面熔凝，是通过激光将材料表层加热至相变温度但不熔化，快速冷却后获得细晶组织。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "激光表面熔凝是把材料表层加热至熔化，而非加热至相变温度但不熔化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652931", "t": 3, "q": "材料表面改性中的激光清洗技术，是利用激光的高能量密度瞬间去除工件表面的油污、氧化层等杂质，清洗过程中不会对工件基体造成损伤。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "激光清洗技术依靠高能量密度的激光瞬间作用，可精准去除工件表面杂质，且能控制能量避免损伤基体。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652932", "t": 3, "q": "材料表面改性中的离子注入技术，由于注入元素仅停留在材料表面，因此改性层与基体的结合力较弱。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "离子注入技术是将高能离子打入材料表面，注入离子与基体原子发生一系列相互作用并留存于基体中，形成的改性层与基体是原子级结合，结合力强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652933", "t": 3, "q": "材料表面改性中的磷化处理，形成的磷化膜不仅能提高材料表面耐腐蚀性，还能显著提高表面硬度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "磷化处理形成的磷化膜主要作用是提高耐腐蚀性、改善涂装附着力、减摩润滑等，但它不能显著提高表面硬度。磷化膜本身较软、多孔，硬度并不高。若要提高表面硬度，通常需要采用淬火、渗碳、渗氮、激光表面淬火等工艺。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652934", "t": 3, "q": "材料表面改性中的渗氮处理，由于氮原子扩散速度慢，因此渗氮层厚度通常较薄，一般在0.1-0.6mm之间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "渗氮时氮原子扩散速度慢，这就使得渗氮过程中氮原子难以深入材料内部，所以渗氮层厚度通常较薄，常见范围是0.1 - 0.6mm 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652935", "t": 3, "q": "材料表面改性中的渗硼处理，形成的硼化物层（如FeB、Fe₂B）硬度高、耐磨性好，但脆性较大，因此不宜用于承受冲击载荷的工件表面。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "硼化物层硬度高、耐磨但脆性大，冲击载荷会使脆性大的材料易出现裂纹等损坏，所以不宜用于承受冲击载荷的工件表面。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652936", "t": 3, "q": "材料表面改性中的渗碳处理，主要适用于低碳钢和低碳合金钢，通过提高表层含碳量，后续淬火+低温回火可获得高表面硬度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "渗碳是向低碳钢或低碳合金钢表面渗入碳原子，提高表层含碳量，再经淬火和低温回火，使表面具有高硬度、高耐磨性，而心部仍保持足够的强度和韧性。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652937", "t": 3, "q": "材料表面改性中的物理气相沉积（PVD）技术，由于其成膜过程温度相对较低，因此适合在塑料、陶瓷等热敏性材料表面制备涂层。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "物理气相沉积（PVD）技术成膜过程温度相对较低，不会对塑料、陶瓷等热敏性材料造成热损伤，所以适合在其表面制备涂层。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652938", "t": 3, "q": "材料表面性能改性中的激光表面淬火，其淬火层深度主要取决于激光的扫描速度，扫描速度越快，淬火层越深。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "激光表面淬火时，扫描速度越快，材料表面受热时间短，热量来不及向深层传递，淬火层越浅，并非扫描速度越快淬火层越深。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652939", "t": 3, "q": "材料成型过程的力学响应中，材料的断裂分为韧性断裂和脆性断裂，韧性断裂的断裂面粗糙、呈纤维状，伴随较大塑性变形;脆性断裂的断裂面平整、呈结晶状，塑性变形极小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是材料成型中关于断裂类型特征的基本常识。韧性断裂和脆性断裂在断裂面形态及塑性变形程度上确如题干所描述。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652940", "t": 3, "q": "材料成型过程的力学响应中，弹性模量是材料的固有属性，不随温度、热处理状态等因素变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "弹性模量并非不随温度、热处理状态等因素变化，温度升高、不同的热处理状态等都会使弹性模量改变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652941", "t": 3, "q": "材料成型过程的力学响应中，屈服强度是材料开始发生塑性变形的应力，而比例极限是材料应力与应变成正比关系的最大应力，因此屈服强度一定高于比例极限。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652942", "t": 3, "q": "材料成型过程的力学响应中，蠕变变形是指材料在恒定载荷作用下，随时间缓慢发生的塑性变形。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652943", "t": 3, "q": "材料成型过程的力学响应中，塑性变形的不可逆性是指材料发生塑性变形后，即使卸载，也无法恢复到原始形状，会保留永久变形。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "塑性变形本质就是材料在外力作用下产生且在外力去除后不能恢复的那部分变形，即卸载后会保留永久变形，无法恢复原始形状。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652944", "t": 3, "q": "材料成型过程的力学响应中，塑性变形的体积不变假设意味着材料在塑性变形时，其密度会发生显著变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "塑性变形体积不变假设表明塑性变形时体积不变，根据密度=质量/体积，质量不变、体积不变，密度不会显著变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652945", "t": 3, "q": "材料成型过程的力学响应中，应力状态软性系数越大，材料发生脆性断裂的倾向越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "应力状态软性系数越大，意味着材料越易产生塑性变形，发生塑性断裂的倾向越大，而非脆性断裂。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652946", "t": 3, "q": "材料成型过程的力学响应中，最大切应力理论（Tresca屈服准则）认为，当材料内部的最大切应力达到材料的屈服切应力时，材料开始发生屈服。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Tresca屈服准则就是当材料内部的最大切应力达到材料的屈服切应力时，材料开始发生屈服。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652947", "t": 3, "q": "材料成型缺陷中，锻件的\"未锻透\"缺陷是由于锻造压力不足或变形量不够，导致工件内部未充分塑性变形，保留原始铸造组织。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“未锻透”确实是因锻造压力不足或变形量不够，使工件内部未充分塑性变形，从而保留原始铸造组织。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652948", "t": 3, "q": "材料成型缺陷中，焊接的\"层状撕裂\"主要发生在厚钢板的焊接接头中，与钢板的轧制方向和焊接应力方向有关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "层状撕裂是厚板焊接时特有的一种裂纹，主要发生在厚钢板的焊接接头中，其产生与钢板轧制方向及焊接应力方向密切相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652949", "t": 3, "q": "材料成型缺陷中，焊接的\"冷裂纹\"主要产生于焊接过程中的高温阶段，与焊缝区的马氏体组织无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冷裂纹是在焊接冷却到较低温度时产生的，并非高温阶段，且与焊缝区的马氏体组织密切相关。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652950", "t": 3, "q": "材料成型缺陷中，焊接的\"热裂纹\"主要是由于焊缝金属中硫、磷含量过高，形成低熔点共晶，在高温下沿晶界开裂所致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "焊接热裂纹产生的主要原因就是焊缝金属中硫、磷等杂质含量过高，它们会形成低熔点共晶，在高温时沿晶界开裂。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652951", "t": 3, "q": "材料成型缺陷中，塑料塑件的\"飞边\"缺陷主要是由于注塑压力过小导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“飞边”缺陷主要是因注塑压力过大、合模力不足、模具间隙过大等导致，并非注塑压力过小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652952", "t": 3, "q": "材料成型缺陷中，塑料塑件的\"翘曲变形\"主要是由于塑件各部位冷却不均匀，导致收缩不一致而产生的内应力引起的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在塑料塑件成型过程中，各部位冷却速度不同，收缩不一致会产生内应力，进而引发翘曲变形。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652953", "t": 3, "q": "材料成型缺陷中，铸件的\"缩松\"缺陷通常产生于铸件的厚大部位中心，而\"缩孔\"则产生于铸件的局部区域。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "缩松是分散在铸件某区域内的细小缩孔，多产生于铸件的厚大部位中心；缩孔是集中在铸件上部或最后凝固部位容积较大的孔洞。题干中缩孔产生部位表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652954", "t": 3, "q": "材料成型缺陷中，铸件的\"粘砂\"缺陷主要是由于型砂的耐火度低于金属液温度，或浇注温度过高，导致金属液与型砂发生化学反应并粘连在铸件表面。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“粘砂”就是因型砂耐火度低于金属液温度，或浇注温度过高，使金属液与型砂化学反应并粘连在铸件表面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652955", "t": 3, "q": "材料成型质量检测中，超声检测（UT）的探头频率越高，检测分辨率越高，但穿透力越弱。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超声检测中，探头频率与检测分辨率和穿透力有明确关系，频率高时，能区分更小的缺陷，分辨率提高，但高频超声在材料中传播时能量衰减快，穿透力变弱。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652956", "t": 3, "q": "材料成型质量检测中，超声检测（UT）对金属材料内部的面积型缺陷（如裂纹）的检测灵敏度，高于射线检测（RT）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超声检测主要利用超声波在材料中传播时遇到缺陷会产生反射波来检测，对面积型缺陷如裂纹等很敏感；射线检测主要通过射线穿透材料，根据底片上的影像判断缺陷，对体积型缺陷更有效，所以超声检测对面积型缺陷检测灵敏度高于射线检测。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652957", "t": 3, "q": "材料成型质量检测中，磁粉检测（MT）的灵敏度与缺陷的方向无关，无论缺陷方向如何，均可有效检测。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "磁粉检测灵敏度与缺陷方向有关，当缺陷方向与磁力线垂直时最易检测，平行时难以检测。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652958", "t": 3, "q": "材料成型质量检测中，磁粉检测（MT）适用于所有金属材料的表面缺陷检测，包括非铁磁性金属（如铝合金）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "磁粉检测（MT）是基于铁磁性材料被磁化后，表面和近表面缺陷产生漏磁场吸附磁粉来显示缺陷的方法，只适用于铁磁性金属材料，不能用于非铁磁性金属。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652959", "t": 3, "q": "材料成型质量检测中，目视检测（VT）是最基础的检测方法，可作为其他无损检测方法的预处理，排除明显的表面缺陷。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "目视检测确实是材料成型质量检测里最基础的方法，能先发现明显表面缺陷，可作为其他无损检测的预处理。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652960", "t": 3, "q": "材料成型质量检测中，射线检测（RT）对金属材料内部的体积型缺陷（如气孔、夹渣）的检测灵敏度，高于面积型缺陷（如裂纹）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "射线检测对体积型缺陷有较高灵敏度，而对面积型缺陷（裂纹）当射线方向与裂纹面夹角不合适时难以检测到，所以对体积型缺陷检测灵敏度高于面积型缺陷。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652961", "t": 3, "q": "材料成型质量检测中，渗透检测（PT）不仅能检测表面开口缺陷，还能检测金属材料的内部缺陷。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "渗透检测（PT）原理是将渗透液渗入表面开口缺陷，只能检测表面开口缺陷，无法检测金属材料内部缺陷。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652962", "t": 3, "q": "材料成型质量检测中，渗透检测的渗透剂分为水洗型、后乳化型和溶剂去除型，其中溶剂去除型渗透剂适用于表面粗糙的工件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "溶剂去除型渗透剂不适用于表面粗糙工件，因其去除多余渗透剂时，粗糙表面易残留溶剂，影响检测效果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652963", "t": 3, "q": "材料成型质量检测中，声发射检测（AE）需要对材料施加外部载荷，才能监测到缺陷的产生和扩展。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "声发射是材料在受力变形和断裂过程中产生弹性波的现象，声发射检测就是通过监测这些弹性波来了解缺陷情况，所以要让材料产生声发射就得施加外部载荷使缺陷产生和扩展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652964", "t": 3, "q": "材料成型质量检测中，声发射检测无需停止设备运行，可实时监测设备在工作过程中缺陷的产生与扩展，因此适用于大型压力容器、桥梁等结构的在线安全监测。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "声发射检测确实无需停止设备运行，能实时监测设备工作时缺陷的产生与扩展，所以很适合用于大型压力容器、桥梁等结构的在线安全监测。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652965", "t": 3, "q": "材料成型质量检测中，涡流检测（ET）适用于所有导电材料，包括金属和导电的非金属材料（如碳纤维复合材料）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "涡流检测基于电磁感应原理，导电材料在交变磁场中会产生涡流，可借此检测缺陷，所以适用于金属和导电非金属材料。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652966", "t": 3, "q": "工程材料热处理中，奥氏体不锈钢的固溶处理加热温度应高于1050℃，以确保碳化物充分溶解，提高耐腐蚀性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "奥氏体不锈钢固溶处理目的是使碳化物充分溶解，加热温度通常高于1050℃，这样能提高其耐腐蚀性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652967", "t": 3, "q": "工程材料热处理中，贝氏体转变的温度区间介于珠光体转变温度和马氏体转变开始温度（Ms）之间，转变产物贝氏体具有良好的强韧性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "贝氏体转变温度确实在珠光体转变温度与马氏体转变开始温度（Ms）之间，且贝氏体组织形态使其具有良好强韧性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652968", "t": 3, "q": "工程材料热处理中，淬火后的钢件必须进行回火处理，否则钢件会因内应力过大而产生开裂。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "淬火会使钢件产生很大内应力，不回火内应力易导致钢件开裂，所以淬火后必须回火。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652969", "t": 3, "q": "工程材料热处理中，等温淬火是将钢件加热奥氏体化后，快速冷却至马氏体转变温度区间（Ms以下），保温至转变完全，以获得马氏体组织。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "等温淬火是将钢件加热奥氏体化后，快速冷却到贝氏体转变温度区间（Ms 以上）等温保持，获得贝氏体组织，而不是快速冷却至马氏体转变温度区间（Ms 以下）获得马氏体组织。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652970", "t": 3, "q": "工程材料热处理中，第二类回火脆性（高温回火脆性）是可逆的，当钢件出现此类脆性后，重新加热至600℃以上保温一段时间，然后快速冷却即可消除。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "第二类回火脆性是可逆的，出现此类脆性后，重新加热到600℃以上保温后快冷能消除。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652971", "t": 3, "q": "工程材料热处理中，调质处理（淬火+高温回火）后的钢件，其硬度通常高于单纯淬火后的钢件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "淬火后钢件硬度高、脆性大，而调质处理是淬火后高温回火，高温回火会使钢的硬度降低、韧性提高，所以调质处理后的钢件硬度低于单纯淬火后的钢件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652972", "t": 3, "q": "工程材料热处理中，共析钢球化退火时，若加热温度过高（远超Ac1），会导致渗碳体大量溶解，冷却时易重新形成片状珠光体，反而降低球化效果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "加热温度远超Ac1，渗碳体大量溶解，冷却时渗碳体易以片状形式析出形成片状珠光体，不利于球状渗碳体形成，降低球化效果。", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652973", "t": 3, "q": "工程材料热处理中，过共析钢的球化退火需先加热至Ac1以上，使网状渗碳体溶解，再缓冷使渗碳体球化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "过共析钢球化退火先加热到Ac₁以上，可使网状渗碳体溶解，随后缓冷能让渗碳体球化，该描述符合过共析钢球化退火工艺。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652974", "t": 3, "q": "工程材料热处理中，马氏体转变是一种扩散型相变，转变过程中原子需要通过扩散实现重新排列。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "马氏体转变是无扩散型相变，转变过程中原子不进行扩散来实现重新排列。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652975", "t": 3, "q": "工程材料热处理中，去应力退火的加热温度应高于材料的再结晶温度，以确保内应力完全消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "去应力退火加热温度低于材料的再结晶温度，并非高于。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810592438652976", "t": 3, "q": "工程材料热处理中，亚共析钢的完全退火加热温度应高于Ac1但低于Ac3，以获得细晶粒组织。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "亚共析钢完全退火加热温度应高于Ac3，而不是高于Ac1但低于Ac3。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 材料成型及控制工程（2）", "n": "基础练习题【含解析】 / 第3章 材料成型及控制工程（2）", "qs": [{"id": "2034810595580186624", "t": 1, "q": "金属成型装备中，\"摩擦压力机\"的工作原理是利用什么能量使金属变形？", "a": ["曲柄连杆机构的动能", "液压能转化为压力", "电机的旋转能量转化为滑块的冲击能量", "电磁铁的吸力", "", ""], "r": "C", "e": "摩擦压力机是通过电机的旋转能量，经传动系统转化为滑块的冲击能量来使金属变形。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186625", "t": 1, "q": "金属成型装备中，\"曲柄压力机\"的工作特性是？", "a": ["主要用于自由锻", "适合高速连续冲压薄料", "行程固定，压力随行程变化", "行程可调，压力恒定", "", ""], "r": "C", "e": "曲柄压力机行程固定，工作时压力随滑块的行程而变化。自由锻主要用空气锤等设备；高速连续冲压薄料一般是高速压力机特点；曲柄压力机行程固定非可调，压力也不恒定。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186626", "t": 1, "q": "金属成型装备中，\"液压机\"的主要优势是？", "a": ["压力和行程可灵活调节，适合大吨位、复杂件成型", "设备成本低，维护简单", "行程速度快，适合高速冲压", "行程固定，压力恒定", "", ""], "r": "A", "e": "液压机压力和行程能灵活调节，可满足大吨位、复杂件成型需求。B选项设备成本不低，维护也不简单；C选项行程速度不如机械压力机快；D选项行程和压力可调节并非固定恒定。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186627", "t": 1, "q": "金属成型装备中，\"辗环机\"主要用于生产下列哪种锻件？", "a": ["轴类锻件", "环形锻件（如轴承环、齿轮环）", "复杂形状锻件", "盘类锻件", "", ""], "r": "B", "e": "“辗环机”从名称可知与环形相关，其主要功能就是生产环形锻件。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186628", "t": 1, "q": "金属锻造工艺中，\"自由锻\"与\"模锻\"的主要区别在于？", "a": ["锻造设备的类型", "是否使用模具限制金属流动", "锻件的材料类型", "锻造温度的高低", "", ""], "r": "B", "e": "自由锻无模具限制金属流动，模锻用模具限制金属流动，这是二者主要区别。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186629", "t": 1, "q": "金属挤压成型中，\"正向挤压\"与\"反向挤压\"的主要区别是？", "a": ["挤压产品的截面形状", "挤压金属的流动方向与挤压轴运动方向是否相同", "挤压温度的高低", "挤压模具的材质", "", ""], "r": "B", "e": "正向挤压和反向挤压的关键差异在于金属流动方向与挤压轴运动方向的关系。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186630", "t": 1, "q": "金属挤压成型装备中，挤压机的\"挤压筒\"设计需重点考虑的性能要求是？", "a": ["耐高温、耐高压、抗磨损", "良好的焊接性能", "高导热性", "高塑性", "", ""], "r": "A", "e": "挤压机工作时，挤压筒要承受高温高压，且金属物料在其中挤压流动会产生磨损，所以需重点考虑耐高温、耐高压、抗磨损性能。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186631", "t": 1, "q": "金属冷冲压成型中，拉深工艺出现\"起皱\"缺陷的主要原因是坯料哪个区域的应力超过材料的临界应力？", "a": ["凸缘区", "筒壁区", "圆角区", "底部区", "", ""], "r": "A", "e": "拉深时坯料凸缘区受切向压应力，当该应力超过材料临界应力就会起皱。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186632", "t": 1, "q": "金属模具设计中，\"导向机构\"的核心作用是保证模具在开合模过程中？", "a": ["熔体均匀填充型腔", "凸模与凹模的正确对中性", "塑件顺利脱模", "型腔尺寸精度", "", ""], "r": "B", "e": "导向机构主要是为了确保凸模和凹模在开合模过程中能准确对中。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186633", "t": 1, "q": "金属模具设计中，\"分型面\"的选择原则不包括下列哪一项？", "a": ["使塑件留在动模一侧", "保证塑件能顺利脱模", "分型面尽量选择在塑件的最大截面处", "分型面尽量复杂，以保证密封", "", ""], "r": "D", "e": "分型面应尽量简单，复杂的分型面会增加模具制造难度、成本，且不利于脱模等，而不是尽量复杂来保证密封。A选项使塑件留在动模一侧利于脱模取件；B选项保证塑件顺利脱模是基本要求；C选项在最大截面处分型利于脱模。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186634", "t": 1, "q": "金属模具设计中，\"排气槽\"的设计位置应优先考虑在模具的哪个区域？", "a": ["脱模机构附近", "型腔的最高处", "型腔的最低处", "浇口附近", "", ""], "r": "B", "e": "排气槽主要作用是排出型腔中的空气，型腔最高处易聚集空气，所以排气槽设计位置应优先考虑型腔最高处。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186635", "t": 1, "q": "金属模具设计中，\"凸模\"的强度计算主要考虑哪种载荷？", "a": ["拉伸载荷", "压缩载荷", "弯曲载荷", "冲击载荷", "", ""], "r": "B", "e": "凸模工作时主要承受压力，故其强度计算主要考虑压缩载荷。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186636", "t": 1, "q": "金属塑性成型工艺中，\"镦粗\"是使坯料在哪个方向上受压变形，以增大哪个方向的尺寸？", "a": ["径向受压，轴向尺寸增大", "轴向受压，轴向尺寸增大", "轴向受压，径向尺寸增大", "径向受压，径向尺寸增大", "", ""], "r": "C", "e": "镦粗是对坯料轴向施加压力，坯料轴向缩短，根据体积不变原理，径向尺寸会增大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186637", "t": 1, "q": "金属塑性成型工艺中，\"挤压成型\"的主要优点不包括下列哪一项？", "a": ["金属利用率高", "产品尺寸精度高", "适合生产大型厚壁锻件", "可生产复杂截面的型材", "", ""], "r": "C", "e": "挤压成型适合生产小型、薄壁、复杂截面的型材，不适合生产大型厚壁锻件。而A金属利用率高、B产品尺寸精度高、D可生产复杂截面的型材都是挤压成型优点。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186638", "t": 1, "q": "金属塑性成型工艺中，\"拉拔\"主要用于生产下列哪种产品？", "a": ["厚钢板", "大型锻件", "齿轮坯", "无缝钢管、钢丝", "", ""], "r": "D", "e": "拉拔是使金属坯料通过拉拔模的模孔而变形的加工方法，常用于生产无缝钢管、钢丝等。厚钢板一般用轧制，大型锻件用锻造，齿轮坯常用锻造或铸造。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186639", "t": 1, "q": "金属塑性成型工艺中，\"拉深系数\"是衡量拉深变形程度的指标，其定义是？", "a": ["拉深前坯料直径与拉深后工件直径的比值", "拉深前坯料高度与拉深后工件高度的比值", "拉深后工件直径与拉深前坯料直径的比值", "拉深后工件高度与拉深前坯料高度的比值", "", ""], "r": "C", "e": "拉深系数 m 是拉深后圆筒件直径 d 与拉深前坯料直径 D 的比值，m=d/D。拉深系数越小，表示变形程度越大。因此选 C。", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186640", "t": 1, "q": "金属塑性成型工艺中，\"冷挤压\"与\"热挤压\"的主要区别在于？", "a": ["冷挤压产品精度低，热挤压精度高", "冷挤压无需润滑剂，热挤压需要", "冷挤压仅适用于有色金属，热挤压仅适用于黑色金属", "冷挤压在室温下进行，热挤压在再结晶温度以上进行", "", ""], "r": "D", "e": "冷挤压和热挤压的关键区别在于加工温度，冷挤压是在室温下进行，热挤压是在再结晶温度以上进行。A选项热挤压精度一般不如冷挤压；B选项冷挤压也常需润滑剂；C选项冷挤压和热挤压对有色金属和黑色金属都适用。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186641", "t": 1, "q": "金属塑性成型过程中，\"动态回复\"和\"动态再结晶\"的主要区别在于是否发生？", "a": ["应变的增加", "应力的降低", "位错的运动", "晶粒的重新形核与长大", "", ""], "r": "D", "e": "动态回复中不发生晶粒重新形核与长大，动态再结晶会有新晶粒的形核与长大，这是二者主要区别。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186642", "t": 1, "q": "金属塑性成型过程中，\"加工硬化\"会导致金属的哪种性能发生变化？", "a": ["塑性降低，强度提高", "塑性和强度均降低", "塑性提高，强度降低", "塑性和强度均提高", "", ""], "r": "A", "e": "加工硬化是金属在塑性变形时，随着变形量增加，强度和硬度提高，而塑性和韧性降低。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186643", "t": 1, "q": "金属塑性成型中，\"等温锻造\"的主要目的是为了减少金属的哪种阻力，提高塑性？", "a": ["摩擦阻力", "弹性变形阻力", "塑性变形阻力（流变应力）", "冷却收缩阻力", "", ""], "r": "C", "e": "等温锻造是使模具和坯料温度保持一致，这样能降低金属的塑性变形阻力（流变应力），提高金属塑性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186644", "t": 1, "q": "金属塑性成型中，\"模具间隙\"对冲压件质量影响显著，当冲裁模具间隙过小时，会导致冲压件出现哪种缺陷？", "a": ["尺寸精度降低", "断面粗糙，产生二次剪切面", "毛刺过大", "卸料困难", "", ""], "r": "B", "e": "冲裁模具间隙过小时，材料受挤压严重，会产生二次剪切，使断面粗糙并出现二次剪切面。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186645", "t": 1, "q": "塑料成型工艺中，\"挤出成型\"适合生产下列哪种类型的塑料制品？", "a": ["形状复杂的精密塑件（如齿轮）", "大型厚壁塑件（如塑料箱体）", "中空塑件（如塑料瓶）", "连续截面的型材（如塑料管、板材）", "", ""], "r": "D", "e": "挤出成型是通过挤出机将塑料连续挤出，适合生产具有连续截面的型材。A选项形状复杂精密塑件一般用注塑成型；B选项大型厚壁塑件注塑等工艺更合适；C选项中空塑件常用吹塑成型。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186646", "t": 1, "q": "塑料成型工艺中，\"压制成型\"适合生产下列哪种塑件？", "a": ["精密小塑件", "大型、厚壁、批量小的塑件", "薄壁、复杂形状塑件", "连续生产的管材", "", ""], "r": "B", "e": "压制成型是将塑料原料直接加入模具型腔内，通过加热、加压使其成型，该工艺模具成本高、生产周期长，适合大型、厚壁、批量小的塑件。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186647", "t": 1, "q": "塑料成型工艺中，\"压注成型（传递成型）\"与\"压制成型\"的主要区别是？", "a": ["压注成型塑件尺寸精度低", "压注成型无需加热", "压注成型仅适用于热塑性塑料", "压注成型有浇注系统，塑料在模具内熔化并通过浇口进入型腔", "", ""], "r": "D", "e": "压注成型有浇注系统，塑料先在加料腔内受热塑化，再通过浇口进入型腔，这是与压制成型的主要区别；压注成型塑件尺寸精度较高，需加热，可用于热固性和热塑性塑料。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186648", "t": 1, "q": "塑料成型工艺中，\"注射成型周期\"不包括下列哪个阶段？", "a": ["充模阶段", "保压阶段", "冷却定型阶段", "锻造阶段", "", ""], "r": "D", "e": "注射成型是塑料成型工艺，而锻造是金属加工工艺，不属于注射成型周期阶段。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186649", "t": 1, "q": "塑料成型工艺中，\"注射速度\"过快会导致塑件出现哪种缺陷？", "a": ["气泡", "尺寸精度降低", "缩孔", "飞边", "", ""], "r": "D", "e": "注射速度过快，塑料熔体快速冲击模具，可能会使熔体溢出模具分型面等部位形成飞边。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186650", "t": 1, "q": "塑料成型工艺中，\"注射压力\"的选择主要取决于下列哪个因素？", "a": ["浇注系统的浇口数量", "塑件的颜色", "塑料的流动性和塑件的壁厚", "模具的冷却速度", "", ""], "r": "C", "e": "注射压力需克服塑料流动阻力，塑料流动性差、塑件壁厚大时，所需注射压力大，所以主要取决于塑料的流动性和塑件的壁厚。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186651", "t": 1, "q": "塑料成型中，\"热固性塑料\"与\"热塑性塑料\"的成型工艺最大区别在于？", "a": ["热塑性塑料成型温度低于热固性塑料", "热塑性塑料成型过程中发生化学交联反应", "热固性塑料成型过程中发生化学交联反应，成型后不可重塑", "热固性塑料成型后可再次加热重塑", "", ""], "r": "C", "e": "热固性塑料成型时发生化学交联反应，形成网状结构，成型后不可再重塑；热塑性塑料加热可软化，冷却变硬，能反复重塑。A选项比较成型温度不是最大区别；B热塑性塑料成型无化学交联反应；D热固性塑料成型后不可再次加热重塑。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186652", "t": 1, "q": "塑料成型中，“热流道模具”的主要优点是？", "a": ["仅适用于小批量生产", "浇注系统凝料可回收利用", "消除浇注系统凝料，提高材料利用率，缩短成型周期", "模具结构简单，成本低", "", ""], "r": "C", "e": "热流道模具能让塑料在流道内始终保持熔融状态，避免产生浇注系统凝料，提高材料利用率，还能缩短成型周期。A选项它适用于大批量生产；B选项热流道无浇注系统凝料不存在回收问题；D选项热流道模具结构复杂成本高。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186653", "t": 1, "q": "塑料成型中，\"熔体流动速率（MFR）\"是评价塑料哪种性能的指标？", "a": ["耐热性", "力学强度", "流动性", "耐腐蚀性", "", ""], "r": "C", "e": "熔体流动速率（MFR）主要用于衡量塑料在一定温度和压力下的流动能力，即评价塑料的流动性。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186654", "t": 1, "q": "塑料模具的\"导向柱\"通常设置在模具的哪个部位？", "a": ["定模一侧", "型腔内部", "浇注系统中", "动模一侧", "", ""], "r": "A", "e": "导向柱的作用是确保模具在开合过程中能够准确对位，防止模具错位。通常，导向柱设置在模具的开合方向上。正确答案是A.定模一侧。", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186655", "t": 1, "q": "塑料模具的\"浇注系统\"中，\"主流道\"的设计需保证其轴线与模具的哪个部件轴线重合？", "a": ["型腔", "导柱", "脱模顶杆", "浇口套", "", ""], "r": "D", "e": "主流道是塑料熔体进入模具型腔的首要通道，浇口套是安装在模具上与注射机喷嘴对接的零件，主流道轴线要与浇口套轴线重合，才能保证塑料熔体顺利进入。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186656", "t": 1, "q": "塑料模具的\"冷却系统\"设计需遵循的基本原则是？", "a": ["冷却通道越粗越好", "冷却通道与型腔表面距离均匀", "仅在塑件厚壁处设置冷却通道", "冷却通道数量越少越好", "", ""], "r": "B", "e": "冷却通道与型腔表面距离均匀能使塑件各部分冷却均匀，避免出现变形等问题，是冷却系统设计基本原则。冷却通道不是越粗越好，要综合考虑；不能仅在塑件厚壁处设置，需整体考虑；冷却通道数量要根据实际情况确定，并非越少越好。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186657", "t": 1, "q": "塑料模具的\"脱模机构\"中，\"顶管脱模\"主要适用于哪种塑件？", "a": ["筒状或中空塑件", "复杂形状塑件", "薄壁塑件", "平板状塑件", "", ""], "r": "A", "e": "顶管脱模是从塑件内孔推出塑件，适合筒状或中空塑件。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186658", "t": 1, "q": "塑料模具的\"温度调节系统\"包括冷却系统和加热系统，下列哪种情况需要启用加热系统？", "a": ["冷却时间过长，需缩短", "塑件厚壁，需快速冷却", "塑料流动性差，需提高模具温度以改善流动", "模具表面有冷凝水", "", ""], "r": "C", "e": "加热系统目的是提高模具温度。A选项应加快冷却而非加热；B选项是要快速冷却，不需要加热；D选项处理冷凝水与启用加热系统改善塑料成型关系不大；C选项塑料流动性差，提高模具温度可改善流动，需启用加热系统。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186659", "t": 1, "q": "塑料注塑成型工艺中，保压阶段的核心作用是下列哪一项？", "a": ["降低型腔内熔体的温度", "使塑料熔体充满模具型腔", "将模具内的气体排出", "补偿塑料熔体在型腔内的体积收缩", "", ""], "r": "D", "e": "保压阶段是为了在熔体冷却收缩时，向型腔补料，补偿体积收缩。A选项降低温度不是保压核心作用；B选项使熔体充满型腔是注射阶段的事；C选项排气一般在合模等阶段完成。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186660", "t": 1, "q": "在材料成型过程的变形行为分析中，\"应力状态软性系数\"越大，说明材料越容易发生哪种变形？", "a": ["弹性变形", "脆性断裂", "蠕变变形", "塑性变形", "", ""], "r": "D", "e": "应力状态软性系数越大，表明应力状态有利于塑性变形，材料就越容易发生塑性变形。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186661", "t": 1, "q": "在材料成型过程的变形行为中，\"超塑性\"是指材料在特定条件下（如一定温度、应变速率），表现出的哪种特性？", "a": ["极高的强度", "极大的塑性（延伸率可达几百甚至几千百分比）", "极低的硬度", "快速的弹性恢复", "", ""], "r": "B", "e": "超塑性重点强调材料塑性方面的超常表现。选项A强度与超塑性定义无关；选项C硬度并非超塑性核心特性；选项D快速弹性恢复也不是超塑性特征。而超塑性就是材料在特定条件下有极大的塑性，延伸率可达几百甚至几千百分比。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186662", "t": 1, "q": "在材料成型过程的变形行为中，“塑性变形体积不变假设”适用于大多数金属，该假设意味着材料塑性变形时？", "a": ["仅纵向和横向尺寸变化，厚度不变", "应力与应变成正比", "密度不变", "重量不变", "", ""], "r": "C", "e": "塑性变形体积不变，即质量与密度的比值不变，质量恒定情况下密度不变。A选项厚度也会变；B选项应力与应变成正比是胡克定律，与体积不变假设无关；D选项重量受重力加速度影响，且题干强调体积，并非重量不变的直接体现。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186663", "t": 1, "q": "在材料成型过程的变形行为中，\"应力集中\"会导致材料在哪个部位更容易发生破坏？", "a": ["弹性变形区域", "应力均匀分布的部位", "应力最小的部位", "应力最大的部位（如缺陷尖端）", "", ""], "r": "D", "e": "应力集中处应力最大，材料承受的力远超其他部位，所以更易破坏。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186664", "t": 1, "q": "在材料成型过程的力学响应分析中，\"弹性变形\"与\"塑性变形\"的本质区别是？", "a": ["卸载后变形是否完全恢复", "是否发生在材料的屈服点之前", "是否产生应力", "变形量的大小", "", ""], "r": "A", "e": "弹性变形卸载后能完全恢复，塑性变形卸载后不能完全恢复，这是二者本质区别。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186665", "t": 1, "q": "在材料成型过程的力学响应中，\"弹性模量\"是衡量材料哪种性能的指标？", "a": ["抵抗弹性变形的能力", "抵抗塑性变形的能力", "抵抗断裂的能力", "抵抗磨损的能力", "", ""], "r": "A", "e": "弹性模量反映材料抵抗弹性变形的难易程度，数值越大，抵抗弹性变形能力越强。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186666", "t": 1, "q": "在材料成型过程的力学响应中，\"泊松比\"是指材料在单向拉伸或压缩时，哪个方向的应变比值？", "a": ["屈服应变与断裂应变之比", "弹性应变与塑性应变之比", "纵向应变与横向应变的绝对值之比", "横向应变与纵向应变的绝对值之比", "", ""], "r": "D", "e": "泊松比定义为材料单向拉伸或压缩时，横向应变与纵向应变绝对值之比。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186667", "t": 1, "q": "在材料成型过程的力学响应中，\"屈服强度\"是指材料开始发生哪种变形时的应力？", "a": ["弹性变形", "断裂", "蠕变", "塑性变形", "", ""], "r": "D", "e": "屈服强度是材料开始产生塑性变形时的应力。弹性变形阶段材料可恢复原状，未达屈服；断裂是破坏状态；蠕变是长时间受力下缓慢变形。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186668", "t": 1, "q": "在材料成型过程的力学响应中，\"塑性流动\"是指金属在塑性变形阶段，原子的主要运动方式是？", "a": ["无规则热运动", "沿特定晶面进行滑移和孪生", "仅沿晶界扩散", "仅在晶粒内部扩散", "", ""], "r": "B", "e": "金属在塑性变形阶段，原子主要通过沿特定晶面进行滑移和孪生的方式运动。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186669", "t": 1, "q": "在材料成型缺陷控制中，铸件\"缩孔\"缺陷的主要控制措施不包括下列哪一项？", "a": ["设置冒口", "采用顺序凝固", "提高浇注温度", "优化铸件结构，避免厚大部位", "", ""], "r": "C", "e": "缩孔是因液态收缩和凝固收缩得不到补充产生的。设置冒口可补缩，顺序凝固利于补缩，优化铸件结构避免厚大部位能减少缩孔倾向。而提高浇注温度会使液态收缩增大，易产生缩孔，不是控制缩孔的措施。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186670", "t": 1, "q": "在材料成型质量检测中，常用于检测金属锻件内部细小裂纹、疏松等体积型缺陷，且对检测结果可进行定量分析的无损检测方法是？", "a": ["目视检测", "渗透检测", "超声波检测", "磁粉检测", "", ""], "r": "C", "e": "目视只能检测表面，渗透检测表面开口缺陷，磁粉检测铁磁性材料表面和近表面缺陷，超声波能检测内部体积型缺陷且可定量分析。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186671", "t": 1, "q": "在金属塑性变形的屈服准则中，适用于大多数韧性金属且能更准确描述复杂应力状态下屈服行为的准则是哪一个？", "a": ["Tresca屈服准则", "最大正应力屈服准则", "Mises屈服准则", "最大切应变屈服准则", "", ""], "r": "C", "e": "Mises屈服准则考虑了中间主应力影响，更符合大多数韧性金属在复杂应力状态下的屈服行为。Tresca屈服准则未考虑中间主应力；最大正应力屈服准则主要用于脆性材料；最大切应变屈服准则应用较少。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186672", "t": 1, "q": "在金属轧制成型中，“宽展”是指轧件在哪个方向上的尺寸变化？", "a": ["垂直于轧制平面的方向（厚度方向）", "轧制方向（纵向）", "任意方向", "垂直于轧制方向的水平方向（横向）", "", ""], "r": "D", "e": "宽展指轧件在轧制时垂直于轧制方向的水平方向（横向）尺寸的变化。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810595580186673", "t": 1, "q": "在塑料模具设计中，\"浇口\"的主要作用不包括下列哪一项？", "a": ["防止熔体倒流", "直接决定塑件的最终尺寸精度", "控制熔体进入型腔的速度和压力", "便于塑件与浇注系统凝料分离", "", ""], "r": "B", "e": "浇口可防止熔体倒流、控制熔体进入型腔速度和压力、便于塑件与浇注系统凝料分离，但它并不直接决定塑件最终尺寸精度，尺寸精度受模具整体设计制造等多因素影响。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149376", "t": 2, "q": "工程材料中，\"复合材料\"按增强体类型分类可分为哪些类型？", "a": ["金属基复合材料", "层状复合材料（如钢-铜复合板材）", "纬纤维增强复合材料（如碳纤维复合材料）", "颗粒增强复合材料（如碳化硅颗粒增强铝合金）", "", ""], "r": "CD", "e": "复合材料按增强体类型分为纤维增强、颗粒增强等。A是按基体类型分，B是按结构特点分。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149377", "t": 2, "q": "工程材料中，\"高速钢\"具有的性能特点有哪些？", "a": ["可加工性好，易制成复杂形状刀具", "良好的韧性和塑性", "高硬度和高红硬性（高温下保持硬度）", "耐腐蚀性强", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149378", "t": 2, "q": "工程材料中，\"铝合金\"按加工方式分类可分为哪些类型？", "a": ["铸造铝合金", "防锈铝合金", "耐热铝合金", "变形铝合金", "", ""], "r": "AD", "e": "铝合金按加工方式分类主要分为铸造铝合金和变形铝合金。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149379", "t": 2, "q": "工程材料中，\"铝合金\"按性能用途分类可分为哪些类型？", "a": ["硬铝合金（如2A12）", "铸造铝合金（如ZL101）", "防锈铝合金（如5A02）", "超硬铝合金（如7A04）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149380", "t": 2, "q": "工程材料中，\"钛合金\"具有的性能特点有哪些？", "a": ["耐腐蚀性强", "常温下塑性好，易成型", "耐高温性能好", "密度小，比强度高", "", ""], "r": "ACD", "e": "钛合金密度小但强度高，比强度出色；化学性质稳定，耐腐蚀性强；能在较高温度下保持性能，耐高温性能佳。不过常温下塑性一般，成型难度大。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149381", "t": 2, "q": "工程材料中，\"铜合金\"按主要合金元素分类可分为哪些类型？", "a": ["黄铜（铜-锌合金）", "紫铜（纯铜）", "青铜（铜-锡合金及其他）", "白铜（铜-镍合金）", "", ""], "r": "ACD", "e": "紫铜是纯铜，不属于按主要合金元素分类的铜合金类型，而黄铜是铜 - 锌合金、青铜是铜 - 锡合金及其他、白铜是铜 - 镍合金，它们是按主要合金元素分类的铜合金类型。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149382", "t": 2, "q": "工程材料中，\"铸铁\"按石墨形态分类可分为哪些类型？", "a": ["蠕墨铸铁", "灰铸铁", "可锻铸铁", "球墨铸铁", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149383", "t": 2, "q": "工程材料中，\"铸铁\"具有的性能特点有哪些？", "a": ["高强度和高塑性", "良好的减震性（阻尼系数大）", "良好的铸造性能（流动性好，收缩小）", "良好的耐磨性（石墨起润滑作用）", "", ""], "r": "BCD", "e": "铸铁含碳量高，塑性差，A错误；铸铁有良好减震性、铸造性能和耐磨性，BCD正确。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149384", "t": 2, "q": "工程材料中，影响金属材料可锻性的主要因素有哪些？", "a": ["金属的组织状态", "金属的化学成分", "变形速度", "锻造温度", "", ""], "r": "ABCD", "e": "金属组织状态、化学成分、变形速度、锻造温度都会影响金属材料可锻性。组织状态不同，可锻性有差异；化学成分会改变金属性能影响可锻性；变形速度影响金属变形抗力和塑性；锻造温度影响金属塑性和变形抗力。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149385", "t": 2, "q": "金属成型装备中，\"锻锤\"的主要类型有哪些？", "a": ["空气锤", "曲柄锤", "蒸汽-空气锤", "液压锤", "", ""], "r": "ABCD", "e": "答案：ABCD锻锤是金属成型装备中的一种重要设备，主要用于对金属材料进行锻造加工。根据工作原理和结构特点，锻锤的主要类型包括空气锤、曲柄锤、蒸汽-空气锤和液压锤。因此，选项A、B、C和D都是正确的。", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149386", "t": 2, "q": "金属成型装备中，\"感应加热炉\"的主要优点有哪些？", "a": ["可实现局部加热（如轴类工件表面加热）", "加热速度快，热效率高", "设备结构简单，维护方便", "加热均匀，工件氧化脱碳少", "", ""], "r": "ABD", "e": "感应加热炉是利用电磁感应原理加热，能聚焦能量实现局部加热，加热速度快且热效率高，能精准控制加热过程使工件加热均匀、氧化脱碳少。不过其设备结构并不简单，维护也较复杂。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149387", "t": 2, "q": "金属成型装备中，\"辊锻机\"的主要应用场景有哪些？", "a": ["环形锻件的扩径", "长轴类锻件的拔长（如台阶轴）", "复杂形状锻件的预成型（如连杆毛坯）", "板类锻件的轧制（如钢板）", "", ""], "r": "BC", "e": "辊锻机是利用轧辊进行锻造的设备，可对长轴类锻件进行拔长、对复杂形状锻件预成型。A选项环形锻件扩径一般用扩孔机；D选项板类锻件轧制用轧机等。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149388", "t": 2, "q": "金属成型装备中，\"加热炉\"按加热方式分类可分为哪些类型？", "a": ["感应加热炉", "燃料加热炉（如煤气炉、油炉）", "真空加热炉", "电阻加热炉", "", ""], "r": "ABD", "e": "加热炉按加热方式可分为感应加热、燃料加热、电阻加热等方式。真空加热炉是按炉内气氛分类。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149389", "t": 2, "q": "金属成型装备中，\"加热炉\"的温度控制系统主要组成部分有哪些？", "a": ["执行器（如加热管、燃料阀）", "控制器（如PLC、温控仪）", "冷却装置（如冷却风扇）", "温度传感器（如热电偶、热电阻）", "", ""], "r": "ABD", "e": "温度控制系统需传感器获取温度信号，控制器根据信号控制，执行器执行控制动作来调节温度，A、B、D是主要组成。冷却装置不是温度控制系统核心组成部分。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149390", "t": 2, "q": "金属成型装备中，\"曲柄压力机\"的主要技术参数有哪些？", "a": ["公称压力（额定压力）", "闭合高度", "滑块行程次数", "滑块行程", "", ""], "r": "ABCD", "e": "这几个参数都是衡量曲柄压力机性能的重要指标，公称压力体现其负载能力，闭合高度影响加工工件尺寸，滑块行程次数关系工作效率，滑块行程与加工范围有关。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149391", "t": 2, "q": "金属成型装备中，\"曲柄压力机\"的主要组成部分有哪些？", "a": ["机身", "离合器与制动器", "曲柄连杆机构", "顶料装置", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149392", "t": 2, "q": "金属成型装备中，\"液压机\"的主要技术参数有哪些？", "a": ["滑块速度（空程、工作行程速度）", "最大工作压力", "滑块行程", "工作台尺寸", "", ""], "r": "ABCD", "e": "这些选项都是液压机重要的技术参数。滑块速度影响工作效率，最大工作压力体现其加工能力，滑块行程决定加工深度范围，工作台尺寸关乎可加工工件大小。答案为ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149393", "t": 2, "q": "金属成型装备中，\"液压机\"相比\"曲柄压力机\"具有的优点有哪些？", "a": ["能提供大吨位压力", "压力和行程可灵活调节", "工作平稳，冲击小", "适合加工大型、复杂、厚壁件", "", ""], "r": "ABCD", "e": "液压机靠液体压力工作，能提供大吨位压力、工作平稳冲击小，且压力和行程可灵活调节，适合大型复杂厚壁件加工，而曲柄压力机在这些方面相对较弱。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149394", "t": 2, "q": "金属成型装备中，\"辗环机\"的主要组成部分有哪些？", "a": ["主辗压轮", "托辊", "芯辊", "信号辊（导向辊）", "", ""], "r": "ABCD", "e": "A. 主辗压轮（驱动辊）：核心部件，负责驱动环件旋转并施加轧制力，通常由电机驱动。<br />C. 芯辊：与主辗压轮相对，穿在环件内部，通过与主辊构成的孔型对环件壁厚进行轧制。<br />B. 托辊：用于支撑和托住环件，保持轧制过程的稳定，常对称分布于芯辊两侧。<br />D. 信号辊（导向辊）：起诱导成圆、定心及增加稳定性的作用。当环件扩大接触到信号辊时，会发出停碾信号，控制尺寸精度", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149395", "t": 2, "q": "金属塑性变形过程中，影响加工硬化程度的主要因素有哪些？", "a": ["应变速率", "变形温度", "金属的晶体结构", "变形量", "", ""], "r": "ABCD", "e": "应变速率、变形温度、金属晶体结构、变形量都会影响加工硬化程度。应变速率高、变形量大会使硬化程度增加；变形温度高会减弱硬化；不同晶体结构加工硬化能力不同。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149396", "t": 2, "q": "金属塑性成型工艺中，\"挤压成型\"按金属流动方向分类可分为哪些类型？", "a": ["径向挤压", "反向挤压", "正向挤压", "复合挤压", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149397", "t": 2, "q": "金属塑性成型工艺中，\"挤压成型\"的主要应用领域有哪些？", "a": ["有色金属管材、型材的生产（如铝合金型材）", "精密齿轮的成型", "黑色金属复杂截面件的生产", "无缝钢管的生产（穿孔挤压）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149398", "t": 2, "q": "金属塑性成型工艺中，\"拉深工艺\"常见的缺陷有哪些？", "a": ["起皱（凸缘区失稳）", "破裂（筒壁区拉应力过大）", "偏斜（模具不对中）", "回弹（弹性恢复导致形状偏差）", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149399", "t": 2, "q": "金属塑性成型工艺中，\"拉深工艺\"的主要工艺参数有哪些？", "a": ["模具间隙", "拉深次数", "压边力", "拉深系数", "", ""], "r": "ABCD", "e": "拉深主要工艺参数包含拉深系数、压边力、模具间隙、拉深次数，共同决定工件成型质量，防止起皱、拉裂缺陷。", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149400", "t": 2, "q": "金属塑性成型工艺中，\"冷冲压成型\"主要包括哪些基本工序？", "a": ["拉深", "弯曲", "胀形", "冲裁（落料、冲孔）", "", ""], "r": "ABCD", "e": "冷冲压成型基本工序有冲裁（落料、冲孔）、弯曲、拉深、胀形等。ABCD选项内容均为冷冲压成型主要基本工序。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149401", "t": 2, "q": "金属塑性成型工艺中，\"冷挤压成型\"的主要优点有哪些？", "a": ["成型速度快，适合大批量生产", "材料利用率高（近净成型）", "可提高产品的力学性能（加工硬化）", "产品尺寸精度高，表面质量好", "", ""], "r": "ABCD", "e": "A. 成型速度快，适合大批量生产：正确。冷挤压可在压力机上一次或多次成形，生产效率高，适合大批量制造。<br />B. 材料利用率高（近净成型）：正确。冷挤压属于少无切削加工，能直接成形出接近最终形状和尺寸的零件，材料浪费少。<br />C. 可提高产品的力学性能（加工硬化）：正确。冷挤压过程中金属发生剧烈塑性变形，产生加工硬化，使强度、硬度提高，并形成有利的纤维流线。<br />D. 产品尺寸精度高，表面质量好：正确。冷挤压件尺寸精度较高，表面粗糙度低，一般可直接使用或只需少量精加工。", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149402", "t": 2, "q": "金属塑性成型工艺中，\"模锻\"相比\"自由锻\"具有的优点有哪些？", "a": ["适用于大批量生产", "金属材料利用率高", "生产效率高", "锻件形状复杂且精度高", "", ""], "r": "ABCD", "e": "模锻有专用模具，适合批量生产，能提高材料利用率、生产效率，还可锻造形状复杂精度高的锻件，自由锻则在这些方面较差。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149403", "t": 2, "q": "金属塑性成型工艺中，\"模锻\"主要包括哪些类型？", "a": ["压力机上模锻（如曲柄压力机模锻）", "胎膜锻", "锤上模锻", "自由锻", "", ""], "r": "ABC", "e": "模锻是在专用模锻设备上利用模具使毛坯成型而获得锻件的锻造方法，包括压力机上模锻、胎膜锻、锤上模锻等。自由锻是使金属坯料在上下砧块间受冲击力或压力而变形，不属于模锻。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149404", "t": 2, "q": "金属塑性成型工艺中，\"热锻\"相比\"冷锻\"具有的优点有哪些？", "a": ["变形抗力小，所需设备吨位低", "塑性好，可成型复杂形状锻件", "无需后续热处理即可获得良好力学性能", "表面质量好，尺寸精度高", "", ""], "r": "AB", "e": "热锻高温下金属变形抗力小、塑性好，可用较小吨位设备加工形状复杂锻件；热锻一般需要后续热处理，且氧化皮会造成表面质量、尺寸精度不如冷锻，CD 错误。<br /><br />", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149405", "t": 2, "q": "金属塑性成型工艺中，\"胀形工艺\"的主要应用场景有哪些？", "a": ["筒形件的扩径成型（如气瓶）", "平板件的局部凸起成型（如花纹、筋条）", "复杂曲面件的成型（如汽车覆盖件局部）", "管件的弯曲成型", "", ""], "r": "ABC", "e": "胀形是使坯料局部受拉而胀出凸起的成型方法。A选项筒形件扩径、B选项平板件局部凸起、C选项复杂曲面件局部成型都符合胀形特点。而管件弯曲成型是使管件产生弯曲变形，并非胀形。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149406", "t": 2, "q": "塑料成型工艺中，\"吹塑成型\"主要包括哪些类型？", "a": ["挤出吹塑（生产中空塑件，如塑料瓶）", "拉伸吹塑（生产高强度中空塑件，如PET瓶）", "注射吹塑（生产高精度中空塑件）", "多层吹塑（用于生产具有特殊功能的多层容器）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149407", "t": 2, "q": "塑料成型工艺中，\"挤出成型\"的主要工艺参数有哪些？", "a": ["机头压力", "料筒温度", "牵引速度", "螺杆转速", "", ""], "r": "ABCD", "e": "挤出成型中，料筒温度影响塑料的塑化状态；螺杆转速影响物料输送和塑化效果；牵引速度关系到制品的尺寸和质量；机头压力也对制品成型有重要作用，ABCD四个参数都是挤出成型主要工艺参数。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149408", "t": 2, "q": "塑料成型工艺中，\"热成型\"主要包括哪些基本工序？", "a": ["压缩成型", "拉伸成型", "真空成型（吸塑）", "压力成型", "", ""], "r": "BCD", "e": "塑料热成型是将塑料片材加热后借助外力成型，包含真空成型（吸塑）、压力成型、拉伸成型；压缩成型属于独立的塑料成型工艺，不属于热成型工序。", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149409", "t": 2, "q": "塑料成型工艺中，\"热固性塑料\"的成型特点有哪些？", "a": ["成型周期通常比热塑性塑料长", "成型过程中发生化学交联反应", "需控制成型温度和压力以保证固化完全", "成型后不可再次加热重塑", "", ""], "r": "ABCD", "e": "热固性塑料成型时发生化学交联反应，成型后形成网状结构，不可再次加热重塑。其成型需控制温度和压力保证固化完全，且成型周期通常比热塑性塑料长。ABCD四个选项均是热固性塑料的成型特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149410", "t": 2, "q": "塑料成型工艺中，\"压制成型\"的主要工艺参数有哪些？", "a": ["成型压力", "成型温度", "冷却时间", "保压时间", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149411", "t": 2, "q": "塑料成型工艺中，\"压注成型（传递成型）\"相比\"压制成型\"具有的优点有哪些？", "a": ["塑件密度均匀，质量好", "模具磨损小", "可成型复杂形状塑件（如带嵌件、细薄结构）", "成型周期短", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149412", "t": 2, "q": "塑料成型工艺中，\"注射成型\"的模具按浇注系统类型分类可分为哪些类型？", "a": ["冷流道模具", "热流道模具", "单型腔模具", "多型腔模具", "", ""], "r": "AB", "e": "注射成型模具按浇注系统类型分冷流道模具和热流道模具，而单型腔模具和多型腔模具是按型腔数量分类。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149413", "t": 2, "q": "塑料成型工艺中，\"注射成型\"的模具按型腔数量分类可分为哪些类型？", "a": ["冷流道模具", "热流道模具", "单型腔模具", "多型腔模具", "", ""], "r": "CD", "e": "题目问按型腔数量分类的类型，A冷流道模具和B热流道模具是按浇注系统分类，C单型腔模具和D多型腔模具是按型腔数量分类。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149414", "t": 2, "q": "塑料成型工艺中，\"注射成型\"的主要工艺阶段有哪些？", "a": ["充模与保压", "开模与脱模", "合模与锁模", "冷却定型", "", ""], "r": "ABCD", "e": "注射成型主要工艺阶段包括合模与锁模、充模与保压、冷却定型、开模与脱模。ABCD选项分别对应了不同阶段。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149415", "t": 2, "q": "塑料成型工艺中，影响热塑性塑料熔体流动性的主要因素有哪些？", "a": ["模具型腔表面粗糙度", "成型温度", "塑料的分子量及分布", "成型压力", "", ""], "r": "BCD", "e": "成型温度、塑料分子量及分布、成型压力都会显著影响热塑性塑料熔体流动性，而模具型腔表面粗糙度主要影响制品表面质量，对熔体流动性影响小。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149416", "t": 2, "q": "塑料模具的\"浇注系统\"设计需考虑的因素有哪些？", "a": ["避免熔体产生过大的剪切应力（防止降解）", "保证熔体均匀填充型腔", "熔体的流动路径（尽量短、直）", "便于塑件与凝料分离", "", ""], "r": "ABCD", "e": "浇注系统设计要确保熔体顺利流动且性能稳定，所以要避免过大剪切应力、保证均匀填充、优化流动路径，同时也要考虑后期塑件与凝料分离。ABCD选项均为需考虑因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149417", "t": 2, "q": "塑料模具的\"冷却系统\"设计需考虑的因素有哪些？", "a": ["冷却通道的布置与型腔表面的距离", "塑件的形状和壁厚分布", "冷却通道的直径和数量", "冷却介质的种类和流速", "", ""], "r": "ABCD", "e": "塑料模具冷却系统设计要综合多方面因素。冷却通道布置与型腔表面距离影响冷却效果；塑件形状和壁厚分布不同，冷却要求有差异；冷却通道直径和数量关乎冷却效率；冷却介质种类和流速也会影响冷却性能。ABCD选项内容都是设计时需考虑的。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149418", "t": 2, "q": "塑料模具的\"脱模机构\"按顶出方式分类，主要包括哪些类型？", "a": ["顶管（推管）脱模", "斜导柱脱模", "顶板（推板）脱模", "顶针（推杆）脱模", "", ""], "r": "ACD", "e": "塑料模具脱模机构按顶出方式，顶管、顶板、顶针是常见顶出方式。斜导柱主要用于侧向抽芯，并非按顶出方式分类的脱模类型。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149419", "t": 2, "q": "塑料模具的\"温度调节系统\"中，加热系统的主要作用有哪些？", "a": ["用于热固性塑料成型，促进固化反应", "降低塑件内应力", "防止模具表面冷凝水（如潮湿环境）", "提高模具温度，改善塑料熔体流动性", "", ""], "r": "ACD", "e": "选项 A 热固性塑料（如酚醛、环氧）成型需在模具内发生交联固化反应，必须主动加热提供反应温度，属于加热系统的核心作用之一，该项正确。<br />选项 B 降低塑件内应力主要靠均匀冷却+缓冷，而非加热系统的主要目的；过度加热反而可能延长冷却周期、增大变形，该项错误。<br />选项 C 在潮湿环境或模温低于露点时，模具表面会结露，导致塑件水纹、锈蚀，加热系统可将模温维持在露点以上防冷凝水，属于实际工程中的典型作用，该项正确。<br />选项 D 提高模温可改善熔体流动性（尤其对PC、PMMA、POM等粘度敏感材料），减少短射、熔接痕，是加热系统常见作用，该项正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810597522149420", "t": 2, "q": "塑料
