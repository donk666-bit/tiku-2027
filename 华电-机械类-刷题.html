]}, {"id": "2034810570993176593", "t": 3, "q": "机械设计的基本要求中，环境适应性要求是指产品能在任意环境条件下正常工作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "环境适应性要求不是指能在任意环境条件下正常工作，而是要能在规定环境下正常工作，因为有些极端环境是难以实现正常工作的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176594", "t": 3, "q": "机械设计的基本要求中，经济性要求是指在设计阶段尽量降低产品的制造成本，无需考虑使用成本。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机械设计的经济性要求不仅要在设计阶段降低产品制造成本，还需考虑使用成本，如能耗、维护费用等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176595", "t": 3, "q": "机械设计的基本要求中，可靠性要求是指产品在使用过程中绝对不发生故障。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "可靠性要求并非产品在使用过程中绝对不发生故障，而是在规定条件和时间内完成规定功能的能力，允许有一定故障概率。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176596", "t": 3, "q": "机械设计的基本要求中，维护性要求是指产品发生故障后，能快速诊断并方便维修。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "维护性要求重点就是产品出现故障时能快速诊断问题并便于维修。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176597", "t": 3, "q": "机械设计的基本要求中，性能要求是核心要求，其他要求（如经济性、安全性）需服从于性能要求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机械设计各要求相互关联、相互制约，不存在其他要求必须服从性能要求的情况，需综合平衡各方面要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176598", "t": 3, "q": "机械设计的一般程序中，技术设计阶段的核心任务是确定产品的整体方案草图。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "技术设计阶段核心是确定机械的主要参数、进行结构设计等，确定整体方案草图是方案设计阶段任务。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176599", "t": 3, "q": "机械设计一般程序中，编制设计任务书阶段需明确产品的功能、性能、成本及开发周期等要求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "编制设计任务书是机械设计一般程序起始阶段，此阶段就是要明确产品功能、性能、成本、开发周期等各方面要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176600", "t": 3, "q": "机械设计一般程序中，初步设计阶段的计算书为初步估算，无需保证计算精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "初步设计阶段虽为初步估算，但也需要保证一定计算精度，以确保后续设计的合理性和可行性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176601", "t": 3, "q": "机械设计一般程序中，工作图设计阶段需绘制产品的三维模型，无需绘制二维工程图。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工作图设计阶段既要绘制产品的三维模型，也需要绘制二维工程图，二维工程图能更清晰准确地表达尺寸、公差等详细信息，是制造和装配的重要依据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176602", "t": 3, "q": "机械设计一般程序中，技术设计阶段需进行零件的强度、刚度等性能校核，确保满足使用要求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "技术设计阶段要进行零件的强度、刚度等性能校核以保证设计的机械满足使用要求，此说法符合机械设计一般程序。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176603", "t": 3, "q": "机械设计一般程序中，样机试制与试验阶段应在工作图设计阶段之前进行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在机械设计一般程序里，是先进行工作图设计，之后才开展样机试制与试验，所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176604", "t": 3, "q": "机械制造工艺过程中，采用先进的数控加工技术可完全消除加工误差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在机械制造中，即使采用先进的数控加工技术，也会受到多种因素影响，如机床精度、刀具磨损、材料特性等，无法完全消除加工误差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176605", "t": 3, "q": "机械制造工艺过程中，粗加工的主要目的是获得符合要求的表面粗糙度和尺寸精度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "粗加工主要是去除大量毛坯余量，而获得符合要求的表面粗糙度和尺寸精度是精加工的目的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176606", "t": 3, "q": "机械制造工艺过程中，工序分散的特点是设备结构复杂，对工人操作技能要求高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工序分散时设备简单、通用性好，对工人操作技能要求低；而设备结构复杂、对工人操作技能要求高是工序集中的特点，所以本题说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176607", "t": 3, "q": "机械制造工艺过程中，工序集中是指将多个工步集中在一个工序中完成，可减少工件装夹次数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工序集中就是把多个工步集中在一个工序里完成，这样能减少工件装夹次数，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176608", "t": 3, "q": "机械制造工艺过程中，基准重合原则是指选择加工精度最高的表面作为工艺基准。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基准重合原则是指应尽量选择被加工表面的设计基准作为精基准，而非选择加工精度最高的表面作为工艺基准。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176609", "t": 3, "q": "机械制造工艺过程中，加工余量过大不仅会增加材料消耗，还会增加切削工时，降低加工效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "加工余量过大会使需切除的材料增多，导致材料消耗增加；同时切除更多材料需要更多切削时间，降低加工效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176610", "t": 3, "q": "机械制造工艺过程中，切削速度过高会导致刀具磨损加快，降低刀具寿命，但能提高加工效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "切削速度高时，刀具与工件摩擦加剧、温度升高，会使刀具磨损加快，缩短刀具寿命；同时单位时间切除材料增多，能提高加工效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176611", "t": 3, "q": "机械制造工艺过程中，热处理工序安排在粗加工前，主要目的是改善材料的切削性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械制造工艺过程中，为改善材料切削性能的热处理工序，如退火、正火等，通常安排在粗加工之前，这样能让材料更易切削。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176612", "t": 3, "q": "机械制造工艺过程中，误差复映是指前道工序的形状误差会传递到后道工序，导致后道工序产生类似误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这种说法正确。在机械制造工艺里，误差复映就是前道工序的形状误差会传递到后道工序，使后道工序出现类似误差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176613", "t": 3, "q": "机械制造工艺过程中，装配精度完全取决于零件的加工精度，零件精度越高，装配精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "装配精度不仅取决于零件加工精度，还与装配方法等有关，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176614", "t": 3, "q": "机械制造工艺过程中，装配时采用修配装配法，可在零件加工精度较低的情况下，获得较高的装配精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "修配装配法是通过修配某一零件来补偿其他零件的累积误差，所以能在零件加工精度较低时获得较高装配精度。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176615", "t": 3, "q": "机械制造装备设计中，加工中心的自动换刀系统可实现刀具的自动更换，无需人工干预。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "加工中心的自动换刀系统具备自动更换刀具功能，能按程序自动完成刀具交换，无需人工手动干预换刀操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176616", "t": 3, "q": "机械制造装备设计中，磨床的砂轮平衡精度直接影响磨削加工的表面质量，平衡精度越低，表面粗糙度值越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "砂轮平衡精度低会使磨削时产生振动，进而影响表面质量，使表面粗糙度值增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176617", "t": 3, "q": "机械制造装备设计中，磨床的砂轮直径减小后，为保持砂轮的线速度不变，需提高砂轮的转速。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "砂轮线速度「test/yiwen_img/importSubject/2034810565347643392.png」（d是直径，n是转速），当v不变，d减小时，n需增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176618", "t": 3, "q": "机械制造装备设计中，普通车床的床身采用铸铁材料，主要是因为铸铁的强度高、韧性好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "普通车床床身用铸铁材料主要是因其铸造性能好、减振性好、成本低等，而非强度高、韧性好，铸铁强度和韧性并非其突出优势。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176619", "t": 3, "q": "机械制造装备设计中，普通车床的溜板箱主要功能是实现主轴的变速和换向。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "普通车床溜板箱主要功能是将光杠或丝杠传来的运动转变为刀架的直线进给运动，而主轴的变速和换向是由主轴箱实现的。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176620", "t": 3, "q": "机械制造装备设计中，普通车床的主轴箱通过改变齿轮的啮合关系，实现主轴的变速和换向。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "普通车床主轴箱就是依靠改变齿轮啮合关系，改变传动比，从而实现主轴变速和换向。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176621", "t": 3, "q": "机械制造装备设计中，数控车床的滚珠丝杠传动相比普通梯形丝杠，具有更高的传动精度和效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "滚珠丝杠传动摩擦小，能将回转运动转化为直线运动时精度高，且效率可达90%以上，远高于普通梯形丝杠。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176622", "t": 3, "q": "机械制造装备设计中，数控机床的主轴回转精度主要取决于主轴轴承的精度和装配精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "主轴轴承的精度以及装配精度对数控机床主轴回转精度影响极大，是决定其回转精度的关键因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176623", "t": 3, "q": "机械制造装备设计中，数控铣床的刀库容量越大，其能加工的零件复杂度越高，适用范围越广。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "刀库容量大仅能提供更多刀具选择，但零件复杂度和适用范围还受机床精度、运动轴数、控制系统等多因素影响，并非仅由刀库容量决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176624", "t": 3, "q": "机械制造装备设计中，铣床的主轴主要承受径向载荷，轴向载荷较小，故主轴轴承多采用径向轴承。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "铣床工作时主轴主要承受径向力，轴向力小，径向轴承能很好满足承受径向载荷需求，所以多采用径向轴承。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810570993176625", "t": 3, "q": "机械制造装备设计中，钻床的进给量是指主轴每转一周，刀具沿轴向移动的距离。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在钻床加工里，进给量的确是主轴每转一周刀具沿轴向移动的距离，这是钻床进给量的定义。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 机械设计制造及其自动化（1）", "n": "基础练习题【含解析】 / 第2章 机械设计制造及其自动化（1）", "qs": [{"id": "2034810574201819136", "t": 1, "q": "带传动中，导致传动比不稳定的主要原因是哪种现象？", "a": ["打滑", "磨损", "疲劳断裂", "弹性滑动", "", ""], "r": "D", "e": "弹性滑动是带传动中不可避免的现象，会使从动轮圆周速度低于主动轮，导致传动比不稳定，而打滑是过载时才出现的现象，磨损和疲劳断裂不影响传动比稳定性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819137", "t": 1, "q": "工业控制器中，下列哪种控制器常用于需要高精度位置控制的伺服系统中？", "a": ["分布式控制系统（DCS）", "可编程逻辑控制器（PLC）", "单片机", "运动控制器", "", ""], "r": "D", "e": "运动控制器专为高精度位置控制等运动控制任务设计，常用于伺服系统。而DCS主要用于过程控制；PLC虽可用于控制，但在高精度位置控制上不如运动控制器；单片机功能通用性强，在高精度位置控制专业性不足。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819138", "t": 1, "q": "工业控制器中，下列哪种PLC的输入/输出点数较多，适合大型复杂控制系统？", "a": ["小型PLC", "中型PLC", "微型PLC", "大型PLC", "", ""], "r": "D", "e": "一般来说，小型、微型PLC输入/输出点数较少，适用于简单控制系统；中型PLC点数适中；大型PLC输入/输出点数多，适合大型复杂控制系统。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819139", "t": 1, "q": "工业控制器中，DCS的核心特点是？", "a": ["完全集中控制", "分散控制，集中管理", "集中控制，分散管理", "完全分散控制", "", ""], "r": "B", "e": "DCS（分布式控制系统）是将控制功能分散到各个控制单元，同时又能在中央进行集中管理。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819140", "t": 1, "q": "工业控制器中，PLC的编程语言中，哪种语言采用图形化表示，类似于电气控制电路图？", "a": ["指令表（IL）", "结构化文本（ST）", "梯形图（LD）", "功能块图（FBD）", "", ""], "r": "C", "e": "梯形图（LD）采用图形化表示，和电气控制电路图类似。指令表是类似汇编的文本语言；结构化文本是高级文本编程语言；功能块图虽也是图形化，但不像电气控制电路图。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819141", "t": 1, "q": "工业控制器中，PLC的程序执行顺序是？", "a": ["从下到上，从右到左", "按指令优先级执行", "随机执行", "从上到下，从左到右", "", ""], "r": "D", "e": "PLC程序扫描执行时遵循从上到下、从左到右的顺序。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819142", "t": 1, "q": "工业控制器中，PLC的输入映像区和输出映像区的状态更新时间分别是？", "a": ["输入映像区和输出映像区均在系统自诊断阶段更新", "输入映像区在输入采样阶段更新，输出映像区在输出刷新阶段更新", "输入映像区和输出映像区均在程序执行阶段更新", "输入映像区在程序执行阶段更新，输出映像区在输入采样阶段更新", "", ""], "r": "B", "e": "PLC工作分为输入采样、程序执行、输出刷新等阶段。输入采样阶段将外部输入信号状态读入输入映像区；输出刷新阶段把输出映像区状态输出到外部设备。所以输入映像区在输入采样阶段更新，输出映像区在输出刷新阶段更新。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819143", "t": 1, "q": "工业控制器中，PLC与上位机进行数据通信时，常用的通信协议是？", "a": ["Profibus协议", "TCP/IP协议", "以上都是", "Modbus协议", "", ""], "r": "C", "e": "PLC与上位机通信，Profibus常用于工业现场设备通信，TCP/IP是网络通用协议可用于数据传输，Modbus是常用的工业通信协议，三者都可用于PLC与上位机数据通信。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819144", "t": 1, "q": "机械连接中，当被连接件之一较厚，且需要频繁拆卸时，应采用哪种螺栓连接形式？", "a": ["铰制孔用螺栓连接", "双头螺栓连接", "普通螺栓连接", "螺钉连接", "", ""], "r": "B", "e": "被连接件之一较厚且需频繁拆卸，双头螺栓连接可避免在厚件上频繁拆装损坏螺纹，比较合适。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819145", "t": 1, "q": "机械连接中，对于薄壁零件的连接，最适合采用哪种螺栓？", "a": ["普通细牙螺栓", "普通粗牙螺栓", "双头螺栓", "沉头螺栓", "", ""], "r": "A", "e": "在机械连接中，薄壁零件需要更细致的连接方式以防止应力集中和变形。以下是对各选项的简要分析：A. 普通细牙螺栓：细牙螺栓具有更小的螺距，可以提供更好的紧固效果和更高的精度，适合用于薄壁零件的连接。B. 普通粗牙螺栓：粗牙螺栓的螺距较大，紧固时产生的应力较大，不适合薄壁零件。C. 双头螺栓：双头螺栓主要用于需要从两端拧紧的场合，不适合薄壁零件的连接。D. 沉头螺栓：沉头螺栓主要用于需要平滑表面的场合，但对薄壁零件的保护作用不如细牙螺栓。综上所述，最适合薄壁零件连接的螺栓是普通细牙螺栓。正确答案是A.普通细牙螺栓。", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819146", "t": 1, "q": "机械连接中，对于承受横向载荷的螺栓连接，若采用普通螺栓，其主要依靠哪种方式传递载荷？", "a": ["螺栓预紧力产生的摩擦力", "螺栓杆与孔的挤压", "螺栓杆的剪切", "螺栓的拉伸", "", ""], "r": "A", "e": "承受横向载荷的普通螺栓连接，是靠螺栓预紧力在被连接件接合面间产生的摩擦力来传递载荷。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819147", "t": 1, "q": "机械连接中，过盈配合连接的承载能力主要取决于哪种因素？", "a": ["过盈量大小", "连接件的外形尺寸", "连接件的材料强度", "配合面的粗糙度", "", ""], "r": "A", "e": "过盈配合靠结合面间的压力产生摩擦力来传递载荷，过盈量越大，结合面间压力越大，承载能力越强。所以过盈配合连接的承载能力主要取决于过盈量大小。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819148", "t": 1, "q": "机械连接中，键连接的主要失效形式是？", "a": ["键的拉伸断裂", "键与键槽的挤压破坏或键的剪切破坏", "键的弯曲断裂", "键槽的磨损", "", ""], "r": "B", "e": "键连接工作时主要承受剪切力和挤压力，所以主要失效形式是键与键槽的挤压破坏或键的剪切破坏。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819149", "t": 1, "q": "机械连接中，螺栓连接的预紧力过大可能导致的问题是？", "a": ["被连接件变形", "螺栓断裂", "摩擦力减小", "连接松动", "", ""], "r": "B", "e": "预紧力过大，螺栓承受的拉力超出其承载能力易断裂。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819150", "t": 1, "q": "机械连接中，螺纹连接的螺纹牙型中，哪种牙型的自锁性能最好？", "a": ["梯形螺纹", "三角形螺纹", "矩形螺纹", "锯齿形螺纹", "", ""], "r": "B", "e": "三角形螺纹牙型角大，摩擦力大，自锁性能好。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819151", "t": 1, "q": "机械连接中，铆钉连接的主要缺点是？", "a": ["安装复杂", "承载能力低", "不能拆卸", "定心精度差", "", ""], "r": "C", "e": "答案：C铆钉连接是将一端带有半圆形预制钉头的铆钉，插入被连接件的钉孔中，利用铆钉枪或压铆机将另一端压成封闭钉头，从而使连接件夹紧形成连接。铆钉连接的主要缺点是不可拆卸，如果需要拆卸，必须破坏连接件。其他选项如安装复杂、承载能力低、定心精度差，并非铆钉连接的主要缺点。", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819152", "t": 1, "q": "机械连接中，平键连接的键槽通常开设在哪个零件上？", "a": ["轴和轮毂上都开设", "仅在轮毂上", "轴或轮毂上任意开设", "仅在轴上", "", ""], "r": "A", "e": "平键连接时，轴和轮毂配合，为实现连接，需在轴和轮毂上都开设键槽来安装平键。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819153", "t": 1, "q": "机械制造工艺规程设计中，确定加工余量的主要依据是？", "a": ["零件的尺寸公差", "零件的表面粗糙度", "上一道工序的尺寸公差和表面质量", "下一道工序的尺寸要求", "", ""], "r": "C", "e": "确定加工余量要考虑上道工序加工后实际达到的尺寸、形状、位置精度等，也就是上一道工序的尺寸公差和表面质量。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819154", "t": 1, "q": "机械制造工艺规程中，“工序集中”的主要优点是？", "a": ["设备数量少，占地面积小", "便于调整和更换产品", "生产效率高", "对操作人员技术要求低", "", ""], "r": "A", "e": "工序集中是将许多加工内容集中在一道工序中完成。这样可减少设备数量，从而减少占地面积。B选项便于调整和更换产品是工序分散特点；C选项生产效率高并非工序集中主要优点；D选项工序集中对操作人员技术要求高。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819155", "t": 1, "q": "机械制造工艺规程中，\"基准统一\"原则是指？", "a": ["定位基准与测量基准统一", "不同零件的相同加工表面采用同一基准", "同一零件的不同加工表面采用同一精基准", "设计基准与工艺基准统一", "", ""], "r": "C", "e": "“基准统一”原则即同一零件不同加工表面采用同一精基准，可减少基准转换误差、简化夹具设计制造。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819156", "t": 1, "q": "机械制造工艺规程中，确定工序顺序时，通常应遵循的原则是？", "a": ["先加工平面，后加工孔", "先加工精度要求低的表面，后加工精度要求高的表面", "先加工内部表面，后加工外部表面", "先加工次要表面，后加工主要表面", "", ""], "r": "A", "e": "机械制造确定工序顺序一般先加工平面后加工孔，因平面定位稳定，先加工平面利于后续孔加工；应先加工精度低的表面再加工精度高的，先外后内，先主要表面后次要表面。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819157", "t": 1, "q": "机械制造工艺中，\"工序分散\"的主要适用场景是？", "a": ["大批量生产", "单件小批量生产", "高精度零件加工", "大型零件加工", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819158", "t": 1, "q": "机械制造工艺中，\"基准重合\"原则是指？", "a": ["工艺基准与测量基准重合", "定位基准与测量基准重合", "定位基准与设计基准重合", "设计基准与工艺基准重合", "", ""], "r": "C", "e": "“基准重合”在机械制造工艺里主要是指定位基准和设计基准重合，这样能减少误差。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819159", "t": 1, "q": "机械制造工艺中，定位基准分为粗基准和精基准，选择粗基准时应遵循的首要原则是？", "a": ["基准重合原则", "保证零件加工表面的位置精度", "基准统一原则", "保证零件重要表面的加工余量均匀", "", ""], "r": "D", "e": "选粗基准首要考虑的是保证重要表面加工余量均匀。基准重合和基准统一是精基准选择原则，粗基准难保证零件加工表面位置精度。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819160", "t": 1, "q": "机械制造工艺中，若零件的加工精度要求较高，应采用哪种工艺路线？", "a": ["粗加工-精加工的工艺路线", "工序集中的工艺路线", "工序分散的工艺路线", "粗加工-半精加工-精加工的工艺路线", "", ""], "r": "D", "e": "当零件加工精度要求较高时，仅粗加工和精加工难以保证精度，需先粗加工去除大部分余量，再半精加工进一步提高精度，最后精加工达到最终精度要求。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819161", "t": 1, "q": "机械制造工艺中，若零件的某一表面需要经过粗加工、半精加工、精加工三道工序，其加工余量应如何分配？", "a": ["粗加工余量最大，半精加工次之，精加工最小", "半精加工余量最大，粗加工次之，精加工最小", "三道工序余量相等", "精加工余量最大，半精加工次之，粗加工最小", "", ""], "r": "A", "e": "粗加工主要是去除大量多余材料，所以余量最大；半精加工进一步提高精度，余量次之；精加工是保证最终精度和表面质量，余量最小。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819162", "t": 1, "q": "机械制造质量分析中，若采用抽样检验，下列哪种抽样方案的可靠性最高？", "a": ["整群抽样", "分层抽样", "简单随机抽样", "系统抽样", "", ""], "r": "B", "e": "分层抽样是将总体按某些特征分成若干层，然后从各层中独立抽取样本，能较好地保证样本对总体的代表性，相比整群抽样、简单随机抽样和系统抽样，其可靠性更高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819163", "t": 1, "q": "机械制造质量分析中，若零件的尺寸分布呈偏态分布，可能的原因是？", "a": ["抽样方法错误", "测量工具误差", "随机因素影响", "加工过程中存在系统误差", "", ""], "r": "D", "e": "本题可根据偏态分布出现的原因来进行分析。在机械制造质量分析中，零件尺寸分布呈偏态分布通常是由于加工过程中存在系统误差导致的。如刀具的磨损、加工余量的不均匀等系统因素会使得尺寸分布偏离正态分布呈现偏态。而抽样方法错误主要影响样本的代表性，不一定会导致尺寸分布呈偏态；测量工具误差主要会影响测量结果的准确性，而非尺寸分布的形态；随机因素影响下零件尺寸一般呈正态分布。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819164", "t": 1, "q": "机械制造质量分析中，若零件的实际尺寸超出公差范围，该零件属于？", "a": ["合格品", "废品", "待检品", "返修品", "", ""], "r": "B", "e": "公差范围是判断零件合格与否的标准，实际尺寸超出公差范围就不符合质量要求，属于废品。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819165", "t": 1, "q": "机械制造质量分析中，若某工序加工的零件尺寸服从正态分布，且公差范围大于尺寸分布范围，此时工序能力指数Cp的取值范围是？", "a": ["1.0≤Cp<1.33", "Cp<0.67", "Cp≥1.33", "0.67≤Cp<1.0", "", ""], "r": "C", "e": "公差范围大于尺寸分布范围，说明工序能力充足，工序能力指数 Cp≥1.33。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819166", "t": 1, "q": "机械制造质量分析中，直方图的主要用途是？", "a": ["发现质量问题的原因", "监控工序的实时质量", "分析质量特性值的分布规律", "判断工序是否稳定", "", ""], "r": "C", "e": "直方图可展示质量特性值的分布情况，从而分析其分布规律。A项发现原因需因果图等；B项监控实时质量用控制图；D项判断工序是否稳定也常用控制图。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819167", "t": 1, "q": "机械制造质量控制中，若采用控制图监控工序质量，控制图的控制限通常设置在什么位置？", "a": ["±3σ", "±1σ", "±4σ", "±2σ", "", ""], "r": "A", "e": "在机械制造质量控制用控制图监控工序质量时，控制限一般设为±3σ，这是基于正态分布原理，在此区间内产品质量处于正常波动。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819168", "t": 1, "q": "机械制造质量控制中，若采用因果图分析质量问题，其主要作用是？", "a": ["展示质量特性值的分布", "判断工序是否稳定", "确定抽样方案", "找出影响质量问题的主要原因", "", ""], "r": "D", "e": "因果图的核心用途就是分析质量问题产生的原因，找出影响质量问题的主要因素。选项A是直方图的作用；选项B是控制图的作用；选项C和因果图无关。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819169", "t": 1, "q": "机械制造质量控制中，若工序处于统计控制状态，意味着？", "a": ["工序无不合格品产生", "工序的质量波动仅由随机因素引起", "工序的质量波动仅由系统因素引起", "工序的质量特性值无波动", "", ""], "r": "B", "e": "统计控制状态下，工序质量波动是正常的，仅由随机因素引起。随机因素不可避免，所以有不合格品可能，质量特性值也有波动，而系统因素会使工序失控。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819170", "t": 1, "q": "机械制造质量控制中，若零件的尺寸公差为0.02mm，实际尺寸分布的标准差σ=0.003mm，该工序的工序能力指数Cp为？", "a": ["2.22", "1.67", "0.89", "1.11", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819171", "t": 1, "q": "机械制造质量控制中，统计过程控制（SPC）的核心是通过监控哪种参数来判断工序是否稳定？", "a": ["过程能力指数", "工序的公差范围", "质量特性值的统计量（如均值、极差）", "零件的实际尺寸", "", ""], "r": "C", "e": "SPC主要是利用质量特性值的统计量（如均值、极差）来监控工序状态，判断工序是否稳定。过程能力指数是衡量工序能力的指标；工序公差范围是设计规定；零件实际尺寸只是质量特性值的一种表现。所以选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819172", "t": 1, "q": "金属切削刀具的磨损形式中，哪种磨损会直接导致刀具的切削刃变钝，使切削力显著增大？", "a": ["后刀面磨损", "前刀面磨损", "边界磨损", "月牙洼磨损", "", ""], "r": "A", "e": "后刀面磨损会使刀具后刀面与加工表面摩擦加剧，切削刃变钝，切削力显著增大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819173", "t": 1, "q": "金属切削刀具的前角γ0增大，会对切削力产生怎样的影响？", "a": ["主切削力Fc不变", "主切削力Fc减小", "主切削力Fc先增大后减小", "主切削力Fc增大", "", ""], "r": "B", "e": "前角增大，刀刃更锋利，切屑变形减小，从而使主切削力减小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819174", "t": 1, "q": "金属切削过程中，切削温度最高的区域通常是哪个部位？", "a": ["切削层变形区", "切屑与前刀面接触区", "刀尖处", "工件与后刀面接触区", "", ""], "r": "B", "e": "切削热主要来源于切削层金属的变形、切屑与前刀面及工件与后刀面的摩擦。切屑与前刀面接触区消耗功率大，产生热量多且散热条件差，所以温度最高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819175", "t": 1, "q": "金属切削中，刀具的耐用度是指？", "a": ["刀具从开始使用到达到磨钝标准的总切削时间", "刀具的使用寿命", "刀具从开始使用到完全损坏的总时间", "刀具在一次刃磨后到下次刃磨前的总时间", "", ""], "r": "A", "e": "刀具耐用度定义为刀具从开始使用到达到磨钝标准的总切削时间。B选项使用寿命概念宽泛；C选项完全损坏表述不准确；D选项未强调到磨钝标准。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819176", "t": 1, "q": "金属切削中，切削脆性材料时，通常会产生哪种类型的切屑？", "a": ["崩碎切屑", "带状切屑", "粒状切屑", "节状切屑", "", ""], "r": "A", "e": "切削脆性材料时，由于材料塑性小，切屑在形成过程中易崩碎，产生崩碎切屑。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819177", "t": 1, "q": "金属切削中，切削用量三要素包括切削速度vc、进给量f和背吃刀量ap，其中对刀具寿命影响最大的是？", "a": ["切削速度vc", "三者影响相同", "背吃刀量ap", "进给量f", "", ""], "r": "A", "e": "在金属切削中，切削速度对刀具寿命影响最大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819178", "t": 1, "q": "金属切削中，下列哪种切削液主要用于降低切削温度，冷却效果最好？", "a": ["乳化液", "合成切削液", "切削油", "半合成切削液", "", ""], "r": "A", "e": "在金属切削过程中，切削液的主要作用是冷却、润滑、清洗和防锈。不同类型的切削液在这些方面的效果有所侧重。A. 乳化液：主要由矿物油和水混合而成，具有良好的冷却效果和一定的润滑性。B. 合成切削液：主要由合成化合物组成，冷却效果好，润滑性相对较弱。C. 切削油：主要由矿物油组成，润滑性能好，但冷却效果较差。D. 半合成切削液：介于乳化液和合成切削液之间，兼具一定的冷却和润滑性能。题目要求选择主要用于降低切削温度、冷却效果最好的切削液。根据各类切削液的特点，乳化液（A）和合成切削液（B）的冷却效果较好，其中乳化液的冷却效果尤为突出。所以，正确答案是A选项：“乳化液”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819179", "t": 1, "q": "金属切削中，下列哪种因素对切削力的影响最大？", "a": ["背吃刀量ap", "切削速度vc", "刀具前角γ0", "进给量f", "", ""], "r": "A", "e": "背吃刀量对切削力影响最大，因为背吃刀量增加时，切削层面积成正比增大，切削力大幅上升。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819180", "t": 1, "q": "金属切削中，主偏角κr减小，会对主切削力Fc产生怎样的影响？", "a": ["Fc显著增大", "Fc先增大后减小", "Fc显著减小", "Fc基本不变", "", ""], "r": "C", "e": "在金属切削过程中，主偏角κr是一个重要的参数。主偏角是主切削刃在基面上的投影与进给运动方向的夹角。当主偏角κr减小时，切削刃与工件的接触长度增加，导致切削力在工件上的分布更加均匀，减少了切削力的峰值。因此，主切削力Fc会显著减小。所以，正确答案是C选项：“Fc显著减小”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819181", "t": 1, "q": "金属切削中，主切削平面是指哪个平面？", "a": ["通过主切削刃中点并垂直于主切削刃在基面上的投影的平面", "通过主切削刃并垂直于基面的平面", "通过主切削刃并与工件加工表面相切的平面", "与主切削刃平行且垂直于基面的平面", "", ""], "r": "B", "e": "（金属切削原理标准定义）在金属切削刀具角度的参考系中：<br />基面（Pr）：通过切削刃选定点，垂直于该点切削速度方向的平面（通常平行于刀具底面）。<br />主切削平面（Ps）：通过主切削刃且垂直于基面的平面，它同时包含主切削刃并切于工件加工表面。<br />逐项核对：<br />A：描述的是“正交平面（Po，也称主剖面）”——通过主切削刃中点并垂直于主切削刃在基面上投影的平面，不是主切削平面。<br />B：通过主切削刃并垂直于基面的平面​ → 完全符合主切削平面的定义。对<br />C：虽提到“与工件加工表面相切”，但未强调“垂直于基面”，表述不完整，易与切削平面概念混淆。<br />D：与主切削刃平行且垂直于基面的平面 → 这是副切削平面或无关平面，错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819182", "t": 1, "q": "三相同步电动机的励磁电流增大，会对电机的功率因数产生怎样的影响？", "a": ["功率因数不变", "功率因数提高（更接近1）", "功率因数降低", "功率因数先提高后降低", "", ""], "r": "D", "e": "同步电动机在欠励状态，增大励磁电流，功率因数会提高，直到励磁达到正常励磁时功率因数 = 1；继续增大励磁（过励），功率因数又下降，变为超前。因此励磁电流增大，功率因数先提高后降低。", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819183", "t": 1, "q": "三相同步电动机的转速n与电源频率f、电机极对数p的关系为（　），若f=50Hz，p=2，其额定转速应为多少？", "a": ["n=120f/p，3000r/min", "n=60f/p，1500r/min", "n=120p/f，1500r/min", "n=60p/f，750r/min", "", ""], "r": "B", "e": "三相同步电动机转速公式是n = 60f/p。当f = 50Hz，p = 2时，n=60×50÷2 = 1500r/min。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819184", "t": 1, "q": "三相同步电动机启动时，通常需要借助哪种方式才能启动？", "a": ["变频启动", "降压启动", "辅助电动机启动", "直接启动", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810574201819185", "t": 1, "q": "三相同步电动机在负载增加时，若励磁电流不变，电机的转速会如何变化？", "a": ["转速先升高后降低", "转速升高", "转速降低", "转速不变", "", ""], "r": "D", "e": "同步电动机转速n=60f/p,只与电源频率和极对数有关，与负载无关；负载增加仅增大功角，只要不失步转速即保持不变，故选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369856", "t": 2, "q": "工业伺服系统中，常用的伺服电机类型有哪些？", "a": ["交流永磁同步伺服电机", "三相异步电机", "步进电机", "直流伺服电机", "", ""], "r": "ACD", "e": "交流永磁同步伺服电机、步进电机、直流伺服电机都是工业伺服系统常用类型。三相异步电机一般用于普通动力驱动，较少用于伺服系统。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369857", "t": 2, "q": "工业控制器中，运动控制器的主要功能有哪些？", "a": ["转矩控制", "速度控制", "逻辑控制", "位置控制", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369858", "t": 2, "q": "工业控制器中，运动控制器与PLC的主要区别在于哪些方面？", "a": ["控制精度: 运动控制器更高", "价格: 运动控制器通常更昂贵", "控制对象: 运动控制器侧重于位置/速度控制，而PLC侧重于逻辑控制", "编程方式: 运动控制器使用专用的运动控制语言，而PLC常用梯形图等图形化编程方法", "", ""], "r": "ACD", "e": "答案：ACD运动控制器和 PLC 的主要区别在于：1. 控制精度方面，运动控制器通常更高，能满足对位置、速度等精确控制的需求。2. 控制对象不同，运动控制器侧重于位置/速度控制，PLC 更侧重于逻辑控制。3. 编程方式有别，运动控制器使用专用的运动控制语言，PLC 常用梯形图等图形化编程方法。价格方面不是二者的主要本质区别。", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369859", "t": 2, "q": "工业控制器中，DCS的主要组成部分包括哪些？", "a": ["工程师站", "操作站", "现场控制站", "通信网络", "", ""], "r": "ABCD", "e": "DCS（分布式控制系统）主要由工程师站用于系统设计和维护、操作站供操作人员监控和操作、现场控制站进行数据采集和控制、通信网络实现各部分间数据传输。答案选ABCD 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369860", "t": 2, "q": "工业控制器中，DCS与PLC的主要区别在于哪些方面？", "a": ["通信方式: DCS采用工业现场总线，PLC采用串行或以太网", "控制对象: DCS侧重过程控制，PLC侧重逻辑控制", "功能复杂度: DCS功能更复杂，PLC功能相对简单", "系统结构: DCS分散控制，PLC集中控制", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369861", "t": 2, "q": "工业控制器中，PLC的编程语言主要有哪些？", "a": ["结构化文本（ST）", "功能块图（FBD）", "指令表（IL）", "梯形图（LD）", "", ""], "r": "ABCD", "e": "PLC常见编程语言包含结构化文本（ST）、功能块图（FBD）、指令表（IL）、梯形图（LD）等。答案ABCD涵盖了这些常见类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369862", "t": 2, "q": "工业控制器中，PLC的扫描周期主要由哪些因素决定？", "a": ["输入/输出点数", "通信任务的多少", "程序的长度（指令条数）", "CPU的运算速度", "", ""], "r": "ABCD", "e": "扫描周期与程序执行指令条数（即程序长度）、CPU运算处理指令速度有关，输入输出点数会影响I/O处理时间，通信任务会占用时间，这些都会影响扫描周期。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369863", "t": 2, "q": "工业控制器中，PLC的输出模块类型主要有哪些？", "a": ["光电耦合输出型", "晶闸管输出型", "继电器输出型", "晶体管输出型", "", ""], "r": "BCD", "e": "PLC输出模块主要类型有晶闸管输出型、继电器输出型、晶体管输出型。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369864", "t": 2, "q": "工业控制器中，PLC的主要功能有哪些？", "a": ["逻辑控制（如触点通断）", "运动控制（如简单定位）", "计数控制（如计数器）", "定时控制（如定时器）", "", ""], "r": "ABCD", "e": "PLC是可编程逻辑控制器，能实现逻辑控制、运动控制、计数控制和定时控制等多种功能。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369865", "t": 2, "q": "工业控制器中，PLC的主要组成部分包括哪些？", "a": ["输入/输出模块（I/O模块）", "中央处理单元（CPU）", "电源模块", "存储器（ROM、RAM）", "", ""], "r": "ABCD", "e": "PLC主要由中央处理单元（CPU）来进行数据处理和控制；输入/输出模块（I/O模块）用于连接外部设备实现信号输入输出；电源模块提供工作所需电能；存储器（ROM、RAM）用于存储程序和数据。ABCD四个选项都是PLC的主要组成部分。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369866", "t": 2, "q": "工业控制器中，PLC输入模块接收的信号类型主要有哪些？", "a": ["脉冲信号（如编码器信号）", "直流开关量信号（如接近开关）", "模拟量信号（如温度传感器4-20mA信号）", "交流开关量信号（如接触器触点）", "", ""], "r": "ABCD", "e": "PLC输入模块能接收多种信号类型，脉冲信号、直流开关量信号、模拟量信号、交流开关量信号都可接收。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369867", "t": 2, "q": "机械传动中，下列哪些传动方式可实现反向传动？", "a": ["带传动", "蜗杆传动（非自锁）", "圆柱齿轮传动（内啮合）", "圆柱齿轮传动（外啮合）", "", ""], "r": "BD", "e": "带传动一般不能反向传动；非自锁蜗杆传动可反向；内啮合圆柱齿轮传动转向相同，不能反向；外啮合圆柱齿轮传动可反向。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369868", "t": 2, "q": "机械传动中，下列哪些传动方式可实现无级调速？", "a": ["液压传动（如变量泵-定量马达）", "变频调速的异步电机传动", "带传动（如三角带无级变速）", "蜗杆传动", "", ""], "r": "ABC", "e": "液压传动通过变量泵可实现无级调速；变频调速的异步电机通过改变电源频率实现无级调速；带传动中的三角带无级变速能实现无级调速；而蜗杆传动一般不能实现无级调速。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369869", "t": 2, "q": "机械传动中，下列哪些传动方式适用于高速传动？", "a": ["带传动（同步带）", "圆柱齿轮传动（高精度）", "高速轴的链传动", "蜗杆传动", "", ""], "r": "AB", "e": "同步带传动平稳、噪声小、速度高；高精度圆柱齿轮传动精度高，可用于高速；链传动高速时冲击和噪声大，一般不适高速；蜗杆传动效率低、发热大，不适合高速。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369870", "t": 2, "q": "机械连接中，过盈配合连接的装配方法主要有哪些？", "a": ["热胀装配法（加热包容件）", "冷缩装配法（冷却被包容件）", "螺纹装配法", "压入装配法", "", ""], "r": "ABD", "e": "过盈配合连接是利用零件间的过盈量来实现连接，装配方法有热胀装配法（加热包容件）、冷缩装配法（冷却被包容件）、压入装配法。而螺纹装配法是利用螺纹进行连接，不属于过盈配合连接装配方法。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369871", "t": 2, "q": "机械连接中，焊接连接的主要优点有哪些？", "a": ["适用于多种金属材料（如钢、铝）", "结构重量轻（无额外连接件）", "连接强度高，密封性好", "便于实现自动化生产", "", ""], "r": "ABCD", "e": "A 选项，焊接可以实现钢材、铝合金等多种金属材料之间的连接，适用材料范围广，表述正确。<br />B 选项，焊接不需要螺栓、铆钉等额外连接件，不会增加构件附加重量，结构自重更轻，表述正确。<br />C 选项，焊接接头整体性好，连接强度高，焊缝连续时具备良好的密封性能，适合压力容器等需要密封的构件，表述正确。<br />D 选项，埋弧焊、机器人焊接等工艺成熟，很容易实现自动化焊接作业，生产效率高，表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369872", "t": 2, "q": "机械连接中，键连接的类型主要有哪些？", "a": ["平键连接", "半圆键连接", "楔键连接", "切向键连接", "", ""], "r": "ABCD", "e": "键连接是机械连接常用方式，平键、半圆键、楔键、切向键都是常见的键连接类型。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369873", "t": 2, "q": "机械连接中，螺栓连接的拧紧方法主要有哪些？", "a": ["转角控制法（如定角度拧紧）", "预紧力直接控制法（如轴力计）", "手感拧紧法", "扭矩控制法（如扭矩扳手）", "", ""], "r": "ABD", "e": "螺栓连接拧紧方法包括转角控制法、预紧力直接控制法、扭矩控制法等，手感拧紧法不科学，不是主要拧紧方法。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369874", "t": 2, "q": "机械连接中，螺纹连接的防松方法主要有哪些？", "a": ["机械防松（如开口销与槽形螺母）", "永久防松（如焊接、粘接）", "摩擦防松（如弹簧垫圈）", "化学防松（如螺纹胶）", "", ""], "r": "ABCD", "e": "螺纹连接防松方法有多种，机械防松靠机械零件限制松动，永久防松通过焊接等使其固定，摩擦防松利用增加摩擦力防松，化学防松借助化学物质，ABCD选项均是常见防松方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369875", "t": 2, "q": "机械连接中，提高螺栓连接疲劳强度的有效措施有哪些？", "a": ["采用柔性螺栓（如腰形杆螺栓）", "提高螺栓表面粗糙度", "减小螺纹牙间的载荷分配不均", "减小螺栓杆直径", "", ""], "r": "AC", "e": "柔性螺栓可降低应力幅，减小螺纹牙间载荷不均能使受力更合理，都有助于提高疲劳强度；提高表面粗糙度会增加应力集中，降低疲劳强度；减小螺栓杆直径会增大应力，不利于疲劳强度。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369876", "t": 2, "q": "机械连接中，提高螺纹连接密封性的措施有哪些？", "a": ["采用螺纹密封胶", "采用密封垫圈（如橡胶垫圈）", "增大螺栓预紧力", "采用锥形螺纹（如管螺纹）", "", ""], "r": "ABD", "e": "螺纹连接密封性主要通过增加密封材料和特殊螺纹结构来实现。采用螺纹密封胶（A 选项）能在螺纹间隙形成密封层；采用密封垫圈（B 选项），如橡胶垫圈可填补间隙起到密封作用；采用锥形螺纹（D 选项），像管螺纹本身的结构特点有助于提高密封性。增大螺栓预紧力（C 选项）主要是增强连接的紧固程度，对密封性的直接作用相对较小。正确答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369877", "t": 2, "q": "机械连接中，下列哪些连接方式可传递轴向载荷？", "a": ["过盈配合连接", "销连接（圆柱销）", "螺栓连接（受拉）", "花键连接", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369878", "t": 2, "q": "机械连接中，下列哪些属于可拆卸连接？", "a": ["焊接连接", "键连接", "铆钉连接", "螺栓连接", "", ""], "r": "BD", "e": "可拆卸连接指不损坏连接件就能分离被连接件。焊接和铆钉连接破坏连接件才能分离，不是可拆卸连接；键连接和螺栓连接可在不损坏情况下拆卸。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369879", "t": 2, "q": "机械连接中，销连接的主要用途有哪些？", "a": ["传递转矩", "定位", "密封", "安全保护（如过载剪断）", "", ""], "r": "ABD", "e": "销连接能用于定位，保证零件间的正确位置；也可传递一定转矩，特定销还能在过载时剪断起安全保护作用。而密封不是销连接的主要用途。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369880", "t": 2, "q": "机械制造工艺规程设计中，确定加工余量时需要考虑的因素有哪些？", "a": ["本道工序的安装误差", "上一道工序的形状和位置误差", "上一道工序的表面粗糙度", "上一道工序的尺寸公差", "", ""], "r": "ABCD", "e": "选项 A 本道工序的装夹误差会导致工件实际位置偏移，需额外增加余量以补偿定位不准造成的加工偏差，该项正确。<br />选项 B 前道工序遗留的形状和位置误差（如弯曲、偏心、不同轴等）无法通过本工序直接纠正，必须在余量中预留足够厚度予以切除，该项正确。<br />选项 C 前道工序表面粗糙度（微观不平度）和缺陷层（如氧化皮、脱碳层）需在本工序切除，否则影响表面质量，该项正确。<br />选项 D 前道工序的尺寸公差带占用了部分加工余量，本工序余量必须包含该公差值，否则可能出现余量不足，该项正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369881", "t": 2, "q": "机械制造工艺规程中，编制工艺规程前需要收集的资料有哪些？", "a": ["零件图及装配图", "现有生产设备和工艺装备", "零件的生产纲领（产量）", "相关的工艺标准和手册", "", ""], "r": "ABCD", "e": "编制工艺规程需了解加工对象、生产条件、生产规模和参考依据等，ABCD选项分别对应提供了零件设计信息、现有生产能力、生产规模要求和工艺标准指导，都是编制前要收集的资料。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369882", "t": 2, "q": "机械制造工艺规程中，工序的组成部分包括哪些？", "a": ["工步", "工位", "走刀", "安装", "", ""], "r": "ABCD", "e": "工序是机械制造工艺过程的基本单元，工序又可细分为工步、工位、走刀、安装等。ABCD四个选项均是工序的组成部分。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369883", "t": 2, "q": "机械制造工艺规程中，工艺路线的拟定主要包括哪些内容？", "a": ["确定加工顺序", "划分工序", "选择各表面的加工方法", "选择定位基准", "", ""], "r": "ABCD", "e": "工艺路线拟定主要是规划零件加工的整体流程，要确定加工顺序、划分工序、选择加工方法以及定位基准。ABCD四个选项都是工艺路线拟定包含的内容。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369884", "t": 2, "q": "机械制造工艺规程中，下列哪些属于工艺装备的范畴？", "a": ["夹具（如车床夹具）", "刀具（如车刀、铣刀）", "机床（如车床、铣床）", "量具（如千分尺、游标卡尺）", "", ""], "r": "ABD", "e": "工艺装备是产品制造过程中所用各种工具的总称。夹具、刀具、量具都属于工艺装备。机床是加工设备，不属于工艺装备范畴。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369885", "t": 2, "q": "机械制造工艺中，产生加工误差的主要原因有哪些？", "a": ["工艺系统的热变形误差", "工艺系统的几何误差", "工艺系统的受力变形误差", "工件的内应力误差", "", ""], "r": "ABCD", "e": "机械制造中，热变形、几何因素、受力变形以及工件内应力都会导致加工误差。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369886", "t": 2, "q": "机械制造工艺中，机床夹具的基本组成部分包括哪些？", "a": ["导向元件（引导刀具）", "夹具体（连接各元件）", "夹紧元件（固定工件）", "定位元件（确定工件位置）", "", ""], "r": "BCD", "e": "机床夹具基本组成有定位元件确定工件位置、夹紧元件固定工件、夹具体连接各元件。导向元件不是基本组成部分。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369887", "t": 2, "q": "机械制造工艺中，下列哪些属于特种加工方法？", "a": ["电火花加工（EDM）", "超声波加工", "磨削加工", "激光加工", "", ""], "r": "ABD", "e": "特种加工是利用电能、电化学能、光能、声能等能量来进行加工的方法。电火花加工靠脉冲放电蚀除材料；超声波加工利用超声振动去除材料；激光加工用高能量激光束进行加工。而磨削加工是传统的机械加工方法。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369888", "t": 2, "q": "机械制造工艺中，下列哪些因素会影响工序余量的大小？", "a": ["零件的热处理变形", "上一道工序的表面粗糙度", "本道工序的安装误差", "上一道工序的尺寸公差", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369889", "t": 2, "q": "机械制造工艺中，选择精基准时应遵循的原则有哪些？", "a": ["自为基准原则", "互为基准原则", "基准统一原则", "基准重合原则", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369890", "t": 2, "q": "机械制造质量分析中，零件的表面质量主要包括哪些指标？", "a": ["表面层硬度", "表面层残余应力", "表面波纹度", "表面粗糙度", "", ""], "r": "ABCD", "e": "零件表面质量包括表面几何形状特征（表面粗糙度、表面波纹度等）和表面层物理力学性能（表面层硬度、表面层残余应力等）。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369891", "t": 2, "q": "机械制造质量分析中，下列哪些属于偶然误差的特点？", "a": ["误差的算术平均值随测量次数增加而趋近于零", "误差可以被消除", "误差的大小和方向随机变化", "误差的分布符合正态分布", "", ""], "r": "ACD", "e": "偶然误差具有随机性，大小和方向随机变，且大量测量时其分布符合正态分布，多次测量算术平均值趋近于零。而偶然误差不可消除。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369892", "t": 2, "q": "机械制造质量分析中，下列哪些属于系统性误差？", "a": ["刀具的磨损", "工件的随机振动", "机床导轨的平行度误差", "测量工具的零点误差", "", ""], "r": "ACD", "e": "系统性误差是可预测、有规律的误差。机床导轨平行度误差和测量工具零点误差是固定存在、具有确定性规律的，属于系统性误差；刀具磨损会随时间规律变化也属系统性误差；工件随机振动无规律，是随机性误差。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369893", "t": 2, "q": "机械制造质量分析中，下列哪些属于质量改进的常用方法？", "a": ["PDCA循环（计划-执行-检查-处理）", "因果图（鱼骨图）", "直方图", "控制图", "", ""], "r": "ABCD", "e": "PDCA循环是质量改进的基本方法和工作程序；因果图用于分析质量问题产生的原因，为改进提供方向；直方图可分析质量数据分布，发现质量问题；控制图能判断过程是否稳定，以进行质量改进。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369894", "t": 2, "q": "机械制造质量分析中，影响零件加工精度的原始误差有哪些？", "a": ["测量误差", "刀具误差（如刀具磨损）", "机床误差（如导轨误差）", "夹具误差（如定位误差）", "", ""], "r": "ABCD", "e": "测量误差、刀具误差、机床误差、夹具误差都会影响零件加工精度，都是影响加工精度的原始误差。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369895", "t": 2, "q": "机械制造质量控制中，抽样检验的主要优点有哪些？", "a": ["减少检验工作量，提高效率", "检验结果更准确", "减少检验费用", "避免破坏性检验对全部产品的损坏", "", ""], "r": "ACD", "e": "抽样检验是从一批产品中抽取部分进行检验。抽取部分检验相比全检，能减少检验工作量从而提高效率，也能降低检验费用，同时对于有破坏性的检验，抽样可避免对全部产品造成损坏。而抽样检验因样本有限，结果不一定比全检更准确。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369896", "t": 2, "q": "机械制造质量控制中，统计过程控制（SPC）常用的控制图类型有哪些？", "a": ["均值-标准差控制图（X-σ图）", "均值-极差控制图（X-R图）", "缺陷数控制图（c图）", "不合格品率控制图（p图）", "", ""], "r": "ABCD", "e": "SPC常用控制图包括计量值控制图如均值 - 标准差控制图、均值 - 极差控制图，计数值控制图如缺陷数控制图、不合格品率控制图等。ABCD选项均为常用类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369897", "t": 2, "q": "机械制造质量控制中，下列哪些属于过程能力分析的用途？", "a": ["判断工序是否满足产品质量要求", "为工艺改进提供依据", "评估工序的稳定性", "确定抽样检验方案", "", ""], "r": "ABC", "e": "过程能力分析可评估工序满足质量要求的程度，判断工序是否达标（对应A）；能发现工序问题为改进工艺提供方向（对应B）；还可分析工序波动情况评估稳定性（对应C）。而确定抽样检验方案主要依据抽样理论和产品特性等，并非过程能力分析用途。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369898", "t": 2, "q": "机械制造质量控制中，下列哪些属于质量检验的主要职能？", "a": ["预防职能（通过检验改进工艺）", "报告职能（反馈质量信息）", "鉴别职能（判断合格与否）", "把关职能（防止不合格品流入下道工序）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369899", "t": 2, "q": "机械制造中，获得零件尺寸精度的主要加工方法有哪些？", "a": ["试切法（如手动车削试切）", "自动控制法（如数控加工闭环控制）", "定尺寸刀具法（如钻头、铰刀加工）", "调整法（如机床调整后批量加工）", "", ""], "r": "ABCD", "e": "试切法通过试切、测量、调整再试切来保证尺寸精度；自动控制法利用数控等系统自动控制保证精度；定尺寸刀具法靠刀具尺寸保证加工尺寸精度；调整法调好机床后批量加工保证尺寸。这四种都是获得零件尺寸精度的主要加工方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369900", "t": 2, "q": "金属切削刀具的材料应具备的性能有哪些？", "a": ["足够的强度和韧性", "高耐热性（红硬性）", "良好的工艺性（如可加工性）", "高硬度和耐磨性", "", ""], "r": "ABCD", "e": "金属切削刀具工作时要承受切削力和冲击，需足够强度和韧性；要在高温下切削，得有高耐热性；刀具制造加工需要良好工艺性；还要能切削材料，自身得高硬度和耐磨。ABCD选项都是刀具材料应具备性能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369901", "t": 2, "q": "金属切削过程中，影响切削温度的主要因素有哪些？", "a": ["切削液的冷却性能", "刀具前角γ0", "工件材料的导热性", "切削用量（vc、f、ap）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369902", "t": 2, "q": "金属切削中，刀具的几何参数主要包括哪些？", "a": ["副偏角κr'", "主偏角κr", "后角α0", "前角γ0", "", ""], "r": "BCD", "e": "这是一道关于金属切削中刀具几何参数的选择题。在金属切削过程中，刀具的几何参数对于切削效果和刀具寿命至关重要。我们来简要分析这几个选项：A. 副偏角κr'：这是刀具的一个几何参数，但它不是主要的几何参数之一，通常不是首先列出的关键参数。B. 主偏角κr：这是刀具的一个重要几何参数，它影响切削力的大小和切削刃的工作长度，是确定刀具角度时需要考虑的关键因素之一。C. 后角α0：后角是刀具后面与已加工表面之间的夹角，对于减少刀具与工件的摩擦至关重要，也是刀具几何参数中的关键一项。D. 前角γ0：前角是刀具前面与基面之间的夹角，它影响切削力的大小和切屑的流向，同样是刀具几何参数中不可或缺的一部分。综上所述，金属切削中刀具的主要几何参数包括主偏角κr、后角α0和前角γ0，而副偏角κr'虽然也是参数之一，但不属于主要参数。所以，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369903", "t": 2, "q": "金属切削中，切削液的主要作用有哪些？", "a": ["防锈作用", "润滑作用", "冷却作用", "清洗作用", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810576005369904", "t": 2, "q": "金属切削中，下列哪些加工方法属于展成法加工？", "a": ["插齿", "滚齿", "剃齿", "铣齿", "", ""], "r": "ABC", "e": "展成法是利用齿轮刀具与被切齿轮的啮合运动来切出齿形。插齿、滚齿、剃齿都是基于展成原理加工齿轮。而铣齿是成形法加工，用与齿槽形状相符的成形铣刀直接铣出齿形。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577167192064", "t": 3, "q": "带传动的弹性滑动是可以避免的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "带传动的弹性滑动是由于带的弹性变形和拉力差引起的，是不可避免的物理现象。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577167192065", "t": 3, "q": "带传动中，同步带传动可以保证准确的传动比，无弹性滑动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "同步带传动是靠带齿与带轮齿啮合来传递运动和动力，能保证准确的传动比，且不存在弹性滑动。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577167192066", "t": 3, "q": "带传动中，主动轮的包角越小，带传动的承载能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "带传动中，包角越大，带与带轮的接触面积越大，摩擦力就越大，带传动的承载能力越强，所以主动轮包角越小承载能力越弱。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577167192067", "t": 3, "q": "带传动中，主动轮转速越高，带的离心力越大，带的寿命越短。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "带传动中离心力与带速的平方成正比，主动轮转速越高带速越大，离心力越大，会加剧带的磨损，使带的寿命缩短。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577167192068", "t": 3, "q": "带传动中，V带的传动能力比平带强，是因为V带的当量摩擦系数更大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "V带在轮槽中工作，其两侧面与轮槽接触，产生的当量摩擦系数比平带大，能传递更大的圆周力，所以传动能力更强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577167192069", "t": 3, "q": "工业控制器中，PLC的程序是按照\"先输入采样，再程序执行，最后输出刷新\"的循环方式工作的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PLC工作方式是典型的循环扫描，即按“先输入采样，再程序执行，最后输出刷新”循环进行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386368", "t": 3, "q": "机械连接中，过盈配合连接的过盈量越大，连接的承载能力一定越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "过盈量有一定范围，超过合适范围，过大的过盈量会使零件材料产生过大应力甚至破坏，导致承载能力下降，并非过盈量越大承载能力就一定越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386369", "t": 3, "q": "机械连接中，过盈配合连接的装配方法只有压入装配法一种。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "过盈配合连接的装配方法不止压入装配法一种，还有热胀配合法、冷缩配合法等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386370", "t": 3, "q": "机械连接中，焊接连接属于可拆卸连接。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "焊接是通过加热或加压等方式使焊件结合为一体，连接后难以拆卸，属于不可拆卸连接，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386371", "t": 3, "q": "机械连接中，键连接的键槽通常开设在轴上，轮毂上不开设键槽。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "键连接时，轴和轮毂上都要开设键槽来安装键，并非只在轴上开键槽。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386372", "t": 3, "q": "机械连接中，键连接的主要作用是传递轴向载荷。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "键连接主要作用是实现轴与轮毂之间的周向固定以传递转矩，而非传递轴向载荷。", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386373", "t": 3, "q": "机械连接中，螺栓的公称直径是指螺栓杆的直径。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386374", "t": 3, "q": "机械连接中，螺栓的拧紧力矩越大，连接的可靠性越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "螺栓拧紧力矩过大可能导致螺栓过载，出现拉伸断裂、螺纹滑牙等问题，反而降低连接可靠性，并非拧紧力矩越大可靠性越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386375", "t": 3, "q": "机械连接中，螺栓连接的预紧力不足会导致连接松动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "螺栓连接预紧力不足时，在工作过程中，受振动、冲击等外力作用，螺栓容易产生相对滑动，从而导致连接松动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386376", "t": 3, "q": "机械连接中，螺纹连接的螺纹牙型中，三角形螺纹的传动效率最高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "三角形螺纹主要用于连接，其自锁性能好但传动效率低，梯形螺纹等更适合传动，传动效率较高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386377", "t": 3, "q": "机械连接中，销连接的定位精度高于螺栓连接。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "销连接能精确确定被连接件的相对位置，螺栓连接定位精度相对较低。所以销连接定位精度高于螺栓连接。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386378", "t": 3, "q": "机械制造工艺规程中，工序分散的特点是设备数量多，占地面积大，但对操作人员技术要求低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工序分散就是将工艺过程中各工序分散在更多的工位上完成，所以需要的设备数量多，相应占地面积大；由于每个工序操作相对简单，对操作人员技术要求低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386379", "t": 3, "q": "机械制造工艺规程中，工艺文件的主要作用是指导生产现场的加工操作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "工艺文件是机械制造工艺规程的重要组成部分，它详细规定了产品的加工工艺过程、操作方法等，能为生产现场的加工操作提供明确的指导。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386380", "t": 3, "q": "机械制造工艺规程中，基准重合原则是指定位基准与测量基准重合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。基准重合原则是指设计基准与定位基准重合，而非定位基准与测量基准重合。答案为“错”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386381", "t": 3, "q": "机械制造工艺规程中，确定加工顺序时应遵循\"先加工孔，后加工平面\"的原则。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机械制造工艺规程确定加工顺序时，一般遵循“先加工平面，后加工孔”原则，因为平面加工后能为孔加工提供稳定可靠的定位基准。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386382", "t": 3, "q": "机械制造工艺规程中，生产纲领是决定生产类型（单件、批量、大量）的主要依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "生产纲领能反映产品的生产数量规模，它是确定生产类型（单件、批量、大量）的关键因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386383", "t": 3, "q": "机械制造工艺中，粗基准只能使用一次，不能重复使用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "粗基准精度低、表面粗糙，重复使用会产生较大定位误差，所以通常只能使用一次。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386384", "t": 3, "q": "机械制造工艺中，工序集中适合大批量生产，工序分散适合单件小批量生产。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "工序集中适合单件小批量生产，工序分散适合大批量生产。", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386385", "t": 3, "q": "机械制造工艺中，夹具的定位误差是由定位基准与设计基准不重合引起的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386386", "t": 3, "q": "机械制造工艺中，特种加工方法可以加工硬度很高的材料（如淬火钢、硬质合金）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "特种加工是利用电能、热能、光能、电化学能、化学能、声能等能量以实现材料去除的加工方法，不受材料硬度限制，能加工硬度很高的材料。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386387", "t": 3, "q": "机械制造工艺中，自为基准原则是指以加工表面本身作为定位基准。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "自为基准原则的确是以加工表面本身作为定位基准，目的是保证加工表面的余量均匀。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386388", "t": 3, "q": "机械制造质量分析中，控制图上的点超出控制限，说明工序一定产生了不合格品。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "控制图上点超出控制限，表明工序可能出现异常，但不意味着一定产生了不合格品，可能有异常但产品仍在合格范围内。", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386389", "t": 3, "q": "机械制造质量分析中，偶然误差可以通过改进工艺来消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "偶然误差是由多种难以控制的偶然因素引起的，具有随机性，无法通过改进工艺来消除。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386390", "t": 3, "q": "机械制造质量分析中，因果图主要用于分析质量特性值的分布规律。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "因果图是用于分析质量问题产生原因的工具，而分析质量特性值分布规律用的是直方图等工具。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386391", "t": 3, "q": "机械制造质量分析中，直方图的形状若为\"双峰型\"，通常是由于将两种不同加工精度的零件混在一起测量导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“双峰型”直方图一般就是因两种不同加工精度、不同加工条件等的零件混在一起测量造成的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386392", "t": 3, "q": "机械制造质量控制中，抽样检验的样本量越大，检验结果的准确性越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在抽样检验里，样本量越大越能反映总体特征，检验结果就越准确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386393", "t": 3, "q": "机械制造质量控制中，过程能力指数Cp>1.33表示工序能力充分，产品不合格率极低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械制造质量控制里，当过程能力指数Cp>1.33时，意味着工序能力充足，此时产品不合格率确实极低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386394", "t": 3, "q": "机械制造质量控制中，控制图的控制限是根据零件的公差范围确定的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "控制图控制限是根据样本数据的统计特性（如均值、标准差等）计算得出，并非依据零件公差范围。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386395", "t": 3, "q": "机械制造质量控制中，统计过程控制（SPC）的目的是消除所有质量波动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "质量波动无法消除，统计过程控制（SPC）是用于监控和控制过程，减少异常波动，但不能消除所有质量波动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386396", "t": 3, "q": "机械制造质量控制中，直方图的横坐标表示质量特性值，纵坐标表示频数（或频率）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械制造质量控制里，直方图横坐标正是用来表示质量特性值，纵坐标表示频数或频率，此描述符合直方图定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386397", "t": 3, "q": "铰制孔用螺栓连接主要依靠螺栓杆与孔的配合来传递横向载荷。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "铰制孔用螺栓连接中，螺栓杆与孔采用基孔制过渡配合，工作时依靠螺栓杆受剪切和挤压来传递横向载荷，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386398", "t": 3, "q": "金属切削刀具的后角增大，会使刀具的耐用度提高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "后角增大，刀刃锋利，但切削刃强度降低、散热变差，不利于提高刀具耐用度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386399", "t": 3, "q": "金属切削刀具的前角增大，会使切削变形减小，切削力增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属切削刀具前角增大，切削变形会减小，同时切削力也会减小，而不是增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386400", "t": 3, "q": "金属切削过程中，主切削力Fc是消耗功率最大的切削力分量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "主切削力Fc方向与切削速度方向一致，在切削功率计算中起主要作用，是消耗功率最大的切削力分量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386401", "t": 3, "q": "金属切削中，背吃刀量ap是指工件上已加工表面与待加工表面之间的垂直距离。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在金属切削里，背吃刀量ap的确是工件上已加工表面与待加工表面间的垂直距离。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386402", "t": 3, "q": "金属切削中，刀具的耐用度是指刀具从开始使用到完全损坏的总时间。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "刀具耐用度是指刀具从开始切削至达到磨钝标准所经过的实际切削时间，而非到完全损坏的总时间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386403", "t": 3, "q": "金属切削中，进给量f是指刀具在进给方向上相对于工件的每转移动量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在金属切削里，进给量f的定义就是刀具在进给方向上相对于工件每转的移动量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386404", "t": 3, "q": "金属切削中，切削脆性材料时的切削力比切削塑性材料时的切削力大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "切削塑性材料时，切屑变形大，消耗能量多，切削力大；而切削脆性材料时切屑变形小，切削力相对小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386405", "t": 3, "q": "金属切削中，切削脆性材料时更容易产生积屑瘤。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "积屑瘤是在切削塑性材料时，切屑与前刀面剧烈摩擦、粘结形成的。而脆性材料切削时，切屑呈崩碎状，不易形成积屑瘤。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386406", "t": 3, "q": "金属切削中，切削速度vc是指刀具主切削刃上某点相对于工件待加工表面的线速度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是切削速度的标准定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386407", "t": 3, "q": "金属切削中，切削液的润滑作用主要是通过减小刀具与切屑、工件之间的摩擦来实现的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "切削液在金属切削时，能在刀具与切屑、工件接触界面形成润滑膜，有效减小它们之间的摩擦，体现润滑作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386408", "t": 3, "q": "开环控制系统由于没有反馈环节，因此其控制精度高于闭环控制系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开环控制系统无反馈环节，不能对输出偏差进行修正，控制精度通常低于有反馈环节可实时修正偏差的闭环控制系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386409", "t": 3, "q": "链传动的平均传动比是恒定的，但瞬时传动比是变化的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "链传动是通过链条与链轮的啮合来传递运动和动力，链条节距固定，链轮齿数一定，所以平均传动比恒定；但由于链条绕在链轮上呈多边形，链条速度周期性变化，导致瞬时传动比变化。", "ap": [false, false, false, false, false, false]}, {"id": "2034810577171386410", "t": 3, "q": "链传动的中心距过大，会导致链条垂度过大，容易产生跳齿。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "链传动中心距过大，链条垂度过大，会使链条松边抖动加剧，易造成跳齿和脱链。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 机械设计制造及其自动化（2）", "n": "基础练习题【含解析】 / 第2章 机械设计制造及其自动化（2）", "qs": [{"id": "2034810583039217664", "t": 1, "q": "三相异步电动机采用星-三角（Y-Δ）降压启动时，启动电压和启动电流分别是直接启动时的多少倍？", "a": ["1/√3，1/3", "1/3，1/√3", "1/√3，1/√3", "1/3，1/3", "", ""], "r": "A", "e": "三相异步电动机采用星-三角（Y-Δ）降压启动时，电压和电流的变化与电路的连接方式密切相关。在星形连接时，每相绕组承受的电压是线电压的1/√3倍。因此，启动电压是直接启动时的1/√3倍。启动电流与电压的平方成正比。由于电压降低了1/√3倍，电流则降低(1/√3)² = 1/3倍。综上所述，启动电压是直接启动时的1/√3倍，启动电流是直接启动时的1/3倍。所以，正确答案是A选项：“1/√3，1/3”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217665", "t": 1, "q": "三相异步电动机的定子电压降低，会对电机的电磁转矩产生怎样的影响？", "a": ["电磁转矩减小", "电磁转矩增大", "电磁转矩不变", "电磁转矩先增大后减小", "", ""], "r": "A", "e": "三相异步电动机电磁转矩与定子电压的平方成正比，定子电压降低，电磁转矩减小。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217666", "t": 1, "q": "三相异步电动机的定子绕组采用双层叠绕组时，其主要优点是？", "a": ["绕组结构简单", "线圈制造方便", "绕组利用率高，电机性能好", "电机过载能力强", "", ""], "r": "C", "e": "双层叠绕组能更好地利用定子槽空间，使绕组分布更合理，提高绕组利用率，改善电机性能。而A选项双层叠绕组结构不简单；B选项不是其主要优点；D选项与绕组形式关系不大。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217667", "t": 1, "q": "三相异步电动机的额定功率是指？", "a": ["定子绕组的损耗功率", "转子绕组的损耗功率", "输入的电功率", "输出的机械功率", "", ""], "r": "D", "e": "三相异步电动机的额定功率特指其在额定运行状态下，转轴上向外输出的机械功率。<br />功率流向拆解<br />输入的电功率（选项 C）：由电源提供，是能量源头。<br />内部损耗：包含定子绕组损耗（选项 A）、转子绕组损耗（选项 B）及铁耗、机械损耗等。<br />输出的机械功率（选项 D）：输入功率扣除全部内部损耗后的净值，即额定功率的物理定义。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217668", "t": 1, "q": "三相异步电动机的效率η在什么负载下达到最大值？", "a": ["过载负载", "轻载负载", "空载负载", "额定负载", "", ""], "r": "D", "e": "三相异步电动机在额定负载下，其铜损耗和铁损耗等综合情况使得效率达到最大值。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217669", "t": 1, "q": "三相异步电动机的转差率s在启动瞬间和额定运行时的取值分别为？", "a": ["s=1，s=0", "s=0.01-0.05，s=1", "s=0，s=1", "s=1，s=0.01-0.05", "", ""], "r": "D", "e": "三相异步电动机的转差率s定义为旋转磁场的同步转速与电动机实际转速之差与同步转速的比值。在电动机启动瞬间，由于转子从静止状态开始转动，其转速远低于同步转速，因此转差率接近于1。而在电动机额定运行时，转子转速接近同步转速，转差率较小，通常在0.01到0.05之间。A选项表示启动瞬间s=1，这是正确的，但额定运行时s=0是不正确的，因为额定运行时转差率不为0。B选项表示启动瞬间s=0.01-0.05，这是不正确的，因为启动瞬间转差率接近1。C选项表示启动瞬间s=0，这是不正确的，因为启动瞬间转差率接近1。D选项表示启动瞬间s=1，额定运行时s=0.01-0.05，这是正确的。所以，正确答案是D选项：“s=1，s=0.01-0.05”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217670", "t": 1, "q": "三相异步电动机的转子电阻增大，会对电机的启动转矩产生怎样的影响？", "a": ["启动转矩减小", "启动转矩不变", "启动转矩先增大后减小", "启动转矩增大", "", ""], "r": "C", "e": "三相异步电机，转子电阻增大时启动转矩先增大；当转子电阻等于转子电抗时启动转矩达到最大值；继续增大转子电阻，启动转矩反而减小。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217671", "t": 1, "q": "三相异步电动机的转子绕组为笼型时，其转子导体的材料通常采用哪种？", "a": ["铝", "银", "铜", "铁", "", ""], "r": "A", "e": "笼型转子导体材料常用铝或铜，铝成本低、铸造方便，应用更广泛。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217672", "t": 1, "q": "三相异步电动机在额定电压下启动时，启动电流通常是额定电流的多少倍？", "a": ["8-10倍", "1-2倍", "10-15倍", "4-7倍", "", ""], "r": "D", "e": "三相异步电动机额定电压直接启动，启动电流（堵转电流）一般为额定电流的 4～7 倍。启动电流大，是因为启动瞬间转子转速为 0，转子感应电动势大，转子电流大。因此选 D。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217673", "t": 1, "q": "在齿轮传动设计中，当齿轮承受交变载荷时，齿根处最易发生的失效形式是？", "a": ["齿面磨损", "齿根弯曲疲劳折断", "齿面胶合", "齿面接触疲劳点蚀", "", ""], "r": "B", "e": "齿轮承受交变载荷时，齿根受交变应力，易发生弯曲疲劳折断。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217674", "t": 1, "q": "在齿轮传动设计中，若齿轮的工作环境有粉尘、杂质，应选择哪种传动布置形式？", "a": ["任意形式均可", "开式传动", "闭式传动", "半开式传动", "", ""], "r": "C", "e": "有粉尘、杂质的工作环境，为防止粉尘等进入损坏齿轮，需采用能较好密封的传动形式。闭式传动有封闭的箱体，可有效防尘。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217675", "t": 1, "q": "在齿轮传动设计中，若要提高齿轮的抗胶合能力，下列哪种措施最为有效？", "a": ["增大模数", "提高齿面硬度", "采用粘度较高的润滑油", "减小齿宽", "", ""], "r": "C", "e": "在齿轮传动设计中，提高齿轮的抗胶合能力主要涉及到减少齿面间的摩擦和防止局部高温导致的胶合现象。A选项“增大模数”主要影响齿轮的尺寸和承载能力，并不直接影响抗胶合能力。B选项“提高齿面硬度”可以增强齿面的耐磨性，但对抗胶合能力的提升有限。C选项“采用粘度较高的润滑油”能够在齿面间形成更厚的油膜，有效减少直接接触和摩擦，从而显著降低胶合的风险。D选项“减小齿宽”实际上可能减少接触面积，但不利于提高抗胶合能力，反而可能增加单位面积的载荷。综上所述，采用粘度较高的润滑油是最为有效的方法来提高齿轮的抗胶合能力。所以，正确答案是C：“采用粘度较高的润滑油”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217676", "t": 1, "q": "在齿轮传动中，当采用变位齿轮时，其主要目的是？", "a": ["改变齿轮的压力角", "改变齿轮的模数", "改变传动比", "提高齿轮的承载能力或避免根切", "", ""], "r": "D", "e": "变位齿轮可通过改变刀具与轮坯相对位置，避免根切，同时能提高齿轮承载能力。压力角、模数、传动比通常不随变位而改变。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217677", "t": 1, "q": "在齿轮传动中，当齿轮的模数m增大时，齿轮的哪种性能会显著提高？", "a": ["传动比精度", "传动平稳性", "承载能力", "抗胶合能力", "", ""], "r": "C", "e": "模数m增大，齿轮的尺寸和强度增大，承载能力显著提高。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217678", "t": 1, "q": "在齿轮传动中，当两齿轮的中心距略有偏差时，哪种齿轮传动仍能正常工作？", "a": ["蜗杆传动", "直齿圆锥齿轮传动", "斜齿圆柱齿轮传动", "直齿圆柱齿轮传动", "", ""], "r": "C", "e": "齿轮传动的类型多种多样，不同类型的齿轮传动对中心距偏差的容忍度也不同。以下是对各类型齿轮传动特点的简要分析：### A. 蜗杆传动 特点：主要用于传递两交错轴之间的运动和动力。 中心距偏差影响：对中心距偏差较为敏感，偏差会导致传动不平稳甚至损坏。### B. 直齿圆锥齿轮传动 特点：用于传递两相交轴之间的运动和动力。 中心距偏差影响：对中心距偏差较为敏感，偏差会导致齿面接触不良，产生噪音和振动。### C. 斜齿圆柱齿轮传动 特点：齿线为螺旋状，啮合时齿面接触线是逐渐变化的。 中心距偏差影响：由于齿线是斜的，具有一定的自适应性，能够容忍一定的中心距偏差，传动平稳。### D. 直齿圆柱齿轮传动 特点：齿线为直线，啮合时齿面接触线是突然变化的。 中心距偏差影响：对中心距偏差非常敏感，偏差会导致严重的冲击和噪音。### 结论在上述齿轮传动类型中，斜齿圆柱齿轮传动（C选项）由于齿线是斜的，能够在一定程度上自适应中心距的偏差，因此仍能正常工作。所以，正确答案是C选项：“斜齿圆柱齿轮传动”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217679", "t": 1, "q": "在带传动设计中，若带的型号和基准长度不变，增大包角α1，会对带传动的承载能力产生怎样的影响？", "a": ["承载能力先增大后减小", "承载能力增大", "承载能力减小", "承载能力不变", "", ""], "r": "B", "e": "包角越大，带与带轮间的摩擦力就越大，带传动的承载能力也就越大。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217680", "t": 1, "q": "在带传动中，若带的材质和截面尺寸不变，带的长度增加，会对带的疲劳寿命产生怎样的影响？", "a": ["疲劳寿命缩短", "疲劳寿命不变", "疲劳寿命先延长后缩短", "疲劳寿命延长", "", ""], "r": "A", "e": "在带传动系统中，带的疲劳寿命受多种因素影响，其中带的长度是一个关键参数。当带的材质和截面尺寸保持不变时，带的长度增加通常意味着带在传动过程中需要经历更多的弯曲和拉伸循环。这些额外的循环会导致带材料内部的应力累积，从而加速疲劳损伤的过程。因此，从理论上讲，带长度的增加会导致其疲劳寿命缩短，因为带在更长的运行周期内会受到更多次的应力循环。然而，实际情况可能更为复杂，因为带的疲劳寿命还受到其他因素的影响，如带轮的设计、带的张紧程度、运行环境等。但在题目给定的条件下，即材质、截面尺寸不变，仅长度增加的情况下，可以合理推断出带的疲劳寿命会缩短。综上所述，带的长度增加在给定条件下会导致其疲劳寿命缩短。所以，正确答案是A选项：“疲劳寿命缩短”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217681", "t": 1, "q": "在带传动中，若主动轮转速n1=1450r/min，主动轮直径d1=100mm，从动轮直径d2=200mm，忽略弹性滑动，从动轮转速n2应为多少？", "a": ["2900r/min", "1450r/min", "725r/min", "5800r/min", "", ""], "r": "C", "e": "带传动中，忽略弹性滑动时，主动轮与从动轮线速度相等，线速度「test/yiwen_img/importSubject/2034810578383540224.png」（d为直径，n为转速），即「test/yiwen_img/importSubject/2034810578547118080.png」，可得「test/yiwen_img/importSubject/2034810578593255424.png」，代入数据「test/yiwen_img/importSubject/2034810578685530112.png」。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217682", "t": 1, "q": "在电机与传动系统选择中，若负载要求频繁启动、制动且对过载能力要求较高，下列哪种电机更适用？", "a": ["三相异步电动机", "直流他励电动机", "单相异步电动机", "同步电动机", "", ""], "r": "B", "e": "直流他励电动机启动、制动性能好，过载能力强，适合频繁启动、制动且对过载能力要求高的负载。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217683", "t": 1, "q": "在机械设计制造的自动控制原理中，下列哪种控制系统的输出量对系统的控制作用没有影响？", "a": ["闭环控制系统", "随动控制系统", "开环控制系统", "反馈控制系统", "", ""], "r": "C", "e": "开环控制系统是指输出量对系统控制作用无影响的系统，而闭环、反馈控制系统输出量会反馈影响控制，随动控制系统一般也是闭环的。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217684", "t": 1, "q": "在机械制造工艺规程设计中，划分工序的主要依据是？", "a": ["工作地是否变化和加工是否连续", "加工精度是否变化", "加工工具是否变化", "加工表面是否变化", "", ""], "r": "A", "e": "工序是指一个（或一组）工人，在一个工作地对一个（或同时对几个）工件所连续完成的那一部分工艺过程。划分工序主要依据工作地是否变化和加工是否连续。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217685", "t": 1, "q": "在链传动中，导致链条发生\"跳齿\"或\"脱链\"的主要原因是？", "a": ["链条垂度过大", "链条磨损", "链轮齿数过少", "中心距过大或过小", "", ""], "r": "B", "e": "原因简述：<br />链条磨损后，销轴与套筒之间的间隙增大，链条的节距变长。当链条节距变大后，链条在链轮上会逐渐向齿顶方向“爬升”，最终容易从轮齿上滑脱，从而产生跳齿或脱链现象。<br />其他选项的影响：<br />A. 链条垂度过大：会使链条振动、啮合不良，但不是跳齿、脱链的最主要原因。<br />C. 链轮齿数过少：会使链传动不平稳、动载荷增大，但通常不是跳齿、脱链的主要原因。<br />D. 中心距过大或过小：会影响链条张紧和包角，但也不是最主要原因。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217686", "t": 1, "q": "在链传动中，链条的节距p增大，会对链传动的哪种性能产生不利影响？", "a": ["传动效率", "使用寿命", "承载能力", "传动平稳性", "", ""], "r": "D", "e": "节距p增大，链条各零件尺寸增大，质量增加，冲击振动加剧，使传动平稳性变差。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217687", "t": 1, "q": "在链传动中，若主动轮齿数z1=20，从动轮齿数z2=80，主动轮转速n1=1000r/min，忽略动载系数，从动轮转速n2应为多少？", "a": ["1000r/min", "500r/min", "250r/min", "4000r/min", "", ""], "r": "C", "e": "链传动中，主动轮与从动轮转速关系为「test/yiwen_img/importSubject/2034810578761027584.png」，已知「test/yiwen_img/importSubject/2034810578807164928.png」，「test/yiwen_img/importSubject/2034810578844913664.png」，「test/yiwen_img/importSubject/2034810578895245312.png」，则「test/yiwen_img/importSubject/2034810578962354176.png」。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217688", "t": 1, "q": "在蜗杆传动中，若蜗杆的导程角γ减小，会对蜗杆传动的效率产生怎样的影响？", "a": ["效率提高", "效率降低", "效率先提高后降低", "效率不变", "", ""], "r": "B", "e": "蜗杆传动效率与导程角有关，导程角γ减小，效率会降低。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217689", "t": 1, "q": "在蜗杆传动中，若蜗杆头数z1=2，蜗轮齿数z2=40，该传动的传动比i应为多少？", "a": ["20", "10", "40", "5", "", ""], "r": "A", "e": "蜗杆传动比「test/yiwen_img/importSubject/2034810579012685824.png」，已知「test/yiwen_img/importSubject/2034810579088183296.png」，「test/yiwen_img/importSubject/2034810579134320640.png」，则「test/yiwen_img/importSubject/2034810579184652288.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217690", "t": 1, "q": "在蜗杆传动中，若蜗轮的转向由蜗杆的转向和旋向决定，采用右手定则判断时，适用于哪种旋向的蜗杆？", "a": ["任意旋向蜗杆", "无法判断", "左旋蜗杆", "右旋蜗杆", "", ""], "r": "D", "e": "右手定则适用于右旋蜗杆判断蜗轮转向。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217691", "t": 1, "q": "在蜗杆传动中，蜗杆的头数z1越多，会对蜗杆传动的哪种性能产生有利影响？", "a": ["传动比精度", "传动效率", "自锁性能", "承载能力", "", ""], "r": "B", "e": "蜗杆头数z1越多，导程角越大，效率越高。传动比精度与头数关系不大；头数多自锁性能变差；承载能力主要和材料、尺寸等有关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217692", "t": 1, "q": "在选择机械连接方式时，若被连接件需要频繁拆卸且定心精度要求较高，下列哪种连接方式最适合？", "a": ["铆钉连接", "铰制孔用螺栓连接", "螺钉连接", "普通螺栓连接", "", ""], "r": "B", "e": "铆钉连接不可拆卸；螺钉连接拆卸后再安装易损坏螺纹，不适合频繁拆卸；普通螺栓连接定心精度不高；铰制孔用螺栓连接既能频繁拆卸，又有较高定心精度。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217693", "t": 1, "q": "在圆柱齿轮传动的齿面接触疲劳强度计算中，其计算依据主要是基于哪种力学理论？", "a": ["赫兹接触应力理论", "剪切应力理论", "弯曲正应力理论", "挤压应力理论", "", ""], "r": "A", "e": "圆柱齿轮传动齿面接触疲劳强度计算依据是赫兹接触应力理论。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217694", "t": 1, "q": "在圆锥齿轮传动中，其传动比i的计算依据是？", "a": ["齿轮的模数之比", "齿轮的齿顶圆直径之比", "齿轮的分度圆直径之比", "齿轮的齿数之比", "", ""], "r": "D", "e": "圆锥齿轮传动比计算和圆柱齿轮类似，主要依据是两齿轮的齿数之比。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217695", "t": 1, "q": "在圆锥齿轮传动中，为了保证两齿轮正确啮合，必须满足的条件是？", "a": ["模数相等，压力角相等，锥距相等，分度圆锥角之和等于90度（正交传动）", "模数相等，压力角相等", "模数相等，压力角相等，分度圆锥角之和等于90度（正交传动）", "模数相等，压力角相等，锥距相等", "", ""], "r": "A", "e": "答案：A在圆锥齿轮传动中，为了保证两齿轮正确啮合，必须满足的条件包括模数相等、压力角相等、锥距相等以及分度圆锥角之和等于90度（正交传动）。选项A包含了所有这些条件，因此是正确答案。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217696", "t": 1, "q": "直流电动机采用电枢串电阻调速时，若负载转矩不变，电枢电流Ia会如何变化？", "a": ["Ia先增大后减小", "Ia减小", "Ia增大", "Ia不变", "", ""], "r": "D", "e": "直流电动机负载转矩不变时，电磁转矩也不变。电磁转矩「test/yiwen_img/importSubject/2034810579264344064.png」，「test/yiwen_img/importSubject/2034810579461476352.png」是电机结构常数，「test/yiwen_img/importSubject/2034810579507613696.png」不变，所以「test/yiwen_img/importSubject/2034810579545362432.png」不变。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217697", "t": 1, "q": "直流电动机的电磁转矩Tem与电枢电流Ia、励磁磁通Φ的关系是？", "a": ["Tem=CTΦ/Ia", "Tem=CTΦIa", "Tem=CeΦ/Ia", "Tem=CeΦIa", "", ""], "r": "B", "e": "直流电动机电磁转矩公式为「test/yiwen_img/importSubject/2034810579604082688.png」，「test/yiwen_img/importSubject/2034810579461476352.png」是转矩常数。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217698", "t": 1, "q": "直流电动机的电枢反应会导致电机的气隙磁场发生怎样的变化？", "a": ["磁场减弱且畸变", "磁场先增强后减弱", "磁场增强", "磁场不变", "", ""], "r": "A", "e": "直流电动机电枢反应会使气隙磁场发生畸变，同时由于电枢磁动势对主极磁场的去磁作用，会使合成磁场减弱。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217699", "t": 1, "q": "直流电动机的调速方法中，哪种方法调速范围最宽且调速平滑性最好？", "a": ["弱磁调速", "降压调速", "电枢串电阻调速", "变频调速", "", ""], "r": "B", "e": "降压调速可在额定转速以下实现较宽调速范围且调速平滑；弱磁调速一般在额定转速以上调速范围有限；电枢串电阻调速平滑性差；直流电动机无变频调速。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217700", "t": 1, "q": "直流电动机在额定负载下运行时，若减小电枢回路的电阻，电机的转速会如何变化？", "a": ["转速升高", "转速不变", "转速先升高后降低", "转速降低", "", ""], "r": "A", "e": "直流电动机转速公式「test/yiwen_img/importSubject/2034810579646025728.png」，减小电枢回路电阻R，其他条件不变时，分子增大，转速n升高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217701", "t": 1, "q": "直流他励电动机采用弱磁调速时，其调速方向是？", "a": ["可在额定转速上下调速", "只能在额定转速以下调速", "只能在额定转速以上调速", "不能调速", "", ""], "r": "C", "e": "直流他励电动机弱磁调速时，磁通减小，转速升高，所以只能在额定转速以上调速。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217702", "t": 1, "q": "自动控制原理中，二阶系统的阶跃响应超调量σ%与阻尼比ζ的关系是？", "a": ["ζ与σ%无关", "ζ增大，σ%减小", "ζ增大，σ%先增大后减小", "ζ增大，σ%增大", "", ""], "r": "B", "e": "二阶系统阶跃响应超调量公式为「test/yiwen_img/importSubject/2034810579704745984.png」，从公式可知阻尼比「test/yiwen_img/importSubject/2034810579755077632.png」增大时，超调量「test/yiwen_img/importSubject/2034810579801214976.png」减小。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217703", "t": 1, "q": "自动控制原理中，二阶系统的阻尼比ζ处于下列哪些范围时，系统为欠阻尼系统？", "a": ["0<ζ<1", "ζ<0", "ζ>1", "ζ=1", "", ""], "r": "A", "e": "在自动控制原理中，二阶系统的动态特性由阻尼比 ζ 决定。各选项对应的系统状态如下：<br />A. 0 < ζ < 1：欠阻尼系统。系统响应为衰减振荡，是工程中最常见的状态。<br />B. ζ < 0：负阻尼系统。系统响应发散，不稳定。<br />C. ζ > 1：过阻尼系统。系统响应无振荡，缓慢趋于稳态值。<br />D. ζ = 1：临界阻尼系统。系统响应无振荡，以最快速度趋于稳态值且不超调。<br />因此，欠阻尼系统对应的阻尼比范围是 0 < ζ < 1，正确答案为 A。", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217704", "t": 1, "q": "自动控制原理中，若系统的开环传递函数为G（　）=K/(s(Ts+1))，该系统的型别为？", "a": ["Ⅱ型系统", "0型系统", "Ⅰ型系统", "Ⅲ型系统", "", ""], "r": "C", "e": "系统型别由开环传递函数中积分环节个数决定，此开环传递函数分母中有一个s，即有1个积分环节，所以是Ⅰ型系统，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217705", "t": 1, "q": "自动控制原理中，系统的开环增益K增大，会对系统的稳态误差和稳定性产生怎样的影响？", "a": ["稳态误差增大，稳定性提高", "稳态误差增大，稳定性降低", "稳态误差减小，稳定性降低", "稳态误差减小，稳定性提高", "", ""], "r": "C", "e": "开环增益K增大，根据稳态误差计算，稳态误差会减小；但K增大使系统特征方程根的分布改变，系统更易不稳定，即稳定性降低。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217706", "t": 1, "q": "自动控制原理中，系统的时域性能指标中，调整时间ts反映了系统的？", "a": ["抗干扰能力", "准确性", "稳定性", "快速性", "", ""], "r": "D", "e": "调整时间ts是指系统响应达到并保持在允许误差带内所需的最短时间，它衡量的是系统输出接近稳态值的快慢，反映了系统的快速性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217707", "t": 1, "q": "自动控制原理中，系统的稳态误差反映了系统的哪种性能？", "a": ["抗干扰能力", "稳定性", "准确性", "动态响应速度", "", ""], "r": "C", "e": "稳态误差是指系统进入稳态后，输出量的期望值与实际值之间的误差，它体现了系统控制的精确程度，也就是准确性。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217708", "t": 1, "q": "自动控制原理中，系统的阻尼比ζ减小，会使系统的阶跃响应产生怎样的变化？", "a": ["超调量增大，响应速度加快", "超调量增大，响应速度减慢", "超调量减小，响应速度减慢", "超调量减小，响应速度加快", "", ""], "r": "A", "e": "阻尼比ζ减小，系统振荡加剧，超调量增大；同时系统响应更快，响应速度加快。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217709", "t": 1, "q": "自动控制原理中，下列哪种系统属于线性系统？", "a": ["输出与输入的关系满足叠加原理的系统", "参数随时间变化的系统", "含有非线性元件的系统", "输出与输入的关系不满足叠加原理的系统", "", ""], "r": "A", "e": "线性系统的定义是输出与输入的关系满足叠加原理，B选项参数随时间变化是时变系统特征，C选项含非线性元件不是线性系统，D选项不满足叠加原理也不是线性系统。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217710", "t": 1, "q": "自动控制原理中，下列哪种校正方式可以同时提高系统的稳定性和响应速度？", "a": ["比例校正（P）", "积分校正（I）", "比例-微分校正（PD）", "微分校正（D）", "", ""], "r": "C", "e": "比例 - 微分校正（PD）中，比例环节可提高系统响应速度，微分环节能预测误差变化趋势，提前给出控制作用，减小超调，提高稳定性。比例校正（P）主要提高响应速度但可能降低稳定性；积分校正（I）改善稳态精度但会降低稳定性；微分校正（D）单独使用难以实际应用。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217711", "t": 1, "q": "自动控制原理中，下列哪种校正方式可以消除系统的稳态误差？", "a": ["比例-微分校正（PD）", "微分校正（D）", "比例校正（P）", "积分校正（I）", "", ""], "r": "D", "e": "积分环节能对误差进行积分，随着时间积累可消除稳态误差，而比例、微分环节无此作用。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217712", "t": 1, "q": "PLC的工作过程中，哪个阶段是将输入模块的信号状态读入到内部输入映像区？", "a": ["系统自诊断阶段", "输出刷新阶段", "输入采样阶段", "程序执行阶段", "", ""], "r": "C", "e": "输入采样阶段就是把输入模块信号状态读入内部输入映像区。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217713", "t": 1, "q": "PLC控制系统中，下列哪种模块用于将现场传感器的模拟量信号转换为PLC可处理的数字量信号？", "a": ["模拟量输入模块", "模拟量输出模块", "数字量输入模块", "数字量输出模块", "", ""], "r": "A", "e": "要把现场传感器模拟量信号转成PLC能处理的数字量信号，需模拟量输入模块。模拟量输出模块是将数字量转模拟量；数字量输入输出模块处理数字信号。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810583039217714", "t": 1, "q": "PLC中，下列哪种指令用于实现程序的条件跳转，当条件满足时跳转到指定标号处执行？", "a": ["JUMP指令", "CALL指令", "STORE指令", "LOAD指令", "", ""], "r": "A", "e": "JUMP指令用于程序条件跳转，满足条件就跳至指定标号处执行；CALL是调用指令；STORE是存储指令；LOAD是装载指令。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294336", "t": 2, "q": "金属切削中，下列哪些切削方法主要用于加工平面？", "a": ["磨削（平面磨削）", "铣削（端铣、周铣）", "刨削", "车削（端面车削）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294337", "t": 2, "q": "金属切削中，下列哪些属于成形法加工齿轮的方法？", "a": ["插齿", "拉齿", "滚齿", "铣齿（用盘形齿轮铣刀）", "", ""], "r": "BD", "e": "成形法依靠刀具切削刃形状直接复刻齿轮齿形，铣齿、拉齿属于成形法；滚齿、插齿属于展成法（范成法）加工齿轮。", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294338", "t": 2, "q": "金属切削中，下列哪些属于切削液的类型？", "a": ["固体润滑剂（如石墨）", "乳化液（冷却+润滑）", "水溶液（主要冷却）", "切削油（主要润滑）", "", ""], "r": "BCD", "e": "切削液类型有乳化液兼具冷却和润滑作用，水溶液主要起冷却作用，切削油主要起润滑作用；固体润滑剂如石墨虽有润滑性但不是常见切削液类型。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294339", "t": 2, "q": "金属切削中，下列哪些因素会导致切削力增大？", "a": ["增大进给量f", "加工材料的硬度提高", "增大背吃刀量ap", "减小刀具前角γ0", "", ""], "r": "ABCD", "e": "进给量、背吃刀量增大，材料硬度提高，刀具前角减小都会使切削力增大。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294340", "t": 2, "q": "金属切削中，影响刀具耐用度的主要因素有哪些？", "a": ["刀具材料的耐热性", "进给量f", "切削速度vc", "背吃刀量ap", "", ""], "r": "ABCD", "e": "答案：ABCD在金属切削过程中，刀具的耐用度受多个因素影响。刀具材料的耐热性（A选项）决定了刀具在高温切削环境下能否保持其硬度和性能。进给量f（B选项）、切削速度vc（C选项）和背吃刀量ap（D选项）都是切削用量的参数，它们直接影响切削力、切削热和刀具的磨损速率，从而决定刀具的耐用度。因此，这四个因素都是影响刀具耐用度的主要因素。", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294341", "t": 2, "q": "三相同步电动机的主要特点有哪些？", "a": ["功率因数可调（可容性运行）", "结构复杂，成本高", "转速恒定（等于同步转速）", "启动转矩小", "", ""], "r": "AC", "e": "三相同步电动机的主要特点主要包括：A. 功率因数可调（可容性运行）：这是同步电动机的一个显著特点，通过调节励磁电流，可以实现功率因数的调整，甚至可以在容性负载下运行。C. 转速恒定（等于同步转速）：同步电动机的转速严格等于电源频率与磁极对数的乘积，即同步转速，这是“同步”二字的由来。B选项“结构复杂，成本高”虽然是同步电动机的一个特点，但并非其主要特点，且题目要求的是主要特点。D选项“启动转矩小”并不准确，因为同步电动机的启动转矩并不小，尤其是在采用适当的启动方法后。综上所述，正确答案是AC。所以，答案为AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294342", "t": 2, "q": "三相异步电动机的定子绕组连接方式主要有哪些？", "a": ["菱形连接", "三角形（Δ）连接", "星形-三角形（Y-Δ）连接", "星形（Y）连接", "", ""], "r": "BD", "e": "三相异步电动机定子绕组常见连接方式是三角形（Δ）连接和星形（Y）连接，菱形连接不是其主要连接方式，星形 - 三角形（Y - Δ）连接是启动方式。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294343", "t": 2, "q": "三相异步电动机的额定转速nN与同步转速n0的关系是？", "a": ["nN < n0", "转差率s = (n0 - nN) / n0", "转速差Δn = n0 - nN", "nN = n0", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294344", "t": 2, "q": "三相异步电动机的启动方式中，属于降压启动的有哪些？", "a": ["自耦变压器降压启动", "直接启动", "星-三角（Y-Δ）启动", "转子串电阻启动", "", ""], "r": "AC", "e": "直接启动是全压启动；转子串电阻启动是绕线式异步电动机的启动方法，不是降压启动；自耦变压器降压启动和星 - 三角（Y - Δ）启动都是降压启动方式。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294345", "t": 2, "q": "三相异步电动机的启动转矩与哪些因素有关？", "a": ["转子电阻", "定子电压的平方", "定子绕组的匝数", "电源频率", "", ""], "r": "AB", "e": "三相异步电动机启动转矩与定子电压平方成正比，与转子电阻也有关。定子绕组匝数和电源频率并非直接决定启动转矩的关键因素。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294346", "t": 2, "q": "三相异步电动机的铁损主要包括哪些部分？", "a": ["涡流损耗", "铜损", "磁滞损耗", "机械损耗", "", ""], "r": "AC", "e": "三相异步电动机铁损主要由涡流损耗和磁滞损耗组成。铜损是电流通过绕组产生的损耗；机械损耗是机械摩擦等产生的损耗，都不属于铁损。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294347", "t": 2, "q": "三相异步电动机的效率主要与哪些因素有关？", "a": ["电机的转速", "电机的功率因数", "电机的损耗（铁损、铜损）", "负载率", "", ""], "r": "BCD", "e": "答案：BCD三相异步电动机的效率主要与电机的功率因数、电机的损耗（包括铁损和铜损）以及负载率有关。电机的转速主要影响的是电动机的输出功率和转矩，并不直接影响电动机的效率。因此，选项A不正确，而选项B、C、D都是影响电动机效率的主要因素。", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294348", "t": 2, "q": "三相异步电动机的转速变化率主要与哪些因素有关？", "a": ["转子电阻", "电源电压", "电机的铁损", "电机的负载率", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294349", "t": 2, "q": "三相异步电动机的转子绕组类型主要有哪些？", "a": ["永磁转子绕组", "笼型转子绕组", "绕线式转子绕组", "励磁转子绕组", "", ""], "r": "BC", "e": "三相异步电动机转子绕组主要有笼型和绕线式两种。永磁转子一般用于永磁电机，励磁转子用于直流电机等。所以答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294350", "t": 2, "q": "三相异步电动机的转子铜损主要与哪些因素有关？", "a": ["电机的负载率", "转子绕组的电阻", "电机的转速", "转子电流的平方", "", ""], "r": "ABD", "e": "转子铜损公式为「test/yiwen_img/importSubject/2034810580304531456.png」，「test/yiwen_img/importSubject/2034810580380028928.png」是转子电流，「test/yiwen_img/importSubject/2034810580421971968.png」是转子绕组电阻，负载率影响转子电流大小，所以与负载率、转子绕组电阻、转子电流平方有关。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294351", "t": 2, "q": "在齿轮传动设计中，计算齿轮强度时需要考虑的载荷系数主要有哪些？", "a": ["齿向载荷分布系数Kβ（载荷沿齿宽分布）", "使用系数KA（工作机载荷）", "齿间载荷分配系数Kα（载荷沿齿高分布）", "动载系数KV（动载荷）", "", ""], "r": "ABCD", "e": "计算齿轮强度时，使用系数KA考虑工作机载荷特性影响；动载系数KV考虑动载荷；齿间载荷分配系数Kα考虑载荷沿齿高分布；齿向载荷分布系数Kβ考虑载荷沿齿宽分布，这几个都是要考虑的载荷系数。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294352", "t": 2, "q": "在齿轮传动设计中，若齿轮承受重载，可采取的强化措施有哪些？", "a": ["采用正变位齿轮", "减小齿轮齿数", "增大齿轮模数", "提高齿面硬度（如渗碳淬火）", "", ""], "r": "ACD", "e": "正变位齿轮可提高齿面接触强度和齿根弯曲强度；增大模数能增强齿根弯曲强度；提高齿面硬度可提升齿面耐磨性和接触强度，都能应对重载。减小齿数会使重合度减小、承载能力降低。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294353", "t": 2, "q": "在齿轮传动中，齿轮的失效形式主要有哪些？", "a": ["齿面接触疲劳点蚀", "齿面胶合", "齿根弯曲疲劳折断", "齿面磨损", "", ""], "r": "ABCD", "e": "齿轮传动中，齿面受交变接触应力会产生接触疲劳点蚀，高速重载时易出现齿面胶合，齿根受交变弯曲应力会发生弯曲疲劳折断，工作中齿面间相对滑动会造成齿面磨损，这几种都是常见失效形式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294354", "t": 2, "q": "在齿轮传动中，下列哪些措施可提高齿轮的接触疲劳强度？", "a": ["提高齿面硬度（如渗氮处理）", "采用正变位齿轮", "减小齿面粗糙度", "增大齿轮的模数", "", ""], "r": "AC", "e": "答案：AC提高齿轮的接触疲劳强度主要涉及到齿面硬度和表面粗糙度的改善。提高齿面硬度（如渗氮处理）可以有效提高齿轮的抗疲劳磨损性能，因此选项A是正确的。减小齿面粗糙度可以减少应力集中，从而提高接触疲劳强度，所以选项C也是正确的。采用正变位齿轮主要是为了调整中心距或改善齿轮的弯曲疲劳强度，并不直接影响接触疲劳强度，因此选项B不是最佳选择。增大齿轮的模数主要影响齿轮的弯曲疲劳强度和重合度，对接触疲劳强度的直接影响有限，所以选项D也不是最佳选择。", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294355", "t": 2, "q": "在齿轮传动中，下列哪些属于变位齿轮的特点？", "a": ["不改变齿轮的传动比", "可避免小齿数齿轮的根切", "不改变齿轮的模数和压力角", "可提高齿轮的承载能力", "", ""], "r": "ABCD", "e": "变位齿轮只是改变齿形等参数，不改变传动比、模数和压力角，能避免小齿数齿轮根切，还可提高承载能力。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294356", "t": 2, "q": "在带传动设计中，选择带型号的主要依据有哪些？", "a": ["带传动的中心距", "传递的功率", "带的截面尺寸", "主动轮的转速", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294357", "t": 2, "q": "在带传动中，常用的张紧装置类型有哪些？", "a": ["定期张紧装置（如调节螺钉张紧）", "液压张紧装置", "自动张紧装置（如重锤式张紧）", "张紧轮张紧装置", "", ""], "r": "ACD", "e": "带传动常用张紧装置有定期张紧（如调节螺钉张紧）、自动张紧（如重锤式张紧）和张紧轮张紧等方式，液压张紧装置不是带传动常用张紧类型。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294358", "t": 2, "q": "在带传动中，带的类型主要有哪些？", "a": ["同步带", "平带", "V带", "圆带", "", ""], "r": "ABCD", "e": "带传动中常见带的类型包含同步带、平带、V带、圆带。ABCD选项均符合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294359", "t": 2, "q": "在带传动中，导致带传动失效的主要形式有哪些？", "a": ["打滑", "磨损", "胶合", "疲劳断裂", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294360", "t": 2, "q": "在带传动中，下列哪些因素会导致带的疲劳寿命缩短？", "a": ["增加带的弯曲次数（如小带轮直径过小）", "增大带的工作应力", "减小带的截面尺寸", "提高带的工作温度", "", ""], "r": "ABCD", "e": "带的弯曲次数增加、工作应力增大、截面尺寸减小、工作温度提高都会使带更容易疲劳，缩短其疲劳寿命。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294361", "t": 2, "q": "在机械传动系统设计中，下列哪些属于闭式传动的类型？", "a": ["链传动", "圆锥齿轮传动", "圆柱齿轮传动", "带传动", "", ""], "r": "BC", "e": "闭式传动是将传动封闭在箱体内，能更好地润滑和防护。链传动和带传动一般为开式，圆锥齿轮传动和圆柱齿轮传动常采用闭式传动。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294362", "t": 2, "q": "在链传动中，链条的主要失效形式有哪些？", "a": ["滚子和套筒的冲击疲劳", "链条的胶合", "链板的磨损", "链条的疲劳断裂", "", ""], "r": "ABCD", "e": "链传动中，链条工作时受循环应力，易发生疲劳断裂；链节各元件间有相对运动，会产生磨损；高速重载时还可能出现胶合；滚子和套筒受冲击会产生冲击疲劳。ABCD选项都是链条主要失效形式。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294363", "t": 2, "q": "在链传动中，下列哪些措施可提高链传动的平稳性？", "a": ["减小链条的节距", "增大链传动的中心距", "增加链轮的齿数", "采用偶数链节和奇数链轮齿数组合", "", ""], "r": "AC", "e": "减小链条节距可降低多边形效应，提高平稳性；增加链轮齿数能减小多边形效应的不利影响，提升平稳性。而增大中心距主要影响链传动的包角等，与平稳性关系不直接；采用偶数链节和奇数链轮齿数组合主要是为了磨损均匀。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294364", "t": 2, "q": "在链传动中，下列哪些措施可延长链条的使用寿命？", "a": ["减小链条的工作载荷", "定期润滑链条", "增大链轮的直径", "采用张紧装置", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294365", "t": 2, "q": "在链传动中，影响链传动承载能力的主要因素有哪些？", "a": ["链条的排数", "链条的节距", "链轮的齿数", "链传动的中心距", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294366", "t": 2, "q": "在蜗杆传动设计中，为了提高蜗杆传动的效率，可以采取的措施有哪些？", "a": ["减小蜗杆导程角γ", "增大蜗杆头数z1", "采用减摩性好的材料配对（如钢-青铜）", "提高蜗杆和蜗轮的齿面硬度", "", ""], "r": "BC", "e": "增大蜗杆头数z1可使导程角增大，效率提高；采用减摩性好的材料配对能降低摩擦损耗，提高效率。减小蜗杆导程角γ会降低效率；提高齿面硬度主要是提高耐磨性而非效率。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294367", "t": 2, "q": "在蜗杆传动中，蜗杆的主要参数有哪些？", "a": ["头数z1", "分度圆直径d1", "导程角γ", "模数m", "", ""], "r": "ABCD", "e": "蜗杆头数z1、分度圆直径d1、导程角γ、模数m都是蜗杆传动中蜗杆的主要参数。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294368", "t": 2, "q": "在蜗杆传动中，蜗轮轮齿的失效形式主要有哪些？", "a": ["齿面接触疲劳点蚀", "齿面磨损", "齿面胶合", "轮齿弯曲疲劳折断", "", ""], "r": "ABCD", "e": "蜗杆传动中，因相对滑动速度大、发热多，易出现齿面胶合和磨损；同时也会有齿面接触疲劳点蚀和轮齿弯曲疲劳折断情况。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294369", "t": 2, "q": "在蜗杆传动中，下列哪些因素会影响蜗杆传动的自锁性能？", "a": ["蜗杆的导程角γ", "蜗杆和蜗轮的材料摩擦系数f", "蜗杆的头数z1", "蜗杆的模数m", "", ""], "r": "ABC", "e": "答案：ABC影响蜗杆传动自锁性能的主要因素包括蜗杆的导程角γ（影响滑动速度和摩擦力矩）、蜗杆和蜗轮的材料摩擦系数f（直接影响摩擦力矩的大小）、蜗杆的头数z1（头数越少，自锁性能越好）。而蜗杆的模数m主要影响传动的尺寸和强度，并不直接影响自锁性能。", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294370", "t": 2, "q": "在圆锥齿轮传动中，为了保证两齿轮正确安装，需要满足的安装条件有哪些？", "a": ["两齿轮的分度圆锥顶点重合", "两齿轮的锥距相等", "两齿轮的压力角相等", "两齿轮的模数相等", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294371", "t": 2, "q": "直流电动机的电枢反应主要包括哪些类型？", "a": ["交轴电枢反应", "去磁电枢反应", "直轴电枢反应", "增磁电枢反应", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294372", "t": 2, "q": "直流电动机的调速方法主要有哪些？", "a": ["电枢串电阻调速", "弱磁调速", "变频调速", "降压调速", "", ""], "r": "ABD", "e": "直流电动机调速方法包括电枢串电阻调速、弱磁调速、降压调速，变频调速一般用于交流电动机。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294373", "t": 2, "q": "直流电动机的制动方法主要有哪些？", "a": ["回馈制动（电机发电回馈电能）", "反接制动（电枢电压反向）", "能耗制动（电枢回路串电阻）", "机械制动（如刹车片制动）", "", ""], "r": "ABC", "e": "直流电动机制动方法有回馈、反接、能耗制动，机械制动不是电动机自身制动方法。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294374", "t": 2, "q": "直流电动机的主要组成部分包括哪些？", "a": ["端盖", "转子（电枢铁心、电枢绕组、换向器）", "定子（主磁极、换向极、机座）", "电刷装置", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294375", "t": 2, "q": "自动控制原理中，0型系统对下列哪些输入信号的稳态误差为无穷大？", "a": ["抛物线输入（加速度输入）", "斜坡输入（速度输入）", "脉冲输入", "阶跃输入（位置输入）", "", ""], "r": "AB", "e": "0型系统对阶跃输入稳态误差为常数，对斜坡和抛物线输入稳态误差为无穷大，脉冲输入不是常规考察稳态误差对象。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294376", "t": 2, "q": "自动控制原理中，系统的开环传递函数G（　）H（　）的极点主要影响系统的哪些性能？", "a": ["抗干扰能力", "稳定性", "动态响应速度", "稳态误差", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294377", "t": 2, "q": "自动控制原理中，系统稳定性的判断方法主要有哪些？", "a": ["时域响应法", "奈奎斯特稳定判据", "劳斯稳定判据", "根轨迹法", "", ""], "r": "ABCD", "e": "时域响应法、奈奎斯特稳定判据、劳斯稳定判据、根轨迹法都是自动控制原理中判断系统稳定性的常用方法。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294378", "t": 2, "q": "自动控制原理中，下列哪些属于闭环控制系统的特点？", "a": ["抗干扰能力强", "控制精度高", "输出量参与控制", "有反馈环节", "", ""], "r": "ABCD", "e": "闭环控制系统通过反馈环节将输出量反馈到输入端，输出量参与控制过程，能根据输出与期望的偏差进行调整，所以抗干扰能力强、控制精度高。ABCD选项均是闭环控制系统特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294379", "t": 2, "q": "自动控制原理中，下列哪些属于常用的校正装置类型？", "a": ["超前校正装置", "比例-积分-微分（PID）校正装置", "滞后校正装置", "滞后-超前校正装置", "", ""], "r": "ABCD", "e": "在自动控制原理里，超前、滞后、滞后 - 超前校正装置以及比例 - 积分 - 微分（PID）校正装置都是常用校正装置类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294380", "t": 2, "q": "自动控制原理中，下列哪些属于系统不稳定的表现？", "a": ["输出信号振幅随时间增大", "阶跃响应收敛到稳态值", "系统存在右半平面的闭环极点", "阶跃响应发散", "", ""], "r": "ACD", "e": "系统不稳定时，输出会随时间不断增大或发散，右半平面闭环极点会使系统不稳定。而阶跃响应收敛到稳态值是系统稳定的表现。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294381", "t": 2, "q": "自动控制原理中，下列哪些属于系统的动态性能指标？", "a": ["峰值时间tp", "稳态误差ess", "超调量σ%", "调整时间ts", "", ""], "r": "ACD", "e": "动态性能指标描述系统过渡过程特性。峰值时间是响应到达第一个峰值的时间，超调量是响应超出稳态值的比例，调整时间是响应进入允许误差带所需时间，它们都反映系统动态特性。而稳态误差是系统进入稳态后的误差，属于稳态性能指标。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294382", "t": 2, "q": "自动控制原理中，下列哪些属于线性时不变系统的性质？", "a": ["齐次性", "时不变性", "叠加性", "因果性", "", ""], "r": "ABC", "e": "线性时不变系统具有齐次性、叠加性和时不变性。因果性并非线性时不变系统特有性质。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294383", "t": 2, "q": "自动控制原理中，下列哪些信号属于典型输入信号？", "a": ["阶跃信号", "斜坡信号", "正弦信号", "抛物线信号", "", ""], "r": "ABCD", "e": "阶跃、斜坡、抛物线和正弦信号在自动控制原理里都是典型输入信号，用于系统性能分析。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810584897294384", "t": 2, "q": "自动控制原理中，线性系统的主要性质有哪些？", "a": ["齐次性", "时不变性", "稳定性", "叠加性", "", ""], "r": "ABD", "e": "线性系统的主要性质包括齐次性、叠加性和时不变性。稳定性是系统的一种特性，但不是线性系统独有的，非线性系统也可能具有稳定性。因此，选项C可以排除。综上所述，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196928", "t": 3, "q": "链传动中，采用偶数链节和奇数链轮齿数的组合，可以避免链条与链轮的磨损集中。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196929", "t": 3, "q": "链传动中，链轮的齿数越多，传动的平稳性越差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "链传动中，链轮齿数越多，链节在链轮上的多边形效应越不明显，传动平稳性越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196930", "t": 3, "q": "链传动中，链条的节距越大，传动的承载能力越强，但传动平稳性越差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "节距大则每节链条尺寸大，承载能力强；但节距大使得多边形效应更明显，导致传动平稳性变差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196931", "t": 3, "q": "三相同步电动机的功率因数可以通过调节励磁电流来改变。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三相同步电动机中，改变励磁电流会改变定子电流与电压的相位关系，从而能调节功率因数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196932", "t": 3, "q": "三相异步电动机采用星-三角（Y-Δ）降压启动时，启动转矩是直接启动时的1/3。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据三相异步电动机星 - 三角降压启动的特性，其启动转矩与直接启动转矩存在固定关系，启动转矩为直接启动时的1/3。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196933", "t": 3, "q": "三相异步电动机的定子绕组采用三角形连接时，线电压等于相电压。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三相异步电动机定子绕组三角形连接时，线电压与相电压相等，这是基本电路知识。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196934", "t": 3, "q": "三相异步电动机的定子绕组匝数越多，电机的额定电压越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196935", "t": 3, "q": "三相异步电动机的额定电流是指电机定子绕组的线电流。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三相异步电动机额定电流就是电机在额定运行时，定子绕组的线电流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196936", "t": 3, "q": "三相异步电动机的额定功率是指电机输入的电功率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "三相异步电动机额定功率指其轴上输出的机械功率，并非输入的电功率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810586147196937", "t": 3, "q": "三相异步电动机的铁损随电机转速的升高而增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "铁损主要由磁滞损耗和涡流损耗组成，取决于电源频率和磁通密度等，与电机转速无关。所以该说法错误。 ", "ap": [false, false, false, false,
