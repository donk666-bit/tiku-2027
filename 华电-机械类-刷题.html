": "2034810634188754945", "t": 1, "q": "机械加工中，\"振动\"对加工质量的影响不包括", "a": ["产生振纹，影响形状精度", "增大表面粗糙度值", "降低刀具寿命", "增大尺寸公差", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754946", "t": 1, "q": "机械加工中，加工误差按其性质可分为系统误差和随机误差，下列属于系统误差的是", "a": ["机床主轴径向跳动导致的误差", "刀具磨损导致的误差（短期内）", "毛坯余量不均匀导致的误差", "工件装夹时的轻微晃动导致的误差", "", ""], "r": "A", "e": "这是一道关于机械加工中误差分类的问题。我们需要根据误差的性质来判断哪些属于系统误差。系统误差是指在相同条件下重复测量时，误差的大小和符号均保持不变，或按一定规律变化的误差。随机误差则是测量过程中随机出现的误差，其大小和符号均不确定。现在我们来分析各个选项：A. 机床主轴径向跳动导致的误差 - 这种误差是由于机床本身的结构问题导致的，每次测量时都会存在，并且大小和方向相对固定，因此属于系统误差。B. 刀具磨损导致的误差（短期内） - 刀具磨损是一个逐渐变化的过程，短期内其导致的误差并不稳定，因此更倾向于随机误差。C. 毛坯余量不均匀导致的误差 - 这种误差是由于原材料的不均匀性造成的，每次测量时都可能不同，属于随机误差。D. 工件装夹时的轻微晃动导致的误差 - 这种误差是由于操作过程中的不稳定因素导致的，每次测量时都可能不同，也属于随机误差。综上所述，只有A选项描述的误差符合系统误差的定义。所以，正确答案是A选项：“机床主轴径向跳动导致的误差”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754947", "t": 1, "q": "机械加工中，为降低零件表面粗糙度值，可采取的措施是", "a": ["采用高速切削", "增大背吃刀量", "增大进给量", "减小刀具刀尖圆弧半径", "", ""], "r": "A", "e": "高速切削能使切屑变形减小，振动减小，可降低表面粗糙度。增大背吃刀量和进给量、减小刀具刀尖圆弧半径一般会使表面粗糙度增大。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754948", "t": 1, "q": "机械加工中，为控制\"残余应力\"对零件精度的影响，可采取的措施是", "a": ["增大切削速度", "进行去应力退火", "采用硬质合金刀具", "减小进给量", "", ""], "r": "B", "e": "残余应力会影响零件精度，去应力退火能消除或降低残余应力。增大切削速度、采用硬质合金刀具、减小进给量主要影响切削过程和加工表面质量等，对残余应力影响不大。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754949", "t": 1, "q": "机械加工中，影响零件表面粗糙度的因素不包括下列哪一项", "a": ["工件材料的硬度", "刀具几何参数（如刀尖圆弧半径）", "机床的几何精度", "切削用量（如进给量）", "", ""], "r": "C", "e": "机床几何精度主要影响零件的形状和位置精度，而非表面粗糙度。工件材料硬度、刀具几何参数、切削用量都会影响表面粗糙度。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754950", "t": 1, "q": "机械装配工艺规程设计中，“装配尺寸链”的封闭环通常是", "a": ["毛坯尺寸", "装配后需保证的装配精度要求", "工序尺寸", "零件的某一设计尺寸", "", ""], "r": "B", "e": "装配尺寸链封闭环是装配后要保证的装配精度要求。毛坯尺寸、工序尺寸、零件设计尺寸一般是组成环。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754951", "t": 1, "q": "机械装配工艺规程设计中，对于精度要求高且组成件数量多的部件，常采用的装配方法是", "a": ["调整法", "分组装配法", "修配法", "完全互换法", "", ""], "r": "B", "e": "在机械装配工艺规程设计中，针对精度要求高且组成件数量多的部件，需要采用一种既能保证精度又能提高装配效率的方法。A. 调整法通常用于在一定范围内调整配合间隙或位置，但不适合精度要求极高且件数多的情况。B. 分组装配法是将相似精度或尺寸的零件分组进行装配，以提高整体装配精度，适用于精度要求高且组成件数量多的部件。C. 修配法主要用于修复配合件的尺寸偏差，通常用于单件或小批量生产。D. 完全互换法要求所有零件都达到很高的制造精度，对于件数多的部件来说，成本过高且不易实现。综合以上分析，分组装配法最符合题目描述的要求。所以，正确答案是B.分组装配法。", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754952", "t": 1, "q": "机械装配中，\"调整装配法\"与\"修配装配法\"的主要区别是", "a": ["调整装配法通过改变零件位置调整精度，修配装配法通过去除零件材料调整精度", "调整装配法适用于大批量生产，修配装配法适用于单件小批量生产", "调整装配法精度高，修配装配法精度低", "调整装配法需预留调整件，修配装配法需预留修配件", "", ""], "r": "A", "e": "调整装配法是通过改变零件的位置或更换调整件来调整精度；修配装配法是通过去除零件材料来达到装配精度要求。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754953", "t": 1, "q": "机械装配中，“动态装配”与“静态装配”的主要区别是", "a": ["动态装配需要专用设备，静态装配无需专用设备", "动态装配精度高，静态装配精度低", "动态装配在零件运动状态下进行，静态装配在静止状态下进行", "动态装配适用于大型部件，静态装配适用于小型部件", "", ""], "r": "C", "e": "动态和静态的本质区别就在于是否处于运动状态，动态装配是在零件运动状态下进行，静态装配是在静止状态下进行。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754954", "t": 1, "q": "机械装配中，\"过盈配合\"的装配方法不包括", "a": ["液压套合装配法", "锤击装配法", "压入装配法", "热胀冷缩装配法", "", ""], "r": "B", "e": "锤击装配法多用于过渡配合或较松的过盈配合，不是专门的过盈配合装配方法。而液压套合装配法、压入装配法、热胀冷缩装配法是典型过盈配合装配方法。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754955", "t": 1, "q": "机械装配中，\"互换装配法\"的关键条件是", "a": ["装配时需对某一零件进行修配", "各组成零件的材料性能一致", "各组成零件的加工精度足够高", "装配时需调整某一零件的位置", "", ""], "r": "C", "e": "互换装配法是指在装配时各配合零件不经修配、选择或调整即可达到装配精度的方法，这就要求各组成零件的加工精度足够高。A选项修配和D选项调整都不是互换装配法特点；B选项材料性能与互换装配法关键条件无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754956", "t": 1, "q": "机械装配中，“间隙配合”的装配方法不包括", "a": ["导向装配法", "手工装配法", "压入装配法", "低温装配法", "", ""], "r": "C", "e": "间隙配合时零件间有间隙，无需较大力装配。压入装配法多用于过盈配合，靠压力使零件配合，不用于间隙配合。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754957", "t": 1, "q": "机械装配中，\"接触精度\"的检测方法不包括", "a": ["涂色法", "千分尺检测法", "塞尺检测法", "透光法", "", ""], "r": "B", "e": "接触精度检测方法主要检测物体表面接触情况。千分尺用于测量尺寸精度。涂色法、塞尺检测法、透光法可用于检测接触精度。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754958", "t": 1, "q": "机械装配中，\"整体装配法\"适用于", "a": ["单件小批量生产的部件装配", "大批量生产的小型部件装配", "精度要求高的部件装配", "大型复杂部件的装配", "", ""], "r": "A", "e": "整体装配法（又称完全互换装配法）是指在装配时，各配合零件不经任何选择、修配或调整，直接装配即可达到装配精度要求。这种方法要求零件的加工精度足够高，成本较大，因此通常适用于单件小批量生产中对装配精度要求不高、或零件加工精度易于保证的部件装配。选项B“大批量生产的小型部件装配”更适合采用完全互换法（但整体装配法并非仅适用于大批量）；选项C“精度要求高的部件装配”往往需要采用选配法、修配法或调整法；选项D“大型复杂部件的装配”通常采用修配法或调整法，整体装配法难以满足精度和成本要求。因此，正确答案为A。", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754959", "t": 1, "q": "机械装配中，\"装配夹具\"的主要作用是", "a": ["保证装配时零件的正确位置和相对位置精度", "提高零件的加工精度", "改善零件的表面质量", "减少零件的装配余量", "", ""], "r": "A", "e": "装配夹具是在装配过程中使用的工具，其核心作用是确保零件在装配时处于正确位置，保证相对位置精度。B选项提高加工精度是加工环节的事；C选项改善表面质量主要依靠加工工艺；D选项减少装配余量与装配夹具作用无关。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754960", "t": 1, "q": "机械装配中，\"装配精度\"的主要内容不包括", "a": ["接触精度", "位置精度", "形状精度", "尺寸精度", "", ""], "r": "C", "e": "装配精度主要包括尺寸精度、位置精度、相对运动精度和接触精度，形状精度一般是零件自身的精度，并非装配精度主要内容。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754961", "t": 1, "q": "机械装配中，“装配精度的保证方法”不包括下列哪一项", "a": ["调整法", "修配法", "误差复映法", "互换法", "", ""], "r": "C", "e": "误差复映法是在机械加工中因工艺系统受力变形产生的现象，并非装配精度的保证方法。而调整法、修配法、互换法是常见的装配精度保证方法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754962", "t": 1, "q": "机械装配中，\"装配顺序\"的确定原则不包括", "a": ["先小后大", "先内后外", "先精后粗", "先难后易", "", ""], "r": "C", "e": "装配顺序一般是先大后小、先粗后精，C选项“先精后粗”不符合装配顺序确定原则。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754963", "t": 1, "q": "机械装配中，\"总装配\"的主要任务是", "a": ["对零件进行清洗和检验", "将零件装配成部件", "确定装配顺序和装配方法", "将部件装配成最终产品，并进行调试和检验", "", ""], "r": "D", "e": "总装配是把部件装配成最终产品，且要进行调试和检验。A选项是装配前工作；B选项是部件装配任务；C选项是装配前期规划。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754964", "t": 1, "q": "机械装配中，为保证两个零件之间的同轴度要求，常采用的装配定心方式是", "a": ["气压定心", "液压定心", "刚性定心", "弹性定心", "", ""], "r": "C", "e": "在机械装配保证两零件同轴度时，刚性定心能利用刚性元件准确确定零件位置，保证同轴度，气压、液压定心多用于特定工作场景而非保证同轴度，弹性定心一般用于补偿误差等，不是保证同轴度的常用方式。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754965", "t": 1, "q": "数控编程中，\"程序段号\"的主要作用是", "a": ["控制主轴的转速", "设定程序的加工精度", "控制程序执行的顺序", "便于程序的查找、修改和跳转", "", ""], "r": "D", "e": "程序段号主要是方便对程序进行管理，如查找、修改程序，也能用于程序跳转。A选项主轴转速由特定指令控制；B选项加工精度通过刀具补偿等设置；C选项程序执行顺序按程序编写顺序，并非由程序段号控制。所以答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754966", "t": 1, "q": "数控编程中，“刀具补偿”的目的是", "a": ["补偿工件的装夹误差", "补偿编程误差", "补偿刀具的制造误差和磨损", "补偿机床的几何误差", "", ""], "r": "C", "e": "刀具补偿主要是为了应对刀具在制造和使用过程中出现的误差，包括制造误差和使用时的磨损，让加工更精准。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754967", "t": 1, "q": "数控编程中，\"工件坐标系设定\"指令是", "a": ["G91", "G50", "G90", "G54", "", ""], "r": "D", "e": "G54是工件坐标系设定指令。G91是增量编程指令，G50在不同系统有不同作用，G90是绝对编程指令。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754968", "t": 1, "q": "数控编程中，“固定循环指令”的主要作用是", "a": ["控制刀具的运动轨迹", "设定工件坐标系", "简化重复加工动作的编程", "控制主轴转速", "", ""], "r": "C", "e": "固定循环指令可将一些典型的、重复的加工动作（如钻孔、镗孔等）编成一个指令，简化了编程过程。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754969", "t": 1, "q": "数控编程中，“绝对坐标”与“增量坐标”的转换关系是", "a": ["增量坐标=当前绝对坐标+上一位置绝对坐标", "绝对坐标=当前位置增量坐标-上一位置绝对坐标", "绝对坐标=当前增量坐标+上一位置绝对坐标", "增量坐标=当前绝对坐标-上一位置绝对坐标", "", ""], "r": "D", "e": "增量坐标是当前位置相对上一位置的坐标变化量，所以增量坐标等于当前绝对坐标减去上一位置绝对坐标。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754970", "t": 1, "q": "数控编程中，“绝对坐标编程”与“增量坐标编程”的主要区别是", "a": ["绝对坐标编程以机床原点为基准，增量坐标编程以工件原点为基准", "绝对坐标编程以当前位置为基准，增量坐标编程以工件原点为基准", "绝对坐标编程以机床原点为基准，增量坐标编程以当前位置为基准", "绝对坐标编程以工件原点为基准，增量坐标编程以当前位置为基准", "", ""], "r": "C", "e": "这道题主要考察对数控编程中“绝对坐标编程”与“增量坐标编程”概念的理解。绝对坐标编程是以一个固定的基准点，通常是机床原点或工件原点，来确定刀具或工件的位置。在绝对坐标编程中，每次移动都是相对于这个固定基准点的绝对位置来指定的。增量坐标编程则是以当前位置为基准，来确定刀具或工件的下一步移动距离和方向。在增量坐标编程中，每次移动都是相对于上一个位置的增量来指定的。现在我们来分析选项：A. 绝对坐标编程以机床原点为基准是正确的，但增量坐标编程并不是以工件原点为基准，而是以当前位置为基准。所以A选项错误。B. 绝对坐标编程并不是以当前位置为基准，而是以机床原点或工件原点为基准。所以B选项错误。C. 绝对坐标编程以机床原点为基准，增量坐标编程以当前位置为基准。这个描述是准确的，符合绝对坐标编程和增量坐标编程的定义。D. 绝对坐标编程可以以工件原点为基准，但更常见的是以机床原点为基准。而增量坐标编程确实是以当前位置为基准，但D选项中关于绝对坐标编程的描述不完全准确。综上所述，C选项最准确地描述了“绝对坐标编程”与“增量坐标编程”的主要区别。所以，正确答案是C：“绝对坐标编程以机床原点为基准，增量坐标编程以当前位置为基准”。", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754971", "t": 1, "q": "数控编程中，\"圆弧插补\"指令需要设定的参数不包括", "a": ["圆弧的终点坐标", "圆弧的半径或圆心坐标", "圆弧的起点坐标", "圆弧的切削速度", "", ""], "r": "D", "e": "数控“圆弧插补”需明确圆弧起止位置、形状，所以要圆弧终点坐标、半径或圆心坐标、起点坐标。而切削速度是加工时的工艺参数，非“圆弧插补”指令设定参数。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754972", "t": 1, "q": "数控编程中，\"暂停指令\"是", "a": ["G04", "G00", "M01", "M00", "", ""], "r": "A", "e": "G04是数控编程里的暂停指令；G00是快速定位指令；M01是选择停止指令；M00是程序停止指令。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754973", "t": 1, "q": "数控编程中，\"子程序调用\"指令是", "a": ["G99", "M99", "M98", "G98", "", ""], "r": "C", "e": "数控编程里，M98是子程序调用指令，G99、G98是与进给速度有关指令，M99是子程序结束返回主程序指令。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754974", "t": 1, "q": "数控编程中，G00指令的运动特点是", "a": ["控制主轴以指定转速旋转", "以机床最快速度进行点到点的快速定位运动", "以程序设定的进给速度进行直线插补运动", "以恒定角速度进行圆弧插补运动", "", ""], "r": "B", "e": "G00是快速定位指令，用于使刀具以机床最快速度从当前位置快速移动到指定位置，是点到点的快速定位运动。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754975", "t": 1, "q": "数控编程中，G41指令的功能是", "a": ["刀具半径补偿（右补偿）", "刀具长度补偿（负向）", "刀具半径补偿（左补偿）", "刀具长度补偿（正向）", "", ""], "r": "C", "e": "G41是数控编程里用于刀具半径左补偿的指令。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754976", "t": 1, "q": "数控编程中，M03指令的功能是", "a": ["主轴停止", "主轴反转", "冷却液开启", "主轴正转", "", ""], "r": "D", "e": "M03是数控编程里控制主轴正转的指令。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754977", "t": 1, "q": "数控车床加工螺纹时，为保证螺纹牙型精度，需严格控制的运动是", "a": ["工件的装夹刚度", "主轴转速与进给速度的匹配", "刀具的磨损量", "刀具的切入角度", "", ""], "r": "B", "e": "数控车床加工螺纹时，主轴转速和进给速度需精确匹配，才能保证螺纹牙型精度。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754978", "t": 1, "q": "数控铣床加工平面时，若采用端铣刀，为保证平面度精度，应主要控制", "a": ["进给速度的均匀性", "刀具的刀柄刚度", "铣刀的端面跳动", "主轴的轴向窜动", "", ""], "r": "C", "e": "端铣刀加工平面，平面度受铣刀端面跳动影响大，若铣刀端面跳动大，加工平面会不平整。而进给速度均匀性主要影响表面粗糙度；刀柄刚度主要影响加工稳定性；主轴轴向窜动对平面度影响不如铣刀端面跳动直接。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754979", "t": 1, "q": "液压传动系统中，\"调速阀\"相比节流阀的主要优点是", "a": ["压力损失小", "结构简单", "调节流量范围大", "流量稳定性好，不受负载变化影响", "", ""], "r": "D", "e": "节流阀流量会受负载变化影响，而调速阀能在负载变化时保持流量稳定。所以“调速阀”相比节流阀主要优点是流量稳定性好，不受负载变化影响。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754980", "t": 1, "q": "液压传动系统中，\"方向控制阀\"不包括下列哪一项", "a": ["单向阀", "换向阀", "梭阀", "溢流阀", "", ""], "r": "D", "e": "溢流阀是压力控制阀，用于控制液压系统压力。而单向阀、换向阀、梭阀属于方向控制阀，用于控制油液流动方向。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754981", "t": 1, "q": "液压传动系统中，“过滤器”的安装位置不包括", "a": ["执行元件回油口", "液压泵出油口", "溢流阀出油口", "液压泵吸油口", "", ""], "r": "C", "e": "过滤器一般安装在液压泵吸油口、出油口以及执行元件回油口等位置来过滤杂质。溢流阀出油口通常是回油箱，无需在此处安装过滤器。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754982", "t": 1, "q": "液压传动系统中，“流量控制阀”的工作原理是通过改变", "a": ["阀口的通流面积来控制流量", "油液的压力来控制流量", "油液的粘度来控制流量", "油液的温度来控制流量", "", ""], "r": "A", "e": "流量控制阀是通过改变阀口通流面积大小来改变液阻，从而控制通过阀的流量。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754983", "t": 1, "q": "液压传动系统中，\"顺序阀\"的工作原理是", "a": ["调节油液流量，控制执行元件运动速度", "当系统压力达到调定值时开启，控制执行元件按顺序动作", "控制系统的最高工作压力，防止过载", "控制油液的流动方向，实现执行元件换向", "", ""], "r": "B", "e": "顺序阀主要作用是当系统压力达到调定值时开启，进而控制执行元件按顺序动作。A选项是节流阀功能；C选项是溢流阀功能；D选项是换向阀功能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754984", "t": 1, "q": "液压传动系统中，\"蓄能器\"的类型不包括", "a": ["活塞式蓄能器", "重力式蓄能器", "弹簧式蓄能器", "节流式蓄能器", "", ""], "r": "D", "e": "常见蓄能器类型有活塞式、重力式、弹簧式，节流式不是蓄能器类型。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754985", "t": 1, "q": "液压传动系统中，\"蓄能器\"的主要功能不包括", "a": ["控制系统最高工作压力", "在系统停电时提供应急压力油", "储存液压油，补充系统泄漏", "吸收系统压力脉动", "", ""], "r": "A", "e": "蓄能器可应急供压、补漏、吸脉动，而控制系统最高工作压力是溢流阀的功能。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754986", "t": 1, "q": "液压传动系统中，\"液压冲击\"产生的主要原因是", "a": ["液压元件磨损严重", "液压油粘度太大", "系统压力过高", "油液流动速度突然变化", "", ""], "r": "D", "e": "液压冲击是因油液流动速度突然变化，使压力瞬间急剧升高形成。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754987", "t": 1, "q": "液压传动系统中，\"液压马达\"与\"液压泵\"的主要区别是", "a": ["液压马达输出机械能，液压泵消耗机械能", "液压马达可双向旋转，液压泵需单向旋转", "液压马达的工作压力低于液压泵", "液压马达是执行元件，液压泵是动力元件", "", ""], "r": "D", "e": "液压泵属于动力元件，将机械能转换为液压能；液压马达属于执行元件，将液压能转换为机械能。A 表述错误，液压泵是输入机械能（消耗电机机械能）输出液压能，液压马达输入液压能输出机械能，不是二者核心区别；B 部分泵也可双向旋转；C 二者工作压力无必然高低关系。", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754988", "t": 1, "q": "液压传动系统中，\"液压油的污染\"主要危害不包括", "a": ["产生气穴现象", "加剧液压元件磨损", "降低液压油的粘度", "堵塞液压阀阀口，导致动作失灵", "", ""], "r": "A", "e": "气穴现象主要是因系统中局部压力低于油液空气分离压使空气析出形成气泡，与液压油污染无关；污染的液压油会磨损元件、堵塞阀口，且含杂质等会影响粘度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754989", "t": 1, "q": "液压传动系统中，换向阀的中位机能为\"O型\"时，其特点是", "a": ["进油口通回油口，执行元件自由运动，泵卸荷", "各油口全通，执行元件可自由运动", "各油口全闭，执行元件锁定，泵卸荷", "各油口全闭，执行元件锁定，泵保压", "", ""], "r": "D", "e": "“O型”中位机能特点是各油口全闭，执行元件被锁定，泵不能卸荷而是保压。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754990", "t": 1, "q": "液压传动系统中，叶片泵相比齿轮泵的主要优点是", "a": ["自吸能力强", "结构简单、成本低", "工作压力高", "流量脉动小", "", ""], "r": "D", "e": "叶片泵的流量均匀，脉动小，而齿轮泵流量脉动大。自吸能力强、结构简单成本低是齿轮泵特点，工作压力高不是叶片泵相比齿轮泵的主要优点。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754991", "t": 1, "q": "液压传动系统中，液压油的粘度随温度升高会", "a": ["升高", "降低", "不变", "先升高后降低", "", ""], "r": "B", "e": "一般来说，液压油的粘度会随温度升高而降低。这是因为温度升高时，分子热运动加剧，分子间的内摩擦力减小，从而使粘度下降。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754992", "t": 1, "q": "液压传动系统中，溢流阀在系统正常工作时的状态是", "a": ["常开，油液经溢流阀回油箱", "常闭，仅在系统压力超过调定值时开启", "随执行元件动作周期交替开关", "半开半闭，维持系统压力稳定", "", ""], "r": "B", "e": "溢流阀主要作用是限定系统最高压力。正常工作时，系统压力未超调定值，溢流阀常闭；当压力超调定值才开启溢流。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810634188754993", "t": 1, "q": "在机械加工工艺规程设计中，当零件某一表面的加工需要经过粗加工、半精加工、精加工多个阶段时，其主要目的不包括下列哪一项", "a": ["逐步消除加工误差，提高加工精度", "减少工件受热变形对加工质量的影响", "合理使用机床设备，避免高精度机床承担粗加工", "减少刀具磨损，延长刀具使用寿命", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528448", "t": 2, "q": "机械装配中，分组装配法的实施步骤包括下列哪些", "a": ["调整调整件的位置，补偿零件尺寸误差", "预留修配余量，装配时修配某一零件", "将组成零件按实际尺寸分组，每组尺寸差相等", "同一组内的零件进行互换装配，保证装配精度", "", ""], "r": "CD", "e": "分组装配法核心是将零件按实际尺寸分组，组内尺寸差相同，组内零件可互换装配保证精度。A是调整装配法，B是修配装配法。所以答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528449", "t": 2, "q": "机械装配中，分组装配法的适用条件包括下列哪些？", "a": ["需要对零件进行修配", "生产纲领大，批量生产", "装配精度要求高，但组成件数量少（通常2-3件）", "零件加工精度难以直接满足装配要求", "", ""], "r": "CD", "e": "答案：CD分组装配法适用于装配精度要求高，但组成件数量少（通常 2 - 3 件），以及零件加工精度难以直接满足装配要求的情况。A 选项需要对零件进行修配不是分组装配法的适用条件。B 选项生产纲领大、批量生产一般采用互换装配法。", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528450", "t": 2, "q": "机械装配中，互换装配法的适用条件包括下列哪些", "a": ["生产纲领大，批量生产", "装配精度要求不高或组成件数量少", "零件加工精度能满足尺寸链要求", "需要对零件进行修配或调整", "", ""], "r": "ABC", "e": "互换装配法适用于大量生产，要求装配精度不高或组成件少，且零件加工精度能满足尺寸链要求。而需要修配或调整是修配法和调整法的特点，不是互换装配法的。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528451", "t": 2, "q": "机械装配中，互换装配法分为下列哪些类型", "a": ["完全互换法", "分组互换法", "不完全互换法（概率互换法）", "修配互换法", "", ""], "r": "ABC", "e": "互换装配法包括完全互换法、分组互换法、不完全互换法（概率互换法），修配互换法不属于互换装配法。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528452", "t": 2, "q": "机械装配中，接触精度的常用检测方法包括下列哪些", "a": ["千分尺检测法（测量接触面尺寸）", "涂色法（观察接触斑点）", "透光法（观察接触面透光情况）", "塞尺检测法（测量接触面间隙）", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528453", "t": 2, "q": "机械装配中，静态装配的检测项目包括下列哪些", "a": ["装配间隙和过盈量", "零件的尺寸精度和形位精度", "运动部件的同轴度", "接触面的贴合程度", "", ""], "r": "ABD", "e": "静态装配检测主要针对装配后相对静止状态下的部件。A选项装配间隙和过盈量、B选项零件尺寸精度和形位精度、D选项接触面贴合程度都可在静态下检测。而运动部件同轴度需在运动状态下评估其运动的准确性等情况，不属于静态装配检测项目。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528454", "t": 2, "q": "机械装配中，修配装配法的实施步骤包括下列哪些？", "a": ["调整修配环的位置，补偿尺寸误差", "预留修配余量在修配环上", "选择一个易修配的零件作为修配环", "装配时修配修配环，使装配精度达到要求", "", ""], "r": "BCD", "e": "修配装配法先选易修配零件作修配环，预留修配余量，装配时修配修配环以达精度，而非调整修配环位置补偿误差。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528455", "t": 2, "q": "机械装配中，修配装配法的特点包括下列哪些", "a": ["需要预留修配余量", "适用于单件小批量生产", "装配效率高，便于自动化", "适用于装配精度要求高、组成件数量多的部件", "", ""], "r": "ABD", "e": "修配装配法要预留修配量来保证装配精度，常用于单件小批量生产，适合装配精度高、组成件多的部件，但装配效率低、难自动化。C选项表述错误，答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528456", "t": 2, "q": "机械装配中，整体装配法的适用条件包括下列哪些", "a": ["装配精度要求不高的部件", "零件数量少、结构简单的部件", "不需要后续调整或修配的复杂部件", "小批量生产的小型、简单部件", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528457", "t": 2, "q": "机械装配中，装配尺寸链的建立步骤包括下列哪些", "a": ["确定封闭环（装配精度要求）", "查找组成环（影响封闭环的零件尺寸）", "画出尺寸链图，明确各环的关系", "计算各组成环的公差", "", ""], "r": "ABCD", "e": "机械装配中建立装配尺寸链，首先要确定封闭环即装配精度要求，接着查找影响封闭环的组成环，然后画出尺寸链图明确各环关系，最后才是计算各组成环公差。ABCD 选项分别对应了装配尺寸链建立的不同步骤。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528458", "t": 2, "q": "机械装配中，装配工艺规程的编制依据包括下列哪些", "a": ["零件设计图纸和技术要求", "生产纲领和生产类型（如单件、批量）", "产品装配图和装配技术要求", "现有生产设备和工艺装备条件", "", ""], "r": "ABCD", "e": "编制装配工艺规程需依据产品相关图纸及技术要求，明确装配目标；生产纲领和类型决定工艺的复杂程度和组织方式；现有生产设备和工艺装备条件则限定了工艺的可行性。答案涵盖了这些方面。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528459", "t": 2, "q": "机械装配中，装配精度的主要内容包括下列哪些", "a": ["形状精度（如平面度、圆度）", "尺寸精度（如配合间隙、过盈量）", "接触精度（如接触面贴合程度）", "位置精度（如同轴度、平行度）", "", ""], "r": "BCD", "e": "答案：BCD装配精度主要包括尺寸精度、接触精度和位置精度。形状精度一般是零件加工精度的内容，而非装配精度的内容。", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528460", "t": 2, "q": "机械装配中，装配精度与零件精度的关系包括下列哪些", "a": ["装配精度完全由关键零件的精度决定", "采用调整法或修配法时，零件精度可适当降低", "装配精度取决于所有组成零件的精度", "零件精度越高，装配精度不一定越高（需考虑装配方法）", "", ""], "r": "BCD", "e": "装配精度与零件精度有关，但不是完全由关键零件精度决定，也并非取决于所有零件精度；采用调整或修配法，可适当降低零件精度；装配精度还受装配方法影响，零件精度高装配精度不一定高。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528461", "t": 2, "q": "数控编程中，程序段的组成部分包括下列哪些", "a": ["程序段号（如N10）", "机床参数设定（如主轴最高转速）", "准备功能指令（如G01）", "辅助功能指令（如M03）", "", ""], "r": "ACD", "e": "程序段由程序段号、准备功能指令、辅助功能指令等组成，机床参数设定不是程序段组成部分。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528462", "t": 2, "q": "数控编程中，程序校验的主要内容包括下列哪些", "a": ["验证加工尺寸是否符合设计要求", "模拟刀具运动轨迹，检查是否碰撞", "检查机床参数是否正确", "检查程序语法错误（如指令格式、参数缺失）", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528463", "t": 2, "q": "数控编程中，刀具半径补偿的作用包括下列哪些", "a": ["简化编程，无需考虑刀具的实际半径", "控制主轴的转速", "补偿刀具在使用过程中的磨损量", "补偿刀具的制造误差", "", ""], "r": "ACD", "e": "刀具半径补偿可让编程时不考虑刀具实际半径，按工件轮廓编程，简化编程；也能补偿刀具磨损和制造误差。而控制主轴转速与刀具半径补偿无关。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528464", "t": 2, "q": "数控编程中，刀具补偿的取消指令包括下列哪些", "a": ["G49（刀具长度补偿取消）", "G50（工件坐标系取消）", "G40（刀具半径补偿取消）", "G90（绝对坐标取消）", "", ""], "r": "AC", "e": "G49是取消刀具长度补偿，G40是取消刀具半径补偿，这两者属于刀具补偿取消指令。G50是设置工件坐标系或主轴最高转速限制，G90是绝对坐标编程指令，并非刀具补偿取消指令。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528465", "t": 2, "q": "数控编程中，刀具长度补偿的作用包括下列哪些", "a": ["调整刀具在Z轴方向的位置，无需重新对刀", "补偿刀具的长度制造误差", "补偿刀具的磨损量", "控制刀具的切削速度", "", ""], "r": "ABC", "e": "刀具长度补偿可调整Z轴位置，避免重新对刀，还能补偿刀具长度制造误差和磨损量，但与控制切削速度无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528466", "t": 2, "q": "数控编程中，辅助功能指令（M指令）的作用包括下列哪些", "a": ["控制刀具的换刀动作", "控制冷却液的开启和关闭", "控制主轴的正转、反转、停止", "控制刀具的运动轨迹", "", ""], "r": "ABC", "e": "M指令主要用于控制机床辅助动作，如换刀、冷却液开关、主轴启停等。而控制刀具运动轨迹是G指令功能。ABC选项都属于M指令作用。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528467", "t": 2, "q": "数控编程中，固定循环指令的参数包括下列哪些", "a": ["安全平面高度（R）", "孔的坐标位置（X、Y）", "孔的深度（Z）", "主轴转速（S）", "", ""], "r": "ABC", "e": "固定循环指令用于简化钻孔等操作编程，参数涵盖孔位、孔深、安全平面高度等。主轴转速不属于固定循环指令参数，是独立的编程指令参数。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528468", "t": 2, "q": "数控编程中，绝对坐标编程（G90）与增量坐标编程（G91）的区别在于", "a": ["绝对坐标以工件原点为基准，增量坐标以当前位置为基准", "绝对坐标编程适用于复杂轮廓加工，增量坐标适用于简单直线加工", "绝对坐标编程精度高，增量坐标编程精度低", "绝对坐标的坐标值是相对于原点的绝对值，增量坐标是相对于前一位置的增量值", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528469", "t": 2, "q": "数控编程中，圆弧插补指令（G02、G03）需要指定的参数包括下列哪些", "a": ["圆弧的起点坐标", "圆弧的切削进给速度（F）", "圆弧的终点坐标", "圆弧的半径（R）或圆心相对于起点的增量坐标（I、K）", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528470", "t": 2, "q": "数控编程中，暂停指令（G04）的应用场景包括下列哪些", "a": ["换刀前暂停，便于人工换刀", "镗孔后在孔底暂停，使孔壁光滑", "铣削平面时暂停，调整刀具位置", "钻孔后在孔底暂停，保证孔深精度", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528471", "t": 2, "q": "数控编程中，子程序的特点包括下列哪些", "a": ["子程序必须单独存储，不能包含在主程序中", "子程序可嵌套调用（子程序中调用另一子程序）", "子程序的编程格式与主程序相同", "子程序可多次调用，减少程序长度", "", ""], "r": "BCD", "e": "子程序可单独存储也可包含在主程序中，A错误；子程序能嵌套调用，编程格式和主程序类似，还可多次调用以减少程序长度，B、C、D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528472", "t": 2, "q": "数控编程中，子程序调用（M98）的作用包括下列哪些", "a": ["简化重复加工动作的编程，减少程序冗余", "实现多工位加工时的程序复用", "控制主轴的正反转", "便于程序的修改和维护，只需修改子程序", "", ""], "r": "ABD", "e": "子程序调用可简化重复编程、实现程序复用、方便修改维护，而控制主轴正反转是M03、M04等指令的功能。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528473", "t": 2, "q": "数控编程中，G00指令与G01指令的区别在于", "a": ["G00运动轨迹是直线，G01运动轨迹是折线", "G00速度由机床参数设定，G01速度由F指令设定", "G00用于非加工运动，G01用于加工运动", "G00是快速定位，无插补功能;G01是直线插补，按进给速度运动", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528474", "t": 2, "q": "数控编程中，G54-G59指令的作用包括下列哪些", "a": ["实现多工位加工时的坐标系切换", "控制刀具的半径补偿", "设定不同的工件坐标系", "补偿机床的几何误差", "", ""], "r": "AC", "e": "G54 - G59指令用于设定不同的工件坐标系，可实现多工位加工时坐标系切换。B选项刀具半径补偿用G41、G42等；D选项补偿机床几何误差不是其功能。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528475", "t": 2, "q": "数控编程中，G98与G99指令的区别在于", "a": ["G98适用于多工位加工，G99适用于单工位加工", "G98是固定循环结束后返回初始平面，G99返回R平面", "G98控制主轴转速，G99控制进给速度", "G98返回距离工件较远的平面，安全性高;G99返回距离工件较近的平面，效率高", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528476", "t": 2, "q": "数控车床加工螺纹时，为保证螺纹精度，需注意的事项包括", "a": ["合理设置刀具半径补偿", "选择合适的刀具切入角度（如60°牙型角）", "严格控制主轴转速与进给速度的匹配（进给速度=转速×导程）", "采用刚性好的装夹方式，减少工件振动", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528477", "t": 2, "q": "数控车床加工中，影响工件圆度误差的主要因素包括下列哪些", "a": ["切削速度的高低", "主轴径向跳动", "刀具的主偏角大小", "工件装夹时的偏心（如三爪卡盘定心误差）", "", ""], "r": "BD", "e": "主轴径向跳动会使工件在旋转时产生径向偏差影响圆度；工件装夹偏心会导致加工出的圆偏离中心影响圆度。切削速度主要影响加工效率和表面质量等，刀具主偏角主要影响切削力和切屑形状等，对圆度影响较小。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528478", "t": 2, "q": "数控铣床编程中，固定循环指令（如G81、G83）通常包含的动作有", "a": ["快速定位到孔的起始位置（R平面）", "以设定进给速度钻孔或镗孔", "孔底动作（如暂停、主轴停止）", "快速退刀到初始平面或R平面", "", ""], "r": "ABCD", "e": "固定循环指令用于简化孔加工编程，一般会先快速定位到R平面，接着按设定进给速度钻孔等，在孔底有相应动作，最后快速退刀。答案涵盖了固定循环的主要动作。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528479", "t": 2, "q": "数控铣床加工中，影响平面度误差的主要因素包括下列哪些", "a": ["工作台面的平面度误差", "切削进给速度的均匀性", "铣刀的端面跳动", "主轴轴向窜动", "", ""], "r": "ACD", "e": "工作台面平面度、铣刀端面跳动、主轴轴向窜动都会直接影响加工平面的平整程度，而切削进给速度均匀性主要影响表面粗糙度等，对平面度影响较小。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528480", "t": 2, "q": "液压传动系统中，方向控制阀的类型包括下列哪些", "a": ["换向阀（如二位三通、三位四通阀）", "单向阀（如普通单向阀、液控单向阀）", "梭阀（如或门梭阀、与门梭阀）", "节流阀（如普通节流阀、调速阀）", "", ""], "r": "ABC", "e": "方向控制阀用于控制液压系统中油液的流动方向，换向阀、单向阀、梭阀都属于方向控制阀；而节流阀是流量控制阀，用于调节流量。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528481", "t": 2, "q": "液压传动系统中，过滤器的主要作用包括下列哪些", "a": ["降低液压油的温度", "防止液压阀阀口堵塞，保证系统正常工作", "过滤液压油中的杂质，保护液压元件", "减少液压油的粘度", "", ""], "r": "BC", "e": "过滤器主要功能是过滤液压油里的杂质，避免杂质影响元件、堵塞阀口，确保系统正常。A降低油温是冷却器作用；D减少液压油粘度与过滤器无关。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528482", "t": 2, "q": "液压传动系统中，减压阀的类型包括下列哪些", "a": ["定值减压阀（输出压力恒定）", "定差减压阀（进出口压力差恒定）", "定比减压阀（进出口压力比恒定）", "先导式减压阀（由先导阀控制主阀）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528483", "t": 2, "q": "液压传动系统中，流量控制阀的类型包括下列哪些", "a": ["顺序阀", "溢流阀", "调速阀", "节流阀", "", ""], "r": "CD", "e": "顺序阀和溢流阀属于压力控制阀，调速阀和节流阀用于控制流量，是流量控制阀。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528484", "t": 2, "q": "液压传动系统中，气穴现象产生的主要原因包括下列哪些？", "a": ["液压油温度过高，降低油液饱和蒸气压", "液压油中混入过多空气", "液压泵吸油口压力过低，低于油液饱和蒸气压", "液压阀阀口通流面积过大", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528485", "t": 2, "q": "液压传动系统中，顺序阀的控制方式包括下列哪些", "a": ["先导式（由先导阀控制主阀）", "手动式（由手动调节控制）", "外控式（由外部油路压力控制）", "内控式（由自身进口压力控制）", "", ""], "r": "ACD", "e": "液压传动系统中的顺序阀是一种压力控制阀，其主要功能是控制系统中多个执行元件的顺序动作。顺序阀的控制方式主要有以下几种：A. 先导式：这种控制方式是通过一个较小的先导阀来控制主阀的启闭，从而实现对顺序阀的控制。这种方式具有响应速度快、控制精度高等优点。C. 外控式：外控式顺序阀的控制信号来自系统外部的油路压力，这种方式可以根据系统的实际需要灵活调整控制压力，从而实现对顺序阀的控制。D. 内控式：内控式顺序阀的控制信号来自阀本身的进口压力，这种方式结构简单，但控制精度相对较低。B选项“手动式”并不是顺序阀的常见控制方式，因此正确答案为ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528486", "t": 2, "q": "液压传动系统中，蓄能器的主要用途包括下列哪些", "a": ["维持系统压力（如系统保压时）", "控制油液的流动方向", "吸收系统压力脉动和液压冲击", "短期大量供油（如执行元件快速运动时）", "", ""], "r": "ACD", "e": "蓄能器可储存能量，在系统保压时维持压力，能吸收系统压力脉动和液压冲击，也能在执行元件快速运动时短期大量供油，而控制油液流动方向是方向控制阀的作用。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528487", "t": 2, "q": "液压传动系统中，压力控制阀的类型包括下列哪些", "a": ["顺序阀", "溢流阀", "减压阀", "节流阀", "", ""], "r": "ABC", "e": "顺序阀、溢流阀、减压阀都属于压力控制阀，用于控制液压系统压力；节流阀是流量控制阀，用于控制流量。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528488", "t": 2, "q": "液压传动系统中，液压泵的分类依据包括下列哪些", "a": ["结构形式（如齿轮式、叶片式、柱塞式）", "排量是否可调（如定量泵、变量泵）", "工作原理（如容积式、叶片式）", "工作压力（如低压泵、中压泵、高压泵）", "", ""], "r": "ABD", "e": "液压泵分类依据有结构形式（如齿轮式等）、排量是否可调（定量泵和变量泵）、工作压力（低、中、高压泵）等。工作原理分容积式等，叶片式属于结构形式，C选项表述错误。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528489", "t": 2, "q": "液压传动系统中，液压泵的主要性能参数包括下列哪些", "a": ["流量", "压力", "排量", "转速", "", ""], "r": "ABC", "e": "液压泵主要性能参数有流量、压力、排量等。流量指单位时间输出油液体积；压力指泵出口压力；排量是泵每转一转排出油液体积。转速是影响泵性能的因素但非主要性能参数。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528490", "t": 2, "q": "液压传动系统中，液压冲击的产生原因包括下列哪些", "a": ["液压油粘度太大", "执行元件突然制动或启动", "系统压力过高", "阀门突然关闭或开启", "", ""], "r": "BD", "e": "执行元件突然制动或启动、阀门突然关闭或开启，会使液流速度突然变化，引发液压冲击。而液压油粘度大主要影响系统阻力等，系统压力高不一定会产生液压冲击。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528491", "t": 2, "q": "液压传动系统中，液压冲击的危害包括下列哪些", "a": ["产生瞬时高压，损坏液压元件（如阀门、密封件）", "导致执行元件动作不稳定（如冲击、窜动）", "降低液压油的粘度", "引起系统振动和噪声", "", ""], "r": "ABD", "e": "液压冲击会产生瞬时高压，易损坏元件，使执行元件动作不稳，还会引发系统振动和噪声；而液压冲击不会降低液压油粘度。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528492", "t": 2, "q": "液压传动系统中，液压阀的基本参数包括下列哪些", "a": ["阀芯行程", "阀口通流面积", "公称压力（额定工作压力）", "公称流量（额定工作流量）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528493", "t": 2, "q": "液压传动系统中，液压马达的主要性能参数包括下列哪些", "a": ["转矩", "排量", "转速", "流量", "", ""], "r": "ABC", "e": "液压马达主要性能参数有转矩、排量、转速。流量是液压泵输出或系统中流动的参数，并非液压马达主要性能参数。答案为ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528494", "t": 2, "q": "液压传动系统中，液压油的选择依据包括下列哪些", "a": ["系统的工作压力（压力高选高粘度油）", "液压元件的类型（如叶片泵选抗磨液压油）", "执行元件的运动速度（速度高选低粘度油）", "系统的工作温度（温度高选高粘度油）", "", ""], "r": "ABCD", "e": "液压油选择需综合多因素。压力高时为保证密封性和减少泄漏，选高粘度油；不同液压元件对油有不同要求，像叶片泵需抗磨液压油；执行元件运动速度高，选低粘度油可降低粘性阻力；工作温度高，油粘度会降低，所以选高粘度油。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528495", "t": 2, "q": "液压传动系统中，液压油的主要性能指标包括下列哪些", "a": ["硬度", "闪点", "粘度", "凝点", "", ""], "r": "BCD", "e": "硬度不是液压油主要性能指标。闪点反映油的易燃性；粘度影响液压系统工作性能；凝点体现油在低温下的流动性，它们都是液压油重要性能指标。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528496", "t": 2, "q": "液压传动系统中，液压油污染的主要来源包括下列哪些", "a": ["液压元件磨损产生的金属颗粒", "系统安装时残留的杂质（如铁屑、灰尘）", "空气和水分混入", "液压油自身的化学分解产物", "", ""], "r": "ABCD", "e": "ABCD选项都是液压油污染的常见来源，元件磨损会产生金属颗粒，安装残留杂质会混入油中，空气和水分进入、液压油自身化学分解都会造成污染。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810635975528497", "t": 2, "q": "液压传动系统中，溢流阀的主要作用包括下列哪些", "a": ["防止系统过载，起安全保护作用", "控制油液的流动方向", "定压溢流，维持系统压力稳定", "实现远程调压", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094336", "t": 3, "q": "机械装配中，调整件的作用是补偿其他零件的尺寸误差，调整件本身的尺寸精度要求不高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "调整件在机械装配里可补偿其他零件尺寸误差，其主要靠调整来保证装配精度，本身尺寸精度要求通常不高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094337", "t": 3, "q": "机械装配中，调整装配法与修配装配法的主要区别是调整法通过改变调整件的位置或尺寸补偿误差，修配法通过去除修配环的材料补偿误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "调整装配法是通过改变调整件的位置（如垫片厚度、楔块位置等）或更换不同尺寸的调整件来补偿累积误差；修配装配法是在装配时修去指定零件上预留的修配量来达到装配精度。题干表述准确。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094338", "t": 3, "q": "机械装配中，分组装配法的前提是零件的尺寸分布符合正态分布，且分组数等于零件的尺寸公差与装配间隙的比值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分组装配法前提是零件的加工误差分布应符合正态分布，但分组数是配合件公差范围与分组公差的比值，并非零件的尺寸公差与装配间隙的比值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094339", "t": 3, "q": "机械装配中，分组装配法的装配精度取决于零件的分组精度，与零件的加工精度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分组装配法虽将零件按尺寸分组，但分组是以零件加工精度为基础，装配精度既依赖分组精度，也与零件加工精度相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094340", "t": 3, "q": "机械装配中，分组装配法装配后的零件不能互换到其他组，只能在同一组内互换，因此分组装配法属于不完全互换法。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分组装配法是将零件按实际尺寸分组，装配时同组零件能互换，不同组不能互换，符合不完全互换法定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094341", "t": 3, "q": "机械装配中，互换装配法的核心是零件的加工精度满足尺寸链要求，装配时无需任何修配或调整即可保证装配精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "互换装配法就是让零件具有互换性，其关键在于零件加工精度要符合尺寸链要求，这样装配时不用修配或调整就能保证装配精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094342", "t": 3, "q": "机械装配中，接触精度是指两配合表面之间的贴合程度，通常用接触斑点的大小和分布来衡量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械装配里，接触精度确实是指两配合表面的贴合程度，并且一般就是通过接触斑点的大小和分布情况来衡量的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094343", "t": 3, "q": "机械装配中，静态装配精度是指装配后零件在静止状态下的精度，如配合间隙;动态装配精度是指装配后零件在运动状态下的精度，如运转噪声。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该描述准确界定了机械装配中静态装配精度和动态装配精度的概念及示例。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094344", "t": 3, "q": "机械装配中，完全互换法的装配效率低于修配装配法，因为完全互换法需要更高精度的零件加工。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。完全互换法装配时零件具有互换性，装配过程简单，能连续流水作业，装配效率高；而修配装配法需修配零件，装配工作复杂，装配效率低。所以题干中说完全互换法装配效率低于修配装配法是不对的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094345", "t": 3, "q": "机械装配中，完全互换法适用于装配精度要求高且组成零件数量多的部件装配。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "完全互换法对零件的加工精度要求高，在装配精度要求高且组成零件数量多的情况下，要使每个零件都满足互换要求，加工难度大、成本高，所以该方法一般适用于装配精度要求不高、组成零件数量少的场合。故该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094346", "t": 3, "q": "机械装配中，修配装配法的关键是选择合适的修配环，并预留足够的修配余量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "修配装配法是在装配时通过修整某一零件的尺寸来保证装配精度的方法，其要点就是选合适修配环并预留修配余量，所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094347", "t": 3, "q": "机械装配中，修配装配法的装配精度取决于修配环的修配精度，与其他组成零件的精度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "此说法错误。修配装配法虽通过修配修配环保证装配精度，但其他组成零件精度也会影响装配精度。若其他零件精度太差，会增加修配难度甚至难以达到装配精度要求，所以装配精度并非与其他组成零件精度无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094348", "t": 3, "q": "机械装配中，装配尺寸链的封闭环是装配后需要保证的装配精度要求，通常是唯一的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在机械装配里，装配尺寸链封闭环就是装配后要保证的装配精度要求，且一个装配尺寸链封闭环通常只有一个。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094349", "t": 3, "q": "机械装配中，装配尺寸链的组成环是指对封闭环有影响的所有零件尺寸，包括增环和减环。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "装配尺寸链中，组成环就是对封闭环有影响的所有零件尺寸，且分为增环和减环。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094350", "t": 3, "q": "机械装配中，装配工艺规程是指导装配生产的主要技术文件，其内容包括装配顺序、装配方法、检验要求、工艺装备等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "装配工艺规程确实是指导装配生产的主要技术文件，它涵盖装配顺序、方法、检验要求、工艺装备等内容，能规范和指导装配工作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094351", "t": 3, "q": "机械装配中，装配精度是指装配后零件或部件的实际几何参数与理想几何参数的符合程度，包括尺寸精度、位置精度和形状精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "机械装配里装配精度的确是指装配后零件或部件实际几何参数与理想几何参数的符合程度，涵盖尺寸精度、位置精度和形状精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094352", "t": 3, "q": "机械装配中，装配顺序的确定应遵循\"先外后内、先大后小、先易后难\"的原则，以提高装配效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机械装配顺序应遵循“先内后外、先小后大、先难后易”原则，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094353", "t": 3, "q": "数控编程中，程序段号（如N10、N20）的顺序必须按从小到大的顺序排列，否则程序无法执行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "程序段号顺序不影响程序执行，它主要用于程序编辑和调试时的识别与查找。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094354", "t": 3, "q": "数控编程中，刀具半径补偿的建立和取消只能在G00或G01指令下进行，不能在G02或G03指令下进行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数控编程里，刀具半径补偿建立和取消规定只能在G00（快速定位）或G01（直线插补）指令下操作，G02（顺时针圆弧插补）和G03（逆时针圆弧插补）指令不能用于此操作。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094355", "t": 3, "q": "数控编程中，刀具半径补偿取消指令（G40）必须在刀具远离工件后执行，避免刀具与工件发生碰撞。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "G40指令用于取消刀具半径补偿，在刀具远离工件后执行可防止补偿取消过程中刀具与工件碰撞。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094356", "t": 3, "q": "数控编程中，刀具长度补偿的作用是补偿刀具在Z轴方向的制造误差和磨损，使刀具实际位置与编程位置一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "刀具长度补偿主要就是用于补偿刀具在Z轴方向因制造差异、磨损等导致的长度变化，让刀具实际位置和编程位置相符。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094357", "t": 3, "q": "数控编程中，固定循环指令（如G81）包含了定位、工进、孔底动作、退刀等一系列动作，可简化重复钻孔的编程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "固定循环指令确实将定位、工进、孔底动作、退刀等一系列钻孔相关动作集成，能简化重复钻孔编程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094358", "t": 3, "q": "数控编程中，绝对坐标编程（G90）下，所有坐标值均以机床原点为基准进行计算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094359", "t": 3, "q": "数控编程中，绝对坐标编程与增量坐标编程可以在同一程序中混合使用，以简化复杂轮廓的编程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数控编程里，绝对坐标和增量坐标编程可根据需求在同一程序中配合使用，能有效简化复杂轮廓编程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094360", "t": 3, "q": "数控编程中，子程序调用指令（M98）必须与子程序结束指令（M99）配合使用，M99指令使程序返回到主程序的下一条指令。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数控编程里，M98用于调用子程序，M99作为子程序结束指令，执行M99会让程序返回主程序的下一条指令，二者需配合使用。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094361", "t": 3, "q": "数控编程中，子程序可以嵌套调用，即一个子程序中可以调用另一个子程序，嵌套层数由数控系统决定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数控编程里，子程序确实能够嵌套调用，且嵌套层数受数控系统限制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094362", "t": 3, "q": "数控编程中，G00指令的运动速度由F指令设定，可通过修改F值调整快速定位速度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "G00指令是快速定位指令，其运动速度是机床系统预先设定的，不由F指令设定，F指令用于设定进给速度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094363", "t": 3, "q": "数控编程中，G01指令是直线插补指令，其运动速度由F指令设定，且运动轨迹始终为直线。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "G01指令就是直线插补指令，它的运动速度由F指令确定，运动轨迹必然是直线。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094364", "t": 3, "q": "数控编程中，G02指令是顺时针圆弧插补，G03指令是逆时针圆弧插补，判断方向时需以从Z轴正方向看向XY平面为准。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094365", "t": 3, "q": "数控编程中，G41指令是刀具半径左补偿，沿刀具运动方向看，刀具位于工件轮廓的左侧;G42指令是右补偿，刀具位于轮廓右侧。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数控编程里，G41和G42的定义就是如此。G41是刀具半径左补偿，沿刀具运动方向刀具在工件轮廓左侧；G42是刀具半径右补偿，刀具在轮廓右侧。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094366", "t": 3, "q": "数控编程中，G54-G59指令可以设定6个不同的工件坐标系，适用于多工位加工或复杂零件的不同部位加工。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数控编程里，G54 - G59指令确实能设定6个不同的工件坐标系，方便多工位加工或者对复杂零件不同部位进行加工。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094367", "t": 3, "q": "数控编程中，G54指令设定的工件坐标系原点是机床坐标系中的固定点，一旦设定便无法修改。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "G54指令设定的工件坐标系原点虽在机床坐标系中有固定位置，但可通过操作重新设定修改。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094368", "t": 3, "q": "数控编程中，G98指令在固定循环结束后返回初始平面，初始平面是指距离工件表面较远、能避免碰撞的安全平面。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "G98 指令在固定循环结束后确实返回初始平面，初始平面就是距离工件表面较远、可避免碰撞的安全平面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094369", "t": 3, "q": "液压传动系统中，过滤器的过滤精度越高，对液压系统的保护效果越好，因此应优先选择最高精度的过滤器。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然过滤精度高对系统有保护作用，但过高精度会使过滤器阻力增大、成本增加，且可能影响系统正常工作，并非要优先选最高精度的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094370", "t": 3, "q": "液压传动系统中，换向阀的通径越大，允许通过的最大流量越大，适用的系统压力越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "换向阀通径越大，允许通过的最大流量越大，但通径与适用系统压力无直接关联，系统压力取决于泵等元件及系统设计。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094371", "t": 3, "q": "液压传动系统中，换向阀的中位机能决定了阀在中位时各油口的连通状态，影响系统的保压、卸荷和执行元件的锁定状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "换向阀中位机能就是指换向阀处于中位时各油口的连通方式，不同连通方式会对系统保压、卸荷及执行元件锁定等状态产生影响。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094372", "t": 3, "q": "液压传动系统中，流量控制阀的流量调节范围越大，其流量稳定性越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流量调节范围大并不意味着流量稳定性就好，二者没有必然的因果联系。流量稳定性受多种因素影响，如系统压力、油温等。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637326094373", "t": 3, "q": "液压传动系统中，流量控制阀通过改变阀口的通流面积来控制油液的压力，进而控制执行元件的运动速度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流量控制阀是通过改变阀口通流面积控制油液流量，从而控制执行元件运动速度，而非控制油液压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288640", "t": 3, "q": "液压传动系统中，气穴现象是由于液压油中混入过多空气，导致系统压力升高，产生噪声和振动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "气穴现象是因油液压力低于空气分离压时，油中溶解的空气分离出来形成气泡，而非混入过多空气，且气穴会使系统压力降低而非升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288641", "t": 3, "q": "液压传动系统中，顺序阀的工作原理是当系统压力达到调定值时开启，控制执行元件按预设顺序动作，其作用与溢流阀相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "顺序阀是在系统压力达到调定值时开启，控制执行元件按顺序动作；而溢流阀主要是使系统压力稳定在调定值，防止系统过载，二者作用不同。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288642", "t": 3, "q": "液压传动系统中，系统的工作压力越高，液压油的泄漏量越大，因此需采用高质量的密封件减少泄漏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在液压传动系统里，压力和泄漏量正相关，工作压力高时泄漏量大，采用高质量密封件可有效减少泄漏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288643", "t": 3, "q": "液压传动系统中，蓄能器的容积越大，储存的液压能越多，因此应选择容积尽可能大的蓄能器。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蓄能器容积选择需综合考虑系统需求等因素，并非越大越好，过大可能导致成本增加、响应变慢等问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288644", "t": 3, "q": "液压传动系统中，叶片泵的自吸能力比齿轮泵强，适合用于吸油高度较大的场合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "齿轮泵自吸能力比叶片泵强，更适合吸油高度较大场合。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288645", "t": 3, "q": "液压传动系统中，液控单向阀不仅能单向导通油液，还可通过控制油口控制其反向导通，实现油液的双向流动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "液控单向阀常态下单向导通油液，当控制油口有压力油输入时，可使反向导通，能实现油液双向流动。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288646", "t": 3, "q": "液压传动系统中，液压泵的工作压力取决于液压泵的额定压力，与负载无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "液压泵工作压力由负载决定，当负载变化时，泵工作压力随之改变，而额定压力是泵正常工作的最大允许压力。所以题干说工作压力取决于额定压力且与负载无关错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288647", "t": 3, "q": "液压传动系统中，液压马达的输出转矩与工作压力成正比，与排量成反比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "液压马达输出转矩公式为「test/yiwen_img/importSubject/2034810631315656704.png」 ，其中T是输出转矩，「test/yiwen_img/importSubject/2034810631542149120.png」是排量，「test/yiwen_img/importSubject/2034810631751864320.png」是工作压力差。由此可知输出转矩与工作压力成正比，与排量也是成正比，而非成反比。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288648", "t": 3, "q": "液压传动系统中，液压油的粘度随温度升高而降低，随压力升高而升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一般情况下，液压油粘度和温度呈负相关，温度升高粘度降低；和压力呈正相关，压力升高粘度升高。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288649", "t": 3, "q": "液压传动系统中，溢流阀既可作为溢流阀使用，也可作为安全阀和卸荷阀使用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "溢流阀在不同工况和设置下能实现不同功能，可作溢流阀保持系统压力恒定，系统过载时作安全阀保护，还能通过特定方式实现卸荷功能。", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288650", "t": 3, "q": "液压传动系统中，溢流阀在系统正常工作时处于常开状态，通过溢流维持系统压力稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "溢流阀在系统正常工作时是常闭的，当系统压力超过调定压力时才打开溢流。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810637330288651", "t": 3, "q": "液压传动系统中，柱塞泵相比叶片泵和齿轮泵，具有工作压力高、流量脉动小、效率高的优点，但结构复杂、成本高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "柱塞泵通过柱塞在缸体中往复运动改变密封容积实现吸油和压油，能承受较高压力，流量脉动小、效率高，但因结构精密复杂，所以成本也高。此描述与实际相符。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第7章 微机电系统工程（1）", "n": "基础练习题【含解析】 / 第7章 微机电系统工程（1）", "qs": [{"id": "2034810640446656512", "t": 1, "q": "某微测量任务需精确测量MEMS谐振器的固有频率，且要求测量过程不与谐振器直接接触，避免影响其振动特性，适合的测量技术是？", "a": ["电容式位移测量", "接触式探针测量", "电阻应变片测量", "激光多普勒振动测量", "", ""], "r": "D", "e": "题目要求不与谐振器直接接触来测量固有频率，A选项电容式位移测量通常需要靠近被测物体且可能影响其振动；B选项接触式探针测量直接接触会影响振动特性；C选项电阻应变片测量也需接触安装；D选项激光多普勒振动测量通过激光非接触测量，符合要求。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656513", "t": 1, "q": "微测量技术中，“电容式湿度测量”的原理是利用湿度变化导致下列哪个参数变化？", "a": ["电容极板间的距离", "电容极板的面积", "电容极板间的介电常数", "测量电路的电阻", "", ""], "r": "C", "e": "电容式湿度测量利用湿度改变使极板间介电常数变化，进而让电容值改变来测量湿度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656514", "t": 1, "q": "微测量技术中，“电容式微天平”用于测量MEMS器件表面吸附物质的质量，其测量原理是基于吸附物质质量变化导致下列哪个参数变化？", "a": ["微天平谐振频率的变化", "电容极板间的介电常数", "电容极板的面积", "电容极板间的距离", "", ""], "r": "A", "e": "电容式微天平测量吸附物质质量是利用吸附物质质量变化使微天平谐振频率改变。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656515", "t": 1, "q": "微测量技术中，“电容式位移测量”用于MEMS器件时，其测量灵敏度主要取决于？", "a": ["电容极板的面积", "电容极板间的初始间距", "环境温度", "测量电路的放大倍数", "", ""], "r": "B", "e": "电容式位移测量灵敏度与电容极板间初始间距密切相关，间距变化引起电容变化，初始间距对灵敏度影响大。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656516", "t": 1, "q": "微测量技术中，\"动态光散射技术\"用于测量MEMS器件中纳米颗粒的下列哪种参数？", "a": ["颗粒的化学组成", "颗粒的颜色", "颗粒的硬度", "颗粒的尺寸分布", "", ""], "r": "D", "e": "动态光散射技术主要是基于颗粒在液体中布朗运动与颗粒大小的关系来测量，能得到颗粒的尺寸分布。而化学组成、颜色、硬度不是动态光散射技术可测内容。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656517", "t": 1, "q": "微测量技术中，\"干涉显微镜\"用于测量MEMS器件的表面粗糙度，其测量依据是？", "a": ["样品表面的导电性能差异", "样品表面对光的吸收程度差异", "样品表面的颜色差异", "样品表面不同点反射光的干涉条纹差异", "", ""], "r": "D", "e": "干涉显微镜是利用光的干涉原理，通过分析样品表面不同点反射光形成的干涉条纹差异来测量表面粗糙度。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656518", "t": 1, "q": "微测量技术中，\"激光多普勒测速仪\"用于测量MEMS微流体器件中流体的速度，其测量原理基于？", "a": ["流体对激光的反射光频率变化（多普勒效应）", "流体的温度变化", "流体的电导率变化", "流体的压力变化", "", ""], "r": "A", "e": "激光多普勒测速仪是利用多普勒效应，即流体对激光的反射光频率会因流体运动而变化来测量速度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656519", "t": 1, "q": "微测量技术中，\"激光共聚焦显微镜\"用于观察MEMS器件的三维结构，其核心优势是？", "a": ["设备成本低于普通光学显微镜", "不需要光源", "只能观察表面二维图像", "可通过逐层扫描获得三维断层图像，分辨率高", "", ""], "r": "D", "e": "激光共聚焦显微镜可对样品进行逐层扫描从而获得三维断层图像，且分辨率高，这是其核心优势。A选项，它成本通常高于普通光学显微镜；B选项，它需要光源；C选项，它能获取三维图像。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656520", "t": 1, "q": "微测量技术中，\"激光三角测量法\"用于测量MEMS器件的位移时，测量范围主要取决于？", "a": ["激光发射器与探测器的夹角及安装距离", "激光的功率", "探测器（如CCD）的分辨率", "环境光照强度", "", ""], "r": "A", "e": "激光三角测量法测量MEMS器件位移时，测量范围主要和激光发射器与探测器的夹角及安装距离有关，它们决定了可测量的空间范围。而激光功率影响测量精度等、探测器分辨率影响测量精度和灵敏度、环境光照强度影响测量稳定性，但不是决定测量范围的主要因素。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656521", "t": 1, "q": "微测量技术中，\"拉曼光谱技术\"用于分析MEMS器件材料的下列哪种特性？", "a": ["材料的力学强度", "材料的电学导电性", "材料的化学组成和晶体结构", "材料的表面形貌", "", ""], "r": "C", "e": "拉曼光谱技术主要是通过对散射光的分析来获取分子振动和转动信息，可用于确定材料的化学组成和晶体结构。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656522", "t": 1, "q": "微测量技术中，\"纳米压痕技术\"主要用于测量MEMS器件材料的下列哪种力学性能？", "a": ["抗拉强度", "疲劳强度", "弹性模量和硬度", "断裂韧性", "", ""], "r": "C", "e": "纳米压痕技术是通过压头压入材料来测量，能直接得到材料的弹性模量和硬度。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656523", "t": 1, "q": "微测量技术中，\"扫描电子显微镜（SEM）\"观察MEMS器件时，若需获得更高的图像分辨率，应采取的措施是？", "a": ["减小样品的倾斜角度", "增大电子束的加速电压", "减小电子束的加速电压", "增大样品与探测器的距离", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656524", "t": 1, "q": "微测量技术中，\"扫描隧道显微镜（STM）\"与原子力显微镜（AFM）的主要区别是？", "a": ["STM测量范围大于AFM", "STM分辨率低于AFM", "STM需样品具有导电性，AFM无此要求", "STM只能观察表面形貌，AFM不能", "", ""], "r": "C", "e": "扫描隧道显微镜（STM）工作依赖量子隧道效应，要求样品有导电性；原子力显微镜（AFM）通过检测探针与样品间相互作用力成像，对样品导电性无要求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656525", "t": 1, "q": "微测量技术中，\"压痕硬度测试\"用于MEMS薄膜材料时，若压痕深度远小于薄膜厚度，测量结果反映的是？", "a": ["基底材料的硬度", "薄膜与基底的平均硬度", "无法测量硬度", "薄膜材料的硬度", "", ""], "r": "D", "e": "当压痕深度远小于薄膜厚度时，压痕主要作用在薄膜上，测量结果反映的就是薄膜材料的硬度。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656526", "t": 1, "q": "微测量技术中，\"原子力显微镜（AFM）\"的\"轻敲模式\"相比\"接触模式\"的主要优势是？", "a": ["测量速度更快", "对样品表面的损伤更小", "只能测量导电样品", "测量分辨率更低", "", ""], "r": "B", "e": "接触模式下探针与样品持续接触，易损伤样品，轻敲模式探针间歇接触样品，对样品表面损伤小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656527", "t": 1, "q": "微测量技术中，采用激光干涉仪测量MEMS微梁的挠度时，测量精度主要受限于？", "a": ["微梁的颜色", "激光的波长稳定性", "微梁的材料硬度", "测量环境的湿度", "", ""], "r": "B", "e": "激光干涉仪利用激光干涉原理进行测量，激光波长稳定性对测量精度影响极大，若波长不稳定会导致干涉条纹变化，影响测量结果准确性。而微梁颜色、材料硬度、测量环境湿度并非主要影响因素。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656528", "t": 1, "q": "微测量技术中，用于测量MEMS谐振器振动幅度时，若振动幅度在纳米级，适合的测量方法是？", "a": ["游标卡尺测量", "光学显微镜观察", "激光干涉测量", "肉眼观察", "", ""], "r": "C", "e": "纳米级振动幅度极小，游标卡尺精度低、肉眼无法看清，光学显微镜也难以精确测量纳米级尺度。而激光干涉测量灵敏度高，能精确测量纳米级的微小位移和振动幅度。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656529", "t": 1, "q": "微测量技术中，用于精确测量MEMS器件表面微观形貌，且测量分辨率可达纳米级甚至亚纳米级的技术是？", "a": ["千分尺测量", "扫描电子显微镜（SEM）测量", "原子力显微镜（AFM）测量", "光学显微镜测量", "", ""], "r": "C", "e": "千分尺测量精度一般为微米级；扫描电子显微镜测量分辨率通常为纳米级，但原子力显微镜分辨率可达纳米级甚至亚纳米级；光学显微镜测量精度有限。答案是能达更高精度的原子力显微镜测量。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656530", "t": 1, "q": "微测量技术中，用于校准MEMS压力传感器测量精度时，需要使用的标准设备是？", "a": ["标准温度计", "标准砝码", "标准位移台", "标准压力源", "", ""], "r": "D", "e": "校准MEMS压力传感器测量精度，需用能提供标准压力的设备。A选项标准温度计测温度；B选项标准砝码用于校准质量相关；C选项标准位移台用于校准位移；D选项标准压力源可提供标准压力来校准压力传感器。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656531", "t": 1, "q": "微机电系统的能量存储中，\"微型超级电容器\"用于为MEMS器件短期供电，其能量存储原理主要是？", "a": ["磁场能的存储", "电场能的存储（双电层电容或赝电容）", "机械能的存储（如弹簧）", "化学能的存储与转换（如电池）", "", ""], "r": "B", "e": "微机电系统中微型超级电容器靠电场能存储能量，原理是双电层电容或赝电容。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656532", "t": 1, "q": "微机电系统的能量供给方式中，\"无线供电\"技术用于为植入式MEMS器件供电时，最常用的能量传输方式是？", "a": ["电磁感应耦合", "可见光照射", "声波传输", "射频辐射", "", ""], "r": "A", "e": "电磁感应耦合是为植入式MEMS器件无线供电最常用的能量传输方式。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656533", "t": 1, "q": "微机电系统的驱动方式中，\"压电驱动\"的驱动力大小与下列哪个参数直接相关？", "a": ["环境温度", "施加的电压幅值", "驱动结构的质量", "驱动频率", "", ""], "r": "B", "e": "压电驱动是基于压电材料的压电效应，通过施加电压产生形变来实现驱动，驱动力大小直接与施加的电压幅值相关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656534", "t": 1, "q": "微机电系统的信号处理模块中，为减少MEMS传感器输出的噪声信号，通常采用的信号处理技术是？", "a": ["信号调制", "信号解调", "信号放大", "信号滤波", "", ""], "r": "D", "e": "滤波是去除噪声信号的常用手段，能减少MEMS传感器输出的噪声信号。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656535", "t": 1, "q": "微机电系统的信号传输中，为减少MEMS传感器输出信号在传输过程中的干扰，通常采用的传输方式是？", "a": ["无线射频传输", "可见光传输", "差分信号传输", "单端信号传输", "", ""], "r": "C", "e": "差分信号传输抗干扰能力强，能有效减少MEMS传感器输出信号在传输过程中的干扰。无线射频传输易受电磁干扰，可见光传输有环境限制，单端信号传输抗干扰能力弱。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656536", "t": 1, "q": "微机电系统工作原理中，\"静电驱动\"是常用的驱动方式，其驱动力的产生主要依赖于下列哪种物理现象？", "a": ["材料的热膨胀力", "电流产生的磁场力", "压电材料的逆压电效应", "电荷之间的静电力", "", ""], "r": "D", "e": "“静电驱动”，关键在“静电”，其驱动力是由电荷之间的静电力产生的。A选项热膨胀力与静电无关；B选项电流产生的磁场力不是静电范畴；C选项逆压电效应也和静电驱动原理不同。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656537", "t": 1, "q": "微机电系统中，\"静电梳齿驱动\"是常用的MEMS驱动结构，其驱动力的方向与梳齿的排列方向关系是？", "a": ["与梳齿厚度方向垂直", "与梳齿厚度方向平行", "与梳齿长度方向垂直", "与梳齿长度方向平行", "", ""], "r": "D", "e": "静电梳齿驱动的驱动力方向是使梳齿相互靠近或远离，是与梳齿长度方向平行的。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656538", "t": 1, "q": "微机电系统中，\"微泵\"作为流体输送器件，其工作原理不包括下列哪种方式？", "a": ["电磁驱动活塞运动", "静电驱动膜片振动", "压电驱动膜片振动", "重力驱动流体流动", "", ""], "r": "D", "e": "微泵工作靠外部能量驱动，重力驱动流体流动并非微泵工作原理，微泵一般通过电磁、静电、压电等驱动。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656539", "t": 1, "q": "微机电系统中，“微传感器”的“响应时间”是指从输入信号发生变化到输出信号达到稳定值的？", "a": ["平均时间", "最小时间", "最大时间", "规定百分比（如63%、90%）的时间", "", ""], "r": "D", "e": "微传感器响应时间是指输入信号变化到输出信号达到规定百分比（如63%、90%）的时间。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656540", "t": 1, "q": "微机电系统中，\"微传感器\"与\"传统宏观传感器\"的核心区别在于？", "a": ["测量原理不同", "输出信号类型不同", "尺寸微型化导致的结构、工艺及性能差异", "供电电压不同", "", ""], "r": "C", "e": "微机电系统的微传感器关键特点是尺寸微型化，这使得其在结构、工艺和性能上与传统宏观传感器有显著差异，这也是二者核心区别。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656541", "t": 1, "q": "微机电系统中，\"微阀\"用于控制流体通断，其关闭状态的密封性能主要取决于？", "a": ["阀门口的尺寸大小", "驱动电压的大小", "阀芯与阀座的贴合精度及密封材料特性", "流体的温度", "", ""], "r": "C", "e": "微阀关闭状态密封性能关键在于阀芯与阀座贴合紧密且密封材料能有效阻止流体，贴合精度和密封材料特性直接影响密封效果。而阀门口尺寸、驱动电压、流体温度并非主要决定因素。所以答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656542", "t": 1, "q": "微机电系统中，\"微机电\"的核心特征是\"微型化\"，通常其关键结构的尺寸范围处于下列哪个区间？", "a": ["纳米级以下（<1nm）", "微米级至纳米级（1nm-100μm）", "毫米级（1mm-10mm）", "厘米级（1cm-10cm）", "", ""], "r": "B", "e": "微机电系统关键结构尺寸一般在微米到纳米级别。纳米级以下范围太小，毫米级和厘米级不符合“微型化”特征。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656543", "t": 1, "q": "微机电系统中，\"微加速度传感器\"的敏感元件（质量块）在加速度作用下产生的位移大小与下列哪个参数成正比（忽略阻尼）？", "a": ["速度的变化率", "加速度的大小", "速度的大小", "加速度的变化率", "", ""], "r": "B", "e": "根据牛顿第二定律F = ma，在微加速度传感器中，敏感元件受加速度作用产生力，进而产生位移，位移与加速度大小相关，且在忽略阻尼等情况下，位移大小与加速度大小成正比。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656544", "t": 1, "q": "微机电系统中，\"微流体器件\"的\"流体阻力\"主要取决于下列哪个因素？", "a": ["器件的材料颜色", "流体的颜色", "流体的温度（与粘度无关时）", "流体的粘度、器件通道的尺寸（如直径、长度）", "", ""], "r": "D", "e": "流体阻力与流体自身性质及流动通道情况有关，流体粘度、器件通道尺寸会影响流体阻力。而材料颜色、流体颜色和与粘度无关的流体温度对流体阻力无直接影响。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656545", "t": 1, "q": "微机电系统中，\"微陀螺\"的测量精度受\"漂移误差\"影响，下列哪种因素会导致漂移误差增大？", "a": ["器件结构对称性提高", "测量电路噪声降低", "驱动电压幅值稳定", "环境温度剧烈变化", "", ""], "r": "D", "e": "环境温度剧烈变化会使微陀螺的材料特性、物理参数等发生改变，从而导致漂移误差增大。而器件结构对称性提高、测量电路噪声降低、驱动电压幅值稳定都有利于提高测量精度，减少误差。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656546", "t": 1, "q": "微机电系统中，\"微谐振器\"的\"品质因数（Q值）\"用于描述其振动能量的损耗程度，Q值越高表示？", "a": ["谐振频率越低", "谐振频率越高", "振动能量损耗越快，谐振峰越宽", "振动能量损耗越慢，谐振峰越尖锐", "", ""], "r": "D", "e": "品质因数Q值越高，说明振动能量损耗越慢，此时谐振峰越尖锐。A、B选项中Q值与谐振频率无此直接关系；C选项说能量损耗越快、谐振峰越宽是Q值低的情况。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656547", "t": 1, "q": "微机电系统中，\"微谐振器\"的谐振频率主要由下列哪个因素决定？", "a": ["驱动电压的幅值", "谐振器的结构参数（如尺寸、材料密度、弹性模量）", "检测电路的放大倍数", "环境湿度", "", ""], "r": "B", "e": "微谐振器的谐振频率主要取决于其自身物理特性，结构参数（如尺寸、材料密度、弹性模量）决定了其固有振动特性，从而决定谐振频率。而驱动电压幅值、检测电路放大倍数、环境湿度并非决定谐振频率的主要因素。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656548", "t": 1, "q": "微机电系统中，\"微执行器\"的\"位移分辨率\"是指？", "a": ["执行器能实现的最大位移量", "执行器在额定电压下的位移速度", "执行器位移随驱动电压变化的线性程度", "执行器能实现的最小位移增量", "", ""], "r": "D", "e": "位移分辨率强调的是能实现的最小位移变化量。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656549", "t": 1, "q": "微机电系统中，微陀螺仪用于测量角速度，其工作原理主要基于下列哪种物理效应？", "a": ["压电效应", "多普勒效应", "光电效应", "科里奥利效应", "", ""], "r": "D", "e": "微陀螺仪利用科里奥利效应测量角速度，科里奥利力与角速度相关。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656550", "t": 1, "q": "微纳制造的干法蚀刻工艺中，反应离子蚀刻（RIE）的蚀刻速率主要取决于下列哪个因素？", "a": ["基底材料的导热系数", "显影液的浓度", "光刻胶的厚度", "蚀刻气体的种类和流量", "", ""], "r": "D", "e": "反应离子蚀刻（RIE）是利用等离子体中的活性粒子与材料表面发生化学反应来实现蚀刻，蚀刻气体的种类和流量会直接影响反应的进行和蚀刻速率。而基底材料导热系数、显影液浓度、光刻胶厚度与RIE蚀刻速率并无直接关联。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656551", "t": 1, "q": "微纳制造中，“薄膜沉积”工艺后通常需要进行“退火处理”，其主要目的是？", "a": ["降低薄膜的内应力，改善结晶度", "增加薄膜厚度", "提高薄膜的导电性（无论材料类型）", "去除基底表面的光刻胶", "", ""], "r": "A", "e": "退火处理可通过加热等方式使材料内部原子重新排列，能降低薄膜内应力、改善结晶度。增加薄膜厚度靠沉积工艺；不是所有材料退火都能提高导电性；去除光刻胶有专门去胶工艺。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656552", "t": 1, "q": "微纳制造中，\"等离子体增强化学气相沉积（PECVD）\"相比传统CVD的主要优势是？", "a": ["可在更低的温度下制备薄膜", "薄膜沉积速率更慢", "薄膜的纯度更高", "需要更高的反应压力", "", ""], "r": "A", "e": "PECVD利用等离子体能量，能降低反应所需的温度来制备薄膜，这是其相对传统CVD的主要优势。B选项沉积速率慢不是优势；C选项纯度并非PECVD主要突出优势；D选项通常不需要更高反应压力。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656553", "t": 1, "q": "微纳制造中，\"电子束光刻\"工艺相比\"紫外光刻\"工艺，最显著的优势是？", "a": ["适用基底材料范围更广", "图案分辨率更高（可达纳米级）", "光刻速率更快", "工艺成本更低", "", ""], "r": "B", "e": "电子束光刻能聚焦到极小尺寸，可实现纳米级图案分辨率，这是紫外光刻难以达到的显著优势。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656554", "t": 1, "q": "微纳制造中，\"电子束蒸发沉积\"相比\"电阻加热蒸发沉积\"的优势是？", "a": ["沉积速率更快", "设备成本更低", "可蒸发高熔点金属（如钨、钼）", "薄膜纯度更低", "", ""], "r": "C", "e": "电子束能量集中能产生高温，可用于蒸发高熔点金属，而电阻加热蒸发沉积难以达到蒸发高熔点金属所需温度。一般电子束蒸发沉积速率不是更快、设备成本高、薄膜纯度高。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656555", "t": 1, "q": "微纳制造中，\"干法灰化\"工艺的主要作用是？", "a": ["沉积绝缘薄膜", "去除光刻工艺后残留的光刻胶", "蚀刻基底材料，形成微沟槽", "在基底表面形成氧化层", "", ""], "r": "B", "e": "干法灰化是利用等离子体等方法去除光刻后残留光刻胶的工艺。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656556", "t": 1, "q": "微纳制造中，“干法蚀刻”工艺中若需提高蚀刻的选择性（即只蚀刻目标材料，不蚀刻光刻胶或其他材料），可采取的主要措施是？", "a": ["提高蚀刻功率", "降低蚀刻腔室的压力", "增加蚀刻气体的流量", "选择与目标材料反应活性高、与其他材料反应活性低的蚀刻气体", "", ""], "r": "D", "e": "要提高蚀刻选择性，关键在于让蚀刻剂对目标材料和其他材料有不同反应活性。选对蚀刻气体，使其与目标材料反应活性高、与其他材料反应活性低，就能只蚀刻目标材料。而提高蚀刻功率、降低蚀刻腔室压力、增加蚀刻气体流量，都不能直接体现选择性。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656557", "t": 1, "q": "微纳制造中，\"光刻胶\"的主要作用是？", "a": ["提高基底材料的导电性", "增强基底与薄膜的结合力", "作为掩膜，保护基底上不需要蚀刻的区域", "作为MEMS器件的结构材料", "", ""], "r": "C", "e": "光刻胶在光刻工艺里，能在基底上形成特定图案，保护不需要蚀刻的区域。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656558", "t": 1, "q": "微纳制造中，\"化学机械抛光（CMP）\"工艺的主要目的是？", "a": ["蚀刻基底材料，减小厚度", "去除基底表面的划痕和凹凸不平，实现全局平坦化", "在基底表面沉积金属薄膜", "在基底表面形成微结构", "", ""], "r": "B", "e": "CMP是化学作用和机械作用相结合的一种表面全局平坦化技术，主要就是去除基底表面的划痕和凹凸不平以实现全局平坦化。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656559", "t": 1, "q": "微纳制造中，\"溅射沉积\"工艺制备金属薄膜时，靶材原子脱离靶材表面的主要原因是？", "a": ["高能离子轰击靶材，产生动量转移使原子脱离", "靶材被加热至熔融状态，原子蒸发", "靶材与气体发生化学反应，生成易挥发物质", "靶材在高压下发生塑性形变，原子溢出", "", ""], "r": "A", "e": "溅射沉积是利用高能离子轰击靶材，通过动量转移使靶材原子脱离表面。B选项加热熔融蒸发是蒸发镀膜原理；C选项化学反应生成易挥发物不是溅射沉积原理；D选项高压塑性形变原子溢出也不符合溅射沉积。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656560", "t": 1, "q": "微纳制造中，\"溅射沉积\"工艺中，若需制备多层不同金属的薄膜，最关键的操作是？", "a": ["增加溅射功率", "增大腔室压力", "提高沉积温度", "每次沉积后更换靶材，并确保前层薄膜表面清洁", "", ""], "r": "D", "e": "制备多层不同金属薄膜，关键在于每次沉积不同金属时更换对应靶材，且要保证前层薄膜表面干净，不然会影响后续薄膜质量。而增加溅射功率、增大腔室压力、提高沉积温度并非制备多层不同金属薄膜的最关键操作。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034810640446656561", "t": 1, "q": "微纳制造中，\"金属化工艺\"用于在MEMS器件表面制备金属电极，最常用的金属材料是？", "a": ["铜（Cu）", "铝（Al）", "金（Au）", "银（Ag）", "", ""], "r": "C", "e": "在微纳制造中的MEMS（微机电系统）器件表面制备金属电极时，金（Au）具有化学稳定性好、导电性强、与硅等材料兼容性好等诸多优点，相比之下在这类应用中更为常用。铜（Cu）容易氧化；铝（Al）也存在一些诸如易腐蚀等问题；银（Ag）成本较高且稳定性不是最理想的。正确答案：C。", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624320", "t": 2, "q": "微测量技术中，电容式测量方法的测量精度受环境因素影响，下列因素会导致电容式测量精度下降的有？", "a": ["环境湿度变化（影响介电常数）", "环境电磁干扰（影响测量电路）", "环境光照强度（与电容无关）", "环境温度变化（影响介电常数）", "", ""], "r": "ABD", "e": "电容式测量精度与介电常数、测量电路有关，环境湿度和温度变化会影响介电常数，环境电磁干扰会影响测量电路，而光照强度与电容无关不影响测量精度。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624321", "t": 2, "q": "微测量技术中，电容式测量方法具有灵敏度高、非接触等优势，其可用于测量的MEMS器件参数有？", "a": ["湿度", "位移", "温度", "加速度", "", ""], "r": "BD", "e": "电容式测量通过检测电容变化来测量，位移、加速度变化会使电容改变，可利用电容式测量。湿度、温度一般不是电容式测量MEMS器件常用参数。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624322", "t": 2, "q": "微测量技术中，非接触式测量方法可避免对MEMS器件的结构损伤，下列属于非接触式微测量方法的有？", "a": ["原子力显微镜接触模式测量", "激光干涉测量", "电容式位移测量", "扫描电子显微镜观察", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624323", "t": 2, "q": "微测量技术中，激光测量技术因精度高、非接触等特点，广泛应用于MEMS检测，下列属于激光测量技术的有？", "a": ["激光干涉测量", "激光三角测量", "原子力显微镜测量", "激光多普勒测速", "", ""], "r": "ABD", "e": "激光干涉测量、激光三角测量、激光多普勒测速都利用激光特性进行测量，属于激光测量技术；原子力显微镜测量是通过检测探针与样品间的相互作用力来成像和测量，并非激光测量技术。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624324", "t": 2, "q": "微测量技术中，激光干涉测量的精度受环境因素影响，下列因素会导致激光干涉测量精度下降的有？", "a": ["环境声音强度", "振动干扰（导致光路偏移）", "环境空气折射率变化（影响光程）", "温度变化（影响激光波长）", "", ""], "r": "BCD", "e": "激光干涉测量精度易受影响光程、光路、激光波长等因素干扰。B项振动使光路偏移、C项空气折射率变化影响光程、D项温度变化影响激光波长，都会导致精度下降；而环境声音强度对激光干涉测量精度无直接影响。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624325", "t": 2, "q": "微测量技术中，激光干涉仪的测量范围受设备参数影响，下列因素会扩大激光干涉仪测量范围的有？", "a": ["增加激光波长", "增加激光功率", "提高探测器的位移检测范围", "延长测量光路", "", ""], "r": "CD", "e": "激光波长、功率与测量范围无直接关联；探测器位移检测范围大，能检测更大位移从而扩大测量范围；延长测量光路可让激光传播距离增加，测量范围也会扩大。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624326", "t": 2, "q": "微测量技术中，激光三角测量法的测量精度受多个参数影响，下列因素会提高激光三角测量精度的有？", "a": ["减小激光发射器与探测器的夹角", "提高探测器的分辨率", "提高激光发射器的功率", "优化光学系统", "", ""], "r": "BD", "e": "提高探测器分辨率可更精准捕捉信号，优化光学系统能减少光学误差，二者都利于提高测量精度；减小激光发射器与探测器夹角会降低精度；激光发射器功率与测量精度无直接关联。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624327", "t": 2, "q": "微测量技术中，可用于测量MEMS器件表面微观形貌的技术有？", "a": ["扫描电子显微镜（SEM）", "千分尺", "激光干涉仪", "原子力显微镜（AFM）", "", ""], "r": "AD", "e": "微测量技术中用于测量MEMS器件表面微观形貌的主要是高分辨率的显微技术。A选项：扫描电子显微镜（SEM）具有较高的分辨率，能够观察微小物体的形貌，可用于测量MEMS器件表面微观形貌。C选项：激光干涉仪主要用于测量位移、角度等，对于MEMS器件表面微观形貌的测量不太适用。D选项：原子力显微镜（AFM）能够实现对样品表面形貌的高分辨率成像，非常适合测量MEMS器件的微观形貌。B选项：千分尺的测量精度和范围不适合测量微观形貌。所以，正确答案是AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624328", "t": 2, "q": "微测量技术中，扫描电子显微镜（SEM）的成像质量受操作参数影响，下列属于SEM关键操作参数的有？", "a": ["样品倾斜角度（影响观察视角）", "工作距离（影响景深和分辨率）", "样品的导电性", "加速电压（影响分辨率和信号强度）", "", ""], "r": "ABD", "e": "SEM关键操作参数是能直接影响成像质量的操作设置。A选项样品倾斜角度可改变观察视角从而影响成像；B选项工作距离直接影响景深和分辨率；D选项加速电压影响分辨率和信号强度，这些都是可操作且影响成像的参数。而C选项样品导电性是样品自身性质，并非操作参数。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624329", "t": 2, "q": "微测量技术中，扫描隧道显微镜（STM）的工作条件需严格控制，下列属于STM工作关键条件的有？", "a": ["样品表面清洁（避免杂质影响隧道电流）", "高真空环境（减少空气分子干扰）", "适当的针尖-样品间距（确保隧道电流稳定）", "样品具有导电性（形成隧道电流）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624330", "t": 2, "q": "微测量技术中，用于测量MEMS器件表面粗糙度的参数有？", "a": ["算术平均偏差（Ra，表面轮廓的算术平均值）", "轮廓长度（与粗糙度无关）", "均方根偏差（Rq，表面轮廓的均方根值）", "最大轮廓高度（Ry，表面轮廓的最大峰值与谷值之差）", "", ""], "r": "ACD", "e": "测量MEMS器件表面粗糙度常用算术平均偏差、均方根偏差、最大轮廓高度等参数，而轮廓长度与粗糙度无关。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624331", "t": 2, "q": "微测量技术中，用于测量MEMS器件介电常数的方法有？", "a": ["微波谐振法（通过谐振频率变化计算）", "电容法（通过测量电容计算介电常数）", "红外光谱法（分析分子振动）", "拉曼光谱法（分析晶体结构）", "", ""], "r": "AB", "e": "测量MEMS器件介电常数，微波谐振法可利用谐振频率变化计算，电容法能通过测量电容来计算，而红外光谱法主要分析分子振动，拉曼光谱法主要分析晶体结构，它们并非用于测量介电常数。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624332", "t": 2, "q": "微测量技术中，用于测量MEMS器件力学性能的技术有？", "a": ["纳米压痕技术（测量硬度、弹性模量）", "微拉伸试验（测量抗拉强度、断裂伸长率）", "动态刚度测试（测量动态载荷下的刚度）", "拉曼光谱技术（分析晶体结构）", "", ""], "r": "ABC", "e": "A、B、C选项都是直接用于测量MEMS器件力学性能的技术，纳米压痕测硬度等力学指标，微拉伸试验测抗拉等力学性能，动态刚度测试测动态载荷下刚度；而D选项拉曼光谱技术主要用于分析晶体结构，并非测量力学性能。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624333", "t": 2, "q": "微测量技术中，用于测量MEMS器件温度的方法有？", "a": ["红外热成像（非接触式温度测量）", "热敏电阻测量（基于电阻温度特性）", "热电偶测量（基于热电效应）", "电容式测量（基于电容变化）", "", ""], "r": "ABC", "e": "红外热成像、热敏电阻测量、热电偶测量都可用于测量温度，电容式测量主要基于电容变化来测量其他物理量而非温度。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624334", "t": 2, "q": "微测量技术中，用于测量MEMS器件振动参数的技术有？", "a": ["拉曼光谱测量（分析晶体结构）", "电阻应变片测量（测量振动应变）", "激光多普勒振动测量（测量振动频率、幅值）", "电容式振动测量（测量振动位移）", "", ""], "r": "BCD", "e": "A选项拉曼光谱主要用于分析晶体结构，并非测量MEMS器件振动参数；B、C、D选项分别可通过测量振动应变、频率幅值、位移来测量MEMS器件振动参数。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624335", "t": 2, "q": "微测量技术中，用于测量MEMS谐振器频率特性的技术有？", "a": ["拉曼光谱测量（分析晶体结构）", "激光多普勒振动测量（检测振动频率）", "电阻应变片测量（检测应变变化）", "电容耦合测量（通过电容变化检测频率）", "", ""], "r": "BD", "e": "本题是要找出可用于测量MEMS谐振器频率特性的技术。A选项拉曼光谱测量主要用于分析晶体结构，并非测量频率特性。B选项激光多普勒振动测量可检测物体的振动频率，能用于测量MEMS谐振器的频率特性。C选项电阻应变片测量主要是检测应变变化，和频率特性测量无关。D选项电容耦合测量可通过电容变化检测频率，可用于MEMS谐振器频率特性测量。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624336", "t": 2, "q": "微测量技术中，用于校准MEMS传感器精度的标准设备需满足高精度要求，下列属于MEMS传感器校准用标准设备的有？", "a": ["标准温度计（校准温度传感器）", "高精度激光干涉仪（校准位移传感器）", "标准加速度源（校准加速度传感器）", "标准压力源（校准压力传感器）", "", ""], "r": "ABCD", "e": "校准设备功能定位<br />MEMS传感器校准的核心在于建立可溯源的物理量基准。<br />标准设备需提供已知、稳定且高精度的激励信号，以比对传感器的输出响应。<br />选项 A<br />标准温度计作为温度基准，可提供精确的温度场。<br />通过与MEMS温度传感器的读数进行比对，实现温度特性的标定与误差修正。<br />选项 B<br />高精度激光干涉仪基于光的干涉原理，可测量纳米级位移。<br />其测量精度远超MEMS位移传感器，是位移标定的理想基准设备。<br />选项 C<br />标准加速度源（如校准振动台）可产生精确频率与幅值的加速度场。<br />通过施加已知加速度，验证MEMS加速度计的灵敏度与线性度。<br />选项 D<br />标准压力源能提供稳定且可调的压力环境。<br />通过与MEMS压力传感器的输出进行比对，完成压力灵敏度的校准。", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624337", "t": 2, "q": "微测量技术中，原子力显微镜（AFM）的工作模式多样，下列属于AFM常见工作模式的有？", "a": ["扫描隧道模式（STM模式）", "轻敲模式（探针间歇性接触样品）", "接触模式（探针持续接触样品）", "非接触模式（探针不接触样品）", "", ""], "r": "BCD", "e": "原子力显微镜常见工作模式有轻敲模式、接触模式、非接触模式，而扫描隧道模式是扫描隧道显微镜的工作模式，并非AFM的。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624338", "t": 2, "q": "微测量技术中，原子力显微镜（AFM）的轻敲模式相比接触模式具有的优势有？", "a": ["可测量软质样品（避免压伤）", "对样品表面损伤小（间歇性接触）", "可测量非导电样品", "测量速度快", "", ""], "r": "AB", "e": "轻敲模式下探针间歇性接触样品表面，能避免对软质样品压伤且对表面损伤小；接触模式也可测非导电样品；轻敲模式因间歇性动作测量速度慢。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624339", "t": 2, "q": "微测量技术中，原子力显微镜（AFM）的探针特性影响测量精度，下列属于AFM探针关键特性的有？", "a": ["探针针尖半径（影响分辨率）", "探针长度（影响扫描范围）", "探针弹性系数（影响力灵敏度）", "探针颜色", "", ""], "r": "AC", "e": "这是一道关于原子力显微镜（AFM）探针特性的选择题。在微测量技术中，AFM的探针特性对测量精度有着至关重要的影响。我们需要从提供的选项中识别出哪些特性是影响AFM测量精度的关键因素。首先，我们分析每个选项：A. 探针针尖半径：针尖半径直接影响到AFM的分辨率，即能够检测到的最小尺寸或结构变化。针尖越尖锐，分辨率越高，因此这是影响测量精度的关键特性。B. 探针长度：虽然探针长度在一定程度上可能影响扫描范围，但它并不直接影响测量精度。探针的主要功能是探测样品表面的形貌和性质，其长度更多地与操作的灵活性和可达性相关。C. 探针弹性系数：弹性系数决定了探针在受到外力时的变形程度，从而影响到测量的灵敏度和准确性。一个合适的弹性系数能够确保探针在扫描过程中既不会过于敏感也不会过于迟钝，是确保测量精度的关键因素。D. 探针颜色：探针的颜色与其测量精度无关。颜色可能是由探针的材料或涂层决定的，但它不直接影响AFM的测量性能。综上所述，影响AFM探针测量精度的关键特性包括探针针尖半径（A）和探针弹性系数（C）。这两个特性直接决定了探针的分辨率和灵敏度，从而影响整体的测量精度。所以，正确答案是AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624340", "t": 2, "q": "微机电系统（MEMS）的工作原理涉及能量转换、信号感知与处理等多个环节，下列属于MEMS核心功能模块的有？", "a": ["信号处理电路", "微传感器", "宏观外壳结构", "微执行器", "", ""], "r": "BD", "e": "MEMS（微机电系统）是一种集微型传感器、执行器以及信号处理和控制电路于一体的微型系统。其核心功能模块主要包括微传感器和微执行器，以及用于处理信号的电路。A选项提到的“信号处理电路”虽然重要，但它更多是辅助微传感器和微执行器工作的，并不属于核心功能模块。C选项的“宏观外壳结构”则是MEMS的外部封装，也不是其核心功能模块。B选项“微传感器”和D选项“微执行器”是MEMS的核心组成部分，它们分别负责感知外界信号和执行相应动作。因此，属于MEMS核心功能模块的有微传感器和微执行器。所以，正确答案是BD。", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624341", "t": 2, "q": "微机电系统的能量供给方式中，适合微型化MEMS器件的能量收集技术有哪些？", "a": ["振动能量收集（基于压电或电磁效应）", "太阳能收集（基于光伏效应）", "热能收集（基于热电效应）", "大型风力发电收集", "", ""], "r": "ABC", "e": "A、B、C选项的能量收集方式基于相应效应，可实现微型化，适合MEMS器件；D选项大型风力发电收集设备规模大，不适合微型化MEMS器件。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624342", "t": 2, "q": "微机电系统的信号处理模块需对传感器输出的微弱信号进行处理，下列属于信号处理模块核心功能的有？", "a": ["信号解调（恢复原始信号）", "信号滤波（去除噪声）", "信号放大（增强微弱信号）", "信号调制（便于传输）", "", ""], "r": "ABC", "e": "微机电系统信号处理模块针对传感器输出的微弱信号，要恢复原始信号、去除噪声、增强信号强度，而信号调制主要是在传输前进行，并非处理微弱信号的核心功能。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624343", "t": 2, "q": "微机电系统中，静电驱动方式具有结构简单、功耗低等优势，下列属于静电驱动的MEMS器件结构有？", "a": ["电磁线圈驱动器", "压电悬臂梁驱动器", "平行板电容器驱动器", "静电梳齿驱动器", "", ""], "r": "CD", "e": "静电驱动靠静电力工作，平行板电容器和静电梳齿驱动器是典型静电驱动结构。电磁线圈驱动器基于电磁力，压电悬臂梁驱动器基于压电效应。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624344", "t": 2, "q": "微机电系统中，微泵作为核心微流体器件，其性能指标包括多个方面，下列属于微泵关键性能指标的有？", "a": ["流量（单位时间输送流体体积）", "功耗（工作时的能量消耗）", "扬程（输送流体的最大高度/压力）", "流体颜色（与性能无关）", "", ""], "r": "ABC", "e": "微泵关键性能主要看其输送流体的能力及能耗等，流量体现输送流体效率，功耗关乎运行成本，扬程反映输送压力能力，而流体颜色和微泵本身性能无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624345", "t": 2, "q": "微机电系统中，微传感器的交叉灵敏度是指其对非目标输入的响应程度，下列措施可降低微传感器交叉灵敏度的有？", "a": ["优化敏感结构设计（仅对目标输入敏感）", "提高传感器供电电压（增加信号幅值）", "采用补偿电路（抵消非目标输入的影响）", "选择特异性敏感材料（仅与目标输入反应）", "", ""], "r": "ACD", "e": "降低交叉灵敏度就是要减少对非目标输入的响应。A优化敏感结构仅对目标输入敏感、C采用补偿电路抵消非目标输入影响、D选择特异性敏感材料仅与目标输入反应，都可降低对非目标输入响应；B提高供电电压增加信号幅值与降低对非目标输入响应无关。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624346", "t": 2, "q": "微机电系统中，微传感器的信号调理电路用于优化输出信号，下列属于信号调理电路功能的有？", "a": ["信号放大（增强微弱信号）", "温度补偿（抵消温度对输出的影响）", "信号滤波（去除噪声）", "无线传输（将信号发送至接收端）", "", ""], "r": "ABC", "e": "信号调理电路主要是对传感器输出的信号进行处理以优化信号，A信号放大、B温度补偿、C信号滤波都可改善信号质量。而D无线传输是信号传输方式，并非信号调理功能。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624347", "t": 2, "q": "微机电系统中，微传感器的性能指标直接决定其应用场景，下列属于微传感器关键性能指标的有？", "a": ["分辨率（最小可测输入变化）", "线性度（输出与输入的线性关系）", "驱动电压（执行器的参数）", "灵敏度（输出变化/输入变化）", "", ""], "r": "ABD", "e": "微传感器关键性能指标主要衡量其对输入信号的检测能力和特性。分辨率体现检测最小变化的能力，线性度反映输出输入关系，灵敏度体现输入输出变化比例，均是关键指标；而驱动电压是执行器参数，并非微传感器关键性能指标。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624348", "t": 2, "q": "微机电系统中，微结构的材料选择需考虑多方面因素，下列属于MEMS微结构常用材料选择依据的有？", "a": ["力学性能（如弹性模量、强度）", "材料的市场价格（与性能无关）", "电学性能（如导电性、介电常数）", "加工性能（如易蚀刻、易沉积）", "", ""], "r": "ACD", "e": "MEMS微结构材料选择要综合考虑其应用场景所需性能及加工可行性等。力学性能影响结构稳定性，电学性能关乎其电功能实现，加工性能便于制造，而市场价格若与性能无关并非关键选择依据。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624349", "t": 2, "q": "微机电系统中，微结构的设计需考虑制造工艺的兼容性，下列属于MEMS微结构设计需考虑的工艺兼容性因素的有？", "a": ["结构材料与沉积工艺适配", "结构尺寸与光刻分辨率匹配", "结构颜色与检测工艺适配", "结构深度与蚀刻工艺能力匹配", "", ""], "r": "ABD", "e": "MEMS微结构设计考虑工艺兼容性，要关注材料、尺寸、深度等与制造工艺适配。A中材料与沉积工艺适配、B中尺寸与光刻分辨率匹配、D中深度与蚀刻工艺能力匹配都合理；而结构颜色对微结构制造工艺兼容性影响不大。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624350", "t": 2, "q": "微机电系统中，微流体器件的混合效率受结构设计影响，下列结构设计可提高微流体混合效率的有？", "a": ["采用蜿蜒通道（增加流体扰动）", "设置交错通道（增加流体接触面积）", "采用直通道（混合效率低）", "集成微凸起（产生涡流）", "", ""], "r": "ABD", "e": "提高微流体混合效率可通过增加流体扰动、接触面积、产生涡流等方式。A蜿蜒通道能增加流体扰动；B交错通道可增加接触面积；D微凸起会产生涡流，都有助于提高混合效率，而C直通道不利于混合，混合效率低。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624351", "t": 2, "q": "微机电系统中，微流体器件的流阻影响流体输送效率，下列因素会导致微流体器件流阻增大的有？", "a": ["微通道长度增加", "流体粘度增大", "微通道直径减小", "流体温度升高（粘度降低）", "", ""], "r": "ABC", "e": "流阻与微通道长度成正比，与流体粘度成正比，与微通道直径的四次方成反比。A选项微通道长度增加会使流阻增大；B选项流体粘度增大也会使流阻增大；C选项微通道直径减小会导致流阻增大；D选项流体温度升高粘度降低，流阻会减小。所以导致流阻增大的是ABC。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624352", "t": 2, "q": "微机电系统中，微流体器件用于操控微量流体，下列属于微流体器件核心功能的有？", "a": ["流体混合（如微混合器）", "流体分离（如微分离器）", "流体输送（如微泵）", "流体温度控制（如微型加热器）", "", ""], "r": "ABC", "e": "微流体器件核心功能围绕对微量流体的操控，包括混合、分离、输送等基本操作。温度控制是辅助功能。ABC选项均为直接操控流体的核心操作。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624353", "t": 2, "q": "微机电系统中，微陀螺的零漂误差来源包括多个方面，下列属于微陀螺零漂误差来源的有？", "a": ["输入角速度变化（零漂是零输入时的误差）", "制造工艺误差（结构不对称）", "电路噪声（检测电路的噪声）", "温度漂移（材料性能随温度变化）", "", ""], "r": "BCD", "e": "零漂是零输入时的误差，输入角速度变化不是零漂误差来源；制造工艺误差、电路噪声、温度漂移都会造成微陀螺零输入时的误差。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624354", "t": 2, "q": "微机电系统中，微陀螺的性能指标决定其应用精度，下列属于微陀螺关键性能指标的有？", "a": ["零漂（零输入时的输出漂移）", "驱动电压（执行器参数）", "灵敏度（输出变化/角速度变化）", "带宽（正常响应的角速度频率范围）", "", ""], "r": "ACD", "e": "零漂影响微陀螺在零输入时的准确性，灵敏度体现其对角速度变化的响应能力，带宽决定了正常响应的频率范围，这些都直接关系到微陀螺应用精度；而驱动电压是执行器参数，并非直接衡量微陀螺性能的关键指标。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624355", "t": 2, "q": "微机电系统中，微谐振器的品质因数（Q值）受多种因素影响，下列因素会导致Q值降低的有？", "a": ["支撑结构的能量传递（能量流失）", "空气阻尼（能量损耗增加）", "材料内耗（能量转化为热能）", "真空环境（减少空气阻尼）", "", ""], "r": "ABC", "e": "品质因数Q值衡量谐振器性能，能量损耗会使Q值降低。A支撑结构能量传递、B空气阻尼、C材料内耗都会造成能量损耗；而D真空环境减少空气阻尼，降低能量损耗，会使Q值升高。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624356", "t": 2, "q": "微机电系统中，微执行器的功耗是重要性能指标，下列措施可降低微执行器功耗的有？", "a": ["增加执行器结构尺寸（增加能量需求）", "降低驱动电压（减少功率消耗）", "缩短工作时间（减少能量累积消耗）", "优化驱动方式（如采用静电驱动替代热驱动）", "", ""], "r": "BCD", "e": "A增加结构尺寸会增加能量需求，不能降低功耗；B降低驱动电压可减少功率消耗从而降低功耗；C缩短工作时间能减少能量累积消耗；D优化驱动方式可降低功耗。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624357", "t": 2, "q": "微机电系统中，微执行器的驱动方式多样，下列属于MEMS微执行器常见驱动方式的有？", "a": ["压电驱动（基于逆压电效应）", "静电驱动（基于静电力）", "热驱动（基于材料热膨胀）", "电磁驱动（基于电磁感应）", "", ""], "r": "ABCD", "e": "在MEMS微执行器中，压电驱动利用逆压电效应，静电驱动依靠静电力，热驱动基于材料热膨胀，电磁驱动基于电磁感应，这几种都是常见驱动方式。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624358", "t": 2, "q": "微机电系统中，微执行器的位移精度是关键性能指标，下列因素会影响微执行器位移精度的有？", "a": ["驱动信号的稳定性（如电压波动）", "环境温度变化（导致热变形）", "环境光照强度", "执行器结构的加工误差", "", ""], "r": "ABD", "e": "驱动信号不稳定会使微执行器驱动力不稳定从而影响位移精度；环境温度变化导致热变形会改变执行器尺寸进而影响位移；执行器结构加工误差会使实际性能与设计有偏差影响位移精度。而环境光照强度通常对微执行器位移精度无直接影响。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624359", "t": 2, "q": "微机电系统中，用于实现能量转换的功能部件除微执行器外，还有其他类型，下列属于MEMS能量转换部件的有？", "a": ["微传感器（信号感知，不转换能量）", "微型振动能量收集器（机械能→电能）", "微型燃料电池（化学能→电能）", "微型温差发电器（热能→电能）", "", ""], "r": "BCD", "e": "题目问的是MEMS能量转换部件，A选项微传感器主要是信号感知，不进行能量转换；B将机械能转换为电能、C把化学能转换为电能、D把热能转换为电能，都属于能量转换部件。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624360", "t": 2, "q": "微纳制造的关键工艺中，属于\"图形化工艺\"范畴，用于将设计图案转移到基底材料上的工艺有？", "a": ["物理气相沉积（PVD）", "蚀刻（干法/湿法）", "光刻", "化学机械抛光（CMP）", "", ""], "r": "BC", "e": "答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624361", "t": 2, "q": "微纳制造中，薄膜沉积工艺是制备MEMS结构层的重要步骤，下列属于薄膜沉积工艺的有？", "a": ["电镀", "物理气相沉积（PVD）", "干法蚀刻", "化学气相沉积（CVD）", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624362", "t": 2, "q": "微纳制造中，电镀工艺的电镀层质量受多个参数影响，下列因素会提高电镀层质量的有？", "a": ["保持电镀电流稳定（避免镀层厚度不均）", "控制电镀液温度稳定（避免浓度不均）", "增加电镀时间（仅增加厚度，不保证质量）", "确保电镀液纯度高（减少杂质）", "", ""], "r": "ABD", "e": "本题可根据各因素对电镀层质量的影响来判断。 选项A：保持电镀电流稳定可避免镀层厚度不均，有助于提高电镀层质量。 选项B：控制电镀液温度稳定能防止浓度不均，对提高电镀层质量有帮助。 选项C：增加电镀时间仅能增加镀层厚度，不能保证镀层质量，不符合题意。 选项D：确保电镀液纯度高可减少杂质，有利于提高电镀层质量。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624363", "t": 2, "q": "微纳制造中，电镀工艺用于制备金属薄膜或结构，下列属于电镀工艺特点的有？", "a": ["沉积速率慢（相比PVD）", "可制备厚金属层（相比PVD/CVD）", "需导电基底（形成电流回路）", "选择性沉积（通过掩膜实现特定区域沉积）", "", ""], "r": "BCD", "e": "电镀相比PVD沉积速率快，A错误；电镀能制备较厚金属层，PVD/CVD一般制备较薄薄膜，B正确；电镀需导电基底形成电流回路来实现金属沉积，C正确；可通过掩膜实现特定区域选择性沉积，D正确。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624364", "t": 2, "q": "微纳制造中，干法灰化工艺用于去除光刻胶，下列属于干法灰化工艺特点的有？", "a": ["可实现选择性灰化（通过掩膜）", "灰化速率快（等离子体反应效率高）", "无液体残留（清洁度高）", "会损伤基底材料（通常不会）", "", ""], "r": "ABC", "e": "干法灰化能借助掩膜实现选择性灰化，等离子体反应使灰化速率快，且无液体残留清洁度高，通常不会损伤基底材料。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624365", "t": 2, "q": "微纳制造中，干法蚀刻工艺包括反应离子蚀刻（RIE）、电感耦合等离子体蚀刻（ICP）等，下列属于干法蚀刻优势的有？", "a": ["蚀刻具有各向异性，可制备高深宽比结构", "蚀刻选择性高（对目标材料蚀刻速率远高于其他材料）", "蚀刻过程清洁，无液体残留", "蚀刻速率通常高于湿法蚀刻", "", ""], "r": "ABC", "e": "干法蚀刻利用等离子体等进行蚀刻，各向异性强可制高深宽比结构，选择性高，过程清洁无液体残留，不过其蚀刻速率一般低于湿法蚀刻。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624366", "t": 2, "q": "微纳制造中，干法蚀刻工艺的蚀刻效果受多个参数影响，下列属于干法蚀刻关键影响参数的有？", "a": ["蚀刻气体流量（决定反应物质浓度）", "蚀刻腔室压力（影响气体分布）", "蚀刻气体种类（决定蚀刻选择性）", "光刻胶的颜色", "", ""], "r": "ABC", "e": "干法蚀刻效果与反应物质浓度、气体分布、蚀刻选择性等相关，蚀刻气体流量、腔室压力、气体种类分别对应影响这些方面；而光刻胶颜色对蚀刻效果无直接影响。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624367", "t": 2, "q": "微纳制造中，光刻工艺是图形转移的核心，其完整流程包括多个步骤，下列属于光刻工艺关键步骤的有？", "a": ["前烘（pre-baking）", "曝光（exposure）", "光刻胶涂覆（spin coating）", "显影（development）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810642237624368", "t": 2, "q": "微纳制造中，光刻胶的性能需适配光刻工艺，下列属于光刻胶关键性能的有？", "a": ["分辨率（形成精细图形的能力）", "颜色（与光刻无关）", "感光度（对曝光辐射的敏感程度）", "附着力（与基底的结合强度）", "", ""], "r": "ACD", "e": "光刻胶关键性能要与光刻工艺适配，分辨率影响图形精细度，感光度关系到对曝光辐射的反应，附着力影响与基底结合，而颜色对光刻无作用。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361088", "t": 3, "q": "微测量技术中的电容器式湿度传感器通过检测由于湿度变化引起的电容值变化来计算湿度值，这一过程仅依赖于电容极板间距的变化，而不受极板间介电常数的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电容器式湿度传感器检测湿度时，电容值变化不仅与电容极板间距有关，还受极板间介电常数影响，因为湿度变化会使极板间介质的介电常数改变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361089", "t": 3, "q": "微测量技术中的电容式微天平通过检测吸附物质质量变化导致的电容值变化，来计算吸附质量，其测量精度与微天平的谐振频率无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电容式微天平测量精度与微天平的谐振频率有关，频率稳定性等会影响测量精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361090", "t": 3, "q": "微测量技术中的电容式位移测量精度主要取决于测量电路的放大倍数，放大倍数越大，测量精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电容式位移测量精度受多种因素影响，不仅取决于测量电路放大倍数，还有电容传感器制造工艺、环境干扰等，并非放大倍数越大精度就越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361091", "t": 3, "q": "微测量技术中的电容式位移传感器的测量范围与极板面积成正比，极板面积越大，测量范围越广。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电容式位移传感器测量范围受多种因素影响，并非单纯与极板面积成正比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361092", "t": 3, "q": "微测量技术中的电容式位移传感器若存在寄生电容（如引线电容、极板边缘电容），会导致测量电容值偏大，引入测量误差，需通过电路设计（如屏蔽、补偿）抑制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "寄生电容会使测量电容值偏大，进而引入误差，通常可通过屏蔽、补偿等电路设计来抑制。", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361093", "t": 3, "q": "微测量技术中的激光多普勒测速仪用于测量MEMS微流体器件内流体速度时，需在流体中添加tracer颗粒，通过检测颗粒的多普勒频移来计算流体速度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "激光多普勒测速仪测MEMS微流体器件内流体速度时，因流体本身散射光弱，添加tracer颗粒可增强散射光，通过检测颗粒多普勒频移计算流体速度。", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361094", "t": 3, "q": "微测量技术中的激光多普勒振动测量属于非接触式测量，可精确测量MEMS谐振器的振动频率和幅值，且不影响谐振器的振动特性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "激光多普勒振动测量利用激光与物体振动相互作用产生的多普勒频移来获取振动信息，无需与被测物体接触，不会干扰MEMS谐振器的振动，能精确测其频率和幅值。", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361095", "t": 3, "q": "微测量技术中的激光干涉测量对环境振动非常敏感，因此通常需要在隔振平台上进行测量，以保证测量精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "激光干涉测量利用光的干涉原理，环境振动会干扰光程差等测量参数，使测量结果不准确，所以常需在隔振平台上保证精度。", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361096", "t": 3, "q": "微测量技术中的激光干涉仪可用于测量MEMS器件的微小位移和振动，其测量精度可达纳米级甚至亚纳米级。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "激光干涉仪是利用干涉原理测量的精密仪器，在微测量技术中，能够对MEMS器件的微小位移和振动进行测量，且测量精度能达到纳米级甚至亚纳米级。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361097", "t": 3, "q": "微测量技术中的激光三角测量法的测量精度与激光发射器和探测器的安装夹角成反比，夹角越小，测量精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361098", "t": 3, "q": "微测量技术中的激光三角测量法通过检测激光在样品表面反射后的光斑位置变化，计算样品的位移或高度，测量精度受激光波长影响较小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361099", "t": 3, "q": "微测量技术中的纳米压痕技术仅能测量MEMS薄膜材料的硬度，无法测量其弹性模量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "纳米压痕技术不仅能测量MEMS薄膜材料的硬度，也可以测量其弹性模量。", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361100", "t": 3, "q": "微测量技术中的扫描电子显微镜（SEM）的分辨率主要取决于电子束的波长，加速电压越高，电子束波长越短，分辨率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "扫描电子显微镜（SEM）分辨率与电子束波长相关，加速电压和电子束波长成反比，加速电压高则电子束波长短，能提高分辨率。", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361101", "t": 3, "q": "微测量技术中的扫描电子显微镜（SEM）观察非导电MEMS样品时，无需对样品进行任何处理，即可获得清晰的微观图像。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。扫描电子显微镜（ SEM ）使用电子束成像，观察非导电 MEMS 样品时，样品会积累电荷，产生荷电效应，影响成像质量。所以需对样品做喷金等导电处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361102", "t": 3, "q": "微测量技术中的扫描电子显微镜（SEM）通过检测样品表面反射的可见光信号形成图像，可观察MEMS器件的微观结构。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "扫描电子显微镜（SEM）是通过检测样品表面发射的二次电子等信号形成图像，并非检测反射的可见光信号。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361103", "t": 3, "q": "微测量技术中的扫描隧道显微镜（STM）仅能测量导电样品，而原子力显微镜（AFM）可测量导电和非导电样品，因此AFM的应用范围比STM更广泛。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "扫描隧道显微镜靠量子隧穿效应工作，要求样品导电；原子力显微镜通过检测探针与样品间相互作用力成像，能测导电和非导电样品，所以AFM应用范围更广。", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361104", "t": 3, "q": "微测量技术中的原子力显微镜（AFM）的非接触模式相比轻敲模式，对样品表面的损伤更小，但测量分辨率更低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "AFM非接触模式探针与样品表面不接触，靠范德华力检测，对样品损伤小；轻敲模式探针周期性轻敲样品表面，分辨率高。所以非接触模式损伤小、分辨率低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361105", "t": 3, "q": "微测量技术中的原子力显微镜（AFM）的轻敲模式相比接触模式，对样品表面的摩擦力更小，适合测量软质或脆弱的MEMS样品。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轻敲模式下，探针周期性地与样品表面接触和脱离，相比接触模式，减少了探针与样品表面的持续摩擦，所以对样品表面摩擦力更小，适合测量软质或脆弱的MEMS样品。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361106", "t": 3, "q": "微测量技术中的原子力显微镜（AFM）仅能测量导电样品的表面形貌，无法测量非导电样品，这是其与扫描电子显微镜（SEM）的主要区别之一。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "原子力显微镜（AFM）可测量导电和非导电样品的表面形貌，并非仅能测导电样品，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361107", "t": 3, "q": "微测量技术中的原子力显微镜（AFM）通过检测探针与样品表面的静电力来获取微观形貌，因此无法测量样品的力学性能（如弹性模量）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "原子力显微镜是通过检测探针与样品表面原子间的相互作用力来获取微观形貌，且它可以测量样品的力学性能，题干表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361108", "t": 3, "q": "微机电系统（MEMS）的核心特征是尺寸微型化（微米至纳米级），其功能实现仅依赖微传感器，与微执行器无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "微机电系统功能实现不仅依赖微传感器，还与微执行器密切相关，微执行器可根据微传感器获取的信息执行相应动作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361109", "t": 3, "q": "微机电系统的静电驱动方式中，驱动力大小与施加电压的平方成正比，与驱动结构的极板间距成反比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361110", "t": 3, "q": "微机电系统的能量收集技术中，振动能量收集器通常基于压电效应或电磁感应效应，将环境中的振动机械能转换为电能，为低功耗MEMS器件供电。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "微机电系统能量收集技术里，振动能量收集器确实常利用压电效应或电磁感应效应，把环境振动机械能转化为电能，可给低功耗MEMS器件供电。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361111", "t": 3, "q": "微机电系统的信号处理模块中，低通滤波器主要用于去除传感器输出信号中的高频噪声，保留低频有用信号。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "低通滤波器的特性就是允许低频信号通过，阻挡高频信号，在微机电系统信号处理里，可去除传感器输出信号高频噪声，保留低频有用信号。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361112", "t": 3, "q": "微机电系统的信号调制中，调幅（AM）是指通过改变载波信号的幅度来携带有用信号信息，常用于MEMS传感器输出信号的远距离传输。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361113", "t": 3, "q": "微机电系统中的微泵若采用压电驱动方式，其工作原理是利用压电材料的逆压电效应，通过压电片的伸缩带动膜片振动，产生流体输送的压力差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压电驱动微泵正是基于逆压电效应，压电片伸缩使膜片振动形成压力差来输送流体。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034810643462361114", "t": 3, "q": "微机电系统中的微传感器的交叉灵敏度是指其对非目标输入的响应程度，交叉灵敏度越高，并不意味着传感器性能越好。", "a": ["正确", "错误", "", "", "", ""], "r
