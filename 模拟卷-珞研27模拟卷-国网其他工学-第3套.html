e=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">孩子在车祸中丧生，妈妈无法接受，依然照常做饭、整理爱子房间，等孩子回来<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">小琴因为室友太吵而无法专心复习考试，于是听起了音乐，她告诉妈妈考试前应该放松才能发挥好<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">一位癌症患者不承认自己的病情，主动打电话告诉朋友自己身体很好<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">张女士的丈夫向她提出离婚，她不愿意接受，依旧照常等丈夫下班，对丈夫很好<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">答案】<\/font>B<font face=\"宋体\">【解析】否认定义的关键信息：把已经发生的令人痛苦的事实变成不存在的东西，避免心理上的不安和痛苦。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A<font face=\"宋体\">项，妈妈无法接受孩子在车祸中丧生的事实，依然等孩子回来，体现了把已经发生的令人痛苦的事情变成不存在的东西，符合定义。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B<font face=\"宋体\">项，小琴因为室友太吵而听音乐，并告诉妈妈应该放松才能发挥好，没有体现将已经发生的令人痛苦的事实变成不存在的东西，不符合定义。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C<font face=\"宋体\">项，癌症患者不承认自己的病情，说自己身体很好，体现了把已经发生的令人痛苦的事实变成不存在的的事情变成不存在的东西，符合定义。<\/font><span style=\"fon /font>C<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42901a4eaxclbsc102801", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">意志：磨炼（）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">校对：仔细<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">品德：思想<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">卓越：追求<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">灵魂：净化<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>D<font face=\"宋体\">【解析】磨炼意志，构成动宾结构的短语。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项，仔细校对，构成偏正结构的短语，与题干关系不一致。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项，思想品德，不能构成动宾结构的短语，与题干关系不一致。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项，追求卓越，构成动宾结构的短语，但是卓越是形容词，而题干中的意志是名词，与题千关系不一致。<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项，净化灵魂，构成动宾结构的短语，与题干关系一致。故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "类比推理"}, {"id": "18caf5c42901a4e8xcljsc677121", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">近日，一项研究指出，完全杜绝胆固醇的摄入并不能改善心脑血管疾病。他们的依据是一份实验报告，报告显示实验中的被试人员（均为心脑血管病患者）每天摄入适量胆固醇的同时达到了改善心脑血管疾病的目的。研究人员解释说，这是由于人体内的胆固醇分为<\/font><font face=\"宋体\">“好”胆固醇与“坏”胆固醇，“好”胆固醇对改善心脑血管疾病是有益的。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，能削弱研究人员的观点？<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">每天摄入适量的胆固醇有助于人体营养均衡，提高身体的免疫力<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">被试人员停止摄入胆固醇后，心脑血管疾病的病情又有加重的迹象<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">每天摄入胆固醇会增加健康人罹患糖尿病的风险<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">没有摄入胆固醇与每天摄入胆固醇的心脑血管疾病患者相比，病情改善的程度更好<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】题干观点是第一句，依据是摄入适量胆固醇的人改善了心脑血管疾病。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项加强了题干观点，<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项与题干无关。<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项若为真，则表明完全杜绝胆固醇的摄入更能改善心脑血管疾病，有力地削弱了题干观点。故答案选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf5c42910e728xcxcsc624276", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">在一些城市的流调报告中，相继出现了<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">只提地点不提人<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">的信息公布新方式，得到了舆论的高度<\/font><u><span style=\"font-family:'Times New Roman';\r\ntext-decoration:underline;text-underline:single;font-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。在新增确诊病例的流调报告中隐去患者的个人信息，改为以涉及区域和场所信息披露为主，这一做法受到了不少媒体和网民的称赞，<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">不提人<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">更显对人的<\/font><u><span style=\"font-family:'Times New Roman';\r\ntext-decoration:underline;text-underline:single;font-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"f t-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">①<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">现在许多机关单位人事管理水平还停留在纸介质的基础上<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">②<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">随着计算机技术、网络技术和信息技术的发展，现在办公系统更趋于系统化、科学化和网络化<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">③<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">它的主要目的是实现信息交流和信息共享，提供协同工作的手段，提高办公的效率，让人们从繁琐的有纸办公中解脱出来<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">④<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">这样的机制已经不能适应时代的发展，因为它浪费了许多的人力和物力<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">⑤<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">网络办公自动化系统是计算机技术和网络迅速发展的一个办公应用解决方案<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">⑥<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">在信息时代，这种传统的管理方式必然被计算机为基础的信息管理所取代<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">将以上<\/font>6<font face=\"宋体\">个句子重新排列，语序正确的是<\/font><font face=\"Times New Roman\">(<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">)<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">②⑤③①④⑥<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">②⑤①③⑥④<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">⑤③②⑥①④<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">⑤①④⑥③②<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>A<font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">通过分析选项发现，首句以<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">句或<\/font><font face=\"Times New Roman\">⑤<\/font><font face=\"宋体\">句开头。<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">句是背景介绍，<\/font><font face=\"Times New Roman\">⑤<\/font><font face=\"宋体\">句引出网络办公自动化系统是办公应用的解决方案，相比较，<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">句应为首句，排除<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">两项。根据上下文意，<\/font><font face=\"Times New Roman\">①<\/font><font face=\"宋体\">句表明人事管理水平低，体现管理机制存在问题，<\/font><font face=\"Times New Roman\">④<\/font><font face=\"宋体\">句说明人事管理机制不适应时代发展，故<\/font><font face=\"Times New Roman\">①④<\/font><font face=\"宋体\">句相连，排除<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项。纵观整个文段，<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">句先背景介绍引出办公系统特点，接着<\/font><font face=\"Times New Roman\">⑤<\/font><font face=\"宋体\">句描述网络办公自动化系统是解决方案，然后<\/font><font face=\"Times New Roman\">③<\/font><font face=\"宋体\">句具体介绍它的优势，同时<\/font><font face=\"Times New Roman\">①④<\/font><font face=\"宋体\">句对比说明纸介质不足，最后<\/font><font face=\"Times New Roman\">⑥<\/font><font face=\"宋体\">句说明今后趋势。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">故正确答案为<\/font>A<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf5c42910e729xcpdsc225795", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">现在一般认为不对称飞羽的出现和飞行起源相关。巨嵴彩虹龙的发现把不对称飞羽的出现时间提早了至少<\/font><font face=\"Times New Roman\">1000<\/font><font face=\"宋体\">万年。从尾前部向后部，巨嵴彩虹龙的尾羽的不对称性逐渐减弱，这种转化趋势也与现生飞行鸟类相一致，表明彩<\/font> imes New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">书法创作上反对理性化的刻意安排<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">《祭侄文稿》和《兰亭序》异曲同工<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>B<font face=\"宋体\">【解析】文段首先指出很多书法都是书写的诗文草稿；接着用颜真卿的《祭侄文稿》和《兰亭序》两个书法作品举例说明书法作品的写成源于作者情感的表达；最后总结指出情势之不同，影响着文辞的表达、用笔的力量与笔势，这赋予了书法生命的气息，使其书法风格各不相同。故文段意在强调的是书法家的心理状态对作品风格的影响。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项与此相符。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项强调书法家的必备素质，偏离重点，排除。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">理性化的刻意安排<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">无中生有，排除。<\/font>D<font face=\"宋体\">项只是举的例子，非文段重点，排除。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42910e729xcpdsc778690", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">广告、点击量变现和会员付费，是现阶段视频平台的三大主要收入来源。从国内近几年的发展态势来看，该视频平台公司的会员付费模式备受国内同行的青睐和追捧。从<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-s ;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机病毒只能通过网络传播，不能通过移动存储设备传播。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:12.0000pt;\">", "<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "", "", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机病毒传播途径多样，网络是常见传播途径之一，如通过网络下载带病毒文件、接收感染病毒的电子邮件等。但移动存储设备（如<\/font>U<font face=\"宋体\">盘、移动硬盘）也是重要传播途径，若这些设备在感染病毒的计算机上使用后，再插入其他计算机，病毒就可能随之传播，尤其是一些自动运行的病毒，会在设备插入时自动感染计算机。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第4章"}, {"id": "189cad0f39b1a760jsjsc604284", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\"><font face=\"宋体\">在数据校验中，能够检测出二位同时出错，并能自动恢复一位出错位正确值的校验方法是<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\"><font face=\"宋体\">奇偶校验<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">B.<font face=\"宋体\">循环冗余校验<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">C.<font face=\"宋体\">水平垂直奇偶校验<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">D.<font face=\"宋体\">海明校验<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】，海明于<\/font><font face=\"Times New Roman\">1950<\/font><font face=\"宋体\">年提出只要增加少数几个校验位，就能检测出二位同时出错、亦能检测出一位出错并能自动恢复该出错位的正确值。因此，海明校验属于纠错码，而其他选项属于检错码。奇偶校验只能检查出奇数位出错；循环冗余校验（<\/font><font face=\"Times New Roman\">CRC<\/font><font face=\"宋体\">）是一种检错方法，不能纠错；水平垂直奇偶校验可以检验出错误的所在并修改错误，但通常只能纠正一位错误，且不是标准的海明码。<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}, {"id": "189cad19084d1ba0jsjjd197801", "t": "3", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">高级程序设计语言编写的程序执行效率一定高于汇编语言编写的程序。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", "", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">汇编语言是一种低级语言，它与计算机硬件紧密相关，能够直接控制硬件资源，编写的程序执行效率通常较高。而高级程序设计语言更接近人类自然语言，编程相对容易，但在执行时需要经过编译或解释过程转换为机器语言，这个过程会增加一定开销，导致执行效率一般低于汇编语言编写的程序。不过高级语言在开发效率、代码可读性和可维护性方面具有优势。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad077b014b60jsjsc395546", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机中，<\/font>Cache<font face=\"宋体\">的作用是<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">提高内存的存储容量<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">提高<\/font><font face=\"Times New Roman\">CPU<\/font><font face=\"宋体\">访问内存的速度<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">存储计算机的基本输入输出系统<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">连接计算机的外部设备<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">Cache<font face=\"宋体\">（高速缓冲存储器）位于<\/font><font face=\"Times New Roman\">CPU<\/font><font face=\"宋体\">和内存之间，它的速度比内存快，用于存储<\/font><font face=\"Times New Roman\">CPU<\/font><font face=\"宋体\">近期可能会频繁访问的数据和指令。当<\/font><font face=\"Times New Roman\">CPU<\/font><font face=\"宋体\">访问数据时，先在<\/font><font face=\"Times New Roman\">Cache<\/font><font face=\"宋体\">中查找，如果找到则直接读取，大大提高了<\/font><font face=\"Times New Roman\">CPU<\/font><font face=\"宋体\">访问内存的速度。它不能提高内存的存储容量，存储计算机基本输入输出系统的是<\/font><font face=\"Times New Roman\">BIOS<\/font><font face=\"宋体\">芯片，连接计算机外部设备的是各种接口。所以选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第1章"}, {"id": "189cad0b4e4f32e0jsjmc408650", "t": "2", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">下列属于系统软件的有<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><span style=\"font-fam ';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">C.<font face=\"宋体\">网络层<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">D.<font face=\"宋体\">网络接口层<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】<\/font><font face=\"Times New Roman\">TCP/IP<\/font><font face=\"宋体\">模型是四层的体系结构，从上到下分为应用层、传输层、网络层和网络接口层。其中，网络接口层对应于<\/font><font face=\"Times New Roman\">OSI<\/font><font face=\"宋体\">的物理层和数据链路层。<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}, {"id": "189cad19084d1ba0jsjsc771930", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">代理服务器型防火墙的最大优点是（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">速度快<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">对用户透明<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">网络管理员对每一个服务有完全控制权<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋 章"}, {"id": "189cad123b309ee0jsjsc191633", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">以下关于防火墙的说法，正确的是<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">防火墙可以防止来自内部网络的攻击<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">防火墙可以完全阻止病毒的传播<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">防火墙是一种硬件设备<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">防火墙可以过滤网络流量<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">防火墙可以根据预先设定的规则对网络流量进行过滤，允许或阻止特定的网络连接和数据传输。它主要用于防范来自外部网络的非法访问和攻击，但对内部网络的攻击防范能力有限；防火墙无法完全阻止病毒传播，病毒传播途径多样，防火墙不能查杀病毒；防火墙可以是硬件设备（如防火墙路由器），也可以是软件（如个人防火墙软件）或软硬件结合的形式。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第4章"}, {"id": "189cad19084d1ba0jsjsc016469", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(51,51,51);font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp; an\">D<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">螺旋模型由<\/font><font face=\"Calibri\">Barry Boehm<\/font><font face=\"宋体\">提出，结合了瀑布模型与原型开发的优点，强调风险分析，适用于大规模、复杂、高风险项目，如航天、金融系统等。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">每个螺旋周期包括：目标设定、风险分析、开发与验证、计划下一阶段<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">常见模型对比：<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font><font face=\"Calibri\">1<\/font><font face=\"宋体\">）瀑布模型：线性、阶段明确，适用于需求稳定的项目<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font><font face=\"Calibri\">2<\/font><font face=\"宋体\">）迭代模型：分阶段逐步完善，适用于需求逐渐清晰的项目<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font><font face=\"Calibri\">3<\/font><font face=\"宋体\">）敏捷开发：快速响应变化，适用于小团队、需求多变项目<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font><font face=\"Calibri\">4<\/font><font face=\"宋体\">）螺旋模型：强调风险管理，适用于高风险、大规模系统<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad0b4e4f32e0jsjjd750326", "t": "3", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\">编译程序是将高级语言源程序一次性全部翻译成目标代码，然后执行目标代码<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:Calibri;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:Calibri;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Calibri\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Calibri\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:Calibri;font-size:10.5000pt;\">", "", "", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】编译是将所要翻译的程序代码作为一个整体翻译，并之后运行内部格式，这个翻译过程称为编译。一个编译器可以将一个可阅读的程序文本（源代码）作为输入的数据，然后输出可执行文件（目标代码）。所输出的可执行文件可能是机器语言，由计算机的中央处理器直接运行。编译过程不执行程序，只生成目标代码文件，执行是后续独立的过程。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第2章"}, {"id": "189cad0f39b1a760jsjsc784016", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">DDoS<\/font><font face=\"宋体\">攻击主要破坏信息安全的哪个属性？（ &nbsp;&nbsp;）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">保密性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">完整性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">可用性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">不可否认性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">【解析】<\/font><font face=\"Times New Roman\">DDoS<\/font><font face=\"宋体\">攻击（分布式拒绝服务攻击）通过大量无效请求耗尽目标系统的资源，使合法用户无法访问服务，这直接破坏了系统的可用性。保密性涉及信息泄露，完整性涉及信息篡改，不可否认性涉及抵赖行为，均与<\/font><font face=\"Times New Roman\">DDoS<\/font><font face=\"宋体\">攻击的主要目标不符。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}, {"id": "189cad077b014b60jsjsc674365", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">在计算机中，字符编码采用的是<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">二进制编码<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">八进制编码<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">十进制编码<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">十六进制编码<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机中所有的数据都以二进制形式存储和处理，字符也不例外。字符通过特定的二进制编码方案（如<\/font>ASCII<font face=\"宋体\">码、<\/font><font face=\"Times New Roman\">Unicode<\/font><font face=\"宋体\">等）进行编码，以便计算机能够识别和处理。所以选<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第1章"}, {"id": "189cad19084d1ba0jsjjd304311", "t": "3", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">在<\/font>C<font face=\"宋体\">语言中，定义数组<\/font><font face=\"Times New Roman\">inta[10];<\/font><font face=\"宋体\">后，数组元素的下标范围是<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">到<\/font><font face=\"Times New Roman\">10<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;<span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", "", "", ""], "r": "B", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】数组下标是从<\/font><font face=\"Times New Roman\">0<\/font><font face=\"宋体\">开始，而不是从<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">开始。定义<\/font><font face=\"Times New Roman\">inta[10];<\/font><font face=\"宋体\">表示数组包含<\/font><font face=\"Times New Roman\">10<\/font><font face=\"宋体\">个元素，分别是<\/font><font face=\"Times New Roman\">a[0]<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">a[1]<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">a[2]<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">a[3]<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">a[4]<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">a[5]<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">a[6]<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">a[7]<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">a[8]<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">a[9]<\/font><font face=\"宋体\">，最大下标是<\/font><font face=\"Times New Roman\">9<\/font><font face=\"宋体\">而非<\/font><font face=\"Times New Roman\">10<\/font><font face=\"宋体\">。访问<\/font><font face=\"Times New Roman\">a[10]<\/font><font face=\"宋体\">是数组越界错误，会导致未定义行为。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad19084d1ba0jsjmc589525", "t": "2", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">下列属于系统软件的有<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">A.<font face=\"宋体\">操作系统<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">B.<font face=\"宋体\">编译程序<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">C.<font face=\"宋体\">数据库管理系统<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">D.Photoshop<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "ABC", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABC<\/font><font face=\"宋体\">【解析】系统软件是为了有效地利用计算机各种资源和方便用户使用计算机的程序，主要包括操作系统、语言处理程序和数据库管理系统。操作系统如<\/font><font face=\"Times New Roman\">Windows<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">Linux<\/font><font face=\"宋体\">，是最基本的系统软件。编译程序属于语言处理程序，用于将高级语言源程序翻译成机器语言目标程序。数据库管理系统如<\/font><font face=\"Times New Roman\">Oracle<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">MySQL<\/font><font face=\"宋体\">，用于建立、使用和维护数据库。<\/font><font face=\"Times New Roman\">Photoshop<\/font><font face=\"宋体\">是图像处理软件，属于应用软件，是为用户解决特定应用问题而开发的程序。因此，选项<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">正确，选项<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">错误。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad077b014b60jsjsc871647", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机内存可分为随机存取存储器（<\/font>RAM<font face=\"宋体\">）和只读存储器（<\/font><font face=\"Times New Roman\">ROM<\/font><font face=\"宋体\">），其中断电后数据会丢失的是<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.RAM<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.ROM<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">两者都会<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">两者都不会<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">随机存取存储器（<\/font>RAM<font face=\"宋体\">）中的数据在计算机断电后会立即丢失，它用于计算机运行时临时存储数据和程序。只读存储器（<\/font><font face=\"Times New Roman\">ROM<\/font><font face=\"宋体\">）中的数据在制造时就被固化，断电后数据不会丢失，通常用于存储计算机启动时需要的基本程序和数据。所以选<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第1章"}, {"id": "189cad123b309ee0jsjsc950536", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机病毒是指<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">编制有错误的计算机程序<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">设计不完善的计算机程序<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">已被破坏的计算机程序<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">以危害系统为目的的特殊的计算机程序<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机病毒是指以危害系统为目的的特殊的计算机程序<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第4章"}]}]};

const KEY = 'ly:' + DATA.id;

  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');

function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }

function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `

      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
</html>
