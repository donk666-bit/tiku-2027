  ）。", "a": ["算法程序的运行时间是确定的", "算法程序所处理的数据是确定的", "算法程序的长度是有限的", "对每种情况下所应执行的操作，在算法中都有确切的规定，不会产生二义性", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】算法的确定性是指对每种情况下所应执行的操作，在算法中都有确切的规定，不会产生二义性，使算法的执行者或阅读者都能明确其含义及如何执行。因此，正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27473", "t": 1, "q": "下面不属于需求分析阶段任务的是（     ）。", "a": ["确定软件系统的功能需求", "确定软件系统的性能需求", "需求规格说明书评审", "执行软件集成测试计划", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.4 应用软件开发过程, 知识点2应用软件开发过程。\n【解析】软件开发周期中，需求分析阶段任务包括：确定软件功能和性能需求、编写需求规格说明书，并进行评审；软件集成测试计划的执行是在软件测试阶段。因此，正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27474", "t": 1, "q": "关于算法的下列说法中，正确的是（     ）。", "a": ["算法是解决问题的方法和步骤", "解题的步骤可以是无穷的", "算法就是解题的计算公式", "算法可以被表述但无法实现", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】选项A是算法概念的准确表述。算法解题的步骤应满足有穷性的要求，算法可以被表述也可以通过编程程序来实现。因此，正确答案为A。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27475", "t": 1, "q": "以下说法正确的是（     ）。", "a": [".算法就是程序", "数据结构就是程序", "算法+数据结构=程序", "算法包括数据结构", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】著名的计算机科学家Wirth提出“算法+数据结构=程序”这一公式，并以此作为其一本专著书名。因此，正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27476", "t": 1, "q": "用计算机解决问题时，首先应该确定程序“做什么？”，然后再确定程序“如何做？”，请问“如何做？”是属于用计算机解决问题的哪一个步骤？（     ）。", "a": ["分析问题", "设计算法", "编写程序", "调试程序", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】“做什么？”是“定义问题”。“如何做？”则需要针对问题来“设计算法”。因此，正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27477", "t": 1, "q": "程序设计过程一般包括五个步骤：分析和定义问题→设计算法→编写程序→调试运行→检测结果，其中（     ）是最核心的步骤。", "a": ["定义和分析问题", "设计算法", "编写程序", "调试运行", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】算法是为了解决问题而设计的一系列操作步骤，设计一个正确而有效的算法，是解决问题的关键。因此，算法设计是程序设计过程中最重要最关键的一步。因此，正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27478", "t": 1, "q": "用计算机程序解决实际问题，首先要做的是（     ）。", "a": ["设计算法", "编写程序", "分析问题", "搭建开发环境", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】用计算机程序解决实际问题，基本流程为：分析和定义问题→设计算法→编写程序→调试运行→检测结果。正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27479", "t": 1, "q": "下列说法正确的是（     ）。", "a": ["进程是一段程序", "进程是一段程序的执行过程", "线程是一段子程序", "线程是多个进程的执行过程", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点1 概述。\n【解析】当程序执行时，操作系统会为其创建进程，因此，进程即正在执行的程序，是动态的。因此，正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27480", "t": 1, "q": "将目标程序(.OBJ)转换成可执行文件(.EXE)的程序称为（     ）。", "a": ["编辑程序", "编译程序", "链接程序", "汇编程序", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】链接程序的功能是将目标程序与其调用的其他目标程序代码链接形成完整的可执行程序。正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27481", "t": 1, "q": "对高级语言源程序进行翻译，一种方式是（     ），一种是解释。", "a": ["汇编", "编译", "连接", "构建", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】高级语言编写的源程序翻译成机器语言程序，有两种机制：编译和解释。因此，正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27482", "t": 1, "q": "解释程序（     ）。", "a": ["解释源程序并直接生成可执行文件", "直接执行源程序", "读取源程序边翻译边执行", "是低级语言", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】解释程序可将源程序每读取一条语句即翻译为基本指令并执行，没有目标文件和最终的可执行文件生成。解释程序是用编程语言所编写的，可能是用低级语言或者高级语言编写，不能说解释程序是低级语言。正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27483", "t": 1, "q": "关于汇编语言程序，下面说法正确的是（     ）。", "a": ["相对高级程序设计语言编写的程序而言，具有良好的可移植性", "相对高级程序设计语言编写的程序而言，具有良好的可读性", "相对于机器语言程序具有较好的可读性", "相对于机器语言程序具有较高的执行效率", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】汇编语言程序是用汇编语言编写的程序。汇编语言是一种面向机器的符号语言，因此比起二进制形式的机器语言，其编写的程序相对有较好的可读性，但执行前需要用汇编程序进行汇编，因此执行效率低于机器语言。相比而言，高级语言程序比汇编语言程序可读性更好、且跨平台的可移植性更好。正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27484", "t": 1, "q": "高级语言程序经编译程序翻译成的结果，称为（     ）。", "a": ["源程序", "目标程序", "临时程序", "低级程序", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】编译程序将高级语言程序翻译成与之等价的目标程序，因此，正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27485", "t": 1, "q": "用高级语言编写的程序称为（     ）。", "a": ["源程序", "原始程序", "基础程序", "编译程序", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】高级语言所编写的程序称为“源程序”。因此，正确答案为A。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27486", "t": 1, "q": "把用高级程序设计语言编写的程序转换成等价的目标程序，这个过程叫（     ）。", "a": ["汇编", "解释", "编译", "链接", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】高级语言所编写的程序由于不能被计算机硬件识别和执行，需要经过编译才能生成目标程序。因此，正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27487", "t": 1, "q": "下列各类计算机程序语言中，属于高级程序设计语言的是（     ）。", "a": ["二进制语言", "机器语言", "汇编语言", "Python", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】机器语言（即二进制形式）和汇编语言都是面向机器的指令系统，属于低级语言。Python是当前流行的高级编程语言。因此，正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27488", "t": 1, "q": "编译程序的最终目的是（     ）。", "a": ["发现源程序中的语法错误", "发现源程序中的逻辑错误", "将源程序编译成目标程序", "将某一高级语言程序翻译成另一高级语言程序", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】编辑型的高级语言所编写的程序由于不能被计算机硬件识别和执行，需要经过编译程序翻译成二进制目标程序，并经过连接形成可执行程序。因此，正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27489", "t": 1, "q": "下列各类计算机程序语言中，属于低级程序设计语言的是（     ）。", "a": ["C++语言", "C语言", "Java语言", "机器语言", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】C++、Java都属于高级编程语言，属于低级编程语言的只有机器语言和汇编语言。因此，正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27490", "t": 1, "q": "关于机器语言，说法不正确的是（     ）。", "a": ["二进制语言", "能被计算机硬件直接识别和执行的语言", "依赖于计算机的低级程序设计语言", "独立于计算机的高级程序设计语言", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】机器语言是直接采用二进制编码的语言，面向机器的指令系统，所以严重依赖于计算机硬件系统，属于低级语言。因此，正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27491", "t": 1, "q": "汇编语言源程序必须经过（     ）翻译成二进制指令。", "a": ["编译程序", "解释程序", "汇编程序", "服务程序", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】把汇编语言书写的程序翻译成与之等价的计算机可执行的机器语言程序的翻译程序是汇编程序。因此，正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27492", "t": 1, "q": "汇编语言是（     ）的语言。", "a": ["面向机器", "面向问题", "面向过程", "面向汇编", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】二进制语言是直接面向机器指令系统的编程语言，属于低级语言。因此，正确答案为A。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27493", "t": 1, "q": "计算机编程语言经历了（     ）的发展阶段。", "a": ["机器语言到高级语言", "面向过程到面向对象", "汇编语言到高级语言", "低级语言到高级语言", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】计算机编程语言的发展过程先后分为：机器语言、汇编语言、高级语言，机器语言和汇编语言属于低级语言，因此整体上时从低级语言发展到高级语言阶段。因此，正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27494", "t": 1, "q": "以（     ）为扩展名的文件是可以直接执行的。", "a": ["exe", "txt", "tmp", "jpg", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点3 Windows11操作系统。\n【解析】“.exe”文件是二进制命令文件，是可以直接执行的程序文件。“.txt”文件为文本文件， “.tmp”文件是临时文件 “.jpg”是图像文件，它们都不是二进制程序文件，不能直接执行。因此，正确答案为A。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27495", "t": 1, "q": "搜索文件名 用“*.exe”，可以在当前搜索范围内（     ）", "a": ["找到所有含有*的文件", "找到选中所有扩展名中含有*的文件", "选中所有的文件", "找到所有的可执行程序文件", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点3 Windows11操作系统。\n【解析】“*.exe” 表示主文件名为任意字符组合、扩展名为.exe的文件名，因此任意名字的可执行程序文件。因此，正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27496", "t": 1, "q": "结构化程序设计的3种结构是（     ）。", "a": ["顺序、分支、跳转", "顺序、选择、循环", "分支、选择、循环", "分支、跳转、循环", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】结构化程序设计的3种结构分别是：顺序结构、选择结构（也称为：分支结构）、循环结构。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27497", "t": 1, "q": "应用计算机程序解决实际问题的步骤通常是（     ）。", "a": ["设计算法→编写程序", "编写程序→调试程序→检测结果", "分析问题→设计算法→编写程序→调试运行→检测结果", "编写程序→调试运行", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】应用计算机程序解决实际问题，完整的流程为：分析和定义问题→设计算法→编写程序→调试运行→检测结果。正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27498", "t": 1, "q": "程序设计过程包括五个步骤，五个步骤中不包含哪一个？（     ）。", "a": ["问题定义", "设计数据库", "算法设计", "程序编制", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】程序设计过程的基本步骤为：分析和定义问题→设计算法→编写程序→调试运行→检测结果，不包含设计数据库这个步骤。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27499", "t": 1, "q": "在计算机中，算法是指（     ）。", "a": ["查询方法", "加工方法", "解题方案的准确而完整的描述", "排序方法", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】算法是对解题过程的准确而完整的描述，所以正确答案选C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27500", "t": 1, "q": "Windows系统中的“剪贴板”（     ）。", "a": ["用于临时存放程序代码", "是硬盘中的一块区域", "用于临时复制或剪切的内容", "是寄存器中的一块区域", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点3 Windows11操作系统。\n【解析】“剪贴板”是内存中的一块区域，用于临时存放复制或剪切的内容。因此，正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27501", "t": 1, "q": "文件管理是操作系统的重要功能，文件系统可实现对文件的（     ）。", "a": ["按文件作者存取", "按文件大小存取", "按文件创建日期存取", "按文件名存取", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点3 Windows11操作系统。\n【解析】文件系统的主要功能之一是实现对文件的“按名存取”。因此，正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27502", "t": 1, "q": "若把操作系统看作计算机系统资源的管理者，下列的（     ）不属于操作系统管理的资源。", "a": ["程序", "内存", "CPU", "中断", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点1 概述。\n【解析】操作系统管理计算机中的软硬件资源，选项A属于软件资源，B和属于硬件资源，D是操作系统进行多道程序运行所使用的技术，不属于其管理的资源。因此，正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27503", "t": 1, "q": "下列叙述中，正确的是（     ）。", "a": ["高级语言编写的程序可移植性差", "机器语言就是汇编语言，无非是名称不同而已", "指令是由一串二进制数0、1组成的", "用机器语言编写的程序可读性好", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】指令是用0和1组成的一串代码，它们有一定的位数，并分成若干段，各段的编码表示不同的含义。机器语言和汇编语言是不同的编程语言，都属于低级语言。机器语言是二进制形式，可读性差，不易被人们掌握和运用；高级语言接近于自然语言，且脱离了底层硬件的限制，具有可读性好、可移植性好等优点。正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27504", "t": 1, "q": "以下关于操作系统的说法，正确的是（     ）。", "a": ["批处理系统是实现人机交互的系统", "批处理系统具有批处理功能，但不具有交互能力", "分时系统是实现自动控制，无须人为干预的系统", "分时系统即具有分时交互能力，又具有批处理能力", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点2 操作系统的类别。\n【解析】批处理系统采用批处理方式工作，在监督程序的控制下自动调取作业进行执行，无须人工干预，因此不具有交互能力，分时系统以时间片轮转方式处理来自 各个终端用户的服务请求，能以交互方式在终端上想用户显示结果。正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27505", "t": 1, "q": "数据库管理系统是一种（     ）。", "a": ["应用软件", "系统软件", "硬件", "软硬件结合体", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。\n【解析】数据库管理系统是一种工作在操作系统之上的系统软件，为数据库应用开发提供支撑。正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27506", "t": 1, "q": "微机上广泛使用的Windows是（     ）。", "a": ["单任务操作系统", "多任务操作系统", "实时操作系统", "批处理操作系统", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点2 操作系统的类别。\n【解析】微机中安装的Windows是多任务操作系统，可支持多个程序同时进入内存并运行。因此，正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27507", "t": 1, "q": "操作系统（     ）。", "a": ["只有程序没有数据", "提供人机交互接口", "一台计算机只能安装一个操作系统", "是一种最重要的应用软件", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点1 概述。\n【解析】操作系统属于计算机中最核心的系统软件，包括一组对计算机资源进行管和控制的程序，也包含有数据和文档；操作系统为用户及其他软件提供方便使用的界面和接口；一台计算机可安装多个操作系统。正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27508", "t": 1, "q": "计算机操作系统可以实现（     ）。", "a": ["对用户的数据文件进行管理，为用户提供管理文件方便", "对源程序进行编译和运行", "对计算机的所有资源进行统一控制和管理，为用户使用计算机提供方便", "对汇编语言程序进行翻译", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点1 概述。\n【解析】操作系统是计算机中的“总管家”，管理计算机中所有的硬件和软件资源，但是不具备翻译不同语言编写的源程序的功能。正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27509", "t": 1, "q": "数据库管理系统属于（     ）。", "a": ["应用软件", "系统软件", "工具软件", "字处理软件", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。\n【解析】系统软件包括：操作系统、语言处理程序、数据库管理系统和网络服务程序等。因此，正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27510", "t": 1, "q": "下列各组软件中，全部属于应用软件的是（     ）。", "a": ["程序语言处理程序、数据库管理系统、财务处理软件", "文字处理程序、编辑程序、Linux操作系统", "Word 2010 、Windows 10、学生信息管理系统", "管理信息系统、办公自动化系统、电子商务软件", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。\n【解析】A选项中，程序语言处理程序、数据库管理系统均为系统软件；B选项中“Linux操作系统”属于系统软件，C选项中“Windows 10”属于系统软件。只有D选项中均为应用软件。因此，正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27511", "t": 1, "q": "下列（     ）是系统软件。", "a": ["办公自动化软件", "Android", "航天信息系统", "专家系统", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。\n【解析】A.C.D选项均为针对特定应用领域而开发的软件，属于应用软件。Android是手机操作系统，属于系统软件。因此，正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27512", "t": 1, "q": "计算机软件中最核心的是（     ）。", "a": ["程序语言处理系统", "操作系统", "数据库管理系统", "诊断程序", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点1 概述。\n【解析】计算机软件中，最核心的是操作系统，它在计算机中管理所有的硬件资源和软件资源。因此，正确答案为B。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27513", "t": 1, "q": "在结构化程序设计中，模块划分的原则是（     ）。", "a": ["各模块应包括尽量多的功能", "各模块的规模应尽量大", "各模块之间的联系应尽量紧密", "模块内具有高内聚度、模块间具有低耦合度", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】在结构化程序设计中，模块划分的原则是：模块尽可能小，功能尽量单一，且提倡高内聚、低耦合，即模块内结构紧凑、模块间尽量独立。正确答案为D。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27514", "t": 1, "q": "计算机软件包括（     ）。", "a": ["<p>数据和文档<\/p>", "<p>程序代码<\/p>", "<p>开发文档和数据<\/p>", "<p>程序和文档<\/p>", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。\n【解析】A数据和文档：数据是软件处理的对象，不是软件的组成部分（如 Word 文档中的文字是数据，而非 Word 软件本身），排除。\nB程序代码：程序代码是 “程序” 的具体实现形式（程序是代码的功能抽象），且选项仅包含程序，未涵盖文档（软件需文档辅助），范围不完整，排除。\nC开发文档和数据：数据非软件组成部分，且 “开发文档” 只是文档的一部分（还包括用户文档等），范围片面，排除。\nD程序和文档：程序是软件的核心执行部分（实现功能），文档是辅助理解和维护的部分，二者共同构成软件的基本框架，符合软件的标准定义，正确。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27515", "t": 1, "q": "计算机软件一般划分为（     ）和（     ）。", "a": ["操作系统  应用软件", "工具软件  系统软件", "系统软件  应用软件", "操作系统  办公软件", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。\n【解析】软件系统一般分为系统软件和应用软件两大类。因此，正确答案为C。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27516", "t": 1, "q": "下述说法中，不正确的是（     ）。", "a": ["未经软件著作权人批准，私自复制其软件，属于犯罪行为", "中国已经颁布了《计算机软件保护条例》并已开始施行", "软件是脑力劳动的创造性产物，具有版权", "软件版权应受保护，但软件不属于知识产权范畴", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。\n【解析】软件是软件开发人员的劳动成果，享有版权和知识产权。我国颁布了软件保护方面的法律法规并已在施行。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27517", "t": 1, "q": "下列关于软件测试的目的和准则的叙述中，正确的是（     ）。", "a": ["软件测试时证明软件没有错误", "主要目的是发现程序中的错误", "主要目的是确定程序中错误的位置", "测试最好有程序员自己来检查自己的程序", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.4 应用软件开发过程, 知识点2应用软件开发过程。\n【解析】软件测试的目的是为了尽可能发现并纠正程序中的错误，通常是由专门的测试人员来做测试工作。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27518", "t": 1, "q": "在结构化方法中，用数据流图（DFD）作为描述工具的软件开发阶段是（     ）。", "a": ["逻辑设计", "需求分析", "系统分析", "物理设计", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.4 应用软件开发过程, 知识点2应用软件开发过程。\n【解析】在软件开发阶段，系统分析的任务包括：设计数据流图（DFD）和数据字典（DD）。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27519", "t": 1, "q": "（其它工学）以下能正确定义一维数组并初始化所有元素为0的语句是（　）。", "a": ["int a[5] = 0;", "int a[5] = {0};", "int a[5] = {0,0};", "int a[5] = (0);", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点6 数组。\n【解析】 使用{0}可以将第一个元素初始化为0，其余元素自动补0。A和D语法错误，C只初始化前两个元素。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27520", "t": 1, "q": "（其它工学）若有定义 int a[3][4];，则数组a包含的元素个数是（　）。", "a": ["3", "4", "7", "12", "", ""], "r": "D", "e": "【定位】 第2章 计算机软件基础, 2.5 C程序设计基础, 知识点6 数组。\n【解析】二维数组元素总数为行数×列数=3×4=12。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27521", "t": 1, "q": "<p>（其它工学）以下程序运行后输出结果是（　）。<\/p>\n<p>int main() {<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;int a[3][3] = {{1,2,3},{4,5,6},{7,8,9}};<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;printf(\"%d\", a[1][2] - a[2][1]);<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;return 0;<\/p>\n<p>}<\/p>", "a": ["<p>-3<\/p>", "<p>-2<\/p>", "<p>2<\/p>", "<p>3<\/p>", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点6 数组。\n【解析】 a[1][2]=6，a[2][1]=8，6-8=-2。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27522", "t": 1, "q": "<p>（其它工学）有以下程序输出结果是（　）。<\/p>\n<p>int main() {<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;int a[5] = {1,2,3,4,5};<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;int i, sum = 0;<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;for(i = 0; i &lt; 5; i += 2)<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;sum += a[i];<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;printf(\"%d\", sum);<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;return 0;<\/p>\n<p>}<\/p>", "a": ["<p>6<\/p>", "<p>9<\/p>", "<p>12<\/p>", "<p>15<\/p>", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点6 数组。\n【解析】 i取值为0,2,4，对应元素1,3,5，和为9。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27523", "t": 1, "q": "<p>（其它工学）以下程序输出结果是（　）。<\/p>\n<p>int main() {<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;int a[3][4] = {0};<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;int i, j, n = 1;<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;for(i = 0; i &lt; 3; i++)<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;for(j = 0; j &lt; 4; j++)<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;a[i][j] = n++;<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;printf(\"%d\", a[1][2] + a[2][3]);<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;return 0;<\/p>\n<p>}<\/p>", "a": ["<p>13<\/p>", "<p>15<\/p>", "<p>17<\/p>", "<p>19<\/p>", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点6 数组。\n【解析】a[0][0]=1,a[0][1]=2,a[0][2]=3,a[0][3]=4,a[1][0]=5,a[1][1]=6,a[1][2]=7,a[1][3]=8,a[2][0]=9,a[2][1]=10,a[2][2]=11,a[2][3]=12，7+12=19。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27524", "t": 1, "q": "（其它工学）若有定义 int a = 10, *p = &a;，则 *p 的值是（　）。", "a": ["a的地址 ", "10", "变量p的值", "随机值", "", ""], "r": "B", "e": "【定位】\n【解析】 p指向变量a，*p是取p指向的内容，即a的值10。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27525", "t": 1, "q": "（其它工学）若有定义 int a[5] = {1,2,3,4,5}, *p = a;，则 *(p+2) 的值是（　）。", "a": ["1", "2", "3", "4", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点7 指针。\n【解析】 p指向a[0]，p+2指向a[2]，*(p+2)值为3。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27526", "t": 1, "q": "<p>（其它工学）有以下程序输出结果是（ ）。<\/p>\n<p>int main() {<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;int a = 3, b = 5;<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;int *pa = &amp;a, *pb = &amp;b;<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;*pa = *pa + *pb;<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;*pb = *pa - *pb;<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;*pa = *pa - *pb;<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;printf(\"%d,%d\", a, b);<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;return 0;<\/p>\n<p>}<\/p>", "a": ["<p>3,5 <\/p>", "<p>5,3 <\/p>", "<p>8,3 <\/p>", "<p>8,5<\/p>", "", ""], "r": "B", "e": "【定位】 第2章 计算机软件基础, 2.5 C程序设计基础, 知识点7 指针。\n【解析】通过指针交换a和b的值，执行后a=5，b=3。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27527", "t": 1, "q": "<p>（其它工学）有以下程序输出结果是（ ）。<\/p>\n<p>int main() {<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;int a[5] = {1,2,3,4,5};<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;int *ptr = (int*)(&amp;a + 1);<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;printf(\"%d\", *(ptr - 1));<\/p>\n<p>&nbsp;&nbsp;&nbsp;&nbsp;return 0;<\/p>\n<p>}<\/p>", "a": ["<p>1<\/p>", "<p>2<\/p>", "<p>5<\/p>", "<p>随机值<\/p>", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点7 指针。\n【解析】 &a是整个数组的地址，&a+1指向数组末尾之后，ptr-1指向前一个int，即a[4]=5。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27528", "t": 1, "q": "（管理、财会、其它类）在Python中，以下哪个选项属于不可变数据类型（　）。", "a": ["列表", "字典", "字符串", "集合", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.6 Python程序设计基础, 知识点1 python语言的数据类型、运算符与表达式。 \n【解析】 字符串是不可变数据类型，创建后其内容无法修改。列表、字典和集合均为可变数据类型。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27529", "t": 1, "q": "（管理、财会、其它类） 以下哪个符号用于表示Python中的单行注释（　）。", "a": ["//", "/*", "#", "--", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.6 Python程序设计基础, 知识点1 python语言的数据类型、运算符与表达式。  \n【解析】Python使用 `#` 表示单行注释，多行注释通常使用三引号 `\"\"\"` 或 `'''`。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27530", "t": 1, "q": "<p>（管理、财会、其它类） 以下代码的输出结果是什么（　）。<\/p>\n<p>print(10 // 3)<\/p>", "a": ["<p>3.333...<\/p>", "<p>3<\/p>", "<p>1<\/p>", "<p>3.0<\/p>", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.6 Python程序设计基础, 知识点1 python语言的数据类型、运算符与表达式。\n【解析】  `//` 是整除运算符，返回商的整数部分，`10 // 3` 结果为 `3`。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27531", "t": 1, "q": "（管理、财会、其它类） 列表切片 `lst = [1, 2, 3, 4, 5]`，执行 `lst[1:4]` 的结果是什么（　）。", "a": ["[2, 3, 4]", "[1, 2, 3]", "[2, 3, 4, 5]", "[1, 2, 3, 4]", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.6 Python程序设计基础, 知识点 2 python语言的列表和元组。\n【解析】  切片 `[1:4]` 包含索引1到3的元素，即 `[2, 3, 4]`，不包括索引4对应的元素。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27532", "t": 1, "q": "（管理、财会、其它类）在 `if-elif-else` 结构中，以下描述正确的是（　）。", "a": ["if 部分可以省略", "else 部分必须存在", "elif 部分可以有多个", "elif 部分必须在 else 之后", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.6 Python程序设计基础, 知识点 3 python语言的控制结构。\n【解析】  `elif` 可以有多个，用于处理多种条件。`if` 必须存在，`else` 是可选的，且 `elif` 必须在 `else` 之前。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27533", "t": 1, "q": "<p>（管理、财会、其它类）以下代码的输出结果是什么（　）。<\/p>\n<p>lst = [1, 2, 3]<\/p>\n<p>print(lst * 2)<\/p>", "a": ["<p>[2, 4, 6]<\/p>", "<p>[1, 2, 3, 1, 2, 3]<\/p>", "<p>[1, 2, 3, 2]<\/p>", "<p>报错<\/p>", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.6 Python程序设计基础, 知识点 2 python语言的列表和元组。 \n【解析】 列表与整数相乘表示重复拼接，`lst * 2` 将列表元素重复两次，结果为 `[1, 2, 3, 1, 2, 3]`。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27534", "t": 1, "q": "<p>（管理、财会、其它类）以下代码的输出结果是什么（　）。<\/p>\n<p>lst = [1, 2, 3]<\/p>\n<p>lst.insert(1, [4, 5])<\/p>\n<p>print(len(lst))<\/p>", "a": ["<p>4<\/p>", "<p>5<\/p>", "<p>3<\/p>", "<p>报错<\/p>", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.6 Python程序设计基础, 知识点 2 python语言的列表和元组。 \n【解析】 `insert(1, [4, 5])` 在索引1位置插入一个列表 `[4, 5]` 作为单个元素，列表变为 `[1, [4, 5], 2, 3]`，长度为4。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27535", "t": 1, "q": "<p>下列哪个是系统软件？（ ）<\/p>", "a": ["<p>Word<\/p>", "<p>Excel<\/p>", "<p>数据库管理系统DBMS<\/p>", "<p>Photoshop<\/p>", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。\n【解析】DBMS是系统软件，其他为应用软件。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27536", "t": 1, "q": "<p>（其他工学类）在C语言中，若int占4字节，int a[10]；则sizeof(a)的值是（ ）。<\/p>", "a": ["<p>4<\/p>", "<p>10<\/p>", "<p>40<\/p>", "<p>不确定<\/p>", "", ""], "r": "C", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点1 C语言的数据类型、运算符与表达式。\n【解析】sizeof(a)是求数组a的大小，数组大小 = 元素个数 × 类型大小 = 10 × 4 = 40。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27537", "t": 1, "q": "<p>（其他工学）以下关于指针的描述，正确的是（ ）。<\/p>", "a": ["<p>指针变量只能指向同类型变量<\/p>", "<p>空指针指向地址0，不可访问<\/p>", "<p>指针变量存储的是变量的值<\/p>", "<p>函数中可以返回局部变量的指针<\/p>", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点7 指针。\n【解析】空指针（NULL）不指向有效内存，访问会出错。A不完全正确（void*可指向任意类型）。C错，指针存地址。D错，局部变量地址在函数返回后无效。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27538", "t": 1, "q": "<p>（管理、财会、其它类）在Python中，以下哪个表达式的结果为True？（ ）<\/p>", "a": ["<p>(3, 2) &gt; (2, 3)<\/p>", "<p>[1,2] &gt; [1,3]<\/p>", "<p>(1,2) == [1,2]<\/p>", "<p>{1,2} == {2,1}<\/p>", "", ""], "r": "D", "e": "【定位】第2章 计算机软件基础, 2.6 Python程序设计基础, 知识点 2 python语言的列表和元组。\n【解析】集合是无序的，{1,2}和{2,1}相等。A错（3>2成立，元组比较按顺序）。B错（2<3）。C错，元组和列表类型不同。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27539", "t": 1, "q": "<p>在操作系统中，分时系统的特点是（ ）。<\/p>", "a": ["<p>实时响应<\/p>", "<p>多个用户轮流使用CPU时间片<\/p>", "<p>可靠性高<\/p>", "<p>适用于航天控制<\/p>", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点2 操作系统的类别。\n【解析】分时系统通过时间片轮转，多个用户共享CPU。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27540", "t": 2, "q": "软件由（     ）部分组成。", "a": ["<p>数据<\/p>", "<p>文档<\/p>", "<p>程序<\/p>", "<p>工具<\/p>", "", ""], "r": "ABC", "e": "<p>【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。<\/p>\n<p>【解析】软件是一个完整的逻辑实体，通常由以下三部分组成:<br>程序(C):按特定功能设计的可执行指令序列，是软件的核心。<br>文档(B):与软件开发、维护和使用相关的图文资料(如需求文档、设计文档、用户手册等)<br>数据(A):程序运行时需要处理、存储和输出的信息。<\/p>", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27541", "t": 2, "q": "下列关于Windows“回收站”的叙述中，正确的是（     ）。", "a": ["“回收站”中的信息可以清除", "每个逻辑硬盘上“回收站”的大小可以分别设置", "当硬盘空间不够使用时，系统自动使用“回收站”所占据的空间", "“回收站”中可以存放所有逻辑硬盘上被删除的信息", "", ""], "r": "ABD", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点3 Windows11操作系统。\n【解析】选项 A：“回收站” 中的信息可以清除\n正确。回收站是被删除文件的 “临时存放区”，用户可通过两种方式清除其中信息：\n右键点击桌面 “回收站” 图标，选择 “清空回收站”，永久删除所有文件；\n在回收站窗口中选中单个 / 多个文件，右键选择 “删除”，永久删除指定文件。\n选项 B：每个逻辑硬盘上 “回收站” 的大小可以分别设置\n正确。Windows 的回收站为每个逻辑硬盘（分区，如 C 盘、D 盘）独立分配空间，用户可自定义每个分区回收站的最大占用空间：\n右键点击 “回收站”→选择 “属性”；\n在属性窗口中，可针对每个分区（如 “C:”“D:”）单独设置 “最大空间”（如 C 盘设 10GB，D 盘设 20GB），实现分区级别的空间管理。\n选项 C：当硬盘空间不够使用时，系统自动使用 “回收站” 所占据的空间\n错误。回收站的空间是 “预分配且有上限” 的（即用户在属性中设置的 “最大空间”），系统不会主动挪用回收站已占用的空间：\n若硬盘剩余空间不足，新删除的文件会直接跳过回收站，被永久删除（而非占用回收站空间）；\n回收站的空间仅用于存放 “正常删除（未按 Shift 键）” 的文件，且不超过预设上限。\n选项 D：“回收站” 中可以存放所有逻辑硬盘上被删除的信息\n正确。默认情况下（未按 Shift 键删除），所有逻辑硬盘（分区）中被删除的文件，都会进入对应分区的回收站 “子空间”，且可通过桌面统一的 “回收站” 窗口查看和管理：\n例如，从 C 盘删除的 “文档.txt” 和从 D 盘删除的 “图片.jpg”，均可在回收站中找到，无需分别查看各分区的回收站，实现 “统一管理所有分区的删除文件”。\n综上，正确答案为 ABD。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27542", "t": 2, "q": "在Word中，段落的对齐方式有（     ）。", "a": ["分散对齐", "居中对齐", "左对齐", "右对齐", "", ""], "r": "ABCD", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点4 Word。\n【解析】选项 A：分散对齐\n正确。分散对齐是 Word 的核心段落对齐方式之一，功能是让段落内文字均匀分布在左右页边距之间，确保段落左右两端均完全对齐（即使段落最后一行文字较少，也会通过调整字符间距实现两端对齐），常用于表格内容、英文文档或需要严格整齐排版的场景（如正式报告的标题栏）。\n选项 B：居中对齐\n正确。居中对齐是常用对齐方式，作用是让段落内所有文字（或段落标记）水平居中于页边距中间，不与左右页边距对齐，典型用途是文档标题、副标题、表格标题等需要突出居中显示的内容（如 “第一章 引言” 居中排版）。\n选项 C：左对齐\n正确。左对齐是 Word 的默认段落对齐方式之一，特点是段落文字靠左页边距对齐，右页边距呈不规则形态（因文字长度不同导致），适用于大多数日常文档（如正文段落、邮件内容、普通报告正文），符合中文阅读习惯。\n选项 D：右对齐\n正确。右对齐与左对齐相反，段落文字靠右页边距对齐，左页边距呈不规则形态，常用于需要靠右显示的内容（如文档末尾的日期、签名、页码右侧排版，或英文信件中的收件人地址右对齐）。\n此外，Word 中还有 “两端对齐”（左右两端均对齐，最后一行左对齐，区别于分散对齐），但题干选项未包含该方式，不影响本题判断。综上，四个选项均为 Word 中的段落对齐方式，正确答案为 ABCD。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27543", "t": 2, "q": "对于非绿色软件的卸载，可以采用（     ）。", "a": ["程序自带的卸程序", "从“设置”中的“应用”卸载", "从“设置”中的“系统”卸载", "直接删除看到的安装的文件", "", ""], "r": "AB", "e": "【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。\n【解析】选项 A：程序自带的卸载程序\n正确。非绿色软件通常会在安装目录（如C:\\Program Files\\软件名）或系统 “开始菜单” 中提供官方卸载程序（命名多为Uninstall.exe、卸载.exe）。该程序会按软件安装时的 “反向流程” 清理：不仅删除主程序文件，还会删除注册表项、系统残留文件，是最彻底的卸载方式之一（官方推荐）。\n选项 B：从 “设置” 中的 “应用” 卸载\n正确。以 Windows 系统为例，“设置→应用→应用和功能” 列表会收录所有已安装的非绿色软件。选择目标软件后点击 “卸载”，系统会自动调用软件的官方卸载程序（或系统统一卸载机制），本质与 “程序自带卸载” 效果一致，可有效清理主文件和关键残留，操作更便捷（无需手动查找卸载程序）。\n选项 C：从 “设置” 中的 “系统” 卸载\n错误。系统 “设置→系统” 模块的核心功能是 “系统配置管理”（如显示分辨率、存储空间、声音、电源等），无任何 “卸载软件” 的功能入口。卸载软件的入口仅在 “应用”（或旧版系统的 “控制面板→程序和功能”）中，该选项混淆了系统设置的功能分区。\n选项 D：直接删除看到的安装文件\n错误。非绿色软件的 “可见安装文件”（如安装目录中的exe、dll文件）仅占软件的一部分，直接删除会留下大量残留：\n注册表中仍存在软件的注册信息、启动项（可能导致系统报错）；\n系统隐藏文件夹中仍有缓存、配置文件（占用磁盘空间，甚至影响后续软件安装）。\n这种方式属于 “暴力删除”，会导致系统残留问题，是非绿色软件卸载的 “错误操作”。\n综上，正确答案为 AB。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27544", "t": 2, "q": "在Excel2016中，工作表的重命名方法有（     ）。", "a": ["双击相应的工作表标签，输入新名称覆盖原有名称即可", "单击相应的工作表标签，选择“文件”菜单中的“重命名”命令", "单击相应的工作表标签，输入新名称覆盖原有名称即可", "右击将改名的工作表标签，然后选择快捷菜单中的“重命名”命令，最后输入新的工作表名", "", ""], "r": "AD", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点5 Excel。\n【解析】选项 A：双击相应的工作表标签，输入新名称覆盖原有名称即可\n正确。这是 Excel 中工作表重命名的最直接方法：\n操作逻辑：双击底部的工作表标签（如 “Sheet1”），标签会进入 “编辑状态”（原有名称变色并出现光标）；\n完成步骤：直接输入新名称（如 “销售数据 2024”），按Enter键即可确认重命名，操作便捷且符合软件设计逻辑。\n选项 B：单击相应的工作表标签，选择 “文件” 菜单中的 “重命名” 命令\n错误。Excel 的 “文件” 菜单（左上角）主要用于 “新建、保存、打开、打印” 等文档级操作，不存在 “重命名工作表” 的命令。工作表重命名是针对 “标签” 的局部操作，与 “文件” 菜单无关，该选项混淆了菜单功能范畴。\n选项 C：单击相应的工作表标签，输入新名称覆盖原有名称即可\n错误。“单击工作表标签” 仅能 “选中该工作表”（标签背景变色），但无法进入 “编辑状态”，此时输入任何内容都不会作用于标签名称（反而可能在工作表的单元格中输入内容），必须通过 “双击” 或 “右键” 触发编辑状态，因此该操作无效。\n选项 D：右击将改名的工作表标签，然后选择快捷菜单中的 “重命名” 命令，最后输入新的工作表名\n正确。这是 Excel 中另一种标准的重命名方法：\n操作逻辑：右键单击目标工作表标签，弹出的快捷菜单中会明确包含 “重命名” 选项；\n完成步骤：选择 “重命名” 后，标签进入编辑状态，输入新名称并按Enter键即可，适用于习惯右键操作的用户。\n综上，Excel 2016 中工作表的正确重命名方法为选项 A 和 D，答案为 AD。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27545", "t": 2, "q": "下列属于系统软件的有（     ）。", "a": ["UNIX", "DOS", "CAD", "Excel", "", ""], "r": "AB", "e": "【定位】第2章 计算机软件基础, 2.1 计算机软件的分类, 知识点1 软件的分类。\n【解析】选项 A：UNIX\n属于系统软件。UNIX 是经典的多用户、多任务操作系统，主要用于服务器、工作站等设备，负责管理计算机的硬件资源（如 CPU、内存、磁盘），并为上层应用软件（如数据库、开发工具）提供运行支持，符合系统软件的 “基础性管理” 定位。\n选项 B：DOS\n属于系统软件。DOS（如 MS-DOS）是早期的单用户、单任务操作系统，是个人计算机的第一代主流操作系统，负责处理基本的输入输出（如文件管理、命令执行），为早期应用软件（如简单的编程工具、小游戏）提供运行环境，本质是系统软件。\n选项 C：CAD\n属于应用软件。CAD（计算机辅助设计，如 AutoCA\nD.SolidWorks）是专门用于 “工程设计、图形绘制” 的软件，针对 “设计” 这一特定需求开发（如机械设计、建筑绘图），不具备管理计算机资源的功能，属于典型的应用软件。\n选项 D：Excel\n属于应用软件。Excel 是微软 Office 套件中的 “电子表格软件”，用于数据录入、计算、分析（如制作报表、数据可视化），针对 “办公数据处理” 这一特定需求，属于办公类应用软件，而非系统软件。\n综上，属于系统软件的选项为 A、B，答案为 AB。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27546", "t": 2, "q": "操作系统的功能模块包括（     ）。", "a": ["存储管理", "设备管理", "文件管理", "作业管理", "", ""], "r": "ABCD", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点1 概述。\n【解析】操作系统一般由五个功能模块组成，分别是处理机管理、存储管理、设备管理、文件管理和作业管理。操作系统直接运行在裸机上，任何其他软件必须在操作系统的支持下才能运行。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27547", "t": 2, "q": "程序设计语言包括（     ）。", "a": ["机器语言", "汇编语言", "解释语言", "高级语言", "", ""], "r": "ABD", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】程序设计语言按层次分为三类：\nA.机器语言：二进制指令，计算机直接执行。\nB.汇编语言：助记符形式的低级语言，需汇编成机器语言。\nD.高级语言：接近自然语言的编程语言（如\nC.Java），需编译或解释。\nC.解释语言并非独立类别，而是高级语言的一种执行方式，因此不选。\n故答案为ABD。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27548", "t": 2, "q": "语言处理程序一般是由（     ）组成。", "a": ["汇编程序", "高级程序", "编译程序", "解释程序", "", ""], "r": "ACD", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】语言处理程序一般是由汇编程序、编译程序、解释程序和相应的操作程序等组成。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27549", "t": 2, "q": "<p>下列关于C语言的描述中正确的有（ ）。<\/p>", "a": ["<p>C语言的数据类型包括基本类型、构造类型、指针类型、空类型<\/p>", "<p>C语言所有变量必须先声明再使用<\/p>", "<p>不能将整形常量赋值给字符型变量<\/p>", "<p>C语言的输入和输出是通过语句来实现的<\/p>", "", ""], "r": "AB", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点1 C语言的数据类型、运算符与表达式。\n【解析】选项 A：C 语言的数据类型包括基本类型、构造类型、指针类型、空类型\n正确。C 语言的数据类型体系可明确划分为以下类别：\n基本类型：如int（整数）、char（字符）、float（单精度浮点）、double（双精度浮点）等；\n构造类型：由基本类型组合而成，包括数组、结构体（struct）、共用体（union）、枚举（enum）；\n指针类型：专门用于存储地址的类型（如int*、char*）；\n空类型：即void，用于表示 “无类型”（如无返回值的函数void func()、通用指针void*）。\n该选项完全符合 C 语言的数据类型分类，表述正确。\n选项 B：C 语言所有变量必须先声明再使用\n正确。C 语言遵循 “先声明，后使用” 的原则，变量在使用前必须通过声明明确其类型（如int a; char c;）。这一规则在 C 标准（如 C89、C99）中均有明确规定，未声明的变量直接使用会导致编译错误（即使部分编译器支持旧语法的隐式声明，也不符合标准规范）。\n选项 C：不能将整形常量赋值给字符型变量\n错误。在 C 语言中，char类型本质是 “8 位整数类型”（通常用于表示 ASCII 码），允许将整形常量赋值给字符型变量（只要数值在char的表示范围内，通常是 - 128~127 或 0~255）\n因此，整形常量可以赋值给字符型变量，该选项错误。\n选项 D：C 语言的输入和输出是通过语句来实现的\n错误。C 语言本身没有内置的输入输出语句，输入输出功能是通过标准库函数实现的，这些是函数调用而非语句，因此，该选项混淆了 “函数调用” 与 “语句” 的概念，表述错误。\n综上，正确答案为 AB。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27550", "t": 2, "q": "算法的性质包括（     ）。", "a": ["有穷性", "确定性", "有输入", "易理解", "", ""], "r": "ABC", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】算法具有以下特征：①有穷性；②确定性；③有输入；④有输出；⑤有效性。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27551", "t": 2, "q": "下列均属于Windows文件图片文件的扩展名有（     ）。", "a": ["PEG", "BMP", "JPG", "GIF", "", ""], "r": "BCD", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点3 Windows11操作系统。\n【解析】选项 A：PEG不属于图片文件扩展名。标准图片格式中，与 “PEG” 相关的是 “JPEG”（联合图像专家组格式），其扩展名是 JPG 或 JPEG（而非 PEG）。“PEG” 单独作为扩展名时，并非任何主流图片格式的标识，因此该选项错误。\n选项 B：BMP属于图片文件扩展名。BMP（Bitmap，位图）是 Windows 系统原生支持的 “无损图片格式”，扩展名固定为.bmp，常用于存储高质量图像（如系统图标、简单绘图），无需额外插件即可打开，是典型的 Windows 图片格式。\n选项 C：JPG属于图片文件扩展名。JPG（或 JPEG）是全球最常用的 “有损压缩图片格式”，扩展名通常为.jpg（部分场景也用.jpeg），适用于照片、复杂图像等（如手机拍照、网页图片），Windows 系统默认支持该格式，属于标准图片扩展名。\n选项 D：GIF属于图片文件扩展名。GIF（图形交换格式）是支持 “静态 / 动态图像” 和 “透明背景” 的图片格式，扩展名固定为.gif，常用于表情包、简单动画、网页图标等，Windows 系统原生支持，属于标准图片扩展名。\n综上，属于 Windows 图片文件扩展名的选项为B.C.D，答案为 BCD。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27552", "t": 2, "q": "评定算法优劣的标准包括（     ）。", "a": ["正确性", "时间复杂度", "可读性", "空间复杂度", "", ""], "r": "ABCD", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】评定一个算法的优劣，主要有以下五个标准：①正确性；②时间复杂度；③空间复杂度；④易理解性（可读性）。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27553", "t": 2, "q": "<p>下列属于Windows文件系统格式的是（ ）。<\/p>", "a": ["<p>NTFS<\/p>", "<p>FAT16<\/p>", "<p>FAT32<\/p>", "<p>EXT4<\/p>", "", ""], "r": "ABC", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点3 Windows11操作系统。\n【解析】选项 A：NTFS属于 Windows 文件系统格式。NTFS（New Technology File System）是微软从 Windows NT 系统开始推出的主流文件系统，目前 Windows 10/11 等现代版本默认采用该格式。它支持大分区（最大支持 16EB）、文件权限管理、加密、压缩等高级功能，是 Windows 系统中最核心的文件系统之一。\n选项 B：FAT16属于 Windows 文件系统格式。FAT16 是早期 FAT（File Allocation Table）文件系统的 16 位版本，曾广泛用于 Windows 95、Windows 3.x 等早期 Windows 系统，以及 DOS 系统。它支持的分区容量较小（最大 2GB）、单个文件最大 4GB，虽已逐渐被替代，但仍属于 Windows 原生支持的传统文件系统。\n选项 C：FAT32属于 Windows 文件系统格式。FAT32 是 FAT 系列的 32 位升级版本，在 Windows 98、Windows XP 中得到普及，目前仍常用于 U 盘、移动硬盘等外部存储设备（兼容性强）。它支持的分区容量最大可达 2TB（部分系统限制），单个文件最大 4GB，是 Windows 系统中重要的兼容型文件系统。\n选项 D：EXT4不属于 Windows 文件系统格式。EXT4（Fourth Extended File System）是Linux 系统的主流文件系统，Windows 系统不原生支持 EXT4 格式（需通过第三方工具才能读取 / 写入），因此不属于 Windows 文件系统。\n综上，属于 Windows 文件系统格式的选项为 A.B.C，答案为 ABC。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27554", "t": 2, "q": "<p>在面向对象程序设计中，能够提高代码可复用性和可维护性的包括（ ）。<\/p>", "a": ["<p>多态<\/p>", "<p>封装<\/p>", "<p>继承<\/p>", "<p>消息<\/p>", "", ""], "r": "BC", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】选项 A错误。多态的核心作用是 “提高代码灵活性与扩展性”，而非直接提升可复用性和可维护性。它允许通过父类引用调用子类的重写方法，使代码能统一处理不同子类对象，但不直接减少代码重复（复用）或降低维护成本，因此不属于正确选项。\n选项 B正确。封装是 OOP 的基础特性，核心是 “将数据（属性）与操作数据的方法绑定，隐藏内部实现细节，仅暴露统一接口”：\n可复用性：封装好的类（如User类、Order类）可作为独立模块，在不同项目或代码中直接调用（无需重复编写内部逻辑）；\n可维护性：若需修改类的内部实现（如修改User类的密码加密逻辑），只要对外接口（如setPassword()方法）不变，外部调用代码无需修改，大幅降低维护成本。\n选项 C：正确。继承是 OOP 提升可复用性的核心特性，核心是 “子类可直接复用父类的属性与方法，无需重复编写”：\n可复用性：子类（如Student）继承父类（如Person）后，可直接使用父类的name属性、eat()方法，仅需编写子类特有的逻辑（如study()方法），减少代码冗余；\n可维护性：若父类的通用逻辑需修改（如修改Person类的sleep()方法），所有子类会自动继承修改结果，无需逐个修改子类，降低维护成本。\n选项 D错误。“消息” 是 OOP 中 “对象间交互的机制”（如对象 A 调用对象 B 的方法，本质是向 B 发送消息），它仅描述对象如何通信，而非提升可复用性或可维护性的手段，因此不属于正确选项。\n综上，正确答案为 BC。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27555", "t": 2, "q": "<p>应用软件开发过程中，可行性分析主要包括（ ）。<\/p>", "a": ["<p>法律可行性<\/p>", "<p>经济可行性<\/p>", "<p>技术可行性<\/p>", "<p>社会可行性<\/p>", "", ""], "r": "BCD", "e": "【定位】第2章 计算机软件基础, 2.4 应用软件开发过程, 知识点2应用软件开发过程。\n【解析】选项 A：法律可行性不属于主要可行性类别。法律可行性（如是否符合《数据安全法》《知识产权法》、是否存在法律风险）通常被包含在社会可行性中，是社会可行性的重要子项（社会层面需考量法律合规性、伦理道德等），而非单独作为与经济、技术并列的 “主要可行性分析维度”，因此 A 不选。\n选项 B：经济可行性属于主要可行性类别。经济可行性是软件开发前的核心评估内容，聚焦 “投入与收益的性价比”，具体包括：\n成本估算：开发成本（人力、设备、时间）、维护成本、运营成本；\n收益评估：直接收益（如软件售价、订阅费）、间接收益（如提升效率、降低企业成本）；\n核心判断：经济上是否 “划算”，是否能在预期周期内收回成本并盈利，是决定项目是否启动的关键依据。\n选项 C：技术可行性属于主要可行性类别。技术可行性评估 “项目在技术层面是否可实现”，核心内容包括：\n技术能力：现有开发团队是否掌握所需技术（如 AI 算法、移动端开发、大数据处理）；\n资源支撑：是否具备所需硬件（服务器、测试设备）、软件（开发工具、第三方接口）；\n风险预判：是否存在技术难点（如复杂功能的实现、性能瓶颈），是否有解决方案；\n核心判断：现有技术条件能否支撑项目落地，避免 “技术上无法实现” 导致项目失败。\n选项 D：社会可行性属于主要可行性类别。社会可行性评估 “项目是否符合社会层面的规范与需求”，涵盖范围较广，包括：\n法律合规：是否符合国家 / 地区法律法规（如数据隐私保护、软件著作权）；\n伦理道德：是否违背社会伦理（如不涉及不良信息、不侵犯用户权益）；\n社会接受度：用户是否愿意使用、市场是否有需求、是否符合社会发展趋势（如绿色软件、无障碍设计）；\n核心判断：项目是否与社会环境兼容，避免因社会层面的抵触或合规问题导致项目终止。\n综上，应用软件开发中可行性分析的主要内容为经济可行性、技术可行性、社会可行性，正确答案为 BCD。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27556", "t": 2, "q": "<p>常用的软件测试方法主要包括（ ）。<\/p>", "a": ["<p>数据驱动测试<\/p>", "<p>逻辑驱动测试<\/p>", "<p>事务驱动测试<\/p>", "<p>路径驱动测试<\/p>", "", ""], "r": "AB", "e": "【定位】第2章 计算机软件基础, 2.4 应用软件开发过程, 知识点2应用软件开发过程。\n【解析】选项 A：数据驱动测试属于常用软件测试方法。数据驱动测试是黑盒测试与自动化测试中广泛应用的方法，核心逻辑是：\n将测试数据（如输入值、预期输出值）与测试脚本分离（存储在 Excel、CSV、数据库等文件中）；\n测试脚本通过读取不同组数据 “驱动” 测试执行，无需为每组数据编写单独脚本。\n典型场景：测试登录功能（多组账号密码组合）、表单验证（多组输入合法性校验），可大幅提升测试效率，减少脚本冗余，是自动化测试的核心方法之一。\n选项 B：逻辑驱动测试属于常用软件测试方法。逻辑驱动测试也称为 “基于规格的测试” 或 “行为逻辑测试”，核心是：\n根据软件的逻辑规格说明书（如流程图、状态转移图、业务规则）设计测试用例；\n重点覆盖软件的逻辑分支（如 if-else、循环、多条件判断），确保逻辑正确性。\n典型场景：测试订单状态流转（待支付→已支付→已发货）、权限控制逻辑（不同角色的操作权限），是黑盒测试中保障业务逻辑正确性的核心方法，在功能测试中应用广泛。\n选项 C：事务驱动测试不属于常用软件测试方法。“事务” 是数据库或业务流程中的概念（如事务的 ACID 特性），但 “事务驱动测试” 并非行业内公认的独立测试方法分类。它仅在特定场景（如金融系统的交易流程测试）中作为 “业务流程测试” 的细分描述，未被纳入 “常用软件测试方法” 的通用范畴，因此排除。\n选项 D：路径驱动测试不属于常用软件测试方法。软件测试中存在 “路径覆盖测试”（白盒测试的逻辑覆盖准则之一，目标是覆盖程序所有可执行路径），但 “路径驱动测试” 并非标准术语 —— 它未被定义为独立的测试方法，更多是 “路径覆盖” 的非规范表述，且未在行业内广泛应用，因此排除。\n综上，常用的软件测试方法为选项 A、B，答案为 AB。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27557", "t": 2, "q": "<p>下列关于C语言中的控制字符说法正确的是（ ）。<\/p>", "a": ["<p>\\n是回车符<\/p>", "<p>\\a是响铃符<\/p>", "<p>\\？是问号<\/p>", "<p>\\v是横向制表符<\/p>", "", ""], "r": "BC", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点1 C语言的数据类型、运算符与表达式。\n【解析】选项 A：\\n是回车符\n错误。C 语言中，\\n是换行符（New Line），功能是将光标从当前位置移至下一行的开头；而回车符对应的转义字符是\\r（Carriage Return），功能是将光标从当前位置移至当前行的开头（不换行）。二者功能完全不同，选项混淆了换行符与回车符，故错误。\n选项 B：\\a是响铃符\n正确。\\a是响铃符（Alert），属于 C 语言标准控制字符。当程序输出\\a时（如printf(\"\\a\");），系统会触发硬件或软件响铃（如控制台蜂鸣声），用于提示用户（如错误警告），功能与描述完全一致，故正确。\n选项 C：\\?是问号\n正确。C 语言中，?虽可直接书写，但为避免与 “三字母词”（如??!会被编译器解析为|、??(解析为[）冲突，提供了转义形式\\?，其实际表示的字符就是普通问号?（如printf(\"What is this\\?\");输出What is this?），描述正确，故正确。\n选项 D：\\v是横向制表符\n错误。C 语言中，横向制表符对应的转义字符是\\t（Tab），功能是将光标从当前位置移至下一个横向制表位（通常间隔 8 个字符，用于对齐文本）；而\\v是垂直制表符（Vertical Tab），功能是将光标移至下一个垂直制表位（多用于打印机控制垂直换行位置，日常控制台中较少见）。选项混淆了\\t与\\v的功能，故错误。\n综上，正确答案为 BC。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27558", "t": 2, "q": "<p>下列程序段存在的错误类型有（ ）。<\/p>\n<p>main()<\/p>\n<p>{int ha,hb;float hc;<\/p>\n<p>&nbsp;scanf(“%d%d”,&amp;ha,&amp;hb);<\/p>\n<p>&nbsp;hv=abs(ha+hb)<\/p>\n<p>&nbsp;printf(“%f”,hc);<\/p>\n<p>}<\/p>", "a": ["<p>Syntax Error<\/p>", "<p>Type Error<\/p>", "<p>Undeclared Identifie<\/p>", "<p>Missing Header File<\/p>", "", ""], "r": "ABCD", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点5 C语言常见编译错误类型。\n【解析】A. Syntax Error：hv=abs(ha+hb) 行末缺少分号；scanf 与 printf 使用了中文引号（应使用英文 \"）。\nB. Type Error：abs() 返回整型，若赋值给浮点变量需类型转换（如 hv 应为 hc 的笔误）。\nC. Undeclared Identifier：hv 未声明。\nD. Missing Header File：未包含 stdio.h（scanf/printf）与 stdlib.h（abs）。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27559", "t": 2, "q": "良好的程序设计风格要求（     ）。", "a": ["程序的清晰第一、效率第二", "程序的可读性好,要有必要的注释", "人机界面简洁明了", "程序格式严谨", "", ""], "r": "ABD", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点2 高级程序的开发。\n【解析】A项正确：良好的程序设计风格首要目标是清晰易懂，便于他人理解和维护，效率应在保证清晰的前提下再考虑优化，即“清晰第一，效率第二”。\nB项正确：可读性是良好风格的核心，必要的注释有助于说明程序逻辑、功能及关键算法，是提高可读性的重要手段。\nC项错误：人机界面（UI/UX）属于软件工程中用户交互设计的范畴，虽然重要，但不属于“程序设计风格”这一概念的内涵。程序设计风格主要关注代码结构、命名、注释、排版等方面。\nD项正确：程序格式严谨（如统一缩进、一致命名规范、清晰的括号对齐等）是良好风格的基本要求，有助于减少错误并提高可维护性。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27560", "t": 2, "q": "Unix操作系统是一种（     ）。", "a": ["实时操作系统", "多道批处理系统", "分时操作系统", "网络操作系统", "", ""], "r": "CD", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点2 操作系统的类别。\n【解析】Unix是一种分时、且支持网络操作系统。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27561", "t": 2, "q": "操作系统的功能包括：处理机管理、（     ）管理、设备管理、文件管理等。", "a": ["进程", "存储器", "硬件", "软件", "", ""], "r": "AB", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点1 概述。\n【解析】操作系统除了具有人机接口的功能，还具有：处理机管理、存储管理、设备管理、文件管理、进程管理等功能。因此，正确答案为AB。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27562", "t": 3, "q": "Word2016中，在页眉和页脚中除了能插入文字和页码外，还可以插入图片。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点4 Word。\n【解析】在 Word 2016 中，进入页眉 / 页脚编辑模式后（双击文档顶部 / 底部的页眉 / 页脚区域，或通过 “插入” 选项卡→“页眉”/“页脚”），可通过以下步骤插入图片：\n激活 “页眉和页脚工具 - 设计” 选项卡（进入编辑模式后自动显示）；\n在该选项卡的 “插入” 组中，点击 “图片” 按钮；\n在弹出的 “插入图片” 对话框中，选择本地图片文件（如公司 logo、水印图），点击 “插入” 即可将图片添加到页眉或页脚中；\n插入后，还可调整图片的大小、位置、环绕方式（如衬于文字下方作为水印），完全支持图片的常规编辑操作。\n因此，题干中 “在页眉和页脚中除了能插入文字和页码外，还可以插入图片” 的描述符合 Word 2016 的实际功能，说法正确。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27563", "t": 3, "q": "按“Windows+E”组合键，可以打开“Windows 资源管理器”窗口。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点3 Windows11操作系统。\n【解析】在所有主流 Windows 版本（如 Windows 7、Windows 10、Windows 11）中，“Windows 键（⊞）+ E” 是系统预设的快捷键，其唯一默认功能就是打开 “文件资源管理器”（早期版本曾称 “Windows 资源管理器”，名称虽有微调，但功能完全一致 —— 用于管理电脑中的文件、文件夹、磁盘驱动器等）。\n无需额外设置，按下该组合键后会直接弹出资源管理器窗口，显示 “此电脑”“快速访问” 等核心目录，是 Windows 中最常用的文件管理入口快捷键之一，功能稳定且无版本兼容性问题。\n因此，题干中 “按‘Windows+E’组合键，可以打开‘Windows 资源管理器’窗口” 的描述完全符合 Windows 系统的实际操作，说法正确。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27564", "t": 3, "q": "操作系统是最重要的计算机系统软件。如果没有操作系统的支持，一般用户无法正常使用这些通用的微型计算机。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点1 概述。\n【解析】从操作系统的核心定位和用户使用计算机的依赖关系两方面分析：\n1. 操作系统是最重要的计算机系统软件\n系统软件的核心作用是 “管理硬件资源、为应用软件提供运行环境”，而操作系统（OS）是系统软件的核心与基础：\n它直接控制 CPU、内存、磁盘、显卡等硬件设备的调度与分配，避免硬件资源冲突；\n它为浏览器、Office、游戏等应用软件提供统一的运行接口（如 Windows 的 API、Linux 的系统调用），没有操作系统，任何应用软件都无法启动。\n在系统软件（操作系统、语言处理程序、数据库管理系统等）中，操作系统是 “承上启下” 的关键，因此是 “最重要的计算机系统软件”，该表述正确。\n2. 没有操作系统支持，一般用户无法正常使用通用微型计算机\n通用微型计算机（如个人电脑、笔记本）的 “裸机”（仅硬件无软件）不具备任何用户可交互的功能：\n裸机仅能识别机器语言（二进制指令），一般用户无法通过直接编写机器语言操作硬件；\n操作系统通过图形界面（如 Windows 的桌面）或命令行界面，将复杂的硬件操作转化为用户易懂的操作（如点击图标、拖拽文件），并支持应用软件运行。\n因此，没有操作系统，一般用户无法完成任何日常使用场景（如办公、娱乐、上网），该表述正确。\n综上，题干说法完全正确。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27565", "t": 3, "q": "将高级语言源程序变为可执行程序必须经过翻译程序翻译。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】高级语言（如C.Java、Python 等）编写的源程序是 “人类可读的代码”，而计算机硬件仅能识别和执行机器语言（二进制指令），二者存在 “语言层级差异”。要让高级语言源程序最终能被计算机执行（变为可执行程序或可运行状态），必须通过 “翻译程序” 将其转换为机器语言：\n对于编译型语言（如C.C++），需通过 “编译器” 将源程序一次性翻译成目标代码（机器语言），再经 “链接器” 链接系统库文件，最终生成可执行程序（如.exe 文件）；\n对于解释型语言（如 Python、JavaScript），虽无需提前生成完整可执行程序，但执行时需通过 “解释器” 逐行将源程序翻译成机器语言并即时执行，本质仍是 “翻译过程”。\n无论编译型还是解释型高级语言，若不经过翻译程序（编译器或解释器）的转换，源程序无法被计算机理解和执行。因此，题干说法正确。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27566", "t": 3, "q": "操作系统的功能之一是提高计算机的运行速度。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点1 概述。\n【解析】操作系统的核心功能是 “资源管理与调度”，而非 “提高计算机的运行速度”（运行速度是硬件固有属性或软件优化的结果）。题干说法错误。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27567", "t": 3, "q": "在Windows中，位图文件的扩展名是.JPG。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点3 Windows11操作系统。\n【解析】在Windows中，位图文件的扩展名是.BMP。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27568", "t": 3, "q": "分时操作系统是对外来的作用和信号在限定的时间范围内做出响应的系统。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点2 操作系统的类别。\n【解析】题干中 “对外来的作用和信号在限定的时间范围内做出响应”，是实时操作系统的核心特性：\n实时操作系统需处理 “实时事件”（如工业设备的传感器信号、航空航天的控制指令），必须在严格的 “截止时间” 内完成响应和处理（否则可能导致设备故障、安全事故）；\n例如，汽车的防抱死系统（ABS）需在检测到车轮抱死信号后，毫秒级内调整刹车力度，这依赖实时操作系统的 “限时响应” 能力，而非分时操作系统。\n题干将 “实时操作系统的特性” 错误归为 “分时操作系统”，说法错误。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27569", "t": 3, "q": "启动计算机时，打开系统电源，计算机将不对主要硬件设备进行检测，而直接进入操作系统。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点1 概述。\n【解析】题干中 “不对主要硬件设备进行检测，而直接进入操作系统” 的描述，完全违背了计算机启动的基本流程 —— 硬件自检是保障系统稳定启动的前提，无法跳过。因此该说法错误。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27570", "t": 3, "q": "PowerPoint中预选定义了幻灯片的背景色彩，文本格式，内容布局，称为幻灯片的版式。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点6 PowerPoint。\n【解析】题干将 “幻灯片主题” 的功能（背景色彩、文本格式 + 内容布局）错误归为 “幻灯片版式” 的定义，而版式仅聚焦 “内容布局”，不包含背景和文本格式。因此该说法错误。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27571", "t": 3, "q": "UNIX是一种多用户单任务的操作系统。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.2 操作系统基本概念和功能, 知识点2 操作系统的类别。\n【解析】题干中 “多用户单任务” 的描述与 UNIX 的实际特性完全矛盾 ——UNIX 是典型的多用户、多任务操作系统，而非 “单任务”。因此该说法错误。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27572", "t": 3, "q": "汇编语言和机器语言都属于低级语言,之所以称为低级语言是因为用它们编写的程序可以被计算机直接识别执行。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.3 高级程序的开发与执行, 知识点1 程序和程序设计语言。\n【解析】题干前半部分（汇编语言和机器语言属于低级语言）正确，但后半部分（低级语言的命名原因是 “可直接执行”）错误，整体说法不成立。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27573", "t": 3, "q": "软件工程的目标是在规定的成本和时间内，开发出令用户满意的、高质量的软件产品。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章 计算机软件基础, 2.4 应用软件开发过程, 知识点2应用软件开发过程。\n【解析】题干准确概括了软件工程的核心目标 —— 在资源约束（成本、时间）下，交付满足用户需求、具备高质量的软件产品，与软件工程的定义和实践完全一致。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27574", "t": 3, "q": "C语言中，循环控制一共提供了4种语句。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点4 循环程序设计。\n【解析】题干中 “循环控制一共提供了 4 种语句” 的描述与 C 语言标准语法矛盾，实际仅有 3 种循环控制语句。因此该说法错误。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27575", "t": 3, "q": "C语言中，逗号运算符a=2+8,a%5的值为2。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点1 C语言的数据类型、运算符与表达式。\n【解析】题干声称 “逗号运算符a=2+8,a%5的值为 2”，但实际计算结果为0，核心错误是对 “a%5的取余结果判断错误”（10%5=0≠2），同时未正确理解逗号表达式 “取最右侧值” 的规则。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27576", "t": 3, "q": "C语言中使用输入输出函数时，必须包含头文件”stdio.h”。 （     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点1 C语言的数据类型、运算符与表达式。\n【解析】题干中 “必须包含 stdio.h” 的表述过于绝对，存在无需包含也能使用 I/O 函数的非标准场景，因此说法错误。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27577", "t": 3, "q": "C语言提供了4种逻辑运算：与、或、非、异或。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点1 C语言的数据类型、运算符与表达式。\n【解析】C 语言的逻辑运算仅有 3 种（与、或、非），异或属于位运算，并非逻辑运算。题干中 “4 种逻辑运算” 的说法错误。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27578", "t": 3, "q": "scanf函数的一般形式为：scanf(格式控制，输入表列)。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点2 顺序程序设计。\n【解析】scanf函数的核心要求是 “输入项必须为地址”，而题干中 “输入表列” 的表述未体现这一关键特性，存在歧义且不严谨，不符合scanf函数的标准定义。因此该说法错误。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27579", "t": 3, "q": "C语言中++i的作用是先使用i的值，再加1。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点1 C语言的数据类型、运算符与表达式。\n【解析】题干混淆了前缀自增（++i）与后缀自增（i++）的运算逻辑，++i 的作用是 “先加 1，后使用”，而非 “先使用，再加 1”。因此该说法错误。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27580", "t": 3, "q": "C语言中，将一个小写字母加上32即可转换成其对应的大写字母。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.5 C程序设计基础, 知识点2 顺序程序设计。\n【解析】题干中 “将小写字母加上 32 转换成大写字母” 的说法错误，正确操作应为 “减去 32”。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "27581", "t": 3, "q": "应用软件的开发过程中，编程是最重要，耗时最长，也是最困难的。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章 计算机软件基础, 2.4 应用软件开发过程, 知识点2应用软件开发过程。\n【解析】题干中 “编程是最重要、耗时最长、最困难的” 说法不符合软件开发生命周期的实际规律，各阶段相互依赖，前期的需求分析和设计、后期的维护等阶段在重要性、耗时或难度上均不逊色于编程。", "l3": "计算机基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}]}, {"k": "计算机基础||第3章", "n": "计算机基础 / 第3章", "qs": [{"id": "28048", "t": 1, "q": "计算机网络是一个（     ）。", "a": ["管理信息系统", "编译系统", "在协议控制下的多机互联系统", "网上购物系统", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.1 计算机网络定义, 知识点1 计算机网络概述。\n【解析】计算机网络是以能够相互共享资源的方式互连起来的自治计算机系统的集合，也即在协议控制下的多机互联系统。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28049", "t": 1, "q": "计算机网络是计算机技术和（     ）。", "a": ["自动化技术的结合", "通信技术的结合", "电缆等传输技术的结合", "信息技术的结合", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.1 计算机网络定义, 知识点1 计算机网络概述。\n【解析】计算机网络是计算机技术和通信技术的结合。正确答案为B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28050", "t": 1, "q": "计算机网络是通过通信媒体，把各个独立的计算机互相连接而建立起来的系统。它实现了计算机与计算机之间的资源共享和（     ）。", "a": ["屏蔽", "独占", "通信", "交换", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.1 计算机网络定义, 知识点1 计算机网络概述。\n【解析】计算机网络是把各个独立的计算机互相连接而建立起来的系统。它实现了计算机与计算机之间的资源共享和通信。正确答案为C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28051", "t": 1, "q": "计算机网络中，可以共享的资源是（     ）。", "a": ["硬件和软件", "软件和数据", "外设和数据", "硬件、软件和数据", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.1 计算机网络定义, 知识点1 计算机网络概述。\n【解析】计算机网络中可以共享的资源包括：硬件、软件和数据文件。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28052", "t": 1, "q": "以下不属于计算机网络的主要功能的是（     ）。", "a": ["专家系统", "数据通信", "分布式信息处理", "资源共享", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点1 计算机网络系统的组成与功能。\n【解析】计算机网络的主要功能有数据通信、资源共享、以及分布式信息处理等，而专家系统是一个智能计算机程序系统，它应用人工智能技术和计算机技术，根据某领域一个或多个专家提供的知识和经验，进行推理和判断，模拟人类专家的决策过程，以便解决那些需要人类专家处理的复杂问题，因此，不属于计算机网络的主要功能。正确答案为A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28053", "t": 1, "q": "计算机网络最突出的优点是（     ）。", "a": ["资源共享和快速传输信息", "高精度计算和收发邮件", "运算速度快和快速传输信息", "存储容量大和高精度", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.1 计算机网络定义, 知识点1 计算机网络概述。\n【解析】计算机网络是计算机技术和通信技术相结合的产物，通过计算机网络，可以实现资源共享和信息的快速传输。正确答案为A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28054", "t": 1, "q": "计算机网络从逻辑上可划分为（     ）。", "a": ["服务器和客户机", "局域网、城域网和广域网", "通信子网和资源子网", "树型网和星型网", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点1 计算机网络系统的组成与功能。\n【解析】从逻辑上划分，计算机网络分为两个部分：通信子网、资源子网。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28055", "t": 1, "q": "计算机网络分为局域网、城域网和广域网，其划分的依据是（     ）。", "a": ["网络的使用功能", "网络覆盖的地理范围", "网络的通信原理", "网络的拓扑结构", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】按网络覆盖地理范围，计算机网络可分为：局域网、城域网和广域网。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28056", "t": 1, "q": "下列四项中表示域名的是（   ）。", "a": ["mail.licha.edu.cn", "hk@zj.school.com", "zjwww@china.com", "http://202.96.68.1234", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点4 域名系统。\n【解析】符合域名结构特点的为A选项；\nB.C选项符合E-mail地址的特点，D选项不符合域名结构特点。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28057", "t": 1, "q": "主机甲向主机乙发送一个TCP数据段，其序号字段值为200，确认号字段值为100，数据部分长度为300字节。则主机乙收到该数据段后，向主机甲发回的确认数据段中，确认号字段值应为（  ）。", "a": ["200", "300", "400", "500", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】 TCP的确认号表示期望收到对方下一个数据段的第一个字节的序号。确认号 = 已成功收到的数据序号 + 数据长度。主机乙收到序号为200、长度为300字节的数据段，即收到了序号200到499的字节，下一个期望收到的字节序号为500。因此主机乙发回的确认号应为500。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28058", "t": 1, "q": "局域网具有的几种典型的拓扑结构中，一般不含（     ）。", "a": ["星型", "环型", "总线型", "全连接网型", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】局域网常用的拓扑结构有：星型、环型、总线型。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28059", "t": 1, "q": "计算机网络中，若所有的计算机都连接到一个中心节点上，当一个网络节点需要传输数据时，首先传输到中心节点上，然后由中心节点转发到目的节点，这种连接结构称为（     ）。", "a": ["总线结构", "环型结构", "星型结构", "网状结构", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】题中所述网络连接特征为典型的星型拓扑结构。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28060", "t": 1, "q": "计算机网络中传输介质传输速率的单位是bps，其含义是（     ）。", "a": ["字节/秒", "字/秒", "字段/秒", "二进制位/秒", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】计算机网络中传输介质传输速率的单位是bps，即bits per second，二进制位/秒。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28061", "t": 1, "q": "<p>【此题以系统为准】下列度量单位中，用来度量计算机网络数据传输速率（比特率）的是（ ）。<\/p>", "a": ["<p>CPI<\/p>", "<p>MIPS<\/p>", "<p>GHz<\/p>", "<p>Mbps<\/p>", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】计算机网络中传输介质传输速率的最基本单位是bps，较高数量级的有：Kbps、Mbps。正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28062", "t": 1, "q": "“上网访问网站”，就是访问存放在什么上的文件（     ）。", "a": ["网关", "网桥", "Web服务器", "路由器", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】一般常说的“上网访问网站”，是通过客户机上的浏览器软件向Web服务器发送网页资源请求，Web服务器响应用户的请求后，再通过网络将网页资源信息传输并由客户端浏览器解析，最终呈现在用户眼前。因此，正确答案为C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28063", "t": 1, "q": "学校的校园网络属于（     ）。", "a": ["局域网", "广域网", "城域网", "电话网", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】学校的校园网络，覆盖地理范围较小，一般采用局域网连接技术，属于局域网（LAN）。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28064", "t": 1, "q": "Internet是（     ）类型的网络。", "a": ["局域网", "城域网", "广域网", "企业网", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】Internet从网络覆盖地理范围上分类，属于广域网（WAN）。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28065", "t": 1, "q": "下列的英文缩写和中文名字的对照中，正确的是（     ）。", "a": ["ISP——因特网服务程序", "WAN——广域网", "RAM——只读存储器", "USB——不间断电源", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】ISP是因特网服务供应商，RAM是随机存取存储器，USB是通用串行总线。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28066", "t": 1, "q": "一台微型计算机要与局域网连接，必须安装的硬件是（     ）。", "a": ["集线器", "网关", "网卡", "路由器", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】一台微型计算机要与局域网连接，需要使用网卡（全称：网络接口卡，也叫网络适配器）。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28067", "t": 1, "q": "网卡属于计算机的（     ）。", "a": ["存储设备", "打印设备", "显示设备", "网络设备", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】网卡属于网络设备，是计算机连网的必备硬件。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28068", "t": 1, "q": "局域网硬件中主要包括工作站、网络适配器、传输介质和（     ）。", "a": ["Modem", "交换机", "打印机", "中继站", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】交换机是局域网中用于数据转发的通信设备。Modem是计算机通过电话线拨号上网时必须的硬件。中继站通常用在无线网通信中，是一部负责接收并转发无线电信号的电台。正确答案为B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28069", "t": 1, "q": "不属于计算机网络中硬件组成的是（     ）。", "a": ["网线", "网卡", "网络协议", "调制解调器", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】网络协议属于计算机网络中为实现网络中的计算机相互通信而建立的通信规则，可包含在软件部分。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28070", "t": 1, "q": "Modem是计算机通过电话线接入Internet时所必需的硬件，它的功能是（     ）。", "a": ["只将数字信号转换为模拟信号", "只将模拟信号转换为数字信号", "为了在上网的同时能打电话", "将模拟信号和数字信号互相转换", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】Modem，又称为调制解调器，功能是将模拟信号和数字信号互相转换，主要用在计算机通过电话线接入Internet。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28071", "t": 1, "q": "下列属于计算机网络通信设备的是（     ）。", "a": ["显卡", "网线", "音箱", "声卡", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】网线是计算机网络中的传输介质。其他选项是计算机的输出设备。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28072", "t": 1, "q": "计算机网络中常用的有线传输介质有（     ）。", "a": ["双绞线、红外线、同轴电缆", "激光、光纤、同轴电缆", "双绞线、光纤、同轴电缆", "光纤、同轴电缆、微波", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】计算机网络中常用的有线传输介质包括：双绞线、同轴电缆、光纤。正确答案为C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28073", "t": 1, "q": "在计算机网络中，以下均属于无线传输介质的是（     ）。", "a": ["光纤、红外线、卫星", "双绞线、卫星、微波", "微波、卫星、红外线", "激光、无线电波、同轴电缆", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】计算机网络使用的无线传输介质包括：蓝牙、红外线、微波、激光、卫星等。双绞线、同轴电缆、光纤属于有线传输介质。正确答案为C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28074", "t": 1, "q": "计算机网络中常用的传输介质中传输速率最快的是（     ）。", "a": ["双绞线", "光纤", "同轴电缆", "电话线", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】光纤传输的是光信号，光的速度比电流速度快得多。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28075", "t": 1, "q": "在下列网络的传输介质中，抗干扰能力最好的一个是（     ）。", "a": ["光缆", "同轴电缆", "双绞线", "电话线", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】光缆传输光信号，不受外界电磁场的干扰，抗干扰能力强，传输速度快，信号质量好。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28076", "t": 1, "q": "主要用于实现两个不同网络互联的设备是（     ）。", "a": ["转发器", "集线器", "路由器", "调制解调器", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】不同网络之间互联，需要用到路由器，进行路由选择和数据转发。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28077", "t": 1, "q": "能够利用无线移动网络上网的是（     ）。", "a": ["内置无线网卡的笔记本电脑", "部分具有上网功能的手机", "部分具有上网功能的平板电脑", "以上全部", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】内置无线网卡的笔记本电脑、有上网功能的手机和平板电脑，都能利用无线移动网络上网。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28078", "t": 1, "q": "在网络互联中，数据链路层实现互联的存储转发设备是（     ）。", "a": ["中继器", "网桥", "网关", "路由器", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】网桥是数据链路层实现互联的存储转发设备。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28079", "t": 1, "q": "在网络互联中，传输层及其以上高层实现网络互联的设备是（     ）。", "a": ["中继器", "网桥", "网关", "路由器", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】网关是传输层及其以上高层实现网络互联的设备。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28080", "t": 1, "q": "Internet所采用的远程登录服务协议为（     ）。", "a": ["Remote-Login", "R-Login", "Telnet", "FTP", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点1 计算机网络协议。\n【解析】Telnet协议是TCP/IP协议族中的一员，是Internet远程登录服务的标准协议和主要方式。因此，正确答案为C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28081", "t": 1, "q": "局域网中，提供并管理共享资源的计算机称为（     ）。", "a": ["网桥", "网关", "服务器", "工作站", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】局域网中，服务提供对网络中的计算机进行统一管理并提供资源共享。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28082", "t": 1, "q": "所谓互联网，指的是（     ）。", "a": ["大型主机与若干台远程终端相互连接起来", "若干台大型主机相互连接起来", "同种类型的网络及其产品相互连接起来", "同种或异种类型的网络及其产品相互连接起来", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点1 计算机网络协议。\n【解析】互联网是将相同类型或者不同类型的网络胡连起来形成的网络。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28083", "t": 1, "q": "世纪80年代，国际标准化组织颁布了（  ），以此促进了网络互联的发展。", "a": ["TCP/IP", "OSI/RM", "FTP", "SMTP", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】国际标准化组织（ISO）颁布了OSI/RM（开放系统互联/参考模型），促进了网络互联的发展。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28084", "t": 1, "q": "OSI（开放系统互联）参考模型共有（     ）层。", "a": ["4", "5", "6", "7", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】OSI（开放系统互联）参考模型由ISO组织提出，为7层模型。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28085", "t": 1, "q": "OSI（开放系统互联）参考模型的最低层是（     ）。", "a": ["传输层", "网络层", "物理层", "应用层", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】OSI（开放系统互联）参考模型共7层，自底向上分别是：物理层、数据链路层、网络层、传输层、会话层、表示层、应用层。最低层是物理层。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28086", "t": 1, "q": "下列网络攻击方式中，属于被动攻击的是（  ）。", "a": ["篡改报文内容", "伪造身份欺骗", "网络窃听", "拒绝服务攻击", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.5 计算机网络安全, 知识点1 计算机网络安全概述。\n【解析】被动攻击的主要特征是攻击者仅对网络传输的信息进行监听、截获或分析，而不对信息内容或系统状态进行任何修改，因此难以被察觉。网络窃听属于典型的被动攻击。篡改报文、伪造身份和拒绝服务攻击都会对系统或数据造成破坏或改动，均属于主动攻击。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28087", "t": 1, "q": "为实现电脑网络的一个网段的通信电缆长度的延伸，应选择（     ）。", "a": ["网桥", "中继器", "网关", "路由器", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】网段中的通信线缆由于其本身的传输特点，在信号传输过程中会产生信号衰减，中继器的作用是可以放大信号，补偿信号衰减，因此，正确答案为B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28088", "t": 1, "q": "在ISO/OSI参考模型中，网络层的主要功能是（     ）。", "a": ["在通信实体之间传送以帧为单位的数据", "提供可靠的端—端服务，透明地传送报文", "数据格式变换、数据加密与解密、数据压缩与恢复", "路由选择、拥塞控制与网络互连", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】网络层的主要功能是路由选择、拥塞控制与网络互连。正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28089", "t": 1, "q": "计算机之间可以通过各种传输介质相连，常用的传输介质双绞线、同轴电缆和光纤，将它们按传输速度由慢到快来排列，顺序正确的是（     ）。", "a": ["双绞线、同轴电缆、光纤", "同轴电缆、双绞线、光纤", "同轴电缆、光纤、双绞线", "双绞线、光纤、同轴电缆", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】双绞线、同轴电缆和光纤是计算机网络中常用的传输介质。双绞线：3类双绞线的速率为10Mb/S，5类双绞线的速率可达100Mb/S，超5类更可达155Mb/s以上。同轴电缆：1km的同轴电缆可以达到1~2Gbit/s的数据传输速率。光纤：家用的普通光纤就可达到10Gbps以上。当前，实验室中单条光纤最大速度已达到了26Tbps，据说新型材料石墨烯制造的新光调制器还可继续提高10000倍，即260Pbps。因此，总体上，传输速率由慢到快依次是：双绞线、同轴电缆、光纤。正确答案为A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28090", "t": 1, "q": "每一个Web页面，包括主页都有一个唯一的地址，通常称该地址为（     ）。", "a": ["Web页面地址", "主页地址", "网页搜索地址", "统一资源定位器URL", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】在Internet中，每一个网页都有唯一的URL地址，URL即统一资源定位器，用来统一标识各个页面资源。因此，正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28091", "t": 1, "q": "WWW网页文件的编写语言为（     ）。", "a": ["HTML", "HTTL", "HTTP", "以上均不对", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】基本的网页编程语言为HTML（HyperText Markup Language），即超文本标记语言。因此，正确答案为A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28092", "t": 1, "q": "在TCP/IP体系结构中，TCP和IP所提供的服务层次分别为（     ）。", "a": ["应用层和运输层", "运输层和网络层", "网络层和链路层", "链路层和物理层", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】TCP是传输控制协议，工作在运输层；IP是网际协议，工作在网络层。因此，正确答案为B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28093", "t": 1, "q": "TCP/IP协议集中使客户可以灵活地向远地传输文件或从远地取文件的协议为（     ）。", "a": ["Telnet", "SNMP", "DNS", "FTP", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】FTP是文件传输协议，用于在FTP服务器和客户机之间进行文件的下载上传服务。因此，正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28094", "t": 1, "q": "将域名转换为IP地址是由什么服务器完成的 （     ）。", "a": ["WINS", "DHCP", "DNS", "IIS", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点4 域名系统。\n【解析】DNS是域名服务器，专门负责域名与IP地址之间的解析。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28095", "t": 1, "q": "（     ）是计算机连接到Internet时必须安装的协议。", "a": ["TCP/UDP协议", "HTTP协议", "TCP/IP协议", "WWW协议", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】TCP/IP是Internet上使用的最核心的协议，计算机接入Internet，必须要安装该组协议。因此，正确答案为C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28096", "t": 1, "q": "计算机之间的相互通信需要遵守共同的规则（或约定），这些规则叫做（     ）。", "a": ["<p>准则<\/p>", "<p>协议<\/p>", "<p>规范<\/p>", "<p>以上都不是<\/p>", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点1 计算机网络协议。\n【解析】计算机之间的相互通信需要遵守共同的规则（或约定），叫做“协议”。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28097", "t": 1, "q": "在计算机网络中，为了使计算机或终端之间能够正确传送信息，必须按照（     ）来相互通信。", "a": ["信息交换方式", "网卡", "传输装置", "网络协议", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点1 计算机网络协议。\n【解析】计算机网络中，协议是为进行网络中的数据交换二建立的一组规则、标准或约定，是为了确保计算机或终端之间能够正确传送信息。正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28098", "t": 1, "q": "计算机网络是（     ）。", "a": ["通信技术和自动化技术的结合", "计算机技术和信息技术的结合通信技术的结合", "计算机技术和电缆等传输技术的结合", "计算机技术和通信技术的结合", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点1 计算机网络协议。\n【解析】计算机网络是计算机技术和通信技术的结合。正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28099", "t": 1, "q": "域名www. tsinghua.edu.cn中哪个表示主机名（     ）。", "a": ["www", "tsinghua", "edu", "cn", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点4 域名系统。\n【解析】www. tsinghua.edu.cn域名结构中，www表示网站的服务类型是万维网服务，tsinghua是主机名，edu是机构性质域名，cn是国家级域名。因此，正确答案为B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28100", "t": 1, "q": "以下关于主动攻击和被动攻击的描述中，正确的是（  ）。", "a": ["被动攻击比主动攻击更难检测，因此防范的重点应放在被动攻击上", "流量分析属于主动攻击，因为它需要攻击者主动注入探测流量", "主动攻击通常难以预防，但较容易被检测到；被动攻击则相反", "主动攻击和被动攻击的危害程度相同，只是实现方式不同", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.5 计算机网络安全, 知识点1 计算机网络安全概述。\n【解析】 主动攻击（如篡改、伪造、拒绝服务等）会改变系统状态或数据内容，容易被检测到，但往往难以完全预防；被动攻击（如窃听、流量分析等）不改变任何信息，具有隐蔽性，难以检测，但可以通过加密等手段有效预防。选项A颠倒了防范策略的重点；选项B错误，流量分析属于被动攻击；选项D错误，主动攻击通常比被动攻击的危害更直接和严重。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28101", "t": 1, "q": "Internet中，使用浏览器浏览网页，使用的是（     ）的服务。", "a": ["网络接口层", "网际层", "传输层", "应用层", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】Internet为TCP/IP网络，为4层体系结构，最上层的应用层主要面向用户提供应用服务。使用浏览器浏览网页，即通过应用程序获取应用层的服务。因此，正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28102", "t": 1, "q": "Internet主要由四部分组成，其中包括路由器、主机、信息资源与（     ）。", "a": ["数据库", "管理员", "销售商", "通信线路", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点1 计算机网络系统的组成与功能。\n【解析】Internet是覆盖范围最广的计算机网络，有大大小小的不同网络互连组成，需要路由器、主机、信息资源与通信线路共同连接来构成。因此，正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28103", "t": 1, "q": "TCP/IP网络的最上层是（     ）。", "a": ["网络接口层", "网际层", "传输层", "应用层", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】Internet有4层，自底向上依次为：网络接口层、网际层、传输层、应用层。因此，最上层是应用层。因此，正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28104", "t": 1, "q": "管理网络上各结点之间通信的规则称为（     ）。", "a": ["协议", "介质", "服务", "网络操作系统", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点1 计算机网络协议。\n【解析】协议规定了网络结点必须遵循的规则，以便能够理解彼此间的通信内容。因此，正确答案为A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28105", "t": 1, "q": "以下不属于网络操作系统的软件是（     ）。", "a": ["Netware", "WWW", "Linux", "Unix", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点1 计算机网络协议。\n【解析】Netware、Linux、Unix均为网络操作系统。WWW为万维网，是因特网提供的主要服务之一。因此，正确答案为B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28106", "t": 1, "q": "TCP/IP网络中，（     ）可提供路由选择功能。", "a": ["传输层", "数据链路层", "网络层", "物理层", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】网络层的主要功能之一就是进行路由选择。因此正确答案为C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28107", "t": 1, "q": "OSI（开放系统互联）参考模型和TCP/IP体系结构分别是（     ）。", "a": ["4层、5层", "5层、7层", "6层、7层", "7层、4层", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】OSI（开放系统互联）参考模型由ISO组织提出，为7层模型；TCP/IP体系结构是Internet的事实标准，将Internet网从逻辑上划分为4层。因此，正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28108", "t": 1, "q": "在下列网络的传输介质中，需要使用光电转换器的是（     ）。", "a": ["光缆", "同轴电缆", "双绞线", "电话线", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】光缆传输光信号，当需要进行电信号与光信号的相互转换时，需要使用光电转换器。因此，正确答案为A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28109", "t": 1, "q": "以下媒体传输技术中属于无线媒体传输技术的是（     ）。", "a": ["光纤传输技术", "双绞传输技术", "同轴电缆传输技术", "红外线传输技术", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】A.B.C选项属于有线传输介质。红外线属于无线传输。因此，正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28110", "t": 1, "q": "在数据通信中，将数字信号变换为模拟信号的过程称为（     ）。", "a": ["编码", "解码", "解调", "调制", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】将数字信号变换为模拟信号的过程称为“调制”，反之，称为“解调”。因此，正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28111", "t": 1, "q": "能将模拟信号和数字信号互相转换的网络硬件设备是（     ）。", "a": ["网线", "网卡", "网络协议", "调制解调器", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】Modem，又称为调制解调器，功能是将模拟信号和数字信号互相转换，主要用在计算机通过电话线接入Internet。因此，正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28112", "t": 1, "q": "将一个局域网连入Internet，首选的设备是（     ）。", "a": ["路由器", "中继器", "网桥", "网关", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】局域网连入Internet，需要使用网际协议，对应网络层的服务，这种服务是由路由器设备提供的。因此,正确答案为A.。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28113", "t": 1, "q": "一台计算机接入Internet，必须具备的硬件是（     ）。", "a": ["集线器", "网卡", "网关", "路由器", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】网卡（全称：网络接口卡，也叫网络适配器），其作用主要负责接收网络上传过来的数据包，解包后，将数据通过上的总线传输给本地计算机，另一方面它将本地计算机上的数据打包后送入网络。计算机接入网络必须为计算机安装网卡。因此，正确答案为B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28114", "t": 1, "q": "下列正确的选项是（     ）。", "a": ["DNS——因特网服务供应商", "TCP——传输控制协议", "ISP——域名服务器系统", "UDP——用户协议", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点4 域名系统。\n【解析】DNS——域名服务系统，ISP是因特网服务供应商，UDP—用户数据报协议，TCP——传输控制协议。因此，正确答案为B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28115", "t": 1, "q": "Internet上A类网络中最多约可以容纳（     ）台主机。", "a": ["1677万台", "16777万台", "16.7亿台", "16.7亿台", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】A类网络的特点是，32位IP地址中，8位是网络号，24位是主机号，因此一个网络最多约可容纳的主机台数理论上可达224，约为1677万台。因此，正确答案为A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28116", "t": 1, "q": "LAN通常是指（     ）。", "a": ["广域网", "局域网", "资源子网", "城域网", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】选项 A（广域网）：对应英文缩写 WAN（Wide Area Network），覆盖范围广（如跨城市、国家），典型例子是互联网。\n选项 B（局域网）：对应英文缩写 LAN（Local Area Network），覆盖范围小（如家庭、办公室、校园内），特点是传输速度快、延迟低，常见于局部区域的设备互联。\n选项 C（资源子网）：是计算机网络的组成部分（负责提供资源和处理数据，如服务器、终端），并非网络类型，与 LAN 无关。\n选项 D（城域网）：对应英文缩写 MAN（Metropolitan Area Network），覆盖范围介于 LAN 和 WAN 之间（如一个城市）。\n综上，LAN 是 “局域网” 的英文缩写，答案为 B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28117", "t": 1, "q": "（     ）提供资源服务。", "a": ["总线网", "广域网", "资源子网", "通信子网", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点1 计算机网络系统的组成与功能。\n【解析】计算机网站从逻辑上划分为：通信子网和资源子网，其中，资源子网提供软硬件资源服务，通信子网负责信息的传输。因此，正确答案为C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28118", "t": 1, "q": "在计算机网络中，表征数据传输速度的指标是（     ）。", "a": ["误码率", "频带利用率", "信道容量", "传输速率", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】计算机网络中，数据传输率是表征数据传输速度的指标。因此，正确答案为D。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28119", "t": 1, "q": "上面几种结构主要用在计算机局域网的连接中，如果有人问：目前存在的广域网（例如因特网）主要采用（     ）拓扑结构。", "a": ["总线型", "星型", "网状型", "环型", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】因特网作为典型广域网，需满足：\n覆盖范围极广（跨城市、国家甚至全球），节点数量庞大且分散，无法依赖 “总线”“星型中心” 或 “环” 的集中 / 固定结构；\n高可靠性（不能因某条海底光缆中断、某个路由器故障而导致区域断网），网状型的 “多链路冗余” 正好解决这一问题 —— 数据可自动切换到其他可用路径。\n综上，广域网（如因特网）主要采用网状型拓扑结构，答案为 C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28120", "t": 1, "q": "各结点首尾相连形成一个闭合的环，其网络逻辑拓扑结构为（     ）。", "a": ["总线拓扑结构", "星型拓扑结构", "环型拓扑结构", "以上都不是", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】选项 A（总线拓扑结构）：所有节点连接到一条共享的 “总线”（传输介质）上，结构呈线性而非闭合环，不符合 “首尾相连形成闭合环” 的描述。\n选项 B（星型拓扑结构）：以一个中心节点为核心，所有其他节点均与中心节点直接连接，呈放射状，无 “闭合环” 特征。\n选项 C（环型拓扑结构）：核心特征是 “各节点首尾依次连接，形成一个闭合的环形通信链路”，数据沿环单向或双向传输，完全匹配题干描述。\n因此，符合 “各结点首尾相连形成一个闭合的环” 的网络逻辑拓扑结构是环型拓扑结构。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28121", "t": 1, "q": "（     ）是由总线拓扑结构（也包括了星型结构）演变而来的，它看上去像一颗倒挂的树。", "a": ["网状拓扑结构", "树型拓扑结构", "环型拓扑结构", "总线拓扑结构", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】树型结构的形状像一个倒挂的树，根节点只有一个，处在在最上层。因此，正确答案为B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28122", "t": 1, "q": "若网络的各个节点均连接到同一条通信线路上，且线路两端有防止信号反射的装置，这种拓扑结构称为（     ）。", "a": ["总线结构", "环型结构", "星型结构", "网状结构", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】题中所述网络连接特征为典型的总线拓扑结构。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28123", "t": 1, "q": "计算机网络中，速率“100 Mbps”的含义是（  ）。", "a": ["<p>每秒传输100兆字节的数据<\/p>", "<p>每秒传输100兆比特的数据<\/p>", "<p>网络中共有100兆个数据包在传输<\/p>", "<p>网络的最大连接数为100兆个<\/p>", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。 \n【解析】速率是计算机网络中衡量数据传输快慢的性能指标，单位为bps（bit per second，比特每秒）。M代表兆（10⁶），100 Mbps即每秒传输100×10⁶个比特。注意与字节（Byte）区分，1 Byte = 8 bit，因此100 Mbps相当于12.5 MB/s。选项A混淆了比特与字节，选项C和D与速率概念无关。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28124", "t": 1, "q": "计算机网络从网络覆盖范围上可划分为（     ）。", "a": ["服务器和客户机", "局域网、城域网和广域网", "通信子网和资源子网", "树型网和星型网", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】按网络覆盖地理范围，计算机网络可分为：局域网、城域网和广域网。因此，正确答案为B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28125", "t": 1, "q": "关于子网掩码，下列说法错误的是（     ）。", "a": ["屏蔽部分IP地址，区分网络标识和主机标识", "标识一台计算机是处于局域网中还是在远程网络", "子网掩码的位数少于主机的IP地址", "子网掩码相应于网络地址的位为1，相应于主机地址的位为0", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】IP地址中包括两部分信息：网络地址和主机地址。子网掩码可与相应主机的IP地址进行按位与运算，屏蔽主机地址，从而区分网络地址和主机地址；某IP地址的子网掩码，与该主机的IP地址具有相同的长度；子网掩码的位相应于网络地址的位设置为1，相应于主机地址的位设置为0.说法错误的是C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28126", "t": 1, "q": "某主机处在A类网络中，则其IP地址的子网掩码为（     ）。", "a": ["255.0.0.0", "255.255.0.0", "255.255.255.0", "255.255.255.255", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】A类网络中，IP地址的子网掩码为：255.0.0.0；B类网络中，IP地址的子网掩码为：255.255.0.0；C类网络中，IP地址的子网掩码为：255.255.255.0。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28127", "t": 1, "q": "通信技术主要是用于扩展人的（     ）。", "a": ["收集信息功能", "加工信息功能", "传递信息功能", "信息的控制与使用功能", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.1 计算机网络定义, 知识点1 计算机网络概述。\n【解析】通信技术主要用于信息数据的传递。因此，正确答案为C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28128", "t": 1, "q": "Internet为人们提供许多服务项目，最常用的是在各网络站点之间漫游，浏览文本、图形、声音和视频等各种信息，这项服务称为（     ）。", "a": ["网络新闻组", "文件传输", "WWW服务", "电子邮件", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】WWW服务，是Internet为人们提供的一项网页信息浏览服务。正确答案为C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28129", "t": 1, "q": "在OSI七层参考模型中，建立数据链路连接，传输以帧为单位的数据包，并进行差错控制与流量控制的是（    ）。", "a": ["物理层", "数据链路层", "网络层", "传输层", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】OSI七层参考模型中，数据链路层负责建立数据链路连接，传输以帧为单位的数据包，并进行差错控制与流量控制。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28130", "t": 1, "q": "路由选择是OSI参考模型中（   ）的主要功能。", "a": ["网络层 ", "数据链路层 ", "传输层 ", "物理层", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】网络层的主要功能之一就是进行路由选择。因此正确答案为A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28131", "t": 1, "q": "Internet最初创建的目的是（　 ）。", "a": ["经济", "政治", "军事", "教育", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点6 Internet概述。\n【解析】Internet起源于美国的ARPANET军用网，是出于军事目的创建的网络。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28132", "t": 1, "q": "Internet中URL的含义是（   ）。", "a": ["统一资源定位器", "Internet 协议", "简单邮件传输协议", "传输控制协议", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】URL，全称：Universal Resources Locator，即：统一资源定位器。Internet上每个网页都有唯一的URL。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28133", "t": 1, "q": "当你使用WWW浏览页面时，你所看到的文件叫作（   ）文件。", "a": ["DOS", "Windows", "超文本", "二进制", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】WWW服务，即网页浏览服务，网页文件也称为：超文本文件。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28134", "t": 1, "q": "用IE浏览器浏览网页，在地址栏中输入网址时，通常可以省略的是（   ）。", "a": ["http://", "ftp://", "mailto://", "news://", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】在地址栏中输入网址时，通常可以省略的是http协议格式（http://），网页数据传输时默认使用超文本传输协议进行约束。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28135", "t": 1, "q": "地址“ftp://219.231.0.136”中的“ftp”是指（   ）。", "a": ["协议", "网址", "新闻组", "邮件信箱", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】ftp（File Transfer Protocol），是Internet上使用的一种文件传输协议。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28136", "t": 1, "q": "FTP是因特网中（    ）。", "a": ["用于传送文件的一种服务", "发送电子邮件的软件", "浏览网页的工具", "一种聊天工具", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】FTP，是文件传输协议，用于网络上传送文件的一种服务。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28137", "t": 1, "q": "http是一种（    ）。", "a": ["域名", "高级语言", "服务器名称", "超文本传输协议", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】http，即HyperText Transfer Protocol，超文本传输协议。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28138", "t": 1, "q": "SNMP的中文含义为（    ）。", "a": ["公用管理信息协议", "简单网络管理协议", "分布式安全管理协议", "简单邮件传输协议", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】SNMP，Simple Network Manage Protocol，简单网络管理协议。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28139", "t": 1, "q": "SMTP的中文含义为（    ）。", "a": ["公用管理信息协议", "简单网络管理协议", "分布式安全管理协议", "简单邮件传输协议", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】SMTP，Simple Mail Transfer Protocol，简单邮件传输协议。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28140", "t": 1, "q": "连接到Internet的计算机中，必须安装的协议是（   ）。", "a": ["双边协议", "TCP/IP协议", "NetBEUI协议", "SPSS协议", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】Internet使用的基本也是最核心的协议为TCP/IP，因此计算机接入Internet，必须要安装该组协议。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28141", "t": 1, "q": "TCP/IP协议的含义是（   ）。", "a": ["OSI协议集", "拨号入网传输协议", "传输控制协议和网际协议", "局域网传输协议", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】TCP，是传输控制协议；IP，是网际协议。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28142", "t": 1, "q": "TCP协议的主要功能是（    ）。", "a": ["对数据进行分组", "确保数据的可靠传输", "确定数据传输路径", "提高数据传输速度", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】TCP（Transfer Control Protocol），传输控制协议，是为确
