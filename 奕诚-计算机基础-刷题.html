保网络上的计算机之间进行无差错的数据传输。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28143", "t": 1, "q": "提供不可靠的数据传输协议是（　 　）。", "a": ["<p>TCP<\/p>", "<p>UDP<\/p>", "<p>IP<\/p>", "<p>HTTP<\/p>", "", ""], "r": "B", "e": "<p>【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。 【解析】Internet上，传输层的两种协议是TCP和UDP。TCP是可靠的数据传输协议, UDP是不可靠的数据传输协议。此题答案为BC。<\/p>", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28144", "t": 1, "q": "在互联网上，用来发送电子邮件的协议是（　 　）。", "a": ["HTTP", "SMTP", "NFS", "POP3", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】发送电子使用SMTP（中文意思：简单邮件传输协议），POP3是接收邮件协议。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28145", "t": 1, "q": "在因特网上，可以将一台计算机作为另一台主机的远程终端，此服务称为（　 　）。", "a": ["BBS", "E-mail", "Telnet", "FTP", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】Telnet是一种远程登录服务。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28146", "t": 1, "q": "在Internet上广泛使用的WWW是一种（　 　）。", "a": ["网络模式", "网络服务器", "网络主机", "浏览服务模式", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】WWW服务是Internet上最常见的服务类型，即网页浏览服务。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28147", "t": 1, "q": "Internet网中不同网络和不同计算机相互通讯的基础是（   ）。", "a": ["ATM", "TCP/IP", "Novell", "X.25", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】TCP/IP协议主要是供已连接因特网的计算机进行通信的通信协议。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28148", "t": 1, "q": "因特网中IP地址用四组十进制数表示，每组数字的取值范围是（    ）。", "a": ["0～127", "0～128", "0～255", "0～256", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】因特网中IP地址用四组十进制数表示，每组对应8位二进制数，取值范围为：0~255。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28149", "t": 1, "q": "正确的IP地址是（   ）。", "a": ["202.112.10", "202.2.2.2", "202.157.258.15", "202.2.2.2.2", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】32位IP地址通常采用点分十进制表示，每8位一段转换为一个十进制整数，因此，转换结果是4段，而且段间用\".\"分隔，且每段范围不超过0~255。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28150", "t": 1, "q": "下列各项中，非法的Internet的IP地址是（   ）。", "a": ["202.96.12.14", "202.196.72.140", "112.256.23.8", "201.124.38.79", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】32位IP地址采用点分十进制表示，每8位一段转换为一个十进制整数，共分4段，段间用\".\"分隔，且每段范围不超过0~255。因此非法的IP地址是C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28151", "t": 1, "q": "B类IP地址前16位表示网络地址，按十进制来看也就是第一段的取值范围（   ）。", "a": ["大于192、小于256", "大于127、小于192", "大于64、小于127", "大于0、小于64", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】IP地址主要分为五类。D类和E类为特殊用途，A、B、C类可以供用户使用。其中可使用的IP地址范围：A类地址范围：1.0.0.1---126.255.255.254；B类地址范围：128.0.0.1---191.255.255.254；C类地址范围：192.0.0.1---223.255.255.254。由此可见，所列选项B中IP地址是B类地址，选项A为C类地址，选项C、D为A类地址。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28152", "t": 1, "q": "以下所列IP地址是C类地址的是（   ）。", "a": ["24.112.111.1", "202.202.5.10", "190.56.14.12", "5.3.3.250", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】IP地址主要分为五类。A类地址范围：1.0.0.1---126.255.255.254；B类地址范围：128.0.0.1---191.255.255.254；C类地址范围：192.0.0.1---223.255.255.254；D类地址范围：224.0.0.1---239.255.255.254；E类地址范围：240.0.0.1---255.255.255.254。由此可见，所列选项B中IP地址是C类地址，选项A、D为A类地址，选项C为B类地址。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28153", "t": 1, "q": "IPv4地址和IPv6地址的位数分别为（    ）。", "a": ["4，6", "8，16", "32，64", "32128", "", ""], "r": "D", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】IPv4协议使用32位的IP地址，通常按点分十进制格式书写，每8位一段，共4段。IPv6使用128位的IP地址，每16位一段，共8段，使用十六进制格式书写。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28154", "t": 1, "q": "下列关于IP地址的说法中错误的是（    ）。", "a": ["一个IP地址只能标识网络中的唯一的一台计算机", "IP地址一般用点分十进制表示", "地址205.106.256.36是一个合法的IP地址", "同一个网络中不能有两台计算机的IP地址相同", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】32位IP地址采用点分十进制表示，每8位一段转换为一个十进制整数，共分4段，段间用\".\"分隔，且每段范围不超过0~255。因此说法错误的是C。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28155", "t": 1, "q": "IP地址由网络号和主机号两部分组成，用于表示A类地址的主机地址长度是（    ）位二进制数。", "a": ["8", "16", "24", "32", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】IP地址由32位二进制数组成，其中包括两部分信息：网络地址和主机地址。A类地址的网络地址长度是8，主机地址长度是24。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28156", "t": 1, "q": "用于表示B类地址的网络地址长度是（    ）位二进制数。", "a": ["8", "16", "24", "32", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】IP地址由32位二进制数组成，其中包括两部分信息：网络地址和主机地址。B类地址的网络地址长度是16，主机地址长度是16。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28157", "t": 1, "q": "用于表示C类地址的主机地址长度是（    ）位二进制数。", "a": ["8", "16", "24", "32", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】IP地址由32位二进制数组成，其中包括两部分信息：网络地址和主机地址。C类地址的网络地址长度是24，主机地址长度是8。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28158", "t": 1, "q": "某主机处在C类网络中，则其IP地址的子网掩码为（   ）。", "a": ["255.0.0.0", "255.255.0.0", "255.255.255.0", "255.255.255.255", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】B类网络中，IP地址的子网掩码为：255.255.0.0。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28159", "t": 1, "q": "主机的IP地址和主机的域名的关系是（   ）。", "a": ["<p>两者完全是一回事<\/p>", "<p>一一对应<\/p>", "<p>一个IP地址对应多个域名<\/p>", "<p>一个域名对应多个IP地址<\/p>", "", ""], "r": "C", "e": "<p>【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。 【解析】一台主机可申请多个域名。但只能拥有唯一的IP地址。D选项仅在特殊的需做负载均衡场景下可用，不具有普遍性。<\/p>", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28160", "t": 1, "q": "<p>下列哪个IP地址属于C类地址？（ ）<\/p>", "a": ["<p>10.0.0.1<\/p>", "<p>172.16.0.1<\/p>", "<p>192.168.1.1<\/p>", "<p>224.0.0.1<\/p>", "", ""], "r": "C", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】C类地址首位范围192-223。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28161", "t": 1, "q": "<p>在TCP/IP协议族中，哪个协议用于将IP地址映射为MAC地址？（ ）<\/p>", "a": ["<p>ARP<\/p>", "<p>RARP<\/p>", "<p>DNS<\/p>", "<p>ICMP<\/p>", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】ARP（地址解析协议）实现IP到MAC映射。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28162", "t": 1, "q": "<p>以下关于OSI参考模型的描述，正确的是（ ）。<\/p>", "a": ["<p>物理层传输的是数据帧<\/p>", "<p>网络层负责路由选择<\/p>", "<p>传输层提供端到端的可靠传输<\/p>", "<p>会话层负责数据压缩<\/p>", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】A错，物理层传输比特流；C错，TCP提供可靠传输，但传输层也有UDP不可靠；D错，表示层负责压缩。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28163", "t": 1, "q": "<p>以下哪个端口号对应HTTPS服务？（ ）<\/p>", "a": ["<p>80<\/p>", "<p>443<\/p>", "<p>21<\/p>", "<p>25<\/p>", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点5 计算机端口。\n【解析】HTTPS默认端口443。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28164", "t": 1, "q": "<p>下列哪个是Wi-Fi使用的标准？（ ）<\/p>", "a": ["<p>IEEE 802.3<\/p>", "<p>IEEE 802.11<\/p>", "<p>IEEE 802.15<\/p>", "<p>IEEE 802.16<\/p>", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】802.11是无线局域网标准。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28165", "t": 2, "q": "关于Internet，下列说法正确的是（     ）。", "a": ["Internet是完全安全可靠的", "Internet也在不断的发展，下一代Internet也已经出现", "Internet是由许多LAN与WAN组成的", "Internet中有许多商业机会", "", ""], "r": "BCD", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点6 Internet概述。\n【解析】选项 A：错误（Internet 并非完全安全可靠）\nInternet 是一个开放的全球互联网络，其 “开放性” 决定了它不具备 “完全安全可靠” 的属性。实际应用中存在大量安全风险，例如：\n网络攻击：黑客入侵、DDoS 攻击、勒索病毒等；\n数据泄露：用户隐私信息（如个人身份、支付数据）被窃取或非法传播；\n虚假信息：谣言、钓鱼网站、诈骗链接等误导用户。\n选项 B：正确（Internet 持续发展，下一代已出现）\nInternet 并非一成不变，而是处于持续迭代升级中：\n核心技术演进：从早期的 IPv4 协议向IPv6 协议过渡（解决 IPv4 地址耗尽问题，支持更多设备联网）；\n性能与功能拓展：结合 5G/6G、物联网（IoT）、人工智能（AI）、区块链等技术，下一代 Internet（如 “未来互联网”“智慧互联网”）已逐步落地，具备更高带宽、更低延迟、更强安全性的特点；\n应用场景延伸：从传统的信息浏览、通信，拓展到远程医疗、自动驾驶、元宇宙等领域。\n选项 C：正确（Internet 由大量 LAN 与 WAN 组成）\nInternet 的本质是 “全球计算机网络的互联”，其结构基础正是局域网（LAN）和广域网（WAN）：\n局域网（LAN）：覆盖小范围的网络（如家庭 WiFi、公司内网、学校机房网络），是用户直接接入的 “末梢网络”；\n广域网（WAN）：覆盖大范围的网络（如运营商的省际网络、国家骨干网络），负责连接不同地区的 LAN；\n互联机制：通过路由器、交换机等设备，将全球无数的 LAN 和 WAN 连接成一个整体，形成了 Internet。\n选项 D：正确（Internet 蕴含大量商业机会）\nInternet 改变了传统商业模式，催生了众多新的商业形态，例如：\n电子商务：如淘宝、京东、亚马逊等平台，实现 “线上交易”；\n数字服务：如在线教育（新东方在线）、远程办公（钉钉、Zoom）、云计算（阿里云、AWS）；\n内容变现：如短视频带货（抖音、快手）、知识付费（得到、知乎盐选）；\n新兴领域：如区块链金融（DeFi）、元宇宙虚拟资产交易等。\n这些场景均依托 Internet 产生了巨大的商业价值和创业机会，因此 D 选项正确。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28166", "t": 2, "q": "目前在使用的IP地址长度为（     ）。", "a": ["4字节", "8字节", "16字节", "32字节", "", ""], "r": "AC", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】（1）IPv4 地址：对应选项 A（4 字节）\nIPv4 地址的本质是32 位二进制数（如192.168.1.1，实际是11000000.10101000.00000001.00000001）。\n按 “1 字节 = 8 位” 换算：32 位 ÷ 8 = 4 字节，完全匹配选项 A。\n（2）IPv6 地址：对应选项 C（16 字节）\nIPv6 地址的本质是128 位二进制数（如2001:0db8:85a3:0000:0000:8a2e:0370:7334），长度是 IPv4 的 4 倍。\n按 “1 字节 = 8 位” 换算：128 位 ÷ 8 = 16 字节，完全匹配选项 C。\n（3）排除错误选项\n选项 B（8 字节）：对应 64 位，无任何标准 IP 协议使用 64 位地址，排除；\n选项 D（32 字节）：对应 256 位，远超现有 IPv6 的 128 位标准，排除。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28167", "t": 2, "q": "下列关于子网掩码说法正确的是（     ）。", "a": ["使用子网掩码可以进行子网分割或合并", "子网掩码可以单独使用", "标准C类子网掩码是255.255.0.0", "子网掩码是一连串的1加一连串的0组成", "", ""], "r": "AD", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】A正确、子网掩码可通过 “借位” 分割子网，或通过 “缩位” 合并相邻网络（超网聚合）\nB错误、子网掩码必须与 IP 地址配合使用，单独使用无法确定网络范围，无实际意义\nC错误、C 类标准子网掩码为255.255.255.0，255.255.0.0是 B 类标准子网掩码\nD正确、子网掩码二进制格式强制为 “连续 1 + 连续 0”，不允许 1 和 0 交替", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28168", "t": 2, "q": "计算机网络的功能包括（     ）等。", "a": ["数据通信", "均衡负载", "资源共享", "提高性能", "", ""], "r": "ABCD", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点1 计算机网络系统的组成与功能。\n【解析】计算机网络的功能主要是实现计算机之间的资源共享、数据通信，除此之外还有负载均衡、分布式处理和提高性能的功能。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28169", "t": 2, "q": "下列关于IP地址说法正确的是（     ）。", "a": ["每个计算机指定唯一的IP地址", "IP地址一定是32位二进制数", "IP地址具有固定、规范的格式", "IPV4地址可以分成四段", "", ""], "r": "ACD", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】A正确，网络中设备的 IP 地址在其所属网络内必须唯一，避免 IP 冲突\nB错误，IP 地址分 IPv4（32 位）和 IPv6（128 位），并非 “一定是 32 位”\nC正确，IPv4（点分十进制）和 IPv6（冒分十六进制）均有固定规范格式\nD正确，IPv4 地址按 “每 8 位一段” 拆分为 4 段，即 “点分十进制” 的四段结构", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28170", "t": 2, "q": "下列关于端口号说法正确的是（     ）。", "a": ["HTTPS使用443端口", "1024（含）以下的端口称为知名端口", "端口号是16位二进制数", "最大的端口号是65536", "", ""], "r": "AC", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点5 计算机端口。\n【解析】A正确，HTTPS（加密 HTTP）的默认知名端口是 443，HTTP 默认端口是 80\nB错误，知名端口范围是 0-1023（1024 以下，不含 1024），1024 属于注册端口\nC正确，端口号本质是 16 位二进制数，决定其取值范围为 0-65535\nD错误，16 位二进制数的最大值是 65535，最大端口号为 65535（非 65536）", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28171", "t": 2, "q": "星型拓扑结构的优点是（     ）。", "a": ["线路利用率高", "主节点负担轻", "结构简单", "故障隔离容易", "", ""], "r": "CD", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】星型拓扑结构有一个中心节点，结构非常简单，隔离容易，线路利用率非常低，主节点负担比较重。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28172", "t": 2, "q": "下列关于TCP/IP体系结构与网络协议说法正确的有（     ）。", "a": ["wifi协议工作在网络接口层", "UDP工作在传输层", "DHCP工作在网络层", "IGMP工作在应用层", "", ""], "r": "AB", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】选项 A：WiFi 协议工作在网络接口层\nWiFi 是无线局域网技术，负责通过无线信号实现设备与路由器的物理连接（物理层），并处理无线链路的数据帧传输（数据链路层）。而 TCP/IP 的 “网络接口层” 恰好包含了 OSI 模型的 “物理层” 和 “数据链路层”，因此 WiFi 属于网络接口层。A 正确。\n选项 B：UDP 工作在传输层\n传输层的核心协议就是 TCP（面向连接、可靠传输）和 UDP（无连接、不可靠传输），二者均负责 “端到端的端口映射与数据传输”（比如将数据发给目标主机的某个具体应用程序，如 QQ 用 UDP 传消息）。B 正确。\n选项 C：DHCP 工作在网络层\nDHCP（动态主机配置协议）的功能是为终端设备自动分配 IP 地址、子网掩码、网关等网络参数，是专门为 “应用场景（地址分配）” 设计的协议，属于应用层（需通过 UDP 协议承载传输），而非网络层。C 错误。\n选项 D：IGMP 工作在应用层\nIGMP（互联网组管理协议）的功能是让主机向路由器 “报告组播组成员关系”（比如告知路由器 “我需要接收某组播频道的数据流”），属于网络层的控制协议（与 IP 协议协同工作，管理组播路由），而非应用层。D 错误。\n因此，正确答案为 AB。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28173", "t": 2, "q": "UDP协议可以用于（     ）。", "a": ["视频会议", "IOT设备通信", "广播和多播", "在线游戏", "", ""], "r": "ABCD", "e": "【答案】ABCD\n【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】选项 A：视频会议；视频会议对实时性要求极高（需同步传输音视频），而对少量数据丢失的容忍度较高（偶尔丢包可能导致画面短暂模糊，但不影响整体通信）。UDP 无需建立连接、传输延迟低，避免了 TCP 重传机制带来的延迟累积，因此是视频会议的常用协议。A 适用。\n选项 B：IOT 设备通信\n物联网（IOT）设备通常资源有限（如低算力、小内存、窄带宽），且多为简单数据传输（如传感器上报温度、湿度）。UDP 协议简单、开销小（无需维护连接状态、头部信息少），适合资源受限的 IOT 设备，能减少设备能耗和数据传输成本。B 适用。\n选项 C：广播和多播\n广播（一对所有设备）和多播（一对特定组设备）需要 “一对多” 的通信模式，而 TCP 是点对点的连接协议，仅支持 “一对一” 通信，无法实现广播 / 多播。UDP 天然支持广播和多播（通过特定的 IP 地址段实现），因此是这类场景的唯一选择（如局域网内的消息推送、组播流媒体）。C 适用。\n选项 D：在线游戏\n在线游戏（如竞技类、动作类游戏）对实时交互要求极高（如玩家操作、位置同步），延迟过大会严重影响体验。UDP 的低延迟特性可保证操作指令快速传输，即使少量丢包，游戏可通过本地预测等机制弥补（如短暂卡顿后快速同步）；而 TCP 的重传机制会导致数据延迟累积，引发 “画面卡顿”，因此在线游戏多采用 UDP。D 适用。\n综上，UDP 协议可用于所有选项场景，答案为 ABCD。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28174", "t": 2, "q": "下列属于无线传输介质的有（     ）。", "a": ["光纤", "微波", "蓝牙", "激光", "", ""], "r": "BCD", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】选项 A：光纤\n光纤是有线传输介质，通过光信号在玻璃或塑料纤维中传播数据，依赖物理线缆作为传输载体，不属于无线传输。A 不属于。\n选项 B：微波\n微波是一种高频电磁波，可通过空气或空间传播信号（如卫星通信、微波中继站），无需物理线缆，属于典型的无线传输介质。B 属于。\n选项 C：蓝牙\n蓝牙是基于无线电波的短距离无线通信技术，通过电磁波在设备间传输数据（如手机与耳机的连接），无需物理连接，属于无线传输介质。C 属于。\n选项 D：激光\n无线激光通信通过激光束在空间中传输信号（如某些点对点的远距离通信），不依赖物理线缆，属于无线传输介质（区别于光纤中的有线激光传输）。D 属于。\n因此，属于无线传输介质的是 BCD。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28175", "t": 2, "q": "下列常用网络设备和OSI体系结构层次对应关系正确的有（     ）。", "a": ["交换机-数据链路层", "路由器-传输层", "modem-物理层", "网关-网络层", "", ""], "r": "AC", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术\n【解析】选项 A：交换机 - 数据链路层\n交换机的核心功能是根据 MAC 地址转发数据帧，通过维护 MAC 地址表实现局域网内设备的直接通信，处理的是 “帧” 级别的数据单元，对应 OSI 的数据链路层。A 正确。\n选项 B：路由器 - 传输层\n路由器的核心功能是根据 IP 地址进行跨网络路由选择，处理的是 “数据包” 级别的数据单元（包含 IP 地址），对应 OSI 的网络层，而非传输层。B 错误。\n选项 C：modem - 物理层\nModem（调制解调器）的核心功能是实现数字信号与模拟信号的转换（如将电脑的数字信号转为电话线可传输的模拟信号），仅处理物理层的 “比特流” 信号，对应 OSI 的物理层。C 正确。\n选项 D：网关 - 网络层\n网关的核心功能是连接不同体系结构的网络（如 TCP/IP 与其他协议网络），需处理高层协议转换（通常涉及应用层及以上），而非仅工作在网络层。D 错误。\n综上，正确答案为 AC。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28176", "t": 2, "q": "下列网络协议与其中文名称对应正确的有（     ）。", "a": ["ICMP-互联网传输信息协议", "SNMP-简单网络消息协议", "IGMP-互联网组管理协议", "ARP-地址解析协议", "", ""], "r": "CD", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点1 计算机网络协议。\n【解析】选项 A：ICMP - 互联网传输信息协议\nICMP 的英文全称是 Internet Control Message Protocol，标准中文译名为 “互联网控制消息协议”（核心功能是在 IP 网络中传递控制消息，如差错报告），而非 “传输信息协议”。A 错误。\n选项 B：SNMP - 简单网络消息协议\nSNMP 的英文全称是 Simple Network Management Protocol，标准中文译名为 “简单网络管理协议”（用于网络设备的监控与管理），而非 “简单网络消息协议”。B 错误。\n选项 C：IGMP - 互联网组管理协议\nIGMP 的英文全称是 Internet Group Management Protocol，标准中文译名为 “互联网组管理协议”（用于管理 IP 组播成员关系），译名正确。C 正确。\n选项 D：ARP - 地址解析协议\nARP 的英文全称是 Address Resolution Protocol，标准中文译名为 “地址解析协议”（用于将 IP 地址解析为 MAC 地址），译名正确。D 正确。\n综上，正确答案为 CD。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28177", "t": 2, "q": "TCP协议的主要功能包括（     ）。", "a": ["三次握手", "差错检验", "将IP数据包发送至接收者", "数据分割", "", ""], "r": "ABD", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】选项 A：三次握手\nTCP 是面向连接的协议，在数据传输前必须通过 “三次握手” 建立端到端的连接（确认双方收发能力正常），这是 TCP 实现可靠通信的基础流程，属于其核心功能。A 正确。\n选项 B：差错检验\nTCP 通过校验和机制对传输的数据进行差错检验，若发现数据损坏会要求发送方重传，以保证接收数据的准确性，这是实现 “可靠传输” 的关键功能。B 正确。\n选项 C：将 IP 数据包发送至接收者\n将 IP 数据包发送至接收者是IP 协议（网络层） 的核心功能（基于 IP 地址进行路由和转发），而 TCP 工作在传输层，依赖 IP 协议完成底层数据传递，自身不直接负责数据包的发送。C 错误。\n选项 D：数据分割\nTCP 会将应用层发送的大段数据分割为适合网络传输的小数据段（Segment），并为每个段编号，以便接收方重组；同时根据网络状况动态调整分段大小（拥塞控制），这是 TCP 的重要功能。D 正确。\n综上，TCP 协议的主要功能包括 ABD。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28178", "t": 2, "q": "下列属于私有IP地址的有（     ）。", "a": ["172.18.9.10", "127.0.0.1", "192.168.2.1", "11.10.1.1", "", ""], "r": "AC", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】本题考察第三章网络技术基础 第四节计算机网络协议与体系结构 知识点2：TCP/IP。私有IP地址包括三类：A类私有：10开头的所有、B类私有：172.16-172.31的所有、C类私有：192.168开头的所有。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28179", "t": 2, "q": "下列属于HTTP协议特点的有（     ）。", "a": ["无状态", "可扩展", "明文传输", "长连接", "", ""], "r": "ABC", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】选项 A：无状态\nHTTP 是无状态协议，指服务器不会保留客户端的请求历史信息，每次请求都是独立的（服务器无法通过前一次请求推断当前请求的上下文）。这种设计简化了服务器实现，但也导致需要通过 Cookie、Session 等机制来维持状态。A 正确。\n选项 B：可扩展\nHTTP 具有良好的可扩展性，主要体现在：\n支持自定义头部字段（如X-Forwarded-For用于代理转发）；\n可通过方法扩展（如 HTTP/1.1 新增PUT、DELETE等方法）；\n兼容新的功能（如 HTTPS 在 HTTP 基础上添加 TLS 加密层）。B 正确。\n选项 C：明文传输\nHTTP 默认以明文形式传输数据（数据未加密），请求和响应的内容（包括 URL、参数、Cookie 等）可被中间节点（如路由器、代理）直接读取，存在安全隐患。这也是 HTTPS（HTTP+TLS 加密）产生的重要原因。C 正确。\n选项 D：长连接\n长连接（持久连接）并非 HTTP 协议的固有特点：\nHTTP/1.0 默认使用短连接（一次请求 - 响应后关闭连接）；\nHTTP/1.1 通过Connection: keep-alive支持长连接，但这是可配置的特性，而非协议本身的必然特点。\n因此 “长连接” 不属于 HTTP 的核心特点。D 错误。\n综上，HTTP 协议的特点包括 ABC。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28180", "t": 2, "q": "以太网的拓扑结构是（     ）。", "a": ["星型", "总线型", "环型", "树型", "", ""], "r": "AB", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】目前以太网的拓扑结构是星型；早期以太网的拓扑结构是总线型，题目并未明确说明时间，故选AB更为严谨。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28181", "t": 2, "q": "（     ）用于同类局域网之间的互联。", "a": ["中继器", "网桥", "路由器", "网关", "", ""], "r": "AB", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】A. 中继器 (Repeater)：工作在OSI模型的物理层。它的主要作用是放大和再生信号，用于扩展局域网的物理覆盖范围，连接的是同类局域网（相同MAC协议和相同数据速率）。\n\nB. 网桥 (Bridge)：工作在OSI模型的数据链路层。它用于连接两个或多个同类局域网（例如都是以太网），能够根据MAC地址进行帧的过滤和转发，隔离冲突域。\n\nC. 路由器 (Router)：工作在OSI模型的网络层。主要用于连接不同类型的网络（如局域网与广域网，或不同IP子网之间），进行路由选择和分组转发。\n\nD. 网关 (Gateway)：工作在OSI模型的传输层及以上（高层）。用于连接完全不同体系结构的网络，进行协议转换。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28182", "t": 2, "q": "（     ）协议不面向连接，提供的是不可靠的数据传输。", "a": ["TCP", "UDP", "IP协议", "HTTP协议", "", ""], "r": "BC", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】UDP，即：用户数据报协议，提供不可靠的数据传输，它不面向连接；IP协议不保证数据报的可靠传输，可能出现丢失、重复、乱序或错误，且不进行纠错或重传。UDP和IP协议是最常用的两种面向无连接的网络协议。TCP是面向连接的，提供的是可靠数据传输服务。因此，正确答案为BC。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28183", "t": 3, "q": "常用IP地址可以分为A.B.C三类，其中每个C类网主机数最大可达256个。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】C 类网络的最大可用主机数 = 总组合数 - 2 个特殊地址 = 256 - 2 = 254 个，而非题目中所说的 “256 个”。\n综上，该说法错误，答案为 B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28184", "t": 3, "q": "HTML是指超文本标记语言。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】明确 HTML 的英文全称与中文译名的对应关系：\nHTML 的英文全称为 HyperText Markup Language，其中：\nHyperText 对应 “超文本”（指包含链接、多媒体等非纯文本元素的文本形式）；\nMarkup Language 对应 “标记语言”（通过标签标记内容结构，供浏览器解析渲染）。\n其标准中文译名就是 “超文本标记语言”，是用于构建网页结构的核心语言，表述完全准确。\n综上，该说法正确，答案为 A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28185", "t": 3, "q": "HTTP协议的请求-响应模式是黑客DOS攻击的原理。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】黑客实施 DOS 攻击时，常利用 HTTP 的请求 - 响应模式发起 HTTP Flood 攻击（最常见的 DOS 攻击类型之一）：黑客通过工具模拟大量客户端，向目标服务器发送高频、无效或资源消耗大的 HTTP 请求（例如一次性发送数万次请求）。由于服务器需遵循 HTTP 协议，对每一个请求都要进行接收、解析、处理（即使是恶意请求），这些密集请求会迅速耗尽服务器资源 ——耗尽 CPU：用于反复处理请求逻辑；\n耗尽内存：用于缓存请求数据；\n耗尽连接数：服务器最大并发连接数被占满，无法接收合法请求。\n最终服务器因资源耗尽，无法响应正常用户的 HTTP 请求，实现 DOS 攻击的 “拒绝服务” 目的。\n综上，HTTP 协议的请求 - 响应模式是黑客实施 DOS 攻击（尤其是 HTTP Flood 攻击）的核心原理之一，该说法正确。答案为 A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28186", "t": 3, "q": "要组建计算机网络只需要使用传输介质将分散的多台计算机互相连接起来即可。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【解析】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点1 计算机网络系统的组成与功能。仅用传输介质连接计算机，只能实现 “物理上的连接”，无法形成能通信、能共享资源的 “计算机网络”。该说法忽略了网络设备、协议、软件配置等核心要素，因此错误。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28187", "t": 3, "q": "为了解决IP地址不够用的问题，可以使用大量私有IP地址通过NAT接入互联网。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】“用大量私有 IP 地址通过 NAT 接入互联网”，正是通过 “地址复用（私有 IP）+ 地址转换（NAT）” 的组合，从根本上缓解了公网 IP 地址不足的问题，该说法完全正确。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28188", "t": 3, "q": "总线型拓扑结构是将网络中的所有设备通过“T型头”连接到公共总线上，节点之间按广播方式通信。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】1. 总线型拓扑的物理连接方式：通过 “T 型头” 连接公共总线\n总线型拓扑的核心是一条公共传输总线（早期多为同轴电缆），网络中所有设备（如计算机、打印机）需通过专用的 “T 型头” 接口连接到总线上：\n“T 型头” 的一端直接连接设备的网卡；\n另外两端分别接入公共总线的两段，使所有设备共享同一条传输介质。\n这种连接方式是总线型拓扑的典型特征，题干描述完全准确。\n2. 总线型拓扑的通信方式：节点间按广播方式通信\n由于所有设备共享一条总线，当某一节点（如 A 计算机）发送数据时，数据会以广播形式在总线上传输（即数据信号会覆盖总线上的所有节点）。\n每个节点会实时监听总线上的信号，并检查数据帧中的 “目标 MAC 地址”；\n若目标地址与自身地址匹配，则接收并处理数据；若不匹配，则忽略该数据。\n这种 “广播式通信” 是总线型拓扑的固有通信机制，题干描述同样准确。\n综上，题干对总线型拓扑结构的连接方式和通信方式的描述均正确，答案为 A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28189", "t": 3, "q": "计算机网络按作用范围分为广域网，城域网、局域网。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.2 计算机网络的分类, 知识点1 计算机网络的分类。\n【解析】局域网覆盖范围小，一般是10千米以内；城域网覆盖一个城镇；广域网覆盖范围最大，可以从几十千米到几万千来，甚至横跨国家。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28190", "t": 3, "q": "<p>计算机网络可共享的资源包括数据、软件资源，不包括硬件资源。（ ）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点1 计算机网络系统的组成与功能。\n【解析】计算机网络的核心价值之一是 “资源共享”，其共享范围覆盖数据、软件、硬件三类资源，而非仅前两者,硬件资源是计算机网络可共享资源的重要组成部分。因此，该说法错误。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28191", "t": 3, "q": "早期以太网使用CSMA/CD协议解决总线争用问题。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】1. 早期以太网的核心问题：总线争用\n早期以太网（如 10Base2、10Base5 等同轴电缆以太网）采用总线型拓扑结构—— 所有设备通过 “T 型头” 共享一条公共传输总线。这种结构的致命问题是 “总线争用”：多台设备可能同时向总线发送数据，导致不同设备的信号在总线上碰撞（叠加损坏），无法正常传输，必须通过特定协议解决冲突。\n2. CSMA/CD 协议：专门解决总线争用的核心机制\nCSMA/CD（Carrier Sense Multiple Access with Collision Detection，带冲突检测的载波监听多路访问）是早期以太网的 “冲突管理协议”，其工作逻辑完全针对总线争用设计：\n载波监听：设备发送数据前，先 “监听总线”，确认无其他设备的信号（总线空闲）后才尝试发送；\n冲突检测：发送数据时，设备持续监听总线，若检测到信号碰撞（与其他设备数据冲突），立即停止发送并广播 “冲突信号”，避免更多数据损坏；\n退避重试：冲突后，设备通过 “随机退避算法” 等待一段随机时间，再重新尝试发送（避免多设备同时重试再次冲突）。\n通过这一机制，早期以太网有效解决了总线争用问题，保障了多设备共享总线时的数据传输效率。该说法完全正确，答案为 A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28192", "t": 3, "q": "资源子网由各计算机系统、终端控制器和通信设备组成。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点1 计算机网络系统的组成与功能。\n【解析】题干称 “资源子网由各计算机系统、终端控制器和通信设备组成”，核心错误在于：通信设备（如路由器、交换机、网卡）属于通信子网，而非资源子网。\n资源子网的核心是 “与资源相关的设备”（处理或提供资源），通信设备的核心是 “与传输相关的设备”（仅负责数据传递，不直接处理 / 提供资源），二者分属不同子网，不能混淆。\n综上，题干错误将通信设备归入资源子网，说法错误。答案为 B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28193", "t": 3, "q": "调制解调器是完成数字信号到模拟信号的转换作用。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.3 计算机网络的组成与应用, 知识点2 局域网技术。\n【解析】题干仅提及 “数字信号到模拟信号的转换”，完全遗漏了调制解调器的 “解调” 功能（模拟→数字）。而调制解调器的核心价值恰恰是 “同时具备调制和解调能力”，若只有单向转换，无法完成双向通信（如电脑既无法发送数据，也无法接收数据）。\n综上，题干对调制解调器功能的描述不完整，说法错误。答案为 B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28194", "t": 3, "q": "IP协议完成IP数据包的分割与传输。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】① 将 “数据分割”（传输层核心职责）归为 IP 协议；② 将 “传输”（多层协同任务）单一归因于 IP 协议。因此说法错误，答案为 B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28195", "t": 3, "q": "目前使用的IP地址长度为32位与64位。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】题干中提到的 “64 位”，并非任何主流 IP 地址的总长度，而是 IPv6 地址的一种 “分段用途”：IPv6 的 128 位地址通常会拆分为 “前 64 位（网络前缀，标识设备所属网络）” 和 “后 64 位（接口标识，标识网络内的具体设备）”，但这是地址的 “功能分段”，而非 “总长度”。将 “分段长度” 误认为 “总长度”，是题干的核心错误。\n综上，当前使用的 IP 地址长度为 32 位（IPv4）和 128 位（IPv6），而非 “32 位与 64 位”，说法错误。答案为 B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28196", "t": 3, "q": "IPv6除二进制表示外，还可以使用16进制表示。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】IPv6 地址的底层形式是二进制，而面向人类的实用表示是十六进制，二者均为合法且常用的表示方式，题干描述完全准确。答案为 A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28197", "t": 3, "q": "SMTP与POP3协议在建立连接阶段均使用TCP协议。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】SMTP 与 POP3 均为对可靠性要求高的邮件协议，在建立连接阶段均需通过 TCP 协议建立可靠传输通道，题干描述完全准确。答案为 A。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28198", "t": 3, "q": "OSI参考模型中会话层的作用是对数据进行编码、解码、压缩、解压等。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点3 计算机网络体系结构。\n【解析】题干称 “会话层的作用是对数据进行编码、解码、压缩、解压”，核心错误在于：“数据编码、解码、压缩、解压” 是表示层的典型功能，会话层仅负责 “会话管理”（如连接的建立与维护），不涉及数据本身的格式处理或内容转换。\n综上，题干将表示层功能误归为会话层，说法错误。答案为 B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28199", "t": 3, "q": "在TCP/IP体系结构中，负责将IP数据报封装成帧的是数据链路层。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点2 TCP/IP。\n【解析】题干称 “在 TCP/IP 体系结构中，负责将 IP 数据报封装成帧的是数据链路层”，但 TCP/IP 体系的层级定义里 根本没有 “数据链路层” 这一独立层级，对应的功能归属是 “网络接口层”。因此该说法不符合 TCP/IP 体系的层级划分规则。\n综上，题干说法错误，答案为 B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "28200", "t": 3, "q": "Internet起源于美国，其前身是NSFnet。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点6 Internet概述。\n【解析】题干称 “Internet 的前身是 NSFnet”，与历史事实不符 ——Internet 的直接前身是 ARPANET，NSFnet 是后期支撑 Internet 发展的重要骨干网络，并非起源阶段的 “前身”。\n综上，该说法错误，答案为 B。", "l3": "计算机基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}]}, {"k": "计算机基础||第4章", "n": "计算机基础 / 第4章", "qs": [{"id": "28201", "t": 1, "q": "计算机安全是指计算机资产安全，即（     ）。", "a": ["计算机信息系统资源不受自然有害因素的威胁和危害", "信息资源不受自然和人为有害因素的威胁和危害", "计算机硬件系统不受人为有害因素的威胁和危害", "计算机信息系统资源和信息资源不受自然和人为有害因素的威胁和危害", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】我国公安部计算机管理监察司的定义是：计算机安全是指计算机资产安全，即计算机信息系统资源和信息资源不受自然和人为有害因素的威胁和危害。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28202", "t": 1, "q": "计算机信息系统的脆弱性不包括（     ）。", "a": ["硬件", "软件", "数据", "网络协议", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】计算机信息系统的脆弱性是指由于外部的攻击，使计算机系统及其内部存储的软件和数据受到威胁和破坏。包括：硬件、软件和数据三个方面。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28203", "t": 1, "q": "网络安全是在分布网络环境中对（     ）提供安全保护。", "a": ["信息载体", "信息的处理、传输", "信息的存储、访问", "上面3项都是", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】网络安全是分布网络环境中对信息载体、信息的存储和访问、信息的处理和传输提供安全保护。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28204", "t": 1, "q": "网络安全的基本属性是（     ）。", "a": ["机密性", "可用性", "完整性", "上面3项都是", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】网络安全的基本属性有：数据的保密性、完整性和可用性。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28205", "t": 1, "q": "计算机网络按威胁对象大体可分为两种：一是对网络中信息的威胁；二是：（     ）。", "a": ["人为破坏", "对网络中设备的威胁", "病毒威胁", "对网络人员的威胁", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点2 威胁信息安全的因素。\n【解析】计算机网络安全按威胁对象大体可分为两种：物理威胁（即设备设施安全方面的威胁）；逻辑安全（即信息安全方面的威胁）。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28206", "t": 1, "q": "以下哪些属于系统的物理故障：（     ）。", "a": ["硬件故障与软件故障", "计算机病毒", "人为的失误", "网络故障和设备环境故障", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点2 威胁信息安全的因素。\n【解析】网络故障和设备环境故障属于物理故障。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28207", "t": 1, "q": "非对称加密中公私钥都可以加密，在加密场景中，用（     ）进行加密，用（     ）进行解密。", "a": ["<p>公钥，公钥<\/p>", "<p>私钥，私钥<\/p>", "<p>公钥，私钥<\/p>", "<p>私钥，公钥<\/p>", "", ""], "r": "C", "e": "<p>【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。 【解析】非对称加密中公私钥都可以加密，只有真正的接收方才能解密，别人只能加密。因此，用公钥加密，私钥解密。因此，正确答案为C。<br><br>非对称加密，公钥和私钥都可以进行加密。我们真正的数据加密，这个时候用的是公钥加密，用私钥解密。如果反过来用私钥加密，用公钥解密，那这个就不是数据加密，这个叫数字签名。<\/p>", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28208", "t": 1, "q": "数据完整性指的是（     ）。", "a": ["保护网络中各系统之间交换的数据，防止因数据被截获而造成泄密", "提供连接实体身份的鉴别", "防止非法实体对用户的主动攻击，保证数据接受方收到的信息与发送方发送的信息完全一致", "确保数据数据是由合法实体发出的", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】数据完整性是指：防止非法实体对用户的主动攻击，保证数据接受方收到的信息与发送方发送的信息完全一致。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28209", "t": 1, "q": "访问控制是指确定（     ）以及实施访问权限的过程。", "a": ["用户权限", "可给予哪些主体访问权利", "可被用户访问的资源", "系统是否遭受入侵", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】访问控制是指确定用户权限以及实施访问权限的过程。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28210", "t": 1, "q": "信息安全技术具体包括保密性、完整性、可用性和（     ）等几方面的含义。", "a": ["信息加工", "安全立法", "真实性", "密钥管理", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】信息安全技术具体包括：保密性、完整性、可用性、真实性、可控性。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28211", "t": 1, "q": "信息安全技术手段不包括（     ）。", "a": ["加密", "数字签名", "设置只读", "安全协议", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点1 信息安全风险分析。\n【解析】数据加密、数字签名、安全协议都属于信息安全技术手段。“设置只读”不是保护信息安全技术手段。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28212", "t": 1, "q": "可信计算机系统评估准则（TrustedComputerSystemEvaluationCriteria，TCSEC）共分为（     ）大类（     ）级。", "a": ["47", "37", "45", "46", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】TCSEC将计算机系统的安全划分为4大类（D.C.B.A）、7个级别（D.C1，C2，B1，B2，B3和A1）。D类安全等级只包括D1一个级别。D1的安全等级最低。A1的安全等级最高。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28213", "t": 1, "q": "密钥通常用（     ）表示。", "a": ["G", "K", "E", "D", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点1 数据加密的概念。\n【解析】密钥通常用K表示，即“Key”的缩写。因此，正确答案为B。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28214", "t": 1, "q": "从安全属性对各种网络攻击进行分类，阻断攻击是针对（     ）的攻击。", "a": ["机密性", "可用性", "完整性", "真实性", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点2 威胁信息安全的因素\n【解析】从计算机安全属性来看，攻击可分为4类：阻断供给、截获攻击、篡改攻击、伪造攻击等。阻断攻击是系统的资源被破坏，无法提供用户使用，这是针对可用性的攻击。截获攻击是非授权者得到资源的访问，这是针对机密性的攻击。篡改攻击是非授权者不仅访问资源，而且能修改信息，这是一种针对完整性的攻击。伪造攻击是非授权者在系统中插入伪造的信息。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28215", "t": 1, "q": "从安全属性对各种网络攻击进行分类，截获攻击是针对（     ）的攻击。", "a": ["机密性", "可用性", "完整性", "真实性", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点2 威胁信息安全的因素。\n【解析】截获攻击是非授权者得到资源的访问，这是针对机密性的攻击。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28216", "t": 1, "q": "电脑网络系统中广泛使用的DES算法属于（     ）。", "a": ["不对称加密", "对称加密", "不可逆加密", "公开密钥加密", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点2 数据加密算法。\n【解析】对称密钥加密的代表算法是DES，全称为：Data Encryption Standard，即数据加密标准，是一种使用密钥加密的块算法。因此，正确答案为B。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28217", "t": 1, "q": "数字证书采⽤公钥体制，每个⽤户设定⼀把公钥，由本⼈公开，⽤它进⾏（     ）。", "a": ["加密和验证签名", "解密和签名", "加密", "解密", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】数字证书采用公钥体制，即利用一对互相匹配的密钥进行加密、解密。每个用户同时设定一把公钥由本人公开，为一组用户所共享，用于加密和验证签名。每个用户自己设定一个特定的仅为本人所知的私钥，用它进行解密和签名；因此，正确答案为A。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28218", "t": 1, "q": "以下关于防火墙的设计原则说法正确的是（     ）。", "a": ["保持设计的简单性", "不单单要提供防火墙的功能，还要尽量使用较大的组件", "保留尽可能多的服务和守护进程，从而能提供更多的网络服务", "一套防火墙就可以保护全部的网络", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】防火墙的设计原则包括：（1）保持设计的简单性；（2）要计划好一旦防火墙被渗透应该怎么办。因此正确选项为A。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28219", "t": 1, "q": "防止用户被冒名所欺骗的方法是：（     ）", "a": ["进行数据加密", "对信息源发方进行身份验证", "对访问网络的流量进行过滤和保护", "采用防火墙", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】防止用户被冒名所欺骗的方法是对信息源发方进行身份验证，如：数字签名、数字证书。正确选项为B。数据加密是为了防止信息被窃听和篡改；采用防火墙以及对对访问流量进行过滤和保护，是为了防止内部网络被非法访问或入侵。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28220", "t": 1, "q": "一般而言，Internet环境中的防火墙建立在（     ）。", "a": ["每个子网的内部", "内部子网之间", "内部网络与外部网络的交叉点", "以上3个都不对", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】Internet环境中的防火墙，一般建立在内网和外网的连接交叉点，起到隔离内网与外网、防止来自外网的非法侵袭的作用。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28221", "t": 1, "q": "下列关于计算机病毒的叙述中，正确的是（     ）。", "a": ["计算机病毒只感染.exe或.com文件", "计算机病毒可通过读写移动存储设备或通过Internet网络进行传播", "计算机病毒是通过电网进行传播的", "计算机病毒是由于程序中的逻辑错误造成的", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点1 计算机病毒的定义。\n【解析】计算机病毒是指编制者在计算机程序中插入的破坏计算机功能或者破坏数据，影响计算机正常使用并且能够自我复制的一组计算机指令或程序代码。其传播途径包括：移动存储设备、Internet、电子邮件等。文件型病毒的感染对象主要是.exe或.com文件，其他类型的病毒感染的可能是其他对象。因此，正确选项为B。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28222", "t": 1, "q": "在下列4项中，不属于计算机病毒特征的是（     ） 。", "a": ["潜伏性", "传染性", "隐蔽性", "规则性", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点2 计算机病毒的特征。\n【解析】计算机病毒，是指编制者在计算机程序中插入的破坏计算机功能或者破坏数据，影响计算机使用并且能够自我复制的一组计算机指令或者程序代码。具有寄生性、破坏性、传染性、潜伏性和隐蔽性。规则性不属于计算机病毒的特征。因此，正确答案为D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28223", "t": 1, "q": "个人防火墙不包括（     ）。", "a": ["增加了保护级别，不需要额外的硬件资源", "个人防火墙除了可以抵挡外来攻击的同时，还可以抵挡内部的攻击", "个人防火墙对公共网络中的单个系统提供了保护", "防火墙既能对单机提供保护，又能保护网络系统", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】个人防火墙是防止个人电脑中的信息被外部侵袭的一项技术，它能在系统中监控、阻止任何未经授权允许的数据进入或发出到互联网及其他网络系统。个人防火墙不需要特定的网络设备，只要在用户所使用的PC上安装软件即可。个人防火墙把用户的计算机和公共网络分隔开，它检查到达防火墙两端的所有数据包，无论是进入还是发出，从而决定该拦截这个包还是将其放行，是保护个人计算机接入互联网的安全有效措施。由此可见，个人防火墙是保护个人单机，但是它没有保护网络系统的能力。因此，正确答案为D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28224", "t": 1, "q": "防火墙用于将Internet和内部网络隔离，因此它是（     ）。", "a": ["防止Internet火灾的硬件设施", "抗电磁干扰的硬件设施", "保护网线不受破坏的软件和硬件设施", "网络安全和信息安全的软件和硬件设施", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】是通过有机结合各类用于安全管理与筛选的软件和硬件设备，帮助计算机网络于其内、外网之间构建一道相对隔绝的保护屏障，以保护用户资料与信息安全性的一种技术。因此，正确答案为D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28225", "t": 1, "q": "信息安全措施可以分为哪两种？（     ）", "a": ["预防性安全措施和应急性安全措施", "纠正性安全措施和应急性安全措施", "纠正性安全措施和保护性安全措施", "预防性安全措施和保护性安全措施", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点3 信息安全的任务。\n【解析】信息安全措施可以分为预防性安全措施和保护性安全措施两种。预防性安全措施可以降低威胁利用脆弱性导致安全事件发生的可能性，如入侵检测系统；保护性安全措施可以减少因安全事件发生后对组织或系统造成的影响。预防性控制措施可以降低威胁发生的可能性和减少安全脆弱性，而保护性控制措施可以减少因威胁发生所造成的影响。因此，正确答案为D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28226", "t": 1, "q": "密码学的目的是（     ）。", "a": ["研究数据加密", "研究数据解密", "研究数据保密", "研究信息安全", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点1 数据加密的概念。\n【解析】密码学的目的是研究数据加密。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28227", "t": 1, "q": "所谓加密是指将一个信息经过（     ）及加密函数转换，变成无意义的密文，而接受方则将此密文经过解密函数、（     ）还原成明文。", "a": ["加密钥匙、解密钥匙", "解密钥匙、解密钥匙", "加密钥匙、加密钥匙", "解密钥匙、加密钥匙", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点1 数据加密的概念。\n【解析】加密，是将明文，通过某种加密钥匙及加密函数转换以后，得到密文；接收方将收到的密文经过解密函数及解密钥匙还原成明文。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28228", "t": 1, "q": "以下算法中属于非对称算法的是（     ）。", "a": ["DES", "RSA算法", "IDEA", "三重DES", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】常见的非对称加密算法：RSA.DSA（数字签名用）、ECC（移动设备用）、Diffie-Hellman、El Gamal。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28229", "t": 1, "q": "信息安全主要包括五方面的内容，即需保证信息的（     ）、真实性、完整性、未授权拷贝和所寄生系统的安全性。", "a": ["公开性", "共享性", "保密性", "公正性", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】信息安全主要包括以下五个方面，即寄生系统的机密性、真实性、完整性、未经授权的复制和安全性。正确答案为C。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28230", "t": 1, "q": "信息安全主要指那些？（     ）", "a": ["信息存储安全", "信息传输安全", "信息访问安全", "以上都正确", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】信息安全包括：信息存储、信息传输、信息访问方面的安全。因此，正确答案为D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28231", "t": 1, "q": "以下关于对称密钥加密说法正确的是：（     ）。", "a": ["加密方和解密方可以使用不同的算法", "加密密钥和解密密钥可以是不同的", "加密密钥和解密密钥必须是相同的", "密钥的管理非常简单", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点2 数据加密算法。\n【解析】对称加密算法是指加密和解密使用相同密钥的加密算法。常用的对称加密算法包括DES、3DES、AES、DESX、Blowfish、RC4、RC5、RC6。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28232", "t": 1, "q": "以下关于非对称密钥加密说法正确的是：（     ）。", "a": ["加密方和解密方使用的是不同的算法", "加密密钥和解密密钥是不同的", "加密密钥和解密密钥匙相同的", "加密密钥和解密密钥没有任何关系", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点2 数据加密算法。\n【解析】非对称密钥加密，指加密和解密使用不同密钥的加密算法，也称为公私钥加密。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28233", "t": 1, "q": "对称密钥密码体制的主要缺点是：（     ）。", "a": ["加、解密速度慢", "密钥的分配和管理问题", "应用局限性", "加密密钥与解密密钥不同", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】对称密钥密码体制的优点是：加密和解密速度快，数据吞吐率非常高。缺点是：密钥是安全通信核心，发件人必须安全地护送密钥给接受者，不可泄露密钥内容，即属于密钥的分配和管理问题。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28234", "t": 1, "q": "RSA加密技术特点是（     ）。", "a": ["加密方和解密方使用不同的加密和解密算法，但共享同一个密钥", "加密方和解密方使用相同的加密和解密算法，但使用不同的密钥", "加密方和解密方不但使用相同的加密和解密算法，而且共享同一个密钥", "加密方和解密方不但使用不同的加密和解密算法，而且使用不同的密钥", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】RSA使用非对称加密算法，因此，加密方和解密方使用相同的加密和解密算法，但使用不同的密钥。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28235", "t": 1, "q": "以下关于混合加密方式说法正确的是：（     ）。", "a": ["采用公开密钥体制进行通信过程中的加解密处理", "采用公开密钥体制对对称密钥体制的密钥进行加密后的通信", "采用对称密钥体制对对称密钥体制的密钥进行加密后的通信", "采用混合加密方式，利用了对称密钥体制的密钥容易管理和非对称密钥体制的加解密处理速度快的双重优点", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】用对称密码来加密明文，用公钥密码来加密对称密码中所使用的密钥。通过使用混合密码系统，能够将在通信中对称密码与公有密码的优势结合起来。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28236", "t": 1, "q": "在混合加密方式下，真正用来加解密通信过程中所传输数据（明文）的密钥是（     ）。", "a": ["非对称算法的公钥", "对称算法的密钥", "非对称算法的私钥", "CA中心的公钥", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】混合加密方式，是用对称密码来加密明文，用公钥密码来加密对称密码中所使用的密钥。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28237", "t": 1, "q": "加密技术不能实现：（     ）。", "a": ["数据信息的完整性", "基于密码技术的身份认证", "机密文件加密", "基于IP头信息的包过滤", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点1 数据加密的概念。\n【解析】加密技术可保护数据的完整性，也可以对机密文件进行加密。能够实现基于密码技术的身份认证，如电子签名。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28238", "t": 1, "q": "加密有对称密钥加密、非对称密钥加密两种，数字签名采用的是：（     ）。", "a": ["对称密钥加密", "非对称密钥加密", "混合加密技术", "无加密方式", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】数字签名采用的是非对称加密技术。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28239", "t": 1, "q": "非法接收者在截获密文后试图从中分析出明文的过程称为（     ）。", "a": ["破译", "解密", "加密", "攻击", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点1 数据加密的概念。\n【解析】非法接收者在截获密文后试图从中分析出明文的过程称为破译。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28240", "t": 1, "q": "黑客搭线窃听属于哪一类风险？（     ）", "a": ["信息存储安全", "信息传输安全", "信息访问安全", "以上都不正确", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点2 威胁信息安全的因素。\n【解析】黑客搭线窃听主要是窃听通过网络传输的数据，因此会对信息传输安全造成威胁。正确答案为B。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28241", "t": 1, "q": "以下关于数字签名说法正确的是：（     ）。", "a": ["数字签名是在所传输的数据后附加上一段和传输数据毫无关系的数字信息", "数字签名能够解决数据的加密传输，即安全传输问题", "数字签名一般采用对称加密机制", "数字签名能够解决篡改、伪造等安全性问题", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】数字签名就是附加在数据单元上的一些数据，或是对数据单元所作的密码变换。这种数据或变换允许数据单元的接收者用以确认数据单元的来源和数据单元的完整性并保护数据，防止被人(例如接收者)进行伪造。正确的说法是D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28242", "t": 1, "q": "CA指的是：（     ）。", "a": ["证书授权", "加密认证", "虚拟专用网", "安全套接层", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】CA, Certificate Authority，即证书授权。CA认证，即电子认证服务，是指为电子签名相关各方提供真实性、可靠性验证的活动。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28243", "t": 1, "q": "CA认证中心的主要作用是：（     ）。", "a": ["加密数据", "发放数字证书", "安全管理", "解密数据", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】CA认证中心的主要作用是发放和管理数字证书。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28244", "t": 1, "q": "以下关于CA认证中心说法正确的是：（     ）。", "a": ["CA认证是使用对称密钥机制的认证方法", "CA认证中心只负责签名，不负责证书的产生", "CA认证中心负责证书的颁发和管理、并依靠证书证明一个用户的身份", "CA认证中心不用保持中立，可以随便找一个用户来做为CA认证中心", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】CA认证中心负责证书的颁发和管理、并依靠证书证明一个用户的身份。CA认证中心具有权威性和公正性的第三方信任机构，它的作用就像我们现实生活中颁发证件的公司，如护照办理机构。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28245", "t": 1, "q": "关于CA和数字证书的关系，以下说法不正确的是：（     ）。", "a": ["数字证书是保证双方之间的通讯安全的电子信任关系，它由CA签发", "数字证书一般依靠CA中心的对称密钥机制来实现", "在电子交易中，数字证书可以用于表明参与方的身份", "数字证书能以一种不能被假冒的方式证明证书持有人身份", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】数字证书使用的是非对称密钥机制来实现。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28246", "t": 1, "q": "数字证书不包含（     ）", "a": ["颁发机构的名称", "证书持有者的私有密钥信息", "证书的有效期", "CA签发证书时所使用的签名算法", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】数字证书包含：颁发机构的名称、证书的有效期和CA签发证书时所使用的签名算法。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28247", "t": 1, "q": "数字签名是用来作为：（     ）。", "a": ["身份鉴别的方法", "加密数据的方法", "传送数据的方法", "访问控制的方法", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】数字签名是用来作为身份鉴别的方法。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28248", "t": 1, "q": "数字签名与传统的手写签名相比有（     ）的特点。", "a": ["数字签名中的签名同信息是不能分开的", "只有特定的人可以对数字签名进行检验", "任何人都可以对数字签名进行修改", "在数字签名中，有效签名的复制同样是有效的签名", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】数字签名和手写签名的区别：（1）数字签名中的签名同信息是分开的，需要一种方法将签名与信息联系在一起，而在传统的手写签名中，签名与所签署之信息是一个整体；（2）在签名验证的方法上，数字签名利用一种公开的方法对签名进行验证，任何人都可以对之进行检验，而传统的手写签名的验证，是由经验丰富的接收者，通过同预留的签名样本相比较而作出判断的；（3）在数字签名中，有效签名的复制同样是有效的签名，而在传统的手写签名中，签名的复制是无效的。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28249", "t": 1, "q": "以下关于VPN说法正确的是：（     ）", "a": ["VPN指的是用户自己租用线路，和公共网络物理上完全隔离的、安全的线路", "VPN指的是用户通过公用网络建立的临时的、安全的连接", "VPN不能做到信息认证和身份认证", "VPN只能提供身份认证、不能提供加密数据的功能", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】VPN一般指虚拟专用网络。虚拟专用网络(VPN)的功能是：在公用网络上建立专用网络，进行加密通讯。在企业网络中有广泛应用。VPN网关通过对数据包的加密和数据包目标地址的转换实现远程访问。VPN可通过服务器、硬件、软件等多种方式实现。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28250", "t": 1, "q": "VPN的应用特点主要表现在两个方面，分别是（     ）。", "a": ["应用成本低廉和使用安全", "便于实现和管理方便", "资源丰富和使用便捷", "高速和安全", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】VPN的应用特点：应用成本低廉和使用安全。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28251", "t": 1, "q": "计算机病毒是指“能够侵入计算机系统并在计算机系统中潜伏、传播，破坏系统正常工作的一种具有繁殖能力的（     ）”。", "a": ["特殊程序", "源程序", "特殊微生物", "流行性感冒病毒", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点1 计算机病毒的定义。\n【解析】计算机病毒是指“能够侵入计算机系统并在计算机系统中潜伏、传播，破坏系统正常工作的一种具有繁殖能力的特殊程序。”", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28252", "t": 1, "q": "以下关于自主访问控制（DAC）和强制访问控制（MAC）的描述中，正确的是（  ）。", "a": ["DAC比MAC的安全性更高，适用于军事系统", "MAC允许客体的属主自主决定其他用户对该客体的访问权限", "DAC中权限的传递可能导致安全漏洞，而MAC通过标签机制防止权限任意传递", "MAC主要用于商业环境，DAC主要用于军事环境", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】 自主访问控制（DAC）允许客体的所有者自主授予或撤销其他用户对该客体的访问权限，灵活性高，但存在权限传递带来的安全隐患（如权限被恶意扩散）。强制访问控制（MAC）通过为主体和客体分配安全标签，由系统根据标签和规则强制执行访问控制，用户无法自主更改权限，因此安全性更高，常用于军事和高安全等级环境。选项A和D颠倒了二者的安全性及适用场景，选项B描述的是DAC。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28253", "t": 1, "q": "以下关于计算机病毒的特征，说法正确的是：（     ）。", "a": ["计算机病毒只具有破坏性，没有其他特征", "计算机病毒具有破坏性，不具有传染性", "破坏性和传染性是计算机病毒的两大主要特征", "计算机病毒只具有传染性，不具有破坏性", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点2 计算机病毒的特征。\n【解析】计算机病毒的特征包括：传染性、破坏性、寄生性、隐蔽性、不可预见性、变异性。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28254", "t": 1, "q": "在操作系统中，基于“主体—客体”的访问控制模型中，以下属于“客体”的是（  ）。", "a": ["用户进程", "系统管理员", "磁盘文件", "登录用户账号", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】在访问控制模型中，主体是发起访问操作的实体（如用户、进程），客体是被访问的资源（如文件、目录、设备等）。磁盘文件是被访问的资源，属于客体。用户进程、系统管理员和登录用户账号均是发起访问的一方，属于主体。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28255", "t": 1, "q": "计算机病毒的特点具有（     ）。", "a": ["隐蔽性、可激发性、破坏性", "隐蔽性、破坏性、易读性", "潜伏性、可激发性、易读性", "传染性、潜伏性、安全性", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点2 计算机病毒的特征。\n【解析】计算机病毒的特点具有隐蔽性、可激发性、破坏性。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28256", "t": 1, "q": "某入侵检测系统采用基于异常的检测方法，以下关于该方法的描述中，正确的是（  ）。", "a": ["需要定期更新攻击特征库", "能够检测出已知攻击的变种和未知攻击", "误报率通常低于基于特征的检测方法", "只能检测网络层攻击，无法检测应用层攻击", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】基于异常的入侵检测方法通过建立正常行为的基线模型，将偏离正常模型的行为判定为入侵。其优点是能够检测出未知攻击和已知攻击的变种（因为没有依赖特定攻击的特征）。缺点是由于正常行为模型难以精确描述，误报率通常高于基于特征的检测方法。选项A描述的是基于特征的检测；选项C错误，异常检测误报率通常更高；选项D错误，异常检测可应用于多个层次。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28257", "t": 1, "q": "关于计算机病毒，以下说法不正确的是（     ）。", "a": ["计算机病毒能破坏计算机软件", "计算机病毒是正常计算机程序的变种", "计算机病毒能破坏计算机的硬件", "计算机病毒是特别设计的程序段", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点1 计算机病毒的定义。\n【解析】计算机病毒是人为编制的在计算机程序中插入的破坏计算机功能或者破坏数据，影响计算机使用并且能够自我复制的一组计算机指令或者程序代码。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28258", "t": 1, "q": "入侵检测系统（IDS）的主要功能是（  ）。", "a": ["阻止所有网络攻击", "监控网络流量，发现可疑行为并报警", "加密网络通信数据", "代替防火墙进行访问控制", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】 入侵检测系统（IDS，Intrusion Detection System）的核心功能是对网络流量或系统活动进行实时监控，通过特征匹配、异常检测等技术发现潜在的攻击行为或安全威胁，并及时发出警报。IDS本身通常不直接阻断攻击（主动阻止由IPS完成），也不能替代防火墙的访问控制功能。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28259", "t": 1, "q": "下列关于计算机病毒的叙述中，错误的是（     ）。", "a": ["计算机病毒具有潜伏性", "计算机病毒具有传染性", "感染过计算机病毒的计算机具有对该病毒的免疫性", "计算机病毒是一个特殊的寄生程序", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点2 计算机病毒的特征。\n【解析】计算机病毒，是指编制者在计算机程序中插入的破坏计算机功能或者破坏数据，影响计算机使用并且能够自我复制的一组计算机指令或者程序代码。具有寄生性、破坏性、传染性、潜伏性和隐蔽性。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28260", "t": 1, "q": "（     ）是整个计算机网络系统安全的前提。", "a": ["逻辑安全", "物理安全", "防火墙安全", "数字认证", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】计算机网络系统安全的前提是物理安全。物理安全在整个计算机网络信息系统安全中占有重要地位。因此，正确答案为B。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28261", "t": 1, "q": "监督、检查、指导计算机信息系统安全保护工作是（     ）对计算机信息系统安全保护工作行使监督职权之一。", "a": ["电信管理机构", "公安机关", "工商管理部门", "任何个人", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】监督、检查、指导计算机信息系统安全保护工作是公安机关对计算机信息系统安全保护工作行使监督职权之一。因此，正确答案为B。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28262", "t": 1, "q": "信息系统安全保护法律规范的基本原则是（     ）。", "a": ["谁主管谁负责的原则、突出重点的原则、预防为主的原则、安全审计的原则和风险管理的原则", "突出重点的原则、预防为主的原则、安全审计的原则和风险管理的原则", "谁主管谁负责的原则、预防为主的原则、安全审计的原则和风险管理的原则", "谁主管谁负责的原则、突出重点的原则、安全审计的原则和风险管理的原则", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.5 信息安全相关法规, 知识点1 信息安全相关法规。\n【解析】信息系统安全保护法律规范的基本原则：谁主管谁负责、突出重点、预防为主、安全审计和风险管理。因此，正确答案为A。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28263", "t": 1, "q": "以下有关网络安全的表达中，正确的选项是（     ）。", "a": ["网络中的不安全因素主要来自网络外部，网络内部是安全区", "对Internet的威胁分故意危害和无意危害，其中无意危害构不成坏影响", "有害信息侵入是网络的一种不安全因素，而信息泄露不属于安全性范畴", "“防火墙”是指一种将内部网和公众访问网（如Internet）分开的方法", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点2 威胁信息安全的因素。\n【解析】网络外部和内部都存在不安全因素；无意的危害通常是由于合法用户的误操作造成，也可能形成破坏结果；信息泄露会导致安全问题；防火墙主要是借助硬件和软件的作用于内部和外部网络的环境间产生一种保护的屏障。因此，正确答案为D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28264", "t": 1, "q": "不是计算机网络安全的目标的是（    ）。", "a": ["保密性", "完整性", "可用性", "可移植性", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点3 信息安全的任务。\n【解析】计算机网络安全的六大目标：可靠性、保密性、完整性、可用性、不可否认性（或不可抵赖性）和可控性。因此，正确答案为D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28265", "t": 1, "q": "某公司网络管理员配置防火墙规则如下：“禁止所有外部主机访问内部Web服务器的80端口，但允许内部主机对外部任意主机发起HTTP请求的响应数据包通过。”该防火墙最可能采用的实现技术是（  ）。", "a": ["静态包过滤", "状态检测", "应用代理", "网络地址转换", "", ""], "r": "B", "e": "【定位】 第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】状态检测防火墙能够跟踪TCP连接的状态，区分一个数据包是属于内部主机主动发起的新连接，还是外部主机的请求。题目中“允许内部主机对外部任意主机发起HTTP请求的响应数据包通过”需要防火墙维护连接状态表，识别出响应数据包属于已建立的连接。静态包过滤无法区分数据包的方向性和连接状态；应用代理工作在应用层，通常需要为每种应用单独配置代理程序；网络地址转换主要用于IP地址转换，非此题核心功能。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28266", "t": 1, "q": "下面不属于身份认证方法的是（     ）。", "a": ["口令认证", "智能卡认证", "姓名认证", "指纹认证", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】A.B.D选项均是身份认证的方法。姓名认证不属于身份认证方法。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28267", "t": 1, "q": "“信息安全”中的“信息”是指（     ）。", "a": ["以电子形式存在的数据", "计算机网络", "信息本身、信息处理过程、信息处理设施和信息处理都是", "软硬件平台", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】信息是指以电子形式存在的数据。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28268", "t": 1, "q": "计算机染上病毒后可能出现的现象（     ）。", "a": ["系统出现异常启动或经常\"死机\"", "程序或数据突然丢失", "磁盘空间突然变小", "以上都是", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】计算机染上病毒后，会出现程序或数据突然丢失、磁盘空间突然变小以及系统出现异常启动或经常\"死机\"等现象，故答案选D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28269", "t": 1, "q": "下列属于计算机感染病毒迹象的是（     ）。", "a": ["设备有异常现象，如显示怪字符，磁盘读不出", "在没有操作的情况下，磁盘自动读写", "装入程序的时间比平时长，运行异常", "以上说法都是", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】A.B.C选项都有可能是计算机病毒造成的现象。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28270", "t": 1, "q": "<p>计算机病毒的危害性表现在（ ）。<\/p>", "a": ["<p>能造成计算机部分配置永久性失效<\/p>", "<p>影响程序的执行或破坏用户数据与程序<\/p>", "<p>不影响计算机的运行速度<\/p>", "<p>不影响计算机的运算结果<\/p>", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】计算机病毒的危害性在于影响程序的执行或破坏用户数据与程序。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28271", "t": 1, "q": "为确保学校局域网的信息安全，防止来自Internet的黑客入侵，应采用（     ）以实现一定的防范作用。", "a": ["网管软件", "邮件列表", "防火墙软件", "杀毒软件", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】安装防火墙软件可确保局域网的信息安全，防止来自Internet的黑客入侵。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28272", "t": 1, "q": "面对通过互联网传播的计算机新病毒的不断出现，最佳对策应该是（     ）。", "a": ["尽可能少上网", "及时升级防杀病毒软件", "安装还原卡", "不打开电子邮件", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】针对不断出现的新病毒，专家一般建议立即升级系统中的防病毒软件，进行全面杀毒。因此，答案选B。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28273", "t": 1, "q": "以下不属于计算机病毒防治策略的是（     ）。", "a": ["确认您手头常备一张真正“干净”的引导盘", "及时、可靠升级反病毒产品", "新购置的计算机软件也要进行病毒检测", "整理磁盘", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】选项A.B.C均为仿制计算机病毒的基本策略，选项D不是。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28274", "t": 1, "q": "下面列出的计算机病毒传播途径，不正确的是（     ）。", "a": ["使用来路不明的软件", "通过借用他人的U盘", "机器使用时间过长", "通过网络传输", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】计算机病毒传播途径包括：使用来路不明的软件、使用U盘、通过网络传输。计算机病毒与机器使用时间长短无关。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28275", "t": 1, "q": "下列叙述中，正确的是（     ）。", "a": ["计算机病毒只在可执行文件中传染，不执行的文件不会传染", "计算机病毒主要通过读/写移动存储器或Internet网络进行传播", "只要删除所有感染了病毒的文件就可以彻底消除病毒", "计算机杀病毒软件可以查出和清除任意已知的和未知的计算机病毒", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】计算机病毒主要通过移动存储介质（如U盘、移动硬盘）和计算机网络两大途径进行传播。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28276", "t": 1, "q": "为防止计算机病毒传染，应该做到（     ）。", "a": ["无病毒的U盘不要与来历不明的U盘放在一起", "不要复制来历不明U盘中的程序", "长时间不用的U盘要经常格式化", "U盘中不要存放可执行程序", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】不要复制来历不明U盘中的程序是防止计算机病毒传染的途径之一。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28277", "t": 1, "q": "计算机病毒除通过读写或复制移动存储器上带病毒的文件传染外，另一条主要的传染途径是（     ）。", "a": ["网络", "电源电缆", "键盘", "输入有逻辑错误的程序", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】网络是计算机病毒传播的重要途径。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28278", "t": 1, "q": "计算机病毒在一定环境和条件下激活发作，该激活发作是指（     ）。", "a": ["程序复制", "程序移动", "病毒繁殖", "程序运行", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】计算机病毒的激活发作是指病毒程序开始运行。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28279", "t": 1, "q": "下列选项属于“计算机安全设置”的是（     ）。", "a": ["定期备份重要数据", "不下载来路不明的软件及程序", "停掉Guest 帐号", "安装杀（防）毒软件", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】计算机安全设置包括：开启防火墙；电脑用户安全设置；清除上网记录及清除自动完成记录；清除搜索记录。正确选项为C。Guest帐号即所谓的来宾帐号，它可以访问计算机，但受到限制，Guest也为黑客入侵打开了方便之门。如果不需要用到Guest帐号，最好禁用它。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28280", "t": 1, "q": "当计算机上发现病毒时，最彻底的清除方法为（     ）", "a": ["格式化硬盘", "用防病毒软件清除病毒", "删除感染病毒的文件", "删除磁盘上所有的文件", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】最彻底的清除病毒方法是格式化硬盘。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28281", "t": 1, "q": "防病毒程序可以（     ）。", "a": ["防患所有计算机病毒的入侵", "检查和清除所有已知的计算机病毒", "检查和清除大部分已知的计算机病毒", "修复所有被计算机病毒破坏的数据", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】防病毒程序可以检查和清除大部分已知的计算机病毒。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28282", "t": 1, "q": "目前，比较先进的电子政务网站提供基于（     ）的用户认证机制用于保障网上办事的信息安全和不可抵赖性。", "a": ["CA数字身份证书", "用户名和密码", "电子邮件地址", "SSL", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】电子政务网站使用CA数字证书保障信息安全和抵赖行为。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28283", "t": 1, "q": "在电子邮件中，为了验证身份和保证邮件不被更改，可以使用（     ）的方法。", "a": ["加密", "手写签名", "查验身份证", "数字签名", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】为了验证身份和保证邮件不被更改，可以使用数字签名的方法。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28284", "t": 1, "q": "我们通常所说的“网络黑客”，他的行为可以是（     ）。", "a": ["在网上发布不健信息", "制造并传播病毒", "攻击并破坏web网站", "收看不健康信息", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点2 威胁信息安全的因素。\n【解析】网络黑客通常以攻击和破坏Web网站为目的。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28285", "t": 1, "q": "计算机网络物理安全不包括 （     ）。", "a": ["机房安全", "通信线路安全", "设备与电源系统安全", "网络操作系统安全", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点3 信息安全的任务。\n【解析】网络操作系统安全，属于逻辑安全范畴。机房、通信线路、设备与电源为硬件，属于物理安全范畴。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28286", "t": 1, "q": "橘皮书定义了4个安全层次，从D层（最低保护层）到A层（验证性保护层），其中D级的安全保护是最低的，属于D级的系统是不安全的，以下操作系统中属于D级安全的是（   ）。", "a": ["运行非UNIX的Macintosh机", "运行Linux的PC", "UNIX系统", "XENIX", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】运行非UNIX的Macintosh机属于D级安全级别；B、C、D选项均为C2级别。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28287", "t": 1, "q": "关于因特网防火墙，下列叙述中错误的是（    ）。", "a": ["为单位内部网络提供了安全边界", "防止外界入侵单位内部网络", "可以阻止来自内部的威胁与攻击", "可以使用过滤技术在网络层对数据进行选择", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】因特网防火墙的作用是在内部网和外网之间建立隔离设备，阻止来自外部的威胁与攻击。C选项的说法错误。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28288", "t": 1, "q": "防火墙能够是（    ）。", "a": ["防止火灾在建筑物中蔓延", "查杀计算机病毒", "保护内网的数据和资源的安全", "提高网络运行效率", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】防火墙能够对流经它的网络通信进行扫描，过滤掉一些攻击，以免其在目标计算机上被执行；防火墙还可以关闭不使用的端口，还能禁止特定端口的流出通信，封锁特洛伊木马；可以禁止来自特殊站点的访问，从而防止来自不明入侵者的所有通信。正确答案为C。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28289", "t": 1, "q": "对“防火墙本身是免疫的”这句话的正确理解是（    ）。", "a": ["防火墙本身是不会死机的", "防火墙本身具有抗攻击能力", "防火墙本身具有对计算机病毒的免疫力", "防火墙本身具有清除计算机病毒的能力", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】防火墙本身具有抗攻击能力，可以抵御来自外网的非法入侵。因此，可以说具有免疫力。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28290", "t": 1, "q": "下面对于个人防火墙的描述，不正确的是（    ）。", "a": ["个人防火墙是为防护接入互联网的单机操作系统而出现的", "个人防火墙的功能与企业级防火墙类似，而配置和管理相对简单", "所有的单机杀病毒软件都具有个人防火墙的功能", "为了满足非专业用户的使用，个人防火墙的配置方法相对简单", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】个人防火墙主要是为了保护个人计算机而使用的，配置和管理较为简单。但不是所有的单机杀毒软件都具有个人防火墙的功能。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28291", "t": 1, "q": "<p>下列哪个属于对称加密算法？（ ）<\/p>", "a": ["<p>RSA<\/p>", "<p>ECC<\/p>", "<p>AES<\/p>", "<p>MD5<\/p>", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】AES是对称加密，RSA和ECC是非对称，MD5是哈希。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28292", "t": 1, "q": "<p>在信息安全领域，CIA三元组不包括（ ）。<\/p>", "a": ["<p>机密性<\/p>", "<p>完整性<\/p>", "<p>可用性<\/p>", "<p>可控性<\/p>", "", ""], "r": "D", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】CIA是机密性、完整性、可用性。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28293", "t": 1, "q": "<p>以下哪个是用于数字签名的算法（ ）。<\/p>", "a": ["<p>DES<\/p>", "<p>AES<\/p>", "<p>RSA<\/p>", "<p>MD5<\/p>", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】RSA用于签名，DES/AES用于加密，MD5用于哈希。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28294", "t": 1, "q": "<p>下列哪个行为违反信息安全相关法规（ ）。<\/p>", "a": ["<p>定期修改密码<\/p>", "<p>未经授权访问他人计算机<\/p>", "<p>安装杀毒软件<\/p>", "<p>备份重要数据<\/p>", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.5 信息安全相关法规, 知识点1 信息安全相关法规。\n【解析】未经授权访问他人计算机违反《网络安全法》等法规。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28295", "t": 1, "q": "<p>以下哪个是病毒传播的常见途径？（ ）<\/p>", "a": ["<p>防火墙<\/p>", "<p>加密邮件<\/p>", "<p>U盘交叉使用<\/p>", "<p>双因素认证<\/p>", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】U盘是常见传播介质。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28296", "t": 1, "q": "<p>计算机病毒在激活后执行破坏性操作的阶段是（ ）。<\/p>", "a": ["<p>潜伏<\/p>", "<p>触发<\/p>", "<p>破坏<\/p>", "<p>传播<\/p>", "", ""], "r": "C", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点2 计算机病毒的特征。\n【解析】本题考查第4章 信息安全技术 4.3 计算机病毒及防范 知识点2 计算机病毒的特征。计算机病毒的典型生命周期包括以下几个阶段：\n潜伏阶段：病毒潜伏在系统中，不活动，也不进行破坏或传染，等待触发条件。\n传染/传播阶段：病毒主动复制自身，感染其他文件或系统。\n触发阶段：满足特定条件（如特定日期、操作等）时，病毒被激活。\n破坏阶段：激活后执行破坏指令，如删除文件、格式化硬盘、窃取数据等。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28297", "t": 2, "q": "信息入侵者，都是通过攻击信息的完整性、可用性和（     ）来达到目的。", "a": ["保密性", "开放性", "可控性", "自由性", "", ""], "r": "AC", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】选项 A：保密性\n保密性是信息安全的核心属性（CIA 三元组：保密性、完整性、可用性），指 “确保信息不被未授权的用户访问或泄露”（如入侵者窃取密码、监听传输数据）。这是入侵者最常见的攻击目标之一（如窃取商业机密、个人隐私），必然符合题意。\n选项 B：开放性\n“开放性” 是网络 / 系统的设计特性（如开放接口、公开协议），并非信息安全属性 —— 反而可能为入侵提供便利，不属于入侵者的攻击目标，排除。\n选项 C：可控性\n可控性是信息安全的扩展核心属性，指 “确保信息的访问、传输、操作可被合法主体控制”（如通过访问控制策略限制权限）。入侵者常通过 “越权访问”“篡改权限配置” 等方式破坏可控性（如普通用户非法获取管理员权限），属于典型攻击目标，符合题意。\n选项 D：自由性\n“自由性” 并非信息安全相关概念，与信息保护无关，更不是入侵者的攻击目标，排除。\n因此，信息入侵者的核心攻击目标是信息安全的核心属性，除完整性、可用性外，还包括保密性（A） 和可控性（C）。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28298", "t": 2, "q": "计算机病毒的特点有（     ）。", "a": ["隐蔽性、实时性", "分时性、破坏性", "潜伏性、隐蔽性", "传染性、破坏性", "", ""], "r": "CD", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点2 计算机病毒的特征。\n【解析】选项 A：隐蔽性、实时性\n“隐蔽性” 是病毒的典型特点（正确）；\n“实时性” 指 “实时响应或处理”，与病毒无关（病毒常潜伏，不实时发作），排除 A。\n选项 B：分时性、破坏性\n“破坏性” 是病毒的核心特点（正确）；\n“分时性” 是操作系统的调度特性（如按时间片分配 CPU），与病毒无关，排除 B。\n选项 C：潜伏性、隐蔽性\n“潜伏性”（感染后不立即发作）和 “隐蔽性”（隐藏自身）均为病毒的经典特点（完全正确），C 符合题意。\n选项 D：传染性、破坏性\n“传染性”（自我传播）和 “破坏性”（损害系统）是病毒的核心定义属性（无传染性或破坏性的程序不构成病毒），D 符合题意。\n因此，选项 C（潜伏性、隐蔽性）和 D（传染性、破坏性）均包含计算机病毒的典型特点，因此正确答案为 CD。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28299", "t": 2, "q": "按照防火墙软、硬件形式的不同，可将其分为（     ）。", "a": ["软件防火墙", "硬件防火墙", "芯片级防火墙", "应用层防火墙", "", ""], "r": "ABC", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】选项 A：软件防火墙\n定义：基于软件程序实现防火墙功能，依赖通用操作系统（如 Windows、Linux）运行，无专用硬件载体（如个人电脑上的 Windows Defender 防火墙、服务器上的 iptables）。\n匹配度：完全属于 “软件形式” 的防火墙，符合分类标准，正确。\n选项 B：硬件防火墙\n定义：拥有独立的专用硬件设备（如专用防火墙主机、内置防护模块的网络设备），不依赖通用操作系统，硬件与防护功能深度集成（如企业级防火墙设备）。\n匹配度：完全属于 “硬件形式” 的基础类别，符合分类标准，正确。\n选项 C：芯片级防火墙\n定义：在硬件防火墙基础上，进一步采用专用集成电路（ASIC）或网络处理器（NP）芯片，将防火墙核心功能（如包过滤、流量检测）固化在硬件芯片中，性能远超普通硬件防火墙（适用于高并发、高带宽场景）。\n匹配度：属于 “硬件形式的高级形态”，本质是通过专用芯片优化硬件载体，仍归为 “硬件形式” 范畴，符合分类标准，正确。\n选项 D：应用层防火墙\n定义：分类标准是 “工作层级”（针对应用层协议，如 HTTP、FTP，防护 Web 攻击、应用漏洞），而非 “软、硬件形式”—— 例如应用层防火墙可通过软件实现（如服务器上的 WAF 软件），也可通过硬件设备实现（如硬件 WAF）。\n匹配度：属于 “功能 / 层级分类”，与题干 “软、硬件形式” 无关，排除。\n因此，按照软、硬件形式，防火墙可分为软件防火墙（A）、硬件防火墙（B）、芯片级防火墙（C）。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28300", "t": 2, "q": "常见的计算机病毒有（     ）。", "a": ["蠕虫病毒", "特洛伊木马", "脚本病毒", "文件型病毒", "", ""], "r": "ABCD", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点3 计算机病毒的分类。\n【解析】选项 A：蠕虫病毒\n特点：无需依附其他文件，可通过网络（如系统漏洞、邮件附件、P2P 共享）自主复制传播，消耗带宽和系统资源（如 CPU / 内存），甚至引发网络瘫痪（典型案例：“冲击波”“永恒之蓝” 蠕虫）。\n常见性：是网络时代最主流的恶意程序之一，常利用通用漏洞大规模爆发，属于典型常见类型，正确。\n选项 B：特洛伊木马（木马）\n特点：伪装成正常程序（如游戏、办公工具、破解软件），诱骗用户主动安装；安装后窃取数据（如账号密码、隐私文件）或远程控制设备，但不具备自我复制能力（区别于传统病毒）。\n常见性：是针对普通用户的最频发威胁（典型案例：“灰鸽子”“远控木马”），通过钓鱼链接、盗版软件广泛传播，属于常见类型，正确。\n选项 C：脚本病毒\n特点：利用脚本语言（如 VBScript、JavaScript、Python）编写，依附于网页、Office 文档（如 Wor\nD.Excel）或脚本文件（.vbs、.js），通过执行脚本触发（如打开带恶意宏的文档）。\n常见性：广泛存在于钓鱼邮件、恶意网页中，对普通用户门槛低（无需复杂操作即可触发），是日常办公场景中的常见威胁，正确。\n选项 D：文件型病毒\n特点：依附于可执行文件（如.exe、.dll、.com），感染时修改原文件代码；当用户运行被感染文件时，病毒激活并扩散（典型案例：“CIH” 病毒，曾破坏计算机硬件）。\n常见性：是传统计算机病毒的核心类型，早期极为流行，至今仍有变种（如针对软件安装包的感染），属于常见类型，正确。\n排除误区（区分 “狭义病毒” 与 “广义病毒”）\n严格学术定义中，“蠕虫”“木马” 与 “传统病毒” 有差异（如木马无自我复制能力），但行业应用和常规考题中，均将它们归为 “广义计算机病毒” 范畴（即普通用户理解的 “病毒”），因此四个选项均符合 “常见” 要求。综上，所有选项均为常见计算机病毒（广义），答案为 ABCD。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28301", "t": 2, "q": "计算机网络中为了验证用户与主机之间的身份，可以使用的技术包括（     ）。", "a": ["口令和密码", "智能卡", "数字签名", "指纹", "", ""], "r": "ABD", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】选项 A：口令和密码\n属于 “知识因子”（你知道的信息）：用户输入预设的口令 / 密码，主机通过比对存储的加密密码，确认用户身份（如账号登录密码、WiFi 密码）。\n定位：最基础、最普及的身份验证技术，符合题意，正确。\n选项 B：智能卡\n属于 “possession 因子”（你拥有的设备）：内置芯片存储加密身份信息（如银行 U 盾、企业身份卡），需插入读卡器或通过近场通信（NFC）与主机交互，验证用户是否持有合法设备。\n定位：常见于双因素验证（如 “密码 + U 盾”），属于典型身份验证技术，正确。\n选项 C：数字签名\n核心功能：保证数据完整性和不可否认性—— 发送方用私钥对数据签名，接收方用公钥验证签名，确认 “数据未被篡改”“确为发送方发出”，但不直接验证 “发送方的身份”（身份可能已通过其他方式验证，数字签名是附加的 “数据溯源” 保障）。\n定位：属于 “数据安全技术”，而非 “身份验证技术”，排除。\n选项 D：指纹\n属于 “生物因子”（你本身的特征）：通过生物识别技术采集指纹特征，与主机存储的指纹模板比对，确认用户身份（如手机指纹解锁、电脑指纹登录）。\n定位：当前主流的生物身份验证技术，符合题意，正确。\n因此，选项 A（口令密码）、B（智能卡）、D（指纹）均为直接验证用户 / 主机身份的技术，C（数字签名）属于数据安全范畴，与身份验证无关。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28302", "t": 2, "q": "我国信息安全保护等级包括（     ）。", "a": ["自主保护", "指导保护", "特殊保护", "强制保护", "", ""], "r": "ABD", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】选项 A：自主保护\n对应第一级信息系统（一般重要，如普通企业内部办公系统）：由系统运营者自主制定保护策略、实施保护措施，无需监管部门强制介入，仅需符合基本安全要求。\n定位：官方明确的基础保护方式，正确。\n选项 B：指导保护\n对应第二级信息系统（较重要，如地方政务部门非核心系统）：系统运营者自主实施保护，但监管部门（如网信、公安）会提供技术指导和安全建议，确保保护措施合规有效。\n定位：官方明确的保护方式，正确。\n选项 C：特殊保护\n我国等保制度中无 “特殊保护” 这一官方术语，易与 “专控保护”（对应第五级超重要系统，如涉及国家核心机密的系统）混淆，但 “专控保护” 是独立分类，且选项中 “特殊保护” 并非标准表述，排除。\n选项 D：强制保护\n对应第三级及以上信息系统（重要 / 极重要，如国家政务核心系统、金融交易系统）：系统运营者必须按法定要求实施保护（如强制备案、定期安全测评、接受监管检查），保护措施需通过官方审核，未达标将被责令整改。\n定位：官方明确的核心保护方式，正确。\n结论\n我国信息安全保护等级对应的官方保护方式中，选项 A（自主保护）、B（指导保护）、D（强制保护）均为明确分类，C（特殊保护）非标准术语，故正确答案为 ABD。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28303", "t": 2, "q": "能够解决硬件失效带来的信息安全威胁技术有（     ）。", "a": ["双电源", "磁盘镜像", "双机容错", "数据加密", "", ""], "r": "BC", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点2 威胁信息安全的因素。\n【解析】选项 A：双电源\n功能：为设备（如服务器、交换机）提供两路独立电源，防止单一电源故障导致设备断电停机。\n局限性：仅解决 “供电中断” 问题，不针对核心硬件（如硬盘、主板）的失效 —— 若硬盘损坏，即使电源正常，数据仍会丢失。因此无法解决硬件失效带来的信息安全威胁，排除。\n选项 B：磁盘镜像\n功能：将一块硬盘（主盘）的数据实时同步到另一块硬盘（镜像盘，如 RAID 1 技术），形成数据冗余。\n针对性：当主盘硬件失效（如物理损坏、磁道坏道）时，镜像盘可立即接替工作，数据完全一致，无丢失风险。直接解决 “硬盘硬件失效导致数据丢失” 的威胁，符合要求，正确。\n选项 C：双机容错\n功能：部署两台服务器（主机 + 备机），实时同步数据和运行状态；当主机硬件失效（如主板故障、CPU 损坏）时，备机无缝接管服务，业务不中断、数据不丢失。\n针对性：直接应对 “服务器整体硬件失效” 的威胁，通过设备冗余确保硬件故障时的信息安全（数据可用、服务连续），符合要求，正确。\n选项 D：数据加密\n功能：对数据进行加密处理，防止未授权访问（如数据被窃取时无法解读）。\n局限性：仅解决 “数据泄露” 威胁，与硬件失效无关 —— 若硬盘损坏，加密的数据同样会丢失或不可用，加密无法修复硬件失效带来的问题，排除。\n因此，仅磁盘镜像（B）和双机容错（C）能通过硬件冗余 / 故障切换，解决硬件失效导致的数据丢失、服务中断等信息安全威胁。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28304", "t": 2, "q": "下列属于黑客常用网络攻击技术的有（     ）。", "a": ["破解口令", "网络监听", "DDOS", "NScan", "", ""], "r": "ABC", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点2 威胁信息安全的因素。\n【解析】选项 A：破解口令\n技术本质：通过暴力破解（尝试所有可能组合）、字典攻击（用预设密码库匹配）、彩虹表（反向查询哈希值）等方式，获取用户账号的登录口令。\n攻击属性：直接突破身份验证防线，是黑客获取系统 / 账号权限的最基础、最常用手段（如破解路由器管理员密码、服务器登录密码），属于典型攻击技术，正确。\n选项 B：网络监听\n技术本质：通过抓包工具（如 Wireshark、tcpdump）捕获局域网或公共网络中的数据包，解析其中的敏感信息（如明文传输的账号密码、聊天内容、文件数据）。\n攻击属性：属于 “被动攻击”（不主动触发目标反应），但能直接窃取信息，常见于公共 WiFi、未加密的局域网场景（如监听咖啡厅 WiFi 中的用户数据），是黑客常用技术，正确。\n选项 C：DDOS\n技术本质：分布式拒绝服务攻击（Distributed Denial of Service），通过控制大量 “傀儡机”（被感染的设备），向目标服务器发送海量无效请求，耗尽服务器带宽和资源，导致服务瘫痪。\n攻击属性：属于 “破坏性攻击”，直接破坏目标的可用性（如攻击电商网站使其无法正常交易、攻击游戏服务器使其掉线），是黑客最具威慑力的攻击技术之一，正确。\n选项 D：NScan\n工具本质：一款网络扫描工具，主要功能是探测目标网络的 “存活主机、开放端口、运行服务版本”（如扫描目标 IP 是否开放 80 端口、3389 远程桌面端口）。\n属性定位：仅用于 “攻击前的信息收集”（了解目标的安全弱点），本身不具备 “突破防线、窃取信息或破坏服务” 的能力，属于 “辅助工具” 而非 “攻击技术”，排除。\n因此，破解口令（A）、网络监听（B）、DDOS（C）均为黑客直接用于攻击的技术，NScan（D）是辅助扫描工具，不属于攻击技术。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28305", "t": 2, "q": "关于数字签名技术，说法正确的是（     ）。", "a": ["数字签名技术是一种身份认证技术", "数字签名技术使用DES作为数据加密算法", "数字签名技术使用时可以直接对需要加密的文档进行签名", "数字签名技术可以验证文档的完整性", "", ""], "r": "AD", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】选项 A：数字签名技术是一种身份认证技术\n身份认证的核心是 “确认主体身份的真实性”。数字签名中，只有签名者持有唯一的私钥，接收者通过公钥验证签名后，可确认 “数据确实来自该私钥持有者”，间接实现了对签名者身份的认证（如电子合同签名确认签署人身份）。数字签名是身份认证技术的重要类别之一（其他类别如密码、生物识别），因此A 正确。\n选项 B：数字签名技术使用 DES 作为数据加密算法\nDES 是对称加密算法，仅用于 “数据加密”（如文件加密传输），无法用于数字签名（需非对称加密的 “私钥签名、公钥验证” 特性）。数字签名的常用算法是公钥算法（如 RSA、DSA），因此B 错误。\n选项 C：数字签名技术使用时可以直接对需要加密的文档进行签名\n数字签名不直接对大文档签名 —— 公钥算法运算效率极低，若文档体积较大（如 GB 级文件），直接签名会消耗大量时间和资源。实际流程是：先对文档计算哈希值（如 SHA-256，生成固定长度的 “数据指纹”），再用私钥对哈希值签名（仅需处理短哈希值，效率极高）。因此C 错误。\n选项 D：数字签名技术可以验证文档的完整性\n哈希值具有 “唯一性”：若文档被篡改（哪怕修改一个字符），其哈希值会完全变化。验证签名时，接收者会先计算文档的哈希值，再用公钥解密签名得到 “签名时的原始哈希值”；若两者一致，说明文档未被篡改，即验证了完整性。因此D 正确。\n因此，正确选项为 A、D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28306", "t": 2, "q": "为了保证信息安全，我们需要（     ）。", "a": ["安装完整可靠的数据存储冗余设备", "充分使用数据加密手段", "及时给Windows系统打补丁", "建立严谨的访问控制机制", "", ""], "r": "ABCD", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】选项 A：安装完整可靠的数据存储冗余设备\n防护目标：保障数据的可用性与完整性。\n作用：通过冗余设备（如 RAID 磁盘阵列、双机备份、异地备份），防止硬件失效（如硬盘损坏、服务器故障）导致数据丢失 —— 即使单设备故障，冗余设备可立即接替，确保数据不丢失、服务不中断（如企业核心数据库的双机热备）。\n选项 B：充分使用数据加密手段\n防护目标：保障数据的保密性。\n作用：通过加密（如传输加密 TLS/SSL、存储加密 AES、文件加密），使未授权用户即使窃取数据（如截获网络数据包、盗取硬盘），也无法解读内容（如网银转账时的信息加密、手机隐私文件加密），有效防范数据泄露风险。\n选项 C：及时给 Windows 系统打补丁\n防护目标：加固系统，防范漏洞攻击。\n作用：Windows 系统的已知漏洞（如缓冲区溢出、权限绕过漏洞）是黑客的主要攻击入口（如 “永恒之蓝” 漏洞引发的勒索病毒大规模爆发），及时打补丁可修复漏洞，堵塞攻击路径，避免系统被入侵。\n选项 D：建立严谨的访问控制机制\n防护目标：保障数据的可控性，防范越权访问。\n作用：通过 “最小权限原则”“角色权限划分”“多因素认证”“账号密码策略” 等机制（如普通员工无法访问管理员数据、登录需 “密码 + 验证码”），限制未授权用户接触敏感资源，避免内部泄露或外部越权攻击。\n因此，四个选项分别从 “数据冗余（A）、数据加密（B）、系统加固（C）、访问管控（D）” 四个核心维度，全面覆盖了信息安全的防护需求，均为必要措施。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28307", "t": 2, "q": "下列关于NAT说法正确的有（     ）。", "a": ["NAT可以运行在路由器或防火墙上", "使用NAT是为了更好的提升网络性能", "使用公有IP地址必须配合NAT才能上网", "NAT一定程度上能够缓解IP地址不够用的问题", "", ""], "r": "AD", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】选项 A：NAT 可以运行在路由器或防火墙上\nNAT 需部署在 “私有网络与公网的边界”，实现两类地址的转换。\n家用 / 企业级路由器：默认集成 NAT 功能（如家庭路由器将内部 192.168.x.x 转换为运营商分配的公有 IP）；\n企业防火墙：为兼顾安全与地址转换，通常也内置 NAT 模块（如将内部服务器私有 IP 映射为公有 IP 供外部访问）。因此A 正确。\n选项 B：使用 NAT 是为了更好的提升网络性能\nNAT 的核心目的是 “节省公有 IP 地址” 和 “隐藏内部网络”，而非 “提升性能”：\n地址转换过程需设备维护 “NAT 映射表”，对数据包进行地址改写，反而会产生轻微延迟（虽通常可忽略，但无性能提升作用）；\n网络性能提升需依赖带宽扩容、路由优化、设备硬件升级等手段，与 NAT 无关。因此B 错误。\n选项 C：使用公有 IP 地址必须配合 NAT 才能上网\n公有 IP 地址的核心特性是 “可在公网直接路由”，无需依赖 NAT 即可访问公网：\n例如，服务器直接分配公有 IP（如网站服务器、云主机），可直接与公网通信，无需 NAT；\n仅私有 IP 地址因无法在公网路由，才需 NAT 转换为公有 IP 后上网。选项中 “必须” 的表述完全错误。\n选项 D：NAT 一定程度上能够缓解 IP 地址不够用的问题\n这是 NAT 的核心作用：\n一个公有 IP 可通过 “端口地址转换（PAT，NAT 的子类）”，映射多个内部私有 IP（如一个家庭用 1 个公有 IP，供手机、电脑、电视等多设备同时上网）；\n极大减少了对公有 IP 的需求，有效缓解了 IPv4 地址资源枯竭的问题（是 IPv6 普及前的关键过渡技术）。\n因此D 正确。因此，正确选项为 A、D。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28308", "t": 2, "q": "下列关于病毒查杀说法正确的是（     ）。", "a": ["使用杀毒软件能够查杀所有病毒", "部分病毒需要将Windows引导至安全模式下才能查杀", "杀毒软件对计算机运行速度会有影响", "部分病毒格式化磁盘也不能彻底清除", "", ""], "r": "BC", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点4 计算机病毒的防治。\n【解析】选项 A：使用杀毒软件能够查杀所有病毒\n杀毒软件依赖 “病毒库” 识别病毒（通过特征码、行为分析等方式），但存在明显局限：\n新出现的 “零日病毒”（未被收录进病毒库的病毒）无法被现有杀毒软件识别；\n部分 “变异病毒” 会修改自身特征码，躲避杀毒软件检测。\n因此 “查杀所有病毒” 是绝对化表述，不符合实际，A 错误。\n选项 B：部分病毒需要将 Windows 引导至安全模式下才能查杀\n安全模式是 Windows 的最小运行环境，仅加载核心驱动和系统进程，不启动第三方程序（包括病毒进程）：\n部分顽固病毒（如 “后台驻留病毒”“感染系统核心文件的病毒”）在正常模式下会通过 “进程保护”“文件锁定” 阻止杀毒软件删除；\n进入安全模式后，病毒进程无法启动，文件不再被占用，杀毒软件可正常清除。\n这类场景在实际查杀中极为常见，B 正确。\n选项 C：杀毒软件对计算机运行速度会有影响\n杀毒软件的核心功能（实时监控、定期扫描）需占用系统资源：\n实时监控：对文件操作（如下载、打开）、网络传输（如邮件、网页）进行实时扫描，占用 CPU、内存和磁盘 I/O；\n全盘扫描：集中检测所有文件时，会大量占用 CPU 和磁盘资源，导致其他程序运行变慢。\n即使是轻量化杀毒软件，也会产生轻微性能影响，C 正确。\n选项 D：部分病毒格式化磁盘也不能彻底清除\n“格式化磁盘”（此处指常规的 “高级格式化”，即清除磁盘分区的文件系统和数据）的核心作用是删除磁盘上的所有文件（包括病毒文件）：\n常规病毒（如感染 exe 文件、文档的病毒）均存储在磁盘数据区，格式化后会被彻底删除；\n极少数 “固件病毒”（感染主板 BIOS、硬盘固件的病毒）虽不在磁盘数据区，但这类病毒极为罕见，且 “格式化磁盘” 的场景通常针对 “磁盘数据区的病毒”，题干未特指 “固件病毒”，属于特殊情况不代表普遍现象。因此该表述不符合常规病毒查杀场景，D 错误。因此，正确选项为B.C。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28309", "t": 2, "q": "下列关于数据加密说法错误的是（     ）。", "a": ["数据加密是信息安全的最后一道防线", "数据加密技术是基于加密算法的安全性", "非对称密码算法有两个不同的秘钥", "对称密码算法加密强度大，适用于对少量数据加密", "", ""], "r": "BD", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点2 数据加密算法。\n【解析】选项 A：数据加密是信息安全的最后一道防线\n信息安全防护体系按层级分为 “访问控制（限制未授权进入）→防火墙（阻挡外部攻击）→入侵检测（发现异常）→数据加密（保护数据本身）”。当前端防线被突破，数据被窃取时，加密是唯一能阻止数据被解读的手段，因此是 “最后一道防线”，说法正确，排除 A。\n选项 B：数据加密技术是基于加密算法的安全性\n数据加密的安全性是 “算法安全性 + 密钥管理安全性” 的结合：\n若算法安全，但密钥泄露（如密钥存储在不安全位置、传输时被拦截），加密数据会被轻易解密；\n选项仅强调 “算法安全性”，忽略 “密钥管理” 这一关键因素，说法错误，B 为错误选项。\n选项 C：非对称密码算法有两个不同的秘钥\n非对称算法的核心特性是 “公钥（公开，用于加密）” 和 “私钥（保密，用于解密）”，两个密钥数学关联但无法互相推导，说法正确，排除 C。\n选项 D：对称密码算法加密强度大，适用于对少量数据加密\n对称密码算法的核心优势是 “运算效率高”，因此适用于大量数据加密（如文件加密、磁盘加密、视频流加密）；而非对称算法因运算效率低，才适用于 “少量数据”（如加密对称密钥）。选项中 “适用于少量数据加密” 的表述与对称算法的实际应用场景完全相反，说法错误，D 为错误选项。\n因此，错误的说法为选项 B 和 D，答案为 BD。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28310", "t": 2, "q": "MD的主要作用包括（     ）。", "a": ["<p>生成摘要<\/p>", "<p>验证数据完整性<\/p>", "<p>进行身份认证<\/p>", "<p>用于数字证书<\/p>", "", ""], "r": "AB", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】选项 A：生成摘要\n这是消息摘要算法的最基础、最核心作用。无论输入数据是文本、文件还是视频（任意长度），MD 算法都会计算出固定长度的摘要（如 MD5 生成 128 位摘要，SHA-256 生成 256 位摘要），该摘要可视为数据的 “数字指纹”。说法正确，A 是 MD 的主要作用。\n选项 B：验证数据完整性\n基于 MD 算法的 “唯一性” 特性：\n发送方将 “原始数据 + 数据摘要” 一同发送；\n接收方用相同的 MD 算法对收到的原始数据重新计算摘要，与发送方的摘要对比；\n若两者一致，说明数据未被篡改（完整性未破坏）；若不一致，说明数据被修改。\n这是 MD 算法最典型的应用场景（如下载文件时验证 MD5 值），说法正确，B 是 MD 的主要作用。\n选项 C：进行身份认证\n身份认证的核心是 “确认主体身份的真实性”（如验证 “你是谁”），需依赖 “身份凭证”（如密码、私钥、生物特征）。MD 算法仅处理数据本身，无法关联 “主体身份”—— 例如，计算一个文件的 MD5 摘要，无法确认该文件是谁生成的，也无法验证用户身份。身份认证需结合其他技术（如数字签名、密码），MD 不直接用于身份认证，C 错误。\n选项 D：用于数字证书\n数字证书的核心是 “绑定公钥与主体身份”（如证明 “某公钥属于某企业”），由 CA（证书机构）签发，包含 “公钥、身份信息、CA 签名” 三部分。MD 算法仅在 “CA 签名” 环节间接参与（CA 用 MD 算法计算证书内容的摘要，再用私钥对摘要签名），但 MD 算法本身并非 “用于数字证书”—— 数字证书的核心是身份与公钥的绑定，MD 只是签名过程中的辅助工具，D 错误。\n因此，MD（消息摘要算法）的主要作用是生成摘要（A）和验证数据完整性（B）。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28311", "t": 2, "q": "下列属于犯罪行为，会触犯《刑法》的包括（     ）。", "a": ["非法侵入计算机信息系统", "非法获取、删除、篡改计算机数据", "非法泄露个人信息", "提供专门用于犯罪的技术手段", "", ""], "r": "ABD", "e": "【定位】第4章 信息安全技术, 4.5 信息安全相关法规, 知识点1 信息安全相关法规。\n【解析】选项 A：非法侵入计算机信息系统\n根据《刑法》第二百八十五条，非法侵入国家事务、国防建设、尖端科学技术领域的计算机信息系统，无论是否造成实际损害，均构成犯罪。例如，黑客通过技术手段突破防火墙进入政府系统，即使未窃取数据，也已触犯刑法。此外，若侵入其他领域的计算机信息系统（如金融、医疗），并造成重大损失，可能构成更严重的破坏计算机信息系统罪。因此，A 属于犯罪行为。\n选项 B：非法获取、删除、篡改计算机数据\n根据《刑法》第二百八十六条，对计算机信息系统中存储、处理或者传输的数据和应用程序进行删除、修改、增加的操作，后果严重的，构成破坏计算机信息系统罪\n选项 C：非法泄露个人信息\n根据《刑法》第二百五十三条之一，非法获取、出售或者提供公民个人信息，情节严重的，构成侵犯公民个人信息罪。\n选项 D：提供专门用于犯罪的技术手段\n根据《刑法》第二百八十七条之二，明知他人利用信息网络实施犯罪，为其提供技术支持、广告推广、支付结算等帮助，情节严重的，构成帮助信息网络犯罪活动罪（“帮信罪”）\n因此，选项 A、B、D 均明确触犯《刑法》，而选项 C 因表述模糊且未满足 “情节严重” 等条件，不构成犯罪。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28312", "t": 2, "q": "国家秘密可以体现的形态包括（     ）。", "a": ["知识", "技术", "文件", "商业信息", "", ""], "r": "ABCD", "e": "【定位】第4章 信息安全技术, 4.5 信息安全相关法规, 知识点1 信息安全相关法规。\n【解析】知识（A）：国家秘密的抽象形态\n国家秘密中的 “知识” 主要体现为战略决策、科学理论、核心技术原理等抽象内容\n技术（B）：国家秘密的实践载体\n技术作为国家秘密的形态，既包括具体的工艺、设备，也涵盖技术参数和操作方法：\n国防技术：如核武器制造工艺、新型战机的隐身技术等，直接关系国家安全。\n关键基础设施技术：如电网调度系统的核心算法、核电站的控制技术等，泄露可能导致系统性风险。\n生物医学技术：如基因编辑技术在军事领域的应用、特定病毒的研究数据等，可能被列为国家秘密。\n文件（C）：国家秘密的传统载体\n文件是国家秘密最直观的表现形式，包括纸质文件、电子文档、图表、地图等：\n商业信息（D）：国家秘密的特殊形态\n商业信息成为国家秘密需满足两个条件：涉及国家安全且经法定程序确定\n国家秘密的形态并非局限于传统文件或技术，而是知识、技术、文件、商业信息的综合体现。选项 A、B、C、D 均符合法律规定和实务操作，因此正确答案为 ABCD。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28313", "t": 2, "q": "下列哪项不是国家秘密区别于其他秘密的关键（     ）。", "a": ["关系国家安全和利益", "依照法定程序确定", "在一定时间内保密", "只限一定范围的人员知悉", "", ""], "r": "BCD", "e": "【定位】第4章 信息安全技术, 4.5 信息安全相关法规, 知识点1 信息安全相关法规。\n【解析】选项 A：关系国家安全和利益\n关键区别性：这是国家秘密与其他所有秘密的根本差异。\n商业秘密仅关系 “企业经济利益”（如技术配方、客户数据），不涉及国家安全；\n个人隐私秘密仅关系 “个人权益”（如私人通讯、健康信息），与国家安全无关；\n只有国家秘密直接关联 “国家安全和利益”（如国防战略、军事部署、核心科技），一旦泄露可能危害国家主权、领土完整或公共安全。\n选项 B：依照法定程序确定\n非关键区别性：“法定程序” 并非国家秘密独有。\n商业秘密的确定需遵循企业内部程序（如保密制度、员工保密协议），或《反不正当竞争法》等法律程序；\n选项 C：在一定时间内保密\n非关键区别性：“时间性” 是所有秘密的共性，而非国家秘密独有。\n国家秘密有明确保密期限（如绝密级不超过 30 年），到期后解密；\n选项 D：只限一定范围的人员知悉\n非关键区别性：“限制知悉范围” 是 “秘密” 的基本属性（无范围限制则不成为 “秘密”），并非国家秘密独有。\n商业秘密只限企业核心员工（如技术研发人员、高管）知悉；\n因此，国家秘密区别于其他秘密的唯一关键是 “关系国家安全和利益”，而B.C.D 是所有秘密的共性特征，不是关键区别。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28314", "t": 2, "q": "用户访问国家电网公司网站时，为了安全可能会使用到的网络协议有（     ）。", "a": ["HTTPS", "TLS", "PPP", "ICMP", "", ""], "r": "AB", "e": "【定位】第3章 网络技术基础, 3.4 计算机网络协议与体系结构, 知识点1 计算机网络协议。\n【解析】A. HTTPS（超文本传输安全协议）\n功能：是 “HTTP + 加密层” 的组合，专门用于 Web 场景的安全数据传输。\n安全作用：通过底层加密协议（如 TLS）对浏览器与服务器之间的所有数据进行加密，同时验证服务器证书（确保访问的是真实国家电网网站，而非钓鱼网站），完全匹配 “访问网站” 的安全需求。\nB. TLS（传输层安全协议）\n功能：是当前主流的传输层加密协议（替代旧版 SSL），负责为上层应用（如 HTTP、邮件）提供加密、身份验证和完整性保障。\n与 HTTPS 的关系：HTTPS 的 “安全能力” 本质是由 TLS 协议实现的 ——HTTPS = HTTP + TLS。访问国家电网网站时，浏览器与服务器会先建立 TLS 连接，再通过该连接传输 HTTP 数据。\nC. PPP（点对点协议）\n功能：是链路层协议，主要用于 “点对点” 的链路建立（如早期 ADSL 拨号上网、专线连接），作用是在两个设备（如用户路由器与运营商服务器）之间建立基础数据链路。\n安全缺陷：本身不提供加密、身份验证等安全功能，且与 “访问网站” 的 Web 层场景无关（仅负责底层链路，不涉及数据传输安全）。\nD. ICMP（互联网控制消息协议）\n功能：是网络层协议，主要用于 “网络诊断与控制”（如ping命令检测主机是否可达、traceroute追踪路由），不负责实际业务数据（如网页内容）的传输。\n安全无关性：无任何加密或安全防护功能，仅用于网络故障排查，与 “访问网站的安全需求” 完全无关。\n因此，符合 “访问国家电网网站安全需求” 的协议是 A. HTTPS 和B. TLS，答案为 AB。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28315", "t": 2, "q": "木马程序的作用是（     ）。", "a": ["进行网络监听", "控制用户计算机", "破解系统口令", "窃取账号和密码", "", ""], "r": "BD", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点3 计算机病毒的分类。\n【解析】A. 进行网络监听；功能归属：网络监听是Sniffer（嗅探器）等专用工具的核心功能，作用是捕获局域网内的数据包（如明文传输的聊天内容、网页数据）。\n与木马的关系：少数木马可能附带简单监听功能，但这并非木马的核心作用（木马不依赖 “监听网络” 实现核心目标，而是通过直接控制目标机窃取信息）。B. 控制用户计算机；核心功能匹配：木马的核心设计目标之一就是 “远程控制”。运行后，木马会在目标计算机上开启 “后门”（如监听特定端口），让攻击者通过远程客户端连接目标机，实现多种控制操作（如查看 / 删除文件、操作鼠标键盘、开启摄像头 / 麦克风等）。\n典型案例：知名的灰鸽子、冰河等木马，核心功能就是远程控制目标计算机。\nC. 破解系统口令\n功能归属：破解系统口令是 “暴力破解工具”（如基于字典的口令破解软件）、“社工工具” 的核心作用，原理是通过枚举、碰撞等方式尝试获取口令，不依赖 “控制目标机”。\n与木马的关系：木马不直接 “破解” 口令，而是在已控制目标机后，窃取系统中已存储的口令（如缓存的登录密码、配置文件中的加密口令），本质是 “窃取” 而非 “破解”。\nD. 窃取账号和密码\n核心功能匹配：“窃取敏感信息” 是木马的另一核心目标，其中账号密码（如网银、游戏、社交软件账号）是最主要的窃取对象。\n实现方式：木马通过 “键盘记录器” 记录用户输入、读取浏览器缓存 / 软件配置文件、Hook 系统输入接口等方式，获取账号密码后，通过邮件、FTP 等方式发送给攻击者（如常见的 “盗号木马”）。\n因此，木马程序的核心作用是B. 控制用户计算机 和D. 窃取账号和密码，答案为 BD。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28316", "t": 3, "q": "若一台微机感染了病毒,只要删除所有带毒文件，就能消除所有病毒。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点3 计算机病毒的分类。\n【解析】正确的病毒清除逻辑需覆盖 “内存杀毒、引导区修复、全盘文件扫描、系统文件修复” 等环节（通常需专业杀毒软件完成），而非仅删除可见的带毒文件。因此 “只要删除所有带毒文件，就能消除所有病毒” 的说法错误。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28317", "t": 3, "q": "国家电网的电力生产调度系统属于监督保护级。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点1 信息安全和信息系统安全。\n【解析】国家电网的电力生产调度系统属于强制保护级", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28318", "t": 3, "q": "计算机犯罪的形式是未经授权而非法入侵计算机系统，复制程序或数据文件。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.5 信息安全相关法规, 知识点1 信息安全相关法规。\n【解析】题目描述的 “未经授权非法入侵计算机系统，复制程序或数据文件”，是计算机犯罪的明确形式，说法正确。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28319", "t": 3, "q": "计算机病毒也像人体中的有些病毒一样，在传播中发生变异。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点2 计算机病毒的特征。\n【解析】计算机病毒在传播中会通过技术手段改变自身代码结构（即 “变异”），以规避检测、持续传播，这与人体病毒在传播中发生变异的逻辑一致。因此该说法正确。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28320", "t": 3, "q": "病毒对计算机的破坏程度取决于它是操作系统型、外壳型还是入侵型或源码型病毒。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点3 计算机病毒的分类。\n【解析】题目将 “病毒的技术分类（感染方式）” 等同于 “破坏程度的决定因素”，忽略了 “分类≠能力” 的核心逻辑 —— 同一类型的病毒破坏程度可天差地别，不同类型的病毒也可能有相似破坏效果。因此，“病毒破坏程度取决于操作系统型 / 外壳型等分类” 的说法错误。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28321", "t": 3, "q": "系统管理员为网络中所有的操作系统均设置了相同的用户名与密码，这属于系统安全风险。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.1 信息安全技术概述, 知识点3 信息安全的任务。\n【解析】系统管理员为网络中所有的操作系统均设置了相同的用户名与密码，这属于管理安全风险。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28322", "t": 3, "q": "网络建设者对网络基础设施进行保护，包括进行安全评估、采取技术措施防范网络攻击和恶意程序的侵扰。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.5 信息安全相关法规, 知识点1 信息安全相关法规。\n【解析】题干将 “网络运营者” 的安全保护职责错误归属于 “网络建设者”，违背了法定职责划分与行业实践逻辑。因此该说法错误。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28323", "t": 3, "q": "计算机犯罪不会触犯《中华人民共和国刑法》。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.5 信息安全相关法规, 知识点1 信息安全相关法规。\n【解析】《刑法》通过专门条款明确将严重的计算机违法行为认定为犯罪，计算机犯罪不仅 “可能” 触犯《刑法》，更是我国刑事打击的重点领域之一。题干中 “不会触犯《中华人民共和国刑法》” 的表述完全违背法律规定，因此说法错误。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28324", "t": 3, "q": "按防火墙的应用部署位置不同，可分为边界防火墙、个人防火墙和分布式防火墙。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】按防火墙的应用部署位置不同，可分为边界防火墙、个人防火墙和混合防火墙。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28325", "t": 3, "q": "DES采
