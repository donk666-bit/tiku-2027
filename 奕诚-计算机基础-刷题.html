用分组密码方式，将数据块按照固定长度分成若干块进行加密和解密。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】AES采用分组密码方式，将数据块按照固定长度分成若干块进行加密和解密。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28326", "t": 3, "q": "RSA算法中明文为C，密文为M，公钥为(n, e)，私钥为(n, d)，则M = C^e (mod n)。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。 【解析】RSA数据加密使用的是公钥加密私钥解密，因此，M = C^e(mod n)<\/p>", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28327", "t": 3, "q": "由于安全性考虑，MD算法逐渐被更安全的哈希算法如SHA-2及SHA-3替代。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】题干 “由于安全性考虑，MD 算法逐渐被更安全的哈希算法如 SHA-2 及 SHA-3 替代” 的描述，完全符合 MD 算法的安全缺陷、替代方案的优势及行业实际趋势，说法正确。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28328", "t": 3, "q": "RSA广泛应用于加密通信、数字签名和DOS等领域。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】RSA广泛应用于加密通信、数字签名和身份认证等领域。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28329", "t": 3, "q": "AES加密解密速度快，秘钥交换方便。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.4 数据加密技术, 知识点3 数据加密常用模型。\n【解析】AES加密解密速度快，秘钥交换不便。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28330", "t": 3, "q": "若计算机启动时无法加载操作系统，则一定是中了引导型病毒。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.3 计算机病毒及防范, 知识点3 计算机病毒的分类。\n【解析】计算机启动时无法加载操作系统，需从 “硬件故障→软件配置→病毒感染” 逐步排查，引导型病毒仅为可能原因之一，而非唯一原因。题干用 “一定” 将复杂故障归因于单一因素，违背了故障诊断的客观逻辑，因此说法错误。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28331", "t": 3, "q": "数字证书的主要作用是身份认证，另一个作用是数据加密。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】数字证书的核心功能是身份认证——通过CA签名绑定公钥与实体身份。\n同时，证书中的公钥可用于密钥交换（如HTTPS中加密会话密钥），进而实现对通信数据的加密传输。因此，该说法在应用层面成立，答案为A。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "28332", "t": 3, "q": "入侵检测技术是一种主动保护自己免受黑客攻击的网络安全技术，它提供了对网络外部攻击的实时保护，对网络内部攻击保护较差。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章 信息安全技术, 4.2 信息安全风险及防范, 知识点2 信息安全防范技术。\n【解析】题干既混淆了 IDS “被动检测” 与 IPS “主动保护” 的属性，又低估了现代 IDS 对内部攻击的检测能力，说法错误。", "l3": "计算机基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}]}, {"k": "计算机基础||第5章", "n": "计算机基础 / 第5章", "qs": [{"id": "28333", "t": 1, "q": "云计算是对（     ）技术的发展与运用。", "a": ["并行计算", "网格计算", "分布式计算", "三个选项都是", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】云计算是网格计算、分布式计算、并行计算、效用计算、网络存储、负载均衡、热备份冗杂和虚拟化等计算机技术混合演进并跃升的结果。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28334", "t": 1, "q": "云计算就是把计算资源都放到（     ）上。", "a": ["对等网", "因特网", "广域网", "无线网", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】云计算首要的特点是通过Internet接入，将计算资源都部署到Internet上，实现资源的共享。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28335", "t": 1, "q": "（     ）是目前最大的云计算技术使用者。", "a": ["Salesforce", "Microsoft", "Giwell", "Google", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点3 云计算发展及现状。\n【解析】Google是目前最大的云计算技术使用者，Google 云计算已拥有100多万台服务器，数量最多，规模最大。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28336", "t": 1, "q": "云计算技术的研究重点是（     ）。", "a": ["服务器制造", "将资源整合", "网络设备制造", "数据中心制造", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】云计算技术的研究重点是进行资源整合，将所有资源部署在“云”上，为终端用户提供资源服务。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28337", "t": 1, "q": "某银行的贷款系统，操作员只需要输入客户资料，该系统就会提示操作员是否能够提供贷款以及相应的贷款额度，这主要应用了人工智能中的（     ）。", "a": ["机器博弈", "专家系统", "模式识别", "机器翻译", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】专家系统是一种模拟人类专家解决领域问题的计算机程序系统。主要应用在工程、科学、医药、军事、商业等方面。日常生活中，人机对话是人工智能领域典型的专家系统应用。因此，正确答案为B。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28338", "t": 1, "q": "在某些电影中，经常可以看到这样一个场景：某人回到家说了一声“灯光”，房间的灯就亮了，这主要应用了人工智能中的（     ）。", "a": ["文字识别技术", "指纹识别技术", "语音识别技术", "光学字符识别", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】这属于语音识别功能，是人工智能领域中的“自然语言理解”。因此，正确答案为C。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28339", "t": 1, "q": "自然语言处理是（     ）的应用领域。", "a": ["神经网络", "模式识别", "数据挖掘", "人工智能", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】人工智能的应用的领域有：计算机视觉、自然语言处理、智能机器人、深度学习、数据挖掘等。因此，正确选项为D。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28340", "t": 1, "q": "机器学习的流程包括：分析案例、数据获取、（     ）和模型验证这四个过程。", "a": ["数据清洗", "数据分析", "模型训练", "模型搭建", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】机器学习的流程包括：分析案例、数据获取、模型训练、模型验证4个过程。因此，正确答案为C。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28341", "t": 1, "q": "KDD过程主要包括：数据准备、（     ）、结果的解释和评估。", "a": ["问题定义", "数据挖掘", "数据清理", "算法选择", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点1 数据挖掘。\n【解析】KDD一般指知识发现。过程主要包括：数据准备（具体分为：数据选取、数据 预处理、数据变换）、数据挖掘（确定挖掘任务、挖掘算法）、结果的解释和评估。因此，正确答案为B。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28342", "t": 1, "q": "将基础设施作为服务的云计算服务类型是（     ）", "a": ["IaaS", "PaaS", "SaaS", "三个选项都不是", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】IaaS，全称：Infrastructure as a Service，基础设施即服务。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28343", "t": 1, "q": "亚马逊AWS提供的云计算服务类型是（     ）。", "a": ["<p>IaaS<\/p>", "<p>PaaS<\/p>", "<p>SaaS<\/p>", "<p>三个选项都是<\/p>", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】亚马逊AWS提供的云服务有：弹性计算云EC2和简单存储服务，属于IaaS；弹性MapReduce和简单数据库服务SimpleDB，属于PaaS；电子商务服务FPS和DevPay及网站访问统计服务Alexa Web服务，属于SaaS。因此亚马逊提供的云计算服务类型包括以上三种。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28344", "t": 1, "q": "以下哪个描述不是云服务器的特点？（     ）。", "a": ["需大量人员负责云服务器的维护，维护成本高", "服务可用性高，有自动宕机迁移和自动快照备份的功能", "即买即用，快速部署", "可自由配置CPU、内存、网络、挂在容量，可随时升级", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】云服务器具有自动化管理的特点，使得数据中心管理成本大幅减低。因此正确答案为A。其他选项描述均为云服务器的特点。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28345", "t": 1, "q": "从购物篮商品集中找出商品与商品之间的关系，有助于发现不同商品之间的联系，这属于（     ）。", "a": ["聚类", "分类", "预测", "关联", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】从购物篮商品集中找出商品与商品之间的关系，有助于发现不同商品之间的联系。这个属于“关联”。因此，正确答案为D。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28346", "t": 1, "q": "在数据挖掘之前要对原始数据进行预处理，目的是（     ）", "a": ["建立数据之间的关联", "为数据进行清晰的聚类或分类做准备", "为数据挖掘算法提供完整、干净、准确、有针对性的数据，减少算法的计算量，提高挖掘效率和准确程度。", "去除多余的无用的数据", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】原始业务数据来自多个数据库或数据仓库，它们的结构和规则可能是不同的，这将导致原始数据非常的杂乱、不可用，即使在同一个数据库中，也可能存在重复的和不完整的数据信息，为了使这些数据能够符合数据挖掘的要求，提高效率和得到清晰的结果，必须进行数据的预处理，目的是为数据挖掘算法提供完整、干净、准确、有针对性的数据，减少算法的计算量，提高挖掘效率和准确程度。因此，正确答案为C。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28347", "t": 1, "q": "数据挖掘过程中，数据预处理方法，不包括：（     ）。", "a": ["数据清洗", "数据集成", "数据变换", "数据归类", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点2 数据和数据预处理。\n【解析】数据预处理方法包括4种：（1）数据清洗：包括填充空缺值，识别孤立点，去掉噪声和无关数据。（2）数据集成：将多个数据源中的数据结合起来存放在一个一致的数据存储中。需要注意不同数据源的数据匹配问题、数值冲突问题和冗余问题等。（3）数据变换：将原始数据转换成为适合数据挖掘的形式。包括对数据的汇总、聚集、概化、规范化，还可能需要进行属性的重构。（4）数据归约：缩小数据的取值范围，使其更适合于数据挖掘算法的需要，并且能够得到和原始数据相同的分析结果。因此，正确答案为D。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28348", "t": 1, "q": "（     ）是公有云计算基础架构的基石。", "a": ["虚拟化", "分布式", "并行", "集中式", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】虚拟化、分布式均是公有云计算基础架构的基石，最优答案选虚拟化技术。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28349", "t": 1, "q": "虚拟化是资源的（     ）表示，其不受（     ）限制的约束。", "a": ["物理，逻辑", "逻辑，物理", "存储，物理", "存储，逻辑", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】虚拟化是资源的逻辑表示，其不受物理或存储位置限制的约束。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28350", "t": 1, "q": "我们常提到的“Window装个VMware装个Linux虚拟机”属于（     ）。", "a": ["存储虚拟化", "内存虚拟化", "系统虚拟化", "网络虚拟化", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】Window装个VMware装个Linux虚拟机，是实现系统虚拟化。可以为上层应用软件提供可用的虚拟系统平台。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28351", "t": 1, "q": "您与某云提供者建立了业务关系，以实现销售管理功能，您可以通过API和SDK自定义界面和功能，但后端服务是由云提供者完成的。在本案例中，云提供者提供的是哪种类型的服务？（     ）。", "a": ["软件即服务", "平台即服务", "基础设施即服务", "桌面即服务", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】用户可以通过API和SDK自定义界面和功能，但后端服务是由云提供者完成，这种服务类型是PaaS。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28352", "t": 1, "q": "与SaaS不同的，（     ）“云”计算形式把开发环境或者运行平台也作为一种服务给用户提供。", "a": ["软件即服务", "基于平台服务", "基于WEB服务", "基于管理服务", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】基于平台服务（PaaS）把开发环境或者运行平台作为服务提供给用户。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28353", "t": 1, "q": "微软于2008年10月推出的云计算操作系统是（     ）。", "a": ["Google App Engine", "Azure", "蓝云", "EC2", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点3 云计算发展及现状。\n【解析】微软于2008年10月推出的云计算操作系统是Windows Azure。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28354", "t": 1, "q": "在下列有关MapReduce的描述中，错误的是（     ）。", "a": ["MapReduce是一种编程模型，用于大规模数据集的并行运算", "MapReduce是一个集群的高性能并行计算平台", "MapReduce一次计算分为Map和Reduce两个阶段", "MapReduce是Microsoft公司开发的一种分布式文件系统", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】MapReduce是一种Google公司研究提出的一种编程模型，MapReduce是一个基于集群的高性能并行计算平台，是一个并行计算与运行软件框架，是一个并行程序设计模型与方法，一次计算分为Map和Reduce两个阶段。说法错误的是D。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28355", "t": 1, "q": "云计算体系结构中，（     ）是最关键的部分。", "a": ["物理资源层、资源池层", "资源池层、管理中间件层", "管理中间件层、SOA构建层", "物理资源层、SOA构建层", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点2 云存储及其架构模型。\n【解析】云计算体系结构中，资源池层和管理中间件层，其中的最关键部分。资源池层是将大量同类型的资源构成同构或接近同构的资源池，管理中间件层负责对云计算的资源进行管理，并对众多应用任务进行调度，使资源能够高效、安全第为应用服务。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28356", "t": 1, "q": "云计算体系结构的（     ）负责资源管理、任务管理用户管理和安全管理等工作。", "a": ["物理资源层", "资源池层", "管理中间件层", "SOA构建层", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点2 云存储及其架构模型。\n【解析】云计算体系结构分为4层，自底向上依次为：物理资源层、资源池层、管理中间件层、SOA构建层。其中管理中间件层负责资源管理、任务管理用户管理和安全管理等工作。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28357", "t": 1, "q": "某用户从云服务提供商租用虚拟机进行日常使用，外出旅游时把虚拟机归还给云服务提供商，这体现了云计算的哪个关键特征? （     ）", "a": ["按需自助服务", "与位置无关的资源池", "按使用付费", "快速弹性", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】某用户从云服务提供商租用虚拟机进行日常使用，外出旅游时把虚拟机归还给云服务提供商，属于按使用付费（用户按需购买服务）。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28358", "t": 1, "q": "百度建立了旅游预测模型，通过与北京市旅游委公布的景点实际人数比照，准确度到达90%以上，其利用的技术是（     ）。", "a": ["云计算", "大数据", "物联网", "神经网", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】百度的旅游预测模型借助于大数据技术，才能达到较高的准确度。正确答案为B。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28359", "t": 1, "q": "（     ）是一种通过数据挖掘解决方案，包含可在结构化和非结构化数据中使用以确定未来结果的算法和技术。", "a": ["预测", "分析", "预测分析", "分析预测", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点1 数据挖掘。\n【解析】预测分析是一种统计或数据挖掘解决方案，包含可在结构化和非结构化数据中使用以确定未来结果的算法和技术。可为预测、优化、预报和模拟等许多其他用途而部署。正确答案为C。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28360", "t": 1, "q": "电子商务平台，平时业务流量比较均衡，数据处理在其公司自建的云环境上；当节假日来临流量增大，从云服务提供商购买相应资源进行处理。该公司云环境属于哪种部署模式？（     ）。", "a": ["公有云", "私有云", "政务云", "混合云", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点4 云计算实现机制。\n【解析】属于混合云部署模式。混合云融合了公有云和私有云，是近年来云计算的主要模式和发展方向。它将公有云和私有云进行混合和匹配，既可以利用私有云的安全，将内部重要数据保存在本地数据中心；同时也可以使用公有云的计算资源，更高效快捷地完成工作以获得最佳的效果，是面向企业用户的一种个性化的解决方案。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28361", "t": 1, "q": "（     ）是人工智能的核心，是使计算机具有智能的主要方法，其应用遍及人工智能的各个领域。", "a": ["深度学习", "机器学习", "人机交互", "智能芯片", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】人工智能的核心：1、计算机视觉，是指计算机从图像中识别出物体、场景和活动的能力；2、机器学习，指的是计算机系统无须遵照显式的程序指令；3、自然语言处理；4、机器人；5、语音识别，主要是关注自动且准确地转录人类的语音技术。正确选项为B。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28362", "t": 1, "q": "特斯拉的电动汽车的自动驾驶技术，采用了（     ）技术。", "a": ["语音识别", "自动控制", "人工智能", "图像识别", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】自动驾驶技术，主要是借助于人工智能来实现的。正确答案为C。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28363", "t": 1, "q": "以下不属于专家系统的是（     ）。", "a": ["医疗诊断系统", "股票分析系统", "口语训练校正系统", "安保金属探测系统", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】专家系统是一个智能计算机程序系统，其内部含有大量的某个领域专家水平的知识与经验，它能够应用人工智能技术和计算机技术，根据系统中的知识与经验，进行推理和判断，模拟人类专家的决策过程，以便解决那些需要人类专家处理的复杂问题。A.\nB.C选项所涉及的系统都是需要借助于知识库进行推理判断，因此属于专家系统。安保金属探测系统是利用变化的磁场产生感应电流的原理发展起来的设备，不需要知识推理。因此，正确选项为D。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28364", "t": 1, "q": "机器学习包含多种使用不同算法的学习模型，分成四种，分别是（     ）、无监督学习、半监督学习和强化学习。", "a": ["监督学习", "严格监督学习", "弱监督学习", "函数学习", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】机器学习的学习模型分成四种，分别是监督学习、无监督学习、半监督学习和强化学习。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28365", "t": 1, "q": "物联网首选的IP协议版本是（     ）", "a": ["IPv4", "IPv6", "TCP/IP", "uIP", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】物联网首选的IP协议版本是IPv6。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28366", "t": 1, "q": "物联网的核心技术是（     ）。", "a": ["射频识别", "传感器", "无线通信技术", "ZigBee技术", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】物联网的核心技术是射频识别技术（即：RFID技术）。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28367", "t": 1, "q": "射频识别技术是一种射频信号通过（     ）实现信息传递的技术。", "a": ["能量变化", "空间耦合", "电磁交互", "能量转换", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】射频识别技术是一种射频信号通过空间耦合（无接触方式）实现信息传递的技术。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28368", "t": 1, "q": "射频识别技术属于物联网产业链的 （     ）环节。", "a": ["标识", "感知", "处理", "信息传送", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】物联网产业链中，通常分为感知层、网络层、处理层和应用层四个环节：\n感知层（B）：负责识别物体、采集信息，是物联网的“皮肤和五官”。射频识别（RFID）技术、传感器、摄像头等都属于这一层。\n标识（A）虽然是 RFID 的核心功能，但它属于感知层内的具体技术分类，并非产业链的独立环节。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28369", "t": 1, "q": "机器学习是（     ）的一个子集。这项技术的主要任务是指导计算机从数据中学习，然后利用经验来改善自身的性能，不需要进行明确的编程。", "a": ["神经网络", "模式识别", "机器学习", "人工智能", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】机器学习是人工智能的一个子集，此外，还有深度学习和神经网络都属于人工智能的子集。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28370", "t": 1, "q": "从已知事实出发，通过规则库求得结论的产生式系统的推理方式是（     ）。", "a": ["正向推理", "反向推理", "双向推理", "事实推理", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】正向推理又称为数据驱动推理，是按照由条件推出结论的方向进行的推理方式，它从一组表示事实的谓词或命题出发，使用一组推理规则，来证明目标谓词公式或命题是否成立。反向推理，称为逆向推理，又称目标驱动推理，是问题解决策略的一种。它的推理方式和正向推理正好相反，它是由结论出发，逐级验证该结论的正确性，直至已知条件。因此，正确答案为A。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28371", "t": 1, "q": "（     ）是计算机模拟人类的智能活动，是探索和模拟人的感觉和思维过程的科学。", "a": ["机器人技术", "大数据技术", "物联网", "人工智能", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】人工智能是让机器能够模拟、延伸和扩展人的智能。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28372", "t": 1, "q": "按照涉及自变量的多少，可以将回归分析分为（     ）。", "a": ["<p>线性回归分析和非线性回归分析<\/p>", "<p>简单回归分析和多重回归分析<\/p>", "<p>一元回归分析和多元回归分析<\/p>", "<p>多元回归分析和综合回归分析<\/p>", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】回归分析按照涉及的变量的多少，分为一元回归和多元回归分析；按照因变量的多少，可分为简单回归分析和多重回归分析；按照自变量和因变量之间的关系类型，可分为线性回归分析和非线性回归分析。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28373", "t": 1, "q": "下列关于聚类挖掘技术的说法中，错误的是（     ）。", "a": ["不预先设定数据归类类目，完全根据数据本身性质将数据聚合成不同类别", "要求同类数据的内容相似度尽可能小", "要求不同类数据的内容相似度尽可能小", "在事先不知道数据分类的情况下，根据数据之间的相似程度进行划分，目的是使得同类别的数据对象之间的差别尽可能的小，不同类别的数据对象之间的差别尽可能的大。", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】聚类(Clustering)是把数据集按照相似性划分为多个子集的过程，目的是使得属于同一类别的个体之间的距离尽可能的小，而不同类别上的个体的距离尽可能的大。聚类数据挖掘不预先设定数据类别，而是通过统计学的聚类分析方法进行数据挖掘。因此，A.\nC.D说法正确， B说法错误。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28374", "t": 1, "q": "（     ）将取代传统条形码，成为物品标识的最有效手段。", "a": ["<p>智能条码<\/p>", "<p>电子标签<\/p>", "<p>RFID<\/p>", "<p>智能标签<\/p>", "", ""], "r": "B", "e": "<p>【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。B选项正确。电子标签：是物品标识载体，可存储物品信息，能够取代传统纸质条形码，是物品标识的最有效手段。 C 选项错误。 RFID：是射频识别技术，是一种技术；电子标签是 RFID 技术里面的硬件载体。 A选项错误。 智能条码：本质还是条码，没有脱离传统条形码体系。 D选项错误。 智能标签：属于宽泛叫法，不是标准术语。<\/p>", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28375", "t": 1, "q": "（     ）是电子标签的一个重要组成部分，它主要负责存储标签内部信息，还负责对标签接收到的信号以及发送出去的信号做一些必要的处理。", "a": ["电子标签芯片", "天线", "射频接口", "读写模块", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】电子标签芯片是电子标签的一个重要组成部分，负责存储标签内部信息，负责对标签接收到的信号以及发送出去的信号做一些必要的处理。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28376", "t": 1, "q": "（     ）对接收的信号进行解调和译码然后送到后台软件系统处理。", "a": ["射频卡", "读写器", "天线", "中间件", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】读写器的作用是对接收的信号进行解调和译码然后送到后台软件系统处理。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28377", "t": 1, "q": "感知层是物联网体系架构的 （     ）层。", "a": ["第一层", "第二层", "第三层", "第四层", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】物联网体系架构自下向上依次是：感知层、网络层、应用层。感知层是第一层。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28378", "t": 1, "q": "（     ）是负责对物联网收集到的信息进行处理、管理、决策的后台计算处理平台。", "a": ["感知层", "网络层", "云计算平台", "物理层", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】云计算平台负责对物联网收集到的信息进行处理、管理、决策的后台计算处理平台。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28379", "t": 1, "q": "M2M技术的核心理念是（     ）。", "a": ["简单高效", "网络一切", "人工智能", "智慧地球", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】M2M涵盖了所有实现在人、机器、系统之间建立通信连接的技术和手段。因此，核心理念是：网络一切。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28380", "t": 1, "q": "M2M，不包括 （     ）。", "a": ["Man to Man", "Man to Machine", "Machine to Man", "Machine to Machine", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】M2M是Machine-to-Machine/Man的简称，所有不包括Man to Man。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28381", "t": 1, "q": "大数据的最显著特征是（     ）。", "a": ["数据规模大", "数据类型多样", "数据处理速度快", "数据价值密度高", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】（IBM提出）大数据的5V特点：Volume（大量，即数据规模大）、Velocity（高速，即数据变换快）、Variety（多样，数据种类繁多）、Value（低价值密度）、Veracity（真实性）。其中，最显著的特征为Volume。正确选项为A。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28382", "t": 1, "q": "作为物联网发展的排头兵，（     ）技术是市场最为关注的技术。", "a": ["射频识别", "传感器", "智能芯片", "无线传输网络", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】物联网是一种将各类信息传感设备（如RFI\nD.红外感应器、传感器、GPS、激光扫描器等）与互联网结合起来并可以实现智能化识别和管理的网络。其中，射频识别技术（RFID）是市场最为关注的技术。因此，正确答案为A。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28383", "t": 1, "q": "智能健康手环的应用开发，体现了（     ）的数据采集技术的应用。", "a": ["网络爬虫", "API接口", "统计报表", "传感器", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】智能健康手环，体现的是对传感器的数据采集技术应用。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28384", "t": 1, "q": "物联网的全球发展形势可能提前推动人类进入“智能时代”，也称（     ）。", "a": ["计算时代", "信息时代", "互联时代", "物连时代", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】物联网的全球发展形势可能提前推动人类进入“智能时代”，也称“物连时代”。因此，正确答案为D。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28385", "t": 1, "q": "大数据的起源是（     ）。", "a": ["金融", "电信", "公共管理", "互联网", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】大数据起源于互联网。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28386", "t": 1, "q": "云计算作为中国移动蓝海战略的一个重要部分，于2007年由移动研究院组织力量，联合中科院计算所，着手起步了一个叫做（     ）的项目。", "a": ["“国家云”", "“大云”", "“蓝云\"", "“蓝天”", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点3 云计算发展及现状。\n【解析】云计算作为中国移动蓝海战略的一个重要组成部分，由中国移动通信研究院于2007年组织力量，联合中科院计算所、华中理工大学等科研院所，开展了“大云”项目。因此，正确答案为B。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28387", "t": 1, "q": "在以下选项中，不属于大数据特征的是（     ）。", "a": ["数据规模庞大", "数据种类繁多", "数据变换不频繁", "数据价值密度低", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】（IBM提出）大数据的5V特点：Volume（大量，即数据规模大）、Velocity（高速，即数据变换快）、Variety（多样，数据种类繁多）、Value（低价值密度）、Veracity（真实性）。正确选项为C。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28388", "t": 1, "q": "适用于大数据的技术，不包括：（     ）。", "a": ["云计算平台", "数据挖掘", "分布式文件系统", "关系数据库", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】适用于大数据的技术，包括大规模并行处理（MPP）数据库、数据挖掘、分布式文件系统、分布式数据库、云计算平台、互联网和可扩展的存储系统。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28389", "t": 1, "q": "Microsoft Azure属于云服务的（     ）。", "a": ["SaaS", "PaaS", "IaaS", "以上三项都不是", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点3 云计算发展及现状。\n【解析】Microsoft Azure是微软基于云计算的操作系统，是微软“软件和服务”技术的名称，其主要目标是为开发者提供一个平台，帮助开发可运行在云服务器、数据中心、Web和PC上的应用程序。因此，它属于云服务的PaaS。因此，正确答案为B。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28390", "t": 1, "q": "云计算里面面临的一个很大的问题，就是（     ）。", "a": ["服务器", "存储", "计算", "节能", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点3 云计算发展及现状。\n【解析】云计算是分布式计算的一种，指的是通过网络“云”将巨大的数据计算处理程序分解成无数个小程序，然后，通过多部服务器组成的系统进行处理和分析这些小程序得到结果并返回给用户。云计算的核心是可以将很多的计算机资源协调在一起，因此，节能是其一个很大的问题。正确答案为D。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28391", "t": 1, "q": "服务提供者利用Web服务，通过Internet给软件开发者提供API应用接口，而不是整个应用程序。这种服务类型同（     ）类似。", "a": ["SaaS", "PaaS", "IaaS", "DaaS", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】PaaS服务，即：平台即服务，特点是为开发者提供一个平台，帮助开发可运行在云服务器、数据中心、Web和PC上的应用程序。题目所述，与PaaS类似。因此，正确答案为B。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28392", "t": 1, "q": "IBM在2007年11月推出了“改进游戏规则”的（     ）计算平台，为客户带来即买即用的云计算平台。", "a": ["蓝云", "蓝天", "ARUZE", "EC2", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点3 云计算发展及现状。\n【解析】IBM在2007年11月15日推出了蓝云计算平台，为客户带来即买即用的云计算平台。它包括一系列的云计算产品，使得计算不仅仅局限在本地机器或远程服务器农场（即服务器集群），通过架构一个分布式、可全球访问的资源结构，使得数据中心在类似于互联网的环境下运行计算。因此，正确答案为A。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28393", "t": 1, "q": "Amazon.com公司通过（     ）计算云，可以让客户通过WEB Service方式租用计算机来运行自己的应用程序。", "a": ["S3", "HDFS", "EC2", "GFS", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点3 云计算发展及现状。\n【解析】Amazon.com公司的EC2（elastic clusting computing）提供给了大家一种“用多少开多少，用多少付多少”的服务，可以让客户通过WEB Service方式租用计算机来运行自己的应用程序。因此，正确答案为C。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28394", "t": 1, "q": "当不知道数据所带标签时，可以使用哪种技术促使带同类标签的数据与带其他标签的数据相分离（     ）。", "a": ["<p>分类<\/p>", "<p>聚类<\/p>", "<p>关联分析<\/p>", "<p>隐马尔可夫链<\/p>", "", ""], "r": "B", "e": "<p>【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。 【解析】当不知数据所带标签时，需要使用聚类促织带同类标签的数据和其它标签数据分离。聚类针对未知类别，分类在聚类的基础上定义数据标签。<\/p>", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28395", "t": 1, "q": "依据历史数据形成刻画用户特征的类标识，进而可以预测未来数据的归类情况，属于（     ）。", "a": ["聚类", "分类", "预测", "关联", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】分类，是依据历史数据形成刻画用户特征的类标识，进而预测未来数据的归类情况。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28396", "t": 1, "q": "在事先不知道数据分类的情况下，根据数据之间的相似程度进行划分，目的是使得同类别的数据对象之间的差别尽可能的小，不同类别的数据对象之间的差别尽可能的大。这属于（     ）。", "a": ["聚类", "分类", "预测", "关联", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】聚类，是一种种无监督学习，在事先不知道数据分类的情况下，根据数据之间的相似程度进行划分，目的是使得同类别的数据对象之间的差别尽可能的小，不同类别的数据对象之间的差别尽可能的大。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28397", "t": 1, "q": "基于输入的用户信息，通过模型的训练学习，找出数据中的规律和趋势，以确定未来目标数据的预测值（     ）。1", "a": ["聚类", "分类", "预测", "关联", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】预测，是基于输入的用户信息，通过模型的训练学习，找出数据中的规律和趋势，以确定未来目标数据的预测值。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28398", "t": 1, "q": "某超市研究销售纪录数据后发现，买啤酒的人很大概率也会购买尿布，这种属于数据挖掘的哪类问题？（     ）。", "a": ["关联规则发现", "聚类", "分类", "自然语言处理", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】超市研究销售纪录数据，可以根据用户在购买商品时存在的商品之间的关联关系的分析，来建立关联规则，指导超市制定后续的营销策略。正确答案为A。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28399", "t": 1, "q": "（     ）反映数据的精细化程度，越细化的数据，价值越高。", "a": ["规模", "活性", "颗粒度", "关联度", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点2 数据和数据预处理。\n【解析】颗粒度是指具体的详细和清晰程度。颗粒度越细，表示细节越详尽，越有助于了解事情的全貌；\n颗粒度越粗，表示细节越少，更多的是抽象概括。因此，数据颗粒度越细，价值越高。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28400", "t": 1, "q": "噪声数据，是指: （     ）。", "a": ["指存在不确定的数据", "存在错误的数据", "被破坏的数据", "指数据中存在着错误或异常的数据", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点2 数据和数据预处理。\n【解析】噪声数据是指数据中存在着错误或异常(偏离期望值)的数据，这些数据对数据的分析造成了干扰，可能会影响对数据分析的结果。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28401", "t": 1, "q": "噪声数据的产生原因主要有：（     ）。", "a": ["采集设备有问题", "数据录入过程中产生错误", "数据传输过程出现错误", "以上都有", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点2 数据和数据预处理。\n【解析】噪声数据的产生原因可能是硬件故障、编程错误、语音或光学字符识别程序(OCR)识别出错等。选项A.B.C所述都有可能导致噪声数据的产生。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28402", "t": 1, "q": "数据清洗的方法不包括（     ）。", "a": ["缺失值处理", "一致性检查", "重复数据记录处理", "噪声数据清除", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点2 数据和数据预处理。\n【解析】数据清洗是指发现并纠正数据文件中可识别的错误的最后一道程序，一般是由计算机完成，包括检查数据一致性、处理无效值和缺失值等，但不包括对重复数据记录的处理。正确选项为C。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28403", "t": 1, "q": "下列哪个选项不是处理噪声数据的方法？（     ）。", "a": ["回归", "分箱", "聚类", "关联分析", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点2 数据和数据预处理。\n【解析】处理噪声数据的方法包括：分箱、回归、聚类、把计算机分析的结果给人检查看是否有问题。因此，“关联分析”不是噪声数据处理的方法。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28404", "t": 1, "q": "<p>在已经建设的公有云资源池，为用户划分单独使用的计算服务器和存储服务器资源，用户通过订购资源包的形式获得对物理计算资源/存储资源的独占使用的专属云称为（ ）。<\/p>", "a": ["<p>专属云(独享计算型)<\/p>", "<p>专属云(独享计算/存储型)<\/p>", "<p>专属云（独享计算/存储/网络型）<\/p>", "<p>私有云<\/p>", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点4 云计算实现机制。\n【解析】用户通过订购资源包的形式获得对物理计算资源/存储资源的独占使用的专属云，即为专属云(独享计算/存储型)。因此，正确答案为B。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28405", "t": 1, "q": "云计算的特性不包括：（     ）", "a": ["简便的访问", "高可信度", "投入不灵活", "按需计算与服务", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】云计算的特点包括：超大规模、虚拟化、高可靠性、通用性、高可扩展性、按需服务、极其廉价。投入不灵活，不是云计算的特点。因此，正确答案为C。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28406", "t": 1, "q": "云计算是一种按使用量付费的模式，这种模式提供可用的、便捷的、按需的网络访问，进入可配置的（     ）。", "a": ["计算资源共享池", "工作群组", "用户端共享资源", "服务提供商共享资源", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】“云”是一个计算资源池，通常为一些大型服务器集群，包括计算服务器、存储服务器、带宽资源等等。“云计算”将所有的计算资源集中起来，通过网络提供给用户。因此，正确答案为A。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28407", "t": 1, "q": "云主机是整合了计算、存储与（     ）的IT基础设施能力租用服务，能提供基于云计算模式的按需使用和按需付费能力的服务器租用服务。", "a": ["传统主机", "网络边缘设备", "网络资源", "云服务器", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】云主机是整合了计算、存储与网络资源的IT基础设施能力租用服务，能提供基于云计算模式的按需使用和按需付费能力的服务器租用服务。客户可以通过web界面的自助服务平台，部署所需的服务器环境。因此，正确答案为C。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28408", "t": 1, "q": "机器学习的分类主要包括：机械学习、传授学习、（     ）、归纳学习、基于解释的学习。", "a": ["类比学习", "对比学习", "总结学习", "智能学习", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点3 机器学习的分类。\n【解析】机器学习的分类，除了机械学习、传授学习、归纳学习、基于解释的学习，还有 类比学习。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28409", "t": 1, "q": "2017年5月，在中国乌镇围棋峰会上，基于（     ）的人工智能机器人AlphaGo战胜了排名世界第一的世界围棋冠军柯洁。", "a": ["人工思维", "深度学习", "模式识别", "专家系统", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】AlphaGo是基于深度学习方法开发的人工智能机器人。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28410", "t": 1, "q": "智能的特点不包括（     ）。", "a": ["感知能力", "记忆和思维能力", "行为决策能力", "信息反馈能力", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】智能的特点：.感知能力、记忆和思维能力、行为决策能力、学习和自适应能力。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28411", "t": 1, "q": "机器人为了能方便与人交流，利用打手势来表达自己的想法，这是智能的（     ）。", "a": ["思维能力", "感知能力", "行为能力", "学习能力", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】机器人利用打手势来表达自己的想法，是智能的行为能力。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28412", "t": 1, "q": "自然语言理解是人工智能的重要应用领域，下面列举中的（     ）不是它要实现的目标。", "a": ["理解别人讲的话", "对自然语言表示的信息进行分析概括或编辑", "欣赏音乐", "机器翻译", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】欣赏音乐不是人工智能的自然语言理解要实现的目标，其它选项所述均是。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28413", "t": 1, "q": "机器学习算法中的关联规则属于（     ）。", "a": ["监督学习", "无监督学习", "弱监督学习", "函数学习", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】聚类、关联规则，属于无监督学习。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28414", "t": 1, "q": "机器学习算法中的回归分析属于（     ）。", "a": ["监督学习", "无监督学习", "弱监督学习", "函数学习", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】回归分析、统计分类，属于监督学习。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28415", "t": 1, "q": "机器学习从不同的角度，有不同的分类方式，以下哪项不属于按系统学习能力分类的类别（     ）。", "a": ["监督学习", "无监督学习", "弱监督学习", "函数学习", "", ""], "r": "D", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】机器学习从不同的角度，有不同的分类方式，按系统学习能力分类分为：监督学习、无监督学习、弱监督学习。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28416", "t": 1, "q": "要想让机器具有智能，必须让机器具有知识。因此，在人工智能中有一个研究领域，主要研究计算机如何自动获取知识和技能，实现自我完善，这门研究分支学科叫（  ）。", "a": ["专家系统", "机器学习", "神经网络", "模式识别", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】研究计算机如何自动获取知识和技能，实现自我完善的学科是：机器学习。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28417", "t": 1, "q": "<p>下列哪个是云计算的核心特征？（ ）<\/p>", "a": ["<p>资源本地化<\/p>", "<p>按需自助服务<\/p>", "<p>固定费率<\/p>", "<p>单租户<\/p>", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】按需自助、广泛网络接入、资源池化、快速弹性、可度量服务是五大特征。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28418", "t": 1, "q": "<p>以下哪个是机器学习中监督学习和无监督学习的区别？（ ）<\/p>", "a": ["<p>是否有标签数据<\/p>", "<p>是否需要大量数据<\/p>", "<p>是否需要模型<\/p>", "<p>是否使用神经网络<\/p>", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】监督学习使用标记数据，无监督学习无标记。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28419", "t": 1, "q": "<p>下列哪个属于数据挖掘的任务？（ ）<\/p>", "a": ["<p>数据清洗<\/p>", "<p>关联规则挖掘<\/p>", "<p>数据压缩<\/p>", "<p>网络爬虫<\/p>", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】关联规则挖掘是数据挖掘典型任务（如购物篮分析）。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28420", "t": 1, "q": "<p>以下哪个是深度学习的基础模型？（ ）<\/p>", "a": ["<p>决策树<\/p>", "<p>支持向量机<\/p>", "<p>神经网络<\/p>", "<p>K近邻<\/p>", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】深度学习基于深层神经网络。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28421", "t": 1, "q": "<p>以下哪个是机器学习的经典算法？（ ）<\/p>", "a": ["<p>MapReduce<\/p>", "<p>HDFS<\/p>", "<p>决策树<\/p>", "<p>SQL<\/p>", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】决策树是典型机器学习算法。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28422", "t": 1, "q": "<p>针对大数据场景下模型过拟合问题，以下哪种方法不能有效缓解过拟合？（ ）<\/p>", "a": ["<p>增加训练样本数据量<\/p>", "<p>加入 L1、L2 正则化约束损失函数<\/p>", "<p>大幅增加神经网络隐藏层层数与神经元数量<\/p>", "<p>使用交叉验证划分数据集训练<\/p>", "", ""], "r": "C", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点4 模型拟合。\n【解析】选项A错，大数据扩充样本，减少噪声对模型的干扰，缓解过拟合；\n选项B错，正则化惩罚过大权重，限制模型复杂度，抑制过拟合；\n选项C对，增多网络层数、神经元会提升模型复杂度，加剧过拟合；\n选项D错，交叉验证避免单次划分数据带来的偶然性，评估并降低过拟合风险。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28423", "t": 2, "q": "大数据的特征包括（     ）。", "a": ["Volume", "Variety", "Veracity", "Velocity", "", ""], "r": "ABCD", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】大数据的特征有:①数据规模大；②数据种类多；③数据处理速度快；④数据价值密度低；⑤数据真实性。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28424", "t": 2, "q": "下列（     ）是物联网的应用模式。", "a": ["对象的智能标签", "环境监控", "对象跟踪", "自动部署", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】物联网具有以下应用模式:①对象的智能标签(如智能卡、条码标签)；②环境监控和对象跟踪(如共享单车)；③对象的智能控制（如根据光线的强弱来调整路灯的亮度）。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28425", "t": 2, "q": "<p>以下哪些是人工智能在教育领域的应用？（ ）<\/p>", "a": ["<p>智能辅导系统<\/p>", "<p>学生行为分析<\/p>", "<p>课程自动排程<\/p>", "<p>教室物理环境建设<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】智能辅导系统、学生行为分析和课程自动排程是AI在教育中的应用，而教室物理环境建设与AI应用关系不大。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28426", "t": 2, "q": "<p>下列哪些是云计算服务的常见类型？（ ）<\/p>", "a": ["<p>基础设施即服务(IaaS)<\/p>", "<p>平台即服务 (PaaS)<\/p>", "<p>软件即服务 (SaaS)<\/p>", "<p>数据即服务 (DaaS)<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】DaaS（数据即服务）虽然在某些场景下被提及，但IaaS、PaaS和SaaS是云计算中最常见的三种服务模型。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28427", "t": 2, "q": "<p>物联网(IoT)的关键技术包括（ ）。<\/p>", "a": ["<p>传感器技术<\/p>", "<p>RFID标签<\/p>", "<p>无线通信技术<\/p>", "<p>云计算平台<\/p>", "", ""], "r": "ABCD", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】IoT通过传感器收集数据，RFID进行物体标识，无线通信实现设备间连接，而云计算平台则用于存储和处理这些数据。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28428", "t": 2, "q": "在数据挖掘中，以下哪些算法可以用于分类任务？（     ）", "a": ["K-means聚类", "决策树", "支持向量机(SVM)", "Apriori算法", "", ""], "r": "BC", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】决策树和支持向量机常用于分类任务，而K-means用于聚类分析，Apriori算法用于关联规则学习。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28429", "t": 2, "q": "人工智能领域的研究方向包括（     ）。", "a": ["计算机视觉", "自然语言处理", "机器人学", "专家系统", "", ""], "r": "ABCD", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】这些都是AI研究中的重要领域，分别涉及图像识别、文本理解、物理操作以及知识推理。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28430", "t": 2, "q": "以下哪项是机器学习的监督学习方法？（     ）", "a": ["线性回归", "K近邻算法(KNN)", "主成分分析(PCA)", "随机森林", "", ""], "r": "ABD", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】监督学习方法如线性回归、KNN和随机森林需要有标记的数据集来训练模型，而PCA是一种无监督学习的降维技术。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28431", "t": 2, "q": "以下哪些技术或工具是大数据生态系统的一部分（     ）", "a": ["Hadoop", "Spark", "MongoDB", "Microsoft Excel", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】Hadoop、Spark和MongoDB是大数据生态系统中常用的技术和工具，而Microsoft Excel主要用于桌面级的数据处理，不属于大数据生态。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28432", "t": 2, "q": "<p>在大数据分析中，以下哪些技术有助于提升数据处理效率？（ ）<\/p>", "a": ["<p>MapReduce框架<\/p>", "<p>Hadoop分布式文件系统(HDFS)<\/p>", "<p>NoSQL数据库<\/p>", "<p>关系型数据库管理系统(RDBMS)<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】MapReduce、HDFS和NoSQL数据库是为了解决大数据的存储和处理问题而设计的，而RDBMS在处理传统规模数据上更为有效。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28433", "t": 2, "q": "<p>以下哪些是云计算带来的优势？（ ）<\/p>", "a": ["<p>弹性伸缩<\/p>", "<p>成本节约<\/p>", "<p>高可用性<\/p>", "<p>数据本地化<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】数据本地化与云计算的分布式特性相悖，而弹性伸缩、成本节约和高可用性是云计算的主要优势。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28434", "t": 2, "q": "<p>以下哪些是人工智能在医疗领域的应用？（ ）<\/p>", "a": ["<p>辅助诊断疾病<\/p>", "<p>个性化药物推荐<\/p>", "<p>手术机器人<\/p>", "<p>医疗器械制造<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】AI在医疗领域可辅助医生诊断、根据患者数据推荐个性化治疗方案，以及通过手术机器人提高手术精度，而医疗器械制造虽然与AI相关，但不直接属于医疗应用领域。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28435", "t": 2, "q": "<p>大数据技术如何帮助企业做出更好的决策？（ ）<\/p>", "a": ["<p>提供实时数据分析<\/p>", "<p>发现新的业务模式<\/p>", "<p>优化供应链管理<\/p>", "<p>减少数据存储需求<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】实时数据分析、发现新业务模式和优化供应链管理是大数据技术对企业决策支持的主要方式，而减少数据存储需求并非大数据技术的主要目标。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28436", "t": 2, "q": "<p>数据挖掘中常见的关联规则算法除了Apriori之外还有（ ）。<\/p>", "a": ["<p>FP-Growth<\/p>", "<p>Eclat<\/p>", "<p>K-Means<\/p>", "<p>DBSCAN<\/p>", "", ""], "r": "AB", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点3 数据挖掘技术。\n【解析】FP-Growth和Eclat也是用于关联规则学习的算法，而K-Means和DBSCAN则是聚类算法。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28437", "t": 2, "q": "<p>人工智能在自动驾驶汽车中的关键组件包括（ ）。<\/p>", "a": ["<p>深度学习网络<\/p>", "<p>传感器融合<\/p>", "<p>路径规划算法<\/p>", "<p>传统燃油发动机<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】深度学习网络、传感器融合和路径规划算法是自动驾驶汽车中AI的重要组成部分，而传统燃油发动机与AI技术无关。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28438", "t": 2, "q": "<p>以下哪些是机器学习中的无监督学习算法？（ ）<\/p>", "a": ["<p>K-Means聚类<\/p>", "<p>DBSCAN<\/p>", "<p>逻辑回归<\/p>", "<p>隐马尔科夫模型(HMM)<\/p>", "", ""], "r": "ABD", "e": "<p>【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。 【解析】K-Means、DBSCAN和HMM均属于无监督学习算法，而逻辑回归属于有监督学习算法。HMM既可以用于监督也可以用于无监督学习。<\/p>", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28439", "t": 2, "q": "<p>在物联网中，边缘计算的作用是（ ）。<\/p>", "a": ["<p>减少数据传输延迟<\/p>", "<p>提升数据处理速度<\/p>", "<p>增加数据安全性<\/p>", "<p>增加中央服务器负载<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点3 云计算发展及现状。\n【解析】边缘计算旨在减少延迟、提升处理速度和增强数据安全性，而不是增加中央服务器的负载。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28440", "t": 2, "q": "<p>大数据的实时流处理框架包括（ ）。<\/p>", "a": ["<p>Apache Kafka<\/p>", "<p>Apache Storm<\/p>", "<p>Apache Spark Streaming<\/p>", "<p>Hadoop MapReduce<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】Apache KafkA.Apache Storm和Apache Spark Streaming是实时流处理框架，而Hadoop MapReduce更适合批处理。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28441", "t": 3, "q": "物联网设备不需要考虑能耗问题，因为它们通常连接到电网供电。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】很多物联网设备，尤其是那些用于监测或移动应用的设备，依赖电池供电，因此能耗管理是物联网设计中的一个重要考虑因素。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28442", "t": 3, "q": "<p>大数据的“4V”特性指的是Volume、Velocity、Variety和Veracity。（ ）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p>【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。 【解析】大数据的“4V”特性包含了容量、种类、速度和价值(value)。<\/p>", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28443", "t": 3, "q": "物联网设备不需要任何网络连接即可工作。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】物联网设备通常需要网络连接才能与其他设备或云平台交换数据，实现其功能。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28444", "t": 3, "q": "数据挖掘仅限于寻找数据中的隐藏模式。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点1 数据挖掘。\n【解析】数据挖掘不仅限于模式发现，还包括预测建模、关联规则学习、分类、聚类等多种数据分析任务。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28445", "t": 3, "q": "人工智能和机器学习是完全相同的概念。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】机器学习是人工智能的一个子领域，专注于使计算机能够从数据中学习并改进其性能，而无需明确编程。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28446", "t": 3, "q": "机器学习算法必须有数据标签才能运行。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】 虽然监督学习需要标签数据，但无监督学习和半监督学习可以处理无标签或部分有标签的数据集。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28447", "t": 3, "q": "物联网安全主要依赖于加密技术来保证数据传输的安全。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】加密技术是确保物联网设备间数据传输安全的关键手段之一，它防止了数据在传输过程中的窃听和篡改。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28448", "t": 3, "q": "大数据处理技术可以实时分析和处理无限量的数据。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】 尽管大数据处理技术能够高效处理海量数据，但技术和资源限制意味着它不能实时处理无限量的数据。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28449", "t": 3, "q": "人工智能在医疗领域的应用可以完全取代医生的角色。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】 AI在医疗领域可以辅助诊断、提高效率和精确度，但它不能完全取代医生的专业判断和人文关怀。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28450", "t": 3, "q": "云计算服务总是比传统的本地IT基础设施更经济高效。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.1 云计算, 知识点1 云计算及其体系结构。\n【解析】虽然云计算通常提供了更高的灵活性和可扩展性，但在某些情况下，对于特定的工作负载或数据敏感性需求，本地IT基础设施可能更具成本效益。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28451", "t": 3, "q": "数据挖掘和机器学习是完全独立且不相关的两个领域。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点1 数据挖掘。\n【解析】数据挖掘与机器学习密切相关，数据挖掘中使用了许多机器学习算法和技术来发现数据中的模式和趋势。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28452", "t": 3, "q": "机器学习模型一旦训练完成，就不需要再更新或调整。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.6 机器学习, 知识点1 机器学习。\n【解析】机器学习模型需要定期用新数据进行更新和重新训练，以适应数据分布的变化和提高模型的准确性和时效性。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28453", "t": 3, "q": "数据挖掘的目的是将原始数据转换成有用的信息和知识。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.5 数据挖掘, 知识点1 数据挖掘。\n【解析】数据挖掘正是为了从大量数据中发现模式、趋势和关联，从而产生可用于决策的信息和洞察。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28454", "t": 3, "q": "人工智能技术的目标是让机器能够胜任一些通常需要人类智能才能完成的复杂工作，模拟人的行为，代替人类工作。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第5章 信息科学前沿, 5.4 人工智能, 知识点1 人工智能。\n【解析】题干对人工智能技术目标的描述（让机器胜任人类智能才能完成的复杂工作，模拟人的行为，代替人类工作），完全符合 AI 的核心定义、技术方向与实际应用场景，说法正确。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28455", "t": 3, "q": "在大数据分析中，数据质量的重要性低于数据量。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.3 大数据, 知识点1 大数据。\n【解析】在大数据分析中，数据质量的重要性并不低于数据量，相反，数据质量往往是成功进行大数据分析的关键前提。数据质量是分析可靠性的基础：如果数据存在大量错误、缺失、不一致或噪声，即使数据量再大，分析结果也可能产生偏差或误导性结论。高质量的数据能确保分析结果的准确性和可信度。\n大数据的特点包括“4V”（Volume大量、Velocity高速、Variety多样、Veracity真实性），其中“Veracity”（真实性）直接指向数据质量。数据量（Volume）只是基础，但若无质量保障，海量数据反而可能增加处理成本和复杂度，降低决策效率。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "28456", "t": 3, "q": "物联网中的设备必须具备自我维护能力。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章 信息科学前沿, 5.2 物联网, 知识点1 物联网。\n【解析】虽然一些高级物联网设备可能具备一定程度的自我监控和自我修复功能，但这不是所有物联网设备的必备条件。", "l3": "计算机基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = !!ans;
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
