style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机网络的主要功能是实现不同计算机之间的资源共享（如共享硬件设备、软件资源、数据等）以及数据通信（如文件传输、电子邮件发送等）。数据处理主要是计算机自身的功能，文献检索是网络应用的一种，信息传输是实现资源共享和数据通信的手段。所以选<\/font>C<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}, {"id": "189cad19084d1ba0jsjjd445344", "t": "3", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\">计算机病毒只能破坏计算机软件系统，不能破坏计算机硬件<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">（<\/font><span style=\"font-family:'Times New Roman';font-size:12.0000pt;\">&nbsp;&nbsp;&nbsp;<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">）<\/font><span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">。<\/font><span style=\"font-family:'Times New Roman';font-size:12.0000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">A.正确<\/font><span style=\"font-family:'Times New Roman';font-size:12.0000pt;\">", "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">B.错误<\/font><span style=\"font-family:'Times New Roman';font-size:12.0000pt;\">", "", "", "", ""], "r": "B", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】虽然计算机病毒本质上是程序代码，主要破坏对象是软件系统和数据，但某些特殊病毒可以通过破坏硬件固件（如<\/font><font face=\"Times New Roman\">BIOS<\/font><font face=\"宋体\">）、超频、反复读写等方式，对硬件造成物理损坏或寿命缩短。例如<\/font><font face=\"Times New Roman\">CIH<\/font><font face=\"宋体\">病毒就可以破坏主板<\/font><font face=\"Times New Roman\">BIOS<\/font><font face=\"宋体\">芯片，导致硬件无法正常工作。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad0f39b1a760jsjsc968557", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">TCP/IP<font face=\"宋体\">协议簇中，传输层的主要协议有<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.TCP<font face=\"宋体\">和<\/font><font face=\"Times New Roman\">UDP<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.IP<font face=\"宋体\">和<\/font><font face=\"Times New Roman\">ICMP<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.ARP<font face=\"宋体\">和<\/font><font face=\"Times New Roman\">RARP<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.FTP<font face=\"宋体\">和<\/font><font face=\"Times New Roman\">SMTP<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">传输层的主要协议是<\/font>TCP<font face=\"宋体\">（传输控制协议）和<\/font><font face=\"Times New Roman\">UDP<\/font><font face=\"宋体\">（用户数据报协议）。<\/font><font face=\"Times New Roman\">TCP<\/font><font face=\"宋体\">提供可靠的面向连接的数据传输服务；<\/font><font face=\"Times New Roman\">UDP<\/font><font face=\"宋体\">提供不可靠的无连接的数据传输服务。<\/font><font face=\"Times New Roman\">IP<\/font><font face=\"宋体\">是网络层协议，负责网络层的寻址和路由选择；<\/font><font face=\"Times New Roman\">ICMP<\/font><font face=\"宋体\">是网络层的控制报文协议；<\/font><font face=\"Times New Roman\">ARP<\/font><font face=\"宋体\">是地址解析协议，<\/font><font face=\"Times New Roman\">RARP<\/font><font face=\"宋体\">是逆地址解析协议，它们都属于网络层；<\/font><font face=\"Times New Roman\">FTP<\/font><font face=\"宋体\">是文件传输协议，<\/font><font face=\"Times New Roman\">SMTP<\/font><font face=\"宋体\">是简单邮件传输协议，属于应用层协议。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}, {"id": "189cad123b309ee0jsjjd504013", "t": "3", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机病毒只会感染可执行文件。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", "", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机病毒不仅会感染可执行文件（如<\/font>.exe<font face=\"宋体\">文件），还可能感染其他类型的文件，如文档文件（如<\/font><font face=\"Times New Roman\">Word<\/font><font face=\"宋体\">文档、<\/font><font face=\"Times New Roman\">Excel<\/font><font face=\"宋体\">文档）、脚本文件等。一些病毒通过宏病毒等方式感染文档文件，在用户打开文档时执行恶意代码；还有一些病毒会感染系统文件，影响系统的正常运行。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第4章"}, {"id": "189cad1573b37320jsjjd737037", "t": "3", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">NoSQL<font face=\"宋体\">数据库可以完全替代关系型数据库<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", "", "", ""], "r": "B", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><font face=\"Times New Roman\">NoSQL<\/font><font face=\"宋体\">在性能表现上虽然能优于关系型数据库，但是它并不能完全替代关系型数据库，二者相互补充。因此，题干说法错误。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第5章"}, {"id": "189cad0b4e4f32e0jsjjd097425", "t": "3", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">软件生命周期包括软件的需求分析、设计、编码、测试、维护等阶段，其中编码阶段是最重要的阶段。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:12.0000pt;\">", "<span style=\"font-family:宋体;font-size:12.0000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:12.0000pt;\">", "", "", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">软件生命周期的各个阶段都至关重要，缺一不可，不能简单地认为编码阶段是最重要的。需求分析阶段明确软件的功能和性能需求，为后续设计和开发提供基础，如果需求分析不准确，可能导致整个软件项目失败。设计阶段规划软件的架构和模块结构，影响软件的可扩展性、可维护性等。编码阶段只是将设计转化为代码实现，测试阶段发现软件中的错误，维护阶段保证软件在运行过程中持续满足用户需求和适应环境变化。每个阶段都对软件的质量和成功起着关键作用。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第2章"}, {"id": "189cad077b014b60jsjsc288009", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机中负责指挥和控制计算机各部分自动、协调一致地进行工作的部件是<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">运算器<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">控制器<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">存储器<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">输入设备<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">控制器是计算机的指挥中心，它根据指令的要求，有序地发出各种控制信号，指挥和控制计算机各部件自动、协调一致地工作。运算器主要负责算术运算和逻辑运算；存储器用于存储数据和程序；输入设备用于向计算机输入信息。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第1章"}, {"id": "189cad0b4e4f32e0jsjsc799284", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">在操作系统的五大管理功能中，负责将逻辑地址转换为物理地址的是<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">A.<font face=\"宋体\">处理机管理<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">B.<font face=\"宋体\">存储器管理<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">C.<font face=\"宋体\">设备管理<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">D.<font face=\"宋体\">文件管理<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】存储器管理功能主要包括内存分配、内存保护、地址映射和内存扩充四个方面。其中，地址映射是指将程序使用的逻辑地址（虚拟地址）转换为内存物理地址的过程，这是存储器管理的核心任务之一。处理机管理主要负责进程的创建、撤销、调度和同步等，与地址转换无关。设备管理负责缓冲管理、设备分配、设备处理等。文件管理负责文件的存储空间管理、目录管理、读写管理及共享保护等。因此，只有选项<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">正确。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第2章"}, {"id": "189cad077b014b60jsjjd734476", "t": "3", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机的字长是指<\/font>CPU<font face=\"宋体\">一次能处理的二进制数据的位数<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">。在其他指标都相同的情况下，<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">字长越长，计算机的运算精度和处理能力就越强。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">正确<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">错误<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", "", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">字长决定了计算机在同一时间内能够处理的数据量。字长越长，可表示的数据范围越大，运算精度越高，同时也能在单位时间内处理更多的数据，从而提升计算机的整体处理能力。例如，<\/font>32<font fa .5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABC<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">正数的原码、反码、补码相同：正确。正数的符号位为<\/font><font face=\"Times New Roman\">0<\/font><font face=\"宋体\">，数值位不变，三种表示完全相同。<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">负数的补码是反码加<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">：正确。这是补码的标准求法：符号位不变，其余各位取反得反码，再加<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">得补码。<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">补码表示中，<\/font><font face=\"Times New Roman\">0<\/font><font face=\"宋体\">有唯一表示：正确。<\/font><font face=\"Times New Roman\">8<\/font><font face=\"宋体\">位补码中，<\/font><font face=\"Times New Roman\">[+0]<\/font><font face=\"宋体\">补<\/font><font face=\"Times New Roman\">=[-0]<\/font><font face=\"宋体\">补<\/font><font face=\"Times New Roman\">=00000000<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">原码表示中，<\/font><font face=\"Times New Roman\">0<\/font><font face=\"宋体\">有唯一表示：错误。原码中有两种<\/font><font face=\"Times New Roman\">0<\/font><font face=\"宋体\">的表示：<\/font><font face=\"Times New Roman\">[+0]<\/font><font face=\"宋体\">原<\/font><font face=\"Times New Roman\">=00000000<\/font><font face :0.0000pt;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">D.<font face=\"宋体\">前者是无线网络，后者是有线网络<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】<\/font><font face=\"Times New Roman\">internet<\/font><font face=\"宋体\">（互连网）是一个通用名词，泛指由多个计算机网络互连而成的计算机网络，在这些网络之间可以使用任意的通信协议作为通信规则，不一定非要使用<\/font><font face=\"Times New Roman\">TCP/IP<\/font><font face=\"宋体\">。<\/font><font face=\"Times New Roman\">Internet<\/font><font face=\"宋体\">（互联网或因特网）则是一个专用名词，指当前全球最大的、开放的、由众多网络和路由器互连而成的特定计算机网络，它采用<\/font><font face=\"Times New Roman\">TCP/IP<\/font><font face=\"宋体\">族作为通信规则。因此，两者的根本区别在于是否必须使用<\/font><font face=\"Times New Roman\">TCP/IP<\/font><font face=\"宋体\">协议族。<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}, {"id": "189cad19084d1ba0jsjmc575866", "t": "2", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\"><font face=\"宋体\">下列协议中，属于应用层协议的有<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">FTP<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">B.SMTP<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">C.POP3<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">D.TCP<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.0000pt;font-size:10.5000pt;\">", "", ""], "r": "ABC", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;letter-spacing:0.0000pt;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABC<\/font><font face=\"宋体\">【解析】<\/font><font face=\"Times New Roman\">FTP<\/font><font face=\"宋体\">（文件传输协议）、<\/font><font face=\"Times New Roman\">SMTP<\/font><font face=\"宋体\">（简单邮件传送协议）、<\/font><font face=\"Times New Roman\">POP3<\/font><font face=\"宋体\">（邮局协议版本<\/font><font face=\"Times New Roman\">3<\/font><font face=\"宋体\">）都属于应用层协议。<\/font><font face=\"Times New Roman\">TCP<\/font><font face=\"宋体\">（传输控制协议）属于传输层协议。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}, {"id": "189cad0f39b1a760jsjmc198706", "t": "2", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">以下属于计算机网络协议的有<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.TCP<font face=\"宋体\">（传输控制协议）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.UDP<font face=\"宋体\">（用户数据报协议）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.HTTP<font face=\"宋体\">（超文本传输协议）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.FTP<font face=\"宋体\">（文件传输协议）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "ABCD", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABCD<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">TCP<font face=\"宋体\">是一种面向连接的、可靠的传输层协议，确保数据准确无误地传输；<\/font><font face=\"Times New Roman\">UDP<\/font><font face=\"宋体\">是一种无连接的传输层协议，传输速度快但不保证数据的可靠性，常用于实时性要求高的应用，如视频流、音频流传输。<\/font><font face=\"Times New Roman\">HTTP<\/font><font face=\"宋体\">用于在<\/font><font face=\"Times New Roman\">Web<\/font><font face=\"宋体\">浏览器和<\/font><font face=\"Times New Roman\">Web<\/font><font face=\"宋体\">服务器之间传输超文本，是网页浏览的基础协议；<\/font><font face=\"Times New Roman\">FTP<\/font><font face=\"宋体\">用于在网络上进行文件的上传和下载操作<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}, {"id": "189cad0f39b1a760jsjsc805754", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">在计算机网络中，<\/font>IP<font face=\"宋体\">地址的作用是<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">标识网络中的一台主机<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">标识网络中的一个用户<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">标识网络中的一个进程<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">标识网络中的一个服务<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">IP<font face=\"宋体\">地址是互联网协议地址，用于在网络中唯一标识一台主机，使得不同主机之间能够进行通信。它不是用于标识用户、进程或服务的。用户通过账号等方式标识，进程通过进程<\/font><font face=\"Times New Roman\">ID<\/font><font face=\"宋体\">等标识，服务通过端口号等标识。所以选<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}, {"id": "189cad0f39b1a760jsjmc512273", "t": "2", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">.<font face=\"宋体\">下列哪项是计算机病毒的特征？<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">传染性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">潜伏性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">破坏性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">可修复性<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "ABC", "e": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABC<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机病毒的特征包括传染性、潜伏性和破坏性，但不具备可修复性。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第3章"}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
</html>
