", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657299", "t": 2, "q": "云计算中，“弹性伸缩”的实现方式包括以下哪些？", "a": ["根据用户需求手动调整资源配置", "根据预设规则自动减少资源（如CPU利用率低于20%时）", "根据预设规则自动增加资源（如CPU利用率超过80%时）", "仅在业务高峰期手动增加资源", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657300", "t": 2, "q": "云计算中，保障数据安全的技术措施有哪些？", "a": ["数据加密存储（如AES加密）", "数据脱敏（如敏感信息替换）", "访问控制（如IAM权限管理）", "资源池化技术", "", ""], "r": "ABC", "e": "A选项数据加密存储可防止数据被非法获取；B选项数据脱敏能保护敏感信息；C选项访问控制可限制对数据的访问，这些都能保障数据安全。而D选项资源池化技术主要是为了提高资源利用率，并非保障数据安全的技术措施。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657301", "t": 2, "q": "云计算中，IaaS（基础设施即服务）模式为用户提供的资源包括（　）？", "a": ["存储空间", "虚拟服务器（CPU、内存）", "操作系统", "应用软件", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657302", "t": 2, "q": "云计算中，SaaS（软件即服务）模式的典型应用有（　）？", "a": ["办公软件（如腾讯企业邮、Google Docs）", "视频会议软件（如Zoom）", "服务器虚拟化软件（如VMware vSphere）", "客户关系管理系统（CRM，如Salesforce）", "", ""], "r": "ABD", "e": "SaaS模式是通过网络提供软件服务。A选项腾讯企业邮、Google Docs是在线办公软件服务；B选项Zoom提供线上视频会议服务；D选项Salesforce提供客户关系管理软件服务，它们都符合SaaS模式。而C选项服务器虚拟化软件是用于服务器资源管理，并非以软件服务形式供用户直接使用，不属于SaaS典型应用。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657303", "t": 2, "q": "增强现实（AR）技术的典型应用场景有哪些？", "a": ["远程手术指导（实时叠加操作提示）", "工业设备维修指导", "虚拟游戏（完全脱离真实环境）", "教育培训（如解剖学AR模型叠加）", "", ""], "r": "ABD", "e": "AR是将虚拟信息与真实世界融合，C选项说完全脱离真实环境是VR的特点，A、B、D都是在真实场景中叠加虚拟信息。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657304", "t": 2, "q": "增强现实（AR）技术的关键支撑技术有（　）？", "a": ["实时定位与地图构建（SLAM）", "云计算技术", "3D建模技术", "图像识别与跟踪技术", "", ""], "r": "ACD", "e": "实时定位与地图构建能确定设备位置和环境地图；3D建模可创建虚拟物体；图像识别与跟踪技术用于识别和跟踪现实场景中的对象，这三者都是AR关键支撑技术。云计算技术并非AR核心关键支撑。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657305", "t": 2, "q": "增强现实（AR）技术在教育领域的应用有（　）？", "a": ["构建虚拟实验室，让学生进行危险实验的模拟操作", "录制教学视频，供学生课后观看", "在课本插图上叠加3D模型，直观展示知识（如人体器官）", "实时翻译黑板上的外文内容，叠加在原文旁", "", ""], "r": "ACD", "e": "增强现实（AR）是将虚拟信息与真实世界融合。A、C、D选项分别通过模拟操作、叠加3D模型、叠加翻译内容，把虚拟信息与现实场景结合。B选项只是录制视频，未体现AR技术融合虚拟与现实的特点。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657306", "t": 2, "q": "增强现实（AR）与虚拟现实（VR）的共同技术需求有（　）？", "a": ["专用的显示设备", "实时的运动追踪技术", "高性能图形处理能力", "与真实环境的交互能力", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657307", "t": 2, "q": "增强现实技术中，适合用于移动设备（如手机）的AR开发框架有哪些？", "a": ["Vuforia", "Unreal Engine", "ARCore（谷歌）", "ARKit（苹果）", "", ""], "r": "ACD", "e": "Vuforia是广泛用于移动设备的AR开发框架；ARCore是谷歌为安卓移动设备提供的AR开发平台；ARKit是苹果为iOS设备打造的AR开发框架。Unreal Engine是游戏开发引擎，虽可用于AR开发但不是专为移动设备AR开发设计。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657308", "t": 2, "q": "增强现实技术中，虚拟物体与真实环境融合的关键技术有哪些？", "a": ["3D建模技术", "SLAM（同步定位与地图构建）", "色彩校正（虚拟物体与真实环境色彩匹配）", "光照一致性处理（虚拟物体与真实环境光照匹配）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760576", "t": 3, "q": "物联网体系架构中的\"平台层\"是连接感知层和应用层的桥梁，主要负责数据处理与分析。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "物联网四层（或三层）体系架构中，平台层（或称网络层与服务层）确实承担连接感知层与应用层的桥梁作用。<br />感知层负责数据采集（传感器、RFID等）；<br />平台层（含网络通信与云平台）负责数据传输、协议转换、数据存储、计算与分析；<br />应用层实现具体业务逻辑（智能家居、工业监控等）。<br />平台层通过中间件、云计算、大数据分析等技术对感知层数据进行处理，并为应用层提供服务接口，因此题干表述正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760577", "t": 3, "q": "物联网网络层的通信技术只能采用无线通信方式，无法使用有线通信方式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网网络层通信技术既可用无线通信方式，也能使用有线通信方式，并非只能用无线通信。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760578", "t": 3, "q": "物联网网络层的主要功能是实现感知层设备与平台层之间的数据传输，常用的通信协议包括TCP/IP、LoRa等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "物联网网络层确实承担感知层设备与平台层间数据传输的功能，TCP/IP是常见网络通信协议，LoRa是低功耗广域物联网通信技术协议，所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760579", "t": 3, "q": "物联网网络层的主要功能是实现感知层数据的长距离、可靠传输，可使用WiFi、LoRa、NB-IoT等通信协议。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "物联网网络层负责将感知层采集的数据进行远距离、可靠传输，WiFi、LoRa、NB - IoT等都是常用于此的通信协议。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760580", "t": 3, "q": "物联网应用层的智能农业场景中，主要通过平台层实现精准灌溉控制，感知层仅负责采集土壤湿度数据，不参与控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在物联网智能农业场景里，感知层不仅采集土壤湿度数据，其采集的数据会反馈到平台层进行分析处理，然后通过执行器等实现精准灌溉控制，感知层是参与整个控制流程的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760581", "t": 3, "q": "物联网应用层的主要功能是将平台层处理后的数据转化为具体的业务应用，如智能交通、智能家居。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "物联网应用层确实是把平台层处理后的数据用于具体业务应用，像智能交通、智能家居等都是典型例子。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760582", "t": 3, "q": "物联网应用中的\"智能家电\"属于物联网体系架构的应用层范畴。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "物联网体系架构中应用层负责实现物联网的各种应用，智能家电是基于物联网技术实现智能化控制等功能的具体应用，所以属于应用层范畴。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760583", "t": 3, "q": "物联网中的\"边缘计算\"技术是将云计算的部分计算任务迁移到物联网设备端，目的是减少数据传输量，降低延迟。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边缘计算就是把原本由云计算处理的部分任务放到物联网设备端执行，这样能在本地处理数据，减少传往云端的数据量，进而降低延迟。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760584", "t": 3, "q": "物联网中的\"网关\"设备，主要作用是将感知层设备的异构数据（如ZigBee、蓝牙）转换为网络层的标准协议（如TCP/IP）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "物联网网关就像一个“翻译官”，感知层设备数据协议多样（如ZigBee、蓝牙），网络层常用标准协议（如TCP/IP），网关能完成两者间的转换。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760585", "t": 3, "q": "物联网中的\"NB-IoT\"通信协议具有高功耗、短覆盖范围的特点，适合用于近距离设备通信。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "NB - IoT是低功耗广域网通信技术，特点是低功耗、广覆盖，并非高功耗、短覆盖范围，也不是适合近距离设备通信。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760586", "t": 3, "q": "物联网中的\"RFID阅读器\"通过射频信号读取RFID标签中的数据，实现物体识别。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RFID阅读器利用射频信号与RFID标签进行通信，能读取标签中的数据，从而实现对物体的识别。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760587", "t": 3, "q": "物联网中的NB-IoT技术，作为低功耗广域网技术，其传输距离比LoRa短，功耗比LoRa高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "NB - IoT和LoRa都是低功耗广域网技术，NB - IoT传输距离一般比LoRa短，但功耗比LoRa低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760588", "t": 3, "q": "物联网中的ZigBee协议由于传输速率高、功耗低，适合用于智能电网等需要大量数据传输的场景。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "ZigBee协议传输速率相对较低，不适合大量数据传输场景，智能电网这类需大量数据传输的场景它并不适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760589", "t": 3, "q": "虚拟现实（VR）和增强现实（AR）的根本区别在于，VR需要使用头戴式显示设备，而AR可以不使用任何显示设备。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VR是创造完全虚拟环境，通常要头戴式显示设备沉浸其中；AR是把虚拟信息叠加到现实场景，也需要显示设备来呈现叠加效果，并非可不使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760590", "t": 3, "q": "虚拟现实（VR）技术的\"沉浸感\"主要依赖于高分辨率的显示设备，与其他技术（如运动追踪、音效）无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VR技术的沉浸感是多方面技术共同作用的结果，不仅依赖高分辨率显示设备，运动追踪能让用户动作与虚拟场景互动，音效营造逼真环境氛围，都对沉浸感有重要影响。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760591", "t": 3, "q": "虚拟现实（VR）技术只能用于娱乐和游戏场景，无法应用于工业、医疗等专业领域。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虚拟现实（VR）技术除娱乐和游戏场景外，在工业、医疗等专业领域也有广泛应用。比如工业上可用于虚拟装配、虚拟培训等；医疗上能辅助手术规划、康复治疗等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760592", "t": 3, "q": "虚拟现实（VR）体验中的\"眩晕感\"主要是由于虚拟场景的分辨率过低导致的，与画面刷新延迟无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VR体验中的“眩晕感”主要是画面刷新延迟等导致视觉与身体感知不匹配造成的，并非主要因为虚拟场景分辨率过低，且与画面刷新延迟密切相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760593", "t": 3, "q": "虚拟现实（VR）系统中，用户看到的虚拟场景是通过双眼视差效应产生立体感的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "VR系统利用双眼视差原理，为左右眼分别提供有细微差异的图像，大脑将这两幅图像融合，从而产生立体感。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760594", "t": 3, "q": "虚拟现实（VR）系统中的\"运动追踪技术\"仅能追踪用户头部的运动，无法追踪手部、身体的运动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虚拟现实（VR）系统中的运动追踪技术不仅能追踪用户头部运动，也能追踪手部、身体等部位的运动，这样能为用户带来更沉浸、交互性强的体验。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760595", "t": 3, "q": "虚拟现实系统的\"视场角（FOV）\"越大，用户的沉浸感越强，因此视场角越大越好，无需考虑其他因素。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然视场角大有助于增强沉浸感，但并非越大越好，还需考虑人眼生理极限、设备成本、技术实现难度等其他因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760596", "t": 3, "q": "虚拟现实系统中，用户产生\"晕动症\"的主要原因是虚拟场景的分辨率过低，导致画面模糊。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "用户在虚拟现实系统中产生“晕动症”主要是因为视觉和前庭觉等感官信息不匹配，而非虚拟场景分辨率过低画面模糊。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760597", "t": 3, "q": "云计算的\"按需付费\"特性意味着用户只需为实际使用的云资源付费，未使用的资源不产生费用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“按需付费”就是按实际使用的云资源来计费，没使用的资源自然不会收费。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760598", "t": 3, "q": "云计算的\"按需付费\"特性意味着用户只需为实际使用的资源付费，无需承担闲置资源成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "云计算按需付费模式下，用户根据实际使用资源量计费，不会因资源闲置产生额外费用，无需承担闲置资源成本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760599", "t": 3, "q": "云计算的\"边缘计算\"将计算任务部署在云数据中心，降低数据传输延迟。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边缘计算是将计算任务部署在靠近数据源的边缘侧，而非云数据中心，这样能减少数据传输到中心再返回的过程，降低数据传输延迟。所以题干表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760600", "t": 3, "q": "云计算的\"弹性扩展\"特性仅支持计算资源（如CPU、内存）的动态增加，不支持资源的动态减少。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "云计算的“弹性扩展”特性既支持计算资源动态增加，也支持资源动态减少，以灵活应对不同业务需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760601", "t": 3, "q": "云计算的\"弹性扩展\"特性允许用户根据业务负载变化，自动增加或减少使用的云资源数量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "云计算的弹性扩展特性就是能让用户依据业务负载的变化，自动对使用的云资源数量进行增减。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760602", "t": 3, "q": "云计算的\"高可用性\"通常通过多副本存储、多区域部署等方式实现，确保服务在硬件故障时不中断。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "云计算通过多副本存储可在某副本损坏时使用其他副本，多区域部署能在一个区域故障时由其他区域提供服务，以此保障服务在硬件故障等情况下不中断，实现高可用性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760603", "t": 3, "q": "云计算的\"资源池化\"技术，使得多个用户可以共享同一物理硬件资源，但逻辑上每个用户的资源是隔离的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这种说法是正确的。云计算资源池化是将大量的物理资源集中管理，通过虚拟化等技术，多个用户能共享同一物理硬件资源。同时在逻辑层面，会采用多种隔离机制保证每个用户资源相互独立，互不干扰。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760604", "t": 3, "q": "云计算的\"资源池化\"特性将不同用户的资源隔离存储，用户无法共享资源池中的资源。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "云计算“资源池化”是将各类资源整合形成资源池，用户可按需从资源池中共享使用资源，并非隔离存储且不能共享。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760605", "t": 3, "q": "云计算的私有云部署模式中，云资源可以被多个不同企业共享使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "私有云是为一个客户单独使用而构建的，云资源仅归该企业私有，不会被多个不同企业共享。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760606", "t": 3, "q": "云计算的IaaS模式中，服务商提供的资源包括虚拟机、存储磁盘和操作系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在IaaS（基础设施即服务）模式中，服务商提供计算、存储、网络等基础硬件资源，虚拟机和存储磁盘属于此类。但操作系统通常不属于IaaS直接提供的资源范畴，用户可自行选择和安装。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760607", "t": 3, "q": "在云计算的SaaS（软件即服务）模式中，用户需要自行安装和维护软件的升级与补丁。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "SaaS模式下，软件由服务提供商负责安装、维护、升级等，用户只需通过网络使用软件，无需自行处理这些。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760608", "t": 3, "q": "云计算中的\"边缘计算\"技术，是将云计算的部分计算任务迁移到靠近终端设备的边缘节点，以减少数据传输延迟。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边缘计算就是把原本集中在云端的部分计算任务移到靠近终端设备的边缘节点，这样能有效减少数据传输距离，从而降低数据传输延迟。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760609", "t": 3, "q": "云计算中的\"高可靠性\"主要通过数据备份、多副本存储、故障自动转移等技术实现，确保服务不中断。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据备份、多副本存储、故障自动转移等技术能有效应对数据丢失、硬件故障等问题，可保证云计算服务持续稳定运行，实现高可靠性。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760610", "t": 3, "q": "云计算中的\"公有云\"资源对所有用户开放，因此不同用户的资源之间没有隔离，存在数据泄露风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "公有云虽对所有用户开放，但云服务商会采用多种技术实现不同用户资源的隔离，并非没有隔离。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760611", "t": 3, "q": "云计算中的\"混合云\"部署模式，是指将私有云和公有云完全独立运行，两者之间没有任何数据交互。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混合云是将私有云和公有云结合，它们之间可进行数据交互与资源共享，并非完全独立无数据交互。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760612", "t": 3, "q": "云计算中的\"可计量服务\"特性，允许用户根据实际使用的资源（如CPU时长、存储容量）进行付费，实现按需计费。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "云计算“可计量服务”就是能对资源使用量精准计量，让用户按实际使用资源付费，实现按需计费。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760613", "t": 3, "q": "云计算中的\"容器技术\"比\"虚拟机技术\"启动速度更快，是因为容器无需加载完整的操作系统内核。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "容器技术和虚拟机技术相比，容器共享宿主机内核，无需加载完整操作系统内核，所以启动速度更快。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760614", "t": 3, "q": "云计算中的\"私有云\"只能由企业自身搭建和管理，无法委托第三方服务商建设。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "私有云可以由企业自身搭建管理，也能委托第三方服务商建设。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760615", "t": 3, "q": "云计算中的\"资源池化\"特性是将多个用户的物理资源整合为一个共享资源池，用户按需从资源池获取资源，实现资源共享。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "云计算“资源池化”就是把分散的物理资源整合为共享资源池，用户按需取用，实现资源共享。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760616", "t": 3, "q": "云计算中的\"FaaS\"（函数即服务）是PaaS的一种细分形式，聚焦于事件驱动的函数级代码运行，无需管理服务器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "FaaS是PaaS的细分，以事件驱动运行函数级代码，用户不用管理服务器。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760617", "t": 3, "q": "云计算中的\"PaaS\"（平台即服务）模式为用户提供的是现成的应用软件，用户无需进行任何开发工作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PaaS提供的是平台，让用户能基于此开发、部署和管理应用程序，而非现成的应用软件。所以该表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760618", "t": 3, "q": "云计算中的IaaS服务模式，用户需要自行负责操作系统的安装和维护，而SaaS服务模式下用户无需关心任何底层软硬件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "IaaS是基础设施即服务，用户要自行负责操作系统等的安装和维护；SaaS是软件即服务，用户只需使用软件，无需关心底层软硬件。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760619", "t": 3, "q": "云计算中的PaaS服务模式，不仅提供开发平台，还包含了具体的业务应用程序，用户可直接使用这些应用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PaaS主要提供开发平台，让用户能基于此开发、部署应用，不包含具体业务应用程序供用户直接使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760620", "t": 3, "q": "云计算中的SaaS服务模式，用户需要为使用的软件支付一次性购买费用，而非按使用量付费。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "SaaS（软件即服务）是按使用量或订阅方式付费，并非支付一次性购买费用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760621", "t": 3, "q": "增强现实（AR）技术必须依赖专用的AR眼镜才能实现，普通智能手机无法支持AR应用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "增强现实（AR）技术并非必须依赖专用AR眼镜，普通智能手机也能支持AR应用，很多手机都有相关AR软件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760622", "t": 3, "q": "增强现实（AR）技术的应用场景必须依赖真实物理环境，无法在完全虚拟的空间中使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760623", "t": 3, "q": "增强现实（AR）技术在医疗领域的主要应用是模拟手术过程，让医生进行手术演练，无需接触真实患者。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760624", "t": 3, "q": "增强现实（AR）技术在应用时，必须依赖SLAM（同步定位与地图构建）技术才能实现虚拟物体与真实环境的融合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "增强现实（AR）实现虚拟物体与真实环境融合并非只能依赖SLAM技术，还有其他方式和技术可达成。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760625", "t": 3, "q": "增强现实（AR）技术中，手机AR应用的实现不需要专用的AR眼镜，仅通过手机摄像头和屏幕即可完成虚拟与真实的融合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "手机本身有摄像头可捕捉现实场景，屏幕能展示虚拟信息与现实场景融合画面，无需专用AR眼镜就能实现手机AR应用的虚拟与真实融合。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760626", "t": 3, "q": "增强现实（AR）技术中，虚拟物体与真实环境的\"光照一致性\"处理，是指让虚拟物体的颜色与真实环境保持完全一致。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“光照一致性”并非指虚拟物体颜色与真实环境完全一致，而是要使虚拟物体的光照效果（如光影、明暗等）与真实环境相匹配。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760627", "t": 3, "q": "增强现实（AR）技术中的\"SLAM\"（实时定位与地图构建）技术，主要用于识别图像中的物体，而非构建环境地图。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。SLAM技术主要功能是构建环境地图并确定自身在地图中的位置，并非主要用于识别图像中的物体。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760628", "t": 3, "q": "AR技术的\"SLAM\"技术仅能构建真实环境地图，无法确定AR设备在地图中的位置。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "SLAM技术不仅能构建真实环境地图，还可以确定AR设备在地图中的位置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760629", "t": 3, "q": "AR技术可以在手机、平板等普通移动设备上使用，无需专用AR头显。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "AR技术可通过手机、平板等普通移动设备上的相关应用程序实现，不一定要专用AR头显。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760630", "t": 3, "q": "AR技术与VR技术的最核心区别在于是否保留真实环境，AR保留真实环境，VR完全虚拟。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "AR（增强现实）是将虚拟信息与真实环境相结合，保留真实环境；VR（虚拟现实）是创造完全虚拟的环境。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760631", "t": 3, "q": "AR技术中的\"虚实融合\"要求虚拟信息与真实环境的位置、比例完全对齐，否则会影响用户体验。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "AR技术强调虚拟与现实结合，虚拟信息和真实环境在位置、比例上精准对齐能让融合效果自然真实，若未对齐会使场景不协调，严重影响体验。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760632", "t": 3, "q": "VR技术需要将虚拟信息叠加到真实环境中，因此必须依赖真实环境才能使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VR（虚拟现实）技术是创建和体验虚拟世界，是完全沉浸式的虚拟环境，不依赖真实环境；将虚拟信息叠加到真实环境的是AR（增强现实）技术。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760633", "t": 3, "q": "VR技术中的\"六自由度（6DoF）\"仅包括用户在虚拟环境中的前后、左右、上下3个方向的平移。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VR技术中六自由度（6DoF）不仅包含前后、左右、上下3个方向的平移，还包括绕3个轴的旋转。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760634", "t": 3, "q": "VR技术中的\"运动追踪\"仅能追踪用户头部运动，无法追踪手部、身体等其他部位的运动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VR技术中的运动追踪不仅能追踪用户头部运动，也可以追踪手部、身体等其他部位的运动。", "ap": [false, false, false, false, false, false]}, {"id": "2034813883444760635", "t": 3, "q": "VR设备的\"视野角（FOV）\"越小，用户在虚拟环境中的沉浸感越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "视野角（FOV）越大，用户能看到的虚拟场景范围越广，沉浸感越强；FOV越小，看到的范围小，沉浸感弱。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第8章 信息工程（1）", "n": "基础练习题【含解析】 / 第8章 信息工程（1）", "qs": [{"id": "2034813893070688256", "t": 1, "q": "操作系统安全中，“安全审计日志”的保留期限应至少满足以下哪个要求（基于等保三级标准）？", "a": ["至少保留30天", "至少保留90天", "至少保留7天", "至少保留180天", "", ""], "r": "D", "e": "根据《信息安全技术 网络安全等级保护基本要求》（GB/T 22239-2019）中关于安全审计的相关规定，第三级安全等级保护（等保三级）要求“安全审计日志”的保留期限应至少保留180天。因此，正确答案为 D. 至少保留180天。", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688257", "t": 1, "q": "操作系统安全中，\"安全增强型Linux（SELinux）\"的核心安全机制是基于以下哪种访问控制模型？", "a": ["基于角色的访问控制（RBAC）", "强制访问控制（MAC）", "基于属性的访问控制（ABAC）", "自主访问控制（DAC）", "", ""], "r": "B", "e": "SELinux核心是强制访问控制（MAC），它通过系统强制策略对主体和客体的访问进行严格控制。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688258", "t": 1, "q": "操作系统安全中，\"当用户登录系统时，系统验证用户提供的用户名和密码是否与存储的认证信息一致\"这一过程属于？", "a": ["授权", "审计", "加密", "认证", "", ""], "r": "D", "e": "认证就是验证用户身份的过程，题干中验证用户名和密码是否与存储信息一致，是典型的身份认证。授权是赋予用户访问权限；审计是对系统活动进行记录和审查；加密是对数据进行编码保护。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688259", "t": 1, "q": "操作系统安全中，\"恶意程序通过修改'系统启动项'，实现开机自动运行\"，这种攻击方式主要利用了操作系统的哪个特性？", "a": ["启动加载特性", "内存管理特性", "文件系统特性", "进程调度特性", "", ""], "r": "A", "e": "修改系统启动项能让恶意程序开机自动运行，这是利用了操作系统启动加载时会执行启动项里程序的特性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688260", "t": 1, "q": "操作系统安全中，\"恶意代码防护\"的核心措施不包括？", "a": ["禁止用户安装未经授权的软件", "启用系统的实时防护功能，监控异常行为", "定期清理系统临时文件，释放磁盘空间", "安装杀毒软件，定期查杀恶意代码", "", ""], "r": "C", "e": "定期清理系统临时文件主要是为释放磁盘空间，与恶意代码防护核心关联不大，而A、B、D选项都直接针对恶意代码防护。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688261", "t": 1, "q": "操作系统安全中，“恶意代码防护”的核心技术不包括以下哪项？", "a": ["特征码检测技术", "行为分析检测技术", "内存虚拟化技术", "沙箱隔离技术", "", ""], "r": "C", "e": "特征码检测、行为分析检测和沙箱隔离都是恶意代码防护常用技术，内存虚拟化技术主要用于提高系统资源利用率和实现多虚拟机环境等，并非恶意代码防护核心技术。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688262", "t": 1, "q": "操作系统安全中，\"将系统中的'关键文件'（如系统内核文件）设置为'只读'属性，防止被恶意修改\"，这一措施属于？", "a": ["身份认证", "内存保护", "文件权限控制", "进程隔离", "", ""], "r": "C", "e": "设置文件为“只读”属性属于对文件访问权限的控制。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688263", "t": 1, "q": "操作系统安全中，\"进程隔离\"的实现依赖于以下哪种核心技术？", "a": ["日志审计", "用户身份认证", "虚拟内存管理", "文件系统权限控制", "", ""], "r": "C", "e": "虚拟内存管理能为每个进程分配独立的地址空间，以此实现进程隔离。日志审计用于记录系统活动；用户身份认证是确认用户身份；文件系统权限控制主要针对文件访问。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688264", "t": 1, "q": "操作系统安全中，\"进程隔离\"的主要目的是？", "a": ["防止进程占用过多系统资源", "确保一个进程的异常不会影响其他进程的正常运行", "方便进程间的数据共享", "提高进程的运行效率", "", ""], "r": "B", "e": "进程隔离就是让各个进程相互独立，避免一个进程的异常对其他进程产生影响。A选项防止资源占用过多不是进程隔离主要目的；C选项进程隔离不利于进程间数据共享；D选项进程隔离与运行效率无关。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688265", "t": 1, "q": "操作系统安全中，\"进程权限继承\"是指？", "a": ["文件被复制后继承原文件的权限", "服务启动时继承系统管理员权限", "用户切换时继承前一用户的权限", "子进程继承父进程的部分或全部权限", "", ""], "r": "D", "e": "“进程权限继承”主要说的是进程间权限传递，子进程继承父进程部分或全部权限符合这一概念。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688266", "t": 1, "q": "操作系统安全中，\"进程在执行过程中，只能访问其权限范围内的内存空间，无法越权访问其他进程内存\"这一特性依赖于以下哪种机制？", "a": ["进程调度", "内存隔离", "文件权限管理", "用户身份认证", "", ""], "r": "B", "e": "该特性强调进程只能访问自身权限内内存，防止越权访问其他进程内存，这正是内存隔离机制的作用。进程调度是安排进程执行顺序；文件权限管理针对文件访问；用户身份认证用于确认用户身份。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688267", "t": 1, "q": "操作系统安全中，\"日志审计\"的关键要求不包括以下哪一项？", "a": ["日志需记录操作主体、操作对象、操作时间、操作结果", "日志需包含用户的所有操作，包括正常的日常操作", "日志需定期备份，防止丢失", "日志需存储在不可篡改的介质中（如写保护的磁盘）", "", ""], "r": "B", "e": "“日志审计”关键是记录关键信息、保证完整性和可用性等，没必要记录用户所有操作，会造成大量冗余。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688268", "t": 1, "q": "操作系统安全中，\"文件系统安全\"的核心措施不包括？", "a": ["对敏感文件设置严格的权限（如仅管理员可读写）", "对文件进行完整性校验（如使用MD5哈希）", "对文件进行压缩存储，节省磁盘空间", "对敏感文件进行加密存储，防止未授权访问", "", ""], "r": "C", "e": "文件系统安全核心是保障文件的访问控制、完整性和保密性。A项设置权限、B项完整性校验、D项加密存储都与安全相关。而C项文件压缩存储主要是为节省磁盘空间，并非文件系统安全核心措施。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688269", "t": 1, "q": "操作系统安全中，\"虚拟化安全\"的核心风险不包括？", "a": ["虚拟机之间的隔离失效，导致数据泄露", "虚拟机的硬件资源不足，影响业务运行", "虚拟机逃逸（从虚拟机突破到宿主机）", "虚拟机关闭后，内存数据未清理导致泄露", "", ""], "r": "B", "e": "虚拟化安全核心风险主要围绕安全漏洞、隔离性及数据安全等。硬件资源不足影响业务运行是性能问题，非安全核心风险。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688270", "t": 1, "q": "操作系统安全中，\"用户身份认证\"的多因素认证（MFA）是指？", "a": ["使用两个不同的密码进行认证（如登录密码+交易密码）", "由两个不同的管理员分别进行认证", "使用两种或两种以上不同类型的认证因子（如密码+U盾）", "在两个不同的设备上分别进行认证", "", ""], "r": "C", "e": "多因素认证强调使用两种或以上不同类型认证因子来增强安全性，像密码和U盾就是不同类型因子。A只是不同用途密码；B是不同管理员认证；D是不同设备认证，都不符多因素认证概念。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688271", "t": 1, "q": "操作系统安全中，“最小权限原则”的具体体现不包括以下哪项？", "a": ["为用户分配所有可能用到的权限，避免频繁授权", "普通用户默认不具备管理员权限", "进程运行时仅拥有完成任务必需的权限", "临时授权后，任务完成即收回权限", "", ""], "r": "A", "e": "“最小权限原则”是指给主体分配仅够完成任务的必要权限。A选项为用户分配所有可能用到的权限，这不符合最小权限原则，会使权限过大；B、C、D选项都体现了只给予必要权限、控制权限范围等最小权限原则的特点。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688272", "t": 1, "q": "操作系统安全中，“最小权限原则”的应用场景不包括？", "a": ["临时操作完成后，及时回收临时授予的高权限", "用户的密码需定期更换，且复杂度满足要求", "普通用户仅授予完成其工作必需的权限", "系统服务使用低权限账号运行，而非root/admin", "", ""], "r": "B", "e": "“最小权限原则”强调给予主体完成任务所需的最小权限。A、C、D选项都围绕权限的合理分配和限制，而B选项说的是密码更换和复杂度要求，与权限分配无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688273", "t": 1, "q": "操作系统安全中，\"Linux系统中，通过chmod命令修改文件权限，使文件所有者可读写执行，同组用户可读执行，其他用户无权限\"，对应的权限数值是？", "a": ["750", "640", "740", "650", "", ""], "r": "A", "e": "文件所有者可读写执行，对应权限值为 4（读）+2（写）+1（执行） = 7；同组用户可读执行，对应权限值为 4（读）+1（执行） = 5；其他用户无权限，对应权限值为 0。所以权限数值是 750。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688274", "t": 1, "q": "操作系统安全中，\"Linux系统中的'sudo'命令允许普通用户临时执行高权限操作\"，其设计遵循的安全原则是？", "a": ["默认安全原则", "纵深防御原则", "最小权限原则", "分权制衡原则", "", ""], "r": "C", "e": "最小权限原则指用户仅被授予完成工作所需的最少权限。“sudo”让普通用户临时获高权限执行特定操作，完成后权限收回，符合该原则。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688275", "t": 1, "q": "操作系统安全中，\"Windows系统中的'用户账户控制（UAC）'功能，在用户执行高权限操作时弹出确认窗口\"，其主要作用是？", "a": ["优化系统资源分配", "提高系统运行速度", "防止恶意程序未经授权执行高权限操作", "简化用户操作流程", "", ""], "r": "C", "e": "用户账户控制（UAC）在用户执行高权限操作时弹出确认窗口，可让用户确认操作，避免恶意程序在用户不知情下进行高权限操作。A项与资源分配无关，B项不影响系统运行速度，D项不是简化操作流程。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688276", "t": 1, "q": "操作系统安全中，下列关于\"安全审计日志\"的描述，错误的是？", "a": ["日志仅需记录成功操作，失败操作无需记录", "日志应定期备份，防止被篡改或删除", "日志应包含事件发生时间、主体、客体、操作类型等信息", "应记录用户登录、权限变更、重要操作等关键事件", "", ""], "r": "A", "e": "安全审计日志需记录成功和失败操作，全面反映系统活动，A选项说仅记录成功操作错误。B备份防篡改删除、C包含相关信息、D记录关键事件都是正确做法。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688277", "t": 1, "q": "操作系统安全中，以下哪种访问控制模型是基于\"主体所属角色\"和\"客体所需权限\"进行权限分配的？", "a": ["自主访问控制（DAC）", "强制访问控制（MAC）", "基于属性的访问控制（ABAC）", "基于角色的访问控制（RBAC）", "", ""], "r": "D", "e": "RBAC基于主体所属角色和客体所需权限分配权限。DAC由主体自主决定访问权限；MAC由系统强制分配；ABAC基于属性来决定访问权限。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688278", "t": 1, "q": "操作系统安全中，以下哪种行为属于\"特权升级（Privilege Escalation）\"攻击？", "a": ["攻击者利用病毒感染系统进程", "攻击者窃取普通用户的账号密码", "攻击者删除系统关键日志文件", "普通用户通过漏洞获取root/admin权限", "", ""], "r": "D", "e": "特权升级指普通权限用户利用漏洞获取更高权限。A是病毒感染进程；B是窃取账号密码；C是删除日志文件，均不属于特权升级。D普通用户通过漏洞获取root/admin高权限，属于特权升级。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688279", "t": 1, "q": "操作系统安全中，Linux系统的\"文件权限控制\"采用rwx三位权限位，下列哪个权限组合表示文件所有者可读写、同组用户可读、其他用户无权限？", "a": ["rwxr--r--", "rw-r-----", "rw-rw-r--", "r--r--r--", "", ""], "r": "B", "e": "r表示读权限，w表示写权限，x表示执行权限。三个一组依次代表文件所有者、同组用户、其他用户的权限。题目要求所有者可读写即rw，同组用户可读即r，其他用户无权限即空，所以是rw-r-----。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688280", "t": 1, "q": "操作系统安全中，Windows系统的\"强制访问控制（MAC）\"通常通过以下哪个组件实现？", "a": ["可信计算基（TCB）中的安全参考监视器（SRM）", "用户账户控制（UAC）", "安全标识符（SID）", "活动目录（AD）中的组策略", "", ""], "r": "A", "e": "安全参考监视器（SRM）是可信计算基（TCB）的一部分，负责实施强制访问控制（MAC），对主体访问客体进行控制。UAC是限制程序权限的机制；SID用于标识用户和组；AD组策略用于管理和配置计算机和用户。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688281", "t": 1, "q": "根据《软件工程产品质量第1部分:质量模型》（GB/T1），软件\"安全性\"子特性不包括以下哪项？", "a": ["数据保密性", "抗抵赖性", "易理解性", "数据完整性", "", ""], "r": "C", "e": "“易理解性”是功能性中适合性的子特性，并非安全性子特性，而数据保密性、抗抵赖性、数据完整性都属于安全性子特性。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688282", "t": 1, "q": "根据《信息安全技术信息安全风险管理指南》（GB/T 24364），信息安全风险管理的流程不包括？", "a": ["风险评估（识别、分析、评价）", "风险预测（预测未来可能发生的风险类型）", "风险处理（规避、转移、降低、接受）", "风险监控与审查", "", ""], "r": "B", "e": "《信息安全技术信息安全风险管理指南》（GB/T 24364）规定的信息安全风险管理流程包含风险评估、风险处理、风险监控与审查，不涉及风险预测。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688283", "t": 1, "q": "根据《信息技术安全技术信息安全管理体系要求》（GB/T 22080），信息安全管理体系的核心要素不包括以下哪项？", "a": ["信息安全方针", "内部审核与管理评审", "风险评估与处理", "软件漏洞扫描频率", "", ""], "r": "D", "e": "信息安全管理体系核心围绕方针制定、风险应对及体系评审改进等，软件漏洞扫描频率只是一个具体操作层面细节，并非核心要素。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688284", "t": 1, "q": "根据《信息技术安全技术信息安全事件分类分级指南》（GB/T 20986），信息安全事件的分级不考虑以下哪项因素？", "a": ["事件造成的损失程度（如经济损失）", "事件影响的范围（如涉及用户数量）", "事件的紧急程度（如是否需立即处理）", "事件的发生时间（如工作日或节假日）", "", ""], "r": "D", "e": "信息安全事件分级主要依据事件造成的损失、影响范围等与事件危害程度相关的因素，而发生时间（工作日或节假日）对事件分级无直接影响。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688285", "t": 1, "q": "根据《信息技术软件产品评价质量特性及其使用指南》（GB/T 16260），软件的\"安全性\"质量特性属于以下哪个质量特性类别？", "a": ["功能性", "维护性", "易用性", "可靠性", "", ""], "r": "A", "e": "功能性包含适合性、准确性、互操作性、依从性、安全性等子特性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688286", "t": 1, "q": "根据《信息系统安全等级保护定级指南》（GB/T 22240），信息系统的定级需考虑\"业务信息安全\"和\"系统服务安全\"两个维度，每个维度的等级划分为？", "a": ["1-3级", "1-4级", "1-5级", "1-6级", "", ""], "r": "C", "e": "《信息系统安全等级保护定级指南》（GB/T 22240）规定，业务信息安全和系统服务安全两个维度的等级均划分为1 - 5级。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688287", "t": 1, "q": "根据《信息系统安全等级保护基本要求》（GB/T 22239），某企业的财务信息系统被定为\"三级等保\"，其\"安全管理中心\"的要求不包括？", "a": ["要求每年进行一次等级测评", "具备安全策略的集中管理功能", "实现安全事件的集中收集与分析", "提供用户身份的集中认证服务", "", ""], "r": "A", "e": "A选项是等级测评相关规定，并非“安全管理中心”要求；B、C、D是安全管理中心应具备的功能。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688288", "t": 1, "q": "根据《信息系统安全等级保护基本要求》（GB/T 22239），三级信息系统对\"数据备份与恢复\"的要求不包括以下哪项？", "a": ["需采用加密方式存储备份数据", "关键数据备份介质需异地存放", "备份恢复演练每年至少进行一次", "每天至少进行一次全量备份", "", ""], "r": "A", "e": "三级信息系统对“数据备份与恢复”要求有关键数据备份介质异地存放、备份恢复演练每年至少一次、每天应至少进行一次完全备份等，但未强制需采用加密方式存储备份数据。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688289", "t": 1, "q": "根据《信息系统安全集成服务资质等级评定条件》，一级资质与二级资质的核心区别在于？", "a": ["一级资质要求企业成立年限不少于5年，二级不少于3年", "一级资质可承接所有规模的信息系统安全集成项目，二级有项目规模限制", "一级资质要求技术人员数量不少于100人，二级不少于50人", "一级资质仅可承接国内项目，二级可承接国际项目", "", ""], "r": "B", "e": "一级资质在业务承接上优势明显，可承接所有规模项目，二级有规模限制，这是二者核心区别。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688290", "t": 1, "q": "根据《信息系统工程监理暂行规定》，信息系统工程监理单位的核心职责不包括以下哪项？", "a": ["替代建设单位进行项目需求分析与方案设计", "对工程质量、进度、投资进行控制", "协调建设单位与承建单位的工作关系", "对工程合同、信息进行管理", "", ""], "r": "A", "e": "监理单位主要是监督、控制、协调和管理工作，不能替代建设单位进行项目需求分析与方案设计。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688291", "t": 1, "q": "根据《信息系统工程监理暂行规定》，信息系统工程监理的核心内容不包括？", "a": ["用户培训指导", "进度控制", "成本控制", "质量控制", "", ""], "r": "A", "e": "信息系统工程监理核心内容是“四控三管一协调”，其中“四控”为进度、成本、质量和变更控制。用户培训指导不属于核心内容。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688292", "t": 1, "q": "软件安全开发生命周期（SDL）中，“威胁建模”环节通常在哪个阶段开展？", "a": ["需求分析阶段", "测试验收阶段", "部署运维阶段", "编码实现阶段", "", ""], "r": "A", "e": "威胁建模是在软件开发早期识别和评估潜在安全威胁的过程，需求分析阶段确定软件功能和特性，此时开展威胁建模能提前发现问题，为后续开发提供安全方向。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688293", "t": 1, "q": "软件安全开发生命周期（SDL）中，\"在需求分析阶段明确软件的安全目标、安全约束及风险评估方法\"对应的是哪个阶段的核心任务？", "a": ["部署阶段", "测试阶段", "需求阶段", "设计阶段", "", ""], "r": "C", "e": "题目描述明确指出是在需求分析阶段进行相关操作，所以对应的就是需求阶段的核心任务。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688294", "t": 1, "q": "软件安全中，“安全需求”与“功能需求”的主要区别是？", "a": ["安全需求关注系统“怎么做”，功能需求关注系统“做什么”", "安全需求关注系统“不被破坏”，功能需求关注系统“能实现”", "安全需求无需验证，功能需求需通过测试验证", "安全需求仅在系统设计阶段提出，功能需求在需求阶段提出", "", ""], "r": "B", "e": "安全需求重点在于保障系统不被破坏、攻击等，功能需求主要关注系统能实现什么功能。A选项说反了；安全需求和功能需求都需验证，C错误；安全需求和功能需求在多个阶段都可能提出，D错误。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688295", "t": 1, "q": "软件安全中，\"动态应用安全测试（DAST）\"的优势是？", "a": ["可在软件开发早期（如编码阶段）开展测试", "无需部署应用，直接对代码进行分析", "可检测运行时才出现的漏洞（如会话固定）", "测试速度快，可实现全自动化", "", ""], "r": "C", "e": "DAST是在应用运行时进行测试。A选项早期编码阶段适合静态测试；B选项不部署应用分析代码是静态测试特点；D选项DAST测试速度慢且难以全自动化。而它能检测运行时出现的漏洞，如会话固定。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688296", "t": 1, "q": "软件安全中，\"动态应用安全测试（DAST）\"无法检测到以下哪种漏洞？", "a": ["SQL注入漏洞", "未授权访问漏洞", "源代码中的缓冲区溢出漏洞", "跨站请求伪造（CSRF）漏洞", "", ""], "r": "C", "e": "DAST是在程序运行时进行测试。而源代码中的缓冲区溢出漏洞需分析源代码才能发现，DAST不涉及对源代码的分析。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688297", "t": 1, "q": "软件安全中，\"对软件的源代码进行模糊测试，通过输入非预期数据检测软件是否出现崩溃、异常等漏洞\"，这种测试方法属于？", "a": ["交互式应用安全测试（IAST）", "动态应用安全测试（DAST）", "灰盒测试", "静态应用安全测试（SAST）", "", ""], "r": "B", "e": "模糊测试是向程序输入非预期数据来检测异常，是在程序运行时进行的测试，属于动态测试。DAST是动态应用安全测试。IAST强调交互；灰盒测试侧重于部分了解内部结构；SAST是静态分析代码。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688298", "t": 1, "q": "软件安全中，\"缓冲区溢出攻击\"的根本原因是？", "a": ["软件运行环境未安装杀毒软件", "软件使用了对称加密算法", "软件未对用户输入的长度进行有效检查和限制", "软件未开启日志审计功能", "", ""], "r": "C", "e": "缓冲区溢出攻击是因程序没有对用户输入的长度做有效检查和限制，输入数据超出缓冲区容量就会覆盖其他内存区域，造成攻击。而有无杀毒软件、用对称加密算法、是否开启日志审计和缓冲区溢出攻击无根本关联。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688299", "t": 1, "q": "软件安全中，\"静态应用安全测试（SAST）\"的局限性不包括？", "a": ["可能产生较多的误报，需人工验证", "无法检测第三方开源组件的漏洞", "无法检测运行时才出现的漏洞（如条件竞争）", "对代码的覆盖率依赖于分析工具的能力", "", ""], "r": "B", "e": "SAST可检测第三方开源组件漏洞，B选项不是其局限性。A选项误报需人工验证、C选项无法检测运行时漏洞、D选项代码覆盖率依赖工具能力都是SAST的局限性。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688300", "t": 1, "q": "软件安全中，\"静态应用安全测试（SAST）\"的主要特点是？", "a": ["在软件运行时动态检测漏洞", "依赖真实的攻击流量模拟测试", "无需运行软件，直接分析源代码或二进制文件", "主要检测软件的性能与稳定性问题", "", ""], "r": "C", "e": "SAST是静态测试，不用运行软件，通过分析源代码或二进制文件找漏洞。A是动态测试特点；B是渗透测试等模拟攻击测试的方式；D中性能与稳定性非SAST主要检测内容。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688301", "t": 1, "q": "软件安全中，\"开源软件安全\"的主要风险不包括？", "a": ["开源软件的代码可公开获取，导致攻击者易分析漏洞", "开源软件无法与商业软件兼容，影响系统集成", "开源软件的许可证可能存在法律风险（如GPL许可证要求开源衍生作品）", "开源软件的漏洞修复不及时，存在未修复漏洞", "", ""], "r": "B", "e": "开源软件通常可与商业软件兼容，能进行系统集成，B选项描述并非开源软件安全主要风险。A选项代码公开易被分析漏洞、C选项许可证法律风险、D选项漏洞修复不及时都是常见风险。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688302", "t": 1, "q": "软件安全中，\"开源软件存在'已知漏洞未及时修复'的风险，其主要原因是？", "a": ["开源软件无法加密", "开源软件运行效率低", "开源软件代码公开，漏洞易被发现但修复依赖社区", "开源软件仅适用于非商业场景", "", ""], "r": "C", "e": "开源软件代码公开，大家都能发现漏洞，但修复要靠社区里开发者来完成，所以会出现已知漏洞未及时修复情况。A选项加密与漏洞修复无关；B选项运行效率和漏洞修复不相关；D选项开源软件也用于商业场景，且这与漏洞修复无直接联系。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688303", "t": 1, "q": "软件安全中，\"漏洞利用代码（Exploit）\"的主要作用是？", "a": ["检测软件中是否存在漏洞", "修复软件中的漏洞，防止被攻击", "验证漏洞的存在，并利用漏洞执行特定操作（如获取权限）", "向软件厂商报告漏洞的详细信息", "", ""], "r": "C", "e": "漏洞利用代码是利用软件漏洞的程序，目的是验证漏洞存在并利用其实施特定操作，像获取系统权限等。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688304", "t": 1, "q": "软件安全中，\"漏洞赏金计划\"属于以下哪种安全保障措施？", "a": ["内部安全测试", "众测（crowdsourced security testing）", "自动化安全扫描", "第三方安全评估", "", ""], "r": "B", "e": "“漏洞赏金计划”是通过奖励的方式吸引大量外部人员（公众）来发现软件漏洞，这符合众测的特点。内部安全测试是内部团队进行；自动化安全扫描靠工具自动检测；第三方安全评估由专业第三方机构完成。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688305", "t": 1, "q": "软件安全中，\"模糊测试（Fuzz Testing）\"的主要目的是发现软件的哪种安全缺陷？", "a": ["权限控制缺陷（如越权访问）", "配置错误（如默认密码）", "输入验证缺陷（如缓冲区溢出）", "代码逻辑漏洞（如条件竞争）", "", ""], "r": "C", "e": "模糊测试是向软件输入大量随机数据，检测软件对异常输入的处理能力，主要用于发现输入验证缺陷，像缓冲区溢出等。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688306", "t": 1, "q": "软件安全中，\"软件供应链安全\"的风险主要来源于以下哪一环节？", "a": ["软件需求分析阶段的需求遗漏", "软件部署阶段的配置错误", "软件使用阶段的用户操作不当", "第三方组件（如开源库）的漏洞", "", ""], "r": "D", "e": "软件供应链安全强调的是软件构建过程中各环节和组件的安全。第三方组件广泛用于软件开发，其漏洞会直接引入安全风险，是软件供应链安全的主要风险来源。而A是需求分析问题，B是部署问题，C是使用问题，都不属于供应链安全主要风险环节。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688307", "t": 1, "q": "软件安全中，\"软件漏洞赏金计划\"的主要作用是？", "a": ["向用户普及软件漏洞的危害，提高安全意识", "鼓励安全研究人员发现并报告软件漏洞", "为软件厂商提供漏洞修复的技术支持", "为软件的安全测试提供资金支持", "", ""], "r": "B", "e": "“软件漏洞赏金计划”是软件厂商为吸引安全研究人员发现并报告其软件漏洞而设立的奖励机制。A选项普及危害并非主要目的；C选项不提供技术支持；D选项也不是为测试提供资金。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688308", "t": 1, "q": "软件安全中，\"软件在开发过程中未对'第三方SDK'进行安全评估，导致SDK中的恶意代码窃取用户数据\"，这种风险属于？", "a": ["软件供应链风险", "用户操作风险", "代码漏洞风险", "运行环境风险", "", ""], "r": "A", "e": "第三方SDK属于软件供应链的一部分，未对其进行安全评估致恶意代码窃取数据，这是软件供应链环节出现的风险。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688309", "t": 1, "q": "软件安全中，\"软件在设计时采用'最小权限原则'，即每个模块或用户仅拥有完成其任务所需的最小权限\"，其主要目的是？", "a": ["简化软件开发流程", "减少权限滥用导致的安全风险", "降低软件维护成本", "提高软件运行效率", "", ""], "r": "B", "e": "“最小权限原则”让模块或用户只有完成任务所需最小权限，可避免权限过大被滥用，从而降低安全风险。答案为B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688310", "t": 1, "q": "软件安全中，\"软件在运行时检测到自身代码被篡改（如被植入恶意代码），自动终止运行并报警\"的技术称为？", "a": ["代码签名验证", "内存保护", "运行时完整性校验", "输入验证", "", ""], "r": "C", "e": "运行时完整性校验就是在软件运行时检查代码是否完整、有无被篡改，若检测到篡改会自动终止运行并报警。代码签名验证主要用于验证软件来源；内存保护侧重于防止内存被非法访问；输入验证是对输入数据进行合法性检查。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688311", "t": 1, "q": "软件安全中，\"依赖项扫描\"主要用于检测以下哪种安全风险？", "a": ["软件自身代码中的逻辑漏洞", "软件所依赖的第三方库、组件中的已知漏洞", "软件运行时的内存泄漏问题", "软件的界面交互漏洞", "", ""], "r": "B", "e": "依赖项扫描重点在于检查软件所依赖的第三方库和组件，看其中是否存在已知漏洞。A选项是针对自身代码逻辑漏洞，C是运行时内存泄漏，D是界面交互方面，都不是依赖项扫描的主要检测对象。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688312", "t": 1, "q": "软件安全中，“在软件发布后，持续监控软件运行过程中的安全事件，收集漏洞信息并发布补丁”的活动属于？", "a": ["安全维护阶段", "安全测试阶段", "安全需求分析", "安全设计阶段", "", ""], "r": "A", "e": "软件发布后持续监控、收集漏洞及发补丁，这是在软件投入使用后保障其安全的后续工作，属于安全维护阶段。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688313", "t": 1, "q": "软件安全中，下列关于\"动态应用安全测试（DAST）\"和\"静态应用安全测试（SAST）\"的区别，正确的是？", "a": ["DAST可检测运行时漏洞，SAST检测代码层面漏洞", "DAST无需运行软件即可进行，而SAST需要在软件运行状态下执行", "DAST适用于开发过程中的编码阶段，SAST则是在软件部署到生产环境后使用", "DAST仅能应用于Web应用程序的安全测试，SAST专门针对桌面应用程序", "", ""], "r": "A", "e": "DAST是动态测试，可检测运行时漏洞；SAST是静态测试，检测代码层面漏洞。B选项说反了，DAST需运行软件，SAST无需运行。C选项，SAST用于开发编码阶段，DAST在部署后。D选项，二者都可用于多种类型应用程序。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688314", "t": 1, "q": "软件安全中，下列关于\"静态应用安全测试（SAST）\"的描述，错误的是？", "a": ["可检测出缓冲区溢出、SQL注入等漏洞", "无需运行软件即可分析代码中的安全漏洞", "依赖软件运行时的行为数据进行分析", "在软件编码阶段或编译前进行", "", ""], "r": "C", "e": "SAST是静态分析，不依赖软件运行时行为数据，C选项描述错误。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688315", "t": 1, "q": "软件安全中，下列关于\"软件漏洞赏金计划\"的描述，正确的是？", "a": ["仅针对已发布软件的漏洞，开发中的软件不适用", "通过奖励外部安全研究者提交漏洞，提前发现并修复漏洞", "漏洞提交后无需验证即可获得奖励", "仅由软件厂商内部团队参与漏洞挖掘", "", ""], "r": "B", "e": "软件漏洞赏金计划是软件厂商为提前发现并修复漏洞，奖励外部安全研究者提交漏洞。开发中软件也适用，漏洞需验证，并非仅内部团队参与。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688316", "t": 1, "q": "软件安全中，以下哪种漏洞属于\"逻辑漏洞\"，而非\"内存漏洞\"？", "a": ["条件竞争", "栈溢出", "缓冲区溢出", "使用已释放的内存（UAF）", "", ""], "r": "A", "e": "逻辑漏洞是程序逻辑设计缺陷，内存漏洞与内存操作错误有关。栈溢出、缓冲区溢出、使用已释放的内存都和内存操作相关。条件竞争是因多个进程或线程在访问共享资源时执行顺序不当导致的逻辑问题。所以答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688317", "t": 1, "q": "数据库安全中，\"当多个事务同时访问数据库时，通过'锁机制'防止事务间的数据不一致（如脏读、不可重复读）\"，这一机制保障了事务的哪个特性？", "a": ["持久性", "隔离性", "一致性", "原子性", "", ""], "r": "B", "e": "锁机制可防止多事务并发访问时的数据不一致，其目的是让事务相互隔离互不干扰，保障了隔离性。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688318", "t": 1, "q": "数据库安全中，\"当数据库发生故障（如断电、硬件损坏）时，通过事务日志将数据库恢复到故障前的一致性状态\"，这一过程依赖于数据库的哪种机制？", "a": ["事务的隔离性", "事务的持久性", "事务的一致性", "事务的原子性", "", ""], "r": "B", "e": "事务的持久性保证一旦事务提交，其对数据库的修改会永久保存，当数据库故障时，可依据事务日志恢复到故障前状态体现了持久性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813893070688319", "t": 1, "q": "数据库安全中，\"将数据库中的敏感字段（如身份证号、银行卡号）替换为无意义的占位符，同时保留数据格式和统计特性\"的技术称为？", "a": ["数据脱敏", "数据备份", "数据镜像", "数据加密", "", ""], "r": "A", "e": "数据脱敏就是把敏感数据替换成占位符，还保留数据格式和统计特性；数据备份是复制数据以防丢失；数据镜像是对数据进行复制；数据加密是对数据进行编码保护。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344640", "t": 2, "q": "《信息技术软件工程软件生存周期过程》（GB/T 8566）中，与\"软件安全\"相关的过程要求包括以下哪些？（　）", "a": ["在测试阶段开展安全测试，验证安全需求满足度", "在维护阶段定期进行安全评估，修复新发现的漏洞", "在需求阶段明确安全需求，纳入需求文档", "在部署阶段制定安全部署方案，确保环境安全", "", ""], "r": "ABCD", "e": "软件安全贯穿软件生存周期各阶段，需求阶段明确安全需求、测试阶段开展安全测试、部署阶段制定安全部署方案、维护阶段进行安全评估与漏洞修复都与“软件安全”相关。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344641", "t": 2, "q": "操作系统安全中，“安全加固”的主要操作包括以下哪些？（　）", "a": ["删除默认账户、禁用弱密码，强化账户安全", "关闭不必要的服务与端口，减少攻击面", "优化操作系统的内存管理算法，提升运行效率", "更新操作系统补丁，修复已知安全漏洞", "", ""], "r": "ABD", "e": "安全加固是为提高系统安全性采取的措施，A强化账户、B减少攻击面、D修复漏洞都属于安全加固操作；C优化内存管理算法是提升性能，并非安全加固。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344642", "t": 2, "q": "操作系统安全中，\"访问控制机制\"的实现方式包括以下哪些？（　）", "a": ["角色-Based访问控制（RBAC），基于角色关联权限与用户", "自主访问控制（DAC），基于用户自主决定权限分配", "属性-Based访问控制（ABAC），基于主体、客体属性及环境条件判断权限", "强制访问控制（MAC），基于系统预设规则强制分配权限", "", ""], "r": "ABCD", "e": "访问控制机制有多种实现方式，ABCD四个选项分别介绍了不同类型的访问控制，都是常见的实现方式。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344643", "t": 2, "q": "操作系统安全中，“进程安全”的保护措施包括以下哪些？（　）", "a": ["启用地址空间布局随机化（ASLR），防止缓冲区溢出利用", "启用数据执行保护（DEP），禁止在数据区域执行代码", "对关键进程进行签名验证，防止被篡改或替换", "配置进程权限隔离，限制进程可访问的系统资源", "", ""], "r": "ABCD", "e": "ABCD选项均是进程安全的有效保护措施。ASLR可增加缓冲区溢出攻击难度，DEP能避免数据区执行恶意代码，签名验证保障关键进程完整性，权限隔离限制进程资源访问降低风险。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344644", "t": 2, "q": "操作系统安全中，“进程安全”的防护措施包括以下哪些？（　）", "a": ["定期查杀进程中的恶意代码，防止进程被劫持", "采用地址空间随机化（ASLR），防止攻击者预测内存地址", "强制进程使用高权限运行，确保进程有足够资源完成任务", "开启数据执行保护（DEP），禁止在数据区域执行代码", "", ""], "r": "ABD", "e": "A查杀恶意代码防劫持、B地址空间随机化防预测内存地址、D开启数据执行保护禁止数据区执行代码，都是进程安全防护措施；而C强制高权限运行可能导致权限滥用带来安全风险，不是防护措施。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344645", "t": 2, "q": "操作系统安全中，“日志管理”的关键要求包括以下哪些？（　）", "a": ["确保日志的保密性，敏感日志需加密存储", "确保日志的实时性，及时记录系统操作与事件", "确保日志的可用性，日志格式便于查询与分析", "确保日志的冗余性，同一日志在多个位置备份", "", ""], "r": "ABCD", "e": "日志管理要保障日志的保密性、实时性、可用性和冗余性，ABCD四个选项分别对应了这些关键要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344646", "t": 2, "q": "操作系统安全中，“身份认证”的强化措施包括以下哪些？（　）", "a": ["设置密码复杂度要求（如长度、字符类型），防止暴力破解", "使用单点登录（SSO），实现一次认证多系统访问", "采用多因素认证（MFA），结合密码、令牌、生物特征等", "开启账户锁定机制，多次密码错误后锁定账户", "", ""], "r": "ACD", "e": "答案：ACD身份认证的强化措施主要关注如何更有效地验证用户身份以及防止未经授权的访问。A项通过设置密码复杂度要求可以增加密码被猜测或破解的难度；C项多因素认证结合了多种验证方式，提高了身份认证的安全性；D项账户锁定机制可以在多次尝试失败后阻止进一步的非法访问尝试。而B项单点登录（SSO）虽然可以提高用户体验和管理效率，但它本身并不直接强化身份认证的安全性，因为它只是提供了一种方便的登录方式，而不是增加额外的安全措施。", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344647", "t": 2, "q": "操作系统安全中，“文件系统安全”的防护措施包括以下哪些？（　）", "a": ["对敏感文件进行加密存储，防止文件被未授权访问", "设置文件的访问权限（如Linux的rwx权限），限制用户操作", "定期备份文件系统数据，防止数据丢失或损坏", "开启文件系统日志，记录文件的创建、修改、删除操作", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344648", "t": 2, "q": "操作系统安全中，“系统加固”的关键操作包括以下哪些？（　）", "a": ["对系统磁盘进行分区，分离系统分区与数据分区", "关闭不必要的系统服务与端口", "安装最新的系统安全补丁与更新", "删除默认账号与弱密码，启用强密码策略", "", ""], "r": "BCD", "e": "系统加固旨在增强操作系统安全性。B关闭不必要服务与端口可减少攻击面；C安装安全补丁能修复系统漏洞；D使用强密码策略可防止因弱密码被破解。而A对磁盘分区主要是存储管理，并非系统加固关键操作。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344649", "t": 2, "q": "根据《软件工程软件测试文档》（GB/T 9386），软件测试文档中需包含\"安全测试\"相关内容的文档包括以下哪些？（　）", "a": ["测试用例，描述安全漏洞的测试步骤与预期结果", "测试计划，明确安全测试的范围、资源与进度", "测试报告，记录安全测试的结果、发现的漏洞及修复情况", "开发计划，明确开发过程中的安全编码要求", "", ""], "r": "ABC", "e": "测试用例要描述安全测试步骤和预期结果；测试计划需明确安全测试范围等；测试报告要记录安全测试结果等。而开发计划主要针对开发，与测试文档无关。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344650", "t": 2, "q": "根据《软件工程软件生存周期过程》（GB/T 8566），软件生存周期中涉及\"安全活动\"的过程包括以下哪些？（　）", "a": ["可行性研究与计划过程", "实现过程", "运行与维护过程", "需求分析过程", "", ""], "r": "ABCD", "e": "在软件生存周期各过程中，可行性研究与计划、需求分析、实现、运行与维护等阶段均需考虑安全活动。所以ABCD选项都涉及“安全活动”。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344651", "t": 2, "q": "根据《信息安全技术信息系统安全等级保护基本要求》（GB/T 22239），\"二级等保\"与\"三级等保\"在\"物理环境安全\"方面的差异要求包括以下哪些？（　）", "a": ["三级要求设置门禁系统，二级无强制要求", "三级要求配备视频监控，二级无强制要求", "三级要求配备消防系统，二级无强制要求", "三级要求监控记录保存至少90天，二级要求至少30天", "", ""], "r": "ABD", "e": "在“物理环境安全”方面，三级等保要求更严格，设置门禁系统、配备视频监控等比二级有更明确强制要求，且监控记录保存时间三级要求至少90天，二级至少30天。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344652", "t": 2, "q": "根据《信息技术安全技术网络安全等级保护基本要求》（GB/T 22239），四级信息系统相比三级的额外安全要求包括以下哪些？（　）", "a": ["需定期开展渗透测试，频率不少于每半年一次", "需配备专职安全管理团队，且团队人数不少于10人", "需采用冗余技术，实现关键设备的热备或集群", "需实现异地灾难备份，确保核心业务不中断", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344653", "t": 2, "q": "根据《信息系统安全等级保护基本要求》（GB/T 22239），三级信息系统\"网络安全\"层面的要求包括以下哪些？（　）", "a": ["应实现网络带宽的动态分配，确保关键业务的带宽需求", "应部署入侵检测/防御系统（IDS/IPS），监控网络攻击行为", "应划分不同的网络区域，实现区域间的访问控制", "应定期对网络设备进行安全配置检查，及时修复配置漏洞", "", ""], "r": "BCD", "e": "答案：BCD三级信息系统在网络安全层面，主要强调的是网络的安全防护和监控能力。选项B“应部署入侵检测/防御系统（IDS/IPS），监控网络攻击行为”是网络安全防护的常见手段；选项C“应划分不同的网络区域，实现区域间的访问控制”是网络隔离和安全域划分的基本要求，有助于限制安全事件的扩散；选项D“应定期对网络设备进行安全配置检查，及时修复配置漏洞”是确保网络设备安全性的重要措施。而选项A关于网络带宽的动态分配，更多的是与业务连续性和性能相关，并不直接属于网络安全层面的要求。", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344654", "t": 2, "q": "根据《信息系统安全集成服务资质等级评定条件》，安全集成服务资质申请需满足的基本条件包括以下哪些？（　）", "a": ["企业拥有一定数量的信息安全专业技术人员与项目经理", "企业建立了完善的信息安全管理体系与质量保证体系", "企业近三年内无重大违法违规记录或安全事故", "企业具有独立法人资格，经营范围包含信息安全相关业务", "", ""], "r": "ABCD", "e": "安全集成服务资质申请，企业需有独立法人资格且经营范围含信息安全业务，有一定数量专业人员与项目经理，建立完善管理和质量保证体系，近三年无重大违法违规及安全事故，ABCD选项均是基本条件。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344655", "t": 2, "q": "根据《信息系统工程监理规范》（GB/T 19668），监理单位在\"验收阶段\"的主要工作包括以下哪些？（　）", "a": ["组织开展验收测试，验证系统是否满足需求", "协助建设单位制定验收方案与验收标准", "监督验收过程的合规性，确保验收结果真实有效", "代替建设单位签署验收报告，确认项目验收通过", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344656", "t": 2, "q": "软件安全测试中，“渗透测试”的主要特点包括以下哪些？（　）", "a": ["不仅检测漏洞，还验证漏洞的可利用性及危害程度", "测试过程中可能对系统造成一定的风险（如数据篡改、服务中断）", "以攻击者视角，模拟真实攻击场景进行测试", "主要针对软件的功能正确性进行验证，兼顾安全漏洞检测", "", ""], "r": "ABC", "e": "渗透测试是模拟攻击者，以真实攻击场景测试系统，不仅找漏洞，还验证其可利用性和危害程度，不过测试中可能给系统带来风险。而主要针对软件功能正确性验证兼顾安全漏洞检测的不是渗透测试特点。所以ABC正确。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344657", "t": 2, "q": "软件安全中，\"安全编码规范\"的核心作用包括以下哪些？（　）", "a": ["统一代码安全标准，便于团队协作与代码审查", "为安全测试提供依据，明确漏洞检测的重点", "指导开发人员编写符合安全要求的代码，减少漏洞", "自动修复代码中的安全漏洞，无需人工干预", "", ""], "r": "ABC", "e": "安全编码规范可统一标准利于团队协作与审查，能为安全测试提供依据，还能指导开发人员编写安全代码减少漏洞，但不能自动修复代码漏洞。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344658", "t": 2, "q": "软件安全中，“安全需求”的核心内容包括以下哪些？（　）", "a": ["数据安全需求，如数据加密、脱敏、备份恢复要求", "接口安全需求，如API调用的认证、加密、输入校验要求", "访问控制需求，如用户认证、权限分配、会话管理要求", "性能需求，如软件的响应时间、并发处理能力要求", "", ""], "r": "ABC", "e": "软件安全需求主要围绕数据、接口、访问控制等安全相关方面，性能需求是关于软件性能表现，并非安全需求核心内容。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344659", "t": 2, "q": "软件安全中，\"恶意代码分析\"的常用技术包括以下哪些？（　）", "a": ["静态分析，通过反汇编、反编译分析恶意代码结构与功能", "动态分析，在沙箱环境中运行恶意代码，观察其行为", "内存取证，提取恶意代码运行时的内存数据，分析其活动", "代码混淆，对恶意代码进行混淆处理，防止被分析", "", ""], "r": "ABC", "e": "ABC选项都是恶意代码分析的常用技术。静态分析从代码结构功能入手，动态分析观察运行行为，内存取证分析运行时活动。而代码混淆是攻击者用来对抗分析的手段，不是分析技术。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344660", "t": 2, "q": "软件安全中，“漏洞管理”的核心流程包括以下哪些环节？（　）", "a": ["漏洞发现，通过扫描、测试等方式识别软件漏洞", "漏洞修复，开发补丁或采取临时措施消除漏洞", "补丁管理，包括补丁测试、分发与部署", "漏洞隐瞒，对发现的漏洞不公开，避免被攻击者利用", "", ""], "r": "ABC", "e": "漏洞管理核心流程是发现、修复和管理补丁，而隐瞒漏洞不利于软件安全，还可能造成更严重后果。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344661", "t": 2, "q": "软件安全中，“漏洞管理”的完整流程包括以下哪些环节？（　）", "a": ["漏洞评估（如CVSS评分、影响范围分析）", "漏洞发现（如扫描、渗透测试）", "漏洞修复（如开发补丁、配置调整）", "漏洞披露（如向厂商报告、公开披露）", "", ""], "r": "ABCD", "e": "漏洞管理完整流程包含发现漏洞、对其评估、修复漏洞以及必要时进行披露。ABCD选项分别对应了这几个关键环节。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344662", "t": 2, "q": "软件安全中，下列哪些属于\"软件安全需求\"的范畴？（　）", "a": ["软件应支持多用户同时在线使用", "软件应提供日志审计功能，记录关键操作", "软件应能抵御SQL注入、XSS等常见攻击", "软件应加密存储用户敏感数据（如密码）", "", ""], "r": "BCD", "e": "软件安全需求侧重于保障软件系统及其数据安全。A选项多用户同时在线使用是软件的功能性需求；B、C、D选项都与保障软件安全、数据安全相关。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813894207344663", "t": 2, "q": "软件安全中，下列哪些属于\"软件供应链安全\"的威胁？（　）", "a": ["软件编译环境被植入恶意代码", "软件用户密码被暴力破解", "软件分发渠道（如应用商店）提供篡改后的安装包", "软件运行时遭遇DDoS攻击", "", ""], "r": "AC", "e": "软件供应链安全关注软件从开发到交付全流程的安全。A选项编译环境植入恶意代码、C选项分发渠道提供篡改安装包，都在软件供应链环节引入威胁。B是用户密码安全问题，D是软件运行时遭受攻击，不属于供应链安全威胁。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826432", "t": 3, "q": "《信息安全技术网络安全等级保护基本要求》（GB/T 22239）中，“应用安全”的要求仅适用于Web应用，不适用于移动应用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "《信息安全技术网络安全等级保护基本要求》（GB/T 22239）里“应用安全”要求既适用于Web应用，也适用于移动应用等各类应用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826433", "t": 3, "q": "《信息技术安全技术信息安全管理体系要求》（ISO/IEC 27001）仅适用于企业，不适用于政府机构或事业单位。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "ISO/IEC 27001适用于各种类型和规模的组织，包括企业、政府机构、事业单位等。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826434", "t": 3, "q": "《信息技术软件产品评价质量特性及其使用指南》（GB/T 16260）中，\"功能性\"质量特性包含\"安全保密性\"子特性，用于评价软件的安全功能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GB/T 16260中“功能性”质量特性确实包含“安全保密性”子特性，此子特性可用于评价软件安全功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826435", "t": 3, "q": "《信息系统工程监理规范》（GB/T 19668）要求监理单位在信息系统工程建设过程中，对工程质量、进度、成本进行全面控制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "《信息系统工程监理规范》明确规定监理单位要对信息系统工程建设的质量、进度、成本进行全面把控。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826436", "t": 3, "q": "操作系统安全中，\"安全审计日志\"可以随意删除或修改，只要确保不影响系统运行即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "安全审计日志记录系统活动等重要信息，用于追踪和调查安全事件等，不能随意删除或修改，否则会影响对系统安全状况的评估和追溯。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826437", "t": 3, "q": "操作系统安全中，\"安全增强型Linux（SELinux）\"默认处于\"强制模式\"，会严格限制所有进程的访问行为。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826438", "t": 3, "q": "操作系统安全中，\"单点登录（SSO）\"技术会增加系统的安全风险，因为一旦SSO账户被破解，攻击者可访问所有关联系统。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826439", "t": 3, "q": "操作系统安全中，\"地址空间布局随机化（ASLR）\"可完全防止缓冲区溢出攻击。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "地址空间布局随机化（ASLR）通过随机化程序加载地址等方式增加攻击者预测地址的难度，降低缓冲区溢出攻击成功概率，但不能完全防止，仍有绕过手段。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826440", "t": 3, "q": "操作系统安全中，\"地址空间随机化（ASLR）\"技术能够完全阻止缓冲区溢出攻击的发生。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "地址空间随机化（ASLR）通过随机化进程的内存地址布局，增加攻击者预测地址的难度，但它不能完全阻止缓冲区溢出攻击，只是降低了成功概率。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826441", "t": 3, "q": "操作系统安全中，\"多因素认证（MFA）\"使用的两个认证因子必须是\"密码+生物特征\"，不能是\"密码+短信验证码\"。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多因素认证（MFA）包含多种组合，“密码 + 短信验证码”也是常见的多因素认证方式，并非只能是“密码 + 生物特征”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826442", "t": 3, "q": "操作系统安全中，恶意程序通过\"挂钩（Hook）技术拦截系统API调用，可实现监控用户操作、窃取敏感数据等恶意行为。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "挂钩（Hook）技术能让恶意程序拦截系统 API 调用，借此可监控用户操作、窃取敏感数据等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826443", "t": 3, "q": "操作系统安全中，\"恶意代码\"仅包括病毒、蠕虫、木马等可自我复制的程序，不包括间谍软件、广告软件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“恶意代码”不仅包括病毒、蠕虫、木马等可自我复制的程序，也包含间谍软件、广告软件等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826444", "t": 3, "q": "操作系统安全中，\"进程隔离\"机制确保不同进程的内存空间相互独立，一个进程的崩溃不会影响其他进程的正常运行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "进程隔离是操作系统安全的重要机制，它通过将不同进程的内存空间隔离开，使得一个进程无法随意访问其他进程的内存，这样当一个进程崩溃时，其影响局限于自身，不会波及其他进程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826445", "t": 3, "q": "操作系统安全中，\"进程隔离\"技术可以确保进程之间无法进行任何数据交互，完全独立运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“进程隔离”虽增强了进程独立性和安全性，但不是让进程之间无法进行任何数据交互，它们仍可通过管道、消息队列、共享内存等方式交互。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826446", "t": 3, "q": "操作系统安全中，“内核态”进程拥有最高权限，可直接访问硬件资源;“用户态”进程权限受限，需通过系统调用获取内核态支持才能访问硬件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在操作系统安全机制里，内核态权限最高，能直接操作硬件资源；用户态权限低，要借助系统调用请求内核态协助来访问硬件。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826447", "t": 3, "q": "操作系统安全中，\"日志审计\"的日志数据需定期删除，避免占用过多磁盘空间，即使日志未经过安全分析。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "日志未经过安全分析就删除，可能会使重要安全信息丢失，不利于后续安全问题追溯和分析，所以该做法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826448", "t": 3, "q": "操作系统安全中，\"数据执行保护（DEP）\"技术通过限制内存中代码的执行位置，防止在数据区域执行恶意代码。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据执行保护（DEP）确实是通过限制内存中代码的执行位置，将数据区域标记为不可执行，以此来防止恶意代码在数据区域执行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826449", "t": 3, "q": "操作系统安全中，\"文件权限\"设置仅能限制用户对文件的读写执行操作，无法防止文件被删除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "文件权限设置可控制用户对文件的多种操作，包括防止文件被删除。若没有相应权限，用户无法删除文件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826450", "t": 3, "q": "操作系统安全中，\"文件系统权限\"设置为\"只读\"的文件，任何用户（包括管理员）都无法修改该文件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "管理员通常拥有特殊权限，即便文件系统权限设为“只读”，管理员也可修改。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826451", "t": 3, "q": "操作系统安全中，\"虚拟化安全\"的\"虚拟机隔离\"是指不同虚拟机之间无法通信，完全独立运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虚拟机隔离并非意味着不同虚拟机之间完全无法通信，它们可在一定规则和机制下进行通信。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826452", "t": 3, "q": "操作系统安全中，\"用户密码\"设置为\"123456\"属于弱密码，即使定期更换，仍存在安全风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“123456”是常见简单组合，易被破解，即便定期更换，因其本身易猜，仍有安全隐患。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826453", "t": 3, "q": "操作系统安全中，\"用户账户控制（UAC）\"功能仅存在于Windows系统，Linux系统没有类似的权限控制机制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "Linux系统也有类似权限控制机制，如sudo命令可让普通用户以root权限执行特定命令。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826454", "t": 3, "q": "操作系统安全中，“最小权限原则”要求普通用户仅拥有完成其工作必需的权限，不得拥有任何额外权限。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“最小权限原则”核心就是让用户或进程仅具备完成工作所必需的最少权限，避免额外权限带来的安全风险。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826455", "t": 3, "q": "操作系统安全中，“最小权限原则”要求普通用户在执行所有操作时，均需使用管理员权限登录系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“最小权限原则”是指用户仅被授予完成工作所需的最少权限，而不是执行所有操作都用管理员权限登录，管理员权限过大，会增加系统安全风险。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826456", "t": 3, "q": "操作系统安全中，\"Linux系统的'chmod 777'命令将文件权限设置为所有用户均可读写执行，这种设置符合最小权限原则。\"", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "最小权限原则要求用户仅拥有完成工作所需的最少权限。“chmod 777”将文件权限设为所有用户均可读写执行，给予了过高权限，不符合最小权限原则。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826457", "t": 3, "q": "操作系统安全中，\"Windows系统的'注册表'存储了系统和应用的配置信息，修改注册表中的启动项不会对系统安全产生影响。\"", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "修改注册表中的启动项可能会引入恶意程序自启动，破坏系统原有配置，影响系统稳定性和安全性，该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826458", "t": 3, "q": "操作系统安全中，Linux系统的\"/etc/passwd\"文件存储了用户的加密密码，普通用户无法读取该文件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "/etc/passwd文件中原来存储加密密码，但后来为安全考虑，密码移到了 /etc/shadow 文件，且普通用户可读取 /etc/passwd 文件。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826459", "t": 3, "q": "操作系统安全中，Windows系统的\"用户账户控制（UAC）\"本质上是一种强制访问控制（MAC）机制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "用户账户控制（UAC）是一种基于用户权限的访问控制，属于自主访问控制（DAC），并非强制访问控制（MAC）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826460", "t": 3, "q": "根据《软件工程软件测试文档》（GB/T 9386），安全测试用例无需包含预期结果，仅描述测试步骤即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "依据《软件工程软件测试文档》（GB/T 9386），测试用例通常都要包含预期结果，安全测试用例也不例外，不能仅描述测试步骤。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826461", "t": 3, "q": "根据《软件工程软件生存周期过程》（GB/T 8566），软件维护阶段无需开展安全活动，仅需修复功能缺陷即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "依据《软件工程软件生存周期过程》（GB/T 8566），软件维护阶段不仅要修复功能缺陷，也必须开展安全活动，来保障软件系统的安全性。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826462", "t": 3, "q": "根据《信息安全技术信息安全风险管理指南》，信息安全风险处理的\"转移\"方式是指将风险导致的损失转移给第三方（如购买安全保险）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "《信息安全技术信息安全风险管理指南》中，风险处理的“转移”确实是把风险导致的损失转由第三方承担，像购买安全保险就是常见方式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826463", "t": 3, "q": "根据《信息技术安全技术信息安全管理体系要求》（GB/T 22080），信息安全管理体系无需定期审核，仅在发生安全事件后审核即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "GB/T 22080要求信息安全管理体系要定期进行审核，以确保其持续有效性、充分性和适宜性，并非仅在发生安全事件后审核。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826464", "t": 3, "q": "根据《信息技术软件产品评价质量特性及其使用指南》（GB/T 16260），软件的\"安全性\"质量特性属于可靠性的子特性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在《信息技术软件产品评价质量特性及其使用指南》（GB/T 16260）中，“安全性”是独立的质量特性，并非可靠性的子特性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826465", "t": 3, "q": "根据《信息系统安全等级保护定级指南》，信息系统的定级结果一旦确定，终身不可变更。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信息系统的环境、功能等会随时间变化，若变化到一定程度，定级结果需重新评估和变更，并非终身不可变。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826466", "t": 3, "q": "根据《信息系统安全等级保护基本要求》，二级信息系统无需开展安全审计工作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。《信息系统安全等级保护基本要求》中，二级信息系统也需要开展安全审计工作，要对重要用户行为、系统资源的异常使用和重要系统命令的使用等进行审计。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826467", "t": 3, "q": "根据《信息系统安全等级保护基本要求》，三级等保系统的安全日志需保存至少180天。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据《信息系统安全等级保护基本要求》，三级等保系统安全日志保存时间要求是不少于180天。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826468", "t": 3, "q": "根据《信息系统安全等级保护基本要求》，三级信息系统的\"灾难备份\"无需实现异地备份，仅本地备份即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "三级信息系统重要性较高，为保障数据安全和系统可用性，需进行异地备份，仅本地备份无法应对重大灾难等情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826469", "t": 3, "q": "根据《信息系统安全等级保护基本要求》，所有信息系统均需达到三级及以上等保等级。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信息系统根据其重要程度和受破坏后的影响等因素分为不同等级进行保护，并非都要达到三级及以上。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826470", "t": 3, "q": "根据《信息系统安全集成服务资质等级评定条件》，二级安全集成资质企业可以承接所有规模的信息系统安全集成项目。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不同等级的安全集成资质企业承接项目规模有限制，二级资质并非能承接所有规模项目。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826471", "t": 3, "q": "根据《信息系统工程监理暂行规定》，信息系统工程监理单位可以同时承担同一项目的系统集成服务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "《信息系统工程监理暂行规定》明确禁止监理单位同时承担同一项目的系统集成服务，避免利益冲突。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826472", "t": 3, "q": "软件安全开发生命周期（SDL）中，\"安全测试\"仅需在软件编码完成后开展即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件安全开发生命周期（SDL）是贯穿软件整个生命周期的，“安全测试”并非仅在编码完成后开展，在需求分析、设计等阶段也需进行相关安全测试工作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826473", "t": 3, "q": "软件安全开发生命周期（SDL）中，\"安全需求\"只需在项目立项阶段确定，后续开发阶段无需调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "安全需求在项目立项阶段确定，但随着项目推进，如业务变化、技术发展、新安全威胁出现等，后续开发阶段也需对安全需求进行调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826474", "t": 3, "q": "软件安全开发生命周期（SDL）中，安全测试仅需在软件编码完成后进行，需求和设计阶段无需考虑安全测试相关工作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件安全开发生命周期（SDL）强调安全应贯穿软件开发整个过程，需求和设计阶段就需考虑安全测试相关工作，不能只在编码完成后进行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826475", "t": 3, "q": "软件安全中，“安全编码规范”仅适用于开发人员，测试人员无需了解编码规范。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "测试人员了解安全编码规范有助于更好地理解软件代码逻辑和潜在风险，能更精准地设计测试用例，提高测试效率和质量，所以并非无需了解。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826476", "t": 3, "q": "软件安全中，\"第三方开源组件的漏洞与软件自身无关，软件厂商无需对开源组件的漏洞负责。\"", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然是第三方开源组件，但软件厂商在使用时，有责任确保所使用的组件安全，若因开源组件漏洞导致软件出现安全问题，软件厂商也需承担一定责任。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826477", "t": 3, "q": "软件安全中，\"动态应用安全测试（DAST）\"需在软件部署运行后开展，无法在编码阶段进行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "动态应用安全测试是在软件运行状态下检测安全漏洞，编码阶段软件未运行，所以只能在部署运行后开展。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826478", "t": 3, "q": "软件安全中，\"动态应用安全测试（DAST）\"在测试过程中不需要了解软件的内部结构或源代码。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "动态应用安全测试（DAST）是在软件运行时进行测试，模拟攻击来发现安全漏洞，无需了解软件内部结构和源代码。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826479", "t": 3, "q": "软件安全中，\"动态应用安全测试（DAST）\"在测试过程中可能会对软件造成数据污染或功能损坏，因此不适用于生产环境中的软件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DAST在测试时会模拟攻击行为，可能影响软件正常运行，对数据和功能产生不良影响，生产环境需稳定运行，所以它不适用于生产环境软件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826480", "t": 3, "q": "软件安全中，\"静态应用安全测试（SAST）\"可检测出软件中所有类型的安全漏洞。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "SAST虽能检测多种安全漏洞，但因软件复杂性和漏洞多样性，无法检测出所有类型安全漏洞。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826481", "t": 3, "q": "软件安全中，\"静态应用安全测试（SAST）\"能够检测出软件运行时才会触发的内存泄漏漏洞。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静态应用安全测试（SAST）是在不运行软件的情况下进行代码分析，而内存泄漏漏洞在软件运行时才会触发，所以SAST无法检测此类漏洞。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826482", "t": 3, "q": "软件安全中，\"静态应用安全测试（SAST）\"能检测出软件运行时才会出现的漏洞（如内存泄漏）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静态应用安全测试（SAST）是在不运行程序的情况下对代码进行分析，而内存泄漏这类需软件运行时才出现的漏洞，SAST 无法检测。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826483", "t": 3, "q": "软件安全中，\"开源软件\"的代码公开透明，因此其安全性一定优于闭源软件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开源软件代码虽公开透明利于发现问题，但安全性受多种因素影响，闭源软件也可通过专业防护措施保障安全，所以不能说开源软件安全性一定优于闭源软件。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826484", "t": 3, "q": "软件安全中，\"开源软件的代码公开，因此开源软件的安全性一定优于闭源软件。\"", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "开源软件代码虽公开便于发现漏洞，但也易被恶意利用；闭源软件代码不公开，也有专业团队保障安全。所以不能说开源软件安全性一定优于闭源软件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826485", "t": 3, "q": "软件安全中，\"漏洞赏金计划\"通常仅面向企业内部安全团队，不对外开放。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“漏洞赏金计划”不仅面向企业内部安全团队，也对外开放，鼓励外部安全研究人员发现并报告漏洞。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826486", "t": 3, "q": "软件安全中，“漏洞赏金计划”通常由软件厂商发起，鼓励安全研究人员发现漏洞并报告，而非公开披露漏洞。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“漏洞赏金计划”确实是软件厂商为提升软件安全性发起的，目的是激励安全研究人员找出漏洞并向厂商报告，避免其公开披露带来安全风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826487", "t": 3, "q": "软件安全中，“模糊测试”仅适用于检测软件的输入验证漏洞，无法检测逻辑漏洞。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "模糊测试不仅能检测软件输入验证漏洞，也可通过生成大量异常输入，在一定程度上发现逻辑漏洞。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826488", "t": 3, "q": "软件安全中，“软件供应链安全”仅需关注直接使用的第三方组件，无需关注组件的依赖组件（如二级依赖）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件供应链安全不仅要关注直接使用的第三方组件，其依赖组件（如二级依赖）也可能存在安全风险，所以这种说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826489", "t": 3, "q": "软件安全中，\"软件加密狗\"作为硬件加密设备，可有效防止软件被非法复制和使用，属于软件安全防护的物理层措施。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "加密狗通过硬件形式对软件进行加密，防止软件非法复制使用，是基于物理设备实现的安全防护，属于物理层措施。", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826490", "t": 3, "q": "软件安全中，“软件漏洞”仅存在于代码中，设计阶段不会产生漏洞。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件漏洞不仅会在代码编写时产生，在设计阶段也可能因设计不合理等产生漏洞。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813897239826491", "t": 3, "q": "软件安全中，\"软件漏洞赏金计划\"通过奖励外部安全研究者提交漏洞，可有效降低软件发布后未修复漏洞的数量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件漏洞赏金计划能激励外部安全研究者积极寻找并提交软件漏洞，让开发者及时修复，从而降低软件发布后未修复漏洞数量。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第8章 信息工程（2）", "n": "基础练习题【含解析】 / 第8章 信息工程（2）", "qs": [{"id": "2034813905787817984", "t": 1, "q": "数据库安全中，\"角色-Based访问控制（RBAC）\"的核心思想是？", "a": ["通过定义角色，将权限分配给角色，再将角色分配给用户", "基于用户的IP地址分配访问权限", "直接为每个用户分配具体的数据操作权限", "基于用户的操作时间分配访问权限", "", ""], "r": "A", "e": "RBAC核心就是先定义角色，把权限赋予角色，再把角色分配给用户。B按IP、D按操作时间分配权限不是RBAC思想；C直接给用户分配权限也不符合其核心做法。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817985", "t": 1, "q": "数据库安全中，\"禁止数据库管理员（DBA）同时拥有数据查询和审计权限，避免DBA篡改数据后删除审计记录\"，这一措施体现了信息安全的哪种原则？", "a": ["纵深防御原则", "最小权限原则", "分权制衡原则", "风险评估原则", "", ""], "r": "C", "e": "该措施将数据查询和审计权限分开，使DBA不能同时掌控两者，防止权力集中造成不良后果，体现了分权制衡原则。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817986", "t": 1, "q": "数据库安全中，\"审计日志\"应至少记录以下哪项关键信息？", "a": ["操作人的终端设备型号、浏览器版本", "数据库存储容量、剩余空间、IO性能", "数据库版本、操作系统版本、硬件配置", "操作时间、操作人、操作IP、操作类型、操作结果", "", ""], "r": "D", "e": "审计日志主要是为了记录数据库操作情况以进行安全审查和追溯。选项D包含的操作时间、操作人、操作IP、操作类型、操作结果能全面反映操作关键信息，便于追踪和分析操作行为。而A中终端设备型号和浏览器版本并非关键；B是数据库存储和性能相关，不是操作关键信息；C是数据库和系统的配置信息，与操作本身关联不大。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817987", "t": 1, "q": "数据库安全中，\"使用'数据库审计工具'记录所有对数据库的访问操作（如查询、修改、删除），以便事后追溯\"，这一措施主要用于保障数据库的哪种安全属性？", "a": ["完整性", "保密性", "可审计性", "可用性", "", ""], "r": "C", "e": "使用数据库审计工具记录访问操作目的是为事后追溯提供依据，这符合可审计性的要求。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817988", "t": 1, "q": "数据库安全中，\"使用数据库加密技术时，对'数据库连接密码'进行加密存储，而非明文存储\"，这一措施主要保护的是数据库的哪个环节安全？", "a": ["身份认证安全", "数据存储安全", "数据访问安全", "数据传输安全", "", ""], "r": "A", "e": "数据库连接密码用于身份认证，加密存储连接密码能防止密码泄露，保障身份认证环节安全。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817989", "t": 1, "q": "数据库安全中，\"透明数据加密（TDE）\"的主要作用是？", "a": ["加密数据库连接传输的数据", "加密数据库用户的登录密码", "加密数据库磁盘文件中的数据，防止磁盘被盗导致数据泄露", "加密数据库中特定字段的数据（如身份证号）", "", ""], "r": "C", "e": "透明数据加密（TDE）主要是对数据库磁盘文件里的数据进行加密，这样即便磁盘被盗，数据也不会轻易泄露。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817990", "t": 1, "q": "数据库安全中，\"限制普通用户只能查询数据库视图，无法直接访问基础表，以隐藏表结构和敏感字段\"的措施依赖于数据库的哪种功能？", "a": ["存储过程", "触发器", "索引", "视图机制", "", ""], "r": "D", "e": "视图机制可将部分数据和结构封装成视图供用户查询，限制用户直接访问基础表，隐藏表结构和敏感字段。答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817991", "t": 1, "q": "数据库安全中，\"自主访问控制（DAC）\"的主要缺陷是？", "a": ["仅能基于角色分配权限，灵活性不足", "无法防止权限的间接传递（如用户将权限授予其他用户）", "权限管理过于复杂，不适合大规模数据库", "无法针对不同数据对象设置不同权限", "", ""], "r": "B", "e": "自主访问控制允许用户自主地将自己拥有的权限授予其他用户，这就可能导致权限的间接传递，存在安全隐患。A选项DAC不只是基于角色分配权限；C选项不是其主要缺陷；D选项DAC可针对不同数据对象设不同权限。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817992", "t": 1, "q": "数据库安全中，下列哪种机制可有效防止\"攻击者通过提交特殊SQL语句，绕开应用程序验证直接操作数据库\"的攻击？", "a": ["SQL注入防护（如参数化查询）", "数据库备份", "角色权限分配", "数据加密存储", "", ""], "r": "A", "e": "SQL注入攻击是攻击者提交特殊SQL语句绕开应用验证操作数据库，SQL注入防护（如参数化查询）能阻止这种攻击。数据库备份主要用于数据恢复；角色权限分配是控制用户对数据库操作权限；数据加密存储是保护数据内容不被非法获取，它们都不能直接防止SQL注入攻击。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817993", "t": 1, "q": "信息内容安全面临的\"通过伪造发件人地址、篡改邮件内容传播虚假信息\"的威胁，其主要破坏了信息的哪项属性？", "a": ["可用性", "不可否认性", "保密性", "完整性", "", ""], "r": "D", "e": "篡改邮件内容破坏了信息原本的完整状态，而信息完整性强调信息在存储或传输过程中不被篡改。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817994", "t": 1, "q": "信息内容安全中，“'信息茧房'现象导致用户仅接触到同质化信息，可能引发极端观点传播”，这种风险属于信息内容安全的哪个维度？", "a": ["信息泄露风险", "服务可用性风险", "信息质量风险", "内容合规风险", "", ""], "r": "C", "e": "“信息茧房”使信息同质化，影响了信息的多样性与质量，属于信息质量风险。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817995", "t": 1, "q": "信息内容安全中，\"对传播的信息添加唯一标识（如数字水印），在信息泄露后可追溯泄露源头\"的技术属于？", "a": ["数据脱敏技术", "加密技术", "访问控制技术", "信息隐藏技术", "", ""], "r": "D", "e": "信息隐藏技术可将信息添加唯一标识（如数字水印）隐藏于载体中，信息泄露后能追溯源头。数据脱敏是对敏感数据处理；加密是对信息加密保护；访问控制是限制访问。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817996", "t": 1, "q": "信息内容安全中，\"对特定关键词、语义或敏感图像进行识别并拦截违规内容\"的技术属于以下哪类防护手段？", "a": ["访问控制技术", "内容过滤技术", "数字水印技术", "数据脱敏技术", "", ""], "r": "B", "e": "内容过滤技术可对特定关键词、语义或敏感图像识别并拦截违规内容。访问控制是限制对资源的访问；数字水印用于版权保护等；数据脱敏是对敏感数据处理。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817997", "t": 1, "q": "信息内容安全中，\"对用户上传的文件进行'沙箱检测'，在隔离环境中运行文件观察是否有恶意行为\"，这种检测方式主要用于防范哪种威胁？", "a": ["文件大小超标", "文件版权侵权", "文件格式错误", "文件中的恶意代码（如病毒、木马）", "", ""], "r": "D", "e": "沙箱检测在隔离环境运行文件看有无恶意行为，目的就是检测文件里是否存在病毒、木马等恶意代码。A选项文件大小超标与运行检测恶意行为无关；B选项版权侵权主要靠版权核查而非沙箱检测；C选项文件格式错误也不是沙箱检测要解决的。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817998", "t": 1, "q": "信息内容安全中，\"个人信息匿名化\"的核心要求是？", "a": ["匿名化过程需获得个人同意", "匿名化后的信息需加密存储", "匿名化后的信息仍可用于统计分析", "匿名化后的信息无法与特定个人关联", "", ""], "r": "D", "e": "个人信息匿名化就是让信息无法和特定个人关联起来。A选项获得同意不是核心要求；B选项加密存储不是匿名化核心；C选项能否用于统计分析并非核心。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787817999", "t": 1, "q": "信息内容安全中，\"基于机器学习的不良信息识别\"相比传统方法的优势不包括？", "a": ["对新型、变异不良信息的识别能力更强", "识别速度更快，可处理大规模数据", "完全不需要人工干预，可实现全自动识别", "无需人工定义规则，可自动学习特征", "", ""], "r": "C", "e": "机器学习虽有诸多优势，但目前还不能完全脱离人工干预，在数据标注、模型评估等方面仍需人工参与。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818000", "t": 1, "q": "信息内容安全中，\"基于行为分析的内容安全防护\"与\"基于特征匹配的防护\"相比，主要优势是？", "a": ["防护速度更快，资源占用更低", "可识别未知的、新型的违规内容", "仅适用于文本内容，针对性更强", "误报率更低，无需人工干预", "", ""], "r": "B", "e": "基于特征匹配的防护依赖已知特征库，难以识别未知新型违规内容，而基于行为分析的内容安全防护可通过分析行为模式识别未知、新型违规内容。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818001", "t": 1, "q": "信息内容安全中，“跨境数据流动”的安全管理核心要求是？", "a": ["敏感数据的跨境流动需经过安全评估，确保不泄露", "跨境传输的数据需进行加密，确保传输安全", "所有跨境数据流动必须经过国家网信部门审批", "跨境数据流动需符合目的地国家的个人信息保护法规", "", ""], "r": "A", "e": "敏感数据跨境流动存在安全风险，进行安全评估可有效保障数据不泄露，这是“跨境数据流动”安全管理的核心。加密传输是保障手段之一但非核心；并非所有跨境数据流动都要国家网信部门审批；符合目的地国家法规重要，但保障自身数据安全才是核心。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818002", "t": 1, "q": "信息内容安全中，\"利用人工智能技术分析用户发布内容的情感倾向、传播路径，预测舆情发展趋势\"的技术属于？", "a": ["信息隐藏技术", "数字签名技术", "舆情分析技术", "内容过滤技术", "", ""], "r": "C", "e": "题干强调分析内容情感倾向、传播路径和预测舆情趋势，这正是舆情分析技术的范畴。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818003", "t": 1, "q": "信息内容安全中，\"内容过滤\"技术的主要局限性不包括以下哪一项？", "a": ["无法过滤文本类内容，仅适用于多媒体内容", "难以应对加密传输的内容（如HTTPS加密的网页）", "对动态生成的内容（如JS渲染的页面）过滤效果差", "无法识别语义模糊的违规内容（如隐喻、谐音）", "", ""], "r": "A", "e": "内容过滤技术可对文本类内容进行过滤，A选项说法错误，而B、C、D是内容过滤技术存在的局限性。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818004", "t": 1, "q": "信息内容安全中，\"内容溯源\"技术的核心挑战是？", "a": ["如何在内容传播过程中保持溯源信息不被篡改", "如何对海量内容进行快速溯源", "如何让普通用户也能便捷地使用溯源功能", "如何降低溯源技术的硬件成本", "", ""], "r": "A", "e": "内容溯源需保证溯源信息真实可靠，传播中信息易被篡改，所以保持不被篡改是核心挑战。B、C、D选项虽也是相关问题，但并非核心。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818005", "t": 1, "q": "信息内容安全中，\"内容脱敏技术\"与\"内容加密技术\"的核心区别在于？", "a": ["脱敏技术用于数据传输环节，加密技术用于数据存储环节", "脱敏后的数据可在特定场景正常使用，加密后的数据需解密才能使用", "脱敏技术不改变数据格式，加密技术会改变数据格式", "脱敏技术只能处理文本内容，加密技术可处理所有类型数据", "", ""], "r": "B", "e": "内容脱敏是对敏感信息进行变形处理，处理后的数据能在特定场景正常使用；而内容加密是将数据变为密文，需解密才能恢复使用。A选项，两者在传输和存储环节都可使用；C选项，加密不一定改变数据格式；D选项，脱敏也能处理多种类型数据。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818006", "t": 1, "q": "信息内容安全中，“数字签名”技术在内容安全中的主要作用是？", "a": ["标识内容的创建者，便于版权追溯", "压缩内容，减少传输带宽占用", "对内容进行加密，保护内容机密性", "确保内容不被篡改，验证内容完整性", "", ""], "r": "D", "e": "数字签名基于公钥加密技术和哈希函数，能生成唯一的签名来绑定数据，可验证数据在传输或存储过程中是否被篡改，保证内容完整性。A不是主要作用；B数字签名不用于压缩内容；C数字签名不负责内容加密。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818007", "t": 1, "q": "信息内容安全中，\"数字水印\"技术在内容溯源中的核心作用是？", "a": ["对内容进行加密，保护机密性", "防止内容被篡改", "压缩内容，减少存储占用", "标识内容的版权归属与传播路径", "", ""], "r": "D", "e": "数字水印可将版权等信息嵌入内容，能标识内容版权归属与传播路径用于溯源。A是加密技术作用；B防篡改多靠哈希等；C压缩内容有专门压缩算法。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818008", "t": 1, "q": "信息内容安全中，\"通过'内容降权'（如减少推荐量）限制违规但未达拦截标准的信息传播范围\"，这种措施属于？", "a": ["溯源追责", "柔性管控", "主动拦截", "被动防御", "", ""], "r": "B", "e": "“内容降权”未直接拦截信息，只是限制传播范围，较为温和，属于柔性管控手段。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818009", "t": 1, "q": "信息内容安全中，\"通过自然语言处理（NLP）技术识别文本中的隐含敏感信息（如隐晦的违规表述）\"，这一能力属于内容过滤技术的哪个层次？", "a": ["来源验证层", "语义分析层", "权限控制层", "关键词匹配层", "", ""], "r": "B", "e": "自然语言处理识别隐含敏感信息是对文本语义进行分析，所以属于语义分析层。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818010", "t": 1, "q": "信息内容安全中，\"网络谣言识别\"的核心技术难点不包括以下哪项？", "a": ["谣言与真实信息的模糊边界", "识别模型对不同领域谣言的通用性", "谣言传播路径的实时追踪", "谣言内容的多样性与变异性", "", ""], "r": "C", "e": "网络谣言识别主要聚焦于区分谣言和真实信息、让模型能通用识别不同领域谣言以及应对谣言多样变异。而谣言传播路径实时追踪重点在传播过程，并非识别核心难点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818011", "t": 1, "q": "信息内容安全中，“隐私保护技术”中的“差分隐私”主要用于解决以下哪种问题？", "a": ["防止数据被未授权复制", "防止数据在存储过程中被篡改", "防止数据集中的个体信息被识别", "防止数据在传输过程中被窃听", "", ""], "r": "C", "e": "差分隐私是一种为数据添加噪声以保护个体信息不被识别的技术。答案选C，它主要解决的就是防止数据集中个体信息被识别的问题，而A防止未授权复制、B防止存储篡改、D防止传输窃听并非差分隐私主要解决的问题。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818012", "t": 1, "q": "信息内容安全中，下列哪种威胁会导致\"合法用户无法正常访问或获取所需信息（如网站被DDoS攻击后无法打开）\"？", "a": ["内容违规", "身份伪造", "信息篡改", "拒绝服务攻击", "", ""], "r": "D", "e": "拒绝服务攻击是通过大量请求使系统资源耗尽，导致合法用户无法正常访问或获取信息，符合题目描述；内容违规主要是信息内容不符合规定；身份伪造是假冒身份；信息篡改是对信息进行修改。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818013", "t": 1, "q": "信息内容安全中，针对\"利用AI生成深度伪造（Deepfake）视频传播虚假信息\"的防御，最关键的技术方向是？", "a": ["基于视频文件大小的异常判断", "基于视频帧哈希的比对", "基于生物特征（如面部微表情）的异常检测", "基于关键词的视频字幕过滤", "", ""], "r": "C", "e": "深度伪造视频主要是对人物形象等进行伪造，基于生物特征（如面部微表情）的异常检测能从本质上发现视频中人物的不自然之处，以此判断是否为伪造视频，是防御的关键技术方向。A选项视频文件大小与是否为伪造无直接关联；B选项视频帧哈希比对难以有效识别深度伪造；D选项关键词字幕过滤无法检测视频画面本身的伪造。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818014", "t": 1, "q": "信息内容安全中，针对不良信息的\"基于语义分析的过滤技术\"主要依赖于以下哪种核心能力实现？", "a": ["简单关键词匹配", "IP地址黑名单拦截", "对文本上下文逻辑与情感倾向的理解", "基于文件后缀名的识别", "", ""], "r": "C", "e": "基于语义分析的过滤技术重点在于对语义理解，也就是对文本上下文逻辑与情感倾向理解。而简单关键词匹配、IP地址黑名单拦截、基于文件后缀名识别都不是基于语义层面。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818015", "t": 1, "q": "信息内容安全中的\"数字水印技术\"主要用于解决以下哪种问题？", "a": ["追溯数字内容的版权归属与传播路径", "加密传输中的敏感文本信息", "检测数字内容中的恶意代码", "防止文本内容被篡改", "", ""], "r": "A", "e": "数字水印技术是将一些标识信息（即数字水印）直接嵌入数字载体中，可用来证明版权归属等，能追溯数字内容的版权归属与传播路径。B选项加密敏感文本信息一般用加密算法；C选项检测恶意代码用杀毒软件等工具；D选项防止文本内容被篡改常用数字签名等技术。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818016", "t": 1, "q": "信息系统工程标准规范中，GB/T 22240-2020《信息安全技术网络安全等级保护定级指南》规定，信息系统定级需考虑\"业务信息安全\"和\"系统服务安全\"两个维度，每个维度的等级划分为？", "a": ["1-2级", "1-4级", "1-3级", "1-5级", "", ""], "r": "D", "e": "GB/T 22240 - 2020规定信息系统定级的业务信息安全和系统服务安全两个维度等级划分均为1 - 5级。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818017", "t": 1, "q": "信息系统工程标准规范中，GB/T 25058-2019《信息安全技术信息系统安全等级保护实施指南》的主要作用是？", "a": ["规定信息系统的定级方法", "规范信息系统的测试方法", "定义信息安全事件的分类分级", "指导信息系统等级保护的具体实施流程", "", ""], "r": "D", "e": "从标准名称“信息系统安全等级保护实施指南”可知，其主要作用是指导信息系统等级保护的具体实施流程。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818018", "t": 1, "q": "信息系统工程标准规范中，ISO/IEC 27001是关于以下哪类领域的标准？", "a": ["信息安全管理体系", "信息技术服务管理", "网络通信协议", "软件工程产品质量", "", ""], "r": "A", "e": "ISO/IEC 27001是信息安全管理体系标准。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818019", "t": 1, "q": "信息系统工程标准规范中，ISO/IEC 27002提供了？", "a": ["信息安全控制措施的实施指南", "信息安全管理体系的要求", "信息安全事件的响应流程", "网络安全等级保护的定级方法", "", ""], "r": "A", "e": "ISO/IEC 27002为信息安全控制措施提供实施指南。信息安全管理体系要求对应ISO/IEC 27001；信息安全事件响应流程在相关应急处理标准有体现；网络安全等级保护定级方法有专门的等级保护标准规定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818020", "t": 1, "q": "信息系统工程标准规范中，ISO/IEC 27034是关于以下哪类领域的标准？", "a": ["应用安全管理", "信息安全事件管理", "数据备份与恢复", "云计算安全", "", ""], "r": "A", "e": "ISO/IEC 27034是应用安全管理领域的国际标准。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818021", "t": 1, "q": "信息系统工程中，\"安全保障体系应覆盖系统的规划、设计、开发、部署、运行、维护等全生命周期\"这一原则体现了信息安全的哪个特性？", "a": ["动态性", "持续性", "整体性", "可控性", "", ""], "r": "C", "e": "该原则强调安全保障体系覆盖系统全生命周期，体现了从整体角度来保障信息安全。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818022", "t": 1, "q": "信息系统工程中，\"安全策略应根据业务需求、技术发展和威胁变化定期更新，确保始终有效\"这一要求体现了信息安全的哪个原则？", "a": ["动态调整原则", "风险导向原则", "最小权限原则", "纵深防御原则", "", ""], "r": "A", "e": "题干强调安全策略要根据情况定期更新以确保有效，这符合动态调整原则不断调整适应变化的特点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818023", "t": 1, "q": "信息系统工程中，\"系统运行过程中，定期对系统的安全配置、漏洞、补丁安装情况进行检查，确保符合安全策略\"的活动称为？", "a": ["安全测试", "风险评估", "安全巡检", "应急响应", "", ""], "r": "C", "e": "定期对系统安全配置等进行检查确保符合安全策略，这是安全巡检的工作内容。安全测试侧重检测系统安全性漏洞；风险评估是对风险的识别和分析；应急响应是针对突发事件的处理。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818024", "t": 1, "q": "在信息系统工程中，\"在系统部署前，对系统的安全功能、漏洞、合规性进行全面检测，确保满足安全要求\"的活动称为？", "a": ["安全测试", "应急响应", "风险评估", "安全审计", "", ""], "r": "A", "e": "安全测试是在系统部署前对系统安全功能、漏洞、合规性等全面检测确保满足安全要求。应急响应是应对安全事件；风险评估侧重识别和评估风险；安全审计是事后对系统活动审查。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818025", "t": 1, "q": "信息系统工程中，在系统规划阶段，对系统可能面临的安全威胁、脆弱性及潜在影响进行分析，确定风险等级的活动称为？", "a": ["应急响应", "安全测试", "风险评估", "安全审计", "", ""], "r": "C", "e": "风险评估就是对系统面临的安全威胁、脆弱性及潜在影响分析并确定风险等级。应急响应是应对安全事件；安全测试是检测系统安全功能；安全审计是对系统活动审查。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818026", "t": 1, "q": "信息系统工程中，在系统设计阶段，采用'分层防护'架构（如网络层防火墙、应用层WAF、数据层加密），这一设计遵循了信息安全的哪种原则？", "a": ["分权制衡原则", "风险评估原则", "纵深防御原则", "合规性原则", "", ""], "r": "C", "e": "“分层防护”架构是从多个层面进行安全防护，符合纵深防御原则，该原则强调通过多层次、多角度的安全措施来保护系统。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818027", "t": 1, "q": "信息系统工程中，GB/T 22239-2019《信息安全技术网络安全等级保护基本要求》将网络安全等级分为五级，其中\"应具备抵御国家级、有组织的高强度攻击能力\"的是哪一级？", "a": ["第一级（自主保护级）", "第四级（强制保护级）", "第三级（监督保护级）", "第五级（专控保护级）", "", ""], "r": "D", "e": "GB/T 22239 - 2019中，网络安全五级即专控保护级要求具备抵御国家级、有组织的高强度攻击能力。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818028", "t": 1, "q": "以下哪项不属于《信息安全技术网络安全等级保护基本要求》（GB/T 22239）中\"网络安全\"的核心要求？", "a": ["网络带宽管理（如流量限制）", "网络访问控制（如防火墙策略）", "网络架构安全（如分区隔离）", "网络设备安全（如设备加固）", "", ""], "r": "A", "e": "《信息安全技术网络安全等级保护基本要求》核心关注网络安全防护机制，网络带宽管理主要是对网络流量的调配，并非网络安全核心要求。而网络访问控制、架构安全、设备安全都是保障网络安全的关键方面。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818029", "t": 1, "q": "以下哪项不属于《信息技术安全技术信息安全管理体系要求》（ISO/IEC 27001:2022）中\"组织环境\"章节的要求？", "a": ["制定信息安全风险评估准则", "识别与组织相关的内外部利益相关方", "理解组织的内外部环境因素", "确定信息安全管理体系的范围", "", ""], "r": "A", "e": "“组织环境”主要聚焦于了解组织所处内外部环境、识别利益相关方及确定体系范围等，制定信息安全风险评估准则属于风险评估相关内容，不在“组织环境”章节要求内。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818030", "t": 1, "q": "以下哪项不属于《信息技术软件产品评价质量特性及其使用指南》（GB/T 16260）中与\"软件安全\"相关的质量特性？", "a": ["功能性（如安全功能的正确性）", "易用性（如用户操作的便捷性）", "维护性（如漏洞修复的难易程度）", "可靠性（如防故障能力）", "", ""], "r": "B", "e": "“软件安全”主要涉及功能的正确性、漏洞修复、防故障等方面，易用性强调用户操作便捷，与软件安全关联不大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818031", "t": 1, "q": "以下哪项属于《信息系统工程监理规范》（GB/T 19668）中\"监理实施\"阶段的工作内容？", "a": ["编制监理规划与监理实施细则", "验收信息系统，出具监理验收报告", "评估信息系统的安全风险，提出整改建议", "协助建设单位确定信息系统的建设目标", "", ""], "r": "C", "e": "A 属于监理准备阶段；B 属于验收阶段；D 属于前期规划阶段；C 评估安全风险、提出整改建议，属于监理实施过程中的质量与安全管控工作，属于监理实施阶段。", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818032", "t": 1, "q": "以下哪种技术不属于软件安全开发生命周期（SDL）中\"设计阶段\"的核心安全活动？", "a": ["威胁建模", "代码静态分析", "安全架构设计", "安全需求定义", "", ""], "r": "B", "e": "代码静态分析是在代码编写完成后进行的，属于开发或测试阶段活动，而威胁建模、安全架构设计、安全需求定义是设计阶段核心活动。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818033", "t": 1, "q": "在操作系统安全中，下列关于强制访问控制（MAC）的描述，正确的是？", "a": ["根据主体和客体的安全级别强制分配访问权限", "基于主体的身份和所属组来分配访问权限", "由资源所有者决定其他主体的访问权限", "仅适用于单用户操作系统", "", ""], "r": "A", "e": "强制访问控制（MAC）依据主体和客体的安全级别来强制分配访问权限。B选项是基于身份的自主访问控制特点；C选项是自主访问控制中资源所有者可决定访问权限；D选项MAC适用于多用户系统。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818034", "t": 1, "q": "在软件安全中，针对软件运行时内存区域被非法修改的攻击，下列哪种技术最能直接抵御该类攻击？", "a": ["数据加密", "地址空间布局随机化（ASLR）", "输入验证", "日志审计", "", ""], "r": "B", "e": "此类攻击主要利用内存地址的可预测性来非法修改内存区域。地址空间布局随机化（ASLR）通过随机化进程的内存空间布局，使攻击者难以确定关键数据和代码的准确地址，直接抵御对运行时内存区域的非法修改。而数据加密主要保护数据内容，输入验证防止恶意输入，日志审计用于事后分析，均不能直接抵御此类攻击。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818035", "t": 1, "q": "在软件漏洞的CVSS（通用漏洞评分系统）3.1评分标准中，若某漏洞的基础评分在7.0-8.9之间，其对应的风险等级是？", "a": ["低危（Low）", "高危（High）", "中危（Medium）", "严重（Critical）", "", ""], "r": "B", "e": "CVSS 3.1评分标准里，7.0 - 8.9分对应的风险等级是高危。答案选B。 <br />题干中的漏洞基础评分为7.0-8.9之间，因此该漏洞属于高危（High）等级。选项A、C和D均不符合此评分区间对应的等级划分。", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818036", "t": 1, "q": "在数据库安全中，\"备份与恢复\"的安全要求不包括？", "a": ["恢复操作需进行身份认证与权限校验", "备份数据需加密存储，防止泄露", "备份介质需异地存放，防止灾难导致数据丢失", "备份频率需根据数据的重要性确定，与业务无关", "", ""], "r": "D", "e": "备份频率既和数据重要性有关，也和业务相关，业务的特点和需求会影响备份频率设定，D说法错误。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818037", "t": 1, "q": "在数据库安全中，\"参数化查询\"主要用于防御哪种常见的数据库攻击？", "a": ["数据库权限提升攻击", "数据泄露攻击", "SQL注入攻击", "缓冲区溢出攻击", "", ""], "r": "C", "e": "参数化查询将用户输入与 SQL 语句分离，能有效防止攻击者通过构造恶意输入改变 SQL 语句原意，主要防御 SQL 注入攻击。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818038", "t": 1, "q": "在数据库安全中，\"访问控制列表（ACL）\"的作用是？", "a": ["检测并阻断异常的数据库访问行为（如SQL注入）", "对数据库的访问流量进行控制，防止过载", "记录数据库所有的访问操作，形成审计日志", "限制特定主体对特定客体的访问权限（如用户A仅能读表B）", "", ""], "r": "D", "e": "访问控制列表（ACL）核心就是规定主体对客体的访问权限。A是入侵检测功能；B是流量管控；C是审计功能。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818039", "t": 1, "q": "在数据库安全中，\"角
