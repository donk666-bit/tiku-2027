本题可根据微程序存储器容量来确定所需的地址位数，再结合题目中给定的下地址字段位数判断微指令格式是否合理。 步骤一：计算微程序存储器容量为1KB时所需的地址位数已知微程序存储器容量为1KB，因为「test/yiwen_img/importSubject/2034813830281957376.png」，即该微程序存储器有1024个存储单元，要对这1024个存储单元进行寻址，需要10位地址（「test/yiwen_img/importSubject/2034813830500061184.png」 ）。 步骤二：分析题目中给定的下地址字段位数题目中微指令的下地址字段为8位，8位地址最多能表示「test/yiwen_img/importSubject/2034813830537809920.png」个微指令地址，而该微程序存储器有1024个微指令，256<1024，无法对1KB微程序存储器中的所有微指令进行寻址，所以应将下地址字段改为10位。综上，该微指令格式不合理，下地址字段8位仅能表示256个微指令地址，而1KB微存储器需10位地址，故应将下地址字段改为10位，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763914", "t": 1, "q": "某计算机的主存采用DRAM，刷新周期为64ms，每个刷新周期刷新16行，每行刷新时间为100ns。若主存容量为1GB，每个存储体有8192行，则该DRAM的刷新开销（刷新时间占总时间的比例）为？", "a": ["8192×100ns/64ms×100%", "（8192/16）×100ns/（64ms+（8192/16）×100ns）×100%", "（8192/16）×100ns/64ms×100%", "16×100ns/64ms×100%", "", ""], "r": "C", "e": "先求总刷新时间，主存共8192行，每周期刷新16行，需8192/16个周期，每行刷新100ns，所以总刷新时间是（8192/16）×100ns；总时间为刷新周期64ms，刷新开销是总刷新时间占总时间比例。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763915", "t": 1, "q": "某计算机系统的内存按字节编址，地址范围为00000H~7FFFFH，若采用8K×8位的SRAM芯片构成该内存，需要的芯片数量为？", "a": ["128片", "32片", "256片", "64片", "", ""], "r": "D", "e": "先算内存总容量，地址范围是00000H - 7FFFFH，容量为80000H字节，即512KB。芯片是8K×8位即8KB，512KB除以8KB得64片。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763916", "t": 1, "q": "某计算机系统的指令周期包含取指、译码、执行、访存、写回五个阶段，若采用流水线技术实现指令执行，假设每个阶段的执行时间均为1ns，忽略流水线建立和排空时间，该流水线的最大吞吐率（单位时间内完成的指令数）为", "a": ["1×10^9条/秒", "0.2×10^9条/秒", "5×10^9条/秒", "0.5×10^9条/秒", "", ""], "r": "A", "e": "流水线最大吞吐率取决于流水线中最慢的阶段时间，本题各阶段时间相同均为1ns。每秒有10^9 ns，每个指令需1ns完成，所以最大吞吐率是1×10^9条/秒。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763917", "t": 1, "q": "某计算机系统的主存采用DRAM芯片，其刷新周期为64ms，每次刷新需200ns，若该DRAM芯片有8192行存储单元，则其刷新开销（刷新时间占总时间的比例）为？", "a": ["0.1%", "0.05%", "0.2%", "0.025%", "", ""], "r": "D", "e": "刷新开销是指用于刷新的时间占总运行时间的比例。对于DRAM，其刷新方式通常为行刷新，即在一个刷新周期内，所有行必须被刷新一次。<br />计算步骤：<br />总刷新时间：<br />每行刷新需 200 ns，共 8192 行。<br />总刷新时间 = 8192 × 200 ns = 1,638,400 ns<br />刷新周期（总时间窗口）：<br />刷新周期为 64 ms = 64 × 10⁶ ns = 64,000,000 ns<br />刷新开销比例：<br />开销 =（总刷新时间 ÷ 刷新周期）× 100%<br />=（1,638,400 ÷ 64,000,000）× 100%<br />= 0.0256% ≈ 0.025%<br />因此，最接近的选项为 D. 0.025%。", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763918", "t": 1, "q": "某计算机系统的I/O接口采用程序查询方式，CPU执行查询程序需100个时钟周期，传送一个数据需10个时钟周期，CPU时钟频率为1GHz。若该接口每分钟需传送6000个数据，则CPU用于I/O操作的时间占比是？", "a": ["（100+10）×6000/（1e9×60）×100%", "100×6000/（1e9×60）×100%", "10×6000/（1e9×60）×100%", "（100+10）×6000/（1e9）×100%", "", ""], "r": "A", "e": "程序查询方式下，每次传送数据，CPU先执行查询程序（100 个时钟周期），再传送数据（10 个时钟周期），所以每次传送一个数据共需100 + 10个时钟周期。每分钟传送6000个数据，总共用时（100 + 10）×6000个时钟周期。CPU时钟频率为1GHz，即每秒1e9个时钟周期，一分钟有1e9×60个时钟周期，所以CPU用于I/O操作的时间占比是（100 + 10）×6000/（1e9×60）×100%。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763919", "t": 1, "q": "某微处理器采用分段存储管理，其段基址寄存器为20位，段内偏移量为16位。若某段的段基址为12340H，段内偏移量为5678H，则该存储单元的物理地址是？", "a": ["12340H<<16+5678H=123400000H+5678H=123405678H", "12340H+5678H=179B8H", "123405678H", "1234H<<4+5678H=12340H+5678H=179B8H", "", ""], "r": "D", "e": "物理地址的计算方法是把段基址左移4位（相当于乘以16），再加上段内偏移量。<br />段基址 12340H 左移4位 = 123400H<br />加上偏移量 5678H = 123400H + 5678H = ‌179B8H‌<br />所以 B 和 D 结果相同，但 D 的算式表达正确（左移4位），B 直接相加漏掉了左移过程。A 和 C 把左移位数搞错成了16位，也不对。", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763920", "t": 1, "q": "某微处理器的时钟频率为1GHz，执行一条指令平均需要2个时钟周期（CPI=2），该处理器的运算速度（MIPS）为？", "a": ["250 MIPS", "500 MIPS", "1000 MIPS", "2000 MIPS", "", ""], "r": "B", "e": "先算出每秒时钟周期数为1GHz即1000M，因执行一条指令平均需2个时钟周期，所以每秒执行指令数为1000M÷2 = 500M，即500MIPS。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763921", "t": 1, "q": "某微处理器的指令格式为:操作码（6位）+寻址方式码（3位）+寄存器号（3位）+地址码（16位）。若该处理器有16个通用寄存器，则指令格式中\"寄存器号\"字段的位数是否合理？若不合理，应如何调整？", "a": ["合理，16个寄存器需4位表示，但这里使用了3位，实际上3位只能表示8个寄存器，因此不合理。正确的做法是将寄存器号字段改为4位，同时为了保持总位数不变，地址码字段应调整为15位。", "不合理，16个寄存器确实需要4位来表示(因为2^4=16)，而给定的3位仅能表示最多8个不同的寄存器。但是，不需要将寄存器号字段增加到5位，只需将其改为4位即可满足需求;相应地，地址码字段应当减少至15位以维持整个指令长度的一致性。", "不合理，虽然尝试指出了问题所在——即3位不足以表示全部16个寄存器，并且也建议了正确的解决方法:将寄存器号字段从3位扩展到4位。然而，关于3位能够表示的寄存器数量的说法是错误的，它实际上可以表示8个而非小于16个。", "不合理，准确地指出了解决方案:由于16个寄存器需要4位二进制编码才能唯一标识每个寄存器，而当前只有3位用于此目的，这显然是不够的。因此，确实应该将寄存器号部分扩展到4位，并相应地将地址码部分缩减为15位。", "", ""], "r": "D", "e": "16个通用寄存器需4位（2^4 = 16）来唯一表示，而指令格式中“寄存器号”是3位（2^3 = 8，只能表示8个），不合理，要改为4位，为保持指令总位数不变，地址码字段应从16位调为15位。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763922", "t": 1, "q": "某微处理器的CPI（每条指令的平均时钟周期数）为1.5，时钟频率为2GHz，若该处理器执行一个程序需10秒，则该程序包含的指令数约为？", "a": ["(2e9×10)/1.5≈1.33e10条", "(1.5×10)/2e9=7.5e-9条", "(2e9)/(1.5×10)≈1.33e8条", "(2e9×1.5)/10=3e8条", "", ""], "r": "A", "e": "时钟频率为2GHz，即每秒有2×10⁹个时钟周期，10秒则有2×10⁹×10个时钟周期，又知CPI为1.5，指令数 = 总时钟周期数÷CPI，即(2×10⁹×10)÷1.5 。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763923", "t": 1, "q": "某微处理器的I/O地址空间采用\"内存映射I/O\"方式，其特点是？", "a": ["I/O设备地址与主存地址共用同一地址空间，无需专用I/O指令", "I/O设备与主存采用不同的控制信号，避免地址冲突", "I/O设备的访问速度比\"端口映射I/O\"方式慢，因为需经过内存控制器", "I/O设备地址有独立的地址空间，需专用I/O指令访问", "", ""], "r": "A", "e": "内存映射I/O方式下，I/O设备地址与主存地址共用同一地址空间，可像访问内存一样访问I/O设备，无需专用I/O指令。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763924", "t": 1, "q": "某微处理器接口电路中，采用中断控制方式实现I/O数据传输，当多个外设同时发出中断请求时，微处理器需通过优先级判断决定响应顺序。下列关于中断优先级管理的技术中，能确保最高优先级中断不受低优先级中断干扰的是", "a": ["向量中断方式", "菊花链判优方式", "轮询查询方式", "中断屏蔽方式", "", ""], "r": "D", "e": "中断屏蔽方式可通过设置屏蔽位来控制中断请求的响应，能确保最高优先级中断不受低优先级中断干扰。向量中断是获取中断服务程序入口地址；菊花链判优按硬件连接顺序决定优先级；轮询查询是逐个查询外设是否有中断请求。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763925", "t": 1, "q": "某指令采用变址寻址方式，指令中地址码字段为A，变址寄存器为IX，基址寄存器为BX，若该指令的有效地址EA=（BX）+（IX）+A，则该寻址方式属于？", "a": ["基址寻址", "变址寻址", "基址-变址寻址", "相对寻址", "", ""], "r": "C", "e": "有效地址由基址寄存器内容、变址寄存器内容和地址码字段相加得到，符合基址 - 变址寻址的特征。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763926", "t": 1, "q": "某指令系统采用定长操作码，指令字长16位，其中地址码占12位。若该指令系统可实现25种不同操作，则操作码的位数至少应为？", "a": ["7位", "5位", "6位", "4位", "", ""], "r": "B", "e": "操作码位数需满足能表示25种不同操作，2^4 < 25 < 2^5，所以操作码至少要5位。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763927", "t": 1, "q": "以下关于分布式处理系统中\"一致性哈希\"的作用，描述错误的是？", "a": ["保证所有节点的负载绝对均衡", "通过虚拟节点提高哈希的均匀性", "解决传统哈希算法中节点数量变化导致的哈希重映射问题", "减少节点加入或退出时的数据迁移量", "", ""], "r": "A", "e": "一致性哈希不能保证所有节点负载绝对均衡，因节点性能、数据分布等存在差异。其他选项都是一致性哈希的作用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763928", "t": 1, "q": "以下关于分布式系统中\"CAP定理\"的描述，错误的是？", "a": ["C代表一致性（Consistency）", "分布式系统可同时满足C、A、P三个特性", "A代表可用性（Availability）", "P代表分区容错性（Partition Tolerance）", "", ""], "r": "B", "e": "CAP定理指出，分布式系统无法同时满足一致性（C）、可用性（A）和分区容错性（P）这三个特性，只能在三者中选择两个。A、C、D选项对C、A、P的含义描述正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763929", "t": 1, "q": "以下关于计算机系统中\"异常\"与\"中断\"的区别，描述正确的是？", "a": ["异常不可屏蔽，中断均可屏蔽", "异常由外部设备触发，中断由CPU内部事件触发", "异常处理完成后不一定返回原执行点，中断处理后必须返回", "异常的响应优先级一定高于中断", "", ""], "r": "C", "e": "异常处理完成后可能不返回原执行点，如程序错误异常可能终止程序；而中断处理后一般要返回原执行点继续执行。A选项，有些中断不可屏蔽；B选项，异常由CPU内部事件触发，中断由外部设备触发；D选项，异常和中断响应优先级因情况而异。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763930", "t": 1, "q": "以下关于计算机总线的分类，按传输信息类型划分的是？", "a": ["同步总线和异步总线", "系统总线和局部总线", "数据总线、地址总线和控制总线", "内部总线和外部总线", "", ""], "r": "C", "e": "按传输信息类型，计算机总线分为数据、地址和控制总线。A按工作方式分；B按位置和功能分；D按连接位置分。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763931", "t": 1, "q": "以下关于微处理器中\"中断优先级\"的描述，正确的是？", "a": ["同级中断请求按\"先到先服务\"原则处理，不可嵌套", "高优先级中断请求可中断低优先级的中断服务程序", "CPU响应中断时，会自动屏蔽所有同级和低级中断请求", "优先级一旦设定，不可通过程序修改", "", ""], "r": "B", "e": "高优先级中断有打断低优先级中断服务程序的能力，这是中断优先级机制的重要特性。A选项同级中断可嵌套；C选项CPU响应中断时一般是屏蔽同级和低级中断请求，但表述“自动”不准确，有些情况可设置；D选项优先级可通过程序修改。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763932", "t": 1, "q": "以下关于微处理器中程序状态字（PSW）的描述，错误的是？", "a": ["包含进位标志、溢出标志等状态信息", "能反映当前指令执行后的处理器状态", "其内容在中断响应时不会被保存", "部分位可由程序指令直接修改", "", ""], "r": "C", "e": "中断响应时会保存PSW内容，以便中断处理完后恢复现场。A选项PSW含进位、溢出等标志；B选项能反映指令执行后处理器状态；D选项部分位可由程序指令修改。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763933", "t": 1, "q": "以下关于微处理器中断处理过程的描述，正确的顺序是？①保护断点和PSW②执行中断服务程序③关中断④开中断并返回断点", "a": ["①→③→②→④", "③→①→②→④", "③→②→①→④", "①→②→③→④", "", ""], "r": "B", "e": "中断处理时先关中断防止其他中断干扰，接着保护断点和PSW，之后执行中断服务程序，最后开中断并返回断点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763934", "t": 1, "q": "以下关于微处理器中堆栈操作的描述，正确的是？", "a": ["出栈操作时SP的值先取数据后加", "压栈操作时SP的值先减后存数据", "堆栈操作只能对字（16位）数据进行", "堆栈指针（SP）始终指向栈底", "", ""], "r": "B", "e": "压栈时，先将栈指针SP减1，再把数据存入SP指向的位置；出栈是先从SP取数据，再将SP加1；堆栈操作可对字节、字等数据操作；堆栈指针SP指向栈顶。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763935", "t": 1, "q": "以下关于Cache替换算法的描述，哪种算法能最好地利用程序的局部性原理，从而获得最高的Cache命中率？", "a": ["随机替换算法（RAND）", "先进先出算法（FIFO）", "最不经常使用算法（LFU）", "最近最少使用算法（LRU）", "", ""], "r": "D", "e": "程序局部性原理指程序在执行时呈现出局部性规律，近期使用过的数据很可能再次被使用。LRU算法会优先替换出最近最少使用的数据，能很好契合局部性原理。而随机替换、先进先出、最不经常使用算法均不能很好利用该原理。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763936", "t": 1, "q": "以下关于Cache与主存地址映射的描述，哪种映射方式的Cache空间利用率最高？", "a": ["组相联映射", "全相联映射", "直接映射", "段相联映射", "", ""], "r": "B", "e": "全相联映射允许主存中任意一块映射到Cache中任意位置，能充分利用Cache空间。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763937", "t": 1, "q": "以下关于I/O接口的描述，错误的是？", "a": ["所有I/O接口都必须包含数据寄存器、状态寄存器和控制寄存器", "可协调CPU与I/O设备的工作时序", "可实现CPU与I/O设备之间的速度匹配", "可转换CPU与I/O设备之间的数据格式", "", ""], "r": "A", "e": "不是所有I/O接口都必须包含数据寄存器、状态寄存器和控制寄存器，有些简单接口可能不需要这么全。而I/O接口能协调时序、匹配速度、转换数据格式。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763938", "t": 1, "q": "在并行处理系统中，\"任务划分\"的主要原则不包括？", "a": ["尽量减少任务间的数据依赖，降低同步和通信成本", "任务数量应与处理器数量完全相等，避免处理器空闲", "优先划分可并行执行的任务，保留必要的串行任务", "任务的粒度应适中，过细会增加通信开销，过粗会导致负载不均", "", ""], "r": "B", "e": "在并行处理系统中，任务数量与处理器数量完全相等是不现实且不合理的，因为实际情况复杂，可能存在任务执行时间差异等，为避免处理器空闲应让任务数量多于处理器数量，而非完全相等。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763939", "t": 1, "q": "在并行处理系统中，“任务划分”是并行化的关键步骤，以下哪种划分方式适用于数据量巨大、且各数据块处理逻辑相同的应用场景？", "a": ["流水线划分", "功能划分", "数据划分", "控制划分", "", ""], "r": "C", "e": "数据量巨大且各数据块处理逻辑相同，用数据划分可将数据分成多个块分别处理。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763940", "t": 1, "q": "在并行处理系统中，阿姆达尔定律（Amdahl's Law）用于计算系统并行化后的加速比，若某程序的串行部分占比为20%，则理论上该程序的最大加速比为", "a": ["3.5", "2.5", "5.0", "4.0", "", ""], "r": "C", "e": "阿姆达尔定律公式为 「test/yiwen_img/importSubject/2034813830583947264.png」，其中 S 是加速比，P 是可并行部分比例，N 是处理器数量。当 N 趋于无穷大时，加速比 「test/yiwen_img/importSubject/2034813830697193472.png」。本题串行部分占比 20%，则可并行部分 「test/yiwen_img/importSubject/2034813830747525120.png」，最大加速比 「test/yiwen_img/importSubject/2034813830814633984.png」。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763941", "t": 1, "q": "在并行处理系统中，某应用程序被划分为多个任务，任务间存在数据依赖关系（如任务B需等待任务A的计算结果才能执行）。下列并行编程模型中，最适合处理此类具有数据依赖的任务并行的是", "a": ["共享内存模型", "MPMD（多程序多数据）模型", "SPMD（单程序多数据）模型", "数据流模型", "", ""], "r": "D", "e": "数据流模型依据数据的可用性来驱动任务执行，天然适合处理有数据依赖关系的任务。共享内存模型主要用于共享内存访问；MPMD 强调多个不同程序运行；SPMD 侧重于单程序多数据处理，对数据依赖处理不如数据流模型。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763942", "t": 1, "q": "在并行处理系统中，Amdahl定律指出系统加速比S=1/[(1-f)+f/n]，其中f为可并行化比例，n为处理器数量。若某程序的可并行化比例f=0.8，当处理器数量n趋近于无穷大时，系统加速比S的极限值为？", "a": ["8", "4", "10", "5", "", ""], "r": "D", "e": "当n趋近于无穷大时，f/n趋近于0。此时S = 1/[(1 - f)+0]，已知f = 0.8，代入可得S = 1/(1 - 0.8)=5。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926016", "t": 2, "q": "关于并行处理的\"通信方式\"，下列属于共享内存通信方式的有（　）？", "a": ["通过信号量进行同步，实现对共享资源的互斥访问", "通过共享变量传递数据，处理器直接读写共享内存单元", "通过管道传递数据，在两个进程之间建立数据传输通道", "通过临界区保护共享数据，确保同一时间仅一个处理器访问", "", ""], "r": "ABD", "e": "答案：ABD并行处理中的通信方式主要有共享内存和消息传递两种。共享内存通信方式指的是多个处理器共享同一块物理内存，通过读写内存来进行通信。选项A、B、D都是基于共享内存的通信方式，其中A和D都是对共享资源的同步保护措施，B是直接读写共享内存单元。而选项C中的“通过管道传递数据”则属于消息传递的通信方式，不是基于共享内存的，所以不应被选择。", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926017", "t": 2, "q": "关于存储介质，下列属于易失性存储的有（　）？", "a": ["DRAM（动态随机存取存储器）", "SRAM（静态随机存取存储器）", "Flash Memory（闪存）", "硬盘（HDD）", "", ""], "r": "AB", "e": "易失性存储是指断电后数据会丢失的存储设备。DRAM和SRAM都属于随机存取存储器，断电后数据丢失，是易失性存储；而闪存和硬盘断电后数据不会丢失，属于非易失性存储。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926018", "t": 2, "q": "关于分布式文件系统，下列说法正确的有（　）？", "a": ["分布式文件系统将文件数据分散存储在多个节点上，提高存储容量和可靠性", "分布式文件系统通常采用主从架构，主节点管理元数据，从节点存储数据块", "分布式文件系统的读写性能可能高于本地文件系统，因为可以并行访问多个节点", "分布式文件系统需解决数据冗余、容错、一致性等问题，确保数据安全", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926019", "t": 2, "q": "关于分布式系统的\"容错机制\"，下列属于容错措施的有（　）？", "a": ["数据冗余存储，将数据复制到多个节点，避免单个节点故障导致数据丢失", "节点故障检测，通过心跳机制或健康检查，及时发现故障节点", "负载均衡，将任务均匀分配到各节点，避免单个节点过载", "故障恢复，将故障节点的任务迁移到其他正常节点，确保服务持续", "", ""], "r": "ABD", "e": "答案：ABD分布式系统的容错机制主要关注在系统出现故障时如何保证数据的完整性和服务的可用性。数据冗余存储（A选项）可以防止单个节点故障导致的数据丢失；节点故障检测（B选项）能够及时发现并处理故障节点；故障恢复（D选项）确保在节点故障时服务能够持续。而负载均衡（C选项）主要是为了优化系统性能，避免单个节点过载，虽然对系统的稳定性有帮助，但并不直接属于容错措施。", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926020", "t": 2, "q": "关于计算机体系结构的\"Flynn分类法\"，下列属于该分类的有（　）？", "a": ["DSMD（双指令流多数据流），如双核处理器系统", "MIMD（多指令流多数据流），如SMP、MPP并行系统", "MISD（多指令流单数据流），实际应用较少，如某些容错系统", "SIMD（单指令流多数据流），如向量处理器、GPU", "", ""], "r": "BCD", "e": "Flynn分类法将计算机体系结构分为SISD（单指令流单数据流）、SIMD（单指令流多数据流）、MISD（多指令流单数据流）、MIMD（多指令流多数据流）。向量处理器、GPU是SIMD典型应用；SMP、MPP并行系统是MIMD；MISD实际应用少，像某些容错系统。而A选项的DSMD不是Flynn分类法里的。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926021", "t": 2, "q": "关于计算机系统的\"中断\"，下列说法正确的有（　）？", "a": ["中断服务程序的入口地址通常存放在中断向量表中", "内部中断由CPU内部事件触发，如除法溢出、断点陷阱", "外部中断由I/O设备触发，如键盘按键、磁盘完成信号", "可屏蔽中断可通过设置中断屏蔽字禁止响应，非屏蔽中断无法禁止", "", ""], "r": "ABCD", "e": "中断向量表存放中断服务程序入口地址；内部中断由CPU内部事件引发；外部中断由I/O设备触发；可屏蔽中断能通过屏蔽字禁止响应，非屏蔽中断不可禁止。ABCD选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926022", "t": 2, "q": "关于数据的\"表示精度\"，下列说法正确的有（　）？", "a": ["相同位数下，浮点数的表示范围比定点数大，但精度通常低于定点数", "增加数据的位数（如从16位到32位），定点数和浮点数的精度均会提高", "浮点数的阶码位数影响表示范围，不影响表示精度", "浮点数的表示精度由尾数位数决定，尾数位数越多，精度越高", "", ""], "r": "ABCD", "e": "A项，相同位数下，浮点数表示范围大但精度低于定点数；B项，增加位数，定点数和浮点数精度都会提高；C项，阶码影响范围不影响精度；D项，尾数位数决定浮点数精度，位数越多精度越高。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926023", "t": 2, "q": "关于微程序控制器，下列说法正确的有（　）？", "a": ["每条机器指令对应一段微程序，每段微程序由若干条微指令组成", "微程序控制器的速度比硬布线控制器快，因为微指令执行周期短", "微程序控制器的灵活性高，修改微程序即可改变指令系统，无需修改硬件", "微程序控制器由控制存储器、微指令寄存器、微地址形成部件组成", "", ""], "r": "ACD", "e": "A选项，机器指令确实对应一段微程序，微程序由微指令构成；B选项，硬布线控制器速度比微程序控制器快；C选项，微程序控制器修改微程序就能改变指令系统，灵活性高；D选项，微程序控制器基本组成包含控制存储器、微指令寄存器、微地址形成部件等。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926024", "t": 2, "q": "关于指令的\"操作码\"，下列说法正确的有（　）？", "a": ["操作码用于指定指令要执行的操作类型，如加法、减法、跳转等", "复杂指令集（CISC）的操作码位数通常比精简指令集（RISC）多", "操作码的位数决定了指令系统能包含的指令条数，n位操作码最多支持2^n条指令", "操作码的编码方式不仅影响指令的存储效率，还可能影响到指令的执行速度", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926025", "t": 2, "q": "关于指令的\"执行周期\"，下列说法正确的有（　）？", "a": ["指令执行周期是指从取指令开始到执行完该指令所需的时间。", "不同指令的执行周期可能不同，复杂指令的执行周期通常更长。", "指令执行周期的长短仅取决于CPU的时钟频率，与指令类型无关。", "流水线技术可将指令执行周期重叠，使平均执行周期接近一个时钟周期。", "", ""], "r": "ABD", "e": "指令执行周期就是从取指令到执行完该指令的时间，不同指令复杂度不同执行周期也不同，复杂指令执行周期长；其长短不仅取决于CPU时钟频率，还和指令类型相关；流水线技术能让指令执行周期重叠，让平均执行周期接近一个时钟周期。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926026", "t": 2, "q": "关于指令系统的\"RISC\"（精简指令集计算机）和\"CISC\"（复杂指令集计算机），下列说法正确的有（　）？", "a": ["CISC CPU的硬件复杂度低于RISC，因为指令功能由软件实现", "CISC指令功能复杂，指令格式多样，多为变长指令", "RISC更依赖编译器优化，通过指令组合实现复杂功能", "RISC CPU的CPI通常低于CISC，因为指令执行周期短", "", ""], "r": "BCD", "e": "CISC指令功能复杂、格式多样且多为变长指令；RISC依赖编译器优化，用指令组合实现复杂功能，其指令执行周期短，CPI通常低于CISC；而CISC硬件复杂度高于RISC。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926027", "t": 2, "q": "关于总线系统，下列属于总线性能指标的有（　）？", "a": ["总线时钟频率，指总线的工作频率（如133MHz、800MHz）", "总线仲裁方式，指解决多个设备竞争总线的机制", "总线带宽，指单位时间内总线传输的数据量（如MB/s、GB/s）", "总线宽度，指总线一次能传输的数据位数（如32位、64位）", "", ""], "r": "ACD", "e": "总线性能指标用于衡量总线的性能好坏。总线时钟频率影响总线工作速度；总线带宽体现传输数据的能力；总线宽度决定一次传输的数据量，这三者都直接反映总线性能。而总线仲裁方式主要是解决设备竞争总线的机制，并非直接衡量总线性能的指标。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926028", "t": 2, "q": "关于Cache的\"写策略\"，下列说法正确的有（　）？", "a": ["写回（Write Back）:数据仅写入Cache，替换时才写回主存，减少主存写入次数", "写直达（Write Through）:数据同时写入Cache和主存，Cache和主存始终一致", "写直达策略的性能通常优于写回策略，因为无需等待主存写入", "写分配（Write Allocate）:写操作未命中时，将主存块调入Cache后再写入", "", ""], "r": "ABD", "e": "A选项写回策略确实是数据先写Cache，替换时再写回主存，可减少主存写入次数；B选项写直达就是数据同时写入Cache和主存，能保证二者一致；D选项写分配就是写未命中时先调主存块到Cache再写入。而写回策略性能通常优于写直达，因为写直达每次都要写主存，会有等待时间，C错误。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926029", "t": 2, "q": "微处理器的接口电路中，常用的可编程接口芯片包括（　）？", "a": ["8253/8254（可编程定时器/计数器）", "8255A（可编程并行接口）", "8259A（可编程中断控制器）", "8237A（可编程DMA控制器）", "", ""], "r": "ABCD", "e": "8253/8254是可编程定时器/计数器，8255A是可编程并行接口，8259A是可编程中断控制器，8237A是可编程DMA控制器，它们都是常用的可编程接口芯片。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926030", "t": 2, "q": "以下关于并行处理系统中\"多处理器系统\"的描述，正确的有？（　）", "a": ["多处理器系统的操作系统需支持任务的并行调度", "多处理器系统中的CPU可共享内存和I/O设备", "多处理器系统包含多个独立的CPU", "多处理器系统可分为共享内存多处理器和分布式内存多处理器", "", ""], "r": "ABCD", "e": "多处理器系统有多个独立CPU，CPU可共享内存和I/O设备，操作系统要支持任务并行调度，还可分为共享内存和分布式内存多处理器类型。ABCD选项描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926031", "t": 2, "q": "以下关于并行处理系统中\"任务调度\"的描述，正确的有？（　）", "a": ["任务调度算法需考虑任务的优先级和执行时间", "任务调度不会影响并行系统的整体性能", "任务调度的目的是将任务合理分配到各个处理器上执行", "静态调度是在程序运行前确定任务的分配方案", "", ""], "r": "ACD", "e": "任务调度要综合考虑多因素合理分配任务到处理器，会影响系统性能，需考虑任务优先级和执行时间，静态调度是运行前确定分配方案。B选项说不影响系统整体性能错误。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926032", "t": 2, "q": "以下关于并行处理系统中\"数据并行\"与\"任务并行\"的区别，正确的有？（　）", "a": ["数据并行是将数据拆分，相同任务并行处理不同数据", "数据并行的通信开销通常低于任务并行", "任务并行是将任务拆分，不同任务并行处理", "数据并行适用于同构数据处理，任务并行适用于异构任务处理", "", ""], "r": "ACD", "e": "数据并行是把数据拆分，让相同任务并行处理不同数据，适用于同构数据处理；任务并行是拆分任务，不同任务并行处理，适用于异构任务处理。一般数据并行通信开销大。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926033", "t": 2, "q": "以下关于分布式系统中\"容错技术\"的描述，正确的有？（　）", "a": ["容错技术的目的是使系统在部分组件故障时仍能正常工作", "故障恢复通常需要恢复故障节点的数据和状态", "容错技术会增加系统的复杂度和开销", "心跳检测可用于发现节点故障", "", ""], "r": "ABCD", "e": "容错技术就是为让系统在部分组件故障时继续正常工作，故障恢复要恢复故障节点数据与状态，其实现会增加系统复杂度和开销，心跳检测能发现节点故障。ABCD选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926034", "t": 2, "q": "以下关于分布式系统中\"数据分片\"的描述，正确的有？（　）", "a": ["分片透明性是指用户无需知道数据的分片位置和方式", "水平分片是将数据按行划分，每个分片包含部分记录", "数据分片后，各分片必须存储在同一地理区域的节点上", "垂直分片是将数据按列划分，每个分片包含部分属性", "", ""], "r": "ABD", "e": "A选项，分片透明性就是让用户不用关心数据分片位置和方式；B选项，水平分片确实是按行划分，各分片含部分记录；D选项，垂直分片是按列划分，各分片含部分属性。而C选项，数据分片后各分片可存储在不同地理区域节点，并非必须在同一地理区域。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926035", "t": 2, "q": "以下关于分布式系统中\"透明性\"的描述，属于\"位置透明性\"的有？（　）", "a": ["用户无需知道数据的分片方式", "用户访问数据时，无需指定数据所在节点的物理地址", "用户无需知道分布式系统的网络拓扑结构", "数据从一个节点迁移到另一个节点时，用户无需修改访问方式", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926036", "t": 2, "q": "以下关于分布式系统中\"一致性算法\"的描述，属于Paxos算法特点的有？（　）", "a": ["Paxos算法是一种强一致性算法", "Paxos算法用于解决分布式系统中多个节点的数据一致性问题", "Paxos算法可保证在多数情况下选出唯一的共识值", "Paxos算法包含提议者（Proposer）、接受者（Acceptor）和学习者（Learner）三种角色", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926037", "t": 2, "q": "以下关于计算机系统中\"存储层次\"的描述，正确的有？（　）", "a": ["辅助存储器（如磁盘）位于存储层次的最底层", "Cache位于存储层次的最顶层", "存储层次从上到下，速度逐渐变慢，容量逐渐变大", "存储层次的设计依据是程序的局部性原理", "", ""], "r": "ABCD", "e": "存储层次从顶层到最底层依次是寄存器、Cache、主存、辅助存储器。辅助存储器（如磁盘）在最底层，Cache在较高层接近顶层，且存储层次从上到下速度变慢、容量变大，其设计依据就是程序的局部性原理。四个选项表述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926038", "t": 2, "q": "以下关于计算机总线传输方式的描述，属于\"异步总线\"特点的有？（　）", "a": ["总线传输无需统一的时钟信号", "传输效率低于同步总线", "通过握手信号（如请求、应答）协调数据传输", "传输速度受设备速度影响，灵活性高", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926039", "t": 2, "q": "以下关于计算机总线分类的描述，属于\"系统总线\"连接部件的有？（　）", "a": ["主存", "CPU", "高速缓存（Cache）", "外部设备（如键盘、鼠标）", "", ""], "r": "ABC", "e": "系统总线用于连接计算机各主要部件，像CPU、主存、高速缓存等。外部设备通过I/O总线连接。所以ABC属于系统总线连接部件，答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926040", "t": 2, "q": "以下关于计算机总线性能指标的描述，属于总线重要性能指标的有？（　）", "a": ["总线负载能力", "总线宽度", "总线带宽", "总线仲裁方式", "", ""], "r": "BC", "e": "总线宽度决定一次传输的数据量，总线带宽体现传输速率，二者是反映总线性能的关键指标。总线负载能力和仲裁方式虽与总线相关，但并非直接衡量总线性能的核心指标。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926041", "t": 2, "q": "以下关于计算机I/O接口中\"状态寄存器\"的描述，正确的有？（　）", "a": ["状态寄存器中的\"忙\"标志位表示设备正在执行操作", "状态寄存器的内容通常由I/O设备自动更新", "状态寄存器用于存放I/O设备的当前状态信息", "CPU可通过读取状态寄存器了解设备是否就绪", "", ""], "r": "ABCD", "e": "状态寄存器用于存I/O设备当前状态信息，“忙”标志表明设备在执行操作，其内容一般由I/O设备自动更新，CPU能读取它来了解设备是否就绪。ABCD选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926042", "t": 2, "q": "以下关于计算机I/O控制方式的描述，属于DMA方式特点的有？（　）", "a": ["数据传输过程无需CPU干预", "数据传输通过执行I/O指令完成", "需要专用的DMA控制器", "可实现内存与I/O设备之间的直接数据传输", "", ""], "r": "ACD", "e": "DMA方式即直接存储器访问，有专用DMA控制器，能让内存与I/O设备直接传输数据，传输时CPU基本不干预。而通过执行I/O指令完成数据传输是程序查询、中断等方式特点。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926043", "t": 2, "q": "以下关于微处理器与I/O设备之间数据传输方式的描述，属于\"程序查询方式\"特点的有？（　）", "a": ["硬件结构简单，无需专用控制器", "适用于高速I/O设备", "CPU需要不断查询I/O设备的状态", "数据传输过程中CPU不能做其他工作", "", ""], "r": "ACD", "e": "程序查询方式硬件结构简单，不用专用控制器，CPU要不断查询I/O设备状态，且在数据传输时CPU被占用不能做其他事，它适用于低速I/O设备。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926044", "t": 2, "q": "以下关于微处理器中\"寄存器\"的描述，属于通用寄存器特点的有？（　）", "a": ["用于临时存放运算数据和地址", "可由程序员通过指令直接访问", "数量通常较少（如8个、16个）", "访问速度快于Cache和主存", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926045", "t": 2, "q": "以下关于微处理器中\"控制单元（CU）\"的描述，正确的有？（　）", "a": ["硬布线控制单元的速度通常快于微程序控制单元", "控制单元是微处理器的指挥中心，负责产生控制信号", "控制单元不参与数据运算，仅负责指令执行的控制", "控制单元可根据指令的操作码产生相应的控制信号", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926046", "t": 2, "q": "以下关于微处理器中\"指令周期\"的描述，正确的有？（　）", "a": ["指令周期的长短与CPU的时钟频率无关", "一个指令周期通常包含多个机器周期", "机器周期是指CPU访问一次内存或I/O设备所需的时间", "不同指令的指令周期长度可能不同", "", ""], "r": "BCD", "e": "指令周期受CPU时钟频率影响，A错误；一个指令周期包含多个机器周期，B正确；机器周期是CPU完成一个基本操作所需时间，一般是访问一次内存或I/O设备时间，C正确；不同指令复杂程度不同，指令周期长度可能不同，D正确。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926047", "t": 2, "q": "以下关于微处理器中断系统的描述，正确的有？（　）", "a": ["中断请求信号通常由I/O设备产生", "中断屏蔽字可控制某些中断请求是否被CPU响应", "中断响应过程中会自动清除中断请求标志", "中断向量表用于存放中断服务程序的入口地址", "", ""], "r": "ABD", "e": "答案：ABD中断请求信号通常由外部设备（如I/O设备）产生，因此A正确。中断屏蔽字可以用来控制CPU是否响应某些中断请求，因此B正确。中断向量表用于存放中断服务程序的入口地址，这样CPU在响应中断时能快速找到对应的中断处理程序，因此D正确。至于C选项，中断响应过程中并不会自动清除中断请求标志，这通常需要在中断服务程序中手动清除，因此C错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926048", "t": 2, "q": "以下关于指令系统中\"操作码\"的描述，正确的有？（　）", "a": ["操作码位数越多，指令系统可实现的操作种类越少", "扩展操作码可在指令字长固定的情况下，增加指令的种类", "定长操作码的指令系统中，所有指令的操作码位数相同", "操作码用于指定指令执行的操作类型（如加法、减法）", "", ""], "r": "BCD", "e": "A选项错误，操作码位数越多，可表示的操作种类越多；B选项，扩展操作码能在指令字长固定时增加指令种类；C选项，定长操作码指令系统中，所有指令操作码位数相同；D选项，操作码就是指定指令执行的操作类型。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926049", "t": 2, "q": "以下关于指令系统中\"地址码\"的描述，正确的有？（　）", "a": ["二地址指令通常需要两个地址码分别指定两个源操作数地址", "零地址指令没有地址码字段", "地址码用于指定操作数的地址或指令的地址", "一地址指令的地址码字段既可以指定源操作数地址，也可以指定结果地址", "", ""], "r": "ABCD", "e": "答案：ABCD指令系统中的地址码用于指定操作数或指令的地址。二地址指令需要两个地址码来分别指定两个源操作数的地址；零地址指令则没有地址码字段；一地址指令的地址码字段具有灵活性，既可以指定源操作数的地址，也可以指定结果的地址。因此，A、B、C、D四个选项都是正确的描述。", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926050", "t": 2, "q": "以下关于指令系统中\"寻址方式\"的描述，属于基址寻址特点的有？（　）", "a": ["地址码字段通常表示操作数的偏移量", "基址寄存器的内容通常由操作系统或系统程序设置", "有效地址由基址寄存器内容与指令地址码相加得到", "主要用于解决程序的动态重定位问题", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926051", "t": 2, "q": "在并行处理系统中，\"共享内存架构\"的特点有（　）？", "a": ["各处理器通过共享主存交换数据，无需显式消息传递", "编程难度较低，可直接使用共享变量实现处理器间通信", "存在总线竞争问题，随着处理器数量增加，总线带宽可能成为瓶颈", "系统扩展性好，可轻松增加大量处理器而不影响性能", "", ""], "r": "ABC", "e": "共享内存架构里，处理器通过共享主存交换数据，编程能用共享变量通信，但因多处理器共用总线，会有总线竞争，处理器增多时总线带宽易成瓶颈，系统扩展性有限。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926052", "t": 2, "q": "在并行处理系统中，以下属于\"SIMD\"（单指令多数据）架构特点的有？（　）", "a": ["指令系统与传统串行处理器兼容", "一条指令可同时控制多个处理单元执行相同操作", "适用于数据并行性高的应用（如矩阵运算、图像处理）", "每个处理单元可执行不同的指令", "", ""], "r": "BC", "e": "SIMD 是单指令多数据，即一条指令控制多个处理单元执行相同操作，适合数据并行性高的应用。A 选项与是否兼容传统串行处理器无关；D 选项每个处理单元执行相同指令而非不同指令。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926053", "t": 2, "q": "在并行处理中，\"阿姆达尔定律\"的主要结论有（　）？", "a": ["当处理器数量无限增加时，加速比趋近于1/串行比例", "并行部分的比例越大，增加处理器数量对加速比的提升越明显", "系统加速比=原系统执行时间/并行系统执行时间", "阿姆达尔定律仅适用于共享内存并行系统，不适用于分布式系统", "", ""], "r": "ABC", "e": "阿姆达尔定律表明，加速比受串行部分比例限制，处理器数量无限增加时，加速比趋近于1/串行比例；并行部分比例大，增加处理器对加速比提升更明显；系统加速比是原系统执行时间与并行系统执行时间之比；它适用于多种并行系统。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836195926054", "t": 2, "q": "在并行处理中，下列属于任务并行与数据并行的区别有（　）", "a": ["适用场景（复杂任务分解/大量数据处理）", "处理对象（任务/数据）", "程序结构（多程序/单程序）", "同步需求（通常高/通常低）", "资源利用效率（高度依赖于任务划分/数据分割）", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813836200120320", "t": 2, "q": "在并行系统中，下列属于多处理器系统与多核处理器系统的区别有（　）", "a": ["缓存层次（各CPU独立缓存/核心共享L2/L3缓存）", "总线结构（共享系统总线/共享片内总线）", "通信延迟（通常长/通常短）", "功耗（通常高/通常低）", "", ""], "r": "ABCD", "e": "多处理器系统各CPU有独立缓存，多核处理器系统核心共享L2/L3缓存；多处理器系统用共享系统总线，多核处理器系统用共享片内总线；多处理器系统通信延迟通常长，多核处理器系统通常短；多处理器系统功耗通常高，多核处理器系统通常低。ABCD选项均体现了二者区别。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813836200120321", "t": 2, "q": "在并行与分布式处理系统中，下列属于并行处理关键技术的有（　）", "a": ["进程同步与通信技术", "缓存一致性维护技术", "数据分布与映射技术", "任务划分与调度技术", "", ""], "r": "ABCD", "e": "并行处理关键技术涵盖多个方面。进程同步与通信技术可协调进程间操作；缓存一致性维护技术保证数据一致性；数据分布与映射技术合理分配数据；任务划分与调度技术有效分配任务。ABCD选项均是并行处理关键技术。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836200120322", "t": 2, "q": "在存储系统中，\"虚拟内存\"的实现需要的硬件支持包括（　）？", "a": ["缺页中断机构，当虚拟地址对应的页不在主存时，触发中断", "页表寄存器，存储当前进程页表的基地址", "Cache，用于缓存虚拟内存中的常用数据，提高访问速度", "快表（TLB），用于加速虚拟地址到物理地址的转换", "", ""], "r": "ABD", "e": "虚拟内存实现需缺页中断机构处理页不在主存情况，页表寄存器存当前进程页表基地址，快表加速地址转换。Cache主要用于CPU和主存间缓存数据，并非虚拟内存实现的必要硬件支持。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836200120323", "t": 2, "q": "在存储系统中，下列属于虚拟存储器的实现方式有（　）", "a": ["段式虚拟存储器", "块式虚拟存储器", "段页式虚拟存储器", "页式虚拟存储器", "", ""], "r": "ACD", "e": "虚拟存储器实现方式主要有段式、页式和段页式。块式不是虚拟存储器的实现方式。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813836200120324", "t": 2, "q": "在存储系统中，影响Cache命中率的因素有（　）？", "a": ["映射方式，全相联映射命中率最高，直接映射最低，组相联介于两者之间", "Cache的容量大小，容量越大，命中率通常越高（边际效应除外）", "块大小，块过大或过小都会降低命中率，需合理选择", "CPU的指令执行速度，速度越快，命中率越高", "", ""], "r": "ABC", "e": "Cache命中率受映射方式、容量、块大小影响，全相联映射命中率高，Cache容量大命中率通常高，块大小需合理选择；而CPU指令执行速度与Cache命中率无直接关联。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837491965952", "t": 3, "q": "在并行处理系统中，阿姆达尔定律表明，程序的加速比仅取决于并行部分的比例，与并行处理器数量无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "阿姆达尔定律指出，程序加速比受并行部分比例和并行处理器数量共同影响，并非仅取决于并行部分比例。", "ap": [false, false, false, false, false, false]}, {"id": "2034813837491965953", "t": 3, "q": "并行处理系统中，多处理器系统的性能一定优于单处理器系统，处理器数量越多，性能越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多处理器系统不一定性能就优于单处理器系统，还受任务特性、处理器间通信开销等影响。且处理器数量增多，若任务无法有效并行，还可能因通信等开销使性能变差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160256", "t": 3, "q": "在并行处理系统中，任务划分越细，并行度越高，系统性能越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "任务划分过细会导致任务管理开销大幅增加，可能抵消并行带来的性能提升，并非任务划分越细系统性能就越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160257", "t": 3, "q": "并行处理系统中，Amdahl定律表明，系统加速比的上限由程序的可并行化比例决定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Amdahl定律指出，系统加速比受限于程序中串行部分，可并行化比例越高，加速比上限越高，所以系统加速比上限由程序可并行化比例决定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160258", "t": 3, "q": "并行处理系统中，SIMD架构的多个处理单元可执行不同的指令，处理不同的数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "SIMD（单指令流多数据流）架构是多个处理单元执行相同指令、处理不同数据，并非执行不同指令，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160259", "t": 3, "q": "并行处理系统中的\"共享内存架构\"比\"分布式内存架构\"的编程难度低，因为前者可通过共享变量通信，后者需显式传递消息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "共享内存架构中进程可直接访问共享变量来通信，编程时无需过多考虑消息传递细节；分布式内存架构要显式传递消息，增加了编程复杂度。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160260", "t": 3, "q": "并行处理系统中的\"任务划分\"粒度越细，并行度越高，系统性能越好，因此任务划分应尽可能细。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "任务划分太细会使任务管理开销大幅增加，可能导致系统性能下降，并非越细越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160261", "t": 3, "q": "在并称处理系统中的\"SMP\"（对称多处理器）架构中，各处理器地位平等，均可访问共享主存和I/O设备，且通常运行同一操作系统。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "SMP架构特点就是各处理器地位平等，能共享主存和I/O设备，一般运行同一操作系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160262", "t": 3, "q": "在并行处理中，数据并行是指将多个不同的任务分配给多个处理器执行，而任务并行则是指将相同的任务分配给多个处理器处理不同数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "表述内容中数据并行和任务并行的定义弄反了，正确的是数据并行是将相同任务分配给多个处理器处理不同数据，任务并行是将多个不同任务分配给多个处理器执行。", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160263", "t": 3, "q": "并行系统中，共享内存多处理器系统的各处理器通过私有缓存访问共享内存，不会产生缓存一致性问题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在共享内存多处理器系统里，各处理器通过私有缓存访问共享内存时，由于不同处理器缓存对同一内存数据的操作可能不同步，会产生缓存一致性问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160264", "t": 3, "q": "并行系统中，任务调度的目标是将任务合理分配给处理器，使系统负载均衡，提高整体处理效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "并行系统里，任务调度就是要把任务合理安排到处理器上，实现系统负载均衡，从而提升整体处理效率，该描述与任务调度目标相符。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160265", "t": 3, "q": "存储系统的\"层次结构\"从高层到低层（如Cache→主存→硬盘），容量逐渐增大，速度逐渐降低，单位存储成本逐渐降低，该结构设计依据是程序的局部性原理。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "存储系统层次结构特点就是高层到低层容量增大、速度降低、单位成本降低，其设计依据正是程序局部性原理，能让频繁访问的数据存于高速层，提高整体性能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160266", "t": 3, "q": "存储系统中，虚拟存储器的核心思想是将硬盘等辅助存储器作为内存的扩展，为用户提供比实际内存更大的地址空间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "虚拟存储器就是把硬盘等辅助存储器当作内存扩展，让用户能使用比实际内存大的地址空间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160267", "t": 3, "q": "存储系统中，主存的存取周期是指从发出读写请求到完成数据读写所需的时间，通常等于主存的访问时间。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "主存存取周期指连续两次独立的存取操作所需的最小时间间隔，而访问时间是从发出读写请求到完成数据读写所需时间，二者概念不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160268", "t": 3, "q": "存储系统中，Cache的命中率随Cache容量的增大而单调递增，容量越大命中率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "Cache命中率并非随其容量增大单调递增，存在边际效应，当容量达到一定程度后，命中率提升会变缓甚至不再提升。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160269", "t": 3, "q": "存储系统中，Cache的写回策略是指当CPU写入Cache时，同时写入主存，确保Cache与主存数据一致;写透策略是指仅写入Cache，待Cache块替换时再写入主存。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "说法中写回和写透策略定义弄反了。写回策略是仅写入Cache，待Cache块替换时再写入主存；写透策略是当CPU写入Cache时，同时写入主存，确保Cache与主存数据一致。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160270", "t": 3, "q": "存储系统中，DRAM（动态RAM）的存储速度比SRAM（静态RAM）快，且集成度更高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "SRAM速度比DRAM快，DRAM集成度比SRAM高，题干说DRAM速度比SRAM快错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160271", "t": 3, "q": "存储总线的\"猝发传输\"技术通过一次地址传输，可连续传输多个数据块，该技术主要用于提高总线的传输效率，减少总线传输次数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "猝发传输确实是一次地址传输后连续传多个数据块，能提升总线传输效率、减少传输次数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160272", "t": 3, "q": "存储总线中，总线带宽是指总线在单位时间内可传输的数据量，其计算公式为总线带宽=总线宽度×总线频率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该说法正确。总线带宽体现总线单位时间传输数据量，总线宽度决定一次能传输的数据位数，总线频率反映总线传输的速度，二者相乘可得到总线带宽，所以公式“总线带宽 = 总线宽度×总线频率”是对的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160273", "t": 3, "q": "定点二进制补码运算中，两个负数相加，若结果为正数，则说明发生了溢出。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在二进制补码运算里，负数补码最高位是1。两负数相加结果应为负数，若为正数（最高位是0），就表明超出了表示范围，即发生溢出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160274", "t": 3, "q": "定点二进制补码中，零的表示是唯一的，即全0。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160275", "t": 3, "q": "定点小数补码的表示范围是-1≤X<1。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "定点小数补码中，当符号位为 1，其余位全为 0 时表示 -1；符号位为 0 时能表示最大正数趋近于 1 但小于 1，所以范围是 -1≤X<1。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160276", "t": 3, "q": "定点小数运算中，采用截断法进行舍入时，会导致运算结果产生负误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "截断法是直接舍去多余位，使数值变小。对于定点小数，结果比准确值小，产生的误差为负误差。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160277", "t": 3, "q": "定点整数运算中，最高位产生进位就说明发生了溢出。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在定点整数运算里，最高位产生进位不一定意味着溢出，需根据符号位变化判断，如无符号数最高位进位是正常借位和进位情况，不是溢出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160278", "t": 3, "q": "分布式处理系统与并行处理系统的主要区别在于:分布式系统中各节点地理分布分散，而并行系统中各处理器集中，两者的通信延迟和可靠性无差异。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分布式处理系统和并行处理系统不仅在节点地理分布上有差异，通信延迟和可靠性也不同。分布式系统因节点分散通信延迟大、可靠性受节点和网络状况影响；并行处理系统处理器集中通信延迟小、可靠性相对高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160279", "t": 3, "q": "分布式处理系统中，分布式锁的主要作用是解决多个节点对共享资源的并发访问冲突，确保数据一致性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在分布式处理系统里，多个节点会同时访问共享资源，易产生并发访问冲突，分布式锁能保证同一时刻只有一个节点可访问共享资源，进而确保数据一致性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160280", "t": 3, "q": "在分布式处理系统中，任务划分的粒度越小，并行度越高，系统的整体性能越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "任务划分粒度小虽能提高并行度，但会增加任务调度和管理开销，当开销超过并行带来的性能提升时，系统整体性能反而下降。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160281", "t": 3, "q": "分布式文件系统（如HDFS）通常采用主从架构，主节点（NameNode）存储文件元数据，从节点（DataNode）存储实际数据块，且数据块会冗余存储以提高可靠性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "HDFS是典型的分布式文件系统，采用主从架构，NameNode负责管理文件元数据，DataNode存储实际数据块，同时为保证数据可靠性会进行冗余存储。", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160282", "t": 3, "q": "分布式系统中，数据分片后，各分片必须由同一个节点进行管理，以保证数据一致性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分布式系统数据分片后，各分片可由不同节点管理，不同节点协同工作来保证数据一致性，并非必须由同一个节点管理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160283", "t": 3, "q": "分布式系统中，位置透明性意味着用户无需知道数据的分片方式，只需通过逻辑地址访问数据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160284", "t": 3, "q": "分布式系统中，远程过程调用（RPC）可使远程过程调用像本地调用一样简单，无需关注网络通信细节。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RPC 的核心特点就是让调用远程过程如同调用本地过程，隐藏了网络通信等复杂细节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160285", "t": 3, "q": "分布式系统中，CAP定理指出，系统可同时满足一致性（C）、可用性（A）和分区容错性（P）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "CAP定理表明，一个分布式系统最多只能同时满足一致性（C）、可用性（A）和分区容错性（P）中的两项，而不能同时满足三项。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160286", "t": 3, "q": "分布式系统中，CAP理论中的一致性（Consistency）是指所有节点在同一时间看到的数据是一致的，可用性（Availability）是指系统在任何时候都能响应客户端请求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这准确阐述了CAP理论中一致性和可用性的定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160287", "t": 3, "q": "分布式系统中，Paxos算法可保证在存在故障节点的情况下，仍能达成数据一致性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Paxos算法是一种用于在分布式系统中达成共识的经典算法，它具备在部分节点出现故障（如节点崩溃、网络分区等）的情况下，依然能保证系统中各个节点对某个值达成一致，从而保证数据一致性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160288", "t": 3, "q": "分布式系统中的\"最终一致性\"模型允许短期内不同节点的数据不一致，但经过一段时间后，所有节点的数据会自动达到一致状态，适用于对一致性要求不高的场景（如社交软件消息）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最终一致性特点就是短期内节点数据可能不一致，一段时间后自动达成一致，社交软件消息这类场景对实时一致性要求不高，适合用最终一致性模型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160289", "t": 3, "q": "分布式系统中的\"CAP定理\"表明，一个分布式系统可以同时满足一致性（Consistency）、可用性（Availability）和分区容错性（Partition Tolerance）三个特性，只需合理设计架构。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "CAP定理指出，一个分布式系统不可能同时满足一致性、可用性和分区容错性这三个特性，最多只能同时满足其中两个。", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160290", "t": 3, "q": "冯·诺依曼体系结构的核心特征是\"存储程序\"和\"程序控制\"，即程序和数据均以二进制形式存储在同一存储器中，CPU按程序指令顺序执行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冯·诺依曼体系结构的确以“存储程序”和“程序控制”为核心特征，程序和数据都以二进制形式存于同一存储器，CPU按程序指令顺序执行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160291", "t": 3, "q": "计算机存储系统中，主存的存取速度比辅助存储器快，但容量比辅助存储器小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "主存直接与CPU进行数据交换，存取速度快，但成本高，所以容量相对小；辅助存储器用于长期大量存储数据，存取速度慢但容量大。", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160292", "t": 3, "q": "计算机存储系统中，Cache与主存的地址映射方式中，全相联映射的Cache空间利用率最高，冲突最少。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160293", "t": 3, "q": "计算机体系结构中，冯·诺依曼结构的特点是程序和数据存储在同一存储器中，按地址访问。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冯·诺依曼结构的重要特点就是程序和数据存于同一存储器，且按地址访问。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160294", "t": 3, "q": "计算机体系结构中，冯·诺依曼体系的计算机必须采用二进制表示数据和指令，且程序和数据存储在同一存储器中。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冯·诺依曼体系的特点就是采用二进制表示数据和指令，同时程序和数据存于同一存储器。", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160295", "t": 3, "q": "计算机体系结构中的\"阿姆达尔定律\"指出，系统加速比主要取决于程序中的串行部分比例，即使增加无限多的处理器，加速比也不会超过1/串行比例。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "阿姆达尔定律表明系统加速比受程序中串行部分比例制约，增加处理器数量时，加速比上限是 1 除以串行部分比例。", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160296", "t": 3, "q": "计算机系统的\"中断优先级\"是固定不变的，由硬件设计决定，软件无法修改不同中断源的优先级顺序。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "计算机系统中，中断优先级并非固定不变，有些系统允许通过软件对不同中断源的优先级顺序进行修改。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160297", "t": 3, "q": "计算机系统的\"I/O接口\"仅负责数据的传输，不参与数据的缓冲、格式转换和状态检测等功能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "I/O接口不仅负责数据传输，也会进行数据缓冲、格式转换和状态检测等功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160298", "t": 3, "q": "计算机系统基础中，操作系统的核心态与用户态的切换需通过执行特权指令实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "操作系统核心态与用户态切换确实要执行特权指令。从用户态到核心态，通常是通过中断、异常等引发，执行特权指令实现状态转变；从核心态到用户态也需执行特权指令恢复用户态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160299", "t": 3, "q": "计算机系统中，虚拟内存的容量等于物理内存容量与辅助存储器容量之和。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虚拟内存容量受限于计算机地址结构，并非物理内存与辅助存储器容量之和。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160300", "t": 3, "q": "计算机系统中，硬件抽象层（HAL）的作用是屏蔽不同硬件的差异，为操作系统提供统一的硬件访问接口，便于操作系统移植。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "硬件抽象层（HAL）的确可屏蔽不同硬件差异，给操作系统提供统一硬件访问接口，极大方便了操作系统在不同硬件平台上的移植。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160301", "t": 3, "q": "计算机总线的带宽是指总线每秒传输的数据量，等于总线宽度与总线频率的乘积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "计算机总线带宽的定义就是总线每秒传输的数据量，其计算方式确实是总线宽度与总线频率的乘积。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160302", "t": 3, "q": "计算机总线中，同步总线的传输速度高于异步总线，因此所有计算机系统都采用同步总线。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然同步总线传输速度高，但异步总线有其优势，如能适应不同速度设备，并非所有计算机系统都采用同步总线。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160303", "t": 3, "q": "计算机总线中，总线仲裁的目的是确定总线的传输速率，确保数据传输稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "总线仲裁的目的是解决多个设备同时竞争总线使用权的问题，而不是确定总线传输速率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160304", "t": 3, "q": "计算机组成与计算机体系结构是同一概念，均研究计算机硬件的具体实现细节，如ALU的电路设计、Cache的替换算法等。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "计算机组成和计算机体系结构并非同一概念。体系结构主要关注计算机的抽象属性，如指令集架构等；而计算机组成侧重于硬件的具体实现细节。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160305", "t": 3, "q": "计算机I/O接口中的数据寄存器用于存放CPU与I/O设备之间传输的数据，其内容可被CPU和I/O设备读写。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据寄存器是I/O接口中用于暂存CPU与I/O设备间传输数据的部件，CPU可对其读写，I/O设备也能与之交互数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160306", "t": 3, "q": "计算机I/O控制方式中，程序查询方式的硬件结构简单，但CPU利用率低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "程序查询方式是CPU主动查询外设状态，在查询过程中CPU一直等待，无法做其他事，硬件只需简单电路来实现查询逻辑，所以硬件结构简单但CPU利用率低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160307", "t": 3, "q": "计算机I/O系统中，DMA方式下，数据传输过程完全无需CPU参与。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "DMA方式下，在数据传输阶段无需CPU参与，但在传输前后，如初始化、结束处理等仍需CPU干预。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160308", "t": 3, "q": "数据表示与运算中，8位二进制补码的表示范围是-127~+127。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "8位二进制补码中，正数范围是00000000到01111111（对应十进制0到127），负数范围是10000000到11111111，其中10000000表示 -128 ，所以8位二进制补码表示范围是 -128 到 +127 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160309", "t": 3, "q": "数据表示中，浮点数的阶码决定了浮点数的表示范围，尾数决定了浮点数的表示精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "浮点数 = 尾数 × 2^ 阶码。阶码位数决定数值表示范围，阶码越大可表示绝对值更大的数；尾数位数决定精度，尾数位数越多，有效数字位数越多，精度越高。", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160310", "t": 3, "q": "数据表示中，字符的ASCII码是7位二进制编码，可表示128个不同字符，其中包含大小写字母、数字、标点符号等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "ASCII码用7位二进制编码，确实能表示128个不同字符，涵盖了大小写字母、数字、标点符号等。", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160311", "t": 3, "q": "数据表示中，BCD码是用4位二进制数表示1位十进制数，且每4位之间相互独立，进位不跨越。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "BCD码就是用4位二进制数表示1位十进制数，各位之间相互独立，进位不跨越。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813837496160312", "t": 3, "q": "数据的\"补码\"表示中，0的表示是唯一的，仅存在\"+0\"，不存在\"-0\"，而原码和反码中0的表示是不唯一的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在补码表示中，0 有唯一表示；原码和反码里 0 有两种表示（+0 和 -0）。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 计算机组成与体系结构（2）", "n": "基础练习题【含解析】 / 第5章 计算机组成与体系结构（2）", "qs": [{"id": "2034813842063757312", "t": 1, "q": "在并行系统中，某多处理器系统采用共享内存架构，各处理器通过总线访问共享内存，当多个处理器同时写入同一内存单元时，会产生的问题是", "a": ["缓存一致性问题", "死锁问题", "数据竞争问题", "总线争用问题", "", ""], "r": "C", "e": "多个处理器同时写入同一内存单元，会因对同一数据的并发访问导致数据不一致，即数据竞争问题。缓存一致性是关于缓存与内存数据同步；死锁是资源循环等待；总线争用是多个设备竞争总线使用权。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757313", "t": 1, "q": "在存储系统中，下列关于DRAM（动态随机存取存储器）和SRAM（静态随机存取存储器）的区别描述中，错误的是", "a": ["DRAM的集成度更高，SRAM的集成度更低", "DRAM的读写速度更快，SRAM的读写速度更慢", "DRAM需定期刷新，SRAM无需刷新", "DRAM的功耗更低，SRAM的功耗更高", "", ""], "r": "B", "e": "SRAM读写速度比DRAM快，B选项描述错误；DRAM集成度高、需定期刷新、功耗低，SRAM集成度低、无需刷新、功耗高，A、C、D选项描述正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757315", "t": 1, "q": "在存储系统中，Cache与主存采用组相联映射方式，Cache分为8组，每组2块，主存容量为16KB，Cache容量为2KB，块大小为128B。若主存地址为1234H，则该地址映射到Cache的组号是？", "a": ["(1234H>>6) & 0x07", "(1234H>>9) & 0x07", "(1234H>>8) & 0x07", "(1234H>>7) & 0x07", "", ""], "r": "B", "e": "<br />给定的主存地址1234H转换为二进制是1001000110100，其中低7位为块内偏移，中间3位代表组索引，计算组索引时应该右移7+3=10位，并保留最后3位。因此正确的选项是B。(1234H>>9) & 0x07。<br />选项分析:<br />A.右移位数过少，未正确对齐组索引位。<br />C.右移位数过多，跳过了部分组索引位。<br />D.右移位数不准确，导致组索引位错位。", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757316", "t": 1, "q": "在存储总线中，\"猝发传输\"（Burst Transfer）技术的主要作用是？", "a": ["降低总线功耗，通过减少总线信号翻转次数，延长设备续航", "减少总线传输次数，通过一次地址传送后续连续数据，提高传输效率", "提高总线可靠性，通过增加校验位，减少数据传输错误", "增加总线带宽，通过提高总线时钟频率，减少数据传输延迟", "", ""], "r": "B", "e": "猝发传输是在一次地址传送后连续进行数据传输，能减少总线传输次数，进而提高传输效率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757317", "t": 1, "q": "在存储总线中，下列关于同步总线和异步总线的区别描述中，正确的是", "a": ["同步总线的传输效率更高，异步总线的传输效率更低", "同步总线适用于短距离传输，异步总线适用于长距离传输", "同步总线需使用握手信号，异步总线无需握手信号", "同步总线的传输速率固定，异步总线的传输速率可变", "", ""], "r": "D", "e": "同步总线有统一时钟，传输速率固定；异步总线无统一时钟，速率可变。A选项，异步总线在复杂场景效率可能高；B选项，同步总线适长适短要看具体情况；C选项，异步总线需握手信号。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757318", "t": 1, "q": "在定点二进制补码运算中，已知X=-0.1011，Y=0.0110，执行X+Y运算后，结果的溢出标志（OF）和进位标志（CF）分别为？", "a": ["OF=1，CF=0", "OF=0，CF=1", "OF=1，CF=1", "OF=0，CF=0", "", ""], "r": "D", "e": "先将X、Y转换为补码形式相加，两数符号不同，相加不会溢出，OF = 0；计算中无最高位向更高位的进位，CF = 0。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757319", "t": 1, "q": "在定点小数运算中，已知X=0.1001，Y=-0.0101，采用补码一位乘法计算X×Y，运算过程中部分积的初始值应为？", "a": ["0.1001", "1.0000", "1.0111", "0.0000", "", ""], "r": "D", "e": "补码一位乘法中，部分积初始值为0，即0.0000。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757320", "t": 1, "q": "在分布式处理系统中，“远程过程调用（RPC）”的核心作用是？", "a": ["使远程计算机上的过程调用像本地调用一样简单", "实现分布式文件的共享", "解决分布式系统中的数据一致性问题", "提高分布式系统的网络传输速率", "", ""], "r": "A", "e": "RPC 主要目的是让调用远程计算机上的过程如同调用本地过程一样，屏蔽了调用过程中的网络通信细节。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757321", "t": 1, "q": "在分布式处理系统中，下列关于分布式文件系统（DFS）的描述中，错误的是", "a": ["将文件数据分散存储在多个节点，提高存储可靠性", "需通过分布式锁机制解决文件并发访问冲突", "文件访问延迟比本地文件系统更低", "支持跨节点文件访问，对用户透明", "", ""], "r": "C", "e": "分布式文件系统数据分散存储能提高可靠性，需分布式锁解决并发访问冲突，支持跨节点访问且对用户透明。但因网络传输等因素，文件访问延迟通常比本地文件系统高。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757322", "t": 1, "q": "在分布式系统中，\"CAP定理\"指出一个分布式系统不可能同时满足三个特性，这三个特性是？", "a": ["一致性（Consistency）、可用性（Availability）、分区容错性（Partition Tolerance）", "可用性（Availability）、可扩展性（Scalability）、可靠性（Reliability）", "一致性（Consistency）、可用性（Availability）、可靠性（Reliability）", "一致性（Consistency）、可扩展性（Scalability）、分区容错性（Partition Tolerance）", "", ""], "r": "A", "e": "CAP定理指的就是分布式系统中一致性、可用性、分区容错性不能同时满足。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757323", "t": 1, "q": "在冯·诺依曼体系结构中，计算机硬件系统的五大基本部件存在特定的数据流向关系。下列关于\"程序指令从存储器到运算器\"的传递路径，正确的是？", "a": ["存储器→数据总线→控制器→运算器", "存储器→数据总线→控制器→指令寄存器→运算器", "存储器→数据总线→指令寄存器→运算器", "存储器→地址总线→控制器→运算器", "", ""], "r": "C", "e": "答案：C在冯·诺依曼体系结构中，程序指令从存储器到运算器的传递路径是：存储器→数据总线→指令寄存器→运算器。具体来说，指令从存储器中读取出来，通过数据总线传输到指令寄存器，然后再传送到运算器进行执行。因此，选项C是正确的。", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757324", "t": 1, "q": "在计算机体系结构中，\"冯·诺依曼瓶颈\"指的是？", "a": ["运算器与控制器之间的控制信号传输延迟，导致指令执行效率降低", "CPU与存储器之间的数据传输速率远低于CPU运算速率，导致CPU经常等待数据", "I/O设备与存储器之间的传输速率不匹配，导致数据积压", "多处理器之间的总线竞争，导致总线带宽无法满足所有处理器需求", "", ""], "r": "B", "e": "冯·诺依曼结构中，CPU与存储器间数据传输速率远低于CPU运算速率，使CPU常等数据，这就是“冯·诺依曼瓶颈”。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757325", "t": 1, "q": "在计算机体系结构中，冯·诺依曼体系的核心特征是", "a": ["采用Cache存储系统", "采用存储程序控制", "采用指令流水线技术", "采用并行处理技术", "", ""], "r": "B", "e": "冯·诺依曼体系核心是存储程序控制，即将程序和数据存储在计算机内部，计算机按照程序规定的顺序自动执行。Cache存储系统、指令流水线技术、并行处理技术都不是其核心特征。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757326", "t": 1, "q": "在计算机体系结构中，某流水线处理器有4个功能段，各功能段的执行时间分别为t1=2ns，t2=3ns，t3=2ns，t4=3ns。若连续处理10条指令，不考虑流水线阻塞，该流水线的吞吐率（单位:指令/ns）最接近以下哪个值？", "a": ["0.25", "0.4", "0.33", "0.5", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757327", "t": 1, "q": "在计算机体系结构中，某指令系统采用RISC（精简指令集计算机）设计风格，下列关于该指令系统的描述中，正确的是", "a": ["大部分指令可在一个时钟周期内完成执行", "指令长度不固定，可根据需求灵活调整", "支持多种复杂寻址方式，寻址范围广", "指令数量多，指令格式复杂", "", ""], "r": "A", "e": "RISC特点是指令简单、执行快。A选项，大部分指令能在一个时钟周期完成执行，符合RISC执行高效特点；B选项，RISC指令长度固定；C选项，RISC寻址方式简单；D选项，RISC指令数量少、格式简单。所以答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757328", "t": 1, "q": "在计算机系统基础中，下列关于操作系统与硬件交互的描述中，需通过特权指令实现的是", "a": ["设置中断屏蔽字", "读取键盘输入数据", "将内存数据写入磁盘", "显示字符到屏幕", "", ""], "r": "A", "e": "特权指令是指仅能由操作系统内核使用的指令，用于控制硬件的关键操作。设置中断屏蔽字涉及到对系统中断机制的控制，属于特权操作，需通过特权指令实现。而读取键盘输入、内存数据写入磁盘、显示字符到屏幕等普通I/O操作，一般通过系统调用等方式完成，并非特权指令。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757329", "t": 1, "q": "在计算机总线中，“总线仲裁”的主要目的是？", "a": ["解决多个设备同时请求使用总线的冲突", "检测总线传输中的错误", "确定总线的传输速率", "转换总线传输的数据格式", "", ""], "r": "A", "e": "当多个设备同时请求使用总线时，会产生冲突，总线仲裁就是为了解决此冲突，确定哪个设备优先使用总线。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757330", "t": 1, "q": "在计算机组成中，控制单元（CU）的主要功能是", "a": ["执行算术和逻辑运算", "存储程序和数据", "实现CPU与外部设备的数据交换", "产生指令执行所需的控制信号", "", ""], "r": "D", "e": "控制单元（CU）主要职责是产生指令执行所需控制信号，协调各部件工作。A是运算器功能；B是存储器功能；C是接口等的功能。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757331", "t": 1, "q": "在计算机I/O系统中，DMA控制器与CPU分时使用总线的方式称为\"周期挪用\"，以下关于\"周期挪用\"的说法正确的是？", "a": ["适用于高速I/O设备与内存之间的大量数据传输", "仅在DMA控制器需要传输数据时才占用总线", "会使CPU的运算效率大幅下降", "必须在CPU执行完一条完整指令后才能挪用总线", "", ""], "r": "B", "e": "“周期挪用”是DMA控制器在需要传输数据时才占用总线，不传输时总线仍由CPU使用。A选项，“周期挪用”适用于低速设备；C选项，它不会使CPU运算效率大幅下降；D选项，DMA可在CPU空闲时挪用总线，不一定要等CPU执行完一条完整指令。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757332", "t": 1, "q": "在数据表示中，\"BCD码\"（二进制编码的十进制数）与二进制数的主要区别是？", "a": ["BCD码用4位二进制表示1位十进制数，而二进制数直接使用其自身的位数来表示数值。", "BCD码的运算规则与十进制数完全相同，而二进制数需遵循二进制的运算规则进行计算。", "BCD码仅能用于表示整数，但二进制数不仅可以表示整数还能准确地表示小数部分。", "相较于二进制数，BCD码能够表示更大的十进制数值范围。", "", ""], "r": "A", "e": "BCD码是用4位二进制表示1位十进制数，二进制数直接用自身位数表示数值，这是二者主要区别。B项BCD码运算规则并非与十进制完全相同；C项BCD码也可表示小数；D项二进制数表示范围通常更大。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757333", "t": 1, "q": "在数据表示中，某计算机采用BCD码存储十进制数，若存储数字\"58\"，则对应的BCD码为", "a": ["01011000B", "0011010100111000B", "1011000B", "001101011000B", "", ""], "r": "A", "e": "BCD码用4位二进制数表示1位十进制数，“5”的BCD码是0101，“8”的BCD码是1000，所以“58”的BCD码是01011000B。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757334", "t": 1, "q": "在数据表示中，下列关于无符号数和有符号数（补码）的描述中，正确的是", "a": ["无符号数的最高位是数值位，有符号数的最高位是符号位", "8位无符号数的表示范围是0~255，8位有符号数的表示范围是-128~127", "无符号数和有符号数的减法均需用补码实现", "无符号数的加法不会产生进位，有符号数的加法会产生溢出", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757335", "t": 1, "q": "在数据运算中，“溢出”是指运算结果超出了数据类型的表示范围。对于两个n位补码整数a和b（a>0，b>0），下列关于加法溢出的判断，正确的是？", "a": ["若a+b的最高数值位进位与符号位进位不同，则发生溢出", "若a+b的符号位为1，则一定发生正溢出", "若a的符号位与b的符号位相同，则一定不会发生溢出", "若a+b的结果大于2^(n-1)-1，则一定发生正溢出", "", ""], "r": "A", "e": "在补码加法运算中，判断溢出的方法是最高数值位进位与符号位进位不同时发生溢出。B选项，符号位为1不一定是正溢出；C选项，a、b符号位相同可能溢出；D选项，结果大于「test/yiwen_img/importSubject/2034813838259523584.png」不能简单判定溢出，还需考虑数据表示。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757336", "t": 1, "q": "在数据运算中，\"Booth算法\"主要用于？", "a": ["二进制补码的乘法运算，通过减少加法次数提高运算效率", "二进制数的除法运算，通过迭代方式逐步求得商和余数", "浮点数的加减运算，处理阶码和尾数的对齐问题", "十进制数与二进制数的转换，简化转换过程", "", ""], "r": "A", "e": "Booth算法是用于二进制补码乘法的算法，其核心优势是能减少加法次数来提升运算效率。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757337", "t": 1, "q": "在数据运算中，以下关于\"溢出\"的判断方法，错误的是？", "a": ["定点运算中，只要最高位产生进位，就说明发生溢出", "定点小数减法中，若被减数为负数、减数为正数，结果为正数，则发生溢出", "采用双符号位补码时，若运算结果的两个符号位不同，则发生溢出", "定点整数加法中，若两个正数相加结果为负数，则发生溢出", "", ""], "r": "A", "e": "定点运算中，仅最高位产生进位不能判定溢出，如无符号数相加进位是正常结果。B选项情况结果应为负，得正就溢出；C选项双符号位不同表示溢出；D选项两正数相加得负也是溢出。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757338", "t": 1, "q": "在微处理器接口技术中，采用DMA（直接存储器访问）方式实现I/O数据传输时，DMA控制器与微处理器的关系是", "a": ["DMA控制器仅能实现I/O设备与内存之间的单向数据传输", "DMA控制器需等待微处理器执行完当前指令后才能启动传输", "DMA传输过程中，微处理器需持续参与数据的读写控制", "DMA控制器在传输期间接管微处理器的地址总线和数据总线", "", ""], "r": "D", "e": "DMA传输时，DMA控制器会接管微处理器的地址总线和数据总线，直接在I/O设备与内存间传输数据，无需CPU持续参与。A项可双向传输；B项DMA可在合适时机直接启动，不用等当前指令执行完；C项传输时CPU不持续参与。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757339", "t": 1, "q": "在微处理器接口中，采用可编程接口芯片（如8255A）实现并行I/O时，芯片的控制寄存器用于", "a": ["存储CPU发送给I/O设备的数据", "存储I/O设备发送给CPU的数据", "存储CPU对芯片的初始化控制字", "存储I/O设备的状态信息", "", ""], "r": "C", "e": "可编程接口芯片的控制寄存器主要是用来存储CPU对芯片的初始化控制字，以设定芯片的工作方式等。A选项存储CPU给I/O设备数据的是数据输出寄存器；B选项存储I/O设备给CPU数据的是数据输入寄存器；D选项存储I/O设备状态信息的是状态寄存器。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757340", "t": 1, "q": "在微处理器原理中，某8位微处理器的标志寄存器包含进位标志CF、零标志ZF、符号标志SF、溢出标志OF。执行指令\"SUB A,#30H\"（A中初始值为10H）后，各标志位的状态为", "a": ["CF=0，ZF=0，SF=1，OF=0", "CF=1，ZF=0，SF=0，OF=1", "CF=1，ZF=0，SF=1，OF=0", "CF=0，ZF=0，SF=1，OF=1", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757341", "t": 1, "q": "在微处理器中，程序计数器（PC）的作用是", "a": ["存储当前指令的操作数地址", "存储下一条要执行指令的地址", "存储当前正在执行指令的地址", "存储当前指令的操作码", "", ""], "r": "B", "e": "程序计数器（PC）用于存放下一条要执行指令的地址，以保证程序能按顺序执行。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757342", "t": 1, "q": "在指令流水线中，“数据相关”是导致流水线阻塞的常见原因，以下哪种技术不能解决数据相关问题？", "a": ["插入空操作（NOP）", "编译器优化指令调度", "定向（旁路）技术", "分支预测技术", "", ""], "r": "D", "e": "插入空操作可暂停流水线等待数据准备好；编译器优化指令调度能调整指令顺序避免数据相关；定向技术可直接将数据从产生处送到需要处解决相关。而分支预测技术主要用于解决分支指令带来的控制相关，并非数据相关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757343", "t": 1, "q": "在指令流水线中，\"数据相关\"是导致流水线阻塞的常见原因。下列关于数据相关的解决方法，错误的是？", "a": ["插入空操作（NOP）指令，等待数据生成后再继续执行", "采用定向传送技术，将运算结果直接传送到需要该数据的流水线阶段", "通过编译器优化指令顺序，将无关指令插入数据相关指令之间", "增大Cache容量，减少因数据缺失导致的数据相关", "", ""], "r": "D", "e": "数据相关是指后续指令要用到前面指令的结果。A 可让流水线等待数据；B 能快速提供数据；C 可调整指令顺序避免冲突。而增大 Cache 容量主要是减少 Cache 缺失，和数据相关并非直接关联。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757344", "t": 1, "q": "在指令系统设计中，\"立即寻址\"和\"直接寻址\"是两种常用寻址方式。下列关于两者的区别，说法错误的是？", "a": ["立即寻址无需访问存储器取操作数，直接寻址需1次访问存储器", "立即寻址的操作数直接在指令中，直接寻址的操作数地址在指令中", "立即寻址的指令长度与操作数位数无关，直接寻址的指令长度与地址码位数无关", "立即寻址的操作数不可修改，直接寻址的操作数可通过修改存储器单元更新", "", ""], "r": "C", "e": "立即寻址指令长度与操作数位数有关，因为操作数直接在指令中；直接寻址指令长度与地址码位数有关，地址码位数影响指令长度。所以C说法错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757345", "t": 1, "q": "在指令系统中，\"特权指令\"的主要特征是？", "a": ["仅能由特定处理器执行，多处理器系统中其他处理器无法执行", "执行速度比普通指令快，用于处理紧急任务", "指令长度比普通指令短，占用内存空间少", "仅能在操作系统内核态执行，用户态程序无法执行", "", ""], "r": "D", "e": "特权指令涉及系统的关键操作，为保证系统安全，只能在内核态由操作系统使用，用户态程序不能执行。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757346", "t": 1, "q": "在指令系统中，某指令的格式为\"OPCODE+寻址方式码+形式地址\"，该指令采用的寻址方式中，操作数的有效地址需通过形式地址与某个寄存器的内容相加得到，这种寻址方式是", "a": ["基址寻址", "寄存器寻址", "直接寻址", "立即寻址", "", ""], "r": "A", "e": "基址寻址是将形式地址与基址寄存器内容相加得到有效地址。寄存器寻址操作数在寄存器中；直接寻址有效地址就是形式地址；立即寻址操作数直接在指令中。所以符合描述的是基址寻址。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757347", "t": 1, "q": "在指令系统中，下列属于复合指令的是", "a": ["ADD（加法指令）", "MOV（数据传送指令）", "PUSH（栈操作指令）", "MUL（乘法指令）", "", ""], "r": "C", "e": "复合指令通常是指完成多个基本操作的指令。栈操作指令PUSH不仅是简单数据操作，还涉及栈指针的调整等多个操作，属于复合指令。而ADD、MOV、MUL主要是单一数据操作。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757348", "t": 1, "q": "在指令执行过程中，若某指令需要访问内存获取操作数，该过程对应的CPU周期是", "a": ["执行周期", "译码周期", "访存周期", "取指周期", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757349", "t": 1, "q": "在I/O传输中，中断驱动方式相比程序查询方式的主要优势是", "a": ["CPU利用率更高", "能完全脱离CPU控制进行数据传输", "传输速率显著提高", "所需硬件实现更简单", "", ""], "r": "A", "e": "程序查询方式CPU需不断查询I/O设备状态，浪费CPU时间；中断驱动方式是I/O设备准备好时向CPU发中断请求，CPU才处理，提高了CPU利用率。中断驱动也需CPU响应处理，并非完全脱离；传输速率主要与设备本身有关；中断驱动硬件更复杂。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757350", "t": 1, "q": "在I/O系统中，程序查询方式实现I/O传输时，下列关于CPU利用率的描述中，正确的是", "a": ["CPU利用率与外设传输速率成正比", "外设传输速率越低，CPU利用率越高", "CPU利用率与查询间隔时间成反比", "查询间隔时间越长，CPU利用率越高", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813842063757351", "t": 1, "q": "在I/O总线系统中，PCI Express（PCIe）总线采用串行传输方式，与传统的PCI总线（并行传输）相比，下列关于PCIe总线的优势描述中，错误的是", "a": ["抗干扰能力更强，减少信号串扰", "引脚数量更少，降低硬件设计复杂度", "支持热插拔和即插即用功能", "传输速率更高，支持多通道聚合带宽", "", ""], "r": "C", "e": "传统PCI也支持热插拔和即插即用功能，这并非PCIe相对于它的独特优势。而A选项，串行传输抗干扰强、减少串扰；B选项，串行传输引脚少，降低设计复杂度；D选项，PCIe支持多通道聚合提高带宽，传输速率更高，都是PCIe相对传统PCI的优势。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559296", "t": 2, "q": "在存储与总线I/O系统中，下列属于Cache替换算法的有（　）", "a": ["随机（Random）算法", "最不经常使用（LFU）算法", "先进先出（FIFO）算法", "最近最少使用（LRU）算法", "", ""], "r": "ABCD", "e": "Cache替换算法常见的有随机（Random）、最不经常使用（LFU）、先进先出（FIFO）、最近最少使用（LRU）算法。ABCD选项均符合。答案：ABCD <br />注:原题中的“页面全局置换（Global）算法”并不是典型的Cache替换算法，故未列入选项之中。", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559297", "t": 2, "q": "在存储总线中，下列属于总线传输周期的组成阶段有（　）", "a": ["数据传输阶段", "总线仲裁阶段", "总线释放阶段", "地址传输阶段", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559298", "t": 2, "q": "在定点二进制运算中，以下关于补码运算的规则，正确的有？（　）", "a": ["负数的补码等于其原码除符号位外按位取反加1", "零的补码表示是唯一的", "补码加法规则:[X+Y]补=[X]补+[Y]补", "补码运算中，符号位与数值位一同参与运算", "", ""], "r": "ABCD", "e": "A是负数补码求法，B零的补码唯一，C是补码加法规则，D补码运算符号位和数值位一起算，ABCD都对。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559299", "t": 2, "q": "在定点小数运算中，以下关于\"舍入\"方法的描述，正确的有？（　）", "a": ["舍入方法的选择会影响运算结果的精度", "截断法（恒舍法）是将超出字长的低位直接舍弃", "恒置1法是在保留位之后的最高位为1时，将保留的最低位始终置1", "0舍1入法的误差通常小于截断法", "", ""], "r": "ABD", "e": "舍入方法不同结果精度有别，截断法直接舍低位，0舍1入法误差一般小于截断法，而恒置1法是不管保留位之后最高位情况，直接将保留的最低位置1，C描述错误。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559300", "t": 2, "q": "在定点整数运算中，以下关于\"溢出\"的处理方式，正确的有？（　）", "a": ["可通过增加字长来避免溢出", "溢出发生时，可通过设置溢出标志位通知CPU", "所有指令执行时都会检测溢出", "溢出检测通常在加法和减法运算中进行", "", ""], "r": "ABD", "e": "增加字长能容纳更大数值避免溢出；溢出时设标志位可通知CPU；不是所有指令都检测溢出；溢出检测常见于加减法运算。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559301", "t": 2, "q": "在分布式文件系统中，下列属于其核心功能的有（　）", "a": ["跨节点的文件访问透明性", "文件的元数据管理", "文件的并发访问控制", "文件数据的冗余备份", "", ""], "r": "ABCD", "e": "分布式文件系统要让用户像访问本地文件一样访问不同节点文件，需有跨节点文件访问透明性；要管理文件的属性等信息，离不开文件元数据管理；为保证多用户操作文件不出错，要有并发访问控制；为防止数据丢失，需文件数据冗余备份。ABCD选项均是核心功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559302", "t": 2, "q": "在分布式系统中，实现\"数据一致性\"的协议或机制有（　）？", "a": ["最终一致性模型，允许短期内数据不一致，最终达到一致状态", "Paxos协议，用于分布式系统中达成数据一致性决策", "Raft协议，基于领导者选举的一致性协议，简化了Paxos的实现", "Two-Phase Commit（2PC）协议，用于分布式事务的一致性提交", "", ""], "r": "ABCD", "e": "A选项最终一致性是常见的数据一致性模型；B选项Paxos可在分布式系统做一致性决策；C选项Raft简化了Paxos实现；D选项2PC用于分布式事务一致性提交，ABCD都可实现数据一致性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559303", "t": 2, "q": "在分布式系统中，下列属于解决数据一致性问题的技术有（　）", "a": ["两阶段提交协议（2PC）", "三阶段提交协议（3PC）", "Raft算法", "哈希一致性算法", "", ""], "r": "ABC", "e": "2PC和3PC是经典的分布式事务一致性协议，Raft是用于管理分布式系统中日志复制和达成共识的算法，它们都可解决数据一致性问题。哈希一致性算法主要用于分布式系统的负载均衡，并非解决数据一致性问题。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559304", "t": 2, "q": "在计算机存储系统中，以下关于\"虚拟内存\"的描述，正确的有？（　）", "a": ["虚拟内存需借助磁盘等辅助存储器实现", "虚拟内存可使程序获得比实际物理内存更大的地址空间", "虚拟内存的实现需要操作系统的支持", "页面置换算法（如LRU）用于解决虚拟内存的页面缺失问题", "", ""], "r": "ABCD", "e": "虚拟内存是利用磁盘等辅助存储器来模拟内存，在操作系统支持下让程序有比实际物理内存大的地址空间，当出现页面缺失时用页面置换算法处理。ABCD选项描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559305", "t": 2, "q": "在计算机存储系统中，以下关于\"Cache写策略\"的描述，正确的有？（　）", "a": ["写分配（Write Allocate）策略是写操作缺失时，将主存块调入Cache后再写", "写直达（Write Through）策略是同时更新Cache和主存", "写回（Write Back）策略是仅更新Cache，当Cache块被替换时才更新主存", "非写分配（No-Write Allocate）策略是写操作缺失时，直接写主存，不调入Cache", "", ""], "r": "ABCD", "e": "本题主要考查Cache写策略的相关知识。写分配策略就是写操作缺失时先把主存块调入Cache再写；写直达策略要求同时更新Cache和主存；写回策略只更新Cache，等Cache块被替换时再更新主存；非写分配策略是写操作缺失时直接写主存，不调入Cache。ABCD四个选项的描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559306", "t": 2, "q": "在计算机存储系统中，以下属于DRAM芯片与SRAM芯片的区别的有？（　）", "a": ["DRAM功耗低于SRAM", "DRAM需要定期刷新，SRAM无需刷新", "DRAM集成度高于SRAM", "DRAM存取速度快于SRAM", "", ""], "r": "BC", "e": "DRAM需定期刷新，集成度高但速度慢、功耗低；SRAM无需刷新，速度快但集成度低、功耗高。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559307", "t": 2, "q": "在计算机体系结构中，下列属于流水线技术性能指标的有（　）", "a": ["周期", "效率", "级数", "加速比", "吞吐率", ""], "r": "ABCDE", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559308", "t": 2, "q": "在计算机体系结构中，下列属于CISC（复杂指令集计算机）特点的有（　）", "a": ["指令格式不统一，长度可变", "指令数量多，功能复杂", "大部分指令执行时间长", "支持多种复杂寻址方式", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559309", "t": 2, "q": "在计算机系统基础中，\"操作系统\"与\"计算机硬件\"的接口是（　）？", "a": ["指令系统，操作系统通过执行特权指令控制硬件资源", "设备驱动程序，操作系统通过驱动程序与具体硬件设备通信", "内存管理，操作系统通过内存管理机制分配和回收硬件内存", "系统调用，用户程序通过系统调用请求操作系统服务", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559310", "t": 2, "q": "在计算机系统基础中，下列属于CPU核心部件的有（　）", "a": ["控制单元（CU）", "指令寄存器（IR）", "算术逻辑单元（ALU）", "程序计数器（PC）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559311", "t": 2, "q": "在计算机系统基础中，以下关于\"流水线技术\"的描述，正确的有？（　）", "a": ["流水线技术可提高指令的并行执行程度", "流水线的加速比等于流水线完成任务的时间与串行完成时间的比值", "流水线的吞吐率与流水线周期成反比", "流水线的段数越多，其加速比一定越高", "", ""], "r": "AC", "e": "流水线技术能让指令并行执行，提高效率，A正确；加速比是串行完成任务时间与流水线完成任务时间的比值，B错误；吞吐率是单位时间完成的任务数，与流水线周期成反比，C正确；流水线段数过多会有额外开销，加速比不一定越高，D错误。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559312", "t": 2, "q": "在计算机系统中，下列属于系统软件与硬件交互的接口有（　）", "a": ["指令系统", "硬件抽象层（HAL）", "设备驱动程序", "系统调用接口", "", ""], "r": "BC", "e": "硬件抽象层（HAL）将硬件特性与操作系统隔离，是系统软件与硬件交互的接口；设备驱动程序负责让操作系统与硬件设备通信，也是系统软件和硬件交互的桥梁。指令系统是计算机硬件的语言系统，并非软件与硬件交互接口；系统调用接口是用户程序与操作系统内核交互的接口。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559313", "t": 2, "q": "在计算机组成与体系结构中，下列属于计算机体系结构范畴的描述有（　）", "a": ["CPU中寄存器的数量和类型", "数据通路的宽度和控制方式", "中断系统的优先级划分机制", "指令系统的指令格式和寻址方式", "", ""], "r": "ABCD", "e": "计算机体系结构研究计算机系统的概念性结构和功能特性。ABCD选项均涉及计算机系统的概念性结构和功能特性方面。A关乎CPU寄存器配置；B涉及数据通路设计；C属于中断系统机制；D是指令系统的关键内容。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559314", "t": 2, "q": "在计算机组成中，\"控制单元\"的设计方法包括（　）？", "a": ["软件控制，由软件程序生成控制信号，灵活性最高但速度最慢", "可编程逻辑控制，由FPGA等可编程器件实现，兼顾灵活性和速度", "微程序控制，由微程序实现，灵活性高但速度较慢", "硬布线控制，由组合逻辑电路实现，速度快但灵活性差", "", ""], "r": "ABCD", "e": "控制单元设计方法有硬布线控制，用组合逻辑电路实现，速度快但难修改；微程序控制靠微程序实现，灵活但速度慢；可编程逻辑控制用FPGA等，兼顾灵活与速度；软件控制由程序生成信号，灵活性高但速度慢。ABCD选项描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559315", "t": 2, "q": "在计算机组成中，运算器的核心部件ALU（算术逻辑单元）可执行的操作包括（　）？", "a": ["逻辑与、或、非、异或运算", "浮点数的加减乘除运算", "定点数的乘法和除法运算", "数据的移位操作（算术移位和逻辑移位）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559316", "t": 2, "q": "在计算机I/O系统中，以下关于\"中断向量\"的描述，正确的有？（　）", "a": ["中断向量是中断服务程序的入口地址", "不同的中断源对应不同的中断向量", "中断向量的地址称为中断向量号", "CPU响应中断后，会根据中断向量号查找中断向量表获取入口地址", "", ""], "r": "ABD", "e": "中断向量是中断服务程序的入口地址，不同中断源对应不同中断向量，CPU响应中断后按中断向量号查中断向量表得入口地址，而中断向量号是中断源的编号，不是中断向量的地址。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559317", "t": 2, "q": "在数据表示与运算中，下列关于浮点数运算误差的产生原因有（　）", "a": ["浮点数乘法中尾数相乘后的舍入误差", "十进制数转换为二进制浮点数时存在转换误差", "浮点数加法中对阶操作导致的尾数误差", "浮点数的阶码范围有限，存在溢出误差", "", ""], "r": "ABCD", "e": "浮点数运算误差产生原因多样，包括乘法尾数舍入、十进制转二进制误差、加法对阶尾数误差、阶码范围有限溢出等。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559318", "t": 2, "q": "在数据表示中，下列关于\"补码\"的说法正确的有（　）？", "a": ["n位补码的表示范围是-2<sup>(n-1)~2<\/sup>(n-1)-1", "补码的减法运算可转换为加法运算，即a-b=a+(-b)的补码", "补码的最高位为符号位，0表示正数，1表示负数", "正数的补码与原码、反码相同，负数的补码是其反码加1（符号位不变）", "", ""], "r": "ABCD", "e": "A选项，n位补码表示范围正确；B选项，补码减法能按此转换；C选项，补码最高位是符号位，规定也对；D选项，正数原码、反码、补码相同，负数补码是反码加1符号位不变也正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559319", "t": 2, "q": "在数据表示中，下列属于二进制数相比十进制数的优势有（　）", "a": ["存储密度高（相同位数表示范围大）", "抗干扰能力强（电平易区分）", "易于硬件实现（仅0和1）", "运算规则简单（加法仅3条规则）", "", ""], "r": "BCD", "e": "二进制只有0和1，电平容易区分所以抗干扰能力强；仅用0和1易于硬件实现；其加法运算规则简单；但相同位数下十进制表示范围更大，二进制存储密度低。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559320", "t": 2, "q": "在数据运算中，导致\"溢出\"的原因有（　）？", "a": ["两个正数相加，结果超出数据类型的最大正数范围", "一个正数与一个负数相加，结果一定不会溢出", "正数减去负数，结果等同于正数加正数，可能超出最大范围", "两个负数相加，结果超出数据类型的最小负数范围", "", ""], "r": "ACD", "e": "溢出指运算结果超出数据类型表示范围。A选项两正数相加可能超最大正数范围导致溢出；B选项一正一负相加可能溢出，该说法错误；C选项正减负相当于正加正，可能超最大范围导致溢出；D选项两负数相加可能超最小负数范围导致溢出。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559321", "t": 2, "q": "在数据运算中，下列关于补码运算的特点有（　）", "a": ["符号位与数值位一起参与运算", "0的表示唯一", "减法运算可转换为加法运算", "运算结果的符号位自动生成", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559322", "t": 2, "q": "在数据运算中，下列属于算术运算与逻辑运算的区别有（　）", "a": ["结果类型（数值/逻辑值）", "运算对象（数值/逻辑值）", "应用场景（数据计算/逻辑判断）", "进位处理（有/无）", "", ""], "r": "ABCD", "e": "算术运算对象是数值，结果是数值，用于数据计算且有进位处理；逻辑运算对象和结果是逻辑值，用于逻辑判断，无进位处理。ABCD四个选项都体现了二者区别。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559323", "t": 2, "q": "在微处理器接口技术中，\"中断向量\"的作用包括（　）？", "a": ["标识中断源的类型，区分不同设备的中断请求", "存储中断请求信号，记录是否有中断请求未处理", "存储中断服务程序的入口地址，便于CPU快速跳转", "存储中断优先级，用于中断判优", "", ""], "r": "AC", "e": "答案：AC中断向量主要包含两个方面的信息：一是中断源的类型或编号，这样 CPU 就能知道是哪个设备提出的中断请求；二是中断服务程序的入口地址，当 CPU 响应中断后能快速跳转到相应的处理程序去执行。B 选项中存储中断请求信号的不是中断向量，D 选项中中断优先级一般也不是由中断向量来直接存储用于判优的。所以答案是 AC 。", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559324", "t": 2, "q": "在微处理器接口技术中，下列属于并行接口与串行接口的区别特征有（　）", "a": ["适用传输距离（通常短/通常长）", "数据传输方式（并行/串行）", "引脚数量（多/少）", "抗干扰能力（通常弱/通常强）", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559325", "t": 2, "q": "在微处理器接口中，下列属于接口电路基本功能的有（　）", "a": ["设备状态检测与报告", "地址译码与选择", "中断请求与管理", "信号电平转换", "数据缓冲与锁存", ""], "r": "ABCDE", "e": "接口电路基本功能包括对设备状态检测报告、地址译码选择、中断请求管理、信号电平转换以及数据缓冲锁存。题中各选项均符合接口电路基本功能。答案选ABCDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559326", "t": 2, "q": "在微处理器接口中，下列属于中断处理过程的步骤有（　）", "a": ["中断服务程序的执行", "中断响应与断点保护", "中断源识别与中断服务程序入口寻找", "中断返回与断点恢复", "", ""], "r": "ABCD", "e": "中断处理过程一般包含中断响应与断点保护、中断源识别与中断服务程序入口寻找、执行中断服务程序、中断返回与断点恢复等步骤。ABCD四个选项均是中断处理过程的步骤。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559327", "t": 2, "q": "在微处理器原理中，下列属于微处理器工作模式的有（　）", "a": ["保护模式", "系统模式", "虚拟8086模式", "用户模式", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559328", "t": 2, "q": "在微处理器中，常用的寄存器包括（　）？", "a": ["程序计数器（PC），存储下一条要执行的指令地址", "通用寄存器（GPR），用于临时存储数据和地址", "栈指针寄存器（SP），存储栈顶的内存地址", "指令寄存器（IR），存储当前正在执行的指令", "", ""], "r": "ABCD", "e": "这几个选项描述的都是微处理器中常用寄存器的功能，ABCD选项所涉及的寄存器都是微处理器常用寄存器。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559329", "t": 2, "q": "在微处理器中，下列属于通用寄存器功能的有（　）", "a": ["存储操作数地址", "存储程序状态字", "作为计数器使用", "作为基址寄存器使用", "临时存放数据和指令", ""], "r": "ACDE", "e": "通用寄存器可用于临时存放数据、指令，还能存储操作数地址、作为计数器、基址寄存器使用。而程序状态字由专门的状态寄存器存储。答案选ACDE。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559330", "t": 2, "q": "在虚拟存储器中，下列属于页面置换算法的有（　）", "a": ["最近最少使用（LRU）算法", "最优（Optimal）算法", "时钟（Clock）算法", "最不经常使用（LFU）算法", "", ""], "r": "ABCD", "e": "以上选项均为常见的页面置换算法，LRU 基于最近使用情况，Optimal 是理论上的最优置换，Clock 是一种改进算法，LFU 依据使用频率。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559331", "t": 2, "q": "在指令格式设计中，需要考虑的因素有（　）？", "a": ["指令的长度，需平衡存储效率和执行速度（定长或变长）", "指令系统的功能需求，决定操作码的位数和指令类型", "寻址方式的种类，需在指令中分配字段表示寻址方式", "地址码的数量和位数，取决于操作数的个数和存储地址空间大小", "", ""], "r": "ABCD", "e": "指令格式设计需综合多方面考量。指令长度影响存储与执行；功能需求决定操作码；寻址方式需在指令体现；地址码和操作数、地址空间相关，ABCD选项均是要考虑的因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559332", "t": 2, "q": "在指令系统的应用分析中，下列指令操作需访问内存的有（　）", "a": ["基址寻址的取数指令", "直接寻址的数据传送指令", "立即寻址的加法指令", "寄存器间接寻址的减法指令", "相对寻址的跳转指令", ""], "r": "ABD", "e": "基址寻址、直接寻址、寄存器间接寻址都要访问内存获取操作数；立即寻址操作数在指令中，无需访存；相对寻址跳转指令主要是计算跳转地址，一般不访问内存取操作数。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559333", "t": 2, "q": "在指令系统中，下列属于指令操作码字段设计原则的有（　）", "a": ["唯一性（每个操作码对应唯一指令）", "扩展性（便于增加新指令）", "编码效率（减少操作码位数）", "可读性（便于程序员理解）", "", ""], "r": "ABC", "e": "指令操作码字段设计需保证每个操作码对应唯一指令，有扩展性以便新增指令，同时要考虑编码效率减少位数。而可读性主要针对程序员对指令功能理解，并非操作码字段设计原则。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559334", "t": 2, "q": "在指令执行中，下列属于影响指令执行时间的因素有（　）", "a": ["操作数的存储位置", "流水线的级数", "CPU的时钟频率", "指令的复杂程度", "", ""], "r": "ABCD", "e": "操作数存储位置影响数据读取时间，流水线级数影响指令并行执行效率，CPU时钟频率决定指令执行速度，指令复杂程度也会影响执行时间。ABCD选项都会影响指令执行时间。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559335", "t": 2, "q": "在指令周期分析中，下列指令的指令周期包含访存周期的有（　）", "a": ["转移指令（跳转到指定内存地址）", "存数指令（从寄存器存数到内存）", "乘法指令（两个寄存器数据相乘）", "取数指令（从内存取数到寄存器）", "", ""], "r": "ABD", "e": "存数指令需将寄存器数据存到内存，要访存；取数指令需从内存取数到寄存器，也要访存；转移指令跳转指定内存地址时可能需访存获取指令；乘法指令只涉及寄存器间运算，不访存。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559336", "t": 2, "q": "在总线仲裁中，常见的仲裁方式有（　）？", "a": ["轮询方式，仲裁器依次询问每个设备，公平性好但响应慢", "计数器定时查询方式，通过计数器值查询设备，优先级可灵活设置", "随机仲裁方式，通过随机数决定总线使用权，公平性好但实时性差", "独立请求方式，每个设备独立向仲裁器请求，响应速度快但硬件复杂", "", ""], "r": "ABD", "e": "总线仲裁常见方式有轮询、计数器定时查询、独立请求等。A选项轮询方式描述正确；B选项计数器定时查询可灵活设置优先级也正确；D选项独立请求响应快但硬件复杂符合实际。而总线仲裁没有随机仲裁方式。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559337", "t": 2, "q": "在I/O控制方式中，下列属于DMA方式特点的有（　）", "a": ["适合大批量数据传输", "数据传输无需CPU干预", "传输速率高于中断驱动方式", "支持内存与I/O设备间直接传输", "", ""], "r": "ABCD", "e": "DMA方式用于高速设备与内存间批量数据传输，支持二者直接传输，传输时CPU干预少、速率比中断驱动方式高。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559338", "t": 2, "q": "在I/O设备中，下列属于块设备的有（　）", "a": ["硬盘", "U盘", "扫描仪", "光盘", "", ""], "r": "ABD", "e": "块设备以数据块为单位进行数据传输和存储，硬盘、U盘、光盘都属于此类。而扫描仪是按字符或图像等进行输入的字符设备。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813843829559339", "t": 2, "q": "在I/O总线系统中，下列属于总线性能指标的有（　）", "a": ["总线负载能力", "总线频率", "总线仲裁方式", "总线宽度", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201344", "t": 3, "q": "数据的\"反码\"表示中，正数的反码与原码相同，负数的反码是其原码的符号位不变，数值位按位取反，该表示方式可直接用于减法运算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "反码虽有正数反码与原码相同、负数反码是原码符号位不变数值位取反的规则，但反码不能直接用于减法运算，还需额外处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201345", "t": 3, "q": "数据的\"BCCD码\"是用4位二进制数表示1位十进制数，其运算规则与二进制数完全相同，无需额外的调整操作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BCD码用4位二进制数表示1位十进制数，但运算规则和二进制不同，当结果大于9或有进位时需进行加6修正。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201346", "t": 3, "q": "数据运算中，补码加法运算的结果若超出补码表示范围，则会产生溢出，此时溢出标志（OF）会被置1。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在补码加法运算里，当结果超出补码表示范围就会产生溢出，溢出时溢出标志（OF）会置 1。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201347", "t": 3, "q": "数据运算中，十进制数转换为二进制数时，整数部分采用\"除2取余，逆序排列\"的方法，小数部分采用\"乘2取整，顺序排列\"的方法，所有十进制数都能精确转换为二进制数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并非所有十进制数都能精确转换为二进制数，比如一些十进制小数在转换时会出现无限循环的情况，无法精确表示。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201348", "t": 3, "q": "数据运算中，无符号数的减法运算不会产生借位，有符号数的减法运算会产生借位。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "无符号数减法不够减时会产生借位；有符号数在计算机中以补码运算，一般不讨论借位概念。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201349", "t": 3, "q": "数据运算中的\"溢出\"仅发生在两个正数相加或两个负数相加的情况下，正数与负数相加一定不会产生溢出。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "当两个正数相加结果超出表示范围会溢出，两个负数相加同理。而正数与负数相加，若结果超出范围也会溢出，并非一定不会产生溢出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201350", "t": 3, "q": "微程序控制器的灵活性高于硬布线控制器，因为修改微程序（存储在控制存储器中）即可改变指令系统，无需修改硬件电路。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "微程序控制器将控制信号以微程序形式存于控制存储器，修改微程序就能改变指令系统功能，无需改动硬件；硬布线控制器控制逻辑由硬件电路实现，改动困难，所以微程序控制器灵活性更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201351", "t": 3, "q": "微程序控制器中，每条机器指令对应一段微程序，每段微程序由若干条微指令组成，微指令的操作控制字段决定了该微指令要完成的微操作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "微程序控制器中，机器指令由微程序实现，微程序由微指令构成，微指令操作控制字段的确决定微操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201352", "t": 3, "q": "微处理器的\"程序计数器（PC）\"始终存储当前正在执行的指令地址，指令执行完成后，PC自动加1指向下一条指令地址。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "程序计数器（PC）存储的是下一条要执行的指令地址，而非当前正在执行的指令地址。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201353", "t": 3, "q": "微处理器的\"栈指针寄存器（SP）\"始终指向栈底地址，栈操作（如压栈、弹栈）时，SP的值保持不变，仅栈内数据发生变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。栈指针寄存器（SP）指向的是栈顶地址，而非栈底地址。在进行压栈和弹栈操作时，栈内数据会变化，同时 SP 的值也会相应改变，压栈时 SP 减小（栈向低地址增长），弹栈时 SP 增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201354", "t": 3, "q": "微处理器的\"CPI\"（每条指令的平均时钟周期数）值越大，说明处理器的指令执行效率越高，性能越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "CPI值越大意味着执行每条指令所需的平均时钟周期数越多，也就是执行指令更慢，效率更低，性能更弱。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201355", "t": 3, "q": "微处理器的时钟频率越高，其运算速度（MIPS）一定越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "微处理器运算速度受多种因素影响，时钟频率只是其中之一，不能仅依据时钟频率高就判定运算速度一定高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201356", "t": 3, "q": "微处理器的CPI（每条指令的时钟周期数）是固定的，与指令类型无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不同类型指令复杂度不同，执行所需时钟周期数也不同，所以CPI并非固定，与指令类型有关。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201357", "t": 3, "q": "微处理器接口技术中，并行接口的数据传输速率一定高于串行接口。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然并行接口理论上数据传输速率有优势，但实际中传输速率受多种因素影响，如时钟频率、传输距离等，串行接口在高速通信场景下速率可能超过并行接口。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201358", "t": 3, "q": "微处理器接口中，中断优先级的高低由硬件电路固定决定，无法通过软件进行调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在微处理器接口中，中断优先级既可以由硬件电路固定决定，也能通过软件进行调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201359", "t": 3, "q": "微处理器接口中，DMA方式实现I/O数据传输时，DMA控制器在传输过程中会完全接管CPU的所有控制功能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "DMA方式下，DMA控制器在传输过程中只是接管总线控制权，并非完全接管CPU所有控制功能，CPU仍可进行其他不涉及总线的操作。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201360", "t": 3, "q": "微处理器中，程序计数器（PC）的内容始终指向当前正在执行的指令地址。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "程序计数器（PC）存放下一条要执行的指令地址，而非当前正在执行的指令地址。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201361", "t": 3, "q": "微处理器中，程序计数器（PC）在取指周期结束后，会自动加1（或指令长度），指向下一条要执行的指令地址。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在微处理器取指周期结束后，程序计数器（PC）会自动加1（单字节指令）或指令长度（多字节指令），以指向下一条要执行的指令地址。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201362", "t": 3, "q": "微处理器中，堆栈操作遵循\"先进后出\"的原则，压栈时堆栈指针（SP）的值减小，出栈时SP的值增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在微处理器里，堆栈操作确实是“先进后出”，且通常压栈时SP值减小，出栈时SP值增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201363", "t": 3, "q": "微处理器中，控制单元（CU）的主要功能是进行算术运算和逻辑运算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "控制单元（CU）主要负责指令的读取、分析和执行，协调各部件工作；进行算术运算和逻辑运算是运算器（ALU）的功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201364", "t": 3, "q": "微处理器中，通用寄存器只能用于存放数据，不能用于存放地址。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "通用寄存器既可以存放数据，也能存放地址。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201365", "t": 3, "q": "微处理器中，用户模式是指微处理器执行用户程序的模式，在该模式下可执行所有指令，包括特权指令。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "用户模式下不能执行特权指令，特权指令一般只能在特权模式下执行，以保证系统的安全和稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201366", "t": 3, "q": "微处理器中，状态寄存器（标志寄存器）存储的是当前程序的执行状态，如进位、零值、溢出等标志，其值由指令执行结果自动更新。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "状态寄存器用于记录指令执行后的状态信息，像进位、零值、溢出等标志会依据指令执行结果自动改变。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201367", "t": 3, "q": "微处理器中断处理过程中，保护断点和程序状态字（PSW）是为了中断返回后能恢复原程序的执行状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在微处理器中断处理时，保护断点（程序计数器的值）和PSW能保证中断结束后可回到原程序继续执行，恢复之前的执行状态。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201368", "t": 3, "q": "微处理器中断系统中，可屏蔽中断请求可通过设置中断屏蔽字来禁止CPU响应。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在微处理器中断系统里，可屏蔽中断的响应与否能通过设置中断屏蔽字控制，屏蔽字可让CPU不响应可屏蔽中断请求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201369", "t": 3, "q": "虚拟内存的实现需要硬件（如页表寄存器、TLB）和软件（如操作系统的内存管理模块）的协同工作，仅靠硬件或软件无法实现虚拟内存。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "虚拟内存是将部分硬盘空间当作内存使用，其实现既需硬件提供支持，像页表寄存器用于存储页表基址，TLB加速地址转换；也需软件如操作系统内存管理模块进行页面置换等操作，二者协同才能实现虚拟内存。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201370", "t": 3, "q": "在计算机体系结构中，流水线的加速比等于流水线的段数，段数越多，加速比越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流水线加速比并不简单等于流水线段数，且段数增多到一定程度，因流水线各段之间的控制和传输等开销，加速比不会无限提高，甚至可能下降。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201371", "t": 3, "q": "在计算机体系结构中，RISC指令系统的指令条数通常比CISC少，且所有指令的执行周期均为一个时钟周期。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "RISC指令系统指令条数通常比CISC少，但不是所有指令执行周期都为一个时钟周期，只是多数简单指令能在一个时钟周期完成。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201372", "t": 3, "q": "在指令的\"直接寻址\"方式中，指令中的地址码字段直接给出操作数的有效地址，而非物理地址，因此访问速度较快但并非最快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "直接寻址中地址码字段直接给出操作数有效地址也就是物理地址；且它需访存一次，并非访问速度最快的，题干表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201373", "t": 3, "q": "指令的\"变址寻址\"方式中，变址寄存器的内容通常由操作系统设置，用于实现程序的重定位，基址寻址的基址寄存器由用户程序设置，用于访问连续数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "变址寄存器内容一般由用户程序设置，用于访问数组等连续数据；基址寄存器内容通常由操作系统设置，用于实现程序重定位，表述与实际情况相反。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201374", "t": 3, "q": "指令的\"操作码\"位数越多，指令系统能包含的指令条数越多，指令功能越丰富，因此操作码位数应尽可能多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "操作码位数增多虽能使指令条数和功能增加，但会使指令长度变长，占用更多存储空间，且处理复杂。所以并非操作码位数越多越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201375", "t": 3, "q": "指令的\"相对寻址\"方式中，有效地址=程序计数器（PC）的当前值+指令中的位移量，该方式适用于跳转指令，可实现程序的位置无关性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "相对寻址就是用PC当前值加位移量得到有效地址，常用于跳转指令，程序在内存中移动时位移量不变能实现位置无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201376", "t": 3, "q": "指令的寻址方式中，变址寻址的有效地址由变址寄存器内容与指令地址码相加得到，变址寄存器通常由用户程序设置。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "变址寻址有效地址确实是变址寄存器内容与指令地址码相加得到，且变址寄存器内容可由用户程序根据需要设置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201377", "t": 3, "q": "指令的寻址方式中，基址寻址主要用于解决程序的动态重定位问题，基址寄存器由操作系统管理。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "基址寻址可将程序在内存中动态定位，基址寄存器存放基地址，由操作系统管理，以实现程序的动态重定位。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201378", "t": 3, "q": "指令系统中，定长操作码的优点是指令译码速度快，缺点是指令种类少。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "定长操作码长度固定，译码时规则简单，所以译码速度快；但因操作码长度固定，编码组合有限，能表示的指令种类就少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201379", "t": 3, "q": "指令系统中，复合指令的功能可由多个简单指令组合实现，因此CISC系统的指令执行效率一定高于RISC系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "CISC虽有复合指令，但指令复杂、执行周期长，且设计复杂，不利于流水线操作；RISC指令简单、规整，利于流水线并行执行，执行效率不一定低于CISC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201380", "t": 3, "q": "指令系统中，基址寻址和变址寻址的区别在于基址寄存器的内容通常由操作系统设置，变址寄存器的内容通常由用户程序设置。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "基址寻址中基址寄存器内容由操作系统设定，用于确定程序或数据在主存中的起始地址；变址寻址里变址寄存器内容由用户程序设定，便于实现数组等数据结构的操作。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201381", "t": 3, "q": "指令系统中，寄存器寻址方式的操作数存储在寄存器中，指令执行时无需访问内存，执行速度快。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "寄存器寻址就是操作数存于寄存器，因寄存器在CPU内，指令执行时不用访问内存，减少了访问时间，所以执行速度快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201382", "t": 3, "q": "指令系统中，扩展操作码技术可在指令字长固定的情况下，增加指令的种类。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "扩展操作码技术通过对指令编码进行合理安排，在指令字长固定时，能利用不同位置的编码来表示更多不同的指令，从而增加指令种类。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201383", "t": 3, "q": "指令系统中，相对寻址方式的有效地址是程序计数器（PC）的当前值与指令中形式地址之和，主要用于实现程序的相对转移。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "相对寻址就是把程序计数器（PC）的当前值与指令中形式地址相加得到有效地址，常用于程序相对转移。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201384", "t": 3, "q": "指令系统中的\"特权指令\"可由用户态程序和内核态程序共同执行，用于完成系统级操作，如修改中断屏蔽字。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "特权指令只能由内核态程序执行，用户态程序不能执行，以保证系统安全和稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201385", "t": 3, "q": "指令执行中，流水线技术通过将指令周期分解为多个阶段并行执行，可提高指令的执行速度，但会增加硬件复杂度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流水线技术把指令周期分解成多个阶段，让多个指令在不同阶段并行进行，从而提高了指令执行速度，不过其实现需要增加硬件来对各阶段进行控制和协调，会增加硬件复杂度。 ", "
