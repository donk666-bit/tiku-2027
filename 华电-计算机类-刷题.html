ap": [false, false, false, false, false, false]}, {"id": "2034813849542201386", "t": 3, "q": "指令周期是指CPU从内存中读取一条指令所需要的时间。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "指令周期是CPU执行一条指令所需的全部时间，包括取指令、分析指令、执行指令等操作，不只是读取指令的时间。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201387", "t": 3, "q": "指令周期中，所有指令的指令周期都包含取指、译码、执行三个基本阶段，部分指令可能包含访存或写回阶段。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "指令周期通常都要经历取指获取指令、译码识别指令、执行完成操作这三个基本阶段，有些指令在执行过程中需要访问存储器获取数据或存储结果，还有些指令执行完后要将结果写回到寄存器等，所以存在访存或写回阶段。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201388", "t": 3, "q": "总线的\"带宽\"是指总线一次能传输的数据位数，如32位总线的带宽为32位，64位总线的带宽为64位。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "总线带宽指的是单位时间内总线上可传输的数据量，而非一次能传输的数据位数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201389", "t": 3, "q": "总线的\"独立请求\"仲裁方式中，每个设备有独立的请求线和响应线，仲裁器可根据优先级灵活选择设备，响应速度快，但硬件复杂度高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "独立请求仲裁方式特点就是各设备有独立请求和响应线，仲裁器能按优先级灵活选设备，响应快，但因众多线路和控制逻辑，硬件复杂。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201390", "t": 3, "q": "总线的\"链式查询\"仲裁方式中，设备的优先级由其在总线中的物理位置决定，离仲裁器越近的设备，优先级越高，且优先级顺序无法修改。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "链式查询中设备优先级由物理位置定，离仲裁器近的优先级高，且这种优先级顺序是固定无法修改的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201391", "t": 3, "q": "Cache的\"命中率\"随Cache容量的增大而单调递增，容量越大，命中率越高，因此Cache容量应尽可能大以追求100%命中率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "Cache命中率并非随容量增大单调递增，且受程序局部性等多种因素影响，即便增大容量也很难达到100%命中率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201392", "t": 3, "q": "Cache的\"写回\"策略中，数据仅写入Cache，只有当Cache块被替换时才将数据写回主存，因此该策略的主存写入次数比\"写直达\"策略多，性能更低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“写回”策略只有Cache块被替换才写回主存，“写直达”每次写操作都写入主存，所以“写回”主存写入次数少、性能高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201393", "t": 3, "q": "Cache的命中率仅与Cache的容量有关，容量越大，命中率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。Cache命中率不仅和Cache容量有关，还受Cache的映射方式、替换策略等因素影响。即便Cache容量大，若映射方式和替换策略不合理，命中率也未必高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201394", "t": 3, "q": "Cache与主存的\"全相联映射\"方式中，主存的任意一块可映射到Cache的任意一块，其命中率最高，但硬件实现复杂度和成本也最高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "全相联映射允许主存任意一块映射到Cache任意一块，灵活性高，命中率高，但需复杂硬件来实现地址映射和查找，成本高。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201395", "t": 3, "q": "DRAM（动态随机存取存储器）需要定期刷新才能保持数据，刷新操作会占用存储器的访问时间，因此DRAM的访问速度比SRAM（静态随机存取存储器）慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DRAM靠电容存储数据，电容会漏电需定期刷新，刷新占访问时间；SRAM用触发器存储数据，无需刷新，所以DRAM访问速度比SRAM慢。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201396", "t": 3, "q": "DRAM芯片需要定期刷新，刷新过程会中断正常的数据读写操作，因此DRAM的存取速度比SRAM慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DRAM因电容电荷会流失需定期刷新，刷新时会中断正常读写，而SRAM靠触发器存储数据无需刷新，所以DRAM存取速度比SRAM慢。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201397", "t": 3, "q": "I/O接口的\"程序查询\"方式中，CPU需不断查询I/O设备的状态，直至设备准备好，该方式CPU利用率低，但硬件实现简单。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "程序查询方式下，CPU持续查询I/O设备状态，期间一直处于等待，无法做其他事，所以CPU利用率低；而这种方式只需简单的查询逻辑，硬件实现容易。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201398", "t": 3, "q": "I/O接口中，并行接口的每个数据位都需要单独的数据线传输，串行接口的所有数据位通过一条数据线按顺序传输。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "并行接口原理是每个数据位单独用数据线传输，可同时传输多位数据；串行接口则是所有数据位通过一条数据线按顺序逐位传输。所以该描述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201399", "t": 3, "q": "I/O控制方式中，程序查询方式的CPU利用率最高，DMA方式的CPU利用率最低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "程序查询方式需要CPU不断查询I/O设备状态，CPU利用率最低；DMA方式在数据传输时由DMA控制器直接控制，CPU干预少，CPU利用率高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201400", "t": 3, "q": "在I/O总线系统中，异步总线通过固定时钟信号协调数据传输，同步总线通过握手信号协调数据传输。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "异步总线通过握手信号协调数据传输，同步总线通过固定时钟信号协调数据传输，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201401", "t": 3, "q": "I/O总线中，即插即用（PnP）功能允许设备在系统运行时动态接入或移除，系统会自动识别设备并分配资源，无需人工配置。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "即插即用（PnP）技术的核心特点就是让设备能在系统运行时动态接入或移除，系统可自动识别设备并分配资源，不用人工手动配置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813849542201402", "t": 3, "q": "RISC（精简指令集计算机）的指令条数少，指令格式规整，多为定长指令，且大部分指令可在一个时钟周期内完成执行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RISC特点就是指令条数少、格式规整多定长指令，多数指令能在一个时钟周期完成执行。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第6章 软件设计与开发（1）", "n": "基础练习题【含解析】 / 第6章 软件设计与开发（1）", "qs": [{"id": "2034813852650180608", "t": 1, "q": "软件测试中，\"不依赖于软件内部实现逻辑，仅根据需求规格说明书验证系统功能是否符合要求\"的测试方法是？", "a": ["白盒测试", "静态测试", "黑盒测试", "动态测试", "", ""], "r": "C", "e": "黑盒测试不考虑软件内部实现逻辑，只依据需求规格说明书来验证系统功能是否达标。白盒测试关注内部代码逻辑；静态测试主要是不运行程序检查代码等；动态测试是运行程序进行测试。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180609", "t": 1, "q": "软件测试中，针对\"模块内部逻辑结构与数据流向\"设计测试用例，以验证模块是否符合设计规格的测试类型是？", "a": ["验收测试", "集成测试", "系统测试", "单元测试", "", ""], "r": "D", "e": "单元测试主要针对模块内部逻辑结构与数据流向设计测试用例，验证模块是否符合设计规格。验收测试是用户等对系统整体进行的测试；集成测试关注模块间的接口；系统测试针对整个系统。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180610", "t": 1, "q": "软件工程中，“高内聚、低耦合”的设计原则主要应用于哪个阶段？", "a": ["需求分析阶段", "概要设计阶段", "系统实现阶段", "单元测试阶段", "", ""], "r": "B", "e": "“高内聚、低耦合”原则用于指导软件模块的划分和设计，概要设计阶段主要就是进行软件的总体结构设计、模块划分等，该原则在此阶段应用可提升软件设计质量。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180611", "t": 1, "q": "软件工程中，瀑布模型的主要缺点是", "a": ["迭代次数过多，开发周期长", "无法应对需求的频繁变更", "需要大量原型开发，成本高", "对开发人员技术要求过低", "", ""], "r": "B", "e": "瀑布模型是线性顺序进行的软件开发模式，各阶段有明确界限，需求确定后按顺序推进，需求变更时修改成本高，难以应对频繁变更。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180612", "t": 1, "q": "软件工程中，软件测试的目的是", "a": ["证明软件没有缺陷", "验证软件是否满足所有需求", "确保软件运行无错误", "发现软件中的缺陷", "", ""], "r": "D", "e": "软件测试是为了尽可能地发现软件中存在的缺陷。软件存在复杂多样性，难以证明无缺陷、满足所有需求和运行无错误。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180613", "t": 1, "q": "软件工程中，软件配置管理的核心目的是", "a": ["减少软件开发成本", "加快软件测试进度", "控制软件版本，避免版本混乱", "提高软件运行效率", "", ""], "r": "C", "e": "软件配置管理主要是对软件的各种版本进行有效控制和管理，防止版本混乱。A选项减少成本、B选项加快测试进度、D选项提高运行效率并非其核心目的。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180614", "t": 1, "q": "软件工程中，软件维护的四种类型中，\"为适应新的操作系统而修改软件\"属于", "a": ["完善性维护", "改正性维护", "预防性维护", "适应性维护", "", ""], "r": "D", "e": "适应性维护是为使软件适应新的环境（如操作系统等）而进行的修改。本题“为适应新的操作系统而修改软件”符合适应性维护定义。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180615", "t": 1, "q": "软件工程中，软件质量属性不包括", "a": ["可用性", "可维护性", "可扩展性", "开发成本", "", ""], "r": "D", "e": "软件质量属性主要关注软件产品本身的特性，如可用性、可维护性、可扩展性等，而开发成本是开发过程中的经济投入，不属于软件质量属性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180616", "t": 1, "q": "软件工程中，原型模型最适合的项目场景是", "a": ["需求模糊且易变的中小型项目", "时间紧张且需求固定的项目", "需求明确且稳定的大型项目", "技术成熟且无风险的项目", "", ""], "r": "A", "e": "原型模型能快速构建可运行的软件原型，通过与用户交互来明确和细化需求，适合需求模糊且易变的情况，中小型项目也更便于采用该模型。而需求固定、明确稳定、无风险等情况不是原型模型的优势场景。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180617", "t": 1, "q": "软件集成测试中，\"先测试底层模块，再逐步集成上层模块，需为上层模块编写驱动程序\"的测试策略是？", "a": ["自底向上集成", "三明治集成", "自顶向下集成", "大爆炸集成", "", ""], "r": "A", "e": "自底向上集成是从底层模块开始测试，逐步集成上层模块，且要为上层模块编写驱动程序。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180618", "t": 1, "q": "软件维护工作中，占比最高的维护类型是？", "a": ["完善性维护", "预防性维护", "适应性维护", "改正性维护", "", ""], "r": "A", "e": "完善性维护是为扩充功能和改善性能而进行的修改，在软件维护中占比最高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180619", "t": 1, "q": "软件维护中，为了适应操作系统版本更新、硬件配置升级等外部环境变化而进行的维护工作，属于？", "a": ["适应性维护", "改正性维护", "完善性维护", "预防性维护", "", ""], "r": "A", "e": "为适应外部环境变化（如操作系统版本更新、硬件配置升级等）进行的维护是适应性维护。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180620", "t": 1, "q": "软件系统测试中，“验证系统在高并发、大数据量场景下的响应时间与稳定性”的测试类型是？", "a": ["兼容性测试", "安全性测试", "功能测试", "性能测试", "", ""], "r": "D", "e": "性能测试关注系统在不同场景下的响应时间、吞吐量等性能指标，高并发和大数据量场景下验证响应时间与稳定性属于性能测试范畴。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180621", "t": 1, "q": "系统测试中，\"验证软件是否符合用户业务流程需求\"的测试类型是", "a": ["验收测试", "回归测试", "集成测试", "单元测试", "", ""], "r": "A", "e": "验收测试是验证软件是否符合用户业务流程需求；回归测试是修改代码后验证功能是否受影响；集成测试是测试多个模块间的接口；单元测试针对单个模块。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180622", "t": 1, "q": "系统集成测试中，“自顶向下集成”和“自底向上集成”的主要区别是", "a": ["模块集成的顺序不同", "测试开始的时间点不同", "测试用例设计方法不同", "所需的测试成本不同", "", ""], "r": "A", "e": "自顶向下集成是从顶层模块开始逐步向下集成，自底向上集成是从底层模块开始逐步向上集成，二者主要区别在于模块集成的顺序。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180623", "t": 1, "q": "系统设计阶段中，详细设计的核心任务是", "a": ["定义用户需求", "设计模块间接口", "设计模块内部具体实现逻辑", "划分系统模块", "", ""], "r": "C", "e": "详细设计主要是对每个模块进行深入细化，确定模块内部具体实现逻辑。定义用户需求是需求分析阶段的任务；设计模块间接口是概要设计关注的内容；划分系统模块也是概要设计的工作。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180624", "t": 1, "q": "下列关于软件维护的说法中，正确的是？", "a": ["适应性维护是为了提高软件的可维护性、可靠性而进行的提前维护", "预防性维护的目的是修复软件运行中发现的错误", "改正性维护是为了适应新的硬件或软件环境而进行的维护", "完善性维护占软件维护工作量的比例最高，主要是为了增加软件新功能", "", ""], "r": "D", "e": "A选项，预防性维护是为提高可维护性、可靠性提前维护，非适应性维护；B选项，改正性维护才是修复运行中错误；C选项，适应性维护是适应新环境。完善性维护主要增加新功能，占维护工作量比例最高。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180625", "t": 1, "q": "下列关于C语言函数参数传递的说法中，正确的是？", "a": ["使用指针作为函数参数时，无法通过指针修改实参的数值", "当传递数组名作为参数时，实际传递的是数组第一个元素的地址", "传递结构体变量作为参数时，一定是按引用传递，修改形参会直接影响实参", "函数参数传递时，实参和形参一定占用相同的内存空间", "", ""], "r": "B", "e": "A项用指针可改实参值；C项结构体变量传参默认按值传递，修改形参不影响实参；D项实参形参内存空间通常不同，传数组名是传首元素地址。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180626", "t": 1, "q": "需求分析阶段的核心输出物是", "a": ["测试计划文档", "需求规格说明书", "详细设计说明书", "概要设计说明书", "", ""], "r": "B", "e": "需求分析阶段主要是明确用户需求，核心产出就是需求规格说明书，它详细描述了软件系统应具备的功能、性能等要求。测试计划文档是测试阶段相关，详细设计说明书是设计阶段，概要设计说明书也是设计阶段产物。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180627", "t": 1, "q": "需求分析中，用于描述系统数据流向和处理过程的工具是", "a": ["类图", "数据流图（DFD）", "状态图", "用例图", "", ""], "r": "B", "e": "数据流图（DFD）主要用于描述系统数据流向和处理过程。类图用于展示系统中的类及类之间关系；状态图用于描述对象的状态变化；用例图用于描述系统的功能需求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180628", "t": 1, "q": "需求工程的过程不包括以下哪个阶段", "a": ["需求验证", "需求获取", "需求分析", "需求实现", "", ""], "r": "D", "e": "需求工程过程主要包括需求获取、需求分析、需求规格说明、需求验证等阶段。需求实现是开发阶段的事，并非需求工程过程的阶段。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180629", "t": 1, "q": "需求验证的主要目的是", "a": ["测试软件是否存在功能缺陷", "验证软件是否满足设计要求", "确认软件是否符合用户使用习惯", "确认需求文档是否完整、一致、可行", "", ""], "r": "D", "e": "需求验证是对需求文档进行检查。其核心就是要确认需求文档是否完整、涵盖所有必要内容，是否内部一致、无矛盾，是否在技术和资源等方面可行。A 是测试阶段目的；B 是设计验证目的；C 只是部分考量，并非主要目的。所以答案选 D。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180630", "t": 1, "q": "以下不属于软件工程\"软件生命周期\"阶段的是？", "a": ["编码实现阶段", "需求分析阶段", "系统维护阶段", "产品销售阶段", "", ""], "r": "D", "e": "软件生命周期包括需求分析、设计、编码实现、测试、系统维护等阶段，产品销售阶段主要涉及商业运营，并非软件本身开发与维护的阶段。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180631", "t": 1, "q": "以下关于C语言动态内存分配的说法，错误的是？", "a": ["malloc函数分配的内存需通过free函数释放，否则会导致内存泄漏", "realloc函数可对已分配的内存进行扩容或缩容，但不一定能保留原有数据", "若malloc函数分配内存失败，会返回NULL指针", "calloc函数会将分配的内存初始化为0，而malloc函数不会", "", ""], "r": "B", "e": "realloc函数对已分配内存进行扩容或缩容时，若有足够连续空间，会保留原有数据；若没有，会开辟新空间并复制原有数据。所以B选项说不一定能保留原有数据错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180632", "t": 1, "q": "以下关于C语言函数的说法，错误的是", "a": ["静态函数（static修饰）的作用域仅限于当前源文件", "函数可嵌套调用，但不可嵌套定义", "函数的返回值类型由定义时的返回类型决定，与return语句返回的值类型无关", "函数参数若为数组，实际传递的是数组首元素的地址", "", ""], "r": "C", "e": "函数返回值类型由定义时的返回类型决定，且return语句返回的值类型要与之兼容，所以C选项错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180633", "t": 1, "q": "以下关于C语言函数递归调用的说法，错误的是", "a": ["递归调用需有明确的终止条件", "递归调用的执行效率通常高于非递归调用", "递归调用会占用栈空间，可能导致栈溢出", "所有递归程序都可转换为非递归程序", "", ""], "r": "B", "e": "递归调用因频繁函数调用和栈操作等开销，执行效率通常低于非递归调用。A选项，递归需终止条件避免无限循环；C选项，递归调用会不断占用栈空间，可能栈溢出；D选项，递归程序理论上都能转换为非递归。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180634", "t": 1, "q": "以下关于C语言结构体的说法，正确的是？", "a": ["结构体变量的大小等于其所有成员变量大小之和，无需考虑内存对齐", "结构体类型定义后，系统会自动为其分配内存空间", "结构体可以嵌套定义，即一个结构体的成员可以是另一个结构体类型", "结构体成员的访问只能通过\"结构体变量.成员名\"的方式", "", ""], "r": "C", "e": "A项，结构体存在内存对齐，大小不一定是成员变量大小之和；B项，结构体类型定义后不会自动分配内存，定义结构体变量才会；D项，还能通过指针用“->”访问。C项，结构体可嵌套定义。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180635", "t": 1, "q": "以下关于C语言结构体的说法，正确的是", "a": ["结构体可嵌套定义，即一个结构体成员是另一个结构体类型", "结构体指针访问成员需使用\"->\"运算符", "结构体成员的数据类型可以不同", "结构体变量可以作为函数参数传递", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180636", "t": 1, "q": "以下关于C语言预处理命令的说法，错误的是", "a": ["#define定义的宏函数与普通函数一样，会进行类型检查", "#include命令将指定文件的内容嵌入当前文件", "#define定义的宏在预处理阶段进行文本替换", "#if和#endif构成条件编译，可选择性编译代码", "", ""], "r": "A", "e": "#define定义的宏函数在预处理阶段进行简单文本替换，不会像普通函数那样进行类型检查。B选项#include会嵌入指定文件内容；C选项宏是预处理阶段文本替换；D选项#if和#endif可实现条件编译。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180637", "t": 1, "q": "以下关于C语言运算符优先级的说法，正确的是", "a": ["逗号运算符（,）的优先级高于条件运算符（？:）", "赋值运算符（=）的优先级高于关系运算符（>）", "逻辑与运算符（　）的优先级高于逻辑或运算符（||）", "自增运算符（++）的优先级低于乘法运算符（*）", "", ""], "r": "C", "e": "逗号运算符优先级最低，赋值运算符优先级低于关系运算符，自增运算符优先级高于乘法运算符，逻辑与运算符优先级高于逻辑或运算符。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180638", "t": 1, "q": "以下关于C语言指针的说法，正确的是", "a": ["两个指针变量不能进行减法运算", "void指针（空指针）可直接指向任意类型的数据", "指针变量的大小与它所指向的数据类型大小相同", "指针变量存储的是内存地址", "", ""], "r": "D", "e": "指针变量本质就是用来存储内存地址的；两个指针在指向同一数组元素时可进行减法运算；void指针不能直接指向任意类型数据，需强制类型转换；指针变量大小通常固定，与指向的数据类型大小无关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180639", "t": 1, "q": "以下关于C语言中\"指针数组\"与\"数组指针\"的声明，正确的是？", "a": ["int*p[]是数组指针，指向一个int型数组", "int(*p)[]是指针数组，指向int型变量的指针数组", "int(*p)[]是数组指针，可以指向一个整数数组", "int*p[]是指针数组，数组元素为int型指针", "", ""], "r": "D", "e": "“int *p[]”中[]优先级高，p先与[]结合成数组，数组元素是int型指针，是指针数组；“int (*p)[]”中p先与*结合成指针，指向整数数组，是数组指针。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180640", "t": 1, "q": "以下关于C语言中指针数组和数组指针的声明，正确的是", "a": ["int *p[5]是数组指针，指向含5个int元素的数组", "int *p[5]是指针数组，数组元素为int类型指针", "int (*p)[5]是指针数组，指向含5个int元素的数组", "int (*p)[5]是指针数组，存储5个int类型指针", "", ""], "r": "B", "e": "`int *p[5]` 中 `[]` 优先级高，`p` 先和 `[5]` 结合，是含5个元素的数组，元素类型是 `int *`，即指针数组；`int (*p)[5]` 中 `p` 先被 `()` 括起来，是指针，指向含5个 `int` 元素的数组。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180641", "t": 1, "q": "以下关于C语言字符串处理函数的说法，错误的是", "a": ["strcmp(s1,s2)返回0表示s1和s2字符串完全相同", "strcat(dest,src)会将src字符串追加到dest字符串末尾，覆盖dest原有的'\\0'", "strcpy(dest,src)会将src字符串（含'\\0'）复制到dest", "strlen(str)计算的字符串长度包含末尾的'\\0'", "", ""], "r": "D", "e": "本题可根据C语言中各字符串处理函数的功能来判断选项的正误。 选项A：`strcmp(s1, s2)` 用于比较两个字符串，若返回0，则表示 `s1` 和 `s2` 字符串完全相同，该说法正确。 选项B：`strcat(dest, src)` 会将 `src` 字符串追加到 `dest` 字符串末尾，同时会覆盖 `dest` 原有的 `'\\0'`，该说法正确。 选项C：`strcpy(dest, src)` 会将 `src` 字符串（包含 `'\\0'`）复制到 `dest`，该说法正确。 选项D：`strlen(str)` 计算的是字符串的实际长度，不包含末尾的 `'\\0'`，该说法错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180642", "t": 1, "q": "在软件测试中，下列关于回归测试的说法，正确的是？", "a": ["回归测试属于系统测试的一部分，仅在软件交付前执行一次", "回归测试的目的是验证软件新增加的功能是否正确", "回归测试仅需测试被修改的模块，无需测试其他相关模块", "当软件的某个模块被修改后，回归测试需验证该修改是否引入了新的错误，且未影响原有功能", "", ""], "r": "D", "e": "回归测试是针对软件修改后进行的测试，要验证修改是否引入新错误且不影响原有功能。A选项回归测试不是仅在交付前执行一次；B选项回归测试主要针对修改部分，不是验证新增功能；C选项不仅要测修改模块，相关模块也需测试。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180643", "t": 1, "q": "在软件测试中，下列哪种测试类型属于\"白盒测试\"，且主要关注测试用例是否覆盖了程序中的所有判定条件（真、假分支）？", "a": ["语句覆盖", "边界值分析法", "判定覆盖（分支覆盖）", "等价类划分法", "", ""], "r": "C", "e": "白盒测试关注程序内部结构，语句覆盖只关注语句执行，边界值分析和等价类划分是黑盒测试方法。判定覆盖是白盒测试，能覆盖判定条件的真假分支。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180644", "t": 1, "q": "在软件工程的风险分析中，下列哪项不属于软件项目的常见风险？", "a": ["硬件设备交付延迟导致软件集成测试无法按时进行", "需求变更频繁导致开发进度延迟", "软件通过所有测试后，用户对功能满意度高", "开发团队技术能力不足导致技术实现困难", "", ""], "r": "C", "e": "风险通常指可能带来负面影响的不确定因素，A、B、D 都会给项目带来不利影响，而 C 中用户满意度高是积极结果，不属于风险。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180645", "t": 1, "q": "在软件工程的敏捷开发方法中，下列哪项不是Scrum框架的核心角色？", "a": ["Scrum大师（Scrum Master）", "开发团队（Development Team）", "产品负责人（Product Owner）", "项目经理（Project Manager）", "", ""], "r": "D", "e": "Scrum框架核心角色有Scrum大师、开发团队和产品负责人，不包含项目经理。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180646", "t": 1, "q": "在软件工程的瀑布模型中，下列哪项是其最主要的局限性，导致该模型在需求频繁变更的项目中适用性较低？", "a": ["无法进行阶段性的测试验证", "需求确认后若发生变更，后续阶段调整成本极高", "开发过程阶段划分不清晰", "仅适用于小规模项目，无法支持大型项目开发", "", ""], "r": "B", "e": "瀑布模型是线性顺序进行的，需求确认后进入后续阶段，若需求变更，后续阶段都要调整，成本极高，不适合需求频繁变更项目。A选项可进行阶段性测试；C选项阶段划分清晰；D选项并非仅适用于小规模项目。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180647", "t": 1, "q": "在软件工程的原型模型中，下列哪种原型类型的目的是验证需求的可行性，且在验证后会被丢弃，不用于后续开发？", "a": ["增量型原型", "探索型原型", "抛弃型原型（Throwaway Prototype）", "演化型原型", "", ""], "r": "C", "e": "抛弃型原型目的是验证需求可行性，验证完就丢弃，不用于后续开发。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180648", "t": 1, "q": "在软件工程的增量模型中，其核心特点是？", "a": ["先构建一个简化的原型，通过迭代修改原型直至满足需求", "严格按照需求、设计、编码、测试的线性顺序进行开发", "将软件开发过程分为多个增量，每个增量交付部分功能，逐步完善为完整产品", "以用户故事为单位，通过短周期的冲刺（Sprint）交付产品增量", "", ""], "r": "C", "e": "增量模型把软件开发分成多个增量，每次交付部分功能，逐步完善成完整产品。A是原型模型特点；B是瀑布模型特点；D是敏捷开发特点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180649", "t": 1, "q": "在软件工程开发模型中，需通过多次迭代逐步降低项目风险，且每个迭代周期均包含\"计划-风险分析-开发-评审\"环节的模型是？", "a": ["螺旋模型", "瀑布模型", "增量模型", "原型模型", "", ""], "r": "A", "e": "螺旋模型将软件开发过程划分为多个迭代周期，每个周期包含“计划 - 风险分析 - 开发 - 评审”，能逐步降低项目风险。瀑布模型是线性顺序执行；增量模型是分阶段增量开发；原型模型是先构建原型。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180650", "t": 1, "q": "在软件工程中，\"软件配置管理\"的核心目的是？", "a": ["控制软件版本变更，确保各版本的一致性与可追溯性", "确保软件代码的编写规范", "提高软件测试的效率", "减少软件维护的成本", "", ""], "r": "A", "e": "软件配置管理核心就是管理软件版本变化，保证版本一致性和可追溯。B是代码规范相关，C是测试方面，D是维护成本方面，都不是核心目的。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180651", "t": 1, "q": "在软件工程中，螺旋模型区别于瀑布模型和原型模型的最核心特征是", "a": ["逐步迭代开发", "依赖原型验证需求", "引入风险分析机制", "分阶段线性推进", "", ""], "r": "C", "e": "螺旋模型的特点是将软件开发过程划分为多个阶段，每个阶段都引入风险分析机制，这是它区别于瀑布模型（阶段线性推进）和原型模型（依赖原型验证需求）的核心特征。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813852650180652", "t": 1, "q": "在软件维护过程中，下列哪项活动不属于改正性维护的范畴？", "a": ["修正软件中因逻辑错误导致的计算结果偏差", "修复软件运行时出现的内存泄漏问题", "解决软件在特定输入下的崩溃问题", "为软件增加新的报表生成功能", "", ""], "r": "D", "e": "改正性维护是为了修正软件中的错误。A、B、C选项都是在修正软件已有的错误。而D选项是为软件增加新功能，属于完善性维护，并非改正性维护。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456640", "t": 2, "q": "软件测试过程中，测试用例设计需包含的要素有", "a": ["测试用例编号", "预期输出", "测试输入", "测试环境", "", ""], "r": "ABCD", "e": "测试用例需有编号便于管理，测试输入为执行测试的数据，预期输出用于判断测试结果是否正确，测试环境会影响测试结果，这些都是测试用例设计应包含的要素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456641", "t": 2, "q": "软件测试中，以下属于\"白盒测试\"方法的有？", "a": ["边界值分析", "判定覆盖（分支覆盖）", "语句覆盖", "等价类划分", "", ""], "r": "BC", "e": "白盒测试关注程序内部逻辑结构。判定覆盖和语句覆盖都是基于程序内部逻辑来设计测试用例，属于白盒测试方法；边界值分析和等价类划分是基于输入域的黑盒测试方法。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456642", "t": 2, "q": "软件工程中，螺旋模型的开发步骤包括", "a": ["实施工程", "制定计划", "风险分析", "客户评估", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456643", "t": 2, "q": "软件工程中，软件配置管理的主要活动包括", "a": ["版本控制", "配置状态报告", "变更控制", "需求管理", "", ""], "r": "ABC", "e": "软件配置管理主要活动有版本控制、配置状态报告、变更控制等。需求管理不属于软件配置管理主要活动范畴。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456644", "t": 2, "q": "软件工程中，软件生命周期包括的阶段有", "a": ["软件设计", "可行性研究与计划", "程序编码", "软件测试与维护", "", ""], "r": "ABCD", "e": "软件生命周期包括可行性研究与计划、需求分析、软件设计、程序编码、软件测试、运行维护等阶段。ABCD选项均涵盖在软件生命周期阶段内。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456645", "t": 2, "q": "软件工程中，软件质量保证（SQA）的主要活动包括", "a": ["开展质量测试", "进行质量评审", "改进质量保证过程", "记录并跟踪质量问题", "", ""], "r": "BCD", "e": "软件质量保证（SQA）是贯穿软件开发全过程的活动，包括评审、过程改进、问题记录跟踪等。质量测试主要是验证软件是否满足规定要求，它是软件测试活动，并非SQA主要活动。而质量评审、改进质量保证过程、记录并跟踪质量问题都是SQA的主要活动。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456646", "t": 2, "q": "软件工程中，原型模型的主要优点包括", "a": ["能尽早发现项目风险", "能快速验证需求，减少需求误解", "适合需求模糊的项目", "可直接将原型作为最终产品", "", ""], "r": "ABC", "e": "原型模型可快速构建原型来验证需求，减少对需求的误解，适合需求模糊的项目，还能尽早发现项目风险。但原型通常是为验证需求构建，一般不能直接作为最终产品。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456647", "t": 2, "q": "软件集成测试的主要目标包括？", "a": ["验证单个模块的内部逻辑是否正确", "验证系统整体功能是否符合需求规格", "确保集成后的系统性能满足设计要求", "验证模块间接口的正确性（如参数传递、数据交互）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456648", "t": 2, "q": "软件配置管理的主要活动包括？", "a": ["配置审计: 验证软件配置项是否符合配置基线", "版本控制: 管理软件的不同版本，追踪版本变更记录", "发布管理: 箧行软件版本的发布流程，确保发布质量", "变更控制: 控制对软件配置项的修改，确保变更有序进行", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456649", "t": 2, "q": "软件系统测试的主要内容包括？", "a": ["安全性测试: 验证系统防攻击、数据加密、权限控制等安全能力", "兼容性测试: 验证系统在不同操作系统、浏览器、硬件下的适配性", "性能测试: 验证系统响应时间、并发量、吞吐量等性能指标", "单元测试: 验证单个模块的内部逻辑是否正确", "", ""], "r": "ABC", "e": "系统测试是对整个系统进行的全面测试，A安全性、B兼容性、C性能测试都属于对系统的整体测试内容。而单元测试是针对单个模块的测试，不属于系统测试主要内容。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456650", "t": 2, "q": "软件系统维护过程中，需要遵循的流程包括？", "a": ["维护申请: 用户或开发人员提出维护需求，提交申请单", "维护分析: 评估维护需求的必要性、可行性与成本", "维护测试: 验证维护后的系统是否正常，无新问题", "维护实施: 修改代码或文档，完成维护任务", "", ""], "r": "ABCD", "e": "软件系统维护流程通常是先提出维护申请，接着对申请进行分析评估，然后实施维护，最后进行测试验证。ABCD四个选项分别对应了这几个关键步骤。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456651", "t": 2, "q": "软件详细设计阶段的主要任务包括？", "a": ["确定模块内数据结构的详细设计", "编写详细设计说明书", "设计模块的内部逻辑结构（如流程图、伪代码）", "设计模块间的接口参数与交互方式", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456652", "t": 2, "q": "软件需求分析阶段的主要任务包括？", "a": ["设计系统的模块结构与接口", "确定系统的功能需求与非功能需求（性能、安全等）", "建立需求模型（如用例图、数据流图）", "验证需求的完整性、一致性与可行性", "", ""], "r": "BCD", "e": "需求分析主要是明确系统要做什么，确定功能与非功能需求是核心任务。建立需求模型辅助明确需求，验证需求确保合理可行。而设计系统模块结构与接口是设计阶段的工作。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456653", "t": 2, "q": "软件需求验证的主要方法包括？", "a": ["用户访谈:再次与用户沟通，确认需求理解无误", "原型验证:通过原型演示，让用户确认需求是否符合预期", "需求评审:组织相关人员对需求文档进行审查，确保需求的准确性和完整性", "测试用例设计:基于需求设计测试用例，验证需求的可测试性", "", ""], "r": "ABCD", "e": "用户访谈可和用户确认需求理解；原型验证能让用户直观确认需求；需求评审能审查需求准确完整；测试用例设计可验证需求可测性，这几种都是常见的软件需求验证方法。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456654", "t": 2, "q": "系统测试的主要类型包括", "a": ["单元测试", "集成测试", "回归测试", "性能测试", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456655", "t": 2, "q": "系统维护过程中，影响维护成本的主要因素有", "a": ["软件的可维护性", "维护团队的技术水平", "软件的规模", "软件的年龄（使用时间）", "", ""], "r": "ABCD", "e": "软件可维护性差、规模大、使用时间长都会增加维护难度与成本，维护团队技术水平低也会使维护成本上升，ABCD 选项均是影响维护成本的主要因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456656", "t": 2, "q": "需求分析阶段常用的建模工具包括", "a": ["状态图（UML）", "用例图（UML）", "实体-关系图（ER图）", "类图（UML）", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456657", "t": 2, "q": "需求管理的主要任务包括", "a": ["需求变更控制", "需求验证", "需求获取", "需求跟踪", "", ""], "r": "ABCD", "e": "需求管理是确保各方对需求的一致理解、控制需求变更等。需求获取是收集需求，需求验证是确保需求正确性，需求变更控制防止需求随意变动，需求跟踪保证需求可追溯，这些都是需求管理主要任务。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456658", "t": 2, "q": "需求规格说明书应包含的核心内容有", "a": ["数据需求", "非功能需求（性能、安全性等）", "功能需求", "设计方案", "", ""], "r": "ABC", "e": "需求规格说明书主要是明确系统要实现什么，核心是功能需求、数据需求以及非功能需求等，设计方案是后续设计阶段的内容，并非需求规格说明书核心。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456659", "t": 2, "q": "需求获取的常用方法包括", "a": ["问卷调查法", "原型法", "头脑风暴法", "访谈法", "", ""], "r": "ABCD", "e": "这几种方法都是需求获取常用手段，问卷调查可广泛收集信息，原型法能直观展示需求，头脑风暴激发创意获取需求，访谈法可深入交流获取信息。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456660", "t": 2, "q": "以下关于软件工程\"原型模型\"的说法，正确的有？", "a": ["原型模型最终交付的是原型本身，无需开发正式系统", "原型模型的缺点是可能导致开发周期延长，成本增加", "原型模型适合需求模糊、不确定的项目", "原型模型通过快速构建可运行的原型，帮助用户明确需求", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456661", "t": 2, "q": "以下关于软件生命周期模型的说法，正确的有？", "a": ["所有生命周期模型都必须包含需求、设计、编码、测试、维护阶段", "瀑布模型适合需求明确、变更少的项目，开发过程线性", "增量模型将系统拆分为多个增量，分阶段交付，每个增量包含完整的开发流程", "敏捷模型强调快速迭代、响应变更，适合需求不确定的项目", "", ""], "r": "BCD", "e": "A选项，并非所有生命周期模型都严格包含这些阶段；B选项，瀑布模型确实适合需求明确、变更少的项目，开发按线性顺序进行；C选项，增量模型分阶段交付，每个增量有完整开发流程；D选项，敏捷模型强调快速迭代和响应变更，适合需求不确定项目。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456662", "t": 2, "q": "以下关于软件系统维护的类型，说法正确的有？", "a": ["完善性维护是为了适应外部环境（如操作系统升级）变化而进行的维护", "预防性维护是提前修复潜在的、尚未暴露的问题，减少未来故障风险", "改正性维护是修复软件运行中发现的bug", "维护工作需遵循软件生命周期流程，确保维护质量", "", ""], "r": "BCD", "e": "A选项错误，为适应外部环境变化进行的维护是适应性维护，不是完善性维护；B选项正确，预防性维护就是提前处理潜在问题降低未来故障风险；C选项正确，改正性维护就是修复软件运行中出现的bug；D选项正确，维护工作遵循软件生命周期流程能保障维护质量。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456663", "t": 2, "q": "以下关于软件需求规格说明书（SRS）的要求，正确的有？", "a": ["SRS需完整描述系统的功能需求、非功能需求与数据需求", "SRS需由开发团队单独编写，无需用户参与评审", "SRS需具有可验证性，即需求可通过测试等方式验证是否实现", "SRS需详细描述系统的模块设计与代码实现细节", "", ""], "r": "AC", "e": "A，SRS要涵盖功能、非功能和数据需求，正确；B，编写和评审都需用户参与，该项错误；C，SRS要能通过测试等验证需求实现，正确；D，SRS重点在需求，不涉及模块设计和代码实现细节，该项错误。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456664", "t": 2, "q": "以下关于C语言程序编译过程的说法，正确的有", "a": ["汇编阶段将C语言代码转换为汇编语言代码", "编译过程包括预处理、编译、汇编、链接四个阶段", "链接阶段将目标文件与库文件结合，生成可执行文件", "编译阶段将汇编代码转换为机器指令（目标文件）", "", ""], "r": "BC", "e": "编译过程含预处理、编译、汇编、链接四阶段。编译阶段把C代码转汇编代码，汇编阶段将汇编代码转机器指令（目标文件），链接阶段把目标文件和库文件结合成可执行文件。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456665", "t": 2, "q": "以下关于C语言函数参数传递的说法，正确的有", "a": ["结构体作为函数参数时，既可以进行值传递，也可以进行地址传递", "数组作为函数参数时，实际传递的是数组首元素的地址", "地址传递时，形参是实参的地址，通过形参可修改实参的值", "值传递时，形参是实参的副本，形参修改不影响实参", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456666", "t": 2, "q": "以下关于C语言预处理阶段的处理内容，正确的有", "a": ["展开#define定义的宏", "处理条件编译命令（如#ifdef）", "删除注释", "处理#include命令，嵌入指定文件", "", ""], "r": "ABCD", "e": "在C语言预处理阶段，会进行多项处理。会展开#define定义的宏，替换代码里宏的使用；会处理条件编译命令（如#ifdef）来决定哪些代码参与编译；会删除注释，减少代码量；还会处理#include命令，将指定文件内容嵌入到当前文件。ABCD四个选项内容均为预处理阶段处理内容。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456667", "t": 2, "q": "以下关于C语言运算符的说法，正确的有", "a": ["关系运算符的结果是1（真）或0（假）", "逻辑运算符&&和||具有短路求值特性", "逗号运算符的结果是最后一个表达式的值", "赋值运算符是右结合性，即a=b=c等价于a=(b=c)", "", ""], "r": "ABCD", "e": "A选项，关系运算结果确实用1和0表示真假；B选项，\\u0026\\u0026和||在满足条件时会短路求值；C选项，逗号运算符结果就是最后一个表达式的值；D选项，赋值运算符右结合，a=b=c 等价于 a=(b=c)。这些说法都正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456668", "t": 2, "q": "以下关于C语言字符串的说法，正确的有", "a": ["字符串常量存储在只读数据区，不可修改", "字符串是以'\\0'作为结束标志的字符序列", "strcmp函数比较字符串时，比较的是字符的ASCII码值", "可使用字符数组或字符指针存储字符串", "", ""], "r": "ABCD", "e": "A选项，字符串常量存于只读区，不能修改；B选项，C语言里字符串以'\\0'结尾；C选项，strcmp比较的就是字符ASCII码值；D选项，既可用字符数组也可用字符指针存字符串。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456669", "t": 2, "q": "以下属于软件测试\"黑盒测试\"方法的有？", "a": ["边界值分析: 针对输入输出的边界条件设计测试用例（如最大值、最小值）", "等价类划分: 将输入数据划分为有效等价类与无效等价类，减少测试用例", "场景法: 基于用户实际使用场景设计测试用例，验证端到端功能", "条件组合覆盖: 设计测试用例覆盖判定中所有条件的组合", "", ""], "r": "ABC", "e": "黑盒测试是基于功能的测试，不考虑内部代码结构。A边界值分析、B等价类划分、C场景法都是从软件功能和输入输出角度设计测试用例，属于黑盒测试。而D条件组合覆盖是关注代码中判定条件组合，属于白盒测试。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456670", "t": 2, "q": "以下属于软件测试\"静态测试\"的方法有？", "a": ["单元测试:执行代码验证单个模块功能", "文档评审:审查需求文档、设计文档的完整性与一致性", "系统测试:执行系统验证整体功能", "静态分析工具:通过工具分析代码的复杂度、潜在漏洞（如未定义变量）", "", ""], "r": "BD", "e": "静态测试不实际运行程序，主要对文档、代码进行审查分析。A选项单元测试和C选项系统测试都需执行代码，属于动态测试。B选项文档评审是对文档的审查，D选项用工具分析代码潜在问题，都不运行程序，属于静态测试。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456671", "t": 2, "q": "以下属于软件测试方法中黑盒测试方法的有", "a": ["等价类划分法", "因果图法", "边界值分析法", "路径覆盖法", "", ""], "r": "ABC", "e": "黑盒测试是基于功能的测试，不考虑内部代码结构。等价类划分法、因果图法、边界值分析法都是黑盒测试常用方法，而路径覆盖法是白盒测试方法关注程序内部路径。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456672", "t": 2, "q": "以下属于软件工程\"敏捷开发模型\"的核心思想与特点的有？", "a": ["采用迭代、增量的开发方式，快速交付可用版本", "开发过程严格遵循线性顺序，阶段划分明确", "以用户故事（User Story）作为需求载体，驱动开发", "强调客户参与，及时响应需求变更", "", ""], "r": "ACD", "e": "敏捷开发采用迭代、增量开发，快速交付可用版本，用用户故事驱动开发，重视客户参与和及时响应需求变更。而严格按线性顺序、阶段划分明确是瀑布模型特点。所以答案选ACD。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456673", "t": 2, "q": "以下属于软件工程\"瀑布模型\"的特点有？", "a": ["每个阶段结束后需进行评审，确保质量", "开发过程线性顺序，阶段划分明确", "适合需求稳定、变更少的项目", "支持开发过程中的需求动态调整", "", ""], "r": "ABC", "e": "瀑布模型是线性顺序开发，阶段划分清晰，每个阶段结束要评审保证质量，适合需求稳定少变更的项目，不支持开发中需求动态调整。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456674", "t": 2, "q": "以下属于软件工程基本原理的有", "a": ["采用现代程序设计技术", "实行严格的产品控制", "用分阶段的生命周期计划严格管理", "坚持进行阶段评审", "", ""], "r": "ABCD", "e": "软件工程基本原理包含采用现代程序设计技术、严格产品控制、分阶段生命周期计划管理、坚持阶段评审等。ABCD四个选项均符合软件工程基本原理。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456675", "t": 2, "q": "以下属于软件工程中瀑布模型的特点的有", "a": ["线性顺序的开发流程", "每个阶段结束需进行评审", "需求变更难以快速响应", "适合大型复杂且需求固定的项目", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456676", "t": 2, "q": "以下属于软件维护四种类型的有", "a": ["临时性维护", "改正性维护", "完善性维护", "预防性维护", "", ""], "r": "BCD", "e": "软件维护的四种类型为改正性维护、适应性维护、完善性维护和预防性维护。B选项改正性维护、C选项完善性维护、D选项预防性维护符合。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456677", "t": 2, "q": "以下属于系统设计阶段需遵循的设计原则的有", "a": ["信息隐藏", "低耦合", "高内聚", "功能最大化", "", ""], "r": "ABC", "e": "系统设计应遵循信息隐藏、低耦合、高内聚原则。信息隐藏可提高系统可维护性；低耦合降低模块间依赖；高内聚增强模块内部联系。而功能最大化不是系统设计阶段核心遵循原则，它可能导致系统复杂、资源浪费等问题。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456678", "t": 2, "q": "在软件测试中，下列关于单元测试的说法，正确的有？（　）", "a": ["单元测试通常由开发人员完成，而非测试人员", "单元测试可以发现模块内部的逻辑错误、语法错误", "单元测试的测试对象是软件中的最小可测试单元（如函数、模块）", "单元测试需要编写测试用例，验证单元的输入输出是否符合预期", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456679", "t": 2, "q": "在软件测试中，下列关于黑盒测试和白盒测试的区别，正确的有？（　）", "a": ["白盒测试基于软件内部代码逻辑，需了解代码结构", "黑盒测试和白盒测试不能结合使用，只能选择一种", "黑盒测试无法发现代码中的逻辑错误，只能发现功能错误", "白盒测试可以发现代码中的路径覆盖不全问题", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456680", "t": 2, "q": "在软件概要设计阶段，主要输出的文档与模型包括？", "a": ["概要设计说明书", "测试用例文档", "数据库概念模型（如ER图）", "模块结构图（如层次图、HIPO图）", "", ""], "r": "ACD", "e": "软件概要设计阶段主要确定软件的总体结构和模块划分等，会输出概要设计说明书、数据库概念模型、模块结构图等；测试用例文档是测试阶段的产物。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456681", "t": 2, "q": "在软件工程的风险控制中，常用的风险应对策略有？（　）", "a": ["风险接受（接受风险可能带来的损失，不采取额外措施）", "风险规避（改变项目计划，避免风险发生）", "风险转移（将风险的影响和责任部分或全部转移给第三方）", "风险缓解（采取措施降低风险发生的概率或影响）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456682", "t": 2, "q": "在软件工程的开发过程中，下列哪些文档属于开发阶段的重要文档？（　）", "a": ["测试计划和测试用例文档", "概要设计说明书", "用户操作手册", "详细设计说明书", "", ""], "r": "BD", "e": "开发阶段包括概要设计、详细设计等。概要设计说明书和详细设计说明书是开发阶段重要文档。测试计划和测试用例文档主要用于测试阶段；用户操作手册是软件交付后供用户使用的文档。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813854361456683", "t": 2, "q": "在软件工程的敏捷开发方法中，下列哪些属于敏捷的核心价值观（出自《敏捷宣言》）？（　）", "a": ["响应变化高于遵循计划", "工作的软件高于详尽的文档", "严格的阶段划分高于迭代交付", "个体和互动高于流程和工具", "", ""], "r": "ABD", "e": "《敏捷宣言》强调敏捷开发的核心价值观为个体和互动高于流程和工具、工作的软件高于详尽的文档、客户合作高于合同谈判、响应变化高于遵循计划。C选项严格的阶段划分不符合敏捷开发迭代交付的理念。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297216", "t": 3, "q": "瀑布模型是一种迭代式开发模型，适合需求频繁变更的项目。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "瀑布模型是线性顺序模型，不是迭代式开发模型，且它要求需求明确稳定，不适合需求频繁变更的项目。", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297217", "t": 3, "q": "软件测试的目的是证明软件没有缺陷，确保软件运行无错误。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件测试目的并非证明无缺陷和确保无错误，而是尽可能发现软件中的缺陷。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297218", "t": 3, "q": "软件测试能够发现软件中所有的bug，确保软件没有任何缺陷。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件测试受测试时间、测试方法、测试用例覆盖度等多种因素限制，不可能发现所有的bug，也无法确保软件没有任何缺陷。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297219", "t": 3, "q": "软件测试中的单元测试通常由测试人员完成，开发人员无需参与单元测试。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单元测试主要是对软件中的最小可测试单元进行检查和验证，一般由开发人员自己完成，因为开发人员对代码逻辑最清楚。所以题干说单元测试通常由测试人员完成且开发人员无需参与是错误的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297220", "t": 3, "q": "软件测试中的黑盒测试方法不关注软件内部实现逻辑，仅根据输入输出关系设计测试用例。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "黑盒测试就是把软件看作一个黑箱子，不考虑其内部结构和实现逻辑，只依据软件的功能需求来设计测试用例，通过输入数据看输出结果是否符合预期。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297221", "t": 3, "q": "软件测试中的黑盒测试需要了解软件的内部代码逻辑，才能设计出有效的测试用例。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "黑盒测试是把软件看作一个黑盒子，不考虑内部代码逻辑，仅依据软件的需求规格说明书来设计测试用例。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297222", "t": 3, "q": "软件测试中的回归测试仅需测试被修改的模块，无需测试其他相关模块，因为修改不会影响未改动的模块。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件修改后可能会产生涟漪效应，影响到其他相关模块，所以回归测试不仅要测试被修改的模块，也需要测试其他相关模块。", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297223", "t": 3, "q": "软件测试中的静态测试不需要执行代码，主要通过人工审查或工具分析代码、文档的质量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "静态测试确实无需执行代码，就是依靠人工审查或者工具对代码、文档等进行分析来评估质量。", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297224", "t": 3, "q": "软件测试中的系统测试是在集成测试之后进行的，其测试对象是整个软件系统，验证系统是否满足所有需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "系统测试顺序在集成测试后，它针对整个软件系统，目的就是验证系统是否符合所有需求。", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297225", "t": 3, "q": "软件单元测试的主要目标是验证模块间接口的正确性，发现模块集成后产生的问题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件单元测试主要针对软件中的最小可测试单元进行测试，目的是检查单个模块的功能是否正确，而验证模块间接口正确性、发现模块集成后问题是集成测试的目标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297226", "t": 3, "q": "软件概要设计阶段的主要任务是设计模块的内部逻辑结构，如使用流程图或伪代码描述。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件概要设计主要是确定软件系统的总体结构和模块划分等，而设计模块内部逻辑结构是详细设计阶段的任务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297227", "t": 3, "q": "软件工程的风险分析阶段仅需识别可能的风险，无需评估风险发生的概率和影响程度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。软件工程的风险分析阶段包括风险识别、风险评估等步骤，风险评估就需要评估风险发生的概率和影响程度，不能仅识别风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297228", "t": 3, "q": "软件工程的敏捷开发方法（如Scrum）强调通过长周期的开发阶段（如半年或一年）交付完整的产品，以确保产品质量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "敏捷开发方法（如Scrum）强调短周期迭代，快速交付可工作的软件版本，而非长周期开发阶段交付完整产品。", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297229", "t": 3, "q": "软件工程的敏捷开发中，每日站会（Daily Scrum）的主要目的是讨论具体的技术实现细节，解决开发中的技术难题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "每日站会主要目的是让团队成员同步进展、汇报遇到的问题和计划，而非讨论具体技术实现细节和解决技术难题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297230", "t": 3, "q": "软件工程的瀑布模型允许在开发过程中根据需求变更灵活调整各阶段的工作顺序。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "瀑布模型是线性顺序进行软件开发，各阶段有明确顺序且前一阶段完成后才进入下一阶段，不允许开发中根据需求变更灵活调整各阶段工作顺序。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297231", "t": 3, "q": "软件工程的原型模型中，抛弃型原型在验证需求或技术可行性后，会被进一步迭代完善，最终成为产品的一部分。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抛弃型原型目的是验证需求或技术可行性，验证完就会被抛弃，不会进一步迭代完善成为产品一部分。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297232", "t": 3, "q": "软件工程的增量模型将软件开发分为多个增量，每个增量交付部分功能，最终逐步集成为完整产品。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "增量模型就是把软件项目分解成多个增量，每个增量实现部分功能并交付，通过逐步累加最终形成完整产品。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297233", "t": 3, "q": "软件工程的增量模型与瀑布模型的主要区别在于，增量模型可以并行开发多个模块，而瀑布模型只能串行开发。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297234", "t": 3, "q": "软件工程中，高内聚指的是模块内部的功能集中，低耦合指的是模块之间的依赖程度低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297235", "t": 3, "q": "软件工程中，螺旋模型的每个迭代周期都包含\"计划-风险分析-开发-评审\"四个环节，核心是风险管控。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "螺旋模型将软件开发过程分为多个迭代周期，每个周期包含计划、风险分析、开发、评审四个阶段，其核心思想就是对软件开发过程中的风险进行管控。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297236", "t": 3, "q": "软件工程中，螺旋模型的每一次迭代都包含风险分析环节，因此适合风险较高的项目。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "螺旋模型将软件开发过程划分为多个阶段，每次迭代都会进行风险分析，能及时识别并应对可能出现的风险，所以适合风险较高的项目。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297237", "t": 3, "q": "软件工程中，螺旋模型结合了瀑布模型的线性顺序和原型模型的迭代特性，同时引入风险分析。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "螺旋模型把软件开发过程分解为多个阶段，每个阶段都包含制定计划、风险分析、实施工程和客户评估，结合了瀑布模型的顺序特点与原型模型的迭代特点，还引入了风险分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297238", "t": 3, "q": "软件工程中，敏捷开发模型采用迭代增量式开发，每个迭代周期交付一个可用的软件版本，快速响应用户反馈。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "敏捷开发强调迭代增量式开发，以短周期迭代来逐步完善软件，每次迭代都会交付一个可运行、可用的软件版本，能及时根据用户反馈调整后续开发，所以该描述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297239", "t": 3, "q": "软件工程中，瀑布模型的开发过程是迭代增量式的，支持需求在开发过程中动态调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "瀑布模型是线性顺序进行的，阶段间具有顺序性和依赖性，不支持迭代增量开发，且难以在开发过程中动态调整需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297240", "t": 3, "q": "软件工程中，软件测试应在软件编码完成后再开始，编码前无需进行测试。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件工程里，测试贯穿软件项目全生命周期，编码前如需求分析、设计阶段也需进行测试，以提前发现问题。", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297241", "t": 3, "q": "软件工程中，软件配置管理的核心是对软件版本进行控制，避免版本混乱。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件配置管理是通过技术和行政手段对软件项目进行管理和监督，其核心工作就是对软件版本进行有效控制，防止版本出现混乱，保障软件的完整性、可追溯性等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297242", "t": 3, "q": "软件工程中，软件生命周期是指软件从需求分析开始，到开发完成并交付使用的过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件生命周期是从软件产品的设想开始，到软件不再使用而结束的整个时期，不只是从需求分析开始到开发完成交付使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297243", "t": 3, "q": "软件工程中，软件质量属性包括可用性、可维护性、可扩展性、可靠性等，不包括开发成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件质量属性是软件本身的特性，包含可用性、可靠性、可维护性、可扩展性；开发成本属于项目管理指标，不属于软件质量属性，题干表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297244", "t": 3, "q": "软件工程中，原型模型的原型只能用于验证需求，不能作为最终产品使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "原型模型的原型有多种用途，不仅能验证需求，有些情况下经过完善可以作为最终产品使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297245", "t": 3, "q": "软件工程中，原型模型通过快速构建可运行的原型，帮助用户明确模糊的需求，适合需求不确定的项目。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "原型模型特点就是快速构建可运行原型，能让用户直观感受产品，从而明确原本模糊的需求，所以很适合需求不确定的项目。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297246", "t": 3, "q": "软件黑盒测试不依赖于软件内部实现逻辑，仅根据需求规格说明书设计测试用例。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "黑盒测试是把软件看作一个黑箱子，不考虑其内部结构和实现细节，依据需求规格说明书来设计测试用例。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297247", "t": 3, "q": "软件集成测试的自顶向下策略是从底层模块开始测试，逐步集成上层模块，需为上层模块编写驱动程序。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自顶向下策略是从顶层模块开始测试，逐步集成下层模块，需为下层模块编写桩程序；而从底层模块开始测试，逐步集成上层模块是自底向上策略，需为上层模块编写驱动程序。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297248", "t": 3, "q": "软件敏捷开发模型强调文档的完整性与规范性，要求编写详细的需求文档与设计文档。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "敏捷开发强调快速响应变化、客户参与和团队协作，更注重可工作的软件而非详尽文档，不追求文档的完整性与规范性，不要求编写详细的需求和设计文档。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297249", "t": 3, "q": "软件配置管理的核心是版本控制，通过管理软件的不同版本，确保各版本的一致性与可追溯性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "版本控制是软件配置管理的核心，它能有效管理软件不同版本，保证各版本一致性并实现可追溯。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297250", "t": 3, "q": "软件配置管理中的变更控制，主要是评估、批准或拒绝需求变更、代码变更，确保变更有序进行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件配置管理里的变更控制核心工作就是对需求变更、代码变更等进行评估，决定批准或拒绝，以此保障变更能有序开展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297251", "t": 3, "q": "软件适应性维护的目的是为了适应新的硬件、软件环境（如操作系统升级、数据库版本更新），修改软件以保证其正常运行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件适应性维护就是针对软件运行环境变化（包括新硬件、软件环境，像操作系统升级、数据库版本更新等），对软件进行修改以确保其正常运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297252", "t": 3, "q": "软件适应性维护是为了修复软件运行过程中发现的bug，确保系统正常运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件适应性维护是为使软件适应新的环境（如操作系统、硬件等）而进行的修改，修复软件运行中发现的bug属于纠错性维护。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297253", "t": 3, "q": "软件维护的成本通常占软件生命周期总成本的60%以上，甚至更高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件维护在软件生命周期中是长期且持续投入的阶段，包含纠错、改进、适应环境变化等工作，耗费大量人力、物力，成本占比常超60%甚至更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297254", "t": 3, "q": "软件维护的工作量通常占软件整个生命周期工作量的60%以上，其中完善性维护的占比最高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件维护工作量大，常占软件整个生命周期工作量60%以上，且完善性维护是为满足用户新需求对软件功能改进，占比通常最高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297255", "t": 3, "q": "软件维护工作中，完善性维护的占比最高，主要是为了满足用户新的功能需求或性能优化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在软件维护工作里，完善性维护旨在满足用户新功能需求和性能优化，且其占比通常是最高的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297256", "t": 3, "q": "软件维护中的适应性维护是指为适应新的硬件、操作系统等外部环境变化而修改软件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "适应性维护就是为使软件适应外部环境变化（如硬件、操作系统等）而对软件进行修改。所以该描述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297257", "t": 3, "q": "软件维护中的完善性维护是指修复软件在运行过程中发现的错误和缺陷。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。完善性维护是为了满足用户对软件提出的新功能与性能要求而进行的维护。修复软件在运行过程中发现的错误和缺陷是纠错性维护。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297258", "t": 3, "q": "软件维护中的完善性维护是指修改软件中存在的错误，以保证软件正常运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "完善性维护是为扩充功能和改善性能而进行的修改，修改软件中存在的错误以保证软件正常运行是纠错性维护。", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297259", "t": 3, "q": "软件维护中的预防性维护，是为了适应外部环境变化而进行的维护，提前修复潜在问题。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297260", "t": 3, "q": "软件系统测试中的性能测试，主要验证系统在高并发、大数据量场景下的响应时间与稳定性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "性能测试就是针对系统在高并发、大数据量等场景下，检验其响应时间和稳定性等指标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297261", "t": 3, "q": "软件系统的可维护性主要取决于软件的开发成本，开发成本越低，可维护性越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件系统可维护性主要和软件的架构设计、代码质量、文档完善程度等有关，而非开发成本，开发成本低不一定可维护性就高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297262", "t": 3, "q": "软件系统设计中的\"高内聚、低耦合\"原则是指，模块内部的元素关联性应尽可能强，模块间的依赖程度应尽可能低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“高内聚、低耦合”就是强调模块内部元素关联要强，模块间依赖程度要低，这有利于软件的开发、维护和扩展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297263", "t": 3, "q": "软件系统设计中的接口设计仅需考虑软件与外部系统的接口，无需考虑软件内部模块间的接口。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件系统设计中的接口设计既需考虑软件与外部系统的接口，也得考虑软件内部模块间的接口，这样才能保证软件整体的正常运行和各部分的协同工作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297264", "t": 3, "q": "软件详细设计说明书的主要内容是描述系统的模块划分与接口设计，为概要设计提供依据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件详细设计说明书是在概要设计之后进行的，是对概要设计的细化，主要描述模块内部的算法和数据结构等，而不是为概要设计提供依据，且描述系统模块划分与接口设计是概要设计的内容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297265", "t": 3, "q": "软件需求变更管理的核心是禁止所有需求变更，以确保项目按计划进行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件需求变更难以避免，禁止所有需求变更不现实也不合理，需求变更管理核心是有序控制和管理变更，而非禁止。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297266", "t": 3, "q": "软件需求规格说明书（SRS）的核心作用是描述软件系统的详细设计方案，包括模块内部的实现逻辑。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件需求规格说明书主要是明确软件系统“做什么”，描述用户对软件的功能、性能等需求，而非详细设计方案及模块内部实现逻辑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297267", "t": 3, "q": "软件需求规格说明书（SRS）的核心作用是描述系统的模块结构与接口设计，为编码提供依据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件需求规格说明书核心作用是明确描述软件的功能、性能、约束等需求，为软件开发、测试等提供基础，而非描述系统模块结构与接口设计。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297268", "t": 3, "q": "软件需求验证的主要目的是检查需求是否完整、一致、可实现，确保需求无歧义。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件需求验证就是要对需求进行全面审查，保证需求的完整性、一致性、可实现性且无歧义等。所以该描述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297269", "t": 3, "q": "软件需求验证的主要目的是确保需求的完整性、一致性与可行性，避免后续开发偏离需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件需求验证就是要检查需求是否完整、一致且可行，防止后续开发与需求不符。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297270", "t": 3, "q": "系统测试中的单元测试主要测试模块之间的接口是否正确。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单元测试主要是对软件中的最小可测试单元进行检查和验证，而测试模块之间接口是否正确是集成测试的内容。", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297271", "t": 3, "q": "系统设计阶段分为概要设计和详细设计，概要设计确定模块内部实现逻辑，详细设计划分系统模块。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法逻辑错误，概要设计是划分系统模块，详细设计才是确定模块内部实现逻辑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297272", "t": 3, "q": "需求变更控制是需求管理的核心任务之一，目的是规范需求变更流程，避免无序变更。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "需求变更控制在需求管理里很关键，它就是要让需求变更有规范流程，防止随意、无序变更。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297273", "t": 3, "q": "需求分析阶段的主要任务是确定软件\"怎么做\"，而软件设计阶段的主要任务是确定软件\"做什么\"。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。需求分析阶段主要是明确用户对软件的需求，即确定软件“做什么”；软件设计阶段则是根据需求分析的结果，给出软件的实现方案，也就是确定软件“怎么做”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297274", "t": 3, "q": "需求跟踪矩阵的主要作用是建立需求与后续设计、开发、测试成果之间的对应关系，确保需求被完全实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "需求跟踪矩阵能把需求和后续各阶段成果关联起来，可清晰查看需求是否在各环节落实，保证需求完整实现。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813855804297275", "t": 3, "q": "需求工程包括需求获取、需求分析、需求规格说明、需求验证和需求管理五个阶段。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "需求工程完整流程通常包含需求获取、分析、规格说明、验证和管理这五个阶段。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第6章 软件设计与开发（2）", "n": "基础练习题【含解析】 / 第6章 软件设计与开发（2）", "qs": [{"id": "2034813859549810688", "t": 1, "q": "在软件系统测试中，集成测试的主要目的是？", "a": ["验证单个模块内部的逻辑和功能是否正确", "验证各个独立模块拼接后，模块间的接口是否正确，是否存在交互错误", "验证软件在不同的硬件、操作系统环境下的兼容性", "验证软件系统是否满足用户的所有功能和非功能需求", "", ""], "r": "B", "e": "集成测试是将多个模块组合起来测试。A是单元测试目的；C是兼容性测试目的；D是系统测试目的。集成测试重点是验证模块拼接后接口及交互是否正确，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810689", "t": 1, "q": "在软件系统设计阶段，“模块耦合”是衡量模块间依赖程度的指标，下列哪种耦合方式的耦合度最低（最理想）？", "a": ["数据耦合", "内容耦合", "公共耦合", "控制耦合", "", ""], "r": "A", "e": "数据耦合仅通过数据参数传递信息，耦合度最低；内容耦合直接访问另一模块内部，耦合度最高；公共耦合通过公共数据环境耦合；控制耦合传递控制信息。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810690", "t": 1, "q": "在软件系统设计中，\"将系统分解为多个独立模块，每个模块仅关注自身功能，模块间通过定义明确的接口交互\"遵循的设计原则是？", "a": ["内聚性", "模块化", "信息隐藏", "耦合性", "", ""], "r": "B", "e": "题干描述的是把系统拆成独立模块，模块有自身功能且通过明确接口交互，这符合模块化设计原则的特征。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810691", "t": 1, "q": "在软件系统设计中，“模块内部各元素之间联系紧密，模块仅对外暴露必要接口”体现的是？", "a": ["低耦合、高内聚", "高耦合、低内聚", "低耦合、低内聚", "高耦合、高内聚", "", ""], "r": "A", "e": "模块内部元素联系紧密是高内聚，仅对外暴露必要接口意味着与外部联系少，是低耦合。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810692", "t": 1, "q": "在软件系统设计中，\"模块内聚\"是衡量模块内部元素关联性的指标，下列哪种内聚方式的内聚度最高（最理想）？", "a": ["偶然内聚", "逻辑内聚", "功能内聚", "通信内聚", "", ""], "r": "C", "e": "功能内聚指模块内所有元素共同完成一个功能，联系紧密，内聚度最高。而偶然内聚、逻辑内聚内聚度较低，通信内聚也不如功能内聚。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810693", "t": 1, "q": "在软件需求分析阶段，使用用例图（Use Case Diagram）的主要目的是？", "a": ["详细定义软件中每个类的属性、方法及类间的继承关系", "描述软件系统的内部模块结构和模块间的调用关系", "捕获系统的功能需求，明确用户与系统的交互场景", "展示软件系统的数据流向和数据处理过程", "", ""], "r": "C", "e": "用例图主要用于从用户角度描述系统功能，明确用户与系统交互场景，捕获系统功能需求。A是类图作用，B是模块结构图作用，D是数据流图作用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810694", "t": 1, "q": "在软件需求分析阶段，用于描述\"系统与外部实体之间数据交互关系\"的建模工具是？", "a": ["类图", "用例图", "状态图", "数据流图（DFD）", "", ""], "r": "D", "e": "数据流图用于描述系统与外部实体间的数据交互关系。类图主要展示类的结构和关系；用例图体现系统功能和参与者；状态图描述对象状态变化。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810695", "t": 1, "q": "在软件需求分析中，\"用例图\"中的\"参与者\"指的是？", "a": ["软件系统中的模块", "与系统交互的外部实体（人、设备、其他系统）", "软件系统的开发人员", "软件系统的测试人员", "", ""], "r": "B", "e": "用例图里参与者是和系统交互的外部实体，像人、设备、其他系统等。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810696", "t": 1, "q": "在软件需求规格说明书（SRS）中，不包含的内容是？", "a": ["系统功能需求", "模块接口设计细节", "系统性能需求", "系统数据需求", "", ""], "r": "B", "e": "软件需求规格说明书主要描述系统的需求，如功能、性能、数据等方面。而模块接口设计细节属于设计阶段内容，并非需求阶段。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810697", "t": 1, "q": "在软件需求规格说明书（SRS）中，下列哪项内容不属于其核心组成部分？", "a": ["功能需求（描述软件应实现的功能）", "软件的详细设计方案（如模块内部的流程图）", "接口需求（描述软件与外部系统、用户的接口）", "非功能需求（如性能、安全性、可用性需求）", "", ""], "r": "B", "e": "软件需求规格说明书主要聚焦于软件要实现的需求，而详细设计方案是后续设计阶段的内容，不属于需求范畴。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810698", "t": 1, "q": "在软件需求获取过程中，通过与用户代表、领域专家召开会议，共同讨论并明确需求的方法是？", "a": ["原型法", "访谈法", "头脑风暴法", "问卷调查法", "", ""], "r": "C", "e": "头脑风暴法是召集相关人员开会，大家共同讨论来明确需求。原型法是构建原型来获取需求；访谈法是一对一或一对多的交流；问卷调查法是通过问卷收集需求。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810699", "t": 1, "q": "在软件需求获取过程中，下列哪种方法最适合用于收集用户对现有系统的不满、期望及潜在需求，且能促进用户与开发团队的深度互动？", "a": ["问卷调查法", "访谈法（一对一或小组访谈）", "观察法（观察用户实际操作）", "文档分析法（分析现有需求文档）", "", ""], "r": "B", "e": "访谈法能直接与用户交流，获取用户对现有系统的看法、不满、期望及潜在需求，实现深度互动。问卷调查缺乏互动性；观察法侧重了解操作情况；文档分析主要基于已有文档，难以收集新需求和促进互动。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810700", "t": 1, "q": "在软件需求验证过程中，下列哪项不是需求验证的常用准则？", "a": ["需求的可实现性（在现有技术和资源下能否实现）", "需求的一致性（需求间无矛盾）", "需求的完整性（是否覆盖所有必要需求）", "需求的可变性（是否容易修改）", "", ""], "r": "D", "e": "需求验证常用准则包括可实现性、一致性、完整性等。而可变性强调是否容易修改，这并非需求验证时的常用准则，重点在于需求本身是否合理、可行等方面，而非修改难易。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810701", "t": 1, "q": "在C语言中，若要定义一个存储5个指向int类型数据的指针的数组，下列正确的声明方式是？", "a": ["int *p[5];", "int *[5]p;", "int p[5]*;", "int（　）[5];", "", ""], "r": "A", "e": "在C语言里，`int *p[5]` 表示定义一个包含5个元素的数组 `p`，数组每个元素都是指向 `int` 类型的指针。选项B语法错误；选项C写法错误，不能这样定义指针数组；选项D括号内为空，不是正确的声明方式。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810702", "t": 1, "q": "在C语言中，若要动态分配一块能存储10个int类型数据的连续内存空间，且确保分配失败时能进行错误处理，下列代码片段正确的是？", "a": ["int *p = malloc(10 * sizeof(int)); if (p == NULL) {/错误处理/}", "int *p = malloc(10, sizeof(int)); if (p == NULL) {/错误处理/}", "int *p = realloc(NULL, 10 * sizeof(int)); if (p != NULL) {/错误处理/}", "int *p = calloc(10, sizeof(int)); if (p = NULL) {/错误处理/}", "", ""], "r": "A", "e": "A选项使用`malloc`函数分配10个`int`类型大小的内存空间，分配失败时`p`为`NULL`，会进行错误处理，代码正确；B选项`malloc`函数调用格式错误；C选项`realloc`分配成功`p`不为`NULL`，这里判断条件错误；D选项`if (p = NULL)`是赋值操作，不是判断操作。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810703", "t": 1, "q": "在C语言中，若有#define MAX(a,b) ((a)>(b)？(a):(b))，则执行int x=MAX(3+2,4)后，x的值是", "a": ["7", "3", "4", "5", "", ""], "r": "D", "e": "宏定义是直接替换，MAX(3 + 2, 4)替换后为((3 + 2)>(4)?(3 + 2):(4))，3+2为5大于4，所以结果是5。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810704", "t": 1, "q": "在C语言中，若有函数void fun(int x, int *y)，调用时传入实参a和&b，以下说法正确的是", "a": ["函数形参x和*y都是值传递", "x的值改变会影响实参a", "函数形参x是地址传递，*y是值传递", "*y的值改变会影响实参b", "", ""], "r": "D", "e": "函数形参x是值传递，形参改变不影响实参；*y是通过指针传递，对*y操作就是对实参b操作，改变*y会影响实参b。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810705", "t": 1, "q": "在C语言中，若有如下代码:int a[5]={1,2,3,4,5}; int p=a+2; 则p的值和*(p+1)的值分别是？", "a": ["3和4", "2和3", "3和5", "2和4", "", ""], "r": "A", "e": "数组名a代表数组首地址，p = a + 2让p指向数组第3个元素（下标从0开始），所以p指向的值是3；p + 1指向第4个元素，*(p + 1)就是其值4。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810706", "t": 1, "q": "在C语言中，若有如下代码:int a=10, *p=&a, **pp=&p; 则下列表达式中，能正确表示变量a的值的是？", "a": ["*pp", "**p", "&*p", "**pp", "", ""], "r": "D", "e": "本题可根据指针的定义和操作来分析各选项。已知 `int a = 10, *p = \\u0026a, pp = \\u0026p;`，`p` 是指向 `a` 的指针，`pp` 是指向 `p` 的指针。 选项A：`*pp` 得到的是 `pp` 所指向的内容，即 `p` 的值，也就是 `a` 的地址，不是 `a` 的值。 选项B：`p` 是指针，`*p` 才是 `a` 的值，`p` 是对 `p` 指向的地址再次解引用，这会导致错误。 选项C：`\\u0026*p` 先对 `p` 解引用得到 `a`，再取 `a` 的地址，结果是 `a` 的地址，不是 `a` 的值。 选项D：`*pp` 得到 `p`，`pp` 相当于对 `p` 解引用，得到 `a` 的值。综上，能正确表示变量 `a` 的值的是 `pp`，答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810707", "t": 1, "q": "在C语言中，若有如下代码:int x=5,y=3; int z=(x++>y--)？x:y; 则执行后z的值是？", "a": ["5", "2", "6", "3", "", ""], "r": "A", "e": "答案：A表达式 `(x++ > y--) ? x : y` 的计算过程如下：1. 比较部分 `x++ > y--`： `x` 的初始值为 `5`，`y` 的初始值为 `3`。 比较 `5 > 3`，结果为真 (`true`)。 由于使用了后置递增/递减，`x` 和 `y` 的值在比较后才发生变化，即 `x` 变为 `6`，`y` 变为 `2`。2. 条件表达式结果： 因为比较结果为真，所以整个三元表达式的值取 `x` 的当前值，即 `5`（在递增之前的值）。因此，变量 `z` 的值为 `5`。", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810708", "t": 1, "q": "在C语言中，若有如下代码:typedef struct{int id;char name[20];}Student;Student stu={101,\"Zhang\"},*p=&stu;则下列表达式中，不能正确访问stu的name成员的是？", "a": ["*p.name", "stu.name", "(*p).name", "p->name", "", ""], "r": "A", "e": "在C里，结构体成员访问，用点运算符“.”访问结构体变量成员，用箭头运算符“->”访问结构体指针成员。A选项，“*p.name”因“.”优先级高于“*”，先算“p.name”，但“p”是指针无“name”成员，所以错误。B、C、D都能正确访问。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810709", "t": 1, "q": "在C语言中，若有如下函数定义:int fun(int a,int b){return a>b？a:b;}则该函数的功能是？", "a": ["返回a和b中的较大值", "返回a和b中的较小值", "计算a和b的差", "计算a和b的和", "", ""], "r": "A", "e": "函数中使用了条件运算符“?:”，当 a > b 时返回 a，否则返回 b，即返回 a 和 b 中的较大值。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810710", "t": 1, "q": "在C语言中，若有char str[10]=\"hello\"; 则strlen(str)和sizeof(str)的结果分别是", "a": ["5和10", "6和10", "5和5", "6和6", "", ""], "r": "A", "e": "strlen计算字符串实际长度，不包含字符串结束符'\\0'，“hello”长度为5；sizeof计算数组所占内存大小，str数组定义长度为10。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810711", "t": 1, "q": "在C语言中，若有int a[3][4];，则以下对数组元素a[1][2]的引用方式，错误的是", "a": ["*(a[1]+2)", "(a+14+2)", "((a+1)+2)", "( *(a+1))[2]", "", ""], "r": "B", "e": "二维数组a中，a是指向数组首行的指针，a + 1指向第二行，a[1]等价于*(a + 1) 。A选项*(a[1]+2)是正确引用方式；C选项*(*(a + 1)+2)也是正确的；D选项(*(a + 1))[2]同样正确；而B选项(a + 14 + 2)写法有误，不是正确的元素引用形式。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810712", "t": 1, "q": "在C语言中，若有int x=3, y=4;，则执行表达式x+=y*=2后，x和y的值分别是", "a": ["x=7, y=8", "x=11, y=8", "x=11, y=4", "x=7, y=4", "", ""], "r": "B", "e": "先算`y *= 2`，即`y = y * 2`，此时`y`变为 8；再算`x += y`，即`x = x + y`，`x`变为 11。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810713", "t": 1, "q": "在C语言中，下列关于函数递归调用的说法，正确的是？", "a": ["递归函数的执行效率通常高于非递归（迭代）实现的函数", "递归函数不需要有终止条件，编译器会自动处理", "递归调用可以无限进行，只要函数逻辑正确", "递归调用时，函数的局部变量会被多次创建，每次调用的局部变量存储在不同的栈帧中", "", ""], "r": "D", "e": "递归函数执行时因频繁函数调用开销大，效率通常低于迭代函数；递归函数必须有终止条件，否则会无限递归；递归不能无限进行，要有终止条件。而递归调用时，每次调用都会在栈上创建新栈帧，局部变量存于不同栈帧。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810714", "t": 1, "q": "在C语言中，下列关于结构体和共用体（union）的说法，正确的是？", "a": ["结构体的成员占用不同的内存空间，共用体的所有成员占用同一块内存空间", "结构体的大小等于所有成员大小之和，共用体的大小也等于所有成员大小之和", "结构体和共用体都不能嵌套定义（即成员不能是其他结构体或共用体）", "结构体和共用体的所有成员都占用同一块内存空间", "", ""], "r": "A", "e": "结构体各成员有独立内存空间，共用体所有成员共享同一块内存。结构体大小考虑内存对齐，不一定是成员大小简单相加；共用体大小是最大成员大小。二者都能嵌套定义。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810715", "t": 1, "q": "在C语言中，下列关于文件操作的说法，正确的是？", "a": ["fclose函数关闭文件后，仍可通过原文件指针操作该文件", "使用fopen函数打开文件时，若文件不存在，使用\"r\"模式也能成功创建文件", "fscanf函数用于从文件中读取格式化数据，其用法与scanf类似，但需指定文件指针", "使用\"w\"模式打开文件时，若文件已存在，会在文件末尾追加数据", "", ""], "r": "C", "e": "A选项，fclose关闭文件后原文件指针不能再操作该文件；B选项，“r”模式打开文件，文件不存在会打开失败，不能创建；D选项，“w”模式打开文件，若文件已存在会清空内容重新写入，“a”模式才是在末尾追加。C选项fscanf从文件读格式化数据，用法和scanf类似且要指定文件指针，说法正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810716", "t": 1, "q": "在C语言中，下列关于预处理指令的说法，错误的是？", "a": ["#include指令用于将指定文件的内容插入到当前文件的指令位置，分为<>和\"\"两种包含方式。", "#define定义的宏函数，其参数会进行类型检查，与普通函数一致。", "#define定义的宏替换是在编译预处理阶段进行的，不进行语法检查。", "#ifdef、#elif、#else、#endif用于条件编译，可根据条件决定是否编译某段代码。", "", ""], "r": "B", "e": "#define定义的宏函数只是简单的文本替换，不会对参数进行类型检查，和普通函数不同，B选项说法错误。A、C、D选项关于预处理指令的描述均正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810717", "t": 1, "q": "在C语言中，下列关于指针和数组的说法，错误的是？", "a": ["通过指针和数组下标都能访问数组元素，本质都是通过地址访问", "指针变量可以进行算术运算（如p++），数组名不能进行算术运算（如a++）", "指针变量存储的是内存地址，数组名存储的是数组所有元素的值", "数组名在大多数情况下可视为指向数组首元素的指针", "", ""], "r": "C", "e": "数组名代表数组首地址，并非存储数组所有元素的值，C选项说法错误。A选项，指针和下标访问数组元素本质是地址访问；B选项，指针可算术运算，数组名是常量地址不能运算；D选项，多数情况数组名可视为首元素指针。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810718", "t": 1, "q": "在C语言中，下列关于static关键字作用的说法，错误的是？", "a": ["static修饰的局部变量，其生命周期与程序一致，存储在静态数据区", "static修饰的函数，其作用域仅限于定义该函数的源文件", "static修饰的全局变量，其作用域仅限于定义该变量的源文件", "static修饰的局部变量，每次函数调用时都会重新初始化", "", ""], "r": "D", "e": "static修饰的局部变量只在首次函数调用时初始化，后续调用不再重新初始化。选项A、B、C对static作用描述正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810719", "t": 1, "q": "在C语言中，以下关于动态内存分配的说法，正确的是", "a": ["realloc函数只能扩大已分配内存的大小", "calloc(n, size)分配的内存会初始化为0", "free函数可多次释放同一块动态分配的内存", "malloc(0)会返回NULL指针", "", ""], "r": "B", "e": "A项realloc可扩大或缩小已分配内存大小；C项free多次释放同一块内存会导致未定义行为；D项malloc(0)不一定返回NULL，可能返回一个独特指针。而calloc分配的内存会初始化为0。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810720", "t": 1, "q": "在C语言中，以下关于全局变量和局部变量的说法，正确的是", "a": ["局部变量定义在函数内部，其作用域仅限于该函数。", "全局变量和局部变量可重名，在局部变量作用域内，全局变量优先。", "全局变量未初始化时，默认值为随机值。", "局部变量未初始化时，默认值为0。", "", ""], "r": "A", "e": "局部变量在函数内定义，作用域就是该函数；全局与局部变量重名时，局部变量优先；全局变量未初始化默认值为 0；局部变量未初始化值是随机的。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810721", "t": 1, "q": "C语言中，函数参数传递方式为\"值传递\"，以下关于值传递的说法，正确的是？", "a": ["实参的值会被拷贝到形参，形参修改会影响实参", "仅当实参为指针类型时，形参修改才会影响实参", "无论实参类型如何，形参修改都不会直接影响实参", "实参的地址会传递给形参，形参修改会影响实参", "", ""], "r": "C", "e": "值传递是将实参的值拷贝给形参，形参和实参是不同的内存空间，形参修改不会直接影响实参。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810722", "t": 1, "q": "C语言中，若函数声明为\"int fun(int x, int y);\"，以下函数调用方式错误的是？", "a": ["int a=3;fun(a,&a);", "fun((int)3.14,(int)4.9);", "fun(3+2,4*5);", "fun(3,4);", "", ""], "r": "A", "e": "函数声明表明`fun`函数的两个参数都是`int`类型。A选项中第二个参数`\\u0026a`是`int`类型变量`a`的地址，为`int *`类型，和函数参数要求的`int`类型不匹配，调用错误；B、C、D选项的参数都是`int`类型。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810723", "t": 1, "q": "C语言中，若有代码\"char str[]=\"hello\";char *p=str;\"，则以下表达式值为真的是？", "a": ["p == str[0]", "*(p+5) == '\\0'", "sizeof(str) == 5", "strlen（　） == 6", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810724", "t": 1, "q": "C语言中，若有代码\"int a=10; int *p=&a; int **pp=&p;\"，则以下表达式能正确获取a的值的是？", "a": ["**pp", "*pp", "pp", "&pp", "", ""], "r": "A", "e": "`pp` 是指向指针 `p` 的指针，`p` 指向变量 `a`，对 `pp` 进行两次解引用（`pp`）可获取 `a` 的值。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810725", "t": 1, "q": "C语言中，若有代码\"int x=3,y=5;int z=(x++>y--)？x:y;\"，则z的值为？", "a": ["3", "5", "6", "4", "", ""], "r": "B", "e": "先判断`x++>y--`，此时`x`为3，`y`为5，3不大于5，判断为假，取冒号后`y`的值。`y--`先使用`y`的值，之后`y`才减1，所以取`y`值为5。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810726", "t": 1, "q": "C语言中，若有如下代码\"int a[3][4];int(p)[4]=a;\"，则表达式(p+1)+2指向的是数组a中的哪个元素？", "a": ["a[1][3]", "a[0][2]", "a[1][2]", "a[0][3]", "", ""], "r": "C", "e": "`p` 是指向包含 4 个 `int` 元素数组的指针，`p+1` 指向 `a` 的第二行，`(p + 1)+2` 指向第二行往后数 2 个元素（这里每个元素是含 4 个 `int` 的数组），即 `a[1][2]`。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810727", "t": 1, "q": "C语言中，以下关于函数递归的说法，正确的是？", "a": ["递归函数的执行效率比非递归函数（如循环）更高", "递归函数的参数传递方式只能是值传递，不能是地址传递", "递归函数必须有递归出口，否则会导致栈溢出", "递归函数不能调用自身，只能调用其他函数", "", ""], "r": "C", "e": "递归需有递归出口来终止调用，不然会不断调用自身，使栈空间耗尽导致栈溢出。A项，递归函数执行效率通常低于非递归函数；B项，递归函数参数传递方式可以是值传递也可以是地址传递；D项，递归函数就是调用自身的函数。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810728", "t": 1, "q": "C语言中，以下关于数组的说法，错误的是？", "a": ["数组名是常量地址，不能被赋值（如a=p;不合法）", "数组的下标从1开始，最大下标为数组长度", "二维数组在内存中按行优先顺序存储", "可以通过指针变量遍历数组元素", "", ""], "r": "B", "e": "C 语言里数组下标从 0 开始，最大下标是数组长度减 1，B 选项说法错误；数组名代表数组首地址，是常量不能被赋值，A 正确；二维数组在内存按行优先存储，C 正确；能通过指针变量遍历数组元素，D 正确。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810729", "t": 1, "q": "C语言中，以下关于文件操作的说法，正确的是？", "a": ["fscanf函数用于从文件读取格式化数据，与scanf函数用法完全一致", "feof函数返回非0值表示文件读取到末尾，返回0表示还有数据可读", "fclose函数用于关闭已打开的文件，若不关闭可能导致数据丢失", "fopen函数打开文件时，若文件不存在则一定创建新文件", "", ""], "r": "C", "e": "A 选项 fscanf 需指定文件指针，和 scanf 用法有差异；B 选项 feof 判断到文件末尾返回非 0，未到末尾返回 0；D 选项 fopen 以特定模式打开不存在文件才创建，不是一定创建。C 选项，不关闭文件可能因缓冲区数据未写入而致数据丢失。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810730", "t": 1, "q": "C语言中，以下关于循环结构的说法，错误的是？", "a": ["do-while循环的循环体至少执行一次，无论条件是否成立", "while循环的条件判断表达式为空时，会构成死循环", "for循环的初始化、条件判断、增量表达式均可省略，但分号不能省略", "break语句用于跳出当前循环，continue语句用于终止整个循环", "", ""], "r": "D", "e": "break是跳出当前循环，continue是跳过本次循环剩余部分进入下一次循环，并非终止整个循环，D说法错误。A、B、C说法均正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810731", "t": 1, "q": "C语言中，以下关于预处理命令的说法，错误的是？", "a": ["#ifdef与#endif配合使用，用于条件编译，判断宏是否定义", "typedef用于为已有的数据类型定义别名，并不会产生新的data type", "#include命令用于将指定文件的内容插入到当前文件中", "#define定义的宏在预处理阶段进行文本替换，不进行类型检查", "", ""], "r": "B", "e": "答案：B选项B的描述有误。`typedef`确实用于为已有的数据类型定义别名，但它并不会创建一个新的数据类型，而是为现有的数据类型创建一个新的名称（或别名）。因此，选项B的说法是错误的。其他选项的解析如下：* A. `#ifdef`与`#endif`配合使用，确实用于条件编译，根据宏是否定义来决定是否包含某段代码。* C. `#include`命令确实用于将指定的文件内容插入到当前文件中，常用于包含头文件。* D. `#define`定义的宏在预处理阶段确实会进行文本替换，并且不会进行类型检查。但题目要求找出错误的说法，所以正确答案是B。", "ap": [false, false, false, false, false, false]}, {"id": "2034813859549810732", "t": 1, "q": "C语言中，以下关于指针的说法，错误的是？", "a": ["指针变量的大小与它指向的数据类型无关，仅与操作系统位数有关（如32位系统占4字节）", "空指针（NULL）是指向地址0的指针，不能直接访问其指向的内容", "野指针是未初始化或已释放的指针，访问野指针会导致未定义行为", "可以将一个int型指针直接赋值给一个char型指针，无需强制类型转换", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779840", "t": 2, "q": "在软件工程的敏捷开发中，下列哪些是Scrum框架中的重要事件？（　）", "a": ["每日站会（Daily Scrum）", "冲刺计划会议（Sprint Planning）", "冲刺回顾会议（Sprint Retrospective）", "冲刺评审会议（Sprint Review）", "", ""], "r": "ABCD", "e": "Scrum框架有几个关键事件，包括每日站会让团队成员同步信息；冲刺计划会议规划冲刺目标和任务；冲刺回顾会议总结经验教训；冲刺评审会议展示冲刺成果。ABCD选项均是Scrum框架重要事件。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779841", "t": 2, "q": "在软件工程的瀑布模型中，下列哪些是其包含的主要阶段？（　）", "a": ["编码实现阶段", "需求分析阶段", "概要设计阶段", "迭代冲刺阶段", "", ""], "r": "ABC", "e": "瀑布模型主要阶段有需求分析、设计（包括概要设计等）、编码实现等。迭代冲刺阶段是敏捷开发的概念，不属于瀑布模型。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779842", "t": 2, "q": "在软件工程的需求分析阶段，常用的需求建模方法有？（　）", "a": ["数据流图（DFD）", "状态图（State Diagram）", "实体-关系图（ER图）", "类图（Class Diagram）", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779843", "t": 2, "q": "在软件工程的原型模型中，下列哪些情况适合使用该模型？（　）", "a": ["开发团队对领域知识不熟悉，需通过原型探索需求", "项目进度紧张，需快速交付可用版本", "用户需求模糊，无法明确定义详细需求", "需要验证新的技术或设计方案的可行性", "", ""], "r": "ACD", "e": "答案：ACD原型模型适合在以下情况下使用： 开发团队对领域知识不熟悉，通过原型能更快探索需求，A 选项符合。 用户需求模糊无法明确定义详细需求时，原型可帮助明确需求，C 选项符合。 需要验证新的技术或设计方案可行性时，原型能提供实践检验的机会，D 选项符合。项目进度紧张需快速交付可用版本一般更适合用快速原型模型或者其他更强调快速交付的模型，B 选项不完全准确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779844", "t": 2, "q": "在软件工程的增量模型中，与瀑布模型相比，其优势有？（　）", "a": ["开发过程风险更低，可及时发现问题", "降低了需求变更的影响，便于灵活调整", "严格按照线性顺序开发，过程可控", "无需进行阶段性测试，节省测试时间", "", ""], "r": "AB", "e": "增量模型分阶段开发，能及时发现问题降低风险，也可灵活应对需求变更。瀑布模型严格线性顺序开发，且各阶段都需测试。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779845", "t": 2, "q": "在软件维护过程中，下列关于维护文档的说法，正确的有？（　）", "a": ["维护文档是软件配置管理的重要组成部分", "维护文档无需更新原有设计文档，只需单独保存", "维护文档应记录维护的原因、内容、修改的模块", "维护文档应便于后续维护人员查阅，了解历史修改", "", ""], "r": "ACD", "e": "维护文档是软件配置管理重要部分，要记录维护原因、内容、修改模块等，且便于后续人员查阅了解历史修改，同时维护文档可能需更新原有设计文档。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779846", "t": 2, "q": "在软件维护过程中，影响软件可维护性的因素有？（　）", "a": ["软件的可测试性（是否容易设计测试用例）", "软件的可理解性（代码和文档是否易理解）", "软件的可修改性（是否容易修改且不引入新错误）", "软件的可移植性（是否容易移植到其他环境）", "", ""], "r": "ABCD", "e": "软件可维护性受多方面因素影响，可测试性便于发现问题，可理解性利于人员读懂代码，可修改性确保修改顺利，可移植性方便在不同环境使用，ABCD这些都是常见影响因素。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779847", "t": 2, "q": "在软件系统测试中，下列哪些测试类型属于非功能测试？（　）", "a": ["安全性测试（验证软件是否能抵御未授权访问）", "兼容性测试（验证软件在不同操作系统下的运行情况）", "性能测试（验证软件在高并发下的响应时间）", "功能测试（验证软件功能是否符合需求）", "", ""], "r": "ABC", "e": "非功能测试关注软件除功能之外的特性。A选项安全性、B选项兼容性、C选项性能都属于非功能特性。而D选项功能测试是针对软件功能是否符合需求，属于功能测试。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779848", "t": 2, "q": "在软件系统设计中，下列关于\"接口设计\"的说法，正确的有？（　）", "a": ["接口设计完成后，需形成接口文档，供开发和测试人员使用", "接口设计包括用户接口（UI）设计，需考虑用户操作便捷性", "接口设计应考虑容错性，以确保系统稳定运行", "接口设计需明确接口的输入参数、输出参数及返回值类型", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779849", "t": 2, "q": "在软件系统设计中，下列关于\"模块化设计\"的原则，正确的有？（　）", "a": ["模块应具有独立性，即一个模块的修改不影响其他模块", "模块的接口应尽可能简单、清晰，便于理解和使用", "模块应具有高内聚性，即模块内部元素关联性强", "模块应具有低耦合性，即模块间依赖程度低", "", ""], "r": "ABCD", "e": "模块化设计强调模块独立、接口简单清晰、高内聚低耦合。A选项体现模块独立性；B选项说明接口特性；C选项高内聚是模块内部要求；D选项低耦合是模块间要求，ABCD都符合模块化设计原则。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779850", "t": 2, "q": "在软件系统维护中，下列哪些属于适应性维护的场景？（　）", "a": ["用户要求软件增加导出Excel报表的功能", "软件运行的服务器硬件更换为更高配置，需优化软件以利用新硬件资源", "软件在运行中出现数组越界错误，需修复该bug", "软件运行的操作系统从Windows 10升级到Windows 11，需修改软件以适配新系统", "", ""], "r": "BD", "e": "适应性维护是为使软件适应环境变化而进行的维护。A是功能扩充属完善性维护；C是修复错误属改正性维护；B更换硬件、D升级操作系统，都是环境变化，需修改软件适配，属适应性维护。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779851", "t": 2, "q": "在软件需求管理过程中，需求变更的管理流程通常包括？（　）", "a": ["需求变更申请（提交变更请求及理由）", "需求变更验证（验证变更后的功能是否正确）", "需求变更决策（审批是否同意变更）", "需求变更实施（执行变更，更新文档和代码）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779852", "t": 2, "q": "在C语言中，下列关于递归函数的说法，正确的有？（　）", "a": ["递归函数必须有明确的终止条件，否则会导致栈溢出", "递归函数可以解决一些迭代难以实现的问题，如汉诺塔问题", "递归函数的执行过程包括递推（调用自身）和回归（返回结果）两个阶段", "递归函数的执行效率通常低于迭代实现，因为会产生多次函数调用", "", ""], "r": "ABCD", "e": "递归函数要有终止条件，不然无限递归会致栈溢出；汉诺塔等用递归更易解决；执行含递推和回归两阶段；递归因多次函数调用，效率常低于迭代。ABCD四个选项说法都对。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779853", "t": 2, "q": "在C语言中，下列关于动态内存分配的说法，错误的有？（　）", "a": ["realloc函数调整内存大小时，若当前内存块后有足够空间，会直接扩展，否则会分配新空间并复制数据", "动态分配的内存位于栈区，局部变量位于堆区", "calloc函数分配的内存大小是第一个参数乘以第二个参数，且初始化为0", "动态分配的内存一旦释放，再次访问该内存地址属于合法操作", "", ""], "r": "BD", "e": "动态分配的内存位于堆区，局部变量位于栈区，B错误；动态分配的内存释放后，再次访问该内存地址是非法操作，D错误。A中realloc调整内存情况正确，C中calloc功能描述正确。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779854", "t": 2, "q": "在C语言中，下列关于函数指针的说法，正确的有？（　）", "a": ["函数指针不能作为函数的参数传递", "可以通过函数指针调用对应的函数", "函数指针可以指向任意类型的函数，无需匹配返回值和参数", "函数指针是指向函数的指针，存储的是函数的入口地址", "", ""], "r": "BD", "e": "函数指针存储函数入口地址，能用来调用对应函数；函数指针可作为函数参数；它需匹配函数返回值和参数类型。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779855", "t": 2, "q": "在C语言中，下列关于结构体的说法，正确的有？（　）", "a": ["结构体定义后，必须立即定义结构体变量，否则定义无效", "结构体变量可以作为函数的参数传递", "结构体成员的访问可以通过结构体变量和结构体指针两种方式", "结构体指针可以作为函数的返回值", "", ""], "r": "BCD", "e": "A选项，结构体定义后不一定要立即定义变量，定义依然有效；B选项，结构体变量能作为函数参数传递；C选项，可通过结构体变量和指针访问成员；D选项，结构体指针能作为函数返回值。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779856", "t": 2, "q": "在C语言中，下列关于逻辑运算符的说法，正确的有？（　）", "a": ["逻辑表达式的运算结果只能是1（真）或0（假）", "逻辑与运算符（　）具有短路特性，即若第一个操作数为假，第二个操作数不再计算", "逻辑与运算符（　）的优先级高于逻辑或运算符（||）", "逻辑或运算符（||）具有短路特性，即若第一个操作数为真，第二个操作数不再计算", "", ""], "r": "ABCD", "e": "C语言里逻辑表达式结果是1（真）或0（假）；逻辑与“\\u0026\\u0026”有短路特性，首操作数为假就不计算第二个；逻辑与优先级高于逻辑或；逻辑或“||”也有短路特性，首操作数为真就不计算第二个。ABCD都对。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779857", "t": 2, "q": "在C语言中，下列关于内存分配的说法，正确的有？（　）", "a": ["free函数用于释放动态分配的内存，释放后指针会自动变为NULL", "calloc函数用于动态分配内存，会将分配的内存初始化为0", "realloc函数用于调整已动态分配内存的大小，可能会移动原有数据", "动态分配的内存若不使用free释放，程序结束后会由操作系统回收", "", ""], "r": "BCD", "e": "A选项，free释放内存后指针不会自动变为NULL；B选项，calloc会初始化分配内存为0；C选项，realloc调整大小可能移动数据；D选项，程序结束后系统会回收未释放的动态内存。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779858", "t": 2, "q": "在C语言中，下列关于全局变量和局部变量的说法，正确的有？（　）", "a": ["全局变量和局部变量不能同名，否则会编译错误", "全局变量若未初始化，会被自动初始化为0", "局部变量若未初始化，其值是不确定的（随机值）", "局部变量定义在函数内部，其作用域仅限于该函数内部", "", ""], "r": "BCD", "e": "全局和局部变量可同名，局部会屏蔽全局，A错误；全局变量未初始化会自动初始化为0，B正确；局部变量未初始化值不确定，C正确；局部变量在函数内定义，作用域是该函数内部，D正确。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779859", "t": 2, "q": "在C语言中，下列关于文件操作的函数，正确的有？（　）", "a": ["fopen函数的返回值是FILE类型的指针，用于后续文件操作", "fgets函数用于从文件中读取一行字符串", "fputc函数用于向文件中写入一个字符", "fputs函数用于向文件中写入一个字符串", "", ""], "r": "ABCD", "e": "A选项，fopen打开文件后返回FILE类型指针用于后续操作；B选项，fgets可从文件读取指定长度字符串，常用来读一行；C选项，fputc能向文件写入一个字符；D选项，fputs可向文件写入一个字符串。ABCD描述都正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779860", "t": 2, "q": "在C语言中，下列关于循环结构的说法，正确的有？（　）", "a": ["for循环的初始化、条件判断、增量表达式均可省略，但分号不能省略", "while循环的条件判断在循环体执行前，若条件为假，循环体一次也不执行", "break语句用于跳出当前所在的循环或switch语句", "continue语句用于终止当前循环，直接开始下一次循环", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779861", "t": 2, "q": "在C语言中，下列关于预处理指令的应用，正确的有？（　）", "a": ["使用#undef取消已定义的宏，如#undef PI", "使用#include\"header.h\"包含自定义的头文件", "使用#ifdef DEBUG...#endif实现调试代码的条件编译", "使用#define定义宏函数，如#define MAX(a,b) ((a)>(b)？(a):(b))", "", ""], "r": "ABCD", "e": "A选项可通过#undef取消已定义宏；B选项用双引号包含自定义头文件是常见做法；C选项#ifdef结合#endif能实现调试代码条件编译；D选项宏函数定义正确，不过符号应为问号“?”。答案全对。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779862", "t": 2, "q": "在C语言中，下列关于运算符优先级的说法，正确的有？（　）", "a": ["关系运算符的优先级高于逻辑运算符（&&、||）", "逻辑非运算符（!）的优先级高于算术运算符", "赋值运算符（=）的优先级高于三目运算符（？:）", "括号（（　））的优先级最高，可改变运算符的默认优先级", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779863", "t": 2, "q": "在C语言中，下列关于指针数组和数组指针的说法，正确的有？（　）", "a": ["指针数组的本质是数组，其元素是指针", "int *p[5]定义的是指针数组", "指针数组和数组指针的用法完全相同，可互换使用", "数组指针的本质是指针，其指向一个数组", "", ""], "r": "ABD", "e": "指针数组本质是数组，元素为指针，如 int *p[5]就是指针数组；数组指针本质是指针，指向一个数组。而指针数组和数组指针用法不同，不能互换。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779864", "t": 2, "q": "在C语言中，下列关于字符串处理函数的说法，正确的有？（　）", "a": ["strlen函数用于计算字符串的长度，不包括字符串末尾的'\\0'", "strcpy函数用于将源字符串复制到目标字符串，会覆盖目标字符串原有内容", "strcmp函数用于比较两个字符串，若返回0表示两个字符串相等", "strchr函数用于在字符串中查找指定字符，返回该字符在字符串中的首次出现的地址", "", ""], "r": "ABCD", "e": "ABCD选项均正确。strlen算长度不包含'\\0'；strcpy复制时覆盖目标串内容；strcmp返回0表示两串相等；strchr查找字符返回首次出现地址。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779865", "t": 2, "q": "在C语言中，以下关于存储类别修饰符的说法，正确的有", "a": ["register修饰的变量存储在寄存器中，访问速度快", "static修饰的局部变量，其生命周期与程序一致", "auto修饰的变量是自动变量，存储在栈区", "extern修饰的变量是外部变量，可在多个源文件中共享", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779866", "t": 2, "q": "在C语言中，以下关于动态内存分配函数的说法，正确的有", "a": ["calloc函数可分配n个大小为size的连续内存块，并初始化为0", "malloc函数的原型是void*malloc(size_t size)", "realloc函数可调整已分配内存的大小，若调整失败则返回NULL", "动态分配的内存若不释放，程序结束后会自动回收", "", ""], "r": "ABC", "e": "A中calloc能按要求分配内存并初始化为0；B是malloc标准原型；C调整失败realloc返回NULL；D动态分配内存程序结束虽自动回收，但可能造成内存泄漏，最好手动释放。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779867", "t": 2, "q": "在C语言中，以下关于函数递归的说法，正确的有", "a": ["所有递归问题都可通过栈模拟实现非递归", "递归调用的执行过程包括递推和回归两个阶段", "递归函数必须有递归终止条件", "递归深度过大可能导致栈溢出", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779868", "t": 2, "q": "在C语言中，以下关于结构体和共用体（union）的区别，正确的有", "a": ["结构体各成员可同时赋值，共用体同一时间只能有一个成员有效", "结构体各成员占用独立内存空间，共用体所有成员共享同一块内存空间", "结构体成员的地址不同，共用体成员的地址相同", "结构体的大小是各成员大小之和，共用体的大小是最大成员的大小", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779869", "t": 2, "q": "在C语言中，以下关于数组的说法，正确的有", "a": ["数组元素的下标从0开始", "数组名是数组首元素的地址，是一个常量指针", "数组的大小在定义后不可动态修改", "二维数组在内存中按行优先的顺序存储", "", ""], "r": "ABCD", "e": "C语言里数组元素下标从0起，数组名代表首元素地址且是常量指针，数组大小定义后不能动态改，二维数组内存按行优先存。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779870", "t": 2, "q": "在C语言中，以下关于文件操作的说法，正确的有", "a": ["fgetc和fputc函数用于读写单个字符", "fscanf和fprintf函数用于格式化读写文件", "文件关闭后，若未保存数据，数据会丢失", "fopen函数打开文件失败时返回NULL", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779871", "t": 2, "q": "在C语言中，以下关于预处理命令的说法，正确的有", "a": ["#undef命令用于取消已定义的宏", "#define可定义不带参数的宏和带参数的宏（宏函数）", "#ifdef、#ifndef、#else、#endif可构成条件编译结构", "预处理命令必须位于源文件的开头", "", ""], "r": "ABC", "e": "A选项，#undef能取消已定义宏；B选项，#define可定义不带参和带参宏；C选项，ifdef等可构成条件编译；D选项，预处理命令不一定要在源文件开头。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779872", "t": 2, "q": "在C语言中，以下关于指针的操作，正确的有", "a": ["两个同类型指针可进行减法运算，结果为元素个数差", "void指针可以直接赋值给其他类型的指针", "指针变量可指向自身（如int *p = &p）", "指针可与整数进行加减运算（如p+1）", "", ""], "r": "AD", "e": "A选项，同类型指针相减结果是元素个数差；B选项，void指针需强制类型转换后才能赋值给其他类型指针；C选项，p是指针变量，\\u0026p是该指针变量的地址，类型不匹配；D选项，指针可与整数加减。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779873", "t": 2, "q": "C语言中，以下关于变量存储类型的说法，正确的有？", "a": ["auto类型变量存储在栈内存中，默认初始值为随机值", "static类型变量存储在全局/静态存储区，默认初始值为0，且值在函数调用间保持", "register类型变量建议存储在CPU寄存器中，以提高访问速度，不能取地址", "extern类型变量用于声明外部变量（在其他文件中定义），不分配内存", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779874", "t": 2, "q": "C语言中，以下关于错误处理的说法，正确的有？", "a": ["C语言提供try-catch语句用于捕获与处理异常", "文件操作函数（如fopen）可通过返回值判断是否成功（返回NULL表示失败）", "perror函数可根据errno的值，输出对应的错误描述信息", "strerror函数可将errno错误码转换为对应的错误信息字符串", "", ""], "r": "BCD", "e": "C语言没有try - catch语句，A错误；文件操作函数像fopen可通过返回NULL判断失败，B正确；perror能根据errno输出错误描述，C正确；strerror可把errno错误码转为错误信息字符串，D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779875", "t": 2, "q": "C语言中，以下关于函数参数的说法，正确的有？", "a": ["函数参数可以是基本数据类型（int、char等），也可以是指针、数组、结构体", "函数参数的个数没有限制，可根据需求定义任意多个参数", "当函数参数为数组时，实际传递的是数组的首地址，而非整个数组", "当函数参数为结构体时，默认是值传递，会拷贝整个结构体，效率较低", "", ""], "r": "ACD", "e": "A选项，C语言函数参数类型丰富，基本类型、指针、数组、结构体都能作为参数；B选项，函数参数个数虽无严格语法限制，但受系统和编译器限制，不能定义任意多个参数；C选项，数组作为参数传递时，传递的是首地址，并非整个数组；D选项，结构体作为参数默认值传递，会拷贝整个结构体，效率低。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779876", "t": 2, "q": "C语言中，以下关于函数的说法，正确的有？", "a": ["函数声明需包含函数返回值类型、函数名与参数列表，无需函数体", "函数可以嵌套定义，即一个函数内部可以定义另一个函数", "函数可以递归调用，即函数可以调用自身", "void类型的函数可以有返回值，只需在return语句后不写具体值", "", ""], "r": "AC", "e": "函数声明只需给出函数的基本信息，无函数体，A正确；C语言不允许函数嵌套定义，B错误；函数能递归调用自身，C正确；void类型函数无返回值，用return结束函数执行，不能有返回值，D错误。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779877", "t": 2, "q": "C语言中，以下关于结构体与共用体（union）的区别，正确的有？", "a": ["结构体与共用体的成员类型只能是基本数据类型（int、char等），不能是指针或数组", "结构体与共用体都支持嵌套定义", "结构体成员可以同时赋值并访问，共用体同一时间只能访问一个成员", "共用体的所有成员共用同一块内存空间，总大小等于最大成员的大小", "", ""], "r": "BCD", "e": "A错误，结构体和共用体成员类型可以是指针或数组等。B正确，二者都支持嵌套定义。C正确，结构体成员可同时赋值访问，共用体同一时间只能访问一个成员。D正确，共用体所有成员共用内存，大小等于最大成员。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779878", "t": 2, "q": "C语言中，以下关于内存管理的说法，正确的有？", "a": ["野指针是指指向已释放内存或未初始化的指针，访问野指针会导致程序崩溃", "栈内存由系统自动分配与释放（如局部变量），堆内存需手动分配与释放（如malloc）", "静态变量（static）存储在静态存储区，程序结束后才释放", "内存泄漏是指堆内存已分配但未释放，导致系统内存被耗尽", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779879", "t": 2, "q": "C语言中，以下关于数组与指针的关系，正确的有？", "a": ["指针数组int *p[5]中的每个元素都是一个int型指针，可以指向不同的int变量", "数组名是数组的首地址，本质是一个常量指针（不能被赋值）", "数组指针int (*p)[5]中的p只能指向int型数组，不能指向一个int型变量", "可以通过指针变量遍历数组元素，如for(p=a;p<a+5;p++) printf(\"%d\",*p);", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779880", "t": 2, "q": "C语言中，以下关于文件操作函数的应用，正确的有？", "a": ["使用fprintf(fp,\"%d%s\",10,\"hello\")向文件指针fp指向的文件写入格式化数据", "使用remove(\"data.txt\")删除指定的文件", "使用fopen(\"data.txt\",\"r\")以只读方式打开文本文件，若文件不存在则返回NULL", "使用fclose(fp)关闭文件后，仍可通过fp指针继续操作文件", "", ""], "r": "ABC", "e": "A选项fprintf可向文件写入格式化数据；B选项remove函数用于删除文件；C选项fopen以“r”模式打开文件，文件不存在返回NULL；D选项关闭文件后，fp指针不再能操作文件。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779881", "t": 2, "q": "C语言中，以下关于预处理的说法，正确的有？", "a": ["预处理命令不需要以分号结尾", "#define定义的宏在预处理阶段进行文本替换，不进行语法检查", "#undef命令用于取消已定义的宏，使其不再有效", "预处理在编译阶段之前进行，主要处理以#开头的命令", "", ""], "r": "ABCD", "e": "A选项，预处理命令通常以#开头，确实不需要以分号结尾；B选项，#define定义的宏在预处理时做简单文本替换，不做语法检查；C选项，#undef能取消已定义的宏；D选项，预处理在编译前进行，处理以#开头的命令。这四个选项说法都正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779882", "t": 2, "q": "C语言中，以下关于预处理命令的应用，正确的有？", "a": ["使用#define定义带参数的宏:#define ADD(x,y) (x)+(y)", "使用#define定义常量:#define PI 3.14159", "使用#include\"file.h\"与#include<file.h>的查找路径完全一致", "使用typedef为结构体定义别名:typedef struct{int id;char name[20];}Student;", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779883", "t": 2, "q": "C语言中，以下关于运算符优先级的说法，正确的有？", "a": ["括号（（　））的优先级最高，可改变运算符的默认优先级", "关系运算符的优先级高于逻辑运算符（&&、||）", "自增运算符（++）的优先级高于算术运算符", "赋值运算符（=）的优先级高于逗号运算符（,）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779884", "t": 2, "q": "C语言中，以下关于字符串处理函数的说法，正确的有？", "a": ["strcpy函数用于将源字符串复制到目标字符串，需确保目标字符串有足够空间", "strstr函数用于在目标字符串中查找源字符串第一次出现的位置，返回指向该位置的指针", "strcmp函数比较两个字符串，返回0表示两字符串相等，返回正数表示第一个字符串更大", "strcat函数用于将源字符串追加到目标字符串末尾，并不会覆盖目标字符串的'\\0'，而是添加在后面", "", ""], "r": "ABC", "e": "A选项，strcpy复制时要保证目标串空间足够，否则会越界；B选项，strstr就是找源串首次出现位置并返回指针；C选项，strcmp按字典序比较，返回0相等，正数表示第一个串大；D选项，strcat追加源串会覆盖目标串的'\\0'。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813862959779885", "t": 2, "q": "C语言中，以下关于字符串的说法，正确的有？", "a": ["字符串是由多个字符组成的序列，末尾必须以'\\0'作为结束标志", "字符串常量（如\"hello\"）存储在只读数据区，不能修改其内容", "可以使用char str[5]=\"hello\";定义字符串数组，系统会自动添加'\\0'", "使用strcpy函数复制字符串时，若源字符串长度超过目标字符串，会导致缓冲区溢出", "", ""], "r": "ABD", "e": "A选项，C语言字符串以'\\0'结尾；B选项，字符串常量存于只读区不可修改；C选项，“hello”含5个字符，数组长度5无空间存'\\0'；D选项，strcpy不检查目标空间大小，源串长超目标会溢出。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124288", "t": 3, "q": "需求规格说明书是需求分析阶段的核心输出，也是后续设计、开发、测试的依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "需求规格说明书是对软件需求的完整描述，准确记录需求分析结果，为后续设计、开发、测试等工作提供清晰依据，是需求分析阶段核心输出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124289", "t": 3, "q": "需求获取阶段的主要任务是通过访谈、问卷等方法，收集用户的需求信息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "需求获取就是运用各种方法收集用户需求信息，访谈、问卷是常见收集方式。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124290", "t": 3, "q": "需求验证的目的是确认软件是否满足设计要求，是否存在功能缺陷。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "需求验证是确认需求本身是否完整、一致、可行，确认需求有没有问题；验证软件满足设计要求属于软件测试，不是需求验证，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124291", "t": 3, "q": "在C语言中，递归函数的执行效率通常高于迭代函数，因为递归函数的代码更简洁。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "递归函数在调用时会不断创建新的栈帧，有额外的时间和空间开销，执行效率通常低于迭代函数，不能仅依据代码简洁就说执行效率高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124292", "t": 3, "q": "在C语言中，动态分配的内存（如malloc分配的内存）位于程序的堆区，而局部变量位于栈区，全局变量位于静态数据区。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "C语言里，malloc等函数动态分配的内存存于堆区；局部变量在函数调用时在栈区分配空间；全局变量和静态变量存于静态数据区。所以该描述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124293", "t": 3, "q": "在C语言中，函数的参数传递方式只有值传递，所谓的\"地址传递\"本质上也是将地址作为值传递给形参。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "C语言里函数参数传递有值传递和地址传递，地址传递是把实参地址传给形参，从本质看也是一种值传递，只是这个值是地址。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "20348138659461242
