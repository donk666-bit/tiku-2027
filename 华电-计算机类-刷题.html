94", "t": 3, "q": "在C语言中，函数的返回值类型可以是任意数据类型，包括结构体、指针，但不能是函数本身。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，函数返回值类型能是常见数据类型、结构体、指针等，但函数不能作为返回值类型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124295", "t": 3, "q": "在C语言中，函数指针可以作为函数的参数传递，用于实现回调函数的功能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "C语言里函数指针可当作函数参数传递，能实现回调函数功能，这是C语言常见特性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124296", "t": 3, "q": "在C语言中，宏定义（#define）是在编译预处理阶段进行文本替换，而typedef是在编译阶段为数据类型定义别名，两者的处理阶段不同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "宏定义在编译预处理阶段就会进行简单的文本替换，typedef是在编译阶段为数据类型创建别名，处理阶段确实不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124297", "t": 3, "q": "在C语言中，结构体变量和共用体变量的大小都是其所有成员大小之和。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "结构体变量大小一般是所有成员大小之和，但要考虑内存对齐；共用体变量大小是其最大成员的大小，并非所有成员大小之和。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124298", "t": 3, "q": "在C语言中，局部变量若未初始化，其值是不确定的（随机值），而全局变量和静态局部变量若未初始化，会被自动初始化为0。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "C语言里，局部变量存储在栈上，未初始化时值是随机不确定的；全局变量和静态局部变量存储在数据段，未初始化时会自动初始化为0。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124299", "t": 3, "q": "在C语言中，逻辑与运算符（　）和按位与运算符（　）的功能相同，仅适用的数据类型不同（&&用于逻辑值，&用于整数）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "逻辑与运算符“\\u0026\\u0026”是对逻辑值进行逻辑与运算，当两边都为真时结果才为真；按位与运算符“\\u0026”是对整数的二进制位进行逐位与运算，二者功能不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124300", "t": 3, "q": "在C语言中，三目运算符（？:）的优先级高于赋值运算符（=），因此表达式\"a=b>c？b:c\"的执行顺序是先计算b>c，再将结果赋值给a。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三目运算符优先级高于赋值运算符，所以先算b > c，根据结果从b、c中选值，再把该值赋给a。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124301", "t": 3, "q": "在C语言中，使用fopen函数打开文件时，若使用\"a\"模式（追加模式），当文件不存在时会创建该文件，且写入数据时会追加到文件末尾。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，“a”模式就是追加模式，若指定文件不存在则会创建，写入数据都会追加到文件末尾。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124302", "t": 3, "q": "在C语言中，使用free函数释放动态内存后，若未将指针置为NULL，该指针会成为野指针，再次访问可能导致程序崩溃。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "free函数释放动态内存后，原指针仍指向那块已释放的内存地址，若不将其置为NULL，再次使用该指针访问就可能引发不可预期的错误甚至程序崩溃，所以此说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124303", "t": 3, "q": "在C语言中，使用malloc函数动态分配的内存若未使用free函数释放，程序运行结束后，该内存会一直占用系统资源，无法被回收。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "程序运行结束后，操作系统会回收程序所占用的所有资源，包括用malloc分配却未用free释放的内存。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124304", "t": 3, "q": "在C语言中，数组名可以进行自增或自减运算（如\"int a[5];a++;\"），以指向数组的下一个元素。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言里数组名是常量指针，代表数组首元素地址，常量不能被修改，所以不能进行自增自减运算。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124305", "t": 3, "q": "在C语言中，数组名在任何情况下都可以视为指向数组首元素的指针。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言里，多数情况数组名可视为指向首元素的指针，但在\\u0026数组名、sizeof(数组名)等情况时，数组名代表整个数组，并非指向首元素的指针。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124306", "t": 3, "q": "在C语言中，通过结构体指针访问成员时，必须使用\"->\"运算符，不能使用\".\"运算符。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124307", "t": 3, "q": "在C语言中，预处理指令（如#define、#include）是在程序编译阶段执行的，会对源代码进行语法检查。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "预处理指令在编译前执行，主要进行文本替换等操作，不做语法检查，语法检查是编译阶段的事。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124308", "t": 3, "q": "在C语言中，指针变量的大小与它所指向的数据类型无关，仅与操作系统的位数有关（如32位系统中指针大小为4字节，64位系统中为8字节）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "指针变量存储的是内存地址，其大小取决于系统寻址能力，和所指向的数据类型无关，32位系统地址用32位表示即4字节，64位系统地址用64位表示即8字节。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124309", "t": 3, "q": "在C语言中，字符串常量存储在只读数据区，不能通过指针修改其内容（如\"char *p = \"abc\"; p[0] = 'A';\"会导致运行错误）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "C语言里，字符串常量存于只读数据区，试图通过指针修改其内容会破坏只读特性，引发运行错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124310", "t": 3, "q": "在C语言中，static修饰的全局变量和普通全局变量的区别在于，static全局变量的作用域仅限于定义它的源文件，而普通全局变量的作用域是整个程序。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，static修饰的全局变量作用域确实被限定在定义它的源文件，普通全局变量作用域是整个程序。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124311", "t": 3, "q": "C语言中，当函数参数为结构体时，为提高传递效率，可将参数定义为结构体指针，通过地址传递减少数据拷贝。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，结构体可能占据较大内存空间，若以结构体作为函数参数，会进行数据拷贝，影响效率。使用结构体指针作为参数，传递的是地址，避免了大量数据拷贝，能提高传递效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124312", "t": 3, "q": "C语言中，当函数参数为指针时，形参修改会直接影响实参，因为传递的是实参的地址。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，指针作为函数参数时，传递的是实参的地址，对形参所指向内容的修改就是对实参所指向内容的修改，会直接影响实参。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124313", "t": 3, "q": "C语言中，动态内存分配的内存位于堆区，而局部变量存储在栈区。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，动态内存分配（如使用malloc等函数）的内存是在堆区，局部变量是在函数执行时在栈区分配空间，所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124314", "t": 3, "q": "C语言中，二维数组在内存中按列优先的顺序存储，即先存储第一列元素，再存储第二列元素。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言中二维数组在内存中按行优先顺序存储，并非按列优先。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124315", "t": 3, "q": "C语言中，二维数组在内存中按列优先顺序存储，即先存储第一列元素，再存储第二列元素。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言里二维数组在内存中按行优先顺序存储，而非列优先。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124316", "t": 3, "q": "C语言中，函数的参数若为结构体变量，传递的是结构体的副本，修改形参不会影响实参。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "C语言里函数参数为结构体变量时，采用值传递，传递的是结构体副本，对形参修改不影响实参。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124317", "t": 3, "q": "C语言中，函数递归调用必须有明确的递归出口，否则会导致无限递归，最终引发栈溢出。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，递归调用是函数自己调用自己，若没有明确递归出口，函数会不断调用自身，栈空间持续被占用，最终导致栈溢出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124318", "t": 3, "q": "C语言中，函数递归调用时，若没有终止条件，会导致无限递归，最终引发栈溢出。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "函数递归调用若无终止条件，会不断调用自身，每次调用都会在栈上分配新的栈帧，栈空间有限，最终会因栈空间耗尽而导致栈溢出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124319", "t": 3, "q": "C语言中，函数可以嵌套定义，即一个函数内部可以定义另一个函数，以实现代码的封装。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言中不允许函数嵌套定义，不过允许函数嵌套调用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124320", "t": 3, "q": "C语言中，函数可以嵌套定义，即一个函数内部可以定义另一个函数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言不允许函数嵌套定义，但允许函数嵌套调用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124321", "t": 3, "q": "C语言中，宏定义#define MAX 100在预处理阶段会将代码中所有MAX替换为100。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "宏定义就是在预处理阶段进行文本替换，#define MAX 100会把代码里所有的MAX替换成100。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124322", "t": 3, "q": "C语言中，结构体变量的大小等于其所有成员变量大小之和，无需考虑内存对齐。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言中结构体存在内存对齐机制，结构体变量大小并不一定等于所有成员变量大小之和，要考虑内存对齐以提高访问效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124323", "t": 3, "q": "C语言中，两个同类型的指针可以进行加法运算，结果为两个指针指向地址的和。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言里，同类型指针相加无实际意义，不允许进行加法运算，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124324", "t": 3, "q": "C语言中，全局变量与静态变量（static）的默认初始值为0，局部变量的默认初始值为随机值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，全局变量和静态变量若未显式初始化，默认初始值是0；而局部变量若未初始化，其值是随机的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124325", "t": 3, "q": "C语言中，数组的大小可以在程序运行过程中根据需要动态修改。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言里普通数组大小在定义时就确定，无法在运行中动态修改，不过可借助动态内存分配函数（如malloc等）实现类似动态调整大小的效果，但这和直接修改数组大小概念不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124326", "t": 3, "q": "C语言中，数组名是一个常量指针，其值（指向的地址）不能被修改，如\"int a[5];a=a+1;\"是非法的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，数组名代表数组首元素地址，是常量指针，不能被重新赋值。像“int a[5];a=a + 1;”试图改变数组名指向的地址，这不符合规定，是非法的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124327", "t": 3, "q": "C语言中，数组名是一个常量指针，因此可以对数组名进行自增（++）操作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数组名是常量指针，其值不能被修改，自增（++）操作会改变指针的值，所以不能对数组名进行自增操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124328", "t": 3, "q": "C语言中，数组指针int(p)[5]与指针数组intp[5]的声明方式不同，代表的含义也不同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "int (*p)[5]是数组指针，p指向一个包含5个int元素的数组；int p[5]是指针数组，它是一个数组，数组里有5个int指针元素。二者声明和含义都不同。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124329", "t": 3, "q": "C语言中，条件编译命令（如#ifdef、#endif）可以根据宏是否定义，决定是否编译某段代码，常用于调试代码的开关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "C语言里条件编译命令（像#ifdef、#endif）能依据宏是否被定义，来决定是否编译特定代码段，常作为调试代码的开关使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124330", "t": 3, "q": "C语言中，文件操作函数fopen打开文件失败时，会返回NULL指针，因此在使用文件前需判断打开是否成功。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，fopen函数用于打开文件，当打开失败就会返回NULL指针。为避免后续操作因文件未成功打开而出现异常，使用文件前判断是否成功打开是必要操作。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124331", "t": 3, "q": "C语言中，文件操作完成后必须调用fclose函数关闭文件，否则会导致文件数据丢失或资源泄漏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，使用fclose函数关闭文件能确保缓冲区数据写入文件，释放文件资源。若不关闭，缓冲区数据可能未写入，还会造成资源泄漏。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124332", "t": 3, "q": "C语言中，指针变量的大小与它所指向的数据类型无关，仅与计算机系统的位数有关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，指针变量存储的是内存地址，地址的长度由计算机系统的位数决定，和所指向的数据类型没有关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124333", "t": 3, "q": "C语言中，指针变量的大小与它指向的数据类型无关，在32位操作系统中占4字节，64位操作系统中占8字节。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "指针变量存储的是内存地址，其大小取决于操作系统的寻址能力，32位系统地址用32位表示即4字节，64位系统地址用64位表示即8字节，与指向的数据类型无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124334", "t": 3, "q": "C语言中，指针变量可以指向任意类型的数据，无需进行类型转换。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言里不同类型指针指向不同类型数据，直接让指针指向不匹配类型数据通常需类型转换。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124335", "t": 3, "q": "C语言中，指针变量可以指向任意类型的数据，无需考虑类型匹配，如intp=(char)&a;是非法的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言中指针变量使用需考虑类型匹配，不同类型指针间赋值可能产生未定义行为，像“int *p = (char *)\\u0026a;”这种强制类型转换虽语法上可行但可能导致问题，不过不能说它非法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124336", "t": 3, "q": "C语言中，字符串常量\"hello\"存储在只读数据区，若通过指针修改其内容（如\"char *p = \"hello\"; *p = 'H';\"），会导致未定义行为（如程序崩溃）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "C语言里字符串常量存于只读数据区，不能被修改。代码中用指针指向字符串常量后尝试修改其内容，违反了只读规则，会引发未定义行为。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124337", "t": 3, "q": "C语言中，const类型变量的值不能修改，因此const int a=5; a=10;是合法的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "C语言里const修饰的变量值不可修改，题中“const int a = 5; a = 10;”试图修改const变量的值，不合法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124338", "t": 3, "q": "C语言中，const修饰的变量值在程序运行过程中不可修改，因此const变量也称为常量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124339", "t": 3, "q": "C语言中，extern关键字修饰的变量是外部变量，可在多个源文件中共享使用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "extern关键字用于声明一个外部变量，它能让该变量在多个源文件中被共享使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124340", "t": 3, "q": "C语言中，fopen函数打开文件时，若指定的文件不存在，使用\"r\"模式会创建新文件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在C语言里，“r”模式是只读模式，用此模式打开文件时，若文件不存在不会创建新文件，而是会打开失败。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124341", "t": 3, "q": "C语言中，malloc函数分配的内存若未通过free释放，程序结束后会自动归还给系统，因此无需担心内存泄漏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然程序结束后系统会回收malloc分配的内存，但在程序运行期间，若持续分配内存而不释放，会造成内存占用不断增加，导致内存泄漏，影响程序性能甚至使系统崩溃。所以不能因程序结束会自动回收就不担心内存泄漏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124342", "t": 3, "q": "C语言中，register类型变量存储在CPU寄存器中，因此可以通过取地址符&获取其地址。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "register类型变量存储在CPU寄存器里，寄存器没有内存地址，所以不能用取地址符\\u0026获取其地址。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124343", "t": 3, "q": "C语言中，sizeof运算符计算字符串数组的长度时，会包含末尾的'\\0';strlen函数计算时，不包含'\\0'。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，sizeof计算数组所占内存大小，字符串数组末尾的'\\0'也占内存，所以会包含；而strlen是计算字符串实际长度，遇到'\\0'就停止计数，不包含'\\0'。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124344", "t": 3, "q": "C语言中，static修饰的局部变量，其生命周期与程序一致，且每次函数调用时会保留上次的值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在C语言里，static修饰的局部变量存储在静态存储区，程序运行期间一直存在，生命周期和程序一致，函数调用结束也不会销毁，再次调用函数时会保留上次的值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124345", "t": 3, "q": "C语言中，strcat函数在追加字符串时，会自动检查目标数组是否有足够空间，避免缓冲区溢出。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "strcat函数不会自动检查目标数组是否有足够空间，使用时若目标数组空间不足会导致缓冲区溢出。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124346", "t": 3, "q": "C语言中，strcpy函数用于复制字符串，若源字符串长度大于目标字符串，会导致缓冲区溢出，引发安全问题。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "strcpy函数复制字符串时不会检查目标字符串的空间大小，当源字符串长度大于目标字符串时，会超出目标字符串的缓冲区，造成缓冲区溢出，存在安全隐患。", "ap": [false, false, false, false, false, false]}, {"id": "2034813865946124347", "t": 3, "q": "C语言中，strlen函数计算的字符串长度包含字符串末尾的'\\0'字符。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "strlen函数计算的是字符串中有效字符的长度，不包含字符串末尾的'\\0'字符。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第7章 信息新技术（1）", "n": "基础练习题【含解析】 / 第7章 信息新技术（1）", "qs": [{"id": "2034813871100923904", "t": 1, "q": "大数据\"数据可视化\"的主要目的是？", "a": ["将数据转换为二进制格式，便于计算机处理", "将复杂数据以图表等直观形式呈现，便于理解和分析", "将数据加密，防止泄露", "将数据压缩，减少存储占用", "", ""], "r": "B", "e": "数据可视化就是把复杂数据用图表等直观方式展示，方便人们理解和分析。A是数据存储处理方式；C是数据安全手段；D是数据存储优化方法。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923905", "t": 1, "q": "大数据\"数据挖掘\"的目的是？", "a": ["将数据转换为统一格式，便于存储", "将数据从一个存储设备迁移到另一个存储设备", "从大量数据中挖掘潜在的、有价值的规律或模式", "对数据进行加密处理，确保数据安全", "", ""], "r": "C", "e": "数据挖掘就是从海量数据里找潜在有价值的规律或模式。A是数据格式转换，B是数据迁移，D是数据安全处理，都不是数据挖掘目的。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923906", "t": 1, "q": "大数据4V特性中，\"Value\"（价值密度）的特点是？", "a": ["结构化数据价值密度低，非结构化数据价值密度高", "数据量越大，价值密度越高", "数据价值密度低，需从大量数据中提取有用信息", "价值密度仅与数据类型相关，与数据量无关", "", ""], "r": "C", "e": "大数据中数据量巨大，但有价值信息少，要从海量数据里提取有用信息，即价值密度低。A项非结构化数据价值密度不一定高；B项数据量和价值密度并非正相关；D项价值密度与数据量有关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923907", "t": 1, "q": "大数据处理工具中，Spark相比Hadoop的MapReduce，主要优势是？", "a": ["依赖HDFS存储，无法使用其他存储系统", "只能处理结构化数据，无法处理非结构化数据", "基于内存计算，处理速度更快", "仅支持批处理，不支持流处理", "", ""], "r": "C", "e": "Spark基于内存计算，能减少磁盘I/O，处理速度比Hadoop的MapReduce快很多。A选项Spark不局限于HDFS；B选项Spark能处理多种类型数据；D选项Spark支持流处理。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923908", "t": 1, "q": "大数据处理流程中，“数据清洗”环节的主要目的是？", "a": ["对数据进行分类、聚合等统计分析", "将处理后的数据存储到分布式数据库中", "去除数据中的噪声、缺失值、重复值等异常数据", "将非结构化数据转换为结构化数据", "", ""], "r": "C", "e": "数据清洗就是为了让数据更“干净”，主要就是去除噪声、缺失值、重复值等异常数据。A是数据分析环节；B是数据存储环节；D是数据预处理中数据结构化转换内容。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923909", "t": 1, "q": "大数据处理流程中，“数据清洗”环节的主要目的是？", "a": ["扩大数据的采集范围", "去除数据中的噪声、冗余和错误数据", "将数据转换为统一的存储格式", "提取数据中的关键特征值", "", ""], "r": "B", "e": "数据清洗就是对数据进行清理，去除其中的噪声、冗余和错误数据，让数据更干净准确。A是数据采集环节的事；C是数据转换工作；D是特征提取的内容。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923910", "t": 1, "q": "大数据处理中，\"分布式计算框架Hadoop\"的核心组件不包括？", "a": ["YARN（资源调度系统）", "MapReduce（分布式计算模型）", "HDFS（分布式文件系统）", "Spark（内存计算框架）", "", ""], "r": "D", "e": "Hadoop核心组件有YARN、MapReduce、HDFS，而Spark是独立于Hadoop的内存计算框架，不属于Hadoop核心组件。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923911", "t": 1, "q": "大数据处理中，“流处理”与“批处理”的主要区别在于？", "a": ["流处理实时处理持续产生的数据流，批处理处理静态的批量数据", "流处理无需存储数据即可进行处理，而批处理需要先将数据存储下来再处理", "流处理的处理速度通常快于批处理", "流处理和批处理都能够处理结构化和非结构化数据", "", ""], "r": "A", "e": "流处理针对持续产生的数据流实时处理，批处理针对静态批量数据。B选项流处理也可存储数据；C选项处理速度受多种因素影响，不能简单说流处理一定快；D选项这不是二者主要区别。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923912", "t": 1, "q": "大数据处理中，某任务需要对PB级非结构化数据（如用户行为日志）进行离线批量分析，且要求保证数据处理的高容错性与高扩展性，最适合的技术框架是？", "a": ["Spark Streaming", "Storm", "Flink", "Hadoop MapReduce", "", ""], "r": "D", "e": "题目要求对PB级非结构化数据进行离线批量分析，并保证高容错性与高扩展性。Hadoop MapReduce适合大规模数据的离线批量处理，且有高容错和高扩展能力。Spark Streaming、Storm、Flink更侧重于实时流处理。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923913", "t": 1, "q": "大数据存储中，适合存储非结构化数据（如图片、视频）的技术是？", "a": ["分布式文件系统（如HDFS）", "列式数据库（如HBase）", "关系型数据库（如MySQL）", "键值数据库（如Redis）", "", ""], "r": "A", "e": "非结构化数据量大且存储要求灵活，分布式文件系统可将大文件分块存于多节点，适合存储图片、视频这类非结构化数据；列式数据库、关系型数据库适合结构化数据；键值数据库多用于缓存等场景。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923914", "t": 1, "q": "大数据的\"4V\"特性中，\"Variety\"（多样性）主要指的是？", "a": ["数据的规模达到PB甚至EB级", "数据类型包括结构化、半结构化与非结构化", "数据的价值密度低，需挖掘才能体现价值", "数据产生的速度持续加快", "", ""], "r": "B", "e": "“Variety”（多样性）强调数据类型多样，涵盖结构化、半结构化与非结构化。A选项说的是数据规模大，对应“Volume”；C选项指价值密度低对应“Value”；D选项说数据产生速度快对应“Velocity”。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923915", "t": 1, "q": "大数据的\"Value\"（价值密度）特性指的是？", "a": ["大数据的价值与数据规模成正比，规模越大价值越高", "大数据的价值只能通过批量处理才能体现", "大数据中有用信息的占比低，需通过挖掘提取价值", "大数据的价值可无限复制，不会因使用而减少", "", ""], "r": "C", "e": "价值密度特性强调大数据里有用信息占比低，要经过挖掘才能提取价值。A选项价值与规模并非简单正比；B选项价值不只是批量处理体现；D选项与价值密度特性无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923916", "t": 1, "q": "大数据分析中，\"聚类分析\"属于哪种类型的数据分析方法？", "a": ["探索性分析", "描述性分析", "诊断性分析", "规范性分析", "", ""], "r": "A", "e": "聚类分析是在没有先验知识情况下，将数据对象分组，以发现数据内在结构和规律，这符合探索性分析通过对数据初步考察来发现潜在模式和关系的特点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923917", "t": 1, "q": "大数据分析中的\"关联规则挖掘\"，其主要目的是？", "a": ["将数据划分为多个不同的类别", "发现数据集中不同变量之间的潜在关联（如\"购买A商品的用户常购买B商品\"）", "提取数据中的关键特征值", "预测数据未来的发展趋势", "", ""], "r": "B", "e": "关联规则挖掘重点在于探寻数据集中变量间的潜在联系。A是分类任务；C是特征提取；D是预测分析。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923918", "t": 1, "q": "大数据具有4V特性，其中\"Velocity\"指的是数据的哪种特征？", "a": ["数据价值密度低", "数据类型多样（如结构化、非结构化数据）", "数据产生和处理速度快", "数据量巨大", "", ""], "r": "C", "e": "“Velocity”意为速度，在大数据4V特性里代表数据产生和处理速度快。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923919", "t": 1, "q": "大数据具有4V特征，其中\"Velocity\"指的是数据的哪种特性？", "a": ["数据处理速度快", "数据量巨大", "数据类型多样", "数据价值密度低", "", ""], "r": "A", "e": "Velocity在大数据4V特征里代表速度，即数据处理速度快。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923920", "t": 1, "q": "大数据挖掘中，某电商平台通过分析用户历史购买记录，为用户推荐\"常一起购买\"的商品（如购买手机时推荐手机壳），该挖掘任务属于？", "a": ["聚类分析", "关联规则挖掘", "异常检测", "分类分析", "", ""], "r": "B", "e": "关联规则挖掘就是发现数据中不同项目之间的关联关系，电商根据用户历史购买记录推荐“常一起购买”的商品，体现的正是这种关联关系。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923921", "t": 1, "q": "大数据中，“流处理”技术的适用场景是？", "a": ["仅适用于小规模数据，无法处理大规模数据", "处理历史积累的大量静态数据", "处理数据前需将所有数据收集完成", "实时处理持续产生的动态数据（如实时日志、实时交易数据）", "", ""], "r": "D", "e": "流处理主要特点是实时处理持续产生的动态数据。A选项，流处理可处理大规模数据；B选项处理历史大量静态数据是批处理场景；C选项流处理无需等所有数据收集完成。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923922", "t": 1, "q": "大数据中，\"数据湖\"的特点是？", "a": ["仅用于存储，无法进行数据处理和分析", "存储所有类型数据（结构化、半结构化、非结构化），保持数据原始格式", "数据需经过严格清洗后才能存入", "存储容量远小于数据仓库", "", ""], "r": "B", "e": "数据湖能存结构化、半结构化、非结构化等所有类型数据，且保持数据原始格式。A选项数据湖可处理分析；C选项数据湖不要求严格清洗；D选项数据湖存储容量通常大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923923", "t": 1, "q": "大数据中，“数据脱敏”技术的作用是？", "a": ["对敏感数据（如身份证号、手机号）进行处理，保护隐私", "提高数据处理速度", "增加数据的价值密度", "去除数据中的重复值", "", ""], "r": "A", "e": "数据脱敏就是对敏感数据处理来保护隐私。B提高处理速度、C增加价值密度、D去除重复值都不是数据脱敏的作用。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923924", "t": 1, "q": "大数据中，非结构化数据的典型例子是？", "a": ["企业ERP系统中的订单数据", "社交媒体中的文本评论、视频、图片", "关系数据库中的表格数据", "Excel表格中的数值数据", "", ""], "r": "B", "e": "非结构化数据是没有固定结构的数据，社交媒体中的文本评论、视频、图片无固定格式和结构。而企业ERP系统订单数据、关系数据库表格数据、Excel表格数值数据都有相对固定的结构。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923925", "t": 1, "q": "某企业采用混合云架构，将核心业务数据（如用户支付信息）存储在私有云，将非核心的营销推广数据存储与处理在公有云，这种架构设计的主要目的是？", "a": ["降低私有云的硬件采购成本", "简化企业IT架构的管理复杂度", "提高公有云的资源利用率", "在保障核心数据安全的同时利用公有云的弹性", "", ""], "r": "D", "e": "核心业务数据存私有云可保障安全，非核心数据存公有云能利用其弹性扩展等优势。A选项，数据分开存不一定降低私有云采购成本；B选项，并未简化管理复杂度；C选项不是主要目的，主要是为企业整体考虑。所以答案选D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923926", "t": 1, "q": "某企业采用云计算部署时，将核心业务系统部署在企业自建的私有云，非核心业务部署在公有云，这种部署模式属于？", "a": ["私有云", "公有云", "社区云", "混合云", "", ""], "r": "D", "e": "混合云结合了私有云和公有云，企业可将核心业务放私有云保障安全，非核心业务放公有云降低成本。本题企业核心业务在私有云、非核心业务在公有云，符合混合云特点。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923927", "t": 1, "q": "某企业将部分非核心业务数据存储在公有云，核心业务数据存储在私有云，且两者可实现数据互通，该企业采用的云计算部署模式是？", "a": ["混合云", "私有云", "社区云", "公有云", "", ""], "r": "A", "e": "混合云结合了公有云和私有云，企业可将非核心业务数据放公有云，核心业务数据放私有云并实现数据互通。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923928", "t": 1, "q": "某企业使用云计算服务时，无需关注服务器的物理位置、硬件型号等细节，只需关注所使用的资源量，这体现了云计算的哪种特性？", "a": ["资源池化", "抽象化（或透明化）", "按需付费", "服务可度量", "", ""], "r": "B", "e": "题干强调企业不用关注服务器物理位置、硬件型号等细节，即这些对企业是“透明”的，体现了云计算抽象化（或透明化）特性。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923929", "t": 1, "q": "某企业使用SaaS模式的云服务，该企业无需进行的操作是？", "a": ["使用云服务提供的软件功能", "根据需求调整软件的使用权限", "安装软件到本地服务器", "按使用量支付服务费用", "", ""], "r": "C", "e": "SaaS模式下软件由云服务提供商管理和维护，用户通过网络使用，无需将软件安装到本地服务器。A、B、D 都是SaaS模式下企业可进行的操作。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923930", "t": 1, "q": "某虚拟现实（VR）系统要求用户完全脱离真实环境，进入虚拟构建的场景，其实现的核心技术前提是？", "a": ["依赖真实环境的空间定位", "高分辨率的现实场景叠加", "对用户感官的全方位沉浸式模拟", "与真实环境的实时数据交互", "", ""], "r": "C", "e": "要让用户完全脱离真实环境进入虚拟场景，关键在于全方位模拟用户感官，让用户有沉浸感。A依赖真实环境定位与脱离真实环境相悖；B高分辨率现实场景叠加不符合进入虚拟场景要求；D与真实环境实时数据交互也不能让用户脱离真实环境。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923931", "t": 1, "q": "某虚拟现实应用需要用户在虚拟场景中自由移动，且设备能实时追踪用户位置和姿态，实现该功能的关键技术是？", "a": ["语音识别技术", "高分辨率显示技术", "动作捕捉与空间定位技术", "3D建模技术", "", ""], "r": "C", "e": "要实现用户在虚拟场景自由移动且设备实时追踪位置和姿态，需动作捕捉与空间定位技术。语音识别用于识别语音；高分辨率显示提升画面质量；3D建模构建虚拟场景。所以选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923932", "t": 1, "q": "某云服务商向用户提供虚拟机、存储磁盘等硬件资源，用户需自行安装操作系统和应用软件，该服务属于？", "a": ["SaaS", "FaaS（函数即服务）", "PaaS", "IaaS", "", ""], "r": "D", "e": "IaaS提供基础硬件资源，用户自行管理操作系统和软件，题中云服务商提供虚拟机、磁盘等硬件，用户自行装系统和软件，符合IaaS特点；SaaS是直接提供软件服务；FaaS侧重于提供函数运行环境；PaaS提供平台，用户主要开发应用。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923933", "t": 1, "q": "某云服务用户根据实际使用的存储容量和计算时长支付费用，未使用部分不收费，这体现了云计算的哪种特性？", "a": ["资源池化", "弹性扩展", "按需付费（或按量计费）", "高可用性", "", ""], "r": "C", "e": "题干中用户按实际使用的存储容量和计算时长付费，未用部分不收费，符合按需付费（或按量计费）的特点。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923934", "t": 1, "q": "某云计算部署模式中，云资源仅为某一个企业内部使用，该企业可自行管理或委托第三方管理，这种部署模式是？", "a": ["社区云", "私有云", "边缘云", "公有云", "", ""], "r": "B", "e": "私有云的云资源专为特定企业内部使用，企业可自主管理或委托第三方管理。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923935", "t": 1, "q": "某云计算服务商提供的服务中，用户需自行安装操作系统和应用软件，该服务属于哪种模式？", "a": ["FaaS（函数即服务）", "SaaS", "IaaS", "PaaS", "", ""], "r": "C", "e": "IaaS提供基础计算资源，用户可自行安装操作系统和应用软件；FaaS是让用户通过编写函数来运行应用；SaaS是直接提供软件服务，用户无需安装软件；PaaS提供平台，用户可在上面开发应用。所以符合题意的是IaaS。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923936", "t": 1, "q": "某云计算服务商为用户提供的存储服务中，用户数据被分散存储在多个物理服务器的不同硬盘上，且单个硬盘故障不会导致数据丢失，该存储技术是？", "a": ["本地存储", "存储区域网络（SAN）", "分布式存储", "网络附加存储（NAS）", "", ""], "r": "C", "e": "分布式存储将数据分散存于多个物理服务器不同硬盘，有容错能力，单个硬盘故障不致数据丢失。本地存储一般指设备自身存储；SAN是通过专用网络连接存储设备；NAS是连接在网络上的存储设备。所以选分布式存储。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923937", "t": 1, "q": "某云计算数据中心为应对业务高峰期（如电商大促）的突发流量，需在短时间内快速增加服务器数量，业务低谷时自动减少服务器数量，这体现了云计算的哪项核心特性？", "a": ["泛在接入", "弹性扩展", "按需付费", "资源池化", "", ""], "r": "B", "e": "本题关键在于理解题干中数据中心根据业务流量变化灵活调整服务器数量这一特点。 选项A：泛在接入强调的是用户可以随时随地通过各种终端设备接入云计算服务，与服务器数量的动态调整无关。 选项B：弹性扩展指的是云计算系统能够根据业务需求的变化，快速、灵活地增加或减少资源（如服务器数量），这与题干中数据中心在业务高峰期增加服务器、低谷期减少服务器数量的描述相符。 选项C：按需付费侧重于用户根据实际使用的资源量来支付费用，重点在于付费模式，并非资源的动态调整。 选项D：资源池化是将各类资源（如计算、存储等）整合为一个资源池进行统一管理和分配，没有突出根据业务需求动态调整资源数量的特性。综上，答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923938", "t": 1, "q": "区块链\"不可篡改性\"的实现基础是？", "a": ["区块链数据存储在加密的中心数据库中，只有管理员可修改", "中心节点拥有最高权限，禁止任何节点修改数据", "区块链数据一旦生成，将被永久删除，无法修改", "所有节点都存储完整的区块链数据副本，修改需同时篡改多数节点数据", "", ""], "r": "D", "e": "区块链是去中心化的，各节点都有完整数据副本，要篡改数据需同时搞定多数节点，难度极大，保证“不可篡改性”，A有中心数据库、B有中心节点与区块链去中心化不符，C数据不会永久删除。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923939", "t": 1, "q": "区块链\"侧链\"技术的主要目的是？", "a": ["增强主链的安全性，防止主链被攻击", "实现不同区块链间的互操作性和资产转移", "提高主链的中心化程度，便于管理", "替代主链，成为新的区块链网络", "", ""], "r": "B", "e": "侧链主要作用是连接不同区块链，实现它们之间的互操作性和资产转移。A选项侧链并非主要增强主链安全；C选项区块链本身是去中心化，侧链也不会提高主链中心化程度；D选项侧链是辅助主链，并非替代主链。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923940", "t": 1, "q": "区块链\"公有链\"的典型应用是？", "a": ["比特币（Bitcoin）网络", "政府部门的政务数据管理系统", "企业内部的财务对账系统", "医院的电子病历存储系统", "", ""], "r": "A", "e": "公有链是完全公开、任何人都可参与的区块链。比特币网络是典型公有链应用。而政府政务数据管理、企业财务对账、医院电子病历存储系统出于安全、隐私等考虑，多采用联盟链或私有链。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923941", "t": 1, "q": "区块链\"公有链\"与\"联盟链\"的主要区别在于？", "a": ["公有链的交易速度快于联盟链", "公有链对所有节点开放，任何人可参与记账;联盟链仅授权节点可参与", "公有链的安全性低于联盟链", "公有链的存储容量大于联盟链", "", ""], "r": "B", "e": "公有链是完全开放的，任何人都能参与节点和记账；联盟链是由特定组织或机构组成，只有授权节点能参与。A项联盟链交易速度通常更快；C项公有链安全性不一定低于联盟链；D项存储容量两者无必然大小关系。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923942", "t": 1, "q": "区块链\"供应链金融\"应用中，核心价值是？", "a": ["仅支持单一企业使用，无法实现多企业协同", "仅用于记录供应链中的物流信息，无法涉及资金流", "提高了供应链透明度，降低了信任成本，并且能够实现多企业间的数据共享", "增加供应链的中间环节，提高运营成本", "", ""], "r": "C", "e": "A选项区块链可实现多企业协同；B选项区块链能涉及资金流；D选项区块链会减少中间环节、降低成本。而C选项符合区块链“供应链金融”提高透明度、降信任成本和实现数据共享的核心价值。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923943", "t": 1, "q": "区块链\"共识机制\"的核心作用是？", "a": ["确保所有节点对区块链数据的修改权限一致", "提高区块链数据的传输速度", "解决分布式网络中节点之间的数据一致性问题", "仅用于验证节点的身份是否合法", "", ""], "r": "C", "e": "区块链是分布式网络，共识机制能让各节点就数据达成一致，保证数据一致性。A选项修改权限并非共识机制核心作用；B选项与提高传输速度无关；D选项验证身份不是核心作用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923944", "t": 1, "q": "区块链\"联盟链\"的特点是？", "a": ["对所有节点开放，任何人可参与记账", "仅允许授权节点参与网络，节点身份需审核", "数据完全公开透明，任何人可查询所有交易", "网络中只有一个中心节点，负责所有记账工作", "", ""], "r": "B", "e": "联盟链是一种需要授权的区块链，仅允许授权节点加入和参与网络，节点身份要经过审核。A和C是公有链特点，D是私有链特点。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923945", "t": 1, "q": "区块链的\"非对称加密算法\"中，公钥和私钥的正确使用方式是？", "a": ["公钥仅用于身份标识，不参与加密", "私钥用于加密数据，公钥用于解密数据", "公钥用于加密数据，私钥用于解密数据", "公钥和私钥均可同时用于加密和解密", "", ""], "r": "C", "e": "在区块链非对称加密算法里，公钥是公开的，用于加密数据；私钥是私密的，用于解密公钥加密的数据。A 选项公钥可参与加密；B 说法错误；D 公钥私钥功能有别，并非均可同时用于加密和解密。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923946", "t": 1, "q": "区块链的\"去中心化\"特性主要体现在？", "a": ["区块链网络依赖第三方机构进行节点身份认证", "只有中心节点拥有区块链数据的修改权限", "区块链网络中没有任何中心节点，所有节点地位平等", "区块链数据只能由中心节点进行查询", "", ""], "r": "C", "e": "“去中心化”就是没有中心节点，各节点地位平等。A依赖第三方机构认证就有中心化倾向；B只有中心节点有修改权是典型中心化；D只能由中心节点查询也是中心化。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923947", "t": 1, "q": "区块链的\"去中心化\"特性主要体现在？", "a": ["数据由多个节点共同维护，无单一控制节点", "仅由少数权威节点管理交易", "依赖第三方机构验证数据", "所有数据集中存储在一个核心节点", "", ""], "r": "A", "e": "“去中心化”就是没有单一控制中心，数据由多个节点共同维护。B选项少数权威节点管理、C选项依赖第三方、D选项数据集中在核心节点都不符合“去中心化”。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923948", "t": 1, "q": "区块链技术的\"去中心化\"特性主要体现在以下哪个方面？", "a": ["区块链网络中不存在任何中心节点或机构控制整个网络", "区块链中的数据可被所有节点随时修改，无需审批", "区块链中的数据只能在特定节点间传输，不对外公开", "区块链网络的运营成本由所有节点共同承担", "", ""], "r": "A", "e": "“去中心化”核心是无中心节点或机构控制网络。B选项数据修改有规则并非随意；C选项区块链数据公开透明；D选项运营成本承担与“去中心化”特性核心无关。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923949", "t": 1, "q": "区块链技术中，某共识机制不依赖节点进行大量计算来竞争区块生成权，而是根据节点持有的代币数量和持有时间来决定记账权，该机制是？", "a": ["工作量证明（PoW）", "权益证明（PoS）", "授权股权证明（DPoS）", "实用拜占庭容错（PBFT）", "", ""], "r": "B", "e": "工作量证明靠大量计算竞争记账权；权益证明按节点持有的代币数量和时间决定记账权；授权股权证明是节点投票选出代表记账；实用拜占庭容错是通过副本间消息传递达成共识。本题描述符合权益证明。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923950", "t": 1, "q": "区块链技术中，某共识机制通过节点\"质押\"一定数量的代币获得记账权，记账权分配概率与质押代币数量正相关，且无需大量计算资源消耗，该机制是？", "a": ["PBFT（实用拜占庭容错）", "PoW（工作量证明）", "PoS（权益证明）", "DPoS（委托权益证明）", "", ""], "r": "C", "e": "PoS是权益证明，通过节点质押代币获记账权，记账权概率和质押量正相关，且无需大量计算资源。而PBFT靠副本节点通信达成一致；PoW需大量计算；DPoS是节点投票选出代表记账。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923951", "t": 1, "q": "区块链技术中，能够解决\"双花问题\"、确保交易不可篡改的核心机制是？", "a": ["分布式账本", "智能合约", "共识机制（如PoW、PoS）", "非对称加密算法", "", ""], "r": "C", "e": "共识机制（如PoW、PoS）能让节点对交易达成一致性，解决“双花问题”，且通过这种共同确认保证交易不可篡改。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923952", "t": 1, "q": "区块链中，\"交易确认\"的过程是指？", "a": ["交易信息被广播到区块链网络，经节点验证后写入区块", "中心节点审核交易后，直接确认生效", "交易双方私下确认后，无需网络验证", "交易一旦发起，立即生效，无需确认过程", "", ""], "r": "A", "e": "区块链是去中心化的，交易信息广播到网络，节点验证后写入区块完成确认。B有中心节点不符合区块链特点；C区块链交易需网络验证；D交易需确认过程。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923953", "t": 1, "q": "区块链中，\"区块\"的核心组成部分不包括以下哪项？", "a": ["区块内的交易数据", "前一区块的哈希值", "共识机制算法代码", "时间戳", "", ""], "r": "C", "e": "区块链“区块”核心组成含交易数据、前一区块哈希值、时间戳等，而共识机制算法代码是整个区块链系统的一部分，并非区块核心组成。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923954", "t": 1, "q": "区块链中，\"区块\"的主要组成部分不包括？", "a": ["交易数据", "中心节点签名", "默克尔根", "时间戳", "", ""], "r": "B", "e": "区块链是去中心化的，不存在中心节点，也就没有中心节点签名。而交易数据、默克尔根、时间戳都是区块的主要组成部分。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923955", "t": 1, "q": "区块链中，\"区块\"的主要组成部分不包括以下哪项？", "a": ["交易数据", "区块头（含哈希值、时间戳等）", "前一区块的哈希值", "智能合约代码", "", ""], "r": "D", "e": "区块主要由交易数据、区块头（含哈希值、时间戳等）、前一区块哈希值等组成，智能合约代码不属于区块主要组成。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923956", "t": 1, "q": "区块链中，\"智能合约\"的核心特点是？", "a": ["一旦部署到区块链，即可根据预设条件自动执行，无需第三方干预", "仅能用于金融领域的转账交易，无法扩展到其他场景", "需人工审核后才能执行，确保交易安全", "可被任意节点修改，以适应业务需求变化", "", ""], "r": "A", "e": "智能合约核心就是按预设条件自动执行且无需第三方干预。B选项智能合约应用场景广泛，并非仅用于金融转账；C选项智能合约自动执行，无需人工审核；D选项智能合约部署到区块链后不可随意修改。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923957", "t": 1, "q": "区块链中，\"PoS（权益证明）\"共识机制与\"PoW（工作量证明）\"相比，最显著的优势是？", "a": ["大幅降低能源消耗", "验证交易的速度更慢", "更依赖节点的硬件算力", "需要消耗更多的计算资源", "", ""], "r": "A", "e": "PoW需大量计算，能耗高，PoS不主要依赖计算，能大幅降低能源消耗。B选项验证速度PoS通常更快；C选项PoS不更依赖硬件算力；D选项PoS消耗计算资源少。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923958", "t": 1, "q": "区块链中的\"智能合约\"实现自动执行的关键前提是？", "a": ["必须通过中心化机构授权", "需要人工确认交易结果", "满足预设的触发条件", "依赖单一节点的算力支持", "", ""], "r": "C", "e": "智能合约是一种代码程序，当预设的触发条件满足时就会自动执行。而它强调去中心化，无需中心化机构授权；也无需人工确认交易结果自动执行；且不依赖单一节点算力。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923959", "t": 1, "q": "物联网感知层中，某设备需实现远距离（千米级）、低功耗、低速率的无线数据传输，且主要用于智能表计（如水表、电表）的数据采集，该设备最可能采用的通信技术是？", "a": ["Bluetooth（蓝牙）", "LoRaWAN", "ZigBee", "Wi-Fi", "", ""], "r": "B", "e": "蓝牙、ZigBee、Wi-Fi 传输距离通常较短，不适合千米级远距离传输，而 LoRaWAN 能实现远距离、低功耗、低速率无线数据传输，适合智能表计数据采集。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923960", "t": 1, "q": "物联网感知层中，用于检测物体是否存在、距离远近的传感器是？", "a": ["光照传感器", "湿度传感器", "压力传感器", "超声波传感器", "", ""], "r": "D", "e": "超声波传感器可利用超声波特性检测物体是否存在及距离远近，而光照、湿度、压力传感器分别用于检测光照、湿度、压力情况。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813871100923961", "t": 1, "q": "物联网感知层中，RFID技术的核心功能是？", "a": ["实现设备间的短距离无线通信", "采集环境中的物理量（如温度、压力）", "将模拟信号转换为数字信号", "识别物体身份（如商品编号、资产标签）", "", ""], "r": "D", "e": "RFID即射频识别，主要作用是通过无线电信号识别特定目标并读写相关数据，也就是识别物体身份。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466368", "t": 2, "q": "大数据\"4V\"特性中，除了Volume（容量）、Variety（多样性），还包括（　）？", "a": ["Veracity（真实性）", "Visibility（可见性）", "Value（价值密度）", "Velocity（速度）", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466369", "t": 2, "q": "大数据\"Velocity\"（速度）特性的具体表现有（　）？", "a": ["数据价值衰减速度快（如实时数据过时即无价值）", "数据产生速度快（如每秒产生百万条日志）", "数据处理速度快（如实时分析数据流）", "数据存储速度快（如写入分布式文件系统）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466370", "t": 2, "q": "大数据处理过程中，属于数据预处理阶段的操作有哪些？", "a": ["数据集成", "数据脱敏", "数据清洗", "数据转换", "", ""], "r": "ACD", "e": "数据预处理是对原始数据进行采集、集成、清洗、转换等操作，使数据达到可以进行后续分析的质量要求。选项中数据集成、清洗和转换均是预处理常见操作，数据脱敏主要是为保护数据隐私，不属于典型预处理操作。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466371", "t": 2, "q": "大数据处理流程包含的主要阶段有（　）？", "a": ["数据可视化（如生成报表、图表）", "数据挖掘与分析（如建模、计算）", "数据存储（如存入HDFS、数据仓库）", "数据预处理（清洗、转换、集成）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466372", "t": 2, "q": "大数据存储技术中，常用的分布式文件系统有（　）？", "a": ["MySQL（关系型数据库）", "MongoDB（文档型数据库）", "GlusterFS（分布式文件系统）", "Ceph（分布式存储系统）", "", ""], "r": "CD", "e": "答案：CD大数据存储技术中，分布式文件系统主要用于处理大规模数据集，提供高性能、可扩展的文件存储服务。A. MySQL 是一个关系型数据库管理系统，不是分布式文件系统。B. MongoDB 是一个文档型数据库，虽然它支持分布式部署，但它本身不是一个分布式文件系统。C. GlusterFS 是一个开源的分布式文件系统，它能够将多台服务器上的存储空间组合成一个单一的、可扩展的存储池。D. Ceph 是一个开源的分布式存储系统，它提供了对象存储、块存储和文件系统接口，可以作为一个分布式文件系统使用。因此，选项 C 和 D 是正确的。", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466373", "t": 2, "q": "大数据的\"价值密度低\"特征体现在以下哪些场景？", "a": ["社交平台数据中，无用信息（如表情包、无意义文字）占比高", "传感器采集的环境数据中，重复数据较多", "企业销售数据中，结构化数据占比高", "海量用户行为数据中，有效决策信息占比低", "", ""], "r": "ABD", "e": "价值密度低指海量数据里有价值信息占比少。A选项无用信息多、B选项重复数据多、D选项有效决策信息占比低都体现了这一特征，而C选项结构化数据占比高与价值密度低无关。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466374", "t": 2, "q": "大数据分析中，属于有监督学习的算法有哪些？", "a": ["逻辑回归", "决策树", "K-均值聚类（K-Means）", "随机森林", "", ""], "r": "ABD", "e": "有监督学习需要有标签数据进行训练。逻辑回归、决策树、随机森林都是有监督学习算法，用于分类或回归任务。而K - 均值聚类是无监督学习算法，它无需标签数据，对数据进行聚类。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466375", "t": 2, "q": "大数据分析中常用的算法模型有（　）？", "a": ["决策树算法（用于分类与预测）", "关联规则算法（如Apriori，用于发现数据关联）", "支持向量机（SVM，用于分类）", "K-均值聚类算法（用于数据分组）", "", ""], "r": "ABCD", "e": "这些选项中的算法模型在大数据分析中都很常用。决策树可分类预测，关联规则能发现数据关联，支持向量机用于分类，K - 均值聚类可对数据分组。所以ABCD全选。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466376", "t": 2, "q": "大数据可视化技术的作用包括以下哪些？", "a": ["将复杂数据以图形化方式呈现，便于理解", "辅助决策者直观获取数据洞察", "减少数据中的冗余信息", "快速发现数据中的趋势和异常", "", ""], "r": "ABD", "e": "大数据可视化就是把复杂数据图形化，能让使用者直观理解，辅助决策者洞察数据，还可快速发现趋势和异常，但它不能减少数据中的冗余信息。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466377", "t": 2, "q": "区块链\"不可篡改\"特性的实现机制包括（　）？", "a": ["非对称加密技术（保护交易隐私）", "区块链式存储结构（每个区块包含前一区块哈希）", "智能合约（自动化执行交易）", "哈希算法（确保数据修改后哈希值变化）", "", ""], "r": "BD", "e": "区块链“不可篡改”依赖于区块链式存储结构，每个区块含前一区块哈希，若修改会使后续哈希链改变；哈希算法能让数据修改后哈希值变化从而易被发现。非对称加密主要保护隐私，智能合约用于自动执行交易，与“不可篡改”实现机制关联不大。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466378", "t": 2, "q": "区块链\"非对称加密技术\"的主要作用有（　）？", "a": ["确保交易信息的机密性", "实现数字签名，确认交易发起者身份", "生成用户的公钥与私钥，实现身份认证", "防止区块数据被篡改", "", ""], "r": "ABC", "e": "非对称加密有公钥和私钥，公钥可公开，私钥私密，能生成公私钥用于身份认证，私钥签名可确认身份，还能保障信息机密性。而防止区块数据被篡改主要靠哈希算法和共识机制等。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466379", "t": 2, "q": "区块链\"联盟链\"的特点有（　）？", "a": ["数据仅对联盟内节点可见，隐私性较好", "去中心化程度低于公有链", "交易确认速度快于公有链", "适合企业间的协同业务场景（如供应链）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466380", "t": 2, "q": "区块链共识机制的主要作用有（　）？", "a": ["确保区块链网络中节点对区块数据的一致性认可", "防止恶意节点篡改数据", "提高交易处理速度", "分配区块的记账权", "", ""], "r": "ABD", "e": "共识机制能让节点对区块数据达成一致，防止恶意篡改，还会分配记账权，但主要目的并非提高交易处理速度。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466381", "t": 2, "q": "区块链技术的核心特性包括以下哪些？", "a": ["匿名性", "不可篡改", "透明可追溯", "智能合约自动执行", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466382", "t": 2, "q": "区块链技术的核心特性有（　）？", "a": ["透明可追溯", "去中心化", "高能耗", "不可篡改", "", ""], "r": "ABD", "e": "区块链具有透明可追溯、去中心化、不可篡改等核心特性，而高能耗是其缺点并非核心特性。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466383", "t": 2, "q": "区块链在金融领域的应用场景包括以下哪些？", "a": ["跨境支付", "供应链金融", "资产证券化", "信用评级", "", ""], "r": "ABC", "e": "答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466384", "t": 2, "q": "区块链中，“分布式账本”的特点包括以下哪些？", "a": ["账本数据公开透明（对授权节点）", "账本数据不可篡改", "账本由中心节点统一管理", "账本数据实时同步更新", "", ""], "r": "ABD", "e": "区块链分布式账本是去中心化的，不由中心节点统一管理，C错误；它对授权节点公开透明，数据不可篡改且能实时同步更新，A、B、D正确。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466385", "t": 2, "q": "区块链中，\"双花问题\"指的是同一笔数字资产被重复花费的问题，解决该问题的技术手段有哪些？", "a": ["分布式账本同步", "时间戳（记录交易时间）", "共识机制（如PoW、PoS）", "非对称加密算法", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466386", "t": 2, "q": "区块链中，属于公有链的特点有哪些？", "a": ["安全性高（依赖大量节点）", "对所有人开放，任何人可参与记账", "适合存储敏感商业数据", "去中心化程度高", "", ""], "r": "ABD", "e": "公有链对所有人开放，任何人可参与，节点众多使得去中心化程度高，且依赖大量节点保证安全性。但它公开透明，不适合存敏感商业数据。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466387", "t": 2, "q": "区块链中，智能合约的特点包括以下哪些？", "a": ["执行结果不可篡改", "自动触发执行", "不依赖第三方机构验证", "代码在部署后难以修改", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466388", "t": 2, "q": "物联网感知层常用的传感器类型有（　）？", "a": ["温湿度传感器", "射频识别（RFID）标签", "全球定位系统（GPS）模块", "摄像头", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466389", "t": 2, "q": "物联网感知层常用的技术设备有哪些？", "a": ["网关设备", "传感器（如温度、湿度传感器）", "摄像头", "RFID标签与读写器", "", ""], "r": "BCD", "e": "物联网感知层负责采集信息，传感器、摄像头、RFID标签与读写器都能直接获取物理世界的数据。网关设备主要用于不同网络间协议转换和数据转发，属于网络层。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466390", "t": 2, "q": "物联网感知层设备的主要特点有（　）？", "a": ["低成本（适合大规模部署）", "高计算能力（实现复杂数据处理）", "低功耗（适应电池供电）", "小体积（便于安装）", "", ""], "r": "ACD", "e": "物联网感知层设备需大规模部署，所以要有低成本特性；为减少频繁更换电池等维护工作，要低功耗；为便于在不同场景安装，需小体积。而感知层设备一般进行简单数据采集和初步处理，并非高计算能力实现复杂数据处理。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466391", "t": 2, "q": "物联网平台层的核心功能包括（　）？", "a": ["设备接入与管理", "数据存储与预处理", "无线信号传输", "应用开发与部署", "", ""], "r": "ABD", "e": "物联网平台层要对设备和数据进行处理及支持应用，设备接入与管理是基础，能让各类设备连入平台；数据存储与预处理可管理和初步处理设备产生的数据；应用开发与部署能基于平台数据开发应用。而无线信号传输是网络层的功能。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466392", "t": 2, "q": "物联网网络层常用的通信技术有（　）？", "a": ["ZigBee", "蓝牙", "NB-IoT（窄带物联网）", "Lora", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466393", "t": 2, "q": "物联网网络层常用的通信技术有哪些？", "a": ["LoRa", "5G", "NB-IoT", "ZigBee", "", ""], "r": "ABCD", "e": "LoRa、5G、NB - IoT、ZigBee都是物联网网络层常用通信技术。LoRa适用于远距离低功耗；5G高速大容量；NB - IoT低功耗广覆盖；ZigBee近距离低速率。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466394", "t": 2, "q": "物联网网络层的主要功能有（　）？", "a": ["将感知层采集的数据传输到平台层", "进行数据的预处理与过滤", "实现不同设备之间的通信互联", "提供网络安全保障（如数据加密、访问控制）", "", ""], "r": "ACD", "e": "物联网网络层是连接感知层与平台层的桥梁，主要负责把感知层采集的数据传送到平台层，同时要保障不同设备通信互联及网络安全。B选项数据预处理与过滤主要是感知层的部分功能，不是网络层主要功能。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466395", "t": 2, "q": "物联网应用层的典型应用领域有（　）？", "a": ["智能交通（如车联网、智能红绿灯）", "工业互联网（如智能工厂、设备监控）", "智能家居（如智能家电控制、安全监控系统）", "健康医疗（如远程医疗监护、智能穿戴设备）", "", ""], "r": "ABCD", "e": "物联网应用层涉及众多领域，ABCD选项中的智能交通、工业互联网、智能家居、健康医疗都是物联网应用层常见的典型应用场景。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813872321466396", "t": 2, "q": "物联网中，安全防护技术包括以下哪些？", "a": ["设备访问控制（如权限管理）", "固件安全（如防篡改）", "数据加密技术（如传输加密）", "设备身份认证（如密钥认证）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010176", "t": 3, "q": "大数据\"流处理\"技术处理数据时，需要等待所有数据收集完成后再进行处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据“流处理”强调实时性，是对实时产生的数据流进行即时处理，并非等待所有数据收集完成后再处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010177", "t": 3, "q": "大数据\"数据仓库\"主要存储非结构化数据，且保持数据的原始格式，不进行预处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据仓库主要存储结构化数据，且通常会对数据进行预处理。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010178", "t": 3, "q": "大数据\"数据湖\"中的数据需要经过严格的预处理和结构化转换后才能存入。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。数据湖可存储原始的、未经处理的数据，无需经过严格预处理和结构化转换就能存入，它能容纳各种类型数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010179", "t": 3, "q": "大数据\"数据可视化\"技术仅能将数据以柱状图、折线图等简单形式呈现，无法呈现复杂数据关系。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据可视化技术不仅能呈现柱状图、折线图等简单形式，还可通过复杂的图形、图表等呈现复杂数据关系，如热力图、树状图等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010180", "t": 3, "q": "大数据\"数据清洗\"环节的主要任务是去除数据中的有用信息，保留无用数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据清洗是去除数据中的无用信息，保留有用数据，题中说法与实际相反。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010181", "t": 3, "q": "大数据处理中，批处理技术适合处理实时产生的动态数据，如实时电商交易数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "批处理技术是对批量数据进行一次性处理，处理过程有延迟，不适合处理实时产生的动态数据，实时电商交易数据需实时处理，应采用流处理技术。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010182", "t": 3, "q": "大数据处理中，数据清洗环节的主要目的是去除数据中的冗余和错误数据，提高数据质量，为后续分析做准备。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据清洗就是对原始数据进行处理，把冗余、错误等不良数据去除，让数据质量提升，以便后续分析，该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010183", "t": 3, "q": "大数据处理中，MapReduce框架的核心思想是将大规模数据处理任务拆分为多个子任务，并行处理后再汇总结果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "MapReduce正是把大规模数据处理任务分解成多个子任务并行处理，最后汇总结果，这是其核心思想。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010184", "t": 3, "q": "大数据处理中的\"流处理\"技术必须实时处理每一条数据，不能对数据进行缓存或延迟处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流处理虽强调处理实时性，但并非绝对不能对数据进行缓存或延迟处理，在实际应用中，为保证系统稳定、高效等会存在一定缓存或适当延迟。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010185", "t": 3, "q": "大数据处理中的\"批处理\"技术只能处理结构化数据，无法处理非结构化数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "批处理技术并非只能处理结构化数据，也能处理非结构化数据，可通过特定的处理流程和工具对非结构化数据进行处理和分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010186", "t": 3, "q": "大数据处理中的\"数据预处理\"环节是可有可无的，直接对原始数据进行分析也能得到准确结果。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "原始数据往往存在缺失值、异常值、数据格式不一致等问题，若不进行预处理直接分析，会影响分析结果的准确性和可靠性，所以“数据预处理”并非可有可无。", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010187", "t": 3, "q": "大数据存储中，HDFS适合存储海量非结构化数据，而HBase适合存储结构化和半结构化数据，且支持随机读写。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "HDFS是分布式文件系统，适合存海量非结构化数据；HBase是分布式列式数据库，适合结构化和半结构化数据，支持随机读写。", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010188", "t": 3, "q": "大数据的\"4V\"特征中，\"Variety\"仅指结构化数据和非结构化数据的多样性，不包括半结构化数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据“4V”特征里的“Variety”指数据类型的多样性，涵盖结构化、半结构化和非结构化数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010189", "t": 3, "q": "大数据的\"价值密度低\"特征，意味着大数据没有实际应用价值，因为有效信息占比过低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然大数据价值密度低，有效信息占比低，但可通过对海量数据挖掘分析，从大量无用信息中提取出有价值信息，在众多领域有重要应用，并非没有实际应用价值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010190", "t": 3, "q": "大数据的\"Value\"（价值密度）特性意味着数据规模越大，数据的总价值就越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据价值密度低，海量数据中真正有价值的部分占比小，并非数据规模越大总价值就越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010191", "t": 3, "q": "大数据的\"Value\"（价值密度）特性指的是大数据中有用信息的比例很高，无需复杂处理即可提取价值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据的“Value”（价值密度）特性是指数据中有用信息比例低，需复杂处理才能提取价值，并非有用信息比例高且无需复杂处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010192", "t": 3, "q": "大数据的\"Variety\"（多样性）特性仅指数据类型的多样性，不包括数据来源的多样性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据的“Variety”（多样性）既包含数据类型的多样性，也涵盖数据来源的多样性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010193", "t": 3, "q": "大数据的\"Variety\"特性指的是数据来源多样，包括结构化、半结构化和非结构化数据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数据特性“Variety”即多样性，确实意味着数据来源广泛且包含结构化、半结构化和非结构化等多种类型数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010194", "t": 3, "q": "大数据的\"Velocity\"（速度）特性仅指数据产生的速度快，不包括数据处理的速度快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据“Velocity”（速度）特性既包含数据产生速度快，也包含数据处理速度快。所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010195", "t": 3, "q": "大数据分析的核心目的是从海量数据中挖掘出有价值的信息，为决策提供支持，而非单纯追求数据处理速度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数据分析就是要从大量数据里找出有价值信息来辅助决策，速度并非核心目的。", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010196", "t": 3, "q": "大数据分析中的\"分类算法\"与\"聚类算法\"的核心区别是:分类算法是监督学习（有标签），聚类算法是无监督学习（无标签）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在大数据分析里，分类算法需用有标签的数据训练模型来进行分类预测，属于监督学习；聚类算法是直接对无标签数据按相似性分组，属于无监督学习，此表述准确概括了二者核心区别。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010197", "t": 3, "q": "大数据分析中的\"关联规则挖掘\"，只能发现数据之间的正向关联（如A→B），无法发现负向关联（如A→非B）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "关联规则挖掘不仅能发现正向关联，也能发现负向关联。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010198", "t": 3, "q": "大数据分析中的\"聚类分析\"是一种有监督学习算法，需要预先给数据标注类别标签。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "聚类分析是无监督学习算法，它不需要预先给数据标注类别标签，而是根据数据自身的特征将数据划分成不同的类。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010199", "t": 3, "q": "大数据分析中的\"预测分析\"，其核心是基于历史数据建立模型，用于预测未来数据的发展趋势或结果。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "大数据预测分析就是利用历史数据，通过特定算法建立模型，以此来预测未来的趋势或结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010200", "t": 3, "q": "混合现实（MR）技术是增强现实（AR）技术的一种，与AR技术没有本质区别。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "混合现实（MR）和增强现实（AR）有本质区别，MR不仅像AR那样将虚拟信息叠加到现实场景，还能让虚拟物体与现实环境产生交互。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010201", "t": 3, "q": "区块链\"侧链\"技术可以实现主链与侧链之间的资产转移，扩展主链的功能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "侧链技术的重要作用之一就是实现主链与侧链间资产转移，同时能扩展主链功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010202", "t": 3, "q": "区块链\"公有链\"的交易数据对所有节点公开透明，任何节点都可查询交易信息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "公有链是一种完全去中心化的区块链，其交易数据是公开透明的，所有节点都能查询交易信息。", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010203", "t": 3, "q": "区块链\"公有链\"的交易信息对所有节点公开，因此用户的交易隐私无法得到保护。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "公有链虽交易信息公开，但可通过零知识证明等技术在一定程度上保护用户交易隐私，并非完全无法保护。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010204", "t": 3, "q": "区块链\"供应链金融\"应用中，中小企业可以凭借区块链上的真实交易数据获得银行融资，解决融资难问题。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "区块链具有不可篡改、可追溯等特性，能保证供应链上交易数据的真实性。银行可基于这些真实数据评估中小企业信用，为其提供融资，从而解决中小企业融资难问题。", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010205", "t": 3, "q": "区块链\"联盟链\"的安全性完全依赖于联盟内节点的诚信，无需采用加密技术和共识机制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "联盟链也需要采用加密技术和共识机制来保障数据安全、交易不可篡改等，并非仅依赖联盟内节点诚信。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010206", "t": 3, "q": "区块链\"联盟链\"的节点身份无需审核，任何节点都可自由加入网络参与记账。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "联盟链是由多个机构共同参与管理的区块链，节点身份需要审核，并非任何节点都能自由加入。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010207", "t": 3, "q": "区块链\"去中心化\"意味着区块链网络中没有任何节点负责维护网络，网络完全自主运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“去中心化”并非没有节点维护网络，区块链网络有众多节点共同参与维护和运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010208", "t": 3, "q": "区块链\"私有链\"的应用场景主要是企业内部的业务（如财务对账），不适合企业间的协同业务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "私有链适合企业内部业务，同时也可用于企业间协同业务，比如供应链中上下游企业间的数据交互和协同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010209", "t": 3, "q": "区块链\"智能合约\"一旦部署到区块链网络，其代码内容可以随时修改，以适应业务需求变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "区块链“智能合约”部署到网络后，因其去中心化、不可篡改特性，代码内容无法随时修改。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010210", "t": 3, "q": "区块链的\"不可篡改性\"是绝对的，无论拥有多少节点控制权，都无法修改已生成的区块数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "区块链“不可篡改性”并非绝对，当恶意节点控制超过一半的节点时，就可能篡改数据，这就是“51%攻击”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010211", "t": 3, "q": "区块链的\"分布式账本\"意味着每个节点都拥有完整的账本副本，因此任何节点故障都不会导致账本数据丢失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "区块链分布式账本特点就是各节点有完整账本副本，单个或部分节点故障不影响其他节点保存的账本数据，所以不会导致账本数据丢失。", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010212", "t": 3, "q": "区块链的\"共识机制\"仅用于确定哪个节点拥有区块的记账权，与区块数据的合法性验证无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "区块链的共识机制不仅用于确定记账权，也参与区块数据合法性验证。比如在PoW（工作量证明）机制中，节点要通过计算找到符合要求的哈希值才能获得记账权，同时这个过程也保证了数据的合法性，因为不符合规则的数据无法通过计算得到有效哈希值。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010213", "t": 3, "q": "区块链的\"区块哈希值\"由前一区块的哈希值、当前区块交易数据和时间戳等信息计算得出，因此区块之间形成链式结构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "因为区块哈希值计算包含前一区块哈希值等信息，使得每个区块与前一区块紧密相连，从而形成了链式结构。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010214", "t": 3, "q": "区块链的\"去中心化\"特性意味着区块链网络中没有任何中心节点，所有节点的地位完全平等，且无法形成任何形式的联盟。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "区块链“去中心化”并非绝对没有中心节点，也不意味着无法形成联盟，只是弱化了传统中心控制，节点可因共识等形成联盟。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010215", "t": 3, "q": "区块链的\"去中心化\"特性意味着区块链网络中没有任何中心节点，所有节点的地位完全平等。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010216", "t": 3, "q": "区块链技术中，一旦交易被记录到区块并上链，就绝对无法被篡改。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "区块链采用加密算法和分布式账本等技术，篡改单个节点数据无用，需控制超过半数节点才能篡改，但在现实中几乎不可能，所以交易记录一旦上链很难被篡改，可认为绝对无法被篡改。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010217", "t": 3, "q": "区块链中的\"公钥\"可以公开给其他节点，用于加密数据，而\"私钥\"必须由用户妥善保管，用于解密数据和签名。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在区块链里，公钥可公开用于加密数据，私钥需用户妥善保管，用于解密和签名，这是区块链基本安全机制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010218", "t": 3, "q": "区块链中的\"联盟链\"仅对特定组织或节点开放，去中心化程度低于公有链，但交易速度高于公有链。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "联盟链是由多个机构共同参与管理的区块链，仅对特定组织或节点开放。它的节点数量相对公有链少，去中心化程度低，由于参与验证的节点数量少，所以交易速度比公有链快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010219", "t": 3, "q": "区块链中的\"区块哈希值\"是由区块内的交易数据和前一区块的哈希值共同计算得出的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在区块链里，每个区块的哈希值由该区块内的交易数据以及前一区块的哈希值共同参与计算得出，这保证了区块链数据的连续性和不可篡改。", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010220", "t": 3, "q": "区块链中的\"时间戳\"技术，用于记录每个交易的发生时间，确保交易的顺序性，是解决\"双花问题\"的重要辅助手段。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "时间戳能记录交易发生时间，确定交易顺序，有助于防止同一笔资产被重复花费，是解决“双花问题”的重要辅助。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010221", "t": 3, "q": "区块链中的\"智能合约\"在部署到区块链后，其代码可以根据实际业务需求进行修改和升级。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "区块链智能合约一旦部署，代码具有不可篡改特性，无法随意根据实际业务需求修改和升级。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010222", "t": 3, "q": "区块链中的\"智能合约\"在部署到区块链后，其代码逻辑可以根据业务需求随时修改。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "区块链具有不可篡改特性，智能合约部署到区块链后，代码逻辑通常不能随意修改，以保证其安全性和可信度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010223", "t": 3, "q": "区块链中的\"PoW（工作量证明）\"共识机制，由于需要大量计算资源竞争记账权，因此具有能耗低、交易速度快的特点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PoW需要大量计算资源竞争记账权，这会导致高能耗，且大量计算也使得交易速度较慢，并非能耗低、交易速度快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010224", "t": 3, "q": "区块链中的数据一旦写入区块，就绝对无法修改，任何情况下都不能删除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "区块链数据具有难以篡改和删除的特性，但并非绝对无法修改和删除，在特定条件如私钥丢失、达成共识等情况下可以进行修改或删除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010225", "t": 3, "q": "物联网的\"M2M\"（机器到机器）通信需要人工干预才能实现设备之间的数据交互。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网的 “M2M” 是机器与机器之间的自动通信，无需人工干预就能实现设备间数据交互。  ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010226", "t": 3, "q": "物联网的感知层仅负责数据采集，所有数据预处理工作均需在平台层完成。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网感知层不仅负责数据采集，也能进行一定的数据预处理工作，并非所有预处理都在平台层完成。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010227", "t": 3, "q": "物联网的核心是\"物物相连\"，因此网络层是物联网体系架构中最重要的层级，感知层和应用层仅为辅助。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。物联网体系架构中感知层、网络层和应用层都很重要。感知层负责采集信息，是获取数据的基础；网络层实现数据传输；应用层将物联网技术与行业需求结合，实现具体应用。不能说网络层最重要，感知层和应用层仅为辅助。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010228", "t": 3, "q": "物联网感知层的\"GPS模块\"主要用于采集物体的位置信息，无法采集速度、时间等其他信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "GPS模块除能采集物体位置信息外，也可采集速度、时间等信息。", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010229", "t": 3, "q": "物联网感知层的传感器只能采集模拟信号，无法采集数字信号。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网感知层的传感器既能采集模拟信号，也能采集数字信号。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010230", "t": 3, "q": "物联网感知层的传感器只能采集物理世界的模拟信号，无法直接输出数字信号。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网感知层的传感器有能直接输出数字信号的，并非只能采集模拟信号。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010231", "t": 3, "q": "物联网感知层的RFID标签只能用于识别物体，无法存储物体的相关信息（如生产日期、规格）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "RFID标签不仅能识别物体，还具备存储物体相关信息（像生产日期、规格等）的功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010232", "t": 3, "q": "物联网感知层的RFID技术，相比条形码技术，具有存储数据量大、可重复读写、抗污染能力强的优势。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RFID技术可存储大量数据，能重复读写数据，且对环境适应性强、抗污染能力好，而条形码存储数据量有限、通常不可重复读写、抗污染能力较差。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010233", "t": 3, "q": "物联网感知层的RFID技术不仅能识别物体身份，还能采集物体的温度、湿度等物理量数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "RFID技术主要用于识别物体身份，本身一般不能直接采集物体的温度、湿度等物理量数据。", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010234", "t": 3, "q": "物联网感知层中的传感器，其核心功能是将物理世界的模拟信号转换为数字信号，以便后续传输和处理。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "传感器能把物理世界的各种物理量（如温度、压力等模拟信号）转变为便于传输和处理的数字信号，这是其在物联网感知层的核心功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813875161010235", "t": 3, "q": "物联网平台层的\"设备管理\"功能包括设备的接入认证、状态监控、固件升级等，不包括设备的故障诊断。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "物联网平台层的设备管理功能涵盖设备接入认证、状态监控、固件升级以及故障诊断等多方面。所以题干说不包括设备故障诊断是错误的。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第7章 信息新技术（2）", "n": "基础练习题【含解析】 / 第7章 信息新技术（2）", "qs": [{"id": "2034813879275622400", "t": 1, "q": "物联网感知层中，RFID技术根据工作频率不同分为多个类别，其中适合用于供应链物流中远距离（数米）识别集装箱、托盘的是？", "a": ["微波RFID（MW，3GHz以上）", "高频RFID（HF，3MHz-30MHz）", "超高频RFID（UHF，300MHz-3GHz）", "低频RFID（LF，30kHz-300kHz）", "", ""], "r": "C", "e": "超高频RFID工作频率范围是300MHz - 3GHz，具有识别距离远的特点，适合供应链物流中远距离识别集装箱、托盘等。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622401", "t": 1, "q": "物联网感知层中，RFID技术与条形码技术相比，最显著的优势是？", "a": ["只能识别单个物体", "存储的数据量更小", "成本更低廉", "可实现非接触式识别和多标签同时读取", "", ""], "r": "D", "e": "RFID可非接触式识别且能多标签同时读取，这是条形码不具备的显著优势。A选项RFID能识别多个物体；B选项RFID存储数据量更大；C选项RFID成本相对条形码更高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622402", "t": 1, "q": "物联网平台层的核心功能不包括以下哪项？", "a": ["数据采集与感知", "数据分析与可视化", "设备接入与管理", "数据存储与管理", "", ""], "r": "A", "e": "物联网架构通常分为四层：感知层、网络层、平台层（或称平台管理层）和应用层。平台层（即物联网云平台）的核心功能主要围绕数据的汇聚、处理、管理和服务，而数据采集与感知属于感知层的职责。<br />以下对各选项逐一分析：<br />A. 数据采集与感知（错误，本题答案）：这是感知层的核心功能，由传感器、RFID、摄像头等终端设备完成，负责从物理世界采集原始数据。平台层不直接承担感知采集任务，而是接收感知层上传的数据。<br />B. 数据分析与可视化（正确功能）：平台层提供数据清洗、聚合、机器学习分析以及图表展示等功能，属于平台层的核心增值服务。<br />C. 设备接入与管理（正确功能）：平台层负责设备的认证鉴权、注册管理、状态监控、OTA升级等，是实现海量设备连接管理的关键。<br />D. 数据存储与管理（正确功能）：平台层提供时序数据库、对象存储等机制，对海量物联网数据进行持久化存储和高效检索。<br />因此，不属于平台层核心功能的是 A。", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622403", "t": 1, "q": "物联网平台层中，\"设备管理\"功能不包括以下哪项？", "a": ["设备接入认证与权限控制", "设备状态实时监控（如在线/离线、电量）", "设备固件远程升级", "设备采集数据的实时分析与可视化", "", ""], "r": "D", "e": "设备管理主要围绕设备自身的接入、状态和升级等，而设备采集数据的实时分析与可视化属于数据处理和展示范畴，并非设备管理功能。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622404", "t": 1, "q": "物联网体系架构中，“平台层”的主要功能是？", "a": ["对数据进行存储、分析、挖掘，提供开放接口", "采集物理世界的数据", "传输感知层的数据", "实现具体的业务应用（如智能安防、智能医疗）", "", ""], "r": "A", "e": "平台层主要负责对物联网数据进行存储、分析、挖掘等处理，并提供开放接口。B选项是感知层功能，C选项是网络层功能，D选项是应用层功能。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622405", "t": 1, "q": "物联网体系架构中，负责采集物理世界数据（如温度、湿度）并将其转换为电信号的是哪一层？", "a": ["网络层", "传输层", "平台层", "感知层", "", ""], "r": "D", "e": "感知层的作用就是采集物理世界的数据，像温度、湿度等，并把这些数据转换为电信号。而网络层主要负责数据传输，平台层侧重于数据处理和管理等。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622406", "t": 1, "q": "物联网体系架构中，负责实现物理设备身份识别、数据采集的层级是？", "a": ["平台层", "应用层", "感知层", "网络层", "", ""], "r": "C", "e": "感知层是物联网的基础，主要功能是识别物体、采集信息。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622407", "t": 1, "q": "物联网网络层中，用于连接感知层设备与互联网，实现数据转发的设备是？", "a": ["交换机", "路由器", "传感器", "RFID阅读器", "", ""], "r": "B", "e": "传感器和RFID阅读器属于感知层设备，交换机主要用于局域网内设备连接，路由器可连接感知层设备与互联网实现数据转发。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622408", "t": 1, "q": "物联网系统中，负责将感知层采集的异构数据（如温度、位置、图像）转换为统一格式，并实现局部数据过滤与预处理的层级是？", "a": ["网络层", "感知层", "平台层", "应用层", "", ""], "r": "C", "e": "平台层能对感知层采集的异构数据进行格式转换、局部数据过滤与预处理。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622409", "t": 1, "q": "物联网系统中，以下哪项技术不属于网络层的核心数据传输技术？", "a": ["5G（第五代移动通信技术）", "边缘计算", "MQTT（消息队列遥测传输协议）", "以太网", "", ""], "r": "B", "e": "网络层主要负责数据的传输，5G、MQTT、以太网都用于数据传输。而边缘计算是将计算和数据存储靠近数据源的一种计算模式，不属于核心数据传输技术。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622410", "t": 1, "q": "物联网应用中，\"智能穿戴设备\"（如智能手表）的核心功能不包括？", "a": ["接收手机消息通知", "监测用户心率、步数等健康数据", "控制家庭中的智能家电（如空调、灯光）", "记录用户睡眠质量", "", ""], "r": "C", "e": "通常智能穿戴设备核心在健康监测和信息交互等，接收消息通知、监测健康数据、记录睡眠质量是常见核心功能。虽部分智能穿戴设备能控制家电，但并非核心功能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622411", "t": 1, "q": "物联网应用中，\"智能交通\"的车联网（V2X）技术不包括以下哪种通信方式？", "a": ["车与行人（V2P）通信", "车与车（V2V）通信", "车与路边单元（V2R）通信", "车与云平台（V2N）通信", "", ""], "r": "D", "e": "车联网（V2X）主要是车辆与周围环境的信息交互通信，云平台并非车联网通信场景里直接与车交互的周围实体环境。而车与行人、车与车、车与路边单元都是常见车联网通信方式。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622412", "t": 1, "q": "物联网应用中，“智能农业”场景下，需实时监测农田土壤湿度、光照强度，并根据监测数据自动控制灌溉设备开关，该场景中不涉及的物联网核心技术是？", "a": ["传感器技术（湿度、光照传感器）", "区块链技术（数据存证）", "嵌入式技术（灌溉设备控制）", "无线通信技术（数据传输）", "", ""], "r": "B", "e": "实时监测土壤湿度和光照强度要用传感器技术，自动控制灌溉设备靠嵌入式技术，监测数据传输需无线通信技术；而“智能农业”场景实时监测和控制无需区块链进行数据存证。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622413", "t": 1, "q": "物联网应用中，\"智能农业\"通过部署传感器、无人机等设备实现精准灌溉、病虫害监测，其核心体现了物联网的哪种应用价值？", "a": ["实现远程控制，无需人工干预", "只能监测环境，不能调节设备", "提升生产效率，降低人力成本", "仅适用于大规模农场，小规模农场无法使用", "", ""], "r": "C", "e": "智能农业借助物联网设备精准灌溉、监测病虫害，能让农业生产更高效，减少人力投入，降低成本。A选项“无需人工干预”太绝对；B选项智能农业可调节设备；D选项小规模农场也能使用。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622414", "t": 1, "q": "物联网中，\"LoRa\"通信技术的主要特点是？", "a": ["高带宽、低功耗、远距离", "高带宽、高功耗、短距离", "低带宽、低功耗、远距离", "高带宽、高功耗、远距离", "", ""], "r": "C", "e": "LoRa是低功耗广域物联网通信技术，特点为低带宽、低功耗和远距离传输。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622415", "t": 1, "q": "物联网中，\"M2M\"（机器到机器）通信的核心是？", "a": ["必须通过人工操作实现设备间通信", "设备之间无需人类干预，自动完成数据交互和控制", "只能实现两个设备之间的通信，无法多设备互联", "仅用于工业场景，不能用于民用场景", "", ""], "r": "B", "e": "M2M强调机器间自动通信，无需人工干预，可多设备互联，应用场景广泛。A有人工操作错误；C可多设备互联；D应用不限于工业场景。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622416", "t": 1, "q": "物联网中，\"RFID标签\"按供电方式分类，不包括以下哪种类型？", "a": ["有源-无源混合RFID标签", "半有源RFID标签", "光学RFID标签", "无源RFID标签", "", ""], "r": "C", "e": "RFID标签按供电方式分为有源、无源、半有源（也叫半无源），而光学RFID标签是从技术原理角度分类，并非供电方式分类。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622417", "t": 1, "q": "物联网中，适合用于低功耗、短距离、低数据速率场景（如智能水表、智能门锁）的无线通信协议是？", "a": ["Bluetooth", "Wi-Fi", "LTE", "ZigBee", "", ""], "r": "D", "e": "ZigBee 具有低功耗、短距离、低数据速率的特点，适合智能水表、智能门锁等场景。Bluetooth 也有低功耗版但 ZigBee 更适配此类场景；Wi-Fi 功耗相对高、覆盖范围大；LTE 覆盖广且主要用于高速数据传输。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622418", "t": 1, "q": "物联网中，用于实现低功耗、广覆盖、远距离数据传输的通信协议是？", "a": ["以太网", "WiFi", "NB-IoT（窄带物联网）", "ZigBee", "", ""], "r": "C", "e": "以太网、WiFi 功耗相对高且覆盖范围有限；ZigBee 传输距离较短；NB - IoT 具备低功耗、广覆盖、远距离数据传输特点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622419", "t": 1, "q": "物联网中，用于实现设备与互联网之间数据传输的\"网关\"设备，主要工作在体系架构的哪个层级？", "a": ["平台层与应用层之间", "网络层与平台层之间", "感知层内部", "感知层与网络层之间", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622420", "t": 1, "q": "物联网中，LoRa技术主要用于解决哪种问题？", "a": ["设备的身份识别与认证", "长距离、低功耗的设备数据传输", "短距离、高带宽的设备通信", "设备与手机之间的蓝牙连接", "", ""], "r": "B", "e": "LoRa是一种低功耗广域物联网无线技术，特点是长距离传输且功耗低。A项设备身份识别与认证不是LoRa主要解决的；C项短距离高带宽不是其特性；D项与蓝牙连接无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622421", "t": 1, "q": "虚拟现实（VR）体验中，用户转动头部时，虚拟场景能实时跟随视角变化，避免产生画面延迟与眩晕感，实现这一功能的关键技术是？", "a": ["头部运动追踪与画面刷新同步技术", "触觉反馈技术", "眼动追踪技术", "高分辨率显示技术", "", ""], "r": "A", "e": "要让虚拟场景随用户头部转动实时变化且无延迟和眩晕感，关键在于使头部运动追踪和画面刷新同步。而触觉反馈技术主要涉及触觉感受，眼动追踪技术关注眼睛动作，高分辨率显示技术侧重画面清晰程度，均与题干功能关联不大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622422", "t": 1, "q": "虚拟现实（VR）系统中，为让用户在虚拟场景中行走时感受到真实的地面触感（如草地、水泥地差异），需采用的技术是？", "a": ["嗅觉模拟技术", "视觉渲染技术", "触觉反馈技术", "力反馈技术", "", ""], "r": "C", "e": "要感受地面触感，需能反馈触觉信息，所以用触觉反馈技术。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622423", "t": 1, "q": "虚拟现实（VR）与增强现实（AR）的核心技术区别在于？", "a": ["是否支持用户与虚拟内容的交互", "是否需要佩戴专用显示设备", "是否依赖高性能图形处理器（GPU）", "是否将虚拟内容与真实物理环境融合", "", ""], "r": "D", "e": "VR创造完全虚拟的环境，AR是把虚拟内容叠加到真实环境，二者核心区别在于是否将虚拟内容与真实物理环境融合。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622424", "t": 1, "q": "虚拟现实系统中，为了避免用户产生\"晕动症\"，关键需要优化的技术指标是？", "a": ["虚拟场景的分辨率", "场景中物体的建模精度", "画面的刷新率与延迟", "虚拟声音的保真度", "", ""], "r": "C", "e": "“晕动症”常因画面刷新不及时、延迟高，导致视觉感知和身体运动反馈不一致引发，所以关键要优化画面刷新率与延迟。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622425", "t": 1, "q": "以下关于区块链\"侧链\"技术的描述，正确的是？", "a": ["侧链只能存储主链的部分数据，无法独立处理交易", "侧链是主链的备份，主链故障时侧链可替代主链运行", "侧链独立于主链，可实现不同区块链之间的资产转移与数据交互", "侧链的安全性完全依赖主链，自身无安全机制", "", ""], "r": "C", "e": "侧链独立于主链，能实现不同区块链间资产转移和数据交互。A 项侧链可独立处理交易；B 项侧链不是主链备份；D 项侧链有自身安全机制。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622426", "t": 1, "q": "以下关于云计算中\"容器技术\"（如Docker）与\"虚拟机技术\"（如VMware）的对比，说法正确的是？", "a": ["容器与宿主机共享操作系统内核，资源占用低于虚拟机", "容器技术需模拟完整操作系统，启动速度慢于虚拟机", "容器无法跨操作系统平台运行，虚拟机可跨平台", "虚拟机的隔离性低于容器，易受宿主机影响", "", ""], "r": "A", "e": "容器与宿主机共享操作系统内核，无需模拟完整操作系统，资源占用少、启动快，且可跨平台运行；虚拟机模拟完整操作系统，资源占用多、启动慢，隔离性比容器好。所以A正确，B、C、D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622427", "t": 1, "q": "以下关于增强现实（AR）与混合现实（MR）的关系，说法正确的是？", "a": ["AR是MR的子集，MR在AR基础上增加了虚拟内容与真实环境的交互能力", "AR与MR技术原理完全相同，仅应用场景不同", "MR是AR的子集，AR在MR基础上增加了对真实环境的感知能力", "AR与MR是完全独立的技术，无任何关联", "", ""], "r": "A", "e": "MR在AR基础上增强了虚拟内容和真实环境的交互，所以AR是MR的子集。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622428", "t": 1, "q": "云计算部署模式中，\"社区云\"的服务对象是？", "a": ["单个企业", "具有共同需求的特定行业或群体（如医疗行业、教育机构）", "所有公众用户", "仅云服务商内部员工", "", ""], "r": "B", "e": "社区云是供具有共同需求特定群体使用的云，如特定行业或机构。A是私有云服务对象；C是公有云服务对象；D不符合社区云特征。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622429", "t": 1, "q": "云计算服务中，用户无需关心服务器的地理位置、硬件型号等细节，只需按需申请资源，这体现了云计算的哪个特性？", "a": ["高可靠性", "泛在接入", "资源透明化", "按需服务", "", ""], "r": "C", "e": "题干强调用户不用关心服务器具体细节，按需申请资源，这表明云计算对用户屏蔽了资源的底层信息，体现资源透明化。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622430", "t": 1, "q": "云计算中，\"边缘计算\"技术的核心目的是？", "a": ["提高云端服务器的存储容量", "将所有计算任务集中到云端数据中心", "减少数据传输延迟，处理本地化实时数据", "降低终端设备的硬件配置要求", "", ""], "r": "C", "e": "边缘计算是在靠近数据源的边缘侧处理数据，可减少数据传输到云端的时间，能及时处理本地化实时数据。A项与边缘计算核心目的无关；B项边缘计算是分散计算而非集中到云端；D项不是其核心目标。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622431", "t": 1, "q": "云计算中，\"边缘计算\"与传统云计算的主要区别是？", "a": ["边缘计算仅处理结构化数据，传统云计算处理非结构化数据", "边缘计算无需网络连接，传统云计算需要网络连接", "边缘计算的计算能力比传统云计算更强", "边缘计算将计算任务部署在靠近数据产生的边缘节点，降低延迟", "", ""], "r": "D", "e": "边缘计算特点是把计算任务放在靠近数据产生的边缘节点，能减少数据传输，降低延迟；A选项边缘计算和传统云计算都能处理多种类型数据；B选项边缘计算也需网络连接；C选项传统云计算计算能力通常更强。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622432", "t": 1, "q": "云计算中，\"弹性扩展\"指的是？", "a": ["云资源一旦分配给用户，不可更改数量", "用户只能在固定时间段内使用云资源", "云资源可根据用户业务负载自动增加或减少", "用户需手动申请调整资源，无法自动操作", "", ""], "r": "C", "e": "弹性扩展是云计算的重要特性，其核心是云资源能依据用户业务负载动态调整，可自动增加或减少。A选项资源不可改数量不符合弹性；B选项固定时间段使用与弹性扩展无关；D选项可自动操作，并非只能手动。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622433", "t": 1, "q": "云计算中，\"服务器虚拟化\"技术的核心目的是？", "a": ["将多个物理服务器合并为一台逻辑服务器，减少硬件数量", "将一台物理服务器拆分为多个逻辑上独立的虚拟机，提高硬件资源利用率", "实现服务器硬件的自动故障修复", "简化服务器的网络配置流程", "", ""], "r": "B", "e": "服务器虚拟化就是把一台物理服务器拆成多个逻辑独立虚拟机，能让硬件资源被充分利用。A选项说反了；C选项不是核心目的；D选项与服务器虚拟化核心目的无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622434", "t": 1, "q": "云计算中，\"高可用性\"的实现方式不包括？", "a": ["多区域部署，某区域故障时切换到其他区域", "多副本存储，数据丢失时可恢复", "负载均衡，避免单一节点过载", "单点部署，减少设备数量降低故障概率", "", ""], "r": "D", "e": "单点部署存在单点故障风险，无法保障高可用性。而多区域部署、多副本存储、负载均衡都有助于提升系统可用性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622435", "t": 1, "q": "云计算中，“资源池化”技术的核心作用是？", "a": ["确保每个用户独占物理硬件资源", "限制用户对资源的访问权限", "提高单个物理设备的运行速率", "将物理资源抽象为逻辑资源，实现动态分配和共享", "", ""], "r": "D", "e": "“资源池化”是把物理资源抽象成逻辑资源，能动态分配和共享，并非让用户独占物理硬件、限制访问权限，也不是单纯提高单个物理设备运行速率。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622436", "t": 1, "q": "云计算中，\"资源池化\"特性的含义是？", "a": ["资源池中的资源只能供单个用户使用，不可共享", "将计算、存储等资源抽象为统一资源池，根据用户需求动态分配", "每个用户只能使用固定数量的资源，无法动态调整", "将多个用户的资源集中存储在同一个物理服务器中", "", ""], "r": "B", "e": "资源池化就是把计算、存储等资源整合为统一资源池，能按用户实际需求动态分配资源。A选项说只能供单个用户使用错误；C选项不能动态调整不符合；D选项只是简单提及集中存储，未体现动态分配核心。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622437", "t": 1, "q": "在大数据分析流程中，\"数据清洗\"环节的主要作用是？", "a": ["将清洗后的数据加载到数据仓库中", "去除数据中的噪声、缺失值与异常值，保证数据质量", "对数据进行分类、聚合，提取关键特征", "将非结构化数据转换为结构化数据", "", ""], "r": "B", "e": "数据清洗主要就是处理数据中的噪声、缺失值和异常值等问题，以提升数据质量。A是数据加载环节；C是数据特征提取；D一般是数据预处理中非结构化数据处理步骤。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622438", "t": 1, "q": "在大数据分析中，\"聚类分析\"与\"分类分析\"的主要区别是？", "a": ["聚类分析仅处理数值型数据，分类分析处理所有类型数据", "聚类分析需要预先定义类别，分类分析不需要", "分类分析仅处理数值型数据，聚类分析处理所有类型数据", "分类分析需要预先定义类别，聚类分析不需要", "", ""], "r": "D", "e": "分类分析是基于已知类别对数据进行分类，需要预先定义好类别；而聚类分析是将数据对象分组，事先不需要定义类别。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622439", "t": 1, "q": "在虚拟现实（VR）与增强现实（AR）技术中，某应用需将虚拟的3D模型叠加到真实的工厂车间场景中，辅助工人进行设备维修，该应用属于哪种技术范畴？", "a": ["虚拟仿真技术", "纯VR技术", "混合现实（MR）技术", "扩展现实（XR）技术", "", ""], "r": "C", "e": "混合现实（MR）技术能将虚拟信息与真实世界完美融合，题中把虚拟3D模型叠加到真实工厂车间场景辅助维修符合MR特点。虚拟仿真主要是模拟，纯VR是完全虚拟环境，扩展现实概念宽泛包含多种，不如MR针对性强。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622440", "t": 1, "q": "在云计算的三种核心服务模式中，某企业希望获得包含操作系统、编程语言运行环境但不包含具体业务应用的服务，该需求对应的服务模式是？", "a": ["SaaS（软件即服务）", "PaaS（平台即服务）", "IaaS（基础设施即服务）", "DaaS（数据即服务）", "", ""], "r": "B", "e": "PaaS提供操作系统、编程语言运行环境等平台，用户无需管理底层基础设施，可专注开发应用；SaaS直接提供软件应用；IaaS提供计算、存储等基础资源；DaaS提供数据相关服务。本题企业需求符合PaaS特点。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622441", "t": 1, "q": "在云计算服务模式中，某企业使用服务商提供的开发平台开发应用程序，无需自行搭建操作系统、数据库等基础环境，该企业使用的是哪种服务模式？", "a": ["IaaS（基础设施即服务）", "SaaS（软件即服务）", "PaaS（平台即服务）", "DaaS（数据即服务）", "", ""], "r": "C", "e": "PaaS提供开发平台，用户可在平台上开发应用，无需自行搭建基础环境，符合本题描述。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622442", "t": 1, "q": "在云计算架构中，某企业需要构建一个可定制化的应用开发与运行平台，该平台需提供编程语言、数据库管理系统等工具，且企业无需关注底层硬件与操作系统，此场景对应的云计算服务模式是？", "a": ["SaaS（软件即服务）", "PaaS（平台即服务）", "FaaS（函数即服务）", "IaaS（基础设施即服务）", "", ""], "r": "B", "e": "PaaS提供应用开发与运行平台，包含编程语言、数据库管理系统等工具，用户不用管底层硬件与操作系统，符合本题场景。SaaS是提供软件应用；FaaS主要针对无服务器函数；IaaS提供基础硬件资源。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622443", "t": 1, "q": "在Hadoop生态系统中，主要负责分布式计算任务调度、资源管理的组件是？", "a": ["YARN", "Hive", "HDFS", "MapReduce", "", ""], "r": "A", "e": "YARN负责分布式计算任务调度和资源管理；Hive是数据仓库工具；HDFS是分布式文件系统；MapReduce是计算模型。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622444", "t": 1, "q": "在VR技术中，\"六自由度（6DoF）\"指的是用户在虚拟环境中能够实现的哪种交互能力？", "a": ["只能进行绕X、Y、Z轴3个方向的旋转", "可与虚拟环境中的6种不同类型物体进行交互", "只能进行前后、左右、上下3个方向的平移", "可进行前后、左右、上下平移，以及绕X、Y、Z轴旋转，共6个方向的运动", "", ""], "r": "D", "e": "六自由度（6DoF）包含沿X、Y、Z轴的平移和绕X、Y、Z轴的旋转，共6个方向的运动。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622445", "t": 1, "q": "增强现实（AR）技术在工业维修场景中的典型应用是？", "a": ["将设备维修步骤、故障点信息叠加在真实设备上", "构建完全虚拟的维修培训场景", "仅记录维修过程的视频数据", "让维修人员完全脱离真实设备进行远程操作", "", ""], "r": "A", "e": "AR是将虚拟信息与真实场景结合，A项把设备维修步骤、故障点信息叠加在真实设备上，符合AR技术特点。B是纯虚拟场景，属VR技术；C只是记录视频，未体现AR虚实结合；D完全脱离真实设备，也不符合AR。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622446", "t": 1, "q": "增强现实（AR）技术在工业维修场景中的典型应用是？", "a": ["构建完全虚拟的生产线，模拟设备运行状态", "在真实设备上叠加设备结构图纸、故障排查步骤等虚拟信息", "为维修人员提供虚拟的设备拆解演练环境", "记录维修人员的操作过程，生成视频教程", "", ""], "r": "B", "e": "增强现实（AR）是将虚拟信息与真实世界融合。B选项在真实设备上叠加虚拟信息符合AR特点。A是构建完全虚拟场景属虚拟现实；C虚拟拆解演练环境也是虚拟现实；D记录操作生成教程与AR核心特点无关。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622447", "t": 1, "q": "增强现实（AR）应用开发中，需将虚拟三维模型精准叠加到真实场景的特定位置（如在真实桌子上放置虚拟水杯），实现这一功能的核心技术是？", "a": ["手势识别技术", "图形渲染技术", "实时定位与地图构建（SLAM）", "3D建模技术", "", ""], "r": "C", "e": "SLAM技术能实时定位设备和构建环境地图，可确定虚拟模型在真实场景中的精确位置，实现虚拟三维模型精准叠加。手势识别主要用于交互；图形渲染是对模型进行可视化处理；3D建模是创建虚拟模型，均非核心技术。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622448", "t": 1, "q": "增强现实（AR）与虚拟现实（VR）的本质区别在于？", "a": ["是否需要用户交互操作", "是否依赖计算机图形技术", "是否需要使用显示设备", "是否保留并融合真实物理环境", "", ""], "r": "D", "e": "AR是将虚拟信息与真实环境融合，VR是创造完全虚拟的环境，二者本质区别在于是否保留并融合真实物理环境。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622449", "t": 1, "q": "增强现实技术中，\"SLAM（同步定位与地图构建）\"技术的作用是？", "a": ["实时确定设备在真实环境中的位置，并构建环境地图", "实现虚拟声音的空间定位", "构建完全虚拟的3D地图", "将虚拟物体与真实环境进行色彩匹配", "", ""], "r": "A", "e": "SLAM主要就是在未知环境下，让设备实时确定自身位置并构建环境地图。B选项说的声音定位、C选项的完全虚拟地图、D选项的色彩匹配都不是SLAM的作用。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622450", "t": 1, "q": "AR技术的\"虚实融合\"是指？", "a": ["将真实环境信息存储到虚拟数据库中", "将虚拟信息与真实环境在同一画面中呈现，且位置、比例对齐", "仅显示真实环境，不显示虚拟信息", "仅显示虚拟信息，不显示真实环境", "", ""], "r": "B", "e": "AR（增强现实）技术核心就是把虚拟信息和真实环境结合，在同一画面呈现且位置、比例对齐。A选项只强调存储真实信息到虚拟库，未体现融合；C选项只显示真实环境不是融合；D选项只显示虚拟信息也不是融合。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622451", "t": 1, "q": "AR技术实现虚拟信息与真实环境叠加时，需通过哪种技术获取真实环境的位置和姿态信息，确保虚拟信息对齐？", "a": ["语音识别技术", "计算机视觉技术（如SLAM）", "大数据分析技术", "区块链技术", "", ""], "r": "B", "e": "要获取真实环境的位置和姿态信息让虚拟信息对齐，需借助能处理图像和识别环境的技术。计算机视觉技术（如SLAM）可实现对环境的感知和定位，符合需求。而语音识别技术主要处理语音，大数据分析技术用于数据处理分析，区块链技术侧重数据安全和分布式记账，都与获取环境位置和姿态信息无关。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622452", "t": 1, "q": "AR技术与VR技术的最核心区别是？", "a": ["AR技术保留真实环境，VR技术完全构建虚拟环境", "AR技术需要专用头显，而VR技术可以使用普通屏幕", "AR技术仅限于游戏领域应用，VR技术广泛应用于教育、医疗等多个行业", "AR技术支持手势识别等交互方式，VR技术主要依赖控制器", "", ""], "r": "A", "e": "AR是增强现实，会将虚拟信息与真实环境结合；VR是虚拟现实，是创建完全虚拟的环境，这是二者核心区别。B项VR一般也需专用设备；C项AR应用也广泛，并非仅限于游戏；D项二者交互方式都多样，不是核心区别。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622453", "t": 1, "q": "AR技术中，\"marker-based AR\"（基于标记的AR）的特点是？", "a": ["需通过特定标记（如二维码、图片）定位，实现虚拟信息叠加", "仅能在室内使用，无法在室外使用", "无需任何标记，直接识别真实环境", "仅支持静态虚拟信息，不支持动态信息", "", ""], "r": "A", "e": "基于标记的AR就是依靠特定标记（像二维码、图片等）来定位，进而把虚拟信息叠加到真实场景中。B选项，它室内外都能用；C选项是无标记AR的特点；D选项，它也支持动态信息。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622454", "t": 1, "q": "VR技术中，\"视野角（FOV）\"对沉浸感的影响是？", "a": ["FOV固定为90度，无法调整", "FOV与沉浸感无关，仅与画面分辨率相关", "FOV越小，沉浸感越强", "FOV越大，越接近人眼自然视野，沉浸感越强", "", ""], "r": "D", "e": "视野角（FOV）越大，越接近人眼自然视野，能提供更广阔的视觉范围，使使用者更有身临其境的感觉，即沉浸感越强。A选项FOV不是固定90度且可调整；B选项FOV与沉浸感密切相关；C选项FOV小沉浸感弱。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622455", "t": 1, "q": "VR技术中，\"眩晕感\"产生的主要原因是？", "a": ["虚拟环境的运动与用户实际运动存在延迟或不一致", "用户使用时间过短", "虚拟环境画面分辨率过高", "虚拟环境的声音过大", "", ""], "r": "A", "e": "VR中眩晕感主因是虚拟与实际运动有延迟或不一致，大脑接收冲突信息致眩晕。B使用短一般不会晕；C分辨率高不直接导致眩晕；D声音大也非主要致晕原因。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622456", "t": 1, "q": "VR技术中，\"运动追踪\"技术的作用是？", "a": ["仅追踪用户头部运动，不追踪手部", "追踪用户身体或设备的运动，同步调整虚拟环境视角或交互", "仅追踪虚拟物体的运动，不追踪用户", "防止用户在虚拟环境中产生眩晕感", "", ""], "r": "B", "e": "运动追踪就是要追踪用户身体或设备的动作，然后根据其运动同步调整虚拟环境里的视角或者交互情况。A选项说仅追踪头部不追踪手部太片面；C选项追踪对象说反了；D选项与运动追踪的作用无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622457", "t": 1, "q": "VR技术中的\"沉浸感\"主要通过哪种方式实现？", "a": ["仅通过视觉呈现虚拟环境", "仅通过听觉播放虚拟环境中的声音", "让用户在真实环境中进行操作，无需虚拟环境", "通过视觉、听觉、触觉等多感官交互，让用户感觉置身真实环境", "", ""], "r": "D", "e": "VR的沉浸感强调多感官共同营造，让用户仿佛身处虚拟环境，A、B选项仅强调单一感官，C选项与VR营造虚拟环境相悖。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813879275622458", "t": 1, "q": "VR设备中，\"头显（HMD）\"的主要作用是？", "a": ["播放虚拟环境中的声音，增强沉浸感", "向用户双眼显示不同视角的虚拟图像，产生立体视觉", "检测用户身体位置变化，实现空间定位", "捕捉用户手部动作，实现虚拟交互", "", ""], "r": "B", "e": "头显（HMD）主要功能是向用户双眼显示不同视角的虚拟图像，从而产生立体视觉，让用户沉浸在虚拟环境中。A选项是音频设备作用；C选项通常由定位传感器等完成；D选项是手部动作捕捉设备功能。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657280", "t": 2, "q": "物联网中，设备管理平台的核心功能包括哪些？", "a": ["设备固件升级", "设备远程控制", "设备接入认证", "设备状态监控", "", ""], "r": "ABCD", "e": "设备管理平台要对设备全生命周期管理，接入认证确保设备合法接入，状态监控掌握设备实时情况，远程控制实现对设备操作，固件升级可更新设备功能，这四项均是核心功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657281", "t": 2, "q": "物联网中，属于应用层的典型应用有哪些？", "a": ["智能家居（如智能灯光控制）", "智能交通（如车联网）", "传感器数据采集", "智能医疗（如远程监护）", "", ""], "r": "ABD", "e": "应用层是物联网实现“物物相连，按需服务”的关键，主要包含各类具体应用。A智能家居、B智能交通、D智能医疗都是典型的物联网应用场景；而C传感器数据采集属于感知层功能。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657282", "t": 2, "q": "物联网中，数据处理的关键技术包括哪些？", "a": ["数据融合（多源数据整合）", "数据清洗（去除噪声）", "数据采集（感知层功能）", "数据挖掘（提取价值）", "", ""], "r": "ABD", "e": "数据采集是感知层功能，并非数据处理关键技术。数据融合可整合多源数据，数据清洗能去除噪声，数据挖掘可提取数据价值，它们都是数据处理关键技术。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657283", "t": 2, "q": "虚拟现实（VR）技术的主要应用场景有（　）？", "a": ["游戏娱乐（如VR游戏）", "视频直播（如沉浸式体验直播）", "教育培训（如虚拟实训、模拟操作）", "虚拟旅游（如通过VR访问历史遗迹）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657284", "t": 2, "q": "虚拟现实（VR）系统的关键组成部分包括以下哪些？", "a": ["动作捕捉设备", "音频输出设备", "真实环境摄像头", "虚拟场景建模软件", "", ""], "r": "ABD", "e": "VR系统需捕捉用户动作、输出音频营造沉浸感、用软件构建虚拟场景。动作捕捉设备能捕捉动作，音频输出设备提供声音，虚拟场景建模软件创建虚拟场景，都是关键部分。而真实环境摄像头一般不是VR系统关键组成。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657285", "t": 2, "q": "虚拟现实（VR）系统的核心组成部分包括（　）？", "a": ["大数据存储服务器", "头戴式显示设备（HMD）", "运动追踪设备（如手柄、定位器）", "云计算平台", "", ""], "r": "BC", "e": "VR系统核心要能提供沉浸体验和交互功能，头戴式显示设备是提供沉浸式视觉体验关键，运动追踪设备实现交互。大数据存储服务器和云计算平台并非核心组成。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657286", "t": 2, "q": "虚拟现实（VR）系统中，提升用户沉浸感的技术手段有（　）？", "a": ["触觉反馈技术（模拟物体触感）", "大数据分析技术（分析用户行为）", "广角视野（如100度以上视场角）", "3D音效技术（模拟空间声音方向）", "", ""], "r": "ACD", "e": "触觉反馈能让用户感受物体触感、广角视野扩大视觉范围、3D音效模拟声音方向，这些都可提升VR沉浸感；而大数据分析用户行为主要用于了解用户，与提升沉浸感无直接关联。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657287", "t": 2, "q": "虚拟现实技术中，为提升用户沉浸感，常用的感官模拟技术有哪些？", "a": ["听觉模拟（如3D音效）", "味觉模拟（如电子味觉模拟器）", "触觉模拟（如力反馈设备）", "嗅觉模拟（如气味发生器）", "", ""], "r": "ACD", "e": "在虚拟现实技术里，A选项3D音效可营造逼真听觉环境；C选项力反馈设备能让用户感受触觉；D选项气味发生器可模拟不同气味，这些都能提升沉浸感。而B选项电子味觉模拟器目前技术还远未成熟且不常用。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657288", "t": 2, "q": "虚拟现实系统中，影响用户体验的关键技术指标有哪些？", "a": ["画面刷新率（如90Hz以上）", "虚拟场景的建模精度", "视场角（FOV，如100度以上）", "设备的重量与舒适度", "", ""], "r": "ABCD", "e": "画面刷新率高可减少画面延迟与拖影，提升流畅感；虚拟场景建模精度高让场景更逼真；较大视场角能提供更广阔视野；设备重量轻、舒适度高可减少佩戴不适，这些都影响用户体验。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657289", "t": 2, "q": "以下属于边缘计算与云计算协同应用场景的有（　）？", "a": ["区块链挖矿:边缘节点进行算力计算，云计算存储交易数据", "大数据分析:边缘设备采集数据，云计算进行批量处理", "智能安防:边缘设备实时识别异常画面，云计算存储历史视频", "自动驾驶汽车:边缘节点实时处理传感器数据，云计算进行长期模型训练", "", ""], "r": "BCD", "e": "边缘计算靠近数据源进行实时处理，云计算有强大存储和批量处理能力。选项A区块链挖矿主要靠专业矿机集中计算，非边缘与云协同典型场景；B边缘采集数据云批量处理、C边缘实时识别云存历史视频、D边缘实时处理数据云长期训练模型，均体现边缘与云计算协同。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657290", "t": 2, "q": "以下属于边缘计算与云计算协同应用的场景有哪些？", "a": ["工业设备实时数据在边缘节点处理，汇总结果上传云端", "自动驾驶汽车本地处理路况数据，非实时数据上传云端", "边缘节点处理用户视频通话实时数据，云端存储历史通话记录", "云端训练AI模型，边缘节点部署模型进行实时推理", "", ""], "r": "ABCD", "e": "边缘计算侧重本地实时处理，云计算有强大存储和计算能力。四个选项都体现了边缘计算和云计算的协同，A是边缘处理数据后汇总到云端；B本地处理实时路况，非实时数据上云；C边缘处理实时通话，云端存历史记录；D云端训练模型，边缘部署推理。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657291", "t": 2, "q": "以下属于大数据存储技术的有哪些？", "a": ["MySQL（关系型数据库）", "HBase（列式数据库）", "Redis（键值数据库）", "MapReduce（分布式计算框架）", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657292", "t": 2, "q": "以下属于大数据分析技术的有哪些？", "a": ["聚类分析", "MapReduce分布式计算", "机器学习算法（如决策树、神经网络）", "数据库索引技术", "", ""], "r": "ABC", "e": "大数据分析技术用于处理和分析海量数据。聚类分析可对数据分组，MapReduce适合大规模数据分布式处理，机器学习算法能挖掘数据模式和规律，它们都是大数据分析常用技术。数据库索引技术主要用于数据库查询优化，并非大数据分析核心技术。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657293", "t": 2, "q": "以下属于混合云架构应用场景的有（　）？", "a": ["企业仅使用公有云，未部署私有云", "企业日常业务在私有云运行，业务高峰期临时租用公有云资源", "企业将核心财务数据存储在私有云，将营销活动数据存储在公有云", "企业将私有云与公有云通过专用网络连接，实现数据互通", "", ""], "r": "BCD", "e": "混合云是公有云和私有云的组合。A选项仅用公有云，不是混合云场景。B选项日常业务在私有云，高峰用公有云，结合了两者；C选项核心数据放私有云，营销数据放公有云，也是混合云应用；D选项私有云和公有云连接互通，属于混合云架构。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657294", "t": 2, "q": "以下属于区块链应用场景的有（　）？", "a": ["版权保护（如数字作品的权属登记与追溯）", "供应链金融（如基于区块链的应收账款融资）", "大数据实时分析", "跨境支付（如点对点的数字货币转账）", "", ""], "r": "ABD", "e": "区块链具有去中心化、不可篡改、可追溯等特性。A选项版权保护可利用其可追溯和不可篡改特性进行权属登记与追溯；B选项供应链金融用其特性可确保应收账款等信息真实可靠；D选项跨境支付利用区块链能实现点对点转账。而大数据实时分析主要依赖数据处理和分析技术，并非区块链典型应用场景。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657295", "t": 2, "q": "以下属于云计算安全风险的有（　）？", "a": ["虚拟化技术漏洞导致虚拟机逃逸", "数据存储在云端，存在数据泄露风险", "物联网设备接入云端导致的设备安全风险", "大数据分析导致的用户隐私泄露", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657296", "t": 2, "q": "以下属于云计算部署模式的有哪些？", "a": ["私有云", "公有云", "混合云", "社区云", "", ""], "r": "ABCD", "e": "云计算部署模式主要有私有云、公有云、混合云和社区云。私有云供单一组织使用；公有云由云服务提供商提供给公众使用；混合云是私有云和公有云的组合；社区云供特定社区的多个组织共享使用。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657297", "t": 2, "q": "以下属于云计算关键技术的有（　）？", "a": ["分布式计算与存储技术", "数据挖掘技术", "边缘计算技术", "虚拟化技术", "", ""], "r": "AD", "e": "云计算关键技术包含分布式计算与存储技术来处理和存储海量数据，虚拟化技术可实现资源的高效分配和利用。数据挖掘是从大量数据找知识，边缘计算侧重靠近数据源处理，并非云计算核心关键技术。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813880722657298", "t": 2, "q": "云计算的核心特性包括以下哪些？", "a": ["快速弹性伸缩", "广泛的网络接入", "可计量的服务", "按需自助服务", "", ""], "r": "ABCD", "e": "云计算核心特性有按需自助服务、广泛的网络接入、资源池化、快速弹性伸缩、可计量的服务等。ABCD选项均符合云计算核心特性。答案：ABCD
