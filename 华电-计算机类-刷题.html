<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>华电-计算机类-刷题</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <button class="btn" id="back" style="display:none">‹ 返回</button>
  <h1 id="hTitle">珞研刷题</h1>
  <button class="star" id="star" style="display:none">★</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const DATA = {"id": "yw2033827356900200448", "name": "华电-计算机类", "chapters": [{"k": "基础练习题【含解析】||第1章 数据结构与算法（1）", "n": "基础练习题【含解析】 / 第1章 数据结构与算法（1）", "qs": [{"id": "2034813749885538304", "t": 1, "q": "对数据（5,3,8,6,2）进行堆排序，初始建堆（大根堆）后，堆顶元素为？", "a": ["6", "5", "2", "8", "", ""], "r": "D", "e": "大根堆要求每个节点的值都大于或等于其子节点的值。对（5,3,8,6,2）建大根堆，最大值会处于堆顶。这组数据中最大值是8，所以堆顶元素为8。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538305", "t": 1, "q": "对一个有n个节点的二叉树进行后序遍历，若采用非递归方式实现，通常需要借助哪种数据结构？", "a": ["数组", "队列", "栈", "哈希表", "", ""], "r": "C", "e": "后序遍历非递归实现时，需要先访问左子树、右子树，最后访问根节点，要回溯节点，栈有后进先出的特性适合用于保存节点以便回溯，所以通常借助栈。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538306", "t": 1, "q": "对一组数据（18,25,63,50,42,32）进行直接插入排序，当插入第5个元素（42）时，需要进行的元素比较次数为？", "a": ["5", "4", "3", "2", "", ""], "r": "C", "e": "直接插入排序是将未排序数据插入已排序序列的合适位置。插入第5个元素（42）时，已排序序列是18、25、63、50 。从后往前比较，先与50比，再与63比，再与25比，共3次比较就找到插入位置。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538307", "t": 1, "q": "对于循环队列，若队列的最大容量为maxSize，front为队头指针（指向队头元素），rear为队尾指针（指向队尾元素的下一个位置），则队列满的条件是？", "a": ["rear==front", "(rear+1)%maxSize==front", "rear+1==front", "(rear-1)%maxSize==front", "", ""], "r": "B", "e": "循环队列判断满时，为避免与队空条件混淆，通常牺牲一个存储单元，当队尾指针再进一个位置就到队头时，即 (rear + 1) % maxSize 等于 front 时表示队列满。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538308", "t": 1, "q": "对于循环队列，若front=3，rear=7，maxSize=10，则队列中元素的个数为？", "a": ["4", "5", "6", "7", "", ""], "r": "A", "e": "循环队列元素个数计算公式为(rear - front + maxSize) % maxSize ，代入 front = 3，rear = 7，maxSize = 10，可得(7 - 3 + 10) % 10 = 4。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538309", "t": 1, "q": "对于一个带有头节点的双向循环链表，在已知某节点p的情况下，删除该节点的时间复杂度为？", "a": ["O(n²)", "O(1)", "O(n)", "O(logn)", "", ""], "r": "B", "e": "答案：B双向循环链表中，在已知节点 p 的情况下，删除该节点只需修改指针，时间复杂度为 O(1)。", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538310", "t": 1, "q": "对于一个链队列（带头结点），若要判断队列是否为空，下列条件正确的是哪一项？", "a": ["队尾指针rear的next==null", "队头指针front==null", "队头指针front的next==null", "队头指针front==队尾指针rear", "", ""], "r": "C", "e": "链队列带头结点，队头指针指向头结点，队列空时头结点的下一个结点为空。所以判断队列是否为空，看队头指针front的next是否为null。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538311", "t": 1, "q": "对于一个有向无环图（DAG），要获取其所有顶点的一个线性序列，使得对于图中的任意一条有向边(u,v)，顶点u在序列中都位于顶点v之前，这种操作被称为？", "a": ["图的最短路径求解", "图的拓扑排序", "图的强连通分量分解", "图的遍历", "", ""], "r": "B", "e": "拓扑排序就是对有向无环图的顶点进行排序，让图中任意有向边(u,v)里，u在序列中都在v之前。A选项求最短路径是找两点间最短距离；C选项强连通分量分解是找相互可达的顶点集合；D选项图的遍历是访问图中所有顶点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538312", "t": 1, "q": "对于一个栈，若输入序列为1,2,3,4，且输出序列的第一个元素为3，则第四个输出元素不可能是？", "a": ["无法确定", "2", "4", "1", "", ""], "r": "B", "e": "输入序列为1,2,3,4，输出第一个元素是3，说明此时1、2、3入栈，3出栈。接下来可能2出栈，然后4入栈出栈，最后1出栈；也可能4入栈出栈，接着2出栈，最后1出栈。所以第四个输出元素可能是1或4，不可能是2。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538313", "t": 1, "q": "对于一个栈，若输入序列为1,2,3,4，以下哪个输出序列不可能通过栈的合法操作得到？", "a": ["2,4,3,1", "4,3,2,1", "1,3,4,2", "3,1,2,4", "", ""], "r": "D", "e": "栈是后进先出的数据结构。D选项中，要先输出3，则1、2、3依次入栈，3出栈后，栈顶是2，下一个输出只能是2而不能是1，所以D不可能。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538314", "t": 1, "q": "对于一个长度为n的顺序表，在第i个位置（1≤i≤n+1）插入一个元素，需移动元素的个数为？", "a": ["n-i+1", "i", "n-i", "i-1", "", ""], "r": "A", "e": "在顺序表第i个位置插入元素，从第n个元素开始到第i个元素都要后移一位，总共要移动n - i + 1个元素。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538315", "t": 1, "q": "对于一个长度为n的顺序表，在其第i个位置（1≤i≤n+1）插入一个元素，平均需要移动的元素个数是多少？", "a": ["n", "(n+1)/2", "(n-1)/2", "n/2", "", ""], "r": "D", "e": "顺序表插入元素，i 取值范围 1≤i≤n+1。在第 i 个位置插入，需要向后移动 n-i+1 个元素。<br />i=1，移动 n 个元素；i=2，移动 n-1 个元素；……i=n+1，移动 0 个元素。<br />总移动次数 = n+(n-1)+……+0 = n (n+1)/2。<br />共有 n+1 个可插入位置，平均移动元素个数 = [n (n+1)/2]/(n+1)=n/2。因此选 D。", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538316", "t": 1, "q": "对于一个长度为n的序列，采用直接插入排序算法，在最坏情况下（序列逆序）的时间复杂度是多少？", "a": ["O(n²)", "O(n log n)", "O(n)", "O(n³)", "", ""], "r": "A", "e": "直接插入排序最坏情况（序列逆序）时，需进行大量元素移动和比较，每插入一个元素都要和前面所有元素比较，时间复杂度为O(n²)。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538317", "t": 1, "q": "对于一棵哈夫曼树，下列叙述中错误的是哪一项？", "a": ["若哈夫曼树有n个叶子节点，则其总节点数为2n-1", "哈夫曼树是带权路径长度最短的二叉树", "哈夫曼树的形态是唯一的，与权值的大小顺序无关", "哈夫曼树中没有度为1的节点", "", ""], "r": "C", "e": "哈夫曼树构建时，每次选取权值最小的两个节点合并，因选取方式不唯一，所以形态不唯一。A选项，哈夫曼树非叶节点数是叶子节点数减1，总节点数就是2n - 1；B选项，哈夫曼树定义就是带权路径长度最短的二叉树；D选项，哈夫曼树构建过程决定没有度为1的节点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538318", "t": 1, "q": "若哈希函数为hash(key)=key%11，采用链地址法解决哈希冲突，现将关键字序列{23,14,9,6,30,15,24}插入哈希表，则哈希地址为2的链表中包含的关键字个数为？", "a": ["1", "4", "2", "3", "", ""], "r": "A", "e": "根据哈希函数计算各关键字哈希地址，23%11 = 1，14%11 = 3，9%11 = 9，6%11 = 6，30%11 = 8，15%11 = 4，24%11 = 2，只有24的哈希地址为2。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538319", "t": 1, "q": "若某字符串的长度为n（n≥1），则该字符串的子串个数为？", "a": ["n", "n+1", "n(n+1)/2", "n(n-1)/2", "", ""], "r": "C", "e": "长度为n的字符串，子串长度可以是1到n，长度为1的子串有n个，长度为2的子串有n - 1个，以此类推，长度为n的子串有1个，根据等差数列求和公式可得子串个数为n(n + 1)/2。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538320", "t": 1, "q": "若栈的输入序列为1,2,3,4,5，且在入栈过程中允许出栈操作，则下列不可能的出栈序列是哪一项？", "a": ["2,3,1,5,4", "3,2,4,1,5", "2,1,5,3,4", "1,5,4,3,2", "", ""], "r": "C", "e": "根据栈先进后出原则判断。C选项中要出5，意味着1、2、3、4、5都已入栈，此时出5后栈顶是4，应先出4而不是3，所以C不可能。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538321", "t": 1, "q": "下列关于平衡二叉树（AVL树）的说法中，正确的是？", "a": ["AVL树中每个节点的左右子树的高度差的绝对值不超过1", "AVL树的查找时间复杂度为O(n)", "AVL树的中序遍历序列一定是降序序列", "插入节点后，AVL树无需调整即可保持平衡", "", ""], "r": "A", "e": "AVL树定义要求每个节点左右子树高度差绝对值不超1；其查找复杂度是O(logn)；中序遍历是升序；插入节点可能破坏平衡需调整。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538322", "t": 1, "q": "下列关于图的存储结构的说法中，错误的是？", "a": ["邻接表中，每个顶点的邻接链表存储其相邻的顶点", "对于有向图，邻接矩阵的第i行非零元素个数等于第i个顶点的出度", "邻接表存储无向图时，每个边会被存储两次，因此存储空间是邻接矩阵的两倍", "邻接矩阵适合存储稠密图", "", ""], "r": "C", "e": "邻接表存储无向图时，边存储两次，但邻接表空间复杂度与边和顶点数有关，邻接矩阵与顶点数平方有关，不能简单说邻接表存储空间是邻接矩阵两倍。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538323", "t": 1, "q": "下列关于图的最小生成树的说法中，正确的是？", "a": ["普里姆算法适合求边稀疏图的最小生成树", "克鲁斯卡尔算法的时间复杂度与图的顶点数无关", "最小生成树的边数等于图中顶点数减1", "一个图的最小生成树一定是唯一的", "", ""], "r": "C", "e": "普里姆算法适合边稠密图，A错误；克鲁斯卡尔算法时间复杂度与边数有关，也和顶点数有关（要判断连通性），B错误；一个图的最小生成树可能不唯一，D错误；最小生成树是连通无回路的，边数等于顶点数减1。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538324", "t": 1, "q": "下列关于线性表的说法中，错误的是？", "a": ["线性表的顺序存储结构的存储空间利用率一定高于链式存储结构", "线性表的链式存储结构不需要连续的存储空间", "线性表的链式存储结构中，元素的插入和删除操作不需要移动元素", "线性表的顺序存储结构可以随机访问任意元素", "", ""], "r": "A", "e": "顺序存储结构需预先分配连续空间，可能有空间浪费，而链式存储按需分配，在某些情况下顺序存储利用率不一定高。B、C、D选项描述均正确。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538325", "t": 1, "q": "下列关于栈的描述中，错误的是？", "a": ["栈的顺序存储结构中，通常用top指针指示栈顶位置", "栈的插入和删除操作只能在栈顶进行", "栈的链式存储结构中，栈底节点的next指针指向栈顶节点", "栈遵循\"先进后出\"的原则", "", ""], "r": "C", "e": "栈的链式存储结构中，栈顶节点的next指针指向栈中下一个节点，而不是栈底节点的next指针指向栈顶节点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538326", "t": 1, "q": "下列关于字符串模式匹配的KMP算法的说法中，错误的是？", "a": ["KMP算法通过预处理模式串得到部分匹配表（next数组）", "KMP算法的时间复杂度为O(m+n)，其中m为模式串长度，n为主串长度", "KMP算法的空间复杂度为O(1)，无需额外存储空间", "KMP算法在匹配过程中，主串的指针不需要回溯", "", ""], "r": "C", "e": "KMP算法预处理模式串得到next数组，需额外空间存储，空间复杂度为O(m)，不是O(1)。它时间复杂度是O(m + n)，主串指针不回溯。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538327", "t": 1, "q": "下列排序算法中，时间复杂度不受数据初始状态影响，始终为O(n²)的是？", "a": ["简单选择排序", "冒泡排序", "插入排序", "快速排序", "", ""], "r": "A", "e": "简单选择排序无论数据初始状态如何，都需比较和交换，时间复杂度始终是O(n²)；冒泡排序、插入排序在数据基本有序时复杂度可降为O(n)；快速排序在数据基本有序时会退化为O(n²)，平均复杂度是O(nlog₂n)。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538328", "t": 1, "q": "下列图的遍历算法中，能用于求有向无环图（DAG）拓扑排序的是？", "a": ["深度优先搜索（DFS）", "迪杰斯特拉算法", "普里姆算法", "广度优先搜索（BFS）", "", ""], "r": "A", "e": "深度优先搜索（DFS）可用于有向无环图（DAG）拓扑排序，在DFS过程中，当一个节点的所有邻接节点都被访问完后，将该节点入栈，最后依次出栈得到拓扑排序。迪杰斯特拉算法用于求最短路径，普里姆算法用于求最小生成树，广度优先搜索（BFS）虽也可用于拓扑排序，但本题更强调DFS在拓扑排序中的应用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538329", "t": 1, "q": "已知某二叉树的后序遍历序列为DEBFCA，中序遍历序列为DBEAFC，则该二叉树的前序遍历序列为？", "a": ["ABDCEF", "ABDECF", "ABEDCF", "ABECDF", "", ""], "r": "B", "e": "后序遍历最后一个元素是根节点，所以根是A。在中序遍历里，A左边是左子树节点（DBE），右边是右子树节点（FC）。对左右子树同样根据后序和中序确定根和子树，逐步构建二叉树。可得前序遍历是ABDECF。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538330", "t": 1, "q": "已知某二叉树的前序遍历序列为ABDECF，中序遍历序列为DBEAFC，则该二叉树的后序遍历序列为？", "a": ["DEBFAC", "DEFBCA", "DEBCFA", "DEBFCA", "", ""], "r": "D", "e": "前序遍历先访问根节点，中序遍历先访问左子树再根节点最后右子树。由前序遍历首字母A可知A是根节点，结合中序遍历可确定左子树节点为DBE，右子树节点为FC。再分别对左右子树重复此过程构建二叉树，最后得出后序遍历（左子树、右子树、根节点）为DEBFCA。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538331", "t": 1, "q": "已知一个带头结点的单链表，其节点结构为data+next，若要删除链表中第一个数据值等于x的节点，下列算法思路中正确的是哪一项？", "a": ["若该节点是尾节点，无法通过单链表结构删除，需转为双向链表才能操作", "需先找到该节点及其前驱节点，将前驱节点的next指针指向其后继节点，再释放该节点内存", "直接找到该节点，将其data值覆盖为后续节点data，再删除后续节点，无需考虑前驱", "仅需找到该节点，将其前驱节点的next指针指向其后继节点，无需释放该节点内存", "", ""], "r": "B", "e": "在单链表中删除节点，要先找到待删节点及其前驱节点，让前驱节点的 next 指针指向待删节点的后继节点，再释放待删节点内存。A 选项单链表可删除尾节点；C 选项对于尾节点无法用此方法；D 选项不释放节点内存会造成内存泄漏。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538332", "t": 1, "q": "已知一个二维数组A[1..m][1..n]采用行优先顺序存储，每个元素占k个存储单元，元素A[1][1]的存储地址为LOC，那么元素A[i][j]的存储地址为？", "a": ["LOC+(i-1)mk+(j-1)*k", "LOC+(i-1)nk+(j-1)*k", "LOC+(i*m+j)*k", "LOC+ink+j*k", "", ""], "r": "B", "e": "为了计算二维数组A[i][j]的存储地址，我们需要了解以下信息：1. 二维数组的存储方式：题目中提到二维数组A[1..m][1..n]采用行优先顺序存储，这意味着数组的元素是按行顺序存储的。2. 每个元素占用的存储单元数：每个元素占k个存储单元。3. 元素A[1][1]的存储地址：已知元素A[1][1]的存储地址为LOC。### 解析过程： 在行优先顺序存储中，数组的第i行之前有(i-1)行。 每一行有n个元素，因此第i行之前的所有元素总数为(i-1) * n。 第i行中，A[i][j]之前有(j-1)个元素。因此，A[i][j]之前的所有元素总数为：「test/yiwen_img/importSubject/2034813747201183744.png」每个元素占用k个存储单元，所以A[i][j]的存储地址为：「test/yiwen_img/importSubject/2034813747482202112.png」简化后得到：「test/yiwen_img/importSubject/2034813747536728064.png」### 正确答案：B. LOC+(i-1)nk+(j-1)*k", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538333", "t": 1, "q": "已知一个无向图的邻接矩阵为A，其中A[i][j]=1表示顶点i和j之间有边，A[i][j]=0表示无边。下列关于邻接矩阵的叙述中正确的是哪一项？", "a": ["通过邻接矩阵计算顶点i的度，需统计第i行中非零元素的个数，无向图和有向图计算方式相同", "邻接矩阵一定是对称矩阵，且对角线元素全为0（假设无自环）", "邻接矩阵存储适合表示稀疏图，能节省存储空间", "邻接矩阵的行数等于边数，列数等于顶点数", "", ""], "r": "B", "e": "A选项，有向图顶点度分入度和出度，计算与无向图不同；B选项，无向图邻接矩阵对称且无自环时对角线为0，正确；C选项，邻接矩阵适合稠密图，稀疏图用邻接表节省空间；D选项，邻接矩阵行列数都等于顶点数。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538334", "t": 1, "q": "已知一个稀疏矩阵采用三元组表存储，其非零元素个数为k，矩阵总行数为m、总列数为n，若要查找某行非零元素的个数，最优情况下的时间复杂度为？", "a": ["O(logk)", "O(m+k)", "O(k)", "O(n)", "", ""], "r": "C", "e": "三元组表存储稀疏矩阵，查找某行非零元素个数，需遍历三元组表中的每个元素，非零元素个数为k，所以最优时间复杂度是O(k)。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538335", "t": 1, "q": "已知一个稀疏矩阵的三元组表为{(1,2,5),(1,4,3),(2,3,2),(3,1,4)}，该矩阵对应的行、列数至少为？", "a": ["4行3列", "3行4列", "4行4列", "3行3列", "", ""], "r": "B", "e": "三元组格式 (行号，列号，数值)，遍历所有三元组：(1,2,5)、(1,4,3)、(2,3,2)、(3,1,4)。最大行号 = 3，最大列号 = 4。矩阵行数至少等于最大行号，列数至少等于最大列号 → 3 行 4 列。", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538336", "t": 1, "q": "已知一个栈的初始状态为空，执行下列操作序列:push(1)、push(2)、pop（　）、push(3)、pop（　）、pop（　）、push(4)，则栈顶元素是多少？", "a": ["2", "1", "3", "4", "", ""], "r": "D", "e": "push 是入栈操作，pop 是出栈操作。初始为空，入栈 1、2，出栈 2，入栈 3，出栈 3，出栈 1，入栈 4，此时栈顶是 4。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538337", "t": 1, "q": "已知一个长度为10的有序表，采用折半查找法查找一个不存在的元素，最多需要比较的次数是多少？", "a": ["6", "3", "4", "5", "", ""], "r": "C", "e": "折半查找每次把查找区间缩小一半。对于长度为n的有序表，折半查找最多比较次数为「test/yiwen_img/importSubject/2034813747624808448.png」。这里n = 10，「test/yiwen_img/importSubject/2034813747729666048.png」。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538338", "t": 1, "q": "已知一棵二叉树的前序遍历序列为ABDECF，中序遍历序列为DBEAFC，则其后序遍历序列为哪一项？", "a": ["DEFBCA", "DBEFCA", "DEBFCA", "DEBCFA", "", ""], "r": "C", "e": "前序遍历先访问根节点，中序遍历根节点在左右子树中间。由前序遍历序列ABDECF可知A是根节点，结合中序遍历序列DBEAFC，可得DBE是左子树，FC是右子树。再逐步确定子树结构，进而得出后序遍历是先左子树、再右子树、最后根节点，得出后序遍历序列为DEBFCA。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538339", "t": 1, "q": "以下关于队列的说法中，正确的是？", "a": ["循环队列的队满条件是front==rear", "优先级队列的出队顺序仅取决于元素的入队顺序", "链队列的队空条件是front==rear且front!=NULL", "阻塞队列在队满时会阻止入队操作，直到有元素出队", "", ""], "r": "D", "e": "A选项，循环队列队满是(rear + 1) % maxsize == front ；B选项，优先级队列出队顺序取决于元素优先级；C选项，链队列队空是front == rear且front == NULL ；D选项，阻塞队列队满时会阻塞入队，直到有元素出队，该说法正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538340", "t": 1, "q": "以下关于图的说法中，错误的是？", "a": ["强连通图一定是连通图（针对无向图的连通定义）", "有向图的邻接矩阵可能是对称矩阵", "无向图的边数等于其邻接表中所有节点边链表长度之和的一半", "一个有n个节点的无向图，若边数大于n-1，则一定存在环", "", ""], "r": "A", "e": "A选项，强连通图是有向图概念，连通图是无向图概念，强连通图的有向边去掉方向后不一定连通，所以该说法错误；B选项，有向完全图的邻接矩阵是对称矩阵；C选项，无向图的每条边在邻接表中会被记录两次，所以边数是邻接表中所有节点边链表长度之和一半；D选项，n个节点的无向树边数是n - 1，边数大于n - 1就会有环。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538341", "t": 1, "q": "以下关于线性表的说法中，正确的是？", "a": ["双向链表的节点删除操作，时间复杂度为O(n)", "链式存储的线性表，不能随机访问任意元素", "顺序存储的线性表，插入元素时不需要移动其他元素", "循环链表不能判断表是否为空", "", ""], "r": "B", "e": "A项双向链表删除节点时间复杂度是O(1)；C项顺序存储线性表插入元素通常要移动元素；D项循环链表能判断是否为空。链式存储线性表需从头遍历找元素，不能随机访问任意元素。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538342", "t": 1, "q": "以下关于字符串的说法中，错误的是？", "a": ["字符串的存储可以采用顺序存储，也可以采用链式存储", "空字符串的长度为0", "两个字符串比较大小时，仅比较它们的长度即可", "字符串的模式匹配（如KMP算法）的时间复杂度可达到O(m+n)（m为模式串长度，n为主串长度）", "", ""], "r": "C", "e": "比较两个字符串大小，是按字符的ASCII码值逐字符比较，并非仅比较长度。A选项，字符串存储有顺序和链式两种；B选项，空字符串无字符，长度为0；D选项，KMP算法时间复杂度是O(m + n)。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538343", "t": 1, "q": "以下哪种排序算法是稳定排序？", "a": ["堆排序", "归并排序", "快速排序", "简单选择排序", "", ""], "r": "B", "e": "稳定排序是指排序前后相同元素的相对顺序不变。归并排序在合并过程中能保证相同元素相对顺序不变，是稳定排序；而堆排序、快速排序、简单选择排序在排序过程中会改变相同元素的相对顺序，是不稳定排序。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538344", "t": 1, "q": " 以下哪种排序算法在最坏情况下的时间复杂度不是 O (n²)？", "a": ["直接选择排序", "希尔排序", "冒泡排序", "堆排序", "", ""], "r": "D", "e": "A 选项，直接选择排序，最好、最坏、平均时间复杂度均为 O (n²)。<br />B 选项，希尔排序，采用原始增量序列时最坏时间复杂度 O (n²)。<br />C 选项，冒泡排序，序列完全逆序时达到最坏情况，时间复杂度 O (n²)。<br />D 选项，堆排序，最好、最坏、平均时间复杂度均稳定为 O (n log n)，最坏复杂度不是 O (n²)。", "ap": [false, false, false, false, false, false]}, {"id": "2034813749885538345", "t": 1, "q": "以下哪种数据结构常用于实现编译器中的符号表？", "a": ["哈希表", "队列", "二叉树", "栈", "", ""], "r": "A", "e": "符号表需快速查找、插入和删除符号，哈希表能在平均 O(1) 时间复杂度完成这些操作，很适合实现符号表。队列主要用于先进先出场景；二叉树虽可用于查找，但效率不如哈希表；栈是后进先出结构，不适合用于符号表。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899776", "t": 2, "q": "对于单链表的操作，下列说法中正确的有？", "a": ["删除单链表中某个节点，必须先找到其前驱节点", "单链表的存储空间不需要连续", "在单链表尾部插入节点，若已知尾指针，时间复杂度为O(1)", "在单链表头部插入节点，时间复杂度为O(1)", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899777", "t": 2, "q": "对于二维数组的压缩存储，下列说法中正确的有？", "a": ["二维数组的压缩存储仅适用于对称矩阵，不适用于稀疏矩阵", "稀疏矩阵的压缩存储方式中，三元组表是常用方式之一", "对称矩阵压缩存储后，访问任意元素时需计算其在压缩数组中的位置", "稀疏矩阵的压缩存储通常只存储非零元素及其行号、列号", "", ""], "r": "BCD", "e": "A选项错误，二维数组压缩存储适用于对称矩阵、稀疏矩阵等；B选项正确，三元组表是稀疏矩阵常用压缩存储方式；C选项正确，对称矩阵压缩存储后访问元素需计算位置；D选项正确，稀疏矩阵压缩存储通常只存非零元素及行号、列号。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899778", "t": 2, "q": "对于循环队列，下列说法中正确的有？", "a": ["循环队列的队头指针front始终指向队头元素", "循环队列的最大容量固定，元素个数不能超过最大容量", "判断循环队列是否为空，可通过front==rear实现（假设无计数变量）", "循环队列可以避免顺序队列的\"假溢出\"问题", "", ""], "r": "BCD", "e": "A选项，队头指针front指向队头元素前一位置；B选项，循环队列最大容量固定，元素个数不能超最大容量；C选项，无计数变量时，front==rear可判断队空；D选项，循环队列能避免顺序队列“假溢出”。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899779", "t": 2, "q": "对于循环队列，下列叙述中正确的有哪些？", "a": ["循环队列的元素个数计算公式为(rear-front+maxSize)%maxSize", "循环队列可以解决顺序队列的\"假溢出\"问题", "判断循环队列是否为满的条件可以是(rear+1)%maxSize==front", "循环队列的队头指针front和队尾指针rear始终指向有效的队列元素", "", ""], "r": "ABC", "e": "A选项，循环队列元素个数该公式正确；B选项，循环队列可解决顺序队列“假溢出”；C选项，此为常见判断循环队列满的条件；D选项，队头队尾指针不一定始终指向有效元素。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899780", "t": 2, "q": "对于一个单链表，下列操作中，时间复杂度为O(1)的有哪些（假设链表带头结点，且已知相关节点的指针）？", "a": ["删除已知节点p的后继节点", "删除已知节点p", "在已知节点p之后插入一个新节点", "求单链表的长度", "", ""], "r": "AC", "e": "A选项，删除已知节点p的后继节点，直接修改指针，时间复杂度O(1)；C选项，在已知节点p之后插入新节点，也是修改指针，时间复杂度O(1)。B选项删除已知节点p，需找到其前驱节点，时间复杂度O(n)；D选项求单链表长度要遍历链表，时间复杂度O(n)。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899781", "t": 2, "q": "对于一个双向链表，已知某节点p，以下操作中时间复杂度为O(1)的有？", "a": ["查找链表的头节点", "删除节点p", "在节点p的前面插入一个新节点", "查找链表的尾节点", "", ""], "r": "BC", "e": "双向链表中，每个节点有指向前驱和后继的指针。查找头节点和尾节点需从头或尾遍历，时间复杂度不是O(1)。而删除节点p、在节点p前插入新节点，利用其前后指针可直接操作，时间复杂度为O(1)。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899782", "t": 2, "q": "对于一棵二叉树，以下关于遍历的说法中，正确的有？", "a": ["中序遍历的顺序是\"左-根-右\"", "层次遍历需要借助队列实现", "后序遍历的顺序是\"左-右-根\"", "已知前序和中序遍历序列，可唯一确定一棵二叉树", "", ""], "r": "ABCD", "e": "A选项，中序遍历规则就是“左 - 根 - 右”；B选项，层次遍历按层访问，借助队列先进先出特性实现；C选项，后序遍历顺序为“左 - 右 - 根”；D选项，前序确定根节点，中序划分左右子树，能唯一确定二叉树。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899783", "t": 2, "q": "下列关于查找算法的说法中，正确的有？", "a": ["哈希查找的时间复杂度在理想情况下为O(1)", "二分查找（折半查找）要求待查找序列必须有序", "顺序查找的时间复杂度为O(n)，适用于小规模数据", "平衡二叉树（AVL树）的查找时间复杂度为O(logn)", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899784", "t": 2, "q": "下列关于查找算法的叙述中，正确的有哪些？", "a": ["哈希查找的平均查找长度与哈希函数的好坏、冲突解决方法无关", "二叉排序树的查找效率取决于树的深度，最好情况为O(log n)，最坏情况为O(n)", "顺序查找适用于线性表的顺序存储和链式存储，平均查找长度为O(n)", "折半查找仅适用于有序的顺序表，平均查找长度为O(log n)", "", ""], "r": "BCD", "e": "A选项，哈希查找平均查找长度与哈希函数和冲突解决方法有关，A错误；B选项，二叉排序树最好情况树平衡，查找效率O(log n)，最坏退化为链表，效率O(n)，B正确；C选项，顺序查找对顺序和链式存储都适用，平均找n/2个元素，效率O(n)，C正确；D选项，折半查找需有序顺序表，平均效率O(log n)，D正确。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899785", "t": 2, "q": "下列关于查找算法的应用场景中，正确的有？", "a": ["二分查找适用于数据量较大、数据有序的场景", "顺序查找适用于数据量小、数据无序的场景", "平衡二叉树（AVL树）适用于频繁插入删除和查找的场景", "二叉排序树（BST）适用于数据有序且插入删除较少的场景", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899786", "t": 2, "q": "下列关于堆排序的叙述中，正确的有哪些？", "a": ["大根堆的堆顶元素是序列中的最大值，小根堆的堆顶元素是序列中的最小值", "堆排序的核心操作是建堆和堆调整，建堆过程可通过自下而上的堆调整实现", "堆排序的时间复杂度为O(n log n)，与序列的初始排列无关", "堆排序的空间复杂度为O(1)，属于原地排序算法", "", ""], "r": "ABCD", "e": "A选项符合大根堆和小根堆性质；B选项建堆可自下而上堆调整实现；C选项堆排序时间复杂度稳定在O(n log n)，不受初始排列影响；D选项堆排序仅需常数级额外空间，是原地排序。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899787", "t": 2, "q": "下列关于队列的应用场景中，正确的有哪些？", "a": ["树的层次遍历（广度优先遍历）", "图的广度优先遍历", "递归算法的实现", "缓冲区的数据处理（如打印机队列）", "", ""], "r": "ABD", "e": "队列特点是先进先出。树的层次遍历、图的广度优先遍历按顺序依次访问节点，用队列实现；缓冲区数据处理按先后顺序处理，用队列；而递归算法用栈实现。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899788", "t": 2, "q": "下列关于二叉排序树（BST）的说法中，正确的有？", "a": ["二叉排序树的查找时间复杂度最坏为O(n)（如树为单支树）", "在二叉排序树中插入新节点时，新节点一定作为叶子节点插入", "删除二叉排序树中的节点后，该树仍需保持二叉排序树的特性", "在二叉排序树中查找某关键字，若查找失败，查找路径上的最后一个节点即为新节点的父节点", "", ""], "r": "ABCD", "e": "A项，单支树时查找时间复杂度最坏为O(n)；B项，插入新节点时是按规则插入到合适位置，新节点一定作为叶子节点；C项，删除节点后需保持二叉排序树特性；D项，查找失败时，查找路径最后一个节点就是新节点父节点。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899789", "t": 2, "q": "下列关于二叉排序树的叙述中，正确的有哪些？", "a": ["向二叉排序树中插入新节点时，新节点一定作为叶子节点插入", "二叉排序树的右子树中所有节点的关键字均大于根节点的关键字", "二叉排序树的查找效率与树的深度成正比，深度越小，效率越高", "删除二叉排序树中的节点后，剩余节点构成的树仍为二叉排序树", "", ""], "r": "ABCD", "e": "插入新节点时，新节点会根据大小关系插入到合适位置成为叶子节点；右子树节点关键字大于根节点；查找效率与树深度相关，深度小效率高；删除节点后通过合适操作可保证剩余节点仍构成二叉排序树。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899790", "t": 2, "q": "下列关于二叉树遍历的说法中，正确的有？", "a": ["前序遍历的顺序是\"根节点→左子树→右子树\"", "已知二叉树的前序遍历和后序遍历序列，一定能唯一确定一棵二叉树", "后序遍历的顺序是\"左子树→右子树→根节点\"", "中序遍历的顺序是\"左子树→根节点→右子树\"", "", ""], "r": "ACD", "e": "A选项是前序遍历正确顺序；B选项，仅知道前序和后序遍历序列不能唯一确定一棵二叉树；C选项是后序遍历正确顺序；D选项是中序遍历正确顺序。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899791", "t": 2, "q": "下列关于二叉树遍历的叙述中，正确的有哪些？", "a": ["给定二叉树的前序遍历和中序遍历序列，可以唯一确定一棵二叉树", "给定二叉树的前序遍历和后序遍历序列，可以唯一确定一棵二叉树", "给定二叉树的中序遍历和后序遍历序列，可以唯一确定一棵二叉树", "二叉树的后序遍历序列中，最后一个元素是根节点", "", ""], "r": "ACD", "e": "前序遍历是根 - 左 - 右，中序遍历是左 - 根 - 右，后序遍历是左 - 右 - 根。前序和中序、中序和后序能唯一确定二叉树；前序和后序不能唯一确定。后序遍历最后一个是根节点。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899792", "t": 2, "q": "下列关于二叉树的存储结构的说法中，正确的有？", "a": ["二叉链表的存储空间利用率高于顺序存储结构", "二叉树的存储结构选择需根据二叉树的类型和操作需求确定", "二叉树的链式存储结构（二叉链表）中，每个节点包含数据域、左孩子指针域和右孩子指针域", "对于非完全二叉树，顺序存储结构会浪费较多存储空间", "", ""], "r": "BCD", "e": "顺序存储适合完全二叉树，非完全二叉树用顺序存储会浪费空间；二叉链表中每个节点含数据域及左右孩子指针域；存储结构要依据树类型和操作需求选；而二叉链表有指针开销，存储空间利用率不一定高于顺序存储。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899793", "t": 2, "q": "下列关于二叉树的性质中，正确的有？", "a": ["在任意一棵二叉树中，度为0的节点（叶子节点）个数比度为2的节点个数多1。", "二叉树的中序遍历序列和后序遍历序列可以唯一确定一棵二叉树。", "完全二叉树中，若某节点的左子树深度为k，则其右子树深度必为k或k-1。", "深度为h的二叉树，最多有2^h-1个节点（根深度为1）。", "", ""], "r": "ABCD", "e": "逐一分析：A：这是二叉树的基本性质，可由节点数和分支数关系推出，正确。B：中序和后序遍历序列能唯一确定二叉树，正确。C：完全二叉树左子树深度为k，右子树深度只能是k或k - 1，正确。D：深度为h的二叉树，当为满二叉树时节点最多，是2^h - 1个，正确。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899794", "t": 2, "q": "下列关于二叉树的叙述中，正确的有哪些？", "a": ["在二叉树的中序遍历中，根节点的左边是左子树的所有节点，右边是右子树的所有节点", "满二叉树一定是完全二叉树，完全二叉树不一定是满二叉树", "二叉排序树的中序遍历序列一定是递增有序序列", "一棵深度为h的二叉树，其节点总数最多为2^h-1（根节点深度为1）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899795", "t": 2, "q": "下列关于归并排序的叙述中，正确的有哪些？", "a": ["归并排序适合在链表上实现，但需要额外的存储空间", "归并排序是稳定排序算法", "归并排序的基本思想是\"分治法\"，将序列分成两个子序列，分别排序后再合并", "归并排序的时间复杂度为O(n log n)，与序列的初始排列无关", "", ""], "r": "BCD", "e": "归并排序基于分治法，分两子序列排序后合并，是稳定排序，时间复杂度O(n log n)且与初始排列无关，链表实现归并排序无需额外存储空间。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899796", "t": 2, "q": "下列关于哈希表的说法中，正确的有？", "a": ["哈希表是一种通过哈希函数将关键字映射到存储地址的数据结构", "哈希函数的设计会影响哈希冲突的概率", "解决哈希冲突的方法主要有开放定址法和链地址法两大类", "哈希冲突是指不同关键字通过哈希函数计算得到相同的存储地址", "", ""], "r": "ABCD", "e": "哈希表基本原理就是用哈希函数把关键字映射到存储地址；哈希函数设计好坏直接影响冲突概率；解决冲突常见方法就是开放定址法和链地址法；哈希冲突定义就是不同关键字经哈希函数算得相同存储地址。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899797", "t": 2, "q": "下列关于哈希冲突解决方法的说法中，正确的有？", "a": ["线性探测法是开放定址法的一种", "二次探测法也是开放定址法的一种，探测地址为hashAddr±i²（i为探测次数）", "再哈希法是指当发生冲突时，使用另一个哈希函数重新计算哈希地址", "链地址法解决冲突时，哈希表的负载因子α可以大于1", "", ""], "r": "ABCD", "e": "开放定址法包含线性探测、二次探测；二次探测地址公式为 hashAddr±i²；再哈希法冲突时更换哈希函数；链地址法链表存储，负载因子 α 允许大于 1。", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899798", "t": 2, "q": "下列关于哈希冲突解决方法的叙述中，正确的有哪些？", "a": ["链地址法将冲突元素存储在同一个链表中，不会产生\"聚集\"现象，查找效率较高。", "线性探测法解决冲突时，容易产生\"聚集\"现象，即冲突元素集中在某一区域。", "二次探测法可以有效减少线性探测法的\"聚集\"现象，但可能存在某些空闲位置无法探测到的情况。", "再哈希法使用多个哈希函数，当发生冲突时，依次使用不同的哈希函数计算地址，直到找到空闲位置。", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899799", "t": 2, "q": "下列关于哈希函数的叙述中，正确的有哪些？", "a": ["除留余数法中，哈希表的长度m应取质数，以减少冲突", "哈希函数的设计目标是使关键字尽可能均匀地分布在哈希表中，减少冲突", "常见的哈希函数构造方法包括直接定址法、数字分析法、平方取中法、除留余数法等", "哈希函数的计算结果（哈希地址）必须在哈希表的地址范围内", "", ""], "r": "ABCD", "e": "A选项，除留余数法中m取质数可减少冲突；B选项，哈希函数设计就是要让关键字均匀分布减少冲突；C选项，这些都是常见的哈希函数构造方法；D选项，哈希地址必然要在哈希表地址范围内。答案为ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899800", "t": 2, "q": "下列关于快速排序的叙述中，正确的有哪些？", "a": ["选择合适的基准元素（如三者取中）可以有效改善快速排序的最坏情况性能", "快速排序的基本思想是\"分治法\"，将序列划分为两个子序列，再递归排序", "快速排序是稳定排序算法", "快速排序的时间复杂度在最好情况和平均情况下为O(n log n)，最坏情况为O(n²)", "", ""], "r": "ABD", "e": "快速排序基于分治法，选合适基准能改善最坏情况性能，最好和平均时间复杂度是O(n log n)，最坏是O(n²)，但它是不稳定排序。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899801", "t": 2, "q": "下列关于排序算法的时间复杂度和空间复杂度的说法中，正确的有？", "a": ["堆排序的空间复杂度为O(1)（原地排序）", "插入排序的空间复杂度为O(1)", "归并排序的空间复杂度为O(n)（需额外数组存储合并结果）", "冒泡排序的空间复杂度为O(1)（仅用少量辅助变量）", "", ""], "r": "ABCD", "e": "堆排序、插入排序、冒泡排序都只需要少量辅助变量，空间复杂度为O(1)；归并排序需额外数组存储合并结果，空间复杂度为O(n)。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899802", "t": 2, "q": "下列关于排序算法的叙述中，正确的有哪些？", "a": ["插入排序、冒泡排序、归并排序属于稳定排序", "不稳定排序算法一定比稳定排序算法的时间复杂度高", "稳定排序算法是指排序后，关键字相等的元素相对位置保持不变", "所有排序算法的时间复杂度都至少为O(n log n)", "", ""], "r": "AC", "e": "插入、冒泡、归并排序是稳定排序；稳定指关键字相等元素相对位置不变；不稳定排序复杂度不一定比稳定排序高，如快速排序平均复杂度和归并一样；并非所有排序算法复杂度至少O(n log n) ，像冒泡排序是O(n²)。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899803", "t": 2, "q": "下列关于排序算法的应用场景选择的叙述中，正确的有哪些？", "a": ["当待排序序列中关键字重复较多时，快速排序的效率会下降，可采用三路快速排序优化", "当待排序序列规模较大且对稳定性要求较高时，适合选择归并排序", "当待排序序列基本有序时，冒泡排序和直接插入排序的效率较高，接近O(n)", "当待排序序列规模较小且内存空间有限时，适合选择堆排序", "", ""], "r": "ABC", "e": "A选项，快速排序在关键字重复多易退化，三路快速排序可优化；B选项，归并排序稳定且适合大规模排序；C选项，待排序序列基本有序时，冒泡和直接插入排序效率接近O(n)；D选项，堆排序空间复杂度不是最小，小规模且内存有限适合插入或选择排序。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899804", "t": 2, "q": "下列关于排序算法稳定性的说法中，正确的有？", "a": ["稳定排序是指排序后，相同关键字元素的相对位置保持不变", "快速排序是稳定排序", "堆排序是稳定排序", "冒泡排序是稳定排序", "", ""], "r": "AD", "e": "稳定排序定义是排序后相同关键字元素相对位置不变，快速排序和堆排序不稳定，冒泡排序稳定。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899805", "t": 2, "q": "下列关于平衡二叉树的叙述中，正确的有哪些？", "a": ["平衡二叉树是二叉排序树的一种，其左右子树的高度差的绝对值不超过1", "常见的平衡二叉树包括AVL树、红黑树等", "平衡二叉树的插入操作可能导致树失衡，需要通过旋转操作（左旋、右旋）来调整", "平衡二叉树的删除操作不会导致树失衡，无需进行调整", "", ""], "r": "ABC", "e": "平衡二叉树是特殊的二叉排序树，左右子树高度差绝对值不超1，常见的有AVL树、红黑树，插入操作可能使树失衡需旋转调整，删除操作也可能导致失衡也需调整。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899806", "t": 2, "q": "下列关于树的存储结构的叙述中，正确的有哪些？", "a": ["双亲表示法通过数组存储节点，每个节点包含数据和双亲下标，适合查找双亲节点", "孩子兄弟表示法中，每个节点包含数据、第一个孩子指针和右兄弟指针，可将树转换为二叉树", "孩子表示法用链表存储每个节点的孩子，适合查找孩子节点", "对于n个节点的树，双亲表示法的数组长度为n+1，孩子表示法的链表节点数可能超过n", "", ""], "r": "ABC", "e": "A选项，双亲表示法用数组存节点且含数据与双亲下标，便于找双亲；B选项，孩子兄弟表示法含数据、首孩子和右兄弟指针，能将树转二叉树；C选项，孩子表示法用链表存孩子，利于找孩子；D选项，双亲表示法数组长度为n，不是n + 1。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899807", "t": 2, "q": "下列关于数据结构的基本概念中，属于逻辑结构分类的有？", "a": ["图形结构", "树形结构", "线性结构", "顺序结构", "", ""], "r": "ABC", "e": "逻辑结构分为线性结构和非线性结构，树形结构和图形结构属于非线性结构。而顺序结构是存储结构。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899808", "t": 2, "q": "下列关于数据结构基本概念的叙述中，正确的有哪些？", "a": ["数据元素是数据的基本单位，一个数据元素可以由多个数据项组成。", "数据的逻辑结构分为线性结构和非线性结构，栈属于线性结构，图属于非线性结构。", "数据的存储结构不仅指数据在计算机内存中的物理存储方式，还包括外存存储。", "数据结构包括数据的逻辑结构、存储结构和数据的操作集合三部分。", "", ""], "r": "ABD", "e": "A选项，数据元素是数据基本单位，可含多个数据项；B选项，栈是线性结构，图是非线性结构；C选项，存储结构主要指内存物理存储方式；D选项，数据结构涵盖逻辑、存储结构和操作集合。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899809", "t": 2, "q": "下列关于数据结构与算法的关系的说法中，正确的有？", "a": ["算法是解决问题的步骤，数据结构是算法处理的数据的组织形式", "同一问题，选择不同的数据结构，算法的时间复杂度和空间复杂度可能不同", "设计算法时，需考虑数据结构的选择，数据结构会影响算法的效率", "数据结构是算法的基础，算法是数据结构的应用", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899810", "t": 2, "q": "下列关于数据结构中\"度\"的概念的叙述中，正确的有哪些？", "a": ["无向图中，顶点的度是指与该顶点相连的边的条数，图的度是指所有顶点度的总和。", "线性表中，除了首尾节点外，每个节点的度为2。", "有向图中，顶点的度分为入度和出度，入度是指指向该顶点的边的条数，出度是指从该顶点出发的边的条数。", "栈和队列作为线性结构，其内部节点（非首尾）的度为2，因为每个节点都有前驱和后继。", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899811", "t": 2, "q": "下列关于图的遍历算法的说法中，正确的有？", "a": ["广度优先搜索（BFS）遍历图时，按层次访问节点，先访问完当前层再访问下一层。", "深度优先搜索（DFS）遍历图时，优先访问当前节点的邻接节点，直到无法继续深入时才回溯。", "BFS遍历有向图时，得到的遍历序列一定是唯一的。", "DFS和BFS都需要记录节点是否已被访问，避免重复访问。", "", ""], "r": "ABD", "e": "A项，BFS按层次访问节点，先当前层再下一层，说法正确；B项，DFS优先深入邻接节点，无法深入再回溯，说法正确；C项，BFS遍历有向图时，若起始点的邻接节点有多个，不同访问顺序会得到不同序列，并非一定唯一，该项错误；D项，DFS和BFS都要记录节点访问状态防重复，说法正确。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899812", "t": 2, "q": "下列关于图的遍历算法的叙述中，正确的有哪些？", "a": ["对于有向图，深度优先遍历可能会访问到所有顶点，也可能只能访问到部分顶点（取决于图的连通性）", "图的深度优先遍历可以使用栈或递归实现，广度优先遍历可以使用队列实现", "图的遍历算法的时间复杂度不仅取决于顶点数，还与边数有关", "对于无向图，深度优先遍历过程中访问过的边会形成一棵生成树，称为深度优先生成树", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899813", "t": 2, "q": "下列关于图的连通性的叙述中，正确的有哪些？", "a": ["有向图中的极大强连通子图称为强连通分量", "无向图中的极大连通子图称为连通分量，连通图的连通分量就是其自身", "无向图中，若任意两个顶点之间都有路径，则该图为连通图", "无向图的连通分量和有向图的强连通分量都具有唯一性", "", ""], "r": "ABC", "e": "这是一道关于图的连通性的选择题。我们可以根据图论的基本概念来判断每个选项的正确性。A选项：有向图中的极大强连通子图确实被称为强连通分量。这是图论中的标准定义，所以A选项是正确的。B选项：在无向图中，极大连通子图被称为连通分量。对于连通图来说，其本身就是连通的，因此其连通分量就是其自身。所以B选项描述也是准确的。C选项：无向图中，如果任意两个顶点之间都有路径相连，则该图被称为连通图。这是连通图的定义，因此C选项也是正确的。D选项：无向图的连通分量并不具有唯一性，因为同一个图可能通过不同的方式划分出多个连通分量（尽管这些分量的并集会覆盖整个图）。而有向图的强连通分量是唯一的。因此，D选项的描述是错误的。综上所述，正确的选项是A、B和C。所以，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899814", "t": 2, "q": "下列关于图的说法中，正确的有？", "a": ["连通图是指图中任意两个顶点之间都有路径", "无向图的边是没有方向的，有向图的边是有方向的", "图的邻接矩阵存储中，无向图的邻接矩阵是对称的", "有向无环图（DAG）一定存在拓扑排序序列", "", ""], "r": "ABCD", "e": "A选项符合连通图定义；B选项明确无向图和有向图边的特点；C选项无向图邻接矩阵因边无方向所以对称；D选项有向无环图的性质决定一定存在拓扑排序序列。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899815", "t": 2, "q": "下列关于图的叙述中，正确的有哪些？", "a": ["图的深度优先搜索遍历序列是唯一的，与起始顶点无关", "图的邻接表存储中，每个顶点的邻接链表长度等于该顶点的度（无向图）或出度（有向图）", "有向图的边数最多为n(n-1)（n为顶点数），此时为完全有向图", "无向图的边数最多为n(n-1)/2（n为顶点数），此时为完全无向图", "", ""], "r": "BCD", "e": "A选项，图的深度优先搜索遍历序列不唯一，与起始顶点和访问顺序有关；B选项正确，无向图中顶点邻接链表长度是度，有向图是出度；C选项，有向图边数最多n(n - 1)时是完全有向图；D选项，无向图边数最多n(n - 1)/2时是完全无向图。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899816", "t": 2, "q": "下列关于图的应用场景中，正确的有？", "a": ["图可用于表示城市间的交通路线（有向图或无向图）", "图的最小生成树可用于解决通信网络布线问题（最小成本）", "图可用于表示社交网络中的用户关系（无向图）", "图的拓扑排序可用于解决任务调度中的依赖关系问题（如项目进度安排）", "", ""], "r": "ABCD", "e": "A选项，城市间交通有单向或双向，可用有向或无向图；B选项，最小生成树能以最小成本连接各节点，适合通信布线；C选项，社交网络中用户关系多为相互的，可用无向图；D选项，拓扑排序可处理任务依赖关系用于项目安排。ABCD都正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899817", "t": 2, "q": "下列关于图的最短路径算法的说法中，正确的有？", "a": ["迪杰斯特拉（Dijkstra）算法可用于求带权有向图中某一顶点到其他所有顶点的最短路径", "迪杰斯特拉算法不适用于含负权边的图", "弗洛伊德算法的时间复杂度为O(n³)，n为顶点数", "弗洛伊德（Floyd）算法可用于求图中任意两个顶点之间的最短路径", "", ""], "r": "ABCD", "e": "迪杰斯特拉算法用于求带权有向图中某顶点到其他顶点最短路径，但不能处理负权边；弗洛伊德算法能求图中任意两顶点最短路径，时间复杂度是O(n³)。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899818", "t": 2, "q": "下列关于图的最短路径算法的叙述中，正确的有哪些？", "a": ["Dijkstra算法可用于求解有向图或无向图的单源最短路径，前提是边权非负。", "Floyd算法可用于求解任意两个顶点之间的最短路径，允许图中存在负权边，但不能有负权回路。", "Floyd算法的时间复杂度为O(n³)，n为顶点数。", "单源最短路径问题中，若图中存在负权回路，从源点到回路中的顶点不存在最短路径。", "", ""], "r": "ABCD", "e": "A选项，Dijkstra算法确实能处理有向或无向图单源最短路径，边权非负是必要条件；B选项，Floyd可求任意两点最短路径，允许负权边但不能有负权回路；C选项，Floyd时间复杂度就是O(n³)；D选项，存在负权回路时，源点到回路中顶点路径会不断减小，不存在最短路径。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813751533899819", "t": 2, "q": "下列关于图的最小生成树的算法中，正确的有？", "a": ["克鲁斯卡尔算法需要使用并查集（Disjoint Set Union）来判断边是否形成回路", "普里姆（Prim）算法从一个顶点开始，逐步添加边构建最小生成树", "最小生成树的结构（边的组合）不一定唯一，但是全部边权相加的总和是固定唯一的", "克鲁斯卡尔（Kruskal）算法从边开始，按权值从小到大选择边构建最小生成树", "", ""], "r": "ABCD", "e": "A 选项：克鲁斯卡尔算法依次选取权值从小到大的边，利用并查集快速判断边的两个顶点是否属于同一连通分量，以此判断加入这条边会不会产生环，表述正确。<br />B 选项：普里姆算法初始任选一个顶点作为起点，不断选取连接已选顶点集合和未选顶点集合之间权值最小的边，逐步扩充顶点集合来构造最小生成树，表述正确。<br />C 选项：最小生成树的结构（边的组合）不一定唯一，但是全部边权相加的总和是固定唯一的，表述正确。<br />D 选项：克鲁斯卡尔算法属于按边贪心的算法，将全部边按权值升序排序，依次挑选不构成环路的边，最终形成最小生成树，表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408704", "t": 3, "q": "插入排序算法在最坏情况下的时间复杂度为O(n²)，最好情况下的时间复杂度为O(n)，平均情况下的时间复杂度为O(n²)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "插入排序最坏情况是序列逆序，需比较和移动大量元素，时间复杂度O(n²)；最好情况是序列已排好序，只需遍历一次，时间复杂度O(n)；平均情况接近最坏情况，时间复杂度也是O(n²)。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408705", "t": 3, "q": "单链表的存储空间利用率一定低于顺序表，因为单链表的每个节点都需要额外存储指针域。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "通常情况下单链表每个节点有额外指针域，会增加存储开销，存储空间利用率低于顺序表，但在数据频繁插入删除、存储密度小等特殊场景，顺序表需预留空间，可能使单链表利用率不低于顺序表。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408706", "t": 3, "q": "单链表的每个节点都包含数据域和指针域，指针域指向该节点的前驱节点，因此单链表可以双向遍历。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单链表指针域指向的是后继节点，并非前驱节点，所以单链表只能单向遍历，不能双向遍历。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408707", "t": 3, "q": "单链表中，头节点的存在可以使链表的插入和删除操作（包括在头部操作）统一处理，无需特殊判断。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "头节点是单链表的特殊节点，它不存储实际数据，有了头节点，在进行插入和删除操作时，不管是在头部还是其他位置，操作逻辑可以统一，不用对头部操作单独特殊判断。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408708", "t": 3, "q": "单循环链表中，若要遍历整个链表，只需从任意一个节点出发，沿着next指针前进，直到回到起始节点即可。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "单循环链表的特点是尾节点的next指针指向头节点，所以从任意节点出发，沿next指针前进能回到起始节点，可遍历整个链表。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408709", "t": 3, "q": "堆排序是基于堆的特性实现的排序算法，大根堆排序后得到的序列是递增序列。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408710", "t": 3, "q": "堆排序是一种原地排序算法，它不需要额外的存储空间来辅助排序，所有操作都在原序列上进行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "堆排序是原地排序算法，它在排序过程中只需要常数级的额外空间，主要操作都在原数组上进行。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408711", "t": 3, "q": "队列的\"先进先出\"特性是指最先入队的元素一定最先出队，与元素的优先级无关（普通队列）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "普通队列遵循“先进先出”原则，即元素入队顺序决定出队顺序，和元素优先级无关。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408712", "t": 3, "q": "队列的链式存储结构（链队列）中，若不带头结点，则在插入第一个元素和删除最后一个元素时，需要特别处理队头和队尾指针。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "不带头结点的链队列，插入第一个元素时，队头和队尾指针初始为空，插入时要同时更新队头和队尾指针；删除最后一个元素时，删除后队头和队尾指针都要置空，所以都需特别处理。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408713", "t": 3, "q": "对于顺序表，在任意位置插入一个元素，移动元素的个数与插入位置有关，插入位置越靠后，移动元素个数越少。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "顺序表插入元素时，需将插入位置及之后元素后移。插入位置越靠后，后面需移动的元素就越少。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408714", "t": 3, "q": "对于n个元素的排序，任何基于比较的排序算法，其时间复杂度的下限为O(nlogn)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "基于比较的排序算法本质上是在决策树中搜索，决策树的高度决定了比较次数，n 个元素的全排列有 n! 种，决策树至少有 n! 个叶节点，树的高度至少为 log₂(n!)，根据斯特林公式，log₂(n!) 近似为 O(nlogn)，所以基于比较的排序算法时间复杂度下限是 O(nlogn)。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408715", "t": 3, "q": "二叉链表中，通过任意一个节点的指针，都可以遍历该节点所在的整个二叉树。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二叉链表中，一个节点只有指向左右子节点的指针，若从某节点出发，只能访问其左右子树节点，无法回溯到其父节点等其他部分，所以不能遍历该节点所在的整个二叉树。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408716", "t": 3, "q": "二叉排序树（BST）中，若左子树非空，则左子树中所有节点的关键字都小于根节点的关键字;若右子树非空，则右子树中所有节点的关键字都大于根节点的关键字。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是二叉排序树的基本定义特性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408717", "t": 3, "q": "二叉排序树的查找效率取决于树的深度，树的深度越小，查找效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "二叉排序树查找时，需从根节点开始比较，树深度小意味着查找时经过的节点少，查找速度快，效率高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408718", "t": 3, "q": "二叉排序树在插入新节点时，若新节点的关键字小于根节点的关键字，则插入到左子树;若大于根节点的关键字，则插入到右子树，若等于则不插入，以保持树的唯一性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这符合二叉排序树插入新节点的规则。二叉排序树中，左子树节点关键字小于根节点，右子树节点关键字大于根节点，且不允许有重复关键字节点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408719", "t": 3, "q": "二叉树的后序遍历序列中，最后一个元素一定是二叉树的根节点;前序遍历序列中，第一个元素一定是根节点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前序遍历顺序是根节点 - 左子树 - 右子树，所以第一个元素是根节点；后序遍历顺序是左子树 - 右子树 - 根节点，所以最后一个元素是根节点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408720", "t": 3, "q": "二叉树的前序遍历序列和后序遍历序列相同的二叉树，一定是只有一个节点的二叉树。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408721", "t": 3, "q": "二叉树的前序遍历序列和中序遍历序列中，根节点的位置不同，前序遍历中根节点在序列第一个位置，中序遍历中根节点将序列分为左、右子树两部分。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前序遍历顺序是根节点、左子树、右子树，所以根节点在序列首位；中序遍历顺序是左子树、根节点、右子树，根节点会把序列分成左、右子树两部分。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408722", "t": 3, "q": "二分查找（折半查找）适用于所有有序序列，包括有序的单链表。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二分查找需要能随机访问元素，有序单链表只能顺序访问，无法快速定位中间元素，所以二分查找不适用于有序单链表。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408723", "t": 3, "q": "二维数组按行优先顺序存储时，数组元素A[i][j]的存储地址仅与数组的基地址、每个元素的存储单元数、行数i和列数j有关，与数组的总行数无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "按行优先存储时，A[i][j]地址计算与基地址、元素存储单元数、行数i、列数j及总行数（用于确定每行元素个数）都有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408724", "t": 3, "q": "二维数组采用行优先存储时，元素的存储顺序是先存储第一行所有元素，再存储第二行，以此类推。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "行优先存储就是按行的顺序依次存储元素，先存第一行，接着第二行等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408725", "t": 3, "q": "二维数组A[m][n]的元素A[i][j]的存储地址，在列优先存储时，取决于i和j的大小，与m和n无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "列优先存储时，A[i][j]地址计算与i、j、m、n都有关，因为要依据列优先规则通过行列数计算偏移量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408726", "t": 3, "q": "分块查找将线性表分为若干块，块内元素无序，块间元素有序，查找时先确定块的位置，再在块内顺序查找，其平均查找长度介于顺序查找和折半查找之间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该说法正确。分块查找结合了顺序查找和折半查找的特点，块内无序可随意存储元素，块间有序利于确定块位置，先确定块再块内顺序查。顺序查找平均查找长度大，折半查找要求表有序且平均查找长度小，分块查找平均查找长度处于二者之间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408727", "t": 3, "q": "分块查找中，索引表的查找可以采用顺序查找，也可以采用折半查找。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分块查找里，索引表元素有序，顺序查找和折半查找都能用于索引表查找。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408728", "t": 3, "q": "归并排序是稳定排序算法，且其时间复杂度不受数据初始状态影响，始终为O(nlogn)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "归并排序在排序过程中相同元素的相对顺序不会改变，是稳定排序算法。其时间复杂度在任何数据初始状态下都是O(nlogn)。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408729", "t": 3, "q": "哈夫曼树的带权路径长度是指树中所有叶子节点的权值乘以其到根节点的路径长度之和，且哈夫曼树的带权路径长度是所有可能的二叉树中最小的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "哈夫曼树定义就是带权路径长度（WPL）最小的二叉树，WPL计算就是树中所有叶子节点的权值乘以其到根节点的路径长度之和。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408730", "t": 3, "q": "哈希表的负载因子（装填因子）越小，冲突发生的概率越低，查找效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "负载因子是指哈希表中已存储元素数量与哈希表大小的比值，负载因子小意味着表中空间相对元素数量更充裕，元素更分散，冲突概率就低，查找时能更快定位元素，效率也就更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408731", "t": 3, "q": "哈希表中，哈希函数的设计越复杂，哈希冲突的概率就越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "哈希冲突概率主要取决于装填因子等因素，并非哈希函数越复杂冲突概率就越低，复杂函数可能增加计算量且不一定能有效降低冲突。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408732", "t": 3, "q": "哈希查找的平均查找长度与哈希表的装填因子有关，装填因子越大，哈希表越满，冲突概率越高，平均查找长度越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "装填因子反映哈希表的装满程度，越大表示表越满，元素冲突可能性增加，查找时比较次数增多，平均查找长度就会变大。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408733", "t": 3, "q": "哈希查找的时间复杂度在最坏情况下为O(n)，此时所有元素都映射到同一个哈希地址，形成一个链表。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当所有元素都映射到同一哈希地址形成链表时，查找一个元素需要遍历整个链表，最坏要遍历所有 n 个元素，时间复杂度为 O(n)。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408734", "t": 3, "q": "哈希函数的除留余数法中，哈希表的长度m应取偶数，这样可以使关键字在哈希表中分布更均匀，减少冲突。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "除留余数法中，哈希表长度m取素数（质数）时，能让关键字在哈希表中分布更均匀、减少冲突，而非偶数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408735", "t": 3, "q": "哈希函数的设计应保证所有不同的关键字都能映射到不同的哈希地址，即无冲突。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "由于哈希函数是将关键字映射到有限的地址空间，关键字数量往往远多于地址空间大小，很难保证所有不同关键字都映射到不同地址，冲突不可避免。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408736", "t": 3, "q": "快速排序的平均时间复杂度为O(nlogn)，最坏时间复杂度为O(n²)，但实际应用中快速排序通常比归并排序更快。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "快速排序平均复杂度是O(nlogn)，最坏是O(n²) 。归并排序时间复杂度稳定为O(nlogn)，但快速排序在实际应用中，由于其常数因子小、缓存局部性好等优势，通常比归并排序更快。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408737", "t": 3, "q": "快速排序的最坏时间复杂度为O(n²)，通常发生在待排序序列基本有序或逆序的情况下，此时快速排序退化为类似冒泡排序的性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "快速排序在待排序序列基本有序或逆序时，每次划分基准元素的选择不能有效将序列分成两部分，导致时间复杂度变为O(n²)，和冒泡排序类似。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408738", "t": 3, "q": "快速排序是所有排序算法中时间复杂度最低的，在任何情况下时间复杂度都为O(nlogn)。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "快速排序平均时间复杂度是O(nlogn)，但在最坏情况下（如数据基本有序）时间复杂度会变为O(n²)，并非在任何情况下都是O(nlogn)，且还有其他排序算法时间复杂度也能达到O(nlogn)，甚至在特定场景下有更低复杂度的排序算法。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408739", "t": 3, "q": "链栈的栈顶指针指向链表的尾节点，栈底指针指向链表的头节点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "链栈中栈顶指针指向链表的头节点，栈底是链表的尾节点，题中说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408740", "t": 3, "q": "冒泡排序算法中，每一趟排序都会将一个最大的元素\"冒泡\"到未排序部分的末尾，因此排序趟数固定为n-1趟（n为元素个数）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冒泡排序在正常情况下排序趟数是 n - 1 趟，但如果在某趟排序中没有发生元素交换，说明已经排好序，可提前结束排序，所以排序趟数不是固定为 n - 1 趟。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408741", "t": 3, "q": "冒泡排序在最好情况下（数据已有序）的时间复杂度为O(n)，此时不需要进行任何元素交换。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冒泡排序最好情况是数据已有序，只需遍历一次数组比较元素，无需交换元素，时间复杂度是O(n)。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408742", "t": 3, "q": "冒泡排序在最好情况下（序列已有序）的时间复杂度为O(n)，此时只需进行一趟比较，无需交换元素。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冒泡排序最好情况即序列已有序，一趟比较下来没有元素交换，比较次数为 n - 1 次，时间复杂度是 O(n)。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408743", "t": 3, "q": "排序算法的时间复杂度是指算法执行过程中关键字比较次数的数量级，与元素的移动次数无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "排序算法的时间复杂度不仅与关键字比较次数有关，也和元素移动次数有关，它综合考量算法执行中各种操作的时间开销。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408744", "t": 3, "q": "排序算法的稳定性是指排序后，数据元素的关键字从小到大排列，与排序前的相对位置无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "排序算法的稳定性指的是排序前后相同关键字元素的相对位置不变，并非是关键字从小到大排列且与排序前相对位置无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408745", "t": 3, "q": "排序算法中，原地排序是指排序过程中不需要任何额外的存储空间，仅使用输入数据本身的存储空间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408746", "t": 3, "q": "平衡二叉树（AVL树）在插入一个节点后，若平衡因子的绝对值超过1，需通过旋转操作（左旋、右旋、左右旋、右左旋）来恢复平衡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "平衡二叉树的特性是其每个节点的平衡因子绝对值不超过1，插入节点可能打破平衡，此时就需用左旋、右旋、左右旋、右左旋这些旋转操作恢复平衡。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408747", "t": 3, "q": "树的深度是指树中所有节点的深度的最大值，根节点的深度为1，树的高度与树的深度定义相同，数值相等。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408748", "t": 3, "q": "数据的逻辑结构描述了数据元素之间的逻辑关系，它仅取决于数据元素本身，与数据在计算机中的存储方式无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "逻辑结构关注的是数据元素间逻辑联系，只和元素间关系有关，和存储方式无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408749", "t": 3, "q": "数据结构的逻辑结构描述了数据元素在计算机中的存储方式，与数据元素之间的逻辑关系无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据结构的逻辑结构描述的是数据元素之间的逻辑关系，而存储方式是存储结构所描述的内容。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408750", "t": 3, "q": "数据结构仅研究数据元素之间的逻辑关系，不涉及数据的存储方式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据结构不仅研究数据元素间逻辑关系，还研究数据的存储方式（物理结构）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408751", "t": 3, "q": "数据结构是算法的载体，算法是数据结构的灵魂，设计高效的算法必须选择合适的数据结构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据结构为算法提供操作的对象和组织形式，算法则对数据结构进行处理和运算，二者相辅相成，选择合适的数据结构能让算法更高效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408752", "t": 3, "q": "顺序表的存储密度比单链表高，因为顺序表不需要存储指针，所有存储空间都用于存储数据元素。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "顺序表是连续存储，只存数据元素；单链表除存数据元素外还需存指向下一节点的指针，所以顺序表存储密度高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408753", "t": 3, "q": "顺序存储的线性表，其元素的访问时间复杂度为O(1)，因为可以通过下标直接计算地址。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "顺序存储的线性表用一段连续的存储空间按顺序存放元素，可根据首地址和下标通过公式直接计算出元素存储地址，能快速访问元素，时间复杂度是O(1)。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408754", "t": 3, "q": "拓扑排序仅适用于有向无环图（DAG），若有向图中存在环，则无法进行拓扑排序。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "拓扑排序是对有向无环图顶点的一种排序，其目的是让图中任意一条有向边的起点在终点之前，若图中有环，就无法满足此排序要求。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408755", "t": 3, "q": "图的广度优先搜索（BFS）遍历算法中，需要使用栈来存储待访问的节点，按\"先进后出\"的顺序访问。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "图的广度优先搜索（BFS）用队列存储待访问节点，按“先进先出”顺序访问，而不是用栈按“先进后出”顺序。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408756", "t": 3, "q": "图的邻接表存储结构中，对于有向图，每个顶点的邻接链表存储的是从该顶点出发的边所指向的顶点（出边），若要存储入边，需额外建立逆邻接表。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在有向图的邻接表存储结构里，通常邻接链表存的是出边指向的顶点，要获取入边信息就需额外建逆邻接表。", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408757", "t": 3, "q": "图的邻接表存储结构中，每个节点的边链表存储的是该节点的所有邻接节点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在图的邻接表存储结构里，每个顶点对应一个链表，链表中存储的就是该顶点的所有邻接节点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408758", "t": 3, "q": "图的邻接矩阵存储结构中，若图中有n个顶点，则邻接矩阵的大小为n×n，与图中的边数无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "邻接矩阵用二维数组表示图中顶点间的邻接关系，有n个顶点时就需n行n列来存储，大小只取决于顶点数n，和边数没关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408759", "t": 3, "q": "图的深度优先遍历（DFS）和广度优先遍历（BFS）的遍历序列都是唯一的，只要确定了起始顶点，遍历顺序就固定不变。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在图的深度优先遍历和广度优先遍历中，当存在多个邻接顶点时，选择不同的邻接顶点进行访问会得到不同的遍历序列，所以遍历序列不唯一。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408760", "t": 3, "q": "图的深度优先搜索（DFS）遍历过程类似于树的前序遍历。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "图的深度优先搜索是尽可能深地搜索图的分支，先访问起始顶点，再递归访问其未访问邻接点，这和树的前序遍历先访问根节点，再递归访问子节点的顺序类似。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408761", "t": 3, "q": "图的深度优先搜索（DFS）遍历序列是唯一的，与图的存储结构无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "图的深度优先搜索遍历序列不唯一，因为在搜索过程中，当有多个邻接顶点时，选择不同的顶点开始搜索会得到不同的遍历序列，且遍历序列与存储结构有关，不同存储结构可能影响顶点访问顺序。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408762", "t": 3, "q": "图的生成树是指包含图中所有顶点且边数最少的子图，生成树中一定不存在环，且任意两个顶点之间有且仅有一条路径。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据图的生成树定义和性质，它包含图全部顶点且边最少，无环，任意两顶点有唯一路径。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813752926408763", "t": 3, "q": "图的拓扑排序序列是唯一的，对于一个有向无环图（DAG），只能生成一个拓扑排序序列。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "有向无环图（DAG）的拓扑排序序列不一定唯一，只要满足拓扑排序规则，可能存在多种不同的拓扑排序序列。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 数据结构与算法（2）", "n": "基础练习题【含解析】 / 第1章 数据结构与算法（2）", "qs": [{"id": "2034813758425141248", "t": 1, "q": "以下哪种应用场景最适合使用栈这种数据结构实现？", "a": ["数据库系统中的事务日志记录", "操作系统中的进程调度", "网络通信中的数据包缓冲", "表达式中括号的匹配检查", "", ""], "r": "D", "e": "栈的特点是后进先出。表达式中括号匹配检查时，遇到左括号入栈，遇到右括号就从栈顶弹出左括号进行匹配，符合栈后进先出特性。数据库事务日志记录一般用顺序存储；进程调度常用队列；数据包缓冲也多使用队列。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141249", "t": 1, "q": "在单链表中，若要删除p指针所指节点的后继节点，正确的操作是？", "a": ["p->next=p->next->next", "p=p->next;p->next=p->next->next", "p->next=p", "p=p->next->next", "", ""], "r": "A", "e": "要删除p指针所指节点的后继节点，只需让p的next指向后继节点的后继节点。选项A就是将p的next指向其原本后继节点的后继节点，实现了删除后继节点。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141250", "t": 1, "q": "在单循环链表中，若要判断链表是否为空，正确的判断条件是（设头指针为head，节点的next指针指向后继节点）？", "a": ["head->next==NULL", "head->next==head", "head==NULL", "head!=NULL", "", ""], "r": "B", "e": "在单循环链表中，头指针指向头节点，若链表为空，头节点的后继指向自身。所以判断链表为空的条件是 head->next == head 。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141251", "t": 1, "q": "在堆排序中，若要构建一个大根堆，已知当前堆的结构为[4,7,2,9,5,1,6]，则对根节点4进行向下调整后的堆结构是哪一项？", "a": ["[9,7,6,4,5,1,2]", "[9,7,2,4,5,1,6]", "[9,5,6,4,7,1,2]", "[9,7,6,2,5,1,4]", "", ""], "r": "A", "e": "大根堆要求每个节点的值都大于或等于其子节点的值。对根节点4向下调整，4应与较大子节点9交换，此时堆结构变为[9,7,2,4,5,1,6]，接着4继续与较大子节点6交换，最终堆结构为[9,7,6,4,5,1,2]。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141252", "t": 1, "q": "在队列的顺序存储（循环队列）中，若队列最大容量为maxsize，front为队头指针，rear为队尾指针，当队列未满且元素x入队时，rear的更新操作是？", "a": ["rear=rear-1", "rear=(rear+1)%maxsize", "rear=(rear-1)%maxsize", "rear=rear+1", "", ""], "r": "B", "e": "循环队列中，入队时队尾指针要向后移动。为了实现循环，避免越界，需对最大容量取模。所以队尾指针更新为 rear=(rear + 1) % maxsize。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141253", "t": 1, "q": "在二维数组A[3][4]中（数组下标从0开始），若数组元素按行优先顺序存储，每个元素占2个存储单元，且A[0][0]的存储地址为100，则A[2][3]的存储地址为？", "a": ["100+(2*4+2)*2", "100+(2*4+3)*2", "100+(2*3+2)*2", "100+(2*3+3)*2", "", ""], "r": "B", "e": "行优先存储时，A[2][3]前面有2行完整的行，每行4个元素，再加上第3行的3个元素，总共是(2 * 4 + 3)个元素，每个元素占2个存储单元，A[0][0]地址为100，所以A[2][3]地址为100+(2*4+3)*2。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141254", "t": 1, "q": "在哈希表查找中，若采用线性探测法解决冲突，当哈希表负载因子（装填因子）增大时，以下哪种情况会发生？", "a": ["哈希表的存储空间增大", "查找成功的平均查找长度增加", "查找失败的平均查找长度减少", "哈希函数的计算时间增加", "", ""], "r": "B", "e": "负载因子增大意味着表中元素增多，冲突可能性增加，线性探测法下查找成功的平均查找长度会随之增加。A选项，存储空间未因负载因子增大而改变；C选项，查找失败平均查找长度会增加而非减少；D选项，哈希函数计算时间与负载因子无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141255", "t": 1, "q": "在哈希表的构建中，若采用线性探测法解决冲突，当发生冲突时，下列处理方式正确的是哪一项？", "a": ["将冲突元素链接到冲突位置的链表中", "在哈希函数中引入随机数，重新计算哈希地址", "根据二次函数计算下一个探测地址，如H(i)=(H0+i²)%m", "在冲突位置的下一个位置依次探测，直到找到空闲位置", "", ""], "r": "D", "e": "线性探测法是在发生冲突时，从冲突位置的下一个位置依次探测，直到找到空闲位置。A选项是链地址法处理冲突的方式；B选项不是线性探测法的做法；C选项是二次探测法。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141256", "t": 1, "q": "在哈希表中，负载因子α的定义为哈希表中元素个数与哈希表容量的比值，下列关于α的说法中，正确的是？", "a": ["α越小，哈希冲突的概率越高", "α越大，哈希表的存储空间利用率越低", "α的取值通常在0.6~0.8之间，以平衡冲突概率和空间利用率", "α必须为整数", "", ""], "r": "C", "e": "负载因子α越小，冲突概率越低，A错；α越大，空间利用率越高，B错；α是比值，不一定是整数，D错；α通常在0.6 - 0.8之间可平衡冲突概率和空间利用率。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141257", "t": 1, "q": "在哈希表中，若采用链地址法（拉链法）解决冲突，哈希表的负载因子增大时，查找成功的平均查找长度会？", "a": ["减少", "不变", "增大", "先增大后减少", "", ""], "r": "C", "e": "负载因子增大意味着哈希表中元素增多，每个链表上的元素也会增多，查找成功时平均查找长度会随之增大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141258", "t": 1, "q": "在哈希表中，若采用线性探测法解决哈希冲突，当插入一个新元素时，若哈希地址已被占用，则依次探测的下一个地址为？", "a": ["(hashAddr+1)%tableSize", "hashAddr-1", "hashAddr+1", "(hashAddr-1)%tableSize", "", ""], "r": "A", "e": "线性探测法解决哈希冲突时，若哈希地址已被占用，会按顺序往后找，因要考虑数组边界，所以下一个地址是 (hashAddr + 1) % tableSize 。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141259", "t": 1, "q": "在哈希查找中，若哈希函数为H(key)=key%11，哈希表长度为11，采用链地址法解决冲突。若插入的关键字序列为[18,29,36,47,58,69]，则哈希地址为7的链表中包含的关键字个数是多少？", "a": ["4", "1", "2", "3", "", ""], "r": "C", "e": "根据哈希函数H(key)=key%11，分别计算各关键字的哈希地址，18%11 = 7，29%11 = 7，69%11 = 3，36%11 = 3，47%11 = 3，58%11 = 3，可知哈希地址为7的关键字有18、29。答案选C。 <br />从上述计算可以看出，只有关键字18和29的哈希地址是7，因此哈希地址为7的链表中包含的关键字个数是2。选项A、B、D均不正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141260", "t": 1, "q": "在排序算法中，若待排序数据已基本有序，下列算法中排序效率最高的是？", "a": ["堆排序", "冒泡排序", "快速排序", "归并排序", "", ""], "r": "B", "e": "冒泡排序在待排序数据基本有序时，只需少量交换就能完成排序，效率较高。堆排序、快速排序和归并排序不受数据初始顺序影响大，在基本有序时优势不明显。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141261", "t": 1, "q": "在排序算法中，下列属于稳定排序的是？", "a": ["堆排序", "归并排序", "简单选择排序", "快速排序", "", ""], "r": "B", "e": "稳定排序是指排序前后相同元素的相对顺序不变。归并排序是稳定排序，而堆排序、简单选择排序、快速排序都是不稳定排序。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141262", "t": 1, "q": "在求解单源最短路径问题中，Dijkstra算法不适用于下列哪种情况？", "a": ["图为无向图", "图中存在负权回路", "图为有向图", "图中存在负权边", "", ""], "r": "B", "e": "Dijkstra算法基于贪心策略，假设每个节点的最短路径是单调递增的。当图中存在负权回路或负权边时，会破坏这一假设，导致算法无法得到正确的最短路径。不过对于存在负权回路的情况，问题本身就没有意义，因为可以在负权回路中不断绕圈使路径长度无限小。所以Dijkstra算法不适用于图中存在负权回路的情况。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141263", "t": 1, "q": "在数据结构中，评价一个算法的优劣不包括以下哪个因素？", "a": ["算法的空间复杂度", "算法所处理数据的初始大小", "算法的时间复杂度", "算法的可读性与可维护性", "", ""], "r": "B", "e": "评价算法优劣通常考虑时间复杂度、空间复杂度以及算法的可读性与可维护性。而算法所处理数据的初始大小是数据本身属性，并非评价算法优劣的因素。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141264", "t": 1, "q": "在数据结构中，若一个数据结构的逻辑结构与数据元素在计算机中的存储位置无关，仅描述数据元素之间的逻辑关系，该结构被称为？", "a": ["物理结构", "线性结构", "逻辑结构", "存储结构", "", ""], "r": "C", "e": "逻辑结构只描述数据元素间逻辑关系，与存储位置无关。物理结构（存储结构）和存储位置相关，线性结构是逻辑结构的一种。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141265", "t": 1, "q": "在图的广度优先搜索（BFS）中，若使用队列存储待访问节点，对于一个有n个节点、m条边的无向图，其时间复杂度主要取决于下列哪一项？", "a": ["n+m", "节点数n", "边数m", "n*m", "", ""], "r": "A", "e": "广度优先搜索遍历图时，每个节点和每条边都至少会被访问一次，所以时间复杂度是节点数与边数之和。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141266", "t": 1, "q": "在图的深度优先搜索（DFS）中，使用栈的主要目的是？", "a": ["回溯到未访问的邻接顶点", "计算图的边数", "记录当前顶点的访问顺序", "存储图中所有顶点", "", ""], "r": "A", "e": "深度优先搜索中，栈用于保存路径以便在遇到死路时回溯到未访问的邻接顶点继续搜索。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141267", "t": 1, "q": "在图的深度优先搜索（DFS）中，使用栈来存储待访问节点，其遍历顺序的本质是遵循下列哪种原则？", "a": ["先进先出", "按节点度数从大到小访问", "先进后出", "随机访问", "", ""], "r": "C", "e": "栈的特性是先进后出，在图的深度优先搜索中用栈存储待访问节点，其遍历顺序就遵循栈的这一特性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141268", "t": 1, "q": "在无向图G中，若从顶点v到顶点u有路径，且图中所有顶点之间都存在路径，则G被称为？", "a": ["连通图", "完全图", "强连通图", "有向图", "", ""], "r": "A", "e": "连通图是无向图中任意两顶点都有路径；完全图是每对顶点间都有边；强连通图用于有向图；本题是无向图且顶点间都有路径，符合连通图定义。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141269", "t": 1, "q": "在稀疏矩阵的压缩存储中，三元组表法存储的基本元素不包括下列哪一项？", "a": ["矩阵中非零元素的值", "矩阵中非零元素的行号", "矩阵的总行数和总列数", "矩阵中非零元素的列号", "", ""], "r": "C", "e": "三元组表法存储稀疏矩阵时，基本元素是矩阵中非零元素的行号、列号和值，不包含矩阵的总行数和总列数。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141270", "t": 1, "q": "在下列查找算法中，平均查找长度与查找表中元素的初始排列顺序无关的是哪一项？", "a": ["二叉排序树查找", "哈希查找（无冲突情况）", "顺序查找", "折半查找", "", ""], "r": "B", "e": "二叉排序树查找平均查找长度受元素初始排列影响；顺序查找平均查找长度与元素初始排列有关；折半查找要求元素有序，初始排列顺序会影响查找效率；哈希查找（无冲突情况）通过哈希函数直接定位元素，平均查找长度与元素初始排列顺序无关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141271", "t": 1, "q": "在下列关于数据结构的叙述中，正确的是哪一项？", "a": ["数据的逻辑结构独立于其存储结构，存储结构的变化不会影响逻辑结构", "线性结构的逻辑特征是\"一对一\"，非线性结构的逻辑特征是\"一对多\"", "数据的存储结构独立于其逻辑结构，逻辑结构的变化会直接改变存储结构", "数据的操作集合不仅由存储结构决定，也与逻辑结构密切相关", "", ""], "r": "A", "e": "数据逻辑结构是数据元素间的逻辑关系，存储结构是逻辑结构在计算机中的存储表示，逻辑结构独立于存储结构，存储结构变化不影响逻辑结构。B 非线性结构特征不只是“一对多”；C 存储结构依赖逻辑结构，逻辑变存储不一定直接改变；D 数据操作集合主要由逻辑结构决定。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141272", "t": 1, "q": "在下列关于线性表的叙述中，错误的是哪一项？", "a": ["单链表的优点是插入删除操作无需移动元素，缺点是无法随机访问", "循环链表的尾节点指针指向头节点，遍历到尾节点后可直接回到头节点，但无法判断链表是否为空", "顺序表的优点是随机访问速度快，缺点是插入删除操作效率低", "双向链表的每个节点包含两个指针，分别指向前驱和后继，可双向遍历，但存储密度比单链表低", "", ""], "r": "B", "e": "循环链表可通过判断头节点指针是否等于自身来判断链表是否为空，B选项说法错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141273", "t": 1, "q": "在下列排序算法中，不需要进行关键字比较操作的是哪一项？", "a": ["归并排序", "基数排序", "快速排序", "堆排序", "", ""], "r": "B", "e": "归并、快速、堆排序都是基于比较的排序算法，而基数排序是通过分配和收集操作进行排序，无需关键字比较。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141274", "t": 1, "q": "在下列排序算法中，属于稳定排序且时间复杂度为O(n log n)的是哪一项？", "a": ["归并排序", "堆排序", "希尔排序", "快速排序", "", ""], "r": "A", "e": "归并排序是稳定排序，时间复杂度为O(n log n)；堆排序不稳定；希尔排序不稳定；快速排序不稳定。所以答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141275", "t": 1, "q": "在一个链栈中，栈顶指针为top，若要判断栈是否为空，以下条件正确的是？", "a": ["top->next==NULL", "top==NULL", "top->data==0", "top!=NULL", "", ""], "r": "B", "e": "链栈为空即栈中无节点，此时栈顶指针为空。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141276", "t": 1, "q": "在一个无向图中，若从节点A到节点B存在两条不同的简单路径（路径中无重复节点），则该图中一定存在？", "a": ["环", "汇点", "孤立节点", "重边", "", ""], "r": "A", "e": "从节点A到B有两条不同简单路径，这两条路径会形成一个封闭的回路，所以图中一定存在环。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141277", "t": 1, "q": "在一个循环链表中，若只给出尾节点的指针rear，要访问头节点，以下操作正确的是？", "a": ["rear->next->next", "rear->prior->prior", "rear->prior", "rear->next", "", ""], "r": "D", "e": "在循环链表中，尾节点的下一个节点就是头节点。已知尾节点指针为rear，那么访问头节点的操作就是rear->next 。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141278", "t": 1, "q": "在一个有向图中，若存在一个节点v，从v出发可以到达图中所有其他节点，则v被称为？", "a": ["汇点", "关键点", "根节点", "源点", "", ""], "r": "D", "e": "源点是有向图中能到达图里所有其他节点的节点。汇点是入度不为0、出度为0的节点；关键点一般指在算法或问题里起关键作用的点；根节点多用于树结构。答案是D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141279", "t": 1, "q": "在一棵二叉排序树中，若删除一个有两个子节点的节点p，通常的替代节点是？", "a": ["p的父节点", "p的左子树中最小的节点", "p的右子树中最小的节点", "p的右子树中最大的节点", "", ""], "r": "C", "e": "在二叉排序树中删除有两个子节点的节点p时，通常用p的右子树中最小的节点来替代p，这样能保证二叉排序树的性质不变。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141280", "t": 1, "q": "在一棵二叉树中，若度为2的节点数为n2，度为1的节点数为n1，度为0的节点数为n0，则下列关系式一定成立的是哪一项？", "a": ["n0 = n2 + 1", "n0 = 2n2 + 1", "n1 = n2 + n0", "n1 = 2n0 - 1", "", ""], "r": "A", "e": "对于二叉树，节点总数N = n0 + n1 + n2，且边数E = N - 1，又因为边数E = 2n2 + n1，所以n0 + n1 + n2 - 1 = 2n2 + n1，化简可得n0 = n2 + 1。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141281", "t": 1, "q": "在一棵含有n个节点的二叉链表中，空指针域的个数为？", "a": ["n+1", "n", "2n", "n-1", "", ""], "r": "A", "e": "每个节点有 2 个指针域，n 个节点共 2n 个指针域，除根节点外每个节点都有一个指针指向它，即有 n - 1 个非空指针域，所以空指针域个数为 2n - (n - 1) = n + 1。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141282", "t": 1, "q": "在一棵平衡二叉树中，每个节点的平衡因子（左子树深度减右子树深度）的绝对值不超过？", "a": ["1", "0", "3", "2", "", ""], "r": "A", "e": "答案：A平衡二叉树是一种特殊的二叉树，它的特点是任何节点的两个子树的高度差都不超过1。平衡因子是某个节点的左子树高度减去右子树高度，其绝对值不超过1，所以选A。", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141283", "t": 1, "q": "在一棵深度为5的满二叉树中，叶子节点的个数为？", "a": ["8", "32", "16", "15", "", ""], "r": "C", "e": "满二叉树中叶子节点都在最后一层，深度为n的满二叉树最后一层叶子节点数是「test/yiwen_img/importSubject/2034813753509416960.png」，本题深度n = 5，则叶子节点数为「test/yiwen_img/importSubject/2034813753656217600.png」。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141284", "t": 1, "q": "在一棵深度为h（根节点深度为1）的完全二叉树中，第h层上的节点数最多为？", "a": ["2^h-1", "h", "2^(h+1)-1", "2^(h-1)", "", ""], "r": "D", "e": "完全二叉树第h层节点数最多时，该层是满的。根据二叉树性质，第i层最多有2^(i - 1)个节点，所以第h层最多有2^(h - 1)个节点。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141285", "t": 1, "q": "在一棵深度为h（根节点深度为1）的完全二叉树中，第k层（1≤k≤h）的节点数最多为多少？", "a": ["2^(h-k)", "2^(k-1)", "h-k+1", "2^k-1", "", ""], "r": "B", "e": "完全二叉树中，每一层的节点数最多情况和满二叉树相同，满二叉树第k层节点数是2^(k - 1)。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141286", "t": 1, "q": "在一棵深度为h（根节点深度为1）的完全二叉树中，所含节点的个数最少为？", "a": ["2^(h-1)", "2^h-1", "2^h", "2^(h-1)+1", "", ""], "r": "A", "e": "完全二叉树深度为h时，节点最少情况是第h层只有1个节点。前h - 1层是满二叉树，节点数为2^(h - 1) - 1，再加上第h层1个节点，总数为2^(h - 1)。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141287", "t": 1, "q": "在一棵有n个节点的二叉排序树中，查找一个关键字等于x的节点，其平均查找长度与下列哪项因素关系最密切？", "a": ["二叉排序树是否为完全二叉树", "二叉排序树中关键字的排列顺序", "二叉排序树的节点总数n", "二叉排序树的深度", "", ""], "r": "D", "e": "平均查找长度主要取决于二叉排序树的形状，而树的形状受深度影响大，深度越大平均查找长度可能越大。答案为D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141288", "t": 1, "q": "在栈的链式存储结构（链栈）中，若栈不为空，栈顶指针top指向栈顶节点，则弹出栈顶元素的操作是？", "a": ["top->next=top", "删除top节点，top指向其前驱节点", "删除top节点，top指向NULL", "top=top->next", "", ""], "r": "D", "e": "链栈中弹出栈顶元素，就是让栈顶指针指向原栈顶节点的下一个节点。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813758425141289", "t": 1, "q": "在折半查找（二分查找）中，若查找表的长度为n，且n满足2<sup>k-1<n≤2<\/sup>(k+1)-1（k为正整数），则查找成功的最坏比较次数为？", "a": ["k", "log2n", "n", "k+1", "", ""], "r": "D", "e": "折半查找成功的最坏比较次数与判定树的高度有关。对于长度为n且满足2k - 1 < n ≤ 2(k + 1) - 1的查找表，其折半查找判定树的高度为k + 1，所以查找成功的最坏比较次数是k + 1。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107200", "t": 2, "q": "下列关于完全二叉树的性质中，正确的有？", "a": ["完全二叉树中，叶子节点只可能在最后两层出现", "完全二叉树一定是满二叉树", "完全二叉树中，若某节点有左子树，则其左子树的深度一定大于或等于右子树的深度", "在完全二叉树中，若父节点的索引为i（从0开始），则左子节点索引为2i+1，右子节点索引为2i+2", "", ""], "r": "AD", "e": "完全二叉树叶子节点只在最后两层，A正确；完全二叉树不一定是满二叉树，B错误；完全二叉树左右子树深度关系不确定，C错误；完全二叉树若父节点索引为i（从0开始），左子节点索引为2i + 1，右子节点索引为2i + 2，D正确。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107201", "t": 2, "q": "下列关于线性表的操作中，时间复杂度为O(n)的有哪些（假设顺序表和单链表的长度均为n）？", "a": ["顺序表的求长度操作", "顺序表的查找操作（查找指定值的元素）", "单链表的遍历操作", "单链表的删除操作（删除指定值的节点）", "", ""], "r": "BCD", "e": "顺序表求长度直接获取存储的长度值，时间复杂度O(1)；顺序表查找需遍历元素，时间复杂度O(n)；单链表遍历要逐个访问节点，时间复杂度O(n)；单链表删除指定值节点也需遍历查找，时间复杂度O(n)。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107202", "t": 2, "q": "下列关于线性表的两种存储结构（顺序存储和链式存储）的比较中，正确的有？", "a": ["顺序存储的插入、删除操作时间复杂度通常为O(n)，链式存储通常为O(1)（已知位置时）", "顺序存储对存储空间要求连续，链式存储无此要求", "顺序存储和链式存储都可以实现栈和队列", "顺序存储的存储密度高于链式存储（存储密度=数据元素占用空间/总存储空间）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107203", "t": 2, "q": "下列关于线性表的压缩存储的叙述中，正确的有哪些？", "a": ["线性表的压缩存储仅适用于稀疏矩阵，不适用于普通线性表", "压缩存储的目的是减少存储空间的占用，可能会增加访问操作的时间复杂度", "对于元素值重复较多的线性表（如有序表），可以采用游程编码进行压缩存储，记录重复元素的个数和值", "字符串的压缩存储可以采用哈夫曼编码，通过较短的编码表示出现频率高的字符", "", ""], "r": "BCD", "e": "A选项，压缩存储不只是适用于稀疏矩阵，普通线性表若有可压缩特性也适用，A错误；B选项，压缩存储减少空间占用，因存储结构变化可能增加访问复杂度，B正确；C选项，游程编码可用于元素值重复多的线性表，记录重复元素个数和值，C正确；D选项，哈夫曼编码可用于字符串压缩，用短编码表示高频字符，D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107204", "t": 2, "q": "下列关于线性表的应用场景中，正确的有？", "a": ["字符串是特殊的线性表，可用于文本处理", "链式表适用于频繁插入删除、较少访问元素的场景", "队列是特殊的线性表，可用于任务调度", "栈是特殊的线性表，可用于表达式求值", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107205", "t": 2, "q": "下列关于循环链表的说法中，正确的有？", "a": ["循环链表可以从任意一个节点出发，遍历整个链表", "判断单循环链表是否为空，若带头节点，通常用头节点的next指针是否指向自身来判断", "循环链表的插入和删除操作与单链表完全相同，无需特殊处理", "双循环链表的最后一个节点的next指针指向头节点，头节点的prior指针指向最后一个节点", "", ""], "r": "ABD", "e": "A选项，循环链表首尾相连，可从任意节点遍历全链表；B选项，带头节点的单循环链表，头节点next指向自身时为空；D选项，双循环链表结构就是尾节点next指头节点，头节点prior指尾节点。而C选项，循环链表插入删除在涉及首尾节点时需特殊处理。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107206", "t": 2, "q": "下列关于循环链表的叙述中，正确的有哪些？", "a": ["单循环链表的尾节点指针指向头节点，从任意节点出发都能遍历整个链表", "判断单循环链表是否为空的条件是头节点的next指针等于头节点自身", "循环链表的插入和删除操作与单链表完全相同，无需调整循环指针", "循环链表解决了单链表无法从尾节点访问头节点的问题", "", ""], "r": "ABD", "e": "单循环链表尾结点指向头结点，任意结点可遍历全表；空表判定头结点 next 指向自身；循环链表增删时需要维护循环指针，和普通单链表操作不一样；单链表不能从尾部回头，循环链表可以。", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107207", "t": 2, "q": "下列关于栈的链式存储结构（链栈）的说法中，正确的有？", "a": ["链栈的插入（push）操作只需在栈顶添加新节点，修改栈顶指针", "链栈为空时，栈顶指针为NULL", "链栈通常不需要头节点，栈顶指针直接指向栈顶节点", "链栈的存储空间可以动态扩展，无需预先分配固定大小", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107208", "t": 2, "q": "下列关于栈的应用场景中，正确的有？", "a": ["表达式求值（如后缀表达式计算）", "函数调用过程中的参数和返回地址存储", "二叉树的层次遍历", "图的深度优先搜索", "", ""], "r": "ABD", "e": "栈具有后进先出特性。A选项，后缀表达式计算需借助栈完成操作数和运算符处理；B选项，函数调用时用栈存储参数和返回地址；D选项，图的深度优先搜索可利用栈来实现节点的回溯。而C选项二叉树层次遍历使用队列，不是栈。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107209", "t": 2, "q": "下列关于栈的应用场景中，正确的有哪些？", "a": ["队列的顺序存储结构实现", "递归算法的实现（递归工作栈）", "二叉树的深度优先遍历", "浏览器的前进和后退功能", "", ""], "r": "BCD", "e": "栈是后进先出的数据结构。递归算法用递归工作栈保存信息；二叉树深度优先遍历借助栈实现；浏览器前进后退功能利用栈存储历史记录。而队列顺序存储结构用数组或链表实现，与栈无关。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107210", "t": 2, "q": "下列关于栈和队列的区别的说法中，正确的有？", "a": ["栈和队列都可以用顺序存储和链式存储结构实现", "栈可以用来实现递归，队列不能", "栈遵循\"先进后出\"原则，队列遵循\"先进先出\"原则", "队列可以用来实现二叉树的层次遍历，栈不能", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107211", "t": 2, "q": "下列关于字符串的说法中，正确的有？", "a": ["两个字符串比较大小时，是从第一个字符开始逐字符比较ASCII码值", "字符串是一种特殊的线性表，其数据元素为字符", "字符串的长度是指字符串中包含的字符个数（不包括结束符）", "空字符串的长度为0", "", ""], "r": "ABCD", "e": "A选项，字符串比较就是从首字符开始逐字符比ASCII码值；B选项，字符串可看作数据元素为字符的特殊线性表；C选项，字符串长度是所含字符数不包含结束符；D选项，空字符串无字符，长度为0。这些说法都正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107212", "t": 2, "q": "下列关于字符串的叙述中，正确的有哪些？", "a": ["字符串是由字符组成的线性表，其长度是指字符串中字符的个数", "字符串的比较是按字符的ASCII码值依次进行，直到找到不同字符或比较完所有字符", "KMP算法的核心是通过计算next数组，避免模式匹配过程中的回溯，提高效率", "字符串的子串是指从字符串中任意截取的连续字符序列，但并非任意两个子串的长度都不相同", "", ""], "r": "ABCD", "e": "字符串属于字符型线性表，长度为字符个数；字符串比较逐字符对比 ASCII 码；KMP 依靠 next 数组消除主串指针回溯；子串是连续字符片段，允许存在长度相同的不同子串。", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107213", "t": 2, "q": "下列关于字符串匹配的算法中，正确的有？", "a": ["KMP算法的next数组存储的是模式串中每个位置的最长相等前后缀长度", "暴力匹配算法（BF算法）的时间复杂度为O(mn)，m为模式串长度，n为主串长度", "BF算法在最坏情况下的时间复杂度高于KMP算法", "字符串匹配的最终目的是判断模式串是否为主串的子串", "", ""], "r": "ABCD", "e": "A选项，KMP的next数组存的就是模式串各位置最长相等前后缀长度；B选项，BF算法逐个比较，时间复杂度是O(mn)；C选项，BF最坏要比较mn次，KMP是O(m + n)，BF更高；D选项，字符串匹配就是判断模式串是否是主串子串。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107214", "t": 2, "q": "下列关于字符串匹配算法的叙述中，正确的有哪些？", "a": ["KMP算法通过预处理模式串得到next数组，使匹配过程中主串指针不回溯，时间复杂度为O(m+n)", "改进的KMP算法（nextval数组）可以进一步优化匹配过程，解决某些情况下next数组的冗余比较", "朴素字符串匹配算法的时间复杂度为O(mn)，m为模式串长度，n为主串长度", "next数组的每个元素表示模式串中当前位置之前的子串的最长相等前后缀长度", "", ""], "r": "ABCD", "e": "A选项，KMP算法预处理模式串得next数组，主串指针不回溯，时间复杂度O(m + n)；B选项，改进的KMP用nextval数组可优化，解决next数组冗余比较；C选项，朴素匹配算法时间复杂度是O(mn)；D选项，next数组元素表示模式串当前位置前子串最长相等前后缀长度。四个选项描述都对。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107215", "t": 2, "q": "线性表的顺序存储结构相比链式存储结构，具有的优点有？", "a": ["存储密度（数据元素占比）更高", "不需要额外存储指针信息", "插入、删除操作的时间复杂度更低", "可以随机访问任意元素", "", ""], "r": "ABD", "e": "顺序存储将数据元素连续存储，无需额外指针，存储密度高，能随机访问。链式存储插入删除更方便，顺序存储插入删除需移动元素，复杂度高。所以ABD是顺序存储优点。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107216", "t": 2, "q": "以下关于查找算法的说法中，正确的有？", "a": ["分块查找结合了顺序查找和折半查找的优点", "哈希查找的平均查找时间与哈希函数的选择无关", "二叉排序树的查找效率在最坏情况下为O(n)", "顺序查找适用于任何线性表", "", ""], "r": "ACD", "e": "分块查找先对块用折半或其他高效查找确定块，再在块内顺序查找，结合了二者优点；哈希查找平均查找时间和哈希函数选择有关；二叉排序树最坏成单支树，查找效率O(n)；顺序查找对线性表无要求，适用于任何线性表。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107217", "t": 2, "q": "以下关于队列的存储结构的说法中，正确的有？", "a": ["循环队列的存储空间是连续的", "顺序队列（非循环）的存储空间是连续的", "顺序队列存在\"假溢出\"，而循环队列不存在", "链队列的存储空间是不连续的", "", ""], "r": "ABCD", "e": "顺序存储的队列（包括循环和非循环）存储空间都连续，顺序队列会因队头元素出队后空间未有效利用产生“假溢出”，循环队列通过取模解决此问题，链队列由链表实现，存储空间不连续。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107218", "t": 2, "q": "以下关于队列的说法中，正确的有？", "a": ["循环队列可以解决\"假溢出\"问题", "阻塞队列是一种同步队列，常用于多线程通信", "链队列的存储空间可以动态扩展", "优先级队列的出队顺序取决于元素的优先级", "", ""], "r": "ABCD", "e": "循环队列通过首尾相连利用空间，解决假溢出；阻塞队列在多线程中可实现同步通信；链队列基于链表，存储空间能动态扩展；优先级队列按元素优先级出队。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107219", "t": 2, "q": "以下关于二叉排序树的说法中，正确的有？", "a": ["二叉排序树的查找效率与树的深度相关", "二叉排序树的右子树中所有节点的值均大于根节点的值", "对二叉排序树进行中序遍历，得到的序列是有序序列", "在二叉排序树中插入新节点时，新节点一定作为叶子节点插入", "", ""], "r": "ABCD", "e": "A 树越深查找时比较次数可能越多，效率与深度相关；B 这是二叉排序树性质；C 中序遍历二叉排序树结果是有序的；D 插入新节点时是按规则插入，最终会作为叶子节点。ABCD 都正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107220", "t": 2, "q": "以下关于二叉树的性质的说法中，正确的有？", "a": ["在一棵二叉树中，第i层（i≥1）最多有2^(i-1)个节点", "完全二叉树中，若某节点的左子树深度为k，则其右子树深度至少为k-1", "一棵有n个节点的完全二叉树，其深度为⌊log2n⌋+1", "在任意一棵二叉树中，度为0的节点数等于度为2的节点数加1", "", ""], "r": "ABCD", "e": "A 是二叉树每层最大结点数性质；B 完全二叉树左右子树高度差不大于 1；C 完全二叉树深度公式；D 二叉树结点数量关系：n₀=n₂+1。", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107221", "t": 2, "q": "以下关于分块查找的说法中，正确的有？", "a": ["分块查找的时间复杂度介于顺序查找和折半查找之间", "分块查找要求块内元素有序", "分块查找需要建立索引表", "分块查找的索引表中存储每个块的最大值和块的起始地址", "", ""], "r": "ACD", "e": "分块查找需建立索引表，索引表存每个块的最大值和起始地址，其时间复杂度在顺序查找和折半查找之间，不要求块内元素有序。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107222", "t": 2, "q": "以下关于哈希函数的说法中，正确的有？", "a": ["哈希函数的设计应考虑关键字的分布特性", "好的哈希函数可以完全避免冲突", "常见的哈希函数构造方法包括直接定址法、除留余数法等", "哈希函数的输入是关键字，输出是一个固定范围内的整数值作为哈希地址", "", ""], "r": "ACD", "e": "A选项，设计哈希函数需考虑关键字分布，让哈希地址均匀，正确；B选项，好的哈希函数只能减少冲突，不能完全避免，错误；C选项，直接定址法、除留余数法是常见哈希函数构造方法，正确；D选项，哈希函数就是将关键字映射为固定范围整数值作为哈希地址，正确。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107223", "t": 2, "q": "以下关于链式存储结构的说法中，正确的有？", "a": ["链式存储的查找操作时间复杂度通常为O(n)", "链式存储的元素不需要连续的存储空间", "链式存储的存储密度比顺序存储低", "链式存储的插入、删除操作不需要移动元素", "", ""], "r": "ABCD", "e": "链式存储查找需遍历，时间复杂度O(n)；元素分散存储，无需连续空间；因有指针域，存储密度低于顺序存储；插入删除只需改指针，无需移动元素。ABCD都对。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107224", "t": 2, "q": "以下关于平衡二叉树的说法中，正确的有？", "a": ["平衡二叉树的左右子树深度差的绝对值不超过1", "平衡二叉树的查找时间复杂度为O(logn)", "平衡二叉树的旋转调整包括左旋和右旋两种基本操作", "平衡二叉树一定是二叉排序树", "", ""], "r": "ABCD", "e": "平衡二叉树定义为左右子树高度差绝对值≤1，是二叉排序树；查找复杂度 O (logn)；基本旋转操作包含左旋、右旋。", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107225", "t": 2, "q": "以下关于树的说法中，正确的有？", "a": ["树的深度是从根节点到最远叶子节点的路径上的节点数", "树的高度与深度的定义相同（根节点高度为1）", "一棵有n个节点的树，其边数一定为n-1", "森林是由多棵互不相交的树组成的集合", "", ""], "r": "ACD", "e": "A树深度定义正确；B树高度从叶子起算，深度从根起算，定义不同；C树的性质是n个节点的树边数为n - 1；D森林就是多棵互不相交树的集合。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107226", "t": 2, "q": "以下关于数组的说法中，正确的有？", "a": ["数组的存储地址是连续的（顺序存储时）", "数组的元素访问时间复杂度为O(1)（顺序存储时）", "二维数组可以看作是数组的数组", "稀疏数组的压缩存储可以节省存储空间", "", ""], "r": "ABCD", "e": "顺序存储时数组地址连续，能在O(1)时间访问元素；二维数组可视为数组的数组；稀疏数组压缩存储能节省空间。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107227", "t": 2, "q": "以下关于图的遍历算法的说法中，正确的有？", "a": ["DFS和BFS都需要记录节点是否已访问", "有向图的BFS遍历序列与起始节点有关", "无向图的DFS遍历序列是唯一的", "深度优先搜索（DFS）可以用栈实现", "", ""], "r": "ABD", "e": "DFS和BFS都要记录节点访问状态避免重复访问，A对；有向图BFS从不同起始节点开始遍历序列不同，B对；无向图DFS因邻接点访问顺序不唯一，遍历序列不唯一，C错；DFS可借助栈实现，D对。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107228", "t": 2, "q": "以下关于图的存储结构的说法中，正确的有？", "a": ["无向图的邻接矩阵一定是对称矩阵", "邻接表适合存储稀疏图", "邻接表的存储空间大小与图的节点数和边数均相关", "邻接矩阵适合存储稠密图", "", ""], "r": "ABCD", "e": "无向图边是无方向的，其邻接矩阵关于主对角线对称；稀疏图边少，邻接表存储更省空间；邻接表由节点表和边表组成，空间与节点数和边数有关；稠密图边多，邻接矩阵能较好体现节点间关系。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107229", "t": 2, "q": "以下关于图的连通性的说法中，正确的有？", "a": ["无向图中，若任意两个节点之间都有路径，则该图是连通图", "有向图的强连通分量是指图中的极大强连通子图", "无向图的连通分量是指图中的极大连通子图", "一个无向图可以有多个连通分量", "", ""], "r": "ABCD", "e": "A选项符合无向图连通图定义；B选项是有向图强连通分量定义；C选项是无向图连通分量定义；D选项无向图可能不连通，可存在多个连通分量。这些说法都正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107230", "t": 2, "q": "以下关于线性表的操作的说法中，正确的有？", "a": ["顺序表的插入操作，若在表头插入，需要移动所有元素", "链表的插入操作，若在表头插入，只需要修改头指针", "顺序表的删除操作，若在表尾删除，不需要移动元素", "顺序表和链表的查找操作，时间复杂度均为O(n)（顺序表随机访问除外）", "", ""], "r": "ACD", "e": "顺序表表头插入要移所有元素；链表表头插入除改头指针，还可能要改新节点指针；顺序表表尾删除无需移动元素；顺序表随机访问外和链表查找都要逐个遍历，时间复杂度O(n)。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107231", "t": 2, "q": "以下关于栈的操作中，合法的有？", "a": ["在栈已空时进行出栈操作", "在栈未满时进行入栈操作", "获取栈顶元素但不删除（栈非空）", "在栈已满时进行入栈操作", "", ""], "r": "BC", "e": "栈空时出栈会出错；栈未满可入栈；栈非空能获取栈顶元素且不删除；栈已满入栈会溢出。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107232", "t": 2, "q": "以下关于栈的特性的说法中，正确的有？", "a": ["链栈的大小可以动态扩展", "栈的存储结构可以是顺序存储，也可以是链式存储", "栈的大小在初始化时必须固定（仅适用于顺序栈）", "栈的插入和删除操作只能在栈顶进行", "", ""], "r": "ABD", "e": "链栈可动态扩展大小；栈有顺序和链式两种存储结构；顺序栈初始化时大小可固定也可动态调整；栈操作遵循后进先出，插入和删除在栈顶。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107233", "t": 2, "q": "以下关于字符串模式匹配的说法中，正确的有？", "a": ["KMP算法通过预处理模式串，消除了主串指针的回溯", "朴素模式匹配算法的时间复杂度在最坏情况下为O(m*n)（m为模式串长度，n为主串长度）", "KMP算法的时间复杂度为O(m+n)", "BF算法（朴素算法）在最好情况下的时间复杂度为O(n)", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107234", "t": 2, "q": "以下排序算法中，空间复杂度为O(1)的有？", "a": ["直接插入排序", "归并排序", "冒泡排序", "堆排序", "", ""], "r": "ACD", "e": "直接插入排序、冒泡排序、堆排序在排序过程中只需要常数级额外空间，空间复杂度为O(1)；归并排序需要额外的辅助数组，空间复杂度为O(n)。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107235", "t": 2, "q": "以下排序算法中，时间复杂度不受数据初始状态影响的有？", "a": ["冒泡排序", "归并排序", "直接选择排序", "堆排序", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107236", "t": 2, "q": "以下属于内部排序算法的有？", "a": ["拓扑排序", "归并排序", "基数排序", "冒泡排序", "", ""], "r": "BCD", "e": "内部排序是数据记录在内存中进行排序。归并排序、基数排序、冒泡排序都是在内存中对数据进行排序的算法。而拓扑排序是对有向无环图的顶点进行排序，不属于传统的数据内部排序算法。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107237", "t": 2, "q": "以下属于数据结构\"逻辑结构\"的有？", "a": ["树状结构", "顺序存储结构", "图状结构", "集合结构", "", ""], "r": "ACD", "e": "逻辑结构是指数据元素之间的逻辑关系，树状、图状、集合结构都体现数据元素间逻辑关系；而顺序存储结构是物理结构，是数据在计算机中的存储方式。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107238", "t": 2, "q": "以下属于稳定排序算法的有？", "a": ["冒泡排序", "归并排序", "希尔排序", "插入排序", "", ""], "r": "ABD", "e": "稳定排序是指排序前后相同元素的相对顺序不变。冒泡排序、归并排序、插入排序都是稳定排序，希尔排序是不稳定排序。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107239", "t": 2, "q": "以下数据结构中，属于非线性结构的有？", "a": ["树", "数组", "图", "队列", "", ""], "r": "AC", "e": "非线性结构中元素之间不是一对一或一对多的线性关系。树和图的节点间关系复杂，不是简单线性关系，属于非线性结构；数组和队列元素按顺序排列，是线性结构。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107240", "t": 2, "q": "以下应用场景中，适合使用队列实现的有？", "a": ["递归算法的实现", "广度优先搜索（BFS）算法", "缓冲区数据处理（如键盘输入缓冲）", "消息队列（生产者-消费者模型）", "", ""], "r": "BCD", "e": "队列特点是先进先出。递归算法用栈实现，A不适合；广度优先搜索按层次遍历用队列合适；缓冲区按输入顺序处理用队列；消息队列生产者先生产的消息消费者先处理，用队列。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107241", "t": 2, "q": "以下应用场景中，适合使用栈实现的有？", "a": ["浏览器的前进/后退功能", "操作系统中的作业调度", "函数调用过程中的返回地址保存", "表达式中运算符的优先级判断", "", ""], "r": "ACD", "e": "栈的特点是后进先出。浏览器前进后退、函数调用保存返回地址、表达式运算符优先级判断都符合后进先出特性。作业调度通常用队列等结构，按一定规则依次处理任务。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107242", "t": 2, "q": "在哈希表中，解决冲突的方法有？", "a": ["二次探测法", "开放定址法", "线性探测法", "链地址法", "", ""], "r": "ABCD", "e": "开放定址法包含线性探测、二次探测；链地址法也是哈希冲突解决方法，四项均属于解决哈希冲突的方法。", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107243", "t": 2, "q": "在稀疏矩阵的压缩存储中，下列关于三元组表和十字链表的叙述中，正确的有哪些？", "a": ["十字链表适合进行矩阵的加法、乘法等运算，操作更灵活", "三元组表适合存储非零元素较少且需频繁进行按行或按列遍历的稀疏矩阵", "十字链表中每个非零元素节点包含行指针、列指针、值，同时有行头节点和列头节点", "三元组表在进行矩阵元素的插入或删除操作时，可能需要移动大量元素，效率较低", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813761101107244", "t": 2, "q": "下列排序算法中，时间复杂度在最坏情况下为O(nlogn)的有？", "a": ["堆排序", "快速排序", "希尔排序", "归并排序", "", ""], "r": "AD", "e": "堆排序和归并排序在最坏情况下时间复杂度都是O(nlogn)；快速排序最坏情况是O(n²)；希尔排序最坏情况时间复杂度与所选增量序列有关，通常大于O(nlogn)。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090176", "t": 3, "q": "图的最小生成树的权值之和是连接图中所有顶点所需的边的权值之和的最小值。",
