色分离\"原则的核心要求是？", "a": ["数据库的备份操作与恢复操作不能由同一用户执行", "数据库的查询操作与修改操作不能由同一用户执行", "数据库的开发人员与运维人员不能为同一人", "数据库管理员（DBA）与系统管理员（SA）不能为同一人", "", ""], "r": "D", "e": "“角色分离”核心是将关键职责分离以降低风险，D选项中数据库管理员和系统管理员职责不同，由同一人兼任会带来较大安全风险，符合角色分离原则。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818040", "t": 1, "q": "在数据库安全中，\"审计跟踪\"的核心目的是？", "a": ["实时阻断违规操作，防止数据泄露", "记录操作轨迹，为事后追溯提供依据", "统计用户操作频率，优化系统性能", "分析操作模式，预测潜在的安全风险", "", ""], "r": "B", "e": "审计跟踪主要是对数据库操作的各种信息进行记录。它不能实时阻断违规操作，A错误；重点不是统计操作频率来优化性能，C错误；也并非主要用于预测潜在安全风险，D错误。其核心目的是记录操作轨迹，方便事后追溯问题，B正确。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818041", "t": 1, "q": "在数据库安全中，\"审计日志分析\"的主要目的是？", "a": ["发现数据库的安全漏洞，及时修复", "识别数据库的违规操作（如未授权访问敏感表）", "统计数据库的访问量，为容量规划提供依据", "优化数据库的查询性能，减少响应时间", "", ""], "r": "B", "e": "审计日志记录了数据库中各类操作信息，通过分析它能找出违规操作行为，像未授权访问敏感表这类情况。A项主要靠安全扫描等；C项统计访问量用专门统计工具；D项优化查询性能靠查询优化技术。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818042", "t": 1, "q": "在数据库安全中，\"事务完整性\"的安全意义是？", "a": ["确保数据库中的数据不丢失，可通过备份恢复", "确保数据库中的数据不被未授权修改", "确保数据库的操作要么全部执行，要么全部不执行，防止数据不一致", "确保数据库的访问操作被记录，便于追溯", "", ""], "r": "C", "e": "事务完整性强调事务操作的原子性，即操作要么全做要么全不做，以此保证数据一致性。A说的是数据备份恢复；B是数据访问控制；D是审计记录。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818043", "t": 1, "q": "在数据库安全中，\"数据库审计\"功能的核心作用不包括以下哪项？", "a": ["追溯未授权操作的发起者与操作内容", "记录数据库所有操作行为，形成操作日志", "为安全事件调查提供证据支持", "实时阻断正在发生的SQL注入攻击", "", ""], "r": "D", "e": "数据库审计主要是记录和追溯操作，为调查提供证据。而实时阻断正在发生的SQL注入攻击是入侵检测、防火墙等防护机制的功能，并非数据库审计核心作用。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818044", "t": 1, "q": "在数据库安全中，\"数据库审计\"功能的核心作用不包括以下哪一项？", "a": ["追溯违规操作的发起者与操作内容", "记录数据库操作行为，形成审计日志", "分析操作模式，发现潜在的安全风险", "实时阻断未授权的SQL注入攻击", "", ""], "r": "D", "e": "数据库审计主要是对操作进行记录、追溯和风险分析，而实时阻断未授权的 SQL 注入攻击是入侵检测、防火墙等防护机制的功能，并非审计核心作用。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818045", "t": 1, "q": "在数据库安全中，\"数据库脱敏\"技术的主要应用场景是？", "a": ["开发/测试环境使用的生产数据副本", "数据库备份数据的异地存储", "数据库与外部系统的实时数据传输", "生产数据库的日常业务访问", "", ""], "r": "A", "e": "数据库脱敏是对敏感数据进行变形处理，主要用于开发/测试环境使用生产数据副本时，防止敏感信息泄露。备份异地存储、实时数据传输、日常业务访问并非其主要应用场景。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818046", "t": 1, "q": "在数据库安全中，\"透明数据加密（TDE）\"的加密范围是？", "a": ["仅加密数据库中的敏感字段（如身份证号）", "加密数据库与应用之间的传输数据", "加密数据库的备份文件与日志文件", "加密数据库的数据文件与日志文件，对应用透明", "", ""], "r": "D", "e": "透明数据加密（TDE）会对数据库的数据文件和日志文件进行加密，且对应用是透明的，不影响应用正常使用。A选项仅加密敏感字段不是TDE加密范围；B选项加密传输数据是传输层加密的功能；C选项不全面。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818047", "t": 1, "q": "在数据库安全中，针对\"SQL注入攻击\"的防御措施，以下哪种属于\"代码层面\"的根本防御手段？", "a": ["使用预编译语句（Prepared Statement）与参数化查询", "对数据库账号设置最小权限", "部署数据库防火墙，拦截异常SQL语句", "定期更新数据库补丁，修复漏洞", "", ""], "r": "A", "e": "预编译语句和参数化查询能从代码层面防止SQL注入，从根本上处理用户输入。B是权限管理，C是外部防护，D是修复系统漏洞，都不是代码层面根本防御手段。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813905787818048", "t": 1, "q": "在OWASP Top 10（2021版）中，下列哪种安全风险被列为排名第一的Web应用安全威胁？", "a": ["注入攻击", "跨站脚本（XSS）", "失效的访问控制", "敏感信息泄露", "", ""], "r": "C", "e": "OWASP Top 10（2021版）里排名第一的Web应用安全威胁是失效的访问控制。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891456", "t": 2, "q": "数据库安全中，\"权限管理\"的关键操作包括以下哪些？（　）", "a": ["使用角色管理权限，简化权限分配与变更", "定期审查用户权限，回收不再需要的权限", "为所有用户分配数据库管理员（DBA）权限，方便操作", "禁止用户共享账户，确保操作可追溯到个人", "", ""], "r": "ABD", "e": "A用角色管理权限可简化操作；B定期审查并回收权限能保障安全；D禁止共享账户可保证操作可追溯。而C为所有用户分配DBA权限会带来极大安全风险。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891457", "t": 2, "q": "数据库安全中，“审计跟踪”的主要作用包括以下哪些？（　）", "a": ["为安全事件调查提供证据支持，满足合规要求", "统计数据库的访问频率，分析用户的使用习惯", "监控数据库的性能瓶颈，优化数据库运行效率", "发现异常操作行为，及时预警潜在的安全威胁", "", ""], "r": "AD", "e": "审计跟踪主要是记录数据库的操作等信息，能为安全事件调查提供证据，满足合规要求，也可发现异常操作预警安全威胁。B选项统计访问频率分析使用习惯并非主要作用；C选项监控性能瓶颈优化效率不是审计跟踪的核心功能。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891458", "t": 2, "q": "数据库安全中，“数据备份与恢复”的关键指标包括以下哪些？（　）", "a": ["恢复点目标（RPO），表示灾难发生后可恢复到的最近数据时间点", "数据库的并发连接数，指数据库同时支持的最大用户连接数", "备份窗口，指完成备份操作所需的时间段", "恢复时间目标（RTO），表示灾难发生后系统恢复正常运行的最长允许时间", "", ""], "r": "ACD", "e": "数据备份与恢复关键指标围绕备份时间和恢复程度。A选项RPO体现可恢复到的最近数据时间点，C选项备份窗口是完成备份的时间段，D选项RTO是系统恢复正常运行的最长允许时间，都与备份恢复相关；B选项数据库并发连接数主要与数据库性能相关，和数据备份与恢复无关。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891459", "t": 2, "q": "数据库安全中，\"数据库加密\"的实现层次包括以下哪些？（　）", "a": ["存储层加密，对数据库物理文件（如数据文件、日志文件）加密", "应用层加密，在应用程序中对数据加密后再存入数据库", "表空间层加密，对数据库中的表空间进行整体加密", "字段级加密，对表中特定敏感字段（如银行卡号、身份证号）加密", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891460", "t": 2, "q": "数据库安全中，“数据脱敏”的常用技术包括以下哪些？（　）", "a": ["替换技术，用虚构数据替换真实敏感数据（如用\"138****1234\"替换真实手机号）", "NULL值替换技术，将敏感数据替换为NULL值", "屏蔽技术，隐藏敏感数据的部分内容（如身份证号显示为\"110101********1234\"）", "打乱技术，打乱数据的关联关系（如将用户姓名与手机号的对应关系打乱）", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891461", "t": 2, "q": "数据库安全中，下列哪些属于\"数据库访问控制\"的实现方式？（　）", "a": ["基于属性的访问控制（ABAC）", "数据库视图", "角色级别的访问控制", "强制访问控制", "", ""], "r": "ABCD", "e": "基于属性的访问控制（ABAC）、角色级别的访问控制、强制访问控制都是常见的数据库访问控制实现方式，数据库视图可通过限制用户对数据的可见性起到一定访问控制作用。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891462", "t": 2, "q": "数据库安全中，针对\"SQL注入攻击\"的有效防御措施包括以下哪些？（　）", "a": ["禁用数据库中的存储过程，防止存储过程被注入利用", "使用参数化查询或预编译语句，分离SQL语句与用户输入", "对用户输入进行严格的合法性校验（如数据类型、长度、格式）", "定期更新数据库补丁，修复数据库自身的注入漏洞", "", ""], "r": "BCD", "e": "参数化查询可分离SQL与输入防止注入；对输入严格校验能避免恶意输入；更新数据库补丁可修复注入漏洞。而禁用存储过程并非有效防御注入攻击的通用做法。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891463", "t": 2, "q": "信息内容安全防护中，下列哪些技术属于\"主动发现并处置敏感信息泄露风险\"的手段？（　）", "a": ["敏感信息识别技术（如PII识别）", "防火墙规则配置", "数据泄露检测技术（如流量分析）", "内容溯源技术", "", ""], "r": "ACD", "e": "敏感信息识别技术可找出敏感信息，数据泄露检测技术能监测敏感信息泄露风险，内容溯源技术可追溯敏感信息源头，这些都能主动发现并处置风险；防火墙规则配置主要是控制网络访问，并非主动发现敏感信息泄露风险。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891464", "t": 2, "q": "信息内容安全中，\"不良信息\"的主要类型包括以下哪些？（　）", "a": ["正常新闻信息，客观报道的时事新闻内容", "暴力恐怖信息，宣扬暴力、恐怖活动的内容", "色情低俗信息，包含淫秽、低俗内容的文字或图像", "违法违规信息，违反法律法规的煽动、教唆内容", "", ""], "r": "BCD", "e": "正常新闻信息是积极健康、符合规范的，并非不良信息；而暴力恐怖、色情低俗、违法违规信息都属于危害社会、违背公序良俗的不良信息。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891465", "t": 2, "q": "信息内容安全中，\"不良信息过滤系统\"的核心组成模块包括以下哪些？（　）", "a": ["数据采集模块，负责获取待过滤的信息内容", "用户行为分析模块，负责分析用户的信息浏览偏好", "决策引擎模块，根据预设规则或模型判断信息是否为不良信息", "特征提取模块，负责提取信息中的关键词、语义、图像等特征", "", ""], "r": "ACD", "e": "不良信息过滤系统首先要采集信息，接着提取特征，再由决策引擎判断是否为不良信息。A负责获取信息，D提取特征，C进行判断，这三个是核心模块。而B用户行为分析模块主要针对用户偏好，并非过滤不良信息核心。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891466", "t": 2, "q": "信息内容安全中，“个人信息保护”需遵循的核心原则包括以下哪些？（　）", "a": ["保密性原则:采取措施防止个人信息泄露", "合法性原则:收集个人信息需获得用户同意", "最小必要原则:仅收集业务必需的个人信息", "完整性原则:确保收集的个人信息不缺失", "", ""], "r": "ABC", "e": "答案：ABC分析：在信息内容安全中，“个人信息保护”需遵循的核心原则主要包括保密性原则、合法性原则和最小必要原则。保密性原则要求采取措施防止个人信息泄露，确保个人信息的安全；合法性原则要求收集个人信息需获得用户的明确同意，遵循法律法规的规定；最小必要原则要求仅收集业务必需的个人信息，避免过度收集。完整性原则虽然也是信息安全的一个重要方面，但在个人信息保护的核心原则中，它并不特指，因此不包括在内。所以正确答案是A、B、C。", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891467", "t": 2, "q": "信息内容安全中，“个人信息保护”需遵循的原则包括以下哪些？（　）", "a": ["公开透明原则，告知用户信息收集的目的、方式与范围", "安全保障原则，采取措施保护个人信息不被泄露、篡改", "可携带原则，允许用户将个人信息从一个平台转移到另一个平台", "合法原则，收集、使用个人信息需符合法律法规要求", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891468", "t": 2, "q": "信息内容安全中，“内容安全防护体系”的核心技术组件包括以下哪些？（　）", "a": ["基于流量控制的带宽管理系统", "基于深度学习的图像/视频内容识别系统", "基于语义分析的文本内容过滤系统", "基于数字签名的内容完整性验证系统", "", ""], "r": "BC", "e": "内容安全防护需对各类内容进行识别和过滤，B可识别图像视频内容，C能过滤文本内容，是核心技术组件；A主要针对流量带宽管理，与内容安全防护核心关联不大；D侧重于内容完整性验证，并非核心技术组件。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891469", "t": 2, "q": "信息内容安全中，\"内容完整性保护\"的技术手段包括以下哪些？（　）", "a": ["访问控制，限制用户对内容的修改权限，间接保护完整性", "消息认证码（MAC），通过密钥生成校验值，验证内容完整性", "加密技术，通过加密确保内容在传输过程中不被篡改", "哈希算法（如SHA-256），生成内容哈希值，比对哈希值判断完整性", "", ""], "r": "BD", "e": "A选项访问控制主要是对访问权限进行管理，并非直接保护内容完整性；B项消息认证码可通过密钥生成校验值来验证；C项加密虽一定程度防篡改，但重点在保密，不是直接确保完整性；D项哈希算法能通过比对哈希值判断。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891470", "t": 2, "q": "信息内容安全中，\"数字版权保护（DRM）\"技术的核心功能包括以下哪些？（　）", "a": ["修复数字内容中的损坏数据，保证内容完整性", "检测数字内容中的不良信息，防止违规内容传播", "追踪数字内容的传播路径，识别未授权分发行为", "控制数字内容的使用权限（如播放次数、有效期）", "", ""], "r": "CD", "e": "数字版权保护（DRM）主要是保护数字内容版权，核心是控制使用权限和追踪传播防止未授权分发。A选项修复损坏数据与DRM核心功能无关；B选项检测不良信息并非DRM核心功能。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891471", "t": 2, "q": "信息内容安全中，“网络舆情分析”的核心步骤包括以下哪些？（　）", "a": ["舆情态势分析，识别舆情的热点、趋势与情感倾向", "舆情预警，对可能引发负面影响的舆情及时告警", "舆情压制，通过删除负面信息消除舆情影响", "舆情信息预处理，包括去重、降噪、分词等", "", ""], "r": "ABD", "e": "网络舆情分析核心步骤通常先进行信息预处理，为后续分析做准备，再进行态势分析掌握舆情情况，最后进行预警防范风险。而舆情压制不是核心分析步骤。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891472", "t": 2, "q": "信息内容安全中，下列哪些措施可用于\"防止AI生成的虚假信息（如深度伪造视频）传播\"？（　）", "a": ["开发AI生成内容的检测技术（如识别伪造特征）", "加强对AI生成工具的使用监管", "加强对AI生成工具的访问控制", "提高公众对于虚假信息的辨识能力", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891473", "t": 2, "q": "信息内容安全中，下列哪些措施可用于防止\"内部人员故意泄露敏感信息（如员工拷贝公司机密文档外传）\"？（　）", "a": ["数据防泄漏（DLP）技术", "防火墙配置", "网络访问控制（NAC）", "内部人员行为审计", "", ""], "r": "AD", "e": "数据防泄漏技术可监控和阻止敏感数据外传；内部人员行为审计能对员工操作进行记录和审查，有助于发现和防止内部人员故意泄密。防火墙主要防外部攻击，网络访问控制侧重于限制网络访问，对防止内部人员故意泄露敏感信息作用不大。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891474", "t": 2, "q": "信息内容安全中，下列哪些属于\"信息内容传播控制\"的手段？（　）", "a": ["加密传输所有信息内容", "对传播的信息进行实时监控", "对违规账号实施禁言、封号处罚", "对用户进行信息安全意识培训", "", ""], "r": "BC", "e": "信息内容传播控制主要是对信息传播过程进行管控。实时监控能及时发现问题，对违规账号处罚可制止不良信息传播，都属于传播控制手段。加密传输是保障信息安全而非传播控制，对用户培训是提升安全意识，并非直接控制传播。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891475", "t": 2, "q": "信息内容安全中，下列哪些属于\"信息内容合规性检测\"的范畴？（　）", "a": ["检测图像中是否包含色情、暴力内容", "检测文本中是否包含煽动性言论", "检测视频是否存在版权侵权", "检测音频中是否包含敏感政治信息", "", ""], "r": "ABD", "e": "答案：ABD“信息内容合规性检测”主要关注的是信息内容是否符合法律法规和社会道德规范，主要针对的是信息内容本身的合规性，A 选项检测图像中的不良内容、B 选项检测文本中的不当言论、D 选项检测音频中的敏感政治信息都属于对信息内容本身合规性的检测。而 C 选项检测视频的版权侵权情况更多涉及的是知识产权相关的法律问题，不属于信息内容合规性检测的常规范畴。", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891476", "t": 2, "q": "信息系统工程标准规范中，下列哪些属于我国自主制定的信息安全相关国家标准？（　）", "a": ["RFC 2828《Internet安全术语》", "GB/T 20274-2022《信息安全技术信息系统安全保障评估框架》", "GB/T 18336-2015《信息技术安全技术信息技术安全评估准则》", "GB/T 25070-2019《信息安全技术网络安全等级保护安全设计技术要求》", "", ""], "r": "BCD", "e": "选项A的RFC是互联网工程任务组（IETF）发布的文档，并非我国自主制定。选项B、C、D中“GB/T”是我国推荐性国家标准代号，这些标准是我国自主制定的信息安全相关国家标准。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891477", "t": 2, "q": "以下哪些属于软件安全开发生命周期（SDL）\"测试阶段\"的核心安全活动？（　）", "a": ["进行模糊测试，检测输入验证缺陷", "开展安全回归测试，验证漏洞修复效果", "执行代码静态分析，排查语法与逻辑漏洞", "执行渗透测试，模拟攻击者尝试突破系统", "", ""], "r": "ABD", "e": "测试阶段主要是用各种测试手段发现软件安全问题。模糊测试、安全回归测试、渗透测试都属于测试阶段活动，而代码静态分析一般在开发阶段进行。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891478", "t": 2, "q": "在软件安全开发中，以下哪些措施属于\"需求分析阶段\"的安全活动？（　）", "a": ["定义安全测试用例，明确漏洞检测的方法与标准", "开展威胁建模，识别系统潜在威胁源与攻击路径", "制定软件安全需求规格说明书，明确数据加密、访问控制等安全要求", "使用静态代码扫描工具检测源代码中的安全漏洞", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891479", "t": 2, "q": "在数据库安全中，\"SQL注入攻击\"的常见利用方式包括以下哪些？（　）", "a": ["利用UNION语句拼接查询，获取数据库敏感信息", "利用XP_CMDSHELL等存储过程，执行系统命令", "利用OR 1=1等逻辑注入，绕过登录验证", "利用BACKUP DATABASE语句，导出数据库文件", "", ""], "r": "ABC", "e": "答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813906911891480", "t": 2, "q": "在数据库安全中，针对\"数据泄露\"风险的防御措施包括以下哪些？（　）", "a": ["定期对数据库进行漏洞扫描，修复安全漏洞", "启用数据库的事务日志功能，确保数据可恢复", "部署数据库审计系统，记录敏感数据访问行为", "对数据库敏感字段实施加密存储（如字段级加密）", "", ""], "r": "ACD", "e": "A可发现并修复漏洞防止因漏洞致数据泄露；C能记录敏感数据访问，便于发现异常防止数据泄露；D加密存储敏感字段可保护数据，降低泄露风险。B事务日志功能主要用于数据恢复，并非针对数据泄露防御。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428864", "t": 3, "q": "软件安全中，“威胁建模”的主要目的是识别软件的所有潜在漏洞，并直接提供漏洞修复方案。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "威胁建模主要是识别软件潜在威胁，评估其风险，并非识别所有潜在漏洞，也不直接提供修复方案。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428865", "t": 3, "q": "软件安全中，\"依赖项扫描\"仅需在软件上线前执行一次，上线后无需再次扫描。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "软件依赖项可能随时间变化，新的安全漏洞也会不断出现，所以上线后也需定期扫描依赖项。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428866", "t": 3, "q": "软件安全中，\"最小权限原则\"要求软件的每个模块和用户仅拥有完成其任务所必需的最小权限，权限不可临时提升。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“最小权限原则”确实要求软件的每个模块和用户仅拥有完成其任务所必需的最小权限，但在特定情况下权限是可以临时提升的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428867", "t": 3, "q": "数据库安全中，\"访问控制列表（ACL）\"可同时限制用户对数据库的操作类型（如读、写）和操作对象（如特定表）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "访问控制列表（ACL）能明确规定用户可对哪些数据库对象（如特定表）进行何种操作（如读、写）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428868", "t": 3, "q": "数据库安全中，\"基于角色的访问控制（RBAC）\"通过将权限分配给角色，再将角色分配给用户，可简化权限管理，减少权限分配错误。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RBAC 模式就是把权限赋予角色，再让用户关联角色，避免直接给用户分配权限，这样能简化管理流程，降低权限分配出错概率。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428869", "t": 3, "q": "数据库安全中，\"角色-Based访问控制（RBAC）\"相比\"自主访问控制（DAC）\"，更适合大规模企业级数据库的权限管理。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RBAC基于角色进行权限分配，管理员可集中管理角色和权限，适应大规模企业复杂的组织架构和权限需求；DAC由数据所有者自主分配权限，管理分散，大规模企业中易混乱。所以RBAC更适合大规模企业级数据库权限管理。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428870", "t": 3, "q": "数据库安全中，\"角色分离\"原则要求数据库的开发人员与测试人员不能为同一人，防止开发人员掩盖测试发现的漏洞。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "角色分离旨在将不同职责分配给不同人员，开发与测试角色分离可避免开发人员掩盖漏洞，保障数据库安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428871", "t": 3, "q": "数据库安全中，\"审计日志\"的主要作用是优化数据库的查询性能，提高数据访问速度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计日志主要用于记录数据库中发生的各种事件，以便进行安全审查和追踪，而非优化查询性能和提高数据访问速度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428872", "t": 3, "q": "数据库安全中，\"审计日志\"仅需记录未授权的违规操作，无需记录授权的正常操作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "审计日志不仅要记录未授权的违规操作，也需记录授权的正常操作，这样有助于全面了解数据库活动，进行安全分析和故障排查等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428873", "t": 3, "q": "数据库安全中，\"事务的持久性\"意味着事务提交后，即使数据库发生故障（如断电），已提交的修改也不会丢失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "事务的持久性就是指事务一旦提交，它对数据库的改变就是永久性的，即便系统出现故障（如断电），已提交的修改也不会丢失。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428874", "t": 3, "q": "数据库安全中，\"事务的原子性\"意味着一个事务执行过程中，即使发生故障，已执行的部分操作也不会被回滚。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "事务的原子性是指事务是一个不可分割的工作单位，要么全部执行，要么全部不执行。若执行中发生故障，已执行部分操作会回滚。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428875", "t": 3, "q": "数据库安全中，\"事务完整性\"的\"原子性\"要求数据库事务执行过程中，若发生错误，需回滚到事务开始前的状态，避免数据不一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据库事务“原子性”强调事务是一个不可分割的整体，要么全部执行成功，要么全部不执行。当执行中出错，就需回滚到事务开始前状态以保证数据一致。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428876", "t": 3, "q": "数据库安全中，\"数据备份\"的频率越高，备份数据与生产数据的差异越小，数据恢复后的完整性越高，因此备份频率应尽可能高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然提高备份频率能减小备份数据与生产数据差异、提升数据恢复完整性，但过高的备份频率会增加系统资源消耗和成本等。所以不能仅因好处就使备份频率尽可能高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428877", "t": 3, "q": "数据库安全中，\"数据备份\"的频率越高，数据恢复时丢失的数据就越少，因此备份频率应尽可能高，无需考虑备份窗口。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然备份频率高可减少数据恢复时丢失的数据，但备份需占用系统资源和时间，不考虑备份窗口，可能影响系统正常运行，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428878", "t": 3, "q": "数据库安全中，\"数据加密存储\"和\"数据脱敏\"的目的相同，都是为了防止数据库中的敏感数据被未授权访问。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据加密存储是将数据进行加密后再存储，通过密钥来保证数据的保密性，防止数据在存储过程中被未授权访问，加密后的数据在使用时需解密。而数据脱敏是对敏感数据进行变形处理，如替换、掩码等，使数据不包含敏感信息，主要用于在一些需要使用数据但又不能泄露敏感内容的场景。二者目的有差异，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428879", "t": 3, "q": "数据库安全中，\"数据库备份\"仅能用于应对硬件故障导致的数据丢失，无法恢复因人为误操作或恶意篡改导致的数据损坏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据库备份不仅能应对硬件故障导致的数据丢失，也可用于恢复因人为误操作或恶意篡改导致的数据损坏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428880", "t": 3, "q": "数据库安全中，\"数据库防火墙\"可实时阻断SQL注入攻击，无需依赖代码层面的防御措施。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428881", "t": 3, "q": "数据库安全中，\"数据库管理员（DBA）拥有最高权限，可执行所有数据库操作，因此无需对DBA的操作进行审计。\"", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "即便DBA拥有最高权限，但其操作可能存在误操作、违规操作甚至恶意操作等情况，对DBA操作进行审计能及时发现并纠正问题，保障数据库安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428882", "t": 3, "q": "数据库安全中，\"数据库视图\"不仅能隐藏基础表的结构和敏感字段，还能限制用户查询的数据范围（如仅显示特定部门的数据）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据库视图是虚拟表，可将基础表部分结构和字段封装，从而隐藏敏感信息，同时能通过定义查询逻辑限制用户能查询的数据范围。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428883", "t": 3, "q": "数据库安全中，\"数据脱敏\"技术会修改原始数据，因此脱敏后的数据无法用于开发测试环境。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据脱敏虽修改原始数据，但可通过特定脱敏规则保留数据特征和格式，脱敏后的数据能用于开发测试环境。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428884", "t": 3, "q": "数据库安全中，\"透明数据加密（TDE）\"会加密数据库中的所有数据，包括索引和临时文件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "透明数据加密（TDE）能对数据库中的数据文件、日志文件以及索引等进行加密，但通常不包括临时文件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428885", "t": 3, "q": "数据库安全中，\"透明数据加密（TDE）\"能够加密数据库连接过程中传输的数据，防止传输过程中的数据泄露。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "透明数据加密（TDE）主要是对数据库文件进行静态加密，而非加密数据库连接过程中传输的数据，传输数据加密一般用SSL/TLS等技术。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428886", "t": 3, "q": "数据库安全中，\"字段级加密\"相比\"表空间级加密\"，加密粒度更细，更适合保护表中个别敏感字段（如手机号）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "字段级加密针对表中特定字段加密，表空间级加密是对整个表空间加密，显然字段级加密粒度更细，适合保护个别敏感字段。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428887", "t": 3, "q": "数据库安全中，\"自主访问控制（DAC）\"允许用户将自身拥有的权限授予其他用户，可能导致权限的无限扩散。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "自主访问控制（DAC）里用户能按自身意愿把权限授予其他用户，这种自由授予的方式容易致使权限无限扩散。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428888", "t": 3, "q": "数据库安全中，\"SQL注入攻击\"仅能通过用户输入的文本框注入恶意SQL语句，无法通过URL参数、Cookie等其他途径实施。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“SQL注入攻击”不仅能通过用户输入的文本框注入恶意SQL语句，也可通过URL参数、Cookie等途径实施。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428889", "t": 3, "q": "数据库安全中，\"SQL注入攻击\"仅能通过Web应用的用户输入发起，无法通过数据库客户端直接发起。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "SQL注入攻击不仅能通过Web应用用户输入发起，也可通过数据库客户端直接发起。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428890", "t": 3, "q": "数据库安全中，\"SQL注入攻击\"只能针对关系型数据库（如MySQL、Oracle），无法针对非关系型数据库（如MongoDB、Redis）实施。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "非关系型数据库也存在类似SQL注入的攻击方式，如针对MongoDB的注入攻击，并非只能针对关系型数据库。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428891", "t": 3, "q": "信息内容安全中，\"个人信息匿名化\"后的数据仍属于个人信息，需按照个人信息保护法规进行管理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "个人信息匿名化后无法识别特定自然人，不属于个人信息，无需按个人信息保护法规管理。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428892", "t": 3, "q": "信息内容安全中，\"基于关键词的内容过滤\"技术可有效识别语义模糊的违规内容（如使用谐音、隐喻的违规表达）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基于关键词的内容过滤主要是依据预设关键词来筛选，对于语义模糊、用谐音和隐喻的违规表达难以有效识别。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428893", "t": 3, "q": "信息内容安全中，\"基于AI的内容识别\"技术的误报率为零，可完全替代人工审核。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "目前基于AI的内容识别技术虽有进步，但受算法局限性、数据多样性等因素影响，无法做到误报率为零，不能完全替代人工审核。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428894", "t": 3, "q": "信息内容安全中，\"跨境数据流动\"的安全管理要求所有跨境数据必须经过加密传输，无论数据是否敏感。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并非所有跨境数据都要求必须加密传输，只有敏感数据等通常才会有严格的加密传输要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428895", "t": 3, "q": "信息内容安全中，\"内容过滤技术\"的误判率越低，说明该技术的安全性和实用性越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "误判率低意味着内容过滤技术能更准确地区分正常和不良内容，减少将正常内容误判为不良内容，也能更精准拦截不良内容，安全性和实用性自然更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428896", "t": 3, "q": "信息内容安全中，“内容完整性验证”只能通过数字签名技术实现，无法通过哈希算法实现。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "内容完整性验证既能用数字签名技术，也能用哈希算法。哈希算法可通过计算数据的哈希值，对比前后哈希值是否一致来验证完整性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428897", "t": 3, "q": "信息内容安全中，\"数据防泄漏（DLP）技术\"可通过监控网络流量、终端操作，防止敏感信息通过邮件、U盘等渠道外泄。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据防泄漏（DLP）技术确实能对网络流量、终端操作进行监控，进而防止敏感信息通过邮件、U盘等途径泄露。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428898", "t": 3, "q": "信息内容安全中，\"数字签名\"技术同时保证了内容的完整性和机密性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字签名主要保证内容的完整性、真实性和不可否认性，不能保证内容的机密性，机密性一般由加密技术实现。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428899", "t": 3, "q": "信息内容安全中，\"数字水印\"技术嵌入的水印信息不可见且不可移除，可永久存在于内容中。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水印技术嵌入的水印信息通常不可见，但并非不可移除，在某些技术手段下可被去除，并非能永久存在于内容中。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428900", "t": 3, "q": "信息内容安全中，“数字水印技术”仅能用于版权保护，无法用于信息溯源。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水印技术不仅可用于版权保护，也能用于信息溯源，通过在数字产品中嵌入特定信息，能追踪信息传播源头。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428901", "t": 3, "q": "信息内容安全中，\"信息茧房\"现象会导致用户接触的信息范围变窄，但不会对信息内容安全产生实质性风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“信息茧房”使用户处于同质化信息环境，接触信息范围变窄，易造成认知偏差、群体极化等问题，对信息内容安全有实质风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428902", "t": 3, "q": "信息内容安全中，\"信息溯源技术\"仅能追溯文本类信息的传播源头，无法对图像、视频等多媒体信息进行溯源。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信息溯源技术不仅能追溯文本类信息传播源头，也可对图像、视频等多媒体信息进行溯源。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428903", "t": 3, "q": "信息内容安全中，\"用户身份认证\"仅能防止未授权用户访问系统，无法对用户发布的信息内容进行安全管控。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "用户身份认证主要作用是确认用户身份，防止未授权用户进入系统，它本身不具备对用户发布信息内容进行安全管控的功能。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428904", "t": 3, "q": "信息内容安全中，\"DDoS攻击\"通过大量虚假请求耗尽服务器资源，导致合法用户无法访问信息，破坏了信息的可用性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DDoS攻击即分布式拒绝服务攻击，确实是利用大量虚假请求占用服务器资源，使服务器无法正常为合法用户提供服务，破坏了信息的可用性。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428905", "t": 3, "q": "信息内容安全中的\"差分隐私\"技术通过向数据集中添加噪声，既能保证数据的统计可用性，又能保护个体隐私。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "差分隐私技术核心就是向数据集加入特定噪声，在一定程度上可保证数据用于统计分析的可用性，同时有效保护个体隐私。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428906", "t": 3, "q": "信息内容安全中的\"个人信息保护\"仅需在数据收集阶段采取措施，数据使用、传输、存储阶段无需额外保护。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "个人信息在收集、使用、传输、存储等全生命周期都可能面临风险，每个阶段都需要采取相应保护措施。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428907", "t": 3, "q": "信息内容安全中的\"个人信息脱敏\"后的数据，因已去除敏感信息，可无限制用于任何场景。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "个人信息脱敏后虽去除敏感信息，但不意味着能无限制用于任何场景，不同使用场景有不同合规要求和风险。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428908", "t": 3, "q": "信息内容安全中的\"基于关键词的过滤技术\"能够有效识别包含隐喻、谐音等变异形式的不良信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基于关键词的过滤技术主要是依据预设关键词进行匹配，难以有效识别隐喻、谐音等变异形式的不良信息。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428909", "t": 3, "q": "信息内容安全中的\"内容过滤技术\"不仅能拦截文本类违规信息，还能识别图像、音频、视频中的敏感内容。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "内容过滤技术发展至今，具备对多种形式信息进行检测的能力，可有效识别文本、图像、音频、视频里的敏感内容。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428910", "t": 3, "q": "信息内容安全中的\"内容过滤技术\"仅能在网络出口处部署，无法在终端设备（如电脑、手机）上部署。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "内容过滤技术不仅能在网络出口处部署，也可在终端设备如电脑、手机上部署，像很多电脑和手机的安全软件都具备内容过滤功能。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428911", "t": 3, "q": "信息内容安全中的\"深度伪造（Deepfake）\"技术仅能用于生成虚假视频，无法生成虚假文本或音频。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "深度伪造技术不仅能生成虚假视频，也可用于生成虚假文本和音频。", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428912", "t": 3, "q": "信息内容安全中的\"数字版权保护（DRM）\"技术一旦部署，即可永久保护数字内容的版权，无需后续更新。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字版权保护（DRM）技术并非部署后就能永久保护数字内容版权，随着技术发展，破解手段不断变化，需要不断更新来应对新的威胁。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428913", "t": 3, "q": "信息内容安全中的\"数字水印技术\"嵌入的标识信息必须是可见的，才能实现版权追溯功能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字水印技术嵌入的标识信息可以是不可见的，也能实现版权追溯等功能，并非必须可见。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428914", "t": 3, "q": "信息内容安全中的\"网络舆情分析\"仅能分析文本类型的舆情信息，无法处理图像、视频等多媒体舆情信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "网络舆情分析并非仅能分析文本类型的舆情信息，现在有技术可以对图像、视频等多媒体舆情信息进行处理和分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428915", "t": 3, "q": "信息系统工程标准规范中，我国网络安全等级保护制度的\"三级等保\"要求低于\"四级等保\"，适用于一般重要的信息系统。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428916", "t": 3, "q": "信息系统工程标准规范中，GB/T 22239-2019《信息安全等级保护基本要求》仅适用于网络系统，不适用于云计算、大数据等新型信息系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "GB/T 22239 - 2019《信息安全等级保护基本要求》适用于各类信息系统，包括云计算、大数据等新型信息系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428917", "t": 3, "q": "信息系统工程标准规范中，ISO/IEC 27001是信息安全管理体系的核心标准，组织通过该标准认证即表示其信息安全水平达到最高级别。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "ISO/IEC 27001是信息安全管理体系核心标准，但通过该标准认证不意味着信息安全水平达到最高级别，信息安全是动态且不断发展的，有多种因素影响安全水平。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428918", "t": 3, "q": "信息系统工程标准规范中，ISO/IEC 27034《应用安全管理》标准仅适用于大型企业，中小企业无需遵循该标准。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "ISO/IEC 27034《应用安全管理》标准并非仅适用于大型企业，中小企业也可根据自身需求遵循该标准来保障应用安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428919", "t": 3, "q": "信息系统工程中，“安全审计”的主要目的是实时阻止安全事件的发生，而非事后追溯事件原因。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "安全审计主要是对系统活动和记录进行审查分析，侧重于事后追溯事件原因，找出违规行为和安全隐患，并非实时阻止安全事件发生。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428920", "t": 3, "q": "信息系统工程中，\"安全巡检\"的频率应固定，无论系统重要性和威胁环境如何变化，都无需调整巡检周期。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不同系统重要性和威胁环境下，安全风险不同，固定巡检频率无法满足实际安全需求，应根据情况调整巡检周期。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428921", "t": 3, "q": "信息系统工程中，“风险评估”的结果仅需在系统规划阶段使用，系统运行过程中无需再次进行风险评估。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信息系统在运行过程中，内外部环境等会不断变化，新的风险可能出现，所以系统运行过程中也需再次进行风险评估，并非仅在系统规划阶段使用评估结果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428922", "t": 3, "q": "信息系统工程中，“风险评估”仅需识别和分析安全风险，无需提出风险处置建议。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "风险评估不仅要识别和分析安全风险，还需提出风险处置建议，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813908283428923", "t": 3, "q": "OWASP Top 10（2021版）中，\"注入攻击\"的排名相比2017版有所下降，主要原因是近年来参数化查询等防御技术的广泛应用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "随着参数化查询等防御技术广泛应用，注入攻击风险得到一定程度控制，在OWASP Top 10（2021版）中排名相比2017版下降。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第9章 网络安全（1）", "n": "基础练习题【含解析】 / 第9章 网络安全（1）", "qs": [{"id": "2034813919561912320", "t": 1, "q": "根据网络安全模型，下列哪种模型通过\"最小权限原则\"和\"默认拒绝\"策略，确保主体仅能访问其授权的客体？", "a": ["Chinese Wall模型", "Biba模型", "CLR模型（克拉克-威尔逊模型）", "BLP模型（贝尔-拉帕杜拉模型）", "", ""], "r": "D", "e": "BLP模型基于“简单安全特性”和“*特性”，遵循“最小权限原则”和“默认拒绝”，保证主体只能访问其被授权的客体。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912321", "t": 1, "q": "密码学中，\"数字证书\"的核心内容不包括下列哪项？", "a": ["证书颁发机构（CA）的签名", "证书的有效期", "证书持有者的公钥", "证书持有者的私钥", "", ""], "r": "D", "e": "私钥是用户自己严格保密的，不会包含在公开的数字证书里。而证书颁发机构签名、有效期、持有者公钥都是数字证书核心内容。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912322", "t": 1, "q": "密码学中，\"雪崩效应\"是指？", "a": ["对称加密算法中，相同明文使用相同密钥加密后得到相同密文", "非对称加密算法中，公钥可公开，私钥需保密", "明文或密钥的微小变化，会导致密文产生巨大变化", "加密算法的密钥长度增加时，破解难度呈指数级增长", "", ""], "r": "C", "e": "“雪崩效应”强调的是输入（明文或密钥）有微小改变，密文就会有巨大变化。A说的是对称加密特点；B讲的是非对称加密密钥公开和保密情况；D说的是密钥长度与破解难度关系。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912323", "t": 1, "q": "密码学中，消息认证码（MAC）的核心作用是？", "a": ["实现消息的不可否认性，防止发送者抵赖", "验证消息的完整性与发送者身份，防止篡改与伪造", "压缩消息长度，提高传输效率", "确保消息的机密性，防止被窃听", "", ""], "r": "B", "e": "MAC是对消息进行认证的一种方式。它能通过特定算法生成一个码，用于确认消息在传输过程中没被篡改，且能一定程度验证发送者身份。A选项不可否认性靠数字签名；C选项MAC不负责压缩；D选项MAC不保障机密性。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912324", "t": 1, "q": "某攻击利用HTTP协议的特性，向目标Web服务器发送大量看似合法但消耗资源的请求（如大文件上传、复杂查询），导致服务器CPU、内存耗尽而无法响应正常请求，该攻击属于？", "a": ["SQL注入攻击", "应用层拒绝服务（DoS）攻击", "跨站脚本（XSS）攻击", "分布式拒绝服务（DDoS）攻击", "", ""], "r": "B", "e": "题干描述的是通过发送大量消耗资源请求使服务器资源耗尽无法响应正常请求，这是应用层拒绝服务攻击的特征。SQL注入是通过在输入中注入恶意SQL语句；XSS是通过注入恶意脚本；DDoS是利用多台机器发起攻击。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912325", "t": 1, "q": "某逆向分析任务中，分析人员需要跟踪目标程序调用的系统函数（如Windows的CreateFile函数），查看函数的参数和返回值，最适合使用的工具是？", "a": ["OllyDbg（动态调试器）", "Wireshark（网络抓包工具）", "IDA Pro（静态反汇编）", "Hex Workshop（十六进制编辑器）", "", ""], "r": "A", "e": "要跟踪目标程序调用系统函数并查看参数和返回值需动态调试，OllyDbg是动态调试器可实现该功能。Wireshark用于网络数据抓包，IDA Pro侧重静态分析，Hex Workshop用于十六进制编辑，均不符合需求。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912326", "t": 1, "q": "某网络安全设备能够监控网络流量，识别并阻断已知的攻击特征（如特定的端口扫描、SQL注入语句），但无法识别未知攻击，该设备最可能是？", "a": ["防火墙（包过滤型）", "入侵检测系统（IDS）", "下一代防火墙（NGFW）", "入侵防御系统（IPS）", "", ""], "r": "D", "e": "入侵防御系统（IPS）可监测网络流量，识别并阻断已知攻击特征，但对未知攻击识别能力有限。包过滤型防火墙主要基于规则对数据包过滤；入侵检测系统主要是检测异常，一般不主动阻断；下一代防火墙功能更综合，有一定未知威胁防护能力。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912327", "t": 1, "q": "某网络安全事件响应过程中，分析人员首先收集攻击相关的日志（如防火墙日志、服务器日志）、网络流量数据，然后分析攻击路径和攻击手段，该阶段属于事件响应的哪个环节？", "a": ["检测阶段", "恢复阶段", "分析阶段", "准备阶段", "", ""], "r": "C", "e": "收集攻击相关日志和流量数据，分析攻击路径和手段，这是在对安全事件进行深入剖析，属于分析阶段的工作内容。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912328", "t": 1, "q": "某网络攻击通过发送大量ICMP Echo Request报文（ping包）到目标主机，导致目标主机资源耗尽，该攻击属于？", "a": ["Ping of Death攻击", "Smurf攻击", "Ping Flood攻击", "Teardrop攻击", "", ""], "r": "C", "e": "Ping Flood攻击是通过发送大量ICMP Echo Request报文使目标主机资源耗尽。Ping of Death是发送超长ICMP包；Smurf攻击是利用广播地址发送大量请求；Teardrop攻击是利用IP数据包分段漏洞。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912329", "t": 1, "q": "某网络攻击通过伪造ARP响应报文，将目标主机的网关IP对应的MAC地址修改为攻击者主机的MAC地址，导致目标主机的网关流量被劫持，该攻击属于？", "a": ["DNS欺骗攻击", "ICMP重定向攻击", "IP欺骗攻击", "ARP欺骗攻击", "", ""], "r": "D", "e": "题目描述的是伪造ARP响应报文修改目标主机网关IP对应的MAC地址来劫持流量，这正是ARP欺骗攻击的手段。答案选D，而A是DNS相关欺骗，B是ICMP重定向方面的，C是IP层面欺骗，均不符合题意。 答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912330", "t": 1, "q": "某网络协议在传输层提供面向连接的可靠服务，但该协议本身不具备身份认证和数据加密功能，需依赖上层协议（如TLS）实现安全防护，该协议是？", "a": ["UDP", "IP", "ICMP", "TCP", "", ""], "r": "D", "e": "UDP 是无连接不可靠服务，IP 是网络层协议，ICMP 用于网络层差错和控制，只有 TCP 在传输层提供面向连接的可靠服务，且本身无身份认证和加密功能，依赖上层协议实现安全防护。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912331", "t": 1, "q": "逆向工程中，\"动态调试\"的关键特点是？", "a": ["仅能分析程序的静态结构，无法获取运行时数据", "主要依赖反汇编工具，与调试器无关", "无需运行目标程序，直接分析二进制文件", "通过设置断点、查看寄存器与内存，实时跟踪程序执行流程", "", ""], "r": "D", "e": "动态调试需运行目标程序，主要通过设置断点、查看寄存器和内存等方式，实时跟踪程序执行流程。A选项中动态调试能获取运行时数据；B选项动态调试依赖调试器；C选项不运行程序直接分析二进制文件是静态分析。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912332", "t": 1, "q": "逆向工程中，\"动态调试\"与\"静态分析\"的主要区别是？", "a": ["动态调试仅能查看汇编代码，静态分析仅能查看高级语言代码", "动态调试无需工具支持，静态分析需要工具支持", "动态调试需运行程序，静态分析无需运行程序", "动态调试仅能分析Windows程序，静态分析仅能分析Linux程序", "", ""], "r": "C", "e": "动态调试是在程序运行状态下进行分析，静态分析则不运行程序直接分析代码等。A项动态和静态分析都可查看多种代码形式；B项两者通常都需工具支持；D项两种方法不限于特定系统程序。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912333", "t": 1, "q": "逆向工程中，\"反编译\"操作的结果是？", "a": ["将二进制文件转换为十六进制数据", "将二进制文件转换为汇编代码", "将高级语言代码转换为二进制文件", "将汇编代码转换为接近高级语言的代码（如C语言伪代码）", "", ""], "r": "D", "e": "反编译是把已编译好的二进制文件还原成高级语言代码形式，通常是得到接近高级语言的代码。A选项转换为十六进制数据不是反编译结果；B是反汇编结果；C是编译的过程。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912334", "t": 1, "q": "逆向工程中，\"反混淆\"技术的主要目的是？", "a": ["将混淆后的代码还原为清晰、易于理解的结构，便于分析", "对代码进行加密，防止被逆向", "提高混淆后代码的运行效率", "删除代码中的冗余指令，减小程序体积", "", ""], "r": "A", "e": "反混淆就是把混淆后的代码变回清晰、易理解的样子，方便后续分析。B选项加密是正向保护，不是反混淆目的；C选项反混淆不针对运行效率；D选项删除冗余指令和反混淆无关。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912335", "t": 1, "q": "逆向工程中，“脱壳”操作的主要目的是？", "a": ["去除二进制文件中的加壳保护，还原原始可执行文件", "将汇编代码转换为高级语言代码", "调试运行中的程序，查看寄存器状态", "对二进制文件进行加密，防止被逆向", "", ""], "r": "A", "e": "脱壳就是去除二进制文件加壳保护来还原原始可执行文件。B是反编译；C是调试操作；D与脱壳目的相反。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912336", "t": 1, "q": "逆向工程中，\"脱壳\"技术的主要目的是？", "a": ["去除程序的保护壳（如压缩壳、加密壳），获取原始可执行文件", "将高级语言代码转换为汇编代码", "分析程序的内存分配情况", "向程序中插入调试代码", "", ""], "r": "A", "e": "脱壳就是去掉程序的保护壳以得到原始可执行文件。B是反编译相关；C是内存分析；D是调试操作。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912337", "t": 1, "q": "逆向工程中，分析固件（Firmware）时，通常首先需要进行的操作是？", "a": ["直接运行固件查看功能", "对固件进行加密保护", "将固件转换为汇编代码", "对固件进行解包，提取其中的可执行文件和配置文件", "", ""], "r": "D", "e": "逆向工程分析固件，首先要获取固件里的内容，所以需先对固件解包，提取可执行文件和配置文件，才能进一步分析。而直接运行、加密保护、转换汇编代码都不是首要操作。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912338", "t": 1, "q": "逆向工程中，分析人员不运行目标程序，仅通过查看程序的二进制文件、反汇编代码来理解程序功能，这种逆向方式被称为？", "a": ["调试逆向分析", "动态逆向分析", "动态插桩分析", "静态逆向分析", "", ""], "r": "D", "e": "不运行程序，通过查看二进制文件、反汇编代码等方式理解程序功能属于静态逆向分析。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912339", "t": 1, "q": "逆向工程中，分析人员通过向目标程序中插入额外代码（如日志打印代码），观察程序运行时的数据流和控制流，这种技术被称为？", "a": ["静态插桩", "反汇编", "动态插桩", "反编译", "", ""], "r": "C", "e": "动态插桩是在程序运行时插入额外代码来观察运行时的数据流和控制流；静态插桩是在程序编译前插入代码；反汇编是把机器语言转换为汇编语言；反编译是把可执行文件转换为高级语言。本题是在程序运行时插入代码，所以是动态插桩。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912340", "t": 1, "q": "逆向工程中，分析Android应用程序（APK文件）时，首先需要进行的操作是？", "a": ["将APK文件转换为Windows可执行文件", "直接运行APK文件", "对APK文件进行签名", "对APK文件进行解压缩，提取其中的DEX文件", "", ""], "r": "D", "e": "逆向分析Android应用程序（APK文件），第一步通常是解压缩APK文件并提取DEX文件，因为DEX文件包含应用的核心代码等关键信息。A选项APK不能直接转成Windows可执行文件；B选项直接运行对逆向分析没有帮助；C选项签名不是逆向分析的首要操作。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912341", "t": 1, "q": "逆向工程中，分析Android应用的逆向工具不包括下列哪项？", "a": ["Apktool", "IDA Pro", "WinDbg", "Jadx", "", ""], "r": "C", "e": "Apktool、Jadx是常见的Android逆向工具，IDA Pro也可用于Android逆向分析，而WinDbg主要用于Windows系统下的调试，并非Android应用逆向工具。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912342", "t": 1, "q": "逆向工程中，将汇编代码转换为接近高级语言的代码（如C语言），这种技术被称为？", "a": ["动态调试", "静态分析", "反编译", "反汇编", "", ""], "r": "C", "e": "反编译就是把已编译好的程序代码还原成接近高级语言代码的过程，符合将汇编代码转换为接近高级语言代码的描述。动态调试是在程序运行时进行调试；静态分析是不运行程序进行分析；反汇编是把机器码转换为汇编代码。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912343", "t": 1, "q": "逆向工程中，若目标程序加壳（Packing），其主要目的是？", "a": ["提高程序运行效率", "减小程序体积，方便传输", "使程序兼容更多操作系统", "保护程序代码，防止被静态反汇编分析", "", ""], "r": "D", "e": "加壳是一种保护程序代码的技术，通过对程序进行加密和变形等操作，增加静态反汇编分析的难度，从而保护程序代码不被轻易破解。而加壳一般不会提高运行效率，也不是为了减小体积方便传输或让程序兼容更多系统。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912344", "t": 1, "q": "逆向工程中，若需要分析目标程序运行时对注册表、文件系统的操作，下列工具中最适合的是？", "a": ["IDA Pro", "GDB", "Process Monitor", "Wireshark", "", ""], "r": "C", "e": "Process Monitor可监控进程和线程活动，能详细记录对注册表、文件系统等操作。IDA Pro主要用于静态反汇编分析；GDB是调试器；Wireshark用于网络数据包捕获分析。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912345", "t": 1, "q": "逆向工程中，若需要在不运行目标程序的情况下，分析其二进制文件的指令结构、函数调用关系，这种分析方式属于？", "a": ["行为监控", "静态反汇编", "内存dump分析", "动态调试", "", ""], "r": "B", "e": "不运行目标程序分析二进制文件指令结构和函数调用关系是静态反汇编的特点。行为监控要监控程序运行行为；内存dump分析针对内存数据；动态调试需运行程序。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912346", "t": 1, "q": "逆向工程中，下列工具中主要用于静态反汇编二进制文件，查看其汇编指令与函数结构的是？", "a": ["Process Monitor", "IDA Pro", "GDB", "Wireshark", "", ""], "r": "B", "e": "IDA Pro是专业反汇编工具，可静态反汇编二进制文件查看汇编指令和函数结构；Process Monitor用于监控系统进程和线程活动；GDB是调试工具，可动态调试；Wireshark用于网络数据包捕获和分析。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912347", "t": 1, "q": "逆向工程中，下列哪种工具主要用于对二进制文件进行静态分析，可查看汇编代码、函数结构并生成程序流程图？", "a": ["IDA Pro", "x64dbg", "GDB", "Wireshark", "", ""], "r": "A", "e": "IDA Pro 是强大的静态分析工具，能查看二进制文件汇编代码、函数结构并生成流程图；x64dbg 和 GDB 主要用于动态调试；Wireshark 是网络数据包分析工具。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912348", "t": 1, "q": "逆向工程中，以下哪种技术不属于\"反调试技术\"？", "a": ["检测调试端口（如检测23946端口）", "使用反汇编工具查看程序汇编代码", "检测调试器进程（如检测WinDbg进程）", "通过时间差检测调试（如判断代码执行时间是否异常）", "", ""], "r": "B", "e": "反调试技术是用于阻止或干扰调试器对程序进行调试的手段。A、C、D选项都是常见的检测调试行为的反调试技术，而使用反汇编工具查看程序汇编代码是正常的逆向分析操作，并非反调试技术。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912349", "t": 1, "q": "逆向工程中，用于将二进制文件转换为汇编代码，且支持多平台、可进行交互式分析的工具是？", "a": ["IDA Pro", "OllyDbg", "Ghidra", "WinDbg", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912350", "t": 1, "q": "逆向工程中，针对\"代码混淆\"技术的分析，主要目的是？", "a": ["将代码编译为二进制文件", "对代码进行再次混淆，增强保护", "检测代码中的语法错误", "将混淆后的代码还原为清晰的逻辑结构，便于理解程序功能", "", ""], "r": "D", "e": "逆向工程分析代码混淆是为了解开混淆，让代码逻辑清晰以便理解程序功能。A是正向编译操作；B与逆向工程目的相悖；C检测语法错误不是针对代码混淆分析的主要目的。所以选D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912351", "t": 1, "q": "网络安全中，\"入侵检测系统（IDS）\"与\"入侵防御系统（IPS）\"的主要区别是？", "a": ["IDS部署在网络边界，IPS部署在网络内部", "IDS对网络性能无影响，IPS会严重影响性能", "IDS仅检测攻击，IPS可主动阻断攻击", "IDS基于签名检测，IPS基于异常检测", "", ""], "r": "C", "e": "IDS主要功能是检测入侵行为，发现攻击后给出报警；IPS不仅能检测，还能主动阻断攻击。A选项，二者部署位置不固定；B选项，IPS虽有影响但不一定严重；D选项，二者都有多种检测方式。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912352", "t": 1, "q": "网络安全中的\"访问控制模型\"中，基于主体所属角色分配权限的模型是？", "a": ["ABAC（基于属性的访问控制）", "DAC（自主访问控制）", "MAC（强制访问控制）", "RBAC（基于角色的访问控制）", "", ""], "r": "D", "e": "从名称可知，基于角色分配权限的就是基于角色的访问控制。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912353", "t": 1, "q": "网络安全中的\"零信任架构\"，其核心理念是？", "a": ["仅通过防火墙实现边界防护，内部网络无需安全控制", "信任所有已认证的用户，无需后续权限检查", "仅信任内部网络设备，不信任外部网络设备", "默认不信任任何主体（内部或外部），需持续验证身份与权限", "", ""], "r": "D", "e": "“零信任架构”强调不预设信任，不管是内部还是外部主体都要持续验证身份和权限。A选项仅靠防火墙、内部无安全控制不符合；B选项信任已认证用户且无后续检查错误；C选项区分内外信任也违背零信任理念。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912354", "t": 1, "q": "网络安全中的\"漏洞扫描\"工具，其核心工作原理是？", "a": ["分析程序二进制文件，寻找潜在的代码缺陷", "监控网络流量，检测异常攻击行为", "模拟攻击者，向目标发送特定请求，检测是否存在已知漏洞", "备份目标系统数据，防止漏洞被利用导致数据丢失", "", ""], "r": "C", "e": "漏洞扫描工具主要是模拟攻击者行为，通过向目标发送特定请求，依据已知漏洞特征来检测目标是否存在相应漏洞。A是代码审计工作；B是入侵检测系统功能；D是数据备份作用。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912355", "t": 1, "q": "网络安全中的\"数据备份与恢复\"，其主要作用是应对哪种安全事件？", "a": ["数据损坏或丢失（如勒索病毒加密）", "数据泄露", "拒绝服务攻击", "中间人攻击", "", ""], "r": "A", "e": "数据备份与恢复主要就是为了在数据出现损坏、丢失等情况时能将数据还原，勒索病毒加密导致数据无法正常使用就属于此类。而数据泄露、拒绝服务攻击、中间人攻击并非数据备份与恢复主要应对的。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912356", "t": 1, "q": "网络安全中的\"威胁建模\"过程，其首要步骤是？", "a": ["评估威胁发生的概率", "检测已发生的安全事件", "识别系统资产与边界", "制定风险缓解措施", "", ""], "r": "C", "e": "威胁建模首要的是确定要保护的对象和范围，也就是识别系统资产与边界。评估概率是后续步骤；检测已发生安全事件不属于威胁建模首要步骤；制定缓解措施也是在识别资产等基础上进行。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912357", "t": 1, "q": "下列关于密码学中\"对称加密算法\"的说法，错误的是？", "a": ["AES是典型的对称加密算法，密钥长度可选择128位、192位或256位", "对称加密算法的加密速度通常快于非对称加密算法", "对称加密算法可以独立实现数字签名功能", "对称加密算法加密与解密使用相同密钥", "", ""], "r": "C", "e": "数字签名需能保证不可否认性等，对称加密算法加密和解密用相同密钥，无法实现像非对称加密那样的数字签名功能。A选项AES密钥长度确实有多种选择；B选项对称加密速度一般比非对称快；D选项是对称加密基本特点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912358", "t": 1, "q": "下列关于逆向工程应用的说法，正确的是？", "a": ["逆向工程违反所有软件许可协议", "逆向工程无法分析编译后的二进制文件", "逆向工程仅用于恶意破解软件版权", "逆向工程可用于软件漏洞分析与补丁开发", "", ""], "r": "D", "e": "逆向工程是把已有的产品进行反向分析来获取信息，可用于软件漏洞分析与补丁开发等正向用途。A选项，并非违反所有软件许可协议；B选项，逆向工程能分析编译后的二进制文件；C选项，逆向工程不只是用于恶意破解。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912359", "t": 1, "q": "下列关于HTTPS协议的说法，错误的是？", "a": ["HTTPS基于SSL/TLS协议实现加密", "HTTPS可防止传输层数据被窃听和篡改", "HTTPS使用对称加密算法对所有数据进行加密，非对称加密仅用于密钥交换", "HTTPS的证书由CA机构颁发，用于验证服务器身份", "", ""], "r": "C", "e": "HTTPS在传输数据时，对称加密和非对称加密结合使用，并非只用对称加密对所有数据加密，非对称加密不仅用于密钥交换，也有其他作用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912360", "t": 1, "q": "下列密码算法中，属于非对称加密算法且被广泛用于数字签名和密钥交换的是？", "a": ["DES", "SHA-256", "RSA", "AES-256", "", ""], "r": "C", "e": "DES和AES - 256是对称加密算法，SHA - 256是哈希算法，RSA是非对称加密算法，常用于数字签名和密钥交换。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912361", "t": 1, "q": "下列密码学技术中，可用于实现\"数字签名\"功能，确保消息不可否认性的是？", "a": ["流密码算法", "对称加密算法", "哈希函数+非对称加密算法", "消息认证码（MAC）", "", ""], "r": "C", "e": "数字签名要保证不可否认性等，需结合哈希函数生成消息摘要，再用非对称加密算法中私钥加密摘要。流密码、对称加密、消息认证码无法很好实现不可否认性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912362", "t": 1, "q": "下列密码学算法中，属于非对称加密算法且常用于数字签名场景的是？", "a": ["AES", "RSA", "DES", "SHA-256", "", ""], "r": "B", "e": "AES和DES是对称加密算法；SHA - 256是哈希算法；RSA是非对称加密算法，常用于数字签名。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912363", "t": 1, "q": "下列密码学算法中，属于哈希函数且输出长度为256位的是？", "a": ["RSA", "SHA-1", "SHA-256", "MD5", "", ""], "r": "C", "e": "RSA是非对称加密算法；SHA - 1输出160位；MD5输出128位；SHA - 256是哈希函数且输出256位。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813919561912364", "t": 1, "q": "下列哪种安全机制属于\"网络层安全协议\"，可在IP数据包基础上提供身份认证、数据加密和完整性保护？", "a": ["HTTPS", "SSH", "IPsec", "SSL/TLS", "", ""], "r": "C", "e": "IPsec是网络层安全协议，能在IP数据包基础上提供身份认证、加密和完整性保护；HTTPS基于HTTP，是应用层协议；SSH是应用层安全协议；SSL/TLS是传输层安全协议。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990336", "t": 2, "q": "密码学中，\"量子计算\"对现有密码体系的威胁包括哪些？", "a": ["量子计算可快速破解RSA等基于大数分解的非对称加密算法", "量子计算可破解所有基于哈希函数的完整性验证技术", "量子计算可快速破解ECC等基于椭圆曲线离散对数的非对称加密算法", "量子计算对对称加密算法（如AES）无任何威胁", "", ""], "r": "AC", "e": "量子计算能力强大，能快速破解基于大数分解的RSA和基于椭圆曲线离散对数的ECC等非对称加密算法，但并非能破解所有基于哈希函数的验证技术，对对称加密算法也有一定威胁。答案为AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990337", "t": 2, "q": "密码学中，“流密码”与“分组密码”的区别包括哪些？", "a": ["流密码的密钥长度固定，分组密码的密钥长度可动态调整", "流密码通常需要同步机制，分组密码无需同步", "流密码对数据流逐位或逐字节加密，分组密码对固定长度数据块加密", "流密码的加密速度通常快于分组密码", "", ""], "r": "BCD", "e": "A 错误：密钥长度是算法定义的，流密码、分组密码都可有多种密钥长度，流密码密钥并非固定。<br />B 正确：流密码依靠密钥流，收发两端需要同步；分组密码按块独立加密，不需要同步。<br />C 正确：流密码逐位 / 逐字节处理；分组密码把数据切分为固定长度分组再加密。<br />D 正确：流密码运算简单，一般加密速度快于分组密码。", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990338", "t": 2, "q": "密码学中，\"密钥交换协议\"的作用包括哪些？", "a": ["防止密钥在传输过程中被窃听或篡改", "验证通信双方的身份", "加密传输大量的业务数据", "在不安全的网络中，安全地交换对称加密的密钥", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990339", "t": 2, "q": "密码学中，可用于实现\"数据完整性验证\"的技术有哪些？", "a": ["消息认证码（MAC）", "哈希函数（如SHA-256）", "对称加密算法（如AES）", "数字签名", "", ""], "r": "ABD", "e": "消息认证码、哈希函数、数字签名都可用于验证数据完整性，对称加密算法主要用于数据加密，不是专门验证完整性。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990340", "t": 2, "q": "密码学中，属于非对称加密算法的有哪些？", "a": ["DES", "RSA", "ECC（椭圆曲线密码）", "AES", "", ""], "r": "BC", "e": "DES、AES是对称加密算法，RSA和ECC是非对称加密算法。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990341", "t": 2, "q": "逆向工程中，\"代码混淆\"技术通常包括下列哪些方法，以阻碍逆向分析？（　）", "a": ["变量名和函数名替换为无意义字符", "对代码进行加密，运行时动态解密", "代码控制流扁平化（打乱逻辑结构）", "将汇编代码转换为高级语言代码", "", ""], "r": "ABC", "e": "代码混淆是为阻碍逆向分析，A用无意义字符替换变量和函数名、B对代码加密运行时解密、C打乱代码逻辑结构都能增加逆向分析难度；D将汇编转高级语言代码是逆向过程，不是混淆方法。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990342", "t": 2, "q": "逆向工程中，\"动态调试\"过程中常用的调试技术有哪些？", "a": ["反汇编代码查看（不运行程序，查看汇编代码）", "函数调用栈跟踪（查看程序的函数调用关系）", "内存查看（查看程序运行时的内存数据）", "寄存器查看（查看CPU寄存器的值）", "", ""], "r": "BCD", "e": "动态调试是在程序运行状态下进行调试。A选项反汇编代码查看是不运行程序时查看汇编代码，不属于动态调试技术。而函数调用栈跟踪、内存查看、寄存器查看都是在程序运行过程中可进行的调试操作。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990343", "t": 2, "q": "逆向工程中，\"动态调试\"技术的作用包括下列哪些？（　）", "a": ["无需运行程序，直接分析二进制文件结构", "跟踪程序的执行流程，查看指令执行顺序", "修复程序中的语法错误", "在特定代码位置设置断点，暂停程序执行", "", ""], "r": "BD", "e": "动态调试需运行程序，A选项说无需运行程序错误；动态调试主要是分析程序运行情况，不能修复语法错误，C选项错误。动态调试可跟踪程序执行流程、设置断点暂停程序执行，BD正确。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990344", "t": 2, "q": "逆向工程中，\"反编译\"技术面临的挑战有哪些？", "a": ["反编译仅支持C语言，不支持其他高级语言", "反编译后的代码可能丢失注释和变量名，可读性差", "部分二进制文件经过混淆处理，反编译难度极大", "不同编译器生成的二进制文件，反编译效果差异大", "", ""], "r": "BCD", "e": "A选项错误，反编译并非仅支持C语言，也支持其他高级语言；B选项，反编译后代码会丢失注释和变量名，影响可读性；C选项，二进制文件混淆处理会增加反编译难度；D选项，不同编译器生成的二进制文件反编译效果有差异。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990345", "t": 2, "q": "逆向工程中，\"反调试技术\"的主要目的有哪些？", "a": ["优化程序的内存占用", "保护程序不被逆向分析", "加快程序的运行速度", "检测程序是否处于调试状态", "", ""], "r": "BD", "e": "反调试技术是防止程序被逆向分析的手段，其核心就是检测程序是否处于调试状态，若检测到就采取措施防止逆向。A选项优化内存占用和C选项加快运行速度与反调试目的无关。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990346", "t": 2, "q": "逆向工程中，\"静态分析\"常用的工具和技术有哪些？", "a": ["动态调试器（如WinDbg）", "反汇编工具（如IDA Pro）", "反编译工具（如Hex-Rays Decompiler）", "动态插桩工具（如Frida）", "", ""], "r": "BC", "e": "静态分析是在不运行程序的情况下进行分析。选项A动态调试器和D动态插桩工具都是在程序运行时操作，属于动态分析。而B反汇编工具和C反编译工具可在不运行程序时将代码转换为便于阅读分析的形式，用于静态分析。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990347", "t": 2, "q": "逆向工程中，“静态分析”的局限性包括哪些？", "a": ["无法获取程序的函数调用关系", "无法处理加壳或混淆后的二进制文件", "无法检测程序中的动态调试漏洞", "无法分析程序与外部系统的交互（如网络请求、文件操作）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990348", "t": 2, "q": "逆向工程中，\"控制流混淆\"是软件混淆的常用技术，其目的包括哪些？", "a": ["隐藏程序的真实逻辑（如条件判断、循环）", "防止静态反汇编工具识别程序的函数调用关系", "打乱程序原有的控制流结构，增加逆向分析难度", "提高程序的运行效率", "", ""], "r": "ABC", "e": "控制流混淆是为了增加逆向分析难度，隐藏程序真实逻辑。A隐藏真实逻辑、B防止识别函数调用关系、C打乱控制流结构增加难度都符合其目的；而它不会提高程序运行效率，反而可能因增加复杂结构而降低效率。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990349", "t": 2, "q": "逆向工程中，\"脱壳\"过程中可能遇到的\"壳\"的类型有哪些？", "a": ["压缩壳（如UPX）", "虚拟机壳（如VMProtect）", "加密壳（如ASPack）", "加壳工具（如Themida）", "", ""], "r": "ABC", "e": "脱壳时会遇到不同类型的壳，压缩壳可压缩程序体积，虚拟机壳用虚拟机技术保护程序，加密壳对程序代码加密，加壳工具是制作壳的软件，本身不是壳类型。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990350", "t": 2, "q": "逆向工程中，\"虚拟机保护（VMProtect）\"的核心原理有哪些？", "a": ["将目标程序的核心代码转换为自定义的虚拟机指令（字节码）", "运行时通过自定义虚拟机解释执行虚拟机指令，而非直接执行机器码", "通过混淆虚拟机指令逻辑，增加逆向难度", "虚拟机指令与机器码一一对应，易于逆向", "", ""], "r": "ABC", "e": "VMProtect核心是把核心代码转成自定义字节码，运行时用自定义虚拟机解释执行，还会混淆指令逻辑加大逆向难度，而不是让虚拟机指令与机器码一一对应便于逆向。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990351", "t": 2, "q": "逆向工程中，常用的\"动态分析工具\"有哪些？", "a": ["Ghidra", "WinDbg", "IDA Pro", "x64dbg", "", ""], "r": "BD", "e": "动态分析是在程序运行时进行分析。WinDbg和x64dbg是典型的动态调试分析工具。Ghidra和IDA Pro主要用于静态分析。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990352", "t": 2, "q": "逆向工程中，常用的反汇编工具或技术有哪些？", "a": ["动态调试", "静态反汇编", "Ghidra", "IDA Pro", "", ""], "r": "BCD", "e": "静态反汇编是基本反汇编技术，Ghidra和IDA Pro是知名反汇编工具，动态调试主要是在程序运行时调试分析，并非典型反汇编工具或技术。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990353", "t": 2, "q": "逆向工程中，分析二进制文件时，可能遇到的\"反调试\"技术包括哪些？", "a": ["使用时间戳对比，检测调试导致的程序执行延迟", "检测调试器进程（如检测GDB、WinDbg）", "检测程序运行时的调试端口", "设置断点，跟踪调试器的操作", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990354", "t": 2, "q": "逆向工程中，分析固件（Firmware）时，下列哪些工具可用于固件解包，提取其中的文件系统和可执行文件？（　）", "a": ["x64dbg", "Firmadyne", "Extract-xiso", "IDA Pro", "", ""], "r": "BC", "e": "答案：BC。答案选项A和D是调试器和反汇编器，不用于固件解包。", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990355", "t": 2, "q": "逆向工程中，分析Windows PE文件常用的工具或技术有哪些？", "a": ["IDA Pro", "PEview", "Ghidra", "WinDbg", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990356", "t": 2, "q": "逆向工程中，分析Windows可执行文件（EXE文件）时，下列哪些信息可通过静态分析获取？（　）", "a": ["程序的节表（Section Table），了解程序的内存分区（如.text、.data）", "程序的字符串常量（如错误提示、路径）", "程序的导入表（Import Table），了解程序调用的系统函数", "程序运行时的寄存器值", "", ""], "r": "ABC", "e": "静态分析是不运行程序进行的分析。A选项节表是文件固定结构可静态获取；B选项字符串常量存在于文件中可静态提取；C选项导入表也是文件的一部分能静态分析得到。而D选项程序运行时的寄存器值需在程序运行时动态获取，不能通过静态分析得到。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990357", "t": 2, "q": "逆向工程中，属于动态分析技术的有哪些？", "a": ["使用内存dump工具获取程序运行时的内存数据", "使用Process Monitor监控程序的文件操作", "使用Wireshark捕获程序运行时的网络流量", "使用IDA Pro对二进制文件进行反汇编", "", ""], "r": "ABC", "e": "动态分析是在程序运行状态下进行分析。A获取运行时内存数据、B监控运行时文件操作、C捕获运行时网络流量，都是在程序运行时开展的动态分析。而D用IDA Pro反汇编二进制文件是静态分析，不依赖程序运行。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990358", "t": 2, "q": "逆向工程中，下列哪些工具可用于对Android应用的DEX文件进行反编译，生成Java伪代码？（　）", "a": ["JD-GUI", "Binwalk", "IDA Pro（带DEX插件）", "dex2jar", "", ""], "r": "CD", "e": "dex2jar可将DEX文件转换为JAR文件，再结合JD - GUI等工具可生成Java伪代码；IDA Pro（带DEX插件）也能对DEX文件反编译生成Java伪代码。Binwalk主要用于分析固件等文件结构，并非反编译DEX生成Java伪代码。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990359", "t": 2, "q": "逆向工程中，下列哪些技术可用于对抗\"代码混淆\"，还原程序的原始逻辑？（　）", "a": ["动态调试跟踪程序执行，绕过混淆代码", "垃圾代码清除，删除无意义的混淆代码", "对程序进行再次混淆", "字符串解密，还原被加密的字符串常量", "", ""], "r": "ABD", "e": "代码混淆是为增加逆向分析难度，A动态调试绕过、B清除垃圾代码、D字符串解密都有助于还原原始逻辑；而C再次混淆会让程序更复杂，不能对抗代码混淆。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990360", "t": 2, "q": "逆向工程中，下列哪些属于\"动态分析技术\"的应用场景？（　）", "a": ["分析程序解密内存中加密代码的过程", "分析程序运行时加载的动态链接库（DLL）", "从静态文件中提取程序中的字符串常量", "查看程序在调试器中的汇编代码执行过程", "", ""], "r": "ABD", "e": "动态分析技术是在程序运行状态下进行分析。A分析解密过程、B分析运行时加载的DLL、D查看调试器中汇编代码执行过程都是在程序运行时操作；而C从静态文件中提取字符串常量是静态分析。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990361", "t": 2, "q": "逆向工程中，针对软件加壳技术的反制手段包括哪些？", "a": ["使用加壳工具对目标程序再次加壳", "静态分析壳的加密算法，直接解密二进制文件", "动态脱壳（通过调试获取内存中脱壳后的代码）", "通过内存dump获取脱壳后的程序镜像", "", ""], "r": "CD", "e": "答案：CD。1. 关于选项A 使用加壳工具对目标程序再次加壳并不能作为针对软件加壳技术的反制手段。加壳的目的是对原程序进行加密保护等操作，再次加壳并不能突破原加壳的限制来达到反制目的。2. 关于选项B 直接静态分析壳的加密算法并解密二进制文件是非常困难的。加壳算法往往比较复杂，并且可能存在多种反分析技术，如代码混淆等，所以这不是常规有效的反制手段。3. 关于选项C 动态脱壳是有效的反制手段之一。通过在调试环境下运行程序，在程序运行过程中（例如在壳执行脱壳操作将真实代码加载到内存后），获取内存中脱壳后的代码进行分析。4. 关于选项D 通过内存dump获取脱壳后的程序镜像也是一种可行的方法。当程序在内存中运行并完成脱壳后，将此时内存中的程序镜像dump出来就可以得到未加壳的可分析的程序代码。", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990362", "t": 2, "q": "网络安全中，“安全审计”的核心目的包括哪些？", "a": ["验证安全策略的执行效果", "记录用户的操作行为，便于事后追溯安全事件", "替代防火墙等边界防护设备", "分析安全事件的原因与影响范围", "", ""], "r": "ABD", "e": "安全审计可查看策略执行情况，记录用户操作助于追溯，还能分析安全事件，它不能替代防火墙等边界防护设备。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990363", "t": 2, "q": "网络安全中，\"恶意代码\"的传播途径包括哪些？", "a": ["合法软件的漏洞（如缓冲区溢出漏洞被利用植入恶意代码）", "移动存储设备（如U盘）", "加密传输的HTTPS流量", "恶意网页（如包含漏洞利用代码的网页）", "", ""], "r": "ABD", "e": "合法软件漏洞可被利用植入恶意代码，移动存储设备易携带恶意代码传播，恶意网页含漏洞利用代码能传播恶意代码；而加密传输的HTTPS流量有安全保障，不易传播恶意代码。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990364", "t": 2, "q": "网络安全中，\"访问控制列表（ACL）\"的作用包括哪些？", "a": ["实现数据的加密传输", "过滤特定协议类型的数据包（如TCP、UDP）", "限制特定IP地址对网络资源的访问", "禁止特定端口的流量通过网络设备", "", ""], "r": "BCD", "e": "访问控制列表主要用于对网络流量进行过滤和访问限制，可按协议类型、IP地址、端口等过滤数据包。数据加密传输不是ACL作用。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990365", "t": 2, "q": "网络安全中，\"入侵检测系统（IDS）\"的检测方法包括哪些？", "a": ["流量清洗（基于过滤异常流量）", "主动阻断（基于攻击行为实时拦截）", "启发式检测（基于规则与算法推断攻击）", "异常检测（基于正常行为基线）", "", ""], "r": "CD", "e": "流量清洗是应对DDoS攻击的一种手段，不是IDS检测方法；主动阻断是防护动作而非检测方法；IDS检测方法有启发式检测，基于规则与算法推断攻击，还有异常检测，基于正常行为基线发现异常。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990366", "t": 2, "q": "网络安全中，“数据备份”的关键要素包括哪些？", "a": ["备份数据的完整性（确保备份数据可恢复）", "备份数据的加密（保护备份中的敏感信息）", "备份恢复的可测试性（定期验证恢复效果）", "备份介质的安全性（防止备份介质泄露或损坏）", "", ""], "r": "ABCD", "e": "数据备份关键要保证数据完整以便恢复，对敏感信息加密保护，定期测试恢复效果，同时保障备份介质安全。ABCD选项都涵盖了数据备份的重要方面。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990367", "t": 2, "q": "网络安全中，“数据脱敏”技术的应用场景包括哪些？", "a": ["生产数据用于测试环境时，隐藏敏感信息（如身份证号）", "数据共享给第三方时，替换敏感字段（如手机号）", "加密传输数据时，对数据进行对称加密", "备份数据时，压缩数据体积以节省空间", "", ""], "r": "AB", "e": "数据脱敏是对敏感数据进行变形处理以保护隐私，A隐藏敏感信息、B替换敏感字段符合数据脱敏应用场景；C是加密传输方式，D是备份时压缩数据，都不属于数据脱敏。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990368", "t": 2, "q": "网络协议安全中，可能被用于\"DDoS攻击\"的协议或技术有哪些？", "a": ["HTTP请求泛洪攻击", "UDP放大攻击（如NTP放大）", "IPsec协议的隧道模式", "DNS反射攻击", "", ""], "r": "ABD", "e": "HTTP请求泛洪、UDP放大、DNS反射都可用于DDoS攻击。IPsec隧道模式是用于建立安全通信隧道，并非用于DDoS攻击。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990369", "t": 2, "q": "网络协议安全中，属于\"应用层协议漏洞\"的有哪些？", "a": ["HTTP的SQL注入漏洞", "FTP的命令注入漏洞", "SSH的弱口令认证漏洞", "DNS的缓存投毒漏洞", "", ""], "r": "AB", "e": "应用层协议是为用户应用程序提供服务的协议层。HTTP是应用层协议，其SQL注入漏洞属于应用层协议漏洞；FTP也是应用层协议，命令注入漏洞属于应用层协议漏洞。SSH是应用层协议，但弱口令认证漏洞主要是安全配置方面问题。DNS虽为应用层协议，缓存投毒漏洞更多是基于域名解析机制的问题。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990370", "t": 2, "q": "网络协议安全中，HTTP/2协议相比HTTP/1.1，在安全方面的改进包括哪些？", "a": ["支持多路复用，减少连接建立次数，降低攻击面", "强制使用HTTPS加密传输", "内置对WebSocket的支持，无需额外协议", "减少明文传输的机会，降低数据泄露风险", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990371", "t": 2, "q": "下列关于密码学基本原理的说法，正确的有哪些？", "a": ["对称加密算法的密钥管理难度随用户数量增加而增大", "哈希函数具有单向性，即无法从哈希值反推原始数据", "非对称加密算法的加密速度通常慢于对称加密算法", "数字证书可用于验证公钥持有者的身份，防止公钥伪造", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990372", "t": 2, "q": "下列关于密码学中\"密钥管理\"的说法，正确的有哪些？", "a": ["密钥备份无需加密，直接存储即可", "密钥轮换可降低密钥长期使用的泄露风险", "对称加密的密钥需安全分发，防止传输中泄露", "非对称加密的私钥需妥善保管，不可公开", "", ""], "r": "BCD", "e": "密钥备份需加密存储，A错误；密钥轮换能降低长期使用同一密钥的泄露风险，B正确；对称加密密钥在分发时要确保安全防止传输中泄露，C正确；非对称加密私钥必须妥善保管不能公开，D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990373", "t": 2, "q": "下列关于密码学中\"数字签名\"的说法，正确的有哪些？", "a": ["数字签名需使用发送者的私钥对消息摘要进行加密", "数字签名可同时保证消息的机密性", "数字签名可验证消息的完整性，防止被篡改", "数字签名可实现消息的不可否认性，防止发送者抵赖", "", ""], "r": "ACD", "e": "数字签名用发送者私钥加密消息摘要，能验证消息完整性、实现不可否认性，但不保证消息机密性。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990374", "t": 2, "q": "下列关于网络安全\"纵深防御\"策略的说法，正确的有哪些？", "a": ["纵深防御需结合技术手段（如加密）与管理手段（如权限控制）", "即使边界防护被突破，内网或主机层防护仍可发挥作用", "纵深防御需在网络边界、内网、主机、应用等多层部署防护", "纵深防御的核心是\"一层防护失效，其他层仍能保障安全\"", "", ""], "r": "ABCD", "e": "纵深防御是综合运用多种手段在网络各层部署防护，结合技术与管理手段，当某一层防护被突破其他层仍可保障安全。ABCD选项都符合纵深防御策略特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990375", "t": 2, "q": "下列关于网络协议安全的说法，正确的有哪些？", "a": ["TCP协议的SYN Flood攻击利用了半连接状态的资源消耗漏洞", "FTP协议默认使用明文传输，存在用户名密码泄露风险", "IPsec协议可用于构建VPN，提供数据机密性与完整性保护", "DNS协议的缓存投毒攻击可导致用户访问伪造的域名服务器", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990376", "t": 2, "q": "下列哪些工具可用于网络协议分析与抓包，帮助检测网络协议安全问题？（　）", "a": ["Ethereal（Wireshark前身）", "x64dbg", "IDA Pro", "Tcpdump", "", ""], "r": "AD", "e": "A选项Ethereal是Wireshark前身，是知名抓包分析工具；D选项Tcpdump是Unix/Linux系统常用的抓包工具，二者可用于网络协议分析与抓包检测安全问题。B选项x64dbg是调试工具，C选项IDA Pro是反汇编工具，都与网络协议分析抓包无关。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990377", "t": 2, "q": "下列哪些攻击利用了网络协议的设计缺陷或实现漏洞，属于\"网络层攻击\"？（　）", "a": ["ARP欺骗攻击", "TCP会话劫持攻击", "ICMP洪水攻击", "HTTP洪水攻击", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990378", "t": 2, "q": "下列哪些攻击属于\"中间人攻击（MITM）\"，即攻击者插入通信双方之间，窃取或篡改数据？（　）", "a": ["DNS欺骗攻击", "ARP欺骗攻击", "SYN洪水攻击", "HTTPS证书伪造攻击", "", ""], "r": "ABD", "e": "DNS欺骗可篡改域名解析结果，让用户访问到攻击者控制的站点；ARP欺骗能伪造ARP信息，使通信数据流经攻击者；HTTPS证书伪造可使攻击者伪装成合法网站，这三种都可让攻击者插入通信双方窃取或篡改数据。而SYN洪水攻击是通过大量发送SYN包耗尽目标资源，并非中间人攻击。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813923038990379", "t": 2, "q": "下列哪些攻击属于\"Web应用层攻击\"，主要针对Web服务器和Web应用程序？（　）", "a": ["文件包含漏洞攻击", "ARP欺骗攻击", "SQL注入攻击", "跨站脚本（XSS）攻击", "", ""], "r": "ACD", "e": "文件包含漏洞攻击、SQL注入攻击、跨站脚本（XSS）攻击都针对Web服务器和应用程序，利用其漏洞实施；ARP欺骗攻击是在网络链路层，通过欺骗ARP协议来进行中间人攻击等，并非针对Web应用层。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907072", "t": 3, "q": "对称加密算法的密钥分发过程存在安全风险，通常需要借助非对称加密算法（如RSA）来安全传输对称密钥。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对称加密算法中，通信双方使用相同密钥，密钥分发时若被截获会造成安全问题。非对称加密有公钥和私钥，可利用其安全性来传输对称密钥。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907073", "t": 3, "q": "非对称加密算法的加密速度比对称加密算法快，因此更适合对大文件进行加密传输。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "非对称加密算法加密速度比对称加密算法慢，对称加密更适合对大文件加密传输。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907074", "t": 3, "q": "非对称加密算法中，私钥可公开传播，公钥需由持有者妥善保管，不可泄露。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "非对称加密算法中，公钥可公开传播，私钥需由持有者妥善保管，不可泄露，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907075", "t": 3, "q": "缓冲区溢出漏洞仅存在于C/C++等使用手动内存管理的语言编写的程序中，Java、Python等语言编写的程序不会存在该漏洞。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然Java、Python等语言有自动内存管理机制，但在调用有缓冲区溢出风险的本地代码（如JNI调用C代码）时，仍可能出现缓冲区溢出漏洞，并非绝对不会存在。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907076", "t": 3, "q": "缓冲区溢出漏洞利用时，攻击者仅需向缓冲区写入超出其容量的数据，即可直接获取系统权限，无需其他操作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "缓冲区溢出漏洞利用并非仅向缓冲区写入超容量数据就能直接获系统权限，还需精心构造恶意代码、利用程序漏洞等一系列操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907077", "t": 3, "q": "量子计算对AES等对称加密算法无任何威胁，即使量子计算机普及，AES算法仍可安全使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "量子计算会对AES等对称加密算法构成威胁，量子计算机强大的计算能力能大幅缩短破解对称加密算法所需时间，所以AES算法在量子计算机普及后安全性会受影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907078", "t": 3, "q": "零信任架构中，只要用户通过一次身份认证，后续所有访问请求均可直接通过，无需再次验证。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "零信任架构的核心原则是“默认不信任，始终要验证”，不会因用户通过一次身份认证，就让后续所有访问请求直接通过而不再验证。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907079", "t": 3, "q": "密码学中，对称加密算法（如AES）的加密和解密过程使用不同的密钥，因此需分别管理加密密钥和解密密钥。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "对称加密算法（如AES）的加密和解密使用相同的密钥，并非不同密钥，也无需分别管理。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907080", "t": 3, "q": "密码学中，对称加密算法的密钥只需在加密端和解密端安全存储，无需考虑密钥的分发过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "对称加密算法中，密钥分发是很关键的环节，因为加密端和解密端使用相同密钥，若密钥分发不安全，易被窃取导致信息泄露，所以题中说无需考虑密钥分发过程错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907081", "t": 3, "q": "密码学中，哈希函数的\"碰撞\"是指两个不同的原始数据生成相同的哈希值，SHA-256哈希函数不存在碰撞风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "哈希函数的“碰撞”定义正确，但理论上任何哈希函数都存在碰撞风险，SHA - 256 也不例外。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907082", "t": 3, "q": "密码学中，密钥轮换是指定期更换加密密钥，其目的是降低密钥长期使用导致的泄露风险，即使旧密钥泄露，影响范围也有限。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "密钥轮换就是定期换加密密钥，能减少密钥长期使用被破解的风险，就算旧密钥泄露，因已更换，影响范围可控。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907083", "t": 3, "q": "密码学中，数字签名的验证过程需使用发送者的私钥，若验证通过，则证明消息未被篡改且来自合法发送者。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字签名验证用的是发送者的公钥，不是私钥。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907084", "t": 3, "q": "密码学中，椭圆曲线密码（ECC）相比RSA，在相同安全级别下，ECC的密钥长度更短，加密速度更快。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在密码学里，椭圆曲线密码（ECC）和RSA对比，相同安全级别时，ECC密钥长度更短，且加密速度更快。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907085", "t": 3, "q": "密码学中，消息认证码（MAC）的生成仅需消息本身，无需密钥参与，因此任何人都可生成MAC验证消息完整性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "消息认证码（MAC）生成需消息和密钥，只有拥有正确密钥的人才能生成有效的MAC来验证消息完整性，并非无需密钥且任何人都能生成。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907086", "t": 3, "q": "密码学中，AES对称加密算法的块大小为128位，密钥长度可选择128位、192位或256位，不同密钥长度的加密流程不同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907087", "t": 3, "q": "密码学中，RSA非对称加密算法的密钥长度越大，其加密速度越慢，但安全性越高（在合理范围内）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在RSA非对称加密算法里，密钥长度增加会使加密过程的计算量大幅上升，导致加密速度变慢；同时，更长的密钥意味着更大的密钥空间，破解难度增加，安全性提高（在合理范围内）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907088", "t": 3, "q": "密码学中，SHA-1哈希函数的输出长度为160位，但其安全性已不足，目前推荐使用SHA-256等更安全的哈希函数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "SHA - 1输出长度160位，随着密码分析技术发展，其已被发现存在安全漏洞，安全性不足，现在推荐用SHA - 256等更安全的哈希函数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907089", "t": 3, "q": "密码学中的\"哈希函数\"具有可逆性，即通过一定的算法，可从哈希值反推得到原始输入数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "哈希函数是单向的，不具有可逆性，无法从哈希值反推得到原始输入数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907090", "t": 3, "q": "密码学中的\"密钥交换协议\"（如Diffie-Hellman协议）可在不安全的网络中，使通信双方协商出共享的对称密钥，且该过程无需传输对称密钥本身。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Diffie - Hellman协议等密钥交换协议能让通信双方在不安全网络中，通过交换一些公开信息，各自计算出相同的共享对称密钥，过程中不直接传输对称密钥。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907091", "t": 3, "q": "逆向工程仅用于恶意目的，如破解软件版权、分析恶意代码发起攻击，无合法应用场景。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。逆向工程虽可能被用于恶意目的，但也有合法应用场景，如软件维护、产品升级、学习研究等。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907092", "t": 3, "q": "逆向工程中，动态分析技术（如GDB调试）无法分析程序运行时与外部设备（如打印机）的交互行为。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "动态分析技术如GDB调试可通过在程序运行时设置断点、观察变量等方式，能对程序与外部设备的交互行为进行分析。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907093", "t": 3, "q": "逆向工程中，反混淆技术可完全还原混淆后的代码，使其与原始代码完全一致，无任何差异。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "反混淆技术很难完全还原混淆后的代码，因为混淆过程会对代码进行多种复杂变换，部分信息会丢失，所以无法做到与原始代码完全一致。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907094", "t": 3, "q": "逆向工程中，分析Android应用时，Jadx工具可将APK文件中的DEX字节码反编译为Java源代码，便于理解应用逻辑。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Jadx是一款常用的逆向工程工具，能把APK文件里的DEX字节码反编译成Java源代码，有助于开发者理解应用逻辑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907095", "t": 3, "q": "逆向工程中，加壳后的程序无法被逆向分析，因为壳会完全加密原始代码，任何工具都无法解密。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "加壳只是增加逆向分析难度，并非无法逆向分析，也不是完全加密且任何工具都无法解密，有很多技术手段可对加壳程序进行处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907096", "t": 3, "q": "逆向工程中，静态反汇编工具（如IDA Pro）可直接分析加壳后的二进制文件，获取原始程序的指令结构。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "加壳会对二进制文件进行加密和变形，静态反汇编工具无法直接分析加壳后的文件获取原始程序指令结构，需先脱壳。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907097", "t": 3, "q": "逆向工程中，静态分析无法获取程序运行时调用的系统函数，只能通过动态调试获取。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静态分析可通过对程序代码的静态检查来分析程序可能调用的系统函数，并非只能通过动态调试获取。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907098", "t": 3, "q": "逆向工程中，软件混淆技术（如控制流平坦化）仅能增加逆向分析的难度，无法完全阻止逆向工程的进行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件混淆技术通过改变程序代码结构等方式增加逆向分析难度，但不能从根本上阻止逆向工程，专业人员仍可通过各种手段尝试逆向。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907099", "t": 3, "q": "逆向工程中，软件加壳技术的\"壳\"本质是一段保护代码，在程序运行时先解密原始代码，再将其加载到内存中执行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "软件加壳技术的“壳”确实是一段保护代码，运行时会先对原始代码解密再加载到内存执行。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907100", "t": 3, "q": "逆向工程中，WinDbg工具可用于调试Windows平台的内核模式程序，也可调试用户模式程序。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "WinDbg是Windows平台强大的调试工具，既能调试内核模式程序，也能调试用户模式程序。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907101", "t": 3, "q": "逆向工程中的\"代码混淆\"技术通过增加代码复杂度、打乱逻辑结构等方式，可完全阻止攻击者对程序的逆向分析。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "代码混淆虽能增加逆向分析难度，但不能完全阻止攻击者，攻击者仍可通过一些技术和手段进行逆向分析。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907102", "t": 3, "q": "逆向工程中的\"动态插桩\"技术是在程序编译阶段向源代码中插入额外代码，以观察程序运行时的数据流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "动态插桩是在程序运行时插入额外代码来观察数据流，而非编译阶段。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907103", "t": 3, "q": "逆向工程中的\"反编译\"操作可将二进制文件完全还原为编译前的高级语言源代码（如完整的C语言代码），无任何信息丢失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在逆向工程中，由于编译过程会丢失一些信息，如变量名、注释等，“反编译”操作无法将二进制文件完全无信息丢失地还原为编译前的高级语言源代码。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907104", "t": 3, "q": "逆向工程中的\"反编译工具\"生成的高级语言代码可直接编译运行，且功能与原始程序完全一致。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "反编译工具生成的高级语言代码因丢失部分信息、存在优化差异等，一般不能直接编译运行，功能也很难与原始程序完全一致。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907105", "t": 3, "q": "逆向工程中的\"反调试技术\"对所有动态调试工具均有效，不存在可绕过反调试的方法。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在逆向工程里，虽然反调试技术能增加调试难度，但并非对所有动态调试工具都绝对有效，存在多种绕过反调试的方法，比如修改代码、使用特殊调试技巧等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907106", "t": 3, "q": "逆向工程中的\"反调试技术\"可通过检测调试器进程、判断代码执行时间差等方式，发现程序是否处于调试状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "反调试技术确实能够通过检测调试器进程、判断代码执行时间差等手段来识别程序是否处于调试状态。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907107", "t": 3, "q": "逆向工程中的\"十六进制编辑器（如010 Editor）\"可直接修改程序的二进制数据，用于修复程序漏洞或去除保护壳。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "十六进制编辑器能直接操作程序二进制数据，可用于修复程序漏洞、去除保护壳等逆向工程操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907108", "t": 3, "q": "逆向工程中的\"脱壳\"操作仅需去除程序的加密层，无需关注程序的原始入口点（OEP），即可获取完整的原始代码。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "脱壳不仅要去除程序加密层，还需找到原始入口点（OEP），才能恢复程序原始代码结构，获取完整原始代码。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907109", "t": 3, "q": "逆向工程中的\"脱壳\"技术主要用于去除程序的调试信息，使程序运行速度更快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“脱壳”技术主要是去除软件加壳保护，加壳是为防止软件被破解、反编译等，而不是去除调试信息，也并非为让程序运行更快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907110", "t": 3, "q": "逆向工程中的\"虚拟机保护\"技术会增加程序的运行体积和内存占用，但不会影响程序的运行速度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“虚拟机保护”技术在增加程序运行体积和内存占用的同时，通常也会影响程序运行速度，因为它需要额外的处理和模拟操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907111", "t": 3, "q": "逆向工程中的\"虚拟机保护（VMProtect）\"通过将程序核心代码转换为自定义虚拟机指令，增加逆向分析的难度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "VMProtect 是一种常用的软件保护工具，其原理就是把程序核心代码转化为自定义虚拟机指令，让逆向分析者难以理解和破解，增加逆向分析难度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907112", "t": 3, "q": "逆向工程中的\"字符串提取\"技术属于静态分析，通过工具从二进制文件中提取ASCII或Unicode字符串，可辅助理解程序功能（如文件名、提示信息）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "逆向工程里字符串提取确实是静态分析手段，它能借助工具从二进制文件中提取ASCII或Unicode字符串，这些字符串能辅助了解程序功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907113", "t": 3, "q": "逆向工程中的动态调试工具（如OllyDbg）仅能分析Windows平台的32位程序，无法分析64位程序或Linux平台程序。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "OllyDbg主要适用于Windows平台32位程序分析，但现在有支持64位程序的调试工具如x64dbg；且除了Windows，Linux也有自己的动态调试工具，如GDB ，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907114", "t": 3, "q": "逆向工程中的动态调试技术，必须在目标程序运行的前提下，才能获取其寄存器值、内存数据等运行时信息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "动态调试就是在程序运行状态下进行调试，只有程序运行，才能获取寄存器值、内存数据等运行时信息。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907115", "t": 3, "q": "逆向工程中的动态调试技术必须在程序运行状态下进行，通过设置断点、查看内存等方式跟踪程序执行流程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "动态调试就是要在程序运行时，借助设置断点、查看内存等手段来跟踪程序执行流程，这是逆向工程中动态调试技术的基本操作方式。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907116", "t": 3, "q": "逆向工程中的动态调试技术无法分析程序的加壳保护，仅能通过静态分析识别加壳类型。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "动态调试技术可以在程序运行过程中对其进行分析，是能够用于分析程序加壳保护的，并非仅能靠静态分析识别加壳类型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907117", "t": 3, "q": "逆向工程中的反编译技术可将任意二进制文件完美还原为原始的高级语言代码（如C语言），且保留所有注释和变量名。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "反编译技术不能将任意二进制文件完美还原为原始高级语言代码，在编译过程中会丢失很多信息，像注释、部分变量名等无法保留。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907118", "t": 3, "q": "逆向工程中的静态分析工具（如IDA Pro）可直接查看程序的高级语言代码，无需进行反汇编或反编译。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静态分析工具如IDA Pro需先对程序进行反汇编或反编译，才能查看高级语言代码，并非可直接查看。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907119", "t": 3, "q": "逆向工程中的静态分析技术无需运行程序，仅通过分析二进制文件的结构、汇编代码等即可推断程序逻辑。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "静态分析技术就是不运行程序，通过分析二进制文件结构、汇编代码等方式来推断程序逻辑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907120", "t": 3, "q": "逆向工程中的静态分析技术需要运行目标程序，通过观察程序运行时的行为来理解程序功能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静态分析技术不运行目标程序，而是通过分析程序的源代码、二进制代码等静态信息来理解程序功能，题干说需要运行目标程序错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907121", "t": 3, "q": "逆向工程中的Binwalk工具主要用于分析和提取固件（Firmware）中的文件系统、可执行文件等内容，是固件逆向的常用工具。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Binwalk是逆向工程里常用工具，能对固件进行分析并提取其中文件系统、可执行文件等内容。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907122", "t": 3, "q": "逆向工程中的IDA Pro工具仅能进行静态分析，无法配合调试器进行动态调试。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "IDA Pro不仅可以进行静态分析，还能配合调试器进行动态调试。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907123", "t": 3, "q": "逆向工程中的x64dbg工具支持对Windows平台下的32位和64位应用程序进行动态调试，且可通过插件扩展功能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "x64dbg是一款强大的开源调试器，确实支持对Windows平台下32位和64位应用程序进行动态调试，同时也能通过插件扩展功能。", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907124", "t": 3, "q": "数字签名不仅能保证数据的完整性，还能保证数据的保密性，防止数据在传输过程中被窃取。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字签名主要作用是保证数据完整性、认证发送者身份和抗抵赖，不能保证数据保密性，防止数据被窃取需加密技术。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907125", "t": 3, "q": "数字签名的验证过程需要使用签名者的公钥，若验证通过，则可确认数据未被篡改且发送方身份合法。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数字签名基于非对称加密，签名用私钥，验证用公钥。验证通过意味着数据完整性未被破坏且能确认发送方身份。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907126", "t": 3, "q": "网络安全的\"防火墙（状态检测型）\"可根据TCP连接的状态（如ESTABLISHED、SYN_SENT）动态调整过滤规则，比包过滤型防火墙更安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "状态检测型防火墙能动态跟踪并根据TCP连接状态调整过滤规则，能更好应对复杂网络攻击，比仅基于规则过滤数据包的包过滤型防火墙更安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907127", "t": 3, "q": "网络安全的\"零信任\"架构认为内部网络是安全的，仅需对外部接入流量进行严格认证和控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“零信任”架构的核心是“默认不信任，始终要验证”，它不认为内部网络是安全的，而是对所有访问，不管是内部还是外部接入流量，都要进行严格认证和控制。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907128", "t": 3, "q": "网络安全的\"漏洞管理\"流程仅包括漏洞扫描和漏洞修复，无需进行漏洞评估和验证。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。网络安全的“漏洞管理”流程是一个闭环过程，不仅包含漏洞扫描和修复，还需要进行漏洞评估，以确定漏洞的严重程度和影响范围，来决定修复的优先级；修复后也需要进行验证，确保漏洞已被成功修复。所以题干表述不完整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907129", "t": 3, "q": "网络安全的\"蜜罐\"技术是一种用于存储重要业务数据的高安全级别服务器，需部署在核心业务区。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“蜜罐”技术是一种诱捕攻击者的主动防御技术，并非用于存储重要业务数据的服务器，也不部署在核心业务区。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907130", "t": 3, "q": "网络安全的\"入侵防御系统（IPS）\"与\"入侵检测系统（IDS）\"的核心区别是:IPS可主动阻断攻击流量，IDS仅能检测并告警。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "入侵检测系统（IDS）主要负责对网络中的异常活动进行检测和分析，发现攻击后发出告警；而入侵防御系统（IPS）不仅能检测，还可以主动对攻击流量进行阻断。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813928843907131", "t": 3, "q": "网络安全的\"入侵检测系统（IDS）\"的误报率越低，漏报率越高;误报率越高，漏报率越低，两者呈反比关系。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "误报率和漏报率并非简单的反比关系，它们受多种因素影响，不存在必然的一个升高另一个就降低的反比联系。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第9章 网络安全（2）", "n": "基础练习题【含解析】 / 第9章 网络安全（2）", "qs": [{"id": "2034813945784700928", "t": 1, "q": "下列哪种安全协议主要用于在SSH协议基础上，为文件传输提供安全保障，支持加密传输和身份认证？", "a": ["FTP", "TFTP", "SFTP", "HTTP", "", ""], "r": "C", "e": "SFTP是在SSH协议基础上为文件传输提供安全保障，可进行加密传输和身份认证。FTP无加密，TFTP简单无身份认证，HTTP用于网页传输。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700929", "t": 1, "q": "下列哪种攻击属于\"应用层DDoS攻击\"，通过向服务器发送大量合法的应用层请求（如HTTP请求），消耗服务器CPU和内存资源？", "a": ["HTTP洪水攻击", "SYN洪水攻击", "ICMP洪水攻击", "UDP洪水攻击", "", ""], "r": "A", "e": "HTTP洪水攻击是向服务器发送大量合法的HTTP请求，会消耗服务器CPU和内存资源，属于应用层DDoS攻击；SYN洪水攻击针对TCP协议，ICMP洪水攻击用ICMP报文，UDP洪水攻击用UDP数据包，它们不属于应用层攻击。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700930", "t": 1, "q": "下列哪种加密方式属于\"端到端加密\"，即数据从发送方生成到接收方解密的整个过程中始终处于加密状态，中间节点无法解密？", "a": ["节点加密", "传输层加密", "链路加密", "端到端加密", "", ""], "r": "D", "e": "题目问的就是哪种是端到端加密，选项D就是端到端加密，其特点就是数据从发送到接收全程加密，中间节点无法解密。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700931", "t": 1, "q": "下列哪种加密算法属于对称加密算法，且采用分组密码模式，密钥长度可选择128位、192位或256位？", "a": ["ECC（椭圆曲线密码）", "RSA", "DSA（数字签名算法）", "AES", "", ""], "r": "D", "e": "A、B、C选项都属于非对称加密算法，AES是对称加密算法，采用分组密码模式，密钥长度可选128位、192位或256位。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700932", "t": 1, "q": "下列哪种漏洞利用技术通过覆盖程序内存中的返回地址，使程序跳转到攻击者预先注入的恶意代码执行？", "a": ["UAF（使用后释放）漏洞利用", "缓冲区溢出漏洞利用", "整数溢出漏洞利用", "格式化字符串漏洞利用", "", ""], "r": "B", "e": "缓冲区溢出漏洞利用可通过向程序输入超长数据覆盖内存中的返回地址，让程序跳转执行攻击者注入的恶意代码。UAF主要是使用已释放内存；整数溢出是整数运算结果超出范围；格式化字符串漏洞是利用格式化函数的漏洞。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700933", "t": 1, "q": "下列哪种漏洞属于操作系统内核层漏洞，攻击者利用该漏洞可绕过内核权限检查，获取系统最高权限？", "a": ["文件上传漏洞", "跨站请求伪造（CSRF）漏洞", "目录遍历漏洞", "内核缓冲区溢出漏洞", "", ""], "r": "D", "e": "内核缓冲区溢出可绕过内核权限检查获取最高权限，属于内核层漏洞；而文件上传、跨站请求伪造、目录遍历都不是内核层漏洞。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700934", "t": 1, "q": "下列哪种漏洞属于应用层漏洞，通常因程序员未对用户输入进行有效过滤，导致攻击者可注入恶意SQL语句操作数据库？", "a": ["跨站脚本（XSS）漏洞", "权限提升漏洞", "缓冲区溢出漏洞", "SQL注入漏洞", "", ""], "r": "D", "e": "题目描述的是因未过滤用户输入，攻击者可注入恶意SQL语句操作数据库，这正是SQL注入漏洞的特征。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700935", "t": 1, "q": "下列哪种逆向分析方法主要通过分析程序的输入输出数据、运行状态，推断程序的功能逻辑，无需查看代码？", "a": ["动态调试", "黑盒分析", "白盒分析", "静态反编译", "", ""], "r": "B", "e": "黑盒分析不考虑程序内部代码，仅通过分析输入输出数据和运行状态来推断功能逻辑。动态调试需运行程序并调试；白盒分析要查看代码；静态反编译也是针对代码。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700936", "t": 1, "q": "下列哪种逆向分析技术需要在程序运行过程中，通过设置断点、查看内存数据来分析程序逻辑？", "a": ["静态反编译", "代码混淆分析", "动态调试", "字符串提取", "", ""], "r": "C", "e": "动态调试是在程序运行时进行操作，可设置断点、查看内存数据来分析程序逻辑。静态反编译不涉及运行程序；代码混淆分析主要针对代码混淆处理；字符串提取是提取程序里的字符串。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700937", "t": 1, "q": "下列哪种逆向工具主要用于动态调试Windows平台下的32位和64位应用程序，支持断点设置、内存修改和寄存器查看？", "a": ["x64dbg", "IDA Pro", "Immunity Debugger", "Binwalk", "", ""], "r": "A", "e": "x64dbg是用于动态调试Windows平台32位和64位应用程序的工具，可进行断点设置、内存修改和寄存器查看等操作。IDA Pro主要用于静态反汇编；Immunity Debugger主要针对32位Windows程序；Binwalk用于分析二进制文件。所以答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700938", "t": 1, "q": "下列哪种网络安全技术通过建立虚拟专用通道，在公共网络中实现加密数据传输，常用于远程办公人员访问企业内部网络？", "a": ["IDS（入侵检测系统）", "杀毒软件", "VPN（虚拟专用网络）", "防火墙", "", ""], "r": "C", "e": "VPN可建立虚拟专用通道，在公共网络加密传输数据，适合远程办公人员访问企业内网；IDS是检测入侵行为，杀毒软件查杀病毒，防火墙隔离内外网，均无建立虚拟通道加密传输功能。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700939", "t": 1, "q": "下列哪种网络协议攻击利用了ARP协议无身份验证的缺陷，伪造ARP响应包篡改主机ARP缓存表，导致流量劫持？", "a": ["DNS欺骗攻击", "ICMP重定向攻击", "SNMP劫持攻击", "ARP欺骗攻击", "", ""], "r": "D", "e": "ARP欺骗攻击正是利用ARP协议无身份验证缺陷，伪造ARP响应包篡改主机ARP缓存表以实现流量劫持。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700940", "t": 1, "q": "以下关于网络安全\"访问控制\"的描述，错误的是哪一项？", "a": ["基于属性的访问控制（ABAC）仅根据用户属性分配权限，而不考虑客体属性。", "基于角色的访问控制（RBAC）是根据用户的角色来分配权限。", "访问控制的核心在于确定“谁（主体）能访问什么（客体）以及如何访问”。", "访问控制列表（ACL）是一种常见的实现访问控制的方式。", "", ""], "r": "A", "e": "ABAC 会综合考虑主体属性、客体属性、环境属性等多方面因素来分配权限，并非仅根据用户属性且不考虑客体属性，A 描述错误。B、C、D 对 RBAC、访问控制核心、ACL 的描述均正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700941", "t": 1, "q": "以下关于网络安全\"零信任\"架构的核心思想，正确的是哪一项？", "a": ["零信任架构认为内部网络是安全的，仅需防护外部网络", "零信任架构无需身份认证，仅依赖网络边界防护", "零信任架构仅适用于大型企业，不适用于中小型企业", "零信任架构的核心是\"永不信任，始终验证\"", "", ""], "r": "D", "e": "零信任理念打破传统“内网安全”的认知，不默认任何网络是安全的，强调对任何试图访问资源的用户、设备和应用等都要持续验证。A选项错在认为内部网络安全；B选项零信任需严格的身份认证而非无需；C选项零信任适用于各类企业。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700942", "t": 1, "q": "以下关于网络安全\"蜜罐\"技术的描述，正确的是哪一项？", "a": ["蜜罐仅能模拟Web服务器，无法模拟其他类型服务器", "蜜罐是用于存储重要数据的服务器，需高强度防护", "蜜罐的核心目的是吸引攻击者，收集攻击数据和样本", "蜜罐一旦被攻击，会导致真实业务系统瘫痪", "", ""], "r": "C", "e": "蜜罐是一种主动防御技术，故意布置一些看似有价值的目标吸引攻击者，从而收集攻击数据和样本。A选项蜜罐可模拟多种类型服务器；B选项蜜罐不是存储重要数据的服务器；D选项蜜罐与真实业务系统隔离，被攻击不会导致真实业务系统瘫痪。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700943", "t": 1, "q": "以下关于网络安全\"纵深防御\"模型的描述，错误的是哪一项？", "a": ["防火墙、入侵检测系统、主机杀毒软件可共同构成纵深防御的一部分", "纵深防御需在网络边界、网络内部、主机、应用等多个层面部署安全措施", "纵深防御的核心是\"一层突破，多层防护\"", "纵深防御仅需关注技术层面的防护，无需考虑管理和人员安全", "", ""], "r": "D", "e": "网络安全纵深防御是一个综合体系，不仅要考虑技术防护，还需重视管理和人员安全，D选项说法错误。A选项中多种安全设备可构成纵深防御；B选项纵深防御确实要在多层面部署；C选项“一层突破，多层防护”是核心特点。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700944", "t": 1, "q": "以下关于网络安全漏洞的描述，属于\"逻辑漏洞\"的是哪一项？", "a": ["整数溢出漏洞", "权限绕过漏洞（因代码逻辑判断错误导致）", "SQL注入漏洞", "缓冲区溢出漏洞", "", ""], "r": "B", "e": "逻辑漏洞是因程序逻辑设计缺陷产生的问题。A整数溢出、C SQL注入、D缓冲区溢出多是代码实现层面的技术问题，而B权限绕过漏洞是因代码逻辑判断错误导致，属于逻辑漏洞范畴。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700945", "t": 1, "q": "以下关于网络协议安全的描述，错误的是哪一项？", "a": ["FTP协议默认不加密，数据和密码均以明文传输", "SSH协议可替代Telnet，提供加密的远程登录服务", "SNMPv1协议支持数据加密和身份认证，安全性较高", "HTTPS协议通过TLS层对HTTP数据进行加密，保障传输安全", "", ""], "r": "C", "e": "SNMPv1 协议安全性较差，它不支持数据加密，仅提供简单的团体名认证。而选项A、B、D描述均正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700946", "t": 1, "q": "以下关于IPSec协议的描述，错误的是哪一项？", "a": ["IPSec仅支持传输模式，不支持隧道模式", "IPSec的ESP协议可同时提供加密和认证功能", "IPSec的AH协议仅提供认证功能，不提供加密功能", "IPSec可提供数据机密性、完整性和身份认证", "", ""], "r": "A", "e": "IPSec支持传输模式和隧道模式，A选项描述错误；ESP可同时提供加密和认证功能，AH仅提供认证不提供加密，IPSec能提供数据机密性、完整性和身份认证，B、C、D选项描述正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700947", "t": 1, "q": "在密码学的数字签名方案中，以下哪个过程需要使用签名者的私钥？", "a": ["解密数据", "生成签名", "加密数据", "验证签名", "", ""], "r": "B", "e": "数字签名中，签名者用私钥生成签名以证明信息是自己发出且未被篡改。解密数据、加密数据并非数字签名核心操作；验证签名用的是签名者公钥。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700948", "t": 1, "q": "在密码学中，“彩虹表”技术主要用于破解以下哪种加密方式？", "a": ["非对称加密", "对称加密", "哈希加密", "数字签名", "", ""], "r": "C", "e": "彩虹表是一种用于破解哈希加密的技术，通过预先计算大量哈希值及其对应的明文，来快速查找匹配的哈希值以获取明文。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700949", "t": 1, "q": "在密码学中，\"哈希函数\"的特性不包括下列哪项？", "a": ["具有抗碰撞性，即难以找到两个不同输入得到相同输出", "具有可逆性，可从哈希值反推原始输入", "具有单向性，即从输入计算哈希值容易，从哈希值反推输入困难", "输入任意长度，输出固定长度", "", ""], "r": "B", "e": "哈希函数是单向的，从哈希值反推原始输入极难，不具有可逆性。A、C、D 选项都是哈希函数的特性。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700950", "t": 1, "q": "在密码学中，\"密钥交换协议\"的主要目的是？", "a": ["对传输的数据进行加密，保证保密性", "验证通信双方的身份，防止身份伪造", "在不安全的网络中，使通信双方安全地协商出一个共享的对称密钥", "检测传输数据是否被篡改", "", ""], "r": "C", "e": "密钥交换协议重点在于让通信双方在不安全网络中安全协商出共享对称密钥。A是加密算法功能；B是身份验证机制作用；D是消息认证码等用途。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945784700951", "t": 1, "q": "在密码学中，\"数字签名\"的核心作用不包括下列哪项？", "a": ["保证数据的完整性，防止被篡改", "保证数据的保密性，防止被窃取", "确认发送方身份，防止身份伪造", "防止发送方事后否认发送行为", "", ""], "r": "B", "e": "数字签名主要用于确认身份、防篡改和防抵赖，不具备保证数据保密性防止被窃取的功能，数据保密性一般靠加密算法。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895232", "t": 1, "q": "在密码学中，\"椭圆曲线密码（ECC）\"相比RSA算法的主要优势是？", "a": ["ECC仅能用于数字签名，RSA可用于加密和签名", "ECC安全性更低，适合低性能设备", "ECC加密速度更快，密钥长度更短", "ECC是对称加密，RSA是非对称加密", "", ""], "r": "C", "e": "ECC加密速度快且密钥长度短，在相同安全级别下优势明显。A选项ECC也可用于加密；B选项ECC安全性高；D选项ECC和RSA都是非对称加密。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895233", "t": 1, "q": "在密码学中，\"椭圆曲线密码体制（ECC）\"相比\"RSA密码体制\"的主要优势是？", "a": ["在相同安全强度下，ECC的密钥长度比RSA短", "ECC支持数字签名，而RSA不支持", "ECC的加密速度比RSA快", "ECC是对称加密算法，而RSA是非对称加密算法", "", ""], "r": "A", "e": "椭圆曲线密码体制（ECC）在相同安全强度下，密钥长度比RSA短，能节省资源和提高效率。RSA也支持数字签名；ECC并非在所有场景下加密速度都比RSA快；ECC和RSA
