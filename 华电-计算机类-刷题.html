的位置（如bounding box）", "目标检测仅能识别单个物体，图像分类可识别多个物体", "目标检测的模型训练不需要标注数据，图像分类需要", "", ""], "r": "B", "e": "图像分类是给图像整体贴一个类别标签，目标检测不仅要识别出图像里物体的类别，还得确定物体在图像中的位置。A选项目标检测精度不一定高于图像分类；C选项目标检测能识别多个物体；D选项目标检测和图像分类模型训练都需要标注数据。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194627", "t": 1, "q": "在图像识别任务中，以下哪种技术可有效解决CNN模型对图像旋转、缩放、平移等变换敏感的问题？", "a": ["减少全连接层的神经元数量", "使用更大尺寸的卷积核", "数据增强（如随机旋转、裁剪）", "增加卷积层的数量", "", ""], "r": "C", "e": "数据增强通过对原始图像进行随机旋转、裁剪等操作，让模型学习到图像在不同变换下的特征，能有效解决CNN对图像旋转、缩放、平移等变换敏感的问题。而减少全连接层神经元数量主要影响模型复杂度和泛化能力；使用更大尺寸卷积核侧重于提取更宏观特征；增加卷积层数量主要用于加深网络学习更复杂特征。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194628", "t": 1, "q": "在图像识别中，\"迁移学习\"的应用场景是指以下哪一种情况？", "a": ["通过增加训练数据量来提升模型泛化能力", "将在大规模数据集（如ImageNet）上训练好的模型参数，迁移到小规模特定数据集上进行微调，以提升模型性能", "对图像数据进行数据增强（如旋转、裁剪）以扩充数据集", "仅使用特定任务的数据集训练模型，不利用任何预训练模型", "", ""], "r": "B", "e": "迁移学习核心是利用已有的知识。A是增加数据提升泛化，C是数据增强扩充数据，D不利用预训练模型，都不是迁移学习。B把大规模数据集训练好的参数迁移到小规模特定数据集微调，符合迁移学习概念。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194629", "t": 1, "q": "在图像识别中，\"语义分割\"任务的目标是以下哪一项？", "a": ["将图像中的每个像素分配到对应的类别（如背景、汽车、行人）", "提取图像中的关键特征点（如物体的边缘、角点）", "将图像缩小到固定尺寸，便于模型处理", "识别图像中物体的类别和大致位置（如bounding box）", "", ""], "r": "A", "e": "语义分割是要精确到每个像素，为其分配对应的类别。选项B是特征提取，C是图像尺寸处理，D是目标检测的任务。所以答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194630", "t": 1, "q": "在图像识别中，卷积神经网络（CNN）的以下哪个层的主要功能是通过减少特征图的空间维度，降低计算量，同时保留关键特征信息，且具有一定的平移不变性？", "a": ["池化层", "全连接层", "卷积层", "激活函数层", "", ""], "r": "A", "e": "池化层可减少特征图空间维度、降低计算量，还能保留关键特征且有平移不变性。全连接层用于整合特征进行分类；卷积层提取图像特征；激活函数层引入非线性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194631", "t": 1, "q": "在图像识别中，以下哪种模型架构是通过引入\"注意力机制\"，让模型在识别过程中重点关注图像的关键区域，从而提升复杂场景下的识别准确率？", "a": ["SENet", "LeNet-5", "YOLO", "ResNet", "", ""], "r": "A", "e": "SENet引入注意力机制，可自适应调整通道特征响应，重点关注关键区域提升复杂场景识别准确率；LeNet - 5是早期简单卷积网络；YOLO是目标检测算法；ResNet主要解决深度网络梯度消失问题。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194632", "t": 1, "q": "在语音合成（TTS）技术中，下列哪种技术通过构建端到端模型，直接将文本映射为语音波形，大幅提升合成语音的自然度？", "a": ["基于深度学习的端到端TTS（如Tacotron）", "基于参数的语音合成", "基于共振峰的语音合成", "基于拼接的语音合成", "", ""], "r": "A", "e": "基于深度学习的端到端TTS能直接将文本映射为语音波形，可提升合成语音自然度，其他选项技术并非如此。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194633", "t": 1, "q": "在语音合成技术中，下列哪种技术通过\"声码器\"将声学特征转换为连续语音波形，解决了传统TTS中语音不连贯的问题？", "a": ["基于拼接的TTS", "基于WaveNet的端到端TTS", "基于参数的TTS", "基于共振峰的TTS", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194634", "t": 1, "q": "在语音合成技术中，以下哪种技术相比传统的拼接式语音合成，具有合成语音自然度更高、语料依赖更少的优势？", "a": ["基于参数合成的合成", "基于共振峰合成的合成", "基于波形拼接的合成", "基于深度学习的端到端语音合成", "", ""], "r": "D", "e": "深度学习的端到端语音合成可直接学习文本到语音映射，减少语料依赖且合成语音自然度高，优于传统拼接式。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194635", "t": 1, "q": "在语音识别的\"声学建模\"环节，下列哪种模型通过引入\"注意力机制\"，解决了传统RNN模型处理长语音序列时的梯度消失问题？", "a": ["GMM（高斯混合模型）", "CTC（连接时序分类）模型", "Transformer-based声学模型", "HMM（隐马尔可夫模型）", "", ""], "r": "C", "e": "Transformer-based声学模型引入注意力机制，能有效解决传统RNN模型处理长语音序列时的梯度消失问题。而GMM、CTC、HMM都未通过引入注意力机制解决该问题。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194636", "t": 1, "q": "在语音识别的\"语言模型\"环节，下列哪种模型通过引入\"n-gram\"统计方法，计算句子的概率合理性，从而降低识别错误率？", "a": ["基于规则的语法模型", "基于统计的n-gram语言模型", "基于Transformer的预训练语言模型", "基于词典的词汇匹配模型", "", ""], "r": "B", "e": "题干明确提到引入“n - gram”统计方法，选项中只有基于统计的n - gram语言模型符合。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194637", "t": 1, "q": "在语音识别的特征提取阶段，以下哪种算法主要通过分析语音信号的频谱包络来提取特征，且是当前主流语音识别系统中常用的特征提取方法之一？", "a": ["快速傅里叶变换（FFT）", "梅尔频率倒谱系数（MFCC）", "离散余弦变换（DCT）", "线性预测编码（LPC）", "", ""], "r": "B", "e": "MFCC通过分析语音信号频谱包络提取特征，是主流语音识别常用方法。FFT主要用于信号频谱分析；DCT常作为MFCC处理步骤；LPC侧重于线性预测。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194638", "t": 1, "q": "在语音识别的预处理阶段，以下哪种操作的主要目的是将语音信号从时域转换到频域，以提取更能反映语音特征的频谱信息？", "a": ["分帧", "加窗", "预加重", "傅里叶变换（FFT）", "", ""], "r": "D", "e": "傅里叶变换（FFT）可把语音信号从时域转换到频域，从而提取频谱信息。分帧是将语音信号分成小段；加窗是为减少频谱泄露；预加重是提升高频部分。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194639", "t": 1, "q": "在语音识别系统的特征提取环节，下列哪种算法主要通过模拟人耳听觉特性，将语音信号转换为具有区分性的特征向量？", "a": ["DCT（离散余弦变换）", "MFCC（梅尔频率倒谱系数）", "LPC（线性预测编码）", "FFT（快速傅里叶变换）", "", ""], "r": "B", "e": "MFCC模拟人耳听觉特性，能把语音信号转成有区分性的特征向量。DCT用于数据压缩；LPC是分析语音信号产生模型；FFT是快速计算离散傅里叶变换。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194640", "t": 1, "q": "在语音识别系统中，以下哪项技术的主要作用是将连续的语音信号分割成具有语义意义的基本单位（如音素、音节），为后续的特征提取和模型识别奠定基础？", "a": ["端点检测", "语音信号预处理", "声学模型训练", "语音分段与标注", "", ""], "r": "D", "e": "语音分段与标注就是把连续语音信号分割成有语义意义的基本单位，为后续处理打基础。端点检测主要是确定语音的起始和结束；语音信号预处理是对语音信号进行滤波等操作；声学模型训练是建立语音特征和发音之间的关系。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194641", "t": 1, "q": "在自然语言处理的\"机器翻译\"任务中，下列哪种模型架构解决了传统seq2seq模型处理长句子时\"远距离依赖\"的问题？", "a": ["CNN-based seq2seq模型", "基于规则的机器翻译模型", "RNN-based seq2seq模型", "Transformer-based seq2seq模型", "", ""], "r": "D", "e": "传统seq2seq模型用RNN处理长句子有“远距离依赖”问题。Transformer架构采用自注意力机制，能捕捉长距离依赖关系，有效解决该问题。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194642", "t": 1, "q": "在自然语言处理的\"句法分析\"任务中，下列哪种方法主要通过构建概率模型，计算句子中词汇间的依存关系概率，从而确定句法结构？", "a": ["基于深度学习的语义角色标注", "基于词典的分词句法融合分析", "基于统计的依存句法分析", "基于规则的句法分析", "", ""], "r": "C", "e": "题干强调通过构建概率模型计算词汇间依存关系概率来确定句法结构，基于统计的依存句法分析符合这一特征。而基于深度学习的语义角色标注侧重语义角色，基于词典的分词句法融合分析靠词典，基于规则的句法分析用规则。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194643", "t": 1, "q": "在自然语言处理的\"命名实体识别（NER）\"任务中，下列哪种模型通过融合\"字符级特征\"和\"词汇级特征\"，提升了对未登录词（如新词、人名）的识别能力？", "a": ["基于词典匹配的NER模型", "基于规则的NER模型", "基于统计的CRF（条件随机场）NER模型", "基于BERT的NER模型", "", ""], "r": "D", "e": "基于BERT的NER模型可利用预训练语言模型融合字符级和词汇级特征，对未登录词识别能力强。A基于词典匹配，依赖词典；B基于规则，依赖规则；C基于统计，缺乏预训练语言模型优势。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194644", "t": 1, "q": "在AI算力集群的构建中，以下哪种技术的主要作用是实现多芯片、多节点之间的高效数据通信，以支持大规模分布式AI训练任务？", "a": ["高速互联技术（如InfiniBand、RoCE）", "负载均衡技术", "模型量化技术", "数据压缩技术", "", ""], "r": "A", "e": "高速互联技术能实现多芯片、多节点间高效数据通信，为大规模分布式AI训练提供支撑；负载均衡技术主要是平衡系统负载；模型量化技术是减少模型参数；数据压缩技术是减少数据量。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194645", "t": 1, "q": "在AI算力芯片的性能评估中，以下哪个指标更能准确反映芯片在深度学习任务中的实际计算能力，而非单纯的理论峰值性能？", "a": ["TOPS（每秒万亿次操作）", "FLOPS（每秒浮点运算次数）", "能效比（TOPS/W，每秒每瓦万亿次操作）", "实际任务吞吐量（如每秒处理图像数量、每秒生成文本长度）", "", ""], "r": "D", "e": "A、B项是理论性能指标，C项侧重于能耗与计算能力的关系，D项“实际任务吞吐量”能直接体现芯片在实际深度学习任务中的计算能力。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194646", "t": 1, "q": "在AI算力芯片的性能评价中，下列哪个指标更能准确反映芯片处理深度学习任务的实际效率（而非理论峰值算力）？", "a": ["能效比（TOPS/W，每秒每瓦万亿次操作）", "FLOPS（每秒浮点运算次数）", "实际任务延迟（如推理一张图像的耗时）", "TOPS（每秒万亿次操作）", "", ""], "r": "C", "e": "理论峰值算力常用FLOPS、TOPS衡量，而能效比虽与效率有关但未直接体现实际处理任务的效率，实际任务延迟能直接反映芯片处理深度学习任务的实际效率。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194647", "t": 1, "q": "在AI算力芯片性能评估中，以下哪个指标主要用于衡量芯片在单位时间内能够完成的深度学习基本运算（如乘加运算）的数量，是评估芯片算力的核心指标之一？", "a": ["缓存容量（MB）", "每秒浮点运算次数（FLOPS）", "主频（GHz）", "功耗（W）", "", ""], "r": "B", "e": "每秒浮点运算次数用于衡量芯片在单位时间完成深度学习基本运算数量，是评估算力核心指标。缓存容量与数据存储有关；主频体现时钟频率；功耗指芯片消耗电能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194648", "t": 1, "q": "在AI算力芯片中，\"TPU\"（张量处理单元）的设计初衷主要是为了优化以下哪类任务的运算效率？", "a": ["数据库查询任务", "图像渲染任务", "深度学习中的张量运算任务", "传统的科学计算任务", "", ""], "r": "C", "e": "TPU是专门为深度学习设计的芯片，其设计初衷就是优化深度学习里的张量运算。而数据库查询、图像渲染、传统科学计算并非其主要针对优化的任务。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194649", "t": 1, "q": "在AI算力芯片中，下列哪种芯片架构因具备高度并行计算能力，成为当前深度学习模型训练阶段的主流选择？", "a": ["CPU", "MCU", "GPU", "FPGA", "", ""], "r": "C", "e": "GPU有大量计算核心，具备高度并行计算能力，适合深度学习模型训练时大规模数据的并行处理，是当前深度学习模型训练阶段的主流选择。CPU主要用于通用计算；MCU是微控制器，用于控制；FPGA灵活性高但在深度学习训练并行计算效率上不如GPU。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194650", "t": 1, "q": "在AI算力芯片中，下列哪种芯片属于\"定制化算力芯片\"，为特定AI算法（如深度学习）设计，具备极高的能效比？", "a": ["GPU", "FPGA（现场可编程门阵列）", "CPU", "ASIC（专用集成电路）", "", ""], "r": "D", "e": "ASIC是为特定AI算法设计的专用集成电路，属于定制化算力芯片，能效比高。GPU通用性强，FPGA可灵活编程，CPU主要用于通用计算。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194651", "t": 1, "q": "在AI算力芯片中，以下哪种芯片类型主要通过大量并行计算单元实现对深度学习中矩阵运算的高效处理，且在图像识别、语音合成等深度学习推理和训练任务中应用最广泛？", "a": ["中央处理器（CPU）", "专用集成电路（ASIC）", "现场可编程门阵列（FPGA）", "张量处理单元（TPU）", "", ""], "r": "D", "e": "TPU是专为深度学习设计，有大量并行计算单元，能高效处理深度学习矩阵运算，在图像识别等深度学习任务应用广泛；CPU通用但处理深度学习矩阵运算效率低；ASIC定制化强，灵活性差；FPGA灵活性好但运算效率在深度学习大规模矩阵运算上不如TPU。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194652", "t": 1, "q": "自然语言处理任务中，BERT模型采用的预训练任务不包括以下哪一项？", "a": ["下一句预测（NSP）", "因果语言模型（CLM）", "掩码语言模型（MLL）", "句子顺序预测（SOP）", "", ""], "r": "B", "e": "BERT采用的预训练任务有掩码语言模型（MLM）和下一句预测（NSP）等，句子顺序预测（SOP）也是相关拓展任务，而因果语言模型（CLM）不是BERT采用的预训练任务。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194653", "t": 1, "q": "自然语言处理中，\"命名实体识别（NER）\"任务的目标是以下哪一项？", "a": ["将一种语言的文本转换为另一种语言", "根据文本内容回答用户提出的问题", "识别文本中具有特定意义的实体，如人名、地名、组织机构名", "判断文本的情感倾向（如积极、消极）", "", ""], "r": "C", "e": "命名实体识别就是要找出文本里像人名、地名、组织机构名这类有特定意义的实体。A是机器翻译，B是问答系统功能，D是情感分析。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194654", "t": 1, "q": "自然语言处理中，\"上下文无关文法（CFG）\"主要用于以下哪一项任务？", "a": ["文本的自动摘要", "文本的句法分析（如分析句子的语法结构）", "文本的情感分析", "文本的语义理解", "", ""], "r": "B", "e": "CFG能生成符合特定规则的句子集合，常被用于分析句子的语法结构。而自动摘要、情感分析和语义理解并非其主要用途。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194655", "t": 1, "q": "自然语言处理中，\"BERT模型\"的核心特点是以下哪一项？", "a": ["仅支持英文文本处理，不具备多语言处理能力", "仅能处理单向文本序列，无法同时利用上下文信息", "属于生成式模型，主要用于文本生成任务", "基于Transformer的编码器结构，采用\"双向注意力机制\"捕捉上下文依赖", "", ""], "r": "D", "e": "BERT基于Transformer的编码器结构，采用双向注意力机制来捕捉上下文依赖。A选项BERT支持多语言处理；B选项BERT能同时利用上下文信息；C选项BERT是预训练语言模型，并非主要用于文本生成任务。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194656", "t": 1, "q": "自然语言处理中，\"Transformer模型\"的核心创新点是以下哪一项？", "a": ["仅使用编码器结构，无法处理生成式任务", "采用循环结构处理时序数据，解决长序列依赖问题", "依赖卷积层提取文本特征，提升处理速度", "引入\"注意力机制\"，能够动态关注输入序列中不同位置的重要信息", "", ""], "r": "D", "e": "Transformer模型核心创新是引入“注意力机制”，可动态关注输入序列不同位置重要信息。A选项Transformer有编码器和解码器，能处理生成式任务；B选项它不用循环结构；C选项不依赖卷积层。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194657", "t": 1, "q": "自然语言处理中的\"机器翻译\"任务，以下哪种技术方案解决了传统统计机器翻译中\"短语对齐\"精度低、长句翻译效果差的问题？", "a": ["基于规则的机器翻译", "基于模板的机器翻译", "基于神经网络的机器翻译（NMT）", "基于统计的机器翻译", "", ""], "r": "C", "e": "传统统计机器翻译有短语对齐精度低、长句翻译效果差等问题，而基于神经网络的机器翻译（NMT）能有效解决这些问题。A选项基于规则的机器翻译依赖人工规则；B选项基于模板的机器翻译依赖预定义模板；D选项基于统计的机器翻译就是存在上述问题的传统方法。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194658", "t": 1, "q": "自然语言处理中的\"歧义消解\"任务，其核心目标是解决以下哪种问题？", "a": ["识别文本中的实体（如人名、地名）", "计算两个文本之间的语义相似度", "消除文本中词语、句子或句法结构的多义性", "将文本转换为机器可理解的向量表示", "", ""], "r": "C", "e": "“歧义消解”重点在消除歧义，也就是消除文本里词语、句子或句法结构的多义性。A选项是实体识别任务；B选项是语义相似度计算；D选项是文本向量化表示。所以答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194659", "t": 1, "q": "自然语言处理中的\"情感分析\"任务，其核心是通过技术手段实现以下哪项功能？", "a": ["将一种语言的文本翻译成另一种语言", "从文本中提取关键信息（如时间、地点、事件）", "判断文本中表达的情感倾向（如积极、消极、中性）", "分析文本的语法结构（如主谓宾关系）", "", ""], "r": "C", "e": "情感分析重点在于判断文本里的情感倾向。A是机器翻译功能；B是信息提取；D是语法分析。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194660", "t": 1, "q": "自然语言处理中的\"预训练-微调\"范式，其核心优势不包括以下哪一项？", "a": ["通过预训练模型学习通用语言知识，提升下游任务性能", "减少下游任务对标注数据的依赖", "大幅降低模型的训练时间和计算资源消耗", "无需针对不同下游任务设计不同的模型架构", "", ""], "r": "C", "e": "“预训练 - 微调”范式虽有诸多优势，但预训练过程需大量数据和计算资源，训练时间长、消耗大，并非能大幅降低训练时间和计算资源消耗。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194661", "t": 1, "q": "AI算力芯片中，\"内存带宽\"对芯片性能的影响主要体现在以下哪一方面？", "a": ["内存带宽决定芯片的功耗，带宽越高，功耗越低", "内存带宽直接影响芯片的数据处理能力，带宽越大，数据吞吐量越高", "内存带宽影响芯片支持的最大模型规模，带宽越高，支持的模型参数越多", "内存带宽影响芯片存取数据的效率，带宽不足会导致运算单元空闲（\"内存墙\"问题）", "", ""], "r": "D", "e": "内存带宽不足时，运算单元会因等待数据而空闲，出现“内存墙”问题，它体现了内存带宽对芯片性能的影响。A选项内存带宽与功耗无此必然决定关系；B选项数据处理能力受多种因素影响，带宽大不直接等同于数据吞吐量高；C选项支持的最大模型规模受多因素制约，不是仅由带宽决定。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087104", "t": 2, "q": "以下哪些因素会影响AI算力集群的整体训练效率？（　）", "a": ["芯片间的高速互联带宽和延迟", "训练数据的分布和加载速度", "训练过程中的梯度同步机制", "集群中芯片的数量和单芯片性能", "", ""], "r": "ABCD", "e": "芯片互联情况影响数据传输，训练数据分布和加载速度影响数据获取，梯度同步机制影响训练协同，芯片数量和性能决定基础计算能力，这些都会影响AI算力集群整体训练效率。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087105", "t": 2, "q": "以下哪些应用场景是语音合成（TTS）技术的典型落地场景？（　）", "a": ["会议录音的实时文字转录", "智能音箱的语音交互回应", "电话客服机器人的语音回复", "导航软件的语音播报", "", ""], "r": "BCD", "e": "语音合成（TTS）是将文字转换为语音的技术。B选项智能音箱、C选项电话客服机器人、D选项导航软件都是把文字信息转换为语音输出，属于TTS技术典型落地场景。A选项会议录音实时文字转录是语音识别，是将语音转换为文字。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087106", "t": 2, "q": "以下哪些应用场景中，语音识别（ASR）技术需要结合\"语言模型\"才能达到更好的识别效果？（　）", "a": ["专业领域的语音转录（如医疗病历、法律文书）", "方言或口音较重的语音识别", "短句、孤立词的识别（如手机输入法的语音输入）", "长文本的语音转写（如会议记录、讲座录音）", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087107", "t": 2, "q": "以下哪些应用场景主要依赖\"计算机视觉\"技术？", "a": ["视频监控中的异常行为检测（如打架、闯入）", "语音助手（如识别用户语音指令）", "人脸识别门禁系统（验证人员身份）", "自动驾驶汽车的环境感知（识别行人、车辆、交通信号灯）", "", ""], "r": "ACD", "e": "计算机视觉是让计算机像人一样“看”世界。A中视频监控检测异常行为需识别画面动作；C人脸识别门禁靠识别面部图像；D自动驾驶感知环境要识别各种物体图像。而B语音助手依赖语音识别技术，不是计算机视觉。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087108", "t": 2, "q": "以下哪些指标可用于评估AI算力芯片在深度学习推理任务中的性能？（　）", "a": ["处理单条语音识别请求的延迟时间（Latency）", "每秒处理的图像数量（FPS）", "训练一个完整模型所需的时间（Training Time）", "模型推理过程中的功耗（Power Consumption）", "", ""], "r": "ABD", "e": "深度学习推理是用训练好的模型进行预测等操作。A选项处理单条语音识别请求延迟体现推理响应速度；B选项每秒处理图像数量反映推理处理能力；D选项推理功耗衡量推理时能耗。而C选项训练时间是训练模型的指标，并非推理任务性能指标。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087109", "t": 2, "q": "以下哪些AI算力芯片的技术趋势可满足未来人工智能模型（如大模型）的发展需求？（　）", "a": ["芯片算力持续提升，支持更大规模参数模型的训练", "芯片间互联技术升级，提升多芯片协同效率", "低精度计算技术普及（如FP8、INT4），平衡性能与功耗", "芯片与存储系统协同优化，解决大模型的内存瓶颈", "", ""], "r": "ABCD", "e": "未来人工智能大模型发展需要高算力、高效协同、低功耗以及解决内存瓶颈等。A能提供足够算力支持大规模模型训练；B可让多芯片更好协作；C低精度计算能在保证性能时降低功耗；D能解决大模型内存难题，这些都是满足发展需求的技术趋势。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087110", "t": 2, "q": "以下哪些AI算力芯片的技术特点使其适合用于深度学习模型的训练任务？（　）", "a": ["支持高精度浮点运算（如FP32、FP16）", "支持模型量化和剪枝等压缩技术", "具备大量并行计算单元（如CUDA核心、TPU核心）", "采用低功耗设计，优先考虑能效比", "", ""], "r": "AC", "e": "深度学习训练任务计算量大、精度要求高，需要芯片有强大的计算能力和精度支持。选项A高精度浮点运算能满足训练对精度的要求；选项C大量并行计算单元可提升计算效率，加快训练速度。选项B模型量化和剪枝多用于推理阶段优化；选项D低功耗设计主要针对推理场景的设备续航等问题，并非训练任务重点。所以答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087111", "t": 2, "q": "以下哪些AI算力芯片属于\"通用型AI芯片\"，而非\"专用型AI芯片\"？（　）", "a": ["GPU", "CPU", "ASIC（如谷歌TPU v4）", "FPGA", "", ""], "r": "ABD", "e": "通用型芯片可处理多种不同类型任务，专用型芯片针对特定任务优化。CPU是通用处理器；GPU常用于图形处理，也能处理多种AI计算任务，具有一定通用性；FPGA可通过编程灵活实现不同功能，通用性强。而ASIC是为特定任务定制的专用芯片。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087112", "t": 2, "q": "以下哪些AI算力芯片属于\"专用人工智能芯片\"（即专为AI任务设计的芯片）？", "a": ["TPU（张量处理单元）", "NPU（神经网络处理单元）", "GPU（图形处理器）", "ASIC（专用集成电路）", "", ""], "r": "ABD", "e": "TPU、NPU、ASIC都是专为AI任务设计的专用芯片，GPU虽常用于AI但原是为图形处理设计，不属于专用AI芯片。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087113", "t": 2, "q": "以下属于人工智能\"无监督学习\"典型应用场景的有哪些？", "a": ["基于用户历史购买记录，为用户推荐商品（协同过滤）", "根据标注的\"疾病诊断数据\"，训练疾病预测模型", "根据标注的\"垃圾邮件\"和\"正常邮件\"数据，训练垃圾邮件分类模型", "对客户评论数据进行聚类，划分不同的评论主题", "", ""], "r": "AD", "e": "答案：AD", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087114", "t": 2, "q": "在人工智能的发展中，以下哪些技术突破推动了深度学习的快速崛起？（　）", "a": ["GPU等专用算力芯片的出现，提升了并行计算能力", "dropout、批归一化等正则化技术的应用", "反向传播算法（Backpropagation）的提出", "预训练-微调范式的普及", "", ""], "r": "ABCD", "e": "GPU提升并行计算能力为深度学习提供算力支持；正则化技术提升模型泛化能力；反向传播算法是深度学习核心算法基础；预训练 - 微调范式提高模型训练效率和效果，都推动了深度学习快速崛起。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087115", "t": 2, "q": "在人工智能的基本概念中，以下哪些属于\"弱人工智能（ANI）\"的典型特征？（　）", "a": ["仅能在特定领域完成专业化任务", "依赖人类设计的算法和训练数据", "不具备自主意识和通用思考能力", "可在所有领域的智能水平上超越人类", "", ""], "r": "ABC", "e": "弱人工智能能力有限，只能在特定领域工作，依赖人类设计的算法和数据，且无自主意识和通用思考能力，而能在所有领域智能水平超越人类是强人工智能特点。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087116", "t": 2, "q": "在人工智能的伦理规范中，以下哪些原则属于\"负责任的AI\"所倡导的核心原则？（　）", "a": ["公平性（Fairness）: 避免AI对特定群体产生歧视性影响", "透明性（Transparency）: AI的决策逻辑可解释、可追溯", "可控性（Accountability）: 明确AI决策的责任主体", "隐私性（Privacy）: 保护AI应用中涉及的用户个人数据", "", ""], "r": "ABCD", "e": "“负责任的AI”强调AI在多方面的合理与规范。公平性可防止歧视，透明性能让决策逻辑清晰，可控性明确责任归属，隐私性保护用户数据，ABCD四个选项都是“负责任的AI”核心原则。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087117", "t": 2, "q": "在人工智能的应用安全中，以下哪些措施可用于防范\"算法偏见\"带来的风险？（　）", "a": ["构建多样化、无偏的训练数据集，避免特定群体样本缺失", "采用\"黑箱\"模型，不公开模型的决策逻辑", "对模型的决策结果进行定期审计，检测是否存在群体歧视", "在模型训练过程中引入公平性约束损失函数", "", ""], "r": "ACD", "e": "算法偏见防范需从数据、模型训练和结果检测等方面入手。A可避免因数据偏差导致偏见；C能及时发现决策结果中的歧视；D在训练时引入公平性约束可减少偏见。而B“黑箱”模型不公开决策逻辑不利于发现和纠正算法偏见。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087118", "t": 2, "q": "在人工智能的应用落地中，以下哪些属于\"计算机视觉\"技术的典型应用场景？（　）", "a": ["安防监控中的人脸识别、异常行为检测", "智能客服中的文本意图识别、语音交互", "工业质检中的产品缺陷识别、尺寸测量", "自动驾驶中的车道线检测、障碍物识别", "", ""], "r": "ACD", "e": "计算机视觉是让计算机像人一样“看”世界。A选项安防监控识别人脸和检测异常行为、C选项工业质检识别产品缺陷和测量尺寸、D选项自动驾驶检测车道线和障碍物，都涉及对图像或视频进行分析处理，属于计算机视觉应用。B选项智能客服的文本意图识别和语音交互主要是自然语言处理范畴。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087119", "t": 2, "q": "在图像分割任务中，以下哪些属于\"语义分割\"与\"实例分割\"的区别？（　）", "a": ["实例分割不仅区分像素类别，还区分同一类别的不同个体（如区分\"车1\"\"车2\"）", "语义分割仅区分像素的类别（如\"人\"\"车\"\"道路\"），不区分同一类别的不同个体", "语义分割的输出是类别标签图，实例分割的输出是类别标签+个体ID图", "语义分割的精度要求高于实例分割", "", ""], "r": "ABC", "e": "语义分割只区分像素类别，不区分同一类别不同个体，输出类别标签图；实例分割不仅区分像素类别，还区分同一类别不同个体，输出类别标签和个体ID图。而通常实例分割难度大，精度要求更高。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087120", "t": 2, "q": "在图像生成任务中，以下哪些模型架构属于\"生成式对抗网络（GAN）\"的衍生模型，用于提升图像生成质量或拓展应用场景？（　）", "a": ["CycleGAN（用于图像风格迁移）", "Diffusion Model（扩散模型）", "Pix2Pix（用于条件图像生成）", "DCGAN（深度卷积生成对抗网络）", "", ""], "r": "ACD", "e": "Diffusion Model不是GAN的衍生模型，CycleGAN、Pix2Pix、DCGAN都是GAN的衍生模型，用于提升图像生成质量或拓展应用场景。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087121", "t": 2, "q": "在图像识别技术中，以下哪些算法属于\"深度学习-based\"的图像识别算法？", "a": ["YOLO（You Only Look Once）", "Faster R-CNN", "SVM（支持向量机）", "ResNet（残差网络）", "", ""], "r": "ABD", "e": "YOLO、Faster R - CNN、ResNet 都是深度学习算法，用于图像识别；SVM 是传统机器学习算法。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087122", "t": 2, "q": "在图像识别技术中，以下哪些因素会导致模型出现\"过拟合\"现象？（　）", "a": ["训练过程中使用了数据增强技术（如随机旋转、翻转）", "训练迭代次数过少，模型未充分学习数据特征", "模型架构过于复杂（如过多的卷积层和全连接层）", "模型在训练集上的准确率过高，在测试集上的准确率过低", "", ""], "r": "CD", "e": "过拟合是指模型在训练数据上表现很好，但在新数据（测试集）上表现不佳。数据增强技术能增加数据多样性，减少过拟合；训练迭代次数过少是欠拟合，不是过拟合；模型架构过于复杂易导致过拟合；模型在训练集准确率高、测试集准确率低是过拟合的表现。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087123", "t": 2, "q": "在图像识别中，\"目标跟踪\"任务与\"目标检测\"任务的区别和联系包括以下哪些？", "a": ["目标检测的精度直接影响目标跟踪的性能", "目标跟踪不需要目标检测的支持，可独立完成", "目标跟踪通常依赖目标检测的结果（如第一帧的目标位置）", "目标检测是静态任务，仅需识别单帧图像中的目标;目标跟踪是动态任务，需跟踪视频序列中目标的运动轨迹", "", ""], "r": "ACD", "e": "目标检测是识别单帧图像目标，为目标跟踪提供初始目标位置等信息，其精度会影响目标跟踪性能，目标跟踪依赖目标检测结果且是跟踪视频中目标轨迹的动态任务。B选项错误，目标跟踪需要目标检测支持。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087124", "t": 2, "q": "在图像识别中，\"数据增强\"技术的主要目的和常用方法包括以下哪些？", "a": ["增加训练数据的多样性，提升模型的泛化能力", "减少训练数据量，降低存储成本", "仅适用于训练阶段，不适用于测试阶段", "常用方法包括添加高斯噪声、模糊处理", "", ""], "r": "ACD", "e": "数据增强是为增加训练数据多样性，让模型接触更多样数据以提升泛化能力，常用方法有添加高斯噪声、模糊处理等，它主要用于训练阶段。而它是增加数据多样性并非减少训练数据量。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087125", "t": 2, "q": "在语音识别的\"端点检测\"环节，下列哪些因素会直接影响检测准确性，导致误判语音起始/结束位置？（　）", "a": ["输入语音的采样率", "语音信号的语速", "背景噪声的类型（如稳态噪声、非稳态噪声）", "环境噪声强度", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087126", "t": 2, "q": "在语音识别的降噪处理中，以下哪些技术可有效去除语音信号中的背景噪声？（　）", "a": ["端点检测（Endpoint Detection）", "维纳滤波（Wiener Filtering）", "波束成形（Beamforming）", "梅尔频率倒谱系数（MFCC）提取", "", ""], "r": "BC", "e": "端点检测是确定语音起点和终点；梅尔频率倒谱系数提取是特征提取方法。维纳滤波能根据噪声统计特性进行滤波降噪，波束成形可通过调整天线阵列方向增强语音信号、抑制背景噪声。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087127", "t": 2, "q": "在语音识别系统的性能优化中，以下哪些技术措施能够有效提升识别准确率？", "a": ["简化语言模型，减少词汇量和语法规则", "增加训练数据量，尤其是包含多种口音、噪声环境的语音数据", "优化声学模型，采用深度学习架构（如CNN、Transformer）", "在预处理阶段加入噪声抑制、回声消除模块", "", ""], "r": "BCD", "e": "简化语言模型会使识别覆盖范围变小，不利于提升准确率；增加多样训练数据能让模型学习更多特征，优化声学模型可提升对语音特征的学习能力，预处理加入降噪等模块能改善输入语音质量，后三者都有助于提升识别准确率。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087128", "t": 2, "q": "在语音识别中，\"语言模型\"的主要作用包括以下哪些？", "a": ["根据上下文信息，预测可能的文字序列，提升识别准确性", "建立语音特征与音素之间的映射关系", "限制识别结果的词汇范围，符合特定应用场景（如医疗领域的专业词汇）", "处理语音信号中的噪声，提升信号质量", "", ""], "r": "AC", "e": "语言模型能结合上下文预测文字序列来提高识别准确性，也可限制词汇范围适应特定场景。B项是声学模型作用，D项是语音预处理工作。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087129", "t": 2, "q": "在语音识别中，以下哪些因素会导致识别准确率下降？", "a": ["训练数据集中包含多种口音和噪声环境的数据", "背景噪声较强（如工厂车间、交通路口）", "语言模型的词汇量不足，无法覆盖识别所需的词汇", "语音信号采样率过低，丢失关键信息", "", ""], "r": "BCD", "e": "A选项训练数据包含多种口音和噪声环境数据会提升模型适应性和准确率；B背景噪声强会干扰语音识别；C词汇量不足无法覆盖所需词汇，影响识别；D采样率低丢失关键信息也会使准确率下降。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087130", "t": 2, "q": "自然语言处理中，“分词”是中文NLP的基础任务，以下哪些属于中文分词的常用算法？", "a": ["基于深度学习的分词算法（如BiLSTM-CRF）", "基于规则的分词算法（如正则表达式匹配）", "基于统计的分词算法（如隐马尔可夫模型HMM）", "基于词典的分词算法（如正向最大匹配法）", "", ""], "r": "ABCD", "e": "中文分词常用算法有基于词典（如正向最大匹配法）、基于规则（如正则表达式匹配）、基于统计（如隐马尔可夫模型HMM）以及基于深度学习（如BiLSTM - CRF）的方法。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087131", "t": 2, "q": "自然语言处理中，\"机器阅读理解（MRC）\"任务的核心要求包括以下哪些？", "a": ["模型需理解用户提出的问题，该问题的答案隐含在上下文之中", "模型无需依赖上下文，仅通过常识即可回答问题", "模型需从上下文的一个或多个位置提取答案（如实体、短语、句子）", "模型需通过语义匹配或推理，判断上下文是否包含答案，若不含则输出“无法回答”。", "", ""], "r": "AC", "e": "A. 正确：MRC 的核心前提是问题的答案隐含在给定的上下文之中，模型需要先理解用户提出的问题，然后从上下文中寻找或推理出答案。<br />B. 错误：MRC 任务必须依赖给定的上下文，而不是仅凭常识或模型自身的预训练知识。如果脱离上下文，则属于“常识问答”或“开放域问答”，不属于 MRC 的定义范畴。<br />C. 正确：这是 MRC 中最常见的抽取式（Extractive） 任务形式。模型需要从上下文中定位并提取出连续的片段（如一个实体、一个短语或一个完整句子）作为答案。<br />D. 正确：这是 MRC 中的可回答性判断（Answerability） 或 拒答机制。在实际任务（如 SQuAD 2.0）中，模型不仅要能提取答案，还需要判断上下文是否包含足以回答问题的信息。若上下文不含答案，模型应输出“无法回答”（或类似标识），而非强行编造答案。<br />因此，正确选项为 A、C、D。", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087132", "t": 2, "q": "自然语言处理中，\"语义理解\"的核心任务包括以下哪些？", "a": ["识别文本中的命名实体（如人名、地名）", "理解句子的语义结构（如主谓宾关系）", "理解文本中词语的语义（如多义词消歧）", "理解文本的上下文逻辑关系（如因果、转折）", "", ""], "r": "BCD", "e": "语义理解要处理词语、句子结构及上下文逻辑等多方面语义信息，A识别命名实体属于信息提取，B理解句子语义结构、C理解词语语义、D理解上下文逻辑关系都是语义理解核心任务。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087133", "t": 2, "q": "自然语言处理中，\"预训练语言模型\"（如BERT、GPT）的优势包括以下哪些？", "a": ["预训练模型仅能处理英文文本，无法处理中文文本", "预训练模型的参数规模越小，性能越好", "在下游任务（如文本分类、NER）上仅需少量微调即可获得高性能", "通过在大规模无标注文本上预训练，获得通用语言知识", "", ""], "r": "CD", "e": "A选项错误。预训练语言模型不仅能够处理英文文本，同样也能处理包括中文在内的多种语言文本。例如，BERT有专门针对多语言环境设计的版本，可以有效地应用于不同语种。<br />B选项错误。通常情况下，预次数模型的性能与参数量呈正相关关系，即更大的参数规模往往意味着更强的学习能力和更好的表现。但同时也要注意到，过大的模型可能会导致计算资源消耗增加及潜在的过拟合风险。<br />C选项正确。预训练模型的一个重要优势就是其迁移学习能力，在解决特定下游任务时，只需要基于预训练权重进行少量调整或微调，就能快速达到较高的准确率，这大大减少了从零开始训练模型所需的时间和数据量。<br />D选项正确。预训练过程利用了海量未标记的数据来学习语言的基本结构和模式，从而形成了一种通用的语言表示形式。这种先验知识对于提高后续各种NLP任务的表现非常有帮助。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087134", "t": 2, "q": "自然语言处理中，“注意力机制”的主要作用包括以下哪些？", "a": ["在处理长文本序列时，动态关注序列中对当前任务更重要的部分", "增强模型对文本语义的理解能力，提升任务准确率", "仅能应用于编码器结构，无法用于解码器结构", "减少模型的计算量，降低训练难度", "", ""], "r": "AB", "e": "注意力机制在自然语言处理中的作用主要体现在两个方面：一是动态地关注输入序列中对当前任务更重要的部分，这有助于处理长文本序列时的信息筛选和聚焦；二是通过这种机制可以增强模型对文本语义的理解能力，从而提升任务的准确率。对于选项C，注意力机制不仅应用于编码器结构，也广泛应用于解码器结构，如在Transformer模型中的自注意力机制就是一个典型例子，因此C错误。至于选项D，注意力机制实际上可能会增加模型的计算量，因为它需要对输入序列中的每个元素进行权重计算，所以D也是错误的。综上所述，正确答案是AB。", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087135", "t": 2, "q": "自然语言处理中，以下哪些技术可用于解决\"词向量稀疏性\"问题，即低频词或未登录词无法获得有效向量表示的问题？（　）", "a": ["词干提取（Stemming）和词形还原（Lemmatization）", "使用字符级嵌入（Character-level Embedding）", "上下文相关的词向量（如BERT的Token Embedding）", "预训练词向量（如Word2Vec、GloVe）", "", ""], "r": "BC", "e": "词干提取和词形还原主要用于词汇归一化；使用字符级嵌入可通过字符信息为低频或未登录词生成向量；上下文相关词向量能结合上下文赋予未登录词向量；预训练词向量对未登录词处理能力有限。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087136", "t": 2, "q": "自然语言处理中，以下哪些技术属于\"预训练语言模型\"的优化方向，以提升模型性能或适配特定场景？（　）", "a": ["模型压缩（如量化、剪枝、知识蒸馏）", "增加模型参数规模（如GPT-3、PaLM的千亿级参数）", "多语言预训练（支持多种语言的处理）", "领域自适应预训练（如医疗、法律领域专用预训练）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087137", "t": 2, "q": "自然语言处理中，以下哪些任务属于\"生成式NLP任务\"？", "a": ["命名实体识别（如识别文本中的人名、地名）", "文本分类（如将邮件分类为垃圾邮件或正常邮件）", "文本摘要（如将新闻稿浓缩为摘要）", "对话系统（如智能客服生成回复语句）", "", ""], "r": "CD", "e": "生成式NLP任务是要生成新的文本内容。A选项命名实体识别和B选项文本分类主要是对文本进行分析和归类，不生成新文本。C选项文本摘要和D选项对话系统都涉及生成新的文本内容，属于生成式NLP任务。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087138", "t": 2, "q": "自然语言处理中，以下哪些任务属于\"文本理解\"类任务，而非\"文本生成\"类任务？（　）", "a": ["命名实体识别（NER）", "对话生成", "文本情感分析", "文章自动写作", "", ""], "r": "AC", "e": "文本理解是对已有文本进行分析和理解，文本生成是创造新文本。A命名实体识别和C文本情感分析是对文本内容进行解析，属于文本理解；B对话生成和D文章自动写作是产生新的文本，属于文本生成。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087139", "t": 2, "q": "自然语言处理中，以下哪些任务需要解决\"上下文依赖\"问题，即需结合文本的前后内容才能准确处理？（　）", "a": ["句子相似度计算（如判断\"我吃了苹果\"和\"苹果被我吃了\"是否同义）", "语义角色标注（如判断句子中\"主语\"\"宾语\"的语义角色）", "关键词提取（如从\"人工智能技术发展迅速\"中提取\"人工智能\"）", "文本歧义消解（如\"打电话\"和\"打篮球\"中\"打\"的含义区分）", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087140", "t": 2, "q": "自然语言处理中，以下哪些属于\"文本生成\"任务的关键挑战？（　）", "a": ["生成文本的多样性（如避免重复生成相同或相似的内容）", "生成文本的可理解性（如确保内容易于理解，而非仅仅避免使用过于专业的术语）", "生成文本的语义连贯性（如上下文逻辑一致，无前后矛盾）", "生成文本的语法正确性（如避免语法错误、保证语句通顺）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813974071087141", "t": 2, "q": "AI算力芯片的\"算力密度\"是衡量芯片性能的重要指标，以下关于算力密度的描述正确的有哪些？", "a": ["算力密度越高，说明芯片在相同面积下提供的算力越强", "提升算力密度的方法包括采用更先进的制程工艺、优化电路设计", "算力密度通常指单位面积芯片所能提供的算力（如FLOPS/mm²）", "算力密度与芯片的功耗无关，仅与算力相关", "", ""], "r": "ABC", "e": "算力密度指单位面积芯片提供的算力，越高代表相同面积算力越强，可通过先进制程和优化电路提升；而算力密度和功耗有关，功耗会影响芯片实际性能发挥。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756800", "t": 3, "q": "语音信号的\"预加重\"处理步骤，主要目的是提升语音信号中低频成分的能量，增强低频信息的辨识度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "预加重主要是提升语音信号中高频成分的能量，增强高频信息辨识度，而非低频。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756801", "t": 3, "q": "在强化学习中，Q-learning算法是一种基于价值的算法，其核心是学习一个Q函数（状态-动作价值函数），用于评估在特定状态下执行某个动作的预期长期奖励，进而选择最优动作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Q - learning是典型基于价值的强化学习算法，重点就是学习Q函数来评估状态 - 动作对的预期长期奖励以选最优动作。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756802", "t": 3, "q": "在人工智能的伦理问题中，算法偏见的产生仅与训练数据的偏见有关（如数据中特定群体样本不足或标签带有歧视），与模型架构和训练过程无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "算法偏见的产生不仅与训练数据的偏见有关，模型架构和训练过程也可能导致算法偏见，比如模型设计不合理、训练参数设置不当等。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756803", "t": 3, "q": "在图像目标检测任务中，单阶段检测模型（如YOLO、SSD）相比两阶段检测模型（如Faster R-CNN），具有检测速度更快的优势，因此更适合对实时性要求高的场景（如自动驾驶）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756804", "t": 3, "q": "在图像目标检测中，YOLO模型通过将图像划分为多个网格，每个网格预测目标的边界框和类别概率，实现了端到端的目标检测，其检测速度快，适合实时检测场景，但对小目标的检测精度较低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "YOLO模型确实是把图像划分成网格，每个网格预测目标框和类别概率，达成端到端检测，速度快适合实时场景，且存在对小目标检测精度低的问题。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756805", "t": 3, "q": "在图像识别中，数据增强技术（如随机旋转、翻转、裁剪、添加噪声）通过扩充训练数据集的多样性，能够有效提升模型的泛化能力，减少过拟合现象的发生。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据增强通过对原始数据进行各种变换，增加了训练数据的多样性，让模型学习到更多不同特征，能更好适应新数据，可提升泛化能力并减少过拟合。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756806", "t": 3, "q": "在语音识别的预处理阶段，分帧操作是将连续的语音信号分割成若干个重叠的短帧（如20-30ms），其目的是将非平稳的语音信号近似视为平稳信号，以便进行后续的特征提取。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "语音信号本身是非平稳的，但在短时间内（如20 - 30ms）可近似看成平稳信号，分帧操作就是把连续语音信号分割成这样的短帧，利于后续特征提取。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756807", "t": 3, "q": "在语音识别中，端点检测的作用是从包含噪声的语音信号中准确区分语音段和静音段，仅保留语音段用于后续处理，以减少噪声对识别性能的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "端点检测就是要从有噪声的语音信号里区分出语音段和静音段，只留语音段处理，这样能降低噪声对识别性能的干扰。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756808", "t": 3, "q": "在语音识别中，声学模型的作用是建立语音信号的声学特征（如MFCC）与语言的音素序列之间的映射关系，而语言模型则负责将音素序列转换为符合语法规则的文本序列。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "声学模型确实是建立语音信号声学特征与音素序列的映射，语言模型也的确是把音素序列转化为符合语法规则的文本序列。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756809", "t": 3, "q": "在语音识别中，语言模型的性能仅取决于模型的架构（如RNN、Transformer），与训练语言模型所使用的文本语料的规模和领域相关性无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "语言模型性能不仅受模型架构影响，训练所用文本语料的规模和领域相关性也至关重要。大规模且领域相关的语料能让模型学习到更丰富准确的语言模式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756810", "t": 3, "q": "在语音信号处理中，梅尔频率倒谱系数（MFCC）的提取过程包括预加重、分帧、加窗、傅里叶变换、梅尔滤波、对数运算、离散余弦变换（DCT）等步骤，能够模拟人耳对声音的感知特性，是语音识别中最常用的特征之一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "该描述准确阐述了MFCC提取过程及特点，它的确能模拟人耳感知特性且是语音识别常用特征。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756811", "t": 3, "q": "自然语言处理中的\"对话系统\"，所有回复均由模型实时生成，无需依赖预设的对话模板或知识库。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "对话系统有基于规则、基于检索、基于生成等不同类型，并非所有回复都由模型实时生成，很多会依赖预设对话模板或知识库。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756812", "t": 3, "q": "自然语言处理中的\"分词\"任务，对于中文和英文的处理逻辑完全一致，均需根据空格或标点符号进行词汇切分。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "英文有天然空格区分单词，按空格等切分较简单；而中文句子中词与词无明显分隔，不能仅靠空格或标点切分，需借助专门分词算法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756813", "t": 3, "q": "自然语言处理中的\"分词\"任务是中文NLP特有的基础任务，英文NLP无需分词，因为英文单词天然以空格分隔。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然英文单词天然以空格分隔，但英文NLP也存在分词需求，比如处理缩写、复合词等情况。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756814", "t": 3, "q": "自然语言处理中的\"机器翻译\"任务，基于深度学习的NMT模型性能一定优于传统的SMT模型，在所有场景下都无需使用SMT。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然NMT模型在很多场景表现出色，但不能绝对说其在所有场景性能都优于SMT，有些特定场景SMT仍有优势，所以不能完全摒弃SMT。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756815", "t": 3, "q": "自然语言处理中的\"机器翻译\"任务，基于神经网络的机器翻译（NMT）方案相比传统的统计机器翻译（SMT）方案，具有翻译精度更高、对长句处理效果更好、无需手动设计特征和规则的优势。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "NMT利用神经网络学习源语言和目标语言的映射，能自动学习特征和规则，减少人工干预，对长句处理能力强，且通常翻译精度更高，相比SMT优势明显。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756816", "t": 3, "q": "自然语言处理中的\"机器翻译\"任务，目前已完全解决了多义词、歧义句的翻译问题，翻译结果的准确性与人类翻译完全一致。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "当前自然语言处理的机器翻译虽有进步，但多义词、歧义句的翻译问题未完全解决，翻译准确性和人类翻译有差距。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756817", "t": 3, "q": "自然语言处理中的\"机器阅读理解（MRC）\"任务，仅需模型能从文本中提取与问题相关的关键词即可，无需具备逻辑推理能力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机器阅读理解不仅要提取关键词，还需具备逻辑推理能力来理解文本语义、处理复杂问题等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756818", "t": 3, "q": "自然语言处理中的\"机器阅读理解（MRC）\"任务，问题的", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756819", "t": 3, "q": "自然语言处理中的\"命名实体识别（NER）\"任务，仅能识别人名、地名、机构名等常见实体，无法识别专业领域实体（如医学术语、金融术语）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。命名实体识别除了能识别常见的人名、地名、机构名，也能通过特定的训练和模型设定对不同专业领域实体（像医学术语、金融术语）进行识别。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756820", "t": 3, "q": "自然语言处理中的\"命名实体识别（NER）\"任务属于序列标注任务，其目标是从文本中识别并分类具有特定意义的实体（如人名、地名、组织机构名），该任务无需依赖上下文信息即可完成准确识别。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "命名实体识别虽属于序列标注任务，但很多时候需要依赖上下文信息才能准确识别实体，比如“苹果”，在不同语境可能指水果或公司。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756821", "t": 3, "q": "自然语言处理中的\"情感分类\"任务，仅能判断文本的正面或负面情感，无法识别中性情感或更细分的情感类别（如喜悦、愤怒）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自然语言处理的情感分类任务不仅能判断正负情感，也可以识别中性情感以及更细分的情感类别。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756822", "t": 3, "q": "自然语言处理中的\"情感分析\"任务，仅能判断文本的情感极性（如积极/消极/中性），无法识别更细粒度的情感类别（如高兴、愤怒、悲伤）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自然语言处理的情感分析不仅能判断情感极性，也可识别更细粒度情感类别。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756823", "t": 3, "q": "自然语言处理中的\"情感分析\"任务仅能判断文本的情感倾向（如积极、消极、中性），无法识别情感的强度（如\"非常满意\"\"比较满意\"）和具体情感类型（如\"开心\"\"愤怒\"\"悲伤\"）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自然语言处理中的情感分析不仅能判断文本的情感倾向，也可识别情感强度和具体情感类型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756824", "t": 3, "q": "自然语言处理中的\"上下文无关文法\"，可完全描述自然语言的所有语法规则，适用于所有NLP任务的句法分析。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自然语言具有高度的复杂性、灵活性和歧义性，上下文无关文法有局限性，无法完全描述自然语言所有语法规则，也不适用于所有NLP任务的句法分析。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756825", "t": 3, "q": "自然语言处理中的\"文本摘要\"任务，仅需提取文本中的关键词拼接即可生成准确摘要，无需理解文本语义逻辑。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。仅提取关键词拼接不能生成准确摘要，因为文本语义逻辑对于理解文本核心内容至关重要，不考虑语义逻辑可能使摘要无法准确反映原文主旨。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756826", "t": 3, "q": "自然语言处理中的\"文本摘要生成\"任务属于生成式任务，其目标是从原始文本中提取关键信息，生成简洁、连贯的摘要。该任务仅需对文本进行提取式处理，无需生成新的句子。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "文本摘要生成虽有提取式，但也有生成式，生成式需产生新句子来形成摘要，并非仅进行提取式处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756827", "t": 3, "q": "自然语言处理中的\"预训练语言模型\"（如BERT、GPT）在预训练阶段学习通用语言知识，在微调阶段仅需使用少量目标任务的标注数据，即可适配具体任务（如情感分析、机器翻译），大幅降低了对目标任务标注数据的需求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "预训练语言模型先在大规模无标注文本上学习通用语言知识，微调时用少量目标任务标注数据就能适配具体任务，减少了对标注数据的依赖。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756828", "t": 3, "q": "自然语言处理中的\"预训练语言模型\"（如GPT）在下游任务中使用时，无需对模型结构或参数进行任何调整，可直接使用预训练模型进行预测。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "预训练语言模型虽有强大能力，但下游任务有其独特性，通常需要对模型进行微调，即调整部分参数以适配任务，不能直接使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756829", "t": 3, "q": "自然语言处理中的\"注意力机制\"仅能关注输入序列中的单个位置，无法同时关注多个重要位置。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "注意力机制能让模型在处理输入序列时，同时关注多个重要位置，并非只能关注单个位置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756830", "t": 3, "q": "自然语言处理中的\"BERT模型\"是基于Transformer的编码器结构，仅能处理英文文本，无法处理中文文本。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BERT模型虽基于Transformer编码器结构，但它并非只能处理英文文本，也有针对中文训练的模型来处理中文文本。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756831", "t": 3, "q": "自然语言处理中的\"Transformer架构\"完全替代了循环神经网络（RNN），目前所有NLP任务（如文本分类、机器翻译、文本生成）均采用Transformer架构，RNN已不再用于实际应用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然Transformer架构在自然语言处理中应用广泛且优势明显，但并没有完全替代RNN。RNN在处理序列数据时有其独特优势，比如在处理一些对序列顺序敏感、数据量相对小的任务时仍有应用，并非不再用于实际应用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756832", "t": 3, "q": "自然语言处理中的\"Transformer模型\"完全依赖自注意力机制处理序列数据，没有使用循环结构或卷积结构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Transformer模型核心就是自注意力机制，其架构设计中未使用传统的循环结构（如RNN）和卷积结构来处理序列数据。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756833", "t": 3, "q": "自然语言处理中的BERT模型采用双向注意力机制，能够同时捕捉文本中每个词与左右两侧上下文的依赖关系，因此相比单向注意力的GPT模型，更适合文本理解类任务（如情感分析、阅读理解）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "BERT用双向注意力，可兼顾词左右上下文信息，利于理解文本语义；GPT是单向注意力，在文本理解上不如BERT。所以BERT更适合文本理解类任务。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756834", "t": 3, "q": "AI算力集群的训练效率仅取决于集群中计算节点的数量，节点数量越多，训练速度越快，与节点间的互联带宽、数据加载速度、并行策略无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。AI算力集群训练效率受多种因素影响，并非仅取决于计算节点数量，节点间互联带宽影响数据传输速度，数据加载速度影响数据供应，并行策略影响计算资源分配和任务执行方式，都会对训练速度产生作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756835", "t": 3, "q": "AI算力集群中，数据并行是将训练数据分割成多个子集，分配给不同的计算节点，每个节点训练完整的模型并独立更新参数，最后汇总所有节点的参数得到最终模型。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据并行是把训练数据分割给不同节点，各节点有完整模型，但参数更新需同步协调而非独立更新，最后汇总更新后的参数得最终模型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756836", "t": 3, "q": "AI算力集群中的模型并行技术，是将模型的不同层或不同参数分配给不同的计算节点，每个节点仅负责模型的一部分计算，通过节点间的协同完成整个模型的训练，该技术适合处理参数规模过大、单个节点无法容纳的大模型。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "模型并行技术的确是把模型不同层或参数分给不同计算节点，各节点负责部分计算再协同完成训练，能解决大模型参数多单个节点装不下的问题。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756837", "t": 3, "q": "AI算力芯片的\"理论峰值性能（如TOPS）\"能够完全反映芯片在实际AI任务中的计算能力，峰值性能越高，芯片处理实际任务的速度一定越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "理论峰值性能只是理想情况下的指标，实际AI任务受数据传输、算法适配等多种因素影响，所以不能仅依据理论峰值性能判断芯片处理实际任务的速度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756838", "t": 3, "q": "AI算力芯片的\"每秒浮点运算次数（FLOPS）\"数值越高，说明芯片的算力越强，在所有AI任务中的性能表现都一定更优。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "FLOPS数值高通常意味着芯片算力强，但不同AI任务对芯片性能要求不同，如有的任务更看重内存带宽等其他因素，所以不是在所有AI任务中性能表现都一定更优。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756839", "t": 3, "q": "AI算力芯片的\"模型量化\"技术通过将模型参数和计算的精度从高精度（如FP32）降低到低精度（如INT8、INT4），在牺牲少量模型精度的前提下，可显著减少模型的内存占用和计算量，提升推理速度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "模型量化就是把高精度参数和计算降低精度，能减少内存占用与计算量，提升推理速度，虽会牺牲少量精度，但符合描述。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756840", "t": 3, "q": "AI算力芯片的\"内存带宽\"不足会导致运算单元因等待数据而空闲，产生\"内存墙\"问题，降低芯片整体性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "AI算力芯片中，若内存带宽不足，数据传输跟不上运算单元需求，运算单元就会因等待数据而闲置，这就是“内存墙”问题，会降低芯片整体性能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756841", "t": 3, "q": "AI算力芯片的\"能效比（TOPS/W）\"指标反映了芯片在单位功耗下的计算能力，能效比越高，说明芯片在相同功耗下可完成更多计算任务，因此该指标是边缘AI芯片（如手机NPU）的核心评估指标之一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "能效比（TOPS/W）体现单位功耗计算能力，能效比高意味着相同功耗完成更多计算，对于边缘AI芯片，因受功耗限制，该指标很关键，是核心评估指标之一。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756842", "t": 3, "q": "AI算力芯片的\"制程工艺\"越先进（如3nm比7nm），芯片的算力密度和功耗效率通常越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "制程工艺越先进，晶体管尺寸越小，相同面积能集成更多晶体管，算力密度会提高；同时能耗降低，功耗效率也更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756843", "t": 3, "q": "AI算力芯片的理论峰值算力（如TOPS）越高，其处理实际AI任务的速度一定越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "理论峰值算力只是芯片的一个指标，实际处理AI任务速度还受架构、算法适配性、内存带宽等多种因素影响，所以理论峰值算力高不代表处理实际任务速度一定快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756844", "t": 3, "q": "AI算力芯片的内存带宽对深度学习任务性能影响不大，主要影响因素是芯片的计算核心数量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在深度学习任务中，AI算力芯片的内存带宽至关重要。数据在芯片计算核心与内存间频繁传输，若内存带宽不足，即便计算核心数量多，数据传输也会成为瓶颈，影响整体性能，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756845", "t": 3, "q": "AI算力芯片的能效比（TOPS/W）越高，说明芯片在单位功耗下能处理的AI任务越多，越适合边缘计算等低功耗场景。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "能效比（TOPS/W）代表单位功耗可处理的AI任务量，数值越高意味着单位功耗处理能力越强，低功耗场景对功耗要求严格，高TOPS/W芯片符合其需求。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756846", "t": 3, "q": "AI算力芯片中，ASIC（专用集成电路）的定制化程度最高，一旦生产完成，其硬件结构无法修改，适合算法成熟、量产规模大的AI场景。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "ASIC是为特定应用定制的芯片，定制化程度高，生产完成后硬件结构难以修改，在算法成熟且需大规模量产的AI场景中能发挥优势，可降低成本和提高效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756847", "t": 3, "q": "AI算力芯片中，ASIC的制造成本低，适合小规模量产和算法快速迭代的场景。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "ASIC是为特定应用定制的芯片，设计和制造成本高，不适合算法快速迭代，更适合大规模量产。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756848", "t": 3, "q": "AI算力芯片中，CPU虽然并行计算能力较弱，但在AI任务的逻辑控制、数据预处理等环节仍不可或缺。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "CPU设计注重通用性和灵活性，并行计算能力相对GPU等专门的AI芯片弱，但在AI任务里能很好地进行逻辑控制和数据预处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756849", "t": 3, "q": "AI算力芯片中，FPGA（现场可编程门阵列）的优势在于可根据算法需求重构硬件结构，适合AI算法的快速原型验证，但量产成本高于ASIC。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "FPGA能依据算法需求重新配置硬件结构，利于AI算法快速原型验证，而ASIC是为特定应用定制，量产时成本比FPGA低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756850", "t": 3, "q": "AI算力芯片中，GPU相比CPU更适合深度学习任务，核心原因是GPU具备大量并行计算单元，可高效处理深度学习中密集的矩阵运算和卷积操作，而CPU的优势在于串行计算和复杂控制逻辑。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GPU有大量并行计算单元，适合处理深度学习里密集的矩阵运算和卷积操作；CPU擅长串行计算和复杂控制逻辑，所以GPU相比CPU更适合深度学习任务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756851", "t": 3, "q": "AI算力芯片中，NPU（神经网络处理单元）常集成于移动设备（如手机），主要用于处理轻量级AI任务（如人脸解锁、图像美化），功耗较低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "NPU专为神经网络计算设计，适合集成在移动设备里处理轻量级AI任务，且具备低功耗特点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756852", "t": 3, "q": "AI算力芯片中，TPU（张量处理单元）是Google专为深度学习任务设计的专用芯片，其架构优化了矩阵乘法运算，在深度学习推理任务中的效率通常高于通用GPU。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "TPU是谷歌为深度学习设计的专用芯片，针对矩阵乘法运算做了架构优化，在深度学习推理任务方面效率一般比通用GPU高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756853", "t": 3, "q": "AI算力芯片中的\"NPU\"（神经网络处理单元）是专为神经网络运算设计的专用模块，通常集成在嵌入式CPU中，适用于边缘AI场景。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "NPU是专为神经网络运算设计的专用模块，常集成于嵌入式CPU，能在边缘设备高效处理AI任务，适合边缘AI场景。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756854", "t": 3, "q": "AI算力芯片中的\"TPU\"（张量处理单元）是谷歌专为深度学习任务设计的专用芯片，主要优化Transformer模型的张量运算效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "TPU是谷歌专为深度学习任务设计的专用芯片，但它并非主要优化Transformer模型的张量运算效率。TPU推出时Transformer模型还未诞生，它最初是为加速神经网络中的矩阵运算等常见深度学习计算设计的。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756855", "t": 3, "q": "AI算力芯片中的边缘NPU（神经网络处理单元）主要用于云端大规模AI训练任务，其设计优先考虑高性能和高算力，对功耗和体积无严格限制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边缘NPU主要用于边缘设备，进行本地实时推理，而非云端大规模AI训练任务。且边缘设备对功耗和体积有严格限制。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756856", "t": 3, "q": "AI算力芯片中的FPGA（现场可编程门阵列）相比ASIC（专用集成电路），具有灵活性更高、开发周期更短、可重构性强的优势，但在相同AI任务下，FPGA的计算效率和能效比通常低于ASIC。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "FPGA可灵活编程、开发快、能重构，但ASIC是针对特定任务定制，计算效率和能效比在相同AI任务下通常更高。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756857", "t": 3, "q": "AI算力芯片中的TPU（张量处理单元）是谷歌专为深度学习任务设计的ASIC芯片，其架构优化了矩阵乘法和卷积运算，相比GPU，在深度学习推理任务中具有更高的能效比和计算效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "TPU是谷歌为深度学习设计的ASIC芯片，架构针对矩阵乘法和卷积运算优化，在深度学习推理任务里，对比GPU，TPU能效比和计算效率更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756858", "t": 3, "q": "FPGA芯片的\"可重构性\"是指其硬件逻辑可以在芯片出厂后根据需求多次修改，无需重新设计和制造芯片。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "FPGA 芯片的可重构特性允许在芯片制造完成后，通过配置文件多次改变其内部硬件逻辑，不用重新设计和制造芯片。", "ap": [false, false, false, false, false, false]}, {"id": "2034813975639756859", "t": 3, "q": "GPU之所以适合深度学习任务，核心原因是其拥有大量并行计算单元，能够高效处理矩阵乘法等深度学习核心运算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "深度学习中存在大量矩阵乘法等运算，GPU有大量并行计算单元，可同时处理多个任务，能高效完成这些运算，所以适合深度学习任务。 ", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
