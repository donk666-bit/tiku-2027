17265211", "t": 3, "q": "VLAN可将一个物理局域网划分为多个逻辑局域网，不同VLAN间的设备默认可直接通信，无需通过路由器。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "VLAN将物理局域网划分为多个逻辑局域网，不同VLAN间的设备默认不能直接通信，需通过路由器或三层交换机等设备实现通信。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第4章 操作系统（1）", "n": "基础练习题【含解析】 / 第4章 操作系统（1）", "qs": [{"id": "2034813810992353280", "t": 1, "q": "操作系统的主要功能不包括以下哪项？", "a": ["进程管理", "数据库管理", "文件管理", "内存管理", "", ""], "r": "B", "e": "操作系统功能有进程、文件、内存管理等，数据库管理是数据库管理系统的功能，并非操作系统主要功能。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810992353281", "t": 1, "q": "操作系统中，系统调用和库函数的主要区别是？", "a": ["系统调用更高效", "库函数在用户态执行", "系统调用涉及模式切换", "库函数由操作系统提供", "", ""], "r": "C", "e": "系统调用是用户程序向操作系统内核请求服务，会从用户态切换到内核态，涉及模式切换；库函数是对系统调用的封装，在用户态执行。A选项系统调用因涉及模式切换，效率不一定更高；B选项是事实但未体现与系统调用主要区别；D选项库函数通常由编程语言提供而非操作系统。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547584", "t": 1, "q": "操作系统中，银行家算法用于？", "a": ["死锁预防", "死锁恢复", "死锁避免", "死锁检测", "", ""], "r": "C", "e": "银行家算法通过在资源分配前进行安全性检查，避免系统进入不安全状态，从而避免死锁发生。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547585", "t": 1, "q": "进程在运行过程中，因等待某事件发生而放弃CPU，此时进程的状态转换为", "a": ["运行态→就绪态", "就绪态→运行态", "阻塞态→就绪态", "运行态→阻塞态", "", ""], "r": "D", "e": "进程运行中等待事件发生放弃CPU，意味着进程无法继续执行进入等待状态，即从运行态变为阻塞态。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547586", "t": 1, "q": "嵌入式系统设计中，“功耗优化”的常用方法不包括", "a": ["使用动态电压频率调节（DVFS）技术", "增加内存容量", "关闭空闲设备的电源", "采用低功耗处理器", "", ""], "r": "B", "e": "增加内存容量主要是为了提升系统的数据存储和处理能力，与功耗优化无关。而DVFS技术可根据负载动态调整电压和频率降低功耗，关闭空闲设备电源能减少不必要能耗，采用低功耗处理器本身就降低了功耗。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547587", "t": 1, "q": "嵌入式系统设计中，“硬件抽象层（HAL）”的主要作用是", "a": ["优化内存分配，减少内存碎片", "直接控制硬件设备，提高运行效率", "管理任务调度，保证实时性", "隐藏硬件细节，使操作系统和应用程序与硬件无关", "", ""], "r": "D", "e": "硬件抽象层主要功能是将硬件细节隐藏起来，让操作系统和应用程序不用关心具体硬件，实现与硬件的无关性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547588", "t": 1, "q": "嵌入式系统通常使用哪种类型的操作系统？", "a": ["分布式系统", "实时操作系统", "批处理系统", "分时系统", "", ""], "r": "B", "e": "嵌入式系统对任务响应时间要求高，需及时处理事件，实时操作系统能满足这一需求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547589", "t": 1, "q": "嵌入式系统中，“实时操作系统的任务优先级”设计时，不需要考虑的因素是", "a": ["任务的代码长度", "任务的执行频率", "任务对系统资源的需求", "任务的截止时间", "", ""], "r": "A", "e": "任务代码长度与任务优先级并无直接关联，而任务执行频率、对系统资源需求和截止时间都会影响任务优先级。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547590", "t": 1, "q": "嵌入式系统中，固件通常存储在？", "a": ["RAM", "Cache", "磁盘", "ROM", "", ""], "r": "D", "e": "固件是固化的软件，需长期保存且掉电不丢失数据。ROM（只读存储器）可满足此特性。而RAM是随机存取存储器，掉电数据丢失；Cache是高速缓冲存储器，用于临时存储数据；磁盘一般用于大容量数据存储，在嵌入式系统里不是固件常见存储位置。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547591", "t": 1, "q": "嵌入式系统中，看门狗定时器的作用是？", "a": ["调度任务", "提高系统性能", "检测系统死机", "管理内存分配", "", ""], "r": "C", "e": "看门狗定时器在嵌入式系统里主要是在系统运行异常时，检测系统是否死机，若死机则可让系统复位。调度任务由调度器完成，提高系统性能靠优化算法等，管理内存分配有专门的内存管理模块。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547592", "t": 1, "q": "嵌入式系统中，JTAG接口主要用于？", "a": ["存储扩展", "编程和调试", "网络通信", "电源管理", "", ""], "r": "B", "e": "JTAG接口是一种国际标准测试协议，常用于芯片的编程和调试。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547593", "t": 1, "q": "文件系统中，inode不包含以下哪种信息？", "a": ["文件权限", "文件数据块指针", "文件大小", "文件名", "", ""], "r": "D", "e": "inode是文件系统中用于存储文件元信息的数据结构，包含文件权限、文件数据块指针、文件大小等信息，但文件名并不存储在inode里，它是存储在目录项中。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547594", "t": 1, "q": "下列操作系统结构中，具有\"模块间耦合度低、可扩展性强\"特点的是", "a": ["整体式结构", "层次式结构", "微内核结构", "客户/服务器结构", "", ""], "r": "C", "e": "微内核结构将操作系统核心功能精简，模块间耦合度低，方便添加、修改模块，可扩展性强。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547595", "t": 1, "q": "下列关于操作系统中\"临界区\"的说法，错误的是", "a": ["进程退出临界区后无需执行\"退出区\"操作", "临界区是进程中访问临界资源的代码段", "进程进入临界区前必须执行\"进入区\"操作", "多个进程不能同时进入临界区", "", ""], "r": "A", "e": "进程退出临界区需执行“退出区”操作，以释放临界资源，A说法错误；临界区就是进程中访问临界资源的代码段，进入临界区前要执行“进入区”操作来检查能否进入，且多个进程不能同时进入临界区。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547596", "t": 1, "q": "下列关于进程死锁的说法中，正确的是", "a": ["死锁的四个必要条件（互斥、占有并等待、不可剥夺、循环等待）同时满足时，系统必定发生死锁", "当系统发生死锁时，必然有至少一个进程处于阻塞状态", "银行家算法通过避免\"占有并等待\"条件来防止死锁", "只要系统中存在多个进程，就可能发生死锁", "", ""], "r": "B", "e": "四个必要条件同时满足只是可能死锁，不是必定发生，A 错；死锁进程全部阻塞，B 正确；银行家算法属于死锁避免，不是破坏占有并等待条件，C 错；多个进程如果资源分配不满足四个必要条件，不会死锁，D 错。", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547597", "t": 1, "q": "下列关于嵌入式实时操作系统（RTOS）的特性描述中，错误的是", "a": ["为减少资源占用，不支持任务间通信机制", "对内存管理要求高，常采用静态内存分配", "具有可预测的任务响应时间", "通常采用抢占式调度算法以保证实时性", "", ""], "r": "A", "e": "嵌入式实时操作系统为了满足任务协作需求，一般支持任务间通信机制，A选项错误；为保证稳定性和可预测性，常采用静态内存分配，有可预测的任务响应时间，且多采用抢占式调度算法保证实时性。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547598", "t": 1, "q": "下列关于实时操作系统中\"软实时\"和\"硬实时\"的区别，说法正确的是", "a": ["软实时任务未满足截止时间会导致系统故障，硬实时任务不会", "硬实时任务的截止时间必须严格满足，软实时任务可偶尔不满足", "软实时任务的截止时间比硬实时任务长", "软实时系统的调度算法比硬实时系统简单", "", ""], "r": "B", "e": "硬实时要求严格满足任务截止时间，否则可能造成严重后果；软实时允许任务偶尔不满足截止时间。A选项说反了；C选项截止时间长短与软硬实时无必然联系；D选项调度算法复杂度和软硬实时无直接关联。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547599", "t": 1, "q": "下列关于文件备份的说法中，“增量备份”的特点是", "a": ["备份所有已修改的文件，无论上次备份类型", "备份系统中所有文件", "仅备份自上次完全备份以来修改的文件", "仅备份自上次备份（无论完全或增量）以来修改的文件", "", ""], "r": "D", "e": "增量备份只备份自上次备份（不管是完全备份还是增量备份）之后有修改的文件。A选项表述不准确；B选项是完全备份特点；C选项是差异备份特点。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547600", "t": 1, "q": "下列关于文件存取控制的说法中，属于\"访问控制列表（ACL）\"方式的是", "a": ["每个文件维护一个列表，记录可访问该文件的用户及对应权限", "仅文件所有者可修改文件，其他用户仅能读取", "每个文件设置所有者、同组用户、其他用户三类权限", "每个文件关联一个用户组，仅组内用户可访问", "", ""], "r": "A", "e": "访问控制列表（ACL）是为每个文件维护一个列表，记录可访问该文件的用户及对应权限。B是简单的所有者权限设定；C是传统的三类用户权限设置；D是基于用户组的访问设定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547601", "t": 1, "q": "下列关于文件目录的说法中，正确的是", "a": ["哈希目录结构的查找效率与文件数量无关", "二级目录结构中，不同用户的文件可以重名", "单级目录结构支持文件重名", "树形目录结构中，只有根目录下的文件可以重名", "", ""], "r": "B", "e": "哈希目录结构查找效率受文件数量影响；二级目录不同用户文件可重名；单级目录不支持文件重名；树形目录结构中同一目录下文件不可重名。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547602", "t": 1, "q": "下列关于线程的描述中，错误的是", "a": ["线程是进程中的一个执行单元", "线程是资源分配的基本单位", "线程的创建和切换开销比进程小", "同一进程的多个线程共享进程的地址空间", "", ""], "r": "B", "e": "进程是资源分配的基本单位，线程是CPU调度和执行的基本单位，所以B错误；线程是进程中的执行单元，创建和切换开销比进程小，同一进程的多线程共享进程地址空间。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547603", "t": 1, "q": "下列关于I/O子系统的组成部分，不包括的是", "a": ["设备控制器", "I/O中断处理程序", "I/O设备", "进程调度器", "", ""], "r": "D", "e": "I/O子系统由I/O设备、设备控制器、I/O中断处理程序等组成，进程调度器负责进程调度，不属于I/O子系统。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547604", "t": 1, "q": "下列哪个不是操作系统的必要组成部分？", "a": ["进程管理模块", "文件管理模块", "内存管理模块", "数据库管理模块", "", ""], "r": "D", "e": "操作系统的基本功能包含进程管理、内存管理、文件管理等。而数据库管理模块并非操作系统必要部分，它是用于管理数据库的独立软件。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547605", "t": 1, "q": "下列哪个不是操作系统设计的目标？", "a": ["高效性", "可靠性", "低成本", "易用性", "", ""], "r": "C", "e": "操作系统设计目标通常包括高效利用资源以实现高效性、稳定运行保证可靠性、方便用户操作体现易用性。而低成本并非操作系统设计的核心目标。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547606", "t": 1, "q": "下列哪个不是进程状态？", "a": ["运行态", "调度态", "就绪态", "阻塞态", "", ""], "r": "B", "e": "进程通常有运行态、就绪态、阻塞态等状态。调度是系统对进程进行的操作，“调度态”不是标准的进程状态。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547607", "t": 1, "q": "下列哪个不是嵌入式操作系统的特点？", "a": ["实时性强", "图形界面丰富", "可靠性高", "可裁剪性", "", ""], "r": "B", "e": "嵌入式操作系统通常资源有限，主要用于特定设备和场景，更注重实时性、可靠性和可裁剪性，以适应不同硬件和应用需求。而图形界面丰富需要较多资源支持，不是其典型特点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547608", "t": 1, "q": "下列哪个不是嵌入式系统常用的实时调度算法？", "a": ["最早截止期优先", "最小松弛度优先", "速率单调调度", "最短作业优先", "", ""], "r": "D", "e": "最早截止期优先、最小松弛度优先、速率单调调度都是嵌入式系统常用实时调度算法，而最短作业优先常用于普通作业调度，非嵌入式实时调度。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547609", "t": 1, "q": "下列哪个不是死锁产生的必要条件？", "a": ["不可剥夺条件", "循环等待条件", "请求和保持条件", "资源可重用性", "", ""], "r": "D", "e": "死锁四大必要条件为互斥、不可剥夺、请求和保持、循环等待，资源可重用性不属于死锁必要条件。", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547610", "t": 1, "q": "下列哪个不是微内核结构的特点？", "a": ["内核小巧", "性能高效", "系统可靠性高", "服务在用户空间运行", "", ""], "r": "B", "e": "微内核结构内核小巧，服务在用户空间运行，系统可靠性高，但因频繁的用户态和内核态切换，性能并非高效。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547611", "t": 1, "q": "下列哪个不是文件系统的功能？", "a": ["文件保护", "文件访问", "文件压缩", "文件存储", "", ""], "r": "C", "e": "文件系统主要负责文件的存储、管理、保护以及提供文件访问等功能。文件压缩是对文件进行处理以减少存储空间的一种技术，并非文件系统的核心功能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547612", "t": 1, "q": "下列哪个不是线程特有的资源？", "a": ["打开的文件", "寄存器集合", "程序计数器", "栈指针", "", ""], "r": "A", "e": "线程有自己独立的寄存器集合、程序计数器和栈指针，而打开的文件是进程共享的资源。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547613", "t": 1, "q": "下列哪个调度算法可能产生饥饿现象？", "a": ["先来先服务", "短作业优先", "多级反馈队列", "时间片轮转", "", ""], "r": "B", "e": "短作业优先算法中，长作业可能长时间得不到执行机会，会产生饥饿现象。而先来先服务按顺序执行；多级反馈队列兼顾长短作业；时间片轮转每个进程都能在一定时间内得到执行，一般不会产生饥饿。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547614", "t": 1, "q": "下列哪个算法可能产生Belady异常？", "a": ["最近最久未使用算法", "先进先出算法", "最佳置换算法", "时钟置换算法", "", ""], "r": "B", "e": "Belady异常指分配物理块增多时缺页率反而上升的现象，只有先进先出页面置换算法可能出现该异常。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547615", "t": 1, "q": "下列哪个算法可以避免死锁？", "a": ["银行家算法", "资源剥夺法", "进程回退法", "死锁检测算法", "", ""], "r": "A", "e": "银行家算法通过在资源分配前进行安全性检查，确保系统处于安全状态，可避免死锁。资源剥夺法和进程回退法是死锁解除方法，死锁检测算法用于检测死锁而非避免。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547616", "t": 1, "q": "下列哪种内存管理方式会产生外部碎片？", "a": ["段页式管理", "分页管理", "分段管理", "固定分区管理", "", ""], "r": "C", "e": "外部碎片是指内存中无法被利用的小空闲区域。分段管理按程序逻辑分段，段长不固定，分配和回收后易产生无法利用的小空闲区即外部碎片。而段页式结合段与页优势，分页管理将内存固定分页，固定分区管理分区大小固定，都不易产生外部碎片。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547617", "t": 1, "q": "下列哪种文件物理结构最适合随机存取？", "a": ["散列结构", "连续结构", "链接结构", "索引结构", "", ""], "r": "D", "e": "索引结构通过索引表可快速定位任意逻辑块对应的物理块，能高效实现随机存取。散列结构多用于快速查找特定键值，并非主要用于随机存取文件。连续结构的文件在存储上连续，若要随机访问非连续位置可能需移动大量数据。链接结构需从文件头开始依次查找，随机存取效率低。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547618", "t": 1, "q": "下列哪种I/O控制方式完全不需要CPU干预？", "a": ["程序查询方式", "通道方式", "DMA方式", "中断方式", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547619", "t": 1, "q": "下列文件物理结构中，最适合随机访问且能有效减少外部碎片的是", "a": ["多级索引结构", "链接结构", "索引结构", "连续结构", "", ""], "r": "C", "e": "连续结构虽适合随机访问但易产生外部碎片；链接结构不适合随机访问；多级索引结构适合随机访问，但构建复杂且有额外开销；索引结构能有效减少外部碎片，也适合随机访问。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547620", "t": 1, "q": "下列文件系统中，不支持日志功能的是", "a": ["NTFS", "Ext3", "FAT32", "Ext2", "", ""], "r": "C", "e": "NTFS和Ext3支持日志功能，可记录文件系统的更改，增强数据安全性和恢复能力；FAT32无日志功能；Ext2早期也无日志功能。答案：C、D ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547621", "t": 1, "q": "以下关于线程和进程的说法，错误的是？", "a": ["同一进程的线程共享地址空间", "线程是调度的基本单位", "线程的创建和销毁开销大于进程", "进程是资源分配的基本单位", "", ""], "r": "C", "e": "线程创建和销毁开销小于进程，C说法错误；同一进程的线程共享地址空间，线程是调度基本单位，进程是资源分配基本单位，A、B、D说法正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547622", "t": 1, "q": "以下哪项不是分页系统的优点？", "a": ["实现简单", "支持虚拟内存", "减少外部碎片", "提高内存利用率", "", ""], "r": "A", "e": "分页系统实现相对复杂，并非简单，而它能支持虚拟内存、减少外部碎片、提高内存利用率。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547623", "t": 1, "q": "以下哪项不是进程间通信的方式？", "a": ["信号量", "消息队列", "管道", "直接内存访问", "", ""], "r": "D", "e": "信号量、消息队列、管道都是常见的进程间通信方式，而直接内存访问（DMA）是一种硬件机制，用于在外设和内存之间直接传输数据，并非进程间通信方式。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547624", "t": 1, "q": "以下哪项不是微内核操作系统的服务？", "a": ["设备驱动", "内存管理", "文件系统", "进程管理", "", ""], "r": "C", "e": "微内核操作系统将很多传统操作系统内核功能移到内核外作为服务器实现，如文件系统、设备驱动等。而内存管理、进程管理等核心功能通常保留在内核中。本题问的不是微内核操作系统服务的，设备驱动和文件系统是移到内核外的服务，内存管理和进程管理是内核核心服务。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813810996547625", "t": 1, "q": "以下哪项不是微内核架构的特点？", "a": ["高可靠性", "高性能", "内核小巧", "服务在用户态运行", "", ""], "r": "B", "e": "微内核将很多服务功能移出内核，虽有内核小巧、高可靠性、服务在用户态运行等特点，但因频繁的用户态和内核态切换，会降低性能，并非高性能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304064", "t": 2, "q": "操作系统的设计目标包括以下哪些？", "a": ["低成本", "高效性", "可靠性", "易用性", "", ""], "r": "BCD", "e": "操作系统设计要让计算机系统运行高效，保证可靠稳定工作，同时要方便用户使用，高效性、可靠性、易用性是常见目标。而低成本并非操作系统核心设计追求。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304065", "t": 2, "q": "操作系统中，以下哪些是安全机制？", "a": ["访问控制", "备份", "身份认证", "审计", "", ""], "r": "ACD", "e": "访问控制限制用户对资源的访问权限；身份认证确认用户身份；审计对系统活动进行记录和审查，它们都是常见安全机制。备份主要是为防止数据丢失，并非直接安全防护机制。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304066", "t": 2, "q": "操作系统中，以下哪些是基本特征？", "a": ["虚拟性", "异步性", "共享性", "安全性", "", ""], "r": "ABC", "e": "操作系统四大基本特征为并发、共享性、虚拟性、异步性，安全性不属于操作系统四大基本特征。", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304067", "t": 2, "q": "操作系统中，以下哪些是系统调用？", "a": ["printf", "read", "malloc", "fork", "", ""], "r": "BD", "e": "系统调用是操作系统提供给用户程序调用的接口。printf和malloc是C库函数，并非直接的系统调用。read用于从文件描述符读取数据，fork用于创建新进程，它们是典型的系统调用。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304068", "t": 2, "q": "操作系统中，以下哪些属于进程状态？", "a": ["运行", "阻塞", "就绪", "终止", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304069", "t": 2, "q": "进程死锁的必要条件包括", "a": ["循环等待资源", "进程占有并等待资源", "互斥条件", "非抢占条件", "", ""], "r": "ABCD", "e": "进程死锁的四个必要条件为互斥条件、占有并等待资源、非抢占条件、循环等待资源。ABCD选项均涵盖其中。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304070", "t": 2, "q": "嵌入式实时操作系统（RTOS）的核心功能包括", "a": ["内存管理", "任务调度", "任务间通信", "中断管理", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304071", "t": 2, "q": "嵌入式实时操作系统中，\"任务调度算法\"的选择需要考虑的因素包括", "a": ["任务的实时性要求", "任务的执行时间", "任务的数量", "任务的优先级", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304072", "t": 2, "q": "嵌入式实时操作系统中，\"任务间同步\"的方式包括", "a": ["互斥锁（Mutex）", "信号量（Semaphore）", "事件标志组（Event Flag）", "消息队列（Message Queue）", "", ""], "r": "ABCD", "e": "在嵌入式实时操作系统里，互斥锁、信号量、事件标志组、消息队列都可用于任务间同步。互斥锁用于保护共享资源，信号量可控制资源访问数量，事件标志组用于任务间事件通知，消息队列用于任务间数据传递和同步。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304073", "t": 2, "q": "嵌入式系统的特点包括以下哪些？", "a": ["可靠性", "资源受限", "实时性", "可扩展性", "", ""], "r": "ABC", "e": "嵌入式系统通常用于特定任务，对可靠性要求高，要稳定运行；其硬件资源有限，存在资源受限情况；很多场景需实时响应，有实时性要求；但一般为特定设计，可扩展性较弱。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304074", "t": 2, "q": "嵌入式系统设计中，“硬件选型”需要考虑的因素包括", "a": ["操作系统兼容性", "成本", "处理器性能", "功耗", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304075", "t": 2, "q": "嵌入式系统中，“Bootloader”的主要功能包括", "a": ["提供简单的调试接口", "加载操作系统内核", "初始化硬件设备", "执行应用程序", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304076", "t": 2, "q": "文件系统的功能包括以下哪些？", "a": ["文件压缩", "文件检索", "文件保护", "文件共享", "", ""], "r": "BCD", "e": "文件系统具有多种功能，文件检索可方便找到所需文件，文件保护能保障文件安全，文件共享可让多用户使用文件，而文件压缩并非文件系统核心基本功能。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304077", "t": 2, "q": "文件系统中，以下哪些是文件分配方式？", "a": ["分页分配", "连续分配", "索引分配", "散列分配", "", ""], "r": "BC", "e": "常见的文件分配方式有连续分配、索引分配等。分页分配是内存管理的方式，散列分配不是文件分配方式。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304078", "t": 2, "q": "下列关于\"临界资源\"的描述，正确的有", "a": ["临界资源必须通过同步机制实现互斥访问", "临界资源是指一次只能被一个进程访问的资源", "共享内存总是作为临界资源处理", "打印机是临界资源", "", ""], "r": "ABD", "e": "临界资源一次仅允许一个进程使用，需同步机制实现互斥访问，打印机同一时间只能被一个进程使用是临界资源；但共享内存不一定总是临界资源。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304079", "t": 2, "q": "下列关于\"设备独立性\"的描述，正确的有", "a": ["设备独立性是指应用程序与具体物理设备无关", "设备独立性可提高系统的可移植性", "设备独立性需要通过逻辑设备名实现", "设备独立性无需驱动程序支持", "", ""], "r": "ABC", "e": "设备独立性指应用程序与具体物理设备无关，通过逻辑设备名使用设备，可提高系统可移植性，且需要驱动程序支持。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304080", "t": 2, "q": "下列关于\"页面缓冲池\"的作用，说法正确的有", "a": ["替代页表实现地址转换", "提高内存的利用率", "缓存刚被置换的页面，避免频繁I/O", "缓存刚调入的页面，提高访问速度", "", ""], "r": "CD", "e": "答案：CD页面缓冲池的主要作用是缓存页面，以提高系统性能。具体来说，它缓存刚被置换的页面，避免频繁的I/O操作（选项C），同时也缓存刚调入的页面，以提高访问速度（选项D）。选项A错误，因为页面缓冲池不替代页表实现地址转换，这是页表的功能。选项B虽然内存利用率的提高是页面缓冲池的一个间接效果，但并非其主要直接作用，因此不选。", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304081", "t": 2, "q": "下列关于操作系统\"并发\"特性的描述，正确的有", "a": ["并发可能导致进程间的资源竞争", "单CPU系统中可以实现并发", "并发可提高系统资源利用率", "并发需要操作系统的调度机制支持", "", ""], "r": "ABCD", "e": "并发是指多个进程在同一时间段内执行。多个进程在运行时会竞争系统资源，A对；单CPU系统通过时间片轮转等方式可实现并发，B对；并发能让系统资源在不同进程间合理分配使用，提高利用率，C对；为保证并发有序进行，需要操作系统调度机制来安排进程执行顺序，D对。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304082", "t": 2, "q": "下列关于操作系统\"调度\"的说法，正确的有", "a": ["低级调度是指进程调度", "进程调度的对象是进程", "高级调度是指作业调度", "中级调度是指内存调度（交换调度）", "", ""], "r": "ABCD", "e": "操作系统调度分高级、中级、低级调度，高级即作业调度，中级是内存调度（交换调度），低级为进程调度，进程调度对象是进程。答案全对。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304083", "t": 2, "q": "下列关于操作系统\"死锁检测\"的说法，正确的有", "a": ["死锁检测需要定期执行", "死锁检测可通过资源分配图实现", "死锁检测后必须立即解除死锁", "死锁检测会增加系统开销", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304084", "t": 2, "q": "下列关于分页存储管理和分段存储管理的区别，说法正确的有", "a": ["分页的页面大小由系统固定，分段的段长由用户决定", "分页的逻辑地址分解为页号和页内偏移，分段分解为段号和段内偏移", "分页的地址空间是一维的，而分段是二维的", "分页主要用于内存管理，而分段则更侧重于提供地址保护和共享功能", "", ""], "r": "ABCD", "e": "ABCD选项均正确。A项，分页的页面大小由系统确定，分段的段长由用户程序决定；B项，分页逻辑地址分页号和页内偏移，分段分段号和段内偏移；C项，分页地址空间一维，分段是二维；D项，分页用于内存管理，分段侧重地址保护和共享。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304085", "t": 2, "q": "下列关于设备控制器的功能，说法正确的有", "a": ["接收CPU的I/O命令", "实现设备与内存间的数据传输", "对I/O数据进行缓冲", "处理设备中断请求", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304086", "t": 2, "q": "下列关于文件\"打开\"操作的作用，说法正确的有", "a": ["建立进程与文件的关联", "检查用户对文件的访问权限", "将文件目录项调入内存", "分配文件的物理存储空间", "", ""], "r": "ABC", "e": "打开文件时，系统会建立进程与文件的关联，检查用户访问权限，把文件目录项调入内存。而分配文件物理存储空间是在创建文件时进行，并非打开操作。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304087", "t": 2, "q": "下列关于文件\"删除\"操作的处理，说法正确的有", "a": ["删除符号链接文件时，不会删除原文件", "删除文件时需释放文件占用的物理存储空间", "删除硬链接文件时，只有当所有硬链接都被删除后才会删除原文件", "删除文件时需从目录中删除该文件的目录项", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304088", "t": 2, "q": "下列关于文件目录项包含的信息，说法正确的有", "a": ["文件名", "文件物理地址", "文件创建时间", "文件访问权限", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304089", "t": 2, "q": "下列关于线程和进程的关系，说法正确的有", "a": ["一个线程可以属于多个进程", "同一进程的线程共享进程的打开文件", "线程切换不需要切换进程地址空间", "进程切换不需要切换页表", "", ""], "r": "BC", "e": "A选项，一个线程只能属于一个进程；B选项，同一进程的线程共享进程资源，包括打开文件；C选项，线程切换时在同一进程内，不用切换进程地址空间；D选项，进程切换需要切换页表。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304090", "t": 2, "q": "下列关于虚拟内存的说法，正确的有", "a": ["虚拟内存需要硬件（如MMU）支持", "虚拟内存的大小受地址总线位数限制", "虚拟内存会增加缺页中断的概率", "虚拟内存可提高内存利用率", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304091", "t": 2, "q": "下列关于页面大小对系统性能的影响，说法正确的有", "a": ["页面大小对系统性能无显著影响", "页面越小，页表项越多", "页面越小，地址转换效率越高", "页面越大，缺页率越低", "", ""], "r": "BD", "e": "页面小，页表项会增多；页面大，一次换入的数据多，缺页率会降低。页面大小对系统性能有显著影响，页面小地址转换时页表项多，效率低。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304092", "t": 2, "q": "下列关于I/O中断的作用，说法正确的有", "a": ["通知CPU I/O操作完成", "替代CPU执行I/O操作", "提高CPU的利用率", "减少CPU的等待时间", "", ""], "r": "ACD", "e": "I/O中断可在I/O操作完成时通知CPU，让CPU不用一直等待I/O操作，从而减少等待时间，提高利用率，但不能替代CPU执行I/O操作。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304093", "t": 2, "q": "下列哪些是操作系统安全机制？", "a": ["入侵检测", "数据加密", "访问控制", "身份认证", "", ""], "r": "CD", "e": "操作系统安全机制用于保障系统安全。访问控制决定用户对资源的访问权限；身份认证确认用户身份真实性，二者都是常见操作系统安全机制。入侵检测更多是安全监测手段，数据加密是数据保护技术，它们不属于操作系统核心安全机制。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304094", "t": 2, "q": "下列哪些是操作系统的核心功能？", "a": ["设备管理", "进程管理", "内存管理", "文件管理", "", ""], "r": "ABCD", "e": "操作系统核心功能包括对计算机资源的管理，设备管理负责硬件设备，进程管理协调程序运行，内存管理分配和使用内存，文件管理组织和存储数据。ABCD选项均是其核心功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304095", "t": 2, "q": "下列哪些是操作系统的结构类型？", "a": ["微内核结构", "客户端-服务器结构", "层次结构", "对称多处理结构", "", ""], "r": "AC", "e": "答案：AC操作系统的结构类型主要包括微内核结构、层次结构等。B选项中的客户端-服务器结构是一种网络服务架构模式，不属于操作系统的结构类型；D选项中的对称多处理结构是一种处理器架构模式，也不属于操作系统的结构类型。", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304096", "t": 2, "q": "下列哪些是嵌入式系统的特点？", "a": ["实时性", "专用性", "功耗敏感", "资源受限", "", ""], "r": "ABCD", "e": "嵌入式系统通常适用于特定场景，有明确专用性；常需对事件快速响应，具备实时性；多为移动或便携设备，对功耗敏感；硬件资源如内存、处理器性能等有限。ABCD选项均是其特点。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304097", "t": 2, "q": "下列哪些是嵌入式系统开发工具？", "a": ["集成开发环境", "版本控制工具", "仿真器", "调试器", "", ""], "r": "ACD", "e": "答案：ACD嵌入式系统开发工具是指用于辅助嵌入式系统开发的软件工具。嵌入式系统通常需要在特定的硬件平台上运行，因此开发工具需要能够支持硬件平台的开发和调试。A. 集成开发环境（IDE）：集成开发环境提供了代码编辑、编译、调试等一系列功能，是嵌入式系统开发中不可或缺的工具。C. 仿真器：仿真器可以模拟嵌入式系统的硬件环境，使得开发者可以在没有实际硬件的情况下进行开发和测试，这对于嵌入式系统的开发非常重要。D. 调试器：调试器用于在开发过程中对嵌入式系统进行调试，查看和修改系统的运行状态，是嵌入式系统开发中必不可少的工具。B. 版本控制工具：版本控制工具虽然对于软件开发过程非常重要，但它并不是专门针对嵌入式系统开发的工具，而是适用于所有类型的软件开发。因此，它不被视为嵌入式系统开发工具的一部分。", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304098", "t": 2, "q": "下列哪些是设备管理的目标？", "a": ["降低设备成本", "方便设备使用", "提高设备利用率", "优化设备性能", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304099", "t": 2, "q": "下列哪些是实时系统的性能指标？", "a": ["吞吐量", "响应时间", "截止期满足率", "资源利用率", "", ""], "r": "BC", "e": "实时系统强调及时性，响应时间直接体现系统对事件的反应速度；截止期满足率反映系统能否按时完成任务，这两个是实时系统重要性能指标。吞吐量和资源利用率并非实时系统特有的关键指标。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304100", "t": 2, "q": "下列哪些是死锁处理策略？", "a": ["忽略", "恢复", "检测", "避免", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304101", "t": 2, "q": "下列哪些是微内核架构的优点？", "a": ["性能高效", "可靠性高", "易于维护", "可扩展性好", "", ""], "r": "BCD", "e": "微内核将大部分服务功能移到内核外，内核仅保留最基本功能。其把系统服务模块化，一个模块出错不影响其他，可靠性高；各模块独立，方便修改和扩展，可扩展性好、易于维护。但因频繁用户态和内核态切换，性能并非高效。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304102", "t": 2, "q": "下列哪些是文件分配方式？", "a": ["分页分配", "连续分配", "链接分配", "散列分配", "", ""], "r": "BC", "e": "文件分配方式有连续分配、链接分配等。分页分配是内存管理方式，散列分配不是常见文件分配方式。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304103", "t": 2, "q": "下列哪些是文件目录的主要功能？", "a": ["实现文件共享", "提供文件保护", "管理磁盘空间", "实现文件按名存取", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304104", "t": 2, "q": "下列哪些是线程的实现方式？", "a": ["轻量级进程", "内核级线程", "协程", "混合式线程", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304105", "t": 2, "q": "下列哪些是虚拟存储器的特征？", "a": ["离散性", "多次性", "交换性", "连续性", "", ""], "r": "ABC", "e": "虚拟存储器有离散性、多次性、对换性（交换性）和虚拟性特征，连续性不是其特征。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304106", "t": 2, "q": "下列哪些是虚拟设备技术的实现条件？", "a": ["大容量磁盘", "SPOOLing技术", "中断技术", "多道程序设计", "", ""], "r": "BD", "e": "答案：BD。虚拟设备技术（Virtual Device Technology）主要是通过技术手段将一台物理设备变为多台逻辑设备，以提高设备的利用率和系统的并行性。其中，SPOOLing技术（Simultaneous Peripheral Operations On-Line，联机外围设备同时操作）是实现虚拟设备技术的关键，它通过缓冲区管理，使得多个用户可以同时使用同一台物理设备，而感觉上是在使用独立的设备。多道程序设计则是操作系统能够同时处理多个程序，使得不同程序可以共享设备，这也是虚拟设备技术实现的基础。而大容量磁盘和中断技术并不是虚拟设备技术的必要实现条件，虽然它们可能在某些场景下被用于优化或支持虚拟设备技术。", "ap": [false, false, false, false, false, false]}, {"id": "2034813814121304107", "t": 2, "q": "下列哪些因素会影响页面置换算法的性能？", "a": ["程序访问特性", "页面大小", "置换算法本身", "磁盘访问速度", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417472", "t": 3, "q": "操作系统的\"并发\"特性是指多个进程在同一时刻同时运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "操作系统的“并发”是指多个进程在同一时间段内交替执行，而非同一时刻同时运行，同一时刻同时运行是“并行”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417473", "t": 3, "q": "操作系统的安全性完全依赖于硬件保护机制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "操作系统的安全性并非完全依赖硬件保护机制，还与软件层面的安全策略、用户认证、访问控制等诸多因素有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417474", "t": 3, "q": "操作系统的系统调用接口是稳定不变的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "操作系统会不断发展和更新，为了适应新的硬件、新的应用需求等，系统调用接口可能会发生变化，并非稳定不变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417475", "t": 3, "q": "操作系统内核必须是不可抢占的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "操作系统内核有可抢占和不可抢占之分，不是必须不可抢占，可抢占内核能提高系统响应速度等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417476", "t": 3, "q": "操作系统是计算机系统中最接近硬件的系统软件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "操作系统直接管理和控制计算机硬件资源，为其他软件提供运行环境，是最接近硬件的系统软件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417477", "t": 3, "q": "操作系统是用户与计算机硬件之间的接口。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "操作系统为用户提供了操作计算机的界面和环境，使用户能方便地使用计算机硬件资源，所以它是用户与计算机硬件之间的接口。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417478", "t": 3, "q": "操作系统中，缓存主要用于提高CPU速度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "操作系统中缓存主要是为了协调不同速度设备间的数据传输，减少CPU等待数据的时间，而非提高CPU本身速度。", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417479", "t": 3, "q": "操作系统中，系统调用的执行需要从用户态切换到内核态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "系统调用是用户程序请求操作系统服务的一种方式，操作系统的核心功能在内核态执行，为保证系统安全和稳定，执行系统调用时需从用户态切换到内核态。", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417480", "t": 3, "q": "操作系统中，中断处理程序运行在进程上下文。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "中断处理程序运行在内核态，但不是在进程上下文，而是中断上下文，它与进程上下文不同，不与特定进程关联。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417481", "t": 3, "q": "短作业优先（SJF）调度算法的平均周转时间一定比先来先服务（FCFS）算法短。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "SJF算法通常能让短作业快速完成，减少整体等待时间，平均周转时间一般比FCFS短，但存在特殊情况，若作业到达顺序恰好使FCFS调度顺序和SJF一致，二者平均周转时间就相等。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417482", "t": 3, "q": "多处理器系统中的进程调度比单处理器系统更复杂。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多处理器系统有多个处理器可分配进程，要考虑处理器负载均衡、进程亲和性等更多因素，所以进程调度比单处理器系统更复杂。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417483", "t": 3, "q": "多道程序设计技术可以提高CPU利用率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多道程序设计技术允许在计算机内存中同时存放几道相互独立的程序，它们在管理程序控制之下相互穿插运行。当一道程序因I/O操作而暂停执行时，CPU可以转而执行其他程序，避免了CPU空闲等待，从而提高了CPU利用率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417484", "t": 3, "q": "多级反馈队列调度算法结合了多种调度算法的优点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多级反馈队列调度算法综合了先来先服务、时间片轮转等算法的优点。它能对不同类型作业合理处理，短作业可快速完成，长作业也能得到一定处理，还保障了交互式作业的响应时间。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417485", "t": 3, "q": "访问控制列表（ACL）比传统的用户权限分组（所有者、同组、其他）能更精细地控制文件访问权限。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "传统用户权限分组仅按所有者、同组、其他三类来设置文件权限，而ACL可针对更多不同用户或用户组设置具体权限，控制更精细。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417486", "t": 3, "q": "分段存储管理可以实现不同进程间的代码共享。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分段存储管理将程序按逻辑分段，不同进程只要有相同逻辑段就可共享该段代码。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417487", "t": 3, "q": "分段存储管理系统中，段的长度可以超过物理内存的总容量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分段存储管理中，段是逻辑单位，系统可通过虚拟存储等技术将段在内外存间换入换出，段的长度不受物理内存总容量限制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816541417488", "t": 3, "q": "分页存储管理不会产生外部碎片。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分页存储管理将内存划分为大小固定的页框，进程按页分配内存，不会出现无法利用的外部空闲区域，只会有页内的内部碎片。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611776", "t": 3, "q": "在分页存储管理系统中，逻辑地址到物理地址的转换必须通过页表实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分页存储管理系统里，系统会将逻辑地址划分成页号和页内偏移，通过页表把页号映射到对应的物理块号，进而完成逻辑地址到物理地址的转换，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611777", "t": 3, "q": "分页存储管理系统中，页面大小设置越小，内存利用率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "页面小，页内碎片小，但页表项多，页表占用空间大，且换页频繁，会增加系统开销，不一定使内存利用率更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611778", "t": 3, "q": "分页内存管理中，页面大小是固定的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在分页内存管理中，页面大小是系统预先设定好的固定值，便于内存的分配和管理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611779", "t": 3, "q": "进程的\"临界区\"是指进程中不访问任何资源的代码段。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "临界区是进程中访问临界资源的代码段，并非不访问任何资源的代码段。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611780", "t": 3, "q": "进程的\"PCB（进程控制块）\"是进程存在的唯一标识，每个进程对应一个PCB。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PCB记录了进程的各种信息，操作系统通过PCB来感知和管理进程，没有PCB就无法管理进程，所以它是进程存在的唯一标识，且每个进程都有自己独立的PCB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611781", "t": 3, "q": "进程调度的\"抢占式\"是指进程在执行过程中，不能被其他进程打断。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“抢占式”调度允许在进程执行时，系统可根据某种策略暂停当前进程，让其他进程获得CPU执行，并非不能被其他进程打断。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611782", "t": 3, "q": "进程调度算法只影响响应时间，不影响吞吐量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "进程调度算法不仅会影响响应时间，也会对吞吐量产生影响。不同的调度算法会使系统资源分配情况不同，进而影响单位时间内完成的作业数量，即吞吐量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611783", "t": 3, "q": "进程间的\"互斥\"是指多个进程同时访问同一资源，互不干扰。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。进程间“互斥”指的是当一个进程访问某资源时，其他进程不能同时访问该资源，要等此进程访问完，其他进程才能访问，并非多个进程同时访问同一资源且互不干扰。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611784", "t": 3, "q": "进程间的通信必须通过操作系统内核进行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "进程间通信有多种方式，有些通信方式如共享内存，可直接在用户空间实现，不一定要通过操作系统内核。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611785", "t": 3, "q": "进程间通信只能通过共享内存实现。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "进程间通信有多种方式，如管道、消息队列、信号量、套接字等，并非只能通过共享内存实现。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611786", "t": 3, "q": "进程控制块是操作系统管理进程的关键数据结构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "进程控制块（PCB）记录了进程的各种信息，如进程状态、资源分配等，操作系统依据它来对进程进行创建、调度、控制和销毁等操作，所以它是管理进程的关键数据结构。", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611787", "t": 3, "q": "进程是程序的一次执行过程，是系统进行资源分配和调度的基本单位。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "进程概念就是程序的一次执行过程，且它是系统进行资源分配和调度的基本单位。", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611788", "t": 3, "q": "进程是资源分配的基本单位，线程是CPU调度的基本单位。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在操作系统中，进程拥有自己独立的资源，是系统进行资源分配和调度的基本单位；线程是CPU调度和分派的基本单位，它是进程中的一个执行单元。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611789", "t": 3, "q": "进程在阻塞态时，即使有高优先级进程进入就绪队列，也不能立即转为运行态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "阻塞态的进程是因为等待某个事件（如 I/O 完成）而暂停执行，要转为运行态需先进入就绪态。即便有高优先级进程进入就绪队列，阻塞态进程没完成等待事件就不会进入就绪态，自然不能立即转为运行态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611790", "t": 3, "q": "内存管理中，分段存储管理系统不会产生内存碎片。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "分段存储管理系统会产生外部碎片，因为段的长度不固定，在内存分配和回收过程中，会在段与段之间形成无法利用的小空闲区。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611791", "t": 3, "q": "内存映射文件允许文件直接映射到进程地址空间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "内存映射文件机制可将文件映射到进程地址空间，进程能像访问内存一样访问文件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611792", "t": 3, "q": "嵌入式操作系统必须是实时操作系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "嵌入式操作系统不一定是实时操作系统，还有非实时的嵌入式操作系统，如用于一些对时间要求不高的设备。", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611793", "t": 3, "q": "嵌入式操作系统的中断延迟时间是重要的性能指标。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在嵌入式系统中，中断处理及时性很关键，中断延迟时间指从中断发生到开始执行中断服务程序的时间，它直接影响系统对外部事件响应速度，所以是重要性能指标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611794", "t": 3, "q": "嵌入式操作系统都是实时操作系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "嵌入式操作系统有实时和非实时之分，并非都是实时操作系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611795", "t": 3, "q": "嵌入式实时操作系统（RTOS）的调度算法必须是抢占式的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "嵌入式实时操作系统调度算法有抢占式和非抢占式等多种，并非必须是抢占式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611796", "t": 3, "q": "嵌入式实时操作系统的任务优先级一旦设定，在运行过程中不能修改。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "嵌入式实时操作系统中任务优先级在运行过程中是可以修改的，以此来灵活应对不同的任务需求和系统状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611797", "t": 3, "q": "嵌入式系统必须具有图形用户界面。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "嵌入式系统是为特定应用而设计的专用计算机系统，并非都需要图形用户界面，像一些工业控制、传感器监测等嵌入式系统可能就没有图形界面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611798", "t": 3, "q": "嵌入式系统不需要操作系统也能工作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "嵌入式系统可分为有操作系统和无操作系统两种。简单的嵌入式系统，如一些简单的单片机应用，不需要操作系统也能完成特定功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611799", "t": 3, "q": "嵌入式系统的功耗优化中，动态电压频率调节（DVFS）技术是通过降低处理器电压和频率来减少功耗，同时不影响性能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "DVFS技术降低处理器电压和频率时，性能一般会有所下降，并非不影响性能。", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611800", "t": 3, "q": "嵌入式系统的开发通常采用交叉开发环境。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "嵌入式系统资源有限，难以在目标系统上完成开发所需的编译、调试等操作，所以常采用交叉开发环境，即在宿主机上开发，再将程序移植到目标机运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611801", "t": 3, "q": "嵌入式系统的软件通常存储在ROM中。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "嵌入式系统常需在掉电后仍能保留软件代码和数据，ROM（只读存储器）具有非易失性，适合存储嵌入式系统的软件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611802", "t": 3, "q": "嵌入式系统的Bootloader在加载操作系统内核后，会继续驻留在内存中运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "Bootloader主要功能是初始化硬件并加载操作系统内核，加载完成后它的任务基本结束，通常不会继续驻留在内存运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611803", "t": 3, "q": "嵌入式系统开发中，交叉编译是必须的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "交叉编译是常用手段，但在某些情况下，如目标平台和开发平台架构等一致时，可进行本地编译，并非必须交叉编译。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611804", "t": 3, "q": "嵌入式系统通常具有高可扩展性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "嵌入式系统一般是为特定应用定制，硬件资源和软件架构在设计时就已确定，改动成本高、难度大，不具备高可扩展性。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611805", "t": 3, "q": "嵌入式系统总是采用低功耗设计。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "嵌入式系统应用场景广泛，并非所有都采用低功耗设计，如工业控制等场景可能更注重性能而非低功耗。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611806", "t": 3, "q": "设备独立性是指设备不依赖于特定的计算机系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设备独立性是指应用程序独立于具体使用的物理设备，而不是设备不依赖特定计算机系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611807", "t": 3, "q": "设备独立性是指应用程序使用物理设备名访问设备，与具体设备型号无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设备独立性是指应用程序使用逻辑设备名访问设备，而非物理设备名。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611808", "t": 3, "q": "设备控制器是CPU与I/O设备之间的接口，负责接收CPU的命令并控制设备执行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "设备控制器是CPU与I/O设备间的接口，其功能就是接收并识别CPU发来的命令，然后对设备进行控制操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611809", "t": 3, "q": "设备驱动程序通常运行在用户态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设备驱动程序需要直接与硬件交互，管理硬件资源，所以通常运行在内核态，而非用户态。", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611810", "t": 3, "q": "设备驱动程序运行在用户态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "设备驱动程序是操作系统内核的一部分，运行在内核态，而非用户态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611811", "t": 3, "q": "实时操作系统的任务调度都是可抢占的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实时操作系统任务调度有可抢占和不可抢占两种方式以适应不同场景需求，所以并非都是可抢占的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611812", "t": 3, "q": "实时操作系统中，硬实时任务的截止时间可以根据系统负载适当调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "硬实时任务的截止时间是刚性要求，必须严格满足，不能根据系统负载调整。", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611813", "t": 3, "q": "实时系统的调度算法必须考虑任务的优先级。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "实时系统需在规定时限内完成任务处理，不同任务重要性不同，通过考虑任务优先级，能优先处理重要紧急任务，确保系统实时性。所以实时系统调度算法要考虑任务优先级。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611814", "t": 3, "q": "实时系统的任务是处理突发事件，无需调度算法。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实时系统也需要调度算法，它要在规定时间内完成任务，调度算法能合理安排任务执行顺序和资源分配，以确保系统及时响应。所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611815", "t": 3, "q": "实时系统中，任务周期是固定的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实时系统中任务周期并非都是固定的，存在周期性任务有固定周期，但也有非周期性任务，其执行时间不固定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611816", "t": 3, "q": "实时系统中的所有任务都必须周期性地执行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实时系统分硬实时和软实时，任务有周期性的，也有非周期性的，并非所有任务都必须周期性执行。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611817", "t": 3, "q": "死锁的四个必要条件同时满足时，系统一定发生死锁。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "死锁的四个必要条件同时满足只是死锁发生的必要不充分条件，即便四个条件都满足，系统也不一定就会发生死锁。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813816545611818", "t": 3, "q": "死锁发生时，只能通过重启系统解决。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "死锁发生时，并非只能通过重启系统解决，还可以通过撤销进程、剥夺资源等方法来解除死锁。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第4章 操作系统（2）", "n": "基础练习题【含解析】 / 第4章 操作系统（2）", "qs": [{"id": "2034813824208605184", "t": 1, "q": "以下哪项不是虚拟内存的优点？", "a": ["减少外部碎片", "提高内存利用率", "支持更大地址空间", "避免页面置换", "", ""], "r": "D", "e": "虚拟内存可减少外部碎片、提高内存利用率、支持更大地址空间，但页面置换是其实现机制中可能会发生的，无法避免。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605185", "t": 1, "q": "以下哪项不是SPOOLing系统的组成部分？", "a": ["输出井", "井管理程序", "中断处理程序", "输入井", "", ""], "r": "C", "e": "SPOOLing系统由输入井、输出井、输入缓冲区、输出缓冲区、井管理程序等部分组成。中断处理程序并非SPOOLing系统组成。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605186", "t": 1, "q": "在采用抢占式短作业优先（SRTF）调度算法的系统中，若当前有进程A正在运行（剩余运行时间为5ms），此时就绪队列中有进程B（估计运行时间3ms）和进程C（估计运行时间6ms），且有新进程D（估计运行时间2ms）进入就绪队列，此时系统的调度行为应为", "a": ["暂停进程A，调度进程D运行", "暂停进程A，调度进程B运行", "继续运行进程A，直至其完成", "暂停进程A，调度进程C运行", "", ""], "r": "A", "e": "SRTF算法会优先调度剩余运行时间最短的进程。当前A剩余5ms，B估计3ms，C估计6ms，新进入的D估计2ms，D剩余运行时间最短，所以应暂停A，调度D运行。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605187", "t": 1, "q": "在操作系统中，管程的主要优点是:", "a": ["避免死锁", "自动实现互斥", "简化程序编写", "提高执行效率", "", ""], "r": "B", "e": "管程将共享资源和对其操作封装在一起，能自动实现对共享资源的互斥访问。它不能避免死锁，简化编写程序不是其主要优点，也不一定能提高执行效率。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605188", "t": 1, "q": "在操作系统中，系统调用与库函数的主要区别是:", "a": ["执行效率不同", "调用方式不同", "运行状态不同", "功能不同", "", ""], "r": "C", "e": "系统调用运行在核心态，库函数运行在用户态，这是二者主要区别。执行效率、调用方式、功能并非主要区分点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605189", "t": 1, "q": "在操作系统中，下列哪种进程调度算法既考虑作业等待时间又考虑作业执行时间？", "a": ["短作业优先", "先来先服务", "高响应比优先", "时间片轮转", "", ""], "r": "C", "e": "响应比 =（等待时间 + 执行时间）/ 执行时间，高响应比优先算法兼顾等待时间和执行时间。短作业优先只看执行时间，先来先服务按到达顺序，时间片轮转按固定时间片分配，都未同时考虑两者。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605190", "t": 1, "q": "在操作系统中，信号量机制不能用于:", "a": ["进程通信", "进程同步", "资源互斥", "解决死锁", "", ""], "r": "D", "e": "信号量机制可用于进程同步、资源互斥以及进程通信，但不能从根本上解决死锁问题，死锁的解决需更复杂的策略。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605191", "t": 1, "q": "在操作系统中，以下哪种调度算法可能导致饥饿现象？", "a": ["先来先服务", "时间片轮转", "短作业优先", "多级反馈队列", "", ""], "r": "C", "e": "短作业优先调度算法中，长作业可能因不断有短作业进入而长时间得不到调度，产生饥饿现象。而先来先服务不会因作业长短让作业饥饿，时间片轮转每个进程都有机会运行，多级反馈队列也减少了饥饿可能。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605192", "t": 1, "q": "在操作系统中，以下哪种内存管理方式支持动态重定位？", "a": ["固定分区", "可变分区", "分页", "分段", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605193", "t": 1, "q": "在分段存储管理系统中，段表的每个表项不包含的信息是", "a": ["段的长度", "段的起始物理地址", "页内偏移量", "段号", "", ""], "r": "C", "e": "分段存储管理中，段表记录段的相关信息，包括段号、段的长度、段的起始物理地址等。页内偏移量是分页存储管理的概念，与分段存储管理的段表无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605194", "t": 1, "q": "在分段分页存储管理系统中，逻辑地址到物理地址的转换过程需要访问的表的次数为", "a": ["3次（段表、页表、页内偏移）", "1次（仅页表）", "1次（仅段表）", "2次（段表和页表）", "", ""], "r": "D", "e": "分段分页存储管理系统中，先通过段表找到对应的页表，再通过页表找到物理页框，所以需访问段表和页表2次。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605195", "t": 1, "q": "在分页存储管理系统中，若页面大小为4KB，逻辑地址结构为\"页号10位+页内偏移量\"，则该系统的最大逻辑地址空间为", "a": ["16MB", "4MB", "8MB", "32MB", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605196", "t": 1, "q": "在分页存储管理中，页表的主要作用是:", "a": ["提高存取速度", "实现地址变换", "实现内存共享", "减少碎片", "", ""], "r": "B", "e": "分页存储管理中，页表记录了逻辑页与物理页框的映射关系，其主要功能是将逻辑地址转换为物理地址，即实现地址变换。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605197", "t": 1, "q": "在进程调度算法中，对短进程和长进程均较为公平，且能避免进程饥饿的是", "a": ["先来先服务（FCFS）", "时间片轮转（RR）", "最高响应比优先（HRRN）", "短作业优先（SJF）", "", ""], "r": "C", "e": "HRRN综合考虑等待时间和服务时间，响应比 =（等待时间 + 服务时间）/ 服务时间，能兼顾长短进程，避免饥饿。FCFS对长进程有利；RR主要保证公平但对长进程不利；SJF对短进程有利且可能使长进程饥饿。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605198", "t": 1, "q": "在进程通信中，消息传递方式的主要缺点是:", "a": ["需要内核介入", "编程复杂", "需要共享内存", "通信效率低", "", ""], "r": "D", "e": "答案：D消息传递方式中，进程间的数据交换需要通过操作系统进行中转，这会增加一定的开销，导致通信效率相对较低。而A选项“需要内核介入”是消息传递方式的一个特点，但并非其主要缺点；B选项“编程复杂”相对于其他通信方式可能更为简单明了；C选项“需要共享内存”与消息传递方式不符，消息传递不需要共享内存空间。", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605199", "t": 1, "q": "在进程同步中，使用信号量时，如果信号量初值为1，表示？", "a": ["资源不可用", "无资源可用", "有一个资源可用", "有多个资源可用", "", ""], "r": "C", "e": "信号量初值表示可用资源数量，初值为1即有一个资源可用。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605200", "t": 1, "q": "在进程状态转换中，从运行状态到就绪状态可能由于以下哪种原因？", "a": ["资源分配", "时间片用完", "进程终止", "I/O请求", "", ""], "r": "B", "e": "运行进程时间片用完会被剥夺CPU使用权，进入就绪状态等待下次调度。资源分配与该状态转换无关；进程终止是结束运行；I/O请求会使进程从运行态进入阻塞态。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605201", "t": 1, "q": "在内存保护中，基址寄存器和界限寄存器用于？", "a": ["访问控制", "页面置换", "地址转换", "碎片整理", "", ""], "r": "C", "e": "基址寄存器存放程序在内存中的起始地址，界限寄存器存放程序的长度，通过它们可实现地址转换，将逻辑地址转换为物理地址。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605202", "t": 1, "q": "在嵌入式操作系统中，以下哪种调度算法最适用于实时系统？", "a": ["短作业优先", "时间片轮转", "先来先服务", "速率单调调度", "", ""], "r": "D", "e": "实时系统需保证任务在规定时间内完成，速率单调调度是一种经典的实时调度算法，根据任务周期分配优先级，周期越短优先级越高，能满足实时任务的时间约束。而短作业优先、时间片轮转、先来先服务主要用于普通操作系统，不太适合实时系统的要求。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605203", "t": 1, "q": "在嵌入式系统中，看门狗定时器的主要作用是:", "a": ["提高系统性能", "优化功耗管理", "检测系统死机", "提高实时性", "", ""], "r": "C", "e": "看门狗定时器是在系统运行异常时能自动复位系统，主要用于检测系统是否死机。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605204", "t": 1, "q": "在嵌入式系统中，优先级倒置问题可以通过什么方法解决？", "a": ["时间片轮转", "优先级继承协议", "优先级提升", "资源预分配", "", ""], "r": "B", "e": "优先级倒置是高优先级任务被低优先级任务阻塞，优先级继承协议可让低优先级任务继承高优先级任务的优先级，避免高优先级任务长时间等待，解决该问题。时间片轮转用于任务调度，不针对优先级倒置；优先级提升说法不准确；资源预分配与解决优先级倒置无直接关联。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605205", "t": 1, "q": "在设备分配策略中，\"静态分配\"的主要目的是", "a": ["适应动态设备需求", "避免死锁", "提高设备利用率", "减少设备分配时间", "", ""], "r": "B", "e": "静态分配指进程运行前就分配所需全部设备，运行结束后归还，因设备分配在进程运行前完成，避免了进程占有部分资源又等待其他资源的情况，可避免死锁。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605206", "t": 1, "q": "在设备管理中，设备独立性是指:", "a": ["设备独立于操作系统", "用户程序独立于具体物理设备", "设备控制器独立于CPU", "设备驱动程序独立于具体设备", "", ""], "r": "B", "e": "设备独立性是指用户程序只需使用逻辑设备名来请求使用某类设备，而不必关心具体是哪台物理设备，即用户程序独立于具体物理设备。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605207", "t": 1, "q": "在设备管理中，SPOOLing技术的主要目的是:", "a": ["提高CPU利用率", "实现虚拟设备", "提高设备利用率", "加快I/O速度", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605208", "t": 1, "q": "在实时操作系统中，下列哪种调度算法能保证任务在截止期内完成？", "a": ["最短作业优先", "最早截止期优先", "时间片轮转", "先来先服务", "", ""], "r": "B", "e": "最早截止期优先调度算法会优先调度最早截止的任务，能最大程度保证任务在截止期内完成。其他算法不专门针对截止期要求。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605209", "t": 1, "q": "在实时系统中，任务的可调度性分析主要考虑:", "a": ["任务周期", "任务优先级", "任务执行时间", "所有以上因素", "", ""], "r": "D", "e": "在实时系统任务的可调度性分析中，任务周期影响任务的执行频率和时间安排；任务优先级决定任务执行的先后顺序；任务执行时间关系到系统资源的占用时长。这三个因素都对任务能否被合理调度起着关键作用。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605210", "t": 1, "q": "在实时系统中，任务响应时间是指？", "a": ["任务从运行到结束的时间", "任务从触发到响应的时间", "任务从提交到完成的时间", "任务从就绪到运行的时间", "", ""], "r": "B", "e": "实时系统中任务响应时间强调的是从任务被触发到得到响应的时长。A选项说的是运行到结束时间；C选项是提交到完成时间；D选项是就绪到运行时间，均不符合任务响应时间定义。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605211", "t": 1, "q": "在实时系统中，以下哪种调度算法能保证任务在截止时间内完成？", "a": ["短作业优先", "先来先服务", "最早截止时间优先", "时间片轮转", "", ""], "r": "C", "e": "实时系统需保证任务在截止时间内完成，最早截止时间优先算法会优先处理最早截止的任务，能更好满足这一要求。而短作业优先注重作业长短，先来先服务按到达顺序，时间片轮转按固定时间片分配，都不能很好保证截止时间。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605212", "t": 1, "q": "在文件系统中，目录实现的主要方法不包括？", "a": ["哈希表", "二叉树", "线性列表", "位图", "", ""], "r": "D", "e": "文件系统中目录实现常用线性列表、哈希表、二叉树等方法。位图主要用于磁盘块管理，并非目录实现的主要方法。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605213", "t": 1, "q": "在文件系统中，软链接和硬链接的主要区别是？", "a": ["硬链接可以指向目录", "硬链接不能删除原文件", "软链接可以跨文件系统", "软链接不占用inode", "", ""], "r": "C", "e": "硬链接不能跨文件系统且不能指向目录，删除原文件硬链接不受影响；软链接可跨文件系统，有自己的inode。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605214", "t": 1, "q": "在文件系统中，实现文件共享的最好方法是:", "a": ["符号链接法", "硬链接法", "索引节点法", "目录项法", "", ""], "r": "C", "e": "索引节点法可让不同目录项指向同一索引节点来实现文件共享，能避免硬链接的局限性，也便于管理和维护，是实现文件共享的较好方法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605215", "t": 1, "q": "在信号量操作中，P操作和V操作是？", "a": ["非原子操作", "原子操作", "可中断操作", "用户态操作", "", ""], "r": "B", "e": "P操作和V操作是为保证信号量操作的正确性，其执行过程不可被中断，是原子操作。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605216", "t": 1, "q": "在信号量机制中，若信号量S的初始值为3，当前值为-2，则表示系统中等待该资源的进程数为", "a": ["1个", "3个", "2个", "5个", "", ""], "r": "C", "e": "信号量为负时，其绝对值表示等待该资源的进程数，当前值 -2 的绝对值是 2。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605217", "t": 1, "q": "\"在采用虚拟存储管理方案的系统中，发生\" 抖动 \" 现象是由以下哪一个原因<br />引起的 ( )。\"", "a": ["页面尺寸过大", "页面尺寸过小", "程序编制不合理", "页面置换算法不合理", "", ""], "r": "D", "e": "抖动指页面频繁换入换出，本题选项条件下，页面置换算法不合理会频繁淘汰即将访问的页面，引发抖动；页面大小、程序编制不是该题给出选项里的主要诱因。", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605218", "t": 1, "q": "在虚拟存储系统中，最佳页面置换算法的理论基础是:", "a": ["工作集理论", "Belady现象", "未来知识", "局部性原理", "", ""], "r": "C", "e": "最佳页面置换算法是选择未来最长时间内不会被访问的页面进行置换，基于对未来页面访问情况的预知即未来知识。工作集理论是关于进程运行时页面集合的理论；Belady现象是指某些页面置换算法中页面增加缺页率反而上升；局部性原理是程序运行的特性。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605219", "t": 1, "q": "在虚拟内存管理中，\"页面颠簸\"（Thrashing）产生的主要原因是", "a": ["内存分配不足，进程频繁缺页", "页面大小设置过小", "磁盘I/O速度过慢", "CPU处理速度过快", "", ""], "r": "A", "e": "页面颠簸指系统频繁进行页面置换，主要是因内存分配不足，进程频繁缺页，不断换入换出页面。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605220", "t": 1, "q": "在虚拟内存实现中，\"请求分页存储管理\"与\"基本分页存储管理\"的主要区别是", "a": ["请求分页采用页表，基本分页采用段表", "请求分页支持页面置换，基本分页不支持", "请求分页仅将当前需要的页面装入内存，基本分页将所有页面装入内存", "请求分页支持动态地址转换，基本分页不支持", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605221", "t": 1, "q": "在虚拟内存系统中，页面置换算法中，以下哪种算法是基于\"最近最少使用\"原则？", "a": ["FIFO", "OPT", "NRU", "LRU", "", ""], "r": "D", "e": "“最近最少使用”即LRU（Least Recently Used）算法的核心原则。FIFO是先进先出算法；OPT是最优置换算法；NRU是最近未使用算法。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605222", "t": 1, "q": "在页面置换算法中，会产生\"Belady异常\"的是", "a": ["先进先出置换算法（FIFO）", "时钟置换算法（Clock）", "最佳置换算法（OPT）", "最近最久未使用算法（LRU）", "", ""], "r": "A", "e": "Belady异常指的是分配的物理块数增加，缺页次数反而增加的现象，只有FIFO算法会产生该异常。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605223", "t": 1, "q": "在DMA控制器与内存进行数据传输时，CPU的工作状态为", "a": ["可以执行其他进程的指令，仅不能访问DMA正在使用的内存区域", "可以执行任何指令，包括访问DMA正在使用的内存区域", "必须处于空闲状态，不能执行任何指令", "必须暂停所有工作，等待DMA传输完成", "", ""], "r": "A", "e": "DMA传输时，CPU可执行其他进程指令，只是不能访问DMA正在用的内存区域。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605224", "t": 1, "q": "在I/O控制方式的发展过程中，不需要CPU干预数据传输过程的是", "a": ["通道控制方式", "DMA方式", "中断驱动方式", "程序查询方式", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605225", "t": 1, "q": "在I/O控制方式中，以下哪种方式不需要CPU干预？", "a": ["DMA", "通道控制", "中断驱动I/O", "程序控制I/O", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605226", "t": 1, "q": "在I/O系统中，SPOOLing技术主要用于？", "a": ["提高CPU利用率", "减少中断开销", "优化文件存储", "实现虚拟设备", "", ""], "r": "D", "e": "SPOOLing技术通过在磁盘上开辟缓冲区，将独占设备模拟成共享设备，实现了虚拟设备功能。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605227", "t": 1, "q": "在I/O中断处理过程中，CPU首先要执行的操作是", "a": ["分析中断原因，确定中断源", "保存被中断进程的上下文", "恢复被中断进程的上下文", "执行中断服务程序", "", ""], "r": "B", "e": "CPU响应中断后，首要操作是保存被中断进程的上下文，防止后续执行其他操作时原进程数据丢失，之后再进行分析中断原因等操作。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813824208605228", "t": 1, "q": "在Unix系统中，信号SIGKILL的作用是？", "a": ["继续进程", "终止进程", "强制忽略该信号", "挂起进程", "", ""], "r": "B", "e": "SIGKILL是用于强制终止进程的信号。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795776", "t": 2, "q": "下列属于分段存储管理系统中\"段的共享\"实现条件的有", "a": ["不同进程的段表中指向同一物理段", "共享段在各进程中必须具有相同的段号", "共享段的长度相同", "共享段的逻辑地址可以不同", "", ""], "r": "AD", "e": "段共享本质是多个进程段表项映射到同一个物理内存段，A 正确；不同进程可以用不同段号引用同一个共享段，B 错误；共享段本身长度固定，不是各进程段长度相同作为实现条件，C 错误；各进程的段内逻辑地址可独立不同，D 正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795777", "t": 2, "q": "下列属于进程调度算法中\"非抢占式\"的有", "a": ["最高响应比优先（HRRN）", "短作业优先（SJF）", "多级反馈队列调度", "先来先服务（FCFS）", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795778", "t": 2, "q": "下列属于进程间通信方式的有", "a": ["消息队列（Message Queue）", "信号（Signal）", "共享内存（Shared Memory）", "信号量（Semaphore）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795779", "t": 2, "q": "下列属于嵌入式系统\"实时性测试\"的指标包括", "a": ["中断响应时间", "系统吞吐量", "任务响应时间", "任务切换时间", "", ""], "r": "ACD", "e": "实时性测试关注系统对事件及时响应的能力。中断响应时间、任务响应时间和任务切换时间都直接体现系统实时响应特性。系统吞吐量主要衡量系统处理能力，与实时性关联不大。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795780", "t": 2, "q": "下列属于文件保护机制的有", "a": ["文件压缩", "访问控制列表（ACL）", "文件加密", "文件备份", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795781", "t": 2, "q": "下列属于DMA控制器组成部分的有", "a": ["数据寄存器", "程序计数器", "状态寄存器", "命令寄存器", "", ""], "r": "ACD", "e": "DMA控制器一般包含数据寄存器、状态寄存器、命令寄存器等。程序计数器是CPU中用于存放下一条指令地址的部件，不属于DMA控制器组成部分。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795782", "t": 2, "q": "下列属于I/O控制方式的有", "a": ["通道控制方式", "中断驱动方式", "DMA方式", "内存映射方式", "", ""], "r": "ABC", "e": "I/O控制方式主要有程序直接控制方式、中断驱动方式、DMA方式、通道控制方式。内存映射方式主要用于实现内存与外设的地址映射，不属于I/O控制方式。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795783", "t": 2, "q": "下列文件系统中，支持文件名包含特殊字符（如空格、#）的有", "a": ["NTFS", "HFS+", "Ext2", "FAT32", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795784", "t": 2, "q": "虚拟内存中，以下哪些因素可能引起页面故障？", "a": ["页面写时复制", "页面访问权限错误", "页面不在内存", "页面置换", "", ""], "r": "BC", "e": "页面写时复制是一种优化机制；页面置换是为了腾出内存空间；而页面访问权限错误会导致无法正常访问页面，页面不在内存时访问就会引发页面故障。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795785", "t": 2, "q": "以下关于线程的说法，正确的有哪些？", "a": ["线程是CPU调度的基本单位", "线程共享进程的地址空间", "线程的创建开销小于进程", "线程间通信比进程间通信更复杂", "", ""], "r": "ABC", "e": "线程是CPU调度基本单位；同一进程内线程共享进程地址空间；创建线程比创建进程开销小；线程间通信比进程间通信简单。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795786", "t": 2, "q": "以下哪些是操作系统处理机调度层次？", "a": ["作业调度", "低级调度", "高级调度", "中级调度", "", ""], "r": "ABCD", "e": "操作系统处理机调度层次包括高级调度（作业调度）、中级调度和低级调度。所以ABCD选项都属于。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795787", "t": 2, "q": "以下哪些是操作系统的结构类型？", "a": ["分布式结构", "单体结构", "客户端-服务器结构", "层次结构", "", ""], "r": "ABCD", "e": "A. 分布式结构 — 正确。分布式操作系统是一种通过网络连接多台独立计算机，使其协同工作、对外表现为单一系统的操作系统。它属于操作系统的结构类型之一。<br />B. 单体结构 — 正确。单体结构（Monolithic）是操作系统最早采用的结构形式，整个系统内核是一个完整的程序，所有功能模块（如进程管理、内存管理、文件系统等）都紧密集成在一起。<br />C. 客户端-服务器结构 — 正确。客户端-服务器结构将操作系统分为客户端进程和服务器进程，服务器提供各种服务（如文件服务、进程服务等），客户端通过消息传递机制请求服务。<br />D. 层次结构 — 正确。层次结构将操作系统划分为若干层，每一层建立在其下一层之上，层与层之间通过接口进行交互，每层只依赖其下层提供的功能。", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795788", "t": 2, "q": "以下哪些是嵌入式系统常见的实时调度算法？", "a": ["速率单调调度", "最小松弛度优先", "最早截止时间优先", "时间片轮转", "", ""], "r": "ABC", "e": "速率单调调度、最小松弛度优先、最早截止时间优先都是嵌入式系统常见实时调度算法，时间片轮转常用于非实时系统。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795789", "t": 2, "q": "以下哪些是嵌入式系统开发工具？", "a": ["调试器", "交叉编译器", "集成开发环境（IDE）", "版本控制系统", "", ""], "r": "ABCD", "e": "调试器用于调试嵌入式系统代码；交叉编译器可在一种平台编译出适合另一种平台运行的代码，嵌入式开发常涉及不同平台；集成开发环境整合多种开发工具方便开发；版本控制系统可管理代码版本，它们都是嵌入式系统开发常用工具。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795790", "t": 2, "q": "以下哪些是死锁产生的必要条件？", "a": ["环路等待条件", "互斥条件", "请求和保持条件", "不剥夺条件", "", ""], "r": "ABCD", "e": "死锁四大必要条件：互斥、请求与保持、不剥夺、环路等待，四个条件缺一不可。", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795791", "t": 2, "q": "以下哪些是文件系统的一致性检查方法？", "a": ["defrag", "chkdsk", "fsck", "backup", "", ""], "r": "BC", "e": "chkdsk是Windows系统用于检查和修复磁盘文件系统错误、进行一致性检查的工具；fsck是Unix/Linux系统中用于检查和修复文件系统的命令，可做一致性检查。defrag是磁盘碎片整理，不是一致性检查；backup是备份操作，也不是一致性检查。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795792", "t": 2, "q": "以下哪些是信号处理中的常见操作？", "a": ["处理信号", "忽略信号", "阻塞信号", "捕获信号", "", ""], "r": "BCD", "e": "信号的常见处理方式：忽略信号、阻塞信号、捕获信号；A “处理信号” 是统称，不是信号操作分类。", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795793", "t": 2, "q": "在操作系统中，下列哪些是进程间通信方式？", "a": ["管道", "信号量", "套接字", "消息队列", "", ""], "r": "ABCD", "e": "管道、信号量、套接字、消息队列都是常见的进程间通信方式。管道用于进程间单向数据传输；信号量可实现进程同步与互斥；套接字用于不同主机进程通信；消息队列可实现进程间消息传递。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795794", "t": 2, "q": "在操作系统中，下列哪些是系统调用？", "a": ["malloc", "printf", "fork", "read", "", ""], "r": "CD", "e": "系统调用是操作系统提供给用户程序调用的一组接口，fork用于创建新进程、read用于从文件描述符读取数据，它们是典型系统调用；而malloc是C标准库中用于动态内存分配的函数，printf是用于格式化输出的库函数，并非系统调用。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795795", "t": 2, "q": "在进程调度中，下列哪些算法是可抢占的？", "a": ["优先级调度", "先来先服务", "时间片轮转", "多级反馈队列", "", ""], "r": "ACD", "e": "先来先服务是非抢占式，进程一旦占用CPU就一直运行直到结束。优先级调度中高优先级进程可抢占低优先级进程；时间片轮转每个进程按固定时间片执行，时间片用完会被抢占；多级反馈队列中若有高优先级进程到达可抢占当前进程。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795796", "t": 2, "q": "在进程管理中，以下哪些是上下文切换的内容？", "a": ["程序计数器", "打开文件列表", "进程状态", "内存管理信息", "", ""], "r": "ACD", "e": "上下文切换会保存和恢复进程运行所需的各种信息，程序计数器记录下一条要执行的指令地址，进程状态体现进程当前所处阶段，内存管理信息涉及进程内存分配情况，这些都会在切换时处理；打开文件列表一般属于文件系统管理范畴，不是上下文切换核心内容。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795797", "t": 2, "q": "在进程通信中，下列哪些是消息传递系统的实现方式？", "a": ["直接通信", "间接通信", "对称寻址", "非对称寻址", "", ""], "r": "AB", "e": "消息传递系统实现方式主要分直接通信和间接通信。对称与非对称寻址不是消息传递系统的实现方式。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795798", "t": 2, "q": "在进程通信中，以下哪些是消息传递方式？", "a": ["管道", "消息队列", "信号量", "套接字", "", ""], "r": "ABD", "e": "管道、消息队列、套接字都是常见的消息传递通信方式，而信号量主要用于进程同步与互斥，并非消息传递方式。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795799", "t": 2, "q": "在进程同步中，下列哪些机制可以用于解决临界区问题？", "a": ["信号量", "屏障", "消息传递", "管程", "", ""], "r": "AD", "e": "信号量和管程是经典的解决临界区问题的机制。屏障主要用于进程同步协调执行进度，消息传递侧重于进程间通信，并非专门解决临界区问题。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795800", "t": 2, "q": "在进程同步中，以下哪些机制可以用于解决临界区问题？", "a": ["屏障", "管程", "互斥锁", "条件变量", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795801", "t": 2, "q": "在内存管理中，下列哪些是分页系统的特点？", "a": ["需要硬件支持", "存在内部碎片", "实现简单", "逻辑地址连续", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795802", "t": 2, "q": "在内存管理中，下列哪些算法可能产生内部碎片？", "a": ["固定分区", "段页式管理", "分页管理", "动态分区", "", ""], "r": "ABC", "e": "选项 A 固定分区分配采用静态划分方式，每个分区大小固定。进程分配后若小于分区大小，剩余空间无法被其他进程使用，形成内部碎片，该项正确。<br />选项 B 段页式管理在段内进一步分页，最后一页通常无法被进程数据完全填满，产生页内碎片（内部碎片的一种），该项正确。<br />选项 C 分页管理将进程逻辑空间划分为固定大小的页，最后一页常存在未使用的空间，形成内部碎片，该项正确。<br />选项 D 动态分区分配按进程实际需求动态划分内存，分区大小与进程需求匹配，不产生内部碎片，但会产生外部碎片，该项错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795803", "t": 2, "q": "在内存管理中，以下哪些是连续分配方式？", "a": ["分段分配", "固定分区分配", "分页分配", "可变分区分配", "", ""], "r": "BD", "e": "连续分配要求内存分配的区域是连续的。固定分区和可变分区都是将内存划分为连续的区域来分配给进程，属于连续分配方式。分段分配和分页分配并非连续分配，分段是按程序逻辑分段，分页是将内存和进程都分成固定大小页，页在内存中可离散存放。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795804", "t": 2, "q": "在内存管理中，以下哪些是碎片类型？", "a": ["内部碎片", "逻辑碎片", "外部碎片", "页面碎片", "", ""], "r": "AC", "e": "内存管理中的碎片类型主要有内部碎片和外部碎片。内部碎片是分配单元内未被利用的空间；外部碎片是空闲内存分散，无法满足大内存需求。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795805", "t": 2, "q": "在内存管理中，以下哪些是页面置换算法？", "a": ["LRU", "Clock", "Buddy", "OPT", "", ""], "r": "ABD", "e": "LRU（最近最少使用）、Clock（时钟算法）、OPT（最优页面置换算法）都是页面置换算法，用于在内存满时决定换出哪些页面；而Buddy是一种内存分配算法，不是页面置换算法。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795806", "t": 2, "q": "在嵌入式操作系统中，任务调度算法包括以下哪些？", "a": ["时间片轮转", "短作业优先", "优先级调度", "最早截止时间优先", "", ""], "r": "ACD", "e": "嵌入式操作系统任务调度算法有时间片轮转、优先级调度、最早截止时间优先等。短作业优先一般用于批处理系统，在嵌入式系统中较少用。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795807", "t": 2, "q": "在嵌入式系统设计中，下列哪些是低功耗技术？", "a": ["动态电压频率调整", "时钟门控", "任务调度优化", "电源门控", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795808", "t": 2, "q": "在嵌入式系统中，下列哪些是实时内核的服务？", "a": ["时间管理", "内存管理", "设备管理", "任务管理", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795809", "t": 2, "q": "在嵌入式系统中，以下哪些是低功耗设计技术？", "a": ["时钟门控", "动态电压频率调整", "电源管理", "内存压缩", "", ""], "r": "ABC", "e": "答案：ABC低功耗设计技术主要用于减少嵌入式系统的能耗。A 选项时钟门控，通过控制时钟的开关来降低能耗；B 选项动态电压频率调整，根据系统负载动态调整电压和频率以实现节能；C 选项电源管理，合理管理电源的供应模式来减少功耗。D 选项内存压缩主要是优化内存使用，与低功耗设计的直接关系不大。", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795810", "t": 2, "q": "在设备管理中，下列哪些是I/O软件层次？", "a": ["用户层软件", "硬件控制器", "设备无关软件", "设备驱动程序", "", ""], "r": "ACD", "e": "I/O软件层次通常分为用户层软件、设备无关软件、设备驱动程序和中断处理程序。硬件控制器是硬件部分，不属于I/O软件层次。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795811", "t": 2, "q": "在实时操作系统中，下列哪些是硬实时任务的特点？", "a": ["可容忍偶尔错过截止期", "通常周期性地执行", "有严格的时间限制", "响应时间要求严格", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795812", "t": 2, "q": "在输入输出管理中，以下哪些是设备分配策略？", "a": ["优先级", "先来先服务", "短作业优先", "扫描算法", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795813", "t": 2, "q": "在文件保护中，以下哪些是访问控制方式？", "a": ["文件加密", "访问控制列表", "密码保护", "备份恢复", "", ""], "r": "BC", "e": "访问控制是对访问资源的权限进行管理。访问控制列表可明确规定不同用户对文件的访问权限；文件加密主要是对文件内容进行加密保护，并非直接的访问控制；密码保护是通过密码限制对文件的访问，属于访问控制；备份恢复是数据保护手段，和访问控制无关。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795814", "t": 2, "q": "在文件系统中，下列哪些是文件保护机制？", "a": ["备份恢复", "权限位", "数字签名", "文件加密", "", ""], "r": "BD", "e": "权限位可限制不同用户对文件的访问操作，文件加密能防止文件内容被非法获取，二者都属于文件保护机制。备份恢复主要是应对数据丢失等情况，数字签名多用于验证数据完整性和身份，并非直接的文件保护机制。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795815", "t": 2, "q": "在文件系统中，下列哪些是文件控制块包含的信息？", "a": ["文件权限", "文件大小", "文件创建时间", "文件位置", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795816", "t": 2, "q": "在I/O控制方式中，下列哪些说法是正确的？", "a": ["程序查询方式CPU利用率低", "所有方式都需要CPU介入", "中断方式适合低速设备", "通道方式可独立完成I/O操作", "", ""], "r": "ACD", "e": "程序查询要CPU不断查询状态，利用率低；DMA和通道方式在数据传输时CPU可不介入；中断适合低速设备，减少CPU等待；通道有自己指令系统，可独立完成I/O操作。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795817", "t": 2, "q": "在I/O系统中，以下哪些是设备驱动程序的功能？", "a": ["调度I/O请求", "处理中断", "初始化设备", "管理缓冲区", "", ""], "r": "ABCD", "e": "设备驱动程序负责与硬件设备交互，调度I/O请求、处理设备产生的中断、对设备进行初始化以及管理与设备交互的数据缓冲区都是其基本功能。ABCD四个选项均正确。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795818", "t": 2, "q": "在I/O系统中，以下哪些是I/O控制方式？", "a": ["程序控制I/O", "通道控制", "DMA", "缓冲池", "", ""], "r": "ABC", "e": "程序控制I/O、通道控制、DMA均是常见的I/O控制方式，而缓冲池是一种用于数据缓冲的机制，并非I/O控制方式。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813825982795819", "t": 2, "q": "在Unix系统中，以下哪些信号可以被捕获和处理？", "a": ["SIGKILL", "SIGSTOP", "SIGINT", "SIGALRM", "", ""], "r": "CD", "e": "SIGKILL和SIGSTOP不能被捕获和处理，SIGINT（Ctrl+C触发）和SIGALRM（闹钟信号）可以被捕获和处理。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180672", "t": 3, "q": "死锁解除的常用方法包括撤销部分进程或剥夺部分资源。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当发生死锁时，撤销部分进程可释放其占用的资源，剥夺部分资源也能打破死锁的资源占有条件，这是死锁解除的常用手段。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180673", "t": 3, "q": "死锁预防是通过破坏死锁的四个必要条件中的一个或多个，来防止死锁发生。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "死锁预防的核心思路就是破坏死锁产生的四个必要条件（互斥条件、占有并等待条件、不可抢占条件、循环等待条件）中的一个或多个，从而避免死锁出现。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180674", "t": 3, "q": "所有操作系统都必须支持多线程技术。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "早期的操作系统如 MS - DOS 就不支持多线程技术，并非所有操作系统都必须支持多线程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180675", "t": 3, "q": "所有操作系统都支持多线程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并非所有操作系统都支持多线程，早期一些简单的操作系统就不具备多线程功能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180676", "t": 3, "q": "所有内存管理方式都能避免碎片问题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并非所有内存管理方式都能避免碎片问题，像分区存储管理等就会产生碎片。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180677", "t": 3, "q": "所有页面置换算法都不会出现Belady异常。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并非所有页面置换算法都不会出现Belady异常，像先进先出（FIFO）页面置换算法就会出现Belady异常。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180678", "t": 3, "q": "所有I/O设备都可以采用中断方式进行控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并非所有I/O设备都适合采用中断方式控制，像一些高速设备，采用中断方式会频繁产生中断，增加系统开销、影响效率，一般采用DMA等方式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180679", "t": 3, "q": "微内核架构比单体内核更易于维护和扩展。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "微内核架构将操作系统核心功能最小化，把更多服务作为用户态进程实现，使得内核结构简单，修改和扩展时只需改动相关服务，不用影响内核整体，所以更易维护和扩展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180680", "t": 3, "q": "微内核结构操作系统的所有服务都在内核态运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "微内核结构操作系统将很多服务（如文件服务、设备驱动等）放在用户态运行，并非所有服务都在内核态运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180681", "t": 3, "q": "微内核结构的操作系统性能通常优于宏内核结构。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "宏内核结构把大部分系统服务都放在内核空间，减少了用户空间和内核空间的切换，执行效率高；微内核将很多服务放在用户空间，频繁的切换会带来性能开销，所以一般宏内核性能优于微内核。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180682", "t": 3, "q": "文件备份中，差异备份的备份速度比增量备份慢，但恢复速度比增量备份快。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "差异备份是备份自上次完全备份后有变化的数据，增量备份是备份自上次备份（可以是完全、差异或增量备份）后有变化的数据。差异备份通常备份数据量更大，所以备份速度比增量备份慢；恢复时，差异备份只需完全备份和最近一次差异备份，而增量备份需完全备份及每次增量备份，所以差异备份恢复速度比增量备份快。", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180683", "t": 3, "q": "文件的\"打开\"操作会将文件的全部数据调入内存。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "文件“打开”操作主要是建立文件和程序的关联，不一定会把全部数据调入内存，可能按需逐步读取。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180684", "t": 3, "q": "文件的\"逻辑结构\"是指文件在磁盘上的存储结构，如连续、链接、索引结构。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "文件的“逻辑结构”是从用户角度看到的文件组织形式，而文件在磁盘上的存储结构（连续、链接、索引结构）是文件的“物理结构”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180685", "t": 3, "q": "文件的\"硬链接\"与原文件共享同一物理存储空间，删除硬链接会导致原文件数据丢失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "硬链接与原文件共享同一物理存储空间，但删除硬链接不会影响原文件，因为只是减少了一个指向该物理存储的链接。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180686", "t": 3, "q": "文件分配表（FAT）文件系统使用索引分配方式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "FAT文件系统采用的是链接分配方式，而非索引分配方式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180687", "t": 3, "q": "文件链接可以跨越不同的文件系统。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180688", "t": 3, "q": "文件路径分为绝对路径和相对路径。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在计算机系统里，文件路径确实分为绝对路径和相对路径这两种类型。绝对路径是从根目录开始完整描述文件位置的路径；相对路径是相对于当前工作目录来描述文件位置的路径。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180689", "t": 3, "q": "文件目录结构采用树形结构可以提高文件检索效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "树形目录结构层次清晰，通过路径能快速定位文件，减少了不必要的查找，可提高文件检索效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180690", "t": 3, "q": "文件权限包括读、写和执行。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在操作系统里，文件权限基本就是读、写和执行这三种。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180691", "t": 3, "q": "文件系统的\"日志功能\"是为了提高文件读写速度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "文件系统的“日志功能”主要是用于在系统崩溃或异常时确保数据的一致性和可恢复性，并非为提高文件读写速度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180692", "t": 3, "q": "文件系统的日志功能可以完全避免数据丢失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "日志功能虽能在系统崩溃等情况时恢复部分数据，但它无法抵御所有可能导致数据丢失的情况，如硬件损坏、恶意软件攻击等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180693", "t": 3, "q": "文件系统的主要目标是实现数据的物理存储。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "文件系统主要目标是实现对文件的按名存取、方便用户使用、提高文件安全性和共享性等，而不是单纯实现数据的物理存储。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180694", "t": 3, "q": "文件系统的主要目的是提供数据的物理存储。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "文件系统主要目的是实现对文件的按名存取、管理和组织数据，方便用户使用，并非主要提供数据的物理存储。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180695", "t": 3, "q": "文件系统挂载是指将文件系统连接到目录树。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在操作系统里，文件系统挂载就是把文件系统关联到目录树的特定挂载点，使得文件系统里的文件和目录能通过目录树被访问。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180696", "t": 3, "q": "文件系统日志用于提高可靠性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "文件系统日志会记录文件系统的更改操作，当系统崩溃或出现异常时，可依据日志恢复文件系统到一致状态，从而提高文件系统的可靠性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180697", "t": 3, "q": "文件系统中的\"目录\"本质上是一种特殊的文件，用于存储其他文件的目录项。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在文件系统里，目录就是特殊文件，它存放着其他文件和子目录的目录项信息。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180698", "t": 3, "q": "线程的创建和切换开销比进程小，是因为线程不需要独立的地址空间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "进程拥有独立的地址空间，创建和切换时要进行空间分配、上下文切换等操作，开销大。而线程共享进程的地址空间，创建和切换时无需处理地址空间相关复杂操作，所以开销小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180699", "t": 3, "q": "线程共享进程的所有资源，但不包括程序计数器（PC）和寄存器的值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "同一进程内线程共享进程代码段、数据段等资源，线程私有程序计数器、寄存器、栈。", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180700", "t": 3, "q": "线程间通信必须通过进程间通信机制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "线程是进程内的执行单元，同一进程内的线程共享进程的资源，它们之间可以直接通过共享内存等方式通信，不一定要借助进程间通信机制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180701", "t": 3, "q": "线程切换的开销一定小于进程切换的开销。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "通常情况下，线程切换开销小于进程切换，因为线程共享进程资源，切换时不用像进程那样切换地址空间等大量信息，但在特殊情况如线程有频繁的同步操作时，线程切换开销可能会接近甚至超过进程切换。所以该表述太绝对。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180702", "t": 3, "q": "线程是比进程更小的执行单位，同一进程的线程共享代码段和数据段。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线程是程序执行的最小单位，比进程更小，在同一进程中的多个线程会共享该进程的代码段和数据段等资源。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180703", "t": 3, "q": "线程是资源分配的基本单位，进程是调度的基本单位。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。进程是资源分配的基本单位，线程是调度的基本单位。所以答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180704", "t": 3, "q": "信号（Signal）是进程间通信方式中，能传递大量数据的方式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信号主要用于通知进程发生了某个特定事件，它只能携带有限的信息，不能传递大量数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180705", "t": 3, "q": "信号量机制可以完全解决死锁问题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "信号量机制可用于同步和互斥，但它不能完全解决死锁问题，死锁的产生有四个必要条件，信号量机制无法避免所有死锁情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180706", "t": 3, "q": "信号量是一种进程同步机制，可以用于解决互斥问题。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "信号量是经典的进程同步机制，能通过 P、V 操作来控制对临界资源的访问，可有效解决互斥问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180707", "t": 3, "q": "信号是一种异步通信机制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "信号是在软件层次上对中断机制的一种模拟，用于通知进程发生了异步事件，进程可在接收到信号时进行相应处理，所以它是一种异步通信机制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180708", "t": 3, "q": "虚拟存储器的大小受计算机地址位数的限制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "虚拟存储器的大小与计算机地址位数有关，地址位数决定了可寻址的空间范围，也就限制了虚拟存储器的最大容量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180709", "t": 3, "q": "虚拟存储器技术可以无限扩展内存容量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虚拟存储器虽能在逻辑上扩展内存，但受外存容量、系统硬件和软件等限制，不能无限扩展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180710", "t": 3, "q": "虚拟内存的大小仅由计算机的物理内存容量决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虚拟内存大小不只由物理内存容量决定，还和操作系统设置、磁盘可用空间等因素有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180711", "t": 3, "q": "虚拟内存管理中，\"页面颠簸\"（Thrashing）是指进程频繁进行页面置换，导致CPU利用率过低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "页面颠簸就是进程频繁换页，大量时间花在页面置换上，使CPU因等待页面调入调出而利用率极低。", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180712", "t": 3, "q": "虚拟内存技术允许程序使用比物理内存更大的地址空间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "虚拟内存技术将硬盘空间作为物理内存的扩展，能让程序使用的逻辑地址空间大于实际的物理内存空间。", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180713", "t": 3, "q": "虚拟内存中，页面置换算法影响系统性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "不同页面置换算法在处理页面置换时效率不同，若选择不当会频繁引发缺页中断，增加系统开销，影响系统性能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180714", "t": 3, "q": "虚拟设备技术通过SPOOLing实现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "SPOOLing技术是一种虚拟设备技术，它将独占设备改造为共享设备，实现了虚拟设备的功能。", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180715", "t": 3, "q": "虚拟设备技术需要大容量内存支持。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180716", "t": 3, "q": "页面置换算法的最佳实现需要预知未来的页面访问序列。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最佳页面置换算法是选择未来最长时间内不会被访问的页面进行置换，所以需要预知未来的页面访问序列。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180717", "t": 3, "q": "页面置换算法中，最近最久未使用（LRU）算法的缺页率一定低于先进先出（FIFO）算法。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "LRU和FIFO算法的缺页率高低受页面访问序列和内存块数量等多种因素影响，LRU不一定缺页率就低于FIFO。", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180718", "t": 3, "q": "银行家算法是一种死锁预防算法。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "银行家算法是死锁避免算法，不是死锁预防算法，它通过在资源分配前判断是否会进入不安全状态来避免死锁。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180719", "t": 3, "q": "优先级倒置问题只存在于实时操作系统中。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "优先级倒置并非只存在于实时操作系统，在非实时操作系统中也可能出现。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180720", "t": 3, "q": "在操作系统中，系统调用是应用程序与内核交互的接口。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "系统调用是操作系统提供给用户程序调用内核功能的接口，应用程序通过它与内核进行交互。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180721", "t": 3, "q": "在分页系统中，页表由硬件实现。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "页表一般是由软件和硬件共同实现的，操作系统负责页表的创建和管理等操作，硬件则辅助完成地址转换等功能，并非单纯由硬件实现。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180722", "t": 3, "q": "在嵌入式系统中，软实时和硬实时任务可以混合调度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180723", "t": 3, "q": "在I/O系统中，DMA方式可以减少CPU的干预。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DMA（直接内存访问）方式下，数据在内存和外设间直接传输，无需CPU全程干预，仅在传输开始和结束时由CPU处理，能大大减少CPU干预。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180724", "t": 3, "q": "题目题目1", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180725", "t": 3, "q": "DMA方式在数据传输过程中需要CPU的全程参与。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "DMA（直接内存访问）方式的特点就是在数据传输时，无需CPU全程参与，可直接在内存和外设间进行数据传输。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180726", "t": 3, "q": "DMA控制方式中，CPU只需初始化DMA控制器，后续数据传输无需CPU干预。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在DMA控制方式下，CPU先对DMA控制器进行初始化，设定传输数据的起始地址、传输长度等参数，之后数据在内存和外设间直接传输，无需CPU干预。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180727", "t": 3, "q": "DMA控制器与CPU可同时访问内存，不会产生冲突。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "DMA控制器在进行直接内存访问时，会与CPU竞争内存资源，可能产生冲突。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180728", "t": 3, "q": "I/O控制方式中，通道控制方式的CPU干预程度最低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "通道控制方式有自己的通道指令，能独立于CPU进行I/O操作，可实现CPU、通道和I/O设备并行工作，CPU干预程度比起程序查询、程序中断、DMA等方式是最低的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180729", "t": 3, "q": "I/O中断处理程序的执行优先级低于用户进程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "I/O 中断处理程序是系统为响应 I/O 事件而执行的程序，其优先级高于用户进程，这样才能及时处理 I/O 事件，保障系统正常运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180730", "t": 3, "q": "I/O子系统中的设备驱动程序，是操作系统与设备控制器之间的接口程序。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "设备驱动程序负责将操作系统的命令转化为设备控制器能理解的信号，是连接操作系统和设备控制器的桥梁，即二者间的接口程序。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813827761180731", "t": 3, "q": "SPOOLing技术可以将独占设备改造成共享设备。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "SPOOLing技术通过在磁盘上开辟输入井和输出井，利用高速磁盘作为缓冲，将独占设备模拟成共享设备，使得多个进程可以“同时”使用该设备。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 计算机组成与体系结构（1）", "n": "基础练习题【含解析】 / 第5章 计算机组成与体系结构（1）", "qs": [{"id": "2034813834400763904", "t": 1, "q": "关于并行处理系统中的SMP（对称多处理器）架构，下列说法正确的是？", "a": ["只有一个处理器能访问主存，其他处理器需通过该处理器转发请求", "各处理器有独立的主存和I/O总线，通过高速互连网络通信", "处理器之间采用非对称任务分配，只有主处理器能执行操作系统内核指令", "各处理器共享统一的主存和I/O总线，每个处理器有独立的Cache", "", ""], "r": "D", "e": "SMP架构特点是各处理器共享统一主存和I/O总线，每个处理器有独立Cache。A选项只有一个处理器能访问主存错误；B选项各处理器有独立主存不符合SMP架构；C选项处理器对称分配任务，并非只有主处理器能执行内核指令。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763905", "t": 1, "q": "关于分布式处理系统与并行处理系统的区别，下列说法错误的是？", "a": ["分布式系统的处理能力随节点增加线性增长，并行系统的处理能力受阿姆达尔定律限制，无法线性增长", "分布式系统中各节点地理分布可能分散，并行系统中各处理器通常集中在同一物理机内", "分布式系统依赖网络通信，并行系统依赖共享总线或互连网络，通信延迟前者更大", "分布式系统中各节点可独立运行不同操作系统，并行系统中各处理器通常运行同一操作系统", "", ""], "r": "A", "e": "并行系统处理能力也可随处理器数量增加而线性增长，并非受阿姆达尔定律限制就无法线性增长，A说法错误；B、C、D选项对分布式处理系统与并行处理系统区别描述正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763906", "t": 1, "q": "关于计算机系统的\"存储层次结构\"，下列说法正确的是？", "a": ["存储层次结构的设计依据是程序的时间局部性和空间局部性原理", "从Cache到主存再到硬盘，容量逐渐减小，速度逐渐降低，单位成本逐渐降低", "存储层次中各层之间的数据调度由硬件自动完成，无需软件干预", "Cache的容量越大，主存的访问速度越快，存储层次的整体性能越好", "", ""], "r": "A", "e": "存储层次依靠程序时间、空间局部性设计，A 正确；Cache 到主存到硬盘容量逐渐变大，B 错误；主存和磁盘之间调度由操作系统软件完成，C 错误；Cache 容量增大到一定程度，性能提升微乎其微，不是越大整体性能一定越好，D 错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763907", "t": 1, "q": "关于微处理器的\"流水线深度\"，下列说法错误的是？", "a": ["流水线深度越大，处理器性能越高，不受其他因素限制", "增加流水线深度可提高处理器时钟频率，因为每个阶段的逻辑复杂度降低", "流水线深度过大可能导致\"流水线气泡\"增多，如分支预测失败时，需清空更多阶段", "流水线深度是指流水线包含的阶段数，深度越大，每条指令的平均执行周期越接近1个时钟周期", "", ""], "r": "A", "e": "处理器性能受多因素影响，并非流水线深度越大性能就越高，A说法太绝对；增加深度降低阶段逻辑复杂度可提高时钟频率，B正确；深度大分支预测失败时“流水线气泡”会增多，C正确；深度大指令平均执行周期接近1个时钟周期，D正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763908", "t": 1, "q": "关于微处理器的中断处理过程，下列步骤排序正确的是？<br />①保护断点和程序状态字<br />②执行中断服务程序<br />③检测中断请求并判优<br />④中断返回<br />⑤清除中断标志或屏蔽位", "a": ["③→①→⑤→②→④", "①→③→②→⑤→④", "①→③→⑤→②→④", "③→①→②→⑤→④", "", ""], "r": "D", "e": "先检测中断请求并判优，确定要处理的中断；接着保护断点和程序状态字，防止数据丢失；然后执行中断服务程序；之后清除中断标志或屏蔽位，以便后续能响应新中断；最后中断返回。所以顺序是③→①→②→⑤→④。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763909", "t": 1, "q": "关于指令的\"寻址方式\"，下列说法正确的是？", "a": ["基址寻址中，基址寄存器的内容通常由操作系统设置，用于实现程序的重定位", "以上说法均正确", "变址寻址中，变址寄存器的内容由用户程序设置，用于访问数组等连续数据", "相对寻址的有效地址=PC内容+位移量，适用于跳转指令，实现程序的位置无关性", "", ""], "r": "B", "e": "这几种寻址方式的描述均正确。基址寻址里基址寄存器内容常由操作系统设以实现程序重定位；变址寻址中变址寄存器内容由用户程序设来访问连续数据；相对寻址按有效地址公式计算，适用于跳转指令实现位置无关性。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763910", "t": 1, "q": "关于Cache的替换算法，\"LRU\"（最近最少使用）算法与\"FIFO\"（先进先出）算法的主要区别是？", "a": ["LRU根据数据最近未被使用的时长选择替换块，而FIFO则基于数据进入Cache的时间顺序来决定", "LRU实现起来比FIFO更简单，因为不需要记录每个数据的具体访问时间", "LRU能更好地适应程序的局部性原理，因此在大多数情况下其命中率会低于FIFO", "对于不同容量的Cache，LRU和FIFO的效果没有明显差异", "", ""], "r": "A", "e": "A. 正确 LRU（最近最少使用）算法根据数据最近一次被访问后经过的时间来选择替换块，优先淘汰最久未被使用的数据。<br />FIFO（先进先出）算法则根据数据进入 Cache 的时间顺序来决定替换，最先进入的数据最先被淘汰。<br />这正是两者的主要区别。<br />B. 错误 LRU 需要记录每个数据块的访问时间或维护访问顺序，实现起来通常比 FIFO 更复杂，而不是更简单。FIFO 只需维护一个队列，实现相对简单。<br />C. 错误 LRU 更符合程序访问的局部性原理（时间局部性），因此大多数情况下命中率会高于 FIFO，而不是低于 FIFO。<br />D. 错误 对于不同容量的 Cache，LRU 和 FIFO 的效果通常会有差异，不能笼统地说没有明显差异。", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763911", "t": 1, "q": "关于I/O接口的DMA（直接存储器访问）方式，下列说法正确的是？", "a": ["DMA传输过程包括:DMA请求→CPU响应→DMA初始化→数据传输→DMA结束", "DMA方式适用于高速、大批量数据传输，如磁盘I/O，不适用于低速设备如键盘", "DMA控制器与CPU共享主存，传输数据时会占用CPU的主存访问权，导致CPU阻塞", "DMA控制器在传输数据时，需CPU干预地址递增和数据传送，仅减少CPU中断次数", "", ""], "r": "B", "e": "DMA方式用于高速、大批量数据传输，像磁盘I/O，低速设备如键盘不适用。A项，传输过程应是DMA请求→DMA初始化→CPU响应→数据传输→DMA结束；C项，DMA传输数据时CPU可继续执行程序，不阻塞；D项，DMA传输时CPU不干预地址递增和数据传送。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763912", "t": 1, "q": "某分布式系统采用\"一致性哈希\"算法分配数据，其主要目的是？", "a": ["确保各节点存储的数据量均衡，避免部分节点过载", "提高数据访问速度，通过哈希定位快速找到数据所在节点", "当节点加入或退出系统时，减少数据迁移量，提高系统扩展性", "增强数据安全性，通过哈希加密防止数据被篡改", "", ""], "r": "C", "e": "一致性哈希算法核心优势是在节点加入或退出系统时，能减少数据迁移量，保障系统扩展性。A选项主要靠负载均衡策略；B选项哈希定位找数据不是一致性哈希主要目的；D选项哈希加密和一致性哈希无关。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813834400763913", "t": 1, "q": "某计算机的控制器采用微程序控制方式，微指令格式为:操作控制字段（20位，直接编码）+下地址字段（8位）。若微程序存储器容量为1KB（1024个微指令），则该微指令格式是否合理？", "a": ["不合理，操作控制字段20位过多，应缩减为16位，下地址字段改为12位，以匹配1KB容量", "不合理，下地址字段8位仅能表示256个微指令地址，而1KB微存储器需10位地址（2^10=1024），故应将下地址字段改为10位", "合理，操作控制字段20位可控制20个微操作，下地址字段8位足够，1KB需8位地址（2^8=256<1024，不合理）", "合理，下地址字段8位可表示256个微指令地址，1KB需10位地址，不合理，应将下地址字段改为10位", "", ""], "r": "B", "e": "
