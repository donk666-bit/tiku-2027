都是非对称加密算法。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895234", "t": 1, "q": "在密码学中，\"消息认证码（MAC）\"与\"哈希值\"的主要区别是？", "a": ["MAC具有单向性，哈希值不具有单向性", "MAC输出长度固定，哈希值输出长度可变", "MAC需要使用密钥生成，哈希值无需密钥", "MAC仅能验证完整性，哈希值可验证完整性和身份", "", ""], "r": "C", "e": "消息认证码（MAC）生成时需用密钥，而哈希值计算无需密钥，这是二者主要区别。A选项二者都有单向性；B选项二者输出长度一般固定；D选项二者都可验证完整性，MAC还能认证身份。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895235", "t": 1, "q": "在密码学中，“消息认证码（MAC）”与“数字签名”的主要区别是？", "a": ["MAC可提供不可否认性，数字签名不提供", "MAC由发送方和接收方共享密钥生成，数字签名用发送方私钥生成", "MAC仅能验证消息完整性，数字签名仅能验证身份", "MAC需要使用密钥，数字签名不需要", "", ""], "r": "B", "e": "消息认证码MAC是基于发送方和接收方共享密钥生成，用于验证消息完整性等；数字签名是用发送方私钥生成，可提供身份验证、不可否认性等。A选项数字签名可提供不可否认性；C选项MAC和数字签名都能验证消息完整性和身份；D选项数字签名也需要密钥（私钥）。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895236", "t": 1, "q": "在密码学中，\"一次性密码本（One-Time Pad）\"满足无条件安全的前提是？", "a": ["密钥为固定长度，与明文长度无关", "密钥仅使用一次，且与明文长度相同", "密钥可重复使用，只要不被泄露", "密钥长度小于明文长度", "", ""], "r": "B", "e": "一次性密码本要无条件安全，需密钥仅用一次且和明文长度相同。A选项密钥固定长度与明文无关不符合要求；C选项密钥可重复使用不安全；D选项密钥长度小于明文长度也无法保证安全。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895237", "t": 1, "q": "在密码学中，\"RSA算法\"的安全性基于以下哪种数学难题？", "a": ["离散对数问题", "大整数分解问题", "椭圆曲线离散对数问题", "背包问题", "", ""], "r": "B", "e": "RSA算法安全性依赖于将两个大素数相乘容易，但对其乘积进行因式分解困难，也就是大整数分解问题。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895238", "t": 1, "q": "在密码学中，\"TLS 1.3\"相比\"TLS 1.2\"的主要安全改进是？", "a": ["仅支持对称加密，不支持非对称加密", "移除了RC4、SHA-1等不安全的加密和哈希算法", "不支持前向secrecy（前向保密）", "仅能在HTTPS协议中使用，无法在其他协议中使用", "", ""], "r": "B", "e": "TLS 1.3移除了RC4、SHA - 1等不安全的加密和哈希算法以增强安全性。A选项TLS 1.3支持非对称加密；C选项TLS 1.3支持前向保密；D选项TLS 1.3并非仅能用于HTTPS协议。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895239", "t": 1, "q": "在密码学中，某加密算法使用相同的密钥进行加密和解密，且该算法的分组长度为64位，密钥长度可选择128位、192位或256位，该算法最可能是以下哪一个？", "a": ["3DES", "DES", "AES", "Blowfish", "", ""], "r": "C", "e": "3DES和DES密钥长度固定，不符合可选择128、192、256位；Blowfish分组长度可变，非固定64位；AES是对称加密（用相同密钥加解密），分组长度为64位，密钥长度可选128、192、256位。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895240", "t": 1, "q": "在网络安全中，\"零信任架构\"的核心理念是？", "a": ["默认不信任任何内部或外部的访问请求，需持续验证身份和权限", "仅信任内部网络中的设备，不信任外部网络设备", "仅通过防火墙和杀毒软件实现安全防护", "信任所有已接入网络的设备，仅对外部设备进行严格验证", "", ""], "r": "A", "e": "零信任架构强调打破传统基于网络边界的信任模式，不管是内部还是外部访问请求，都默认不信任，要持续验证身份和权限。B选项仅信任内部设备不符合其理念；C选项只靠防火墙和杀毒软件太片面；D选项信任已接入设备与零信任理念相悖。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895241", "t": 1, "q": "在网络安全中，\"最小权限原则\"的核心目的是？", "a": ["要求用户定期更换密码", "确保网络设备仅开放必要端口", "防止外部攻击者突破防火墙", "限制主体对客体的访问权限，降低风险扩散范围", "", ""], "r": "D", "e": "最小权限原则就是让主体仅拥有完成任务所需最少权限，以此降低一旦权限被滥用时风险扩散范围。A是密码管理措施；B是端口管理；C防火墙主要防外部攻击，均非最小权限原则核心目的。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895242", "t": 1, "q": "在网络安全中，IDS（入侵检测系统）与IPS（入侵防御系统）的核心区别是？", "a": ["IDS支持实时防护，IPS仅支持事后分析", "IDS部署在网络出口，IPS部署在网络内部", "IDS仅检测入侵行为，IPS可检测并阻断入侵行为", "IDS基于签名检测，IPS基于异常检测", "", ""], "r": "C", "e": "IDS主要功能是检测入侵行为，发现后发出警报；IPS除了检测，还能实时阻断入侵行为，这是二者核心区别。A选项中IPS支持实时防护，B选项部署位置不是核心区别，D选项两种系统都有多种检测方式。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895243", "t": 1, "q": "在网络协议安全分析中，某攻击利用TCP三次握手的漏洞，向目标主机发送大量SYN报文但不回应ACK报文，导致目标主机半连接队列满而无法处理正常连接，该攻击属于以下哪种类型？", "a": ["TCP FIN Flood攻击", "ARP欺骗攻击", "TCP SYN Flood攻击", "TCP RST攻击", "", ""], "r": "C", "e": "题中描述是向目标主机发大量SYN报文且不回应ACK，使半连接队列满，这是TCP SYN Flood攻击的典型特征。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895244", "t": 1, "q": "在网络协议安全分析中，下列哪种协议常用于VPN（虚拟专用网络），且通过ESP（封装安全载荷）提供数据机密性与完整性保护？", "a": ["HTTP", "IPsec", "Telnet", "FTP", "", ""], "r": "B", "e": "IPsec常用于VPN，ESP是IPsec协议中的一部分，可提供数据机密性与完整性保护。HTTP用于传输超文本，Telnet用于远程登录，FTP用于文件传输，它们都不是常用于VPN且依靠ESP保护数据的协议。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895245", "t": 1, "q": "在网络协议安全分析中，下列哪种协议的设计缺陷可能导致\"中间人攻击\"，且默认不提供身份认证机制？", "a": ["IPsec", "HTTPS", "TLS 1.3", "FTP", "", ""], "r": "D", "e": "IPsec、HTTPS、TLS 1.3都有较好的安全机制和身份认证，而FTP默认不加密，无身份认证机制，易遭受中间人攻击。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895246", "t": 1, "q": "在网络协议安全中，下列哪种攻击利用了TCP三次握手过程中SYN报文未被及时确认的漏洞，导致服务器资源耗尽？", "a": ["TCP重置攻击", "ACK风暴攻击", "SYN Flood攻击", "UDP放大攻击", "", ""], "r": "C", "e": "SYN Flood攻击利用TCP三次握手时SYN报文未及时确认，不断发送SYN包使服务器资源耗尽。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895247", "t": 1, "q": "在网络协议安全中，下列哪种攻击属于\"应用层攻击\"，且常利用Web应用的输入验证缺陷？", "a": ["SYN Flood攻击", "IP地址欺骗攻击", "SQL注入攻击", "ARP欺骗攻击", "", ""], "r": "C", "e": "应用层攻击针对应用程序，SQL注入攻击利用Web应用输入验证缺陷，通过构造恶意SQL语句来攻击数据库，属应用层攻击。而SYN Flood是网络层的拒绝服务攻击，IP地址欺骗攻击是网络层利用伪造IP实施，ARP欺骗攻击是链路层通过伪造ARP报文进行。所以选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895248", "t": 1, "q": "在网络协议安全中，下列哪种攻击通过伪造ARP响应报文，篡改主机ARP缓存表，导致流量被劫持？", "a": ["ARP欺骗攻击", "IP欺骗攻击", "DNS欺骗攻击", "SYN Flood攻击", "", ""], "r": "A", "e": "ARP欺骗攻击就是伪造ARP响应报文，篡改主机ARP缓存表，使流量被劫持。IP欺骗攻击伪造IP地址；DNS欺骗攻击伪造DNS响应；SYN Flood攻击是利用TCP协议缺陷进行攻击。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895249", "t": 1, "q": "在网络协议安全中，HTTP协议的\"Cookie\"字段，若未设置\"Secure\"属性，可能导致的安全风险是？", "a": ["Cookie过期时间过长，导致会话长期有效", "Cookie被存储在本地文件中，占用磁盘空间", "Cookie在HTTP明文传输时被窃听，导致会话信息泄露", "Cookie被篡改，导致用户身份伪造", "", ""], "r": "C", "e": "“Secure”属性可确保Cookie只通过HTTPS加密连接传输，未设置该属性时，HTTP明文传输中Cookie易被窃听，造成会话信息泄露。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895250", "t": 1, "q": "在网络协议安全中，TCP协议的\"滑动窗口\"机制，若被攻击者利用，可能导致哪种安全问题？", "a": ["缓冲区溢出攻击", "流量劫持", "窗口溢出攻击", "会话劫持", "", ""], "r": "C", "e": "TCP协议的“滑动窗口”机制用于控制数据流，确保数据的有序传输。如果这个机制被攻击者利用，最可能的安全问题是“窗口溢出攻击”。TCP的滑动窗口机制允许发送方在未收到确认的情况下连续发送多个数据包。窗口大小可以根据网络状况动态调整。如果攻击者能够伪造TCP包，使接收方的窗口大小异常增大，发送方就会不停地发送数据，导致接收方的缓冲区溢出，这种现象称为“窗口溢出攻击”。所以，正确答案是C.窗口溢出攻击。", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895251", "t": 1, "q": "在HTTPS协议中，SSL/TLS握手过程的主要目的是？", "a": ["检测传输过程中的丢包问题", "对传输的网页内容进行压缩", "验证服务器身份并协商会话密钥", "传输HTTP请求报文", "", ""], "r": "C", "e": "SSL/TLS握手用于客户端与服务器建立安全连接，核心是验证服务器身份并协商出用于后续加密通信的会话密钥。A检测丢包不是握手主要目的；B内容压缩与握手无关；D传输HTTP请求报文在握手之后。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813945788895252", "t": 1, "q": "在TCP/IP协议栈中，下列哪种攻击利用了TCP三次握手过程中SYN报文未被及时确认的漏洞，导致服务器资源耗尽？", "a": ["ARP欺骗攻击", "SYN洪水攻击", "TCP重置攻击", "TCP会话劫持攻击", "", ""], "r": "B", "e": "SYN洪水攻击通过发送大量伪造源地址的SYN报文，使服务器等待确认，耗尽服务器资源，正是利用了TCP三次握手过程中SYN报文未被及时确认的漏洞。ARP欺骗攻击是篡改ARP缓存；TCP重置攻击是发送RST包中断连接；TCP会话劫持攻击是获取已建立连接控制权。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165696", "t": 2, "q": "下列哪些密码算法属于\"量子安全密码算法\"，即能抵御量子计算攻击的算法？（　）", "a": ["格基密码算法（如CRYSTALS-Kyber）", "ECC算法", "RSA算法", "基于代码的密码算法（如McEliece）", "", ""], "r": "AD", "e": "ECC算法和RSA算法易受量子计算攻击，而格基密码算法和基于代码的密码算法具有抵御量子计算攻击的特性。答案：AD", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165697", "t": 2, "q": "下列哪些密码学技术可用于保证数据的完整性？（　）", "a": ["非对称加密算法（如RSA）", "数字签名", "对称加密算法（如AES）", "消息认证码（MAC）", "", ""], "r": "BD", "e": "数字签名和消息认证码都能验证数据在传输或存储过程中是否被篡改，保证数据完整性。非对称加密主要用于密钥交换、身份认证等；对称加密侧重于数据加密保护。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165698", "t": 2, "q": "下列哪些逆向工程技术可用于分析程序的加壳保护，为脱壳做准备？（　）", "a": ["使用脱壳工具（如UPX-d）对已知壳程序进行自动脱壳", "静态分析加壳程序的汇编代码，识别加壳算法", "动态调试跟踪程序加载过程，找到OEP（原始入口点）", "直接运行加壳程序，无需分析即可脱壳", "", ""], "r": "ABC", "e": "答案：ABC本题考察逆向工程中用于分析程序加壳保护的技术手段。A 选项，使用专门的脱壳工具对已知壳程序进行自动脱壳，是常见的分析手段之一。B 选项，通过静态分析加壳程序的汇编代码来识别加壳算法，有助于了解加壳机制。C 选项，动态调试跟踪程序加载过程以找到原始入口点，对于脱壳很重要。D 选项，直接运行加壳程序而不进行分析通常无法实现脱壳。综上所述，正确答案是 ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165699", "t": 2, "q": "下列哪些属于逆向工程中的\"静态分析技术\"，即无需运行程序即可进行的分析？（　）", "a": ["二进制文件字符串提取", "函数调用关系分析", "汇编代码反编译为伪代码", "查看程序内存中的数据", "", ""], "r": "ABC", "e": "静态分析无需运行程序。A提取二进制文件字符串、B分析函数调用关系、C将汇编代码反编译为伪代码都不依赖程序运行；而D查看程序内存中的数据，程序必须运行才会有内存数据。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165700", "t": 2, "q": "下列哪些属于网络安全中的\"被动防护技术\"，即仅能检测或记录安全事件，无法主动阻止的技术？（　）", "a": ["IDS（入侵检测系统）", "数据备份与恢复", "杀毒软件（仅检测模式）", "日志审计系统", "", ""], "r": "ACD", "e": "IDS、仅检测模式的杀毒软件和日志审计系统都主要是对安全事件进行检测、记录，不能主动阻止；数据备份与恢复是应对数据丢失等情况的措施，并非检测记录安全事件。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165701", "t": 2, "q": "下列哪些属于网络安全中的\"主动防护技术\"，即能主动阻止或缓解安全威胁的技术？（　）", "a": ["防火墙（状态检测型）", "数据备份与恢复", "自动补丁管理系统", "IDS（入侵检测系统）", "", ""], "r": "AC", "e": "状态检测型防火墙能主动对网络数据包进行检测和过滤，阻止不安全流量，属于主动防护；自动补丁管理系统可主动发现并安装系统补丁，预防安全漏洞被利用，是主动防护。数据备份与恢复是事后补救措施；IDS 主要是检测入侵，本身不主动阻止威胁。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165702", "t": 2, "q": "下列哪些算法属于密码学中的哈希算法，可用于数据完整性校验？（　）", "a": ["AES-128", "SHA-256", "RSA", "SHA-1", "", ""], "r": "BD", "e": "AES - 128是对称加密算法，RSA是非对称加密算法，SHA - 256和SHA - 1是哈希算法，可用于数据完整性校验。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165703", "t": 2, "q": "下列哪些网络安全策略可用于防御DDoS攻击？（　）", "a": ["部署DDoS高防IP，将流量引至高防节点清洗", "配置SYN Cookie，抵御SYN洪水攻击", "关闭服务器所有网络端口", "部署IPS，拦截异常流量", "", ""], "r": "ABD", "e": "A选项部署DDoS高防IP能将流量引至节点清洗，可防御DDoS；B选项配置SYN Cookie可抵御SYN洪水这种DDoS攻击；D选项部署IPS能拦截异常流量，对DDoS有防御作用。而C选项关闭服务器所有网络端口会使服务器无法正常提供服务，不是合理防御DDoS的策略。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165704", "t": 2, "q": "下列哪些网络安全技术可用于保障无线网络（如Wi-Fi）的安全性？（　）", "a": ["WPA3加密协议", "MAC地址过滤", "WEP加密协议", "隐藏SSID（服务集标识符）", "", ""], "r": "ABD", "e": "WPA3是较新且安全的无线网络加密协议；MAC地址过滤可限制接入设备；隐藏SSID让网络不被轻易发现，都能保障Wi - Fi安全。而WEP加密协议存在较多安全漏洞，已不适合保障安全。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165705", "t": 2, "q": "下列哪些网络协议安全机制可用于保障HTTPS协议的安全性？（　）", "a": ["哈希算法（如SHA-256）", "SSL/TLS握手协议", "数字证书（X.509证书）", "ICMP协议", "", ""], "r": "ABC", "e": "HTTPS是超文本传输安全协议，SSL/TLS握手协议用于建立安全连接，数字证书用于身份验证，哈希算法用于数据完整性校验，它们都保障了HTTPS安全性；ICMP协议主要用于网络设备间传递错误信息和控制信息，与HTTPS安全无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165706", "t": 2, "q": "以下关于网络安全\"零信任\"架构的实现技术有哪些？", "a": ["最小权限原则（PoLP）", "仅依赖网络边界防火墙", "多因素认证（MFA）", "持续身份验证（实时验证用户身份和权限）", "", ""], "r": "ACD", "e": "“零信任”架构强调默认不信任、始终验证。A最小权限原则可限制用户权限，符合零信任理念；C多因素认证增加身份验证可靠性；D持续身份验证实时确认用户状态，都是实现技术。而B仅依赖网络边界防火墙是传统安全思路，不符合零信任打破边界限制的理念。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165707", "t": 2, "q": "以下关于网络安全\"漏洞管理\"的流程，正确的有哪些？", "a": ["漏洞验证（验证修复后的漏洞是否已解决）", "漏洞忽略（所有漏洞均无需处理，直接忽略）", "漏洞评估（评估漏洞的风险等级，如CVSS评分）", "漏洞扫描（发现系统中的漏洞）", "", ""], "r": "ACD", "e": "漏洞管理流程通常是先进行漏洞扫描发现漏洞，接着评估漏洞风险等级，然后进行修复，最后验证修复情况。而所有漏洞都直接忽略显然不合理。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165708", "t": 2, "q": "以下关于网络安全\"入侵检测系统（IDS）\"的描述，正确的有哪些？", "a": ["IDS可分为基于特征的IDS和基于异常的IDS", "IDS的误报率和漏报率是评估其性能的重要指标", "基于特征的IDS可识别已知攻击，无法识别未知攻击", "基于异常的IDS通过建立正常行为基线，识别偏离基线的异常行为", "", ""], "r": "ABCD", "e": "入侵检测系统（IDS）有基于特征和基于异常两种类型；误报率和漏报率是衡量其性能的关键指标；基于特征的IDS依据已知攻击特征识别，不能识别未知攻击；基于异常的IDS通过建立正常行为基线来识别异常。ABCD选项描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165709", "t": 2, "q": "以下关于网络协议安全的描述，错误的有哪些？", "a": ["SSH协议的默认端口号是22，Telnet协议的默认端口号是23", "SNMP协议的默认端口号是161（UDP），Trap端口是162（UDP）", "HTTPS协议的端口号是443，HTTP协议的端口号是80", "FTP协议的数据传输端口是20，控制端口是21", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165710", "t": 2, "q": "以下关于网络协议安全的描述，正确的有哪些？", "a": ["FTP协议可通过FTPS（FTP+SSL/TLS）实现加密传输", "HTTP协议可通过TLS层升级为HTTPS，实现安全传输", "SNMPv3协议支持数据加密和身份认证，安全性优于SNMPv1/v2", "Telnet协议默认使用加密传输，安全性高", "", ""], "r": "ABC", "e": "A中FTPS是在FTP基础上加SSL/TLS实现加密传输；B里HTTP通过TLS升级为HTTPS能安全传输；C的SNMPv3相比v1/v2支持加密和认证，安全性更高；而D的Telnet协议默认明文传输，不安全。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165711", "t": 2, "q": "以下关于IPSec协议组件的描述，正确的有哪些？", "a": ["ESP协议仅提供数据加密，不提供完整性校验", "AH协议可提供数据加密功能", "ESP协议可提供数据加密和完整性校验", "IPSec的IKE协议用于协商加密算法和密钥", "", ""], "r": "CD", "e": "ESP协议能提供数据加密和完整性校验；AH协议主要是提供数据完整性和认证，不提供加密；IKE协议用于IPsec双方协商加密算法和密钥。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165712", "t": 2, "q": "以下属于网络安全\"社会工程学攻击\"的类型有哪些？", "a": ["钓鱼邮件（伪装成合法邮件，骗取用户账号密码）", "shoulder surfing（偷窥用户输入密码）", "pretexting（编造借口，骗取敏感信息）", "SQL注入攻击（通过输入恶意SQL语句获取数据）", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165713", "t": 2, "q": "以下属于网络安全\"数据备份与恢复\"策略的有哪些？", "a": ["差异备份（仅备份上次全量备份后修改的数据）", "实时备份（数据变化时立即备份）", "不备份，仅依赖防火墙防护", "定期全量备份", "", ""], "r": "ABD", "e": "数据备份与恢复策略旨在保障数据安全，A差异备份、B实时备份、D定期全量备份都是常见备份方式；而C不备份仅依赖防火墙防护，没有涉及数据备份，不符合要求。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165714", "t": 2, "q": "以下属于网络安全\"数据销毁\"技术的有哪些？", "a": ["文件删除（仅删除文件目录项，数据仍可恢复）", "数据覆盖（用随机数据多次覆盖存储介质上的原始数据）", "物理销毁（如粉碎硬盘、焚烧存储介质）", "低级格式化（清除磁盘所有数据，无法恢复）", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165715", "t": 2, "q": "以下属于网络安全\"应用层漏洞\"的有哪些？", "a": ["跨站脚本（XSS）漏洞", "SQL注入漏洞", "跨站请求伪造（CSRF）漏洞", "缓冲区溢出漏洞", "", ""], "r": "ABC", "e": "应用层漏洞是发生在应用程序层面的安全问题。A跨站脚本（XSS）、B SQL注入、C跨站请求伪造（CSRF）都属于应用层的典型漏洞；而D缓冲区溢出漏洞通常是在系统底层代码层面，不属于应用层漏洞。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165716", "t": 2, "q": "以下属于网络安全\"终端安全防护\"技术的有哪些？", "a": ["终端漏洞扫描（定期扫描终端中的漏洞）", "终端加密（如磁盘加密、文件加密）", "网络防火墙（部署在网络边界）", "终端准入控制（如未安装杀毒软件的终端无法接入网络）", "", ""], "r": "ABD", "e": "终端安全防护主要针对终端设备进行保护。A可发现终端漏洞，B能对终端数据加密，D可控制终端接入保障安全；C网络防火墙部署在网络边界，主要是对网络整体防护，并非终端安全防护技术。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165717", "t": 2, "q": "以下属于网络安全\"主动防御技术\"的有哪些？", "a": ["入侵防御系统（IPS）", "病毒查杀软件（实时防护）", "蜜罐技术", "防火墙（状态检测型）", "", ""], "r": "ABC", "e": "答案：ABC分析：防火墙属于被动防御，其他均属于主动防御技术", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165718", "t": 2, "q": "以下属于网络安全\"DDoS攻击防御技术\"的有哪些？", "a": ["防火墙包过滤（基于IP/端口过滤流量）", "流量清洗（将异常流量过滤，仅转发正常流量）", "入侵检测系统（IDS）告警", "黑洞路由（将攻击流量引导至空路由，避免影响目标）", "", ""], "r": "BD", "e": "答案：BD。答案防火墙包过滤和入侵检测系统(IDS)告警都属于DDoS攻击预防技术，而流量清洗和黑洞路由属于DDoS攻击防御技术。", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165719", "t": 2, "q": "以下属于网络安全\"Web应用防火墙（WAF）\"可防御的攻击类型有哪些？", "a": ["TCP SYN Flood攻击", "跨站脚本（XSS）攻击", "文件上传漏洞攻击（如上传恶意脚本）", "跨站请求伪造（CSRF）攻击", "", ""], "r": "BCD", "e": "Web应用防火墙主要防护Web应用层面的攻击。XSS、文件上传漏洞、CSRF都属于Web应用常见攻击类型，而TCP SYN Flood攻击是网络层的拒绝服务攻击，WAF主要针对应用层防护，难以防御此类攻击。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165720", "t": 2, "q": "以下属于网络协议安全中\"传输层安全协议\"的有哪些？", "a": ["HTTPS", "TLS", "IPSec", "SSH", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165721", "t": 2, "q": "在非对然加密体系中，下列哪些操作需要使用私钥完成？（　）", "a": ["验证接收方发送的数字签名", "生成数字签名，供接收方用公钥验证", "从接收方公钥加密的会话密钥中解密，获取对称密钥", "向接收方发送公钥", "", ""], "r": "BC", "e": "私钥是个人秘密持有，用于签名和解密。生成数字签名需用私钥，接收方用公钥验证；用私钥可从公钥加密的会话密钥中解密获取对称密钥。验证签名用公钥，发送公钥无需私钥。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165722", "t": 2, "q": "在非对称加密体系中，下列哪些场景需要使用公钥完成操作？（　）", "a": ["发送方用公钥生成数字签名", "接收方用公钥解密发送方用私钥加密的信息", "接收方用公钥验证发送方的身份", "接收方用公钥解密发送方用私钥加密的数字签名", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165723", "t": 2, "q": "在密码学中，\"对称加密算法\"的特点包括下列哪些？（　）", "a": ["加密速度通常比非对称加密快", "适合对大量数据进行加密", "密钥分发过程安全，无需额外机制", "使用相同的密钥进行加密和解密", "", ""], "r": "ABD", "e": "对称加密用相同密钥加解密，速度快，适合大量数据加密。但密钥分发不安全，需额外机制。所以ABD正确，C错误。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165724", "t": 2, "q": "在密码学中，“对称加密算法”的优点有哪些？", "a": ["加密解密速度快", "密钥管理简单（仅需共享一个密钥）", "提供不可否认性", "适合加密大量数据", "", ""], "r": "ABD", "e": "对称加密算法使用相同密钥进行加密和解密，运算过程相对简单，所以加密解密速度快，也适合加密大量数据，且只需共享一个密钥，密钥管理简单。而不可否认性一般由非对称加密结合数字签名等实现，对称加密无法提供。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165725", "t": 2, "q": "在密码学中，\"非对称加密算法\"的应用场景有哪些？", "a": ["加密大量数据（如文件加密）", "身份认证（如数字证书）", "密钥交换（如DH算法交换对称密钥）", "消息认证码（MAC）生成", "", ""], "r": "BC", "e": "非对称加密速度慢，不适用于加密大量数据；可用于身份认证，数字证书就基于此；能进行密钥交换，如DH算法；而消息认证码生成一般用对称加密。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165726", "t": 2, "q": "在密码学中，“量子计算”对传统密码算法的威胁主要包括下列哪些？（　）", "a": ["对AES等对称加密算法威胁较小，需更长密钥抵御", "可快速破解RSA算法基于的大整数分解问题", "可破解所有对称加密算法", "可破解哈希算法的抗碰撞性", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165727", "t": 2, "q": "在密码学中，\"前向保密（Forward Secrecy）\"的核心思想是？", "a": ["会话密钥仅使用一次，下次会话重新生成", "会话密钥不依赖长期私钥，即使长期私钥泄露，已有的会话数据也无法解密", "每次通信都使用不同的临时密钥对进行加密", "会话密钥通过对称加密算法生成，不使用非对然加密", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165728", "t": 2, "q": "在密码学中，“数字签名”需满足的安全特性有哪些？", "a": ["完整性", "不可否认性", "可重用性", "机密性", "", ""], "r": "AB", "e": "数字签名要确保消息未被篡改体现完整性，能让签名者无法否认自己的签名体现不可否认性。而可重用性会带来安全风险，数字签名不是为了保证机密性，主要关注身份验证和防抵赖等。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165729", "t": 2, "q": "在密码学中，\"数字证书\"的作用包括下列哪些？（　）", "a": ["验证证书持有者的身份", "证明证书持有者的公钥合法性", "确保证书持有者的公钥不被篡改", "为数据传输提供对称密钥", "", ""], "r": "ABC", "e": "数字证书可验证持有者身份，证明其公钥合法性并防止公钥被篡改。但它不为数据传输提供对称密钥。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165730", "t": 2, "q": "在密码学中，\"消息认证码（MAC）\"的安全特性有哪些？", "a": ["身份认证（验证消息发送方身份）", "完整性（消息被篡改可检测）", "不可否认性（发送方无法否认发送消息）", "抗伪造性（攻击者无法伪造合法MAC）", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165731", "t": 2, "q": "在密码学中，属于\"对称加密算法\"的有哪些？", "a": ["AES", "3DES", "DES", "RSA", "", ""], "r": "ABC", "e": "AES、3DES、DES 是对称加密算法，加密和解密用相同密钥；RSA 是非对称加密算法，有公私钥之分。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165732", "t": 2, "q": "在密码学中，属于\"哈希算法\"的有哪些？", "a": ["SHA-256", "SHA-1", "MD5", "RSA", "", ""], "r": "ABC", "e": "A、B、C选项的SHA - 256、SHA - 1、MD5都属于哈希算法，用于生成数据的哈希值；而RSA是一种非对称加密算法，并非哈希算法。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165733", "t": 2, "q": "在网络安全中，\"漏洞扫描技术\"的主要功能包括下列哪些？（　）", "a": ["直接修复目标系统的所有漏洞", "检测目标系统存在的软件漏洞（如未修复的CVE漏洞）", "生成漏洞扫描报告，提供修复建议", "检测目标系统开放的网络端口和服务", "", ""], "r": "BCD", "e": "漏洞扫描技术主要是检测目标系统的漏洞、开放端口和服务等情况，并生成报告给出修复建议，不能直接修复所有漏洞。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165734", "t": 2, "q": "在网络安全中，\"身份认证\"的常用方法包括下列哪些？（　）", "a": ["基于令牌的认证（如动态口令令牌）", "基于生物特征的认证（如指纹、人脸）", "基于IP地址的认证", "基于MAC地址的认证", "", ""], "r": "AB", "e": "身份认证是确认用户身份的过程。A选项动态口令令牌能提供一次性密码，增加安全性；B选项生物特征具有唯一性，可用于身份认证。而C选项IP地址易被伪造和篡改，D选项MAC地址也可被修改，它们都不能可靠地用于身份认证。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165735", "t": 2, "q": "在网络安全中，属于\"身份认证技术\"的有哪些？", "a": ["MAC地址认证", "指纹识别", "密码认证", "IP地址认证", "", ""], "r": "BC", "e": "身份认证是确认用户身份的技术。MAC地址、IP地址易被伪造，通常不单独用于身份认证。指纹识别是生物特征认证，密码认证是常见的身份认证方式，它们能有效确认用户身份。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165736", "t": 2, "q": "在网络安全中，属于\"网络边界防护\"的技术或设备有哪些？", "a": ["内网的漏洞扫描工具", "防火墙", "路由器的访问控制列表（ACL）", "VPN网关", "", ""], "r": "BCD", "e": "网络边界防护是防止外部网络对内部网络的非法访问。防火墙、路由器的访问控制列表（ACL）和VPN网关都用于网络边界处的访问控制和安全防护；而内网漏洞扫描工具是对内网进行安全检测，并非用于边界防护。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165737", "t": 2, "q": "在网络安全中，下列哪些属于\"应用层安全漏洞\"，主要存在于Web应用程序中？（　）", "a": ["文件上传漏洞", "跨站请求伪造（CSRF）漏洞", "SQL注入漏洞", "跨站脚本（XSS）漏洞", "", ""], "r": "ABCD", "e": "这些选项所涉及的漏洞都属于应用层安全漏洞且常见于Web应用程序。文件上传漏洞可使攻击者上传恶意文件；CSRF可诱骗用户执行恶意操作；SQL注入可利用输入漏洞操作数据库；XSS能在页面注入恶意脚本。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165738", "t": 2, "q": "在网络协议安全分析中，可能导致\"会话劫持\"的漏洞有哪些？", "a": ["TCP协议的序列号预测漏洞", "HTTPS协议的证书过期", "HTTP协议的Cookie未设置HttpOnly属性", "Telnet协议的会话标识泄露", "", ""], "r": "ACD", "e": "A项TCP序列号可被预测就可能被攻击者利用进行会话劫持；B项证书过期主要影响通信安全性和信任度，非导致会话劫持；C项Cookie未设HttpOnly易致信息泄露，但不是直接会话劫持漏洞；D项Telnet会话标识泄露会使攻击者可能劫持会话。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813950155165739", "t": 2, "q": "在TCP/IP协议安全中，下列哪些协议或技术可用于防止IP地址欺骗攻击？（　）", "a": ["TCP SYN Cookie", "ARP缓存静态绑定", "DNSSEC（DNS安全扩展）", "IPsec的AH（认证头）协议", "", ""], "r": "BD", "e": "ARP缓存静态绑定可防止ARP欺骗间接防止IP地址欺骗；IPsec的AH协议能对IP数据包进行认证，防止IP地址被伪造。TCP SYN Cookie用于防范SYN洪泛攻击，DNSSEC用于保障DNS的安全，与防止IP地址欺骗攻击无关。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951618977792", "t": 3, "q": "网络安全的\"社会工程学攻击\"主要利用技术漏洞（如缓冲区溢出）获取敏感信息，与用户的心理弱点无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "社会工程学攻击主要是利用人的心理弱点，如信任、好奇等，通过欺骗等手段获取敏感信息，并非利用技术漏洞。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951618977793", "t": 3, "q": "网络安全的\"数据备份\"策略中，增量备份相比差异备份，每次备份的数据量更小，备份速度更快，但恢复时需要全量备份和所有增量备份的集合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "增量备份只备份自上次备份以来发生变化的数据，差异备份备份自上次全量备份以来发生变化的数据，所以增量备份每次备份量更小、速度更快。恢复时增量备份需全量备份和所有增量备份集合。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951618977794", "t": 3, "q": "网络安全的\"终端准入控制（NAC）\"技术可确保只有安装了最新杀毒软件、打齐系统补丁的终端才能接入企业网络。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "终端准入控制（NAC）技术能对终端设备进行检查和评估，可设置规则要求终端安装最新杀毒软件、打齐系统补丁等条件，满足条件才允许接入企业网络。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951618977795", "t": 3, "q": "网络安全的\"纵深防御\"模型仅需在网络边界部署防火墙和IDS，无需在主机和应用层部署安全措施。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“纵深防御”强调多层次、全方位防护，只在网络边界部署防火墙和 IDS 远远不够，主机和应用层也需部署安全措施来构建完整防护体系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951618977796", "t": 3, "q": "网络安全的\"Web应用防火墙（WAF）\"可有效防御TCP SYN Flood等传输层DDoS攻击。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "Web应用防火墙（WAF）主要针对Web应用层的攻击进行防护，而TCP SYN Flood是传输层DDoS攻击，WAF无法有效防御此类攻击。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951618977797", "t": 3, "q": "网络安全中的\"安全审计\"仅需记录用户的登录行为，无需记录用户的操作内容，即可满足事后追溯需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "安全审计不仅要记录用户登录行为，还需记录操作内容，才能全面满足事后追溯需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951618977798", "t": 3, "q": "网络安全中的\"防火墙\"不仅能过滤网络层流量，还能深度检测应用层协议（如HTTP）的恶意请求，实现应用层防护。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "防火墙有多种类型，其中状态检测防火墙等不仅能在网络层过滤流量，还具备对应用层协议（如 HTTP）进行深度检测，可识别并阻止恶意请求，实现应用层防护。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951618977799", "t": 3, "q": "网络安全中的\"防火墙\"部署在网络边界，可完全阻止所有外部攻击者进入内部网络，因此内部网络无需额外安全防护。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "防火墙虽部署在网络边界，但无法完全阻止所有外部攻击，且内部也存在如员工误操作、内部人员违规等安全风险，所以内部网络仍需额外安全防护。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951618977800", "t": 3, "q": "网络安全中的\"防火墙\"仅能过滤网络层和传输层的数据包，无法对应用层的HTTP、FTP等协议进行深度检测和过滤。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "防火墙不仅能过滤网络层和传输层数据包，也可以对应用层的HTTP、FTP等协议进行深度检测和过滤。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951618977801", "t": 3, "q": "网络安全中的\"访问控制列表（ACL）\"可基于源IP地址、目的IP地址、端口号等字段过滤数据包，实现精细化的网络访问控制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "访问控制列表（ACL）确实能够依据源IP地址、目的IP地址、端口号等信息对数据包进行过滤，从而实现精细化的网络访问控制。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172096", "t": 3, "q": "网络安全中的\"零信任架构\"要求所有访问请求，无论来自内部还是外部网络，都必须经过身份验证和权限检查。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "零信任架构的核心原则就是默认不信任，始终验证，即对所有访问请求，不管是来自内部还是外部网络，都要进行身份验证和权限检查。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172097", "t": 3, "q": "网络安全中的\"漏洞扫描\"工具可检测出系统中所有已知和未知的安全漏洞，无需人工进一步验证。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "漏洞扫描工具只能检测已知漏洞，无法检测未知漏洞，且检测结果通常需要人工进一步验证。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172098", "t": 3, "q": "网络安全中的\"日 log审计\"技术仅能记录系统和网络的操作事件，无法用于追溯安全事件的源头和分析攻击过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "日log审计不仅能记录系统和网络操作事件，也可用于追溯安全事件源头和分析攻击过程。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172099", "t": 3, "q": "网络安全中的\"入侵防御系统（IPS）\"通常部署在网络边界，通过对流量的实时检测和拦截，防止入侵行为到达目标系统。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "入侵防御系统（IPS）能实时监控网络流量，常部署在网络边界，可检测并拦截入侵行为，避免其抵达目标系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172100", "t": 3, "q": "网络安全中的\"入侵检测系统（IDS）\"可主动阻断检测到的攻击流量，防止攻击对目标系统造成破坏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "入侵检测系统（IDS）主要是对网络中的异常行为和攻击进行检测、分析并发出警报，它本身不具备主动阻断攻击流量的功能，具备主动阻断功能的是入侵防御系统（IPS）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172101", "t": 3, "q": "网络安全中的\"数据备份\"若未对备份数据进行加密，即使备份介质丢失，也不会导致敏感数据泄露。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "未对备份数据加密，备份介质丢失后，他人很容易获取其中的敏感数据，会导致数据泄露。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172102", "t": 3, "q": "网络安全中的\"数据加密\"若使用对称加密算法，需确保密钥在加密端和解密端之间安全分发，这是对称加密应用的关键挑战之一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对称加密算法使用相同密钥进行加密和解密，所以密钥在两端的安全分发很重要，若分发不安全易导致密钥泄露，这确实是对称加密应用的关键挑战之一。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172103", "t": 3, "q": "网络安全中的\"数据脱敏\"技术会改变数据的原始内容，因此脱敏后的数据无法用于数据恢复或生产环境使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据脱敏是对敏感数据进行变形处理，虽改变原始内容，但部分脱敏方法可在特定条件下恢复数据，且脱敏数据可用于测试、分析等生产环境。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172104", "t": 3, "q": "网络协议安全中，DNS协议的DNSSEC（DNS安全扩展）技术可防止DNS缓存投毒和域名劫持攻击，确保DNS解析结果的完整性和真实性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DNSSEC是为增强DNS安全性设计的，能通过数字签名等机制验证数据完整性，可有效抵御DNS缓存投毒和域名劫持攻击，保障解析结果的完整与真实。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172105", "t": 3, "q": "网络协议安全中，FTP协议的主动模式和被动模式的安全风险相同，均易导致数据传输被窃听。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172106", "t": 3, "q": "网络协议安全中，FTP协议默认使用21端口作为数据传输端口，20端口作为控制端口。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "FTP协议默认21端口是控制端口，20端口是数据传输端口，题干说法端口对应错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172107", "t": 3, "q": "网络协议安全中，HTTP/3协议基于QUIC协议，使用UDP作为传输层协议，因此相比HTTP/2，其安全性更低，易受UDP放大攻击。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "HTTP/3基于QUIC协议用UDP传输，虽UDP本身有放大攻击风险，但QUIC协议有诸多安全机制保障，不能简单说HTTP/3比HTTP/2安全性低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172108", "t": 3, "q": "网络协议安全中，HTTPS协议的证书若由未受信任的CA机构颁发，浏览器会提示证书错误，阻止用户访问该网站，防止中间人攻击。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172109", "t": 3, "q": "网络协议安全中，HTTPS协议通过在HTTP和TCP之间增加TLS层，实现数据的加密传输和身份认证。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "HTTPS 确实是在 HTTP 和 TCP 之间加入 TLS（传输层安全协议）层，TLS 能对数据进行加密并完成身份认证。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172110", "t": 3, "q": "网络协议安全中，ICMP协议的Ping请求（类型8）和Ping响应（类型0）可被用于网络探测，但不会被用于DDoS攻击。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "ICMP协议的Ping请求和响应不仅可用于网络探测，还能被用于DDoS攻击，例如Ping Flood攻击。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172111", "t": 3, "q": "网络协议安全中，IPsec协议的AH（认证头）协议可提供数据完整性和身份认证，但无法提供数据机密性保护。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "IPsec的AH协议主要功能是提供数据完整性验证和身份认证，它不具备对数据进行加密来提供机密性保护的能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172112", "t": 3, "q": "网络协议安全中，TCP协议的序列号预测攻击可导致会话劫持，攻击者通过预测下一个序列号，伪造TCP报文接管现有会话。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "TCP协议的序列号预测攻击确实能够让攻击者预测下一个序列号，进而伪造TCP报文来接管现有会话，导致会话劫持。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172113", "t": 3, "q": "网络协议安全中，TCP协议的FIN Flood攻击与SYN Flood攻击原理相同，均利用了TCP半连接状态的资源消耗漏洞。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "FIN Flood攻击和SYN Flood攻击原理不同，SYN Flood利用TCP半连接状态消耗资源，而FIN Flood是通过发送大量伪造的FIN包使目标主机忙于处理这些包，消耗资源。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172114", "t": 3, "q": "网络协议安全中，TCP协议的SYN Flood攻击利用了TCP三次握手的半连接状态，导致目标主机无法处理新的连接请求。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "SYN Flood攻击正是通过发送大量伪造源IP的SYN包，使目标主机处于半连接状态，消耗资源，无法处理新连接请求。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172115", "t": 3, "q": "网络协议安全中，WebSocket协议基于HTTP协议握手，之后使用TCP长连接传输数据，其传输内容默认加密，无需额外配置。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "WebSocket协议基于HTTP协议握手后用TCP长连接传输数据，但传输内容默认不加密，需要额外配置如使用WSS（WebSocket Secure）来实现加密。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172116", "t": 3, "q": "消息认证码（MAC）与哈希值的区别在于，MAC需要使用密钥生成和验证，而哈希值无需密钥，任何人都可计算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "消息认证码（MAC）是带密钥的哈希函数，其生成和验证依赖密钥，目的是保证消息完整性和进行身份认证；哈希值通过特定哈希算法计算得出，无需密钥，任何人用同样的算法和数据就能算出。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172117", "t": 3, "q": "在密码学中，\"密钥交换协议（如DH协议）\"可在不安全的网络中，使通信双方安全地协商出一个共享的对称密钥，无需预先共享密钥。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DH协议是经典的密钥交换协议，能让通信双方在不安全网络里，不预先共享密钥就安全协商出共享对称密钥。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172118", "t": 3, "q": "在密码学中，\"前向保密（Forward Secrecy）\"意味着即使长期私钥泄露，攻击者也无法解密之前已加密的会话数据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前向保密的核心特性就是保障即使长期私钥被泄露，之前已加密的会话数据也不会被攻击者解密。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172119", "t": 3, "q": "在密码学中，\"一次性密码本（One-Time Pad）\"若满足密钥随机、长度与明文相同、仅使用一次的条件，可实现无条件安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一次性密码本在密钥随机、长度与明文相同且仅使用一次时，从理论上无法通过密文分析出明文，能实现无条件安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172120", "t": 3, "q": "在密码学中，对称加密算法（如DES）的密钥管理比非对称加密算法（如RSA）更简单，适合多用户通信场景。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "对称加密算法密钥管理复杂，因为每个通信方之间都需共享密钥，用户增多时，密钥数量呈指数级增长；非对称加密有公钥和私钥，更适合多用户通信，公钥可公开。所以题干表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172121", "t": 3, "q": "在密码学中，对称加密算法的加密和解密速度通常比非对称加密算法快，适合加密大量数据（如文件加密）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对称加密使用相同密钥进行加密和解密，运算简单，速度快，适合处理大数据量加密；非对称加密用公钥加密私钥解密或反之，运算复杂，速度慢。所以该描述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172122", "t": 3, "q": "在密码学中，非对称加密算法（如RSA）可同时用于加密数据和生成数字签名，无需结合对称加密算法。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "非对称加密算法虽能用于加密数据和生成数字签名，但效率较低，实际应用中常结合对称加密算法，利用对称加密快速加密大量数据，非对称加密保护对称密钥。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172123", "t": 3, "q": "在密码学中，哈希算法（如SHA-256）可将任意长度的输入转换为固定长度的输出，且该过程不可逆。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "哈希算法能把任意长度输入转为固定长度输出，并且无法从输出反推输入，即不可逆。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172124", "t": 3, "q": "在密码学中，数字签名的生成过程需要使用签名者的私钥，验证过程需要使用签名者的公钥。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数字签名原理就是用签名者私钥生成签名，接收方用签名者公钥验证，确保签名真实可靠。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172125", "t": 3, "q": "在密码学中，消息认证码（MAC）与数字签名一样，可提供不可否认性，即发送方无法否认已发送的消息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "消息认证码（MAC）用于验证消息的完整性和真实性，但无法提供不可否认性，因为MAC依赖于共享密钥，接收方也可生成相同MAC，不能证明是特定发送方发送；而数字签名可提供不可否认性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172126", "t": 3, "q": "在密码学中，AES算法的分组长度是128位，密钥长度仅支持256位。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "AES算法分组长度固定为128位，但密钥长度支持128位、192位和256位，并非仅支持256位。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172127", "t": 3, "q": "在密码学中，MD5哈希算法因存在碰撞漏洞（不同输入可生成相同哈希值），已不再适合用于密码存储和数据完整性校验等安全场景。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "MD5确实存在碰撞漏洞，在安全要求较高的密码存储和数据完整性校验等场景中使用会带来安全风险，所以不适合。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172128", "t": 3, "q": "在密码学中，RSA算法的安全性基于椭圆曲线离散对数问题，ECC算法的安全性基于大整数分解问题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "RSA算法安全性基于大整数分解问题，ECC算法安全性基于椭圆曲线离散对数问题，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172129", "t": 3, "q": "在密码学中，TLS 1.3相比TLS 1.2移除了RC4、SHA-1等不安全的加密和哈希算法，增强了安全性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "TLS 1.3为提升安全性，确实移除了RC4、SHA - 1等存在安全风险的加密和哈希算法。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172130", "t": 3, "q": "在网络协议安全分析中，HTTP协议的\"Referer\"字段可被伪造，因此不能仅依赖该字段实现身份验证或访问控制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "HTTP协议的“Referer”字段记录请求来源，易被伪造，若仅靠它做身份验证或访问控制，攻击者可伪造该字段绕过限制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172131", "t": 3, "q": "AES算法是一种分组密码，仅支持128位的分组长度和128位的密钥长度，无法满足更高安全性需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "AES算法支持128、192和256位的密钥长度，并非仅支持128位密钥长度，且能在一定程度上满足不同安全需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172132", "t": 3, "q": "ARP欺骗攻击仅能篡改目标主机的ARP缓存表，使目标主机无法访问网关，无法实现流量劫持和数据窃取。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "ARP欺骗攻击不仅能篡改目标主机的ARP缓存表，导致目标主机无法正常访问网关，还可以实现流量劫持和数据窃取。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172133", "t": 3, "q": "DDoS攻击的特点是通过大量分布式的攻击源向目标发送流量，单靠目标自身的防火墙难以抵御。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DDoS（分布式拒绝服务）攻击正是利用大量分布的攻击源向目标发送流量，使目标资源耗尽或服务中断，目标自身防火墙因处理能力有限，难以抵御大量流量攻击。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172134", "t": 3, "q": "DNS欺骗攻击通过篡改目标主机的DNS缓存表，使目标将域名解析为攻击者指定的IP地址，从而实现流量劫持。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "DNS欺骗攻击就是通过篡改目标主机的DNS缓存表，让目标主机把域名解析到攻击者指定的IP，以此达成流量劫持。所以该描述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172135", "t": 3, "q": "HTTPS协议仅通过SSL/TLS协议对HTTP请求和响应的头部信息进行加密，正文内容仍以明文传输。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "HTTPS协议是在HTTP基础上加入SSL/TLS协议，它会对HTTP请求和响应的头部及正文内容都进行加密，并非仅加密头部。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172136", "t": 3, "q": "HTTPS协议中，服务器发送给客户端的数字证书包含服务器的公钥和CA的数字签名，客户端通过验证CA签名确认证书合法性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在HTTPS协议里，服务器给客户端发送的数字证书确实包含服务器公钥和CA数字签名，客户端可通过验证CA签名来确认证书是否合法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172137", "t": 3, "q": "IDS（入侵检测系统）不仅能检测入侵行为并发出告警，还能主动阻断入侵流量，防止攻击扩散。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "IDS主要功能是检测入侵行为并发出告警，它本身不具备主动阻断入侵流量的能力，具备此能力的是IPS（入侵防御系统）。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172138", "t": 3, "q": "IP地址欺骗攻击的核心是攻击者伪造源IP地址，使目标服务器误以为数据包来自合法地址，从而绕过基于IP地址的访问控制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "IP地址欺骗就是攻击者伪造源IP，让目标服务器误认数据包来自合法地址，进而绕过IP地址访问控制。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172139", "t": 3, "q": "IPSec协议的ESP协议不仅能提供数据加密功能，还能提供数据完整性校验和身份认证功能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "IPSec的ESP协议可对数据进行加密，同时能通过认证头或集成认证机制提供数据完整性校验和身份认证功能。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172140", "t": 3, "q": "IPsec协议仅能为IPv4数据包提供安全保护，无法为IPv6数据包提供加密和认证服务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "IPsec协议既能为IPv4数据包也能为IPv6数据包提供加密和认证等安全保护。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172141", "t": 3, "q": "RSA算法的安全性基于大整数分解问题的难解性，而ECC算法的安全性基于离散对数问题的难解性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172142", "t": 3, "q": "SHA-256哈希算法生成的哈希值长度为256位，且具有抗碰撞性，即无法找到两个不同输入生成相同的256位哈希值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "SHA - 256是安全哈希算法，生成256位哈希值，理论上虽不能绝对保证找不到碰撞，但以目前计算能力极难找到两个不同输入生成相同256位哈希值，所以通常认为其具有抗碰撞性。", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172143", "t": 3, "q": "SQL注入漏洞的本质是程序将用户输入直接拼接到SQL语句中，未进行转义或过滤，导致攻击者可控制SQL语句的执行逻辑。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "SQL注入漏洞正是因程序未对用户输入做转义或过滤处理，直接将输入拼接到SQL语句，使得攻击者能操控语句执行逻辑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172144", "t": 3, "q": "TCP会话劫持攻击的核心是攻击者窃取TCP会话的序列号，伪造数据包插入已建立的TCP会话，从而冒充合法用户。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "TCP会话劫持攻击就是攻击者通过各种手段获取TCP会话的序列号，然后伪造数据包插入到已建立的TCP会话中，以此来冒充合法用户。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813951623172145", "t": 3, "q": "WPA3是目前最安全的Wi-Fi加密协议，相比WPA2，其增强了密钥协商的安全性，可有效抵御离线字典攻击。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "WPA3确实是目前较安全的Wi-Fi加密协议，它在密钥协商等方面做了改进，增强了安全性，能有效抵御离线字典攻击。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第10章 人工智能（1）", "n": "基础练习题【含解析】 / 第10章 人工智能（1）", "qs": [{"id": "2034813959219056640", "t": 1, "q": "关于人工智能（AI）的分类，下列哪项描述符合\"弱人工智能（ANI）\"的核心特征？", "a": ["具备自主意识和通用学习能力，可跨领域解决任意问题", "仅针对特定领域（如围棋、语音助手）设计，功能局限于该领域", "已实现对人类思维的完全模拟，可替代人类进行复杂决策", "能够自主产生目标，并主动优化解决问题的策略", "", ""], "r": "B", "e": "弱人工智能功能单一，针对特定领域设计，不具备通用能力、自主意识等。A、C、D选项描述的是强人工智能特征。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056641", "t": 1, "q": "关于AI算力芯片，以下哪种芯片的设计理念是针对特定AI算法（如深度学习的卷积、矩阵运算）进行硬件架构定制，以牺牲通用性换取极致的计算效率？", "a": ["FPGA", "ASIC", "GPU", "CPU", "", ""], "r": "B", "e": "ASIC是为特定AI算法定制硬件架构，牺牲通用性换计算效率；FPGA可灵活编程；GPU适合并行计算但有一定通用性；CPU通用性强，不针对特定AI算法定制。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056642", "t": 1, "q": "某AI系统需处理\"根据用户输入的自然语言描述，自动生成符合逻辑的结构化查询语句（如SQL）\"的任务，该任务最核心依赖的自然语言处理（NLP）技术是以下哪一项？", "a": ["自然语言理解（NLU）", "机器翻译", "自然语言生成（NLG）", "情感分析", "", ""], "r": "A", "e": "此任务要将自然语言描述转化为结构化查询语句，关键在于理解自然语言的含义，自然语言理解（NLU）就是专门处理理解自然语言的技术。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056643", "t": 1, "q": "人工智能中\"多模态学习\"的核心是以下哪一项？", "a": ["对同一模态的数据进行多次处理，提升模型精度", "将一种模态的数据转换为另一种模态（如文本转图像）", "仅处理单一类型的数据（如仅文本或仅图像）", "融合多种类型的数据（如文本、图像、语音）进行模型训练和任务处理", "", ""], "r": "D", "e": "多模态学习强调多种模态数据的融合，D选项符合其核心。A选项只针对同一模态多次处理，并非核心；B选项数据转换不是多模态学习核心；C选项仅处理单一类型数据与多模态相悖。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056644", "t": 1, "q": "人工智能中\"监督学习\"与\"无监督学习\"的最核心区别是以下哪一项？", "a": ["监督学习仅用于分类任务，无监督学习仅用于聚类任务", "监督学习的模型复杂度高于无监督学习", "监督学习的训练数据量远大于无监督学习", "监督学习的训练数据包含标签，无监督学习的训练数据无标签", "", ""], "r": "D", "e": "监督学习和无监督学习核心差异在于训练数据有无标签，有标签是监督学习，无标签是无监督学习。A选项两者应用不局限于分类和聚类；B选项模型复杂度与学习类型无必然联系；C选项训练数据量和学习类型无直接关联。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056645", "t": 1, "q": "人工智能中\"知识图谱\"的核心作用是以下哪一项？", "a": ["优化深度学习模型的训练速度", "对文本数据进行分词和词性标注", "存储和组织结构化的知识，支持知识推理和问答", "对图像中的物体进行分类和定位", "", ""], "r": "C", "e": "知识图谱主要是把各种知识进行结构化存储和组织，能基于这些知识进行推理并回答问题。A是关于深度学习训练速度，B是文本处理基本操作，D是图像领域任务，都不是知识图谱核心作用。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056646", "t": 1, "q": "以下关于\"卷积神经网络（CNN）中池化层\"的描述，正确的是哪一项？", "a": ["池化层会改变特征图的通道数", "池化层通过降低特征图的维度，减少计算量，同时提升模型的泛化能力", "池化层需要训练参数，通过反向传播优化", "池化层的主要作用是增加特征图的尺寸，保留更多细节信息", "", ""], "r": "B", "e": "池化层主要是对特征图进行下采样，降低其维度，能减少后续计算量，且可一定程度避免过拟合提升泛化能力。池化层不改变通道数，无训练参数，也不是增加特征图尺寸。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056647", "t": 1, "q": "以下关于\"语音唤醒\"技术的描述，正确的是哪一项？", "a": ["语音唤醒的准确率与背景噪声无关", "语音唤醒是一种轻量级语音识别技术，仅需检测特定唤醒词（如\"小爱同学\"）", "语音唤醒需要处理完整的长语音序列，才能判断是否触发唤醒词", "语音唤醒必须依赖云端服务器处理，无法在本地设备完成", "", ""], "r": "B", "e": "A项背景噪声会影响语音唤醒准确率；C项语音唤醒是检测特定唤醒词，并非处理完整长语音序列；D项语音唤醒可在本地设备完成，不必须依赖云端。B项语音唤醒就是检测特定唤醒词，是轻量级语音识别技术。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056648", "t": 1, "q": "以下关于不同类型AI算力芯片的对比，正确的是哪一项？", "a": ["FPGA的灵活性低于ASIC，通用性高于GPU", "CPU的AI计算效率高于GPU，通用性低于ASIC", "GPU的并行计算能力高于CPU，能效比低于ASIC", "ASIC的通用性高于FPGA，计算效率低于GPU", "", ""], "r": "C", "e": "CPU适合串行任务，GPU并行计算能力强于CPU，ASIC是专用芯片，能效比高，GPU能效比低于它。A选项FPGA灵活性高于ASIC；B选项CPU的AI计算效率低于GPU，通用性高于ASIC；D选项ASIC通用性低于FPGA，计算效率高于GPU。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056649", "t": 1, "q": "以下关于人工智能\"强化学习\"的描述，正确的是哪一项？", "a": ["强化学习中，智能体通过与环境交互获得\"奖励\"或\"惩罚\"信号，以优化行为策略", "强化学习不需要探索环境，仅需利用已有经验即可优化策略", "强化学习通过对大量标注数据的学习来构建模型，核心是\"监督信号\"", "强化学习仅适用于静态环境，无法处理动态变化的场景", "", ""], "r": "A", "e": "强化学习中智能体与环境交互，依据奖励或惩罚信号优化策略；它需要探索环境，B错误；它无大量标注数据和监督信号，核心是奖励反馈，C错误；它能处理动态场景，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056650", "t": 1, "q": "以下关于人工智能发展阶段的描述，正确的是哪一项？", "a": ["目前人工智能已进入强人工智能（AGI）阶段", "弱人工智能（ANI）阶段的系统可在所有领域超越人类智能", "强人工智能（AGI）阶段的系统仅能在特定领域完成专业任务", "超人工智能（ASI）阶段的系统智能水平全面超越人类", "", ""], "r": "D", "e": "目前人工智能处于弱人工智能阶段，A错误；弱人工智能只能在特定领域完成任务，无法在所有领域超越人类智能，B错误；强人工智能能够像人类一样全面思考和解决问题，并非仅在特定领域，C错误；超人工智能智能水平全面超越人类，D正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056651", "t": 1, "q": "以下关于语音合成（TTS）技术的发展历程，按技术成熟度从低到高排序正确的是哪一项？", "a": ["共振峰合成→拼接合成→参数合成→端到端合成", "共振峰合成→参数合成→拼接合成→端到端合成", "拼接合成→共振峰合成→参数合成→端到端合成", "参数合成→共振峰合成→拼接合成→端到端合成", "", ""], "r": "B", "e": "共振峰合成是早期技术，成熟度低；参数合成基于声学参数，发展稍晚；拼接合成是在参数合成基础上改进；端到端合成是较新且成熟度高的技术。所以顺序是共振峰合成→参数合成→拼接合成→端到端合成。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056652", "t": 1, "q": "以下关于自然语言处理中\"机器翻译\"的描述，错误的是哪一项？", "a": ["机器翻译无需考虑目标语言的语法规则，仅需匹配词汇即可", "基于统计的机器翻译（SMT）依赖大量平行语料库构建统计模型", "机器翻译的\"BLEU值\"是衡量翻译结果与参考译文相似度的常用指标", "基于深度学习的机器翻译（NMT）通常采用Encoder-Decoder架构", "", ""], "r": "A", "e": "机器翻译不能仅匹配词汇，必须考虑目标语言语法规则，A描述错误；基于统计的机器翻译靠大量平行语料库构建模型，B正确；BLEU值用于衡量翻译结果与参考译文相似度，C正确；基于深度学习的机器翻译常采用Encoder - Decoder架构，D正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056653", "t": 1, "q": "以下关于AI算力芯片\"ASIC\"的描述，正确的是哪一项？", "a": ["ASIC为特定AI任务定制设计，算力密度高、功耗低，但灵活性差", "ASIC的制造成本较低，适合大规模量产", "ASIC是通用芯片，可适配多种不同类型的AI任务", "ASIC可以随时修改硬件逻辑，以适配新的算法", "", ""], "r": "A", "e": "ASIC是为特定AI任务定制设计，所以算力密度高、功耗低，但灵活性差；其制造成本高，不是通用芯片，且硬件逻辑固定难修改。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056654", "t": 1, "q": "以下关于AI算力芯片的\"模型量化\"技术，描述正确的是哪一项？", "a": ["模型量化通过降低模型参数和计算的精度（如FP32转INT8），减少计算量和内存占用。", "模型量化是将芯片的计算精度从低精度（如INT8）提升到高精度（如FP32），以提升计算准确性。", "模型量化仅适用于CPU，不适用于GPU和ASIC等AI专用芯片。", "模型量化会导致模型性能大幅下降，且无法通过技术手段弥补。", "", ""], "r": "A", "e": "模型量化是把高精度数值转化为低精度，可减少计算量和内存占用，A正确；B选项说反了；模型量化适用于多种芯片，C错误；模型量化虽可能影响性能但可通过技术弥补，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056655", "t": 1, "q": "以下关于Transformer架构的描述，错误的是哪一项？", "a": ["Transformer架构完全依赖自注意力机制（Self-Attention）捕捉序列依赖关系", "Transformer架构仅包含编码器（Encoder）部分，无解码器（Decoder）部分", "Transformer架构中的位置编码（Positional Encoding）用于补充序列的位置信息", "Transformer架构可并行处理序列数据，解决了RNN的串行计算瓶颈", "", ""], "r": "B", "e": "Transformer架构包含编码器和解码器两部分，B选项说仅含编码器错误。A选项，Transformer靠自注意力机制捕捉依赖关系；C选项，位置编码补充位置信息；D选项，它能并行处理解决RNN串行瓶颈。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056656", "t": 1, "q": "以下哪种人工智能技术不属于生成式AI的范畴？", "a": ["基于Diffusion Model的图像修复", "基于GPT的文本生成", "基于CNN的图像分类", "基于GAN的图像生成", "", ""], "r": "C", "e": "生成式AI是能生成新内容的技术。A项图像修复、B项文本生成、D项图像生成都是生成新内容。而C项基于CNN的图像分类是对图像进行分类识别，不是生成新内容。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056657", "t": 1, "q": "以下哪种人工智能应用场景主要依赖于无监督学习技术？", "a": ["股票价格预测（基于历史价格与涨跌标签）", "用户购物偏好分类（基于已知用户类别标签）", "手写数字识别（基于已知数字类别标签）", "文本聚类（在未知文本类别的情况下自动分组）", "", ""], "r": "D", "e": "无监督学习是在没有标签的情况下对数据进行分析。ABC选项都基于已知标签，属于监督学习。D选项文本聚类是在未知类别情况下自动分组，符合无监督学习特点。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056658", "t": 1, "q": "以下哪种语音合成技术能够生成更自然、更接近人类发音的语音，且是当前主流的语音合成技术？", "a": ["基于共振峰合成的语音合成", "基于参数合成的语音合成", "基于波形拼接的语音合成", "基于深度学习的端到端语音合成（如Tacotron系列）", "", ""], "r": "D", "e": "基于深度学习的端到端语音合成利用神经网络直接将文本映射到语音，能学习到丰富的语音特征，生成更自然、接近人类发音的语音，是当前主流技术。其他选项技术相对传统，效果不如它。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056659", "t": 1, "q": "以下哪种自然语言处理技术主要用于\"将长文本自动浓缩为简短摘要，保留核心信息\"？", "a": ["机器翻译", "情感分析", "自动摘要", "文本分类", "", ""], "r": "C", "e": "题干描述的是把长文本浓缩为简短摘要并保留核心信息，这正是自动摘要的功能。机器翻译是将一种语言翻译成另一种语言；情感分析是分析文本中的情感倾向；文本分类是将文本划分到不同类别。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056660", "t": 1, "q": "以下哪种AI算力芯片的架构具有\"可重构性\"，能够根据不同AI任务的需求灵活调整硬件计算逻辑，适用于算法迭代较快的场景？", "a": ["CPU", "TPU", "FPGA", "GPU", "", ""], "r": "C", "e": "FPGA具有可重构性，能按不同AI任务需求灵活调整硬件计算逻辑，适合算法迭代快的场景；CPU主要用于通用计算；TPU是谷歌为加速机器学习设计的专用芯片；GPU多用于图形处理和深度学习加速，重构性不如FPGA。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056661", "t": 1, "q": "以下哪种AI算力芯片方案最适合部署在\"边缘设备\"（如智能手机、物联网传感器）中，要求低功耗、小体积，同时满足轻量级AI任务（如人脸解锁、语音助手）的需求？", "a": ["低功耗FPGA", "高性能GPU", "大型ASIC集群", "嵌入式CPU集成NPU（神经网络处理单元）", "", ""], "r": "D", "e": "边缘设备需要低功耗、小体积，适合轻量级AI任务。选项A的FPGA功耗相对不是最低且在轻量级应用中性价比不高；选项B的GPU高性能但功耗大、体积大；选项C大型ASIC集群体积大、功耗高。而嵌入式CPU集成NPU可很好满足低功耗、小体积和轻量级AI任务需求。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056662", "t": 1, "q": "以下哪种AI算力芯片架构最适合部署在边缘设备（如智能手机、物联网传感器）中，以满足低功耗、小体积、实时响应的需求？", "a": ["通用CPU多核架构", "边缘AI芯片（如NPU）", "高性能GPU集群", "云端TPU芯片", "", ""], "r": "B", "e": "边缘设备需要低功耗、小体积和实时响应，通用CPU多核架构性能和功耗等方面不太适配；高性能GPU集群体积大、功耗高；云端TPU芯片部署在云端非边缘设备。而边缘AI芯片（如NPU）专为边缘设备设计，能满足低功耗、小体积和实时响应需求。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056663", "t": 1, "q": "语音识别系统中，\"将提取到的语音特征与预先建立的声学模型、语言模型进行匹配，最终输出文字结果\"的阶段称为以下哪一个？", "a": ["特征提取", "解码", "噪声抑制", "模型训练", "", ""], "r": "B", "e": "特征提取是提取语音特征，并非匹配输出文字；噪声抑制是处理语音中的噪声；模型训练是建立声学和语言模型。而解码就是将提取的语音特征与模型匹配输出文字结果。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056664", "t": 1, "q": "语音识别中，\"声学模型\"的主要作用是以下哪一项？", "a": ["建立语音特征与音素（或子音素）之间的映射关系", "处理自然语言的语法和语义，提升识别准确性", "去除语音信号中的噪声，提升信号质量", "将语音信号转换为文字序列", "", ""], "r": "A", "e": "声学模型核心是构建语音特征和音素（或子音素）间的映射。B项是语言模型作用；C项是语音预处理任务；D项是语音识别整体目标。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056665", "t": 1, "q": "语音识别中的\"声学模型\"与\"语言模型\"的分工不同，以下描述正确的是哪一项？", "a": ["声学模型负责去除语音中的噪声，语言模型负责识别语音中的情感", "声学模型负责将语音特征映射为音素序列，语言模型负责将音素序列转换为文本序列", "声学模型负责将文本序列转换为语音信号，语言模型负责优化语音音质", "声学模型负责分割语音片段，语言模型负责标注语音中的停顿", "", ""], "r": "B", "e": "声学模型主要功能是把语音特征转化为音素序列，语言模型则是将音素序列转成文本序列。A选项去除噪声和识别情感并非二者主要分工；C选项将文本转语音是语音合成功能；D选项分割语音片段和标注停顿也不是它们的核心分工。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056666", "t": 1, "q": "语音识别中的\"语言模型\"通常采用以下哪种模型结构，以捕捉文本序列中词语之间的上下文依赖关系？", "a": ["循环神经网络（RNN）或Transformer", "决策树（Decision Tree）", "支持向量机（SVM）", "卷积神经网络（CNN）", "", ""], "r": "A", "e": "循环神经网络（RNN）和Transformer能处理序列数据，可捕捉文本序列中词语间上下文依赖关系；决策树用于分类和回归，支持向量机用于分类和回归分析，卷积神经网络主要用于图像等数据，它们都不适合捕捉文本上下文依赖。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056667", "t": 1, "q": "在人工智能的安全风险中，以下哪项属于\"对抗性攻击\"的典型案例？", "a": ["AI模型因训练数据不足导致泛化能力差", "攻击者通过添加微小噪声的图像，使图像识别模型将\"猫\"误判为\"狗\"", "AI系统因硬件故障导致计算结果错误", "模型训练过程中因过拟合导致在测试集上准确率低", "", ""], "r": "B", "e": "对抗性攻击是指攻击者通过对输入数据进行微小修改，使AI模型做出错误判断。B选项攻击者添加微小噪声图像让图像识别模型误判，符合对抗性攻击特点。A是训练数据问题影响泛化能力，C是硬件故障，D是过拟合问题，均不属于对抗性攻击。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056668", "t": 1, "q": "在人工智能的分类中，\"能够在特定领域内自主解决复杂问题，但不具备通用认知能力和自我意识\"的类型属于以下哪一种？", "a": ["通用人工智能（AGI）", "超人工智能（ASI）", "弱人工智能（ANI）", "强人工智能（AGI）", "", ""], "r": "C", "e": "弱人工智能只能在特定领域解决问题，无通用认知和自我意识；通用人工智能（AGI）具备通用认知能力；超人工智能（ASI）能力远超人类。所以符合题意的是弱人工智能。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056669", "t": 1, "q": "在人工智能的伦理问题中，以下哪项问题不属于\"算法偏见\"的范畴？", "a": ["招聘AI系统对女性求职者的评分普遍低于男性", "人脸识别系统对有色人种的识别准确率低于白色人种", "AI推荐系统反复向用户推送同类内容，导致信息茧房", "贷款审批AI系统对低收入人群的拒贷率显著高于高收入人群", "", ""], "r": "C", "e": "算法偏见指算法在数据处理和决策中存在不公平、有偏向性。A、B、D选项分别在招聘、人脸识别、贷款审批中对特定群体有不公平对待。而信息茧房是AI推荐系统因推送同类内容造成的信息局限，并非算法对特定群体的偏见。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056670", "t": 1, "q": "在人工智能的研究领域中，以下哪种学习方式的核心是让智能体通过与环境的交互，以\"试错\"的方式学习最优行为策略，且无需预先提供标注好的输入输出数据？", "a": ["强化学习", "半监督学习", "监督学习", "无监督学习", "", ""], "r": "A", "e": "强化学习是智能体与环境交互，通过“试错”找最优策略，无需预标注数据；半监督学习利用少量标注和大量未标注数据；监督学习需大量标注数据；无监督学习无标注数据但不强调与环境交互和“试错”找策略。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056671", "t": 1, "q": "在人工智能的应用场景中，以下哪项应用不属于强化学习的典型案例？", "a": ["AlphaGo围棋对战系统", "机器人的自主避障训练", "自动驾驶汽车的路径规划", "基于用户浏览记录的商品推荐", "", ""], "r": "D", "e": "强化学习是智能体通过与环境交互，不断试错来学习最优策略。A、B、C选项都需要智能体在动态环境中不断尝试以找到最佳行为方式。而D选项基于用户浏览记录的商品推荐主要是依据历史数据进行分析和预测，并非通过与环境交互试错学习策略。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056672", "t": 1, "q": "在人工智能应用中，\"自动驾驶汽车通过激光雷达、摄像头等传感器实时感知周围环境，并规划行驶路径\"的过程，主要涉及人工智能的哪个核心技术领域？", "a": ["计算机视觉", "强化学习", "自然语言处理", "知识图谱", "", ""], "r": "A", "e": "自动驾驶汽车用激光雷达、摄像头感知环境主要依靠计算机视觉技术来识别图像和物体。强化学习侧重通过奖励机制学习策略；自然语言处理针对语言交互；知识图谱用于知识表示和推理。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056673", "t": 1, "q": "在图像分割任务中，以下哪种模型架构是通过引入\"编码器-解码器\"结构，并利用跳跃连接（Skip Connection）融合不同层级的特征，以实现精确的像素级分割？", "a": ["InceptionNet", "VGGNet", "MobileNet", "U-Net", "", ""], "r": "D", "e": "U - Net采用“编码器 - 解码器”结构，且利用跳跃连接融合不同层级特征来进行像素级分割。而InceptionNet、VGGNet、MobileNet主要用于图像分类，并非用于这种分割模式。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056674", "t": 1, "q": "在图像目标检测任务中，以下哪种模型属于\"两阶段检测模型\"，即先生成候选区域（Region Proposal），再对候选区域进行分类和边界框回归？", "a": ["SSD", "YOLO", "RetinaNet", "Faster R-CNN", "", ""], "r": "D", "e": "Faster R - CNN是两阶段检测模型，先通过区域生成网络生成候选区域，再对其分类和回归；而SSD、YOLO、RetinaNet是单阶段检测模型，直接进行目标检测和定位。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056675", "t": 1, "q": "在图像识别的\"超分辨率重建\"任务中，下列哪种算法通过深度学习模型学习低分辨率图像到高分辨率图像的映射关系，实现画质提升？", "a": ["双线性插值算法", "SRCNN（Super Resolution Convolutional Neural Network）", "均值滤波算法", "bicubic插值算法", "", ""], "r": "B", "e": "A和D选项的双线性插值和bicubic插值算法是传统的图像插值方法，并非深度学习模型；C选项均值滤波算法主要用于图像平滑去噪，不是用于超分辨率重建学习映射关系。B选项SRCNN是基于卷积神经网络的超分辨率重建算法，通过深度学习模型学习低分辨率到高分辨率图像的映射。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813959219056676", "t": 1, "q": "在图像识别的\"目标跟踪\"任务中，下列哪种算法通过在线更新目标外观模型，适应目标尺度变化、遮挡等复杂场景？", "a": ["CSRT（Channel and Spatial Reliability Tracking）算法", "MeanShift跟踪算法", "光流法跟踪算法", "Kalman滤波跟踪算法", "", ""], "r": "A", "e": "CSRT算法可在线更新目标外观模型，能很好适应目标尺度变化、遮挡等复杂场景；MeanShift主要基于颜色特征，对尺度变化等适应能力弱；光流法依赖图像灰度变化，受光照影响大；Kalman滤波侧重于预测目标状态。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508608", "t": 2, "q": "人工智能中\"监督学习\"的典型算法包括以下哪些？", "a": ["随机森林", "主成分分析（PCA）", "线性回归", "支持向量机（SVM）", "", ""], "r": "ACD", "e": "监督学习是有标注数据的学习。随机森林用于分类和回归，线性回归用于预测，支持向量机用于分类和回归，它们都基于有标注数据训练，属于监督学习算法。主成分分析是无监督学习，用于数据降维。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508609", "t": 2, "q": "人工智能中\"迁移学习\"的主要优势包括以下哪些？", "a": ["提升模型在目标任务上的泛化能力，减少过拟合", "能够显著降低训练新任务所需的时间和计算资源", "仅能将模型从简单任务迁移到复杂任务，无法反向迁移", "减少对目标任务标注数据量的需求，适用于数据稀缺场景", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508610", "t": 2, "q": "人工智能中\"强化学习\"的关键组成部分包括以下哪些？", "a": ["奖励函数（Reward Function）", "标注数据集（Labeled Dataset）", "智能体（Agent）", "环境（Environment）", "", ""], "r": "ACD", "e": "强化学习中，智能体在环境中行动，根据环境反馈的奖励信号来学习最优策略。奖励函数用于定义奖励信号，智能体是学习和决策的主体，环境是智能体交互的对象。而标注数据集是监督学习所需，并非强化学习关键组成。所以答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508611", "t": 2, "q": "人工智能中\"知识图谱\"的构建流程主要包括以下哪些步骤？", "a": ["知识标注（手动为知识图谱中的实体添加类别标签）", "知识融合（整合多源知识，消除冲突）", "知识抽取（从非结构化数据中提取实体、关系）", "知识存储（将结构化知识存储到数据库中）", "", ""], "r": "BCD", "e": "答案：BCD知识图谱的构建流程主要包括知识抽取（从非结构化数据中提取实体、关系）、知识融合（整合多源知识，消除冲突）和知识存储（将结构化知识存储到数据库中）。知识标注虽然也是知识图谱构建过程中的一个环节，但不是主要步骤，因此选项A不正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508612", "t": 2, "q": "下列关于人工智能基本概念的描述，正确的有哪些？（　）", "a": ["\"深度学习\"是机器学习的子集，通过深度神经网络模拟人脑层级结构", "\"机器学习\"是人工智能的子集，核心是让模型从数据中自动学习规律", "人工智能与机器学习是同一概念，可互换使用", "强化学习是机器学习的重要分支，无需大量标注数据，依赖\"奖励函数\"引导", "", ""], "r": "ABD", "e": "深度学习是机器学习的一种，通过深度神经网络模拟人脑，A对；机器学习是人工智能的一部分，核心是从数据学规律，B对；人工智能和机器学习概念不同，不能互换，C错；强化学习是机器学习分支，不用大量标注数据，靠奖励函数引导，D对。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508613", "t": 2, "q": "下列关于人工智能应用的描述，属于\"强人工智能\"潜在应用场景的有哪些？（　）", "a": ["跨学科解决气候模拟与新能源优化的耦合问题", "独立驾驶汽车在复杂城市道路中应对突发交通事件", "自主完成从药物分子设计到临床试验的全流程医药研发", "通过语音指令控制智能家居设备开关", "", ""], "r": "ABC", "e": "强人工智能具备自我意识和理解、学习、解决复杂问题的能力。A能跨学科解决复杂耦合问题，B可在复杂场景应对突发情况，C能自主完成全流程医药研发，都体现强人工智能特点。而D通过语音指令控制设备，只是简单指令响应，属于弱人工智能应用。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508614", "t": 2, "q": "下列关于人工智能应用分析的描述，属于\"弱人工智能\"局限性的有哪些？（　）", "a": ["在数据分布与训练数据差异较大时，性能大幅下降", "缺乏对任务背后\"因果关系\"的理解，仅依赖数据关联", "能够自主学习新技能，无需人工干预", "可模拟人类情感，具备共情能力", "", ""], "r": "AB", "e": "弱人工智能只能完成特定任务，依赖训练数据且缺乏因果理解。A体现依赖训练数据，B说明缺乏因果理解，这是其局限性；C是强人工智能特点，D目前弱人工智能难以做到。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508615", "t": 2, "q": "下列关于图像识别技术应用的描述，属于\"医学影像识别\"核心应用场景的有哪些？（　）", "a": ["通过眼底图像筛查糖尿病视网膜病变", "通过CT影像检测肺部结节", "通过病理切片图像判断肿瘤良恶性", "通过摄像头识别交通信号灯颜色", "", ""], "r": "ABC", "e": "ABC选项都是针对医学影像进行疾病相关判断，属于医学影像识别应用；D选项识别交通信号灯颜色与医学无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508616", "t": 2, "q": "下列关于图像识别中\"迁移学习\"的描述，正确的有哪些？（　）", "a": ["核心是将从源任务（如ImageNet分类）学到的特征迁移到目标任务（如特定场景物体检测）", "可大幅减少目标任务所需的标注数据量", "常见做法是冻结预训练模型的底层特征层，微调顶层任务层", "迁移学习会降低模型在目标任务上的泛化能力", "", ""], "r": "ABC", "e": "迁移学习就是把源任务学习的特征用到目标任务，能减少目标任务标注数据量，常冻结底层微调顶层，且能提升目标任务泛化能力。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508617", "t": 2, "q": "下列关于语音识别应用场景的描述，需要结合\"语音唤醒\"和\"语音命令识别\"两项技术的有哪些？（　）", "a": ["手机通过\"Hey Siri\"唤醒后，执行\"设置明天7点闹钟\"命令", "语音输入法将用户语音实时转换为文字", "智能音箱通过\"小爱同学\"唤醒后，执行\"播放音乐\"命令", "车载语音系统通过\"你好，奔驰\"唤醒后，执行\"打开空调\"命令", "", ""], "r": "ACD", "e": "“语音唤醒”是用特定语音唤醒设备，“语音命令识别”是识别并执行后续语音命令。A、C、D选项都先有语音唤醒，后有语音命令执行，符合要求；B选项仅进行语音转文字，未涉及语音唤醒。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508618", "t": 2, "q": "下列关于自然语言处理（NLP）中预训练模型的描述，属于BERT模型核心特性的有哪些？（　）", "a": ["采用双向Transformer编码结构", "支持多任务微调适配不同NLP场景", "主要依赖无标注文本数据进行预训练", "通过\"掩码语言模型\"进行预训练", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508619", "t": 2, "q": "下列关于AI算力芯片选型的描述，正确的有哪些？（　）", "a": ["云端大规模AI训练任务优先选择高并行性的GPU或TPU", "嵌入式设备（如智能手表）中的AI任务（如心率异常检测）适合选择MCU集成的轻量级NPU", "边缘计算场景（如工业传感器AI分析）优先选择低功耗NPU或FPGA", "所有AI场景中，GPU的性能均优于其他类型芯片", "", ""], "r": "ABC", "e": "A选项，云端大规模AI训练需大量并行计算，GPU和TPU高并行性适合；B选项，嵌入式设备资源有限，MCU集成轻量级NPU可满足简单AI任务；C选项，边缘计算场景对功耗有要求，低功耗NPU或FPGA合适；D选项，不同芯片有不同适用场景，GPU并非在所有AI场景性能都最优。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508620", "t": 2, "q": "下列关于AI算力芯片应用场景的描述，正确的有哪些？（　）", "a": ["ASIC（专用集成电路）定制化程度高，功耗低，适合大规模量产的AI推理场景", "TPU（张量处理单元）主要用于Google TensorFlow框架下的深度学习推理任务", "GPU适合处理AI训练阶段的大规模并行计算任务", "FPGA可通过硬件重构，适配不同算法的迭代优化，常用于AI算法原型验证", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508621", "t": 2, "q": "下列技术中，属于图像识别领域中\"目标检测\"任务专用算法框架的有哪些？（　）", "a": ["SSD", "ResNet", "Faster R-CNN", "VGGNet", "", ""], "r": "AC", "e": "SSD和Faster R - CNN是目标检测专用算法框架，ResNet和VGGNet主要用于图像分类等，不是目标检测专用。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508622", "t": 2, "q": "下列自然语言处理技术中，可用于\"文本降噪\"（如去除文本中的广告、乱码）的有哪些？（　）", "a": ["基于语义相似度的冗余文本删除", "基于分类模型的文本垃圾识别", "基于正则表达式的文本过滤", "基于分词的文本长度统计", "", ""], "r": "ABC", "e": "A可去除语义重复冗余文本；B能识别出垃圾文本进行清理；C可用正则规则过滤特定文本；而D文本长度统计与去除广告、乱码等降噪无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508623", "t": 2, "q": "下列自然语言处理任务中，需要同时处理\"文本语义理解\"和\"上下文逻辑推理\"的有哪些？（　）", "a": ["自然语言推断（NLI，判断前提与假设的逻辑关系）", "文本情感分类", "机器阅读理解（MRC）", "中文分词", "", ""], "r": "AC", "e": "自然语言推断要理解文本语义并判断逻辑关系，机器阅读理解需理解语义和依据上下文推理；文本情感分类主要关注情感倾向，中文分词侧重词语切分。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508624", "t": 2, "q": "下列AI算力芯片的性能指标中，可用于衡量芯片\"能效性价比\"的有哪些？（　）", "a": ["处理单位AI任务的耗时（毫秒/任务）", "每瓦功耗对应的TOPS（TOPS/W）", "处理单位AI任务的芯片成本（元/任务）", "芯片的理论峰值算力（TOPS）", "", ""], "r": "BC", "e": "“能效性价比”要综合考虑能耗、性能和成本。A只体现处理任务耗时，未涉及能耗和成本；D仅为理论峰值算力，不涉及能耗与成本。B每瓦功耗对应的TOPS体现了能耗下的性能，C处理单位AI任务的芯片成本体现成本方面，二者可衡量“能效性价比”。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508625", "t": 2, "q": "下列AI应用场景中，属于\"人工智能基本概念\"中\"强化学习\"典型应用的有哪些？（　）", "a": ["机器人通过试错学习抓取不同形状物体", "推荐系统根据用户点击反馈调整推荐列表", "图像分类模型通过标注数据学习类别特征", "自动驾驶汽车在虚拟路况中学习避障规则", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508626", "t": 2, "q": "以下关于\"卷积神经网络（CNN）\"在图像识别中应用的描述，正确的有哪些？", "a": ["CNN的卷积层能够自动提取图像的层次化特征，无需手动设计特征", "CNN通过局部感受野和权值共享，减少模型参数，提升训练效率", "CNN的全连接层通常位于网络末尾，用于将提取的特征映射到具体类别", "CNN中的池化层可以减少特征图的维度，防止模型过拟合", "", ""], "r": "ABCD", "e": "ABCD选项均正确。A选项，CNN卷积层可自动学习图像特征，无需手动设计；B选项，局部感受野和权值共享能降低参数数量，提高训练效率；C选项，全连接层在网络末尾把特征映射到具体类别；D选项，池化层可降维并防止过拟合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508627", "t": 2, "q": "以下关于\"强化学习中的探索与利用（Exploration vs Exploitation）\"问题，描述正确的有哪些？（　）", "a": ["过度\"利用\"会导致智能体陷入局部最优，无法发现更高收益的动作", "过度\"探索\"会导致智能体频繁尝试低收益动作，影响整体收益", "\"探索\"是指智能体选择未尝试过的动作，以探索新的收益可能性", "\"利用\"是指智能体选择已知能获得高奖励的动作，以最大化当前收益", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508628", "t": 2, "q": "以下关于\"人工智能伦理\"的问题，属于AI应用中需要关注的伦理风险的有哪些？", "a": ["AI技术的滥用（如深度伪造技术制作虚假视频）", "AI模型的算法偏见（如招聘AI对特定性别、种族的歧视）", "高昂的研发成本导致资源分配不均", "AI对就业市场的冲击（如自动化取代部分人类岗位）", "", ""], "r": "ABD", "e": "A中AI技术滥用会造成不良社会影响；B里算法偏见违背公平原则；D中AI冲击就业市场会带来社会问题，这些都属于AI应用伦理风险。而C研发成本导致资源分配不均是研发层面问题，不属于应用伦理风险。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508629", "t": 2, "q": "以下关于\"生成对抗网络（GAN）\"的描述，正确的有哪些？", "a": ["GAN容易出现训练不稳定、模式崩溃（生成数据单一）的问题", "GAN由生成器（Generator）和判别器（Discriminator）两个网络组成", "生成器的目标是生成逼真的假数据（如假图像、假文本），判别器的目标是区分真假数据", "GAN仅能用于图像生成任务，无法处理文本生成任务", "", ""], "r": "ABC", "e": "GAN由生成器和判别器构成，生成器生成假数据，判别器区分真假，不过它存在训练不稳定、模式崩溃问题，且不仅能用于图像生成，也可处理文本生成任务。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508630", "t": 2, "q": "以下关于\"循环神经网络（RNN）\"的描述，正确的有哪些？", "a": ["RNN可以并行处理时序数据，运算速度比CNN快", "LSTM（长短期记忆网络）是RNN的改进版本，能够解决长序列依赖问题", "RNN在处理长序列时，容易出现梯度消失或梯度爆炸问题", "RNN仅能处理单向时序数据，无法同时利用过去和未来的上下文信息", "", ""], "r": "BC", "e": "RNN按顺序处理时序数据，不能并行，速度不如CNN，A错误；LSTM改进了RNN，能解决长序列依赖问题，B正确；RNN处理长序列时，因链式求导易出现梯度消失或爆炸问题，C正确；双向RNN可同时利用过去和未来的上下文信息，D错误。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508631", "t": 2, "q": "以下关于\"语音情感识别\"技术的描述，正确的有哪些？", "a": ["语音情感识别的常见情感类别包括高兴、悲伤、愤怒、中性等", "语音情感识别可应用于客服质检（如判断客户是否满意）、心理评估等场景", "语音情感识别通过分析语音的声学特征（如语速、音调、能量）来判断说话人的情感", "语音情感识别完全不受说话人的口音、年龄、性别等因素影响", "", ""], "r": "ABC", "e": "A常见情感类别包含这些是正确的；B在客服质检和心理评估等场景有应用；C就是通过分析声学特征判断情感；而D说话人的口音、年龄、性别等会对识别有影响，并非完全不受影响。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508632", "t": 2, "q": "以下关于\"语音信号预处理\"的描述，正确的有哪些？", "a": ["预处理阶段会将语音信号转换为文字序列", "加窗是为了减少帧与帧之间的频谱泄漏", "预处理的目的是去除噪声、干扰，提升语音信号质量", "预加重是预处理的步骤之一，目的是提升高频信号的能量", "", ""], "r": "BCD", "e": "A选项，将语音信号转换为文字序列是语音识别后续步骤，非预处理阶段；B选项，加窗可减少频谱泄漏；C选项，预处理能去除干扰提升质量；D选项，预加重可提升高频信号能量。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508633", "t": 2, "q": "以下关于强化学习的核心要素，描述正确的有哪些？（　）", "a": ["奖励（Reward）是环境对智能体动作的评价，是学习的目标导向。", "环境（Environment）是智能体交互的对象，会对动作产生反馈。", "策略（Policy）是智能体根据环境状态选择动作的规则。", "价值函数（Value Function）用于评估当前状态的长期收益。", "", ""], "r": "ABCD", "e": "强化学习中，奖励是环境对智能体动作的评价，引导学习方向；环境是智能体交互对象，会反馈；策略是智能体选动作规则；价值函数评估状态长期收益，ABCD选项描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508634", "t": 2, "q": "以下关于语音合成技术的发展阶段，描述正确的有哪些？", "a": ["第二阶段是基于波形拼接的合成技术，自然度有所提升，但灵活性差", "第一阶段是基于共振峰的合成技术，合成语音自然度低", "第四阶段是基于深度学习的端到端合成技术，自然度接近人类语音", "第三阶段是基于参数合成的合成技术，显著提高了自然度但仍存在一些问题", "", ""], "r": "ABCD", "e": "语音合成技术通常按以下阶段发展：<br />第一阶段（基于共振峰）：利用声学理论模拟声道共振峰参数，合成语音清晰度尚可但自然度低，机械感强，B正确；<br />第二阶段（基于波形拼接）：将预录的语音基元拼接合成，自然度较共振峰法有所提升，但需大量录音，且拼接点易不连贯，灵活性差（难以处理未录音的内容），A正确；<br />第三阶段（基于参数合成，如HMM、统计参数）：通过统计模型生成声学参数再合成语音，自然度显著提高，但存在“平均化”导致的音质模糊、韵律不够自然等问题，D正确；<br />第四阶段（基于深度学习端到端，如Tacotron、WaveNet、FastSpeech等）：直接建模文本到语音的映射，生成语音自然度接近甚至达到人类水平，韵律和音质大幅提升，C正确；", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508635", "t": 2, "q": "以下关于自然语言处理中\"Transformer架构\"的描述，正确的有哪些？（　）", "a": ["Transformer架构的并行计算能力优于循环神经网络（RNN），训练速度更快", "Transformer架构中的编码器（Encoder）部分采用双向注意力机制，而解码器（Decoder）部分则结合了双向与单向注意力机制来确保信息不泄露到未来的时间步", "Transformer架构是目前主流的预训练语言模型（如BERT、GPT系列等）的基础架构", "Transformer架构通过自注意力机制（Self-Attention）捕捉序列中任意两个位置之间的依赖关系", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508636", "t": 2, "q": "以下关于AI算力芯片\"功耗\"的描述，正确的有哪些？", "a": ["动态功耗是芯片功耗的主要部分，与电压的平方和频率成正比", "降低芯片的主频可以降低功耗，但会牺牲运算速度", "专用AI芯片（如ASIC）在执行特定任务时的功耗可能低于通用芯片（如GPU）", "芯片的制程工艺越先进（例如7nm相比14nm），单位面积上的功耗通常更低", "", ""], "r": "ABCD", "e": "A动态功耗公式P∝CV<sup>2<\/sup>f,是芯片功耗主要来源；B降低主频可减小功耗，但会降低运算速", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508637", "t": 2, "q": "以下关于AI算力芯片\"FPGA\"的应用场景，描述正确的有哪些？", "a": ["FPGA适合用于边缘设备中，要求低功耗、小体积的场景", "FPGA适合用于大规模量产、对成本敏感的场景", "FPGA适合用于需要灵活调整硬件逻辑的场景（如多模态AI任务）", "FPGA适合用于对时延要求严格的场景（如低时延推理）", "", ""], "r": "ACD", "e": "FPGA功耗低、体积小，适合边缘设备；可灵活调整硬件逻辑，适用于多模态AI任务；响应速度快，适合低时延推理场景。但它开发成本高，不适合大规模量产、对成本敏感场景。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508638", "t": 2, "q": "以下关于AI算力芯片\"GPU\"与\"CPU\"的区别，描述正确的有哪些？", "a": ["GPU的功耗通常低于CPU，更适合移动设备", "GPU的主频通常高于CPU，因此单线程运算速度更快", "GPU主要用于图形渲染和深度学习任务;CPU是通用计算核心，负责系统整体调度", "GPU的缓存容量通常小于CPU，对数据存取的局部性要求更高", "", ""], "r": "CD", "e": "A项，GPU功耗通常高于CPU；B项，CPU单线程运算速度通常更快；C项，GPU适合图形渲染和深度学习，CPU负责系统整体调度，描述正确；D项，GPU缓存容量小，对数据存取局部性要求高，表述正确。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508639", "t": 2, "q": "以下关于AI算力芯片的\"异构计算架构\"，描述正确的有哪些？（　）", "a": ["异构计算架构仅适用于云端大规模AI训练，不适用于边缘设备", "异构计算架构通常结合CPU、GPU、ASIC等多种类型芯片，发挥各自优势", "CPU负责复杂控制逻辑和串行计算，GPU/ASIC负责并行AI计算", "异构计算架构可通过软件栈（如CUDA、OpenCL）实现不同芯片的协同工作", "", ""], "r": "BCD", "e": "异构计算架构可用于边缘设备，A错误；它常结合多种芯片发挥优势，CPU处理复杂控制和串行计算，GPU/ASIC处理并行AI计算，还能借助软件栈实现芯片协同工作，B、C、D正确。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508640", "t": 2, "q": "以下哪些技术可用于提升卷积神经网络（CNN）在图像识别任务中的性能和效率？（　）", "a": ["残差连接（Residual Connection）", "卷积核剪枝（Kernel Pruning）", "注意力机制（如SENet、CBAM）", "批归一化（Batch Normalization）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508641", "t": 2, "q": "以下哪些技术可用于提升语音识别系统在低资源语言（如小语种）中的识别性能？（　）", "a": ["语言模型适配（构建低资源语言的小型语言模型）", "数据增强（如语音速度调整、噪声添加、频谱增强）", "跨语言迁移学习（利用高资源语言的预训练模型迁移到低资源语言）", "半监督学习（利用少量标注数据和大量无标注数据训练）", "", ""], "r": "ABCD", "e": "A构建适配低资源语言的小型语言模型能贴合其特点提升性能；B数据增强可扩充数据多样性，提高模型泛化能力；C跨语言迁移学习借助高资源语言预训练模型能加快低资源语言模型训练；D半监督学习利用无标注数据可弥补标注数据不足。ABCD方法都有助于提升低资源语言语音识别性能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508642", "t": 2, "q": "以下哪些技术属于图像目标检测任务中的\"单阶段检测模型\"技术？（　）", "a": ["YOLO（You Only Look Once）", "Faster R-CNN", "SSD（Single Shot MultiBox Detector）", "Mask R-CNN", "", ""], "r": "AC", "e": "单阶段检测模型直接从图像中预测目标类别和位置，YOLO和SSD是典型单阶段模型；Faster R - CNN和Mask R - CNN是两阶段检测模型，先产生候选区域再进行分类和定位。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508643", "t": 2, "q": "以下哪些技术属于语音识别系统中的\"特征提取\"环节常用的方法？（　）", "a": ["自注意力机制（Self-Attention）", "线性预测倒谱系数（LPCC）", "随机森林（Random Forest）", "梅尔频率倒谱系数（MFCC）", "", ""], "r": "BD", "e": "语音识别特征提取常用方法有LPCC和MFCC 。自注意力机制多用于序列建模；随机森林是分类算法。答案：BD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813960653508644", "t": 2, "q": "以下哪些属于语音信号的\"时域特征\"，可用于初步分析语音信号的基本特性？（　）", "a": ["短时自相关函数（Short-time Autocorrelation）", "短时过零率（Short-time Zero Crossing Rate）", "梅尔倒谱系数（Mel-frequency Cepstral Coefficients, MFCC）", "线性预测系数（LPC）", "", ""], "r": "AB", "e": "时域特征是描述信号在时间域上的特性。短时过零率反映语音信号在短时间内穿过零电平的次数，是时域特征；短时自相关函数也是在时域分析语音信号相关性。而梅尔倒谱系数是频域特征，线性预测系数是从语音信号的线性预测模型衍生，主要用于频域分析。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406976", "t": 3, "q": "机器学习是人工智能的子集，深度学习是机器学习的子集，因此所有人工智能系统都属于深度学习范畴。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然机器学习是人工智能子集，深度学习是机器学习子集，但人工智能还包含机器学习之外的内容，并非都属于深度学习范畴。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406977", "t": 3, "q": "机器学习中的\"监督学习\"需要大量标注数据（如标注好类别的图像），而\"无监督学习\"无需任何标注数据，仅通过数据本身的分布特征进行学习。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "监督学习是基于有标签数据进行训练，通常需要大量标注数据来让模型学习输入和输出的映射关系；无监督学习直接对无标签数据进行分析，依据数据自身分布特征挖掘模式。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406978", "t": 3, "q": "机器学习中的\"强化学习\"智能体，在学习过程中会主动探索环境，以获取更多奖励，无需人工干预学习过程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406979", "t": 3, "q": "监督学习中的\"分类任务\"和\"回归任务\"的核心区别是:分类任务的输出是离散类别标签，回归任务的输出是连续数值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "监督学习里，分类任务目标是将样本划分到离散的类别中，输出为离散类别标签；回归任务则是预测连续的数值，所以该描述准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406980", "t": 3, "q": "卷积神经网络（CNN）中的残差连接（Residual Connection）通过在网络层之间添加shortcut路径，将输入直接传递到后续层，能够有效解决深层网络训练中的梯度消失问题，使训练更深层次的CNN成为可能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "残差连接确实是在网络层间添加shortcut路径，让输入直接到后续层，能缓解深层网络训练时的梯度消失或爆炸问题，助力训练更深的CNN。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406981", "t": 3, "q": "卷积神经网络（CNN）中的卷积层通过滑动卷积核对输入特征图进行卷积运算，其核心作用是减少特征图的空间维度，降低后续计算量，同时保留关键特征信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "卷积层核心作用是提取输入数据的特征，池化层才主要是减少特征图空间维度、降低后续计算量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406982", "t": 3, "q": "卷积神经网络（CNN）中的批归一化（Batch Normalization）技术，通过对每一批训练数据的特征进行标准化处理（使其均值为0、方差为1），能够加速模型的训练收敛速度，同时减少过拟合现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "批归一化对每批训练数据特征标准化，能让数据分布更稳定，加快梯度下降收敛速度，还能增强模型泛化能力减少过拟合。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406983", "t": 3, "q": "卷积神经网络（CNN）中的权值共享机制可以减少模型参数数量，降低训练复杂度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "权值共享指在卷积操作中同一卷积核在图像不同位置共享使用相同的权重，这样避免为每个位置都设置独立参数，能有效减少模型参数数量，进而降低训练复杂度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406984", "t": 3, "q": "强化学习中，智能体的目标是最大化长期累积奖励，而非短期即时奖励。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "强化学习里，智能体需考虑长远利益，要通过合理决策在整个过程中获取最大的长期累积奖励，而非只看当下短期即时奖励。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406985", "t": 3, "q": "强化学习中的\"策略梯度（Policy Gradient）\"算法直接优化策略函数（而非价值函数），通过计算策略的梯度并沿梯度上升方向更新参数，以最大化累积奖励，该算法更适合处理连续动作空间的强化学习问题。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "策略梯度算法确实直接优化策略函数，通过计算策略梯度沿梯度上升方向更新参数来最大化累积奖励，且在连续动作空间中，相比基于价值函数的方法，策略梯度算法能更自然地处理，所以适合处理连续动作空间问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406986", "t": 3, "q": "强化学习中的\"奖励函数\"设计至关重要，它直接决定了智能体的学习目标。若奖励函数设计不合理（如奖励稀疏或存在局部最优奖励），会导致智能体无法学习到最优行为策略。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "奖励函数在强化学习里为智能体明确学习目标，合理设计才能引导其学到最优策略，不合理的设计，像奖励稀疏让智能体难获反馈、局部最优奖励使智能体陷入局部，都会让其学不到最优策略。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406987", "t": 3, "q": "强化学习中的\"ε-greedy算法\"通过以概率ε选择随机动作（探索），以概率1-ε选择当前Q值最大的动作（利用），能够在探索与利用之间取得平衡，是强化学习中最常用的探索策略之一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "ε - greedy算法的确是按概率ε选随机动作来探索，按概率1 - ε选Q值最大动作来利用，可在探索与利用间平衡，是常用探索策略。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406988", "t": 3, "q": "强人工智能（AGI）的核心特征是具备与人类相当的通用智能，能够自主学习任意领域的知识并解决复杂问题，目前全球范围内已有成熟的AGI系统投入实际应用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然强人工智能目标是具备通用智能来学习各领域知识和解决复杂问题，但目前全球还没有成熟的AGI系统投入实际应用。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406989", "t": 3, "q": "强人工智能（AGI）目前已实现商用，可在医疗、教育、金融等多个领域自主完成复杂任务，替代人类工作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "强人工智能目前还处于理论和研究阶段，并未实现商用，离能在多领域自主完成复杂任务替代人类工作有很大差距。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406990", "t": 3, "q": "强人工智能（AGI）目前已实现商用，能够在所有领域自主完成人类可完成的任务。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "强人工智能目前尚未实现商用，也无法在所有领域自主完成人类可完成的任务。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406991", "t": 3, "q": "人工智能技术的应用不会受到数据质量的影响，即使训练数据存在噪声或偏差，模型仍能输出准确结果。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据质量对人工智能模型至关重要，有噪声或偏差的训练数据会导致模型学习到错误信息，影响输出结果的准确性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406992", "t": 3, "q": "在人工智能应用中，\"强化学习\"的智能体（Agent）仅能通过环境反馈的\"奖励\"信号学习，无法利用已有的知识或数据加速学习。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "强化学习的智能体并非仅靠环境反馈的“奖励”信号学习，也能利用已有知识或数据来加速学习过程。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406993", "t": 3, "q": "人工智能中的\"多模态学习\"仅能融合文本和图像两种数据模态，无法融合语音、视频等其他模态数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多模态学习可融合文本、图像、语音、视频等多种数据模态，并非仅能融合文本和图像。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406994", "t": 3, "q": "人工智能中的\"监督学习\"模型训练完成后，若在训练集上准确率很高，但在测试集上准确率很低，说明模型存在欠拟合问题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。训练集准确率高、测试集准确率低是过拟合的表现，过拟合是模型对训练数据过度学习，泛化能力差；而欠拟合是模型未能很好学习数据特征，在训练集和测试集上表现都不佳。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406995", "t": 3, "q": "人工智能中的\"迁移学习\"技术，其核心思想是将在源领域（如ImageNet图像分类）训练好的模型参数迁移到目标领域（如医学图像识别），以减少目标领域对标注数据的依赖，提升模型训练效率和性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "迁移学习就是把在一个领域训练好的模型知识迁移到另一个领域，能降低目标领域对标注数据需求，提高训练效率和性能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406996", "t": 3, "q": "人工智能中的\"无监督学习\"需要依赖大量标注数据来训练模型，标注质量直接影响模型性能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "无监督学习是对未标注数据进行分析，不依赖大量标注数据，依赖标注数据的是监督学习。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406997", "t": 3, "q": "人工智能中的\"知识图谱\"主要用于存储非结构化知识，如自由文本、图片等，不支持结构化知识的组织。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "知识图谱主要用于存储和组织结构化知识，它将现实世界中的实体及它们之间的关系以结构化的方式呈现，并非主要存储非结构化知识。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406998", "t": 3, "q": "弱人工智能（ANI）的性能提升仅依赖算法优化，与硬件算力的提升无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "弱人工智能性能提升既依赖算法优化，也与硬件算力提升有关，硬件算力是其发展的重要基础。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177406999", "t": 3, "q": "弱人工智能（ANI）具备跨领域解决复杂问题的能力，能够自主学习新任务，是当前人工智能技术的主要发展方向。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "弱人工智能只能完成特定领域的任务，不具备跨领域解决复杂问题和自主学习新任务的能力，当前主要发展方向是强人工智能等更高级形态，所以此说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407000", "t": 3, "q": "弱人工智能（ANI）系统虽然仅能在特定领域完成专业化任务（如AlphaGo下围棋、Siri语音交互），但部分ANI系统已具备自主意识和独立思考能力，能够理解自身行为的意义。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "弱人工智能只能在特定领域完成任务，不具备自主意识和独立思考能力，也无法理解自身行为意义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407001", "t": 3, "q": "生成对抗网络（GAN）中的生成器和判别器是同步训练的，两者通过相互对抗实现共同优化，最终达到纳什均衡状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407002", "t": 3, "q": "图像分割任务中的\"语义分割\"仅需区分图像中不同类别的像素（如\"猫\"\"狗\"\"背景\"），无需区分同一类别中的不同个体（如区分两只不同的猫），而\"实例分割\"则需要同时完成类别区分和个体区分。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "语义分割重点在于区分不同类别像素，不区分同一类别的不同个体；实例分割既要区分类别，又要区分同一类别中的不同个体。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407003", "t": 3, "q": "图像生成任务中的\"扩散模型（Diffusion Model）\"通过逐步向噪声图像中添加细节，最终生成清晰图像，相比生成式对抗网络（GAN），具有生成图像质量更高、训练更稳定、不易模式崩溃的优势。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "扩散模型是逐步从噪声中恢复图像，相比GAN，它生成图像质量高、训练稳定且不易模式崩溃。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407004", "t": 3, "q": "图像识别中的\"超分辨率重建\"技术，可将任意低分辨率图像恢复为高分辨率图像，且恢复后的图像细节与原始高分辨率图像完全一致。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超分辨率重建技术虽能提升低分辨率图像质量，但受多种因素限制，无法将任意低分辨率图像恢复到与原始高分辨率图像细节完全一致的程度。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407005", "t": 3, "q": "图像识别中的\"池化层\"不仅能降低特征图的维度，还能增强模型对图像平移、缩放等变形的鲁棒性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "池化层通过对特征图进行下采样降低了维度，同时在一定程度上实现了对图像平移、缩放等变形的不变性，从而增强模型鲁棒性。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407006", "t": 3, "q": "在图像识别中的\"目标跟踪\"任务里，如果目标被完全遮挡一段时间后，所有跟踪算法都无法重新找回目标。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "并非所有跟踪算法在目标被完全遮挡一段时间后都无法重新找回目标，部分先进算法具备一定的恢复跟踪能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407007", "t": 3, "q": "图像识别中的\"目标检测\"任务仅需识别图像中目标的类别，无需确定目标在图像中的具体位置。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "目标检测不仅要识别图像中目标的类别，还需确定目标在图像中的具体位置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407008", "t": 3, "q": "图像识别中的\"目标检测\"算法，其准确率与检测速度通常呈正相关，即准确率越高，检测速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在图像识别的目标检测算法里，准确率和检测速度一般是相互制约的。为追求高准确率往往要进行更复杂的计算和分析，这会降低检测速度；若要提高检测速度，可能会简化处理，导致准确率下降，并非正相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407009", "t": 3, "q": "图像识别中的\"目标检测\"算法（如YOLO），其检测速度主要取决于算法的网络结构复杂度，与输入图像的分辨率无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "图像识别的目标检测算法检测速度既和算法网络结构复杂度有关，也受输入图像分辨率影响，分辨率越高，处理的数据量越大，检测速度会变慢。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407010", "t": 3, "q": "图像识别中的\"迁移学习\"，若源任务（如ImageNet分类）与目标任务（如X光片病灶检测）的图像风格差异过大，迁移效果会显著下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "迁移学习依赖源任务和目标任务有一定相似性，图像风格差异过大，源任务学到的特征难以适配目标任务，迁移效果会受影响显著下降。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407011", "t": 3, "q": "图像识别中的\"实例分割\"任务，不仅需要将图像中不同类别物体分割开，还需要区分同一类别中的不同个体（如同一幅图中的两只猫）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "实例分割的目标就是既分割出不同类别的物体，又区分同一类别里不同个体。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407012", "t": 3, "q": "图像识别中的\"数据增强\"技术（如随机裁剪、翻转），可增加训练数据的多样性，从而提升模型的泛化能力，减少过拟合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据增强通过对原始数据进行随机裁剪、翻转等操作生成新数据，增加了训练数据多样性，让模型学习到更多特征模式，能更好适应不同情况，可提升泛化能力、减少过拟合。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407013", "t": 3, "q": "图像识别中的\"数据增强\"技术仅在模型训练阶段使用，测试阶段无需使用，以避免改变测试数据的真实性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据增强主要是为增加训练数据多样性、提升模型泛化能力，测试阶段要保证数据真实性，不能用数据增强改变测试数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407014", "t": 3, "q": "图像识别中的\"语义分割\"任务，输出结果是图像中每个像素的类别标签，属于像素级别的分类。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "语义分割就是对图像中每个像素进行分类，确定其所属类别，输出每个像素的类别标签，是像素级别的分类。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407015", "t": 3, "q": "图像识别中的\"语义分割\"任务，输出结果是图像中每个像素的类别标签（如\"道路\"\"行人\"），但无法给出每个类别的具体位置坐标。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "语义分割不仅能输出图像中每个像素的类别标签，还能通过像素位置来确定每个类别的具体位置坐标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407016", "t": 3, "q": "图像识别中的\"ResNet\"（残差网络）通过引入残差连接，有效解决了深层网络训练时的梯度消失问题，使训练上千层的网络成为可能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "ResNet 确实引入了残差连接，残差连接能让信号在网络中更顺畅传导，避免了梯度在反向传播过程中过小而导致梯度消失问题，从而使得训练上千层的深层网络成为可能。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407017", "t": 3, "q": "图像识别中的\"YOLO\"算法是一种实时目标检测算法，通过单次前向传播即可完成图像中所有目标的检测，速度快于基于区域的检测算法（如Faster R-CNN）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "YOLO 算法确实是实时目标检测算法，它能通过单次前向传播检测图像所有目标，相比基于区域的 Faster R-CNN 等算法速度更快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407018", "t": 3, "q": "循环神经网络（RNN）在处理长文本序列时，容易出现梯度消失或梯度爆炸问题，导致模型无法学习到长距离依赖关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "RNN 因结构特点，在反向传播时，随着时间步增加，梯度在传播过程中会不断相乘，易出现梯度消失或爆炸，使得难以捕捉长距离依赖。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407019", "t": 3, "q": "语音合成（TTS）技术中的端到端合成方案，能够直接从文本输入生成语音信号，无需经过文本分析、韵律建模、声学建模等中间步骤，因此相比传统TTS方案，具有合成流程更简单、语音自然度更高的优势。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "端到端合成方案确实能直接从文本输入生成语音信号，跳过了传统的文本分析等中间步骤，让合成流程简化，且合成语音自然度通常更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407020", "t": 3, "q": "语音合成技术中，\"声码器\"的作用是将文本转换为声学特征（如梅尔频谱），为后续波形生成提供基础。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "声码器主要是将声学特征转换为语音波形，而将文本转换为声学特征一般由前端模块完成。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407021", "t": 3, "q": "在语音合成技术中，基于拼接的TTS模型生成的语音自然度，通常高于基于深度学习的端到端TTS模型。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基于深度学习的端到端TTS模型能更好地学习语音的特征和模式，生成的语音自然度通常高于基于拼接的TTS模型。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407022", "t": 3, "q": "语音合成技术中，基于深度学习的端到端合成技术无需经过文本分析、声学建模等中间阶段，可直接从文本生成语音波形。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "基于深度学习的端到端合成技术打破传统流程，能直接从文本生成语音波形，无需文本分析、声学建模等中间阶段。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407023", "t": 3, "q": "语音合成技术中，基于Transformer的TTS模型（如Tacotron 2）可实现端到端的文本到语音转换，无需拆分文本分析、声学建模、声码器等模块。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407024", "t": 3, "q": "语音合成技术中的\"参数合成\"方案，通过提取语音的基频、共振峰等声学参数，利用参数模型生成语音信号，相比\"拼接合成\"方案，具有语料依赖少、合成语音自然度高的优势。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407025", "t": 3, "q": "语音合成中的\"波形拼接技术\"合成的语音自然度高，但灵活性差，难以调整语音的语速、音调等参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "波形拼接技术是将预先录制好的语音片段拼接成新语音，因用的是已有片段，自然度高，但调整语速、音调等参数困难，灵活性差。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407026", "t": 3, "q": "语音唤醒技术需要持续将语音数据上传至云端服务器进行处理，无法在本地设备完成唤醒检测。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "语音唤醒技术可以在本地设备完成唤醒检测，并非都要持续将语音数据上传至云端服务器处理，本地芯片可进行一定的唤醒判断。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407027", "t": 3, "q": "语音识别系统中，“声学建模”的核心作用是将语音信号转换为文本序列，无需依赖“语言模型”即可完成识别。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "声学建模是将语音特征转换为声学单元概率，但仅靠它无法完成语音到文本的识别，还需语言模型来确定最可能的文本序列。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407028", "t": 3, "q": "语音识别中的\"端点检测\"技术，可完全消除环境噪声对语音信号的干扰，确保仅提取纯净的语音片段进行后续处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "端点检测主要是确定语音的起始和结束位置，虽能一定程度减少环境噪声影响，但无法完全消除环境噪声对语音信号的干扰。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407029", "t": 3, "q": "语音识别中的\"端点检测\"任务主要作用是从连续语音信号中区分出语音段和非语音段（如静音、噪声）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "端点检测就是为了准确地从连续信号里划分出语音部分和非语音部分，题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407030", "t": 3, "q": "语音识别中的\"方言识别\"与\"普通话识别\"使用完全相同的模型，仅需更换训练数据即可实现方言识别。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "方言和普通话在发音、词汇、语法等方面存在较大差异，简单更换训练数据不能让相同模型很好地实现方言识别，通常需要专门设计适配方言特点的模型。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407031", "t": 3, "q": "语音识别中的\"降噪\"技术，其核心是通过建模环境噪声的特征，从带噪语音中减去噪声成分，得到纯净语音。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "降噪技术确实常通过对环境噪声特征建模，再从带噪语音里减去噪声成分以获取纯净语音。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407032", "t": 3, "q": "语音识别中的\"解码\"阶段，是将声学模型输出的音素序列转换为文字序列，该过程需要结合语言模型的信息进行优化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "语音识别里，“解码”就是把声学模型输出的音素序列转化成文字序列，且为得到更准确合理结果，会结合语言模型信息来优化。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407033", "t": 3, "q": "语音识别中的\"声学模型\"主要负责建立文字序列与音素之间的映射关系，提升识别的语义准确性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "声学模型是建立语音信号和音素之间的映射关系，而非文字序列与音素之间的映射关系，主要提升的是语音特征到音素的识别准确性，不是语义准确性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407034", "t": 3, "q": "语音识别中的\"语言模型\"，其核心作用是计算不同文本序列的概率，选择概率最高的文本作为识别结果，以降低错误率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "语言模型在语音识别里能对不同文本序列计算概率，通过选概率最高的文本当作识别结果，可有效减少错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813966177407035", "t": 3, "q": "语音识别中的\"语言模型\"主要作用是处理语音信号的噪声干扰，提升语音信号的清晰度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "语音识别中语言模型主要用于评估语句的合理性、预测下一个词等，降低识别的歧义，而非处理语音信号的噪声干扰和提升清晰度，处理噪声干扰等是声学模型等部分的工作。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第10章 人工智能（2）", "n": "基础练习题【含解析】 / 第10章 人工智能（2）", "qs": [{"id": "2034813972519194624", "t": 1, "q": "在图像识别的\"图像分割\"任务中，下列哪种算法属于\"语义分割\"范畴，能够将图像中每个像素归类到对应语义类别（如道路、行人、车辆）？", "a": ["U-Net", "YOLOv5", "Mask R-CNN", "Faster R-CNN", "", ""], "r": "A", "e": "语义分割要将图像每个像素归类到对应语义类别。U - Net是经典语义分割算法。YOLOv5和Faster R - CNN是目标检测算法，主要用于检测目标位置和类别。Mask R - CNN虽能做实例分割，但重点在区分不同实例，不是单纯语义分割。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194625", "t": 1, "q": "在图像识别技术中，\"能够自动学习图像的多层次特征，从低级的边缘、纹理到高级的物体部件、整体轮廓\"的算法模型是以下哪一类？", "a": ["支持向量机（SVM）", "随机森林", "卷积神经网络（CNN）", "循环神经网络（RNN）", "", ""], "r": "C", "e": "卷积神经网络（CNN）可自动学习图像多层次特征，从低级到高级。而支持向量机、随机森林并非专门用于自动学习图像多层次特征；循环神经网络主要处理序列数据。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813972519194626", "t": 1, "q": "在图像识别任务中，\"目标检测\"与\"图像分类\"的主要区别是以下哪一项？", "a": ["目标检测的精度一定高于图像分类", "目标检测不仅要识别物体类别，还要确定物体在图像中
