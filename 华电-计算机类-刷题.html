 "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "最小生成树是一个连通加权无向图中一棵权值最小的生成树，其权值之和就是连接图中所有顶点所需边的权值之和的最小值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090177", "t": 3, "q": "完全二叉树的节点可以用数组存储，若父节点的下标为i，则其左子节点的下标为2i，右子节点的下标为2i+1（假设根节点下标为1）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在完全二叉树用数组存储且根节点下标为 1 时，根据完全二叉树节点编号规则，父节点下标为 i ，其左子节点下标就是 2i ，右子节点下标就是 2i + 1。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090178", "t": 3, "q": "完全二叉树中，若某节点有左子节点，则该节点一定有右子节点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "完全二叉树中，若某节点有左子节点，不一定有右子节点，比如最后一层从左到右依次排列节点时，可能存在只有左子节点的情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090179", "t": 3, "q": "在完全二叉树中，若一个节点的索引为i（从1开始），则其左子节点的索引为2i，右子节点的索引为2i+1。如果2i大于节点总数，则该节点没有左子节点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是完全二叉树节点索引的基本性质。在完全二叉树按层序从 1 开始编号时，节点索引和子节点索引存在此对应关系，当 2i 超出节点总数，自然无左子节点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090180", "t": 3, "q": "稳定排序算法在排序后，关键字相等的元素的相对位置不会发生变化，而非稳定排序算法会改变所有元素的相对位置。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "稳定排序算法能保证关键字相等元素相对位置不变，而非稳定排序算法只是可能改变关键字相等元素的相对位置，并非会改变所有元素相对位置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090181", "t": 3, "q": "稳定排序算法在排序后，相同值元素的相对位置不会发生改变。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稳定排序算法的定义就是排序后相同值元素相对位置不变。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090182", "t": 3, "q": "无向图的邻接矩阵是对称矩阵，因为若顶点i和j之间有边，则A[i][j]=A[j][i]=1，若无边则均为0。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "无向图的边没有方向，若两顶点间有边，在邻接矩阵中这两个顶点对应位置的值必然相等都为1，无边则都为0，所以邻接矩阵是对称矩阵。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090183", "t": 3, "q": "无向图的邻接矩阵一定是对称矩阵，有向图的邻接矩阵一定是不对称矩阵。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "无向图边无方向，邻接矩阵中表示边的元素在对称位置相等，所以一定是对称矩阵；而有向图邻接矩阵也可能对称，比如所有边都是双向的有向图。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090184", "t": 3, "q": "希尔排序是插入排序的改进算法，其时间复杂度优于直接插入排序。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090185", "t": 3, "q": "稀疏矩阵的三元组表存储中，非零元素的排列顺序必须按照行号递增的顺序，若行号相同，则按列号递增的顺序排列。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稀疏矩阵三元组表存储时，为了便于查找和操作，通常规定非零元素按行号递增排序，行号相同时按列号递增排序。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090186", "t": 3, "q": "稀疏矩阵的十字链表存储中，每个非零元素节点同时属于所在行的链表和所在列的链表，行链表和列链表分别由行头节点和列头节点引领。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在稀疏矩阵的十字链表存储里，非零元素节点有行指针和列指针，会同时属于所在行和列的链表，且行链表和列链表分别由行头节点和列头节点引领。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090187", "t": 3, "q": "稀疏矩阵的压缩存储目的是减少存储空间，仅存储非零元素及其位置信息。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稀疏矩阵中非零元素少，存储大量零元素浪费空间，压缩存储就是只存非零元素及其位置以减少空间占用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090188", "t": 3, "q": "稀疏矩阵的压缩存储中，三元组表存储的是稀疏矩阵中的非零元素，每个非零元素用（行号，列号，值）三个字段表示，可节省存储空间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稀疏矩阵多数元素为零，用三元组表只存非零元素，以（行号，列号，值）表示，避免存储大量零元素，节省了存储空间。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090189", "t": 3, "q": "线性表的链式存储结构中，节点的存储位置可以是连续的，也可以是不连续的，节点之间通过指针链接，因此链表的长度可以动态变化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "链式存储结构里节点靠指针相连，存储位置无需连续，且可随时添加或删除节点使链表长度动态变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090190", "t": 3, "q": "线性表的链式存储结构中，元素的存储地址必须是连续的，否则无法通过指针访问后续元素。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "链式存储结构中元素存储地址是随机的、不连续的，通过指针指向后续元素来实现元素间逻辑关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090191", "t": 3, "q": "线性表的顺序存储结构中，元素的存储地址是连续的，因此可以通过元素的下标直接计算出该元素的存储地址，实现随机访问。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "线性表顺序存储结构是把线性表中所有元素按照其逻辑顺序依次存储在一块连续的存储空间中，能依据元素下标结合起始地址和元素大小直接算出存储地址，从而实现随机访问。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090192", "t": 3, "q": "线性表的长度是指线性表中存储的元素个数，在程序运行过程中不可改变（顺序表）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "顺序表长度在程序运行中是可以改变的，比如进行插入、删除元素操作时，长度会相应变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090193", "t": 3, "q": "循环队列的队头指针front和队尾指针rear始终指向队列中的有效元素，因此队列的元素个数可以通过rear-front直接计算。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "循环队列中，队头指针 front 和队尾指针 rear 不一定始终指向队列中的有效元素，且用 rear - front 计算元素个数会因循环情况出错，应考虑取模运算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090194", "t": 3, "q": "循环队列的队尾指针rear始终指向队尾元素，队头指针front始终指向队头元素的前一个位置，此时队列满的条件是(rear+1)%maxSize==front。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在循环队列这种存储结构中，为区分队空和队满，通常让队尾指针指向队尾元素，队头指针指向队头元素前一位置，当(rear + 1) % maxSize == front时，意味着队列已满。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090195", "t": 3, "q": "循环队列的元素个数计算公式为（rear-front+maxSize）%maxSize，该公式在rear>front和rear<front两种情况下均适用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在循环队列中，当 rear > front 时，元素个数是 rear - front；当 rear < front 时，元素个数是 rear - front + maxSize，而（rear - front + maxSize）% maxSize 能统一这两种情况计算元素个数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090196", "t": 3, "q": "循环队列的最大容量为maxSize，当(rear+1)%maxSize==front时，说明队列已满，此时队列中共有maxSize个元素。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090197", "t": 3, "q": "一棵二叉排序树的中序遍历序列一定是递增有序序列。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "二叉排序树的定义决定了左子树节点值小于根节点值，根节点值小于右子树节点值，中序遍历是左 - 根 - 右的顺序，所以中序遍历序列必然递增有序。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090198", "t": 3, "q": "一棵深度为h（根节点深度为1）的完全二叉树，其第h层的节点一定是从左到右连续排列的，且不存在空缺的位置。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完全二叉树定义是除最后一层外，每一层上的节点数均达到最大值；在最后一层上只缺少右边的若干节点。所以一棵深度为h（根节点深度为1）的完全二叉树，其第h层（最后一层）的节点一定是从左到右连续排列，不存在空缺位置。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090199", "t": 3, "q": "一棵深度为h的满二叉树，其节点总数为2^h-1。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090200", "t": 3, "q": "一棵有n个节点的树，其高度（根节点高度为1）一定不小于log2(n+1)（向下取整）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完全二叉树高度为⌊log₂(n + 1)⌋，普通树高度大于等于同节点数完全二叉树高度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090201", "t": 3, "q": "有向图的强连通分量是指图中最大的子图，该子图中任意两个顶点之间都存在双向路径，强连通分量之间相互独立，没有边相连。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "强连通分量是有向图中最大的强连通子图，任意两顶点间有双向路径，但强连通分量之间可能存在单向边相连，并非相互独立没有边相连。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090202", "t": 3, "q": "在单链表中，要删除一个节点，必须知道该节点的前驱节点的指针，否则无法完成删除操作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "单链表中节点只存储后继节点指针，删除节点需修改其前驱节点的后继指针，所以必须知道该节点的前驱节点指针。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090203", "t": 3, "q": "在二叉树中，叶子节点的数量一定大于度为2的节点的数量，因为根据二叉树性质，n0=n2+1（n0为叶子数，n2为度2节点数）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "二叉树存在性质 n0 = n2 + 1，这表明叶子节点数量比度为 2 的节点数量多 1，所以叶子节点数量一定大于度为 2 的节点数量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090204", "t": 3, "q": "在二叉树中，叶子节点的数量一定大于非叶子节点的数量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二叉树形态多样，比如只有一个根节点的二叉树，无叶子节点和非叶子节点数量大小关系，普通二叉树中叶子节点数量也不一定大于非叶子节点数量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090205", "t": 3, "q": "在哈希表中，采用链地址法（拉链法）解决冲突时，哈希表的存储空间大小固定，无法动态扩展。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "链地址法中，哈希表数组大小固定，但每个数组元素指向的链表可动态添加节点，能处理更多元素，可看作是空间能灵活扩展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090206", "t": 3, "q": "在哈希表中，采用链地址法解决冲突时，哈希表的负载因子α可以大于1，因为每个链表可以存储多个元素。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "链地址法中，负载因子α是指哈希表中记录数与哈希表长度的比值，因链表可存多个元素，α大于1也合理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090207", "t": 3, "q": "在链式存储的线性表中，插入一个新节点时，不需要移动任何已存在的节点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "链式存储的线性表，插入新节点只需修改相关节点的指针，无需移动已有节点。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090208", "t": 3, "q": "在链式队列中，队空的条件是队头指针front和队尾指针rear都指向NULL。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "链式队列队空时，队头指针 front 指向头节点，队尾指针 rear 也指向头节点，并非都指向 NULL。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090209", "t": 3, "q": "在任意一棵二叉树中，度为1的节点个数可以为0，也可以为其他正整数，不影响度为0和度为2的节点个数关系（n0=n2+1）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在二叉树中，根据二叉树的性质，无论度为1的节点个数如何，度为0的节点个数（n0）和度为2的节点个数（n2）始终满足n0 = n2 + 1的关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090210", "t": 3, "q": "在双向链表中，每个节点都有两个指针，分别指向其前驱节点和后继节点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "双向链表的节点结构特点就是有两个指针，一个指向前驱节点，一个指向后继节点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090211", "t": 3, "q": "在无向图的深度优先遍历中，遍历序列的长度等于图的节点数（连通图）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在无向连通图的深度优先遍历中，会从一个起始节点出发，依次访问图中所有节点且仅访问一次，所以遍历序列长度等于图的节点数。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090212", "t": 3, "q": "在无向图中，边数越多，图的连通性越好，一定不存在孤立节点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边数多不意味着连通性就好，比如多个孤立的完全子图，边数可能很多但图不连通；而且即使边数多也可能存在孤立节点。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090213", "t": 3, "q": "在循环队列中，队满的条件是front==rear，队空的条件也是front==rear，因此无法区分队满和队空。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "循环队列通过牺牲一个存储单元等方法来区分队满和队空，并非无法区分。队满和队空虽都有front == rear情况，但可通过额外规则判断。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090214", "t": 3, "q": "在循环链表中，通过尾节点的指针可以直接访问到头节点，时间复杂度为O(1)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "循环链表中尾节点的指针指向头节点，所以能直接通过尾节点指针访问头节点，时间复杂度是O(1)。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090215", "t": 3, "q": "在一棵深度为h的完全二叉树中，第k层（1≤k≤h）的节点个数一定为2^(k-1)。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "完全二叉树除最后一层外，每一层的节点数都达到最大值，即第k层（1≤k＜h）节点个数为2^(k - 1) ，但最后一层节点数可能不满，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090216", "t": 3, "q": "在有向图中，若从节点A到节点B有路径，且从节点B到节点A有路径，则A和B属于同一个强连通分量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "强连通分量定义是有向图中任意两顶点相互可达的最大子图，题中A到B有路径且B到A有路径，符合强连通分量中两顶点相互可达的条件。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090217", "t": 3, "q": "在栈的链式存储结构（链栈）中，栈底节点的next指针始终为NULL，栈顶节点的next指针指向栈底节点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在链栈中，栈底节点的next指针为NULL正确，但栈顶节点的next指针指向的是原栈顶节点，而不是栈底节点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090218", "t": 3, "q": "在栈的链式存储结构（链栈）中，栈顶指针指向栈底节点，每次入栈时将新节点插入到栈底，出栈时删除栈底节点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。在链栈中，栈顶指针指向栈顶节点，入栈是将新节点插入到栈顶，出栈是删除栈顶节点，而不是指向栈底、在栈底操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090219", "t": 3, "q": "栈的\"先进后出\"特性是指最后入栈的元素一定最先出栈，与元素的值无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "栈遵循“先进后出”原则，即后入栈的元素先出栈，和元素具体值没有关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090220", "t": 3, "q": "栈的存储结构只能是顺序存储（数组实现），不能采用链式存储。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "栈的存储结构既可以是顺序存储（用数组实现），也能采用链式存储，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090221", "t": 3, "q": "栈的顺序存储结构中，当栈满时再进行入栈操作，会发生\"上溢\";当栈空时再进行出栈操作，会发生\"下溢\"。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在栈的顺序存储结构里，栈满时入栈，因没有多余空间存储新元素，会出现“上溢”；栈空时出栈，没有元素可出，会出现“下溢”。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090222", "t": 3, "q": "栈的应用中，递归调用的工作栈用于存储每次递归调用的参数、局部变量和返回地址，递归深度越大，工作栈占用的空间越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "递归调用时，工作栈会存储每次递归的参数、局部变量和返回地址，递归深度增加意味着调用次数增多，存储的内容就更多，工作栈占用空间自然越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090223", "t": 3, "q": "栈和队列都是线性结构，都只能在端点进行插入和删除操作。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "栈是后进先出的线性表，仅在栈顶进行插入（入栈）和删除（出栈）操作；队列是先进先出的线性表，在队尾插入元素，在队头删除元素，它们都属于线性结构且都在端点操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090224", "t": 3, "q": "栈和队列都是限制了插入和删除操作位置的线性表，因此它们都是线性结构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "栈是后进先出，限定在栈顶进行插入和删除；队列是先进先出，在队尾插入、队头删除，二者都属于线性表，是线性结构。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090225", "t": 3, "q": "栈是一种\"先进后出\"的线性结构，栈的插入和删除操作都只能在栈顶进行，因此栈不存在溢出问题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "栈虽然是“先进后出”且插入和删除在栈顶进行，但当栈空间满了再进行入栈操作就会产生栈溢出问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090226", "t": 3, "q": "折半查找（二分查找）的时间复杂度为O(logn)，适用于所有线性表。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "折半查找要求线性表必须是有序的顺序存储结构，并非适用于所有线性表。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090227", "t": 3, "q": "折半查找的时间复杂度为O(log n)，它适用于所有线性表，包括顺序存储和链式存储的线性表。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "折半查找要求线性表必须采用顺序存储结构，且元素按关键字有序排列，不适用于链式存储的线性表。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090228", "t": 3, "q": "直接插入排序在最坏情况下（序列逆序）的时间复杂度为O(n²)，此时每个元素都需插入到序列的最前面，移动次数最多。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "直接插入排序最坏情况是序列逆序，此时每插入一个元素都要将其移到最前面，比较和移动次数达到最大，时间复杂度为O(n²)。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090229", "t": 3, "q": "直接选择排序的时间复杂度为O(n²)，且是不稳定排序算法。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "直接选择排序在每一轮从未排序序列中选最小（大）元素，需进行 n - 1 轮，每轮比较次数随轮数递减，总体时间复杂度是 O(n²) ；它在交换元素时可能改变相同元素相对顺序，是不稳定排序。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090230", "t": 3, "q": "字符串的模式匹配中，BF算法（暴力匹配）在最好情况下的时间复杂度为O(m+n)，其中m为模式串长度，n为主串长度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090231", "t": 3, "q": "字符串的模式匹配中，KMP算法的next数组值仅与模式串有关，与主串无关，因此可以提前预处理模式串生成next数组，供多次匹配使用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "KMP算法的next数组只取决于模式串本身的特性，不依赖主串情况，能提前对模式串处理得到next数组，后续可多次用于不同主串与该模式串的匹配。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090232", "t": 3, "q": "字符串的长度是指字符串中包含的字符个数，包括字符串结束符（如'\\0'）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "字符串长度指的是字符串中实际字符个数，不包含字符串结束符'\\0'。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090233", "t": 3, "q": "字符串的长度是指字符串中包含的字符个数，空字符串的长度为0，但空字符串与仅包含空格的字符串长度并不相同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "空字符串不含任何字符，长度 0；只含空格的字符串，空格属于有效字符，长度大于 0，二者长度不同。", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090234", "t": 3, "q": "Dijkstra算法可以求解含负权边的图的单源最短路径，因为它会不断更新顶点的最短路径长度，直到找到最优解。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "Dijkstra算法不能求解含负权边的图的单源最短路径。该算法基于贪心策略，一旦某个顶点被标记为已确定最短路径，就不会再更新其距离，而负权边可能会使后续路径更短，导致已标记顶点的最短路径并非最优。所以该题说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813762439090235", "t": 3, "q": "Floyd算法用于求解任意两个顶点之间的最短路径，它通过动态规划的思想，逐步更新任意两个顶点之间的最短路径长度，时间复杂度为O(n³)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Floyd算法确实是用于求任意两顶点间最短路径，基于动态规划思想，通过不断更新中间顶点来逐步更新最短路径长度，其时间复杂度是O(n³)。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 数据库系统（1）", "n": "基础练习题【含解析】 / 第2章 数据库系统（1）", "qs": [{"id": "2034813767040241664", "t": 1, "q": "并发操作中，T1读取数据后，T2修改并提交该数据，T1再次读取结果不同，此现象是？", "a": ["幻读", "丢失修改", "脏读", "不可重复读", "", ""], "r": "D", "e": "不可重复读指在一个事务内多次读取同一数据，由于其他事务对该数据进行了修改并提交，导致多次读取结果不同。本题中T1两次读取结果不同符合不可重复读的特征。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241665", "t": 1, "q": "不能解决丢失修改的措施是？", "a": ["采用乐观锁", "采用X锁", "隔离级别设为读已提交", "隔离级别设为可串行化", "", ""], "r": "C", "e": "丢失修改是指多个事务对同一数据进行修改，后一个事务的修改覆盖了前一个事务的修改。乐观锁可通过版本号等机制避免丢失修改；X锁（排他锁）能保证同一时间只有一个事务可对数据修改，防止丢失修改；可串行化隔离级别保证事务串行执行，避免丢失修改。而读已提交隔离级别只保证读取到已提交的数据，不能解决丢失修改问题。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241666", "t": 1, "q": "查询员工表中工资最高的前3名，正确的是？", "a": ["SELECT ename,sal FROM emp ORDER BY sal DESC LIMIT 3;", "SELECT ename,sal FROM(SELECT ename,sal FROM emp ORDER BY sal DESC) WHERE ROWNUM<=3;", "SELECT TOP 3 ename,sal FROM emp ORDER BY sal DESC;", "SELECT ename,sal FROM emp WHERE ROWNUM<=3 ORDER BY sal DESC;", "", ""], "r": "A", "e": "A选项使用`ORDER BY sal DESC`对工资降序排序，`LIMIT 3`取前3条记录，符合要求；B选项`ROWNUM`用法错误，在子查询中使用`ROWNUM`不能正确筛选；C选项`SELECT TOP`是SQL Server语法，本题未明确是该数据库；D选项先使用`ROWNUM`筛选，再排序，不能得到工资最高的前3名。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241667", "t": 1, "q": "创建存储过程proc_get_dept查询部门信息，正确开头是？", "a": ["CREATE PROCEDURE proc_get_dept(IN deptno INT) AS", "CREATE PROCEDURE proc_get_dept(INOUT deptno INT) AS", "CREATE FUNCTION proc_get_dept(IN deptno INT) RETURNS TABLE", "CREATE PROCEDURE proc_get_dept(OUT deptno INT)", "", ""], "r": "A", "e": "创建存储过程用CREATE PROCEDURE，C选项是创建函数，不符合；存储过程定义一般要有AS关键字，D选项缺少；A和B区别在于参数类型，若只是查询部门信息，通常用IN类型传参即可。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241668", "t": 1, "q": "关系代数中，不属于基本运算的是？", "a": ["连接（∞）", "选择（σ）", "并（∪）", "投影（π）", "", ""], "r": "A", "e": "关系代数基本运算有并、差、笛卡尔积、投影、选择，连接可由基本运算导出。所以答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241669", "t": 1, "q": "关系模式R（A,B,C,D），函数依赖F={A→B,B→C,A→D}，候选键是？", "a": ["A,C", "A,B", "B,D", "A", "", ""], "r": "D", "e": "候选键是能唯一决定关系中所有属性的最小属性集。在本题中，A能决定B、C、D，且A的任何真子集都不能决定所有属性，所以候选键是A。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241670", "t": 1, "q": "关系模式R（A,B,C,D），F={A→B,B→C,C→D}，R最高属于哪种范式？", "a": ["BCNF", "1NF", "2NF", "3NF", "", ""], "r": "C", "e": "关系模式 R(A, B, C, D)，函数依赖集 F = {A→B, B→C, C→D}。候选码为 A（因为 A 能推出 B、C、D，且 A 本身不能被其他属性推出）。<br />逐一判断范式：<br />1NF：所有属性都是原子的，R 满足 1NF。<br />2NF：检查是否存在非主属性对候选码的部分函数依赖。候选码是单属性 A，不存在部分依赖（部分依赖只可能发生在候选码为复合属性的情况下），因此 R 满足 2NF。<br />3NF：检查是否存在非主属性对候选码的传递函数依赖。由于 A→B，B→C，所以 A→C 是传递依赖；又 B→C，C→D，所以 A→D 也是传递依赖。存在非主属性对候选码的传递依赖，因此 R 不满足 3NF。<br />因此，R 最高属于 2NF，正确答案为 C。", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241671", "t": 1, "q": "关系模式R属于1NF，存在非主属性对主键的部分依赖，那么R属于哪一范式？", "a": ["3NF", "BCNF", "1NF", "2NF", "", ""], "r": "C", "e": "1NF消除非主属性对主码的部分函数依赖后才是2NF，本题存在非主属性对主键部分依赖，所以只满足1NF。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241672", "t": 1, "q": "关于视图，错误的是？", "a": ["视图可隐藏敏感数据提高安全性", "所有视图都能执行INSERT、UPDATE、DELETE", "视图是虚拟表，数据不实际存储", "视图可基于多个基本表创建", "", ""], "r": "B", "e": "并非所有视图都能执行INSERT、UPDATE、DELETE操作，有一些复杂视图因数据来源等问题不支持这些操作。A选项视图能隐藏敏感数据提升安全性；C选项视图是虚拟表不实际存储数据；D选项视图可基于多个基本表创建。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241673", "t": 1, "q": "关于数据库触发器，正确的是？", "a": ["触发器可访问其他表实现复杂规则", "触发器只能在操作前触发", "一个表只能建一个触发器", "触发器可主动调用", "", ""], "r": "A", "e": "触发器能访问其他表以实现复杂业务规则；它可在操作前或后触发；一个表能建多个不同类型触发器；触发器是在特定事件发生时自动执行，不可主动调用。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241674", "t": 1, "q": "关于数据库索引，正确的是？", "a": ["频繁更新的列上建索引可提高更新效率", "复合索引需包含前导列才可能被使用", "主键列自动创建聚簇索引", "索引能加快所有查询速度", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241675", "t": 1, "q": "关于数据库完整性约束，错误的是？", "a": ["UNIQUE约束允许列值为NULL，但可以有多个NULL值", "外键约束中，外键列值需在参照表主键列中存在（除非为NULL）", "CHECK约束可限制列值范围，如CHECK(age>0)", "主键约束同时保证实体完整性和唯一性", "", ""], "r": "A", "e": "在UNIQUE约束里，虽然允许列值为NULL，但只能有一个NULL值。所以A选项说法错误。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241676", "t": 1, "q": "关于SQL的GROUP BY，正确的是？", "a": ["GROUP BY后ORDER BY不能对聚合结果排序", "多列分组顺序不影响结果", "SELECT中非聚合列必须在GROUP BY中", "HAVING可单独使用，无需GROUP BY", "", ""], "r": "C", "e": "A选项，GROUP BY后ORDER BY可对聚合结果排序；B选项，多列分组顺序会影响结果；D选项，HAVING一般和GROUP BY配合使用，不能单独用。而SELECT中非聚合列必须在GROUP BY中。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241677", "t": 1, "q": "关于SQL子查询，错误的是？", "a": ["子查询可嵌套多层", "EXISTS判断子查询结果是否为空", "子查询作为FROM数据源无需括号", "相关子查询依赖外部查询值", "", ""], "r": "C", "e": "子查询作为FROM数据源是需要括号的，C选项说法错误；A选项子查询可多层嵌套；B选项EXISTS能判断子查询结果是否为空；D选项相关子查询依赖外部查询值。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241678", "t": 1, "q": "恢复时间最短的备份策略是？", "a": ["仅每日完整备份", "完整备份+每日差异备份", "完整备份+每日增量备份", "每日增量备份", "", ""], "r": "A", "e": "题目问的是“恢复时间最短”的备份策略，不是“备份时间最短”或“占用空间最小”。<br />A. 仅每日完整备份<br />每天都做完整备份，恢复时只需要最后一次完整备份，直接还原即可，恢复时间最短。<br />B. 完整备份 + 每日差异备份<br />恢复时需要最后一次完整备份 + 最后一次差异备份，比 A 多一步，恢复时间较长。<br />C. 完整备份 + 每日增量备份<br />恢复时需要最后一次完整备份 + 所有后续增量备份，步骤最多，恢复时间最长。<br />D. 每日增量备份<br />若没有完整备份作为基础，无法独立恢复；即使有周期完整备份，恢复时也要依次还原多个增量备份，恢复时间很长。", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241679", "t": 1, "q": "冷备份的特点是？", "a": ["备份事务日志", "备份时数据库可服务", "备份速度快", "备份需关库，不能读写", "", ""], "r": "D", "e": "冷备份需关闭数据库，期间数据库不能读写。A选项备份事务日志不是冷备份特点；B选项备份时数据库可服务是热备份特点；C选项冷备份涉及数据文件等全量备份，速度通常不如热备份。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241680", "t": 1, "q": "哪种备份只备份上次完整/差异备份后变化的数据，且不清除归档日志？", "a": ["差异备份", "事务日志备份", "完整备份", "增量备份", "", ""], "r": "D", "e": "增量备份是备份自上次完整备份或增量备份以来有变化的数据，且不清除归档日志。差异备份备份自上次完整备份以来变化的数据；事务日志备份主要备份事务日志；完整备份是备份整个数据库。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241681", "t": 1, "q": "事务T对数据X加S锁，其他事务对X可加的锁是？", "a": ["可加S锁和X锁", "只能加S锁，不能加X锁", "不能加任何锁", "只能加X锁，不能加S锁", "", ""], "r": "B", "e": "事务T对数据X加S锁（共享锁），其他事务可加S锁实现共享访问，但不能加X锁（排他锁），因为X锁会排斥其他锁。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241682", "t": 1, "q": "属于数据库物理结构设计任务的是？", "a": ["绘制ER图确定实体关系", "定义完整性约束", "将ER图转换为关系模式", "确定数据存储结构（如聚簇存储）", "", ""], "r": "D", "e": "数据库物理结构设计主要关注数据的物理存储，确定数据存储结构属于此范畴。A绘制ER图是概念结构设计；B定义完整性约束是逻辑结构设计一部分；C将ER图转换为关系模式也是逻辑结构设计。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241683", "t": 1, "q": "数据库概念结构设计输出是？", "a": ["关系模式", "ER图", "索引设计方案", "存储过程定义", "", ""], "r": "B", "e": "概念结构设计主要是对现实世界进行抽象，用E - R图描述数据及其联系。关系模式是逻辑结构设计的结果；索引设计方案属于物理设计；存储过程定义是数据库编程方面内容。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241684", "t": 1, "q": "数据库设计需求分析阶段的主要输出是？", "a": ["ER图", "数据字典和需求规格说明书", "物理结构设计说明书", "逻辑结构设计说明书", "", ""], "r": "B", "e": "需求分析阶段主要是了解用户需求，输出数据字典和需求规格说明书来描述系统需求。ER图是概念结构设计阶段产物；物理结构设计说明书是物理设计阶段输出；逻辑结构设计说明书是逻辑设计阶段输出。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241685", "t": 1, "q": "数据库系统的三级模式结构中，能够保证逻辑独立性的是哪两级模式间的映像？", "a": ["外模式与模式", "外模式与内模式", "模式与内模式", "子模式与物理模式", "", ""], "r": "A", "e": "外模式与模式间的映像能保证逻辑独立性，当模式改变时，通过修改外模式与模式间的映像，可让外模式和应用程序保持不变。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241686", "t": 1, "q": "数据字典的主要作用是？", "a": ["加快查询速度", "描述数据库结构和约束", "实现并发控制", "存储用户数据", "", ""], "r": "B", "e": "数据字典是对数据库中各类数据描述的集合，用于描述数据库结构和相关约束。A选项加快查询速度靠索引等；C选项并发控制通过事务管理机制；D选项存储用户数据是数据库表等的功能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241687", "t": 1, "q": "下列关于数据库\"视图\"的更新限制，说法错误的是？", "a": ["包含WHERE子句筛选条件的视图可能可更新", "包含DISTINCT关键字的视图不可更新", "基于聚合函数（如SUM、AVG）的视图不可更新", "基于多表连接的视图一定不可更新", "", ""], "r": "D", "e": "基于多表连接的视图不一定不可更新，满足一定条件时是可以更新的，A、B、C选项说法正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241688", "t": 1, "q": "下列关于数据库并发控制隔离级别的说法，错误的是？", "a": ["串行化（Serializable）隔离级别可解决所有并发问题，并发效率最高", "读未提交（Read Uncommitted）隔离级别存在脏读、不可重复读、幻影读问题", "可重复读（Repeatable Read）隔离级别可解决不可重复读，但仍然可能存在幻影读", "读已提交（Read Committed）隔离级别可以防止脏读，但仍然可能出现不可重复读和幻影读", "", ""], "r": "A", "e": "串行化能解决所有并发问题，但它要求事务串行执行，并发效率最低，并非最高。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241689", "t": 1, "q": "下列关于数据库对象的说法中，错误的是？", "a": ["索引会降低数据库的写入操作（INSERT、UPDATE、DELETE）效率，对读取操作无影响", "存储过程是预编译的SQL语句集合，可提高执行效率，降低网络传输量", "触发器是一种特殊的存储过程，由特定事件（如INSERT、UPDATE）触发执行", "视图是虚拟表，不存储实际数据，其数据来源于基表", "", ""], "r": "A", "e": "索引会提高读取操作效率，但会降低写入操作效率，A说对读取操作无影响错误；B、C、D表述均正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241690", "t": 1, "q": "下列关于数据库日志的说法中，错误的是？", "a": ["事务提交后，其对应的日志记录会被写入磁盘", "事务日志通常按顺序写入，可提高写入效率", "事务日志可用于数据库恢复，如前滚未提交事务、回滚已提交事务", "事务日志记录了数据库中所有事务的操作（如INSERT、UPDATE、DELETE）", "", ""], "r": "C", "e": "事务日志用于数据库恢复时是前滚已提交事务、回滚未提交事务，C选项说法错误。A选项事务提交后日志记录会写磁盘；B选项日志顺序写入能提高效率；D选项日志会记录事务操作。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241691", "t": 1, "q": "下列SQL语句中，能够正确查询\"学生表（学号，姓名，性别，年龄）\"中年龄大于20且性别为\"男\"的学生姓名，且按年龄降序排列的是？", "a": ["SELECT 姓名 FROM 学生表 WHERE 年龄>=20 AND 性别='男' ORDER BY 年龄 DESC;", "SELECT 姓名 FROM 学生表 WHERE 年龄>20 AND 性别='男' ORDER BY 年龄 ASC;", "SELECT 姓名 FROM 学生表 WHERE 年龄>20 AND 性别='男' ORDER BY 年龄 DESC;", "SELECT 姓名 FROM 学生表 WHERE 年龄>20 OR 性别='男' ORDER BY 年龄 DESC;", "", ""], "r": "C", "e": "题目要求查询年龄大于20且性别为男的学生姓名，按年龄降序排列。“且”用AND，“降序”用DESC 。A选项年龄条件是“>=20”不符；B选项“ASC”是升序不符；D选项“OR”是“或”关系不符。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241692", "t": 1, "q": "下列SQL语句中，能够正确创建\"课程表\"，且将\"课程号\"设为主键，\"学分\"字段取值范围为1-8的是？", "a": ["CREATE TABLE 课程表(课程号 CHAR(6), 课程名 VARCHAR(50), 学分 INT, PRIMARY KEY(课程号), CHECK(学分 > 1 AND 学分 < 8));", "CREATE TABLE 课程表(课程号 CHAR(6) PRIMARY KEY, 课程名 VARCHAR(50), 学分 INT CONSTRAINT CK_学分 CHECK(学分 IN (1,2,3,4,5,6,7,8)));", "CREATE TABLE 课程表(课程号 CHAR(6) PRIMARY KEY, 课程名 VARCHAR(50), 学分 INT CHECK(学分 BETWEEN 1 AND 8));", "CREATE TABLE 课程表(课程号 CHAR(6) PRIMARY KEY, 课程名 VARCHAR(50), 学分 INT WHERE 学分 >= 1 AND 学分 <= 8);", "", ""], "r": "C", "e": "A选项中CHECK条件“学分 > 1 AND 学分 < 8”不包含1和8；B选项用IN指定离散值不够简洁；D选项WHERE不能用于约束字段取值范围；C选项用BETWEEN 1 AND 8正确约束学分范围且设置了主键。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241693", "t": 1, "q": "下列SQL语句中，能够正确删除\"学生表\"中\"学号\"为\"2023001\"的记录的是？", "a": ["DELETE 学生表 WHERE 学号='2023001';", "DELETE FROM 学生表 WHERE 学号='2023001';", "TRUNCATE TABLE 学生表 WHERE 学号='2023001';", "DROP FROM 学生表 WHERE 学号='2023001';", "", ""], "r": "B", "e": "删除表中特定记录用“DELETE FROM 表名 WHERE 条件”语句。A 少了 FROM；C 的 TRUNCATE TABLE 用于清空整个表，不能加 WHERE 条件指定删除；D 语法错误，DROP 一般用于删除数据库、表等对象。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813767040241694", "t": 1, "q": "下列SQL语句中，能够正确修改\"职工表\"中\"部门号\"为\"01\"的职工的\"工资\"增加10%的是？", "a": ["UPDATE 职工表 SET 工资=工资*1.1 WHERE 部门号=01;", "UPDATE 职工表 SET 工资=工资*1.1 WHERE 部门号='01';", "UPDATE 职工表 SET 工资=工资+工资*10% WHERE 部门号=01;", "UPDATE 职工表 SET 工资=工资+10% WHERE 部门号='01';", "", ""], "r": "B", "e": "修改表数据用UPDATE语句，部门号通常为字符类型，需用单引号括起来；增加10%可写成工资*1.1 。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325248", "t": 2, "q": "关于数据库\"死锁\"的处理，下列说法正确的有（　）", "a": ["死锁一旦发生，必须终止所有涉及死锁的事务", "死锁预防比死锁检测更高效，应优先采用预防措施", "死锁检测可通过\"等待图\"实现，若等待图中存在回路，则判定为死锁", "死锁解决的常用方法是\"选择一个代价最小的事务进行回滚\"", "", ""], "r": "CD", "e": "死锁检测可利用等待图，有回路即判定死锁；解决死锁常选代价最小事务回滚。死锁发生不一定要终止所有涉事事务；死锁预防实施复杂，不一定比检测高效。答案：CD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325249", "t": 2, "q": "关于数据库完整性约束实施，正确的有（　）？", "a": ["参照完整性可通过触发器实施", "实体完整性由DBMS自动实施（如主键）", "CHECK约束在所有DBMS中完全支持", "外键与参照主键数据类型需一致", "", ""], "r": "ABD", "e": "A选项，触发器可用于实施参照完整性；B选项，DBMS会自动实施实体完整性，像主键就体现了这一点；C选项，不同DBMS对CHECK约束支持情况不同，并非所有都完全支持；D选项，外键与参照主键数据类型通常需一致。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325250", "t": 2, "q": "属于事务ACID特性的有（　）？", "a": ["持久性（Durability）", "一致性（Consistency）", "隔离性（Isolation）", "原子性（Atomicity）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325251", "t": 2, "q": "属于数据库恢复冗余数据的有（　）？", "a": ["视图定义", "事务日志", "数据字典", "索引文件", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325252", "t": 2, "q": "数据库备份类型中，\"日志备份\"的特点包括（　）", "a": ["日志备份必须在数据库处于\"完整恢复模式\"或\"大容量日志恢复模式\"下才能进行", "日志备份不应无限期累积，需要定期清理以避免占用过多存储空间", "日志备份的大小通常比完全备份小得多", "日志备份仅记录数据库的修改操作，不记录查询等读取操作", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325253", "t": 2, "q": "数据库备份与恢复中，\"点时间恢复（Point-in-Time Recovery）\"的实现条件包括（　）", "a": ["必须开启数据库的日志功能，记录事务操作", "数据库需支持事务日志的归档模式", "需有从完全备份到故障点的所有日志备份", "需有一个完整的完全备份", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325254", "t": 2, "q": "数据库对象\"索引\"的设计原则包括（　）", "a": ["对频繁用于WHERE条件、JOIN条件的列建立索引", "可对表的主键自动建立聚集索引", "对数据量小的表（如少于1000行）无需建立索引", "对包含大量重复值的列（如性别列）建立索引可显著提升查询效率", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325255", "t": 2, "q": "数据库完整性约束的作用包括（　）", "a": ["提高数据库的查询效率", "保证数据库中数据的唯一性（如主键不重复）", "保证数据库中数据的一致性（如外键引用的主键必须存在）", "防止数据库中出现不符合业务规则的数据（如年龄为负数）", "", ""], "r": "BCD", "e": "数据库完整性约束主要是为保证数据的准确性、一致性和有效性。B选项保证主键不重复体现唯一性；C选项外键引用规则保证数据一致性；D选项防止出现不符合业务规则数据保证数据有效性。而完整性约束与提高查询效率无关。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325256", "t": 2, "q": "数据库完整性约束中，\"触发器（Trigger）\"的作用包括（　）", "a": ["实现复杂的完整性检查（如跨表数据验证）", "在数据插入、更新、删除时触发执行", "替代主键约束和外键约束", "防止未授权用户修改数据", "", ""], "r": "AB", "e": "触发器可在数据插入、更新、删除时触发执行，能实现复杂的完整性检查如跨表数据验证。但它不能替代主键和外键约束，也主要不是用于防止未授权用户修改数据。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325257", "t": 2, "q": "数据库完整性中的\"域完整性\"可通过下列哪些约束实现（　）", "a": ["检查约束（CHECK）", "默认值约束（DEFAULT）", "外键约束（FOREIGN KEY）", "非空约束（NOT NULL）", "", ""], "r": "ABD", "e": "域完整性是指数据库表中的列必须满足某种特定的数据类型或约束。检查约束可限定列值范围；默认值约束能为列提供默认值；非空约束确保列值不为空，这三种都可实现域完整性。外键约束主要用于维护表间引用关系，与域完整性无关。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325258", "t": 2, "q": "数据库系统性能优化的措施包括（　）", "a": ["将频繁关联查询的小表与大表合并，减少JOIN操作", "对大表进行分区（如按时间分区），减少查询扫描的数据量", "避免在WHERE条件中使用函数操作索引列（如WHERE SUBSTRING(学号,1,2)='01'）", "定期更新数据库的统计信息，帮助查询优化器生成最优执行计划", "", ""], "r": "BCD", "e": "A选项合并表可能带来数据冗余、维护困难等问题，不是常规优化手段；B对大表分区可减少扫描量；C在索引列用函数会让索引失效；D更新统计信息能助查询优化器生成好的执行计划。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813767862325259", "t": 2, "q": "数据库系统中，“查询优化器”的作用包括（　）", "a": ["选择代价最小的执行计划执行查询", "分析SQL查询语句的语法正确性", "将SQL语句转换为关系代数表达式", "生成多个可能的查询执行计划", "", ""], "r": "AD", "e": "查询优化器主要工作是生成多个可能执行计划并选择代价最小的执行，A和D符合其作用。B分析语法正确性不是查询优化器职责，C将SQL语句转换为关系代数表达式一般是解析器工作。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693120", "t": 3, "q": "3NF范式要求关系模式中不存在非主属性对主键的传递函数依赖，而BCNF范式要求不存在任何属性对主键的传递函数依赖（包括主属性）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693121", "t": 3, "q": "表创建后无法添加完整性约束，只能重新建表。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "表创建后可以添加完整性约束，无需重新建表，如使用 ALTER TABLE 语句就能添加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693122", "t": 3, "q": "表中列越多、索引越多，查询效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "表的列越多，数据量可能越大，处理更复杂；索引虽能加快查询，但过多索引会增加维护成本，占用更多空间，还可能降低插入、更新、删除操作效率，且查询时优化器选择合适索引也更困难，不一定提高查询效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693123", "t": 3, "q": "并发操作中的\"不可重复读\"问题是指同一事务多次读取同一数据，其他事务在两次读取之间删除了该数据，导致第二次读取不到。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“不可重复读”主要是指同一事务多次读取同一数据时，其他事务对该数据进行了更新操作，导致事务前后两次读取的数据不一致，而不是其他事务删除该数据。所以此说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693124", "t": 3, "q": "并发操作中的\"丢失修改\"问题可以通过对数据加排他锁（X锁）来解决，确保同一时间只有一个事务能修改数据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "排他锁（X锁）会阻止其他事务对加锁数据进行读写操作，同一时间只有持有X锁的事务能修改数据，可避免并发操作中“丢失修改”问题。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693125", "t": 3, "q": "并运算要求两关系属性个数、顺序、数据类型完全一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693126", "t": 3, "q": "参照完整性约束中，外键字段的值可以为空，但如果不为空，则必须等于参照表中主键字段的某个值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "参照完整性规则规定，外键可以取空值，若不为空，其值必须是被参照表中主键的有效值。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693127", "t": 3, "q": "差异备份依赖上次完全备份，而非上次差异备份，备份其间变化的数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693128", "t": 3, "q": "存储过程预编译，执行时无需再次编译，效率高于单独执行SQL。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "存储过程会被预编译，执行时直接使用预编译结果，无需再次编译，避免了每次执行 SQL 都进行编译的开销，所以效率通常高于单独执行 SQL。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693129", "t": 3, "q": "存在传递依赖的关系模式不满足3NF，但可能满足2NF。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "3NF要求不存在非主属性对码的传递函数依赖，若存在传递依赖则不满足3NF；而2NF只要消除非主属性对码的部分函数依赖即可，存在传递依赖的关系模式可能已消除部分函数依赖，所以可能满足2NF。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693130", "t": 3, "q": "笛卡尔积运算结果集属性数是两关系属性数之和，行数是两关系行数之积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "笛卡尔积对两个关系进行操作，结果集的属性是将两关系属性拼接，所以属性数为两关系属性数之和；结果集行数为两关系中每行相互组合的数量，即行数之积。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693131", "t": 3, "q": "多列分组时，分组顺序影响结果，先按左列分组再按右列分组。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多列分组时，分组顺序确实会影响结果，一般是先按左列分组，再在左列分组基础上按右列分组。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693132", "t": 3, "q": "多行子查询返回多个值，用=、>等单值运算符会报错。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多行子查询返回多个值，而=、>等单值运算符只能处理单个值，使用它们与多行子查询搭配，会因无法适配多个值而报错。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693133", "t": 3, "q": "二级封锁协议要求事务在读取数据时加排他锁（X锁），在修改数据时加共享锁（S锁），并保持到事务结束，该协议可以防止脏读和丢失修改。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二级封锁协议是读取数据时加共享锁（S锁），读完释放；修改数据时加排他锁（X锁），保持到事务结束，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693134", "t": 3, "q": "父表主键删除或修改时，子表有引用记录则数据库必阻止，无法通过级联规则解决。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。当父表主键删除或修改，子表有引用记录时，可通过级联规则（如级联删除、级联更新）来处理，并非一定会被数据库阻止。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693135", "t": 3, "q": "复合主键中的每个属性都可取NULL值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "复合主键是多个属性的组合来唯一标识表中的记录，主键的属性不能取NULL值，因为NULL值无法保证记录的唯一性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693136", "t": 3, "q": "概念结构设计阶段产生的ER图不依赖具体DBMS。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "概念结构设计是独立于数据库逻辑结构和具体DBMS的，ER图是概念结构设计的主要工具，所以它不依赖具体DBMS。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693137", "t": 3, "q": "关系代数中的\"交运算\"的结果关系的元组数量一定小于等于参与运算的两个关系中元组数量较少的那个。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "交运算结果是两个关系中共同的元组，所以其元组数量必然小于等于参与运算两关系中数量较少的那个。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693138", "t": 3, "q": "关系代数中的\"投影运算\"会从关系中选择部分属性，其结果关系的元组数量可能与原关系相同（若无重复行）或少于原关系（若有重复行）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "投影运算是从关系中选取部分属性列组成新关系。投影操作不改变元组的数量（不考虑重复行时），若有重复行，投影后会去除重复行，元组数量会减少。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693139", "t": 3, "q": "关系代数中的\"选择运算\"是从关系中筛选出满足条件的元组，其结果关系的属性数量与原关系相同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "选择运算是按条件从关系中选取满足条件的元组，不改变关系的属性，所以结果关系属性数量和原关系相同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693140", "t": 3, "q": "关系模式满足BCNF范式后，其所有函数依赖都是平凡函数依赖（即右边属性是左边属性的子集）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BCNF范式要求每一个非平凡的函数依赖的左边都必须是候选键，而不是所有函数依赖都是平凡函数依赖。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693141", "t": 3, "q": "关系模式R（A,B,C），F={A→B,A→C,B→C}，候选键是A和B。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据候选键定义，能唯一决定所有属性的最小属性集为候选键。A可决定B和C，能唯一决定所有属性且无多余属性，是候选键；而B不能决定A，所以B不是候选键。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693142", "t": 3, "q": "关系模式R(A,B,C)中，若F={A→B,A→C,B→C}，则该关系模式满足3NF，因为不存在非主属性对主键的传递函数依赖。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "此关系模式主键是A，非主属性为B、C。虽不存在非主属性对主键的传递函数依赖，但存在非主属性间的传递依赖B→C，不满足3NF要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693143", "t": 3, "q": "函数依赖的自反律指出，若X→Y和Y→Z成立，则X→Z成立，该定律是函数依赖公理系统的基本定律之一。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "题干描述的是传递律，不是自反律。自反律是若Y⊆X⊆U，则X→Y。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693144", "t": 3, "q": "函数依赖A→B表示A值确定则B值唯一确定，A是决定因素，B是被决定因素。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在函数依赖中，若A→B，意味着当A的值确定时，B的值有且只有一个与之对应，A就是决定因素，B是被决定因素。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693145", "t": 3, "q": "函数依赖X→Y，Y→Z，且Y不包含X，Z不属于Y，则X→Z为传递函数依赖，存在传递函数依赖的关系模式不满足第三范式（3NF）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据传递函数依赖定义，若X→Y，Y→Z，Y不包含X，Z不属于Y，那X→Z是传递函数依赖。第三范式要求不存在非主属性对码的传递函数依赖，有传递函数依赖就不满足3NF。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693146", "t": 3, "q": "函数依赖X→Y中，若Y⊆X，则该依赖为平凡函数依赖，平凡函数依赖在任何关系中都必然成立。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据平凡函数依赖定义，若Y⊆X，那么X→Y就是平凡函数依赖，由于Y是X的子集，在任何关系里，X的值确定时Y的值自然确定，所以平凡函数依赖在任何关系中都必然成立。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693147", "t": 3, "q": "候选键可多个，主键是选定的候选键，两者均满足非空和唯一性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "候选键是能唯一标识元组的属性或属性组，可存在多个；主键是从候选键中选定的一个，它们都需满足非空和唯一性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693148", "t": 3, "q": "恢复仅依赖日志文件即可，无需备份副本。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "仅靠日志文件通常无法完整恢复数据，还需要备份副本，因为日志记录的是操作，备份副本才是数据的基础。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693149", "t": 3, "q": "聚簇索引的索引顺序与数据物理存储顺序一致，一个表只能有一个聚簇索引。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "聚簇索引特点就是索引顺序和数据物理存储顺序一致，且一张表的物理存储顺序只有一种，所以只能有一个聚簇索引。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693150", "t": 3, "q": "可串行化隔离级别能避免脏读、不可重复读、幻读。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "可串行化是最高的隔离级别，它通过对事务进行串行执行，能有效避免脏读、不可重复读和幻读问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693151", "t": 3, "q": "乐观锁通过版本号检测冲突，适用于读多写少场景。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "乐观锁常借助版本号机制检测数据是否在并发操作中发生冲突，读多写少场景下数据冲突概率低，使用乐观锁可减少加锁开销，提升性能，适合该场景。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693152", "t": 3, "q": "逻辑结构设计阶段将ER图转为具体DBMS支持的关系模式并优化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "逻辑结构设计阶段的主要任务就是把概念结构设计阶段得到的ER图转换为具体DBMS支持的关系模式，并且对这些关系模式进行优化。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693153", "t": 3, "q": "满足2NF的关系模式一定满足3NF。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "2NF消除了非主属性对码的部分函数依赖，3NF在此基础上还消除了非主属性对码的传递函数依赖，满足2NF不一定满足3NF。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693154", "t": 3, "q": "前滚撤销未提交修改，回滚重做已提交修改。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“前滚”通常用于推进操作，一般是重做已提交修改；“撤销”是取消未提交的修改；“回滚”是撤销已提交修改。所以该表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693155", "t": 3, "q": "热备份期间数据库只能读不能写。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热备份期间数据库可正常读写，不是只能读不能写。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693156", "t": 3, "q": "如果一个关系模式满足巴斯-科德范式（BCNF），则它必然满足第三范式（3NF），反之亦然。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "满足BCNF的关系模式一定满足3NF，但满足3NF不一定满足BCNF，二者不等价。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693157", "t": 3, "q": "事务的\"一致性\"是指事务执行前后，数据库的总数据量保持不变，即插入的数据量等于删除的数据量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "事务的一致性是指事务执行前后，数据库从一个一致状态转变到另一个一致状态，并非指数据库总数据量不变、插入量等于删除量。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693158", "t": 3, "q": "事务的\"原子性\"是指事务中的所有操作要么全部执行成功，要么全部执行失败并回滚，不存在部分执行的状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这道题说法正确。原子性是事务的基本特性之一，强调事务操作的不可分割，要么全做，要么全不做，不会出现部分执行的情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693159", "t": 3, "q": "事务的隔离级别越高，并发控制的效果越好，但数据库的并发性能越低。串行化隔离级别是最高的隔离级别，能避免所有并发问题，但并发性能最差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "事务隔离级别和并发控制、性能有明确关系，隔离级别高可更好避免并发问题，但会限制并发操作，串行化是最高隔离级别，可杜绝并发问题但严重影响并发性能。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693160", "t": 3, "q": "事务的隔离性是指多个事务并发执行时，每个事务的执行都不受其他事务的干扰，如同在单用户环境下执行一样。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "事务隔离性的定义就是多个事务并发执行时，各事务相互独立不受干扰，就像在单用户环境执行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693161", "t": 3, "q": "事务的一致性是指事务执行前后，数据库中的数据必须从一个一致状态转换到另一个一致状态，即数据满足所有完整性约束。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "事务一致性要求数据库在事务执行前后保持一致状态，数据符合完整性约束。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693162", "t": 3, "q": "事务的原子性是指事务一旦提交，对数据库的修改就永久保存，即使系统发生故障也不会丢失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该描述的是事务的持久性，而原子性是指事务是一个不可分割的工作单位，要么全部执行，要么全部不执行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693163", "t": 3, "q": "事务隔离级别中的\"可重复读\"隔离级别下，同一事务多次读取同一数据，即使其他事务修改并提交了该数据，读取结果仍保持一致。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“可重复读”隔离级别保证了在一个事务内多次读取同一数据时，不受其他事务修改并提交的影响，读取结果始终一致。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693164", "t": 3, "q": "事务原子性指事务出错时已执行操作全部撤销，回到初始状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "原子性是事务的基本特性之一，其核心就是事务要么全部执行成功，要么在出错时将已执行操作全部撤销，回到初始状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693165", "t": 3, "q": "视图存储定义，数据存储在基本表中，自身不存数据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "视图是虚拟表，它基于 SQL 语句从一个或多个基本表中导出，只存储定义，不存储实际数据，数据存于基本表。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693166", "t": 3, "q": "视图可基于其他视图创建，称为嵌套视图。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在数据库中，视图确实可以基于其他视图创建，这种基于其他视图创建的视图就是嵌套视图。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693167", "t": 3, "q": "视图上无法创建触发器，因视图不存储实际数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "视图虽不存储实际数据，但可以在视图上创建触发器，通过触发器可对视图关联的基表进行相应操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693168", "t": 3, "q": "数据库备份中的\"差异备份\"的备份时间比增量备份长，但恢复时间比增量备份短。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "差异备份是备份自上次完整备份后有变化的数据，增量备份是备份自上次备份（可以是完整、差异或增量备份）后有变化的数据。差异备份备份的数据量通常比增量备份大，所以备份时间长；恢复时差异备份只需完整备份和最近一次差异备份，而增量备份要完整备份和多次增量备份，所以差异备份恢复时间短。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693169", "t": 3, "q": "数据库备份中的\"完全备份\"包含了数据库的所有数据和日志信息，恢复时无需其他备份即可将数据库恢复到备份时的状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完全备份会对数据库的全部数据和日志信息进行备份，恢复时仅依靠该完全备份就能把数据库恢复到备份时刻的状态。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693170", "t": 3, "q": "数据库备份中的日志备份只能备份事务日志中的内容，不能备份数据库的数据文件，日志备份必须与完全备份配合使用才能恢复数据库到特定时间点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "日志备份主要针对事务日志，不备份数据文件，且单独的日志备份无法完成数据库恢复，需与完全备份配合来将数据库恢复到特定时间点。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693171", "t": 3, "q": "数据库备份中的增量备份是指备份自上一次完全备份以来数据库中发生变化的数据，差异备份是指备份自上一次备份（无论完全备份还是增量备份）以来发生变化的数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该描述与增量备份和差异备份的定义不符，增量备份是备份自上一次备份（可以是完全备份或增量备份）以来发生变化的数据，差异备份是备份自上一次完全备份以来数据库中发生变化的数据。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693172", "t": 3, "q": "数据库并发操作中的\"不可重复读\"问题是指一个事务多次查询同一数据集合，每次查询结果集的行数不同，因为其他事务插入或删除了数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。“不可重复读”主要指一个事务多次读取同一行数据时，由于其他事务对该行数据进行了更新操作，导致每次读取结果不同，而不是因为其他事务插入或删除数据使每次查询结果集行数不同（这是“幻读”）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693173", "t": 3, "q": "数据库并发控制中的\"意向锁\"是表级锁，用于表示事务对表中某些数据行有加锁意向，提高锁判断效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "意向锁是表级锁，它表明事务对表中某些数据行有加锁意向，能在判断锁冲突时提高效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693174", "t": 3, "q": "数据库并发控制中的一级封锁协议要求事务在读取数据时加共享锁（S锁），在修改数据时加排他锁（X锁），并保持到事务结束。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一级封锁协议是事务在修改数据前加排他锁（X锁），并保持到事务结束，读取数据时不需要加锁，题干描述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693175", "t": 3, "q": "数据库的逻辑独立性是指当数据库的物理存储结构（如存储设备、存储方式）发生改变时，应用程序无需修改即可正常运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。数据库的逻辑独立性是指用户的应用程序与数据库的逻辑结构相互独立，当数据库的逻辑结构改变时，应用程序不用改变。而题干描述的是物理独立性，即当数据库的物理存储结构发生改变时，应用程序无需修改即可正常运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693176", "t": 3, "q": "数据库的逻辑结构设计阶段的主要任务是将概念结构设计阶段得到的ER模型转换为符合特定数据库管理系统（如MySQL、Oracle）的关系模式，并优化关系模式。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据库逻辑结构设计就是把概念结构设计阶段的ER模型转成特定DBMS的关系模式，还要对关系模式进行优化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693177", "t": 3, "q": "数据库的内模式描述了数据库的物理存储结构和存储方法，如数据的存储文件、索引的组织方式等，用户无法直接访问内模式。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "内模式的确是描述数据库物理存储结构和存储方法的，像数据存储文件、索引组织方式等都属于其范畴，且内模式是面向数据库物理层的，用户不能直接访问。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693178", "t": 3, "q": "数据库的三级模式结构中，外模式是模式的子集，一个数据库可以有多个外模式，但只能有一个模式和一个内模式。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "外模式是用户视图，是模式的子集，不同用户有不同需求，所以一个数据库可有多个外模式；模式是对数据库整体逻辑结构的描述，内模式描述数据物理存储结构，它们都只有一个。", "ap": [false, false, false, false, false, false]}, {"id": "2034813770978693179", "t": 3, "q": "数据库故障中的\"介质故障\"（如磁盘损坏）是最严重的故障，此时需要恢复完全备份和所有后续的日志备份，才能恢复数据库。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "介质故障会破坏存储在磁盘上的数据，导致数据丢失，是严重故障。恢复时需先恢复完全备份，再应用后续日志备份来使数据库恢复到故障前状态。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 数据库系统（2）", "n": "基础练习题【含解析】 / 第2章 数据库系统（2）", "qs": [{"id": "2034813774518685696", "t": 1, "q": "下列SQL语句中，属于数据控制语言（DCL）的是？", "a": ["SELECT * FROM 学生表 WHERE 年龄>20;", "GRANT SELECT ON 学生表 TO 用户A;", "INSERT INTO 学生表 VALUES('2023001','张三');", "CREATE TABLE 学生表(学号 CHAR(10) PRIMARY KEY);", "", ""], "r": "B", "e": "数据控制语言（DCL）主要用于对数据库用户的权限进行管理。选项A是查询语句，属于数据查询语言（DQL）；选项C是插入语句，属于数据操纵语言（DML）；选项D是创建表语句，属于数据定义语言（DDL）；选项B是授予用户对表的查询权限，属于DCL。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685697", "t": 1, "q": "已知关系模式R(A,B,C,D)满足函数依赖F={A→B,B→C,C→D}，则R最高达到的范式级别是？", "a": ["第一范式（1NF）", "第三范式（3NF）", "第二范式（2NF）", "巴斯-科德范式（BCNF）", "", ""], "r": "C", "e": "根据给定的关系模式R(A,B,C,D)和函数依赖集F={A→B,B→C,C→D},判断其最高<br />范式级别如下：<br /> 1.求候选键：由A→B、B→C、C→D可推出A→B、A→C、A→D,即A能唯一决定所有属性，故候选键为A(单属性)16。主属性为A,非主属性为B,C,D。<br /> 2.判断2NF:由于候选键是单属性，不存在非主属性对候选键的部分函数依赖，因此满足2NF26。<br /> 3.判断3NF:存在传递依赖链A→B、B→C,且B不决定A,因此非主属性C传递依赖于A;同理A→C、C→D导致D传递依赖干A。存在非主属性对候选键的传递依赖，故不满足3NF。", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685698", "t": 1, "q": "已知关系模式R(U,F)，其中U={A,B,C,D}，F={AB→C,C→D,A→D}，则R的候选码是？", "a": ["BC", "AC", "ABD", "AB", "", ""], "r": "D", "e": "候选码能唯一确定关系中所有属性。根据函数依赖集F，AB能推出C（AB→C），C能推出D（C→D），所以AB可决定所有属性U。而其他选项不满足此特性。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685699", "t": 1, "q": "已知关系R(A,B)和S(B,C)，其中R的B字段和S的B字段为关联字段，下列关系代数运算中，与SQL语句\"SELECT A,C FROM R,S WHERE R.B=S.B;\"等价的是？", "a": ["π_A,C(R⋈_R.B=S.B S)", "R⋈S", "π_A,C(R×S)", "π_A,C(R∩S)", "", ""], "r": "A", "e": "SQL语句是从R和S中选取满足R.B = S.B条件的A和C列。A选项先进行条件连接（R⋈_R.B=S.B S），再投影出A和C列，符合要求；B选项未指定连接条件；C选项是笛卡尔积后投影，未加连接条件；D选项交集运算不符合需求。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685700", "t": 1, "q": "已知关系R和S的结构相同，R有10个元组，S有8个元组，其中5个元组在R和S中都存在，则R∪S的元组个数是？", "a": ["13", "18", "8", "10", "", ""], "r": "A", "e": "并集R∪S的元组个数为R的元组个数加上S的元组个数，再减去两者重复的元组个数，即10 + 8 - 5 = 13。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685701", "t": 1, "q": "已知SQL语句\"CREATE VIEW 男学生视图 AS SELECT 学号, 姓名 FROM 学生表 WHERE 性别='男' WITH CHECK OPTION;\"，下列操作中会被拒绝执行的是？", "a": ["修改该视图中某学生的姓名为\"张三\"", "向该视图插入一条性别为\"男\"的学生记录", "向该视图插入一条性别为\"女\"的学生记录", "删除该视图中某学生的记录", "", ""], "r": "C", "e": "WITH CHECK OPTION 会保证对视图的操作满足视图定义的条件，即性别为男。插入性别为女的记录不满足此条件会被拒绝。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685702", "t": 1, "q": "已知SQL语句\"SELECT 部门号, AVG(工资) AS 平均工资 FROM 职工表 GROUP BY 部门号 HAVING AVG(工资) > 5000;\"，该语句的执行顺序是？", "a": ["FROM→SELECT→GROUP BY→HAVING", "SELECT→FROM→GROUP BY→HAVING", "FROM→GROUP BY→HAVING→SELECT", "FROM→GROUP BY→SELECT→HAVING", "", ""], "r": "C", "e": "SQL语句执行顺序通常是先从FROM子句指定表，接着GROUP BY对数据分组，再用HAVING筛选分组结果，最后用SELECT输出结果。所以顺序是FROM→GROUP BY→HAVING→SELECT 。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685703", "t": 1, "q": "在并发控制中，若事务T1对数据A加了共享锁（S锁），则其他事务对数据A可以进行的操作是？", "a": ["加意向排他锁（IX锁），可以写A", "加排他锁（X锁），可以写A", "加共享锁（S锁），可以读A", "加意向共享锁（IS锁），可以读A", "", ""], "r": "C", "e": "共享锁（S锁）允许其他事务也加S锁进行读操作。IX锁、X锁与S锁不兼容，加IX锁不能写，加X锁会冲突；IS锁是表级锁，与本题对数据A加S锁的操作层面不匹配。答案：C ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685704", "t": 1, "q": "在关系代数中，设关系R有m个元组，关系S有n个元组，若对R和S进行\"并运算\"，则结果关系的元组数量范围是？", "a": ["max(m,n)≤结果元组数量≤m+n", "min(m,n)≤结果元组数量≤m+n", "0≤结果元组数量≤m+n", "0≤结果元组数量≤max(m,n)", "", ""], "r": "A", "e": "并运算结果元组数量最少时是R和S完全相同，此时为max(m,n)；最多时是R和S无重复元组，此时为m + n。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685705", "t": 1, "q": "在关系模式规范化过程中，消除\"部分函数依赖\"是将关系模式从哪一范式提升到哪一范式的关键？", "a": ["从BCNF提升到4NF", "从1NF提升到2NF", "从3NF提升到BCNF", "从2NF提升到3NF", "", ""], "r": "B", "e": "1NF消除部分函数依赖可达到2NF。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685706", "t": 1, "q": "在关系模式R(A,B,C,D)中，F={A→B,B→A,A→C}，则该关系模式的最高范式是？", "a": ["3NF", "BCNF", "4NF", "2NF", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685707", "t": 1, "q": "在关系模式R(U,F)中，U={A,B,C,D,E}，F={AB→C,C→D,D→E}，则该关系模式的候选键是？", "a": ["ABC", "ABE", "AB", "ABD", "", ""], "r": "C", "e": "候选键能决定所有属性。由F可知AB→C，C→D，D→E，即AB能推出U中所有属性。所以候选键是AB。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685708", "t": 1, "q": "在事务管理中，若一个事务执行了ROLLBACK操作，则该事务的状态会变为？", "a": ["部分提交状态（Partially Committed）", "中止状态（Aborted）", "提交状态（Committed）", "活跃状态（Active）", "", ""], "r": "B", "e": "ROLLBACK是回滚操作，会撤销事务已做的修改，使事务处于中止状态。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685709", "t": 1, "q": "在数据库备份策略中，\"仅备份自上一次完全备份以来发生变化的数据\"的备份类型是？", "a": ["完全备份", "日志备份", "增量备份", "差异备份", "", ""], "r": "C", "e": "增量备份只备份自上一次完全备份或增量备份以来发生变化的数据。完全备份是备份所有数据；日志备份备份事务日志；差异备份备份自上一次完全备份以来变化的数据。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685710", "t": 1, "q": "在数据库并发操作中，\"一个事务读取了另一个事务未提交的修改数据，之后该事务回滚，导致读取的数据无效\"的问题称为？", "a": ["不可重复读", "脏读", "丢失修改", "幻读", "", ""], "r": "B", "e": "脏读指一个事务读取了另一个事务未提交的数据，若后者回滚，前者读的数据就无效。不可重复读是同一事务多次读取结果不同；丢失修改是两个事务同时修改同一数据致部分修改丢失；幻读是事务读取某范围数据时，另一事务插入或删除数据，导致该事务后续读取有“幻觉”。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685711", "t": 1, "q": "在数据库三级模式结构中，能隔离外模式变更对模式影响、保证数据逻辑独立性的是哪一层映像？", "a": ["存储模式/内模式映像", "外模式/内模式映像", "外模式/模式映像", "模式/内模式映像", "", ""], "r": "C", "e": "外模式/模式映像定义了外模式与模式之间的对应关系，当外模式变更时，通过该映像可以保证模式不变，从而保证数据的逻辑独立性。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685712", "t": 1, "q": "在数据库三级模式结构中，能够保证数据库系统具有逻辑独立性的映像关系是？", "a": ["模式/内模式映像", "外模式/模式映像", "外模式/内模式映像", "子模式/模式映像", "", ""], "r": "B", "e": "外模式/模式映像保证了数据库系统的逻辑独立性，当模式改变时，通过调整外模式/模式映像，外模式可保持不变，应用程序不用修改。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685713", "t": 1, "q": "在数据库设计的需求分析阶段，主要输出的文档是？", "a": ["ER图", "数据库物理结构设计说明书", "关系模式", "数据字典", "", ""], "r": "D", "e": "需求分析阶段主要是收集和分析用户需求，数据字典是对数据的详细描述，是需求分析阶段的主要输出文档。ER图是概念设计阶段产物，数据库物理结构设计说明书是物理设计阶段的，关系模式是逻辑设计阶段的。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685714", "t": 1, "q": "在数据库事务隔离级别中，\"可避免脏读、不可重复读，但无法避免幻读\"的隔离级别是？", "a": ["读已提交（Read Committed）", "串行化（Serializable）", "可重复读（Repeatable Read）", "读未提交（Read Uncommitted）", "", ""], "r": "C", "e": "读未提交会有脏读、不可重复读和幻读问题；读已提交避免脏读，有不可重复读和幻读；可重复读避免脏读、不可重复读，有幻读；串行化可避免脏读、不可重复读和幻读。答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685715", "t": 1, "q": "在数据库索引中，下列关于B+树索引和哈希索引的对比，正确的是？", "a": ["哈希索引的查询效率高于B+树索引，无论数据量大小", "哈希索引适合用于排序操作，B+树索引不适合", "B+树索引支持范围查询，哈希索引不支持", "B+树索引需要顺序存储，哈希索引不需要", "", ""], "r": "C", "e": "哈希索引通过哈希函数定位数据，不适合范围查询；B+树索引是有序结构，支持范围查询。A选项，数据量小哈希索引有优势，大数据量B+树更优；B选项，哈希索引无序不适合排序，B+树适合；D选项，B+树不要求顺序存储。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685716", "t": 1, "q": "在数据库完整性约束中，\"职工表（职工号，姓名，部门号）\"中\"部门号\"引用\"部门表（部门号，部门名）\"的\"部门号\"，这种约束属于？", "a": ["实体完整性约束", "用户定义完整性约束", "域完整性约束", "参照完整性约束", "", ""], "r": "D", "e": "“职工表”的“部门号”引用“部门表”的“部门号”，是一个表的外键引用另一个表的主键，这符合参照完整性约束的定义。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685717", "t": 1, "q": "在数据库物理结构设计中，下列不属于物理结构设计内容的是？", "a": ["确定数据的存取路径", "确定索引的类型和位置", "确定数据的存储结构（如堆文件、索引文件）", "确定关系模式的主键和外键", "", ""], "r": "D", "e": "物理结构设计主要关注数据在存储设备上的存储方式和存取路径等。确定关系模式的主键和外键属于数据库逻辑结构设计范畴，而A、B、C选项都是物理结构设计内容。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685718", "t": 1, "q": "在数据库物理设计中，\"聚集索引\"和\"非聚集索引\"的主要区别是？", "a": ["聚集索引的叶节点存储数据本身，非聚集索引的叶节点存储指向数据的指针", "聚集索引适合用于频繁更新的列，非聚集索引适合用于频繁查询的列", "聚集索引在某些情况下可能比非聚集索引提供更快的数据访问速度", "一个表可以有多个聚集索引和多个非聚集索引", "", ""], "r": "A", "e": "聚集索引叶节点存数据本身，非聚集索引叶节点存指向数据的指针；频繁更新列用非聚集索引更合适；通常聚集索引数据访问更快；一个表只能有一个聚集索引，可多个非聚集索引。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685719", "t": 1, "q": "在E-R模型中，若实体\"学生\"与实体\"课程\"之间存在\"选课\"联系，且一个学生可选多门课程，一门课程可被多个学生选，同时每个学生选每门课程有且只有一个成绩，则该联系的类型是？", "a": ["多对多", "一对一", "一对多", "多对一", "", ""], "r": "A", "e": "两个实体集间联系，一个学生可选多门课，一门课可被多个学生选，符合多对多联系特征。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685720", "t": 1, "q": "在E-R模型转换为关系模式时，若实体A与实体B存在\"一对一\"联系，且联系有属性\"创建时间\"，则正确的转换方式是？", "a": ["将联系属性\"创建时间\"添加到实体B的关系模式中，实体A的关系模式不变", "将联系属性\"创建时间\"添加到实体A的关系模式中，实体B的关系模式不变", "将实体A的主键作为外键加入实体B的关系模式，并添加\"创建时间\";或反之", "单独创建一个关系模式，包含A和B的主键及\"创建时间\"", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685721", "t": 1, "q": "在SQL中，要查询\"课程表\"（课程号、课程名、学分）和\"选课表\"（学号、课程号、成绩），找出\"选修了所有学分大于3的课程的学生学号\"，下列查询思路正确的是？", "a": ["用JOIN连接两表后，直接筛选学分>3的学号", "用EXISTS子查询判断学生选修的课程是否包含所有学分>3的课程", "用GROUP BY分组后，通过COUNT(*)等于学分>3课程总数筛选学号", "用IN子查询筛选选修学分>3课程的学号", "", ""], "r": "B", "e": "本题的关键在于找出选修了所有学分大于3的课程的学生学号。 选项A：直接筛选学分>3的学号，只能得到选修了学分大于3课程的学生学号，不能保证选修了所有学分大于3的课程，所以A错误。 选项B：使用EXISTS子查询可以判断对于每个学生，是否选修了所有学分大于3的课程，该思路正确。 选项C：仅通过COUNT(*)等于学分>3课程总数筛选学号，可能存在重复选课的情况，不能准确判断是否选修了所有学分大于3的课程，所以C错误。 选项D：IN子查询筛选出的是选修了学分大于3课程的学号，不能保证选修了所有学分大于3的课程，所以D错误。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685722", "t": 1, "q": "在SQL中，要查询\"学生表\"中\"年龄最大的前5名学生的姓名和年龄\"，正确的语句是？", "a": ["SELECT 姓名, 年龄 FROM (SELECT 姓名, 年龄 FROM 学生表 ORDER BY 年龄 DESC) WHERE ROWNUM <= 5;", "SELECT 姓名, 年龄 FROM 学生表 ORDER BY 年龄 DESC WHERE ROWNUM <= 5;", "SELECT 姓名, 年龄 FROM 学生表 ORDER BY 年龄 DESC LIMIT 5;", "SELECT TOP 5 姓名, 年龄 FROM 学生表 ORDER BY 年龄 DESC;", "", ""], "r": "A", "e": "B选项中`WHERE`子句应在`ORDER BY`之前；C选项`LIMIT`是MySQL语法，不是标准SQL；D选项`SELECT TOP`是SQL Server语法，不是标准SQL。A选项先按年龄降序排序，再取前5条记录，符合要求。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685723", "t": 1, "q": "在SQL中，要查询员工表（　）中部门编号（deptno）为20，且工资（sal）高于本部门平均工资的员工姓名（ename），正确语句是？", "a": ["SELECT ename FROM emp WHERE deptno=20 AND sal>(SELECT AVG(sal)FROM emp);", "SELECT ename FROM emp e1 WHERE deptno=20 AND sal>(SELECT AVG(sal)FROM emp e2 WHERE e2.deptno=e1.deptno);", "SELECT ename FROM emp WHERE deptno=20 AND sal>AVG(sal);", "SELECT ename FROM emp WHERE deptno=20 AND sal>(SELECT AVG(sal)FROM emp WHERE deptno=20);", "", ""], "r": "B", "e": "本题要求查询部门编号为20且工资高于本部门平均工资的员工姓名。A选项子查询求的是全量员工平均工资，不符合要求；C选项直接用AVG(sal)会报错，不能这样直接使用聚合函数；D选项虽然限定了部门编号为20，但没有关联主表记录，不能准确对比每个员工和本部门平均工资。B选项通过关联子查询，确保每个员工和本部门平均工资对比。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685724", "t": 1, "q": "在SQL中，要创建一个\"学生表\"，要求\"学号\"为主键，\"姓名\"非空，\"年龄\"在15-30之间，\"性别\"只能是\"男\"或\"女\"，下列创建语句正确的是？", "a": ["CREATE TABLE 学生表(学号 INT PRIMARY KEY, 姓名 VARCHAR(20) NOT NULL, 年龄 INT, 性别 VARCHAR(2), CONSTRAINT CK_年龄 CHECK(年龄 BETWEEN 15 AND 30), CONSTRAINT CK_性别 CHECK(性别 IN('男','女')));", "CREATE TABLE 学生表(学号 INT PRIMARY KEY, 姓名 VARCHAR(20) NOT NULL, 年龄 INT CHECK(年龄 BETWEEN 15 AND 30), 性别 VARCHAR(2) CHECK(性别 IN('男','女')));", "CREATE TABLE 学生表(学号 INT PRIMARY KEY, 姓名 VARCHAR(20) NOT NULL, 年龄 INT CHECK(年龄 > 15 AND 年龄 < 30), 性别 VARCHAR(2) CHECK(性别 = '男' OR 性别 = '女'));", "CREATE TABLE 学生表(学号 INT PRIMARY KEY, 姓名 VARCHAR(20) NOT NULL, 年龄 INT CONSTRAINT CK_年龄 CHECK(年龄 BETWEEN 15 AND 30), 性别 VARCHAR(2) CONSTRAINT CK_性别 CHECK(性别 IN('男','女')));", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685725", "t": 1, "q": "自然连接与等值连接的区别是？", "a": ["自然连接无需连接条件，等值连接需要", "自然连接去重列，等值连接不去重", "自然连接只能基于一列，等值连接可多列", "自然连接结果行数少", "", ""], "r": "B", "e": "自然连接是一种特殊的等值连接，它要求连接属性值相等且会去除重复列，等值连接不会去除重复列。A选项自然连接也需连接条件；C选项自然连接和等值连接都可基于多列；D选项自然连接结果行数不一定少。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685726", "t": 1, "q": "ER图向关系模式转换，正确的是？", "a": ["m:n联系保留任意一端码作外键", "1:n联系将n端码加入1端关系", "实体型转关系模式，属性作列，码作主键", "1:1联系只能转独立关系模式", "", ""], "r": "C", "e": "实体型转换为关系模式时，实体的属性就是关系的列，实体的码就是关系的主键；m:n联系要单独创建关系模式，两端码都作外键；1:n联系是将1端码加入n端关系；1:1联系可转成独立关系模式，也可与任意一端合并。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813774518685727", "t": 1, "q": "MySQL中删除表dept且表不存在不报错，正确语句是？", "a": ["DELETE TABLE IF EXISTS dept;", "DROP TABLE dept;", "DROP TABLE IF EXISTS dept;", "DELETE TABLE dept;", "", ""], "r": "C", "e": "在 MySQL 里，删除表用“DROP TABLE”，“DELETE”主要用于删除表中的数据；“IF EXISTS”可让表不存在时不报错。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656704", "t": 2, "q": "下列关于关系代数\"除运算\"的说法，正确的有（　）", "a": ["设关系R÷S，结果关系的属性是R中除去与S相同属性后的剩余属性", "除运算适用于查询\"包含另一个关系所有元组\"的场景", "除运算的结果元组数量一定小于或等于R的元组数量", "除运算的结果元组需满足:其与S中所有元组组合后均在R中", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656705", "t": 2, "q": "下列关于关系代数运算的表述中，正确的是（　）？", "a": ["选择运算会改变关系的属性个数但不改变元组个数", "投影运算会改变关系的元组个数和属性个数", "笛卡尔积运算的结果关系属性个数为两个关系属性个数之和", "差运算的结果关系包含所有属于第一个关系但不属于第二个关系的元组", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656706", "t": 2, "q": "下列关于函数依赖公律系统的说法中，正确的是？（　）", "a": ["自反律: 若Y⊆X⊆U，则X→Y成立", "合并规则: 若X→Y、X→Z成立，则X→YZ成立", "增广律: 若X→Y成立，则对于任何Z⊆U，有XZ→YZ成立", "分解规则: 若X→YZ成立，则X→Y、X→Z成立", "", ""], "r": "ABCD", "e": "函数依赖公理系统中，自反律、合并规则、增广律、分解规则表述均正确。ABCD四个选项分别对应这四个规则的正确表述。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656707", "t": 2, "q": "下列关于事务ACID特性的说法中，错误的是（　）？", "a": ["原子性（Atomicity）指事务中的操作要么全部执行，要么全部不执行", "持久性（Durability）指事务一旦提交，对数据库的修改就永久保存，即使系统故障也不会丢失", "隔离性（Isolation）指多个事务并发执行时，一个事务的执行不会影响其他事务", "隔离性可以完全避免并发事务之间的相互干扰", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656708", "t": 2, "q": "下列关于数据库\"事务日志\"的说法，正确的有（　）", "a": ["在数据库恢复时，事务日志用于重做已提交的事务，撤销未提交的事务", "开启事务日志归档模式后，日志文件满时会自动归档，不会覆盖旧记录", "事务日志通常以循环方式写入，当日志文件满时，会覆盖旧的日志记录", "事务日志必须与数据库数据文件存储在同一磁盘上，以保证同步写入", "", ""], "r": "ABC", "e": "事务日志可用于数据库恢复时重做已提交事务、撤销未提交事务；一般事务日志以循环方式写入，满了会覆盖旧记录；开启归档模式，日志满时自动归档不覆盖旧记录；事务日志和数据文件不一定要存同一磁盘。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656709", "t": 2, "q": "下列关于数据库备份与恢复的说法中，正确的是（　）？", "a": ["增量备份的备份数据量小，备份时间短", "完全备份恢复时无需其他备份文件，恢复速度快", "差异备份恢复时，需先恢复最近的完全备份，再恢复最近的差异备份", "日志备份必须与完全备份配合使用才能完成数据库恢复", "", ""], "r": "ABCD", "e": "增量备份只备份自上次备份后改变的数据，数据量小、时间短；完全备份包含所有数据，恢复时无需其他备份且速度快；差异备份恢复需先恢复最近完全备份再恢复差异备份；日志备份可单独用于恢复事务，不一定要与完全备份配合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656710", "t": 2, "q": "下列关于数据库并发控制的说法中，正确的是（　）？", "a": ["三级封锁协议可防止幻读", "共享锁（S锁）与排他锁（X锁）之间不存在兼容性", "两段锁协议是保证并发调度可串行化的充分条件", "一级封锁协议可防止丢失修改", "", ""], "r": "CD", "e": "逐一分析各选项： A项，三级封锁协议可防止丢失修改、不可重复读和读“脏”数据，但不能防止幻读，A错误。 B项，共享锁（S锁）与排他锁（X锁）不兼容，但S锁之间是兼容的，B错误。 C项，两段锁协议是保证并发调度可串行化的充分条件，C正确。 D项，一级封锁协议可防止丢失修改，D正确。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656711", "t": 2, "q": "下列关于数据库完整性的说法中，正确的是（　）？", "a": ["用户定义完整性约束可以通过CHECK、DEFAULT等约束实现", "实体完整性约束要求主键字段的值非空且唯一", "参照完整性约束允许外键字段的值等于参照表中非主键字段的值", "参照完整性约束要求外键字段的值要么为空，要么等于参照表中主键的某个值", "", ""], "r": "ABD", "e": "A选项，用户定义完整性可通过CHECK、DEFAULT等约束实现；B选项，实体完整性要求主键非空且唯一；D选项，参照完整性要求外键值要么为空，要么等于参照表主键某值。C选项，外键应参照主键，而非非主键字段。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656712", "t": 2, "q": "下列关于E-R模型中\"实体集\"与\"属性\"的区分，正确的有（　）", "a": ["实体集之间存在联系，属性与实体集之间仅存在\"属于\"关系", "属性必须是单值的，若某概念是多值的（如学生的\"爱好\"），则其应为实体集", "同一概念在不同场景下，可能是实体集也可能是属性（如\"学校\"在学生管理系统中是实体集，在成绩查询系统中可能是属性）", "若某概念需进一步描述其特征（即有属性），则该概念应为实体集，而非属性", "", ""], "r": "ACD", "e": "A选项，实体集间有联系，属性属于实体集，说法正确；B选项，多值属性可通过一定方式处理，不一定就变成实体集；C选项，同一概念在不同场景角色可变，正确；D选项，有属性需进一步描述的概念通常是实体集，正确。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656713", "t": 2, "q": "下列关于ER模型向关系模式转换的说法中，正确的是（　）？", "a": ["一个多对多（M:N）联系必须转换为一个独立的关系模式，联系的属性和双方实体的主键作为该关系的属性，且双方实体主键的组合作为该关系的主键", "一个实体型转换为一个关系模式，实体的属性即为关系的属性，实体的主键即为关系的主键", "一个多对多（M:N）联系可以合并到任意一方的关系模式中，无需创建独立关系模式", "一个一对一（1:1）联系可以转换为一个独立的关系模式，也可以合并到任意一方的关系模式中", "", ""], "r": "ABD", "e": "多对多联系必须转成独立关系模式，A对C错；实体型转关系模式，属性和主键对应转换，B对；一对一联系可独立成关系模式，也能合并到任一方，D对。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656714", "t": 2, "q": "下列SQL语句中，属于DML（数据操纵语言）的有（　）", "a": ["SELECT", "UPDATE", "CREATE", "DELETE", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656715", "t": 2, "q": "已知关系模式R(A,B,C)，F={A→B,A→C}，则下列关于R的说法中，正确的是（　）？", "a": ["R的非主属性是B和C", "R存在部分函数依赖", "R不存在传递函数依赖", "R的候选码是A", "", ""], "r": "ACD", "e": "本题可根据候选码、非主属性、部分函数依赖和传递函数依赖的定义来逐一分析。### 选项A在关系模式R(A,B,C)中，由于A能决定B和C，即A能唯一确定整个元组，所以A是候选码。包含在任何一个候选码中的属性为主属性，不包含在任何候选码中的属性为非主属性，因此A是主属性，B和C是非主属性，该选项正确。### 选项B部分函数依赖是指在一个关系中，若X→Y，且存在X的真子集X'，使得X'→Y，则称Y对X部分函数依赖。在「test/yiwen_img/importSubject/2034813772174069760.png」中，A是单个属性，不存在真子集，所以不存在部分函数依赖，该选项错误。 ### 选项C传递函数依赖是指在关系模式R(U)中，设X，Y，Z是U的不同的属性子集，如果X→Y（「test/yiwen_img/importSubject/2034813772429922304.png」），Y→Z，且「test/yiwen_img/importSubject/2034813772509614080.png」，「test/yiwen_img/importSubject/2034813772585111552.png」，则称Z对X传递函数依赖。在给定的函数依赖集F中，不存在这样的传递关系，所以不存在传递函数依赖，该选项正确。### 选项D候选码是能够唯一确定关系中所有属性的最小属性集。因为A能决定B和C，且A的任何真子集都不能决定B和C，所以A是候选码，该选项正确。综上，答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813777043656716", "t": 2, "q": "SQL中的\"子查询\"按返回结果行数分类，包括（　）", "a": ["相关子查询（子查询依赖外部查询的值）", "单列子查询（返回单列）", "单行子查询（返回0或1行）", "多行子查询（返回多行）", "", ""], "r": "CD", "e": "按返回结果行数分类，子查询分为单行子查询（返回0或1行）和多行子查询（返回多行）。A选项相关子查询是按子查询与外部查询关系分类；B选项单列子查询是按列数分类。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575808", "t": 3, "q": "数据库恢复的\"完全恢复\"是指将数据库恢复到故障发生前的所有已提交事务的状态，不包括未提交事务的修改。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完全恢复就是把数据库恢复到故障前已提交事务的状态，会忽略未提交事务的修改，避免数据不一致。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575809", "t": 3, "q": "数据库恢复中的\"UNDO\"操作是根据日志文件，将未提交事务对数据库的修改撤销，使数据库回到事务开始前的状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“UNDO”操作就是依据日志文件，对未提交事务在数据库里的修改进行撤销，让数据库恢复到事务开始前的状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575810", "t": 3, "q": "数据库日志文件主要记录事务的开始、结束以及事务对数据库的所有修改操作，日志文件是数据库恢复的重要依据。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据库日志文件会记录事务的相关信息，包括开始、结束以及对数据库的修改操作，这些记录是进行数据库恢复的关键依据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575811", "t": 3, "q": "数据库三级模式结构中的\"模式\"是数据库中全体数据的物理存储结构和存储方法的描述。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“模式”是数据库中全体数据的逻辑结构和特征的描述，而数据库中全体数据的物理存储结构和存储方法的描述是“内模式”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575812", "t": 3, "q": "数据库设计的\"物理结构设计\"阶段需要根据具体的数据库管理系统（DBMS）特性，调整关系模式，使其更适合DBMS的存储和查询优化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据库物理结构设计就是要为逻辑数据模型选取一个最适合应用环境的物理结构，会依据具体DBMS特性对关系模式等进行调整以适配存储与查询优化。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575813", "t": 3, "q": "数据库设计的概念结构设计阶段的主要任务是将需求分析阶段得到的用户需求转换为具体的关系模式。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "概念结构设计阶段是将需求分析得到的用户需求抽象为信息结构，即概念模型，而将其转换为具体关系模式是逻辑结构设计阶段的任务。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575814", "t": 3, "q": "数据库死锁的\"持有并等待\"条件是指事务持有部分资源的同时，等待其他事务持有的资源，破坏该条件的方法是要求事务一次性申请所有所需资源。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“持有并等待”就是事务持有部分资源还等待其他资源，而一次性申请所有所需资源能避免该情况，从而破坏此条件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575815", "t": 3, "q": "数据库索引可以提高查询操作的效率，但会降低INSERT、UPDATE、DELETE等写入操作的效率，因为写入时需要同时维护索引结构。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "索引能加快查询速度，不过在进行插入、更新、删除操作时，要同步更新索引结构，这会使写入操作效率降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575816", "t": 3, "q": "数据库完整性中的\"默认值约束\"可以保证列值非空，当插入数据时未指定该列值，数据库会自动填入默认值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "默认值约束是在插入数据未指定列值时，数据库自动填入默认值，能避免该列值为空，可保证列值非空。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575817", "t": 3, "q": "数据库物理设计阶段确定的\"存储引擎\"（如InnoDB、MyISAM）仅影响数据的物理存储方式，不影响数据库的功能（如事务支持、索引类型）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。不同的存储引擎（如InnoDB、MyISAM）不仅影响数据的物理存储方式，也会影响数据库的功能。例如InnoDB支持事务和外键，而MyISAM不支持；InnoDB使用聚集索引，MyISAM使用非聚集索引。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575818", "t": 3, "q": "数据库系统的\"数据物理独立性\"是指当数据库的逻辑结构（如关系模式修改）发生变化时，应用程序无需修改。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据物理独立性是指数据的物理结构（如存储设备、存储方式等）改变时，应用程序和数据的逻辑结构无需改变；而题干说的是逻辑结构变化应用程序无需修改，这是数据逻辑独立性的概念。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575819", "t": 3, "q": "数据库系统的核心是数据库管理系统（DBMS），负责统一管理数据库访问。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据库管理系统是数据库系统的核心，它提供数据定义、数据操纵、数据库运行管理等功能，能统一管理数据库的访问。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575820", "t": 3, "q": "数据库系统中的\"数据字典\"是用户可直接查询和修改的，用户可通过SQL语句修改数据字典中的表结构信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据字典是数据库系统中关于数据的描述信息集合，它一般由数据库管理系统管理和维护，用户不能直接查询和修改，也不能用 SQL 语句修改其表结构信息。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575821", "t": 3, "q": "数据库中的\"非聚集索引\"的索引顺序与数据的物理存储顺序无关，因此一个表上可以创建多个非聚集索引，且不影响数据的物理存储。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "非聚集索引索引顺序和数据物理存储顺序无关，能在一个表上创建多个非聚集索引，且创建非聚集索引不改变数据物理存储。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575822", "t": 3, "q": "数据库中的\"索引\"是物理存在的数据库对象，存储了索引列的值和对应数据的物理地址或主键，需要占用额外的存储空间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "索引是数据库中物理存在的对象，它存储索引列值及对应数据物理地址或主键，创建索引会占用额外存储空间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575823", "t": 3, "q": "数据库中的\"索引\"一旦创建就不能修改，若需调整索引结构，必须先删除原索引，再创建新索引。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据库中的索引创建后是可以修改的，并非只能先删除再创建新索引。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575824", "t": 3, "q": "数据库中的\"主键约束\"和\"唯一约束\"都能保证列值的唯一性，因此在一个列上可以同时定义主键约束和唯一约束。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "主键约束和唯一约束虽都保证列值唯一，但主键约束本身就包含唯一性且列值不能为 NULL，一个列上同时定义二者多余且没必要，通常不这么做。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575825", "t": 3, "q": "数据字典存储表结构、索引、触发器、存储过程等对象定义。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据字典是数据库中各类对象的信息集合，会存储表结构、索引、触发器、存储过程等对象的定义。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575826", "t": 3, "q": "索引会在表数据插入、更新、删除时自动维护，无需人工干预。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "数据库中的索引在表数据进行插入、更新、删除操作时，数据库系统会自动对索引进行相应调整和维护，不需要人工手动干预。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575827", "t": 3, "q": "投影运算选择部分属性列，删除重复元组，属性数不超过原关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "投影运算是从关系中选择部分属性列组成新关系，会删除重复元组，新关系属性数自然不超过原关系，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575828", "t": 3, "q": "完全备份是备份数据库中的所有数据，恢复时无需其他备份文件即可将数据库恢复到备份时的状态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "完全备份就是对数据库全部数据进行备份，恢复时仅依靠该完全备份文件就能把数据库恢复到备份时的状态。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575829", "t": 3, "q": "唯一索引不允许索引列值为NULL。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "唯一索引允许有一个NULL值，因为NULL表示未知，多个NULL不视为重复值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575830", "t": 3, "q": "无参数的存储过程无法创建。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "存储过程可以创建无参数的，只需在创建时不指定参数即可。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575831", "t": 3, "q": "物理结构设计阶段确定关系模式的主键、外键和完整性约束。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "确定关系模式的主键、外键和完整性约束是逻辑结构设计阶段的任务，并非物理结构设计阶段。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575832", "t": 3, "q": "一个关系模式如果满足第一范式（1NF），则其所有属性都是原子属性（不可再分），但可能存在部分函数依赖和传递函数依赖。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "第一范式要求关系模式中所有属性都是原子属性不可再分，同时它不要求消除部分函数依赖和传递函数依赖，所以这种情况是可能存在的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575833", "t": 3, "q": "一个数据库只能有一个事务日志文件，事务日志文件必须与数据文件存储在同一磁盘上，以确保数据和日志的同步。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一个数据库可以有多个事务日志文件；事务日志文件不一定要和数据文件存储在同一磁盘上，分开存储有时还能提升性能。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575834", "t": 3, "q": "在关系代数中，\"连接运算\"的结果关系的属性数量等于两个原关系属性数量之和。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "连接运算分为多种，常见的自然连接会去除重复属性列，结果关系属性数量小于两个原关系属性数量之和，并非一定等于。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575835", "t": 3, "q": "在关系代数中，笛卡尔积运算（×）的结果关系的属性个数等于两个operand关系的属性个数之和，元组个数等于两个operand关系的元组个数之积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是关系代数里笛卡尔积运算的基本性质。若一个关系有 m 个属性、n 个元组，另一个关系有 p 个属性、q 个元组，它们做笛卡尔积后新关系属性个数为 m + p，元组个数是 n×q。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575836", "t": 3, "q": "在关系代数中，两个关系的并运算（∪）要求两个关系的结构完全相同（属性个数、属性类型、属性顺序一致），否则无法进行并运算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "关系代数里并运算要求参与运算的两个关系结构相同，即属性个数、属性类型、属性顺序都一致，这样才能将对应元组合并。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575837", "t": 3, "q": "在关系代数中，选择运算（σ）是从关系中筛选出满足条件的元组，投影运算（π）是从关系中选取特定的属性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "选择 σ 是按条件选取元组（行），投影 π 是选取指定属性（列），描述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575838", "t": 3, "q": "在关系代数中，自然连接（⋈）是一种特殊的等值连接，它要求两个关系中进行连接的属性名相同，并且在连接结果中去除重复的属性列。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "自然连接就是特殊的等值连接，需连接属性名相同，且会去除重复属性列。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575839", "t": 3, "q": "在关系模式中，候选码是能够唯一标识关系中每个元组的最小属性集，一个关系模式只能有一个候选码。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "候选码是能唯一标识关系中每个元组的最小属性集，但一个关系模式可能有多个候选码。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575840", "t": 3, "q": "在关系模式中，主属性是指候选码中的属性，非主属性是指候选码以外的属性，一个属性要么是主属性，要么是非主属性，不存在既是主属性又是非主属性的情况。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据主属性和非主属性的定义，二者划分清晰，属性只能归属其一。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575841", "t": 3, "q": "在关系模式R(A,B,C,D)中，F={AB→C,AB→D,C→D}，则该关系模式满足2NF，因为不存在非主属性对主键的部分函数依赖。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "首先确定主键为AB，非主属性是C和D。AB能直接决定C和D，无部分依赖，但存在传递依赖AB→C，C→D。2NF要求不存在非主属性对主键的部分函数依赖，3NF要求不存在非主属性对主键的传递依赖，此模式不满足3NF但满足2NF。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575842", "t": 3, "q": "在关系模式R(A,B,C)中，若存在函数依赖AB→C、A→C，则该关系模式存在部分函数依赖，不满足第二范式（2NF）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "部分函数依赖指非主属性部分依赖于候选键。此关系中候选键是AB，非主属性C部分依赖于A，存在部分函数依赖，不满足2NF要求。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575843", "t": 3, "q": "在ER模型中，一个多对多（M:N）联系转换为关系模式时，只需将联系的属性和其中一方实体的主键作为该关系模式的属性即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多对多联系转换为关系模式时，要将联系的属性和双方实体的主键都作为该关系模式的属性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575844", "t": 3, "q": "在ER模型中，一个实体型转换为关系模式时，实体的主键必须作为该关系模式的主键，实体的所有属性都必须作为该关系模式的属性，不能遗漏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在ER模型转关系模式时，实体型主键就是对应关系模式主键，且实体所有属性都要纳入关系模式，不能遗漏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575845", "t": 3, "q": "在SQL中，视图是一张虚拟表，它并不存储实际的数据，而是基于基表定义的一组数据查询的结果。视图中的数据来源于基表，当基表的数据发生变化时，通过视图看到的数据也会随之变化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "视图属于虚拟表，不保存物理数据，仅保存查询定义，数据来自基表，基表更新则视图查询结果同步变化。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575846", "t": 3, "q": "在SQL中，子查询可以嵌套在SELECT、FROM、WHERE子句中，子查询的结果可以作为主查询的条件或数据源，但子查询不能独立执行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "子查询可以嵌套在SELECT、FROM、WHERE等子句中，为 主查询提供条件或数据源，不过子查询是可以独立执行的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575847", "t": 3, "q": "脏读是读取另一个事务未提交的修改数据，该事务回滚后数据无效。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "脏读的定义就是一个事务读取到了另一个事务未提交的数据，若后者回滚，前者读取的数据就成了无效的。所以此说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575848", "t": 3, "q": "增量备份备份上次完整备份后变化的数据，依赖完整备份。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "增量备份只备份自上次备份（可以是完整备份或上一次增量备份）以来发生变化的数据，它的恢复依赖完整备份及后续的增量备份。所以题干表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575849", "t": 3, "q": "ALTER TABLE语句不能修改表名。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "ALTER TABLE语句可以修改表名，使用“ALTER TABLE 旧表名 RENAME TO 新表名;”语法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575850", "t": 3, "q": "DELETE和TRUNCATE删除的数据都可通过回滚恢复。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "DELETE是DML语句，可通过回滚恢复数据；但TRUNCATE是DDL语句，执行后不可回滚恢复数据。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575851", "t": 3, "q": "E-R模型中的\"弱实体\"必须依赖于\"强实体\"才能存在，其标识需要结合强实体的主键和自身的部分键。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "弱实体没有足够的属性来形成主键，必须依赖强实体才能存在，其标识由强实体主键和自身部分键共同构成。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575852", "t": 3, "q": "E-R模型中的\"属性\"按取值特点可分为简单属性、复合属性、多值属性和派生属性，其中派生属性的值是由其他属性计算得到的（如\"年龄\"由\"出生日期\"计算）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在E - R模型里，属性按取值特点确有简单属性、复合属性、多值属性和派生属性，派生属性的值就是通过其他属性计算得出，像“年龄”依据“出生日期”计算。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575853", "t": 3, "q": "E-R模型转换为关系模式时，一个\"多对多\"联系必须单独转换为一个关系模式，该关系模式的主键是两个关联实体主键的组合。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在E - R模型转关系模式时，“多对多”联系无法直接合并到关联实体的关系模式中，需单独转为一个关系模式，其主键由两个关联实体主键组合而成。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575854", "t": 3, "q": "HAVING过滤分组前数据，WHERE过滤分组后数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实际情况是WHERE过滤分组前的数据，HAVING过滤分组后的数据，题干表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575855", "t": 3, "q": "m:n联系转关系模式时，将一端主键作为外键加入另一端关系即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "m:n联系转关系模式时，需创建一个新的关系模式，该模式包含两端实体的主键以及联系自身的属性，而不是将一端主键作为外键加入另一端关系。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575856", "t": 3, "q": "SQL语句\"DELETE FROM 学生表;\"与\"TRUNCATE TABLE 学生表;\"的功能相同，都能删除学生表中的所有记录，且都可以通过事务回滚恢复数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“DELETE FROM 学生表;”和“TRUNCATE TABLE 学生表;”都能删除表中所有记录，但DELETE可通过事务回滚恢复数据，TRUNCATE不能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575857", "t": 3, "q": "SQL语句\"SELECT DISTINCT 部门号 FROM 职工表;\"的作用是查询职工表中所有部门号，包括重复的部门号。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“DISTINCT”关键字作用是去除重复值，该语句是查询职工表中不重复的部门号，并非包括重复的部门号。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575858", "t": 3, "q": "SQL语句中的GRANT语句用于授予用户对数据库对象的操作权限，REVOKE语句用于回收已授予的权限，两者均属于数据控制语言（DCL）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "GRANT用于授予权限，REVOKE用于回收权限，它们都属于数据控制语言（DCL）的范畴。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575859", "t": 3, "q": "SQL语句中的GROUP BY子句用于对查询结果进行分组，HAVING子句用于对分组后的结果进行筛选，HAVING子句可以单独使用，无需配合GROUP BY子句。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "HAVING子句是用来筛选分组后的数据，它必须和GROUP BY子句配合使用，不能单独用。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575860", "t": 3, "q": "SQL语言中的CREATE、ALTER、DROP语句属于数据操纵语言（DML），用于对数据库对象进行创建、修改和删除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "CREATE、ALTER、DROP语句属于数据定义语言（DDL），不是数据操纵语言（DML），DML主要是对数据进行增删改查操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575861", "t": 3, "q": "SQL中的\"视图\"不仅可以简化查询，还可以作为一种安全机制，限制用户只能访问视图中定义的列，无法访问基表的其他列。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "视图能将复杂查询封装，简化用户操作，同时可通过定义视图包含的列，使用户仅能访问视图中的列，起到限制访问基表其他列的安全作用。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575862", "t": 3, "q": "SQL中的\"子查询\"可以嵌套多层，即一个子查询中可以包含另一个子查询，实现复杂的查询逻辑。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "SQL 支持子查询多层嵌套，能通过这种方式实现复杂查询逻辑。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575863", "t": 3, "q": "SQL中的\"DISTINCT\"关键字与\"GROUP BY\"子句在去除重复行时的效果完全相同，都可以用于筛选唯一的列值组合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“DISTINCT”直接去除结果集中的重复行；“GROUP BY”主要用于分组，虽可实现类似去重，但更侧重分组聚合操作，两者功能有差异。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575864", "t": 3, "q": "SQL中的\"DROP TABLE\"命令删除表后，表的结构和数据会被永久删除，且无法通过事务回滚恢复。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“DROP TABLE”是用于删除表的命令，执行后表结构和数据会被永久移除，事务回滚不能恢复已删除的表。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575865", "t": 3, "q": "SQL中的\"EXISTS\"子查询只关注子查询是否返回结果集（存在至少一行），不关注返回的具体数据，因此子查询的SELECT子句中可以用\"*\"代替具体列名。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "EXISTS 子查询确实只判断子查询有无结果集，不关心具体数据，所以子查询 SELECT 子句用“*”代替具体列名不影响判断。", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575866", "t": 3, "q": "SQL中的\"GROUP BY\"子句分组后，SELECT子句中只能出现GROUP BY子句中指定的分组列和聚合函数，不能出现其他非分组列。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在 SQL 里，GROUP BY 分组后，SELECT 子句通常只能有 GROUP BY 指定的分组列和聚合函数，加入其他非分组列会使结果逻辑不清晰且可能出错。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813779459575867", "t": 3, "q": "SQL中的\"INSERT INTO 表名 VALUES(...)\"语句可以一次性插入多行数据，只需用逗号分隔多个值列表即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在标准 SQL 里，“INSERT INTO 表名 VALUES(...)”默认一次只能插入一行数据，若要插入多行，需用“INSERT INTO 表名 VALUES(值列表1), (值列表2), ...”这种语法，题中表述不准确。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 计算机网络（1）", "n": "基础练习题【含解析】 / 第3章 计算机网络（1）", "qs": [{"id": "2034813792453529600", "t": 1, "q": "数据链路层采用的CRC校验算法中，若生成多项式为G(x)=x^4+x+1（对应二进制10011），则对数据帧101010进行校验后，生成的FCS字段位数是多少？", "a": ["6位", "4位", "5位", "3位", "", ""], "r": "B", "e": "生成多项式的最高次幂就是FCS字段位数，此生成多项式G(x)=x^4+x+1最高次幂为4。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034813792453529601", "t": 1, "q": "下列关于数据链路层\"滑动窗口协议\"的描述中，正确的是？", "a": ["滑动窗口协议中，发送窗口大小固定为1，接收窗口大小可动态调整", "滑动窗口协议通过允许发送方连续发送多个帧，提高了链路利用率", "滑动窗口协议仅用于流量控制，无法实现可靠传输", "滑动窗口协议仅适用于点对点链路，不适用于广播链路", "", ""], "r": "B", "e": "发送窗口和接收窗口大小都可调整，A错误；滑动窗口协议既能流量控制也能实现可靠传输，C错误；它也适用于广播链路，D错误；其允许发送方连续发多个帧，能提高链路利用率，B正确。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034813792453529602", "t": 1, "q": "下列关于数据链路层\"帧\"的描述中，错误的是？", "a": ["帧头中通常包含源MAC地址和目的MAC地址", "帧是数据链路层的传输单位，由帧头、数据部分和帧尾组成", "帧在传输过程中，源MAC地址和目的MAC地址会随路由转发发生改变", "帧尾通常包含差错检测字段（如CRC）", "", ""], "r": "C", "e": "在路由转发中，源IP地址和目的IP地址不变，源MAC地址和目的MAC地址会根据不同链路改变，但说“帧在传输过程中”表述不准确，因为如果在同一链路传输，MAC地址不改变。A、B、D选项描述均正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034813792453529603", "t": 1, "q": "下列关于数据链路层\"VLAN\"的描述中，错误的是？", "a": ["同一VLAN内的设备可直接通信，不同VLAN内的设备默认无法通信", "VLAN可减少广播域，提高网络安全性和带宽利用率", "VLAN可将一个物理局域网划分为多个逻辑局域网，不同VLAN间的通信需通过路由器", "VLAN的划分仅基于端口，无法基于MAC地址或IP地址", "", ""], "r": "D", "e": "VLAN划分方式多样，不仅能基于端口，还可基于MAC地址、IP地址等。A选项同一VLAN内设备可直接通信，不同VLAN默认不能通信；B选项VLAN可减少广播域，提升安全和带宽利用率；C选项不同VLAN通信需通过路由器。所以错误的是D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034813792453529604", "t": 1, "q": "下列关于数据链路层差错控制的描述中，属于检错重传机制的是？", "a": ["海明码", "奇偶校验码", "汉明距离", "循环冗余校验（CRC）+重传", "", ""], "r": "D", "e": "检错重传机制需能检测错误且可重传。A、B 选项的海明码和奇偶校验码仅能检错不能重传；C 选项汉明距离是衡量编码检错纠错能力的指标，并非检错重传机制；D 选项循环冗余校验（CRC）可检错，加上重传构成了检错重传机制。答案：
