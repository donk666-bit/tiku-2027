U=380，对称三相感性负载作星形连接，若测得线电流I=17.3A，三相功率P=9.12kW。则每相负载的阻抗为（     ）。", "a": ["<p>10.2+j7.57Ω<\/p>", "<p>12.7+j7.57Ω<\/p>", "<p>10.2+j12.7Ω<\/p>", "<p>7.5+j10.2Ω<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/0rDBviLxxrT58lX1RyhBdER7aoC6TSreKhgfraD0.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8577", "t": 1, "q": "<p>已知X<sub>C<\/sub>=6Ω的对称纯电容负载作△接，与对称三相电源相接后测得各线电流均为10A，则三相电路的视在功率为（ &nbsp;&nbsp;&nbsp;&nbsp;）。<\/p>", "a": ["<p>1800VA<\/p>", "<p>600VA<\/p>", "<p>1800W<\/p>", "<p>600W<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/XV7HyNiFuJqNDIMYBWbxiGOS2R7vH4tZ5KJ3mcCi.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8578", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/GhlD5LtnTtyf9Ng7VqwDlKEXnZi7GXMyU342fiyV.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/SuU8sSP9QUoos3rXrYTOpke5LmQkY6S3ADxETiDT.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/pKYu9ktwDpaV14ofhmhSDUmJmT7ZONJt6TZFBaDN.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/LYYc12H5OxgJycn0JAN8dYwt9XrDQqQQ93LyVa97.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/DgrNpSw6tLh7LqA3Jm2cyu5wGgo6T2QGyDy0bcSa.png\"><\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/KnKMSiUIUoVI0MJmwSvyznXGwI9jMsbgnmfEbuKg.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8579", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/SssNX9yd1QGs1lNpcnPo9oysfGcGGdHBLMVhXEx0.png\"><\/p>", "a": ["<p>15W<\/p>", "<p>-15W<\/p>", "<p>5W<\/p>", "<p>10W<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/saRSIuQrq8vdTh2dRRvBiTAD2dL9Ksw31LZqvk20.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8580", "t": 1, "q": "测量三相交流电路的功率有很多方法，其中三瓦计法是测量（     ）电路的功率。", "a": ["<p>三相三线制电路<\/p>", "<p>对称三相三线制电路<\/p>", "<p>三相四线制电路<\/p>", "<p>对称电路均可测量<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/79xZSTeY93XPl9D5lCTtdKHCmXbnaAuI4zdl6jfq.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8581", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/LFcCMFN2Cl4nPVef6AFBWUpCEshuVkPlOsGV1O9s.png\"><\/p>", "a": ["<p>1660.6W，830.3W<\/p>", "<p>1660.6W，1660.6W<\/p>", "<p>830.3W，830.3W<\/p>", "<p>1257.2W，687.9W<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/UY6R6dMHq0CoGIZ0kiC71UuM8dTnCYVPSvADQPN5.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8582", "t": 1, "q": "目前电能的主要缺点是（     ）。", "a": ["<p>高压危险<\/p>", "<p>不能远距离传输<\/p>", "<p>不方便利用<\/p>", "<p>不便于大规模存储<\/p>", "", ""], "r": "D", "e": "【定位】第4章，4.3节，知识点1：电能及其特点\n【解析】  由于目前电能还不能大规模地储存，因此电力生产的各个环节必须随时保持平衡，并与电力的使用（用电）随时保持平衡，形成一个完整的、高度协同动作的电力系统。同时，电力生产的各个环节必须安全可靠，因为任何一个环节发生故障，不但给自身造成损失，还会影响到用户的安全经济生产和人们的正常生活，因此，电力生产必须坚持“安全第一、预防为主”的方针。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8583", "t": 1, "q": "下列能源形式不属于二次能源的是（     ）。", "a": ["<p>汽油<\/p>", "<p>柴油<\/p>", "<p>煤气<\/p>", "<p>天然气<\/p>", "", ""], "r": "D", "e": "【定位】第4章，4.3节，知识点1：电能及其特点\n【解析】电能是由一次能源转化而来的二次能源。一次能源又叫自然能源，它是以自然形态存在于自然界中的，是直接来自自然界而未经人们加工转换的能源，包括化石燃料（煤炭、石油和天然气等）、可再生能源（水能、风能、太阳能、潮汐能、地热能和生物质能等）以及核能。一次能源通过不同的生产过程转化而成的能源称为二次能源，如电能、汽油、柴油、焦炭、煤气、蒸汽等均为二次能源。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8584", "t": 1, "q": "下列电力生产的各环节中，哪个环节显著不一样（     ）。", "a": ["<p>发电<\/p>", "<p>输电<\/p>", "<p>配电<\/p>", "<p>变电<\/p>", "", ""], "r": "D", "e": "【定位】第4章，4.3节，知识点3：电力系统\n【解析】  电力系统是由电力生产各个环节的设备与电力用户的用电设备（电力消费环节），以及相应的辅助系统，按规定的技术和经济要求连接在一起，从而完成电能从生产、输送、分配直至使用整个过程的统一系统。电力系统中包括发电、变电、输电、配电和用电设备，它们构成电力系统的一次系统，实现电能生产和消费的全过程。电力系统还包括继电保护和安全自动装置、调度自动化设备和通信设备，以及计算机和电子信息化设备等相应的辅助设备，它们构成了二次系统，以保证整个电力系统的安全可靠运行和经济运营。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8585", "t": 1, "q": "电力系统长期稳定运行时，允许不超过的最大频率误差为（     ）。", "a": ["<p>±0.1Hz<\/p>", "<p>±0.2Hz<\/p>", "<p>±0.5Hz<\/p>", "<p>±1Hz<\/p>", "", ""], "r": "C", "e": "【定位】第4章，4.3节，知识点4：电力市场\n【解析】保证良好的电能质量。电能质量的考核标准有两个，即电压和频率。一般来说，电压的合格范围为不超过额定值的±5%。我国电力系统额定频率为50Hz，其允许偏差一般不得超过±0. 2Hz，不允许电力系统长时间低于49. 5Hz运行。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8586", "t": 1, "q": "电力生产的核心目标是（     ）。", "a": ["<p>安全<\/p>", "<p>效益<\/p>", "<p>质量<\/p>", "<p>可靠<\/p>", "", ""], "r": "A", "e": "【定位】第4章，4.4节，知识点1：电力安全生产概述\n【解析】安全生产的核心目标是保障员工的生命安全和身体健康，这要求我们在工作中严格遵守国家相关法律法规，特别是在高压电、电气设备等危险区域，必须设置明显的安全警示标识，并定期进行设备检查和维护，确保员工能够在安全的环境中工作。\n我们要设定确保电力系统稳定运行的目标，这意味着我们需要建立完善的安全管理体系，包括应急预案的制定和演练，以应对可能出现的电力故障或安全事故。通过对员工进行系统的安全培训，提高他们对潜在风险的识别和防范能力。\n我们还应该关注环境保护和可持续发展的目标，在电力生产过程中，我们应尽量减少对环境的污染和资源的浪费，积极推广绿色能源和节能技术，以实现经济效益和环境效益的双赢。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8587", "t": 1, "q": "带电操作高压或低压电气设备时防止跨步电压对人体的伤害，应该主要穿戴（     ）。", "a": ["<p>绝缘手套<\/p>", "<p>绝缘靴<\/p>", "<p>绝缘棒<\/p>", "<p>绝缘帽<\/p>", "", ""], "r": "B", "e": "【定位】第4章，4.4节，知识点3：安全用电工具\n【解析】常用绝缘手套、绝缘靴、绝缘棒三种：\n绝缘手套：由绝缘性能良好的特种橡胶制成，有高压、低压两种。操作高压隔离开关和油断路器等设备、在带电运行的高压电器和低压电气设备上工作时，预防接触电压。\n绝缘靴：也是由绝缘性能良好的特种橡胶制成，带电操作高压或低压电气设备时防止跨步电压对人体的伤害。\n绝缘棒：又称绝缘杆、操作杆或拉闸杆，用电木、胶木、塑料、环氧玻璃布棒等材料制成。在对电力系统进行倒闸操作、带电测量及安装和拆除临时接地线等作业时，绝缘棒可以有效地在高压带电设备与操作人员之间建立起可靠的电绝缘屏障。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8588", "t": 1, "q": "对于人体，可以致人伤亡的最小电流大小为（     ）。", "a": ["<p>1mA<\/p>", "<p>10mA<\/p>", "<p>50mA<\/p>", "<p>100mA<\/p>", "", ""], "r": "C", "e": "【定位】第4章，4.4节，知识点4：触电事故及急救\n【解析】按人体受伤害的程度，触电可分为电伤和电击两种。电伤是指人体外部受伤，如电弧灼伤，与带电体接触后的皮肤红肿，大电流下熔化金属飞溅烧伤皮肤等。电击则是指人体内部器官受损伤的现象。电击是电流流过人体而引起的，人体常因电击而死亡，所以它是最危险的触电事故。电击伤人的程度，与流过人体电流的频率、大小、途径、持续时间长短以及触电者本身的情况有关。实践证明，频率为25～300 Hz的电流最危险，随着频率的增加，危险胜减小。人体通过1mA的工频电流，就有麻木的感觉，电流大于50mA，就会有生命危险，100mA的工频电流则足以致人死亡。电流通过心脏和大脑易发生死亡事故，所以头部触电或左手到右脚触电最危险。另外，人体通电时间越长，危险性越大。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8589", "t": 1, "q": "对于有心跳但无呼吸的触电者，可以采用人工呼吸法急救，两次人工呼吸之间的时间间隔一般为（     ）。", "a": ["<p>1-2秒<\/p>", "<p>2-3秒<\/p>", "<p>3-5秒<\/p>", "<p>5-7秒<\/p>", "", ""], "r": "C", "e": "【定位】第4章，4.4节知识点4：触电事故及急救\n【解析】人工呼吸法适用于有心跳但无呼吸的触电者。首先将触电者仰卧在平地上，鼻孔朝天颈后仰。然后清理口鼻腔的阻塞物使其通畅，解扣松衣使触电者身体放松。做人工呼吸时，要捏住触电者鼻子，贴嘴吹气；松开鼻子让废气从鼻、口排出。每隔3～5S重复一次。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8590", "t": 1, "q": "高压线破断落地时，以破断的高压线落地为中心在其周围形成一个强电场，进入该区域的人或牲畜很容易由于跨步电压而触电。下列因素与跨步电压无主要关系的是（     ）。", "a": ["<p>高压线电压等级<\/p>", "<p>离高压线落地点的距离<\/p>", "<p>跨步的步长<\/p>", "<p>离高压线落地点的方向<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/nSJx1kgYwWzNzGNaskbpGal0OZWa2UzK5Kvb2XTH.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8591", "t": 1, "q": "当遇到跨步电压触电风险时，正确的处理方法是（     ）", "a": ["<p>原地站着不动，等待救援<\/p>", "<p>趴下匍匐前进，离开危险区<\/p>", "<p>快速跑开危险区，并大声呼救<\/p>", "<p>单脚跳离开危险区<\/p>", "", ""], "r": "D", "e": "【定位】第4章，4.4节，知识点4：触电事故及急救:\n【解析】当人或牲畜走入断线点8m以内的电场时，由于前后脚之间有较高的电压引起触电，这种触电称为跨步触电。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8592", "t": 2, "q": "对称三相电源是满足（     ）的正弦电压源。", "a": ["<p>同频率<\/p>", "<p>等幅值<\/p>", "<p>初相位依次滞后120°&nbsp;<\/p>", "<p>初相位依次滞后180°<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Qes2fjefGMhaVm3P2s9VZmzNDwn6K7UC1PHwBe1n.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8593", "t": 2, "q": "对称三相电源的对称主要是指（     ）。", "a": ["<p>三个电源相位相同<\/p>", "<p>三个电源频率相等<\/p>", "<p>三个电源相位互差120° &nbsp;<\/p>", "<p>三个电源幅值相等<\/p>", "", ""], "r": "BCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/D5CzUY2Y9mbhuuF9dGRbpyfLlwR1heAGjw6t87rw.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8594", "t": 2, "q": "<p>若对称三相电压源星形联结，每相电压有效值均为220V，但BY相的B与Y接反。若三条端线的注字仍为A、B、C，则其线电压U<sub>CA<\/sub>的值不正确的是（ &nbsp;&nbsp;&nbsp;&nbsp;）。<\/p>", "a": ["<p>220<\/p>", "<p>380<\/p>", "<p>127<\/p>", "<p>0<\/p>", "", ""], "r": "ACD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/tuE0lct5JIEDCyOojoYkgCnv3YUQyMfGPVDkvm3a.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8595", "t": 2, "q": "三相电源与单相电源的区别是（     ）。", "a": ["<p>发电机发出的电源一般是三相的<\/p>", "<p>三相电源的每一相与其中性点都可以构成六个单相回路为用户提供电力能源<\/p>", "<p>零线与中性点联接，和任意一条火线连接用以提供单相电源的电流<\/p>", "<p>三相交流电源一般为正弦变化<\/p>", "", ""], "r": "ACD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/yYPP107JDlNXEBVc8TFdsKHOYaK8AtHiyfC19D1V.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8596", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Yrm9h0hrGzMrFtY5QDkdWXxWv4QE9xtVPQoCq62U.png\"><\/p>", "a": ["<p>负载为容性<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/5wwfuWj8Zn8nwWm1y5RZDLbZ1xgBTSY4MJoDExZx.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/zOKGeOoiVyZEys8amVzuEVzQ3uHbJs4aWEsnv3rK.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/twX7gS5q4HIDMjjk081pg1sgyexq7enrD9L6SYWX.png\"><\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/enIbD9R8CJiUbQtrgO1TTKKW5IdxpgOJRHEOYYgE.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8597", "t": 2, "q": "对于△连接的对称三相电路的负载，下列说法正确的是（     ）。", "a": ["<p>线电压等于对应的相电压<\/p>", "<p>相电流对称，则线电流也对称<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Jo3dAvkCiWxxvD6Lt5ipOiZ02RWdFStTkXgHb5I4.png\"><\/p>", "<p>线电流相位滞后相电流相位30°<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/ZVv0IqkCsGTdhAYws0iZu3A1btAmC8yE4thlaiZa.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8598", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/MccWcMU4sixwlUpTofci0laHMEU5XgcKdWAeSn0Y.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/lcenxKlgbWatOX5sDTgOOadMvYTq6FR2VvvjKVxd.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/whfqtQbpUCiD4r5PthvbiqASBNYWTqrlo057MewT.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Kqi1y12lrDjQskDbZu7eiktS7WnFRCDv4ftF97VP.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/GuhluDhQFTQ7uRbQONm9nXo5ZiqKHGxpderb5WnX.png\"><\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/g4yRr6VhZU4Chg4mKWlL6u0UjLFwJXY4w8TQNKXJ.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8599", "t": 2, "q": "以下选项中，是三相不对称电路有（     ）。", "a": ["<p>电源不对称<\/p>", "<p>负载不对称<\/p>", "<p>电源和负载都不对称<\/p>", "<p>不确定<\/p>", "", ""], "r": "ABC", "e": "【定位】第4章，4.1节，知识点4：三相电路\n【解析】对称三相电路是指对称三相电源、对称三相负载和对称三相线路阻抗组成的正弦电流电路。\n三相对称电路是指电源，负载，线路阻抗都是对称的，而其中只要有一组不对称就称为三相不对称电路。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8600", "t": 2, "q": "对称三相电源与对称三相负载连接的方式有（     ）。", "a": ["<p>电源△连接，负载Y连接<\/p>", "<p>电源Y连接，负载Y连接<\/p>", "<p>电源△连接，负载△连接<\/p>", "<p>电源Y连接，负载△连接<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/b3vZq05tgvKdBnbXf9PtjGBmCM52urxB9FSz27a0.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8601", "t": 2, "q": "在对称三相星型-星型连接电路中，下列说法正确的是（     ）。", "a": ["<p>中线电流为零<\/p>", "<p>有无中线对电路没有影响<\/p>", "<p>只要得到某一相的电压和电流，那么其他两相的电压和电流可以由对称关系写出<\/p>", "<p>在计算电路时可以采用三相化一相的方法计算<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/IcB8o2kXA37gszCyazJ1dAs5JNkfc0l926lUCG5Y.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8602", "t": 2, "q": "下列描述正确的是（     ）。", "a": ["<p>对称的Y-Y三相电路，在理论上不需要中线，可以移去<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/BvV4Yi8M8AZMAIYnFY6ytHJjmK3Fa9hU3neRRvp7.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/yUI5EkLqrhWP8ted58ADg3RaDVpoZ3L43L3D9WGC.png\"><\/p>", "<p>对称的Y-Y三相电路，可以用正弦相量法求解<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/oRqiYbWQAJ3UewLTofpDyInH09gBseNNYMDQD1fe.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8603", "t": 2, "q": "实际三相电路中，线路的连接方式—般有（     ）。", "a": ["<p>三相三线制<\/p>", "<p>两相三线制<\/p>", "<p>三相四线制<\/p>", "<p>两相四线制<\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/caVqFGBc899ZOJeAXIbykivbt8Wqhg0XstWg6ySq.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8604", "t": 2, "q": "下列关于不对称三相电路的描述错误的是（     ）。", "a": ["<p>对于不对称三相电路也可以用一相计算法<\/p>", "<p>在三相电路中，只要一部分不对称则就是不对称三相电路<\/p>", "<p>在三相电路中，需要电源和负载都不对称才是不对称三相电路<\/p>", "<p>在不对称电路中，可能会出现中性点位移的情况<\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/jXQbvF4vpKu0EtbPbUFbKAg6oorKOPsUoq9inE2Z.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8605", "t": 2, "q": "星型接法不对称三相电路与对称三相电路的区别有（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Rryt76UgkSSP5PxjwfNIA6Rhwi8FNtkb6KVTMiBK.png\"><\/p>", "<p>中性线的电流值不同<\/p>", "<p>不对称三相电路不适用一相计算方法<\/p>", "<p>线电压和相电压的关系不同<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/y6v7dRyZSv3A0eiC1qTczbEWlq0QQMc5ubVtyQF4.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8606", "t": 2, "q": "若原三相电路是对称的，无线路阻抗，负载三角形连接，当负载端某一相开路，则（     ）。", "a": ["<p>电源端电压存在对称关系<\/p>", "<p>负载端电流对称<\/p>", "<p>负载端电压不对称<\/p>", "<p>负载端电压对称<\/p>", "", ""], "r": "AD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/196mJJYEqHKE1uO1UKPtYlF7z1CH5keerhP3l3Ub.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8607", "t": 2, "q": "下列说法正确的是（     ）。", "a": ["<p>三相电路的总有功功率为各相有功功率之和<\/p>", "<p>三相电路的总无功功率为各相的无功功率之和<\/p>", "<p>三相电路的总视在功率为各相的视在功率之和<\/p>", "<p>三相电路的总复功率为各相的复功率之和<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/uEdjwcEBOFmcNtyUgXcmLvXGAlCgXfgtIk6jfen7.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8608", "t": 2, "q": "<p>下列描述正确的是（ ）。<\/p>", "a": ["<p>在不对称的三相电路中，三相负载吸收的复功率等于各相复功率之和<\/p>", "<p>在不对称的三相电路中，三相负载的有功功率等于电源发出的有功功率<\/p>", "<p>在对称三相电路中，三相负载吸收的复功率等于3倍单相电源的复功率<\/p>", "<p>在对称三相电路中，三相电路的瞬时功率为各相负载瞬时功率之积<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/C0hHQa34VQOCjdnbGKw4wCRNUnkQon8SLu6DRFyK.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8609", "t": 2, "q": "下列对三相Y形连接对称电路总有功功率的描述中，说法正确的是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/SR6KbURCqOdxUqRhbUtkVHKEj50CW1KTd08PbOgt.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/GLBsp6Cu9wkWxktwEroU46nHDp5llUgE7AsYfiHZ.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/b11vi7PlSm6uPZvjjRKFz0zZ9mDr32Ro3Dxc2vhx.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/A6kTCpZtw9hOmXmsuDp2KSkEEPAX81tdI6zjyFts.png\"><\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/jufOoxaxYn83tg3GmvLDr9BZTuWc3VMr1eLlF5ya.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8610", "t": 2, "q": "三相电路中测量功率常用的方法有（     ）。", "a": ["<p>二瓦计法<\/p>", "<p>三瓦计法<\/p>", "<p>一瓦计法<\/p>", "<p>两表法<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Cr5eyFNrwTHPGWE7VCSSoNCw3PcBJQE6xxLAqeq0.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8611", "t": 2, "q": "下列能源类型不属于二次能源的有（     ）。", "a": ["<p>电能<\/p>", "<p>水能<\/p>", "<p>风能<\/p>", "<p>光能<\/p>", "", ""], "r": "BCD", "e": "【定位】第4章，4.3节知识点1：电能及其特点\n【解析】电能是由一次能源转化而来的二次能源。一次能源又叫自然能源，它是以自然形态存在于自然界中的，是直接来自自然界而未经人们加工转换的能源，包括化石燃料（煤炭、石油和天然气等）、可再生能源（水能、风能、太阳能、潮汐能、地热能和生物质能等）以及核能。一次能源通过不同的生产过程转化而成的能源称为二次能源，如电能、汽油、柴油、焦炭、煤气、蒸汽等均为二次能源。故选项BCD正确。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8612", "t": 2, "q": "下列哪些能源属于一次能源（     ）。", "a": ["<p>煤炭<\/p>", "<p>石油<\/p>", "<p>天然气<\/p>", "<p>煤气<\/p>", "", ""], "r": "ABC", "e": "【定位】第4章，4.3节，知识点1：电能及其特点\n【解析】电能是由一次能源转化而来的二次能源。一次能源又叫自然能源，它是以自然形态存在于自然界中的，是直接来自自然界而未经人们加工转换的能源，包括化石燃料（煤炭、石油和天然气等）、可再生能源（水能、风能、太阳能、潮汐能、地热能和生物质能等）以及核能。一次能源通过不同的生产过程转化而成的能源称为二次能源，如电能、汽油、柴油、焦炭、煤气、蒸汽等均为二次能源。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8613", "t": 2, "q": "电力生产的任务就是向各种电力用户提供（     ）。", "a": ["<p>充足的电能<\/p>", "<p>可靠的电能<\/p>", "<p>合格的电能<\/p>", "<p>价格合理的电能<\/p>", "<p>优质满意的服务<\/p>", ""], "r": "ABCDE", "e": "【定位】第4章，4.3节，知识点1：电能及其特点\n【解析】电力生产就是要把各种一次能源转换成电能，并且输送和分配到电力用户。从事电能生产、传输和销售的行业称为电力工业，简称电业。电力生产的任务就是向各种电力用户提供充足、可靠、合格、价格合理的电能和优质服务。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8614", "t": 2, "q": "下列哪些能源属于二次能源（     ）。", "a": ["<p>电能<\/p>", "<p>石油<\/p>", "<p>天然气<\/p>", "<p>煤气<\/p>", "", ""], "r": "AD", "e": "【定位】第4章，4.3节，知识点1：电能及其特点\n【解析】电能是由一次能源转化而来的二次能源。一次能源又叫自然能源，它是以自然形态存在于自然界中的，是直接来自自然界而未经人们加工转换的能源，包括化石燃料（煤炭、石油和天然气等）、可再生能源（水能、风能、太阳能、潮汐能、地热能和生物质能等）以及核能。一次能源通过不同的生产过程转化而成的能源称为二次能源，如电能、汽油、柴油、焦炭、煤气、蒸汽等均为二次能源。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8615", "t": 2, "q": "如下的发电方式中，使用了汽轮机的有（     ）。", "a": ["<p>火力发电<\/p>", "<p>水力发电<\/p>", "<p>核能发电<\/p>", "<p>风力发电<\/p>", "", ""], "r": "AC", "e": "【定位】第4章，4.3节，知识点2：电力生产的主要环节\n【解析】除太阳能发电的光伏电池技术和燃料电池发电外，绝大部分发电方式的电能生产设备都是由动力部分和发电部分组成。动力部分将各种发电用能源转换成机械能，发电部分则将传递过来的机械能经过电磁感应作用转换为电能。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8616", "t": 2, "q": "如下的发电方式中，哪些不属于新能源发电（     ）。", "a": ["<p>火力发电<\/p>", "<p>水力发电<\/p>", "<p>核能发电<\/p>", "<p>风力发电<\/p>", "", ""], "r": "ABC", "e": "【定位】第4章，4.3节，知识点2：电力生产的主要环节\n【解析】  其他新能源，即除常规化石能源和大中型水力发电、核裂变发电之外的风能、地热能、太阳能、海洋能、生物质能等一次能源，具有资源丰富、可以再生、清洁干净的特点，是最有前景的替代能源，将成为未来世界能源的基石。但由于技术和经济等各种原因，这些能源大规模应用于发电仍处于研究开发过程中。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8617", "t": 2, "q": "下列哪些设备与装置属于二次设备（     ）。", "a": ["<p>电力传输线<\/p>", "<p>变压器<\/p>", "<p>继保装置<\/p>", "<p>防雷装置<\/p>", "", ""], "r": "CD", "e": "【定位】第4章，4.3节，知识点3：电力系统\n【解析】电力系统是由电力生产各个环节的设备与电力用户的用电设备（电力消费环节），以及相应的辅助系统，按规定的技术和经济要求连接在一起，从而完成电能从生产、输送、分配直至使用整个过程的统一系统。电力系统中包括发电、变电、输电、配电和用电设备，它们构成电力系统的一次系统，实现电能生产和消费的全过程。电力系统还包括继电保护和安全自动装置、调度自动化设备和通信设备，以及计算机和电子信息化设备等相应的辅助设备，它们构成了二次系统，以保证整个电力系统的安全可靠运行和经济运营。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8618", "t": 2, "q": "电能的质量主要反映在（     ）参数。", "a": ["<p>电压<\/p>", "<p>频率<\/p>", "<p>安全性<\/p>", "<p>可靠性<\/p>", "", ""], "r": "ABCD", "e": "【定位】第4章，4.3节，知识点4：电力市场\n【解析】基于市场的需求及电力生产与国民经济中各行业的密切关系和对国民经济发展的支柱作用，对电力生产提出了如下基本要求：\n（1）保证可靠的持续供电。供电的中断将导致生产停顿、社会生活混乱，甚至危及人身和设备安全，造成十分严重的后果。供电中断给国民经济造成的间接和直接损失远远超过电力系统本身的损失。因此，电力系统首先要满足可靠、持续供电的要求。\n（2）保证良好的电能质量。电能质量的考核标准有两个，即电压和频率。一般来说，电压的合格范围为不超过额定值的±5%。我国电力系统额定频率为50Hz，其允许偏差一般不得超过±0. 2Hz，不允许电力系统长时间低于49. 5Hz运行。\n（3）保证系统经济运行。电力系统经济运行是指满足负荷要求的条件下，使整个电力系统的一次能源消耗量最小，以降低电能成本。这就要求根据用电负荷合理调度各台发电机的负荷，同时降低电能输送过程中的能量损耗（线损）。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8619", "t": 2, "q": "海洋能发电的方式主要包括（     ）。", "a": ["<p>潮汐发电<\/p>", "<p>海浪发电<\/p>", "<p>潮流发电<\/p>", "<p>温差发电<\/p>", "", ""], "r": "ABCD", "e": "【定位】第4章，4.3节，知识点5：电力发电方式\n【解析】海洋能发电的形式：\n利用海洋能发电的方式很多，其中包括潮汐发电、波力发电、潮流发电、海水温差发电和海水含盐浓度差发电等，而国内外已开发利用海洋能发电主要是潮汐发电。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8620", "t": 2, "q": "电力安全生产所涉及到的领域包括（     ）。", "a": ["<p>电力系统运行<\/p>", "<p>电力设备的健康状态<\/p>", "<p>工作人员的操作<\/p>", "<p>生态环境保护<\/p>", "", ""], "r": "BCD", "e": "【定位】第4章，4.4节，知识点1：电力安全生产概述\n【解析】电力安全生产不仅涉及到传统的电力系统运行安全，还包括电力设备的健康状态、工作人员的安全操作、环境保护等方面。电力企业的安全生产管理应坚持“安全第一，预防为主”强化安全制度建设，提高安全意识，落实安全责任，通过科学的管理手段和技术手段，实现电力生产的安全可控。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8621", "t": 2, "q": "电流对人体旳伤害形式主要有（     ）。", "a": ["<p>电击<\/p>", "<p>电伤<\/p>", "<p>电流<\/p>", "<p>电压<\/p>", "", ""], "r": "AB", "e": "【定位】第4章，4.4节，知识点4：触电事故及急救:\n【解析】按人体受伤害的程度，触电可分为电伤和电击两种。电伤是指人体外部受伤，如电弧灼伤，与带电体接触后的皮肤红肿，大电流下熔化金属飞溅烧伤皮肤等。电击则是指人体内部器官受损伤的现象。电击是电流流过人体而引起的，人体常因电击而死亡，所以它是最危险的触电事故。电击伤人的程度，与流过人体电流的频率、大小、途径、持续时间长短以及触电者本身的情况有关。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8622", "t": 2, "q": "为了区别相序确保用电安全，交流三相系统中L1、L2、L3三相裸导线的涂色依次为（     ）。", "a": ["<p>黄色<\/p>", "<p>绿色<\/p>", "<p>红色<\/p>", "<p>蓝色<\/p>", "", ""], "r": "ABC", "e": "【定位】第4章，4.4节，知识点4：触电事故及急救\n【解析】在三相电路中若人体与两根相线接触，人体在线电压作用下，危险性变大。 \n为了保证用电安全，三相交流电系统的三相输电线路应该采用不同的颜色区分。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8623", "t": 2, "q": "变电所旳接地装置有（     ）。", "a": ["<p>工作接地<\/p>", "<p>保护接地<\/p>", "<p>防雷接地<\/p>", "<p>防火接地<\/p>", "", ""], "r": "ABC", "e": "【定位】第4章，4.4节，知识点4：触电事故及急救\n【解析】对规定使用接地的用电器具的金属外壳要做好接地保护，不要忘记给三眼插座、插座盒安装接地线；不要随意将三眼插头改为两眼插头。\n通常在高大建筑物或在雷区的每个建筑物的顶部，安装避雷针来预防雷击。对于使用室外电视机或收录机天线的用户，应装避雷器或防雷用转换开关。在正常天气时将天线接人室内，在雷雨前将天线转接到接地体上，以防由天线引人雷击。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8624", "t": 2, "q": "心肺复苏法支持生命旳基本措施包含（     ）。", "a": ["<p>畅通气道<\/p>", "<p>人工呼吸<\/p>", "<p>胸外心脏按压<\/p>", "<p>按压人中穴<\/p>", "", ""], "r": "ABC", "e": "【定位】第4章，4.4节，知识点4：触电事故及急救\n【解析】电事故一旦发生，需要进行合理的触电急救，主要包含两个环节：\n(1) 触电解救：凡遇到触电者，救护人员要采取最快的办法使触电者迅速脱离电源。如果距离电源开关或插座较近，当立即切断电源或者用干燥的竹竿或木棒打掉带电体使触电者脱离电源；救护者也可用绝缘钳或戴绝缘手套、穿绝缘鞋，将触电者拉离电源。千万不能赤手去拉触电者! \n(2) 紧急救护：在触电者脱离电源后，应立即进行现场紧急救护并及时报告医院。当触电者还未失去知觉时，应将他抬到空气流通的地方休息，不能让他乱走乱动。当触电者出现心脏停搏、无呼吸等假死现象时，应在现场采用人工呼吸或胸外挤压法进行抢救。决不能给休克者注射强心针剂。\n人工呼吸法适用于有心跳但无呼吸的触电者。首先将触电者仰卧在平地上，鼻孔朝天颈后仰。然后清理口鼻腔的阻塞物使其通畅，解扣松衣使触电者身体放松。做人工呼吸时，要捏住触电者鼻子，贴嘴吹气；松开鼻子让废气从鼻、口排出。每隔3～5S重复一次。\n胸外挤压法适用于有呼吸但无心跳的触电者。触电者仰卧在平地上，松扣解衣，救护者把一只手的中指对准凹膛，手掌平铺前胸，然后掌根用力下按，迫使心脏血液流出心房。突然松手，让血液流回心房。每隔1S重复一次。\n当触电者既无呼吸又无心跳时，可同时采用人工呼吸法和胸外挤压法进行急救。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8625", "t": 2, "q": "下列哪些是不安全用电习惯（     ）。", "a": ["<p>出门不关闭总电源<\/p>", "<p>不拔未充电状态的充电器<\/p>", "<p>插排平放在书桌面上<\/p>", "<p>空调线不够长用插排延长<\/p>", "", ""], "r": "BCD", "e": "【定位】第4章，4.4节，知识点6：安全用电常识\n【解析】电脑、充电器等使用完毕后应拔掉电源插头或关闭接线板上的开关；插拔电源插头时不要用力拉拽电线，以防止电线的绝缘层受损造成触电。\n电源接线板不应放在床上，应放在书桌等通风安全处，周围不要有易燃物品，也不要将接线板放在小杂物容易跌入或容易被水侵入的地方，电线不要与床架等金属物接触。接线板上不能接过多电源插头，禁止多个互接。\n寝室内无人情况下必须切断所有电源，尤其是插排，做到“人走断电”，防止发生火灾。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8626", "t": 2, "q": "当遇到电气火灾时，应该选用的灭火器类型为（     ）。", "a": ["<p>水基泡沫灭火器<\/p>", "<p>四氯化碳灭火器<\/p>", "<p>砂土<\/p>", "<p>二氧化碳灭火器<\/p>", "", ""], "r": "BCD", "e": "【定位】第4章，4.4节，知识点8：电气事故及紧急处理\n【解析】发生电火警时，最重要的是立即切断电源，然后救火，并及时报警。\n没有确切知道电源是否被切断时，绝不能用水或普通灭火器灭火，因为万一电源未被切断，就会造成触电。可选用四氯化碳灭火器、砂土等灭火。也可用二氧化碳灭火器灭火，但使用时应注意，不要喷射到人的皮肤或脸上，以防冻伤和使人窒息。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8627", "t": 3, "q": "无论是瞬时值还是相量值，对称三相电源三个相电压的和恒等于零，所以接上负载不会产生电流。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ABVzZqbTSZJYuCj05MTiwT0vio2WQ1kDDK6GhoxB.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8628", "t": 3, "q": "对称三相电路中三个线电压的瞬时值之和等于线电压。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/wuDKFLJSKzEcC6D3hw9MwgGC1C7GRcT2XEI0nO42.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8629", "t": 3, "q": "对称三相交流电源瞬时值之和恒等于零，有效值之和恒等于零。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/wy2U5ETWSDnxbteoIXcRubhHXl2TuByI59YFT9v1.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8630", "t": 3, "q": "三相交流电压（流）到达正最大值的先后次序称为相序。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/BDaFqoW5T1qm4CH5PWowXfEdf7m4eYPRlWtJAbhW.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8631", "t": 3, "q": "三相电源的相序有正序和负序。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/dO1h4c8NLmDsW5pcMqpqbSZ7hcO0Lta47FQJPVWf.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8632", "t": 3, "q": "<p>对称三相Y接电路中，线电压超前其对应的相电压30°。（ &nbsp;&nbsp;&nbsp;&nbsp;）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/nhaQnJxeqOqC5PWIKYc8FAa1Saxj31FkGXs9EeQY.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8633", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/qHCRsdOLtZvObcAdSU8W7JcbRwyIiN7tOpR5thbH.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/bB3sQyrIVmCELcix9TKatOmM6VLp01DKLu86465o.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8634", "t": 3, "q": "对于三角形电源，线电压对称，相电压也一定对称。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/dqGNyUhurazi0BE1FBQS3SApFkb4wNtDOmWDDlNL.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8635", "t": 3, "q": "三角形电源，是不能引出中性线。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ze8fczgud6bjTiQ9UKaPXcuBqGC3q4EfdR1kjfwe.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8636", "t": 3, "q": "<p>对称三相负载是指三相负载的阻抗模相等，阻抗角依次相差120°。（ &nbsp;&nbsp;&nbsp;&nbsp;）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/gbKoCkvRfsMnMFU92ormwCidYujqEZ8OvDYy0vV9.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8637", "t": 3, "q": "对于三相负载，每相负载中流过的电流是相电流，火线上流过的电流是线电流。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第4章，4.1节，知识点3：三相负载\n【解析】对称三相负载：\n1.对称三相负载：三相负载阻抗模相等，阻抗角相同。\n2.三相负载连接方式：Y形或△形。\n3.三相负载线电流与相电流的关系：线电流：火线上流过的电流。相电流：每相负载（或电源）中流过的电流。\n本题是对线电流与相电流的定义的考查。线电流是指火线上流过的电流；相电流是指每相负载（或电源）中流过的电流，因此本题题干所给的结论正确，选A。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8638", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/pZEkY3rTAeymWq8kM1sLedc0Go4zlrXaOB5MZooF.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/vo1GoeaNya4v47KcS7PeUbY7laJYEnmT01vyB7Tp.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8639", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/WuqFq3JSTNpxRMU1FyM4Qv96poFttaaFFlm8hJ6M.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/jQBacfnfZaRnVjVVtDq7RrrzjENS9ALgHQuLtK75.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8640", "t": 3, "q": "对于Y形连接的对称三相负载，线电流等于相应的相电流。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/gWrFwBxdJMb5PTHeRbqheRpZbVUFoxMkf9EMUGgO.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8641", "t": 3, "q": "三相电路中，电源和负载都可以为三角形连接或者是Y形连接。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/LLeV0B3S5tbL3f5Ab39hoNQng2ufUYUWSPaezJDJ.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8642", "t": 3, "q": "三相四线制三相电路中，中线可以使三相电路保持对称。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第4章，4.1节，知识点4：三相电路\n【解析】三相四线制三相电路的特征：\n对称三相电路是指对称三相电源、对称三相负载和对称三相线路阻抗组成的正弦电流电路。\n三相四线制电路中线相当于是一根接地线，为了保证三相电路的安全，决定不了对称性。对称三相电路是指对称三相电源、对称三相负载和对称三相线路阻抗组成的，不是有没有中线决定的。有中线，能保证负载相电压对称，不是负载对称，更不是电路对称。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8643", "t": 3, "q": "三相四线制对称三相电路中，中线的电流一定为零。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/n4gfLLAjU1R9LZMEsbuHS4WtbsHvGjV8xu8tXv1L.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8644", "t": 3, "q": "三相三线制线路中的电流，三相之间互相形成回路。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/TKlbuL7iVJ7RdxTAnWZ4YFWyWeD7M8IvfAscwX4H.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8645", "t": 3, "q": "对称三相电路可以取单相计算。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/YXiN7aHCyCNB4R2zJBYS0u3HN65TaKH0zh6O1L9i.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8646", "t": 3, "q": "中线的作用是使不对称Y形负载的相电压保持对称。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第4章，4.1节，知识点4：三相电路\n【解析】在Y形负载不对称的情况下中线的存在非常重要，它能强迫三相不对称负载的相电压保持对称，起到保证安全供电的作用。为防止中线断开，中线上禁止安装开关和熔断器。\n此题目主要考查三相四线制电路中，中线的作用。在Y形负载不对称的情况下中线的存在非常重要，它能强迫三相不对称负载的相电压保持对称，起到保证安全供电的作用。为防止中线断开，中线上禁止安装开关和熔断器。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8647", "t": 3, "q": "三相电路中为了保证负载的相电压对称，中线上不接熔断器或闸刀开关。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第4章，4.1节，知识点4：三相电路\n【解析】此题目主要考查三相四线制电路中，中线的作用。\n在Y形负载不对称的情况下中线的存在非常重要，它能强迫三相不对称负载的相电压保持对称，起到保证安全供电的作用。为防止中线断开，中线上禁止安装开关和熔断器。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8648", "t": 3, "q": "在电源对称的三相四线制电路中，若三相负载不对称，则该负载各相电压不对称。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第4章，4.1节，知识点4：三相电路\n【解析】此题目主要考查三相四线制电路中，中线的作用，负载不对称，但是有中线，它能强迫三相不对称负载的相电压保持对称。\n在Y形负载不对称的情况下中线的存在非常重要，它能强迫三相不对称负载的相电压保持对称，起到保证安全供电的作用。为防止中线断开，中线上禁止安装开关和熔断器。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8649", "t": 3, "q": "在三相电路中电源对称的情况下，能够通过中性点位移的情况来判断负载是否对称。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ELFhg6Wz0fk5y8Q28kaldgReKNxrlkTZ4KjPV4Hk.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8650", "t": 3, "q": "星形负载，线电压对称，相电压也一定对称。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/xDAi9hewiq9l9YUQvhrB4AQqQF5A7VRvqESTEZRP.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8651", "t": 3, "q": "对称三相电源，接不对称负载△形连接，因为线电流不对称，线电流的相量和不为0。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第4章，4.1节，知识点4：三相电路\n【解析】对称三相电源，接不对称负载△形连接，负载的线电压，相电压对称，但是负载不对称，所以线电流不对称。但是由基尔霍夫电流定律，线电流的相量和为0。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8652", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ss0S1MtnnWiAB5d2RlCqChEiZqn1wRViVrqeOw2B.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/BXO1WPdip1xTpHnvvQsJQMKhTqydrqLM4KDgPH74.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8653", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/5TkHuIfkoF2B43qUfpvMqNb9d8Nl5FvaPaBbDGtx.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/o0JT0nc28qK87yvdkTnNmK8lehW1hfEQ6tUp4t0M.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8654", "t": 3, "q": "三相对称交流电路的瞬时功率为一个随时间变化的量。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/iLfwQKUMYtKLaAKipwTZpLB17N7yq9v0UBTU8Ajs.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8655", "t": 3, "q": "三相电动机的稳定性高于单相电动机。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/DA6lj6osGIinvlt0qoARG7njMF2idItQ9BhGczdh.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8656", "t": 3, "q": "三相四线制电路无论对称与否，都可以用三瓦计法测量三相总有功功率。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/q3VhJwYe2FJ1EetrLxENLTvPPf5OKldAUBbtn72A.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8657", "t": 3, "q": "测量不对称三相电路的功率，用二瓦计法可以得到。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/cV6hmnIoVWuGuhjNtGT0MexULMIxoliwgzqyssOw.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8658", "t": 3, "q": "测量不对称三相电路的功率，只能使用三瓦计法。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ah0GavB0kh6WuW5kSlHKCkr4soXwt6WNHtAhA21q.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8659", "t": 3, "q": "用二瓦计法测量三相功率时，单只表的读数也是有意义的。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/5NpeUfhepDCyTilJjqX9xbHUeUH3rp8ykU89hziH.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8660", "t": 3, "q": "电力生产除了包含电能的产生、输送、变换与分配外，还包含电能的服务。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第4章，4.3节，知识点1：电能及其特点\n【解析】电力生产就是要把各种一次能源转换成电能，并且输送和分配到电力用户。从事电能生产、传输和销售的行业称为电力工业，简称电业。电力生产的任务就是向各种电力用户提供充足、可靠、合格、价格合理的电能和优质服务。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8661", "t": 3, "q": "按照我国的能源政策，火力发电燃料应该以劣质煤为主要燃料。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第4章，4.3节，知识点5：电力发电方式\n【解析】火力发电的燃料主要是自然界蕴藏的各种化石燃料，包括固体燃料（主要是煤炭）、液体燃料（主要是石油及其制品如重油、渣油、柴油等）、气体燃料（主要是天然气、液化石油气、煤层气及由煤炭转换的高炉煤气、焦炉煤气等）。按照我国的能源政策，火力发电燃料应该少用油，不用原油和天然煤气，而主要用煤，特别是劣质煤。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8662", "t": 3, "q": "太阳能发电主要包括太阳能光伏发电和太阳能热能发电两种。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第4章，4.3节，知识点5：电力发电方式\n【解析】太阳能发电分为太阳能光发电和太阳能热发电两类。前者是直接将太阳的光能转换为电能；后者是将太阳热能传递给介质，由介质热能转换为电能。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8663", "t": 3, "q": "当遇到跨步电压触电时，应该迅速跑离中心电场区域。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第4章，4.4节，知识点4：触电事故及急救\n【解析】绝缘靴：也是由绝缘性能良好的特种橡胶制成，带电操作高压或低压电气设备时防止跨步电压对人体的伤害。\n当人或牲畜走入断线点8m以内的电场时，由于前后脚之间有较高的电压引起触电，这种触电称为跨步触电。防止跨步触电的有效方法是原理电场区域，人一旦不小心进入，切记慌乱跑离，应采用单脚跳离或并步离开电场区域。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8664", "t": 3, "q": "安全电压36V的含义是，在36V以下对人体是绝对安全的。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第4章，4.4节，知识点4：触电事故及急救:\n【解析】国家规定安全电压额定值等级为42V，36V，24V，12V，6V。但必须注意，42V或36V并非绝对安全，在充满导电粉末、相对湿度较高或酸碱蒸气浓度大等情况下，可能发生触及36V电压而死亡的事故。在上述情况下，必须使用24V或更低等级的电压。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8665", "t": 3, "q": "当触电者出现心脏停搏、无呼吸等假死现象时，应在现场采用人工呼吸或胸外挤压法进行抢救，并迅速给休克者注射强心针剂。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第4章，4.4节，知识点4：触电事故及急救\n【解析】紧急救护：在触电者脱离电源后，应立即进行现场紧急救护并及时报告医院。当触电者还未失去知觉时，应将他抬到空气流通的地方休息，不能让他乱走乱动。当触电者出现心脏停搏、无呼吸等假死现象时，应在现场采用人工呼吸或胸外挤压法进行抢救。绝不能给休克者注射强心针剂。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}]}, {"k": "电工技术基础||第5章", "n": "电工技术基础 / 第5章", "qs": [{"id": "9366", "t": 1, "q": "<p>用一个标准电压表校准另一个电压表，标准电压表测量电路上某一个电阻上的电压为80V，用另一个电压表测量，读数为80.8V，该表的绝对误差为（ ）。<\/p>", "a": ["<p>0.8V<\/p>", "<p>-0.8V<\/p>", "<p>1%<\/p>", "<p>-1%<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/h8fbXwTrbjE8QiZd20AHpWftToHCDqujCIbOye4H.png\"><\/p>", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9367", "t": 1, "q": "要使测量精度更加精确，应该选择量程（     ）的仪表。", "a": ["<p>较大<\/p>", "<p>较小<\/p>", "<p>不确定<\/p>", "<p>均可以<\/p>", "", ""], "r": "B", "e": "【定位】第5章，5.1节，知识点2：误差\n【解析】量程越小，仪表盘上的刻度值越精度高，测量结果越准确。\n测量的误差要小是重要指标，首先量程选择要合适，所测值不能超过所选量程。再在量程内，应尽量使指针偏转角大一些。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9368", "t": 1, "q": "直流电流表应与被测电路（     ）联连接，并注意使电流从（     ）端流入，（     ）端流出。", "a": ["<p>串联，正，负<\/p>", "<p>串联，负，正<\/p>", "<p>并联，正，负<\/p>", "<p>并联，负，正<\/p>", "", ""], "r": "A", "e": "【定位】第5章，5.2节，知识点1：直流电流的测量\n【解析】电流表必须串接在被测电路中，电流流向必须是真实方向从“+”端子流入。\n同样，电压表必须并接在被测电路中，真实高电位接“+”端子。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9369", "t": 1, "q": "只能直接测量直流电压、电流的仪表是（     ）。", "a": ["<p>磁电系仪表<\/p>", "<p>电磁系仪表<\/p>", "<p>电动系仪表<\/p>", "<p>感应系仪表<\/p>", "", ""], "r": "A", "e": "【定位】第5章，5.2节，知识点1：直流电流的测量\n【解析】电磁系和电动系都能直接测交流与直流电量。\n磁电系仪表是直流表。交流电压表可测交直流电压，直流电压表不能测交流电压；交流电流表可测交直流电流，直流电流表不能测交流电流。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9370", "t": 1, "q": "扩大电压表量程需要（     ）。", "a": ["<p>串联电阻<\/p>", "<p>并联电阻<\/p>", "<p>串联电压源<\/p>", "<p>并联电压源<\/p>", "", ""], "r": "A", "e": "【定位】第5章，5.2节，知识点2：直流电压的测量\n【解析】串联分压，所以扩大电压表量程，要串联电阻。\n测量直流电压应使用磁电系直流电压表，电压表应与被测电路并联连接。由于磁电系测量机构允许流过的电流很小，它能测量的电压范围也很小，一般只有毫伏级。若要测量较高的电压，需要串联分压电阻，扩大其电压量程。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9371", "t": 1, "q": "某电压表表头电阻为2kΩ，表头允许的最大电压为20V，将量程扩大到100V，需要（     ）。", "a": ["<p>并联8kΩ电阻<\/p>", "<p>串联8kΩ电阻<\/p>", "<p>并联10kΩ电阻<\/p>", "<p>并联8kΩ电阻<\/p>", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点2：直流电压的测量\n【解析】电压表和电流表扩大量程是本章的重点之一。电压表串联大电阻扩大量程，电流表并联小电阻扩大量程。\n扩大量程的倍数为m=100/20=5倍，串联的电阻为2k的m-1倍为8kΩ。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9372", "t": 1, "q": "采用电压表前接法测量电阻时，测得电流1.5A，电压30V，电流表内阻2.5Ω，则被测电阻阻值（     ）。", "a": ["<p>48Ω<\/p>", "<p>32Ω<\/p>", "<p>24Ω<\/p>", "<p>17.5Ω<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/xlyQ1keSqIoALbtEOn0kYdWDnwS1ZN8x9VHJPQQO.png\"><\/p>", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9373", "t": 1, "q": "用电压表后接的伏安法测量某电阻，电压表内阻为1kΩ，读数为200V，电流表测得电流5A，则被测电阻为（     ）。", "a": ["<p>40Ω<\/p>", "<p>1KΩ<\/p>", "<p>38Ω<\/p>", "<p>42Ω<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/X0a39ojFYpyDIf5LDjwYzCHekDy6qGy8pVzXdFgd.png\"><\/p>", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9374", "t": 1, "q": "对于电动式功率表下列说法正确的是（     ）。", "a": ["<p>只能用于测量交流功率，不能测量直流功率<\/p>", "<p>只能用于测量直流功率，不能测量交流功率<\/p>", "<p>能够用于测量交流功率，也能测量直流功率<\/p>", "<p>所测功率为视在功率<\/p>", "", ""], "r": "C", "e": "【定位】第5章，5.3节，知识点2：交流功率的测量\n【解析】测量交流电路的功率使用电动系交流功率表，电动系功率表有固定和可动两个线圈。固定线圈1与负载串联，测量负载电流，又称为电流线圈。可动线圈2与较大的分压电阻串联后与负载并联，测量负载电压，又称为电压线圈。电动系功率表指针偏转角与负载有功功率成正比，也可以用来测量直流电路的功率。  \n电磁式交流表是利用电流的磁效应来测量的，即变化的电流产生变化的磁场，再通过线圈的互感作用使另一个线圈产生变化的电流，此时的电流比原先的电流小（这些是电磁式交流表的基本原理，也是目的），再测出小电流的大小来推算大电流的大小。而直流电电流方向不变，故而不会产生稳定的变化磁场，也就不能用电磁式交流表来测量它。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9375", "t": 2, "q": "使用电桥平衡测量电阻，测量完结果后，检测误差的方法有（     ）。", "a": ["<p>绝对误差<\/p>", "<p>相对误差<\/p>", "<p>引用误差<\/p>", "<p>附加误差<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章，5.1节，知识点2：误差\n【解析】绝对误差是测量结果与真值之差，有正误差和负误差，绝对误差=测量值-真值；相对误差是绝对误差与真值之比，以百分数表示，相对误差=绝对误差/真值×100%；引用误差是绝对误差与满量程之比，以百分数表示，引用误差=绝对误差/满量程 ×100%。\n附加误差时指当测量工作条件发生变化时，仪表本身的误差也会增加，这种因工作条件的变化而产生的误差，即为附加误差。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9376", "t": 2, "q": "按照工作原理，电压、电流测量仪器可以分为（     ）。", "a": ["<p>磁电系<\/p>", "<p>电磁系<\/p>", "<p>电动系<\/p>", "<p>感应系<\/p>", "", ""], "r": "ABCD", "e": "【定位】第5章，5.1节，知识点1：电工仪表\n【解析】按照工作原理，电压、电流测量仪器可以分为磁电系、电磁系、电动系、感应系。\n测量直流电流一般使用磁电系直流电流表。直流电流表的表盘上标有“-”符号，表示用于测量直流电量。在测量直流电流时应将直流电流表与被测电路串联连接。 \n交流电流、交流电压的测量一般常用电磁系仪表和电动系仪表，它们具有结构简单、价格低廉、过载能力强以及交直流两用等优点。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9377", "t": 2, "q": "磁电系仪表的优点是（     ）。", "a": ["<p>准确度高<\/p>", "<p>灵敏度高<\/p>", "<p>过载能力强<\/p>", "<p>允许通过的电流很小<\/p>", "", ""], "r": "ABD", "e": "【定位】第5章，5.2节，知识点1：直流电流的测量\n【解析】测量直流电流一般使用磁电系直流电流表。直流电流表的表盘上标有“-”符号，表示用于测量直流电量。在测量直流电流时应将直流电流表与被测电路串联连接。 磁电系仪表测量机构线圈导线很细，被测电流通过游丝导入，允许通过的电流很小，一般只有几十微安到几个毫安。故磁电系测量机构（表头）只能用作检流计、微安表和小量程的毫安表。若要测量较大的电流，需要并联分流电阻，扩大其电流量程。\n磁电系仪表的缺点是过载能力低，容易被烧坏。\n本题要掌握磁电系和电磁系仪表的特点。电磁系结构简单、价格低廉、过载能力强以及交直流两用等优点。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9378", "t": 2, "q": "在选择直流电流测量仪表测量时需要注意选择（     ），保证达到测量要求。", "a": ["<p>适当的型号<\/p>", "<p>适当的准确度<\/p>", "<p>适当的量程<\/p>", "<p>适当的测量电路<\/p>", "", ""], "r": "ABCD", "e": "【定位】第5章，5.2节，知识点1：直流电流的测量\n【解析】此题考查使用仪表测量时的注意事项。\n对各种测量仪表都有这些选择的要求。易错点：准确度是最大引用误差去掉正，负号及百分号。准确度等级是衡量仪表质量优劣的重要指标之一。级数越小，精度（准确度）就越高常用仪表的准确度等级：0.1 0.2 0.5 1.0 1.5 2.5 5.0。主要的注意事项：\n（1）测量电流时电流表必须串接在被测电路中，严禁将电流表并在被测电路两端。\n（2）直流电流表在测量电流时，电流从“+”端子流入，从“-”端子流出，以防指针反偏。\n（3）量程选择要合适。在许可的情况下，应尽量使指针偏转角大一些。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9379", "t": 2, "q": "测量交流电压时，应该用（     ）。", "a": ["<p>磁电式仪表<\/p>", "<p>电磁式仪表<\/p>", "<p>电动式仪表<\/p>", "<p>感应系仪表<\/p>", "", ""], "r": "BC", "e": "【定位】第5章，5.3节，知识点1：交流电流与交流电压的测量\n【解析】交流电流、交流电压的测量一般常用电磁系仪表和电动系仪表，它们具有结构简单、价格低廉、过载能力强以及交直流两用等优点。\n交流电压、交流电流的测量也可以用万用表的交流电压、交流电流档。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9380", "t": 2, "q": "测量交流电压时，下列说法正确的是（     ）。", "a": ["<p>准确读数可以减少测量的误差<\/p>", "<p>仪表本身消耗的功率越小越好<\/p>", "<p>选择仪表量程时为减小误差应选示值接近满量程的<\/p>", "<p>选择仪表时应该注意仪表的量程和准确度<\/p>", "", ""], "r": "ABCD", "e": "【定位】第5章，5.3节，知识点1：交流电流与交流电压的测量\n【解析】交流电流、交流电压的测量一般常用电磁系仪表和电动系仪表，它们具有结构简单、价格低廉、过载能力强以及交直流两用等优点。\n1.交流电流的测量\n用交流电流表测量交流电流，测量时电流表与被测电路串联。在测量较大的电流时，电磁系电流表和电动系电流表不采用分流电阻扩大量程，而是采用加粗线圈导线或改变匝数的方法获得不同的量程。多量程的交流电流表通常将固定线圈的绕组分段，再利用绕组的串并联改变量程。\n若测量更大（几千安、几万安）的交流电流，则要采用电流互感器将大电流变成小电流，再用交流电流表测量。电流互感器的次级绕组不允许开路。电流互感器次级绕组、铁芯都要可靠接地。电流互感器初级绕组应串联接入被测电路。\n2.交流电压的测量\n用交流电压表测量交流电压，测量时与被测电路并联。交流电压表与直流电压表一样也采用串联分压电阻扩大量程。多量程交流电压表可以采用线圈分段串并联或分压电阻分段改变量程。\n测量很高的交流电压时，应采用电压互感器将高电压变成低电压，在二次侧间接测量。电压互感器的次级绕组不允许短路。电压互感器初级绕组应与被测电路并联。电压互感器次级线圈、铁芯和外壳都要可靠接地。\n交流电压、交流电流的测量也可以用万用表的交流电压、交流电流档。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9381", "t": 2, "q": "采用单相功率表测量三相电路的功率时，可以采用（     ）。", "a": ["<p>一表法<\/p>", "<p>三表法<\/p>", "<p>二表法<\/p>", "<p>四表法<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章，5.2节，知识点2：交流功率的测量\n【解析】使用单相功率表测量三相电路的功率，一表法指分别测量三个相的功率然后加起来。二表法是三相电路中常用的方法，三表法与一表法类似。\n从电动系交流功率的结构和工作原理可知一表法、三表法中每个表测量一个相的有功功率。二表法中每只表的读数不代表某一相的功率，但两只表的读数代数和就是三相有功功率。单独一只表的读数没有意义。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9382", "t": 2, "q": "对于交流功率表下列说法正确的是（     ）。", "a": ["<p>用于测量交流功率<\/p>", "<p>用于测量直流功率<\/p>", "<p>只能够用于测量交流功率<\/p>", "<p>只能测量直流功率<\/p>", "", ""], "r": "AB", "e": "【定位】第5章，5.2节，知识点2：交流功率的测量\n【解析】此题考查测量功率时仪表的选择。交流量必须用交流仪表测量，直流量可以用交流仪表和直流仪表测量。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9383", "t": 2, "q": "交流功率表正确的描述有（     ）。", "a": ["<p>电压线圈标“*”号的端子必须接到电源一端，另一端子接至负载<\/p>", "<p>电压线圈需与负载阻抗串联<\/p>", "<p>电压量程、电流量程、功率量程都不能超载使用<\/p>", "<p>电动系功率表也可以用来测量直流电路的功率<\/p>", "", ""], "r": "CD", "e": "【定位】第5章，5.2节，知识点2：交流功率的测量\n【解析】1.交流功率表\n测量交流电路的功率使用电动系交流功率表，电动系功率表有固定和可动两个线圈。固定线圈1与负载串联，测量负载电流，又称为电流线圈。可动线圈2与较大的分压电阻串联后与负载并联，测量负载电压，又称为电压线圈。电动系功率表指针偏转角与负载有功功率成正比，也可以用来测量直流电路的功率。\n功率表的量程由电流和电压量程决定，选择不同的电流量程和电压量程可以使功率表有多个量程。功率表的电流量程通过电流线圈的串、并联改变，电压量程通过改变分压电阻实现。\n2.注意事项\n（1）正确选用量程：使用时不仅要注意功率量程，还要看电压、电流量程，不能超载使用，否则会损坏功率表。\n（2）正确接线：电流线圈标“*”号的端子必须接到电源一端，另一端子接至负载。功率表有两种正确的接线方法，电压线圈前接用于测量负载阻抗较大的情况，电压线圈后接用于测量负载阻抗较小的情况。由于电流线圈的损耗一般较小，故多采用电压线圈前接方法。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9384", "t": 2, "q": "测量电阻参数可以使用（     ）。", "a": ["<p>伏安法<\/p>", "<p>单电桥法<\/p>", "<p>双电桥法<\/p>", "<p>万用表<\/p>", "", ""], "r": "ABCD", "e": "【定位】第5章，5.3节，知识点3：交流参数L、C的测量\n【解析】精确测量电路参数可以使用电桥。交流电阻、自感、互感、电容等交流参数可以用交流电桥测量，交流电桥有电感电桥、电容电桥、万用电桥和变压器电桥等。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9385", "t": 2, "q": "关于万用表测量电阻的描述正确的是（     ）。", "a": ["<p>万用表欧姆档的总内阻又称中值电阻<\/p>", "<p>.欧姆表的刻度是不均匀的，并且是反向的<\/p>", "<p>可以在被测电阻带电的状态下用万用表测量电阻<\/p>", "<p>改变倍率档位后必须进行欧姆调零，即将两表笔短接，调节欧姆调零旋钮，使指针指在欧姆零位上<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/TkaphWL3JLBIoQwO7PIrlHxzRcnYsQG2RSAApo6I.png\"><\/p>", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9386", "t": 2, "q": "关于万用表说法正确的是（     ）。", "a": ["<p>测量电流时，分流电阻与读数无关<\/p>", "<p>测量电流时，分流电阻越小量程越大<\/p>", "<p>测量电阻时，偏转角度越小读数越大<\/p>", "<p>测量电阻时，偏转角度越大读数越大<\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/RYgxdTGfxzfP7XlkoPkriXudbEL3YWtUSPoKpqAa.png\"><\/p>", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9387", "t": 2, "q": "兆欧表主要用于测量（     ）电阻。", "a": ["<p>绝缘<\/p>", "<p>中值<\/p>", "<p>高值<\/p>", "<p>低值<\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/VjguYQBSekw5p8kHPWgqRDXZTmlJ42tbtzYHEr00.png\"><\/p>", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9388", "t": 2, "q": "直流单电桥和直流双电桥分别用于测量范围为（     ）Ω电阻。", "a": ["<p>1~10<sup>6<\/sup><\/p>", "<p>10<sup>-5<\/sup>~1<\/p>", "<p>10~10<sup>4<\/sup><\/p>", "<p>5~10<sup>3<\/sup><\/p>", "", ""], "r": "AB", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/bQWwFnpfr9j2DnakZ2vHIvguTd0dHAYUAJdM2K0H.png\"><\/p>", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9389", "t": 3, "q": "磁电系电流仪表的准确度高，灵敏度低（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第5章，5.2节，知识点1：直流电流的测量\n【解析】需要理解不同工作原理的仪表有不同的物理特点，类似知识点有：电磁式仪表具有结构简单、价格低廉、过载能力强以及交直流两用等特点。磁电系仪表的灵敏度高。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9390", "t": 3, "q": "测量电动机的绝缘电阻时要采用兆欧表。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/U7FEJ0BqeKqwDxRRAvEnZy7dOcHAi3OmaMgkKKBU.png\"><\/p>", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9391", "t": 3, "q": "测量千安级的交流电流，要采用电流互感器，电流互感器的次级绕组不允许开路。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第5章，5.3节，知识点1：交流电流与交流电压的测量\n【解析】用交流电流表测量交流电流，测量时电流表与被测电路串联。在测量较大的电流时，电磁系电流表和电动系电流表不采用分流电阻扩大量程，而是采用加粗线圈导线或改变匝数的方法获得不同的量程。多量程的交流电流表通常将固定线圈的绕组分段，再利用绕组的串并联改变量程。\n若测量更大（几千安、几万安）的交流电流，则要采用电流互感器将大电流变成小电流，再用交流电流表测量。电流互感器的次级绕组不允许开路。电流互感器次级绕组、铁芯都要可靠接地。电流互感器初级绕组应串联接入被测电路。\n电流互感器可以利用变压器原理将大电流转换为小电流测量。电流互感器初级绕组应串联接入被测电路；次级绕组、铁芯都要可靠接地，电流互感器的次级绕组不允许开路。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9392", "t": 3, "q": "万用表、电磁系电压表、磁电系电压表、电压互感器都是测量交流电压仪表。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第5章，5.3节，知识点1：交流电流与交流电压的测量\n【解析】交流电流、交流电压的测量一般常用电磁系仪表和电动系仪表，它们具有结构简单、价格低廉、过载能力强以及交直流两用等优点。\n交流电压的测量\n用交流电压表测量交流电压，测量时与被测电路并联。交流电压表与直流电压表一样也采用串联分压电阻扩大量程。多量程交流电压表可以采用线圈分段串并联或分压电阻分段改变量程。\n测量很高的交流电压时，应采用电压互感器将高电压变成低电压，在二次侧间接测量。电压互感器的次级绕组不允许短路。电压互感器初级绕组应与被测电路并联。电压互感器次级线圈、铁芯和外壳都要可靠接地。\n交流电压、交流电流的测量也可以用万用表的交流电压、交流电流档。 \n交流电压的测量可以用万用表的交流电压档；电磁系电压表是交流电压表、磁电系电压表是直流电压表，不能用来测量交流电压；电压互感器可以测量交流高压。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9393", "t": 3, "q": "在用功率表等仪表进行测量时，应该先注意仪表的量程和准确度。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第5章，5.3节，知识点2：交流功率的测量\n【解析】无论测量什么参数，应该首先估计所需要仪表的量程，若超过仪表所测量程可能会烧坏表盘。\n功率表对量程的要求有：电压量程、电流量程、功率量程都不能超过。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}, {"id": "9394", "t": 3, "q": "交流电感、交流电容等参数不能用交流电桥测量。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第5章，5.3节，知识点3：交流参数L、C的测量\n【解析】交流电阻、自感、互感、电容等交流参数可以用交流电桥测量，交流电桥有电感电桥、电容电桥、万用电桥和变压器电桥等。\n电感电桥测电感，电容电桥测电容。", "l3": "电工技术基础", "l4": "第5章", "ap": [false, false, false, false, false, false]}]}, {"k": "电工技术基础||第6章-考纲删除", "n": "电工技术基础 / 第6章-考纲删除", "qs": [{"id": "9395", "t": 1, "q": "共模信号是两个输入端信号的（     ）。", "a": ["<p>差<\/p>", "<p>和<\/p>", "<p>平均值<\/p>", "<p>和的两倍<\/p>", "", ""], "r": "C", "e": "【定位】第6章，6.2节，知识点1：工作原理。\n【解析】1.考点：差分放大电路中共模信号的定义。\n        2.差分放大电路的共模信号是两个输入端信号的平均值。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9396", "t": 1, "q": "在多级直接耦合放大电路中，导致零点漂移最为严重的是（     ）。", "a": ["<p>第一级的漂移<\/p>", "<p>中间级漂移<\/p>", "<p>末级漂移<\/p>", "<p>不能确定<\/p>", "", ""], "r": "A", "e": "【定位】第6章，6.2节，知识点2：抑制零点漂移的原理。\n【解析】1.考点：多级耦合放大电路静态工作。\n        2.由多级耦合放大电路的静态工作点分析图可知导致零点漂移最为严重的是第一级的漂移。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9397", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/8CakFOPdETnqeFuRrimnvy4qCC3FBRa6arFu6mzh.png\"><\/p>", "a": ["<p>电路具有对称性<\/p>", "<p>采用恒流源供电<\/p>", "<p>级间采用直接耦合<\/p>", "<p>采用集成电路设计<\/p>", "", ""], "r": "A", "e": "【定位】第6章，6.2节，知识点2：抑制零点漂移的原理。\n【解析】在差分式电路中，无论是温度变化，还是电源电压的波动都会引起两管集电极电流以及相应的集电极电压相同的变化，其效果相当于在两个输入端加入了共模信号，由于电路的对称性和恒流源偏置，在理想情况下，可使输出电压不变，从而抑制了零点漂移。当然，在实际情况下，要做到两管电路完全对称和理想恒流源是比较困难的，但是输出漂移电压将大为减小。由于这个缘故，所以差分式放大电路特别适用于作多级直接耦合放大电路的输入级。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9398", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/wAN0VuZcLRWHUABh2lKQBfFo661QgIU6GjP2LKBI.png\"><\/p>", "a": ["<p>放大倍数越稳定<\/p>", "<p>交流放大倍数越大<\/p>", "<p>抑制温漂能力越强<\/p>", "<p>输入信号中的差模成分越大<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/SjcGJHfIgPavsH9Bk1FOa2PSbKbkQPaEfLvb3gpp.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9399", "t": 1, "q": "差动放大电路的主要特点是（     ）。", "a": ["<p>有效放大差模信号，有力抑制共模信号<\/p>", "<p>既放大差模信号，又放大共模信号<\/p>", "<p>有效放大共模信号，有力抑制差模信号<\/p>", "<p>既抑制差模信号，又抑制共模信号<\/p>", "", ""], "r": "A", "e": "【定位】第6章，6.2节，知识点1：工作原理。\n【解析】1.考点：差动放大电路的主要特点。\n        2.差动放大电路的主要特点是有效放大差模信号，有力抑制共模信号。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9400", "t": 1, "q": "集成运放电路采用直接耦合方式是因为（     ）。", "a": ["<p>可获得较高增益<\/p>", "<p>可使温漂变小<\/p>", "<p>在集成工艺中难于制造大电容<\/p>", "<p>可以增大输入电阻<\/p>", "", ""], "r": "C", "e": "【定位】第6章，6.3节.，知识点1：集成运算放大器的组成。\n【解析】1.考点：集成运放电路采用直接耦合方式的原因。\n        2.集成运放电路采用直接耦合方式的原因是在集成工艺中难于制造大电容，会使温漂变大。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9401", "t": 1, "q": "集成运放制作工艺使得同类半导体管的（     ）。", "a": ["<p>放大倍数大<\/p>", "<p>输入电阻高<\/p>", "<p>输出电阻小<\/p>", "<p>指标参数一致性好<\/p>", "", ""], "r": "D", "e": "【定位】第6章，6.3节.，知识点1：集成运算放大器的组成。\n【解析】1.考点：集成运放制作工艺的特点。\n        2.集成运放制作工艺使得同类半导体管的指标参数一致性好。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9402", "t": 1, "q": "差动放大电路中所谓共模信号是指两个输入信号电压（     ）。", "a": ["<p>大小相等、极性相同<\/p>", "<p>大小相等、极性相反<\/p>", "<p>大小不等、极性相同<\/p>", "<p>大小不等、极性相反<\/p>", "", ""], "r": "A", "e": "【定位】第6章，6.2节，知识点1：工作原理。\n【解析】1.考点：共模信号的特点。\n        2.差动放大电路中所谓共模信号是指两个输入信号电压大小相等、极性相同。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9403", "t": 1, "q": "差分放大电路的差模信号是两个输入端信号的（     ）。", "a": ["<p>差<\/p>", "<p>和<\/p>", "<p>平均值<\/p>", "<p>差的两倍<\/p>", "", ""], "r": "A", "e": "【定位】第6章，6.2节，知识点1：工作原理。\n【解析】1.考点：差分放大电路中差模信号的定义。\n        2.差分放大电路的差模信号是两个输入端信号的差。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9404", "t": 1, "q": "同一差动放大电路中，采用（     ）方式使得共模抑制比最大。", "a": ["<p>单端输入<\/p>", "<p>双端输入<\/p>", "<p>单端输出<\/p>", "<p>双端输出<\/p>", "", ""], "r": "D", "e": "【定位】第6章，6.2节，知识点3：主要技术指标。\n【解析】1.考点：差动放大电路的四种不同接法的特点。\n        2.同一差动放大电路中，采用双端输出方式使得共模抑制比最大。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9405", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/mzQFUsCBCXsvCpqYaAk5ROoaoE0TkcaeZOlxD5Zm.png\"><\/p>", "a": ["<p>0<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/EZWBN4s56wiYsn4gXgSAK8XZTe0wPl8MgatUhUzJ.png\"><\/p>", "<p>∞<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/0G8NdEuwdiKwb1B92lEDwEQQ1V2qddNvRaXKN4JG.png\"><\/p>", "", ""], "r": "A", "e": "<p><img src=\"h mg src=\"https://dati.gwzpks.com/uploads/20260717/ulxWDVmWdNEM1oDHzcO1TNDdZsyO8xX4r2C1VJ1x.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9427", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/tv0X5lgyprw7rGcSkwmD8ICs2YhNdLiaXg0fOHG1.png\"><\/p>", "a": ["<p>反相比例电路<\/p>", "<p>同相比例电路<\/p>", "<p>电压跟随器<\/p>", "<p>加法运算电路<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/r7qY4l9hykCleUXqAsc0kCR28NkubdjHGedASFdp.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9428", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Dhw5ZMGjsnZX8dnoxRw5nToAU9vqCAUEet4Rl71w.png\"><\/p>", "a": ["<p>反相比例运算<\/p>", "<p>同相比例运算<\/p>", "<p>积分<\/p>", "<p>反相加法<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2mfSQeN5hQWbGr3e51pVoe20avQKzE4LuxPNlSKq.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9429", "t": 1, "q": "反相比例运算电路的比例系数（     ）。", "a": ["<p>大于等于1<\/p>", "<p>小于1<\/p>", "<p>小于0<\/p>", "<p>无穷大<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/zQQ2O7dcsqzHt0zHmFgW3qhi4Hg9c4X559atS0nW.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9430", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/p2B5NSGXS9UuOWqDlfg4AkKJk7sTVKUoa2vOdGDH.png\"><\/p>", "a": ["<p>-100mv<\/p>", "<p>110mv<\/p>", "<p>100mv<\/p>", "<p>-10mv<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/w4MyiSCrKJK4PV8LznkhMOeDWeOGF4rAmrR2Dfn6.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9431", "t": 1, "q": "（     ）运算电路可实现函数Y＝aX1＋bX2＋cX3，a、b和c均小于零。", "a": ["<p>同相比例<\/p>", "<p>加减<\/p>", "<p>同相求和<\/p>", "<p>反相求和<\/p>", "", ""], "r": "D", "e": "【定位】第6章，6.5节，知识点2：加减运算电路。\n【解析】根据函数Y＝aX1＋bX2＋cX3可知，a、b和c均小于零，应选用反相求和运算电路。选项A输出与输入同相，输出只有1项；选项B： a、b和c中有大于零的，也有小于零的；选项D中a、b和c均小于零。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9432", "t": 1, "q": "同相求和运算器的各输入端接一反相器，即构成一（     ）运算器。", "a": ["<p>反相求和<\/p>", "<p>同相求和<\/p>", "<p>反相减法<\/p>", "<p>同相减法<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/rY5JBfTHhqCoqTRRQJ67tpT3abDmMcMQfRtMu135.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9433", "t": 1, "q": "要把方波变换为三角波，需要采用的运算电路是（     ）。", "a": ["<p>反相比例<\/p>", "<p>同相比例<\/p>", "<p>积分<\/p>", "<p>微分<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Gz2WGzvUVgwzG5WBaeP9z6mvqzN4d9HJxs4fJEIF.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9434", "t": 1, "q": "某电路有用信号频率为2kHz，可选用（     ）。", "a": ["<p>低通滤波器<\/p>", "<p>高通滤波器<\/p>", "<p>带通滤波器<\/p>", "<p>带阻滤波器<\/p>", "", ""], "r": "C", "e": "【定位】第6章，6.6节，知识点1：滤波电路的定义与分类。\n【解析】1.考点：几种常见滤波器的特点。\n        2.带通滤波器：只让某段频率范围内的信号通过。若没说是低于（选低通）或高于（选高通）某频率，只说某个频率则选带通滤波器。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9435", "t": 1, "q": "带阻滤波器不能使（     ）信号通过。", "a": ["<p>高频段<\/p>", "<p>低频段<\/p>", "<p>高、低频段<\/p>", "<p>某一频段<\/p>", "", ""], "r": "D", "e": "【定位】第6章，6.6节，知识点1：滤波电路的定义与分类。\n【解析】1.考点：带组滤波器的特点。\n        2.带阻滤波器能使高、低频段信号通过，不能使某一频段信号通过。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9436", "t": 1, "q": "实际电路中若要求有效信号为20Hz-20KHz的音频信号，消除其他频率的干扰及噪声，应选用（     ）滤波电路。", "a": ["<p>低通<\/p>", "<p>高通<\/p>", "<p>带通<\/p>", "<p>带阻<\/p>", "", ""], "r": "C", "e": "【定位】第6章，6.6节，知识点1：滤波电路的定义与分类。\n【解析】1.考点：滤波器的特点。\n        2.带通滤波器不能使高、低频段信号通过，能使某一频段信号通过。要求有效信号为20Hz-20KHz的音频信号，为某一频带的信号，所以选用带通滤波电路。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9437", "t": 1, "q": "为了获得输入电压中的低频信号，应选用（     ）滤波电路。", "a": ["<p>高通<\/p>", "<p>低通<\/p>", "<p>带通<\/p>", "<p>带阻<\/p>", "", ""], "r": "B", "e": "【定位】第6章，6.6节，知识点1：滤波电路的定义与分类。\n【解析】1.考点：滤波器的特点。\n        2.为了获得输入电压中的低频信号，应选用低通滤波电路。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9438", "t": 1, "q": "抑制频率为100Hz以下的低频干扰，应采用（     ）类型的滤波电路。", "a": ["<p>低通<\/p>", "<p>高通<\/p>", "<p>带通<\/p>", "<p>带阻<\/p>", "", ""], "r": "B", "e": "【定位】第6章，6.6节，知识点3：高通滤波电路。\n【解析】根据高通滤波电路的理想幅频特性可知，低于某一频段信号不能通过，高于某一频段的信号能够通过，此题100Hz以下的低频干扰不能通过，所以应选用高通滤波电路。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9439", "t": 1, "q": "带通滤波器的RC网络可视为低通RC网络与高通RC网络的（     ）组合。", "a": ["<p>串联<\/p>", "<p>并联<\/p>", "<p>串并联<\/p>", "<p>桥接<\/p>", "", ""], "r": "A", "e": "【定位】第6章，6.6节，知识点4：带通滤波电路。\n【解析】1.考点：带通滤波器的特点。\n        2.带通滤波器的RC网络可视为低通RC网络与高通RC网络的串联组合。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9440", "t": 1, "q": "若要求有效抑制50Hz的工频干扰，应选用（     ）滤波电路。", "a": ["<p>低通<\/p>", "<p>高通<\/p>", "<p>带通<\/p>", "<p>带阻<\/p>", "", ""], "r": "D", "e": "【定位】第6章，6.6节，知识点5：带阻滤波器\n【解析】1.考点：滤波器的特点。\n        2.带阻滤波器能使高、低频段信号通过，不能使某一频段信号通过。有效抑制50Hz的工频干扰，即不能使50Hz的工频干扰通过，所以选用带阻滤波器。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9441", "t": 2, "q": "<p>差动放大器有3种形式，它们分别是（ ）。<\/p>", "a": ["<p>基本形式<\/p>", "<p>长尾式<\/p>", "<p>恒流源式<\/p>", "<p>反馈式<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，6.2节，知识点1：工作原理。\n【解析】1.考点：差动放大器的3种形式。\n        2.差动放大器有3种形式，它们分别是基本形式、长尾式、恒流源式。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9442", "t": 2, "q": "对差分放大电路而言，下列说法正确的为（     ）。", "a": ["<p>可以用作直流放大器<\/p>", "<p>可以用作交流放大器<\/p>", "<p>具有很强的放大差模信号的能力<\/p>", "<p>具有很强的放大共模信号的能力<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，6.2节，知识点1：工作原理。\n【解析】1.考点：差动放大器的工作原理\n        2.差动放大电路可以用作直流放大器、也可以用作交流放大器，具有很强的放大差模信号和抑制共模信号的能力，所以答案为ABC。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9443", "t": 2, "q": "差动放大电路中所谓差模信号是指两个输入信号电压（     ）。", "a": ["<p>大小相等<\/p>", "<p>大小不等<\/p>", "<p>极性相同<\/p>", "<p>极性相反<\/p>", "", ""], "r": "AD", "e": "【定位】第6章，6.2节，知识点1：工作原理。\n【解析】差动放大电路中所谓共模信号是指两个输入信号电压大小相等、极性相同。差动放大电路中所谓差模信号是指两个输入信号电压大小相等、极性相反。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9444", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/bWHLcKbhZ7ZifoTaFmEmPumZa2T6YgDIEk8trn3C.png\"><\/p>", "a": ["<p>温漂越大<\/p>", "<p>抑制温漂能力越强<\/p>", "<p>对差模信号的放大能力越强<\/p>", "<p>对共模信号的放大能力越强<\/p>", "", ""], "r": "AD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/uyhVAKUuJAO5LrI0kblO2lNckzdcCQPydCnCfaRz.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9445", "t": 2, "q": "集成电路的特点有（     ）。", "a": ["<p>体积小<\/p>", "<p>重量轻<\/p>", "<p>功耗高<\/p>", "<p>可靠性好<\/p>", "", ""], "r": "ABD", "e": "【定位】第6章，6.3节，知识点1：集成运算放大器的组成。\n【解析】1.考点：集成电路的特点\n        2.集成电路具有体积小、重量轻、功耗低、可靠性好、价格便宜等特点。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9446", "t": 2, "q": "集成运算放大器的特点（     ）。", "a": ["<p>高增益<\/p>", "<p>低可靠性<\/p>", "<p>低成本<\/p>", "<p>小尺寸<\/p>", "", ""], "r": "ACD", "e": "【定位】第6章，6.3节，知识点1：集成运算放大器的组成。\n【解析】1.考点：集成运算放大器的特点。\n        2.集成运算放大器的特点：高增益、高可靠性、低成本、小尺寸。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9447", "t": 2, "q": "关于理想运算放大器的正确叙述是（     ）。", "a": ["<p>输入阻抗为无穷大，输出阻抗为零<\/p>", "<p>输入信号为零时，输出处于零电位<\/p>", "<p>共模抑制比为0<\/p>", "<p>开环电压放大倍数无穷大<\/p>", "", ""], "r": "ABD", "e": "【定位】第6章，6.4节，知识点1：理想运算放大器模型。\n【解析】理想运放的输入电阻、开环差模电压放大倍数、共模抑制比都为，输出电阻为0Ω。选项B输入信号为零，输出信号等于输入信号*放大倍数，所以输出也为0. 选项C共模抑制比应为无穷大。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9448", "t": 2, "q": "关于理想集成运放的输入电阻和输出电阻论述不正确的是（     ）。", "a": ["<p>输入电阻为∞，输出电阻为0<\/p>", "<p>输入电阻为0，输出电阻为∞<\/p>", "<p>输入电阻和输出电阻均为∞<\/p>", "<p>输入电阻和输出电阻均为0<\/p>", "", ""], "r": "BCD", "e": "【定位】第6章，6.4节，知识点1：理想运算放大器模型。\n【解析】理想运放的输入电阻、开环差模电压放大倍数、共模抑制比都为，输出电阻为0Ω。所以选项A正确，其他BCD选项不正确。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9449", "t": 2, "q": "同相比例运算电路的比例系数包括（     ）。", "a": ["<p>大于1<\/p>", "<p>小于1<\/p>", "<p>等于1<\/p>", "<p>0<\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/EOaGEL20sbWin5LGsNUg3VSyLQEM6IaG923JMMJe.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9450", "t": 2, "q": "常见的滤波器有哪些？（     ）", "a": ["<p>低通滤波器<\/p>", "<p>高通滤波器<\/p>", "<p>带通滤波器<\/p>", "<p>带阻滤波器<\/p>", "", ""], "r": "ABCD", "e": "【定位】第6章，6.6节，知识点1：滤波电路的定义与分类。\n【解析】1.考点：滤波器的特点。\n        2.常见的滤波器有低通、高通、带通、带阻滤波器。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9451", "t": 2, "q": "带阻滤波器能使（     ）信号通过。", "a": ["<p>高频段<\/p>", "<p>低频段<\/p>", "<p>整个频段<\/p>", "<p>某一频段<\/p>", "", ""], "r": "AB", "e": "【定位】第6章，6.6节，知识点5：带阻滤波器。\n【解析】带阻滤波器是使某一频段的信号不通过，而高、低频段的信号能通过，注意题干为“能”，所以答案为AB。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9452", "t": 2, "q": "在由运放组成的电路中，运放工作在线性状态的电路是（     ）。", "a": ["<p>反相放大器<\/p>", "<p>差值放大器<\/p>", "<p>有源滤波器<\/p>", "<p>电压比较器<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，6.5节，知识点1和6.6节的知识点1。\n【解析】1.考点：集成运放工作在线性区和非线性区的特点。\n        2.电压比较器其运放工作在非线性状态即饱和状态。其他3种电路都是工作在线性状态。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9453", "t": 3, "q": "双端输入双端输出差动放大器在结构上具备对称性，在功能上能够放大差模信号抑制共模信号的输出。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第6章，6.2节，知识点1：工作原理。\n【解析】1.考点：理想运放的“虚短”和“虚断”。\n        2.双端输入双端输出差动放大器在结构上具备对称性，在功能上能够放大差模信号抑制共模信号的输出。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9454", "t": 3, "q": "差动放大电路的AVD越大越好，而AVC则越小越好。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/XUPpdeRSy7c4s1SukKRhpueLscuQm5EygxwzdURz.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9455", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/JOzcyQgjHHvwTtyjAApmNeYLpT0l53G9JXhnxoxd.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/QlVFbn663iz7VtPGxXd4PkARkZ1tWPcR9BQgyrQO.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9456", "t": 3, "q": "<p>在长尾式差放电路中，长尾电阻R<sub>E<\/sub>的作用是减小差模放大倍数。（ ）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】】第6章，6.2节，知识点3：主要技术指标计算。\n【解析】1.考点：长尾式差放电路的特点。\n        2.在长尾式差放电路中，长尾电阻RE的作用是减小共模放大倍数。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9457", "t": 3, "q": "集成运放输入级由差分放大电路组成。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第6章，6.3节，知识点1：集成运算放大器的组成。\n【解析】1.考点：集成运放的组成部分。\n        2.集成运放输入级由差分放大电路组成。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9458", "t": 3, "q": "集成运放构成放大电路不但能放大交流信号，也能放大直流信号。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第6章，6.3节，知识点2：集成运放的主要技术指标。\n【解析】1.考点：集成运放的特点。\n        2.集成运放是一个高放大倍数的多级放大电路，其构成放大电路不但能放大交流信号,也能放大直流信号。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9459", "t": 3, "q": "理想运放的开环差模电压放大倍数越大越好，最好是无穷大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/mYiqtZhLznC3dkFIRGNouDB5n1o0lTr5shaWnNtr.png\"><\/p>", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9460", "t": 3, "q": "一个实际集成运放，其开环增益越高，输入阻抗越小，共模抑制比越高，就越接近理想运放。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第6章，6.4节，知识点1：理想运算放大器模型\n【解析】1.考点：理想运算放大器模型。\n        2.一个实际集成运放，其开环增益越高，输入阻抗越大，共模抑制比越高，就越接近理想运放。题目中输入阻抗越小是错误的。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9461", "t": 3, "q": "理想运算放大器在应用时总是具有“虚断”和“虚短”特性。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第6章，6.4节，知识点2：理想运放的“虚短”和“虚断”。\n【解析】1.考点：理想运放的“虚短”和“虚断”。\n        2.集成运放工作在非线性区即饱和区时，不存在“虚短”特性，但存在“虚断”的特性。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9462", "t": 3, "q": "凡是运算电路都可利用“虚短”和“虚断”的概念求解运算关系。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第6章，6.4节，知识点2：理想运放的“虚短”和“虚断”。\n【解析】1.考点：理想运放的“虚短”和“虚断”。\n        2. 凡是运算电路（即工作在线性区）都可利用“虚短”和“虚断”的概念求解运算关系。集成运放工作在非线性区即饱和区时，不能用“虚短”的概念加以分析，可以用“虚断”的概念加以分析。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9463", "t": 3, "q": "当集成运放工作在非线性区时，输出电压不是高电平，就是低电平。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第6章，6.4节，知识点2：理想运放的“虚短”和“虚断”。\n【解析】1.考点：当集成运放工作在非线性区时，输出电压的可能情况。\n        2.当集成运放工作在非线性区时，输出电压一般不是高电平就是低电平。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9464", "t": 3, "q": "凡是集成运放构成的电路，都可以用“虚断”、“虚短”的概念加以分析。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第6章，6.4节，知识点2：理想运放的“虚短”和“虚断”。\n【解析】1.考点：理想运放的“虚短”和“虚断”。\n        2.集成运放工作在非线性区即饱和区时，不能用“虚短”的概念加以分析，可以用“虚断”的概念加以分析。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9465", "t": 3, "q": "在运算电路中，集成运放的反相输入端均为虚地。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第6章，6.4节，知识点2：理想运放的“虚短”和“虚断”。\n【解析】1.考点：理想运放的“虚短”和“虚断”。\n        2.集成运放的反相输入端不一定为虚地，例如反相比例运算电路其反相输入端虚地，同相比例运算电路其反相输入端不虚地。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9466", "t": 3, "q": "同相比例运算电路输入信号与输出信号同相。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第6章，6.5节，知识点1：比例运算电路。\n【解析】1.考点：同相比例运算电路的特点。\n        2.同相比例运算电路输入信号与输出信号同相。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9467", "t": 3, "q": "只要理想运放工作在线性区，就可以认为其两个输入端“虚地”。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第6章，6.5节，知识点1：比例运算电路。\n【解析】1.考点：集成运放虚短与虚地的概念。\n        2.只要理想运放工作在线性区，可以认为其两个输入端“虚短”，但不一定虚地。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9468", "t": 3, "q": "滤波器的截止频率是指通带和阻带的界限频率。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第6章，6.6节，知识点1：滤波电路的定义与分类。\n【解析】1.考点：滤波器的特点。\n        2.滤波器的截止频率是指通带和阻带的界限频率。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9469", "t": 3, "q": "<p>某放大电路f<sub>L<\/sub>=50Hz，f<sub>H<\/sub>=2kHz，则输入100Hz~4kHz的音频信号时输出会产生频率失真。（ &nbsp;&nbsp;&nbsp;&nbsp;）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第6章，6.6节，知识点4：带通滤波器。\n【解析】1.考点：滤波器的特点。\n        2.输入100Hz~4kHz的音频信号不在有效频率范围内会产生频率失真。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9470", "t": 3, "q": "带阻滤波电路可由一个无源低通和一个无源高通电路相串联后，再与同相比例运算电路组合而成。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第6章，6.6节，知识点5：带阻滤波器。\n【解析】1.考点：带阻滤波电路的特点。\n        2.带阻滤波电路可由一个无源低通和一个无源高通电路相并联后，再与同相比例运算电路组合而成。", "l3": "电工技术基础", "l4": "第6章-考纲删除", "ap": [false, false, false, false, false, false]}]}, {"k": "电工技术基础||第7章-考纲删除", "n": "电工技术基础 / 第7章-考纲删除", "qs": [{"id": "9471", "t": 1, "q": "<p>磁导率与下列哪一项无关？（ ）<\/p>", "a": ["<p>磁感应强度<\/p>", "<p>磁场强度<\/p>", "<p>材料两端额定电压<\/p>", "<p>本身特性<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/mJL8YK1vEzcZ4vMxd3BSkqQipGjYPjMTbSgXrxCQ.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9472", "t": 1, "q": "若将额定电压为220V的变压器接到了220V的直流电源上，其结果是（     ）。", "a": ["<p>副边输出近电流很小<\/p>", "<p>烧毁原边绕组<\/p>", "<p>烧毁副边绕组<\/p>", "<p>产生较小的励磁电流<\/p>", "", ""], "r": "B", "e": "【定位】考察第7章，第4节，知识点4：等效电路。\n【解析】变压器从交流变为直流时，一次侧短路，磁通变化率为0，二次侧无输出，一次侧短路会使原边电流过大。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9473", "t": 1, "q": "制作电机铁芯的硅钢片材料越薄，则（     ）。", "a": ["<p>铁芯造价更低<\/p>", "<p>制作工艺越简单<\/p>", "<p>铁芯损耗越低<\/p>", "<p>电机结构越简单<\/p>", "", ""], "r": "C", "e": "【定位】考察第7章，第1节，知识点6，铁磁材料特性。\n【解析】硅钢片越薄，涡流损耗越小，铁耗越小。因此，本题答案为C选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9474", "t": 1, "q": "变压器铁芯采用叠片形式而不采用整块铁块形式的主要目的是（     ）。", "a": ["<p>加强机械强度<\/p>", "<p>减少重量<\/p>", "<p>增加美观<\/p>", "<p>减少铁损<\/p>", "", ""], "r": "D", "e": "【定位】考察第7章，第1节，知识点6，铁磁材料特性。\n【解析】采用叠片形式可减少涡流从而减少损耗。因此，本题答案为D选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9475", "t": 1, "q": "通电绕组在磁场中的受力用（     ）判断。", "a": ["<p>安培定则<\/p>", "<p>右手螺旋定则<\/p>", "<p>右手定则<\/p>", "<p>左手定则<\/p>", "", ""], "r": "D", "e": "【定位】考察第7章，第1节，知识点7，电机中的基本电磁定律。\n【解析】概念题，本题答案为D选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9476", "t": 1, "q": "变压器线圈内感应电势的大小与穿过线圈的磁链变化率的大小（     ）。", "a": ["<p>成正比<\/p>", "<p>成反比<\/p>", "<p>无关<\/p>", "<p>成指数衰减<\/p>", "", ""], "r": "A", "e": "【定位】考察第7章，第1节，知识点7，电机中的基本电磁定律。\n【解析】概念题，由公式可知，e与ψ成正比，因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9477", "t": 1, "q": "变压器负载运行，二次侧感应电势在时间相位上总是超前它所匝链主磁通（     ）。", "a": ["<p>-90°<\/p>", "<p>90°<\/p>", "<p>180°<\/p>", "<p>0<\/p>", "", ""], "r": "A", "e": "<p>【定位】考察第7章，第3节，知识点2：主磁通与感应电动势 e1、e2关系。 【解析】本题考察磁通与电动势之间的相位关系。磁通超前电动势90°，因此，本题答案为A选项。<\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9478", "t": 1, "q": "按照冷却方式不同，变压器可分为（     ）。", "a": ["<p>单相变压器，三相变压器<\/p>", "<p>自耦变压器，双绕组变压器和三绕组变压器<\/p>", "<p>心式变压器，组式变压器<\/p>", "<p>干式变压器，油浸变压器<\/p>", "", ""], "r": "D", "e": "【定位】考察第7章，第2节，知识点1，变压器的分类。\n【解析】变压器按冷却方式，可分为干式变压器和油浸变压器；按绕组分，可分为单绕组、双绕组、三绕组变压器；按相数分可分为单相变压器和三相变压器，按结构分可分为芯式变压器和组式变压器。因此，本题答案为D选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9479", "t": 1, "q": "变压器中绝缘油的作用是（     ）。", "a": ["<p>灭弧和散热<\/p>", "<p>限流和灭弧<\/p>", "<p>绝缘和散热<\/p>", "<p>绝缘和灭弧<\/p>", "", ""], "r": "C", "e": "【定位】考察第7章，第2节，知识点2，变压器的基本结构。\n【解析】变压器中绝缘油用于绝缘和散热，断路器中绝缘油还有灭弧作用。因此，本题答案为C选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9480", "t": 1, "q": "变压器绕组和铁芯在运行中会发热，其发热的主要因素是（     ）。", "a": ["<p>电流<\/p>", "<p>电压<\/p>", "<p>铁损耗和铜损耗<\/p>", "<p>电感<\/p>", "", ""], "r": "C", "e": "【定位】考察第7章，第2节，知识点2，变压器的基本结构。\n【解析】绕组和铁芯发热，则知本题考的是铜耗与铁耗，因此，本题答案为C选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9481", "t": 1, "q": "变压器的最高运行温度受（     ）耐热能力限制。", "a": ["<p>绝缘材料<\/p>", "<p>金属材料<\/p>", "<p>铁芯<\/p>", "<p>电流<\/p>", "", ""], "r": "A", "e": "【定位】考察第7章，第2节，知识点2，变压器的基本结：铁芯、绕组、邮箱、套管。\n【解析】概念题，变压器主要由铁芯与绕组构成，绕组主要由铜丝和绝缘层构成，受温度影响比较大的主要为绝缘层，因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9482", "t": 1, "q": "对一台型号为SJL-1000/10的变压器，下列说法不正确的是（     ）。", "a": ["<p>S表示三相<\/p>", "<p>J表示油浸自冷<\/p>", "<p>L表示铝线圈<\/p>", "<p>1000表示容量为1000VA<\/p>", "", ""], "r": "D", "e": "【定位】考察第7章，第2节，知识点3，变压器铭牌。\n【解析】S代表三相，J代表冷却方式为油浸式，L代表循环方式，1000代表容量，单位为kVA，10为高压侧额定电压，因此，本题答案为D选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9483", "t": 1, "q": "三相变压器二次侧的额定电压是指原边加额定电压时二次侧的（     ）电压。", "a": ["<p>空载线<\/p>", "<p>空载相<\/p>", "<p>额定负载时的线<\/p>", "<p>额定负载时的相<\/p>", "", ""], "r": "A", "e": "【定位】考察第7章，第2节，知识点4，变压器的额定值，二次侧额定电压的定义。\n【解析】概念题，二次侧额定电压为一次侧加额定电压时二次侧的空载线电压。因此，本题答案
