，起动电流增大<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/1AjKIbP0I5rppKz6sSin6gFHF2MGBWzhzniTtBIv.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9589", "t": 1, "q": "鼠笼式异步电动机空载起动与满载起动相比：起动转矩和起动电流（     ）。", "a": ["<p>不变，不变<\/p>", "<p>小，小<\/p>", "<p>大，大<\/p>", "<p>小，大<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/n8BuK5RnA9BungjJhiBmW5Cfc95CowMcxyxGArtB.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9590", "t": 1, "q": "异步电动机额定电压和频率下，随着输出功率增加，（     ）将减少。", "a": ["<p>轴端输出转矩<\/p>", "<p>转速<\/p>", "<p>定子电流<\/p>", "<p>转子电流<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/qWWeek1iHAUw20w2PsDBQ9bp04IXrKKOmbRXGHXc.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9591", "t": 1, "q": "当三相异步电动机的机械负载增加时，电源电压和频率不变，其定子电流将（     ）。", "a": ["<p>变大<\/p>", "<p>变小<\/p>", "<p>不变<\/p>", "<p>不确定<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/OA1hxGa272F2OoW3M1Kdh4eOE5uklGlbWWIFjh6Q.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9592", "t": 1, "q": "电源电压大小与频率不变，异步电动机负载增加时，定子绕组电流（     ）。", "a": ["<p>变小<\/p>", "<p>变大<\/p>", "<p>不变<\/p>", "<p>不确定<\/p>", "", ""], "r": "B", "e": "<p>【定位】第8章，第3节，知识点4：异步电动机的工作特性<\/p>\n<p>异步电动机在额定情况下运行，输出功率增大，转速n减小，转差率增大，定子电流I<sub>1<\/sub>增大，输出转矩T<sub>2<\/sub>增大，功率因数先增后减，效率先增后减。<\/p>\n<p>【解析】本题考察异步电动机的工作特性。异步电动机在额定情况下运行，输出功率增大，转速n减小，转差率增大，定子电流I<sub>1<\/sub>增大，输出转矩T<sub>2<\/sub>增大，功率因数先增后减，效率先增后减。因此，本题答案为B选项。<\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9593", "t": 1, "q": "电力拖动机组稳态运行应满足的条件是（     ）。", "a": ["<p>负载机械特性曲线的切线斜率要大于电动机机械特性曲线的切线斜率<\/p>", "<p>负载机械特性曲线的切线斜率要小于电动机机械特性曲线的切线斜率<\/p>", "<p>负载机械特性曲线的切线斜率要等于电动机机械特性曲线的切线斜率<\/p>", "<p>负载机械特性曲线与电动机机械特性有交点，且满足dT<sub>em<\/sub>/dn＞dT<sub>L<\/sub>/dn<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/RCNRvZztLwwQS0ntQzUntM8LN94kFw51GtSben84.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9594", "t": 1, "q": "欲使电动机能顺利起动达到额定转速，要求起动转矩（     ）。", "a": ["<p>等于负载转矩<\/p>", "<p>小于负载转矩<\/p>", "<p>大于1.1-1.2倍的负载转矩<\/p>", "<p>等于最大电磁转矩<\/p>", "", ""], "r": "C", "e": "【定位】第8章，第4节，知识点3：异步电动机的起动\n起动条件：异步电动机起动时瞬时电磁转矩要大于额定转矩。\n【解析】电动机起动时需克服负载阻力并产生加速转矩，若起动转矩仅等于负载转矩，电机无法加速；小于则不能起动；大于1.1-1.2 倍负载转矩，才能可靠起动并升至额定转速；最大电磁转矩是电机过载能力的极限，无需作为起动转矩要求。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9595", "t": 1, "q": "一般情况下，分析三相异步电动机的起动主要目的是尽可能使（     ）。", "a": ["<p>起动电流小，最大转矩大<\/p>", "<p>起动电流小，起动转矩大<\/p>", "<p>起动电流大，起动转矩小<\/p>", "<p>起动电流大，过载能力<\/p>", "", ""], "r": "B", "e": "【定位】第8章，第4节，知识点3：异步电动机的起动 \n三相异步电动机起动要尽可能的使起动电流小，以此减少对电网的冲击；起动转矩大，以此减少起动时间。\n【解析】本题考察三相异步电动机的起动。三相异步电动机起动要尽可能的使起动电流小，以此减少对电网的冲击；起动转矩大，以此减少起动时间。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9596", "t": 1, "q": "异步电动机的三相绕组加上三相对称电压后，在转子尚未转动的瞬间，转子上的电磁转矩（     ）。", "a": ["<p>最大<\/p>", "<p>不大<\/p>", "<p>近于零<\/p>", "<p>为额定转矩<\/p>", "", ""], "r": "B", "e": "【定位】第8章，第4节，知识点3：异步电动机的起动\n异步电动机的三相绕组加上三相对称电压后，在转子尚未转动的瞬间，n=0，s=1。此时直接起动的特点：起动电流大而起动转矩并不大。\n【解析】本题考察异步电动机的起动。异步电动机起动瞬间，转子上电磁转矩不大。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9597", "t": 1, "q": "对异步电动机起动的主要要求（     ）。", "a": ["<p>起动电流倍数小，起动转矩倍数大<\/p>", "<p>起动电流倍数大，起动转矩倍数小<\/p>", "<p>起动电阻大起动电压小<\/p>", "<p>起动电压大，起动电阻小<\/p>", "", ""], "r": "A", "e": "【定位】第8章，第4节，知识点3：异步电动机的起动\n三相异步电动机起动要尽可能的使起动电流小，以此减少对电网的冲击；起动转矩大，以此减少起动时间。\n【解析】本题考察三相异步电动机的起动。三相异步电动机起动要尽可能的使起动电流小，以此减少对电网的冲击；起动转矩大，以此减少起动时间。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9598", "t": 1, "q": "在三相异步电动机直接起动时，转子回路功率因数较低的原因是（     ）。", "a": ["<p>起动转矩小<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/1zjYDN7NHDwdktivUMWN0MB8BsvmqNXIKkdFYBIK.png\"><\/p>", "<p>电源电压较低<\/p>", "<p>输出功率大<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/ioMPsehl3tafcKhfzIl0f5cqbZSb2SW37kG5VrBo.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9599", "t": 1, "q": "在异步电动机起动时，起动电流很大，起动转矩不大的原因是（     ）。", "a": ["<p>转子电阻太大<\/p>", "<p>定子电压不够大<\/p>", "<p>转子回路功率因素低<\/p>", "<p>转子电抗太大<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/q3WviFcXjKmv2pjknI3bTQUGROqqdmMBI3q7KLfc.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9600", "t": 1, "q": "<p>一台三相笼型异步电动机的数据为，P<sub>N<\/sub>＝20kW，U<sub>N<\/sub>=380V，n<sub>N<\/sub>=970r/min，起动转矩倍数λ<sub>Ｔ<\/sub>＝1.15，起动电流倍数k<sub>I<\/sub>=6，定子绕组为三角形联结。当拖动额定负载转矩起动时，若供电变压器允许起动电流不超过12I<sub>N<\/sub>，最好的起动方法是（ &nbsp;&nbsp;&nbsp;&nbsp;）。<\/p>", "a": ["<p>直接起动<\/p>", "<p>Ｙ－Δ降压起动<\/p>", "<p>自耦变压器降压起动<\/p>", "<p>定子串电抗起动<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/uaKbKfPz1fx6PJG7LOAAQJVgVNDg1Iwa9I3WA7K9.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9601", "t": 1, "q": "三相异步电机星-三角起动使（     ）。", "a": ["<p>.从电源吸取的电流减小为1/3Ist，转矩增加为1.73Mst<\/p>", "<p>从电源吸取的电流减小为1/3Ist，转矩减小为1/3Mst<\/p>", "<p>从电源吸取的电流减小为1/1.73Ist，转矩减小为1/3Mst<\/p>", "<p>从电源吸取的电流减小为1/1.73Ist，转矩减小为1/1.73Mst（Ist，Mst为三角形联接在额定电压下起动的电流及转矩）<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/rInIJgz6ji626F04iQtne0kv1E5bOLuGa7UMSxTC.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9602", "t": 1, "q": "大容量的异步电动机（     ）。", "a": ["<p>可以无条件的采取直接起动<\/p>", "<p>完全不能采取直接起动<\/p>", "<p>电动机的额定容量不超过电源变压器额定容量的20％～30％的条件下，可直接起动<\/p>", "<p>电动机的额定容量超过电源变压器额定容量的20％～30％的条件下，可直接起动<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/ViaOzGPFpHdZbX5GMdf0OhO3h49o39K5VxLl323E.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9603", "t": 1, "q": "与普通三相感应电动机相比，深槽、双笼型三相感应电动机正常工作时，性能差一些，主要是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260728/RIrzic4c5yjxTaY9AhPOtBYU6d8uaYU4jhMembrU.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/smEzF5RMZuczIZWoy71IvU4bm2MOBqIKN0VAqJej.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/oJF6GTW5LFErD1sj4f8irSxYIEGHoutYGtvRGeMp.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/8BYI5ZIlLC5dRuuEK4HLSP7bj7hIfMSvBP7RhUNy.png\"><\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/E57gd6u2TOTZU2gFq4FF5dHXwU7MZQTVDT0f6i6S.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9604", "t": 1, "q": "三相绕线式感应电动机拖动恒转矩负载运行时，采用转子回路串入电阻调速，运行时在不同转速上时，其转子回路电流的大小（     ）。", "a": ["<p>与转差率反比<\/p>", "<p>与转差率无关<\/p>", "<p>与转差率正比<\/p>", "<p>与转差率成某种函数关系<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/cf2Zei1UeTAnMvo2RHZ2SuB6aHUUDMKNiVRzUEgO.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9605", "t": 1, "q": "绕线式异步电动机改变转子电阻调速一般适用于（     ）调速。", "a": ["<p>恒转矩负载<\/p>", "<p>恒功率负载<\/p>", "<p>恒频率负载<\/p>", "<p>风机泵类负载<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/hEZDeSIqvWbV1Dbo7G3XqmkhfTA3Pp9w03WJZI1K.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9606", "t": 1, "q": "三相异步电动机拖动恒转矩负载从基频向下的变频调速时，保持恒定的压频比，则属于（     ）调速。", "a": ["<p>恒转矩<\/p>", "<p>恒功率<\/p>", "<p>非恒转矩也非恒功率<\/p>", "<p>弱磁<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/6hTD4T5GKR3kFMvSHMvFo0WOebsi55CfDmARcUaA.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9607", "t": 1, "q": "绕线式三相异步电动机进行转子串电阻调速，电机再次稳定以后转子的转速（     ）。", "a": ["<p>变大<\/p>", "<p>不变<\/p>", "<p>减小<\/p>", "<p>不确定<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/l1s3PQNbfIeWpWVybs2LKuM9p2doI0yTlhQtMmdL.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9608", "t": 1, "q": "<p>异步电动机带额定负载运行时，若电源电压下降，稳定运行时，I<sub>2<\/sub>（ &nbsp;&nbsp;&nbsp;&nbsp;）。<\/p>", "a": ["<p>下降<\/p>", "<p>升高<\/p>", "<p>不变<\/p>", "<p>大小与电压下降率成正比<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/mbKtRFM2tZOk86U2CkXhLaqsOtneLzSm4td7BEtr.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9609", "t": 1, "q": "一台三相感应电动机，额定电压为380V，在额定负载运行时，如果电网电压突然下降到320V，此时电动机将（     ）。", "a": ["<p>能继续安全工作<\/p>", "<p>拖不动负载停止运转<\/p>", "<p>过载易于烧坏<\/p>", "<p>转速升高<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/FSx8S4suoic2lBcG1YpaBrxE4bWQRbE3dL98Loup.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9610", "t": 1, "q": "起重机上采用的绕线式异步电动机为了满足起重机调速范围宽，调速平滑的要求，应采用（     ）。", "a": ["<p>调电源电压的方法<\/p>", "<p>转子串频敏变阻器的方法<\/p>", "<p>转子串调速电阻的方法 （串电阻调速是有级调速）<\/p>", "<p>串级调速<\/p>", "", ""], "r": "D", "e": "【定位】第3章，第4节，知识点6：异步电动机的调速\n绕线式异步电动机要想满足调速范围宽，调速平滑的要求可以采用调频和串级调速。调频调速适用于任何异步电动机，串级调速只适合绕线式异步电动机。串级调速与转子串电阻调速只适用于绕线式异步电动机，两者都属于改变转差率调速，但串级调速为无级调速，转子串电阻调速转速只能下降。\n【解析】本题考察异步电动机的调速。要求调速平滑，可以在串电阻调速的基础上采用串极调速（串一个电动势），串极调速为无级调速，可上调也可下调。因此，本题答案为D选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9611", "t": 1, "q": "下列方法中不属于单相感应电机起动方法的是（     ）。", "a": ["<p>变频起动<\/p>", "<p>裂相起动<\/p>", "<p>罩极起动<\/p>", "<p>起动绕组串电容<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/7izc7f7PKth3IUjRUQQBdY4yUETw8Xhh8m23cLWb.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9612", "t": 2, "q": "对于异步电机的气隙，下面说法正确的是（     ）。", "a": ["<p>异步电机气隙越小有利于降低电机的空载电流<\/p>", "<p>异步电机气隙越小越好<\/p>", "<p>异步电机气隙越小能提高电机功率因素<\/p>", "<p>异步电机气隙大小对其性能有重要影响<\/p>", "", ""], "r": "ACD", "e": "【定位】第8章，第1节，知识点1：异步电机的基本类型和基本结构\n异步电机定、转子间气隙的存在对性能的影响：气隙与电抗成反比，气隙小则电抗大，所以气隙减小，空载电流也减小。异步电机气隙长度应为定、转子在运行中不发生机械摩擦所允许的最小值。气隙小，效率高，功率因数大。\n【解析】本题考察三相异步电动机的基本参数。异步电动机中存在气隙，气隙与电抗成反比，气隙小则电抗大，所以气隙减小，空载电流也减小。气隙应尽可能小，异步电机气隙长度应为定、转子在运行中不发生机械摩擦所允许的最小值。气隙小，效率高，功率因数大。本题答案为ACD。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9613", "t": 2, "q": "变极调速的特点（     ）。", "a": ["<p>机械特性硬<\/p>", "<p>可实现恒转矩和恒功率调速<\/p>", "<p>只能有级调速<\/p>", "<p>适用于不要求平滑调速场合<\/p>", "", ""], "r": "ABCD", "e": "【定位】第8章，第4节，知识点6：异步电动机的调速\n异步电动机可以采用：1）变极调速：只适用于鼠笼式，分为近似恒功率调速（Δ-YY）和恒转矩调速（Y-YY），平滑性差，机械特性硬，有级调速；2）变频调速：分为恒功率调速（调高转速）和恒转矩调速（调低转速），平滑性好，机械特性硬，无级调速；3）变转差率调速：分为降压调速、转子串电阻调速、串极调速。降压调速，电压减小，同步转速不变，转速减小，转差率增大，电流I2增大，电流I1增大，机械特性软;转子串电阻调速为恒转矩调速串的电阻越大，转速越低，机械特性变软，只适用于绕线式电动机;串极调速（串一个电动势），串极调速为无级调速，可上调也可下调，只适用于绕线式电动机。\n【解析】本题考察异步电动机的调速，变极调速是改变鼠笼式异步电机的定子绕组连接，可上调也可下调，可实现恒转矩和恒功率调速，属于有级调速，机械特性硬，只用于鼠笼式电机。本题答案为ABCD。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9614", "t": 2, "q": "三相异步电机下列（     ）运行状态中，电磁转矩的方向与转速的方向相反。", "a": ["<p>发电机<\/p>", "<p>电动机<\/p>", "<p>电磁制动<\/p>", "<p>以上都对<\/p>", "", ""], "r": "AC", "e": "【定位】第8章，第1节，知识点3：异步电机的基本工作原理\n如何根据转差率的大小判断异步电机的状态：0<s<1，异步电机为电动机，此时T为驱动转矩，与n同向；s>1，异步电机为电磁制动状态，此时T为制动转矩，与n反向；s<0，异步电机为发电机，此时T为制动转矩，与n反向。\n【解析】本题考察异步电机处于不同状态时的特点。。0<s<1，异步电机为电动机，s>1，异步电机为电磁制动状态，s<0，异步电机为发电机。转子转速方向与电磁转矩方向相同，转矩为驱动性质，0<s<1；方向相反，则为发电机或电磁制动，转矩为制动性质。本题答案为AC。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9615", "t": 2, "q": "已经做好的三相异步电动机，其主磁通的大小主要和（     ）有关。", "a": ["<p>电动机的输入电压<\/p>", "<p>电源频率<\/p>", "<p>所带负载大小<\/p>", "<p>所带负载性质<\/p>", "", ""], "r": "AB", "e": "<p>【定位】第8章，第2节，<strong>知识点1：电路分析<\/strong><\/p>\n<p>E<sub>1<\/sub>=4.44f<sub>1<\/sub>N<sub>1<\/sub>k<sub>N1<\/sub>φ<sub>1<\/sub>，主磁通与输入电压、频率、绕组系数、绕组有关，与负载无关。<\/p>\n<p>【解析】本题考察异步电动机主磁通的影响因素。E<sub>1<\/sub>=4.44f<sub>1<\/sub>N<sub>1<\/sub>k<sub>N1<\/sub>φ<sub>1<\/sub>，主磁通与输入电压、频率、绕组系数、绕组有关，与负载无关。本题答案为AB。<\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9616", "t": 2, "q": "转子频率忽略不计，近似为零时，三相异步电动机负载运行时的输入功率包括（     ）。", "a": ["<p>定子铁耗<\/p>", "<p>定子铜耗<\/p>", "<p>转子铁耗<\/p>", "<p>电磁功率<\/p>", "", ""], "r": "ABD", "e": "<p>【定位】第8章，第3节，知识点1：电动机的功率、转矩平衡方程式<\/p>\n<p>转子频率忽略不计，则f<sub>2<\/sub>=0=sf<sub>1<\/sub>，s=0，n=n<sub>1<\/sub>，转子铁耗可忽略不计，输入功率P<sub>1<\/sub>=P<sub>em<\/sub>+P<sub>cu1<\/sub>+P<sub>Fe<\/sub>。<\/p>\n<p>【解析】本题考察异步电动机功率流程图。转子频率忽略不计，则f<sub>2<\/sub>=0=sf<sub>1<\/sub>，s=0，n=n<sub>1<\/sub>，转子铁耗可忽略不计，输入功率P<sub>1<\/sub>=P<sub>em<\/sub>+P<sub>cu1<\/sub>+P<sub>Fe<\/sub>。电机接近于同步状态。本题答案为ABD。<\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9617", "t": 2, "q": "三相异步电动机的电磁功率包括（     ）。", "a": ["<p>转子铜耗<\/p>", "<p>总的机械功率<\/p>", "<p>定子铜耗<\/p>", "<p>转子铁耗<\/p>", "", ""], "r": "AB", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/yNWQ2kr2jBMBzDaIKjtOutwH81tdKZ3SKOJSpVOi.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9618", "t": 2, "q": "电源电压大小不变，电源频率下降时，可以使三相异步电动机的（     ）。", "a": ["<p>转子电阻减小<\/p>", "<p>起动转矩增大<\/p>", "<p>同步转速减小<\/p>", "<p>临界转差率增加<\/p>", "", ""], "r": "BCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/4BAZiQg07I1gvkYK0qzf0kEDoBuGWzH7UdMaQnqr.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9619", "t": 2, "q": "绕线转子异步电动机的起动方式有（     ）。", "a": ["<p>转子串电阻<\/p>", "<p>转子串频敏变阻器<\/p>", "<p>减压起动<\/p>", "<p>变频起动<\/p>", "", ""], "r": "ABC", "e": "【定位】第8章，第4节，知识点3：异步电动机的起动\n【解析】绕线转子异步电动机的核心起动方式是转子侧串接元件：串电阻可提高起动转矩、限制起动电流；串频敏变阻器能随转子频率变化自动调节阻抗，实现平稳起动；同时也可配合定子侧减压起动。变频起动多用于鼠笼型异步电动机，并非绕线转子电机的典型起动方式。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9620", "t": 2, "q": "以下属于异步电动机的降压起动方法的是（     ）。", "a": ["<p>定子串电抗起动<\/p>", "<p>Y-△起动<\/p>", "<p>自耦变压器起动<\/p>", "<p>采用高启动转矩异步电动机<\/p>", "", ""], "r": "ABC", "e": "【定位】第8章，第4节，知识点3：异步电动机的起动\n鼠笼式异步电动机的起动方法：直接起动、降压起动、软启动。降压起动有定子串电阻或电抗、Y-Δ起动、自耦变压器降压起起动、延边三角形起动。绕线式异步电动机主要是转子串电阻或频敏变阻器起动。\n【解析】本题考察异步电动机的起动。笼型异步电动机降压起动的方法有自耦变压器起动，定子串电阻，星-三角起动。本题答案为ABC。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9621", "t": 2, "q": "绕线转子异步电动机在起动时转子串入适当的电阻，其目的是（     ）。", "a": ["<p>减小起动电流<\/p>", "<p>增加起动转矩<\/p>", "<p>改善起动性能<\/p>", "<p>增大最大转矩<\/p>", "", ""], "r": "ABC", "e": "【定位】第8章，第4节，知识点3：异步电动机的起动\n鼠笼式异步电动机的起动方法：直接起动、降压起动、软启动。降压起动有定子串电阻或电抗、Y-Δ起动、自耦变压器降压起起动、延边三角形起动。绕线式异步电动机主要是转子串电阻或频敏变阻器起动，其目的是减少起动电流，增大起动转矩。\n【解析】本题考察异步电动机的起动，绕线式异步电动机转子串电阻起动，可以减少起动电流，增大起动转矩。本题答案为ABC。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9622", "t": 2, "q": "笼型异步电动机的起动方式有（     ）。", "a": ["<p>直接起动<\/p>", "<p>软起动<\/p>", "<p>减压起动<\/p>", "<p>拖动起动<\/p>", "", ""], "r": "ABC", "e": "【定位】第8章，第4节，知识点3：异步电动机的起动\n鼠笼式异步电动机的起动方法：直接起动、降压起动、软启动。降压起动有定子串电阻或电抗、Y-Δ起动、自耦变压器降压起起动、延边三角形起动。绕线式异步电动机主要是转子串电阻或频敏变阻器起动。\n【解析】本题考察异步电动机的起动。鼠笼式异步电动机可采用直接起动、降压起动、自耦变压器起动、星-三角起动、软起动。软起动是采用电力电子装置进行调压起动。本题答案为ABC。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9623", "t": 2, "q": "笼型异步电动机的起动方式包括（     ）。", "a": ["<p>定子回路串电抗<\/p>", "<p>定子回路串电阻<\/p>", "<p>自耦变压器减压<\/p>", "<p>星-三角形减压<\/p>", "", ""], "r": "ABCD", "e": "【定位】第8章，第4节，知识点3：异步电动机的起动\n鼠笼式异步电动机的起动方法：直接起动、降压起动、软启动。降压起动有定子串电阻或电抗、Y-Δ起动、自耦变压器降压起起动、延边三角形起动。绕线式异步电动机主要是转子串电阻或频敏变阻器起动。\n【解析】本题考察异步电动机的起动。鼠笼式异步电动机可采用直接起动、降压起动（定子串电阻或电抗）、自耦变压器起动、星-三角起动。本题答案为ABCD。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9624", "t": 2, "q": "异步电动机的电气制动的主要方法有（     ）。", "a": ["<p>反接制动<\/p>", "<p>反馈制动<\/p>", "<p>反向回馈制动<\/p>", "<p>能耗制动<\/p>", "", ""], "r": "ACD", "e": "【定位】第8章，第4节，知识点5：异步电动机的制动\n电气制动方法有：反接制动，回馈制动，能耗制动。\n【解析】本题考察异步电动机的制动。制动分为机械制动与电磁制动，电气制动方式有：反接制动，回馈制动，能耗制动；本题答案为ACD。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9625", "t": 2, "q": "三相异步电动机工作在电磁制动状态，其会吸收（     ）。", "a": ["<p>负载的机械功率<\/p>", "<p>电网的电功率<\/p>", "<p>不确定<\/p>", "<p>转差功率<\/p>", "", ""], "r": "AB", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/1Db548S3UoBlBYG9NkQJY7vDfj83kiQ9eLU3lAY1.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9626", "t": 2, "q": "以下（     ）调速方式可以实现恒转矩调速。", "a": ["<p>变频向上<\/p>", "<p>变频向下<\/p>", "<p>变极<\/p>", "<p>降压<\/p>", "", ""], "r": "BC", "e": "【定位】第8章，第4节，知识点6：异步电动机的调速\n实现恒转矩调速的是Y-YY变极调速、基频下调的变频调速、转子串电阻调速、串级调速。\n【解析】本题考察异步电动机的调速，异步电动机可以采用变极调速（只适用于鼠笼式，分为恒功率调速（调高转速）和恒转矩调速（调低转速），平滑性差，机械特性硬，有级调速）；变频调速（分为恒功率调速（调高转速）和恒转矩调速（调低转速），平滑性好，机械特性硬，无级调速）；变转差率调速（分为降压调速和转子串电阻调速，降压调速，既非恒功率也非恒转矩，转子串电阻调速为恒转矩调速，只适用于绕线式电动机，调低转速，平滑性差，机械特性软）。串级调速是转子中串电动势调速，可上调也可下调，无级调速，机械特性硬，只用于绕线式电机。本题答案为BC。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9627", "t": 2, "q": "绕线式异步电动机的串电阻调速有（     ）特点。", "a": ["<p>属于变转差调速<\/p>", "<p>效率较低<\/p>", "<p>低速运行稳定性差<\/p>", "<p>机械特性较软<\/p>", "", ""], "r": "ABCD", "e": "【定位】第8章，第4节，知识点6：异步电动机的调速\n绕线式异步电动机串电阻调速，属于变转差率调速，机械特性软，串电阻后，损耗较大，效率较低，低速运行时，输出功率较小，带负载能力差，运行稳定差。\n【解析】本题考察异步电动机的调速。绕线式异步电动机串电阻调速，属于变转差率调速，机械特性软，串电阻后，损耗较大，效率较低，低速运行时，输出功率较小，带负载能力差，运行稳定差。本题答案为ABCD。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9628", "t": 2, "q": "三相异步电动机拖动恒转矩负载运行，进行转子串电阻调速，当电机运行稳定后，此时电动机的（     ）。", "a": ["<p>转速降低<\/p>", "<p>转差率变大<\/p>", "<p>最大电磁转矩不变<\/p>", "<p>效率增加<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/KhLY0kpLa6xwPY89IcyWJAqjJNCTA5OMML3gMeWf.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9629", "t": 2, "q": "下列方法中属于单相异步电机起动方法的是（     ）。", "a": ["<p>变频起动<\/p>", "<p>裂相起动<\/p>", "<p>罩极起动<\/p>", "<p>异步起动<\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/gzAF6TadPiohEpl0RcY8bRPsp05f1sOnMTzSpObF.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9630", "t": 2, "q": "关于笼型异步电动机转子极对数说法正确的是（     ）。", "a": ["<p>转子极对数自动等于定子极对数<\/p>", "<p>转子极对数不固定<\/p>", "<p>转子极对数自动大于定子极对数<\/p>", "<p>转子极对数自动小于定子极对数<\/p>", "", ""], "r": "AB", "e": "<p>【定位】第8章，第1节，知识点1：异步电机的基本类型和基本结构 鼠笼型异步电动机转子极数不固定，转子极对数能自动地随着定子极对数的改变而改变。 【解析】本题考察异步电动机的结构。鼠笼型异步电动机转子极数不固定，随定子极数的改变而改变。本题答案为 AB。<\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9631", "t": 3, "q": "三相感应电动机的功率因数总是滞后的。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第8章，第1节，知识点1：异步电机的基本类型和基本结构\n异步电动机必须从电网吸收滞后无功功率，相当于感性负载。\n【解析】本题考察对异步电动机的认识。异步电动机，只能吸收滞后的无功功率（感性），因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9632", "t": 3, "q": "异步电动机运行过程中需要吸收电网感性无功功率。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第8章，第1节，知识点1：异步电机的基本类型和基本结构\n异步电动机必须从电网吸收滞后无功功率，相当于感性负载。\n【解析】本题考察对异步电动机的认识。异步电动机，只能吸收滞后的无功功率（感性），因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9633", "t": 3, "q": "三相异步电动机的型号Y-112S-6的极数是6极。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第8章，第1节，知识点2：异步电动机的铭牌和额定值\nY-112S-6中的“6”代表极数。\n【解析】本题考察对异步电动机型号的认识。Y-112S-6中的“6”代表极数。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9634", "t": 3, "q": "三相异步电动机s=-0.1时，电磁功率小于零，电机运行在电动机状态。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第8章，第1节，知识点3：异步电机的基本工作原理\n如何根据转差率的大小判断异步电机的状态：0<s<1，异步电机为电动机，T为驱动转矩（T>0）；s>1，异步电机为电磁制动状态，T为制动转矩(T<0)；s<0，异步电机为发电机，T为制动转矩(T<0)。\n【解析】本题考察异步电机处于不同状态时的特点。。0<s<1，异步电机为电动机，s>1，异步电机为电磁制动状态，s<0，异步电机为发电机。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9635", "t": 3, "q": "异步电机转差率s=1时，其异步电机处于理想空载状态。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p>【定位】第8章，第1节，知识点3：异步电机的基本工作原理<\/p>\n<p>空载状态下，n=n<sub>1<\/sub>，s=0；s=1，电机处于静止状态。<\/p>\n<p>【解析】本题考察对异步电动机参数的理解。空载状态下，n=n<sub>1<\/sub>，s=0。因此，本题答案为B选项。<\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9636", "t": 3, "q": "三相感应电动机转子为任意转速时，定、转子合成基波磁势转速不变。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/NTfCMZSoW0gLPIFGxUj8J3e55uiOBsQNvZtG1aG0.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9637", "t": 3, "q": "三相异步电动机正常运行时所带负载变化，定、转子合成基波磁势转速不变。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/jfXQhKX0Nhe6tJNuPasTyhetiEDztpKXwFnaCNhu.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9638", "t": 3, "q": "三相异步电动机当转子静止时，转子绕组电流的频率与定子电流的频率相同。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/OX6RcJVa9EZmIPdFQfsiw6SkVCZNF2p1KiRpnOWo.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9639", "t": 3, "q": "当三相感应电动机转子绕组短接并堵转时，轴上的输出功率为零，则定子边输入功率亦为零。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第8章，第3节，知识点1：电动机的功率、转矩平衡方程式\n异步电动机堵转时，n=0，s=1，总机械功率为0，输出功率为零，从功率流程图看输入功率不为零。\n【解析】本题考察异步电动机功率流程图。异步电动机堵转时，输出功率为零，但输入功率不为零。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9640", "t": 3, "q": "对于感应电动机，转差功率就是转子铜耗。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/Ww0W0Qb7szRRzhnqUllytG5B9DZUQ0ZSayg5mWtv.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9641", "t": 3, "q": "不考虑定子电阻，三相异步电动机最大电磁转矩与电源频率的平方成反比。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/oHMTeYn7dpN4dgxJYiVTJRbMaWX5r3GX0bxQYU71.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9642", "t": 3, "q": "三相异步电动机当电源频率及电机参数不变时，最大电磁转矩与定子电压的平方成正比。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/RM60PWzwLHleJgrCnYRwjluWpTXoNWH5wFPgFo9O.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9643", "t": 3, "q": "<p>三相异步电动机的临界转差率s<sub>m<\/sub>与转子回路的电阻值成反比。（ &nbsp;&nbsp;&nbsp;&nbsp;）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/ecCWRE8ZFEyldbORuSa7nCb30Um6idYBzY226zUy.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9644", "t": 3, "q": "异步电动机接在额定电源上运行时，负载不断增加，转子转差率也不断变大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第8章，第3节，知识点4：异步电动机的工作特性<\/p>\n<p>异步电动机在额定情况下运行，输出功率增大，转速n减小，转差率增大，定子电流I<sub>1<\/sub>增大，输出转矩T<sub>2<\/sub>增大，功率因数先增后减，效率先增后减。异步电动机在额定情况下运行，输出功率增大，转速n减小，转差率增大，定子电流I<sub>1<\/sub>增大，输出转矩T<sub>2<\/sub>增大，功率因数先增后减，效率先增后减。<\/p>\n<p>【解析】本题考察异步电动机的工作特性。异步电动机在额定情况下运行，输出功率增大，转速n减小，转差率增大，定子电流I<sub>1<\/sub>增大，输出转矩T<sub>2<\/sub>增大，功率因数先增后减，效率先增后减。因此，本题答案为A选项。<\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9645", "t": 3, "q": "异步电动机当电源电压一定，负载转矩减小，转速将增加。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第8章，第3节，知识点4：异步电动机的工作特性<\/p>\n<p>异步电动机在额定情况下运行，输出功率增大，转速n减小，转差率增大，定子电流I<sub>1<\/sub>增大，输出转矩T<sub>2<\/sub>增大，功率因数先增后减，效率先增后减。异步电动机在额定情况下运行，输出功率增大，转速n减小，转差率增大，定子电流I<sub>1<\/sub>增大，输出转矩T<sub>2<\/sub>增大，功率因数先增后减，效率先增后减。<\/p>\n<p>【解析】本题考察异步电动机的工作特性。异步电动机在额定情况下运行，负载转矩减小，输出功率减小，转速n增大，转差率减小。因此，本题答案为A选项。<\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9646", "t": 3, "q": "三相异步电动机运行时，负载增大，转子电流增大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第8章，第3节，知识点4：异步电动机的工作特性<\/p>\n<p>异步电动机在额定情况下运行，输出功率增大，转速n减小，转差率增大，定子电流I<sub>1<\/sub>增大，输出转矩T<sub>2<\/sub>增大，功率因数先增后减，效率先增后减。异步电动机在额定情况下运行，输出功率增大，转速n减小，转差率增大，定子电流I<sub>1<\/sub>增大，输出转矩T<sub>2<\/sub>增大，功率因数先增后减，效率先增后减。<\/p>\n<p>【解析】本题考察异步电动机的工作特性。异步电动机在额定情况下运行，负载增大，输出功率增大，转速n减小，转差率增大，定子电流I<sub>1<\/sub>增大。因此，本题答案为A选项。<\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9647", "t": 3, "q": "异步电动机负载转矩不变，若电源电压降低，稳定运行时，其电磁转矩将变小。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/e715fIm7HMReX90wzuovBi5VoGSocqUYdZW7SKAv.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9648", "t": 3, "q": "感应电动机的负载转矩在任何时候都绝不可能大于额定转矩。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第8章，第4节，知识点2：电力拖动系统稳定运行条件\n额定稳定运行时，负载转矩等于额定转矩，但如果发生过载，负载转矩大于额定转矩。\n【解析】本题考察异步电动机的运行。额定稳定运行时，负载转矩等于额定转矩，但如果发生过载，负载转矩大于额定转矩。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9649", "t": 3, "q": "深槽型和双笼型感应电动机与普通笼型电动机相比，能减小起动电流的同时增大起动转矩。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第8章，第4节，知识点3：异步电动机的起动<\/p>\n<p>高起动转矩的深槽型、双笼型（鼠笼式）电动机知识点：工作原理是利用趋肤效应，起动时转矩增大，但电流变小；工作时由于转子电抗比普通笼型大，使最大转矩减小，过载能力减弱，cosφ2减小。<\/p>\n<p>【解析】本题考察高起动转矩的异步电动机。与普通三相异步电动机相比，深槽型、双笼型（鼠笼式）利用趋肤效应，起动瞬间电流不是均匀分布，等效为电流横截面积减小，电阻变大，起动时电流更小，转矩更大。因此，本题答案为A选项。<\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9650", "t": 3, "q": "三相绕线式感应电动机在转子回路中串电阻可增大起动转矩，所串电阻越大，起动电流就越小。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/x0AbVkSoXXBNB3ifrwNssYmsAKxfIQpMiyBDJlwD.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9651", "t": 3, "q": "再生发电制动只用于电动机转速高于同步转速的场合。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第8章，第4节，知识点5：异步电动机的制动<\/p>\n<p>再生发电制动即回馈制动，适用于运行于发电机状态的电机，发电机状态时，n&gt;n<sub>1<\/sub>，s&lt;0，电机转速高于同步转速。<\/p>\n<p>【解析】本题考察异步电动机的制动。再生发电制动即回馈制动，适用于运行于发电机状态的电机，发电机状态时，n&gt;n<sub>1<\/sub>，s&lt;0，电机转速高于同步转速。因此，本题答案为A选项。<\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9652", "t": 3, "q": "鼠笼式异步电动机通常是在转子上串电阻进行调速。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第8章，第4节，知识点6：异步电动机的调速\n转子串电阻调速为恒转矩调速，只适用于绕线式电动机，串的电阻越大转速越低，平滑性差，机械特性软。\n【解析】本题考察异步电动机的调速。转子串电阻调速为恒转矩调速，只适用于绕线式电动机，调低转速，平滑性差，机械特性软。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9653", "t": 3, "q": "异步电动机的变极调速通常是针对笼型电机而言。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第8章，第4节，知识点6：异步电动机的调速\n变极调速是改变定子绕组的连接方式，转速可上调也可下调，有级调速，机械特性硬，只用于鼠笼式电机。因为笼型电机转子磁极对数自动与定子保持一致。\n【解析】本题考察异步电动机的调速。变极调速是改变定子绕组的连接方式，可上调也可下调，有级调速，机械特性硬，只用于鼠笼式电机。因为笼型电机转子磁极对数自动与定子保持一致。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}]}, {"k": "电工技术基础||第9章-考纲删除", "n": "电工技术基础 / 第9章-考纲删除", "qs": [{"id": "9654", "t": 1, "q": "在通常情况下，电力电子器件功率损耗主要为（     ）。", "a": ["<p>通态损耗<\/p>", "<p>断态损耗<\/p>", "<p>开通损耗<\/p>", "<p>关断损耗<\/p>", "", ""], "r": "A", "e": "【考点定位】第9章，第1节，知识点2：电力电子器件的概念、特征、损耗\n【解析】电力电子器件的功率损耗：通态损耗、断态损耗、开关损耗（开通损耗、关断损耗）。\n（1）一般情况下（频率不高时），通态损耗是电力电子器件功率损耗的主要因素；\n（2）当器件的开关频率较高时，开关损耗会随之增大而可能成为器件功率损耗的主要因素。\n以上4种损耗，其中通态损耗是电力电子器件功率损耗的主要成因。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9655", "t": 1, "q": "当器件开关频率较高时，功率损耗主要为（     ）。", "a": ["<p>通态损耗<\/p>", "<p>断态损耗<\/p>", "<p>开关损耗<\/p>", "<p>开通损耗<\/p>", "", ""], "r": "C", "e": "<p>【考点定位】第9章，第1节，<strong>知识点2：电力电子器件的概念、特征、损耗<\/strong><\/p>\n<p>【解析】通态损耗是电力电子器件功率损耗的主要成因。当器件的开关频率较高时，开关损耗会随之增大而可能成为器件功率损耗的主要因素。<\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9656", "t": 1, "q": "以下说法正确的是（     ）。", "a": ["<p>电压驱动型器件只能是双极型器件<\/p>", "<p>电压驱动型器件只能是单极型器件<\/p>", "<p>电压驱动型器件只能是复合型器件<\/p>", "<p>电压驱动型器件可以是单极型器件或复合型器件<\/p>", "", ""], "r": "D", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类\n【解析】电压驱动型器件可以是单极型器件（如Power MOSFET）或复合型器件（如IGBT）。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9657", "t": 1, "q": "下列电力电子器件中，哪个是电流驱动型、电平控制型器件？（     ）", "a": ["<p>晶闸管<\/p>", "<p>门极可关断晶闸管<\/p>", "<p>电力晶体管<\/p>", "<p>绝缘栅双极晶体管<\/p>", "", ""], "r": "C", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类\n【解析】晶闸管是电流驱动型、脉冲控制型，门极可关断晶闸管是电流驱动型、脉冲控制型，电力晶体管是电流驱动型、电平控制型，绝缘栅双极晶体管是电压驱动型、电平控制型。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9658", "t": 1, "q": "属于单极型器件的有（     ）。", "a": ["<p>Power MOSFET<\/p>", "<p>GTR<\/p>", "<p>GTO<\/p>", "<p>SCR<\/p>", "", ""], "r": "A", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类\n【解析】GTR、GTO 、SCR属于双极型器件，Power MOSFET属于单极型器件。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9659", "t": 1, "q": "下列电力电子器件中，哪个内部没有电导调制效应？（     ）", "a": ["<p>电力晶体管<\/p>", "<p>晶闸管<\/p>", "<p>电力场效应晶体管<\/p>", "<p>绝缘栅双极晶体管<\/p>", "", ""], "r": "C", "e": "【考点定位】考查第9章，第2节，知识点1：PN结与电力二极管的工作原理\n【解析】单极型器件由于只有一种载流子参与导电，因此其内部没有电导调制效应。上述选项中，电力场效应晶体管为单极型器件。双极型器件内部有电导调制效应，电力晶体管、晶闸管为双极型器件。复合型器件内部有电导调制效应，绝缘栅双极晶体管为复合型器件。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9660", "t": 1, "q": "给晶闸管加上（     ）电压，同时在门极和阴极之间加正向触发，它就会导通。", "a": ["<p>正向阳极<\/p>", "<p>正向阴极<\/p>", "<p>反向阳极<\/p>", "<p>反向阴极<\/p>", "", ""], "r": "A", "e": "<p>【考点定位】考查第9章，第３节，<strong>知识点1：晶闸管的结构与工作原理<\/strong>。<\/p>\n<p>【解析】当<em>I<\/em><em><sub>G<\/sub><\/em><em>=0<\/em>时，如果在器件两端施加正向阳极电压，则晶闸管处于正向阻断状态，只有很小的正向漏电流流过。如果正向电压超过临界极限即<strong>正向转折电压<\/strong><em>U<\/em><em><sub>bo<\/sub><\/em>，则漏电流急剧增大，器件开通。<\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9661", "t": 1, "q": "当晶闸管承受反向阳极电压时，不论门极加何种极性触发电压，管子都将工作在（     ）。", "a": ["<p>导通状态<\/p>", "<p>关断状态<\/p>", "<p>饱和状态<\/p>", "<p>不定<\/p>", "", ""], "r": "B", "e": "【考点定位】考查第9章，第３节，知识点1：晶闸管的结构与工作原理。\n【解析】晶闸管的关断方式\n理论上：只能利用外加电压和外电路的作用使流过晶闸管的电流下降到接近于零的某数值以下。\n实际上：一般情况下，通过在阳极与阴极之间加反压的方式使晶闸管关断。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9662", "t": 1, "q": "晶闸管的关断条件是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260728/FRybBHjAUscVMf31Aq8hV45nQqcCxYajrqmEkC8v.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/vG0obXzRmqxM4E9wRTjrjyFiKPnbcfjFbtD1IJJ2.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/jsT7jHaHNL4WN4Gfuc24sz6VsefK8kJBUZ1767Ln.png\"><\/p>", "<p>晶闸管阳极和阴极间施加正向电压<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/3vGKU3nn2akUGlfYQK9jY9GojTcYcdnWpGp69J3v.png\"><\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9663", "t": 1, "q": "以下几种晶闸管的导通方式中，属于正常导通方式的是（     ）。", "a": ["<p>光触发<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/gkMeh2NX6ErJTNI6x2VMG66QoSSaIGDMwMqcLQC6.png\"><\/p>", "<p>结温过高<\/p>", "<p>阳极电压过高<\/p>", "", ""], "r": "A", "e": "【考点定位】考查第9章，第３节，知识点扩展\n【解析】晶闸管的导通方式\n正常方式（2种）：门极触发；光触发。\n非正常方式（3种）：电压触发；阳极电压上升率过高；结温较高。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9664", "t": 1, "q": "最简便易用的使晶闸管关断的方法是（     ）。", "a": ["<p>门极施加负脉冲<\/p>", "<p>阳极施加反向电压<\/p>", "<p>门极施加正脉冲<\/p>", "<p>调节外电路的结构，使晶闸管的电流下降到小于维持电流<\/p>", "", ""], "r": "B", "e": "【考点定位】考察第9章，第3节，知识点1：晶闸管的结构与工作原理。\n【解析】晶闸管的关断方式\n理论上：只能利用外加电压和外电路的作用使流过晶闸管的电流下降到接近于零的某数值以下。\n实际上：一般情况下，通过在阳极与阴极之间加反压的方式使晶闸管关断。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9665", "t": 1, "q": "普通晶闸管内部有（     ）PN结。", "a": ["<p>一个<\/p>", "<p>两个<\/p>", "<p>三个<\/p>", "<p>四个<\/p>", "", ""], "r": "C", "e": "【考点定位】考查第9章，第３节，知识点1：晶闸管的结构与工作原理。\n【解析】晶闸管的结构：引出阳极A、阴极K和门极（控制端）G三个联接端；内部是PNPN四层半导体结构（相当于有三个PN结）。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9666", "t": 1, "q": "晶闸管的伏安特性是指（     ）。", "a": ["<p>阳极电压与门极电流的关系<\/p>", "<p>门极电压与门极电流的关系<\/p>", "<p>阳极电压与阳极电流的关系<\/p>", "<p>门极电压与阳极电流的关系<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/buc7yWeubxQPA9iMzUyTxIc3hORkhTY3GXdWtkMJ.png\"><\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9667", "t": 1, "q": "某电路中，若要串入支路中一个晶闸管，该支路两端工作时最大峰值电压是1150V，则选择晶闸管的额定电压为（     ）V。", "a": ["<p>1100<\/p>", "<p>2200<\/p>", "<p>3300<\/p>", "<p>4400<\/p>", "", ""], "r": "C", "e": "<p>【考点定位】考察第9章，第3节，知识点3晶闸管主要参数<\/p>\n<p>【解析】通常选取晶闸管<em>U<\/em><sub>DRM <\/sub><em><sub>&nbsp;<\/sub><\/em>和<em>U<\/em><sub>RRM<\/sub>较小的标值作为该器件的额定电压。选用时，额定电压要留有一定裕量，一般取额定电压为正常工作时晶闸管所承受峰值电压的2-3倍，所以额定电压为1150V×2～1150V×3=2300V～3450V的整数值，C正确。<\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9668", "t": 1, "q": "原本处于通态的晶闸管，稳定继续导通的条件（     ）。", "a": ["<p>晶闸管阳极电流大于晶闸管的擎住电流<\/p>", "<p>晶闸管阳极电流小于晶闸管的擎住电流<\/p>", "<p>晶闸管阳极电流大于晶闸管的维持电流<\/p>", "<p>晶闸管阳极电流小于晶闸管的维持电流<\/p>", "", ""], "r": "C", "e": "【考点定位】考察第9章，第3节，知识点3晶闸管主要参数\n【解析】维持电流是指使晶闸管维持导通所必需的最小电流。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9669", "t": 1, "q": "不考虑安全裕量，若晶闸管电流有效值是157A，则其额定电流为（     ）A。", "a": ["<p>157<\/p>", "<p>100<\/p>", "<p>80<\/p>", "<p>246.5<\/p>", "", ""], "r": "B", "e": "【考点定位】考察第9章，第3节，知识点3晶闸管主要参数\n【解析】如果不考虑裕量，根据正弦半波波形平均值与有效值之比为1：1.57，可知额定电流为15.7除以1.57，即157/1.57=100A。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9670", "t": 1, "q": "已经导通的晶闸管的可被关断的条件是流过晶闸管的电流（     ）。", "a": ["<p>减小至维持电流以下<\/p>", "<p>减小至擎住电流以下<\/p>", "<p>减小至门极触发电流以下<\/p>", "<p>减小至5A以下<\/p>", "", ""], "r": "A", "e": "【考点定位】考察第9章，第3节，知识点3晶闸管主要参数\n【解析】当流过晶闸管的电流减小到低于其维持电流时，晶闸管会自行关断。维持电流是晶闸管保持导通状态所需的最小电流，而当电流低于这个值时，晶闸管将无法维持导通状态，从而关断。因此，通过减小流过晶闸管的电流至维持电流以下，可以有效地控制晶闸管的关断。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9671", "t": 1, "q": "晶闸管的阳极电流小于下列哪个电流时，就认为晶闸管已经进入阻断状态（     ）。", "a": ["<p>额定电流<\/p>", "<p>擎住电流<\/p>", "<p>漏电流<\/p>", "<p>维持电流<\/p>", "", ""], "r": "D", "e": "【考点定位】考察第9章，第3节，知识点3晶闸管主要参数\n【解析】维持电流是指使晶闸管维持导通所必需的最小电流。晶闸管的阳极电流小于维持电流，就认为晶闸管已经进入阻断状态。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9672", "t": 1, "q": "如某晶闸管的正向阻断重复峰值电压为745V，反向重复峰值电压为825V，则该晶闸管的额定电压应为（     ）。", "a": ["<p>700V<\/p>", "<p>750V<\/p>", "<p>800V<\/p>", "<p>850V<\/p>", "", ""], "r": "A", "e": "<p>【考点定位】<strong>考察第<\/strong><strong>9<\/strong><strong>章，第3节，知识点3晶闸管主要参数<\/strong><\/p>\n<p>【解析】额定电压——通常取晶闸管的U<sub>DRM<\/sub>和U<sub>RRM<\/sub>中较小的标值。选用时，一般取额定电压为正常工作时晶闸管所承受峰值电压2-3倍。<\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9673", "t": 1, "q": "取断态重复峰值电压和反向重复峰值电压中较小的一个，并规化为标准电压等级后，定为该晶闸管的（     ）。", "a": ["<p>转折电压<\/p>", "<p>反向击穿电压<\/p>", "<p>阈值电压<\/p>", "<p>额定电压<\/p>", "", ""], "r": "D", "e": "【考点定位】考察第9章，第3节，知识点3晶闸管主要参数\n【解析】晶闸管的额定电压：\n厂家出厂时，通常取晶闸管的UDRM和URRM中较小的标值作为该器件的额定电压。\n用户选用时，一般取额定电压为正常工作时晶闸管所承受峰值电压2-3倍。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9674", "t": 1, "q": "普通晶闸管的通态电流（额定电流）是用电流的（     ）来表示的。", "a": ["<p>有效值<\/p>", "<p>最大值<\/p>", "<p>平均值<\/p>", "<p>瞬时值<\/p>", "", ""], "r": "C", "e": "<p>【考点定位】考察第9章，第3节，知识点3晶闸管主要参数<\/p>\n<p>【解析】国标规定通态平均电流为晶闸管在环境温度为40°C和规定的冷却状态下，稳定结温不超过额定结温时所允许流过的<strong>最大工频正弦半波电流的平均值。<\/strong><\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9675", "t": 1, "q": "晶闸管刚由断态转入通态，并且去掉门极信号，仍能维持其导通所需的最小阳极电流，称为（     ）。", "a": ["<p>维持电流<\/p>", "<p>擎住电流<\/p>", "<p>浪涌电流<\/p>", "<p>额定电流<\/p>", "", ""], "r": "B", "e": "【考点定位】考察第9章，第3节，知识点3晶闸管主要参数\n【解析】本题主要考査晶闸管掣住电流的定义，晶闸管触发导通后，移除触发信号，能够维持其导通所必需的最小电流为掣住电流。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9676", "t": 1, "q": "将一个晶闸管和一个二极管反并联集成在同一硅片上的器件为（     ）。", "a": ["<p>快速二极管<\/p>", "<p>双向晶闸管<\/p>", "<p>逆导晶闸管<\/p>", "<p>光控晶闸管<\/p>", "", ""], "r": "C", "e": "【考点定位】考察第9章，第3节，知识点4：晶闸管的派生器件\n【解析】逆导晶闸管（Reverse Conducting Thyristor, RCT）是一种将晶闸管和二极管反并联集成在同一硅片上的器件。这种结构允许二极管为反向电流提供通路，从而在反向电压下导通，简化了电路设计并提高了效率和可靠性。B.双向晶闸管‌：由一对晶闸管反并联集成，用于双向交流控制，而非晶闸管与二极管的组合。A.快速二极管‌：仅指开关速度快的二极管，不涉及晶闸管集成。‌D.光控晶闸管‌：通过光信号触发导通的晶闸管，无反并联二极管结构。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9677", "t": 1, "q": "双向晶闸管的额定电流的定义与普通晶闸管不一样，双向晶闸管的额定电流是用（     ）来表示的。", "a": ["<p>电流有效值<\/p>", "<p>电流最大值<\/p>", "<p>电流最小值<\/p>", "<p>电流平均值<\/p>", "", ""], "r": "A", "e": "【考点定位】考察第9章，第3节，知识点4：晶闸管的派生器件\n【解析】双向晶闸管采用电流有效值来表示额定电流，而普通晶闸管是用平均值来表示的，需要注意之间的区别。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9678", "t": 1, "q": "Power  MOSFET对外连接有三个电极，其中不包含以下哪一个？（     ）", "a": ["<p>栅极<\/p>", "<p>源极<\/p>", "<p>发射极<\/p>", "<p>漏极<\/p>", "", ""], "r": "C", "e": "【考点定位】第9章，第4节，知识点3：电力场效应晶体管\n【解析】Power  MOSFET对外连接有三个电极：栅极、源极、漏极。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9679", "t": 1, "q": "下面哪个特点决定Power MOSFET驱动功率很小？（     ）", "a": ["<p>场控器件<\/p>", "<p>正向通态电阳<\/p>", "<p>漏极峰值电流<\/p>", "<p>存在二次击穿问题<\/p>", "", ""], "r": "A", "e": "【考点定位】第9章，第4节，知识点3：电力场效应晶体管\n【解析】Power MOSFET是电压驱动型/场控器件/场效应器件，决定其驱动功率很小。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9680", "t": 1, "q": "关于Power MOSFET说法错误的是（     ）。", "a": ["<p>驱动电路复杂，需要的驱动功率大<\/p>", "<p>开关速度快<\/p>", "<p>工作频率高<\/p>", "<p>电流容量小，耐压低，多用于功率不超过10kW的电力电子装置<\/p>", "", ""], "r": "A", "e": "【考点定位】第9章，第4节，知识点3：电力场效应晶体管\n【解析】Power MOSFET是电压驱动型器件，输入阻抗高，开关速度快，驱动功率小，驱动电路简单，工作频率高。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9681", "t": 1, "q": "IGBT的转移特性描述的是（     ）之间的关系。", "a": ["<p>阳极电流与阳极电压<\/p>", "<p>栅极电流与栅射极电压<\/p>", "<p>集电极电流与栅射极电压<\/p>", "<p>集电极电流与集射极电压<\/p>", "", ""], "r": "C", "e": "【考点定位】考察第9章，第4节，知识点4绝缘栅双极晶体管\n【解析】IGBT的转移特性描述的是集电极电流与栅射极电压之间的关系，与MOSFET的转移特性类似，C正确。集电极电流与集射极电压之间的关系也称伏安特性，体现的是IGBT的输出特性，D错误。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9682", "t": 1, "q": "IGBT对外连接有三个电极，其中不包含以下哪一个？（     ）", "a": ["<p>栅极<\/p>", "<p>发射极<\/p>", "<p>集电极<\/p>", "<p>源极<\/p>", "", ""], "r": "D", "e": "【考点定位】第9章，第4节，知识点4：绝缘栅双极晶体管\n【解析】IGBT的结构：是三端器件，具有栅极G、集电极C和发射极E。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9683", "t": 1, "q": "IGBT是一个复合型的器件，它是（     ）。", "a": ["<p>GTR驱动的Power MOSFET<\/p>", "<p>Power MOSFET驱动的GTR<\/p>", "<p>Power MOSFET驱动的晶闸管<\/p>", "<p>Power MOSFET驱动的GTO<\/p>", "", ""], "r": "B", "e": "【考点定位】第9章，第4节，知识点4：绝缘栅双极晶体管\n【解析】IGBT是用GTR与Power  MOSFET组成的达林顿结构，相当于一个由Power  MOSFET驱动的厚基区PNP晶体管。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9684", "t": 1, "q": "IGBT的静态特性是（     ）。", "a": ["<p>集射电压和栅射极电压的关系<\/p>", "<p>集电极电流和集射极电压的关系<\/p>", "<p>栅极电流和栅射极电压的关系<\/p>", "<p>栅极电流和集电极电流的关系<\/p>", "", ""], "r": "B", "e": "<p>【考点定位】第9章，第4节，知识点4：绝缘栅双极晶体管<\/p>\n<p>【解析】IGBT的静态特性，主要指其输出特性（伏安特性），描述的是以栅射电压为参考变量时，集电极电流<em>I<\/em><em><sub>C<\/sub><\/em>与集射极间电压<em>U<\/em><em><sub>CE<\/sub><\/em>之间的关系。<\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9685", "t": 1, "q": "以下不是基于宽禁带半导体材料的电力电子器件有（     ）。", "a": ["<p>碳化硅<\/p>", "<p>金刚石<\/p>", "<p>氮化镓<\/p>", "<p>单晶硅<\/p>", "", ""], "r": "D", "e": "【考点定位】第9章，第5节，知识点：基于宽禁带半导体材料的电力电子器件\n【解析】单晶硅为晶圆材料，主要用来制造芯片。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9686", "t": 1, "q": "关于晶闸管正常工作的静态特性，下列说法不正确的是（     ）。", "a": ["<p>晶闸管承受反向电压时，若门极触发电流达到某个值，晶闸管也会导通<\/p>", "<p>晶闸管承受正向电压时，仅在门极有触发电流的情况下晶闸管才能导通<\/p>", "<p>晶闸管一旦导通，门极就失去控制作用，不论门极触发电流是否还存在，晶闸管都保持导通<\/p>", "<p>若要使已导通的晶闸管关断，只能利用外加电压和外电路的作用使流过晶闸管的电流降到接近于零的某一数值以下<\/p>", "", ""], "r": "A", "e": "【考点定位】第9章，第3节，知识点1：晶闸管的结构与工作原理\n【解析】晶闸管承受反向电压时，不论门极是否有触发电流，晶闸管都不会导通。晶闸管承受正向电压时，仅在门极有触发电流的情况下晶闸管才能导通。晶闸管一旦导通，门极就失去控制作用，不论门极触发电流是否还存在，晶闸管都保持导通。若要使已导通的晶闸管关断，只能利用外加电压和外电路的作用使流过晶闸管的电流降到接近于零的某一数值以下。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9687", "t": 1, "q": "按照驱动信号的性质分类，下列说法正确的是（     ）。", "a": ["<p>IGBT为电流驱动型<\/p>", "<p>Power MOSFET为电流驱动型<\/p>", "<p>GTO为电流驱动型<\/p>", "<p>GTR为电压驱动型<\/p>", "", ""], "r": "C", "e": "【考点定位】第9章，第4节，知识点4：绝缘栅双极晶体管；第9章，第4节，知识点3：电力场效应晶体管；第9章，第4节，知识点1：门极可关断晶闸管；第9章，第4节，知识点2：电力晶体管 \n【解析】IGBT为电压驱动型，Power  MOSFET为电压驱动型、GTR为电流驱动型", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9688", "t": 1, "q": "比较而言，下列半导体器件中开关速度最快的是（     ）。", "a": ["<p>GTO<\/p>", "<p>GTR<\/p>", "<p>Power MOSFET<\/p>", "<p>IGBT<\/p>", "", ""], "r": "C", "e": "【考点定位】第9章，第4节，知识点1：门极可关断晶闸管；第9章，第4节，知识点2：电力晶体管；第9章，第4节，知识点3：电力场效应晶体管 \n【解析】各器件的开关速度大致如下：\nGTO一般为几百Hz，但功率较大，可达到3000A、4500V的容量；\nSCR 的频率一般不超过10KHz，电流可达几千安培，电压6000V以上；\nGTR的额定参数可达1800V/800A/2kHz、1400v/600A/5kHz、600V/3A/100kHz左右；\nIGBT的频率一般不会超过100KHz，但高频性能比GTR更好；\nPower  MOSFET 的频率理论上可以到1MHz（1000KHz）；\n所以排序大概为： SCR < GTO <GTR<IGBT<Power  MOSFET。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9689", "t": 1, "q": "关于绝缘栅双极型晶体管（IGBT），下面说法错误的是（     ）。", "a": ["<p>IGBT相比Power MOSFET，其通态电阻较大，因而导通损耗也较大<\/p>", "<p>IGBT是由Power MOSFET和GTR复合而制成的<\/p>", "<p>IGBT工作在开关状态时，是在正向阻断区和饱和区之间转换<\/p>", "<p>开关频率介于GTR和Power MOSFET之间<\/p>", "", ""], "r": "A", "e": "【考点定位】第9章，第4节，知识点4：绝缘栅双极晶体管；第9章，第4节，知识点2：电力晶体管；第9章，第4节，知识点3：电力场效应晶体管\n【解析】IGBT比Power  MOSFET损耗小。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9690", "t": 1, "q": "下列电力电子器件中，电流容量最大的是（     ）。", "a": ["<p>GTO<\/p>", "<p>GTR<\/p>", "<p>Power MOSFET<\/p>", "<p>IGBT<\/p>", "", ""], "r": "A", "e": "【考点定位】第9章，第4节，知识点1：门极可关断晶闸管；第9章，第4节，知识点2：电力晶体管；第9章，第4节，知识点3：电力场效应晶体管；第9章，第4节，知识点4：绝缘栅双极晶体管\n【解析】本题主要考查全控型电力电子器件的特点，GTO导通时饱和程度较深，适用于高压大容量场合， Power MOSFET属于单极型器件，没有少子的存储效应，因此开关速度较快，适用于高频电路。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9691", "t": 1, "q": "以下属于电流驱动型器件特征的是（     ）。", "a": ["<p>开关速度快<\/p>", "<p>输入阻抗高<\/p>", "<p>导通损耗小<\/p>", "<p>驱动功率小<\/p>", "", ""], "r": "C", "e": "【考点定位】第9章，第2节，知识点1：PN结与电力二极管的工作原理\n【解析】电流驱动型器件具有电导调制效应、通态电压降低、导通损耗小、载流能力大、可承受电压高、工作频率较低、所需驱动功率大、驱动电路比较复杂等特征。电压驱动型器件具有输入阻抗高、开关速度快、驱动功率小、驱动电路简单、工作频率高等特征。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9692", "t": 1, "q": "下列说法不正确的是（     ）。", "a": ["<p>电力二极管正向平均电流是按照电流的发热效应来定义的<\/p>", "<p>电力二极管按有效值相等的原则来选取电流定额<\/p>", "<p>普通二极管又称整流二极管<\/p>", "<p>肖特基二极管属于少子器件<\/p>", "", ""], "r": "D", "e": "【考点定位】第9章，第2节，知识点1：PN结与电力二极管的工作原理；知识点2：电力二极管的伏安特性；知识点4：电力二极管的主要类型\n【解析】肖特基二极管是贵金属和N型半导体结合而成的器件，导电时的载流子为N型半导体中的自由电子，为多子器件。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9693", "t": 1, "q": "下列关于电力场效应晶体管的说法，正确的是（     ）。", "a": ["<p>电力场效应晶体管就是绝缘栅型的场效应管<\/p>", "<p>电力场效应晶体管就是N沟道增强型垂直双扩散结构的电力晶体管<\/p>", "<p>电力MOSFET 采用达林顿接法组成单元结构<\/p>", "<p>电力MOSFET 是多元集成结构<\/p>", "", ""], "r": "D", "e": "【考点定位】第9章，第4节，知识点3：电力场效应晶体管\n【解析】电力场效应晶体管和小功率的场效应管一样分成结型和场效应型，A说法错误；电力场效应晶体管包含N沟道、P沟道，增强型和耗尽型，所以B说法错误；电力场效应晶体管采用多元集成结构，C说法错误，D说法正确。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9694", "t": 1, "q": "下列说法不正确的是（     ）。", "a": ["<p>电子技术包括信息电子技术和电力电子技术两大分支，通常所说的模拟电子技术和数字电子技术就属于后者<\/p>", "<p>为减少自身损耗，提高效率，电力电子器件一般都工作在开关状态<\/p>", "<p>当器件的工作频率较高时，开关损耗会成为主要的损耗<\/p>", "<p>电力变换通常分为四大类，即交流变直流、直流变直流、直流变交流、交流变交流<\/p>", "", ""], "r": "A", "e": "【考点定位】第9章，第1节，知识点1：电力电子技术的概念及其应用；知识点2：电力电子器件的概念、特征、损耗\n【解析】电子技术包括信息电子技术和电力电子技术两大分支，通常所说的模拟电子技术和数字电子技术就属于前者。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9695", "t": 1, "q": "晶闸管属于（     ）型半控功率半导体器件。", "a": ["<p>电流驱动双极<\/p>", "<p>电压驱动双极<\/p>", "<p>电流驱动单极<\/p>", "<p>电压驱动单极<\/p>", "", ""], "r": "A", "e": "【考点定位】第9章，第3节，知识点1：晶闸管的结构与工作原理\n【解析】晶闸管属于电流驱动双极型半控器件。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9696", "t": 1, "q": "关于晶闸管的关断，下列说法不正确的是（     ）。", "a": ["<p>当阳极电流大于维持电流时，晶闸管才会由导通转为截止<\/p>", "<p>为了保证晶闸管可靠迅速地关断，在管子阳极电压下降为零之后，应加一段时间的反向电压<\/p>", "<p>晶闸管在触发开通过程中，当阳极电流小于擎住电流之前，如去掉触发脉冲，晶闸管又会关断<\/p>", "<p>在正向阻断恢复时间内如果重新对晶闸管施加正向电压，晶闸管会重新正向导通，而不是受门极电流控制而导通<\/p>", "", ""], "r": "A", "e": "【考点定位】第9章，第3节，知识点2：晶闸管的基本特性\n【解析】当阳极电流小于维持电流时，晶闸管才会由导通转为截止。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9697", "t": 2, "q": "电力变换的基本形式有（     ）。", "a": ["<p>AC/AC<\/p>", "<p>AC/DC<\/p>", "<p>DC/DC<\/p>", "<p>DC/AC<\/p>", "", ""], "r": "ABCD", "e": "【考点定位】第9章，第1节，知识点1：电力电子技术的概念及其应用\n【解析】电力变换的基本形式：整流、逆变、直流变直流、交流变交流。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9698", "t": 2, "q": "下列电力电子器件属于单极型的是（     ）。", "a": ["<p>晶闸管<\/p>", "<p>肖特基二极管<\/p>", "<p>电力MOSFET<\/p>", "<p>电力晶体管<\/p>", "", ""], "r": "BC", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类\n【解析】按载流子参与导电情况的分类，电力电子器件可分为：\n（1）单极型器件（多子器件）：只有一种载流子参与导电。如：肖特基二极管、Power MOSFET。\n（2）双极型器件（少子器件）：由电子和空穴两种载流子参与导电。如：Thyristor、GTO、GTR。\n（3）复合型器件：由单极型器件和双极型器件组合而成，也称混合型器件。如：IGBT、IGCT。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9699", "t": 2, "q": "与信息电子器件相比，电力电子器件的特点是（     ）。", "a": ["<p>电力电子器件必须直接连接在主电路中<\/p>", "<p>电力电子器件变换的电功率远大于信息电子器件<\/p>", "<p>电力电子器件需要用信息电子器件来控制<\/p>", "<p>电力电子器件自身的损耗远大于信息电子器件<\/p>", "", ""], "r": "ABCD", "e": "【考点定位】第9章，第1节，知识点2：电力电子器件的概念、特征、损耗\n【解析】电力电子器件的特点。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9700", "t": 2, "q": "电力电子器件在导通状态时，具有什么特点（     ）。", "a": ["<p>阻抗很大，接近于断路<\/p>", "<p>阻抗很小，接近于短路<\/p>", "<p>电流几乎为零，管子两端电压由外电路决定<\/p>", "<p>管压降接近于零，电流由外电路决定<\/p>", "", ""], "r": "BD", "e": "【考点定位】第9章，第1节，知识点2：电力电子器件的概念、特征、损耗\n【解析】电力电子器件在导通状态时，相当于开关的关状态，阻抗很小，接近于短路。管压降接近于零，电流由外电路决定。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9701", "t": 2, "q": "以下不属于全控型器件的是（     ）。", "a": ["<p>IGBT<\/p>", "<p>电力二极管<\/p>", "<p>Power MOSFET<\/p>", "<p>SCR<\/p>", "", ""], "r": "BD", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类\n【解析】电力二极管是不可控器件，SCR是半控器件，所以选择BD", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9702", "t": 2, "q": "按内部电子和空穴两种载流子参与导电的情况，电力电子器件可分为（     ）。", "a": ["<p>单极型器件<\/p>", "<p>双极型器件<\/p>", "<p>复合型器件<\/p>", "<p>电流驱动型器件<\/p>", "", ""], "r": "ABC", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类\n【解析】按照载流子参与导电的情况\n（1）单极型器件（多子器件）：只有一种载流子参与导电。如：肖特基二极管、Power  MOSFET；\n（2）双极型器件（少子器件）：由电子和空穴两种载流子参与导电。如：Thyristor、GTO、GTR；\n（3）复合型器件：由单极型器件和双极型器件组合而成，也称混合型器件。如：IGBT、IGCT。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9703", "t": 2, "q": "下列电力电子器件中，内部存在电导调制效应的有（     ）。", "a": ["<p>GTO<\/p>", "<p>GTR<\/p>", "<p>Power MOSFET<\/p>", "<p>IGBT<\/p>", "", ""], "r": "ABD", "e": "【考点定位】第9章，第2节，知识点1：PN结与电力二极管的工作原理\n【解析】要产生电导调制效应，电力电子器件导电时必须有两种载流子参与；而C选项只有一种载流子参与导电。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9704", "t": 2, "q": "电力电子器件在阻断状态时，具有什么特点（     ）。", "a": ["<p>阻抗很大，接近于断路<\/p>", "<p>阻抗很小，接近于短路<\/p>", "<p>电流几乎为零，管子两端电压由外电路决定<\/p>", "<p>管压降接近于零，电流由外电路决定<\/p>", "", ""], "r": "AC", "e": "【考点定位】第9章，第2节，知识点1：PN结与电力二极管的工作原理\n【解析】电力电子器件处于开状态的特点。电力电子器件在阻断状态时，相当于开关的开状态，阻抗很大，接近于断路。电流几乎为零，管子两端电压由外电路决定。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9705", "t": 2, "q": "以下说法正确的是（     ）。", "a": ["<p>电力电子器件导通时器件上有一定的通态压降，形成通态损耗<\/p>", "<p>电力电子器件导通时器件上有微小的断态漏电流流过，形成通态损耗<\/p>", "<p>电力电子器件阻断时器件上有微小的断态漏电流流过，形成断态损耗<\/p>", "<p>电力电子器件阻断时器件上有一定的通态压降，形成断态损耗<\/p>", "", ""], "r": "AC", "e": "【考点定位】第9章，第1节，知识点2：电力电子器件的概念、特征、损耗\n【解析】通态损耗：导通时，器件上有一定的通态压降，形成通态损耗。通态损耗是器件功率损耗的主要成因。断态损耗：阻断时，器件上有微小的断态漏电流流过，形成断态损耗。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9706", "t": 2, "q": "关于肖特基二极管的特性，说法正确的是（     ）。", "a": ["<p>反向恢复时间比快恢复二极管短<\/p>", "<p>开关损耗和正向导通损耗都比快速二极管还要小，效率高<\/p>", "<p>多用于200V以下的低压场合，而且必须更严格地限制其工作温度<\/p>", "<p>是一种单极型器件<\/p>", "", ""], "r": "ABCD", "e": "【考点定位】第9章，第2节，知识点4：电力二极管的主要类型\n【解析】肖特基二极管的特性：\n①优点：反向恢复时间很短（10-40ns），正向恢复过程中也不会有明显的电压过冲；在反向耐压较低的情况下其正向压降也很小，明显低于快恢复二极管；因此，其开关损耗和正向导通损耗都比快速二极管还要小，效率高。\n②缺点：当所能承受的反向耐压提高时其正向压降也会高得不能满足要求，因此多用于200V以下的低压场合；反向漏电流较大且对温度敏感，因此反向稳态损耗不能忽略，而且必须更严格地限制其工作温度。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9707", "t": 2, "q": "肖特基二极管的优点有（     ）。", "a": ["<p>反向恢复时间短<\/p>", "<p>正向压降较小<\/p>", "<p>效率较高<\/p>", "<p>反向漏电流较大<\/p>", "", ""], "r": "ABC", "e": "【考点定位】第9章，第2节，知识点4：电力二极管的主要类型\n【解析】肖特基二极管（Schottky Barrier Diode——SBD）：属于单极型（多子）器件\n①优点在于：反向恢复时间很短（10-40ns），正向恢复过程中也不会有明显的电压过冲；在反向耐压较低的情况下其正向压降也很小，明显低于快恢复二极管；因此，其开关损耗和正向导通损耗都比快速二极管还要小，效率高。\n②缺点在于：当所能承受的反向耐压提高时其正向压降也会高得不能满足要求，因此多用于200V以下的低压场合；反向漏电流较大且对温度敏感，因此反向稳态损耗不能忽略，而且必须更严格地限制其工作温度。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9708", "t": 2, "q": "电力二极管的主要类型有（     ）。", "a": ["<p>普通二极管<\/p>", "<p>快恢复二极管<\/p>", "<p>肖特基二极管<\/p>", "<p>发光二极管<\/p>", "", ""], "r": "ABC", "e": "【考点定位】第9章，第2节，知识点4：电力二极管的主要类型\n【解析】整流二极管（即普通二极管）、快恢复二极管和肖特基二极管属于电力二极管。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9709", "t": 2, "q": "下列关于普通晶闸管结构的描述，正确的有（     ）。", "a": ["<p>四层半导体<\/p>", "<p>三个PN结<\/p>", "<p>三个电极<\/p>", "<p>二个等效晶体管<\/p>", "", ""], "r": "ABCD", "e": "【考点定位】第9章，第3节，知识点1：晶闸管的结构与工作原理\n【解析】考察晶闸管的半导体结构；它是四层半导体，形成三个PN结，有三个端子，可等效为两个三极管（一个NPN和一个PNP）组合的器件", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9710", "t": 2, "q": "下列关于晶闸管额定电流的说法，正确的是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260728/Gqh9DEGYiZoNDmFmuNEmPXo8Fy2QdASyIten95sB.png\"><\/p>", "<p>额定电流为晶闸管在环境温度为40℃和规定的冷却状态下，稳定结温不超过额定结温时所允许流过的最大工频正弦半波电流的平均值<\/p>", "<p>使用时，应按实际电流与通态平均电流有效值相等的原则来选取晶闸管，应留一定的裕量，一般取1.5-2倍<\/p>", "<p>对同一晶闸管来说，通常擎住电流I<sub>L<\/sub>约为维持电流I<sub>H<\/sub>的2-4倍<\/p>", "", ""], "r": "ABCD", "e": "【考点定位】考察第9章，第3节，知识点3：晶闸管的主要参数\n【解析】晶闸管额定电流的基本定义和特性", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9711", "t": 2, "q": "下列关于晶闸管的说法，正确的是（     ）。", "a": ["<p>晶闸管为PNPN四层三端结构<\/p>", "<p>晶闸管的外形有螺栓型封装和平板型封装两种<\/p>", "<p>螺栓型封装，通常螺栓是其阳极，能散热器紧密连接且安装方便<\/p>", "<p>平板型封装的晶闸管，可由两个散热器将其夹在中间<\/p>", "", ""], "r": "ABCD", "e": "【考点定位】第9章，第3节，知识点1：晶闸管的结构与工作原理\n【解析】晶闸管内部内部是PNPN四层半导体结构（相当于有三个PN结）。晶闸管的外形有螺栓型封装和平板型封装两种。螺栓型封装，通常螺栓是其阳极，能散热器紧密连接且安装方便。平板型封装的晶闸管，可由两个散热器将其夹在中间。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9712", "t": 2, "q": "下面关于电力电子器件说法正确的是（     ）。", "a": ["<p>双极型电力电子器件存在电导调制效应，导通管压降一般很低<\/p>", "<p>单极型电力电子器件只有一种载流子参与导电，一般开关频率较低<\/p>", "<p>电力电子器件频率增加，耐压耐流水平也随之增加<\/p>", "<p>智能功率模块集成驱动保护控制功能，是电力电子器件的发展方向<\/p>", "", ""], "r": "AD", "e": "【考点定位】第9章，第1节，知识点4：电力电子器件的分类；第9章，第2节，知识点1：PN结与电力二极管的工作原理；\n【解析】单极型电力电子器件只有一种载流子参与导电，一般开关频率较高，答案B错误。\n电力电子器件的频率增加，耐压耐流水平也随之降低，如Power MOSFET，答案C错误。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9713", "t": 2, "q": "下列电力电子器件属于电流驱动型的是（     ）。", "a": ["<p>GTO<\/p>", "<p>GTR<\/p>", "<p>P－MOSFET<\/p>", "<p>SCR<\/p>", "", ""], "r": "ABD", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9714", "t": 2, "q": "双极型电流驱动型器件具有的特点有（     ）。", "a": ["<p>耐压等级高<\/p>", "<p>通流能力强<\/p>", "<p>开关速度快<\/p>", "<p>驱动功率大<\/p>", "", ""], "r": "ABD", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类；", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9715", "t": 2, "q": "下列关于电力场效应管的说法，正确的有（     ）。", "a": ["<p>电力场效应晶体管主要指绝缘栅型，英文全称为Metal Oxide Semiconductor FET<\/p>", "<p>导通时只有一种极性的载流子（多子）参与导电，是单极型晶体管<\/p>", "<p>电力Power MOSFET工作在开关状态，即在截止区和非饱和区之间来回转换<\/p>", "<p>电力Power MOSFET的通态电阻具有正温度系数，对器件并联时的均流有利<\/p>", "", ""], "r": "ABCD", "e": "【考点定位】第9章，第4节，知识点3：电力场效应晶体管", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9716", "t": 2, "q": "关于肖特基二极管的特点，叙述正确的是（     ）。", "a": ["<p>反向耐压提高时正向压降会提高，多用于200V 以下<\/p>", "<p>反向恢复时间很短<\/p>", "<p>正向恢复过程中也不会有明显的电压过冲<\/p>", "<p>反向漏电流较大且对温度敏感<\/p>", "", ""], "r": "ABCD", "e": "【考点定位】考察第9章，第2节，知识点4：电力二极管的主要类型\n【解析】肖特基二极管：属于单极型（多子）器件\n①优点在于：反向恢复时间很短（10~40ns），正向恢复过程中也不会有明显的电压过冲；在反向耐压较低的情况下其正向压降也很小，明显低于快恢复二极管；因此，其开关损耗和正向导通损耗都比快速二极管还要小，效率高。\n②缺点在于：当所能承受的反向耐压提高时其正向压降也会高得不能满足要求，因此多用于200V以下的低压场合；反向漏电流较大且对温度敏感，因此反向稳态损耗不能忽略，而且必须更严格地限制其工作温度。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9717", "t": 2, "q": "普通晶闸管导通需要具备的条件有（     ）。", "a": ["<p>承受正向电压<\/p>", "<p>承受反向电压<\/p>", "<p>控制极上有控制脉冲<\/p>", "<p>控制极上没有控制脉冲<\/p>", "", ""], "r": "AC", "e": "【考点定位】考察第9章，第3节，知识点1：晶闸管的结构与工作原理\n【解析】晶闸管导通必须具备两个条件：1.晶闸管承受正向电压；2.门极有触发电流。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9718", "t": 2, "q": "以下不是全控器件的是（     ）。", "a": ["<p>晶闸管<\/p>", "<p>电力二极管<\/p>", "<p>电力场效应晶体管<\/p>", "<p>半导体整流器<\/p>", "", ""], "r": "ABD", "e": "按照南网定位【考点定位】考察第9章，第1节，知识点3：电力电子器件的分类\n【解析】晶闸管是半控型器件；电力二极管是不可控器件；电力场效应晶体管是全控型器件；半导体整流器（普通电力二极管）是不可控器件。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9719", "t": 2, "q": "下列电力电子器件中，属于电流驱动型的是（     ）。", "a": ["<p>GTO<\/p>", "<p>GTR<\/p>", "<p>IGBT<\/p>", "<p>IGCT<\/p>", "", ""], "r": "AB", "e": "【考点定位】考察第9章，第1节，知识点3：电力电子器件的分类", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9720", "t": 2, "q": "绝缘栅双极晶体管（IGBT）可以视为由哪些器件组合而成的（     ）。", "a": ["<p>GTO<\/p>", "<p>GTR<\/p>", "<p>MOSFET<\/p>", "<p>IGCT<\/p>", "", ""], "r": "BC", "e": "【考点定位】考察第9章，第4节，知识点4绝缘栅双极晶体管", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9721", "t": 2, "q": "下列关于晶闸管的导通、关断特性的说法，正确的是（     ）。", "a": ["<p>正常触发方式下，晶闸管的阳极与阴极之间加正向电压时，仅在门极有触发电流的情况下晶闸管才能开通<\/p>", "<p>晶闸管一旦导通，门极就失去控制作用<\/p>", "<p>要使晶闸管关断，根本上要使晶闸管的电流降到接近于零的某一数值<\/p>", "<p>承受反向电压时，门极输入触发电流，晶闸管导通<\/p>", "", ""], "r": "ABC", "e": "【考点定位】第9章，第３节，知识点1：晶闸管的结构与工作原理\n【解析】承受反向电压时，不论门极是否有触发电流，晶闸管都不会导通", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9722", "t": 2, "q": "晶闸管的工作状态有（     ）等几种状态。", "a": ["<p>正向阻断<\/p>", "<p>正向导通<\/p>", "<p>反向阻断<\/p>", "<p>反向导通<\/p>", "", ""], "r": "ABC", "e": "【考点定位】第9章，第３节，知识点1：晶闸管的结构与工作原理\n【解析】晶闸管的工作状态有正向阻断、正向导通、反向阻断3种状态。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9723", "t": 2, "q": "晶闸管的伏安特性的说法，正确的有（     ）。", "a": ["<p>正向特性（第I象限）：I<sub>G<\/sub>=0时，初始阶段，器件两端施加正向电压，正向阻断状态，只有很小的正向漏电流流过<\/p>", "<p>正向电压超过临界极限即正向转折电压时，则漏电流急剧增大，器件开通<\/p>", "<p>随着门极电流幅值的增大，正向转折电压降低<\/p>", "<p>导通后的晶闸管特性和二极管的正向特性相仿<\/p>", "", ""], "r": "ABCD", "e": "【考点定位】第9章，第３节，知识点2：晶闸管的基本特性\n【解析】晶闸管的静态伏安特性特点。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9724", "t": 2, "q": "具有四层半导体结构的器件有（     ）。", "a": ["<p>晶闸管<\/p>", "<p>GTO<\/p>", "<p>Power MOSFET<\/p>", "<p>GTR<\/p>", "", ""], "r": "AB", "e": "<p>【考点定位】第9章，第3节，知识点1：晶闸管的结构与工作原理；第9章，第4节，知识点1：门极可关断晶闸管；第9章，第4节，知识点2：电力晶体管 【解析】具有四层半导体结构的器件有晶闸管、GTO。<\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9725", "t": 2, "q": "下列哪些电力电子器件是少子器件？（     ）", "a": ["<p>肖特基二极管<\/p>", "<p>晶闸管<\/p>", "<p>电力晶体管<\/p>", "<p>绝缘栅型电力场效应晶体管<\/p>", "", ""], "r": "BC", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类；第9章，第2节，知识点1：PN结与二极管的工作原理；第9章，第3节，知识点1：晶闸管的结构和工作原理；第9章，第4节，知识点2：电力晶体管；第9章，第4节，知识点3：电力场效应晶体管；\n【解析】双极型器件（少子器件）：由电子和空穴两种载流子参与导电。如：Thyristor、GTO、GTR。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9726", "t": 2, "q": "下列器件中属于电压型驱动的是（     ）。", "a": ["<p>GTR<\/p>", "<p>IGBT<\/p>", "<p>Power MOSFET<\/p>", "<p>达林顿管<\/p>", "", ""], "r": "BC", "e": "【考点定位】第9章，第4节，知识点1：门极可关断晶闸管；第9章，第4节，知识点2：电力晶体管；第9章，第4节，知识点3：电力场效应晶体管\n【解析】IGBT和Power  MOSFET属于电压型，其余是电流驱动型", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9727", "t": 2, "q": "Power  MOSFET的漏极伏安特性中的3个区域与GTR共发射极接法时的输出特性中的3个区域有对应关系，下列说法正确的是（     ）。", "a": ["<p>前者的截止区对应后者的截止区<\/p>", "<p>前者的饱和区对应后者的放大区<\/p>", "<p>前者的非饱和区对应后者的饱和区<\/p>", "<p>前者的饱和区对应后者的饱和区<\/p>", "", ""], "r": "ABC", "e": "【考点定位】第9章，第4节，知识点2：电力晶体管；第9章，第4节，知识点3：电力场效应晶体管 \n【解析】Power  MOSFET与GTR特性的区别与联系。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9728", "t": 2, "q": "下列哪些电力电子器件是电压驱动型的？（     ）", "a": ["<p>SCR<\/p>", "<p>GTR<\/p>", "<p>Power MOSFET<\/p>", "<p>IGBT<\/p>", "", ""], "r": "CD", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类；第9章，第3节，知识点1：晶闸管的结构和工作原理；第9章，第4节，知识点2：电力晶体管；第9章，第4节，知识点3：电力场效应晶体管；第9章，第4节，知识点4：绝缘栅双极晶体管\n【解析】（1）电流驱动型：通过从控制端注入或者抽出电流来实现导通或者关断。如：Thyristor、GTO、GTR；\n（2）电压驱动型（场控器件）：仅通过在控制端和公共端之间施加一定的电压信号就可实现导通或者关断。如：IGBT、Power  MOSFET。\nIGBT、Power  MOSFET为电压驱动型，其余为电流驱动型", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9729", "t": 2, "q": "在如下器件：电力二极管（Power Diode）、晶闸管（SCR）、门极可关断晶闸管（GTO）、电力晶体管（GTR）、电力场效应管（电力Power  MOSFET）、绝缘栅双极型晶体管（IGBT）中，属于不可控器件的是（     ），属于半控型器件的是（     ）。", "a": ["<p>GTO<\/p>", "<p>GTR<\/p>", "<p>电力二极管<\/p>", "<p>晶闸管<\/p>", "", ""], "r": "CD", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类；第9章，第2节，知识点1：PN结与电力二极管的基本原理；第9章，第3节，知识点1：晶闸管的结构与工作原理；第9章，第4节，知识点1：门极可关断晶闸管；第9章，第4节，知识点2：电力晶体管；第9章，第4节，知识点3：电力场效应晶体管；第9章，第4节，知识点4：绝缘栅双极晶体管；\n【解析】不可控器件是电力二极管、半控型器件主要是指晶闸管（Thyristor或SCR）及其大部分派生器件。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9730", "t": 3, "q": "按照电力电子器件能够被控制电路信号所控制的程度，可将电力电子器件分为不可控器件、半控器件、全控器件；按照驱动电路信号的性质，可分为电流驱动型和电压驱动型。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【考点定位】第9章，第1节，知识点3：电力电子器件的分类\n【解析】按照电力电子器件能够被控制电路信号所控制的程度，可将电力电子器件分为不可控器件、半控器件、全控器件；按照驱动电路信号的性质，可分为电流驱动型和电压驱动型。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9731", "t": 3, "q": "半导体材料的电导调制效应使得PN结在正向电流较大时压降仍然很低，维持在1V左右，所以正向偏置的PN结表现为低阻态。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/26jEStEnS8yfy2dfFqCLFKgCaHTu25vLJNOIZ3pW.png\"><\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9732", "t": 3, "q": "电力二极管的动态特性是指它的伏安特性。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【考点定位】第9章，第2节，知识点2：电力二极管的伏安特性\n【解析】电力二极管的基本特性：分为静态特性和动态特性\n（1）静态特性指伏安特性；\n（2）动态特性：因为结电容的存在，电压—电流特性是随时间变化的，这就是电力二极管的动态特性，并且往往专指反映通态和断态之间转换过程的开关特性。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9733", "t": 3, "q": "电力二极管的额定电流是在指定的管壳温度和散热条件下，允许流过的最大工频正弦半波电流的有效值。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【考点定位】第9章，第2节，知识点3：电力二极管的主要参数\n【解析】电力二极管的额定电流是在指定的管壳温度和散热条件下，允许流过的最大工频正弦半波电流的平均值。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9734", "t": 3, "q": "阴极是晶闸管主电路与控制电路的公共端。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【考点定位】第9章，第３节，知识点1：晶闸管的结构与工作原理\n【解析】晶闸管的结构：（1）引出阳极A、阴极K和门极（控制端）G三个联接端，阴极为晶闸管主电路与控制电路的公共端；（2）内部是PNPN四层半导体结构（相当于有三个PN结）。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9735", "t": 3, "q": "维持电流是指晶闸管维持导通所必需的最小电流，一般为几十到几百毫安。其与结温有关，结温越高，则该值越小。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【考点定位】第9章，第３节，知识点3：晶闸管的主要参数\n【解析】考查维持电流的定义", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9736", "t": 3, "q": "光控晶闸管不仅保证了主电路与控制电路之间的绝缘，还可以避免电磁干扰的影响，因此目前在高压大功率的场合占据重要地位。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【考点定位】考察第9章，第3节，知识点4：晶闸管派生器件\n【解析】光控晶闸管是利用一定波长的光照信号触发导通的晶闸管，最大特点就是避免电磁干扰的影响，因此目前在在高压大功率的场合占据重要地位，正确。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9737", "t": 3, "q": "GTO关断时需要的负脉冲电流值不大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【考点定位】第9章，第4节，知识点1：门极可关断晶闸管\n【解析】要使GTO关断，可以通过在门极施加负的脉冲电流。一个1000A的GTO，关断时门极负脉冲电流的峰值达200A。这是一个相当大的数值。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9738", "t": 3, "q": "电力晶体管（GTR）在实际使用中，其允许功耗不仅由最大集电极耗散功率决定还要受到二次击穿功率的限制。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【考点定位】第9章，第4节，知识点2：电力晶体管<\/p>\n<p>【解析】GTR工作时不仅不能超过最高电压 <em>U<\/em><em><sub>ceM<\/sub><\/em>，集电极最大电流<em>I<\/em><em><sub>cM<\/sub><\/em>和最大耗散功率<em>P<\/em><em><sub>cM<\/sub><\/em>，也不能超过二次击穿临界线。<\/p>", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9739", "t": 3, "q": "N沟道增强型Power  MOSFET，当其导通时，在导电沟道中流过的载流子是空穴。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【考点定位】第9章，第4节，知识点3：电力场效应晶体管\n【解析】N沟道增强型Power  MOSFET，当其导通时，在导电沟道中流过的载流子是电子。P沟道增强型Power  MOSFET，当其导通时，在导电沟道中流过的载流子是空穴。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9740", "t": 3, "q": "双向晶闸管用平均值表示额定电流。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【考点定位】考察第9章，第3节，知识点4：晶闸管的派生器件→2 双向晶闸管\n【解析】由于双向晶闸管通常用在交流电路中，因此用有效值表示额定电流。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9741", "t": 3, "q": "IGBT开关速度一般低于Power MOSFET，导通管压降低于GTR。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【考点定位】第9章，第4节，知识点4：绝缘栅双极晶体管\n【解析】IGBT的开通过程与电力Power MOSFET相似，IGBT的开关速度低于电力Power MOSFET。IGBT是电压驱动型器件。GTR是电流驱动型器件。电流驱动型器件导通压降比电压驱动型器件低。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9742", "t": 3, "q": "在电力电子技术学科中，英文缩写IPM，即智能功率模块。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【考点定位】第9章，第4节，知识点4：绝缘栅双极晶体管\n【解析】智能功率模块（Intelligent Power Module——IPM）：专指IGBT及其辅助器件与其保护和驱动电路的单片集成，也称智能IGBT（Intelligent IGBT）。", "l3": "电工技术基础", "l4": "第9章-考纲删除", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = !!ans;
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
</html>
