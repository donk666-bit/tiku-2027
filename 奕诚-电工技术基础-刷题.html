, "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/nCQYfy7PJziQyTnpiZ0fP8CmHGyc49VroYgLxMFi.png\"><\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/KB3uUuyC9fxYbKnPLWJWTRzUOAQNBbLs24ew4ACC.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7735", "t": 1, "q": "理想电流源串联电阻，则其外部特性的正确描述是（     ） 。", "a": ["<p>电流和端电压均恒定<\/p>", "<p>电流恒定，端电压由外电路决定<\/p>", "<p>端电压恒定，电流由外电路决定<\/p>", "<p>电流和电压均不恒定<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/qI2DpgxntG3ngiMQBLPK7w4g451BELLKVUl0hpPe.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7736", "t": 1, "q": "当实际电流源短路时，实际电流源内部（     ） 。", "a": ["<p>有电流，有功率损耗<\/p>", "<p>有电流，无功率损耗<\/p>", "<p>无电流，有功率损耗<\/p>", "<p>无电流，无功率损耗<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/DkZJLvgOv7ynXcTEiJUSkAUrSuTQjGoL3FlaKow6.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7737", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/sqaT3wZqW0lpkhBfFihdCGAT9yyeSfEyLCTH5Xsv.png\"><\/p>", "a": ["<p>0.5A<\/p>", "<p>2A<\/p>", "<p>1A<\/p>", "<p>0.125A<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/NONXq79jKzCYMToKtPxc67n1PWovD5TO69CryUc3.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7738", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/9s1om0Pagy8tLOBUxce5LwmBAASwB1f1ktlvYtdm.png\"><\/p>", "a": ["<p>1/4<\/p>", "<p>1/8<\/p>", "<p>1/2<\/p>", "<p>1A<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/LCaZPFsQAUZKaRgJaxFUkHhUG1bCgTKTCOBRCX1l.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7739", "t": 1, "q": "受控电压源和电阻的串联可等效变换为（     ）。", "a": ["<p>受控电压源和电阻的并联<\/p>", "<p>受控电流源和电阻的并联<\/p>", "<p>受控电流源和电阻的串联<\/p>", "<p>纯电阻<\/p>", "", ""], "r": "B", "e": "【定位】第2章，2.1节，知识点4：含电源支路的等效变换\n【解析】受控源特性\n1.受控电压源和电阻的串联与受控电流源和电阻的并联组合，也可以仿照上述方法进行等效变换。\n2.变换方法：受控电压源当作理想电压源，受控电流源当作理想电流源，则变换规则与实际电源的等效变换相同。\n注意：变化过程中控制量支路要保留，不能参与变换。\n受控源的等效变换与独立电源的等效变换是一致的，要保留受控量。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7740", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/37mXJGZ5aEvSxeyA1V1wyOz5itZamPYDQu9lo4Py.png\"><\/p>", "a": ["<p>3Ω<\/p>", "<p>6Ω<\/p>", "<p>5Ω<\/p>", "<p>-3Ω<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/5C0IuRlFewN6yNcDgvtlUIITWzAKPhDvESnqrYxC.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7741", "t": 1, "q": "列结点电压方程时，要把元件和电源表示为（     ）。", "a": ["<p>电导元件和电压源<\/p>", "<p>电阻元件和电压源<\/p>", "<p>电导元件和电流源<\/p>", "<p>电阻元件和电流源<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/l7VVDulbItaGm1oRdlfa3VU2GhRphRlWPJS8jcek.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7742", "t": 1, "q": "<p>（选项修订，已系统为准）<img src=\"https://dati.gwzpks.com/uploads/20260717/NP0qc9bNKUrMmoKKjLcG1JMuyme2Ty26UrkRbAcs.png\"><\/p>", "a": ["<p>-2V<\/p>", "<p>4V<\/p>", "<p>6V<\/p>", "<p>8V<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260803/CIPlgpLxROUZ5ETrWxNjnk1xvVWShmlluXJgzvqg.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7743", "t": 1, "q": "对于具有5个结点7个支路的电路可列出的独立的结点电压方程的个数是（     ）。", "a": ["<p>5<\/p>", "<p>3<\/p>", "<p>4<\/p>", "<p>6<\/p>", "", ""], "r": "C", "e": "【定位】第2章，2.2节，知识点1：结点电压法方程的列写方法\n【解析】结点电压法的定义：\n有n个结点，b条支路的电路，任意选择一个结点为参考结点，设其电位为0，其余n-1个结点称为独立结点。独立结点与参考结点间的电压称为独立结点的结点电压。\n以结点电压为未知变量，依KCL列方程组求解的方法称为结点电压法。一般需要列写n-1个独立方程。\n结点电压法的本质是列写KCL方程，独立方程个数为n-1个，故此题为5-1=4个，牢记KCL方程个数计算公式为n-1，遇此类问题可直接由公式求。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7744", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/kCatSheug4I5mPyLeQ6zM2mpg1lBnM39LJ4myEiC.png\"><\/p>", "a": ["<p>-6A<\/p>", "<p>6A<\/p>", "<p>12A<\/p>", "<p>-12A<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/yNpFdE63DX1rYtkurSJNF3oScnEPZn2mYdY42Rqy.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7745", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/OUW9ZGZP97P4e72deIeyLrP9BwqysVtumrOQa4P5.png\"><\/p>", "a": ["<p>5V<\/p>", "<p>-5V<\/p>", "<p>3V<\/p>", "<p>-3V<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/XzGMs5eSoiu7C5AEa1YVaswb5lgjSCLzSuteohgO.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7746", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/6EOUhGGgkfa2ul92cT94Z9A5oR8mNbkfBt9cpQ7k.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/b5cxgcS8QaN6X7aCLRpzH287L3PUT2U8MaHeG7Qm.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/b4mgm1Iy2hx7T7PrjGwN7p8cv7vdVdoo2m6IxtFu.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/6AeyVFiEg1o00OPyURajGvyLfR6tOYUIWxNdBOcx.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/TvC4L4jfcZrC04tDi7Sr3gHmOB9ETwUDxe41Ch3Y.png\"><\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/RCDSHvhB4PW4IzH9f6pYwnkz2bXPvfEisSrOXGuk.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7747", "t": 1, "q": "一个具有8个结点、9条支路的电路，有（     ）个独立回路电流方程。", "a": ["<p>2<\/p>", "<p>4<\/p>", "<p>6<\/p>", "<p>8<\/p>", "", ""], "r": "A", "e": "【定位】第2章，2.3节，知识点1：回路电流法\n【解析】回路电流法的定义：\n在独立回路中循环流动的假想电流，称为回路电流。支路电流可以通过求解回路电流获得。\n以回路电流为未知变量，依据KVL列方程组求解的方法称为回路电流法。一般需要列写b-（n-1）个独立方程。网孔电流法是回路电流法的特例。\n本题已知电路一共8个结点、9条支路，可列写回路电流方程个。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7748", "t": 1, "q": "网孔电流法实质是以（     ）为变量，列写（     ）方程。", "a": ["<p>网孔电流，KVL<\/p>", "<p>支路电流，KCL<\/p>", "<p>结点电压，KCL<\/p>", "<p>回路电流，KVL<\/p>", "", ""], "r": "A", "e": "【定位】第2章，2.3节，知识点5：网孔电流法 \n【解析】\n网孔电流是假想的在网孔中循环流动的电流，支路电流可以通过求解网孔电流获得。\n以网孔电流为未知变量，依据KVL列方程组求解的方法称为网孔电流法。一般需要列写b-（n-1）个独立KVL方程。仅适用于平面电路。\n此题考察网孔电流法的定义。网孔电流方程实质为KVL方程，以每个网孔电流为变量。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7749", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/tS9P8uHq4rnF4K6CZx62XFYn24wToCPbNQnkBQpz.png\"><\/p>", "a": ["<p>2/3V<\/p>", "<p>1V<\/p>", "<p>3V<\/p>", "<p>2V<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/3oX1OKwXUhDmjoh8YL8De6ydYosDLzxCpajft9hL.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7750", "t": 1, "q": "下列关于网孔电流法的说法中错误的是（     ）。", "a": ["<p>自阻总是正的<\/p>", "<p>互阻有正有负<\/p>", "<p>两网孔电流在共有支路上的参考方向相同则互阻为正<\/p>", "<p>两网孔电流在共有支路上的参考方向相反则互阻为正<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260902/cGXHp48rnjAieFumRwUo9aH2YPpNuqqtFd1Y405D.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7751", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/tByOmFUIloejTSd8hrN7qSwjsXWFLVEbLJ5O4w6r.png\"><\/p>", "a": ["<p>5个<\/p>", "<p>6个<\/p>", "<p>4个<\/p>", "<p>8个<\/p>", "", ""], "r": "C", "e": "【定位】第2章，2.3节，知识点5：网孔电流法\n【解析】\n网孔电流是假想的在网孔中循环流动的电流，支路电流可以通过求解网孔电流获得。以网孔电流为未知变量，依据KVL列方程组求解的方法称为网孔电流法。一般需要列写b-（n-1）个独立KVL方程。仅适用于平面电路。\n由定义知，通过同一电流的线路即是支路。由题意，将电压源与电阻串联，电流源与电阻并联看做一条线路，图中共有7条支路。结点数为4，故网孔电流方程本质为KVL，数量是，选C。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7752", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/F46rnlrnht9sGV3IzLtvoZnF2PS0Ta4XdfXpc5Av.png\"><\/p>", "a": ["<p>1.26A<\/p>", "<p>0.5A<\/p>", "<p>-0.26A<\/p>", "<p>-0.5A<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/dfhD25N631RIgPDWPFQ5KNep48KiEONgI3VNIIgS.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7753", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/eg616ZxIsBZdwqWPrhCk8O2oGiFRy3SSAKvudR7S.png\"><\/p>", "a": ["<p>-1A<\/p>", "<p>1A<\/p>", "<p>4A<\/p>", "<p>-4A<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/twlYVFUI6bhM0m2uHk4Uoa07D1ZhuylyEtYUxWem.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7754", "t": 1, "q": "列网孔方程时，要把电导和电流源并联变为（     ）再列方程。", "a": ["<p>电阻和电压源并联<\/p>", "<p>电阻和电压源串联<\/p>", "<p>电阻和电流源并联<\/p>", "<p>电阻和电流源串联<\/p>", "", ""], "r": "B", "e": "【定位】第2章，2.3节，知识点5：网孔电流法\n【解析】\n网孔电流是假想的在网孔中循环流动的电流，支路电流可以通过求解网孔电流获得。以网孔电流为未知变量，依据KVL列方程组求解的方法称为网孔电流法。一般需要列写b-（n-1）个独立KVL方程。仅适用于平面电路。\n此题考察的是网孔电流法的实质。列写网孔电流方程实质上是在列写KVL方程，那么一般应该将电导和电流源的并联变为电阻和电压源的串联形式。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7755", "t": 1, "q": "在使用叠加原理时，独立源如何处理（     ）。", "a": ["<p>不作用的电压源用开路替代，不作用的电流源用开路替代<\/p>", "<p>不作用的电压源用短路替代，不作用的电流源用开路替代<\/p>", "<p>不作用的电压源用短路替代，不作用的电流源用短路替代<\/p>", "<p>不作用的电压源用开路替代，不作用的电流源用短路替代<\/p>", "", ""], "r": "B", "e": "【定位】第2章，2.4节，知识点1；叠加定理  \n【解析】做每个独立源单独作用的分电路图，不作用独立电源的处理方法为置零，所谓置零，是指将独立电压源用短路替代，独立电流源用开路替代。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7756", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/qQXe8JRyAphvEklxekKDqZJrsJM7zPmYF11BX87b.png\"><\/p>", "a": ["<p>12A<\/p>", "<p>14A<\/p>", "<p>16A<\/p>", "<p>18A<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/j6RqBRcxtFVJf6ZLW1nomNh6Qu3HGkmjm4iZiDKx.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7757", "t": 1, "q": "使用叠加原理计算电路时，受控源在电路中应该（     ）。", "a": ["<p>保持不变<\/p>", "<p>与独立源同样处理<\/p>", "<p>当作一个电阻<\/p>", "<p>不确定<\/p>", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】叠加定理求解步骤：做每个独立源单独作用的分电路图，独立电源的处理方法为置零，受控源和电阻保留。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7758", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/tTkHP3hRhCbD8dhD03156hyXb5YkGJgtXjygw4W4.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/xs12O7A7Q6uGSjuGNnHbMJY3J0FDhnaWibU0zpHi.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/oJBw8pULjSADCCwiA4HqSWnZO8GCjatW1oONIvcc.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/mdPn675qyeYzE2fmTft091AGVSvxxBdlWLrKeEGI.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/MQgzNYJKag3Lj4wX1n5nrx7Izn5qE3Sfs1Hlvp3l.png\"><\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/qPr1xT5UeygvtcbHu1UviQADIyIcs894434POXGx.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7759", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/fv9ImeKCtDr8yjBJn32QqGWl88mYhECAoOn6BwJP.png\"><\/p>", "a": ["<p>-2V<\/p>", "<p>6V<\/p>", "<p>8V<\/p>", "<p>10V<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/B6h7NcZzrZ8e53zKYr9tCY7ROjExeXrFDk0Y4J2H.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7760", "t": 1, "q": "叠加原理不能应用于功率的原因是（     ）。", "a": ["<p>功率与电压、电流不是线性关系<\/p>", "<p>功率叠加不符合能量守恒定律<\/p>", "<p>叠加原理不符合基尔霍夫定律<\/p>", "<p>叠加原理不符合欧姆定律<\/p>", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】叠加定理只能用于计算线性电路的支路电流或电压，不能直接进行功率的叠加计算，因为功率与电压或电流是平方关系，功率不是电流或电压的一次函数，而不是线性关系，故不能用叠加原理计算功率。故正确答案选A。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7761", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/puclhvbD6xnskipYH5vx179ot7g6QJetfyvNU9zy.png\"><\/p>", "a": ["<p>4V<\/p>", "<p>2V<\/p>", "<p>1V<\/p>", "<p>不确定<\/p>", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】线性电路的齐次性：\n线性电路中，当所有激励（独立电压源和独立电流源）都同时增大或缩小K倍（K为实常数）时，响应（电流和电压）也将同样增大或缩小K倍。当电路中只有一个激励时，响应与激励成正比。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7762", "t": 1, "q": "当一个线性时不变电阻电路同时受多个处于不同支路中的独立电源共同激励时，其中的电压源多次改变而其余独立电源均未发生变化，则电路中任一支路的电流应为（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/b8ax2ubN5SNlT8YnEbvIwLw2sK3Oyw7FXa7m5Jqj.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/0M4DahtnRu8xK5mjli6seml30Vd7T8DFdq4ORDjw.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/xgnV7pNayJjZdlSmbrYsfnAWwNyaH8J0cHZCylcr.png\"><\/p>", "<p>上述三者均有可能<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/oKvmzKuNfuotf9NaKn8gWKAIwL781rPN3o36Suu3.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7763", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/xCrp0OSEtogipAYB98JrxQDw2TlFUGgG4llDHFST.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/cKsaJVBvjWRtadbaSQbeZu7LdjuX0pyA29HZ3tPq.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/UezmRDBLfQ54Xi3AARQr9B2iWXDwl4IvIYzvDygJ.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/gPwsIiM4DzamFUkkGMrfZEzEZqkTErevkKOWwgkL.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/6SFQWfeha5TBIrbpCxit2BmvZpizA4xTGJjAMo5X.png\"><\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/cS5hDIRMtQZuZGFvAxFNNmB2KYOKcmtjAKY03kAm.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7764", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/UTKycd7fJR75ZiGLCxohtBZgEY8OATrcClJMoGm9.png\"><\/p>", "a": ["<p>2Ω<\/p>", "<p>3Ω<\/p>", "<p>4Ω<\/p>", "<p>5Ω<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/DF63xZyXJUpDvUNrIF5FB0SIdqTZDoDM76KmAi6k.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7765", "t": 1, "q": "戴维南等效电路中电阻等于原有源二端网络除源后的输入电阻，电压源等于原有源二端网络的（     ）电压。", "a": ["<p>电压源<\/p>", "<p>开路<\/p>", "<p>短路<\/p>", "<p>任意<\/p>", "", ""], "r": "B", "e": "【定位】第2章，2.4节，知识点2；戴维宁定理和诺顿定理；\n【解析】戴维南等效电路中，电阻等效为有源二端口除源后输入电阻，电压源等效为网口开路电压。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7766", "t": 1, "q": "有源二端网络的短路电流为16A，等效内阻为8Ω，则开路电压为（     ）V。", "a": ["<p>2<\/p>", "<p>8<\/p>", "<p>16<\/p>", "<p>128<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/pL4WjmBL3tQeJt3NUltvrrohFwfdSRcV1wVglpQH.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7767", "t": 1, "q": "有源二端网络的短路电流为6A，端口等效电阻为4Ω，则此端口开路电压为（     ）V。", "a": ["<p>6<\/p>", "<p>8<\/p>", "<p>18<\/p>", "<p>24<\/p>", "", ""], "r": "D", "e": "【定位】第2章，2.4节，知识点2；戴维宁定理和诺顿定理；\n【解析】有源二端网络的开路电压值为短路电流值乘以等效内阻，故开路电压等于6x4=24V。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7768", "t": 1, "q": "戴维南定理指出：一个含独立电源、线性电阻和受控源的一端口，对外电路来说可以用（     ）的串联组合等效置换。", "a": ["<p>电容、电阻<\/p>", "<p>电感、电阻<\/p>", "<p>电压源、电阻<\/p>", "<p>电流源、电阻<\/p>", "", ""], "r": "C", "e": "【定位】第2章，2.4节，知识点2；戴维宁定理和诺顿定理；\n【解析】戴维南定律指出，一个含独立电源，线性电阻和受控源的一端口，对外电路来说，可以用一个电压源和电阻的串联组合来等效置换。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7769", "t": 1, "q": "戴维南定理适用于有源二端（     ）网络。", "a": ["<p>线性<\/p>", "<p>非线性<\/p>", "<p>线性和非线性<\/p>", "<p>交流<\/p>", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点2；戴维宁定理和诺顿定理；\n【解析】含独立源的线性电阻单口网路N，就端口特征而言，可以等效为电压源与电阻串联的单口网路，这就是戴维南定理，故其适用线性网络。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7770", "t": 1, "q": "实验测得某有源二端线性网络的开路电压为15V，短路电流为10A。当外接电阻为6Ω时，该电阻的端电压为（     ）。", "a": ["<p>6V<\/p>", "<p>10V<\/p>", "<p>12V<\/p>", "<p>15V<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/pSBzs9TPiEfv7HAWBX4vF3oWM6V6yFQAWrqKwE2P.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7771", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Lpe7NA25OwIc6POiMyu54I5wEFAMSsviO1oehY3F.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/zXA5O0bsDZaqoKLxc7Ga4JKsdgc2Q83Ua8Qhpbiz.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/o6H9sMkHBDO6EdMMec5NHKELHuzH5OaXrZ7GnPT6.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2ya3BowB3k908DWHakW50TdSgDjrxziKYfF9OAsp.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/LaFV64udz9FqVX5KALHtLwewJZDbunag0Ac3uUTM.png\"><\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/SoD8TKJwk3MAu8eWnZigO6oMT1TgFnJ52rWW5pZr.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7772", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/iJgNS3cAMB1wVjrDLQyZjPZgBm31LoIZaGLMrfZn.png\"><\/p>", "a": ["<p>图（a）和图（b）中的电压u相等<\/p>", "<p>图（a）和图（b）中的电流i相等<\/p>", "<p>图（a）和图（b）在端口1-1’处有相同的电压电流约束关系u=f(i)<\/p>", "<p>图（a）和图（b）为等效电路，故求电阻R1上的电流i1时，既可用图（a）求得，也可用图（b）求得<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/3hgsd3JncMIs1FjSszVLDEq31OTRHnY61DpWbSvX.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7773", "t": 2, "q": "一个输出电压几乎不变的设备有载运行，当负载增大时，是指（     ）。", "a": ["<p>等效电阻增大<\/p>", "<p>功率减小<\/p>", "<p>电源输出的电流增大<\/p>", "<p>功率增加<\/p>", "", ""], "r": "CD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260902/nS5I1cMSpba7ORLHgV5cSpwKctcOAW5tkWqJLxt5.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7774", "t": 2, "q": "关于n个电阻并联的特征描述，错误的是（     ）。", "a": ["<p>并联电阻越多，等效电导越小<\/p>", "<p>电导值越小，所分得的电流越大<\/p>", "<p>在理想电流源供电时，n个并联电阻中有一个电阻为0，电流源两端电压为0<\/p>", "<p>在理想电压源供电时，并联阻值越小，所吸收功率越小<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/tN2nPBOE1RXzbeabfRDyN0J8KDoPxuTxj8fQTvEX.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7775", "t": 2, "q": "关于n个并联电阻的特征描述，下列叙述错误的是（     ）。", "a": ["<p>等效电导的数值要小于所并联的任一电导值<\/p>", "<p>并联端口总电流的数值要小于所并联任一电导上的电流值<\/p>", "<p>各电导上所消耗的功率与各自的电导值成反比<\/p>", "<p>各电导中的电流大小与各自的电导值成正比<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/zPm2l5VlyLvODgjcorQapyVz5fzyp3bzcpLvB8ir.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7776", "t": 2, "q": "n个串联电阻的特征描述，下列正确的是（     ）。", "a": ["<p>各电阻上消耗的功率与各自的电阻值成反比<\/p>", "<p>等效电阻的数值要大于所串联电阻的任何一个电阻<\/p>", "<p>各电阻上的电压大小与各自的电阻值成正比<\/p>", "<p>串联电路端口总电压的数值大于所串联任一电阻上的电压<\/p>", "", ""], "r": "BCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/QqjAEo4cTe7SChK1RNQ22cRSlGbgLE8IusfiJNTb.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7777", "t": 2, "q": "关于电阻的Y-△连接等效变换，下列说法正确的是（     ）。", "a": ["<p>电阻Y形连接和△连接等效变换时，流过对应电阻上的电流保持不变<\/p>", "<p>电阻Y形连接和△连接等效变换时，流入对应三个端子上电流保持不变<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/zMo7X1CrNp9PAUBUnS5gpulmYnobOr0DgUBzvE0B.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/6ntUesXibjCGTiTL1PaWsanY9C46xx23cZ0Dnl4P.png\"><\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/61dLivX9YyvqxTtvFdfSbTcz4T2iO3RkPObC0Cpl.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7778", "t": 2, "q": "下列叙述正确的是（     ）。", "a": ["<p>任意两个理想电压源都可以并联<\/p>", "<p>任意两个实际电压源都可以并联<\/p>", "<p>只有端电压相等的理想电压源才可以同极性并联<\/p>", "<p>只有端电压相等的实际电压源才可以并联<\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/sJJKJMZTO3j8mYZAB17uwQAlcpgaO9eQu02K2Jmo.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7779", "t": 2, "q": "关于电源等效变换的关系，下列叙述哪个是正确的（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/547AIheNvIxxnVeLljDeYOjueFnZDeNZ9BPoWeKh.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/bPTlwG8wLaYQCCv2tspzbLhxUlbOk1Bfbg40999T.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/YvmmIYnTlljZEs1grKIzPOsPeoRIcpxJrVMu4Az3.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/DRH45V5lE2t228rU20xV0ILUiHxkl405ubN2RYQW.png\"><\/p>", "", ""], "r": "ACD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/KfA2qyYsVTmVaEAzpKCstpJjwiccdisCrS4IvjVH.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7780", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20261015/gaebFyPDhehFfynWf5QC4z6Yao8zq0gv1o4619qY.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/P7BC2u4E2gvsPMLCeriMQlbA0iTJx0TKzmSCtuuF.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/J0gjwEDGi1U1J8a5TjFgcwVfQhkMATOuVv3UfHfr.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/dAQUqcrMrouzOlz3WbZ21f24ohqnLtfg7HNvx2we.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/W7oRxjlq2BVOBNgYFlgPY5MiiyOa4jI3bVr9kGvU.png\"><\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/C0diQFsiPfHF5ZZHnsFcYecVwSHVGlJ48i8FD2Hr.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7781", "t": 2, "q": "有源二端网络等效为实际电压源，正确的说法是（     ）。", "a": ["<p>等效电阻等于有源网络的端口开路电压/端口短路电流<\/p>", "<p>等效电阻等于有源网络除源后的无源网络的输入电阻<\/p>", "<p>实际电压源的电压等于有源网络的端口开路电压<\/p>", "<p>实际电压源的电压等于有源网络的端口短路电流与等效电阻的乘积<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/WfBoKsHktMRBEkCr11UVxt8wKsUjJul54B86dBIS.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7782", "t": 2, "q": "在电路等效变换过程中，受控源的处理正确的是（     ）。", "a": ["<p>受控电压源的控制量为零时，相当于短路<\/p>", "<p>受控电压源的控制量为零时，相当于开路<\/p>", "<p>受控电流源的控制量为零时，相当于开路<\/p>", "<p>受控电流源的控制量为零时，相当于短路<\/p>", "", ""], "r": "AC", "e": "【定位】第2章，2.1节，知识点4：含电源支路的等效变换\n【解析】受控源的性质\n1.受控电压源和电阻的串联与受控电流源和电阻的并联组合，也可以仿照上述方法进行等效变换。\n2.变换方法：受控电压源当作理想电压源，受控电流源当作理想电流源，则变换规则与实际电源的等效变换相同。 \n受控电压源的控制量为零时，相当于电压为0，即短路。受控电流源的控制量为零时，相当于电流为0，即开路", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7783", "t": 2, "q": "对于含有受控源的无源一端口，其输入电阻可能为（     ）。", "a": ["<p>正值<\/p>", "<p>负值<\/p>", "<p>0<\/p>", "<p>以上都不对<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/yLw3615hREsmxfjhZRTZCBD6T3l5PTe1ol1hdoet.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7784", "t": 2, "q": "求有源二端网络的输入电阻时，需要将（     ）。", "a": ["<p>电压源短路<\/p>", "<p>电流源开路<\/p>", "<p>电压源开路<\/p>", "<p>电流源短路<\/p>", "", ""], "r": "AB", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Os4Bi3AQgidEUrr5ZZk2OBTdelJxVMJzMP85aEUa.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7785", "t": 2, "q": "下列关于受控源说法正确的是（     ）。", "a": ["<p>含受控源的网络除源后可以求输入电阻<\/p>", "<p>含受控源的网络是有源网络<\/p>", "<p>含受控源的网络输入电阻为负值<\/p>", "<p>含受控源的网络输入电阻可为负值<\/p>", "", ""], "r": "AD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/0rZHN6d1gVcYcApLagddcZJK22GDNAEfjXYaWimF.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7786", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Az52FocxCCUlI4l0odiiQCUOtoEgfCZUFtdsRRpp.png\"><\/p>", "a": ["<p>5Ω<\/p>", "<p>10Ω<\/p>", "<p>15Ω<\/p>", "<p>20Ω<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/wbsawY6cecVreL0YDPnMvEw4D8Y2iyLZH9ijuBJ8.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7787", "t": 2, "q": "关于结点电压法中的电压源，下列说法正确的是（     ）。", "a": ["<p>有伴电压源转换为有伴电流源<\/p>", "<p>应尽量选择无伴电压源的一端为电路参考结点，可少写一个结点电压方程<\/p>", "<p>可以设无伴电压源的电流为零<\/p>", "<p>可以添加无伴电压源电流为未知量，并补充一个方程<\/p>", "", ""], "r": "ABD", "e": "【定位】第2章，2.2节，知识点3：应用结点电压法时对两种特殊情况的处理\n【解析】无伴电压源的处理是结点电压法的难点。我们可以添加无伴电压源所在支路的电流为未知量，并补充两结点的电位差方程。处理方法是：\n含无伴电压源支路时：有两种处理方法：①将无伴电压源的一端设为参考结点，则其另一结点电压已知，不再列写该独立结点的结点电压方程；②设流过无伴电压源的电流为变量，计入相关结点的结点电压方程，再补充该无伴电压源电压与相关结点电压的关系方程。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7788", "t": 2, "q": "回路电流法求解的步骤（     ）。", "a": ["<p>选取独立回路，在回路中标出回路电流的参考方向，并将这一参考方向作为绕行方向<\/p>", "<p>建立回路KVL方程，注意自阻总是正的，互阻由相关回路电流方向决定<\/p>", "<p>求解方程，得出假设的回路电流<\/p>", "<p>按回路中回路电流与支路电流的关系求出支路电流<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/iOgjQwGiMYovDYFIl0zeL8oJ9bFRpra1295pxTGj.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7789", "t": 2, "q": "下列叙述错误的是（     ）。", "a": ["<p>当复杂支路数较多、回路数较少时，应用结点电压法可以适当减少方程式数目<\/p>", "<p>回路电流法以假想的回路电流为未知量<\/p>", "<p>回路电流只适用于平面电路<\/p>", "<p>回路电流法是应用KCL定律求解电路的方法<\/p>", "", ""], "r": "ACD", "e": "【定位】第2章，2.3节，知识点2：回路电流法方程的列写\n【解析】\n回路电流法的定义：在独立回路中循环流动的假想电流，称为回路电流。支路电流可以通过求解回路电流获得。\n以回路电流为未知变量，依据KVL列方程组求解的方法称为回路电流法。一般需要列写b-（n-1）个独立方程。网孔电流法是回路电流法的特例。\n本题中，A选项当复杂支路数较多、结点数较少时，应用回路电流法可以适当减少方程式数目。C选项，回路电流法同样适用于立体电路，只要能够构成回路即可列写回路电流方程。D选项，回路电流法是应用KVL定律求解电路的方法。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7790", "t": 2, "q": "关于网孔电流法，下列叙述正确的是（     ）。", "a": ["<p>网孔电流法中自电阻恒取正值<\/p>", "<p>与电压源串联的电阻为多余元件，需要开路处理<\/p>", "<p>网孔电流适用于立体电路<\/p>", "<p>网孔电流之间自动满足KCL<\/p>", "", ""], "r": "AD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/zOt8CrVaFdTEddjKFVjMsRSVUhYpuRSHk0aFfXB9.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7791", "t": 2, "q": "下列方法中方程数不为b-n+1的是（     ）。", "a": ["<p>结点电压法<\/p>", "<p>支路电流法<\/p>", "<p>支路电压法<\/p>", "<p>网孔电流法<\/p>", "", ""], "r": "ABC", "e": "【定位】第2章，2.3节，知识点5：网孔电流法\n【解析】\n网孔电流是假想的在网孔中循环流动的电流，支路电流可以通过求解网孔电流获得。\n以网孔电流为未知变量，依据KVL列方程组求解的方法称为网孔电流法。一般需要列写b-（n-1）个独立KVL方程。仅适用于平面电路。 \n结点电压法是n-1个方程，而支路电流法、支路电压法都b个方程。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7792", "t": 2, "q": "关于叠加原理，下列说法中正确的是（     ）。", "a": ["<p>在线性电路中，元件的功率可以用叠加原理计算<\/p>", "<p>受控源在叠加原理时，不能单独作用，也不能消去，其大小和方向都随控制量变化<\/p>", "<p>在应用叠加原理分析时，各独立源单独作用时，将其他电压源短路<\/p>", "<p>在应用叠加原理分析时，各独立源单独作用时，将其他电流源短路<\/p>", "", ""], "r": "BC", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】叠加原理的性质\n（1）叠加原理适用于线性电路中电流、电压的求解。\n（2）叠加时，电路的连接以及电路中所有电阻和受控源都不要变动。所谓独立电源不作用，是指将独立电压源用短路替代，独立电流源用开路替代。\n（3）叠加时，要注意电流、电压的参考方向，与原电路参考方向一致的分量叠加时取正，反之取负。\n（4）功率不是电流或电压的一次函数，故不能用叠加原理计算功率。\n本题选项A中，元件的功率不能用叠加定理计算；D选项在应用叠加定理分析时，各独立源单独作用时，将其他电流源开路。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7793", "t": 2, "q": "叠加原理给出了把电路激励“分而治之”的方法，它是反映线性电路性质的重要定理，是线性方程的（     ）和（     ）在电路中的体现。", "a": ["<p>齐次性<\/p>", "<p>可加性<\/p>", "<p>非齐次性<\/p>", "<p>替代性<\/p>", "", ""], "r": "AB", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】定理内容：\n在线性电路中，由n个独立电源共同作用产生的各支路电流或支路电压，等于各个独立电源分别单独作用时在相应支路中产生的电流或电压的叠加。\n作为线性系统，包含线性电路，最基本的性质--线性性质，它包含可加性和齐次性两方面。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7794", "t": 2, "q": "关于叠加原理的应用，下列叙述中正确的是（     ）。", "a": ["<p>不作用的独立电流源用短路代替<\/p>", "<p>不作用的独立电压源用开路代替<\/p>", "<p>不作用的独立电流源用开路代替<\/p>", "<p>不作用的独立电压源用短路代替<\/p>", "", ""], "r": "CD", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】所谓独立电源不作用，是指将独立电压源用短路替代，独立电流源用开路替代。因此，不作用的独立电流源用开路代替，不作用的独立电压源用短路代替。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7795", "t": 2, "q": "关于戴维南定和诺顿定理，下列叙述中正确的是（     ）。", "a": ["<p>不仅可以应用在线性电路，还可以应用在非线性电路<\/p>", "<p>戴维南等效电路和诺顿等效电路不一定存在相互等效变换关系<\/p>", "<p>戴维南等效电路和诺顿等效电路的等效电阻相同<\/p>", "<p>戴维南定和诺顿定理最适合用于求解电路中某一条支路上的电压或电流<\/p>", "", ""], "r": "ABCD", "e": "【定位】第2章，2.4节知识点2：戴维宁定理和诺顿定理\n【解析】戴维宁定理和诺顿定理，也称为等效电源定理，或等效发电机定理。\nA是容易出错的地方，等效电源定理做等效的部分必须是线性电路，外电路可以是线性也可以是非线性。\nB若某线性有源一端口等效电阻为无穷大，则其戴维南等效电路不存在，同样若某线性有源一端口等效电导为0，则其诺顿等效电路不存在。\nC戴维宁等效电路为电压源与等效电阻的串联模型，而诺顿等效电路为电流源与等效电阻的并联模型，他们的等效电阻均为从端口看入的等效电阻。\nD戴维南定和诺顿定理的本质是将除负载电阻以外的有源二端网络等效为实际电源，其最适合用于求解电路中某一条支路上的电压或电流，特别是该支路的负载可变的情况。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7796", "t": 2, "q": "关于最大功率传输定理的应用，下列叙述中错误的是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/sOyf2R5h08J4s8rzsElZEZuRFWTHflczpnVXudYV.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/a45IvSuJsomvg8yuknefIRXHmKUWX3mM9QL4NaL5.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/YTv9A9l4mEUjUkO14uNRU8kHw1Y9Uuq1FjM3yfT0.png\"><\/p>", "<p>当激励源内阻抗和负载阻抗含有电抗成份时，为使负载得到最大功率，负载阻抗与内阻必须满足共轭关系，即电阻相等，电抗绝对值相等而符号相反<\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/osCD983wNKbMwHOrfMBKFuy2zzCJxxMGOOehQkrF.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7797", "t": 2, "q": "工作在最大功率匹配状态的电路有（     ）。", "a": ["<p>电力系统<\/p>", "<p>强电电路<\/p>", "<p>电子电路<\/p>", "<p>通信电路<\/p>", "", ""], "r": "CD", "e": "【定位】第2章，2.4节，知识点3；最大功率传输定理；\n【解析】电子电路、通信电路为工作在最大功率匹配状态的电路，以期获得最大的功率传输，而电力系统等强电电路，不主张最大功率传输，主要原因是此时效率太低，且在正弦稳态中易出现谐振而发生过压或过流现象", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7798", "t": 2, "q": "关于最大功率传输定理的应用，下列叙述正确的是（     ）。", "a": ["<p>负载获得最大功率时，电源的传输效率不一定为50%<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2rSpFNV6hlitpxIVHeOUEs4z7Q7VA3LmefmZ7eas.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/0BQ4fxMVRbHnOcFmCe3qikZ7dtoVJJ6OCnasEqZS.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/8kxEi9aphd7ovvRMMwX2otgKFZHXmr3Xg4pfjFgJ.png\"><\/p>", "", ""], "r": "ACD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/aL2Y2LYT60exe982Av08gXQxjRsHAWaQlXcsX894.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7799", "t": 3, "q": "两个电源或者两个电路在端口处具有相同的伏安关系，则可称它们是等效的。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.1节，知识点1：等效变换的概念\n【解析】等效与等效变换：\n若两个二端网络端口的伏安特性完全相同，则称它们对外相互等效。在等效的前提下，将一个复杂的二端网络用一个简单的二端网络替代，称为等效变换。\n本题是对等效的定义的考核，学生抓住“端口的伏安特性完全相同”这一关键点，便能判断本题题干表述正确，选A。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7800", "t": 3, "q": "无源二端网络可以对外电路等效为一个电阻，并且当无源二端网络中含有受控源时，其等效电阻有可能为负或为零。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/l6Wry2QB9qgTu1ujlXmoDAOT1Teb6PFCiyt3l93r.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7801", "t": 3, "q": "因为两个等效电路的端口电压和端口电流的伏安关系相等，因此可以通过计算两个电路的端口电压值和端口电流值是否相等来判断两个电路是否为等效电路。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/VgtHi4fGUSQjv4ricVtvctFZDtkX0OI9YlNuUVzX.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7802", "t": 3, "q": "一个含独立源的电阻线性二端网络总可以等效为一个电压源和一个电阻串联或者一个电流源和一个电阻并联。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/INBnfII6vwPhZrA8WrT77QxsMv17rnOPimrGTTFL.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7803", "t": 3, "q": "两个电路等效，即他们无论内部还是外部都相同。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第2章，2.1节，知识点1：等效变换的概念\n【解析】\n1.等效与等效变换：若两个二端网络端口的伏安特性完全相同，则称它们对外相互等效。在等效的前提下，将一个复杂的二端网络用一个简单的二端网络替代，称为等效变换。\n2.等效的特点：对外电路等效，替代后，对外电路不会有任何影响。\n所以，所谓等效是指对外等效。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7804", "t": 3, "q": "串联电路中各个电阻上的电压与电阻成正比。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/DR4LUM3GySKvfMIxO0xuLpcjStSTi6V86dbqM5Wr.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7805", "t": 3, "q": "串联电阻的功率与电导值成正比，与电阻值成反比。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/CF5m6tEP7RCqNJENu785Ejus6PsvVrNLzk8ZjbSZ.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7806", "t": 3, "q": "阻值不同的几个电阻相串联，阻值大的电阻消耗的功率小。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/GuZUPBUVeT4jd6Pib1R9tWIFOCF6ra1UAjoKZHqy.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7807", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/mapwf4qltS9xhDuwgYYknnWG2BT7Hsf0uYVMgzsy.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/poO6TBWPGVDsf9hJ51oTQWVdR0CW3T5mxbhGgoH8.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7808", "t": 3, "q": "阻值不同的几个电阻相并联，阻值小的电阻消耗的功率大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Vv5gl874f0XZqWaJyksqAiZArBEpakzRQpcdknCt.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7809", "t": 3, "q": "电压相等的两个元件必定并联（     ）。", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2Ar8fgewEmSFVDc7BHQwYrUlzpkqbab4GmJlXDTS.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7810", "t": 3, "q": "并联电路中，各个电阻的电流与电导成正比。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/LclMszxfvQWaJAp43yq91Buahe9fxLRbFMUfR2MC.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7811", "t": 3, "q": "与理想电压源并联的其它元件称为多余元件，电路分析是应短路处理（     ）。", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ULFymCfh200WeXwitKLWbvvqs8KqmTUT6RH00DwM.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7812", "t": 3, "q": "只有电流相等方向一致的电流源才允许串联，否则违背KCL定律。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/TdBlTiuQU6LAAJQFtOVIsmAFsZ7dDNoydck65s1Q.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7813", "t": 3, "q": "多个电流源并联时可用一个电流源来等效代替。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/yhjYY6RqhBTa9ATSVdYv6Qn9Abh42SxsZa6f2TPb.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7814", "t": 3, "q": "在电路等效的过程中，与理想电流源串联的电压源对外电路不起作用。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/LQu2aiglGCpoFXeKAHGJpSruCDz1jjGKuXZYpWAe.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7815", "t": 3, "q": "一个不含有独立源的电阻线性二端网络总可以等效为一个线性电阻（     ）。", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/gNmFFx1am8M7BZVbDvDhgys0X6h3UGQSk6OAdyKw.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7816", "t": 3, "q": "输入电阻是一种电阻元件（     ）。", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/H5FOBMLHEjTsFYhEN1Nmanj2voTGj42aw0TZCcs5.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7817", "t": 3, "q": "不含受控源的无源一端口，其等效电阻为正值。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/y8to3hjvL4O9wMvPpWtmdwe4bSsLbJ694TQaOyUf.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7818", "t": 3, "q": "如果受控源所在电路没有独立源存在，其所在二端电路相当于一个输入电阻。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Uf2Vi5ofY2Vs42Uf6psN5t4X1oYJZEwZpBMnF6ax.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7819", "t": 3, "q": "电压和电流的参考方向可以任意指定，结点电压的参考方向可以根据需要随时改变。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第2章，2.2节，知识点1：结点电压法方程的列写方法\n【解析】\n结点电压分的定义：有n个结点，b条支路的电路，任意选择一个结点为参考结点，设其电位为0，其余n-1个结点称为独立结点。独立结点与参考结点间的电压称为独立结点的结点电压。以结点电压为未知变量，依KCL列方程组求解的方法称为结点电压法。一般需要列写n-1个独立方程。\n电压和电流的参考方向可以任意指定，但是参考方向不可以根据需要随时改变。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7820", "t": 3, "q": "含n个结点的电路，其结点电压方程数为n-1。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.2节，知识点1：结点电压法方程的列写方法\n【解析】\n结点电压法的定义：有n个结点，b条支路的电路，任意选择一个结点为参考结点，设其电位为0，其余n-1个结点称为独立结点。独立结点与参考结点间的电压称为独立结点的结点电压。\n以结点电压为未知变量，依KCL列方程组求解的方法称为结点电压法。一般需要列写n-1个独立方程。\n电路中有n个结点，则选取一个结点为参考结点，则剩下的n-1个结点都需要列写结点方程。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7821", "t": 3, "q": "当复杂电路的支路数较多、回路数较少时，应用回路电流法可以适当减少方程式数目。这种解题方法中，是以假想的回路电流为未知量，直接应用KVL定律求解电路的方法。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.3节，知识点1：回路电流法\n【解析】\n回路电流法的定义：在独立回路中循环流动的假想电流，称为回路电流。支路电流可以通过求解回路电流获得。回路电流为未知变量，依据KVL列方程组求解的方法称为回路电流法。一般需要列写b-（n-1）个独立方程。网孔电流法是回路电流法的特例。  \n回路电流法以假想回路电流为未知量直接由KVL求解电路的方法，其好处就是可以减少方程数目。支路数较多、回路数较少时，列的方程少求解方便。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7822", "t": 3, "q": "回路电流法中处理两个回路共有的无伴电流源，可增加其端电压为未知量，并补充一个电流源电流与回路电流之间的约束方程。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.3节，知识点3：采用回路电流法时对两种特殊情况的处理\n【解析】\n回路电流法中含无伴电流源支路时，和网孔电流法一样，有两种处理方法：①选取只让一个回路电流流过该无伴电流源支路，则该回路电流已知，不再列写该回路的回路电流方程；②设无伴电流源的端电压为变量，计入相关回路方程，再补充该无伴电流源电流与相关回路电流的关系方程。\n因此，回路电流法和网孔电流法，方程中电压源电压是直接写入的，电压源不需要特殊处理，需要特殊处理的是电流源。用回路电流法处理两个回路共有的无伴电流源时，可增加电压为未知量，并补充一个电流源电流与回路电流之间的约束方程。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7823", "t": 3, "q": "叠加原理只适用于直流电路。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】叠加定理的性质：\n（1）叠加原理适用于线性电路中电流、电压的求解。\n（2）叠加时，电路的连接以及电路中所有电阻和受控源都不要变动。所谓独立电源不作用，是指将独立电压源用短路替代，独立电流源用开路替代。\n（3）叠加时，要注意电流、电压的参考方向，与原电路参考方向一致的分量叠加时取正，反之取负。\n（4）功率不是电流或电压的一次函数，故不能用叠加原理计算功率。\n因此，叠加定理适应于线性电路，包括直流电路和交流电路", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7824", "t": 3, "q": "叠加原理仅适用于线性电路，并能利用其计算各分电路的功率进行叠加得到原电路的功率。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】叠加定理适应于线性电路，但是叠加求得的只有电压和电流，由于功率不是电流或电压的一次函数，故不能用叠加原理计算功率。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7825", "t": 3, "q": "在使用叠加原理时受控源不能单独作为一个电源，也不能消除，其大小和方向受端口电压控制。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】叠加定理叠加的是独立源在电路中作用的结果，受控源不是独立源。但是受控源的大小和方向是受到控制变量控制的，控制变量可能是某支路的电压，也可能是某支路的电流。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7826", "t": 3, "q": "叠加原理适用于线性电路的功率计算。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】叠加定理只能用于计算线性电路的支路电流或电压，不能直接进行功率的叠加计算，因为功率与电压或电流是平方关系，不是电流或电压的一次函数，而不是线性关系，因此功率故不能用叠加原理计算功率。故正确答案选B。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7827", "t": 3, "q": "叠加原理不仅适用于计算线性电路中的电流和电压，也适用于计算非线性电路中的电压和电流。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】根据定义可知，叠加定理适用于两个或两个以上独立电源作用的线性电路，不适用于非线性电路，故正确答案选B。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7828", "t": 3, "q": "使用叠加原理时，可以将电路中不作用的电压源看作短路，电流源看作开路。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】此题考查独立源置零的方法。叠加时，电路的连接以及电路中所有电阻和受控源都不要变动。所谓独立电源不作用，是指将独立电压源用短路替代，独立电流源用开路替代。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7829", "t": 3, "q": "应用叠加原理解题，叠加的方式是任意的，一次可以一个或者几个独立源单独作用。（     ）。", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】叠加定理求解步骤：\n（1）做每个独立源单独作用的分电路图，独立电源的处理方法为置零，受控源和电阻保留。\n（2）求各分电路图中的电压和电流分量。\n（3）将同一变量的各分量取代数和叠加。\n应用叠加定理时，可以做每个独立源单独作用的分电路图，也可以将电源分组，一次几个独立源共同作用。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7830", "t": 3, "q": "用叠加原理求解时，不需要将受控单独作用，因为受控源不是激励，单独作用时电路中没有电流和电压。（     ）。", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点1；叠加定理\n【解析】叠加定理求解步骤：\n（1）做每个独立源单独作用的分电路图，独立电源的处理方法为置零，受控源和电阻保留。\n（2）求各分电路图中的电压和电流分量。\n（3）将同一变量的各分量取代数和叠加。\n叠加定理是指独立源单独作用的的影响进行叠加，受控源单独作用，没有独立源 ，电路响应是0", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7831", "t": 3, "q": "外加电源法求戴维宁等效电阻时，需将端口内的独立源和受控源置零。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/50PDC9Gj0d3aOpP0EzNJ5HEsQPavG3FDbL5Y8o2D.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7832", "t": 3, "q": "戴维南定理说明一个线性有源二端网络N，可以用一个等效电压源和等效电阻的串联来替代。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点2；戴维宁定理和诺顿定理；\n【解析】此题考察的是戴维南定理的定义。\n对于含独立源，线性电阻和线性受控源的单口网络（二端网络），都可以用一个电压源与电阻相串联的单口网络（二端网络）来等效，这个电压源的电压，就是此单口网络（二端网络）的开路电压，这个串联电阻就是从此单口网络（二端网络）两端看进去，当网络内部所有独立源均置零以后的等效电阻。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7833", "t": 3, "q": "当一个线性含源二端网络，若网络中的电源置零后等效电阻为零，则可以将这个二端网络等效为一个理想电压源。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点2；戴维宁定理和诺顿定理；\n【解析】理想电压源置零后可当作是短路，即电阻为零。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7834", "t": 3, "q": "戴维南等效电阻是有源线性二端网络中独立源置零后，从端口看进去的输入电阻。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点2；戴维宁定理和诺顿定理；\n【解析】戴维南等效电阻等于一端口的全部独立电源置零后的输入电阻。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7835", "t": 3, "q": "含源线性一端口网络，通过戴维宁定理或者诺顿定理等效成简化电路，简化电路与原来的电路必须具有相同的端口外特性。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点2；戴维宁定理和诺顿定理；\n【解析】等效替换的原则是具有相同的端口外特性，即端口电压电流的关系是相同的。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7836", "t": 3, "q": "诺顿定理说明一个线性有源二端网络N，可以用一个等效电流源和等效电阻并联来替代。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点2；戴维宁定理和诺顿定理；\n【解析】此题考察的是诺顿定理的定义。\n含独立源的线性电阻单口网络N，就端口特性而言，可以等效为一个电流源和电阻的并联。电流源的电流等于单口网络从外部短路时的端口电流Isc;电阻R0是单口网络内全部独立源为零值时所得网络N0的等效电阻。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7837", "t": 3, "q": "当一个线性含源二端网络，若网络中的电源置零后等效电阻无穷大，则可以将这个二端网络等效为一个理想电流源。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，2.4节，知识点2；戴维宁定理和诺顿定理；\n【解析】理想电流源置零即可当作是开路，开路视为电阻无限大。", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7838", "t": 3, "q": "直流 DUllJE5m6R0Oqa7spgTJbmu2JTn.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/rQSxO37H6cchR2lYw4qsgujpA9A2IrHh9IlLHJNJ.png\"><\/p>", "", ""], "r": "A", "e": "<p>【定位】第3章，3.6节，知识点2：RLC并联电路分析 【解析】根据知识点回顾，两个阻抗并联，电流的瞬时值表达式就是正弦波，根据KCL总的电流波形等于两个电流波形的叠加，所以总电流的瞬时值=每个阻抗电流瞬时值之和，由于相量是瞬时值表达式的对应形式，所以总电流相量=每个阻抗电流相量之和，而有效值里面不包含角度，相加的值不满足平行四边形法则，所以是错误的，因此答案选A。<\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7974", "t": 1, "q": "能量转换过程中不可逆的功率为（     ），可逆的功率为（     ）。", "a": ["<p>无功功率，有功功率<\/p>", "<p>有功功率，无功功率<\/p>", "<p>无功功率，视在功率<\/p>", "<p>视在功率，瞬时功率<\/p>", "", ""], "r": "B", "e": "【定位】第3章，3.5节，知识点2：有功功率\n【解析】正弦稳态电路中，能量转换过程中不可逆的功率称为有功功率，可逆的功率称为无功功率。在电路中，有功功率代表能量实际转换为有用功的部分，而无功功率则代表能量转换过程中可以返回并再次使用的部分。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7975", "t": 1, "q": "一个电热器，接在10V的直流电源上，产生的功率P。把它改接在某正弦交流电源上时其产生的功率也为P，则正弦交流电源电压的最大值为（     ）。", "a": ["<p>5V<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/sICRpE4sKmfgVpOs1prln6jAMMyZNBIuiKlFQKGd.png\"><\/p>", "<p>10V<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/KLSwkOU2F9W76omYIv4kMBsfM09oSatEiQJmrVTO.png\"><\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/NFXnJJszYuQpAChE4HtCu4REIa9u0fRQeomWPFTS.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7976", "t": 1, "q": "每只日光灯的功率因数为0.5，当N只日光灯相并联时，总的功率因数（     ）。", "a": ["<p>大于0.5<\/p>", "<p>小于0.5<\/p>", "<p>等于0.5<\/p>", "<p>无法确定<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/qCADxymzNwRyXyF59aROeXML6yl9cYwGIxznR4Bp.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7977", "t": 1, "q": "若通过并联电容的方式对RL电路进行功率因数提高（保证输入电压幅值不变，只考虑欠补偿情况），则下列说法中错误的是（     ）。", "a": ["<p>并联电容的大小不会影响RL支路的工作状态<\/p>", "<p>并联电容前后电源输出的有功功率不变，输出的无功功率减少了<\/p>", "<p>并联电容后总电流的有效值变了<\/p>", "<p>并联电容后RL支路的功率因数变大了<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260902/e6rzDuIJAv2HGjrbJ033ONZ5vj1H8rw0QHDLSZuM.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7978", "t": 1, "q": "“正弦稳态电路的最大功率传输定理”中的“功率”指的是（     ）。", "a": ["<p>平均功率<\/p>", "<p>无功功率<\/p>", "<p>视在功率<\/p>", "<p>复功率<\/p>", "", ""], "r": "A", "e": "【定位】第3章，3.5节，知识点8：最大功率传输定理\n【解析】许多实际电路的作用是为负载提供功率。在通信等应用中，希望传递给负载的功率最大，这里指的最大功率是指最大平均功率，单位为瓦特（W），故本题所说的“最大功率传输定理”中的“功率”指的是平均功率，选A。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7979", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/m8FNCdk5g1KxiJhtZzrGC20nS1fMQfMnDO01bBU0.png\"><\/p>", "a": ["<p>0.5W<\/p>", "<p>1W<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/GwjHQSBDkQIteRELsz0AuugX8e1XmTrd3wpaMxMW.png\"><\/p>", "<p>4W<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Q62JW5AlVz7suwUTISBmDvl2upCoNEZiKcE9P0kV.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7980", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/x9CuhKXLjhUaCyjn7wuB6tIr5tqJ0T77flFp9M2t.png\"><\/p>", "a": ["<p>8Ω<\/p>", "<p>6Ω<\/p>", "<p>-8Ω<\/p>", "<p>0Ω<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/7631cTdJ3kSig7K8dkXeEboKZ1DrwEF1TZferzmg.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7981", "t": 1, "q": "一电阻R=200Ω，电感L=0.25mH和可变电容相串联，为了接收到某广播电台560kHz的信号，可变电容C应调至（     ）。", "a": ["<p>153pF<\/p>", "<p>253pF<\/p>", "<p>323pF<\/p>", "<p>353pF<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/51mIMlpqhZGTxkNPPAGRVAfQoMts4I5w76QA4rQ5.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7982", "t": 1, "q": "电阻、电感和电容串联的正弦交流电路，发生谐振的条件是（     ）。", "a": ["<p>感抗大于容抗<\/p>", "<p>阻抗等于零<\/p>", "<p>感抗等于容抗<\/p>", "<p>感抗小于容抗<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/JIwbmpQOcPwnKQQZTgnh3rnh7UzfZjJI9Z8tehRz.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7983", "t": 1, "q": "在RLC串联谐振电路中，R=10Ω，L=20mH，C=200pF，电源电压U=10V，电路的品质因数Q为（     ）。", "a": ["<p>3<\/p>", "<p>10<\/p>", "<p>100<\/p>", "<p>1000<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/CSIIVP5voFpnH36jszCDc2WdjBKMbBagiHfrZvFM.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7984", "t": 1, "q": "RLC串联电路发生串联谐振时，下列说法错误的是（     ）。", "a": ["<p>端电压一定的情况下，电流最大<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/btMvhD4K0HeE88XoL6nrza0iUGrmzLaKUzYkZmFb.png\"><\/p>", "<p>电阻吸收的有功最大<\/p>", "<p>阻抗的模值最大<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/EwpwA3QF23yN5tdV5FzllMC3whNsPQc7GGTN2QJl.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7985", "t": 1, "q": "RLC并联电路中，如果发生谐振则谐振部分电路状态可以当做（     ）。", "a": ["<p>短路<\/p>", "<p>断路<\/p>", "<p>感性<\/p>", "<p>容性<\/p>", "", ""], "r": "B", "e": "【定位】第3章，3.7节，知识点2：并联谐振电路  \n【解析】根据并联谐振电路的特点即电路复导纳虚部为0可知，因此可以将谐振部分电路看作断路，如果是串联谐振，就是复阻抗的虚部为0，相当于短路，而本题是并联谐振，所以选B。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7986", "t": 1, "q": "耦合系数是两个线圈之间磁耦合程度的一种量度。设两个线圈的自感分别为5H和4H，两个线圈间的互感系数为2.5H，则耦合系数为（     ）。", "a": ["<p>2.5<\/p>", "<p>0.28<\/p>", "<p>0.56<\/p>", "<p>0.83<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/HnIJerxaRoFOMqVzgraOmA0ZOwKXN2Nh07wGLFCX.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7987", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Zt9fRxvCrxWEvzfxqV4M8OrMScdri5hwhoGHUQOu.png\"><\/p>", "a": ["<p>27<\/p>", "<p>4.58<\/p>", "<p>7<\/p>", "<p>3<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/h1i6OP2k9QiEzxtn0LZc41JV6xQ083hxUpnorWwi.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7988", "t": 1, "q": "互感线圈的同名端由（     ）决定。", "a": ["<p>实际绕向<\/p>", "<p>相对位置<\/p>", "<p>实际绕向和相对位置<\/p>", "<p>不确定<\/p>", "", ""], "r": "C", "e": "【定位】第3章，3.8节，知识点1：耦合电感的基本概念\n【解析】同名端的性质：\n1.定义：施感电流变化时，在本线圈中产生的自感电压与在相邻线圈中产生的互感电压的实际同极性端称为同名端。\n2.同名端的判定：同向耦合状态下，一对施感电流的流入端（或流出端）定义为耦合线圈的同名端。\n在两个耦合线圈各自的某一端通入电流时，若为同向耦合，则两个线圈电流的流入端（或流出端）定义为同名端。若为反向耦合，称为异名端。\n3.同名端用一对相同的符号“*” ，“·”，“Δ”等表示。\n此题考察的是同名端的定义。线圈的同名端是指两个线圈电流流入的端口使两个线圈上的互感电压相互增强的端口。互感线圈的同名端由实际绕向和相对位置决定。因此选项C正确。对于选项A和B，各自都只是同名端的决定因素之一，不是本题的正确答案。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7989", "t": 1, "q": "两个线圈顺向串联，其等效电感量L=（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/B4wc9wSnK7PClrernkfNUCgkF5l63lqYz0hRoi9e.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/iNDap0yvdMe5euzAoXHQVnAn2q7vbdIXcVg2YfCI.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/96sEQmtqfK67uWMPdpSCpYjvUSlVSjR1DgBKUCrs.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/r4tvUhq0wTeMs3Hz411CgQLRCq5bQSjh6yo923ol.png\"><\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/0rE9aOwxl6CFUNqDnUsze4HVON4dY9Xh6tk5xdoF.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7990", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/E6au4o8hZp6UKa6FWH2Szy34LeLrwZMOzfI2Zma1.png\"><\/p>", "a": ["<p>0.5<\/p>", "<p>1<\/p>", "<p>1.5<\/p>", "<p>2<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/bO8whZVTHL43PsrxJaVbMoQgL2rhnRRAULsVOCeU.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7991", "t": 1, "q": "两互感线圈反接串联时，其等效电感量L=（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/FuN4rTN3jkUkjiKUo5vaAfMrj0p4FdNiNGqFStQb.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/OfVTCk3lO53Edqtm9OPjqHohTbpIwt1GV6x1EJV6.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/UBhnjAAZgVrBDHVcdDu3fPX26O7PU8jt2GqlLdbm.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/pTTQ85LvLD1UWErQ6b5bpsaCCwsC6U76bitmemVC.png\"><\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/QT3uKZg2RIOmH6GQys7ArpoFawKYH5UIEPOXl6aH.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7992", "t": 1, "q": "两个线圈同侧并联时，其等效电感量L=（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Vjoj19X7X9aj9WmRvVBG274XHwVDtLhetk8xn5XF.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Z1xKMmVClXhMYLjrZHkCEyvnU3BDCoCDmmAxTDjE.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/mCaGu2XjzlAOiar7238XTRjRq1Qh79KOkJkJpfQ8.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/yBGysqZ8cabjlol0TPrG63Y5iha0lFyy1je64f0a.png\"><\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/A9imVe2cvfEIMSs3HIrgTR1MJ27jbi0lDCsFl9IV.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7993", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Va1TvjCw0s1Zme4xjshpWtzhI2ih2UPTduKCFgor.png\"><\/p>", "a": ["<p>50mH<\/p>", "<p>75mH<\/p>", "<p>100mH<\/p>", "<p>125mH<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/fRHaK0J6j5XsPqm7wbXQsX2TLXN3u2cus6Atu37R.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7994", "t": 1, "q": "反射阻抗的性质与次级回路总阻抗性质相反的变压器是（     ）。", "a": ["<p>理想变压器<\/p>", "<p>全耦合变压器<\/p>", "<p>空心变压器<\/p>", "<p>半耦合变压器<\/p>", "", ""], "r": "C", "e": "【定位】第3章，3.9节，知识点1：空心变压器  \n【解析】此题考察的是空芯变压器的特性。反射阻抗的性质与次级回路总阻抗性质相同的是全耦合变压器。反射阻抗的性质与次级回路总阻抗性质相反的变压器是空心变压器。理想变压器没有反射阻抗，因此正确答案选C。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7995", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/htIXWbv4yTG58OKetMTHBGzelnzzHEwtA6aZIHt8.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ubtqRHo34mCpCRy7ptP9RgjkKh2rBNTrZmMCM6zz.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/fy40QTjUALcha9jAZxYrqkQXTaZ7QNGkYq52MVXb.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/SY9qpio8QOzXWG6rHBjHy7MDczDa1BYvXCJn3TGr.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/jNnRNgTYsnJckWQ0Tz9IZNGkOZuLSJwRpTcbSfZZ.png\"><\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/k98mVmwEWrsf8TqMOonnhodgl6amyQZv415AcM8N.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7996", "t": 1, "q": "符合全耦合、参数无穷大、无损耗的变压器称为（     ）。", "a": ["<p>空芯变压器<\/p>", "<p>理想变压器<\/p>", "<p>实际变压器<\/p>", "<p>全耦合变压器<\/p>", "", ""], "r": "B", "e": "【定位】第3章，3.9节，知识点2：理想变压器\n【解析】理想变压器概念：\n理想变压器是在实际的磁耦合变压器的电路模型基础上通过一定假设条件导出。当铁心变压器满足无损耗、无漏磁通（全耦合）、自感互感都为无穷大（参数无穷大）这三个条件时，便可称为理想变压器。选项A中的空芯变压器是指变压器的芯子由非铁磁材料构成的变压器；选项C中的实际变压器是要考虑损耗、考虑漏磁通（耦合系数小于1）、自感互感不是无穷大的变压器；选项D中的耦合变压器，范围宽泛，变压器都是基于磁耦合概念设计出来的一种电子设备，都是利用磁耦合绕组将能量从一个电路转换到另一个电路，因此耦合变压器不特指题干所描述特性的变压器。综上，正确答案选B。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7997", "t": 1, "q": "当理想变压器副边开路时，原边相当于（     ），副边短路时，原边相当于（     ）。", "a": ["<p>短路，开路<\/p>", "<p>开路，开路<\/p>", "<p>开路，短路<\/p>", "<p>短路，短路<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Twx48c0SXlFMX99uDdNCFnuhovqUL14XW8TbIf5z.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "7998", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.c
