<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>奕诚-电工技术基础</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>

<script>
const DATA = {"id": "yc77", "name": "奕诚-电工技术基础", "chapters": [{"k": "电工技术基础||第1章", "n": "电工技术基础 / 第1章", "qs": [{"id": "5555", "t": 1, "q": "当电路中电流的参考方向与电流的真实方向相同时，该电流（     ）。", "a": ["<p>一定为正值<\/p>", "<p>一定为负值<\/p>", "<p>不能肯定是正值或负值<\/p>", "<p>和电压的参考方向有关<\/p>", "", ""], "r": "A", "e": "【定位】第1章，1.1节知识点2：参考方向\n【解析】电流的参考方向与电流的真实方向相同时，电流为正值；而当电流的参考方向与电流的真实方向相反时，电流为负值。故选项A正确。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5556", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/xRxBVRW92ANUUwELKQy9Ll1VBTgFWWFnbyPOp9Eb.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260716/islW4CBhIPCJ9OUvUb2Pv86lyLw4eyWqK3y4ahNU.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/m4LEJy8SXTnjgegWN8qMg5ltSUNYjQL4BcCo0rxz.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/oxuS6WRwPAFrFQYEamZKUDjjqvfp3agjKiYcbWK6.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/OCBdkR3fR83zKXlcJZUxOv3T1dWaeg91CUPYb36M.png\"><\/p>", "", ""], "r": "B", "e": "【定位】第1章，1.1节，知识点2：参考方向\n【解析】电流的参考方向：\n(1) 电流的参考方向为任意假设的方向。\n(2) 电流的真实方向有可能与参考方向相同，也可能与参考方向相反。\n(3) 当真实方向与参考方向相同时，电流取正值；当真实方向与参考方向相反时，电流取负值。\n按图示电流方向由a→b为参考方向，当实际方向也从a→b时电流为正值，而当实际电流从b→a时电流为负值。所以选项B正确。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5557", "t": 1, "q": "电压的实际方向是（     ）。", "a": ["<p>高电位端指向低电位端<\/p>", "<p>低电位端指向高电位端<\/p>", "<p>与电动势的方向相同<\/p>", "<p>与电流的方向一样<\/p>", "", ""], "r": "A", "e": "【定位】第1章，1.1节，知识点2：参考方向\n【解析】电压的方向：\n(1) 实际方向：实际高电位端“+”指向实际低电位端“-”的方向。\n(2) 参考方向：任意假设的电压方向。若计算出电压值为正值，表明电压实际方向与所设参考方向一致；计算出电压值为负值，表明电压实际方向与所设参考方向相反。\n此题考察的是在电路中正电荷的移动方向。电压实际方向即正电荷在电场力作用下的移动方向，即高电位与低电位之间产生的作用，故选项A正确。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5558", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/6ozmUOUQ9ay91Nk5PyPfgcyeKHVOQqidIvPYJS9z.png\"><\/p>", "a": ["<p>7V<\/p>", "<p>-7V<\/p>", "<p>3V<\/p>", "<p>-3V<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/EOdRIASBJHLJnCckn2B7WQOy3suqUKwUEVP9TIZ1.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5559", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/TNiIfGnT6NpfZdqQ61wUAmaU5DW5r7qe9RU5ZW22.png\"><\/p>", "a": ["<p>6V<\/p>", "<p>-4V<\/p>", "<p>8V<\/p>", "<p>5V<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/wTEL5HbiLj3thK0JAH8YHc0AddXk2nSpDofOpqCr.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5560", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/VKqu5aeGnW2ljbfE4NFtovkqhyeLSkvJ2K2cKAQ2.png\"><\/p>", "a": ["<p>2V<\/p>", "<p>-2V<\/p>", "<p>4V<\/p>", "<p>14V<\/p>", "", ""], "r": "A", "e": "【定位】第1章，1.1节，知识点2：参考方向 \n【解析】电位的计算：\n(1) 一点的电位等于从该点出发到参考点的所有元件或支路的电压降之和。\n(2) 对于电阻而言，利用欧姆定律写电压时，顺着电流的方向RI为电压降，逆着电流的方向RI为电压升。\n分析图知，中间4欧电阻流过电流为2A故其压降为8V方向向下，而下边4欧电阻没电流流过，故其压降为0，所以A点电位UA=-6+8+0=2V，故选A。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5561", "t": 1, "q": "电流与电压为关联参考方向是指（     ）。", "a": ["<p>电流参考方向与电压参考方向一致<\/p>", "<p>电流参考方向与电压参考方向相反<\/p>", "<p>电流实际方向与电压参考方向一致<\/p>", "<p>电流实际方向与电压实际方向相反<\/p>", "", ""], "r": "A", "e": "【定位】第1章，1.1节，知识点2：参考方向。\n【解析】关联参考方向的含义：\n(1) 针对的是同一个元件或支路的端口电压参考方向与端口电流参考方向的讨论。\n(2) 关联参考方向，也称一致性参考方向：电流参考方向与电压参考方向一致，即电流从电压参考方向的高电位端流向低电位端。\n(3) 非关联参考方向，也称非一致性参考方向：电流参考方向与电压参考方向相反，即电流从电压参考方向的低电位端流向高电位端。\n此题考察的是关联参考方向的定义。关联参考方向是指对于某个元件或支路的电压和电流参考方向一致，即电流的参考方向是从电压的参考方向的高电位端指向低电位端。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5562", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/wrBAvEQ1AMKVyGRDk8afPdaKcQgcXcys79u2w6Be.png\"><\/p>", "a": ["<p>电压源发出功率<\/p>", "<p>电流源发出功率<\/p>", "<p>电流源吸收功率<\/p>", "<p>都发出功率<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260902/qK3bYeo03SSgfuzLUfzpsTnX2Vlqx3F4sLBEK9rc.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5563", "t": 1, "q": "已知某元件在非关联参考方向下，发出的功率为10kW，如果该元件的端电压为1kV，则流过该元件的电流为（     ）。", "a": ["<p>-10A<\/p>", "<p>10A<\/p>", "<p>-10mA<\/p>", "<p>10MA<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/9yi6jEAghG2vDZSaQFPJ9Ah95SruAXR2QdsxxnI3.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5564", "t": 1, "q": "导体的电阻是导体本身的一种性质，下列说法正确的是（     ）。", "a": ["<p>和截面积无关<\/p>", "<p>和长度无关<\/p>", "<p>和温度有关<\/p>", "<p>和材料无关<\/p>", "", ""], "r": "C", "e": "【定位】第1章，1.2节，知识点1：电阻元件\n【解析】电阻元件\n(1) 电阻表示导体材料对电流阻碍作用的大小，其取决于材料电阻率、长度、横截面积等。\n(2) 大多数导体的电阻与温度有关，一部分具有正温度系数，一部分具有负温度系数。\n(3) 导体的电阻是导体本身的一种性质，与是否接入电路、是否有电流通过无关。\n导体的电阻随着温度变换而变换，材料不同、长度不同、截面积不同则阻值不同，导体越长、截面积越小的导体阻值越大。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5565", "t": 1, "q": "一根导体的电阻为R，若将其拉长为原来的2倍，其阻值变为（     ）。", "a": ["<p>R/2<\/p>", "<p>R/4<\/p>", "<p>2R<\/p>", "<p>4R<\/p>", "", ""], "r": "D", "e": "【定位】第1章，1.2节知识点1：电阻元件\n【解析】导体的电阻：电阻表示导体材料对电流阻碍作用的大小，其取决于材料电阻率、长度、横截面积等。其与电阻率成正比、与长度成正比、与横截面成反比。\n导体的电阻长度越长电阻越大，横截面积越小电阻越大。若将导体拉长为原来的2倍后，横截面积相应减小为原来的1/2，因此电阻变大为原来的4倍。故选项D正确。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5566", "t": 1, "q": "在探究“电流跟电压、电阻的关系”时，根据收集到的数据可知下列说法错误的是（     ）。", "a": ["<p>电阻一定时，电流随电压的增大而增大<\/p>", "<p>电阻一定时，电压随电流的增大而增大<\/p>", "<p>电压一定时，电阻随电流的增大而减小<\/p>", "<p>电压一定时，电流随电阻的增大而减小<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/JjUR9awlpmP9WGsMTzEgN6C0COhcsGcVHI9ncFOS.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5567", "t": 1, "q": "通过电阻上的电流增大到原来的2倍时，它所消耗的功率也增大到原来（     ）倍。", "a": ["<p>1<\/p>", "<p>2<\/p>", "<p>3<\/p>", "<p>4<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/Lv3hkWpjeHnTJqpRxCPvJv9acwNGfmuoE8BSb0Ie.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5568", "t": 1, "q": "额定值为1W、10Ω的电阻器，使用时通过电流的限额是（     ）。", "a": ["<p>0.01A<\/p>", "<p>0.203<\/p>", "<p>5.6A<\/p>", "<p>0.316A<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/dhVwQVhUThL1Y1O9d78kKeri1L2qrZWRits1i8dy.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5569", "t": 1, "q": "为了使电炉上消耗的功率减小到原来的一半，应该使（     ）。", "a": ["<p>电压加倍<\/p>", "<p>电压减半<\/p>", "<p>电阻加倍<\/p>", "<p>电阻减半<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/lDWL19VOSB6qvDPtOcVXRFr2QH0KlwwivLqtn44e.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5570", "t": 1, "q": "串联电阻的作用是（     ） 。", "a": ["<p>分流<\/p>", "<p>分压<\/p>", "<p>分频<\/p>", "<p>减小电阻<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/cMqThKV2jjRTW3rjAwtQbpWu3aIENem0ZqVUDv0C.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5571", "t": 1, "q": "一个12V/6W的灯泡，接在6V电路中，通过灯泡的实际电流是（     ）。", "a": ["<p>2A<\/p>", "<p>1A<\/p>", "<p>0.5A<\/p>", "<p>0.25A<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/5beNjFT6K0sqUZqTFToj0TNSoHVZSOOVej2dMELN.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5572", "t": 1, "q": "一个100Ω的电阻上通过2A电流，1分钟内消耗的电能为（     ）。", "a": ["<p>40J<\/p>", "<p>240J<\/p>", "<p>2400J<\/p>", "<p>24000J<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/kNjhhCz9FiQy40ZJwFWuLVexMRbLmQwlbV1U7l4v.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5573", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/us65FpZnNfuoqhVBIte4TqOP0R \/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/gGmapPOoDUTR5xE4UyuYS3oa9vCX590mDIumWfF8.png\"><\/p>", "", ""], "r": "A", "e": "【定位】第1章，1..2节，知识点4：电容元件\n【解析】电容的性质：在直流电路中，电容相当于开路。\n电容具有隔离直流的特性，故RC电路此时支路电流为0，故R上电压为0。故选项A正确。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5579", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/s6617hzJzbFVIR4VNKIWDBh3fF7h43lnu5wOAXtI.png\"><\/p>", "a": ["<p>10uF/16V<\/p>", "<p>100uF/16V<\/p>", "<p>1uF/16V<\/p>", "<p>100uF/160V<\/p>", "", ""], "r": "B", "e": "【定位】第1章，1..2节，知识点4：电容元件\n【解析】电容元件的连接：\n(1) 多个电容的串联或并联的等效计算，与电导的等效计算相似。\n(2) 串联的多个电容的等效总电容的倒数等于所有串联电容的倒数之和。\n(3) 并联的多个电容的等效总电容的等于所有并联电容的容值之和。\n并联电容的总等效电容值等于各并联电容的容值之和，正确选项为B。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5580", "t": 1, "q": "3个自感为9H的电感元件并联，等效电感L等于（     ）。", "a": ["<p>3H<\/p>", "<p>27H<\/p>", "<p>18H<\/p>", "<p>6H<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/hQ4Ke6XlH9pn5S3fajcr0UKcTLHg6czI3nGvZFcM.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5581", "t": 1, "q": "基尔霍夫定律适用于（     ）。", "a": ["<p>分布电路<\/p>", "<p>集总电路<\/p>", "<p>分立元件电路<\/p>", "<p>集成电路<\/p>", "", ""], "r": "B", "e": "【定位】第1章，1.3节，知识点2：基尔霍夫定律 \n【解析】基尔霍夫电流定律：\n在集总参数电路中，任何时刻，流入（或流出）任一结点的支路电流代数和恒等于零。\n此题目主要考察基尔霍夫定律适用性方面的知识点。基尔霍夫定律适用于一切集总参数电路。所谓集总参数电路是指电路本身的最大线性尺寸远小于电路中电流或电压的波长的电路，反之则为分布参数电路。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5582", "t": 1, "q": "基尔霍夫电流定律适用于（     ）。", "a": ["<p>结点<\/p>", "<p>支路<\/p>", "<p>网孔<\/p>", "<p>回路<\/p>", "", ""], "r": "A", "e": "【定位】第1章，1.3节，知识点2：基尔霍夫定律\n【解析】基尔霍夫电流定律：\n在集总参数电路中，任何时刻，流入（或流出）任一结点的支路电流代数和恒等于零。\n由基尔霍夫电流定律(KCL)的定义可知，KCL针对的对象是结点，而选项BCD均为KVL针对的对象，故选项A正确。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5583", "t": 1, "q": "KCL定律是对电路中结点处（     ）之间施加的线性约束关系。", "a": ["<p>支路电流<\/p>", "<p>元件上的电压<\/p>", "<p>回路电流<\/p>", "<p>电流源<\/p>", "", ""], "r": "A", "e": "【定位】第1章，1.3节，知识点2：基尔霍夫定律\n【解析】基尔霍夫电流定律：在集总参数电路中，任何时刻，流入（或流出）任一结点的支路电流代数和恒等于零。\nKCL定律即对任一结点(或广义结点)来说，流入与流出的支路电流之和为0，故其是对支路电流的线性约束关系，故选A。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5584", "t": 1, "q": "<p>（已系统为准）<img src=\"https://dati.gwzpks.com/uploads/20260716/LJ9GzkH93ZLdgShx8hTUP6b4OcjAYv1AwK46lG1N.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260716/LnOsOIgnwYy207O9bPeZLMEyoBV49vitbF2K6hQc.png\" width=\"169\" height=\"48\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/6ok8LGAOVVOOeptqLDOxb9XKszU7DNTh2fO2A6jD.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260904/eRQBSp09kpPJfvDHfxbush2xkuhBYWhAhmA07RuX.png\"><\/p>", "<p><br><img src=\"https://dati.gwzpks.com/uploads/20260716/cWL3T7DKtd0wwBtjo6N3UaCk6jo1iSJYPL38Cogm.png\"><\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/N2OKVeL1kQ0h0Si0xqYYEOiWduwZOKstsyMgohIo.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5585", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/hJHjAs4zGlIlwYNX1P50swFYjHZL4s3K7iFpzVJ0.png\"><\/p>", "a": ["<p>11A<\/p>", "<p>-12A<\/p>", "<p>7A<\/p>", "<p>-7A<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/6ChcJLBvBeNnMWiMlQ7hRQQR5Hls5Zs3QyPNdf4I.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5586", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/IMsXQsqck8zGRgbxju9B2qdn9ucfrsjb0v8fDQkG.png\"><\/p>", "a": ["<p>2Ω<\/p>", "<p>4Ω<\/p>", "<p>6Ω<\/p>", "<p>8Ω<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/g84oCFmfmrXOMwuagn2oC5GJOB2ytBhmchdkkNac.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5587", hrrCfSzEYhfabEUYRsl.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/K7mfDMafPHPQGnCWinZfL6GkQDrf3JDkota9ItPf.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/8yJlzNqLMiX9nIgUZxo0OJegxf12oP5mGdK5aBhj.png\"><\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/y6ZAO9Vq8evE4hs4ZxoQfz7eAW564PBzepEkesgs.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5592", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/rrLe1OK8LokhPtPvehObTUSTNuCcIWBHyub7MNch.png\"><\/p>", "a": ["<p>0A<\/p>", "<p>1A<\/p>", "<p>2A<\/p>", "<p>3A<\/p>", "", ""], "r": "A", "e": "【定位】第1章，1.3节，知识点2：基尔霍夫定律\n【解析】基尔霍夫电流定律：\n(1) KCL列写方程针对的对象是结点或广义结点(闭合曲面)。\n(2) 对于结点或广义结点(闭合曲面)而言：流入结点的电流之和等于流出结点的电流之和；或对于某一结点而言，流入(或流出)结点的电流的代数和为零。\ni所在支路并不构成电路，故电流i=0。也可以对左边部分电路或右边部分电路作一个闭合曲面形成广义结点，由于只有一条支路穿过该广义结点，所以该支路的电流必为零。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5593", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/AgLURyxOosgYSo28NnFnljCXPzXUFDWh1x0k2DIv.png\"><\/p>", "a": ["<p>1.5A<\/p>", "<p>5.5A<\/p>", "<p>3A<\/p>", "<p>8A<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/rrzT3YPF4jZ7RQWybXNQYhN8CenRViKJzhYvhGPL.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5594", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/ulPhj0M5WFW384hGCSf4nkvj61vXIyAy2cftzxSW.png\"><\/p>", "a": ["<p>0V<\/p>", "<p>10V<\/p>", "<p>-6V<\/p>", "<p>6V<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/SLG4GI7TycZS14jCZlIgiWGe71AMN2uXt2CzByJn.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5595", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/KegUT6FpGJkNFRAxGa0k12OhpIresSNyfOaWXEtL.png\"><\/p>", "a": ["<p>2V<\/p>", "<p>3V<\/p>", "<p>1V<\/p>", "<p>0V<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/xvrWPPujr8QgCgFNrfyDpT5eDMug9CrNzkIardql.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5596", "t": 1, "q": "基尔霍夫电压定律指出∶“在集总参数电路中，任何时刻，沿任一回路，所有支路电压的代数和恒等于（     ）”。", "a": ["<p>1<\/p>", "<p>U<\/p>", "<p>电源电动势<\/p>", "<p>0<\/p>", "", ""], "r": "D", "e": "【定位】第1章，1.3节，知识点2：基尔霍夫定律\n【解析】基尔霍夫电压定律物理实质：电位单值性原理\n基尔霍夫电压定律(KVL)：在集总参数电路中，任意时刻，沿任一闭合回路电压降代数和恒为零。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5597", "t": 2, "q": "关于集总参数元件，下列说法正确的是（     ）。", "a": ["<p>任何时刻，流入二端网络的一个端子的电流等于从另一个端子流出的电流<\/p>", "<p>元件的电压和电流为线性关系<\/p>", "<p>每种元件只能体现一种物理过程<\/p>", "<p>电压和电流只是时间的函数，与空间位置无关<\/p>", "", ""], "r": "ACD", "e": "【定位】第1章，1.1节，知识点1：电路和电路模型\n【解析】按照元件参数的空间处理：若元件尺寸远小于工作时电磁波的波长为集总参数元件，若元件尺寸与工作时电磁波的波长相比不能忽略时，称为分布参数元件。含有分布参数元件的电路称为分布参数电路。\n选项ACD分别为集总参数元件的性质，均正确；但选项B讨论的是元件的线性与非线性关系，与集总性无关，集总元件可能是线性的也可能是非线性的。故正确选项为ACD。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5598", "t": 2, "q": "下列关于产生电流的条件，说法正确的是（     ）。", "a": ["<p>电路必须闭合<\/p>", "<p>电路中必须有电源<\/p>", "<p>电路中各点电位相等<\/p>", "<p>电路中必须有负载<\/p>", "", ""], "r": "AB", "e": "【定位】第1章，1.1节，知识点2：参考方向\n【解析】电流的定义：单位时间内通过导体某一横截面积的电荷量，规定为导体中正电荷的运动方向为电流的实际方向。\n产生电流的条件：1、形成闭合回路；2、电路中有电源形成电压。可以有负载也可以没有负载。由于负载和电源上有压降的存在，所以各点的电位不相等。故正确选项为AB。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5599", "t": 2, "q": "下列关于电位的说法正确的是（     ）。", "a": ["<p>可以有多个参考点<\/p>", "<p>只有正电位没有负电位<\/p>", "<p>既有正电位也有负电位<\/p>", "<p>参考点电位为0<\/p>", "", ""], "r": "CD", "e": "【定位】第1章，1.1节，知识点2：参考方向。\n【解析】电压与电位关系：\n(1) 电压是两点之间的电位差，其数值与参考点的选择无关，所以电压是绝对的。\n(2) 电位是指该点到参考点的电压，比参考点高为正，比参考点低为负值。\n(3) 电位是相对的，与参考点的选择有关，但与计算路径无关。\n电路中只能有一个参考点，且该点电位为0，故选项A错误D正确；电位值可以比参考点高也可以比参考点低，所以电位值可以为正也可以为负，故B错误C正确。故本题的正确选项为CD。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5600", "t": 2, "q": "电阻元件的电功率大小与（     ）因素有关。", "a": ["<p>电压<\/p>", "<p>电流<\/p>", "<p>时间<\/p>", "<p>阻值<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/nu1GJStPcOHVnvU0U3azS5V3MrJpnjKROEwZCdXp.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5601", "t": 2, "q": "关于计算电阻元件耗能大小，正确的有（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260716/aQ6wSJhYq4FHYb3ZKesSF8JVGeVrIGAuHTq0d5YT.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/cutxXILILLRpe3rC79Or61kFV4vyD1FTF3mE1r4r.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/8ZN80uJoGfiReH6RUFXCjsJQezsPM1QyqdaxhZXJ.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/iB6blyyglfipyZBnCPWpYUui743mAcqXL3oAGAw9.png\"><\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/jJL1HUABgSiVQYU1xsqHORMZAdQK0fOnGB0GAJTO.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5602", "t": 2, "q": "一段电路的欧姆定律可以表示为（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260716/laooV0W6Utqu6IT5gcQpLbSHLmzrUQNqW0bjZsNa.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/A9A63zDvY096PnVyOyzmQmARdtC4vP0Yi6a5aB3Z.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/IwLwJNJjytx0IbcN0MwanTjNboPjgodrdiKDUSRb.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/giu797TWX9D7SJiUaEFx3yViKq2D0B4u9ftzWUb1.png\"><\/p>", "", ""], "r": "BCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/lImaYmiCCFFvCTipbRayaRjKDnuOHq6LiLqoeMg6.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5603", "t": 2, "q": "在电路中有两个电灯和一个开关（     ）。", "a": ["<p>若断开开关，两灯都不亮，则两灯可能是串联<\/p>", "<p>若断开开关，两灯都不亮，则两灯可能是并联<\/p>", "<p>若断开开关，只有一灯发光，则两灯是串联<\/p>", "<p>若断开开关，只有一灯发光，则两灯是并联<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/I81V25Nlfqj8kPtNGOM2B0Tr3Q9cPaNdWeAN7bUM.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5604", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/M3sTePvR77mm4joXffETMjrrTzA7MtaXGsMgQTOs.png\"><\/p>", "a": ["<p>1A，1V<\/p>", "<p>-1A，-1V<\/p>", "<p>1A，10V<\/p>", "<p>1A，-10V<\/p>", "", ""], "r": "AC", "e": "【定位】第1章，1.2节，知识点2：独立电源  \n【解析】理想电流源的性质：\n(1)理想电流源的输出电流与外电路无关\n(2) 输出电压与外电路有关，由电流源和负载的大小共同决定。\n(3) 禁止开路，可以短路。\n电路只有一条支路，所以电流源的电流1A向下流过电阻，与电阻的大小无关；电流源电压等于电阻电压，由电流源的电流和电阻决定。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5605", "t": 2, "q": "对于实际电压源，下列说法不正确的是（     ）。", "a": ["<p>外电路电阻增大，路端电压减小<\/p>", "<p>电源短路时，路端电压最大<\/p>", "<p>电源电动势与路端电压相等<\/p>", "<p>外电路电阻减小，路端电压减小<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/ptq0xi8LnioPB86RDoaX7g8aXgz13hm1IW45v05G.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5606", "t": 2, "q": "下面的（     ）可以作为受控电压源的控制量。", "a": ["<p>支路电压<\/p>", "<p>支路电流<\/p>", "<p>某元件功率<\/p>", "<p>电阻<\/p>", "", ""], "r": "AB", "e": "【定位】第1章，1.2节，知识点3：受控电源\n【解析】定义：受控电压源的电压或受控电流源的电流并不独立存在，而是受电路中另一处的电压或电流控制，这类电源称为受控电源。\n受控电压源的控制量可以是电路另外一处的电压或电流，根据控制量的不同，受控电压源有VCVS（电压控制电压源）和CCVS（电流控制电压源）两种形式。故选项AB正确。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5607", "t": 2, "q": "常用的受控源有以下几种（     ）。", "a": ["<p>VCVS<\/p>", "<p>VCCS<\/p>", "<p>CCVS<\/p>", "<p>CCCS<\/p>", "", ""], "r": "ABCD", "e": "【定位】第1章，1.2节，知识点3：受控电源 \n【解析】\n定义：受控电压源的电压或受控电流源的电流并不独立存在，而是受电路中另一处的电压或电流控制，这类电源称为受控电源。\n受控源的分类：根据控制量和被控量可以分为四种受控电源：VCVS(电压控制电压源)、VCCS(电压控制电流源)、CCVS(电流控制电压源)、CCCS(电流控制电流源)\n根据控制量和被控量的不同，常用的受控源有电压控制电压源(VCVS)、电压控制电流源(VCCS)、电流控制电流源(CCCS)、电流控制电压源(CCVS)。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5608", "t": 2, "q": "下面的表达式，（     ）是指电压控制的受控源。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260716/g66lcBO68w0LssvQQx9QteSiBHiBwqExLX70Aq1k.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/5XsX1lZdmcW7jduhgqiSlgGesqbrCI5LxRtq8gPS.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/avpzzLqoaXIZN4DzVOK5ukrp5RxxZeG1nrFVZUCK.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/AcXaTkqxuJ84MVxUyEegOjIlcTRB41W3oLLl4zF5.png\"><\/p>", "", ""], "r": "CD", "e": "【定位】第1章，1.2节，知识点3：受控电源\n【解析】定义：受控电压源的电压或受控电流源的电流并不独立存在，而是受电路中另一处的电压或电流的控制。\n这个题考的是控制量，选择控制量是电压的受控源，所以选CD。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5609", "t": 2, "q": "下列关于电容的说法正确的是（     ）。", "a": ["<p>能够储存电场能量的元件<\/p>", "<p>电容在直流情况下其两端电压恒定，相当于开路<\/p>", "<p>电容是一种记忆元件<\/p>", "<p>电容是一种无源元件<\/p>", "", ""], "r": "ABCD", "e": "【定位】第1章，1..2节，知识点4：电容元件\n【解析】电容元件：\n(1) 定义：表征电路元件储存电荷(或电场能)特性的理想元件。\n(2) 线性电容的库-伏特性为过原点的直线。\n(3) 电容的性质：储能元件、非耗能元件、隔直通交、动态元件、记忆元件、无源元件。\n根据电容的定义与性质，电容是一种记忆元件，无源元件，具有通交阻直的特性，储存电场能量。所以正确选项为ABCD。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5610", "t": 2, "q": "关于电感，下列说法正确的是（     ）。", "a": ["<p>电感元件反映了电流产生磁通和磁场能量储存的物理现象<\/p>", "<p>单位为H<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/bdCDVrEVIvvju3iinnquO9PSBObSwdWS9I89F3n6.png\"><\/p>", "<p>一个非记忆元件<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/BdD4aHPEoi5CRqIUWwN6ImsAr1FBPLqDHKmHivip.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5611", "t": 2, "q": "关于基尔霍夫电流定律，下列说法正确的是（     ）。", "a": ["<p>任一瞬间任一结点的各支路电流的代数和为零<\/p>", "<p>基尔霍夫电流定律只适用于交流电路<\/p>", "<p>通过任意封闭面的电流的代数和为零<\/p>", "<p>基尔霍夫电流定律也称基尔霍夫第一定律<\/p>", "", ""], "r": "ACD", "e": "【定位】第1章，1.3节，知识点2：基尔霍夫定律\n【解析】基尔霍夫电流定律：在集总参数电路中，任何时刻，流入（或流出）任一结点的支路电流代数和恒等于零。\n基尔霍夫电流定律是针对结点或广义结点(闭合曲面)列写的支路电流的约束方程，所以选项AC正确，同时基尔霍电流定律也称基尔霍夫第一定律，所以选项D也正确。基尔霍电流定律适于一切的集总参数电路，不管电路是直流的还是交流的，所以选项B错误。正确选项为ACD。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5612", "t": 3, "q": "集总参数元件的电磁过程都分别集中在各元件内进行。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，1.1节，知识点1：电路与电路模型\n【解析】按照元件参数的空间处理：若元件尺寸远小于工作时电磁波的波长为集总参数元件，若元件尺寸与工作时电磁波的波长相比不能忽略时，称为分布参数元件。含有分布参数元件的电路称为分布参数电路。\n集总参数元件的性质之一：假定元器件伴随的电磁过程都分别集中在各元件内部进行，这种元件就称为集总参数元件，简称为集总元件，否则为分布参数元件。全部由集总元件构成的电路称为集总参数电路。陈述正确，正确选项为A。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5613", "t": 3, "q": "电路模型可分为集总参数电路模型和分布参数电路模型两种。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，1.1节，知识点1：电路与电路模型\n【解析】按照元件参数的空间处理：若元件尺寸远小于工作时电磁波的波长为集总参数元件，若元件尺寸与工作时电磁波的波长相比不能忽略时，称为分布参数元件。含有分布参数元件的电路称为分布参数电路。\n此题考察的是电路模型的分类，电路按照空间关系来分可以分为集总参数电路或分布参数电路。陈述正确，正确选项为A。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5614", "t": 3, "q": "如果元件参数是时间t的函数，对应的元件叫做时变元件，否则叫做时不变元件。定常元件(元件的参数是常数)是时不变元件。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，1.1节，知识点1：电路与电路模型\n【解析】按照元件参数与时间的关系，元件参数不随时间发生变化的为非时变元件，或时不变元件。元件的参数是常数，不随时间发生变化，也叫定常元件。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5615", "t": 3, "q": "如果一个二端网络只含有电阻和受控源，这样的二端网络也属于有源二端网络。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，1.1节，知识点1：电路与电路模型\n【解析】有源中的“源”是指独立源（电源又称为激励或激励源，由激励作用在电路中产生的电压和电流称为响应），受控源不是激励源，所以如果一个二端网络只含有电阻和受控源，不含独立源，这样的二端网络不属于有源二端网络。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5616", "t": 3, "q": "四端网络一定是二端口网络。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，1.1节，知识点1：电路与电路模型\n【解析】四端网络，只有满足端口条件的四端网络才可能构成二端口网络，并不是所有四端网络都是二端口网络。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5617", "t": 3, "q": "电压和电流计算结果得负值，说明它们的参考方向假设反了。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，1.1节，知识点2：参考方向\n【解析】电流的参考方向：\n(1) 电流的参考方向为任意假设的方向。\n(2) 电流的真实方向有可能与参考方向相同，也可能与参考方向相反。\n(3) 当真实方向与参考方向相同时，电流取正值；当真实方向与参考方向相反时，电流取负值。\n此题考察电流的参考方向的含义：电流的参考方向为电路求解前任意假设的方向。若实际电流方向与参考方向相同，电流值一定为正；若实际电流方向与参考方向相反，电流值一定为负。若电压电流计算结果为负值，表明假设参考方向与实际方向相反。所以参考方向本身不存在反不反的问题，结果为负载必须表明参考方向和实际方向相反。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5618", "t": 3, "q": "当电路中电流的参考方向与电流的真实方向相反时，该电流一定为正值。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，1.1节，知识点2：参考方向\n【解析】电流的参考方向：\n(1) 电流的参考方向为任意假设的方向。\n(2) 电流的真实方向有可能与参考方向相同，也可能与参考方向相反。\n(3) 当真实方向与参考方向相同时，电流取正值；当真实方向与参考方向相反时，电流取负值。\n此题考察电流的参考方向的含义：电流的参考方向为电路求解前任意假设的方向。若实际电流方向与参考方向相同，电流值一定为正；若实际电流方向与参考方向相反，电流值一定为负。此题的电流应该一定为负值，因此错误。陈述错误，正确选项为B。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5619", "t": 3, "q": "电荷的运动是由电位决定的而不是电位差。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，1.1节，知识点2：参考方向\n【解析】电流及其参考方向：\n(1) 定义：单位时间内通过导体某一横截面积的电荷量。\n(2) 正电荷受到电场力的作用下，由高电位端向低电位端移动形成电流。\n(3).实际方向：规定为导体中正电荷的运动方向。\n正电荷是由高电位端向低电位端移动，而负电荷是由低电位端向高电位端移动，因此只有构成了电位差电荷才会移动。陈述错误，答案为选项B。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5620", "t": 3, "q": "习惯上把负电荷运动的方向规定为电流的方向。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，1.1节，知识点2：参考方向\n【解析】电流的定义：单位时间内通过导体某一横截面积的电荷量，规定为导体中正电荷的运动方向为电流的实际方向。\n正电荷的运动方向与规定的电流方向一致。在电场力作用下，正电荷从电路的高电位端向低电位端移动，负电荷是从低电位端向高电位端移动。陈述错误，答案为选项B。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5621", "t": 3, "q": "电位具有相对性，其大小正负是相对于电路参考点而言的（     ）。", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，1.1节，知识点2：参考方向\n【解析】电压与电位关系：\n(1) 电压是两点之间的电位差，其数值与参考点的选择无关，所以电压是绝对的。\n(2) 电位是指该点到参考点的电压，比参考点高为正，比参考点低为负值。\n(3) 电位是相对的，与参考点的选择有关，但与计算路径无关。\n电位是对于参考点的电压，其大小正负均与选择的参考点有关，选择不同的参考点，其值不同。陈述正确，答案为选项A。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5622", "t": 3, "q": "若把电路中原来电位为3V的一点改选为参考点，则电路中各点电位比原来降低3V，各元件电压不变。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，1.1节，知识点2：参考方向\n【解析】电压与电位关系：\n(1) 电压是两点之间的电位差，其数值与参考点的选择无关，所以电压是绝对的。\n(2) 电位是指该点到参考点的电压，比参考点高为正，比参考点低为负值。\n(3) 电位是相对的，与参考点的选择有关，但与计算路径无关。\n各点电位的大小与参考点有关，元件上的电压或电位差与参考点无关。若将电路中原来电位为3V的点改为参考点，则电路中各点的电位都会比原来降低3V。陈述正确，正确选项为A。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5623", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/mkopqAV3X4JLRZxCIOLyQC3AtpcGpxqULvTJID6S.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/xwRuwR8bTENMZqj2I6TtFFgEr3Yeu1fhhF4aEo0O.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5624", "t": 3, "q": "元件上电流与电压取关联参考方向，已知I>0，U<0，则该元件吸收功率。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/wioFGTs4baBnTVxXLkn9UAlqAkgFxsh8Zg5L1Hvx.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5625", "t": 3, "q": "欧姆定律体现了线性电路元件上电压电流的约束关系，与电路的连接方式有关。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/Xh9pgosHEWk3pd0JsFO5ITUrfrqxOclBcFqEIwzC.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5626", "t": 3, "q": "串联电路中各电阻上电压的大小与其电阻值的大小成反比。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/KeYynZwUjEHPQzBiiYw034A1U5M57LHEDkFZQnO0.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5627", "t": 3, "q": "在纯电阻电路中具有储能和与电源交换能量的特性。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/PFg4ZcQENSyNCjL4Cq5hljEJRqu92r3mDRlC2QJB.png\"><\/p>", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5628", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260716/OmmSokgV8ryjo4GrTKrIfrbESi2UJwAcRC4v9cyV.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，1.2节，知识点2：独立电源\n【解析】理想电压源的性质：\n(1) 理想电压源的输出电压与外电路无关\n(2) 输出电流与外电路有关，由电压源和负载的大小共同决定。\n(3) 禁止短路，可以开路。\n如理想电压源是直流电压源时，其伏安特性为平行于电流轴的一条直线", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5629", "t": 3, "q": "当恒压源开路时，该恒压源内部无电流，无功率损耗。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，1.2节，知识点2：独立电源\n【解析】理想电压源的性质：\n(1) 理想电压源的输出电压与外电路无关\n(2) 输出电流与外电路有关，由电压源和负载的大小共同决定。\n(3) 禁止短路，可以开路。\n当恒压源开路时，不能形成回路，此时无电流，也没有功率损耗。陈述正确，选项为A。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5630", "t": 3, "q": "受控源是用来反映电路中某处的电压或电流能控制另一处电压或电流的现象。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，1.2节，知识点3：受控电源 \n【解析】\n定义：受控电压源的电压或受控电流源的电流并不独立存在，而是受电路中另一处的电压或电流控制，这类电源称为受控电源。\n此题受控源的概念。受控源是用来反映电路中某处的电压或电流能控制另一处电压或电流的现象。陈述正确，正确选项为A。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5631", "t": 3, "q": "受控源不是独立源，但是一种激励。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，1.2节，知识点3：受控电源 \n【解析】定义：受控电压源的电压或受控电流源的电流并不独立存在，而是受电路中另一处的电压或电流的控制。\n受控源不是独立源，也不是激励，只有独立源才是激励。陈述错误，答案为选项B。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5632", "t": 3, "q": "电路稳定后，由于电容器所在支路无电流通过，所以在此支路中的电阻上无电压降，因此电容器两极间的电压就等于该支路两端的电压。（       ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，1..2节，知识点4：电容元件\n【解析】电容元件的特点：通交流隔直流\n电容元件的电流正比于电压的变化率，稳态时，电压不变，电流为0，所以同一支路上的电阻电压为0，电容电压等于支路电压。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5633", "t": 3, "q": "基尔霍夫电流定律说明在集总参数电路中，在任一时刻，流出或者流入任一结点或封闭面的各支路电流的代数和为零。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，1.3节，知识点2：基尔霍夫定律\n【解析】基尔霍夫电流定律：在集总参数电路中，任何时刻，流入（或流出）任一结点的支路电流代数和恒等于零。\n此题考察的是基尔霍夫电流定律的定义。需要注意的是电流和指的是代数和，对于结点而言，若定义流入结点的电流为正，那么流出结点的电流就为负，反之亦然。陈述正确，正确选项为A。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5634", "t": 3, "q": "电阻串联电路的端口电压等于各电阻电压的代数和。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，1.3节，知识点2：基尔霍夫定律\n【解析】基尔霍夫电压定律：\n沿回路巡行一周，所有元件的电压降(或电压升)的代数和为零，或者所有的电压降等于所有的电压升。\n根据支路的KVL，串联支路的总电压等于各元件的电压之和，所以多个电阻相串联的电路的端口电压等于各个电阻电压的和(叠加)。陈述正确，正确选项为A。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5635", "t": 3, "q": "基尔霍夫电压定律说明在集总参数电路中，在任一时刻，沿任一回路巡行一周，各元件的电压绝对值之和为零。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，1.3节，知识点2：基尔霍夫定律\n【解析】基尔霍夫电压定律：\n沿回路巡行一周，所有元件的电压降(或电压升)的代数和为零，或者所有的电压降等于所有的电压升。\n此题考察的是基尔霍夫电压定律的定义。基尔霍夫电压定律指出，在任一时刻，，沿任一回路巡行一周，各元件上的电压的代数和为零，而不是绝对值之和为零。代数和的意思是，沿巡行方向，对各元件的电压而言，有电压降与电压升之区别。陈述错误，正确选项为B。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "5636", "t": 3, "q": "电路中回路就是网孔，网孔就是回路。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，1.3节，知识点1：基本概念\n【解析】回路的定义：电路中的任一闭合路径。网孔的定义：平面电路中，内部不含支路的回路。\n电路的回路不一定是网孔，但网孔肯定是回路。网孔只存在于平面电路中，且是平面电路中不含交叉支路的回路。电路中回路就是网孔是错误的，网孔肯定是回路。所以陈述错误，正确选项为B。", "l3": "电工技术基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}]}, {"k": "电工技术基础||第2章", "n": "电工技术基础 / 第2章", "qs": [{"id": "7721", "t": 1, "q": "对含有激励源的二端网络计算等效电阻时，正确的是（     ）。", "a": ["<p>电压源和电流源都用开路替代<\/p>", "<p>电压源和电流源都用短路替代<\/p>", "<p>电压源用短路代替，电流源用开路代替<\/p>", "<p>电压源用开路代替，电流源用短路代替<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/sBC5XQ5ZocSJU1a41VJFXEyeRSUeGNU5kd8x2tzH.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7722", "t": 1, "q": "等效电路的等效原则是除被等效电路部分替代的部分，未被替代的部分的电压和电流（     ）。", "a": ["<p>均改变<\/p>", "<p>均保持不变<\/p>", "<p>均是任意的<\/p>", "<p>可变化，也可不变，视具体情况而定<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/3DURvANNlhlLERv5mEf3y3I8d1AFxCAtxYBn7p8a.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7723", "t": 1, "q": "等效变换的特点是（     ）。", "a": ["<p>对外电路等效，对内不等效<\/p>", "<p>对内电路等效，对外电路不等效<\/p>", "<p>对外电路和内电路均等效<\/p>", "<p>对外电路和内电路均不一定等效<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/4T9PmiXpk0DTyjVK7ydM7DbfSA2GvmNmeaBsJaNa.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7724", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Pu9Q4m0WYa8MI8UeBW1zUPP9Yeagk9QmSeUNMeLn.png\"><\/p>", "a": ["<p>A部分和B部分<\/p>", "<p>A部分和C部分<\/p>", "<p>B部分和C部分<\/p>", "<p>B部分和D部分<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/8eQ8aKkOnKPyuo3zPkjxWKo6nUSQrYr0g1H753Ku.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7725", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/tkKitCnsNck1ROgHGUMji8V6QeGzhO4bOHAgeExU.png\"><\/p>", "a": ["<p>0<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/FH358o4kFnIfukOvi2onp8lNh6UTtrgCwWiZDRIg.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/tNP5xVc68cvQt4wrTGDdDQTZGx4dIXw0anSawJVS.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/iVeN2Ogsttmmc6tLOkugjbYfBBpgSI0oi9T593uO.png\"><\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/XI2ob2XKWzhpdMxseRGUfQel7BQOZ8nIkgCuoNmx.png\"><\/p>", "l3": "电工技术基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "7726", "t": 1, "q": "两个额定值都为100V/100W的灯
