定<\/p>", "", ""], "r": "A", "e": "【定位】考察第7章，第4节，知识点1，磁动势平衡。\n【解析】空载运行时，只存在一次绕组磁动势F1，铁芯上主磁通只由一次绕组磁动势构成。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9494", "t": 1, "q": "三相电力变压器磁势平衡方程为（     ）。", "a": ["<p>原副边磁势的代数和等于合成磁势<\/p>", "<p>原副边磁势的时间向量和等于合成磁势<\/p>", "<p>原副边磁势算术差等于合成磁势<\/p>", "<p>原副边磁势算术和等于合成磁势<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/iXsP5TQdcPUyKAzS9slaEs9B3ScxhiwhqgnHW0PU.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9495", "t": 1, "q": "变压器负载运行时，二次侧漏感应电动势是由（     ）产生的。", "a": ["<p>主磁通<\/p>", "<p>二次侧漏磁通<\/p>", "<p>合成磁通<\/p>", "<p>一次侧漏磁通<\/p>", "", ""], "r": "B", "e": "【定位】考察第7章，第4节，知识点4：等效电路。\n【解析】变压器绕组的漏感应电动势由漏磁通产生，二次侧漏感应电动势的对应激发磁通则是二次侧漏磁通；主磁通负责能量传递并产生主电动势，一次侧漏磁通仅对应一次侧漏电动势。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9496", "t": 1, "q": "变压器二次侧的参数向一次侧折算时，二次侧漏电抗的折算值为（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/cEmKfEe5qExaxLL1wL7vDcz66QsuUaXuUrZ7tvDA.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/SZccbR0C8d0LdyJLaPhqILZPPkJ5waU0kWkKCuPf.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2diBQRvSZbzC6JrMtC6Q7pGlwakDzFDXZXSfiSBG.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/gqt9tqKfVjRFXgcagvypEEK3vgobfIZ7pZAyVdV6.png\"><\/p>", "", ""], "r": "B", "e": "【定位】考察第7章，第4节，知识点3，绕组折算。\n【解析】变压器一、二次折算计算的条件为折算前后二次侧绕组的磁动势不变、有功不变、无功不变、损耗不变；由折算条件，可算得折算后的电压等于折算前的电压乘变压器变比k，折算后的电阻（电抗、阻抗）等于折算前的电阻乘变压器变比k的平方，折算后的电流等于折算前的电流除以变压器变比k。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9497", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/XYkOdYzatWtwnjGIJj9wuXW80s0rr3CYZNuXaVtK.png\"><\/p>", "a": ["<p>2<\/p>", "<p>8<\/p>", "<p>16<\/p>", "<p>32<\/p>", "", ""], "r": "A", "e": "【定位】考察第7章，第4节，知识点3，绕组折算。\n【解析】变压器一、二次折算计算的条件为折算前后二次侧绕组的磁动势不变、有功不变、无功不变、损耗不变；由折算条件，可算得折算后的电压等于折算前的电压乘变压器变比k，折算后的电阻（电抗、阻抗）等于折算前的电阻乘变压器变比k的平方，折算后的电流等于折算前的电流除以变压器变比k。代入本题数据，得，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9498", "t": 1, "q": "变压器进行绕组折算二次侧阻抗折算后为原阻抗的（     ）倍。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/LUAH2AHbXZXwYIPrQsFaGP8RKX3n0wv2mPvQXdSc.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/tLXInuZ7k2FgLqv7Q4C7fU1sa5mqbeFVU1WdtLbn.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/3hHfN5wjCLyN1Z49bf15c8d6YbXa9b1GgJ0Hgo5y.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/v9wWc7CbYdw0tvnvCx4QqCGRl2OCc7HxGdC8D8hS.png\"><\/p>", "", ""], "r": "B", "e": "【定位】考察第7章，第4节，知识点3，绕组折算。\n【解析】变压器一、二次折算计算的条件为折算前后二次侧绕组的磁动势不变、有功不变、无功不变、损耗不变；由折算条件，可算得折算后的电压等于折算前的电压乘变压器变比k，折算后的电阻（电抗、阻抗）等于折算前的电阻乘变压器变比k的平方，折算后的电流等于折算前的电流除以变压器变比k。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9499", "t": 1, "q": "一台变压器一次侧接在额定电压的电网上，当二次侧带纯电阻负载时，则从一次侧输入的功率（     ）。", "a": ["<p>只包含有功功率<\/p>", "<p>既有有功功率，又有无功功率<\/p>", "<p>只包含无功功率<\/p>", "<p>为零<\/p>", "", ""], "r": "B", "e": "【定位】考察第7章，第4节，知识点4，等效电路。\n【解析】变压器本身自带无功部分，因此带纯电阻时一次侧需要输入无功和有功，因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9500", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Z3f7ivjOx5nXCHzotxR365oKN1GDUp4DAhv9GXpU.png\"><\/p>", "a": ["<p>原边铜损耗电阻<\/p>", "<p>副边铜损耗电阻<\/p>", "<p>铁心损耗的等效电阻<\/p>", "<p>短路电阻<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/HyEq6Nop6AkhmUsCNQoBYZGoJpwKwsL1dRETXNZP.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9501", "t": 1, "q": "变压器空载试验不能获得的物理量是（     ）。", "a": ["<p>变比<\/p>", "<p>空载电流<\/p>", "<p>短路电抗<\/p>", "<p>励磁电阻<\/p>", "", ""], "r": "C", "e": "【定位】考察第7章，第5节，知识点1，空载试验，对变压器空载试验的了解，主要考察变压器空载试验的目的。\n【解析】变压器空载试验可测取变比（一二次空载电压比）、空载电流、励磁电阻与励磁电抗；短路电抗是表征绕组漏磁通的参数，需通过短路试验测得，空载试验无法获取。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9502", "t": 1, "q": "变压器的铁心损耗可由（     ）试验获得。", "a": ["<p>短路试验<\/p>", "<p>负载试验<\/p>", "<p>空载实验<\/p>", "<p>负载试验<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/MrBs6IUgxnYZRS4NTUmscOfjvxHGJox5wDJVCUg0.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9503", "t": 1, "q": "变压器短路实验所测损耗（     ）。", "a": ["<p>主要为铜耗<\/p>", "<p>主要为铁耗<\/p>", "<p>全部为铜耗<\/p>", "<p>全部为铁耗<\/p>", "", ""], "r": "A", "e": "【定位】考察第7章，第5节，知识点2，短路实验，对变压器短路损耗Pk概念的理解，变压器短路损耗与铜耗的关系\n【解析】综合变压器二次侧折算到一次侧后的等效电路图可知，短路损耗主要为铜耗。因此本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9504", "t": 1, "q": "变压器的负载损耗正比于绕组的（     ）。", "a": ["<p>电阻<\/p>", "<p>电抗<\/p>", "<p>阻抗<\/p>", "<p>长度<\/p>", "", ""], "r": "A", "e": "【定位】考察第7章，第5节，知识点2，短路实验，短路损耗=负载损耗。\n【解析】负载损耗为有功损耗，因此应正比于电阻。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9505", "t": 1, "q": "一台单相变压器额定电压为220/110V，在高压侧作短路实验，测得的短路阻抗标幺值为0.06，若在低压侧作短路实验，测得短路阻抗标幺值为（     ）。", "a": ["<p>0.06<\/p>", "<p>0.03<\/p>", "<p>0.12<\/p>", "<p>0.24<\/p>", "", ""], "r": "A", "e": "【定位】考察第7章，第5节，知识点3，标幺值，标幺值的优点。\n【解析】本题考察对关于标幺值的认识。标幺值与折算无关，无单相三相之分。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9506", "t": 1, "q": "三相短路电流计算中采用标幺制中，只需选定两个基准值，常选的是（     ）。", "a": ["<p>电压、电流<\/p>", "<p>电压、容量<\/p>", "<p>电压、电路<\/p>", "<p>电流、阻抗<\/p>", "", ""], "r": "B", "e": "【定位】考察第7章，第5节，知识点3，标幺值，对标幺值基值的理解。\n【解析】计算标幺值时，选定的两个基值一般为电压和容量。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9507", "t": 1, "q": "一台单相变压器，一次侧施加额定电压，空载时两侧电压之比为14.5：1，额定负载时两侧电压之比为15：1，则该台变压器的额定负载时的电压变化率是（     ）。", "a": ["<p>0.025<\/p>", "<p>0.0333<\/p>", "<p>0.5<\/p>", "<p>0.05<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/U8emNfmUFzCbqAIfVKVdJZloIfDU4ZSXEoRwtvJy.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9508", "t": 1, "q": "一台三相电力变压器，二次侧带对称负载运行时的端电压恰好等于变压器二次侧的空载电压，则该负载一定是（     ）。", "a": ["<p>纯电阻负载<\/p>", "<p>电感性负载<\/p>", "<p>电容性负载<\/p>", "<p>无法判断<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/JRFjhmnBFSxrXwrpOD5tFmVC0gwcCi1CnbZ5lrmG.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9509", "t": 1, "q": "三相心式变压器各相磁阻（     ）。", "a": ["<p>相等<\/p>", "<p>不相等，中间磁阻小<\/p>", "<p>不相等，中间磁阻大<\/p>", "<p>不相等，两边磁阻小<\/p>", "", ""], "r": "B", "e": "【定位】考察第7章，第6节，知识点1，三相变压器的磁路系统\n【解析】三相心式变压器各相磁阻不相等，中间磁阻最小，原因是中间相磁路长度短。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9510", "t": 1, "q": "下列哪种形式的变压器在电力系统中（     ）不宜采用。", "a": ["<p>Y，d接法的芯式变压器<\/p>", "<p>D，y接法的组式变压器<\/p>", "<p>Y，y接法的芯式变压器<\/p>", "<p>Y，y接法的组式变压<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/s4mamqFDD9RmBur5SISTQPfXMWF4emMkTkyGeShQ.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9511", "t": 1, "q": "三相组式变压器一般不采用Y，y联接组，主要是为了避免（     ）。", "a": ["<p>线电势波形放生畸变<\/p>", "<p>相电势波形发生畸变<\/p>", "<p>损耗增大<\/p>", "<p>有效材料的消耗增大<\/p>", "", ""], "r": "B", "e": "【定位】考察第7章，第6节，知识点2，联结组，三相组式变压器连接组与励磁电流，主磁通，二次相电压，二次线电流的关系。\n【解析】三相变压器的谐波一般按三相变压器饱和分析，主要是结构与联接方式不同导致谐波不同，芯式变压器抑制谐波的效果强于组式变压器；Yy接法的变压器的三次谐波，在芯式结构下会被抑制；在组式结构下抑制效果较弱，有较大谐波，而线电势之间会相互抵消，相电势波形会产生畸变，因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9512", "t": 1, "q": "变压器的联结组号用时钟法表示，这些数字代表（     ）。", "a": ["<p>一二次侧绕组对应线电势的相位差除以30°<\/p>", "<p>一二次侧绕组对应相电势的相位差<\/p>", "<p>一二次侧绕组对应相电流的相位差除以30°<\/p>", "<p>一二次侧绕组对应相电流的相位差<\/p>", "", ""], "r": "A", "e": "【定位】考察第7章，第6节，知识点2联结组，三相变压器连接组号的定义。\n【解析】联接组合字母表示联接方式，数字表示线电压之间的相位差。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9513", "t": 1, "q": "三相组式变压器不采用Y/y连接的原因是（     ）。", "a": ["<p>一、二次绕组的线电动势为尖顶波<\/p>", "<p>空载电流为尖顶波<\/p>", "<p>主磁通为尖顶波<\/p>", "<p>一、二次绕组的相电动势为尖顶波<\/p>", "", ""], "r": "D", "e": "【定位】考察第7章，第6节，知识点2，联结组，三相组式变压器连接组与励磁电流，主磁通，二次相电压，二次线电流的关系。\n【解析】三相变压器的谐波一般按三相变压器饱和分析，主要是结构与联接方式不同导致谐波不同，芯式变压器抑制谐波的效果强于组式变压器；Yy接法的变压器的三次谐波，在芯式结构下会被抑制；在组式结构下抑制效果较弱，有较大谐波，而线电势之间会相互抵消，相电势波形会产生畸变，因此，本题答案为D选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9514", "t": 1, "q": "三相变压器二次侧比一次侧对应线电势的相位超前150度，该变压器的联结组别号为（     ）。", "a": ["<p>5<\/p>", "<p>6<\/p>", "<p>7<\/p>", "<p>8<\/p>", "", ""], "r": "C", "e": "【定位】考察第7章，第6节，知识点2，联结组，三相变压器连接组号的定义。\n【解析】题中二次侧线电压超前一次150°，则一次侧超前二次侧210°。210=30*7，因此，本题答案为C选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9515", "t": 1, "q": "以下哪个不属于变压器并联运行的优点？（     ）。", "a": ["<p>便于扩容<\/p>", "<p>可提高供电可靠性<\/p>", "<p>减小变压器数量<\/p>", "<p>可提高运行效率<\/p>", "", ""], "r": "C", "e": "【定位】考察第7章，第7节，知识点2，变压器并联运行的条件，变压器并联运行的优点。\n【解析】变压器并联运行增多了变压器数量，因此，本题答案为C选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9516", "t": 1, "q": "两台变压器并联向负载供电时，短路阻抗标幺值（     ）的变压器先达到满载。", "a": ["<p>大<\/p>", "<p>小<\/p>", "<p>相同<\/p>", "<p>不确定<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/StV6dQxDXZXv1r7l8Q4DDreYpBgFTiEh0NGoLe5a.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9517", "t": 1, "q": "变压器并列条件之一，即各台变压器的原边电压与副边电压对应分别相等，但可允许误差值在（     ）以内。", "a": ["<p>5％<\/p>", "<p>-5％<\/p>", "<p>±5％<\/p>", "<p>±2.5％<\/p>", "", ""], "r": "C", "e": "【定位】察第7章，第7节，知识点3：变比不等的变压器并联运行。\n【解析】并联运行时需保证变压器之间无环流，所以一次、二次电压相等，连接组号相同，短路阻抗标幺值相等。实际上，变压器变比之间控制误差在0.5%，环流大小不得超过额定电流的5%，则电压允许误差也在5%以内，因此，本题答案为C选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9518", "t": 1, "q": "连接组号不相同的变压器进行并联运行（     ）。", "a": ["<p>绝对不允许<\/p>", "<p>可以，非常方便<\/p>", "<p>可以，但非常麻烦<\/p>", "<p>有些可以，有些不可以<\/p>", "", ""], "r": "A", "e": "【定位】考察第7章，第7节，知识点4，联结组号对变压器并联运行的关系，对变压器并联运行条件的认理解。\n【解析】并联运行时需保证变压器之间无环流，所以一次、二次电压相等，连接组号相同，短路阻抗标幺值相等。实际上，变压器变比之间控制误差在0.5%，环流大小不得超过额定电流的5%，短路阻抗标幺值不一定相等，其中短路阻抗标幺值小的变压器先满载。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9519", "t": 1, "q": "两台阻抗电压不相等变压器并列运行时，在负荷分配上（     ）。", "a": ["<p>阻抗电压大的变压器负荷小<\/p>", "<p>阻抗电压小的变压器负荷小<\/p>", "<p>负荷分配不受阻抗电压影响<\/p>", "<p>一样大<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/VhZ8Q5hdQEW2ZwgfGIClsX2ljAFayE56CPMsrE1s.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9520", "t": 1, "q": "两台容量不同、变比和连接组别相同的三相供电变压器并联运行，则（     ）。", "a": ["<p>变压器所分担的容量与其额定容量之比与其短路阻抗成正比<\/p>", "<p>变压器所分担的容量与其额定容量之比与其短路阻抗成反比<\/p>", "<p>变压器所分担的容量与其额定容量之比与其短路阻抗标幺值成正比<\/p>", "<p>变压器所分担的容量与其额定容量之比与其短路阻抗标幺值成反比<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/9MHmO7NgCB6YAVEOOZxF3JCPhPiyrmJlqXgoxsA2.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9521", "t": 2, "q": "变压器的功能有（     ）。", "a": ["<p>变电压<\/p>", "<p>变电流<\/p>", "<p>变功率<\/p>", "<p>变相位<\/p>", "", ""], "r": "ABD", "e": "【定位】考察第7章，第1节，知识点2，电机的主要类型，变压器的功能。\n【解析】变压器能实现变电压，变电流，变相位，变频率（加辅助结构），变阻抗。本题答案为ABD。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9522", "t": 2, "q": "电机铁芯损耗与（     ）有关。", "a": ["<p>铁芯材料<\/p>", "<p>输入电源频率<\/p>", "<p>输入电源大小<\/p>", "<p>负载性质<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/R9U5qTlRsZxWv7tfZnNTZnyqhUzGZRPlsNB20ZLo.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9523", "t": 2, "q": "以下（     ）会影响变压器的铁芯损耗。", "a": ["<p>电网频率<\/p>", "<p>电工钢片的厚度<\/p>", "<p>铁芯材质<\/p>", "<p>铁芯的体积<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/K8UJO6ZxkJYx32rfklw2xD3sXiKCtLOLNoz3LVCj.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9524", "t": 2, "q": "变压器的磁滞损耗与（     ）有关。", "a": ["<p>材料的性质<\/p>", "<p>电源频率<\/p>", "<p>磁通密度的幅值<\/p>", "<p>体积<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/jmpKo4b4eHr64G1bVDwa2PKTcEdhVS4P2e7W8JsO.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9525", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/sq6nwopiPHQlhf6oASEW6SuZywLFGAsPFL1NSl43.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2HRRjIfSbk8xnrGLLDYxV2mm9X5Rtj6szBJ7HF2X.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/qqeypOruyeqBE1lmv1cBqdxc9prHbTE1uF3gWdvf.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/iASXubyo5RRTMiAA8B28chWer4XJNSUH2Iw6UgvM.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/prc1KWITLjja37RziGjIX4sYEldZECeu5VxDi8ub.png\"><\/p>", "", ""], "r": "AD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/rqC8dfzeQbl6tTke5wYSsYOuFFyPgbYo7Uutq6O6.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9526", "t": 2, "q": "油浸式变压器油箱内充满油的目的是（     ）。", "a": ["<p>加强散热<\/p>", "<p>提高机械强度<\/p>", "<p>提高绝缘强度<\/p>", "<p>增加爬电距离<\/p>", "", ""], "r": "AC", "e": "【定位】考察第7章，第2节，知识点2，变压器的基本结构，邮箱内油的作用。\n【解析】变压器中绝缘油起绝缘与散热的作用。本题答案为AC。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9527", "t": 2, "q": "变压器型号可以得出变压器（     ）。", "a": ["<p>冷却方式<\/p>", "<p>结构<\/p>", "<p>额定电流<\/p>", "<p>额定电压<\/p>", "", ""], "r": "ABCD", "e": "【定位】考察第7章，第2节，知识点3，变压器铭牌。\n【解析】变压器型号，例如：SFP-520MVA/330kV，S表示相数，F表示冷却方式，P表示循环方式，520为额定容量，330为额定电压，由此可以得到额定电流，由相数、冷却方式与循环方式可得到变压器结构。本题答案为ABCD。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9528", "t": 2, "q": "下列属于变压器额定参数的是（     ）。", "a": ["<p>额定电压<\/p>", "<p>额定电流<\/p>", "<p>额定变比<\/p>", "<p>R、X或G、B<\/p>", "", ""], "r": "AB", "e": "【定位】考察第7章，第2节，知识点4，变压器的额定值，对变压器额定值的理解。\n【解析】变压器额定参数包含额定电压，额定电流，额定容量。因此本题答案为AB。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9529", "t": 2, "q": "变压器归算的目的是为了计算方便，归算前后应保持（     ）。", "a": ["<p>磁势不变，电势不变<\/p>", "<p>磁势不变，电磁功率不变<\/p>", "<p>电势不变，磁势不一定不变<\/p>", "<p>铜耗不变，磁势不变<\/p>", "", ""], "r": "BD", "e": "【定位】考察第7章，第4节，知识点3，绕组折算，变压器绕组折算的条件。\n【解析】变压器一、二次折算计算的条件为折算前后二次侧绕组的磁动势不变、有功不变、无功不变、损耗不变；本题答案为BD。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9530", "t": 2, "q": "根据变压器的空载实验可以得到（     ）。", "a": ["<p>漏电抗<\/p>", "<p>空载损耗<\/p>", "<p>励磁阻抗<\/p>", "<p>空载电流<\/p>", "", ""], "r": "BCD", "e": "【定位】考察第7章，第5节，知识点1，空载试验，对变压器空载试验的了解，主要考察对变压器空载损耗P0概念的理解。\n【解析】通过变压器空载实验可以求得空载损耗，空载电流，励磁阻抗；漏电抗是通过短路实验求得。本题答案BCD。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9531", "t": 2, "q": "变压器的负载为（     ）时，随着负载的增加，二次侧输出电压可能上升。", "a": ["<p>阻感性负载<\/p>", "<p>阻性负载<\/p>", "<p>容性负载<\/p>", "<p>阻容性负载<\/p>", "", ""], "r": "CD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/MBxdDuDBcYbmdFggDyWrVmlBpzvcDh7oZwgDraOB.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9532", "t": 2, "q": "以下（     ）负载可以使变压器电压变化率为正。", "a": ["<p>阻容性负载<\/p>", "<p>感性负载<\/p>", "<p>阻感负载<\/p>", "<p>阻性负载<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/kbI8TbkvcjV1tjWIKGYmUksiJnu69IBSfcmyRouM.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9533", "t": 2, "q": "变压器的电压调整率与以下（     ）因素有关。", "a": ["<p>负载的大小<\/p>", "<p>负载的性质<\/p>", "<p>短路阻抗<\/p>", "<p>漏阻抗<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/bk4XJsakMPkQEvGWxJM68RGXRHIWDW0YJp9fVhwD.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9534", "t": 2, "q": "与变压器效率有关的因素有（     ）。", "a": ["<p>负载大小<\/p>", "<p>负载系数<\/p>", "<p>空载损耗<\/p>", "<p>额定容量<\/p>", "", ""], "r": "ABCD", "e": "【定位】考察第7章，第5节，知识点4，变压器的运行特性，对变压器运行特性的效率参数的理解。\n【解析】关键词为变压器的运行效率：，由公式可知，变压器运行效率与负载大小，空载损耗，额定容量，功率因数等参数有关。本题答案为ABCD。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9535", "t": 2, "q": "在三相变压器的连接组别中，属于奇数号的变压器原副边连接方式是（     ）。", "a": ["<p>Y/Y<\/p>", "<p>Δ/Y<\/p>", "<p>Y / Δ<\/p>", "<p>Δ/Δ<\/p>", "", ""], "r": "BC", "e": "【定位】考察第7章，第6节，知识点2：联结组，三相变压器连接组号的定义。\n【解析】联接组号相同为偶数（如Yy，Dd），不同为奇数（如Yd，Dy）。本题答案为BC。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9536", "t": 2, "q": "以下（     ）符合Yy联结组号。", "a": ["<p>4<\/p>", "<p>6<\/p>", "<p>7<\/p>", "<p>10<\/p>", "", ""], "r": "ABD", "e": "【定位】考察第7章，第6节，知识点2：联结组，三相变压器连接组号的定义。\n【解析】联接组号相同为偶数（如Yy，Dd），不同为奇数（如Yd，Dy）。本题答案为ABD。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9537", "t": 2, "q": "变压器并列运行条件（     ）。", "a": ["<p>连接组号相同<\/p>", "<p>变比相同<\/p>", "<p>短路阻抗标幺值相同<\/p>", "<p>短路电阻要相等<\/p>", "", ""], "r": "ABC", "e": "【定位】考察第7章，第7节，知识点2，对变压器并联运行的条件。\n【解析】并联运行时需保证变压器之间无环流，所以一次、二次电压相等，连接组号相同，短路阻抗标幺值相等。因此本题答案为ABC。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9538", "t": 2, "q": "两变压器并列运行短路阻抗不同时，下列描述正确的是（     ）。", "a": ["<p>变压器短路阻抗大的分得的负荷多<\/p>", "<p>变压器短路阻抗大的分得的负荷少<\/p>", "<p>变压器短路阻抗小的分得的负荷多<\/p>", "<p>变压器短路阻抗小的分得的负荷少<\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Pj1VDuIJpSd8igSMajT8LSFU6iejKVeHYDGdAqLy.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9539", "t": 3, "q": "一个铁芯线圈的电阻为R，接到电压为U的直流电源上，如果磁阻增大，则线圈中的电流I不变，铁芯内的磁通增大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/pzX0CgXiF25DJGpx53jteyEuWUfMlEbg05Xw5dRp.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9540", "t": 3, "q": "同步电机正常工作时，内部主磁通和漏磁通的区别是：主磁通与漏磁通大小基本相等，漏磁通起能量传递的作用。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】考察第7章，第1节，知识点5：磁路与磁通\n电流周围存在磁场，磁场流经的路径称为磁路，如图1.4所示的磁路中，铁磁材料的导磁能力远大于空气，所以绝大部分磁通将在铁心内流通，在铁心内流通的磁通称为主磁通，主磁通流过的路径称为主磁路，铁心外非铁磁材料的磁导率不为零，因此少量磁通通过铁心外的路径闭合，这部分磁通称为漏磁通，漏磁通流过的路径叫漏磁路。主磁通和漏磁通存在区别，主磁通占总磁通99%以上，漏磁通占比很少；主磁通起能量传递和转换的作用，漏磁通起压降的作用。\n【解析】本题考察对主磁通与漏磁通的理解。概念题，内部主磁通大于漏磁通，主磁通起能量传递的作用。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9541", "t": 3, "q": "铁磁材料的磁导率小于非铁磁材料的磁导率。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】考察第7章，第1节，知识点4：磁场中常用物理量；知识点6：铁磁材料特性，铁磁材料磁导率的特点。\n【解析】铁磁材料（铁、钴、镍等）具有高导磁性，其磁导率远大于非铁磁材料（如空气、铜、铝），后者磁导率近似等于真空磁导率。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9542", "t": 3, "q": "变压器常用的铁心材料为软磁材料。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】考察第7章，第1节，知识点6：铁磁材料特性，硬铁磁材料和软铁磁材料。\n【解析】易导磁易消磁的材料为软磁材料（剩磁小），电机和变压器常用软磁材料，永磁体多用硬磁材料。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9543", "t": 3, "q": "磁滞损耗系数的大小，取决于材料的电阻率。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】考察第7章，第1节，知识点6：铁磁材料特性，磁滞和磁滞损耗。\n【解析】材料的磁滞损耗系数与材料的磁滞回线面积成正比，与电阻率无关。涡流损耗系数与电阻率成正比。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9544", "t": 3, "q": "当铁磁材料位于恒定直流电产生的磁场中，其铁耗为零。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】考察第7章，第1节，知识点6：铁磁材料特性，磁滞和磁滞损耗，涡流与涡流损耗，交流铁芯损耗。\n【解析】铁耗包括涡流损耗和磁滞损耗，在恒直流电产生的磁场中，无涡流和磁滞。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9545", "t": 3, "q": "铁磁材料的磁化曲线是非线性的。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】考察第7章，第1节，知识点6：铁磁材料特性，磁滞回线和磁化曲线。\n【解析】铁磁材料的磁化曲线总体来看是非线性的。非铁磁材料的磁化曲线的线性的。因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9546", "t": 3, "q": "若硅钢片的接缝增大，则其主磁路的磁阻增大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/s3HBi0EcQn5H8HIygu24KqqagaWWkkiIowUcRo2r.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9547", "t": 3, "q": "变压器的铁芯由铁芯柱和铁轭两部分组成。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】考察第7章，第2节，知识点2，变压器的基本结构。\n【解析】变压器铁芯用于构成闭合磁路，其结构由铁芯柱（套装绕组）和铁轭（连接铁芯柱、闭合磁路）两部分组成。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9548", "t": 3, "q": "电源电压和频率不变时，制成的变压器的主磁通基本为常数，因此负载和空载时感应电动势近似为常数。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/vSPC5x5QoSmd6nXneBXFUDwQMRpka0hQqYSvJCop.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9549", "t": 3, "q": "当变压器的一次绕组匝数和电源频率均不变时，其主磁通的大小主要取决于电源电压。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Kkv9inEgcaNvOr2tNvb8u837NkSBPtjX0hsHQfzW.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9550", "t": 3, "q": "变压器的变比可看作是额定线电压之比。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】考察第7章，第3节，知识点3，变压器变比。\n【解析】根据变压器变比的定义，变比为相电压之比。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9551", "t": 3, "q": "<p>变压器稳定运行时，电源电压和频率不变，负载增加时，励磁电抗X<sub>m<\/sub>增大。（ &nbsp;&nbsp;&nbsp;&nbsp;）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/homihy1vqea0qlQRz5uOGN1IVH5A5WP70e9FMYw4.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9552", "t": 3, "q": "变压器空载运行时，其主磁通由一次绕组和二次绕组的磁动势共同作用产生。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】考察第7章，第4节，知识点1，磁动势平衡。\n【解析】变压器空载时二次侧绕组无磁动势，主磁通只由一次绕组产生。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9553", "t": 3, "q": "单相变压器把一次绕组折算到二次绕组，其折算后的电流值是实际值的k倍。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】考察第7章，第4节，知识点3，绕组折算，变压器电流折算公式。 【解析】变压器一、二次折算计算的条件为折算前后绕组的磁动势不变、有功不变、无功不变、损耗不变;由折算条件，二次绕组向一次侧折算时，折算后的电流等于折算前的电流除以变压器变比k。反过来，一次侧绕组向二次侧折算时，折算后的电流等于折算前的电流乘以变压器变比k。因此，本题答案为A选项。<\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9554", "t": 3, "q": "变压器的无功功率损耗中的励磁损耗与变压器负荷大小有关。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p>【定位】考察第7章，第4节，知识点4，等效电路，短路损耗也是负载损耗，短路损耗是有功损耗，励磁损耗是无功损耗。<\/p>\n<p>【解析】由变压器简化等效电路可知，励磁损耗由X<sub>m<\/sub>产生，X<sub>m<\/sub>只与主磁通有关，与负载无关。因此，本题答案为B选项。<\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9555", "t": 3, "q": "变压器的损耗中励磁损耗与变压器负荷大小成正比。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】考察第7章，第4节，知识点4，等效电路，对励磁损耗的理解。\n【解析】励磁损耗中的铁耗与负荷无关。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9556", "t": 3, "q": "变压器的短路电压可通过变压器的稳态短路试验求得。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】考察第7章，第5节，知识点2，短路试验，对变压器短路试验的了解，对变压器短路损耗P<sub>k<\/sub>概念的理解，短路损耗也是负载损耗。<\/p>\n<p>【解析】短路实验可测得短路阻抗，短路电压等参数。因此，本题答案为A选项。<\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9557", "t": 3, "q": "在变压器的参数中，采用标幺值进行计算的好处是任何物理量都具有相同的标幺值，简化计算。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】考察第7章，第5节，知识点3，标幺值，标幺值的优点。\n【解析】标幺值进行计算的好处的好处有:能更明确表示变压器运行状态，等效电路各参数无需再折算，某些物理量都具有相同的标幺值，简化计算。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9558", "t": 3, "q": "变压器的负载为阻容性负载时，随着负载的增加，二次侧输出电压可能降低。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/gzcdT8wNDRjD0Rk6bGSPGPLx2Q70zTvq0sOmo4io.png\"><\/p>", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9559", "t": 3, "q": "变压器带感性负荷时电压最高。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】考察第7章，第5节，知识点4，变压器的运行特性，对电压变化率（电压调整率）概念以及对变压器带负载运行的理解。\n【解析】变压器带容性负载时电压变化率<=0，电压最高，因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9560", "t": 3, "q": "在三相组式变压器中，主磁通的波形近似为正弦波，所以组式变压器可以采用Yy联接方式。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】考察第7章，第6节，知识点2：联结组，三相组式变压器连接组与励磁电流，主磁通，二次相电压，二次线电流的关系。\n【解析】Yy组式变压器存在严重的谐波干扰，一般电力系统中不能采用，因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9561", "t": 3, "q": "联接组号不同的变压器不能并联运行，是因为电压变化率太大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】考察第7章，第7节，知识点2，变压器并联运行的条件，联结组号对变压器并联运行的影响。\n【解析】联接组号不同会导致变压器之间环流过大，因此变压器并联运行时联接组号必须相同。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9562", "t": 3, "q": "一台Yd11和一台Dy11的三相变压器，变比相等，短路阻抗标幺值相等，能并联运行。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】考察第7章，第7节，知识点2，变压器并联运行的条件，知识点3：变比不等的变压器并联运行。\n【解析】并联运行时需保证变压器之间无环流，所以一次、二次电压相等，连接组号相同，短路阻抗标幺值相等。Yd和Dy虽然联接组不同，但连接组号相同，仍然满足并联运行的条件，因此，本题答案为A选项。", "l3": "电工技术基础", "l4": "第7章-考纲删除", "ap": [false, false, false, false, false, false]}]}, {"k": "电工技术基础||第8章-考纲删除", "n": "电工技术基础 / 第8章-考纲删除", "qs": [{"id": "9563", "t": 1, "q": "三相异步电动机的转子绕组，工作时绕线式绕组是（     ），鼠笼式绕组是（     ）。", "a": ["<p>开路的／闭合的<\/p>", "<p>闭合的／闭合的<\/p>", "<p>开路的／开路的<\/p>", "<p>闭合的／开路的<\/p>", "", ""], "r": "B", "e": "【定位】第8章，第1节，知识点1：异步电机的基本类型和基本结构\n异步电机按转子结构的不同分为笼型和绕线式，笼型转子绕组自行闭合，转子极对数自动随定子极对数改变而改变；绕线式转子绕组与定子绕组相似，一般接成星形。\n【解析】本题考察异步电动机的结构与运行原理。概念题，异步电动机工作时转子绕组是闭合的。因此，本题答案为B选项。", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9564", "t": 1, "q": "三相异步电动机气隙增大，其他条件不变，则空载电流（     ）。 ", "a": ["<p>增大<\/p>", "<p>减小<\/p>", "<p>不变<\/p>", "<p>不能确定 <\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/NNqfptrFOnESLJ9r3ViHZJXJgzlOHzpknH9NcQJo.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9565", "t": 1, "q": "<p>三相电动机额定电压<em>U<\/em><sub>N<\/sub>是指（ &nbsp;&nbsp;&nbsp;&nbsp;）。<\/p>", "a": ["<p>相电压<\/p>", "<p>线电压<\/p>", "<p>相电压或线电压<\/p>", "<p>相电压标幺值<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/MVSnjTqVKTpup9j9olDFZ8IWDhJRp146t6QhkHJ1.png\"><\/p>", "l3": "电工技术基础", "l4": "第8章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "9566", "t": 1, "q": "三相异步电动机额定功率可表示为（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260728/oSW3ZF5FwdemIbAMKLmfU6VrzRpFYL0eFc6PhygS.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/W0BHb1CXNCT1OoXfy1bPQ8MCsJxZGnu5zhKPaIlI.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/3OMFom6rxJ1QuTMMm4h1bRz5Ow3B5ctyfG1AlwsF.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/SGMqnFLmkjYfOYBkUKD4wRGh34wHb6F096hEMota.png\"><\/p>", "", ""], "r": "A", "e": "<p><img src=\"https:/
