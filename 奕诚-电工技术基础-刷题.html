"https://dati.gwzpks.com/uploads/20260717/XAxqnsgNyeKWk7FhDXyuzbXMw817a29QSDsf1uPa.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/P9PVoDyMKbR1THNlYmbWr94xZujBKublZDjjk7Dl.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/aQaoEmGKN2ncFWj8kaauqWbfwIWsJlmlwoJwyF1k.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/o9bnu1ZeHPcXyBEBMbauYCOHzG5zt3URgcoIi2un.png\"><\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/NJkaOn6WhQqcQDK6AYSVP5dXA8NYgCqVNE37C1cC.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8003", "t": 2, "q": "下列关于旋转因子的描述中，错误的是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/odjst7QwpBZcblDMLOG17j22YIh5Da5v1W6jkxjf.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/3eXyC98dcbkaEeKJTscQB5KIOjbdXIXnCXxT0hHX.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/HPkthFESUSoPuDAOkLLIBeWhjvcq95rV6ahIWKAi.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/18IjnxaJQoCk2ZD1nWKDVb5S8bwsAFPXy1yTaqMY.png\"><\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Ekp3xGFzDEYvn2u82kqiBShoB03Vt5L0tA1zhzFS.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8004", "t": 2, "q": "正弦量的三要素为（     ）。", "a": ["<p>有效值<\/p>", "<p>角频率<\/p>", "<p>初相位<\/p>", "<p>振幅<\/p>", "", ""], "r": "BCD", "e": "【定位】第3章，3.2，知识点1：正弦量\n【解析】一般把角频率、最大值、初相位称为正弦量的三要素，它们可以分别代表正弦量变化的快慢、大小和进程特征。因此答案选BCD。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8005", "t": 2, "q": "下列说法正确的是（     ）。", "a": ["<p>两个同频率正弦量之间的相位之差称为相位差<\/p>", "<p>不同频率的正弦量之间不存在相位差的概念<\/p>", "<p>正弦量的三要素是指它的最大值、角频率和初相位<\/p>", "<p>实际应用的交流电表指示值和我们实验的交流测量值，都是交流电的有效值<\/p>", "", ""], "r": "ABCD", "e": "【定位】第3章，3.2，知识点2：关于正弦量的说明 \n【解析】根据知识点回顾，当两个正弦量同频率时才能比较相位差，不同频率，一个快一个慢，比较相位差没有意义，一般把角频率、最大值、初相位称为正弦量的三要素，它们可以分别代表正弦量变化的快慢、大小和进程特征，交流电表的指示值和测量值都是交流电的有效值。因此答案选ABCD。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8006", "t": 2, "q": "关于相量图，下列说法正确的是（     ）。", "a": ["<p>相量图直观地反映了各正弦量之间的数量关系和相位关系<\/p>", "<p>相量图中各相量与正向实轴之间的夹角对应正弦量的初相<\/p>", "<p>相量图中各相量与正向虚轴之间的夹角对应正弦量的初相<\/p>", "<p>相量图中各相量的线段长度对应了正弦量的有效值或最大值<\/p>", "", ""], "r": "ABD", "e": "【定位】第3章，3.2，知识点4：相量和相量图\n【解析】相量图：\n相量用有向线段表示在复平面上就构成相量图，只有同频率的正弦量才能画在同一相量图上。相量图的主要作用：①在相量图上能清楚地看出电路中各个相量的初相位，以及各个相量间的相互关系。②几个同频率正弦量的加减，可以借助于相量图用图解法进行。\n在相量图上能清楚地看出电路中各个相量的初相位，以及各个相量间的相互关系。所以A相量图直观地反映了各正弦量之间的数量关系和相位关系，是对的，初相位是相量与正向实轴的夹角，所以B是对的，相量包括有效值相量和最大值相量，相量图可以是有效值相量图，也可以是最大值相量图，所以相量图中各相量的线段长度对应了正弦量的有效值或最大值，D是对的。因此答案选ABD。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8007", "t": 2, "q": "对于电阻元件的正弦交流电路中，伏安关系表示正确的是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/FCwYVkYw0TEWe8cFR9bBwrK21qk54785Et6I9ZCi.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/lV5i1OVIcPfFsbO8DHd3HkhInuqjpne7YWwK35iP.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/aA7BKsb75QnMMJZqhX14owwuXKXHfHIqKG4T05w4.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/7CFvWo8zAeiC6EAor9nzLw9HVwb4hH3LfuWa84mG.png\"><\/p>", "", ""], "r": "ABC", "e": "【定位】第3章，3.3，知识点2：电阻元件伏安关系的相量形式 \n【解析】由于电阻上电压电流同相位，因此电阻上电压电流的瞬时值形式、有效值形式、相量形式的欧姆定律都成立，A选项电压电流小写，表示电压电流的瞬时值，B选项电压电流都是大写，表示的是电压电流有效值，C选项电压电流大写上面加个点，表示电压电流的相量形式，D选项中既有小写，还有大写，这两种形式不能放在一个等式中，所以是错的。因此答案选ABC。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8008", "t": 2, "q": "关联参考方向下，若电路中只有纯电感，则电压和电流的关系为（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/tPHy1vl1vE6eqqtme7DLguGgy0FlSBcpbRkGhw5T.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/otIO6bP0jJwfxer5DjshkEKBiN2vtZfIxweWJDd8.png\"><\/p>", "<p>电压与电流的有效值之比为感抗值<\/p>", "<p>感抗与频率成正比<\/p>", "", ""], "r": "BCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/C0eGt3dvmmaJyn4xtBOuaqNz4WSKNQS4urEE8VN2.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8009", "t": 2, "q": "下列关于感抗的说法正确的是（     ）。", "a": ["<p>感抗与频率成反比<\/p>", "<p>电感元件对高频电流阻力较大<\/p>", "<p>频率无穷大时，电感相当于开路<\/p>", "<p>电感元件对直流无阻力<\/p>", "", ""], "r": "BCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/HadOMWDknvkyG2y5oCuGRAwksIBsr49dE7Yendyi.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8010", "t": 2, "q": "若电路中只有纯电容，则电压和电流的关系为（     ）。", "a": ["<p>电流相位超前电压90°&nbsp;&nbsp;<\/p>", "<p>电流相位滞后电压90°<\/p>", "<p>电压与电流的有效值之比为容抗值<\/p>", "<p>容抗与频率成正比<\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/yNheehNs6wcyhtAu98DnPVfSucbdq0olGZcmfxX2.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8011", "t": 2, "q": "<p>下列阻抗角属于容性阻抗角的是（ ）。<\/p>", "a": ["<p>45°<\/p>", "<p>-45°<\/p>", "<p>60°<\/p>", "<p>-60°<\/p>", "", ""], "r": "BD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/npvDNy65ZmqysERajCTL4i91n2UIBMK8ADmFztea.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8012", "t": 2, "q": "下列阻抗角属于感性阻抗角的是（     ）。", "a": ["<p>45°<\/p>", "<p>-45°<\/p>", "<p>60°<\/p>", "<p>-60°<\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/FkA0DWFhKJEZ2IxxvfKM0cdtBqCPPxtyMK4Sai7U.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8013", "t": 2, "q": "下面电阻和电抗的说法正确的是（     ）。", "a": ["<p>电阻在阻碍电流时伴随着消耗电能<\/p>", "<p>电抗在阻碍电流时不消耗电能<\/p>", "<p>电阻和电抗的单位相同<\/p>", "<p>电阻和电抗的单位不同<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/VJI2Ke6cZNoehp5dBjF3bHVbuQ1q1lecD8rwlNp5.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8014", "t": 2, "q": "纯电容电路，下面说法正确的是（     ）。", "a": ["<p>只消耗无功功率<\/p>", "<p>只产生无功功率<\/p>", "<p>电压相位超前电流相位90°<\/p>", "<p>不消耗有功功率<\/p>", "", ""], "r": "BD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/dFxeKjEmRIOuvokoYRXR6Q64tg1PUmdeWOVWpqX3.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8015", "t": 2, "q": "<p>若某RL串联电路在某频率下的等效复阻抗为(1+j2)Ω，且其消耗的有功功率为9W，则该串联电路的电流为（ &nbsp;&nbsp;&nbsp;&nbsp;）A，该电路吸收的无功功率为（ &nbsp;&nbsp;&nbsp;&nbsp;）var。<\/p>", "a": ["<p>3<\/p>", "<p>6<\/p>", "<p>15<\/p>", "<p>18<\/p>", "", ""], "r": "AD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/zKNcYZfyxygJnvTS3964X1IvBvrXuLRKwNtQDxkq.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8016", "t": 2, "q": "正弦交流电路的功率因数，下列说法错误的是（     ）。", "a": ["<p>功率因数=有功功率/复功率<\/p>", "<p>功率因数=有功功率/无功功率<\/p>", "<p>功率因数=有功功率/视在功率<\/p>", "<p>功率因数=视在功率/有功功率<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/MHLPfYdOou1HcDp2nsCQ8xgPXGqwXduwwGUMrAsL.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8017", "t": 2, "q": "正弦稳态电路中，共轭匹配的条件可以是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/YdyHdssP3Ur3SLWJ0QtPIfNlAxIbFKi86gNG8MRP.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/F5iytJHPZimqDjuBALTOxef8eEmVSt38bSnG5CLe.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260907/1BinbJNshLH1WCS13srgKxU0lsqjFhOxmLvcCSwu.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/6QdXKRHQ5Ncc1fnlJVlqJNXewMB7OZHc0ntWlSks.png\"><\/p>", "", ""], "r": "BD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/HCCRJTKtqPXjlDjSuOSxs5fkBGpb6WNnn2y0v3Qt.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8018", "t": 2, "q": "RLC串联谐振电路的特点（     ）。", "a": ["<p>谐振时电压电流同相位<\/p>", "<p>LC上的电压大小相等，相位相反<\/p>", "<p>LC部分串联总电压为0<\/p>", "<p>谐振时可能会出现过电压<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/JVnP7kW7qi8o84OnfsrJedQpyLAFO6Yn1NBSCjJ1.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8019", "t": 2, "q": "RLC电路发生串联谐振时，关于电路的功率因数，说法错误的是（     ）。", "a": ["<p>小于1，感性的<\/p>", "<p>小于1，容性的<\/p>", "<p>等于1<\/p>", "<p>无法确定<\/p>", "", ""], "r": "ABD", "e": "【定位】第3章，3.7节，知识点1：串联谐振电路\n【解析】根据串联谐振的定义，串联电路中端口电压与端口电流同相位的现象，此时复阻抗虚部为0，φ=0，是阻性阻抗，cos0度=1，所以发生串联谐振时，功率因数=1，说法错误的是ABD。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8020", "t": 2, "q": "RLC并联谐振电路的特点（     ）。", "a": ["<p>输入阻抗最大<\/p>", "<p>电流一定时，端电压很高<\/p>", "<p>谐振时可能出现过电流<\/p>", "<p>谐振时电流电压同相位<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/XImxv5PzBDndabWrNGI5tb8WDtQJ0jhyK7W53Cwe.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8021", "t": 2, "q": "在电路发生并联谐振时，电源端电压和电流的关系错误的是（     ）。", "a": ["<p>电流相位超前电压<\/p>", "<p>电压相位超前电流<\/p>", "<p>同相位<\/p>", "<p>反相位<\/p>", "", ""], "r": "ABD", "e": "【定位】第3章，3.7节，知识点2：并联谐振电路\n【解析】此题考查电路发生谐振时电压和电流的相位关系，根据知识点回顾，并联谐振的定义：并联电路中端口电压与电流同相位的现象，此时复导纳虚部为0。电源端口处的电压和电流都是同相位的，因此答案选ABD", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8022", "t": 2, "q": "两个互感线圈发生耦合时，其互感系数是由（     ）决定的。", "a": ["<p>线圈的形状、匝数<\/p>", "<p>周围的媒介<\/p>", "<p>线圈的相互位置<\/p>", "<p>电流的参考方向<\/p>", "", ""], "r": "ABC", "e": "【定位】第3章，3.8节，知识点1：耦合电感的基本概念\n【解析】耦合元件的互感系数与线圈的形状、匝数，周围的媒介，线圈的相互位置有关，与线圈的电流无关，线圈中的电流与互感电压有关。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8023", "t": 2, "q": "互感M本身是一个非耗能的储能参数，它兼有储能元件（     ）的特性。", "a": ["<p>电感<\/p>", "<p>电容<\/p>", "<p>电阻<\/p>", "<p>磁通链<\/p>", "", ""], "r": "AB", "e": "【定位】第3章，3.8节，知识点1：耦合电感的基本概念\n【解析】互感是由一个线圈中的电流发生变化而使其它线圈产生感应电动势的现象，它兼有储能元件电感、电容的特性。当M同向耦合时，储能特性与电感相同，耦合使磁能增加；当M反向耦合时，储能特性与电容相同，耦合使磁能减少，因此选项A和B正确。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8024", "t": 2, "q": "耦合线圈的同名端是由其线圈的（     ）决定的。", "a": ["<p>实际绕向<\/p>", "<p>相对位置<\/p>", "<p>电流流向<\/p>", "<p>电压大小<\/p>", "", ""], "r": "AB", "e": "<p>【定位】第3章，3.8节，知识点1：耦合电感的基本概念<\/p>\n<p>【解析】考察同名端的定义。根据楞次定律和右手准则可知，线圈的物理缠绕方向与感应电压密切相关，但是在电路图中画出线圈的缠绕结构是很不方便的，因此引入了同名端。当两个电流分别从两个端点流入，与每个线圈相连的自感磁通和另一线圈的电流产生的互感磁通方向相同，则这两个端点是同名端。影响同名端的因素是两线圈的绕向和相对位置。因此选项AB正确。电流的流向影响互感电压的参考极性，但不影响同名端，因此C不可选。电压的大小与同名端无关，选项D不可选。<\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8025", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/TNSNjWe41HwujbLxGUFdGmOwf50DaocgiHRyKL6X.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/97CvGHRy0dJ6MxfVHuUQND6WseEHKUMeUULUViMO.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ZpACRFEp0Kb6OSJWpa8B612sClcNPZCFD7aEEy8h.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/qXsmwCV9q8YxwUi1BEHbanjtaZ5JrS4k09HMnaSc.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/IHKkhfDg7pNHE47gqB3qsV0e34cE3qBGJ8igEDYY.png\"><\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/uNUGaMNMmtFGW0EDEfmIEt0ZHiabdlz8tr1vYT9U.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8026", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/rd7s1lTyMCXJfCuPPKiakEGrOnAo1DgqWVYgvCNo.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/GXrM2VibaDHu0a4ej7WQoBqblZ2SepqD6LddmJZl.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/6fMy2HLEPmQfIZ7ryRAFWbRLCjK4U3CvGlC7QOEW.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/mo3UfiJyBcoizTEa1lIB9lmQFKmJdU74V78lzWtP.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/isMzbIBKcsXQwrwkYHjKT6c1OFUbRIX3ciK7BTfP.png\"><\/p>", "", ""], "r": "AB", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/RrOVfwGnv0ywUlsT2rwhfLu4hKWSkcP3H6nnANUh.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8027", "t": 2, "q": "下列关于空心变压器的描述正确的是（     ）。", "a": ["<p>空心变压器的芯子是由非铁磁材料制成<\/p>", "<p>分为原边回路和副边回路<\/p>", "<p>分为初级回路和次级回路<\/p>", "<p>一个线圈作为输出，一个线圈作为输入<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/16CVylqG4wtf9PmTqERKevm5uh4b1CX0rAjXl1us.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8028", "t": 2, "q": "关于理想变压器，下列说法正确的是（     ）。", "a": ["<p>理想变压器是一种全耦合的变压器<\/p>", "<p>理想变压器跟电感一样，是有记忆的元件<\/p>", "<p>理想变压器是一种不储能、不耗能的元件<\/p>", "<p>理想变压器是一种非动态、四端元件<\/p>", "", ""], "r": "ACD", "e": "【定位】第3章，3.9节，知识点2：理想变压器\n【解析】本题是对理想变压器的性质的考核。\n根据理想变压器的定义可知：理想变压器是一次绕组与二次绕组具有无穷大自感的、完全耦合的、无损变压器，选项A正确。理想变压器与电容电感不同，电容和电感是记忆元件，但理想变压器没有记忆特性，是无记忆元件，选项B错。理想变压器的“理想”二字反映了无电能损耗，且变压器并不是储能元件，因此选项C正确。与电感不同，理想变压器不是动态元件，且理想变压器是四端元件或者说二端口元件，因此选项D正确。本题选ACD。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8029", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/4Wsrow8CBWD5l8he7eX8TvAGBCcqj2FkwwqEp9jK.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/TJQ8sddoJqrKGtyRjbEwnq7Y6LU29I9JuaV7W9Rd.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8030", "t": 3, "q": "正弦交流电路中电压、电流以及电动势等按照正弦或余弦规律变化，统称为正弦量。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ZchYxG6pvgpryq8ISvFDXSzvC3amdjn2uiHQLd2Z.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8031", "t": 3, "q": "<p>正弦交流电压的最大值与有效值之间的关系为U<sub>m<\/sub>=1.414U。（ &nbsp;&nbsp;&nbsp;&nbsp;）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/9nJbHrRjvd85fUtj1PegzVBItUKRYld211cUrnSh.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8032", "t": 3, "q": "实验室中的交流电压表和电流表，其读数值是交流电的最大值。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第3章，3.2，知识点3：正弦量的有效值 \n【解析】工程上常将周期电流或电压在一个周期内产生的平均效应换算为等效的直流量，以衡量和比较周期电流或电压的效应，这一等效的直流量就称为周期量的有效值，也称为均方根值，实验室中的交流电压表和电流表，其读数值是交流电的有效值，因此答案选B。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8033", "t": 3, "q": "关联参考方向下，电感元件上的电压、电流相位存在正交关系，且电压超前电流。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/89KiumxbXiTLogrPjodVQXqSdgOIrbWIAVRPpLWC.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8034", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/MPOygtrhY7Oc4Vq7nB1Xl33vCiWlE7FmJBfFgwL3.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/jq7CKib8B72wJRg56j3zb6CZasif5SSgDEynomtY.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8035", "t": 3, "q": "在RLC串联电路中，若电路阻抗的虚部大于零，则电路呈容性。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/b9oAlMJsGe4u5VDoVrjDMTtpTb946y0RFHYSQYjp.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8036", "t": 3, "q": "几个复阻抗相加时，它们的和增大；几个复阻抗相减时，其差减小。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/8Kbqd4X0T2bSdUUOQXgmTDsexggIao7BeDPBRs8Q.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8037", "t": 3, "q": "已知复阻抗Z=(10+j10)Ω，则复导纳Y=(0.1+j0.1)S。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/lSsHQcENsvOukvjMhPNTKcwFBz45CoX3OSBFBbuF.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8038", "t": 3, "q": "电感、电容的瞬时功率是正负对称交变的，一周期内吸收的电能与放出的电能相等。它们是不耗能的，是储能的无源元件。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第3章，3.5节，知识点1：瞬时功率 【解析】电感、电容的瞬时功率是正负对称交变的，一周期内吸收的电能与放出的电能相等，‌这一现象可以通过无功功率的概念来解释。 在交流电路中，有功功率代表了负载在一个周期内消耗电能的情况，而无功功率代表了电源与负载间（单相电路）或各相之间（三相电路）在一个周期内的能量交换情况。电感、电容作为储能元件，它们与电源之间进行能量交换，这种交换表现为瞬时功率的正负对称交变，即在一周期内，电感、电容既从电源吸收电能，同时也向电源释放电能，导致其平均功率为零。这是因为电感在一个周期内的吸收的能量与释放的能量相等，从而使得电感元件不消耗能量也不产生能量，而是作为一个储能元件在电源与负载之间进行能量的交换。<\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8039", "t": 3, "q": "工程上认为，正弦稳态电路中，电感吸收无功功率，电容发出无功功率。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/ekY08Z8uTtQpXyvVtMXN0Kl5lqZzsnHEYBJLuTUc.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8040", "t": 3, "q": "电感、电容相串联的正弦交流电路，消耗的有功功率为0。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/vn8mccSYbBtiaOSBuT4kjZrqtEeCN7YNlL68AyVs.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8041", "t": 3, "q": "正弦电路的复功率是电压相量和电流相量的乘积，其实部是电路的有功功率，虚部是电路的无功功率。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/xcRcJGMApbULZOISvyTk2nIcgICztwZg3VfjPbMC.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8042", "t": 3, "q": "一只日光灯的功率因数为0.5，在其两端并联一个电阻时，总的功率因数大于0.5。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/OWXcYaX40YcnsVLc1iJ36VJi41YePSyGYpZswfV7.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8043", "t": 3, "q": "提高功率因数，可使负载中的电流减小，因此电源利用率提高。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/C0YGOh3wipbaNlBEGsXeKWDqNEWoHMVJMEzEGS7z.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8044", "t": 3, "q": "理论上，正弦稳态RC电路中，并联电感，也可以提供整个电路的功率因数。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第3章，3.5节，知识点7：功率因数\n【解析】这道题是说RC电路中，那可以用感性无功功率去补偿一部分容性无功功率，以提高输电线路的功率因数，其原理和方法与在感性电路并联电容提高功率因数相似，所以描述正确。正确选项为A。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8045", "t": 3, "q": "正弦稳态电路中，当负载阻抗等于戴维宁等效阻抗的共轭复数时，称负载与电源是匹配的。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/SVJ2lKWPe0BOYPIRIsWGh6fGJqqP37Q5MyzfPShL.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8046", "t": 3, "q": "电力系统中的电路一般不工作在最佳匹配状态，以避免造成能源的过度浪费。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第3章，3.5节，知识点8：最大功率传输定理\n【解析】在最佳匹配状态下，负载的平均功率最大，但效率不是最高。因此，在电力系统中的电路，一般不工作在最佳匹配状态，以免造成能源浪费；而在通信、控制系统等弱电电路中，通常要求信号功率尽可能大，牺牲电源传输效率换取最大的传输功率。本题题干所给结论正确，选A。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8047", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/yJczw043c8buNEc68BWSpiXoXkNE5nZjZylmMtyr.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/F7tmZeWvcUefIJdSPdzBT5ssaWHRHix8a6sumKzv.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8048", "t": 3, "q": "正弦交流电路中，负载获得最大功率的条件是实部相等，虚部互为相反数。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/jtPobSATwfuGclZAlnrkgl9Pdr0CP0ps9rvw5fB1.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8049", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/CpDAAjm4cwEQanzS3oncyCUmEyblvMBAYzX3Flgk.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/WFzLNb7amixLa6E7q6FbFpzK887gcIsA8qzh09pE.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8050", "t": 3, "q": "外接电压源的RLC串联电路发生谐振，电阻阻值增大时，电容电压和电感电压有效值减小。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/IsKfos3pKSAEr8ueMkk22NG0OHnfKkXnsJXz6RTa.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8051", "t": 3, "q": "当一个线圈的电流发生变化时，使线圈本身发生电磁感应现象称为自感。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第3章，3.8节，知识点1：耦合电感的基本概念  \n【解析】此题考察的是自感的定义。当线圈中的电流大小发生变化，使自身周围的磁通量的大小发生改变而产生的电压叫做自感电压，这种现象就称为自感现象。题干所给的描述正确，选A。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8052", "t": 3, "q": "互感M兼有储能元件电感和电容的特性，当M起反向耦合作用时，它的储能特性与电感相同。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/nqE5K5Sheud0b3zpjiJqGaFY7Wdd60mOQQ05UtWz.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8053", "t": 3, "q": "当流过一个线圈中的电流发生变化时，在相邻线圈中所产生的电磁感应现象称为互感现象。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第3章，3.8节，知识点1：耦合电感的基本概念\n【解析】此题考察的是互感的定义。由于线圈本身的电流变化而在临近线圈中引起的电磁感应称为互感。与定义完全符合，题干描述正确，选A。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8054", "t": 3, "q": "将两个互感线圈的异名端串联接在一起，磁场增强，等效电感增大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第3章，3.8节，知识点2：去耦等效电路\n【解析】从题干可知，“将两个互感线圈的异名端串联接在一起”，考核的是耦合电感的串联，异名端串联，则表示一个线圈的同名端与另一个线圈的非同名端相接，这是顺向串联的接法，判断出这一点是非常关键的。\n对于顺向串联，两线圈的磁场增强，等效电感增大，因此本题的题干所给的结论是正确的，选A。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8055", "t": 3, "q": "耦合线圈并联去耦合时，与电压和电流的参考方向有关。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第3章，3.8节，知识点2：去耦等效电路\n【解析】并联去耦合时，首先需要观察两个线圈的同名端是否在同一个结点，若在同一结点则是同侧并联去耦合，否则是异侧并联去耦合。与电压电流的参考方向无关。因此，并联去耦时的关键，是看两个同名端与联结点的关系，与电压和电流的参考方向无关，题干描述错误，选B。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8056", "t": 3, "q": "空心变压器指耦合线圈的芯子为非铁磁性材料。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第3章，3.9节，知识点1：空心变压器\n【解析】此题考察的是空心变压器的定义。变压器由两个具有互感的线圈构成，一个线圈接向电源，另一线圈接向负载。变压器是通过互感来实现从一个电路向另一个电路传输能量或信号的器件。当变压器线圈的芯子为非铁磁材料时，称空心变压器。对照定义与题干可知：本题的题干描述“不含铁芯或者磁芯”与定义中的“芯子为非铁磁材料”意思相同，因此题干描述是正确的，选A。", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8057", "t": 3, "q": "理想变压器可以变电流、电压、阻抗和频率。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Sd642tOxSFSfSoLLVtVfbHyV9L1HWDTVSE5R9xHP.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8058", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Zg63mqg9MKPeFig62Y8C7ddMfkNagTiuieE6WqxR.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/4pjWiKKnKDoZqvXrnBTEppGZcjZWboIEwLu0DqOq.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8059", "t": 3, "q": "理想变压器只有变比n这一个参数，不存在自感、互感等参数。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/oh4qKUzHRTs51ukYSVWfPJ540MC80r9RRIhf69cI.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8060", "t": 3, "q": "理想变压器的负载阻抗增加，则原边电流增加。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/9mJBFBJLF2pEq6T6cNkV7jXwGE4RHYUwgzeByhDm.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "8061", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/3m51bUgB8wLmK3iEY3GSQC2YT1XD8wVvUaa682sj.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Nfvf8T8S2Tbj6XiKpe9ORsEInvCzArSzEAX32AqT.png\"><\/p>", "l3": "电工技术基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}]}, {"k": "电工技术基础||第4章", "n": "电工技术基础 / 第4章", "qs": [{"id": "8553", "t": 1, "q": "三相对称电压是指三个大小相等，频率相同，相位相差（     ）的三个正弦电压。", "a": ["<p>120度<\/p>", "<p>90度<\/p>", "<p>60度<\/p>", "<p>180度<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/83RYooskbRVdqaixuUlSHKp7l4Nr4RXKLx3YmyTk.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8554", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/cwmzV54isg8N0VOUFkgDdO5l7DJ9GBkVCKoHRf2i.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/w9rWSTYuSMEIVU8CsLxP22sjLEBypVlT5d1ByHdm.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/OTOi4TzHz3qsLs0X8fLHAlXb1iZt5fBMWkHysm3A.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/WW3QgbBgdIHPj4aqijtb7eVYsN476trr0hYOR0UJ.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/C2WPg5exfilAVpMWpbxWXpO44t6Cwgf0dX2KzTd2.png\"><\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/79hQ9Cf67 "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Q7HTN45yd6MWXQIXaakprSw9gl6wQ6smNBWWyQoi.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/zvmCrXXP4AIDnfhIfAL43goqB9dYhglDrx9jUfSR.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/fdiWjCMEkcfxczwkiRaIffkydS5L1hp5DhN6WfSU.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/65EeGjX5yrwZN1PN4AO04HCvr0fkpCoKgBxKghcm.png\"><\/p>", "", ""], "r": "A", "e": "【定位】第4章，4.1节，知识点3：三相负载\n【解析】对称负载的性质:\n1.对称三相负载：三相负载阻抗模相等，阻抗角相同。用代数形式时描述为“三相负载的实部相同，虚部相同”\n2.三相负载连接方式：Y形或△形。\n本题是考查三相对称负载的特性，即“三相负载阻抗模相等，阻抗角相同”，亦即各相负载大小相等，相位相同，故而本题选A。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8563", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/gE5XIsQSKJhuM2qsgk9fgBgmFcF9YILokTszu7Kz.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Y6wpcE45Lqk098I3aTMVXCDTa6v9rNDoterJ2VUc.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/k3wJustBdFZk9xEmdAPgiHWv7mBYjTcw811csjso.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/vVmvBCIQ68FAdIq2YWCNXOCPXavtUh69FE2p1K77.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/9Nqlo9c1uJ2DkQV0BoxWYeVyP2J2g7wdAL75naoi.png\"><\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2GtdBGBVsVsQI5lKAJeldQuZo4pqMPaA1xynDhK4.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8564", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/LUjkvoianOt104gtq2BwiPa7ww1uORbv4KD94vxW.png\"><\/p>", "a": ["<p>0<\/p>", "<p>1<\/p>", "<p>−1<\/p>", "<p>不能确定<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260728/e2W5f2csS2ojCbq7Lf8uh0g7ueYNrR5Q5uc5DnfF.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8565", "t": 1, "q": "<p><img src=\"https://dati.gwzpks loads/20260717/evfgMpMg5SqZtQxCvg7z4CZtYKWd6uEyvIZAFZVj.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8569", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/n8cbWSh8Kl15tzYZtbKaTYEniwmXTZpc2QQWOvzC.png\"><\/p>", "a": ["<p>18A<\/p>", "<p>0A<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/iR2WT7Pi9QVYaPEQTlgdixktpyrNhgxAMDawQi5v.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/6nxyxbbC68y3oi1GYiKJO0hfOsqPZrqWEpgPUGz4.png\"><\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/LBzf7B8l70lJaOOuiMog14mpURGx6dpprRuKAwBJ.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8570", "t": 1, "q": "在三相交流电路中，对称三相电路的条件是（     ）。", "a": ["<p>各相电源电压有效值和频率都相等<\/p>", "<p>电压相角依次滞后120°<\/p>", "<p>Z<sub>A<\/sub>=Z<sub>B<\/sub>=Z<sub>C<\/sub><\/p>", "<p>A、B、C同时满足<\/p>", "", ""], "r": "D", "e": "【定位】第4章，4.1节，知识点4：三相电路\n【解析】对称三相电路的概念\n对称三相电路是指对称三相电源、对称三相负载和对称三相线路阻抗组成的正弦电流电路。此题中，选项A和B 说的电源对称，C说的是负载对称，均不全面。故正确答案为D。", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8571", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/Q7lsLU6pUqthCScWDqmqf0yZ0DQktESe3lTHvptp.png\"><\/p>", "a": ["<p>9.5A<\/p>", "<p>0A<\/p>", "<p>2.2A<\/p>", "<p>3.8A<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/iY18yvrDOjGf6udtgAyeVomM2xTCpypAQwBIker6.png\"><\/p>", "l3": "电工技术基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "8572", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/XDttD9ewOItoDZMRyoHr9QgXBAAt9dZYfSHv5ZkY.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260717/2Fa16kskA4gLPwlok7sdIcT9LtzjGfZlUQSOfF6z.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260717/9FyURQubriVh7d5fiL1mxXj64mVI25RiTLkRx4fd.png\"><\/p>", "<p><img src=\"https://dati.gwz
