10.5000pt;\">B<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【解析】注意：变压器不是电源！而变流器实质是将交直流转化装置，是分布式电源的重要构成部分。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "电力系统", "l4": "2027南网电力系统基础强化题库"}, {"id": "189cac964636a720psfsc580103", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">当发电厂有两台发电机时，一般来说至少需要几台变压器？<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）【<\/font><font face=\"Times New Roman\">2026<\/font><font face=\"宋体\">国网一批其他工学真题】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <a name=\"OLE_LINK1\"><\/a>", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">1<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">2<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">3<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">4<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">接于一台发电机电压母线上的主变压器一般不少于<\/font><font face=\"Times New Roman\">2<\/font><font face=\"宋体\">台<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">两台发电机就是四台了。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "电力系统", "l4": "2027南网电力系统基础强化题库"}, {"id": "189cac8758f5afa0psfsc198885", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">以下属于故障工作状态的是。（）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">系统中的功率缺额导致频率降低<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">发电器突然甩负荷引起的发电机频率升高<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">中性点不接地系统接地故障引起的非接地相对地电压升高<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">.<span style=\"font-family:宋体;font-siz cing:0.1000pt;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>A<span style=\"font-family:宋体;letter-spacing:0.1000pt;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\"><font face=\"宋体\">根据电力系统对可靠性的要求，负荷可划分为：<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font>1<font face=\"宋体\">）第一级负荷。对这一级负荷中断供电的后果是极为严重的。例如，可能发生危及人身安全的事故；使工业生产中的关键设备遭到难以修复的损坏，以致生产秩序长期不能恢复正常，造成国民经济的重大损失；使市政生活的重要部门发生混乱等。<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font>2<font face=\"宋体\">）第二级负荷。对这一级负荷中断供电将造成大量减产，使城市中大量居民的正常活动受到影响等。<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\"><font face=\"宋体\">（<\/font>3<font face=\"宋体\">）第三级负荷。不属于第一、二级的，停电影响不大的其他负荷都属于第三级负荷，如工厂的附属车间，小城镇和农村的公共负荷等。对这一级负荷的短时供电中断不会造成重大的损失。<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\"><font face=\"宋体\">根据以上分析，人员伤亡和主要生产设备的损坏属于一级负荷，故正确答案选<\/font>A<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\"><font face=\"宋体\">知识点：三级负荷划分<\/font><span style=\"font-family:'Times New Roman';\r\nletter-spacing:0.1000pt;font-size:10.5000pt;\">", "l3": "电力系统", "l4": "2027南网电力系统基础第2章"}, {"id": "189cac7abace2160psfsc053485", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">中性点不接地系统发生单相接地短路时，接地点三相线电压<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">增大<\/font><img width=\"23\" height=\"23\" src=\"https://idapic.luoyanedu.com/tiku/20260315115333_c7u/1-题库文档2959.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">倍<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">不再对称<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">保持不变<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">等于<\/font>0<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">中性点不接地系统发生单相接地短路时，中性点发生漂移并升高为相电压，非故障相电压升高为线电压，接地点线电压不发生变化，故正确答案选<\/font>C<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">知识点：中性点运行方式<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "电力系统", "l4": "2027南网电力系统基础第1章"}, {"id": "189cac8758f5afa0psfjd640819", "t": "3", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">电力系统故障时，保护装置只发出信号，不切除故障元件<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">正确<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">错误<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", "", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:Calibri;font-size:10.5000pt;\">B<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【解析】发生故障时，保护自动、迅速、有选择性地将故障元件从电力系统中切除，使故障元件免于继续遭到损坏，保证其他无故障部分迅速恢复正常运行。<\/font><span style=\"font-family:Calibri;font-size:10.5000pt;\">", "l3": "电力系统", "l4": "2027南网电力系统基础第5章"}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
