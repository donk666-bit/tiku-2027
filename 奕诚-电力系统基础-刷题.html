", "中等长度线路", "长线路", "超长线路", "", ""], "r": "C", "e": "【定位】第2章，第3节，知识点7：输电线路的等值电路\n【解析】长线路指长度超过300km的架空线路和长度超过100km的电缆线路。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33810", "t": 1, "q": "短线路的等值电路为（     ）。", "a": ["<p>电阻与电抗串联的集中参数电路<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/wi7N3iCGpYGsAiaF9Wp1JoiCHO1wq3JnK5GD2t5k.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/YTyTldAb31lnTHAEjWesxsUm849F5Q0O7xTHz81W.png\"><\/p>", "<p>考虑分布参数影响的“T”形集中<\/p>", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点7：输电线路的等值电路\n【解析】短线路通常可以不考虑分布参数和导纳支路的影响，为电阻与电抗串联的“一字型”集中参数电路。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33811", "t": 1, "q": "中等长度线路的等值电路为（     ）。", "a": ["<p>电阻与电抗串联的集中参数电路　<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/ZTOcyBRYvsqSZFhQLcPrPuiLjS2lrvxN2vIBMql1.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/UXXsSyrzJZg0NRfFKqKlt08EfpALuXBh8mQYyjT2.png\"><\/p>", "<p>考虑分布参数影响的“T”形集中<\/p>", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点7：输电线路的等值电路\n【解析】中等长度线路可以忽略分布参数的影响，用集中参数电路表示，中等长度线路的等值电路有π形等值电路和T形等值电路。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33812", "t": 1, "q": "电力系统分析计算时，长线路的等值电路为（     ）。", "a": ["<p>电阻与电抗串联的集中参数电路　　<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/82hssrAID1jCqDe12Mf01nBrfirgBMrXc06x1cWk.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/A84NVwgq1ZTlifgwDn1KHEmZmEOD0p1jA13c0QC8.png\"><\/p>", "<p>分布参数等值电路<\/p>", "", ""], "r": "C", "e": "【定位】第2章，第3节，知识点7：输电线路的等值电路\n【解析】长线路必须考虑分布参数的影响，采用考虑分布参数影响的长线路的精确和简化π形等值电路。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33813", "t": 1, "q": "电力系统稳态分析时，负荷通常采用的数学模型是（     ）。", "a": ["恒阻抗模型", "恒功率模型", "静态电压模型", "静态频率特性", "", ""], "r": "B", "e": "【定位】第2章，第4节，知识点5：负荷的数学模型\n【解析】系统正常运行时，频率非常接近额定频率，各点电压非常接近额定电压，所以电力系统稳态分析（潮流计算）时，就认为系统频率和各用电设备电压均为额定值，负荷消耗的功率保持其额定功率不变，即稳态分析时负荷用恒功率模型表示。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33814", "t": 1, "q": "关于电力系统等值电路参数计算时变压器变比的选择，下述说法中正确的是（     ）。", "a": ["精确计算时采用实际变比，近似计算时采用平均额定变比", "近似计算时，采用实际变比；精确计算时采用平均额定变比", "不管是精确计算还是近似计算均应采用额定变比", "不管是精确计算还是近似计算均应采用平均额定变比", "", ""], "r": "A", "e": "【定位】第2章，第5节，知识点5：精确计算与近似计算\n【解析】精确计算时采用实际变比，近似计算时采用平均额定变比。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33815", "t": 1, "q": "同步发电机“滞相”运行时，输出功率为（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/U3QpYGEEvKGDr5PgmKokTUjbuoyrEgYcK7u0uaoD.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/pCATnK3M1M2Mh7soIbSNHE5jdNvFvGOqmtC8HwND.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/IJnCa1FpMKrRmjiXnaYsFGa7VS18MRwXUQSe7vGB.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/yV6NGhkY5TT3bTzvV9wBGO2PD5BA9xchV3ItV40M.png\"><\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/hO1BK7vs32enj5WLojIUnL66m0nPj882vfHERggk.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33816", "t": 1, "q": "稳态分析计算中，保持机端电压大小和相位不变的发电机数学模型是（     ）。", "a": ["<p>理想电压源<\/p>", "<p>电压源<\/p>", "<p>恒功率源<\/p>", "<p>理想电流源<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/l19HTjUoHfpNp86q74ER066s35OqmoprxsxLgX0M.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33817", "t": 1, "q": "三绕组降压变压器，最外面绕组为（     ）。", "a": ["<p>高压绕组<\/p>", "<p>中压绕组<\/p>", "<p>低压绕组<\/p>", "<p>依据电压等级不同，绕组的排列情况不同<\/p>", "", ""], "r": "A", "e": "【定位】第2章，第2节，知识点3：三绕组变压器类型\n【解析】高压绕组不论是在降压变压器还是升压变压器都位于最外层，因为高压绕组需要更高的绝缘等级。若将其置于外层，可利用空气或其他绝缘介质进行外部绝缘，而内层低压绕组与铁芯（接地）之间的绝缘压力较小，从而降低整体绝缘成本。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33818", "t": 1, "q": "三绕组升压变压器，居中绕组为（     ）。", "a": ["<p>高压绕组<\/p>", "<p>中压绕组<\/p>", "<p>低压绕组<\/p>", "<p>依据电压等级不同，绕组的排列情况不同<\/p>", "", ""], "r": "C", "e": "【定位】第2章，第2节，知识点3：三绕组变压器类型\n【解析】升压绕组变压器的结构是中压内、低压中、高压外；降压变压器的结构是低压内、中压中和高压外，可以通过“升压不升，降压不降”的方式进行记忆，即升压变压器的内部到中部的电压变化是降低，而降压变压器的内部到中部的电压变化是升高。升压变的电压由低压侧升高到中压和高压两个电压等级，功率也由低压侧传输到两侧，为了有利于功率向两侧传输应将低压侧位于中间分别与中压和高压侧紧密结合，故正确排列顺序应选C。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33819", "t": 1, "q": "关于电力系统有名制等值电路，下面描述错误的是（     ）。", "a": ["<p>有名值等值电路中网络参数为一相参数<\/p>", "<p>所标示的电压为线电压<\/p>", "<p>所标示功率为三相总功率<\/p>", "<p>所标示的电压为相电压，功率为单相功率<\/p>", "", ""], "r": "D", "e": "【定位】第2章，第5节，知识点2：有名制等值电路\n【解析】电力系统有名制等值电路参数为一相参数，电压为线电压、功率为三相总功率。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33820", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/31ZNPM4iG98YRQElCQWCo65Wz2ofEdnFd4ttdqNx.png\"><\/p>", "a": ["<p>kVA和kV<\/p>", "<p>kW和kV<\/p>", "<p>MW和kV<\/p>", "<p>MVA和kV<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/3CWJ5bKXSZlrgGTpTYO12d3VTT7aNF0qy1bwtdxR.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33821", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/VeLnQhmjRJ0RpI4JQMxLPc36hryG3FlHsRtQftpZ.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/BbSIRmp5zFZieY3Lh8mDJEQiNq9H3TqcDSxqWjds.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/YbsDXfWxvp410mSZ8c8Hz5bm3xcIHXvejKk0vftC.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/mP04BIEUN8bGsMxr4uUq1uKkkoygpulKMR8GWoKl.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/0355B2XYx0KdbHZCU6anXk62sQ0BuLjEj86RKvky.png\"><\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/uebngGpkFBNLbUvyItpKT1GqSm1YveWF6u0UL4Jo.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33822", "t": 1, "q": "当线路传输的有功功率小于自然功率时，末端电压（     ）首端电压。", "a": ["<p>高于<\/p>", "<p>低于<\/p>", "<p>等于<\/p>", "<p>不确定<\/p>", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点8：波阻抗与自然功率\n【解析】输电线路功率等于自然功率时，此时线路无功平衡（忽略电阻，纯电抗时，传输功率因数为1，末端电压等于首端电压）；当有功功率小于自然功率时，线路的容性功率（充电功率）大于感性无功（传输消耗的无功，等效为线路向系统注入无功）；当输送的有功大于自然功率时，线路的感性无功损耗大于容性无功损耗，线路总无功损耗为感性，即要向线路注入感性无功，线路首段电压高于末端电压。综上所述，正确答案应选A。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33823", "t": 1, "q": "潮流计算中，PQ节点发电机的数学模型是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/RV6aTqAlDvai1j0ARsLsk7wXsEk6yMcoTI0an9zI.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/TpMSj4XZOhuXpPiAyxC5W5ktkruXcMh5AkgWzGY2.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/JWrsEPug3z7TeVZw0miuGQflFaZYPwlT7usnaN0p.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/4977AAcakhCidsuso4O42WJ43taueZHgTeOCQPUM.png\"><\/p>", "", ""], "r": "A", "e": "【定位】第2章，第1节，知识点5：电力系统稳态分析时同步发电机的数学模型及约束条件\n【解析】发电机定出力运行（PQ节点），有功功率和无功功率都是常数。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33824", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/IoeWX1XBGbtpihE4Pi1P0TlrIs5CNvU6CKywg3XM.png\"><\/p>", "a": ["<p>900<\/p>", "<p>450<\/p>", "<p>300<\/p>", "<p>1500<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/X6rigI22F0NOBJRK6nVU3bqggGAXKXlHgcjxDTW3.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33825", "t": 1, "q": "<p>选取容量基准值为1000MVA，电压基准值为1000kV时，若某线路中阻抗标幺值为0.1，则此线路阻抗为（ ）。<\/p>", "a": ["<p>0.1Ω<\/p>", "<p>57.5Ω<\/p>", "<p>100Ω<\/p>", "<p>577Ω<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/WpL0f6hM5HzQxY5WNtwW2TgC8pROOfyd1UIEkMDo.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33826", "t": 1, "q": "一台额定电压10.5kV，额定功率300MW，额定功率因数为0.9的发电机，次暂态电抗为0.15（以本身容量为基准的标幺值），现选取基准容量100MVA，次暂态电抗为（     ）。", "a": ["<p>0.045<\/p>", "<p>0.45<\/p>", "<p>0.405<\/p>", "<p>0.05<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/hyacvur7e8HrKZJOVyrzQigS5ByZznIIfqenWkvC.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33827", "t": 1, "q": "在P-Q运行极限图的第（     ）象限，发电机的运行极限取决于定子端部温升和并列运行稳定性约束。", "a": ["<p>1<\/p>", "<p>2<\/p>", "<p>3<\/p>", "<p>4<\/p>", "", ""], "r": "B", "e": "【定位】第2章，第1节，知识点4：隐极式同步发电机的运行极限图（P-Q运行极限图）\n【解析】根据发电机运行特性，定子端部温升约束出现在发电机以超前功率因数运行的情况下，出现在发电机P-Q运行极限图的第二象限；当发电机以滞后功率因素运行时，运行极限取决于发电机转子绕组温升的限制、定子绕组温升的限制和原动机最大机械功率的限制。综上可知，正确答案应选B。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33828", "t": 1, "q": "同样一条分裂导线分别用在220kV线路和500kV线路中，请问哪一个电压等级下的输电线路电抗大？（     ）", "a": ["<p>220kV<\/p>", "<p>500kV<\/p>", "<p>相同<\/p>", "<p>条件不全无法判定<\/p>", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】输电线路的电抗与三相导线之间的相间几何均距正相关，与导线的等值半径负相关。题目中用的是同一条导线，导线的等值半径没有发生变化，所以只看导线的相间几何均距。架空输电线路靠空气绝缘，所以电压等级越高，三相导线间的距离就越大，所以本题目500kV线路的相间几何均距大于220kV线路的相间几何均距，所以选B。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33829", "t": 1, "q": "变压器等效电路模型中的阻抗支路的电抗和励磁支路电抗的说法正确的是（     ）。", "a": ["<p>阻抗支路的电抗对应变压器主磁通<\/p>", "<p>励磁支路电抗对应变压器内部漏磁通<\/p>", "<p>阻抗支路对应损耗为不变损耗<\/p>", "<p>励磁支路对应损耗为不变损耗<\/p>", "", ""], "r": "D", "e": "【定位】第2章，第2节，知识点2：双绕组变压器的参数计算；第5章，第1节，知识点5：无功损耗\n【解析】选项A，阻抗支路电抗对应的是变压器的漏磁通。选项B，励磁支路电抗对应的是变压器的主磁通。选项C，变压器阻抗支路的损耗随着流过变压器负荷的变化而变化，是可变损耗，由于施加在变压器两端的电压一般认为是不变的额定电压，所以励磁支路的损耗为不变损耗。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33830", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/SlUYQDIr0WU9YfRkssGqHXBgr74QJ0fudZJqsSq7.png\"><\/p>", "a": ["<p>kV，kVA<\/p>", "<p>V，MVA<\/p>", "<p>kV，MVA<\/p>", "<p>V，kVA<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/zNrEt7j2yFCKFJI5PtcEeY1OV3JqENSMuAk0fpf4.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33831", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/TU7PEDVpuzAfovm645p5o25yq457pHp4FzyRpukT.png\"><\/p>", "a": ["<p>0.2<\/p>", "<p>0.18<\/p>", "<p>0.22<\/p>", "<p>0.201<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/9i1DD1r9Ndpby6wUiRIiHF810ZCgWjI67kLxec2D.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33832", "t": 1, "q": "三绕组自耦变压器容量比为100/100/50，变压器高低压侧短路电压归算公式是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/nDAsNhC8j76Nsr7WIWHURC9b6hQafURWZ3hiSwcS.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/HkUvobjCZo5ak6tDcya9Rz9Vo8Js3hNOTsOknIp1.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/ddQk5g5l9BFFBCsK1xzlTnK9Yd2pkzkZWimCiSSL.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/DVgvgf6eE5vf3HVp0LicYulSTq7oEb2MVnoGg2I1.png\"><\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/NS6ZUVPE7QjD01w1LHzpfmnlVXu7QTUKf9TMSqVL.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33833", "t": 1, "q": "三相导线平行排列，相邻两相导线之间距离为5m，线路的几何均距为（     ）。", "a": ["<p>5m<\/p>", "<p>6.3m<\/p>", "<p>6.7m<\/p>", "<p>10m<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/HlETBJok6BPDZUpcwLQNJTx7SF8tSBIvlrknMbCD.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33834", "t": 1, "q": "均匀无损超高压线路传输自然功率时，线路上某点的电压和电流的相位关系是（     ）。", "a": ["<p>电压相位超前电流<\/p>", "<p>电压相位滞后电流<\/p>", "<p>电压和电流同相位<\/p>", "<p>无法确定<\/p>", "", ""], "r": "C", "e": "【定位】第2章，第3节，知识点8：波阻抗与自然功率。\n【解析】“无损耗”的超高压线路，特性阻抗为纯电阻，称为波阻抗。当负荷阻抗为波阻抗时，该负荷所消耗的功率称为自然功率。线路本身不需要从系统吸取无功功率，也不向系统提供无功功率。因此某一点电压和电流同相位。故C选项正确，选项A、B、D均不对。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33835", "t": 1, "q": "用于连接220kV和110kV两个电压等级的降压器，归算到高压侧的变压器电抗为1欧姆，则归算到低压侧的变压器电抗为（     ）。", "a": ["<p>0.3025<\/p>", "<p>0.25<\/p>", "<p>0.25Ω<\/p>", "<p>0.3025Ω<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/BycY0P4ezCuoJ1Mg9DfnyEAr2lxnco1Ifq5OfuJA.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33836", "t": 1, "q": "已知某阻抗的标幺值为1，当基准容量和基准电压都减小为原始值的1/2时，新的标幺值为（     ）。", "a": ["<p>0.5<\/p>", "<p>1<\/p>", "<p>2<\/p>", "<p>4<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/DDb04Ez7Bffp1gTEy4kOYJMiqaJoAqZqqYY3bjZu.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33837", "t": 1, "q": "连接35kV和10kV两个电压等级的降压变压器，连接于-5%抽头时，变压器的实际变比是（     ）。", "a": ["<p>35/11kV<\/p>", "<p>38.5/10kV<\/p>", "<p>37/10.5kV<\/p>", "<p>33.25/11kV<\/p>", "", ""], "r": "D", "e": "【定位】第2章，第5节，知识点6：变压器的额定变比、实际变比、平均额定变比、标准变比与非标准变比\n【解析】降压变压器的额定变比是35/11kV，-5%分接头接于高压侧，因此实际变比是33.25/11kV，故选择D选项。选项A、B、C均不对。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33838", "t": 1, "q": "<p>同容量的三绕组自耦变压器和三绕组变压器，自耦变压器高压绕组和中压绕组之间漏抗与三绕组变压器高压绕组和中压绕组之间漏抗的大小关系是（ ）。<\/p>", "a": ["<p>前者小于后者<\/p>", "<p>前者大于后者<\/p>", "<p>二者相等<\/p>", "<p>无法比较<\/p>", "", ""], "r": "A", "e": "【定位】第2章，第2节，知识点5：自耦变压器的结构与特点。\n【解析】由于自耦变压器高压和中压侧之间有直接的电路连接（高压和中压之间存在公共绕组），相对于普通变压器来说（高压和中压绕组只有磁的联系，无电路连接）漏磁通更小，故对应的漏抗也更小，故答案应选A。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33839", "t": 1, "q": "降压变压器额定电压为220/121kV，110kV线路电抗有名值为20Ω，近似计算时归算到高压侧的线路电抗有名值为（     ）。", "a": ["<p>66.12Ω<\/p>", "<p>80Ω<\/p>", "<p>40Ω<\/p>", "<p>36.36Ω<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/igvnYbT8HdexSWNbZNx2JErNBKyTPrLMKO8Q0eAS.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33840", "t": 1, "q": "取基准容量为100MVA，额定容量为200MVA、短路电压百分值为10.5的变压器，近似计算时其电抗标幺值为（     ）。", "a": ["<p>0.0525<\/p>", "<p>0.21<\/p>", "<p>0.0525Ω<\/p>", "<p>0.21Ω<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/C4HdktEegvbOj62O3491uBYR1e7w2aWIEkFEJ40B.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33841", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/OPxPTwy1wt5f9nSRwtxqnPVFatPiIsyDEXSHojpJ.png\"><\/p>", "a": ["<p>越大；越大<\/p>", "<p>越小；越小<\/p>", "<p>越大；越小<\/p>", "<p>越小；越大<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/6I5MGttQJ6KHRRynZsoiziIaRwwPZ5txBkIP4clL.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33842", "t": 1, "q": "在电力系统计算中，对线路阻抗值而言，以下说法完全正确的是（     ）。", "a": ["<p>有名值唯一，而标幺值可以不唯一<\/p>", "<p>有名值不唯一，而标幺值唯一<\/p>", "<p>有名值和标幺值可以不唯一<\/p>", "<p>有名值和标幺值都一定唯一<\/p>", "", ""], "r": "A", "e": "【定位】第2章，第5节，知识点3：标幺制等值电路\n【解析】标幺值=有名值/基准值。有名值唯一，基准值人为选定，标幺值不唯一。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33843", "t": 1, "q": "若取相电压基准值为额定相电压，则额定视在功率标幺值等于（     ）。", "a": ["<p>线电压标幺值<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/jQEZyzI4gus1GJxbcZRkavpDppa6vsyPGsieMCO9.png\"><\/p>", "<p>电流标幺值<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/4t26aM9zA7jcSSs9RWMbNO3Obk1LVLRYIss5TjwX.png\"><\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/D8iu2wYqjTL4gLsRUidNF35tamdc9AHUfuI2ywmL.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33844", "t": 1, "q": "两台联结组号相同，变比相同，额定容量相等，阻抗电压不等的变压器并列运行时，在负荷分配上（     ）。", "a": ["<p>阻抗电压大的变压器负荷小<\/p>", "<p>阻抗电压小的变压器负荷小<\/p>", "<p>不受阻抗电压影响<\/p>", "<p>一样大<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/6iPNNCH1gR7nstg6vAp4R20OyT7vNkeQwIiabqQ2.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33845", "t": 1, "q": "下面选项中，不属于电力系统负荷模型的是（     ）。", "a": ["<p>静态负荷模型<\/p>", "<p>动态负荷模型<\/p>", "<p>感应电动机负荷模型<\/p>", "<p>发电机模型<\/p>", "", ""], "r": "D", "e": "【定位】第2章，第4节，知识点5：负荷的数学模型\n【定位】第6章，第3节，知识点1：同步发电机三相短路分析的假设条件\n【解析】发电机模型不是负荷模型，而是电力系统中的电源模型。静态负荷模型、动态负荷模型和感应电动机负荷模型都是常见的负荷模型。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33846", "t": 1, "q": "1000kV特高压交流架空输电线路采用8分裂导线的目的是（     ）。", "a": ["<p>减小电抗<\/p>", "<p>提高电晕临界电压<\/p>", "<p>增大电纳<\/p>", "<p>减小电纳<\/p>", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点5：分裂导线输电线路\n【解析】输电线路采用分裂导线主要由两个目的：减小线路电抗、减小电晕损耗。1000kV特高压线路由于线路电压过高容易发生电晕现象导致产生有功损耗，故采用8分裂导线的主要目的是通过增大等值计算半径提高电晕临界电压来减小电晕损耗或让电晕不发生，故正确答案应选B。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33847", "t": 1, "q": "输电线路一般采用（     ）。", "a": ["架空输电线路", "电缆输电线路", "绝缘导线", "母线", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点1：电力线路的类型与结构\n【解析】架空输电线路建设成本低、施工维护便捷、检修方便，适合远距离大容量输送电能，是电力系统中输电线路最常用的形式，电缆输电线路多用于城市中心、地下、隧道等受地形环境限制不宜架设架空线路的场景，一般不作为常规远距离输电的主要方式，绝缘导线多用于低压配电线路，母线是变电站、配电装置中汇集和分配电能的导体，不属于输电线路，因此本题选择A。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33848", "t": 1, "q": "输送电能通常采用（     ）三相三线制交流输电方式。", "a": ["三相、直流", "单相、直流", "三相、交流", "单相、交流", "", ""], "r": "C", "e": "【定位】第2章，第3节，知识点1：电力线路的类型与结构\n【解析】在远距离输送电能时通常采用三相交流输电，多选用三相三线制的接线方式，三相交流电相比单相交流电输送相同功率时导线耗材更少、输电效率更高，运行经济性更好，而直流电早期远距离输电技术不成熟，常规高压输电普遍采用三相交流形式，单相交流多用于居民低压用电场景，并不适合大功率远距离电能输送，因此本题选择C。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33849", "t": 1, "q": "架空输电线路全换位的目的是（     ）。", "a": ["使三相线路的电阻参数相等", "使三相线路的电抗和电纳参数相等", "减小线路电抗", "减小线路电阻", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点4：架空线路的换位\n【解析】架空输电线路全换位的目的是使三相导线参数平衡。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33850", "t": 1, "q": "连接110kV和35kV电力网的降压变压器，如果采用+5%分接头，变压器的变比为（     ）。", "a": ["110/35", "115.5/38.5", "110/36.8", "121/36.8", "", ""], "r": "B", "e": "【定位】第2章，第5节，知识点6：变压器的额定变比、实际变比、平均额定变比、标准变比与非标准变比\n【解析】低压绕组额定电压比所连接线路电压高10%，为38.5kV。高压绕组电压为110*（1+5%）=115.5kV。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33851", "t": 1, "q": "一台降压变压器的变比是220/38.5kV，则低、高压侧接入电压为（     ）。", "a": ["<p>38.5kV，220kV<\/p>", "<p>35kV，242kV<\/p>", "<p>38.5kV，242kV<\/p>", "<p>35kV，220kV<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/X7t1E03GXLIakPSriAMvVwM1D5gGOsO2YBcBV5jv.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33852", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/SmqDj8UaoxBYEdfRBA8L9BUw7jNEbOxgCy06mKXB.png\"><\/p>", "a": ["<p>110/35<\/p>", "<p>110/38.5<\/p>", "<p>121/38.5<\/p>", "<p>121/35<\/p>", "", ""], "r": "B", "e": "【定位】第2章，第5节，知识点6：变压器的额定变比、实际变比、平均额定变比、标准变比与非标准变比\n【解析】有载调压变压器的抽头在高压侧。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33853", "t": 1, "q": "变压器一次侧接110kV线路，二次侧接10kV线路，该变压器分接头工作在+2.5%，则实际电压比为（     ）。", "a": ["110/10", "112.75/11", "112.75/10.5", "121/11", "", ""], "r": "B", "e": "【定位】第2章，第5节，知识点6：变压器的额定变比、实际变比、平均额定变比、标准变比与非标准变比\n【解析】有载调压变压器的抽头在高压侧。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33854", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/vW4jc2YYMwfAMSmVB8RzM97J5U2rV3gWMJO6oEIw.png\"><\/p>", "a": ["<p>0.9~1.1<\/p>", "<p>0.95~1.05<\/p>", "<p>0.9~1<\/p>", "<p>1~1.05<\/p>", "", ""], "r": "B", "e": "【定位】第2章，第1节，知识点3：同步发电机的运行限制\n【解析】发电机正常工作电压范围是±5%倍的额定电压。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33855", "t": 1, "q": "电力系统分析中所用阻抗指的是（     ）。", "a": ["一相等值阻抗", "两相阻抗", "三相阻抗", "四相阻抗", "", ""], "r": "A", "e": "【定位】第2章，第5节，知识点1：电力系统的等值电路\n【解析】电力系统等值电路中的阻抗，均是单相的等值阻抗。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33856", "t": 1, "q": "下面变压器参数中，完全属于储能参数的一组是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/TaB5t3O48ZweepUrCUPSLD5lacfGve3pKeg1HuI4.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/ciHc0DpQ6Y5l3KS5IVDBsRkYROJUKU2JEfeFkDYz.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/GqBZfDR6sxywYhhHI7m8PMg6ibJ2cxcM9TNZX822.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/Sgg2osUWHSj1Q6MA0dKlo2gt5H8KeFB2PUMMAkmE.png\"><\/p>", "", ""], "r": "B", "e": "【定位】第2章，第2节，知识点2：双绕组变压器的参数计算\n【解析】根据电路的基本知识，电感和电容是属于储能元件，在变压器的参数中，线圈绕组的电抗和铁芯的感纳都是呈电感性的，都属于储能元件参数，故正确答案应选B。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33857", "t": 1, "q": "电力系统分析中，有功功率的单位常用（     ）。", "a": ["VAR", "MW", "MVA", "V", "", ""], "r": "B", "e": "【定位】第2章，第2节，知识点2：双绕组变压器的参数计算\n【解析】A选项为无功功率的单位，B选项为有功功率的单位，且为常用单位，C选项为视在功率的单位，D选项为电压的单位。故正确选项为B。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33858", "t": 1, "q": "下列说法正确的是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/SJI0C5jauocAoOudlk860wKaagWkBhbgsmH8j5je.png\"><\/p>", "<p>变压器带纯电阻负载时，当负载电流增加，输出电压一定不变<\/p>", "<p>变压器中铁耗为可变损耗，因为它随电源电压而变<\/p>", "<p>变压器中铜耗为不变损耗，因为折算时保持它不变<\/p>", "", ""], "r": "A", "e": "【定位】第2章，第2节，知识点2：双绕组变压器的参数计算\n【解析】变压器短路试验是为了测取绕组的电阻和电抗参数，空载试验是为了测取铁芯的电导和电纳（漏抗）；变压器绕组损耗（铜损）与电流有关，故也称为可变损耗，变压器铁芯损耗与电压有关，电压规定的可变动范围小，认为电压基本上不变动，故称为不变损耗；变压器带负载运行时，当接入纯电阻负载时，当负载增加时，传输功率不变时，输出的电压是会变小的。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33859", "t": 1, "q": "电力系统潮流计算中变压器采用τ型等值电路，而不采用T型等值电路的原因是（     ）。", "a": ["采用τ型等值电路比采用T型等值电路精确", "采用τ型等值电路在变压器变比改变时，便于电力系统节点导纳矩阵的修改", "采用τ型等值电路可以减少电力系统的节点总数", "采用τ型等值电路可以增加电力系统的节点总数", "", ""], "r": "C", "e": "【定位】第2章，第2节，知识点1：双绕组变压器的等值电路\n【解析】通常潮流计算中变压器采用τ型等值电路，而不采用将变压器绕组分为原边和副边的T型等值电路，将原副边的绕组合并，励磁支路前移，可以减少节点数，方便计算。故正确答案选C。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33860", "t": 1, "q": "变压器的电抗由（     ）决定。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/TffdbAgKmDXMl8Nw2cC4kFfV3EEdg2oDWGseoFx3.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/iMpA5n6LaGeVvTg55iyebFHHWEoFjhbLcQXoxYhA.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/WIYQHy02u533K5Zqr1b1QLe27ZXMQz3Vhm32DBNp.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/fXKcVP7Ig4kin9kObDQOEeUlIpgPy2qaVgSyZVaL.png\"><\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/BsUwRpgnquz6IYjHhlIqNey6Gxo5v6rb7Gd3HnAg.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33861", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/wkFpGSMME33hcJ2bCZMVKeyXQ6MTdDTi9nsevHTn.png\"><\/p>", "a": ["<p>铁损<\/p>", "<p>主磁通<\/p>", "<p>铜损<\/p>", "<p>励磁阻抗<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/vsaBSnVg9h6Tn6fF4wXGxQRYrT3Z1it8KPlUAut5.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33862", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/jAM0sLtmX6LLilcvBlwANTtWobWJfOMgo1cQ2dYb.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/JXr2L9afVjJA0OaoerQPVVbCrjkhfXoOsMHPJZ0D.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/VCn9GvuZsOTkF6E6g9PbM0uguBj0LIgyYw5Ehbcl.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/hWcDA7FAFt4hJIH5QgZEEq346awzeQHdRWx0q5EI.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/9xe13IH421EMhTjPfncQQfaE2BPPqZvWE1V7LwNQ.png\"><\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/TkASCgup2KiHensmZHvLYEEjntysT9UwiNI7jYZE.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33863", "t": 1, "q": "自耦变压器自耦联接的两个绕组之间的电磁关系为（     ）。", "a": ["只有磁联系，无电联系", "既有磁联系，又有电联系", "只有电联系，无磁联系", "既无磁联系，也无电联系", "", ""], "r": "B", "e": "【定位】第2章，第2节，知识点5：自耦变压器的结构与特点\n【解析】自耦变压器原副边公用一个绕组，所以两个绕组之间既有磁联系，又有电联系。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33864", "t": 1, "q": "用来支持或悬挂导线并使导线与杆塔绝缘的器件是（     ）。", "a": ["杆塔", "金具", "绝缘子", "横担", "", ""], "r": "C", "e": "【定位】第2章，第3节，知识点1：电力线路的类型与结构\n【解析】绝缘子的作用就是悬挂或者支撑导线，同时隔绝导线与杆塔之间的电气通路，实现导线和杆塔的绝缘，杆塔起到整体支撑线路的作用，金具用来连接固定导线、绝缘子等各类电力部件，横担安装在杆塔上用于固定绝缘子和导线，因此本题选C。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33865", "t": 1, "q": "电力系统中，视在功率的单位常采用（     ）。", "a": ["MW", "MVA", "kVA", "VA", "", ""], "r": "B", "e": "【定位】第2章，第2节，知识点2：双绕组变压器的参数计算\n【解析】BCD均为视在功率的单位，电力系统分析中常用MVA。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33866", "t": 1, "q": "（     ）的目的是为了消除由于位置原因引起的电路参数不对称。", "a": ["分裂导线", "架空线路换位", "采用电缆输电", "提高电压等级", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点4：架空线路的换位\n【解析】架空线路三相导线在杆塔上排列位置不同时，各相的电感、电容参数会存在差异，造成三相电路参数不对称，容易产生不平衡电流、零序电压等问题，通过架空线路换位可以周期性调换三相导线的空间位置，让每一相导线轮流占据三个不同的架设位置，使三相线路平均参数趋于一致，从而消除位置因素带来的电路参数不对称，分裂导线主要作用是抑制电晕、减小电抗，电缆输电可以降低线路电抗、不受外界环境影响，提高电压等级主要用于降低输电损耗、增大输送容量，这三项均不能消除三相参数不对称问题，因此本题选B。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33867", "t": 1, "q": "当架空输电线路长度（     ）应进行换位。", "a": ["小于100km", "大于100km", "大于100km小于300km", "大于300km", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点4：架空线路的换位\n【解析】架空线路长度超过100km的架空输电线路应进行换位。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33868", "t": 1, "q": "电力线路等值参数中消耗无功功率的是（     ）。", "a": ["电导", "电抗", "电阻", "电晕", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】输电线路的参数中，电抗损耗无功功率。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33869", "t": 1, "q": "电力线路中，电纳参数B主要反映电流流过线路产生的（     ）。", "a": ["热效应", "电场效应", "磁场效应", "电晕损耗", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】根据电力线路的等值电路可知，线路的电阻反映线路产生的热效应，电抗反映线路的磁场效应，电导反映线路的电晕损耗，对地电容反映线路产生的电场效应，故正确答案选B。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33870", "t": 1, "q": "电力线路的等值电路中，电抗参数X主要反映电流流过线路产生的（     ）。", "a": ["热效应", "电场效应", "磁场效应", "电晕损耗", "", ""], "r": "C", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】根据电力线路的等值电路可知，线路的电阻反映线路产生的热效应，电抗反映线路的磁场效应，电导反映线路的电晕损耗，对地电容反映线路产生的电场效应，故正确答案选C。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33871", "t": 1, "q": "为减小架空输电线路的电抗，通常采用的方法是（     ）。", "a": ["采用分裂导线或扩径导线", "增大导线半径", "减小导线之间的距离", "以上均不正确", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点5：分裂导线输电线路\n【解析】采用分裂导线或扩径导线是减小导线电抗通常采用的方法。增大导线半径，增大了导线的截面积，而导线的截面积由导线的载流量决定，因此该方法不采用。减小导线之间的距离能够减小导线的电抗，而导线之间的距离取决于导线的绝缘强度，因此该方法不采用。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33872", "t": 1, "q": "三分裂导线，子导线半径为15.7mm，导线间中心距离为500mm，该导线的等效半径为（     ）mm。", "a": ["<p>157.7<\/p>", "<p>500<\/p>", "<p>288.7<\/p>", "<p>216.5<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/iPpggkeLE9Izt8qcQGoDyU8uGw3GxrqI2BJON6E6.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33873", "t": 1, "q": "按照规定，当线路长度超过（     ）时就应当进行换位。", "a": ["100公里", "300公里", "600公里", "以上均不正确", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点4：架空线路的换位\n【解析】架空线路的换位是为了减少三相参数的不平衡，换位方式分为滚式换位和换位杆塔换位。一般规定当线路长度超过100km的架空线路应进行换位，故正确答案选A。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33874", "t": 1, "q": "当负荷阻抗为波阻抗时，该负荷所消耗的功率称为（     ）。", "a": ["<p>有功功率<\/p>", "<p>无功功率<\/p>", "<p>视在功率<\/p>", "<p>自然功率<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/fMVDg0A05V5B9wmsdZ5nM3mhD9VuBLXAKJAJ8m1K.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33875", "t": 1, "q": "将工业、农业、邮电、交通、市政、商业以及城乡居民所消耗的功率相加，得到的功率称为（     ）。", "a": ["综合用电负荷", "供电负荷", "发电负荷", "工业负荷", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点1：电力系统的负荷\n【解析】不同负荷用电功率相加，得到的负荷称为综合用电负荷。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33876", "t": 1, "q": "负荷按照电能可分为综合用电负荷、供电负荷、发电负荷，其中三者之间的大小关系为（     ）。", "a": ["综合用电负荷＞供电负荷＞发电负荷", "综合用电负荷＞发电负荷＞供电负荷", "发电负荷＞供电负荷＞综合用电负荷", "发电负荷＞综合用电负荷＞供电负荷", "", ""], "r": "C", "e": "【定位】第2章，第4节，知识点1：电力系统的负荷\n【解析】电力系统综合用电负荷是指电力系统所有用电设备消耗功率的综合。供电负荷是指综合用电负荷加上网损，即发电厂供出的负荷。发电负荷是指供电负荷加上发电厂厂用电，即发电机发出的功率。\n因此功率大小关系为发电负荷＞供电负荷＞综合用电负荷，选C。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33877", "t": 1, "q": "电力系统的综合用电负荷加上网络中的供电损耗称为（     ）。", "a": ["厂用电负荷", "发电负荷", "工业负荷", "供电负荷", "", ""], "r": "D", "e": "【定位】第2章，第4节，知识点1：电力系统的负荷\n【解析】各种负荷关系为：（1）发电负荷=厂用电负荷+供电负荷；（2）供电负荷=电网损耗+综合用电负荷（各种用户的负荷之和）。根据以上关系可知，答案选D。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33878", "t": 1, "q": "电力系统供电负荷与厂用电负荷之和为（     ）。", "a": ["系统发电负荷", "系统供电负荷", "系统综合负荷", "以上均不正确", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点1：电力系统的负荷\n【解析】各种负荷关系为：（1）发电负荷=厂用电负荷+供电负荷；（2）供电负荷=电网损耗+综合用电负荷（各种用户的负荷之和）。根据以上关系可知，供电负荷等于发电负荷减去厂用电负荷，故答案选A。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33879", "t": 1, "q": "关于负荷曲线，下面描述错误的是（     ）。 ", "a": ["日有功功率负荷曲线用于安排电力系统发电计划", "年持续有功负荷曲线用于计算一年中的电能损耗", "年最大有功负荷曲线用于安排电力系统机组检修计划", "日有功功率负荷曲线的最大负荷大于系统各用户最大负荷之和", "", ""], "r": "D", "e": "【定位】第2章，第4节，知识点3：电力系统常用的负荷曲线\n【解析】日有功功率负荷曲线的最大负荷大于系统各用户最大负荷并不是出现在同一时刻，各用户最大负荷之和大于日有功功率负荷曲线的最大负荷。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33880", "t": 1, "q": "制定电力系统年最大负荷曲线的目的是（     ）。", "a": ["安排发电机组检修计划", "制定发电机组发电计划", "计算年耗电量", "计算电能损耗", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点3：电力系统常用的负荷曲线\n【解析】系统年最大有功负荷曲线：（1）定义：反映系统一年内每月（或每日）最大有功负荷变化情况的负荷曲线。（2）用途：用来安排电力系统机组检修计划和装机计划。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33881", "t": 1, "q": "关于电力系统日有功负荷曲线，下面说法错误的是（     ）。", "a": ["电力系统日有功负荷曲线反映了系统中用电设备消耗的有功功率随时间变化的情况", "电力系统的日有功最大负荷小于系统中用户的日有功最大负荷之和", "电力系统的日有功最大负荷等于系统中用户的日有功最大负荷之和", "以上均不正确", "", ""], "r": "C", "e": "【定位】第2章，第4节，知识点3：电力系统常用的负荷曲线\n【解析】选项A为日有功负荷曲线（P-t）的定义。根据日有功负荷曲线的特征可知，电力系统的实际负荷不可能同时出现在用户有功负荷的最大处或最小处，故日有功最大负荷应小于用户日有功最大负荷之和，日有功最小负荷应大于用户的日有功最小负荷之和，故选项C的说法是错误的，应选C。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33882", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/hhJjNYPlh0KhezfN9uGgF3jAiLDnxW1c3rk61Im6.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/P9fzXeD0TfvV4zYtb2kK4SaDmPR5Mm6pjStt8Jrz.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/FFqb9wQERLAvU7QbKOWJelyehNTLHjvdalD2Sw8D.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/DSGefJCBnOb7iIrZ9peM63zzESVT3Ve5VtCCBTFy.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/m9KXjGpW4TINA3b6m19Dx9Zp0UaOaYKRta9uMBqI.png\"><\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/TJuKF6oLvaO9gPnfaaVioktV3isdNP7brjoZa4tr.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33883", "t": 1, "q": "对于电力系统来说，峰、谷负荷差越（     ），用电越趋于合理。", "a": ["大", "小", "稳定", "不稳定", "", ""], "r": "B", "e": "【定位】第2章，第4节，知识点4：关于电力系统负荷的几个基本概念\n【解析】实际的电力系统相当庞大且复杂，运行处于相对稳定的状态。用电高峰和低谷差距越小，更趋于合理、稳定。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33884", "t": 1, "q": "以下不属于负荷特性的是（     ）。", "a": ["电压和频率特性", "电压和电流特性", "静态和动态特性", "有功功率和无功功率特性", "", ""], "r": "B", "e": "【定位】第2章，第4节，知识点5：负荷的数学模型\n【解析】负荷特性按其特征可分为：（1）电压和频率特性；（2）静态和动态特性；（3）有功功率和无功功率特性。综合以上三种特性可以确定，应选B不属于负荷特性。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33885", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/uRRYosIsVaVDJzTimxBEyRftKuqMFFtThAJb3JCM.png\"><\/p>", "a": ["<p>1300Ω<\/p>", "<p>1545.6Ω<\/p>", "<p>1580Ω<\/p>", "<p>1600Ω<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/jbnWaMyaxPaVrnUF8ULJjWcxKdXcxdc82o8LgIeo.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33886", "t": 1, "q": "<p>近似计算时，35kV电网电压的平均额定电压为（ ）。<\/p>", "a": ["<p>35kV<\/p>", "<p>36.75kV<\/p>", "<p>37kV<\/p>", "<p>38.5kV<\/p>", "", ""], "r": "C", "e": "【定位】第2章，第5节，知识点4：平均额定电压\n【解析】同一电压等级电网中，各元件的额定电压并不完全相同，近似计算时，为简化计算，规定各元件取相同的额定电压，这个额定电压近似为该电压等级各元件的最高额定电压和最低额定电压的平均值，称为“平均额定电压”。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33887", "t": 1, "q": "取基准容量为100MVA，35kV线路电抗为40Ω，如果采用近似计算法，其标幺值为（     ）。", "a": ["<p>2<\/p>", "<p>2.9<\/p>", "<p>2.92<\/p>", "<p>3.92<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/1A4wvlsHQf0huyk6NKOhvapVcFIdiSGo1DYw4wf7.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33888", "t": 1, "q": "输电线路中，需要消耗电能的参数是（     ）。", "a": ["电阻、电抗", "电导、电纳", "电阻、电导", "电抗、电纳", "", ""], "r": "C", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】输电线路的电阻会因电流流过产生有功功率损耗，电导主要由线路绝缘子泄漏、电晕现象产生有功电能损耗，二者都会消耗电能，电抗和电纳属于储能元件，只进行无功功率的交换，不消耗有功电能，因此需要消耗电能的参数是电阻、电导，本题选择C。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33889", "t": 1, "q": "某系统综合负荷为6000MW，网损为500MW，发电厂厂用电负荷为60MW，该系统供电负荷是（     ）。", "a": ["6000MW", "6500MW", "6600MW", "6560MW", "", ""], "r": "B", "e": "【定位】第2章，第4节，知识点1：电力系统的负荷\n【解析】电力系统综合负荷：电力系统中用电设备所消耗的功率的总和。电力系统供电负荷：系统中各发电厂供应的功率的总和，它等于系统综合负荷和网络中损耗的功率之和。6000+500=6500MW。发电负荷：系统中发电机所发功率的总和，它等于电力系统的供电负荷和发电厂厂用电功率之和。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33890", "t": 2, "q": "同步发电机运行限制条件有（     ）。", "a": ["励磁电流额定值", "定子电流额定值", "并列运行稳定性", "机组最小技术出力", "", ""], "r": "ABCD", "e": "【定位】第2章，第1节，知识点3：同步发电机的运行限制\n【解析】为保证励磁绕组、定子绕组绝缘不被烧毁，励磁电流和定子电流均不能超过额定值。为保证并列运行稳定性，同步发电机进相深度不超太大。发电机出力受到最小技术出力限制。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33891", "t": 2, "q": "我国生产的三绕组变压器的容量比有（     ）。", "a": ["<p>1：1：0.5<\/p>", "<p>1：0.5：1<\/p>", "<p>1：1：1&nbsp;&nbsp;<\/p>", "<p>1：0.5：0.5<\/p>", "", ""], "r": "ABC", "e": "【定位】第2章，第2节，知识点3：三绕组变压器类型\n【解析】三绕组变压器按三个绕组容量的不同分为三种不同的类型：100/100/100、100/50/100、100/100/50。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33892", "t": 2, "q": "三绕组变压器的额定容量为100/50/100MVA下列说法正确的是（     ）。", "a": ["高压侧实际传输容量为100MVA", "高压侧最大传输容量为100MVA", "低压侧实际传输容量为100MVA", "低压侧最大传输容量为100MVA", "", ""], "r": "BD", "e": "【定位】第2章，第2节，知识点3：三绕组变压器类型\n【解析】三绕组变压器的额定容量为100/50/100MVA，代表各侧绕组最大传输容量。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33893", "t": 2, "q": "连接220kV和110kV两个电压等级的降压变压器，110kV线路参数归算到220kV侧时采用变压器平均额定变比，当变压器采用+5%分接头时，关于变压器的额定变比、标准变比、实际变比和非标准变比正确的是（     ）。", "a": ["<p>额定变比为220/121<\/p>", "<p>标准变比为230/115<\/p>", "<p>实际变比为231/121<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/urMU8kEKCEWekFQCrzteyJ80ggbZ8v90wX7NHfAk.png\"><\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/fUfP7VlKIGuoIgLTrr3JcEUfZCFIajvqTU2RqobO.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33894", "t": 2, "q": "电力线路按结构分为（     ）。", "a": ["电缆线路", "架空线路", "高压线路", "低压线路", "", ""], "r": "AB", "e": "【定位】第2章，第3节，知识点1：电力线路的类型与结构\n【解析】电力线路按结构可分为架空线和电缆线路。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33895", "t": 2, "q": "<p>同架空线路相比，三相电缆线路的特点是（ ）。<\/p>", "a": ["<p>电缆线路导线相间距离小<\/p>", "<p>导体相间绝缘为绝缘介质<\/p>", "<p>同电压等级和同样传输功率条件下投资大<\/p>", "<p>同电压等级和同样传输功率条件下投资小<\/p>", "", ""], "r": "ABC", "e": "【定位】第2章，第3节，知识点1：电力线路的类型与结构\n【解析】电缆线路三相导体在一根绝缘皮内绕包，或三相在同一个电缆沟内敷设，因此导线相间距离小。导体相间靠绝缘介质绝缘。同电压等级和同样传输功率条件下电缆价格昂贵，投资大。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33896", "t": 2, "q": "电力电缆由（     ）构成。", "a": ["导体", "绝缘层", "屏蔽层", "保护层", "", ""], "r": "ABCD", "e": "【定位】第2章，第3节，知识点1：电力线路的类型与结构\n【解析】电缆线路结构：电缆线路由导线、绝缘层、屏蔽层和保护层组成。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33897", "t": 2, "q": "架空线路常用的绝缘子类型有（     ）。", "a": ["针式绝缘子", "棒式绝缘子", "悬式绝缘子", "穿墙式绝缘子", "", ""], "r": "ABC", "e": "【定位】第2章，第3节，知识点2：绝缘子类型及应用\n【解析】常用的绝缘子有针式、悬式和棒式（瓷横担）三种，穿墙式绝缘子（也叫穿墙套管）用来连接户内和户外导体用。选项ABC正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33898", "t": 2, "q": "架空线路电阻计算时，所采用的电阻率大于导线材料的直流电阻率，其原因有（      ）。", "a": ["导体的实际长度大于导线长度", "导体的实际截面小于计算所采用导线标称截面", "集（趋）肤效应影响", "导线中钢芯的影响", "", ""], "r": "ABC", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】由于绞线的影响导体的实际长度大于计算所用的导线长度；由于绞线的影响导体的实际截面小于计算所采用导线标称截面；由于交流流过导体时集（趋）肤效应影响，使导体有效导电截面减小。为了使计算结果与导线的实际电阻相同，所以交流输电线路电阻计算时所采用的电阻率大于导线材料的直流电阻率。选项ABC正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33899", "t": 2, "q": "关于超高压架空线路的电导，下面描述正确的是（     ）。", "a": ["<p>几何平均距离越大，电导越大<\/p>", "<p>几何平均距离越大，电导越小<\/p>", "<p>导线半径越大，电导越小<\/p>", "<p>导线半径越小，电导越小<\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/S9GdfBdmSckZ8y7RaPw1ZQuJCkWPRaxcdfj9VpCi.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33900", "t": 2, "q": "关于同型号的导线用在不同电压等级架空线路时的电抗和电纳，下面正确的是（     ）。", "a": ["<p>电压越高电抗越大<\/p>", "<p>电压越高电抗越小<\/p>", "<p>电压越高电纳越大<\/p>", "<p>电压越高电纳越小<\/p>", "", ""], "r": "AD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/gOh3pegJIqqx5Y1fSUXvdDneI94tOIQktA4dkTOr.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33901", "t": 2, "q": "架空输电线路导线全换位（整换位）的目的是（     ）。", "a": ["使三相导线电抗相等", "使三相导线电纳相等", "使三相线路电阻相等", "提高线路绝缘水平", "", ""], "r": "AB", "e": "【定位】第2章，第3节，知识点4：架空线路的换位\n【解析】架空线路的电抗由自感电抗和互感电抗组成，相间距离不相等时，三相之间互感电抗不相等，导致三相导线电抗不相等；架空线路电纳对应的线路电容由导线对地电容和相间电容组成，三相导线相间距离不相等时，三相相间电容不相等，三相单位长度电容不相等，与之对应的线路三相电纳不相等。换位的目的就是为了减少线路电抗、电纳这些与导线空间排列位置有关的参数的不平衡，选项AB正确；导线电阻与导线布置方式无关，选项C错误；线路绝缘水平取决于导线相间距离和绝缘子串绝缘子片数，与换位无关，选项D错误。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33902", "t": 2, "q": "架空线路采用分裂导线的目的是（     ）。", "a": ["减小电抗", "增大电纳", "减小电阻", "提高电晕临界电压", "", ""], "r": "AD", "e": "【定位】第2章，第3节，知识点5：分裂导线输电线路\n【解析】架空线路采用分裂导线的目的是为了减小线路电抗；提高电晕临界电压，避免输电线路电晕的发生或减小电晕损耗。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33903", "t": 2, "q": "导线总截面不变的情况下，分裂导线线路参数与单导线线路参数相比，下面描述正确的是（     ）。", "a": ["电抗变小", "电纳变大", "电晕损耗变小", "电阻变大", "", ""], "r": "ABC", "e": "【定位】第2章，第3节，知识点5：分裂导线输电线路\n【解析】架空线路采用分裂导线后，在导线总截面不变的情况下等效增大了导线半径，提高了电晕临界电压，从而减小了线路电抗、增大了线路电纳、减小了电晕损耗。选项ABC正确；导线的电阻与导线布置方式无关，仅取决于导线的实际截面和导线材料，导线截面不变时电阻不变，选项D错误。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33904", "t": 2, "q": "关于同样导体截面的电缆线路和架空线路参数，下面描述正确的是（     ）。", "a": ["电缆线路电抗小于架空线路电抗", "电缆线路电纳大于架空线路电纳", "电缆线路电导与架空线路电导反映的物理现象不同", "电缆线路电阻略大于架空线路电阻", "", ""], "r": "ABCD", "e": "【定位】第2章，第3节，知识点6：电缆线路参数\n【解析】电缆线路三相导线距离远远小于架空线路，所以电缆线路的电抗远小于架空线路电抗；电缆线路电纳远大于架空线路电纳；由于集肤效应和邻近效应影响，同样导体截面情况下，电缆线路的电阻略大于架空线路电阻；电缆线路的电导反映电缆绝缘介质的损耗，架空线路电导反映电晕损耗，二者反映的物理现象不同。选项ABCD正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33905", "t": 2, "q": "输电线路按长度分为（     ）。", "a": ["短线路", "中等长度线路", "长线路", "超长线路", "", ""], "r": "ABC", "e": "【定位】第2章，第3节，知识点7：输电线路的等值电路\n【解析】输电线路按长度分为短线路、中等长度线路、长线路。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33906", "t": 2, "q": "关于中等长度线路的等值电路，下面描述正确的是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260731/wFemrff4SgkVaLNNf2l9OpZqGINvKqsWdP3hd7Q8.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/oaoicei9SYotarwyT0PFWslfcRsotCRWEchRjlAD.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/wrdcqlsJpgb4LaPSKF5kkfRndErVbDxYpMm6Knjh.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/FmQH8F3Kb1KPlwMV4WEp4qVSxu2HDhBD7hVYK7OV.png\"><\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/8qU3NCmsIKHFhLwH3FiYYvdyth5JFmMAujir0opd.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33907", "t": 2, "q": "关于波阻抗与自然功率，下述说法正确的是（     ）。", "a": ["<p>波阻抗是纯电阻，为“无损耗”超高压线路的特性阻抗<\/p>", "<p>负荷阻抗等于波阻抗时，该负荷所消耗的功率即为自然功率，是纯有功功率<\/p>", "<p>导线型号不变情况下，线路电压等级越高，波阻抗越大，自然功率也越大<\/p>", "<p>导线型号不变情况下，电压等级越高，波阻抗越大，自然功率越小<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/UlLZbTJvSGV5BVPpiygr0sjtMs2cFlrBDbx659VO.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33908", "t": 2, "q": "自然功率常用于估计超高输电线路首、末端电压之间的数值关系，关于自然功率与电压之间的关系下面正确的是（     ）。", "a": ["线路传输功率大于自然功率时末端电压低于首端电压", "线路传输功率小于自然功率时末端电压高于首端电压", "线路传输功率等于自然功率时末端电压等于首端电压", "线路传输功率小于自然功率时末端电压超前于首端电压", "", ""], "r": "ABC", "e": "【定位】第2章，第3节，知识点8：波阻抗与自然功率\n【解析】线路输送功率等于自然功率时，线路末端电压等于首端电压；大于自然功率时，线路末端电压低于首端电压；小于自然功率时，线路末端电压高于首端电压", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33909", "t": 2, "q": "<p>电力系统负荷的运行特性包括（ ）。<\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260731/k26HELdYQiDUe2T8LuG1qpjNcJYACzzxcox22jiP.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/8NifWD1m1MWjnAYFPyg2v5mjyISogbxvEaLnbfM5.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/FleaaTcyz05Lq4y29WZyN00bdPjLABHE9B3eRrkr.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/y5cxt5fYpTEPilM5ai8EjsbRaWlPcbTzkLfx7eTT.png\"><\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/Fe0nR4H7VzygEtRaJbhithzEodcaVMyUBetddMHc.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33910", "t": 2, "q": "关于负荷曲线，下述说法正确的是（     ）。", "a": ["负荷曲线反映了某一时间段内负荷随时间变化的规律", "无功功率日负荷曲线的用途较小，一般不绘制", "有功功率年最大负荷曲线常用于制定发电设备的检修计划", "有功功率日负荷曲线常用于安排电力系统的发电计划", "", ""], "r": "ABCD", "e": "【定位】第2章，第4节，知识点3：电力系统常用的负荷曲线\n【解析】负荷曲线反映了某一时间段内负荷随时间变化的规律。有功功率年最大负荷曲线常用于制定发电设备的检修计划。有功功率日负荷曲线常用于安排电力系统的发电计划。无功功率日负荷曲线的用途较小，一般不绘制。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33911", "t": 2, "q": "采用标么值计算时，通常选择（     ）的基准值，其它电气量的基准值可以根据它们之间的关系导出。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260731/hTQTUGXFlF2JlEyurb7OSTdnSavgsGnwjg7Ej1HC.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/J5eTPIxWJrRh1He9zVMgRpO9AUeVe7K71pQgXW9x.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/oaHrj27bBWC2CTRTX8bOZDtbWiKW7Dp3n2Q1xqLz.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/rbpv5E4AVNKYvQCSQpB3HRF8XC1c1ClgFkjOyIFg.png\"><\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/TAow4XxKm0SI7BKzx5WeIlJqd31oQutjOk6dTKxG.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33912", "t": 2, "q": "以变压器额定电压和额定容量为基准值时，关于变压器参数标幺值正确的有（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260731/6NFnz7BliLJH6DZWvTDJXCFZbpJvh4anXSieS16M.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/ItfY1ZIVLvkwLUUYe6Qz9qaKhHC4cPhjfrG9XqRT.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/bStdErOQ4aAxUThVmhXViik4rKvvrC2SQsDwoguE.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/nlUmW0pzmZcAKHmNlKetF7wdpbMPS5Guaj85RraS.png\"><\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/4g3pcpRigcUlp8QjjNTmskHOOIpmZcA6VHKGqo2q.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33913", "t": 2, "q": "标幺值的优点有（     ）。", "a": ["<p>三相电路的计算公式与单相电路的计算公式完全相同<\/p>", "<p>线电压的标幺值与相电压的标幺值相等，三相功率的标幺值和单相功率的标幺值相等<\/p>", "<p>只需确定各电压等级的基准值，而后直接在各自的基准值下计算标幺值，不需要进行参数和计算结果的折算<\/p>", "<p>元件参数比较接近，易于进行计算和对结果进行分析比较<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/Qy6Yzm8G1aE2m8EquWa2m85t0LfY8NzwpKvwvrwf.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33914", "t": 2, "q": "关于电力系统标幺值，下面说法正确有（     ）。", "a": ["标幺值无量纲", "标幺值随基准值的变化而变化", "电力系统常选择功率和电压的基准值", "标幺值的物理概念不如有名值清晰", "", ""], "r": "ABCD", "e": "【定位】第2章，第5节，知识点3：标幺制等值电路\n【解析】标幺值是实际物理量与基准值的比值，单位在计算中被约去（如电压标幺值=实际电压/基准电压，单位“伏特/伏特”无量纲）。选项A正确；标幺值的定义依赖于基准值。例如，若基准电压从10kV调整为20kV，同一实际电压15kV的标幺值会从1.5变为0.75。选项B正确；电力系统分析中，通常先设定基准功率（如100MVA）和基准电压（如额定电压），其他基准值（电流、阻抗）通过公式推导得出。选项C正确；有名值直接表示物理量的大小（如10kV），而标幺值需结合基准值才能转换为实际值（如标幺值0.1需基准值100kV对应10kV）。因此，标幺值的物理意义需额外解释，不如有名值直观。选项D正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33915", "t": 2, "q": "关于功率、电压、电流、阻抗和导纳经变压器变换时的大小变化，正确的是（     ）。", "a": ["<p>电压和电流有名值变化，标幺值不变<\/p>", "<p>阻抗和导纳有名值变化，标幺值不变<\/p>", "<p>功率有名值变化，标幺值不变<\/p>", "<p>功率有名值和标幺值都不变<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/2nsIant3ftW9wwWKymZkpX0i5M66VcElgB9LSpE6.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33916", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/Ft8JWaaWD0JVHqJJNPKQsP29G0KIP5yF8eLgYUCQ.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260731/LcVgbSpaHzVmGerXEa8ZV6Tn6lrLbBxlgH2w7ZtN.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/c8uMrPbxM79RvKWKqRbEqpElJYt8BLvG1RhwQukS.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/KO2FsZf84VP0HqdhT8vEkh3zNkeUJyAfUJogmsRb.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/BrxGE151MIm0sLwozjRYMMWscEIkge4KgRLUgP13.png\"><\/p>", "", ""], "r": "AD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/5Ctur48ThakZZo3IJeu1uSCNnxjDGEptDbUupeCl.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33917", "t": 2, "q": "关于三绕组自耦变压器，下列说法正确的是（     ）。", "a": ["<p>高压、中压绕组之间既有磁联系又有电联系<\/p>", "<p>接线采用YN，yn，d<\/p>", "<p>接线采用YN，yn，y<\/p>", "<p>低压绕组与高压、中压绕组之间只有磁联系<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/gzMAFJlIyIExDmnbykve77ISP6pLLNisFCzxCSzL.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33918", "t": 2, "q": "发电机进相运行时，其对应的无功功率特点是（     ）。", "a": ["<p>消耗容性无功<\/p>", "<p>消耗感性无功<\/p>", "<p>发出容性无功<\/p>", "<p>发出感性无功<\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/XaBnuioHVYB9tplInIn3rLQcU4HoMHC2mtbcyJiV.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33919", "t": 2, "q": "同样导体材质的电缆和架空输电线路，关于其参数，说法正确的是（     ）。", "a": ["<p>电缆线路的电阻更大<\/p>", "<p>电缆线路的电抗更大<\/p>", "<p>电缆线路的电纳更大<\/p>", "<p>电缆线路的电导更大<\/p>", "", ""], "r": "AC", "e": "【定位】第2章，第3节，知识点1：电力线路的类型与结构\n【解析】电缆的散热差，所以电阻更大，A正确。由于相间距离小，所以线路电抗更小，C正确。两者电导都可以忽略，所以不选D。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33920", "t": 2, "q": "架空输电线路进行换位的目的是减少（     ）的不平衡。", "a": ["<p>电阻<\/p>", "<p>电抗<\/p>", "<p>电导<\/p>", "<p>电纳<\/p>", "", ""], "r": "BD", "e": "【定位】第2章，第3节，知识点4：架空线路的换位。\n【解析】选项A，影响单位长度导线电阻的因素包括材料的电阻率、导线截面积、导线运行温度，但是不会受到三相导线位置布局的影响。选项B，影响电抗的因素包括导线材质，导线等效半径、导线相间几何均距，由于电抗受到距离影响，所以改变距离会降低三相导线之间电抗参数的不平衡。选项C，电导受导线电晕和泄漏电流损耗的影响，这两种量并不受导线位置布局的影响，并且一般导线都认为电导是0。选项D，电纳和电抗一样，与导线的位置布局有关系，所以导线三相换位可以降低三相电纳的不平衡。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33921", "t": 2, "q": "关于电晕现象描述正确的是（     ）。", "a": ["<p>发出淡蓝色的光<\/p>", "<p>有声响<\/p>", "<p>产生有功损耗<\/p>", "<p>产生无功损耗<\/p>", "", ""], "r": "ABC", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算。\n【解析】电晕现象是强电场作用下导线周围空气的电离现象，它的产生与导线本身和导线周围空气的条件（空气中离子的数量、大小、电荷量等因素）有关。电晕是电力系统中重要的电能损耗原因之一，选择C选项，D选项不对。在电离处出现蓝色荧光，选择A选项，产生一些腐蚀性的气体，造成线路的腐蚀。发出可闻噪声，选择B选项。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33922", "t": 2, "q": "标幺值的特点包括（     ）。", "a": ["<p>线电压标幺值与相电压标幺值相等<\/p>", "<p>三相功率标幺值与单相功率标幺值相等<\/p>", "<p>某元件的阻抗经变压器变换后，其标幺值不随电压等级的变化而改变<\/p>", "<p>功率的有名值经变压器变换后，不发生改变<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/JsBhdJiJt4VsvSR4ANzmv9DxgrGRiR78MR6h53A5.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33923", "t": 2, "q": "关于同步发电机运行，下面说法中正确的是（     ）。", "a": ["<p>发电机“进相”运行时输出有功功率，吸收感性无功功率<\/p>", "<p>发电机“滞相”运行时输出有功功率和感性无功功率<\/p>", "<p>发电机的正常运行方式是“滞相”运行<\/p>", "<p>额定条件下运行时，发电机输出的视在功率最大<\/p>", "", ""], "r": "ABCD", "e": "【定位】第2章，第1节，知识点4：隐极式同步发电机的运行极限图（P-Q运行极限图）（P-Q运行极限图）\n【解析】同步发电机滞相运行是第一象限，是同步发电机的正常运行方式、输出有功功率同时输出感性无功功率；同步发电机进相运行是第二象限，是同步发电机的正常运行方式、输出有功功率同时吸收感性无功功率。额定条件下运行时，发电机的有功和无功都达到额定值，此时发电机工作在最大视在功率的情况下，发电机的容量得到充分利用。综上可知，正确答案应选ABCD。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33924", "t": 2, "q": "关于变压器等值电路和参数，下面说法正确的是（     ）。", "a": ["<p>变压器采用τ形等值电路是因为其比T形等值电路精确<\/p>", "<p>变压器采用τ形等值电路是因为其比T形等值电路独立节点数少<\/p>", "<p>τ形等值电路中变压器电纳远远大于电导<\/p>", "<p>τ形等值电路中变压器电抗远远大于电阻<\/p>", "", ""], "r": "BCD", "e": "【定位】第2章，第2节，知识点1：双绕组变压器的等值电路\n【解析】电力系统分析变压器形等值电路比T形等值电路精度要低，电力系统分析计算通常采用节点电压法，独立节点数越少，节点电压方程的个数越少，求解越方便，电力系统分析变压器采用形等值电路的原因是形等值电路比T形等值电路独立节点数少。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33925", "t": 2, "q": "变压器并联运行的理想条件是所有并联运行变压器的（     ）。", "a": ["变比相等", "短路电压相等", "绕组接线组别相同", "中性点绝缘水平相当", "", ""], "r": "ABC", "e": "【定位】第2章，第5节，知识点6：变压器的额定变比、实际变比、平均额定变比、标准变比与非标准变比\n【解析】变压器并联运行时需满足以下条件：\n1.变比相等（A）：若变比不等，二次侧会产生环流，增加损耗；\n2.短路电压相等（B）：短路电压（又称阻抗电压）是变压器的重要参数，反映其内阻抗大小。若短路电压不同，各变压器负载分配不均，可能导致过载；\n3.绕组接线组别相同（C）：组别不同会导致相位差，产生极大环流甚至设备损坏；\n4.容量相同（D）并非必要条件，只需在容量不同时满足其他参数匹配即可。\n故答案选ABC。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33926", "t": 2, "q": "电力系统负荷数学模型的是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260731/dTiHHiQ5Pq7raZ5eFQZDxRpSl3KxS1sEjl8X0rtR.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/zp4x2JaBbs8BsuPBFJPCA05TXCrxCWPpYWHnVBXa.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/NsowbQgCB0kbn6au9kG4NG7rimKoGmvczb09c7pe.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/koTntRITflP05MEJjYGh1TvpflS15NwjideWD4cM.png\"><\/p>", "", ""], "r": "CD", "e": "【定位】第2章，第4节，知识点5：负荷的数学模型\n【解析】稳态分析时，频率非常接近额定频率，各点电压非常接近额定电压，所以电力系统稳态分析（潮流计算）时，就认为系统频率和各用电设备电压为额定值，负荷消耗的功率保持其额定功率不变，即稳态分析时负荷用恒功率模型表示。电力系统发生故障时电压大幅度下降，负荷消耗的功率亦随之大幅度变化，不能再用恒功率模型表示，而采用恒阻抗模型表示。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33927", "t": 2, "q": "发电机在运行中受到哪些条件的限制？（     ）", "a": ["定子绕组温升", "励磁绕组温升", "原动机输入功率", "定子端部温升", "", ""], "r": "ABCD", "e": "【定位】第2章，第1节，知识点3：同步发电机的运行限制\n【解析】发电机运行时首先受定子绕组温升限制，绕组电流过大发热超标会损坏绝缘，励磁绕组长时间过载会造成励磁绕组温升过高引发绝缘老化损坏，原动机的最大输入功率决定了发电机能够输出的有功功率上限，无法超过原动机的出力，同时定子端部区域磁场集中、散热条件较差，定子端部温升也是重要的运行约束条件，以上四项均会限制发电机的正常运行出力，因此ABCD四个选项均正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33928", "t": 2, "q": "国产三绕组变压器一般类型有（     ）。", "a": ["100/100/100", "100/50/50", "100/50/100", "100/100/50", "", ""], "r": "ACD", "e": "【定位】第2章，第2节，知识点3：三绕组变压器类型\n【解析】三绕组变压器高、中压绕组容量一般为全容量，第三绕组有的是全容量，有的是半容量。三绕组变压器按变比分有：100/100/100，100/100/50，100/50/100。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33929", "t": 2, "q": "多绕组变压器的额定容量不正确的是（     ）。", "a": ["最大的绕组额定容量", "各个绕组额定容量的平均值", "各个绕组额定容量之和", "最小的绕组额定容量", "", ""], "r": "BCD", "e": "【定位】第2章，第2节，知识点3：三绕组变压器类型\n【解析】多绕组变压器额定容量指的是最大绕组的额定容量。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33930", "t": 2, "q": "线路电能损耗是由于线路导线存在（     ）及（     ）。", "a": ["电阻", "电容", "电晕", "电感", "", ""], "r": "AC", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】输电线路的电能损耗主要分为两部分，一是电流通过导线电阻产生的电阻有功损耗，属于导线的基本铜耗，二是高压线路电压过高时会发生电晕放电现象，产生电晕损耗消耗有功电能，电感和电容属于储能元件，只进行无功功率的交换，不会产生有功电能损耗，因此线路电能损耗由电阻和电晕引起，本题选择AC。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33931", "t": 2, "q": "电缆线路主要由（     ）构成。", "a": ["避雷线", "绝缘层", "导线", "保护层", "", ""], "r": "BCD", "e": "【定位】第2章，第3节，知识点1：电力线路的类型与结构\n【解析】电缆线路核心组成部分包括作为导电传输载体的导线、包裹在导线外部用来隔离带电导体防止漏电击穿的绝缘层以及包覆在绝缘层外侧抵御外力破坏、防潮防腐、延长电缆使用寿命的保护层，避雷线一般架设于架空输电线路杆塔顶端用于防雷保护，不属于电缆线路的组成结构，因此本题选择BCD。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33932", "t": 2, "q": "架空线路由（     ）、金具组成。", "a": ["导线", "避雷线", "杆塔", "绝缘子", "", ""], "r": "ABCD", "e": "【定位】第2章，第3节，知识点1：电力线路的类型与结构\n【解析】架空线路由导线、避雷线、绝缘子、金具、杆塔组成。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33933", "t": 2, "q": "下面属于线路参数的是（     ）。", "a": ["电纳", "电抗", "电阻", "电导", "", ""], "r": "ABCD", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】电导、电纳、电阻、电抗是线路的四个参数。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33934", "t": 2, "q": "影响金属导体电阻大小的因素有（     ）。", "a": ["导线材料", "导电部分的截面积", "导线的长度", "温度", "", ""], "r": "AB", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】由导体电阻的计算公式可知，导线电阻取决于导线电阻率和截面积，导线电阻率取决于导线的材质。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33935", "t": 2, "q": "线路的电导取决于（     ）。", "a": ["沿绝缘子串的泄露", "电晕", "导线材料", "导线与大地的距离", "", ""], "r": "AB", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】电导参数取决于电晕损耗和沿绝缘子串的泄漏损耗，与导线材料，导线与大地距离无关。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33936", "t": 2, "q": "架空输电线路和电缆输电线路参数关系，正确的是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260731/OmtMSNR66J1TClzlgV0qgAJOjbwshyY2DeTGr0Ms.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/Rk5MAQvWu0AAWiqiilnUk7jzQMn3ZurzkRS0KLPl.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/MB5CJK9AFa16naBzYC49Maq7yqmausHs3kw9omX2.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/6BctfybAwbME8t4xLz1ILsshjQp8R26JYLUNsnSC.png\"><\/p>", "", ""], "r": "AC", "e": "【定位】第2章，第3节，知识点6：电缆线路参数\n【解析】由于电缆输电线路长度远小于架空输电线路长度，且结构不同。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33937", "t": 2, "q": "下列属于常用的负荷曲线的是（     ）。", "a": ["有功日负荷曲线", "有功年最大负荷曲线", "年持续负荷曲线", "以上都不对", "", ""], "r": "ABC", "e": "【定位】第2章，第4节，知识点3：电力系统常用的负荷曲线\n【解析】有功日负荷曲线、有功年最大负荷曲线、年持续负荷曲线均是常用的负荷曲线。选ABC。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33938", "t": 2, "q": "标幺值法进行电力系统潮流计算时，一般取（     ）为基准。", "a": ["U", "I", "S", "Z", "", ""], "r": "AC", "e": "【定位】第2章，第5节，知识点3：标幺制等值电路\n【解析】电力系统潮流计算时，一般采用5个物理量，即：S、U、I、Z、Y，但这5个物理量满足3个约束关系，故在计算时一般取2个物理量为基准即可。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33939", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/eK4xGB6WTiUDME3tqWWv17sdnHd5Yt4zLn6L1aIW.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，第1节，知识点1：复功率的表达形式\n【解析】容性负荷吸收容性无功功率等效于发出感性无功功率，因此消耗的感性无功功率为负值。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33940", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/cdudXZrdoVzrUIguGA8lfIOVvAzewASfcSJ8UxE4.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/Cmf1cuFcraxyJqRDXUcARaTu8j7dmaYDxRZeuhE4.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33941", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/gLRCFg49HYvMVSgYaQYS1GEtc6q75izRVwsPERAS.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/FsSzVZmn6qydoVlPPUNFFmj9raZBE4fEoNA0yoiT.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33942", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/eTku7lG1HGEopyXt1V6FXLOrsqaNIwMNgmHdUNmM.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/3WjjsXfEaLwCS5jYoZ6zqQcr6pCTjhFZJLyArKku.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33943", "t": 3, "q": "同步发电机输出有功功率上限由原动机最大出力确定，下限由机组最小技术出力确定。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第1节，知识点3：同步发电机的运行限制\n【解析】根据能量守恒定律，同步发电机输出有功功率最大由原动机输入的最大机械功率决定。而受发电机组本身最小技术出力限制，有最小出力约束。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33944", "t": 3, "q": "发电机额定条件下运行时输出的视在功率最大。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第1节，知识点4：隐极式同步发电机的运行极限图（P-Q运行极限图）\n【解析】由发电机的PQ运行图可知，发电机额定条件下运行，有功功率和无功功率合成的视在功率最大。因此在额定运行情况下，发电机能够发挥最大容量。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33945", "t": 3, "q": "发电机的正常运行方式是“滞相”运行。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第1节，知识点4：隐极式同步发电机的运行极限图（P-Q运行极限图）\n【解析】发电机的正常运行发出有功功率和无功功率，无功功率大于零，因此是“滞相”运行。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33946", "t": 3, "q": "导线半径大小对超高压架空线路电导的影响远大于导线之间的几何平均距离。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/b2gks7DCFJRYa7zNL15a6Agt6q2BuyGsK0F1X8Pj.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33947", "t": 3, "q": "同电压等级的架空输电线路，导线平行布置时的电抗大于导线等边三角形布置时的电抗。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】由于同电压等级的架空输电线路，导线平行布置比等边三角形布置时的几何平均距离大，平行布置的电抗大于导线等边三角形布置时的电抗。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33948", "t": 3, "q": "同电压等级的架空输电线路，导线平行布置时的电纳大于导线等边三角形布置时的电纳。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】由于同电压等级的架空输电线路，导线平行布置比等边三角形布置时的几何平均距离大，导线平行布置时的电纳小于导线等边三角形布置时的电纳。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33949", "t": 3, "q": "架空输电线路导线平行布置时，边相的电晕临界电压比中间相高。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/aDTRR5W8UkO9hylF0lkv2xe3nwG2cxsRXXBgJhsA.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33950", "t": 3, "q": "分裂导线改变了导线周围的磁场分布，是线路电抗减小的原因。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点5：分裂导线输电线路\n【解析】架空线路采用分裂导线等值增大导线的计算半径，改变了导线周围的磁场分布，减小了线路电抗。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33951", "t": 3, "q": "分裂导线改变了导线周围的电场分布，是线路电纳增大的原因。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点5：分裂导线输电线路\n【解析】架空线路采用分裂导线等值增大导线的计算半径，改变了导线周围的电场分布，增大了线路的电纳。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33952", "t": 3, "q": "分裂导线改变了导线周围的电场强度，是线路电晕临电压提高的原因。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点5：分裂导线输电线路\n【解析】架空线路采用分裂导线等值增大导线的计算半径，改变了导线周围的电场强度，提高了电晕临界电压。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33953", "t": 3, "q": "负荷的时间特性是指负荷消耗的功率随时间的变化情况，用负荷曲线表示。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点2：电力系统负荷运行特性分类\n【解析】负荷曲线是负荷消耗的功率随时间变化的规律。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33954", "t": 3, "q": "影响负荷有功功率的主要是系统频率，电压的影响较小。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点2：电力系统负荷运行特性分类\n【解析】负荷有功功率与系统频率关系较大，受电压的影响较小。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33955", "t": 3, "q": "影响负荷无功功率的主要是电压，频率的影响较小。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点2：电力系统负荷运行特性分类\n【解析】负荷无功功率与系统电压关系较大，受频率的影响较小。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33956", "t": 3, "q": "标幺制最大缺点是无量纲，物理概念不如有名值清晰。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/6avT27SQf5mKEgGKTZQqn0TZMrcU4kx6vmC9flHd.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33957", "t": 3, "q": "定出力运行发电机稳态分析计算时的数学模型为恒功率源。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第1节，知识点5：电力系统稳态分析时同步发电机的数学模型及约束条件\n【解析】定出力发电机发出的有功功率和无功功率均为恒定值，因此稳态运行时的数学模型可看作恒功率模型。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33958", "t": 3, "q": "对于容量比不是1：1：1 的三绕组变压器，根据铭牌所给出的短路电压和短路损耗计算变压器参数时，短路损耗需要先归算到额定容量之下，短路电压不需要归算。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第2节，知识点4：三绕组变压器的等值电路及参数计算\n【解析】按照国标规定，制造厂提供的短路损耗是短路试验中实际测量得到的变压器有功损耗，计算时需要将对应容量下测得的短路损耗归算到变压器额定容量（额定电流）之下；制造厂家提供的短路电压是已经归算到变压器额定容量（额定电流）下的数值，计算时无需再进行归算。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33959", "t": 3, "q": "同样导线截面情况下，电缆线路的电抗小于架空线路电抗。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点6：电缆线路参数\n【解析】电缆线路三相导线距离远远小于架空线路，所以电缆线路的电抗远小于架空线路电抗。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33960", "t": 3, "q": "同样导线截面情况下，电缆线路的电纳小于架空线路电纳。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点6：电缆线路参数\n【解析】电缆线路三相导线距离远远小于架空线路，所以电缆线路电纳远大于架空线路电纳。说法错误，选项为B。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33961", "t": 3, "q": "电缆线路电导与架空线路电导都是反映电晕损耗的参数。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点6：电缆线路参数\n【解析】架空线路电导反映的是电晕损耗，电缆线路的电导反映电缆绝缘介质的损耗，二者所反映的物理现象不同。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33962", "t": 3, "q": "同样导线截面情况下，电缆线路的电阻略大于架空线路电阻。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第2章，第3节，知识点6：电缆线路参数 【解析】由于集肤效应和邻近效应影响，同样导体截面情况下，电缆线路的电阻略大于架空线路电阻。<\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33963", "t": 3, "q": "为满足系统综合负荷的用电需求，系统中所有发电机所发功率的总和称为系统发电负荷。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点1：电力系统的负荷\n【解析】为满足系统综合负荷的用电需求，系统中所有发电机所发功率的总和称为系统发电负荷。发电负荷=电力系统综合负荷+电力网功率损耗+系统中发电厂厂用电负荷。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33964", "t": 3, "q": "电力系统的有功日负荷曲线与无功日负荷曲线变化趋势完全相同。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第2章，第4节，知识点3：电力系统常用的负荷曲线\n【解析】无功功率与有功功率最大负荷不一定同时出现，变化趋势不一定相同。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33965", "t": 3, "q": "系统负荷的峰谷差（峰谷比）越小，表明系统用电越合理。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点4：关于电力系统负荷的几个基本概念\n【解析】峰谷差反映了负荷的波动情况，峰谷差越小，电力系统设备利用率越高，系统用电情况越合理。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33966", "t": 3, "q": "电力系统稳态分析时负荷用恒功率模型表示，是基于正常运行时负荷端电压和系统频率保持不变的假设。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点5：负荷的数学模型\n【解析】电力系统正常运行时，频率在额定值附近做微小波动，各用电设备的端电压在其额定电压附近微小波动。稳态分析时，近似认为负荷端电压和系统频率为额定值并保持不变，负荷吸收的有功功率和无功功率为恒定值，负荷用恒功率模型表示。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33967", "t": 3, "q": "电力系统故障分析时，负荷用恒阻抗模型表示。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点5：负荷的数学模型\n【解析】电力系统故障分析时，电压严重降低，负荷不能再用恒功率模型表示。但其阻抗基本不变，所以故障分析时负荷用恒阻抗模型表示。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33968", "t": 3, "q": "电力系统等值电路有有名制等值电路和标幺制等值电路两种。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第5节，知识点2：有名制等值电路\n【解析】有名制等值电路和标幺制等值电路是电力系统两种等值电路。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33969", "t": 3, "q": "有名制计算时，在没有明确要求的情况下，通常选择最高电压等级作为基本级。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第5节，知识点2：有名制等值电路\n【解析】有明确要求时，根据计算的方便性选择基本级；没有明确要求的情况下，通常选择系统中的最高电压等级作为基本级。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33970", "t": 3, "q": "电力系统电压、电流、阻抗、功率、导纳5个参数基准值选择时自由度为2。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/jYbFi6Dmeq4mFYrF5g6kzpcMnTJwAYkrvgeZzgDN.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33971", "t": 3, "q": "参数和变量标幺值大小随基准值变化而变化。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第5节，知识点3：标幺制等值电路\n【解析】标幺值=有名值/基准值；同一有名值，其标幺值随基准值变化而变化。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33972", "t": 3, "q": "电力系统基准值变化时，标幺值换算原则为换算前后有名值保持不变。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第2章，第5节，知识点3：标幺制等值电路\n【解析】无论用什么基准值进行标幺值计算，换算前后有名值保持不变。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33973", "t": 3, "q": "各电压等级的平均额定电压一定为其额定电压的1.05倍。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第2章，第5节，知识点4：平均额定电压\n【解析】35kV电压等级的平均额定电压为37kV；110kV电压等级的平均额定电压为115kV；220kV的平均额定电压为230kV；均不是各个额定电压的1.05倍。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33974", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/jJ5DFqKfD3i324g5EvMjjRRFXi1t5fzdjgGbygiv.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/pKgbKoeBywqAY1aj6yRhcAaK2OPZ1JIfKGMLmkBg.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33975", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/5W4dL5utLaSDHunEoXeBWZAD2qBQBlL3sXEd4Mu4.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/JZyJOe9wfgDfUanNEDyRaQcdQ35orhWZQHubjC5H.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33976", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/vH860h78c7A8w2jIhNliCqWkf5YkKrkzsKAhysja.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，第5节，知识点7：等值变压器模型与多电压级网络的参数归算\n【解析】应用等值变压器模型时，所有参数和变量可不进行电压级归算。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33977", "t": 3, "q": "三绕组自耦变压器中，自耦连接的高压绕组和中压绕组之间的漏抗小于普通三绕组变压器高压绕组与中压绕组之间的漏抗。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，第2节，知识点5：自耦变压器的结构与特点\n【解析】三绕组自耦变压器中，自耦连接的高压绕组和中压绕组不仅有磁联系，也有电气联系，之间的漏抗小于普通三绕组变压器高压绕组与中压绕组之间的漏抗。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33978", "t": 3, "q": "同电压等级的架空输电线路，导线平行布置比等边三角形布置时的几何平均距离大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/m9QxiSH4kthbrnKqMFRHPQMJs7wPexC8Dq75QhRI.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33979", "t": 3, "q": "负荷功率需求是发电机发出有功和无功功率限额的约束条件。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第2章，第1节，知识点3：同步发电机的运行限制\n【解析】负荷功率需求：用户侧需要的有功和无功功率总和，是电力系统需要满足的目标。\n发电机功率限额：发电机因物理特性（如额定容量、励磁限制、电压稳定等）所允许的最大有功和无功输出，属于系统的约束条件。这两个概念不要混淆。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33980", "t": 3, "q": "水平排列的三相导线中间相比边相更容易发生电晕现象。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算。\n【解析】对于导线水平排列的架空输电线路，边相导线的电晕临界电压较上式求得的高6%，中间相则低4%。故选A。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33981", "t": 3, "q": "发电机的额定容量是指在规定的运行条件下能够连续输出的最大容量。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，第1节，知识点4：隐极式同步发电机的运行极限图（P-Q运行极限图）。\n【解析】发电机的额定容量是指其在设计工况下（如额定电压、额定电流、额定功率因数等）能够长期安全运行的最大输出容量。部分发电机在特殊情况下（如系统故障需临时支撑电压）可短时过载，但这属于非额定运行状态，且过载时间和幅度受严格限制（如不超过额定值的 10%且持续时间不超过30分钟）。这种短时过载并非 “额定容量” 的定义范畴，额定容量始终是指可长期持续运行的最大容量。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33982", "t": 3, "q": "同样导线截面情况下，电缆线路的电容比架空线路的电容大得多。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点6：电缆线路参数\n【解析】电缆线路三相导线距离远远小于架空线路，所以电缆线路的电抗远小于架空线路电抗；电缆线路电纳远大于架空线路电纳；由于集肤效应和邻近效应影响，同样导体截面情况下，电缆线路的电阻略大于架空线路电阻；同样导体截面情况下，电缆线路的电容比架空线路的电容大得多。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33983", "t": 3, "q": "一台容量为8000kVA、短路电压为5.56%、变比为20kV/0.8kV、接线为Yy的三相变压器，因需要接到额定电压为6.3kV的系统上运行，当基准容量取100MVA 时，该变压器的阻抗标幺值应为0.7。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/AF4EbwFp8385JezlzM71I6zcGhvDaXkmXNruuUgC.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}]}, {"k": "电力系统基础||第3章", "n": "电力系统基础 / 第3章", "qs": [{"id": "34437", "t": 1, "q": "电力系统潮流分布是指电力系统正常稳态运行情况下的（     ）分布。", "a": ["功率和电压", "电压和电流", "电流和功率", "功率", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点1：电力系统潮流分布与潮流计算\n【解析】正常稳态运行情况下电力系统的功率分布和电压分布称为电力系统潮流分布。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34438", "t": 1, "q": "电力系统潮流分布属于（     ）问题。", "a": ["稳态", "暂态", "稳定性", "故障分析", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点1：电力系统潮流分布与潮流计算\n【解析】正常稳态运行情况下电力系统的功率分布和电压分布称为电力系统潮流分布。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34439", "t": 1, "q": "电力系统潮流计算目的不包括（     ）。", "a": ["为系统运行安全性评估提供依据", "为系统运行电压质量评估提供依据", "为系统运行经济性评估提供依据", "为系统运行频率质量评估提供依据", "", ""], "r": "D", "e": "【定位】第3章，第1节，知识点1：电力系统潮流分布与潮流计算\n【解析】电力系统潮流计算的是正常稳态情况下的电力系统功率分布、电压分布以及电力网的功率损耗（主要是有功损耗）；计算的目的是为评估电力系统运行的安全性、经济性以及供电质量提供基础数据，其中供电质量指的是电压质量。由于潮流计算没有计算系统运行频率，所以不能为系统运行频率质量评估提供依据。选项为D。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34440", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/c7B6Sx3AlO6o21GNtCzyRXolMyMif9f9MtkjKr3p.png\"><\/p>", "a": ["<p>一相功率<\/p>", "<p>两相功率<\/p>", "<p>三相功率<\/p>", "<p>一、两相都可<\/p>", "", ""], "r": "C", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】功率计算公式，既可表示三相值（U为线电压，S为三相功率），也可表示单相值（U为相电压，S为一相功率）。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34441", "t": 1, "q": "无功功率通过线路电阻时，（     ）。", "a": ["<p>产生有功功率损耗<\/p>", "<p>产生无功功率损耗<\/p>", "<p>不产生有功功率损耗<\/p>", "<p>既不产生有功功率损耗也不产生无功功率损耗<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/Ce4MC2IhNvZH89dlRJ5BtG9sDGXQzJbOu2tT729I.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34442", "t": 1, "q": "有功功率流过线路电阻时，（     ）。", "a": ["<p>产生有功功率损耗<\/p>", "<p>产生无功功率损耗<\/p>", "<p>既产生有功功率损耗，也产生无功功率损耗<\/p>", "<p>无法确定<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/smV1qCyNo7R7f2ISKXoNwF6Pg3Q7YTladj7evaUm.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34443", "t": 1, "q": "无功功率流过电抗时，（     ）。", "a": ["<p>会产生有功损耗<\/p>", "<p>会产生无功损耗<\/p>", "<p>既会产生有功损耗，也会产生无功损耗<\/p>", "<p>不会产生无功损耗<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/ZKb0MDZIPZsrU5n7Mh6RymBByPSEAo3g5eyVG4TL.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34444", "t": 1, "q": "有功功率流过电抗时，（     ）。", "a": ["<p>会产生有功损耗<\/p>", "<p>会产生无功损耗<\/p>", "<p>既会产生有功损耗，也会产生无功损耗<\/p>", "<p>不会产生无功损耗<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/mVwmAw9LdfrfHWSCMNI4urEZbVPwyyoO4LYwR4FT.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34445", "t": 1, "q": "有功功率流过线路阻抗时，（     ）。", "a": ["<p>只产生有功损耗<\/p>", "<p>只产生无功损耗<\/p>", "<p>不产生无功损耗<\/p>", "<p>既产生有功损耗也产生无功损耗<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/PlmA1mPjSiEs4br98Y5kz9rA2nzu0YvXYuL5ofWW.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34446", "t": 1, "q": "无功功率流过线路阻抗时所产生的功率损耗（     ）。", "a": ["<p>只能是有功<\/p>", "<p>只能是无功<\/p>", "<p>不能是无功<\/p>", "<p>既有有功也有无功<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/pchiUPM57Jh9Fe0kF79djRAwxJPJhQzzlOnszKKT.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34447", "t": 1, "q": "高压线路阻抗支路的电压损耗主要由（     ）引起的。", "a": ["<p>有功电流流过电阻<\/p>", "<p>有功电流流过电抗<\/p>", "<p>无功电流流过电阻<\/p>", "<p>无功电流流过电抗<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/TDi6KtRRKDBAo9O9xrMrCYHAlG7vdwm9xiWXOZxb.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34448", "t": 1, "q": "高压线路阻抗支路的电压损耗主要由系统参数（     ）引起。", "a": ["<p>有功功率<\/p>", "<p>无功功率<\/p>", "<p>电阻<\/p>", "<p>电抗<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/rSQpoagd3aSlBZ8WZJir9YbTdjwnQHR8QsZY5bMg.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34449", "t": 1, "q": "设n台相同的变压器并列运行，变压器运行电压为U(kV)，通过功率为S(MVA)，n台变压器总无功损耗为（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260727/spEUuqdvwH3uiLkqSsFTgjkM2QtTUHhoFoFkVt7O.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/Y55XzFFbzvsjVlwHmgbhogy4WjjojJ2AjUlVmYpW.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/4argS2bOIsSsXQfS1JTe8YYDwpSjICqqZSJCATkj.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/Thq7wpkFzrlg85JsfDPFIqGT0i60SPBQUSRkk9RH.png\"><\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/3ZuMTL3quvBAK4g5PaoAamnQwyAFRdcIKos4LrFR.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34450", "t": 1, "q": "变压器中电压降落纵分量△UT主要取决于变压器的（     ）。", "a": ["电阻", "电抗", "电导", "电纳", "", ""], "r": "B", "e": "【定位】第3章，第1节，知识点7：具有普遍意义的结论\n【解析】电抗大于电阻，纵分量主要取决于电抗。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34451", "t": 1, "q": "关于输电线路阻抗的功率损耗，下面描述错误的是（     ）。", "a": ["<p>为变动损耗<\/p>", "<p>与输送功率大小有关<\/p>", "<p>与输送功率的性质无关<\/p>", "<p>与输送功率的大小和性质都有关<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/3tZVinSF5N75KM3Cnj6DtfWMv3kdaE7DHPNkwzE5.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34452", "t": 1, "q": "关于输电线路导纳支路的无功损耗，下面描述错误的是（     ）。", "a": ["<p>与传输功率大小和性质无关<\/p>", "<p>为负值<\/p>", "<p>与电压成正比<\/p>", "<p>与电压平方成正比<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/29Zo1nMNYLcP3OfVdh4tbrt8wwVTaH0OTLhXqkRG.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34453", "t": 1, "q": "高压线路阻抗支路的电压损耗主要由运行参量（     ）引起。", "a": ["<p>有功功率<\/p>", "<p>无功功率<\/p>", "<p>电阻<\/p>", "<p>电抗<\/p>", "", ""], "r": "B", "e": "<p>【定位】第3章，第1节，知识点3：阻抗支路的计算<\/p>\n<p>【解析】高压线路中电阻相对电抗较小，根据电压损耗公式ΔU=（PR + QX）/U，运行中无功功率Q变化对电压损耗影响显著，相比有功功率P，它是引起电压损耗的主要运行参量，所以选无功功率。<\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34454", "t": 1, "q": "关于输电线路的无功功率损耗，下面正确的是（     ）。", "a": ["<p>大于零<\/p>", "<p>小于零<\/p>", "<p>等于零<\/p>", "<p>以上三种情况都可能出现<\/p>", "", ""], "r": "D", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析\n【解析】线路负荷较轻时，线路电纳中吸收的容性无功功率大于电抗中消耗的感性无功功率的现象并不罕见。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34455", "t": 1, "q": "关于输电线路首、末端电压之间的大小关系，下面描述错误的是（     ）。", "a": ["<p>与传输功率的大小有关<\/p>", "<p>与传输功率的性质有关<\/p>", "<p>与传输功率的大小和性质都有关系<\/p>", "<p>与传输功率的大小有关和传输功率性质无关<\/p>", "", ""], "r": "D", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析\n【解析】根据输电线路输送功率与自然功率的关系，首端电压可能大于、小于或等于末端电压。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34456", "t": 1, "q": "关于单侧电源输电线路传输纯有功功率时，其首、末端电压之间的相位关系，下面描述正确的是（     ）。", "a": ["<p>首端电压超前于末端电压<\/p>", "<p>首端电压滞后于末端电压<\/p>", "<p>首端电压与末端电压相位相同<\/p>", "<p>以上三种情况都可能出现<\/p>", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点8：高压电网功率传输规律\n【解析】在单侧电源输电线路中，当传输纯有功功率时，线路自身存在电感特性。根据电路原理，电感会使电流滞后于电压。电能从首端向末端传输过程中，由于这种相位关系，首端电压的变化会先于末端电压，也就导致首端电压在相位上超前于末端电压，所以首端电压超于末端电压。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34457", "t": 1, "q": "输电线路传输纯无功功率时，关于首、末端电压之间的相位关系下面正确的是（     ）。", "a": ["<p>首端电压超前于末端电压<\/p>", "<p>首端电压滞后于末端电压<\/p>", "<p>首端电压与末端电压相位相同<\/p>", "<p>以上三种情况都可能出现<\/p>", "", ""], "r": "D", "e": "【定位】第3章，第1节，知识点8：高压电网功率传输规律\n【解析】输电线路传输纯无功功率时，首、末端电压相位关系受多种因素影响。线路自身存在阻抗特性，包括电阻和电抗。当线路参数（如电抗大小）、运行方式以及无功功率流向等不同时，电压相位关系会发生变化。比如，线路感抗和容抗的相对大小不同，可能使首端电压超前、滞后于末端电压，或者在某些特殊参数匹配下二者相位相同 ，所以以上三种情况都有可能出现。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34458", "t": 1, "q": "关于变压器运行中的无功功率损耗，下面正确的是（     ）。", "a": ["<p>大于零<\/p>", "<p>小于零<\/p>", "<p>等于零<\/p>", "<p>以上三种情况都可能出现<\/p>", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点6：变压器运行状况计算和分析\n【解析】变压器阻抗支路和导纳支路均为感性支路，无功损耗为正值。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34459", "t": 1, "q": "电力变压器传送纯有功功率时，下面正确的是（     ）。", "a": ["仅有有功损耗", "仅有无功损耗", "既有有功损耗，又有无功损耗", "既无有功损耗，也无无功损耗", "", ""], "r": "C", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】无论变压器只输送有功功率还是无功功率，均会在电阻上产生有功功率损耗，在电抗上产生无功功率损耗。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34460", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/q4w7Xcib2Xkkd7RdEnGaC41917r0gLNqZWwTgoZj.png\"><\/p>", "a": ["<p>电阻<\/p>", "<p>电抗<\/p>", "<p>无功功率<\/p>", "<p>有功功率<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/jLK5PNQYhWwyQEmayUnfjYSu3u8vcr2haMw06AuP.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34461", "t": 1, "q": "关于输电线路的无功损耗，下面正确的是（     ）。", "a": ["<p>大于零<\/p>", "<p>小于零<\/p>", "<p>等于零<\/p>", "<p>以上三种情况都可能出现<\/p>", "", ""], "r": "D", "e": "【定位】第3章，第1节，知识点6：变压器运行状况计算和分析\n【解析】变压器阻抗的功率损耗由负载率平方成正比，为变动损耗。与输送功率性质无关。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34462", "t": 1, "q": "关于变压器运行中的无功损耗，下面正确的是（     ）。", "a": ["<p>大于零<\/p>", "<p>小于零<\/p>", "<p>等于零<\/p>", "<p>以上三种情况都可能出现<\/p>", "", ""], "r": "A", "e": "<p>【定位】第3章，第1节，知识点7：具有普遍意义的结论 【解析】变压器运行时，其绕组存在电阻和电抗。电阻对应的有功损耗相对较小，而电抗对应的无功损耗较大。因为电阻远小于电抗，在建立磁场及能量交换过程中，电抗起主导作用，会消耗一定无功功率，使得变压器运行中的无功损耗大于零。<\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34463", "t": 1, "q": "变压器的有功损耗（     ）无功损耗。", "a": ["<p>大于<\/p>", "<p>小于<\/p>", "<p>等于<\/p>", "<p>不确定<\/p>", "", ""], "r": "B", "e": "<p>【定位】第3章，第1节，知识点7：具有普遍意义的结论 【解析】变压器中电阻远小于电抗，电抗在建立磁场及能量交换中主导作用强，产生较大无功损耗，使得有功损耗小于无功损耗。<\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34464", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/CtcUrfvoPJkA0jDBjedxkBf9gsIqK84lQSufJa0a.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260727/zARM3hHhEPm2EvWtVikL6HPo80BfRZrak4wVcWfy.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/CCHzTbAAVs6WEZMN3VWWTkBDj2XjlpxjfEAIITh1.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/bfEy5HlhqGFiTz9RaMSFgBjBY46qW9bKt380ptzG.png\"><\/p>", "<p>无法确定<\/p>", "", ""], "r": "C", "e": "【定位】第3章，第1节，知识点8：高压电网功率传输规律\n【解析】传输感性无功功率的方向为电压大的端向电压小的端，即首端电压大于末端电压，选C。A选项是指传输感性无功功率的方向为末端向首端；B选项是指线
