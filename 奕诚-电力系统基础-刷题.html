34695", "t": 3, "q": "抽水蓄能电厂兼备蓄能和发电的作用。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点4：抽水蓄能电厂\n【解析】抽水蓄能电厂中必须兼备抽水和发电两类设施：在电力负荷低谷时，抽水蓄能电厂是吸收低谷电能的电力用户（抽水工况）；待到电力系统负荷高峰时，抽水蓄能电厂是提供峰荷电力的发电厂（发电工况）。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34696", "t": 3, "q": "核电厂的核岛、汽轮机是核电厂的动力部分。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点5：核能发电厂\n【解析】核岛是核电站的核心区域，核燃料在反应堆内发生核裂变反应释放热能，加热冷却剂产生高温蒸汽；蒸汽输送至常规岛驱动汽轮机高速旋转，将热能转化为机械能，汽轮机再带动发电机产生电能。核岛负责核能到热能的转换，汽轮机负责热能向机械能的转换，二者共同构成核电厂的动力核心部分，为发电提供动力来源，因此题干说法正确，本题选A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34697", "t": 3, "q": "风能是流动的空气所具有的能量，是由太阳能转化而来的。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点6：新能源发电\n【解析】太阳辐射照射到地球表面时，不同区域受热程度存在差异，造成各地空气温度、密度不同，受热多的空气上升、受热少的冷空气下沉，空气发生定向流动便形成了风，所以风能本质上是太阳能转化而来。风能属于空气流动所携带的动能，因此题干表述正确，本题选A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34698", "t": 3, "q": "地热发电的能源是地下的蓄存的高热能源。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点6：新能源发电\n【解析】地球本身就是一个巨大的热库，其内部蕴藏的热能即“地热能” ，是取之不尽的可再生能源。地热发电是利用高温地热资源进行发电的方式，其原理与常规火力发电基本相同，只不过高温热源是地下储热。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34699", "t": 3, "q": "水电厂、风力发电厂、太阳能电厂属于清洁能源电厂，都属于新能源电厂。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第1节，知识点6：新能源发电\n【解析】清洁能源指在生产发电过程中污染物、温室气体排放极少的能源，水电、风电、太阳能发电均属于清洁能源。但新能源一般是指近代才开发利用、新近发展起来的能源类型，水电开发利用历史悠久，属于常规清洁能源，并不归属于新能源；风电、太阳能发电才属于新能源。因此题干中认为水电厂属于新能源电厂的表述错误，本题选B。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34700", "t": 3, "q": "电气一次设备是指电力系统进行监测、控制、调节和保护的设备。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第3节，知识点1：电气一次设备\n【解析】电气一次设备是指直接用于生产、输送和分配电能的生产过程中的高压电气设备，故选B。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34701", "t": 3, "q": "断路器主要用于隔离被检修的设备与带电部分，也可以接通和开断小电流。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第5节，知识点2：高压断路器\n【解析】隔离开关主要用于隔离被检修的设备与带电部分，也可以接通和开断小电流，故选B。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34702", "t": 3, "q": "<p>电流互感器的角度误差只与二次所接负载的大小和功率因数有关。（ ）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p>【定位】第4章，第6节，知识点2：电磁式电流互感器&nbsp;<\/p>\n<p>【解析】电流互感器的角差除了负载、功率因数以外，还与结构、材料有关。故选B。<\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34703", "t": 3, "q": "电流互感器容量大，表示其二次负载阻抗允许值大。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】电流互感器的容量以VA表示，指的就是二次绕组电流与电压的乘积。相同电流下，阻抗越大，电压越高，容量越大，故选A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}]}, {"k": "电力系统基础||第5章-考纲删除", "n": "电力系统基础 / 第5章-考纲删除", "qs": [{"id": "34704", "t": 1, "q": "下列哪些设备属于一次设备？（     ）", "a": ["自动重合闸", "备用电源自动投入装置", "继电保护装置", "电流互感器", "", ""], "r": "D", "e": "【定位】第5章，第1节，知识点1：电气一次与电气二次\n【解析】A项与B项都是自动控制设备，没有与高电压直接接触的部分，属于弱电，是二次设备，C项继保装置也是二次设备。D项的一次侧直接与高电压接触，属于一次设备。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34705", "t": 1, "q": "继电保护装置属于（     ）。", "a": ["<p>一次设备<\/p>", "<p>二次设备<\/p>", "<p>开关设备<\/p>", "<p>测量设备<\/p>", "", ""], "r": "B", "e": "【定位】第5章，第1节，知识点1：电气一次与电气二次\n【解析】继电保护装置是保证电气一次安全稳定运行所配置的继电保护设备，属于电气二次设备，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34706", "t": 1, "q": "中性点非直接接地系统发生单相接地故障时，下列说法不正确的是（     ）。", "a": ["中性点电压变为相电压", "非故障相电压升高为线电压", "故障点处只有很少的电容电流", "故障点处有很大的短路电流", "", ""], "r": "D", "e": "【定位】第1章，第1节，知识点5：电力系统中性点的运行方式\n【解析】ABC为中性点非直接接地系统发生单相接地短路时的特点，D为中性点直接接地系统发生单相接地短路时的特点，故选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34707", "t": 1, "q": "断路器防跳回路的作用是（     ）。", "a": ["防止断路器跳闸", "防止断路器合闸", "防止断路器跳闸，允许断路器合闸", "防止断路器多次跳、合闸", "", ""], "r": "D", "e": "【定位】第5章，第2节，知识点3：断路器的控制回路\n【解析】断路器短时间内多次跳、合闸的“跳跃”现象会造成断路器损坏，所以断路器必须有防止断路器多次跳、合闸的防跳回路。故选D，选项ABC错误。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34708", "t": 1, "q": "弹簧操作机构的断路器中，当储能电机正在工作时，应（     ）。", "a": ["发出弹簧正在储能信号", "发出弹簧已储能信号", "发出弹簧未储能信号", "不发任何信号", "", ""], "r": "C", "e": "【定位】第5章，第2节，知识点3：断路器的控制回路\n弹簧操动机构在弹簧未完成储能，断路器合闸力不足，易造成断路器损坏，应闭锁合闸回路，禁止断路器合闸，同时发出弹簧未储能信号。故选C，选项ABD错误。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34709", "t": 1, "q": "电力系统中因负荷功率超过电气设备的额定上限造成的电流升高属于（     ）。", "a": ["正常运行状态", "不正常运行状态", "短路状态", "故障状态", "", ""], "r": "B", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统中因负荷潮流超过电气设备的额定上限造成的电流升高属于过负荷情况，而过负荷属于不正常工作状态，不是正常工作状态，也不算故障状态，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34710", "t": 1, "q": "为完成继电保护的基本任务，必须正确区分正常运行状态、不正常运行状态和故障状态，寻找这三种状态下的（     ）差异。", "a": ["<p>电气量<\/p>", "<p>非电气量<\/p>", "<p>物理量<\/p>", "<p>可测参量<\/p>", "", ""], "r": "D", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】要完成继电保护的基本任务，必须提取和利用可测参量的差异，实现对正常、不正常和故障元件的快速区分，故选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34711", "t": 1, "q": "继电保护中当被测电气量超过给定值或者低于给定值动作的继电器属于（     ）元件。", "a": ["<p>测量比较元件<\/p>", "<p>逻辑判断元件<\/p>", "<p>执行输出元件<\/p>", "<p>信息采集元件<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/PNb42n771rnmsrr6QFehxxEqG4n4sBiJhrM3SFiH.png\"><\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34712", "t": 1, "q": "能瞬时切除线路区内任意一点故障的主保护是（     ）。", "a": ["相间电流保护", "电流差动保护", "零序电流保护", "接地距离保护", "", ""], "r": "B", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理。\n【解析】纵联保护是同时反应两侧（多侧）电气量的保护，可以在本线路范围内任意一点发生故障时瞬时切除（全线速动），而纵联保护又分为纵联电流差动保护、纵联方向高频保护、纵联距离高频保护和纵联相差高频保护，故选B。阶段式保护是反应单侧电气量的保护，因为不能区分本线路末端短路与相邻下级线路首端短路，因此不能瞬时切除本线路区内的任意一点故障，而阶段式保护又分为相间电流保护、零序电流保护和接地距离保护，故不选ACD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34713", "t": 1, "q": "快速切除线路与母线的短路故障，是提高电力系统的（     ）的最重要的手段。", "a": ["暂态稳定", "静态稳定", "动态稳定", "热稳定", "", ""], "r": "A", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】线路与母线的短路故障属于大扰动，影响的是暂态稳定，因此通过继保快速切除大扰动故障，削减扰动存在时间，加速系统恢复到稳态，提高的是暂态稳定性，故选A，不选B。静态稳定性又称小干扰稳定性，如负荷波动属于小干扰，暂态稳定性又称大干扰稳定性，如短路属于大干扰。动态稳定是指系统受到大小干扰1~2个周波后系统不持续振荡或没有出现不收敛的发散振荡，故不选C。热稳定，短路后电气设备的耐热水平，故不选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34714", "t": 1, "q": "系统发生不正常运行状态时，继电保护装置的基本任务是（     ）。", "a": ["切除故障元件", "切电源", "切负荷", "发出信号", "", ""], "r": "D", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】系统发生不正常运行状态时，继电保护装置的基本任务是发信号或延时跳闸，不会切电源，也不会切负荷，更不会切除所有元件，故选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34715", "t": 1, "q": "单端电气量保护，需要上、下级保护动作整定值和动作时间的配合，才能完成切除任一点短路的保护任务，被称为（     ）保护特性。", "a": ["<p>阶段式<\/p>", "<p>纵联式<\/p>", "<p>机电式<\/p>", "<p>逻辑判断式<\/p>", "", ""], "r": "A", "e": "<p>【定位】第5章，第1节，知识点3：电网保护基本原理<\/p>\n<p>【解析】阶段式保护是单端电气量保护的核心特性，依靠上、下级保护动作整定值阶梯配合与动作时限逐级阶梯递增的整定原则工作，通过无时限速断、限时速断、过电流等不同保护段的配合，覆盖线路全线故障范围，可精准切除电网任意位置的短路故障。B纵联式保护属于双端保护，需依托线路两端通信信息判别故障，不依赖单端上下级定值、时限配合；C机电式是按保护装置结构类型划分的保护类别，并非保护工作特性；D逻辑判断式不属于电力继电保护的标准特性分类。<\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34716", "t": 1, "q": "差动保护从原理上讲具有绝对的（     ）。", "a": ["速动性", "灵敏性", "选择性", "可靠性", "", ""], "r": "C", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理。\n【解析】差动保护属于纵联保护，其反应被保护设备两侧（多侧）电气量之间的变化，具有绝对的选择性，而且可以“全线速动”。故选项C正确。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34717", "t": 1, "q": "电力系统发生故障时，其特点是有关运行参数将发生变化，例如（     ）。", "a": ["电流降低、电压增大、电流与电压之间的相位角发生变化", "电流增大、电压降低、电流与电压之间的相位角不发生变化", "电流增大、电压增大、电流与电压的相位角不发生变化", "电流增大、电压降低、电流与电压的相位角发生变化", "", ""], "r": "D", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】故障时，电流有负荷电流变大为短路电流，电压降低，严重时降为0，测量阻抗变为短路阻抗，因此电流与电压间的相角也从负载阻抗角变为短路阻抗角，故选D，不选ABC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34718", "t": 1, "q": "运行中的保护装置应处于准备动作状态，但该动作时应正确动作，不该动作时不能误动。这是对保护装置（     ）的基本要求，单侧电源供电网络更将强调保护的（     ）。", "a": ["可靠性  可信赖性", "选择性  可信赖性", "可靠性  安全性", "速动性  安全性", "", ""], "r": "C", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】保护装置的基本要求中，“该动作时正确动作，不该动作时不误动”体现的是可靠性，它包含可信赖性（该动时动）和安全性（不该动时不动）。而单侧电源供电网络中，由于电源方向固定，更强调保护装置在不该动作时的“安全性”，避免误动影响系统运行。因此，第一空填“可靠性”，第二空填“安全性”，答案选C。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34719", "t": 1, "q": "下列关于继保的选择性说法不正确的是（     ）。", "a": ["电流速断保护以躲开线路末端最大短路电流整定（定值本身有选择性)", "限时电流速断保护以躲开下级线路电流速断保护范围末端短路的最大短路电流整定（定值有弱选择性）", "过电流保护以躲开最大负荷电流整定（定值无选择性）", "零序电流保护以最大相间短路电流整定（定值本身有选择性）", "", ""], "r": "D", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】相间短路没有零序电流保护。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34720", "t": 1, "q": "故障时切除故障元件指的是（     ），快速反应故障的能力指的是（     ）。", "a": ["<p>选择性；速动性<\/p>", "<p>选择性；可靠性<\/p>", "<p>速动性；选择性<\/p>", "<p>可靠性；选择性<\/p>", "", ""], "r": "A", "e": "<p>【定位】第5章，第3节，知识点1：电网保护基本原理 【解析】只有在区内故障才动作，区外故障不动作，说的是选择性；快速反应故障的能力，关键词是快速，所以是速动性，选A。<\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34721", "t": 1, "q": "在对继电保护的四个基本要求中，主保护更强调（     ）。", "a": ["<p>可靠性<\/p>", "<p>灵敏性<\/p>", "<p>灵活性<\/p>", "<p>速动性<\/p>", "", ""], "r": "D", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】主保护对快速性要求相对较高；后备保护对灵敏性要求相对较高，故选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34722", "t": 1, "q": "继电保护的（     ）要求在异常或故障状态下能够可靠地动作。", "a": ["安全性", "可信赖性", "选择性", "快速性", "", ""], "r": "B", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】继电保护需要它动作时能够准确可靠地动作，即不拒动，即可信赖性，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34723", "t": 1, "q": "对于欠量保护，灵敏系数计算公式分母上的故障参数取值为（     ）。", "a": ["<p>根据实际可能的最不利运行方式、故障类型和短路点来计算的最大计算值<\/p>", "<p>根据实际可能的最有利运行方式、故障类型和短路点来计算的最大计算值<\/p>", "<p>根据实际可能的最不利运行方式、故障类型和短路点来计算的最小计算值<\/p>", "<p>根据实际可能的最有利运行方式、故障类型和短路点来计算的最小计算值<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/vaC6rMnYXBA8mX6YWHT6m7sN2JWJk0fDrYK9mc2Y.png\"><\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34724", "t": 1, "q": "区内故障动作而区外故障不动作，体现的是继电保护的（     ）。", "a": ["<p>快速性<\/p>", "<p>选择性<\/p>", "<p>可靠性<\/p>", "<p>灵敏性<\/p>", "", ""], "r": "B", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】在尽可能小的区间内正确切除故障，是继电保护选择性的体现，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34725", "t": 1, "q": "<p>在高压电网中，下列哪个选项往往成为继电保护快速性要求的决定性因素？（ ）<\/p>", "a": ["<p>维持电力系统暂态稳定性<\/p>", "<p>减少用户在低电压下工作的时间<\/p>", "<p>避免故障进一步扩大<\/p>", "<p>减少对通信系统的干扰<\/p>", "", ""], "r": "A", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】为维持高压电网的暂态稳定性，强调继电保护的快速性，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34726", "t": 1, "q": "每回220kV以上的输电线路，都装设有两套工作原理不同、工作回路完全独立的快速保护，采取独立的跳闸方式，是为了（     ）。", "a": ["提高可信赖性", "提高安全性", "提高灵敏性", "提高速动性", "", ""], "r": "A", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】220kV及以上电压等级的电网更强调不拒动：\n（1）误动时：由于电网联系比较紧密，联络线较多，系统备用容量较多，给整个电力系统带来的直接经济损失较小。\n（2）拒动时：将造成电力元件的损坏或者引起系统稳定性的破坏，造成大面积停电。\n220kV及以上输电线路都装设两套工作原理不同、工作回路完全独立、跳闸方式各自独立的快速保护，是为了提高保护的可信赖性，既不拒动，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34727", "t": 1, "q": "为了减轻设备的损坏，限制故障的扩大，提高系统的稳定性，要求继电保护装置具有（     ）。", "a": ["<p>可靠性<\/p>", "<p>速动性<\/p>", "<p>灵敏性<\/p>", "<p>选择性<\/p>", "", ""], "r": "B", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】要求继电保护快速动作的主要理由和必要性：\n①可以提高电力系统并列运行的稳定性。\n②可以加速系统电压的恢复，改善用户电动机的自起动条件，使用户的工作尽可能少受故障影响。\n③可以减轻电弧对故障设备的破坏，以及电流对故障支路元件的损坏程度。\n④可以防止故障进一步的扩大和发展，提高自动重合闸的成功率。\n故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34728", "t": 1, "q": "在要求继电保护有选择性的同时，还必须考虑继电保护或断路器有拒绝动作的可能性，因而就需要有（     ）。", "a": ["在线监测", "自动重合闸", "后备保护", "人工监护", "", ""], "r": "C", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护。\n【解析】题中提到“继电保护或断路器有拒绝动作”，所以根据后备保护的定义，正确答案选C。ABD均不是继电保护，所以错误。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34729", "t": 1, "q": "为了确保故障元件能够从电力系统中被切除，一般每个重要的电力元件至少配备（     ）套保护。", "a": ["1", "2", "3", "4", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护。\n【解析】电力系统中每个重要的电力元件至少配备2套保护，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34730", "t": 1, "q": "后备保护分为近后备保护和远后备保护，其中近后备保护的优点是（     ）。", "a": ["不扩大故障范围", "可以对本侧断路器起到后备作用", "能够对下级元件及断路器起到后备保护的作用", "本地断路器拒动时，不需要与失灵保护配合也能起作用", "", ""], "r": "A", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护。\n【解析】近后备保护作为本元件主保护的备用保护，当主保护拒动时由本侧近后备保护动作跳开本侧断路器，故障仅局限在故障元件处，不会造成故障范围扩大，远后备保护才负责对下级元件及断路器提供后备作用，近后备无法对下级元件实现后备保护，近后备在本地断路器拒动时必须依靠失灵保护配合才能切除故障，无法单独发挥作用，对本侧断路器的后备作用属于失灵保护范畴并非近后备保护的优点，因此只有A选项表述正确。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34731", "t": 1, "q": "一般元件的后备保护采用远后备，高压电网中灵敏度的要求不能满足时采用（     ）。", "a": ["<p>近后备保护<\/p>", "<p>近后备加断路器失灵保护<\/p>", "<p>远后备加断路器失灵保护<\/p>", "<p>断路器失灵保护<\/p>", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护。\n【解析】近后备比远后备快，停电范围小，但可靠性相对较差（在断路器拒动时，不起作用），需要增加断路器失灵保护来解决，故高压电网中灵敏度的要求不能满足时采用近后备加断路器失灵保护，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34732", "t": 1, "q": "后备保护更加强调保护的（     ）。", "a": ["<p>可靠性<\/p>", "<p>灵敏性<\/p>", "<p>灵活性<\/p>", "<p>速动性<\/p>", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护。\n【解析】后备保护主要用来弥补主保护的遗漏故障，需要能够可靠检测出各类主保护未动作的故障工况，因此更强调灵敏性，保证在保护区内轻微故障、远端故障时都可以准确感知故障并可靠动作，可靠性是所有继电保护都需要满足的基本要求，并非后备保护侧重强调的特性，灵活性不属于继电保护四大基本特性，速动性更多是主保护的要求，后备保护允许带有一定时限延时跳闸，所以本题选择B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34733", "t": 1, "q": "上下级电力元件的保护范围相互重叠，保证任意点的故障都在保护区内，重叠区越小越好，这是因为（     ）。", "a": ["<p>重叠区越大，经济性越差<\/p>", "<p>重叠区短路时，会造成保护区内所有断路器跳闸，扩大停电范围<\/p>", "<p>重叠区短路时，会发生拒动<\/p>", "<p>重叠过多会使保护失去方向性<\/p>", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护。\n【解析】重叠区短路时，会造成保护区内所有断路器跳闸，从而扩大停电范围，因此重叠区越小越好，故选B；重叠区与经济性无关，故不选A；保护是否会误动作，与保护的可靠性有关，与重叠区无关，故不选C；保护的方向性与保护的选择性有关，与重叠区无关，故不选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34734", "t": 1, "q": "电气元件配置两套保护，一套保护不动作时另一套保护动作于跳闸，称为（     ）。", "a": ["主保护", "近后备保护", "远后备保护", "辅助保护", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护\n【解析】近后备保护和主保护配置一起配置，发生故障时当主保护拒动时，近后备保护动作于跳闸，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34735", "t": 1, "q": "系统发生故障时，继电保护装置的基本任务是（     ）。", "a": ["切除故障元件", "切电源", "切负荷", "给出信号", "", ""], "r": "A", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】系统发生故障时，继电保护装置的基本任务是切除故障元件，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34736", "t": 1, "q": "电力系统最危险的故障是（     ）。", "a": ["单相接地短路", "两相短路", "两相接地短路", "三相短路", "", ""], "r": "D", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统最危险的故障三相短路，造成的危害也最大，故选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34737", "t": 1, "q": "电力系统短路时最严重的后果是（     ）。", "a": ["电弧使故障设备损坏", "使用户的正常工作遭到破坏", "损坏用户电力设备", "破坏电力系统运行的稳定性", "", ""], "r": "D", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统短路会造成电弧使故障设备损坏、使用户的正常工作遭到破坏等，最严重的会破坏电力系统运行的稳定性，故选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34738", "t": 1, "q": "继电保护的（     ）要求在设计要求它动作的异常或故障状态下，能够准确可靠地动作。", "a": ["安全性", "可信赖性", "选择性", "快速性", "", ""], "r": "B", "e": "【定位】第5章，第3节，知识点1：对继电保护的四个基本要求\n【解析】继电保护的可信赖性要求在设计要求它动作的异常或故障状态下，能够准确可靠地动作，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34739", "t": 1, "q": "以下选项中不属于不正常工作状态的是（     ）。", "a": ["系统中出现功率缺额而引起的频率降低", "发电机突然甩负荷引起的发电机频率升高", "中性点不接地系统单相接地引起的非接地相对地电压升高", "电力系统中部分地区电压大大降低使电力用户的正常工作遭到破坏", "", ""], "r": "D", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统中部分地区电压大大降低使电力用户的正常工作遭到破坏属于故障状态，ABC均为不正常工作状态，故选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34740", "t": 1, "q": "电力系统发生振荡时，各点电压和电流（     ）。", "a": ["均作往复性摆动", "均会发生突变", "在振荡的频率高时会发生突变", "之间的相位角基本不变", "", ""], "r": "A", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统发生振荡时，各点电压和电流均作往复性摆动，电流和电压值不会发生突变，相位角也处于变化之中，故答案选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34741", "t": 1, "q": "电力系统发生振荡时，振荡中心电压的波动情况是（     ）。", "a": ["幅度最大", "均会发生突变", "在振荡的频率高时会发生突变", "之间的相位角基本不变", "", ""], "r": "A", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统发生振荡时，振荡中心电压的波动情况最大，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34742", "t": 1, "q": "继电保护是利用可以正确区分正常运行、不正常运行和故障状态的可测参量来实现的，下列哪种保护是利用阻抗减小来实现的？（     ）", "a": ["电流保护", "低电压保护", "距离保护", "功率方向保护", "", ""], "r": "C", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】短路时保护安装处的测量阻抗由负荷阻抗变为短路阻抗，阻抗模值变小，阻抗角变大，据此可以构成距离保护，故选C。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34743", "t": 1, "q": "继电保护都有预先严格划分的保护范围，只有范围内发生故障，保护才动作，电力系统一般借助于（     ）实现保护范围的划分。", "a": ["继电保护装置", "断路器", "线路", "隔离开关", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点3：断路器的控制回路\n【解析】一般借助于断路器（互感器）实现保护范围的划分，以保证任一个元件的故障都能可靠地被切除，并且保证停电范围最小，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34744", "t": 1, "q": "断开离故障点最近的断路器是继电保护“四性”中哪一项的要求？（     ）", "a": ["选择性", "速动性", "灵敏性", "可靠性", "", ""], "r": "A", "e": "【定位】第5章，第3节，知识点1：对继电保护的四个基本要求\n【解析】选择性中要求在电力系统发生故障时，断开离故障点最近的断路器，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34745", "t": 1, "q": "根据电压和电流之间的相位差在正常运行和短路故障时的差异可以构成（     ）。", "a": ["<p>功率方向保护<\/p>", "<p>纵差保护<\/p>", "<p>序分量保护<\/p>", "<p>距离保护<\/p>", "", ""], "r": "A", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】根据电压和电流之间的相位差在正常运行和短路故障时的差异可以构成功率方向保护，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34746", "t": 1, "q": "短路时保护安装处的阻抗的测量阻抗变为短路阻抗，阻抗模值和阻抗角分别（     ）。", "a": ["<p>变大，变小<\/p>", "<p>变大，变大<\/p>", "<p>变小，变小<\/p>", "<p>变小，变大<\/p>", "", ""], "r": "D", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】短路时保护安装处的阻抗的测量阻抗变为短路阻抗，阻抗模值减小，阻抗角变大，故选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34747", "t": 1, "q": "利用短路时电压和电流的变化不可以构建（     ）。", "a": ["<p>电压突变量保护<\/p>", "<p>工频变化量保护<\/p>", "<p>低电压保护<\/p>", "<p>瓦斯保护<\/p>", "", ""], "r": "D", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】瓦斯保护是根据瓦斯气体的多少构成的，故选D。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34748", "t": 1, "q": "就一般情况而言，整套继电保护装置的组成不包括（     ）。", "a": ["<p>测量部分<\/p>", "<p>逻辑部分<\/p>", "<p>存储部分<\/p>", "<p>执行部分<\/p>", "", ""], "r": "C", "e": "【定位】第5章，第2节，知识点1：继电保护的基本组成部分：测量比较部分；逻辑判别部分；出口执行部分\n【解析】就一般情况而言，整套继电保护装置是由测量部分、逻辑部分和执行部分组成的，故选C。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34749", "t": 1, "q": "继电保护按照保护原理分类不包括（     ）。", "a": ["<p>电流保护<\/p>", "<p>电压保护<\/p>", "<p>失磁保护<\/p>", "<p>方向保护<\/p>", "", ""], "r": "C", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】继电保护安照保护原理分类包括电流保护、电压保护、距离保护、差动保护、方向保护等，故选C。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34750", "t": 1, "q": "继电保护按照测量值和整定值的关系可以分为过量保护和欠量保护，下列保护中属于过量保护的是（     ）。", "a": ["<p>电流保护<\/p>", "<p>低电压保护<\/p>", "<p>距离保护<\/p>", "<p>工频分量距离保护<\/p>", "", ""], "r": "A", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】过量保护是指测量值大于等于整定值时动作的保护，电流保护属于过量保护，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34751", "t": 1, "q": "后备保护分为近后备保护和远后备保护，近后备保护的优点为（     ）。", "a": ["<p>不扩大故障范围<\/p>", "<p>可以对本侧断路器起到后备作用<\/p>", "<p>能够对下级保护元件及断路器起到后备保护的作用<\/p>", "<p>本地断路器拒动时，不需要与失灵保护配合也能起作用<\/p>", "", ""], "r": "A", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护\n【解析】近后备保护的优点为后备保护功能有本地实现，不扩大故障范围，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34752", "t": 1, "q": "后备保护分为近后备保护和远后备保护，远后备保护的优点为（     ）。", "a": ["<p>不扩大故障范围<\/p>", "<p>可以对本侧断路器起到后备作用<\/p>", "<p>能够对下级保护元件及断路器起到后备保护的作用<\/p>", "<p>本地断路器拒动时，不需要与失灵保护配合也能起作用<\/p>", "", ""], "r": "C", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护\n【解析】远后备保护的优点能够对下级保护元件及断路器起动后备保护的作用，故选C。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34753", "t": 1, "q": "对其保护范围内发生任何故障或不正常运行状态的反应能力是指继电保护的（     ）。", "a": ["<p>可靠性<\/p>", "<p>速动性<\/p>", "<p>灵敏性<\/p>", "<p>选择性<\/p>", "", ""], "r": "C", "e": "【定位】第5章，第3节，知识点1：对继电保护的四个基本要求\n【解析】灵敏性是指对其保护范围内发生任何故障或不正常运行状态的反映能力，故选C。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34754", "t": 1, "q": "以下各电气设备中（     ）属于二次设备。", "a": ["断路器控制开关", "避雷器", "电流互感器", "变压器", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电气一次与电气二次。\n【解析】简易判断方法，和高压输电线路有直接电气连接的为一次设备，否则为二次设备，故A为二次设备，BCD均为一次设备。或者根据定义，二次设备是对一次系统进行保护、控制、监测以及自动控制与调节的弱电设备，弱电设备断路器控制开关控制的是一次设备断路器，所以是二次设备。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34755", "t": 2, "q": "关于灵敏性的说法正确的是（     ）。", "a": ["保护动作越快，灵敏性越好", "灵敏性指的是对故障的反映能力", "过量保护的灵敏度系数大于1", "欠量保护的灵敏度系数大于1", "", ""], "r": "BCD", "e": "【定位】第5章，第3节，知识点1：对继电保护的四个基本要求\n【解析】定义指明灵敏性是对故障的反应能力，故B对，各种保护的灵敏度系数均应大于1，与保护类型是欠量还是过量保护无关，故CD对。保护动作的快慢，也即速度，与速动性有关，与灵敏性无关，故A错。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34756", "t": 2, "q": "电力系统中的过负荷可能造成的危害包括（     ）。", "a": ["<p>载流导体的熔断<\/p>", "<p>绝缘击穿<\/p>", "<p>引发电压崩溃<\/p>", "<p>加速绝缘材料的老化<\/p>", "", ""], "r": "AD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/jN9WdpICIBoovFYD6jOOFz9mYFbxC8Wepzn4ceou.png\"><\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34757", "t": 2, "q": "电力系统中的频率过低可能造成的危害包括（     ）。", "a": ["<p>影响产品质量<\/p>", "<p>引发频率崩溃<\/p>", "<p>引发电压崩溃<\/p>", "<p>加速绝缘材料的老化<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】ABC是频率降低可能造成的危害，D是过负荷造成的危害，故选ABC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34758", "t": 2, "q": "电力系统的不等式约束中既有上限又有下限的是（     ）。", "a": ["用电设备容量", "母线电压", "线路电流", "系统频率", "", ""], "r": "BD", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】用电设备容量满足不等式约束条件，只有上限没有下限，故不选A；线路电流满足不等式约束条件，只有上限没有下限，故不选C；母线电压和系统频率满足不等式约束条件，既有上限也有下限，故选BD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34759", "t": 2, "q": "继电保护的基本原理是根据电力系统运行元件的可测参量的差异来分辨（     ）。", "a": ["正常运行状态", "不正常运行状态", "故障状态", "报警状态", "", ""], "r": "ABC", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】正常运行状态、不正常运行状态和故障状态是电力系统的三种运行状态，报警状态是电力系统发生不正常运行状态时发出的一种信号，故选ABC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34760", "t": 2, "q": "关于继电保护装置，下列说法正确的是（     ）。", "a": ["继电保护装置的供电电源属于一次设备", "继电保护装置确保一次设备不会发生故障", "继电保护是一种反事故措施", "正常运行时继电保护不会启动", "", ""], "r": "CD", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】选项A：继电保护装置的供电电源用于为保护装置自身供电，属于二次设备（为一次设备运行、监测等服务的设备），不是一次设备（直接参与电能生产、传输、分配的设备，如发电机、变压器等 ）。选项B：继电保护装置是在一次设备发生故障或异常时，起到保护、动作跳闸等作用，无法确保一次设备不发生故障。选项C：继电保护能在设备故障时快速切断故障、异常时发出信号等，避免事故扩大，是电力系统重要的反事故措施。选项D：正常运行时，继电保护装置处于监视状态，只有当被保护设备出现故障或异常（如短路、过负荷等达到动作条件）时才会启动，正常运行不会启动。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34761", "t": 2, "q": "每套保护都有预先严格划分的保护范围，只有在范围内发生故障保护才动作，保护范围划分的基本原则包括（     ）。", "a": ["<p>任一个元件的故障都能可靠的被清除，并且保证停电范围最小或者对系统的影响最小<\/p>", "<p>任一个元件的故障都能可靠的被清除，并且保证时间最短<\/p>", "<p>上下级电力元件的保护范围相互重叠，保证任意点的故障都在保护区内<\/p>", "<p>上下级电力元件的保护范围重叠面积越大，可靠性越好<\/p>", "", ""], "r": "AC", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】选项A：保护范围划分要确保任一个元件故障时，保护能可靠动作清除故障，且尽量让停电范围小、对系统影响小，这是合理且重要的原则。选项B：保护范围划分原则重点并非单纯保证“时间最短”，主要是故障可靠清除与停电范围等方面。选项C：上下级电力元件保护范围相互重叠，能保证任意点故障都在保护区内，避免出现保护“死区”。选项D：上下级保护范围需要有一定重叠，但不是“重叠面积越大可靠性越好”，过度重叠可能引发误动等问题，应是合理重叠保证选择性等。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34762", "t": 2, "q": "继电保护的作用包括（     ）。", "a": ["<p>将故障元件从电力系统中切除<\/p>", "<p>反应电气设备的不正常运行状态并动作于发出信号、减负荷或延时跳闸<\/p>", "<p>与其他电力系统自动装置配合，在条件允许时采取预定措施缩短事故停电时间<\/p>", "<p>事件记录和网路通信<\/p>", "", ""], "r": "ABCD", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】继电保护最核心的作用是在系统发生短路等故障时迅速将故障元件从电力系统中切除，防止故障扩大损坏更多设备，当电气设备出现过负荷、电压异常等不正常运行工况时，继电保护可及时发出告警信号，也可根据设定实现减负荷或者延时跳闸保障系统稳定，继电保护能够与重合闸、备自投等其他电力自动装置相互配合，快速恢复供电，有效缩短事故停电时长，同时现代微机继电保护装置具备故障事件记录、网络通信上传故障信息的功能，方便运维人员分析故障原因、快速排查处理故障，因此ABCD四个选项均属于继电保护的作用。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34763", "t": 2, "q": "利用单侧电气量构成的阶段式保护包括（     ）。", "a": ["过电流保护", "距离保护", "零序电流保护", "纵差保护", "", ""], "r": "ABC", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】（1）阶段式保护：根据被保护设备的单端电气量的变化确定保护是否动作，主要有电流保护、零序电流保护和距离（阻抗）保护。（2）纵联保护：根据被保护设备两侧（多侧）电气量之间的变化确定保护动作与否，主要有纵联电流差动保护、方向纵联保护和纵联电流相差保护。ABC是阶段式保护，D是纵联电流差动保护的简称，属于纵联保护，故选ABC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34764", "t": 2, "q": "要构成阶段式继电保护，必须具备的条件有（     ）。", "a": ["能区分正常运行状态与短路故障", "必须能够区分故障类型", "能区分故障点到保护安装处的距离远近", "能区分中性点直接接地系统与非直接接地系统的故障", "", ""], "r": "AC", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】任何继电保护原理都必须能够区分正常状态和故障状态，阶段式继电保护必须能够区分短路点的远近，故选AC。相间短路故障需要相间保护，接地短路故障需要接地保护，与是否是阶段式保护无关。变压器的中性点是直接接地还是非直接接地，是电力系统根据电压等级规定的接地方式，与继电保护无关。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34765", "t": 2, "q": "下列属于反应非电气量特征的保护包括（     ）。", "a": ["过流保护", "过热保护", "瓦斯保护", "低电压保护", "", ""], "r": "BC", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】过流保护和低电压保护利用的是电气量，过热保护和瓦斯保护利用的是非电气量，故选BC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34766", "t": 2, "q": "利用线路单端电气量构建的保护包括（     ）。", "a": ["距离保护", "纵差保护", "过流保护", "瓦斯保护", "", ""], "r": "AC", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】距离保护和过流保护是利用单端电气量构成的保护，故选AC。纵差保护是利用两端电气量构成的保护，故选项B错误。瓦斯保护是利用非电气量构成的保护，故选项D错误。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34767", "t": 2, "q": "关于继电保护动作的选择性，下面说法正确的是（     ）。", "a": ["系统故障时应由距故障点最近的保护正确动作", "系统故障时应使停电范围尽量缩小", "远后备保护动作切除故障时会使得停电范围扩大，失去选择性", "近后备保护可以对相邻元件的断路器，二次回路和直流电源起后备作用", "", ""], "r": "AB", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】选项A：继电保护动作选择性要求系统故障时，由距故障点最近的保护（即最靠近故障元件的保护）正确动作切除故障。选项B：通过选择性动作，让距故障点最近的保护动作，能使停电范围尽量缩小，只切断故障部分，保证非故障部分继续运行。选项C：远后备保护是在相邻元件保护或断路器拒动时，由本元件的远后备保护动作切除故障，虽停电范围看似扩大，但这是后备保护的作用，仍具有选择性（是为了弥补相邻保护拒动情况 ）。选项D：近后备保护主要是对本元件保护拒动、本元件断路器拒动起后备作用，不能对相邻元件的二次回路和直流电源起后备作用。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34768", "t": 2, "q": "继电保护的可靠性主要靠（     ）来保证。", "a": ["配置快速主保护", "选用性能优良、质量稳定的产品", "正常的运行维护", "配置灵敏后备保护", "", ""], "r": "BC", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】选项A：配置快速主保护主要是为了满足继电保护速动性等要求，不是保证可靠性的主要方式。选项B：选用性能优良、质量稳定的产品，能从硬件基础上减少保护装置自身故障概率，是保证可靠性的重要方面。选项C：正常的运行维护，比如定期校验、检查等，可及时发现保护装置潜在问题并处理，保障其可靠运行。选项D：配置灵敏后备保护主要是为了在主保护拒动时发挥作用，侧重于选择性、后备性等，不是保证可靠性的主要途径。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34769", "t": 2, "q": "下列关于灵敏性说法正确的是（     ）。", "a": ["保护动作越快，灵敏性越高", "灵敏性指的是对故障的反应能力", "保护的灵敏系数均要求大于1", "纵联保护的灵敏度系数越大，保护范围越长", "", ""], "r": "BC", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】灵敏性是指继电保护对其保护范围内发生故障的反应能力，通常用灵敏系数来衡量，阶段式保护，灵敏度高保护范围一般越长。但纵联保护范围只能是线路全长，灵敏度高，不代表保护范围越长。但是继电保护的速动性与灵敏性矛盾，动作速度越快的保护灵敏性越低，故选项A错误。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34770", "t": 2, "q": "继电保护动作具有选择性，其包含的含义为（     ）。", "a": ["<p>当继电保护或断路器拒动时，后备保护切除故障时保证停电范围尽可能小<\/p>", "<p>继电保护在需要动作时不拒动，不需要动作时不误动<\/p>", "<p>当元件或设备故障时，首先由装设在本设备上的继电保护动作切除故障<\/p>", "<p>继电保护以尽可能快的速度动作切除故障元件或设备<\/p>", "", ""], "r": "AC", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】继电保护的选择性包含两层含义，一是正常故障情况下优先由故障元件自身配置的主保护动作切除故障，尽量只断开故障设备，保证非故障部分继续供电，二是当主保护或者断路器发生拒动时，依靠后备保护逐级切除故障，最大限度缩小停电范围，选项B描述的是继电保护的可靠性，选项D描述的是继电保护的速动性，均不属于选择性的含义，因此本题选AC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34771", "t": 2, "q": "对于继电保护装置的灵敏度计算公式为（     ）。", "a": ["<p>对于欠量保护，为保护区末端金属性短路时故障参数的最小值除以保护的动作参数<\/p>", "<p>对于欠量保护，为保护的动作参数除以保护区末端金属性短路时故障参数的最大值<\/p>", "<p>对于过量保护，为保护区末端金属性短路时故障参数的最小值除以保护的动作参数<\/p>", "<p>对于过量保护，为保护的动作参数除以保护区末端金属性短路时故障参数的最小值<\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/YffziLFHIvQSwCTxxUur0pQYp8XX822GUz1TFDl1.png\"><\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34772", "t": 2, "q": "影响继电保护可靠性的内在因素包括（     ）。", "a": ["<p>装置本身的质量，包括元件好坏、结构设计的合理性等<\/p>", "<p>内外线接线简明程度<\/p>", "<p>触点多少<\/p>", "<p>调试是否正确<\/p>", "", ""], "r": "ABC", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】继电保护可靠性的内在因素来源于保护装置自身相关设计与硬件配置，装置本身元器件优劣、结构设计是否合理直接决定装置本身工作稳定性，内外接线设计越简明越能减少接线错误、接触不良等故障隐患，保护装置触点数量越多，出现触点接触不良、粘连等故障的概率越高，都会影响保护可靠运行，而调试是否正确属于装置投运过程中的人为外部操作因素，不属于装置本身的内在因素，因此本题选择ABC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34773", "t": 2, "q": "提高继电保护可靠性的方法包括（     ）。", "a": ["<p>选用适当的保护原理，尽量简化接线、减少元器件数量和触点数量<\/p>", "<p>提高保护装置所选用的器件质量和工艺水平<\/p>", "<p>提高保护装置安装和调试的质量，并加强维护和管理<\/p>", "<p>采取保护装置多重化<\/p>", "", ""], "r": "ABCD", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】四个选项均为提高继电保护可靠性的方法，故选ABCD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34774", "t": 2, "q": "继电保护可靠性中提高安全性措施和提高可信赖性措施往往也是矛盾的，特殊情况下，侧重点不同，下列选项中说法正确的是（     ）。", "a": ["电网联系紧密，保护误动对系统影响较小", "系统联系较弱，保护拒动对系统影响较小", "电网联系紧密，保护误动对系统影响较大", "电网联系较弱，保护误动对系统影响较大", "", ""], "r": "ABD", "e": "【定位】第5章，第3节，知识点1：电网保护基本原理\n【解析】当电网联系紧密时，即使保护误动，仍然能够通过其它线路保证供电连续性，因此对系统影响小；当电网联系较弱时，一旦误动将造成较大面积停电事故，而即使拒动仍然可由后备保护切除故障；故选ABD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34775", "t": 2, "q": "对近后备描述正确的是（     ）。", "a": ["<p>动作时只切除主保护要跳开的断路器，不造成事故扩大<\/p>", "<p>断路器失灵时仍可以切除故障<\/p>", "<p>主保护拒动时近后备保护动作<\/p>", "<p>不受变电站直流系统故障影响<\/p>", "", ""], "r": "AC", "e": "<p>【定位】第5章，第2节，知识点4：主保护与后备保护 【解析】根据近后备的定义，近后备是与主保护安装在同一个断路器处，当主保护拒动的时候，近后备跳开的是本线路断路器，不会扩大停电范围，故AC正确。由于近后备保护与主保护作用于同一断路器，故断路器失灵时不能切除故障，故选项B错误。变电站直流系统故障将造成本站保护装置失电，断路器控制回路失电，在电网故障时主保护和近后备保护都无法动作，故选项D错误。所以本题选AC。<\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34776", "t": 2, "q": "按保护所起的作用分类，继电保护可分为（     ）。", "a": ["<p>主保护<\/p>", "<p>后备保护<\/p>", "<p>方向保护<\/p>", "<p>辅助保护<\/p>", "", ""], "r": "ABD", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护。\n【解析】主保护、后备保护和辅助保护都是按所起作用不同而进行的分类，故选ABD。方向保护是按照保护原理不同而进行的分类。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34777", "t": 2, "q": "对断路器控制回路的基本要求包括（     ）。", "a": ["监视控制电源的完好性", "监视跳、合闸回路的完好性", "反映断路器状态的位置信号", "防止断路器的多次跳、合闸", "", ""], "r": "ABCD", "e": "【定义】第5章，第1节，知识点3：断路器的控制回路\n【解析】选项A：控制电源是断路器动作的能量来源，监视其完好性可确保断路器在需要时能正常工作，避免因电源故障导致拒动。选项B：跳、合闸回路若存在断线或接触不良等问题，会导致断路器无法正确动作，监视回路完好性是保证控制可靠性的基础。选项C：通过位置信号（如指示灯、信号继电器等）反映断路器的分、合闸状态，便于运行人员实时掌握设备情况。选项D：防止断路器多次跳、合闸（即“防跳”功能）可避免因控制回路异常（如合闸命令持续存在）导致断路器频繁动作，损坏设备或扩大事故。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34778", "t": 2, "q": "断路器操作机构是断路器跳闸、合闸的执行机构，其类型包括（     ）。", "a": ["电磁操作机构", "弹簧储能操作机构", "液压操作机构", "气压操作机构", "", ""], "r": "ABCD", "e": "【定义】第5章，第1节，知识点3：断路器的控制回路\n【解析】选项A：电磁操作机构通过电磁力驱动断路器分合闸，结构简单且应用较早。选项B：弹簧储能操作机构利用弹簧储存的能量完成分合闸，具有动作快、操作功率小的特点。选项C：液压操作机构以高压油作为动力源，输出力大且平稳，适用于高压断路器。选项D：气压操作机构利用压缩空气作为动力，动作迅速，常用于对操作速度要求高的场合。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34779", "t": 2, "q": "在跳、合闸回路中串入断路器辅助触点的目的有（     ）。", "a": ["防止烧继电器触点", "监视控制电源的完好性", "保证跳、合闸线圈的安全", "监视跳、合闸回路的完好性", "", ""], "r": "AC", "e": "【定义】第5章，第1节，知识点3：断路器的控制回路\n【解析】选项A：跳、合闸回路电流较大，串入断路器辅助触点，可避免继电器触点直接承载大电流，防止烧损继电器触点。选项B：监视控制电源完好性一般通过控制回路中的电源监视继电器、指示灯等实现，与串入断路器辅助触点无关。选项C：断路器辅助触点可在断路器完成跳、合闸操作后，及时切断跳、合闸线圈回路，避免线圈长时间通电（线圈按短时通电设计），保证跳、合闸线圈安全。选项D：监视跳、合闸回路完好性通常依靠回路中的信号灯、监视继电器等，并非通过串入断路器辅助触点实现。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34780", "t": 2, "q": "电力系统的不等式约束中哪些变量既有上限又有下限？（     ）", "a": ["用电设备功率", "母线电压", "线路电流", "系统频率", "", ""], "r": "BD", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】不等式约束中母线电压和系统频率既有上限又有下限，用电设备功率和线路电流只有上限要求，故选BD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34781", "t": 2, "q": "电力系统继电保护的基本任务之一是（     ）地将故障元件从电力系统中切除。", "a": ["<p>自动<\/p>", "<p>迅速<\/p>", "<p>有选择<\/p>", "<p>可靠<\/p>", "", ""], "r": "ABC", "e": "<p>【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类 【解析】电力系统继电保护的基本任务之一是自动、迅速、有选择地将故障元件从电力系统中切除。故选ABC。<\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34782", "t": 2, "q": "当继电保护反应电气元件的不正常运行状态，并根据运行维护条件而动作于（     ）。", "a": ["发出信号", "减负荷", "跳闸", "停运发电机组", "", ""], "r": "ABC", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】当继电保护反应电气元件的不正常运行状态，并根据运行维护条件而动作于发出信号、减负荷和跳闸，故选ABC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34783", "t": 2, "q": "下列保护中特征量选取为非电气量的保护包括（     ）。", "a": ["过流保护", "过热保护", "瓦斯保护", "低电压保护", "", ""], "r": "BC", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】过热保护和瓦斯保护是利用非电气量构建的继电保护，故选BC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34784", "t": 2, "q": "继电保护系统的作用包括（     ）。", "a": ["当发生故障时作用于断路器跳闸", "当出现异常情况时作用于发信号", "当发生故障时作用于发信号", "当发生故障时或出现异常情况时都作用于断路器跳闸", "", ""], "r": "AB", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】继电保护系统的作用是当发生故障时作用于断路器跳闸，自动切出故障，当出现异常情况时作用于发信号，故选AB。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34785", "t": 2, "q": "电力系统等式约束条件包括（     ）。", "a": ["<p>有功功率<\/p>", "<p>无功功率<\/p>", "<p>母线电压<\/p>", "<p>系统频率<\/p>", "", ""], "r": "AB", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统等式约束条件包括用功功率平衡和无功功率的平衡，故选AB。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34786", "t": 2, "q": "电力系统不等式约束条件包括（     ）。", "a": ["用电设备的功率", "母线电压", "线路电流", "系统频率", "", ""], "r": "ABCD", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统不等式约束条件包括用电设备的功率及其上限、母线电压及其上下限、线路电流及其上限、系统频率及其上下限，故选ABCD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34787", "t": 2, "q": "电力系统不等式约束条件中哪些既要考虑上限又要考虑下限（     ）。", "a": ["用电设备的功率", "母线电压", "线路电流", "系统频率", "", ""], "r": "BD", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统不等式约束条件既要考虑上限又要考虑下限为母线电压和系统频率，过低过高都会给电力系统造成不利影响，故选BD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34788", "t": 2, "q": "电力系统等式约束条件有功和无功功率的平衡约束由哪几部分构成？（     ）", "a": ["发电机或其他电源设备发出的有功和无功功率", "负荷使用的有功和无功功率", "电力系统中各种有功和无功功率的损耗", "二次设备的有功和无功损耗", "", ""], "r": "ABC", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统等式约束条件有功和无功功率的平衡约束由发电机或其他电源设备发出的有功和无功功率、负荷使用的有功和无功功率和电力系统中各种有功和无功功率的损耗三部分构成，故选ABC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34789", "t": 2, "q": "电力系统中可能造成故障的原因包括（     ）。", "a": ["自然力的破坏", "绝缘老化", "设计制造存在缺陷", "维护及操作不当", "", ""], "r": "ABCD", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】由于自然力的破坏、绝缘老化、设计制造存在缺陷以及维护及操作不当，电力系统中运行的设备发生故障是不可避免的，故选ABCD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34790", "t": 2, "q": "电力系统发生短路故障可能造成的后果包括（     ）。", "a": ["燃起电弧，使故障设备损坏", "使绝缘遭到损坏或使设备缩短使用寿命", "电力系统中大部分地区电压下降，使大量电能用户的正常工作遭到破坏或产生废品", "破坏电力系统并联运行的稳定性，引起系统振荡，甚至造成整个电力系统瓦解", "", ""], "r": "ABCD", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统发生短路故障可能造成的后果包括：1）数值很大的短路电流通过短路点将燃起电弧，使故障设备损坏，2）短路电流通过故障设备和非故障设备时，产生热和电动力的作用，致使其绝缘遭到损坏或使设备缩短使用寿命，3）电力系统中大部分地区电压下降，使大量电能用户的正常工作遭到破坏或产生废品，4）破坏电力系统并联运行的稳定性，引起系统振荡，甚至造成整个电力系统瓦解，故选ABCD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34791", "t": 2, "q": "继电保护的基本原理是根据电力系统哪几种状态下的可测参量差异构建的（     ）。", "a": ["正常运行状态", "不正常运行状态", "故障状态", "报警状态", "", ""], "r": "ABC", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】继电保护的基本原理是根据电力系统正常运行状态、不正常运行状态和故障状态下的可测参量差异构建的，故选ABC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34792", "t": 2, "q": "电力系统中也可以根据一些非电气参量构建保护，这些保护包括（     ）。", "a": ["瓦斯保护", "过热保护", "压力保护", "高频保护", "", ""], "r": "ABC", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】变压器油箱内部发生故障时，会产生大量的瓦斯气体，据此可以构建瓦斯保护，同样根据温度和压力可以构建过热保护和压力保护，故选ABC。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34793", "t": 2, "q": "按保护所反映的故障类型，继电保护可分为（     ）。", "a": ["相间短路保护", "接地故障保护", "匝间短路保护", "失步保护", "", ""], "r": "ABCD", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】按保护所反映的故障类型，继电保护可分为相间短路保护、接地故障保护、匝间短路保护、失步保护和失磁保护，故选ABCD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34794", "t": 2, "q": "继电保护中，后备保护可以分为（     ）。", "a": ["近后备保护", "辅助保护", "中后备保护", "远后备保护", "", ""], "r": "AD", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护\n【解析】按照后备保护和主保护安装位置的关系，后备保护可以分为近后备保护和远后备保护，近后备保护是指在本元件处装设两套保护，当主保护拒动时，由本元件的另一套保护动作；远后备保护是指当主保护或断路器拒动时，由相邻电力设备或线路的保护来实现后备保护，故选AD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34795", "t": 2, "q": "继电保护中每套保护都有预先严格划分的保护范围，只有范围内发生故障，保护才动作。保护范围划分的基本原则是（     ）。", "a": ["电力系统中的每一个重要元件都必须配备至少一套保护", "任一个元件的故障都能可靠被切除，并且保证停电范围最小或者对系统影响最小", "上下级电力元件的保护范围相互重叠，保证任意点的故障都在保护区内", "保护范围重叠的越多越好，可靠性越高", "", ""], "r": "BC", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护\n【解析】保护范围划分的基本原则是，1）任一个元件的故障都能可靠被切除，并且保证停电范围最小或者对系统影响最小故，2）一个元件的故障都能可靠被切除，并且保证停电范围最小或者对系统影响最小，重叠区越小越好，否则容易扩大停电范围，另外，电力系统中的每一个重要元件都必须配备至少两套保护。故选BC。答案A的解释：为保证可靠切除任意处的故障，保护区必须重叠。但是，当重叠区内发生短路时，会造成两个保护区内所有的断路器跳闸，从而扩大停电范围，因此，重叠区必须有，但越小越好。 答案D的解释：实践证明，保护装置拒动、保护回路损坏、断路器拒动、工作电源不正常等时有发生，为确保故障元件的可靠切除，重要的电力元件都配备2套保护，一套主保护（而对于220kV及以上的输电线路，主保护就是2套），一套后备保护。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34796", "t": 2, "q": "继电保护可靠性中提高不误动的安全措施和提高不拒动的信赖性往往也是矛盾的，特殊情况下，侧重点不同，下列选项中说法正确的是（     ）。", "a": ["<p>电网联系紧密，保护误动对系统影响较小<\/p>", "<p>系统联系较弱，保护拒动对系统影响较小<\/p>", "<p>电网联系紧密，保护误动对系统影响较大<\/p>", "<p>电网联系较弱，保护误动对系统影响较大<\/p>", "", ""], "r": "ABD", "e": "【定位】第5章，第3节，知识点1：对继电保护的四个基本要求\n【解析】电网联系紧密，保护误动对系统影响较小，若保护拒动将会造成设备损坏或系统稳定性破坏；电网联系较弱，保护误动对系统影响较大，此时更强调不误动的安全性，故选ABD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34797", "t": 2, "q": "继电保护四性的关系是（     ）。", "a": ["<p>有矛盾的一面<\/p>", "<p>有统一的一面<\/p>", "<p>完全对立<\/p>", "<p>相互补充，没有矛盾<\/p>", "", ""], "r": "AB", "e": "【定位】第5章，第3节，知识点1：对继电保护的四个基本要求\n【解析】继电保护的四性既有矛盾的一面，又有在一定条件下统一的一面，四性是分析和研究继电保护的基础，故选AB。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34798", "t": 2, "q": "电力系统中要求快速切除故障的原因包括（     ）。", "a": ["<p>维持系统稳定性的要求<\/p>", "<p>减少用户在低电压下工作的时间<\/p>", "<p>避免故障进一步扩大<\/p>", "<p>减少对通信系统的干扰<\/p>", "", ""], "r": "ABCD", "e": "【定位】第5章，第3节，知识点1：对继电保护的四个基本要求\n【解析】要求快速切除故障的原因包括1）维持系统稳定性的要求，必须快速切除高压输电线路上发生的故障，2) 减少用户在低电压下工作的时间，3) 避免故障进一步扩大，4)减少故障元件的损坏程度，5）减少对通信系统的干扰，故选ABCD。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34799", "t": 3, "q": "对于传送大功率的输电线路保护，一般宜于强调可信赖性；而对于其他线路保护，往往宜于强调安全性。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p>【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类 【解析】对于传送大功率的输电线路（如重要的主干输电线路），其故障影响范围大，更强调安全性（即不该动作时绝对不能误动，避免因误动切断大功率输电线路，造成大停电等严重后果）；而对于其他一些线路（如分支线路等），相对更强调可信赖性（该动作时可靠动作，及时切除故障）。<\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34800", "t": 3, "q": "纵联保护的通道异常时，其后备保护应同时停用。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点7；两种电网保护基本原理；\n【解析】纵联保护通道异常时，纵联保护本身可能会退出，但后备保护（如距离保护、零序电流保护等 ）的作用是在主保护拒动或异常时发挥作用，以保障电力系统故障能被切除，不能因纵联保护通道异常就停用后备保护，否则会失去故障后的保护手段。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34801", "t": 3, "q": "当电力系统发生短路故障时，保护的灵敏度越高越好。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章，第3节，知识点1：对继电保护的四个基本要求\n【解析】保护的灵敏度需在合理范围内。灵敏度过高，可能会导致保护装置在系统出现正常运行波动（如负荷电流较大变化、系统振荡等非故障情况）时误动作；而灵敏度不足，又无法可靠检测到故障。所以应根据系统实际需求，使灵敏度处于既能可靠检测故障，又不会因过度灵敏而误动的合理值，并非越高越好。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34802", "t": 3, "q": "在高压电网中，维持电力系统暂态稳定性往往成为继电保护快速性要求的决定性因素，故障切除越快，暂态稳定极限越高，越能发挥电网的输电效能。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/FpBzI17MYnKYFmQNxZfYrj5gk5xaprJIMBELRNCs.png\"><\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34803", "t": 3, "q": "当断路器拒动时，由辅助保护来实现后备保护。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护。\n【解析】当断路器拒动时，由远后备或失灵保护动作于跳闸，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34804", "t": 3, "q": "继电保护最终动作于故障线路上安装的断路器将故障切除。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护。\n【解析】继电保护的动作目标是通过作用于故障线路的断路器来切除故障，但表述中“故障线路上安装的断路器”不够准确。实际上，断路器通常安装在变电站的线路侧或母线侧，用于控制和保护该线路。继电保护动作时，直接作用的是与故障线路相连的断路器（如线路两侧的断路器），而非“故障线路上”安装的断路器（线路本身一般不直接安装断路器）。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34805", "t": 3, "q": "按控制地点的不同，手动分、合闸控制又分为远方控制和就地控制。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定义】第5章，第1节，知识点3：断路器的控制回路\n【解析】手动分、合闸控制按控制地点划分，远方控制指在主控室或监控系统远程操作断路器分合；就地控制则是在设备现场通过操作机构直接操作。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34806", "t": 3, "q": "断路器电磁操作机构的合闸电流脉冲可以直接作用于断路器的合闸线圈。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定义】第5章，第1节，知识点3：断路器的控制回路\n【解析】断路器电磁操作机构的合闸线圈需要较大的电流才能动作，但直接用合闸电流脉冲作用存在问题：一方面，合闸脉冲可能来自控制回路，其电流较小，无法满足合闸线圈的功率需求；另一方面，为防止干扰和保护回路，通常需通过合闸接触器等中间元件进行功率放大和隔离。正确流程是：合闸脉冲先触发合闸接触器线圈，接触器触点闭合后，由直流电源向合闸线圈提供大电流使其动作。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34807", "t": 3, "q": "在断路器合闸回路中串入断路器辅助常闭触点，在断路器跳闸回路中串入断路器辅助常开触点。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定义】第5章，第1节，知识点3：断路器的控制回路\n【解析】合闸回路串辅助常闭触点：断路器合闸前，辅助常闭触点处于闭合状态，确保合闸回路接通；合闸后，辅助常闭触点断开，切断合闸回路，防止重复合闸。跳闸回路串辅助常开触点：断路器跳闸前，辅助常开触点处于断开状态，跳闸回路不通；跳闸后，辅助常开触点闭合，可用于信号反馈或连锁回路（如重合闸）。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34808", "t": 3, "q": "断路器防跳回路的作用是防止断路器在无故障的情况下误跳闸。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定义】第5章，第1节，知识点3：断路器的控制回路\n【解析】断路器防跳回路的核心作用是防止断路器在合闸过程中因控制开关粘连或接点卡住等原因，导致多次“合-跳-合”的跳跃现象，而非防止误跳闸。当线路存在故障时，断路器跳闸后若控制开关仍处于合闸位置，防跳回路会通过自身接点锁定跳闸状态，避免重复合闸对设备造成损害。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34809", "t": 3, "q": "继电保护装置的作用是当发生故障或出现异常情况时，作用于断路器，自动切除故障或异常元件。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】继电保护装置的作用是当发生故障，作用于断路器，自动切除故障元件；当出现异常情况时发出信号，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34810", "t": 3, "q": "电力系统的运行状态分为正常工作状态和不正常工作状态。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】电力系统的运行状态分为正常工作状态、不正常工作状态和故障状态，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34811", "t": 3, "q": "电力系统的不等式约束条件中用电设备的功率要处于允许的上下限之间。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】用电设备功率上线就是额定功率，下限就是不用点功率为0，所以只考虑上线，不考虑下限，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34812", "t": 3, "q": "电力系统的不等式约束条件中系统频率要处于允许的上下限之间。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类<\/p>\n<p>【解析】在电力系统运行的不等式约束条件中，包含系统频率、电压、潮流等多项运行参数的限值约束。其中系统频率是衡量电能质量和电网运行状态的核心指标，为保障发电机组安全稳定运行、用电设备正常工作，系统运行频率必须严格控制在国家规定的允许上下限范围内，超出限值会引发设备损坏、系统失稳等问题，因此该表述正确。<\/p>", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34813", "t": 3, "q": "所有的等式约束条件均满足，部分的不等式约束条件不满足的工作状态称为不正常运行状态。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】所有的等式约束条件均满足，部分的不等式约束条件不满足但又不是故障的工作状态称为不正常运行状态，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34814", "t": 3, "q": "系统振荡时，电流和电压周期性摆动。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第5章，第1节，知识点2：电力系统的特点及运行状态的分类\n【解析】系统振荡时，电流和电压周期性摆动，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34815", "t": 3, "q": "继电保护包括继电保护技术和继电保护装置两个方面的含义。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】继电保护包括继电保护技术和继电保护装置两个方面的含义，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34816", "t": 3, "q": "电力系统中正常运行、不正常运行和故障状态下会发生变化的参量都可以用来构成继电保护原理。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】必须是可测参量才可以用来构建继电保护，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34817", "t": 3, "q": "继电保护装置包括测量比较元件、逻辑判断元件和执行输出元件三部分。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第5章，第2节，知识点1：继电保护的基本组成部分：测量比较部分；逻辑判别部分；出口执行部分\n【解析】继电保护装置包括测量比较元件、逻辑判断元件和执行输出元件三部分，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34818", "t": 3, "q": "三段式电流保护属于过量保护。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】三段式电流保护属于过量保护，当电流值大于等于整定值时动作，故选A。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34819", "t": 3, "q": "距离保护属于过量保护。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章，第1节，知识点3：电网保护基本原理\n【解析】距离保护属于欠量保护，当测量阻抗小于整定阻抗值时动作，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34820", "t": 3, "q": "当断路器拒动时，近后备保护仍能独自发挥作用。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护\n【解析】近后备保护和主保护安装在同一位置，当断路器拒动时，近后备保护需与失灵保护相配合才能发挥作用，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34821", "t": 3, "q": "电力系统中的每一个重要元件都必须配备至少一套保护。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章，第2节，知识点4：主保护与后备保护\n【解析】电力系统中的每一个重要元件都必须配备至少两套保护，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}, {"id": "34822", "t": 3, "q": "电网联系紧密，系统备用容量充足时，保护拒动对系统的影响较小。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第5章，第3节，知识点1：对继电保护的四个基本要求\n【解析】电网联系紧密，系统备用容量充足时，保护误动对系统的影响较小，故选B。", "l3": "电力系统基础", "l4": "第5章-考纲删除", "ap": [false, false, false, false, false, false]}]}, {"k": "电力系统基础||第6章", "n": "电力系统基础 / 第6章", "qs": [{"id": "34823", "t": 1, "q": "新型电力系统电源构成转变的核心方向是（     ）。", "a": ["<p>化石能源为主→常规能源为主<\/p>", "<p>化石能源为主→大规模可再生能源为主<\/p>", "<p>可再生能源为主→化石能源为主<\/p>", "<p>常规能源为主→核电为主<\/p>", "", ""], "r": "B", "e": "【定位】第6章，第1节，知识点5：新型电力系统的内涵和运行特点。\n【解析】新型电力系统内涵”的“电源构成转变”，明确电源构成由以化石能源发电为主导，向大规模可再生能源发电为主转变，故选B。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34824", "t": 1, "q": "下列不属于新型电力系统“五个转变”的是（     ）。", "a": ["<p>电源构成转变<\/p>", "<p>电网形态转变<\/p>", "<p>负荷特性转变<\/p>", "<p>能源政策转变<\/p>", "", ""], "r": "D", "e": "【定位】第6章，第1节，知识点5：新型电力系统的内涵和运行特点。\n【解析】新型电力系统“五个转变”包括电源构成、电网形态、负荷特性、技术基础、运行特性转变，无“能源政策转变”，故选D。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34825", "t": 1, "q": "新型储能相较于抽水蓄能的优势不包括（     ）。", "a": ["<p>建设周期短<\/p>", "<p>选址灵活<\/p>", "<p>调节能力强<\/p>", "<p>储能容量更大<\/p>", "", ""], "r": "D", "e": "<p>【定位】第6章，第2节，知识点1：新型储能的概念。 【解析】新型储能建设周期短（电化学储能3-6个月）、选址灵活（不受地势限制）、调节能力强（毫秒至秒级响应）；抽水蓄能是目前容量最大的储能技术，“储能容量更大”并非新型储能优势，故选D。<\/p>", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34826", "t": 1, "q": "2024年，在新型储能累计装机中占比最高的技术是（     ）。", "a": ["<p>全钒液流电池<\/p>", "<p>磷酸铁锂电池<\/p>", "<p>压缩空气储能<\/p>", "<p>飞轮储能<\/p>", "", ""], "r": "B", "e": "【定位】第6章，第1节，知识点2：新型储能的分类。\n【解析】2024年以磷酸铁锂为代表的锂离子电池储能累计装机占整体新型储能的96%，为占比最高的技术，故选B。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34827", "t": 1, "q": "新型电力系统以（     ）为主体，应用了高比例电力电子设备具有清洁低碳等特点。", "a": ["传统能源", "化石能源", "新能源", "核能资源", "", ""], "r": "C", "e": "【定位】第6章，第1节，知识点4：新型电力系统的特征。\n【解析】新型电力系统以新能源为主体，这是实现双碳目标的关键。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34828", "t": 1, "q": "传统电力系统的电源主体是（     ），新型电力系统的电源主体是（     ）。", "a": ["异步发电机，同步发电机", "同步发电机，特种发电机", "非同步电源，特种发电机", "同步发电机，非同步电源", "", ""], "r": "D", "e": "【定位】第6章，第1节，知识点4：新型电力系统与传统电力系统的不同点。\n【解析】传统电力系统基本是刚性的。传统电力系统电源的主体是同步发电机，系统的稳定以惯量平衡为基础。新型电力系统是柔性的。以新能源为主体的发电系统是非同步电源，有大量的电力电子设备。系统的稳定已无法依靠惯量平衡为基础，而是依靠功率的动态平衡、能量的动态平衡。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34829", "t": 1, "q": "目前较为成熟的储能方式，已经得到了较为广泛的应用，也是目前电力系统中唯一大规模采用的储能方式是（     ）。", "a": ["飞轮储能", "抽水蓄能", "超导储能", "压缩空气储能", "", ""], "r": "B", "e": "【定位】第6章，第1节，知识点2：新型储能的分类。\n【解析】抽水蓄能电站具有以下显著优势： 技术成熟度高‌，抽水蓄能技术经过多年的发展，已经成为最成熟、历史最悠久、设备容量最大的商业化技术；‌经济性好‌，抽水蓄能电站的峰谷电价比通常可达3~4：1，利润空间较大，特别适用于电力系统峰谷差显著的情况；环境友好‌，抽水蓄能电站减少了化石能源的消耗，降低了二氧化碳、二氧化硫和氮氧化物的排放，有利于应对气候变化和生态环境保护；灵活调节‌，抽水蓄能电站可以快速响应电力系统的负荷变化，满足调峰、填谷、调频、调相等多种需求，是电力系统中的重要调节电源；大规模开发条件优越‌，抽水蓄能电站的建设条件相对灵活，可以通过调整上下水库的高度差来适应不同的电力需求和地理条件。飞轮储能和压缩空气储能相对设备容量小些；超导储能相对成本较高。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34830", "t": 1, "q": "以下不属于目前电网中常见的储能应用方式的是（     ）。", "a": ["抽水蓄能", "压缩空气储能", "电池储能", "等离子体储能", "", ""], "r": "D", "e": "【定位】第6章，第1节，知识点2：新型储能的分类。\n【解析】常见储能技术有：抽水蓄能、压缩空气储能、电池储能、飞轮储能、超导储能。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34831", "t": 1, "q": "下列储能技术中，不属于电化学储能的是（     ）。", "a": ["<p>锂离子电池<\/p>", "<p>钠硫电池<\/p>", "<p>压缩空气储能<\/p>", "<p>铅蓄电池<\/p>", "", ""], "r": "C", "e": "【定位】第6章，第1节，知识点2：新型储能的分类。\n【解析】电化学储能包括锂离子电池、钠离子电池、液流电池、铅蓄电池、钠硫电池等；压缩空气储能属于机械储能，故选C。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34832", "t": 1, "q": "新型电力系统运行特性转变的方向是（     ）。", "a": ["<p>“荷随源动”→“源随荷动”<\/p>", "<p>“源随荷动”→源网荷储协同互动<\/p>", "<p>“源网荷储协同”→“源随荷动”<\/p>", "<p>“荷随源动”→源网荷储协同<\/p>", "", ""], "r": "B", "e": "【定位】第6章，第1节，知识点5：新型电力系统的内涵和运行特点。\n【解析】运行特性由“源随荷动”单向计划调控向源网荷储多元协同互动转变，故选B。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34833", "t": 1, "q": "构网型储能相较于跟网型储能的核心优势是（     ）。", "a": ["<p>依赖电网同步信号<\/p>", "<p>无需依赖电网同步信号<\/p>", "<p>储能容量更大<\/p>", "<p>建设成本更低<\/p>", "", ""], "r": "B", "e": "【定位】第6章，第1节，知识点5：构网型储能技术。\n【解析】构网型储能最大优势是“无需依赖电网的同步信号”，可独立建立和稳定电网电压、频率；跟网型储能依赖电网同步信号，A错误；二者在容量、成本上无明确核心优势差异，C、D错误，故选B。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34834", "t": 1, "q": "实现“双碳”目标能源是关键，发展可再生能源是根本，以下属于新增能源的主力军的是（     ）。", "a": ["<p>光伏和风电<\/p>", "<p>海洋能<\/p>", "<p>核电<\/p>", "<p>地热能<\/p>", "", ""], "r": "A", "e": "【定位】第6章，第1节，知识点6：新型电力系统的定位。\n【解析】实现“双碳”目标能源是关键，发展可再生能源是根本，光伏、风电将成为新增能源的主力军。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34835", "t": 1, "q": "以下不属于钠离子电池储能技术优点的是（     ）。", "a": ["<p>低温性能好<\/p>", "<p>循环寿命短<\/p>", "<p>充放电倍率高<\/p>", "<p>安全性高<\/p>", "", ""], "r": "B", "e": "【定位】第6章，第2节，知识点4：新型储能的原理\n【解析】钠离子电池具有资源丰富、成本低、低温性能好、充放电倍率高、安全性高等优势，但钠离子电池面临循环寿命短、能量密度低等问题。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34836", "t": 2, "q": "以下不属于新型电力系统的特点是（     ）。", "a": ["多能协调互补，以传统能源为主", "清洁低碳、安全充裕", "经济高效、供需协同", "源随荷动，以荷定源", "", ""], "r": "AD", "e": "【定位】第6章，第1节，知识点4：新型电力系统的特征。\n【解析】新型电力系统是以新能源为供给主体、应用了高比例电力电子设备，以数字电网为支撑平台，具备多能协调互补、源网荷储互动、用能需求智控功能，具有清洁低碳、安全充裕、经济高效、供需协同，灵活智能等特点。传统电力系统电源的主体则是同步发电机，以传统能源为主，是源随荷动，以荷定源的确定性电量平衡来实现稳定运行的。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34837", "t": 2, "q": "<p>新型电力系统的定位包括（ ）。<\/p>", "a": ["<p>融入中国式现代化建设<\/p>", "<p>服务构建新发展格局<\/p>", "<p>推进碳达峰碳中和<\/p>", "<p>保障国家能源安全<\/p>", "", ""], "r": "ABCD", "e": "【定位】第6章，第1节，知识点6：新型电力系统的定位。\n【解析】以上四项均为新型电力系统的定位，另外还包括推动能源高质量发展。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34838", "t": 2, "q": "新型电力系统“五个转变”中，涉及电网和负荷侧的转变包括（     ）。", "a": ["<p>电源构成转变<\/p>", "<p>电网形态转变<\/p>", "<p>负荷特性转变<\/p>", "<p>技术基础转变<\/p>", "", ""], "r": "BC", "e": "【定位】第6章，第1节，知识点5：新型电力系统的内涵和运行特点。\n【解析】新型电力系统内涵”，“五个转变”中，“电网形态转变”直接涉及电网侧，“负荷特性转变”直接涉及负荷侧；A为电源侧，D为技术基础，故选BC。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34839", "t": 2, "q": "下列属于电化学储能技术的有（     ）。", "a": ["<p>锂离子电池<\/p>", "<p>钠硫电池<\/p>", "<p>全钒液流电池<\/p>", "<p>压缩空气储能<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，第2节，知识点2：新型储能的分类。\n【解析】电化学储能涵盖锂离子电池、钠离子电池、液流电池（含全钒液流电池）、铅蓄电池、钠硫电池等；压缩空气储能属于机械储能，D排除。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34840", "t": 2, "q": "新型储能在电源端发挥的作用包括（     ）。", "a": ["<p>平滑新能源出力<\/p>", "<p>提高新能源消纳能力<\/p>", "<p>参与调频辅助服务<\/p>", "<p>降低用户用电成本<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，第2节，知识点3：新型储能应用场景和发挥的作用。\n【解析】新型储能在源网荷端发挥的作用”的“电源端”部分，作用包括平滑新能源出力、提高新能源消纳能力、参与调频辅助服务；D为负荷端作用。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34841", "t": 2, "q": "新型电力系统的核心特征包括（     ）。", "a": ["<p>清洁低碳、安全充裕<\/p>", "<p>经济高效、供需协同<\/p>", "<p>灵活智能<\/p>", "<p>安全可靠<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，第2节，知识点4：新型电力系统的特征。\n【解析】新型电力系统具备清洁低碳、安全充裕、经济高效、供需协同、灵活智能五大核心特征，全选ABC。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34842", "t": 2, "q": "构网型储能的技术特性包括（     ）。", "a": ["<p>本质是电压源<\/p>", "<p>主动支撑电网<\/p>", "<p>依赖电网同步信号<\/p>", "<p>适应新型电力系统<\/p>", "", ""], "r": "ABD", "e": "【定位】第6章，第2节，知识点5：构网型储能技术。\n【解析】构网型储能本质是电压源（A正确），可主动支撑电网（B正确），无需依赖电网同步信号（C错误），适应新型电力系统（D正确）。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34843", "t": 2, "q": "新型电力系统“经济高效”特征的实现路径包括（     ）。", "a": ["<p>坚持全面节约战略<\/p>", "<p>建立源网荷储互动平台<\/p>", "<p>实现转型成本公平分担<\/p>", "<p>提升终端用能电气化<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，第1节，知识点4：新型电力系统的特征。\n【解析】新型电力系统特征”的“经济高效”部分，实现路径包括坚持全面节约战略、建立源网荷储互动平台、实现转型成本公平分担、推动电力价值升级；D为“清洁低碳”特征中能源消费侧的目标，排除，故选ABC。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34844", "t": 2, "q": "新型储能在电网端发挥的作用包括（     ）。", "a": ["<p>延缓电网扩容投资<\/p>", "<p>提升电网稳定性<\/p>", "<p>优化电网运行效率<\/p>", "<p>促进分布式能源消纳<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，第2节，知识点3：新型储能应用场景和发挥的作用。\n【解析】新型储能在源网荷端发挥的作用”的“电网端”部分，作用包括延缓电网扩容投资、提升电网稳定性、优化电网运行效率；D为负荷端作用，排除，故选ABC。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34845", "t": 2, "q": "新型电力系统负荷特性转变的具体表现包括（     ）。", "a": ["<p>从刚性向柔性转变<\/p>", "<p>从消费型向产消型转变<\/p>", "<p>从被动型向主动型转变<\/p>", "<p>从交流向直流转变<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，第1节，知识点5：新型电力系统的内涵和运行特点。\n【解析】依据“知识点3：新型电力系统内涵”的“负荷特性转变”，具体表现为从刚性向柔性转变、从消费型向产消型转变、从被动型向主动型转变；D为“电网形态转变”内容，排除，故选ABC。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34846", "t": 2, "q": "新型电力系统运行特性转变的具体内容包括（     ）。", "a": ["<p>平衡模式从源荷实时平衡→源网荷储协同平衡<\/p>", "<p>实现“源-储-荷”时间解耦<\/p>", "<p>从单向计划调控→多元协同互动<\/p>", "<p>从同步运行→异步运行<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，第1节，知识点5：新型电力系统的内涵和运行特点。\n【解析】新型电力系统内涵”的“运行特性转变”，具体内容包括平衡模式从源荷实时平衡向源网荷储协同平衡转变（A正确）、实现“源-储-荷”时间解耦（B正确）、从单向计划调控向多元协同互动转变（C正确）；D未提及，排除，故选ABC。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34847", "t": 2, "q": "新型电力系统的储能体系将构建跨时空多元融合的结构，以下属于短时间尺度上的作用的是（     ）。", "a": ["<p>提供虚拟惯量服务<\/p>", "<p>提供调频服务<\/p>", "<p>提供爬坡服务<\/p>", "<p>提供日内备用<\/p>", "", ""], "r": "ABC", "e": "【定位】第6章，第1节，知识点3：新型电力系统的构成要素。\n【解析】短时间尺度上：采用电化学为主的短时储能，提供虚拟惯量、调频、爬坡等辅助服务。中时间尺度上：配置抽水蓄能、压缩空气等储能技术，提供日内备用与调峰能力，利用分布式用户侧电动汽车来满足日内需求响应。因此选择ABC。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34848", "t": 2, "q": "新型电力系统的电网将具备明显的平台枢纽特性，电网不再仅是电力流的优化配置平台，还涵盖（     ）流、 （     ）流和（     ）流等多种信息-能量-价值融合的管理平台。", "a": ["<p>碳排放<\/p>", "<p>成本<\/p>", "<p>货币<\/p>", "<p>信息数字<\/p>", "", ""], "r": "ABD", "e": "【定位】第6章，第1节，知识点3：新型电力系统的构成要素\n【解析】多元化方面：电网不再仅是电力流的优化配置平台，还涵盖碳排放流、成本流、信息数字流等多种信息-能量-价值融合的管理平台。因此选择ABD。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34849", "t": 3, "q": "新型电力系统是以新能源为供给主体，以确保能源电力安全为基本前提、以满足新能源的发展和消纳为首要目标，确保新能源可持续性发展。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第6章，第1节，知识点2：新型电力系统的定义\n【解析】新型电力系统是以新能源为供给主体、以确保能源电力安全为基本前提、以满足经济社会发展电力需求为首要目标的新一代电力系统。不管新型还是传统的电力系统都是以确保电力安全的前提下，以满足经济社会发展电力需求为首要目标。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34850", "t": 3, "q": "传统电力系统以机械电磁设备为主的高转动惯量系统逐步向新型电力系统以为电力电子器件为主的低转动惯量系统演化。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第6章，第1节，知识点5：新型电力系统的内涵和运行特点\n【解析】传统电力系统是集中式的，依靠大容量、数量有限的发电机组实现基于转动惯量的系统总体稳定；新型电力系统是分布式的，单位容量小、数量“无限”的新能源发电机组共同实现系统动态平衡，从而保证系统稳定运行；传统电力系统以机械电磁设备为主的高转动惯量系统逐步向新型电力系统以电力电子器件为主的低转动惯量系统演化。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34851", "t": 3, "q": "新型电力系统是集中式的，单位容量小、数量“无限”的新能源发电机组共同实现系统动态平衡，从而保证系统稳定运行。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第6章，第1节，知识点7：新型电力系统与传统电力系统的差异。\n【解析】新型电力系统是分布式的，单位容量小、数量“无限”的新能源发电机组共同实现系统动态平衡，从而保证系统稳定运行。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34852", "t": 3, "q": "相较抽水蓄能，新型储能具备响应速度快、调节能力强等显著优势。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第6章，第2节，知识点1：新型储能的概念\n【解析】建设周期短、选址灵活、调节能力强、响应速度快均是新型电力系统的优点。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34853", "t": 3, "q": "新型电力系统有大量的电力电子设备，系统的稳定已无法依靠惯量平衡为基础，因此不需要考虑系统的稳定运行和动态平衡。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第6章，第1节，知识点7：新型电力系统与传统电力系统的差异\n【解析】电力系统的安全稳定运行始终是核心，大规模新能源的接入将改变电力运行稳定问题的现状。新型电力系统通过概率性动态电力平衡（电力平衡、电量平衡；有功功率平衡、无功功率平衡）实现稳定运行。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34854", "t": 3, "q": "用户侧储能在低谷电价时段将电能存储在储能设备中，高峰电价时段使用储能设备中的电能，增加了充放电次数和网络损耗，提高了用电成本。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""] 确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第6章，第2节，知识点4：新型电力系统的特征。\n【解析】新型电力系统特征”的“清洁低碳”部分，能源供给侧目标是多元化、清洁化、低碳化，能源消费侧目标是高效化、减量化、电气化。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}, {"id": "34861", "t": 3, "q": "新型储能在负荷端可通过峰谷电价差降低用户用电成本，也可作为应急备用电源。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第6章，第2节，知识点3：新型储能应用场景和发挥的作用。\n【解析】新型储能在源网荷端发挥的作用”的“负荷端”部分，新型储能在负荷端可利用峰谷电价差降低用电成本，也可在电网故障时作为应急备用电源。", "l3": "电力系统基础", "l4": "第6章", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = !!ans;
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
