<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>奕诚-电力系统基础</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <button class="btn" id="back" style="display:none">‹ 返回</button>
  <h1 id="hTitle">珞研刷题</h1>
  <button class="star" id="star" style="display:none">★</button>
</header>
<main id="app"></main>

<script>
const DATA = {"id": "yc51", "name": "奕诚-电力系统基础", "chapters": [{"k": "电力系统基础||第1章", "n": "电力系统基础 / 第1章", "qs": [{"id": "35647", "t": 1, "q": "电力系统是由（     ）环节组成。", "a": ["发电-输电-供电（配电）", "发电-变电-输电-变电", "发电-变电-输电", "发电-变电-输电-变电（配电）-用电", "", ""], "r": "D", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电力系统由生产（发电）、变换（变电）、输送（输电）、分配（配电）、消费电能（用电）的发电机、变压器、电力线路、各种用电设备组成统一整体。D选项按发电到用电，完整地描述了电力系统的组成部分。ABC选项均不完整，故选D。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35648", "t": 1, "q": "我国目前电力网的最高电压等级是（     ）。", "a": ["交流500kV，直流±500kV", "交流750kV，直流±500kV", "交流500kV，直流±800kV", "交流1000kV，直流±1100kV", "", ""], "r": "D", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】我国特高压为交流1000kV，直流±1100kV，选D。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35649", "t": 1, "q": "用于电能远距离输送的线路称为（     ）。　", "a": ["配电线路", "直配线路", "输电线路", "输、配电线路", "", ""], "r": "C", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】用于电能远距离输送的线路称为输电线路，选C。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35650", "t": 1, "q": "电力线路根据在电能输送过程的作用分为（     ）。", "a": ["输电线路和配电线路", "直流输电线路和交流输电线路", "电缆线路和架空线路　", "低压线路、高压线路、超高压线路和特高压线路", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电力线路按其作用的不同分为输电线路和配电线路。电力线路按其输送电流的性质分为直流输电线路和交流输电线路。电力线路按其结构分为电缆线路和架空线路。电力线路按其电压等级分为低压线路、高压线路、超高压线路和特高压线路。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35651", "t": 1, "q": "根据在电压变换中的作用，变压器分为（     ）。", "a": ["升压变压器和降压变压器", "双绕组变压器和多绕组变压器", "普通变压器和自耦变压器　", "三相变压器和组式变压器", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】变压器按其对电压变换中的作用分为升压变压器和降压变压器。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35652", "t": 1, "q": "一台降压变压器的变比是220/38.5kV，则低、高压侧接入电力网的额定电压为（     ）。", "a": ["<p>38.5kV，220kV<\/p>", "<p>35kV，242kV<\/p>", "<p>38.5kV，242kV<\/p>", "<p>35kV，220kV<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/5ghCyYCEFz68raxXFWrgTF9M3v4wi5zLcsGkc0ek.png\"><\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35653", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/x61QFrMO4OH5d62qmXvuIhhY7f7p3ztgTJzuenDE.png\"><\/p>", "a": ["<p>10kV<\/p>", "<p>10.5kV<\/p>", "<p>11kV<\/p>", "<p>10.75kV<\/p>", "", ""], "r": "B", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】发电机有直配线，额定电压为线路额定电压的105%，即10.5kV。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35654", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/zYujkfGQSHmDQGw3H69LBEvJOHxyEoSyX10InYNo.png\"><\/p>", "a": ["<p>10/110kV<\/p>", "<p>10.5/110kV<\/p>", "<p>10.5/121kV<\/p>", "<p>10/121kV<\/p>", "", ""], "r": "C", "e": "<p>【定位】第1章，第2节，知识点2：电力系统额定电压的规定<\/p>\n<p>【解析】变压器T1一次绕组直接与发电机相联，额定电压等于发电机的额定电压，即10.5kV；二次绕组额定电压为1.1U<sub>N<\/sub>，即121kV。故变比为10.5/121kV。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35655", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/86S4I7fIucuFkyzmgmIoLDP8QK6GYXaNGS7tfYqj.png\"><\/p>", "a": ["<p>110/35kV<\/p>", "<p>121/35kV<\/p>", "<p>121/38.5kV<\/p>", "<p>110/38.5kV<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/T3DtyyeUTmhkFUK2rUiqUurk8DuqCNmO3xOWgZnq.png\"><\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35656", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/FnsNYZctaCZ9aVaWnixKQ8L7iKZbpFWnGeWeVPD2.png\"><\/p>", "a": ["<p>35/6kV<\/p>", "<p>35/6.3kV<\/p>", "<p>35/6.6kV<\/p>", "<p>38.5/6kV<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/wKdl99LEnaEsarsp77YKXhzyngQjvUtcmO9QXaR0.png\"><\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35657", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/V4diKEvoaFjSjAQd4ZJP1qy7CqPhpB2E3COUObOC.png\"><\/p>", "a": ["<p>35/11kV<\/p>", "<p>35/10.5kV<\/p>", "<p>35/10kV<\/p>", "<p>38.5/11kV<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/B6pTrVVwwFmQDx7jFVhBTWzCoi1uYzOnjjmrLw3P.png\"><\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35658", "t": 1, "q": "下面不属于电力系统基本特点的是（     ）。", "a": ["同时性", "实时性", "快速性", "重要性", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】电力系统基本特点是：同时性、快速性、重要性。ACD均属于电力系统的基本特点， B选项不属于电力系统的基本特点，故选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35659", "t": 1, "q": "对电力系统的基本要求是（     ）。", "a": ["在优质前提下，保证安全，力求经济", "在经济前提下，保证安全，力求经济", "在安全前提下，保证优质，力求经济", "在降低网损情况下，保证一类用户供电", "", ""], "r": "C", "e": "【定位】第1章，第3节，知识点2：电力系统运行的基本要求\n【解析】电力系统基本要求是：可靠、优质、经济、环保，其中安全可靠排第一位，故选C。AB选项排第一位的分别是优质、经济；D选项把经济（降低网损）排第一位，此外，系统不仅要满足一类负荷的供电可靠性要求，而且也要满足各类负荷的供电可靠性要求，故ABD选项错。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35660", "t": 1, "q": "对于供电可靠性，下述说法中正确的是（     ）。", "a": ["所有负荷都应当做到在任何情况下不中断供电", "一级和二级负荷应当在任何情况下不中断供电", "除一级负荷不允许中断供电外，其它负荷随时可以中断供电", "一级负荷在任何情况下都不允许中断供电、二级负荷应尽可能不停电、三级负荷可以根据系统运行情况随时停电", "", ""], "r": "D", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】各级负荷对供电可靠性的要求：一级负荷在任何情况下都不允许中断供电、二级负荷应尽可能不停电、三级负荷可以根据系统运行情况随时停电。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35661", "t": 1, "q": "10kV电压等级电压的允许偏移范围为电压额定值的（     ）。", "a": ["±5%", "±7%", "±7%～－10%", "±10%", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】10kV及以下电压等级允许的偏移范围为电压额定值的±7%。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35662", "t": 1, "q": "<p>我国对大型电力系统的允许频率偏移是（ ）。<\/p>", "a": ["<p>±0.2Hz<\/p>", "<p>±0.5Hz<\/p>", "<p>±(0.2~0.5)Hz<\/p>", "<p>+0.2Hz~-0.5Hz<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260731/b8l4NuEk0dasJTh4Uh34fzXnHlZkxOU7CnCcozOk.png\"><\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35663", "t": 1, "q": "380V公用电网电压波形畸变率不超过（     ）。", "a": ["<p>±5%<\/p>", "<p>±4%<\/p>", "<p>4%<\/p>", "<p>5%<\/p>", "", ""], "r": "D", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】380V公用电网电压波形畸变率不超过5%，选D。6～10kV公用电网电压波形畸变率不超过4%。ABC选项错。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35664", "t": 1, "q": "关于联合电力系统，下述说法中错误的是（     ）。", "a": ["<p>联合电力系统可以更好地合理利用能源<\/p>", "<p>在满足负荷要求的情况下，联合电力系统的装机容量可以减少<\/p>", "<p>联合电力系统可以提高供电可靠性和电能质量<\/p>", "<p>联合电力系统不利于装设效率较高的大容量机组<\/p>", "", ""], "r": "D", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】选项A：联合系统可在更大范围内调配电力，例如：水电丰富地区丰水期多发电，弥补火电不足地区的需求；不同能源类型互补（风电、光伏与火电结合），减少弃风弃光现象。选项B：联合后各地区负荷高峰错开（如时差、季节差异），总最大负荷小于各系统独立时的总和，因此所需装机容量减少。例如：东部地区白天负荷高峰时，西部地区可能处于夜间低负荷状态，联合后无需各自满配备用容量。选项C：大电网的优势包括：多电源供电，单机组故障影响降低；系统惯性增强，频率和电压波动更易控制；备用容量共享，减少局部故障导致的停电风险。选项D：大容量机组效率高、单位发电成本低，但需要稳定的大电网承载其出力波动。联合系统规模大、负荷多样，恰好能提供这种支撑。若为独立小系统，大机组反而可能因负荷不匹配导致频繁启停，效率降低。因此，D选项颠倒了逻辑关系。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35665", "t": 1, "q": "下列变比的变压器中，属于升压变压器的是（     ）。", "a": ["<p>500/121kV<\/p>", "<p>242/121/22kV<\/p>", "<p>110/10.5kV<\/p>", "<p>220/121/38.5kV<\/p>", "", ""], "r": "B", "e": "【定位】第1章，第2节，知识点1：电气设备的额定电压和额定频率\n【解析】选项A：若为升压变压器，则两边的线路额定电压应为110kV升到500kV，根据变压器额定电压的规定，一次侧低压侧额定电压为110kV，二次侧高压侧额定电压为550kV，故选型A并不是升压变压器；选项B中的22kV为国家标准规定发电机额定电压，若为升压变的话，则中压侧电压应为线路额定电压的1.1倍即121kV，高压侧电压同样也为线路额定电压的1.1倍即242kV，故选项B为正确答案；选项C：同上分析，由10kV线路电压升高到110kV，一次侧连接的肯定是发电机，则应等于发电机额定电压10.5kV，二次侧应比110kV电压高10%为121kV，故选项C错误；选项D：同上分析可知应为降压变压器，由高压线路220kV降低到中压110kV和低压35kV，一次侧等于220kV，中压和低压侧分别比线路电压高10%，为121kV和38.5kV。综上可知，正确答案应选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35666", "t": 1, "q": "电力系统中一级负荷、二级负荷和三级负荷的划分依据是用户对供电的（     ）。", "a": ["<p>可靠性要求　<\/p>", "<p>经济性要求　<\/p>", "<p>灵活性要求<\/p>", "<p>优质性要求<\/p>", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】选项A：负荷等级的划分直接取决于用户对供电连续性的需求：一级负荷：停电会导致人身安全威胁或重大经济损失（如医院、核电站）。二级负荷：停电会造成较大不便或一定经济损失（如商业中心）。三级负荷：允许短时停电，影响较小（如普通居民用电）。选项B：经济性是电力系统规划中的优化目标（如成本最低、资源分配），而非负荷等级划分依据。可能误认为高耗能用户因经济原因被特殊对待，但这属于负荷管理策略，与等级划分无关。选项C：灵活性指系统应对波动（如可再生能源出力变化）的能力，与用户对供电中断的容忍度无关。可能将“灵活供电”与“允许停电”混淆，但灵活性是系统特性，非用户需求。选项D：优质性涉及电能质量（如电压、频率稳定性），属于供电质量的范畴。高等级负荷可能对电能质量要求更高，但划分依据仍是供电连续性，而非质量本身。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35667", "t": 1, "q": "构成电力网的主要设备有（     ）。", "a": ["<p>变压器、用电设备<\/p>", "<p>变压器、电力线路<\/p>", "<p>电缆、电动机<\/p>", "<p>电阻、电容<\/p>", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】选项A：用电设备（如电动机、电灯）属于电力系统的“负荷”部分，而非电力网的构成设备。可能将电力系统整体误认为电力网，导致错误包含用电设备。选项B：变压器：用于电压等级转换（如升压输电、降压配电），是电力网的核心设备；电力线路：包括输电线路（高压架空线、电缆）和配电线路，承担电能传输任务。典型场景：电力网的核心任务是连接发电厂与用户，实现电能的远距离传输和分配。选项C：电缆属于电力线路的一种形式，但电动机属于用电设备，属于负荷端，与电力网的构成无关。选项D：电阻、电容是电路中的基本元件，可能存在于电力设备（如补偿电容器）或负载中，但并非电力网的主要构成设备。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35668", "t": 1, "q": "把220kV降为110kV的降压变压器，两侧均与线路相连，则变比为（     ）。", "a": ["<p>220/110kV<\/p>", "<p>242/110 kV<\/p>", "<p>220/121 kV<\/p>", "<p>242/121 kV<\/p>", "", ""], "r": "C", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】降压变压器一次绕组直接与220kV输电线路相连，对线路可看成是用电设备，因此一次绕组额定电压等于线路额定电压220kV，二次绕组与110kV线路相连且位于线路始端，因此要比线路额定电压高10%，等于121kV。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35669", "t": 1, "q": "衡量电能质量的三个主要技术指标是（     ）。", "a": ["<p>电压偏移、电压波形、频率偏移<\/p>", "<p>能源消耗率、厂用电率、网损率<\/p>", "<p>安全性、可靠性、灵活性<\/p>", "<p>可靠性、经济性、对环境的有害程度<\/p>", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】电压质量、频率质量和波形质量是电能质量的三要素，选项A符合；选项B是电力系统发电厂和电网的经济指标；选项C是电力系统接线的基本要求；选项D是电力系统运行的基本要求。故正确答案应选A。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35670", "t": 1, "q": "以下不属于发电机额定电压的是（     ）。", "a": ["<p>10.5kV<\/p>", "<p>20kV<\/p>", "<p>13.8kV<\/p>", "<p>6kV<\/p>", "", ""], "r": "D", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】在发电机有直配线的情况下，其额定电压为线路额定电压的105%；在发电机无直接配电线路情况下，发电机的额定电压根据发电机运行和制造的经济性选择国家规定的额定电压，我国规定的发电机的额定电压除6.3kV、10.5kV之外，还有13.8kV、15.75kV、18kV、20kV、22kV和24kV，故根据以上结论，选项D不在发电机额定电压的规范内。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35671", "t": 1, "q": "下面选项中变压器的变比为额定变比，其中属于降压变压器的是（     ）。", "a": ["<p>121/22kV<\/p>", "<p>110/242kV<\/p>", "<p>121/220kV<\/p>", "<p>550/242/24kV<\/p>", "", ""], "r": "C", "e": "【解析】选项A：22kV明显是国家规定的发电机额定电压，发电机一般连接的变压器是升压变压器将电压升高到高压输电线路，二次侧连接110kV时，二次侧电压比110kV高10%即121kV，故应为升压变压器；选线B：若为降压变压器应有220kV降低到110kV，一次侧等于线路额定电压220kV，二次侧比线路额定电压高10%为121kV；选项C：若为降压变由220kV降低到110kV，根据变压器额定电压的规定，其额定变比为220kv/121kV；选项D：该三绕组变压器中低压侧额定电压24kV为国家规定的发电机额定电压，一般为升压变压器，连接中压220kV和高压500kV线路时，比线路额定电压高10%，为242kV和550kV，应为升压变。故综上所述，正确答案应选C。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35672", "t": 1, "q": "在电力系统的经济调度中，通常考虑的因素是（     ）。", "a": ["<p>发电机的燃料成本<\/p>", "<p>厂用电率<\/p>", "<p>输电线路的损耗<\/p>", "<p>以上都是<\/p>", "", ""], "r": "D", "e": "【定位】第1章，第3节，知识点2：电力系统运行的基本要求\n【解析】电力系统的经济调度是一个综合考虑多个因素的过程，包括发电机的燃料成本、维护成本以及输电线路的损耗等。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35673", "t": 1, "q": "满足同样负荷需求情况下，联合电力系统中发电设备利用率（     ）。", "a": ["<p>高<\/p>", "<p>低<\/p>", "<p>与联网前相同<\/p>", "<p>以上三种情况都可能出现<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/IMIk5Ibuit7HrEvGNrHU7SCFn3EuTvYnB0TSk8TS.png\"><\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35674", "t": 1, "q": "输电网电压等级通常为（     ）。", "a": ["<p>35kV及以上<\/p>", "<p>330kV及以上<\/p>", "<p>110kV及以上<\/p>", "<p>500kV及以上<\/p>", "", ""], "r": "C", "e": "【定位】第1章，第2节，知识点3：不同电压等级的适用范围\n【解析】电网按类型可分为输电网和配电网，其中输电网一般指电压等级在110kV及以上的网络，特点是电压等级高、输送距离远、输送容量大，故正确答案应选C。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35675", "t": 1, "q": "电能于其他形式能源相比，其特点不包括（     ）。", "a": ["<p>便于远距离输送<\/p>", "<p>易于控制<\/p>", "<p>可以大量存储<\/p>", "<p>便于大规模生产<\/p>", "", ""], "r": "C", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】电能具有便于远距离输送、控制调节简单、适合大规模集中生产的优点，但电能无法直接大量储存，需要借助蓄电池、抽水蓄能等装置间接储能，因此可大量存储不属于电能的特点，选C。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35676", "t": 1, "q": "直接将电能送到用户的网络称为（     ）。", "a": ["发电网", "输电网", "配电网", "以上均不正确", "", ""], "r": "C", "e": "【定位】第1章，第1节，知识点2：电力网及其分类\n【解析】电力网络分为电压等级高的输电网和低压的输电网，故直接将电能输送到用户的网络属于低压的配电网。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35677", "t": 1, "q": "以高压甚至超高压将发电厂、变电所或变电所之间连接起来的送电网络称为（     ）。", "a": ["发电网", "输电网", "配电网", "以上均不正确", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点2：电力网及其分类\n【解析】电力网络分为电压等级高的输电网和低压的输电网，故高压网络属于电压等级高的输电网。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35678", "t": 1, "q": "<p>关于各种电压等级在输配电网络中的应用，下述说法中错误的是（&nbsp; &nbsp; &nbsp;）。<\/p>", "a": ["<p>交流500kV通常用于区域电力系统的输电网络<\/p>", "<p>交流220kV通常用于地方电力系统的输电网络<\/p>", "<p>交流35kV及以下电压等级通常用于配电网络<\/p>", "<p>除10kV电压等级用于配电网络外，10kV以上的电压等级都只能用于输电网络<\/p>", "", ""], "r": "D", "e": "【定位】第1章，第2节，知识点3：不同电压等级的适用范围\n【解析】交流35kV及以下电压等级通常用于配电网络，D错误。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35679", "t": 1, "q": "下面不属于联合电力系统缺点的是（     ）。", "a": ["投资费用大", "易出现低频振荡", "增加短路容量", "系统稳定性不好", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点3：联合电力系统及其特点\n【解析】低频振荡、短路容量增大、稳定控制难度提升均为联合电力系统固有缺点；联网能够节约整体建设投资，投资费用大不属于其缺点，因此选A。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35680", "t": 1, "q": "下列用电负荷中属于一级负荷的是（     ）。", "a": ["电影院", "化工厂", "农用机械加工车间", "商务写字楼", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】化工厂停电会引发重大安全事故、危及人身安全，属于一级负荷，答案选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35681", "t": 1, "q": "电力系统中划分一级、二级和三级负荷的依据是（     ）。", "a": ["系统运行经济性", "电能质量高低", "负荷容量的大小", "负荷对供电可靠性的要求", "", ""], "r": "D", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】电力负荷按照停电产生后果的严重程度分为一、二、三级负荷，划分的根本标准是各类负荷对供电可靠性的需求。A选项系统运行经济性关乎电网运营成本，和负荷分级无关；B选项电能质量是电压、频率等供电指标要求，不作为分级依据；C选项负荷容量仅代表用电功率，大容量普通负荷也可为三级负荷，容量大小不能决定负荷等级。因此只有D选项负荷对供电可靠性的要求是负荷分级的依据。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35682", "t": 1, "q": "将发电机电压升高所用的变压器称为（     ）。", "a": ["升压变压器", "联络变压器", "降压变压器", "特种变压器", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】升压变压器的作用就是将发电机输出的低电压升高，便于远距离电能输送；联络变压器用于连接不同电压等级电网；降压变压器是把高压电能降为用户可用低压；特种变压器为整流、调压等特殊工况专用。因此提升发电机电压的变压器为升压变压器，选A。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35683", "t": 1, "q": "下面不属于电力网元件的是（     ）。", "a": ["发电机", "电缆线路", "变压器", "架空线路", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点2：电力网及其分类\n【解析】电力系统由发电机、电力网、用电负荷三部分组成，电力网包含变压器、架空线路、电缆线路等变换、输送电能的设备。发电机属于电源设备，不属于电力网元件，因此选A。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35684", "t": 1, "q": "电力系统不包含（     ）。", "a": ["<p>发电厂<\/p>", "<p>输电网络<\/p>", "<p>配电网络<\/p>", "<p>水轮机、汽轮机<\/p>", "", ""], "r": "D", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】水轮机、汽轮机属于动力部分，不属于电力系统。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35685", "t": 1, "q": "下面不属于联合电力系统特点的是（     ）。", "a": ["<p>供电可靠性高<\/p>", "<p>电能质量好<\/p>", "<p>满足同样负荷要求情况下装机容量大<\/p>", "<p>运行经济性好<\/p>", "", ""], "r": "C", "e": "<p>【定位】第1章，第1节，知识点3：联合电力系统及其特点 【解析】联合电力系统在满足同样负荷要求情况下装机容量小。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35686", "t": 1, "q": "电力系统中的输电、变电、（     ）三个部分称为电力网。", "a": ["发电", "配电", "用电", "输电", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点2：电力网及其分类\n【解析】电力系统由发电、输电、变电、配电、用电五大环节组成，其中电力网不包含发电和用电环节，仅由输电、变电、配电三部分构成，主要作用是实现电能的输送、变换与分配，所以本题应选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35687", "t": 1, "q": "下列不属于我国区域电网的是（     ）。", "a": ["<p>华东电网<\/p>", "<p>江西电网<\/p>", "<p>西北电网<\/p>", "<p>东北电网<\/p>", "", ""], "r": "B", "e": "<p>【定位】第1章，第1节，知识点2：电力网及其分类<\/p>\n<p>【解析】江西电网属于省级电网，不属于区域电网。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35688", "t": 1, "q": "电力网按电压等级的高低，供电范围大小分类不包括（     ）。", "a": ["超高压远距离输电网", "区域电网", "地方电网", "国家电网", "", ""], "r": "D", "e": "【定位】第1章，第1节，知识点2：电力网及其分类\n【解析】电力网（电网）按电压等级的高低，供电范围大小分类为：超高压远距离输电网、区域电网、地方电网。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35689", "t": 1, "q": "电力系统组成中，不存在不同能量形式转换的环节是（     ）。", "a": ["发电、用电", "输电、配电", "输电、用电", "变电、发电", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】发电环节是将水能、煤炭等其他形式能量转化为电能，用电环节是把电能转化为光能、热能、机械能等其他能量，二者均存在能量形式转换；输电、配电仅负责电能的输送与分配，只传输电能，不发生能量形式的转变；变电只是改变电压大小，依旧属于电能内部变换，无不同能量形式转换。因此输电、配电不存在不同能量形式转换，答案选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35690", "t": 1, "q": "变电所按在电力系统中地位分类不包括（     ）。", "a": ["枢纽变电所", "中间变电所", "地方变电所", "超高压变电所", "", ""], "r": "D", "e": "【定位】第4章，第1节，知识点2：变电站的分类\n【解析】变电所按在电力系统中地位分类包括枢纽变电所、中间变电所、地方变电所、终端变电所。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35691", "t": 1, "q": "以下属于火电发电厂的动力部分的是（     ）。", "a": ["核岛、反应堆", "水库、水轮机", "锅炉、汽轮机", "风力发电机、叶片系统", "", ""], "r": "C", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】ABD分别为核能发电、水力发电、风力发电的动力部分。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35692", "t": 1, "q": "下面属于二级负荷的是（     ）。", "a": ["省级政府机关大楼", "县级水库泵站", "县级农用机械铸造厂", "乡镇农家乐旅游区", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】A为一级负荷，CD为三级负荷。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35693", "t": 1, "q": "哪项不属于关于联合电力系统经济性较好的原因?（     ）", "a": ["便于采用技术性能较好的高效率大容量机组", "合理利用能源，减少一次能源消耗", "不同区域间互为备用容量，可以减少装机容量", "联合电力系统增加了远距离输电的功率，损耗增大", "", ""], "r": "D", "e": "【定位】第1章，第1节，知识点3：联合电力系统及其特点\n【解析】联合电力系统经济性好体现在可选用大容量高效机组、统筹各地能源降低能耗、区域互备削减总装机。D选项说明联网后远距离输电损耗变大，属于联网带来的经济弊端，不是经济性好的原因，因此选D。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35694", "t": 1, "q": "电力系统生产过程中，发电厂的作用是（     ）。", "a": ["将一次能源转化为电能", "将机械能转化为电能", "将电压大小进行变化", "将功率大小进行变化", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】发电厂依靠煤炭、水能、风能等一次能源，通过设备将其转化为电能，对应选项A。B选项只是发电中间过程，并非发电厂核心作用；C是变压器的功能；D不属于发电厂的作用，因此本题选A。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35695", "t": 1, "q": "电力系统生产过程中，用电设备的作用是（     ）。", "a": ["将一次能源转化为电能", "将机械能转化为电能", "将电压大小进行变化", "将电能转化为其他形式能量", "", ""], "r": "D", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】用电设备属于电能消耗端，作用是把电能转化为光能、热能、机械能等其他形式能量，对应D。A是发电厂的作用；B是发电机的能量转换过程；C是变压器的功能，因此选D。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35696", "t": 1, "q": "电力系统生产过程中，输电线路的作用是（     ）。", "a": ["将一次能源转化为电能", "对电能进行远距离输送", "对电能进行近距离分配", "对电能进行变换", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】输电线路主要承担远距离大容量输送电能的任务，对应选项B。A为发电厂的功能；C是配电线路的作用；D属于变压器的功能，因此本题选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35697", "t": 1, "q": "我国目前最高的交流电压等级为（     ）。", "a": ["500kV", "750kV", "1000kV", "800kV", "", ""], "r": "C", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】1000kV是我国目前交流最高电压。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35698", "t": 1, "q": "下面不属于配电网特点的是（     ）。", "a": ["输电距离近", "输送容量大", "电压等级低", "供电可靠性低", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点2：电力网及其分类\n【解析】配电网面向终端用户供电，具备输电距离近、电压等级偏低的特点，线路分支多，故障易影响用户，供电可靠性相对输电网更低。输送容量大是高压输电网的特征，并非配电网特点，因此选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35699", "t": 1, "q": "发电厂的主变压器大多数是（     ）。", "a": ["升压变压器", "降压变压器", "联络变压器", "仪用变压器", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】发电厂产生的电能供给地方负荷，厂用电负荷，多余电能通过升压变压器升高电压，通过高压输电网络送到用户端。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35700", "t": 1, "q": "以下属于电力网组成设备的是（     ）。", "a": ["发电机", "变压器", "电动机", "轧钢机", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点2：电力网及其分类\n【解析】电力网包括变压器、输配电线路组成。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35701", "t": 1, "q": "连接发电厂和电力用户的环节称为（     ）。", "a": ["电力系统", "电力网", "输电网", "配电网", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点2：电力网及其分类\n【解析】电力系统中连接发电厂和用户的中间环节称为电力网。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35702", "t": 1, "q": "关于输电线路，下列说法正确的是（     ）。", "a": ["输电线路电压高，输送功率小，输送距离远", "输电线路电压低，输送功率小，输送距离近", "输电线路电压高，输送功率大，输送距离近", "输电线路电压高，输送功率大，输送距离远", "", ""], "r": "D", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】采用高压、超高压远距离输电是各国普遍采用的途径。在传输容量相同的条件下，高电压输电能减少输电电流，从而减少电能损耗。送电距离愈远，要求输电线的电压愈高。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35703", "t": 1, "q": "下列不是输电线路额定电压是（     ）。", "a": ["<p>10kV<\/p>", "<p>110kV<\/p>", "<p>220kV<\/p>", "<p>500kV<\/p>", "", ""], "r": "A", "e": "<p>【定位】第1章，第2节，知识点2：电力系统额定电压的规定&nbsp;<\/p>\n<p>【解析】10kV、35kV、66kV通常用于配电网。220kV及以上通常用于输电网。110kV既可用于输电网也可用于负荷密度大的大城市的配电网。因此选A。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35850", "t": 1, "q": "<p>低压供电网络的电压是（ &nbsp; &nbsp; ）。<\/p>", "a": ["<p>3kV<\/p>", "<p>6kV<\/p>", "<p>10kV<\/p>", "<p>0.4kV　<\/p>", "", ""], "r": "D", "e": "<p>【定位】第1章，第2节，知识点3：不同电压等级的适用范围<br>【解析】电力系统中，0.4kV（三相380V、单相220V）属于低压供电电压，直接供给居民、各类民用及小型工商业终端用户使用；3kV、6kV、10kV均属于高压配电电压，用于变电站之间的电能输送分配，不属于低压供电网络，因此本题选D。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35851", "t": 1, "q": "任何情况下都不能停电的负荷是（     ）。", "a": ["第一类负荷", "第二类负荷", "第三类负荷", "以上均不正确", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】第一类负荷也叫一级负荷，属于重要负荷，一旦中断供电将会造成人身伤亡、重大设备损坏、重大政治或经济损失，因此任何情况下都不允许随意停电，必须设置两个及以上独立电源保证不间断供电，二类负荷允许短时停电，三类负荷可根据调度需要安排停电检修，所以本题选择A。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35852", "t": 1, "q": "中断供电后后果最严重的负荷是（     ）。", "a": ["第一类负荷", "第二类负荷", "第三类负荷", "以上均不正确", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】电力负荷按照停电造成后果的严重程度分为三级，一级（第一类）负荷一旦中断供电，会引发人身伤亡、重大设备损毁、爆炸火灾、巨额经济损失等最严重后果；二级负荷停电会造成较大经济损失、公共秩序混乱；三级负荷为普通用电负荷，短时停电影响较小。因此中断供电后后果最严重的是第一类负荷，本题选A。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35853", "t": 1, "q": "对供电可靠性要求最高的是（     ）。", "a": ["学校", "生活小区", "医院", "广场负荷", "", ""], "r": "C", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】医院中断供电可能造成人员死亡，所以对供电可靠性要求高。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35854", "t": 1, "q": "可以用单电源供电的电力负荷是（     ）。", "a": ["化工厂", "医院", "学校", "军事基地", "", ""], "r": "C", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】化工厂、医院、军事基地均属于一级负荷，中断供电会造成人身伤亡、重大安全事故等严重后果，需要采用双电源供电保障用电不间断；学校属于三级负荷，停电造成的影响较小，可采用单电源供电，因此本题选C。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35855", "t": 1, "q": "配电线路的电压等级是（     ）。", "a": ["10kV以下", "35kV以下", "110kV以下", "220kV以下", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】通常电力系统中35kV及以下电压等级属于配电网范畴，主要用于区域内电能分配、向终端用户供电；110kV及以上属于输电网，承担远距离大容量电能输送任务，因此配电线路电压等级为35kV以下，本题选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35856", "t": 1, "q": "不属于电能质量内容的是（     ）。", "a": ["电压的大小", "波形质量", "电流大小", "频率", "", ""], "r": "C", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】衡量电能质量指标有电压、频率、波形。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35857", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/ebAhsoiGI7ahgpNchPhZzmhYYuyWm1kSqRG85a9D.png\"><\/p>", "a": ["<p>110/35kV<\/p>", "<p>121/35kV<\/p>", "<p>121/38.5<\/p>", "<p>110/38.5<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/qxt2JrB13nC6qmslOSVawLUkbeHosBLWxl1XdlLT.png\"><\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35858", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/aGrLneuyq4fSgxU898yNE9fFSdBIueE9XYf5iXZM.png\"><\/p>", "a": ["<p>35/6kV<\/p>", "<p>38.5/6kV<\/p>", "<p>38.5/6.3<\/p>", "<p>35/6.3<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/vF7aDQuN7PizixOax7xWZn8mm8MGFIDrNx65s4fk.png\"><\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35859", "t": 1, "q": "以下频率不属于正常范围的是（     ）。", "a": ["49.8Hz", "50.1Hz", "50.02Hz", "48Hz", "", ""], "r": "D", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】我国电力系统额定工频为50Hz，正常运行时频率允许偏差范围一般为±0.2Hz，也就是正常频率区间在49.8Hz～50.2Hz之间，选项A的49.8Hz、B的50.1Hz、C的50.02Hz均处于该正常偏差范围内，而选项D的48Hz远低于频率下限49.8Hz，超出了电力系统频率正常允许偏差范围，因此不属于正常范围的是D选项。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35860", "t": 1, "q": "220kV降为110kV的降压变，两侧均与线路相连，则变比为（     ）。", "a": ["220/110", "242/110", "220/121", "242/121", "", ""], "r": "C", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】高压绕组额定电压等于线路额定电压220kV，低压绕组额定电压高于线路额定电压10%。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35714", "t": 2, "q": "<p>以下属于联合电力系统缺点的是（ &nbsp;&nbsp;&nbsp;&nbsp;）。<\/p>", "a": ["<p>系统短路容量增大&nbsp;<\/p>", "<p>不利于合理利用各类能源<\/p>", "<p>增大了系统装机容量，降低了设备利用率<\/p>", "<p>系统稳定性控制难度较大<\/p>", "", ""], "r": "AD", "e": "<p>【定位】第1章，第1节，知识点3：联合电力系统及其特点<\/p>\n<p>【解析】联合电力系统结构复杂，需要对联络线路的功率进行控制，运行难度大：输电线路长，系统运行稳定性问题突出，一旦系统并列运行稳定性被破坏，将导致系统解列，造成大面积停电的严重后果：电力系统短路电流大，给电气设备的诜择带来困难。联系电力系统有利于合理利用各类能源。可以减少系统装机容量，提高设备利用率。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35715", "t": 2, "q": "电力网组成包括（     ）。", "a": ["发电机", "变压器", "输电线路", "电力用户", "", ""], "r": "BC", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电力网是由变压器（包括升压变压器和降压变压器）和电力线路（包括输电线路和配电线路）组成的网络。选项BC属于电力网组成部分，选项AD属于电力系统组成部分，但不属于电力网组成部分。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35716", "t": 2, "q": "电力网按照所起作用分为（     ）。", "a": ["输电网", "配电网", "高压电网", "超高压电网", "", ""], "r": "AB", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电力网按照其作用的不同分为输电网和配电网。根据电压等级的不同分为低压、高压、超高压和特高压电力网。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35717", "t": 2, "q": "电力网按照电压等级分为（     ）。", "a": ["低压电网、高压电网", "区域电网和地方电网", "输电网和配电网", "超高压电网、特高压电网", "", ""], "r": "AD", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电力网根据电压等级的不同分为低压、高压、超高压和特高压电力网。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35718", "t": 2, "q": "联合电力系统的特点包括（     ）。", "a": ["供电可靠性高", "电能质量好", "运行经济性好", "满足同样负荷需求情况下所需装机容量少", "", ""], "r": "ABCD", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】联合电力系统的特点有：①提高供电可靠性；②提高电能质量；③减少装机容量，提高设备利用率；④便于采用技术性能好的大容量机组；⑤合理利用能源，提高系统运行经济性。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35719", "t": 2, "q": "下面属于输电线路特点的有（     ）。", "a": ["输送距离远", "输送容量大", "电压等级高", "建设投资大", "", ""], "r": "ABCD", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】输电线路的特点是输送距离远、输送容量大、电压等级高。由于电压等级高，电气设备和电力线路造价高，故建设投资大也是其特点。选项为ABCD。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35720", "t": 2, "q": "下面属于配电线路特点的有（     ）。", "a": ["输送距离近", "输送容量小", "电压等级低", "输送容量大", "", ""], "r": "ABC", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】配电线路特点是输送距离近、输送容量小、电压等级低。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35721", "t": 2, "q": "关于变压器下面描述正确有（     ）。", "a": ["<p>升高电压满足大容量远距离输电需要　<\/p>", "<p>降低电压满足用电需求<\/p>", "<p>发电厂主变压器为升压变压器<\/p>", "<p>用户配电变压器为降压变压器<\/p>", "", ""], "r": "ABCD", "e": "<p>【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用 【解析】变压器的作用是对电压进行变换，升高电压满足大容量远距离输电需要，降低电压满足用电需求。发电厂要将其发出的电能输送出去，需要升高电压以实现远距离、大容量输电，所以为升压变压器；用户配电变压器要将接受电能的电压降为用电设备需要的电压，为降压变压器。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35722", "t": 2, "q": "110kV架空输电线路适宜的输送容量和输送距离为（     ）。", "a": ["<p>（10~50）MW<\/p>", "<p>（100~500）MW<\/p>", "<p>（50~150）km<\/p>", "<p>（100~300）km<\/p>", "", ""], "r": "AC", "e": "【定位】第1章，第2节，知识点3：不同电压等级的适用范围\n【解析】110kV架空输电线路适宜的输送容量为10-50MW，输送距离为50-150km。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35723", "t": 2, "q": "电力系统负荷按重要性分类有（     ）。", "a": ["一级负荷", "二级负荷", "三级负荷", "四级负荷", "", ""], "r": "ABC", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】电力系统按重要性可分为：一级负荷、二级负荷、三级负荷。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35724", "t": 2, "q": "下面所列电力用户中属于一级负荷的有（     ）。", "a": ["钢铁厂", "大型医院", "居民小区", "景观照明", "", ""], "r": "AB", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】钢铁厂停电，钢水或铁水凝固会造成炼钢炉报废，导致生产秩序长期得不到恢复；大型医院停电会危及病人生命安全，都属于一级负荷。居民小区过去很长一段时间列为三级负荷，但随着社会发展，以人为本观念的形成，城镇居民生活用电已升级为二级负荷（尽量不停电）。景观照明停电损失很小甚至没有损失，属于三级负荷。正确选项为AB。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35725", "t": 2, "q": "衡量电力系统运行经济性的主要指标是（     ）。", "a": ["燃料消耗率", "厂用电率", "网损率", "建设投资", "", ""], "r": "ABC", "e": "【定位】第1章，第3节，知识点5：衡量电力系统运行经济性的技术指标\n【解析】电力系统运行经济性的三个主要指标：能源消耗率（比耗量），厂用电率和网损率。建设投资不属于运行问题。正确选项为ABC。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35726", "t": 2, "q": "对电力系统运行的要求有（     ）。", "a": ["<p>保证供电可靠性<\/p>", "<p>保证良好的电能质量<\/p>", "<p>为用户提供充足的电力<\/p>", "<p>提高电力系统运行经济性<\/p>", "", ""], "r": "ABCD", "e": "【定位】第1章，第3节，知识点2：电力系统运行的基本要求\n【解析】（1）保证安全可靠的供电（2）要有合乎要求的电能质量（3）要有良好的经济性\n（4）尽可能减小对生态环境的有害影响。根据以上电力系统运行的基本要求可知在保证安全可靠供电为用户提供充足电力和合格电能质量的基础上，其次再考虑运行的经济性和对环境的影响小，故正确答案应选ABCD。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35727", "t": 2, "q": "在新型电力系统中，下列属于电力系统的组成部分的是（     ）。", "a": ["<p>风力发电机<\/p>", "<p>变压器和线路<\/p>", "<p>光伏面板<\/p>", "<p>用电设备<\/p>", "", ""], "r": "ABCD", "e": "<p>【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用 【解析】发电机、变压器、电力线路及用电设备均是电力系统的组成部分，新型电力系统首先也是一个电力系统，因此也具备发、输、变、配、用五大环节。因此ABCD均属于新型电力系统的组成部分。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35728", "t": 2, "q": "下列属于发电厂动力部分的是（     ）。", "a": ["<p>核反应堆<\/p>", "<p>水力发电机<\/p>", "<p>汽轮机<\/p>", "<p>热电厂的锅炉<\/p>", "", ""], "r": "ACD", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】发电厂动力部分是指为发电机提供动力或机械能的部分。火电厂包括汽轮机和锅炉，核电厂包括核反应堆和锅炉，水电厂包括水库和水轮机。选项A：核反应堆是典型的核电厂的动力部分。选项C：汽轮机和选项D：热电厂的锅炉，是典型的火电厂的动力部分。选项B：水力发电机不属于动力部分，因此B不对。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35729", "t": 2, "q": "电力系统额定电压的特点包括（     ）。", "a": ["<p>额定电压均指线电压<\/p>", "<p>额定电压均指相电压<\/p>", "<p>相邻电压等级之比不宜过小，一般为2~3倍<\/p>", "<p>相邻电压等级之比不宜过大，一般在1.5倍左右<\/p>", "", ""], "r": "AC", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用。\n【解析】选项A：电力系统中额定电压统一以线电压标称，例如：220kV、110kV均为线电压值；三相设备铭牌标注的电压均为线电压。选项B：相电压为单相对中性点电压，仅在三相四线制系统中用于低压侧（如380V/220V），但额定电压仍以线电压为准。选项C：相邻电压等级比值过小（如1.5倍）会导致变电层次增加，设备成本上升；实例：110kV→220kV（2倍）、220kV→500kV（约2.27倍），符合实际工程规划。选项D：1.5倍比例过小，与常见高压等级序列（如220kV→500kV）不符，实际工程中更高比例（如2~3倍）更常见。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35730", "t": 2, "q": "以下不属于220kV架空输电线路相适应的输送功率和输送距离的是（     ）。", "a": ["<p>10~50MW，50~150km<\/p>", "<p>200~1000MW，200~600km<\/p>", "<p>100~500MW，100~300km<\/p>", "<p>800~2000MW，150~850km<\/p>", "", ""], "r": "ABD", "e": "【定位】第1章，第1节，知识点3：不同电压等级的适用范围。\n【解析】220kV架空输电线路相适应的输送功率是100~500MW，输送距离的是100~300公里。A选项相适应的输送功率和输送距离的是110kV电压等级。B选项相适应的输送功率和输送距离的是330kV电压等级。D选项相适应的输送功率和输送距离的是500kV电压等级。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35731", "t": 2, "q": "关于电力系统运行特点，下面说法正确的是（     ）。", "a": ["<p>电能不能大量存储<\/p>", "<p>过渡过程十分短暂<\/p>", "<p>电能生产与国民经济各部门和人民生产、生活有着密切关系<\/p>", "<p>电能生产、输送分配和消费可以不同时完成<\/p>", "", ""], "r": "ABC", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】电力系统的运行的特点\n（1）电能与国民经济各个部门之间的关系都很密切，供电的突然中断会带来严重的后果。\n（2）电能不能大量储存，电能的生产、输送、分配和消费实际上是同时进行的。\n（3）电力系统的变化迅速，电力系统从一种运行状态到另：一种运行状态的过渡极为迅速，即暂态过程非常短促。\n根据以上知识点可知，选项D描述错误（应具备同时性特点），故正确答案应选ABC。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35732", "t": 2, "q": "下列关于电力系统运行特点说法正确的是（     ）。", "a": ["电能不能大量存储", "过渡过程十分短暂", "电能生产与国民经济各部门和人民生产生活有着密切关系", "电力系统的地区性特点较强", "", ""], "r": "ABCD", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】电力系统运行具有四大主要特点。A选项，电能无法大规模直接储存，发电、输电、用电需要实时平衡；B选项，电力系统发生短路、机组投切等扰动时电磁暂态、机电暂态过程极短，故障发展迅速；C选项，电能广泛应用于各行各业与日常生活，供电中断会造成巨大影响；D选项，各地能源分布、负荷水平、电网结构差异较大，电力系统受地理位置、资源条件制约，地区性特征明显。四个选项描述均正确，因此答案选ABCD。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35733", "t": 2, "q": "对电力系统的要求有（     ）。", "a": ["保证供电可靠性", "保证良好的电能质量", "为用户提供充足的电力", "提高电力系统运行经济性", "", ""], "r": "ABCD", "e": "【定位】第1章，第3节，知识点2：电力系统运行的基本要求\n【解析】电力系统运行的四大基本要求分别为保证供电可靠性，避免大面积停电带来人身、经济与安全事故，保证良好的电能质量，将电压、频率、波形等参数控制在国家标准允许范围内，为用户持续提供充足可靠的电力以满足各类生产生活用电需求，同时合理调度机组、优化电网运行方式，降低网损与发电成本，提升电力系统整体运行的经济性，因此ABCD四个选项均正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35734", "t": 2, "q": "电能生产、输送、消费的特点有（     ）。", "a": ["电能与国民经济各个部门之间的关系都很密切", "生产、输送、消费电能各个环节所组成的统一整体不可分割", "电能生产、输送、消费工况的改变十分迅速", "电能不能大量储存", "", ""], "r": "ABCD", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】电力系统运行的四大基本要求包含四个方面：A供电可靠性要求不间断、安全稳定地向用户供电；B电能质量需要保障电压、频率、波形等指标在规定允许范围内；C要满足各类用户用电需求，保障电力电量充足；D在满足安全、可靠、合格供电的前提下，合理调度降低能耗与损耗，提升整体运行经济效益。四个选项均属于对电力系统的基本要求，因此答案选ABCD。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35735", "t": 2, "q": "电力系统运行的基本要求是（     ）。", "a": ["供电灵活性", "供电可靠性", "经济性", "减少对环境的影响", "", ""], "r": "BCD", "e": "【定位】第1章，第3节，知识点2：电力系统运行的基本要求\n【解析】可靠、优质、经济、环保是电力系统运行的“八字要求”。与供电灵活性无关。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35736", "t": 2, "q": "对电力系统的基本要求是（     ）。", "a": ["保证对用户的供电可靠性和电能质量", "提高电力系统运行的经济性", "减少对环境的不良影响", "电网建设越超前越好", "", ""], "r": "ABC", "e": "【定位】第1章，第3节，知识点2：电力系统运行的基本要求\n【解析】电力系统的基本要求主要包含供电可靠、电能质量合格、运行经济、环保低碳几个方面。A选项保证供电可靠性与合格的电能质量是电力系统最核心的基本要求；B选项通过优化调度、合理规划降低能耗与网损，提升系统运行经济性；C选项电力生产需要控制废气、废水等污染物排放，减少对环境的负面影响；D选项电网建设需要结合负荷发展合理规划适度超前，并非越超前越好，过度超前会造成资源闲置、投资浪费，该说法错误。因此本题选 ABC。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35737", "t": 2, "q": "以下哪一种不属于一级负荷？（     ）", "a": ["供电中断后造成大量减产", "供电中断后使工业生产中的主要设备遭到损坏", "供电中断后造成国民经济重大损失", "供电中断后使大量居民正常生活受到影响", "", ""], "r": "AD", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】AD的说法属于二级负荷。BC属于一级负荷。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35738", "t": 2, "q": "电能的哪些环节是同时进行的？（     ）", "a": ["电能生产", "电能变换", "大量储存", "输配电", "", ""], "r": "ABD", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】电能无法大规模直接储存，发电、变电变换、输电配电以及用电必须实时保持功率平衡，因此电能生产、电能变换、输配电三个环节需要同时进行。C选项电能不能大量储存，不属于同步开展的环节，所以本题选择ABD。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35739", "t": 2, "q": "根据用户对供电可靠性的要求，电能分配时对供电负荷进行分级管理，（     ）不属于一级负荷。", "a": ["医院手术室", "2022冬奥会场馆用电", "三线城市地铁", "乡镇重点高中", "", ""], "r": "CD", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】乡镇重点高中停电后不会造成人身伤亡和关键设备造成难以修复的损害等一级负荷的分类依据，三线城市地铁一般属于二级负荷。A和B是典型的一级负荷。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35740", "t": 2, "q": "关于下述电压等级描述错误的是（     ）。", "a": ["110kV只能作为输电网络", "10kV只能用于农网", "10kV通常采用中性点不接地的方式", "330kV通常采用中性点直接接地方式", "", ""], "r": "AB", "e": "【定位】第1章，第2节，知识点3：不同电压等级的适用范围\n【解析】10kV电压等级也用于城市配电网。在用户负荷比较大，用户集中的区域，110kV可以作为配电网。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35741", "t": 2, "q": "电力网分为（     ）。", "a": ["电力网", "输电网", "配电网", "用电网", "", ""], "r": "BC", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电力网按照功能可划分为输电网和配电网两大类。输电网一般由高压、超高压输电线路及变电站组成，主要负责远距离、大容量输送电能；配电网由中低压线路、配电变压器等构成，负责将电能分配输送到各个终端用户。电力网是总称，不存在独立的用电网分类，因此本题选BC。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35742", "t": 2, "q": "电力网的主要功能有（     ）。", "a": ["输送电能", "变换电压", "使用电能", "分配电能", "", ""], "r": "ABD", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电力网的功能是输送电能（输电线路）、变换电压（变压器）、分配电能（配电线路）。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35743", "t": 2, "q": "输电网络电压等级的发展主要受到（     ）因数的影响。", "a": ["<p>距离<\/p>", "<p>资金<\/p>", "<p>容量<\/p>", "<p>电力系统互联<\/p>", "", ""], "r": "ABCD", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】输电网络距离远，功率（容量）大，电压高（设备投资大），电网互联情况有关。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35744", "t": 2, "q": "关于输电线路，下列说法正确的是（     ）。", "a": ["送电距离愈近，要求输电线的电压愈高", "送电距离愈远，要求输电线的电压愈低", "送电距离愈远，要求输电线的电压愈高", "送电距离愈近，要求输电线的电压愈低", "", ""], "r": "CD", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】远距离输送电能时，为减少输电线路上的功率损耗和电压降落，需要采用高压输电；输电距离越远，所需输电电压等级越高；反之输电距离越近，选用的输电电压就可以越低。A选项距离近不需要高压输电，B选项远距离不能用低压输电，因此CD说法正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35745", "t": 2, "q": "以下属于超高压输电网络电压等级的是（     ）。", "a": ["<p>110kV<\/p>", "<p>500kV<\/p>", "<p>750kV<\/p>", "<p>35kV<\/p>", "", ""], "r": "BC", "e": "<p>【定位】第1章，第2节，知识点2：电力系统额定电压的规定&nbsp;<\/p>\n<p>【解析】在电力电压等级划分中，35kV属于高压配电电压，110kV属于高压输电电压；330kV-750kV属于超高压交流输电电压，因此本题选择BC。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35746", "t": 2, "q": "一台变压器的额定变比为242/10.5kV，它是（     ）。", "a": ["升压变", "降压变", "双绕组变压器", "三绕组变压器", "", ""], "r": "AC", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】高压绕组的电压比所连接220kV电压高10%，所以是升压变压器，又因为是两个电压等级，属于双绕组变压器。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35747", "t": 2, "q": "电能质量的指标有（     ）。", "a": ["电压", "电流", "频率", "波形", "", ""], "r": "ACD", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】电能质量指标有：电压、频率、波形。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35748", "t": 3, "q": "电力网完成电能生产、变换、传输过程。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电力网是由变压器和各种电压等级电力线路组成的用于电压变换、输送、分配的网络，电能生产由发电厂完成，发电厂不属于电力网。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35749", "t": 3, "q": "无功补偿装置不属于电力网组成部分。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电力网的组成部分包括：变压器和电力线路。无功补偿装置不属于电力网的组成部分。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35750", "t": 3, "q": "电力系统规模越大，给人们带来的技术经济效益越大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用 【解析】（1）电力系统规模越大，电力系统负荷曲线峰谷差越小，发电机的利用率越高，满足负荷需求情况下所需要的发电机装机容量越少；电力系统规模越大，由于地域与能源分布的差异，资源互补，避免了“弃风”、“弃光”、“弃水”，能源利用率提高。这些都会给人们带来更大的经济效益。（2）电力系统规模越大，各种能源互补，提高了供电可靠性；系统规模越大，系统频率波动、电压波动越小，提高了供电电能质量。即系统规模越大给人们带来的技术效益越大。说法正确。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35751", "t": 3, "q": "电力系统中发电机的作用是将一次能源转变为电能。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】发电厂由动力部分和发电机组成，动力部分将一次能源转变为机械能；发电机将动力部分输出的机械能转变为电能。发电厂的作用是将一次能源转变为电能。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35752", "t": 3, "q": "发电厂的作用是将一次能源转变为电能。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】发电厂由动力部分和发电机组成，动力部分将一次能源转变为机械能，发电机将动力部分输出的机械能转变为电能，所以发电厂的作用是将一次能源转变为电能。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35753", "t": 3, "q": "电动机是电力系统的重要组成部分，其作用是将电能转变为机械能。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电动机属于用电设备，其作用是将电能转变为机械能。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35754", "t": 3, "q": "用电设备类型多种多样，其共同点都是消费电能（将电能转变为所需要的能量形式）。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】用电设备的作用是把电能转换成适合用户需要的其他形式的能量。如：电动机将电能转变为机械能，白炽灯将电能转变为光能，电阻炉将电能转变为热能等。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35755", "t": 3, "q": "高压交流电力网的额定电压是指线电压有效值。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】在高压交流电力系统中，额定电压统一采用线电压的有效值来定义与标注，日常所说的10kV、35kV、110kV、220kV等各类高压电网额定电压均指三相系统的线电压有效值，相电压一般不用于电网额定电压的标称，因此题干表述正确，答案选A。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35756", "t": 3, "q": "发电机有直配线时，其额定电压取线路额定电压的1.05倍，无直配线时生产厂家可以根据发电容量大小自行确定发电机额定电压。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】发电机有直配线的情况下，其额定电压为线路额定电压的105%；在发电机无直接配电线路情况下，发电机的额定电压根据发电机运行和制造的经济性选择国家规定的用于发电机的额定电压。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35757", "t": 3, "q": "同一电压等级电力网中，所有电气设备的额定电压相同。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/SZZyUnAUrDUyg1OC6EecHRjqInSsn4VMpVWHR1jK.png\"><\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35758", "t": 3, "q": "电能的生产、变换、输送、分配和消费同时进行。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】传统电力系统电能不能大量储存，电能的生产、输送、分配和消费是同时进行的。随着新型储能技术的发展，新型电力系统将不再具有电能生产、输送、分配、和消费同时进行的特点。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35759", "t": 3, "q": "电力系统运行的连续性是由电能不能大量存储特点决定的。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】由于电能不能大量储存，电能的生产、输送、分配和消费实际上是同时进行的，也称为电力系统运行的连续性。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35760", "t": 3, "q": "一级负荷供电中断会给国民经济带来重大损失或造成人身伤亡事故。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】负荷根据供电中断或减少所造成后果的严重程度划分为一级、二级、三级负荷。一级负荷是指供电中断可能导致人员伤亡；主要生产设备损坏，导致生产秩序长期得不到恢复，给国民经济带来重大损失和可能导致社会秩序混乱和在国际上造成大的不良影响的电力用户的用电设备。说法正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35761", "t": 3, "q": "任何电压等级电力网的允许电压偏移都是额定电压的±5%。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】35kV及以上电压等级允许的偏移范围为电压偏移正负偏差绝对值之和不超过额定值的10%。10kV及以下电压等级三相供电的电力网允许的偏移范围为电压额定值的7%。220V单相供电电压允许偏差为电压额定值的+7％~－10%。不同电压等级电力网的允许电压偏移是不相同的。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35762", "t": 3, "q": "任何电力系统的频率偏移都不允许超过±0.5Hz。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/JE65KkJLaT3s904L6NC4iCwY7T81k1R68IK39130.png\"><\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35763", "t": 3, "q": "能源消耗率指生产1kWh电能所消耗的能源，通常用煤耗g/kWh表示。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点5：衡量电力系统运行经济性的技术指标\n【解析】能源消耗率指每生产1kWh电能所消耗的能源，通常用煤耗率g/kWh表示。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35764", "t": 3, "q": "电力系统中电气设备的额定电压必须与所安装处电力网的额定电压相同。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】电力系统电气设备包括发电机、变压器、用电设备等，它们额定电压的值不一定是电力网的额定电压。如发电机的额定电压一般比相连线路电压高5%，而变压器的一次侧和二次侧绕组各在不同情况下有不同的规定，故答案应选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35765", "t": 3, "q": "<p>根据我国《电力工业技术管理法规》规定，正常运行时电力系统的频率应保持在50Hz±0.2Hz的范围内。（&nbsp; &nbsp; &nbsp;）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】我国采用的额定频率为50Hz，正常运行时允许的偏移为±（0.2~0.5）Hz，±0.2Hz适用于大型电力系统，±0.5Hz适用于小型电力系统。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35766", "t": 3, "q": "<p>电力系统中发电、用电是电力系统中将电能转化为其他形式能量的环节。（&nbsp; &nbsp; &nbsp;）<\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】发电和用电设备涉及不同形式能量转换。发电是把其他形式能量转化为电能，用电是把电能转化为其他形式能量，所以错误。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35767", "t": 3, "q": "电能的生产、输送、分配和消费实际是同时进行的。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】电能难以大规模直接储存，发电机发出的电能必须即时通过输配电网络输送、分配给各类用电设备消耗，任一时刻系统的发电量、输送电量、分配电量和用电量需要保持实时平衡，因此电能的生产、输送、分配和消费是同时进行的，题干说法正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35768", "t": 3, "q": "保证供电可靠性就是在任何情况下都不间断对用户的供电。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点2：电力系统运行的基本要求\n【解析】第三级负荷可以停电，题干说法太绝对。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35769", "t": 3, "q": "二级负荷因停电后造成关键设备遭到难以修复的损坏，因此尽量不停电。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】造成关键设备遭到难以修复的损坏的是一级负荷。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35770", "t": 3, "q": "电能输送方便清洁，便于大容量储存，因此电力系统运行的规模越来越大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】电能虽然输送便捷、清洁环保，但电能并不能直接进行大容量储存，只能依靠储能设备间接储存，题目中“便于大容量储存”表述错误，因此该说法错误，答案选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35771", "t": 3, "q": "因为电能能够实现存储，因而电能生产不具有连续性。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】电能无法实现大规模直接存储，发出的电能必须实时被用户消耗，发电、输电、用电需要时刻保持功率平衡，所以电能生产必须连续进行，题干表述错误，答案选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35772", "t": 3, "q": "电力系统的过渡过程非常短暂。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点1：电力系统运行的特点\n【解析】电力系统在发生短路、设备投切、负荷突变等扰动时，会产生电磁暂态、机电暂态等过渡过程，这类过程往往仅持续毫秒级到秒级，发展速度快、持续时间十分短暂，若不能快速保护控制极易引发大面积停电事故，因此题干说法正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35773", "t": 3, "q": "有合乎要求的电能质量是保证负荷可靠供电的前提，因此电力系统首先要保证电能质量合格。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点2：电力系统运行的基本要求\n【解析】电力系统运行的首要任务是保证供电可靠性，只有持续不间断地向用户供电，才能在此基础上保障电压、频率等各项电能质量指标符合标准。合格的电能质量是可靠供电的重要保障，但并非首要前提，因此题干说法错误。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35774", "t": 3, "q": "引起市政生活的重要部门发生混乱的负荷是第二级负荷。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】“引起市政生活的重要部门发生混乱”是一级负荷。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35775", "t": 3, "q": "电力系统运行的基本要求首先保证经济性、其次是优质性。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点2：电力系统运行的基本要求\n【解析】对电力系统运行的首要要求是安全可靠、其实是优质，第三是经济，最后是环保。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35776", "t": 3, "q": "村镇农业机械加工车间负荷属于第二级负荷，尽量不停电。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】“村镇”、“农业机械加工车间”等字眼判断是三级负荷。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35777", "t": 3, "q": "炼钢厂、炼油厂等容易发生爆燃、爆炸的负荷属于第一级负荷。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】一级负荷是中断供电后会造成人身伤亡、重大设备损坏、引发爆炸火灾等严重安全事故或重大经济损失的负荷。炼钢厂、炼油厂一旦停电极易发生爆燃、爆炸等恶性安全事故，因此这类负荷属于一级负荷，题干说法正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35778", "t": 3, "q": "根据供电中断或减少所造成的后果严重程度，将负荷划分为三级。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】电力负荷按照供电中断后造成的人身安全、经济损失、社会影响等后果的严重程度，划分为一级负荷、二级负荷、三级负荷三个等级，不同等级负荷对应不同的供电保障要求，因此题干说法正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35779", "t": 3, "q": "电力系统运行的基本要求是可靠、优质、经济、环保。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点2：电力系统运行的基本要求\n【解析】电力系统运行有四项基本要求，可靠性指保障用户连续不间断供电；优质即保证电压、频率、波形等电能质量指标符合规范；经济性要求合理调度，降低发电成本与电网损耗；环保要求减少污染物排放，兼顾绿色低碳发展，因此题干表述正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35780", "t": 3, "q": "电能供电中断会造成国民经济重大损失，因而任何情况都不允许停电。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p>【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求<\/p>\n<p>【解析】电能与国民经济各部门联系密切，供电中断会造成国民经济重大损失。根据供电中断造成后果的严重程度，将负荷分为一级负荷，二级负荷和三级负荷。各类负荷对供电可靠性的要求是：一级负荷在任何情况下不允许停电。二级负荷尽量不停电。三级负荷根据系统运行需要可以停电。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35781", "t": 3, "q": "配电线路的额定电压一般为0.4kV-35kV。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】配电网主要负责将电能分配输送至各类终端用户，常规额定电压范围包含0.4kV低压配电以及10kV、35kV中高压配电；35kV以上电压等级多归属于输电网，用于远距离大容量电能输送，因此配电线路额定电压一般为0.4kV～35kV，题干说法正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35782", "t": 3, "q": "输电线路的特点是将能源基地电源功率大规模远距离输送至受端系统，输送距离远、输送容量大、电压等级高。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】输电线路通常采用高压、超高压电压等级，主要作用是把能源富集地区发电厂发出的大容量电能，长距离输送到用电集中的负荷区域，具备输送距离远、输电容量大、电压等级高的特点，因此题干描述正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35783", "t": 3, "q": "配电线路的特点是深入负荷中心，输送距离近、输送容量小、电压等级低。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】配电线路从变电站引出，延伸到城市、乡镇等各类用电负荷集中区域，直接面向终端用户供电，相比输电线路，具备输送距离较短、输送容量偏小、电压等级较低的特点，所以题干说法正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35784", "t": 3, "q": "电力网是由各种电压等级的输配电线路和变压器组成。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】电力网的核心组成部分包含不同电压等级的输电线路、配电线路以及各类升压、降压变压器，主要作用是实现电能的输送、变换与分配，发电厂和用电负荷不属于电力网范畴，因此题干描述正确。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35785", "t": 3, "q": "中断供电后造成后能导致人身安全事故的负荷是二级负荷。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】第一类负荷：对这一级负荷中断供电的后果是极为严重的。例如，可能发生危及人身安全的事故；使工业生产中的关键设备遭到难以修复的损坏，以致生产秩序长期不能恢复正常，造成国民经济的重大损失；使市政生活的重要部门发生混乱等。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35786", "t": 3, "q": "小城镇的电力负荷属于二级负荷。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点3：负荷分类及各类负荷对供电可靠性的要求\n【解析】停电影响不大的其他负荷都属于第三级负荷，如工厂的附属车间，小城镇和农村的公共负荷等。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35787", "t": 3, "q": "发电机的出口一定要接升压变压器。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】如果带有地方负荷的发电厂直接送点给负荷，不接升压变压器。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35788", "t": 3, "q": "发电厂的作用是将机械能转化为电能。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第1节，知识点1：电力系统组成及各元件的作用\n【解析】发电厂的作用是将一次能源（水力、核能、风能、光能等）转换为电能。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35789", "t": 3, "q": "网损率是电能质量指标之一。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点5：衡量电力系统运行经济性的技术指标\n【解析】电能质量指标主要包含电压偏差、电压波动与闪变、频率偏差、谐波、三相不平衡度等内容，网损率指的是电力网络中电能损耗占供电量的百分比，属于电网经济运行类的技术经济指标，用来衡量电网输电的经济性，并不属于电能质量指标，所以该说法错误，答案选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35790", "t": 3, "q": "衡量电能质量的技术指标是电压偏移、频率偏移、电压畸变率。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】根据电能质量的三要素（电压、频率、波形），衡量电能质量的技术指标为电压偏移、频率偏移、电压畸变率，故正确答案选A。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35791", "t": 3, "q": "同一电压等级中的同一电气设备额定电压一定不相同。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】同一电压等级下，同一类电气设备可以采用相同的额定电压，比如同一10kV电压等级下的多台配电变压器、高压断路器等电气设备额定电压均为10kV，所以同一电压等级中的同一电气设备额定电压可以相同，题干表述错误，答案选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35792", "t": 3, "q": "在并联运行的同一电力系统中，任一瞬间的电压在全系统都是统一的。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】同步稳定运行是指互联电力系统在任一瞬间，所有发电机的电角速度是同一的，故频率也是统一的，但是电力系统不同设备和位置的电压是不同的。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35793", "t": 3, "q": "电压偏移、电压损耗、电压波形畸变率、线损率都是衡量电能质量的技术指标。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】电能质量常用指标包含电压偏移、电压波形畸变率、频率偏差、三相不平衡度、电压波动与闪变等，电压损耗是输电线路中首末端的电压差值，属于电网电压计算参数，线损率是衡量电网运行经济性的经济技术指标，二者均不属于电能质量指标，因此题干说法错误，答案选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35794", "t": 3, "q": "同一电压等级电网中的电气设备额定电压必须完全相同。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第1章，第2节，知识点2：电力系统额定电压的规定\n【解析】同一电压等级电网内，受线路电压损耗影响，发电机额定电压通常比电网额定电压高5%，变压器一次侧额定电压可等同于电网额定电压，二次侧额定电压一般比电网额定电压高10%（线路较长时）或5%（近距离配电），各类电气设备额定电压并不完全一致，因此题干说法错误，答案选B。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35795", "t": 3, "q": "我国电力系统的额定频率为50Hz。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求\n【解析】我国电力系统统一规定的额定工频为50Hz，正常运行时频率允许存在小幅偏差，在规定的偏差范围内运行都属于合格工况，额定频率本身固定为50Hz，所以该表述正确，答案选A。", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}, {"id": "35796", "t": 3, "q": "35kV及以上电压等级允许的偏移范围为电压额定值的-5%-+5%。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p>【定位】第1章，第3节，知识点4：衡量电能质量的技术指标及要求&nbsp;<\/p>\n<p>【解析】根据我国电能质量相关标准规定，35kV及以上电压供电：电压正、负偏差绝对值之和不超过标称电压的10%。（例如+5%与-5％组合，或+8%与-2%组合等），因此题干表述不正确，答案选B。<\/p>", "l3": "电力系统基础", "l4": "第1章", "ap": [false, false, false, false, false, false]}]}, {"k": "电力系统基础||第2章", "n": "电力系统基础 / 第2章", "qs": [{"id": "33752", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/gxCUx79ZR2z9aMLg7ukqFZpeh1S2I6NyiU1f4F63.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/aJlNXoPhyGfdQCumnuCBUmV25UCtMd8VM0ShsTkH.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/lq5t4T0fDMRnNTxhygZLeOMXu8Yo6dUYLaUMypsK.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/ZWwuqqNBaKt0IV8p40FVaWX0wb9wggLAXKAa2Xfe.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/wnhOX1Y1jxJyF94UbrjmrDrHHCPXa17JfS5ci4En.png\"><\/p>", "", ""], "r": "A", "e": "【定位】第2章，第1节，知识点1：复功率的表达形式\n【解析】感性负荷的电流相角滞后电压相角，因此功率因数角大于零，所以吸收的无功功率大于零。负荷本身吸收有功功率，所以有功功率也大于零。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33753", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/y7pv80aIb58M6qqUXQCGKPAzFJgO6yIKPQ1V3PWl.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/2qRB2uWz0KeMFIuCYYJsgF8svjQwXgmfdXRBE0mx.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/XeHDyVbkfXfr6Su5qaZNtmx8dDP1dkeqWNsiSsDB.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/tx4up9BUM0otQG9GDfsgvIvkWn3FeNqaEMLbkRoK.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/9tkArH0zx4Q7GajbQXmR1c4kcpotfkdOzXT2T2LX.png\"><\/p>", "", ""], "r": "A", "e": "【定位】第2章，第1节，知识点1：复功率的表达形式\n【解析】发电机的正常运行方式为滞相运行，在发电机所采用的非关联参考方向下，电流滞后于机端电压，功率因数角为正值，发电机输出有功功率和感性无功功率。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33754", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/HXAJuX6X87XoHVYFFrFMmUW85rJkIuIDZ66hXrBg.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/gkMWvgMUL0toWhN4UxMoszMbDG7lmvl9J0nO3sXt.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/tVfETsT90znCpvkbtuIy9fxFQv4uljl3PtKaOddc.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/IGxynvKsGq8OuaezMEza3rSFJn2yU2J7L0VBRsOm.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/suuYs25vFJvHLxO7pbscstt3HQ2YDKVQVjwZteGm.png\"><\/p>", "", ""], "r": "B", "e": "【定位】第2章，第1节，知识点1：复功率的表达形式\n【解析】发电机进相运行时，在发电机所采用的非关联参考方向下，电流超前于机端电压，功率因数角为负值，发电机输出有功功率和吸收感性无功功率（输出感性无功率为负值）。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33755", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/1cEpGkyBRWAFHANE0sQUvjySPKXWk5K0b2WYngGn.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/YzxPsn0y6PnIiitvF87WcMcleg12LTK5RcOMU5n8.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/AFdNpcRMMVXnpvs9OpijVI4Q6uLdZUV82YJNDCob.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/rTexJRBFW93ILf0VHh1JxFS1R87NLoEQ95KUQ6Da.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/AvGe3CFTORvfxWyj7UOkSrGAS7Gm7nmBqG77gfG4.png\"><\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/ozTkOXh6kERkQWT4Cbbs8png6sMxgQDTL3eU9QPy.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33756", "t": 1, "q": "同步发电机励磁电流超过额定值的危害是（     ）。", "a": ["<p>励磁绕组过热<\/p>", "<p>定子绕组温度过热<\/p>", "<p>并列运行稳定性变差<\/p>", "<p>无功出力减少<\/p>", "", ""], "r": "A", "e": "【定位】第2章，第1节，知识点3：同步发电机的运行限制\n【解析】同步发电机励磁电流超过额定值是使励磁绕组发热，严重的情况下容易造成绝缘烧毁，而并不是定子绕组绕组发热温度升高。励磁电流增大会使得发电机的电势增加，励磁磁场增大会使发电机输出的无功增加，并列运行的稳定性能力增加，故综上可知答案应选A。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33757", "t": 1, "q": "当发电机运行在PQ极限图的第一象限时，其输出有功功率的最大值由（     ）决定。", "a": ["<p>定子额定电流<\/p>", "<p>额定励磁电流<\/p>", "<p>原动机最大输出功率<\/p>", "<p>并列运行稳定性<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/tfkIDDDHkwnmodrOJoGgBpR6TQVqnJCuJvqpKIum.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33758", "t": 1, "q": "当发电机运行在PQ极限图的第一象限时，其输出无功功率的最大值由（     ）决定。", "a": ["<p>定子额定电流<\/p>", "<p>额定励磁电流<\/p>", "<p>原动机最大输出功率<\/p>", "<p>并列运行稳定性<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/iciOT6cnJYMJhlDtiWZyVALO1r73JDYnJ76LUv5A.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33759", "t": 1, "q": "同步发电机“进相”运行时，输出功率为（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/rDDWb42duOgZATY6b0uXXHG1cuyrXm6DQDEHzOZ1.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/z5wpC6W5SLnsnBCNh9NibFTxcOVzWJjc5N8PILbd.png\" cvsDjeR4Gds0Kb8ttJrP6gScZbQX1W.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33769", "t": 1, "q": "三绕组降压变压器从外层到内层的绕组分布依次为（     ）。", "a": ["高、中、低", "高、低、中", "低、中、高", "低、高、中", "", ""], "r": "A", "e": "【定位】第2章，第2节，知识点3：三绕组变压器类型\n【解析】降压变压器绕组从外到内依次为：高、中、低，选A。B选项为升压变压器绕组排列方式，从外到内依次为：高、低、中。CD选项错误。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33770", "t": 1, "q": "三绕组升压变压器从外层到内层的绕组分布依次为（     ）。", "a": ["高、中、低", "高、低、中", "低、中、高", "低、高、中", "", ""], "r": "B", "e": "【定位】第2章，第2节，知识点3：三绕组变压器类型\n【解析】升压变压器绕组从外到内依次为：高、低、中，选B。A选项为降压变压器绕组排列方式，从外到内依次为：高、中、低。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33771", "t": 1, "q": "三绕组降压变压器的额定容量为100/100/50MVA，实际运行时下面可以存在的传输容量组合为（     ）。", "a": ["100   50    100", "100   50    50", "50    50    50", "100   100   50", "", ""], "r": "B", "e": "【定位】第2章，第2节，知识点3：三绕组变压器类型\n【解析】降压变压器，高压绕组功率往中压绕组和低压绕组输送，实时输送功率的关系应该为高压绕组功率等于中、低压绕组功率之和。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33772", "t": 1, "q": "在我国，66kV及以下架空输电线路绝缘子按承受（     ）选择。", "a": ["线电压", "相电压", "1.5相电压", "1.3相电压", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点2：绝缘子类型及应用\n【解析】在架空线路上绝缘子用于导线与地之间的绝缘。66kV及以下为小电流接地系统，单相接地故障时非故障相升高为线电压，因此绝缘子按承受线电压选择。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33773", "t": 1, "q": "在我国，110kV及以上架空输电线路绝缘子按承受（     ）选择。", "a": ["线电压", "相电压", "1.5相电压", "1.3线电压", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点2：绝缘子类型及应用\n【解析】在架空线路上绝缘子用于导线与地之间的绝缘。110kV及以上为大电流接地系统，单相接地故障时非故障相仍为相电压，因此绝缘子按承受相电压选择。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33774", "t": 1, "q": "35kV架空输电线路绝缘子串由3片绝缘子片串联组成，同型号的绝缘子用于220kV架空输电线路时绝缘子串中绝缘子片数应不少于（     ）。", "a": ["<p>18片<\/p>", "<p>17片<\/p>", "<p>16片<\/p>", "<p>13片<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/NxHiFdzS007294YpUBvBb23N0OLVcGuW1UMKlnFW.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33775", "t": 1, "q": "反映电力线路电流热效应的参数是（     ）。", "a": ["电阻", "电抗", "电导", "电纳", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】反映电力线路电流热效应的参数是电阻。选项A正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33776", "t": 1, "q": "反映电力线路电流磁场效应的参数是（     ）。", "a": ["电阻", "电抗", "电导", "电纳", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】反映电力线路电流磁场效应的参数是电抗。选项B正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33777", "t": 1, "q": "反映架空线路电晕损耗的参数是（     ）。", "a": ["电阻", "电抗", "电导", "电纳", "", ""], "r": "C", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】反映电力线路电晕损耗的参数是电导。选项C正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33778", "t": 1, "q": "反映电力线路电场效应的参数是（     ）。", "a": ["电阻", "电抗", "电导", "电纳", "", ""], "r": "D", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】反映电力线路电场效应的参数是电纳。选项D正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33779", "t": 1, "q": "下面架空输电线路参数中与导线布置方式无关的线路参数是（     ）。", "a": ["<p>电阻<\/p>", "<p>电抗<\/p>", "<p>电导<\/p>", "<p>电纳<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/CjBuSvwkCOaohr8XBKeqmPHUTRFNXh2n2byGMXpu.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33780", "t": 1, "q": "架空输电线路电抗与导线之间几何平均距离的关系为（     ）。", "a": ["<p>几何平均距离越大，电抗越大<\/p>", "<p>几何平均距离越大，电抗越小<\/p>", "<p>输电线路的电抗与几何平均距离无关<\/p>", "<p>改变导线之间的几何平均距离可以明显改变线路的电抗<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/h69cLU4PzPjseUMLn8j3mx5tBen6DPJrMznzECuD.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33781", "t": 1, "q": "架空输电线路电纳和导线之间几何平均距离的关系为（     ）。", "a": ["<p>几何平均距离越大，电纳越大<\/p>", "<p>几何平均距离越大，电纳越小<\/p>", "<p>输电线路的电纳与几何平均距离无关<\/p>", "<p>改变导线之间的几何平均距离可以明显改变线路的电抗<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/BjMcHpcj2lrBeyp18Mc5RVjGB0OjMgWuNB61Nah4.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33782", "t": 1, "q": "35kV架空输电线路导线截面增大时，关于线路参数变化，下面错误的是（     ）。", "a": ["<p>电阻减小<\/p>", "<p>电抗减小<\/p>", "<p>电纳增大<\/p>", "<p>电导减小<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/boZXAaz2DvXFNDnIvxpVkj8Ju81NuWjoD8rDKzXc.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33783", "t": 1, "q": "输电线路参数中属于耗能参数的是（     ）。", "a": ["电抗、电阻", "电纳、电阻", "电导、电抗", "电阻、电导", "", ""], "r": "D", "e": "【定位】第2章，第3节，知识点3：单回架空输电线路的参数及其计算\n【解析】电阻和电导消耗有功功率，属于耗能参数；电抗消耗感性无功功率，电纳消耗容性无功功率，均为蓄能参数。正确选项为D。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33784", "t": 1, "q": "电力系统的综合供电负荷加上厂用电负荷，称为（     ）。", "a": ["发电负荷", "供电负荷", "用电负荷", "工业负荷", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点1：电力系统的负荷\n【解析】电力系统的发电负荷等于电力系统的供电负荷和发电厂厂用电功率之和。电力系统的供电负荷等于系统综合负荷和网络中损耗的功率之和；电力系统用电负荷是指电力系统中用电设备所消耗的功率的总和；工业负荷是指各种工业生产设备和工厂所需的功率之和。正确选项为A。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33785", "t": 1, "q": "电力系统最大有功负荷与系统用户最大负荷之和的关系是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/Bm4tm029r6WrgcMCEeHQkygYhnauz3N6cC8d0LAr.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/i9rAmezWygT1V8AjEk0XWlaIYrt6I6nSyxJsQDdv.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/Ve1KI6SaJpZr8fMMqHrSOazuodxDILpjxxILEhP0.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/Bzlf6L4Cj7f38s7zyZ3tvCtCxVlbmUOxd7dUpjXs.png\"><\/p>", "", ""], "r": "D", "e": "【定位】第2章，第4节，知识点3：电力系统常用的负荷曲线\n【解析】由于电力系统各用户最大负荷出现的时间不相同，所以总负荷曲线的最大负荷小于系统各用户最大负荷之和。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33786", "t": 1, "q": "电力系统有功最小负荷与用户有功最小负荷之和的关系是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/rygNa8pjCcqMVbINHYC0Rmw4Kh9ymfQiGwu3xIwi.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/eOs8Gr5qU9rP50cZAZgzYJWHom1VUESpA7ThL1HX.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/6asnG8SNqUueWAhKPf80FVuzaW0C2HWmWNtfv7Rh.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/crK3lCmbtBN5QrF5SA08ePuq3HzgUp2DeYcZmKjX.png\"><\/p>", "", ""], "r": "B", "e": "【定位】第2章，第4节，知识点3：电力系统常用的负荷曲线\n【解析】由于电力系统各用户最小负荷出现的时间不相同，所以总负荷曲线的最小负荷大于系统各用户最小负荷之和。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33787", "t": 1, "q": "电力系统规模增大时，其峰谷差（峰谷比）（     ）。", "a": ["增大", "减小", "不变", "可能增大也可能减小", "", ""], "r": "B", "e": "【定位】第2章，第4节，知识点4：关于电力系统负荷的几个基本概念\n【解析】峰谷差反映了负荷的波动情况。电力系统规模越大，电力系统内部各部分最大负荷出现的时刻越离散，合并后的总的负荷曲线越平坦，峰谷差越小。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33788", "t": 1, "q": "电力系统规模增大时，系统中发电机的利用率（     ）。", "a": ["提高", "降低", "不变", "可能升高也可能降低", "", ""], "r": "A", "e": "【定位】第2章，第4节，知识点4：关于电力系统负荷的几个基本概念\n【解析】电力系统规模增大，负荷曲线越平坦，峰谷差越小，发电机的利用率越高。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33789", "t": 1, "q": "在多电压等级电力系统的有名制等值电路中，变压器用“π”形等值电路表示时，所有参数和变量都要归算到基本级，关于基本级的选择下面正确的是（     ）。", "a": ["必须选择最高电压等级作为基本级", "通常选择选择最高电压等级作为基本级", "通常选择选择最低电压等级作为基本级", "必须选择最低电压等级作为基本级", "", ""], "r": "B", "e": "【定位】第2章，第5节，知识点2：有名制等值电路\n【解析】基本级选择原则：（1）根据计算的方便性选择；（2）没有明确要求的情况下，通常选择最高电压等级作为基本级。正确选项为B。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33790", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/ja8PhoKFfjtkZebPfekd5HvF6cxrt5BJVOZlPHui.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/mTyXWQliBKpQFQs0dpoAz8McvTSWicH6UAd5uAYb.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/dg3a3vKXmPTSMxcIXkoN1AYisRlq96YMJ6BcBGPH.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/W8RHbZhWhvsya7Z4ju1o46B2pTbjnWmqleSAPnAp.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/g9ndmyC3Y4H3UvAz6HW0o0aYcgQCKDm7rjFvTvHr.png\"><\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/J65vLJxCgt4Wl1Iphx9aMrMGd9yKYQfIDIXP8oWh.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33791", "t": 1, "q": "下面所列电压中，完全属于各级电网平均额定电压的一组是（     ）。", "a": ["10.5kV、36.75kV、115.5kV、231kV、525kV", "10.5kV、37kV、115kV、230kV、525kV", "10.5kV、38.5kV、121kV、242kV、550kV", "10kV、35kV、110kV、220kV、500kV", "", ""], "r": "B", "e": "【定位】第2章，第5节，知识点4：平均额定电压\n【解析】近似计算时，该电压等级各元件的最高额定电压和最低额定电压的平均值，称为“平均额定电压”。10kV电压等级平均额定电压为10.5kV；35kV电压等级的平均额定电压为37kV；110kV电压等级的平均额定电压为115kV；220kV的平均额定电压为230kV；500kV电压等级平均额定电压为525kV。选项B正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33792", "t": 1, "q": "关于连接220kV和110kV两个电压等级的降压变压器，下面错误的是（     ）。", "a": ["额定变比为220/121", "采用+5%分接头时的实际变比为231/115.5", "采用+5%分接头时的实际变比为231/121", "平均额定变比为230/115", "", ""], "r": "B", "e": "【定位】第2章，第5节，知识点6：变压器的额定变比、实际变比、平均额定变比、标准变比与非标准变比\n【解析】（1）连接220kV和110kV两个电压等级的降压变压器其额定变比为220/121，选项A正确；（2）变压器只在高压绕组设置有分接头，采用+5%分接头时的实际变比为231/121 ，选项C正确、选项B错误；（3）平均额定变比为230/115，选项C正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33793", "t": 1, "q": "连接220kV和110kV两个电压等级的降压变压器，额定变比时110kV线路电阻归算到220kV为50欧姆，当变压器采用+5%分接头时，110kV线路电阻归算到220kV的数值为（     ）欧姆。", "a": ["<p>55.125<\/p>", "<p>52.5<\/p>", "<p>45.351<\/p>", "<p>47.619<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/j05wjGT2zJ2cpiWuaMNs2ymQeApKJMp9iH3e3Qxv.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33794", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/wUpCrktfNXfoUdK3IRXouqDzQicgB01HVXixCd2S.png\"><\/p>", "a": ["<p>220kV<\/p>", "<p>242kV<\/p>", "<p>110kV<\/p>", "<p>121kV<\/p>", "", ""], "r": "D", "e": "【定位】第2章，第2节，知识点2：双绕组变压器的参数计算\n【解析】变压器参数计算公式中，额定电压取哪一侧的额定电压，则计算出来的参数即为归算到哪一侧的参数。连接220kV和110kV两个电压等级的降压变压器低压绕组的额定电压为121kV。选项D正确。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33795", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/mMAzaeB2SlmZPHaeOd90xp04tDRUji9EnHL44Okr.png\"><\/p>", "a": ["<p>kV、kVA<\/p>", "<p>kV、MVA 　<\/p>", "<p>V、kVA<\/p>", "<p>kV、VA<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/D1BOIj4Db5Tnu40T698U5WzgZT6WG1VrUgslZvRm.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33796", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/H1JCYsW5B1V08cNmFlAjaqlLbfgm38nLCz9DS4y6.png\"><\/p>", "a": ["<p>kVA<\/p>", "<p>MVA<\/p>", "<p>VA<\/p>", "<p>MVA或VA<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/JY7knvPL4t9DgMNfp0vfPQ5kEFVV9kxN52oEuDB1.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33797", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/2XqMSEI87IeJy2cEZZwEuHhZjfMfvdDZI8i6Uz13.png\"><\/p>", "a": ["<p>kV、kVA<\/p>", "<p>kV、MVA<\/p>", "<p>V、kVA<\/p>", "<p>V、VA<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/U5bhI2AX3f98pmsRSdoIzu1ExlQClRwn6XBtxJyU.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33798", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/2S9OhDpidxedpO0lDD5yP4LgcBVKsrmdqRHYoctg.png\"><\/p>", "a": ["<p>kV、W<\/p>", "<p>kV、kW<\/p>", "<p>kV、MW<\/p>", "<p>V、kW<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/9r7aPQlKpWRSePtocpTBzBYekALEWx06PYBHaznt.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33799", "t": 1, "q": "求三绕组变压器变压器数学模型参数时需要作（     ）次空载试验。", "a": ["<p>1<\/p>", "<p>2<\/p>", "<p>3<\/p>", "<p>4<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/yBmDMrD2h4U2Edjxmi0oqdAevhzwbw8btURdB3iv.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33800", "t": 1, "q": "求三绕组变压器数学模型参数时需要作（     ）次短路试验。", "a": ["<p>1<\/p>", "<p>2<\/p>", "<p>3<\/p>", "<p>4<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/oXpBavYtXRP6FOh4YzkaQRUzBxDSP2QXgTqhglrh.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33801", "t": 1, "q": "<p>对于容量比为1：1：0.5 的三绕组变压器，如果高压绕组的实际电阻为5欧，中压绕组和低压绕组归算到高压侧的电阻为（ ）。<\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260725/F0k4qafkxmglWVBDvoWKraK7HhLtYVznAOs7mFCX.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/29c9u0hrr4gjqhuoRC2pcEqov5Q4RYRwn5mQnQe6.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/MSfbIzNjqVVRtiPU6uyvwJ79u1GkAJwhWJNpgnUI.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/J0RLcM0fYApWrP63XiTJUb8wZ7nTGmFx6bnj9zUp.png\"><\/p>", "", ""], "r": "A", "e": "【定位】第2章，第2节，知识点4：三绕组变压器的等值电路及参数计算\n【解析】中压绕组和高压绕组都是全容量绕组，所以归算到高压侧的电阻均为5欧。低压绕组是半容量绕组，归算到高压侧的电阻是全容量绕组的2倍。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33802", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/hBzMg65PiWVY7pgOeAMub8ho3E9NLSHmhbS04GUo.png\"><\/p>", "a": ["<p>10<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/jsIbGz8VePEqBRsh2tQ6skrW2tRwxetpybsatfoE.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/e1pdp3dDGJ4HxDOz3gjV6EVrNk0y3ZtHNtlxRbI6.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/rXkedZOuV1PFerx1Kdp5rNzmWqavjGdeOpnhQGls.png\"><\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/3geQOanUBz8FFkcbtRro0xn4mZdQEqvk0mkFaJn5.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33803", "t": 1, "q": "按照《架空输电线路设计规范》的规定，当线路长度小于（     ）km时，可以不进行换位。", "a": ["50", "100", "150", "200", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点4：架空线路的换位\n【解析】线路长度超过100km的架空输电线路应进行全换位。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33804", "t": 1, "q": "导线总截面不变的情况下，分裂导线线路的电抗比单导线线路电抗（     ）。", "a": ["大", "小", "相等", "不确定", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点5：分裂导线输电线路\n【解析】架空线路采用分裂导线等值增大导线的计算半径，减小线路电抗。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33805", "t": 1, "q": "导线总截面不变的情况下，分裂导线线路的电纳比单导线线路电纳（     ）。", "a": ["大", "小", "相等", "不确定", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点5：分裂导线输电线路\n【解析】架空线路采用分裂导线等值增大导线的计算半径，增大了线路电纳。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33806", "t": 1, "q": "分裂导线架空输电线路子导线之间距离增大时，关于其参数变化，下面错误的是（     ）。", "a": ["<p>电抗变小<\/p>", "<p>电纳变大<\/p>", "<p>电晕损耗变小<\/p>", "<p>电阻变大<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260725/QRonG11Wn5JhBK8A4Tp0nAE07S8ehQSEgEwrigu7.png\"><\/p>", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33807", "t": 1, "q": "长度不超过100km的架空输电线路属于（     ）。", "a": ["短线路", "中等长度线路", "长线路", "超长线路", "", ""], "r": "A", "e": "【定位】第2章，第3节，知识点7：输电线路的等值电路\n【解析】短线路通常指长度100km以下的架空线路和电压等级不超过10kV的电缆线路。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33808", "t": 1, "q": "长度在100km~300km之间的架空输电线路和长度不超过100km的电缆线路属于（     ）。", "a": ["短线路", "中等长度线路", "长线路", "超长线路", "", ""], "r": "B", "e": "【定位】第2章，第3节，知识点7：输电线路的等值电路\n【解析】中等长度线路指长度在100km~300km的架空线路和长度不超过100km的电缆线路。", "l3": "电力系统基础", "l4": "第2章", "ap": [false, false, false, false, false, false]}, {"id": "33809", "t": 1, "q": "长度超过300km的架空输电线路和长度超过100km的电缆线路属于（     ）。", "a": ["短线路
