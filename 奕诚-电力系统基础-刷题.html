路未传输感性无功功率。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34465", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/6fFQTzXCQi06prWAot05Zd2gpbmKodwTyqSR8Jg6.png\"><\/p>", "a": ["<p>高于<\/p>", "<p>低于<\/p>", "<p>等于<\/p>", "<p>以上三种情况都可能出现<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/Zkccq2D11Or0SEcEcmAEWMcNSVRaYaL2LXbzeXPF.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34466", "t": 1, "q": "关于电力线路输送纯无功功率时首端电压和末端电压的相位关系，下面错误的是（     ）。", "a": ["<p>不计电阻时总有首端电压与末端电压同相位<\/p>", "<p>计及电阻影响时感性无功情况下首端电压滞后于末端电压<\/p>", "<p>计及电阻影响时容性无功情况下首端电压超前于末端电压<\/p>", "<p>不管是否计及电阻影响总有首端电压与末端电压同相位<\/p>", "", ""], "r": "D", "e": "【定位】第3章，第1节，知识点8：高压电网功率传输规律\n【解析】有功功率从电压相位超前的点流向电压相位滞后的点。因此不计电阻时总有首端电压与末端电压同相位。计及电阻影响时感性无功情况下首端电压滞后于末端电压。计及电阻影响时容性无功情况下首端电压超前于末端电压。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34467", "t": 1, "q": "同一个电压等级下，导体材料、截面相同的输电线路和电缆线路，空载时关于线路末端电压的描述正确的是（     ）。", "a": ["<p>电缆线路末端电压更高<\/p>", "<p>架空线路末端电压更高<\/p>", "<p>电压相同<\/p>", "<p>不能确定<\/p>", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析；第2章，第3节，知识点6：电缆线路参数。\n【解析】空载时线路末端电压高于始端，并且相同条件下，电缆的电抗小于架空线路，电纳却比架空线路大得多，因此电缆的末端电压要更高，所以选择选项A，选项B、C、D都不对。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34468", "t": 1, "q": "变压器的额定变比为110/10.5kV，额定容量为50MVA，短路损耗为160kW，空载损耗为50kW，短路电压百分值为10，空载电流百分值为1，则该变压器在额定电压下励磁支路上的功率损耗为（     ）MVA。", "a": ["<p>0.16+j5<\/p>", "<p>0.16+j0.05<\/p>", "<p>0.05+j0.5<\/p>", "<p>0.05+j0.05<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/tg9SLSsFWmCwj0SUdbPFElsApLw6C4BhA3JWVr0w.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34469", "t": 1, "q": "关于电力网元件的无功功率损耗，下面叙述错误的是（     ）。", "a": ["<p>任何运行方式下输电线路都要产生感性无功损耗<\/p>", "<p>任何运行方式下电力变压器都要产生感性无功损耗<\/p>", "<p>变压器的无功损耗远远大于有功损耗<\/p>", "<p>输电线路既可能消耗感性无功功率，也可能输出感性无功功率<\/p>", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点7：具有普遍意义的结论\n【解析】具有普遍意义的结论1.如只要求计算电压的数值，略去电压降落的横分量不会产生很大误差；2.变压器中电压降落的纵分量主要取决于变压器电抗；3.变压器中无功功率损耗远大于有功功率损耗；4.线路负荷较轻时，线路电纳中吸收的容性无功功率大于电抗中消耗的感性无功功率的现象并不罕见。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34470", "t": 1, "q": "关于变压器的功率损耗，下面叙述正确的是（     ）。", "a": ["<p>阻抗支路的无功损耗和有功损耗与变压器负载率的平方成正比<\/p>", "<p>阻抗支路的无功损耗和有功损耗与变压器负载率成正比<\/p>", "<p>导纳支路的有功损耗和无功损耗与变压器负载率平方成正比<\/p>", "<p>导纳支路的有功损耗和无功损耗与变压器负载率成正比<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/8iKpVUn8A5XU6jTb0dFnEMWSPQ8IQFVdlMxQXkHQ.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34471", "t": 1, "q": "高压电网中电压降落纵分量大小主要取决于运行参量（     ）。", "a": ["<p>P<\/p>", "<p>Q<\/p>", "<p>R<\/p>", "<p>X<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/PrGCYX77ycPblS9jautwbAD8HDeU51CuuvvuyuQX.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34472", "t": 1, "q": "不计线路的导纳及电阻，当线路带阻容性负载时，线路始末两端电压大小和相位关系为（     ）。", "a": ["<p>首端电压高于末端电压，始端电压的相位超前末端电压的相位<\/p>", "<p>首端电压低于末端电压，始端电压的相位超前末端电压的相位<\/p>", "<p>首端电压高于末端电压，始端电压的相位滞后末端电压的相位<\/p>", "<p>首端电压低于末端电压，始端电压的相位滞后末端电压的相位<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/aOf55AVWpckuSqRoiDiIJaslNCRNgJI3hqPu2h77.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34473", "t": 1, "q": "有一个双电源系统，已知M侧母线电压和 N侧母线电压相位相同，M侧母线电压大于N侧母线电压，不计线路电阻和导纳支路时，则下面选项中正确的是（     ）。", "a": ["<p>线路中有功功率从M侧输向N侧<\/p>", "<p>线路中有功功率从N侧输向M侧<\/p>", "<p>线路中无功功率(感性)从M侧输向N侧<\/p>", "<p>线路中无功功率(感性)从N侧输向M侧<\/p>", "", ""], "r": "C", "e": "<p>【定位】第3章，第1节，知识点8：高压电网功率传输规律 【解析】在双电源系统中，电压相位相同则有功功率与相位差相关，此处无相位差故无有功传输。而无功功率由电压幅值差决定，M侧电压高于N侧，感性无功从高电压侧（M侧）流向低电压侧（N侧），故答案选C。<\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34474", "t": 1, "q": "阻抗为R+jX的线路，流过无功功率时，（     ）。", "a": ["<p>不会产生无功损耗<\/p>", "<p>不会产生有功损耗<\/p>", "<p>不会产生有功损耗，也不会产生无功损耗<\/p>", "<p>会产生有功损耗<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/UnULi5u6nFilSOnl0iPOUXYb7iYLwvBYkIaB6PU2.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34475", "t": 1, "q": "变压器运行中（     ）无功功率。", "a": ["发出", "消耗", "不发出、不消耗", "无法确定", "", ""], "r": "B", "e": "【定位】第3章，第1节，知识点6：变压器运行状况计算和分析\n【解析】变压器中电抗远大于电阻，所以在运行中消耗无功功率。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34476", "t": 1, "q": "330kV空载架空输电线路，首末端电压大小关系为（     ）。", "a": ["<p>首端电压大于末端电压<\/p>", "<p>首端电压小于末端电压<\/p>", "<p>首端电压等于于末端电压<\/p>", "<p>根据实际情况确定<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/FzeONAwqr0mg2gA18U7SrKWb1GbcoXP8tY2PnXtX.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34477", "t": 1, "q": "变压器的有功功率损耗分为铜损和铁损，其中铜损和铁损分别与哪些电气量相关？（     ）", "a": ["电流、电压", "电流、电流", "电压、电流", "电压、电压", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点6：变压器运行状况计算和分析\n【解析】变压器铜损是电流流过绕组在绕组电阻上产生的损耗，随着电流的变化而变化，称为可变损耗。铁损是变压器铁芯在电压作用下产生的损耗，称之不变损耗。选A。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34478", "t": 1, "q": "电力变压器传送纯无功功率时，下面正确的是（     ）。", "a": ["仅有有功损耗", "仅有无功损耗", "既有有功损耗，又有无功损耗", "既无有功损耗，也无无功损耗", "", ""], "r": "C", "e": "【定位】第3章，第1节，知识点6：变压器运行状况计算和分析\n【解析】变压器电阻上产生有功损耗，电抗上产生无功损耗。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34479", "t": 1, "q": "变压器在（     ）时，效率最高。", "a": ["<p>铜损等于铁损<\/p>", "<p>铜损大于铁损<\/p>", "<p>铜损小于铁损<\/p>", "<p>额定负载运行<\/p>", "", ""], "r": "A", "e": "<p>【定位】第3章，第1节，知识点6：变压器运行状况计算和分析&nbsp;<\/p>\n<p>【解析】变压器效率不是固定值，会随负载变化，‌最高效率发生在可变损耗（铜损）等于固定损耗（铁损）时‌。此时总损耗最小，输出功率与输入功率的比值最大。故答案选A。<\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34480", "t": 1, "q": "线路首、末端电压的数值差是（     ）。", "a": ["电压降落", "电压调整", "电压损耗", "电压偏移", "", ""], "r": "C", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析\n【解析】电压损耗指的是输电线路首端电压与末端电压之间的数值差值，只关注电压大小的差值；电压降落是线路首末端电压的相量差，既有幅值差也包含相位差；电压调整是通过调压措施改变电压大小的操作过程；电压偏移是实际运行电压与额定电压之间的差值，并非线路首末端的电压差值，因此本题选择C。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34481", "t": 1, "q": "高压输电线路的电阻往往小于电抗，改变电压的大小，主要改变网络中（     ）的分布。", "a": ["无功功率", "有功功率", "视在功率", "总功率", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点7：具有普遍意义的结论\n【解析】有功功率的传输与电压的相位有关，有功功率由电压相位高的一侧流向相位低的一侧；无功功率的传输与电压的大小有关，无功功率由电压数值大的一侧流向小的一侧。根据分析可知，改变电压的大小，主要是为了改变与电压大小相关的无功功率的分布，故正确答案应选A。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34482", "t": 1, "q": "110kV输电线路，首端电压为121kV，末端电压为113kV，末端的电压偏移为（     ）。", "a": ["<p>10%<\/p>", "<p>5%<\/p>", "<p>2.7%<\/p>", "<p>4.5%<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/kYdruJU1SUsp6Fq1WSofrrWP489f6hX2bP2YOUty.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34483", "t": 1, "q": "输电线路电压降落是指（     ）。", "a": ["输电线路始端电压与末端电压的相量差", "输电线路始端电压与末端电压的数值差", "输电线路始端电压与额定电压的数值差", "输电线路始端电压与末端电压的数值差", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析\n【解析】电压降落属于相量概念，指输电线路始端电压与末端电压的相量差值，既包含电压幅值的差值，也包含电压相位的差值，线路始端电压与末端电压的数值差是电压损耗，线路始端电压与额定电压的数值差属于电压偏移，因此只有 A 选项表述正确，本题选择A。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34484", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/rANgvrAAE2k5163HJg6XFIorWSnetv8j2JjjwU8E.png\"><\/p>", "a": ["<p>110kW<\/p>", "<p>160kW<\/p>", "<p>190kW<\/p>", "<p>70kW<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/V9RwC5uwmO5ZTIhq0NKpGP6LJMUH3KdCjeg2xb3B.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34485", "t": 1, "q": "高压输电线路中流过的无功功率主要影响线路两侧的（     ）。", "a": ["电压相位", "电压大小", "有功损耗", "横分量", "", ""], "r": "B", "e": "【定位】第3章，第1节，知识点7：具有普遍意义的结论\n【解析】在高压输电线路中，无功功率主要影响电压降落的纵分量，而纵分量主要决定线路两端电压的幅值大小，有功功率主要影响电压的相位，有功损耗由线路中流过的总电流决定，并非无功功率主要影响电压相位或者横分量，所以无功功率主要影响线路两侧的电压大小，本题选择B。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34486", "t": 1, "q": "减少输电线路有功损耗可以通过（     ）。", "a": ["<p>增大线路有功功率<\/p>", "<p>增大线路无功功率<\/p>", "<p>提高线路两端电压<\/p>", "<p>增大导线截面<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/GiIIWg6vs0WJnk1wdDQGqQmLt1fEQwr4YiQmV6aP.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34487", "t": 1, "q": "电网运行中，电压损耗主要和（     ）有关。", "a": ["<p>P<\/p>", "<p>Q<\/p>", "<p>U<\/p>", "<p>Z<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/x1WHCD8VcULiCCsEA8lJTZyGPtHdIV9BfIX7yPQO.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34488", "t": 1, "q": "关于输电线路的无功功率，下面叙述正确的是（     ）。", "a": ["<p>任何运行方式下，都要消耗感性无功功率<\/p>", "<p>可能消耗感性无功功率，也可能发出感性无功功率<\/p>", "<p>带容性负荷时一定发出感性无功功率<\/p>", "<p>带感性负荷时一定消耗感性无功功率<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/OWsx7geP8pX38oa2D60P8R0smuBNDMaIANosV0rR.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34489", "t": 1, "q": "在同一时间内，电力网的电能损耗与供电量之比的百分值称为（     ）。", "a": ["负载率", "网损率", "供电率", "厂用电率", "", ""], "r": "B", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析\n【解析】电能损耗与供电量之比的百分值为网损率。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34490", "t": 1, "q": "110kV输电线路首端功率37MW，末端功率为35MW，则线路功率损耗为（     ）。", "a": ["37MW", "35MW", "2MW", "-2MW", "", ""], "r": "C", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】输电线路首末端功的差即为输电线路的功率损耗，即为37MW-35MW=2MW。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34547", "t": 1, "q": "110kV输电线路首端功率37MW，末端功率为35MW，则线路输电效率为（     ）。", "a": ["<p>95.7%<\/p>", "<p>100%<\/p>", "<p>94.6%<\/p>", "<p>98.7%<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/BxRtgWJX77poOzLgTXODWy53LrpTmxKwLD1V46To.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34548", "t": 1, "q": "由于输电线路的充电功率作用，使输电线路末端电压高于始端电压，其电压升高幅度与输电线路长度之间的关系为（     ）。", "a": ["<p>线性关系<\/p>", "<p>平方关系<\/p>", "<p>三次方关系<\/p>", "<p>无法确定<\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/f6E6JkyNjH4DjctJZHhnDgkceRZlyWKT0KMCWP9x.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34549", "t": 1, "q": "无功功率通过线路电阻时，（     ），造成电能损耗，降低了线路运行的经济性。", "a": ["产生有功功率损耗", "产生无功功率损耗", "既产生有功功率损耗，也产生无功功率损耗", "无法确定", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】当无功功率通过输电线路的电阻元件时，线路中会流过包含无功分量的负荷电流，电流流经电阻必然会产生I²R形式的有功功率损耗，也就是电能损耗，电阻只消耗有功功率，不会产生无功功率损耗，无功功率损耗一般是由线路的电感、电容这类储能元件产生的，因此本题选择A。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34550", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/3vkhMibtk0O4S8rEVHJjwSzEKqvnLlhrzSSpcRI2.png\"><\/p>", "a": ["<p>9000kWH<\/p>", "<p>95000kWH<\/p>", "<p>94500kWH<\/p>", "<p>95500kWH<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/lNXql6PWahgYKTQW81NgTex385a17CCuNx6AdvNG.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34551", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/SynjgsY9xe32ouhf9eGm1DE6VO9otxHlC7p3NanW.png\"><\/p>", "a": ["<p>8.75kW、7kW<\/p>", "<p>7kW、8.75kW<\/p>", "<p>7kW、35kW<\/p>", "<p>35kW、7kW<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/26i91UEnxfEs1nzQ11uc9kTV5RRqFF8F81U14m92.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34552", "t": 1, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/pd8B0bmZlCAyOJiG1vo2B9lcApMrE1c4DkldC5ia.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260727/iyNXu6cNVFtGG0FGQdH3wXQhA8zl0jxd6wksPGDK.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/y8IXvFygOiXSK8HUQwxKScW6COaUXmQfOCCjcsax.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/GAXMGvzeasJ3alWkcnu0X1GNPcT1fy3fBLqINpWB.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/GPBU9QfmwCkw6dC2kBuKpQtKs1UAqc48eeDw8rKf.png\"><\/p>", "", ""], "r": "C", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】辐射型网络，已知末端电压和末端功率时，利用末端电压和末端功率从末端开始利用阻抗支路和导纳支路的功率和电压计算公式逐段向前计算，直到求到首端电压和首端功率。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34553", "t": 1, "q": "电力变压器导纳支路的年电能损耗，可以用（     ）来计算。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260727/JnqyNeLQHRjZHkVeyzWapQNMqeV90KR9mmKNqKSS.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/cJQ5vpYhiDp9tm2qJk2Znwg5qRqr48egBbcg3fgI.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/SqSrHWvnXlOt7kFDXQyLpz6VvmxpOqAI0PlkPd8F.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/00gpb03FriiLxoW8Mq26sZVCRNu8FHnf0LzUke5s.png\"><\/p>", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点6：变压器运行状况计算和分析\n【解析】变压器导纳支路的损耗与变压器承受的运行电压相关，电网额定电压情况下，导纳支路损耗约等于空载损耗，乘以运行时间即为电能损耗。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34554", "t": 1, "q": "高压电力系统中，有功功率损耗（     ）无功功率损耗。", "a": ["小于", "大于", "等于", "远大于", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点7：具有普遍意义的结论\n【解析】高压电力系统中输电线路的电阻数值较小，而电抗数值较大，有功功率损耗由线路电阻产生，无功功率损耗主要由线路电抗产生，所以有功功率损耗小于无功功率损耗，因此本题选择A。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34555", "t": 1, "q": "电力线路电压降落为（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260727/9HWd5oD9c0xfW7dRcrL7UN6loYBIvcYYIwoZnyuI.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/9WUJ2mFkBbQvaxybhEQPo65dWdbFiznrSl9iEDpa.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/r02sgy7TWsHOtE7n1lE1IZNfI1CWycyMNaJvHV9t.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/0R8QdEe7sIwksTn75kTw3B2zuSuRkTfhlXIP2NEM.png\"><\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/z7n2PapVWoIHHCr8BOaIuShMCNHdea6KhLnw2CDz.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34499", "t": 2, "q": "关于变压器阻抗的功率损耗，下面描述正确的有（     ）。", "a": ["<p>为变动损耗<\/p>", "<p>与负载率平方成正比<\/p>", "<p>与负载率成正比<\/p>", "<p>与输送功率的性质无关<\/p>", "", ""], "r": "ABD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/M6EOj3dRJI1XAtcIX4zkfS8HNtkXCpobxO3uW4gj.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34500", "t": 2, "q": "下列说法正确有（     ）。", "a": ["<p>任何运行方式下输电线路都要产生感性无功损耗<\/p>", "<p>任何运行方式下变压器都要产生感性无功损耗<\/p>", "<p>一般情况下，电力系统的无功损耗远大于有功损耗<\/p>", "<p>一般情况下，电力系统的有功损耗远大于无功损耗<\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/jWDJ4z1VtjVvrw6VH6o2ivROTpoeuAUsAd5vjCME.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34501", "t": 2, "q": "关于潮流计算的无功功率，下列说法正确的是（     ）。", "a": ["<p>线路对地导纳支路消耗容性无功<\/p>", "<p>线路对地导纳支路消耗感性无功<\/p>", "<p>变压器对地导纳支路发出容性无功<\/p>", "<p>变压器对地导纳支路发出感性无功<\/p>", "", ""], "r": "AC", "e": "【定位】第3章，第1节，知识点2：电力系统等值电路的结构；知识点5：输电线路的计算与分析；知识点6：变压器运行状况计算和分析。\n【解析】线路对地导纳支路是容性的，所以消耗容性无功即发出感性无功；变压器对地导纳支路是感性的，所以消耗感性无功即发出容性无功。选项AC正确。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34502", "t": 2, "q": "下列哪种手段可以抑制空载长线路的容升效应？（     ）", "a": ["<p>线路末端并联电抗<\/p>", "<p>线路串联电抗<\/p>", "<p>线路末端并联电容<\/p>", "<p>线路串联电容<\/p>", "", ""], "r": "AD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/20yrkOdwikc1Kjy1CL4aOD48Vd5pOzouOneh4ipa.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34503", "t": 2, "q": "关于高压电力网的有功分点和无功分点，下列说法正确的是（     ）。", "a": ["<p>有功分点的电压幅值最低<\/p>", "<p>有功分点的电压相位最滞后<\/p>", "<p>无功分点的电压幅值最低<\/p>", "<p>无功分点的电压相位最滞后<\/p>", "", ""], "r": "BC", "e": "【定位】第3章，第1节，知识点8：高压电网功率传输规律\n【解析】根据功率传输的规律，有功功率由电压相位超前的点向电压相位滞后的点流，无功功率由电压幅值高的点向电压幅值低的点流，所以有功分点是电压相位最滞后的点，无功分点是电压幅值最低的点。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34504", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/eQCNQR8M8OeoAwPwWGlZ4blSYnHWrfperHOCZOqH.png\"><\/p>", "a": ["<p>无功从首端流向末端<\/p>", "<p>无功从末端流向首端<\/p>", "<p>有功从首端流向末端<\/p>", "<p>有功从末端流向首端<\/p>", "", ""], "r": "AC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/wsP6rJcNMGVzfZNreluNGrudkzvHEF5tAiXTjaHg.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34505", "t": 2, "q": "下面描述正确的是（     ）。", "a": ["<p>变压器电压降落纵分量主要取决于所传输的有功功率大小<\/p>", "<p>变压器电压降落纵分量主要取决于所传输的无功功率大小<\/p>", "<p>变压器无功损耗远大于有功损耗<\/p>", "<p>变压器有功损耗远大于无功损耗<\/p>", "", ""], "r": "BC", "e": "【定位】第3章，第1节，知识点7：具有普遍意义的结论\n【解析】1.如只要求计算电压的数值，略去电压降落的横分量不会产生很大误差；2.变压器中电压降落的纵分量主要取决于变压器电抗；3.变压器中无功功率损耗远大于有功功率损耗；4.线路负荷较轻时，线路电纳中吸收的容性无功功率大于电抗中消耗的感性无功功率的现象并不罕见。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34506", "t": 2, "q": "关于电力网和电力网元件的功率损耗，下面正确的是（     ）。", "a": ["<p>输电线路的（感性）无功损耗一定大于零<\/p>", "<p>变压器的（感性）无功损耗一定大于零<\/p>", "<p>一般情况下，电力网的（感性）无功损耗大于有功损耗<\/p>", "<p>一般情况下，电力网的（感性）无功损耗小于有功损耗<\/p>", "", ""], "r": "BC", "e": "【定位】第3章，第1节，知识点7：具有普遍意义的结论\n【解析】1.如只要求计算电压的数值，略去电压降落的横分量不会产生很大误差；2.变压器中电压降落的纵分量主要取决于变压器电抗；3.变压器中无功功率损耗远大于有功功率损耗；4.线路负荷较轻时，线路电纳中吸收的容性无功功率大于电抗中消耗的感性无功功率的现象并不罕见。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34507", "t": 2, "q": "中性点不接地系统中，每相对地电容电流和（     ）有关。", "a": ["<p>负荷<\/p>", "<p>线路电压<\/p>", "<p>系统频率<\/p>", "<p>输电线路长度<\/p>", "", ""], "r": "BCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/zkVK1AZmxDe8M8HUyl8s3qOU3AmmdgrnDqowbDC7.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34508", "t": 2, "q": "电力网中可变损耗包括（     ）。", "a": ["<p>变压器的电阻损耗<\/p>", "<p>输电线路的电阻损耗<\/p>", "<p>变压器的空载损耗<\/p>", "<p>发电机的电阻损耗<\/p>", "", ""], "r": "AB", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析\n【解析】电力网包括线路和变压器，可变损耗指的是线路和变压器的串联部分损耗，也就是和电流相关参数。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34509", "t": 2, "q": "在电力系统的潮流计算中，通常需要考虑的因素有（     ）。", "a": ["<p>发电机的输出功率<\/p>", "<p>输电线路的阻抗<\/p>", "<p>负荷的功率需求<\/p>", "<p>变压器的变比和损耗<\/p>", "", ""], "r": "ABCD", "e": "【定位】第3章，第1节，知识点1：电力系统潮流分布与潮流计算\n【解析】潮流计算是电力系统分析中的一个重要环节，它需要考虑发电机的输出功率、输电线路的阻抗、负荷的功率需求以及变压器的变比和损耗等因素。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34510", "t": 2, "q": "电力系统的潮流分布是指（     ）。", "a": ["功率分布", "电压分布", "电流分布", "阻抗分布", "", ""], "r": "AB", "e": "【定位】第3章，第1节，知识点1：电力系统潮流分布与潮流计算\n【解析】电力系统潮流分布是指正常稳态运行情况下电力系统的功率分布和电压分布。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34511", "t": 2, "q": "电力系统的等值电路由（     ）组成。", "a": ["阻抗支路", "电抗支路", "导纳支路", "电纳支路", "", ""], "r": "AC", "e": "【定位】第3章，第1节，知识点2：电力系统等值电路的结构\n【解析】输电线路、变压器等电力元件的等值电路主要包含阻抗支路与导纳支路，阻抗支路由电阻和电抗串联构成，用来表征元件的有功、无功功率损耗，导纳支路由电导和电纳并联构成，用来表征线路的电晕、泄漏损耗以及电容无功充电功率，电抗支路、电纳支路只是阻抗、导纳中的单一参数，不能代表完整的等值电路组成，所以本题选择AC。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34512", "t": 2, "q": "采用无功补偿装置能够降低网络损耗的原因是（     ）。", "a": ["能够发出有功功率，减小负荷从电网吸收的有功功率", "能够提高网络电压，从而减小网络传输有功电流，减小有功损耗", "就地产生无功功率，减小负荷从电网吸收的无功功率，降低无功流通引起的电能损耗", "就地产生无功功率，减小电网的无功电流，降低电流在网络电阻上的电能损耗", "", ""], "r": "CD", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】考察无功补偿装置降低网络损耗的原因，无功补偿装置不能产生有功功率，也不能减小有功电流。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34513", "t": 2, "q": "变压器铁损和铜损分别与（     ）和（     ）电气量密切相关。", "a": ["功率", "电压", "电流", "不确定", "", ""], "r": "BC", "e": "【定位】第3章，第1节，知识点6：变压器运行状况计算和分析\n【解析】铁损与电压密切相关，铜损与电流密切相关。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34514", "t": 2, "q": "变压器的损耗分为（     ）和（     ）两类。", "a": ["可变损耗", "持续损耗", "不变损耗", "不确定", "", ""], "r": "AC", "e": "【定位】第3章，第1节，知识点6：变压器运行状况计算和分析\n【解析】根据变压器损耗随时间变化情况，分为可变损耗和不变损耗。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34515", "t": 2, "q": "电力网络中，消耗电能的元件是（     ）。", "a": ["<p>电阻<\/p>", "<p>电抗<\/p>", "<p>电导<\/p>", "<p>电纳<\/p>", "", ""], "r": "AC", "e": "<p>【定位】第3章，第1节，知识点3：阻抗支路的计算，知识点4：导纳支路的计算 【解析】电阻中有电流通过时会产生有功功率损耗，属于消耗电能的元件，电导主要对应线路电晕、绝缘子泄漏带来的有功电能损耗，同样消耗电能，电抗和电纳只进行无功功率的储存与交换，不消耗有功电能，因此消耗电能的元件为电阻和电导，本题选AC。<\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34516", "t": 2, "q": "为了减少线路损耗和提高输送容量，可以采用的方式有（     ）。", "a": ["特高压交流输电", "特高压直流输电", "增加输电线路回路数", "灵活交流输电", "", ""], "r": "ABCD", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】采用特高压交流输电与特高压直流输电能够通过提升输电电压等级，在输送相同功率时大幅降低线路电流，从而有效减少线路电阻产生的有功损耗，同时显著提升电能输送容量，增加输电线路回路数可以降低单回线路的输送负荷、减小线路工作电流，既降低线路损耗又能提升整体输电能力，灵活交流输电技术可优化线路潮流分布、充分挖掘现有线路的输电潜力，改善系统运行方式，在降低网损的同时提高线路输送容量，因此ABCD四个选项均符合题意。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34517", "t": 2, "q": "下列属于降低电力网运行中电能损耗的措施的是（     ）。", "a": ["降低负荷的功率因数", "合理确定电网运行的电压水平", "改变电网的运行方式", "增大电力元件的电阻", "", ""], "r": "BC", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】合理确定电网运行电压水平，在允许范围内适当提高运行电压可以减小线路电流，从而降低有功功率损耗，改变电网运行方式能够优化潮流分布，让负荷均匀分配，避免部分线路重载带来过多损耗，降低负荷功率因数会增大无功电流，使线路电流上升、电能损耗增加，增大电力元件电阻会直接加大功率损耗，因此AD错误，BC为降低电网电能损耗的有效措施。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34518", "t": 2, "q": "电力系统潮流分析计算一般采用（     ）。", "a": ["<p>简单系统采用人工手算法+欧姆法<\/p>", "<p>简单系统采用人工手算法+标幺值法<\/p>", "<p>复杂系统采用计算机法+欧姆法<\/p>", "<p>复杂系统采用计算机法+标幺值法<\/p>", "", ""], "r": "BD", "e": "【定位】第3章，第1节，知识点1：电力系统潮流分布与潮流计算\n【解析】我国电力系统潮流计算一般采用标幺值法；简单电力系统潮流计算可以采用人工手算，也可以采用计算机计算；复杂电力系统的潮流计算采用计算机计算。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34519", "t": 2, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/vqLlAnKvAYxqyU9NJ7rS3KSdTs3hjmO0qxktWRiH.png\"><\/p>", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260727/NSxiyvLUleUW4LujtZ3u67qjMgkOamr581nnrDwu.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/p4nlmBX99uGN346m2rsHNKqhNCVq6iqvDjP0Fpth.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/RfObIvoI8r0BSDM1K6BtWHYH6zED3d63FVMcgKrV.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/TTZewstVWsWEGK7sFaDtNQQWwD7Mw94QKjKKjlID.png\"><\/p>", "", ""], "r": "BC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/2FonlvvUPsCF04xGemd098E6zwCSpqEvUGEs4XJr.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34520", "t": 2, "q": "输电线路等值电路中消耗有功功率的是（     ）。", "a": ["电抗", "电阻", "电纳", "电导", "", ""], "r": "BD", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析\n【解析】输电线路电压高，一般采用架空输电线路，架空输电线路的参数有电阻、电抗、电导和电纳，消耗电能的是电阻和电导。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34521", "t": 3, "q": "不管电力网络简单还是复杂，其等值电路都只包含阻抗和导纳两种支路。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点2：电力系统等值电路的结构\n【解析】电力系统等值电路由阻抗支路和导纳支路组成。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34522", "t": 3, "q": "计算阻抗支路的功率损耗和电压降落时必须使用同一点的电压和复功率。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】功率损耗和电压降落公式中功率和电压为同一点的数值。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34523", "t": 3, "q": "使用首端和末端物理量计算电压降落，两种情况下所求得的电压降落纵、横分量不相等，但电压降落模值相等。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/I032nGTRbusMCZ387qsgp0lEio4ei9AohkRcFhyf.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34524", "t": 3, "q": "导纳支路的功率损耗与其电压的平方成正比。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/emb7MQDT04jdr8Kfjgg1zenyrlrczsoY5pfPFDuA.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34525", "t": 3, "q": "变压器导纳支路的无功损耗为正值，线路导纳支路的无功损耗为负值。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点4：导纳支路的计算\n【解析】变压器导纳支路为感性元件，消耗的无功功率为正值。线路导纳支路为容性，消耗的无功功率为负值。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34526", "t": 3, "q": "电压降落是指线路首、末两端电压的数值之差。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析\n【解析】电压降落指线路始末两端电压的相量差。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34527", "t": 3, "q": "输电线路运行时总会产生有功损耗。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/jUZwqsbZYe4izGL6jXE0SgNbePJCLpS9eIIg1P32.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34528", "t": 3, "q": "变压器运行中总会产生有功损耗。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/YC1SFmWOIZlHigmhTo7LaYAup1bh0Jh5UCe5k3rA.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34529", "t": 3, "q": "不计电阻情况下，无功功率传输方向为从电压高的点流向电压低的点。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点8：高压电网功率传输规律\n【解析】无功功率从电压高的点流向电压低的点。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34530", "t": 3, "q": "不计电阻情况下，有功功率传输方向为从电压相位超前的点流向电压相位滞后的点。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点8：高压电网功率传输规律\n【解析】有功功率从电压相位超前的点流向电压相位滞后的点。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34531", "t": 3, "q": "阻抗支路的电压损耗既与传输功率大小有关，也与传输功率的性质有关。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】由电压损耗计算公式可知，功率的性质（容性感性）影响了Q的正负（感性无功为正），进而影响电压损耗。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34532", "t": 3, "q": "无功功率的产生基本上不消耗能源，当网络传输无功功率时不会产生有功功率的损耗和电压损耗。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算。\n【解析】当无功功率流过阻性元件时，将产生有功损耗，无功功率流经电感时，将产生电压损耗，故选B。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34533", "t": 3, "q": "短路容量越大，系统阻抗也越大。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/XQDcksImhCbuRE3K7qBGG22c0l7eWsq7cLEdaqEW.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34534", "t": 3, "q": "空载长线路充电时，末端电压会升高。这是由于对地电容电流在线路电抗上产生了电压降。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析 \n【解析】空载长线路运行时，线路末端未接负载，电流主要是对地电容电流（因线路导线与大地间存在分布电容，电压作用下会产生容性电流）。线路存在自感电抗（导线自身电感产生的电抗），对地电容电流流经自感电抗时：容性电流的相位超前于电压（容性负载特性）；该电流在自感电抗上产生的电压降，其相位与电流、电抗的特性相关，最终效果是使线路末端电压高于首端电压。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34535", "t": 3, "q": "复杂网络的潮流计算既可以用人工手算，也可以用计算机算法。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章，第1节，知识点1：电力系统潮流分布与潮流计算\n【解析】复杂网络节点数目多，用手算法耗时多，一般用计算机算法。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34536", "t": 3, "q": "电网中的损耗分为可变损耗和不变损耗。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点5：输电线路的计算与分析，知识点6：变压器运行状况计算和分析\n【解析】损耗分为不变损耗和可变损耗，可变损耗与电流有关，不变损耗与电压有关。选A。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34537", "t": 3, "q": "电力网的损耗电量是发电、输电、变电、配电各环节损耗的电量，简称网损。供电量是指在给定时间内，系统中所有发电厂的总发电量同厂用电量之差。网损率是指同一时间内，电力网损耗电量占供电量的百分比。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p>【定位】第3章，第1节，知识点5：输电线路的计算与分析&nbsp;<\/p>\n<p>【解析】电力网的损耗是输（送）电、变电、配电各环节损耗的电量。电力网的范畴不包含发电部分。选B。<\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34538", "t": 3, "q": "变压器即使在空载运行情况下，也存在有功功率和无功功率损耗。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点6：变压器运行状况计算和分析\n【解析】变压器空载运行时，存在与电压平方成正比的有功功率损耗和无功功率损耗，该部分损耗在电压为额定值附近几乎不变，称为不变损耗。选A。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34539", "t": 3, "q": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/sk0N9v4rSrNXhIc4fRc5mYRRBIeZlgAvCMIwvxxe.png\"><\/p>", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/mqdh7i4sfSXpeQimAoHHhf3v2BEKJHMQYwtzcsEh.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34540", "t": 3, "q": "我国电网对网损率要求一般在8%-12%。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第3章，第1节，知识点3：阻抗支路的计算 【解析】我国电网对网损率要求在8%-12%，具体数值要视不同地区、系统运行情况而定。电网不同、电压等级不同，要求不同，本题说的一般在8%-12%是正确的。<\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34541", "t": 3, "q": "电网运行中，随着负荷变化而变化的损耗称为可变损耗。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】在电网元件的功率消耗和电能损耗中，有一部分同元件通过的电流（或功率）的平方成正比，如变压器绕组和线路导线的损耗，随电流（或功率）时时变化，称可变损耗。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34542", "t": 3, "q": "系统运行时减少网络有功损耗的有效措施之一是减少元件的电阻。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/fh9XcA6Sa80XwxXRgIj7gKLmwhXj6yJ9K4jbcwm2.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34543", "t": 3, "q": "农村电网负载率低，降低网损是主要问题，对电压质量可以不考虑。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】任何情况下，都应满足电压质量要求，更不能影响电网的安全运行。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34544", "t": 3, "q": "10kV电网公用母线电压为11kV，其母线电压满足电压偏移要求。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/CYGGCBbR3FdM8DvLHXvQvUFoB1KNeCxf7mnmB4Pv.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34545", "t": 3, "q": "由于输电线路首末端电压不同，故首末端电压偏移也不同。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/S0c8CpexnIZ0oOHmhNCnHqyan3fZ31NHVyddriev.png\"><\/p>", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}, {"id": "34546", "t": 3, "q": "提高输电线路电压等级是从电网运行方面降低网损的措施。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第3章，第1节，知识点3：阻抗支路的计算\n【解析】从电网运行角度，并联导纳支路消耗电能与电压平方成正比，阻抗支路电能损耗与电压平方成反比，故要降低网损，要合理确定运行电压。从电网建设角度考虑。提高线路电压可以降低网损。", "l3": "电力系统基础", "l4": "第3章", "ap": [false, false, false, false, false, false]}]}, {"k": "电力系统基础||第4章", "n": "电力系统基础 / 第4章", "qs": [{"id": "34556", "t": 1, "q": "火力发电厂的能量转换过程是（     ）。", "a": ["燃料的化学能→热能→机械能→电能", "燃料的化学能→机械能→热能→电能", "热能→燃料的化学能→机械能→电能", "机械能→燃料的化学能→热能→电能", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】难度：2。火电厂种类虽然很多，但从能量转换的观点分析，其生产过程是基本相同的：燃料的化学能→热能→机械能→电能。化学能→热能（通过锅炉实现），热能→机械能（通过汽轮机实现），机械能→电能（通过发电机实现），BCD选项生产顺序错误。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34557", "t": 1, "q": "凝汽式汽轮机发电厂，即只向外供应电能的发电厂，其效率为（     ）。", "a": ["30%-40%", "40%-50%", "50%-60%", "60%-70%", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】难度：1。火电厂按输出能源分为：①凝汽式汽轮机发电厂，即只向外供应电能的发电厂，其效率较低只有30%~40%；②热电厂，即同时向外供应电能和热能的电厂，其效率较高，可达60%~70%。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34558", "t": 1, "q": "水电厂的发电量取决于（     ）。", "a": ["水位落差", "水流的流量", "原动机容量", "水位落差和水流的流量", "", ""], "r": "D", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】水电厂的发电量取决于水位落差和水流的流量，故D正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34559", "t": 1, "q": "枢纽变电站位于电力系统的枢纽点，电压等级一般为（     ），联系多个电源，出线回路多，变电容量大；全站停电后将造成大面积停电，或导致系统瓦解。", "a": ["220kV", "330kV及以上", "330~220kV", "35~220kV", "", ""], "r": "B", "e": "【定位】第4章，第2节，知识点2：变电站的分类\n【解析】难度：1。枢纽变电站。枢纽变电站的定义：枢纽变电站位于电力系统的枢纽点，电压等级一般为330kV及以上，联系多个电源，出线回路多，变电容量大；全站停电后将造成大面积停电，或导致系统瓦解。枢纽变电站对电力系统运行的稳定性和可靠性起重要作用。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34560", "t": 1, "q": "（     ）是一次设备与二次设备的结合面，主要由电子式互感器、合并单元、智能单元等自动化设备构成。", "a": ["间隔层", "站控层", "中间层", "过程层", "", ""], "r": "D", "e": "【定位】第4章，第2节，知识点3：数字化变电站与智能变电站\n【解析】难度：2。过程层是一次设备与二次设备的结合面，主要由电子式互感器、合并单元、智能单元等自动化设备构成，主要完成与一次设备相关的功能，如开关量、模拟量的采集以及控制命令的执行等。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34561", "t": 1, "q": "负荷开关、接触器和熔断器等属于（     ）中的（     ）。", "a": ["二次设备，接通或断开电路的开关电器", "一次设备，接通或断开电路的开关电器", "二次设备，限制故障电流和防御过电压的保护电器", "一次设备，限制故障电流和防御过电压的保护电器", "", ""], "r": "B", "e": "【定位】第4章，第3节，知识点1：电气一次设备\n【解析】负荷开关、接触器和熔断器等属于一次设备中的接通或断开电路的开关电器。A选项应是一次设备，C、D选项限制故障电流的是普通电抗器和分裂电抗器，防御过电压的保护电器是避雷针、避雷器、避雷线。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34562", "t": 1, "q": "（     ）一般用于35kV及以下、持续电流在4000A及以下的配电装置中。", "a": ["矩形母线", "槽形母线", "管形母线", "钢芯铝绞线", "", ""], "r": "A", "e": "【定位】第4章，第4节，知识点1：裸导体\n【解析】（1）矩形母线一般用于35kV及以下、持续工作电流4000A及以下配电装置中；（2）槽形导体机械强度好、集肤效应系数较小，一般用于35kV及以下、持续工作电流4000~8000A的配电装置中；（3）管型母线一般用于110kV及以上，持续工作电流在8000A以上的配电装置中。正确选项为A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34563", "t": 1, "q": "用开关电器开断电源电压大于（     ），电流大于（     ）的电路时，会产生电弧。", "a": ["10-20V，60-80mA", "10-20V，80-100mA", "20-30V，80-100mA", "20-30V，60-80mA", "", ""], "r": "B", "e": "【定位】第4章，第5节，知识点1：电弧的形成和熄灭\n【解析】电弧是一种气体游离放电现象，开关电器开断电源电压大于10-20V，电流大于80-100mA的电路时，会产生电弧。正确选项为B。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34564", "t": 1, "q": "开关关合时产生电弧的起始原因是（     ）。", "a": ["强电场发射", "热电子发射", "表面电离", "光电离", "", ""], "r": "A", "e": "【定位】第4章，第5节，知识点1：电弧的形成和熄灭\n【解析】（1）开关断开时强电场电子发射和热电子发射是弧隙间最初产生电子的起始原因，其中强电场电子发射是主要原因。（2）开关关合时产生电弧的起始原因只有强电场电子发射。正确选项为A", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34565", "t": 1, "q": "交流电弧的熄灭条件是（     ）。", "a": ["<p><img src=\"https://dati.gwzpks.com/uploads/20260727/2QLUX1zwMnu9mlXH4IQypsj31ia48rjkWsPu9VpO.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/UnWhGNpgDP2zaJsdYWSSE79D4vTuYgCvbvFxshqk.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/ETgBSwJ1HbEHfwgYGmDL4Ry3a2HZyo0czKjTzPZ7.png\"><\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/ESXTJUFgf63230BM6J1YBEKIm8KB9ppYhqAmfssw.png\"><\/p>", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/EznIZPXKlJZ9ESqc65meFOo654XnP4gkGTRVe4lY.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34566", "t": 1, "q": "关于断路器采用多断口的用途，下面描述错误的是（     ）。", "a": ["<p>为了提高断路器的灭弧能力<\/p>", "<p>在相同触头行程下使电弧的总长度加长<\/p>", "<p>降低了恢复电压的上升速度和幅值<\/p>", "<p>降低了弧隙介质强度的恢复过程<\/p>", "", ""], "r": "D", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/CLJAeN9m5WHNTquWcu6FfGu8NRfJQCwV0NUHWuIF.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34567", "t": 1, "q": "为了充分发挥每个灭弧室的作用，应该使两个断口的工作条件接近相等，常在每个断口并联一个（     ）的均压电容。", "a": ["与断口等效电容值相等", "与底座对地等效电容值相等", "比断口等效电容和底座对地等效电容大得多", "比断口等效电容和底座对地等效电容小得多", "", ""], "r": "C", "e": "【定位】第4章，第5节，知识点1：电弧的形成和熄灭\n【解析】断口分布电容包括断口等效电容和底座对地等效电容。在断口上并联一个足够大的电容（一般1000-2500pF）可使断口上的电容分布近似相等。从而保证断口上的电压基本相同。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34568", "t": 1, "q": "关于拉长电弧以熄灭电弧的说法中，以下说法错误的是（     ）。", "a": ["使弧隙的电场强度骤降", "增大了弧隙的表面积", "加强了离子的复合速度", "增强了热游离作用", "", ""], "r": "D", "e": "【定位】第4章，第5节，知识点1：电弧的形成和熄灭\n【解析】迅速拉长电弧，可使弧隙的电场强度骤降，同时使电弧的表面突然增大，有利于电弧的冷却和带电质点向周围介质中扩散和离子复合。ABC均正确，熄灭电弧需要减弱热游离的作用。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34569", "t": 1, "q": "以下有关隔离开关的说法中，错误的是（     ）。", "a": ["在需检修的部分和其它带电部分之间，用隔离开关构成足够大的空气绝缘间隔", "配合断路器，完成倒闸操作", ".隔离开关没有灭弧装置，不能开断或闭合负荷电流和断开短路电流", "隔离开关不具有分/合小电感电流和小电容电流的能力", "", ""], "r": "D", "e": "【定位】第4章，第5节，知识点2：高压断路器\n【解析】（1）隔离开关可在需检修设备和带电部分之间形成空气绝缘间隔，起到“电气隔离作用”，选项A正确；（2）隔离开关无灭弧装置，不能用来接通和切除负荷电流，更不能用来切断短路电流，选项C正确；（3）具有一定的分/合小电感电流和关合小电容电流的能力，选项D错误；（4）隔离开关配合断路器可以完成倒闸操作，选项B正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34570", "t": 1, "q": "以下关于隔离开关的应用场合，说法错误的是（     ）。", "a": ["分、合避雷器和电压互感器", "不可分、合空载母线", "分、合励磁电流不超过2A的空载变压器", "关合电容电流不超过5A的空载线路", "", ""], "r": "B", "e": "【定位】第4章，第5节，知识点2：高压断路器\n【解析】隔离开关没有灭弧装置，但具有一定的分/合小电感电流和电容电流的能力，可以用来分、合避雷器、电压互感器和空载母线。例如双母线接线倒母线操作室给空载母线充电、分、合励磁电流不超过2A的空载变压器和关合电容电流不超过5A的空载线路等。选项B错误。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34571", "t": 1, "q": "熔断器的作用，以下说法不正确的是（     ）。", "a": ["可保护小功率电力线路", "可代替高压断路器工作", "可保护电压互感器", "保护电气设备免受过载和短路电流的损害", "", ""], "r": "B", "e": "【定位】第4章，第5节，知识点4：熔断器、负荷开关、高压接触器及重合器\n【解析】熔断器无操动机构，不能象断路器一样完成正常运行电路的接通和断开任务，但通过熔体的熔断可以断开过负荷电流和短路电流，保护电气设备免受过载电流和短路电流的损害。选项B不正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34572", "t": 1, "q": "下列高压设备，一般只在屋外使用的是（     ）。", "a": ["高压断路器", "高压负荷开关", "高压隔离开关", "跌落式高压熔断器", "", ""], "r": "D", "e": "【定位】第4章，第5节，知识点4：熔断器、负荷开关、高压接触器及重合器\n【解析】高压断路器、高压负荷开关、高压隔离开关，户内户外均有使用。跌落式高压熔断器一般只用于户外。选D。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34573", "t": 1, "q": "以下关于电流互感器的描述正确的是（     ）。", "a": ["电磁式电流互感器工作原理与变压器相似", "一次绕组并联在所测量的一次回路中，并且匝数很少", "正常情况下二次侧近于开路状态运行", "一次绕组中的电流与二次绕组电流大小相关", "", ""], "r": "A", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】（1）电磁式电流互感器和电压互感器的工作原理都与变压器相似，属于特殊用途的变压器，选项A正确；（2）电流互感器一次绕组很少，串联在被测的一次回路中。二次绕组匝数很多，与测量仪表的电流线圈串联连接，选项B错误；（3）正常运行时二次绕组近于短路状态，选项C错误；（4）二次绕组电流与一次电流成正比，完全取决于一次电流大小，而非一次电流取决于二次电流，选项D错误。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34574", "t": 1, "q": "关于三相电压互感器，以下说法不正确的是（     ）。", "a": ["<p>三相五柱式电压互感器中，若发生单相接地故障，接地相对地电压升高为原来的2倍<\/p>", "<p>三相五柱式电压互感器的两个旁轭为产生的零序磁通提供了畅通的磁路<\/p>", "<p>三相三柱式电压互感器的一次侧中性点不允许接地，只能测量线电压不能测量相电压<\/p>", "<p>三相三柱式电压互感器的二次绕组也接成星形并中性点接地<\/p>", "", ""], "r": "A", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】（1）三相五柱式电压互感器，两个旁轭为产生的零序磁通提供了畅通的磁路，原边中性点允许接地，可以用来测量三相对地电压（相电压）和零序电压。单相接地故障时接地相对地电压为零，原边故障相绕组两端电压为零，故障相副边绕组电压为零。选项A错误，选项B正确。（2）三相三柱式电压互感器原边绕组中性点不允许接地，所以只能测量线电压不能测量相电压。二次绕组中性点接地属于安全接地（为安全起见，二次绕组必须接地），不属于工作接地。选项CD正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34575", "t": 1, "q": "关于电流互感器的匝数补偿，说法正确的是（     ）。", "a": ["匝数补偿补偿的是一次侧匝数，只能改变相位差", "匝数补偿补偿的是一次侧匝数，只能改变电流误差", "匝数补偿补偿的是二次侧匝数，只能改变相位差", "匝数补偿补偿的是二次侧匝数，只能改变电流误差", "", ""], "r": "D", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】匝数补偿补偿的是二次侧匝数，只能改比差。当电流互感器的一次安匝固定时，二次电流与二次匝数成反比，减少二次匝数，二次电流则会增大，反之增大二次匝数，二次电流则会减少，从而使互感器的比值差得到补偿。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34576", "t": 1, "q": "以下关于电流互感器的额定容量的说法，正确的是（     ）。", "a": ["<p>额定容量和额定阻抗只差一个系数<\/p>", "<p>二次额定负荷阻抗就是测量仪表、继电器的阻抗<\/p>", "<p>同一台电流互感器工作在不同准确级时额定容量相同<\/p>", "<p>额定容量常用一次额定阻抗来表示<\/p>", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/Ti7aVLYNEowELu6BHBhHuLAZXZT1pAOYNMJ3kDo6.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34577", "t": 1, "q": "（     ）用于测量三相负荷，以监视每相负荷不对称情况。", "a": ["单相式接线", "两相电流差接线", "星形接线", "不完全星形接线", "", ""], "r": "C", "e": "【定位】第4章，第6节，知识点1：互感器概述\n【解析】电磁式电流互感器的接线方式是星形接线：用于测量三相负荷，以监视每相负荷不对称情况。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34578", "t": 1, "q": "下面关于电磁式电压互感器工作原理的描述，错误的是（     ）。", "a": ["<p>其工作原理、构造和连接方法都和普通电力变压器相同<\/p>", "<p>电压互感器的容量很小，通常只有几十到几百伏安<\/p>", "<p>二次绕组与测量仪表和保护装置的电压线圈并联<\/p>", "<p>运行中的电压互感器，二次绕组绝不能开路<\/p>", "", ""], "r": "D", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】（1）电压互感器是一种特殊用途的变压器，其工作原理、构造和连接方法与变压器相同，选项A正确；（2）电压互感器是沟通一次系统和二次回路的联络元件，只需要提供测量仪表所需的功率，容量很小，选项B正确；（3）二次绕组与所接测量仪表和保护装置的电压线圈并联，选项C正确；（4）二次绕组所接测量仪表和保护装置的电压线圈阻抗很大，正常情况下电压互感器近于开路状态运行，运行中的电压互感器，二次绕组不允许短路。选项D错误。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34579", "t": 1, "q": "关于电磁式电压互感器的误差，以下说法错误的是（     ）。", "a": ["<p>由电压互感器存在激磁电流和内阻抗产生<\/p>", "<p>影响误差的运行工况是一次电压、二次负荷和功率因数<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/A9OILjeJ1WAhZFxhMTpUEmoAUeuQ6t45YYizNTLh.png\"><\/p>", "<p>误差由空载误差和负载误差两部分组成<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/ZLOzsBTowDXqy6Gvpq8kgZHaBPOyamhIR8WMXZDK.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34580", "t": 1, "q": "电压互感器的额定容量，以下说法不正确的是（     ）。", "a": ["指的是对应于最高准确级下的容量", "不同的准确级时二次侧允许接的负荷也不同", "较低的准确级对应较低的容量值", "电压互感器还规定有最大容量", "", ""], "r": "C", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】（1）电压互感器的额定容量是指对应于最高准确级下的容量，即电压互感器在这种负荷容量下所引起的误差，不会超过这一准确级规定的数值。选项A正确；（2）同一台电压互感器在不同准确度等级下具有不同的额定容量（不同的额定二次负荷阻抗），准确度越低，额定容量越大。负荷选项B正确，选项C错误；（3）电压互感器按在最高工作电压下长期工作允许发热条件，还规定一个最大容量，称为热极限容量。它是在额定一次电压下温升不超过规定限值时，二次绕组所能供给的以额定电压为基准的视在功率值，选项D正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34581", "t": 1, "q": "在3~20kV电网中，为了测量相对地电压，通常采用（     ）。", "a": ["<p>不完全星形（V-V）接线<\/p>", "<p>三相三柱式电压互感器<\/p>", "<p>三相五柱式电压互感器<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/sCMCcFUHBsRsjJR72WxcP21vOnPXPt4hkzurhjo1.png\"><\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/Y4mrvhx4V095EdiV8KzZhaih5aM7dNb83nkr8WEp.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34582", "t": 1, "q": "关于电压互感器的接线方式，下面正确的是（     ）。", "a": ["<p>用在小接地电流系统时附加二次绕组的额定电压为100V<\/p>", "<p>用在大接地电流系统中附加二次绕组的额定电压为100V/3<\/p>", "<p>三相五柱式电压互感器的附加二次绕组每相的额定电压按100V/3设计<\/p>", "<p>110kV及以上电压等级的电压互感器需要经隔离开关和熔断器，才能接入电网<\/p>", "", ""], "r": "C", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】（1）接成开口三角形，用于测量零序电压的电压互感器辅助二次绕组，用于中性点小接地电流运行方式电力网时，其额定电压取100V/3；用于中性点大接地电流运行方式电力网时，其额定电压取100V。选项AB错误。（2）三相五柱式电压互感器主要用于3-15kV中性点不直接接地系统中，所以附加二次绕组的额定电压为100V/3。选项C正确（3）一般情况下3~35kV电压互感器需要经过隔离开关和熔断器与电网相连，110kV及以上电压互感器只经过隔离开关与电网相连。选项D错误。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34583", "t": 1, "q": "关于电流互感器的测量误差，描述不正确的是（     ）。", "a": ["<p>电流互感器的铁心截面积越大，误差越小<\/p>", "<p>电流互感器二次侧匝数越多，误差越小<\/p>", "<p>电流互感器一次侧电流越大，误差越小<\/p>", "<p>电流互感器二次侧负载越多，误差越大<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/1Gzx9T44ii10WcgrNwDZrpACuVQ95axjRvYzOM36.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34584", "t": 1, "q": "电流互感器的一次绕组（     ）在所测量的一次回路中。", "a": ["串联", "并联", "串并联", "没有影响", "", ""], "r": "A", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】电磁式电流互感器的一次绕组与被测电路串联，并且匝数很少，分为单匝式和多匝式两种。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34585", "t": 1, "q": "我国测量用电压互感器的准确度等级分类不包括（     ）。", "a": ["2", "0.1", "0.2", "1", "", ""], "r": "A", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】电压互感器的准确级分为0.2、0.5、1、3。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34586", "t": 1, "q": "（     ）主要包括变电站的保护、测控、计量等二次设备，主要任务是利用本间隔层的数据完成对本间隔层设备的监测和保护判断。", "a": ["间隔层", "站控层", "中间层", "过程层", "", ""], "r": "A", "e": "【定位】第4章，第2节，知识点3：数字化变电站与智能变电站\n【解析】数字化变电站在逻辑结构上可以分为三个层次，分别为过程层、间隔层、站控层，其中间隔层主要包括变电站的保护、测控、计量等二次设备，主要任务是利用本间隔层的数据完成对本间隔层设备的监测和保护判断。因此A选项正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34587", "t": 1, "q": "关于核能发电厂的说法错误的是（     ）。", "a": ["发电成本低", "容量大", "调节灵活", "输出稳定", "", ""], "r": "C", "e": "【定位】第4章，第1节，知识点5：核能发电厂\n【解析】核电厂调节不灵活，核心原因是：反应堆的核反应、堆芯热量、蒸汽参数都不能大幅、快速变动，加上安全与寿命限制，只能带基本负荷，不适合频繁调峰。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34588", "t": 1, "q": "既能发电，又能存储能量的是（     ）。", "a": ["火电厂", "水电厂", "抽水蓄能电厂", "核电厂", "", ""], "r": "C", "e": "【定位】第4章，第1节，知识点4：抽水蓄能电厂 \n【解析】抽水蓄能电厂中必须兼备抽水和发电两类设施：在电力负荷低谷时，抽水蓄能电厂是吸收低谷电能的电力用户（抽水工况）；待到电力系统负荷高峰时，抽水蓄能电厂是提供峰荷电力的发电厂（发电工况）。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34589", "t": 1, "q": "不属于电气一次设备的是（     ）。", "a": ["载流导体", "接地装置", "操作电源", "互感器", "", ""], "r": "C", "e": "【定位】第4章，第3节，知识点2：电气二次设备\n【解析】操作电器、信号设备及控制电缆以及其对应的操作电源均为二次设备。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34590", "t": 1, "q": "风力发电和光伏发电的优点有（     ）。", "a": ["比煤电更安全可靠", "发电随机性强", "发电波动性强", "低碳环保", "", ""], "r": "D", "e": "【定位】第4章，第1节，知识点6：新能源发电\n【解析】风电光伏属于新能源，可再生资源，低碳环保，但出力随机性大，应用上技术较复杂。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34591", "t": 1, "q": "下列不属于开关电器的是（     ）。", "a": ["负荷开关", "熔断器", "电抗器", "断路器", "", ""], "r": "C", "e": "【定位】第4章，第5节，知识点1：电弧的形成和熄灭\n【解析】开关电器的主要任务是切断有电流通过的电路，电抗器不负责切断电路，不属于开关电器。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34592", "t": 1, "q": "火电厂相对于水电厂的优点是（     ）。", "a": ["布局灵活", "效率高", "启停快", "污染小", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点2：火力发电厂；知识点3：水力发电厂\n【解析】火电厂的特点：火电厂布局灵活，装机容量的大小可按需要决定。BCD选项都是水电厂的特点。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34593", "t": 1, "q": "电压互感器下列哪种接线方式一次侧额定电压为相电压？（     ）", "a": ["三台单相式", "三相三柱式", "三相五柱式", "V-V形接线", "", ""], "r": "A", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】三台单相式接成星星开口三角形，一次侧额定电压为相电压，故A正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34594", "t": 1, "q": "关于电流互感器的描述不正确的是（     ）。", "a": ["电流互感器二次侧负载阻抗很小，因此电流互感器近似于短路状态运行", "电流互感器将一次侧的大电流变成小电流，因此一次绕组匝数很少，二次侧匝数很多", "电流互感器单匝式比多匝式的精度高，结构简单，因此使用广泛", "电流互感器一次绕组的电流完全取决于被测电路的负荷电流，与二次电流大小无关", "", ""], "r": "C", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】电流互感器单匝式比多匝式误差大，故C描述错误。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34595", "t": 1, "q": "我国电力工业中，以（     ）为主，发电量占全国发电量70%左右。", "a": ["火电", "水电", "核电", "风电", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】目前我国以火力发电厂为主，其发电量占全国总发电量的70%以上。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34596", "t": 1, "q": "火电厂电能的生产过程是（     ）→热能→机械能→电能。", "a": ["化学能", "核能", "地热能", "太阳能", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】火电厂电能生产过程是：燃料的化学能→热能→机械能→电能。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34597", "t": 1, "q": "以下不是水电厂的特点是（     ）。", "a": ["布局灵活", "投资大", "建设周期长", "发电不均衡", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】水力发电厂特点：（1）可综合利用水能资源；（2）发电成本低、效率高；（3）运行灵活；（4）水能可以储蓄和调节；（5）水力发电不污染环境；（6）水电厂建设投资较大，工期较长；（7）发电量受到水文气象条件的制约，发电不均衡；（8）农业生产带来不利，可能破坏自然界的生态平衡。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34598", "t": 1, "q": "抽水蓄能式发电厂不同于其他水电厂的是有（     ）个水库。", "a": ["1", "2", "3", "多个", "", ""], "r": "B", "e": "【定位】第4章，第1节，知识点4：抽水蓄能电厂\n【解析】抽水蓄能式电厂在上游和下游都要有水库，在电力负荷低谷时，抽水蓄能电厂将水从下游水库抽到上游水库，是吸收低谷电能的电力用户（抽水工况）；待到电力系统负荷高峰时，抽水蓄能电厂防水发电，是提供峰荷电力的发电厂（发电工况）。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34599", "t": 1, "q": "以下不是核电厂的特点是（     ）。", "a": ["节省煤", "可建在地下或山上", "寿命长", "投资小", "", ""], "r": "D", "e": "【定位】第4章，第1节，知识点5：核能发电厂\n【解析】核电厂的特点：（1）运行安全稳定；（2）节省煤、石油和天然气；（3）节省燃料的运输费；（4）反应堆不需要空气助燃，可建在地下水下和高山顶上；（5）对环境影响小，无温室效应；（6）寿期长；（7）建设投资比火电厂和水电站大。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34600", "t": 1, "q": "容量超过（     ）的风力发电厂都是采用并网运行方式。", "a": ["5kW", "8kW", "10kW", "15kW", "", ""], "r": "C", "e": "【定位】第4章，第1节，知识点6：新能源发电\n【解析】风力发电的运行方式\n①独立运行：经蓄电池储能，用于5kW以下的风力发电机；\n②并网运行：风电场，用于10kW至MW级的风力发电机。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34601", "t": 1, "q": "火电厂的原动机是（     ）。", "a": ["锅炉", "汽轮机", "发电机", "电动机", "", ""], "r": "B", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】原动机是将其他形式能量转化为机械能用以拖动其他设备旋转的动力机械，在火电厂中锅炉只是将燃料化学能转化为蒸汽热能的换热设备，仅为系统提供高温高压蒸汽，无法输出机械能，不属于原动机；汽轮机利用锅炉送来的高温高压蒸汽推动叶片旋转，将蒸汽的热能转换为机械能，用来拖动发电机运转，是火电厂的原动机；发电机的作用是把汽轮机输入的机械能转化为电能，属于能量转换的用电发电设备，需要被原动机带动，并非原动机；电动机是消耗电能将电能转换为机械能的设备，多用于驱动电厂各类辅助机械设备，不能作为电厂发电的动力源头，因此本题选B。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34602", "t": 1, "q": "以下不是火电厂的特点是（     ）。", "a": ["布局灵活", "生产成本高", "建设周期厂", "可以深入负荷中心", "", ""], "r": "C", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】火力发电厂的特点：\n（1）火电厂布局灵活，装机容量的大小可按需要决定。\n（2）火电厂的一次性建造投资少，建造工期短，发电设备年利用小时数较高。\n（3）火电厂耗煤量大，生产成本高。\n（4）火电厂动力设备繁多，发电机组控制操作复杂，厂用电量和运行人员多，运行费用高。\n（5）燃煤发电机组由停机到开机并带满负荷需要几小时到十几小时，并附加耗用大量燃料。\n（6）火电厂担负调峰、调频或事故备用时，相应的事故增多，强迫停运率增高，厂用电率增高。\n（7）火电厂的各种排放物（如烟气、灰渣和废水）对环境的污染较大。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34603", "t": 1, "q": "传统凝气式火电厂的能量转化过程是（     ）。", "a": ["化学能→热能→压力势能→电能", "化学能→压力势能→机械能→电能", "热能→压力势能→机械呢→电能", "化学能→热能→机械能→电能", "", ""], "r": "D", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】电能生产过程是：燃料的化学能→热能→机械能→电能。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34604", "t": 1, "q": "热电厂对外提供的能量形式是（     ）。", "a": ["电能和煤灰", "电能和热能", "热能和煤灰", "机械能和电能", "", ""], "r": "B", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】热电厂属于热电联产电厂，既可以通过汽轮机带动发电机向外输送电能，又可以将发电过程中做过功的部分蒸汽抽取出来，向周边工业企业、居民供暖等对外输送热能，煤灰属于发电产生的固体废弃物，并不是对外提供的能量形式，机械能只是电厂内部能量转换过程中的中间能量形式，不会直接对外供给，所以热电厂对外提供的能量形式为电能和热能，本题选择B。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34605", "t": 1, "q": "电效率低，仅能对外提供电能的火电厂是（     ）。", "a": ["内燃机发电厂", "凝气式汽轮机火电厂", "燃气轮机发电厂", "余热火电厂", "", ""], "r": "B", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】凝汽式汽轮机发电厂，只能对外提供电能，效率低，只有30%-40%。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34606", "t": 1, "q": "<p>举世瞩目的三峡电厂是（ ）。<\/p>", "a": ["<p>火电厂<\/p>", "<p>水电厂<\/p>", "<p>核电厂<\/p>", "<p>新能源电厂<\/p>", "", ""], "r": "B", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】三峡电厂依托长江三峡水利枢纽工程建设，依靠水流落差带动水轮机旋转进而驱动发电机发电，利用的是水能进行发电，属于水电厂；火电厂依靠煤炭等化石燃料燃烧产生热能发电，核电厂依靠核裂变释放的核能发电，新能源电厂一般指光伏、风电等新型可再生能源发电场所，三峡电厂不属于这三类，因此本题选择B。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34607", "t": 1, "q": "对环境没有污染且可美化环境的发电厂是（     ）。", "a": ["火电厂", "生物质电厂", "风电场", "抽水蓄能式电厂", "", ""], "r": "D", "e": "【定位】第4章，第1节，知识点4：抽水蓄能电厂\n【解析】抽水蓄能式电厂主要依靠上下水库的水体势能转换实现电能的储存与释放，运行过程中不会产生废气、废渣、废水等污染物，电厂依托水库水域建设，库区可以植树绿化、打造水域景观，能够起到美化环境的作用；火电厂燃烧化石燃料会排放烟尘、二氧化硫等污染物，生物质电厂在燃料焚烧过程中也会产生一定废气污染物，风电场虽基本无污染，但风机设施占地面积大、排布分散，难以起到美化环境的效果，因此本题选择D。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34608", "t": 1, "q": "水力发电厂的能源是（     ）。", "a": ["水的压力", "水库容积", "水的势能", "水的流速", "", ""], "r": "C", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】水力发电厂简称水电厂，又称水电站，是把水的势能和动能转换成电能的发电厂", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34609", "t": 1, "q": "水电厂的原动机是（     ）。", "a": ["水轮机", "汽轮机", "发电机", "电动机", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】原动机是将其他形式的能量转化为机械能，用来拖动发电机旋转的动力设备，水电厂利用水流的冲击力推动水轮机转动，水轮机将水能转换为机械能来带动发电机发电，所以水电厂的原动机是水轮机，汽轮机是火电厂的原动机，发电机是将机械能转化为电能的设备，需要被原动机拖动，电动机是消耗电能转化为机械能的用电设备，三者均不属于水电厂的原动机，因此本题选A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34610", "t": 1, "q": "水电厂从停止到满负荷需要（     ）。", "a": ["1分钟", "几分钟", "十几分钟", "4-5分钟", "", ""], "r": "D", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】水电厂机组启停灵活、响应速度快，从停机状态启动到带满负荷运行一般只需要 4-5 分钟左右，远快于火电机组漫长的启停耗时，1 分钟时间过短无法完成机组开机、并网、逐步升负荷的系列操作，几分钟表述过于笼统，十几分钟不符合水电机组快速启停的运行特性，所以本题选择D。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34611", "t": 1, "q": "能够进行黑启动的发电厂是（     ）。", "a": ["堤坝式水电厂", "引水式水电厂", "河床式水电厂", "抽水蓄能式水电厂", "", ""], "r": "D", "e": "【定位】第4章，第1节，知识点4：抽水蓄能电厂\n【解析】抽水蓄能电厂在电力系统中的作用：调峰；填谷；事故备用；调频；调相；黑启动；蓄能。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34612", "t": 1, "q": "我国自行设计建设的第一座核电厂是（     ）。", "a": ["大亚湾核电站", "岭澳核电站", "秦山核电站", "佳木斯核电站", "", ""], "r": "C", "e": "【定位】第4章，第1节，知识点5：核能发电厂\n【解析】秦山核电站是我国第一座依靠自身技术力量自行设计、建造和运营管理的核电站，结束了我国大陆无核电的历史，大亚湾核电站主要引进国外技术合作建设，岭澳核电站是在大亚湾基础上扩建的核电项目，佳木斯并没有建成运营的核电站，因此本题选择C。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34613", "t": 1, "q": "（     ）发电原理和常规火力发电原理基本相同。", "a": ["水力发电", "风力发电", "地热发电", "海洋能发电", "", ""], "r": "C", "e": "【定位】第4章，第1节，知识点6：新能源发电\n【解析】地球本身就是一个巨大的热库，其内部蕴藏的热能即“地热能” ，是取之不尽的可再生能源。地热发电是利用高温地热资源进行发电的方式，其原理与常规火力发电基本相同，只不过高温热源是地下储热。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34614", "t": 1, "q": "太阳能光伏发电主要是把（     ）的能量转化为电能。", "a": ["<p>太阳能<\/p>", "<p>太阳光<\/p>", "<p>太阳热<\/p>", "<p>太阳波<\/p>", "", ""], "r": "B", "e": "<p>【定位】第4章，第1节，知识点6：新能源发电 【解析】太阳热发电：将太阳热能传递给介质，由介质热能转变为电能。太阳光发电：由太阳光直接转换为电能。<\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34615", "t": 1, "q": "水电厂的发电量主要取决于（     ）。", "a": ["<p>水的势能<\/p>", "<p>水的位能<\/p>", "<p>水位的落差<\/p>", "<p>水流的流量<\/p>", "", ""], "r": "C", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/M3LsEt9Gr3aILjWAN6tU7NLxJ4RTbDTbAY4nrzsT.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34616", "t": 1, "q": "能够节省燃料运输费用，对环境影响小，无温室效应的发电厂是（     ）。", "a": ["凝气式火电厂", "热电厂", "生物质电厂", "核电厂", "", ""], "r": "D", "e": "【定位】第4章，第1节，知识点5：核能发电厂\n【解析】核电厂依靠核燃料发生核裂变释放能量发电，少量核燃料就能产生巨大的发电量，不需要频繁大量运输燃料，可以大幅节省燃料运输费用，正常运行期间几乎不排放二氧化碳等温室气体，对大气环境影响较小；凝气式火电厂和热电厂都需要消耗大量煤炭，燃料运输成本高，燃烧会排放大量温室气体与污染物，生物质电厂燃烧生物质燃料同样会排放二氧化碳，存在温室效应，因此本题选择D。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34617", "t": 1, "q": "核电的生产过程是（     ）→热能→机械能→电能。", "a": ["化学能", "核裂变能", "核聚变能", "核反应堆", "", ""], "r": "B", "e": "【定位】第4章，第1节，知识点5：核能发电厂\n【解析】核电站是利用铀燃料在核反应堆中发生可控核裂变释放出核裂变能，将核能转化为冷却剂的热能，高温冷却剂加热产生蒸汽推动汽轮机旋转把热能转化为机械能，再由发电机将机械能转化为电能，化学能是火电厂燃料燃烧时释放的能量，目前商用核电站尚未实现可控核聚变发电，核反应堆只是实现核裂变反应的设备并非能量形式，因此本题选B。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34618", "t": 1, "q": "对环境污染大的发电厂是（     ）。", "a": ["火电厂", "水电厂", "太阳能电厂", "风力发电场", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】电力工业中的火力发电厂是一个污染源。在运行过程中会产生相当数量的固体与气体废料，造成对大气与水源的严重污染，所以要控制发电厂排放的烟气成分（如硫的氧化物SO2、氮的氧化物NO2及烟尘等）、烟气温度及扩散速度、冷却水流出温度与流速、灰的排放等。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34619", "t": 1, "q": "目前我国电力工业的主力是（     ）。", "a": ["核电和水电", "火电和水电", "风电和光电", "核电和火电", "", ""], "r": "B", "e": "【定位】第4章，第1节，知识点1：发电厂及其分类\n【解析】目前我国火电发电量占70%左右，水电占20%作用，核电占5%，其他形式发电占5%。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34620", "t": 1, "q": "我国火电厂的燃料主要是（     ）。", "a": ["石油", "煤气", "煤", "天然气", "", ""], "r": "C", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】火力发电厂简称为火电厂，是利用煤炭、石油、天然气作为燃料生产电能的工厂，我国火电厂的主要燃料是煤。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34621", "t": 1, "q": "电流互感器串联于线路之中，其二次侧电流值的大小由线路的（     ）决定。", "a": ["额定电流", "负载电流", "最大电流", "最小电流", "", ""], "r": "B", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】电流互感器是将一次的大电流转换为二次侧的小电流，反映的线路的实时电流，即负载电流，故选B。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34622", "t": 1, "q": "电流互感器本身造成的测量误差是由于有励磁电流存在，励磁支路呈现为（     ）使电流有不同相位，造成角度误差。", "a": ["电感性", "电阻性", "电容性", "阻容性", "", ""], "r": "A", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】励磁支路相当于电感，呈现电感性，故选A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34623", "t": 1, "q": "电力互感器的作用是（     ）。", "a": ["变换电能", "电能传输", "信号传输", "变换和隔离", "", ""], "r": "D", "e": "【定位】第4章，第6节，知识点1：互感器概述\n【解析】电力互感器的作用是变换和隔离，故选D。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34624", "t": 1, "q": "由二次设备相互连接，构成对一次设备进行监测、控制、调节和保护的电气回路称为（     ）。", "a": ["二次接线系统", "保护接线系统", "信号回路", "控制和信号系统", "", ""], "r": "A", "e": "【定位】第4章，第3节，知识点2：电气二次设备\n【解析】由二次设备相互连接，构成对一次设备进行监测、控制、调节和保护的电气回路称为二次接线系统或二次回路，故选A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34625", "t": 1, "q": "电流互感器二次额定电流通常为（     ）。", "a": ["1A或2A", "1A或3A", "2A或5A", "1A或5A", "", ""], "r": "D", "e": "【定位】第4章，第6节，知识点1：互感器概述\n【解析】电流互感器TA将一次额定电流变换为二次额定电流1A或5A，送入电流继电器，故选D。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34626", "t": 2, "q": "与水电厂和其他类型电厂相比，以下属于火电厂特点的是（     ）。", "a": ["火电厂布局灵活", "一次性建造投资大，建造工期短", "发电成本高，运行费用高", "环境污染比较严重", "", ""], "r": "ACD", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】难度：1。布局灵活；建造投资少，建造工期短，发电设备年利用小时数较高；发电成本高，运行费用高；启动慢，跟踪负荷需要附加耗用燃料，不宜用于调峰调频或事故备用；环境污染比较严重。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34627", "t": 2, "q": "火力发电厂的特点正确的是（     ）。", "a": ["耗煤量大，发电成本高", "动力设备繁多，控制操作复杂，运行费用高", "启动时间长，启停费用高", "适于担负调峰、调频", "", ""], "r": "ABC", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】适于担负调峰、调频为水力发电厂的特点。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34628", "t": 2, "q": "以下属于水电厂特点的是（     ）。", "a": ["<p>一般距负荷中心较远，基本上没有发电机电压负荷<\/p>", "<p>水电厂的装机台数和容量，是根据水能利用条件一次确定的<\/p>", "<p>需要考虑发展和扩建<\/p>", "<p>水电厂附近地形复杂，电气主接线应尽可能简单，使配电装置紧凑<\/p>", "", ""], "r": "ABD", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】难度：2。水电厂的特点是：一般距负荷中心较远，基本上没有发电机电压负荷，全部电能用升高电压送入系统；水电厂的装机台数和容量，是根据水能利用条件一次确定的，不必考虑发展和扩建；水电厂附近地形复杂，电气主接线应尽可能简单，使配电装置紧凑。C选项水电厂不需要考虑发展和扩建。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34629", "t": 2, "q": "抽水蓄能电厂在系统中的作用包括（     ）。", "a": ["调峰、填谷", "事故备用", "调频、调相", "黑启动", "", ""], "r": "ABCD", "e": "【定位】第4章，第1节，知识点4：抽水蓄能电厂\n【解析】难度：1。抽水蓄能电厂在系统中的作用：调峰、填谷、事故备用、可作为黑启动电源、调频、调相、蓄能。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34630", "t": 2, "q": "关于抽水蓄能式水电厂的效益，正确的是（     ）。", "a": ["容量效益", "提高火电设备利用率", "节能效益", "对环境没有污染且可美化环境", "", ""], "r": "ABCD", "e": "【定位】第4章，第1节，知识点4：抽水蓄能电厂\n【解析】抽水蓄能水电厂在用电低谷时抽水蓄能、用电高峰时放水发电，可作为系统备用容量具备容量效益，能够承担调峰、调频任务，减少火电机组频繁启停与深度调峰，有效提高火电设备利用率，优化电源调度实现节能减排带来节能效益，电站运行过程中不产生废气、废渣等污染物，库区水域还能改善区域生态、美化周边环境，因此四个选项描述均正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34631", "t": 2, "q": "关于风力发电，说法正确的是（     ）。", "a": ["能量转化过程为风能转化为汽轮机的机械能，再转化为电能", "风力资源是一种过程性能源", "风力资源取之不尽，不会产生任何污染", "风力发电属于新能源发电", "", ""], "r": "BCD", "e": "【定位】第4章，第1节，知识点6：新能源发电\n【解析】风力发电的原动机不是汽轮机，故A错误；风力资源是一种过程性能源，B正确；风力资源取之不尽，不会产生任何污染，C正确；风力发电属于新能源发电，D正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34632", "t": 2, "q": "关于太阳能发电描述正确的是（     ）。", "a": ["有热发电和光发电两种方式", "热发电是将吸收的太阳辐射热能转化成电能的装置", "出力比较稳定", "光发电不通过热过程直接将太阳的光能转变成电能", "", ""], "r": "ABD", "e": "【定位】第4章，第1节，知识点6：新能源发电\n【解析】太阳能发电出力不稳定，选项C错误，ABD描述均正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34633", "t": 2, "q": "按照在电力系统中的地位和作用不同，变电站可分成（     ）和企业变电站。", "a": ["枢纽变电站", "中间变电站", "地区变电站", "终端变电站", "", ""], "r": "ABCD", "e": "【定位】第4章，第2节，知识点2：变电站的分类\n【解析】难度：2。按照在电力系统中的地位和作用不同，变电站可分成以下几类1.枢纽变电站；2.中间变电站；3地区变电站；4.终端变电站；5.企业变电站。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34634", "t": 2, "q": "数字化变电站自动化系统的结构在物理上可分为（     ）。", "a": ["间隔层", "智能化的一次设备", "网络化的二次设备", "过程层", "", ""], "r": "BC", "e": "【定位】第4章，第2节，知识点3：数字化变电站与智能变电站\n【解析】难度：2。数字化变电站自动化系统的结构在物理上可分为两类，即智能化的一次设备和网络化的二次设备。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34635", "t": 2, "q": "智能变电站的实现基于数字化变电站，但智能变电站更深层次体现出智能电网的（     ）特点。", "a": ["信息化", "数字化", "自动化", "互动化", "", ""], "r": "ACD", "e": "【定位】第4章，第2节，知识点3：数字化变电站与智能变电站\n【解析】智能变电站的实现基于数字化变电站，但智能变电站更深层次体现出智能电网的信息化、自动化、互动化的特点，选项B错误，ACD描述均正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34636", "t": 2, "q": "下面选项中属于一次设备的有（     ）。", "a": ["<p>生产和变换电能的设备<\/p>", "<p>接通或断开电路的开关电器<\/p>", "<p>绝缘监察装置<\/p>", "<p>载流导体<\/p>", "", ""], "r": "ABD", "e": "【定位】第4章，第3节，知识点1：电气一次设备\n【解析】（1）一次设备包括：生产和变换电能的设备；接通或断开电路的开关电器；限制故障电流和防御过电压的保护电器；载流导体；互感器； 无功补偿设备；接地装置。选项ABD属于一次设备；（2）二次设备是用于对一次设备的运行状态进行监视测量、控制和保护的设备或装置，绝缘监察装置用于监察电气设备的对地绝缘，属于二次设备。选项为ABD。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34637", "t": 2, "q": "电力电缆按绝缘层和保护层的不同可分为（     ）。", "a": ["<p>油浸纸绝缘电缆<\/p>", "<p>聚氯乙烯绝缘电缆<\/p>", "<p>高压充油电缆<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/A1Buxb1RNgr4bGppBUZIVAk9E8VUWl18rrKrgncJ.png\"><\/p>", "", ""], "r": "ABCD", "e": "【定位】第4章，第4节，知识点2：电缆\n【解析】（1）电力电缆基本结构：线芯（导体）、绝缘层、屏蔽层和保护层；（2）按照绝缘层和保护层的不同，电力电缆分为①油浸纸绝缘电缆；②聚氯乙烯绝缘电缆；③交联聚乙烯绝缘电缆；④橡皮绝缘电缆；⑤高压充油电缆；⑥SF6气体绝缘电缆。正确选项为ABCD。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34638", "t": 2, "q": "开关断开时产生电弧的起始原因是（     ）。", "a": ["强电场发射", "热电子发射", "表面电离", "光电离", "", ""], "r": "AB", "e": "【定位】第4章，第5节，知识点1：电弧的形成和熄灭\n【解析】开关断开时产生电弧的起始原因是强电场电子发射和热电子发射，其中强电场电子发射是弧隙间最初产生自由电子的主要原因。正确选项为AB。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34639", "t": 2, "q": "断路器中弧隙介质强度的恢复过程与（     ）等有关。", "a": ["灭弧装置结构", "介质特性", "电路参数", "触头分开速度", "", ""], "r": "ABD", "e": "【定位】第4章，第5节，知识点1：电弧的形成和熄灭\n【解析】弧隙电流过零后的介质强度的增长速度和恢复过程，与断路器的灭弧装置结构、介质特性、电弧电流的大小、冷却条件及触头分离速度等因素有关。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34640", "t": 2, "q": "断路器中弧隙电压的恢复过程与（     ）有关。", "a": ["灭弧装置结构", "介质特性", "电路参数", "负荷性质", "", ""], "r": "CD", "e": "【定位】第4章，第5节，知识点1：电弧的形成和熄灭\n【解析】弧隙电压的恢复过程与①电路参数（L、C、R）；②短路种类；③负荷性质（阻、感、容性）有关。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34641", "t": 2, "q": "高压断路器熄灭电弧的基本方法有（     ）。", "a": ["利用灭弧介质", "采用特殊金属材料作灭弧触头", "利用气体或油吹动电弧", "利用单断口灭弧", "", ""], "r": "ABC", "e": "【定位】第4章，第5节，知识点1：电弧的形成和熄灭\n【解析】交流电弧熄灭的基本方法：（1）利用灭弧介质灭弧（常用的灭弧介质有变压器油、真空、压缩空气和SF6气体等）；（2）采用特殊金属材料作灭弧触头（减少电弧中的金属蒸汽和热电子发射）；（3）多断口灭弧；（4）利用气体和油吹弧灭弧；（5）提高触头分离速度，加快介质强度恢复过程；（6）断路器触头并联电阻，改变弧隙瞬态电压恢复特性，减小弧隙电压电压上升速度和幅值。正确选项为ABC。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34642", "t": 2, "q": "利用多断口灭弧时，其优点有（     ）。", "a": ["<p>把电弧分割成很多小电弧段<\/p>", "<p>加速了弧隙电阻的增大<\/p>", "<p>增大介质强度的恢复速度<\/p>", "<p>增大弧隙的恢复电压<\/p>", "", ""], "r": "ABC", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/RjJGABObVlZOzBx2LlNdn9H4nJElLacW8REMobgK.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34643", "t": 2, "q": "断路器按照所采用的灭弧介质不同，可分为（     ）。", "a": ["<p>油断路器<\/p>", "<p>空气断路器<\/p>", "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/KoN99LodElEuOOA7PmN58UndGuf8hW3A2Vn1TVXw.png\"><\/p>", "<p>真空断路器<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/xwNxme9Oa4whJh22FwI6ziyA1H2TcjxL8pNZGfIV.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34644", "t": 2, "q": "以下断路器操动机构中属于储能机构的有（     ）。", "a": ["<p>电磁操动机构<\/p>", "<p>弹簧操动机构<\/p>", "<p>气动操动机构<\/p>", "<p>液压操动机构<\/p>", "", ""], "r": "BCD", "e": "【定位】第4章，第5节，知识点2：高压断路器\n【解析】断路器操动机构分为直动和储能两大类。（1）直动机构包括：手动操动机构、电磁操动机构；（2）储能机构包括：弹簧操动机构、气动操动机构、液压操动机构。选项A属于直动机构；选项BCD属于储能机构。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34645", "t": 2, "q": "断路器分闸速度的快慢，通常由断路器全开断时间来衡量，它包括（     ）。", "a": ["<p>燃弧时间<\/p>", "<p>固有分闸时间<\/p>", "<p>后备保护时间<\/p>", "<p>主保护动作时间<\/p>", "", ""], "r": "AB", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/jeBs6iBQ7jXtxdBEeDVVEjzDdt70PFBeVhcxkCvg.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34646", "t": 2, "q": "关于隔离开关的用途，下面说法中正确的是（     ）。", "a": ["<p>隔离电源与被检修设备，保证检修工作的安全<\/p>", "<p>接通或切断小电流回路<\/p>", "<p>一般只能在电路闭合的情况下才能操作<\/p>", "<p>和断路器配合进行倒闸操作<\/p>", "", ""], "r": "ABD", "e": "【定位】第4章，第5节，知识点2：高压断路器\n【解析】隔离开关主要功能为：（1）隔离电压。在检修电气设备时，用隔离开关将被检修的设备与电源电压隔离，以确保检修的安全；（2）倒闸操作。投入备用母线或旁路母线以及改变运行方式时，常用隔离开关配合断路器，协同操作完成；（3）隔离开关无灭弧装置，不能用于接通或断开负荷电流，更不能能用于切断短路电流，一般只能在电路断开的情况下才能进行操作。但可以分、合小电流回路（分合励磁电流不超过2A的空载变压器，关合电容电流不超过5A的空载线路）。选项ABD正确，选项C错误。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34647", "t": 2, "q": "关于对隔离开关的基本要求，下面说法正确的是（     ）。", "a": ["有明显的断开点", "断口应有足够可靠的绝缘强度", "具有足够的动、热稳定性", "隔离开关与断路器之间应具有连锁装置", "", ""], "r": "ABCD", "e": "【定位】第4章，第5节，知识点3：隔离开关\n【解析】对隔离开关的基本要求：（1）有明显的断开点，根据断开点可判明被检修的电气设备和载流导体是否与电网可靠隔离。（2）断口应有足够可靠的绝缘强度，断开后动、静触头间应有足够的电气距离。（3）具有足够的动、热稳定性，能承受短路电流所产生的发热和电动力。（4）结构简单，分、合闸动作灵活可靠。（5）隔离开关与断路器配合使用时，应具有机械的或电气的连锁装置，以保证断路器和隔离开关之间正常的操作顺序。（6）隔离开关带有接地开关时，主开关与接地开关之间也应设有机械的或电气的连锁装置，以保证二者之间的动作顺序。选项ABCD正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34648", "t": 2, "q": "影响电流互感器测量误差的因素有（     ）。", "a": ["<p>二次绕组内阻抗<\/p>", "<p>铁芯截面积<\/p>", "<p>磁路平均长度<\/p>", "<p>铁芯导磁率<\/p>", "", ""], "r": "ABCD", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/iJlOMM4lhbKdxDR9Lb5Nv1AImGbNWCAQnEDD8y3D.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34649", "t": 2, "q": "减小电流互感器误差的措施，正确的有（     ）。", "a": ["使一次实际电流接近一次额定电流", "减小二次绕组内阻抗", "尽量减小二次回路的负载", "增加功率因数", "", ""], "r": "ABC", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】减少电流互感的误差可以缩短磁路长度，减小铁芯的磁阻、增大磁导率还可以减少二次负荷。功率因数降低，电流误差增加，相位误差减小。所以选ABC。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34650", "t": 2, "q": "对于电流互感器的准确级，下面描述正确的是（     ）。", "a": ["<p>电流互感器的准确级以电流误差表示<\/p>", "<p>是规定运行工况下的最大电流误差<\/p>", "<p>准确级越高，误差越大<\/p>", "<p>准确级越高，精度越高<\/p>", "", ""], "r": "ABD", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】电流互感器的准确级的定义为：在规定的二次负荷变化范围内，一次电流为额定值时的最大电流误差。互感器准确度等级数字越小，准确级越高，测量误差越小（精确度越高）。根据上述。选项ABD正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34651", "t": 2, "q": "下面选项中，属于影响电压互感器误差的因素有（     ）。", "a": ["<p>互感器本身的构造及材料<\/p>", "<p>互感器运行时，二次负载电流的大小<\/p>", "<p>互感器运行时，二次负载的功率因数<\/p>", "<p>互感器运行时，一次侧电压大小<\/p>", "", ""], "r": "ABCD", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】影响电压互感器精度的因素分为两类，第一种因素为互感器自身构造及材料，包括绕组结构，漏磁情况以及铁芯材料，第二种因素为互感器的工作状态，包括一次电压、二次负荷电流和二次负荷的功率因素，因此ABCD选项全部为影响电压互感器误差的因素。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34652", "t": 2, "q": "电压互感器的选择中，需要注意（     ）。", "a": ["选择电压互感器的准确级要根据二次负荷的需要", "若二次负荷为电能计量，可采用0.5级电压互感器", "发电厂中功率表和电压继电器可配用1.0级", "一般的测量表计（如电压表）可配用3.0级", "", ""], "r": "ABCD", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】二次负荷为电能计量，最低配用1.0级，可采用0.5级，发电厂中功率表和电压继电器最低配用1.0级。一般的测量表计（如电压表）可用3.0级。所以选ABCD。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34653", "t": 2, "q": "火电厂的包括（     ）。", "a": ["燃烧系统", "汽水系统", "给水系统", "电气系统", "", ""], "r": "ABD", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】火电厂包括燃烧系统，汽水系统和电气系统。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34654", "t": 2, "q": "按输出能源不同，火电厂分为（     ）。", "a": ["<p>内燃机发电厂<\/p>", "<p>凝气式汽轮机火电厂<\/p>", "<p>燃气轮机发电厂<\/p>", "<p>热电厂<\/p>", "", ""], "r": "BD", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】按原动机分类：①凝汽式汽轮机发电厂；②燃气轮机发电厂；③内燃机发电厂；④蒸汽-燃气轮机发电厂。按输出能源分类：①凝汽式汽轮机发电厂；②热电厂。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34655", "t": 2, "q": "下列属于火力发电厂动力部分的是（     ）。", "a": ["锅炉、汽轮机动力部分", "磨煤、输煤部分", "发电机电能生产", "电力网输配电", "", ""], "r": "AB", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】火力发电厂动力部分包括锅炉、汽轮机、磨煤、输煤部分。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34656", "t": 2, "q": "火电厂电气系统包括（     ）。", "a": ["励磁系统", "发电机", "厂用电", "升压变压器", "", ""], "r": "ABCD", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】火电厂的电气系统包括发电机、励磁装置、厂用电系统和升压变电站。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34657", "t": 2, "q": "<p>生物质发电厂由（ ）发电。<\/p>", "a": ["<p>薪柴<\/p>", "<p>蔗渣<\/p>", "<p>树木<\/p>", "<p>木材<\/p>", "", ""], "r": "ABD", "e": "【定位】第4章，第1节，知识点6：新能源发电\n【解析】生物质能发电：生物质能是绿色植物通过叶绿素将太阳能转化为化学能而储存在生物质内部的能量 。生物质能发电厂的种类较多，规模大小受生物质能资源的制约，主要有：垃圾焚烧发电厂、沼气发电厂、木煤气发电厂、薪柴发电厂、蔗渣发电厂等。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34658", "t": 2, "q": "水电厂与其他类型的大电厂相比，具有（     ）特点。", "a": ["建设投资大、工期长", "发电厂成本相对较低", "发电效率高", "污染大", "", ""], "r": "ABC", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】水电厂需要修建大坝、水库等水利设施，前期建设投入资金多且施工周期较长，依托水能进行发电无需消耗煤炭、燃油等燃料，日常运行发电成本较低，水能发电能量转换环节少，发电效率高于火力发电厂，水电属于清洁能源，发电过程不会产生废气、废渣等污染物，不存在污染大的特点，因此ABC选项正确，D选项错误。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34659", "t": 2, "q": "抽水蓄能电厂在电力系统的作用是（     ）。", "a": ["调频", "调峰", "事故备用", "调相", "", ""], "r": "ABCD", "e": "【定位】第4章，第1节，知识点4：抽水蓄能电厂\n【解析】抽水蓄能电厂在电力系统中的作用：调峰；填谷；事故备用；调频；调相；黑启动；蓄能。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34660", "t": 2, "q": "属于可再生性能源的是（     ）。", "a": ["石油", "风能", "太阳能", "水能", "", ""], "r": "BCD", "e": "【定位】第4章，第1节，知识点6：新能源发电\n【解析】可再生能源包括太阳能、生物质能、风能、地热能、波浪能、洋流能和潮汐能等。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34661", "t": 2, "q": "保护电器用于过电流或短路电流防护和过电压防御，下列选项中属于保护电器的是（     ）。", "a": ["熔断器", "避雷器", "负荷开关", "分段器", "", ""], "r": "AB", "e": "【定位】第4章，第3节，知识点1：电气一次设备\n【解析】熔断器和避雷器都属于保护电器，CD属于开关电器，故选AB。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34662", "t": 2, "q": "二次设备是指对一次设备的工作进行（     ）以及为运行维护人员提供运行工况或生产指挥信号所需的低压电气设备。", "a": ["监测", "控制", "调节", "保护", "", ""], "r": "ABCD", "e": "【定位】第4章，第3节，知识点2：电气二次设备\n【解析】二次设备是指对一次设备的工作进行监测、控制、调节、保护以及为运行维护人员提供运行工况或生产指挥信号所需的低压电气设备，故选ABCD。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34663", "t": 2, "q": "下列选项中属于二次设备测量表计的是（     ）。", "a": ["电流表", "电压表", "功率表", "频率表", "", ""], "r": "ABCD", "e": "【定位】第4章，第3节，知识点2：电气二次设备\n【解析】测量表计用来监视、测量电路的电流、电压、功率、电能及设备的温度等，如电流表、电压表、功率表、电能表、频率表、温度表等，故选ABCD。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34664", "t": 2, "q": "电流互感器的接线方式有（     ）。", "a": ["<p>一相式接线<\/p>", "<p>三相完全星型接线<\/p>", "<p>两相电流差接线<\/p>", "<p>两相不完全星型接线<\/p>", "", ""], "r": "ABCD", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】电流互感器常见的接线方式有一相式接线、三相完全星型接线、两相电流差接线和两相不完全星型接线，故选ABCD。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34665", "t": 2, "q": "互感器是电力系统中提供（     ）用的重要设备。", "a": ["<p>测量<\/p>", "<p>保护<\/p>", "<p>监控<\/p>", "<p>操作<\/p>", "", ""], "r": "AB", "e": "【定位】第4章，第6节，知识点1：互感器概述\n【解析】互感器是电力系统中供测量和保护用的重要设备，分为电压互感器和电流互感器两大类。故选AB。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34666", "t": 2, "q": "下列选项中关于电流互感器不完全星型接线在运行中的描述正确的是（     ）。", "a": ["<p>不能反映所有的接地<\/p>", "<p>对相间故障反应灵敏<\/p>", "<p>单相接地故障可能不动作<\/p>", "<p>能够反应所有的故障<\/p>", "", ""], "r": "ABC", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】两相不完全星型接线能够反应各种相间故障，三相短路、两相短路，但如果在没装设电流互感器的一相发生单相接地故障时，保护装置将不动作，故选ABC。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34667", "t": 2, "q": "互感器可以与测量仪表相配合，对线路（     ）进行测量。", "a": ["<p>电压<\/p>", "<p>电流<\/p>", "<p>频率<\/p>", "<p>电能<\/p>", "", ""], "r": "AB", "e": "【定位】第4章，第6节，知识点1：互感器概述\n【解析】电压互感器和电流互感器与测量仪表相配合可以分别对线路的电压和电流进行测量，故选AB。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34668", "t": 3, "q": "热电厂同时向外供应电能和热能，其效率较低。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】难度：1。热力发电厂对厂外用户供热，简称热电厂，常建于寒冷地区。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34669", "t": 3, "q": "变电站是联系发电厂和用户的中间环节，起着生产、变换和分配电能的作用。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第2节，知识点1：变电站\n【解析】难度：1。变电站是电力系统中变换电压、接受和分配电能、控制电力的流向和调整电压的电气设施。在电力系统中变电站是输电和配电的集结点。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34670", "t": 3, "q": "铁的电阻率比铜大得多，且用于交流电路时，有很强的集肤效应。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "【定位】第4章，第4节，知识点1：裸导体\n【解析】铁的电阻率比铜大7倍多，导电性差的多；由于铁为铁磁材料，用在交流电路时，有很强的集肤效应。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34671", "t": 3, "q": "高压绝缘子应能在超过其额定电压10%的电压下可靠地运行。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第4节，知识点3：绝缘子\n【解析】高压绝缘子应能在超过其额定电压15%的电压下可靠地运行。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34672", "t": 3, "q": "支柱绝缘子和套管绝缘子应能承受负荷电流所产生的最大电动力，并具有一定裕度。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第4节，知识点3：绝缘子\n【解析】支柱绝缘子和套管绝缘子应能承受短路电流所产生的最大电动力，并具有一定裕度。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34673", "t": 3, "q": "真空断路器具有开断能力强、灭弧迅速，触头不易氧化，噪声低，寿命长等特点。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第5节，知识点2：高压断路器\n【解析】空气断路器在开断大、小电流时，外部供给的灭弧能量基本不变，因此其燃弧时间较稳定，具有大容量下开断能力强及开断时间短的特点。此外由于灭弧室没有空气，因此触头不易氧化、使用寿命长。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34674", "t": 3, "q": "六氟化硫断路器具有开断能力强、全开断时间长，断口开距小，噪声低，寿命长等特点。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/toFHTBalY59t2QQaHV61X2C2QqEaVOlWELk2kLf0.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34675", "t": 3, "q": "少油断路器中，油除了作为灭弧介质外，还作为触头断开后弧隙绝缘及带电部分与接地外壳之间的绝缘。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第5节，知识点2：高压断路器\n【解析】在少油断路器中，油主要作为灭弧介质及触头断开后弧隙绝缘，对地绝缘主要靠瓷介质。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34676", "t": 3, "q": "油断路器的灭弧能力与电弧电流有关，其燃弧时间随着开断电流减小而减小。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第5节，知识点2：高压断路器\n【解析】因为油断路器利用电弧本身的能量，将油加热，形成油蒸汽和大量气体所组成的高压气泡实现吹弧。所以油断路器的灭弧能力与电弧电流有关，其燃弧时间随着开断电流减小而增大。所以选B。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34677", "t": 3, "q": "高压负荷开关主要用来接通和断开负荷电流，但也可以断开短路电流。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第5节，知识点4：熔断器、负荷开关、高压接触器及重合器\n【解析】高压负荷开关只有简单的灭弧装置，可以用来接通和断开正常工作电流，但不能开断短路电流。与高压熔断器串联使用时，电路的接通和断开由负荷开关完成，短路电流由熔断器开断，其作用等同于高压断路器。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34678", "t": 3, "q": "磁力启动器主要用来远距离控制三相异步电动机，并具有过负荷和低电压保护功能。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第5节，知识点5：低压开关\n【解析】磁力启动器由三极交流接触器、热继电器和控制按钮组成，主要用来远距离控制三相异步电动机，并具有过负荷和低电压保护功能。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34679", "t": 3, "q": "自动空气开关又称低压断路器，不仅可以接通和断开正常负荷电流及过负荷电流，而且可以切断短路电流。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第5节，知识点5：低压开关\n【解析】自动空气开关（简称自动开关）又称低压断路器。它是低压开关中性能最完善的开关，不仅可以接通和切断正常负荷电流及过负荷电流，而且可以切断短路电流，常用在低压大功率电路的主控电器中。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34680", "t": 3, "q": "电流互感器将交流大电流变成小电流（5A或1A），供电给测量仪表和继电保护装置的电流线圈。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第6节，知识点1：互感器概述\n【解析】互感器的作用①电流互感器将交流大电流变成小电流（5A或1A），供电给测量仪表和保护装置的电流线圈；②实现高压一次系统和低压二次回路的电气隔离，保证二次设备和在二次回路上工作的人员的安全；③实现继电保护和自动装置小型化、标准化。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34681", "t": 3, "q": "电流互感器二次绕组短路，励磁磁动势骤增，铁芯的磁通和磁感应强度都相应增大，因而产生各种不良影响。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】二次绕组开路时，电流互感器由正常短路工作状态变为开路工作状态，励磁磁动势骤增，铁心中的磁通波形呈现严重饱和的平顶波，在二次绕组中产生幅值高达上万伏的尖顶波感应电动势，危及二次设备及在二次回路工作的人员安全，所以电流互感器运行中严禁开路。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34682", "t": 3, "q": "电流互感器的电流和相位误差都与激磁磁势及一次磁势有关。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第6节，知识点2：电磁式电流互感器\n【解析】电磁式电流互感器激磁磁势和一次磁势增大时，励磁磁通增大，磁路饱和，铁芯磁导率大幅减小，励磁电抗大幅减小，励磁电流增大，在一次电流不变的情况下，二次电流减小，电流误差和相位误差增大。所以电流互感器的电流和相位误差都与激磁磁势及一次磁势有关。说法正确。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34683", "t": 3, "q": "增大功率因数可减小电流互感器的相位差。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "B", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/aZQuejezV5DQGNDQO3UBlw4lBXgE2uxAjiavTtbb.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34684", "t": 3, "q": "电压互感器的测量误差由电压互感器激磁电流和内阻抗引起。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p><img src=\"https://dati.gwzpks.com/uploads/20260727/ZI2balc5YvQAwi1d0bvdnMZlXHWNbR0HGgBalIn1.png\"><\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34685", "t": 3, "q": "为了减小电压互感器的误差，可采用一次绕组减匝的匝数补偿法进行误差补偿，使相位差减小。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】为了减小电压互感器的误差，可采用一次绕组减匝的匝数补偿法进行误差补偿，使电压误差减小。但匝数补偿法不能改变相位差的大小。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34686", "t": 3, "q": "电压互感器的准确级是根据测量时电压误差的大小来划分的。（     ）", "a": ["<p>正确<\/p>", "<p>错误<\/p>", "", "", "", ""], "r": "A", "e": "<p>【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器 【解析】电压互感器的测量误差有电压误差(又称比值差或变比差)和相位差(又称角误差或相角差)，但是电压互感器的准确级只以电压误差（也就是大小的）定义。所以选A。<\/p>", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34687", "t": 3, "q": "电容式电压互感器的误差特性和暂态特性比电磁式电压互感器差，但输出容量较大。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】电容式电压互感器误差特性和暂态特性比电磁式电压互感器差，输出容量较小。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34688", "t": 3, "q": "10kV系统中，单相式电压互感器采用单相接线接于相和地之间时，其一次绕组的额定电压为10kV。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第6节，知识点3：电磁式和电容分压式电压互感器\n【解析】单相式电压互感器采用单相接线接于相和地之间时，其一次绕组的额定电压为相电压，10kV为线电压。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34689", "t": 3, "q": "传统火力发电厂对环境污染严重，核能、太阳能、风能发电的生产过程不向环境排放污染气体，是理想的清洁能源。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点2：火力发电厂\n【解析】核能、太阳能、风能发电属于清洁能源。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34690", "t": 3, "q": "发电厂是把一次能源转变为电能的工厂。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点1：发电厂及其分类\n【解析】一次能源是指从自然界直接获取、未经人为加工转换的能源，例如煤炭、水能、风能、太阳能、核能等。发电厂的工作原理就是将各类一次能源先转化为机械能、热能等中间形式的能量，最终统一转换为电能向外输送，而电能属于经过加工转换得到的二次能源。因此发电厂本质上就是将一次能源转换为电能的能源转换工厂，题干表述正确，本题选A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34691", "t": 3, "q": "发电厂的直流发电机和交流发电机都是属于一次设备。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "【定位】第4章，第3节，知识点1：电气一次设备\n【解析】交流发电机是把机械能转化为电能的设备，是一次设备；直流发电机是继保系统电源，是二次设备。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34692", "t": 3, "q": "水电机组的发电量要受到季节变化和气象条件影响。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】水电机组依靠河流来水推动水轮机旋转发电，来水量直接决定水电站可利用的发电水头与发电流量。汛期降水充沛、河流径流量大，水电站可满发甚至多发；枯水季降雨少、来水不足，发电量就会大幅受限。同时干旱、暴雨、冰雪融水等各类气象条件也会直接改变流域来水量，因此水电机组发电量会明显受季节变化和气象条件制约，题干说法正确，本题选A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34693", "t": 3, "q": "相比火电厂，水电厂发电成本低，效率高。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】火电厂发电需要持续消耗煤炭、天然气等化石燃料，燃料采购、运输成本较高，同时设备运维、环保脱硫脱硝等投入大；而水电厂利用水能发电，不需要消耗燃料，仅产生机组日常运维、水库管理等少量成本，整体发电成本远低于火电厂。在能量转换效率方面，水电机组能量损耗小，发电效率通常高于火电机组。因此水电厂相比火电厂具备发电成本低、效率高的特点，题干表述正确，本题选A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "34694", "t": 3, "q": "水电厂的能量生产过程是：水的位能→机械能→电能。（     ）", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "【定位】第4章，第1节，知识点3：水力发电厂\n【解析】高处水库中的水体具备重力位能，打开闸门后，水流从高处向下流动，将水的位能转化为水流的动能，冲击水轮机叶片旋转，此时水能转化为水轮机旋转的机械能；水轮机带动同轴的发电机转子转动，通过电磁感应原理，将机械能最终转换为电能向外输送。因此水电厂能量转化过程为：水的位能→机械能→电能，题干描述正确，本题选A。", "l3": "电力系统基础", "l4": "第4章", "ap": [false, false, false, false, false, false]}, {"id": "
