<script>
const DATA = {"id": "mock-15684941", "name": "珞研27单科卷-南网其他理工-行测", "chapters": [{"k": "行测", "n": "行测（40 题）", "qs": [{"id": "18caf63e299a13e8xcpdsc779347", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">转基因作物同普通植物的区别只是多了能使它产生额外特征的基因。早在<\/font>l983<font face=\"宋体\">年，生物学家就已经知道怎样通过生物工程技术将外来基因移植到某种植物的脱氧核糖核酸中去，以便使它产生靠杂交方式根本无法获得的某种新的特性：抗除莠剂的特性、抗植物病毒的特性、抗某种害虫的特性等。用以移植的基因可来自任何生命体：细菌、病毒、昆虫等。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">根据文义，对<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">转基因作物<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">理解正确的一项是：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">因环境影响脱氧核糖核酸的变化而产生额外特性的作物<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">能够产生抗莠剂、抗植物病毒等额外基因的作物<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">一种利用移植其他生命体基因而形成的新的杂交作物<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">移植了其他生命体基因从而产生额外特性的作物<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>D<font face=\"宋体\">【解析】由<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">通过生物工程技术将外来基因移植到某种植物的脱氧核糖核酸中去<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">可知，<\/font>A<font face=\"宋体\">项<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">因环境影响<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">错误，排除。由<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">生物学家就已经知道怎样通过生物工程技术将外来基因移植到某种植物的脱氧核糖核酸中去<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">……<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">获得某种新的特性<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">可知，转基因作物是通过移植其他生命体的基因而产生新特性，并不是其自身会产生额外特性，且<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">抗莠剂<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">表述错误，文段为<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">抗除莠剂<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">，<\/font>B<font face=\"宋体\">项错误，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项正确。由<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以便使它产生靠杂交方式根本无法获得的某种新的特性<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">可知，转基因作物并非杂交作物，<\/font>C<font face=\"宋体\">项错误。故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf63e295d0ae8atsc967505", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">2.4<font face=\"宋体\">，<\/font><font face=\"Times New Roman\">1.3<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">3.12<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">7.35<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">9.54<\/font><font face=\"宋体\">，<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><i><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\">\n <\/i>", "a": ["<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">A.5.25<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">B.6.42<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">C.12.24<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">D.15.45<span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:'Times New Roman';\nfont-size:11.0000pt;\"><p>【答案】B【解析】整数X倍数=小数部分规律。2X2=4,1X3=3,3X4=12,7X5=35,9X6=54(倍数为连续自然数)，下一个倍数为7，选项中6X7=42符合整数X倍数小数\"特征，对应6.42。<\/p>", "l3": "行测", "l4": "数字推理"}, {"id": "18caf63e299a13e9xcyjsc450016", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">政治转型的一条规律是：一个国家启动现代政治经济转型之时，如果同时面临的转型任务数量越多，转型就越容易遭到挫败。<\/font><u><span style=\"font-family:宋体;text-decoration:underline;\r\ntext-underline:single;font-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">牵引<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">意为引起、拉动，置于此处体现经济体制改革的外在推动作用，当选。<\/font>D<font face=\"宋体\">项<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">导向<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">是指所引导的方向，制度本身并非起到导向作用，排除。故正确答案为<\/font>C<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑填空"}, {"id": "18caf63e299a13e9xcpdsc122174", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">教育上有一个传统，就是在课程设计中把科学与文学、历史对立起来。这种对立是容易从历史上来解释的。在实验科学以前，文学、语言和哲学已经在所有高等学校占领了牢固的地位，实验科学自然必须奋力前进。没有一个筑有堡垒的和坚固的势力集团会轻易放弃它可能占有的垄断地位。但是，无论哪一方面，都认为语言和文学全部是人文主义性质的，而科学则纯粹是属于自然界的。这是一个错误的观念。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">接下来最可能要讲的是：（）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">文学、历史在高等学校的传统地位<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">实验科学是如何迅猛发展起来的<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">人文学科的垄断地位是如何被打破的<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">将科学与人文对立为什么是不应该的<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】文段尾句提到，语言和文学全部是人文主义性质的，科学纯粹是属于自然界的这种观念是错误的，按照话题一致原则，下文应承接尾句论述，即讨论为什么这一观念是错误的，<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项与此相符。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项“文学、历史在高等学校的传统地位”为已有信息，排除。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项内容与尾句无关，排除。故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf63e297b8f69xctxsc322272", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性（）。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"230\" height=\"252\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档2839.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont- ace=\"宋体\">三项整体顺时针旋转<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">90<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">°<\/font><font face=\"宋体\">后最左边都有一条竖线，排除。故正确答案为<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e297b8f69xctxsc830892", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定的规律性（）。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"403\" height=\"179\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档3142.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/font><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">元素组成相同，优先考虑位置规律。观察发现，题干图形的不同线条各自有其运动规律，给各线条标记序号，如下图所示：<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"383\" height=\"174\" src=\"https://idapic.luoyanedu.com/tiku/20260414180859_oru/5图形推理-答案文档4635.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">本题隐藏了线条移动的正方形的路径，<\/font><font face=\"Times New Roman\">①②③⑥<\/font><font face=\"宋体\">号线沿着隐藏的正方形路径顺时针移动，每次移动一个位置（正方形边长的一半），<\/font><font face=\"Times New Roman\">④⑤<\/font><font face=\"宋体\">号线在隐藏的正方形路径内部进行旋转，以隐藏的正方形的中心为中心，<\/font><font face=\"Times New Roman\">⑤<\/font><font face=\"宋体\">号线每次逆时针旋转<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">90<\/font><font face=\"宋体\">度<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">④<\/font><font face=\"宋体\">号线每次顺时针旋转<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">45<\/font><font face=\"宋体\">度<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">，只有<\/font>A<font face=\"宋体\">项符合。故正确答案为<\/font><font face=\"Times New Roman\">A<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf63e299a13e8xcpdsc130768", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">大脑中有许多不同类型的细胞，例如传递信号的神经元和支持神经功能的神经胶质细胞。尽管所有这些细胞都包含相同的基因组，但不同类型的细胞表达这些基因的方式不同。通俗来说，人们可以将基因组想象成钢琴上的<\/font>88<font face=\"宋体\">个键，每个细胞使用的都并非全部琴键，因此每个细胞<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">弹奏<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">的那部分琴键决定了细胞的类型下丘脑是包括人类在内的所有脊椎动物大脑的基本区域。研究表明，下丘脑内一个特定的区域腹膜下丘脑的腹侧部分，包含控制侵略行为的细胞。在这些研究中，即使在没有任何威胁的情况下，对雄性和雌性小鼠脑中这些神经元进行强刺激，都会使它们立即变得具有攻击性。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">这段文字主要讲的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">人类下丘脑包含控制侵略的细胞<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">不同的大脑细胞类型具有特定的功能<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">细胞的类型是由多种因素共同决定的<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">不同类型的脑细胞有其特有的基因表达方式<\/font><span style 勃的魅力<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑤<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">哲学发端于人类对事物本质永不停歇的探求和追问，既不满足于表象的感知，也不停留在经验层面，总是追问现象之后的本质、偶然之中的必然<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑥<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">哲学魅力还表现在它的反思和批判功能上<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">将以上<\/font>6<font face=\"宋体\">个句子重新排列，语序正确的是（ <\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">&nbsp;&nbsp;<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">）。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑤②①⑥③④<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑤③⑥④②①<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">②⑤③①⑥④<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">②③⑤⑥④①<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibr ;\"><font face=\"宋体\">……<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">最终产生<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">……”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">可知，<\/font>A<font face=\"宋体\">项正确。由<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">当空气中的现有电子和水分子碰撞时，释放出更多的电子，研究者将其称之为高能量微粒的雪暴，最终产生一次<\/font><font face=\"Times New Roman\">‘<\/font><font face=\"宋体\">逃逸崩溃<\/font><font face=\"Times New Roman\">’<\/font><font face=\"宋体\">，这种放电过程就是人们所认为的闪电<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">可知，<\/font>B<font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项正确。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项无中生有，文中未提到云朵碰撞。故本题选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf63e297b8f68xcljsc450016", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">脑电波在深度睡眠的时候是最慢的，在人清醒放松的时候则会加快。最快的脑电波被称为伽马波，频率为<\/font><font face=\"Times New Roman\">40<\/font><font face=\"宋体\">赫兹，当我们集中注意力，做决定或者使用记忆时以这种脑电波为主。阿尔茨海默病患者通常会产生较少的伽马波，这促使研究人员尝试诱导这种类型的波。近日有实验表明，听低音噪声确实可以诱发伽马波，因此研究人员认为这一方法能有效治疗阿尔茨海默病。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能支持上述结论？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">一些患者在实行该低音疗法时虽然加快了脑电波的传导，但产生了头晕、心慌等一系列不良反应<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">研究发现，日照疗法的效果比低音疗法更显著，它可促进大脑产生免疫细胞，帮助分解患者脑部沉积的物质<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">实验发现，该低音疗法使海马体内沉积的淀粉样蛋白斑块减少，而该蛋白是阿尔茨海默病的一个关键特征<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">该低音疗法中，不同频率的声音对脑部的影响不同，只有接近<\/font><font face=\"Times New Roman\">40<\/font><font face=\"宋体\">赫兹的频率才会影响到起记忆作用的海马体<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">【解析】题干的结论：听低音噪声能有效治疗阿尔茨海默病。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项，指出低音疗法的不良反应，不能支持题干结论；<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项，日照疗法效果比低音疗法更显著，不能支持题干结论；<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项，低音疗法使阿尔茨海默病的关键特征——蛋白斑块减少，直接支持了结论；<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项，指出低音疗法中不同频率对脑部的影响，是无关项，不能支持结论。故本题选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e297b8f68xcljsc767375", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">经研究发现，如果在怀孕期间母亲食用化学添加剂过多，那么出生的婴儿在智力上可能会有缺陷。因为妇女在怀孕后不久，胚胎的大脑开始发育，孕期是大脑发育的关键时期，食用化学添加剂过多的孕妇，体内正在发育的胚胎的大脑周围环境可能会被改变。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能支持研究人员的观点？<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">接触化学添加剂过多的孕妇，婴儿早产率较高<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">化学添加剂暗含许多潜在威胁，它导致癌症、肾衰竭等多种疾病频发<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">此前的研究已经发现，过多的食用化学添加剂会导致孕妇的甲状腺出现问题，而孕妇的甲状腺状况会影响胎儿的智力发育<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">研究人员对<\/font><font face=\"Times New Roman\">1500<\/font><font face=\"宋体\">个孕妇进行了跟踪调查，发现较多地接触化学添加剂的孕妇所生育的孩子在数学和语言学科上表现显著较差<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">【解析】研究人员的观点是：如果在怀孕期间母亲食用化学添加剂过多，那么出生的婴儿在智力上可能会有缺陷。得出这个观点的依据是：食用化学添加剂过多会改变胚胎大脑周围的环境。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项说明过多食用化学添加剂会导致孕妇甲状腺出现问题，从而影响胎儿的智力发育，加强了研究人员的观点。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项的“婴儿早产率较高”、<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项的“癌症、肾衰竭等多种疾病”和<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项的“数学和语言学科上表现显著较差”都不能说明智力较差，因此不能加强研究人员的观点。故答案选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e298ad1aaxcxcsc157457", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">经过高尔顿、宾尼特、戈达德等人百年来的<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">不懈努力<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">，终于将智商测试<\/font><u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;text-decoration:underline;text-underline:single;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;&nbsp;<\/u><u><span style=\"font-family:宋体;line-height:150%;\r\ntext-decoration:underline;text-underline:single;font-size:10.5000pt;\">&nbsp;&nbsp;<\/u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">成一门<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">科学<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">，并得到了社会的普遍认同，于是智商测试实际上就成为又一个相对<\/font><font face=\"Times New Roman\">“<\/font><u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;text-decoration:underline;text-underline:single;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;&nbsp;<\/u><u><span style=\"font-family:宋体;line-height:150%;\r\ntext-decoration:underline;text-underline:single;font-size:10.5000pt;\">&nbsp;&nbsp;<\/u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font- font face=\"Times New Roman\">11=34<\/font><font face=\"宋体\">；原数列下一项<\/font><font face=\"Times New Roman\">:47+34=81<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "数字推理"}, {"id": "18caf63e297b8f68xcljsc325181", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">在我们这个高速发展的社会，拆迁和建设的速度早已超出了人们的想象。而城市的发展总是伴随着城市的拆迁和建设，因此，有人认为，城市的发展是导致城市拆迁和建设的根本原因。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能削弱上述结论：<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">很少进行拆迁和建设的城市，往往都会发展得比较缓慢<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">除城市发展外，工业化也是导致城市拆迁和建设的原因<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">城市的发展过程必然会带来了很多正面的和负面的影响<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">经济发展水平的提高，促进城市发展，带动城市的拆迁和建设<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】题干论据：城市的发展总是伴随着城市的拆迁和建设。结论：城市的发展是导致城市拆迁和建设的根本原因。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项，指出很少拆迁和建设的城市，发展比较缓慢，从反面说明城市发展与城市拆迁和建设之间确实有伴随的关系，但是并没有说明城市发展与城市拆迁和建设之间是否具有因果关系，也不能确定城市的发展是否是导致城市拆迁和建设的根本原因，不能削弱题干结论，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项，指出工业化也是导致城市拆迁和建设的原因，但不能说明城市发展不是根本原因，不能削弱题干结论，排除。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项，指出城市发展会带来正面和负面的影响，但影响是否包括城市拆迁和建设不能确定，不能确定城市的发展是否是导致城市拆迁和建设的根本原因，不能削弱题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项，指出城市发展与城市拆迁和建设都是经济发展水平提高带来的结果，说明经济发展水平的提高才是城市拆迁和建设的根本原因，削弱了题干结论。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">故答案选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e298ad1a8xclbsc049852", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">（）对于蓝牙耳机相当于电话对于（）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">手机无线电话<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">喇叭移动电话<\/font><span style=\"font-family:'T 区域具有更强的反应，在这些区域中有更密集的细胞组织。这些发现似乎印证了一个观点：一般情况下，女性比男性更擅长认人。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能削弱上述观点？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">参加实验的男性平均年龄为<\/font><font face=\"Times New Roman\">30<\/font><font face=\"宋体\">岁，高出女性平均年龄<\/font><font face=\"Times New Roman\">2<\/font><font face=\"宋体\">岁<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">一般来说，女性更注重细节，因此对于人的面孔的特征，女性观察得更为细致<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">男性在识别人的面孔时速度较慢，但在时间充足的情况下有更准确的识别率<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">在一些类似刑侦的特殊职业中，男性与女性在识别面孔的表现中没有显著差别<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】题干观点是，一般情况下，女性比男性更擅长认人。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项仅说明参加实验的男性平均年龄高于女性，并没有体现年龄和擅长认人之间的关系，无法削弱题干观点；<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项说明女性比男性在观察人的面孔时更为细致，一定程度上支持了题干观点；<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项说明男性比女性的识别率更准确，只不过速度较慢，直接质疑了题干观点；<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项属于特殊现象，削弱力度有限，不如<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。故本题选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf63e298ad1aaxcxcsc560221", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">历史上有很多大规模<\/font><u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;text-decoration:underline;text-underline:single;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;<\/u><u><span style=\"font-family:宋体;line-height:150%;\r\ntext-decoration:underline;text-underline:single;font-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;&nbsp;<\/u><u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;text-decoration:underline;text-underline:single;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;<\/u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">创新的实例，最突出的就是<\/font>19<font face=\"宋体\">世纪初的卢德运动。该运动的参与者认为创新减少了对低技术工人的需求，降低了他们的工资，增加了高技术工人的工资，加剧了社会不平等。此时，社会福利是否提高取决于如何<\/font><u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;text-decoration:underline;text-underline:single;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;<\/u><u><span style=\"font-family:宋体;line-height:150%;\r\ntext-decoration:underline;text-underline:single;font-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;&nbsp;<\/u><u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;text-decoration:underline;text-underline:single;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;<\/u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">相对富裕者的收益和相对贫穷者的损失。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">依次填入画横线部分最恰当的一项是<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（）<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">A.<\/font><span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">抵制<\/font> <span style=\"font-family:'Times New Roman';font-size:12.0000pt;\">&nbsp;&nbsp;<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">权衡<\/font><span style=\"font-family:'Times New Roman';font-size:12.0000pt;\">", "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">B.<\/font><span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">攻击<\/font> <span style=\"font-family:'Times New Roman';font-size:12.0000pt;\">&nbsp;&nbsp;<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><font face=\"Times New Roman\">评价<\/font><span style=\"font-family:'Times New Roman';font-size:12.0000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">抗议 <\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">&nbsp;&nbsp;<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">判断<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><span style=\"font-family:'Times New Roman';\r\nline-height ze:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">对比不同时期政府的舆论宣传环境与工作方式<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">剖析政府执政的舆论压力不断增大的外在原因<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">分析通信技术发展与舆论环境变化之间的关系<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】文段第一句告诉我们通信技术对政府的影响，第二句得出结论政府需要如何去做，结论为对策，表达出作者对这件事情的观点，所以重点为果，即政府需要改变以往的被动方式，同义转述答案选择<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
</html>
