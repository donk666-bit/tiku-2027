能量转换过程中主要的损耗点，升降驱动系统在储能和释能时直接参与能量转换，其损耗对能量转换效率影响最大。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159839", "t": 1, "q": "重力储能系统的能量输出功率计算公式为P=mgv（m为介质质量，g为重力加速度，v为介质升降速度），若要提高输出功率，在不改变m和g的前提下，最有效的方式是?", "a": ["减少介质的升降次数", "降低介质的摩擦系数", "提高介质的升降速度", "增大介质的升降高度", "", ""], "r": "C", "e": "根据公式P = mgv，在不改变m和g时，要提高输出功率P，就需提高v（介质升降速度）。A选项减少升降次数与功率无关；B选项降低摩擦系数不一定能直接提高速度；D选项增大升降高度也不直接影响速度。所以最有效方式是提高介质的升降速度，答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159840", "t": 1, "q": "重力储能系统的整体能量转换效率，主要受限于哪个环节?", "a": ["储能系统的运行时长", "机械传动系统的效率", "重物的重量", "重物的提升高度", "", ""], "r": "B", "e": "重力储能靠机械传动提升和下落重物实现能量转换，机械传动系统效率会直接影响整体能量转换效率。运行时长、重物重量和提升高度并非能量转换效率的主要限制因素。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159841", "t": 1, "q": "重力储能系统选址时，以下哪种地理条件最有利于降低系统的建设成本与运行能耗（从系统结构与能量转换分析）", "a": ["地形高差大，且场地平整度高", "土壤承载力强，且附近有煤矿资源", "地形坡度大，且附近有稳定水源", "海拔高度高，且风速较小", "", ""], "r": "A", "e": "重力储能主要是利用重力势能和其他能量的转换，需要有较大的高度差来存储和释放能量，同时场地平整利于建设设备。A选项地形高差大利于重力势能转换，场地平整度高便于建设，能降低建设成本与运行能耗。B选项煤矿资源与重力储能无关；C选项稳定水源对重力储能并非关键因素；D选项海拔高和风速小对重力储能意义不大。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159842", "t": 1, "q": "重力储能系统中，采用\"固体介质（如混凝土块）+竖井\"结构相比\"液体介质（如水）+水库\"结构，最主要的优势是?", "a": ["充放电效率更高", "建设成本更低", "选址限制更小", "储能容量更大", "", ""], "r": "C", "e": "“固体介质+竖井”结构不依赖大型水库，对地理条件要求没那么苛刻，选址限制更小；而充放电效率、建设成本、储能容量并非其相比“液体介质+水库”结构的最主要优势。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159843", "t": 1, "q": "重力储能系统中，驱动重物升降的核心动力装置是?", "a": ["内燃机", "汽轮机", "电动机", "水轮机", "", ""], "r": "C", "e": "重力储能系统是利用电动机将重物提升存储能量，释放能量时重物下降带动发电机发电，所以驱动重物升降的核心动力装置是电动机。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159844", "t": 1, "q": "重力储能系统中，选择重物材质时最优先考虑的性能参数是?", "a": ["材料的密度", "材料的成本", "材料的硬度", "材料的韧性", "", ""], "r": "A", "e": "重力储能依靠重物高度变化实现能量转化，相同体积下，密度越大的重物质量越大，重力势能也越大，能存储更多能量，所以最优先考虑密度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159845", "t": 1, "q": "重力储能系统中，以\"重物-导轨\"式结构为例，若重物质量和提升高度固定，以下哪项因素会导致系统实际释放的电能比理论计算值显著降低（从能量损耗路径分析）?", "a": ["导轨表面的摩擦系数增大", "提升电机的功率等级不足", "储能过程的时间延长", "重物的形状不规则", "", ""], "r": "A", "e": "从能量损耗路径看，导轨表面摩擦系数增大，会使重物提升和下落过程中克服摩擦力做功增多，消耗更多能量，导致系统实际释放电能比理论值显著降低。B选项功率等级不足影响提升速度；C选项储能时间延长不直接造成能量损耗；D选项重物形状不规则不一定会显著增加能量损耗。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159846", "t": 1, "q": "重力储能中的\"液态金属重力储能\"相比\"固体块体重力储能\"，最主要的优势是?", "a": ["升降速度更快，功率密度更高", "储能介质的密度更大，单位体积储能更多", "储能介质无磨损，维护成本更低", "建设周期更短，成本更低", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023808", "t": 2, "q": "空气压缩储能系统的运行特性具有以下哪些特点（　）?", "a": ["依赖特定地理条件（如地下盐穴）", "适合大容量（100MW以上）储能场景", "功率密度远低于电化学储能", "启动响应时间较长（分钟级）", "", ""], "r": "ABCD", "e": "传统压缩空气储能常利用盐穴等地下空间，适合百兆瓦级大容量场景；功率密度比电池储能低，机组启停为分钟级别，响应速度较慢。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023809", "t": 2, "q": "空气压缩储能系统中，\"储热子系统\"的作用包括哪些?", "a": ["调节储气库的压力，稳定系统输出", "稳定系统的运行温度，保护设备", "储存多余的电能，提高系统储能容量", "在膨胀过程中释放热量，提高膨胀机的进气温度和做功能力", "", ""], "r": "BD", "e": "答案：BD空气压缩储能系统中，储热子系统主要作用是稳定系统的运行温度，保护设备（B 选项），同时在膨胀过程中释放热量，提高膨胀机的进气温度和做功能力（D 选项）。A 选项调节储气库压力稳定系统输出不是储热子系统的主要作用；C 选项储存多余电能提高储能容量也不是储热子系统的功能，而是整个储能系统的目标之一。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023810", "t": 2, "q": "空气压缩储能系统中，\"等温压缩\"技术实现的难点有哪些?", "a": ["系统结构复杂，成本高", "低温环境下难以维持等温过程", "需高效的热交换设备，实时带走压缩热", "压缩速度需缓慢，影响系统功率密度", "", ""], "r": "ACD", "e": "等温压缩要维持温度恒定，需高效热交换设备实时带走压缩热，且压缩速度慢影响功率密度，同时系统结构复杂成本高。低温环境不是实现等温压缩的主要难点。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023811", "t": 2, "q": "空气压缩储能系统中，\"无储气库型空气压缩储能\"的特点有哪些?", "a": ["适合与可再生能源（如风电）直接耦合", "能量转换效率高于有储气库型系统", "无需建设大型储气库，选址更灵活", "系统响应速度快，适合短时储能需求", "", ""], "r": "ACD", "e": "无储气库型空气压缩储能不用建大型储气库，选址限制小更灵活；它适合和可再生能源耦合，响应快适合短时储能，但能量转换效率通常低于有储气库型系统。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023812", "t": 2, "q": "空气压缩储能系统中，为实现能量的高效回收与利用，系统中需包含的关键热管理部件有（多选，从热量产生与回收路径分析）", "a": ["压缩机出口的冷却器", "空气储罐的保温层", "膨胀机进口的加热器", "蓄热装置（如高温蓄热器、低温蓄热器）", "", ""], "r": "ACD", "e": "空气压缩储能系统涉及能量的转换和存储，在这个过程中，有效的热管理是至关重要的。为了实现能量的高效回收与利用，系统需要能够妥善处理热量产生与回收的各个环节。A选项提到的压缩机出口的冷却器，能够在压缩过程中及时散热，防止系统过热，同时回收部分热能，这是热管理的重要一环。B选项中的空气储罐保温层，虽然对保温有一定作用，但它不直接参与热量的回收与再利用过程，更多的是维持系统温度稳定，而非高效回收与利用热量的关键部件。C选项的膨胀机进口加热器，可以在膨胀过程中提高效率，通过预热进入膨胀机的空气，增加能量转换效率，这也是热管理中的一个关键环节。D选项的蓄热装置，能够存储在压缩过程中产生的多余热量，并在需要时释放，以实现能量的高效回收与利用。综上所述，关键热管理部件包括压缩机出口的冷却器、膨胀机进口的加热器和蓄热装置，因此正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023813", "t": 2, "q": "空气压缩储能系统中，影响系统整体能量转换效率的主要子系统有哪些?", "a": ["储气库子系统", "控制系统子系统", "压缩机组子系统", "储热/回热子系统", "", ""], "r": "ACD", "e": "压缩机组子系统将电能转化为空气内能，其效率影响整体能量转换；储热/回热子系统能减少能量损失，对效率影响大；储气库子系统存储空气，影响能量存储与释放效率。控制系统子系统主要负责控制运行，非影响能量转换效率的主要因素。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023814", "t": 2, "q": "锂离子电池的电极材料性能对电化学储能系统的整体性能有重要影响，以下哪些参数属于正极材料需重点关注的性能指标（多选，从电池充放电与寿命角度）?", "a": ["电子电导率", "循环稳定性", "析锂电位", "离子扩散系数", "", ""], "r": "ABD", "e": "从电池充放电与寿命角度，电子电导率影响电池充放电时电子传输，离子扩散系数影响离子传输，二者对充放电性能重要；循环稳定性直接关系电池寿命；析锂电位主要与负极析锂相关，不是正极重点关注指标。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023815", "t": 2, "q": "耦合储能系统（如飞轮+电化学）在电网调频应用中，其协同运行的优势体现在（多选，从调频需求与子系统特性角度）", "a": ["电化学储能容量大，可持续补偿低频波动", "二者结合提升系统的储能密度", "二者结合提升系统的可靠性（互为备用）", "飞轮响应快，可快速补偿高频波动", "", ""], "r": "ACD", "e": "从调频需求与子系统特性看，电化学储能容量大适合补偿低频波动，飞轮响应快能快速补偿高频波动，且二者结合可互为备用提升系统可靠性。而储能密度与协同运行优势在调频应用中关联不大。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023816", "t": 2, "q": "耦合储能系统的\"容量配置\"需考虑的因素有哪些?", "a": ["电网的安全稳定约束（如备用容量要求）", "各储能单元的技术参数（如容量、功率、效率）", "电网的负荷需求特性（如峰谷差、波动频率）", "系统的投资成本和收益目标", "", ""], "r": "ABCD", "e": "耦合储能系统容量配置要综合多方面考量。电网安全稳定运行需满足备用容量等约束，A是要考虑的；各储能单元技术参数决定其性能，影响配置，B需考虑；电网负荷需求特性不同，对储能容量要求不同，C要考虑；投资成本和收益目标会限制和引导容量的选择，D也需考虑。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023817", "t": 2, "q": "耦合储能系统的\"运行控制策略\"中，\"经济优化控制\"需考虑的因素有哪些?", "a": ["可再生能源（如风、光）的出力预测", "电网的安全约束（如电压、频率限值）", "各储能单元的剩余寿命（避免过度充放电）", "各储能单元的充放电成本（如电化学储能的度电成本）", "", ""], "r": "ACD", "e": "耦合储能系统的“运行控制策略”中的“经济优化控制”主要是为了在保证系统运行的同时，实现成本的最小化。我们逐项看待每个因素：A. 可再生能源的出力预测对于经济优化是重要的，因为它能帮助系统更准确地预知能源供应，从而做出更合理的调度和储能决策。B. 电网的安全约束是任何电力系统运行都必须考虑的基本因素，但它更多是从安全角度而非经济角度出发。C. 考虑各储能单元的剩余寿命是为了避免过度充放电导致的设备损坏，这间接关系到系统的经济性，因为设备的维修或更换都会产生成本。D. 各储能单元的充放电成本直接关系到经济优化，因为降低成本是经济优化的核心目标。综上所述，A、C、D三个选项都是“经济优化控制”需考虑的因素，而B选项虽然重要，但更多是从安全角度考虑，不直接属于“经济优化控制”的考虑因素。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023818", "t": 2, "q": "耦合储能系统的控制策略设计，需重点考虑的输入因素有（　）?", "a": ["储能单元的充放电效率与成本", "风、光等可再生能源的出力预测数据", "当地的环境温度与湿度", "各储能单元的当前剩余容量（SOC）", "", ""], "r": "ABD", "e": "耦合储能控制策略需要输入储能单元充放电效率、运行成本，风光出力预测，各储能 SOC；温湿度属于环境条件，不属于控制策略重点输入因素。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023819", "t": 2, "q": "耦合储能系统的控制策略设计中，需考虑的关键因素有（多选，从系统协调与电网需求角度）", "a": ["各子系统的运行成本差异", "各子系统的储能容量与功率等级匹配", "系统的故障冗余与备用能力", "电网的负荷特性与调度指令", "", ""], "r": "ABCD", "e": "A 正确：各子系统运行成本差异，系统协调控制时要做经济优化，优先调用低成本储能，实现整体经济运行。<br />B 正确：容量、功率等级匹配是耦合储能内部协调的基础，避免某一子系统过载、利用率过低，保障功率分配合理。<br />C 正确：故障冗余、备用能力属于系统协调层面，控制策略需要考虑故障工况下的切换、备用支撑，提升系统可靠性。<br />D 正确：电网负荷特性、调度指令属于电网侧需求，是耦合储能控制策略的外部输入，储能要响应调峰、调频等电网调度要求。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023820", "t": 2, "q": "耦合储能系统设计阶段，需重点考虑的关键因素包括（　）?", "a": ["运行过程中的控制策略协调性", "不同储能技术的成本与效率平衡", "系统的可靠性和安全性", "系统对不同能源输入的适应性", "", ""], "r": "ABCD", "e": "耦合储能系统设计要兼顾多储能间控制协调、各类储能成本效率权衡、安全可靠运行，同时还要适配多种能源输入工况。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023821", "t": 2, "q": "耦合储能系统相比单一储能系统，具有的优势有（　）?", "a": ["显著降低系统的初始投资成本", "提高能源利用效率，实现优势互补", "降低对单一储能技术的依赖风险", "提高系统运行的稳定性和可靠性", "", ""], "r": "BCD", "e": "耦合储能系统结合多种储能技术，能发挥不同储能技术的优势，实现优势互补，提高能源利用效率；可降低对单一储能技术依赖，减少风险；还能提升系统运行的稳定性和可靠性，但初始投资成本通常不会显著降低。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023822", "t": 2, "q": "耦合储能系统中，并联型耦合的适用场景有哪些?", "a": ["需要多个储能单元同时为负载供电（如微电网）", "需要简化系统控制逻辑，降低运维难度", "某一储能单元故障时，其他单元可接替运行，提高系统可靠性", "需要提高系统的总储能容量和总功率", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023823", "t": 2, "q": "耦合储能系统中，\"混合储能系统（如电化学+飞轮）\"用于电网调频的优势有哪些?", "a": ["飞轮响应快，可快速补偿短时功率波动", "两者协同可降低单个储能单元的容量需求，降低成本", "电化学储能容量大，可补偿长时间功率缺额", "系统整体的调频精度高于单一储能系统", "", ""], "r": "ABCD", "e": "A选项飞轮响应快能快速补偿短时功率波动；C选项电化学储能容量大，可补偿长时间功率缺额；B选项两者协同能降低单个储能单元容量需求从而降低成本；D选项混合系统综合两者优势，整体调频精度高于单一储能系统。ABCD选项均是混合储能系统用于电网调频的优势。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023824", "t": 2, "q": "热能储存技术可应用于以下哪些领域（　）?", "a": ["电网调峰填谷", "太阳能热发电站的热量储存", "建筑供暖系统的热量调节", "工业生产过程中的余热回收", "", ""], "r": "ABCD", "e": "热能储存技术能存储热能并在需要时释放。电网调峰填谷可通过储存多余电能转化的热能来平衡用电；太阳能热发电站需储存热量保证稳定发电；建筑供暖系统可调节热量，避免浪费；工业生产余热回收也能利用此技术。ABCD四个选项均符合热能储存技术的应用领域。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023825", "t": 2, "q": "热能储存系统的换热设备设计中，需优化的参数有（多选，从传热效率与系统运行角度）", "a": ["换热面积（与传热速率匹配）", "流体的流动速度（影响传热系数）", "换热表面的粗糙度（影响边界层）", "换热设备的材质（影响耐温与耐腐蚀）", "", ""], "r": "ABCD", "e": "从传热效率与系统运行角度，A选项换热面积与传热速率匹配能提升传热效率；B选项流体流动速度影响传热系数，进而影响传热效率；C选项换热表面粗糙度影响边界层，对传热有影响；D选项换热设备材质影响耐温与耐腐蚀，关乎系统稳定运行。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023826", "t": 2, "q": "热能储存系统中，选择储热介质时需综合考虑的技术指标有（多选，从储热性能与工程应用角度）", "a": ["工作温度范围（与热源匹配）", "毒性与环境友好性", "化学稳定性（无腐蚀、不分解）", "介质的市场供应稳定性", "", ""], "r": "ABCD", "e": "从储热性能与工程应用角度，工作温度范围要与热源匹配，才能有效储热，A 正确；毒性与环境友好性影响实际使用和环保要求，B 正确；化学稳定性好，无腐蚀、不分解，能保障系统正常运行，C 正确；市场供应稳定性关系到工程能否持续进行，D 正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023827", "t": 2, "q": "热能储存中，\"化学储热\"技术的主要应用场景有哪些?", "a": ["工业余热回收与利用", "电网削峰填谷的大规模储能", "太阳光热电站的长期储热（如跨昼夜储热）", "建筑供暖与供冷的季节性储热", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023828", "t": 2, "q": "热能储存中，“显热储热”技术的优点有哪些?", "a": ["储热材料来源广泛，成本低（如水、岩石）", "工作温度范围宽，适应性强", "储热过程无相变，体积变化小", "储能密度高，适合大规模储能", "", ""], "r": "ABC", "e": "显热储热用常见水、岩石等材料，来源广成本低；工作温度范围宽；储热无相变体积变化小。但它储能密度低，不适合大规模储能。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023829", "t": 2, "q": "热能储存中，潜热储热材料需具备的关键性能指标有哪些?", "a": ["相变温度与应用场景匹配", "低导热系数（减少热损失）", "相变过程中体积变化小", "良好的热稳定性（循环寿命长）", "", ""], "r": "ACD", "e": "热能储存中，潜热储热材料的关键性能指标主要包括相变温度与应用场景的匹配、相变过程中体积变化小以及良好的热稳定性（循环寿命长）。这些指标确保了潜热储热材料在实际应用中的有效性和稳定性。A选项提到的“相变温度与应用场景匹配”是关键指标之一，因为潜热储热材料的相变温度需要与应用场景的温度范围相适应，以确保在该温度范围内能够有效地储存和释放热能。C选项中的“相变过程中体积变化小”也是重要指标，因为体积变化大会导致材料结构的破坏或泄漏等问题，从而影响潜热储热材料的性能和使用寿命。D选项的“良好的热稳定性（循环寿命长）”同样是关键指标，因为潜热储热材料需要在多次循环使用中保持稳定的性能，以确保长期有效的热能储存。而B选项中的“低导热系数（减少热损失）”虽然对于减少热损失和提高储热效率是有利的，但它并非潜热储热材料的关键性能指标。潜热储热材料主要通过相变来储存和释放热能，其导热系数并不是核心关注点。综上所述，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023830", "t": 2, "q": "下列关于抽水蓄能电站水泵水轮机\"驼峰工况\"的说法，正确的有哪些?", "a": ["运行中应避免机组长时间在驼峰工况下运行", "驼峰工况下，转轮进口水流易产生脱流，导致机组振动", "驼峰工况下，水泵的扬程会随流量减小而升高", "驼峰工况发生在水泵工况的小流量区域", "", ""], "r": "ABD", "e": "抽水蓄能电站的水泵水轮机在运行过程中会遇到不同的工况，其中“驼峰工况”是一个特定的运行状态。A选项提到应避免机组长时间在此工况下运行。这是因为驼峰工况可能会导致机组的不稳定运行，增加设备的磨损和故障风险，所以这一说法是正确的。B选项描述驼峰工况下转轮进口水流易产生脱流，导致机组振动。驼峰工况确实容易引起水流的不稳定，从而导致转轮进口的水流产生脱流，进一步可能引发机组的振动，这一说法也是准确的。C选项说驼峰工况下，水泵的扬程会随流量减小而升高。但实际上，在驼峰工况下，随着流量的减小，水泵的扬程是先升高后降低，呈现出一个驼峰形状的变化趋势，所以该选项描述不准确。D选项指出驼峰工况发生在水泵工况的小流量区域。这是正确的，因为驼峰工况正是出现在水泵运行的小流量区域，此时水泵的性能曲线呈现出驼峰状。综上所述，A、B、D三个选项的描述是正确的。所以，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023831", "t": 2, "q": "下列哪些因素会显著影响抽水蓄能电站的综合转换效率（　）?", "a": ["输水管道的水头损失", "储能系统的运行时长", "上、下水库的水位差", "发电机/电动机的能量转换效率", "", ""], "r": "ACD", "e": "抽水蓄能电站的综合转换效率受多个因素影响。简单来说： A项（输水管道的水头损失）：会影响水的势能和动能转换，进而影响整体效率。 C项（上、下水库的水位差）：水位差越大，能量转换的潜力越大，效率越高。 D项（发电机/电动机的能量转换效率）：直接决定了电能与其他形式能量的转换效果。而B项（储能系统的运行时长）主要影响的是电站的使用频率和总发电量，并不直接影响综合转换效率。综上所述，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023832", "t": 2, "q": "下列属于电磁储能技术类型的有（　）?", "a": ["飞轮储能", "超级电容器储能", "超导磁储能（SMES）", "压缩空气储能", "", ""], "r": "BC", "e": "电磁储能是基于电磁感应原理或电场与磁场转换实现能量存储，超级电容器利用电场储能，超导磁储能利用磁场储能，都属于电磁储能技术。而飞轮储能是机械动能存储，压缩空气储能是将空气压缩存储能量，属于物理储能。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023833", "t": 2, "q": "显热储热技术的主要优点包括（　）?", "a": ["技术成熟度高，可靠性强", "蓄热材料成本较低", "储能密度高", "温度控制精度高", "", ""], "r": "AB", "e": "显热储热是利用材料的温度变化来储存热量，其技术发展时间长，技术成熟度高、可靠性强，蓄热材料常见如砂石、水等，成本较低。但它储能密度低，温度控制精度也不高。所以答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023834", "t": 2, "q": "相变蓄热技术的主要缺点有（　）?", "a": ["部分相变材料腐蚀性强，可能损坏容器", "部分材料存在过冷现象，即实际相变温度低于理论值", "成本较高，包括材料成本及复杂的系统设计费用", "多组分材料在使用过程中易发生相分离，导致成分分层", "", ""], "r": "ABCD", "e": "相变蓄热技术存在多方面缺点，A项部分相变材料腐蚀性强会损坏容器；B项过冷现象使实际相变温度低于理论值；C项成本包括材料和系统设计费用高；D项多组分材料使用中会相分离成分层。答案涵盖这几个方面。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023835", "t": 2, "q": "影响电化学储能电池循环寿命的关键因素有（　）?", "a": ["充放电电流速率（C率）", "电池的充放电深度（DOD）", "电池的工作温度范围", "电池的储存环境湿度", "", ""], "r": "ABC", "e": "充放电电流速率、充放电深度、工作温度范围都会显著影响电池的性能和循环寿命。而储存环境湿度主要影响电池储存，并非影响循环寿命的关键因素。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023836", "t": 2, "q": "影响飞轮储能系统最大转速的关键因素有（　）?", "a": ["飞轮材料的抗拉强度（防止破裂）", "真空罩的真空度（影响阻力）", "驱动电机的最大功率", "系统所需的储能容量", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023837", "t": 2, "q": "重力储能技术的主要类型包括（　）?", "a": ["相变重力储能", "山体滑坡式重力储能", "地下洞穴式重力储能", "液体重力储能（如水箱升降式）", "", ""], "r": "CD", "e": "重力储能技术主要有液体重力储能（如水箱升降式）、地下洞穴式重力储能等类型，相变重力储能并非常见重力储能类型，山体滑坡式重力储能不是规范的重力储能技术分类。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023838", "t": 2, "q": "重力储能技术的主要优点有（　）?", "a": ["响应速度快（毫秒级）", "对环境友好（无化学污染、噪音小）", "能量密度较高", "维护成本低（机械结构简单）", "", ""], "r": "ABD", "e": "答案：ABD重力储能是一种机械能储存方式，通过物体的重力势能和动能之间的转换来储存和释放能量。A 选项，重力储能系统可以在很短的时间内（毫秒级）响应能量的需求变化，实现快速充放电。B 选项，它不涉及化学反应，不会产生有害物质，也没有复杂的机械运动带来的噪音污染，对环境友好。C 选项，相比电池等储能方式，重力储能的能量密度通常较低。D 选项，重力储能的机械结构相对简单，运动部件较少，从而维护成本较低。综上所述，选择 ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023839", "t": 2, "q": "重力储能系统的驱动系统（如卷扬机、液压系统）设计中，需满足的技术要求有（多选，从系统运行与安全角度）", "a": ["具备能量回收功能（如制动能量回收）", "具备过载保护功能", "具备位置精准控制能力", "具备低噪音运行特性", "", ""], "r": "ABC", "e": "从系统运行与安全角度，能量回收可提高效率，过载保护保障系统安全，精准位置控制确保系统稳定运行，低噪音运行对系统运行和安全影响不大。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023840", "t": 2, "q": "重力储能系统的选址需考虑的关键因素有哪些?", "a": ["储能介质的运输便利性", "地形条件（如是否有高差或可开挖竖井）", "电网接入条件（如距离负荷中心的距离）", "地质稳定性（如避免断层、滑坡区域）", "", ""], "r": "BCD", "e": "重力储能靠高度差实现能量转换与存储，需有合适地形提供高差或可开挖竖井；要保障安全稳定运行，地质需稳定，避开不良区域；还得考虑接入电网，距离负荷中心近可减少传输损耗。而储能介质一般就在当地利用，运输便利性不是关键因素。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023841", "t": 2, "q": "重力储能系统的重物设计中，需考虑的因素有（多选，从材料选择与结构安全角度）", "a": ["重物的耐腐蚀性能（应对环境影响）", "重物的成本（影响系统经济性）", "重物的机械强度（承受提升与降落冲击）", "重物的密度（影响体积与占地面积）", "", ""], "r": "ABCD", "e": "耐腐蚀抵御外界环境侵蚀，机械强度保障升降冲击工况下结构安全，密度决定重物体积占地，材料成本关乎系统经济性，均为重物材料选择与结构安全设计需要考虑的因素。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023842", "t": 2, "q": "重力储能相比抽水蓄能，具有的优势包括（　）?", "a": ["初始投资成本更低", "不受天然水资源和地形条件限制", "建设周期更短，选址灵活性高", "储能时长调节更灵活", "", ""], "r": "BC", "e": "这是一道关于重力储能与抽水蓄能比较的选择题。我们需要基于两种储能方式的特点来判断哪些优势是重力储能所具备的。首先，简要介绍两者的基本原理： 重力储能：利用重力势能和动能之间的转换来储存和释放能量。 抽水蓄能：通过水位的高低变化来储存和释放能量，需要用到大量的水和特定的地形。接下来，针对每个选项进行分析：A. 初始投资成本更低 实际上，重力储能的初始投资成本通常高于抽水蓄能，因为重力储能系统可能需要更复杂的机械结构和控制系统。B. 不受天然水资源和地形条件限制 这是重力储能的一个显著优势。抽水蓄能依赖大量的水资源和适合的地形（如山谷），而重力储能则可以通过设计合适的重物和提升系统，在更多样化的地点实施，不严格依赖于水资源和特定地形。C. 建设周期更短，选址灵活性高 相对于抽水蓄能，重力储能系统的建设规模较小，涉及的工程相对简单，因此建设周期可能更短。同时，由于其不依赖于特定的水资源和地形，选址的灵活性也更高。D. 储能时长调节更灵活 这一点并非重力储能相较于抽水蓄能的明显优势。抽水蓄能在储能时长调节方面也有较好的表现，可以根据需求进行灵活调整。综上所述，重力储能相比抽水蓄能，其显著优势在于不受天然水资源和地形条件的限制（B选项），以及建设周期可能更短、选址灵活性更高（C选项）。所以，正确答案是BC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023843", "t": 2, "q": "重力储能中，\"悬吊式重力储能\"相比\"堆积式重力储能\"，具有的特点有哪些?", "a": ["储能介质的磨损更严重", "可通过增加悬吊高度，灵活提高储能容量", "建设成本更高", "对地面承重要求更低", "", ""], "r": "BD", "e": "悬吊式重力储能可通过增加悬吊高度来灵活提高储能容量；堆积式重力储能对地面承重要求高，悬吊式相对低；堆积式储能介质磨损更严重；悬吊式建设成本低。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800316268023844", "t": 2, "q": "重力储能中，“液态重力储能”的缺点有哪些?", "a": ["储能介质（如液体金属）密度大，对设备强度要求高", "低温环境下介质易凝固，需加热保温，增加能耗", "介质升降过程中易产生飞溅，导致能量损失", "储能容量受介质体积限制，难以扩大", "", ""], "r": "ABCD", "e": "ABCD分别从设备要求、能耗、能量损失、储能容量方面指出了液态重力储能的缺点。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596096", "t": 3, "q": "空气压缩储能系统中，\"绝热压缩\"过程的压缩功全部转化为空气的内能，无热量损失，因此绝热压缩的能量转换效率高于等温压缩。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "绝热压缩过程压缩功全转化为空气内能无热量损失，但等温压缩能将压缩热及时排出，使压缩过程接近等温，减少耗功。实际能量转换效率受多种因素影响，不能简单说绝热压缩效率就高于等温压缩。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596097", "t": 3, "q": "空气压缩储能系统中，采用\"等温压缩\"技术可完全消除压缩过程中的热量损失，使系统效率达到100%。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实际中难以实现完全的“等温压缩”，且即使是等温压缩，系统还存在其他能量损耗，不可能使系统效率达到100%。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596098", "t": 3, "q": "空气压缩储能系统中，储气库的压力越高，系统的储能密度越大，因此储气库压力应尽可能高，无需考虑设备承受能力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然储气库压力越高系统储能密度越大，但设备承受能力是必须考虑的因素，若不考虑会引发安全等问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596099", "t": 3, "q": "空气压缩储能系统中，储热子系统的储热材料若采用高温熔盐，其工作温度范围比陶瓷（显热材料）更广，因此更适合高温储能场景。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "高温熔盐工作温度范围比陶瓷显热材料广，能承受更高温度，所以更适合高温储能场景。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596100", "t": 3, "q": "空气压缩储能系统中，压缩过程释放的热量若不进行回收，会导致系统的整体效率显著下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "空气压缩储能系统压缩空气时会产生大量热，若热量不回收，这部分能量就被浪费，还可能影响后续储能和释能过程，使整体效率显著下降。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596101", "t": 3, "q": "锂离子电池的电解液仅负责锂离子的传输，对电池的安全性没有影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "锂离子电池电解液不仅负责锂离子传输，其性质对电池安全性影响很大，如易燃性、热稳定性等，若电解液不稳定可能引发起火、爆炸等安全问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596102", "t": 3, "q": "锂离子电池的电解液仅起到传输锂离子的作用，对电池的安全性没有影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。电解液不仅传输锂离子，其成分、稳定性等影响电池安全性，如易燃电解液遇高温等易引发安全问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596103", "t": 3, "q": "锂离子电池的负极材料常用钴酸锂，其主要功能是实现锂离子的嵌入与脱嵌。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "锂离子电池负极材料常用石墨等，钴酸锂是常用的正极材料。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596104", "t": 3, "q": "耦合储能系统的\"容量配置\"若仅考虑电网的峰谷差需求，忽略可再生能源的出力波动，会导致系统无法有效消纳可再生能源，降低系统经济性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "可再生能源出力有波动性，仅考虑电网峰谷差需求进行耦合储能系统容量配置，未顾及可再生能源特点，难以有效消纳其产生的电能，还会因不能合理利用资源而降低系统经济性。", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596105", "t": 3, "q": "耦合储能系统的\"拓扑结构\"选择仅需考虑各储能单元的技术特性，无需考虑电网的运行需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "耦合储能系统拓扑结构选择时，既要考虑各储能单元技术特性，也必须考虑电网运行需求，这样才能让储能系统更好适配电网，保障电网稳定、高效运行。", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596106", "t": 3, "q": "耦合储能系统的\"协同控制\"主要目标是使各储能单元的充放电次数相同，避免某一单元过度损耗。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "耦合储能系统的“协同控制”主要目标是实现多种储能优势互补、提升储能系统整体性能、优化系统运行等，并非使各储能单元充放电次数相同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596107", "t": 3, "q": "耦合储能系统的可靠性通常高于单一储能系统，因为各子系统可互为备用，减少整体故障概率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "耦合储能系统将不同类型储能子系统组合，各子系统能在功能上互补，可互为备用。当某个子系统出现故障，其他子系统能维持部分或全部功能，降低了整体储能系统故障发生的概率，所以可靠性通常高于单一储能系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596108", "t": 3, "q": "耦合储能系统的运行稳定性一定优于单一储能系统，无需考虑各单元的兼容性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "耦合储能系统并非一定运行稳定性就优于单一储能系统，且各单元兼容性必须考虑，若兼容性不佳会影响系统性能和稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596109", "t": 3, "q": "耦合储能系统设计时，无需考虑各储能单元的动态响应特性，只需关注总容量匹配即可。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "耦合储能系统设计中，各储能单元动态响应特性很关键，不同响应特性影响系统稳定性、调节能力等，不能只关注总容量匹配。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596110", "t": 3, "q": "耦合储能系统中，\"串联型耦合\"的系统效率一定低于\"并联型耦合\"，因为串联会产生多次能量转换损耗。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然串联可能存在多次能量转换损耗，但不能绝对地说串联型耦合系统效率一定低于并联型耦合，系统效率还受多种因素影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596111", "t": 3, "q": "耦合储能系统中，“电化学储能+热能储存”耦合运行时，应优先使用热能储存满足长时储能需求，电化学储能满足短时波动需求，以降低系统运行成本。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“电化学储能+热能储存”耦合运行时，热能储存适合长时储能，电化学储能响应快适合短时波动，优先用热能满足长时需求、电化学满足短时波动可减少成本，该说法合理。", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596112", "t": 3, "q": "耦合储能系统中，各储能单元的充放电顺序无需优化，可随机进行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "耦合储能系统中，各储能单元的充放电顺序若随机进行，会影响系统效率、寿命和稳定性等，所以需要优化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596113", "t": 3, "q": "耦合储能系统中，各子系统的运行状态完全独立，无需统一的控制系统进行协调调度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "耦合储能系统各子系统并非运行状态完全独立，为实现高效稳定运行，需要统一控制系统协调调度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596114", "t": 3, "q": "其他条件不变时，抽水蓄能电站的下水库水位越低，水泵抽水工况的能耗就越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水泵抽水是要将水从下水库抽到上水库，下水库水位越低，需要提升的高度越大，克服重力做功越多，能耗也就越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596115", "t": 3, "q": "铅酸蓄电池在充电过程中，正极会发生硫酸铅转化为二氧化铅的反应，负极会发生硫酸铅转化为铅的反应。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "铅酸蓄电池充电时，正极上硫酸铅失去电子转化为二氧化铅，负极上硫酸铅得到电子转化为铅。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596116", "t": 3, "q": "热能储存系统的换热效率越高，系统的储热与放热速度越快，对储热介质的储热容量没有影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596117", "t": 3, "q": "热能储存中，化学储热技术的储能密度高于潜热储热，因此化学储热系统的体积一定小于潜热储热系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然化学储热技术储能密度高于潜热储热，但系统体积不仅取决于储能密度，还受其他因素如系统设计、结构等影响，所以不能仅依据储能密度就判定化学储热系统体积一定小于潜热储热系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596118", "t": 3, "q": "热能储存中，潜热储热材料的相变潜热越大，其单位质量储热量越大，因此在相同储能需求下，所需材料的质量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "潜热储热材料单位质量储热量与相变潜热成正比，相变潜热大则单位质量储热量大，满足相同储能需求时，所需材料质量自然越小。", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596119", "t": 3, "q": "热能储存中，潜热储热材料的相变温度越高，其储能密度越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "潜热储热材料的储能密度不仅与相变温度有关，还和相变潜热等因素相关。不能简单认为相变温度越高，储能密度就越大。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596120", "t": 3, "q": "热能储存中，显热储热的热损失主要来自温度差引起的热传导，潜热储热的热损失主要来自相变过程中的热量泄漏，两者热损失机制不同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "显热储热靠温度变化储热，热损失源于温度差导致热传导；潜热储热利用相变储热，热损失主要是相变过程热量泄漏，二者热损失机制确实不同。", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596121", "t": 3, "q": "热能储存中，显热储热技术的充放电速度快于潜热储热技术，因为显热储热无需经历相变过程，传热阻力更小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "显热储热依靠物质温度变化储存释放热量，无变相过程，传热阻力小，充放电速度比需经历相变的潜热储热快。", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596122", "t": 3, "q": "热能储存中的潜热储存技术，其储热密度通常高于显热储存技术，因为潜热储存利用的是介质相变过程的热量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "潜热储存依靠介质相变过程吸收或释放热量，显热储存是通过介质温度变化储存热量，潜热储存的储热密度通常更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596123", "t": 3, "q": "熔盐储能系统中，熔盐的凝固点越低，越有利于系统的启动与停机，减少冻堵风险。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "凝固点低意味着熔盐更不容易凝固，在系统启动与停机过程中，能降低凝固成固态堵塞管道等部件的风险，利于系统运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596124", "t": 3, "q": "显热储热技术的优点是温度控制精度高，不会出现过冷或相分离问题。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "显热储热通过物质温度变化储存热量，不存在相变，所以不会出现过冷或相分离问题，且温度控制相对容易、精度较高。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596125", "t": 3, "q": "显热储热技术是利用材料相变过程中吸收或释放的潜热进行能量储存的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。显热储热是利用材料温度变化来储存和释放热量，而利用材料相变过程中吸收或释放潜热进行能量储存的是潜热储热技术。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596126", "t": 3, "q": "相变蓄热材料的工作温度范围是固定的，无法通过调整材料成分进行改变。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "相变蓄热材料可通过调整材料成分来改变工作温度范围。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596127", "t": 3, "q": "相变蓄热材料的相变潜热越大，其单位质量的储能容量就越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "相变潜热是指物质在相变过程中吸收或释放的热量，相变潜热越大，单位质量的储能容量应越大，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596128", "t": 3, "q": "压缩空气储能的等温压缩过程比绝热压缩过程产生的热量更多，需要更强的冷却系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "等温压缩过程温度不变，压缩产生的热量会及时被冷却带走；绝热压缩过程与外界无热交换，热量都积累在系统内。所以绝热压缩产生热量更多，需要更强冷却系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596129", "t": 3, "q": "压缩空气储能系统的蓄热材料若性能下降，会导致膨胀过程中可用热量减少，系统效率降低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "蓄热材料性能下降，其储存和释放热量的能力变差，膨胀过程中能提供的可用热量自然减少，系统做功能力受影响，效率降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596130", "t": 3, "q": "压缩空气储能系统在膨胀过程中，压缩空气的压力会升高，温度会降低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压缩空气储能系统膨胀过程是气体体积增大，压力会降低，而根据热力学原理，气体膨胀对外做功，内能减小，温度也会降低，所以题干说压力升高错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596131", "t": 3, "q": "在其他条件不变时，抽水蓄能电站上、下水库的水位差越大，其发电工况下的水轮机出力就越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水轮机出力与水位差相关，水位差越大，水的势能越大，转化的电能越多，出力也就越大。", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596132", "t": 3, "q": "在压力和温度不变的情况下，压缩空气储能的储气室体积越大，其储存的能量容量就越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在压力和温度不变时，根据能量与储气室相关原理，储气室体积越大，能容纳的压缩空气越多，储存的能量容量也就越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596133", "t": 3, "q": "在质量和温度变化相同的情况下，显热储热材料的比热容越大，其储存的显热能量就越多。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据显热计算公式Q = cmΔT（Q为显热，c为比热容，m为质量，ΔT为温度变化），当m和ΔT相同时，c越大，Q越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596134", "t": 3, "q": "重力储能技术相比抽水蓄能，更依赖于天然水资源和特定的地形条件。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能依赖天然水资源和特定地形条件，而重力储能是通过提升重物来存储能量，不依赖天然水资源，对特定地形条件依赖也小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596135", "t": 3, "q": "重力储能系统的储能介质若采用液体金属（如铅铋合金），其储能密度（单位体积储能）高于水，因此适合用于小空间、大容量的储能场景。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "液体金属储能密度高于水，意味着相同体积下能储存更多能量，所以适合小空间、大容量的储能场景。", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596136", "t": 3, "q": "重力储能系统的储能容量与储能介质的升降高度成正比，因此提高升降高度是提高储能容量的唯一途径。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然储能容量与储能介质升降高度成正比，但不是提高储能容量的唯一途径，还可通过增加储能介质质量等方式提高储能容量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596137", "t": 3, "q": "重力储能系统的储能时长仅取决于重物的提升高度，与提升速度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重力储能系统储能时长与重物提升高度和提升速度都有关。提升高度决定了重力势能大小，而提升速度会影响能量转化和释放的时间等。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596138", "t": 3, "q": "重力储能系统的机械传动效率越高，其整体能量转换效率就越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机械传动效率高意味着在能量传递过程中损耗小，能更多地将能量有效传递，会使整体能量转换效率提高，而不是降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596139", "t": 3, "q": "重力储能系统的建设成本主要与重物的质量有关，与场地的地形条件无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重力储能系统建设成本既与重物质量有关，场地地形条件也会影响成本，如特殊地形可能需额外工程处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596140", "t": 3, "q": "重力储能系统的能量密度仅与重物的质量有关，与提升高度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。重力储能系统能量计算公式为E = mgh（E是能量，m是重物质量，g是重力加速度，h是提升高度），可见其能量密度与重物质量和提升高度都有关，并非仅与重物质量有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596141", "t": 3, "q": "重力储能系统的能量转换效率仅取决于重物的提升高度，与机械传动部件无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重力储能系统能量转换效率不仅与重物提升高度有关，机械传动部件在能量转换过程中会有能量损耗，对效率也有影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596142", "t": 3, "q": "重力储能系统的能量转换效率主要取决于驱动系统（如电机、减速器）的效率，与储能介质的类型（固体/液体）无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "重力储能系统能量转换效率不仅取决于驱动系统效率，储能介质类型也会影响，不同介质在提升、下落等过程中能量损耗不同，影响整体效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596143", "t": 3, "q": "重力储能系统中，重物的密度越大，在相同体积下其重量越小，储能容量越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据重力势能公式「test/yiwen_img/importSubject/2034800312438624256.png」（「test/yiwen_img/importSubject/2034800312400875520.png」是密度，V是体积，g是重力加速度，h是高度），在相同体积下，重物密度越大，质量越大，重力势能越大，储能容量越高。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596144", "t": 3, "q": "重力储能中的\"堆积式重力储能\"通过将储能块体堆积在高处储存能量，释放时将块体逐层卸下，推动发电机发电，其能量转换效率高于悬吊式重力储能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般悬吊式重力储能能量转换效率高于堆积式重力储能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800319086596145", "t": 3, "q": "重力储能中的\"悬吊式重力储能\"通过电机带动钢丝绳提升块体储存能量，释放时块体下降带动电机发电，其能量转换效率不受钢丝绳磨损的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "钢丝绳磨损会增加额外的能量损耗，影响能量转换效率。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第9章 氢能科学与技术（1）", "n": "基础练习题【含解析】 / 第9章 氢能科学与技术（1）", "qs": [{"id": "2034800323805188096", "t": 1, "q": "根据《氢能安全指南》，氢气在空气中的爆炸极限范围（体积分数）为，且在该范围内，最易发生爆炸的体积分数约为", "a": ["2%-50%，最易爆炸体积分数15%", "4%-75%，最易爆炸体积分数29.5%", "1%-10%，最易爆炸体积分数5%", "5%-60%，最易爆炸体积分数35%", "", ""], "r": "B", "e": "氢气在空气中爆炸极限范围（体积分数）是4% - 75%，最易发生爆炸体积分数约为29.5%。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188097", "t": 1, "q": "固体氧化物电解池（SOEC）制氢时，若采用CO2和H2O共电解，可同时生成H2和CO（合成气），该过程的优势是", "a": ["降低电解电压，提高电能转化效率", "减少CO2排放，实现碳循环利用", "降低工作温度，延长SOEC使用寿命", "无需分离H2和CO，直接用于合成液态燃料", "", ""], "r": "B", "e": "CO2和H2O共电解生成H2和CO，CO2被利用生成了CO，可减少其排放且实现碳循环利用。A选项题干未提及对电解电压和电能转化效率的影响；C选项未涉及工作温度和使用寿命；D选项合成液态燃料不是该过程主要优势。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188098", "t": 1, "q": "固体氧化物燃料电池（SOFC）的工作原理中，电解质的作用是传递何种离子，且工作温度范围为", "a": ["传递CO3^2-，工作温度300-500摄氏度", "传递OH-，工作温度150-250摄氏度", "传递H+，工作温度80-100摄氏度", "传递O2-，工作温度600-1000摄氏度", "", ""], "r": "D", "e": "固体氧化物燃料电池中，电解质传递的是O²⁻，其工作温度较高，一般在600 - 1000摄氏度。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188099", "t": 1, "q": "关于固态储氢材料，下列哪种材料的储氢容量（质量分数）最高，且在常温常压下具有较好的储放氢性能?", "a": ["稀土系AB5型储氢合金（如LaNi5）", "镁基储氢合金（如MgH2）", "金属有机框架材料（MOFs）", "钛系AB2型储氢合金（如TiFe）", "", ""], "r": "B", "e": "镁基储氢合金理论储氢容量高，像MgH₂质量分数可达7.6%，且在改善后常温常压储放氢性能较好；稀土系、钛系储氢合金储氢容量相对低；金属有机框架材料储氢通常需低温高压。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188100", "t": 1, "q": "关于甲烷水蒸气重整（SMR）制氢工艺，下列哪项操作参数对氢气产率和CO含量控制最为关键?", "a": ["甲烷与水蒸气的体积比（水碳比）", "重整反应器入口压力", "原料气预热温度", "后续变压吸附（PSA）的吸附时间", "", ""], "r": "A", "e": "水碳比直接影响甲烷水蒸气重整反应平衡，对氢气产率和CO含量控制起关键作用。而入口压力、原料气预热温度影响相对没那么关键，后续PSA吸附时间主要影响氢气提纯，并非对产率和CO含量控制的关键参数。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188101", "t": 1, "q": "关于燃料电池的\"极化损失\"，下列哪种损失是由于反应物从流道到电极活性位点的传质阻力引起的?", "a": ["欧姆极化损失", "浓度极化损失", "活化极化损失", "接触极化损失", "", ""], "r": "B", "e": "浓度极化损失是因反应物从流道到电极活性位点传质有阻力，导致电极表面反应物浓度与流道中不同而产生。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188102", "t": 1, "q": "加氢站的\"加氢机\"在给燃料电池汽车加氢时，需满足\"加氢协议\"（如SAE J2601），其核心要求是", "a": ["加氢时间（0-100%容量）≤15分钟，加氢压力≤35MPa", "加氢时间（0-100%容量）≤5分钟，加氢压力≤35MPa", "加氢时间（0-80%容量）≤3分钟，加氢压力≤70MPa", "加氢时间（0-80%容量）≤10分钟，加氢压力≤70MPa", "", ""], "r": "C", "e": "SAE J2601加氢协议核心要求是加氢时间（0 - 80%容量）≤3分钟，加氢压力≤70MPa。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188103", "t": 1, "q": "加氢站的\"顺序控制\"系统中，下列哪项操作是加氢前的必要步骤", "a": ["检测加氢枪与车载接口的密封性", "对车载储氢系统进行泄压", "将加氢站储氢压力降至与车载储氢压力一致", "关闭加氢站的通风系统", "", ""], "r": "A", "e": "加氢前需确保加氢枪与车载接口密封良好，防止氢气泄漏，这是必要安全步骤。B项加氢前不应泄压；C项无需将加氢站储氢压力降至与车载一致；D项加氢站通风系统应保持开启。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188104", "t": 1, "q": "加氢站的安全控制系统中，当检测到氢气泄漏浓度达到爆炸下限的多少时，会触发一级报警并启动通风系统", "a": ["75%", "50%", "10%", "25%", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188105", "t": 1, "q": "加氢站的储氢系统中，当采用\"高压储氢罐+低压缓冲罐\"组合时，低压缓冲罐的主要作用是", "a": ["稳定加氢机入口压力，避免压缩机频繁启停", "储存多余氢气，提高加氢站储氢总量", "降低高压储氢罐的压力损失，延长罐使用寿命", "去除氢气中的杂质（如H2O、CO），提高氢气纯度", "", ""], "r": "A", "e": "低压缓冲罐可稳定加氢机入口压力，让压缩机工作更平稳，避免频繁启停。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188106", "t": 1, "q": "加氢站的控制系统中，\"压力联锁保护\"功能的触发条件不包括", "a": ["加氢机出口压力低于设定压力的80%", "压缩机出口压力超过安全泄压阀设定压力", "高压储氢罐压力超过设计压力的110%", "缓冲罐压力波动幅度超过±0.5MPa/分钟", "", ""], "r": "A", "e": "压力联锁保护触发条件通常是压力过高或异常波动等危险情况，A选项加氢机出口压力低于设定压力的80%一般不会触发保护，多是压力过高才会触发。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188107", "t": 1, "q": "加氢站的氢气储存系统中，当采用低温液态储氢罐时，为减少氢气蒸发损失，通常会采取\"BOG回收\"措施，其中\"BOG\"指的是?", "a": ["液态氢蒸发产生的气态氢", "罐内残留的杂质气体", "氢气与罐壁材料反应生成的气体", "充氢过程中带入的空气", "", ""], "r": "A", "e": "BOG是英文Boil-Off Gas的缩写，指液态氢蒸发产生的气态氢，采取“BOG回收”措施就是为减少氢气蒸发损失。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188108", "t": 1, "q": "加氢站的氢气压缩机中，哪种类型的压缩机适合将氢气从低压（0.1MPa）压缩至高压（35/70MPa），且具有无油污染、压缩效率高的特点?", "a": ["往复式活塞压缩机", "隔膜式压缩机", "离心式压缩机", "螺杆式压缩机", "", ""], "r": "B", "e": "隔膜式压缩机通过隔膜将压缩介质与外界隔离，能实现无油污染，且压缩效率高，适合将氢气从低压大幅压缩至高压。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188109", "t": 1, "q": "加氢站的氢气压缩系统中，多级往复式压缩机是常用设备。下列关于该压缩机的工作原理，说法错误的是?", "a": ["为防止氢气泄漏，气缸密封采用油润滑密封", "通过活塞往复运动改变气缸容积实现气体压缩", "多级压缩可降低每级压缩比，减少排气温度", "压缩过程中需设置中间冷却器移除压缩热", "", ""], "r": "A", "e": "氢气与油接触可能会有安全风险，且油可能污染氢气，所以加氢站多级往复式压缩机气缸密封一般不用油润滑密封。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188110", "t": 1, "q": "加氢站中，用于将从制氢厂输送来的低压氢气增压至高压储氢压力（如35MPa或70MPa）的核心设备是", "a": ["干燥净化装置", "加氢机", "高压储氢瓶组", "隔膜式压缩机", "", ""], "r": "D", "e": "隔膜式压缩机能将低压氢气增压至高压，符合题干要求；干燥净化装置用于氢气净化，加氢机用于给车辆加氢，高压储氢瓶组用于储存高压氢气，均不是增压核心设备。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188111", "t": 1, "q": "碱性燃料电池（AFC）以氢氧化钾溶液为电解质，其负极（氢气电极）的反应方程式为?", "a": ["H2-2e-=2H+", "O2+4H++4e-=2H2O", "O2+2H2O+4e-=4OH-", "H2-2e-+2OH-=2H2O", "", ""], "r": "D", "e": "碱性燃料电池中氢气在负极失电子，因电解质是碱性，生成的H⁺会与OH⁻反应，所以负极反应是氢气失电子结合OH⁻生成水。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188112", "t": 1, "q": "金属氢化物储氢材料中，LaNi5型合金的储氢特性为", "a": ["储氢密度高（~2wt%），但释氢温度高（>150摄氏度）", "储氢密度低（<1wt%），但释氢温度低（<50摄氏度）", "储氢密度高（~1.4wt%），释氢温度适中（50-100摄氏度）", "储氢密度低（~0.8wt%），释氢温度高（>150摄氏度）", "", ""], "r": "C", "e": "LaNi5型合金储氢密度较高，释氢温度适中。其储氢量约为1.4wt%，释氢温度在50 - 100摄氏度。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188113", "t": 1, "q": "金属氢化物储氢系统的\"充氢速率\"主要取决于", "a": ["氢气的纯度（杂质含量<0.1%）", "储氢容器的体积（体积越大，充氢速率越快）", "充氢压力与温度（高压、低温有利）", "储氢材料的比表面积（表面积越大，速率越快）", "", ""], "r": "C", "e": "充氢压力越高、温度越低，越有利于氢气与储氢材料反应，加快充氢速率。氢气纯度主要影响储氢质量；储氢容器体积与充氢速率无必然正相关；储氢材料比表面积虽有影响，但不是主要决定因素。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188114", "t": 1, "q": "利用氢气与二氧化碳催化合成甲醇（CO2+3H2→CH3OH+H2O）的工艺中，下列哪种操作条件更有利于提高甲醇的选择性?", "a": ["低温低压", "低温高压", "高温高压", "高温低压", "", ""], "r": "B", "e": "该反应是气体分子数减小的放热反应。高压利于反应向气体分子数减小方向移动，即正向移动；低温利于放热反应正向进行。所以低温高压有利于提高甲醇的选择性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188115", "t": 1, "q": "氢安全监测中，常用的氢气泄漏检测传感器类型是", "a": ["电感式传感器", "半导体式传感器", "热电偶式传感器", "电容式传感器", "", ""], "r": "B", "e": "半导体式传感器对氢气有较高的灵敏度和选择性，能有效检测氢气泄漏，常用于氢安全监测。电感式主要用于检测金属物体；热电偶式用于测量温度；电容式常用于测量压力、位移等。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188116", "t": 1, "q": "氢安全应急管理中，\"氢气火灾\"的扑救方法正确的是", "a": ["首先切断氢气源，若无法切断，采用惰性气体（如氮气）稀释灭火", "使用二氧化碳灭火器，降低环境温度灭火", "使用干粉灭火器（如ABC干粉），覆盖火焰窒息灭火", "使用水喷雾灭火系统，直接喷射火焰根部", "", ""], "r": "A", "e": "切断氢气源是控制氢气火灾的关键，若无法切断，用惰性气体稀释可降低氢气浓度灭火。二氧化碳、干粉灭火器对氢气火灾效果不佳，水喷雾直接喷根部可能导致氢气扩散。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188117", "t": 1, "q": "氢安全应急管理中，当发生氢气火灾时，下列灭火措施中错误的是", "a": ["直接用水喷射火焰灭火", "切断氢气气源，使火焰自行熄灭", "用水冷却周围设备，防止火势蔓延", "使用干粉灭火器灭火", "", ""], "r": "A", "e": "氢气密度小且燃烧火焰温度高，直接用水喷射火焰难以有效灭火，还可能使氢气扩散引发更危险情况。而切断气源、用水冷却设备、用干粉灭火器灭火都是合理措施。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188118", "t": 1, "q": "氢安全应急管理中，当发生氢气泄漏且形成可燃混合气时，下列哪种检测方法最适合快速确定泄漏点及可燃混合气浓度分布?", "a": ["半导体式氢气传感器", "红外光谱氢气检测仪", "电化学式氢气传感器", "激光Raman光谱氢气检测仪", "", ""], "r": "D", "e": "激光 Raman 光谱检测仪可非接触扫描，能够快速定位泄漏点并获取空间上氢气浓度分布；半导体、电化学式为单点接触检测，红外光谱对氢气检测灵敏度有限。", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188119", "t": 1, "q": "氢的安全检测中，哪种检测方法适合在加氢站密闭空间（如设备舱）中检测氢气泄漏，且具有响应速度快、灵敏度高（检出限<1%LEL）的特点?", "a": ["红外吸收式氢气传感器", "半导体式氢气传感器", "电化学式氢气传感器", "热导式氢气传感器", "", ""], "r": "B", "e": "在氢的安全检测中，针对加氢站密闭空间（如设备舱）的氢气泄漏检测，需要一种响应速度快、灵敏度高（检出限<1%LEL）的检测方法。A. 红外吸收式氢气传感器：虽然可以检测氢气，但在密闭空间的应用可能受限，且响应速度和灵敏度可能不完全满足要求。B. 半导体式氢气传感器：具有响应速度快、灵敏度高的特点，非常适合用于检测密闭空间中的氢气泄漏。C. 电化学式氢气传感器：虽然灵敏度较高，但响应速度可能较慢，不完全满足要求。D. 热导式氢气传感器：灵敏度和响应速度相对较差，不适合用于高要求的场合。综上所述，半导体式氢气传感器最适合在加氢站密闭空间中检测氢气泄漏，且具有响应速度快、灵敏度高的特点。所以，正确答案是B.半导体式氢气传感器。", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188120", "t": 1, "q": "氢的低温液化过程中，为实现氢的液化（沸点-252.87摄氏度），需采用多级节流或膨胀机制冷，其核心挑战是", "a": ["防止液化设备的低温腐蚀（如氢脆）", "避免氢在低温下发生正-仲氢转化（释放热量）", "降低制冷系统的能耗（液化1kg氢需30-40kWh）", "克服氢的高蒸发热（约447kJ/kg）", "", ""], "r": "B", "e": "氢的低温液化过程中，核心挑战在于处理氢在低温下的特定物理和化学性质。我们来简析各个选项：A. 防止液化设备的低温腐蚀（如氢脆）：虽然低温腐蚀是一个需要考虑的问题，但它并非氢液化过程中的核心挑战。B. 避免氢在低温下发生正-仲氢转化（释放热量）：这是一个关键挑战。氢在低温下会发生正-仲氢转化，这个过程会释放热量，这会影响液化的效率，甚至可能导致液化过程的失败。因此，避免这种转化是实现有效液化的核心问题。C. 降低制冷系统的能耗（液化1kg氢需30-40kWh）：虽然能耗是一个重要的考虑因素，但它不是氢液化过程中的核心挑战。能耗高可以通过技术改进来优化，但不是影响液化过程能否成功的关键因素。D. 克服氢的高蒸发热（约447kJ/kg）：高蒸发热确实增加了液化的难度，但并非核心挑战。通过合适的工艺和技术，这个问题是可以解决的。综上所述，氢的低温液化过程中的核心挑战是避免氢在低温下发生正-仲氢转化，因为这会影响液化的效率和成功率。所以，正确答案是B：“避免氢在低温下发生正-仲氢转化（释放热量）”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188121", "t": 1, "q": "氢的低温液化过程中，为实现氢气从气态到液态的相变，需要将其温度降至临界温度以下，同时控制压力。下列关于氢气临界温度的数值，正确的是?", "a": ["-240.17℃", "-252.87℃", "-195.8℃", "-268.93℃", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188122", "t": 1, "q": "氢的低温液化设备中，\"膨胀机\"的作用是", "a": ["去除氢气中的水分和CO2，防止堵塞管道", "将制冷工质（如氦气）膨胀做功，吸收热量降温", "促进正-仲氢转化，减少液化后的蒸发损失", "将高压氢气节流降压，实现降温", "", ""], "r": "B", "e": "膨胀机主要是让制冷工质（如氦气）膨胀做功，此过程吸收热量从而降温。选项A是净化设备作用；选项C与膨胀机功能无关；选项D是节流阀作用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188123", "t": 1, "q": "氢的低温液化系统中，\"Claude循环\"是常用的制冷循环之一，其制冷原理主要依赖于?", "a": ["氢气在透平中膨胀做功，同时吸收热量", "液氮间接冷却实现氢气降温", "氢气与制冷剂的逆流换热", "氢气节流膨胀产生的焦耳-汤姆逊效应", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188124", "t": 1, "q": "氢低温液化过程中，为减少冷量损失并提高液化效率，下列哪种措施的作用最关键", "a": ["对液化后的液氢储槽进行真空绝热", "采用多级节流制冷循环", "强化液化器与原料氢气的换热效果", "增加压缩机的排气压力", "", ""], "r": "B", "e": "多级节流制冷循环可有效利用不同压力级的节流效应，逐步降低氢气温度，能最大程度减少冷量损失并提高液化效率，其他选项虽有一定作用但不如它关键。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188125", "t": 1, "q": "氢基液态燃料\"甲醇\"作为氢能载体，其脱氢制氢过程的主要特点是", "a": ["脱氢反应为放热反应，无需外部供热", "可在常温常压下自发进行", "需使用贵金属催化剂，成本较高", "脱氢产物仅为氢气和二氧化碳", "", ""], "r": "C", "e": "甲醇脱氢制氢的反应原理是甲醇在催化剂作用下分解生成氢气和一氧化碳，反应方程式为：「test/yiwen_img/importSubject/2034800321544458240.png」。这个反应是吸热反应，需要外部供热才能进行，因此选项A错误。甲醇脱氢制氢的反应条件通常需要一定的温度和压力，并不是在常温常压下自发进行的，所以选项B错误。甲醇脱氢制氢的反应可以使用多种催化剂，包括铜基催化剂等，不一定需要使用贵金属催化剂，因此选项C错误。甲醇脱氢制氢的反应产物是一氧化碳和氢气，不会产生二氧化碳，所以选项D错误。但考虑到题目中只给出了四个选项，且要求选择最符合的答案，甲醇脱氢制氢过程确实需要使用催化剂，而贵金属催化剂通常成本较高，因此在这四个选项中，C是最接近正确答案的。综上所述，正确答案是C选项：“需使用贵金属催化剂，成本较高”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188126", "t": 1, "q": "氢基液态燃料\"绿氨\"（NH3）的制备中，采用可再生能源电解水制氢后，与氮气合成氨，该合成反应的工艺特点是", "a": ["吸热反应，高温（400-500摄氏度）、高压（15-30MPa）有利", "放热反应，高温（400-500摄氏度）、高压（15-30MPa）有利", "放热反应，低温（<100摄氏度）、低压（<1MPa）有利", "吸热反应，低温（<100摄氏度）、低压（<1MPa）有利", "", ""], "r": "B", "e": "合成氨反应「test/yiwen_img/importSubject/2034800321817088000.png」是放热反应，根据勒夏特列原理，高压有利于平衡正向移动，同时考虑反应速率，温度在400 - 500摄氏度合适。所以该合成反应高温（400 - 500摄氏度）、高压（15 - 30MPa）有利。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188127", "t": 1, "q": "氢基液态燃料制备中，利用绿氢与CO2进行催化反应生成甲醇（CH3OH），该反应的关键催化剂类型是?", "a": ["铂基催化剂", "铜基催化剂（如Cu-Zn-Al）", "镍基催化剂", "铁基催化剂", "", ""], "r": "B", "e": "绿氢与CO₂催化反应生成甲醇常用铜基催化剂（如Cu - Zn - Al）。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188128", "t": 1, "q": "氢基液态燃料中，利用氢气与生物质衍生物（如甘油）反应生成的液体燃料，下列哪种不属于该类燃料?", "a": ["二甲醚", "丙二醇", "乙醇", "甲醇", "", ""], "r": "A", "e": "二甲醚一般通过甲醇脱水等方法制取，并非氢气与生物质衍生物（如甘油）反应生成；丙二醇、乙醇、甲醇可通过氢气与甘油等生物质衍生物反应得到。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188129", "t": 1, "q": "氢基液态燃料中，利用氢气与CO2合成甲醇（CH3OH）的工艺中，下列哪种催化剂体系的活性和选择性最高", "a": ["Cu-Zn-Al氧化物催化剂，反应温度220-280摄氏度", "Fe-Cu合金催化剂，反应温度200-250摄氏度", "Pt-Rh贵金属催化剂，反应温度150-200摄氏度", "Ni-Co合金催化剂，反应温度300-350摄氏度", "", ""], "r": "A", "e": "通常在合成甲醇工艺里，Cu - Zn - Al氧化物催化剂是工业上广泛使用且活性和选择性较高的催化剂。低温虽利于反应平衡但反应速率低，高温可能有副反应，该催化剂在220 - 280摄氏度能较好兼顾活性与选择性。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188130", "t": 1, "q": "氢气在空气中发生爆炸时，其爆炸极限范围（体积分数）是下列哪一项", "a": ["10.0%-20.0%", "50.0%-80.0%", "4.0%-75.0%", "1.0%-5.0%", "", ""], "r": "C", "e": "氢气在空气中爆炸极限（体积分数）是4.0% - 75.0%。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188131", "t": 1, "q": "燃料电池的\"极化曲线\"反映了电池电压与电流密度的关系，其中\"浓差极化\"产生的原因是", "a": ["电池内部温度升高，导致电解质电阻增大", "电极反应速率慢，需克服活化能", "反应物（H2、O2）在电极表面浓度降低，无法满足反应需求", "电解质中离子迁移速率慢，产生欧姆压降", "", ""], "r": "C", "e": "浓差极化是因反应物在电极表面浓度降低，不能满足反应需求而产生。A是电阻影响，B是活化极化原因，D是欧姆极化原因。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800323805188132", "t": 1, "q": "燃料电池的\"极化现象\"会导致电池端电压低于理论电动势，下列哪种极化是由于电极表面化学反应速率较慢引起的", "a": ["浓度极化", "欧姆极化", "扩散极化", "活化极化", "", ""], "r": "D", "e": "活化极化是因电极表面化学反应速率慢，阻碍电荷转移致电池端电压降低。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417280", "t": 2, "q": "储氢材料的性能评价指标包括（　）", "a": ["循环稳定性（多次加氢/脱氢后性能衰减程度）", "加氢/脱氢速率", "材料的成本和毒性", "加氢/脱氢温度和压力", "", ""], "r": "ABCD", "e": "这些选项都是评价储氢材料性能的重要方面。循环稳定性体现材料长期使用性能；加氢/脱氢速率影响使用效率；成本和毒性关系到实际应用可行性；温度和压力条件影响储氢过程难易。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417281", "t": 2, "q": "储氢系统的选型需考虑的因素有（　）", "a": ["安全性要求", "使用环境（温度、压力）", "储氢量需求", "加氢/脱氢速率要求", "", ""], "r": "ABCD", "e": "储氢系统选型时，安全性是关键，要考虑其安全性要求；使用环境的温度、压力会影响储氢性能；储氢量需求决定系统规模；加氢/脱氢速率要求也会影响系统的适用性。ABCD四个因素都需考虑。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417282", "t": 2, "q": "电解水制氢的阳极反应中，不同电解技术的阳极反应式不同，下列正确的有（　）", "a": ["PEM电解水阳极:2H2O-4e-=O2↑+4H+", "碱性电解水阳极:4OH--4e-=O2↑+2H2O", "SOEC阳极（共电解）:O2--2e-=1/2O2↑", "碱性电解水阳极:2H2O-4e-=O2↑+4H+", "", ""], "r": "ABC", "e": "A 选项，PEM 质子交换膜电解槽，阳极水失去电子，生成氧气和氢离子，反应式：2H₂O-4e⁻=O₂↑+4H⁺，表述正确。<br />B 选项，碱性电解水，电解液富含 OH⁻，阳极氢氧根放电生成氧气和水，反应式：4OH⁻-4e⁻=O₂↑+2H₂O，表述正确。<br />C 选项，SOEC 固体氧化物电解槽，传导氧离子 O²⁻，阳极氧离子失电子生成氧气，反应式：O²⁻-2e⁻=1/2O₂↑，表述正确。<br />D 选项，该反应式是 PEM 电解水阳极反应，不是碱性电解水阳极反应，表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417283", "t": 2, "q": "高压气态储氢系统的设计中，为保障安全，需设置多种安全装置，下列属于该系统核心安全装置的有（　）", "a": ["氢脆监测传感器", "压力relief valve（安全阀）", "火焰arrester（阻火器）", "紧急切断阀", "", ""], "r": "BCD", "e": "高压气态储氢系统中，压力relief valve（安全阀）可防止系统超压，是保障系统压力安全的核心装置；紧急切断阀能在危险时迅速切断氢气供应，保障系统安全；火焰arrester（阻火器）可阻止火焰传播，避免爆炸等危险。而氢脆监测传感器主要是监测作用，并非核心安全装置。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417284", "t": 2, "q": "高压气态储氢系统中，为确保安全，需采取的安全防护措施有（　）", "a": ["设置多级安全泄压阀（如爆破片+安全阀）", "安装氢气泄漏检测传感器，与紧急切断阀联锁", "储氢罐表面涂覆防火涂层，提高耐高温能力", "储氢罐采用卧式布置，降低重心防止倾倒", "", ""], "r": "ABC", "e": "A可防止超压危险；B能及时发现泄漏并切断，避免事故扩大；C可提高高温下安全性；这些都是保障高压气态储氢系统安全常见措施。而储氢罐布置方式与安全防护核心关联不大。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417285", "t": 2, "q": "固态储氢材料按储氢机制可分为金属氢化物、化学氢化物、多孔材料等，下列关于不同类型固态储氢材料的说法，正确的有（　）", "a": ["化学氢化物（如NaBH4）需在催化剂作用下才能释放氢气", "金属氢化物储氢的放氢过程通常为吸热反应", "多孔材料（如活性炭）主要通过物理吸附储氢", "化学氢化物储氢的容量通常低于金属氢化物", "", ""], "r": "ABC", "e": "A项，化学氢化物（如NaBH4）一般需催化剂作用下释放氢气；B项，金属氢化物放氢时吸收热量，是吸热反应；C项，多孔材料（如活性炭）靠物理吸附储氢；D项，化学氢化物储氢容量通常高于金属氢化物。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417286", "t": 2, "q": "加氢站的安全防护措施包括（　）", "a": ["储氢区设置防火堤和防爆墙", "设置氢气泄漏检测报警系统", "所有电气设备采用防爆型", "加氢区设置避雷装置", "", ""], "r": "ABCD", "e": "ABCD选项措施都有助于加氢站的安全防护，防火堤和防爆墙可防止危险扩散，泄漏检测报警系统能及时发现氢气泄漏，防爆型电气设备可避免因电气引发爆炸，避雷装置可防止雷击带来的危险。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417287", "t": 2, "q": "加氢站的储氢方式按压力分类，可分为（　）", "a": ["高压储氢（35-70MPa），用于车辆加氢", "负压储氢（<0.1MPa），用于氢气提纯", "超高压储氢（>100MPa），用于长周期储存", "低压储氢（<10MPa），用于缓冲罐", "", ""], "r": "AD", "e": "加氢站储氢按压力分常见为高压储氢（35 - 70MPa）用于车辆加氢，低压储氢（<10MPa）用于缓冲罐。负压储氢不是常见分类方式且氢气提纯并非用此方式；超高压储氢（>100MPa）不是常规按压力分类内容。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417288", "t": 2, "q": "加氢站的工艺设备中，属于氢气处理单元的设备有（　）", "a": ["氢气干燥器（去除水分，露点≤-60摄氏度）", "加氢机（向车辆加氢）", "储氢罐（储存高压氢气）", "氢气过滤器（去除颗粒杂质，精度≤1μm）", "", ""], "r": "AD", "e": "氢气处理单元主要是对氢气进行净化等处理。A选项氢气干燥器用于去除水分，D选项氢气过滤器用于去除颗粒杂质，都属于氢气处理范畴；B选项加氢机是加氢设备，C选项储氢罐是储存设备，不属于氢气处理单元。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417289", "t": 2, "q": "加氢站的工艺系统包含氢气卸车、压缩、储存、加注等环节，下列关于各环节设备选型的说法，正确的有（　）", "a": ["压缩环节优先选用无油润滑压缩机", "储存环节对于35MPa系统，常用高压储气瓶组", "干燥环节需采用吸附式干燥机，且干燥剂需定期再生", "氢气卸车环节通常采用卸车压缩机或增压泵", "", ""], "r": "ABCD", "e": "A选项，无油润滑压缩机可避免油污染氢气，压缩环节优先选用合理；B选项，35MPa系统常用高压储气瓶组储存氢气正确；C选项，吸附式干燥机可有效干燥氢气，干燥剂需定期再生保证效果；D选项，氢气卸车环节常用卸车压缩机或增压泵实现氢气转移。各选项说法均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417290", "t": 2, "q": "加氢站的核心设备包括（　）", "a": ["安全监控系统", "氢气压缩机", "加氢机", "氢气干燥净化装置", "", ""], "r": "BCD", "e": "加氢站核心设备用于氢气处理、存储和加注，氢气压缩机用于压缩氢气，加氢机用于给车辆加氢，氢气干燥净化装置保障氢气质量，而安全监控系统是保障安全的辅助系统。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417291", "t": 2, "q": "加氢站的控制系统需实现对各工艺环节的实时监控和联锁保护，下列属于加氢站核心联锁保护功能的有（　）", "a": ["卸车环节压力差过大时，自动减缓卸车速度", "加氢机加注压力达到设定值时，自动停止加注", "储氢罐压力超限时，自动开启安全阀泄压", "检测到氢气泄漏浓度超标时，自动切断氢气供应", "", ""], "r": "BCD", "e": "核心联锁保护功能是保障加氢站安全运行的关键，需能及时应对危险情况。A只是减缓卸车速度，未从根本上消除危险；B、C、D分别针对加注压力、储氢罐压力和氢气泄漏等危险情况，采取停止加注、泄压、切断供应等措施保障安全。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417292", "t": 2, "q": "加氢站的控制系统中，属于\"安全联锁\"功能的有（　）", "a": ["加氢机与车辆断开连接时，自动关闭加氢枪阀门", "储氢罐压力超过设计压力时，自动开启安全阀泄压", "电网电压波动超过±10%时，自动切换备用电源", "压缩机出口温度超过120摄氏度时，自动停机", "", ""], "r": "ABD", "e": "安全联锁是指在特定危险情况发生时，系统自动采取措施保障安全。A防止加氢枪泄漏；B避免储氢罐超压危险；D防止压缩机因高温损坏或引发事故。而C是针对电网电压波动的电源切换，并非直接针对加氢站安全危险的联锁 。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417293", "t": 2, "q": "加氢站的氢气来源包括（　）", "a": ["附近工业企业（如炼化厂）副产氢输送的氢气", "外部制氢厂通过长管拖车输送的氢气", "加氢站自建电解水制氢装置生产的氢气", "通过氢气管道输送的管网氢气", "", ""], "r": "ABCD", "e": "加氢站氢气来源多样，工业副产氢、长管拖车运输、站内电解水制氢、管道输送氢气都是常见方式。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417294", "t": 2, "q": "加氢站的氢气质量需满足GB/T 37244《质子交换膜燃料电池汽车用燃料氢气》要求，其关键指标有（　）", "a": ["一氧化碳含量≤0.2μmol/mol", "氢气纯度≥99.97%（体积分数）", "水分含量≤5μmol/mol（露点≤-60摄氏度）", "甲烷含量≤10μmol/mol", "", ""], "r": "ABC", "e": "按 GB/T 37244-2018《质子交换膜燃料电池汽车用燃料氢气》：<br />氢气纯度（摩尔分数）≥ 99.97%​ → B 对<br />CO ≤ 0.2 μmol/mol​ → A 对<br />水分（H₂O）≤ 5 μmol/mol（对应露点约 ≤-60℃） → C 对<br />甲烷（CH₄）单类限值 ≤ 100 μmol/mol，且总烃（以C1计）≤2 μmol/mol；题干写“甲烷≤10μmol/mol”严于国标但数值本身不是国标限值，若按“关键指标”严格对照国标则 D 错（国标是100不是10）；若题目表述为“甲烷含量≤10μmol/mol”作为某企业内控可算对，但问GB/T37244则不匹配。", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417295", "t": 2, "q": "加氢站的应急救援预案中，需包含的应急处置程序有（　）", "a": ["电网停电应急处置（启动备用发电机、保障控制电源）", "人员冻伤应急处置（接触液态氢时，温水复温）", "氢气泄漏应急处置（断源、通风、疏散）", "氢气火灾应急处置（断源、惰性气体灭火、冷却保护）", "", ""], "r": "ABCD", "e": "加氢站应急救援预案要涵盖常见应急情况处置程序，ABCD 选项分别对应电网停电、人员冻伤、氢气泄漏、氢气火灾这些可能出现的应急场景处置。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417296", "t": 2, "q": "甲烷水蒸气重整（SMR）制氢工艺包含\"重整反应\"和\"水煤气变换反应\"两个核心反应阶段，下列关于这两个阶段的说法，正确的有（　）", "a": ["水煤气变换反应是放热反应，目的是将CO转化为CO2和H2", "重整反应是吸热反应，需在高温（700-900℃）下进行", "两个反应阶段均需使用镍基催化剂", "水煤气变换反应需在高压（3-5MPa）下进行以提高反应速率", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417297", "t": 2, "q": "碱性燃料电池（AFC）曾用于航天领域，但其在民用领域应用受限，下列属于AFC应用受限原因的有（　）", "a": ["工作温度较高（150-200℃），对材料要求高", "电解质（KOH溶液）易吸收空气中的CO2，导致性能衰减", "催化剂需使用贵金属（如铂），成本高", "输出功率密度较低，难以满足民用设备需求", "", ""], "r": "BCD", "e": "碱性燃料电池工作温度低，A错误；其电解质易吸收CO₂致性能衰减，催化剂用贵重金属成本高，输出功率密度也难满足民用需求，B、C、D正确。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417298", "t": 2, "q": "金属氢化物储氢材料的性能指标中，影响其实际应用的关键指标有（　）", "a": ["材料成本（如LaNi5成本≤50元/kg）", "储氢密度（质量储氢密度≥1.5wt%，体积储氢密度≥60kg/m³）", "充放氢循环寿命（≥1000次循环，容量衰减<20%）", "材料的毒性（如无重金属元素，环境友好）", "", ""], "r": "ABCD", "e": "材料成本、储氢密度、充放氢循环寿命、材料毒性都会对金属氢化物储氢材料实际应用产生关键影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417299", "t": 2, "q": "金属氢化物储氢系统中，为控制释氢温度，可采取的措施有（　）", "a": ["释氢时加热储氢罐（如电加热、余热加热）", "释氢时向系统中通入惰性气体（如氮气），稀释氢气", "在储氢材料中添加导热材料（如铜粉），提高散热效率", "采用多罐并联结构，轮流释氢", "", ""], "r": "ACD", "e": "控制释氢温度需考虑升温或降温等方式。A可加热升温；B通入惰性气体与控制释氢温度无关；C提高散热效率可控制温度；D轮流释氢利于维持合适温度。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417300", "t": 2, "q": "氢安全标准体系涵盖的内容包括（　）", "a": ["氢能应用设备（如燃料电池、加氢机）安全标准", "氢安全应急处置标准", "氢气生产、储存、运输安全标准", "氢气检测与报警设备标准", "", ""], "r": "ABCD", "e": "氢安全标准体系要全面保障氢能全流程安全，涵盖生产、储存、运输，应用设备，检测报警及应急处置等方面。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417301", "t": 2, "q": "氢安全管理中，氢气的爆炸极限范围较宽，下列关于氢气爆炸极限及安全控制措施的说法，正确的有（　）", "a": ["氢气爆炸的最小点火能量较低，需严格控制静电和明火", "降低环境中氧气浓度至10%以下，可避免氢气爆炸", "氢气泄漏后，通风换气可降低其浓度至爆炸极限以外", "采用惰性气体（如氮气）稀释氢气，可缩小爆炸极限范围", "", ""], "r": "ACD", "e": "氢气爆炸最小点火能量低，易被静电和明火点燃，A正确；一般环境中降低氧气浓度至12%以下才可能避免氢气爆炸，B错误；通风换气能降低泄漏氢气浓度到爆炸极限外，C正确；用惰性气体稀释氢气可缩小其爆炸极限范围，D正确。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417302", "t": 2, "q": "氢安全管理中，属于氢气的危险特性有（　）", "a": ["点火能量低（约0.02mJ，易被静电点燃）", "燃烧速度快（约2.8m/s，是天然气的7倍）", "爆炸极限范围宽（4%-75%体积分数）", "液态氢的低温冻伤风险（沸点-252.87摄氏度）", "", ""], "r": "ABCD", "e": "氢气点火能量低易被静电点燃、燃烧速度快、爆炸极限范围宽，且液态氢温度极低有冻伤风险，ABCD选项均体现了氢气的危险特性。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417304", "t": 2, "q": "氢安全应急处置中，当发生氢气火灾时，下列应急处置措施正确的有（　）", "a": ["首先切断氢气气源，阻止火势扩大", "若储氢容器起火，需冷却容器壁，防止容器爆炸", "严禁用水直接喷射氢气火焰，防止氢气扩散", "若火势较小，可使用干粉灭火器或CO2灭火器灭火", "", ""], "r": "ABD", "e": "发生氢气火灾，切断气源可阻止火势，A正确；储氢容器起火冷却容器壁能防爆炸，B正确；用水喷射可冷却降温，不是严禁，C错误；火势小可用干粉或CO₂灭火器，D正确。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417305", "t": 2, "q": "氢安全应急管理中，对氢气火灾的处置原则包括（　）", "a": ["禁止用水直接喷射火焰，防止氢气扩散", "冷却周围设备和建筑物，防止次生灾害", "火灾扑灭后，需持续通风检测，防止氢气积聚", "优先切断气源，使火焰自行熄灭", "", ""], "r": "ABCD", "e": "氢气火灾的处置需要特别小心，因为氢气是极易燃烧和爆炸的气体。以下是对每个选项的A. 禁止用水直接喷射火焰，防止氢气扩散。这是正确的，因为水可能会将氢气推向更广的区域，增加爆炸的风险。B. 冷却周围设备和建筑物，防止次生灾害。这也是正确的，冷却可以防止火势蔓延和设备损坏，从而减少次生灾害的可能性。C. 火灾扑灭后，需持续通风检测，防止氢气积聚。这同样是正确的，氢气是无色无味的气体，容易积聚形成爆炸性混合物，因此需要持续通风和检测。D. 优先切断气源，使火焰自行熄灭。这是处理气体火灾的基本原则之一，切断气源可以从根本上解决问题。综上所述，所有选项都是氢气火灾处置的正确原则。所以，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417306", "t": 2, "q": "氢安全应急管理中，人员急救措施正确的有（　）", "a": ["眼睛接触液态氢:立即用生理盐水冲洗，持续10分钟", "氢气爆炸冲击伤:先止血、固定骨折，再处理烧伤", "氢气火焰灼伤:立即用大量冷水冲洗，持续15-20分钟", "液态氢冻伤:立即将冻伤部位放入37-40摄氏度温水中复温", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417307", "t": 2, "q": "氢的爆炸风险控制中，可采取的预防措施有（　）", "a": ["控制氢气泄漏量，确保泄漏速率<0.1m³/min", "使用防爆型电气设备（如Ex d IIB T1）", "避免产生静电（如接地、防静电服装）", "限制氢气储存量，单个储氢罐容积<10m³", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417308", "t": 2, "q": "氢的低温液化过程中，为降低能耗，通常会采用多种节能措施，下列属于该过程节能措施的有（　）", "a": ["采用多组分制冷剂循环替代单一制冷剂循环", "回收透平膨胀机输出的功用于驱动压缩机", "减少系统漏热，采用高性能绝热材料", "利用液化后液氢的冷量预冷原料氢气", "", ""], "r": "ABCD", "e": "A项多组分制冷剂循环能提高制冷效率降低能耗；B项回收透平膨胀机输出功驱动压缩机可节能；C项用高性能绝热材料减少系统漏热，避免额外能耗；D项利用液氢冷量预冷原料氢气，实现冷量回收利用降低能耗，ABCD均是节能措施。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417309", "t": 2, "q": "氢的低温液化过程中，需去除的杂质有（　）", "a": ["氮气（N2）", "二氧化碳（CO2）", "一氧化碳（CO）", "水分（H2O）", "", ""], "r": "ABCD", "e": "A. 氮气（N₂）  氮气在低温下易凝华，会堵塞低温换热器，且其沸点（77K）与氢（20K）接近，需在液化前通过吸附或低温分离等方式去除。<br />B. 二氧化碳（CO₂）  二氧化碳在低温下会凝固成干冰，严重堵塞管道和设备，因此必须去除。<br />C. 一氧化碳（CO）  一氧化碳的沸点（81K）与氢（20K）接近，且在低温下会凝固，同样需要去除，以防堵塞。<br />D. 水分（H₂O）  水在低温下会结冰，堵塞管道和阀门，是必须去除的杂质之一，通常通过干燥或吸附去除。", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417310", "t": 2, "q": "氢的低温液化系统中，为减少冷量损失，需采取的保温措施有（　）", "a": ["在绝热层中填充珠光砂，提高保温效果", "液化设备外壳采用不锈钢材质，防止腐蚀", "液化罐设置压力释放阀，防止超压", "管道采用\"冷桥阻断\"设计，减少热量传导", "", ""], "r": "AD", "e": "本题是要找出减少冷量损失的保温措施。 A选项，在绝热层中填充珠光砂，珠光砂是良好的保温材料，能提高保温效果，减少冷量损失。 B选项，液化设备外壳采用不锈钢材质主要是为了防止腐蚀，而非减少冷量损失。 C选项，液化罐设置压力释放阀是为了防止超压，保障安全，与冷量损失无关。 D选项，管道采用“冷桥阻断”设计，可减少热量传导，从而减少冷量损失。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417311", "t": 2, "q": "氢的管道输送中，为防止管道氢脆，可采取的措施有（　）", "a": ["定期对管道进行水压试验，检测氢脆裂纹", "采用抗氢脆材料（如316L不锈钢、钛合金）", "控制管道内氢气的压力（≤10MPa）和温度（≥0摄氏度）", "在氢气中加入少量氧气（0.1%-0.5%），形成氧化膜保护", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417312", "t": 2, "q": "氢的输送方式中，适合短距离（<100km）、小规模（<1万吨/年）输送的有（　）", "a": ["高压气态储氢罐车（35/70MPa）", "氢气管道（直径<100mm）", "液态氢槽车（-253摄氏度）", "吸附储氢气瓶组", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417314", "t": 2, "q": "氢低温液化过程中，制冷循环的主要组成部分包括（　）", "a": ["换热器", "膨胀机", "压缩机", "储液器", "", ""], "r": "ABC", "e": "氢低温液化制冷循环需实现热量交换、气体膨胀降温及压缩增压等，换热器用于热量交换，膨胀机使气体膨胀降温，压缩机实现气体压缩增压，它们是主要组成部分，储液器不是制冷循环核心组成。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417315", "t": 2, "q": "氢低温液化系统中，需要采取保冷措施的设备和部件有（　）", "a": ["原料氢气压缩机", "液化器", "液氢储槽", "氢气输送管道（从液化器到储槽）", "", ""], "r": "BCD", "e": "氢低温液化系统中，液化器、液氢储槽及氢气输送管道都涉及低温液氢，需保冷；而原料氢气压缩机处理常温氢气，无需保冷。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800325256417316", "t": 2, "q": "氢低温液态储氢的缺点有（　）", "a": ["液化过程能耗高，约占氢气能量的30%-40%", "液氢运输过程中易发生泄漏，安全性低", "液氢储槽冷损大，需定期补充冷量", "液氢体积储氢密度低于高压气态储氢", "", ""], "r": "ABC", "e": "氢低温液态储氢时液化过程能耗高、运输易泄漏不安全、储槽冷损大需补冷量，A、B、C是其缺点；而液氢体积储氢密度高于高压气态储氢，D错误。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317504", "t": 3, "q": "绿氢是指通过可再生能源电解水制氢，其全生命周期碳排放为零，因此无需考虑电解槽制造和电网间接排放。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然绿氢是用可再生能源电解水制氢，但电解槽制造过程会产生碳排放，且即便使用可再生能源，也可能存在电网间接排放等情况，不能说无需考虑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317505", "t": 3, "q": "储氢容器的水压试验应定期进行，试验压力通常为容器设计压力的1.5倍，以检测其耐压性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "储氢容器定期做水压试验可检测耐压性，试验压力一般为设计压力1.5倍是常见安全要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317506", "t": 3, "q": "储氢系统中，有机液态储氢的加氢/脱氢反应速率比金属氢化物储氢更快，因此更适合需要快速供氢的场景。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317507", "t": 3, "q": "电解水制氢的电解质浓度越高，离子传导率越高，电解效率越高，因此电解质浓度应尽可能高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然电解质浓度在一定范围内升高，离子传导率和电解效率会提高，但浓度过高会带来如增加溶液黏度、导致电极腐蚀加剧等问题，反而不利于电解过程，所以并非浓度应尽可能高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317508", "t": 3, "q": "电解水制氢的电流密度越高，电解效率越高，因此工业电解槽通常采用极高的电流密度（>10000A/m²）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然一般在一定范围内电流密度提高会使电解效率上升，但过高电流密度会带来诸多问题，如增加能耗、产生过多热量等，工业上不会采用极高电流密度（>10000A/m²）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317509", "t": 3, "q": "电解水制氢工艺中，采用固体氧化物电解质（SOEC）的电解效率高于碱性电解质，因此SOEC更适合大规模绿氢生产。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "SOEC电解效率高，大规模绿氢生产需考虑效率等因素，效率高利于大规模生产。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317510", "t": 3, "q": "电解水制氢工艺中，电流密度越高，电解效率越高，因此应尽可能提高电流密度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电流密度过高会导致能耗增加、电极损耗加剧等问题，并非电流密度越高电解效率就越高，不能一味提高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317511", "t": 3, "q": "高压气态储氢容器的工作压力越高，单位质量储氢密度越高，因此未来储氢容器的发展方向是无限提高工作压力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然高压气态储氢容器工作压力越高，单位质量储氢密度越高，但无限提高工作压力不现实，会带来安全隐患，且对容器材料和制造工艺要求极高，成本大幅增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317512", "t": 3, "q": "高压气态储氢容器的设计压力越高，其单位体积的储氢质量分数越大，因此储氢压力应尽可能提高以增加储氢量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然高压气态储氢容器设计压力越高单位体积储氢质量分数越大，但过高压力会带来容器安全隐患，增加制造成本和运行风险等，所以不能单纯为增加储氢量而尽可能提高储氢压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317513", "t": 3, "q": "高压气态储氢系统中，储氢罐的设计压力为70MPa，因此实际使用中可长期在70MPa压力下运行，无需降压。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然储氢罐设计压力为70MPa，但实际使用中为保障安全，不能长期在设计压力下运行，需适当降压。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317514", "t": 3, "q": "固态储氢材料的循环稳定性越好，材料的使用寿命越长，因此循环稳定性是评价储氢材料的核心指标之一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "循环稳定性好意味着材料在多次吸放氢循环中性能稳定，不易失效，能使用更久，所以是评价储氢材料的核心指标之一。", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317515", "t": 3, "q": "固态储氢材料中的\"金属有机框架材料（MOFs）\"储氢主要依赖物理吸附，其储氢容量受温度和压力影响较大，在常温常压下储氢容量较低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属有机框架材料（MOFs）储氢靠物理吸附，其储氢容量和温度、压力关系紧密，常温常压下分子间作用力弱，储氢容量低。", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317516", "t": 3, "q": "固体氧化物电解池（SOEC）制氢时，工作温度越高，电解电压越低，电解效率越高，因此SOEC的工作温度应尽可能提高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然工作温度升高会使电解电压降低、效率提高，但过高温度会带来材料性能下降、设备寿命缩短等问题，所以不能无限制提高工作温度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317517", "t": 3, "q": "固体氧化物电解水（SOOE）制氢的工作温度高于质子交换膜电解水（PEME），因此SOE的电解效率更低，能耗更高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然SOOE工作温度高于PEME，但高温下离子传导性更好，反应动力学更有利，SOOE电解效率更高、能耗更低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317518", "t": 3, "q": "固体氧化物燃料电池（SOFC）的电解质为固体，无电解液泄漏风险，因此SOFC的结构更紧凑，维护更简单。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "固体氧化物燃料电池（SOFC）电解质是固体，避免了电解液泄漏问题，这使得其结构设计更易紧凑，且减少了因电解液相关问题带来的维护工作，维护更简单。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317519", "t": 3, "q": "固体氧化物燃料电池（SOFC）可直接使用甲烷、丙烷等烃类燃料，无需先将其转化为氢气，原因是阳极的Ni催化剂可催化烃类重整反应。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "固体氧化物燃料电池（SOFC）阳极的Ni催化剂能催化烃类重整反应，所以可直接使用甲烷、丙烷等烃类燃料，无需先转化为氢气。", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317520", "t": 3, "q": "加氢站的安全监控系统中，氢气泄漏检测传感器应安装在地面附近，因为氢气密度小，泄漏后会向上扩散。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "氢气密度小，泄漏后向上扩散，所以氢气泄漏检测传感器应安装在较高位置而非地面附近。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317521", "t": 3, "q": "加氢站的储氢罐应采用防爆设计，即使发生爆炸，也能控制爆炸碎片的飞溅范围，减少事故影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "加氢站储氢罐储存氢气，氢气易燃易爆，采用防爆设计可降低爆炸风险，且能控制爆炸碎片飞溅范围、减少事故影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317522", "t": 3, "q": "加氢站的高压储氢罐采用碳纤维全缠绕复合材料，主要原因是该材料的抗氢脆性能优于金属材料（如不锈钢）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "碳纤维全缠绕复合材料抗氢脆性能好于金属材料，能避免因氢脆导致的安全问题，所以加氢站高压储氢罐采用它。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317523", "t": 3, "q": "加氢站的加氢机应具备压力自适应功能，可根据车载储氢系统的压力自动调节加注压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "为保障加氢安全和高效，加氢站的加氢机通常需具备压力自适应功能，能依据车载储氢系统压力自动调节加注压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317524", "t": 3, "q": "加氢站的加氢机与燃料电池汽车连接时，需通过NFC或蓝牙进行身份认证，确保只有符合标准的车辆才能加氢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317525", "t": 3, "q": "加氢站的加氢机在加注过程中，为防止氢气温度过高，需采用冷却系统对氢气进行降温，因为氢气压缩过程会产生压缩热。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "氢气在压缩过程会产生压缩热，为防止加氢时氢气温度过高，加氢机通常需用冷却系统对氢气降温。", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317526", "t": 3, "q": "加氢站的紧急切断阀在发生氢气泄漏时，需人工操作关闭，无法自动切断氢气供应。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "加氢站的紧急切断阀具备自动和手动两种操作模式，发生氢气泄漏等紧急情况时，可自动切断氢气供应。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317527", "t": 3, "q": "加氢站的氢气干燥环节中，吸附式干燥机使用的干燥剂（如分子筛）吸附水分达到饱和后，需通过加热或降压的方式进行再生，以恢复吸附能力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "吸附式干燥机的干燥剂吸附水分饱和后，确实可通过加热或降压等方式使吸附的水分脱附，从而恢复其吸附能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317528", "t": 3, "q": "加氢站的氢气干燥器采用分子筛吸附脱水，其露点可降至-60摄氏度以下，满足PEMFC对氢气水分的要求（≤5μmol/mol）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "分子筛吸附脱水是加氢站常用的氢气干燥方式，能有效降低氢气水分，可使露点降至 -60 摄氏度以下，此条件下氢气水分能满足 PEMFC 对氢气水分 ≤5μmol/mol 的要求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317529", "t": 3, "q": "加氢站的氢气输送管道应采用不锈钢材质，因为不锈钢具有良好的抗氢脆性能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "不锈钢有良好的抗氢脆性能，能保证加氢站氢气输送安全，所以加氢站氢气输送管道常采用不锈钢材质。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317530", "t": 3, "q": "加氢站的氢气压缩机采用隔膜式压缩机，其优点是无油污染，可保证氢气纯度，适合PEMFC用氢的压缩。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "隔膜式压缩机工作时，膜片将介质与传动部件隔开，避免了油等污染物混入氢气，能保证氢气纯度，很适合为质子交换膜燃料电池（PEMFC）用氢进行压缩。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317531", "t": 3, "q": "加氢站中，高压储氢瓶组的作用是储存高压氢气，调节加氢站的氢气供需平衡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "高压储氢瓶组能存储高压氢气，可在氢气供应过多时储存，需求大时释放，起到调节加氢站氢气供需平衡的作用。", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317532", "t": 3, "q": "加氢站中，氢气的干燥净化过程应在氢气增压之前进行，以避免杂质对压缩机的磨损。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在加氢站里，先对氢气干燥净化可去除杂质，防止其进入压缩机，减少对压缩机的磨损，所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317533", "t": 3, "q": "甲烷水蒸气重整制氢工艺中，后续的\"变压吸附（PSA）\"环节主要作用是脱除氢气中的CO2，对CO的脱除效果较差，需先通过水煤气变换反应将CO转化为CO2。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在甲烷水蒸气重整制氢工艺里，PSA环节能有效脱除氢气中多种杂质包括CO和CO₂ ，但对CO脱除效果有限，所以要先通过水煤气变换反应把CO转化成更易脱除的CO₂ 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317534", "t": 3, "q": "甲烷蒸汽重整制氢的产物主要为H2和CO2，其中CO2可通过CCS技术捕集，因此该工艺可用于制备\"蓝氢\"。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“蓝氢”是指利用化石燃料制氢并对副产的二氧化碳进行捕集和封存（CCS）的氢气。甲烷蒸汽重整制氢产物含H₂和CO₂，能用CCS技术捕集CO₂，符合“蓝氢”制备特征。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317535", "t": 3, "q": "甲烷蒸汽重整制氢的反应温度通常控制在700-900℃，此温度下催化剂活性最高，甲烷转化率也最高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "甲烷蒸汽重整制氢反应在700 - 900℃时，催化剂能有较好活性，可促使反应正向进行，实现较高的甲烷转化率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317536", "t": 3, "q": "甲烷蒸汽重整制氢工艺中，配套碳捕集与封存（CCUS）后，可实现\"蓝氢\"生产，其碳排放与绿氢相当。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蓝氢是指使用化石燃料制氢并结合CCUS技术减少碳排放，但即便如此，其碳排放也无法与通过可再生能源电解水制取的绿氢相当，绿氢基本无碳排放。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317537", "t": 3, "q": "甲烷蒸汽重整制氢工艺中，水碳比（H2O/CH4）越高，甲烷转化率越高，且积碳风险越低，因此水碳比应尽可能提高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽水碳比升高会使甲烷转化率提高、积碳风险降低，但过高水碳比会增加能耗和设备成本等，并非应尽可能提高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317538", "t": 3, "q": "甲烷蒸汽重整制氢工艺中，蒸汽与甲烷的摩尔比（S/C比）越高，甲烷转化率越高，因此实际生产中应尽可能提高S/C比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然S/C比升高会使甲烷转化率提高，但实际生产中提高S/C比会增加能耗、设备成本等，并非越高越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317539", "t": 3, "q": "在碱性电解水制氢工艺中，阴极产生氧气，阳极产生氢气，因此需对两极产物进行分离。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "碱性电解水制氢工艺中，阴极产生氢气，阳极产生氧气，题干说法电极与产物对应错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317540", "t": 3, "q": "碱性燃料电池（AFC）的电解质为液态氢氧化钾溶液，因此电池系统需严格密封，防止电解质泄漏，这增加了系统的复杂度和重量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "碱性燃料电池（AFC）确实以液态氢氧化钾溶液作电解质，因液体易泄漏，所以需严格密封，而密封措施会增加系统复杂度和重量。", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317541", "t": 3, "q": "金属氢化物储氢材料的储氢容量主要取决于材料中金属与氢的化学计量比，与材料的比表面积无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属氢化物储氢容量确实主要由金属与氢化学计量比决定，但比表面积也会影响吸放氢动力学等过程，一定程度上对储氢容量也有影响，并非无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317542", "t": 3, "q": "金属氢化物储氢材料LaNi5在充氢过程中会放热，因此充氢时需对储氢罐进行冷却，以防止温度过高影响储氢容量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属氢化物储氢时是一个放热过程，温度升高会使平衡向脱氢方向移动，影响储氢容量，所以充氢时需冷却。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317543", "t": 3, "q": "金属氢化物储氢的质量储氢密度通常高于高压气态储氢（35MPa约4wt%），因此更适合燃料电池汽车车载储氢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属氢化物储氢质量储氢密度往往高于35MPa高压气态储氢的约4wt%，且其储氢容器压力低、安全性好，更契合燃料电池汽车车载储氢需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317544", "t": 3, "q": "金属氢化物储氢系统的充放氢循环寿命通常超过1000次，且循环后储氢容量衰减<20%，适合长期反复使用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属氢化物储氢系统具备充放氢循环寿命长、循环后储氢容量衰减小的特点，确实适合长期反复使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317545", "t": 3, "q": "金属有机框架（MOFs）储氢材料属于物理吸附储氢，其储氢容量受温度和压力的影响较大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属有机框架（MOFs）储氢是通过物理吸附作用储存氢气，其储氢容量与温度和压力密切相关，温度和压力变化会显著影响其储氢量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317546", "t": 3, "q": "氢安全标准体系中，对氢气的生产、储存、运输、应用等环节均有明确规定，因此只要遵循标准，氢能应用无安全风险。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然氢安全标准体系对氢气各环节有明确规定，但遵循标准只能降低安全风险，不能完全消除。因为在实际应用中，还可能存在标准未涵盖的特殊情况、人为操作失误、不可预见的外部因素等，都会带来安全隐患。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317547", "t": 3, "q": "氢安全标准中，氢气环境的爆炸危险区域划分主要依据氢气的泄漏量和扩散速度，与环境通风条件无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "氢气环境的爆炸危险区域划分不仅与氢气的泄漏量和扩散速度有关，环境通风条件也起着关键作用，良好的通风可降低氢气浓度，减少爆炸风险。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317548", "t": 3, "q": "氢安全应急处置中，当氢气火灾无法立即切断气源时，应优先灭火，防止火势蔓延，再尝试切断气源。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。在氢安全应急处置中，当氢气火灾无法立即切断气源时，不能盲目灭火，应保持稳定燃烧，防止氢气泄漏积聚形成爆炸性混合物，待条件允许时再尝试切断气源。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317549", "t": 3, "q": "氢安全应急管理中，当检测到氢气泄漏时，应立即开启所有通风设备，同时关闭附近的火源和电气设备，防止发生爆炸。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "氢气是易燃易爆气体，检测到泄漏后，开启通风设备可降低氢气浓度，关闭火源和电气设备能避免产生火花引发爆炸，做法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317550", "t": 3, "q": "氢安全应急管理中，当氢气火灾无法切断气源时，应持续喷水冷却周围设备，直至火焰自行熄灭。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当氢气火灾无法切断气源时，持续喷水冷却周围设备，防止周围设备因高温损坏引发更大危险，让火焰自行熄灭是合理的应对措施。", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317551", "t": 3, "q": "氢的低温液化过程中，由于氢气的焦耳-汤姆逊系数在常温下为正值，因此可通过单纯的节流膨胀实现氢气液化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "氢气的焦耳 - 汤姆逊系数在常温下虽为正值，但节流膨胀的制冷效果有限，仅靠单纯节流膨胀不能实现氢气液化，还需先预冷等操作。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317552", "t": 3, "q": "氢的低温液化过程中，正-仲氢转化会释放热量，若不及时移除，会导致已液化的氢重新汽化，因此需在液化流程中加入催化剂促进转化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在氢的低温液化中，正 - 仲氢转化确实会放热，若热量不及时移除会使已液化氢重新汽化，加催化剂促进转化可提前释放热量，减少后续麻烦。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800329895317553", "t": 3, "q": "氢的低温液化能耗约为30-40kWh/kg，其中约70%的能耗用于制冷系统的压缩和膨胀过程，而非克服氢的蒸发热。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "从所给内容看，它清晰阐述了氢低温液化能耗情况及能耗主要用途，该描述符合相关知识，表述合理。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第9章 氢能科学与技术（2）", "n": "基础练习题【含解析】 / 第9章 氢能科学与技术（2）", "qs": [{"id": "2034800334311919616", "t": 1, "q": "下列关于高压气态储氢容器的说法，正确的是", "a": ["碳纤维缠绕复合容器的重量比强度低于全金属容器", "氢气在容器内的储存压力不受环境温度影响", "储氢容器的工作压力越高，单位体积储氢量线性增加", "储氢容器需定期进行水压试验，检测其耐压性能", "", ""], "r": "D", "e": "A项碳纤维缠绕复合容器重量比强度高于全金属容器；B项氢气储存压力受环境温度影响，温度升高压力增大；C项工作压力与单位体积储氢量并非线性关系。而储氢容器需定期水压试验检测耐压性能。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919617", "t": 1, "q": "下列关于固态储氢材料中\"氢脆\"现象的说法，正确的是", "a": ["降低储氢材料的工作温度可完全避免氢脆", "氢脆会使储氢材料的强度和韧性显著提高", "氢脆是由于氢原子进入材料晶格导致晶格畸变引起的", "氢脆仅发生在金属储氢材料中，有机储氢材料无此现象", "", ""], "r": "C", "e": "降低工作温度不能完全避免氢脆，A错误；氢脆会降低储氢材料强度和韧性，B错误；氢脆不仅发生在金属储氢材料，有机储氢材料也可能有，D错误；氢脆是氢原子进入材料晶格致晶格畸变引起，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919618", "t": 1, "q": "下列关于氢低温液化过程中\"预冷阶段\"的说法，正确的是", "a": ["预冷阶段可完全替代主制冷循环的作用", "预冷阶段通常采用液氮作为冷源", "预冷阶段会使氢气发生部分液化", "预冷阶段的目的是将原料氢气温度降至-100℃以下", "", ""], "r": "B", "e": "预冷阶段常以液氮作冷源，A 预冷不能完全替代主制冷循环；C 预冷阶段氢气一般不部分液化；D 预冷是将氢气降到约 80K（-193℃），不是 -100℃以下。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919619", "t": 1, "q": "下列关于氢基液态燃料二甲醚（DME）制备的说法，正确的是", "a": ["以氢气和CO2为原料，直接合成DME，反应温度200-250摄氏度", "以氢气和CO为原料，通过甲醇脱水反应制备，需要特定催化剂参与", "DME制备过程中，氢气的消耗量低于合成甲醇，成本更低", "DME的体积能量密度与柴油相当，可作为替代燃料用于内燃机", "", ""], "r": "B", "e": "B. 正确：二甲醚（DME）的主流制备工艺之一是以氢气和一氧化碳（合成气）为原料，经甲醇合成催化剂（如铜基催化剂）和甲醇脱水催化剂（如γ-氧化铝或分子筛）组成的双功能催化剂体系，通过“一步法”或“两步法”实现甲醇的合成与脱水，最终制得DME。<br />A. 错误：以氢气和CO₂为原料直接合成DME确实存在，但根据热力学研究，其反应温度通常在150℃至350℃之间，典型优化条件为260℃左右。选项将温度范围限定在“200-250摄氏度”，过于狭窄且不准确。<br />C. 错误：由CO₂加氢制DME的路径中，无论是“一步法”还是“两步法”，都涉及甲醇的合成（CO₂ + 3H₂ → CH₃OH + H₂O），其氢气消耗量在化学计量上并不低于合成甲醇，因此“氢气消耗量低于合成甲醇”的说法缺乏依据。<br />D. 错误：二甲醚的体积能量密度并不与柴油相当。按热值计算，DME的热值仅为柴油的约64.7%，且液体密度也低于柴油（约柴油的78.5%），这意味着要达到相同动力性，需要更大的燃料供给量。<br /><br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919620", "t": 1, "q": "下列关于氢气输送管道的说法，错误的是", "a": ["氢气管道可与天然气管道共用同一管廊，但需保持安全距离", "氢气输送管道的内壁粗糙度应尽可能低，以减少压力损失", "氢气管道的阀门应选用专用的氢气阀门，防止氢脆", "长距离氢气管道输送时，无需考虑氢气的扩散损失", "", ""], "r": "D", "e": "长距离氢气管道输送时，氢气分子小、扩散性强，必须考虑氢气的扩散损失，D选项说法错误。A选项氢气与天然气管道可同管廊但要安全距离；B选项低内壁粗糙度可减少压力损失；C选项用专用阀门防氢脆均正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919621", "t": 1, "q": "下列关于吸附储氢的说法，错误的是", "a": ["吸附储氢的体积储氢密度可接近液态氢，但质量储氢密度较低", "吸附储氢需在低温（-196摄氏度，液氮温度）下进行，常温下吸附量极低", "吸附储氢的优势是充放氢速度快，无材料疲劳问题", "吸附储氢依靠活性炭、MOFs（金属有机框架）等材料的物理吸附作用", "", ""], "r": "C", "e": "A 正确，低温吸附储氢体积储氢密度可接近液氢；B 正确，物理吸附储氢常温吸附容量很低，常需要液氮低温环境；C 错误，吸附储氢充放氢速率一般偏慢，多次循环会存在材料结构衰减、疲劳问题；D 正确，活性炭、MOFs 依靠物理吸附储存氢气。", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919622", "t": 1, "q": "下列关于液态储氢的说法，正确的是", "a": ["液态氢的体积储氢密度约70kg/m³，高于35MPa高压气态储氢（约23kg/m³）", "液态氢的蒸发损失率通常<0.1%/天，无需额外补冷", "液态氢的储存容器需采用低温不锈钢材质，以保证安全性和耐久性", "液态氢的输送管道需要设计为低温、高压，并且必须采取保温措施", "", ""], "r": "A", "e": "A项液态氢体积储氢密度高，表述正确；B项液态氢蒸发损失率需补冷；C项储存容器常用绝热材料；D项液态氢输送管道是低温但非高压。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919623", "t": 1, "q": "下列关于质子交换膜电解水（PEMWE）制氢的说法，错误的是", "a": ["阴极反应为2H2O+2e- = H2↑+2OH-", "工作温度通常为80-100摄氏度，启动速度快", "电解质为质子交换膜，仅允许H+通过", "需使用贵金属催化剂（如Pt、Ir）提高反应活性", "", ""], "r": "A", "e": "质子交换膜电解水制氢在酸性环境中，阴极是H⁺得电子，反应为2H⁺ + 2e⁻ = H₂↑，A选项中阴极反应是碱性条件的，所以A错误。B、C、D选项描述均正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919624", "t": 1, "q": "下列哪种储氢材料属于\"化学吸附储氢\"类型", "a": ["金属有机框架（MOFs）", "镁基合金（如Mg2Ni）", "活性炭", "碳纳米管", "", ""], "r": "B", "e": "化学吸附储氢是通过化学反应储存氢气。镁基合金（如Mg₂Ni）储氢时与氢发生化学反应，属于化学吸附储氢；金属有机框架（MOFs）、活性炭、碳纳米管主要是物理吸附储氢。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919625", "t": 1, "q": "下列哪种储氢方式的体积储氢密度最高，且在常温常压下具有较好的稳定性", "a": ["35MPa高压气态储氢", "LaNi5型金属氢化物储氢", "甲苯-甲基环己烷有机液态储氢", "-253℃低温液态储氢", "", ""], "r": "B", "e": "高压气态储氢需高压但密度有限；金属氢化物储氢靠金属与氢反应，LaNi5型在常温常压较稳定且体积储氢密度较高；有机液态储氢储氢密度一般；低温液态储氢需极低温度且稳定性差。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919626", "t": 1, "q": "下列哪种氢能利用方式可实现\"氢能-电能-氢能\"的闭环循环，且能量损失相对较小", "a": ["氢能用于家庭供暖，余热发电", "氢能驱动汽车，制动能量回收发电", "氢能用于工业加热，产生的蒸汽发电", "氢能通过燃料电池发电，电能用于电解水制氢", "", ""], "r": "D", "e": "选项D中，氢能通过燃料电池发电，然后电能用于电解水制氢，形成了“氢能 - 电能 - 氢能”的闭环循环，且相较于其他选项，能量损失相对较小。而A、B、C选项只是将氢能转化为电能，未形成闭环循环。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919627", "t": 1, "q": "下列哪种氢能利用方式最适合解决电网负荷波动问题，实现\"削峰填谷\"?", "a": ["氢能用于工业锅炉供热", "氢能驱动的分布式发电系统", "氢能储存在高压储氢罐中，需时通过燃料电池发电", "氢能燃料电池电动汽车", "", ""], "r": "C", "e": "在解决电网负荷波动问题，实现“削峰填谷”的情境下，我们需要一种能够灵活调节电力输出的氢能利用方式。A选项提到的氢能用于工业锅炉供热，这主要是稳定的热能供应，并不能直接应对电网负荷的波动。B选项的氢能驱动的分布式发电系统，虽然能发电，但分布式系统的调节灵活性可能不如集中式储能系统。C选项指出氢能储存在高压储氢罐中，需时通过燃料电池发电。这种方式可以灵活地储存多余的电能，并在需要时通过燃料电池转化为电能输出，从而有效应对电网负荷的波动，实现“削峰填谷”。D选项的氢能燃料电池电动汽车，主要是交通工具的应用，并不直接针对电网负荷波动问题。综上所述，C选项最符合题目要求，能够通过储存和按需发电来平衡电网负荷。所以，正确答案是C：“氢能储存在高压储氢罐中，需时通过燃料电池发电”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919628", "t": 1, "q": "下列哪种制氢工艺可实现\"绿氢\"生产（即全生命周期碳排放趋近于零）", "a": ["光伏电站供电的电解水制氢", "天然气蒸汽重整制氢（无碳捕集）", "煤炭气化制氢", "工业副产氢（如炼化厂副产氢）", "", ""], "r": "A", "e": "“绿氢”强调全生命周期碳排放趋近于零，需使用可再生能源制氢。A选项光伏电站供电电解水，光伏是可再生能源，制氢过程碳排放低；B天然气蒸汽重整制氢、C煤炭气化制氢都会产生大量碳排放；D工业副产氢来源复杂且生产过程有碳排放。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919629", "t": 1, "q": "在储氢系统的安全设计中，下列哪种措施可有效防止\"氢脆\"对储氢容器的影响", "a": ["在容器内壁涂覆防氢渗透涂层", "增加容器的壁厚", "选用高强度的碳钢材料制作容器", "提高储氢容器的工作压力", "", ""], "r": "A", "e": "“氢脆”是氢原子渗入金属材料导致材料性能下降。A选项在容器内壁涂覆防氢渗透涂层可阻止氢原子进入容器材料，能有效防止“氢脆”。B增加壁厚不能阻止氢进入材料；C高强度碳钢易受“氢脆”影响；D提高工作压力会使氢更易渗入材料。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919630", "t": 1, "q": "在电解水制氢工艺中，采用碱性电解质（如KOH溶液）相比质子交换膜电解质，最显著的优势是", "a": ["电极材料成本更低", "适合高电流密度运行", "电解效率更高", "产氢纯度更高", "", ""], "r": "A", "e": "碱性电解质（如KOH溶液）中使用的电极材料一般是镍基等，成本低于质子交换膜电解质所需的贵金属电极，所以电极材料成本更低。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919631", "t": 1, "q": "在高压气态储氢系统中，当储氢压力超过35MPa时，下列哪种因素对储氢容器的长期安全性影响最大?", "a": ["环境温度波动引起的压力变化", "氢气导致的材料氢脆现象", "容器接口的密封性能", "容器材料的屈服强度", "", ""], "r": "B", "e": "高压气态储氢时，氢气会渗入容器材料，产生氢脆现象，严重降低材料性能，对长期安全性影响最大。环境温度波动、接口密封和材料屈服强度虽有影响，但不如氢脆危害大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919632", "t": 1, "q": "在高压气态储氢系统中，下列哪种因素对储氢容器的体积储氢密度影响最大，且需在设计中重点控制?", "a": ["储氢压力的波动范围", "容器的形状（圆柱形vs球形）", "氢气的纯度（含杂质含量）", "容器材质的屈服强度", "", ""], "r": "D", "e": "高压气态储氢，容器体积储氢密度受容器承压能力制约，而材质屈服强度决定容器能承受多大压力，是影响体积储氢密度最核心因素。压力波动、容器形状、氢气纯度影响均不如屈服强度显著。", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919633", "t": 1, "q": "在加氢站的氢气输送系统中，下列哪种设备可实现对氢气的净化处理，去除其中的水分、一氧化碳等杂质?", "a": ["高压储氢瓶组", "隔膜式压缩机", "加氢机", "吸附干燥器", "", ""], "r": "D", "e": "吸附干燥器可通过吸附作用去除氢气中的水分、一氧化碳等杂质实现净化。高压储氢瓶组用于储存氢气；隔膜式压缩机用于压缩氢气；加氢机用于给车辆加氢。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919634", "t": 1, "q": "在甲烷蒸汽重整制氢工艺中，为提高甲烷转化率并抑制积碳生成，下列操作条件控制正确的是", "a": ["高温（700-900摄氏度）、低压（0.1-0.5MPa）、低水碳比（H2O/CH4=1-2）", "低温（300-400摄氏度）、低压（0.1-0.5MPa）、低水碳比（H2O/CH4=1-2）", "低温（300-400摄氏度）、中高压（2-3MPa）、高水碳比（H2O/CH4=2.5-3.5）", "高温（700-900摄氏度）、中高压（2-3MPa）、高水碳比（H2O/CH4=2.5-3.5）", "", ""], "r": "D", "e": "甲烷蒸汽重整制氢反应是吸热反应，高温利于提高甲烷转化率；中高压可使反应正向进行；高水碳比能抑制积碳生成。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919635", "t": 1, "q": "在甲烷蒸汽重整制氢工艺中，下列关于反应条件对甲烷转化率影响的说法，正确的是", "a": ["降低反应温度可显著提高甲烷转化率", "提高反应压力能有效提升甲烷转化率", "增加蒸汽与甲烷的摩尔比（S/C比），甲烷转化率先升高后趋于稳定", "惰性气体的加入会使甲烷转化率大幅提高", "", ""], "r": "C", "e": "甲烷蒸汽重整制氢反应是吸热、气体分子数增多的反应。降低温度平衡逆向移动，甲烷转化率降低，A错；提高压力平衡逆向移动，甲烷转化率降低，B错；惰性气体不参与反应，加入对甲烷转化率无影响，D错；增加S/C比，开始促进反应正向进行使甲烷转化率先升高，后趋于稳定，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919636", "t": 1, "q": "在氢安全应急管理中，当加氢站发生氢气泄漏，且泄漏量较大时，下列应急处置措施优先级最高的是", "a": ["组织人员疏散至上风向安全区域，设置警戒区", "启动通风系统，加速氢气扩散，降低浓度至爆炸极限以下", "切断泄漏点上游的氢气供应阀门，停止氢气输送", "启动氢气浓度检测报警系统，发出声光报警", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919637", "t": 1, "q": "在氢的低温液化流程中，\"预冷-膨胀-节流\"组合流程的主要目的是", "a": ["避免氢在液化前与杂质（如空气）反应生成固态杂质", "降低液化过程的最低温度，确保氢达到沸点", "提高氢的纯度，去除液化过程中混入的水分和CO2", "减少制冷工质（如氦气）的消耗，降低能耗", "", ""], "r": "D", "e": "氢的低温液化流程中，“预冷—膨胀—节流”组合流程的核心目的是提高液化效率、降低能耗，具体表现为：<br />预冷：利用液氮等将氢气从常温预冷至约 80 K，减少后续深冷段的制冷负荷；<br />膨胀：通过透平膨胀机使氢气绝热膨胀，产生冷量并回收部分膨胀功；<br />节流：利用焦耳-汤姆逊效应进一步降温并部分液化。<br />这一组合流程通过多级降温、冷量回收和功回收，显著降低了液化循环的能耗，减少了对外部制冷工质（如液氦）的依赖和消耗。<br />其他选项：<br />A、C 属于原料气预处理/纯化系统的功能；<br />B 表述不准确，液化流程的目标是使氢达到液化温度并液化，而非单纯“达到沸点”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919638", "t": 1, "q": "在氢的输送中，\"管道输送\"与\"高压气态储氢罐车输送\"相比，下列优势错误的是", "a": ["输送能耗更低（无需频繁压缩氢气）", "输送量更大（适合大规模、长距离输送）", "泄漏风险更低（管道密封性优于罐车）", "投资成本更低（尤其是长距离输送时）", "", ""], "r": "D", "e": "管道输送前期建设投资大，长距离输送时投资成本并不低。而A选项，管道输送无需像罐车那样频繁压缩氢气，能耗低；B选项，管道适合大规模、长距离输送；C选项，管道密封性通常优于罐车，泄漏风险低。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919639", "t": 1, "q": "在氢低温液化系统中，克劳特循环相比林德循环的主要优势是", "a": ["设备结构更简单", "无需使用膨胀机", "制冷能耗更低", "适用于小规模液化装置", "", ""], "r": "C", "e": "克劳特循环通过增设膨胀机使气体膨胀制冷，制冷效率更高，能耗更低，这是其相比林德循环的主要优势。林德循环设备结构更简单，克劳特循环需用膨胀机，且更适用于大规模液化装置。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919640", "t": 1, "q": "在氢能利用的\"绿氢-储氢-发电\"闭环系统中，下列哪种氢能利用方式最适合作为电网调峰电源，且响应速度最快?", "a": ["氢内燃机发电", "氢燃料电池电站", "氢直接燃烧锅炉发电", "氢燃气轮机发电", "", ""], "r": "B", "e": "氢燃料电池电站无需燃烧升温过程，启动与功率调节响应速度快，适合电网快速调峰；氢内燃机、氢燃气轮机、氢燃烧锅炉均存在热机升温延时，响应速度弱于燃料电池。", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919641", "t": 1, "q": "在氢能利用的\"氢-电-热\"联供系统中，下列哪种燃料电池类型最适合与燃气轮机联合循环，实现高效能量梯级利用", "a": ["固体氧化物燃料电池（SOFC）", "磷酸燃料电池（PAFC）", "质子交换膜燃料电池（PEMFC）", "碱性燃料电池（AFC）", "", ""], "r": "A", "e": "固体氧化物燃料电池（SOFC）工作温度高，其排出的高温余热可用于燃气轮机联合循环，实现高效能量梯级利用，其他几种燃料电池工作温度相对较低，余热利用价值不如SOFC。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919642", "t": 1, "q": "在氢能用于钢铁冶炼的\"氢基竖炉\"工艺中，氢气的主要作用是", "a": ["作为保护气体防止钢水氧化", "作为还原剂还原铁矿石中的铁氧化物", "作为冷却介质冷却竖炉炉体", "作为燃料为竖炉提供热量", "", ""], "r": "B", "e": "“氢基竖炉”是用氢气还原铁矿石炼铁，氢气主要作用是作还原剂把铁矿石里铁氧化物还原成铁。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919643", "t": 1, "q": "在燃料电池电动汽车（FCEV）中，“氢气循环泵”的主要作用是", "a": ["冷却燃料电池堆的工作温度", "将车载储氢罐中的高压氢降压至燃料电池所需压力", "将燃料电池阳极未反应的氢气送回阳极，提高氢气利用率", "为燃料电池阴极提供压缩空气", "", ""], "r": "C", "e": "氢气循环泵主要是把燃料电池阳极未反应的氢气送回阳极，让氢气能再次参与反应，提高氢气利用率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919644", "t": 1, "q": "在制氢工艺的\"灰氢-蓝氢-绿氢\"分类中，\"蓝氢\"的定义是", "a": ["通过工业副产物（如焦炉煤气）提纯制氢，无额外碳排放", "通过可再生能源（如风电、光伏）电解水制氢，全生命周期零碳", "通过化石燃料（如天然气）制氢，无碳捕集与封存（CCS）", "通过化石燃料制氢，配套CCS技术，捕集90%以上的CO2", "", ""], "r": "D", "e": "蓝氢是通过化石燃料制氢并配套碳捕集与封存（CCS）技术，能捕集90%以上的CO₂。A选项是灰氢的部分情况；B选项是绿氢；C选项无CCS技术不是蓝氢。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919645", "t": 1, "q": "在制氢工艺的\"灰氢-蓝氢-绿氢\"分类中，\"蓝氢\"的核心特征是?", "a": ["利用可再生能源电解水制氢，碳排放为零", "利用工业副产氢（如炼厂副产氢），无额外碳排放", "利用化石燃料制氢，同时配套碳捕集与封存（CCUS）技术", "利用化石燃料制氢，且未采取碳捕集措施", "", ""], "r": "C", "e": "“蓝氢”是用化石燃料制氢，但同时配套碳捕集与封存（CCUS）技术，减少碳排放。A 是绿氢特征；B 工业副产氢不属于“蓝氢”核心特征；D 未采取碳捕集措施不是“蓝氢”特点。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919646", "t": 1, "q": "在制氢工艺中，\"电解水制氢\"与\"甲烷蒸汽重整制氢\"相比，最显著的劣势是", "a": ["设备投资规模大", "单位氢气生产成本高", "氢气纯度低", "产氢过程碳排放高", "", ""], "r": "B", "e": "电解水制氢需消耗大量电能，成本高；甲烷蒸汽重整制氢原料成本相对低。设备投资规模差距并非最显著劣势；电解水制氢纯度高；电解水制氢碳排放低。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919647", "t": 1, "q": "质子交换膜燃料电池（PEMFC）的性能衰减主要原因不包括", "a": ["阴极催化剂（Pt）的溶解与团聚", "质子交换膜的化学降解（如F-释放）", "阳极氢气中CO杂质的毒化（CO吸附在Pt表面）", "电解质中OH-的迁移速率下降", "", ""], "r": "D", "e": "PEMFC是酸性环境，电解质中不存在大量OH⁻，也就不存在OH⁻迁移速率下降导致性能衰减的情况。而A选项阴极催化剂问题、B选项质子交换膜降解、C选项阳极杂质毒化都会影响其性能。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919648", "t": 1, "q": "质子交换膜燃料电池（PEMFC）的阴极催化层中，常用的催化剂是", "a": ["镍（Ni）", "铂（Pt）", "钯（Pd）", "铁（Fe）", "", ""], "r": "B", "e": "在质子交换膜燃料电池（PEMFC）阴极催化层中，铂（Pt）具有良好的催化活性、稳定性等，是常用催化剂。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919649", "t": 1, "q": "质子交换膜燃料电池（PEMFC）的阴极发生\"氧还原反应（ORR）\"，下列关于该反应的说法正确的是", "a": ["ORR反应在酸性条件下进行，产物为H2O", "ORR反应在碱性条件下进行，产物为OH-", "ORR反应速率快，无需催化剂即可高效进行", "ORR反应是PEMFC的阳极反应，发生H2氧化", "", ""], "r": "A", "e": "PEMFC阴极ORR，酸性条件产物是H₂O，碱性条件产物也是H₂O；该反应速率慢，需催化剂；它是阴极反应，不是阳极的H₂氧化反应。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919650", "t": 1, "q": "质子交换膜燃料电池（PEMFC）运行过程中，若质子交换膜出现脱水现象，会导致的主要问题是", "a": ["阳极氢气渗透率大幅降低", "阴极催化层氧还原反应速率加快", "电池工作温度急剧升高", "电池内阻显著增大", "", ""], "r": "D", "e": "质子交换膜脱水会影响质子传导，使电池内阻增大。A项脱水与氢气渗透率大幅降低无关；B项脱水会阻碍反应，不是加快；C项脱水不是导致温度急剧升高的主要原因。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800334311919651", "t": 1, "q": "质子交换膜燃料电池（PEMFC）中，质子交换膜的核心功能是传递质子，同时阻止气体交叉渗透。下列哪种材料是当前商用PEMFC质子交换膜的主流选择?", "a": ["聚苯并咪唑（PBI）", "磺化聚苯硫醚（SPPS）", "全氟磺酸树脂（如Nafion）", "磺化聚醚醚酮（SPEEK）", "", ""], "r": "C", "e": "全氟磺酸树脂化学稳定性和质子传导性好，是当前商用PEMFC质子交换膜
