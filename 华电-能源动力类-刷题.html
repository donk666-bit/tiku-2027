回路的扰动，相比单回路控制系统抗干扰能力更强。", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046023", "t": 3, "q": "串级控制系统调试时，应先调试主回路，再调试副回路，以保证主被控量稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级控制系统调试应先副回路后主回路，因为副回路反应快、干扰影响小，先调好副回路能为稳定主被控量打下基础。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046024", "t": 3, "q": "串级控制系统与单回路控制系统相比，对主回路内扰动的抑制能力更强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "串级控制系统副回路可快速克服进入副回路的扰动，对主回路内扰动抑制靠主、副回路共同作用，比单回路控制系统仅靠主控制器动作抑制扰动能力更强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046025", "t": 3, "q": "串级控制系统中，副回路的存在会增大主回路的时间常数，使主被控量的响应速度变慢。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级控制系统中，副回路的存在可减小主回路的时间常数，加快主被控量的响应速度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046026", "t": 3, "q": "串级控制系统中，副回路的时间常数应远小于主回路，以避免主、副回路产生耦合振荡。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "串级系统中副回路时间常数远小于主回路时，能快速克服进入副回路的干扰，减少主副回路相互影响，避免耦合振荡。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046027", "t": 3, "q": "串级控制系统中，副回路调节周期比主回路短，主要作用是快速克服副回路内的扰动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "串级控制系统中副回路反应快、调节周期短，能及时快速克服副回路内的扰动，保证主变量稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046028", "t": 3, "q": "串级控制系统中，副控制器通常不采用微分作用，是为了避免微分作用放大副回路内的高频噪声。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "串级控制系统中，副回路响应快，若副控制器采用微分作用，会放大副回路内的高频噪声，影响系统稳定性，所以通常不采用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046029", "t": 3, "q": "串级控制系统中，副控制器通常采用比例控制（P），无需积分作用，因为主控制器已具备积分功能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "串级控制系统中副回路响应快，比例控制能快速克服干扰，且副对象通常滞后小，副控制器用比例控制即可，积分作用会使响应变慢，而主控制器有积分可消除余差。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046030", "t": 3, "q": "串级控制系统中，主被控量的变化会直接导致副被控量的变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级控制系统中，主控制器输出作为副控制器设定值，主被控量经主控制器运算后影响副控制器设定值才间接影响副被控量，并非直接导致副被控量变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046031", "t": 3, "q": "串级控制系统中，主被控量是生产过程中需严格控制的关键参数，副被控量是为稳定主被控量而选择的辅助参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "串级控制系统设计就是用副被控量辅助稳定主被控量，主被控量是需严格控制的关键参数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046032", "t": 3, "q": "串级控制系统中，主回路被控量是最终控制目标，副回路被控量是中间变量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "串级控制系统里，主回路直接控制最终要达到的被控量，副回路控制的是对主被控量有重要影响的中间变量。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046033", "t": 3, "q": "串级控制系统中，主控制器的给定值是生产工艺要求的主被控量的目标值，不可调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "主控制器给定值是生产工艺要求的主被控量目标值，但在实际生产中可根据情况调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046034", "t": 3, "q": "纯前馈控制系统由于能快速克服可测量扰动，因此可以完全消除被控量的余差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "纯前馈控制是按扰动进行补偿的，无法像反馈控制那样根据被控量偏差来调节，不能保证被控量等于给定值，所以不能完全消除余差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046035", "t": 3, "q": "单回路控制系统的控制质量主要取决于控制器参数的整定，与被控对象的选择无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。单回路控制系统的控制质量不仅取决于控制器参数的整定，还与被控对象密切相关。被控对象的特性（如惯性、滞后等）会影响系统的动态和静态性能，对控制质量起着关键作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046036", "t": 3, "q": "单回路控制系统投运时，“先手动后自动”的操作是为了检查测量仪表的精度是否符合要求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“先手动后自动”操作主要是为了使控制器输出平稳过渡，避免对系统造成较大扰动，而非检查测量仪表精度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046037", "t": 3, "q": "单回路控制系统中，被控对象为正作用时，若执行器为气开式，则控制器应选为反作用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在单回路控制系统中，为保证系统闭环负反馈，当被控对象正作用、执行器气开式（正作用）时，控制器需选反作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046038", "t": 3, "q": "单回路控制系统中，若执行器为气关式，当控制系统失电时，执行器会全开，以保证生产安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "气关式执行器在失信号（如失电）时会开启，在单回路控制系统中可利用这一特性，在失电时让执行器全开保障生产安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046039", "t": 3, "q": "反馈控制系统的稳定性仅取决于被控对象的特性，与控制器参数无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "反馈控制系统的稳定性取决于系统的整体结构和参数，既与被控对象特性有关，也受控制器参数影响。改变控制器参数可能使系统稳定性改变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046040", "t": 3, "q": "反馈控制系统的稳定性仅由控制器的参数决定，与被控对象的特性无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。反馈控制系统的稳定性由控制器参数和被控对象特性共同决定。因为系统的稳定性取决于系统的特征方程，而特征方程与控制器和被控对象都相关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046041", "t": 3, "q": "反馈控制系统中，测量环节的误差会直接导致被控量出现偏差，属于系统的内部扰动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "测量环节误差会使反馈信号与实际被控量有差异，影响控制作用致被控量偏差，它源于系统内部，是内部扰动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046042", "t": 3, "q": "反馈控制系统中，控制器的作用方向选择仅需保证整个系统为负反馈，无需考虑对象和执行器的作用方向。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在反馈控制系统中，控制器作用方向选择要综合考虑对象、执行器等的作用方向，才能确保整个系统为负反馈，并非无需考虑对象和执行器的作用方向。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046043", "t": 3, "q": "反馈控制系统中，偏差信号是指被控量的测量值与给定值之差，偏差为正时，控制器输出应增加。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在反馈控制系统里，偏差信号确实是被控量测量值与给定值之差。但偏差为正时，控制器输出不一定增加，要依据控制器的控制规律等因素确定，比如对于反作用控制器，偏差为正输出会减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046044", "t": 3, "q": "反馈控制系统中，只要控制器采用PI或PID控制规律，就一定能完全消除被控量的余差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然PI和PID控制规律能减小余差，但在某些情况下，如对象特性变化、干扰过大等，不能保证一定能完全消除余差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046045", "t": 3, "q": "副调节器采用比例控制，主调节器采用PI控制，可避免副回路积分饱和。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "副调节器采用比例控制无积分作用不会积分饱和，主调节器采用PI控制不影响副回路，所以可避免副回路积分饱和。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046046", "t": 3, "q": "给水控制系统中，双冲量控制比单冲量控制（仅水位反馈）更能有效克服\"虚假水位\"。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "单冲量控制仅依据水位反馈，难以应对“虚假水位”。双冲量控制引入了蒸汽流量信号，能提前感知负荷变化，有效克服“虚假水位”对控制的影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046047", "t": 3, "q": "给水控制系统中的\"虚假水位\"是由于给水流量与蒸汽流量不平衡导致的真实水位变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“虚假水位”并非真实水位变化，而是由于负荷突变时，汽包压力变化引起水的状态改变导致水位出现暂时的、与实际情况不符的波动，不是给水与蒸汽流量不平衡导致的真实水位变化。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046048", "t": 3, "q": "给水三冲量控制系统中，给水流量信号作为反馈信号，用于抑制给水流量自身扰动对水位的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在给水三冲量控制系统里，给水流量信号确实作为反馈信号，能对给水流量自身扰动进行调节，以抑制其对水位的影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046049", "t": 3, "q": "锅炉给水\"虚假水位\"现象是由于汽包内水的实际体积变化导致的真实水位波动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“虚假水位”不是因汽包内水实际体积变化导致的真实水位波动，而是由于蒸汽流量变化引起压力变化，使汽水状态改变造成水位看似变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046050", "t": 3, "q": "锅炉给水三冲量控制系统中，蒸汽流量信号作为前馈信号，可提前补偿蒸汽流量变化对汽包水位的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在锅炉给水三冲量控制系统里，蒸汽流量信号确实是作为前馈信号，能在蒸汽流量变化时提前动作，补偿其对汽包水位的影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046051", "t": 3, "q": "锅炉过热汽温偏高时，应立即最大幅度增加喷水减温量，以快速降低汽温。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "最大幅度增加喷水减温量可能导致汽温大幅波动甚至引发水击等问题，应根据实际情况逐步调整，不能立即最大幅度增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046052", "t": 3, "q": "锅炉炉膛压力控制中，通常选择气关型执行器（烟道挡板），以保证故障时挡板打开，防止炉膛正压。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在锅炉炉膛压力控制里，选气关型执行器（烟道挡板），故障时气源中断挡板会打开，能避免炉膛内压力积聚形成正压，保障安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046053", "t": 3, "q": "锅炉汽温串级控制系统中，副回路通常选择减温器出口温度作为副被控量，以快速克服减温水压力波动的扰动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在锅炉汽温串级控制系统里，把减温器出口温度设为副被控量构建副回路，能凭借副回路快速调节的特性，及时克服减温水压力波动等进入副回路的扰动。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046054", "t": 3, "q": "锅炉汽温控制中，改变燃烧器倾角的调节方式主要通过改变火焰中心高度，进而调整炉膛出口烟温，实现汽温控制。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "改变燃烧器倾角能改变火焰中心高度，火焰中心高度变化会影响炉膛内热量分布，从而调整炉膛出口烟温，最终实现汽温控制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046055", "t": 3, "q": "锅炉燃烧控制中，炉膛负压控制的主要目的是防止炉膛正压导致烟气外漏，或负压过大导致冷空气吸入过多。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在锅炉燃烧控制里，维持适当的炉膛负压很关键，正压会使烟气外漏，危害环境与人员安全；负压过大则会使冷空气过多吸入，降低热效率等。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046056", "t": 3, "q": "在锅炉燃烧控制过程中，烟气含氧量过高会增加排烟热损失，而过低则会导致燃料不完全燃烧损失，因此需要将烟气含氧量控制在一个经济合理的范围内。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "烟气含氧量高，意味着排烟中带走的热量多，增加排烟热损失；含氧量低，燃料无法充分燃烧，造成不完全燃烧损失，所以要控制在经济合理范围。", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046057", "t": 3, "q": "过热汽温的最高允许偏差通常为±5℃，若超温会导致过热器管材损坏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在实际的热力系统中，过热汽温有严格的控制范围，一般最高允许偏差常是±5℃ ，超温会使过热器管材金属性能下降，长期超温运行易导致管材损坏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046058", "t": 3, "q": "过热汽温控制中，改变喷燃器倾角主要通过调整过热器的吸热量来调节汽温。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046059", "t": 3, "q": "控制系统的超调量为零，说明系统无振荡，动态性能最优。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超调量为零只能说明系统无振荡，但动态性能最优说法错误，动态性能还涉及响应速度等多方面，超调量为零可能响应慢。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046060", "t": 3, "q": "控制系统的调节时间是指被控量从开始变化到完全稳定所需的时间，通常规定为被控量波动在稳态值±5%（或±2%）范围内的时间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "控制系统调节时间定义就是被控量从初始状态过渡到进入稳态值附近±5%（或±2%）误差带内且不再超出所需的时间。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046061", "t": 3, "q": "控制系统的峰值时间是指被控量达到第一个峰值所需的时间，峰值时间越短，系统响应速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据控制系统相关概念，峰值时间就是被控量达到第一个峰值所需时间，且峰值时间短意味着系统能更快达到峰值，即响应速度快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046062", "t": 3, "q": "控制系统的衰减比越大，说明系统的稳定性越好，但响应速度会变慢。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "衰减比反映系统稳定性，衰减比越大，系统越稳定，不过大的衰减比会使系统达到稳定的时间变长，即响应速度变慢。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046063", "t": 3, "q": "控制系统的型别越高（如II型比I型），对阶跃输入的稳态误差越小，甚至为零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "控制系统型别越高，对阶跃输入的稳态误差越小，I型系统对阶跃输入稳态误差为零，II型系统同样对阶跃输入稳态误差为零，型别高的系统控制精度更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046064", "t": 3, "q": "汽温控制中，喷水减温的调节范围不受限制，可用于所有负荷下的汽温调节。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "喷水减温调节范围是有限制的，并非能用于所有负荷下的汽温调节。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 热工控制系统（2）", "n": "基础练习题【含解析】 / 第5章 热工控制系统（2）", "qs": [{"id": "2034800268037722112", "t": 1, "q": "过热汽温的主要扰动中，属于内扰的是", "a": ["外界环境温度变化", "汽轮机负荷变化", "燃料发热量变化", "锅炉给水温度变化", "", ""], "r": "C", "e": "内扰是指影响汽温的因素来自锅炉内部。燃料发热量变化直接影响炉内燃烧工况从而影响汽温，属于内扰。外界环境温度变化是外部因素；汽轮机负荷变化影响蒸汽流量，属外扰；锅炉给水温度变化主要影响省煤器吸热量，对过热汽温算外扰。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722113", "t": 1, "q": "过热汽温控制中，下列调节手段中调节滞后最大的是", "a": ["改变炉膛负压", "改变喷燃器倾角", "烟气挡板调节", "喷水减温", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722114", "t": 1, "q": "仅增大PID控制器的积分时间Ti，对系统的影响是", "a": ["消除静态偏差速度减慢，超调量可能减小", "消除静态偏差速度加快，稳定性增强", "动态响应速度加快，抗干扰能力提升", "静态偏差增大，稳定性减弱", "", ""], "r": "A", "e": "积分时间Ti增大，积分作用减弱。积分作用主要是消除静态偏差，积分作用弱则消除静态偏差速度减慢；同时积分作用过强易导致超调，减弱后超调量可能减小。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722115", "t": 1, "q": "控制系统的阶跃响应中，上升时间是指被控量从稳态值的", "a": ["0上升到100%的时间", "5%上升到95%的时间", "0上升到50%的时间", "10%上升到90%的时间", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722116", "t": 1, "q": "控制系统的稳定性是指系统受到扰动后", "a": ["输出不超过允许范围的能力", "输出达到新稳态值的能力", "响应速度快慢的能力", "恢复到原平衡状态的能力", "", ""], "r": "D", "e": "控制系统稳定性指系统受扰动偏离平衡后，能恢复到原平衡状态。A选项说输出不超允许范围，未突出恢复平衡；B选项达到新稳态值与恢复原平衡不同；C选项响应速度快慢是系统快速性指标。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722117", "t": 1, "q": "判断热工控制系统稳定性时，若单位阶跃响应\"振幅逐渐增大，偏离设定值越来越远\"，系统处于哪种状态?", "a": ["欠阻尼稳定状态", "临界稳定状态", "稳定状态", "不稳定状态", "", ""], "r": "D", "e": "系统稳定要求单位阶跃响应最终应趋于一个稳定值，振幅逐渐增大、偏离设定值越来越远表明系统无法稳定，是不稳定状态。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722118", "t": 1, "q": "前馈-反馈复合控制与纯反馈控制相比，最显著的优势是", "a": ["对可测扰动的响应速度更快", "消除稳态误差的能力更强", "无需整定控制器参数", "系统稳定性更高", "", ""], "r": "A", "e": "前馈-反馈复合控制的核心思想是：在反馈控制的基础上，增加一个前馈通道，对可测扰动（或设定值变化）提前进行补偿。扰动发生后，前馈控制器立即动作，在扰动影响输出之前就对其进行抑制，因此响应速度非常快。<br />纯反馈控制（如PID控制）必须等到扰动引起输出偏差后，才开始调节，存在滞后性。<br />其他选项分析：<br />B. 消除稳态误差的能力更强：这是积分控制（反馈控制中的积分作用）的优势，并非前馈引入的主要优势。<br />C. 无需整定控制器参数：错误。前馈控制器同样需要根据对象特性整定参数。<br />D. 系统稳定性更高：前馈是开环补偿，不改变系统的闭环极点，因此不能提高稳定性；相反，如果前馈模型不准确，反而可能影响系统性能。稳定性主要由反馈回路保证。", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722119", "t": 1, "q": "前馈-反馈复合控制中，前馈与反馈输出通常如何叠加?", "a": ["先并后串", "串联", "并联", "先串后并", "", ""], "r": "C", "e": "前馈 - 反馈复合控制中，前馈与反馈输出通常是并联叠加。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722120", "t": 1, "q": "前馈控制补偿算式通常基于对象的哪种特性?", "a": ["静态特性", "动态特性", "非线性特性", "随机特性", "", ""], "r": "B", "e": "前馈控制补偿算式要考虑干扰作用到被控变量变化的整个动态过程，所以通常基于对象的动态特性。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722121", "t": 1, "q": "前馈控制的局限性不包括", "a": ["响应速度比反馈控制慢", "对扰动模型的准确性要求高", "无法克服未测扰动", "不能消除稳态误差", "", ""], "r": "A", "e": "前馈控制响应速度比反馈控制快，不是慢。前馈控制对扰动模型准确性要求高，无法克服未测扰动，也不能消除稳态误差。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722122", "t": 1, "q": "前馈控制实现完全补偿的条件是前馈控制器传递函数等于", "a": ["控制通道与扰动通道传递函数的乘积", "-（被控对象扰动通道传递函数/控制通道传递函数）", "被控对象扰动通道传递函数的倒数", "被控对象控制通道传递函数的倒数", "", ""], "r": "B", "e": "前馈控制实现完全补偿时，前馈控制器传递函数等于 -（被控对象扰动通道传递函数/控制通道传递函数）。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722123", "t": 1, "q": "燃烧控制系统中，当燃料量突然增加时，送风量应", "a": ["减少", "滞后增加", "保持不变", "同步增加或提前增加", "", ""], "r": "D", "e": "为使燃料充分燃烧，当燃料量突然增加时，送风量需同步增加或提前增加，以提供足够氧气。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722124", "t": 1, "q": "燃烧控制系统中，维持空燃比稳定的主要目的不包括", "a": ["提高锅炉热效率", "减少NOx等污染物排放", "控制炉膛出口烟温", "保证燃料完全燃烧", "", ""], "r": "C", "e": "维持空燃比稳定可提高热效率、减少污染物排放、保证燃料完全燃烧，而控制炉膛出口烟温并非维持空燃比稳定的主要目的。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722125", "t": 1, "q": "燃烧控制系统中，引风量控制回路的被控量是", "a": ["燃料量", "排烟温度", "送风量", "炉膛负压", "", ""], "r": "D", "e": "引风量控制的目的是维持炉膛负压稳定，所以引风量控制回路的被控量是炉膛负压。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722126", "t": 1, "q": "燃烧控制系统中\"燃料增、空气未按比增\"，会导致?", "a": ["不完全燃烧，CO增加", "炉膛温度降低", "烟气氧含量升高", "蒸汽压力下降", "", ""], "r": "A", "e": "燃料增加而空气未按比例增加，会使燃料不能充分燃烧，进而产生不完全燃烧现象，CO增加。B选项，不完全燃烧时部分能量未释放，一般不会使炉膛温度降低；C选项，空气不足氧含量应降低；D选项，燃料增加未完全燃烧，蒸汽压力不一定下降。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722127", "t": 1, "q": "燃烧协调控制系统中，维持炉膛负压稳定的主要目的是", "a": ["保证锅炉安全运行", "提高燃烧效率", "减少排烟热损失", "跟踪负荷指令", "", ""], "r": "A", "e": "炉膛负压不稳定可能引发喷火、爆炸等危险，维持其稳定主要是为保证锅炉安全运行。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722128", "t": 1, "q": "热电偶测蒸汽温度，冷端温度升高（无补偿），测量结果会?", "a": ["偏低", "偏高", "不变", "先高后低", "", ""], "r": "A", "e": "热电偶的热电势与冷热端温差有关，无补偿时冷端温度升高，冷热端温差减小，热电势变小，显示的测量结果会偏低。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722129", "t": 1, "q": "热电阻温度计的工作原理基于", "a": ["热电效应", "电磁效应", "电化学效应", "电阻温度效应", "", ""], "r": "D", "e": "热电阻温度计是利用导体或半导体的电阻值随温度变化而变化的特性来测量温度，即基于电阻温度效应。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722130", "t": 1, "q": "热工控制系统动态指标中，衰减比1:1说明系统处于?", "a": ["不稳定（增幅振荡）", "临界稳定（等幅振荡）", "无振荡", "稳定（衰减振荡）", "", ""], "r": "B", "e": "衰减比是衡量系统稳定性的指标，衰减比为1:1意味着前后相邻两个波峰幅值相等，是等幅振荡，系统处于临界稳定状态。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722131", "t": 1, "q": "热工控制系统性能分析中，过渡过程\"调节时间\"是指?", "a": ["被控量偏离设定值的最大差值", "被控量从开始变化到稳定在允许误差内的时间", "相邻峰值间的时间间隔", "被控量从开始变化到第一次达峰值的时间", "", ""], "r": "B", "e": "调节时间定义为被控量从开始变化到稳定在允许误差内的时间。A选项是最大偏差；C选项是振荡周期；D选项是峰值时间。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722132", "t": 1, "q": "热工流量测量中，孔板流量计的测量原理是基于", "a": ["电磁感应原理", "科里奥利力原理", "节流原理", "超声波传播原理", "", ""], "r": "C", "e": "孔板流量计是通过在管道中安装孔板，使流体流经孔板时产生节流现象，依据节流原理来测量流量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722133", "t": 1, "q": "热工温度测量中，铂热电阻的测量范围通常为", "a": ["-50℃~150℃", "800℃~1200℃", "-200℃~650℃", "0℃~100℃", "", ""], "r": "C", "e": "铂热电阻测量范围较宽，常见是 -200℃~650℃。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722134", "t": 1, "q": "系统特征方程所有根实部均为负，表明系统", "a": ["稳定", "不稳定", "无法判断", "临界稳定", "", ""], "r": "A", "e": "系统特征方程所有根实部均为负是系统稳定的充要条件。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722135", "t": 1, "q": "下列热工参数测量中，采用\"差压式测量原理\"的是?", "a": ["蒸汽温度（热电偶）", "烟气含氧量（氧化锆）", "炉膛压力（压力变送器）", "给水流量（标准孔板）", "", ""], "r": "D", "e": "差压式测量原理是利用流体流经节流装置时产生的压力差来测量相关参数。标准孔板是典型的节流装置，通过测量孔板前后的差压来计算给水流量。而热电偶测温度、氧化锆测含氧量、压力变送器测压力都不是基于差压原理。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722136", "t": 1, "q": "压力测量仪表中，基于压阻效应工作的是", "a": ["膜片压力表", "压阻式压力传感器", "压电式压力传感器", "弹簧管压力表", "", ""], "r": "B", "e": "压阻式压力传感器是基于压阻效应工作的。膜片压力表、弹簧管压力表靠弹性元件变形测压，压电式压力传感器基于压电效应。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722137", "t": 1, "q": "氧化锆氧量计测量烟气氧含量的核心原理是", "a": ["电磁感应原理", "热传导原理", "辐射换热原理", "能斯特方程（电化学原理）", "", ""], "r": "D", "e": "氧化锆氧量计是基于能斯特方程，利用其电化学原理来测量烟气氧含量。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722138", "t": 1, "q": "与单回路控制系统相比，串级控制系统在克服扰动方面的主要优势体现在能更快速克服哪种扰动?", "a": ["进入主回路的扰动", "同时进入主、副回路的扰动", "进入副回路的扰动", "测量环节的扰动", "", ""], "r": "C", "e": "串级控制系统中，副回路能快速动作去克服进入副回路的扰动。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722139", "t": 1, "q": "再热汽温控制中，不常采用喷水减温的主要原因是", "a": ["调节范围过小", "会降低机组循环热效率", "设备投资成本高", "调节速度太慢", "", ""], "r": "B", "e": "喷水减温会使再热蒸汽的品质降低，增加冷源损失，从而降低机组循环热效率，所以再热汽温控制中不常采用。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722140", "t": 1, "q": "在分析热工控制系统动态性能时，下列指标中不属于描述系统过渡过程振荡特性的是?", "a": ["超调量", "最大偏差", "振荡频率", "衰减比", "", ""], "r": "B", "e": "最大偏差指过渡过程中被控参数偏离设定值的最大数值，它主要体现偏差大小，并非描述振荡特性。超调量反映超出稳态值程度、振荡频率表明振荡快慢、衰减比体现振荡衰减情况，都和振荡特性相关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722141", "t": 1, "q": "在锅炉给水控制系统中，蒸汽流量突然增加时汽包水位先升后降的\"虚假水位\"现象，根本原因是?", "a": ["给水流量未及时增加", "汽包内蒸汽压力突降，导致水体积膨胀", "水位测量仪表出现误差", "汽包内水的蒸发量突然减少", "", ""], "r": "B", "e": "蒸汽流量突然增加，汽包内蒸汽压力突降，水的沸点降低，水迅速汽化使水体积膨胀，造成水位先升，随后因蒸发加剧水减少水位下降，这就是“虚假水位”根本原因。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722142", "t": 1, "q": "在控制系统性能分析的动态指标中，不属于描述过渡过程振荡特性的指标是", "a": ["峰值时间", "衰减比", "超调量", "调节时间", "", ""], "r": "D", "e": "峰值时间、衰减比、超调量都与过渡过程的振荡特性相关，而调节时间是衡量系统过渡过程结束所需时间，不直接描述振荡特性。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722143", "t": 1, "q": "在热工控制系统中，当某一主要扰动可准确测量且变化频繁时，为快速克服该扰动对被控量的影响，同时消除被控量的余差，应优先采用哪种控制方案?", "a": ["纯前馈控制", "前馈-反馈复合控制", "纯反馈控制", "串级控制系统（副回路未针对该扰动）", "", ""], "r": "B", "e": "纯前馈控制不能消除余差；纯反馈控制克服扰动慢；串级控制系统副回路未针对该扰动也不能快速克服此扰动。前馈 - 反馈复合控制既能快速克服可准确测量的频繁扰动，又能消除被控量余差。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722144", "t": 1, "q": "在热工控制系统中，前馈控制与反馈控制相比，其最核心的区别是", "a": ["基于扰动信号而非被控量偏差动作", "能够实现无差调节", "控制精度更高", "能消除静态偏差", "", ""], "r": "A", "e": "前馈控制是根据扰动信号进行控制的，反馈控制是基于被控量偏差动作。这是二者核心区别。B、C、D选项一般是反馈控制结合积分等环节可达到的特点，并非前馈与反馈核心区别。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722145", "t": 1, "q": "在设计串级控制系统时，副回路的选择需遵循\"快速性\"原则，其主要目的是让副回路能够?", "a": ["降低主回路的控制难度", "准确跟踪主控制器的输出信号", "减小主被控量的最大偏差", "快速克服进入副回路的主要扰动", "", ""], "r": "D", "e": "副回路遵循“快速性”原则，可凭借自身快速调节能力，快速克服进入副回路的主要扰动。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722146", "t": 1, "q": "在PID控制器中，积分作用的主要目的是消除被控量的余差，但实际应用中若积分时间Ti设置过小，容易导致系统出现哪种问题?", "a": ["抗干扰能力减弱", "系统振荡加剧", "被控量超调量减小", "响应速度变慢", "", ""], "r": "B", "e": "积分时间Ti过小，积分作用过强，会使系统输出变化过大，导致系统振荡加剧。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722147", "t": 1, "q": "在PID控制中，若微分时间Td设置过大，易导致控制器出现哪种问题?", "a": ["对被控量变化不敏感", "响应速度显著变慢", "无法消除余差", "输出信号频繁剧烈波动", "", ""], "r": "D", "e": "微分控制主要用于改善系统动态特性，Td过大时会对被控量变化过于敏感，使控制器输出信号频繁剧烈波动。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722148", "t": 1, "q": "PID参数整定的\"衰减曲线法\"中，通常以哪种衰减比作为整定依据", "a": ["10:1", "1:1", "2:1", "4:1", "", ""], "r": "D", "e": "PID参数整定的“衰减曲线法”常以4:1和10:1衰减比作为整定依据，较常用4:1。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722149", "t": 1, "q": "PID控制器参数整定时，若系统超调量过大且调节时间过长，应采取的措施是", "a": ["减小Kp，增大Td", "增大Kp，减小Ti", "增大Kp，增大Td", "减小Kp，增大Ti", "", ""], "r": "A", "e": "题目中系统的问题是：<br />超调量过大：说明比例作用太强或阻尼不足。<br />调节时间过长：说明系统振荡或动态响应不够理想。<br />对应措施：<br />减小 Kp：减弱比例作用，降低超调，减少振荡。<br />增大 Td：增强微分作用，提供超前调节，增加系统阻尼，抑制超调，缩短调节时间。<br />所以应选：A. 减小Kp，增大Td<br />其他选项辨析：B. 增大Kp，减小Ti：会加剧超调和振荡。<br />C. 增大Kp，增大Td：增大 Kp 会加剧超调。<br />D. 减小Kp，增大Ti：减小 Kp 可降超调，但增大 Ti 会减弱积分作用，不利于快速消除偏差，可能使调节时间更长。", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722150", "t": 1, "q": "PID控制器中，积分时间Ti减小，会导致", "a": ["积分作用减弱，调节时间缩短", "积分作用增强，系统响应变慢", "积分作用减弱，稳态误差增大", "积分作用增强，超调量可能增大", "", ""], "r": "D", "e": "积分时间Ti与积分作用成反比，Ti减小，积分作用增强。积分作用过强会使系统响应变慢且超调量可能增大。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722151", "t": 1, "q": "PID控制器中，若仅增大比例系数Kp，通常会导致系统", "a": ["稳态误差不变，调节时间延长", "稳态误差增大，超调量减小", "稳态误差减小，稳定性增强", "稳态误差减小，超调量增大", "", ""], "r": "D", "e": "增大比例系数Kp，能加快系统响应速度，使稳态误差减小，但会使系统稳定性变差，超调量增大。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722152", "t": 1, "q": "PID控制器中，若系统存在高频噪声，应采取的措施是", "a": ["减小微分时间Td", "减小比例系数Kp", "增大微分时间Td", "增大积分时间Ti", "", ""], "r": "A", "e": "高频噪声变化快，微分作用对变化率敏感，会放大噪声影响，减小微分时间Td可降低微分作用，减少噪声影响。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800268037722153", "t": 1, "q": "PID中微分作用的主要功能是?", "a": ["减小响应速度，降振荡", "按被控量变化率提前动作，抑超调", "增大比例度，提稳定性", "消除余差", "", ""], "r": "B", "e": "微分作用根据被控量的变化率来动作，能提前预判变化趋势，抑制超调。A选项减小响应速度错误；C选项增大比例度不是微分主要功能；D选项消除余差是积分作用。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562688", "t": 2, "q": "前馈-反馈复合控制的优势体现在", "a": ["消除稳态误差", "简化控制器参数整定", "降低对扰动模型的精度要求", "提高系统抗干扰能力", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562689", "t": 2, "q": "前馈补偿算式的设计需基于被控对象的哪些特性参数?", "a": ["噪声水平", "滞后时间", "测量精度", "时间常数", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562690", "t": 2, "q": "前馈控制的应用条件包括", "a": ["扰动对被控量的影响通道特性已知", "被控对象滞后小", "扰动可测量且可在线检测", "扰动变化频繁且幅值大", "", ""], "r": "AC", "e": "前馈控制需知道扰动对被控量影响通道特性，能测量扰动且可在线检测。被控对象滞后大小不是必要条件；扰动频繁且幅值大不利于控制且非应用条件。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562691", "t": 2, "q": "前馈控制无法广泛单独应用的原因有?", "a": ["难以测量所有扰动", "无法消除被控量的余差", "补偿算式难以精确建立（对象特性变化）", "响应速度慢于反馈控制", "", ""], "r": "ABC", "e": "前馈控制是按扰动量进行控制，实际中难以测量所有扰动，且补偿算式因对象特性变化难以精确建立，还无法消除被控量余差，这些导致其不能广泛单独应用。而前馈控制响应速度快于反馈控制。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562692", "t": 2, "q": "燃烧控制系统的主要控制目标包括", "a": ["控制汽包水位稳定", "控制燃料量与负荷匹配", "维持空燃比稳定", "调节过热汽温", "", ""], "r": "BC", "e": "燃烧控制系统主要是对燃料燃烧过程进行控制，要让燃料量与负荷匹配，保证空燃比稳定。A选项控制汽包水位稳定是给水控制系统的目标；D选项调节过热汽温是过热汽温控制系统的目标。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562693", "t": 2, "q": "燃烧控制系统中，送风量控制的依据包括", "a": ["机组负荷信号", "炉膛负压信号", "排烟氧含量信号（校正空燃比）", "汽包水位信号", "", ""], "r": "AC", "e": "送风量主要需根据燃烧情况精准调节，以保证燃料充分燃烧。机组负荷信号反映发电需求，决定燃料量进而影响送风量；排烟氧含量信号用于校正空燃比，确保合理的送风量；炉膛负压信号主要用于控制引风量，维持炉膛压力稳定；汽包水位信号主要用于水位控制，与送风量无关。所以送风量控制依据有A和C。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562694", "t": 2, "q": "燃烧协调控制的目标包括（　）", "a": ["维持主蒸汽压力稳定", "控制烟气氧含量", "维持炉膛负压稳定", "保证燃料完全燃烧", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562695", "t": 2, "q": "热工参数测量中，常用于测量高温的仪表有", "a": ["镍铬-铜镍热电偶", "铂铑-铂热电偶", "铂热电阻", "双金属温度计", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562696", "t": 2, "q": "热工参数测量中，为减小测量误差，可采取的措施有?", "a": ["选择合适量程的仪表", "定期校准仪表", "增大控制器比例系数", "考虑环境因素影响（温度、湿度补偿）", "", ""], "r": "ABD", "e": "选合适量程仪表可使测量值在仪表较准确区间，减小误差；定期校准能保证仪表准确性；考虑环境因素影响进行补偿可消除环境带来的误差。而增大控制器比例系数与测量误差无关。所以答案选ABD。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562697", "t": 2, "q": "热工测量系统误差的来源有（　）", "a": ["仪器固有误差", "人员读数误差", "测量方法缺陷", "环境温度偏离标准", "", ""], "r": "ABCD", "e": "热工测量系统误差来源包含仪器本身、人员操作、测量方法以及环境等方面。A仪器固有误差、B人员读数误差、C测量方法缺陷、D环境温度偏离标准都会导致系统误差。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562698", "t": 2, "q": "热工控制系统时域性能指标包括（　）", "a": ["衰减比", "调节时间", "相位裕度", "峰值时间", "", ""], "r": "ABD", "e": "时域性能指标是描述系统在时域中响应特性的指标。衰减比、调节时间、峰值时间都是时域性能指标；而相位裕度是频域性能指标。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562699", "t": 2, "q": "热工控制系统中，常用的抗干扰措施有?", "a": ["采用串级控制（克服副回路扰动）", "引入前馈控制（克服可测扰动）", "优化执行器选型", "增大控制器积分时间", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562700", "t": 2, "q": "热工流量测量中，电磁流量计的适用条件有", "a": ["被测流体必须导电", "适用于含固体颗粒的流体", "适用于腐蚀性流体", "不受流体粘度变化的影响", "", ""], "r": "ABCD", "e": "电磁流量计的工作原理基于法拉第电磁感应定律，导电介质在磁场中作切割磁力线运动时，导体中会产生感应电势。因此，电磁流量计的适用条件主要包括被测流体必须导电这一基本要求。此外，电磁流量计的一些特点也决定了它的适用场景。以下是对各选项的简要分析：A. 被测流体必须导电 - 这是电磁流量计工作的基本前提，只有导电的流体才能通过电磁流量计产生感应电势，从而进行流量测量。B. 适用于含固体颗粒的流体 - 电磁流量计的内壁一般较光滑，且无活动部件，因此对于含有固体颗粒的流体具有较好的适应性，不易堵塞。C. 适用于腐蚀性流体 - 电磁流量计的测量管内壁通常采用耐腐蚀材料，因此能够测量多种腐蚀性流体。D. 不受流体粘度变化的影响 - 电磁流量计的测量原理与流体的粘度无关，因此流体的粘度变化不会影响其测量精度。综上所述，电磁流量计的适用条件包括：被测流体必须导电、适用于含固体颗粒的流体、适用于腐蚀性流体以及不受流体粘度变化的影响。因此，本题的正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562701", "t": 2, "q": "热工系统抗干扰措施有（　）", "a": ["测量信号滤波", "信号电缆屏蔽", "控制器微分作用", "系统冗余设计", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562702", "t": 2, "q": "属于PID控制器工程整定方法的有", "a": ["经验凑试法", "临界比例度法", "理论计算法", "衰减曲线法", "", ""], "r": "ABD", "e": "PID控制器工程整定方法常见有经验凑试法、临界比例度法、衰减曲线法等，理论计算法较复杂且不常用在工程实际整定中。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562703", "t": 2, "q": "下列关于临界比例度法整定PID参数的说法，正确的有?", "a": ["适用于所有热工控制系统", "需将控制器Ti设为无穷大、Td设为0", "需找到系统出现等幅振荡时的比例度（临界比例度）", "整定过程中系统会出现短时不稳定", "", ""], "r": "BCD", "e": "临界比例度法整定PID参数时，要把控制器Ti设为无穷大、Td设为0，找到系统等幅振荡时的临界比例度，且整定过程系统会短时不稳定，但它并非适用于所有热工控制系统。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562704", "t": 2, "q": "下列关于前馈-反馈复合控制系统的特点，说法正确的有?", "a": ["控制精度仅取决于反馈回路", "对不可测量的扰动无控制作用", "能快速克服可测量的主要扰动", "可消除被控量的余差", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562705", "t": 2, "q": "下列关于前馈控制的说法，正确的有（　）", "a": ["与被控量偏差无关，仅依赖扰动信号", "需与反馈控制结合以提升鲁棒性", "无法消除静态偏差", "补偿效果取决于扰动测量精度", "", ""], "r": "ABCD", "e": "前馈控制的基本特点是：按扰动进行补偿，而不是等被控量出现偏差后再调节。<br />A. 与被控量偏差无关，仅依赖扰动信号：对<br />前馈控制直接测量扰动，按扰动信号进行补偿，不依赖被控量偏差。<br />B. 需与反馈控制结合以提升鲁棒性：对<br />前馈控制对模型和扰动测量依赖较强，单独使用难以保证精度，通常与反馈控制组成前馈—反馈复合控制系统。<br />C. 无法消除静态偏差：对<br />前馈控制本身是开环补偿，若模型不准确或存在其他未测扰动，不能保证被控量无静差；静态偏差通常需反馈控制来消除。<br />D. 补偿效果取决于扰动测量精度：对<br />前馈补偿基于扰动测量，测量越准确，补偿效果越好；测量误差会直接影响补偿效果。<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562706", "t": 2, "q": "下列关于前馈控制与反馈控制的区别，说法正确的有", "a": ["前馈控制能消除稳态误差，反馈控制不能", "前馈控制需要扰动模型，反馈控制不需要", "前馈控制是开环控制，反馈控制是闭环控制", "前馈控制基于扰动信号，反馈控制基于偏差信号", "", ""], "r": "BCD", "e": "前馈控制基于扰动信号且需扰动模型，是开环控制；反馈控制基于偏差信号，是闭环控制，前馈控制不能消除稳态误差，反馈控制能。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562707", "t": 2, "q": "下列关于燃烧协调控制的说法，正确的有?", "a": ["需保证烟气含氧量在经济范围内（通常3%-5%）", "负荷增加时先增燃料、后增空气、再调负压", "主要目的是保证蒸汽参数稳定和燃烧经济性", "负荷降低时先减空气、后减燃料、再调负压", "", ""], "r": "AC", "e": "燃烧协调控制要保证蒸汽参数稳定和燃烧经济性，同时需将烟气含氧量控制在经济范围（一般3%-5%）。负荷增加时应先增空气、再增燃料、后调负压；负荷降低时先减燃料、后减空气、再调负压。答案：AC", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562708", "t": 2, "q": "下列关于微分作用的说法，错误的有?", "a": ["微分作用易放大高频噪声", "微分作用能消除被控量的余差", "微分时间Td越大，微分作用越强", "微分作用主要用于克服对象纯滞后", "", ""], "r": "BD", "e": "积分作用能消除被控量余差，不是微分作用；微分作用易放大高频噪声，微分时间越大作用越强，且主要用于克服对象容量滞后而非纯滞后。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562709", "t": 2, "q": "下列属于控制系统稳定性判定方法的有", "a": ["相角裕度法", "劳斯稳定判据", "奈奎斯特稳定判据", "误差积分法", "", ""], "r": "ABC", "e": "相角裕度法、劳斯稳定判据、奈奎斯特稳定判据都是常用的控制系统稳定性判定方法。误差积分法主要用于衡量系统的控制精度等，并非稳定性判定方法。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562710", "t": 2, "q": "压力测量仪表按工作原理分类，属于弹性式的有", "a": ["压阻式压力传感器", "膜片压力表", "电容式压力传感器", "波纹管压力表", "", ""], "r": "BD", "e": "弹性式压力仪表是基于弹性元件受力变形原理工作，膜片和波纹管是常见弹性元件。压阻式靠压阻效应，电容式靠电容变化测量压力。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562711", "t": 2, "q": "影响汽包水位测量的因素有（　）", "a": ["水位计安装高度", "汽包压力变化", "测量管路堵塞", "汽水扰动", "", ""], "r": "ABCD", "e": "测量基准判定<br />水位计安装高度决定了零水位参考点的物理位置。<br />安装偏差将直接导致静态测量基准偏移，使指示值与实际水位产生固定偏差。<br />介质密度影响<br />汽包压力变化直接改变饱和水与饱和蒸汽的密度比。<br />密度比的变化导致差压式测量的转换系数失准，引发动态测量误差。<br />信号传输阻断<br />测量管路堵塞会阻碍介质正常流动与冷凝。<br />这破坏了差压变送器的压力传递路径，导致测量信号失真或冻结。<br />界面波动干扰<br />汽水扰动破坏了汽包内重力分离界面的稳定性。<br />剧烈波动使水位计内出现虚假水位或气泡夹杂，降低测量读数的实时准确性。", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562712", "t": 2, "q": "再热汽温控制的特点有", "a": ["喷水减温会降低机组效率", "常用烟气侧调节手段", "扰动因素多", "控制精度要求低", "", ""], "r": "ABC", "e": "喷水减温会使蒸汽的做功能力降低，从而降低机组效率；再热汽温控制中常用烟气侧调节手段来控制温度；再热汽温受到多种因素如负荷、燃料等影响，扰动因素多。再热汽温控制精度要求高，D选项错误。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562713", "t": 2, "q": "在PID参数整定过程中，常用的工程整定方法包括哪些?", "a": ["衰减曲线法", "临界比例度法", "理论计算法", "微分先行法", "", ""], "r": "AB", "e": "衰减曲线法和临界比例度法是PID参数整定常用的工程方法，理论计算法较复杂且实际应用不便，微分先行法不是参数整定方法。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562714", "t": 2, "q": "PID参数工程整定方法有（　）", "a": ["临界比例度法", "最小二乘法", "响应曲线法", "经验凑试法", "", ""], "r": "ACD", "e": "临界比例度法、响应曲线法、经验凑试法都是PID参数工程整定常用方法，而最小二乘法是一种数学优化技术，并非PID参数整定方法。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562715", "t": 2, "q": "PID控制器中，比例系数Kp增大对系统性能的影响有?", "a": ["系统响应速度加快", "余差减小", "超调量增大", "稳定性减弱", "", ""], "r": "ABCD", "e": "比例系数Kp增大，会使系统对偏差的响应变快，响应速度加快；能减小余差；但会使系统超调量增大、稳定性减弱。ABCD选项描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562716", "t": 2, "q": "PID控制器中，比例作用的特点有", "a": ["存在稳态误差", "对偏差的灵敏度由Kp决定", "能消除系统振荡", "无调节滞后", "", ""], "r": "ABD", "e": "A. 存在稳态误差<br />比例控制（P控制）存在固有缺陷——稳态误差（也称为余差）。 只靠比例作用，当系统达到平衡时，被控量无法完全恢复到设定值，总会存在一个残留偏差。 这是因为比例控制必须有一定的偏差才能产生控制输出。<br />B. 对偏差的灵敏度由Kp决定 <br />比例系数 Kp 决定了比例作用对偏差的灵敏度。Kp 越大，比例作用越强，对偏差的响应越快，但过大会导致系统振荡。 比例系数是衡量比例作用强弱的核心参数。<br />C. 能消除系统振荡 <br />比例作用本身不能消除系统振荡。相反，当 Kp 设置过大时，比例作用反而会加剧系统振荡，导致系统不稳定。 消除振荡通常需要引入微分作用（D）或适当调整参数。<br />D. 无调节滞后 <br />比例控制是即时响应的——它直接根据当前偏差的大小成比例地输出控制信号，不存在积分作用的累积滞后或微分作用的超前预测。 比例控制提供的是一种\"即时、直接\"的响应，始终对当前偏差做出反应。<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562717", "t": 2, "q": "PID控制器中，积分饱和现象产生的条件有?", "a": ["比例系数Kp过小", "被控量存在持续偏差", "控制器长期处于开环状态", "微分时间Td过大", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562718", "t": 2, "q": "PID控制器中，微分作用的特点有（　）", "a": ["消除静态偏差", "抑制系统超调", "增强抗干扰能力", "加快动态响应速度", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800269480562719", "t": 2, "q": "PID控制器中，微分作用的作用包括", "a": ["对高频噪声敏感", "减小系统超调量", "克服被控对象的容量滞后", "消除系统稳态误差", "", ""], "r": "ABC", "e": "微分作用可预测偏差变化趋势，克服容量滞后，减小超调量，但对高频噪声敏感。消除系统稳态误差是积分作用。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236928", "t": 3, "q": "前馈-反馈复合控制系统的控制精度一定高于纯反馈系统，因为其结合了两者的优点。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236929", "t": 3, "q": "前馈-反馈复合控制系统中，前馈回路主要克服可测量扰动，反馈回路主要消除余差和克服不可测扰动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前馈控制针对可测扰动提前补偿，反馈控制能消除余差且可应对不可测扰动，所以该描述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236930", "t": 3, "q": "前馈-反馈复合控制系统中，前馈输出与反馈输出通常采用串联叠加的方式控制执行器。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "前馈 - 反馈复合控制系统中，前馈输出与反馈输出通常采用并联叠加的方式控制执行器，而非串联叠加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236931", "t": 3, "q": "前馈-反馈复合控制中，前馈用于克服可测扰动，反馈用于消除稳态误差和克服未测扰动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前馈控制能针对可测扰动提前采取措施进行补偿；反馈控制可根据被控量偏差调节，消除稳态误差并处理未测扰动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236932", "t": 3, "q": "前馈-反馈复合系统中，前馈抑制可测扰动，反馈消除偏差，兼顾快速性与准确性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在该复合系统里，前馈能针对可测扰动提前补偿，反馈可根据偏差进行调节以消除偏差，结合了两者优势，兼顾快速性与准确性。", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236933", "t": 3, "q": "前馈控制的补偿精度仅取决于扰动测量的准确性，与被控对象的特性无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "前馈控制补偿精度不仅与扰动测量准确性有关，还和被控对象特性相关，因为不同特性的被控对象对扰动的响应不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236934", "t": 3, "q": "前馈控制的核心是利用被控量的偏差来纠正偏差，因此需要测量被控量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "前馈控制是在活动开始前，通过观察情况、收集信息、预测趋势，采取措施以防止问题发生，而不是利用被控量的偏差来纠正偏差，利用偏差纠正偏差是反馈控制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236935", "t": 3, "q": "前馈控制可以克服所有扰动对被控量的影响，因此无需与反馈控制结合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "前馈控制虽能对可测扰动进行补偿，但无法克服所有扰动，且存在局限性，通常需与反馈控制结合。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236936", "t": 3, "q": "前馈控制无法克服不可测量的扰动，是其不能单独应用的主要原因之一。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "前馈控制能针对可测扰动进行补偿，但对于不可测量的扰动确实无法有效克服，这会影响控制效果，所以不能单独应用，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236937", "t": 3, "q": "前馈控制系统的作用速度比反馈控制系统慢，因为其需要先测量扰动再计算补偿量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "前馈控制系统是在扰动影响被控变量之前就对其进行控制，一旦检测到扰动马上就计算补偿量并实施控制，作用迅速；而反馈控制系统要等被控变量出现偏差后才进行控制，存在滞后。所以该题说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236938", "t": 3, "q": "前馈控制系统因响应快，可完全替代反馈控制系统在热工系统中的应用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "前馈控制虽响应快，但它不能对所有干扰进行控制，也无法修正被控量的偏差，而反馈控制能根据偏差进行调节，二者各有优势，不能完全替代。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236939", "t": 3, "q": "燃烧控制系统中，引风量应始终大于送风量，以维持炉膛微负压。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "引风的作用是排出燃烧产生的烟气，维持炉膛微负压，需引风量大于送风量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236940", "t": 3, "q": "燃烧控制中，当机组负荷降低时，应先减少送风量，再减少燃料量，以维持空燃比稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机组负荷降低时，应先减少燃料量，再减少送风量，以保证燃烧稳定和避免不安全情况，题干顺序错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236941", "t": 3, "q": "燃烧控制中，空燃比的理论值为14.7（对天然气），实际控制中应略大于理论值，以保证燃料完全燃烧。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "天然气燃烧时空燃比理论值约为14.7，实际控制中为使燃料完全燃烧，需提供过量空气，所以空燃比应略大于理论值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236942", "t": 3, "q": "燃烧控制中，排烟氧含量是反映空燃比是否合理的重要指标，氧含量过高说明空燃比过大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "排烟氧含量能体现空燃比情况，氧含量高意味着进入的空气量相对燃料量过多，即空燃比过大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236943", "t": 3, "q": "燃烧协调控制中，维持合理氧含量是为了平衡燃烧效率与排烟热损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在燃烧协调控制里，合理的氧含量能让燃料充分燃烧以提高燃烧效率，同时避免因氧过多使排烟热损失增大，所以维持合理氧含量可平衡二者关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236944", "t": 3, "q": "热电偶插入炉膛越深，测量温度越准确，因此应尽量增加插入深度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热电偶插入深度有合适范围，并非越深越准确，过深可能受其他因素影响测量，还可能损坏热电偶。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236945", "t": 3, "q": "热电偶的热电势仅与两种导体的材料和两端温度差有关，与导体的长度和截面积无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热电偶热电势由两种导体材料特性及两端温度差决定，不受导体长度和截面积影响。", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236946", "t": 3, "q": "热电阻温度计的测量精度高于热电偶温度计，因此更适合用于高温测量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热电阻温度计测量精度高，但一般适用于中低温测量；热电偶温度计更适合高温测量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236947", "t": 3, "q": "热工参数测量中，差压式流量计测量流量时，流量与差压的平方根成正比，需进行开方运算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "差压式流量计原理就是流量与差压平方根成正比，实际使用时要对差压信号开方来得到流量值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236948", "t": 3, "q": "热工参数测量中，超声波流量计的测量精度不受流体粘度、密度变化的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超声波流量计通过检测超声波在流体中传播时因流体流动而产生的时间差等参数来测量流量，其原理决定了测量精度不受流体粘度、密度变化影响。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236949", "t": 3, "q": "热工参数测量中，热电偶温度计的测量精度不受冷端温度变化的影响，无需冷端补偿。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热电偶温度计的热电势与热端和冷端的温度差有关，冷端温度变化会影响测量精度，所以通常需要进行冷端补偿。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236950", "t": 3, "q": "热工测量仪器量程选择需严格遵循\"被测值在1/3~2/3量程内\"，不可调整。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热工测量仪器量程选择一般建议被测值在1/3 - 2/3量程内，但实际中可根据具体情况进行适当调整，并非不可调整。", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236951", "t": 3, "q": "热工控制系统的动态性能指标中，调节时间越长，说明系统达到稳定状态的速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "调节时间是指系统从受到干扰开始到进入允许的误差范围并保持稳定所需的时间，调节时间越短，系统达到稳定状态的速度才越快，而不是越长越快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236952", "t": 3, "q": "热工控制系统的静态余差是指系统稳定后，被控量与设定值之间的差值，仅与比例控制有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "静态余差是系统稳定后被控量与设定值差值，它不仅与比例控制有关，积分控制可消除余差等，说明余差并非仅和比例控制有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236953", "t": 3, "q": "热工控制系统中，等幅振荡的过渡过程说明系统处于稳定状态，可正常运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "等幅振荡意味着系统输出的振幅不衰减，这表明系统处于临界稳定状态，并非正常稳定可运行状态，正常运行的稳定系统应是衰减振荡最终趋向稳定值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236954", "t": 3, "q": "热工控制系统中，衰减比为4:1的过渡过程，说明系统处于临界稳定状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "衰减比为4:1是比较理想的衰减振荡过程，系统处于稳定状态，而临界稳定是等幅振荡，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236955", "t": 3, "q": "热工压力测量中，弹簧管压力表的测量精度主要取决于弹簧管的材质和加工精度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236956", "t": 3, "q": "随机误差由偶然因素引起，无法消除，只能通过多次测量取平均减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "随机误差是由偶然、不确定因素造成，其产生不可避免，多次测量取平均值可让正负误差相互抵消，从而减小误差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236957", "t": 3, "q": "微分作用可增强系统抗干扰能力，因此干扰大的系统应增大微分作用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "微分作用虽能预测偏差变化趋势、增强系统响应速度和抗干扰能力，但干扰大时增大微分作用会使系统对干扰过于敏感，导致系统不稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236958", "t": 3, "q": "稳定的热工控制系统一定具有优良的动态性能（如小超调、短调节时间）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "稳定只是热工控制系统正常运行的基本条件，稳定的系统动态性能不一定优良，可能存在超调大、调节时间长等情况。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236959", "t": 3, "q": "系统超调量越小越好，因此热工控制系统应追求超调量为零。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统超调量并非越小越好，追求超调量为零可能会使系统响应速度变慢、调节时间变长等，不能单纯以超调量为唯一指标。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236960", "t": 3, "q": "压电式压力传感器适合测量静态压力，因为其输出信号稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "压电式压力传感器基于压电效应工作，其输出电荷会随时间逐渐泄漏，不适合测量静态压力。", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236961", "t": 3, "q": "氧化锆氧量计需安装在600℃以上烟气环境中，才能正常工作。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236962", "t": 3, "q": "再热汽温控制中，烟气再循环是通过改变流经再热器的烟气量来调节再热汽温的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "烟气再循环通过将一部分低温烟气送回炉膛，改变流经再热器的烟气量和温度，从而调节再热汽温。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236963", "t": 3, "q": "增大PID控制器比例系数Kp，可提高控制精度，因此Kp应尽可能大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "增大Kp能提高控制精度，但Kp过大可能使系统不稳定、产生较大超调等不良影响，所以不能让Kp尽可能大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236964", "t": 3, "q": "PID参数整定的\"经验试凑法\"适用于难以建立数学模型的热工控制系统，实用性强但依赖经验。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "经验试凑法无需精确数学模型，在难以建模的热工控制系统中实用，不过其操作依赖操作人员经验。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236965", "t": 3, "q": "PID参数整定时，临界比例度法是通过调整比例系数使系统产生等幅震荡，再据此计算PID参数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "临界比例度法的确是先调整比例系数让系统出现等幅振荡，然后依据相关数据计算PID参数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236966", "t": 3, "q": "PID控制器中，比例系数Kp为零的极端情况，系统将无比例作用，仅保留积分和微分作用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "PID控制器中比例系数Kp为零，就没有比例作用，只剩积分和微分作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236967", "t": 3, "q": "PID控制器中，积分饱和现象是由于比例作用过强，导致控制器输出超出执行器量程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "积分饱和现象主要是积分作用累积导致的，而非比例作用过强。当系统存在偏差时，积分项会不断累积，使控制器输出超出执行器量程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236968", "t": 3, "q": "PID控制器中，积分时间Ti越大，积分作用越强，系统消除稳态误差的速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PID控制器中，积分时间Ti越大，积分作用越弱，消除稳态误差速度越慢。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236969", "t": 3, "q": "PID控制器中，积分时间Ti越大，积分作用越强，消除余差的速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PID控制器中，积分时间Ti越大，积分作用越弱，消除余差速度越慢，并非越强越快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236970", "t": 3, "q": "PID控制器中，积分作用越强（Ti越小），系统消除静态偏差越快，且稳定性越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PID控制器中，积分作用越强（Ti越小），系统消除静态偏差越快，但会使系统稳定性变差，而不是越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236971", "t": 3, "q": "PID控制器中，减小比例系数Kp会使系统的响应速度变慢，但稳定性会增强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在PID控制器里，比例系数Kp越大，系统响应越快但稳定性可能变差；减小Kp，系统响应就会变慢，不过超调等情况会减少，稳定性增强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236972", "t": 3, "q": "PID控制器中，若取消积分作用，系统将无法消除稳态误差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "积分作用主要是用于消除系统的稳态误差，取消积分作用后，系统可能无法完全消除稳态误差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236973", "t": 3, "q": "PID控制器中，微分时间Td设置过小，会导致系统对被控量变化的响应不敏感，超调量增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "据搜索结果，微分时间（Td）用于抑制超调和预测误差变化趋势。当Td设置过小时，微分作用不足，系统对被控量变化的响应不够敏感，无法有效抑制超调，导致超调量增大。多个信源均指出，Td不足或缺失会导致系统缺乏阻尼，抑制超调能力弱，超调无法被有效抑制，从而增大了超调量。", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236974", "t": 3, "q": "PID控制器中，微分时间Td越大，微分作用越强，系统的抗干扰能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PID控制器中，微分时间Td越大，微分作用越强，但微分作用主要是用于改善系统的动态响应，对快速变化的偏差有较强的响应，不过会放大噪声干扰，使系统抗干扰能力变弱。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236975", "t": 3, "q": "PID控制器中，微分作用对被控量的静态偏差有响应，能减小静态偏差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "PID控制器中，微分作用主要是对被控量的变化率有响应，用于改善系统的动态性能，积分作用才对静态偏差有响应，能减小静态偏差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800273402236976", "t": 3, "q": "PID控制器中，微分作用可以预测被控量的变化趋势，因此能有效克服被控对象的纯滞后。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第6章 单元机组运行（1）", "n": "基础练习题【含解析】 / 第6章 单元机组运行（1）", "qs": [{"id": "2034800276195643393", "t": 1, "q": "以下关于金属蠕变曲线的描述，正确的是?", "a": ["蠕变曲线分为弹性变形阶段、塑性变形阶段、断裂阶段", "匀速蠕变阶段的蠕变速率最小", "加速蠕变阶段材料的应力逐渐减小", "蠕变曲线分为减速蠕变阶段、匀速蠕变阶段、加速蠕变阶段", "", ""], "r": "D", "e": "金属蠕变曲线典型的是分为减速蠕变阶段、匀速蠕变阶段、加速蠕变阶段。选项A阶段划分错误；匀速蠕变阶段蠕变速率恒定且不是最小，减速阶段速率最小，B错误；加速蠕变阶段材料损伤加剧，应力一般不是减小，C错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643394", "t": 1, "q": "下列关于单元机组二次调频的说法，错误的是", "a": ["二次调频的响应速度比一次调频快", "二次调频可通过改变机组的负荷设定值实现", "二次调频的目的是维持电网频率在额定范围", "二次调频的调节指令通常由电网调度中心发出", "", ""], "r": "A", "e": "一次调频响应速度比二次调频快，A说法错误；二次调频可改变机组负荷设定值，目的是维持电网频率在额定范围，调节指令通常由电网调度中心发出，B、C、D说法正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643395", "t": 1, "q": "锅炉过热器的传热方式主要是?", "a": ["辐射+对流换热", "导热", "辐射换热", "对流换热", "", ""], "r": "A", "e": "锅炉过热器中，烟气与过热器管子间既有高温烟气的辐射传热，又有烟气流动的对流换热。答案选A。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643396", "t": 1, "q": "汽轮机低压缸的排汽进入凝汽器后，发生的相变过程是", "a": ["过热蒸汽凝结成饱和水", "饱和蒸汽凝结成饱和水", "饱和蒸汽凝结成过冷水", "过热蒸汽凝结成过冷水", "", ""], "r": "B", "e": "汽轮机低压缸排汽一般是饱和蒸汽，进入凝汽器后被冷却凝结成饱和水。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643397", "t": 1, "q": "单元机组停机过程中，当机组负荷降至零后，首先应进行的操作是", "a": ["停止汽轮机真空泵运行", "关闭汽轮机主蒸汽阀门", "停止锅炉燃料供应", "切断发电机与电网的连接（解列）", "", ""], "r": "D", "e": "机组负荷降至零后，首要操作是切断发电机与电网连接，防止非同期并列等情况，保障设备和电网安全。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643398", "t": 1, "q": "金属材料的疲劳极限是指材料在交变应力作用下，经过无限次循环仍不发生破坏的最大应力幅值。", "a": ["最小应力幅值", "最小应力平均值", "最大应力幅值", "最大应力平均值", "", ""], "r": "C", "e": "疲劳极限定义就是材料在交变应力下经无限次循环不破坏的最大应力幅值。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643399", "t": 1, "q": "单元机组一次调频的调节范围主要取决于?", "a": ["发电机的额定功率", "汽轮机调速系统的速度变动率", "电网的负荷需求", "机组的额定负荷", "", ""], "r": "B", "e": "汽轮机调速系统速度变动率决定了机组负荷随转速变化的关系，从而影响一次调频调节范围。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643400", "t": 1, "q": "单元机组冷态启动中，汽轮机冲转时的主蒸汽温度应高于汽轮机高压缸内壁温度，其差值的主要控制目的是", "a": ["防止汽轮机高压缸内壁产生压应力", "防止锅炉主蒸汽管道发生水冲击", "防止汽轮机高压缸内壁产生拉应力", "防止汽轮机转子发生热弯曲", "", ""], "r": "C", "e": "冷态启动时，使主蒸汽温度高于高压缸内壁温度是为防止缸内壁产生拉应力，若内壁温度低，受热膨胀时会受周围约束产生拉应力，可能引发设备损坏。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643401", "t": 1, "q": "单元机组中，汽轮机冷态启动时进行暖机操作的核心目的是（　）", "a": ["加快机组升速速度", "减小汽轮机转子与汽缸的温差，控制热应力", "提高汽轮机进汽温度", "防止汽轮机叶片结垢", "", ""], "r": "B", "e": "冷态启动暖机主要是为让汽轮机各部件均匀受热，减小转子与汽缸温差，控制热应力，避免热应力过大损坏设备。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643402", "t": 1, "q": "锅炉过热器系统中，采用\"喷水减温\"调节蒸汽温度时，喷水点应设置在（　）", "a": ["过热器入口处", "过热器中间级（如低温过热器与高温过热器之间）", "过热器出口处", "汽包与过热器之间", "", ""], "r": "B", "e": "将喷水点设置在过热器中间级，能更好地控制过热器不同阶段的蒸汽温度，调节效果好。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643403", "t": 1, "q": "以下哪种措施不能有效抑制金属材料的氢脆化?", "a": ["对材料进行脱氢处理", "在材料表面形成保护层隔绝氢气", "降低材料所处环境的氢分压", "提高材料的工作温度", "", ""], "r": "D", "e": "脱氢处理、表面形成保护层隔绝氢气、降低环境氢分压都能减少氢与材料接触，抑制氢脆化；而提高工作温度可能会加快氢在材料中的扩散等，促进氢脆，不能有效抑制。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643404", "t": 1, "q": "锅炉热力系统中，负责将给水加热至接近饱和温度，同时回收烟气余热的关键设备是（　）", "a": ["空气预热器", "再热器", "过热器", "省煤器", "", ""], "r": "D", "e": "省煤器能将给水加热至接近饱和温度，可回收烟气余热。空气预热器作用是加热空气；再热器用于加热再热蒸汽；过热器使饱和蒸汽变为过热蒸汽。所以答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643405", "t": 1, "q": "单元机组正常运行时，锅炉汽包水位调节的核心是维持汽包内的", "a": ["给水量与蒸发量的平衡", "汽水混合物的重力平衡", "蒸汽温度稳定", "蒸汽压力稳定", "", ""], "r": "A", "e": "汽包水位调节主要是要保证给水量和蒸发量相匹配，这样才能维持汽包内水位稳定。B选项汽水混合物重力平衡并非核心；C选项蒸汽温度稳定和D选项蒸汽压力稳定与水位调节核心无关。所以答案选A。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643406", "t": 1, "q": "金属材料在交变应力作用下发生疲劳破坏，其疲劳寿命随交变应力幅值的增大而", "a": ["先增大后减小", "保持不变", "增大", "减小", "", ""], "r": "D", "e": "交变应力幅值越大，材料内部损伤积累越快，越容易发生疲劳破坏，疲劳寿命就越短。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643407", "t": 1, "q": "锅炉炉膛内的辐射换热主要取决于?", "a": ["烟气与受热面的温差", "烟气的流速", "炉膛内的温度和黑度", "受热面的面积", "", ""], "r": "C", "e": "锅炉炉膛内辐射换热，根据辐射换热公式，其主要与温度和物体表面黑度相关，温度和黑度对辐射换热量影响大。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643408", "t": 1, "q": "金属材料的热脆化（蓝脆）通常发生在一定温度范围，该温度范围一般接近", "a": ["材料的常温", "材料的熔点", "材料的低温区间", "材料的再结晶温度", "", ""], "r": "D", "e": "蓝脆是金属在一定温度范围强度升高、塑性降低，该温度接近材料再结晶温度。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643409", "t": 1, "q": "以下关于金属松弛现象的应用，正确的是?", "a": ["利用松弛现象减少焊接残余应力", "利用松弛现象防止材料的蠕变", "利用松弛现象提高材料的疲劳强度", "利用松弛现象制造紧配合部件", "", ""], "r": "A", "e": "金属松弛可使应力随时间降低，焊接残余应力会因此减小。而防止蠕变、提高疲劳强度、制造紧配合部件并非是对松弛现象的应用。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643410", "t": 1, "q": "锅炉省煤器的作用是利用锅炉尾部烟气的热量加热", "a": ["锅炉给水", "锅炉空气", "再热蒸汽", "饱和蒸汽", "", ""], "r": "A", "e": "省煤器是利用锅炉尾部烟气热量来加热锅炉给水的设备，可降低排烟温度，提高锅炉效率。答案选A。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643411", "t": 1, "q": "单元机组二次调频的主要目的是?", "a": ["防止机组发生超速事故", "维持机组负荷在额定值附近", "快速响应电网频率的微小波动", "调整电网频率至额定值，并分配机组间负荷", "", ""], "r": "D", "e": "二次调频能使电网频率恢复到额定值，还会根据机组特性分配机组间负荷。A选项防止超速是超速保护作用；B选项维持机组负荷在额定值附近不是二次调频主要目的；C选项快速响应微小波动是一次调频作用。所以答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643412", "t": 1, "q": "锅炉水位计的虚假水位现象，通常发生在以下哪种情况下?", "a": ["锅炉给水温度突然升高", "锅炉负荷突然增加", "锅炉负荷突然降低", "锅炉压力突然升高", "", ""], "r": "B", "e": "锅炉负荷突然变化时，汽水状态改变会导致虚假水位。负荷突然增加，汽包压力下降，水的沸点降低，水急剧汽化，水面下汽泡增多使水位虚假上升；负荷突然降低则相反。而给水温度、压力突然升高不是产生虚假水位主因。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643413", "t": 1, "q": "下列因素中，会导致金属材料高温脆化现象加剧的是", "a": ["增加材料所受的静应力", "降低材料工作温度", "改善材料的晶界结合强度", "减少材料中的杂质元素（如磷、硫）含量", "", ""], "r": "A", "e": "高温脆化是在高温和应力作用下发生的，增加材料所受静应力会加剧高温脆化。降低温度、改善晶界结合强度、减少杂质元素含量都有利于减轻高温脆化。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643414", "t": 1, "q": "单元机组采用滑参数停机时，控制主蒸汽降温速率的主要依据是", "a": ["发电机定子铁芯的温度限值", "锅炉水冷壁的允许温差", "凝汽器的真空变化速率", "汽轮机高压缸的最大允许热应力", "", ""], "r": "D", "e": "滑参数停机时需控制主蒸汽降温速率以保证设备安全，汽轮机高压缸热应力对其安全性影响大，控制主蒸汽降温速率主要就是依据汽轮机高压缸的最大允许热应力。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643415", "t": 1, "q": "单元机组正常运行时，若电网频率降低且超出一次调频范围，此时应启动的调节方式是", "a": ["汽轮机真空调节", "锅炉水位调节", "发电机励磁调节", "二次调频", "", ""], "r": "D", "e": "电网频率降低且超出一次调频范围时，需进行二次调频来恢复频率稳定。A选项汽轮机真空调节主要影响汽轮机效率等；B选项锅炉水位调节保证锅炉安全运行；C选项发电机励磁调节主要控制发电机电压和无功功率。所以答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643416", "t": 1, "q": "锅炉主蒸汽系统中，用于防止主蒸汽管道超压，且动作后需手动复位的安全装置是", "a": ["压力开关", "脉冲式安全阀", "爆破片", "弹簧式安全阀", "", ""], "r": "B", "e": "脉冲式安全阀动作后需手动复位，可防止主蒸汽管道超压。压力开关是控制压力的；爆破片破裂后需更换；弹簧式安全阀自动复位。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643417", "t": 1, "q": "单元机组冷态启动过程中，汽轮机进行低速暖机的主要目的是?", "a": ["缩短机组启动时间", "提前建立汽轮机真空", "防止汽轮机转子因温差过大产生热应力", "快速提升汽轮机转子温度", "", ""], "r": "C", "e": "冷态启动时汽轮机各部件温度低且不均匀，低速暖机能让转子和汽缸均匀受热，避免温差过大产生热应力损坏设备。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643418", "t": 1, "q": "金属材料的热松弛现象是指在恒定温度下，材料内部应力随时间的推移而", "a": ["保持不变", "先减小后增大", "逐渐增大", "逐渐减小", "", ""], "r": "D", "e": "热松弛是在恒温和恒定变形量下，金属材料内部应力随时间逐渐减小的现象。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643419", "t": 1, "q": "金属材料在热应力作用下，若热应力超过材料的屈服强度，会产生（　）", "a": ["弹性变形", "蠕变变形", "疲劳损伤", "塑性变形", "", ""], "r": "D", "e": "当热应力超过材料屈服强度，材料就会发生不可恢复的变形即塑性变形。弹性变形应力未超屈服强度；蠕变变形是长时间受恒定载荷产生；疲劳损伤是交变载荷导致。所以答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643420", "t": 1, "q": "锅炉给水系统中，除氧器的主要作用是去除水中的?", "a": ["二氧化碳和氮气", "溶解氧和二氧化碳", "溶解氧和杂质颗粒", "溶解氧和氮气", "", ""], "r": "B", "e": "除氧器主要功能是除去水中的溶解氧和二氧化碳，防止它们对锅炉等设备造成腐蚀。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643421", "t": 1, "q": "下列关于金属蠕变的描述，正确的是（　）", "a": ["蠕变变形量随时间增加而增大，且与温度呈正相关（温度越高，蠕变越显著）", "蠕变只发生在金属材料的屈服强度以上", "蠕变是金属在常温、长期载荷下发生的缓慢塑性变形", "蠕变破坏属于脆性破坏，无明显塑性变形", "", ""], "r": "A", "e": "蠕变是金属在高温、长期载荷下发生的缓慢塑性变形，变形量随时间增加且与温度正相关，温度越高蠕变越显著；蠕变可在低于屈服强度下发生；蠕变破坏有明显塑性变形，属塑性破坏。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643422", "t": 1, "q": "单元机组正常运行时，若电网频率降低，首先参与频率调节的是?", "a": ["二次调频", "调度指令调节", "一次调频", "三次调频", "", ""], "r": "C", "e": "一次调频是指由发电机组调速系统自动响应电网频率变化而进行的调节，当电网频率降低时，首先由一次调频参与调节。二次调频是通过手动或自动方式改变调速器的设定值来实现；调度指令调节一般不是最先响应频率变化；三次调频是根据负荷曲线及预测负荷进行的经济调度。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643423", "t": 1, "q": "单元机组滑参数启动过程中，主蒸汽的升压速度和升温速度应遵循的原则是?", "a": ["升温速度快于升压速度", "无固定原则，根据机组状态调整", "升压速度快于升温速度", "升压速度与升温速度保持一致", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643424", "t": 1, "q": "金属材料的疲劳极限是指?", "a": ["材料在恒定应力作用下，发生蠕变的最小应力值", "材料在交变应力作用下，经历无限次循环而不发生破坏的最大应力值", "材料在冲击试验中，吸收能量的最小值", "材料在拉伸试验中，发生屈服的应力值", "", ""], "r": "B", "e": "疲劳极限是材料在交变应力下，经无限次循环不破坏的最大应力。A说的是蠕变相关；C与冲击试验吸收能量无关；D是屈服应力概念。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643425", "t": 1, "q": "单元机组正常运行时，若电网频率出现小幅波动，首先通过（　）实现频率调整，维持电网频率稳定", "a": ["发电机励磁调节", "汽轮机调速系统的一次调频", "调度中心指令的二次调频", "锅炉燃烧调节", "", ""], "r": "B", "e": "电网频率小幅波动时，汽轮机调速系统能根据频率变化自动调整进汽量，进行一次调频，快速响应维持频率稳定。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643426", "t": 1, "q": "单元机组冷态启动时，锅炉上水的温度应控制在一定范围，主要是为了防止?", "a": ["省煤器发生汽化", "汽包产生过大热应力", "给水管道发生水冲击", "除氧器真空下降", "", ""], "r": "B", "e": "冷态启动时，若锅炉上水温度不当，会使汽包上下壁、内外壁产生较大温差，从而产生过大热应力，影响汽包寿命。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643427", "t": 1, "q": "以下关于金属疲劳破坏的描述，正确的是?", "a": ["疲劳破坏的应力值一定高于材料的屈服强度", "疲劳破坏与应力循环次数密切相关", "疲劳破坏只发生在高温环境下", "疲劳破坏前材料会发生明显的塑性变形", "", ""], "r": "B", "e": "疲劳破坏是在交变应力作用下发生的，与应力循环次数密切相关；疲劳破坏应力值常低于材料屈服强度，不一定在高温环境，且破坏前无明显塑性变形。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643428", "t": 1, "q": "在单元机组运行中，金属材料发生蠕变的主要影响因素不包括以下哪项?", "a": ["材料所处环境的温度", "作用在材料上的恒定应力", "材料的弹性模量", "材料本身的蠕变极限", "", ""], "r": "C", "e": "金属材料发生蠕变主要与温度、恒定应力、材料自身蠕变极限有关，弹性模量与蠕变关系不大。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800276195643429", "t": 1, "q": "锅炉尾部烟道的低温腐蚀，主要与烟气中的哪种成分有关?", "a": ["二氧化硫", "二氧化碳", "氮气", "三氧化硫", "", ""], "r": "D", "e": "锅炉尾部烟道低温腐蚀主要是因为烟气中的三氧化硫与水蒸气结合形成硫酸蒸汽，在低温处凝结腐蚀设备。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455488", "t": 2, "q": "金属材料疲劳破坏的断口特征包括以下哪些?（　）", "a": ["断口无明显塑性变形", "存在疲劳源", "断口呈韧性特征", "存在最终断裂区", "", ""], "r": "ABD", "e": "疲劳断裂属于脆性断裂，断口无明显塑性变形；断口分为疲劳源区、疲劳扩展区、瞬时最终断裂区；疲劳断口不是韧性特征，C 错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455489", "t": 2, "q": "以下哪些属于锅炉的主要安全附件?（　）", "a": ["安全阀", "水位计", "减温器", "压力表", "", ""], "r": "ABD", "e": "安全阀可防止锅炉超压，水位计能显示水位，压力表可测压力，它们都是保障锅炉安全运行的重要附件；减温器主要用于调节蒸汽温度，并非主要安全附件。答案为ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455490", "t": 2, "q": "金属材料的热应力产生的必要条件有", "a": ["材料受到外部约束或内部约束", "材料具有热胀冷缩特性", "材料各部分存在温度差", "材料受到交变应力作用", "", ""], "r": "ABC", "e": "热应力是因温度变化产生的应力。材料有热胀冷缩特性，各部分存在温度差时会有不同的伸缩，若再受到外部或内部约束，就会产生热应力。而交变应力与热应力产生无关。所以答案选ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455491", "t": 2, "q": "单元机组停机后，需要进行的主要维护操作有", "a": ["汽轮机盘车", "润滑油系统继续运行一段时间", "锅炉余热烘干", "发电机定子冷却水系统冲洗", "", ""], "r": "ABC", "e": "单元机组停机后，汽轮机需盘车防止转子弯曲；润滑油系统继续运行给轴瓦等提供润滑和冷却；锅炉需余热烘干避免潮湿腐蚀。而发电机定子冷却水系统正常停机后无需专门进行冲洗。答案选ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455492", "t": 2, "q": "金属疲劳破坏的主要特征包括（　）", "a": ["破坏断口存在疲劳源、疲劳裂纹扩展区和瞬断区", "破坏过程分为疲劳裂纹萌生、扩展和失稳断裂三个阶段", "破坏速度与应力循环次数呈负相关（循环次数越多，破坏越慢）", "破坏前没有明显的塑性变形", "", ""], "r": "ABD", "e": "A 选项，金属疲劳断口典型分为疲劳源、疲劳裂纹扩展区、瞬断区三个区域，表述正确。<br />B 选项，疲劳破坏过程依次为裂纹萌生、裂纹扩展、失稳断裂三个阶段，表述正确。<br />C 选项辨析：在应力水平高于疲劳极限时，应力循环次数越多，越容易发生疲劳破坏，不是循环次数越多破坏越慢，该说法错误。<br />D 选项，疲劳破坏属于脆性断裂特征，构件破坏前无明显塑性变形，会突然断裂，表述正确。<br />综上，正确选项 ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455493", "t": 2, "q": "汽轮机运行中，导致其动静摩擦的原因可能有（　）", "a": ["锅炉蒸汽温度突然升高，导致汽轮机转子热变形", "汽轮机轴承油膜破坏，转子中心偏移", "汽轮机升速过快，离心力使转子变形", "凝汽器真空度异常降低，引起轴向推力变化", "", ""], "r": "ABC", "e": "A选项蒸汽温度突然升高使转子热变形、B选项轴承油膜破坏致转子中心偏移、C选项升速过快使转子离心变形，都可能造成动静部分间隙变化引发摩擦；D选项凝汽器真空度异常降低主要影响轴向推力，一般不会直接导致动静摩擦。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455494", "t": 2, "q": "单元机组启动时，汽轮机冲转的必要条件有", "a": ["汽轮机润滑油压达到规定值", "主蒸汽温度达到规定值", "凝汽器真空度达到规定值", "发电机励磁系统投入", "", ""], "r": "ABC", "e": "汽轮机冲转需保证设备正常运行条件，润滑油压、主蒸汽温度、凝汽器真空度是重要条件，而发电机励磁系统投入在冲转之后。答案选ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455495", "t": 2, "q": "锅炉水冷壁的主要作用包括以下哪些?（　）", "a": ["组成炉膛的燃烧空间", "调节锅炉的蒸汽压力", "降低排烟温度", "保护锅炉炉墙", "", ""], "r": "AD", "e": "水冷壁布置在炉膛四周，组成炉膛的燃烧空间，能吸收高温烟气的热量，保护炉墙。调节蒸汽压力靠其他设备，降低排烟温度主要是省煤器等的作用。答案选AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455496", "t": 2, "q": "下列因素中，会影响金属材料蠕变变形速率的有", "a": ["材料的化学成分", "材料所受的应力大小", "材料的晶粒度", "材料的表面粗糙度", "", ""], "r": "ABC", "e": "材料化学成分影响其内部结构和性能，会影响蠕变；应力大小直接决定蠕变驱动力，影响速率；晶粒度不同，原子扩散等情况不同，对蠕变有影响。而表面粗糙度主要影响材料的摩擦、外观等，与蠕变变形速率关系不大。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455497", "t": 2, "q": "单元机组正常运行时，发电机端电压偏离额定值的调整方式有（　）", "a": ["调节发电机的有功功率输出", "调整励磁变压器的输出电压", "改变汽轮机的进汽量", "调节发电机励磁系统的励磁电流", "", ""], "r": "BD", "e": "答案：BD发电机端电压偏离额定值的调整主要通过改变发电机的励磁电流来实现，励磁电流的变化会影响发电机产生的磁场强度，从而调整端电压。调整励磁变压器的输出电压也可以间接改变发电机的励磁电流，达到调整端电压的目的。因此，选项B和D是正确的。调节发电机的有功功率输出（选项A）和改变汽轮机的进汽量（选项C）主要影响的是发电机的功率输出，而不是直接影响端电压的调整。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455498", "t": 2, "q": "单元机组启动时，汽轮机冲转的条件包括以下哪些?（　）", "a": ["锅炉主蒸汽参数达到规定值", "发电机定子冷却水系统投运正常", "汽轮机上下缸温差符合要求", "凝汽器真空度达到规定值", "", ""], "r": "ABCD", "e": "A 主蒸汽压力温度达标，满足冲转蒸汽品质；B 发电机定子冷却水系统正常，防止定子线圈过热；C 上下缸温差控制在限值内，避免转子变形；D 凝汽器真空达到规定值，减小冲转阻力，降低排汽温度。以上均为汽轮机冲转必备条件。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455499", "t": 2, "q": "金属材料在高温下发生脆化的主要类型有", "a": ["氢脆", "热脆化（蓝脆）", "时效脆化", "冷脆", "", ""], "r": "BC", "e": "这是一道关于金属材料在高温下发生脆化类型的选择题。我们来简单分析一下各个选项：A. 氢脆：这主要是在金属中由于氢的渗入导致的脆化，不仅限于高温环境。B. 热脆化（蓝脆）：这是金属材料在特定高温范围（通常是200～300℃）下发生的脆化现象，符合题目中“高温下”的条件。C. 时效脆化：这是金属在经过热处理后的长时间保温过程中发生的脆化，也涉及高温过程。D. 冷脆：如其名，这是金属在低温条件下发生的脆化，与题目要求的“高温下”不符。综上所述，B选项“热脆化（蓝脆）”和C选项“时效脆化”都是金属材料在高温下发生的脆化类型。所以，正确答案是BC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455500", "t": 2, "q": "下列关于一次调频和二次调频的区别，说法正确的有（　）", "a": ["一次调频由机组自身调速系统自动完成，二次调频需调度中心协调控制", "一次调频调节范围小，仅能应对频率小幅波动;二次调频调节范围大，应对频率大幅波动", "一次调频属于有差调节，二次调频属于无差调节", "一次调频的调节量由机组调速器特性决定，二次调频的调节量由电网负荷需求决定", "", ""], "r": "ABCD", "e": "一次调频靠机组自身调速系统自动动作，调节范围小且是有差调节，调节量取决于机组调速器特性；二次调频需调度中心协调，调节范围大且是无差调节，调节量由电网负荷需求定。ABCD选项均符合两者区别。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455501", "t": 2, "q": "锅炉省煤器的主要作用有", "a": ["降低锅炉排烟温度", "加热锅炉给水", "提高锅炉热效率", "减少锅炉结垢", "", ""], "r": "ABC", "e": "省煤器吸收烟气热量加热锅炉给水，能降低排烟温度，进而提高锅炉热效率。而减少锅炉结垢并非其主要作用。答案选ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455502", "t": 2, "q": "锅炉的主要热力系统包括以下哪些?（　）", "a": ["抽汽回热系统", "主蒸汽系统", "凝结水系统", "润滑油系统", "", ""], "r": "ABC", "e": "答案：ABC锅炉的主要热力系统主要包括抽汽回热系统、主蒸汽系统和凝结水系统。润滑油系统虽然也是锅炉系统的一部分，但它主要属于机械润滑系统，不属于热力系统，因此不包括在主要热力系统中。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455503", "t": 2, "q": "单元机组锅炉的主要热力系统包括", "a": ["回热加热系统", "主蒸汽系统", "再热蒸汽系统", "给水系统", "", ""], "r": "ABCD", "e": "单元机组锅炉的主要热力系统通常涵盖多个关键部分，这些部分共同确保锅炉的高效和安全运行。首先，我们来看各个选项：A. 回热加热系统：这是锅炉热力系统中的一个重要组成部分，它通过回收部分排汽的热量来预热进入锅炉的给水，从而提高锅炉的整体效率。B. 主蒸汽系统：显然，这是锅炉的核心部分，负责产生和输送主蒸汽到汽轮机发电。C. 再热蒸汽系统：在大型锅炉中，为了提高汽轮机的效率，蒸汽在做完一部分功后会再次被加热（即再热），这也是锅炉热力系统的一个重要环节。D. 给水系统：它负责向锅炉供应所需的给水，是锅炉运行的基础。综上所述，这四个选项都是单元机组锅炉的主要热力系统组成部分。所以，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455504", "t": 2, "q": "锅炉启动过程中，\"炉膛吹扫\"操作的目的包括（　）", "a": ["使炉膛温度均匀升高，避免热应力", "清除炉膛内的积灰和结渣", "清除炉膛内残留的可燃气体，防止点火时发生爆炸", "检查炉膛内烟风系统的密封性", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455505", "t": 2, "q": "锅炉水冷壁的主要作用有", "a": ["降低炉膛出口烟气温度", "保护锅炉炉膛壁面", "提高锅炉热效率", "产生饱和蒸汽", "", ""], "r": "ABCD", "e": "核心功能定位<br />锅炉水冷壁是布置在炉膛四周的辐射蒸发受热面。<br />其核心功能围绕吸热产汽与保护炉膛展开，是锅炉内汽水循环的关键环节。<br />选项 A<br />水冷壁通过吸收炉膛内高温火焰的辐射热，使烟气在炉膛出口处的温度显著降低。<br />这有效防止了后续对流受热面的结渣与超温，属于其辐射吸热功能的直接体现。<br />选项 B<br />水冷壁作为炉膛壁面的第一道热屏障，直接阻挡高温火焰与炉墙接触。<br />这避免了炉墙因直接受辐射而过热、变形或损坏，是保护炉膛壁面的关键结构。<br />选项 C<br />水冷壁将燃料燃烧释放的大量辐射热高效转化为蒸汽的汽化潜热。<br />这大幅提升了锅炉的辐射换热效率，从而直接提高了整台锅炉的热效率。<br />选项 D<br />水冷壁内部流通的是汽水混合物。<br />在亚临界及以下锅炉中，水冷壁是产生饱和蒸汽的主要场所，完成了水从液态到气态的关键相变。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455506", "t": 2, "q": "影响锅炉尾部低温腐蚀的因素主要有哪些?（　）", "a": ["尾部受热面的壁温", "锅炉的给水温度", "烟气中三氧化硫的含量", "燃料中的硫含量", "", ""], "r": "ACD", "e": "低温腐蚀与硫酸露点相关，燃料含硫燃烧生成二氧化硫，部分会转化为三氧化硫，三氧化硫与水蒸气形成硫酸蒸汽，当受热面壁温低于硫酸露点就会发生腐蚀。所以尾部受热面壁温、烟气中三氧化硫含量、燃料中硫含量都影响低温腐蚀，给水温度影响不大。答案选ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455507", "t": 2, "q": "金属材料松弛现象的主要应用场景有", "a": ["金属弹簧的长期使用", "汽轮机螺栓的热紧", "发电机定子绕组的固定", "金属刀具的刃磨", "", ""], "r": "ABC", "e": "（材料力学·应力松弛）<br />应力松弛定义：零件在总变形量不变的条件下，其内部应力随时间推移而逐渐降低的现象。本质是材料内部弹性变形自发转变为塑性变形。<br />典型应用场景（应力松弛危害/需考虑的场景）：<br />A. 金属弹簧的长期使用​ <br />弹簧依靠弹性变形提供弹力（应力），长期使用中若长度被固定（变形不变），应力会逐渐下降→弹力衰减，即松弛。<br />B. 汽轮机螺栓的热紧​ <br />螺栓拧紧后（预紧应力），在高温下长期工作，即使长度不变，预紧应力也会因松弛而下降，导致法兰密封不严，是汽轮机典型问题。<br />C. 发电机定子绕组的固定​ <br />绕组嵌线后靠槽楔、绝缘垫条固定，长期受热和电磁振动，固定应力可能松弛，导致绕组松动、磨损。<br />排除项：<br />D. 金属刀具的刃磨​ <br />刃磨是机械加工去除材料的过程，与应力松弛无关，不属于松弛现象的应用场景。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455508", "t": 2, "q": "以下关于一次调频和二次调频的区别，正确的有哪些?（　）", "a": ["一次调频响应速度快，二次调频响应速度慢", "一次调频调节范围小，二次调频调节范围大", "一次调频主要调整电网频率偏差，二次调频主要维持电网频率稳定", "一次调频不改变机组负荷基准，二次调频改变机组负荷基准", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455509", "t": 2, "q": "影响金属材料疲劳寿命的因素有", "a": ["材料的表面状态（如是否有裂纹）", "材料的工作温度", "交变应力的循环次数", "交变应力的幅值", "", ""], "r": "ABCD", "e": "材料表面裂纹会成为疲劳源，影响疲劳寿命；工作温度会改变材料性能进而影响疲劳寿命；交变应力循环次数越多，越易疲劳；交变应力幅值越大，疲劳损伤越快。ABCD 选项因素均会影响金属材料疲劳寿命。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455510", "t": 2, "q": "以下关于金属蠕变极限的描述，正确的有哪些?（　）", "a": ["蠕变极限与材料的温度无关", "蠕变极限是材料的固有属性，不随加工工艺变化", "蠕变极限值越高，材料的抗蠕变能力越强", "蠕变极限通常用符号σ₁/₁₀⁵表示，其中1表示1%的蠕变变形量，10⁵表示10⁵小时", "", ""], "r": "CD", "e": "蠕变极限与温度有关，且会受加工工艺影响，A、B错误；蠕变极限值越高，材料越难发生蠕变，抗蠕变能力越强，C正确；蠕变极限符号中1表示规定时间内产生1%的蠕变变形量，10⁵表示10⁵小时，D正确。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455511", "t": 2, "q": "金属热应力产生的原因包括（　）", "a": ["材料受到外部约束，热胀冷缩无法自由进行", "材料内部组织转变（如相变）导致体积变化", "材料各部分温度变化不均匀，热胀冷缩程度不同", "材料在高温下发生蠕变变形", "", ""], "r": "ABC", "e": "热应力是因热胀冷缩受限制、组织转变体积变化、各部分热胀冷缩程度不同产生，而蠕变变形是材料在长时间恒定载荷和高温下的塑性变形，并非热应力产生原因。答案选ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455512", "t": 2, "q": "单元机组正常运行时，不属于发电机输出功率的调节依据是", "a": ["锅炉的最大蒸发量", "机组的额定功率", "电网频率", "汽轮机的最大进汽量", "", ""], "r": "ABD", "e": "单元机组并网运行时，发电机输出功率的调节依据是电网频率（C）——频率变化反映电网负荷供需失衡，调速系统据此调节汽门开度，改变功率以维持频率稳定。<br />而 A（锅炉最大蒸发量）、B（机组额定功率）、D（汽轮机最大进汽量）​ 均为设备的安全限制条件（上限），决定机组“最多能发多少电”，属于约束边界，而非运行中“该发多少电”的调节依据。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455513", "t": 2, "q": "单元机组正常运行时，锅炉蒸汽温度调节的主要方式有（　）", "a": ["摆动燃烧器（改变火焰位置）", "调整省煤器给水流量", "喷水减温（直接冷却蒸汽）", "改变喷燃器倾角（调整火焰中心高度）", "", ""], "r": "ACD", "e": "锅炉蒸汽温度调节主要方式有改变火焰中心高度和喷水减温等。摆动燃烧器、改变喷燃器倾角可调整火焰中心高度，喷水减温能直接冷却蒸汽来调节温度。省煤器给水流量主要影响省煤器吸热量等，不是蒸汽温度调节主要方式。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455514", "t": 2, "q": "下列关于金属材料热应力的说法，正确的有", "a": ["热应力是由于材料各部分温度不均导致的", "热应力会随时间的推移而逐渐消失（松弛）", "热应力可以在任何温度环境下产生", "热应力可能是拉应力，也可能是压应力", "", ""], "r": "ABD", "e": "热应力由材料各部分温度不均产生，随时间会松弛，可能是拉或压应力，但需有温度变化才会产生，不是任何温度环境都行。答案：ABD", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455515", "t": 2, "q": "金属材料蠕变变形的主要特点有", "a": ["变形是缓慢且持续的", "变形在恒定温度和恒定应力下发生", "变形与时间相关", "变形后材料强度会提高", "", ""], "r": "ABC", "e": "金属材料蠕变是在恒定温度和应力下，随时间缓慢且持续发生的变形。而蠕变会降低材料强度。答案ABC符合蠕变特点，D选项错误。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455516", "t": 2, "q": "单元机组正常运行时，凝汽器真空度的维持主要依靠以下哪些设备?（　）", "a": ["真空泵", "凝结水泵", "循环水泵", "凝汽器", "", ""], "r": "AC", "e": "真空泵用于抽出凝汽器内不凝结气体维持真空；循环水泵使循环水在凝汽器中流动，带走蒸汽热量使其凝结，利于维持真空。凝结水泵主要是将凝结水抽出，与维持真空度无直接主要关联；凝汽器是设备载体，本身不直接维持真空。答案选AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455517", "t": 2, "q": "单元机组正常运行时，锅炉汽包水位的调节方式主要有哪些?（　）", "a": ["双冲量水位调节", "单冲量水位调节", "三冲量水位调节", "手动调节", "", ""], "r": "ABCD", "e": "单冲量只采集水位信号；双冲量引入蒸汽流量；三冲量（水位 + 蒸汽流量 + 给水流量）是单元机组正常运行主流自动调节方式；手动调节作为备用调节手段。", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455518", "t": 2, "q": "下列关于单元机组一次调频和二次调频的区别，说法正确的有", "a": ["一次调频仅调节汽轮机，二次调频仅调节锅炉", "一次调频由机组自身控制系统响应，二次调频由电网调度中心控制", "一次调频的调节范围比二次调频大", "一次调频的调节目的是快速抑制频率波动，二次调频是恢复频率至额定值", "", ""], "r": "BD", "e": "一次调频是机组自身控制系统根据频率变化自动调节，能快速抑制频率波动；二次调频由电网调度中心控制，目的是将频率恢复到额定值。A选项，一次和二次调频都涉及汽轮机和锅炉调节；C选项，二次调频调节范围更大。答案：BD", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455519", "t": 2, "q": "金属材料发生蠕变破坏的必要条件包括（　）", "a": ["材料存在初始裂纹", "腐蚀介质存在", "一定的温度（高于材料的蠕变温度，通常为0.3-0.5倍熔点温度）", "长期的恒定载荷（或恒定应力）", "", ""], "r": "CD", "e": "金属材料产生蠕变需在一定温度（高于材料的蠕变温度，常为0.3 - 0.5倍熔点温度）和长期恒定载荷（或恒定应力）条件下。初始裂纹和腐蚀介质不是蠕变破坏必要条件。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455520", "t": 2, "q": "影响汽轮机胀差的因素主要有哪些?（　）", "a": ["汽轮机的转速", "汽轮机的加热或冷却速度", "汽轮机的负荷变化速度", "汽轮机的真空度变化", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455521", "t": 2, "q": "单元机组停机时，若采用额定参数停机，其特点有", "a": ["停机时间短", "适用于机组紧急停机", "适用于机组计划检修停机", "停机过程中主蒸汽参数保持额定值", "", ""], "r": "CD", "e": "额定参数停机时主蒸汽参数保持额定值，多用于计划检修停机。而停机时间短、适用于紧急停机一般是滑参数停机特点。答案：CD", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455522", "t": 2, "q": "以下关于金属松弛的描述，正确的有哪些?（　）", "a": ["金属松弛是在恒定应变下，应力随时间逐渐减小的现象", "金属松弛与金属蠕变是同一现象的不同表现", "金属松弛的速度与温度有关，温度越高，松弛越快", "金属松弛过程中，材料会发生塑性变形", "", ""], "r": "ACD", "e": "金属松弛是恒定应变下应力随时间减小，与蠕变不同，蠕变是恒定应力下应变随时间增加；温度越高原子活动加剧，松弛越快；松弛过程中会有塑性变形。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034800277659455523", "t": 2, "q": "发电机主要热力系统中，用于冷却发电机转子的冷却方式有（　）", "a": ["氢气内部冷却", "油浸冷却", "表面冷却", "水内冷", "", ""], "r": "AD", "e": "发电机转子常用氢气内部冷却和水内冷方式，油浸冷却一般不用于冷却发电机转子，表面冷却不是针对转子的典型冷却方式。答案选AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689216", "t": 3, "q": "二次调频属于无差调节，即通过二次调频可将电网频率精确恢复至额定值，无频率偏差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689217", "t": 3, "q": "锅炉过热器的汽温调节中，\"烟气挡板调节\"是通过改变烟气在过热器和省煤器之间的流量分配，调整过热器的吸热量来控制汽温。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "锅炉过热器汽温调节时，烟气挡板调节确实是通过改变烟气在过热器和省煤器等受热面间的流量分配，进而改变过热器吸热量来控制汽温。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689218", "t": 3, "q": "单元机组正常运行时，二次调频的响应速度比一次调频快，因此二次调频主要用于应对电网频率的快速波动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一次调频响应速度比二次调频快，一次调频用于应对电网频率的快速波动，二次调频主要用于消除稳态频率偏差。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689219", "t": 3, "q": "汽轮机回热加热系统中，低压加热器的疏水通常采用逐级自流的方式，最终排入凝汽器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在汽轮机回热加热系统里，低压加热器的疏水常采用逐级自流，最后流入凝汽器，这是常见做法。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689220", "t": 3, "q": "单元机组冷态启动时，汽轮机冲转的主蒸汽温度应低于汽轮机高压缸内壁温度，以防止缸壁过热。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冷态启动时，主蒸汽温度应高于高压缸内壁温度，这样才能使汽轮机部件均匀受热，避免产生过大热应力，而不是低于。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689221", "t": 3, "q": "汽轮机的轴封供汽系统的主要作用是防止空气漏入凝汽器，维持凝汽器真空，同时防止汽轮机内的蒸汽向外泄漏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴封供汽系统能在汽轮机高压端防止蒸汽外漏，在低压端防止空气漏入凝汽器，维持真空。所以该描述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689222", "t": 3, "q": "金属材料的蠕变速率随温度的升高而增大，随应力的增大而减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属材料的蠕变速率随温度升高和应力增大都会增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689223", "t": 3, "q": "金属材料的疲劳极限是指材料在交变应力作用下，能承受无限次应力循环而不发生破坏的最大应力值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是疲劳极限的标准定义。材料在交变应力作用下，当应力低于某一值时可承受无限次应力循环而不破坏，此应力就是疲劳极限。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689224", "t": 3, "q": "发电机氢气冷却系统中，氢气的纯度越高，冷却效率越高，因此应将氢气纯度控制在100%。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实际中无法将氢气纯度控制到100%，且当氢气中混入空气等杂质时，在一定比例下有爆炸危险，所以不能追求100%纯度。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689225", "t": 3, "q": "金属材料的蠕变曲线分为减速蠕变阶段、匀速蠕变阶段和加速蠕变阶段，其中匀速蠕变阶段的蠕变速率最大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在金属材料的蠕变曲线的三个阶段中，加速蠕变阶段的蠕变速率才是最大的，并非匀速蠕变阶段。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689226", "t": 3, "q": "单元机组滑参数停机过程中，主蒸汽温度和压力随负荷降低而逐渐降低，其主要目的是减小机组各部件的热应力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "滑参数停机时让主蒸汽温度和压力随负荷降低而降低，能使金属温度均匀缓慢下降，有效减小机组各部件热应力。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689227", "t": 3, "q": "单元机组正常运行时，凝汽器冷却水温度升高会导致凝汽器真空度下降，汽轮机排汽温度升高，机组发电功率降低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "凝汽器冷却水温度升高，冷却效果变差，蒸汽难以充分凝结，使凝汽器内压力升高，真空度下降。排汽压力升高会导致排汽温度升高，蒸汽做功能力降低，从而使机组发电功率降低。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689228", "t": 3, "q": "锅炉制粉系统中的直吹式制粉系统，其煤粉储存量较大，因此适应机组负荷变化的能力较强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "直吹式制粉系统没有中间煤粉仓，煤粉随磨随送，煤粉储存量小。当机组负荷变化时，需及时调整磨煤机出力，响应速度慢，适应机组负荷变化能力弱。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689229", "t": 3, "q": "汽轮机低压缸的排汽为过热蒸汽，进入凝汽器后被冷却水冷却，凝结成过冷水。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "汽轮机低压缸排汽是湿蒸汽，进入凝汽器被冷却凝结成饱和水而非过冷水。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689230", "t": 3, "q": "金属材料的热应力大小与材料的线膨胀系数成正比，线膨胀系数越大，相同温度变化下产生的热应力越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热应力公式表明热应力与材料线膨胀系数、弹性模量和温度变化量相关，在弹性模量和温度变化量一定时，线膨胀系数越大，热应力越大。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689231", "t": 3, "q": "锅炉汽包的虚假水位是指汽包内实际水位与水位计指示水位不一致的现象，通常在锅炉负荷突然变化时出现。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "负荷突变（升 / 降负荷），汽包压力快速改变，炉水饱和状态变化，汽水体积膨胀或收缩，出现虚假水位，水位计指示和真实水位不一致，属于锅炉典型现象。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689232", "t": 3, "q": "锅炉再热器系统若发生泄漏，会导致锅炉蒸汽压力下降，机组负荷降低，应立即停机处理。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689233", "t": 3, "q": "金属材料的应力松弛是指在恒定应变作用下，材料的应力随时间逐渐减小的现象。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689234", "t": 3, "q": "汽轮机高压转子在热态启动过程中，转子外表面温度高于中心孔温度，外表面产生压应力，中心孔产生拉应力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热态启动时，蒸汽温度高，转子外表面受热升温快，而中心孔升温慢。外表面膨胀受中心孔约束，产生压应力，中心孔受外表面膨胀拉伸，产生拉应力。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689235", "t": 3, "q": "金属材料的松弛现象在工程上有一定应用，例如利用松弛现象减少焊接构件的残余应力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属材料的松弛是指在高温和恒定应变下，应力随时间逐渐降低的现象。利用这一特性，可通过加热焊接构件等方式，让其发生松弛，从而减少残余应力。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689236", "t": 3, "q": "单元机组正常运行时，若电网频率升高，汽轮机调速系统会自动关小调速汽门，减少进汽量，降低机组有功功率输出，使频率下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电网频率升高时，汽轮机调速系统感知后会按调节原理自动关小调速汽门，减少进汽量，进而降低机组有功功率输出，使电网功率供需重新平衡，频率随之下降。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689237", "t": 3, "q": "金属材料的热松弛现象在常温下也会发生，但由于温度低，松弛速率非常缓慢，通常可忽略不计。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689238", "t": 3, "q": "锅炉主蒸汽系统中，减温器的主要作用是降低主蒸汽的压力，防止锅炉超压运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "减温器主要作用是降低主蒸汽温度，而非降低压力防止超压，题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689239", "t": 3, "q": "金属蠕变变形是不可逆的，即使去除载荷，已产生的蠕变变形也无法恢复。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属蠕变是在长时间恒定应力作用下产生缓慢塑性变形的现象，塑性变形是不可逆的，去除载荷后已产生的蠕变变形不能恢复。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689240", "t": 3, "q": "金属材料的疲劳极限是指材料在交变应力作用下，经过10的7次方循环后仍不发生破坏的最大应力幅值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属材料的疲劳极限通常定义为：材料在交变应力作用下，经过无限次循环（对于钢等典型金属，常以 10<sup>7<\/sup>次循环为基准）仍不发生疲劳破坏的最大应力幅值。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689241", "t": 3, "q": "汽轮机润滑油系统的主要作用是冷却汽轮机轴承，并为汽轮机转子提供润滑，属于热力系统的一部分。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "润滑油系统主要是为汽轮机轴承提供润滑和冷却，它不属于热力系统，热力系统是实现热力循环完成能量转换的系统。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689242", "t": 3, "q": "单元机组启动时，汽轮机冲转前必须投入盘车装置，以防止汽轮机转子因受热不均而弯曲。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在单元机组启动时，汽轮机冲转前投入盘车装置，能使转子均匀受热，避免因受热不均导致弯曲，保障设备安全运行。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689243", "t": 3, "q": "锅炉尾部低温腐蚀的主要原因是烟气中的二氧化硫与水蒸气结合生成硫酸，硫酸在受热面上凝结导致腐蚀。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689244", "t": 3, "q": "单元机组一次调频的调节精度由机组调速器的速度变动率决定，速度变动率越小，一次调频的调节精度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "速度变动率反映了机组转速变化时负荷的变化特性，速度变动率越小，在相同转速变化下，机组负荷变化越大，能更精准地响应频率变化，一次调频调节精度越高。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689245", "t": 3, "q": "单元机组滑参数启动时，主蒸汽的升压速度应快于升温速度，以确保蒸汽具有足够的过热度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "滑参数启动时，升温速度应快于升压速度，这样才能保证蒸汽有足够过热度。若升压速度快于升温速度，易导致蒸汽过热度不足。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689246", "t": 3, "q": "单元机组滑参数停机过程中，主蒸汽温度应低于对应压力下的饱和温度，以防止蒸汽带水。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "滑参数停机过程中，主蒸汽温度应高于对应压力下的饱和温度一定数值，要有过热度，防止蒸汽带水，而不是低于饱和温度，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689247", "t": 3, "q": "单元机组二次调频的调节精度比一次调频高，主要用于消除电网频率的静态偏差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一次调频是有差调节，只能减缓电网频率变化，不能消除静态偏差；二次调频能实现无差调节，调节精度更高，可消除电网频率的静态偏差。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689248", "t": 3, "q": "金属材料的疲劳寿命是指材料在交变应力作用下，从开始受力到发生破坏所经历的应力循环次数。循环次数越多，疲劳寿命越长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689249", "t": 3, "q": "单元机组冷态启动时，汽轮机冲转前必须建立足够的凝汽器真空，其主要目的是防止汽轮机冲转时排汽温度过高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冷态启动冲转前建立足够凝汽器真空，主要是为了降低排汽压力和温度，使汽缸内工质密度减小，避免过多蒸汽在冲动转子时被消耗，提高冲动转子的效率，同时也可防止排汽温度过高损坏凝汽器等设备，所以题干表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689250", "t": 3, "q": "单元机组正常运行时，若电网频率升高，一次调频会使汽轮机的进汽量增加，从而提高机组负荷，降低电网频率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电网频率升高时，一次调频会使汽轮机进汽量减少，降低机组负荷，以此来降低电网频率，而不是进汽量增加。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689251", "t": 3, "q": "单元机组正常运行时，发电机的纵差动保护主要用于保护发电机定子绕组的匝间短路故障。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "发电机纵差动保护主要保护发电机定子绕组及其引出线的相间短路故障，而非匝间短路故障。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689252", "t": 3, "q": "金属材料的蠕变现象只有在高温环境下才会发生，常温下不会出现蠕变。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多数金属材料在常温下蠕变不明显，但一些低熔点金属在常温下也会有蠕变现象，并非只有高温环境才会发生。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689253", "t": 3, "q": "金属材料的氢脆现象是指材料在高温下吸收氢气后，其塑性和韧性显著下降，易发生脆断的现象。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属材料的氢脆是在常温、静载荷下，因吸收氢而导致塑性和韧性下降、易脆断，并非高温下。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689254", "t": 3, "q": "金属材料的热松弛现象是指在恒定应变和恒定温度下，材料内部的应力随时间逐渐增大的过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热松弛是在恒定应变和恒定温度下，材料内部应力随时间逐渐减小，而不是增大。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689255", "t": 3, "q": "汽轮机回热加热系统中，高压加热器的疏水应直接排入凝汽器，以简化系统结构。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "高压加热器的疏水一般采用逐级自流的方式，排入相邻较低压力的加热器，而不是直接排入凝汽器，因为直接排入凝汽器会造成热量损失，降低机组热效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689256", "t": 3, "q": "锅炉制粉系统中，中间储仓式制粉系统的磨煤机出力与锅炉负荷无关，磨煤机可在经济负荷下运行，因此经济性较高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "中间储仓式制粉系统中，磨煤机出力确实不受锅炉负荷直接影响，能在经济负荷下运行，减少了磨煤机因锅炉负荷频繁变动带来的不经济运行情况，所以经济性较高。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689257", "t": 3, "q": "金属材料的时效脆化是指材料在常温下长期存放后，其硬度和强度升高，塑性和韧性下降的现象，与高温环境无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属材料时效脆化不仅有常温下长期存放导致的自然时效，还有在一定高温等条件下发生的人工时效，所以该现象与高温环境有关，题干表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689258", "t": 3, "q": "金属热松弛现象仅发生在金属材料处于弹性变形阶段，若材料已产生塑性变形，则不会发生松弛。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属热松弛是指在高温和总变形量不变的条件下，弹性变形随时间不断转化为塑性变形，从而使应力随时间逐渐降低的现象。它可发生在材料已产生塑性变形后，并非仅在弹性变形阶段。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689259", "t": 3, "q": "金属疲劳破坏的断口上，疲劳裂纹扩展区的特征是存在明显的\"贝壳状\"或\"海滩状\"条纹，这是疲劳破坏的典型标志。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属疲劳破坏时，疲劳裂纹扩展区会出现明显“贝壳状”或“海滩状”条纹，这是疲劳破坏的典型特征。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689260", "t": 3, "q": "金属材料的氢脆化是可逆的，只要将材料置于无氢环境中，氢脆损伤即可完全恢复。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属材料的氢脆化大多是不可逆的，即便置于无氢环境，已造成的氢脆损伤也难以完全恢复。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689261", "t": 3, "q": "金属材料的热应力是由于材料各部分温度不均匀，导致热膨胀或收缩量不同，而材料受到约束无法自由变形所产生的应力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热应力产生原因正是材料各部分温度不均，热胀冷缩量不同且受约束不能自由变形。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689262", "t": 3, "q": "单元机组停机时，为缩短停机时间，可在汽轮机打闸后立即停止凝汽器真空泵运行，破坏凝汽器真空。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "汽轮机打闸后立即停止凝汽器真空泵运行、破坏凝汽器真空，会使汽缸内的蒸汽无法顺畅排出，导致汽缸温度升高、胀差增大，还可能造成动静摩擦等严重危害，不能为缩短停机时间这么操作。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689263", "t": 3, "q": "金属冷脆现象的发生温度是固定的，与金属材料的成分和组织无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属冷脆现象的发生温度并非固定，它与金属材料的成分和组织密切相关，不同成分和组织的金属冷脆发生温度不同。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689264", "t": 3, "q": "锅炉给水系统中，除氧器的除氧效果只与给水温度有关，温度越高，除氧效果越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "除氧器除氧效果不仅与给水温度有关，还和压力、水与蒸汽的接触面积、水在除氧器内的停留时间等因素有关。", "ap": [false, false, false, false, false, false]}, {"id": "2034800281463689265", "t": 3, "q": "单元机组冷态启动时，锅炉升压速度应尽可能快，以缩短启动时间，提高机组经济性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冷态启动时若锅炉升压速度过快，会使受热面热应力增大，易损坏设备，不能单纯为缩短启动时间和提高经济性而快速升压。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第6章 单元机组运行（2）", "n": "基础练习题【含解析】 / 第6章 单元机组运行（2）", "qs": [{"id": "2034800284722663424", "t": 1, "q": "锅炉再热蒸汽系统中，再热器的布置位置通常选择在", "a": ["锅炉省煤器之后的低温烟气区域", "锕炉空气预热器之前的烟气区域", "锅炉对流管束的高温烟气区域", "锅炉炉膛水冷壁区域", "", ""], "r": "C", "e": "再热器需在较高温度下工作，对流管束处烟气温度高适合布置。省煤器后低温区温度低；空气预热器前烟气温度也不适合；炉膛水冷壁区域主要是辐射换热且温度分布不利于再热器。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663425", "t": 1, "q": "以下哪种情况会导致汽轮机的胀差增大（正值增大）?", "a": ["汽轮机加热速度过快", "凝汽器真空度升高", "汽轮机甩负荷", "汽轮机冷却速度过快", "", ""], "r": "A", "e": "汽轮机加热速度过快时，转子受热膨胀比汽缸快，会使胀差正值增大。凝汽器真空度升高一般使胀差减小；汽轮机甩负荷会使胀差减小；汽轮机冷却速度过快会使胀差减小。答案选A。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663426", "t": 1, "q": "发电机励磁系统的主要作用是（　）", "a": ["控制发电机的转速，参与二次调频", "维持发电机端电压稳定，调节无功功率", "保护发电机定子绕组，防止过电流", "调节发电机的有功功率，参与一次调频", "", ""], "r": "B", "e": "发电机励磁系统为发电机提供励磁电流，能维持发电机端电压稳定，还可调节发电机输出的无功功率。A选项控制转速主要靠调速系统；C选项保护定子绕组防止过电流是保护装置的功能；D选项调节有功功率参与一次调频也是调速系统作用。所以答案是B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663427", "t": 1, "q": "锅炉制粉系统中，直吹式制粉系统与中间储仓式制粉系统相比，其主要特点是?", "a": ["适应负荷变化能力强", "锅炉与制粉系统直接关联，负荷响应快", "系统复杂，占地面积大", "煤粉储存量大，可靠性高", "", ""], "r": "B", "e": "直吹式制粉系统中，磨好的煤粉直接吹入炉膛燃烧，锅炉与制粉系统直接关联，负荷响应快。A选项，中间储仓式适应负荷变化能力强；C选项，直吹式系统相对简单、占地小；D选项，直吹式基本不储存煤粉。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663428", "t": 1, "q": "锅炉给水系统中，高压加热器的疏水方式若采用\"逐级自流\"，其主要缺点是", "a": ["疏水易导致下一级加热器腐蚀", "疏水管道阻力大，需额外增加疏水泵", "疏水温度过高易使下一级加热器超压", "疏水热量损失大，机组热效率降低", "", ""], "r": "D", "e": "高压加热器“逐级自流”疏水会使部分热量随疏水排走，造成热量损失，降低机组热效率。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "203480
