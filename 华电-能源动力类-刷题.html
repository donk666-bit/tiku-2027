热流密度q和各层温度降ΔtA、ΔtB、ΔtC的关系正确的是（　）", "a": ["q与λA、λB、λC成正比（在厚度和温差等条件相同时），ΔtA<ΔtB<ΔtC", "q仅与λA有关，ΔtA=ΔtB=ΔtC", "q与总热阻成反比，ΔtA>ΔtB>ΔtC", "q与Δt成反比，ΔtA>ΔtB>ΔtC", "", ""], "r": "C", "e": "稳态多层平壁导热，热流密度 q = 总温差 / 总热阻，q 与总热阻成反比；单层热阻 R=δ/λ，λ 越小热阻越大，温度降 Δt=qR，λA 最小故 ΔtA 最大，ΔtA>ΔtB>ΔtC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104649", "t": 1, "q": "非稳态导热的时间常数τc=ρcV/(hA)，若物体的体积V增大，其他条件不变，则τc和物体温度响应速度的关系为（　）", "a": ["τc增大，响应速度加快", "τc减小，响应速度减慢", "τc减小，响应速度加快", "τc增大，响应速度减慢", "", ""], "r": "D", "e": "由公式τc = ρcV/(hA)可知，V增大，其他条件不变时，τc增大。时间常数越大，物体温度响应越慢。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104650", "t": 1, "q": "非稳态导热中，“半无限大物体”的温度分布计算需满足的条件是（　）", "a": ["物体初始温度均匀，且表面热流密度恒定", "物体初始温度均匀，且表面温度恒定", "物体厚度远小于热渗透深度，且加热时间较长", "物体厚度远大于热渗透深度，且加热时间较短", "", ""], "r": "D", "e": "半无限大物体模型适用条件：**物体厚度远大于热渗透深度，加热时间较短**，热量还没有传到物体另一侧边界，边界影响尚未显现，就可以按半无限大物体计算。<br />- A、B：只是边界条件类型（恒热流 / 恒温），不是半无限大模型成立的前提；<br />- C：厚度远小于热渗透深度、时间长，不符合；<br />- D  对，厚度≫热渗透深度，加热时间短。", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104652", "t": 1, "q": "根据基尔霍夫定律，对于任意灰体表面，其吸收率α和发射率ε的关系是", "a": ["α<ε", "α=ε，且仅在热平衡条件下成立", "α=ε，且与表面温度无关", "α>ε", "", ""], "r": "B", "e": "基尔霍夫定律α=ε成立的必要条件是热平衡；灰体也必须满足热平衡，吸收率才等于发射率，非热平衡状态二者不一定相等。", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104653", "t": 1, "q": "根据基尔霍夫定律，下列说法正确的是（　）", "a": ["灰体的吸收率α与波长无关，故其发射率ε也与波长无关，但α≠ε", "在热平衡条件下，物体的吸收率α等于其发射率ε", "黑体的吸收率α=1，故其发射率ε>1", "任何物体的吸收率α都等于其发射率ε，与温度无关", "", ""], "r": "B", "e": "基尔霍夫定律指出在热平衡条件下，物体的吸收率α等于其发射率ε 。A选项灰体α=ε；C选项黑体发射率ε=1；D选项需在热平衡条件下且与温度有关。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104654", "t": 1, "q": "根据普朗特定律，黑体表面的辐射力E_b（单位:W/m²）与表面热力学温度T（单位:K）的关系是", "a": ["E_b与T³成正比", "E_b与T成正比", "E_b与T²成正比", "E_b与T⁴成正比", "", ""], "r": "D", "e": "普朗特定律即斯蒂芬 - 玻尔兹曼定律，其表达式为「test/yiwen_img/importSubject/2034800203239919616.png」，「test/yiwen_img/importSubject/2034800203281862656.png」为常数，所以黑体表面的辐射力「test/yiwen_img/importSubject/2034800203319611392.png」与表面热力学温度T的四次方成正比。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104655", "t": 1, "q": "根据斯蒂芬-玻尔兹曼定律，灰体的辐射力E灰体为（　）", "a": ["ασT^4（α为灰体吸收率，α>1）", "εσT^4（ε为灰体发射率，0<ε<1）", "σT^4（与黑体相同）", "εσT（与温度一次方成正比）", "", ""], "r": "B", "e": "根据斯蒂芬-玻尔兹曼定律，灰体的辐射力 E = εσT⁴，其中 ε 为灰体的发射率（0<ε<1），σ 为黑体辐射常数，T 为热力学温度。辐射力与温度的四次方成正比。<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104656", "t": 1, "q": "管内强制对流换热中，当流体处于层流状态且管长足够长（充分发展段），若流体的导热系数λ增大，其他条件不变，则努塞尔数Nu和对流换热系数h的变化为（　）", "a": ["Nu增大，h增大", "Nu不变，h不变", "Nu增大，h不变", "Nu不变，h增大", "", ""], "r": "D", "e": "充分发展层流管内强制对流，Nu为定值；h=Nu·λ/d,λ增大则 h增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104657", "t": 1, "q": "管内强制对流换热中，若流体的流速增大，其他条件不变，则雷诺数Re和对流换热系数h的变化为（　）", "a": ["Re减小，h增大", "Re增大，h增大", "Re减小，h减小", "Re增大，h减小", "", ""], "r": "B", "e": "雷诺数Re与流速成正比，流速增大，Re增大；对流换热系数h与流速有关，流速增大，流体扰动增强，h增大。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104658", "t": 1, "q": "黑体在温度T1=500K和T2=1000K时的辐射力之比E1/E2为（　）", "a": ["1:16", "1:8", "1:4", "1:2", "", ""], "r": "A", "e": "根据斯蒂芬 - 玻尔兹曼定律，黑体辐射力「test/yiwen_img/importSubject/2034800203474800640.png」，所以「test/yiwen_img/importSubject/2034800203529326592.png」，已知「test/yiwen_img/importSubject/2034800203588046848.png」，「test/yiwen_img/importSubject/2034800203667738624.png」，则「test/yiwen_img/importSubject/2034800203718070272.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104659", "t": 1, "q": "灰体的吸收率α与发射率ε的关系为（　）", "a": ["仅在热平衡时α=ε", "任何情况下α=ε", "α恒小于ε", "α恒大于ε", "", ""], "r": "A", "e": "‌A. 仅在热平衡时α=ε‌： 正确。这是基尔霍夫定律的基本结论，适用于一般灰体。<br />‌B. 任何情况下α=ε‌： 错误。只有漫灰体才无条件满足α=ε，普通灰体不满足。<br />‌C. α恒小于ε‌： 错误。灰体的α与ε在数值上相等，不存在固定的大小关系。<br />‌D. α恒大于ε‌： 错误。理由同上，灰体α=ε，不存在大于关系。‌‌<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104660", "t": 1, "q": "两个黑体表面组成封闭系统，表面1的温度T1=1000K，表面2的温度T2=500K，表面1对表面2的角系数F12=0.3，则表面1向表面2的辐射换热量Q12（单位:W）与两表面面积A1、A2的关系是", "a": ["Q12=σ(A1+A2)F12(T1⁴-T2⁴)", "Q12=σA2F12(T1⁴-T2⁴)", "Q12=σA1F12(T1⁴-T2⁴)", "Q12=σA1F21(T1⁴-T2⁴)（F21为表面2对表面1的角系数）", "", ""], "r": "C", "e": "两黑体表面辐射换热量公式为「test/yiwen_img/importSubject/2034800203764207616.png」 。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104661", "t": 1, "q": "两个温度分别为T1和T2（T1>T2）的黑体表面，若它们的表面积均为A，且构成封闭系统（仅两表面），则它们之间的辐射换热量Φ12为（　）", "a": ["2σA(T1<sup>4-T2<\/sup>4)", "σA(T1<sup>4+T2<\/sup>4)", "σA(T1<sup>4-T2<\/sup>4)", "σA(T1-T2)^4", "", ""], "r": "C", "e": "本题考查黑体辐射换热量的计算。根据斯蒂芬-玻尔兹曼定律，黑体的辐射力与其温度的四次方成正比，即「test/yiwen_img/importSubject/2034800203239919616.png」，其中「test/yiwen_img/importSubject/2034800203281862656.png」为斯蒂芬-玻尔兹曼常数，T为黑体的绝对温度。对于两个黑体表面，它们之间的辐射换热量「test/yiwen_img/importSubject/2034800203814539264.png」可以由以下公式给出：「test/yiwen_img/importSubject/2034800203852288000.png」其中，A是黑体的表面积，「test/yiwen_img/importSubject/2034800203911008256.png」和「test/yiwen_img/importSubject/2034800203957145600.png」分别是两个黑体的温度，且「test/yiwen_img/importSubject/2034800203999088640.png」。这个公式表示，两个黑体之间的辐射换热量等于斯蒂芬-玻尔兹曼常数乘以表面积，再乘以两个黑体温度四次方的差值。现在我们来对比选项：A. 「test/yiwen_img/importSubject/2034800204082974720.png」：这个选项多了一个系数2，不符合公式。B. 「test/yiwen_img/importSubject/2034800204133306368.png」：这个选项是两个黑体辐射力的和，而不是它们之间的辐射换热量。C.「test/yiwen_img/importSubject/2034800204187832320.png」：这个选项与我们给出的公式完全一致，是正确答案。D.「test/yiwen_img/importSubject/2034800204246552576.png」：这个选项错误地将温度差值的四次方作为因子，不符合斯蒂芬-玻尔兹曼定律。综上所述，正确答案是C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104662", "t": 1, "q": "某黑体表面温度从300K升高至600K，根据斯蒂芬-玻尔兹曼定律，其单位面积辐射力E的变化倍数为（　）", "a": ["8倍", "2倍", "16倍", "4倍", "", ""], "r": "C", "e": "斯蒂芬 - 玻尔兹曼定律公式为「test/yiwen_img/importSubject/2034800203474800640.png」，「test/yiwen_img/importSubject/2034800203281862656.png」为常数。温度从300K升至600K，「test/yiwen_img/importSubject/2034800204301078528.png」，即单位面积辐射力变化倍数为16倍。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104663", "t": 1, "q": "某黑体在温度T=1000K时的单色辐射力最大值对应的波长λm，根据维恩位移定律，当温度升高至2000K时，λm的变化为（　）", "a": ["减小至原来的1/4", "增大至原来的2倍", "减小至原来的1/2", "增大至原来的4倍", "", ""], "r": "C", "e": "维恩位移定律λmT = b（b为常数），温度从1000K升高到2000K，温度变为原来2倍，那么λm会减小至原来的1/2。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104664", "t": 1, "q": "稳态复合平壁导热中，三层材料的热阻分别为R1=0.1 m²·K/W，R2=0.05 m²·K/W，R3=0.2 m²·K/W，总温差Δt=50K，则热流密度q为（　）", "a": ["125 W/m²", "200 W/m²", "100 W/m²", "167 W/m²", "", ""], "r": "C", "e": "稳态复合平壁导热热流密度「test/yiwen_img/importSubject/2034800204359798784.png」，将「test/yiwen_img/importSubject/2034800204414324736.png」、「test/yiwen_img/importSubject/2034800204464656384.png」、「test/yiwen_img/importSubject/2034800204540153856.png」、「test/yiwen_img/importSubject/2034800204598874112.png」代入可得「test/yiwen_img/importSubject/2034800204695343104.png」，无此选项，可能出题人计算有误，若按照公式计算思路「test/yiwen_img/importSubject/2034800204754063360.png」（这里假设出题人把「test/yiwen_img/importSubject/2034800204808589312.png」误写为0.2，实际按0.25算）。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104665", "t": 1, "q": "稳态平壁导热中，若平壁两侧对流换热系数h1>>h2，壁材导热系数λ较大，则平壁温度分布的特点是（　）", "a": ["壁面温度接近冷流体温度，内部温度梯度大", "壁面温度接近热流体温度，内部温度梯度小", "壁面温度接近热流体温度，内部温度梯度大", "壁面温度接近冷流体温度，内部温度梯度小", "", ""], "r": "B", "e": "因为h1>>h2，热阻主要在h2侧，热流体与壁面温差小，壁面温度接近热流体温度；又λ较大，导热热阻小，内部温度变化小，温度梯度小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104666", "t": 1, "q": "稳态圆筒壁导热中，若内半径r1、外半径r2，长度L，导热系数λ，内外壁温差Δt，当r2/r1=2时，热流密度q2（r=r2处）与q1（r=r1处）的比值为（　）", "a": ["4:1", "1:2", "1:4", "2:1", "", ""], "r": "B", "e": "根据稳态圆筒壁导热热流密度公式「test/yiwen_img/importSubject/2034800204858920960.png」，Q为热流量且稳态时Q不变。则「test/yiwen_img/importSubject/2034800204942807040.png」，已知「test/yiwen_img/importSubject/2034800204997332992.png」，所以「test/yiwen_img/importSubject/2034800205064441856.png」。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104667", "t": 1, "q": "下列关于对流换热边界层的说法，错误的是（　）", "a": ["普朗特数Pr=1时，速度边界层厚度δu等于温度边界层厚度δt", "边界层外，流体温度均匀，速度也均匀", "速度边界层厚度δu始终大于温度边界层厚度δt", "温度边界层内，热量传递仅依靠导热", "", ""], "r": "C", "e": "速度边界层厚度δu与温度边界层厚度δt的相对大小取决于普朗特数Pr:当Pr=1时二者近似相等；当Pr>1时δu>δt；当Pr<1时δu<δt。因此\"δu始终大于δt\"说法错误，选C<br />Pr=1时正确；B描述边界层外主流区均匀合理；D在温度边界层内贴近壁面处导热占主导，作为定性说法可接受。<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104669", "t": 1, "q": "下列关于非稳态导热\"集总参数法\"适用条件的说法，正确的是", "a": ["Bi数小于0.1（或0.01，工程近似）", "Pr数小于0.7", "Re数小于2300", "任何Bi数下均适用", "", ""], "r": "A", "e": "集总参数法适用条件是Bi数小于0.1（或0.01，工程近似），Pr、Re数与集总参数法适用条件无关，并非任何Bi数下都适用。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104670", "t": 1, "q": "下列关于非稳态导热的说法，错误的是（　）", "a": ["傅里叶数Fo越大，物体内部温度越均匀", "热扩散率a越大，物体温度变化越迅速", "非稳态导热的温度场是时间和空间的函数", "毕渥数Bi越小，物体表面与内部的温差越小", "", ""], "r": "A", "e": "这是一道关于非稳态导热概念理解的选择题。我们来逐一分析每个选项：A选项：傅里叶数Fo是描述非稳态导热过程时间特征的无量纲数。然而，Fo越大，并不意味着物体内部温度越均匀。相反，Fo越大，表示导热过程进行得越快，但并不意味着最终的温度分布会更均匀。实际上，在非稳态导热过程中，物体内部的温度分布是随时间和位置变化的，Fo的大小只是反映了这种变化的速率。B选项：热扩散率a反映了材料导热能力的强弱。a越大，确实意味着物体温度变化会越迅速，因为热量能够更快地通过材料传播。C选项：非稳态导热的温度场确实是时间和空间的函数。在非稳态导热过程中，温度不仅随位置变化，还随时间变化。D选项：毕渥数Bi是描述物体表面与内部温差特征的无量纲数。Bi越小，意味着物体表面与内部的温差越小，这反映了热量从表面传递到内部的难易程度。综上所述，A选项中的说法是错误的。傅里叶数Fo越大，并不表示物体内部温度越均匀。所以，正确答案是A选项：“傅里叶数Fo越大，物体内部温度越均匀”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104671", "t": 1, "q": "下列关于非稳态导热傅里叶数Fo的物理意义，正确的是（　）", "a": ["表示流体动量扩散能力与热量扩散能力的比值", "表示非稳态导热过程的时间进程，Fo越大，物体温度越接近环境温度", "表示物体表面辐射热阻与内部导热热阻的比值", "表示物体内部导热热阻与表面对流热阻的比值", "", ""], "r": "B", "e": "傅里叶数Fo表征非稳态导热过程进行的深度，Fo越大，时间越长，物体温度越接近环境温度。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104672", "t": 1, "q": "下列关于非稳态导热时间常数τc的说法，正确的是（　）", "a": ["τc=λV/(hA)，τc越大，物体导热能力越强", "τc=ρcV/(hA)，τc越大，物体温度响应越慢", "τc=hA/(ρcV)，τc越大，物体温度响应越快", "τc=ρcA/(hV)，τc与物体体积V成反比", "", ""], "r": "B", "e": "非稳态导热时间常数τc=ρcV/(hA) ，时间常数越大，物体温度随环境温度变化越迟缓。A选项公式和结论错误；C选项公式和结论错误；D选项公式错误且与V关系判断错。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693952", "t": 2, "q": "非稳态导热的集总参数法适用条件包括（　）", "a": ["物体内部温度均匀", "表面对流换热系数h很小", "物体的导热系数λ很大", "毕渥数Bi<0.1", "", ""], "r": "ABCD", "e": "集总参数法假设物体内部温度均匀(A);适用判据毕渥数Bi<0.1(D),Bi=hLc/λ，Bi小意味着h小(B)或λ大(C),内部导热热阻远小于表面对流热阻。", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693953", "t": 2, "q": "根据斯蒂芬-玻尔兹曼定律，下列关于黑体辐射力的说法正确的有", "a": ["黑体在相同温度下，不同波长的辐射力不同", "黑体辐射力随温度升高而急剧增大", "黑体辐射力的单位是W/m²", "黑体辐射力与表面热力学温度的四次方成正比", "", ""], "r": "ABCD", "e": "A正确，黑体单色辐射力随波长变化；B正确，辐射力和温度四次方成正比，温度升高射力急剧增大；C正确，辐射力单位W/m<sup>2<\/sup>;D正确，斯蒂芬-玻尔兹曼定律：Eb=σT<sup>4<<sub>/<\/sub>sup>。", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693954", "t": 2, "q": "管内强制对流换热中，当流体从层流过渡到湍流时（Re从2300增至10000），下列说法正确的有", "a": ["流体的流动阻力减小", "努塞尔数Nu增大", "雷诺数Re增大", "表面换热系数h增大", "", ""], "r": "BCD", "e": "从层流过渡到湍流，雷诺数Re必然增大，雷诺数增大时，努塞尔数Nu增大，由h=Nu*λ/d可知表面换热系数h也增大；而湍流时流体流动阻力比层流大。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693955", "t": 2, "q": "在稳态圆筒壁导热中，下列说法正确的有（　）", "a": ["温度沿半径方向呈线性变化", "温度梯度dT/dr沿半径方向减小", "导热热阻与半径的对数成正比", "热流量Φ沿半径方向保持不变", "", ""], "r": "BCD", "e": "A 错误，圆筒壁稳态导热温度沿半径是对数分布，不是线性；B 正确，dt/dr:绝对值随 r 增大减小；C 正确，圆筒壁导热热阻公式「test/yiwen_java/202609/Q9FGkU_image.png」 ，和半径对数相关；D 正确，稳态无内热源，热流量 Φ 恒定不变。<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693956", "t": 2, "q": "下列关于传热过程的说法，正确的有（　）", "a": ["传热过程的总热阻等于热流体对流热阻、管壁导热热阻和冷流体对流热阻之和（无污垢时）", "总传热系数K的单位是W/(m²·K)", "传热过程是指热量从热流体经过固体壁面传递到冷流体的过程", "提高K的关键是减小热阻最大的分热阻", "", ""], "r": "ABCD", "e": "ABCD选项均正确。A无污垢时总热阻就是热流体、管壁、冷流体热阻之和；B总传热系数K单位是W/(m²·K)；C传热过程定义就是热流体经固体壁面到冷流体；D提高K关键在于减小最大分热阻。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693957", "t": 2, "q": "下列关于传热系数K的说法，正确的有（　）", "a": ["K的单位是W/(m²·K)", "K的大小由各分热阻决定", "K与传热面积A无关", "K与冷热流体的温度差有关", "", ""], "r": "ABC", "e": "传热系数K单位是W/(m²·K) ，其大小由各分热阻决定，与传热面积无关，和冷热流体温度差无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693958", "t": 2, "q": "下列关于传热系数K的说法，正确的有（　）", "a": ["对于管壳式换热器，K值通常以管外表面积为基准计算", "K值越大，说明传热过程越强", "K值与传热面积A无关", "提高K值的方法是减小总热阻", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693959", "t": 2, "q": "下列关于导热系数λ的说法，正确的有", "a": ["气体的λ通常随温度升高而增大", "液体的λ通常随温度升高而减小（水除外）", "金属材料的λ通常随温度升高而减小", "非金属固体材料的λ通常随温度升高而增大", "", ""], "r": "ABCD", "e": "A 正确，气体导热依靠分子热运动，温度升高，分子运动加剧，导热系数增大；B 正确，大部分液体温度升高分子间距变大，λ 下降，水在 0~100℃随温度上升 λ 先升后降，属于特例；C 正确，纯金属靠自由电子导热，升温电子散射加剧，导热系数降低；D 正确，非金属固体依靠晶格振动导热，温度升高晶格振动增强，λ 增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693960", "t": 2, "q": "下列关于对流换热边界层的说法，正确的有（　）", "a": ["边界层外速度和温度均匀", "普朗特数Pr越大，速度边界层越厚", "边界层内存在明显的速度梯度和温度梯度", "普朗特数Pr越小，温度边界层越厚", "", ""], "r": "ACD", "e": "A. 边界层外速度和温度均匀 ：边界层理论的基本假设：边界层外主流区无黏性效应，速度达到主流速度U∞、温度达到主流温度T∞，分布均匀。<br />B. 普朗特数Pr越大，速度边界层越厚：δ/δ_t ∝ Pr^1/3，Pr大 → 温度边界层薄，速度边界层相对更厚于温度边界层，但绝对意义上：ν（运动黏度）决定速度边界层，Pr=ν/α，Pr大说明ν大→速度边界层确实更厚？<br />更准确：固定ν时，Pr↑仅因α↓，速度边界层δ本身由ν决定，不随Pr单独变化；通常表述“Pr越大，速度边界层比温度边界层厚得越多”，而非“速度边界层绝对变厚”。本题按常考标准表述：B错（混淆概念）。<br />C. 边界层内存在明显的速度梯度和温度梯度：正是边界层定义的核心：紧贴壁面，速度从0→U∞，温度从壁温→T∞，梯度集中于此。<br />D. 普朗特数Pr越小，温度边界层越厚：​Pr=ν/α，Pr小→α大（热扩散强），热量更快向流体内部扩散，温度边界层δ_t增厚；δ_t/δ≈Pr^(-1/3)，Pr↓→δ_t↑，正确。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693961", "t": 2, "q": "下列关于对流换热的说法，错误的有（　）", "a": ["层流对流换热的h大于湍流对流换热的h", "对流换热仅发生在流体内部", "自然对流换热的h大于强制对流换热的h", "对流换热系数h是物性参数", "", ""], "r": "ABCD", "e": "湍流时流体扰动剧烈，换热强，h大，A错；对流换热发生在流体与固体壁面间，B错；强制对流因外力作用，流体流动快，h大，C错；h与多种因素有关，不是物性参数，D错。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693962", "t": 2, "q": "下列关于对流换热系数h的说法，错误的有（　）", "a": ["h随流体流速的增大而增大", "h的单位是W/(m<sup>2<\/sup>·K)", "h是流体的物性参数", "h随壁面粗糙度的增大而增大（所有流动状态）", "", ""], "r": "CD", "e": "流速增大，扰动增强，h 增大；h 单位为 W/(m²・K)；h 不是单纯物性参数，和流动、几何均相关；层流状态下壁面粗糙度基本不影响 h，D 表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693963", "t": 2, "q": "下列关于非稳态导热的说法，正确的有（　）", "a": ["非稳态导热的热流量随时间变化", "非稳态导热的热流密度随时间变化", "非周期性非稳态导热的温度逐渐趋近于稳态", "周期性非稳态导热的温度变化具有重复性", "", ""], "r": "ABCD", "e": "非稳态导热中热流量和热流密度都随时间改变；周期性非稳态导热温度变化有重复性，非周期性非稳态导热温度会逐渐趋于稳定。ABCD选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693964", "t": 2, "q": "下列关于非稳态导热的说法，正确的有（　）", "a": ["非稳态导热可以分为周期性非稳态和非周期性非稳态", "非稳态导热的热流密度q随时间变化", "非稳态导热的热流量Φ随时间变化", "非稳态导热中，物体的内能随时间变化", "", ""], "r": "ABCD", "e": "非稳态导热分为周期性和非周期性两类；其热流密度、热流量都随时间变化，因热量变化，物体内能也随时间变。答案全选。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693965", "t": 2, "q": "下列关于非稳态导热傅里叶定律的说法，正确的有（　）", "a": ["非稳态导热中，温度梯度dT/dx随时间变化", "非稳态导热中，傅里叶定律仍然成立，即q=-λ(dT/dx)", "非稳态导热中，热流密度q不仅与温度梯度有关，还与时间有关", "非稳态导热中，热流密度q的方向始终与温度梯度的方向相反", "", ""], "r": "ABCD", "e": "非稳态导热温度场随时间改变，温度梯度随时间变化；傅里叶定律瞬时形式依旧适用；热流密度由瞬时温度梯度决定，梯度随时间变化故 q 和时间相关；负号代表热流方向与温度梯度方向相反。", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693966", "t": 2, "q": "下列关于非稳态导热温度场的说法，正确的有（　）", "a": ["毕渥数Bi越大，物体表面与内部温差越大", "加热过程中，物体表面温度变化快于内部", "傅里叶数Fo越大，物体内部温度越均匀", "热扩散率a越大，物体温度变化越迅速", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693967", "t": 2, "q": "下列关于沸腾换热的说法正确的有", "a": ["沸腾换热是液体在固体表面发生相变的对流换热", "过冷沸腾时，液体温度低于饱和温度", "核态沸腾的表面换热系数大于膜态沸腾", "临界热流密度是沸腾换热中表面换热系数最大的点", "", ""], "r": "ABC", "e": "沸腾换热是液体在固体表面发生相变的对流换热；过冷沸腾液体主体温度低于饱和温度；核态沸腾气泡扰动强，表面换热系数大于膜态沸腾；临界热流密度是核态沸腾到膜态沸腾转变点，不是表面换热系数最大点。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693968", "t": 2, "q": "下列关于辐射换热的说法，正确的有（　）", "a": ["辐射换热不受对流运动的影响", "辐射换热不需要介质", "黑体之间的辐射换热仅与温度有关", "辐射换热的热流密度与温度的四次方成正比", "", ""], "r": "ABD", "e": "辐射可以在真空中传递，不需要介质；黑体辐射满足斯蒂芬 - 玻尔兹曼定律，热流密度和热力学温度四次方成正比；对流和辐射是两种独立传热方式，辐射换热本身不受对流运动影响；黑体辐射换热还和表面积、角系数有关，不是仅与温度有关，C 错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693972", "t": 2, "q": "下列关于管内对流换热入口段的说法，正确的有（　）", "a": ["入口段的长度与雷诺数Re有关，Re越大，入口段越长", "入口段的流动边界层厚度沿管长逐渐增大", "入口段的努塞尔数Nu沿管长逐渐减小", "入口段的温度边界层厚度沿管长逐渐增大", "", ""], "r": "ABCD", "e": "Re 越大入口段越长；流动与温度边界层沿管长不断增厚；边界层变厚，换热减弱，Nu 沿流向逐步下降，直至充分发展段 Nu 稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693973", "t": 2, "q": "下列关于管内强制对流换热的说法，正确的有（　）", "a": ["湍流时的对流换热系数h大于层流时的h（相同流体、相同温度差）", "管长L与内径d的比值L/d越小，入口效应越明显，h越大", "流体的流速越大，雷诺数Re越大，h越大", "管壁的粗糙度增大，湍流时h增大，层流时h基本不变", "", ""], "r": "ABCD", "e": "湍流时流体扰动大，换热强，h大于层流；L/d小入口效应明显，边界层发展不充分，h大；流速大Re大，流体扰动增强，h增大；管壁粗糙度对湍流影响大使h增大，对层流影响小h基本不变。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693974", "t": 2, "q": "下列关于管内强制对流换热的说法，正确的有（　）", "a": ["入口段的换热系数h大于充分发展段的换热系数h", "湍流状态下的换热系数h大于层流状态下的换热系数h", "流体密度越大，换热系数h越大", "管道粗糙度增大时，湍流状态下的换热系数h会增大", "", ""], "r": "ABD", "e": "这道题考察的是管内强制对流换热的知识点。以下是对各选项的简要A. 入口段的换热系数h大于充分发展段的换热系数h。 正确。在管内强制对流中，入口段由于流体速度和温度分布的不均匀性，会导致更高的换热系数。B. 湍流状态下的换热系数h大于层流状态下的换热系数h。 正确。湍流状态下，流体微团之间的剧烈混合和扰动使得热量传递更有效，因此换热系数更大。C. 流体密度越大，换热系数h越大。 错误。换热系数主要受流体速度、温度差、流体物性（如热导率、粘度）以及流动状态等因素影响，与流体密度的直接关系不明显。D. 管道粗糙度增大时，湍流状态下的换热系数h会增大。 正确。管道粗糙度的增加会破坏边界层的稳定性，增强流体的扰动，从而提高湍流状态下的换热系数。综上所述，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693975", "t": 2, "q": "下列关于管外横掠管束对流换热的说法，正确的有（　）", "a": ["流体导热系数越大，h越大", "管壁温度越高，h越大", "管束排数越多，h越大", "流体流速越大，h越大", "", ""], "r": "AD", "e": "这道题考察的是管外横掠管束对流换热的知识点。对于这类问题，我们可以从以下几个关键因素来理解：1. 流体导热系数：导热系数反映了物质传递热量的能力。导热系数越大，流体传递热量的能力越强，因此对流换热系数h也会增大。所以A选项正确。2. 管壁温度：管壁温度的高低主要影响的是热流密度，而对流换热系数h主要受流体流动状态和物性影响，与管壁温度无直接关系。所以B选项错误。3. 管束排数：管束排数的增加可能会导致流体流动的复杂性增加，但这并不意味着对流换热系数h会增大。实际上，过多的排数可能导致流体流动受阻，反而降低换热效率。所以C选项错误。4. 流体流速：流体流速越大，流体与管壁之间的热量交换越频繁，对流换热系数h也越大。所以D选项正确。综上所述，正确的选项是A和D。所以，正确答案是AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693976", "t": 2, "q": "下列关于管外强制对流换热的说法，正确的有（　）", "a": ["流体的导热系数λ越大，h越大", "流体横掠圆管时的对流换热系数h大于流体顺流时的h（相同Re）", "管束的排数越多，h越大，且前排h大于后排h", "流体的密度ρ越大，h越大（相同流速）", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693977", "t": 2, "q": "下列关于黑体辐射的说法，错误的有（　）", "a": ["黑体的辐射能集中在某一特定波长", "黑体的透射率为1", "黑体的反射率为1", "黑体的辐射力仅与温度有关", "", ""], "r": "ABC", "e": "黑体辐射是连续光谱，能量分布在不同波长，A错误；黑体不透过、不反射辐射能，透射率和反射率都为0，B、C错误；黑体辐射力仅与温度有关，D正确。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693978", "t": 2, "q": "下列关于黑体辐射光谱的说法，正确的有（　）", "a": ["随着温度升高，黑体辐射中短波部分的能量比例增大", "黑体辐射光谱是连续光谱，包含所有波长的辐射能", "在相同温度下，黑体的单色辐射力在所有波长下都不同", "黑体辐射的总辐射力等于各波长单色辐射力的积分", "", ""], "r": "ABD", "e": "温度升高，黑体辐射中短波部分能量比例增大；黑体辐射光谱是连续的且包含所有波长辐射能；相同温度下，黑体单色辐射力在某些波长可能相同；总辐射力是各波长单色辐射力积分。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693979", "t": 2, "q": "下列关于黑体辐射特性的说法，正确的有（　）", "a": ["黑体的单色辐射力最大值对应的波长随温度升高而减小", "黑体的辐射光谱是连续光谱", "黑体的反射率和透射率均为0", "黑体的辐射力与温度的四次方成正比", "", ""], "r": "ABCD", "e": "本题可根据黑体辐射的相关特性逐一分析选项。 选项A：根据维恩位移定律，黑体的单色辐射力最大值对应的波长与温度成反比，即随温度升高而减小，该选项正确。 选项B：黑体的辐射光谱是连续光谱，在整个波长范围内都有辐射，该选项正确。 选项C：黑体是指能吸收投入到其表面上的所有热辐射能的物体，所以其反射率和透射率均为0，该选项正确。 选项D：根据斯蒂芬 - 玻尔兹曼定律，黑体的辐射力与热力学温度的四次方成正比，该选项正确。综上，ABCD四个选项的说法均正确，答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693980", "t": 2, "q": "下列关于黑体辐射特性的说法，正确的有（　）", "a": ["黑体的反射率和透射率均为0", "黑体的单色辐射力随波长的变化遵循维恩位移定律", "黑体的辐射力随温度的四次方变化", "黑体的吸收率与波长无关，且等于1", "", ""], "r": "ACD", "e": "黑体是能完全吸收外来辐射而无反射和透射的物体，所以反射率和透射率为0，吸收率为1且与波长无关；其单色辐射力随波长变化遵循普朗克定律，辐射力与温度四次方成正比。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693981", "t": 2, "q": "下列关于黑体和灰体的说法，正确的有", "a": ["黑体是吸收率α=1的理想物体，实际中不存在", "黑体的辐射力仅与表面温度有关", "灰体的辐射光谱与黑体的辐射光谱形状相似但强度不同", "灰体是吸收率α与波长无关的物体", "", ""], "r": "ABCD", "e": "A 黑体 α=1，是理想模型，自然界无真正黑体；B 黑体辐射力由斯蒂芬玻尔兹曼定律，只取决于热力学温度；C 灰体光谱和黑体形状一致，发射率小于 1；D 灰体吸收率不随波长改变。", "ap": [false, false, false, false, false, false]}, {"id": "2034800209149693983", "t": 2, "q": "下列关于灰体的说法，正确的有（　）", "a": ["灰体的发射率与波长无关", "灰体的辐射力小于相同温度下的黑体", "热平衡时灰体的吸收率等于发射率", "灰体的吸收率与波长无关", "", ""], "r": "ABCD", "e": "A. 灰体的发射率与波长无关（正确）灰体的定义就是其发射率（黑度）不随波长变化，是一个常数（但通常小于1）。<br />B. 灰体的辐射力小于相同温度下的黑体（正确）黑体的发射率为1，是最大辐射力。灰体的发射率小于1，根据斯特藩-玻尔兹曼定律 E=εσT<sup>4<\/sup> ，在相同温度下，灰体的辐射力小于黑体。<br />C. 热平衡时灰体的吸收率等于发射率（正确）这是基尔霍夫定律的结论。在热平衡条件下，任何物体的吸收率等于其发射率。<br />D. 灰体的吸收率与波长无关（正确）由于灰体的发射率与波长无关，根据基尔霍夫定律（吸收率等于发射率），其吸收率也与波长无关。<br />因此，四个选项均正确。最终答案：ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683328", "t": 3, "q": "传热过程的总热阻等于热流体对流热阻、管壁导热热阻、冷流体对流热阻和污垢热阻之和（存在污垢时），各热阻呈串联关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在传热过程中，热流体与管壁、管壁与冷流体之间的传热以及污垢对传热的阻碍，可类比电路中电阻串联，总热阻就是各部分热阻相加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683329", "t": 3, "q": "传热过程中，总热阻等于各串联热阻之和，因此减小任何一个串联热阻，总热阻都会减小，总传热量都会增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据串联热阻叠加原理，总热阻是各串联热阻相加，减小其中任一热阻，总热阻必然降低，由传热公式可知，传热量与总热阻成反比，总热阻减小则总传热量增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683330", "t": 3, "q": "导热过程中，物体内的热流密度方向总是与温度梯度方向相反，即从高温区指向低温区。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据傅里叶定律，热流密度与温度梯度成正比，且方向相反，热流是从高温区流向低温区。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683331", "t": 3, "q": "对流换热的努塞尔数Nu=hL/λ，其物理意义是表面对流换热热阻与内部导热热阻的比值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "努塞尔数 Nu=hL/λ，物理意义是壁面处对流换热强度与固体内部导热强度之比，代表固体表面的无量纲温度梯度；毕渥数 Bi 才是表面对流换热热阻与固体内部导热热阻的比值。题干混淆了 Nu 和 Bi 的物理含义，表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683332", "t": 3, "q": "对流换热的努塞尔数Nu=hL/λ，其中L为特征长度，λ为流体的导热系数，Nu越大，说明对流换热越强。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "努塞尔数反映了对流换热的强弱程度，其表达式中，h为对流换热系数，L为特征长度，λ为流体导热系数。Nu越大意味着h相对越大，即对流换热越强。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683333", "t": 3, "q": "对流换热的普朗特数Pr=ν/a，其中ν为运动粘度，a为热扩散率。当Pr=1时，速度边界层厚度等于温度边界层厚度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "普朗特数定义是Pr = ν/a ，ν是运动粘度，a是热扩散率。且理论上Pr = 1时，速度边界层厚度和温度边界层厚度相等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683334", "t": 3, "q": "多层平壁稳态导热中，各层的温度降与该层的热阻成正比，热阻越大，温度降越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据多层平壁稳态导热的特点，热流量处处相等，由热流量公式「test/yiwen_img/importSubject/2034800205123162112.png」（Q为热流量，「test/yiwen_img/importSubject/2034800205165105152.png」为温度降，R为热阻）可知，热流量一定时，温度降与热阻成正比。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683335", "t": 3, "q": "非稳态导热的\"薄材\"是指毕渥数Bi>1的物体，其内部导热热阻远大于表面对流热阻，内部温度分布均匀。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。“薄材”指Bi＜0.1的物体，此时内部导热热阻远小于表面对流热阻，才近似认为内部温度分布均匀；而Bi>1时，内部导热热阻远大于表面对流热阻，内部温度分布不均匀。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683336", "t": 3, "q": "非稳态导热的\"厚材\"是指毕渥数Bi<0.1的物体，其表面对流热阻远大于内部导热热阻，表面温度迅速接近环境温度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "Bi<0.1为薄材（集总参数法），内部温度均匀；厚材 Bi 很大，内部导热热阻占主导，物体内部存在明显温度梯度。题干概念混淆。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683337", "t": 3, "q": "非稳态导热的傅里叶数Fo=aτ/L²，其中a为热扩散率，L为特征尺寸，Fo越大，说明在相同时间内热量在物体内扩散的距离越远。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "傅里叶数Fo反映了非稳态导热过程进行的深度，Fo越大，意味着相同时间内热量在物体内扩散越充分，扩散距离越远。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683338", "t": 3, "q": "非稳态导热的傅里叶数Fo越大，说明物体内部的温度变化越缓慢，达到稳态所需的时间越长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "傅里叶数Fo越大，表明热扩散越快，物体内部温度变化越快，达到稳态所需时间越短，所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683339", "t": 3, "q": "非稳态导热的集总参数法适用于毕渥数Bi>0.1的物体，此时物体内部的温度梯度可以忽略。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "集总参数法适用于毕渥数Bi＜0.1的物体，当Bi＜0.1时物体内部温度梯度可忽略，题干中Bi＞0.1说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683340", "t": 3, "q": "非稳态导热的集总参数法适用于任何形状的物体，只要Bi数满足小Bi数条件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "集总参数法的适用条件就是物体满足小Bi数条件，此时可认为物体内温度均匀，与形状无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683341", "t": 3, "q": "非稳态导热的集总参数法中，物体的温度随时间呈线性变化，因为温度变化率是常数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "集总参数法中，物体温度随时间呈指数变化，并非线性变化，温度变化率也不是常数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683342", "t": 3, "q": "非稳态导热的集总参数法中，物体的温度随时间的变化遵循指数规律，即θ=θ0exp(-τ/τc)。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在非稳态导热的集总参数法里，物体内部温度均匀，其温度随时间变化确实遵循指数规律θ = θ₀exp(-τ/τc) 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683343", "t": 3, "q": "非稳态导热的时间常数τc=ρcV/(hA)，τc越大，物体对环境温度变化的响应越慢，达到新稳态所需时间越长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "时间常数τc反映物体对环境温度变化响应快慢，τc越大，物体热惯性越大，对环境温度变化响应越慢，达到新稳态所需时间就越长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683344", "t": 3, "q": "非稳态导热的时间常数τc=ρcV/(hA)，τc越小，物体对环境温度变化的响应越慢。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "时间常数τc越小，意味着物体温度随环境温度变化达到热平衡所需时间越短，即物体对环境温度变化响应越快，而不是越慢。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683345", "t": 3, "q": "非稳态导热的温度场求解中，傅里叶导热定律和能量守恒定律是两个基本方程，所有非稳态导热问题都需基于这两个方程求解。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683346", "t": 3, "q": "非稳态导热过程中，傅里叶数 Fo 越大，说明在相同特征尺寸和相同热扩散率下，热量在物体内传播的时间越长，温度分布越趋于均匀。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "傅里叶数 Fo=aτ/L²，a 为热扩散率，τ 为时间，L 为特征尺寸。在相同特征尺寸、相同热扩散率条件下，Fo 越大，则时间 τ 越大，热量有充足时间在物体内部扩散，物体内部温度梯度变小，温度分布趋于均匀。题干表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683347", "t": 3, "q": "非稳态导热过程中，物体内部的温度梯度始终随时间的增加而减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "非稳态导热过程中，物体内部温度梯度变化与具体导热情况有关，比如加热时温度梯度可能增大，并非始终随时间增加而减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683348", "t": 3, "q": "非稳态导热中，傅里叶数Fo和毕渥数Bi是两个重要的无量纲数，其中Fo决定温度变化的时间进程，Bi决定温度场的分布形态。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "Fo（傅里叶数）表征非稳态导热时间进程；Bi（毕渥数）反映固体内部导热热阻与表面对流热阻之比，决定物体内部温度分布形态。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683349", "t": 3, "q": "非稳态导热中，热扩散率a越小，物体的导热能力越弱，储热能力越强，达到稳态所需时间越长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热扩散率a=λ/（ρc） ，λ是导热系数，反映物体导热能力，ρc体现物体储热能力。a越小，λ相对小，导热能力弱；ρc相对大，储热能力强。非稳态导热达到稳态需热量充分传递，导热弱、储热强时热量传递慢，达到稳态时间长。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683350", "t": 3, "q": "非稳态导热中，若物体的初始温度均匀，则在加热过程中，物体内部的温度梯度始终随时间的增加而增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "非稳态导热加热时，物体内部温度梯度随时间变化并非始终增大，会先增大后减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683351", "t": 3, "q": "非稳态导热中，物体的热扩散率a越大，说明物体的导热能力越强，储热能力越弱，内部温度变化越迅速。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热扩散率a=λ/(pc),a越大，热量扩散越快，储热能力弱，物体内部温度变化越快。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683352", "t": 3, "q": "非稳态导热中，物体的热扩散率a越大，说明物体在加热或冷却过程中温度变化越缓慢。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热扩散率a越大，热量在物体内传播越快，温度变化越迅速，而非越缓慢。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683353", "t": 3, "q": "辐射换热的角系数是纯几何参数，仅与参与换热的物体表面形状、尺寸和相对位置有关，与物体的温度和表面辐射特性无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "角系数只取决于物体的几何形状、大小和相对位置，和物体温度及表面辐射特性无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683354", "t": 3, "q": "辐射换热的角系数F12表示表面1发出的辐射能中投射到表面2的比例，其值范围为0≤F12≤1。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "角系数F12定义就是表面1发出的辐射能中投射到表面2的比例，且这个比例最大为1（全部投射到表面2），最小为0（无投射到表面2），所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683355", "t": 3, "q": "辐射换热中，两个表面的角系数F12=1表示表面1发出的所有辐射能都被表面2吸收。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。角系数F12 = 1表示表面1发出的所有辐射能都投射到表面2上，但并非都被表面2吸收，还可能被表面2反射。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683356", "t": 3, "q": "管内强制对流换热的入口段，由于流体边界层未充分发展，对流换热系数h比充分发展段的h小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在管内强制对流入口段，边界层从零开始逐渐增厚，流速梯度大、热阻小，且常伴随边界层从层流到湍流的过渡，扰动更强，因此局部对流换热系数h比充分发展段更高；进入充分发展段后，边界层厚度不再变化、热阻稳定，h趋于恒定且低于入口段峰值。题干说“入口段h比充分发展段小”正好说反了。  。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683357", "t": 3, "q": "管内强制对流换热的入口段，由于流体的速度边界层和温度边界层尚未充分发展，对流换热系数h比充分发展段小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在管内强制对流入口段，边界层从零开始逐渐增厚，流速梯度大、热阻小，且常伴随边界层从层流到湍流的过渡，扰动更强，因此局部对流换热系数h比充分发展段更高；进入充分发展段后，边界层厚度不再变化、热阻稳定，h趋于恒定且低于入口段峰值。题干说“入口段h比充分发展段小”正好说反了。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683358", "t": 3, "q": "管内强制对流换热中，当流体处于层流充分发展段时，努塞尔数Nu为定值，与流体的物性和流动状态无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "管内层流充分发展段Nu虽为定值（常物性下均匀壁温时3.66，均匀热流时4.36），但该定值取决于边界条件及流体Pr数等物性；且层流与湍流的Nu差异巨大，故“与物性和流动状态无关”的表述错误，选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683359", "t": 3, "q": "管内强制对流换热中，当流体处于湍流状态时，努塞尔数Nu仅与雷诺数Re有关，与普朗特数Pr无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "管内强制对流换热湍流时，努塞尔数Nu与雷诺数Re和普朗特数Pr都有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683360", "t": 3, "q": "在管内强制对流换热过程中，若流体处于湍流状态且Pr数较大时，则热边界层的厚度小于速度边界层的厚度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在管内强制对流换热中，对于湍流且Pr数较大情况，Pr=ν/α（ν为运动黏度，α为热扩散率），Pr大意味着热扩散慢，热边界层发展慢，所以热边界层厚度小于速度边界层厚度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683361", "t": 3, "q": "管内强制对流换热中，流体的流速越大，雷诺数Re越大，对流换热系数h越大，因此流速越大越好，无需考虑流动阻力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然流速增大，雷诺数Re增大，对流换热系数h也增大，但在实际情况中，流速增大时流动阻力也会大幅增加，这将消耗更多的能量来维持流体流动，还可能对管道等设备造成更大的压力和磨损等。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683362", "t": 3, "q": "管内强制对流换热中，流体的流速越大，雷诺数Re越小，对流换热系数h越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在管内强制对流换热里，雷诺数Re与流速成正比，流速越大，Re越大；对流换热系数h也随流速增大而增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683363", "t": 3, "q": "管外横掠管束对流换热中，错排管束的对流换热系数h比顺排管束的h小，因为错排管束的流体流动阻力更小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。错排管束的对流换热系数h比顺排管束的h大，因为错排时流体在管间交替收缩和扩张，扰动更剧烈，增强了换热；而顺排流动阻力小，错排流动阻力大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683364", "t": 3, "q": "管外横掠管束对流换热中，管束的排数越多，对流换热系数h越小，因为后排流体受前排阻碍，流动越缓慢。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。在管外横掠管束对流换热中，管束排数越多，后排流体受到前排流体的扰动影响，边界层破坏更充分，对流换热增强，对流换热系数h越大，而非越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683365", "t": 3, "q": "黑体的单色辐射力最大值对应的波长λm随温度升高而减小，这一规律称为维恩位移定律，表达式为λmT=b（b为常数）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "维恩位移定律的确表明黑体的单色辐射力最大值对应的波长λm随温度升高而减小，且表达式为λmT = b （b为常数）。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683366", "t": 3, "q": "黑体的反射率ρ=0，透射率τ=0，吸收率α=1，因此黑体能够吸收所有投射到其表面的辐射能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据黑体定义，其反射率和透射率为 0，吸收率为 1，意味着它不反射、不透射，能把投射到表面的辐射能全部吸收。", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683367", "t": 3, "q": "黑体的反射率ρ=0，因此黑体不会反射任何辐射能，也不会发出任何辐射能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "黑体反射率ρ = 0，确实不反射辐射能，但黑体是能发出辐射能的，且在相同温度下，黑体的辐射能力是最强的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683368", "t": 3, "q": "黑体的辐射光谱是连续的，包含从紫外线到红外线的所有波长，且在相同温度下，黑体的单色辐射力在所有波长下都相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "黑体辐射光谱连续且涵盖紫外线到红外线波长，但在相同温度下，黑体单色辐射力随波长变化，并非在所有波长下都相同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683369", "t": 3, "q": "黑体的辐射力仅与表面的热力学温度有关，温度升高1倍，辐射力增大16倍（因T⁴关系）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据黑体辐射力公式「test/yiwen_img/importSubject/2034800203239919616.png」（「test/yiwen_img/importSubject/2034800203281862656.png」为常数），当温度升高1倍，即变为2T，此时辐射力「test/yiwen_img/importSubject/2034800205202853888.png」，是原来辐射力的16倍，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683370", "t": 3, "q": "黑体的辐射力E=σT^4，其中σ为斯蒂芬-玻尔兹曼常数，该公式适用于所有温度下的黑体辐射。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "斯蒂芬 - 玻尔兹曼定律即黑体辐射力公式「test/yiwen_img/importSubject/2034800203474800640.png」，适用于所有温度下的黑体辐射。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683371", "t": 3, "q": "黑体的辐射力E随温度的四次方变化，即E=σT^4，该规律称为斯蒂芬-玻尔兹曼定律，适用于所有物体。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。斯蒂芬 - 玻尔兹曼定律E = σT^4 仅适用于黑体，并非适用于所有物体，对于实际物体需引入发射率进行修正。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683372", "t": 3, "q": "黑体的吸收率α=1，发射率ε=1，因此黑体能够吸收所有投射到其表面的辐射能，也能发射所有波长的辐射能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "黑体定义就是吸收率为 1 的物体，能吸收所有投射到其表面的辐射能；根据基尔霍夫定律，发射率等于吸收率，所以黑体发射率也为 1，能发射所有波长辐射能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683373", "t": 3, "q": "黑体在某一温度下的单色辐射力最大值对应的波长λm随温度升高而增大，该规律称为维恩位移定律。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "维恩位移定律指出，黑体在某一温度下的单色辐射力最大值对应的波长λm随温度升高而减小，并非增大。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800211955683374", "t": 3, "q": "灰体的发射率ε与吸收率α在热平衡时相等，因此灰体的辐射力E=ασT^4。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热平衡时灰体发射率ε与吸收率α相等，灰体辐射力公式是E = εσT⁴，又因ε = α，所以E = ασT⁴。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 传热学（2）", "n": "基础练习题【含解析】 / 第2章 传热学（2）", "qs": [{"id": "2034800219828391936", "t": 1, "q": "下列关于辐射角系数的说法，错误的是（　）", "a": ["对于封闭系统中的两表面，F12A1=F21A2", "若表面1完全被表面2包围，则F12=1", "若表面1为平面，其自角系数F11=0", "角系数F12的值仅与两表面的几何位置有关", "", ""], "r": "D", "e": "A是角系数相对性，正确；B若表面1完全被表面2包围，表面1辐射能量全到表面2，F12 = 1，正确；C平面无自身辐射，自角系数为0，正确；角系数不仅与两表面几何位置有关，还与表面形状等有关，D错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391937", "t": 1, "q": "下列关于黑体辐射的说法，正确的是（　）", "a": ["黑体在温度T时的单色辐射力最大值对应的波长λm随T升高而增大", "黑体的辐射能不仅限于可见光波段，而是覆盖了从紫外线到红外线的广泛范围", "黑体的辐射力E与温度T的四次方成正比", "黑体在某一波长λ下的单色辐射力Ebλ随T升高而增大", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391938", "t": 1, "q": "下列关于热辐射的说法中，正确的是（　）", "a": ["黑体的反射率ρ=0、透射率τ=0，吸收率α=1", "物体的辐射力E仅与物体温度有关，与物体种类无关", "灰体的吸收率α与发射率ε在任何温度下都相等", "热辐射只能在空气中传播，不能在真空中传播", "", ""], "r": "A", "e": "黑体不反射、不透射，吸收率为 1，A 正确；物体辐射力与物体种类和温度都有关，B 错；灰体吸收率和发射率在同温度下相等，C 表述不准确；热辐射可在真空中传播，D 错。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391939", "t": 1, "q": "下列关于热阻的说法，错误的是（　）", "a": ["平壁的导热热阻与厚度成正比，与导热系数成反比", "热阻越大，保温性能越好，但需根据实际需求权衡", "辐射换热热阻与表面的发射率成反比，与换热面积成反比", "复合壁的总热阻等于各层热阻之和（串联时）", "", ""], "r": "C", "e": "简单解析：<br />A正确：导热热阻R=δ/（λA),正比厚度反比导热系数。<br />B正确：热阻大即传热系数小，保温好，但过大可能不经济或空间不足，需权衡。<br />C错误：表面辐射热阻R=(1-ε)（εA),与发射率和面积均成反比，但总辐射热阻还与角系数、空间布置等有关，不能简单说“与发射率成反比，与面积成反比”即概括全部。<br />D正确：串联热阻相加。选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391940", "t": 1, "q": "下列关于三种基本热量传递方式特征的说法，错误的是", "a": ["对流换热必然伴随流体的宏观运动", "热辐射可以在真空中进行，且不需要中间介质", "自然对流换热的驱动力是流体的浮升力", "导热仅发生在固体、静止流体内部或接触的物体之间", "", ""], "r": "C", "e": "这道题目考察的是对三种基本热量传递方式特征的理解。我们可以逐一分析每个选项的正确性，以确定哪个说法是错误的。A选项：对流换热必然伴随流体的宏观运动。这是正确的，因为对流换热是指流体内部由于温度差异引起的宏观运动，这种运动导致了热量的传递。B选项：热辐射可以在真空中进行，且不需要中间介质。这也是正确的，热辐射是热量以电磁波的形式传播，它不需要通过介质就能够传递热量，因此可以在真空中进行。C选项：自然对流换热的驱动力是流体的浮升力。这是错误的，自然对流换热的驱动力主要是温度差异引起的流体密度差，这种密度差导致了流体的宏观运动，而不仅仅是浮升力。D选项：导热仅发生在固体、静止流体内部或接触的物体之间。这是正确的，导热是指热量通过物体内部的微观粒子相互作用而传递，它主要发生在固体中，也可以在静止的流体内部或接触的物体之间发生。综上所述，错误的说法是C选项：自然对流换热的驱动力是流体的浮升力。所以，正确答案是C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391941", "t": 1, "q": "下列哪种情况属于非稳态导热中的\"大容器饱和沸腾\"（　）", "a": ["电水壶中冷水从20℃加热至100℃（未沸腾）的过程", "冬天湖面水从表层开始结冰的过程", "高压锅内壁蒸汽在壁面凝结成水的过程", "锅炉水冷壁管内水在一定压力下被加热至沸腾，且气泡在壁面生成并脱离的过程", "", ""], "r": "D", "e": "大容器饱和沸腾指液体处于饱和状态，在壁面上产生气泡并脱离。A未沸腾，B是结冰，C是蒸汽凝结，均不符合。D中锅炉水冷壁管内水在一定压力下加热至沸腾且气泡在壁面生成并脱离，属于大容器饱和沸腾。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391942", "t": 1, "q": "下列因素中，不会影响管外横向强制对流换热努塞尔数Nu的是", "a": ["流体的导热系数", "管子的排列方式（顺排或叉排）", "流体的流速", "管子的长度（假设长度远大于管径）", "", ""], "r": "D", "e": "努塞尔数Nu与流体物性（如导热系数）、流动状态（受流速影响）、管子排列方式有关。而在管外横向强制对流换热中，当管长远大于管径时，管长对Nu无影响。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391943", "t": 1, "q": "影响自然对流换热系数h的因素中，下列哪组全部为关键影响因素（　）", "a": ["流体的导热系数λ、粘度μ、特征长度L、温差Δt", "壁面的发射率ε、流体的体积膨胀系数β、重力加速度g", "流体的密度ρ、比热容c、壁面温度tw", "流体的运动粘度ν、普朗特数Pr、环境压力p", "", ""], "r": "A", "e": "自然对流换热系数h主要与流体物性、特征长度和温差有关。A选项包含流体导热系数λ、粘度μ、特征长度L、温差Δt，均为关键影响因素。B中壁面发射率ε与对流换热关系不大；C中壁面温度tw不是最关键因素；D中环境压力p对自然对流换热影响小。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391944", "t": 1, "q": "在传热过程中，若采用肋片强化传热，肋片应加在（　）", "a": ["温度较高的一侧", "热阻较小的一侧", "温度较低的一侧", "热阻较大的一侧", "", ""], "r": "D", "e": "肋片的作用是增大换热面积，从而减小对流换热热阻。因此，肋片应加在热阻较大、换热系数较小的一侧，这样对降低总热阻、增强传热效果最明显。<br />例如：气—液换热器中，气体侧对流换热系数小、热阻大，通常应在气体侧加肋片。<br />若加在热阻较小的一侧，对总传热系数提高有限。", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391945", "t": 1, "q": "在传热过程中，若换热器的传热系数K增大，其他条件不变，则所需传热面积A的变化为（　）", "a": ["无法确定，与传热量有关", "减小", "不变", "增大", "", ""], "r": "B", "e": "根据传热基本方程式Q = KAΔt（Q为传热量，K为传热系数，A为传热面积，Δt为平均温差），当Q和Δt不变时，K与A成反比。K增大，A减小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391946", "t": 1, "q": "在传热过程中，若冷热流体的平均温差Δtm不变，传热系数K增大，传热面积A减小，则传热量Φ的变化为（　）", "a": ["无法确定，取决于K和A的变化幅度", "增大", "减小", "不变", "", ""], "r": "A", "e": "传热量Φ=KAΔtm，Δtm不变，K增大、A减小，传热量变化取决于K和A的变化幅度。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391947", "t": 1, "q": "在传热过程中，若热流体对流热阻R1=0.1 m²·K/W，管壁导热热阻R2=0.01 m²·K/W，冷流体对流热阻R3=0.5 m²·K/W，污垢热阻R4=0.05 m²·K/W，则总传热系数K的近似值为（　）", "a": ["3.85 W/(m²·K)", "2.27 W/(m²·K)", "5.26 W/(m²·K)", "1.54 W/(m²·K)", "", ""], "r": "D", "e": "总热阻R=R<sub>1<\/sub>+R<sub>2<\/sub>+R<sub>3<\/sub>+R<sub>4<\/sub>=0.1+0.01+0.5+0.05=0.66m<sup>2<\/sup>.K/W,K=1/R=1/0.66≈1.54W/(m<sup>2<\/sup>·K)。", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391948", "t": 1, "q": "在非稳态导热过程中，物体的热扩散率a（a=λ/(ρc)，其中λ为导热系数，ρ为密度，c为比热容）越大，说明", "a": ["物体的导热能力越强", "物体内部温度变化的速率越慢", "物体内部温度变化的速率越快", "物体的储热能力越强", "", ""], "r": "C", "e": "热扩散率a反映物体内温度变化的速率，a越大，温度传播越快，即物体内部温度变化的速率越快。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391949", "t": 1, "q": "在非稳态导热过程中，物体内部某点的过余温度θ（θ=t-t∞）随时间变化的曲线斜率绝对值逐渐减小，这一现象主要与下列哪个无量纲数的变化相关?", "a": ["毕渥数Bi（Bi=hL/λ）", "普朗特数Pr（Pr=ν/a）", "努塞尔数Nu（Nu=hL/λ）", "傅里叶数Fo（Fo=aτ/L²，a=λ/ρc）", "", ""], "r": "D", "e": "傅里叶数Fo反映了非稳态导热过程进行的深度，Fo越大，热扰动越深入地传播到物体内部，物体内各点温度越接近周围介质温度，过余温度随时间变化曲线斜率绝对值逐渐减小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391950", "t": 1, "q": "在非稳态导热中，若两个形状相同、材质不同的物体（A的热扩散率aA>aB，导热系数λA>λB）初始温度相同，且置于同一对流环境中（h相同），则达到相同过余温度θ所需时间的关系为（　）", "a": ["tA > tB", "无法确定，与物体尺寸有关", "tA < tB", "tA = tB", "", ""], "r": "C", "e": "热扩散率越大，热量传播越快，达到相同过余温度所需时间越短。已知aA>aB，所以A达到相同过余温度所需时间更短，即tA < tB。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391951", "t": 1, "q": "在非稳态导热中，若物体的热扩散率a=λ/ρc增大，则下列说法正确的是（　）", "a": ["物体的热容增大，温度升高更困难", "物体内部温度变化更迅速，达到稳态所需时间更短", "物体的导热能力减弱，热流密度减小", "物体内部温度变化更缓慢，达到稳态所需时间更长", "", ""], "r": "B", "e": "热扩散率a=λ/ρc ，a增大意味着热量在物体内传播得更快。所以物体内部温度变化更迅速，能更快达到稳态。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391952", "t": 1, "q": "在辐射换热中，若两个黑体表面的温度分别为T1=800K和T2=400K，表面积A1=A2=A，则它们之间的辐射换热量Φ为（　）", "a": ["σA(800-400)^4", "σA(800<sup>4+400<\/sup>4)", "σA(800<sup>4-400<\/sup>4)", "2σA(800<sup>4-400<\/sup>4)", "", ""], "r": "C", "e": "两黑体表面间辐射换热量公式为Φ = σA(T1⁴ - T2⁴) ，这里T1 = 800K，T2 = 400K，A1 = A2 = A 。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391953", "t": 1, "q": "在管壳式换热器中，若管内流体为热水（加热介质），管外为冷水（被加热介质），当冷水流量突然减小（其他条件不变），则管外对流换热系数h2和总传热系数K的变化为（　）", "a": ["h2增大，K减小", "h2增大，K增大", "h2减小，K增大", "h2减小，K减小", "", ""], "r": "D", "e": "冷水流量减小，管外流体流速降低，根据对流换热原理，流速降低会使管外对流换热系数h2减小。而总传热系数K与管内外对流换热系数等有关，h2减小会使总热阻增大，从而导致总传热系数K减小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391954", "t": 1, "q": "在管外横掠管束对流换热中，若管束排数增加，其他条件不变，则对流换热系数h的变化为（　）", "a": ["前排h增大，后排h减小", "所有排h均增大，且后排h大于前排", "前排h减小，后排h增大", "所有排h均减小，且前排h大于后排", "", ""], "r": "A", "e": "在管外横掠管束对流换热中，当管束排数增加时，流体流经管束时的扰动增强，这通常会导致换热效果增强。然而，随着排数的增加，流体在流经后排管束时，由于前排管束造成的湍流和涡旋的影响减弱，流体的流动状态可能变得相对平稳，从而导致换热效果相对减弱。现在我们来分析每个选项：A. 前排h增大，后排h减小 - 这个选项反映了随着排数增加，前排管束由于流体扰动增强而换热效果增强（h增大），而后排管束由于前排造成的湍流影响减弱而换热效果减弱（h减小）。B. 所有排h均增大，且后排h大于前排 - 这不符合实际情况，因为随着排数增加，后排的换热效果并不会比前排更好。C. 前排h减小，后排h增大 - 这与实际情况相反，因为前排管束的换热效果应该是增强的。D. 所有排h均减小，且前排h大于后排 - 这也不符合实际情况，因为增加管束排数应该会增强前排的换热效果。综上所述，随着管束排数的增加，前排管束的对流换热系数h会增大，而后排管束的对流换热系数h会减小。所以，正确答案是A选项：“前排h增大，后排h减小”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391955", "t": 1, "q": "在计算黑体表面之间的辐射换热时，若两个表面的温度差较小（ΔT<<T1，T1为高温表面温度），则辐射换热量Q与温度差ΔT的关系可近似为", "a": ["Q与ΔT⁴成正比", "Q与ΔT³成正比", "Q与ΔT²成正比", "Q与ΔT成正比", "", ""], "r": "D", "e": "根据斯蒂芬 - 玻尔兹曼定律，辐射换热量公式在温差较小时可近似为线性关系，即Q与ΔT成正比。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391956", "t": 1, "q": "在计算通过圆筒壁的稳态导热热流量Φ时，若圆筒的内半径r1、外半径r2，长度L，壁材导热系数λ，内外壁温差Δt，则热流量Φ的正确表达式为（　）", "a": ["Φ=π(r2²-r1²)λΔt/(r2-r1)", "Φ=λLΔt/(r2-r1)", "Φ=2π(r2-r1)λΔt/L", "Φ=2πλLΔt/ln(r2/r1)", "", ""], "r": "D", "e": "本题可根据圆筒壁稳态导热热流量的计算公式来求解。圆筒壁稳态导热热流量公式为「test/yiwen_img/importSubject/2034800214711341056.png」 。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391957", "t": 1, "q": "在通过复合平壁的稳态传热过程中，各层材料的导热系数分别为λ1、λ2、λ3（厚度均为δ），且λ1>λ2>λ3，两侧流体的表面换热系数均为h。则总热阻中占比最大的部分是", "a": ["表面对流换热热阻", "第三层的导热热阻", "第一层的导热热阻", "第二层的导热热阻", "", ""], "r": "B", "e": "热阻与材料导热系数成反比，λ1>λ2>λ3，所以第三层导热热阻最大，且各层厚度相同、两侧表面换热系数相同，故总热阻中占比最大的是第三层的导热热阻。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391958", "t": 1, "q": "在稳态传热过程中，空气横掠单根圆管的总传热系数K的计算需考虑的分热阻不包括（　）", "a": ["管壁的导热热阻", "管内流体的对流热阻", "管外污垢热阻", "管内外流体的辐射热阻（常温下）", "", ""], "r": "D", "e": "常温下管内外流体辐射热阻影响极小可忽略，稳态传热中计算空气横掠单根圆管总传热系数K时，需考虑管壁导热热阻、管内流体对流热阻、管外污垢热阻。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391959", "t": 1, "q": "在稳态传热过程中，若换热器的传热面积A增大，其他条件（冷热流体进出口温度、流量、物性）不变，则换热器的传热量Φ和平均温差Δtm的变化为（　）", "a": ["Φ不变，Δtm减小", "Φ增大，Δtm不变", "Φ减小，Δtm增大", "Φ增大，Δtm增大", "", ""], "r": "B", "e": "根据传热基本方程Φ = KAΔtm，其他条件不变时，A增大，K一般不变，所以传热量Φ增大。平均温差Δtm只取决于冷热流体进出口温度，这些条件不变则Δtm不变。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391960", "t": 1, "q": "在稳态导热中，当平壁材料和两侧表面温度差一定时，以下关于热流密度q的说法正确的是", "a": ["材料的导热系数越大，q越小", "平壁的热阻越大，q越大", "平壁的壁厚越大，q越大", "平壁内温度梯度越大，q越大", "", ""], "r": "D", "e": "根据傅里叶定律「test/yiwen_img/importSubject/2034800214950416384.png」（q是热流密度，「test/yiwen_img/importSubject/2034800215067856896.png」是导热系数，「test/yiwen_img/importSubject/2034800215139160064.png」是温度梯度）。导热系数大、温度梯度大时热流密度大；热阻大、壁厚大时热流密度小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391961", "t": 1, "q": "在稳态导热中，若平壁两侧的对流换热系数h1突然增大（h2不变，壁材λ不变），则平壁的热流密度q和壁体内的温度梯度dT/dx的变化为（　）", "a": ["q减小，dT/dx增大", "q不变，dT/dx减小", "q增大，dT/dx增大", "q增大，dT/dx不变", "", ""], "r": "C", "e": "h1增大，冷热流体间热阻减小，根据热流密度公式，q增大。由傅里叶定律q=-λdT/dx，λ不变，q增大则dT/dx增大。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391962", "t": 1, "q": "在稳态导热中，若圆筒壁的内半径r1、外半径r2，导热系数λ为常数，内壁温度T1、外壁温度T2（T1>T2），则圆筒壁内的热流密度q（单位:W/m²）沿半径方向的变化规律是", "a": ["不随半径变化", "随半径增大而增大", "与半径的平方成正比", "随半径增大而减小", "", ""], "r": "D", "e": "在稳态导热且无内热源的圆筒壁中，单位长度上的导热热流量Φ（总功率，W)是常数，即Φ= const。<br />热流密度q定义为通过单位面积的热流量：「yicai_java/202608/Q8DGWJ_image.png」其中A=2πrL为半径r处的圆柱面积。因Φ恒定，q与半径r成反比，即半径增大时，面积增大，单<br />位面积通过的热流密度减小。<br />因此q随半径增大而减小，选D。<br /><br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391963", "t": 1, "q": "在稳态复合球壁导热中，球壁由内到外依次为材料1（r1→r2，导热系数λ1）和材料2（r2→r3，导热系数λ2），稳态时通过两层的热流量 Φ 相等，若λ1<<λ2，总温差为Δt，则两材料层温度降Δt1与Δt2的关系为（　）", "a": ["Δt1≈Δt，Δt2≈0", "Δt1与Δt2的比值等于λ2与λ1的比值", "Δt1≈0，Δt2≈Δt", "Δt1=Δt2=Δt/2", "", ""], "r": "A", "e": "稳态时通过两层热流量Φ相等，温差分配取决于热阻。球壁层热阻为 R=(r_out-r_in)/(4πλ r_in r_out)，因 λ1<<λ2，材料1热阻远大于材料2，故总温差主要降在材料1上，Δt1≈Δt，Δt2≈0，选A。", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391964", "t": 1, "q": "在稳态平壁导热中，若平壁材料的导热系数λ随温度升高而增大，且壁面两侧温度t1>t2，则壁内的温度分布曲线为（　）", "a": ["凸向高温侧的曲线（高温侧温度梯度小，低温侧大）", "无法确定，与λ的变化率无关", "直线，温度沿厚度线性变化", "凸向低温侧的曲线（高温侧温度梯度大，低温侧小）", "", ""], "r": "A", "e": "导热系数λ随温度升高而增大，热流密度q= -λdt/dx 为定值，高温处λ大则温度梯度dt/dx小，低温处λ小则温度梯度dt/dx大，所以温度分布曲线凸向高温侧。答案：A ", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391965", "t": 1, "q": "在自然对流换热中，流体的热扩散率a和运动粘度ν的比值（即Pr数）对换热效果的影响，下列说法正确的是", "a": ["Pr数越大，流体的动量扩散能力越强，热量扩散能力越弱，换热越弱", "Pr数越大，流体的动量扩散能力越弱，热量扩散能力越强，换热越弱", "Pr数越大，流体的动量扩散能力越强，热量扩散能力越弱，换热越强", "Pr数越大，流体的动量扩散能力越弱，热量扩散能力越强，换热越强", "", ""], "r": "A", "e": "普朗特数 Pr=ν/a，ν 是动量扩散率，a 是热扩散率；Pr 越大代表动量扩散能力强、热量扩散弱，边界层变厚，换热越弱。", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391966", "t": 1, "q": "在自然对流换热中，若流体为空气（Pr≈0.7），且处于湍流状态，则努塞尔数Nu与格拉晓夫数Gr、普朗特数Pr的关系为（　）", "a": ["Nu∝Gr<sup>0.33Pr<\/sup>0.33", "Nu∝Gr<sup>0.25Pr<\/sup>0.4", "Nu∝Gr<sup>0.33Pr<\/sup>0.4", "Nu∝Gr<sup>0.25Pr<\/sup>0.25", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391967", "t": 1, "q": "在自然对流换热中，竖直壁面的格拉晓夫数Gr=βgΔtL³/ν²，若壁面高度L增大，其他条件不变，则Gr和对流换热系数h的变化为（　）", "a": ["Gr减小，h减小", "Gr增大，h减小", "Gr减小，h增大", "Gr增大，h增大", "", ""], "r": "D", "e": "公式里 Gr 与 L³ 成正比，L 增大则 Gr 增大；竖直壁自然对流，Gr 变大流动更强，对流换热系数 h 增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034800219828391968", "t": 1, "q": "在自然对流换热中，下列哪种情况的对流换热系数h最大?", "a": ["空气在竖直壁面一侧被加热，壁面高度0.5m，温差Δt=10℃", "水在竖直壁面一侧被加热，壁面高度0.5m，温差Δt=10℃", "空气在水平圆管外被加热，管外径0.1m，温差Δt=20℃", "水在水平圆管外被加热，管外径0.1m，温差Δt=20℃", "", ""], "r": "D", "e": "对流换热系数与流体物性有关，水的热物性比空气好，其对流换热系数通常比空气大；同时温差和几何形状也有一定影响，但流体物性是主要因素。所以水的情况比空气的对流换热系数大。答案选D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575616", "t": 2, "q": "下列关于热扩散率a的说法，错误的有（　）", "a": ["a的单位是W/(m·K)", "a仅与流体相关，与固体无关", "a越大，物体的导热能力越强", "a越大，物体的储热能力越强", "", ""], "r": "ABD", "e": "热扩散率「test/yiwen_img/importSubject/2034800216175153152.png」，单位是「test/yiwen_img/importSubject/2034800216275816448.png」，与固体、流体都有关，a越大导热能力越强，储热能力和「test/yiwen_img/importSubject/2034800216405839872.png」有关而非a。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575617", "t": 2, "q": "下列关于热扩散率a的说法，正确的有（　）", "a": ["a反映物体导热和储热能力的比值", "a=λ/(ρc)，单位是m²/s", "a与物体的比热容c成反比", "a越大，物体温度变化越迅速", "", ""], "r": "ABCD", "e": "A. a反映物体导热和储热能力的比值 正确<br />热扩散率a = λ / (ρc)，其中λ为导热系数，ρc为容积热容量。a越大，表示物体内部温度趋向均匀的能力越强，即导热能力相对于储热能力越强。<br />B. a = λ / (ρc)，单位是m²/s 正确<br />热扩散率的基本定义式为a = λ / (ρc)，其单位与长度单位的平方除以时间单位一致，即m²/s。<br />C. a与物体的比热容c成反比 正确<br />根据公式a = λ / (ρc)，在导热系数λ和密度ρ一定的情况下，比热容c越大，热扩散率a越小，因此a与比热容c成反比。<br />D. a越大，物体温度变化越迅速 正确<br />热扩散率a越大，表示物体内部温度传播的速度越快，温度变化越迅速。当物体被加热或冷却时，温度变化速率与热扩散率直接相关。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575618", "t": 2, "q": "下列关于热阻的说法，正确的有（　）", "a": ["串联热阻的总热阻等于各热阻之和", "对流热阻与对流换热系数成反比", "并联热阻的总热阻的倒数等于各热阻倒数之和", "辐射热阻与表面发射率成反比", "", ""], "r": "ABC", "e": "本题可根据热阻的相关性质来判断各选项的正确性。### 选项A在串联热阻的情况下，根据热阻串联的基本原理，总热阻等于各热阻之和，这是热阻串联的基本计算规则，所以选项A正确。### 选项B对流热阻「test/yiwen_img/importSubject/2034800216477143040.png」（其中h为对流换热系数，A为换热面积），在换热面积一定时，对流热阻与对流换热系数成反比，所以选项B正确。 ### 选项C对于并联热阻，其总热阻的倒数等于各热阻倒数之和，这与电阻并联的计算规则类似，是热阻并联的基本计算方法，所以选项C正确。### 选项D辐射热阻与表面发射率有关，但不是简单的反比关系。辐射热阻的计算较为复杂，与表面发射率、温度等多种因素有关，所以选项D错误。综上，答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575619", "t": 2, "q": "下列关于热阻分析的说法，正确的有（　）", "a": ["圆筒壁的导热热阻计算式为R=ln(r2/r1)/(2πλL)", "平壁的导热热阻计算式为R=δ/(λA)", "并联热阻的总热阻小于任一单个并联热阻", "稳态导热中，总热阻等于各串联热阻之和", "", ""], "r": "ABCD", "e": "A为圆筒壁导热热阻标准式；B为平壁导热热阻标准式；C并联电阻/热阻规律，总阻必小于最小支路；D为稳态串联热阻叠加原则，均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575620", "t": 2, "q": "下列关于自然对流和强制对流的区别，正确的有（　）", "a": ["自然对流的温差越大，流动越强;强制对流的流速越大，流动越强", "自然对流的换热系数h一般小于强制对流的换热系数h", "自然对流的驱动力是流体的密度差，强制对流的驱动力是外部机械力", "自然对流的雷诺数Re由格拉晓夫数Gr决定，强制对流的雷诺数Re由外部流速决定", "", ""], "r": "ABCD", "e": "自然对流靠流体密度差驱动，温差大则密度差大、流动强，其换热系数通常小于强制对流；强制对流靠外部机械力驱动，流速大则流动强，雷诺数由外部流速决定，自然对流雷诺数与格拉晓夫数有关。ABCD选项均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575621", "t": 2, "q": "下列关于自然对流换热的说法，正确的有（　）", "a": ["自然对流的流动强度用格拉晓夫数Gr表征", "自然对流是由流体密度差引起的流动", "Gr数越大，自然对流越强烈，h越大", "竖直壁面自然对流的h随壁面高度的增加而增大", "", ""], "r": "ABC", "e": "自然对流由流体密度差产生，用格拉晓夫数Gr表征流动强度，Gr越大对流越强烈、表面传热系数h越大；竖直壁面自然对流h随壁面高度增加而减小。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575622", "t": 2, "q": "下列关于自然对流换热的说法，正确的有（　）", "a": ["自然对流由流体密度差驱动", "水平圆柱的h随直径增大而减小", "自然对流的h小于强制对流的h", "竖直壁面的h随高度增加而减小", "", ""], "r": "ABCD", "e": "A 选项，自然对流是由于流体冷热部分密度不同，在重力场作用下产生流动，由密度差驱动，表述正确。<br />B 选项，水平圆柱自然对流换热，在层流范围内，换热系数 h 随圆柱直径增大而减小，表述正确。<br />C 选项，强制对流依靠外力（风机、泵）驱动流体流动，流速更高，换热系数一般大于自然对流，表述正确。<br />D 选项，竖直壁面，下部为层流区，h 较大；沿高度向上，边界层不断增厚，层流段 h 随高度增加而减小；进入湍流段后 h 会回升。常规考题语境下该表述正确。<br />综上选 ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575623", "t": 2, "q": "下列属于非稳态导热的情况有（　）", "a": ["蒸汽管道在正常运行时，管壁温度保持不变的过程", "冬季建筑物墙体温度从白天的较高温度降至夜间较低温度的过程", "冰箱冷藏室壁面在运行过程中，温度保持恒定的过程", "金属铸件在砂型中冷却，温度逐渐降低的过程", "", ""], "r": "BD", "e": "非稳态导热指物体温度随时间变化的导热过程。A、C选项中温度保持不变，属于稳态导热；B选项墙体温度从白天到夜间有变化，D选项金属铸件冷却温度逐渐降低，二者温度都随时间改变，属于非稳态导热。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575624", "t": 2, "q": "下列属于非稳态导热的情况有（　）", "a": ["夏季午后，建筑物屋顶温度随太阳辐射增强而升高的过程", "蒸汽管道正常运行时，管壁温度稳定的过程", "电熨斗加热时，底板温度从室温升高到工作温度的过程", "锅炉停炉后，炉墙温度逐渐降低的过程", "", ""], "r": "ACD", "e": "非稳态导热指物体温度随时间变化的导热过程。A选项屋顶温度随太阳辐射增强升高、C选项电熨斗底板温度从室温升高到工作温度、D选项锅炉停炉后炉墙温度降低，这三个过程中温度都随时间改变，属于非稳态导热；B选项管壁温度稳定，不随时间变化，是稳态导热。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575625", "t": 2, "q": "下列属于热量传递基本方式的有（　）", "a": ["沸腾换热", "导热", "对流换热", "辐射换热", "", ""], "r": "BCD", "e": "答案：BCD热量传递的基本方式主要有三种：导热、对流换热和辐射换热。 导热是热量从高温物体传向低温物体，或者从物体的高温部分传向低温部分的过程。 对流换热是通过流体的流动来传递热量的过程。 辐射换热是通过电磁波传递热量的过程。沸腾换热是一种特殊的对流换热形式，但它不是热量传递的基本方式之一，而是对流换热的一种复杂形式。因此，选项A不正确，而选项B、C和D都是热量传递的基本方式，所以正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575626", "t": 2, "q": "下列属于稳态导热特点的有", "a": ["物体的内能不随时间变化", "物体内的热流密度不随时间变化", "物体内的温度梯度不随时间变化", "物体内无热量传递", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575627", "t": 2, "q": "影响非稳态导热过程的因素有（　）", "a": ["物体的初始温度t0", "环境温度t∞", "物体的导热系数λ", "表面对流换热系数h", "", ""], "r": "ABCD", "e": "非稳态导热受初始条件和边界条件影响，初始温度t₀属初始条件；环境温度t∞、导热系数λ、表面对流换热系数h属边界条件，它们都会影响非稳态导热过程。答案选ABCD。 <br />综上所述，选项A、B、C、D均正确地指出了影响非稳态导热过程的关键因素。", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575628", "t": 2, "q": "影响辐射换热的因素有（　）", "a": ["物体表面的发射率和吸收率", "参与辐射换热的物体表面温度", "物体表面的几何形状和相对位置（角系数）", "物体之间的介质（是否透明）", "", ""], "r": "ABCD", "e": "辐射换热受物体表面特性（发射率、吸收率）、温度、表面几何形状与相对位置（角系数）以及物体间介质透明性等因素影响。ABCD选项均符合。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575629", "t": 2, "q": "影响管内强制对流换热系数h的因素有（　）", "a": ["流体的流速", "管道的内径", "流体的导热系数", "流体的普朗特数", "", ""], "r": "ABCD", "e": "管内强制对流换热系数h受多种因素影响，流体流速、管道内径、流体导热系数、流体普朗特数都会对其产生作用。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575630", "t": 2, "q": "影响自然对流换热表面换热系数h的因素有", "a": ["流体的温度差（表面与流体的温差）", "流体的物性参数（λ、ρ、c、ν）", "换热表面的几何尺寸和放置方式", "重力加速度g", "", ""], "r": "ABCD", "e": "自然对流换热中，表面与流体的温差会影响流体密度差，进而影响对流；流体物性参数影响其热传递能力；换热表面几何尺寸和放置方式影响流体流动；重力加速度影响浮升力。ABCD四个因素都会影响自然对流换热表面换热系数h。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575631", "t": 2, "q": "在传热过程分析中，总传热系数K的大小取决于（　）", "a": ["冷热流体的温度差", "冷热流体的流动状态（Re、流动形态）", "传热面的表面状况（粗糙度、污垢情况）", "传热面的几何参数（面积、形状、尺寸）", "", ""], "r": "BCD", "e": "总传热系数K与冷热流体的物性、流动状态、传热面表面状况、传热面几何参数等有关。冷热流体温度差不直接影响K值。流动状态影响对流换热系数，表面状况影响热阻，几何参数也会影响传热情况。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575632", "t": 2, "q": "在传热过程中，减小总热阻的方法包括（　）", "a": ["减小管壁导热系数λ", "减小传热面积A", "采用肋片强化换热", "增大对流换热系数h", "", ""], "r": "CD", "e": "传热总热阻与导热系数、传热面积、对流换热系数等有关。减小导热系数、传热面积会增大热阻，A、B错误；采用肋片强化换热和增大对流换热系数都能减小热阻。所以答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575633", "t": 2, "q": "在传热过程中，下列说法正确的有（　）", "a": ["传热量Φ与传热面积A成正比", "总传热系数K的大小由热阻最大的分热阻决定", "提高K的关键是减小最大分热阻", "顺流换热器的Δtm小于逆流换热器的Δtm", "", ""], "r": "ABCD", "e": "传热基本方程 Φ=KAΔtm，Φ 与 A 成正比；总热阻为各分热阻之和，总传热系数 K 由最大分热阻主导，强化传热优先减小最大分热阻；相同冷热流体进出口温度条件下，逆流对数平均温差大于顺流。", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575634", "t": 2, "q": "在对流换热中，下列关于边界层的说法正确的有（　）", "a": ["速度边界层是指流体速度从壁面的0变化到主流速度的99%的区域", "边界层内的流体流动以粘性力为主，边界层外以惯性力为主", "温度边界层是指流体温度从壁面温度变化到主流温度的99%的区域", "对于Pr=1的流体，速度边界层厚度等于温度边界层厚度", "", ""], "r": "ABCD", "e": "ABCD选项均是对流换热中边界层的正确概念描述。A为速度边界层定义；B中边界层内粘性力起主导作用，层外惯性力主导；C是温度边界层定义；对于普朗特数Pr = 1的流体，速度与温度边界层厚度相等。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575635", "t": 2, "q": "在多层圆筒壁稳态导热中，下列说法正确的有", "a": ["热流密度q沿半径方向随半径增大而减小", "导热热阻沿半径方向随半径增大而增大", "温度沿半径方向的变化曲线为直线", "各层的热流密度q相等", "", ""], "r": "AB", "e": "逐项分析：<br />A 正确：总热流量Φ恒定，热流密度q=Φ/(2πrL)，r越大→q越小。<br />B 正确：单层圆筒壁热阻为 ln(r外/r内)/(2πλL)，从内向外r增大，每增加dr对应的微分热阻 dr/(λ·2πrL) 随r增大而减小？——但“累计到某半径的总导热热阻”是积分结果R(r)=ln(r/r₁)/(2πλL)，随r增大单调增大，表述成立。<br />C 错误：圆筒壁温度分布为T(r)=T₁−(T₁−T₂)·ln(r/r₁)/ln(r₂/r₁)，是对数曲线，不是直线（平壁才是直线）。<br />D 错误：q=Φ/A，A随r变，各层总热流量Φ相等，但热流密度q不相等；若指“单位管长热流量q_L=Φ/L”才相等，题干写“热流密度q”默认W/m²，故错。答案：AB", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575636", "t": 2, "q": "在非稳态导热的集总参数法中，物体温度随时间变化的规律满足", "a": ["指数衰减规律", "最终趋近于环境温度", "线性变化规律", "温度变化率随时间增大而减小", "", ""], "r": "ABD", "e": "集总参数法中，物体内部温度均匀，其温度随时间按指数衰减规律变化，最终趋近环境温度，且温度变化率随时间增大而减小。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575637", "t": 2, "q": "在非稳态导热中，毕渥数Bi的物理意义及应用正确的有（　）", "a": ["Bi的大小影响非稳态导热温度场的分布形态", "Bi>100时，可近似认为物体表面温度等于环境温度（厚材）", "Bi定义为内部导热热阻与表面对流热阻之比", "Bi<0.1时，可近似认为物体内部温度均匀（薄材）", "", ""], "r": "ABCD", "e": "在非稳态导热中，毕渥数（Bi）是一个关键的无量纲准则数，用于表征固体内部导热热阻与表面换热热阻的相对大小。以下对各选项的分析：<br />A. Bi的大小影响非稳态导热温度场的分布形态  正确<br />Bi的大小直接反映了物体在非稳态导热条件下内部温度场的分布规律。Bi较小时，内部温度趋于均匀；Bi较大时，内部存在显著的温度梯度。<br />B. Bi>100时，可近似认为物体表面温度等于环境温度（厚材）  正确<br />当Bi很大（如Bi→∞）时，表面对流热阻远小于内部导热热阻，表面温度几乎立即达到环境温度，可视为第一类边界条件。Bi>100属于Bi很大范围，因此该说法正确。<br />C. Bi定义为内部导热热阻与表面对流热阻之比  正确<br />Bi的定义式为Bi = hL/λ，其中h为对流换热系数，L为特征长度，λ为固体导热系数。该比值正是固体内部单位导热面积上的导热热阻与单位面积上的换热热阻之比。<br />D. Bi<0.1时，可近似认为物体内部温度均匀（薄材）  正确<br />当Bi ≤ 0.1时，物体内部最大与最小过余温度之差小于5%，工程计算中可认为整个物体温度均匀，适用于集总参数法（集中参数法）分析。<br />因此，所有选项均正确，正确答案为：ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575638", "t": 2, "q": "在非稳态导热中，毕渥数Bi的作用包括（　）", "a": ["确定非稳态导热的计算方法（集总参数法或精确解法）", "反映物体内部导热热阻与表面对流热阻的比值", "判断物体内部温度分布是否均匀", "决定热扩散率a的大小", "", ""], "r": "ABC", "e": "Bi反映物体内部导热热阻与表面对流热阻的比值，可据此确定非稳态导热计算方法，也能判断物体内部温度分布是否均匀，但与热扩散率a无关。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575639", "t": 2, "q": "在非稳态导热中，傅里叶数Fo（Fo=aτ/δ²，τ为时间）的物理意义，说法正确的有（　）", "a": ["反映物体温度随时间变化的程度", "与热扩散率a成正比，与时间τ成正比", "物体内部导热热阻与表面对流热阻之比", "反映热量在物体内传播的深度与特征尺寸的比值", "", ""], "r": "ABD", "e": "Fo 数表征非稳态导热，体现温度随时间变化，数学表达式上与 a、τ 成正比，物理意义为热量传播深度和特征尺寸之比；C 是毕渥数 Bi。", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575640", "t": 2, "q": "在辐射换热中，角系数的特性包括（　）", "a": ["完整性（对封闭系统，某表面各角系数之和为1）", "可加性（F1(n)=F12+F13+...+F1n）", "与表面发射率无关", "与表面温度无关", "", ""], "r": "ABCD", "e": "角系数具有完整性，封闭系统中某表面各角系数之和为1；也有可加性；且角系数只取决于表面形状、大小和相对位置，与表面发射率和温度无关。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575641", "t": 2, "q": "在辐射换热中，角系数F12（表面1对表面2的角系数）的特性有", "a": ["角系数与表面的温度无关", "角系数具有相对性，即A1F12=A2F21", "角系数与表面的发射率无关", "角系数具有可加性，即F1(2+3)=F12+F13（表面2和3不重叠）", "", ""], "r": "ABCD", "e": "角系数取决于物体形状、大小、相对位置，与温度和发射率无关；具有相对性和可加性。答案涵盖了所有特性描述。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575643", "t": 2, "q": "在换热器中，影响平均温差Δtm的因素包括（　）", "a": ["传热面积A", "冷热流体的进出口温度", "冷热流体的比热容", "冷热流体的流动方向（顺流/逆流）", "", ""], "r": "BD", "e": "平均温差Δtm与冷热流体进出口温度以及流动方向有关，传热面积和比热容不直接影响平均温差。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575644", "t": 2, "q": "在稳态导热中，下列关于热流密度q的说法正确的有（　）", "a": ["平壁稳态导热中，q沿厚度方向保持不变", "球壁稳态导热中，q沿半径方向增大", "复合平壁稳态导热中，各层的q相等", "圆筒壁稳态导热中，q（单位面积热流密度）沿半径方向减小", "", ""], "r": "ACD", "e": "稳态导热时，平壁和复合平壁热流密度沿热流方向不变；球壁和圆筒壁稳态导热中，热流量不变，但单位面积热流密度q随半径增大而减小。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575645", "t": 2, "q": "在稳态多层平壁导热中，满足下列哪些条件时，各层的热流密度q相等", "a": ["各层材料的导热系数相同", "各层之间的接触良好，无接触热阻", "稳态传热，没有内热源", "各层的厚度相同", "", ""], "r": "BC", "e": "稳态无内热源多层平壁导热，只要层间接触良好无接触热阻，热量不会在界面蓄积，各层热流密度相等；热流密度相等和材料导热系数、壁厚没有必然关系。", "ap": [false, false, false, false, false, false]}, {"id": "2034800222638575647", "t": 2, "q": "自然对流换热中，格拉晓夫数Gr的影响因素包括（　）", "a": ["流体的体积膨胀系数β", "壁面与流体的温差Δt", "重力加速度g", "壁面的特征长度L", "", ""], "r": "ABCD", "e": "格拉晓夫数Gr公式包含流体的体积膨胀系数β、壁面与流体的温差Δt、重力加速度g、壁面的特征长度L等因素。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506688", "t": 3, "q": "灰体的辐射光谱与黑体的辐射光谱形状不同，因为灰体的发射率ε与波长有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "灰体定义为发射率 ε 与波长无关，是常数。灰体的辐射光谱和黑体光谱形状**相同**，只是辐射力按固定比例 ε 衰减。题干错误，灰体发射率不随波长变化。", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506689", "t": 3, "q": "灰体的辐射力E=εσT^4，其中ε为灰体的发射率，0<ε<1，因此灰体的辐射力始终小于相同温度下黑体的辐射力，判断该说法是否正确", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "黑体的辐射力为E=σT4(斯忒藩-玻尔兹曼定律)。灰体的辐射力为E=E0T4,其中发射率（黑度）ε满足0<E<1。因此在相同温度T下，E=EEb<E,即灰体辐射力始终小于同温度黑体的辐射力。该说法正确。<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506690", "t": 3, "q": "灰体的吸收率与波长无关，因此灰体对所有波长的辐射能吸收比例相同，其辐射光谱与黑体的辐射光谱相似。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506691", "t": 3, "q": "灰体的吸收率α与发射率ε在任何情况下都相等，这是基尔霍夫定律的基本内容。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基尔霍夫定律指出，在热平衡条件下，灰体的吸收率α与发射率ε相等。题干未提及热平衡条件，说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506692", "t": 3, "q": "灰体的吸收率α与辐射能的波长无关，即灰体对所有波长的辐射能的吸收率都相同，这一假设在工程上可简化辐射换热计算。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "灰体定义就是对各种波长辐射能吸收率相同且与波长无关，此假设能让辐射换热计算更简单。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506693", "t": 3, "q": "基尔霍夫定律适用于所有物体，包括黑体、灰体和非灰体，其核心是吸收率等于发射率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "基尔霍夫定律表明，在热平衡条件下，任何物体的发射率等于其吸收率，该定律适用于所有物体，涵盖黑体、灰体和非灰体。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506694", "t": 3, "q": "基尔霍夫定律指出，任何物体的吸收率α都等于其发射率ε，该关系在任何温度和任何换热条件下都成立。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基尔霍夫定律中“任何物体的吸收率α等于其发射率ε”这一关系，是在热平衡条件下才成立的，并非在任何温度和任何换热条件下都成立。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506695", "t": 3, "q": "基尔霍夫定律指出，任意物体的吸收率α等于其发射率ε，该关系在任何温度条件下都成立，与物体是否处于热平衡无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "基尔霍夫定律中，只有在热平衡条件下，任意物体的吸收率α才等于其发射率ε 。题干说与热平衡无关，表述错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506696", "t": 3, "q": "平壁的导热热阻R=δ/(λA)，其中δ为平壁厚度，λ为导热系数，A为传热面积;该公式仅适用于稳态导热，不适用于非稳态导热。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "导热热阻公式 R = δ/(λA)是基于稳态导热推导得出的，稳态导热时热流和温度分布不随时间变化，非稳态导热中热流和温度随时间改变，该公式不适用。", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506697", "t": 3, "q": "平壁的稳态传热系数K与平壁的厚度δ成反比，因为厚度越大，导热热阻越大，总传热系数越小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "平壁稳态传热系数K与平壁厚度δ关系符合热阻原理，厚度增加，导热热阻增大，总热阻增大导致传热系数减小，两者成反比。", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506698", "t": 3, "q": "强制对流换热中，雷诺数Re越大，流体的湍流程度越强，表面换热系数h越大，因此Re越大，对流换热效果越好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "雷诺数Re反映流体流动状态，Re越大湍流程度越强，一般会使边界层变薄，流体间混合更剧烈，表面换热系数h增大，增强对流换热效果。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506699", "t": 3, "q": "热扩散率a=λ/(ρc)，a值越大的材料，在非稳态导热中温度变化越慢，因为其储热能力（ρc）更强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热扩散率a=λ/(ρc)，a值越大，材料在非稳态导热中温度变化越快，因为a反映的是材料传播温度变化的能力，而非储热能力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506700", "t": 3, "q": "热量传递的三种基本方式中，导热的热流密度仅与物体内部的温度梯度有关，与时间无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "导热热流密度遵循傅里叶定律，表达式为「test/yiwen_img/importSubject/2034800216888184832.png」，只与物体内部温度梯度及热导率有关，和时间无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506701", "t": 3, "q": "热量传递的三种基本方式中，导热和对流需要介质，辐射不需要介质，因此辐射换热只能在真空中进行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "辐射换热不依赖介质，可在真空中进行，但并非只能在真空中进行，在有介质的环境也能进行辐射换热。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506702", "t": 3, "q": "稳态传热过程中，若传热面积A增大，其他条件不变，则传热量Φ增大，平均温差Δtm减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据稳态传热基本公式「test/yiwen_img/importSubject/2034800216976265216.png」，当A增大，其他条件不变时，「test/yiwen_img/importSubject/2034800217068539904.png」增大；但平均温差「test/yiwen_img/importSubject/2034800217139843072.png」只与冷热流体进出口温度有关，与传热面积无关，不会因A增大而减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506703", "t": 3, "q": "稳态导热时，物体内各点的温度不随时间变化，因此物体的热流量也不随时间变化，但热流密度可能随位置变化（如圆筒壁）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稳态导热定义是物体内各点温度不随时间变，热流量也稳定不变；圆筒壁等变截面物体，不同位置截面积不同，根据热流密度等于热流量除以截面积，热流密度会随位置变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506704", "t": 3, "q": "稳态导热中，若平壁两侧的对流换热系数h1和h2都增大，则平壁的总热阻减小，热流密度q增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "平壁总热阻包含壁面导热热阻和两侧对流换热热阻，h1和h2增大使对流换热热阻减小，总热阻随之减小，根据热流密度公式q = ΔT / R（ΔT为温差，R为总热阻），温差不变时总热阻减小则热流密度q增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506705", "t": 3, "q": "稳态导热中，物体内部各点的温度不随时间变化，但可能随空间位置变化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稳态导热定义就是温度场不随时间变化，不过在物体内不同空间位置温度可能不同。", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506706", "t": 3, "q": "在稳态复合壁导热过程中，各层材料的导热热阻越大，该层的温度降越小，因为热阻大阻碍热量传递。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在稳态复合壁导热中，热流量处处相等，根据热阻与温差关系「test/yiwen_img/importSubject/2034800217211146240.png」，热阻R越大，温度降「test/yiwen_img/importSubject/2034800217303420928.png」越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506707", "t": 3, "q": "稳态平壁导热中，若平壁材料的导热系数λ随温度升高而减小，且壁面两侧温度t1>t2，则壁内的温度分布曲线凸向低温侧。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稳态平壁导热中，根据傅里叶定律，热流密度q为常数。当导热系数λ随温度升高而减小，温度高处λ小，为保证q不变，温度变化率就大，所以温度分布曲线凸向低温侧。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223867506708", "t": 3, "q": "稳态平壁导热中，若平壁材料的导热系数λ为常数，则壁内的温度分布为线性分布。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稳态平壁导热，当导热系数为常数，根据傅里叶定律推导，温度分布是线性的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871700992", "t": 3, "q": "稳态平壁导热中，若平壁两侧的对流换热系数h1和h2都减小，则总热阻减小，热流密度q增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "总热阻包含平壁导热热阻和两侧对流换热热阻，h1和h2减小会使对流换热热阻增大，总热阻增大，根据热流密度公式「test/yiwen_img/importSubject/2034800217399889920.png」（「test/yiwen_img/importSubject/2034800217303420928.png」为温差，「test/yiwen_img/importSubject/2034800217487970304.png」为总热阻），总热阻增大则热流密度q减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871700993", "t": 3, "q": "稳态平壁复合导热中，各层材料的导热热阻越大，该层的温度降越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据热阻公式和温度降与热阻关系，在稳态平壁复合导热里，热流相同，导热热阻越大，温度降越大。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871700994", "t": 3, "q": "稳态圆筒壁导热中，导热热阻R=ln(r2/r1)/(2πλL)，其中r1、r2分别为内外半径，L为长度，λ为导热系数，R与λ成反比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据导热热阻公式「test/yiwen_img/importSubject/2034800217576050688.png」，在「test/yiwen_img/importSubject/2034800217672519680.png」、「test/yiwen_img/importSubject/2034800217743822848.png」、L确定时，R与「test/yiwen_img/importSubject/2034800215067856896.png」的关系符合反比例函数形式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871700995", "t": 3, "q": "稳态圆筒壁导热中，热流密度q沿半径方向减小，因此热流量Φ也沿半径方向减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "稳态圆筒壁导热中，热流量Φ沿半径方向不变，而热流密度q = Φ / A ，随着半径增大，面积A增大，所以q沿半径方向减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871700996", "t": 3, "q": "稳态圆筒壁导热中，热流密度q沿半径方向逐渐减小，热流量Φ沿半径方向保持不变。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "稳态导热无热量蓄积，热流量Φ不变；圆筒壁面积随半径增大，由q = Φ/A ，热流密度q随半径增大而减小。", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871700997", "t": 3, "q": "液体的导热系数通常比气体的导热系数大，因为液体分子间的距离比气体小，分子碰撞传递热量更剧烈。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "液体分子间距小于气体，分子碰撞机会多，能更有效地传递热量，所以液体导热系数通常比气体大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871700998", "t": 3, "q": "在传热过程分析中，若某一分热阻远大于其他分热阻，则总热阻近似等于该分热阻，提高总传热系数K的关键是减小该分热阻。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据热阻串联原理，总热阻是各分热阻之和，当某一分热阻远大于其他分热阻时，总热阻主要由该分热阻决定，近似等于它。而总传热系数K与总热阻成反比，所以要提高K关键就是减小这个起主要作用的分热阻。", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871700999", "t": 3, "q": "在传热过程中，平均温差Δtm仅与冷热流体的进出口温度有关，与流动方向无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "平均温差Δtm不仅与冷热流体进出口温度有关，还和流动方向有关，不同流动方向（如逆流、顺流等）下平均温差计算不同。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701000", "t": 3, "q": "在传热过程中，若采用肋片强化换热，肋片应加在导热系数λ较小的一侧，以增强导热。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "肋片应加在对流换热系数α较小的一侧，而非导热系数λ较小的一侧，目的是增强对流换热。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701001", "t": 3, "q": "在传热过程中，若传热表面存在污垢，则污垢热阻会使总热阻增大，总传热系数K减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "污垢热阻是热阻的一部分，存在污垢时总热阻等于原有热阻加污垢热阻，所以总热阻增大。又因为总传热系数K与总热阻成反比，总热阻增大则K减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701002", "t": 3, "q": "在传热过程中，若冷热流体的流动方向为逆流，则换热器的传热量一定大于顺流换热器，因为逆流的平均温差Δtm更大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在其他条件相同时，逆流的平均温差Δtm通常比顺流大，根据传热公式Q = KΔtmA（K为传热系数，A为传热面积），平均温差大传热量更大，但前提是其他条件相同，题中未明确说明，表述不准确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701003", "t": 3, "q": "在传热过程中，若冷热流体的流动方向为逆流，则其平均温差Δtm一定大于顺流的Δtm，因此逆流换热器的传热量一定大于顺流换热器。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "逆流平均温差通常大于顺流，但传热量还受传热系数、传热面积等因素影响，不能仅依据平均温差判断传热量大小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701004", "t": 3, "q": "在传热过程中，总传热系数K的单位是W/(m·K)，表示单位温度差下单位面积的传热量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "总传热系数 K 的单位是 W/(m²・K)，表示单位温差、单位面积、单位时间传递的热量。W/(m・K) 是导热系数 λ 的单位。题干混淆了总传热系数和导热系数的单位，表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701005", "t": 3, "q": "在对流换热中，普朗特数Pr=ν/a，反映流体动量扩散能力与热量扩散能力的比值。当Pr=1时，表示流体的速度边界层厚度等于温度边界层厚度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "普朗特数Pr确实是流体动量扩散能力与热量扩散能力的比值，且当Pr = 1时，速度边界层厚度和温度边界层厚度相等。", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701006", "t": 3, "q": "在辐射换热中，封闭系统内所有表面的角系数之和为1，这是角系数的完整性特性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "角系数的完整性指的是从一个表面发出的辐射能总会落到封闭系统内各表面上，所以封闭系统内某一表面对其余各表面的角系数之和为1。本题表述正确体现了这一特性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701007", "t": 3, "q": "在辐射换热中，角系数F12（表面1对表面2）的大小仅取决于两个表面的几何形状、尺寸和相对位置，与表面的温度和发射率无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "角系数是纯几何量，只与两表面几何形状、尺寸和相对位置有关，和表面的温度、发射率等热物性无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701008", "t": 3, "q": "在辐射换热中，两个表面的角系数F12=1，说明表面1发出的所有辐射能都被表面2吸收。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "角系数F12 = 1 表示表面 1 发出的所有辐射能都到达表面 2，但到达表面 2 后不一定都被吸收，还可能被反射。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701009", "t": 3, "q": "在管外横掠管束对流换热中，顺排管束的对流换热系数h大于错排管束，因为顺排管束的流体流动阻力更小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在管外横掠管束对流换热中，错排时流体扰动更剧烈，边界层破坏更严重，换热效果更好，对流换热系数h更大，而不是顺排管束h大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701010", "t": 3, "q": "在稳态传热过程中，总传热系数K的大小与冷热流体的温度差Δt无关，仅由传热过程的各分热阻决定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "总传热系数K反映传热过程的综合传热能力，其计算公式表明它由各分热阻决定，与冷热流体温度差Δt无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701011", "t": 3, "q": "在稳态多层圆筒壁导热中，各层的热流密度q相等，因为热流量Φ相等，且各层的面积（2πrL）也相等。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在稳态多层圆筒壁导热中，热流量Φ相等，但各层的面积（2πrL）随半径r变化并不相等，由q = Φ/A可知，各层热流密度q不相等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701012", "t": 3, "q": "自然对流换热的表面换热系数h一定小于强制对流换热的h，因为自然对流的流体流速远小于强制对流。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般情况下自然对流流体流速小，换热强度低，表面换热系数h 小于强制对流。但在特殊情况如强制对流流速极低，自然对流温差极大时，自然对流的h 可能大于强制对流的h。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701013", "t": 3, "q": "自然对流换热的格拉晓夫数Gr反映自然对流的流动强度，Gr越大，自然对流越强烈，对流换热系数h越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "格拉晓夫数Gr体现自然对流中浮升力与黏性力的相对大小，Gr越大，浮升力相对黏性力越大，自然对流流动越强烈，进而使对流换热系数h增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701014", "t": 3, "q": "自然对流换热的格拉晓夫数Gr越大，说明流体的密度差引起的流动越强烈，对流换热系数h越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "格拉晓夫数 Gr 体现自然对流中浮升力与黏性力的相对大小，Gr 越大，浮升力相对黏性力越大，流体因密度差引起的流动越强烈，能增强流体的扰动，使对流换热系数 h 增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701015", "t": 3, "q": "自然对流换热的驱动力是流体的粘性力，粘性力使温度不同的流体产生相对运动，进而传递热量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自然对流换热的驱动力是浮升力，而非流体的粘性力。浮升力是由于流体中温度不同导致密度差异而产生的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701016", "t": 3, "q": "自然对流换热系数h是流体的物性参数，仅与流体的种类和温度有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。自然对流换热系数h不是流体物性参数，它除了与流体种类和温度有关，还和流动状态、换热表面形状、尺寸等因素有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701017", "t": 3, "q": "自然对流换热中，流体的体积膨胀系数β越大，在相同温差下流体的密度差越大，自然对流越强烈。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在自然对流换热里，体积膨胀系数β反映流体因温度变化的膨胀程度，β越大，相同温差下流体密度差越大，浮力作用越强，自然对流就越强烈。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800223871701018", "t": 3, "q": "自然对流换热中，流体的体积膨胀系数β越大，在相同温差Δt下，流体的密度差越大，自然对流越强烈。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "自然对流中，流体体积膨胀系数β反映了流体密度随温度变化的程度，β越大，相同温差Δt下流体密度差越大，浮力作用越强，自然对流就越强烈。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第3章 热力发电厂（1）", "n": "基础练习题【含解析】 / 第3章 热力发电厂（1）", "qs": [{"id": "2034800227453636608", "t": 1, "q": "过热蒸汽冷却器停运后，机组可能出现的变化有（　）", "a": ["汽轮机高压缸的排汽量增加", "机组的发电煤耗率升高", "给水系统的阻力增大", "加热器内蒸汽的冷凝温度降低", "", ""], "r": "B", "e": "过热蒸汽冷却器停运，会使进入加热器的蒸汽过热度增加，加热效果变差，导致机组热经济性下降，发电煤耗率升高。A选项高压缸排汽量通常不受其直接影响；C选项给水系统阻力与过热蒸汽冷却器停运无直接关联；D选项蒸汽过热度增加，冷凝温度应升高而非降低。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636609", "t": 1, "q": "抽汽管的局部阻力损失主要来源于?", "a": ["抽汽在管内的沿程摩擦", "抽汽管的管径变化、阀门、弯头", "抽汽温度的变化", "加热器的换热强度", "", ""], "r": "B", "e": "局部阻力损失是流体在流动中因遇到局部障碍而产生的损失。管径变化、阀门、弯头这类局部障碍会使流体流动状态改变产生局部阻力。而沿程摩擦是沿程阻力损失，抽汽温度变化和加热器换热强度与局部阻力损失无关。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636610", "t": 1, "q": "抽汽管上的阀门节流会产生额外压降，下列阀门中，在抽汽管上使用时产生压降最小的是", "a": ["蝶阀", "闸阀", "截止阀", "球阀", "", ""], "r": "D", "e": "在流体管道系统中，阀门的形式多种多样，不同类型的阀门在流体通过时产生的压降也不同。蝶阀、闸阀、截止阀和球阀是常见的几种阀门类型。蝶阀的阀板在管道中旋转来开启或关闭通道，其结构使得流体通过时的阻力相对较大，因此会产生较大的压降。闸阀通过升降阀板来控制流体，当完全开启时，流体通过的通道较为宽敞，但在部分开启状态下，流体通过的路径会变得曲折，导致较大的压降。截止阀的阀瓣沿着流体通道的轴线移动来控制流体，其结构特点使得流体通过时需要改变方向，这增加了流体流动的阻力，从而产生较大的压降。球阀的球体在管道中旋转来开启或关闭通道，当球阀完全开启时，流体通过的通道是一个直径与管道相同的孔，这使得流体能够几乎无阻碍地通过，因此产生的压降最小。综上所述，球阀在抽汽管上使用时产生的压降最小。所以，正确答案是D.球阀。", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636611", "t": 1, "q": "抽汽管上设置节流阀的主要目的是调节抽汽量，但节流阀开度减小会导致抽汽管压降增大，此时下列参数变化正确的是（　）", "a": ["加热器的换热面积利用率降低", "加热器内蒸汽压力升高", "抽汽在节流后的焓值升高", "给水的温升增大", "", ""], "r": "A", "e": "A. 加热器的换热面积利用率降低<br />正确。当抽汽阀门开度减小时，节流效应导致进入加热器的蒸汽压力降低，对应的饱和温度也随之降低，传热温差减小，换热效果变差，导致加热器换热面积利用率降低 。<br />B. 加热器内蒸汽压力升高<br />错误。节流阀开度减小时，流通截面收窄，流体阻力增大，压降增大。根据节流阀的工作原理，阀门上游压力较高、下游压力较低 。因此，节流阀后的加热器内蒸汽压力会降低，而非升高。<br />C. 抽汽在节流后的焓值升高<br />错误。节流过程是典型的不可逆过程，但根据热力学第一定律，流体流经节流阀时，在绝热且不对外做功的情况下，其焓值保持不变（即等焓过程）。因此，节流后焓值不升高，而是基本不变。<br />D. 给水的温升增大<br />错误。节流阀开度减小导致进入加热器的蒸汽压力降低，饱和温度降低，传热温差减小，换热能力下降，导致给水被加热的程度下降，即给水出口温度降低 。因此，给水的温升（出口温度与进口温度之差）会减小，而非增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636612", "t": 1, "q": "抽汽管压降导致抽汽压力降低10%，若其他条件不变，该抽汽在加热器内的放热焓降会如何变化?", "a": ["减小，且减小幅度小于10%", "减小，且减小幅度大于10%", "基本不变", "增大10%", "", ""], "r": "A", "e": "抽汽管压降使抽汽压力降低，抽汽的饱和温度降低，在加热器内的放热焓降会减小。但由于蒸汽的焓值与压力并非线性关系，所以放热焓降减小幅度小于压力降低幅度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636613", "t": 1, "q": "抽汽管压降的大小与多个因素相关，下列因素中会导致抽汽管压降增大的是", "a": ["抽汽管道长度缩短", "管道内壁粗糙度降低", "抽汽流量增大", "抽汽管道直径增大", "", ""], "r": "C", "e": "抽汽管压降主要受流速、管道阻力等影响。抽汽流量增大，流速会加快，根据流体力学原理，阻力增加，导致压降增大。而管道长度缩短、内壁粗糙度降低、管道直径增大都会使管道阻力减小，压降降低。所以答案是C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636614", "t": 1, "q": "抽汽管压降增大时，若要维持加热器的设计出口水温，需采取的措施是?", "a": ["降低给水温度", "减小蒸汽流量", "增大蒸汽流量", "减小给水流量", "", ""], "r": "C", "e": "抽汽管压降增大，抽汽焓降减小，加热能力下降。要维持设计出口水温，就需增加加热量，增大蒸汽流量可增加加热量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636615", "t": 1, "q": "除氧器的\"自生沸腾\"现象会对其经济性产生什么影响?", "a": ["对经济性无影响，仅影响除氧器水位", "导致除氧器压力失控，增加热量损失，降低经济性", "使除氧效果显著提升，无需额外加热", "减少抽汽消耗，提高经济性", "", ""], "r": "B", "e": "除氧器“自生沸腾”时，蒸汽量过大使除氧器压力难以控制，额外热量损失增加，经济性降低。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636616", "t": 1, "q": "除氧器的排气量过大时，会导致?", "a": ["除氧效果显著提升，经济性提高", "热量和工质损失增加，经济性降低", "除氧器压力降低，除氧效果下降", "除氧器水位升高，疏水增多", "", ""], "r": "B", "e": "排气量过大意味着有更多蒸汽等工质排出，同时带走大量热量，造成热量和工质损失，会使经济性降低。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636617", "t": 1, "q": "高压加热器的上端差（加热器出口给水温度与蒸汽饱和温度的差值）增大，对机组热经济性的影响是（　）", "a": ["无影响，因为上端差不影响回热循环效率", "不确定，需结合下端差变化判断", "热经济性下降，因为蒸汽的有效放热量减少", "热经济性提升，因为给水加热温度更高", "", ""], "r": "C", "e": "上端差增大意味着蒸汽饱和温度与给水出口温度差值变大，蒸汽在加热器中放热量减少，有效放热量降低，热经济性下降。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636618", "t": 1, "q": "高压加热器的下端差（加热器进口给水温度与疏水出口温度的差值）过小（小于3℃），可能导致的问题是（　）", "a": ["蒸汽在加热器内冷凝过快，导致压力波动", "疏水过冷度大，增加下级加热器的热负荷", "疏水温度过高，导致疏水管道腐蚀加剧", "给水在加热器内流动阻力增大，能耗增加", "", ""], "r": "B", "e": "下端差过小意味着疏水出口温度接近进口给水温度，即疏水过冷度小，会使疏水温度高，高温疏水进入下级加热器会增加下级加热器热负荷。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636619", "t": 1, "q": "给水除氧中，热力除氧的核心原理是利用了气体在水中的溶解度随什么因素变化的特性?", "a": ["水中含盐量", "水的硬度", "水的pH值", "水的温度", "", ""], "r": "D", "e": "热力除氧是基于气体在水中溶解度随温度升高而降低的特性，将水加热使气体析出除氧。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636620", "t": 1, "q": "关于抽汽管压降对回热循环效率的影响，下列定量分析表述正确的是（假设其他参数不变）", "a": ["抽汽管压降对循环效率的影响与抽汽压力无关", "抽汽管压降仅影响低压回热循环，对高压回热循环无影响", "抽汽管压降每增加0.1MPa，循环效率提高0.5%", "抽汽管压降导致抽汽焓升越大，循环效率下降越多", "", ""], "r": "D", "e": "抽汽管压降使抽汽焓升高，会使蒸汽做功能力降低，抽汽焓升越大，循环效率下降越多。A选项，抽汽管压降对循环效率影响与抽汽压力有关；B选项，对高低压回热循环都有影响；C选项，抽汽管压降增加会使循环效率下降而非提高。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636621", "t": 1, "q": "关于抽汽管压降对汽轮机的影响，下列说法正确的是?", "a": ["抽汽管压降增大，汽轮机的发电功率会显著提升", "抽汽管压降对汽轮机内部工作过程无影响", "抽汽管压降增大，汽轮机抽汽级后的焓降会减小", "抽汽管压降增大，汽轮机的排汽温度会降低", "", ""], "r": "C", "e": "抽汽管压降是指在汽轮机抽汽过程中，蒸汽从高压级流向低压级时在管道中产生的压力损失。这个压降会影响汽轮机的热效率和性能。选项A错误，因为抽汽管压降增大意味着蒸汽在管道中的能量损失增加，这会导致汽轮机的发电功率下降，而不是提升。选项B错误，因为抽汽管压降会直接影响汽轮机的热效率和性能，进而影响汽轮机内部的工作过程。选项C正确，抽汽管压降增大意味着蒸汽在流动过程中的能量损失增加，这会导致抽汽级后的蒸汽焓值降低，从而减小焓降。选项D错误，抽汽管压降增大通常会导致汽轮机的排汽温度升高，因为蒸汽在流动过程中的能量损失增加，导致蒸汽在汽轮机末级的焓值升高。综上所述，正确答案是C：“抽汽管压降增大，汽轮机抽汽级后的焓降会减小”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636622", "t": 1, "q": "关于除氧器经济性分析，下列表述正确的是?", "a": ["除氧器采用滑压运行时，其热经济性始终优于定压运行", "除氧器的补水温度对其经济性无影响", "除氧器水位过高会增加疏水携带，降低热经济性", "除氧器工作压力越高，其除氧效果越好，经济性必然越高", "", ""], "r": "C", "e": "滑压运行在一定工况下热经济性才优于定压运行，A 错误；补水温度会影响除氧器经济性，B 错误；除氧器水位过高会使疏水携带增加，导致热量损失，降低热经济性，C 正确；工作压力高除氧效果不一定就好且经济性也未必高，D 错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636623", "t": 1, "q": "关于高压除氧器的经济性，下列说法正确的是?", "a": ["高压除氧器的补水温度要求低于大气式除氧器", "高压除氧器可利用高压抽汽，减少低压抽汽消耗，提高经济性", "高压除氧器的工作压力越高，经济性越好", "高压除氧器无需设置排气阀，减少热量损失", "", ""], "r": "B", "e": "高压除氧器能利用高压抽汽，让低压抽汽可更多用于发电，减少低压抽汽消耗，提高经济性。A项高压除氧器补水温度要求高；C项工作压力并非越高经济性就越好；D项高压除氧器需设排气阀排出气体。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636624", "t": 1, "q": "关于过热蒸汽冷却器（SC）的热经济性分析，下列说法错误的是?", "a": ["过热蒸汽冷却器可利用过热蒸汽的过热度加热给水", "过热蒸汽冷却器的换热端差过大时，其节能效果会减弱", "所有类型的回热系统都必须设置过热蒸汽冷却器才能提升经济性", "合理设置过热蒸汽冷却器能减少对低压抽汽的排挤", "", ""], "r": "C", "e": "并非所有回热系统都必须设置过热蒸汽冷却器才能提升经济性，有些系统不设置也可通过其他方式提升经济性。A选项，过热蒸汽冷却器确实可利用过热度加热给水；B选项，换热端差大节能效果减弱合理；D选项，合理设置能减少对低压抽汽排挤也是正确的。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636625", "t": 1, "q": "过热蒸汽冷却器（SC）常与高压加热器配合使用，其主要提升热经济性的原理是", "a": ["提高给水的过冷度，增加锅炉吸热量", "利用抽汽过热度加热给水，减少高参数抽汽被低参数抽汽的排挤损失", "降低高压加热器的散热损失", "减少抽汽管的节流损失", "", ""], "r": "B", "e": "过热蒸汽冷却器利用抽汽过热度加热给水，避免高参数抽汽被低参数抽汽排挤，提高热经济性。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636626", "t": 1, "q": "过热蒸汽冷却器（SC）的主要作用是利用过热蒸汽的过热度加热给水，下列哪种情况会使SC的热经济性提升效果最显著?", "a": ["机组负荷处于额定负荷的50%", "蒸汽过热度较小（小于20℃）", "SC的传热端差大于10℃", "给水温度与蒸汽饱和温度差值较大", "", ""], "r": "D", "e": "给水温度与蒸汽饱和温度差值大，意味着有更大的温差可利用过热蒸汽过热度加热给水，能使SC热经济性提升更显著。A选项机组负荷50%时工况并非最利于热经济性提升；B选项蒸汽过热度小可利用的热量少；C选项传热端差大不利于热量有效传递。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636627", "t": 1, "q": "过热蒸汽冷却器的换热端差若为负值（即冷却器出口给水温度高于蒸汽饱和温度），其原因可能是?", "a": ["给水流量过小", "冷却器结垢严重", "蒸汽流量过大", "冷却器内部存在泄漏，蒸汽直接混入给水", "", ""], "r": "D", "e": "当冷却器内部存在泄漏，蒸汽直接混入给水时，会使冷却器出口给水温度高于蒸汽饱和温度，导致换热端差为负。其他选项给水流量小、冷却器结垢、蒸汽流量大一般不会出现出口给水温度高于蒸汽饱和温度的情况。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636628", "t": 1, "q": "过热蒸汽冷却器的换热面积设计需匹配抽汽的过热度，若换热面积设计过大，会导致", "a": ["抽汽在冷却器内过度冷却，出现凝结，增加流动阻力", "抽汽过热度完全被利用，经济性达到最优", "排挤损失增大，循环效率下降", "给水加热温度过高，锅炉超温", "", ""], "r": "A", "e": "换热面积过大，抽汽会过度冷却，易出现凝结，凝结水会增加流动阻力。B项换热面积过大不一定经济性最优；C项题干未体现排挤损失；D项不一定会使锅炉超温。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636629", "t": 1, "q": "过热蒸汽冷却器的热经济性提升效果，主要取决于?", "a": ["蒸汽的过热度和冷却器的换热效率", "冷却器的材质", "给水的硬度", "加热器的数量", "", ""], "r": "A", "e": "过热蒸汽冷却器是利用蒸汽过热度加热给水，其热经济性提升效果与蒸汽过热度及冷却器换热效率直接相关，能有效利用过热度热量，提升经济性。而冷却器材质、给水硬度、加热器数量并非主要影响因素。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636630", "t": 1, "q": "过热蒸汽冷却器的热经济性提升效果与蒸汽过热度的关系是（　）", "a": ["过热度越小，提升效果越显著", "过热度与提升效果无关，仅与给水温度有关", "过热度越大，提升效果越显著", "过热度在50-80℃时提升效果最佳", "", ""], "r": "A", "e": "过热蒸汽冷却器的热经济性提升效果与蒸汽过热度的关系是一个涉及热力学原理的问题。简单来说，过热度是指蒸汽温度超过其饱和温度的程度。以下是对该问题的简要1. 过热度较小：当蒸汽过热度较小时，意味着蒸汽接近饱和状态，此时通过冷却器进行冷却，能够更有效地将蒸汽中的热量传递给给水，从而提高热经济性。2. 过热度较大：如果蒸汽过热度较大，蒸汽的温度较高，冷却过程中释放的热量相对较少，热经济性提升效果不明显。3. 过热度与给水温度的关系：虽然给水温度也会影响热经济性，但题目主要考察的是过热度的影响。综上所述，过热度越小，通过冷却器冷却后释放的热量越多，热经济性提升效果越显著。所以，正确答案是A选项：“过热度越小，提升效果越显著”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636631", "t": 1, "q": "过热蒸汽冷却器通常设置在高压加热器的哪个部位?", "a": ["加热器管束外侧，与疏水接触", "加热器蒸汽出口端，并联在蒸汽流程中", "加热器壳体顶部，与蒸汽进口直接连接", "加热器给水出口端，串联在给水流程中", "", ""], "r": "B", "e": "过热蒸汽冷却器的主要作用是利用高压加热器出口的过热蒸汽来预热进入加热器的给水，从而提高热效率。为了有效地实现这一功能，过热蒸汽冷却器需要设置在能够与高温蒸汽直接接触并且不影响蒸汽主要流程的位置。选项A描述的位置是与疏水接触，这不符合过热蒸汽冷却器的工作原理，因为疏水温度较低，不利于预热给水。选项B描述的位置是在加热器蒸汽出口端，并联在蒸汽流程中。这样的设置可以确保过热蒸汽冷却器能够接触到高温蒸汽，同时不影响蒸汽的主要流动路径，是合理的选择。选项C描述的位置是在加热器壳体顶部，与蒸汽进口直接连接。这可能会导致过热蒸汽在未经充分利用的情况下就进入下一级，降低热效率。选项D描述的位置是在加热器给水出口端，串联在给水流程中。这样的设置位置过低，无法有效利用高温蒸汽的热量。综上所述，过热蒸汽冷却器通常设置在高压加热器的蒸汽出口端，并联在蒸汽流程中，以便有效利用高温蒸汽预热给水。所以，正确答案是B选项：“加热器蒸汽出口端，并联在蒸汽流程中”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636632", "t": 1, "q": "加热器采用表面式换热时，若疏水冷却器未投运，会导致的主要问题是?", "a": ["加热器给水出口温度升高，降低热耗", "加热器疏水温度降低，增加下一级加热器的热负荷", "加热器壳体压力升高，影响设备安全", "加热器疏水温度升高，排挤下一级加热器的抽汽", "", ""], "r": "D", "e": "疏水冷却器未投运，疏水得不到进一步冷却，温度升高，会排挤下一级加热器的抽汽。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636633", "t": 1, "q": "加热器采用疏水逐级自流方式时，其主要缺点是?", "a": ["疏水温度过低，影响下一级加热器换热", "设备投资高，维护复杂", "疏水热量损失大，且排挤下一级抽汽", "需要额外消耗电能驱动疏水泵", "", ""], "r": "C", "e": "疏水逐级自流是疏水靠压力差流到下一级加热器，会使疏水热量损失大，还会排挤下一级抽汽。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636634", "t": 1, "q": "加热器的\"下端差\"（疏水端差）是指?", "a": ["加热器蒸汽饱和温度与给水出口温度的差值", "加热器蒸汽饱和温度与疏水温度的差值", "给水出口温度与疏水温度的差值", "加热器疏水温度与给水进口温度的差值", "", ""], "r": "D", "e": "下端差=疏水温度-给水进口温度（D对）；上端差=蒸汽饱和温度-给水出口温度（A错）；疏水冷却段端差=给水出口-疏水温度（C错）。选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800227453636635", "t": 1, "q": "加热器端差（上端差）过大时，对其经济性的影响主要是?", "a": ["加热器换热面积需求减少，设备投资降低", "会导致加热器出口给水温度低于设计值，增加低压抽汽消耗", "对给水加热无影响，仅增加疏水温度", "会提高加热器的换热效率，降低机组热耗", "", ""], "r": "B", "e": "上端差过大意味着加热器传热效果不佳，出口给水温度低于设计值，为达到要求给水温度就需增加低压抽汽消耗。A选项换热面积需求应增大；C选项对给水加热有影响；D选项会降低换热效率，增加机组热耗。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800228854534144", "t": 2, "q": "抽汽管压降会引发一系列连锁反应，下列属于抽汽管压降导致的连锁影响的有（　）", "a": ["锅炉的蒸
