<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>华电-能源动力类</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--pri:#1a6dff;--ok:#0a9f5b;--bad:#e0483c;--tx:#1d2129;--sub:#86909c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid #e9ecf1;padding:10px 14px;display:flex;align-items:center;gap:10px}
  header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{border:0;background:#eef2f8;color:#2b3648;border-radius:10px;padding:8px 12px;font-size:14px}
  .btn.primary{background:var(--pri);color:#fff}
  main{padding:12px;max-width:820px;margin:0 auto}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:#fff;border-radius:12px;padding:10px 12px;text-align:center}
  .stat b{display:block;font-size:20px}
  .stat span{color:var(--sub);font-size:12px}
  .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .modes button{padding:12px 6px;border-radius:12px;border:0;background:#fff;font-size:14px;color:#2b3648}
  .modes button.warn{color:var(--bad)}
  .ch{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f0f2f5}
  .ch:last-child{border-bottom:0}
  .ch .t{flex:1;min-width:0}
  .ch .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .t span{color:var(--sub);font-size:12px}
  .bar{height:4px;background:#eef1f5;border-radius:2px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--pri)}
  .qhead{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
  .tag{font-style:normal;display:inline-block;border-radius:6px;padding:1px 7px;margin-right:8px;font-size:12px;color:#fff;background:#8a94a6;vertical-align:1px}
  .tag.t1{background:#1a6dff}.tag.t2{background:#f08c00}.tag.t3{background:#0a9f5b}
  .hint{margin-top:12px;font-size:13px;color:#8a6d3b;background:#fff8e6;border-radius:10px;padding:8px 12px}
  .btn.wide{display:block;width:100%;margin-top:14px;padding:13px;font-size:16px}
  .title{font-size:16px;line-height:1.8;word-break:break-word}
  .title img,.opt img,.ana img{max-width:100%!important;height:auto!important;vertical-align:middle}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#f7f9fc;border:1px solid #e9edf4;border-radius:12px;padding:12px;margin-top:10px;font-size:15px;color:var(--tx);line-height:1.7}
  .opt .lab{flex:0 0 22px;height:22px;border-radius:50%;background:#dfe5ee;color:#5b6577;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .opt .cnt{flex:1;min-width:0;word-break:break-word}
  .opt.sel{border-color:var(--pri)}
  .opt.right{background:#eaf8f1;border-color:#9fdcbd}
  .opt.right .lab{background:var(--ok);color:#fff}
  .opt.wrong{background:#fdeeec;border-color:#f3b8b1}
  .opt.wrong .lab{background:var(--bad);color:#fff}
  .ana{margin-top:12px;background:#f2f7ff;border-radius:12px;padding:12px;font-size:14px;color:#33405a;display:none}
  .ana b{color:var(--ok)}
  .nav{display:flex;gap:10px;margin-top:14px}
  .nav .btn{flex:1;padding:12px}
  .star{background:none;border:0;font-size:20px;color:#c9ced8;padding:0 4px}
  .star.on{color:#ffb020}
  .empty{color:var(--sub);text-align:center;padding:40px 0}
  .pill{display:inline-block;background:#eef2f8;color:#5b6577;border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:rgba(29,33,41,.9);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <button class="btn" id="back" style="display:none">‹ 返回</button>
  <h1 id="hTitle">珞研刷题</h1>
  <button class="star" id="star" style="display:none">★</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
const DATA = {"id": "yw2033827066163630080", "name": "华电-能源动力类", "chapters": [{"k": "基础练习题【含解析】||第1章 工程热力学与流体力学（1）", "n": "基础练习题【含解析】 / 第1章 工程热力学与流体力学（1）", "qs": [{"id": "2034800182717190144", "t": 1, "q": "管路水力计算中，并联管路的特性有（　）", "a": ["总流量等于各支管流量之和", "各支管的流速相等", "各支管的管径必须相等", "总水头损失等于各支管水头损失的最大值", "", ""], "r": "A", "e": "并联管路中，总流量等于各支管流量之和，且各支管水头损失相等。B选项各支管流速不一定相等，C选项各支管管径也不一定相等，D选项总水头损失等于各支管水头损失，并非最大值。答案：A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190145", "t": 1, "q": "理想气体的比热容比k（k=c_p/c_v）与下列因素有关的有（　）?", "a": ["气体的质量", "气体的压力", "气体的种类", "气体的温度", "", ""], "r": "C", "e": "比热容比k只与气体分子结构有关，即与气体种类有关，和气体质量、压力、温度无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190146", "t": 1, "q": "流体粘性产生的主要原因有（　）?", "a": ["流体的表面张力", "液体分子间的内聚力", "流体的重力作用", "流体的压力差", "", ""], "r": "B", "e": "流体粘性源于分子间内聚力和分子不规则热运动时的动量交换。本题问主要原因，液体分子间内聚力是关键。A选项表面张力与粘性无关；C选项重力作用不产生粘性；D选项压力差也不是粘性产生主因。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190147", "t": 1, "q": "热力学第一定律在稳定流动开口系统中的正确表达式有（　）?", "a": ["ΣH1+Q=ΣH2+W（H为焓，Q为吸热量，W为对外做功）", "p v=R T（理想气体状态方程）", "q=Δu+w（闭口系统表达式）", "Δs=q/T（可逆过程熵变公式）", "", ""], "r": "A", "e": "本题可根据热力学第一定律在稳定流动开口系统中的表达式来逐一分析选项。### 选项A对于稳定流动开口系统，热力学第一定律的表达式为：进入系统的能量等于离开系统的能量。进入系统的能量包括流入工质的焓和系统吸收的热量，离开系统的能量包括流出工质的焓和系统对外做的功。即「test/yiwen_img/importSubject/2034800178791321600.png」，所以选项A正确。### 选项BpV = RT是理想气体状态方程，它描述的是理想气体状态参数之间的关系，并非热力学第一定律在稳定流动开口系统中的表达式，所以选项B错误。 ### 选项C「test/yiwen_img/importSubject/2034800179080728576.png」是热力学第一定律在闭口系统中的表达式，不是稳定流动开口系统的表达式，所以选项C错误。### 选项D「test/yiwen_img/importSubject/2034800179135254528.png」是可逆过程熵变公式，与热力学第一定律在稳定流动开口系统中的表达式无关，所以选项D错误。综上，答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190148", "t": 1, "q": "并联管路水力计算中，各支管的（　）?", "a": ["水头损失相等，总流量等于各支管流量之和", "水头损失不等，总流量等于各支管流量最大值", "水头损失不等，总流量等于各支管流量之和", "水头损失相等，总流量等于各支管流量平均值", "", ""], "r": "A", "e": "并联管路中，各支管的水头损失相等，总流量等于各支管流量之和。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190149", "t": 1, "q": "串联管路水力计算中，各管段的（　）?", "a": ["流量相等，总水头损失等于各段之和", "流量不等，总水头损失等于各段之和", "流量相等，总水头损失等于各段平均值", "流量不等，总水头损失等于各段最大值", "", ""], "r": "A", "e": "串联管路中，各管段无分流汇流时流量相等，总水头损失是各管段水头损失累加。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190150", "t": 1, "q": "对于闭口系的绝热过程，下列关系式一定成立的是（　）", "a": ["ΔH=0", "Q=0", "W=ΔU", "ΔS=0", "", ""], "r": "B", "e": "绝热过程定义就是与外界无热量交换，即Q = 0；A选项，绝热过程ΔH不一定为0；C选项，只有绝热且无其他功时W = ΔU；D选项，绝热不可逆过程ΔS＞0。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190151", "t": 1, "q": "对于闭口系的理想气体定容过程，下列关于热量与热力学能变化关系的表述正确的是（　）", "a": ["Q=ΔU（Q为热量，ΔU为热力学能变化）", "Q=ΔH（ΔH为焓变）", "Q=W（W为体积功）", "Q=0", "", ""], "r": "A", "e": "理想气体定容过程中，体积不变，体积功W = 0。根据热力学第一定律「test/yiwen_img/importSubject/2034800179189780480.png」，此时W = 0，所以「test/yiwen_img/importSubject/2034800179248500736.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190152", "t": 1, "q": "对于热力系统的可逆过程，下列表述正确的是（　）", "a": ["过程的熵产大于零", "过程可以反向进行且不留任何痕迹", "过程中系统与外界的温差无限大", "过程中系统与外界的压差无限小", "", ""], "r": "B", "e": "可逆过程是指系统可以反向进行且不留下任何痕迹的过程。熵产大于零是不可逆过程的特征；可逆过程要求系统与外界温差、压差无限小。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190153", "t": 1, "q": "对于湿蒸汽，其干度x的定义为（　）", "a": ["饱和水的体积与湿蒸汽总体积之比", "饱和水的质量与湿蒸汽总质量之比", "干饱和蒸汽的体积与湿蒸汽总体积之比", "干饱和蒸汽的质量与湿蒸汽总质量之比", "", ""], "r": "D", "e": "湿蒸汽干度 x 的定义：湿蒸汽中干饱和蒸汽的质量占湿蒸汽总质量的百分比。<br />A、C 错误，干度是质量比值，不是体积比值。B 是湿度，不是干度。因此选 D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190154", "t": 1, "q": "对于制冷循环，若环境温度不变，当制冷对象温度降低时，循环的制冷系数ε的变化趋势是（　）", "a": ["减小，因为实现低温制冷需消耗更多功", "增大，因为低温热源温度降低更显著", "先增大后减小，存在最优温度点", "不变，因为制冷系数仅与环境温度有关", "", ""], "r": "A", "e": "制冷系数ε=Q₂/W，环境温度不变，制冷对象温度降低，意味着从低温热源吸热更困难，要消耗更多功才能实现制冷，Q₂相对变化小，W增大，所以ε减小。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190155", "t": 1, "q": "关于理想气体的熵变计算，下列公式正确的是（定容过程）?", "a": ["Δs=c_v ln(T2/T1)", "Δs=c_p ln(T2/T1)", "Δs=c_p ln(T2/T1)+R_g ln(p1/p2)", "Δs=c_v ln(T2/T1)+R_g ln(v2/v1)", "", ""], "r": "A", "e": "定容过程体积不变，即「test/yiwen_img/importSubject/2034800179298832384.png」，理想气体熵变公式「test/yiwen_img/importSubject/2034800179344969728.png」中「test/yiwen_img/importSubject/2034800179386912768.png」，此时「test/yiwen_img/importSubject/2034800179454021632.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190156", "t": 1, "q": "关于热力系统的熵，下列说法正确的是（　）?", "a": ["孤立系统的熵永不减小", "系统的熵减小，一定是因为放出了热量", "可逆过程中系统的熵一定不变", "系统的熵增大，一定是因为吸收了热量", "", ""], "r": "A", "e": "根据热力学第二定律，孤立系统的熵永不减小，A正确；系统熵减小可能有多种原因，不只是放热，B错误；可逆绝热过程系统熵不变，一般可逆过程熵可能变化，C错误；系统熵增大也可能是其他不可逆因素导致，不只是吸收热量，D错误。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190157", "t": 1, "q": "关于热力学第一定律的表达式，下列说法正确的是（适用于任意热力过程的闭口系统）?", "a": ["q=Δh+w_t（w_t为技术功，外界对系统做功）", "q=Δh+w_t（w_t为技术功，系统对外做功）", "q=Δu+w（w为外界对系统做功）", "q=Δu+w（w为系统对外界做功）", "", ""], "r": "D", "e": "热力学第一定律用于闭口系统（即无物质穿过边界的系统）的普遍表达式为：q = Δu + w，其中 q 为系统吸收的热量，Δu 为系统热力学能的变化，w 为系统对外界所做的功。这一表达式适用于任意热力过程的闭口系统。选项A和B中的表达式 q = Δh + w_t 适用于开口系统（稳定流动系统），而非闭口系统；选项C中 w 被定义为“外界对系统做功”，与闭口系统第一定律表达式中 w 的定义（系统对外界做功）相反，且符号约定不同，故不正确。因此，正确答案为D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190158", "t": 1, "q": "关于蒸汽动力循环的实际循环与理论朗肯循环的区别，下列说法错误的是（　）?", "a": ["实际汽轮机内膨胀过程为不可逆过程，熵增大", "实际水泵消耗的功大于理论功", "实际循环中锅炉有散热损失，吸热温度低于理论值", "实际循环的热效率高于理论朗肯循环", "", ""], "r": "D", "e": "实际循环存在各种不可逆因素，如汽轮机不可逆膨胀、水泵额外损耗、锅炉散热等，这些都会使实际循环热效率低于理论朗肯循环。所以D选项说法错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190159", "t": 1, "q": "静止流体中，某点的绝对压力为150kPa，当地大气压为101kPa，则该点的相对压力为（　）?", "a": ["-49kPa", "251kPa", "150kPa", "49kPa", "", ""], "r": "D", "e": "相对压力=绝对压力 - 当地大气压。本题中绝对压力150kPa，当地大气压101kPa，150 - 101 = 49kPa。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190160", "t": 1, "q": "朗肯循环中，汽轮机的理想工作过程为（　）", "a": ["可逆绝热膨胀过程", "不可逆绝热膨胀过程", "定压膨胀过程", "定温膨胀过程", "", ""], "r": "A", "e": "朗肯循环中，汽轮机内蒸汽膨胀作功，理想情况无能量损失，是可逆绝热膨胀过程。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190161", "t": 1, "q": "朗肯循环中，若将汽轮机的排汽压力降低，其他参数不变，则循环的净功Wnet会（　）", "a": ["不变", "无法确定", "减小", "增大", "", ""], "r": "D", "e": "排汽压力降低，汽轮机膨胀做功增加，而水泵耗功不变，所以循环净功增大。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190162", "t": 1, "q": "朗肯循环中，水泵消耗的功相对于汽轮机输出的功来说（　）?", "a": ["无法确定", "很小，通常可忽略", "很大，不可忽略", "两者相等", "", ""], "r": "B", "e": "在朗肯循环里，水泵主要是对水进行升压，水是不可压缩流体，升压所需功小；而汽轮机是蒸汽膨胀做功，输出功大。所以水泵消耗的功相对汽轮机输出功很小，常可忽略。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190163", "t": 1, "q": "朗肯循环中，蒸汽在汽轮机内的膨胀过程可近似为（　）?", "a": ["定温放热过程", "定熵膨胀过程", "定压吸热过程", "定容放热过程", "", ""], "r": "B", "e": "朗肯循环里，蒸汽在汽轮机内膨胀是理想绝热过程，可近似为定熵过程。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190164", "t": 1, "q": "理想气体的比热容与下列哪个因素无关（　）", "a": ["气体的温度", "气体的种类", "过程的性质（定压或定容）", "气体的压力", "", ""], "r": "D", "e": "理想气体的比热容，对于确定种类的理想气体，定压比热容、定容比热容主要受温度影响，与压力无关。<br />A 选项，理想气体比热容是温度的函数，温度变化，比热容会改变。<br />B 选项，不同种类气体（单原子、双原子气体）比热容数值不同。<br />C 选项，定压比热容cp、定容比热容cv不相等，和过程性质有关。<br />D 选项，理想气体分子间无相互作用力，压力改变不会影响比热容，因此和压力无关。", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190165", "t": 1, "q": "理想气体的定温过程中，下列参数保持不变的是（　）", "a": ["熵", "压力", "焓", "内能", "", ""], "r": "D", "e": "理想气体的定温过程是指在温度保持不变的情况下发生的过程。根据热力学的基本原理，我们可以分析各个选项：A. 熵：在定温过程中，理想气体的熵可能会发生变化，特别是在有热量交换的情况下。B. 压力：定温过程中，理想气体的压力是可以变化的，例如在等容加热或冷却过程中，压力会相应变化。C. 焓：焓是热力学能加上压力体积功，对于理想气体而言，在定温过程中，如果系统对外做功或者外界对系统做功，焓是会变化的。D. 内能：理想气体的内能仅取决于其温度。在定温过程中，温度保持不变，因此内能也保持不变。综上所述，定温过程中唯一保持不变的参数是内能。所以，正确答案是D选项：“内能”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190166", "t": 1, "q": "理想气体的内能仅取决于（　）", "a": ["温度和压力", "体积", "压力", "温度", "", ""], "r": "D", "e": "理想气体内能是所有分子热运动动能和分子间势能总和，分子间无相互作用，势能为零，内能只与分子热运动动能有关，而温度是分子平均动能标志，所以理想气体内能仅取决于温度。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190167", "t": 1, "q": "理想气体定温过程中，下列参数变化正确的是（　）?", "a": ["内能Δu≠0", "焓Δh≠0", "熵Δs≠0", "热量q=0", "", ""], "r": "C", "e": "理想气体定温过程，内能和焓只与温度有关，温度不变则Δu = 0、Δh = 0；定温过程有热量交换，q≠0；定温过程中气体状态改变，熵变Δs≠0。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190168", "t": 1, "q": "理想气体经历定压压缩过程，若压力不变，体积减小，则其温度会（　）", "a": ["降低", "升高", "不变", "无法确定", "", ""], "r": "A", "e": "根据理想气体状态方程pV = nRT，压力p不变，体积V减小，物质的量n和常数R不变，则温度T降低。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190169", "t": 1, "q": "理想气体经历某多变过程，其多变指数n=1.4，该过程的特点是（　）", "a": ["定容过程，功的变化为零", "定压过程，热量变化与温度变化成正比", "定温过程，内能变化为零", "多变过程，既非定容、定压、也非定温或定熵", "", ""], "r": "D", "e": "定容过程n趋于无穷，定压过程n = 0，定温过程n = 1，定熵过程n = k（理想气体k = 1.4），本题n = 1.4是定熵，属于多变过程，不是定容、定压、定温。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190170", "t": 1, "q": "理想气体经历某多变过程，已知多变指数n=1.4，该过程最可能是（　）?", "a": ["定压过程（n=0）", "定温过程（n=1）", "定熵过程（n=k，理想气体k≈1.4）", "定容过程（n→∞）", "", ""], "r": "C", "e": "多变指数n = 1.4，理想气体绝热指数k≈1.4，而定熵过程就是绝热可逆过程，其多变指数n = k 。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190171", "t": 1, "q": "量纲分析中，π定理的核心作用是（　）", "a": ["将物理量组合成无量纲π数，减少变量个数", "直接计算流动参数的具体数值", "验证流体运动方程的正确性", "判断流体流动的流态（层流或湍流）", "", ""], "r": "A", "e": "π定理可把物理量组合成无量纲π数，从而减少变量个数。B项不能直接计算具体数值；C项不是其核心作用；D项判断流态用雷诺数等，不是π定理核心作用。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190172", "t": 1, "q": "流体的伯努利方程p/ρg+v²/(2g)+z=常数，适用条件不包括（　）?", "a": ["定常流动", "任意流动（包括有旋流动）", "理想流体", "不可压缩流体", "", ""], "r": "B", "e": "伯努利方程适用于定常、理想、不可压缩且无旋流动。有旋流动不适用，所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190173", "t": 1, "q": "流体的动力粘度μ与运动粘度ν的关系是（　）?", "a": ["ν=ρ/μ", "ν=μρ", "ν=μ/ρ", "ν=1/(μρ)", "", ""], "r": "C", "e": "根据运动粘度和动力粘度的定义，运动粘度ν等于动力粘度μ除以流体密度ρ，即ν = μ/ρ。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190174", "t": 1, "q": "流体静力学基本方程的适用条件是（　）", "a": ["静止的、连通的、不同种不可压缩流体", "静止的、不连通的、同一种不可压缩流体", "静止的、连通的、同一种不可压缩流体", "流动的、连通的、同一种不可压缩流体", "", ""], "r": "C", "e": "流体静力学基本方程适用于静止、连通且为同一种不可压缩流体的情况。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190175", "t": 1, "q": "流体静力学基本方程p = p0 + ρgh的适用条件不包括（　）", "a": ["流体为不可压缩流体", "流体处于定常流动状态", "流体为均质流体", "流体处于静止状态", "", ""], "r": "B", "e": "流体静力学基本方程适用于静止、不可压缩、均质流体，与是否定常流动无关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190176", "t": 1, "q": "流体静力学基本方程p=p0+ρgh的适用条件是（　）?", "a": ["定常流动的流体", "任意运动的流体", "任意静止流体（包括不同种流体）", "静止或相对静止的同种连续流体", "", ""], "r": "D", "e": "流体静力学基本方程推导前提是静止或相对静止的同种连续流体。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190177", "t": 1, "q": "流体静压力的测量中，U型管压差计的读数h与被测压力差Δp的关系为（　）（ρ1为被测流体密度，ρ2为压差计工作流体密度）", "a": ["Δp=ρ1gh", "Δp=(ρ1-ρ2)gh", "Δp=ρ2gh", "Δp=(ρ2-ρ1)gh", "", ""], "r": "D", "e": "U 型管压差计，一侧为被测流体（密度 ρ₁），指示工作流体密度 ρ₂，ρ₂＞ρ₁。压差计算公式：Δp=(ρ₂-ρ₁) gh。<br />A 仅考虑指示液体，忽略被测流体；B 公式符号颠倒；C 没有考虑被测流体的影响。因此选 D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190178", "t": 1, "q": "流体运动的雷诺数Re的计算公式为（　）（v为流速，d为特征长度，μ为动力黏度，ν为运动黏度）", "a": ["Re=vd/ν", "Re=ν/(vd)", "Re=μ/(vd)", "Re=vdμ", "", ""], "r": "A", "e": "雷诺数Re的定义式是Re = 惯性力/黏性力，其表达式为Re = vd/ν 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190179", "t": 1, "q": "流体运动学中，迹线与流线的区别在于（　）", "a": ["迹线是同一时刻不同流体质点的速度方向线，流线是同一流体质点在不同时刻的运动轨迹", "非定常流动中，迹线与流线一定不重合", "迹线是同一流体质点在不同时刻的运动轨迹，流线是同一时刻不同流体质点的速度方向线", "定常流动中，迹线与流线重合", "", ""], "r": "C", "e": "迹线定义是同一流体质点在不同时刻的运动轨迹，流线定义是同一时刻不同流体质点的速度方向线；定常流动时迹线和流线重合，非定常流中可能重合。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190180", "t": 1, "q": "流体运动中，流线与迹线重合的条件是（　）?", "a": ["湍流流动", "层流流动", "非定常流动", "定常流动", "", ""], "r": "D", "e": "定常流动时，流场中各点的流速不随时间变化，流线形状不随时间改变，此时流线与迹线重合。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800182717190181", "t": 1, "q": "流体在管内流动时，局部水头损失产生的主要原因是（　）", "a": ["流体分子间的内摩擦力", "流体与管壁间的摩擦力", "流动断面突然变化导致的流体分离和漩涡", "流体的重力作用", "", ""], "r": "C", "e": "局部水头损失是流体流经局部阻碍（如管道突然扩大、缩小等）时，因流动断面突然变化导致流体分离和形成漩涡，造成能量损失。A选项分子间内摩擦力主要引起沿程水头损失；B选项流体与管壁摩擦力也是引起沿程水头损失；D选项流体重力作用与局部水头损失无关。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447808", "t": 2, "q": "并联管路的水力特性包括（　）?", "a": ["各支管的流速相等", "各支管的水头损失相等", "总流量等于各支管流量之和", "总阻抗等于各支管阻抗之和", "", ""], "r": "BC", "e": "并联管路各支管水头损失相等，总流量等于各支管流量之和。各支管流速不一定相等，总阻抗的倒数等于各支管阻抗倒数之和。所以答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447809", "t": 2, "q": "孤立系统的特点包括（　）?", "a": ["与外界无物质交换", "与外界有物质交换", "系统的熵值永不减小", "与外界有热量交换", "", ""], "r": "AC", "e": "孤立系统与外界既无物质交换也无能量（热量等）交换，根据熵增原理，孤立系统熵值永不减小。A符合孤立系统无物质交换特点，C符合熵值特性。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447810", "t": 2, "q": "关于管路并联的水力特性，下列说法正确的有（　）", "a": ["各并联管段的直径一定相等", "各并联管段的水头损失相等", "总阻抗的倒数等于各管段阻抗倒数之和", "总流量等于各并联管段流量之和", "", ""], "r": "BCD", "e": "管路并联时，各管段水头损失相等，总流量等于各并联管段流量之和，总阻抗的倒数等于各管段阻抗倒数之和；并联管段直径不一定相等。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447811", "t": 2, "q": "关于管路水力计算中的串联管路，下列说法正确的有（　）", "a": ["总流量等于各管段流量之和", "各管段的流量相等", "总水头损失等于各管段水头损失之和", "总阻抗等于各管段阻抗之和", "", ""], "r": "BCD", "e": "串联管路特点：各管段流量相等；总水头损失等于各管段水头损失之和；总阻抗等于各管段阻抗之和。A选项总流量等于各管段流量之和错误，串联管路各管段流量是相等的。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447812", "t": 2, "q": "关于流动阻力系数λ的说法正确的有（　）", "a": ["层流时，λ仅与雷诺数Re有关，与管壁粗糙度无关", "完全湍流区（阻力平方区），λ仅与Δ/d有关，与Re无关", "湍流时，λ与Re和管壁相对粗糙度Δ/d均有关", "λ可通过莫迪图查得", "", ""], "r": "ABCD", "e": "本题可根据流动阻力系数λ在不同流态下的影响因素以及获取方式来判断各选项的正确性。### 选项A层流时，流体的流动状态主要由雷诺数Re决定，此时流动阻力主要是流体的黏性力，与管壁粗糙度无关，λ仅与雷诺数Re有关，该选项正确。### 选项B在完全湍流区（阻力平方区），流体的流动阻力主要由管壁的粗糙度决定，此时λ仅与管壁相对粗糙度Δ/d有关，与雷诺数Re无关，该选项正确。 ### 选项C湍流时，流体的流动状态较为复杂，流动阻力既与雷诺数Re有关，也与管壁相对粗糙度Δ/d有关，该选项正确。### 选项D莫迪图是一种用于确定流动阻力系数λ的图表，它综合考虑了雷诺数Re和管壁相对粗糙度Δ/d等因素，可以通过莫迪图查得λ的值，该选项正确。综上，ABCD四个选项的说法均正确，答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447813", "t": 2, "q": "关于流体绕流物体的流动，下列说法正确的有（　）", "a": ["绕流阻力包括摩擦阻力和压差阻力", "雷诺数较小时，流动为层流，边界层较薄", "雷诺数较大时，流动为湍流，边界层较厚", "边界层分离会产生漩涡，增加阻力损失", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447814", "t": 2, "q": "关于流体运动迹线的说法，正确的有（　）?", "a": ["不随时间变化", "采用拉格朗日法描述流体运动时得到迹线", "是同一时刻不同流体质点组成的曲线", "是随时间变化的曲线", "", ""], "r": "BD", "e": "这是一道关于流体运动迹线性质的选择题。我们可以从以下几个方面进行简要分析：1. 迹线的定义：流体运动迹线是指在流场中，某一质点在不同时刻所经过的路径线。它反映了质点随时间的运动轨迹。2. 迹线与时间的关系： A选项“不随时间变化”：错误。因为迹线表示的是质点在不同时刻的位置，显然会随时间而变化。 D选项“是随时间变化的曲线”：正确。如上所述，迹线反映质点随时间的运动轨迹，因此是随时间变化的。3. 迹线与拉格朗日法的关系： B选项“采用拉格朗日法描述流体运动时得到迹线”：正确。拉格朗日法是以流体质点为研究对象，跟踪每一个流体质点的运动轨迹，所得到的就是迹线。4. 迹线的组成： C选项“是同一时刻不同流体质点组成的曲线”：错误。这是流线的定义，而非迹线。流线是在某一特定时刻，流场中一条假想的曲线，其上每一点的切线方向都与该点的速度方向一致，且流线上各流体质点的速度大小可以不同。而迹线是单个质点随时间运动的轨迹。综上所述，正确答案是BD。所以，这道题的正确选项是B和D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447815", "t": 2, "q": "关于热泵循环的应用，下列说法正确的有（　）", "a": ["供热系数εh始终大于1", "冬季可用于建筑物供暖", "夏季可切换为制冷循环用于降温", "需消耗外界功才能实现从低温到高温的传热", "", ""], "r": "ABCD", "e": "热泵供热系数是供热量与消耗功的比值，因供热量大于消耗功所以εh始终大于1；冬季热泵可从低温环境吸热向建筑物供暖；夏季能切换为制冷循环降温；热泵依靠消耗外界功实现从低温到高温传热。ABCD说法都正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447816", "t": 2, "q": "关于热力系统的分类，下列说法正确的有（　）", "a": ["开口系一定有物质穿过边界", "按系统与外界的能量交换，分为绝热系和非绝热系", "按系统与外界的物质交换，分为闭口系和开口系", "绝热系一定没有热量交换，但可以有功交换", "", ""], "r": "ABCD", "e": "A 选项，开口系（控制体）的定义就是存在物质穿过边界的热力系统，表述正确。<br />B 选项，依据系统和外界之间热量交换情况划分，分为绝热系（无热量交换）与非绝热系（存在热量交换），表述正确。<br />C 选项，按照系统和外界之间物质交换划分：闭口系无物质交换，开口系存在物质交换，表述正确。<br />D 选项，绝热系定义为系统和外界之间没有热量交换，允许有功量交换，例如绝热压缩过程，表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447817", "t": 2, "q": "关于热力学第二定律的克劳修斯表述，下列说法正确的有（　）", "a": ["克劳修斯表述揭示了热传递的方向性", "制冷循环不违反克劳修斯表述", "克劳修斯表述为\"不可能将热从低温物体传向高温物体而不引起其他变化\"", "克劳修斯表述与开尔文表述等价", "", ""], "r": "ABCD", "e": "克劳修斯表述指出热传递有方向性，即不能自发地从低温传向高温，制冷循环消耗电能实现热从低温到高温传递不违反该表述，其标准表述就是“不可能将热从低温物体传向高温物体而不引起其他变化”，且它与开尔文表述等价。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447818", "t": 2, "q": "关于热力循环的热效率ηt，下列说法正确的有（　）", "a": ["制冷循环也用ηt评价性能", "ηt=Wnet/Q1（Wnet为循环净功，Q1为从高温热源吸热）", "可逆循环的ηt一定大于不可逆循环的ηt（相同热源）", "ηt恒小于1", "", ""], "r": "BCD", "e": "热力循环的热效率ηt是衡量循环性能的一个重要指标，它表示的是循环中转换为有用功的热量与输入的热量之比。A选项：制冷循环通常使用性能系数COP来评价性能，而不是热效率ηt。因此，A选项错误。B选项：ηt=Wnet/Q1，这是热效率的定义式，其中Wnet代表循环净功，Q1代表从高温热源吸收的热量。这个描述是准确的，所以B选项正确。C选项：在相同的热源条件下，可逆循环的热效率是最高的，不可逆循环由于存在各种损失，其热效率一定低于可逆循环。因此，C选项正确。D选项：热效率ηt表示的是有用功与输入热量的比值，由于循环中总会有一部分热量损失，无法全部转换为有用功，所以ηt恒小于1。这个描述也是准确的，D选项正确。综上所述，正确答案是BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447819", "t": 2, "q": "关于水蒸气的定压加热过程，下列说法正确的有（　）", "a": ["过冷水定压加热到饱和水阶段，比体积变化极小", "从过冷水到饱和水阶段，温度逐渐升高", "干饱和蒸汽定压加热为过热蒸汽时，温度升高", "定压加热过程中，焓值始终增加", "", ""], "r": "ABCD", "e": "A 选项，过冷水（未饱和水）定压加热至饱和水，液体可压缩性很小，比体积变化极小，表述正确。<br />B 选项，过冷水定压加热，温度持续上升，直到达到饱和温度，变为饱和水，表述正确。<br />C 选项，干饱和蒸汽继续定压加热，变为过热蒸汽，温度高于该压力下饱和温度，温度升高，表述正确。<br />D 选项，定压加热过程持续向工质输入热量，水蒸气的焓不断增大，焓值始终增加，表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447820", "t": 2, "q": "关于水蒸气的临界状态，下列说法正确的有（　）", "a": ["临界温度Tc是水蒸气能够液化的最高温度", "临界状态下，水蒸气不能区分饱和水和干饱和蒸汽", "临界压力pc是水蒸气能够液化的最高压力", "临界状态下，饱和水与干饱和蒸汽的参数（v、h、s）相同", "", ""], "r": "ABD", "e": "临界温度是可液化最高温度，临界状态饱和水与干饱和蒸汽界限消失，各参数 v、h、s 相等；临界压力是对应临界温度下的饱和压力，不是液化最高压力，C 错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447821", "t": 2, "q": "关于圆管内流体流动沿程水头损失计算公式（达西-魏斯巴赫公式h_f=λ(l/d)(v²/(2g))），正确的说法有（　）?", "a": ["h_f与流体流速v的平方成正比", "l为管道长度", "λ与管道相对粗糙度和雷诺数有关，而非直接与管道长度l相关", "d为管道内径", "", ""], "r": "ABCD", "e": "A. h_f 与流体流速 v 的平方成正比 — 正确。达西-魏斯巴赫公式明确显示，沿程水头损失 h_f 与平均流速的平方（v²）成正比。公式中 v² 位于分子位置，流速增加一倍，水头损失将增至四倍。<br />B. l 为管道长度 — 正确。公式中 l 代表管道长度（单位：m），沿程阻力均匀分布在整个均匀流段上，与管段长度成正比。<br />C. λ 与管道相对粗糙度和雷诺数有关，而非直接与管道长度 l 相关 — 正确。沿程阻力系数 λ（亦称摩擦因子 f）是无量纲系数，主要取决于流体的黏度、雷诺数 Re 以及管道壁面的相对粗糙度（ε/d）。层流时 λ=64/Re；湍流时，λ 通过穆迪图或科尔布鲁克-怀特方程等确定，其核心变量是雷诺数与相对粗糙度，而非管道长度。<br />D. d 为管道内径 — 正确。公式中 d 为管道内径（单位：m），适用于截面为圆形的管路。", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447823", "t": 2, "q": "朗肯循环的主要组成设备有（　）?", "a": ["汽轮机", "水泵", "锅炉", "凝汽器", "", ""], "r": "ABCD", "e": "朗肯循环是基本蒸汽动力循环，主要由锅炉、汽轮机、凝汽器和水泵四个设备组成。ABCD四个选项均是朗肯循环主要组成设备。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447824", "t": 2, "q": "朗肯循环中提高蒸汽初温度的好处有（　）?", "a": ["降低汽轮机输出功率", "降低汽轮机排汽湿度", "减少水泵功耗", "提高循环热效率", "", ""], "r": "BD", "e": "朗肯循环提高蒸汽初温度，能使蒸汽在汽轮机中膨胀做功更充分，排汽湿度降低，且可提高循环热效率。A选项提高初温会增加汽轮机输出功率；C选项水泵功耗主要与水的参数和流量等有关，和蒸汽初温关系不大。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447825", "t": 2, "q": "理想气体的基本状态参数包括（　）（　）", "a": ["比体积v", "温度T", "比内能u", "比焓h", "", ""], "r": "AB", "e": "理想气体基本状态参数有温度、压力和比体积。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447826", "t": 2, "q": "理想气体定容过程的特点有（　）（　）", "a": ["功的变化量为零（w=0）", "体积不变，比体积v为常数", "压力与温度成正比（p1/T1=p2/T2）", "内能变化量Δu=cvΔT", "", ""], "r": "ABCD", "e": "定容过程体积不变，比体积 v 为常数，体积不变则气体不对外做功，功的变化量 w = 0；由理想气体状态方程 pV = mRT，定容时 p 与 T 成正比；理想气体内能是温度的单值函数，定容过程内能变化量 Δu = cvΔT。ABCD 四个选项均符合理想气体定容过程特点。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447827", "t": 2, "q": "理想气体定熵过程的特点包括（　）?", "a": ["系统的熵变Δs=0", "过程为定压过程", "过程中系统与外界无热量交换（q=0）", "过程方程为p v^k=常数（k为比热容比）", "", ""], "r": "ACD", "e": "定熵即熵不变，所以系统熵变Δs = 0；定熵过程是绝热可逆过程，与外界无热量交换q = 0；其过程方程是p v^k = 常数。而定熵过程不一定是定压过程。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447828", "t": 2, "q": "理想气体定压过程的特点有（　）?", "a": ["焓变Δh=c_pΔT（c_p为定压比热容）", "系统对外做功w=pΔv", "内能变化Δu=0", "熵变Δs=0", "", ""], "r": "AB", "e": "理想气体定压过程，焓变公式Δh = cₚΔT 是成立的；系统对外做功在定压下 w = pΔv；内能变化Δu = cᵥΔT（cᵥ为定容比热容），温度变化时Δu不为0；熵变Δs 不为0。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447829", "t": 2, "q": "理想气体熵变计算的正确公式有（　）?", "a": ["Δs=c_v ln(T2/T1)+R_g ln(v2/v1)", "Δs=c_p ln(v2/v1)+c_v ln(p2/p1)", "Δs=Q/T（任意过程）", "Δs=c_p ln(T2/T1)-R_g ln(p2/p1)", "", ""], "r": "AD", "e": "根据理想气体熵变公式推导，A选项是常用理想气体熵变公式；D选项也可由相关公式推导得出。B项公式推导错误；C项Δs = Q/T只适用于可逆过程，不是任意过程。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447830", "t": 2, "q": "量纲分析中，常用的基本量纲包括（　）?", "a": ["质量（M）", "长度（L）", "时间（T）", "温度（θ）", "", ""], "r": "ABCD", "e": "流体力学量纲分析常用基本量纲：质量 M、长度 L、时间 T、温度 θ。", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447831", "t": 2, "q": "量纲和谐原理的应用包括（　）?", "a": ["检查热力或流体力学方程的正确性", "判断热力过程的方向性", "确定物理量之间的函数关系", "直接计算物理量的数值", "", ""], "r": "AC", "e": "量纲和谐原理可用于检查方程正确性以及确定物理量间函数关系。B选项判断热力过程方向性是用热力学第二定律；D选项不能直接计算物理量数值。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447832", "t": 2, "q": "流体伯努利方程适用的条件有（　）?", "a": ["定常流动", "无旋流动", "沿流线", "不可压缩流体", "", ""], "r": "ABCD", "e": "A 选项，伯努利方程要求流动为定常流动，流场参数不随时间变化，表述正确。B 选项，无旋流动条件下，伯努利常数对全流场相同，表述正确。C 选项，伯努利方程是沿流线建立的能量方程，适用于同一条流线上的两点，表述正确。D 选项，伯努利方程原始形式要求流体不可压缩，表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447833", "t": 2, "q": "流体静力学中，同一连通容器内静止的同一种流体，下列说法正确的有（　）", "a": ["流体密度越大，同一深度处的静压力越小", "同一水平面上各点的静压力相等", "静压力随深度的增加而线性增大", "不同水平面上的静压力差与深度差成正比", "", ""], "r": "BCD", "e": "根据流体静力学原理，静压力与流体密度、深度有关，静压力随深度增加线性增大，不同水平面静压力差与深度差成正比，同一连通静止同种流体同一水平面上各点静压力相等，且密度越大、深度越深静压力越大。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447834", "t": 2, "q": "流体静压力的特性包括（　）?", "a": ["静压力的大小与作用面的形状无关", "静压力的方向总是沿着流体运动的方向", "静止流体中任意一点的静压力在各个方向上都相等", "静压力的方向垂直于作用面，并指向作用面内部", "", ""], "r": "ACD", "e": "流体静压力方向垂直于作用面且指向内部，静止流体中任一点静压力各方向相等，其大小与作用面形状无关。B选项静压力方向与流体运动方向无关。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447835", "t": 2, "q": "流体流动中，局部水头损失通常产生在（　）?", "a": ["管道的进口或出口处", "管道上的阀门处", "变径管道处", "管道的直管段", "", ""], "r": "ABC", "e": "局部水头损失是由于流体边界急剧变化导致水流形态改变而产生的。管道进口或出口、阀门、变径处都会使边界急剧变化。而直管段水流形态稳定，不产生局部水头损失。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447836", "t": 2, "q": "流体运动的连续性方程（ρ1A1v1=ρ2A2v2）的适用条件有（　）（　）", "a": ["流体为均质流体", "流体为定常流动", "流体为理想流体（忽略粘性）", "流体为不可压缩流体", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447837", "t": 2, "q": "判断流体在圆管内流动状态（层流或湍流）的依据有（　）?", "a": ["流体的颜色", "流体的粘度μ", "管道的内径d", "流体的流速v", "", ""], "r": "BCD", "e": "判断圆管内流体流动状态用雷诺数Re，Re=ρvd/μ ，与流速v、管径d、流体粘度μ有关，和流体颜色无关。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447838", "t": 2, "q": "下列措施中，能提高热泵循环供热系数εh的有（　）", "a": ["增大节流阀的不可逆损失", "减小压缩机的不可逆损失", "提高冷凝器内工质的冷凝温度", "采用回热措施", "", ""], "r": "BD", "e": "热泵循环供热系数εh是衡量热泵效率的一个重要参数，它表示热泵从低温热源吸收的热量与消耗的电功之比。要提高εh，需要增加热泵从低温热源吸收的热量或者减少消耗的电功。我们逐项分析选项：A. 增大节流阀的不可逆损失：这会增加系统的总能耗，降低热泵效率，因此不会提高εh。B. 减小压缩机的不可逆损失：减少压缩机的不可逆损失可以降低系统的总能耗，从而提高热泵的效率，即提高εh。C. 提高冷凝器内工质的冷凝温度：提高冷凝温度通常会导致压缩机需要消耗更多的能量来完成相同的制冷循环，因此不会提高εh。D. 采用回热措施：回热措施可以提高进入压缩机的工质温度，从而减少压缩机的功耗和提高热泵从低温热源吸收的热量，进而提高εh。综上所述，能提高热泵循环供热系数εh的措施有B和D。所以，正确答案是BD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800184147447839", "t": 2, "q": "下列措施中，能提高蒸汽动力循环中朗肯循环效率的有（　）", "a": ["采用回热循环", "采用再热循环", "提高蒸汽初压（不超过临界压力）", "提高排汽压力", "", ""], "r": "ABC", "e": "采用回热循环、再热循环、提高蒸汽初压（不超临界压力）都能提高朗肯循环效率，而提高排汽压力会使循环效率降低。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089024", "t": 3, "q": "闭口系的热力学能变化ΔU仅取决于系统的初终状态，与过程无关，而热量Q和功W也仅取决于初终状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "闭口系中热力学能是状态参数，其变化ΔU只与初终状态有关，与过程无关；但热量Q和功W是过程量，其大小与具体过程有关，并非仅取决于初终状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089025", "t": 3, "q": "并联管路中，各管段的水头损失相等，总流量等于各管段流量之和，总阻抗的倒数等于各管段阻抗倒数之和。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "并联管路特点就是各管段水头损失相等，总流量为各管段流量之和，且总阻抗倒数等于各管段阻抗倒数之和。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089026", "t": 3, "q": "并联管路中，各支管管径越大（其他条件不变），支管流量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "根据并联管路特点，管径越大，流体阻力越小，在其他条件不变时，支管流量应越大。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089027", "t": 3, "q": "串联管路的总水头损失等于各管段水头损失之和，总流量等于各管段流量之和。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串联管路总水头损失等于各管段水头损失之和，但总流量等于各管段流量，并非各管段流量之和。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089028", "t": 3, "q": "串联管路中，各管段的流量相等，总水头损失等于各管段水头损失之和，总阻抗等于各管段阻抗之和。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "串联管路特点就是各管段流量相等，总水头损失是各管段水头损失相加，总阻抗为各管段阻抗相加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089029", "t": 3, "q": "定常流动中，流场任意一点的速度、压力等参数不随时间变化，但可随空间位置变化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "定常流动的定义就是流场中各空间点上的流体物理参数（如速度、压力等）仅随空间位置变化，不随时间变化。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089030", "t": 3, "q": "定常流动中，流体质点的加速度一定为零，因为流场中各点的速度不随时间变化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "定常流动只是流场中各点速度不随时间变化，但流体质点在流动过程中，速度大小和方向可能因位置改变而改变，会有加速度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089031", "t": 3, "q": "孤立系统的熵值永远不会减小，只会增大或保持不变。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据热力学第二定律，孤立系统内进行的自发过程总是朝着熵增加的方向进行，当达到平衡态时熵达到最大值，此后熵不变。所以孤立系统的熵值不会减小，只会增大或保持不变，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089032", "t": 3, "q": "在管路水力计算中，长管是指管段长度很长的管路，短管是指管段长度很短的管路，两者的划分仅取决于管路长度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。长管和短管划分并非仅取决于管路长度，而是根据局部水头损失和流速水头之和与沿程水头损失相比是否可忽略来判断，若可忽略则为长管，不可忽略则为短管。  ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089033", "t": 3, "q": "管内流动的沿程水头损失仅与流体的粘性有关，与管道的粗糙度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "管内流动沿程水头损失与流体粘性和管道粗糙度都有关，流体粘性产生内摩擦力造成能量损失，管道粗糙度会使边界层内流态改变，也会引起能量损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089034", "t": 3, "q": "回热循环是通过从汽轮机中抽出部分蒸汽加热给水，减少锅炉的吸热量，从而提高朗肯循环的热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "回热循环确实是从汽轮机抽出部分蒸汽加热给水，使进入锅炉的水温度升高，减少了水在锅炉内的吸热量，降低了冷源损失，进而提高朗肯循环热效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089035", "t": 3, "q": "简单可压缩热力系统的状态由两个独立的状态参数即可完全确定，因此任意两个状态参数都能唯一确定系统的状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "简单可压缩热力系统需两个独立状态参数确定状态，但不是任意两个参数都独立，如定压过程中压力和温度就不独立，不能唯一确定系统状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089036", "t": 3, "q": "静止流体中，任意两点的静压力差仅与这两点的垂直高度差和流体密度有关（忽略其他因素）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据静止流体静压力基本方程，在静止流体中，两点间静压力差公式为「test/yiwen_img/importSubject/2034800179508547584.png」 ，「test/yiwen_img/importSubject/2034800179567267840.png」是流体密度，「test/yiwen_img/importSubject/2034800179605016576.png」是垂直高度差，所以静压力差仅与垂直高度差和流体密度有关（忽略其他因素）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089037", "t": 3, "q": "静止流体中某点的相对压力可正、可负或为零，取决于该点绝对压力与当地大气压的大小关系。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "相对压力是绝对压力与当地大气压的差值，当绝对压力大于大气压，相对压力为正；小于大气压，相对压力为负；等于大气压，相对压力为零。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089038", "t": 3, "q": "局部水头损失系数（ζ）是无量纲数，仅与局部构件的形状有关，与流体的雷诺数无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "局部水头损失系数ζ一般情况下主要与局部构件形状有关，但在雷诺数较小时，ζ会随雷诺数变化，并非与雷诺数无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089039", "t": 3, "q": "绝热过程一定是定熵过程，定熵过程也一定是绝热过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "绝热过程中若有不可逆因素，熵会增加，所以绝热过程不一定是定熵过程；而定熵过程要求过程可逆且绝热，只说定熵过程一定是绝热过程表述不严谨。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089040", "t": 3, "q": "卡诺循环的热效率仅取决于高温热源和低温热源的温度，与工质的种类无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据卡诺循环热效率公式 η = 1 - T₂/T₁（T₁是高温热源温度，T₂是低温热源温度），可知热效率只和高低温热源温度有关，与工质种类无关。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089041", "t": 3, "q": "卡诺循环是理想循环，实际蒸汽动力循环无法达到卡诺循环的热效率，因为实际循环存在不可逆损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "卡诺循环是在理想的可逆条件下进行的，而实际蒸汽动力循环中存在摩擦、散热等不可逆损失，所以无法达到卡诺循环热效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089042", "t": 3, "q": "开口热力系统的能量方程中，焓（h）的引入是为了简化定压过程的能量计算，在非定压过程中焓无实际物理意义。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。焓是状态参数，其定义为h = u+pv，不仅在定压过程有意义，在非定压过程也有实际物理意义，它反映了工质的能量状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089043", "t": 3, "q": "可逆过程一定是准静态过程，准静态过程也一定是可逆过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "可逆过程要求过程无限缓慢且无耗散效应，所以一定是准静态过程；但准静态过程若有耗散，就不是可逆过程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089044", "t": 3, "q": "可逆循环的熵变ΔS=0，不可逆循环的熵变ΔS>0，因为不可逆循环存在熵产。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "熵是状态参数，工质经历循环，初态和终态为同一状态。无论可逆循环还是不可逆循环，循环的熵变 ΔS=0。不可逆循环的熵产大于 0，熵产不是系统熵变。题干混淆了系统熵变与熵产的概念，表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089045", "t": 3, "q": "朗肯循环中，锅炉内的过程为定压吸热过程，水在锅炉内依次变为饱和水、湿蒸汽、干饱和蒸汽和过热蒸汽。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "朗肯循环里，锅炉内水确实是在定压下吸热，且依次经历变为饱和水、湿蒸汽、干饱和蒸汽和过热蒸汽的过程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089046", "t": 3, "q": "朗肯循环中，汽轮机排汽压力越低（其他参数不变），循环热效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在朗肯循环里，排汽压力降低会使平均放热温度下降，在平均吸热温度不变时，根据热效率公式，循环热效率会提高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089047", "t": 3, "q": "朗肯循环中，若提高蒸汽初温，同时保持初压和排汽压力不变，则循环的热效率会提高，且汽轮机排汽的干度会增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "提高蒸汽初温，在初压和排汽压力不变时，循环平均吸热温度升高，根据热效率公式，循环热效率会提高；同时提高初温使蒸汽在膨胀终了时的干度增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089048", "t": 3, "q": "朗肯循环中，水泵的耗功很小，通常可以忽略不计，因此循环的净功近似等于汽轮机的做功。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在朗肯循环里，水泵耗功相比汽轮机做功而言数值极小，一般为简化分析可忽略水泵耗功。循环净功是汽轮机做功减去水泵耗功，忽略水泵耗功后循环净功近似等于汽轮机做功。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089049", "t": 3, "q": "朗肯循环中，水泵压缩的是饱和水，由于水的不可压缩性，水泵消耗的功远小于汽轮机输出的功，通常可忽略。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "朗肯循环里水泵压缩的是饱和水，水的可压缩性极小，水泵耗功相比汽轮机输出功确实小很多，工程上一般可忽略不计。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089050", "t": 3, "q": "朗肯循环中，提高锅炉出口蒸汽的初温度，可同时提高循环热效率和降低汽轮机排汽湿度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "提高锅炉出口蒸汽初温度，可使平均吸热温度升高，循环热效率提高；同时使汽轮机排汽干度增加，即降低排汽湿度。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089051", "t": 3, "q": "朗肯循环中，蒸汽初压力越高，循环热效率越高，因此初压力可无限制升高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽朗肯循环中蒸汽初压力升高循环热效率会提高，但初压力不能无限制升高，压力过高会使设备强度要求提高、成本增加，还可能带来其他工程问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089052", "t": 3, "q": "理想流体是假想的无粘性流体，实际工程中不存在，引入理想流体是为了简化流动分析。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "理想流体是一种理想化模型，其特点就是无粘性，现实中并不存在，引入它能让复杂的流体流动分析得以简化。", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089053", "t": 3, "q": "理想流体在管内做定常流动时，沿任意一条流线，伯努利方程中的p/ρg+v²/(2g)+z之和为常数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "理想流体做定常流动时，沿任意一条流线，伯努利方程表达式为p/ρg + v²/(2g)+z = C（C为常数），所以题干表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089054", "t": 3, "q": "理想气体的定容过程中，压力与温度成正比，定压过程中体积与温度成正比，这分别是查理定律和盖-吕萨克定律。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "查理定律指出一定质量的气体，在体积不变时，压力与热力学温度成正比；盖 - 吕萨克定律表明一定质量的气体，在压强不变时，体积与热力学温度成正比。本题描述与定律内容相符。", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089055", "t": 3, "q": "理想气体的定熵过程一定是绝热过程，且绝热过程也一定是定熵过程。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "理想气体定熵过程熵不变，根据热力学第二定律，绝热可逆过程熵不变，所以定熵过程一定是绝热过程；但绝热过程若为不可逆过程，熵会增加，不是定熵过程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089056", "t": 3, "q": "理想气体的定温过程中，焓变ΔH=0，因为焓H=U+pV=U+RgT，定温过程T不变，U不变，故H不变。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于理想气体，其内能U和焓H都仅是温度的函数，定温过程温度T不变，所以内能U不变，由H = U + pV = U + RgT可知焓H也不变，即ΔH = 0。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089057", "t": 3, "q": "理想气体的定温过程中，热量全部转化为功，因此该过程违反热力学第二定律。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热力学第二定律说的是不可能从单一热源取热使之完全转换为有用功而不产生其他影响。理想气体定温过程中，虽热量全部转化为功，但系统体积发生了变化，有其他影响，所以不违反热力学第二定律。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089058", "t": 3, "q": "理想气体的定压比热容c_p恒大于定容比热容c_v，因为c_p=c_v+R_g（R_g为气体常数，R_g>0）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据理想气体比热容关系，公式「test/yiwen_img/importSubject/2034800179638571008.png」且「test/yiwen_img/importSubject/2034800179693096960.png」，所以「test/yiwen_img/importSubject/2034800179776983040.png」必然大于「test/yiwen_img/importSubject/2034800179831508992.png」。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089059", "t": 3, "q": "理想气体的定压比热容cp始终大于定容比热容cv，因为cp=cv+Rg，而气体常数Rg为正值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据理想气体比热容关系式「test/yiwen_img/importSubject/2034800179638571008.png」，且气体常数「test/yiwen_img/importSubject/2034800179940560896.png」恒为正，所以「test/yiwen_img/importSubject/2034800179776983040.png」必然大于「test/yiwen_img/importSubject/2034800179831508992.png」。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089060", "t": 3, "q": "理想气体的焓与内能类似，仅与温度有关，与压力和比体积无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于理想气体，分子间无相互作用力，其内能和焓只取决于分子热运动，只与温度有关，和压力、比体积无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089061", "t": 3, "q": "理想气体的绝热过程中，若为膨胀过程，则温度一定降低;若为压缩过程，则温度一定升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "绝热过程中，系统与外界无热量交换，膨胀时对外做功，内能减少，温度降低；压缩时外界对系统做功，内能增加，温度升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089062", "t": 3, "q": "理想气体的内能仅与温度有关，与压力和比体积无关，因此只要温度不变，理想气体的内能就一定不变。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "理想气体内能是温度的单值函数，温度不变时其内能就恒定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089063", "t": 3, "q": "理想气体的内能仅与温度有关，与压力和比体积无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据理想气体内能的特性，其内能是温度的单值函数，只取决于温度，和压力、比体积无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089064", "t": 3, "q": "理想气体定温过程中，系统吸收的热量全部转化为对外做功，这违反热力学第二定律。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热力学第二定律指出不可能从单一热源取热使之完全转换为有用的功而不产生其他影响。理想气体定温过程中，内能不变，吸收热量全部对外做功，但气体体积膨胀有“其他影响”，不违反热力学第二定律。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089065", "t": 3, "q": "理想气体定温膨胀过程中，系统熵变Δs=R_g ln(v2/v1)，因v2>v1，故Δs>0（熵增加）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对于理想气体定温膨胀过程，根据熵变公式「test/yiwen_img/importSubject/2034800179995086848.png」，已知膨胀时「test/yiwen_img/importSubject/2034800180049612800.png」，对数函数「test/yiwen_img/importSubject/2034800180099944448.png」，「test/yiwen_img/importSubject/2034800179940560896.png」为气体常数大于0，所以「test/yiwen_img/importSubject/2034800180154470400.png」，即熵增加。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089066", "t": 3, "q": "理想气体经历可逆绝热过程（定熵过程）时，其压力与比体积的关系满足p*v^k=常数（k为比热容比）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "理想气体可逆绝热过程就是定熵过程，在此过程中压力与比体积满足p*v^k = 常数，k为比热容比，这是理想气体可逆绝热过程的重要特性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089067", "t": 3, "q": "量纲分析中的π定理指出，若物理过程涉及n个物理量，其中含m个基本量纲，则可组成n-m个无量纲π数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是量纲分析中π定理的基本内容，表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089068", "t": 3, "q": "流体的动力黏度μ随温度升高而增大，运动黏度ν随温度升高而减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "液体动力黏度μ随温度升高而减小，气体动力黏度μ随温度升高而增大；运动黏度ν=μ/ρ ，其变化与动力黏度相关。所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089069", "t": 3, "q": "流体的动力粘度μ值越大，说明流体的粘性越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "动力粘度μ是衡量流体粘性大小的物理量，μ值越大，流体粘性越大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800185737089070", "t": 3, "q": "流体的静压力是标量，只有大小，没有方向，其方向总是垂直于作用面指向流体内部。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第1章 工程热力学与流体力学（2）", "n": "基础练习题【含解析】 / 第1章 工程热力学与流体力学（2）", "qs": [{"id": "2034800195551760384", "t": 1, "q": "流体在管内流动时，沿程阻力损失h f与流速v的关系为（　）", "a": ["无论层流还是湍流，h f均与v成正比", "层流时h f与v²成正比，湍流时h f与v成正比", "层流时h f与v成正比，湍流时h f与v²成正比", "无论层流还是湍流，h f均与v²成正比", "", ""], "r": "C", "e": "层流时沿程阻力损失与流速一次方成正比，湍流时沿程阻力损失与流速二次方成正比。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760385", "t": 1, "q": "流体在圆管内流动时，若雷诺数Re=1500，则流动状态为（　）", "a": ["无法确定", "湍流", "过渡流", "层流", "", ""], "r": "D", "e": "当雷诺数Re＜2000 时，流体流动状态为层流，本题Re = 1500＜2000。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760386", "t": 1, "q": "某朗肯循环中，蒸汽初压为10 MPa，初温为550℃，排汽压力为0.005 MPa，若忽略水泵耗功，则循环的热效率ηt约为（　）（查水蒸气表:初态h1=3479.1 kJ/kg，排汽h2=2004.7 kJ/kg，饱和水h3=137.8 kJ/kg）", "a": ["42.4%", "72.4%", "52.4%", "62.4%", "", ""], "r": "A", "e": "忽略水泵功，朗肯循环热效率 ηt=(h1-h2)/(h1-h3)=(3479.1-2004.7)/(3479.1-137.8)=1474.4/3341.3≈42.4%。<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760387", "t": 1, "q": "某理想气体从状态1到状态2，经历可逆绝热过程，下列参数关系正确的是（　）?", "a": ["p1 v1=p2 v2", "p1 v1^k=p2 v2^k（k为比热容比）", "T1 p1=T2 p2", "T1 v1=T2 v2", "", ""], "r": "B", "e": "绝热过程遵循绝热方程，理想气体可逆绝热过程的状态方程是「test/yiwen_img/importSubject/2034800188236894208.png」 （k为比热容比），A选项是等温过程方程，C、D选项不对应常见理想气体过程。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760388", "t": 1, "q": "某理想气体经历一个不可逆绝热过程，其熵变ΔS的取值为（　）", "a": ["ΔS>0", "ΔS=0", "ΔS<0", "无法确定", "", ""], "r": "A", "e": "绝热过程中，可逆时熵变ΔS = 0，不可逆时熵变ΔS＞0，本题是不可逆绝热过程，所以ΔS>0。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760389", "t": 1, "q": "某热力循环的吸热量为1000kJ/kg，放热量为600kJ/kg，循环净功为400kJ/kg，该循环的热效率ηt为（　）", "a": ["40%", "30%", "50%", "60%", "", ""], "r": "A", "e": "热效率计算公式为循环净功与吸热量之比，即「test/yiwen_img/importSubject/2034800188459192320.png」，已知循环净功400kJ/kg，吸热量1000kJ/kg，代入可得「test/yiwen_img/importSubject/2034800188551467008.png」。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760390", "t": 1, "q": "热泵循环的供热系数ε'的定义是（　）?", "a": ["供热Q1与净功W0的比值（ε'=Q1/W0）", "制冷量Q2与供热Q1的比值（ε'=Q2/Q1）", "供热Q1与制冷量Q2的比值（ε'=Q1/Q2）", "净功W0与供热Q1的比值（ε'=W0/Q1）", "", ""], "r": "A", "e": "热泵循环供热系数是指供热Q1与净功W0的比值。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760391", "t": 1, "q": "热泵循环与制冷循环的本质区别是（　）", "a": ["热泵循环采用水蒸气工质，制冷循环采用制冷剂工质", "热泵循环的目标是向高温热源放热，制冷循环是从低温热源吸热", "热泵循环为正向循环，制冷循环为逆向循环", "热泵循环消耗功，制冷循环产生功", "", ""], "r": "B", "e": "热泵循环和制冷循环本质都是逆向循环且都消耗功，工质也不固定，二者本质区别在于热泵是向高温热源放热以供热，制冷是从低温热源吸热以制冷。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760392", "t": 1, "q": "热力学第二定律的开尔文表述为\"不可能从单一热源吸热，使之完全变为功而不引起其他变化\"，下列过程中不违反该表述的是（　）", "a": ["无摩擦的可逆定温过程", "理想气体的定温膨胀过程", "自发的热功转换过程", "第二类永动机的工作过程", "", ""], "r": "B", "e": "开尔文表述强调不能从单一热源吸热完全变成功且无其他变化。A无摩擦可逆定温过程无热功转换；C自发热功转换违反表述；D第二类永动机就是想从单一热源吸热完全做功，违反表述；B理想气体定温膨胀从热源吸热做功，体积膨胀有其他变化，不违反。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760393", "t": 1, "q": "热力学第二定律的克劳修斯表述为（　）?", "a": ["孤立系统的熵总是减小的", "热量不可能自发地从低温物体传向高温物体而不引起其他变化", "不可能从单一热源吸热全部转化为功而不引起其他变化", "第二类永动机是可以实现的", "", ""], "r": "B", "e": "克劳修斯表述强调热量传递方向性，即热量不会自发从低温到高温且无其他变化。A选项孤立系统熵应是增大；C是开尔文表述；D第二类永动机违背热力学第二定律不能实现。答案：B ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760394", "t": 1, "q": "热力学第二定律的熵增原理表述为（　）?", "a": ["任意系统的熵永不减小", "孤立系统的熵总是增大的", "任意系统的熵总是增大的", "孤立系统的熵永不减小", "", ""], "r": "D", "e": "热力学第二定律熵增原理针对孤立系统，孤立系统中熵要么增大（不可逆过程），要么不变（可逆过程），即孤立系统的熵永不减小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760395", "t": 1, "q": "热力学第一定律的实质是（　）?", "a": ["能量守恒与转换定律在热力过程中的应用", "熵增原理", "第二类永动机不能实现", "热量传递的方向定律", "", ""], "r": "A", "e": "热力学第一定律体现的是能量守恒与转换，它是能量守恒与转换定律在热力过程的具体应用。熵增原理是热力学第二定律相关内容；第二类永动机不能实现也是热力学第二定律的体现；热量传递方向定律也是热力学第二定律范畴。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760396", "t": 1, "q": "热力学第一定律的实质是（　）", "a": ["不可能制造第二类永动机", "能量守恒与转换定律在热力过程中的应用", "热不能自发地从低温物体传向高温物体", "熵增原理", "", ""], "r": "B", "e": "热力学第一定律是能量守恒与转换定律在热现象中的体现。A选项是热力学第二定律的克劳修斯表述衍生的结论；C选项是热力学第二定律的克劳修斯表述；D选项熵增原理也是热力学第二定律相关内容。所以答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760397", "t": 1, "q": "湿蒸汽的温度与对应压力下的饱和温度的关系是（　）", "a": ["相等", "高于饱和温度", "低于饱和温度", "无法确定", "", ""], "r": "A", "e": "湿蒸汽是饱和水和饱和蒸汽的混合物，其温度等于对应压力下的饱和温度。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760398", "t": 1, "q": "水蒸气的定压汽化过程中，下列参数不变的是（　）?", "a": ["比体积", "内能", "焓", "温度", "", ""], "r": "D", "e": "水蒸气定压汽化是等温过程，温度不变。汽化时比体积增大，内能增加，焓也增加。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760399", "t": 1, "q": "水蒸气的焓值h主要取决于（　）", "a": ["温度和干度", "温度和比体积", "温度和压力", "压力和干度", "", ""], "r": "A", "e": "答案：A水蒸气的焓值h是描述水蒸气能量状态的一个参数。在热力学中，焓是一个状态函数，它与系统的温度和熵有关。对于水蒸气这种实际气体，其焓值不仅与温度有关，还与干度（即蒸汽的质量分数）有关。干度反映了水蒸气中气相所占的比例，因此影响焓值。而比体积和压力虽然也是描述物质状态的参数，但对于水蒸气的焓值来说，不是主要影响因素。所以，水蒸气的焓值h主要取决于温度和干度，选项A正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760400", "t": 1, "q": "水蒸气在定压加热过程中，从饱和水到干饱和蒸汽阶段，其温度变化特点是（　）", "a": ["随加热过程持续升高", "先不变后升高", "先升高后不变", "保持饱和温度不变", "", ""], "r": "D", "e": "在定压下，从饱和水加热到干饱和蒸汽是汽化过程，此过程温度为对应压力下的饱和温度，保持不变。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760401", "t": 1, "q": "下列关于量纲分析的说法，正确的是（　）?", "a": ["量纲分析可直接得出具体的函数关系式", "量纲分析不需要知道物理过程的机理", "π定理中，π数的个数等于物理量个数减去基本量纲个数", "量纲和谐原理要求所有物理量的量纲必须相同", "", ""], "r": "C", "e": "量纲分析不能直接得出具体函数关系式，A错误；量纲分析需一定物理过程机理知识，B错误；量纲和谐原理是等式两边量纲相同，非所有物理量量纲相同，D错误。π定理中，π数个数等于物理量个数减去基本量纲个数，C正确。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760402", "t": 1, "q": "下列关于流动阻力的说法，错误的是（　）?", "a": ["湍流流动的沿程阻力系数λ只与雷诺数Re有关", "沿程阻力是由于流体粘性和流体质点相互作用引起的", "层流流动的沿程阻力系数λ与管壁粗糙度无关", "局部阻力是由于流体流经局部构件（如阀门、弯头）时流动方向或截面变化引起的", "", ""], "r": "A", "e": "湍流流动时，沿程阻力系数λ不仅与雷诺数Re有关，还与管壁相对粗糙度有关，A说法错误；沿程阻力源于流体粘性和质点相互作用，层流时λ与管壁粗糙度无关，局部阻力是因流经局部构件使流动方向或截面变化产生。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760403", "t": 1, "q": "下列关于流体粘性的说法，错误的是（　）?", "a": ["理想流体的粘性系数为零", "温度升高时，液体粘性减小，气体粘性增大", "粘性是流体抵抗剪切变形的能力", "粘性力与流体的速度梯度成正比", "", ""], "r": "D", "e": "A 选项，理想流体假设没有粘性，粘性系数为零，说法正确。<br />B 选项，液体粘性主要由分子内聚力决定，升温内聚力下降，粘性减小；气体粘性来源于分子热运动，升温分子交换加剧，粘性增大，说法正确。<br />C 选项，粘性定义就是流体抵抗剪切变形的性质，说法正确。<br />D 选项，牛顿流体的粘性力与速度梯度成正比；题干没有限定是牛顿流体，非牛顿流体不满足这个关系，因此该表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760404", "t": 1, "q": "下列属于开口系统的是（　）?", "a": ["绝热容器内的氧气", "刚性气缸内的压缩空气", "运行中的蒸汽轮机", "密闭保温瓶内的水", "", ""], "r": "C", "e": "开口系统有物质进出。A、B、D选项中容器均密闭，无物质进出；C运行中的蒸汽轮机有蒸汽流入和流出，属于开口系统。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760405", "t": 1, "q": "下列因素中，对朗肯循环热效率影响不显著的是（　）", "a": ["蒸汽初温的提高", "回热循环的引入", "工质比热容的微小变化", "排汽压力的降低", "", ""], "r": "C", "e": "蒸汽初温提高、排汽压力降低都能显著提升朗肯循环热效率，回热循环引入也会使热效率明显提高，而工质比热容微小变化对热效率影响不显著。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760406", "t": 1, "q": "相似原理中，保证两个流动相似的充分必要条件不包括（　）", "a": ["动力相似", "几何相似", "温度相似", "运动相似", "", ""], "r": "C", "e": "保证两个流动相似的充分必要条件是几何相似、运动相似、动力相似，不包括温度相似。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760407", "t": 1, "q": "已知理想气体在定压过程中温度从T1升高到T2，其熵变ΔS的计算式为（　）（cp为定压比热容，cv为定容比热容，Rg为气体常数）", "a": ["ΔS=cp ln(p2/p1)", "ΔS=cv ln(T2/T1)", "ΔS=Rg ln(T2/T1)", "ΔS=cp ln(T2/T1)", "", ""], "r": "D", "e": "对于理想气体定压过程，熵变公式为「test/yiwen_img/importSubject/2034800188660518912.png」 。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760408", "t": 1, "q": "已知某理想气体的定压比热容cp=1.005 kJ/(kg·K)，定容比热容cv=0.718 kJ/(kg·K)，则该气体的气体常数Rg为（　）", "a": ["0.387 kJ/(kg·K)", "1.723 kJ/(kg·K)", "0.628 kJ/(kg·K)", "0.287 kJ/(kg·K)", "", ""], "r": "D", "e": "根据理想气体状态方程相关知识，气体常数Rg = cp - cv，将cp = 1.005 kJ/(kg·K)，cv = 0.718 kJ/(kg·K)代入可得Rg=1.005 - 0.718 = 0.287 kJ/(kg·K)。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760409", "t": 1, "q": "已知某理想气体在定温过程中从外界吸热100 kJ/kg，若气体常数Rg=0.287 kJ/(kg·K)，温度T=300 K，则该过程中气体的体积膨胀功W为（　）", "a": ["86.1 kJ/kg", "100 kJ/kg", "-100 kJ/kg", "-86.1 kJ/kg", "", ""], "r": "B", "e": "理想气体定温过程内能不变 Δu=0，由热力学第一定律 q=Δu+w，得膨胀功 w=q=100 kJ/kg。", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760410", "t": 1, "q": "已知某湿蒸汽的压力p=0.5 MPa，干度x=0.8，查水蒸气表得该压力下饱和水焓h'=640.1 kJ/kg，干饱和蒸汽焓h''=2748.5 kJ/kg，则该湿蒸汽的焓h为（　）", "a": ["2326.8 kJ/kg", "2118.8 kJ/kg", "3388.6 kJ/kg", "1798.7 kJ/kg", "", ""], "r": "A", "e": "湿蒸汽焓的计算公式为h = h'+x(h'' - h')，将h'=640.1 kJ/kg，h''=2748.5 kJ/kg，x = 0.8代入可得：h=640.1+0.8×(2748.5 - 640.1)=2326.8 kJ/kg。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760411", "t": 1, "q": "圆管内流体流动的雷诺数Re=vd/ν，其中ν表示（　）?", "a": ["流体的运动粘度", "圆管的内径", "流体的密度", "流体的动力粘度", "", ""], "r": "A", "e": "在雷诺数公式Re = vd / ν 中，ν 代表流体的运动粘度，d是圆管内径。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760412", "t": 1, "q": "圆管内流体流动的临界雷诺数Re_cr（从层流变为湍流的临界值）约为?", "a": ["10000", "20000", "2300", "500", "", ""], "r": "C", "e": "圆管内流体流动从层流变为湍流的临界雷诺数约为2300 。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760413", "t": 1, "q": "圆管内流体做充分发展的湍流流动，当雷诺数Re增大时，沿程阻力系数λ的变化规律是（　）", "a": ["随Re增大而减小，进入阻力平方区后趋于恒定", "先减小后增大，存在最小值", "随Re增大而不变，因为λ仅与相对粗糙度有关", "随Re增大而增大，因为湍流脉动增强", "", ""], "r": "A", "e": "圆管湍流中，沿程阻力系数λ与雷诺数Re和相对粗糙度有关。随Re增大，λ减小，进入阻力平方区后，λ只与相对粗糙度有关，趋于恒定。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760414", "t": 1, "q": "在定容条件下，理想气体的压力与温度（绝对温度）的关系符合（　）", "a": ["盖-吕萨克定律", "理想气体状态方程", "查理定律", "玻意耳定律", "", ""], "r": "C", "e": "这是一道关于理想气体定律的选择题。在定容条件下，我们需要考虑理想气体的哪个定律描述了压力与温度（绝对温度）之间的关系。A. 盖-吕萨克定律主要描述的是在恒定压力下，气体的体积与绝对温度成正比，与本题描述的条件不符。B. 理想气体状态方程是PV=nRT，它描述了气体的压力、体积、物质的量和温度之间的关系。虽然这个方程包含了我们需要的信息，但它是一个更全面的方程，不仅仅描述定容条件下的压力与温度关系。C. 查理定律正好描述了在定容条件下，理想气体的压力与其绝对温度成正比的关系。这完全符合题目的要求。D. 玻意耳定律描述的是在恒定温度下，气体的压力与其体积成反比，与本题描述的条件不符。综上所述，描述在定容条件下理想气体的压力与温度（绝对温度）关系的定律是查理定律。所以，正确答案是C选项：“查理定律”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760415", "t": 1, "q": "在管路水力计算中，串联管路的水力特性是（　）", "a": ["各管段流量相等，总水头损失等于各管段水头损失之和", "各管段流量不等，总水头损失等于各管段水头损失之最大值", "各管段流量不等，总水头损失等于各管段水头损失之和", "各管段流量相等，总水头损失等于各管段水头损失之平均值", "", ""], "r": "A", "e": "对于串联管路，流体在管路中连续流动无分支，所以各管段流量相等；而总水头损失是克服各管段阻力损失的总和，即总水头损失等于各管段水头损失之和。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760416", "t": 1, "q": "在流体运动学中，迹线与流线的关系是（　）", "a": ["任何流动中，迹线与流线均重合", "非定常流动中，迹线与流线重合", "定常流动中，迹线与流线重合", "任何流动中，迹线与流线均不重合", "", ""], "r": "C", "e": "定常流动时，流场中各点速度不随时间变化，此时迹线与流线重合；非定常流动时，二者一般不重合。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760417", "t": 1, "q": "在蒸汽动力循环中，采用再热循环的主要目的是（　）", "a": ["提高锅炉的蒸汽出口压力", "降低汽轮机排汽湿度，避免叶片侵蚀", "提高循环的平均温度，提高循环效率", "减少凝汽器的散热损失", "", ""], "r": "B", "e": "再热循环是将在汽轮机高压缸膨胀做功后的蒸汽引回锅炉再加热，然后再进入汽轮机低压缸继续膨胀做功。这样做主要是为降低汽轮机排汽湿度，避免叶片侵蚀。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760418", "t": 1, "q": "在蒸汽压缩制冷循环中，若蒸发器内制冷剂的蒸发温度降低，其他参数不变，则循环的制冷系数ε会（　）", "a": ["增大", "减小", "先增大后减小", "不变", "", ""], "r": "B", "e": "制冷系数ε与蒸发温度正相关，蒸发温度降低时，制冷系数ε减小。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760419", "t": 1, "q": "在蒸汽压缩制冷循环中，压缩机的理想工作过程为（　）", "a": ["可逆绝热压缩过程", "定压压缩过程", "定温压缩过程", "不可逆绝热压缩过程", "", ""], "r": "A", "e": "压缩机理想工作时无热量交换，且过程可逆，是可逆绝热压缩过程。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760420", "t": 1, "q": "蒸汽动力循环中，提高蒸汽初压力（其他参数不变），朗肯循环热效率会（　）?", "a": ["不变", "降低", "升高", "先升高后降低", "", ""], "r": "C", "e": "在蒸汽动力循环中，其他参数不变时，提高蒸汽初压力，平均吸热温度升高，根据热效率公式，朗肯循环热效率会升高。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800195551760421", "t": 1, "q": "制冷循环的制冷系数ε的定义是（　）?", "a": ["制冷量Q2与循环净功W0的比值（ε=Q2/W0）", "循环净功W0与制冷量Q2的比值（ε=W0/Q2）", "循环吸热量Q1与净功W0的比值（ε=Q1/W0）", "循环吸热量Q1与制冷量Q2的比值（ε=Q1/Q2）", "", ""], "r": "A", "e": "制冷系数是衡量制冷循环制冷性能的指标，其定义为制冷量与循环净功的比值。所以制冷系数ε=Q2/W0 。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738304", "t": 2, "q": "下列关于管路水力计算的说法正确的有（　）", "a": ["长管水力计算可忽略局部阻力损失", "短管水力计算需同时考虑沿程和局部阻力损失", "串联管路的总流量等于各管段流量之和", "并联管路的总水头损失等于各管段水头损失之和", "", ""], "r": "AB", "e": "长管水力计算可忽略局部阻力损失和流速水头；短管水力计算需同时考虑沿程和局部阻力损失。串联管路总流量等于各管段流量，并联管路各管段水头损失相等。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738305", "t": 2, "q": "下列关于卡诺循环的说法正确的有（　）", "a": ["卡诺循环的热效率ηt,c=1-T2/T1", "卡诺循环是由两个定温过程和两个绝热过程组成的可逆循环", "在相同的T1和T2之间，卡诺循环的热效率最高", "实际循环的热效率可以达到卡诺循环的热效率", "", ""], "r": "ABC", "e": "卡诺循环由两个定温、两个绝热可逆过程构成，热效率公式为ηt,c = 1 - T2/T1 ，且相同高低温热源间卡诺循环热效率最高，实际循环有不可逆因素，热效率达不到卡诺循环热效率。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738306", "t": 2, "q": "下列关于量纲分析的说法正确的有（　）", "a": ["量纲分析可直接得到具体的函数关系式", "量纲和谐原理是量纲分析的基础", "量纲分析可减少实验变量的数量", "量纲分析适用于所有物理过程", "", ""], "r": "BC", "e": "量纲分析依据量纲和谐原理，能减少实验变量数量，但不能直接得出具体函数关系，且并非适用于所有物理过程。答案：BC", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738307", "t": 2, "q": "下列关于流动相似的说法正确的有（　）", "a": ["几何相似是流动相似的必要条件", "相似准则是判断流动相似的依据", "动力相似是流动相似的充分条件", "运动相似是流动相似的核心条件", "", ""], "r": "AB", "e": "A 选项，几何相似是模型与原型流动相似的前提、必要条件，没有几何相似就不可能实现流动相似，表述正确。<br />B 选项，相似准则（雷诺数、弗劳德数等）是判断原型与模型流动是否满足相似的依据，表述正确。<br />C 选项，流动相似需要同时满足几何、运动、动力相似，动力相似只是必要条件，不是充分条件，表述错误。<br />D 选项，流动相似的核心是动力相似，不是运动相似，表述错误。<br />综上选 AB。", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738308", "t": 2, "q": "下列关于流动相似律应用的说法中，正确的有（　）（　）", "a": ["主要相似准则包括雷诺准则（Re）、弗劳德准则（Fr）、欧拉准则（Eu）等", "模型实验需保证与原型流动相似，才能将实验结果推广到原型", "对于明渠流动，主要控制相似准则为弗劳德准则", "对于管内流动，若为湍流且进入阻力平方区，只需保证几何相似和雷诺相似", "", ""], "r": "ABCD", "e": "A选项，雷诺、弗劳德、欧拉准则是主要相似准则；B选项，模型实验要与原型流动相似才能推广结果；C选项，明渠流动重力起主要作用，主要控制弗劳德准则；D选项，管内湍流进入阻力平方区，只需几何相似和雷诺相似。四个选项说法均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738309", "t": 2, "q": "下列关于流体动力黏度μ的说法正确的有（　）", "a": ["μ的单位为Pa·s", "液体的μ随温度升高而减小", "μ与流体的压强无关（低压下）", "气体的μ随温度升高而增大", "", ""], "r": "ABCD", "e": "流体动力黏度μ单位是Pa·s；液体黏性主要由内聚力决定，温度升高内聚力降低，μ减小；低压下μ与压强无关；气体黏性主要源于分子热运动，温度升高热运动加剧，μ增大。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738310", "t": 2, "q": "下列关于流体运动的说法，正确的有（　）?", "a": ["非定常流动中，流场任意点的参数随时间变化", "湍流流动中，流体质点有剧烈横向混合，流线杂乱", "层流流动中，流体质点无横向运动，流线平行", "有旋流动中，流体微团的旋转角速度不为零", "", ""], "r": "ABCD", "e": "A 非定常流动定义就是空间任意位置流动参数随时间变化；B 湍流存在涡团，质点横向混杂、流线紊乱；C 层流分层流动，无横向掺混，流线相互平行；D 有旋流动的判定标准为流体微团旋转角速度≠0。", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738311", "t": 2, "q": "下列关于流体运动的说法正确的有（　）", "a": ["非均匀流动中，流场中各点的速度一定随位置变化", "均匀流动中，流场中各点的速度不随位置变化", "缓变流动中，流线近似平行，可近似为均匀流动", "非定常流动中，流场中各点的速度一定随时间变化", "", ""], "r": "BC", "e": "均匀流动指流场中各点速度不随位置变化；缓变流动流线近似平行，可近似看成均匀流动。非均匀流动并非各点速度一定随位置变化；非定常流动也不是各点速度一定随时间变化。答案：BC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738312", "t": 2, "q": "下列关于流体粘性的说法中，正确的有（　）（　）", "a": ["温度升高时，液体粘性减小，气体粘性增大", "粘性系数越大，流体抵抗变形的能力越强", "粘性在流体运动和静止状态下都存在，但只有在流动时才表现出其影响", "压力变化对液体粘性影响较小，而对气体粘性的影响相对较大", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738313", "t": 2, "q": "下列关于热力系统的说法中，正确的有（　）（　）", "a": ["开口系统与外界既有物质交换，也有能量交换", "闭口系统与外界无物质交换，但可以有能量交换", "孤立系统与外界既无物质交换，也无能量交换", "绝热系统与外界无热量交换，但可能有物质和功的交换", "", ""], "r": "ABC", "e": "这是考查不同类型热力系统特点的题目。A选项开口系统特点就是与外界有物质和能量交换；B选项闭口系统无物质交换但可有能量交换；C选项孤立系统与外界无物质和能量交换；D选项绝热系统无热量交换，若有物质交换就不是绝热系统了，只能有功的交换。所以ABC正确。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738314", "t": 2, "q": "下列关于热力循环性能评价的说法中，正确的有（　）（　）", "a": ["实际循环的效率一定高于理想循环的效率", "制冷系数是评价制冷循环的主要指标，数值越大越好", "热泵系数是评价热泵循环的主要指标，数值越大越好", "卡诺循环的热效率是同温限下所有循环的最高效率", "", ""], "r": "BCD", "e": "实际循环存在各种不可逆损失，效率低于理想循环，A错误；制冷系数和热泵系数分别是评价制冷和热泵循环的主要指标，数值大表示性能好，B、C正确；卡诺循环是理想循环，热效率是同温限下所有循环最高的，D正确。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738315", "t": 2, "q": "下列关于蒸汽再热循环的说法正确的有（　）", "a": ["再热循环可提高汽轮机排汽的干度", "再热循环可提高朗肯循环的热效率", "再热次数越多，循环效率越高（不考虑设备成本）", "再热循环会增加汽轮机的耗功", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738316", "t": 2, "q": "下列关于制冷循环中节流阀的作用说法正确的有（　）", "a": ["减少制冷循环的不可逆损失", "使制冷剂降压降温", "实现制冷剂的相变", "替代膨胀机（简化设备）", "", ""], "r": "BD", "e": "节流阀在制冷循环中，能让制冷剂通过时降压，同时温度也降低，还可替代膨胀机简化设备。而减少不可逆损失不是其主要作用，实现相变主要靠蒸发器和冷凝器。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738317", "t": 2, "q": "下列过程中，工质的内能发生变化的有（　）（　）", "a": ["理想气体的定温膨胀过程", "理想气体的定熵压缩过程", "流体的节流过程（忽略动能变化）", "水蒸气的定压加热从饱和水到干饱和蒸汽的过程", "", ""], "r": "BD", "e": "内能与温度等有关。A选项理想气体定温膨胀，温度不变内能不变；B选项理想气体定熵压缩，温度升高，内能变化；C选项节流过程焓不变，理想气体节流温度不变内能不变，实际气体有小变化但一般忽略；D选项水蒸气定压加热，温度升高，内能变化。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738318", "t": 2, "q": "下列过程中，理想气体的熵一定增加的有（　）", "a": ["定压加热过程", "绝热压缩过程", "定容加热过程", "绝热膨胀过程", "", ""], "r": "AC", "e": "熵增意味着系统无序程度增加。定压加热和定容加热，气体吸收热量，分子热运动加剧，无序程度增大，熵增加；绝热压缩时，外界对气体做功，熵减小；绝热膨胀时，气体对外做功，温度降低，熵减小。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738319", "t": 2, "q": "下列过程中，属于不可逆过程的有（　）", "a": ["可逆绝热压缩过程", "气体的自由膨胀过程", "存在温度差的热传递过程", "有摩擦的机械运动过程", "", ""], "r": "BCD", "e": "可逆过程要求系统和外界能同时恢复原状。A选项可逆绝热压缩本身就是可逆过程；B选项气体自由膨胀后无法自发收缩回原状；C选项有温度差的热传递，热量不会自发从低温传向高温；D选项有摩擦的机械运动会有机械能损耗为热能，无法自发恢复。所以BCD是不可逆过程。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738320", "t": 2, "q": "下列热力过程中，属于可逆过程的有（　）（　）", "a": ["无能量损失的定熵压缩过程", "有散热损失的定压加热过程", "有摩擦的蒸汽节流过程", "无限缓慢的定容放热过程", "", ""], "r": "AD", "e": "可逆过程是指系统在进行过程中，其每一步变化都可以通过微小的调整而反向进行，最终回到初始状态而不留下任何永久性的变化。在热力学中，理想的可逆过程是不存在的，但在理论上我们可以设想一些过程接近可逆。A. 无能量损失的定熵压缩过程：定熵过程意味着过程中没有热量的交换，且系统的熵保持不变。理论上，如果一个压缩过程是定熵的且没有任何能量损失，那么它可以被认为是可逆的。B. 有散热损失的定压加热过程：由于存在散热损失，这意味着系统与外界有热量交换，且这种交换不是以可逆的方式进行的。因此，这个过程是不可逆的。C. 有摩擦的蒸汽节流过程：摩擦会导致能量的损失，且这种损失是不可逆的。因此，这个过程也是不可逆的。D. 无限缓慢的定容放热过程：如果一个过程进行得无限缓慢，那么它可以更接近于平衡状态，从而更接近可逆。定容放热过程，如果进行得足够缓慢，可以被认为是准静态过程，从而接近可逆。综上所述，A和D选项描述的过程更接近可逆过程。所以，正确答案是AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738321", "t": 2, "q": "下列设备中，属于压缩式制冷循环组成部分的有（　）?", "a": ["蒸发器", "冷凝器", "蒸汽发生器", "压缩机", "", ""], "r": "ABD", "e": "压缩式制冷循环主要由几个关键部件组成，它们共同协作以实现制冷效果。这些部件包括蒸发器、冷凝器、压缩机和膨胀阀。现在我们来简要分析题目中的选项：A. 蒸发器 - 这是压缩式制冷循环中的一个关键部分，液体制冷剂在蒸发器中吸收热量并蒸发成气体，从而带走热量，实现降温效果。B. 冷凝器 - 在冷凝器中，气态制冷剂释放热量并冷凝成液体，这是制冷循环中必不可少的一步。C. 蒸汽发生器 - 这不是压缩式制冷循环的标准组成部分。蒸汽发生器通常与锅炉或其他加热系统相关，并不直接参与制冷过程。D. 压缩机 - 压缩机是压缩式制冷循环的核心部件，它负责压缩气态制冷剂，提高其温度和压力，为后续的冷凝过程创造条件。综上所述，属于压缩式制冷循环组成部分的有蒸发器（A）、冷凝器（B）和压缩机（D）。因此，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738322", "t": 2, "q": "下列属于局部阻力损失产生原因的有（　）", "a": ["管路的弯头", "管路中的阀门", "管路截面突然扩大或缩小", "流体的黏性", "", ""], "r": "ABC", "e": "局部阻力损失是流体流经局部阻碍（如弯头、阀门、截面突变等）时，因流体运动状态改变而产生的能量损失。流体黏性是产生沿程阻力损失的主要原因。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738323", "t": 2, "q": "下列属于热力学第二定律应用的有（　）?", "a": ["分析制冷循环的可行性", "确定热机的最高效率（卡诺效率）", "判断热力过程的方向性", "计算理想气体的内能变化", "", ""], "r": "ABC", "e": "热力学第二定律可用于判断过程方向性、确定热机最高效率、分析制冷循环可行性等。而计算理想气体内能变化是依据热力学第一定律。ABC选项都与热力学第二定律相关，D选项是第一定律应用。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738324", "t": 2, "q": "下列属于影响流体流动沿程阻力损失的因素有（　）", "a": ["流体的动力黏度", "管路的长度", "管壁的粗糙度", "流体的流速", "", ""], "r": "ABCD", "e": "沿程阻力损失与流体性质（如动力黏度）、管路几何参数（长度、管壁粗糙度）、流体流速等有关。ABCD选项均会影响流体流动沿程阻力损失。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738325", "t": 2, "q": "下列属于蒸汽动力循环中能量损失的有（　）", "a": ["凝汽器中的放热损失", "锅炉中的散热损失", "汽轮机中的不可逆膨胀损失", "水泵中的不可逆压缩损失", "", ""], "r": "ABCD", "e": "A 凝汽器向环境放热，是朗肯循环最大能量损失；B 锅炉对外散热造成能量损耗；C 汽轮机内部不可逆膨胀，产生熵增损失；D 水泵不可逆压缩，消耗额外功，均属于蒸汽动力循环能量损失。", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738326", "t": 2, "q": "下列因素中，会导致离心式风机流量减少的有（　）", "a": ["风机介质密度增加", "风机转速降低", "风机叶轮直径减小", "风机出口阻力增加", "", ""], "r": "BCD", "e": "介质密度增加会使风机压头增大，流量可能增加；转速降低、叶轮直径减小、出口阻力增加都会使风机流量减少。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738327", "t": 2, "q": "影响静止流体中某点静压力大小的因素有（　）?", "a": ["流体表面的压力", "容器的形状", "流体的密度", "该点在流体中的深度", "", ""], "r": "ACD", "e": "静止流体中某点静压力大小与流体表面压力、流体密度、该点在流体中深度有关，与容器形状无关。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738328", "t": 2, "q": "影响朗肯循环热效率的主要因素有（　）?", "a": ["水泵消耗功率", "蒸汽初压力", "汽轮机排汽背压", "凝汽器体积", "", ""], "r": "BC", "e": "朗肯循环热效率与蒸汽初参数（初压、初温）和终参数（排汽背压）密切相关。蒸汽初压力提高、排汽背压降低，热效率会提高。水泵消耗功率和凝汽器体积并非影响热效率的主要因素。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738329", "t": 2, "q": "影响离心式水泵相似工况的条件有（　）", "a": ["几何相似", "运动相似", "流量相似", "压力相似", "", ""], "r": "AB", "e": "影响离心式水泵相似工况需满足几何相似、运动相似和动力相似，选项中只有几何和运动相似符合。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738330", "t": 2, "q": "影响流体流动局部水头损失的因素有（　）（　）", "a": ["管道的相对粗糙度", "流体的密度", "流体的雷诺数Re", "局部构件的形状（如弯头、阀门）", "", ""], "r": "CD", "e": "局部水头损失主要与局部构件形状有关，不同形状阻碍流体流动程度不同；同时雷诺数反映流体流动状态，也会影响局部水头损失。相对粗糙度主要影响沿程水头损失，流体密度不是影响局部水头损失的关键因素。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738331", "t": 2, "q": "影响流体在管内流动沿程水头损失的因素有（　）?", "a": ["流体的粘度", "管壁的粗糙度", "流体的温度", "流体的雷诺数", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738332", "t": 2, "q": "影响蒸汽动力循环（朗肯循环）热效率的主要因素有（　）（　）", "a": ["锅炉出口蒸汽的初温度", "凝结水的温度", "锅炉出口蒸汽的初压力", "汽轮机的内效率", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738333", "t": 2, "q": "影响蒸汽在汽轮机内膨胀过程不可逆损失的因素有（　）?", "a": ["蒸汽的散热损失", "汽轮机叶片的表面粗糙度", "蒸汽的初压力", "蒸汽的粘性", "", ""], "r": "ABD", "e": "蒸汽散热损失、汽轮机叶片表面粗糙度、蒸汽粘性都会使蒸汽膨胀过程产生不可逆损失，而蒸汽初压力本身不是导致不可逆损失的因素。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738334", "t": 2, "q": "蒸汽动力循环中采用再热循环的主要目的有（　）?", "a": ["减少凝汽器负荷", "避免汽轮机叶片被侵蚀", "提高循环热效率", "降低汽轮机排汽湿度", "", ""], "r": "BCD", "e": "再热循环可提高蒸汽在汽轮机中膨胀终了的干度，降低排汽湿度，避免汽轮机叶片被侵蚀，同时也能在一定程度上提高循环热效率。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738335", "t": 2, "q": "制冷循环与热泵循环的区别在于（　）?", "a": ["循环目的不同（制冷为获取冷量，热泵为获取热量）", "循环中Q1（向高温热源放热）与Q2（从低温热源吸热）的比值不同", "是否需要压缩机", "是否存在节流过程", "", ""], "r": "AB", "e": "制冷循环和热泵循环在很多方面都有相似之处，但也存在关键的区别。首先，我们来看选项A，它提到循环目的的不同。制冷循环的主要目的是从低温环境中吸收热量并将其排放到高温环境中，从而实现制冷效果；而热泵循环则是从低温环境中吸收热量并将其传递到高温环境中，以实现供暖或热水供应。这确实是两者之间的一个核心区别。接下来看选项B，关于循环中Q1与Q2的比值。在制冷循环中，这个比值通常小于1，表示从低温热源吸收的热量少于向高温热源放出的热量；而在热泵循环中，这个比值大于1，表示从低温热源吸收的热量多于向高温热源放出的热量。这也是两者之间的一个重要区别。然后看选项C，关于是否需要压缩机。实际上，无论是制冷循环还是热泵循环，都需要压缩机来压缩制冷剂，使其在系统中循环。因此，这个选项不是两者之间的区别。最后看选项D，关于是否存在节流过程。在制冷循环和热泵循环中，都需要通过节流阀来降低制冷剂的压力和温度，使其能够更好地吸收或放出热量。因此，这个选项也不是两者之间的区别。综上所述，制冷循环与热泵循环的主要区别在于它们的循环目的不同以及循环中Q1与Q2的比值不同。因此，正确答案是AB。所以，这道题的答案是AB选项：“循环目的不同（制冷为获取冷量，热泵为获取热量）”和“循环中Q1（向高温热源放热）与Q2（从低温热源吸热）的比值不同”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800197040738336", "t": 2, "q": "制冷循环中，常用的制冷剂需具备的特性有（　）（　）", "a": ["单位质量制冷量较大", "化学性质稳定，无毒性、无腐蚀性", "在制冷温度范围内有合适的饱和压力", "较低的临界温度和临界压力", "", ""], "r": "ABC", "e": "制冷剂需单位质量制冷量大以提高制冷效率，化学性质稳定且无毒无腐蚀保障安全，在制冷温度范围有合适饱和压力利于循环。而应是较高临界温度和临界压力，所以D错误。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001024", "t": 3, "q": "流体的密度ρ是指单位体积流体的质量，其值仅与流体的种类有关，与温度和压力无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流体密度不仅与种类有关，还受温度和压力影响，一般气体密度随温度升高而减小、随压力增大而增大，液体密度也会因温度和压力变化而有一定改变。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001025", "t": 3, "q": "流体的运动粘度ν=μ/ρ，其单位为m²/s，当流体密度ρ增大（μ不变）时，ν减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据运动粘度公式ν = μ/ρ，μ不变时，ρ增大，分数值ν减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001026", "t": 3, "q": "流体的粘性系数（动力粘性系数μ）仅与流体的种类有关，与温度和压力无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "流体粘性系数不仅与流体种类有关，还受温度影响，气体粘性系数随温度升高而增大，液体则相反；压力对其影响较小但并非无关。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001027", "t": 3, "q": "流体静力学基本方程p=p0+ρgh适用于任意静止流体，包括不同种类流体组成的分层流体。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001028", "t": 3, "q": "流体静力学中，等压面是指静止流体中压力相等的各点所组成的面，等压面一定是水平面。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "等压面一般是水平面，但在特殊情况如相对静止流体中，等压面不一定是水平面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001029", "t": 3, "q": "流体静压力的大小仅与流体的密度和深度有关，与流体的种类无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001030", "t": 3, "q": "流体静压力的方向垂直于作用面，并指向作用面的内部。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流体静压力特性之一就是方向垂直于作用面且指向作用面内部。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001031", "t": 3, "q": "流体静压力的方向总是垂直于作用面，并指向作用面的内部。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "流体静压力特性就是垂直于作用面且指向作用面内部。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001032", "t": 3, "q": "流体绕流物体时，边界层分离只发生在湍流流动中，层流流动不会发生边界层分离。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边界层分离并非只发生在湍流流动中，层流流动也会发生边界层分离。当流体绕流物体时，只要逆压梯度和黏性力的共同作用达到一定程度，就可能导致边界层分离，层流和湍流都有这种可能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001033", "t": 3, "q": "流体运动的迹线是同一时刻不同流体质点在空间组成的曲线。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "迹线是单个流体质点在不同时刻的运动轨迹，而同一时刻不同流体质点在空间组成的曲线是流线。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001034", "t": 3, "q": "流体运动的连续性方程仅适用于不可压缩流体，不适用于可压缩流体。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "连续性方程是质量守恒定律在流体力学中的体现，对可压缩和不可压缩流体都适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001035", "t": 3, "q": "流体在管内流动时，局部阻力损失主要发生在管路的进口、出口、阀门、弯头等局部区域，与管路长度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "局部阻力损失是流体流经局部障碍（如进口、出口、阀门、弯头等）时，因流道急剧变化导致流体形态改变而产生的能量损失，确实主要发生在这些局部区域且与管路长度无关。", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001036", "t": 3, "q": "流体在管内流动时，雷诺数Re越大，流动的湍动程度越剧烈，沿程阻力系数λ越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "雷诺数Re越大，流体流动湍动程度越剧烈，但沿程阻力系数λ并非一直增大，在完全湍流区λ与Re无关，在湍流过渡区λ随Re变化较复杂，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001037", "t": 3, "q": "流体在管内流动时，沿程水头损失发生在管道管件处（如阀门、弯头），局部水头损失发生在直管段。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "沿程水头损失发生在直管段，是流体沿流程克服摩擦阻力做功而损失的能量；局部水头损失发生在管道管件处，是流体因管道形状改变等产生的能量损失。题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001038", "t": 3, "q": "流体在管内做层流流动时，沿程水头损失与管内流体的流速成正比;做湍流流动时，沿程水头损失与流速的平方成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "<br />对于湍流流动，沿程阻力系数\\(f\\)基本保持不变或随雷诺数缓慢变化，此时沿程水头损失\\(h_f = f\\frac{l}{D}\\frac{v^2}{2g}\\)直接与\\(v^2\\)成正比，表明湍流状态下沿程水头损失与流速的平方成正比。综上所述，题干描述符合流体力学中关于层流和湍流状态下沿程水头损失的基本理论。", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001039", "t": 3, "q": "流体在圆管内做层流流动时，管中心处的流速最大，管壁处的流速为零，平均流速是最大流速的一半。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据圆管层流流动的特性，流体在圆管内做层流时，管中心流速最大，管壁处因流体与管壁的附着力，流速为零，且平均流速是最大流速一半。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001040", "t": 3, "q": "流体在圆管内做层流流动时，沿程阻力系数λ仅与雷诺数Re有关，与管壁粗糙度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "层流时，流体流动受黏性力主导，沿程阻力系数λ只取决于雷诺数Re，和管壁粗糙度无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001041", "t": 3, "q": "热泵循环的供热系数ε'一定大于1，因为ε'=1+ε（ε为制冷系数，ε>0）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据热泵循环供热系数与制冷系数的关系ε' = 1 + ε，且制冷系数ε大于0，所以供热系数ε'必然大于1。", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001042", "t": 3, "q": "热泵循环的供热系数εh一定大于1，因为εh=Q1/W=1+Q2/W，而Q2和W均为正值。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据热泵循环供热系数公式「test/yiwen_img/importSubject/2034800188752793600.png」，「test/yiwen_img/importSubject/2034800188920565760.png」和W为正，所以「test/yiwen_img/importSubject/2034800189017034752.png」必然大于1。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001043", "t": 3, "q": "热泵循环的热泵系数（COP）等于从低温热源吸收的热量与消耗功的比值，数值越大，热泵的制热效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热泵系数（COP）定义为向高温热源放出的热量与消耗功的比值，而非从低温热源吸收的热量与消耗功的比值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001044", "t": 3, "q": "热力学第二定律表明，热量可以自发地从低温物体传递到高温物体，无需外界做功。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热力学第二定律指出热量不能自发地从低温物体传递到高温物体，若要实现此过程需外界做功。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001045", "t": 3, "q": "热力学第二定律表明，所有自发过程都是不可逆的，且其熵变一定大于零。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001046", "t": 3, "q": "热力学第二定律的开尔文表述为:不可能从单一热源吸收热量，使之完全变为有用功而不引起其他变化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这是热力学第二定律开尔文表述的标准内容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001047", "t": 3, "q": "热力学第二定律的熵增原理指出，孤立系统的熵永不减少，可逆过程熵不变，不可逆过程熵增加。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这准确表述了热力学第二定律熵增原理的内容。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001048", "t": 3, "q": "热力学第一定律表达式q=Δu+w中，w为系统对外界做功，若w为负值，则表示外界对系统做功。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在热力学第一定律表达式中，w规定为系统对外界做功，当w为负，意味着系统实际是接受了能量，也就是外界对系统做了功。", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001049", "t": 3, "q": "热力学第一定律的表达式ΔU=Q-W中，W为外界对系统做的功，若系统对外做功，则W为正值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在热力学第一定律表达式ΔU = Q - W中，W是外界对系统做的功，系统对外做功时外界对系统做负功，此时W为负值，并非正值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001050", "t": 3, "q": "热力学第一定律仅阐述能量守恒与转换关系，不涉及热力过程的方向性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "热力学第一定律是能量守恒定律在热现象中的体现，只关注能量的守恒和转化，不涉及过程的方向性，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001051", "t": 3, "q": "热力循环的热效率越高，说明循环对外输出的净功越多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "热效率是循环中输出净功与输入热量的比值，热效率高可能是输入热量少，不一定代表对外输出净功多。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001052", "t": 3, "q": "熵是状态参数，系统的熵变仅取决于初末状态，与实现初末状态的过程无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "熵和温度、压力一样是状态参数，系统的状态确定了，其熵值就确定，状态变化时，熵变只由初末状态决定，与过程路径无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001053", "t": 3, "q": "湿蒸汽的干度x越大，说明湿蒸汽中饱和水的比例越高，干饱和蒸汽的比例越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "湿蒸汽干度x表示干饱和蒸汽的质量占湿蒸汽总质量的比例，x越大，干饱和蒸汽比例越高，饱和水比例越低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001054", "t": 3, "q": "水蒸气的饱和温度随饱和压力的升高而升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据水的热力性质，饱和压力和饱和温度存在一一对应的关系，饱和压力升高时，水分子更难逸出水面，需要更高的温度才能达到饱和状态，即饱和温度随饱和压力升高而升高。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001055", "t": 3, "q": "水蒸气的焓值不仅与温度有关，还与压力有关，因为水蒸气是实际气体，不满足理想气体状态方程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水蒸气是实际气体，其焓值是状态参数，由温度和压力共同决定，不满足理想气体状态方程中焓只与温度有关的特性。", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001056", "t": 3, "q": "水蒸气定压加热过程中，从干饱和蒸汽到过热蒸汽阶段，其温度随加热过程持续升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在水蒸气定压加热过程中，干饱和蒸汽继续加热成为过热蒸汽，此阶段压力不变，温度会随加热持续升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001057", "t": 3, "q": "水蒸气在任意状态下均可视为理想气体，采用理想气体状态方程（pV=mRT）计算其状态参数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "水蒸气只有在高温低压，远离液态时才可近似视为理想气体，并非在任意状态下都能视为理想气体。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001058", "t": 3, "q": "圆管内流体流动的雷诺数Re=vd/ν（v为平均流速，d为管径，ν为运动粘性系数），Re越大，流体流动越容易从层流转变为湍流。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "雷诺数是判断流体流动状态的关键参数，雷诺数越大，表明流体的惯性力相对粘性力越大，流体质点的运动越不稳定，就越容易从规则的层流转变为紊乱的湍流。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001059", "t": 3, "q": "圆管内流体流动的沿程水头损失(h_f)与管道长度(l)成正比，与管道内径(d)成反比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据达西 - 魏斯巴赫公式「test/yiwen_img/importSubject/2034800189084143616.png」，从公式可看出沿程水头损失「test/yiwen_img/importSubject/2034800189180612608.png」与管道长度l成正比，与管道内径d成反比。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001060", "t": 3, "q": "圆管内流体流动时，若管径增大（其他条件不变），雷诺数Re会增大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "雷诺数「test/yiwen_img/importSubject/2034800189281275904.png」，其中v是流速，d是管径，ρ是流体密度，「test/yiwen_img/importSubject/2034800189381939200.png」是流体黏度。当管径d增大，其他条件不变时，流量不变情况下流速v与管径平方成反比会减小，且管径增大带来的影响小于流速减小的影响，所以Re会减小。该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001061", "t": 3, "q": "再热循环的再热次数越多，朗肯循环的热效率越高，因此实际工程中应尽可能增加再热次数。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽再热次数增多朗肯循环热效率会提高，但增加再热次数会使系统更复杂、设备投资和运行成本大幅增加，所以实际工程中并非尽可能增加再热次数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001062", "t": 3, "q": "在相似原理中，若两个流动满足几何相似和动力相似，则一定满足运动相似。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "几何相似是运动相似和动力相似的前提，动力相似是决定两个流动运动相似的主导因素，当满足几何相似和动力相似时，运动相似自然满足。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001063", "t": 3, "q": "蒸汽动力循环采用回热循环，是为了提高循环平均吸热温度，从而提升热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "回热循环通过利用汽轮机中部分做过功的蒸汽来加热给水，减少了冷源损失，提高了循环平均吸热温度，进而提升热效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001064", "t": 3, "q": "蒸汽压缩制冷循环中，节流阀的不可逆损失会导致循环制冷系数降低，若用膨胀机替代节流阀，可提高制冷系数。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "节流阀节流是不可逆过程有损失，使循环制冷系数降低；膨胀机是可逆膨胀，能回收部分膨胀功，减少损失，可提高制冷系数。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001065", "t": 3, "q": "蒸汽再热循环的主要目的是提高汽轮机排汽的干度，防止汽轮机末级叶片被侵蚀，同时也能提高循环热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "蒸汽再热循环将汽轮机高压缸排出的蒸汽送回锅炉再加热，能提高排汽干度避免末级叶片侵蚀，还可提升循环热效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001066", "t": 3, "q": "制冷循环的制冷系数可以大于1，也可以小于1，具体数值取决于循环的温度范围。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "制冷系数公式为ε = Q₂/W（Q₂为从低温热源吸收的热量，W为外界对系统做的功），通常Q₂＞W，所以制冷系数一般大于1，其值受循环温度范围影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001067", "t": 3, "q": "制冷循环的制冷系数ε可以大于1，也可以小于1，取决于循环的工作条件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "制冷系数ε = 制冷量/压缩机耗功。制冷量通常大于压缩机耗功，所以制冷系数一般大于1 ，不过在特定极端工作条件下也可能小于1 ，它确实取决于循环工作条件。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001068", "t": 3, "q": "制冷循环的制冷系数ε越大，说明循环的制冷效果越好，消耗单位功所能从低温热源吸收的热量越多。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "制冷系数ε的定义就是从低温热源吸收的热量与所消耗的功的比值。ε越大，意味着消耗单位功从低温热源吸收的热量越多，制冷效果也就越好。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001069", "t": 3, "q": "制冷循环是逆向热力循环，其目的是消耗外界功，将热量从低温热源转移到高温热源。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "制冷循环就是通过消耗外界功，把热量从低温物体转移到高温物体的逆向热力循环。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800198320001070", "t": 3, "q": "制冷循环中，冷凝器的作用是将高温高压的制冷剂气态变为低温低压的制冷剂液态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冷凝器是把高温高压气态制冷剂变为高温高压液态制冷剂，而不是低温低压液态。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第2章 传热学（1）", "n": "基础练习题【含解析】 / 第2章 传热学（1）", "qs": [{"id": "2034800207669104640", "t": 1, "q": "在复合壁稳态导热中，若在热阻较大的一层材料中增加一层导热系数更小的保温材料，则总热阻和热流密度的变化为（　）", "a": ["总热阻减小", "总热阻和热流密度均不变", "总热阻增大", "热流密度增大", "", ""], "r": "C", "e": "热阻与导热系数成反比，增加导热系数更小的保温材料，会使热阻增大，总热阻也随之增大；根据热流密度公式，热阻增大，热流密度减小。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104641", "t": 1, "q": "对于非稳态导热的\"薄材\"，其温度变化特征是（　）", "a": ["温度变化与环境温度无关，仅由初始温度决定", "物体中心温度变化滞后于表面温度，且存在明显温度梯度", "物体内部各点温度随时间变化但始终保持均匀", "温度仅在物体表面层变化，内部温度保持初始温度", "", ""], "r": "B", "e": "这是一道关于非稳态导热特征的问题。在非稳态导热过程中，物体的温度分布会随时间发生变化。对于“薄材”，由于其厚度相对较小，热传导速度较快，但仍然存在一定的热传导时间。这就导致了物体中心温度的变化会滞后于表面温度的变化。同时，由于热传导需要时间，物体内部会存在明显的温度梯度，即越靠近表面温度越高，越靠近中心温度越低。接下来，我们逐一排除错误选项：A. 温度变化与环境温度无关，仅由初始温度决定 —— 这显然是错误的，因为非稳态导热过程中，环境温度是一个重要的影响因素。C. 物体内部各点温度随时间变化但始终保持均匀 —— 这也是错误的，因为非稳态导热过程中，物体内部温度是不均匀的，存在温度梯度。D. 温度仅在物体表面层变化，内部温度保持初始温度 —— 这同样是错误的，因为热传导会导致物体内部温度也发生变化，只是变化的速度和程度与表面不同。综上所述，B选项描述的是非稳态导热过程中“薄材”的温度变化特征，即物体中心温度变化滞后于表面温度，且存在明显温度梯度。所以，正确答案是B选项：“物体中心温度变化滞后于表面温度，且存在明显温度梯度”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104642", "t": 1, "q": "对于非稳态导热的\"厚材\"，其温度变化的特点是（　）", "a": ["物体内部温度梯度始终不变，仅温度水平整体升高", "物体表面温度迅速达到环境温度，内部温度缓慢升高", "过余温度随时间的变化符合指数规律，但各点变化速率不同", "在整个加热过程中，物体中心温度始终保持初始温度", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104643", "t": 1, "q": "对于管内强制对流换热，当流体处于湍流状态且Pr>0.7时，下列关于努塞尔数Nu计算的说法正确的是（　）", "a": ["Nu仅由流体物性决定，与流动状态无关", "Nu与Re的0.8次方、Pr的0.4次方成正比（加热流体时）", "Nu与Re的0.5次方、Pr的0.3次方成正比（冷却流体时）", "Nu仅与雷诺数Re成正比，与Pr无关", "", ""], "r": "B", "e": "管内强制对流湍流且Pr>0.7时，加热流体时，努塞尔数Nu与Re的0.8次方、Pr的0.4次方成正比。A选项Nu与流动状态有关；C选项冷却流体时Nu与Re的0.8次方、Pr的0.3次方成正比；D选项Nu与Pr有关。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104644", "t": 1, "q": "对于管内强制对流换热，当流体处于湍流状态且Pr数（Pr=ν/a，ν为运动粘度，a为热扩散率）大于0.7时，努塞尔数Nu的计算需考虑的主要因素是", "a": ["Re数和Pr数", "仅雷诺数Re", "流体的密度和比热容", "仅Pr数", "", ""], "r": "A", "e": "在管内强制对流换热，流体湍流且Pr>0.7时，努塞尔数Nu主要与雷诺数Re和普朗特数Pr有关，这是经典的管内对流换热关联式所体现的。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104645", "t": 1, "q": "对于管内强制对流换热，当流体为液态金属（Pr<<1）且处于湍流状态时，努塞尔数Nu的主要影响因素是（　）", "a": ["Re和Pr共同影响，且Pr的影响大于Re", "仅雷诺数Re，与Pr无关", "Re和Pr共同影响，且Re的影响大于Pr", "仅普朗特数Pr，与Re无关", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104646", "t": 1, "q": "对于灰体表面的辐射换热，当两个灰体表面构成封闭系统且无其他表面时，下列关于角系数F12和F21的关系，正确的是（　）", "a": ["F12=F21，与表面面积无关", "F12=ε1/ε2 * F21（ε1、ε2为两表面发射率）", "F12A1=F21A2（A1、A2为两表面面积）", "F12+F21=1，与表面位置无关", "", ""], "r": "C", "e": "根据角系数的相对性原理，对于两个灰体表面构成封闭系统且无其他表面时，有F12A1 = F21A2 。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104647", "t": 1, "q": "对于平壁的稳态传热过程（从流体1到流体2），总热阻R_total的组成是", "a": ["流体1的对流热阻和平壁的导热热阻", "流体1的对流热阻、平壁的导热热阻、流体2的对流热阻", "平壁的导热热阻和其中一侧流体的对流热阻", "仅流体1的对流热阻和流体2的对流热阻", "", ""], "r": "B", "e": "平壁稳态传热从流体1到流体2，热量依次经历流体1对流、平壁导热、流体2对流，热阻对应为流体1对流热阻、平壁导热热阻、流体2对流热阻。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800207669104648", "t": 1, "q": "对于由三种不同材料组成的平壁复合保温结构（材料依次为A、B、C，厚度分别为δA、δB、δC，导热系数λA<λB<λC），在稳态导热时，若总温差为Δt，则
