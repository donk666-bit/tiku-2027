通过管道将合格细粉送入住炉燃烧或进入煤粉仓（直吹式系统直接送炉膛，中间储仓式系统可送入煤粉仓）。此项正确。<br />C. 干燥煤粉，去除煤中的水分<br />正确。干燥剂中的热量用于加热原煤，使煤中水分蒸发，从而降低煤粉水分含量，满足制粉及燃烧要求。此项正确。<br />D. 调节煤粉细度，控制煤粉颗粒大小<br />煤粉细度主要由磨煤机类型、分离器挡板/转速调节、通风量等因素控制，与干燥剂（热风）本身无直接关系。干燥剂流量变化可间接影响通风量，从而影响细度，但其主要作用并非专门调节细度。此项错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800245115850783", "t": 2, "q": "锅炉制煤系统中，高速磨煤机（如风扇磨）的特点包括（　）", "a": ["对煤的水分含量适应性差，水分过高易堵塞", "磨煤转速高（约750-1500转/分）", "结构复杂，维护工作量大", "磨煤过程中同时完成煤粉干燥和输送", "", ""], "r": "BD", "e": "高速磨煤机转速高，约750 - 1500转/分，且在磨煤过程中可同时完成煤粉干燥和输送。A选项高速磨对水分适应性好；C选项高速磨结构简单、维护工作量小。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800245115850784", "t": 2, "q": "锅炉制粉系统中，下列属于直吹式制粉系统缺点的有哪些?", "a": ["系统投资成本高，占地面积大", "磨煤机故障会直接影响锅炉运行，可靠性低", "煤粉细度受锅炉负荷影响大，调节困难", "不适用于高水分、难磨的煤种", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800245115850785", "t": 2, "q": "锅炉制粉系统中，下列属于中间储仓式制粉系统优点的有哪些?", "a": ["磨煤机可独立运行，不受锅炉负荷波动影响", "煤粉细度均匀，燃烧稳定性好", "系统可靠性高，磨煤机故障时锅炉可短期运行", "适用于高水分、难磨的煤种", "", ""], "r": "ABC", "e": "A 对 磨煤机独立运行，煤粉储存在煤粉仓，制粉工况不用随锅炉负荷实时同步调整，不受锅炉负荷波动直接约束。<br />B 对 煤粉经过仓内混合、储存，细度均匀，送入炉膛的煤粉稳定，燃烧稳定性优于直吹式。<br />C 对 磨煤机停运故障时，煤粉仓储存煤粉可维持锅炉短时运行，系统可靠性更高。<br />D 错 适用于高水分、难磨煤种是直吹式制粉系统优势。<br />中间储仓式煤粉容易受潮结块，高水分煤易造成堵仓，不适合高水分煤。<br />简要对比记忆<br />中间储仓式优点：负荷适应性好、燃烧稳定、磨故障锅炉可短时运行；缺点：系统复杂、耗电高、不宜高水分煤。<br />直吹式优点：系统简单、占地小、适合高水分煤；缺点：磨煤机与锅炉强耦合，磨故障锅炉出力立刻下降。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800245115850786", "t": 2, "q": "锅炉制粉系统中，中间储仓式制粉系统的优点有哪些?（　）", "a": ["煤粉仓可储存煤粉，便于锅炉启停和负荷调整", "可采用不同类型的磨煤机，煤种适应性广", "系统漏风率低，锅炉热效率高", "系统响应速度快，适合负荷频繁变化的锅炉", "", ""], "r": "AB", "e": "中间储仓式制粉系统有煤粉仓可存煤粉，利于锅炉启停和调负荷，能适配不同磨煤机，煤种适应性强。其漏风多，热效率低；响应慢，不适合负荷频繁变化的锅炉。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811648", "t": 3, "q": "冲动式汽轮机的叶片进出口截面积相同，反动式汽轮机的叶片进出口截面积不同。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冲动式汽轮机的动叶片流道进出口截面积基本相同，蒸汽在动叶中基本不膨胀，只改变方向；而反动式汽轮机的动叶片流道呈渐缩状，进口截面积大于出口截面积。‌‌", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811649", "t": 3, "q": "电除尘器的除尘效率随烟气温度升高而升高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般情况下，烟气温度升高，气体黏度增大，粉尘荷电和驱进速度受影响，电除尘器除尘效率会降低而非升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811650", "t": 3, "q": "沸腾式省煤器出口工质为饱和蒸汽，非沸腾式为未饱和水。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811651", "t": 3, "q": "高压加热器的疏水逐级自流至低压加热器，可回收疏水的热量，提高回热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811652", "t": 3, "q": "锅炉过热器采用顺流布置时，过热器出口汽温随锅炉负荷升高而升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811653", "t": 3, "q": "锅炉过热器的传热系数随工质温度升高而减小，主要是因为工质导热系数降低和烟气与工质温差减小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "锅炉过热器中，工质温度升高时，工质导热系数降低使传热能力下降，且烟气与工质温差减小也会使传热量减少，从而导致传热系数减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811654", "t": 3, "q": "锅炉过热器的热偏差是指各根过热器管的吸热量和蒸汽流量不同，导致出口汽温不同的现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "锅炉过热器热偏差定义就是各根过热器管吸热量和蒸汽流量不同，进而使出口汽温有差异。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811655", "t": 3, "q": "锅炉空气预热器采用三分仓结构，可同时加热一次风和二次风，且一次风与二次风之间无任何泄漏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "三分仓空气预热器能同时加热一次风和二次风，但实际运行中一次风与二次风之间存在一定泄漏，无法做到无任何泄漏。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811656", "t": 3, "q": "锅炉空气预热器的低温腐蚀主要发生在空气进口端（低温段），因为此处壁温最低，易低于硫酸露点。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "空气预热器低温段壁温低，当低于硫酸露点时，烟气中的硫酸蒸汽会凝结在管壁上造成腐蚀，所以低温腐蚀主要发生在空气进口端（低温段）。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811657", "t": 3, "q": "锅炉空气预热器的低温腐蚀主要发生在空气预热器的高温段，因高温段烟气温度高，硫酸生成量多。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "锅炉空气预热器的低温腐蚀主要发生在低温段，而非高温段。因为在低温段，烟气中的水蒸气和硫酸蒸汽易在受热面上凝结，从而引发腐蚀。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811658", "t": 3, "q": "锅炉空气预热器的漏风率是指漏入空气预热器的空气量与进入空气预热器的烟气量之比。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "锅炉空气预热器漏风率是指漏入空气预热器烟气侧的空气量与理论空气量之比，并非漏入空气预热器的空气量与进入空气预热器的烟气量之比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811659", "t": 3, "q": "锅炉空气预热器堵灰会导致烟气阻力增大，引风机能耗增加，同时降低空气预热器的传热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "空气预热器堵灰后，烟气流通通道变窄，烟气阻力必然增大，为克服阻力引风机需消耗更多能量；堵灰也会影响热量传递，降低传热效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811660", "t": 3, "q": "锅炉空气预热器中，回转式空气预热器的漏风率低于管式空气预热器，运行稳定性更好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "回转式空气预热器结构特点使其漏风率通常高于管式空气预热器，且运行中易出现卡涩等问题，运行稳定性也不如管式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811661", "t": 3, "q": "锅炉炉膛的容积热负荷越大，炉膛体积越小，锅炉结构越紧凑，但容积热负荷过大易导致炉膛结渣。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "容积热负荷反映单位时间、单位炉膛容积内燃料燃烧放热量，其值越大，意味着相同放热量下所需炉膛体积越小，锅炉结构更紧凑；但过大时炉内温度过高，易使灰分熔化导致结渣。", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811662", "t": 3, "q": "锅炉磨煤机中，球磨机的磨煤电耗随煤种硬度的增加而增加，随煤粉细度要求的提高而减少。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "球磨机磨煤电耗随煤种硬度增加而增加是对的，因为煤越硬越难磨，需更多电能。但随煤粉细度要求提高，磨得更细需要更多能量，电耗应增加而非减少。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811663", "t": 3, "q": "锅炉汽水系统中，过热器的汽温调节一般采用喷水减温，喷水位置越靠近过热器出口，调节灵敏度越高，但对过热器的保护效果越差。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "喷水位置靠近过热器出口，能快速响应汽温变化，调节灵敏度高；但因靠近出口，不能及时冷却过热器前段，对过热器保护效果差。", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811664", "t": 3, "q": "锅炉燃烧过程中，采用低氮燃烧器可完全消除NOx的生成。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "低氮燃烧器能降低NOx的生成量，但无法完全消除，因为燃烧过程中多种因素会促使NOx产生。", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811665", "t": 3, "q": "锅炉燃烧过程中，过量空气系数过小会导致排烟热损失增加，过大会导致不完全燃烧损失增加。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "过量空气系数过小，燃料不能充分燃烧，会导致不完全燃烧损失增加；过大则会使排烟量增大，导致排烟热损失增加。所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811666", "t": 3, "q": "锅炉燃烧过程中，NOx的生成量随炉膛温度的升高而增加，随过量空气系数的减小而减少。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在锅炉燃烧中，高温利于NOx生成，所以炉膛温度升高，NOx生成量增加；过量空气系数减小意味着氧气量减少，会抑制NOx生成，使其生成量减少。", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811667", "t": 3, "q": "锅炉燃烧器的布置方式会影响炉膛内的温度分布，对冲燃烧方式的炉膛温度分布比四角切圆燃烧更均匀。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "对冲燃烧时燃料和空气相对均匀地喷入炉膛，能使热量更均匀释放，炉膛温度分布更均匀；而四角切圆燃烧会形成旋转气流，存在中心高温区和边缘低温区，温度分布不如对冲燃烧均匀。", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811668", "t": 3, "q": "锅炉燃烧器的倾角向上调整，会使火焰中心高度升高，炉膛出口烟气温度降低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "锅炉燃烧器倾角向上调整，火焰中心高度会升高，这样燃料在炉膛内停留时间变长，但同时炉膛出口处参与热交换的烟气温度会升高而非降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811669", "t": 3, "q": "锅炉燃烧系统中，一次风的主要作用是提供燃料完全燃烧所需的空气，二次风的主要作用是输送煤粉。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。在锅炉燃烧系统中，一次风主要作用是输送煤粉，二次风主要作用是提供燃料完全燃烧所需的空气。所以答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811670", "t": 3, "q": "锅炉省煤器采用逆流布置时，出口给水温度可接近烟气进口温度，换热效率高于顺流布置。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "逆流布置时冷热流体温差沿程分布更均匀，平均温差更大，能使出口给水温度更接近烟气进口温度，换热效率比顺流布置高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811671", "t": 3, "q": "锅炉省煤器采用逆流布置时，传热温差大，传热效率高，但省煤器出口给水温度可能超过排烟温度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "逆流布置：烟气与给水流向相反，平均传热温差大，传热效果好。但热力学上，逆流换热时，给水出口温度最高只能接近烟气进口温度，不可能超过排烟（烟气出口）温度；给水出口温度永远低于烟气进口温度，不会超过排烟温度。题干后半句 “省煤器出口给水温度可能超过排烟温度” 错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811672", "t": 3, "q": "锅炉省煤器的沸腾度是指省煤器出口工质温度与对应压力下饱和温度的差值，沸腾度越大，说明汽化程度越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。省煤器沸腾度是指省煤器出口汽水混合物中蒸汽的质量占总质量的百分比。而省煤器出口工质温度与对应压力下饱和温度的差值是过冷度或过热度概念。所以该判断题答案为错。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811673", "t": 3, "q": "锅炉省煤器的磨损主要发生在省煤器管束的迎风面，磨损程度随烟气流速的增加而线性增加。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "省煤器磨损主要在管束迎风面，但磨损程度与烟气流速并非线性关系，而是近似三次方关系。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811674", "t": 3, "q": "锅炉省煤器的主要作用是加热给水，提高给水温度，因此省煤器属于加热受热面，与锅炉热效率无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。省煤器确实能加热给水、提高给水温度，它属于加热受热面。但它能降低排烟温度，减少排烟热损失，从而提高锅炉热效率，并非与锅炉热效率无关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811675", "t": 3, "q": "锅炉湿法脱硫系统中，石灰石浆液的浓度越高，脱硫效率越高，故应尽可能提高浆液浓度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然一定范围内提高石灰石浆液浓度能提升脱硫效率，但浓度过高会使浆液流动性变差、易结垢堵塞设备，影响系统正常运行，并非浓度越高越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811676", "t": 3, "q": "锅炉受热面布置时，水冷壁主要布置在炉膛四周，吸收炉膛的辐射热量，属于辐射受热面。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水冷壁就是布置在炉膛四周，其工作原理就是吸收炉膛的辐射热，是典型的辐射受热面。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811677", "t": 3, "q": "锅炉水冷壁采用膜式布置可增加受热面积，减少炉膛漏风，提高锅炉热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "膜式水冷壁是由鳍片管或光管之间焊以扁钢而形成的气密管屏，它将炉膛严密地包围起来，能有效减少炉膛漏风，且增加了受热面积，减少热损失，从而提高锅炉热效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811678", "t": 3, "q": "锅炉水冷壁的结渣会导致管壁温度升高，影响水冷壁寿命，还会降低锅炉热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "结渣覆盖在水冷壁管外，会使传热热阻增大，导致管壁温度升高，长期高温影响水冷壁寿命，同时因传热变差，燃料燃烧热量不能有效传递给水，降低了锅炉热效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811679", "t": 3, "q": "锅炉脱硫系统中，氨法脱硫的脱硫产物为硫酸铵，可作为肥料综合利用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "氨法脱硫是用氨水吸收二氧化硫，最终生成硫酸铵，硫酸铵是常见的氮肥，可作为肥料综合利用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811680", "t": 3, "q": "锅炉脱硫系统中，石灰石-石膏湿法脱硫产生的石膏副产品纯度低，无法回收利用，只能填埋处理。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。石灰石 - 石膏湿法脱硫产生的石膏副产品纯度较高，可广泛回收利用，比如用于生产石膏板、水泥缓凝剂等，并非只能填埋处理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811681", "t": 3, "q": "锅炉脱硫系统中，循环流化床干法脱硫的脱硫效率高于石灰石-石膏法脱硫。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "石灰石 - 石膏法脱硫技术成熟，脱硫效率通常可达 95% 以上，而循环流化床干法脱硫效率一般在 80% - 90%，所以石灰石 - 石膏法脱硫效率更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811682", "t": 3, "q": "锅炉烟尘处理系统中，袋式除尘器的除尘效率不受烟尘比电阻的影响，适合处理高比电阻烟尘。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "袋式除尘器是通过过滤作用除尘，其除尘效率主要取决于滤料特性和过滤风速等，确实不受烟尘比电阻影响，很适合处理高比电阻烟尘。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811683", "t": 3, "q": "锅炉烟尘处理系统中，电除尘器的除尘效率不受烟气温度和湿度的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电除尘器的除尘效率会受烟气温度和湿度影响，温度过高或过低、湿度不合适都会改变粉尘的比电阻等性质，进而影响除尘效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811684", "t": 3, "q": "锅炉再热器的出口汽温应与过热器出口汽温相同，以保证汽轮机的安全运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "再热器出口汽温与过热器出口汽温通常不同，二者作用和工作条件有差异，有各自合适的温度范围来保障系统安全有效运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811685", "t": 3, "q": "锅炉再热器的汽温调节一般不采用喷水减温，主要是因为喷水会降低机组的热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "再热器喷水减温会使喷入的水在汽轮机中做功能力降低，增加了额外冷源损失，降低机组热效率，所以锅炉再热器汽温调节一般不采用喷水减温。", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811686", "t": 3, "q": "锅炉再热器的压力损失越小，汽轮机中压缸的进汽压力越高，机组的发电效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "再热器压力损失小，意味着蒸汽在再热器中能量损耗少，能更多地保持压力进入中压缸，中压缸进汽压力升高，可使蒸汽在汽轮机中更好地做功，提高机组发电效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811687", "t": 3, "q": "锅炉再热器进口蒸汽为饱和蒸汽，出口为过热蒸汽，其汽温调节方法与过热器完全相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "再热器进口蒸汽是过热蒸汽而非饱和蒸汽，且再热器和过热器汽温调节方法有差异。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811688", "t": 3, "q": "锅炉蒸发受热面的膜态沸腾是由于受热面壁温过低，导致工质在壁面形成连续汽膜。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "膜态沸腾是受热面壁温过高而非过低，使工质在壁面形成连续汽膜。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811689", "t": 3, "q": "锅炉蒸发受热面发生膜态沸腾时，管壁温度会急剧升高，主要是因为蒸汽膜阻碍了热量的传递。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "膜态沸腾时水中产生的蒸汽会在管壁形成连续的蒸汽膜，而蒸汽的导热系数远低于水，极大阻碍了热量从管壁向水的传递，使管壁得不到水的有效冷却，温度急剧升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811690", "t": 3, "q": "锅炉制粉系统中，干燥剂的温度越高，干燥效果越好，因此干燥剂温度越高越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然干燥剂温度高干燥效果好，但过高温度可能带来安全隐患，如引发煤粉爆炸等，并非越高越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811691", "t": 3, "q": "锅炉制粉系统中，高速磨煤机（如风扇磨）适合磨制无烟煤等硬煤，磨煤效率高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "高速磨煤机（如风扇磨）适合磨制高水分褐煤等软煤，而非无烟煤等硬煤。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811692", "t": 3, "q": "锅炉制粉系统中，球磨机对煤种的适应性最强，可磨制无烟煤、褐煤等各种煤种。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "球磨机运行可靠、对煤种适应性强，能磨制包括无烟煤、褐煤等的各种煤种。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811693", "t": 3, "q": "锅炉制粉系统中，正压直吹式制粉系统需要设置排粉风机，将煤粉送入炉膛。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "正压直吹式制粉系统：依靠一次风机（磨煤机处在正压）输送煤粉进入炉膛，不设置排粉风机。排粉风机是负压直吹系统、中间储仓式制粉系统的设备。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811694", "t": 3, "q": "锅炉制粉系统中，直吹式制粉系统的煤粉细度调节比中间储仓式制粉系统更灵活。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "直吹式制粉系统的煤粉细度受磨煤机运行工况影响大，调节手段相对有限；而中间储仓式制粉系统可通过改变粗粉分离器等设备参数来灵活调节煤粉细度。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811695", "t": 3, "q": "回转式空气预热器的漏风率随转子转速升高而降低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "回转式空气预热器转子转速升高时，空气和烟气与密封部件接触时间减少，密封效果相对变差，漏风率会升高而非降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811696", "t": 3, "q": "磨煤机的出力随磨辊压力增大而增大，压力越大，出力越大，无需限制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "磨煤机出力会随磨辊压力增大而增大，但压力并非越大越好，过大压力会造成设备磨损加剧、能耗增加，还可能损坏设备，所以需限制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800247942811697", "t": 3, "q": "汽轮机采用中压缸冲转时，冲转初期高压缸不进汽，需通过抽真空方式防止高压缸内积汽。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "中压缸冲转初期，高压缸不进汽，为防止高压缸内积汽，确实需通过抽真空方式处理。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第4章 锅炉与汽轮机原理（2）", "n": "基础练习题【含解析】 / 第4章 锅炉与汽轮机原理（2）", "qs": [{"id": "2034800253865168896", "t": 1, "q": "汽轮机回热加热器中，表面式加热器相比混合式加热器的主要缺点是", "a": ["结构复杂，占地面积大", "换热效率低，存在端差损失", "无法回收加热器内的疏水热量", "需要设置疏水泵，系统复杂度高", "", ""], "r": "B", "e": "表面式加热器蒸汽和水不直接接触，有换热端差，效率不如混合式，这是其相比混合式加热器的主要缺点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168897", "t": 1, "q": "汽轮机回热加热器中，关于表面式加热器与混合式加热器的区别，下列说法错误的是哪项?", "a": ["表面式加热器系统需设置疏水泵，混合式无需疏水泵", "混合式加热器的传热效率高于表面式加热器，因无传热温差损失", "表面式加热器的端差（加热器出口给水温度与加热蒸汽饱和温度的差值）通常为正值，而非负值;混合式加热器理论上端差可视为零", "表面式加热器通过管壁传热，给水与疏水不直接接触;混合式则通过流体直接接触传热", "", ""], "r": "A", "e": "A 错：表面式加热器疏水通常逐级自流（靠压差）或用疏水泵打入给水管道；但“混合式加热器无需疏水泵”也不全对——混合式加热器（如除氧器）出来的水需用给水泵抽出升压，反而必须有泵。更关键的是，表面式不一定“必须设疏水泵”（可疏水逐级自流至凝汽器或下级），且混合式加热器本身必须配水泵才能把混合后水送往下一级压力更高的加热器。因此说“表面式需设疏水泵、混合式无需”是错误的典型选项。<br />B 对：混合式直接接触，无金属壁面传热温差，无端差损失，热效率（热力学完善度）更高。<br />C 对：表面式有端差（给水终温低于抽汽饱和温度），一般为正值；混合式可加热到抽汽饱和温度，端差≈0。<br />D 对：表面式靠管壁间接换热，两种流体不接触；混合式直接混合。", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168898", "t": 1, "q": "汽轮机回热加热器中，关于高压加热器的运行特点，下列说法错误的是哪项?", "a": ["高压加热器的疏水通常采用逐级自流方式，流入低压加热器或除氧器", "高压加热器的加热蒸汽来自汽轮机高压缸的抽汽，压力较高", "高压加热器若发生泄漏，会导致给水温度下降，锅炉热效率降低", "高压加热器通常采用立式布置，以减少占地面积", "", ""], "r": "D", "e": "这是一道关于高压加热器运行特点的选择题。我们需要基于高压加热器的工作原理和特性，来判断哪个选项描述是错误的。首先，我们简要梳理下高压加热器的相关知识点：* 高压加热器通常利用汽轮机高压缸的抽汽进行加热。* 其疏水一般逐级自流至低压加热器或除氧器。* 高压加热器若发生泄漏，确实会影响给水温度和锅炉热效率。* 关于布置方式，高压加热器并非必然采用立式布置。接下来，我们分析每个选项：A. 描述了高压加热器疏水的常规方式，这是正确的。B. 正确指出了高压加热器的加热蒸汽来源，与实际工作原理相符。C. 准确描述了高压加热器泄漏可能带来的后果。D. 这个选项提到高压加热器“通常采用立式布置，以减少占地面积”。实际上，高压加热器的布置方式并非仅限于立式，也可能采用卧式或其他形式，这取决于具体的设计和需求。因此，这个描述是过于绝对化的，并不准确。综上所述，D选项中的描述存在误导性，是不准确的。所以，正确答案是D选项：“高压加热器通常采用立式布置，以减少占地面积”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168899", "t": 1, "q": "汽轮机回热系统中，“高压加热器”的抽汽来源于", "a": ["汽轮机的调节级", "汽轮机中压缸的中间级", "汽轮机低压缸的末几级", "汽轮机高压缸的排汽和中压缸的进汽前各级", "", ""], "r": "D", "e": "高压加热器抽汽要保证有足够压力和温度来加热给水，应从压力较高的部位抽取，即汽轮机高压缸排汽和中压缸进汽前各级。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168900", "t": 1, "q": "汽轮机叶片上的蒸汽作用力中，冲动力与反动力的比例主要取决于?", "a": ["蒸汽在叶片中的膨胀程度", "叶片的高度", "蒸汽的温度", "叶片的材质", "", ""], "r": "A", "e": "蒸汽在叶片中的膨胀程度决定了冲动力与反动力的比例，膨胀程度不同，冲动力和反动力占比就不同。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168901", "t": 1, "q": "汽轮机叶片上作用力的产生中，关于冲动式汽轮机与反动式汽轮机的区别，下列说法正确的是哪项?", "a": ["冲动式汽轮机叶片上的作用力主要来自蒸汽在叶片内的膨胀（反动作用）", "冲动式汽轮机的叶片为等截面叶片，反动式为变截面叶片", "反动式汽轮机叶片上的作用力仅来自蒸汽对叶片的冲击（冲动作用）", "冲动式汽轮机的反动度（反动作用占总作用力的比例）通常小于50%，反动式通常大于50%", "", ""], "r": "D", "e": "A 错误：冲动式汽轮机中，蒸汽主要在喷嘴（静叶）中膨胀加速，动能增加；进入动叶后基本不再膨胀（或膨胀很小），主要依靠蒸汽冲击（动量改变）产生作用力，并非主要来自叶片内膨胀的反动作用。<br />B 错误：叶片是否等截面/变截面取决于级的设计、叶高、强度等，不是冲动式与反动式的本质区别。<br />C 错误：反动式汽轮机中蒸汽在静叶和动叶中都膨胀，动叶中蒸汽加速并产生反动力，作用力由冲动+反动共同组成，并非“仅来自冲击”。<br />D正确：反动度Ω（动叶中焓降占总焓降的比例）是区分关键。冲动式Ω≈0（或很小，通常<10%~≤50%，纯冲动为0，带少量反动的<br />冲动级一般<0.5)；反动式（如50%反动度设计）通常Ω≈0.5或更大(>50%或约50%)。工程上常说冲动级反动度小(<0.5)，反动级约0.5。选项表述“冲动式通常<50%，反动式通常>50%（或≥50%）“符合一般分类原则，D正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168902", "t": 1, "q": "汽轮机运行过程中，关于叶栅损失的组成，下列哪项不属于叶栅损失的范畴?", "a": ["余速损失（蒸汽离开动叶后仍有残余流速的损失）", "喷嘴损失（蒸汽在喷嘴内的流动损失）", "鼓风损失（叶片在不进汽区域的搅动损失）", "动叶损失（蒸汽在动叶内的流动损失）", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168903", "t": 1, "q": "汽轮机运行中，“鼓风损失”主要发生在", "a": ["低负荷工况下的低压缸", "高负荷工况下的高压缸", "任何负荷下的调节级", "额定负荷下的中压缸", "", ""], "r": "A", "e": "鼓风损失是指部分进汽级中，动叶处在没有蒸汽流过的弧段时，象鼓风机一样，将蒸汽从一侧鼓到另一侧而消耗的一部分有用功。低负荷时，低压缸蒸汽量少，鼓风损失明显。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168904", "t": 1, "q": "汽轮机运行中，蒸汽在叶片通道内流动时，产生冲击损失的主要原因是", "a": ["蒸汽在叶片通道内发生涡流", "蒸汽进入叶片时的速度方向与叶片进口几何角度不匹配", "蒸汽参数随负荷变化导致密度波动", "蒸汽在叶片表面发生摩擦", "", ""], "r": "B", "e": "冲击损失主要是蒸汽进入叶片时速度方向与叶片进口几何角度不匹配造成的。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168905", "t": 1, "q": "汽轮机蒸汽流动的损失中，关于湿汽损失的产生原因及影响，下列说法正确的是哪项?", "a": ["湿汽损失主要发生在汽轮机高压缸，因高压区蒸汽湿度大", "湿汽损失包括蒸汽中水滴对动叶的冲击损失和水滴的动能损失", "湿汽损失会使汽轮机的相对内效率提高，因水滴可冷却叶片", "采用去湿装置（如汽水分离装置）可完全消除湿汽损失", "", ""], "r": "B", "e": "湿汽损失主要在汽轮机低压缸，A错误；湿汽损失包含蒸汽中水滴对动叶冲击损失和水滴动能损失，B正确；湿汽损失会降低汽轮机相对内效率，C错误；采用去湿装置不能完全消除湿汽损失，D错误。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168906", "t": 1, "q": "汽轮机蒸汽流动过程中，“湿汽损失”主要发生在", "a": ["高压缸的调节级", "高压缸的末级", "低压缸的末几级", "中压缸的各级", "", ""], "r": "C", "e": "汽轮机中，随着蒸汽膨胀做功，到低压缸末几级时，蒸汽湿度增大形成湿蒸汽，会造成湿汽损失。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168907", "t": 1, "q": "汽轮机蒸汽流动过程中，关于喷嘴出口蒸汽参数的变化，下列说法正确的是哪项（不考虑损失）?", "a": ["蒸汽压力降低，流速降低，焓降增大", "蒸汽压力降低，流速升高，焓降增大", "蒸汽压力升高，流速降低，焓降减小", "蒸汽压力升高，流速升高，焓降减小", "", ""], "r": "B", "e": "在汽轮机蒸汽流动过程中，喷嘴的作用是将蒸汽的热能转换为动能。当蒸汽通过喷嘴时，其压力降低，流速升高，这是一个典型的绝热膨胀过程。在这个过程中，蒸汽的焓值（即热力学能）会降低，因为部分热能已经被转换为动能。现在我们来分析各个选项：A. 蒸汽压力降低是正确的，但流速降低和焓降增大都是错误的。实际上，流速是升高的，焓降也是增大的（因为热能转换为动能）。B. 这个选项指出蒸汽压力降低，流速升高，焓降增大，这与喷嘴中蒸汽的实际行为相符。C. 蒸汽压力升高和流速降低都是错误的。在喷嘴中，蒸汽的压力是降低的，流速是升高的。D. 蒸汽压力升高和焓降减小都是错误的。实际上，蒸汽的压力是降低的，焓降是增大的。综上所述，正确答案是B选项：“蒸汽压力降低，流速升高，焓降增大”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168908", "t": 1, "q": "汽轮机轴封系统中，\"轴封供汽温度\"的控制要求是", "a": ["供汽温度应低于轴封处转子表面温度，防止转子过热", "供汽温度仅需满足高于饱和温度，防止凝结水产生即可", "供汽温度应高于轴封处转子表面温度，防止转子冷却", "供汽温度应与轴封处转子表面温度一致，避免热冲击", "", ""], "r": "C", "e": "汽轮机轴封系统中，轴封供汽的主要目的是防止空气沿轴漏入汽缸，同时防止蒸汽沿轴漏出。为了达到这个目的，轴封供汽的温度控制非常关键。选项A提到供汽温度应低于转子表面温度，这可能会导致转子冷却过快，产生热应力，不利于汽轮机的安全运行。选项B说供汽温度仅需高于饱和温度，防止凝结水产生。这个描述虽然考虑了防止凝结水的需求，但没有全面考虑转子表面的温度条件。选项C指出供汽温度应高于轴封处转子表面温度，这样可以有效防止转子冷却，同时确保轴封蒸汽不会在转子表面凝结，是一种比较安全和有效的控制方法。选项D提出供汽温度应与转子表面温度一致，这在实际操作中可能较难实现，而且即使实现，也可能因为微小的温差变化而导致热冲击。综上所述，为了保证汽轮机的安全和高效运行，轴封供汽温度应该略高于轴封处转子表面温度，以防止转子冷却和蒸汽凝结。所以，正确答案是C：“供汽温度应高于轴封处转子表面温度，防止转子冷却”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168909", "t": 1, "q": "汽轮机轴封系统中，高压轴封的主要作用是?", "a": ["平衡汽轮机转子的轴向推力", "防止高压缸内高温高压蒸汽向外泄漏", "回收轴封漏汽，提高机组热效率", "防止空气漏入汽轮机低压缸", "", ""], "r": "B", "e": "高压轴封处于高压缸处，其核心作用是阻止高压缸内高温高压蒸汽向外泄漏。A选项平衡轴向推力是推力轴承作用；C选项回收轴封漏汽提高热效率不是主要作用；D选项防止空气漏入低压缸是低压轴封作用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168910", "t": 1, "q": "汽轮机轴封系统中，高压轴封的主要作用是", "a": ["回收轴封漏汽，提高工质利用率", "平衡轴封前后的压力差，稳定转子运行", "防止空气漏入汽轮机低压缸，破坏真空", "防止汽轮机高压缸内的高温高压蒸汽向外泄漏", "", ""], "r": "D", "e": "高压轴封处于高压缸处，主要功能就是防止高压缸内高温高压蒸汽向外泄漏。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168911", "t": 1, "q": "汽轮机轴封系统中，关于高压轴封的作用，下列说法正确的是哪项?", "a": ["将轴封泄漏的蒸汽引入凝汽器，降低汽耗", "防止高压缸内的高温高压蒸汽向外泄漏，同时回收泄漏蒸汽的热量", "向汽轮机轴封提供密封蒸汽，防止空气进入汽缸", "防止汽轮机低压缸内的真空泄漏，维持真空度", "", ""], "r": "B", "e": "高压轴封主要是防止高压缸内高温高压蒸汽向外泄漏，还可回收泄漏蒸汽热量。A是回收泄漏蒸汽的方式；C是轴封供汽的作用；D是低压轴封作用。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168912", "t": 1, "q": "汽轮机轴封系统中，关于轴封供汽温度的控制，下列说法正确的是哪项?", "a": ["轴封供汽温度应与轴颈温度接近，避免温差过大产生热应力", "轴封供汽温度应高于轴颈温度，以防止轴颈冷却收缩", "轴封供汽温度应低于轴颈温度，以防止轴颈过热膨胀", "轴封供汽温度无需控制，仅需保证供汽压力稳定", "", ""], "r": "A", "e": "汽轮机轴封系统中，轴封供汽温度的控制非常关键。我们需要考虑轴封供汽温度与轴颈温度之间的关系及其对轴的影响。A选项：轴封供汽温度应与轴颈温度接近，避免温差过大产生热应力。这种说法是合理的。如果供汽温度与轴颈温度相差过大，会导致轴颈受到不均匀的热应力，可能引发损坏。B选项：轴封供汽温度应高于轴颈温度，以防止轴颈冷却收缩。这不太合适。过高的供汽温度可能导致轴颈局部过热，增加热应力，反而有害。C选项：轴封供汽温度应低于轴颈温度，以防止轴颈过热膨胀。这也不合理。过低的供汽温度可能导致轴颈冷却过快，产生收缩应力。D选项：轴封供汽温度无需控制，仅需保证供汽压力稳定。这是错误的。供汽温度的控制对于轴封系统的正常运行和轴的保护都非常重要，不能忽视。综上所述，A选项描述是正确的。轴封供汽温度应与轴颈温度接近，以避免温差过大产生的热应力。所以，正确答案是A选项：“轴封供汽温度应与轴颈温度接近，避免温差过大产生热应力”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168913", "t": 1, "q": "燃料燃烧过程中，关于煤粉着火温度的影响因素，下列说法错误的是哪项?", "a": ["煤粉与空气的混合比（过量空气系数）越接近理论燃烧比，着火温度越低", "煤粉细度越细，着火温度越低（越易着火）", "煤的灰分含量越高，着火温度越低（越易着火）", "煤的挥发分含量越高，着火温度越低", "", ""], "r": "C", "e": "煤的灰分是不可燃成分，含量越高，会使煤粉中可燃质相对减少，且灰分升温需吸收热量，导致着火困难，着火温度升高，而不是越低，C说法错误；混合比接近理论燃烧比利于着火，着火温度低；煤粉细度细、挥发分含量高都使煤粉更易着火，着火温度低。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168914", "t": 1, "q": "下列关于锅炉空气预热器的类型及特点，说法正确的是哪项?", "a": ["三分仓回转式空气预热器可同时加热一次风和二次风，且一次风与二次风之间无泄漏", "管式空气预热器的结构简单，占地面积小，适用于中、小型锅炉", "回转式空气预热器的漏风率低于管式空气预热器，热效率更高", "卧式管式空气预热器的冷空气自下而上流动，烟气自上而下流动，形成逆流换热", "", ""], "r": "D", "e": "A选项一次风与二次风之间有泄漏；B选项管式空气预热器结构简单，但占地面积大；C选项回转式空气预热器漏风率高于管式空气预热器。D选项描述正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168915", "t": 1, "q": "下列关于锅炉省煤器的运行特点，说法错误的是哪项?", "a": ["省煤器采用鳍片管或膜式管可增加受热面积，提高传热效率", "省煤器通常布置在空气预热器之后，以吸收烟气中更多的低温热量", "省煤器的存在可降低锅炉排烟温度，提高锅炉热效率", "省煤器管内的水速过高会增加流动阻力，导致给水泵电耗上升", "", ""], "r": "B", "e": "省煤器应布置在空气预热器之前，这样能先让省煤器吸收高温烟气热量，而不是在空气预热器之后。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168916", "t": 1, "q": "下列关于锅炉再热器受热面的设计与运行特点，说法正确的是哪项?", "a": ["再热器通常采用较高的质量流速，以增强换热效果", "再热器一般布置在锅炉高温烟道区域，以获得较高的传热温度", "再热器蒸汽流量等于锅炉蒸发量", "再热器进口蒸汽压力高，比热容大，传热温差大", "", ""], "r": "B", "e": "再热器布置在高温烟道区域可利用高温烟气获得较高传热温度。A项再热器质量流速较低；C项再热器蒸汽流量小于锅炉蒸发量；D项再热器进口蒸汽压力低，比热容小。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168917", "t": 1, "q": "下列关于汽轮机冲转方法的说法，错误的是哪项?", "a": ["高中压缸联合冲转适用于高中压缸合缸布置的汽轮机，可减少温差应力", "高中压缸分缸冲转适用于高中压缸分缸布置的汽轮机，可分别控制高中压缸的进汽参数", "中压缸冲转通常在机组启动初期用中压缸进汽冲转，待转速升高后切换为高中压缸联合进汽", "低压缸冲转适用于大型机组，可避免低压缸叶片因鼓风摩擦过热", "", ""], "r": "D", "e": "通常没有低压缸冲转这种冲转方法，大型机组常见冲转方式有高中压缸联合冲转、中压缸冲转等。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168918", "t": 1, "q": "下列哪种类型的空气预热器最容易发生堵灰和低温腐蚀问题?", "a": ["管式空气预热器（立式）", "管式空气预热器（卧式）", "回转式空气预热器（二分仓）", "回转式空气预热器（三分仓）", "", ""], "r": "C", "e": "回转式空预器蓄热元件金属壁温偏低，烟气侧容易积灰，更容易发生低温腐蚀；三分仓相比二分仓漏风更大，但二分仓堵灰、低温腐蚀问题最突出。", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168919", "t": 1, "q": "以下关于锅炉过热器汽温调节方法的描述，错误的是", "a": ["摆动燃烧器调节是通过改变火焰中心高度，调整过热器区域烟气温度", "喷水减温是最直接的调节方法，但会降低机组热效率", "烟气挡板调节是通过改变烟气流量分配，调整过热器吸热量", "烟气再循环调节主要用于调节再热器汽温，对过热器汽温无影响", "", ""], "r": "D", "e": "烟气再循环调节可改变对流受热面的烟气流速和温度分布，对过热器和再热器汽温都有影响，D选项错误。A、B、C选项描述均正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168920", "t": 1, "q": "以下关于汽轮机回热加热器\"端差\"的描述，错误的是", "a": ["端差增大通常是由于加热器管束结垢、堵塞或抽汽压力降低导致", "表面式加热器的端差是指加热器出口给水温度与抽汽饱和温度的差值", "混合式加热器的端差一般小于表面式加热器", "端差越小，说明加热器的换热效率越高", "", ""], "r": "B", "e": "A 正确：管束结垢/堵塞增加热阻，给水温度下降，端差增大；抽汽压力降低使饱和温度下降，若给水温度不变则端差增大（或相对变化导致端差表现异常），均属常见原因。<br />B 错误：选项表述为“出口给水温度与抽汽饱和温度的差值”，颠倒了减数和被减数顺序。正确应为“抽汽饱和温度减去出口给水温度”，B说反了。<br />C 正确：混合式加热器汽水直接接触，无金属管壁热阻，端差趋近于0，远小于表面式（通常3~5℃）。<br />D 正确：端差越小，说明给水被加热得越接近抽汽饱和温度，换热效率越高。", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168921", "t": 1, "q": "在锅炉汽水系统运行中，当负荷骤降时，下列哪种现象最可能因锅筒内汽水分离工况恶化而发生?", "a": ["过热器出口汽温超温", "水冷壁管内出现汽塞", "再热器入口汽压急剧升高", "省煤器出口水温降低", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168922", "t": 1, "q": "在锅炉汽水系统运行中，当锅炉负荷升高时，以下关于自然循环锅炉水循环特性的描述，正确的是", "a": ["循环倍率降低，上升管内工质流速降低", "循环倍率升高，上升管内工质流速升高", "循环倍率升高，上升管内工质流速降低", "循环倍率降低，上升管内工质流速升高", "", ""], "r": "D", "e": "锅炉负荷升高，产汽量增加，上升管含汽率增大，运动压头增加，工质流速升高；而循环倍率是进入上升管的水量与产汽量之比，产汽量增加，循环倍率降低。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168923", "t": 1, "q": "在锅炉汽水系统中，以下关于自然循环锅炉水循环故障的说法，错误的是哪项?", "a": ["下降管带汽会导致循环倍率降低，水循环安全性下降", "循环停滞通常发生在受热较弱的蒸发管，此时管内蒸汽无法有效排出", "汽水分层易发生在水平或微倾斜的蒸发管中，会造成管壁温度不均", "膜态沸腾会使管壁换热系数显著提高，有利于管壁冷却", "", ""], "r": "D", "e": "膜态沸腾时，管壁与蒸汽接触，蒸汽导热性差，会使管壁换热系数显著降低，不利于管壁冷却，D选项说法错误。A、B、C选项关于自然循环锅炉水循环故障的描述均正确。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168924", "t": 1, "q": "在锅炉省煤器的类型中，关于非沸腾式省煤器与沸腾式省煤器的区别，下列说法错误的是哪项?", "a": ["沸腾式省煤器需考虑汽水分层问题，非沸腾式无需考虑", "非沸腾式省煤器出口工质为未饱和水，沸腾式出口为汽水混合物", "非沸腾式省煤器的传热过程主要是对流传热，沸腾式还包含沸腾传热", "沸腾式省煤器一般布置在锅炉尾部低温烟道，非沸腾式布置在较高温区域", "", ""], "r": "D", "e": "沸腾式省煤器出口有汽水混合物，为避免汽水分层等问题，一般布置在较高温区域；非沸腾式出口是未饱和水，布置在锅炉尾部低温烟道。D项说法错误。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168925", "t": 1, "q": "在锅炉省煤器类型中，不适用于高压、高参数锅炉的是", "a": ["鳍片管式省煤器", "铸铁式省煤器", "钢管式省煤器", "膜式省煤器", "", ""], "r": "B", "e": "铸铁式省煤器耐压低，所以不适用于高压、高参数锅炉。答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168926", "t": 1, "q": "在锅炉烟尘处理系统中，电除尘器的除尘效率主要取决于下列哪种因素?", "a": ["烟尘的比电阻和电场强度", "烟尘的浓度", "除尘器的过滤面积", "烟尘的粒径大小", "", ""], "r": "A", "e": "电除尘器利用电场力使烟尘颗粒分离，其除尘效率关键在于烟尘比电阻和电场强度，比电阻影响荷电和捕集，电场强度决定颗粒受力运动。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168927", "t": 1, "q": "在锅炉烟尘处理系统中，关于电除尘器与袋式除尘器的性能对比，下列说法正确的是哪项?", "a": ["电除尘器的运行阻力高于袋式除尘器", "电除尘器的投资成本低于袋式除尘器，但其运行维护成本较高", "对于细颗粒物（PM2.5）的去除，电除尘器效率优于袋式除尘器", "相对于煤种含硫量的变化，电除尘器比袋式除尘器更敏感", "", ""], "r": "D", "e": "电除尘器阻力低于袋式，A 错；电除尘投资高、运维成本低，B 错；袋式除尘器对 PM2.5 去除效果优于电除尘，C 错；煤含硫量影响烟气比电阻，电除尘对其更敏感，D 正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168928", "t": 1, "q": "在锅炉制粉系统中，下列哪种制粉系统适用于燃用高挥发分、易爆炸煤种，且系统漏风少、负压运行?", "a": ["中间储仓式制粉系统（正压）", "直吹式制粉系统（负压）", "直吹式制粉系统（正压）", "中间储仓式制粉系统（负压）", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168929", "t": 1, "q": "在磨煤机的工作原理中，下列哪种磨煤机主要依靠研磨、挤压和冲击共同作用磨制煤粉?", "a": ["锤击式磨煤机", "球磨机", "风扇磨煤机", "碗式中速磨煤机", "", ""], "r": "D", "e": "这道题目考察的是对磨煤机工作原理的理解。首先，我们来了解题目中涉及的几种磨煤机及其特点：* 锤击式磨煤机：主要通过锤头的冲击力来破碎煤块。* 球磨机：依靠研磨介质（如钢球）的滚动来实现煤的研磨。* 风扇磨煤机：利用高速旋转的风扇叶片产生的冲击力来磨碎煤块。* 碗式中速磨煤机：结合了研磨、挤压和冲击三种方式来磨制煤粉。题目要求识别出主要依靠研磨、挤压和冲击共同作用来磨制煤粉的磨煤机。分析上述磨煤机的工作原理，我们可以看出：* 锤击式和风扇磨煤机主要依赖冲击力。* 球磨机主要依赖研磨。* 而碗式中速磨煤机则结合了研磨、挤压和冲击三种方式。因此，符合题目描述的磨煤机是碗式中速磨煤机。所以，正确答案是D.碗式中速磨煤机。", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168930", "t": 1, "q": "在磨煤机类型中，关于球磨机与中速磨煤机（如碗式磨）的性能对比，下列说法正确的是哪项?", "a": ["球磨机的煤粉细度调节范围窄，中速磨调节范围宽", "球磨机运行噪声低，中速磨运行噪声高", "球磨机对煤种适应性差，中速磨对煤种适应性强", "球磨机的磨煤电耗随负荷变化波动小，中速磨随负荷降低电耗显著下降", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168931", "t": 1, "q": "在汽轮机蒸汽流动过程中，叶片上产生的离心力主要由下列哪种因素决定?", "a": ["蒸汽的流速", "叶片的材料密度", "叶片的旋转角速度和叶片质量", "蒸汽的压力降", "", ""], "r": "C", "e": "根据离心力公式「test/yiwen_img/importSubject/2034800250258067456.png」，可知离心力与物体质量、旋转角速度等有关。汽轮机叶片上的离心力主要由叶片旋转角速度和叶片质量决定。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800253865168932", "t": 1, "q": "在制粉系统中，适合磨制无烟煤、贫煤等硬煤，且对煤种适应性最强的磨煤机是", "a": ["球磨机（低速磨）", "中速磨煤机（如碗式磨）", "高速磨煤机（如风扇磨）", "辊式磨煤机", "", ""], "r": "A", "e": "球磨机（低速磨）适合磨制无烟煤、贫煤等硬煤，且对煤种适应性强。中速磨适合磨较软煤；高速磨多用于磨高水分褐煤；辊式磨也更适合软煤。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089856", "t": 2, "q": "锅炉制粉系统中，中速磨煤机（如碗式磨、辊盘磨）的适用煤种特点包括（　）", "a": ["煤的挥发分含量较高", "煤的灰分含量较低", "煤的水分含量适中（一般不超过15%）", "煤的硬度较低（如烟煤）", "", ""], "r": "ABCD", "e": "中速磨适合挥发分较高、灰分低、水分适中（≤15%）、硬度不高的烟煤；不适合硬煤、高水分劣质煤。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089857", "t": 2, "q": "汽轮机冲转必须满足的条件包括（　）", "a": ["汽轮机转子偏心度在允许范围内", "汽轮机润滑油压力、温度正常", "轴封供汽正常", "主蒸汽压力、温度达到规定值", "", ""], "r": "ABCD", "e": "汽轮机冲转需各方面参数和状态正常，转子偏心度、润滑油压力温度、轴封供汽、主蒸汽压力温度等都会影响冲转安全和正常运行，这些条件都要满足。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089858", "t": 2, "q": "汽轮机冲转前需要进行暖机，暖机的主要目的包括哪些?（　）", "a": ["使汽轮机转子和汽缸均匀受热，避免热应力过大", "提高汽轮机润滑油温度，改善润滑效果", "使汽轮机转子达到额定转速，为并网做准备", "检查汽轮机各部件的振动、声音等运行状态", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089859", "t": 2, "q": "汽轮机调节级的特点包括（　）", "a": ["调节级的焓降最大，做功能力最强", "调节级的效率在所有级中最高", "调节级的叶片容易发生冲蚀和磨损", "调节级是汽轮机的第一级，承受的蒸汽参数最高", "", ""], "r": "ACD", "e": "调节级是汽轮机第一级，蒸汽参数最高，焓降最大、做功能力强，且因蒸汽流速高，叶片易冲蚀磨损；但效率并非所有级中最高。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089860", "t": 2, "q": "汽轮机回热加热器的运行异常情况包括（　）", "a": ["加热器水位过高或过低", "加热器端差增大", "加热器抽汽压力异常升高", "加热器内部管束泄漏", "", ""], "r": "ABCD", "e": "以上选项均会使加热器运行出现异常，水位过高或过低影响效率与安全，端差增大反映换热不佳，抽汽压力异常升高可能有故障，管束泄漏会破坏正常运行。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089861", "t": 2, "q": "汽轮机回热加热器的运行中，影响加热器端差的因素有哪些?", "a": ["加热蒸汽的压力，压力越高端差越小", "加热器的传热面积，面积越小端差越大", "给水的流速，流速越快端差越小", "加热器内的空气量，空气越多端差越大", "", ""], "r": "BD", "e": "A. 加热蒸汽的压力，压力越高端差越小：错误。端差主要取决于传热效果，而非蒸汽压力的绝对值。运行中若抽汽压力不稳定或偏离设计值，反而会导致端差增大。<br />B. 加热器的传热面积，面积越小端差越大：正确。传热面积不足会使换热不充分，给水无法被加热到接近饱和温度，导致端差增大。<br />C. 给水的流速，流速越快端差越小：错误。根据运行经验，给水流量增大时，单位给水的吸热量减少，给水温升下降，端差反而增大。<br />D. 加热器内的空气量，空气越多端差越大：正确。不凝结空气附着在管子表面形成空气层，增加传热热阻，妨碍蒸汽凝结放热，导致端差显著增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089862", "t": 2, "q": "汽轮机回热加热器中，混合式加热器的优点包括（　）", "a": ["结构简单，造价低", "对给水品质要求较低", "换热效率高，无端差损失", "无需设置疏水泵，系统简化", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089863", "t": 2, "q": "汽轮机回热系统中，除氧器的作用包括哪些?", "a": ["作为回热系统的一个加热器，利用汽轮机抽汽加热给水", "去除给水中的氧气和其他气体，防止锅炉受热面腐蚀", "去除给水中的盐分，提高给水品质", "加热给水，提高给水温度，减少锅炉热负荷", "", ""], "r": "ABD", "e": "除氧器主要功能一是作为回热加热器用汽轮机抽汽加热给水，提高水温、减少锅炉热负荷；二是除去给水中氧气等气体防腐蚀。但除氧器不能除盐分。所以答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089864", "t": 2, "q": "汽轮机回热系统中，影响加热器端差的因素有哪些?（　）", "a": ["加热器内的结垢情况", "给水和抽汽的流量", "汽轮机的负荷", "加热器的传热面积", "", ""], "r": "ABCD", "e": "A. 加热器内的结垢情况  这是影响因素之一。加热器管束表面积垢会增大传热热阻，导致端差增大 。<br />B. 给水和抽汽的流量  这是影响因素之一。给水流量或抽汽流量的变化会改变加热器内的热平衡，影响出口水温，从而导致端差变化 。<br />C. 汽轮机的负荷  这是影响因素之一。负荷变化会改变抽汽压力和流量，以及给水温度，进而影响加热器的端差 。<br />D. 加热器的传热面积  这是影响因素之一。在加热器设计或运行中，实际有效的传热面积（如因管束堵塞、水位过高淹没部分管子导致有效面积减小）会直接影响换热效率，进而影响端差", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089865", "t": 2, "q": "汽轮机叶片上的损失包括哪些类型?", "a": ["湿汽损失（蒸汽中水滴对动叶的冲击）", "动叶摩擦损失（蒸汽与动叶壁面的摩擦）", "冲击损失（蒸汽进入动叶时的方向与动叶进口角不一致）", "鼓风损失（叶片在不进汽区域的搅动）", "", ""], "r": "ABCD", "e": "汽轮机叶片损失包含多种，湿汽损失源于蒸汽中水滴对动叶冲击；动叶摩擦损失是蒸汽与动叶壁面摩擦所致；冲击损失因蒸汽进入动叶方向和动叶进口角不一致产生；鼓风损失是叶片在不进汽区域搅动造成。ABCD选项均为叶片损失类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089866", "t": 2, "q": "汽轮机叶片损失中，叶高损失产生的原因包括哪些?（　）", "a": ["叶片根部流道狭窄，流动阻力大", "叶片表面的摩擦阻力", "叶片沿高度方向的圆周速度不同，导致气流参数分布不均", "叶片进出口气流的撞击", "", ""], "r": "AC", "e": "汽轮机叶片损失中的叶高损失，主要源于叶片沿高度方向上的特性变化。我们逐项看下选项：A. 叶片根部流道狭窄，流动阻力大。这一选项直接关联到叶高损失，因为叶片根部流道的狭窄会导致流体在此处产生较大的流动阻力，从而造成能量损失。B. 叶片表面的摩擦阻力。这是所有叶片都会有的损失，并不特指叶高损失。C. 叶片沿高度方向的圆周速度不同，导致气流参数分布不均。这也是叶高损失的一个重要原因。由于叶片沿高度方向上的圆周速度差异，会导致气流在该方向上的参数分布不均，进而产生损失。D. 叶片进出口气流的撞击。这与叶型损失更为相关，而非特指叶高损失。综上所述，与叶高损失直接相关的原因是A和C两个选项。所以，正确答案是AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089867", "t": 2, "q": "汽轮机运行中，导致轴向推力增大的原因有（　）", "a": ["汽轮机轴封供汽压力异常升高", "汽轮机蒸汽参数（压力、温度）降低", "汽轮机通流部分结垢", "汽轮机发生水击", "", ""], "r": "ACD", "e": "汽轮机运行中轴向推力增大的原因通常与蒸汽流动状态的变化有关。我们逐一分析选项：A. 汽轮机轴封供汽压力异常升高：这会增加蒸汽通过轴封进入汽轮机的量，从而可能增加轴向推力。B. 汽轮机蒸汽参数（压力、温度）降低：一般来说，蒸汽参数降低会导致轴向推力减小，因为蒸汽做功的能力减弱了。C. 汽轮机通流部分结垢：结垢会减少蒸汽流通面积，导致蒸汽流速增加，可能引起轴向推力增大。D. 汽轮机发生水击：水击会导致蒸汽流动的不稳定，产生额外的轴向力，因此会增加轴向推力。综上所述，选项A、C和D描述的情况都可能导致汽轮机运行中轴向推力增大，而选项B描述的情况一般会导致轴向推力减小。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089868", "t": 2, "q": "汽轮机运行中，导致转子产生热弯曲的原因有（　）", "a": ["汽轮机停机时冷却过快，转子温度分布不均", "汽轮机负荷骤变，导致转子热应力过大", "汽轮机发生水击，转子局部受冷", "轴封供汽温度与转子表面温度偏差过大", "", ""], "r": "ABCD", "e": "停机冷却过快、负荷突变、水击、轴封汽温与转子温差大，都会造成转子径向温度分布不均，产生热弯曲。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089869", "t": 2, "q": "汽轮机运行中，关于振动的影响因素，正确的有哪些?", "a": ["负荷变化过快不会影响汽轮机振动", "轴承油膜不稳定（如油温过高、油压过低）会导致振动增大", "转子不平衡（如转子弯曲、结垢）会导致振动增大", "动静部分摩擦（如汽封与转子摩擦）会导致振动增大", "", ""], "r": "BCD", "e": "A选项，负荷变化过快会影响汽轮机振动，所以A错误；B选项，轴承油膜不稳定，像油温过高、油压过低等情况会使油膜承载能力变化，导致振动增大；C选项，转子不平衡，如弯曲、结垢等会破坏转子的动平衡，引起振动增大；D选项，动静部分摩擦，例如汽封与转子摩擦会产生额外作用力，使振动增大。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089870", "t": 2, "q": "汽轮机蒸汽流动过程中，下列属于蒸汽在喷嘴内流动损失的有哪些?", "a": ["膨胀损失（蒸汽膨胀不完全）", "冲击损失（蒸汽对动叶的冲击）", "摩擦损失（蒸汽与喷嘴壁面的摩擦）", "涡流损失（喷嘴出口汽流的涡流）", "", ""], "r": "ACD", "e": "蒸汽在喷嘴内流动损失包括膨胀不完全产生的膨胀损失、与喷嘴壁面摩擦的摩擦损失以及出口汽流形成的涡流损失。而冲击损失是蒸汽对动叶冲击造成的损失，不属于喷嘴内流动损失。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089871", "t": 2, "q": "汽轮机蒸汽流动过程中，叶片上产生的能量损失包括下列哪些类型?（　）", "a": ["斥汽损失", "鼓风损失", "撞击损失", "摩擦损失", "", ""], "r": "ABCD", "e": "A 斥汽损失：部分进汽工况下，动叶非工作弧段将蒸汽排挤出去产生的损失。<br />B 鼓风损失：部分进汽时，动叶在没有蒸汽的弧段旋转，搅动周围蒸汽产生鼓风摩擦损耗。<br />C 撞击损失：蒸汽进入动叶栅时，相对进汽角与叶片进口角不匹配，发生撞击引起的能量损失。<br />D 摩擦损失：叶轮、叶片表面与蒸汽之间摩擦造成的能量损耗。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089872", "t": 2, "q": "汽轮机蒸汽在叶片上产生作用力的过程中，涉及的物理原理包括（　）", "a": ["伯努利方程（蒸汽压力与流速的关系）", "动量定理（蒸汽动量变化产生作用力）", "牛顿第三定律（叶片对蒸汽的作用力与蒸汽对叶片的反作用力）", "连续性方程（蒸汽流量与通道截面积、流速的关系）", "", ""], "r": "ABCD", "e": "汽轮机中蒸汽在叶片上产生作用力，蒸汽流速变化符合伯努利方程，蒸汽动量变化产生作用力基于动量定理，叶片与蒸汽间有相互作用力符合牛顿第三定律，蒸汽流量与通道、流速关系遵循连续性方程，ABCD选项原理均涉及。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089873", "t": 2, "q": "汽轮机轴封漏汽的危害包括（　）", "a": ["轴封漏汽会导致汽轮机转子胀差增大", "轴封漏汽可能导致轴承润滑油进水，影响润滑效果", "轴封漏汽会加剧轴封处的腐蚀和磨损", "低压轴封漏入空气，破坏凝汽器真空，增加能耗", "", ""], "r": "ABCD", "e": "A 正确：轴封漏汽使轴颈受热，会造成转子胀差增大，严重时发生动静摩擦。<br />B 正确：轴封蒸汽窜入轴承箱，造成润滑油进水，油质乳化，降低润滑性能，威胁轴承安全。<br />C 正确：漏汽冲刷、湿汽以及杂质会加剧轴封齿、轴颈部位磨损与腐蚀。<br />D 正确：低压轴封密封不良，外界空气漏入凝汽器，真空下降，机组热耗、能耗上升。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089874", "t": 2, "q": "汽轮机轴封系统的主要组成部分包括（　）", "a": ["轴封加热器", "疏水器", "轴封供汽母管", "轴封抽汽风机", "", ""], "r": "ACD", "e": "汽轮机轴封系统主要由轴封供汽母管来输送供汽，轴封加热器用于回收轴封漏汽热量等，轴封抽汽风机来维持轴封腔室压力等。疏水器主要用于排除蒸汽管道中的凝结水，不是轴封系统主要组成部分。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089875", "t": 2, "q": "汽轮机轴封系统的组成部分包括哪些?", "a": ["轴封疏水装置（排除轴封系统内的凝结水）", "轴封供汽母管及调节阀（控制供汽压力、温度）", "轴封密封片（减少蒸汽泄漏或空气进入）", "轴封漏汽回收装置（如轴封加热器）", "", ""], "r": "ABCD", "e": "轴封系统要实现密封及蒸汽合理利用等功能，轴封密封片起减少蒸汽泄漏或空气进入作用，轴封供汽母管及调节阀控制供汽压力和温度，轴封疏水装置排除凝结水，轴封漏汽回收装置回收漏汽，ABCD都是其组成部分。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089876", "t": 2, "q": "汽轮机轴封系统中，关于低压轴封的作用，正确的有哪些?", "a": ["防止凝汽器内的真空泄漏，维持真空度", "将低压轴封的漏汽引入凝汽器，回收工质", "防止低压缸内的蒸汽向外泄漏，造成工质损失", "向低压轴封提供低压蒸汽，密封轴颈", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089877", "t": 2, "q": "汽轮机轴封系统中，轴封加热器的作用包括哪些?（　）", "a": ["回收轴封漏汽的热量和工质", "加热凝结水，提高机组热效率", "防止轴封漏汽进入凝汽器，影响凝汽器真空", "平衡轴封系统的压力", "", ""], "r": "ABC", "e": "A. 回收轴封漏汽的热量和工质<br />轴封加热器的主要功能之一就是回收轴封系统各处漏汽（如高、中压缸轴封溢汽、安全门漏汽等）的热量和凝结水，节能降耗。<br />B. 加热凝结水，提高机组热效率 <br />轴封加热器属于回热系统的一部分，其内部布置有凝结水管道。轴封漏汽在凝结放热过程中，将热量传递给管内的凝结水，使凝结水温度升高，有效回收了热量，提高了机组的热经济性。<br />C. 防止轴封漏汽进入凝汽器，影响凝汽器真空 <br />轴封加热器与轴封抽气器（或轴封风机）配合，在轴封加热器内建立微负压，将轴封系统的漏汽和空气混合物抽走，防止蒸汽漏入汽轮机润滑油系统污染油质，同时防止空气漏入凝汽器破坏真空。<br />D. 平衡轴封系统的压力 <br />轴封系统的压力平衡主要依靠轴封供汽调节阀和溢流阀来实现，而非轴封加热器。轴封加热器的作用是回收和冷却，并非压力调节。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089878", "t": 2, "q": "燃料燃烧过程中，影响煤粉燃烧速度的因素有哪些?", "a": ["过量空气系数，系数越大燃烧速度越快", "炉内温度，温度越高燃烧速度越快", "煤的挥发分含量，挥发分越高燃烧速度越快", "煤粉细度，细度越细燃烧速度越快", "", ""], "r": "BCD", "e": "燃料燃烧速度受多个因素影响。过量空气系数过大可能导致煤粉燃烧不完全，所以A项错误。炉内温度越高，反应速率越快，燃烧速度越快，B项正确。煤的挥发分含量越高，越容易燃烧，燃烧速度越快，C项正确。煤粉细度越细，与氧气接触面积越大，燃烧速度越快，D项正确。综上所述，正确答案为BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089879", "t": 2, "q": "下列关于锅炉空气预热器低温腐蚀的说法，正确的有哪些?", "a": ["低温腐蚀主要发生在空气预热器的低温段（烟气温度低于露点温度）", "提高空气预热器入口空气温度（如采用暖风器）可减轻低温腐蚀", "低温腐蚀的主要原因是烟气中的SO3与水结合生成硫酸，腐蚀管壁", "低温腐蚀不仅影响空气预热器的寿命，还可能对锅炉热效率产生负面影响", "", ""], "r": "ABCD", "e": "A. 低温腐蚀主要发生在空气预热器的低温段（烟气温度低于露点温度）  正确<br />这是低温腐蚀发生的位置特征。当烟气温度低于其酸露点时，烟气中的酸性气体（主要是硫酸蒸气）会凝结在受热面上，形成酸性液体，腐蚀金属。空气预热器的低温段（冷端）因为烟气温度最低，是低温腐蚀最集中的区域。<br />B. 提高空气预热器入口空气温度（如采用暖风器）可减轻低温腐蚀  正确<br />这是最有效的预防措施之一。提高入口空气温度（通常通过暖风器、热风再循环等方法）可以提高空气预热器的冷端壁温，使其高于烟气露点，从而避免酸性蒸汽在管壁上凝结，减轻或避免腐蚀。<br />C. 低温腐蚀的主要原因是烟气中的SO3与水结合生成硫酸，腐蚀管壁  正确<br />这是低温腐蚀的化学机理。燃料中的硫在燃烧过程中生成SO2，其中一部分进一步氧化为SO3。SO3与烟气中的水蒸气结合生成硫酸蒸气。当受热面温度低于硫酸露点时，硫酸蒸气凝结成液态硫酸，对金属管壁产生强烈的酸腐蚀。<br />D. 低温腐蚀不仅影响空气预热器的寿命，还可能对锅炉热效率产生负面影响  正确<br />低温腐蚀的危害是多方面的：一方面，腐蚀会直接导致管壁减薄、穿孔，缩短设备寿命；另一方面，腐蚀产物（如锈垢）和积灰会附着在管壁上，增加传热热阻，降低换热效率；同时，腐蚀造成的漏风（管壁穿孔）会增加排烟热损失，进一步降低锅炉热效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089880", "t": 2, "q": "下列关于锅炉自然循环锅炉与强制循环锅炉的区别，说法正确的有哪些?", "a": ["自然循环锅炉的水循环安全性受负荷影响大，强制循环受负荷影响小", "强制循环锅炉适用于低参数、小容量锅炉，自然循环适用于高参数、大容量锅炉", "自然循环锅炉依靠工质密度差产生循环动力，强制循环依靠循环泵", "自然循环锅炉的下降管无需保温，强制循环锅炉的下降管需保温", "", ""], "r": "AC", "e": "自然循环靠工质密度差循环，受负荷影响大；强制循环靠循环泵，受负荷影响小。自然循环适用于中低参数、中小容量锅炉，强制循环适用于高参数、大容量锅炉。自然循环下降管需保温，强制循环下降管一般不保温。答案：AC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089881", "t": 2, "q": "下列关于回回转式空气预热器的特点，说法正确的有哪些?", "a": ["转子转速越高，传热效率越高，但漏风率会增加", "结构紧凑，占地面积小，适用于大容量锅炉", "传热效率高，可实现烟气与空气的逆流换热", "易发生堵灰和低温腐蚀，需定期清洗", "", ""], "r": "ABCD", "e": "选项 A 转子转速提高可增强扰动、减薄热边界层，使传热系数上升，但转速过快会加大径向/轴向密封间隙处的剪切扰动，导致漏风率上升，该项正确。<br />选项 B 受热面回转式空预器将换热面装于转子内，结构高度集中，相比管式空预器大幅节省平面空间，是大容量电站锅炉的标准配置，该项正确。<br />选项 C 转子转动使烟气与空气形成逆向流动，对数平均温差最大，传热效率高于顺流，该项正确。<br />选项 D 低温段蓄热板壁温低于酸露点时，硫酸蒸汽凝结引发低温腐蚀并黏结飞灰造成堵灰，需设置吹灰器、水洗系统定期清洗，该项正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089882", "t": 2, "q": "下列关于汽轮机冲转前准备工作的说法，正确的有哪些?", "a": ["需确认轴封供汽正常，防止空气进入汽缸", "霭确认润滑油系统正常，油压、油温符合要求", "需确认凝汽器真空达到规定值（通常不低于-80kPa）", "需确认汽轮机转子偏心度在允许范围内，防止动静摩擦", "", ""], "r": "ABCD", "e": "A. 需确认轴封供汽正常，防止空气进入汽缸  正确<br />冲转前在凝汽器建立真空的过程中，必须向轴封供汽，以防空气经轴封间隙漏入汽缸，破坏真空或影响转子温度场。这是建立和维持真空的前提条件之一。<br />B. 需确认润滑油系统正常，油压、油温符合要求  正确<br />润滑油系统是汽轮机的“血液系统”。冲转前必须确认润滑油泵工作正常、油压稳定、油温（通常要求不低于30-38℃）符合要求。油质不合格或油位低时禁止启动。<br />C. 需确认凝汽器真空达到规定值（通常不低于-80kPa）  正确<br />冲转前凝汽器必须建立并维持一定的真空度。虽然具体数值因机组和启动方式而异（如-60kPa至-91kPa不等），但这是冲转的必要条件。低于规定值可能导致排汽温度过高或安全门动作。<br />D. 需确认汽轮机转子偏心度在允许范围内，防止动静摩擦  正确<br />冲转前必须测量转子偏心度（晃度），确保其在制造商规定的允许范围内。若偏心度过大，意味着转子可能存在弯曲，冲转时极易发生动静碰磨，引发振动甚至大轴弯曲事故。<br />因此，四个选项均为汽轮机冲转前需要确认的准备工作，该题应全选。<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089883", "t": 2, "q": "下列关于汽轮机高压加热器停运的影响，说法正确的有哪些?", "a": ["高压加热器停运后，汽轮机的相对内效率会提高，因抽汽减少", "高压加热器停运后，汽轮机的抽汽量减少，发电功率会暂时升高", "高压加热器停运后，锅炉给水温度下降，需增加燃料量以维持蒸发量", "高压加热器停运后，锅炉排烟温度会升高，导致排烟热损失增加", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089884", "t": 2, "q": "下列属于锅炉再热器受热面运行中常见问题的有哪些?", "a": ["再热器进口蒸汽温度低，易发生低温腐蚀", "再热器蒸汽压力高，管壁易发生超温", "再热器蒸汽流量小，对热偏差敏感，易出现局部超温", "再热器布置在高温区域，易受飞灰磨损", "", ""], "r": "CD", "e": "再热器蒸汽流量小，会使各管间吸热不均时热偏差影响更明显，易出现局部超温；再热器布置在高温区域，烟气中飞灰会对其造成磨损。再热器进口蒸汽温度低一般不会发生低温腐蚀；再热器蒸汽压力相对较低。答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089885", "t": 2, "q": "下列属于中速磨煤机（如辊式、碗式）优点的有哪些?", "a": ["对煤种适应性强，可磨硬煤和高水分煤", "磨煤电耗低，运行经济性好", "设备体积小，占地面积小", "运行噪声低，振动小", "", ""], "r": "BCD", "e": "中速磨对煤种有要求，不适合很硬、高水分煤，A 错误；电耗低、占地小、噪声振动小都是中速磨优点。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089886", "t": 2, "q": "以下关于锅炉空气预热器低温腐蚀的预防措施，正确的有（　）", "a": ["提高空气预热器入口空气温度（如采用暖风器）", "降低燃料中的硫含量", "采用耐腐蚀材料制作空气预热器低温段管束", "减少锅炉排烟量，降低烟气中硫酸蒸汽浓度", "", ""], "r": "ABC", "e": "提高入口空气温度可使受热面壁温升高，减轻腐蚀；降低硫含量能减少硫酸蒸汽生成；用耐腐蚀材料可提高抗腐蚀能力。而减少排烟量不一定能降低硫酸蒸汽浓度。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089887", "t": 2, "q": "以下关于锅炉再热器汽温调节方法的正确描述有（　）", "a": ["采用喷水减温，作为紧急调节手段，喷水量不宜过大", "采用再热器进口节流调节，通过改变蒸汽流量调整汽温", "采用烟气再循环，通过增加再热器区域烟气流量提高吸热量", "采用摆动燃烧器，通过改变火焰中心高度调整再热器区域烟气温度", "", ""], "r": "ACD", "e": "这是一道关于锅炉再热器汽温调节方法的选择题。我们来简单分析一下各个选项：A选项：喷水减温通常作为一种紧急调节手段，但它主要是用于降低汽温，而且喷水量确实不宜过大，以免影响蒸汽品质。这个描述是正确的。B选项：再热器进口节流调节实际上是通过改变蒸汽的流通面积来调整汽温，而不是直接改变蒸汽流量。因此，这个描述是不准确的。C选项：烟气再循环是通过将部分烟气重新引入炉膛，增加再热器区域的烟气流量，从而提高再热器的吸热量，达到调节汽温的目的。这个描述是正确的。D选项：摆动燃烧器可以通过改变火焰中心的高度来调整再热器区域的烟气温度，从而影响再热蒸汽的温度。这是一种有效的汽温调节方法。这个描述也是正确的。综上所述，ACD三个选项描述是正确的。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089888", "t": 2, "q": "以下属于锅炉过热器受热面损坏原因的有（　）", "a": ["锅炉负荷波动过大，导致过热器热应力过大", "过热器管结垢，导致传热恶化，壁温升高", "过热器入口蒸汽温度过高，超过设计值", "过热器管内有杂物堵塞，导致局部过热", "", ""], "r": "ABCD", "e": "ABCD选项均会对过热器产生不良影响。负荷波动大产生热应力、管结垢传热恶化、入口蒸汽温度超设计值、管内杂物堵塞局部过热，都可能造成过热器受热面损坏。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089889", "t": 2, "q": "以下属于汽轮机蒸汽流动过程中\"不可逆损失\"的有（　）", "a": ["涡流损失", "节流损失", "湿汽损失", "冲击损失", "", ""], "r": "ABCD", "e": "在汽轮机蒸汽流动中，涡流、节流、湿汽、冲击都会造成能量损耗且过程不可逆。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089890", "t": 2, "q": "影响锅炉空气预热器传热效率的因素有（　）", "a": ["空气预热器的类型（管式或回转式）", "烟气和空气的温度差", "锅炉负荷的变化", "烟气和空气的流量及流速", "", ""], "r": "ABCD", "e": "空气预热器类型不同传热特性不同；烟气和空气温度差是传热动力，温差大传热效率高；锅炉负荷变化影响烟气流速和温度从而影响传热；烟气和空气流量及流速也影响传热效果。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800255396089891", "t": 2, "q": "影响汽轮机回热系统热经济性的因素有（　）", "a": ["回热级数的多少", "抽汽管道的压力损失", "加热器的端差大小", "加热器的疏水方式（逐级自流或疏水泵）", "", ""], "r": "ABCD", "e": "回热级数、抽汽管道压力损失、加热器端差、疏水方式都会对汽轮机回热系统热经济性产生影响。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438017", "t": 3, "q": "汽轮机冲转前的暖管操作，主要目的是提高主蒸汽管道的温度，防止冲转时蒸汽温度过低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438018", "t": 3, "q": "汽轮机冲转时，凝汽器真空越高越好，真空越高，冲转时汽轮机的轴向推力越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "凝汽器真空并非越高越好，真空过高会使进汽量减少，延长暖机时间，还可能导致排汽温度过低等问题。且真空高时蒸汽比容大，进汽量少，可能使轴向推力增大而非减小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438019", "t": 3, "q": "汽轮机冲转时，若转子临界转速低于额定转速，应快速通过临界转速，以避免转子发生共振。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "临界转速下转子会发生共振，可能损坏设备，当转子临界转速低于额定转速时，快速通过临界转速可减少共振影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438020", "t": 3, "q": "汽轮机冲转时，若转子偏心度超过允许值，会导致转子振动过大，损坏汽轮机部件。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "转子偏心度超允许值时，冲转过程中转子旋转的不平衡力会增大，进而使转子振动过大，严重时会损坏汽轮机部件。", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438021", "t": 3, "q": "汽轮机抽汽参数（压力、温度）随抽汽口所在汽缸压力的升高而升高，故高压加热器的抽汽参数高于低压加热器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "汽轮机抽汽压力、温度通常与抽汽口所在汽缸压力相关，高压缸压力高于低压缸，抽汽参数也高，所以高压加热器抽汽参数高于低压加热器。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438022", "t": 3, "q": "汽轮机的临界转速是指转子发生共振时的转速，机组运行时应避免在临界转速附近长时间停留。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "汽轮机转子存在临界转速，在此转速下转子会发生共振，共振会产生较大振动，可能损坏设备，所以运行时要避免在临界转速附近长时间停留。", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438023", "t": 3, "q": "汽轮机的相对内效率是指汽轮机的实际内功率与理想内功率的比值，反映汽轮机内部损失的大小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这符合汽轮机相对内效率的定义，它体现内部损失情况。", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438024", "t": 3, "q": "汽轮机的余速损失是指蒸汽离开动叶后仍具有的动能，该部分动能无法回收利用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "余速损失是蒸汽离开动叶尚保留动能，在多级汽轮机中，下一级可以部分回收该动能，不是一定无法回收。", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438025", "t": 3, "q": "汽轮机低压缸的排汽压力越低，机组的热效率越高，因此排汽压力越低越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然一般情况下汽轮机低压缸排汽压力降低，机组热效率会提高，但排汽压力不能无限制降低。排汽压力过低会使末级蒸汽湿度增加，加剧对叶片的侵蚀，还会增加真空泵等设备的功耗和投资，且受到环境温度等条件限制。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438026", "t": 3, "q": "汽轮机高压缸的抽汽压力高于低压缸的抽汽压力，因此高压加热器的加热温度高于低压加热器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽汽压力高，蒸汽焓值高，能释放的热量多，加热温度就高，所以高压缸抽汽供的高压加热器加热温度高于低压缸抽汽供的低压加热器。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438027", "t": 3, "q": "汽轮机回热加热器的端差是指加热器进口给水温度与抽汽饱和温度的差值，端差越小，换热效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "汽轮机回热加热器端差是指加热器抽汽饱和温度与出口给水温度的差值，而非进口给水温度与抽汽饱和温度差值。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438028", "t": 3, "q": "汽轮机回热加热器的端差为正值，即加热器出口给水温度低于加热蒸汽的饱和温度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在汽轮机回热加热器中，端差定义就是加热蒸汽饱和温度与加热器出口给水温度之差，所以为保证端差是正值，出口给水温度必然低于加热蒸汽的饱和温度。该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438029", "t": 3, "q": "汽轮机回热加热器的端差为正值，若端差为负值，说明加热器运行异常，可能是由于加热器内结垢严重导致。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "回热加热器端差正常为正值，端差为负是运行异常，结垢严重会使传热热阻增大，蒸汽凝结温度升高，端差变大，一般不会导致端差为负，端差为负可能是疏水水位过高等原因。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438030", "t": 3, "q": "汽轮机回热加热器管束泄漏会导致加热器水位升高，出口给水温度降低，端差增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "加热器管束泄漏，水会进入汽侧使水位升高；泄漏使部分蒸汽被冷却，用于加热给水的蒸汽量减少，出口给水温度降低；端差是加热器压力下饱和温度与出口水温之差，水温降低会使端差增大。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438031", "t": 3, "q": "汽轮机回热系统中，除氧器的工作压力越高，除氧效果越好，因此除氧器压力越高越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然除氧器工作压力升高在一定程度上能改善除氧效果，但压力过高会带来诸多问题，如设备强度要求提高、运行成本增加、安全风险增大等，并非压力越高越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438032", "t": 3, "q": "汽轮机回热系统中，高压加热器的抽汽压力高于低压加热器的抽汽压力，其出口给水温度也高于低压加热器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在汽轮机回热系统里，高压加热器用的是压力较高的抽汽来加热给水，低压加热器用较低压力抽汽，高压抽汽热量更多，能使给水加热到更高温度。所以高压加热器抽汽压力高于低压加热器，其出口给水温度也更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438033", "t": 3, "q": "汽轮机回热系统中，混合式加热器的换热效率高于表面式加热器，因为混合式加热器无端差损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "混合式加热器中汽水直接混合，无传热端差，避免了端差带来的不可逆损失，所以换热效率高于表面式加热器。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438034", "t": 3, "q": "汽轮机回热系统中，若高压加热器停运，为保护锅炉，应降低锅炉的给水温度和负荷。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "高压加热器停运，给水温度会降低，为保证蒸汽参数和机组安全稳定运行，应降低锅炉负荷，但不能降低给水温度，因高压加热器停运本身已使给水温度下降。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438035", "t": 3, "q": "汽轮机临界转速的数值与转子的材料、直径、长度及支承方式无关，仅与转子的转速有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "汽轮机临界转速与转子的材料、直径、长度及支承方式等都有关，并非仅与转子转速有关。", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438036", "t": 3, "q": "汽轮机喷嘴内蒸汽的流动为等熵流动，无能量损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438037", "t": 3, "q": "汽轮机叶片上的冲击损失主要发生在叶片进口处，当蒸汽进入叶片的实际角度与设计角度不符时，冲击损失会增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "汽轮机叶片进口处，蒸汽实际进入角度与设计角度不符时，会产生冲击，导致冲击损失增大，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438038", "t": 3, "q": "汽轮机运行中，鼓风损失主要发生在高压缸的调节级，因为调节级通流面积随负荷变化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "鼓风损失主要发生在部分进汽的级，如调节级，在低负荷时，调节级部分进汽，不进汽的动叶通道中蒸汽随动叶旋转被鼓荡，产生鼓风损失，且调节级通流面积随负荷改变，所以题干描述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438039", "t": 3, "q": "汽轮机运行中，若蒸汽参数（压力、温度）突然降低，会导致汽轮机的轴向推力减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "蒸汽参数突然降低时，蒸汽焓降减少，各级反动度增大，轴向推力会增大而非减小。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438040", "t": 3, "q": "汽轮机运行中，湿汽损失主要发生在低压缸的末几级，因为此处蒸汽压力低，易出现湿蒸汽。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "低压缸末几级蒸汽压力低、温度低，蒸汽易达到饱和状态而出现湿蒸汽，湿蒸汽会带来湿汽损失。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438041", "t": 3, "q": "汽轮机运行中，轴向推力的大小与汽轮机的负荷无关，仅与蒸汽参数有关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "汽轮机运行中，轴向推力大小既与蒸汽参数有关，也和汽轮机负荷相关，负荷变化会使蒸汽流量改变，进而影响轴向推力。所以题干说与负荷无关错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438042", "t": 3, "q": "汽轮机蒸汽流动过程中，熵增越大，说明蒸汽的能量损失越大，机组的热效率越低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "熵是衡量系统无序程度和能量损失的指标，蒸汽流动中熵增大意味着不可逆损失大，能量有效利用程度低，热效率就低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438043", "t": 3, "q": "汽轮机蒸汽流动过程中的节流损失是可逆损失，可通过优化管道设计完全避免。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "节流损失是不可逆损失，且无法通过优化管道设计完全避免。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438044", "t": 3, "q": "汽轮机蒸汽在叶片上产生的作用力仅与蒸汽的动量变化有关，与蒸汽的压力变化无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "汽轮机蒸汽在叶片上产生的作用力不仅与蒸汽动量变化有关，蒸汽压力变化也会产生作用力，如蒸汽压力差会对叶片产生推力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438045", "t": 3, "q": "汽轮机蒸汽在叶片上的流动损失主要包括摩擦损失、涡流损失和冲击损失，这些损失均属于不可逆损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在汽轮机中，蒸汽在叶片上的摩擦、形成涡流以及冲击叶片过程中，都会使机械能转化为热能等无法再完全转化回有用机械能的形式，所以这些损失都属于不可逆损失。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438046", "t": 3, "q": "汽轮机轴封供汽温度过高会导致轴颈过热，过低会导致轴颈冷却收缩，均会产生热应力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴封供汽温度过高，轴颈受热膨胀；温度过低，轴颈冷却收缩，这两种情况都会使轴颈产生热应力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438047", "t": 3, "q": "汽轮机轴封供汽温度应严格控制，若供汽温度过高，会导致转子局部过热，产生热应力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴封供汽温度过高，会使转子局部受热不均，产生热应力，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438048", "t": 3, "q": "汽轮机轴封供汽压力过高会导致轴封漏汽量增加，压力过低会导致空气进入汽缸，因此需严格控制供汽压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴封供汽压力过高，轴封处内外压差大，漏汽量就会增加；压力过低，轴封处压力低于外界大气压，空气会进入汽缸，所以要严格控制供汽压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438049", "t": 3, "q": "汽轮机轴封加热器的作用是加热凝结水，回收轴封漏汽的热量，提高机组热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "轴封加热器主要作用是回收轴封漏汽并利用其热量加热凝结水，减少工质和热量损失，从而提高机组热效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438050", "t": 3, "q": "汽轮机轴封系统的漏汽回收至轴封加热器，加热凝结水，可减少热量损失，提高机组热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "汽轮机轴封系统漏汽有一定热量，回收至轴封加热器加热凝结水，使这部分热量得到利用，减少了热量浪费，能提高机组热效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438051", "t": 3, "q": "汽轮机轴封系统中，低压轴封的作用是防止高压缸内的蒸汽向外泄漏。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "低压轴封作用是防止外界空气漏入低压缸内，而防止高压缸内蒸汽向外泄漏是高压轴封的作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438052", "t": 3, "q": "汽轮机轴封系统中，低压轴封供汽压力过高会导致空气漏入凝汽器，破坏凝汽器真空。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "低压轴封供汽压力过高会使蒸汽外漏，而不是空气漏入凝汽器。空气漏入凝汽器通常是供汽压力过低导致的。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438053", "t": 3, "q": "汽轮机轴封系统中，高压轴封漏汽需全部排入大气，无法回收利用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "汽轮机高压轴封漏汽并非全部排入大气，部分可回收利用，如引入低压加热器等设备。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438054", "t": 3, "q": "球磨机的磨煤电耗随煤粉细度变细而增加，随煤的可磨性系数增大而减少。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "煤粉细度变细意味着要将煤磨得更细，需要消耗更多能量，所以磨煤电耗增加；煤的可磨性系数越大，煤越容易磨碎，磨煤电耗就会减少。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438055", "t": 3, "q": "燃料的挥发分含量越高，其着火温度越低，燃烧速度越快。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "挥发分高的燃料在加热时易析出可燃气体，所以着火温度低，且可燃气体与空气接触面积大，反应更充分，燃烧速度快。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438056", "t": 3, "q": "省煤器采用逆流布置时，传热温差最大，传热效率最高，因此所有锅炉的省煤器均采用逆流布置。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然逆流布置传热温差大、效率高，但实际中并非所有锅炉省煤器都采用逆流布置，还需综合考虑其他因素，如流动阻力、水动力特性等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438057", "t": 3, "q": "再热器的工作压力低于过热器，因此其管壁厚度通常小于过热器。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "再热器工作压力低于过热器，在其他条件相近时，压力低所需承受的压力小，管壁厚度相对就可薄些。所以该表述正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438058", "t": 3, "q": "直吹式制粉系统的煤粉细度调节主要通过改变磨煤机的通风量实现，通风量越大，煤粉越细。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "直吹式制粉系统中，通风量越大，煤粉在磨煤机内停留时间越短，磨制时间不足，煤粉会越粗，并非越细。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438059", "t": 3, "q": "中速磨煤机不适用于磨制硬煤（可磨性系数小的煤），因磨辊磨损严重。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "硬煤可磨性系数小，较难磨制，中速磨煤机磨硬煤时磨辊与煤的摩擦力大，会导致磨辊磨损严重，所以不适用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438060", "t": 3, "q": "中速磨煤机制粉系统属于直吹式制粉系统，磨制的煤粉直接送入炉膛燃烧，无需煤粉仓储存。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "中速磨煤机制粉系统常见的有直吹式，直吹式就是磨制的煤粉直接送入炉膛燃烧，不设煤粉仓储存。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438061", "t": 3, "q": "自然循环锅炉的下降管带汽会增加循环动力，提高水循环安全性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自然循环锅炉下降管带汽会使下降管工质密度减小，与上升管工质密度差减小，从而降低循环动力，降低水循环安全性。", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438062", "t": 3, "q": "自然循环锅炉的循环倍率随锅炉负荷升高而增大，负荷降低而减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自然循环锅炉中，循环倍率随锅炉负荷升高而减小，负荷降低而增大。因为负荷升高时，汽水混合物中蒸汽含量增加，运动压头虽增大，但水的流量相对减少，循环倍率降低。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438063", "t": 3, "q": "自然循环锅炉的循环倍率随锅炉负荷升高而增大，随压力升高而减小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "自然循环锅炉的循环倍率随锅炉负荷升高而减小，随压力升高也减小。所以题干表述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438064", "t": 3, "q": "SCR脱硝系统的催化剂活性随运行时间延长而逐渐衰减，主要原因是催化剂中毒和积灰。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在SCR脱硝系统中，催化剂在长期运行时，会受到烟气中有害物质影响而中毒，同时烟气中的灰尘会在催化剂表面堆积，这两种情况都会使催化剂活性逐渐衰减。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800256612438065", "t": 3, "q": "SNCR脱硝系统无需催化剂，因此其反应温度窗口比SCR宽。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "SNCR脱硝系统无催化剂，需较高温度促使反应进行，温度窗口窄；SCR有催化剂，反应可在较宽温度范围进行。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第5章 热工控制系统（1）", "n": "基础练习题【含解析】 / 第5章 热工控制系统（1）", "qs": [{"id": "2034800259527479296", "t": 1, "q": "PID控制器正作用的定义是", "a": ["当被控量（测量值）大于给定值时，控制器输出增加", "当被控量（测量值）大于给定值时，控制器输出减少", "控制器输出与被控量变化无关", "当被控量（测量值）小于给定值时，控制器输出减少", "", ""], "r": "A", "e": "PID控制器正作用指被控量（测量值）大于给定值时，控制器输出增加。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479297", "t": 1, "q": "在\"炉跟机\"协调控制方式下，负荷指令增加时的调节顺序是", "a": ["锅炉先增燃料，汽轮机后增调门", "仅汽轮机调整，锅炉不动作", "汽轮机先增调门，锅炉后增燃料", "机炉同时增减负荷", "", ""], "r": "C", "e": "炉跟机方式下，以汽轮机调节负荷，锅炉调节汽压。负荷指令增加时，先开大汽轮机调门增加功率，再增加锅炉燃料维持汽压。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479298", "t": 1, "q": "被控对象存在较大纯滞后时，仅用常规PID易超调大、响应滞后，可引入哪种改进措施改善效果?", "a": ["引入微分先行控制", "增大微分时间Td", "减小积分时间Ti", "增大比例系数Kp", "", ""], "r": "A", "e": "纯滞后系统常规PID控制效果差，微分先行控制可提前动作，改善超调大、响应滞后问题。增大微分时间、减小积分时间、增大比例系数可能使控制效果更差。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479299", "t": 1, "q": "被控对象干扰频繁幅度大，为增强抗干扰能力，PID参数调整措施是?", "a": ["增大Kp，减小Ti", "减小Kp，增大Ti", "增大Kp，增大Ti", "减小Kp，减小Ti", "", ""], "r": "A", "e": "分析各参数对抗干扰能力的影响：<br />Kp（比例增益）：增大Kp，控制器对偏差的反应更灵敏、作用更强，能更快克服干扰，但过大会导致系统振荡。<br />Ti（积分时间）：减小Ti，积分作用增强，能更快消除静差，但过小会导致超调增加和振荡。<br />Td（微分时间）：虽然微分作用能提前响应偏差变化速率，但此选项未涉及，故主要分析比例和积分。<br />为了增强抗干扰能力，通常需要：<br />增大Kp：提高响应速度，快速抑制干扰。<br />减小Ti：增强积分作用，加快消除偏差，但需注意稳定性。<br />选项对比：<br />A. 增大Kp，减小Ti  符合增强抗干扰能力的要求，但需注意防止过度振荡。<br />B. 减小Kp，增大Ti  会降低响应速度，不利于抗干扰。<br />C. 增大Kp，增大Ti  增大Ti会减弱积分作用，不利于消除干扰引起的偏差。<br />D. 减小Kp，减小Ti  减小Kp会降低响应速度，不利于快速抑制干扰，且积分作用增强可能带来稳定性问题。", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479300", "t": 1, "q": "被控对象惯性大，为提高响应速度，应采取的措施是?", "a": ["增大Kp，减小Ti", "减小Kp，增大Ti", "增大Td，适当减小Kp", "减小Td，适当增大Kp", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479301", "t": 1, "q": "标准孔板测蒸汽流量，温度高于设计值（无补偿），测量值与实际值比?", "a": ["偏高", "不确定", "不变", "偏低", "", ""], "r": "D", "e": "标准孔板测流量公式中，温度升高（无补偿），密度变小，流量测量值会偏低。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479302", "t": 1, "q": "不属于热工控制静态性能指标的是?", "a": ["衰减比", "静态偏差", "余差", "最大偏差", "", ""], "r": "A", "e": "热工控制静态性能指标主要关注系统稳定后的状态，余差、静态偏差本质相同，都是稳定后与设定值的差值。最大偏差是动态过程中出现的最大偏离值，属于动态性能指标。衰减比描述系统振荡衰减程度，也属于动态指标。本题问不属于静态性能指标的，答案选A、D 。不过通常此题标准答案更倾向选D ，因为最大偏差明显是动态指标，而衰减比在分析系统稳定性时有动态和静态综合考量因素。答案：D 。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479303", "t": 1, "q": "测量锅炉主蒸汽压力时，变送器安装位置高于取压点，会导致测量值", "a": ["偏低", "无偏差", "随温度波动", "偏高", "", ""], "r": "A", "e": "变送器高于取压点，导压管内液柱产生的静压会使测量值比实际值偏低。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479304", "t": 1, "q": "测炉膛压力时，为避免高温粉尘影响仪表，应采取的措施是?", "a": ["管路加冷却装置和除尘器", "用热电偶测压", "减小变送器量程", "变送器装炉膛内壁", "", ""], "r": "A", "e": "为避免高温粉尘影响仪表，给管路加冷却装置可降低温度，加除尘器可去除粉尘。热电偶是测温元件，不能用于避免高温粉尘影响；减小量程与避免高温粉尘无关；变送器装炉膛内壁更易受高温粉尘影响。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479305", "t": 1, "q": "串级控制系统\"副回路跟随性\"是指?", "a": ["主被控量快速跟踪副控制器输出", "副被控量快速跟踪扰动", "副被控量快速跟踪主控制器输出", "主被控量快速跟踪负荷指令", "", ""], "r": "C", "e": "串级控制系统中副回路跟随性指副被控量快速跟踪主控制器输出。主控制器输出给副控制器作为设定值，副回路要快速响应使副被控量跟踪该设定值。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479306", "t": 1, "q": "串级控制系统中，副被控量的选择应满足", "a": ["能快速反映副扰动的影响", "与主被控量无直接关联", "应优先考虑控制的经济性", "测量难度大", "", ""], "r": "A", "e": "串级控制系统中副被控量要能快速反映副扰动影响，这样才能及时调整副回路，更好地控制主被控量。副被控量与主被控量有关联，控制经济性不是优先考虑的，测量难度大不利于控制。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479307", "t": 1, "q": "串级控制系统中，副回路的主要作用是", "a": ["快速克服作用于副回路的扰动", "降低系统对主扰动的敏感性", "减小主回路的开环增益", "稳定主被控量的稳态值", "", ""], "r": "A", "e": "副回路能快速检测并克服作用于副回路的扰动，这是其主要作用。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479308", "t": 1, "q": "串级控制系统中，若副调节器采用比例控制，主调节器采用PI控制，其主要设计目的是", "a": ["副回路快速克服扰动，主回路消除静态偏差", "副回路消除静态偏差，主回路快速响应", "两者共同消除静态偏差，提高响应速度", "简化控制逻辑，降低硬件成本", "", ""], "r": "A", "e": "副调节器比例控制响应快，能快速克服副回路内扰动；主调节器PI控制可消除系统静态偏差。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479309", "t": 1, "q": "串级控制系统中，主、副控制器控制规律选择通常为?", "a": ["主P、副PID", "均为纯P", "主PID、副P或PI", "主PI、副PID", "", ""], "r": "C", "e": "主控制器要消除多种干扰对被控变量影响，一般采用PID控制；副控制器起快速随动作用，通常用P或PI控制。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479310", "t": 1, "q": "串级控制系统中，主控制器通常采用的控制规律是", "a": ["比例控制（P）", "比例-积分控制（PI）", "比例-微分控制（PD）", "比例-积分-微分控制（PID）", "", ""], "r": "B", "e": "主控制器要消除稳态误差，实现无差控制，PI控制能兼顾稳定性和消除稳态误差。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479311", "t": 1, "q": "串级控制中副回路时间常数远小于主回路，目的是?", "a": ["提高主控制器Kp", "避免主副回路耦合振荡", "增大副回路精度", "减小主回路调节时间", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479312", "t": 1, "q": "单回路控制系统设计中，控制器正反作用选择的核心依据是", "a": ["执行器的型号规格", "被控对象的滞后大小", "保证系统为负反馈", "测量仪表的精度等级", "", ""], "r": "C", "e": "控制器正反作用选择是为保证整个控制系统构成负反馈，只有负反馈才能使系统稳定运行。答案：C<br />选项A“执行器的型号规格”虽然会影响最终控制效果，但它并不是决定控制器正反作用的关键因素;选项B“被控对象的滞后大小”更多地影响着控制器参数的整定以及控制策略的选择，而不是直接决定控制器的作用方式;选项D“测量仪表的精度等级”则主要关系到信号采集的准确性，同样不直接影响控制器应采取何种作用方式。因此，正确答案为C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479313", "t": 1, "q": "单回路控制系统投运\"先手动后自动\"，主要目的是?", "a": ["校准测量仪表精度", "测试控制器正反向", "避免控制器初始输出过大致系统剧烈波动", "检查阀门是否正常", "", ""], "r": "C", "e": "单回路控制系统投运“先手动后自动”，是为防止自动控制一开始输出过大，使系统剧烈波动，手动先稳定工况再切自动。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479314", "t": 1, "q": "单回路控制系统整定参数时，若采用衰减曲线法，通常要求过渡过程的衰减比为", "a": ["2:1", "1:1", "10:1", "4:1", "", ""], "r": "D", "e": "衰减曲线法整定参数时，通常希望过渡过程呈现良好的动态性能，一般要求衰减比为4:1 。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479315", "t": 1, "q": "单回路控制系统中，被控对象时间常数增大，应调整PID参数为", "a": ["增大Kp，增大Td", "减小Kp，减小Td", "减小Kp，增大Ti", "增大Kp，减小Ti", "", ""], "r": "D", "e": "根据搜索结果中PID参数整定的相关原则，当单回路控制系统中被控对象的时间常数增大时，系统的响应会变慢，动态特性变差。为了改善控制品质，通常需要调整PID参数以增强响应速度。<br />时间常数增大对系统的影响：<br />时间常数越大，被控对象对输入变化的响应越迟缓，系统惯性越大。<br />为了克服这种滞后，需要让控制器“更积极”地动作。<br />参数调整原则：<br />增大比例系数 Kp：可以加快系统响应速度，减小稳态误差，但过大会导致超调量增加和振荡。<br />减小积分时间 Ti（即增强积分作用）：可以更快地消除偏差，但过强会导致系统不稳定。<br />微分时间 Td 主要用于抑制超调和预测变化趋势，但在此问题中主要关注比例和积分参数的调整。<br />综合来看，为应对被控对象时间常数增大导致的响应迟缓，应增大Kp以加快响应，同时减小Ti以增强积分作用来消除偏差。这与选项 D. 增大Kp，减小Ti 一致。", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479316", "t": 1, "q": "单回路控制系统中，对象\"输入增→被控量增\"、阀门\"输入增→开度增（气开阀）\"，控制器应选哪种作用构成负反馈?", "a": ["先正后反", "正作用", "与阀门无关", "反作用", "", ""], "r": "D", "e": "当对象“输入增→被控量增”，气开阀“输入增→开度增”时，为构成负反馈，控制器应选反作用，即被控量增大时，控制器输出减小。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479317", "t": 1, "q": "单回路控制系统中，若被控对象滞后较大，为提高控制质量，应优先考虑", "a": ["增大比例系数", "引入微分作用", "减小积分时间", "降低测量仪表精度", "", ""], "r": "B", "e": "被控对象滞后较大时，微分作用能根据偏差变化的速度提前动作，改善系统的动态性能，提高控制质量。增大比例系数可能导致系统不稳定；减小积分时间主要影响消除稳态误差速度；降低测量仪表精度会使控制变差。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479318", "t": 1, "q": "单元机组给水控制系统中，应对\"虚假水位\"最有效的控制方案是", "a": ["水位-给水流量控制", "水位-蒸汽流量前馈-反馈控制", "手动给水控制", "单回路水位控制", "", ""], "r": "B", "e": "“虚假水位”是指当蒸汽流量变化时，汽包水位会出现与负荷变化方向相反的暂时变化。采用水位 - 蒸汽流量前馈 - 反馈控制，前馈可根据蒸汽流量变化提前动作，克服“虚假水位”对控制的影响。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479319", "t": 1, "q": "对象\"输入增→被控量减\"、阀门\"输入增→开度减（气关阀）\"，控制器选哪种作用构成负反馈?", "a": ["按负荷调整", "正作用", "反作用", "均可", "", ""], "r": "C", "e": "对于对象“输入增→被控量减”，阀门“输入增→开度减”，要构成负反馈，控制器应选反作用。因为当被控量增大时，需要控制器输出减小使阀门开度减小来调节，反作用控制器能实现此功能。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479320", "t": 1, "q": "反馈控制的本质是", "a": ["利用被控量的偏差纠正偏差", "提前补偿扰动的影响", "无需被控量测量即可工作", "根据扰动信号调节输出", "", ""], "r": "A", "e": "反馈控制是将系统的输出信号引回输入端，与输入信号比较得到偏差信号，再利用偏差信号去控制被控对象以纠正偏差。B是前馈控制特点；反馈控制需测量被控量，C错误；它是根据偏差而非扰动信号调节输出，D错误。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479321", "t": 1, "q": "反馈控制系统中，被控对象滞后时间增大，对稳定性的影响是?", "a": ["稳定性与滞后无关", "稳定性减弱，易振荡", "稳定性不变，超调量减小", "稳定性增强，调节时间缩短", "", ""], "r": "B", "e": "被控对象滞后时间增大，会使系统响应延迟，偏差不能及时纠正，导致系统稳定性减弱，容易产生振荡。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479322", "t": 1, "q": "反馈控制系统中，哪种控制规律无法消余差?", "a": ["比例（P）控制", "比例-积分（PI）控制", "比例-积分-微分（PID）控制", "积分（I）控制", "", ""], "r": "A", "e": "比例控制是依据偏差大小来动作，不能消除余差；积分控制能消除余差；PI和PID控制因包含积分作用也可消除余差。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479323", "t": 1, "q": "分析火电机组主汽压控制系统动态性能时，下列哪项属于频域性能指标", "a": ["超调量", "峰值时间", "幅值裕度", "调节时间", "", ""], "r": "C", "e": "超调量、峰值时间、调节时间是时域性能指标，幅值裕度是频域性能指标。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479324", "t": 1, "q": "给水控制系统中，当锅炉负荷突然增加时，汽包水位先上升后下降的原因是", "a": ["给水流量突然增加", "燃料量突然减少", "炉膛温度突然降低", "汽包压力突然下降导致水容积膨胀", "", ""], "r": "D", "e": "当锅炉负荷突然增加，汽包压力突然下降，水的沸点降低，水迅速汽化，导致水容积膨胀，水位先上升；之后因蒸汽量增加，而给水未及时跟上，水位下降。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479325", "t": 1, "q": "给水控制系统中，双冲量控制是指引入的信号为", "a": ["汽包水位和给水流量", "蒸汽流量和给水流量", "汽包水位和蒸汽流量", "汽包水位和炉膛温度", "", ""], "r": "C", "e": "双冲量控制是在单冲量（汽包水位）基础上引入蒸汽流量信号，能提前克服“虚假水位”影响。所以双冲量控制引入的信号是汽包水位和蒸汽流量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479326", "t": 1, "q": "给水三冲量控制系统中，作为前馈信号以克服\"虚假水位\"的是", "a": ["蒸汽流量信号", "汽包水位信号", "给水流量信号", "炉膛压力信号", "", ""], "r": "A", "e": "“虚假水位”是由于蒸汽流量变化引起的，引入蒸汽流量信号作为前馈信号可提前补偿，克服“虚假水位”。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479327", "t": 1, "q": "根据劳斯稳定判据，若系统特征方程的劳斯阵列第一列所有元素均为正，则系统", "a": ["临界稳定", "稳定", "无法判断", "不稳定", "", ""], "r": "B", "e": "劳斯稳定判据规定，系统特征方程的劳斯阵列第一列所有元素均为正，系统稳定。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479328", "t": 1, "q": "关于前馈控制，下列说法正确的是", "a": ["仅需测量被控量即可实现控制", "必须已知扰动的大小及扰动对被控量的影响通道特性", "需要根据被控量与给定值的偏差调节输出", "对未测量到的扰动有良好的抑制效果", "", ""], "r": "B", "e": "前馈控制是按扰动进行补偿的控制方式，需已知扰动大小及扰动对被控量的影响通道特性来提前补偿。A仅测被控量是反馈控制；C按偏差调节是反馈控制；D前馈不能对未测扰动有效抑制。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479329", "t": 1, "q": "关于前馈控制系统，错误的是?", "a": ["作用速度比反馈慢", "无法克服不可测扰动", "通常与反馈结合使用", "控制精度取决于扰动测量和补偿算式", "", ""], "r": "A", "e": "前馈控制作用速度比反馈快，A选项说作用速度比反馈慢错误。B选项前馈无法克服不可测扰动正确；C选项常与反馈结合使用正确；D选项控制精度取决于扰动测量和补偿算式也正确。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479330", "t": 1, "q": "关于前馈与反馈控制本质区别，正确的是?", "a": ["前馈能消余差，反馈不能", "前馈适用于慢过程，反馈适用于快过程", "前馈需测被控量，反馈不需要", "前馈基于扰动动作，反馈基于偏差动作", "", ""], "r": "D", "e": "前馈控制是基于扰动进行调节，在干扰影响被控变量之前就采取措施；而反馈控制是根据被控变量与设定值的偏差来动作。A选项，前馈和反馈都可能存在余差；B选项，前馈和反馈对快慢过程适用性并非如此绝对；C选项，前馈不一定要测被控量，反馈需要。所以本质区别是D选项。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479331", "t": 1, "q": "锅炉给水串级控制系统中，副回路被控量为给水流量，副回路主要克服的扰动是?", "a": ["炉膛热负荷变化", "蒸汽流量变化", "给水压力变化", "汽包水位变化", "", ""], "r": "C", "e": "在锅炉给水串级控制系统中，副回路（内环）的控制对象是给水流量，其主要任务是快速克服来自给水系统内部的扰动，其中最典型的就是给水压力变化。<br />逐一分析各选项：<br />C. 给水压力变化（正确）：给水压力波动（如给水泵转速变化、调节阀前后压差变化等）会直接影响给水流量。副回路通过快速调节给水调节阀，能迅速克服这一内扰，是副回路设计的主要目标。<br />A. 炉膛热负荷变化（错误）：热负荷变化会改变蒸发量，进而影响汽包水位，这属于主回路需要克服的外扰。副回路对此无直接作用。<br />B. 蒸汽流量变化（错误）：蒸汽流量变化是引起汽包水位变化的主要“虚假水位”扰动来源之一，同样属于主回路需要处理的外扰，副回路不负责克服。<br />D. 汽包水位变化（错误）：水位变化是被控量（主变量）本身的变化，是系统需要调节的对象，而非需要克服的扰动。<br />总结：串级控制的副回路设计原则是“快调内扰”，给水压力波动是副回路最直接、最主要需要克服的扰动。因此答案是 C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479332", "t": 1, "q": "锅炉给水三冲量控制中，蒸汽流量信号作用是?", "a": ["监测负荷扰动", "前馈补偿蒸汽流量对水位的影响", "副回路被控量稳流量", "反馈校正水位偏差", "", ""], "r": "B", "e": "在锅炉给水三冲量控制里，蒸汽流量信号可提前感知蒸汽流量变化，对水位的影响进行前馈补偿。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479333", "t": 1, "q": "锅炉过热汽温被控对象存在大滞后时，下列控制策略最优的是", "a": ["PID+前馈+串级控制", "单纯PID控制", "比例控制", "积分控制", "", ""], "r": "A", "e": "当锅炉过热汽温被控对象存在大滞后时，单纯PID、比例控制、积分控制难以有效应对滞后问题。而PID+前馈+串级控制结合了前馈控制可提前补偿干扰，串级控制能快速克服内扰，PID控制保证系统稳定性，能更好适应大滞后对象。所以最优控制策略是A。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479334", "t": 1, "q": "锅炉汽温\"喷水减温\"控制中，主蒸汽温度偏高时应如何调整?", "a": ["减小减温水流量", "减小空气量", "增大减温水流量", "增大燃料量", "", ""], "r": "C", "e": "主蒸汽温度偏高，需要降温，喷水减温就是通过喷入减温水实现降温，所以应增大减温水流量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479335", "t": 1, "q": "锅炉汽温串级控制系统中，主、副被控量通常分别是?", "a": ["减温器出口蒸汽温度、主蒸汽温度", "给水温度、主蒸汽温度", "主蒸汽温度、减温器出口蒸汽温度", "主蒸汽压力、主蒸汽温度", "", ""], "r": "C", "e": "在锅炉汽温串级控制系统中，主被控量是最终要控制稳定的量即主蒸汽温度，副被控量用于快速消除干扰，常为减温器出口蒸汽温度。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479336", "t": 1, "q": "锅炉燃烧协调控制中，负荷指令增加时，通常先调整哪种参数再调空气量?", "a": ["汽包水位", "燃料量", "排烟温度", "蒸汽压力", "", ""], "r": "B", "e": "在锅炉燃烧协调控制里，负荷指令增加时，为保证及时响应负荷需求，通常先增加燃料量，之后再调整空气量以保证燃料充分燃烧。所以答案是B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800259527479337", "t": 1, "q": "锅炉燃烧协调控制中，烟气含氧量控制的主要目的是?", "a": ["降低炉膛温度", "保证燃料完全燃烧的同时减少过量空气损失", "减少排烟温度", "提高蒸汽压力", "", ""], "r": "B", "e": "烟气含氧量控制是为在保证燃料充分燃烧的同时，减少因过量空气带来的热损失。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996480", "t": 2, "q": "串级控制系统的适用场合包括", "a": ["单回路控制难以满足要求", "被控对象滞后较大", "扰动作用于主回路且变化缓慢", "扰动变化频繁且幅度大", "", ""], "r": "ABD", "e": "当单回路控制难以满足要求、被控对象滞后较大、扰动频繁且幅度大时，串级控制系统能更好发挥作用。而扰动作用于主回路且变化缓慢，并非串级控制系统典型适用情况。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996481", "t": 2, "q": "串级控制系统的整定步骤通常为", "a": ["先整定主控制器，再整定副控制器", "主控制器整定成无超调特性", "副控制器整定成衰减振荡特性（如4:1）", "副控制器整定成快速响应特性", "", ""], "r": "BCD", "e": "串级控制系统的整定必须遵循 \"先副环，后主环\" 的原则 。副回路（内环）的作用是快速克服进入副回路的干扰，改善对象动态特性；主回路（外环）则负责精确控制主被控量。<br />各选项分析：<br />A. 先整定主控制器，再整定副控制器  错误。正确的顺序是 先整定副控制器，再整定主控制器 。如果先整定主环，由于副环动态特性不稳定，会导致主回路整定基础不牢固，难以获得理想效果 。<br />B. 主控制器整定成无超调特性  正确。主控制器起定值控制作用，任务是使主参数等于给定值（无余差），通常采用 PI 或 PID 控制规律，要求稳态精度高，动态过程平稳，避免产生大幅超调 。<br />C. 副控制器整定成衰减振荡特性（如4:1）  正确。两步整定法中，第一步整定副回路时，通常采用 4:1 衰减曲线法，使副回路响应呈现 4:1 的衰减振荡过程 。常见的经验公式表明，副调节器在纯比例作用下的整定即以此衰减比为目标 。<br />D. 副控制器整定成快速响应特性  正确。副回路是一个随动系统，其输出要求能快速、准确地复现主调节器输出信号的变化规律 。副控制器通常采用 P 或 PI 控制，目标是 响应快、无超调，能快速跟踪设定值并抑制扰动 。副回路被描述为 \"先调、粗调、快调\"，而主回路则是 \"后调、细调、慢调\" 。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996482", "t": 2, "q": "串级控制系统相比单回路的优点有（　）", "a": ["系统响应速度更快", "对副回路扰动抑制能力强", "控制精度更高", "适应对象参数变化能力强", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996483", "t": 2, "q": "串级控制系统与单回路控制系统相比，具有的优点有哪些?", "a": ["主被控量控制精度高", "结构更简单，调试方便", "对副回路内扰动抑制能力强", "对对象参数变化适应性强", "", ""], "r": "ACD", "e": "串级控制系统有主副两个回路，能更好应对对象参数变化，对副回路内扰动抑制能力强，可提高主被控量控制精度，但其结构更复杂而非简单。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996484", "t": 2, "q": "串级控制系统中，主回路与副回路的关系为", "a": ["主回路的扰动需通过副回路克服", "主回路的输出作为副回路的给定值", "主回路是控制系统的核心，副回路为辅助回路", "副回路的输出直接反馈影响主回路的工作状态", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996485", "t": 2, "q": "单回路控制系统的组成包括（　）", "a": ["测量变送器", "执行器", "控制器", "前馈补偿器", "", ""], "r": "ABC", "e": "单回路控制系统由被控对象、测量变送器、控制器和执行器组成。前馈补偿器用于前馈控制系统，并非单回路控制系统组成。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996486", "t": 2, "q": "单回路控制系统设计中，被控量选择应遵循的原则有", "a": ["能直接反映生产工艺要求", "若无法直接测量，可选择与被控量有单值对应关系的间接量", "应选择对扰动不敏感的参数", "与控制目标无关的参数也可作为被控量", "", ""], "r": "AB", "e": "被控量要能直接体现生产工艺要求，若不能直接测就选有单值对应关系的间接量。应选对扰动敏感的参数，且被控量需与控制目标相关。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996487", "t": 2, "q": "单回路控制系统中，影响系统控制质量的因素有", "a": ["测量仪表的动态特性", "控制器的参数整定", "扰动的幅值和频率", "被控对象的滞后特性", "", ""], "r": "ABCD", "e": "测量仪表动态特性不佳会使测量不准影响控制；控制器参数整定不合适难以实现良好控制；扰动幅值和频率不同对系统影响不同，也影响控制质量；被控对象滞后特性会使系统响应不及时影响控制。答案包含ABCD所列出的所有方面。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996488", "t": 2, "q": "单回路控制系统中，执行器选择气开或气关型时，需考虑的因素有?", "a": ["被控对象的特性（正/反作用）", "工艺安全要求（故障时阀门状态）", "控制器的作用方向", "介质的流动方向", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996489", "t": 2, "q": "单回路控制系统中，执行器正反作用选择需考虑的因素有", "a": ["测量仪表的量程范围", "被控对象的特性（正/反作用）", "扰动的方向", "生产工艺对被控量变化方向的要求", "", ""], "r": "BD", "e": "执行器正反作用选择要保证系统构成负反馈，需结合被控对象的正/反作用特性，同时也要考虑生产工艺对被控量变化方向的要求。测量仪表量程范围与执行器正反作用无关，扰动方向不是选择执行器正反作用的主要考虑因素。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996490", "t": 2, "q": "单元机组给水控制系统的主要扰动有（　）", "a": ["给水压力变化", "蒸汽流量变化", "炉膛热负荷变化", "汽包压力变化", "", ""], "r": "ABCD", "e": "A 给水压力变化直接改变给水流量；B 蒸汽流量变化会引发虚假水位；C 炉膛热负荷改变，蒸发量变化影响汽包水位；D 汽包压力变化影响水的比容，造成水位虚假变化，均属于给水控制系统扰动。", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996491", "t": 2, "q": "单元机组协调控制类型有（　）", "a": ["定压控制", "机跟炉", "滑压控制", "机炉协调", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996492", "t": 2, "q": "反馈控制的缺点有", "a": ["对扰动的响应存在滞后", "无法克服未测扰动", "不能消除稳态误差", "需要复杂的扰动模型", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996493", "t": 2, "q": "反馈控制的特点有（　）", "a": ["是热工系统主要控制方式", "能克服所有影响被控量的扰动", "存在调节滞后", "可通过积分作用消除静态偏差", "", ""], "r": "ACD", "e": "答案：ACD反馈控制是指在一个时期的生产经营活动结束以后，对本期的资源利用状况及其成果进行总结。主要包括财务分析、成本分析、质量分析以及职工成绩评定等内容。通过反馈控制，对本期工作中存在的问题进行检查和分析，以便采取措施改进工作，提高效率。A. 是热工系统主要控制方式：反馈控制是热工系统的主要控制方式之一，通过反馈控制可以实现对系统的稳定控制。B. 能克服所有影响被控量的扰动：这个说法过于绝对，反馈控制并不能克服所有影响被控量的扰动，只能在一定程度上减小扰动的影响。C. 存在调节滞后：反馈控制存在调节滞后，因为反馈控制是根据系统的输出来调整输入，这个过程需要一定的时间。D. 可通过积分作用消除静态偏差：积分作用可以消除系统的静态偏差，使系统达到稳定状态。", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996494", "t": 2, "q": "反馈控制系统稳定性变差的可能原因有?", "a": ["测量信号滤波过度", "被控对象滞后时间增大", "微分时间Td过大", "控制器比例系数Kp过大", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996495", "t": 2, "q": "反馈控制系统中，引起被控量偏离设定值的扰动按来源可分为?", "a": ["测量扰动（仪表误差）", "外部扰动（负荷变化）", "控制器扰动（参数漂移）", "内部扰动（对象参数变化）", "", ""], "r": "ABCD", "e": "在反馈控制系统中，引起被控量偏离设定值的扰动，按来源一般可分为内部扰动和外部扰动两大类。<br />根据搜索结果中的定义：<br />外部扰动：是指从系统外部进入、影响被控参数的扰动，例如B. 外部扰动（负荷变化）。这类扰动通常来自系统所处的环境或生产负荷的变化。<br />内部扰动：是指发生在闭环系统内部的扰动，包括：<br />A. 测量扰动（仪表误差）：由测量元件（如传感器）的零位漂移、精度误差或噪声引起。<br />C. 控制器扰动（参数漂移）：控制器内部参数（如PID参数）的变化或漂移。<br />D. 内部扰动（对象参数变化）：被控对象自身特性的变化（如热交换器结垢、管道阻力变化等）。", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996496", "t": 2, "q": "给水控制系统中，应对机组负荷变化的控制策略有", "a": ["负荷增加时，提前增加给水流量", "忽略给水温度变化对水位的影响", "仅根据汽包水位偏差调节给水流量", "结合蒸汽流量前馈信号调节", "", ""], "r": "AD", "e": "这是一道关于给水控制系统策略的选择题。我们来简化解析一下：首先，看A选项，“负荷增加时，提前增加给水流量”。在电力系统中，负荷增加通常意味着需要更多的蒸汽来推动涡轮机发电，而这需要更多的水转化为蒸汽。因此，提前增加给水流量是合理的控制策略，以确保蒸汽的连续供应。接着是B选项，“忽略给水温度变化对水位的影响”。给水温度的变化会影响水的蒸发速度和蒸汽的品质，从而影响汽包的水位。因此，忽略这种影响是不合理的。再看C选项，“仅根据汽包水位偏差调节给水流量”。这种策略可能过于简单，因为汽包水位受到多种因素的影响，如蒸汽流量、给水流量以及给水温度等。仅依赖水位偏差进行调节可能不够准确。最后是D选项，“结合蒸汽流量前馈信号调节”。这是一个更为先进的控制策略，它考虑到了蒸汽流量的变化，并据此提前调整给水流量，以更好地适应负荷的变化。综上所述，A和D选项描述的是更为合理和先进的给水控制策略。所以，正确答案是AD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996497", "t": 2, "q": "给水控制系统中，影响汽包水位的主要扰动有", "a": ["给水流量变化", "炉膛负压变化", "蒸汽流量变化", "给水温度变化", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996498", "t": 2, "q": "给水三冲量控制系统的优点有", "a": ["提高水位控制精度", "抑制给水流量扰动对水位的影响", "减少蒸汽流量变化对系统稳定性的影响", "提前调节给水流量，减少水位波动", "", ""], "r": "ABCD", "e": "三冲量引入水位、蒸汽流量、给水流量信号；可提前补偿蒸汽 / 给水扰动，抑制虚假水位，减小水位波动，提升控制精度，增强系统稳定性。", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996499", "t": 2, "q": "锅炉给水控制系统中，三冲量控制的\"三冲量\"通常包括?", "a": ["给水温度", "蒸汽流量", "炉膛压力", "给水流量", "", ""], "r": "BD", "e": "三冲量控制的“三冲量”指蒸汽流量、水位、给水流量，本题选项中符合的是蒸汽流量和给水流量。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996500", "t": 2, "q": "锅炉给水控制中，\"虚假水位\"现象可能导致的问题有?", "a": ["炉膛热负荷波动", "汽包水位实际过低时未及时补水", "控制器误动作（水位暂升时关小给水）", "给水流量波动过大", "", ""], "r": "ABCD", "e": "虚假水位现象定位<br />虚假水位是锅炉变负荷工况下，汽包内压力骤变引发汽水密度与体积突变的动态假象。<br />其核心特征是水位信号与真实质量失衡的瞬时背离。<br />控制逻辑误判<br />当负荷突增导致水位短暂上升时，基于单冲量的控制系统会判定为水位过高。<br />控制器随即输出关小给水的逆向调节指令，直接加剧因蒸发量大于给水量导致的真实缺水状态。<br />连锁扰动传导<br />给水调节阀的频繁或大幅动作，会直接引发给水母管压力与流量的剧烈波动。<br />这种调节侧的扰动会进一步破坏汽水平衡，形成水位-给水-燃烧的多重耦合振荡。<br />工况恶化后果<br />若虚假水位未被有效识别，持续的逆向调节将导致实际水位持续走低。<br />在严重工况下，可能引发下降管带汽、水循环停滞等恶性事故，间接诱发炉膛热负荷的剧烈波动。", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996501", "t": 2, "q": "锅炉过热汽温调节方式有（　）", "a": ["喷水减温", "改变火焰中心高度", "面式减温", "烟气再循环", "", ""], "r": "ABCD", "e": "喷水减温、改变火焰中心高度、面式减温、烟气再循环都是常见的锅炉过热汽温调节方式。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996502", "t": 2, "q": "锅炉汽温串级控制系统中，选择副被控量时需考虑的因素有?", "a": ["副被控量测量信号易获取且准确", "副回路能包含主要扰动", "副被控量与主被控量有直接关联", "副被控量无需严格控制精度", "", ""], "r": "ABC", "e": "选择副被控量时，测量信号易获取且准确利于控制；副回路包含主要扰动可快速消除扰动影响；副被控量与主被控量直接关联有助于更好控制主被控量。而副被控量也需要一定控制精度。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996503", "t": 2, "q": "锅炉汽温控制中，常用的汽温调节手段有哪些?", "a": ["喷水减温", "调整燃烧器倾角", "改变烟气挡板位置（烟气再循环）", "调整蒸汽压力", "", ""], "r": "ABC", "e": "喷水减温、调整燃烧器倾角、改变烟气挡板位置（烟气再循环）都是常见的锅炉汽温调节手段，而调整蒸汽压力主要影响蒸汽的状态等，并非直接用于汽温调节。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996504", "t": 2, "q": "锅炉燃烧控制中，为保证燃料完全燃烧且经济性好，需协调控制的参数有?", "a": ["炉膛负压", "空气量", "燃料量", "烟气含氧量", "", ""], "r": "BCD", "e": "答案：BCD在锅炉燃烧控制中，为了保证燃料的完全燃烧并且具有良好的经济性，关键是要协调控制燃料量、空气量和烟气含氧量。燃料量和空气量的合理配比是确保燃料完全燃烧的基础，而烟气含氧量的监测和控制则可以进一步优化燃烧过程，提高燃烧效率和经济性。炉膛负压虽然也是锅炉运行的一个重要参数，但它主要关系到锅炉的安全和稳定运行，与燃料的完全燃烧和经济性关系不大。因此，正确答案是B、C、D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996505", "t": 2, "q": "过热汽温喷水减温的特点有", "a": ["适合作为细调手段", "调节精度高", "适合作为粗调手段", "会降低机组热效率", "", ""], "r": "ABD", "e": "A. 适合作为细调手段<br />喷水减温灵敏度高、迟滞性小，便于自动化控制，通常作为蒸汽侧调节的细调手段，用于消除剩余偏差，进行精确控制。在电站锅炉的实际运行中，普遍采用“烟气侧调节为主（粗调），喷水减温为辅（细调）”的组合策略。<br />B. 调节精度高 <br />喷水减温响应速度快，调节灵敏，能够实现精确的细调——从开始喷水到喷水点后汽温开始变化只需几秒钟。优质产品的控温精度可达±1℃，温度控制精度高。<br />C. 适合作为粗调手段 <br />错误。粗调手段通常指烟气侧调节（如改变火焰中心位置、使用摆动燃烧器、调节烟气挡板或采用烟气再循环等），这类调节方式惯性大、滞后时间长，但调节幅度大。喷水减温属于蒸汽侧调节，响应快但调节范围相对有限，因此适合作为细调，而非粗调。<br />D. 会降低机组热效率 <br />喷水减温在热经济性上有一定损失：部分给水用作减温水，使进入省煤器的水量减少，出口水温升高，增大了排烟损失。若减温水引自给水泵抽头，还会排挤部分高压加热器抽汽量，降低回热循环的热效率。对于再热器而言，喷水减温增加了再热蒸汽流量，使中低压缸做功比例增大，减小了高压缸出力，相当于部分地用低压蒸汽循环代替高压蒸汽循环做功，导致整个机组热经济性降低。计算表明，少用1%蒸发量的再热减温喷水，机组循环热效率可提高0.2%以上。", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996506", "t": 2, "q": "基于热电/电化学原理的测量仪器有（　）", "a": ["氧化锆氧量计", "热电阻温度计", "电磁流量计", "热电偶温度计", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996507", "t": 2, "q": "控制系统的超调量大小与下列哪些因素有关", "a": ["PID控制器的比例系数Kp", "PID控制器的微分时间Td", "PID控制器的积分时间Ti", "系统的阻尼比", "", ""], "r": "ABCD", "e": "A. PID控制器的比例系数Kp<br />比例系数Kp越大，系统响应越快，但过大的Kp会导致超调量显著增加，甚至引起系统振荡 。当Kp设置过高时，输出会瞬间冲高，导致超调 。<br />B. PID控制器的微分时间Td <br />微分项（Td）用于预测误差变化趋势，适当增加Td可以抑制超调和振荡，但Td过弱或缺失则无法有效抑制超调 。微分作用被称为\"预警\"作用，能增强系统阻尼 。<br />C. PID控制器的积分时间Ti <br />积分时间Ti影响积分作用的强弱。Ti过小（积分作用过强）会导致积分累积过度，使系统在接近目标值时\"刹车不及\"，加剧超调 。增大Ti（减弱积分作用）有助于减少超调，但可能影响稳态误差的消除 。<br />D. 系统的阻尼比 <br />阻尼比是衡量系统阻尼特性的核心参数，直接决定了超调量的大小。阻尼比越小，超调量越大；当阻尼比ζ=0.5时，典型二阶系统超调量约为16.3% 。系统的阻尼比由控制器参数和被控对象特性共同决定。", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996508", "t": 2, "q": "控制系统的稳态误差与下列哪些因素有关", "a": ["系统的型别（0型、I型、II型）", "系统的开环增益", "输入信号的形式（阶跃、斜坡、抛物线）", "PID控制器的积分时间Ti", "", ""], "r": "ABCD", "e": "A. 系统的型别（0型、I型、II型）<br />系统的型别由开环传递函数中积分环节的个数决定，直接决定了系统对特定输入信号能否消除稳态误差。例如，0型系统对阶跃输入存在稳态误差，I型系统对阶跃输入无静差但对斜坡输入有静差，II型系统对阶跃和斜坡输入均无静差。<br />B. 系统的开环增益 <br />在相同型别下，增大开环增益可以显著减小稳态误差，但过高的增益可能影响系统稳定性。<br />C. 输入信号的形式（阶跃、斜坡、抛物线） <br />稳态误差的大小与输入信号的变化率密切相关：变化率越大的输入信号，系统越难精确跟踪，稳态误差也越大。例如，同一系统对阶跃输入可能无静差，但对斜坡或抛物线输入则存在有限误差甚至无穷大误差。<br />D. PID控制器的积分时间Ti <br />积分时间 Ti 直接影响积分作用的强弱。减小 Ti（增强积分作用）有助于消除稳态误差，但过小可能导致系统振荡；增大 Ti 会减弱积分作用，可能导致稳态误差增大。积分环节是消除原理性稳态误差的核心手段。<br /> ", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996509", "t": 2, "q": "控制系统性能分析的动态指标包括", "a": ["调节时间", "峰值时间", "超调量", "稳态误差", "", ""], "r": "ABC", "e": "动态指标描述系统动态过程特性，调节时间反映系统过渡到稳态所需时间，峰值时间是响应达到第一个峰值的时间，超调量体现响应超过稳态值的程度，这三者都属动态指标；稳态误差是系统进入稳态后的误差，是稳态指标。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800261502996510", "t": 2, "q": "汽温控制系统中，常用的烟气侧调节手段有", "a": ["调节烟气挡板", "改变送风量", "喷水减温", "采用烟气再循环", "", ""], "r": "AD", "e": "调节烟气挡板、采用烟气再循环属于烟气侧调节手段，改变送风量主要影响燃烧工况但不是典型烟气侧调节手段，喷水减温是蒸汽侧调节手段。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046016", "t": 3, "q": "在\"机跟炉\"协调方式下，负荷指令增加时，锅炉先增燃料，汽轮机再根据汽压调整调门。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“机跟炉”协调方式中，锅炉主控起主导作用，当负荷指令增加，先由锅炉增加燃料提高蒸发量，等汽压变化后汽轮机再根据汽压调整调门。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046017", "t": 3, "q": "在\"机炉协调\"方式下，机炉同时调整，汽轮机跟踪负荷，锅炉维持汽压。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046018", "t": 3, "q": "\"虚假水位\"是汽包水位测量仪表故障导致的误差，更换高精度仪表可消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“虚假水位”不是仪表故障导致的误差，而是由于负荷、燃烧工况变化引起锅水汽化强度突变造成汽包压力和汽水比容变化，使水位出现暂时升高或降低的假象。所以仅更换高精度仪表不能消除。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046019", "t": 3, "q": "被控对象的惯性越大，反馈控制系统越容易出现超调现象，需增强微分作用来改善。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "被控对象惯性大，系统响应慢且易超调，微分作用能根据偏差变化率提前动作，可抑制超调，所以需增强微分作用改善。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046020", "t": 3, "q": "被控对象的滞后时间越大，反馈控制系统的稳定性越差，越容易出现振荡现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "滞后时间大意味着控制作用不能及时反映被控对象的变化，系统对偏差的响应会延迟，导致系统难以快速稳定，易出现振荡，所以稳定性变差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046021", "t": 3, "q": "串级控制系统的副回路时间常数应比主回路大，才能快速克服副扰动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "串级控制系统中副回路时间常数应比主回路小，这样副回路响应快，能快速克服副扰动。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800265001046022", "t": 3, "q": "串级控制系统的抗干扰能力比单回路控制系统强，主要是因为副回路能快速克服副扰动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "串级控制系统中副回路可及时对副变量进行检测和控制，能快速克服作用于副
