度大且速度快的工况，可快速改变水轮机流量。混流式水轮机导叶调节、冲击式水轮机折向器调节在这种复杂工况下效果不如双调速器；单调速器调节能力有限。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905742", "t": 1, "q": "水力发电站中，下列哪种调压设施主要用于消除水电站负荷骤降时，压力管道内产生的\"水锤现象\"（水击现象）?", "a": ["尾水调压室", "调压室（surge chamber）", "蝴蝶阀", "压力前池", "", ""], "r": "B", "e": "调压室能在水电站负荷骤降时，通过调节水位变化来消除压力管道内的水锤现象。尾水调压室主要针对尾水系统；蝴蝶阀是控制水流的阀门；压力前池主要起平稳水压等作用。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905743", "t": 1, "q": "水力发电站中，下列哪种类型的水电站需要修建拦河大坝和水库，能调节径流，实现防洪、发电、灌溉等综合利用?", "a": ["混合式水电站", "堤坝式水电站", "抽水蓄能水电站", "引水式水电站", "", ""], "r": "B", "e": "堤坝式水电站需修建拦河大坝和水库，能调节径流，实现综合利用。混合式结合了堤坝式和引水式特点；抽水蓄能是利用电能抽水再发电；引水式是利用引水道集中水头发电。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905744", "t": 1, "q": "太阳能光伏并网逆变器的\"最大功率点跟踪（MPPT）\"功能，其主要作用是?", "a": ["稳定光伏系统输出的交流电压和频率", "确保光伏组件在不同光照和温度下，始终工作在输出功率最大的工况点", "将光伏组件输出的直流电转换为交流电", "防止光伏系统向电网倒送电", "", ""], "r": "B", "e": "MPPT功能就是让光伏组件在不同光照、温度等环境下能工作在输出功率最大的点，以提高发电效率。A是逆变器稳定电压频率功能；C是逆变器基本的交直流转换功能；D是防逆流保护功能。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905745", "t": 1, "q": "太阳能光伏阵列的\"MPPT（最大功率点跟踪）\"控制中，下列哪种算法在光照强度快速变化时，能最快跟踪到新的最大功率点，且稳态精度较高?", "a": ["扰动观察法", "增量电导法", "模糊控制算法", "神经网络算法", "", ""], "r": "C", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905746", "t": 1, "q": "太阳能光伏组件的\"温度系数\"是衡量其输出特性随温度变化的重要参数，通常以%/摄氏度表示，以下关于晶体硅光伏组件温度系数的描述正确的是?", "a": ["开路电压温度系数为负值，短路电流温度系数为正值", "开路电压温度系数为正值，短路电流温度系数为负值", "开路电压和短路电流温度系数均为正值", "开路电压和短路电流温度系数均为负值", "", ""], "r": "A", "e": "对于晶体硅光伏组件，温度升高时开路电压会降低所以开路电压温度系数为负，温度升高短路电流会增加所以短路电流温度系数为正。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905747", "t": 1, "q": "太阳能光伏组件的\"温度系数\"是衡量其温度适应性的重要指标，若某单晶硅光伏组件的开路电压温度系数为-0.35%/℃，当组件温度从25℃升高至65℃时，其开路电压会发生怎样的变化（不考虑其他因素）?", "a": ["降低35%", "升高35%", "降低14%", "升高14%", "", ""], "r": "C", "e": "温度升高了65 - 25 = 40℃，开路电压温度系数为 - 0.35%/℃，则电压变化为40×(-0.35%) = - 14%，即降低14%。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905748", "t": 1, "q": "太阳能光伏组件的温度系数（功率温度系数）为负值，下列关于其对组件输出功率影响的说法正确的是?", "a": ["组件温度升高时，开路电压升高，导致输出功率升高", "组件温度每升高1摄氏度，输出功率下降的百分比为温度系数绝对值", "组件温度升高时，输出功率成比例升高", "组件温度变化对输出功率无影响", "", ""], "r": "B", "e": "功率温度系数为负意味着温度升高功率下降。A选项温度升高开路电压应降低，A错；C选项温度升高输出功率应降低，C错；D选项温度变化对输出功率有影响，D错；B选项符合功率温度系数的定义。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905749", "t": 1, "q": "太阳能光热发电系统中，\"熔盐储热\"是提高系统稳定性的关键技术，下列哪种熔盐配方因具有较低的熔点和较高的分解温度，成为目前大规模光热电站的主流选择?", "a": ["氯化物熔盐（如NaCl-MgCl2）", "氟化物熔盐（如NaF-KF）", "硝酸钠-硝酸钾二元熔盐（NaNO3-KNO3）", "硝酸钠-硝酸钾-硝酸锂三元熔盐（NaNO3-KNO3-LiNO3）", "", ""], "r": "C", "e": "硝酸钠 - 硝酸钾二元熔盐（NaNO₃ - KNO₃）具有较低熔点和较高分解温度，成本相对较低且性能稳定，是目前大规模光热电站主流选择。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905750", "t": 1, "q": "太阳能光热发电系统中，下列哪种传热介质的工作温度范围最广（可从低温到565摄氏度以上），且具有良好的热稳定性和化学稳定性?", "a": ["水/水蒸气", "熔盐", "空气", "导热油", "", ""], "r": "B", "e": "水/水蒸气高温易超临界，有腐蚀风险；空气传热能力有限；导热油高温易分解。而熔盐工作温度范围广且热稳定性、化学稳定性好。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905751", "t": 1, "q": "下列哪种潮汐能发电站的布置方式可实现\"涨潮和落潮时均能发电\"，且不需要建双向水轮机?", "a": ["双库单向式", "单库双向式", "双库双向式", "单库单向式", "", ""], "r": "A", "e": "双库单向式有两个水库，涨潮和落潮时都能发电且不用双向水轮机。单库单向式只能单向发电；单库双向式需双向水轮机；双库双向式较复杂且不是本题最佳答案。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905752", "t": 1, "q": "下列哪种潮汐能发电站的布置方式可以实现涨潮和落潮两个方向都能发电，提高潮汐能利用效率?", "a": ["单库双向式", "单库单向式", "双库双向式", "双库单向式", "", ""], "r": "A", "e": "单库双向式能在涨潮和落潮两个方向发电；单库单向式只能一个方向发电；双库双向式虽也可双向，但结构复杂成本高；双库单向式也是单向发电。答案选单库双向式能提高潮汐能利用效率。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905753", "t": 1, "q": "下列哪种海流能发电装置的工作原理与风力发电机组类似，通过海流推动叶轮旋转，带动发电机发电?", "a": ["磁流体式", "潮汐堰坝式", "水轮机式", "振荡水柱式", "", ""], "r": "C", "e": "水轮机式海流能发电装置和风力发电机组原理类似，都是流体推动叶轮旋转带动发电机发电。磁流体式是基于电磁感应，潮汐堰坝式靠潮汐水位差发电，振荡水柱式利用波浪使空气振荡发电。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905754", "t": 1, "q": "下列哪种海洋能的能量密度最高，且受地理位置和自然条件限制最小，适合大规模开发利用?", "a": ["波浪能", "海流能", "温差能", "潮汐能", "", ""], "r": "C", "e": "海洋温差能依靠表层与深层海水温度差获取能量，能量密度相对更高，不受潮汐、海流位置约束，适宜大规模开发；波浪能、海流能、潮汐能对地理位置依赖性强。", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905755", "t": 1, "q": "下列哪种海洋能发电技术的能量转换过程涉及\"往复式运动转化为旋转运动\"，且受潮汐周期影响最大?", "a": ["潮流能水平轴水轮机发电", "波浪能振荡水柱式发电", "温差能闭式循环发电", "潮汐能单库单向式发电", "", ""], "r": "D", "e": "往复式运动转化为旋转运动有潮汐能单库单向式发电利用潮汐涨落带动水轮机，水轮机做往复式运动再转化为旋转运动发电；且其完全依赖潮汐涨落，受潮汐周期影响最大。潮流能主要是潮流持续推动水轮机，波浪能靠波浪起伏，温差能靠海水温差，均不符合题意。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905756", "t": 1, "q": "下列哪种海洋能发电装置的工作原理是利用\"波浪的势能和动能转化为空气的压能和动能，再驱动涡轮机发电\"?", "a": ["点头鸭式波浪能发电装置", "收缩波道式波浪能发电装置", "振荡水柱式波浪能发电装置", "越浪式波浪能发电装置", "", ""], "r": "C", "e": "振荡水柱式波浪能发电装置工作时，波浪起伏使水柱振荡，将波浪的势能和动能转化为空气的压能和动能，进而驱动涡轮机发电。所以答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905757", "t": 1, "q": "下列哪种海洋能利用技术的能量转换过程中，需要通过\"振荡水柱\"将往复运动的波浪能转化为气流能量，再驱动透平发电?", "a": ["潮汐能双向水轮机", "振荡水柱式波浪能转换器", "越浪式波浪能转换器", "点吸收式波浪能转换器", "", ""], "r": "B", "e": "题干明确提到通过“振荡水柱”转化波浪能，选项中只有振荡水柱式波浪能转换器符合。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905758", "t": 1, "q": "在聚光型太阳能热发电系统中，采用熔盐作为储热介质时，其工作温度范围通常能覆盖以下哪个区间，以满足后续蒸汽循环的参数需求?", "a": ["250-565摄氏度", "100-200摄氏度", "600-800摄氏度", "800-1000摄氏度", "", ""], "r": "A", "e": "熔盐储热可满足蒸汽循环参数需求，其工作温度一般在250 - 565摄氏度。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905759", "t": 1, "q": "在能源环境经济的\"外部成本\"分析中，下列哪项属于能源生产过程中产生的\"环境外部成本\"?", "a": ["能源生产工人的工资", "能源燃烧排放污染物导致的大气污染治理费用", "能源运输过程中的物流费用", "能源开采设备的折旧费用", "", ""], "r": "B", "e": "环境外部成本是指能源生产活动对环境造成影响而产生的额外成本。A选项工人工资、C选项物流费用、D选项设备折旧费用都属于能源生产的内部经济成本。B选项大气污染治理费用是能源生产排放污染物导致环境问题后产生的成本，属于环境外部成本。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905760", "t": 1, "q": "在能源经济的\"能源供需平衡\"分析中，下列哪项属于\"二次能源\"的供给范畴?", "a": ["天然气田开采的天然气", "油田开采的原油", "煤矿开采的原煤", "火力发电厂生产的电力", "", ""], "r": "D", "e": "二次能源是由一次能源经过加工转换得到的能源。ABC选项中的天然气、原油、原煤都是直接从自然界获取的一次能源，D选项中火力发电厂生产的电力是由煤炭等一次能源加工转换而来的二次能源。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905761", "t": 1, "q": "在能源系统的\"环境影响评价\"中，下列哪种污染物的排放是生物质发电与化石能源发电相比，最显著的环境优势（考虑全生命周期）?", "a": ["氮氧化物（NOx）", "颗粒物（PM2.5）", "二氧化硫（SO2）", "二氧化碳（CO2）", "", ""], "r": "D", "e": "生物质能属于可再生能源，从全生命周期看，生物质发电过程中二氧化碳吸收与排放近乎平衡，而化石能源发电会大量排放二氧化碳。与化石能源发电相比，这是生物质发电最显著的环境优势。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905762", "t": 1, "q": "在能源与环境经济的\"成本效益分析\"中，若某新能源项目的\"经济内部收益率（EIRR）\"高于行业基准收益率，且\"环境效益内部收益率（EIRR_env）\"低于环境基准收益率，下列判断正确的是?", "a": ["项目经济和环境均不可行", "项目经济不可行，环境可行", "项目经济和环境均可行", "项目经济可行，环境不可行", "", ""], "r": "D", "e": "经济内部收益率高于行业基准收益率，说明项目经济可行；环境效益内部收益率低于环境基准收益率，说明项目环境不可行。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905763", "t": 1, "q": "在能源与环境经济分析中，下列哪个指标用于衡量单位能源消耗所带来的经济产出，是评估能源利用经济性的核心指标之一?", "a": ["能源强度", "能源消费弹性系数", "能源利用效率", "产值能耗", "", ""], "r": "A", "e": "能源强度指单位国内生产总值的能源消耗量，体现单位能源消耗带来的经济产出，是评估能源利用经济性核心指标。能源消费弹性系数反映能源消费增长与经济增长关系；能源利用效率强调能源有效利用程度；产值能耗是生产单位产值的能耗量。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905764", "t": 1, "q": "在能源与环境经济分析中，下列哪种指标可同时反映能源利用的经济性和环境友好性，且考虑了污染物的外部成本?", "a": ["能源环境效率（E3效率）", "污染物排放强度", "能源系统全生命周期成本", "单位GDP能耗", "", ""], "r": "A", "e": "能源环境效率（E3效率）综合考虑能源利用的经济性与环境友好性，还将污染物外部成本纳入考量。污染物排放强度主要关注污染排放情况；能源系统全生命周期成本侧重于成本；单位GDP能耗仅体现能源利用效率。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905765", "t": 1, "q": "在太阳能聚光发电系统中，下列哪种聚光方式最适合用于大规模商业化电站，且能有效降低单位电能成本?", "a": ["点聚光（如碟式系统）", "面聚光（如菲涅尔透镜系统）", "线聚光（如槽式系统）", "漫反射聚光（如平板反射镜系统）", "", ""], "r": "C", "e": "槽式系统是线聚光方式，技术成熟、结构相对简单、建设和维护成本较低，适合大规模商业化电站以降低单位电能成本。碟式系统成本高、规模小；菲涅尔透镜系统有光学效率等问题；平板反射镜系统效率低。所以选C。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905766", "t": 1, "q": "在太阳能聚光热发电系统中，下列哪种聚光器类型最适合用于中高温（300-800摄氏度）热能利用，且具有较高的聚光比和稳定性?", "a": ["碟式聚光器", "槽式聚光器", "平板式集热器", "塔式聚光器", "", ""], "r": "D", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905767", "t": 1, "q": "在压水堆核电站中，以下哪个系统的核心功能是将反应堆一回路的热量传递给二回路，且通过屏障隔离放射性物质，防止其进入二回路?", "a": ["控制棒系统", "安全注射系统", "余热排出系统", "蒸汽发生器系统", "", ""], "r": "D", "e": "蒸汽发生器系统能把反应堆一回路热量传给二回路，同时通过屏障隔离放射性物质，避免其进入二回路。而控制棒系统用于控制反应性；安全注射系统是在事故时注入冷却剂；余热排出系统用于排出停堆后余热。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220352", "t": 2, "q": "生物质发电过程中，为满足环保要求，需采取的大气污染物控制措施包括下列哪些（　）?", "a": ["活性炭吸附装置（去除二噁英）", "脱硫装置（去除SO2）", "脱硝装置（去除NOx）", "袋式除尘器（去除颗粒物）", "", ""], "r": "ABCD", "e": "生物质发电中，活性炭可吸附二噁英；脱硫装置能去除SO₂；脱硝装置可去除NOₓ；袋式除尘器可去除颗粒物，这些都是常见大气污染物控制措施。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220353", "t": 2, "q": "生物质发电过程中，下列哪些措施属于\"环保措施\"，可减少污染物排放?（　）", "a": ["安装布袋除尘器，去除烟气中的颗粒物", "安装脱硫塔，脱除烟气中的二氧化硫", "采用循环流化床锅炉，提高燃烧效率", "采用选择性催化还原（SCR）系统，脱除氮氧化物", "", ""], "r": "ABD", "e": "生物质发电过程中，环保措施主要是针对减少污染物的排放。我们逐项分析这些措施：A. 安装布袋除尘器，去除烟气中的颗粒物 —— 这是一种直接的环保措施，通过物理方式去除烟气中的颗粒物，从而减少大气污染。B. 安装脱硫塔，脱除烟气中的二氧化硫 —— 同样是环保措施，通过化学方式去除烟气中的二氧化硫，防止酸雨等环境问题。C. 采用循环流化床锅炉，提高燃烧效率 —— 这一措施主要是为了提高能源利用效率，并非直接针对污染物减排，但它可以间接减少单位能量产出所需的燃料消耗，从而可能降低污染物排放总量。D. 采用选择性催化还原(SCR)系统，脱除氮氧化物 —— 这也是一种环保措施，通过特定的化学反应去除烟气中的氮氧化物，减少光化学烟雾等环境问题的风险。综上所述，A、B和D选项都是直接针对减少污染物排放的环保措施，而C选项虽然主要是提高效率，但也可能有间接的减排效果。根据题目的直接要求，A、B和D更直接地符合“环保措施”的定义。所以，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220354", "t": 2, "q": "生物质发电系统中，为满足环保排放标准，以下哪些措施可有效控制烟气中的颗粒物排放（　）?", "a": ["采用袋式除尘器", "采用电袋复合除尘器", "在炉膛内设置旋风分离器", "向烟气中喷入石灰石粉", "", ""], "r": "ABC", "e": "A选项袋式除尘器、B选项电袋复合除尘器都能有效捕集颗粒物，可控制烟气中颗粒物排放；C选项炉膛内旋风分离器能分离部分大颗粒；D选项喷石灰石粉主要是脱硫，对控制颗粒物排放作用不大。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220355", "t": 2, "q": "生物质气化发电系统中，\"气化炉\"的类型按气化方式可分为下列哪些（　）?", "a": ["流化床气化炉（如鼓泡流化床、循环流化床）", "气流床气化炉（如加压气流床）", "移动床气化炉（如链条式气化炉）", "熔融床气化炉（如熔融盐气化炉）", "", ""], "r": "ABCD", "e": "生物质气化炉按气化方式主要有流化床、气流床、移动床和熔融床等类型，ABCD选项分别对应了这几种典型的气化炉类型。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220356", "t": 2, "q": "生物质气化过程中，下列哪些参数会影响气化气的成分和热值?（　）", "a": ["气化炉的压力", "气化温度", "气化炉类型（固定床、流化床）", "气化剂种类（空气、氧气、水蒸气）", "", ""], "r": "ABCD", "e": "气化压力、气化温度改变化学反应平衡；不同炉型反应条件不同；气化剂种类直接决定燃气组分与热值，以上均影响气化气成分与热值。", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220357", "t": 2, "q": "生物质气化过程中，影响气化气产量和热值的主要操作参数包括下列哪些（　）?", "a": ["气化剂与生物质的配比（气固比）", "气化压力", "气化温度", "气化炉的高度", "", ""], "r": "ABC", "e": "气化剂配比、气化压力、气化温度直接影响反应程度、产气产量与燃气热值；气化炉高度属于设备结构尺寸，不属于操作参数。", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220358", "t": 2, "q": "生物质气化炉的类型按气化剂流动方向可分为下列哪些?（　）", "a": ["下行式气化炉", "固定床气化炉", "上行式气化炉", "循环流化床气化炉", "", ""], "r": "AC", "e": "按气化剂流动方向，生物质气化炉分为下行式和上行式气化炉。固定床、循环流化床是按气化炉的床层形式分类。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220359", "t": 2, "q": "水力发电机组的\"调速系统\"主要由下列哪些部分组成（　）?", "a": ["放大元件（如液压放大器）", "测速元件（如离心飞摆）", "执行元件（如导叶接力器）", "励磁调节器", "", ""], "r": "ABC", "e": "调速系统要实现调速需测速元件获取速度信息、放大元件放大信号、执行元件执行动作来调节转速。而励磁调节器是调节发电机励磁的，与调速系统无关。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220360", "t": 2, "q": "水力发电机组的\"振动故障\"可能由下列哪些原因引起（　）?", "a": ["转子不平衡", "励磁电流不稳定", "尾水管涡带（水流旋转产生的涡带）", "轴承间隙过大", "", ""], "r": "ACD", "e": "转子不平衡、尾水管涡带、轴承间隙过大都会导致机组运行不稳定而产生振动；励磁电流不稳定主要影响发电的电压、功率等参数，一般不会直接引发振动故障。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220361", "t": 2, "q": "水力发电水轮机的\"气蚀\"现象会导致下列哪些问题?（　）", "a": ["水轮机噪声增大", "水轮机过流部件损坏", "水轮机出力增加", "水轮机振动加剧", "", ""], "r": "ABD", "e": "气蚀现象会使水轮机过流部件受气泡溃灭产生的冲击力而损坏，还会引发噪声和振动加剧，气蚀会降低水轮机效率，使出力降低而非增加。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220362", "t": 2, "q": "水力发电系统中，以下哪些因素会影响水轮机的\"效率曲线\"（即效率随流量、水头的变化关系）（　）?", "a": ["水轮机的型号（如混流式、轴流式）", "下游尾水位的波动范围", "发电机的励磁调节方式", "水轮机转轮的叶片型线设计", "", ""], "r": "ABD", "e": "水轮机型号和转轮叶片型线设计直接决定水轮机性能，影响效率曲线；下游尾水位波动会改变水头，进而影响效率曲线。而发电机励磁调节方式主要影响发电相关参数，与水轮机效率曲线无关。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220363", "t": 2, "q": "水力发电站的\"调压室\"的作用包括下列哪些?（　）", "a": ["稳定引水管道中的水流速度", "保护水轮机免受气蚀损坏", "调节水轮机的进水流量", "在机组负荷变化时，补充或储存引水管道中的水量", "", ""], "r": "AD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220364", "t": 2, "q": "水力发电站的\"发电机\"常见故障包括下列哪些（　）?", "a": ["导叶漏水", "轴承过热", "主轴弯曲", "转子绕组短路", "", ""], "r": "BCD", "e": "A导叶漏水主要是水轮机相关部件问题；B轴承过热、C主轴弯曲、D转子绕组短路都属于发电机运行中可能出现的故障。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220365", "t": 2, "q": "水力发电站的\"发电机\"通常采用下列哪些类型?（　）", "a": ["永磁同步发电机", "同步发电机", "鼠笼式异步发电机", "异步发电机", "", ""], "r": "AB", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220366", "t": 2, "q": "水力发电站的\"水库调度\"需考虑的因素包括下列哪些（　）?", "a": ["防洪要求（需预留防洪库容）", "电网负荷需求（需满足电力供应）", "生态流量（需保障下游生态用水）", "水库泥沙淤积（需减少泥沙沉积）", "", ""], "r": "ABCD", "e": "水库调度要综合多方面因素。防洪需预留库容，要考虑A；要满足电网电力供应，得考虑B；保障下游生态用水，要考虑C；减少水库泥沙沉积，也需在调度中考虑D。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220367", "t": 2, "q": "水力发电站的\"水库调度\"中，以下哪些属于生态调度的主要措施，以减少电站运行对下游生态的影响（　）?", "a": ["在枯水期增加电站的发电出力", "在鱼类产卵期调整泄流方式，模拟自然洪峰", "维持下游河道的最小生态流量", "优化水库水位波动频率，减少消落带面积", "", ""], "r": "BCD", "e": "生态调度目的是减少电站运行对下游生态影响。A选项枯水期增加发电出力会减少下游水量，不利于生态；B模拟自然洪峰利于鱼类繁殖；C维持最小生态流量保障下游生态用水；D优化水位波动减少消落带面积，保护生态环境。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220368", "t": 2, "q": "水力发电站中，下列哪些因素会影响水轮机的\"效率\"?（　）", "a": ["水轮机的机械摩擦损失", "水流在水轮机内的水力损失", "水轮机的设计与制造质量", "电网的频率要求", "", ""], "r": "ABC", "e": "水轮机效率受自身运行损耗及设计制造质量影响。A选项机械摩擦损失、B选项水流水力损失都会降低效率；C选项设计与制造质量好，效率会高。而D选项电网频率要求与水轮机自身效率并无直接关联。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220369", "t": 2, "q": "太阳能光伏系统中，以下哪些因素会导致光伏阵列的\"热斑效应\"，进而损坏组件?（　）", "a": ["某一组件的旁路二极管失效", "组件之间的串联回路存在接触电阻过大", "部分组件被树木、建筑物遮挡", "组件表面温度过高", "", ""], "r": "AC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220370", "t": 2, "q": "太阳能光伏组件的\"串联\"会导致下列哪些参数变化?（　）", "a": ["开路电压增加", "输出功率增加", "短路电流不变", "短路电流减少", "", ""], "r": "ABC", "e": "光伏组件串联时，各组件的输出电压线性叠加，而电流受限于串联回路中最小的单组件电流。<br />A. 开路电压增加：串联后总开路电压等于各组件开路电压之和，该项正确。<br />B. 输出功率增加：在相同工作电流下，电压升高使总输出功率增大，该项正确。<br />C. 短路电流不变：串联回路的短路电流由电流最小的组件决定，若各组件性能一致则不变；若不一致则减小。该选项在“理想匹配”前提下成立，该项正确。<br />D. 短路电流减少：仅在组件性能不匹配时成立，非串联的必然结果，该项错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220371", "t": 2, "q": "太阳能光伏组件的输出特性受多种因素影响，下列哪些因素会导致组件输出功率下降?（　）", "a": ["环境湿度升高", "光照强度降低", "组件串联电阻增大", "组件并联电阻减小", "", ""], "r": "BC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220372", "t": 2, "q": "太阳能光热发电的\"储热系统\"中，下列哪些属于常用的储热介质?（　）", "a": ["水", "熔盐", "空气", "导热油", "", ""], "r": "BD", "e": "太阳能光热发电的“储热系统”主要功能是存储在日照充足时收集的热量，并在需要时释放这些热量以维持发电系统的稳定运行。储热介质的选择至关重要，它决定了储热系统的效率和稳定性。常见的储热介质需要具备良好的热稳定性、高比热容以及相对较低的成本。以下是对各选项的简要分析：A. 水：虽然水是一种常见的热能储存介质，但在太阳能光热发电的高温应用环境下，水不是最理想的选择，因为它在高温下容易蒸发，并且其热容量相对有限。B. 熔盐：熔盐因其高比热容、低蒸气压和良好的热稳定性而被广泛用作太阳能光热发电系统的储热介质。它能够在高温下稳定存储大量热量。C. 空气：空气的热容量较低，且不易于长时间稳定地储存热量，因此在太阳能光热发电系统中不常用作储热介质。D. 导热油：导热油具有良好的热传导性能，并且可以在较高的温度下稳定工作，因此也常被用作太阳能光热发电系统的储热介质。综上所述，熔盐（B选项）和导热油（D选项）是太阳能光热发电系统中常用的储热介质。所以，正确答案是BD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220373", "t": 2, "q": "太阳能光热发电系统的\"储热系统\"主要由下列哪些部分组成（　）?", "a": ["保温层（减少热量损失）", "储热罐（如高温罐、低温罐）", "储热介质（如熔盐、导热油）", "跟踪系统（跟踪太阳位置）", "", ""], "r": "ABC", "e": "储热系统要储存热量，需有储热罐来容纳，储热介质用于存储热量，保温层可减少热量散失。而跟踪系统是用于跟踪太阳位置，和储热系统无关。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220374", "t": 2, "q": "下列哪些潮汐能发电站的选址条件是合理的?（　）", "a": ["海域波浪能资源丰富，可联合开发", "地质条件稳定，能承受大坝荷载", "附近有较大的用电负荷中心，减少输电成本", "海域水深适中，便于大坝和厂房建设", "", ""], "r": "BCD", "e": "潮汐能发电站选址要考虑地质、用电需求和建设难度等因素。地质稳定利于承受大坝荷载，靠近用电负荷中心可减输电成本，水深适中便于建设。而波浪能与潮汐能是不同能源，不是潮汐能发电站主要选址依据。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220375", "t": 2, "q": "下列哪些海洋能发电技术目前处于\"试验示范阶段\"，尚未实现大规模商业化应用（　）?", "a": ["波浪能振荡浮子式发电", "潮流能水平轴水轮机发电", "潮汐能单库双向式发电", "盐差能渗透压发电", "", ""], "r": "ABD", "e": "当前波浪能振荡浮子式发电、潮流能水平轴水轮机发电、盐差能渗透压发电都还在试验示范阶段，未大规模商业化，而潮汐能单库双向式发电已较成熟可商业应用。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220376", "t": 2, "q": "下列哪些海洋能利用技术属于\"机械能转换\"类型，即先将海洋能转化为机械能，再转化为电能?（　）", "a": ["振荡水柱式波浪能转换", "温差能热力循环转换", "磁流体式海流能转换", "潮汐能水轮机转换", "", ""], "r": "AD", "e": "振荡水柱式波浪能转换是把波浪能先转化为空气的机械能，再带动发电机发电；潮汐能水轮机转换是将潮汐的机械能通过水轮机转化为电能，二者都属于先将海洋能转化为机械能，再转化为电能。温差能热力循环转换是通过热力循环发电，磁流体式海流能转换是直接将海流能转换为电能。答案：AD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220377", "t": 2, "q": "下列哪些技术可用于提高太阳能光伏组件的\"抗遮挡能力\"?（　）", "a": ["采用双面光伏组件（利用背面散射光）", "采用半片式光伏组件（减少遮挡时的功率损失）", "采用分布式MPPT（每个组件或组串独立MPPT）", "优化光伏阵列布置（增大组件间距）", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220378", "t": 2, "q": "下列哪些技术属于太阳能利用中的\"光热转换技术\"?（　）", "a": ["光催化制氢", "槽式聚光集热器供热", "碟式聚光发电系统的集热器", "平板太阳能热水器", "", ""], "r": "BCD", "e": "光热转换技术是将太阳能转化为热能。A选项光催化制氢是光化学转换；B槽式聚光集热器、C碟式聚光发电系统集热器、D平板太阳能热水器都是把太阳能转化为热能。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220379", "t": 2, "q": "下列哪些属于\"海洋能\"的具体利用形式?（　）", "a": ["潮汐能", "温差能", "波浪能", "海流能", "", ""], "r": "ABCD", "e": "海洋能包含潮汐能、波浪能、海流能（潮流能）、海水温差能、海水盐差能，A、B、C、D 均属于海洋能利用形式。", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220380", "t": 2, "q": "下列哪些因素会导致太阳能光伏组件的\"填充因子（FF）\"降低?（　）", "a": ["组件并联电阻减小", "组件串联电阻增大", "组件温度升高", "光照强度降低", "", ""], "r": "ABCD", "e": "串联电阻增大、并联电阻减小都会使 FF 下降；温度升高，光伏器件伏安特性变差，FF 降低；光照强度降低，填充因子也会减小。", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220381", "t": 2, "q": "下列哪些因素会影响\"温差能\"发电系统的效率?（　）", "a": ["海域的潮汐差", "海水的盐度", "海水表层与深层的温度差", "传热介质的传热效率", "", ""], "r": "CD", "e": "“温差能”发电依靠海水表层和深层的温度差，温度差越大，能量转换潜力越大；传热介质的传热效率直接影响热量传递和能量转换，效率高则发电系统效率高。而海域潮汐差和海水盐度与“温差能”发电系统效率无关。所以答案选CD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220382", "t": 2, "q": "下列哪些指标可用于衡量多能互补冷热电多联供系统的\"能源综合利用效率\"?（　）", "a": ["一次能源利用率（系统总输出能量与消耗一次能源的比值）", "冷电比（系统供冷量与发电量的比值）", "热电联产效率（发电与供热能量之和与消耗能源的比值）", "能源梯级利用效率（不同品位能源按需求梯级使用的效率）", "", ""], "r": "ACD", "e": "能源综合利用效率衡量的是系统对能源的整体利用情况。A选项一次能源利用率直接体现系统总输出能量与消耗一次能源的关系，能衡量能源综合利用效率；C选项热电联产效率体现发电与供热能量和消耗能源的关系，是综合利用效率的一部分；D选项能源梯级利用效率反映不同品位能源按需求梯级使用的效率，也属于能源综合利用效率范畴。而B选项冷电比只是供冷量与发电量的比值，不涉及能源综合利用效率。答案：ACD", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220383", "t": 2, "q": "以下哪些生物质原料的特性会显著影响生物质气化发电系统的气化效率和产气质量（　）?", "a": ["原料的碳氢比（C/H）", "原料的水分含量", "原料的灰分熔点", "原料的堆积密度", "", ""], "r": "ABCD", "e": "A. 原料的碳氢比（C/H）<br />碳氢比影响气化反应中可燃气体（如CO、H₂、CH₄）的生成比例。碳氢比过高会导致焦油和残炭增加，降低气化效率和产气质量；碳氢比过低则可能增加水分消耗，影响气体热值。<br />B. 原料的水分含量 <br />水分含量直接影响气化反应的热平衡。水分过高需消耗大量热量用于蒸发，降低气化温度和产气热值；水分过低则可能导致反应温度过高，引发结渣问题。<br />C. 原料的灰分熔点 <br />灰分熔点决定气化炉的运行温度上限。灰分熔点过低（如<1000℃）易在高温下熔融结渣，堵塞炉排和气流通道，导致气化效率下降甚至系统停运。<br />D. 原料的堆积密度 <br />堆积密度影响气化炉的进料稳定性和气化反应速率。密度过低（如秸秆类）会导致进料困难、气化炉内气流分布不均，降低产气质量；密度过高则可能影响气化剂与原料的接触效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220384", "t": 2, "q": "在风力发电机组运行维护中，下列哪些项目属于\"年度维护\"的核心内容（　）?", "a": ["叶片表面检查与清洁", "发电机轴承润滑脂补充", "变桨系统蓄电池容量检测", "风轮平衡测试", "", ""], "r": "ABCD", "e": "年度维护包含叶片外观检查清洁、发电机轴承补润滑脂、变桨蓄电池容量检测、风轮平衡测试，均属于风机年度重点检修项目。", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220385", "t": 2, "q": "在海洋能中的潮流能发电技术中，以下哪些属于潮流能转换装置的典型结构形式（　）?", "a": ["振荡水柱式装置", "水平轴水轮机", "垂直轴水轮机", "收缩水道式（Oscillating Water Column）装置", "", ""], "r": "BC", "e": "水平轴、垂直轴水轮机是潮流能典型结构；振荡水柱式、收缩水道式属于波浪能装置。", "ap": [false, false, false, false, false, false]}, {"id": "2034800297125220386", "t": 2, "q": "在太阳能利用技术中，以下哪些属于聚光型太阳能热发电（CSP）系统与光伏（PV）系统相比的优势（　）?", "a": ["可通过储热装置实现电力输出的平稳性", "在高温工况下可结合制氢等储能技术", "发电效率受环境温度变化的影响更小", "单位装机容量的占地面积更小", "", ""], "r": "ABC", "e": "聚光型太阳能热发电（CSP）系统能通过储热装置调节电力输出，实现平稳供电，且高温下可结合制氢等储能技术，发电效率受环境温度影响小；而光伏（PV）系统单位装机容量占地面积小。所以ABC是CSP系统优势。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516608", "t": 3, "q": "能源环境经济中的\"碳足迹\"是指一个产品或活动在全生命周期内产生的二氧化碳排放量，不包括其他温室气体。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "碳足迹指一个产品或活动在全生命周期内产生的温室气体排放量，并非仅指二氧化碳，还包括其他温室气体。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516609", "t": 3, "q": "能源经济中的\"可再生能源配额制\"是指要求能源生产企业在其能源产量中，可再生能源所占比例不低于规定值，以促进可再生能源发展。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "可再生能源配额制就是强制要求能源生产或销售企业，其所供能源中可再生能源必须达到规定比例，以此推动可再生能源发展。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516610", "t": 3, "q": "能源强度（单位GDP能耗）下降意味着一定量的GDP增长所消耗的能源减少，说明能源利用效率提高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "能源强度下降，即单位GDP能耗降低，意味着同样产出一定量GDP所消耗能源变少，这体现能源利用效率提升。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516611", "t": 3, "q": "能源需求侧管理中的\"错峰用电\"措施，是通过调整用户用电时间，将高峰负荷转移到低谷时段，以减少电网峰谷差，提高电网运行效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "错峰用电就是通过引导用户调整用电时间，把原本高峰时的用电转移到低谷时段，这样能有效降低电网峰谷差，提升电网运行效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516612", "t": 3, "q": "能源与环境经济分析中，“绿色证书”制度是通过对可再生能源发电项目发放证书，企业购买证书以抵消其碳排放，该制度可促进可再生能源的发展。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“绿色证书”是对可再生能源发电电量的认可证明，建立该制度后，规定电力供应商需有一定比例可再生能源电量，否则需购买绿色证书，以此激励可再生能源发电，促进其发展。题干表述与实际相符。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516613", "t": 3, "q": "能源与环境经济中的\"边际减排成本\"是指每额外减少一单位碳排放所需的成本，该成本通常随减排量的增加而递增。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "边际减排成本就是每多减少一单位碳排放的成本，随着减排量增加，容易减排的部分先完成，后续减排难度增大，所需成本通常会递增。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516614", "t": 3, "q": "能源与环境经济中的\"能源回弹效应\"是指提高能源效率后，能源价格下降导致能源消费增加，部分抵消了能源效率提升的节能效果，该效应仅存在于工业领域。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“能源回弹效应”虽会因提高能源效率、能源价格下降使能源消费增加，部分抵消节能效果，但它并非仅存在于工业领域，在交通、居民生活等多个领域都可能存在。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516615", "t": 3, "q": "能源与环境经济中的\"能源消费弹性系数\"是指能源消费增长率与GDP增长率的比值，该系数大于1时，说明能源消费增长快于经济增长，能源利用效率下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "能源消费弹性系数定义就是能源消费增长率与GDP增长率比值，系数大于1意味着能源消费增长速度比经济增长快，通常反映能源利用效率下降。", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516616", "t": 3, "q": "能源与环境经济中的\"全生命周期成本\"包括能源系统的建设成本、运行成本和维护成本，不包括废弃物处理成本。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "全生命周期成本涵盖能源系统从建设、运行、维护到废弃物处理等整个过程的成本，所以题干说不包括废弃物处理成本错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516617", "t": 3, "q": "能源与环境经济中的\"碳税\"是按企业的碳排放量征收的税收，碳税税率越高，企业减少碳排放的动力越强，因此碳税税率应尽可能高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然高碳税税率能增强企业减碳动力，但税率过高会给企业带来过重负担，影响企业正常运营和经济发展，所以不能一味追求尽可能高的税率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516618", "t": 3, "q": "能源与环境经济中的\"外部性\"仅指能源生产带来的负面影响（如污染），不包括正面影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "能源与环境经济中的“外部性”既包括能源生产带来的负面影响，如污染，也包括正面影响，像某些清洁能源项目带动周边经济发展等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516619", "t": 3, "q": "生物质成型燃料的\"堆积密度\"是衡量其运输和储存性能的重要指标，堆积密度越大，单位体积的燃料质量越大，运输成本越低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "堆积密度大意味着单位体积燃料质量大，在运输相同质量燃料时所需体积小，能降低运输成本，所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516620", "t": 3, "q": "生物质成型燃料的\"热值\"主要取决于生物质原料的种类和含水量，与成型压力无关。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "生物质成型燃料热值主要由原料种类和含水量决定，成型压力主要影响燃料的密度、成型率等物理性质，对热值无实质影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516621", "t": 3, "q": "生物质发电的\"灰渣\"中含有丰富的氮、磷、钾等元素，可作为有机肥料直接施用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "生物质发电的“灰渣”虽含氮、磷、钾等元素，但通常还可能存在重金属等有害物质，不能直接作为有机肥料施用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516622", "t": 3, "q": "生物质气化发电中，\"焦油\"是气化过程的主要副产品，焦油含量过高会堵塞管道和设备，因此需通过高温裂解、催化转化等方式将其去除或转化为可燃气体。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在生物质气化发电里，焦油是气化主要副产品，其含量高会对管道和设备造成堵塞问题，采用高温裂解、催化转化等手段去除或转化焦油为可燃气体是常见处理办法。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516623", "t": 3, "q": "生物质气化发电中，采用空气作为气化剂时，气化气中的氮气含量较高，导致气化气热值降低，因此空气气化仅适用于小规模发电项目。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "空气含大量氮气，作气化剂会使气化气中氮气多，降低热值。小规模发电对热值要求相对低，空气气化成本低易操作，适合小规模项目。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516624", "t": 3, "q": "生物质气化发电中，采用氧气作为气化剂比采用空气作为气化剂，产生的气化气热值更高，因为氧气不会引入氮气稀释可燃气体。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "氧气作气化剂不引入氮气，避免了氮气对可燃气体的稀释，能使产生的气化气中可燃成分占比更高，所以热值更高。", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516625", "t": 3, "q": "生物质气化发电中，气化剂的选择会影响产气成分，采用空气作为气化剂比采用纯氧气化能产生更高浓度的可燃气体（如CO、H2）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "采用纯氧作为气化剂时，由于没有氮气稀释，能产生更高浓度的可燃气体（如 CO、H₂），而空气含大量氮气，会稀释可燃气体浓度。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516626", "t": 3, "q": "生物质气化发电中，气化气中的焦油含量与气化温度成正相关，气化温度越高，焦油含量越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "实际上生物质气化发电中，气化气中的焦油含量与气化温度成负相关，温度升高焦油会裂解，含量降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516627", "t": 3, "q": "生物质气化过程中，气化温度越高，气化气中甲烷的含量越高，因为高温有利于甲烷的生成反应。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在生物质气化中，高温不利于甲烷生成，高温会促使甲烷发生裂解等反应，使甲烷含量降低而非升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516628", "t": 3, "q": "生物质直燃发电锅炉的\"炉膛容积热负荷\"设计值低于燃煤锅炉，主要是因为生物质燃料的挥发分含量高，燃烧速度快，需更大的炉膛空间。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "生物质燃料挥发分高、燃烧速度快，为保证充分燃烧和避免燃烧过于集中等问题，确实需要更大炉膛空间，所以其炉膛容积热负荷设计值低于燃煤锅炉。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516629", "t": 3, "q": "生物质直燃发电系统中，为防止锅炉结渣，生物质原料的灰分熔点应低于锅炉炉膛的运行温度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "若生物质原料灰分熔点低于锅炉炉膛运行温度，灰分易熔化结渣，不利于发电系统运行，应使灰分熔点高于炉膛运行温度来防止结渣。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516630", "t": 3, "q": "生物质直燃发电中，燃料的含水量越高，锅炉的热效率越高，因为水分蒸发可吸收热量，降低排烟温度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。燃料含水量越高，水分蒸发需吸收大量热量，这部分热量来自燃料燃烧释放的热，会使有效利用的热量减少，导致锅炉热效率降低，并非提高。所以答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516631", "t": 3, "q": "生物质直燃发电中，燃料的水分含量过高会导致锅炉燃烧温度降低，燃烧效率下降，甚至出现熄火现象。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水分高的燃料燃烧时，水分蒸发要吸收大量热量，会使锅炉燃烧温度降低，影响燃烧充分程度，导致燃烧效率下降，严重时会熄火。", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516632", "t": 3, "q": "水力发电的\"年发电量\"等于水轮机的额定出力乘以一年的运行小时数，与来水流量和水头无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。年发电量与来水流量和水头有关，水轮机额定出力只是理论功率，实际发电受来水流量、水头影响，年发电量并非简单用额定出力乘运行小时数。答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516633", "t": 3, "q": "水力发电机组的\"导叶\"数量越多，水轮机的流量调节精度越高，因此大型水轮机的导叶数量通常多于小型水轮机。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "导叶数量多能更精细地调节水流，使流量调节精度更高，大型水轮机对流量调节要求高，所以通常导叶数量多于小型水轮机。", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516634", "t": 3, "q": "水力发电机组的\"飞逸转速\"是指机组在额定负荷下突然甩负荷，且导叶无法关闭时，机组达到的最大转速，该转速通常为额定转速的1.5-2倍。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516635", "t": 3, "q": "水力发电机组的\"励磁调节器\"采用\"比例-积分-微分（PID）\"控制算法，其作用是根据电网电压变化，实时调节励磁电流，维持发电机端电压稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "励磁调节器使用PID控制算法，能依据电网电压变化，通过调节励磁电流，实现对发电机端电压的稳定控制。", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516636", "t": 3, "q": "水力发电站的\"调节库容\"是指水库可用于调节径流的库容，调节库容越大，电站对负荷变化的适应能力越强，调峰性能越好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "调节库容能调节径流，其越大意味着可灵活调配水量的能力越强，电站应对负荷变化就更从容，调峰性能也更好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516637", "t": 3, "q": "水力发电站的\"调压室\"通常设置在引水管道的末端，靠近水轮机的位置，以有效减小水锤压力。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "调压室一般设在引水管道与水轮机之间，靠近水轮机，能在机组负荷变化时调节水位、减小水锤压力。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516638", "t": 3, "q": "水力发电站的\"尾水管\"的作用是将水轮机排出的水流引入下游河道，同时利用水流的动能和势能，提高水轮机的效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "尾水管可将水轮机排出水流引入下游河道，还能回收水轮机出口处水流的部分动能和势能，减少能量损失，从而提高水轮机效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516639", "t": 3, "q": "水力发电站的\"压力管道\"采用钢板焊接而成，其设计压力需大于最大工作压力的1.2倍，以确保在水锤等瞬时高压下不发生破裂。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "为保障水力发电站压力管道在水锤等瞬时高压情况安全，设计压力大于最大工作压力一定倍数很有必要，通常要求设计压力大于最大工作压力1.2倍，说法合理。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516640", "t": 3, "q": "水力发电站的\"溢洪道\"是水库的重要泄水设施，其作用是在水库水位超过安全水位时，排泄多余水量，保障大坝安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "溢洪道确实是水库重要泄水设施，当水库水位超安全水位时，它能排泄多余水量，避免水位过高威胁大坝安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516641", "t": 3, "q": "水力发电站的水轮机安装高程越低，越容易发生气蚀现象，因为安装高程低会导致水轮机进口压力过低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516642", "t": 3, "q": "水力发电中，水轮机的\"飞逸转速\"是指机组在额定水头下，突然甩去全部负荷且无制动措施时，水轮机达到的最大转速，该转速通常是额定转速的1.5-3倍。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "水力发电中飞逸转速定义准确，其通常是额定转速1.5 - 3倍也正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516643", "t": 3, "q": "水轮机的\"比转速\"越高，其适用的水头越高，流量越小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。水轮机比转速越高，适用水头越低，流量越大；比转速越低，适用水头越高，流量越小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516644", "t": 3, "q": "太阳能光伏并网逆变器的\"防逆流功能\"是指防止光伏系统输出的电能向电网倒送，仅允许光伏电能自用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“防逆流功能”就是避免光伏系统产生的电能倒送回电网，让光伏电能优先满足自身用电需求。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516645", "t": 3, "q": "太阳能光伏阵列的\"最佳倾角\"是指光伏阵列接收太阳辐射量最大时的倾角，该倾角等于当地的纬度，与季节无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "太阳能光伏阵列的“最佳倾角”受多种因素影响，虽与当地纬度有关，但并非简单等于当地纬度，且会随季节变化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516646", "t": 3, "q": "太阳能光伏组件的\"开路电压\"随温度升高而升高，因为温度升高会增加光生载流子的数量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。温度升高虽会增加光生载流子数量，但同时也会使半导体材料的本征载流子浓度增加，导致二极管反向饱和电流增大，从而使开路电压降低，并非升高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516647", "t": 3, "q": "太阳能光伏组件的\"旁路二极管\"并联在光伏组件两端，其作用是当组件被遮挡时，防止组件发生热斑效应，保护组件不受损坏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "旁路二极管是并联在光伏组件两端的，能在组件被遮挡时，让电流绕过被遮挡的电池片，避免热斑效应损坏组件。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516648", "t": 3, "q": "太阳能光伏组件的\"填充因子\"是开路电压与短路电流的乘积与最大功率点电压、电流乘积的比值，填充因子越大，组件的功率输出性能越好。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516649", "t": 3, "q": "太阳能光伏组件的短路电流随光照强度的增加而线性增加，因为光照强度越高，单位时间内产生的光生载流子数量越多。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "光照强度升高，单位时间产生光生载流子增多，会使短路电流线性增加，该说法符合太阳能光伏组件特性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516650", "t": 3, "q": "太阳能光伏组件的转换效率随光照强度的增加而线性提高，当光照强度超过1000W/m²时，转换效率达到最大值并保持稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "太阳能光伏组件转换效率并非随光照强度增加线性提高，且超过一定光照强度后效率会下降而非保持稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516651", "t": 3, "q": "太阳能光热发电系统的\"聚光比\"是指聚光器接收的太阳辐射面积与吸热器吸收太阳辐射面积的比值，聚光比越高，吸热器表面温度越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "聚光比越高，意味着更多太阳辐射被聚集到吸热器上，会使吸热器表面温度越高，而不是越低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516652", "t": 3, "q": "太阳能光热发电系统的\"吸热器\"表面涂覆选择性吸收涂层，该涂层的特点是对太阳辐射的吸收率高，对自身热辐射的发射率低，以减少热量损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "太阳能光热发电中，吸热器涂覆的选择性吸收涂层就是要提高对太阳辐射吸收、降低自身热辐射发射率来减少热量损失，此描述符合实际情况。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298232516653", "t": 3, "q": "太阳能光热发电系统的储热系统容量越大，系统的供电稳定性越好，可在无光照时段持续供电的时间越长。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "储热系统能存储太阳能光热发电产生的热能，容量大意味着存储的热能多，在无光照时可利用存储的热能持续发电，使供电更稳定、持续供电时间更长。", "ap": [false, false, false, false, false, false]}, {"id": "2034800298236710912", "t": 3, "q": "太阳能聚光热发电系统中，塔式聚光系统的聚光比主要取决于定日镜的数量和单镜面积，与定日镜到吸热器的距离无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "塔式聚光系统聚光比与定日镜数量、单镜面积有关，同时也和定日镜到吸热器的距离有关，距离会影响光线汇聚效果等从而影响聚光比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298236710913", "t": 3, "q": "太阳能热发电系统的\"储热时间\"是指储热装置在满负荷工况下可持续释放热量的时间，储热时间越长，系统的供电稳定性越差。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "储热时间长意味着能在较长时间稳定释放热量，可保障系统持续稳定发电，供电稳定性会更好，而不是越差。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800298236710914", "t": 3, "q": "压水堆核电站的二回路系统与一回路系统完全隔离，因此二回路的蒸汽中不含任何放射性物质，可直接用于驱动汽轮机发电。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800298236710915", "t": 3, "q": "压水堆核电站的一回路冷却剂采用去离子水，其主要作用是传递反应堆产生的热量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "压水堆核电站一回路冷却剂用去离子水，可减少对设备腐蚀，主要功能就是把反应堆核裂变产生的热量传递出去。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第8章 储能科学与技术（1）", "n": "基础练习题【含解析】 / 第8章 储能科学与技术（1）", "qs": [{"id": "2034800303890632704", "t": 1, "q": "下列蓄热材料中，适合用于高温热能储存（300℃以上）的有（　）?", "a": ["硝酸钠-硝酸钾混合熔盐", "高密度混凝土", "自来水", "石蜡", "", ""], "r": "A", "e": "高温热能储存材料需能承受300℃以上高温。A选项硝酸钠 - 硝酸钾混合熔盐熔点较高、热稳定性好，适合高温储存；B高密度混凝土、C自来水、D石蜡耐热性差，不适合高温储存。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632705", "t": 1, "q": "耦合储能系统的\"拓扑结构\"设计中，属于\"串联型耦合\"的特点有哪些?", "a": ["适合处理不同时间尺度的储能需求（如短时波动、长时储能）", "前一个储能单元的输出作为后一个储能单元的输入", "各储能单元可独立运行，也可协同运行", "系统控制逻辑简单，易于实现", "", ""], "r": "B", "e": "串联型耦合就是前一个储能单元输出作为后一个输入。A选项是混合储能优势，C选项是各耦合方式都可能有的特点，D选项串联型耦合控制不简单。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632706", "t": 1, "q": "超导磁储能（SMES）系统的储能容量，与以下哪个参数的平方成正比?", "a": ["超导线圈的电阻", "超导线圈的电流", "超导线圈的温度", "超导线圈的长度", "", ""], "r": "B", "e": "超导磁储能系统中，储能容量公式为「test/yiwen_img/importSubject/2034800299033628672.png」（L为电感，I为电流），可知储能容量与电流的平方成正比。超导线圈电阻为零，温度和长度与储能容量无平方关系。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632707", "t": 1, "q": "超导磁储能（SMES）系统要维持超导线圈的超导状态，关键依赖哪种条件?", "a": ["采用低温冷却介质（如液氮）", "配置大容量储能电容器", "使用高纯度铜导线制作线圈", "通入足够大的励磁电流", "", ""], "r": "A", "e": "超导材料需在低温环境下才呈现超导状态，超导磁储能系统维持超导线圈超导状态关键靠低温冷却，液氮是常用冷却介质。B选项储能电容器与维持超导状态无关；C选项高纯度铜导线不是超导材料；D选项通入励磁电流不是维持超导态的关键。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632708", "t": 1, "q": "超导电磁储能（SMES）在电力系统中用于抑制暂态电压波动的主要依据是其哪项技术特征（从响应速度与能量释放特性分析）", "a": ["响应时间达微秒级", "储能密度高", "充放电循环寿命长", "能量转换效率接近100%", "", ""], "r": "A", "e": "抑制暂态电压波动需要快速响应并释放能量，SMES响应时间达微秒级，能快速响应并及时释放能量抑制波动。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632709", "t": 1, "q": "超级电容器储能的能量储存原理是基于以下哪种效应?", "a": ["电极与电解质界面的双电层效应", "材料的相变潜热", "重物的重力势能", "电极材料的化学反应", "", ""], "r": "A", "e": "超级电容器主要是依靠电极与电解质界面的双电层效应来储存能量。B选项材料的相变潜热用于相变储能；C选项重物重力势能是重力储能；D选项电极材料化学反应是电池储能原理。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632710", "t": 1, "q": "超级电容器与锂离子电池的最核心区别在于?", "a": ["超级电容器的循环寿命更短", "超级电容器的充放电速度更快", "超级电容器的能量密度更高", "超级电容器的成本更低", "", ""], "r": "B", "e": "超级电容器充放电靠离子在电极表面快速吸附和脱附，速度快，而锂离子电池涉及化学反应，充放电慢，这是二者核心区别。A选项超级电容器循环寿命长；C选项锂离子电池能量密度更高；D选项超级电容器成本通常较高。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632711", "t": 1, "q": "抽水蓄能电站的\"调相工况\"，主要作用是?", "a": ["提高水泵水轮机的效率", "调节电网的电压水平", "增加电站的发电量", "降低抽水工况的能耗", "", ""], "r": "B", "e": "调相工况是让电机像同步调相机一样运行，向电网输送或吸收无功功率，以此调节电网电压水平。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632712", "t": 1, "q": "抽水蓄能电站的\"上水库死水位\"设置过低，最可能导致的问题是?", "a": ["水库蒸发损失增大", "水轮机工况时，发电量减少", "水泵工况时，水泵进口补气，发生气蚀", "水库泥沙淤积加剧", "", ""], "r": "C", "e": "上水库死水位过低时，水泵工况下，水泵进口压力降低易补气，从而发生气蚀。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632713", "t": 1, "q": "抽水蓄能电站的可逆式水轮机-水泵机组，在从发电工况切换到抽水工况时，以下哪种操作顺序是保障机组安全稳定切换的关键（从机组受力与转速控制分析）", "a": ["先切换导叶角度，再降低转速至同步转速，最后接通电网", "先降低转速至同步转速，再切换导叶角度，最后接通电网", "先接通电网，再降低转速至同步转速，最后切换导叶角度", "先降低转速至零，再切换导叶角度，最后提升转速至同步转速", "", ""], "r": "B", "e": "从机组受力与转速控制看，需先让转速降低到同步转速，使机组状态稳定，再切换导叶角度改变水流状态，最后连接电网。A选项先切换导叶使受力突变；C选项先接通电网未控制好转速易冲击；D选项降速到零再提转速效率低且操作复杂。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632714", "t": 1, "q": "抽水蓄能电站的水泵水轮机在\"水轮机工况\"运行时，若导叶开度突然减小，下列哪种现象会发生?", "a": ["转轮进口压力升高", "压力钢管内出现水锤现象", "尾水管内真空度降低", "机组转速突然降低", "", ""], "r": "B", "e": "导叶开度突然减小，水流被突然截断，压力钢管内水流惯性导致压力急剧变化，会出现水锤现象。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632715", "t": 1, "q": "抽水蓄能电站在抽水工况下，其能量来源是?", "a": ["柴油发电机的电能", "下水库的水能", "电网输送的电能", "上水库的水能", "", ""], "r": "C", "e": "抽水蓄能电站抽水时是把水从下水库抽到上水库，此过程消耗电能，电能由电网输送而来。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632716", "t": 1, "q": "抽水蓄能电站在电网运行中，最核心的调节功能是以下哪一项?", "a": ["调峰填谷", "电压调节", "紧急调频", "备用供电", "", ""], "r": "A", "e": "抽水蓄能电站能在用电低谷时抽水蓄能，用电高峰时放水发电，起到调峰填谷作用，这是其在电网运行中最核心功能。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632717", "t": 1, "q": "电磁储能技术中，超导磁储能（SMES）与超级电容储能相比，下列哪项特性是SMES独有的?", "a": ["需低温环境维持超导状态", "能量密度随存储时间延长无衰减", "工作过程中无化学反应", "充放电响应时间小于1毫秒", "", ""], "r": "A", "e": "超导磁储能利用超导体在低温下电阻为零的特性储能，需低温环境维持超导状态，这是超级电容储能没有的特性。超级电容储能也能量密度随存储时间延长无衰减、工作中无化学反应、充放电响应时间小于1毫秒。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632718", "t": 1, "q": "电磁储能中的\"超级电容\"用于电网电压支撑，其作用原理主要是?", "a": ["通过与电网同步运行，提供频率支撑", "通过抑制谐波，改善电网电能质量", "通过储存电能，补充电网有功功率缺额", "通过快速充放电调节电网无功功率，稳定电压", "", ""], "r": "D", "e": "超级电容能快速充放电，可调节电网无功功率，进而稳定电压用于电网电压支撑。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632719", "t": 1, "q": "电磁储能中的超导磁储能（SMES），其储能容量主要取决于下列哪个参数?", "a": ["超导线圈的电流", "超导线圈的匝数", "冷却系统的功率", "超导材料的临界温度", "", ""], "r": "A", "e": "超导磁储能的能量公式为「test/yiwen_img/importSubject/2034800299033628672.png」（L为电感，I为电流），可见储能容量主要和电流相关。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632720", "t": 1, "q": "电磁储能中的超级电容储能，其能量密度主要取决于下列哪个参数?", "a": ["电极材料的比表面积", "电容的额定电压", "极板的厚度", "电解质的电导率", "", ""], "r": "A", "e": "超级电容储能能量密度与电极材料比表面积密切相关，比表面积越大，可存储电荷越多，能量密度越高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632721", "t": 1, "q": "电化学储能系统中，将多个电池单体串联的主要目的是?", "a": ["延长电池的循环寿命", "提高系统的充放电功率", "提高系统的输出电压", "提高系统的输出容量", "", ""], "r": "C", "e": "电池串联时，电压等于各电池电压之和，多个电池单体串联主要是为提高系统输出电压。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632722", "t": 1, "q": "电化学储能中，\"钠离子电池\"相比\"锂离子电池\"，最主要的优势是?", "a": ["电极材料资源更丰富（钠储量远高于锂）", "充放电循环寿命更长", "工作温度范围更窄", "能量密度更高", "", ""], "r": "A", "e": "钠在地壳中的储量远高于锂，所以钠离子电池电极材料资源更丰富，这是其相比锂离子电池最主要优势。B选项充放电循环寿命锂离子电池有优势；C选项工作温度范围窄是劣势；D选项能量密度锂离子电池更高。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632723", "t": 1, "q": "电化学储能中，钒液流电池的\"电解液浓度\"对电池性能的影响，下列说法正确的是?", "a": ["电解液浓度越高，电池的充放电效率越高", "电解液浓度对电池的循环寿命无影响", "电解液浓度越高，电池的开路电压越高", "电解液浓度超过临界值后，会析出晶体，导致电池失效", "", ""], "r": "D", "e": "A项，电解液浓度过高会带来一些问题，并非越高充放电效率越高；B项，电解液浓度会影响电池循环寿命；C项，开路电压主要取决于电极材料等，并非浓度越高就越高；D项，当电解液浓度超过临界值，会析出晶体，进而使电池失效。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632724", "t": 1, "q": "钒液流电池作为电化学储能技术的一种，其最显著的技术优势是?", "a": ["电池体积小、重量轻", "充放电速度快于超级电容器", "能量密度高于锂离子电池", "循环寿命长（万次以上）", "", ""], "r": "D", "e": "钒液流电池循环寿命可达万次以上，这是其显著优势。它体积大、重量重，充放电速度不如超级电容器，能量密度低于锂离子电池。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632725", "t": 1, "q": "飞轮储能系统的\"转子材料\"若采用\"碳纤维复合材料\"相比\"高强度钢\"，最主要的优势是?", "a": ["材料强度更高，允许的最大转速更高", "材料导热性更好，散热更易", "材料密度更低，转动惯量更小", "材料成本更低，经济性更好", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632726", "t": 1, "q": "飞轮储能系统的储能容量与飞轮转速的数学关系是?", "a": ["与转速成正比", "与转速的平方成正比", "与转速的立方成正比", "与转速成反比", "", ""], "r": "B", "e": "飞轮储能系统的储能容量公式为「test/yiwen_img/importSubject/2034800299184623616.png」，「test/yiwen_img/importSubject/2034800299226566656.png」是转速相关量，可知储能容量与转速的平方成正比。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632727", "t": 1, "q": "飞轮储能系统的能量存储量与下列哪个参数呈平方关系?", "a": ["飞轮转子的材料密度", "飞轮转子的转速", "飞轮转子的半径", "飞轮转子的质量", "", ""], "r": "B", "e": "飞轮储能能量公式E=½Jω²，J与密度、半径、质量呈一次关系，仅角速度ω以平方进入，故与转速呈平方关系。", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632728", "t": 1, "q": "飞轮储能系统的真空室设计中，若真空度降低（即空气压力升高），会对飞轮的运行产生的主要影响是（从能量损耗与安全角度）", "a": ["转子的材料应力减小", "飞轮的储能容量增加", "空气阻力导致的能量损耗增大", "转子的转动惯量增大", "", ""], "r": "C", "e": "真空度降低，空气增多，空气阻力增大，会使能量损耗增大。A选项材料应力与真空度无关；B选项储能容量和真空度无直接关联；D选项转动惯量取决于飞轮自身质量分布等，和真空度没关系。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632729", "t": 1, "q": "飞轮储能系统中，\"真空罩\"的主要作用是?", "a": ["减少飞轮转动过程中的空气阻力损耗", "提高飞轮转子的机械强度", "防止飞轮转子受外界振动影响", "降低飞轮转子的温度", "", ""], "r": "A", "e": "在飞轮储能系统里，真空环境能减少空气，从而降低飞轮转动时的空气阻力，减少能量损耗。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632730", "t": 1, "q": "飞轮储能系统中，采用\"磁悬浮轴承\"相比\"机械轴承\"，最主要的作用是?", "a": ["降低飞轮转子的制造成本", "减少飞轮转动过程中的摩擦损耗", "增加飞轮的储能容量", "提高飞轮的最大转速", "", ""], "r": "B", "e": "磁悬浮轴承能使飞轮处于悬浮状态，避免了像机械轴承那样的直接接触，从而大大减少了飞轮转动过程中的摩擦损耗。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632731", "t": 1, "q": "飞轮储能系统中，为最大限度减少能量损耗，需重点控制的损耗类型是?", "a": ["空气阻力损耗", "机械摩擦损耗", "电磁感应损耗", "电池自放电损耗", "", ""], "r": "A", "e": "在飞轮储能系统中，高速旋转的飞轮在空气中会因空气阻力产生较大能量损耗，控制空气阻力损耗能最大程度减少整体能量损失。而机械摩擦损耗可通过优化设计等降低到较小程度；电磁感应损耗不是主要损耗；该系统不是靠电池储能，不存在电池自放电损耗。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632732", "t": 1, "q": "飞轮储能系统中，永磁轴承的主要作用是?", "a": ["储存飞轮的旋转动能", "为飞轮提供旋转驱动力", "减少飞轮旋转时的摩擦损耗", "监测飞轮的实时转速", "", ""], "r": "C", "e": "永磁轴承利用磁力使飞轮悬浮，能有效减少飞轮旋转时与其他部件的接触，从而降低摩擦损耗。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632733", "t": 1, "q": "飞轮储能系统中，转子的材料选择需综合考虑强度与密度，以下哪种材料特性组合最有利于提升飞轮的储能容量（忽略其他结构因素）", "a": ["高硬度、低密度", "高强度、高密度", "高屈服强度、低密度", "高弹性模量、低密度", "", ""], "r": "C", "e": "飞轮储能容量与转子强度和质量有关，要提升储能容量，需材料强度高且质量轻（即密度低），屈服强度体现材料开始塑性变形的能力，高屈服强度能让转子承受更大应力，结合低密度可提升储能容量。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632734", "t": 1, "q": "风-光-储耦合储能系统中，储能单元的首要控制目标是?", "a": ["提高风、光发电机的发电效率", "平抑风、光发电的出力波动", "降低整个系统的建设成本", "最大化储能系统的循环寿命", "", ""], "r": "B", "e": "风、光发电具有间歇性和波动性，储能单元主要作用是平抑这种出力波动，保障电力系统稳定。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632735", "t": 1, "q": "工业领域常用的熔盐蓄热材料，其典型的适用温度范围是?", "a": ["100-300℃（中温）", "600-800℃（超高温）", "0-100℃（低温）", "300-600℃（高温）", "", ""], "r": "D", "e": "熔盐蓄热材料在工业中常用于高温场景，典型适用温度范围是300 - 600℃。所以答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632736", "t": 1, "q": "基于\"重物升降\"的重力储能系统，其核心能量转换路径是?", "a": ["电能→热能→重力势能→电能", "电能→机械能→重力势能→机械能→电能", "电能→电磁能→重力势能→电能", "电能→化学能→重力势能→电能", "", ""], "r": "B", "e": "基于“重物升降”的重力储能系统，先用电能驱动设备使重物上升，电能转化为机械能，重物上升增加重力势能，机械能转化为重力势能，重物下降重力势能又转化为机械能，最后通过发电机将机械能转化为电能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632737", "t": 1, "q": "绝热压缩空气储能与等温压缩空气储能的本质区别在于?", "a": ["是否使用电动压缩机", "是否配备专门的蓄热装置", "是否接入公共电网", "是否需要地下储气室", "", ""], "r": "B", "e": "绝热压缩空气储能在压缩过程中热量不与外界交换，等温压缩空气储能要保持温度恒定，二者本质区别在于绝热压缩空气储能需专门蓄热装置来处理压缩热，等温压缩无此需求。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632738", "t": 1, "q": "空气压缩储能系统的\"储热子系统\"若采用\"显热储热材料（如陶瓷）\"，相比\"潜热储热材料（如高温熔盐）\"，最主要的缺点是?", "a": ["储热密度更低", "储热温度更低", "成本更高", "热损失更大", "", ""], "r": "A", "e": "显热储热是通过物质温度变化储存热量，潜热储热是利用物质相变储存热量，潜热储热材料储热密度比显热储热材料高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632739", "t": 1, "q": "空气压缩储能系统的蓄热装置中，若采用显热蓄热材料（如岩石），以下哪项会导致蓄热装置的放热效率显著下降（从热量传递与储存特性分析）?", "a": ["蓄热材料的颗粒尺寸过大", "压缩空气的进气温度降低", "蓄热装置的保温层厚度增加", "蓄热材料的填充量减少", "", ""], "r": "A", "e": "蓄热材料颗粒尺寸过大，会减小与空气的接触面积，不利于热量传递，导致放热效率显著下降。B项进气温度降低主要影响蓄热，而非放热效率；C项保温层厚度增加利于热量保存，不影响放热效率；D项填充量减少只是蓄热总量变化，不直接导致放热效率显著下降。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632740", "t": 1, "q": "空气压缩储能系统中，\"先进绝热压缩储能（AA-CAES）\"相比\"传统diabatic CAES\"，最核心的改进是?", "a": ["使用了变频压缩机，降低能耗", "取消了储热子系统，简化结构", "采用了更高压力的储气库，提高储能密度", "增加了回热装置，回收压缩热用于膨胀做功", "", ""], "r": "D", "e": "先进绝热压缩储能（AA - CAES）核心改进就是增加回热装置，能回收压缩热用于膨胀做功，提升效率。传统diabatic CAES无此关键改进。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800303890632741", "t": 1, "q": "空气压缩储能系统中，\"盐穴\"作为储气库相比\"地下洞穴\"，最主要的优势是?", "a": ["储气压力更高", "气密性更好", "建设周期更短", "适用地域更广", "", ""], "r": "B", "e": "“盐穴”本身密封性好，相比“地下洞穴”，能更好地防止气体泄漏，气密性是其相比“地下洞穴”作为储气库的最主要优势。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832896", "t": 2, "q": "超导磁储能（SMES）系统的核心组成部分有（　）?", "a": ["高速旋转的飞轮", "超导线圈", "维持低温的冷却系统（如液氦系统）", "能量转换的功率调节系统", "", ""], "r": "BCD", "e": "超导磁储能系统利用超导线圈储存能量。超导线圈是核心部件，用于储存磁能；冷却系统保证超导线圈处于低温超导状态，是维持超导特性必要条件；功率调节系统实现能量的充放转换。而高速旋转的飞轮是飞轮储能系统的关键，并非超导磁储能系统核心。所以答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832897", "t": 2, "q": "抽水蓄能电站的核心组成部分包括（　）?", "a": ["光伏阵列", "上水库和下水库", "水泵水轮机机组", "输电线路", "", ""], "r": "BC", "e": "抽水蓄能电站利用上、下水库间水位差工作，水泵水轮机机组实现电能和势能转换，是核心组成。光伏阵列用于光伏发电，输电线路是输送电能设施，并非核心。答案选BC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832898", "t": 2, "q": "抽水蓄能电站的上水库工程设计中，为减少水库蓄水后的渗漏损失，需考虑的关键工程措施有（多选，从防渗原理与结构设计角度）", "a": ["库底铺设土工膜防渗层", "水库周边设置排水减压井", "水库进口设置拦污栅", "库岸采用混凝土防渗墙", "", ""], "r": "AD", "e": "从防渗原理与结构设计角度看，A选项库底铺设土工膜防渗层可直接阻止库底水渗漏；D选项库岸采用混凝土防渗墙能防止库岸的水渗漏，这两项是减少渗漏损失的关键措施。B选项排水减压井主要是为了降低地下水位等，并非直接防渗。C选项拦污栅是用于拦截杂物，和减少渗漏无关。所以答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832899", "t": 2, "q": "抽水蓄能电站的水泵水轮机通常具备的运行工况有（　）?", "a": ["发电工况（水轮机驱动电机）", "停机待机工况", "抽水工况（电机驱动水泵）", "应急供热工况", "", ""], "r": "ABC", "e": "抽水蓄能电站水泵水轮机主要用于发电和抽水。发电工况是水轮机驱动电机发电，抽水工况是电机驱动水泵抽水，停机待机也是常见状态。而应急供热不是其通常具备的运行工况。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832901", "t": 2, "q": "抽水蓄能电站建设对环境可能产生的影响有（　）?", "a": ["水泵水轮机运行产生噪音污染", "施工过程中可能引发水土流失", "水库淹没导致土地资源占用", "改变区域水文情势，影响生态", "", ""], "r": "ABCD", "e": "抽水蓄能电站建设，设备运行会有噪音；施工破坏地表易致水土流失；建水库会淹没土地；还会改变区域水文影响生态。ABCD选项描述的影响均会出现。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832902", "t": 2, "q": "抽水蓄能电站中，\"地下厂房\"相比\"地面厂房\"，具有的优势有哪些?", "a": ["厂房布置更灵活，可适应复杂地形", "受外界气候影响小，运行环境稳定", "厂房结构受力更合理，抗震性能更好", "减少对地表生态环境的破坏", "", ""], "r": "ABCD", "e": "地下厂房建在地下，地形适应性强可灵活布置，受外界气候影响小运行稳定，地下结构抗震优且不破坏地表生态。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832903", "t": 2, "q": "抽水蓄能电站中，\"可逆式水泵水轮机\"相比\"分离式水泵-水轮机\"（即独立的水泵和水轮机），具有的优势有哪些?", "a": ["适应的水头范围更广", "机组占地面积更小", "工况转换速度更快", "运行维护更简单", "", ""], "r": "BCD", "e": "结构集成优势<br />可逆式机组将水泵与水轮机功能集成于单一转轮与共用流道。<br />相比分离式需独立布置两套机组，机组占地面积更小，土建与厂房投资显著降低。<br />工况转换机制<br />可逆式机组通过电气与控制系统改变流向即可实现泵/轮机模式切换。<br />分离式机组需启动不同设备并操作隔离阀门，机械动作复杂，转换速度慢。<br />运维复杂度<br />可逆式机组共用主轴、轴承及流道，机械部件数量少。<br />分离式机组拥有独立的水泵与水轮机两套系统，密封、轴承等维护点倍增，运维更复杂。<br />水头适应范围<br />可逆式机组受单一转轮设计限制，高效区较窄，水头适应范围有限。<br />分离式机组可分别为水泵与水轮机优化设计，适应的水头范围更广。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832904", "t": 2, "q": "抽水蓄能电站中，影响\"水泵工况\"效率的主要因素有哪些?", "a": ["水泵的进口真空度（避免气蚀）", "压力钢管的水流速度（避免水头损失）", "转轮的磨损程度", "导叶开度与转速的匹配度", "", ""], "r": "ABCD", "e": "A. 水泵的进口真空度（避免气蚀）<br />进口真空度不足会导致气蚀，破坏水流连续性，降低效率并损坏部件，因此是影响水泵工况效率的关键因素之一。<br />B. 压力钢管的水流速度（避免水头损失） <br />压力钢管的水流速度直接影响水头损失（包括沿程损失和局部损失）。水头损失增加会降低水泵的有效扬程，从而影响系统的综合效率。因此，控制水流速度以减少水头损失是维持水泵工况高效运行的重要因素。<br />C. 转轮的磨损程度 <br />转轮磨损会改变叶片形状和水力特性，导致能量转换效率下降，是影响水泵工况长期效率的主要因素。<br />D. 导叶开度与转速的匹配度 <br />导叶开度与转速的匹配决定水泵的运行工况点是否落在高效区。不匹配会导致偏离最优工况，效率显著下降。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832905", "t": 2, "q": "电磁储能技术（含超导磁储能、超级电容器等）的典型技术特征包括（　）?", "a": ["运行受环境温度影响显著", "响应速度快（毫秒至秒级）", "适合短时（分钟级）储能应用", "维护成本低且寿命长", "", ""], "r": "BCD", "e": "A 错误：\"运行受环境温度影响显著\"并非电磁储能的典型特征——超级电容器工作温度范围宽（-40℃~70℃）；SMES 虽需低温维持超导状态，但属于运行条件而非对环境温度敏感，且该表述通常用于电化学储能。<br />B. 响应速度快（毫秒至秒级） <br />超导储能响应速度可达毫秒级，超级电容器响应速度也极快。这是电磁储能共同的典型特征。<br />C. 适合短时（分钟级）储能应用 <br />电磁储能能量密度较低，持续放电时间短，主要适用于短时、大功率场景，如电网调频、电压支撑等。超级电容器和超导储能均属于典型的功率型储能，适合分钟级短时应用。<br />D. 维护成本低且寿命长 <br />超导储能除真空和制冷系统外无转动部件，寿命长；超级电容器循环寿命可达10万次以上，维护成本相对较低。因此该选项正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832906", "t": 2, "q": "电磁储能技术包含多种类型，以下哪些属于电磁储能的范畴且可用于电力系统短时功率支撑（多选，从储能原理与应用场景分析）", "a": ["超级电容器储能", "电感储能", "飞轮储能", "超导电磁储能（SMES）", "", ""], "r": "ABD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832907", "t": 2, "q": "电磁储能技术的主要缺点有（　）?", "a": ["超导磁储能维护成本高（需持续冷却）", "超级电容器对环境温度敏感（低温性能下降）", "循环寿命短（千次以下）", "启动响应时间长（分钟级）", "", ""], "r": "AB", "e": "电磁储能包括超导磁储能和超级电容器储能等，超导磁储能需持续冷却维护成本高，超级电容器对环境温度敏感低温性能下降。而电磁储能循环寿命长，启动响应时间短。答案：AB ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832908", "t": 2, "q": "电磁储能技术适合的应用场景有（　）?", "a": ["应急供电（如医院备用）", "电网频率调节（需毫秒级响应）", "新能源并网时的出力平滑", "短时备用电源（分钟级供电）", "", ""], "r": "ABCD", "e": "电磁储能（超导储能 SMES）响应速度可达毫秒级，适合电网调频；可短时快速释放能量，用于新能源出力平滑、应急短时备用供电，满足医院这类短时应急供电场景。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832909", "t": 2, "q": "电磁储能技术中，属于\"静态电磁储能\"的有哪些?", "a": ["超级电容储能", "电池储能", "飞轮储能", "电感储能", "", ""], "r": "AD", "e": "静态电磁储能依靠电场或磁场来储存能量，超级电容靠电场，电感靠磁场。电池储能是化学能与电能转换，飞轮储能是机械能与电能转换，二者不属于静态电磁储能。答案选AD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832910", "t": 2, "q": "电磁储能中，\"超级电容\"的性能参数中，影响其功率密度的主要因素有哪些?", "a": ["电容的体积", "电极材料的比表面积", "电容的额定电压", "电极与电解质的接触电阻", "", ""], "r": "BCD", "e": "A. 电容的体积<br />电容的体积主要影响能量密度（单位体积存储的能量），而非功率密度。功率密度由单位时间内的能量传输能力决定，与体积无直接关联。<br />B. 电极材料的比表面积 <br />电极材料的比表面积越大，电荷存储能力越强，但功率密度主要取决于电极的导电性和离子传输速率。高比表面积材料（如活性炭、碳纳米管）可增加有效反应面积，但需结合高电导率才能提升功率密度。<br />C. 电容的额定电压 <br />功率密度与电压的平方成正比(P=V2/R)，因此额定电压是影响功率密度的关键因素之一。提高额定电压可显著提升最大功率输出能力。<br />D. 电极与电解质的接触电阻 <br />接触电阻是衡量超级电容内阻（等效串联电阻，ESR）的重要组成部分。ESR越小，充放电时压降越小，能量传输效率越高，功率密度越大。因此，低接触电阻对高功率密度至关重要。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832911", "t": 2, "q": "电磁储能中，\"电感储能\"的缺点有哪些?", "a": ["设备体积大，占地面积广", "储能密度低，不适合大规模储能", "成本高，经济性差", "能量储存过程中存在磁滞损耗和涡流损耗", "", ""], "r": "ABCD", "e": "电感储能存在设备体积大、储能密度低、成本高、有磁滞和涡流损耗等缺点。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832912", "t": 2, "q": "电磁储能中的\"超导磁储能（SMES）\"适合用于电网的哪些应用场景?", "a": ["备用电源（长时间供电）", "大规模电能储存（如削峰填谷）", "抑制电网谐波和电压闪变", "电网调频（响应时间<100毫秒）", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832913", "t": 2, "q": "电磁储能中的超级电容器，其相比传统电容器的优势体现在哪些方面（多选，从储能特性与应用角度）", "a": ["更长的循环寿命", "更高的能量密度", "更大的功率密度", "更快的充放电速率", "", ""], "r": "ABCD", "e": "超级电容器相比传统电容器，通过双电层/赝电容机制大幅提升了能量密度（B）；同时具备极高的功率密度（C）和秒级充放电速率（D）；且基于物理储能，无化学副反应，拥有超长循环寿命（A）。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832914", "t": 2, "q": "电化学储能电池常见的失效模式有（　）?", "a": ["电压骤升（超过额定电压）", "内阻增大（充放电效率下降）", "容量衰减（无法达到额定容量）", "电极材料腐蚀（结构损坏）", "", ""], "r": "BCD", "e": "电化学储能电池在使用中，内阻增大、容量衰减、电极材料腐蚀都是常见的失效表现，而电压骤升并非常见失效模式。答案选BCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832915", "t": 2, "q": "电化学储能系统的\"电池管理系统（BMS）\"需实现的核心功能有哪些?", "a": ["电网调度指令接收与执行", "电池温度监测与热管理", "电池故障诊断与保护", "电池单体电压均衡控制", "", ""], "r": "BCD", "e": "BMS主要针对电池进行管理，B选项能监测电池温度并管理，C选项可诊断电池故障并保护，D选项能均衡电池单体电压，这都是BMS核心功能；A选项电网调度指令接收与执行不是BMS核心功能。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832916", "t": 2, "q": "电化学储能系统的热管理系统，主要作用包括（　）?", "a": ["延长电池的循环寿命", "维持电池组内各单体温度均匀性", "提高电池的工作效率", "确保电池在安全温度范围内工作", "", ""], "r": "ABCD", "e": "热管理将电池控制在安全工作温度区间，改善单体温度一致性，提升工作效率，减缓老化，延长电池循环寿命。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832917", "t": 2, "q": "电化学储能系统的消防安全设计中，需采取的关键防护措施有（多选，从火灾预防与扑救角度）", "a": ["电池组之间设置防火隔层", "电池舱设置气体灭火系统", "系统配备温度与烟雾探测器", "电池舱采用开放式结构设计", "", ""], "r": "ABC", "e": "A设置防火隔层可防止火灾蔓延；B气体灭火系统能有效扑救火灾；C探测器可及时发现火灾隐患。而D开放式结构设计不利于控制火灾，易使火势扩散。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832918", "t": 2, "q": "电化学储能系统中，常用的电解质类型包括（　）?", "a": ["熔融盐电解质", "液态有机电解质", "凝胶态电解质", "气态电解质", "", ""], "r": "ABC", "e": "在电化学储能系统中，常见电解质有熔融盐电解质、液态有机电解质、凝胶态电解质等。而气态电解质因难以有效约束和参与电极反应，一般不用于电化学储能系统。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832919", "t": 2, "q": "电化学储能系统中的电池管理系统（BMS），主要实现的功能包括（　）?", "a": ["调节电池系统的热管理回路", "实时监测电池单体电压、温度", "诊断电池故障并触发保护机制", "直接参与电网的调度指令制定", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832920", "t": 2, "q": "电化学储能中，\"锂离子电池\"的循环寿命缩短的主要原因有哪些?", "a": ["长期过充或过放（导致电极活性物质失效）", "充放电过程中电极材料的体积膨胀与收缩（导致结构破坏）", "电池单体电压不均衡（引发局部过充过放）", "电池长期处于高温环境（加速副反应）", "", ""], "r": "ABCD", "e": "ABCD选项情况都会影响锂离子电池性能，导致循环寿命缩短。过充过放使电极活性物质失效；电极材料体积变化破坏结构；单体电压不均衡引发局部问题；高温加速副反应。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832921", "t": 2, "q": "电化学储能中，\"铅炭电池\"相比传统铅酸电池，改进的方面有哪些?", "a": ["提高了电池的能量密度", "在负极添加炭材料，提高负极的析氢过电位，减少水损耗", "提高了电池的充放电倍率（可大电流充放电）", "降低了电池的生产成本", "", ""], "r": "ABC", "e": "A. 提高了电池的能量密度： 铅炭电池通过在负极添加炭材料，提高了活性物质的利用率，从而提升了能量密度（通常比传统铅酸电池提高约10%~30%）。<br />B. 在负极添加炭材料，提高负极的析氢过电位，减少水损耗： 炭材料的加入使负极表面形成高比表面积导电网络，提高了析氢过电位，抑制了副反应（如析氢），从而减少电解液中的水损耗，降低维护频率。<br />C. 提高了电池的充放电倍率（可大电流充放电）： 炭材料的导电性和多孔结构提升了电极的电荷传输效率，使铅炭电池支持更高的充放电倍率（如1C~2C），优于传统铅酸电池的0.3C~0.5C。<br />D. 降低了电池的生产成本： 铅炭电池的生产成本通常高于传统铅酸电池，主要是因为炭材料（如活性炭、碳纤维、石墨烯等）的添加增加了制造成本，且工艺复杂度更高。但铅炭电池的全生命周期成本更低（因寿命更长、维护减少）。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832922", "t": 2, "q": "电化学储能中，\"全钒液流电池\"的优点有哪些?", "a": ["正负极电解液可独立循环，避免交叉污染", "储能容量与功率可独立设计（容量由电解液量决定，功率由电池堆决定）", "充电过程中无气体析出，安全性高", "能量密度相对较高，但低于锂离子电池", "", ""], "r": "ABC", "e": "全钒液流电池正负极电解液独立循环能防交叉污染；储能容量和功率可分别设计；充电无气体析出安全性好；其能量密度较低，并非相对较高。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832923", "t": 2, "q": "飞轮储能系统的关键组成部件包括（　）?", "a": ["减少摩擦的轴承系统（如磁悬浮轴承）", "能量转换的电机", "高速旋转的飞轮本体", "用于温度调节的冷却装置", "", ""], "r": "ABC", "e": "飞轮储能系统是一种利用飞轮高速旋转来储存和释放能量的装置。其关键组成部件主要包括与飞轮能量转换和稳定运行直接相关的部分。首先，我们来看选项A，减少摩擦的轴承系统（如磁悬浮轴承）。在飞轮储能系统中，为了降低能量损失和提高效率，减少摩擦是至关重要的。轴承系统，特别是磁悬浮轴承，能够实现飞轮的高速稳定旋转，是飞轮储能系统的关键部件之一。接着是选项B，能量转换的电机。飞轮储能系统需要通过电机来实现电能与机械能之间的转换。电机在系统中起着至关重要的作用，它既是能量的输入装置，将电能转换为飞轮的动能，又是能量的输出装置，将飞轮的动能转换回电能。然后是选项C，高速旋转的飞轮本体。飞轮是储能系统的核心部件，它通过高速旋转来储存和释放能量。没有飞轮本体，飞轮储能系统就无从谈起。最后是选项D，用于温度调节的冷却装置。虽然冷却装置对于保持系统稳定运行有一定帮助，但它并非飞轮储能系统的关键组成部件。冷却装置更多地是辅助设备，用于确保系统在最佳工作温度下运行，而非直接参与能量的储存和释放过程。综上所述，飞轮储能系统的关键组成部件包括减少摩擦的轴承系统（A）、能量转换的电机（B）和高速旋转的飞轮本体（C）。因此，正确答案是ABC。所以，这道题的答案是：ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832924", "t": 2, "q": "飞轮储能系统的适用应用场景包括（　）?", "a": ["跨天级长时储能（24小时以上）", "新能源发电（风/光）出力平滑", "电网频率快速调节（秒级响应）", "应急电源备用（分钟级供电）", "", ""], "r": "BCD", "e": "飞轮储能响应速度快，适合秒级响应的电网频率快速调节、分钟级供电的应急电源备用，也可用于新能源发电出力平滑；但它能量密度低，不适合跨天级长时储能。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800307866832925", "t": 2, "q": "飞轮储能系统的转子设计中，为提升系统的储能密度与运行安全性，需考虑的关键设计参数有（多选，从转子结构与材料特性分析）", "a": ["转子的直径与长度比例", "转子的表面粗糙度", "转子的连接方式（如整体式、装配式）", "转子的动平衡精度", "", ""], "r": "ACD", "e": "A选项，转子直径与长度比例影响其转动惯量等，对储能密度有影响；C选项，不同连接方式关系到转子整体结构稳定性和安全性；D选项，动平衡精度影响运行稳定性与安全性。而B选项表面粗糙度对储能密度和运行安全性影响不大。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307871027200", "t": 2, "q": "飞轮储能系统选择飞轮材料时，需重点考虑的材料性能有（　）?", "a": ["高强度（抵抗离心力）", "高导热性（快速散热）", "低成本（控制造价）", "高韧性（防止脆性破裂）", "", ""], "r": "ACD", "e": "A. 高强度（抵抗离心力） 飞轮高速旋转时，材料需承受巨大的离心应力，高强度是保证飞轮在高速下不发生结构失效的关键 。<br />B. 高导热性（快速散热） 飞轮储能系统通常置于真空环境中以减少风阻损耗，热量主要通过辐射或主动冷却系统散发，材料导热性并非核心选择指标。实际设计中更关注低热膨胀系数以避免动平衡问题，而非快速散热 。<br />C. 低成本（控制造价） 成本是工程化应用的重要考量因素，尤其在长时储能或大规模部署场景下，材料成本直接影响系统经济性 。<br />D. 高韧性（防止脆性破裂） 飞轮储能系统对安全性要求极高，高韧性材料可防止脆性断裂，避免高速旋转下碎片飞散造成灾难性后果 。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307871027201", "t": 2, "q": "飞轮储能系统中，\"能量释放过程\"的特点有哪些?", "a": ["释放的功率可通过调节转速精确控制", "释放过程中能量密度保持稳定", "释放过程中无污染物排放", "释放时间受飞轮储能容量和输出功率影响（时间=容量/功率）", "", ""], "r": "ACD", "e": "飞轮释能时转速不断下降，能量密度随之降低；可调节转速控制输出功率，无污染物排放，释放时长由容量与输出功率共同决定。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307871027202", "t": 2, "q": "飞轮储能系统中，\"真空系统\"需满足的技术要求有哪些?", "a": ["具备快速抽真空能力，缩短系统启动时间", "真空罩材质需具备高强度，承受大气压力", "长期运行中真空度保持稳定，无泄漏", "真空系统的能耗占飞轮系统总能耗的比例低", "", ""], "r": "ABCD", "e": "A. 具备快速抽真空能力，缩短系统启动时间<br />飞轮储能系统需在启动前建立真空环境以减少风阻损耗，快速抽真空能力能够缩短系统从启动到稳定运行的时间，提高系统可用性。<br />B. 真空罩材质需具备高强度，承受大气压力 <br />真空罩内部接近真空，外部承受大气压力（约101.325 kPa），因此壳体材料需具备足够强度（如不锈钢、高强度铝合金或复合材料）以防止变形或破裂。<br />C. 长期运行中真空度保持稳定，无泄漏 <br />真空度是维持低风阻损耗和系统效率的关键参数。长期运行中，真空系统需通过密封设计（如金属密封圈、焊接结构）确保无泄漏，避免因空气进入导致摩擦损耗增加和轴承寿命下降。<br />D. 真空系统的能耗占飞轮系统总能耗的比例低 <br />真空系统的主要能耗来自真空泵（如分子泵、干泵）的持续运行或间歇性补抽。为不影响整体系统效率，真空系统的能耗通常需控制在飞轮系统总能耗的较低比例以内（如<5%）。", "ap": [false, false, false, false, false, false]}, {"id": "2034800307871027203", "t": 2, "q": "飞轮储能系统中，为提高系统储能容量和效率，可采取的技术措施有哪些?", "a": ["增大真空罩的体积，降低空气阻力", "增大转子的直径，提高转动惯量", "优化磁悬浮轴承设计，减少摩擦损耗", "采用多转子并联结构，提高总转动惯量", "", ""], "r": "BCD", "e": "A增大真空罩体积对降低空气阻力作用不大，不是有效提高储能容量和效率的方式；B增大转子直径能提高转动惯量，可增加储能；C优化磁悬浮轴承设计减少摩擦损耗能提高效率；D多转子并联提高总转动惯量也有助于增加储能。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800307871027204", "t": 2, "q": "空气压缩储能系统的关键技术难点包括（　）?", "a": ["压缩机的绝热效率（减少能量损耗）", "储气室的长期密封性（防止漏气）", "膨胀机的发电效率（提高做功能力）", "系统的快速启动能力", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800307871027205", "t": 2, "q": "空气压缩储能系统的空气储罐设计中，需考虑的安全与性能指标有（多选，从储罐功能与运行安全角度）", "a": ["储罐的抗震等级（适应场地条件）", "储罐的耐腐蚀性能（应对潮湿空气）", "储罐的耐压强度（与设计压力匹配）", "储罐的容积（与系统储气量匹配）", "", ""], "r": "ABCD", "e": "从储罐功能与运行安全角度分析：A选项抗震等级影响储罐在地震等情况下的安全性；B选项耐腐蚀性能可保证储罐在潮湿空气环境下正常运行；C选项耐压强度需与设计压力匹配，否则会有安全隐患；D选项容积要与系统储气量匹配才能实现系统功能。四个选项均符合要求。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073536", "t": 3, "q": "超导磁储能系统的超导线圈在常温环境下即可实现超导状态，无需额外冷却。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超导材料需在特定低温环境下才会进入超导状态，超导磁储能系统的超导线圈也不例外，常温无法实现超导。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073537", "t": 3, "q": "超导磁储能系统的储能容量与超导线圈的电阻成正比，电阻越大，储能容量越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超导磁储能系统依靠超导线圈储存能量，超导状态下线圈电阻为零，其储能容量与电流和电感有关，并非与电阻成正比。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073538", "t": 3, "q": "超导磁储能系统的响应时间可达毫秒级，适合用于电网的快速调频。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超导磁储能系统利用超导线圈将电磁能直接储存起来，其响应速度极快，响应时间能达到毫秒级，可快速吸收或释放能量，能很好地满足电网快速调频需求。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073539", "t": 3, "q": "超导电磁储能（SMES）的储能容量大，适合作为电力系统的长期储能装置（如储存数小时电能）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超导电磁储能虽功率密度高、响应速度快，但储能容量相对较小，且维持超导状态需低温环境，成本高，不适合作为电力系统长期储能装置。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073540", "t": 3, "q": "超级电容器的储能原理基于电极与电解质之间的化学反应，因此其能量密度较高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超级电容器储能基于双电层电容和法拉第准电容原理，是物理过程而非化学反应，且其能量密度相对较低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073541", "t": 3, "q": "超级电容器的循环寿命可达10万次以上，远高于锂离子电池（通常1000-5000次）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超级电容器的循环寿命长是其特性之一，一般能达10万次以上，而锂离子电池通常在1000 - 5000次，该描述与事实相符。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073542", "t": 3, "q": "抽水蓄能电站的\"调峰\"作用，是指在用电低谷时抽水蓄能，用电高峰时发电供电。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站在用电低谷时，利用多余电能将水从下水库抽到上水库储存能量；用电高峰时，将上水库的水放下来发电，实现调峰。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073543", "t": 3, "q": "抽水蓄能电站的\"综合效率\"（发电能量与抽水消耗能量的比值）通常在70%-80%之间，主要损耗来自水泵水轮机的机械损耗和压力钢管的水力损耗。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站综合效率一般在70% - 80%，其主要损耗就是水泵水轮机机械损耗和压力钢管水力损耗等。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073544", "t": 3, "q": "抽水蓄能电站的发电功率仅与水轮机的流量成正比，与上下水库的水位差（水头）无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站发电功率与水轮机流量和上下水库水位差（水头）都有关，根据发电功率计算公式，二者都会影响功率大小。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073545", "t": 3, "q": "抽水蓄能电站在抽水工况下，其可逆式机组消耗的电能全部转化为水的重力势能，无能量损失。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在实际能量转化过程中，由于存在各种阻力等因素，能量转化不可能达到100%无损失，抽水蓄能电站抽水时，可逆式机组消耗的电能不可能全部转化为水的重力势能。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073546", "t": 3, "q": "抽水蓄能电站的上水库和下水库的水位差越大，水泵水轮机的出力越大，因此水位差应尽可能大，无需考虑机组额定水头限制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然水位差大在一定程度上能使水泵水轮机出力增大，但机组有额定水头限制，若水位差超出限制，会影响机组正常运行甚至损坏设备，所以必须考虑机组额定水头限制。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073547", "t": 3, "q": "抽水蓄能电站的水泵水轮机在\"水泵工况\"运行时，若进口水位低于设计值，会导致水泵进口压力降低，发生气蚀现象，损坏水泵叶片。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "进口水位低于设计值，会使水泵进口压力降低，当压力降低到一定程度，水会汽化形成气泡，气泡破裂产生冲击力，会损坏水泵叶片，即发生气蚀现象。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073548", "t": 3, "q": "抽水蓄能电站的水泵水轮机在\"水轮机工况\"运行时，转轮进口的水流速度方向与转轮旋转方向相反，会导致水流撞击转轮，产生水力损失。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073549", "t": 3, "q": "抽水蓄能电站的水泵水轮机在抽水工况和发电工况下，其旋转方向是相反的。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073550", "t": 3, "q": "抽水蓄能电站的下水库水位变化对发电工况的功率影响，比上水库水位变化更大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "抽水蓄能电站发电功率与水头相关，上水库水位变化对水头影响更大，所以上水库水位变化对发电工况功率影响更大，题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073551", "t": 3, "q": "抽水蓄能电站的综合效率与水泵水轮机的效率、管道的水力效率、电机的电气效率均有关，是各效率的乘积。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站综合效率受水泵水轮机、管道水力、电机电气等效率影响，其综合效率的确是各部分效率的乘积。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073552", "t": 3, "q": "抽水蓄能电站的综合转换效率通常在70%-85%之间，主要受水泵和水轮机效率影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "抽水蓄能电站综合转换效率一般在70% - 85%，其效率主要由水泵和水轮机效率等决定，该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073553", "t": 3, "q": "电磁储能中的超导磁储能（SMES），其超导线圈的临界电流密度随温度降低而增大，因此降低冷却温度可提高SMES的储能容量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "因为超导线圈临界电流密度随温度降低而增大，而储能容量与电流等因素相关，电流密度增大有助于提高储能容量，所以降低冷却温度可提高SMES的储能容量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073554", "t": 3, "q": "电磁储能中的超导磁储能（SMES），其储能能量可长期储存，无能量损耗，因此适合用于长时间备用电源。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超导磁储能虽能量损耗小，但需维持超导状态，持续消耗能量用于制冷，不能无能量损耗地长期储存能量，不适合做长时间备用电源。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073555", "t": 3, "q": "电磁储能中的超级电容，其充放电循环寿命可达10万次以上，远高于锂离子电池，适合用于需要频繁充放电的场景（如电网调频）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超级电容充放电循环寿命长，能达10万次以上，比锂离子电池高很多，这种特性使其适合频繁充放电场景，像电网调频就需要设备频繁充放电。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073556", "t": 3, "q": "电磁储能中的超级电容，其能量密度与额定电压的平方成正比，因此提高额定电压可显著提高超级电容的能量密度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "超级电容能量公式E=1/2 CU<sup>2<\/sup>，能量密度与额定电压平方成正比，提升电压可显著提升能量密度。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073557", "t": 3, "q": "电磁储能中的电感储能，其放电过程是将磁场能转化为电能，放电时间短，适合用于短时大功率放电场景（如电磁炮）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电感储能原理就是放电时把储存的磁场能转化为电能，且其放电时间短、功率大，很适合短时大功率放电场景像电磁炮。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073558", "t": 3, "q": "电磁储能中的电感储能，其响应速度比超级电容器更快，更适合用于电力系统的暂态稳定控制。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "超级电容器响应速度比电感储能更快，更适合用于电力系统暂态稳定控制。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073559", "t": 3, "q": "电化学储能电池的充放电深度（DOD）越大，其循环寿命就越长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般来说，电化学储能电池充放电深度（DOD）越大，电池内部的电极材料、电解液等发生的化学反应程度越剧烈，对电池结构和性能的损伤越大，循环寿命会越短，而不是越长。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073560", "t": 3, "q": "电化学储能系统的BMS（电池管理系统）可直接制定电网的调度指令，控制电池充放电。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "BMS主要负责电池状态监测、均衡控制等电池内部管理功能，电网调度指令由电网调度中心根据电网运行情况制定，BMS不能直接制定调度指令。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073561", "t": 3, "q": "电化学储能系统的BMS（电池管理系统）若出现单体电压均衡故障，仅会影响电池组的容量，不会影响电池的安全。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单体电压均衡故障不仅会影响电池组容量，还可能因电池电压不一致，导致部分电池过充或过放，引发热失控等安全问题。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073562", "t": 3, "q": "电化学储能系统中，将多个电池单体并联的主要目的是提高系统的输出电压。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多个电池单体并联主要是增大系统的输出电流，串联才是提高系统输出电压。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073563", "t": 3, "q": "电化学储能中，钒液流电池的正负极电解液均为钒离子溶液，因此无需担心电解液交叉污染问题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然钒液流电池正负极电解液均为钒离子溶液，但在实际运行中，离子仍可能通过隔膜等发生一定程度的交叉渗透，存在电解液交叉污染问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073564", "t": 3, "q": "电化学储能中，锂离子电池的\"热失控\"事故通常是由于电池内部短路引发，与外部环境温度无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "说法错误。锂离子电池“热失控”事故通常是由电池内部短路引发，但外部环境温度也会有影响。高温环境会加速电池内部化学反应，使电池产热增加，可能引发热失控；低温环境会降低电池性能，也可能在一定条件下导致热失控。答案为错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073565", "t": 3, "q": "电化学储能中，锂离子电池的\"首次充放电效率\"越高，说明电池在首次充电过程中形成的固体电解质界面（SEI）膜越稳定，电池后续循环寿命越长。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073566", "t": 3, "q": "电化学储能中，钠硫电池的工作温度需维持在300-350℃，因此其运行过程中无需考虑散热问题。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然钠硫电池工作温度需维持在300 - 350℃，但运行过程中会产生额外热量，若不散热会使温度过高影响电池性能和寿命，所以需要考虑散热问题。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073567", "t": 3, "q": "电化学储能中，铅酸电池的循环寿命比锂离子电池短，因此铅酸电池不适合用于需要频繁充放电的场景（如电网调频）。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "因为铅酸电池循环寿命短，而频繁充放电场景对电池循环寿命要求高，所以它不适合用于电网调频这类需频繁充放电的场景。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073568", "t": 3, "q": "钒液流电池的正、负极电解液是同一种钒离子溶液，可混合储存以简化系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "钒液流电池正、负极电解液中钒离子价态不同，不能混合储存，混合会发生自放电等问题，影响电池性能。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073569", "t": 3, "q": "飞轮储能系统的储能容量与飞轮的转动惯量和角速度的平方成正比。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "飞轮储能系统的能量公式为「test/yiwen_img/importSubject/2034800299184623616.png」，其中E是储能容量，J是转动惯量，「test/yiwen_img/importSubject/2034800299226566656.png」是角速度，可见储能容量与转动惯量和角速度的平方成正比。所以该说法正确。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073570", "t": 3, "q": "飞轮储能系统的能量密度与飞轮转子的转动惯量成正比，因此增大转子质量即可无限提高能量密度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然能量密度与转动惯量成正比，但增大转子质量会使系统面临诸多限制，如材料强度无法承受高速旋转产生的应力等，不能无限提高能量密度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073571", "t": 3, "q": "飞轮储能系统的能量释放过程中，转轮转速会逐渐降低，因此输出功率也会逐渐降低，需通过控制系统调节以维持稳定输出。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "飞轮储能靠高速旋转的转轮储存能量，释放能量时转轮转速降低，输出功率会随之下降，为保证稳定输出，需控制系统调节。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073572", "t": 3, "q": "飞轮储能系统的真空度越高，空气阻力越小，因此真空度应无限提高，以最大限度减少阻力损耗。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然真空度越高空气阻力越小，但无限提高真空度会带来诸多问题，如技术难度大、成本剧增等，在实际应用中要综合考虑各方面因素，不能单纯追求无限高的真空度。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073573", "t": 3, "q": "飞轮储能系统的真空室真空度越高，转子转动时的空气阻力越小，能量损耗也越低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "真空度高意味着空气稀薄，转子转动时受到的空气阻力就小，能量因克服空气阻力而产生的损耗也会降低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073574", "t": 3, "q": "飞轮储能系统的真空罩若发生破损，会导致空气阻力增加，系统能量损耗增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "飞轮储能系统在真空环境下运行可减少空气阻力。真空罩破损后空气进入，空气阻力增加，能量损耗会增大。", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073575", "t": 3, "q": "飞轮储能系统的真空罩只需在系统启动前抽至指定真空度，运行过程中无需维持，可降低真空系统能耗。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "飞轮储能系统运行时，若不维持真空罩的指定真空度，空气阻力会增大，导致能量损耗增加，影响系统性能，所以运行过程中需维持真空度。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073576", "t": 3, "q": "飞轮储能系统的轴承系统仅需采用机械轴承，即可满足低摩擦损耗的需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "飞轮储能系统仅用机械轴承难以满足低摩擦损耗需求，常还需配合磁悬浮等其他轴承技术来减少损耗。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073577", "t": 3, "q": "飞轮储能系统的转速越高，飞轮所受的离心力越小，对材料强度的要求越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "转速越高，飞轮所受离心力越大，这就需要材料有更高强度来承受，所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073578", "t": 3, "q": "飞轮储能系统的转子材料若采用碳纤维复合材料，其比强度（强度/密度）高于高强度钢，因此可承受更高的离心力，提高最大转速。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "碳纤维复合材料比强度高于高强度钢，比强度高意味着在相同质量下能承受更大应力，所以可承受更高离心力，进而能提高最大转速。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073579", "t": 3, "q": "飞轮储能系统的转子转速越高，其储能容量越大，因此转子转速可以无限制提升。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然转子转速越高储能容量越大，但因材料强度、技术等限制，转子转速不能无限制提升。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073580", "t": 3, "q": "飞轮储能系统适合用于跨天级长时储能（如24小时以上），因为其储能容量大且损耗小。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "飞轮储能系统能量损耗较大，且储能容量相对有限，不适合跨天级长时储能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073581", "t": 3, "q": "风-光-储耦合系统中，储能单元仅需平抑光伏电站的出力波动，无需考虑风电波动。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "风 - 光 - 储耦合系统中，储能单元要平抑的不仅是光伏电站的出力波动，风电出力也具有波动性，储能单元同样需考虑对风电波动的平抑。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073582", "t": 3, "q": "绝热压缩空气储能系统中，压缩过程产生的热量应直接排放，以避免系统过热。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "绝热压缩空气储能系统中，压缩过程产生的热量会被储存起来，在膨胀过程再释放利用，而不是直接排放，直接排放会造成能量浪费。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073583", "t": 3, "q": "空气压缩储能系统采用地下盐穴作为储气库时，盐穴的密封性主要依赖于盐岩自身的蠕变特性，无需额外的防渗措施。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073584", "t": 3, "q": "空气压缩储能系统的膨胀机出口空气温度越低，系统的能量回收效率越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800310635073585", "t": 3, "q": "空气压缩储能系统的膨胀机组在膨胀过程中，若进气温度过低，会导致膨胀机出口温度低于冰点，引发设备结冰损坏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "进气温度过低，经膨胀过程温度会进一步降低，很可能使膨胀机出口温度低于冰点，进而导致设备结冰损坏。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第8章 储能科学与技术（2）", "n": "基础练习题【含解析】 / 第8章 储能科学与技术（2）", "qs": [{"id": "2034800314695159808", "t": 1, "q": "空气压缩储能系统中，采用\"等温压缩-等热膨胀\"循环相比\"绝热压缩-绝热膨胀\"循环，最显著的优势是?", "a": ["能量转换效率更高", "系统结构更简单", "储能密度更高", "对储热材料要求更低", "", ""], "r": "A", "e": "“等温压缩 - 等热膨胀”循环能减少压缩和膨胀过程中的热量损失，使更多能量用于做功，相比“绝热压缩 - 绝热膨胀”循环能量转换效率更高。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159809", "t": 1, "q": "空气压缩储能系统中，采用等温压缩工艺相比绝热压缩工艺，最核心的优势是（从系统效率与能耗角度）", "a": ["提高压缩空气的压力等级", "减少压缩过程中的设备体积", "简化系统的控制逻辑", "降低压缩过程中的能量损失", "", ""], "r": "D", "e": "等温压缩能让压缩过程接近等温状态，减少因压缩升温导致的能量损失，在系统效率与能耗方面优势明显。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159810", "t": 1, "q": "空气压缩储能在电网中的主要应用定位是?", "a": ["短时调频（秒级响应）", "电动汽车充电储能", "大容量长时储能（小时至天级）", "应急UPS电源", "", ""], "r": "C", "e": "空气压缩储能适合大容量长时间存储能量，响应时间为小时至天级，可在用电低谷时储存能量，用电高峰时释放。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159811", "t": 1, "q": "锂离子电池中，磷酸铁锂电池相比三元锂电池（镍钴锰酸锂）的最突出优势是?", "a": ["生产成本更低", "安全性更优", "充放电速率更快", "能量密度更高", "", ""], "r": "B", "e": "磷酸铁锂热稳定性好、不易燃烧爆炸，安全性比三元锂电池更优。成本虽低但不是最突出优势，充放电速率和能量密度方面三元锂电池往往更有优势。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159812", "t": 1, "q": "锂离子电池作为电化学储能的主流技术，其电解液在电池充放电过程中除了传输锂离子外，还需具备的关键特性是（从电池安全与循环寿命角度）", "a": ["良好的导电性（电子）", "较高的密度以增加电解液含量", "高温下不分解且与电极材料相容", "较低的黏度以降低流动阻力", "", ""], "r": "C", "e": "从电池安全与循环寿命角度，高温下不分解且与电极材料相容能保障电池使用安全和延长循环寿命。A选项电子导电性好易引发安全问题；B选项密度与安全和寿命无直接关键联系；D选项低黏度主要影响锂离子传输速率，非安全和寿命关键特性。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159813", "t": 1, "q": "某电化学储能电站出现\"热失控\"事故，经排查为电池内部短路引发，下列哪种电池技术发生该事故的风险最低?", "a": ["镍氢电池", "磷酸铁锂离子电池", "三元锂离子电池", "钠硫电池", "", ""], "r": "B", "e": "磷酸铁锂离子电池热稳定性好，在电池内部短路等情况下发生“热失控”风险相对低；镍氢电池能量密度低；三元锂离子电池热稳定性较差，易“热失控”；钠硫电池工作温度高，存在一定安全隐患。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159814", "t": 1, "q": "某电化学储能系统需用于电网\"削峰填谷\"，要求单次充放电时间长（8-10小时）、循环寿命≥10000次，且安全性高、成本适中，下列哪种电池技术最符合需求?", "a": ["三元锂离子电池", "钒液流电池", "磷酸铁锂离子电池", "铅酸电池", "", ""], "r": "B", "e": "钒液流电池充放电时间长，可满足8 - 10小时要求，循环寿命超10000次，安全性高且成本适中，适合电网“削峰填谷”。三元锂离子电池安全性相对低；磷酸铁锂离子电池单次充放电时间难达8 - 10小时；铅酸电池循环寿命通常低于10000次。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159815", "t": 1, "q": "耦合储能系统的运行控制中，“多储能单元协同控制”的核心目标是?", "a": ["满足电网对功率、容量的需求，同时最小化系统运行成本", "使每个储能单元的充放电次数相同", "简化控制逻辑，降低控制难度", "最大化单个储能单元的效率", "", ""], "r": "A", "e": "多储能单元协同控制主要是综合考虑电网需求与系统成本，A选项满足电网对功率、容量的需求，同时最小化系统运行成本符合其核心目标。B使充放电次数相同并非核心；C简化控制逻辑不是核心目的；D应是考虑整体系统，而非单个单元效率。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159816", "t": 1, "q": "耦合储能系统设计中，“电化学储能+抽水蓄能”耦合的主要目的是?", "a": ["弥补电化学储能的容量不足", "降低抽水蓄能的建设成本", "提高系统的整体效率和灵活性", "提高电化学储能的安全性", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159817", "t": 1, "q": "耦合储能系统实现\"削峰填谷\"功能，主要依赖于储能系统的哪项能力?", "a": ["快速的充放电功率调节能力", "储能单元的高能量密度", "系统的低建设成本", "与电网的高兼容性", "", ""], "r": "A", "e": "“削峰填谷”需在用电高峰快速放电、用电低谷快速充电，这依赖储能系统快速的充放电功率调节能力。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159818", "t": 1, "q": "耦合储能系统中，“热能储存+电化学储能”耦合用于风电消纳，其运行策略应优先采用下列哪种方式?", "a": ["风电低谷时，用风电加热热能储存，电化学储能充电", "风电低谷时，用电网电能补充电化学储能，热能储存不运行", "风电高峰时，优先将风电存入电化学储能，剩余电量用于热能储存", "风电高峰时，优先将风电用于热能储存，剩余电量存入电化学储能", "", ""], "r": "D", "e": "风电高峰时优先用热能储存，因热能储存容量大、成本低可大量消纳风电，剩余再存入电化学储能能更合理利用资源。风电低谷时没必要用风电加热和给电化学储能充电。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159819", "t": 1, "q": "铅酸蓄电池作为传统电化学储能技术，其循环寿命较短的主要原因是（从电极反应与结构变化分析）", "a": ["电解液中的硫酸浓度随循环不断降低", "电池外壳容易因压力变化破裂", "负极铅电极在充电时容易产生枝晶", "正极活性物质二氧化铅在循环中发生软化脱落", "", ""], "r": "D", "e": "题干要求从电极反应与结构变化分析循环寿命短的主要原因。A是电解液问题非电极；B是电池外壳问题，均不符。C负极枝晶会影响但不是主要。D正极活性物质二氧化铅软化脱落，直接影响电极结构和性能，是循环寿命短主因。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159820", "t": 1, "q": "热能储存中，“化学储热”技术相比“潜热储热”，最显著的优势是?", "a": ["储热材料成本更低", "储能密度更高", "储热温度范围更窄", "放热过程更易控制", "", ""], "r": "B", "e": "化学储热在储能密度上比潜热储热有明显优势。A选项成本高低未明确体现差异；C选项化学储热温度范围更宽；D选项题干未表明放热更易控制。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159821", "t": 1, "q": "热能储存中，潜热储热技术相比显热储热技术，最核心的优势是?", "a": ["单位体积储热量更大", "储热材料来源更广泛", "无热损失", "工作温度范围更宽", "", ""], "r": "A", "e": "潜热储热是利用物质相变时吸收或释放热量来储热，显热储热是通过物质温度变化储热。潜热储热单位体积储热量更大。B选项，显热储热材料来源也广泛；C选项，任何储热都有热损失；D选项，显热储热工作温度范围更宽。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159822", "t": 1, "q": "热能储存中，用于太阳能光热电站的高温储热材料，通常要求工作温度≥500℃，下列哪种材料最适合?", "a": ["石蜡（潜热储热）", "熔盐（如硝酸钠-硝酸钾混合物，潜热储热）", "混凝土（显热储热）", "水（显热储热）", "", ""], "r": "B", "e": "石蜡熔点低，水沸点为100℃，都无法满足≥500℃的工作温度要求；混凝土储热温度一般也达不到这么高；熔盐能承受高温，适合作为高温储热材料。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159823", "t": 1, "q": "热能储存中的显热储存技术，选择储存介质时，以下哪项参数组合是决定介质储热能力的核心指标（从热量计算公式出发）", "a": ["导热系数、密度、熔点", "比热容、导热系数、沸点", "密度、温度变化范围、导热系数", "比热容、密度、温度变化范围", "", ""], "r": "D", "e": "根据热量计算公式「test/yiwen_img/importSubject/2034800312044359680.png」（c是比热容，m是质量，「test/yiwen_img/importSubject/2034800312262463488.png」是温度变化），质量「test/yiwen_img/importSubject/2034800312304406528.png」（「test/yiwen_img/importSubject/2034800312400875520.png」是密度），可知决定介质储热能力的核心指标是比热容、密度、温度变化范围。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159824", "t": 1, "q": "熔盐储能作为热能储存的重要技术，其相比水储热的主要优势是（从储热温度与系统应用角度）", "a": ["熔盐的比热容比水大", "熔盐可在更高温度下稳定储存（如500℃以上）", "熔盐的成本比水低", "熔盐的导热系数比水高", "", ""], "r": "B", "e": "从储热温度与系统应用角度，水的沸点是100℃，而熔盐能在500℃以上稳定储存热能，这是熔盐相比水储热的主要优势。A选项熔盐比热容不比水大；C选项成本不是从储热温度与系统应用角度；D选项熔盐导热系数并非比水高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159825", "t": 1, "q": "若飞轮储能系统的真空罩出现破损，会导致系统出现以下哪种情况?", "a": ["储能容量显著增大", "系统的循环寿命延长", "空气阻力损耗大幅增加", "飞轮的转速显著提高", "", ""], "r": "C", "e": "正常运转时真空罩可减少空气阻力，真空罩破损后空气进入，会使空气与飞轮摩擦等导致空气阻力损耗大幅增加。A选项，真空罩破损与储能容量增大无关；B选项，循环寿命不会因真空罩破损而延长；D选项，空气阻力增大只会让飞轮转速减小而非提高。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159826", "t": 1, "q": "显热储热技术相比相变储热技术的主要短板是?", "a": ["储能密度较低", "储热过程中温度波动大", "技术成熟度低", "蓄热材料腐蚀性强", "", ""], "r": "A", "e": "显热储热靠材料温度变化储热，相变储热利用材料相变潜热储热。显热储热储能密度低于相变储热。而显热储热温度较稳定，技术成熟度高，蓄热材料腐蚀性并非其主要短板。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159827", "t": 1, "q": "相变蓄热材料的核心性能参数，决定其储能能力的是?", "a": ["材料的导热系数", "材料的密度", "材料的比热容", "材料的相变潜热", "", ""], "r": "D", "e": "相变潜热是相变蓄热材料在相变过程中吸收或释放的热量，直接决定其储能能力。而导热系数影响热传递速度，密度与储能能力无直接关联，比热容在无相变时衡量吸放热能力，并非决定相变蓄热材料储能能力的核心。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159828", "t": 1, "q": "相变蓄热材料在发生相变过程中，其温度变化规律是?", "a": ["随热量输入持续升高", "基本保持不变（仅吸收潜热）", "随热量输入持续降低", "先升高后保持不变", "", ""], "r": "B", "e": "相变蓄热材料在相变过程中主要吸收潜热来完成状态转变，此过程温度基本保持不变。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159829", "t": 1, "q": "压缩空气储能的\"等温压缩\"过程，最显著的特点是?", "a": ["压缩过程中空气体积基本保持不变", "压缩过程中空气温度基本保持不变", "压缩过程中空气压力基本保持不变", "压缩过程中产生的热量完全储存", "", ""], "r": "B", "e": "“等温”意思就是温度基本不变，所以压缩空气储能的“等温压缩”过程最显著特点是压缩过程中空气温度基本保持不变。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159830", "t": 1, "q": "压缩空气储能系统在膨胀发电过程中的能量转换路径是?", "a": ["压缩空气的内能→膨胀机的机械能→发电机的电能", "重力势能→机械能→电能", "化学能→电能", "电磁能→电能", "", ""], "r": "A", "e": "压缩空气储能系统膨胀发电时，压缩空气具有内能，推动膨胀机运转转化为机械能，再带动发电机发电转化为电能。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159831", "t": 1, "q": "压缩空气储能系统在压缩过程中产生的热量，合理的处理方式是?", "a": ["预热燃气轮机的燃料", "直接排放到大气中", "储存于蓄热材料中，用于膨胀过程", "用于加热电站厂房", "", ""], "r": "C", "e": "压缩空气储能系统压缩过程产热，储存于蓄热材料供膨胀过程使用，可提高系统效率和能源利用率。A项预热燃气轮机燃料并非主要合理处理方式；B项直接排放会造成能源浪费；D项用于加热电站厂房用途较局限。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159832", "t": 1, "q": "压缩空气储能系统中，最常用的储气室类型是?", "a": ["水下耐压容器", "地下盐穴储气室", "混凝土密封洞穴", "地上金属储罐", "", ""], "r": "B", "e": "地下盐穴储气室具有密封性好、稳定性高、成本相对低等优势，是压缩空气储能系统中最常用的储气室类型。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159833", "t": 1, "q": "在抽水蓄能电站的经济运行中，下列哪种因素对电站度电成本影响最大?", "a": ["机组的装机容量", "水泵水轮机的效率", "上水库的总库容", "上网电价的峰谷差", "", ""], "r": "B", "e": "答案：B抽水蓄能电站的度电成本主要受能量转换效率的影响，水泵水轮机的效率直接关系到能量的转换效率，因此对度电成本影响最大。装机容量、上水库库容和上网电价峰谷差虽然也有一定影响，但相比之下，水泵水轮机的效率影响更为关键。", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159834", "t": 1, "q": "在抽水蓄能电站运行中，当电网处于负荷低谷需抽水蓄能时，若忽略管道损耗，以下哪项因素对水泵工况下的能耗影响最显著（从能量转换本质分析）?", "a": ["水泵进口流速大小", "上水库水位波动幅度", "上下水库水位差（水头）", "下水库水温变化", "", ""], "r": "C", "e": "水泵工况能耗本质是将水从下水库抽到上水库克服重力做功，上下水库水位差（水头）决定了重力势能增加量，对能耗影响最显著。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159835", "t": 1, "q": "在抽水蓄能电站中，水泵水轮机在\"水泵工况\"向\"水轮机工况\"转换过程中，下列哪种现象最可能导致机组振动加剧?", "a": ["压力钢管内水流速度稳定", "转轮转速未达到同步转速时提前并网", "导叶开度匀速增大", "尾水位保持恒定", "", ""], "r": "B", "e": "转轮转速未达到同步转速时提前并网，会使机组受力情况复杂，易引发振动加剧。而压力钢管内水流速度稳定、导叶开度匀速增大、尾水位保持恒定一般不会导致振动加剧。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159836", "t": 1, "q": "在电化学储能系统的BMS（电池管理系统）中，以下哪项功能是保障电池组安全运行的核心（从故障预防与风险控制分析）", "a": ["电池组充放电电流计量", "电池单体电压均衡控制", "电池剩余容量（SOC）估算", "电池温度数据采集", "", ""], "r": "B", "e": "单体电压不均衡会造成部分单体过充过放，是电池热失控重要诱因，电压均衡控制是 BMS 保障电池组安全运行的核心；电流计量、SOC 估算、温度采集为监测类功能。", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159837", "t": 1, "q": "在耦合储能系统（如电化学+抽水蓄能耦合）设计中，当电网出现较大功率缺额时，系统的能量调度优先级应遵循的原则是（从响应速度与容量匹配角度）", "a": ["优先调用效率高的储能子系统", "优先调用成本低的储能子系统", "优先调用响应速度快的储能子系统", "优先调用容量大的储能子系统", "", ""], "r": "C", "e": "电网出现较大功率缺额时，为快速稳定电网，需先解决紧急功率问题，响应速度快的储能子系统能迅速响应提供功率。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800314695159838", "t": 1, "q": "重力储能系统的\"能量转换效率\"主要取决于下列哪个环节的损耗?", "a": ["储能介质的储存过程中的泄漏损耗", "储能介质的温度变化导致的热损耗", "控制系统的电能损耗", "储能介质的升降驱动系统（如电机、钢丝绳）损耗", "", ""], "r": "D", "e": "能量转换效率关键在于
