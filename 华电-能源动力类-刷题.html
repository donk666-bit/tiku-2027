0284722663429", "t": 1, "q": "单元机组正常运行时，一次调频的响应时间通常在?", "a": ["小时级", "分钟级", "秒级", "毫秒级", "", ""], "r": "C", "e": "一次调频是指电网频率发生变化时，机组自动调整负荷以维持电网频率稳定，要求响应速度快，其响应时间通常在秒级。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663430", "t": 1, "q": "锅炉启动过程中，当汽包压力升至一定值时进行锅炉排污操作，其主要目的是（　）", "a": ["排出汽包内的水垢和杂质，防止蒸汽品质恶化", "降低汽包水位", "降低汽包温度，控制升温速度", "提高锅炉蒸发量", "", ""], "r": "A", "e": "锅炉排污主要是为排出汽包内水垢和杂质，避免其影响蒸汽品质。B项降低水位不是主要目的；C项排污与控制升温速度无直接关联；D项排污和提高蒸发量无关。答案选A。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663431", "t": 1, "q": "发电机热力系统中，用于冷却发电机定子绕组，且散热效率高、适合大容量机组的冷却介质是（　）", "a": ["变压器油", "水", "氢气", "空气", "", ""], "r": "C", "e": "在发电机热力系统中，冷却发电机定子绕组的介质需要具备高散热效率，尤其对于大容量机组而言。我们来简要分析各选项特性：A. 变压器油：主要用于变压器的绝缘和冷却，但对于发电机定子绕组的冷却效果并非最佳。B. 水：虽然水具有较好的散热性能，但在发电机内部使用存在腐蚀和泄漏的风险。C. 氢气：氢气具有极高的热导率，散热效率非常高，且密度小，有利于减少机械摩擦损失，特别适合大容量机组的发电机定子绕组冷却。D. 空气：空气的散热效率相对较低，不适合用于大容量机组的发电机冷却。综上所述，氢气因其高散热效率和适用于大容量机组的特点，成为发电机定子绕组的理想冷却介质。所以，正确答案是C.氢气。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663432", "t": 1, "q": "金属材料的热脆化通常发生在哪个温度区间?", "a": ["常温至200℃", "400℃至600℃", "200℃至400℃", "600℃以上", "", ""], "r": "B", "e": "金属材料的热脆化是指在高温下，金属材料的塑性和韧性降低，易于发生脆性断裂的现象。热脆化通常发生在金属的再结晶温度附近，这个温度范围大致在400℃至600℃之间。在这个温度区间，金属内部的晶粒长大，导致材料的力学性能下降，特别是韧性显著降低，从而容易发生脆断。因此，正确答案是B选项：“400℃至600℃”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663433", "t": 1, "q": "发电机励磁系统的主要作用是", "a": ["调节发电机的输出功率", "调节发电机的转速", "调节发电机的输出电压", "调节发电机的输出频率", "", ""], "r": "C", "e": "发电机励磁系统通过调节励磁电流来改变发电机的磁场强度，从而实现对发电机输出电压的调节。而调节输出功率主要与原动机输入能量有关；调节转速和频率主要取决于原动机的调速系统。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663434", "t": 1, "q": "金属材料的蠕变极限是指在规定温度和规定时间内，材料允许产生的", "a": ["最小应变值", "最大应变值", "最小应力值", "最大应力值", "", ""], "r": "D", "e": "蠕变极限是在规定温度和时间内，材料产生一定量变形时所对应的应力，这个应力是允许的最大应力值。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663435", "t": 1, "q": "金属材料发生应力腐蚀脆化的必要条件不包括?", "a": ["材料本身具有应力腐蚀敏感性", "存在交变应力", "存在特定的腐蚀介质", "存在拉应力", "", ""], "r": "B", "e": "应力腐蚀脆化需材料有敏感性、特定腐蚀介质和拉应力，交变应力不是必要条件。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663436", "t": 1, "q": "汽轮机高压调节阀门的调节方式若采用\"喷嘴调节\"，其特点是", "a": ["仅一个调节阀门工作，其他阀门全关", "调节阀门全开，通过改变汽轮机转速调节负荷", "所有调节阀门同时开关，调节精度高", "调节阀门按顺序开关，机组变负荷时效率高", "", ""], "r": "D", "e": "喷嘴调节是调节阀门按顺序开关，部分进汽，在机组变负荷时效率较高。A选项仅一个阀门工作不符合；B选项通过改变转速调节负荷不是喷嘴调节特点；C选项所有阀门同时开关也不对。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663437", "t": 1, "q": "锅炉燃烧系统中，当单元机组负荷降低时，合理的调节顺序是", "a": ["先降低燃料量，再降低引风量", "先降低送风量，再降低燃料量", "先降低燃料量，再降低送风量", "先降低引风量，再降低燃料量", "", ""], "r": "C", "e": "在锅炉燃烧系统中，当单元机组负荷降低时，应先减少燃料量，避免燃料过多造成不完全燃烧等问题，之后再降低送风量，以保证合适的风煤比。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663438", "t": 1, "q": "发电机冷却系统中，采用水氢氢冷却方式时，定子绕组的冷却介质是?", "a": ["油", "空气", "水", "氢气", "", ""], "r": "C", "e": "水氢氢冷却方式里，定子绕组用的冷却介质是水。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663439", "t": 1, "q": "金属材料发生应力松弛的本质是?", "a": ["材料在恒定应变下，应力随时间逐渐增大的现象", "材料在恒定应变下，应力随时间逐渐减小的现象", "材料在恒定应力下，应变随时间逐渐增大的现象", "材料在交变应力下，应变随时间逐渐减小的现象", "", ""], "r": "B", "e": "应力松弛指材料在恒定应变下，应力随时间逐渐减小。A选项说应力增大错误；C选项描述的是蠕变；D选项描述与应力松弛概念不符。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663440", "t": 1, "q": "汽轮机凝汽器的真空度下降，不会导致以下哪种后果?", "a": ["汽轮机排汽温度升高", "汽轮机发电功率降低", "凝汽器端差增大", "锅炉主蒸汽压力升高", "", ""], "r": "D", "e": "真空度下降，排汽温度会升高，发电功率会降低，凝汽器端差会增大。而锅炉主蒸汽压力主要与锅炉自身的燃烧、汽水系统等有关，和汽轮机凝汽器真空度下降无关。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663441", "t": 1, "q": "汽轮机凝汽系统中，凝汽器的真空度下降会导致汽轮机的", "a": ["排汽温度升高，发电功率增大", "排汽温度降低，发电功率减小", "排汽温度降低，发电功率增大", "排汽温度升高，发电功率减小", "", ""], "r": "D", "e": "凝汽器真空度下降，意味着排汽压力升高，根据蒸汽特性，排汽温度会升高。同时，真空度下降使蒸汽做功能力降低，发电功率减小。所以答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663442", "t": 1, "q": "在单元机组运行中，金属材料发生蠕变破坏的关键阶段是第三阶段，该阶段的核心特征是", "a": ["蠕变变形速率基本恒定", "蠕变变形速率随时间逐渐减小", "蠕变变形速率急剧增大且伴随晶界裂纹扩展", "材料内部应力持续降低且无明显变形", "", ""], "r": "C", "e": "金属材料蠕变第三阶段，蠕变变形速率急剧增大，同时晶界裂纹扩展。A是第二阶段特征，B不符合第三阶段情况，D描述错误。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663443", "t": 1, "q": "金属材料发生氢脆化的主要原因是什么?", "a": ["氢原子降低材料的弹性模量", "氢原子提高材料的屈服强度", "氢原子在材料内部形成气泡，导致材料开裂", "氢原子加速材料的蠕变过程", "", ""], "r": "C", "e": "氢脆化是氢原子在材料内部聚集形成气泡，内部压力增大最终导致材料开裂。弹性模量、屈服强度、蠕变过程并非氢脆化主要原因。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663444", "t": 1, "q": "金属材料发生热松弛现象的本质是（　）", "a": ["材料因温度变化导致弹性模量降低的现象", "材料因反复加热冷却导致塑性变形累积的现象", "材料在固定应变下，随时间延长应力逐渐降低的现象", "材料在固定应力下，随时间延长应变逐渐增大的现象", "", ""], "r": "C", "e": "热松弛是指材料在固定应变下，随时间延长应力逐渐降低的现象。A选项弹性模量降低不是热松弛本质；B选项反复加热冷却塑性变形累积与热松弛无关；D选项固定应力下应变逐渐增大是蠕变现象。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663445", "t": 1, "q": "锅炉主蒸汽热力系统中，为防止主蒸汽管道发生水冲击，通常设置的关键部件是?", "a": ["减温器", "止回阀", "安全阀", "疏水阀", "", ""], "r": "D", "e": "水冲击常因蒸汽管道内积水引起，疏水阀可及时排出管道内的凝结水，防止积水导致水冲击。所以答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663446", "t": 1, "q": "单元机组热态启动时，汽轮机的冲转转速应选择在", "a": ["高于临界转速的转速", "接近临界转速的转速", "低于临界转速的较低转速", "额定转速", "", ""], "r": "C", "e": "单元机组热态启动时，汽轮机的冲转转速选择是一个关键参数。为了确保汽轮机的安全和稳定运行，冲转转速通常不会选择过高或过低。A选项“高于临界转速的转速”可能会导致汽轮机在临界转速附近产生共振，这是不安全的。B选项“接近临界转速的转速”同样存在共振的风险。D选项“额定转速”对于热态启动来说可能过高，因为汽轮机在热态下各部件的温度和应力状态与冷态不同，直接以额定转速冲转可能会对设备造成损害。C选项“低于临界转速的较低转速”是一个更为稳妥的选择。在热态启动时，从较低的转速开始冲转可以确保汽轮机平稳地通过临界转速区域，避免共振和其他潜在风险。随着汽轮机温度和压力的逐渐升高，可以再逐步提升转速至额定值。因此，正确答案是C：“低于临界转速的较低转速”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663447", "t": 1, "q": "下列关于单元机组一次调频的描述，正确的是", "a": ["一次调频由调度中心统一发出调节指令", "一次调频的响应时间通常在几分钟到十几分钟", "一次调频仅通过改变锅炉燃烧率实现", "一次调频的调节范围由机组的额定功率和调频死区决定", "", ""], "r": "D", "e": "一次调频是机组根据电网频率变化自动调节，非调度中心统一发指令，A错；响应时间是几秒到几十秒，B错；通过改变汽轮机调门开度等实现，非仅改变锅炉燃烧率，C错；调节范围由机组额定功率和调频死区决定，D对。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663448", "t": 1, "q": "锅炉过热器系统中，为防止过热器超温，通常采用的调节方式是", "a": ["改变汽轮机进汽量", "改变锅炉引风量", "喷水减温", "改变锅炉给水温度", "", ""], "r": "C", "e": "喷水减温是防止过热器超温常用且有效的调节方式。改变汽轮机进汽量主要影响发电功率等；改变锅炉引风量主要影响燃烧工况；改变锅炉给水温度对过热器超温调节作用不直接。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663449", "t": 1, "q": "单元机组停机过程中，汽轮机打闸停机后，需要维持凝汽器真空逐渐降低，而不是立即破坏真空，其主要原因是（　）", "a": ["减少汽轮机叶片的鼓风摩擦损失，避免转子过热", "防止汽轮机转子超速", "便于锅炉泄压", "防止凝汽器铜管损坏", "", ""], "r": "A", "e": "停机打闸后维持凝汽器真空逐渐降低可使汽缸内蒸汽在通流部分继续做功，减少叶片鼓风摩擦损失，避免转子过热。答案选A。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663450", "t": 1, "q": "金属材料受热应力作用时，若材料各部分温度均匀变化，则产生的热应力为", "a": ["零", "很大的压应力", "交变应力", "很大的拉应力", "", ""], "r": "A", "e": "热应力是因物体内温度不均匀产生的应力。当材料各部分温度均匀变化，不会有温度差导致的膨胀或收缩不一致情况，热应力为零。答案选A。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663451", "t": 1, "q": "金属材料热脆化的主要原因包括以下哪些?（　）", "a": ["材料受到交变应力作用", "材料晶界存在低熔点杂质（如硫）", "材料的晶粒粗大", "材料发生氢扩散", "", ""], "r": "B", "e": "热脆化是指金属在高温时发生脆化现象，主要是晶界存在低熔点杂质（如硫），在高温下这些杂质熔化，削弱晶界结合力导致热脆。A项交变应力作用主要引发疲劳破坏；C项晶粒粗大影响材料综合性能但不是热脆主因；D项氢扩散会导致氢脆而非热脆。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663452", "t": 1, "q": "下列因素中，对金属材料疲劳极限影响最显著的是（　）", "a": ["材料的弹性模量", "材料的屈服强度", "加载速度", "应力循环特性（应力比）", "", ""], "r": "D", "e": "应力循环特性（应力比）反映了交变应力的变化情况，对金属疲劳裂纹的萌生和扩展影响大，是影响金属材料疲劳极限最显著因素。而弹性模量是材料刚度指标，屈服强度主要体现材料开始塑性变形的能力，加载速度对疲劳极限影响小。答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663453", "t": 1, "q": "二次调频的实现方式中，属于\"以变负荷机组为主，基荷机组为辅\"的协调调节方式是（　）", "a": ["主导机组调频", "分区调频", "积差调频", "跟踪调频", "", ""], "r": "A", "e": "A. 主导机组调频：指指定少数调节性能优良的机组（通常为变负荷机组）承担主要调频任务，其他机组（多为基荷机组）保持基本负荷或少量参与。这直接对应“以变负荷机组为主，基荷机组为辅”的协调模式。<br />B. 分区调频：按地理或电气区域划分调频责任，各区域内部协调，不直接体现机组类型的责任分配。<br />C. 积差调频：基于频率积分偏差进行调节，是一种控制算法，不规定机组间的责任分工。<br />D. 跟踪调频：通常指机组跟踪调度指令或ACE（区域控制偏差），是一种执行方式，不特指责任分配原则。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663454", "t": 1, "q": "汽轮机的调节级在机组启动和正常运行时，其工作特点是?", "a": ["启动时负荷小，正常运行时负荷大", "启动和正常运行时负荷均较小", "启动时负荷大，正常运行时负荷小", "启动和正常运行时负荷均较大", "", ""], "r": "A", "e": "汽轮机调节级在启动时要适应低负荷工况，负荷小；正常运行时主要承担较大的发电任务，负荷大。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663455", "t": 1, "q": "发电机定子冷却水系统的主要作用是", "a": ["冷却发电机转子绕组", "冷却汽轮机轴承", "冷却发电机定子铁芯和定子绕组", "冷却发电机励磁机", "", ""], "r": "C", "e": "发电机定子在运行中会产生热量，定子冷却水系统就是为了冷却发电机定子铁芯和定子绕组。A选项是冷却转子绕组不是其作用；B选项冷却汽轮机轴承与该系统无关；D选项冷却发电机励磁机也不是定子冷却水系统的功能。答案选C。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663456", "t": 1, "q": "单元机组正常运行时，若锅炉蒸发量增加，为维持汽包水位稳定，应采取的措施是?", "a": ["减少给水量", "减少燃料量", "增加蒸汽排放量", "增加给水量", "", ""], "r": "D", "e": "锅炉蒸发量增加，意味着汽包内的水转化成蒸汽的量增多，水位会下降。为维持汽包水位稳定，需要增加给水量来补充蒸发掉的水。所以答案选D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663457", "t": 1, "q": "下列哪种金属脆化类型主要与金属在低温环境下晶体结构转变（如体心立方金属低温下韧性下降）相关?", "a": ["应力腐蚀脆化", "热脆", "氢脆", "冷脆", "", ""], "r": "D", "e": "冷脆是指体心立方等金属在低温下因晶体结构转变，韧性下降而变脆。应力腐蚀脆化是应力和特定腐蚀介质共同作用；热脆与热加工过程有关；氢脆是氢原子在金属中引起的脆化。所以选D。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663458", "t": 1, "q": "汽轮机高压转子在冷态启动过程中，热应力最大的部位通常是", "a": ["转子轴颈处", "转子中心孔内壁", "转子叶片根部", "转子叶轮根部", "", ""], "r": "B", "e": "冷态启动时，蒸汽温度高于转子温度，转子表面受热膨胀快，中心孔处受热慢膨胀滞后，会产生较大热应力，所以热应力最大部位通常是转子中心孔内壁。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663459", "t": 1, "q": "单元机组正常运行时，若锅炉主蒸汽压力升高超出允许范围，首先应采取的调节措施是", "a": ["降低锅炉给水量", "降低锅炉燃料量", "开大汽轮机高压调节阀门", "开大锅炉安全阀", "", ""], "r": "B", "e": "主蒸汽压力升高，需减少蒸汽产生量或增加蒸汽消耗量。降低锅炉燃料量可减少蒸汽产生，能有效降低主蒸汽压力。降低给水量不能直接有效降低压力；开大汽轮机高压调节阀门虽能增加蒸汽消耗，但操作相对复杂且可能影响其他参数；开大锅炉安全阀是超压后的最后保护手段，不是首先采取的措施。所以答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663460", "t": 1, "q": "下列现象中，不属于金属材料高温蠕变导致的后果是", "a": ["金属材料在交变应力下发生疲劳裂纹", "汽轮机叶片因蠕变伸长导致与汽缸碰磨", "锅炉主蒸汽管道因蠕变产生塑性变形", "高压加热器管板因蠕变导致密封失效", "", ""], "r": "A", "e": "高温蠕变是金属在长时间恒定温度和恒定应力作用下产生的缓慢塑性变形，B、C、D选项都符合这一特征；而A选项是交变应力下的疲劳裂纹，并非高温蠕变导致。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800284722663461", "t": 1, "q": "单元机组滑参数停机过程中，降低主蒸汽温度的速度应控制在一定范围，主要是为了防止?", "a": ["凝汽器真空下降过快", "金属部件产生过大热应力", "汽轮机超速", "锅炉超压", "", ""], "r": "B", "e": "主蒸汽温度降速过快，会使金属部件冷却不均匀，产生过大热应力，可能导致部件损坏。所以降低主蒸汽温度速度控制在一定范围主要是为防止金属部件产生过大热应力。答案选B。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527424", "t": 2, "q": "单元机组正常运行时，发电机的主要保护措施包括以下哪些?（　）", "a": ["横差动保护", "纵差动保护", "过负荷保护", "过电压保护", "", ""], "r": "ABCD", "e": "A横差动保护：用于发电机定子绕组**匝间短路**故障保护。<br />B纵差动保护：发电机定子绕组相间短路的主保护。<br />C过负荷保护：反应定子、转子绕组过负荷发热，防止过热损伤。<br />D过电压保护：防止机端过电压击穿绝缘。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527425", "t": 2, "q": "单元机组停机过程中，需要控制的关键参数有", "a": ["主蒸汽温度降温速率", "主蒸汽压力降压速率", "锅炉汽包水位", "凝汽器真空度", "", ""], "r": "ABCD", "e": "单元机组停机过程中，主蒸汽温度降温速率过快会使金属部件产生过大热应力；主蒸汽压力降压速率不当会影响机组稳定；锅炉汽包水位异常会引发安全问题；凝汽器真空度变化影响机组效率和安全性，这些都是需控制的关键参数。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527426", "t": 2, "q": "汽轮机正常运行时，影响其排汽温度的因素有", "a": ["汽轮机轴封供汽压力", "汽轮机进汽参数（温度、压力）", "凝汽器真空度", "汽轮机负荷", "", ""], "r": "BCD", "e": "答案：BCD汽轮机排汽温度主要受进汽参数（影响蒸汽在汽轮机内的做功能力和热效率）、凝汽器真空度（影响排汽的冷凝效果）以及汽轮机负荷（影响蒸汽流量和做功情况）的影响。而汽轮机轴封供汽压力主要影响轴封的密封效果，对排汽温度的影响相对较小，因此选项A不是主要影响因素，正确答案为BCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527427", "t": 2, "q": "锅炉燃烧系统中，影响燃烧稳定性的因素有", "a": ["燃料的种类和品质", "送风量和引风量的匹配", "燃料与空气的混合比例", "炉膛温度", "", ""], "r": "ABCD", "e": "燃料种类和品质直接影响燃烧难易与稳定性；送引风匹配不好会导致燃烧环境不稳定；燃料与空气混合比例不当会使燃烧不充分或不稳定；炉膛温度低不利于燃烧稳定。答案选ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527428", "t": 2, "q": "金属材料发生蠕变破坏的特征包括以下哪些?（　）", "a": ["破坏前有明显的塑性变形", "破坏只发生在高温环境", "破坏过程与时间密切相关", "断口呈脆性特征", "", ""], "r": "ACD", "e": "A. 破坏前有明显的塑性变形<br />蠕变断裂前通常有大量塑性变形，断口附近常出现许多微小裂纹（蠕变空洞），宏观上呈现龟裂现象。在应力作用下，蠕变变形累积到一定程度才会发生断裂，且断裂应变通常较大。<br />B. 破坏只发生在高温环境 （表述不准确）<br />蠕变可以发生在任何温度，只是低温时效应不明显，可以不予考虑；当约比温度大于0.3时（如碳钢超过300℃、合金钢超过400℃），蠕变效应才比较显著。因此，蠕变破坏并非\"只\"发生在高温环境，而是在高温下才显著，该表述过于绝对。<br />C. 破坏过程与时间密切相关 <br />蠕变是材料在长时间恒温、恒应力作用下（即使应力小于屈服强度）缓慢产生塑性变形的现象，随时间推移经历减速、稳态和加速三个阶段，最终断裂。时间是其核心影响因素。<br />D. 断口呈脆性特征 <br />蠕变断裂的宏观断口通常较为平坦，缺乏剧烈的起伏；微观上典型特征为冰糖状花样的沿晶断裂，断口表面常被氧化膜覆盖，这些都属于脆性断裂特征。<br />结论：正确答案为 A、C、D。B项将蠕变局限于\"只发生在高温环境\"表述不准确，因此不选。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527429", "t": 2, "q": "单元机组热态启动与冷态启动的主要区别在于", "a": ["发电机并网时间不同（热态更早）", "汽轮机冲转参数不同（热态更高）", "是否需要进行汽轮机暖机（冷态需，热态无需或简化）", "锅炉升压升温速率不同（热态更快）", "", ""], "r": "ABCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527430", "t": 2, "q": "单元机组正常运行时，汽轮机润滑油系统的主要作用包括以下哪些?（　）", "a": ["为汽轮机调节系统提供动力油", "冷却汽轮机轴承", "防止汽轮机转子生锈", "润滑汽轮机各轴承", "", ""], "r": "BD", "e": "汽轮机润滑油系统主要作用是润滑轴承、冷却轴承。调节系统动力油一般由抗燃油系统提供，防锈不是其主要作用。答案选BD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527431", "t": 2, "q": "单元机组冷态启动过程中，需要严格控制的参数包括（　）", "a": ["机组升速率和暖机时间", "凝汽器真空度", "锅炉汽包升温升压速度", "发电机定子绕组温度", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527432", "t": 2, "q": "锅炉再热蒸汽系统的主要作用有", "a": ["保护汽轮机低压缸叶片", "提高汽轮机高压缸的进汽温度", "提高机组的热效率", "降低汽轮机低压缸排汽湿度", "", ""], "r": "ACD", "e": "再热蒸汽系统将高压缸排汽再次加热，可提高机组热效率，同时降低汽轮机低压缸排汽湿度，保护低压缸叶片。它是提高中压缸进汽温度而非高压缸。答案选ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527433", "t": 2, "q": "锅炉过热器的安全运行措施主要有哪些?（　）", "a": ["设置减温器调节蒸汽温度", "设置过热器出口安全阀", "采用合理的过热器布置方式（如顺流、逆流）", "定期吹灰，防止受热面积灰", "", ""], "r": "ABCD", "e": "设置减温器可调节蒸汽温度避免超温损坏过热器；设出口安全阀能在超压时泄放保证安全；合理布置方式利于传热和运行安全；定期吹灰可防止积灰影响传热和过热器寿命。ABCD选项均是保障锅炉过热器安全运行的措施。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527434", "t": 2, "q": "影响金属材料疲劳寿命的因素有哪些?（　）", "a": ["应力循环特性", "最大应力值", "材料的组织结构", "环境温度和介质", "", ""], "r": "ABCD", "e": "应力循环特性、最大应力值、材料组织结构、环境温度和介质都会对金属材料疲劳寿命产生影响。答案选ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527435", "t": 2, "q": "下列关于金属材料蠕变的说法，错误的有", "a": ["蠕变变形是弹性变形", "蠕变过程中材料的应力会逐渐增大", "蠕变速率与时间无关", "蠕变变形不可恢复", "", ""], "r": "ABC", "e": "蠕变是在长时间恒定应力作用下，材料发生缓慢塑性变形的现象，变形不可恢复，不是弹性变形；蠕变中应力不变，应变随时间增加；蠕变速率与时间有关。所以A、B、C说法错误。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527436", "t": 2, "q": "电网频率波动时，单元机组参与调频的主要调节手段有", "a": ["改变发电机励磁电流", "改变锅炉燃料量", "改变汽轮机低压调节阀门开度", "改变锅炉给水量", "", ""], "r": "BC", "e": "电网频率波动时，单元机组参与调频的主要调节手段涉及快速响应和调整发电功率。以下是对各选项的简要A. 改变发电机励磁电流：这主要是影响发电机的无功功率输出，对有功功率的调整作用有限，不是主要的调频手段。B. 改变锅炉燃料量：锅炉燃料量的调整直接影响蒸汽的产生量，从而决定汽轮机的进汽量和机组的发电功率。这是单元机组调频的主要手段之一，但响应速度相对较慢。C. 改变汽轮机低压调节阀门开度：通过调整汽轮机的进汽量，可以直接且迅速地改变机组的发电功率，是单元机组调频的主要快速手段。D. 改变锅炉给水量：虽然这会影响锅炉的蒸汽产量，但相比于直接调整燃料量或汽轮机阀门开度，其对发电功率的调整效果和响应速度都较慢。综上所述，主要的调频手段是改变锅炉燃料量和汽轮机低压调节阀门开度。所以，正确答案是BC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527437", "t": 2, "q": "汽轮机主要热力系统中，属于回热加热系统组成部分的设备有（　）", "a": ["疏水泵", "凝汽器", "低压加热器", "高压加热器", "", ""], "r": "ACD", "e": "回热加热系统是汽轮机热力系统的核心组成部分，其作用是利用汽轮机中间级抽汽来加热给水（或凝结水），以提高循环热效率。其典型设备包括：<br />A. 疏水泵（正确）：疏水泵用于将各级加热器（高加、低加）中的疏水（凝结水）输送至下一级加热器或除氧器，是回热系统维持正常疏水水位和热力循环的重要设备。<br />B. 凝汽器（错误）：凝汽器属于冷端系统（或称主凝结系统）的核心设备，其作用是将汽轮机排汽凝结成水，不属于回热加热系统（回热系统是指用抽汽加热给水/凝结水的部分）。<br />C. 低压加热器（正确）：低压加热器利用汽轮机低压段抽汽来加热凝结水，是回热系统的组成部分之一。<br />D. 高压加热器（正确）：高压加热器利用汽轮机高压段抽汽来加热锅炉给水，同样是回热系统的核心组成部分（通常位于给水泵之后、锅炉省煤器之前）。<br />因此，属于回热加热系统组成部分的设备是 A、C、D。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527438", "t": 2, "q": "金属材料应力腐蚀脆化的特征包括以下哪些?（　）", "a": ["需要同时存在拉应力和特定腐蚀介质", "破坏前无明显塑性变形", "破坏速度远快于单纯腐蚀或单纯应力作用", "破坏只发生在特定温度区间", "", ""], "r": "ABC", "e": "A应力腐蚀开裂 (SCC) 发生条件：拉应力 + 特定腐蚀介质 + 金属材料 三者同时具备。<br />B属于脆性断裂，断裂前几乎没有明显塑性变形。<br />C协同效应，应力与腐蚀共同作用，破坏速率远大于单纯应力断裂或者单纯腐蚀。<br />D应力腐蚀没有严格限定只在某特定温度区间发生，不同体系在不同温度均可出现，不是特征。<br />总结：应力腐蚀脆化三要素：拉应力、特定介质、敏感材料；脆性断裂，协同加速破坏。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527439", "t": 2, "q": "金属材料疲劳破坏的主要过程包括", "a": ["材料的弹性变形", "疲劳裂纹的萌生", "疲劳裂纹的扩展", "材料的塑性变形", "", ""], "r": "BC", "e": "金属材料疲劳破坏主要历经疲劳裂纹萌生、扩展这两个关键阶段。弹性和塑性变形并非疲劳破坏主要过程特征。答案选BC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527440", "t": 2, "q": "以下哪些属于汽轮机的主要热力系统?（　）", "a": ["抽汽回热系统", "主蒸汽系统", "循环水系统", "凝结水系统", "", ""], "r": "ABD", "e": "汽轮机主要热力系统包含主蒸汽系统输送蒸汽、抽汽回热系统提高效率、凝结水系统回收凝结水等。循环水系统主要是冷却作用，不属于主要热力系统。答案选ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527441", "t": 2, "q": "单元机组冷态启动过程中，需要进行的主要操作有", "a": ["汽轮机真空系统建立", "汻轮机冲转和升速", "锅炉再热器系统充压", "发电机并网和带负荷", "", ""], "r": "ABCD", "e": "冷态启动单元机组，首先要建立汽轮机真空系统，为后续冲转等操作创造条件；接着汽轮机冲转和升速；之后锅炉再热器系统充压；最后发电机并网并带负荷。ABCD 选项都是冷态启动过程中的主要操作。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527442", "t": 2, "q": "单元机组启动时，锅炉点火前的准备工作包括以下哪些?（　）", "a": ["锅炉上水至正常水位", "制粉系统投运", "空气预热器投运", "汽轮机冲转前的暖管", "", ""], "r": "AC", "e": "锅炉点火前要上水至正常水位，空气预热器也需先投运。制粉系统在点火后才投运，汽轮机冲转前暖管是后续步骤。答案是AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527443", "t": 2, "q": "单元机组正常运行时，锅炉汽包水位异常的主要原因有", "a": ["给水量波动", "锅炉燃烧率波动", "蒸发量波动", "汽包压力波动", "", ""], "r": "ABCD", "e": "给水量、燃烧率、蒸发量、汽包压力波动都会影响汽包内水的状态和进出平衡，从而导致水位异常。答案选ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527444", "t": 2, "q": "金属材料发生脆化的类型主要有哪些?（　）", "a": ["氢脆化", "疲劳脆化", "应力腐蚀脆化", "低温脆化", "", ""], "r": "ACD", "e": "金属材料脆化类型包含氢脆化，是因氢进入金属导致脆化；应力腐蚀脆化是拉应力和特定腐蚀介质共同作用；低温脆化是低温下金属韧性降低变脆。疲劳主要产生裂纹和失效，并非典型脆化类型。答案选ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527445", "t": 2, "q": "锅炉制粉系统中，为防止煤粉爆炸，采取的安全措施包括以下哪些?（　）", "a": ["控制制粉系统的通风量", "控制煤粉的细度", "设置防爆门", "定期清理系统内的积粉", "", ""], "r": "ABCD", "e": "防止锅炉制粉系统煤粉爆炸的安全措施主要包括以下几个方面：<br />A. 控制制粉系统的通风量 <br />通风量是影响制粉系统安全运行的关键因素。合理控制通风量可以有效降低爆炸三要素中点火能量的形成，合适充足的风量可以降低点火能量的聚集，而通风不良则会增大爆炸危险程度。 磨煤机启动前，应先进行充分通风（时间不少于10分钟）；正常运行中需根据风煤比曲线控制风量；停止制粉系统时，应维持冷风抽粉，将磨内煤粉抽净。<br />B. 控制煤粉的细度 <br />煤粉细度越细，越容易发生爆炸。即使是易于爆炸的煤种，当煤粉粒径较大（如烟煤当量直径大于100μm）时，通常不易发生爆炸。 因此，需要保持煤粉细度和水分在规定范围内，对于挥发分高的煤种，不能磨得过细。<br />C. 设置防爆门 <br />制粉系统应有足够的防爆门，且位置要合理。 防爆门是制粉系统重要的泄压装置，当发生爆炸时，防爆门可以迅速开启释放爆炸产生的压力，保护设备和人身安全。需及时消除防爆门漏风，保持各小筛子完整，防止在发生爆炸时大块燃烧的煤粉落入粉仓。 防爆门的设计应确保其动作后，喷出的火焰和高温气体排向安全区域。<br />D. 定期清理系统内的积粉 <br />制粉系统内积煤与积粉是导致自燃和爆炸的主要原因之一。 必须经常检查和及时处理设备缺陷，消除系统内的积煤与积粉。 具体措施包括：停止制粉系统时进行充分抽粉，将磨内煤粉抽净；定期降粉；停炉后封闭粉仓；定期清理木屑分离器内木屑及积粉；定期切换排粉机及相应的给粉机，防止输粉机内积粉自燃等。<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527446", "t": 2, "q": "二次调频中，电网调度中心协调机组进行负荷调整的依据包括（　）", "a": ["电网各区域的负荷分布情况", "锅炉的蒸汽压力水平", "机组的发电成本", "电网频率偏差累积值", "", ""], "r": "AD", "e": "答案：AD二次调频是电力系统中为了维持电网频率稳定而进行的负荷调整过程。电网调度中心在进行二次调频时，主要依据的是电网各区域的负荷分布情况和电网频率偏差累积值。负荷分布情况可以帮助调度中心了解当前电网的负荷状况，从而进行合理的负荷调整。电网频率偏差累积值则直接反映了电网频率的稳定情况，是调度中心进行负荷调整的重要依据。而锅炉的蒸汽压力水平和机组的发电成本虽然也是电网运行中的重要考虑因素，但它们不是二次调频中调度中心协调机组进行负荷调整的主要依据。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527447", "t": 2, "q": "单元机组滑参数停机的优点包括以下哪些?（　）", "a": ["缩短停机时间", "减少汽轮机金属部件的热应力", "降低汽轮机排汽温度", "便于锅炉再次启动", "", ""], "r": "ABD", "e": "滑参数停机依靠锅炉逐步降低蒸汽参数降负荷，可减小汽轮机金属热应力，缩短停机时间，余热便于再次启动；滑参数停机会使排汽温度升高，C 错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527448", "t": 2, "q": "影响锅炉热效率的因素主要有哪些?（　）", "a": ["排烟温度", "汽轮机的相对内效率", "锅炉漏风率", "过剩空气系数", "", ""], "r": "ACD", "e": "锅炉热效率受排烟热损失、化学不完全燃烧热损失等多种因素影响。排烟温度高、锅炉漏风、过剩空气系数不合适等都会使热损失增加，降低热效率。而汽轮机相对内效率是汽轮机的指标，与锅炉热效率无关。答案选ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527449", "t": 2, "q": "下列属于锅炉主要热力系统组成部分的有（　）", "a": ["燃烧系统（含磨煤机、喷燃器）", "排烟系统（含空气预热器、除尘器）", "蒸汽系统（含过热器、再热器）", "给水系统（含给水泵、省煤器）", "", ""], "r": "ABCD", "e": "A 燃烧系统负责燃料燃烧放热；B 排烟系统完成烟气换热与净化；C 蒸汽系统加热蒸汽；D 给水系统输送并预热给水，四者均属于锅炉热力系统组成。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527450", "t": 2, "q": "单元机组参与二次调频时，锅炉侧的调节手段有", "a": ["改变引风机转速（调整引风量）", "改变给煤机转速（调整燃料量）", "改变过热器喷水量", "改变送风机转速（调整送风量）", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527451", "t": 2, "q": "金属材料热应力产生的原因包括以下哪些?（　）", "a": ["材料受到外部约束，无法自由膨胀或收缩", "材料各部分温度不均匀", "材料在高温下发生蠕变", "材料受到交变应力作用", "", ""], "r": "AB", "e": "热应力是因温度变化产生的应力。材料各部分温度不均会使各部分膨胀或收缩程度不同从而产生热应力；若材料受外部约束不能自由膨胀或收缩，也会产生热应力。而高温蠕变是材料在长时间恒定载荷下的变形，交变应力与热应力产生原因无关。所以答案选AB。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527452", "t": 2, "q": "以下哪些措施可以提高单元机组的一次调频能力?（　）", "a": ["减小汽轮机调速系统的速度变动率", "提高汽轮机调速系统的响应速度", "优化汽轮机的调节汽门特性", "增大汽轮机的额定功率", "", ""], "r": "ABC", "e": "减小调速系统速度变动率能使机组更快响应频率变化；提高调速系统响应速度可及时调节；优化调节汽门特性利于精准调节，都可提高一次调频能力。而增大额定功率与一次调频能力无直接关联。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527453", "t": 2, "q": "下列因素中，会加速金属材料应力腐蚀脆化的有（　）", "a": ["降低材料的屈服强度", "提高环境温度", "增大作用于材料的拉应力", "材料表面存在氧化膜", "", ""], "r": "BC", "e": "应力腐蚀脆化是拉应力和特定腐蚀介质共同作用导致的。提高环境温度会加快反应速率，增大拉应力会增加脆化可能性，都会加速应力腐蚀脆化。降低屈服强度和材料表面氧化膜通常对加速应力腐蚀脆化无促进作用。答案选BC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527454", "t": 2, "q": "单元机组停机过程中，属于\"滑参数停机\"特点的有（　）", "a": ["汽轮机进汽参数随锅炉参数降低而降低，避免过大热应力", "停机过程中锅炉蒸汽参数（压力、温度）随负荷降低而逐渐降低", "对机组金属材料的热疲劳损伤较小", "停机时间短，适合紧急停机", "", ""], "r": "ABC", "e": "滑参数停机时锅炉蒸汽参数随负荷降而渐降，汽轮机进汽参数也随之降低，可减小热应力、对金属热疲劳损伤小。而滑参数停机时间长，不适合紧急停机。所以ABC正确，D错误。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527455", "t": 2, "q": "单元机组冷态启动时，锅炉升压过程中需要控制的参数有", "a": ["升压速率", "过热器出口温度", "汽包上下壁温差", "汽包内外壁温差", "", ""], "r": "ABC", "e": "单元机组冷态启动时，锅炉升压过程中需要关注多个关键参数以确保安全和效率。首先，升压速率（A选项）是重要的控制参数之一。过快的升压可能导致设备应力增大，甚至损坏，因此必须控制在合理范围内。其次，过热器出口温度（B选项）也需严格控制。温度过高或过低都会影响蒸汽的品质和机组的安全运行。再次，汽包上下壁温差（C选项）是反映锅炉水循环是否正常的重要指标。温差过大可能意味着水循环不畅，需要及时调整。至于汽包内外壁温差（D选项），虽然也是一个重要的参数，但在锅炉升压过程中的直接控制要求并不如前三者严格。综上所述，升压速率、过热器出口温度和汽包上下壁温差是锅炉升压过程中需要重点控制的参数。所以，正确答案是ABC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527456", "t": 2, "q": "单元机组正常运行时，影响锅炉主蒸汽温度的因素有", "a": ["汽轮机调门开度", "锅炉送风量", "锅炉燃烧率", "锅炉给水量", "", ""], "r": "BCD", "e": "锅炉送风量、燃烧率、给水量都会直接影响锅炉内的热交换和蒸汽产生过程，从而影响主蒸汽温度。汽轮机调门开度主要影响蒸汽的流量和做功，对主蒸汽温度无直接影响。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527457", "t": 2, "q": "单元机组启动过程中，汽轮机暖机的主要目的包括以下哪些?（　）", "a": ["提前建立汽轮机的真空度", "提高汽轮机的进汽参数", "检查汽轮机各动静部件的间隙", "使汽轮机转子和汽缸均匀受热", "", ""], "r": "CD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527458", "t": 2, "q": "单元机组停机过程中，汽轮机打闸停机后的主要操作包括以下哪些?（　）", "a": ["关闭主蒸汽门和再热蒸汽门", "停止空气预热器运行", "投入盘车装置", "停止凝结水泵运行", "", ""], "r": "AC", "e": "汽轮机打闸停机后，要关闭主蒸汽门和再热蒸汽门防止蒸汽倒流，需投入盘车装置防止转子弯曲。空气预热器要等锅炉完全冷却后才停，凝结水泵在停机后还需运行一段时间维持凝结水系统正常。答案选AC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800286295527459", "t": 2, "q": "汽轮机回热加热系统中，高压加热器的主要作用有", "a": ["减少锅炉燃料消耗", "提高机组热效率", "加热锅炉给水", "提高汽轮机真空度", "", ""], "r": "ABC", "e": "高压加热器是回热加热系统设备，能加热锅炉给水，使水在进入锅炉前温度升高，减少了锅炉中用于加热水的热量消耗，从而减少锅炉燃料消耗，提高机组热效率。而提高汽轮机真空度与高压加热器无关。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795200", "t": 3, "q": "单元机组正常运行时，发电机采用水氢氢冷却方式，其中转子绕组的冷却介质是氢气，定子绕组的冷却介质是水。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "在大型单元机组（特别是汽轮发电机）中，水氢氢冷却方式是应用最广泛的冷却方式之一。<br />水氢氢是指：<br />定子绕组：采用水内冷（即通过空心导线通入高纯水进行冷却）。<br />转子绕组：采用氢内冷（即通过转子槽内的通风孔通入氢气进行冷却）。<br />定子铁芯及其他部件：同样采用氢气冷却。<br />该方式利用了水冷却效率高（适用于发热量大且集中的定子绕组）和氢气散热性能好、摩擦阻力小、不助燃等优点，是目前300MW级以上汽轮发电机的主流冷却方案。因此，题目中“转子绕组用氢气，定子绕组用水”的描述完全正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795201", "t": 3, "q": "单元机组滑参数停机过程中，汽轮机的降速率应保持恒定，以确保停机过程稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "滑参数停机过程中，要根据蒸汽参数变化等情况灵活调整降速率，并非保持恒定，这样才能适应工况变化确保停机过程安全稳定。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795202", "t": 3, "q": "金属材料的应力腐蚀脆化破坏通常是突发性的，破坏前无明显征兆，且破坏时应力低于材料的屈服强度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属材料应力腐蚀脆化破坏是受拉应力和特定腐蚀介质共同作用，常突然发生，破坏前征兆不明显，发生时应力低于材料屈服强度。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795203", "t": 3, "q": "金属材料的蠕变第三阶段是蠕变破坏的关键阶段，该阶段的蠕变变形速率随时间急剧增大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属材料蠕变第三阶段中，材料内部损伤积累，导致蠕变变形速率随时间急剧增大，是蠕变破坏的关键阶段。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795204", "t": 3, "q": "单元机组冷态启动时，汽轮机的暖机过程只需要对高压缸进行暖机，中压缸和低压缸无需暖机。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单元机组冷态启动时，汽轮机的高压缸、中压缸和低压缸都需要暖机，以减小热应力、避免部件损坏等。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795205", "t": 3, "q": "单元机组紧急停机时，为快速降低机组负荷，应立即关闭锅炉主汽门，切断汽轮机进汽。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单元机组紧急停机时，立即关闭锅炉主汽门切断汽轮机进汽，会使高温高压蒸汽在锅炉内积聚，可能引发超压等危险，且会对设备造成较大冲击，正确做法一般是先打闸停机使汽轮机快速降速，再处理锅炉相关操作。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795206", "t": 3, "q": "锅炉尾部烟道的省煤器主要作用是利用烟气余热加热锅炉给水，提高给水温度，从而降低锅炉的排烟温度，提高锅炉热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "省煤器就是利用锅炉尾部烟道中烟气的余热来加热锅炉给水，使给水温度升高，减少了排烟带走的热量，进而降低排烟温度，提高锅炉热效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795207", "t": 3, "q": "单元机组二次调频由各机组自主控制，无需电网调度中心干预，调节范围由机组自身决定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "二次调频需电网调度中心下达指令，并非各机组自主控制。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795208", "t": 3, "q": "单元机组停机时，若采用额定参数停机，锅炉应先降低负荷，待负荷降至零后再停止燃烧，汽轮机随后停机。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "额定参数停机：停机过程主蒸汽压力、温度基本保持额定值，逐步降负荷。但不能等到负荷到零再停燃烧；负荷降到一定数值，就要逐步减少锅炉燃料，配合汽轮机降负荷，负荷到零后打闸停机。<br />题干描述 “负荷降至零后再停止燃烧” 是错误的，若负荷到零才停燃烧，锅炉仍输出额定参数蒸汽，会造成参数超温超压。<br />对比记忆：<br />额定参数停机：汽机侧先降负荷，锅炉同步减燃料，蒸汽参数维持额定；用于短时间停机，尽快可以热态重启。<br />滑参数停机：锅炉逐步降汽温汽压，随负荷一同下降，利于机组冷却。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795209", "t": 3, "q": "汽轮机的胀差是指汽轮机转子的膨胀量与汽缸的膨胀量之间的差值，正值胀差表示转子膨胀大于汽缸膨胀。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "胀差定义就是转子膨胀量与汽缸膨胀量差值，且规定正值胀差代表转子膨胀大于汽缸膨胀。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795210", "t": 3, "q": "单元机组正常运行时，锅炉汽包水位的控制主要通过调节汽轮机高压调节阀门的开度实现。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单元机组正常运行时，锅炉汽包水位控制是通过调节给水量实现，而调节汽轮机高压调节阀门开度主要是控制机组负荷和蒸汽流量等，并非控制汽包水位。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795211", "t": 3, "q": "锅炉省煤器的布置位置在空气预热器之后，利用烟气的低温余热加热给水。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "省煤器布置在空气预热器之前，利用烟气余热加热给水。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795212", "t": 3, "q": "单元机组停机过程中，当机组负荷降至零后，应先关闭汽轮机主蒸汽阀门，再将发电机与电网解列。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单元机组停机时，应先将发电机与电网解列，再关闭汽轮机主蒸汽阀门，顺序不能颠倒，原说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795213", "t": 3, "q": "锅炉燃烧系统中，当机组负荷降低时，应先降低送风量，再降低燃料量，以保证燃料充分燃烧。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "机组负荷降低时，应先减燃料量，再减送风量，这样才能保证燃烧稳定和避免燃料在炉膛内积聚等问题，题干说法顺序错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795214", "t": 3, "q": "锅炉再热蒸汽系统的作用是将汽轮机高压缸排汽加热至较高温度，以提高机组的热效率并降低低压缸排汽湿度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "锅炉再热蒸汽系统确实是把汽轮机高压缸排汽重新加热到较高温度，这样能提升机组热效率，同时降低低压缸排汽湿度，减少对叶片的侵蚀。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795215", "t": 3, "q": "锅炉省煤器的主要作用是利用锅炉尾部烟气的热量加热锅炉给水，以降低排烟温度，提高锅炉热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "省煤器就是安装在锅炉尾部烟道用于回收烟气热量来加热给水的装置，能降低排烟温度，进而提高锅炉热效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795216", "t": 3, "q": "汽轮机凝汽器的真空度越高，汽轮机的排汽温度越低，机组的发电功率越大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "凝汽器真空度越高，排汽压力越低，排汽温度也越低。在一定范围内，真空度提高，蒸汽在汽轮机内的焓降增大，可使机组发电功率增大，但真空度提高到一定程度后，再提高真空度对发电功率的提升效果不明显甚至可能因抽气能耗增加而使发电功率降低。所以题干说真空度越高发电功率越大不准确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795217", "t": 3, "q": "单元机组一次调频的调节精度较高，能够将电网频率精确调整至额定值，因此无需二次调频。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一次调频是有差调节，调节精度有限，不能将电网频率精确调至额定值，还需二次调频来进一步精确调整频率。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795218", "t": 3, "q": "单元机组一次调频的死区越小，机组对电网频率波动的响应越灵敏，调频效果越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一次调频死区越小，机组对很小的频率偏差就会动作，响应确实灵敏。但死区过小，电网微小频率扰动就会造成机组频繁调节，增加设备磨损、调门频繁摆动，反而不利于机组稳定运行，并非死区越小调频效果就越好。电网会设置合理死区，过滤小幅噪声扰动。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795219", "t": 3, "q": "锅炉启动过程中，点火前应先启动送风机、引风机，建立炉膛负压，再进行炉膛吹扫。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "锅炉启动时先启动送、引风机建立炉膛负压，接着进行炉膛吹扫可清除炉膛内可能积聚的可燃气体，防止点火时发生爆炸等危险，该操作顺序正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795220", "t": 3, "q": "汽轮机凝汽器的真空度下降会导致汽轮机的排汽温度降低，从而提高汽轮机的相对内效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "凝汽器真空度下降，排汽压力升高，排汽温度会升高，且真空度下降会使蒸汽在汽轮机内做功减少，降低汽轮机相对内效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795221", "t": 3, "q": "锅炉过热器的温度调节主要采用改变锅炉给水量的方式，通过增加给水量降低过热器出口温度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "锅炉过热器温度调节主要通过喷水减温等方式，而非改变给水量。改变给水量主要是调节锅炉水位等，对过热器出口温度调节并非主要手段。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795222", "t": 3, "q": "金属材料的表面粗糙度越大，其疲劳寿命越长，因为粗糙表面可分散交变应力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属材料表面粗糙度越大，会形成更多应力集中点，在交变应力作用下更易产生裂纹，使疲劳寿命降低，并非分散交变应力让寿命变长。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795223", "t": 3, "q": "金属材料的蠕变变形是在恒定温度和恒定应力下发生的缓慢塑性变形，该变形过程不可恢复。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属材料的蠕变是在恒定温度和恒定应力下发生的缓慢塑性变形，塑性变形是不可恢复的。所以该表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795224", "t": 3, "q": "单元机组正常运行时，发电机输出电压主要由汽轮机的转速决定，转速越高，输出电压越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。发电机输出电压主要由励磁系统控制，通过调节励磁电流来改变磁场强度从而控制输出电压。而汽轮机转速主要影响的是发电机输出的频率。答案为“错误”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795225", "t": 3, "q": "金属材料的蠕变极限是指在规定温度下，材料在1000小时内产生的最大应变值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属材料的蠕变极限是指在规定温度和规定时间内，使试样产生一定蠕变变形量的应力，并非是 1000 小时内产生的最大应变值。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795226", "t": 3, "q": "金属材料的冷脆和热脆均属于金属脆化现象，但冷脆发生在低温，热脆发生在中高温。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冷脆是金属在低温时韧性显著降低、变脆的现象；热脆是金属在中高温加工时因杂质等因素导致塑性降低、变脆的现象，二者都属于金属脆化。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795227", "t": 3, "q": "金属材料的应力腐蚀脆化不需要特定的腐蚀介质，只要存在拉应力，材料就会发生应力腐蚀脆化。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属材料发生应力腐蚀脆化需要特定腐蚀介质和拉应力共同作用，并非只要有拉应力就会发生。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795228", "t": 3, "q": "汽轮机滑参数停机过程中，锅炉应先降低蒸汽温度，再降低蒸汽压力，以保证汽轮机进汽温度不低于压力对应的饱和温度。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "滑参数停机时先降汽温再降汽压，能使蒸汽有一定过热度，防止蒸汽带水，保证汽轮机进汽温度高于压力对应的饱和温度。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795229", "t": 3, "q": "金属材料的疲劳破坏与应力循环特性无关，只要最大应力值相同，疲劳寿命就相同。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属材料的疲劳破坏与应力循环特性有关，即使最大应力值相同，不同应力循环特性下疲劳寿命也会不同。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795230", "t": 3, "q": "锅炉主蒸汽系统中，脉冲式安全阀的动作压力高于弹簧式安全阀，且动作后需手动复位。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "脉冲式安全阀动作压力低于弹簧式安全阀，且脉冲式安全阀动作后不是手动复位。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795231", "t": 3, "q": "金属材料的热脆化通常发生在400℃至600℃温度区间，主要是由于材料晶界存在低熔点杂质，在该温度区间熔化导致晶界强度下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795232", "t": 3, "q": "单元机组正常运行时，锅炉汽包水位采用三冲量调节方式，其调节信号包括汽包水位、蒸汽流量和给水流量。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "三冲量水位调节系统是单元机组汽包水位常用调节方式，三冲量即汽包水位、蒸汽流量和给水流量。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795233", "t": 3, "q": "一次调频会改变单元机组的负荷基准，而二次调频不会改变机组的负荷基准。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一次调频是机组根据电网频率变化自动调整负荷，不改变负荷基准；二次调频是通过调度指令等改变机组负荷设定值，会改变负荷基准，所以题干说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795234", "t": 3, "q": "金属材料的热应力产生的根本原因是材料各部分存在温度差，且材料具有热胀冷缩的特性。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "当材料各部分有温度差，热胀冷缩特性会使各部分膨胀或收缩程度不同，从而产生热应力。所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795235", "t": 3, "q": "单元机组正常运行时，锅炉汽包水位的调节主要通过改变给水泵的转速来调整给水流量实现。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795236", "t": 3, "q": "单元机组冷态启动时，汽轮机的升速率应随转速升高而逐渐降低，以避免高速时转子离心力过大导致损伤。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "冷态启动时，在低转速阶段，为尽快越过转子临界转速，升速率较高；越过临界转速后，升速率降低，避免高速时离心力过大损伤转子，所以该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795237", "t": 3, "q": "锅炉过热器的传热方式以对流换热为主，辐射换热占比很小，因此过热器的布置不受炉膛辐射影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然锅炉过热器传热以对流换热为主、辐射换热占比小，但炉膛辐射对过热器布置仍有影响，比如布置位置等需考虑炉膛辐射情况。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795238", "t": 3, "q": "单元机组参与一次调频时，仅通过改变汽轮机高压调节阀门的开度调整蒸汽流量，从而改变机组负荷。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单元机组参与一次调频时，除了改变汽轮机高压调节阀门开度调整蒸汽流量来改变机组负荷外，还可通过锅炉调整燃烧等方式配合，并非仅依靠改变高压调节阀门开度。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795239", "t": 3, "q": "汽轮机回热加热系统中，高压加热器的疏水若采用\"疏水泵\"方式，可减少疏水热量损失，提高机组热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "采用“疏水泵”方式将高压加热器疏水打入主凝结水系统，能避免疏水逐级自流至低压加热器造成的热量损失，使这部分热量得到更有效利用，从而提高机组热效率。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795240", "t": 3, "q": "金属疲劳破坏前，材料会发生明显的塑性变形，因此容易通过外观观察提前发现疲劳损伤。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属疲劳破坏前一般不会发生明显的塑性变形，很难通过外观观察提前发现疲劳损伤。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795241", "t": 3, "q": "单元机组热态启动时，锅炉的升压升温速率应比冷态启动时慢，以减小机组的热应力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "冷态启动：金属部件温度低，为控制热应力，升温升压速率慢。热态启动：汽轮机、锅炉金属本体已有较高温度，温差小，允许较快的升温升压速率，比冷态启动更快。<br />", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795242", "t": 3, "q": "一次调频是由汽轮机调速系统自动完成的，其调节范围主要取决于汽轮机的速度变动率，速度变动率越小，一次调频范围越大。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这句话的表述符合电力系统一次调频的基本原理，具体分析如下：<br />一次调频的自动完成机制：一次调频是指电网频率一旦偏离额定值时，电网中机组的控制系统（即汽轮机调速系统）自动地控制机组有功功率的增减，限制电网频率变化的过程。该过程由原动机调速系统自动完成，无需人工干预。<br />速度变动率与调频范围的关系：速度变动率（又称转速不等率，通常用δ表示）是指汽轮机由满负荷到空负荷的转速变化与额定转速之比。当电网频率变化时，引起的负荷变化与机组调节系统速度变动率成反比：速度变动率越大，分给该机组的负荷变化量就越小；反之，速度变动率越小，负荷变化量就越大，即一次调频范围越大。<br />典型参数实例：对于火电机组，速度变动率通常取4%~5%。以660MW机组为例，在5%速度变动率下，每变化1r/min的转速差对应的调频量为4.4MW；若速度变动率降至3%，则相同转速变化对应的调频量会更大，调频范围更宽。因此，该说法正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795243", "t": 3, "q": "金属材料的疲劳极限是一个固定值，一旦材料确定，其疲劳极限不会随使用环境变化而改变。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属材料的疲劳极限并非固定值，会受使用环境如温度、介质等因素影响而改变。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795244", "t": 3, "q": "单元机组一次调频的响应时间通常在几分钟到十几分钟，主要用于恢复电网频率至额定值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "单元机组一次调频响应时间很快，一般在几秒到几十秒，用于快速响应电网频率变化；而恢复电网频率至额定值靠二次调频，时间在几分钟到十几分钟。所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795245", "t": 3, "q": "金属材料的冷脆现象发生在高温环境下，主要是由于材料中磷元素的存在导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "金属材料的冷脆现象发生在低温环境下，而非高温，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795246", "t": 3, "q": "金属材料的氢脆化是由于氢原子在材料内部形成氢气气泡，产生内应力，导致材料在较低应力下发生脆性开裂。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "您描述的现象——“氢原子在材料内部形成氢气气泡，产生内应力”——确实是氢脆的主要机制之一，即氢压理论。该理论认为，氢原子在金属内部的缺陷（如微孔、晶界）处结合成氢分子，产生巨大的内压（可达数百兆帕），与外部拉应力叠加，导致材料在远低于其屈服强度的应力下发生脆性开裂。<br />然而，氢脆的机理学术界尚未完全统一，除“氢压理论”外，还有弱键理论（氢原子降低金属原子间结合力）、氢促进局部塑性变形理论（氢原子促进位错运动，导致局部过度变形而开裂）以及氢致相变理论（氢与金属生成脆性氢化物）等。因此，您描述的只是氢脆的其中一种核心机理，而非全部。<br />不过，在工程实践中，氢压理论是最经典、最直观的解释，且用于描述氢脆“导致材料在较低应力下发生脆性开裂”这一核心现象是完全正确的。因此，本题应选 A.正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795247", "t": 3, "q": "金属材料的蠕变极限值随温度的升高而增大，温度越高，材料的抗蠕变能力越强。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。金属材料的蠕变极限会随温度升高而减小，温度越高，材料越容易发生蠕变，抗蠕变能力变弱。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795248", "t": 3, "q": "金属材料的疲劳破坏通常发生在材料的屈服强度以下，且破坏前无明显塑性变形，属于脆性破坏。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "金属材料疲劳破坏是交变应力作用下产生的，一般在屈服强度以下就可能发生，且破坏前无明显塑性变形，属于脆性破坏。", "ap": [false, false, false, false, false, false]}, {"id": "2034800287423795249", "t": 3, "q": "单元机组正常运行时，若电网频率升高，一次调频会使机组负荷降低，以抑制频率进一步升高。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电网频率升高时，一次调频会使机组减少出力，即机组负荷降低，从而消耗电网多余能量，抑制频率进一步升高。", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第7章 新能源与可持续能源技术（1）", "n": "基础练习题【含解析】 / 第7章 新能源与可持续能源技术（1）", "qs": [{"id": "2034800290577911808", "t": 1, "q": "核电站的\"应急冷却系统\"在下列哪些事故情况下会启动?（　）", "a": ["蒸汽发生器传热管破裂事故", "反应堆控制棒卡涩事故", "发电机短路事故", "电网频率异常事故", "", ""], "r": "A", "e": "应急冷却系统主要用于应对影响反应堆温度控制等的事故。蒸汽发生器传热管破裂会影响冷却和热量传递，可能使反应堆温度异常，需应急冷却系统启动。而控制棒卡涩、发电机短路、电网频率异常通常不直接影响反应堆冷却。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911809", "t": 1, "q": "能源与环境经济分析中，以下哪些政策工具属于\"碳定价\"机制，可用于减少能源相关的碳排放（　）?", "a": ["可再生能源电价补贴", "燃煤电厂脱硫脱硝电价加价", "碳税", "绿色电力证书交易", "", ""], "r": "C", "e": "碳定价机制是对碳排放设定价格以减少排放。碳税直接对碳排放征税，是典型碳定价机制。A是补贴可再生能源发电；B是针对脱硫脱硝的电价调整；D是绿色电力交易凭证机制。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911810", "t": 1, "q": "太阳能聚光热发电系统中，下列哪些设备属于\"吸热系统\"的组成部分?（　）", "a": ["定日镜", "吸热器", "高温熔盐储罐", "聚光器", "", ""], "r": "B", "e": "吸热系统主要是吸收太阳能热量的部分。吸热器的作用就是吸收汇聚后的太阳能热量，属于吸热系统；定日镜和聚光器作用是将太阳光汇聚到吸热器，并非直接完成吸热功能；高温熔盐储罐用于储存热能，不属于吸热部分。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911811", "t": 1, "q": "多能互补冷热电多联供系统采用\"风光储+燃气轮机\"组合时，下列哪种运行策略能最大程度减少系统对电网的依赖（提高自给自足率）?", "a": ["优先利用电网供电，光伏、风电和燃气轮机用于充电储能", "优先利用燃气轮机发电，光伏和风电用于补充，储能用于应急供电", "优先利用储能放电，不足时由光伏和风电补充，燃气轮机用于调峰", "优先利用光伏和风电发电，不足时由燃气轮机补充，储能用于削峰填谷", "", ""], "r": "D", "e": "要减少对电网依赖，需优先用可再生能源。光伏和风电是可再生能源，优先利用它们发电，不足时用燃气轮机补充，储能用于削峰填谷能让系统自给自足率最高。答案选D。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911812", "t": 1, "q": "多能互补冷热电多联供系统的\"余热利用效率\"是衡量系统能源梯级利用效果的关键指标，以下哪种情况会导致该效率显著降低?", "a": ["提高余热利用设备（如吸收式制冷机）的COP值", "增加余热回收换热器的传热面积", "优化余热与负荷的时间匹配度", "将高温余热直接用于低温热水供应", "", ""], "r": "D", "e": "能源梯级利用应按温度高低合理利用余热，将高温余热直接用于低温热水供应，浪费了高温余热的能量品质，会显著降低余热利用效率。A提高COP值、B增加传热面积、C优化时间匹配度都有利于提高余热利用效率。答案：D ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911813", "t": 1, "q": "多能互补冷热电多联供系统中，“余热利用”是提高能源综合效率的关键，下列哪种设备最适合回收燃气轮机排气余热，同时满足供冷和供热需求?", "a": ["吸收式制冷机", "余热锅炉（产生蒸汽）", "换热器（直接加热热水）", "溴化锂制冷机组（可制热也可制冷）", "", ""], "r": "D", "e": "在这道题中，我们需要找出一种设备，它既能回收燃气轮机的排气余热，又能同时满足供冷和供热的需求。A. 吸收式制冷机：虽然可以利用余热进行制冷，但不能直接满足供热需求。B. 余热锅炉（产生蒸汽）：主要用来产生蒸汽，通常用于发电或供热，但不能直接满足供冷需求。C. 换热器（直接加热热水）：可以用来加热热水以满足供热需求，但不能满足供冷需求。D. 溴化锂制冷机组（可制热也可制冷）：这种设备可以利用余热进行制冷和供热，完全符合题目要求。综上所述，最适合回收燃气轮机排气余热，同时满足供冷和供热需求的设备是溴化锂制冷机组。所以，正确答案是D选项：“溴化锂制冷机组（可制热也可制冷）”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911814", "t": 1, "q": "多能互补冷热电多联供系统中，当系统同时接入光伏、燃气轮机和蓄热装置时，在夏季用电高峰且光照充足的工况下，系统优化运行的优先策略通常是以下哪一项?", "a": ["优先使用蓄热装置放热发电，光伏和燃气轮机停机", "光伏与燃气轮机满负荷运行，多余电力并网销售", "优先消纳光伏电力，不足部分由燃气轮机补充，蓄热装置备用", "优先使用燃气轮机发电，光伏电力存入蓄热装置", "", ""], "r": "C", "e": "夏季用电高峰且光照充足，光伏能提供大量电力，应优先消纳清洁的光伏电力。若光伏电力不够，再用燃气轮机补充，蓄热装置作为备用。所以优先策略是C选项。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911815", "t": 1, "q": "多能互补冷热电多联供系统中，当系统以\"以热定电\"模式运行，且热负荷突然增加时，下列哪种能源协调策略最合理?", "a": ["优先降低余热锅炉蒸汽参数（保证供热，降低发电效率）", "优先增加燃气轮机出力（同时增加发电和供热量）", "优先减少制冷机组出力（将电能转移至供热设备）", "优先启动电锅炉（仅增加供热量，不影响发电）", "", ""], "r": "B", "e": "“以热定电”模式热负荷突然增加，需快速增加供热量。A 降低余热锅炉蒸汽参数会降低发电效率且供热提升有限；C 减少制冷机组出力转移电能供热，但制冷机组功率小难以满足大幅热负荷增加；D 启动电锅炉仅增加供热不影响发电，但启动有延迟且成本高。B 增加燃气轮机出力可同时增加发电和供热量，能快速响应热负荷增加。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911816", "t": 1, "q": "多能互补冷热电三联供系统中，当光伏和风电出力骤增，导致系统电能过剩时，下列哪种储能方式最适合快速吸收过剩电能，且响应速度快、充放电效率高?", "a": ["飞轮储能", "抽水蓄能", "压缩空气储能", "蓄电池储能", "", ""], "r": "A", "e": "飞轮储能响应速度快、充放电效率高，能快速吸收过剩电能。抽水蓄能建设周期长、响应慢；压缩空气储能响应速度相对一般；蓄电池储能有充放电次数限制等问题，响应速度和效率不如飞轮储能。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911817", "t": 1, "q": "多能互补冷热电三联供系统中，当系统以\"以热定电\"模式运行时，下列哪种能源设备的出力调节优先级最高?", "a": ["光伏电站", "燃气轮机", "电锅炉", "风力发电机", "", ""], "r": "B", "e": "“以热定电”模式优先满足热负荷需求。燃气轮机既发电又产热，能根据热负荷调节出力，调节优先级最高。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911818", "t": 1, "q": "多能互补系统中，“能源梯级利用”的核心原则是?", "a": ["将高品位能源优先用于低品位用能需求", "将所有能源统一转换为电能后再分配使用", "根据能源品位和用能需求匹配，高品位能源满足高品位需求，低品位能源满足低品位需求", "仅利用一种高品位能源满足所有用能需求", "", ""], "r": "C", "e": "能源梯级利用就是让能源品位和用能需求相匹配，充分发挥不同品位能源的作用，C选项表述符合这一核心原则，A选项违背原则，B选项不属于梯级利用含义，D选项不符梯级利用多能源搭配思路。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911819", "t": 1, "q": "风力发电机组的\"变桨距控制\"在低风速段的主要目的是?", "a": ["提高电网电能质量（稳定输出功率）", "最大化风能捕获（使叶片保持最佳攻角）", "限制机组出力（避免超过额定功率）", "减少叶片疲劳载荷（降低变桨频率）", "", ""], "r": "B", "e": "低风速段要尽可能多获取风能。变桨距控制在低风速段通过调整叶片角度使叶片保持最佳攻角，能最大化捕获风能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911820", "t": 1, "q": "风力发电机组的\"传动链\"是将风轮机械能传递至发电机的关键部件，以下哪种传动方式因具有结构紧凑、维护成本低的特点，在大型风电机组（3MW以上）中应用日益广泛?", "a": ["单级齿轮箱传动", "行星齿轮箱+定轴齿轮箱组合传动", "无齿轮箱直驱传动", "多级齿轮箱传动", "", ""], "r": "C", "e": "无齿轮箱直驱传动没有齿轮箱，结构紧凑，减少了齿轮箱维护，维护成本低，在大型风电机组中应用广泛。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911821", "t": 1, "q": "风力发电机组的\"低电压穿越\"能力是指?", "a": ["机组在电网电压跌落时，短期内保持并网运行，待电压恢复后正常发电的能力", "机组在低风速下，实现并网发电的能力", "机组在电网电压正常时，维持稳定运行的能力", "机组在电网电压过高时，切断并网的能力", "", ""], "r": "A", "e": "低电压穿越就是在电网电压跌落时，风电机组能在短时间保持并网，等电压恢复后正常发电。B说的是低风速并网，C是正常电压运行，D是电压过高切断并网，均不符。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911822", "t": 1, "q": "风力发电机组的\"功率曲线\"是反映风速与输出功率关系的关键曲线，下列哪种因素会导致功率曲线的\"额定功率段\"（风速高于额定风速）向下偏移?", "a": ["风轮直径增大", "发电机额定功率降低", "轮毂高度增加", "叶片翼型优化", "", ""], "r": "B", "e": "额定功率段向下偏移意味着在高于额定风速时输出功率降低。发电机额定功率降低，那么在额定风速以上输出功率自然会降低，使功率曲线额定功率段向下偏移。风轮直径增大、叶片翼型优化通常会提升发电能力，功率曲线应向上偏移；轮毂高度增加对功率曲线额定功率段影响不大。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911823", "t": 1, "q": "风力发电机组的\"偏航系统\"在下列哪种情况下，会停止偏航并触发偏航制动?", "a": ["偏航角度超过90度（未达到解缆角度）", "风速低于切入风速", "风速高于额定风速", "检测到偏航电机过载", "", ""], "r": "D", "e": "偏航电机过载时，为保护设备，会停止偏航并触发偏航制动。A选项偏航角度未达解缆角度通常不会直接停止偏航；B选项风速低于切入风速与偏航制动无直接关联；C选项风速高于额定风速主要影响的是功率控制等，而非直接触发偏航制动。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911824", "t": 1, "q": "风力发电机组的\"偏航系统\"在运行过程中，当检测到风速矢量与机舱轴线夹角超过设定值时，其动作是?", "a": ["切断机组电源，停止发电", "驱动机舱绕塔架旋转，使机舱轴线对准风速矢量方向", "调节发电机转速，维持输出功率稳定", "调节桨距角改变风能吸收", "", ""], "r": "B", "e": "偏航系统主要作用是使机舱轴线对准风速矢量方向以提高风能捕获效率。当检测到风速矢量与机舱轴线夹角超设定值时，应驱动机舱绕塔架旋转来对准。A选项切断电源停止发电并非偏航系统动作；C选项调节发电机转速是其他系统功能；D选项调节桨距角也不是偏航系统功能。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911825", "t": 1, "q": "风力发电机组的变桨距控制系统在额定风速以上运行时，其主要控制目标是?", "a": ["维持机组输出功率稳定", "减少叶片气动噪声", "优化叶片角度以降低机械磨损", "最大化风能捕获效率", "", ""], "r": "A", "e": "在额定风速以上，风力发电机组变桨距控制系统主要是通过调节桨叶角度，限制风能捕获，使机组输出功率保持在额定值附近，维持稳定。所以答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911826", "t": 1, "q": "风力发电机组的齿轮箱在运行过程中，出现\"齿面胶合\"故障，其主要原因通常是?", "a": ["齿轮箱润滑油黏度太高", "齿轮加工精度过低，齿面粗糙度大", "齿轮啮合处局部温度过高，润滑油膜破裂", "机组长期在低风速下运行，齿轮载荷过小", "", ""], "r": "C", "e": "齿面胶合是因齿轮啮合处局部温度过高使润滑油膜破裂，两齿面金属直接接触并相互粘连，在相对运动中较软齿面金属被撕下而形成。A选项润滑油黏度高一般不会导致齿面胶合；B选项加工精度低等会影响传动但不是齿面胶合主因；D选项低风速载荷小也不是齿面胶合原因。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911827", "t": 1, "q": "风力发电机组运行中，当风速超过额定风速但未达到切出风速时，为维持机组输出功率稳定，通常采用的主动控制方式是以下哪一种?", "a": ["调整发电机励磁电流", "减小风轮旋转角速度（失速控制）", "改变风轮叶片安装角（变桨距控制）", "增大机舱偏航角度", "", ""], "r": "C", "e": "当风速超额定未达切出风速时，变桨距控制可改变风轮叶片安装角，调节风能捕获量，维持机组输出功率稳定。而调整发电机励磁电流主要影响电机特性；失速控制是被动调节；增大机舱偏航角度会使风轮偏离风向，减少发电。所以选C。 答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911828", "t": 1, "q": "风力发电机组运行中，当检测到轮毂转速超过额定转速120%且变桨系统故障无法调节时，下列哪种保护措施会优先触发以避免机组损坏?", "a": ["叶尖扰流器弹出", "低速轴制动器制动", "发电机脱网", "高速轴制动器制动", "", ""], "r": "A", "e": "轮毂转速超额定120%且变桨故障无法调节时，叶尖扰流器弹出能快速增加叶片气动阻力，使风轮减速，是最直接有效的避免机组损坏措施。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911829", "t": 1, "q": "根据核电站安全准则，下列哪项属于\"纵深防御\"体系中\"第三道屏障\"的核心功能?", "a": ["过滤释放到大气中的放射性物质", "阻止放射性物质从燃料棒中释放", "防止放射性物质泄漏到反应堆厂房外", "限制放射性物质在反应堆冷却剂系统内扩散", "", ""], "r": "C", "e": "核电站“纵深防御”第三道屏障是安全壳，其核心功能是防止放射性物质泄漏到反应堆厂房外。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911830", "t": 1, "q": "根据核电站安全准则，下列哪种安全系统的主要功能是在反应堆发生失水事故时，向堆芯注入冷却剂，防止堆芯熔化?", "a": ["安全壳喷淋系统", "放射性废物处理系统", "停堆系统", "应急堆芯冷却系统", "", ""], "r": "D", "e": "应急堆芯冷却系统的作用就是在反应堆发生失水事故时，向堆芯注入冷却剂，防止堆芯熔化。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911831", "t": 1, "q": "海洋能利用中，潮汐电站的发电功率与潮汐水位差的关系符合以下哪一规律（忽略其他影响因素）?", "a": ["与水位差无关", "与水位差成正比", "与水位差的平方成正比", "与水位差的三次方成正比", "", ""], "r": "C", "e": "潮汐电站发电功率公式「test/yiwen_img/importSubject/2034800288283627520.png」（Q为流量，H为水位差等），流量Q与水位差有关，经推导可知发电功率与水位差的平方成正比。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911832", "t": 1, "q": "海洋能中的\"盐差能\"发电，其能量转换的核心原理是利用下列哪种物理现象?", "a": ["浮力变化（海水密度变化产生浮力差）", "渗透压（海水与淡水间的浓度差产生压力）", "热胀冷缩（海水温度变化产生体积差）", "电磁感应（海水流动切割磁感线）", "", ""], "r": "B", "e": "盐差能发电是利用海水和淡水之间或两种含盐浓度不同的海水之间的浓度差所具有的渗透压来获取能量。A选项浮力变化不是盐差能发电核心原理；C选项热胀冷缩与盐差能发电原理无关；D选项电磁感应是磁生电，并非盐差能发电原理。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911833", "t": 1, "q": "海洋能中的波浪能转换装置中，\"振荡水柱式\"装置的工作原理是利用波浪推动气室中水柱运动，进而驱动涡轮机发电，以下哪种涡轮机因能适应气室中气流的双向流动而被该装置优先采用?", "a": ["Wells涡轮机", "离心式涡轮机", "冲动式涡轮机", "轴流式涡轮机", "", ""], "r": "A", "e": "Wells涡轮机的特点是能适应气室中气流的双向流动，适合振荡水柱式装置。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911834", "t": 1, "q": "核电站的\"安全壳\"是防止放射性物质泄漏的最后一道屏障，以下哪种安全壳类型主要用于沸水堆核电站，且具有体积小、结构紧凑的特点?", "a": ["干式安全壳", "湿式安全壳（压力抑制型安全壳）", "钢制安全壳", "预应力混凝土安全壳", "", ""], "r": "B", "e": "湿式安全壳（压力抑制型安全壳）主要用于沸水堆核电站，有体积小、结构紧凑特点。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911835", "t": 1, "q": "核电站的\"安全准则\"中，\"辐射防护\"的基本原则不包括下列哪项?", "a": ["防护最优化（在合理可行的范围内尽量降低辐射剂量）", "辐射源集中管理（将所有辐射源集中存放）", "实践的正当性（辐射实践带来的收益大于风险）", "剂量限制（辐射剂量不超过规定限值）", "", ""], "r": "B", "e": "辐射防护基本原则是实践正当性、防护最优化、剂量限制，辐射源集中管理并非基本原则。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911836", "t": 1, "q": "核电站的\"放射性废物处理\"中，下列哪种处理方法适用于处理\"中低放射性液态废物\"，且能实现废物减容和固化?", "a": ["吸附+塑料固化", "离子交换+沥青固化", "蒸发浓缩+水泥固化", "沉淀+玻璃固化", "", ""], "r": "C", "e": "对于中低放射性液态废物，蒸发浓缩可将水分去除实现减容，水泥固化能把浓缩后的废物固定，形成稳定固体。而选项A、B、D的组合并非最适用于中低放射性液态废物实现减容和固化的方法。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911837", "t": 1, "q": "核电站的\"三道屏障\"中，下列哪项属于第二道屏障，用于防止燃料包壳破损后放射性物质泄漏?", "a": ["安全壳", "蒸汽发生器传热管", "反应堆压力容器", "燃料元件包壳", "", ""], "r": "C", "e": "核电站“三道屏障”，燃料元件包壳是第一道屏障；反应堆压力容器是第二道屏障，可在燃料包壳破损后防止放射性物质泄漏；安全壳是第三道屏障。答案选C。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911838", "t": 1, "q": "核电站的\"蒸汽发生器\"在一回路和二回路之间的作用是?", "a": ["通过传热管将一回路冷却剂的热量传递给二回路的水，产生蒸汽，实现放射性隔离", "将二回路的蒸汽热量传递给一回路，加热冷却剂", "储存一回路的冷却剂，维持系统压力稳定", "将一回路的放射性冷却剂与二回路的水直接混合，产生蒸汽", "", ""], "r": "A", "e": "蒸汽发生器是核电站一、二回路间的关键设备，主要是把一回路冷却剂热量经传热管传给二回路水以产生蒸汽，同时实现放射性隔离。B选项热传递方向错误；C选项不是其主要作用；D选项直接混合会使二回路水被放射性污染，不符合要求。答案：A", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911839", "t": 1, "q": "核电站运行中，\"堆芯冷却系统\"是保障反应堆安全的关键系统，下列哪种堆芯冷却系统在\"丧失冷却剂事故（LOCA）\"发生时，能通过重力自流方式为堆芯提供应急冷却?", "a": ["主冷却剂系统", "安全壳喷淋系统", "应急堆芯冷却系统（ECCS）中的安全注入系统", "余热排出系统", "", ""], "r": "C", "e": "在丧失冷却剂事故时，应急堆芯冷却系统中的安全注入系统可利用重力自流为堆芯应急冷却。主冷却剂系统是正常运行冷却；安全壳喷淋系统主要是降低安全壳压力和温度；余热排出系统是排出停堆后余热。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911840", "t": 1, "q": "核电站运行中，\"控制棒\"的主要材料通常是下列哪种，其作用是吸收中子，控制核裂变反应速率?", "a": ["镉", "铀-235", "钚-239", "锆", "", ""], "r": "A", "e": "控制棒要能吸收中子来控制核裂变反应速率，镉有良好的中子吸收能力，常作为控制棒材料；铀 - 235、钚 - 239 是核燃料用于发生核裂变；锆一般用于核反应堆的结构材料。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911841", "t": 1, "q": "能源与环境经济分析中，\"能源外部性\"是指能源生产消费过程中未计入市场价格的社会成本或收益，以下哪种情况属于能源的负外部性?", "a": ["光伏电站为偏远地区提供电力保障的社会效益", "燃煤电厂排放SO2导致周边区域酸雨造成的农业损失", "生物质发电消耗农业废弃物减少垃圾填埋量的收益", "风电项目减少区域燃煤发电带来的空气质量改善", "", ""], "r": "B", "e": "能源负外部性是社会成本，即带来不利影响。A、C、D选项都是能源带来的社会效益或积极收益，属于正外部性；B选项中燃煤电厂排放SO₂致农业损失是社会成本，属于负外部性。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911842", "t": 1, "q": "生物质成型燃料（如颗粒燃料）在燃烧发电时，与散状生物质燃料相比，最显著的优势是?", "a": ["提高燃料水分含量", "降低燃料运输和储存成本", "提高燃料挥发分含量", "降低燃料灰分含量", "", ""], "r": "B", "e": "生物质成型燃料将散状生物质压缩，体积减小，方便运输和储存，能降低相关成本。A选项提高水分含量并非优势；C选项挥发分含量与成型与否关系不大；D选项成型不会降低灰分含量。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911843", "t": 1, "q": "生物质成型燃料发电中，成型燃料的\"堆积密度\"对发电系统的影响主要体现在?", "a": ["堆积密度越高，燃料的灰分含量越低", "堆积密度越高，燃料的热值越高", "堆积密度越高，燃料的运输和储存成本越低，锅炉进料越稳定", "堆积密度越高，燃料的含水量越低", "", ""], "r": "C", "e": "堆积密度高意味着单位体积燃料质量大，便于运输和储存，能降低相关成本，且使锅炉进料更稳定。而灰分、热值、含水量与堆积密度并无直接关联。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911844", "t": 1, "q": "生物质发电系统中，为去除生物质燃烧产生的烟气中氮氧化物（NOx），以下哪种脱硝技术因无需消耗氨等还原剂，且能利用生物质自身含有的碱性物质，被广泛应用?", "a": ["选择性催化还原法（SCR）", "烟气循环流化床脱硫脱硝一体化技术", "选择性非催化还原法（SNCR）", "低温等离子体脱硝技术", "", ""], "r": "B", "e": "SCR和SNCR需消耗氨等还原剂，低温等离子体脱硝技术未利用生物质自身碱性物质，而烟气循环流化床脱硫脱硝一体化技术可利用生物质自身碱性物质且无需额外消耗氨等还原剂。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800290577911845", "t": 1, "q": "生物质气化发电过程中，气化炉内发生的还原反应是生成下列哪种主要可燃气体的关键环节?", "a": ["一氧化碳", "二氧化碳", "甲烷", "氢气", "", ""], "r": "A", "e": "在生物质气化发电中，气化炉内的还原反应主要是使二氧化碳与碳反应生成一氧化碳，一氧化碳是重要的可燃气体，所以生成一氧化碳是关键环节。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529600", "t": 2, "q": "潮汐能发电站的\"水轮机\"需具备的特性包括下列哪些（　）?", "a": ["具有较高的水力效率（提高发电量）", "适应低水头大流量（潮差通常较小）", "适应中低转速（潮水流速较慢）", "耐海水腐蚀（海水环境）", "", ""], "r": "ABCD", "e": "潮汐电站潮差小、流量大，水轮机需要高效率、适配低水头大流量、中低转速运行，同时海水环境要求设备具备抗海水腐蚀能力。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529601", "t": 2, "q": "潮汐能发电站的选址需考虑的关键自然条件包括下列哪些（　）?", "a": ["潮流速度（需满足水轮机启动要求）", "潮差大小（潮差需满足一定数值）", "海岸地形（需便于修建堤坝）", "海水盐度（需低于腐蚀性阈值以保护设备）", "", ""], "r": "ABC", "e": "潮汐能发电依赖潮流和潮差提供能量，所以潮流速度要能满足水轮机启动，潮差需达一定数值；合适的海岸地形便于修建堤坝来利用潮汐能。而海水盐度对潮汐能发电站选址并非关键自然条件。答案：ABC ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529602", "t": 2, "q": "多能互补冷热电多联供系统的\"储能系统\"选择需考虑的因素包括下列哪些（　）?", "a": ["响应时间（需满足快速调节需求）", "储能容量（需满足负荷调节需求）", "充放电效率（影响能源利用率）", "储能介质寿命（影响系统经济性）", "", ""], "r": "ABCD", "e": "储能系统要快速响应调节需求所以要考虑响应时间；需满足负荷调节就需考虑储能容量；充放电效率影响能源利用，储能介质寿命影响系统经济，ABCD四个因素都需考虑。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529603", "t": 2, "q": "多能互补冷热电多联供系统的\"监控系统\"需实现的功能包括下列哪些（　）?", "a": ["统计能源消耗与产出，生成报表", "实时监测各能源设备的运行参数（如温度、压力、功率）", "远程控制设备启停（实现无人值守）", "故障诊断与报警（及时发现设备故障）", "", ""], "r": "ABCD", "e": "多能互补冷热电多联供系统的监控系统要对能源使用情况和设备运行状态全面管理。A可掌握能源状况；B能了解设备实时状态；C可提高管理效率；D能及时处理设备问题。ABCD都是其应实现的功能。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529604", "t": 2, "q": "多能互补冷热电多联供系统设计中，以下哪些参数需要进行耦合优化，以实现系统经济性和环保性的平衡（　）?", "a": ["能源采购价格（如天然气、电网电价）的波动系数", "蓄能装置（如蓄电池、蓄热罐）的容量和充放策略", "系统的并网/离网运行模式切换条件", "冷热电负荷的预测精度", "", ""], "r": "ABCD", "e": "多能互补冷热电多联供系统设计时，为实现经济性和环保性的平衡，多个关键参数需进行耦合优化。首先，能源采购价格的波动系数（A选项）直接影响系统的成本效益，因此必须考虑。其次，蓄能装置的容量和充放策略（B选项）对于平衡供需、提高能源利用率至关重要。再次，系统的并网/离网运行模式切换条件（C选项）关系到系统的稳定性和可靠性，也影响着能源的使用效率和经济性。最后，冷热电负荷的预测精度（D选项）对于确保系统满足实际需求、避免浪费和提高效率同样关键。综上所述，所有提到的参数A、B、C和D均需要进行耦合优化以实现系统的经济性和环保性的平衡。所以，正确答案是ABCD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529605", "t": 2, "q": "多能互补冷热电多联供系统中，下列哪些能源形式可作为系统的\"基荷能源\"（稳定供应能量的能源）?（　）", "a": ["燃气轮机", "光伏电站", "生物质直燃发电机组", "储能系统", "", ""], "r": "AC", "e": "基荷能源需稳定供应能量。燃气轮机可稳定发电供热，生物质直燃发电机组能持续将生物质转化为电能，可作基荷能源；光伏电站受光照影响，发电不稳定；储能系统是储存和释放能量，并非稳定供应的基荷能源。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529606", "t": 2, "q": "多能互补冷热电三联供系统的\"系统优化\"目标包括下列哪些?（　）", "a": ["系统运行成本最低", "系统能源利用效率最高", "系统总能耗最低", "系统污染物排放量最低", "", ""], "r": "ABCD", "e": "多能互补冷热电三联供系统优化就是要综合考量成本、能源利用、能耗及环保等方面，使系统在运行成本、能源利用效率、总能耗和污染物排放等方面达到最优。答案为ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529607", "t": 2, "q": "多能互补冷热电三联供系统中，下列哪些能源设备可作为\"基荷能源\"，提供稳定的能量输出?（　）", "a": ["生物质直燃锅炉", "燃气轮机", "光伏电站", "燃料电池", "", ""], "r": "ABD", "e": "基荷能源需能稳定输出能量。光伏电站受光照影响，输出不稳定。生物质直燃锅炉、燃气轮机、燃料电池能稳定提供能量。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529608", "t": 2, "q": "多能互补系统中，“储能系统”的作用包括下列哪些?（　）", "a": ["提高系统的能源利用效率", "替代基荷能源，提供持续稳定的能量输出", "在能源供应过剩时，储存多余能量", "平抑间歇性能源（光伏、风电）的出力波动", "", ""], "r": "ACD", "e": "储能系统可在能源过剩时储存多余能量，平抑间歇性能源出力波动，还能提高系统能源利用效率，但它不能替代基荷能源提供持续稳定能量输出。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529609", "t": 2, "q": "多能互补系统中，“能源管理系统（EMS）”的功能包括下列哪些?（　）", "a": ["记录系统的能源生产和消耗数据", "实现系统与电网的并网控制", "实时监测各能源设备的运行状态", "诊断能源设备的故障并报警", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529610", "t": 2, "q": "风力发电机组的\"变桨距系统\"由下列哪些部件组成?（　）", "a": ["变桨驱动电机", "桨距角传感器", "减速齿轮", "主轴", "", ""], "r": "ABC", "e": "变桨距系统主要用于调节桨叶角度，变桨驱动电机提供动力，桨距角传感器监测角度，减速齿轮起到传动和减速作用。而主轴是传动系统部件，并非变桨距系统组成。所以答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529611", "t": 2, "q": "风力发电机组的\"传动系统\"包括下列哪些部件?（　）", "a": ["风轮叶片", "主轴", "发电机转子", "联轴器", "", ""], "r": "BD", "e": "传动系统是将风轮的机械能传递给发电机的系统。主轴用于传递风轮的扭矩和转速，联轴器用于连接不同部件实现动力传递，它们都属于传动系统。风轮叶片主要是捕获风能，发电机转子是发电机的一部分将机械能转化为电能，不属于传动系统部件。答案选BD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529612", "t": 2, "q": "风力发电机组的\"传动系统\"故障会导致机组出力下降，下列哪些属于传动系统的常见故障（　）?", "a": ["变桨轴承卡阻", "齿轮箱齿面磨损", "主轴密封泄漏", "高速轴联轴器偏移", "", ""], "r": "BCD", "e": "传动系统包含主轴、齿轮箱、联轴器等部件；B 齿轮箱齿面磨损、C 主轴密封泄漏、D 高速轴联轴器偏移均属于传动系统故障；A 变桨轴承卡阻属于变桨系统故障，不属于传动系统。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529613", "t": 2, "q": "风力发电机组的\"故障诊断系统\"可监测下列哪些参数，用于判断机组是否存在故障?（　）", "a": ["桨距角位置", "齿轮箱油温", "电网电压", "风轮转速", "", ""], "r": "ABD", "e": "答案：ABD风力发电机组的故障诊断系统主要用于监测与机组运行状态直接相关的关键参数，以此来判断机组是否存在故障。桨距角位置（A选项）是反映风力发电机叶片角度的重要参数，其异常可能直接影响发电效率和机组安全；齿轮箱油温（B选项）过高或过低都可能表明齿轮箱存在故障，需要及时处理以避免损坏；风轮转速（D选项）是反映风力发电机运行状态的基本参数，其异常可能意味着机组存在故障。而电网电压（C选项）虽然重要，但它主要反映的是电网状态，而非风力发电机组本身的运行状态，因此不是故障诊断系统主要监测的参数。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529614", "t": 2, "q": "风力发电机组的\"控制系统\"在下列哪些情况下会触发机组\"紧急停机\"?（　）", "a": ["电网电压骤降超过50%且持续2秒", "风速超过切出风速（如25m/s）且持续10分钟", "发电机转速超过额定转速150%", "变桨系统完全失效", "", ""], "r": "ACD", "e": "紧急停机是为保障机组安全，电网电压骤降超50%且持续2秒、发电机转速超额定150%、变桨系统完全失效都会严重威胁机组安全触发紧急停机；而风速超切出风速一般是正常保护停机，并非紧急停机那种紧急情况。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529615", "t": 2, "q": "风力发电机组的\"偏航系统\"主要用于使风轮对准风向，以下哪些部件的故障会导致偏航系统\"卡滞\"，影响机组出力（　）?", "a": ["偏航驱动电机的减速器齿轮磨损", "偏航刹车盘的摩擦系数下降", "风向标传感器的信号线断裂", "偏航计数器的计数误差", "", ""], "r": "ABC", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529616", "t": 2, "q": "风力发电机组的\"叶片维护\"中，下列哪些情况需要进行叶片修复（　）?", "a": ["叶片表面出现长度超过50mm的裂纹", "叶片内部出现气泡（直径超过10mm）", "叶片边缘出现轻微磨损（深度小于1mm）", "叶片表面出现面积超过0.1m²的脱胶", "", ""], "r": "ABD", "e": "叶片表面长超50mm裂纹、内部直径超10mm气泡、表面超0.1m²脱胶都影响叶片性能和安全需修复，而边缘轻微磨损深度小于1mm通常不严重，暂不需修复。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529617", "t": 2, "q": "风力发电机组运行维护中，下列哪些属于\"定期维护\"的内容?（　）", "a": ["变桨距系统液压油压力检查", "叶片表面损伤检测和修复", "电网电压跌落时的低电压穿越能力测试", "齿轮箱润滑油油位检查和油质检测", "", ""], "r": "ABD", "e": "这是一道关于风力发电机组定期维护内容的选择题。在风力发电机组的运行维护中，不同项目有着不同的维护周期和类别。A选项提到的“变桨距系统液压油压力检查”，这通常是定期进行的，以确保系统的正常运行和安全。B选项的“叶片表面损伤检测和修复”同样属于定期维护的一部分，因为需要定期检查叶片的完好性，以防止损伤影响发电效率或安全。C选项“电网电压跌落时的低电压穿越能力测试”并非日常或定期的维护内容。这种测试更多是在特定情况下进行，比如电网故障后的性能验证，不属于常规的定期维护项目。D选项的“齿轮箱润滑油油位检查和油质检测”显然是定期维护的重要环节，因为润滑油的状况直接影响齿轮箱的运行效率和寿命。综上所述，A、B、D三个选项均属于风力发电机组的定期维护内容，而C选项不属于这一类别。所以，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529618", "t": 2, "q": "风力发电机组运行维护中，以下哪些故障类型可能导致风轮\"飞车\"事故（即转速远超额定值），需重点监控（　）?", "a": ["发电机定子绕组短路", "刹车系统刹车片磨损超限", "风速仪测量数据失真", "齿轮箱高速轴断轴", "", ""], "r": "BC", "e": "在风力发电机组运行维护中，“飞车”事故指的是风轮转速远超额定值的危险情况。我们需要识别哪些故障类型可能导致这一严重后果。首先，我们分析每个选项可能导致的影响：* A选项提到的发电机定子绕组短路，这通常会导致发电机故障停机，而不是风轮转速失控。* B选项中的刹车系统刹车片磨损超限，如果刹车系统失效，风轮在失去控制时可能无法及时减速，从而导致“飞车”事故。* C选项的风速仪测量数据失真可能导致控制系统接收到错误的风速信息，进而无法准确调节风轮转速，也可能引发“飞车”。* D选项的齿轮箱高速轴断轴通常会导致传动失效，但不太可能导致风轮转速失控到“飞车”的程度。综上所述，B选项和C选项描述的故障类型更有可能导致风轮“飞车”事故。因此，正确答案是BC。简单来说，刹车系统失效和风速仪数据失真都是可能导致风轮转速失控的危险因素，需要重点监控。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529619", "t": 2, "q": "海洋能利用中，以下哪些属于潮汐能发电站的主要技术挑战?（　）", "a": ["电站建设对河口生态系统的影响", "海水腐蚀对设备寿命的缩短", "受季节降水变化影响显著", "潮汐周期性导致发电输出不稳定", "", ""], "r": "BD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529620", "t": 2, "q": "海洋能中的\"波浪能\"发电装置，按能量转换方式可分为下列哪些类型（　）?", "a": ["磁流体式（如海水切割磁感线式）", "振荡式（如振荡水柱式、振荡浮子式）", "收缩波道式（如tapered channel式）", "旋转式（如螺杆式、齿条齿轮式）", "", ""], "r": "BCD", "e": "答案：BCD海洋能中的“波浪能”发电装置按能量转换方式可分为振荡式（如振荡水柱式、振荡浮子式）、收缩波道式（如tapered channel式）、旋转式（如螺杆式、齿条齿轮式）。磁流体式属于海洋能中的“潮流能”发电装置，不属于“波浪能”发电装置。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529621", "t": 2, "q": "核电站\"应急堆芯冷却系统（ECCS）\"在丧失冷却剂事故（LOCA）发生时，需实现的功能包括下列哪些?", "a": ["向堆芯注入冷却水，防止堆芯熔化", "隔离破损的冷却剂管道", "排出堆芯衰变热，维持堆芯温度", "向安全壳内喷淋冷却水，降低安全壳压力", "", ""], "r": "AC", "e": "ECCS在LOCA发生时，主要是向堆芯注入冷却水防止堆芯熔化，同时排出堆芯衰变热维持堆芯温度。隔离破损管道不是其主要功能，向安全壳内喷淋冷却水降低压力一般由安全壳喷淋系统负责。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529622", "t": 2, "q": "核电站安全准则中，\"纵深防御\"原则要求设置多道安全屏障，以下哪些属于该原则下的第二道屏障（　）?", "a": ["控制棒驱动机构的密封结构", "反应堆压力容器", "一回路的管道和阀门", "安全壳", "", ""], "r": "BC", "e": "答案：BC在核电站的“纵深防御”原则中，安全屏障是分层次的。第一道屏障通常是燃料芯块和包壳，它们防止放射性物质逸出燃料。第二道屏障则包括反应堆冷却剂系统，这主要包括反应堆压力容器以及与之相连的一回路的管道和阀门。这些屏障共同作用，确保即使在第一道屏障失效的情况下，放射性物质也不会泄漏到环境中。因此，选项B（反应堆压力容器）和选项C（一回路的管道和阀门）属于第二道屏障。而控制棒驱动机构的密封结构更多是属于反应堆内部的组件，不直接构成对外部环境的屏障；安全壳则是更外层的保护结构，通常被视为第三道屏障。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529623", "t": 2, "q": "核电站安全准则中，下列哪些属于\"纵深防御\"原则的体现?（　）", "a": ["采用冗余设计，关键设备至少有两套备用", "设置多道安全屏障，防止放射性物质泄漏", "定期开展安全演练，提高人员应急处置能力", "对反应堆运行参数进行实时监测和超限报警", "", ""], "r": "ABCD", "e": "“纵深防御”原则是通过多层次保护来保障核电站安全。A是设备冗余保障；B设置多道屏障直接体现纵深防御；C安全演练提升应急能力属于纵深防御中应对事故层面；D实时监测报警可及时发现问题也是纵深防御一部分。ABCD都体现了“纵深防御”原则。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529624", "t": 2, "q": "核电站的\"安全壳\"需具备的功能包括下列哪些（　）?", "a": ["承受反应堆冷却剂系统破裂产生的压力", "在事故时为堆芯提供冷却水源", "防止放射性物质泄漏到环境中", "为反应堆冷却系统提供支撑", "", ""], "r": "AC", "e": "安全壳主要是防止放射性物质泄漏到环境中，同时也能承受反应堆冷却剂系统破裂产生的压力。为堆芯提供冷却水源是应急堆芯冷却系统等的功能，为反应堆冷却系统提供支撑不是安全壳核心功能。答案选AC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529625", "t": 2, "q": "核电站的\"乏燃料管理\"是核安全的重要环节，以下哪些属于乏燃料的处理途径（　）?", "a": ["通过嬗变技术将长寿命核素转化为短寿命核素", "直接深埋处置于地质处置库", "在核电站内暂存（如干式储存罐）", "送往后处理厂进行铀钚回收", "", ""], "r": "ACD", "e": "答案：ACD乏燃料的处理途径主要包括通过嬗变技术转化长寿命核素、在核电站内暂存以及送往后处理厂进行铀钚回收。直接深埋处置不是乏燃料的常规处理途径。因此，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529626", "t": 2, "q": "核电站的\"辐射监测系统\"需监测的区域包括下列哪些（　）?", "a": ["核燃料储存库", "厂界周边环境（监测环境辐射水平）", "汽轮机厂房内（非放射性区域）", "反应堆厂房内", "", ""], "r": "ABD", "e": "核电站辐射监测系统要对可能受辐射影响区域进行监测，核燃料储存库、厂界周边环境、反应堆厂房内都与辐射密切相关需要监测，而汽轮机厂房内非放射性区域通常不用专门纳入辐射监测系统。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529627", "t": 2, "q": "核电站的\"燃料循环\"过程包括下列哪些阶段（　）?", "a": ["核燃料废弃物处置（如乏燃料最终处置）", "核燃料后处理（如乏燃料回收铀和钚）", "核燃料运输（如新鲜燃料运输、乏燃料运输）", "核燃料在反应堆内使用（燃料燃烧）", "", ""], "r": "ABCD", "e": "核燃料完整循环包含铀矿开采、燃料加工制造、燃料运输、堆内燃烧使用、乏燃料运输、后处理回收铀钚、放射性废物处置，ABCD 均属于燃料循环阶段。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529628", "t": 2, "q": "核电站的\"一回路系统\"包括下列哪些设备?（　）", "a": ["主循环泵", "蒸汽发生器", "汽轮机", "稳压器", "", ""], "r": "ABD", "e": "核电站一回路系统主要负责将反应堆堆芯产生的热量带出，主循环泵推动冷却剂循环、蒸汽发生器实现热量交换、稳压器用于调节压力，它们都属于一回路系统。而汽轮机在二回路系统中，利用一回路产生的蒸汽做功。所以答案选ABD。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529629", "t": 2, "q": "能源经济中的\"需求侧管理\"措施包括下列哪些?（　）", "a": ["推行阶梯电价，引导用户错峰用电", "推广节能灯具，降低终端用电消耗", "发展电动汽车，替代燃油汽车", "实施需求响应，在电网高峰时削减用户负荷", "", ""], "r": "ABD", "e": "需求侧管理是对用电一方实施的管理，目的是提高能源效率、优化用电方式等。A选项阶梯电价引导错峰用电，D选项需求响应削减高峰负荷，都是调节用户用电行为；B选项推广节能灯具降低终端用电消耗，也是从用户端节能。而C选项发展电动汽车替代燃油汽车主要是能源供给端的交通能源结构调整，不属于需求侧管理措施。答案选ABD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529630", "t": 2, "q": "能源与环境经济的\"生命周期评价（LCA）\"可用于分析下列哪些阶段的环境影响?（　）", "a": ["能源资源的开采", "能源的终端使用", "能源的运输和储存", "能源废弃物的处理", "", ""], "r": "ABCD", "e": "生命周期评价涵盖能源从开采到最终处理的整个过程，ABCD选项分别对应能源生命周期的不同阶段。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529631", "t": 2, "q": "能源与环境经济分析中，\"生命周期评价（LCA）\"需涵盖的阶段包括下列哪些（　）?", "a": ["能源消费阶段（如用户使用电能）", "能源运输阶段（如煤炭运输、电力输送）", "能源生产阶段（如电厂建设、机组运行）", "能源资源开采阶段（如煤炭开采、光伏组件原材料提取）", "", ""], "r": "ABCD", "e": "生命周期评价 LCA 覆盖全生命周期，包含资源开采、能源生产、运输、终端消费使用各阶段，完整核算全过程环境影响。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529632", "t": 2, "q": "能源与环境经济分析中，下列哪些指标可用于评估\"能源可持续性\"?（　）", "a": ["单位GDP二氧化碳排放量", "能源运输过程中的损耗率", "能源储备量与能源消费量的比值（储采比）", "能源生产过程中的水资源消耗量", "", ""], "r": "ABCD", "e": "A. 单位GDP二氧化碳排放量<br />该指标属于环境维度中“气候变化”的子指标，用于衡量能源活动产生的温室气体排放强度，是评估能源系统对气候影响的核心指标之一 。较低的碳排放强度通常意味着更高的能源可持续性。<br />B. 能源运输过程中的损耗率 <br />该指标属于经济维度中“供应效率”的子指标，反映能源转换和输送系统的效率。损耗率越低，能源利用效率越高，有助于减少资源浪费，是评估能源可持续性的重要经济指标 。<br />C. 能源储备量与能源消费量的比值（储采比） <br />该指标属于经济维度中“资源安全”的子指标，衡量能源资源的可开采年限与消费速度之间的关系，反映能源供给的长期安全性，是评估能源可持续性的关键资源指标 。<br />D. 能源生产过程中的水资源消耗量 <br />该指标属于环境维度中“水资源”的子指标，评估能源系统对水资源的消耗与污染影响，是能源-水耦合关系（Water-Energy Nexus）的核心考量 。高水资源消耗可能加剧地区水资源紧张，降低可持续性。", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529633", "t": 2, "q": "能源与环境经济中的\"外部成本\"是指由能源生产消费带来但未计入市场价格的成本，下列哪些属于能源的\"环境外部成本\"?（　）", "a": ["核电乏燃料处理的政府补贴成本", "燃煤发电导致的酸雨对农作物的损害成本", "光伏组件生产导致的重金属污染治理成本", "石油开采导致的海洋污染清理成本", "", ""], "r": "BCD", "e": "环境外部成本是能源生产消费带来且未计入市场价格的成本。B中燃煤发电导致酸雨对农作物损害、C中光伏组件生产致重金属污染治理、D中石油开采致海洋污染清理，这些都是能源生产消费带来的环境损害及治理成本且未计入市场价格；A中核电乏燃料处理政府补贴成本不属于环境方面。答案：BCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529634", "t": 2, "q": "生物质发电的\"环保措施\"中，针对\"固废处理\"的措施包括下列哪些（　）?", "a": ["生物质灰分还田（作为肥料）", "炉渣综合利用（如制建材）", "脱硫石膏回收（用于制石膏板）", "活性炭再生利用（用于再次吸附）", "", ""], "r": "ABC", "e": "固废指固体废弃物，A是对生物质灰分这种固废进行还田处理；B是对炉渣固废综合利用；C是对脱硫石膏固废回收利用。而D活性炭再生利用主要针对吸附剂的循环使用，并非典型的固废处理措施。答案：ABC", "ap": [false, false, false, false, false, false]}, {"id": "2034800292037529635", "t": 2, "q": "生物质发电的\"燃料预处理系统\"包括下列哪些工序?（　）", "a": ["生物质燃料的燃烧", "生物质原料的气化", "生物质成型燃料的压制", "生物质原料的干燥", "", ""], "r": "CD", "e": "答案：CD生物质发电的“燃料预处理系统”主要涉及对生物质原料进行预处理，以便于后续的燃烧或气化过程。选项C“生物质成型燃料的压制”和选项D“生物质原料的干燥”均属于生物质燃料预处理的工序。压制是为了提高燃料的密度和燃烧效率，而干燥则是为了去除原料中的水分，提高其热值。相比之下，选项A“生物质燃料的燃烧”是预处理之后的过程，不属于预处理系统；选项B“生物质原料的气化”虽然也是一种处理方式，但它更多地关联于生物质能的转换过程，而非直接的燃料预处理工序。", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351808", "t": 3, "q": "波浪能的能量密度与波浪的高度平方成正比，与波浪周期无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "波浪能能量密度与波浪高度平方和波浪周期都有关。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351809", "t": 3, "q": "潮汐能发电站的\"坝体\"设计需考虑海水腐蚀和潮汐冲击力，因此通常采用混凝土重力坝，其抗腐蚀和抗冲击性能优于土石坝。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "潮汐能发电站所处环境特殊，海水有腐蚀性且潮汐有冲击力，混凝土重力坝在抗腐蚀和抗冲击方面比土石坝更具优势，所以设计上常采用混凝土重力坝。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351810", "t": 3, "q": "潮汐能发电站的\"单库单向式\"布置方式，由于仅能在落潮时发电，因此其年发电量通常低于\"单库双向式\"布置方式。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "单库单向式只在落潮或涨潮时发电，发电时间受限；单库双向式涨潮、落潮都能发电，发电时间长，所以年发电量通常单库单向式低于单库双向式。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351811", "t": 3, "q": "潮汐能发电站的\"单库双向式\"比\"单库单向式\"的年发电量更高，因为其在涨潮和落潮两个方向都能发电。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“单库双向式”潮汐能发电站能利用涨潮和落潮两个方向的水流发电，相比“单库单向式”只在涨潮或落潮一个方向发电，可利用的能量更多，年发电量通常更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351812", "t": 3, "q": "潮汐能发电站的\"单库双向型\"电站可在涨潮和落潮时均发电，其年发电量通常是\"单库单向型\"电站的两倍左右。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“单库双向型”潮汐能发电站能在涨潮和落潮时都发电，而“单库单向型”只在涨潮或落潮一个过程发电，所以“单库双向型”年发电量通常约是“单库单向型”的两倍。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351813", "t": 3, "q": "潮汐能发电站的发电功率主要取决于潮差和水库的有效库容，与涨落潮的周期无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "潮汐能发电功率与潮差、水库有效库容以及涨落潮周期都有关，涨落潮周期影响着能量转换的时间频率等，所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351814", "t": 3, "q": "多能互补冷热电多联供系统采用\"离网运行模式\"时，系统的可靠性完全依赖于内部能源设备和储能装置，不受外部电网故障的影响。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "离网运行模式下系统与外部电网断开，其运行依靠内部能源设备和储能装置，确实不受外部电网故障影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351815", "t": 3, "q": "多能互补冷热电多联供系统的\"能源梯级利用\"是指将高品位能源（如燃气轮机排气余热）用于发电，中品位能源用于供热，低品位能源用于供冷，以提高能源利用效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "这一说法正确。能源梯级利用就是按能源品位高低，将高、中、低品位能源分别用于发电、供热、供冷等，多能互补冷热电多联供系统采用此方式可提高能源利用效率。  ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351816", "t": 3, "q": "多能互补冷热电多联供系统中，\"溴化锂制冷机组\"的COP（性能系数）随热源温度的升高而降低，因此应尽量降低热源温度以提高COP。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "溴化锂制冷机组的COP随热源温度升高而升高，并非降低，所以不能降低热源温度来提高COP。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351817", "t": 3, "q": "多能互补冷热电多联供系统中，“以电定热”模式是指根据用户的电能需求调整系统出力，多余的热量通过余热利用设备提供给用户，当电能需求降低时，供热量也随之减少。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "“以电定热”就是按用户电能需求来调整系统出力，多余热通过余热利用设备供用户，电需求降低供热也会减少，该描述符合其模式特点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351818", "t": 3, "q": "多能互补冷热电多联供系统中，采用\"风光储\"组合时，光伏和风电的出力波动性可通过储能系统平抑，因此系统无需与电网连接即可实现稳定供电。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "尽管“风光储”组合能利用储能平抑光伏和风电的出力波动，但储能系统容量有限，难以完全应对极端天气等特殊情况，且储能充放电也有约束，所以系统仍需与电网连接以保障稳定供电。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351819", "t": 3, "q": "多能互补冷热电多联供系统中，储能系统的充放电深度越深，储能电池的寿命越长，因此应尽量使储能系统在满充满放状态下运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "一般情况下，储能电池充放电深度越深，其寿命越短，并非越长，所以不应尽量使储能系统在满充满放状态下运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351820", "t": 3, "q": "多能互补冷热电多联供系统中，当燃气轮机的发电效率提高时，系统的整体能源利用效率一定会同步提高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多能互补冷热电多联供系统整体能源利用效率受多种因素影响，燃气发电效率提高只是其中一方面，若其他环节（如余热回收等）表现不佳，整体能源利用效率不一定同步提高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351821", "t": 3, "q": "多能互补冷热电三联供系统的\"能源利用效率\"一定高于单一能源供电或供热系统，因为其实现了能源的梯级利用。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多能互补冷热电三联供系统通过能源梯级利用，将不同品位的能源合理分配用于发电、制冷、供热等，减少了能源浪费，所以能源利用效率通常高于单一能源供电或供热系统。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351822", "t": 3, "q": "多能互补冷热电三联供系统中，当电网停电时，系统可自动切换为\"离网运行\"模式，继续为用户供应冷、热、电负荷。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "多能互补冷热电三联供系统通常具备在电网停电时自动切换到“离网运行”模式的能力，从而持续给用户提供冷、热、电负荷。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351823", "t": 3, "q": "多能互补冷热电三联供系统中，当热负荷需求减少时，可通过降低燃气轮机的出力，减少余热产生，无需调整其他能源设备的运行状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多能互补冷热电三联供系统是多种能源相互配合的复杂系统，热负荷需求减少仅降低燃气轮机出力，可能无法维持系统整体的能量平衡和稳定运行，往往需要调整其他能源设备运行状态。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351824", "t": 3, "q": "多能互补系统中，光伏电站和风力发电机的出力波动可通过蓄电池储能系统完全消除，确保系统输出功率稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "光伏电站和风力发电机出力受自然条件影响有波动，蓄电池储能系统虽能调节部分功率波动，但受其容量、充放电特性等限制，无法完全消除波动确保系统输出功率稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351825", "t": 3, "q": "多能互补系统中，能源梯级利用的关键是将所有高品位能源优先转化为电能，再用于满足各类用能需求。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "能源梯级利用关键是按能源品位高低合理利用，并非将所有高品位能源优先转化为电能，这样会造成能源浪费。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351826", "t": 3, "q": "风力发电机组的\"变桨距控制\"在风速低于额定风速时，通常将叶片角度调整至最大风能捕获位置（即0度左右），以最大化风能吸收。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "变桨距控制中，风速低于额定风速时，把叶片角度调至最大风能捕获位置（约0度）可让叶片获风面积大，实现风能吸收最大化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351827", "t": 3, "q": "风力发电机组的\"齿轮箱\"采用飞溅润滑方式，当机组转速低于额定转速时，润滑效果最佳，当转速高于额定转速时，润滑效果下降。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "飞溅润滑是靠旋转部件将油溅起润滑，转速低时油飞溅不充分，润滑效果差，转速高时能更好地将油溅到各部位，润滑效果好。所以题干说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351828", "t": 3, "q": "风力发电机组的\"齿轮箱\"主要作用是将风轮的低转速、高扭矩机械能转换为发电机的高转速、低扭矩机械能，齿轮箱的传动比通常为1:50-1:100。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "风力发电机组齿轮箱确实是把风轮低转速、高扭矩机械能转变为发电机高转速、低扭矩机械能，且传动比一般在1:50 - 1:100。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351829", "t": 3, "q": "风力发电机组的\"发电机\"采用永磁同步发电机时，无需励磁系统，可直接将机械能转化为电能，且发电效率高于异步发电机。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "永磁同步发电机依靠永磁体产生磁场，无需励磁系统，能把机械能转化为电能，且相比异步发电机，其发电效率更高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351830", "t": 3, "q": "风力发电机组的\"高速轴制动器\"通常采用盘式制动器，其制动力矩大于低速轴制动器，主要用于机组紧急停机时的快速制动。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351831", "t": 3, "q": "风力发电机组的\"偏航误差\"是指风轮轴线与实际风向的夹角，偏航误差越大，机组捕获的风能越少，发电效率越低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "偏航误差就是风轮轴线和实际风向夹角，夹角大时风轮不能很好正对风向，捕获风能少，发电效率低。", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351832", "t": 3, "q": "风力发电机组的\"切出风速\"是指机组开始并网发电的最低风速，低于该风速时机组停止运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "风力发电机组“切出风速”是指风电机组因安全等原因需脱离电网停止运行的最高风速，而机组开始并网发电的最低风速是“切入风速”。", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351833", "t": 3, "q": "风力发电机组的\"切出风速\"是指机组开始发电的最低风速，当风速低于切出风速时，机组停止运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“切出风速”是指风力发电机组达到最大允许功率时的风速，当风速超过切出风速，机组会停止运行；而机组开始发电的最低风速是“切入风速”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351834", "t": 3, "q": "风力发电机组的\"切入风速\"是指机组开始并网发电的最低风速，\"切出风速\"是指机组因安全原因停止发电的最高风速，切入风速一定小于切出风速。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "切入风速是机组开始发电的最低风速，切出风速是因安全需停机的最高风速，从实际运行逻辑看，开始发电的风速必然低于因安全要停机的风速。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351835", "t": 3, "q": "风力发电机组的\"主轴\"的作用是将风轮的旋转机械能传递给齿轮箱，再由齿轮箱传递给发电机。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "主轴是风力发电机组的重要部件，其主要功能就是把风轮旋转产生的机械能传递给齿轮箱，然后经齿轮箱增速后传递给发电机。所以该描述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351836", "t": 3, "q": "风力发电机组的齿轮箱采用\"油浴润滑\"方式，其润滑油的黏度随温度升高而增大，因此需设置冷却系统控制油温。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "该说法错误。通常润滑油黏度随温度升高而减小，而非增大。风力发电机组齿轮箱设冷却系统是因工作中产生热量，为保证润滑油性能和齿轮箱正常运行才控制油温。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351837", "t": 3, "q": "风力发电机组的偏航系统采用\"主动偏航\"方式，即无论风速大小，始终驱动机舱对准风向，以确保风轮捕获最大风能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "主动偏航仅在风向偏差达到设定阈值时才执行对风，并非无论风速大小始终强制对准风向；大风工况下还会主动偏航解耦保护机组，题干描述错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351838", "t": 3, "q": "风力发电机组在低风速运行时，采用变速恒频控制策略，通过调节发电机转速，使风轮始终运行在最佳叶尖速比，以最大化风能捕获效率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "变速恒频控制可在低风速时调节发电机转速，让风轮保持最佳叶尖速比，从而提高风能捕获效率。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351839", "t": 3, "q": "海流能的能量密度与海流速度的三次方成正比，因此海流速度的微小增加会导致海流能能量密度大幅提升。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "根据海流能能量密度与海流速度三次方成正比的关系，速度变化对能量密度影响呈指数放大，所以海流速度微小增加会使能量密度大幅提升。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351840", "t": 3, "q": "海流能发电装置的\"安装成本\"远低于风力发电机组，因为海流能装置位于水下，不受风浪影响，结构简单。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "此说法错误。实际上海流能发电装置的安装成本远高于风力发电机组。海流能装置工作环境复杂，要在水下安装和维护，面临诸多困难，技术要求高，成本也高，并非结构简单、成本低。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351841", "t": 3, "q": "海洋能中的\"波浪能\"具有能量密度高、稳定性好的特点，因此波浪能发电是目前海洋能中商业化应用最广泛的技术。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "波浪能能量密度低且稳定性差。目前海洋能中商业化应用最广泛的是潮汐能发电，而非波浪能发电。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351842", "t": 3, "q": "海洋能中的\"潮流能\"是由于潮汐涨落导致海水水平流动产生的能量，其发电原理与风力发电相似，均通过旋转式水轮机将动能转化为电能。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "潮流能确实是因潮汐涨落使海水水平流动产生的能量，且发电时和风力发电类似，都是通过旋转装置把动能转化为电能，潮流能是用旋转式水轮机。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351843", "t": 3, "q": "海洋能中的\"温差能\"发电是利用海水表层与深层之间的温度差（通常表层温度高于深层），通过热机将热能转化为电能，该技术不受昼夜和季节影响。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351844", "t": 3, "q": "海洋能中的波浪能能量密度通常高于潮汐能和潮流能，因此波浪能发电装置的单位功率占地面积更小。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "一般情况下波浪能能量密度高，意味着在获取相同功率时，所需装置规模相对较小，单位功率占地面积也就更小。", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351845", "t": 3, "q": "核电站的\"安全壳\"是第三道安全屏障，其主要作用是在反应堆发生严重事故时，防止放射性物质向环境泄漏，且安全壳通常采用钢筋混凝土结构，内衬钢衬里。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "核电站有三道安全屏障，安全壳是第三道，能在严重事故时防放射性物质泄漏，一般用钢筋混凝土结构且内衬钢衬里。", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351846", "t": 3, "q": "核电站的\"安全注入系统\"属于纵深防御体系的第一道屏障，其作用是在燃料包壳破损时，向堆芯注入冷却水，防止放射性物质释放。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“安全注入系统”是纵深防御体系的第三道屏障，不是第一道。其作用是在一回路发生失水事故时，向堆芯注入冷却水，防止堆芯因失水而熔化，避免放射性物质大量释放。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351847", "t": 3, "q": "核电站的\"安全注射系统\"在发生一回路大破口失水事故时，会向堆芯注入高压冷却水，其主要目的是防止堆芯熔化。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "核电站一回路大破口失水事故很危险，堆芯会因失去冷却而升温，安全注射系统注入高压冷却水可带走热量，避免堆芯温度过高熔化。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351848", "t": 3, "q": "核电站的\"乏燃料\"具有强放射性，需在核电站内的乏燃料水池中冷却至少10年后，才能运输至永久处置场。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "核电站“乏燃料”有强放射性，在核电站内乏燃料水池冷却一段时间可降低放射性和温度，通常需冷却至少10年才适合运输至永久处置场。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351849", "t": 3, "q": "核电站的\"放射性废物处理系统\"仅处理液体放射性废物，不处理气体和固体放射性废物。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。核电站的“放射性废物处理系统”会处理液体、气体和固体这三种形态的放射性废物，以确保放射性物质得到安全妥善处置，避免对环境和人体造成危害。所以答案为“错误”。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351850", "t": 3, "q": "核电站的\"控制棒\"在反应堆启动时全部拔出，在反应堆正常运行时部分插入，在反应堆停堆时全部插入。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351851", "t": 3, "q": "核电站的\"控制棒\"主要由吸收中子能力强的材料（如镉、硼）制成，其作用是通过插入或拔出堆芯，调节反应堆的中子通量，进而控制核反应速率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "控制棒的确是由吸收中子能力强的材料制成，通过改变在堆芯的插入或拔出程度，改变吸收中子数量，以此调节反应堆中子通量，达到控制核反应速率的目的。", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351852", "t": 3, "q": "核电站的\"汽轮机\"与火电站的汽轮机结构相同，均可使用饱和蒸汽或过热蒸汽驱动，因此二者可互换使用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "核电站和火电站的汽轮机虽有相似处，但由于核电站蒸汽含放射性等特殊情况，不能简单互换使用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351853", "t": 3, "q": "核电站的\"稳压器\"属于一回路系统，其主要功能是维持一回路系统的压力稳定，防止系统压力过高或过低。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "核电站一回路系统包含稳压器，它的核心作用就是保持一回路系统压力稳定，避免压力异常。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351854", "t": 3, "q": "核电站的\"余热排出系统\"仅在反应堆正常停堆后运行，用于排出堆芯的衰变热，当发生事故时，该系统停止运行，由应急堆芯冷却系统替代。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "余热排出系统不仅在正常停堆后运行排出堆芯衰变热，在一些事故工况下也能运行，并非事故时就停止运行。", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351855", "t": 3, "q": "核电站的\"蒸汽发生器\"中，一回路的冷却剂和二回路的水直接接触，进行热量交换，以提高传热效率。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "核电站蒸汽发生器中一回路冷却剂和二回路的水是通过管壁间接传热，并非直接接触，直接接触会使二回路水被放射性物质污染。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351856", "t": 3, "q": "聚光型太阳能热发电系统中，聚光比越高，系统能达到的最高温度越高，因此聚光比越大，系统的发电效率一定越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "聚光比增大虽能使系统达到更高温度，但发电效率还受其他因素如热损失、能量转换效率等影响，并非聚光比越大发电效率就一定越高。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800293199351857", "t": 3, "q": "能源环境经济分析中，“碳足迹”是指某一产品或活动在全生命周期内直接和间接产生的碳排放总量，其计算范围不包括原材料运输过程的碳排放。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“碳足迹”计算范围包含原材料运输过程的碳排放等全生命周期内直接和间接产生的碳排放。所以题干表述错误。 ", "ap": [false, false, false, false, false, false]}]}, {"k": "基础练习题【含解析】||第7章 新能源与可持续能源技术（2）", "n": "基础练习题【含解析】 / 第7章 新能源与可持续能源技术（2）", "qs": [{"id": "2034800295736905728", "t": 1, "q": "生物质气化发电过程中，为去除气化气中的焦油（避免堵塞管道和损坏燃气轮机），下列哪种净化技术兼具高效除焦油和回收能量的特点?", "a": ["低温冷凝法", "干式过滤法", "催化裂解法", "水洗法", "", ""], "r": "C", "e": "催化裂解法可将焦油裂解成小分子可燃气体，既能高效除焦油，又能回收能量。低温冷凝法主要是冷凝焦油但难以有效回收能量；干式过滤法只是物理过滤焦油；水洗法会产生废水且能量回收差。答案：C", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905729", "t": 1, "q": "生物质气化发电系统中，以下哪种气化炉类型因采用高温熔融渣排渣方式，能有效减少焦油生成且适合处理高灰分生物质原料?", "a": ["气流床气化炉", "固定床气化炉", "循环流化床气化炉", "流化床气化炉", "", ""], "r": "A", "e": "气流床气化炉采用高温熔融渣排渣方式，高温能有效减少焦油生成，且适合处理高灰分生物质原料。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905730", "t": 1, "q": "生物质气化发电中，\"气化剂\"的选择直接影响气化气成分和热值，下列哪种气化剂能产生最高热值的气化气（合成气）?", "a": ["水蒸气", "氧气", "二氧化碳", "空气", "", ""], "r": "B", "e": "氧气作为气化剂时，能使生物质充分反应，减少氮气等稀释气体的混入，生成的合成气中可燃成分比例高，所以能产生最高热值的气化气。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905731", "t": 1, "q": "生物质气化发电中，下列哪种气化剂的使用会导致气化气中氮气含量较高，从而降低可燃气体浓度?", "a": ["水蒸气", "氧气", "二氧化碳", "空气", "", ""], "r": "D", "e": "空气中约含78%的氮气，用空气作气化剂会使大量氮气混入气化气中，降低可燃气体浓度。其他选项不含大量氮气。答案：D", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905732", "t": 1, "q": "生物质直燃发电锅炉中，为解决生物质燃料（如秸秆）燃烧时易结渣的问题，下列哪种锅炉结构设计最有效?", "a": ["增大炉膛容积热负荷", "采用循环流化床燃烧方式", "减小二次风配比", "采用膜式水冷壁", "", ""], "r": "B", "e": "循环流化床燃烧方式能使燃料在炉内充分流化燃烧，温度分布均匀，可有效避免局部高温，从而减少结渣现象。增大炉膛容积热负荷会使局部温度升高易结渣；减小二次风配比不利于充分燃烧也可能导致结渣；膜式水冷壁主要作用不是解决结渣问题。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905733", "t": 1, "q": "生物质直燃发电系统中，下列哪种设备的作用是将生物质燃料破碎、干燥后，均匀输送至锅炉炉膛，且需具备防堵塞和防回火功能?", "a": ["引风机", "给料机", "省煤器", "空气预热器", "", ""], "r": "B", "e": "给料机的作用就是把生物质燃料破碎、干燥后均匀送进锅炉炉膛，并且要具备防堵塞和防回火功能。引风机主要是引导烟气流动；省煤器是利用烟气余热加热给水；空气预热器是预热空气。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905734", "t": 1, "q": "水力发电机组的\"励磁系统\"在电网电压降低时，应采取的核心调节措施是?", "a": ["增大励磁电流，提高发电机端电压", "减小励磁电流，降低发电机端电压", "增大导叶开度，提高机组出力", "减小导叶开度，降低机组出力", "", ""], "r": "A", "e": "电网电压降低时，需提高发电机端电压来维持稳定。增大励磁电流可增强磁场，进而提高发电机端电压。C选项增大导叶开度主要影响水轮机出力；B、D选项操作与提升电压需求不符。答案是A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905735", "t": 1, "q": "水力发电机组在进行负荷调整时，若电网频率升高且需快速降低机组出力，下列调节方式中哪项是基于水轮机调速系统\"动态特性\"的核心操作?", "a": ["增大导叶开度", "减小导叶开度", "调节励磁电流", "开启泄水阀", "", ""], "r": "B", "e": "电网频率升高需降低机组出力，水轮机调速系统通过减小导叶开度减少进入水轮机的水量，降低水轮机转速从而降低出力，这是基于其动态特性的核心操作。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905736", "t": 1, "q": "水力发电水轮机的\"比转速\"是反映水轮机性能的重要参数，下列关于比转速与水轮机类型匹配的说法正确的是?", "a": ["混流式水轮机比转速高于轴流式水轮机", "轴流式水轮机比转速高于冲击式水轮机", "比转速高的水轮机适合高水头、小流量工况", "冲击式水轮机比转速高于混流式水轮机", "", ""], "r": "B", "e": "比转速大小排序一般为轴流式＞混流式＞冲击式。比转速高适合低水头、大流量工况。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905737", "t": 1, "q": "水力发电系统中，调速器的主要作用是通过调节导水机构开度控制水轮机流量，其动态调节过程需满足\"暂态转差率\"指标，该指标的主要意义是以下哪一项?", "a": ["减少导水机构的动作次数", "防止机组甩负荷时转速过度升高", "确保多台机组并联运行时的负荷分配均匀", "保证机组在负荷变化时的转速稳定速度", "", ""], "r": "B", "e": "暂态转差率主要是为避免机组甩负荷时因水轮机流量不能瞬间调整，导致转速过度升高。答案：B", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905738", "t": 1, "q": "水力发电站的\"厂房布置\"中，下列哪种布置方式适用于水头较高（如大于100m）、流量较小的水电站，且能减少厂房开挖量?", "a": ["坝后式厂房", "河床式厂房", "地下厂房", "引水式厂房", "", ""], "r": "D", "e": "引水式厂房依靠引水隧洞取得高水头，适合高水头、小流量电站，厂房远离大坝，可减少大坝部位开挖量；坝后式多用于中高水头大流量；河床式适用于低水头大流量；地下厂房开挖工程量大。", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905739", "t": 1, "q": "水力发电站的\"流域梯级开发\"中，以下哪项不是梯级电站联合调度的主要目标?", "a": ["协调防洪与发电的矛盾", "减少单个电站的装机容量", "提高整个流域的水能利用率", "保障下游河道生态流量", "", ""], "r": "B", "e": "梯级电站联合调度是为了更好地利用水资源，实现综合效益。协调防洪与发电、提高水能利用率、保障下游生态流量都是常见目标。而减少单个电站装机容量并非联合调度主要目标，联合调度通常是要优化整体效益，不是降低单个电站装机。答案选B。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905740", "t": 1, "q": "水力发电站的\"尾水管\"的主要作用是?", "a": ["回收水轮机出口水流的剩余能量，提高水轮机效率", "调节水轮机的进水流量", "将水轮机排出的水流引至下游河道", "过滤水流中的杂质，保护水轮机", "", ""], "r": "A", "e": "尾水管可使水轮机出口处形成静力真空，回收水轮机出口水流剩余能量，提高水轮机效率。B项调节进水流量一般是通过导水机构；C项虽有引水流至下游作用，但不是主要作用；D项尾水管无过滤杂质功能。答案选A。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800295736905741", "t": 1, "q": "水力发电站的调速系统中，下列哪种调节方式适用于负荷变化幅度大且变化速度快的工况，能快速改变水轮机流量?", "a": ["混流式水轮机导叶调节", "冲击式水轮机折向器调节", "双调速器调节", "单调速器调节", "", ""], "r": "C", "e": "双调速器调节能更好应对负荷变化幅
