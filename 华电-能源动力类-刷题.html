断重点包括哪些?", "a": ["线路周边树木生长情况（影响安全）", "线路功率损耗", "线路电压降落", "线路绝缘性能", "", ""], "r": "ABCD", "e": "ABCD四个选项都是输变电线路运行中需重点关注的方面。树木生长影响安全，功率损耗和电压降落关系到输电效率，绝缘性能影响线路运行安全。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516296", "t": 2, "q": "能源系统运行中，\"节能诊断\"需重点排查的高耗能环节有哪些（　）?", "a": ["能源传输管网（常存在泄漏、散热损失）", "工业窑炉、锅炉等加热设备（常存在余热未回收）", "空调、制冷设备（常存在负荷与输出不匹配）", "照明设备（常存在低效灯具或过度照明）", "", ""], "r": "ABCD", "e": "ABCD选项所涉及的能源传输管网、加热设备、空调制冷设备、照明设备在能源系统运行中都易出现高耗能问题，是节能诊断需重点排查的高耗能环节。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516297", "t": 2, "q": "能源系统运行中，\"紧急停机\"的触发条件包括哪些（　）?", "a": ["能源系统发生重大泄漏（如蒸汽、燃气泄漏）", "能源设备出现超温、超压、超速等危及安全的参数", "周边环境出现火灾、地震等突发事件", "能源系统出现短路、接地等电气故障", "", ""], "r": "ABCD", "e": "ABCD选项情况均会严重威胁能源系统安全运行，所以都可触发紧急停机。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516298", "t": 2, "q": "能源系统运行中，影响系统能效的主要运行参数包括（　）", "a": ["监测仪表的精度等级", "设备的负荷率（如锅炉负荷率、机组负荷率）", "系统的冗余容量（冗余过大可能导致设备低负荷运行）", "设备的启停次数（频繁启停增加能耗）", "", ""], "r": "BCD", "e": "设备负荷率、系统冗余容量、设备启停次数都直接与能源系统运行能效相关，而监测仪表精度等级主要影响数据测量准确性，与系统能效本身无直接关联。答案：BCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516299", "t": 2, "q": "能源系统诊断中，“节能潜力计算”的方法包括哪些（　）?", "a": ["经验估算法（根据同类项目的节能效果估算）", "能平衡法（总损失量-不可避免损失量=节能潜力）", "设备测试法（改造前能耗-改造后能耗=节能潜力）", "模拟计算法（通过软件模拟节能改造后的能耗降低量）", "", ""], "r": "ABCD", "e": "节能潜力计算方法多样，经验估算法依据同类项目节能效果估算；能平衡法通过总损失量与不可避免损失量差值算节能潜力；设备测试法对比改造前后能耗得出节能潜力；模拟计算法借助软件模拟节能改造后能耗降低量。ABCD 四个选项均是常见的节能潜力计算方法。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516300", "t": 2, "q": "能源系统诊断中，\"能平衡分析法\"的主要分析步骤包括哪些（　）?", "a": ["绘制能源流动路径图（能流图）", "预测系统未来的能源需求", "收集系统内各环节的能源输入与输出数据", "确定能平衡的系统边界（如某车间、某厂区）", "", ""], "r": "ACD", "e": "能平衡分析法首先要确定系统边界，然后绘制能流图，接着收集各环节能源输入输出数据。而预测系统未来能源需求并非能平衡分析法主要步骤。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516301", "t": 2, "q": "区域能源系统规划中，能源站的建设规模确定需考虑的因素有（　）", "a": ["周边已有的能源供应设施容量", "区域内的最大能源负荷", "能源负荷的增长趋势", "可再生能源的本地可开发量", "", ""], "r": "ABCD", "e": "能源站建设规模要综合多方面因素。周边已有能源供应设施容量影响新建能源站规模；区域内最大能源负荷直接决定能源站需满足的供应能力；能源负荷增长趋势关系到能源站后续的适应性；可再生能源本地可开发量也会限制能源站规模。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516302", "t": 2, "q": "区域综合能源系统规划设计中，需考虑的能源耦合设备包括哪些?", "a": ["吸收式制冷机（热-冷耦合）", "变压器（电-电变压）", "燃气轮机（电-热耦合）", "热泵（电-热/冷耦合）", "", ""], "r": "ACD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516303", "t": 2, "q": "在节能技术选择中，符合\"源头减量-过程优化-末端回收\"节能原则的技术有哪些（　）?", "a": ["照明设备采用LED灯替代白炽灯（源头减量）", "工业炉窑采用低热值燃料替代高热值燃料（源头减量）", "蒸汽管网采用高效保温材料减少热损失（过程优化）", "风机采用变频调速技术调节出力（过程优化）", "", ""], "r": "ACD", "e": "“源头减量 - 过程优化 - 末端回收”节能原则，A是在源头用更节能的LED灯替代白炽灯减少能耗；B用低热值燃料替代高热值燃料并非源头减量，会影响使用效果等；C用高效保温材料减少蒸汽管网热损失是对过程进行优化；D风机采用变频调速技术调节出力也是对运行过程进行优化。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516304", "t": 2, "q": "智慧能源系统的\"边缘计算\"技术优势体现在哪些方面?", "a": ["提升系统抗网络中断能力", "减少数据向云端传输的延迟", "降低云端数据存储压力", "实现本地实时控制决策", "", ""], "r": "ABCD", "e": "边缘计算是在靠近物或数据源头的一侧，采用网络、计算、存储、应用核心能力为一体的开放平台，就近提供最近端服务。可减少数据上传云端的延迟，降低云端存储压力，还能在本地实时决策控制，且在网络中断时仍可依靠本地处理保证一定运行，提升抗网络中断能力。ABCD四个选项均是其优势体现。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516305", "t": 2, "q": "智慧能源系统的\"数字孪生\"技术应用包括哪些?", "a": ["未来运行场景预测与优化", "设备物理参数直接测量", "能源系统虚拟建模与仿真", "运行状态实时映射与监控", "", ""], "r": "ACD", "e": "数字孪生是利用数字化技术创建物理实体的虚拟模型，对其进行实时映射、仿真和优化。A选项可基于虚拟模型进行未来场景预测优化；C选项是数字孪生基础，构建虚拟模型并仿真；D选项能实现运行状态实时映射与监控。而B选项设备物理参数直接测量并非数字孪生技术应用核心内容。答案：ACD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516306", "t": 2, "q": "智慧能源系统的核心技术构成包括哪些（　）?", "a": ["大数据分析技术（能源数据处理与挖掘）", "人工智能（AI）技术（智能决策与优化）", "区块链技术（能源交易与数据溯源）", "物联网（IoT）技术（设备互联与数据采集）", "", ""], "r": "ABCD", "e": "智慧能源系统需对能源数据处理、设备互联、智能决策及交易溯源等多方面实现智能化管理，ABCD四个选项的技术分别在数据处理、智能决策、交易溯源、设备互联和数据采集方面发挥核心作用，都是其核心技术构成。答案选ABCD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516307", "t": 2, "q": "智慧能源系统的核心技术特征包括（　）", "a": ["数据驱动的智能决策", "基于数字孪生的系统仿真", "完全依赖人工操作的运行模式", "需求响应的灵活互动", "", ""], "r": "ABD", "e": "智慧能源系统强调智能化、自动化和灵活互动，依靠数据和技术实现高效运行。A项数据驱动决策、B项数字孪生仿真、D项需求响应互动都是其核心特征。而C项完全依赖人工操作不符合智慧能源系统“智慧”的特点。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516308", "t": 2, "q": "智慧能源系统中，\"数字孪生\"技术的应用场景包括哪些（　）?", "a": ["能源设备的故障模拟与预测（在虚拟系统中模拟故障）", "能源系统的运行状态实时监控（虚拟映射物理系统）", "能源用户的用能行为分析（虚拟用户映射，分析行为）", "能源系统的优化运行方案仿真（在虚拟系统中测试方案）", "", ""], "r": "ABCD", "e": "“数字孪生”是将物理实体在虚拟空间进行映射，可用于故障模拟预测、实时监控、用能行为分析、优化方案仿真等。ABCD四个选项都符合“数字孪生”在智慧能源系统中的应用场景。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516309", "t": 2, "q": "智慧能源系统中，\"需求响应\"的实施方式有哪些（　）?", "a": ["强制型需求响应（如能源紧张时强制限电）", "合约型需求响应（如用户与能源服务商签订响应合约）", "价格型需求响应（如峰谷电价、实时电价）", "技术型需求响应（如智能家居自动调整用电）", "", ""], "r": "BCD", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516310", "t": 2, "q": "智慧能源系统中，\"源网荷储\"各环节的功能包括（　）", "a": ["\"源\":提供能源（如光伏、风电、火电）", "\"荷\":消耗能源（如工业、居民用户）", "\"储\":储存能源（如电池储能、抽水蓄能）", "\"网\":传输与分配能源（如电网、热网、气网）", "", ""], "r": "ABCD", "e": "A 选项，源即能源供应侧，包含各类一次、二次能源，光伏、风电、火电都属于能源供给单元，负责提供能源，表述正确。<br />B 选项，荷即负荷侧，是能源消费主体，工业、居民用户消耗电能热能等能源，表述正确。<br />C 选项，储即储能单元，电池储能、抽水蓄能可以在能源富余时存储，缺能时释放，起到削峰填谷作用，表述正确。<br />D 选项，网是能源输送网络，电网、热网、气网承担能源的传输、分配任务，连接源、储和负荷，表述正确。", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516311", "t": 2, "q": "智慧能源系统中，大数据分析技术的应用场景包括（　）", "a": ["能源系统优化运行（分析多参数找最优运行策略）", "仅用于存储海量能源数据", "设备故障预警（分析设备运行数据找异常）", "用户能源消费行为分析（分析用户用能数据）", "", ""], "r": "ACD", "e": "大数据分析技术在智慧能源系统中作用多样，能用于能源系统优化运行、设备故障预警、用户能源消费行为分析等，并非仅用于存储数据。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516312", "t": 2, "q": "智慧能源系统中，数据安全保障措施包括（　）", "a": ["访问权限分级控制（如管理员、操作员权限区分）", "数据传输加密（如SSL/TLS协议）", "采用防火墙防止外部网络攻击", "定期数据备份与灾难恢复预案", "", ""], "r": "ABCD", "e": "ABCD四个选项均是常见的数据安全保障措施。访问权限分级控制可防止越权操作；数据传输加密能保障传输过程安全；防火墙可抵御外部网络攻击；定期备份和灾难恢复预案可应对数据丢失等情况。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516313", "t": 2, "q": "智慧能源系统中，支撑\"需求响应\"功能的关键技术包括哪些?", "a": ["分布式能源控制技术", "能源价格信号发布技术", "双向通信技术（电网与用户）", "设备故障诊断技术", "", ""], "r": "BC", "e": "智慧能源系统中的“需求响应”功能主要是通过调整用户的能源需求来适应电网的供需平衡。这需要以下关键技术支持：B. 能源价格信号发布技术：通过发布实时的能源价格信号，用户可以根据价格变化调整自己的能源使用行为。C. 双向通信技术（电网与用户）：实现电网与用户之间的实时信息交互，使电网能够及时了解和调整用户的需求。A. 分布式能源控制技术虽然重要，但它主要关注的是分布式能源的管理和调度，并不是直接支撑需求响应功能的关键技术。D. 设备故障诊断技术主要用于设备的维护和故障处理，与需求响应功能的直接关系不大。综上所述，支撑“需求响应”功能的关键技术是B和C。所以，正确答案是BC。", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516314", "t": 2, "q": "智慧能源系统中，自动化控制的实现方式包括（　）", "a": ["基于PLC（可编程逻辑控制器）的逻辑控制", "基于AI算法的智能控制（如自适应控制）", "基于SCADA（监控和数据采集系统）的远程控制", "基于DCS（集散控制系统）的集中控制", "", ""], "r": "ABCD", "e": "这些选项都是智慧能源系统中自动化控制常见实现方式，PLC可实现逻辑控制，AI算法用于智能控制，SCADA能进行远程控制，DCS可做集中控制。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516315", "t": 2, "q": "综合能源系统中，“电-热-冷”多能转换设备包括（　）", "a": ["热泵机组（电转热或热转热）", "电制冷机组（电转冷）", "燃气轮机（气转电）", "储热罐（热的存储，非转换）", "", ""], "r": "AB", "e": "本题问的是“电 - 热 - 冷”多能转换设备，需从选项中找出能实现电、热、冷之间转换的设备。 A选项热泵机组可实现电转热或热转热，涉及电与热的转换。 B选项电制冷机组能实现电转冷，涉及电与冷的转换。 C选项燃气轮机是气转电，未涉及电、热、冷之间的转换。 D选项储热罐只是热的存储，并非转换设备。答案选AB。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516316", "t": 2, "q": "综合能源系统中，\"电-热耦合系统\"的运行优化目标包括哪些（　）?", "a": ["最大化可再生能源消纳量", "满足用户的电、热负荷需求", "最小化系统总能耗", "最小化系统运行成本", "", ""], "r": "ABCD", "e": "“电 - 热耦合系统”运行需考虑多方面，既要充分利用可再生能源、满足负荷需求，又要降低能耗和成本。ABCD四个选项都是该系统运行优化的重要目标。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516317", "t": 2, "q": "综合能源系统中，“多能互补”的实现方式包括哪些?", "a": ["燃气轮机与余热锅炉联动（电-热互补）", "风电与光伏出力互补（平滑间歇性）", "储能系统与可再生能源配合（供需互补）", "单一能源大规模并网（无互补）", "", ""], "r": "ABC", "e": "“多能互补”强调不同能源间相互补充配合。A是电和热互补，B可平滑能源间歇性实现互补，C通过储能实现供需互补。而D单一能源并网不存在能源间互补。答案选ABC。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516318", "t": 2, "q": "综合能源系统中，\"能源存储系统\"的作用包括哪些（　）?", "a": ["减少能源传输损失（存储本地能源，减少远程输送）", "削峰填谷（白天用能高峰放电，夜间低谷充电）", "提高能源系统的供电可靠性（故障时作为备用电源）", "降低能源采购成本（低谷时低价购能存储，高峰时使用）", "", ""], "r": "ABCD", "e": "能源存储系统可存储本地能源减少远距离输送从而减少传输损失；能在白天高峰放电、夜间低谷充电实现削峰填谷；故障时可作备用电源提高供电可靠性；还能低谷低价购能存储、高峰使用以降低采购成本。ABCD选项描述均正确。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516319", "t": 2, "q": "综合能源系统中，储能系统的类型包括（　）", "a": ["电化学储能（如锂电池、钠电池）", "化石能源存储（如煤炭、天然气存储，非储能系统主流类型）", "热能储能（如储热罐、熔盐储能）", "机械储能（如抽水蓄能、飞轮储能）", "", ""], "r": "ACD", "e": "综合能源系统里，电化学、热能、机械储能都属常见储能系统类型；而化石能源存储主要是常规能源存储，并非储能系统主流类型。答案选ACD。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516320", "t": 2, "q": "综合能源系统中，多能互补的实现方式包括（　）", "a": ["可再生能源与化石能源互补（如光伏与燃气轮机发电互补）", "能源供应与储能互补（如风光与储能互补）", "电-冷互补（如电制冷与吸收式制冷切换）", "电-热互补（如电采暖与燃气采暖切换）", "", ""], "r": "ABCD", "e": "多能互补是指不同能源形式相互配合、补充。A选项可再生与化石能源互补、B选项能源供应与储能互补、C选项电冷互补、D选项电热互补都属于多能互补的实现方式。答案：ABCD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516321", "t": 2, "q": "综合能源系统中，可再生能源与储能系统的协同运行策略包括（　）", "a": ["可再生能源出力高峰时，储能系统充电", "储能系统始终处于满电状态以备用", "电网峰段时，储能系统放电以替代电网供电", "电网谷段时，储能系统充电以降低用电成本", "", ""], "r": "ACD", "e": "综合能源系统中，可再生能源与储能系统的协同运行策略主要是为了优化能源的使用效率和降低成本。以下是对各选项的A. 可再生能源出力高峰时，储能系统充电：这种策略可以最大化利用可再生能源的高效时段，将多余的能源储存起来，以备不时之需。B. 储能系统始终处于满电状态以备用：这种做法并不经济，因为储能系统始终满电会减少其使用寿命，并且在非高峰时段可能造成能源的浪费。C. 电网峰段时，储能系统放电以替代电网供电：这可以有效减轻电网负荷，降低高峰时段的电力成本，同时提高能源的自给自足率。D. 电网谷段时，储能系统充电以降低用电成本：在电价较低的谷段充电，可以有效降低整体的电力成本，是一种经济的运行策略。综上所述，正确的协同运行策略应包括在可再生能源出力高峰时充电（A），在电网峰段放电替代供电（C），以及在电网谷段充电降低成本（D）。选项B不是有效的协同策略。所以，正确答案是ACD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516322", "t": 2, "q": "综合能源系统中，实现\"电-热-冷-气\"多能协同优化运行，需考虑的关键约束条件有哪些（　）?", "a": ["可再生能源出力的随机性", "能源管网的最大传输容量", "用户用能的时间刚性需求（如工业生产固定用能时段）", "不同能源介质的传输延迟差异", "", ""], "r": "ABCD", "e": "ABCD四个选项均会对“电 - 热 - 冷 - 气”多能协同优化运行产生影响。可再生能源出力随机影响能源供应；能源管网最大传输容量限制能源输送；用户用能时间刚性需求影响能源分配；不同能源介质传输延迟差异影响协同运行调度。答案：ABCD", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516323", "t": 2, "q": "综合能源系统中，提高可再生能源消纳率的措施有（　）", "a": ["拓展可再生能源的应用场景（如电制氢、电供暖）", "优化\"源网荷储\"协同控制策略", "降低用户的可再生能源使用比例", "配置储能系统存储弃风弃光电能", "", ""], "r": "ABD", "e": "提高可再生能源消纳率需增加利用、合理调控。A拓展应用场景可增加可再生能源使用途径，B优化协同控制策略能让系统更高效利用能源，D配置储能可存储多余电能避免浪费。而C降低使用比例与提高消纳率相悖。答案：ABD ", "ap": [false, false, false, false, false, false]}, {"id": "2034800357141516324", "t": 2, "q": "综合能源项目中，\"多能互补\"的实现方式有哪些（　）?", "a": ["电网供电与储能设备放电互补（应对峰谷负荷）", "地热能与太阳能互补（保障供热连续性）", "生物质能与煤炭混合燃烧（降低化石能源消耗）", "风电与光伏互补（平抑出力波动）", "", ""], "r": "ABD", "e": "综合能源项目中的“多能互补”旨在通过多种能源形式的协同作用，提高能源系统的稳定性和效率。我们逐项分析：A项：电网供电与储能设备放电互补，这是常见的多能互补方式。在电力需求低谷时，储能设备充电；在高峰时放电，以平衡电网负荷。这有助于应对峰谷负荷变化，提高电力系统的稳定性。B项：地热能与太阳能互补，地热能提供稳定的基础热能，而太阳能则根据天气和季节变化提供额外的热能。两者结合可以保障供热的连续性，减少单一能源供应的风险。C项：生物质能与煤炭混合燃烧，虽然可以降低化石能源的消耗，但这并不属于“多能互补”的典型方式。因为这种方式主要关注的是能源类型的替换，而不是多种能源形式之间的协同互补。D项：风电与光伏互补，风电和光伏都是可再生能源，但它们的出力受天气和季节影响较大。通过合理的配置和控制策略，可以实现两者的优势互补，平抑出力波动，提高电力系统的稳定性。综上所述，正确答案是ABD。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751872", "t": 3, "q": "能源系统运行监测中，多能协同监测架构的核心是将电、热、冷、气等监测系统独立运行，再汇总数据。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多能协同监测架构核心是打破电、热、冷、气等监测系统独立运行模式，实现多能耦合与协同，而非独立运行再汇总数据。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751873", "t": 3, "q": "能源系统运行监测中，监测数据的准确性仅取决于监测仪表的精度，与数据传输过程无关。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "监测数据准确性不仅取决于监测仪表精度，数据传输过程中可能出现信号干扰、数据丢失等问题，也会影响数据准确性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751874", "t": 3, "q": "能源系统运行监测中，仅需采集能源消耗数据，无需采集能源转换过程数据即可评估系统能效。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "评估能源系统能效，能源消耗数据和能源转换过程数据都很重要，只采集能源消耗数据无法全面评估，因为能源转换过程会影响最终能效。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751875", "t": 3, "q": "能源系统运行监测中，数据传输的实时性要求越高，对通信网络的带宽要求越低。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数据传输实时性要求高，意味着要在短时间内快速传输大量数据，这就需要通信网络有更高的带宽来保障，所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751876", "t": 3, "q": "能源系统运行统计中，\"能源消费量\"等于\"外购能源量\"减去\"外销能源量\"再加上\"回收利用能源量\"。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751877", "t": 3, "q": "能源系统运行诊断中，电机负载率越高，其运行效率一定越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "电机负载率与运行效率并非简单的正相关关系，负载率过高或过低都会使效率降低，存在一个使电机运行效率最高的负载率区间。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751878", "t": 3, "q": "能源系统运行诊断中，故障树分析法（FTA）可用于定性分析故障原因，也可用于定量计算故障发生的概率。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "故障树分析法既能对故障原因进行定性分析，找出导致故障发生的各种可能因素；也能开展定量计算，得出故障发生的概率。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751879", "t": 3, "q": "能源系统运行诊断中，能量平衡分析法若发现输入能量大于输出能量，说明系统存在能源损耗，该损耗一定是由设备故障导致的。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "输入能量大于输出能量确实表明系统有能源损耗，但损耗原因多样，不只是设备故障，还可能有散热、泄漏等其他因素。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751880", "t": 3, "q": "能源系统运行诊断中，趋势分析法若发现某参数的变化趋势呈持续上升且超出允许范围，说明该参数对应的设备即将发生故障，需立即停机检修。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "仅参数持续上升且超出允许范围，不能直接判定设备即将故障并需立即停机检修，可能有多种原因导致参数异常，需综合评估。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751881", "t": 3, "q": "能源系统运行诊断中，若某锅炉实际排烟温度比设计值高50℃，则其热效率必然下降。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "排烟温度升高会使排烟热损失增大，而排烟热损失是影响锅炉热效率的重要因素，排烟热损失增大，锅炉热效率必然下降。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751882", "t": 3, "q": "能源系统运行诊断中，若系统所有设备的性能指标均在合格范围内，则系统的整体运行能效一定处于最优状态。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统整体运行能效受设备性能、设备间匹配、运行管理等多因素影响，设备性能指标合格不代表整体运行能效最优。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751883", "t": 3, "q": "在能源系统运行诊断中，性能指标对比法若发现系统实际运行指标低于设计额定指标，说明系统运行存在问题，需要进行优化调整。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "设计额定指标是系统正常良好运行应达到的标准，实际运行指标低于它，意味着系统未达理想状态，大概率存在问题，通常需优化调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751884", "t": 3, "q": "能源系统运行诊断中，主成分分析法可将多个相关的监测参数转化为少数几个不相关的主成分，从而简化诊断过程。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "主成分分析就是把多个相关监测参数通过线性变换转化为少数几个不相关主成分，能有效减少数据维度，简化诊断过程。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751885", "t": 3, "q": "能源系统运行中，\"负荷率\"越高，能源系统的运行效率越高，因此应尽可能提高负荷率，避免低负荷运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751886", "t": 3, "q": "能源系统运行中，\"紧急停机\"后需立即重启设备，以减少能源供应中断时间。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“紧急停机”往往意味着设备出现了严重问题或处于危险状态，立即重启可能会引发更严重的故障或安全事故，应先排查故障、进行检修等，而不是立即重启。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751887", "t": 3, "q": "能源系统诊断中，“基准能耗”通常选择行业平均水平，若项目实际能耗低于行业平均水平，则无节能潜力。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "即便项目实际能耗低于行业平均水平，也不意味着无节能潜力，可能通过技术创新、管理优化等进一步节能。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751888", "t": 3, "q": "能源系统诊断中，“能流图分析法”仅能识别能源损失的位置，无法计算损失的具体数值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "能流图分析法不仅能识别能源损失的位置，还可计算损失的具体数值。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751889", "t": 3, "q": "能源系统诊断中，\"能平衡分析法\"的系统边界越大（如从车间扩大到全厂），诊断结果的准确性越高。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "系统边界扩大，会使系统内的情况更复杂，不确定因素增多，难以精确把握各环节能量关系，诊断结果准确性反而可能降低。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751890", "t": 3, "q": "区域综合能源系统规划设计中，储能系统容量配置越大，系统经济性与稳定性越好。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "储能系统容量配置并非越大越好。容量过大，建设和维护成本会大幅增加，影响经济性；且可能因容量冗余导致运行管理难度增大、效率降低等问题，不一定能提升稳定性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751891", "t": 3, "q": "区域综合能源系统规划中，能源站的选址应优先选择在能源负荷中心，以减少能源传输损耗。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "能源站建在能源负荷中心，能缩短能源传输距离，从而有效减少传输过程中的能量损耗，这是区域综合能源系统规划的基本要点。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751892", "t": 3, "q": "在能源系统运行监测中，为确保数据准确性，所有监测仪表的采样频率应设置为相同值。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "不同监测仪表有不同的监测对象和要求，其合适的采样频率会因具体情况而异，并非都要设置为相同值。所以该说法错误。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751893", "t": 3, "q": "智慧能源系统的\"边缘计算\"技术需依赖云端数据处理才能实现本地控制决策，无法独立运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "边缘计算技术的特点就是可在本地进行数据处理和决策，减少对云端的依赖，并非依赖云端才能实现本地控制决策，能独立运行。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751894", "t": 3, "q": "智慧能源系统的\"数字孪生\"技术可实现系统运行状态的实时映射，但无法预测未来运行趋势。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧能源系统的“数字孪生”技术不仅能实现系统运行状态的实时映射，还可通过对历史和实时数据的分析建模来预测未来运行趋势。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751895", "t": 3, "q": "智慧能源系统的\"数字孪生\"模型需与物理系统完全一致，任何微小的参数差异都会导致模型失效。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生模型并不需要与物理系统完全一致，它允许存在一定的参数差异，只要能反映物理系统的关键特征和运行规律，模型就可正常发挥作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751896", "t": 3, "q": "智慧能源系统的\"需求响应\"功能仅能通过降低用户负荷实现，无法通过提高分布式能源出力配合。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧能源系统的“需求响应”功能不仅能通过降低用户负荷实现，也可通过提高分布式能源出力配合来达成。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751897", "t": 3, "q": "智慧能源系统的\"自愈控制\"功能可完全替代人工操作，实现能源系统的无人值守运行。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧能源系统虽有“自愈控制”功能，但能源系统运行复杂，存在诸多特殊情况和不确定性，目前无法完全替代人工操作实现无人值守。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751898", "t": 3, "q": "智慧能源系统的需求响应功能仅能通过调整用户的用电负荷实现，无法调整用户的用热、用冷负荷。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧能源系统的需求响应功能不仅能调整用电负荷，也可对用户的用热、用冷负荷进行调整。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751899", "t": 3, "q": "智慧能源系统的自动化控制可完全替代人工操作，无需人员干预。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧能源系统虽有自动化控制能力，但在复杂情况、异常状况等时仍需人工干预，不能完全替代人工。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751900", "t": 3, "q": "智慧能源系统中，双向通信技术仅用于电网向用户发布电价信号，无法实现用户向电网反馈负荷信息。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "双向通信技术意味着信息能双向传递，在智慧能源系统里，不仅电网可向用户发布电价信号，用户也能向电网反馈负荷信息。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751901", "t": 3, "q": "智慧能源系统中的\"大数据分析技术\"主要用于处理结构化数据（如设备运行参数），无法处理非结构化数据（如设备故障图片、运维记录）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "大数据分析技术既能处理结构化数据，也能处理非结构化数据，题中说无法处理非结构化数据错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751902", "t": 3, "q": "智慧能源系统中的\"区块链技术\"主要用于能源交易，通过去中心化特性保障交易的透明与安全。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "区块链具有去中心化、不可篡改等特性，在智慧能源系统里能用于能源交易，可保障交易透明与安全。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751903", "t": 3, "q": "智慧能源系统中的\"需求响应\"仅适用于居民用户，工业用户因用能刚性大，无法参与需求响应。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "需求响应并非仅适用于居民用户，工业用户虽用能有一定刚性，但也可通过调整生产计划、设备运行等方式参与需求响应。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751904", "t": 3, "q": "智慧能源系统中的大数据分析，其数据来源仅包括能源系统的运行监测数据，不包括外部数据（如天气、经济数据）。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧能源系统的大数据分析，数据来源不仅有能源系统运行监测数据，还会包含外部数据如天气、经济数据等，这些外部数据对能源系统分析和决策有重要作用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751905", "t": 3, "q": "智慧能源系统中的数字孪生技术，可实现对实体能源系统的实时模拟，但无法进行未来运行状态的预测。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "数字孪生技术不仅能对实体能源系统进行实时模拟，还可借助数据和模型对未来运行状态进行预测。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360060751906", "t": 3, "q": "智慧能源系统中的需求响应，按触发方式可分为价格型需求响应（如峰谷电价）和激励型需求响应（如补贴），两者不可同时采用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "智慧能源系统中价格型需求响应和激励型需求响应是可以同时采用的，并非不可同时采用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946176", "t": 3, "q": "智慧能源系统中的AI算法，在负荷预测中的预测精度不会受训练数据质量的影响，仅取决于算法本身的复杂度。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "训练数据质量对AI算法在负荷预测中的预测精度影响很大，若数据存在错误、不完整等问题，即便算法复杂，也难以保证高精度，所以该说法错误。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946177", "t": 3, "q": "综合能源系统的\"多能互补\"功能可完全消除可再生能源出力的随机性，实现能源供应的绝对稳定。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "综合能源系统的“多能互补”虽能在一定程度上降低可再生能源出力随机性的影响，但无法完全消除，更不能实现能源供应的绝对稳定。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946178", "t": 3, "q": "综合能源系统的\"多能互补\"可完全消除可再生能源出力的间歇性与波动性。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "可再生能源的间歇性与波动性受自然条件等多种复杂因素影响，即便综合能源系统“多能互补”可在一定程度上缓解，但无法做到完全消除。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946179", "t": 3, "q": "综合能源系统的\"能源利用效率\"是系统内各设备效率的平均值，通过将各设备效率相加后除以设备数量计算得出。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "综合能源系统的能源利用效率不是系统内各设备效率的简单平均值，它是衡量整个系统能源综合利用效果的指标，计算方式要考虑系统输入输出等多方面因素，并非各设备效率相加除以设备数量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946180", "t": 3, "q": "综合能源系统中，“电-热-冷”多能耦合的核心是通过能源集线器（Energy Hub）实现不同能源的转换与分配。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "能源集线器是综合能源系统中实现“电 - 热 - 冷”多能耦合的关键部件，可对不同能源进行转换与分配。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946181", "t": 3, "q": "综合能源系统中，“电-热耦合”可实现电能向热能的转换，但无法实现热能向电能的转换。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "在综合能源系统里，“电 - 热耦合”既能实现电能向热能的转换，也能通过热电联产等技术实现热能向电能的转换。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946182", "t": 3, "q": "综合能源系统中，\"能源存储设备\"的容量越大，系统的灵活性越高，因此应无限增大存储容量。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。虽然能源存储设备容量增大能提升系统灵活性，但无限增大存储容量会带来成本大幅增加、占用大量空间、维护难度加大等诸多问题，在实际应用中需综合考虑多方面因素来确定合理的存储容量，并非越大越好。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946183", "t": 3, "q": "综合能源系统中，\"能源路由器\"可实现不同能源介质（如电、热、气）的直接转换，无需依赖其他能源转换设备。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "能源路由器虽能对不同能源进行管理和调配，但它不能直接实现不同能源介质的转换，仍需依赖其他能源转换设备。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946184", "t": 3, "q": "综合能源系统中，“以电定热”运行模式下，储热设备的主要作用是存储电能，而非热能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "“以电定热”模式下，储热设备主要是存储热能，用于调节热负荷，而非存储电能。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946185", "t": 3, "q": "综合能源系统中，“源网荷储”协同控制的核心是通过控制“源”的出力，来满足“荷”的需求，“网”和“储”仅起辅助作用。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "这种说法错误。在“源网荷储”协同控制中，源、网、荷、储各环节相互影响、缺一不可，并非“网”和“储”仅起辅助作用。它们需整体协同互动、灵活调控，共同保障能源系统的稳定运行与高效利用。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946186", "t": 3, "q": "综合能源系统中，储能系统的容量越大，对可再生能源的消纳能力越强，因此储能容量应尽可能大。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "虽然储能容量大利于可再生能源消纳，但储能容量增大意味着投资成本增加、维护管理难度上升等，并非越大越好，要综合考虑多方面因素来合理确定储能容量。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946187", "t": 3, "q": "综合能源系统中，电制冷机组与吸收式制冷机组的切换，主要依据电网电价与燃气价格的对比，电价高时优先使用吸收式制冷。", "a": ["正确", "错误", "", "", "", ""], "r": "A", "e": "电制冷机组用电，吸收式制冷机组用燃气，当电价高时，使用吸收式制冷成本相对低，所以会优先用吸收式制冷。", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946188", "t": 3, "q": "综合能源系统中，可再生能源发电出力的波动性可通过增加电网的备用容量完全消除。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "可再生能源发电出力的波动性受自然条件等多种复杂因素影响，具有很强的不确定性和随机性，增加电网备用容量虽能缓解部分问题，但无法完全消除其波动性。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946189", "t": 3, "q": "综合能源系统中，冷热电三联供（CCHP）系统在任何运行工况下，其能源利用效率都高于传统分供系统。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "CCHP系统并非在任何运行工况下能源利用效率都高于传统分供系统，其效率受多种因素如负荷匹配、设备性能、运行管理等影响。 ", "ap": [false, false, false, false, false, false]}, {"id": "2034800360064946190", "t": 3, "q": "综合智慧能源系统必须包含可再生能源（如风电、光伏），否则无法实现\"多能互补\"功能。", "a": ["正确", "错误", "", "", "", ""], "r": "B", "e": "多能互补不局限于可再生能源，传统能源和不同类型传统能源之间、传统能源与可再生能源等搭配都能实现多能互补，所以综合智慧能源系统不必须包含可再生能源来实现多能互补。 ", "ap": [false, false, false, false, false, false]}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = !!ans;
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>` : '';

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || S.ans[q.id]) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
</html>
