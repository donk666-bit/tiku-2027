, "l4": "定义判断"}, {"id": "18caf5c42910e72axcyjsc440327", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">①员工一般通过深层扮演和表层扮演这两种方式来实现情绪劳动<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">②情绪劳动是指员工为了给顾客提供更为优质的服务而表达出组织所需情绪的行为<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">③此时员工的情绪体验并没有改变，改变的只是对其服务对象的情绪表达<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">④从本质上来说，深层扮演是员工改变自己情绪体验的过程<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑤情绪劳动对组织而言有更多的积极效应，对员工个人来说则消极影响更多<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">⑥表层扮演是员工通过掩饰、夸大或抑制等方式来调整自己的情绪表达<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">将以上<\/font> <font face=\"Times New Roman\">6 <\/font><font face=\"宋体\">个句子重新排列，语序正确的是：（ &nbsp;&nbsp;）<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">②③①④⑥⑤<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">②①④⑥③⑤<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">⑤②③①④⑥<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">⑤①④⑥②③<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>B<font face=\"宋体\">【解析】文段主要围绕<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">情绪劳动<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">展开，<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">是什么<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">一般放在段首，故关于<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">情绪劳动<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">定义的<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">句应为首句，排除<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><font face=\"Times New Roman\">③<\/font><font face=\"宋体\">句由<\/font><font face=\"Times New Roman\">“<\/font><font face=\"宋体\">此时<\/font><font face=\"Times New Roman\">”<\/font><font face=\"宋体\">开头，前文应有相关内容，放在<\/font><font face=\"Times New Roman\">②<\/font><font face=\"宋体\">句后则无法衔接，排除<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf5c42901a4ebxcdysc677121", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">归因，即归结行为的原因，指根据有关的外部信息或线索对人的内心状态或外部行为表现推测原因的过程。如果将行为归因于人格、动机、情绪以及努力程度等这些个人特征，称之为内归因；如果将行为归因于机遇、他人影响、工作任务难度等外部条件，称之为外归因或情境归因。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">以下关于归因的判断，正确的是（）。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">这次英语考试小王没考及格，他垂头丧气地说：“我天生就不是学习的那块料。”这属于内归因<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">小孙用一曲《满江红》在校园才艺大赛中一举夺魁，接受采访时说：“这首歌我练习了好久，付出真的会有回报！”这属于外归因<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">小云对自己的丈夫非常不满意，婚后冲突不断，逢人就说：“我真是太倒霉了，遇上他这样的人间极品。”这属于内归因<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">小菲参加明星选秀落败而归，心里特别遗憾，回到家却跟父母说：“我觉得这个事情特别不靠谱，我主动放弃比赛了。”这属于外归因<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>A<font face=\"宋体\">【解析】归因定义的关键信息：根据有关的外部信息或线索对人的内心状态或外部行为表现推测原因的过程。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">内归因定义的关键信息：将行为归因于人格、动机、情绪以及努力程度等个人特征。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">外归因定义的关键信息：将行为归因于机遇、他人影响、工作任务难度等外部条件。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">小王将考试不及格归因于自己没有天赋，天赋属于个人特征范畴，符合内归因定义，判断正确。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">小孙将夺魁归因于勤奋练习，勤奋练习属于个人特征范畴，符合内归因定义而非外归因，判断错误。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C<font face=\"宋体\">项，小云将自己的霉运归因于自己的丈夫，他人影响属于外部条件范畴，符合外归因定义而非内归因，判断错误。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D<font face=\"宋体\">项，小菲参加明星选秀落败，却说是主动放弃了比赛，并没有对落败的结果进行原因推测，不属于归因，判断错误。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">故本题选<\/font>A<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "定义判断"}, {"id": "18caf5c42910e72axcyjsc018420", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">①近年来，人们对甜味零食、含糖饮料的需求越来越大，摄入的添加糖也与日俱增<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">②碳水化合物是一系列只由碳、氢、氧三种元素构成的物质，糖类就是种类繁多的碳水化合物中的一类<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">③许多食物（比如水果）中天然都含有糖，我们吃下这些含有糖类的食物后，可以吸收并释放能量，支持身体 的正常生命活动<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">④添加糖的形式很多，我们熟知的白砂糖、红糖、冰糖、糖浆都属于添加糖<\/font><span style=\"font-family:宋体;font- e-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">非遗公开课、非遗影像展等<\/font><font face=\"Times New Roman\">3700<\/font><font face=\"宋体\">多项活动在全国同步展开，<\/font><font face=\"Times New Roman\">400<\/font><font face=\"宋体\">多项体验传承活动在<\/font><font face=\"Times New Roman\">20<\/font><font face=\"宋体\">多个省（区、市）推出……刚刚过去的“文化和自然遗产日”系列精彩的活动让人们走近“养在深闺人未识”的文化遗产，感知岁月积淀的文化魅力，也让人们意识到，<\/font><font face=\"Times New Roman\">________________<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">填入画横线部分最恰当的一项是：（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">文化遗产保护为先，还需要社会公众的高度参与<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">文化遗产可以摆脱高冷的标签，飞入寻常百姓家<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">如何让文化遗产“活”起来也是值得思考的话题<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">我国能有如此丰富的文化遗产，得益于保护管理<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】横线处位于文段的尾句，由其前的“也让人们意识到”可知，所填句子应论述“文化和自然遗产日”活动对人们的文化遗产意识的改变。由“让人们走近‘养在深闺人未识’的文化遗产，感知岁月积淀的文化魅力”可知，“文化和自然遗产日”活动拉近了普通大众与文化遗产的距离，<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项“摆脱高冷的标签，飞入寻常百姓家”与此相符。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项的“文化遗产保护为先”、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项的“得益于保护管理”，文段均未提及，填入衔接不当，排除。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项，文段说的是让人们走近“养在深闺人未识”的文化遗产，而非如何让文化遗产“活”起来，排除。故本题选<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "语句表达"}, {"id": "18caf5c42910e729xcpdsc726477", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">研究表明，进入雷云的宇宙射线，使得雷云中的空气<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">产生电离，进而便在周围产生出许多悬浮的自由电子，已在云层中的电场，则使自由电子带有更高的能量。当空气中的现有电子和水分子碰撞时，释放出更多的电子，研究者将其称之为高能量微粒的雪暴，最终产生一次<\/font><font face=\"宋体\">“逃逸崩溃”，这种放电过程就是人们所认为的闪电。<\/font><span style=\"font-family:宋体;line-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">下列说法与原文不符的是：<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">闪电因宇宙射线而产生<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">雪暴放电过程产生闪电<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">闪电因云朵碰撞而产生<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">电子与水分子碰撞引起闪电<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】由首句<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">进入雷云的宇宙射线，使得<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">……<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">产生电离，进而<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">……<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">产生<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">……<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">最终产生<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">……”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">可知，<\/font>A<font face=\"宋体\">项正确。由<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">当空气中的现有电子和水分子碰撞时，释放出更多的电子，研究者将其称之为高能量微粒的雪暴，最终产生一次<\/font><font face=\"Times New Roman\">‘<\/font><font face=\"宋体\">逃逸崩溃<\/font><font face=\"Times New Roman\">’<\/font><font face=\"宋体\">，这种放电过程就是人们所认为的闪电<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">可知，<\/font>B<font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项正确。<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项无中生有，文中未提到云朵碰撞。故本题选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42901a4e9xctxsc562042", "t": "1", "q": "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">从所给的四个选项中，选择最合适的一个填入问号处，使之呈现一定规律性：<\/font><span style=\"font-family:宋体;color:rgb(51,51,51);\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <img width=\"452\" height=\"200\" src=\"https://idapic.luoyanedu.com/tiku/20260414180852_d04/5图形推理-题库文档410.png\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n \n &nbsp;", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">A.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">选<\/font><font face=\"Times New Roman\">B<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">C.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">选<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>D<font face=\"宋体\">【解析】第一组图形中，第一行、第三行黑色圆圈每次向右移动<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">格，第二行、第四行黑色圆圈每次向左移动<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">格，得到下一个图形。第二组图形中，第一行、第二行黑色圆圈每次向左移动<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">格，第三行、第四行黑色圆圈每次向右移动<\/font><font face=\"Times New Roman\">1<\/font><font face=\"宋体\">格，得到下一个图形。故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "图形推理"}, {"id": "18caf5c42901a4e8xcljsc778690", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">研究人员对平均年龄为<\/font><font face=\"Times New Roman\">66<\/font><font face=\"宋体\">岁的<\/font><font face=\"Times New Roman\">648<\/font><font face=\"宋体\">名痴呆症患者进行研究。发现掌握两种语言的患者罹患痴呆的时间比只掌握一种语言的患者晚大约四年半。研究人员因此认为掌握两种语言可以延缓痴呆的发生。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项如果为真，最能质疑上述结论？<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">很多人患上痴呆之后大脑的言语功能均出现显著下降<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">大脑认知功能好的人才会说双语，认知功能好可延缓痴呆<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">相当多的人只掌握一种语言，但一生都未出现痴呆的症状<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">掌握三种或以上语言的人，痴呆发生时间比掌握两种语言的稍晚<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】题干中的观点是：掌握两种语言可以延缓痴呆的发生。<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项指出认知功能好才能掌握两种语言，即本质上延缓痴呆发生的是良好的认知功能，属于另有他因，有力地质疑了研究人员的观点。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">两项为无关项，<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项只是说掌握一种语言的人，力度较弱。故答案为<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf5c42901a4e8xcljsc549058", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">某市实体零售店的数量由<\/font>2013<font face=\"宋体\">年的<\/font><font face=\"Times New Roman\">3800<\/font><font face=\"宋体\">家，增加到了<\/font><font face=\"Times New Roman\">2017<\/font><font face=\"宋体\">年的<\/font><font face=\"Times New Roman\">4500<\/font><font face=\"宋体\">家。但这几年来，该市实体零售店的销售额在整个零售业中所占的比例并没有增加，反而有所下降。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">以下哪项为真，最不能解释上述现象？<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">这几年来该市实体零售店的整体销售额显著下降<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">这几年来该市非实体零售店的整体销售额迅速增加<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">这几年来该市零售业的整体销售额有了大幅度的提升<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">这几年来该市非实体零售店数量的增长速度快于实体零售店<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "D", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">【解析】题干中的矛盾是实体零售店的数量增加，而销售额占整个零售业的比例却不升反降。由于实体零售店销售额占整个零售业的比例＝实体零售店销售额<\/font><font face=\"Times New Roman\">/<\/font><font face=\"宋体\">整个零售业销售额＝实体零售店销售额<\/font><font face=\"Times New Roman\">/<\/font><font face=\"宋体\">（实体零售店销售额＋非实体零售店销售额），<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项指出分子减少，<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">、<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">两项指出分母增加，均能解释该比例不升反降的现象；<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项是说零售店的数量，不涉及销售额，为无关项。故本题选<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;color:rgb(0,0,0);font-size:10.5000pt;\">", "l3": "行测", "l4": "逻辑判断"}, {"id": "18caf5c42910e729xcpdsc549058", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">城市减灾没有终止点，恰恰是减灾驱策着一座城市不断夯实功能，深挖基础。即使在发达国家的城市，一场风暴、一场大雪、一次大雨使城市困扰或瘫痪也是不时发生的。人们交口称赞的巴黎<\/font><font face=\"宋体\">“地下宫殿”，在近日法国遭遇的强降雨天气中，也显现出疲惫，包括巴黎在内的中央大区和大巴黎地区等<\/font><font face=\"Times New Roman\">19<\/font><font face=\"宋体\">个省发生了洪水灾害。由此可见，“下水道良心”如巴黎，同样面临自身的问题，自然灾害面前，城市建设有与时俱进的课题。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">给这段文字加上标题，最恰当的一项是：<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">城市发展是漫长的建设过程<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">发展仍是城市建设的一项中心工作<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">城市减灾是长久课题<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">城市减灾的疑难杂症<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New R \"><font face=\"宋体\">没有终止点<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">与时俱进的课题<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">的同义转述。故本题选<\/font>C<font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42910e729xcpdsc126848", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">中华文化在数千年的历史演变中之所以始终保持强劲的生命力，就在于中华文化既具有鲜明的文化特征，同时，善于吸收不同名族、不同国家、不同地区的相关文化因子，作为改善自身文化机制，培养文化自信能力的有机元素。这就是为什么古巴比伦文化，古印度文化相继消亡，而中国文化却历数千年经久不衰并不断开新继而创造新的文明奇迹的奥妙所在。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">\n <span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">这段文字主要说明了：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">（）。<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">A.<\/font><font face=\"宋体\">只有不断改善自身文化机制才能经久不衰<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">中华文化始终保持强劲生命力的关键<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">古巴比伦文化的消失源于缺乏鲜明的民族特征<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">中华民族要善于吸收不同民族、国家和地区的相关文化<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】这段文字主要讲述的关于中华文化的生命力问题<\/font><font face=\"Times New Roman\">,<\/font><font face=\"宋体\">开篇明义<\/font><font face=\"Times New Roman\">,<\/font><font face=\"宋体\">告诉我们中华文化能够保有自身就在于其生命力<\/font><font face=\"Times New Roman\">,<\/font><font face=\"宋体\">并且讲了如何保有生命力<\/font><font face=\"Times New Roman\">--<\/font><font face=\"宋体\">鲜明的文化特征和善于借鉴。最后通过于古巴比伦和古印度比较<\/font><font face=\"Times New Roman\">,<\/font><font face=\"宋体\">突出我们中华文化始终拥有生命力<\/font><font face=\"Times New Roman\">,<\/font><font face=\"宋体\">所以只有<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">满足条件。这个文段先提出一个观点<\/font><font face=\"Times New Roman\">,<\/font><font face=\"宋体\">随后通过具体的讲述<\/font><font face=\"Times New Roman\">,<\/font><font face=\"宋体\">来证明我们的生命力体现在哪里<\/font><font face=\"Times New Roman\">,<\/font><font face=\"宋体\">这是总分文段的第一种行文。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42901a4eaxclbsc643766", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">门可罗雀：无人问津<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">大相径庭：不相上下<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">众说纷纭：异口同声<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">指鹿为马：张冠李戴<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">发人深省：执迷不悟<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】门可罗雀和无人问津是近义关系。<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项中大相径庭和不相上下是反义关系；<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">项中众说纷纭和异口同声是反义关系；<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">项中指鹿为马和张冠李戴是近义关系；<\/font><font face=\"Times New Roman\">D<\/font><font face=\"宋体\">项中发人深省和执迷不悟是反义关系。故本题选<\/font><font face=\"Times New Roman\">C<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "行测", "l4": "类比推理"}, {"id": "18caf5c428e32068atsc967505", "t": "1", "q": "<span style=\"font-family:'Times New Roman';font-size:12.0000pt;\"><span style=\"font-family:'Times New Roman';\r\ncolor:rgb(0,0,0);font-size:10.5000pt;\">2.4<font face=\"宋体\">，<\/font><font face=\"Times New Roman\">1.3<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">3.12<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">7.35<\/font><font face=\"宋体\">，<\/font><font face=\"Times New Roman\">9.54<\/font><font face=\"宋体\">，<\/font><span style=\"font-family:宋体;color:rgb(0,0,0);font-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）< e:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">B.<\/font><font face=\"宋体\">快乐的好处<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">C.<\/font><font face=\"宋体\">快乐的差别<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\"><font face=\"Times New Roman\">D.<\/font><font face=\"宋体\">说快乐<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "A", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">【解析】文段首句指出快乐是大家很熟悉的。接着通过“但是”进行转折，指出快乐有不同层次、不同性质，有种种前提，效果和程度也千差万别。最后进行总结，指出“快乐”是一个极其复杂的问题。由此可见，文段主要介绍的是快乐的复杂性，<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">项最能概括文段主旨意，故答案选<\/font><font face=\"Times New Roman\">A<\/font><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\">", "l3": "行测", "l4": "片段阅读"}, {"id": "18caf5c42910e72axcyjsc102801", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">中国的茶、饮茶方式、斗茶风气，茶具等传入日本后，逐渐与日本本土文化相结合，到了<\/font>16<font face=\"宋体\">世纪，形成了日本独特的茶文化<\/font><font face=\"Times New Roman\">——<\/font><font face=\"宋体\">茶道。<\/font><u><span style=\"font-family:宋体;line-height:150%;\r\ntext-decoration:underline;text-underline:single;font-size:10.5000pt;\">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<\/u><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">。不过，日本茶道实际上是中日文化交流的结晶，如果没有中国茶树及茶文化的引入，茶道这个日本的国粹也就无从谈起了。<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">\n <span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\"><font face=\"宋体\">填入画横线部分最恰当的一句是：<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">A.<font face=\"宋体\">日本原先既无茶树，也没有饮茶的习惯<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">B.<font face=\"宋体\">现代日本茶道中所用的抹茶，最初就是从中国引入的<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">C.<font face=\"宋体\">日本茶道数百年来持续发展，已经成为日本文化的一个象征<\/font><span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nline-height:150%;font-size:10.5000pt;\">D.<font face=\"宋体\">唐代，大批日本使节来到中国学习，并把中国文化带回日本<\/font><span style=\"font-family:宋体;line-height:150%;\r\nfont-size:10.5000pt;\">", "", ""], "r": "C", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font>C<font face=\"宋体\">【解析】空缺处句子位于句中，应起到承上启下的作用。前文主要论述了中国的茶文化传人日本后形成了日本的茶道，后文以<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">“<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">不过<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">”<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">转折指出日本茶道实际上是中日文化交流的结晶。空缺处句子应承接前文<\/font><span style=\"font-family:宋体;font-size:10.5000pt;\"><font f :宋体;font-size:10.5000pt;\"><font face=\"宋体\">性和<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">破坏性<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">B.<font face=\"宋体\">计算机病毒可通过网络传播<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"Times New Roman\">C<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">.<font face=\"宋体\">安装杀毒软件可以完全防止计算机感染病毒<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">D.<font face=\"宋体\">计算机病毒是一种生物病毒<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "ABD", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">ABD<\/font><font face=\"宋体\">【解析】<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\"><font face=\"宋体\">计算机病毒具有传染性，能够自我复制并传播到其他计算机；具有破坏性，会影响计算机系统的正常运行，损坏数据等。网络是计算机病毒传播的重要途径之一。安装杀毒软件可以在很大程度上预防和查杀病毒，但由于新病毒不断出现，不能保证完全防止计算机感染病毒。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础第4章"}, {"id": "189cad19084d1ba0jsjsc799284", "t": "1", "q": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">在操作系统的五大管理功能中，负责将逻辑地址转换为物理地址的是<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">（<\/font> &nbsp;&nbsp;<font face=\"宋体\">）<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\"><font face=\"宋体\">。<\/font><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\">", "a": ["<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">A.<font face=\"宋体\">处理机管理<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">B.<font face=\"宋体\">存储器管理<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">C.<font face=\"宋体\">设备管理<\/font><span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">", "<span style=\"font-family:'Times New Roman';\r\nfont-weight:normal;font-size:10.5000pt;\">D.<font face=\"宋体\">文件管理<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "", ""], "r": "B", "e": "<span style=\"font-family:Calibri;font-size:10.5000pt;\"><span style=\"font-family:宋体;font-weight:normal;\r\nfont-size:10.5000pt;\"><font face=\"宋体\">【答案】<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">【解析】存储器管理功能主要包括内存分配、内存保护、地址映射和内存扩充四个方面。其中，地址映射是指将程序使用的逻辑地址（虚拟地址）转换为内存物理地址的过程，这是存储器管理的核心任务之一。处理机管理主要负责进程的创建、撤销、调度和同步等，与地址转换无关。设备管理负责缓冲管理、设备分配、设备处理等。文件管理负责文件的存储空间管理、目录管理、读写管理及共享保护等。因此，只有选项<\/font><font face=\"Times New Roman\">B<\/font><font face=\"宋体\">正确。<\/font><span style=\"font-family:'Times New Roman';\r\nfont-size:10.5000pt;\">", "l3": "计算机", "l4": "2027国网计算机基础强化题库"}]}]};

const KEY = 'ly:' + DATA.id;
const store = {
  load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {} } catch(e){ return {} } },
  save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)) } catch(e){} }
};
let S = store.load();
S.wrong = S.wrong || {}; S.collect = S.collect || {}; S.pos = S.pos || {};
S.ans = S.ans || {}; S.stats = S.stats || {r:0,w:0};
store.save(S);

const $ = id => document.getElementById(id);
const app = $('app'), hTitle = $('hTitle'), backBtn = $('back'), starBtn = $('star');
let sess = null;   // {list, idx, mode, key}

function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1400); }
function allQ(){ return DATA.chapters.flatMap(c=>c.qs); }
function chapterWrongCount(c){ return c.qs.filter(q=>S.wrong[q.id]).length; }
function chapterDone(c){ const p=S.pos[c.k]; return p==null?0:Math.min(p,c.qs.length); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderHome(){
  sess = null; backBtn.style.display='none'; starBtn.style.display='none';
  hTitle.textContent = DATA.name;
  const total = allQ().length, wrongN = Object.keys(S.wrong).length, colN = Object.keys(S.collect).length;
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${total}</b><span>总题量</span></div>
      <div class="stat"><b style="color:var(--ok)">${S.stats.r}</b><span>答对</span></div>
      <div class="stat"><b style="color:var(--bad)">${S.stats.w}</b><span>答错</span></div>
      <div class="stat"><b style="color:#ffb020">${wrongN}</b><span>错题</span></div>
    </div>
    <div class="modes">
      <button onclick="startAll()">顺序练习</button>
      <button onclick="startRandom()">随机练习</button>
      <button class="warn" onclick="startWrong()">错题本<em class="pill">${wrongN}</em></button>
      <button onclick="startCollect()">收藏<em class="pill">${colN}</em></button>
    </div>
    <div class="card">
      ${DATA.chapters.map((c,i)=>{
        const done = chapterDone(c), pct = c.qs.length? Math.round(done/c.qs.length*100):0;
        return `<div class="ch" onclick="startChapter(${i})">
          <div class="t"><b>${esc(c.n)}</b><span>${c.qs.length} 题 · 错题 ${chapterWrongCount(c)} · 已做 ${done}</span>
          <div class="bar"><i style="width:${pct}%"></i></div></div>
          <div style="color:var(--sub)">›</div>
        </div>`;
      }).join('')}
    </div>`;
  window.scrollTo(0,0);
}

function begin(list, mode, key){
  if(!list.length){ toast('这里还没有题目'); return; }
  sess = {list, idx:0, mode, key, done:{}};
  backBtn.style.display=''; starBtn.style.display='';
  showQ();
}

/* 错题本/收藏：允许重新作答（不受历史作答记录限制） */
function redoMode(){ return sess && (sess.mode==='wrong' || sess.mode==='collect'); }
function isAnswered(){
  const q = sess.list[sess.idx];
  if(!q) return true;
  if(sess.done && sess.done[q.id]) return true;
  return !!S.ans[q.id] && !redoMode();
}
function redoQ(){
  const q = sess.list[sess.idx]; if(!q) return;
  delete S.ans[q.id];
  if(sess.done) delete sess.done[q.id];
  delete draft[q.id];
  store.save(S); showQ();
}

function startChapter(i){
  const c = DATA.chapters[i];
  const pos = S.pos[c.k] || 0;
  begin(c.qs.slice(), 'chapter', c.k);
  sess.idx = Math.min(pos, c.qs.length-1);
  showQ();
}
function startAll(){ begin(allQ(), 'all', 'ALL'); }
function startRandom(){ begin(allQ().sort(()=>Math.random()-0.5), 'random', 'RND'); }
function startWrong(){
  const list = allQ().filter(q=>S.wrong[q.id]);
  list.sort((a,b)=>(S.wrong[b.id].n||0)-(S.wrong[a.id].n||0));
  begin(list, 'wrong', 'WRONG');
}
function startCollect(){ begin(allQ().filter(q=>S.collect[q.id]), 'collect', 'COL'); }

const TYPE_NAME = {1:'单选', 2:'多选', 3:'判断'};
function typeOf(q){ return TYPE_NAME[q.t] || '单选'; }
function isMulti(q){ return q.t === 2; }
let draft = {};          // 多选题暂存：qid -> [选项字母]

function sameSet(a, b){
  const x = (a||'').split('').filter(Boolean).sort().join('');
  const y = (b||'').split('').filter(Boolean).sort().join('');
  return !!x && x === y;
}

function grade(q, answer){
  const ok = sameSet(answer, q.r);
  S.ans[q.id] = {a: answer, ok};
  let rec = S.wrong[q.id];
  if(ok){
    S.stats.r++;
    if(rec){ rec.s = (rec.s||0)+1; if(rec.s >= 2){ delete S.wrong[q.id]; toast('已掌握，移出错题本'); } }
  } else {
    S.stats.w++;
    if(!rec) rec = S.wrong[q.id] = {n:0,s:0};
    rec.n = (rec.n||0)+1; rec.s = 0; rec.ts = Date.now();
  }
  delete draft[q.id];
  if(sess && sess.done) sess.done[q.id] = true;
  store.save(S);
  showQ();
}

function showQ(){
  const q = sess.list[sess.idx];
  if(!q){ renderHome(); return; }
  if(sess.mode==='chapter' || sess.mode==='all') S.pos[sess.key] = sess.idx;
  const ans = S.ans[q.id];
  const answered = isAnswered();
  const multi = isMulti(q);
  const sel = draft[q.id] || [];
  const star = !!S.collect[q.id];
  starBtn.classList.toggle('on', star);
  hTitle.textContent = `${DATA.name} · ${sess.idx+1}/${sess.list.length}`;

  const opts = q.a.map((a, i)=>{
    const L = 'ABCDEF'[i];
    if(!a || !a.replace(/<[^>]+>/g,'').trim() && !/img/i.test(a)) return '';
    let cls = 'opt';
    if(answered){
      if((q.r||'').includes(L)) cls += ' right';
      else if((ans.a||'').includes(L)) cls += ' wrong';
    } else if(multi && sel.includes(L)) cls += ' sel';
    return `<button class="${cls}" onclick="pick('${L}')">
      <span class="lab">${q.ap[i] ? '' : L}</span>
      <span class="cnt">${a}</span>
    </button>`;
  }).join('');

  const hint = multi && !answered
    ? `<div class="hint">多选题：可选多个，选好后点「提交答案」（当前已选 ${sel.length} 项）</div>`
    : (redoMode() && ans && !answered ? `<div class="hint">重做模式：答错留在本里，连续答对 2 次自动移出</div>` : '');

  app.innerHTML = `
    <div class="card">
      <div class="qhead"><span><em class="tag t${q.t}">${typeOf(q)}</em>${esc(q.l4 || q.l3)}</span></div>
      <div class="title">${q.q}</div>
      ${opts}
      ${hint}
      <div class="ana" id="ana" style="${answered?'display:block':''}">
        <div><b>正确答案：${q.r || '—'}</b>${answered?`　<span style="color:${ans.ok?'var(--ok)':'var(--bad)'}">我的答案：${ans.a || '—'}</span>`:''}</div>
        ${q.e?`<div style="margin-top:8px">解析：${q.e}</div>`:''}
      </div>
      ${multi && !answered ? `<button class="btn primary wide" onclick="submitMulti()" ${sel.length?'':'disabled style="opacity:.45"'} >提交答案</button>` : ''}
      ${answered ? `<button class="btn wide" onclick="redoQ()">重做本题</button>` : ''}
      <div class="nav">
        <button class="btn" onclick="prevQ()" ${sess.idx===0?'disabled style="opacity:.5"':''}>上一题</button>
        <button class="btn primary" onclick="nextQ()">${sess.idx===sess.list.length-1?'完成':'下一题'}</button>
      </div>
    </div>`;
  window.scrollTo(0,0);
}

function pick(L){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  if(isMulti(q)){
    const cur = (draft[q.id] || []).slice();
    const i = cur.indexOf(L);
    if(i >= 0) cur.splice(i,1); else cur.push(L);
    draft[q.id] = cur.sort();
    showQ();
    return;
  }
  grade(q, L);
}

function submitMulti(){
  const q = sess.list[sess.idx];
  if(!q || isAnswered()) return;
  const sel = (draft[q.id] || []).slice().sort().join('');
  if(!sel){ toast('先选至少一个选项'); return; }
  grade(q, sel);
}
function prevQ(){ if(sess.idx>0){ sess.idx--; showQ(); } }
function nextQ(){
  if(sess.idx < sess.list.length-1){ sess.idx++; showQ(); }
  else { toast('这一组做完了'); renderHome(); }
}
function toggleStar(){
  const q = sess.list[sess.idx]; if(!q) return;
  if(S.collect[q.id]) delete S.collect[q.id]; else S.collect[q.id] = true;
  store.save(S); showQ();
}

backBtn.onclick = renderHome;
starBtn.onclick = toggleStar;

/* 支持 ?chapter=0 直接进章节 */
const m = location.search.match(/chapter=(\d+)/);
if(m) startChapter(+m[1]); else renderHome();
</script>
</body>
